id: MRK.4.12
reference: Mark 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: vi
  text: để họ tuy nhìn mà vẫn không nhận ra[a], tuy nghe mà vẫn không hiểu[b], kẻo họ quay lại[c] và được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không nhận biết” hoặc “không phân biệt.”'
    reason: lexical_alternative
  - marker: b
    text: Chúa Giê-su đang vọng lại Ê-sai 6:9–10, giữ nguyên sự căng thẳng giữa sự phán xét của Đức Chúa Trời và việc dân chúng không đáp ứng.
    reason: cross_reference
  - marker: c
    text: “Quay lại” cũng có thể dịch là “trở về” hoặc, trong ngữ cảnh này, “ăn năn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ sắc thái mục đích/kết quả của liên từ Hy Lạp một cách tự nhiên, không làm nhẹ đi sự căng thẳng của câu.
- source_word: βλέποντες βλέπωσι
  choice: họ nhìn thì cứ nhìn
  rationale: Giữ phép lặp nhấn mạnh và nghịch lý giữa hành vi nhìn với việc thật sự nhận biết.
- source_word: ἴδωσιν
  choice: nhận ra
  rationale: Phân biệt với βλέπω và diễn đạt việc thấy theo nghĩa tri nhận; “nhận biết” cũng là một khả năng.[a]
- source_word: ἀκούοντες ἀκούωσι
  choice: nghe thì cứ nghe
  rationale: Giữ cấu trúc lặp song song với vế nói về nhìn và âm hưởng của Ê-sai.
- source_word: συνιῶσιν
  choice: hiểu
  rationale: Cách dịch rõ ràng, thông dụng cho sự lĩnh hội bằng trí hiểu.
- source_word: μήποτε
  choice: kẻo
  rationale: Bảo toàn sắc thái phủ định mang tính dự liệu trong một cách nói ngắn gọn, trang trọng.
- source_word: ἐπιστρέψωσιν
  choice: quay trở lại
  rationale: Giữ hình ảnh quay lại/trở về của động từ, không chuyển thẳng thành thuật ngữ thần học “ăn năn”; sắc thái ấy được ghi chú.[c]
- source_word: ἀφεθῇ αὐτοῖς
  choice: được tha thứ
  rationale: Giữ thể bị động, thường được hiểu là thể bị động hàm ý Đức Chúa Trời hành động, đồng thời không thêm đối tượng bị tha ngoài điều bản văn nói.
theological_decisions:
- issue: Sắc thái mục đích/kết quả của lời vọng lại Ê-sai và hàm ý rằng các dụ ngôn ngăn người ta quay lại
  choice: Giữ “để ... kẻo ...” trong chính văn.
  alternative: Diễn giải nhẹ hơn thành “kết quả là ... nếu không thì họ có thể quay lại”.
  rationale: Bản Hy Lạp cố ý giữ sự căng thẳng giữa sự phán xét của Đức Chúa Trời và việc con người không đáp ứng; bản dịch không giải quyết thay cho độc giả.
- issue: Ý nghĩa của ἐπιστρέψωσιν đối với sự ăn năn
  choice: Dịch “quay trở lại” và nêu sắc thái “ăn năn” trong chú thích.
  alternative: Dịch trực tiếp là “ăn năn”.
  rationale: Động từ có thể mang hàm ý ăn năn trong bối cảnh ngôn sứ, nhưng nghĩa từ vựng rộng hơn một thuật ngữ thần học chuyên biệt.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “nhìn thì cứ nhìn ... nghe thì cứ nghe” giữ phép lặp nghịch lý của nguyên văn mà vẫn tự nhiên. Các dấu chú thích đều được đặt trong chính văn.
