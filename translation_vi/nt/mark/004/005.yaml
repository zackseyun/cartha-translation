  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: vi
  text: Một hạt khác rơi trên chỗ đất đá[a], nơi không có nhiều đất; nó lập tức mọc lên vì đất ở đó không sâu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỗ nhiều đá”. Từ Hy Lạp chỉ địa hình đá được phủ chỉ bởi một lớp đất mỏng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: một số hạt khác
  rationale: Tính từ trung tính số ít được dùng như danh từ và ngầm chỉ hạt giống theo văn cảnh. Tiếng Việt cần nêu rõ “hạt”; dùng số nhiều theo cách diễn đạt tự nhiên về một phần hạt giống được gieo.
- source_word: πετρῶδες
  choice: nền đất đá
  rationale: Chỉ địa hình có đá bên dưới hoặc nhiều đá, chỉ phủ một lớp đất mỏng, chứ không đơn thuần là vài viên đá nằm rải rác.
- source_word: γῆν πολλήν
  choice: nhiều đất
  rationale: Trong ngữ cảnh canh tác, γῆ là đất trồng; cách dịch này giữ nguyên ý lượng đất ít.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Diễn đạt sự nảy mọc nhanh chóng và trực tiếp.
- source_word: ἐξανέτειλεν
  choice: mọc lên
  rationale: Động từ trong ngữ cảnh cây trồng nói đến việc nảy và nhô lên khỏi mặt đất; “mọc lên” tự nhiên trong tiếng Việt.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: vì lớp đất không sâu
  rationale: διά với động từ nguyên mẫu có mạo từ nêu nguyên nhân; cách diễn đạt bằng mệnh đề hữu hạn tự nhiên và giữ hình ảnh lớp đất nông trên đá.
- source_word: ὅπου
  choice: nơi
  rationale: Đại từ trạng ngữ chỉ địa điểm được chuyển thành từ nối địa điểm tự nhiên trong tiếng Việt.
