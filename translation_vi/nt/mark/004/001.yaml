  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: vi
  text: Ngài lại bắt đầu giảng dạy bên bờ biển. Một đoàn dân rất đông kéo đến với Ngài,[a] đến nỗi Ngài vào thuyền và ngồi ngoài biển,[b] còn cả đoàn dân thì ở trên đất liền, bên bờ biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang kéo đến với Ngài.” Mác thường dùng thì hiện tại để kể sống động một sự việc trong quá khứ.'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là Ngài ngồi trong thuyền ở ngoài biển, còn đoàn dân vẫn ở trên đất liền.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt tự nhiên sự lặp lại hoạt động giảng dạy của Chúa Giê-su.
- source_word: ἤρξατο διδάσκειν
  choice: bắt đầu giảng dạy
  rationale: Giữ rõ sắc thái khởi đầu của cấu trúc động từ cùng nguyên mẫu.
- source_word: παρὰ τὴν θάλασσαν
  choice: bên bờ biển
  rationale: παρά với đối cách chỉ vị trí dọc theo mép biển; cách nói này tự nhiên trong tiếng Việt và vẫn giữ θάλασσα là “biển” thay vì đổi thành “hồ”.
- source_word: συνάγεται
  choice: tụ họp
  rationale: Hiện tại lịch sử tạo tính sống động trong lời kể; tiếng Việt không bắt buộc đánh dấu thì nên có thể giữ sắc thái ấy mà không dùng một chỉ dấu quá khứ.
- source_word: ὄχλος πλεῖστος
  choice: một đoàn dân rất đông
  rationale: “Rất đông” chuyển tải lực nhấn mạnh của πλεῖστος bằng tiếng Việt hiện đại, tự nhiên.
- source_word: πρὸς αὐτόν
  choice: quanh Ngài
  rationale: Trong ngữ cảnh đám đông tiến đến và quy tụ bên Chúa Giê-su, “quanh Ngài” tự nhiên hơn “đến với Ngài”, dù ý hướng về Ngài vẫn được giữ.
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn đạt kết quả phát sinh từ việc đoàn dân quá đông.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: phải xuống thuyền
  rationale: “Xuống thuyền” là cách nói tự nhiên trong tiếng Việt cho hành động bước vào thuyền; “phải” làm rõ kết quả do đám đông gây nên, vốn nằm trong cấu trúc ὥστε.
- source_word: πλοῖον
  choice: thuyền
  rationale: Từ thông dụng, chính xác và phù hợp bối cảnh.
- source_word: καθῆσθαι
  choice: ngồi
  rationale: Chuyển tải trực tiếp hành động ngồi trong cấu trúc chỉ kết quả.
- source_word: ἐν τῇ θαλάσσῃ
  choice: ở trên mặt biển
  rationale: Về hình thức là “trong biển”, nhưng ngữ cảnh cho biết Ngài ngồi trong thuyền trên mặt nước; cách dịch này tự nhiên mà không làm mất hình ảnh gốc.
- source_word: πᾶς ὁ ὄχλος
  choice: cả đoàn dân
  rationale: Giữ ý toàn thể của πᾶς cùng danh từ tập hợp số ít.
- source_word: πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: ở trên đất liền, sát bờ biển
  rationale: Giữ sự tương phản không gian giữa Chúa Giê-su trên mặt nước và đoàn dân trên đất, ngay sát biển.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối kính trọng phổ biến. Giữ “biển” theo θάλασσα thay vì diễn giải thành “hồ Ga-li-lê”; các chú thích bảo tồn hiện tại lịch sử và giải thích hình ảnh “ở trên mặt biển”.
