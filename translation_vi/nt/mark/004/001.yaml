revisions:
- from: Ngài lại bắt đầu giảng dạy bên bờ biển. Một đoàn dân rất đông tụ họp quanh Ngài,[a] đến nỗi Ngài phải xuống thuyền ngồi ở trên mặt biển,[b] còn cả đoàn dân ở trên đất liền, sát bờ biển.
  to: Ngài lại bắt đầu giảng dạy bên bờ biển. Một đoàn dân rất đông kéo đến với Ngài,[a] đến nỗi Ngài vào thuyền và ngồi ngoài biển,[b] còn cả đoàn dân thì ở trên đất liền, bên bờ biển.
  rationale: Sửa các cụm thêm sắc thái không có trong nguyên văn hoặc có nguy cơ gây hiểu lầm, đồng thời giữ cấu trúc kết quả của câu, hiện tại lịch sử qua chú thích, và sự đối lập giữa Ngài ở trên thuyền ngoài biển với đoàn dân ở trên đất liền.
