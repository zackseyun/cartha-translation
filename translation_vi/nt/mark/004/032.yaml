id: MRK.4.32
reference: Mark 4:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: vi
  text: Khi được gieo, nó mọc lên và trở nên lớn hơn tất cả các cây rau trong vườn, đâm ra những cành lớn, đến nỗi chim trời[a] có thể làm tổ[b] dưới bóng nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các loài chim trên trời”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch là “trú ngụ” hoặc “cư ngụ”. Cách diễn đạt này có thể gợi lại hình ảnh trong Cựu Ước về chim tìm nơi trú ẩn trên một cây lớn (ví dụ: Ê-xê-chi-ên 17:23; Đa-ni-ên 4:12).'
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: được gieo xuống
  rationale: 'Thể bị động aorist sau ὅταν diễn tả một thời điểm bất định: “khi được gieo xuống.” Cách dịch này giữ nguyên hình ảnh gieo hạt.'
- source_word: ἀναβαίνει
  choice: mọc lên
  rationale: Trong ngữ cảnh cây cối, động từ chỉ việc nhú và vươn lên khỏi mặt đất; “mọc lên” tự nhiên trong tiếng Việt.
- source_word: γίνεται
  choice: trở nên
  rationale: Giữ ý về trạng thái đạt được trong quá trình phát triển của cây.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: lớn hơn mọi cây rau trong vườn
  rationale: λάχανα chỉ các loại rau/cây thân thảo trồng trong vườn, không phải cây gỗ; kết cấu so sánh được giữ là “lớn hơn mọi...” thay vì chuyển thành so sánh tuyệt đối.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: đâm ra những cành lớn
  rationale: Cách nói tự nhiên của tiếng Việt về cây phát triển cành, đồng thời phản ánh ποιεῖ theo nghĩa tạo ra hoặc sinh ra.
- source_word: ὥστε δύνασθαι
  choice: đến nỗi ... có thể
  rationale: Diễn đạt rõ quan hệ kết quả của ὥστε với động từ nguyên mẫu.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: dưới bóng nó
  rationale: “Bóng” vừa tự nhiên vừa giữ được hình ảnh nơi trú ẩn do cây che phủ.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Cách nói tiếng Việt gọn, tự nhiên và sát nghĩa “các loài chim của bầu trời”; chú thích ghi nhận cách dịch minh thị hơn.
- source_word: κατασκηνοῦν
  choice: làm tổ
  rationale: Trong ngữ cảnh chim ở dưới bóng các cành cây, “làm tổ” truyền đạt hình ảnh tự nhiên; chú thích bảo lưu nghĩa rộng hơn là cư ngụ hoặc trú ngụ.
theological_decisions:
- issue: Hình ảnh liên văn bản về chim trú ngụ nơi cành cây
  choice: Giữ nguyên hình ảnh trong câu chính và không giải thích biểu tượng.
  alternative: Dịch κατασκηνοῦν là “trú ngụ” để làm nổi bật hơn âm vang của hình ảnh cây-vương quốc trong Cựu Ước.
  rationale: Câu Hy Lạp không giải nghĩa hình ảnh. Bản dịch không nên tự xác định chim hoặc cây tượng trưng cho điều gì; chú thích chỉ nêu khả năng có âm vang từ Ê-xê-chi-ên 17:23 và Đa-ni-ên 4:12.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cây rau trong vườn” để tránh khiến λάχανα bị hiểu là cây gỗ; “chim trời” là thành ngữ tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện ngay tại từ ngữ liên quan trong câu chính.
