  to: Khi được gieo, nó mọc lên và trở nên lớn hơn tất cả các cây rau trong vườn, đâm ra những cành lớn, đến nỗi chim trời[a] có thể làm tổ[b] dưới bóng nó.
  rationale: 'Sửa duy nhất các điểm an toàn cần thiết: thay liên từ tương phản không có căn cứ bằng mở đầu thời gian trung tính, và lược “xuống” để bám sát σπαρῇ hơn. Giữ cấu trúc kết quả “đến nỗi ... có thể”, hình ảnh cành lớn và chim làm tổ; không diễn giải ý nghĩa biểu tượng của hình ảnh cây và chim. Các neo chú thích vẫn gắn đúng với “chim trời” và “làm tổ”.'
