  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: vi
  text: Còn những người khác là những người được gieo giữa bụi gai[a]; đó là những người đã nghe lời[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào giữa bụi gai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “sứ điệp.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: những người khác
  rationale: Tính từ được dùng như danh từ, chỉ một nhóm khác đối lập với các nhóm đất/người đã nói trước đó.
- source_word: εἰς τὰς ἀκάνθας
  choice: giữa bụi gai
  rationale: Dù εἰς thường có nghĩa là “vào”, trong hình ảnh gieo giống, “giữa bụi gai” tự nhiên trong tiếng Việt và diễn tả hạt được gieo vào nơi có gai mọc.
- source_word: ἀκάνθας
  choice: bụi gai
  rationale: Cách diễn đạt cụ thể, tự nhiên, phù hợp với bối cảnh nông nghiệp của dụ ngôn.
- source_word: σπειρόμενοι
  choice: được gieo
  rationale: Giữ thể bị động và phép ẩn dụ về hạt giống áp dụng cho con người, thay vì diễn giải phép ẩn dụ.
- source_word: οὗτοί εἰσιν
  choice: đó là
  rationale: Công thức nhận diện được chuyển sang tiếng Việt tự nhiên, nối nhóm vừa nêu với phần giải thích tiếp theo.
- source_word: οἱ ... ἀκούσαντες
  choice: những người đã nghe
  rationale: Phân từ bất định chỉ hành động nghe đã xảy ra trước những diễn biến tiếp theo; “đã nghe” thể hiện rõ quan hệ này.
- source_word: τὸν λόγον
  choice: lời
  rationale: “Lời” giữ cách nói Kinh Thánh và sự liên kết trong dụ ngôn, đồng thời ở đây có nghĩa là lời được rao truyền; “sứ điệp” là một khả năng khác.
theological_decisions:
- issue: Sự đồng nhất mang tính ẩn dụ giữa con người và hạt giống trong lời giải thích dụ ngôn
  choice: 'Giữ nguyên phép ẩn dụ: “những người được gieo giữa bụi gai”'
  alternative: những người giống như hạt được gieo nơi có gai; những người ở nơi đất đầy gai
  rationale: Bản Hy Lạp tiếp tục trực tiếp gọi con người là những người “được gieo”; giữ cách nói này bảo toàn cấu trúc văn chương và sức căng của phép ẩn dụ mà không thêm lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “những người được gieo” hơi khác lời nói thông thường nhưng được giữ có chủ ý để bảo toàn phép ẩn dụ của nguyên văn.
