  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: vi
  text: 'Người nói với họ: “Anh em không hiểu dụ ngôn này sao? Thế thì làm sao anh em sẽ hiểu tất cả các dụ ngôn?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Anh em không biết dụ ngôn này sao? Và làm sao anh em sẽ biết tất cả các dụ ngôn?” Hai động từ Hy Lạp có thể được dịch là “biết”, nhưng trong ngữ cảnh này chúng mang nghĩa hiểu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: Ngài nói
  rationale: Giữ thì hiện tại lịch sử đặc trưng trong lối kể của Mác, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: οἴδατε
  choice: không hiểu
  rationale: Dù động từ thường có nghĩa là “biết”, khi đi với “dụ ngôn” ở đây nó chỉ việc nắm bắt ý nghĩa.
- source_word: παραβολὴν
  choice: dụ ngôn
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác cho hình thức giảng dạy này của Chúa Giê-su.
- source_word: ταύτην
  choice: này
  rationale: Đại từ chỉ định quy chiếu trực tiếp đến dụ ngôn vừa được kể.
- source_word: καὶ πῶς
  choice: Vậy làm thế nào
  rationale: Καί nối câu hỏi thứ hai với câu thứ nhất theo quan hệ suy luận; “vậy” thể hiện mạch lập luận tự nhiên mà không làm mất sức căng của câu Hy Lạp.
- source_word: πάσας τὰς παραβολὰς
  choice: tất cả các dụ ngôn
  rationale: Phản ánh số nhiều đi với πᾶς và nói rộng đến toàn bộ các dụ ngôn.
- source_word: γνώσεσθε
  choice: hiểu được
  rationale: Trong ngữ cảnh này, động từ nói đến khả năng lĩnh hội ý nghĩa; “được” diễn đạt tự nhiên sắc thái khả năng trong câu hỏi tương lai.
theological_decisions:
- issue: Mối quan hệ giữa οἴδατε và γνώσεσθε
  choice: Dịch cả hai theo nghĩa “hiểu” trong ngữ cảnh.
  alternative: Dịch sát hình thức hơn là “biết ... biết”, hoặc phân biệt “biết ... hiểu”.
  rationale: Câu này nói về việc lĩnh hội ý nghĩa các dụ ngôn chứ không chỉ biết chúng tồn tại. Dùng “hiểu” ở cả hai vế giữ được sự song song và sức mạnh tu từ, còn chú thích bảo lưu nghĩa từ vựng sát hình thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ ngữ được ngữ cảnh xác định là Chúa Giê-su, và “các con” cho lời Ngài nói với các môn đồ. Dấu chú thích [a] được đặt sau toàn bộ lời nói vì chú thích giải thích cách dịch của cả hai động từ.
