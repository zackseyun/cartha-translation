revisions:
- from: 'Ngài nói với họ: “Các con không hiểu dụ ngôn này sao? Vậy làm thế nào các con hiểu được tất cả các dụ ngôn?”[a]'
  to: 'Người nói với họ: “Anh em không hiểu dụ ngôn này sao? Thế thì làm sao anh em sẽ hiểu tất cả các dụ ngôn?”[a]'
  rationale: Bản sửa giữ nguyên nội dung và tính mơ hồ về thành phần người nghe của nguyên văn, tránh sắc thái phụ tử do “các con” tạo ra. “Thế thì” diễn đạt suy luận của καὶ πῶς, còn “sẽ hiểu” bảo toàn rõ hơn thì tương lai của γνώσεσθε. Chú thích được cập nhật tương ứng và vẫn bảo lưu phương án dịch sát từ vựng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng hai câu hỏi tu từ, nghĩa ngữ cảnh của οἴδατε và γνώσεσθε là sự lĩnh hội, cũng như quan hệ suy luận của καὶ πῶς. Tuy nhiên, “các con” xác định và thêm một quan hệ xưng hô phụ tử không có trong αὐτοῖς (“họ”), vốn trong ngữ cảnh bao gồm những người ở quanh Đức Giê-su cùng Nhóm Mười Hai (4:10).
  naturalness: Câu văn nhìn chung tự nhiên. “Vậy làm thế nào ... hiểu được” có thể chỉnh thành “Thế thì làm sao ... sẽ hiểu” để phản ánh trực tiếp hơn thì tương lai γνώσεσθε và giữ lực tu từ gọn, tự nhiên.
  terminology: “Dụ ngôn” là thuật ngữ chuẩn. “Người” và “họ” giữ cách gọi trung tính, trang trọng, không thêm quan hệ thân tộc; “Ngài” không sai về nghĩa nhưng “Người” bám sát lối kể nguồn hơn trong câu này.
  issues:
  - severity: medium
    issue: “Các con” thêm sắc thái xưng hô phụ tử.
    rationale: Nguyên văn chỉ nói “với họ” và không dùng một danh xưng hay đại từ thân tộc cho người nghe. Nên dùng “họ” trong lời dẫn và một đại từ số nhiều trung tính trong lời nói để không xác định quá mức thành phần hay quan hệ của cử tọa.
  - severity: low
    issue: “Hiểu được” ở vế sau hơi chuyển trọng tâm sang khả năng.
    rationale: Γνώσεσθε là tương lai của động từ “biết/nhận biết”, trong ngữ cảnh là “sẽ hiểu”. “Sẽ hiểu” phản ánh thì tương lai trực tiếp hơn mà vẫn giữ nghĩa ngữ cảnh.
  revised_text: 'Người nói với họ: “Anh em không hiểu dụ ngôn này sao? Thế thì làm sao anh em sẽ hiểu tất cả các dụ ngôn?”[a]'
