  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: vi
  text: Ngài không hề nói với họ nếu không dùng dụ ngôn; nhưng khi ở riêng với các môn đồ của chính Ngài, Ngài giải thích mọi điều.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Giải thích” cũng có thể dịch là “diễn giải” hoặc “giải nghĩa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ παραβολῆς
  choice: không nói ... mà không dùng dụ ngôn
  rationale: Diễn đạt tự nhiên cấu trúc “không ... nếu không có/không dùng dụ ngôn”, đồng thời giữ danh từ số ít mang nghĩa phương thức nói.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: Ngài không nói với họ
  rationale: Thì chưa hoàn thành trong lời tổng kết có sắc thái thường xuyên; tiếng Việt không đánh dấu hình thái thì, và ngữ cảnh truyền đạt tính quen lệ.
- source_word: κατ’ ἰδίαν
  choice: khi ở riêng
  rationale: Thành ngữ chỉ hoàn cảnh riêng tư, đối lập với việc nói công khai cho đám đông.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: cho chính các môn đồ của mình
  rationale: “chính ... của mình” bảo tồn sắc thái nhấn mạnh của ἰδίοις, thay vì chỉ dịch là “các môn đồ”.
- source_word: ἐπέλυεν
  choice: giải thích
  rationale: Trong ngữ cảnh này, động từ có nghĩa giải thích hoặc diễn giải; “giải thích” là cách nói hiện đại, rõ ràng và tự nhiên.
- source_word: πάντα
  choice: mọi điều
  rationale: Giữ phạm vi bao quát của từ Hy Lạp mà không tự ý giới hạn thành chỉ các dụ ngôn hay những điều vừa nói.
theological_decisions:
- issue: Phạm vi của lời giải thích riêng của Chúa Giê-xu
  choice: Dịch πάντα là “mọi điều”, không thu hẹp đối tượng được giải thích.
  alternative: “mọi dụ ngôn” hoặc “mọi điều Ngài đã nói”
  rationale: Nguyên văn chỉ nói “mọi điều”. Ngữ cảnh có thể gợi đến các dụ ngôn hay sự dạy dỗ của Ngài, nhưng bản dịch không nên xác định hẹp hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch văn nói về Chúa Giê-xu; “môn đồ” giữ thuật ngữ Kinh Thánh thông dụng. Dấu chấm phẩy làm rõ sự tương phản giữa lời nói công khai bằng dụ ngôn và lời giải thích riêng.
