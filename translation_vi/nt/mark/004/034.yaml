revisions:
- from: Ngài không nói với họ mà không dùng dụ ngôn; nhưng khi ở riêng, Ngài giải thích mọi điều cho chính các môn đồ của mình.[a]
  to: Ngài không hề nói với họ nếu không dùng dụ ngôn; nhưng khi ở riêng với các môn đồ của chính Ngài, Ngài giải thích mọi điều.[a]
  rationale: Bản sửa làm câu tiếng Việt tự nhiên hơn, đồng thời đặt sự nhấn mạnh của ἰδίοις vào mối liên hệ các môn đồ thuộc về Chúa Giê-xu. Không thu hẹp “mọi điều,” và vẫn giữ tương phản giữa việc nói với đám đông bằng dụ ngôn và việc giải thích riêng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng ý chính của câu, gồm việc Chúa Giê-xu không nói với đám đông ngoài dụ ngôn và giải thích mọi điều cách riêng cho các môn đồ. Tuy nhiên, cụm “cho chính các môn đồ của mình” đặt trọng tâm của “chính” lên các môn đồ, trong khi ἰδίοις nhấn mạnh rằng họ là các môn đồ thuộc về Ngài. Cấu trúc phủ định kép “không nói ... mà không dùng” hiểu được nhưng kém tự nhiên hơn cách diễn đạt điều kiện tương đương trong tiếng Việt.
  naturalness: “Ngài không hề nói với họ nếu không dùng dụ ngôn” là lối nói hiện đại, rõ nghĩa và phù hợp với sắc thái khái quát/thường xuyên của thì chưa hoàn thành. “Khi ở riêng với các môn đồ của chính Ngài” diễn đạt tự nhiên sự đối lập công khai–riêng tư và giữ sự nhấn mạnh sở hữu.
  terminology: Giữ “Ngài,” “dụ ngôn,” “môn đồ,” và “giải thích” là nhất quán với văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. “Mọi điều” bảo toàn phạm vi không bị thu hẹp của πάντα.
