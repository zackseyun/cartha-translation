source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: vi
  text: còn những mối lo của thời đại này[a], sự lừa dối của giàu sang và những ham muốn về các điều khác len vào, bóp nghẹt lời ấy, và lời ấy trở nên không sinh hoa trái[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những mối lo của thế gian.” Từ Hy Lạp có thể chỉ “thời đại,” và theo nghĩa mở rộng là trật tự thế gian hiện tại.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn sát hơn: “và nó trở nên không sinh hoa trái.” Đại từ ngầm gần nhất chỉ “lời,” nhưng trong hình ảnh dụ ngôn cũng có thể được hiểu là hạt giống/cây hoặc người nghe không sinh hoa trái.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: những mối lo
  rationale: Diễn đạt gánh nặng lo toan một cách tự nhiên, không thu hẹp nghĩa thành trạng thái lo âu tâm lý.
- source_word: αἰῶνος
  choice: của thời đại này
  rationale: Giữ sắc thái thời gian và trật tự hiện tại của αἰών; thêm “này” để diễn đạt tự nhiên ý chỉ thời đại hiện tại trong ngữ cảnh.
- source_word: ἀπάτη τοῦ πλούτου
  choice: sự lừa dối của giàu sang
  rationale: Giữ cấu trúc sở hữu và ý rằng sự giàu sang có sức đánh lừa; “giàu sang” tự nhiên hơn danh từ trừu tượng “sự giàu có” trong câu này.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: những ham muốn về các điều khác
  rationale: Giữ phạm vi rộng của λοιπά và đối tượng hướng đến của ἐπιθυμίαι mà không diễn giải cụ thể hơn nguồn.
- source_word: εἰσπορευόμεναι
  choice: len vào
  rationale: Thể hiện sinh động việc các ảnh hưởng cạnh tranh xâm nhập; vị trí trong câu cho phép cụm này quy chiếu đến cả ba yếu tố được liệt kê.
- source_word: συμπνίγουσιν
  choice: bóp nghẹt
  rationale: Giữ nguyên hình ảnh cây bị nghẹt trong dụ ngôn và sắc thái mạnh của động từ.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Giữ thuật ngữ “lời” cùng liên hệ với lời được gieo trong dụ ngôn; “ấy” chỉ lại đối tượng đã được nói đến.
- source_word: ἄκαρπος γίνεται
  choice: khiến lời ấy không sinh hoa trái
  rationale: Diễn đạt tự nhiên kết quả của việc bị bóp nghẹt, đồng thời giữ hình ảnh sinh hoa trái; việc lặp lại “lời ấy” làm rõ chủ thể ngầm mà không đổi quy chiếu gần nhất.
theological_decisions:
- issue: Chủ thể ngầm của ἄκαρπος γίνεται
  choice: “lời ấy” không sinh hoa trái
  alternative: người nghe không sinh hoa trái; hoặc hạt/cây không sinh hoa trái
  rationale: Danh từ số ít gần nhất là τὸν λόγον (“lời”), và trong hình ảnh dụ ngôn, lời được ví như hạt giống bị bóp nghẹt. Chú thích vẫn bảo lưu những cách hiểu do phép ẩn dụ tạo ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Len vào, bóp nghẹt” duy trì chuyển động của hình ảnh dụ ngôn; dấu phẩy tránh biến phân từ thành một mệnh đề tách rời. Câu giữ phép nhân hóa “lời” và không áp đặt một cách giải thích giáo phái.
