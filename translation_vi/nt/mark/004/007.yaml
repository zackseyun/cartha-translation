  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: vi
  text: Một hạt khác rơi vào bụi gai[a], các bụi gai mọc lên, bóp nghẹt nó, và nó không cho ra trái nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “rơi giữa các bụi gai.” Giới từ Hy Lạp theo nghĩa đen là “vào”; “vào bụi gai” diễn đạt tự nhiên bối cảnh hạt rơi vào nơi có gai mọc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: một hạt khác
  rationale: Tính từ trung tính số ít được dùng tỉnh lược, chỉ hạt giống trong ngữ cảnh trước; thêm “hạt” giúp tiếng Việt rõ nghĩa mà không thêm ý mới.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Dịch trực tiếp động từ πίπτω; tránh diễn giải thành “được gieo” khi nguyên văn chỉ nói “rơi”.
- source_word: εἰς τὰς ἀκάνθας
  choice: vào giữa bụi gai
  rationale: Giữ sắc thái hướng vào của εἰς, đồng thời diễn đạt tự nhiên cảnh hạt rơi vào vùng có gai.
- source_word: ἀνέβησαν
  choice: mọc lên
  rationale: Cách nói tự nhiên trong tiếng Việt về cây cỏ vươn lên khỏi đất.
- source_word: συνέπνιξαν
  choice: làm ... nghẹt đi
  rationale: Giữ hình ảnh mạnh của động từ “làm nghẹt”, mô tả gai cản trở sự sống và phát triển của hạt.
- source_word: αὐτό
  choice: nó
  rationale: Đại từ số ít quy chiếu về hạt; “nó” tự nhiên và không cần lặp lại danh từ.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: nó không sinh hoa trái
  rationale: Thành ngữ nông nghiệp tự nhiên, truyền đạt sát nghĩa “không cho/sinh ra trái” mà không thu hẹp ý nghĩa của καρπός.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hoa trái” để giữ hình ảnh nông nghiệp lẫn khả năng hàm nghĩa rộng hơn trong dụ ngôn; không thêm cách giải thích thần học vào câu.
