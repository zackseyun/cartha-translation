  text: καὶ ἔλεγεν· ⸂Ὃς ἔχει⸃ ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: vi
  text: 'Ngài nói: “Ai có tai để nghe, hãy nghe!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp mạch kể. Trong tiếng Việt, mở câu bằng “Và” ở đây kém tự nhiên; sự liên kết với câu trước vẫn rõ mà không cần biểu đạt thành một từ riêng.
- source_word: ἔλεγεν
  choice: Ngài nói
  rationale: Động từ ở thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lời nói được lặp lại, nhưng trong công thức dẫn lời này, “Ngài nói” là cách diễn đạt tự nhiên và không cường điệu sắc thái lặp lại như “Ngài cứ nói”.
- source_word: Ὃς ἔχει
  choice: Ai có
  rationale: Mệnh đề quan hệ số ít giống đực mang nghĩa khái quát, không giới hạn ở nam giới. “Ai có” truyền đạt đúng lực khái quát và tự nhiên trong tiếng Việt.
- source_word: ὦτα
  choice: tai
  rationale: Dịch sát danh từ chỉ cơ quan nghe. Tiếng Việt thường dùng “tai” không đánh dấu số trong thành ngữ này.
- source_word: ἀκούειν
  choice: để nghe
  rationale: Giữ quan hệ mục đích/khả năng của động từ nguyên mẫu với “tai” và duy trì sự lặp từ với mệnh lệnh theo sau.
- source_word: ἀκουέτω
  choice: hãy nghe
  rationale: Diễn đạt tự nhiên mệnh lệnh ngôi thứ ba trong tiếng Hy Lạp, đồng thời giữ nguyên sự lặp lại của động từ ἀκούω.
theological_decisions:
- issue: Cách diễn đạt giống đực số ít mang nghĩa khái quát
  choice: Ai có tai để nghe, hãy nghe
  alternative: Người nào có tai để nghe, người ấy hãy nghe
  rationale: Tiếng Hy Lạp dùng hình thức giống đực số ít nhưng có lực khái quát. Đại từ “ai” trong tiếng Việt vừa bao quát mọi người vừa giữ được tính trực tiếp và cô đọng của lời kêu gọi, không đưa thêm ý nghĩa liên quan đến giới tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm than thể hiện lực mệnh lệnh của ἀκουέτω mà không thêm nội dung giải thích.
