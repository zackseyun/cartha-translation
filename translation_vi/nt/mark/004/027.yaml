  - severity: low
    issue: Cụm “lớn lên[a] thế nào” có thể tạm thời tạo liên kết không rõ giữa “thế nào” với riêng động từ “lớn lên.”
    rationale: ὡς οὐκ οἶδεν αὐτός nói đến cách thức toàn bộ tiến trình nảy mầm và sinh trưởng xảy ra, không chỉ mức độ tăng trưởng. Thêm “điều đó xảy ra” làm rõ phạm vi mà không diễn giải quá mức.
