  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: vi
  text: Người ấy cứ ngủ rồi thức dậy, đêm cũng như ngày; hạt giống nảy mầm và lớn lên[a], chính người ấy cũng không biết điều đó xảy ra thế nào[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nảy mầm và cao lên.” Động từ thứ hai đặc biệt gợi ý sự dài ra hoặc tăng chiều cao.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng một cấu trúc có thể hiểu sát là “như/cách mà chính người ấy không biết”; trong ngữ cảnh, ý là chính người ấy không biết tiến trình ấy xảy ra thế nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ καὶ ἐγείρηται
  choice: cứ ngủ rồi thức dậy
  rationale: Các động từ hiện tại giả định trong mạch dụ ngôn diễn tả hành động lặp đi lặp lại. “Cứ… rồi…” truyền đạt tự nhiên nhịp sinh hoạt thường xuyên, còn “thức dậy” tránh gợi nghĩa phục sinh.
- source_word: νύκτα καὶ ἡμέραν
  choice: hết đêm đến ngày
  rationale: Cụm đối xứng chỉ vòng tuần hoàn liên tục của thời gian; cách nói này tự nhiên trong tiếng Việt và giữ thứ tự “đêm và ngày” của Hy Lạp.
- source_word: ὁ σπόρος
  choice: hạt giống
  rationale: Mạo từ xác định quy chiếu về hạt đã gieo trong dụ ngôn. “Hạt giống” rõ nghĩa và phù hợp ngữ cảnh nảy mầm.
- source_word: βλαστᾷ
  choice: nảy mầm
  rationale: Diễn đạt rõ giai đoạn đầu của sự sinh trưởng và tự nhiên hơn một cách dịch quá kỹ thuật.
- source_word: μηκύνηται
  choice: lớn lên
  rationale: Động từ gợi sự dài ra hoặc cao lên; “lớn lên” tự nhiên trong tiếng Việt khi nói về cây, còn sắc thái cụ thể hơn được bảo lưu trong chú thích.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: thế nào, chính người ấy cũng không biết
  rationale: Cấu trúc tiếng Việt đặt “thế nào” sau tiến trình nảy mầm và lớn lên, rồi nhấn mạnh αὐτός bằng “chính người ấy”; nhờ đó truyền đạt ý người gieo không biết tiến trình ấy xảy ra bằng cách nào mà không thêm tác nhân.
theological_decisions:
- issue: Tác nhân làm hạt giống sinh trưởng trong dụ ngôn
  choice: Giữ cơ chế sinh trưởng là điều người gieo không biết, không nêu đích danh tác nhân trong câu này.
  alternative: Nói rõ Đức Chúa Trời làm cho hạt giống lớn lên, hoặc diễn giải đây chỉ là một quá trình tự nhiên.
  rationale: Bản Hy Lạp nhấn mạnh việc hạt giống sinh trưởng và sự không biết của người gieo, nhưng không trực tiếp xác định tác nhân; bản dịch giữ nguyên sự căng thẳng thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ấy” nối với người gieo trong dụ ngôn; “cứ… rồi…” và “hết đêm đến ngày” tái hiện tiến trình lặp lại mà không làm câu nặng tính kỹ thuật.
