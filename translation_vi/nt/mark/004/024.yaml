  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: vi
  text: 'Người nói với họ: “Hãy chú ý điều anh em nghe. Anh em dùng đấu nào để đong, thì sẽ được đong cho bằng đấu ấy, và sẽ được thêm cho anh em.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “sẽ được thêm cho anh em” không nói rõ điều gì được thêm. Trong mạch văn, có thể hiểu là những người tiếp nhận lời dạy của Chúa Giê-su sẽ được ban thêm sự hiểu biết.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ngài nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang tiếp diễn hoặc lặp lại, nhưng trong lối kể chuyện tiếng Việt, “Ngài nói” tự nhiên và không loại trừ sắc thái ấy.
- source_word: Βλέπετε
  choice: Hãy chú ý
  rationale: Động từ theo nghĩa đen là “hãy nhìn”, nhưng ở đây là lời thúc giục phải lưu tâm cẩn thận.
- source_word: τί ἀκούετε
  choice: đến điều các con nghe
  rationale: τί là “điều gì/cái gì”, nên giữ trọng tâm vào nội dung được nghe, không hài hòa hóa thành “cách nghe” như Lu-ca 8:18.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Các con dùng đấu nào để đong
  rationale: Giữ hình ảnh đo lường bằng cách dùng thành ngữ Việt tự nhiên; “đấu” chỉ dụng cụ hoặc đơn vị đong, còn “đong” diễn đạt động tác μετρεῖτε.
- source_word: μετρηθήσεται ὑμῖν
  choice: thì sẽ được đong lại bằng đấu ấy
  rationale: Giữ thể bị động và nguyên tắc tương ứng. “Lại” làm rõ tính hồi đáp vốn hàm chứa trong cấu trúc, còn “bằng đấu ấy” nối rõ với hình ảnh phía trước.
- source_word: καὶ προστεθήσεται ὑμῖν
  choice: và còn được thêm cho các con
  rationale: Dịch sát ý “được thêm”, không xác định điều gì được thêm, nhờ đó giữ nguyên độ mở của câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của lời nói về sự đo lường tương ứng
  choice: Giữ câu như một nguyên tắc rộng trong mạch văn về việc nghe lời dạy của Chúa Giê-su, không chỉ rõ đối tượng được đong hay điều được thêm.
  alternative: Giải thích riêng là sự phán xét, lòng rộng rãi, hoặc sự gia tăng hiểu biết thuộc linh.
  rationale: Mạch văn nghiêng về việc tiếp nhận lời dạy, nhưng bản văn vẫn dùng một ẩn dụ mở. Bản dịch không nên thu hẹp câu vào một hệ thống thần học hay một ứng dụng duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” để diễn đạt đại từ số nhiều αὐτοῖς/ὑμῖν trong lời Chúa Giê-su nói với các môn đồ; dùng cặp “đấu—đong” để giữ ẩn dụ đo lường một cách tự nhiên.
