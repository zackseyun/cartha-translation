revisions:
- from: 'Ngài nói với họ: “Hãy chú ý đến điều các con nghe. Các con dùng đấu nào để đong, thì sẽ được đong lại bằng đấu ấy, và còn được thêm cho các con.[a]”'
  to: 'Người nói với họ: “Hãy chú ý điều anh em nghe. Anh em dùng đấu nào để đong, thì sẽ được đong cho bằng đấu ấy, và sẽ được thêm cho anh em.[a]”'
  rationale: Bản sửa loại bỏ hai yếu tố diễn giải (“lại”, “còn”) để bám sát câu Hy Lạp, đồng thời giữ nguyên ẩn dụ đo lường và tính mở của điều được thêm. Cách xưng hô được điều chỉnh sang “anh em” nhằm tránh bổ sung quan hệ cha-con không được nêu trong nguyên văn. Chú thích được duy trì với tư cách một khả năng theo mạch văn, không phải lời giải thích độc tôn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:28Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung giữ đúng mệnh lệnh phải lưu tâm, trọng tâm “điều gì” được nghe (không hòa lẫn với “cách nghe”), và hình ảnh đo lường tương ứng. Tuy nhiên, “lại” thêm rõ ý hồi đáp mà câu Hy Lạp không phát biểu, và “còn” trước “được thêm” dễ tạo sắc thái “thêm nữa/more” không có từ tương ứng trong nguyên văn; bản văn chỉ nói “và sẽ được thêm cho anh em.”
  naturalness: Cấu trúc “dùng đấu nào để đong” tự nhiên, nhưng cách xưng hô “các con” không được quy định bởi αὐτοῖς/ὑμῖν và mang sắc thái quan hệ cha-con rõ hơn nguyên văn. “Anh em” là cách gọi số nhiều hiện đại, trang trọng vừa phải, phù hợp với nhóm người nghe mà không thêm sắc thái đó.
  terminology: Giữ cặp “đấu—đong” bảo toàn ẩn dụ μέτρον/μετρεῖν một cách tự nhiên. Dùng “Người” thay “Ngài” để kể về Chúa Giê-su trong văn phong hiện đại trung tính; không thay đổi ý nghĩa hay mức tôn kính. Không xác định điều được thêm trong bản chính. Chú thích vẫn nêu khả năng hiểu theo mạch văn, không biến nó thành nghĩa duy nhất.
  issues:
  - severity: medium
    issue: Từ “lại” trong “sẽ được đong lại” vượt quá cách diễn đạt của nguyên văn.
    rationale: μετρηθήσεται là bị động tương lai “sẽ được đo/đong cho”; tính tương ứng đã được diễn đạt bằng cùng một “đấu”, còn “lại” là một sự làm rõ diễn giải không cần thiết.
  - severity: medium
    issue: Từ “còn” trong “còn được thêm” dễ truyền đạt ý “more”.
    rationale: προστεθήσεται có nghĩa là “sẽ được thêm”, nhưng câu Hy Lạp không có từ “nhiều hơn/còn nữa”. Nên giữ động từ “thêm” mà không gia tăng sắc thái định lượng.
  - severity: low
    issue: “Các con” thêm sắc thái quan hệ không được đánh dấu trong đại từ số nhiều Hy Lạp.
    rationale: αὐτοῖς và ὑμῖν chỉ là các đại từ số nhiều. “Anh em” giữ cách gọi trực tiếp tự nhiên mà không xác định người nghe là “con” của người nói.
