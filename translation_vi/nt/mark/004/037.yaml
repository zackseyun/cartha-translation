  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: vi
  text: Một trận bão gió lớn nổi lên[a]. Sóng liên tiếp tràn vào thuyền[b], đến nỗi thuyền đã dần đầy nước[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát hơn: “một trận bão lớn có gió.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sóng liên tiếp đánh vào thuyền.” Động từ Hy Lạp diễn tả hành động tiếp diễn hoặc lặp đi lặp lại.'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “đến nỗi thuyền đang được làm đầy.” Động từ diễn tả quá trình thuyền đầy nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: nổi lên
  rationale: Thì hiện tại lịch sử trong lối kể sống động của Mác được chuyển thành cách kể quá khứ tự nhiên trong tiếng Việt; “nổi lên” giữ được sắc thái trận bão bắt đầu xuất hiện.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: một trận cuồng phong dữ dội
  rationale: λαῖλαψ chỉ một cơn dông hoặc bão gió mạnh; ἀνέμου xác định đây là hiện tượng do gió, còn μεγάλη nhấn mạnh cường độ. Cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τὰ κύματα
  choice: sóng
  rationale: “Sóng” là từ thông dụng, chính xác và phù hợp với cảnh trên hồ; tiếng Việt không cần biểu thị mạo từ xác định.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: cứ ập vào thuyền
  rationale: Động từ ở thì vị hoàn diễn tả hành động tiếp diễn hoặc lặp lại. “Cứ ập vào” thể hiện nhiều đợt sóng liên tục vừa va mạnh vừa tràn vào thuyền.
- source_word: τὸ πλοῖον
  choice: thuyền
  rationale: “Thuyền” phù hợp với loại phương tiện trên hồ Ga-li-lê hơn “tàu” và tự nhiên trong tiếng Việt.
- source_word: ὥστε
  choice: khiến
  rationale: Liên từ giới thiệu kết quả; “khiến” nối hai mệnh đề gọn và tự nhiên, đồng thời giữ rõ quan hệ nguyên nhân-kết quả.
- source_word: ἤδη
  choice: đã
  rationale: “Đã” diễn tả việc quá trình ngập nước lúc ấy đã bắt đầu và đang tiến triển.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: thuyền đã bắt đầu ngập nước
  rationale: Dạng nguyên mẫu hiện tại trung động/bị động mô tả quá trình thuyền đang đầy lên. “Bắt đầu ngập nước” diễn đạt tự nhiên kết quả thực tế mà không áp đặt tác nhân, dù ít sát hình thức hơn “đang được làm đầy”.
