  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: vi
  text: 'Ngài lại nói: “Chúng ta nên ví vương quốc Đức Chúa Trời như thế nào, hay dùng dụ ngôn nào để trình bày điều ấy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: lại nói
  rationale: Thì vị hoàn thành trong mạch tường thuật có thể diễn tả lời nói đang tiếp diễn hoặc lặp lại; trong tiếng Việt, “lại nói” tự nhiên và nối lời này với chuỗi lời dạy trước đó mà không làm câu nặng nề.
- source_word: Πῶς ὁμοιώσωμεν
  choice: Chúng ta nên ví ... với điều gì
  rationale: Động từ ở thức giả định trong câu hỏi cân nhắc được diễn đạt tự nhiên bằng “nên”; cấu trúc tiếng Việt “ví ... với điều gì” truyền đạt rõ hành động so sánh, dù Πῶς theo sát chữ là “thế nào”.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Giữ hình ảnh và phạm vi nghĩa truyền thống của βασιλεία, đồng thời dùng cách gọi Đức Chúa Trời trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν τίνι παραβολῇ
  choice: dùng dụ ngôn nào
  rationale: ἐν với cách dữ liệu ở đây có thể mang nghĩa phương tiện; “dùng ... nào” là cách diễn đạt tiếng Việt tự nhiên, đồng thời giữ sự lựa chọn phương tiện diễn tả.
- source_word: παραβολῇ
  choice: dụ ngôn
  rationale: “Dụ ngôn” là thuật ngữ đã được xác lập, chính xác với thể loại lời dạy trong các sách Tin Mừng.
- source_word: αὐτὴν ... θῶμεν
  choice: để trình bày vương quốc ấy
  rationale: Trong thành ngữ này, τίθημι mang nghĩa đặt ra hoặc trình bày bằng một dụ ngôn. Lặp “vương quốc ấy” làm rõ đại từ αὐτήν và tránh đại từ tiếng Việt mơ hồ.
theological_decisions:
- issue: Phạm vi nghĩa của βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: sự trị vì của Đức Chúa Trời
  rationale: “Vương quốc” bảo toàn hình ảnh chính trị-hoàng gia và tính đa nghĩa của cụm từ, không thu hẹp nó chỉ còn hành động cai trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dạng câu hỏi cân nhắc ở ngôi thứ nhất số nhiều của nguyên văn; dùng “Ngài” theo ngữ cảnh chỉ Chúa Giê-su. Không cần chú thích vì sắc thái phương tiện của ἐν đã được thể hiện trực tiếp bằng “dùng”.
