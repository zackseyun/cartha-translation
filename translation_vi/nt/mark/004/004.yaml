  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: vi
  text: Khi người ấy đang gieo, một số hạt giống rơi bên lối đi,[a] chim đến ăn sạch số hạt ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dọc theo lối đi.” Cụm từ Hy Lạp chỉ vị trí sát bên hoặc dọc theo lối đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Khi người đang gieo
  rationale: Cấu trúc tường thuật này diễn tả điều xảy ra trong lúc gieo; cách dịch tự nhiên trong tiếng Việt giữ được ý nghĩa thời gian mà không cần dịch cứng là “chuyện xảy ra là”.
- source_word: ὃ μὲν
  choice: một số hạt
  rationale: Đại từ trung tính cùng μέν chỉ một phần trong số hạt giống đang được gieo. Tiếng Việt cần nêu rõ đối tượng; “một số hạt” truyền đạt tự nhiên sắc thái phân chia.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Tương ứng trực tiếp và tự nhiên với động từ πίπτω trong ngữ cảnh này.
- source_word: παρὰ τὴν ὁδόν
  choice: dọc theo lối đi
  rationale: παρά với đối cách ở đây chỉ vị trí sát bên hoặc dọc theo. “Lối đi” phù hợp với bối cảnh đồng ruộng hơn “đường cái”, đồng thời vẫn giữ được phạm vi nghĩa của cụm Hy Lạp.
- source_word: τὰ πετεινὰ
  choice: chim chóc
  rationale: Danh từ chỉ các loài chim nói chung; “chim chóc” là cách gọi tập thể tự nhiên trong tiếng Việt và không thêm cụm “trên trời” vốn không có trong câu Hy Lạp này.
- source_word: κατέφαγεν
  choice: ăn sạch
  rationale: Động từ ghép κατεσθίω mạnh hơn nghĩa đơn thuần “ăn”; “ăn sạch” tự nhiên trong tiếng Việt và giữ được ý nhấn mạnh rằng số hạt ấy bị ăn hết.
- source_word: αὐτό
  choice: được hàm trong “ăn sạch”
  rationale: Đại từ số ít chỉ phần hạt giống như một tập hợp. Tiếng Việt tự nhiên có thể lược tân ngữ khi đối tượng đã rõ; kết cấu “ăn sạch” vẫn truyền đạt đầy đủ rằng chim ăn hết số hạt ấy.
