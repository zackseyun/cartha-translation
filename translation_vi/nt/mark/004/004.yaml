translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người” để chỉ người gieo đã được nêu trong ngữ cảnh, tránh bổ sung danh xưng không có trong câu. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
