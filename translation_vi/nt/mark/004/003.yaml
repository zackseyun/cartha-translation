  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và ý nghĩa của câu Hy Lạp: mệnh lệnh kêu gọi chú ý (Ἀκούετε), tiểu từ thu hút sự chú ý (ἰδού), hành động đã xảy ra của người gieo (ἐξῆλθεν), danh ngữ chỉ vai trò (ὁ σπείρων), và mục đích (σπεῖραι). “Đi ra để gieo” phản ánh đúng quan hệ động từ chính–nguyên mẫu chỉ mục đích.'
