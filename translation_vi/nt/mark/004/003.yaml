  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: vi
  text: Hãy lắng nghe! Kìa, người gieo giống đi ra để gieo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Hãy lắng nghe!
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều, dùng để kêu gọi người nghe chú ý. “Hãy lắng nghe!” tự nhiên trong tiếng Việt hiện đại và giữ được lực mệnh lệnh.
- source_word: ἰδού
  choice: Kìa,
  rationale: Tiểu từ diễn ngôn hướng sự chú ý đến điều sắp được kể. “Kìa” giữ được sắc thái gợi người nghe nhìn và chú ý, đồng thời trang trọng mà vẫn dễ hiểu.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Động từ aorist chỉ chuyển động từ bên trong ra ngoài; “đi ra” là cách diễn đạt trực tiếp và tự nhiên trong ngữ cảnh.
- source_word: ὁ σπείρων
  choice: người gieo giống
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ người đảm nhiệm việc gieo. “Người gieo giống” rõ nghĩa và quen thuộc hơn cách dịch sát hình thức “người đang gieo”.
- source_word: σπεῖραι
  choice: để gieo
  rationale: Động từ nguyên mẫu aorist diễn tả mục đích của việc đi ra. “Để gieo” truyền đạt trực tiếp quan hệ mục đích và giữ sự lặp từ của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hai lời gọi chú ý riêng biệt ở đầu câu, đồng thời bảo toàn phép lặp giữa “người gieo giống” và “để gieo” trong tiếng Hy Lạp.
