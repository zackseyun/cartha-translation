  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: vi
  text: Ngài giảng lời cho họ bằng nhiều dụ ngôn như thế, tùy theo khả năng họ có thể nghe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tùy theo mức họ có thể nghe được.” “Lời” cũng có thể được hiểu là “sứ điệp” hoặc “sự dạy dỗ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: như thế
  rationale: Cụm từ này tự nhiên trong tiếng Việt và chỉ về loại dụ ngôn vừa được nêu trước đó, giữ được sắc thái quy chiếu của tính từ Hy Lạp.
- source_word: παραβολαῖς
  choice: dụ ngôn
  rationale: Đây là thuật ngữ tiếng Việt quen thuộc và chính xác trong ngữ cảnh các câu chuyện, hình ảnh so sánh dùng để giảng dạy của Chúa Giê-su.
- source_word: πολλαῖς
  choice: nhiều
  rationale: Diễn đạt trực tiếp số lượng và bổ nghĩa tự nhiên cho “dụ ngôn”.
- source_word: ἐλάλει
  choice: giảng
  rationale: Trong ngữ cảnh Chúa Giê-su truyền đạt nội dung dạy dỗ bằng dụ ngôn, “giảng” tự nhiên hơn cách dịch máy móc là “nói”, nhưng không thu hẹp nội dung thành một hành vi kỹ thuật. Tiếng Việt không bắt buộc đánh dấu thì; cách diễn đạt vẫn phù hợp với thể chưa hoàn thành của động từ Hy Lạp.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Diễn đạt tự nhiên đối tượng tiếp nhận của hành động giảng.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Giữ hình ảnh “lời” của nguyên văn và âm hưởng đặc trưng trong sách Mác, đồng thời “ấy” cho thấy đây là nội dung được truyền đạt trong văn cảnh. Chú thích nêu các cách hiểu tự nhiên hơn về mặt nghĩa.
- source_word: καθὼς
  choice: tùy theo mức
  rationale: Diễn tả quan hệ tương ứng về mức độ giữa cách Chúa Giê-su giảng và khả năng nghe của người nghe.
- source_word: ἠδύναντο
  choice: có thể
  rationale: Chuyển tải trực tiếp ý nghĩa về khả năng mà không thêm nguyên nhân hay phán đoán về thái độ của họ.
- source_word: ἀκούειν
  choice: nghe được
  rationale: Giữ nghĩa bề mặt của động từ là “nghe”, thay vì diễn giải thành “hiểu” hay “tiếp nhận”; “được” kết hợp tự nhiên với ý nói về khả năng.
theological_decisions:
- issue: Ý nghĩa của τὸν λόγον trong chức vụ giảng dạy của Chúa Giê-su
  choice: Dịch là “lời ấy” trong chính văn.
  alternative: “sứ điệp ấy” hoặc “sự dạy dỗ ấy”
  rationale: Cụm từ chỉ nội dung Chúa Giê-su công bố hoặc giảng dạy. “Lời ấy” giữ gần cách diễn đạt Hy Lạp và âm hưởng Kinh Thánh mà không áp đặt một nghĩa giáo lý hẹp; chú thích bảo lưu các cách hiểu khả dĩ.
- issue: Hàm ý của ἀκούειν
  choice: Dịch là “nghe được”.
  alternative: “hiểu được” hoặc “tiếp nhận được”
  rationale: Nguyên văn nói đến khả năng nghe. Dù trong văn cảnh “nghe” có thể bao hàm sự lĩnh hội, bản dịch không tự ý giải quyết căng thẳng này bằng một từ mang tính diễn giải mạnh hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối diễn đạt kính trọng phổ biến. Trật tự câu được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt, nhưng vẫn giữ đầy đủ phương tiện giảng dạy, nội dung, đối tượng và giới hạn về khả năng nghe.
