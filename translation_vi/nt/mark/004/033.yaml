revisions:
- from: Ngài dùng nhiều dụ ngôn như thế mà giảng lời ấy[a] cho họ, tùy theo mức họ có thể nghe được[b].
  to: Ngài giảng lời cho họ bằng nhiều dụ ngôn như thế, tùy theo khả năng họ có thể nghe[a].
  rationale: Bản sửa đặt hành động chính là việc Ngài giảng/truyền đạt “lời” cho họ, còn nhiều dụ ngôn như thế là cách thức của việc ấy. Cách diễn đạt này giữ được nghĩa của παραβολαῖς, λόγον và quan hệ mức độ của καθὼς ἠδύναντο ἀκούειν, đồng thời tự nhiên hơn trong tiếng Việt. Chú thích được gộp vào một neo vì cả hai là phương án từ vựng/liên kết trực tiếp trong cùng câu và không có yêu cầu phải giữ số lượng neo của bản tiếng Anh.
  reviewer_model: gpt-5.6-terra
