  terminology: “Lời,” “tiếp nhận,” và “sinh hoa kết quả” phù hợp với thuật ngữ lặp lại trong Mác 4, giữ ẩn dụ mà không áp đặt diễn giải thần học. Chú thích cho παραδέχονται phù hợp và neo [a] đúng vị trí.
  issues:
