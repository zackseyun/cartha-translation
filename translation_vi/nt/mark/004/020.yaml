source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: vi
  text: Còn những người được gieo trên đất tốt là những người nghe lời, tiếp nhận lời ấy[a] và sinh hoa kết quả—gấp ba mươi, gấp sáu mươi và gấp một trăm lần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chấp nhận lời ấy” hoặc “đón nhận lời ấy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: những người
  rationale: Đại từ chỉ nhóm cuối cùng được nhắc lại trong phần giải thích dụ ngôn; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sự đối chiếu với các nhóm trước.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: những người được gieo trên đất tốt
  rationale: Giữ thể bị động và hình ảnh gieo hạt của nguyên văn, đồng thời dùng cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: γῆν τὴν καλὴν
  choice: đất tốt
  rationale: Trong ngữ cảnh nông nghiệp, γῆ chỉ đất trồng; 'đất tốt' tự nhiên và duy trì sự tương phản giữa các loại đất.
- source_word: ἀκούουσιν τὸν λόγον
  choice: nghe lời
  rationale: Giữ thuật ngữ 'lời' được lặp lại xuyên suốt Mác 4 và không diễn giải quá mức thành một nội dung thần học cụ thể hơn.
- source_word: παραδέχονται
  choice: tiếp nhận lời ấy
  rationale: Diễn đạt sự đón nhận thuận tình; bổ sung 'lời ấy' để đối tượng của động từ rõ ràng và tự nhiên trong tiếng Việt.
- source_word: καρποφοροῦσιν
  choice: sinh hoa kết quả
  rationale: Thành ngữ tiếng Việt quen thuộc vẫn giữ nguyên ẩn dụ nông nghiệp và hàm ý thuộc linh mà không giải thích thêm.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: người được ba mươi lần, người được sáu mươi lần, người được một trăm lần
  rationale: Làm rõ các mức sản lượng gắn với từng trường hợp, đồng thời duy trì nhịp lặp của nguyên văn và ý nghĩa tăng gấp nhiều lần.
theological_decisions:
- issue: Bản chất của sự đáp ứng đối với lời nơi đất tốt
  choice: Câu này mô tả việc thật sự nghe, tiếp nhận lời và sinh hoa kết quả.
  alternative: Diễn giải nhóm đất tốt như một khẳng định tất yếu về sự bền đỗ cuối cùng, hoặc chỉ như một phản ứng ban đầu.
  rationale: Nguyên văn chỉ nêu chuỗi nghe, tiếp nhận và sinh hoa kết quả; bản dịch không áp đặt một hệ thống giáo lý vượt quá điều câu này nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ ẩn dụ gieo hạt, thể bị động và chuỗi hành động của nguyên văn; dấu gạch ngang giúp dẫn vào ba mức sản lượng.
