  source_fidelity: 'Bản dịch giữ đúng chuỗi chính của nguyên văn: nhóm được gieo trên đất tốt, nghe lời, tiếp nhận lời và sinh kết quả. Tuy nhiên, cụm “người được ba mươi lần...” thêm chủ thể “người” và dùng cấu trúc không phù hợp với παραγωγή/yield trong ngữ cảnh nông nghiệp. Nguyên văn mô tả mức kết quả, không phân chia thành những người ‘được’ các mức ấy.'
