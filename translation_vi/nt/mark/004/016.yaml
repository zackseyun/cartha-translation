source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: vi
  text: 'Cũng vậy, đây là những người được gieo trên đất đá: khi nghe lời, họ lập tức vui mừng tiếp nhận lời ấy;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: cũng vậy
  rationale: Giữ mối liên kết so sánh với phần giải thích trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπὶ τὰ πετρώδη
  choice: trên nơi đất đá
  rationale: Diễn đạt địa điểm có nhiều đá hoặc lớp đá bên dưới, giữ nguyên hình ảnh nông nghiệp và không thêm cách giải thích về tấm lòng.
- source_word: σπειρόμενοι
  choice: những người được gieo
  rationale: Giữ dạng bị động và cách nói ẩn dụ có chủ ý trong lời giải thích dụ ngôn, dù đối tượng được chỉ đến là con người.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Giữ thuật ngữ λόγος và dùng đại từ chỉ định để câu tiếng Việt tự nhiên, quy chiếu về lời đã được nói đến trong ngữ cảnh.
- source_word: εὐθύς
  choice: lập tức
  rationale: Thể hiện đầy đủ tính tức thời và phù hợp với nét văn phong lặp lại của Mác.
- source_word: μετὰ χαρᾶς
  choice: vui mừng
  rationale: Diễn đạt tự nhiên cách thức họ tiếp nhận lời, không làm thay đổi nội dung cảm xúc.
- source_word: λαμβάνουσιν αὐτόν
  choice: tiếp nhận
  rationale: Phản ánh ý nhận lấy hoặc đón nhận lời, nhưng không hàm ý rằng sự đáp ứng ấy nhất thiết bền vững.
theological_decisions:
- issue: Đối tượng của cách nói “những người được gieo” trong phần giải thích dụ ngôn
  choice: Giữ nguyên cách nói ẩn dụ “những người được gieo trên nơi đất đá”.
  alternative: Diễn giải thành “những người có lòng giống như đất đá”.
  rationale: Bản Hy Lạp đồng nhất những người này với điều được gieo mà không thêm từ “lòng”; giữ nguyên sức căng của hình ảnh và tránh đưa lời giải thích thần học vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc dụ ngôn cùng thuật ngữ lặp lại; dấu chấm phẩy phản ánh câu còn tiếp nối sang ý sau.
