revisions:
- from: Cũng vậy, những người được gieo trên nơi đất đá là những người khi nghe lời ấy thì lập tức vui mừng tiếp nhận;
  to: 'Cũng vậy, đây là những người được gieo trên đất đá: khi nghe lời, họ lập tức vui mừng tiếp nhận lời ấy;'
  rationale: Bản sửa thay địa điểm không tự nhiên bằng “trên đất đá,” điều chỉnh trật tự từ cho tiếng Việt trôi chảy, và thêm “đây là” để phản ánh rõ cấu trúc giải thích “these are.” Bản dịch vẫn giữ hình ảnh ẩn dụ “những người được gieo,” không thêm diễn giải về tấm lòng, và giữ dấu chấm phẩy vì câu tiếp tục ở câu kế tiếp.
  reviewer_model: gpt-5.6-terra
