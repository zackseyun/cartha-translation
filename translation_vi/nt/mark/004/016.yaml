    issue: Cụm “trên nơi đất đá” không tự nhiên và thừa từ “nơi.”
    rationale: ἐπὶ τὰ πετρώδη chỉ địa điểm/loại đất đá; “trên đất đá” là cách diễn đạt hiện đại, rõ ràng hơn mà không thay đổi hình ảnh nông nghiệp.
  - severity: low
    issue: Trật tự “lập tức vui mừng tiếp nhận” hơi gượng trong tiếng Việt.
    rationale: Đưa “vui mừng” vào trước động từ tiếp nhận tạo nhịp tự nhiên hơn, vẫn giữ cả εὐθύς lẫn μετὰ χαρᾶς.
