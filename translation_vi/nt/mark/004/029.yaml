base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: vi
  text: Nhưng khi hoa màu đã sẵn sàng[a], người ấy lập tức tra liềm vào, vì mùa gặt đã đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho thu hoạch” hoặc “đã chín”; sát chữ hơn: “tự giao nộp mình.” Tiếng Hy Lạp dùng một cách diễn đạt chủ động khác thường, trong đó “hoa màu” là chủ ngữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nhưng khi
  rationale: ὅταν mở đầu một mệnh đề thời gian không xác định, còn δέ đánh dấu sự chuyển ý nhẹ; “Nhưng khi” vừa tự nhiên vừa giữ được diễn tiến của lời kể.
- source_word: παραδοῖ
  choice: đã sẵn sàng
  rationale: παραδίδωμι thường có nghĩa là “trao, giao nộp,” nhưng ở đây chủ ngữ là hoa màu, nên diễn tả lúc cây trồng tự cho thấy có thể thu hoạch. “Đã sẵn sàng” truyền đạt đúng ý trong ngữ cảnh; chú thích giữ lại cách diễn đạt chủ động khác thường của tiếng Hy Lạp.
- source_word: ὁ καρπός
  choice: hoa màu
  rationale: καρπός có thể là “trái” hoặc “sản vật,” nhưng hình ảnh liềm và mùa gặt cho thấy cây trồng ngoài đồng. “Hoa màu” phù hợp mà không giới hạn vào một loại ngũ cốc cụ thể.
- source_word: εὐθὺς
  choice: lập tức
  rationale: Giữ sắc thái hành động tức thời, một nét đặc trưng trong lối kể của Mác.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: tra liềm vào
  rationale: Nguyên văn là “sai/gửi chiếc liềm,” một cách nói sinh động chỉ việc bắt đầu gặt. “Tra liềm vào” là thành ngữ nông nghiệp tự nhiên trong tiếng Việt và vẫn giữ hình ảnh chiếc liềm được đưa vào ruộng.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu lý do cho hành động tức thời; “vì” ngắn gọn và rõ ràng.
- source_word: παρέστηκεν
  choice: đã đến
  rationale: Thì hoàn thành diễn tả mùa gặt đã đến và hiện đang ở đó; “đã đến” giữ được cả sự kiện lẫn trạng thái hiện tại.
- source_word: ὁ θερισμός
  choice: mùa gặt
  rationale: θερισμός chỉ việc gặt hoặc kỳ thu hoạch; “mùa gặt” tự nhiên trong ngữ cảnh và phân biệt rõ với “hoa màu.”
theological_decisions:
- issue: Sự sẵn sàng mang tính ẩn dụ của hoa màu trong dụ ngôn về vương quốc
  choice: Giữ nguyên hình ảnh nông nghiệp, diễn đạt hoa màu đã sẵn sàng để gặt.
  alternative: Diễn giải mùa gặt cụ thể là sự phán xét, công cuộc truyền giáo hoặc thời kỳ hoàn tất.
  rationale: Câu Hy Lạp không xác định rõ đối tượng thần học của mùa gặt. Bản dịch không nên đưa một cách giải nghĩa riêng vào chính văn, nhưng chú thích cần bảo tồn nét diễn đạt khác thường của παραδοῖ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hoa màu,” “tra liềm vào” và “mùa gặt” duy trì nhất quán trường hình ảnh nông nghiệp; chú thích bảo tồn sự khác thường và độ mở nghĩa của nguyên văn.
