  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: vi
  text: 'Còn chính Người ở đằng lái, trên chiếc gối, đang ngủ. Họ đánh thức Người và nói với Người: “Thầy ơi, Thầy không quan tâm đến việc chúng ta đang chết mất sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: chính Người ở
  rationale: Đại từ αὐτός được nêu rõ mang sắc thái nhấn mạnh và tương phản; “chính Người” giữ được lực ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ πρύμνῃ
  choice: ở đằng lái
  rationale: πρύμνα chỉ phần đuôi của thuyền. “Đằng lái” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt và phù hợp với bối cảnh thuyền.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: trên chiếc gối
  rationale: προσκεφάλαιον chỉ vật dùng để kê đầu, có thể là gối hoặc đệm kê đầu. “Chiếc gối” ngắn gọn, tự nhiên và không thêm chi tiết về tư thế mà nguyên文 không nói rõ.
- source_word: καθεύδων
  choice: đang ngủ
  rationale: Phân từ hiện tại diễn tả trạng thái đang tiếp diễn của Chúa Giê-su lúc ấy; “đang ngủ” thể hiện rõ sắc thái này.
- source_word: ἐγείρουσιν
  choice: đánh thức
  rationale: Động từ hiện tại lịch sử được chuyển thành lối kể quá khứ theo mạch văn tiếng Việt; “đánh thức” chính xác và tự nhiên.
- source_word: λέγουσιν
  choice: nói
  rationale: Đây cũng là hiện tại lịch sử. Tiếng Việt không bắt buộc biến đổi hình thái thì; “nói” trong chuỗi kể đã xảy ra là tự nhiên.
- source_word: Διδάσκαλε
  choice: Thầy ơi
  rationale: διδάσκαλος nghĩa là người dạy hay thầy. Hư từ “ơi” biểu đạt trực tiếp cách xưng hô và sự khẩn cấp mà không đổi nghĩa danh xưng.
- source_word: οὐ μέλει σοι
  choice: Thầy không quan tâm ... sao?
  rationale: Cách diễn đạt giữ nguyên câu hỏi mang sắc thái trách móc và khẩn cấp, không làm nhẹ lời của các môn đồ.
- source_word: ὅτι ἀπολλύμεθα
  choice: rằng chúng ta sắp chết
  rationale: Trong bối cảnh cơn bão, ἀπολλύμεθα diễn tả nguy cơ mất mạng đang cận kề. “Sắp chết” truyền đạt tự nhiên tính khẩn cấp, còn “rằng” giữ quan hệ mệnh đề do ὅτι biểu thị.
theological_decisions:
- issue: Sắc thái lời các môn đồ chất vấn Chúa Giê-su
  choice: 'Giữ câu hỏi trực diện: “Thầy không quan tâm rằng chúng ta sắp chết sao?”'
  alternative: 'Làm nhẹ thành: “Thầy không lo là chúng ta có thể gặp nguy hiểm sao?”'
  rationale: Nguyên văn có giọng khẩn cấp và trách móc rõ rệt. Bản dịch giữ nguyên sự căng thẳng trong câu chuyện, không giải thích động cơ của Chúa Giê-su hay đánh giá đức tin của các môn đồ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” cho đại từ kể chuyện về Chúa Giê-su và “Thầy” trong lời xưng hô của các môn đồ. “Đằng lái” được ưu tiên hơn thuật ngữ hàng hải chuyên biệt “đuôi thuyền”; cấu trúc câu hỏi được giữ sắc bén theo nguyên văn.
