revisions:
- from: 'Còn đây là những người ở dọc đường, nơi lời được gieo: khi họ nghe, Sa-tan lập tức đến lấy đi lời đã được gieo trong lòng họ.[a]'
  to: 'Còn đây là những người ở bên đường, nơi lời được gieo: khi họ nghe, Sa-tan lập tức đến và lấy đi lời đã được gieo trong họ.[a]'
  rationale: Đổi “ở dọc đường” thành “ở bên đường” để phản ánh chính xác vị trí do παρὰ τὴν ὁδόν chỉ định. Đổi “trong lòng họ” thành “trong họ” để không thêm hình ảnh “lòng” vào nguyên văn; chú thích tiếp tục nêu phương án sát chữ “vào họ”. Các yếu tố còn lại của bản nháp phù hợp với tiếng Hy Lạp và văn phong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:39:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc giải thích dụ ngôn, tính tức thời của εὐθύς, và tác nhân có ngôi vị là Sa-tan. Tuy nhiên, “ở dọc đường” dễ gợi những người ở/trên suốt tuyến đường hơn là vị trí “bên đường” của παρὰ τὴν ὁδόν. “Trong lòng họ” là một diễn giải tự nhiên nhưng thêm hình ảnh “lòng” không có trong nguyên văn; chú thích đã bảo lưu cách hiểu sát hơn, nên có thể giữ câu chính với cách nói tự nhiên nhưng không thêm danh từ này.
  naturalness: “Bên đường” là cách nói hiện đại, tự nhiên và đúng hình ảnh đất cạnh đường trong dụ ngôn hơn “dọc đường”. Câu được chỉnh nhẹ để vẫn trôi chảy trong tiếng Việt hiện đại.
  terminology: Giữ nhất quán “lời” cho λόγος, “gieo” cho σπείρω, “Sa-tan” cho Σατανᾶς, và “lấy đi” cho αἴρω. Không áp đặt diễn giải giáo phái.
  issues:
  - severity: medium
    issue: “Ở dọc đường” chưa phản ánh chính xác nhất παρὰ τὴν ὁδόν.
    rationale: Giới từ παρά với đối cách tại đây chỉ vị trí ở cạnh/bên con đường. “Dọc đường” trong tiếng Việt có thể chỉ sự trải dài theo đường hoặc vị trí trên đường; “bên đường” rõ và sát hình ảnh hơn.
  - severity: low
    issue: “Trong lòng họ” thêm hình ảnh “lòng” vào câu chính.
    rationale: εἰς αὐτούς nghĩa là “vào họ”; nguyên văn không nêu καρδία (“lòng”). Có thể dùng “trong họ” để tránh thêm một bộ phận/cơ quan tâm lý, đồng thời chú thích giữ sắc thái hướng vào của εἰς.
