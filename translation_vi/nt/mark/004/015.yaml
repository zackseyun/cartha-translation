source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: vi
  text: 'Còn đây là những người ở bên đường, nơi lời được gieo: khi họ nghe, Sa-tan lập tức đến và lấy đi lời đã được gieo trong họ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “đã được gieo vào họ.”'
    reason: Giữ lại sắc thái hướng vào của εἰς αὐτούς, trong khi câu chính dùng cách diễn đạt tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: Còn đây là
  rationale: Diễn đạt chức năng nhận diện của οὗτοι ... εἰσιν; “Còn” giữ liên kết chuyển ý nhẹ của δέ mà không biến nó thành một sự tương phản mạnh.
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: những người ở dọc đường
  rationale: παρά với đối cách chỉ vị trí bên đường; cách dịch này giữ hình ảnh trong dụ ngôn và cho thấy Chúa Giê-su đang nói về những người được hình ảnh ấy tượng trưng.
- source_word: σπείρεται ὁ λόγος
  choice: lời được gieo
  rationale: Giữ phép ẩn dụ gieo hạt và thể bị động của tiếng Hy Lạp; “lời” bảo toàn sự lặp lại của λόγος trong câu.
- source_word: ὅταν ἀκούσωσιν
  choice: khi họ nghe
  rationale: ὅταν với động từ giả định diễn tả tình huống có tính khái quát; “khi họ nghe” tự nhiên và không thêm đối tượng ngoài nguyên văn.
- source_word: εὐθύς
  choice: lập tức
  rationale: Giữ sắc thái tức thời, nổi bật trong lối kể của Mác.
- source_word: ὁ Σατανᾶς
  choice: Sa-tan
  rationale: Phiên âm danh xưng riêng chỉ nhân vật có ngôi vị, phù hợp cách dùng trực tiếp trong câu.
- source_word: αἴρει
  choice: lấy đi
  rationale: Phản ánh nghĩa rộng của động từ là lấy hoặc loại bỏ, không tăng cường thành “cướp giật” khi nguyên văn không bắt buộc.
- source_word: τὸν λόγον τὸν ἐσπαρμένον εἰς αὐτούς
  choice: lời đã được gieo trong lòng họ
  rationale: Giữ sự lặp lại của “lời” và phân từ bị động. “Trong lòng họ” là cách nói tiếng Việt tự nhiên cho sự tiếp nhận nội tâm, còn sắc thái sát chữ của εἰς αὐτούς được ghi ở chú thích.
theological_decisions:
- issue: Tác nhân có ngôi vị của Sa-tan trong lời giải thích dụ ngôn
  choice: Dịch ὁ Σατανᾶς trực tiếp là “Sa-tan”, nhân vật đến và lấy lời đi.
  alternative: Dịch phi nhân cách hóa là “kẻ chống đối” hoặc hiểu như một sức mạnh trừu tượng.
  rationale: Mạo từ đi với danh xưng Σατανᾶς ở đây tự nhiên chỉ một tác nhân có ngôi vị; bản dịch không nên làm giảm hay giải thích lại chiều kích này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nhất quán hình ảnh “gieo” và danh từ “lời”; dùng “ở dọc đường” để nối tự nhiên với hình ảnh địa điểm trong dụ ngôn.
