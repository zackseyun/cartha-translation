revisions:
- from: 'Rồi Ngài nói với họ: “Sao các con nhát sợ[a] thế? Các con vẫn chưa có đức tin[b][c] sao?”'
  to: 'Rồi Ngài nói với họ: “Sao các con lại sợ hãi[a] thế? Các con vẫn chưa có đức tin[b][c] sao?”'
  rationale: Chỉ sửa "nhát sợ" thành "sợ hãi" để bản văn dùng tiếng Việt hiện đại tự nhiên hơn. Bản sửa vẫn phản ánh lời quở trách của δειλοί trong ngữ cảnh, còn khả năng dịch mạnh là "hèn nhát" được bảo lưu trong chú thích. Không thay đổi nghĩa của câu hay các neo chú thích.
