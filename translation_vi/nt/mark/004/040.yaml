  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: vi
  text: 'Rồi Ngài nói với họ: “Sao các con lại sợ hãi[a] thế? Các con vẫn chưa có đức tin[b][c] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch mạnh hơn là “hèn nhát.”
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ hơn: “Các con chưa có đức tin sao?”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp được dịch là “đức tin” ở đây cũng có thể được hiểu là “lòng tin” hay “sự tin cậy.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối lời phán với diễn biến ngay trước đó; “Rồi” tự nhiên trong văn kể chuyện tiếng Việt mà vẫn giữ quan hệ tiếp nối.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài nói với họ
  rationale: Diễn đạt trực tiếp động từ λέγω và đại từ tặng cách số nhiều; “Ngài” quy chiếu trang trọng, tự nhiên đến Chúa Giê-su trong ngữ cảnh.
- source_word: Τί
  choice: Sao
  rationale: Trong cấu trúc nghi vấn với tính từ và động từ “là,” Τί mang nghĩa nguyên nhân, tương đương cách hỏi quở trách “Sao...?” trong tiếng Việt.
- source_word: δειλοί
  choice: nhát sợ
  rationale: Giữ sắc thái tiêu cực mạnh hơn “sợ” đơn thuần nhưng tránh biến lời quở trách thành một phán quyết cố định về phẩm cách; nghĩa mạnh hơn “hèn nhát” được lưu ở chú thích.
- source_word: οὔπω
  choice: vẫn chưa
  rationale: Kết hợp đúng ý thời gian “chưa” với sắc thái tu từ rằng sau những gì đã xảy ra, tình trạng ấy vẫn còn tiếp diễn.
- source_word: ἔχετε
  choice: có
  rationale: Cách diễn đạt tự nhiên của tiếng Việt cho động từ chỉ trạng thái sở hữu trong câu “có đức tin.”
- source_word: πίστιν
  choice: đức tin
  rationale: “Đức tin” là thuật ngữ tiếng Việt quen thuộc và sát nghĩa cho πίστις; trong ngữ cảnh này nó cũng hàm ý tin cậy, được ghi nhận ở chú thích.
theological_decisions:
- issue: Nghĩa của πίστις trong lời quở trách giữa cơn bão
  choice: đức tin
  alternative: lòng tin hoặc sự tin cậy
  rationale: Danh từ Hy Lạp không nêu rõ đối tượng và có thể nhấn mạnh sự tin cậy nơi Chúa Giê-su trong lúc nguy nan. Bản chính giữ “đức tin” để không thu hẹp trường nghĩa, còn sắc thái “tin cậy” được nêu trong chú thích.
- issue: Mức độ mạnh của δειλοί
  choice: nhát sợ
  alternative: hèn nhát
  rationale: Từ Hy Lạp có thể mang nghĩa lên án mạnh là “hèn nhát,” nhưng ngữ cảnh trực tiếp là nỗi sợ của các môn đồ trước cơn bão. “Nhát sợ” giữ được lời quở trách mà không buộc câu này thành một nhận định bao quát về phẩm cách của họ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu hỏi ngắn giữ giọng quở trách trực tiếp của Chúa Giê-su; cách xưng hô “Ngài/các con” phù hợp văn cảnh thầy nói với môn đồ.
