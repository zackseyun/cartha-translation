  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: vi
  text: 'Ngài nói với họ: “Anh em đã được ban cho mầu nhiệm về Nước Đức Chúa Trời; còn những người ở ngoài, mọi điều đều đến qua các dụ ngôn,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: sự mầu nhiệm
  rationale: Chỉ điều trước kia được che giấu nhưng nay được Đức Chúa Trời bày tỏ; ‘mầu nhiệm’ giữ được chiều kích mặc khải mà không biến thành một câu đố đơn thuần.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: của vương quốc Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu của nguyên văn và dùng ‘vương quốc’ để diễn đạt βασιλεία trong ngữ cảnh quyền trị vì cùng lĩnh vực cai trị của Đức Chúa Trời.
- source_word: τοῖς ἔξω
  choice: những người ở ngoài
  rationale: Giữ nguyên hình ảnh phân định của bản Hy Lạp mà không giải thích thêm họ ở ngoài điều gì.
- source_word: ἐν παραβολαῖς
  choice: qua các ẩn dụ
  rationale: Giới từ ἐν ở đây có thể biểu thị phương thức; ‘qua’ tự nhiên trong tiếng Việt và phù hợp với γίνεται, đồng thời ‘ẩn dụ’ chỉ các câu chuyện minh họa mang ý nghĩa so sánh.
- source_word: τὰ πάντα γίνεται
  choice: mọi sự đều đến
  rationale: Giữ sắc thái động của γίνεται và tránh làm phẳng thành ‘mọi sự đều ở trong ẩn dụ’; cách nói cũng bảo toàn độ căng và nét khó của câu gốc.
theological_decisions:
- issue: Tính thụ động trong δέδοται
  choice: đã được ban cho
  alternative: đã ban cho anh em
  rationale: Giữ thể thụ động thần học của nguyên văn, hàm ý Đức Chúa Trời là Đấng ban nhưng không tự ý thêm chủ thể.
- issue: Quan hệ giữa người ở ngoài và các ẩn dụ
  choice: mọi sự đều đến qua các ẩn dụ
  alternative: mọi sự đều được trình bày bằng ẩn dụ
  rationale: Không giải thích câu theo một hệ thần học cụ thể; giữ cấu trúc khái quát và phần nào khó hiểu của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ cho Chúa Giê-su theo mạch văn; ‘anh em’ phân biệt nhóm môn đồ với ‘những người ở ngoài’. Không thêm chú thích vì bản dịch không cần phương án dị bản hoặc giải thích bắt buộc tại câu này.
