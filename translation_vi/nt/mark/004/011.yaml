revisions:
- from: 'Ngài nói với họ: “Anh em đã được ban cho sự mầu nhiệm của vương quốc Đức Chúa Trời; còn đối với những người ở ngoài, mọi sự đều đến qua các ẩn dụ,”'
  to: 'Ngài nói với họ: “Anh em đã được ban cho mầu nhiệm về Nước Đức Chúa Trời; còn những người ở ngoài, mọi điều đều đến qua các dụ ngôn,”'
  rationale: Bản sửa thay thuật ngữ thể loại không chính xác “ẩn dụ” bằng “dụ ngôn,” chỉnh các kết hợp từ cho tiếng Việt hiện đại tự nhiên hơn, và vẫn giữ thể thụ động của δέδοται, sự đối lập giữa “anh em” với “những người ở ngoài,” cùng lối diễn đạt động, không giải thích thêm, của τὰ πάντα γίνεται.
  reviewer_model: gpt-5.6-terra
