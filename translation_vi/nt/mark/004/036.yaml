translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các môn đồ” để làm rõ chủ ngữ ngầm theo ngữ cảnh; dùng đại từ “Ngài” theo lối văn Kinh Thánh tiếng Việt tôn kính. Dấu chấm phẩy giúp tách ghi chú về các thuyền khác khỏi hành động chính.
