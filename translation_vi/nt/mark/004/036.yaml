  source_fidelity: Bản dịch truyền đạt đúng diễn tiến chính của câu và giữ được chi tiết về các thuyền khác. Tuy nhiên, cụm “nguyên như Ngài đang ở trong thuyền” không tự nhiên trong tiếng Việt hiện đại. Cách sửa “cứ để Ngài ở trong thuyền như vậy mà đưa đi” phản ánh rõ cấu trúc ὡς ἦν ἐν τῷ πλοίῳ mà không buộc phải chọn dứt khoát giữa sắc thái Ngài đã ở sẵn trong thuyền và sắc thái không có sự chuẩn bị thêm.
