base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: vi
  text: Sau khi rời đám đông, họ cứ để Ngài ở trong thuyền như vậy mà đưa đi[a]; còn có những thuyền khác đi cùng Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể hiểu: “họ đưa Ngài đi đúng như Ngài đang ở trong thuyền.” Cụm Hy Lạp có thể nhấn mạnh rằng Ngài vốn đã ở trong thuyền, hoặc rằng họ đưa Ngài đi mà không có sự chuẩn bị thêm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: Sau khi rời
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên và không hàm ý một nghi thức giải tán chính thức.
- source_word: τὸν ὄχλον
  choice: đám đông
  rationale: Diễn đạt thông dụng, chính xác cho một đoàn người đang tụ họp.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: các môn đồ đưa Ngài đi cùng
  rationale: παραλαμβάνω ở đây mang nghĩa đem hoặc đưa một người theo cùng. Chủ ngữ ngầm được làm rõ là các môn đồ theo ngữ cảnh, còn “Ngài” giữ văn phong tôn kính.
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: nguyên như Ngài đang ở trong thuyền
  rationale: 'Giữ gần trật tự và độ mơ hồ của tiếng Hy Lạp: cụm từ có thể nhấn mạnh việc Chúa Giê-xu vốn đã ở trong thuyền hoặc việc họ đưa Ngài đi mà không chuẩn bị gì thêm.'
- source_word: ἄλλα πλοῖα
  choice: những thuyền khác
  rationale: Không thêm ý “nhỏ” vì nguyên văn không có tính từ tương ứng.
- source_word: ἦν μετ’ αὐτοῦ
  choice: đi cùng Ngài
  rationale: Trong ngữ cảnh chuyển động trên hồ, cách nói này tự nhiên hơn “ở với Ngài” và thể hiện việc các thuyền khác tháp tùng.
