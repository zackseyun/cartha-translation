id: MRK.16.18
reference: Mark 16:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: vi
  text: Họ sẽ nhặt rắn lên; dù có uống bất cứ thứ gì gây chết người, thì chắc chắn không làm hại họ. Họ sẽ đặt tay trên người bệnh, và người bệnh sẽ khỏe lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản Hy Lạp cổ không có Mác 16:9–20; câu này thuộc phần kết dài của sách Mác.
    reason: textual_variant
lexical_decisions:
- source_word: ὄφεις
  choice: rắn
  rationale: Từ thông dụng và tự nhiên trong tiếng Việt hiện đại, diễn đạt đầy đủ nghĩa của ὄφεις mà không cần dùng từ cổ hoặc văn chương hơn.
- source_word: ἀροῦσιν
  choice: sẽ cầm ... lên
  rationale: αἴρω có nghĩa là nhấc, cầm hoặc mang lên. Trong ngữ cảnh với rắn, “cầm ... lên” vừa tự nhiên vừa không hàm ý thêm rằng hành động ấy là cố ý thử nghiệm sự bảo vệ.
- source_word: κἂν
  choice: dù có
  rationale: καὶ ἐάν trong câu này có sắc thái nhượng bộ; “dù có” diễn đạt tự nhiên lực của mệnh đề giả định đi cùng lời phủ định nhấn mạnh.
- source_word: θανάσιμόν τι
  choice: thứ gì gây chết người
  rationale: 'Giữ phạm vi rộng của cụm Hy Lạp: bất cứ thứ gì có khả năng gây chết người, không thu hẹp riêng thành thuốc độc.'
- source_word: πίωσιν
  choice: uống phải
  rationale: “Uống phải” tự nhiên trong ngữ cảnh uống một thứ nguy hiểm và không nhất thiết hàm ý chủ ý; đây là cách diễn đạt theo ngữ cảnh, trong khi động từ Hy Lạp tự thân chỉ có nghĩa là “uống”.
- source_word: οὐ μὴ ... βλάψῃ
  choice: chắc chắn cũng không làm hại
  rationale: οὐ μή là lối phủ định nhấn mạnh mạnh; “chắc chắn ... không” bảo toàn lực khẳng định mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: sẽ đặt tay trên người bệnh
  rationale: Diễn đạt trực tiếp hành động đặt tay lên người đau yếu, rõ nghĩa đối với độc giả hiện đại và không thêm một cách giải thích nghi lễ.
- source_word: καλῶς ἕξουσιν
  choice: người bệnh sẽ khỏe lại
  rationale: Cụm này sát nghĩa là “sẽ được khỏe/sẽ ở trong tình trạng tốt.” Trong ngữ cảnh bệnh tật, “sẽ khỏe lại” diễn đạt kết quả tự nhiên; lặp lại “người bệnh” giúp tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Bản chất của sự bảo vệ và chữa lành được hứa
  choice: Dịch thẳng các hành động và kết quả ở thì tương lai, không thêm điều kiện hay giới hạn thần học.
  alternative: Giải thích các dấu lạ là phổ quát cho mọi tín hữu, chỉ thuộc thời các sứ đồ, hoặc hoàn toàn mang tính biểu tượng.
  rationale: Bản văn Hy Lạp không tự xác định những phạm vi diễn giải ấy; bản dịch cần giữ nguyên sức căng thần học thay vì quyết định thay cho người đọc.
- issue: Tình trạng văn bản của Mác 16:9–20
  choice: Dịch câu theo bản văn SBLGNT được cung cấp và nêu vấn đề thủ bản trong chú thích.
  alternative: Bỏ câu này hoặc đặt toàn câu trong ngoặc như một phán quyết biên tập.
  rationale: Câu được cung cấp để dịch, nhưng sự vắng mặt của đoạn kết dài trong một số thủ bản Hy Lạp cổ quan trọng là dữ kiện cần được minh bạch với độc giả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “rắn,” “gây chết người,” “đặt tay trên người bệnh” và “khỏe lại” thay cho các cách nói cổ hoặc quá chuyên biệt. Dấu chú thích [a] được đặt cuối câu để áp dụng cho toàn câu thuộc phần kết dài.
