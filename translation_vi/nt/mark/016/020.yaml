source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: vi
  text: Còn họ ra đi rao giảng khắp nơi, trong khi Chúa cùng làm việc với họ và xác nhận sứ điệp[a] qua những dấu lạ đi kèm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời”. Trong văn cảnh này, từ Hy Lạp λόγος chỉ nội dung được rao giảng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những dấu lạ theo sau”. Nguyên văn không nói rõ các dấu lạ đi kèm người rao giảng hay sứ điệp.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Còn họ
  rationale: Đại từ chỉ lại nhóm môn đồ vừa được nhắc đến; δέ nối tiếp lời thuật với một sắc thái chuyển ý nhẹ, nên “Còn họ” tự nhiên mà không tạo tương phản quá mạnh.
- source_word: ἐξελθόντες
  choice: ra đi
  rationale: Phân từ aorist diễn tả hành động đi kèm trước hành động chính; “ra đi” gọn và tự nhiên trong lời kể.
- source_word: ἐκήρυξαν πανταχοῦ
  choice: rao giảng khắp nơi
  rationale: κηρύσσω chỉ việc công bố công khai; “rao giảng” giữ sắc thái ấy trong văn cảnh truyền bá sứ điệp, còn πανταχοῦ được chuyển trực tiếp là “khắp nơi”.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: trong khi Chúa cùng làm việc với họ
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hành động đồng thời của Chúa. “Cùng làm việc với họ” giữ nghĩa συνεργέω và bổ sung “với họ” theo đối tượng đã hàm chứa trong văn cảnh.
- source_word: τὸν λόγον
  choice: sứ điệp
  rationale: λόγος ở đây chỉ nội dung được rao giảng, không chỉ một từ đơn lẻ. “Sứ điệp” sáng nghĩa trong tiếng Việt hiện đại; “lời” vẫn là một khả năng nên được ghi chú.
- source_word: βεβαιοῦντος
  choice: xác nhận
  rationale: βεβαιόω mang nghĩa làm cho vững chắc hoặc chứng thực; “xác nhận” diễn đạt đúng chức năng chứng thực trong câu.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: qua những dấu lạ đi kèm
  rationale: διά với sở hữu cách chỉ phương tiện. ἐπακολουθέω có thể là “đi theo sau” hoặc “đi kèm”; cách dịch chính giữ sự tự nhiên mà không chỉ rõ các dấu lạ đi kèm người rao giảng hay sứ điệp.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ danh xưng “Chúa”, với ngữ cảnh gần nhất hướng đến Chúa Giê-su phục sinh.
  alternative: Hiểu là Đức Chúa Trời nói chung.
  rationale: Mác 16:19 vừa gọi Chúa Giê-su là “Chúa”; tuy vậy, bản dịch không thêm tên riêng, nhờ đó giữ nguyên cách diễn đạt của nguyên văn.
- issue: Chức năng của các dấu lạ
  choice: Các dấu lạ là phương tiện qua đó Chúa xác nhận sứ điệp.
  alternative: Các dấu lạ chỉ đi theo sau mà không mang chức năng chứng thực rõ ràng.
  rationale: Cú pháp gắn cụm “qua những dấu lạ” với hành động “xác nhận”, nên chức năng chứng thực là ý nghĩa trực tiếp của câu; bản dịch không suy rộng về thời hạn hay tính chuẩn mực của các dấu lạ.
- issue: Đối tượng mà các dấu lạ “đi kèm”
  choice: Không nêu rõ trong chính văn các dấu lạ đi kèm người rao giảng hay sứ điệp.
  alternative: Nêu rõ “những dấu lạ đi kèm sứ điệp” hoặc “những dấu lạ theo sau họ”.
  rationale: Phân từ ἐπακολουθούντων bổ nghĩa cho “dấu lạ” nhưng không có đại từ chỉ rõ đối tượng. Giữ cách nói mở bảo tồn sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Rao giảng” phù hợp ngữ cảnh công bố công khai nhưng không dùng thuật ngữ giáo phái; “dấu lạ” giữ sắc thái Kinh Thánh quen thuộc của σημεῖον mà vẫn dễ hiểu.
