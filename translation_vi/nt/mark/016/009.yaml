revisions:
- from: Sau khi sống lại[a], vào sáng sớm ngày thứ nhất trong tuần, Đức Chúa Jêsus hiện ra trước hết với Ma-ri Ma-đơ-len, là người mà Ngài đã đuổi bảy quỷ ra khỏi.
  to: Sau khi sống lại[a], vào sáng sớm ngày thứ nhất trong tuần, Chúa Giê-su hiện ra trước hết với Ma-ri Ma-đơ-len; từ bà, Ngài đã đuổi bảy quỷ ra khỏi.
  rationale: Sửa phần cuối để nêu rõ Ma-ri Ma-đơ-len là người khỏi whom các quỷ đã bị đuổi, đồng thời vẫn giữ hành động quá khứ có trước lần hiện ra. Hiện đại hóa cách viết tên Giê-su. Dấu chấm phẩy giúp câu tiếng Việt sáng rõ mà không thay đổi quan hệ cú pháp hoặc trình tự của nguyên văn. Chú thích văn bản giữ nguyên vì phản ánh thích đáng dấu ngoặc văn bản trong SBLGNT.
