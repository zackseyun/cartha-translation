source:
  edition: SBLGNT
  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: vi
  text: Sau khi sống lại[a], vào sáng sớm ngày thứ nhất trong tuần, Chúa Giê-su hiện ra trước hết với Ma-ri Ma-đơ-len; từ bà, Ngài đã đuổi bảy quỷ ra khỏi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Các câu 9–20 không có trong một số thủ bản cổ của sách Mác; những thủ bản khác có các câu này, đôi khi với một số dị biệt.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Sau khi sống lại
  rationale: Phân từ bất định được hiểu theo thời gian, chỉ hành động xảy ra trước động từ chính ἐφάνη; cách dịch này tự nhiên và giữ rõ trình tự.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ; trong tiếng Việt, mạch câu đã tự nhiên nên không cần thêm một từ nối dễ gây sắc thái đối lập không có trong nguyên văn.
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: vào sáng sớm ngày thứ nhất trong tuần
  rationale: πρωῒ chỉ buổi sáng sớm, còn πρώτῃ σαββάτου là thành ngữ chỉ ngày đầu tuần.
- source_word: ἐφάνη πρῶτον
  choice: hiện ra trước hết
  rationale: ἐφάνη trong bối cảnh các lần hiện ra sau phục sinh được dịch tự nhiên là “hiện ra”; πρῶτον biểu thị thứ tự.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: với Ma-ri Ma-đơ-len
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt; cách nói “hiện ra với” tự nhiên và phản ánh bổ ngữ cách dữ.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: là người mà Ngài đã đuổi ... ra khỏi
  rationale: Thì quá khứ hoàn thành chỉ hành động đã xảy ra trước lần hiện ra; cấu trúc tiếng Việt diễn đạt rõ việc các quỷ bị đuổi khỏi người ấy.
- source_word: ἑπτὰ δαιμόνια
  choice: bảy quỷ
  rationale: Giữ nguyên con số và dịch δαιμόνια theo nghĩa trực tiếp trong bối cảnh trừ quỷ của các sách Tin Lành.
theological_decisions:
- issue: Tình trạng văn bản của Mác 16:9 trong phần kết dài
  choice: Dịch câu theo bản văn SBLGNT được cung cấp và ghi chú rằng 16:9–20 không có trong một số thủ bản cổ.
  alternative: Kết thúc sách tại Mác 16:8; hoặc gồm 16:9–20 với một số dị biệt.
  rationale: SBLGNT đặt đoạn này trong dấu ngoặc kép đặc biệt để báo hiệu vấn đề văn bản. Bản dịch giữ câu được cung cấp nhưng không che giấu chứng cứ thủ bản.
- issue: Chủ ngữ ngầm của Ἀναστὰς và ἐφάνη
  choice: Nêu rõ là “Đức Chúa Jêsus” ở mệnh đề chính.
  alternative: Dùng đại từ “Ngài” hoặc “Người” xuyên suốt.
  rationale: Tiếng Hy Lạp để chủ ngữ hàm ẩn theo ngữ cảnh. Nêu danh xưng trong tiếng Việt giúp câu đứng riêng rõ nghĩa mà không thay đổi đối tượng được nói đến.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ trực tiếp “quỷ” và trình tự thời gian của nguyên văn; không dùng từ nối đầu câu cho δὲ vì tiếng Việt không cần trong ngữ cảnh này.
