translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng tự nhiên. “Sáng sớm tinh mơ” truyền đạt sắc thái nhấn mạnh của nguyên văn; giữ hiện tại lịch sử “họ đến” theo đặc trưng trần thuật của Mác. Các dấu chú thích được đặt ngay sau thành phần liên quan để tránh thứ tự đảo và sự mơ hồ của lớp tham khảo tiếng Anh.
