  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: vi
  text: Vào sáng sớm tinh mơ của ngày thứ nhất trong tuần,[a] họ đến[b] ngôi mộ khi mặt trời đã mọc.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp theo nghĩa đen là “vào ngày thứ nhất của các ngày Sa-bát”, một thành ngữ có nghĩa là “vào ngày thứ nhất trong tuần”.
    reason: lexical_alternative
  - marker: b
    text: 'Mác dùng thì hiện tại lịch sử “họ đến”; trong lối kể tiếng Việt cũng có thể dùng thì quá khứ: “họ đến”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sau khi mặt trời đã mọc”. Cấu trúc sở hữu cách tuyệt đối trong tiếng Hy Lạp cho biết thời điểm họ đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: sáng sớm tinh mơ
  rationale: Cụm này giữ được sắc thái nhấn mạnh của λίαν đối với πρωῒ, đồng thời tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: ngày thứ nhất trong tuần
  rationale: Đây là một thành ngữ Hy Lạp chịu ảnh hưởng Semit, theo nghĩa đen là “ngày thứ nhất của các ngày Sa-bát”, nhưng chỉ ngày thứ nhất trong tuần.
- source_word: ἔρχονται
  choice: họ đến
  rationale: Dùng thì hiện tại trong tiếng Việt để giữ lối hiện tại lịch sử của Mác và sự sống động của lời kể.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: ngôi mộ
  rationale: Trong bối cảnh mai táng, μνημεῖον chỉ ngôi mộ; ἐπί với đối cách diễn tả chuyển động hướng đến nơi ấy.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: khi mặt trời đã mọc
  rationale: Cách dịch này phản ánh kết cấu sở hữu cách tuyệt đối chỉ thời gian, giữ quan hệ thời gian mà không nhấn mạnh quá mức ý “sau khi”.
