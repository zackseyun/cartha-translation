  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: vi
  text: Rồi hai người ấy đi báo lại cho những người còn lại[a], nhưng họ cũng không tin hai người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cho những người khác.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Rồi hai người ấy
  rationale: κἀκεῖνοι có nghĩa là “và những người ấy/những người ấy cũng”; ngữ cảnh ngay trước xác định đây là hai môn đồ. “Rồi” nối tiếp mạch kể tự nhiên, còn “hai người ấy” làm rõ đối tượng mà không thêm giới tính không cần thiết.
- source_word: ἀπελθόντες
  choice: đi
  rationale: Phân từ bất định diễn tả việc họ rời chỗ ấy trước khi báo tin. Trong tiếng Việt, “đi báo lại” diễn đạt tự nhiên cả chuyển động lẫn trình tự hành động.
- source_word: ἀπήγγειλαν
  choice: báo lại
  rationale: ἀπαγγέλλω là báo hoặc thuật lại điều đã xảy ra. “Báo lại” phù hợp với việc hai người chuyển lời chứng cho nhóm còn lại; nội dung được hiểu từ ngữ cảnh nên không cần thêm “việc ấy”.
- source_word: τοῖς λοιποῖς
  choice: cho những người còn lại
  rationale: λοιπός chỉ những người khác hoặc phần còn lại của nhóm. Cách dịch này giữ nghĩa cơ bản và tự nhiên trong tiếng Việt.
- source_word: οὐδὲ
  choice: nhưng ... cũng không
  rationale: οὐδέ liên kết với lần không tin trước đó và mang sắc thái “cũng không”; “nhưng” thể hiện bước ngoặt tương phản trong câu chuyện.
- source_word: ἐκείνοις
  choice: hai người
  rationale: Đại từ số nhiều chỉ lại hai người vừa báo tin. Lặp “hai người” giúp tránh sự mơ hồ do cả chủ thể lẫn đối tượng đều là số nhiều trong tiếng Việt.
- source_word: ἐπίστευσαν
  choice: không tin
  rationale: Trong ngữ cảnh này, πιστεύω nói đến việc không chấp nhận lời chứng của hai người, nên “không tin” là cách dịch trực tiếp và không mang thêm sắc thái tín lý.
theological_decisions:
- issue: Cách dịch πιστεύω trong bối cảnh lời chứng thuật sự
  choice: không tin
  alternative: không tin cậy
  rationale: Ở đây động từ nói về việc nhóm người không chấp nhận lời hai môn đồ thuật lại. “Không tin cậy” có thể chuyển trọng tâm sang sự tín nhiệm cá nhân, trong khi “không tin” giữ đúng sắc thái của lời chứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “đi báo lại” tự nhiên trong tiếng Việt; việc nêu “hai người” ở đầu và cuối câu làm rõ các đại từ Hy Lạp mà không áp đặt giới tính.
