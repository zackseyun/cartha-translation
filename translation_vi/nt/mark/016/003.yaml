  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: vi
  text: 'Họ nói với nhau: “Ai sẽ lăn tảng đá khỏi cửa mộ cho chúng ta?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: họ nói
  rationale: Thì vị hoàn diễn tả lời trao đổi đang diễn ra hoặc lặp lại; tiếng Việt tự nhiên có thể dùng “họ nói” trong mạch kể mà không làm mất ý cảnh huống.
- source_word: πρὸς ἑαυτάς
  choice: với nhau
  rationale: 'Đại từ phản thân số nhiều mang nghĩa tương hỗ trong ngữ cảnh: các phụ nữ nói với nhau.'
- source_word: Τίς
  choice: Ai
  rationale: Giữ nguyên câu hỏi về người có thể thực hiện hành động.
- source_word: ἀποκυλίσει
  choice: sẽ lăn ... khỏi
  rationale: Động từ chỉ hành động lăn một vật ra khỏi vị trí; cách diễn đạt này giữ hình ảnh cụ thể của tảng đá chắn mộ.
- source_word: ἡμῖν
  choice: giúp chúng ta
  rationale: Dữ cách chỉ lợi ích, nghĩa là làm việc ấy cho họ; “giúp chúng ta” tự nhiên trong câu hỏi tiếng Việt.
- source_word: τὸν λίθον
  choice: tảng đá
  rationale: “Tảng đá” diễn đạt tự nhiên một khối đá dùng để chắn mộ, không thêm tính từ “lớn” vốn không có trong câu này.
- source_word: ἐκ τῆς θύρας
  choice: khỏi cửa
  rationale: θύρα có thể chỉ cửa hoặc lối vào; “cửa mộ” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt đối với chỗ mở của ngôi mộ.
- source_word: τοῦ μνημείου
  choice: mộ
  rationale: Trong ngữ cảnh mai táng, μνημεῖον chỉ ngôi mộ; “mộ” là từ hiện đại, rõ ràng và trang trọng vừa phải.
