id: MRK.16.8
reference: Mark 16:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: vi
  text: Các bà đi ra và bỏ chạy khỏi ngôi mộ[a], vì run rẩy và bàng hoàng bao trùm lấy họ. Họ không nói gì với ai, vì họ sợ hãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm phần thường được gọi là phần kết ngắn hơn: “Họ đã thuật lại vắn tắt cho những người quanh Phi-e-rơ mọi điều họ đã được truyền dặn. Sau đó, chính Chúa Giê-su cũng đã sai họ đi công bố, từ đông sang tây, lời công bố thánh và không hư nát về sự cứu rỗi đời đời. A-men.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: đi ra
  rationale: Phân từ bất định giống cái số nhiều chỉ các phụ nữ; cách dịch này giữ hành động xảy ra trước động từ chính mà không làm câu tiếng Việt nặng nề.
- source_word: ἔφυγον
  choice: chạy khỏi
  rationale: Diễn đạt tự nhiên sức mạnh của φεύγω trong tiếng Việt, cho thấy các bà vội vã rời ngôi mộ vì sợ hãi.
- source_word: μνημείου
  choice: ngôi mộ
  rationale: Đây là từ rõ ràng và thông dụng nhất trong bối cảnh trình thuật phục sinh.
- source_word: εἶχεν αὐτὰς
  choice: đã chế ngự họ
  rationale: Thành ngữ nói sự run rẩy và kinh ngạc nắm giữ, chi phối các bà; “chế ngự” giữ được cường độ mà vẫn tự nhiên.
- source_word: τρόμος
  choice: sự run rẩy
  rationale: Giữ nghĩa cụ thể về phản ứng run lên, không đồng nhất hoàn toàn với nỗi sợ được nói rõ ở cuối câu.
- source_word: ἔκστασις
  choice: kinh ngạc
  rationale: Trong ngữ cảnh này, từ chỉ trạng thái choáng ngợp, sững sờ; “kinh ngạc” rõ nghĩa và tránh hàm ý hiện đại không phù hợp của “xuất thần”.
- source_word: οὐδενὶ οὐδὲν εἶπαν
  choice: Họ không nói gì với ai
  rationale: Thể hiện tự nhiên trong tiếng Việt sự phủ định toàn diện và nhấn mạnh của cụm Hy Lạp.
- source_word: ἐφοβοῦντο
  choice: họ sợ
  rationale: Cách diễn đạt ngắn gọn, tự nhiên về trạng thái sợ hãi đang tiếp diễn của các bà.
- source_word: γάρ
  choice: vì
  rationale: Giữ quan hệ giải thích ở cả hai lần xuất hiện và bảo toàn nét kết thúc đột ngột của câu.
theological_decisions:
- issue: Phần kết ngắn hơn được đặt trong ngoặc kép của SBLGNT sau Mác 16:8
  choice: Không đưa phần này vào chính văn, nhưng ghi đầy đủ trong chú thích như một dị bản văn bản
  alternative: Đưa phần kết ngắn hơn vào chính văn hoặc in cả hai cách kết trong chính văn
  rationale: SBLGNT đặt đoạn này trong dấu ngoặc kép, cho biết đoạn ấy không thuộc chính văn được thiết lập. Chú thích vừa phản ánh chứng cứ văn bản vừa giúp độc giả biết rõ dị bản mà không nhập nó vào câu 8.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu cuối được giữ ngắn, không làm mềm nét kết thúc đột ngột của bản Hy Lạp. Đại từ “các bà/họ” xác định tự nhiên nhóm phụ nữ từ ngữ cảnh trước mà không thêm tên hay diễn giải thần học.
