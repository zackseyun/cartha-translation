review_pass:
  verdict: revise
  source_fidelity: Chính văn phản ánh đúng trình tự phân từ ἐξελθοῦσαι và động từ ἔφυγον, phủ định nhấn mạnh οὐδενὶ οὐδέν, cùng hai mệnh đề nguyên nhân γάρ. Tuy nhiên, «chế ngự» hơi nghiêng về sự khuất phục/chi phối hơn là thành ngữ εἶχεν αὐτὰς với τρόμος καὶ ἔκστασις, vốn diễn tả trạng thái run rẩy và bàng hoàng ập/bao trùm lấy họ. Chú thích dị bản cần bỏ «Nhưng», vì δέ ở đây không tạo thế đối lập rõ rệt.
  naturalness: «Bỏ chạy» và «bàng hoàng bao trùm lấy họ» tự nhiên, sinh động trong tiếng Việt hiện đại mà vẫn trang trọng. «Sợ hãi» diễn đạt trọn vẹn hơn trạng thái ἐφοβοῦντο ở câu kết.
  terminology: «Ngôi mộ», «Chúa Giê-su», «Phi-e-rơ», «sự cứu rỗi đời đời» phù hợp. Trong chú thích, «lời công bố thánh và không hư nát» phản ánh ἱερὸν καὶ ἄφθαρτον κήρυγμα mà không thêm diễn giải giáo phái.
  issues:
  - severity: low
    issue: «đã chế ngự họ» cho εἶχεν αὐτὰς
    rationale: Cụm Hy Lạp dùng cách nói trạng thái run rẩy và bàng hoàng nắm lấy họ; «bao trùm lấy họ» tự nhiên hơn và tránh sắc thái khuất phục của «chế ngự».
  - severity: low
    issue: «Nhưng họ đã thuật lại...» ở đầu chú thích dị bản
    rationale: Πάντα δὲ... không đòi hỏi liên từ đối lập «Nhưng»; cách này có thể gợi một quan hệ đối lập không có trong bản Hy Lạp.
