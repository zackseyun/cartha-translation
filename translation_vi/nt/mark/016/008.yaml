- from: Các bà đi ra và chạy khỏi ngôi mộ[a], vì sự run rẩy và kinh ngạc đã chế ngự họ. Họ không nói gì với ai, vì họ sợ.
  to: Các bà đi ra và bỏ chạy khỏi ngôi mộ[a], vì run rẩy và bàng hoàng bao trùm lấy họ. Họ không nói gì với ai, vì họ sợ hãi.
  rationale: Chỉnh nhẹ cách diễn đạt trạng thái τρόμος καὶ ἔκστασις để sát thành ngữ Hy Lạp và tự nhiên hơn trong tiếng Việt. Chỉnh chú thích dị bản để không thêm sắc thái đối lập ở δέ, đồng thời làm rõ ότι các phụ nữ thuật lại điều họ đã được truyền dặn và rằng Chúa Giê-su sai họ công bố lời rao truyền. Dị bản vẫn được đặt ngoài chính văn, đúng tín hiệu ngoặc kép của SBLGNT.
