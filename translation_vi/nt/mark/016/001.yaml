review_pass:
  verdict: revise
  source_fidelity: Câu dịch giữ đúng trật tự thời gian (ngày Sa-bát đã qua), ba người phụ nữ, việc mua hương liệu, và mục đích đến để xức cho Chúa Giê-su. Tuy nhiên, “Ma-ri của Gia-cơ” là cách chuyển quá sát hình thức Hy Lạp nhưng không tự nhiên trong tiếng Việt và không diễn đạt rõ chức năng nhận diện của cụm này.
  naturalness: “Ma-ri của Gia-cơ” dễ bị hiểu là quan hệ sở hữu hoặc quan hệ khác không xác định, nên không phải cách gọi nhân vật tự nhiên trong tiếng Việt hiện đại. “Ma-ri, mẹ của Gia-cơ” là cách nhận diện rõ ràng, tự nhiên, và phù hợp với cách dùng của tên gọi này trong ngữ cảnh Phúc Âm. “Xức dầu cho Người” cũng tự nhiên hơn “xức cho ngài” và làm rõ hành động xức mà không đổi nghĩa.
  terminology: Giữ “Sa-bát”, “Ma-ri Ma-đơ-len”, “Gia-cơ”, “Sa-lô-mê”, và “hương liệu” là phù hợp. Dùng “Người” làm đại từ tôn kính trong văn kể chuyện Kinh Thánh là nhất quán và hiện đại. Chú thích cần nói rõ rằng tiếng Hy Lạp là một lối nói tỉnh lược, trong khi bản văn dịch theo cách hiểu ngữ cảnh phổ biến, thay vì gọi đó là mơ hồ hoàn toàn.
  issues:
  - severity: medium
    issue: “Ma-ri của Gia-cơ” không tự nhiên và gây mơ hồ không hữu ích trong tiếng Việt.
    rationale: Cụm ἡ τοῦ Ἰακώβου là một lối nhận diện tỉnh lược. Tiếng Việt không dùng “của Gia-cơ” một cách tự nhiên để nhận diện một phụ nữ theo người con trai; cách này có thể bị hiểu như sở hữu hoặc một quan hệ khác. Trong ngữ cảnh này, “mẹ của Gia-cơ” là cách chuyển ngữ thành ngữ và phù hợp với dấu vết kiểm tra tiếng Anh.
  - severity: low
    issue: Chú thích hiện tại khẳng định rằng nguyên văn giữ một sự mơ hồ về quan hệ mà tiếng Hy Lạp trong ngữ cảnh không nhất thiết chủ ý duy trì.
    rationale: Chú thích nên mô tả chính xác tính tỉnh lược của cấu trúc Hy Lạp và cho biết “mẹ của Gia-cơ” là cách hiểu theo ngữ cảnh/truyền thống, thay vì trình bày bản dịch chính văn như thể phải giữ một quan hệ hoàn toàn bất định.
  - severity: low
    issue: “xức cho ngài” kém tự nhiên hơn “xức dầu cho Người”.
    rationale: Thêm “dầu” trong cụm động từ quen dùng tiếng Việt làm rõ hành động ἀλείφω; “hương liệu” trong vế trước vẫn giữ loại vật liệu được mua và bối cảnh mai táng.
