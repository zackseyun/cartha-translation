id: MRK.16.1
reference: Mark 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: vi
  text: Khi ngày Sa-bát đã qua, Ma-ri Ma-đơ-len, Ma-ri, mẹ của Gia-cơ[a], và Sa-lô-mê mua hương liệu để đến xức dầu cho Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Ma-ri, người của Gia-cơ”; đây là lối nói tỉnh lược để nhận diện Ma-ri theo Gia-cơ. Trong ngữ cảnh, cách hiểu truyền thống là “mẹ của Gia-cơ”.'
    reason: Giải thích cấu trúc Hy Lạp tỉnh lược và cách dịch thành ngữ trong tiếng Việt.
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Khi ngày Sa-bát đã qua
  rationale: Cụm sở hữu cách tuyệt đối nêu thời điểm có trước hành động chính; cách dịch này tự nhiên và giữ đúng ý ngày Sa-bát đã kết thúc.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Ma-ri Ma-đơ-len
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt hiện đại, giúp nhận diện rõ nhân vật.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Ma-ri của Gia-cơ
  rationale: Nguyên văn chỉ nói theo lối tỉnh lược rằng Ma-ri là người có quan hệ với Gia-cơ, nhưng không nêu rõ quan hệ ấy; bản dịch giữ sự mơ hồ thực sự và giải thích trong chú thích.
- source_word: Σαλώμη
  choice: Sa-lô-mê
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: ἠγόρασαν
  choice: mua
  rationale: Động từ trần thuật đơn giản, được diễn đạt trực tiếp và tự nhiên.
- source_word: ἀρώματα
  choice: các hương liệu
  rationale: Chỉ những chất thơm dùng trong việc lo liệu thi hài; “hương liệu” vừa cụ thể vừa tránh gợi riêng gia vị thực phẩm.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: để đến xức cho ngài
  rationale: Giữ quan hệ mục đích của ἵνα và trình tự hành động hàm chứa trong phân từ ἐλθοῦσαι, bằng một cấu trúc tiếng Việt gọn, tự nhiên.
- source_word: ἀλείψωσιν
  choice: xức
  rationale: Diễn đạt trực tiếp hành động bôi chất thơm lên thi hài, đồng thời không mở rộng thành một lời giải thích quá mức.
theological_decisions:
- issue: Quan hệ của Ma-ri với Gia-cơ trong cụm tỉnh lược Μαρία ἡ τοῦ Ἰακώβου
  choice: Ma-ri của Gia-cơ
  alternative: Ma-ri, mẹ của Gia-cơ
  rationale: Hy Lạp không ghi danh từ chỉ quan hệ. Dù theo truyền thống và văn mạch, “mẹ của Gia-cơ” là cách hiểu hợp lý, đưa thẳng “mẹ” vào chính văn sẽ giải quyết một sự mơ hồ mà nguyên bản vẫn để ngỏ. Vì vậy, bản dịch giữ cách diễn đạt tổng quát và nêu cách hiểu truyền thống trong chú thích.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, câu ngắn và dễ hiểu. Dùng “ngài” cho đại từ chỉ Chúa Giê-su trong ngữ cảnh này; các tên riêng được phiên âm theo dạng quen thuộc trong tiếng Việt. Chú thích [a] được đặt ngay sau cụm từ cần giải thích.
