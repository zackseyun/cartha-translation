id: MRK.16.19
reference: Mark 16:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: vi
  text: Vậy, sau khi nói với họ, Chúa Giê-su được cất lên trời và ngồi bên phải Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản Hy Lạp cổ quan trọng không có Mác 16:9–20; các thủ bản khác có phần kết này, và một số thủ bản lưu truyền những dạng kết thúc khác.
    reason: Câu 16:19 nằm trong phần kết dài của sách Mác, nơi có biến thể văn bản lớn cần được thông báo cho độc giả.
lexical_decisions:
- source_word: μὲν οὖν
  choice: Vậy
  rationale: Cặp tiểu từ này vừa chuyển ý vừa kết luận. “Vậy” diễn đạt tự nhiên sắc thái tiếp nối và tổng kết trong tiếng Việt mà không dịch quá mức.
- source_word: ὁ κύριος Ἰησοῦς
  choice: Chúa Giê-su
  rationale: “Chúa” giữ trọng lượng của tước hiệu κύριος trong cách dùng Tân Ước; “Giê-su” là dạng tên riêng quen thuộc trong tiếng Việt. Tiếng Việt không cần biểu thị mạo từ Hy Lạp bằng một từ riêng.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: sau khi phán với các môn đồ
  rationale: Cấu trúc μετά với động từ nguyên mẫu có mạo từ chỉ thời gian, nghĩa là “sau khi”. “Phán” phù hợp với lời của Chúa trong văn phong Kinh Thánh trang trọng; “các môn đồ” làm rõ đại từ αὐτοῖς theo ngữ cảnh, không hàm ý một nhóm khác.
- source_word: ἀνελήμφθη
  choice: được cất lên
  rationale: Giữ thể bị động của động từ và diễn tả hành động được đưa lên; đích đến được nêu trong cụm từ kế tiếp.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: “Lên trời” là cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ hướng chuyển động của εἰς trong ngữ cảnh thăng thiên.
- source_word: ἐκάθισεν
  choice: ngồi
  rationale: Động từ aorist nêu hành động ngồi xuống hoặc an tọa; “ngồi” tự nhiên, gọn và không thêm sắc thái nghi lễ ngoài nguyên văn.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: bên phải Đức Chúa Trời
  rationale: Đây là thành ngữ chỉ vị trí ở phía bên phải, không nên dịch máy móc ἐκ là “từ”. “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc cho θεός trong ngữ cảnh xác định này.
theological_decisions:
- issue: Ngôn ngữ về sự thăng thiên và tôn cao
  choice: được cất lên trời và ngồi bên phải Đức Chúa Trời
  alternative: được tiếp lên trời và an tọa bên hữu Đức Chúa Trời
  rationale: Bản dịch giữ nguyên lời khẳng định về việc Chúa Giê-su được đưa lên trời và ngồi ở vị trí bên phải Đức Chúa Trời, nhưng không thêm lời giải thích tín lý ngoài câu Hy Lạp.
- issue: κύριος là tước hiệu của Chúa Giê-su
  choice: Chúa Giê-su
  alternative: Chủ Giê-su
  rationale: “Chúa” bảo toàn trọng lượng thần học và cách dùng quen thuộc của κύριος trong Tân Ước; “Chủ” dễ làm hẹp nghĩa thành quan hệ xã hội thông thường.
- issue: Tình trạng văn bản của phần kết dài sách Mác
  choice: ghi chú về chứng cứ thủ bản
  alternative: không ghi chú
  rationale: Mác 16:19 thuộc phần 16:9–20, vốn thiếu trong một số chứng nhân Hy Lạp cổ quan trọng. Ghi chú giúp minh bạch chứng cứ văn bản mà không loại câu khỏi bản dịch hay tự quyết định giá trị thần học của đoạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” để phù hợp với chủ thể là Chúa Giê-su, nhưng tránh các từ cổ như “bèn”, “đoạn”, “bên hữu” và “thăng thiên” trong chính văn. “Các môn đồ” làm rõ đối tượng của đại từ theo ngữ cảnh gần.
