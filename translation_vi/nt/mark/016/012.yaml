  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: vi
  text: Sau những việc ấy, Ngài hiện ra với một diện mạo khác[a] cho hai người trong số họ, khi họ đang đi bộ vào miền quê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một hình dạng khác” hoặc “dưới một hình dạng khác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đến một cánh đồng”; ở đây, “miền quê” phản ánh nghĩa có khả năng phù hợp hơn của ἀγρός trong ngữ cảnh này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ rõ trình tự thời gian của μετά với đối cách và sắc thái tiếp nối của δέ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: cho hai người trong số họ
  rationale: Diễn đạt tự nhiên rằng hai người nhận sự hiện ra thuộc về nhóm người đã được nhắc đến.
- source_word: περιπατοῦσιν
  choice: khi họ đang đi bộ
  rationale: Thể hiện hành động đang diễn ra đồng thời với động từ chính và giữ nghĩa cụ thể của việc đi bộ.
- source_word: ἐφανερώθη
  choice: Ngài hiện ra
  rationale: Trong ngữ cảnh sự hiện ra sau phục sinh, cách dịch này tự nhiên và rõ nghĩa hơn lối dịch máy móc như “được bày tỏ”; chủ thể được hiểu từ văn cảnh là Chúa Giê-su.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: trong một hình dạng khác
  rationale: Giữ ý về sự khác biệt của ἑτέρᾳ và nghĩa “hình dạng, dáng vẻ” của μορφή mà không giải thích bản chất của sự khác biệt ấy.
- source_word: πορευομένοις
  choice: trên đường về
  rationale: Diễn tả sự di chuyển có hướng đích, đồng thời tránh lặp vụng về với “đang đi bộ”.
- source_word: εἰς ἀγρόν
  choice: về miền quê
  rationale: Trong ngữ cảnh này, ἀγρός có thể chỉ vùng nông thôn chứ không nhất thiết là một thửa ruộng riêng biệt; “về miền quê” tự nhiên và vẫn giữ hướng chuyển động.
theological_decisions:
- issue: Bản chất của lần hiện ra được mô tả bằng ἐν ἑτέρᾳ μορφῇ
  choice: Dịch theo lối mô tả là “trong một hình dạng khác” mà không giải thích sự khác biệt diễn ra thế nào.
  alternative: với một diện mạo khác; trong một hình dạng khác nữa
  rationale: Câu này khẳng định Chúa Giê-su hiện ra trong một hình dạng khác nhưng không cho biết đó là sự thay đổi về diện mạo, về cách người ta nhận biết Ngài hay một phương thức khác. Bản dịch giữ nguyên sự căng thẳng và tính mở của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dựa vào chủ thể đã rõ trong văn cảnh, tránh thêm tên riêng không có trong câu Hy Lạp. Hai phân từ được diễn đạt thành “khi họ đang đi bộ trên đường về” để vừa giữ hành động đồng thời vừa tránh lặp từ thiếu tự nhiên.
