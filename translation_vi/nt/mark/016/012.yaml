revisions:
- from: Sau những việc ấy, Ngài hiện ra trong một hình dạng khác[a] cho hai người trong số họ, khi họ đang đi bộ trên đường về miền quê[b].
  to: Sau những việc ấy, Ngài hiện ra với một diện mạo khác[a] cho hai người trong số họ, khi họ đang đi bộ vào miền quê[b].
  rationale: Bản sửa thay “trên đường về miền quê” bằng “đang đi bộ vào miền quê” để phản ánh εἰς (hướng đến) mà không thêm hàm ý trở về. “Với một diện mạo khác” là cách nói tự nhiên, giữ tính mô tả và sự mơ hồ của ἐν ἑτέρᾳ μορφῇ. Chú thích a được sửa để loại bỏ “nữa,” một sắc thái không có trong nguyên văn.
  reviewer_model: gpt-5.6-terra
