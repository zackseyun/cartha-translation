source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: vi
  text: Khi họ bước vào mộ, họ thấy một thanh niên[a] ngồi bên phải, mặc áo choàng trắng, và họ vô cùng kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một thiên sứ.” Ở đây Mác mô tả người ấy là “một thanh niên,” dù ngữ cảnh rộng hơn và các trình thuật song song cho thấy đây là một sứ giả thiên thượng.'
    reason: Nêu cách hiểu thay thế mà không thay thế từ ngữ mô tả trực tiếp của bản Hy Lạp.
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: Khi bước vào
  rationale: Phân từ bất định quá khứ giống cái số nhiều chỉ những người phụ nữ trong ngữ cảnh; cách dịch thời gian này tự nhiên trong tiếng Việt và giữ quan hệ với động từ chính.
- source_word: μνημεῖον
  choice: mộ
  rationale: Chỉ nơi chôn cất; “mộ” rõ ràng, tự nhiên trong ngữ cảnh phục sinh.
- source_word: νεανίσκον
  choice: một thanh niên
  rationale: Từ Hy Lạp trực tiếp chỉ một người nam trẻ tuổi; không tự ý xác định là thiên sứ trong chính câu này.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: ngồi bên phải
  rationale: Diễn đạt tự nhiên vị trí và tư thế của người thanh niên ở trong mộ.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: mặc áo dài trắng
  rationale: στολή là loại áo dài hoặc áo choàng; “áo dài trắng” truyền đạt dáng áo mà không dùng từ “áo dài” như tên riêng của quốc phục.
- source_word: ἐξεθαμβήθησαν
  choice: họ vô cùng kinh ngạc
  rationale: Động từ diễn tả sự sửng sốt mạnh và bất an; “vô cùng kinh ngạc” giữ cường độ mà không đẩy nghĩa đến mức hoàn toàn khiếp sợ.
theological_decisions:
- issue: Danh tính của νεανίσκος
  choice: Dịch theo mô tả là “một thanh niên” trong chính văn.
  alternative: “một thiên sứ”
  rationale: Mặc dù y phục trắng, ngữ cảnh rộng hơn và các trình thuật song song gợi ý đây là sứ giả thiên thượng, Mác 16:5 dùng νεανίσκος, nghĩa là “thanh niên”. Chính văn giữ cách gọi của Mác, còn chú thích nêu cách hiểu theo ngữ cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự “mặc áo dài trắng, ngồi bên phải” được chọn cho nhịp câu tự nhiên; “vô cùng” phản ánh cường độ của tiền tố ἐκ- trong động từ chỉ phản ứng mạnh.
