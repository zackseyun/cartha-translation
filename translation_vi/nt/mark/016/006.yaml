language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: vi
  text: 'Nhưng người ấy nói với các bà: “Đừng kinh hãi. Các bà đang tìm Giê-su, người Na-xa-rét[a], người đã bị đóng đinh. Ngài đã sống lại[b]; Ngài không ở đây. Hãy xem chỗ người ta đã đặt Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Na-xa-rê” hoặc “người thành Na-xa-rét.” Tiếng Hy Lạp dùng một danh xưng bắt nguồn từ tên Na-xa-rét.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Ngài đã được làm cho sống lại.” Động từ Hy Lạp ở thể thụ động; cũng có thể dịch: “Ngài đã chỗi dậy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Đừng kinh hãi
  rationale: Động từ diễn tả sự chấn động và sợ hãi mạnh, không chỉ là ngạc nhiên; “kinh hãi” tự nhiên và phù hợp với phản ứng của các phụ nữ tại mộ.
- source_word: Ναζαρηνὸν
  choice: người Na-xa-rét
  rationale: Giữ cách gọi định danh bắt nguồn từ địa danh Na-xa-rét, thay vì diễn giải hoàn toàn thành “quê ở Na-xa-rét”.
- source_word: ἐσταυρωμένον
  choice: Đấng đã bị đóng đinh
  rationale: Thể hoàn thành phân từ thụ động chỉ hành động đã hoàn tất nhưng vẫn có ý nghĩa hiện tại; cách dịch giữ thể bị động và vẫn trang trọng, dễ hiểu.
- source_word: ἠγέρθη
  choice: Ngài đã được làm cho sống lại
  rationale: Giữ thể thụ động của động từ Hy Lạp và để ngỏ tác nhân được hàm ý, dù cách nói này kém thông dụng hơn “Ngài đã sống lại” trong tiếng Việt.
- source_word: ζητεῖτε
  choice: Các bà đang tìm
  rationale: Thể hiện tự nhiên hành động đang diễn ra của động từ hiện tại trong ngữ cảnh.
- source_word: ἴδε
  choice: Hãy xem
  rationale: Mệnh lệnh hướng sự chú ý đến vị trí trong mộ; “Hãy xem” rõ ràng và hiện đại.
- source_word: τόπος
  choice: nơi
  rationale: Tương đương tự nhiên, cụ thể với danh từ chỉ địa điểm trong ngữ cảnh.
- source_word: ἔθηκαν
  choice: người ta đã đặt
  rationale: Động từ số nhiều không nêu chủ thể; “người ta” giữ tính không xác định đó, còn “đặt” phù hợp với việc đặt thi thể trong mộ.
- source_word: λέγει αὐταῖς
  choice: người ấy nói với các bà
  rationale: Giữ thì hiện tại lịch sử của Mác để duy trì lối kể sống động; “các bà” nhận diện rõ nhóm phụ nữ trong ngữ cảnh.
theological_decisions:
- issue: Cách diễn đạt và thể của lời công bố phục sinh
  choice: Ngài đã được làm cho sống lại
  alternative: Ngài đã sống lại
  rationale: Bản dịch chính giữ thể thụ động ἠγέρθη, qua đó không xóa đi hành động được hàm ý của Đức Chúa Trời. Chú thích ghi nhận cách diễn đạt chủ động/tự thân tự nhiên và quen thuộc hơn trong tiếng Việt mà không thay đổi lời khẳng định về sự phục sinh.
translation_notes:
  register: Ngôn ngữ hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” cho nhân vật nam trong mộ và “các bà” cho nhóm phụ nữ; dùng “Ngài/Đấng” khi nói về Giê-su theo lối xưng hô tôn kính phổ biến trong tiếng Việt. Giữ thì hiện tại lịch sử ở “nói” và giữ thể thụ động của lời công bố phục sinh.
