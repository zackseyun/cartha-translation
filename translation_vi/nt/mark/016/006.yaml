revisions:
- from: 'Nhưng người ấy nói với các bà: “Đừng kinh hãi. Các bà đang tìm Giê-su người Na-xa-rét[a], Đấng đã bị đóng đinh. Ngài đã được làm cho sống lại[b]; Ngài không ở đây. Hãy xem nơi người ta đã đặt Ngài.”'
  to: 'Nhưng người ấy nói với các bà: “Đừng kinh hãi. Các bà đang tìm Giê-su, người Na-xa-rét[a], người đã bị đóng đinh. Ngài đã sống lại[b]; Ngài không ở đây. Hãy xem chỗ người ta đã đặt Ngài.”'
  rationale: Sửa cách diễn đạt phục sinh để bản văn tiếng Việt tự nhiên, sáng rõ và phù hợp với cách dùng hiện đại, trong khi chú thích bảo tồn dữ kiện rằng ἠγέρθη là thể thụ động. Điều chỉnh cấu trúc đồng vị của «Giê-su, người Na-xa-rét», thay «Đấng» bằng «người» để không thêm tước hiệu ngoài cấu trúc định ngữ của nguyên văn, và cải thiện các lựa chọn trong chú thích danh xưng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:00:42Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng trình tự và nội dung của bản Hy Lạp, gồm thì hiện tại lịch sử ở «nói», mệnh lệnh phủ định, việc tìm kiếm Giê-su, sự đóng đinh, ngôi mộ trống, và nơi thi thể đã được đặt. Tuy nhiên, «đã được làm cho sống lại» tuy cố giữ thể thụ động nhưng không tự nhiên trong tiếng Việt hiện đại và dễ gợi ý hành động hồi sinh thông thường. Bản chính dùng «đã sống lại» là cách tiếng Việt tự nhiên; chú thích cần minh định rằng động từ Hy Lạp là thụ động.
  naturalness: «Giê-su, người Na-xa-rét» là lối đồng vị tự nhiên và rõ ràng hơn «Giê-su người Na-xa-rét». «Người đã bị đóng đinh» bám sát phân từ định ngữ mà không thêm tước hiệu vào nguyên văn. «Hãy xem chỗ...» là cách hướng sự chú ý tự nhiên trong ngữ cảnh.
  terminology: Giữ «Na-xa-rét», «đóng đinh», và «sống lại» theo cách dùng Kinh Thánh Việt ngữ hiện đại. Không nên dùng «Na-xa-rên» như một cách thay thế thiếu chuẩn hóa; có thể ghi «Na-xa-rê» để phản ánh cách phiên âm khác của danh xưng Hy Lạp, đồng thời nêu rõ nghĩa «người thành Na-xa-rét».
  issues:
  - severity: medium
    issue: «Ngài đã được làm cho sống lại» không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cách diễn đạt này quá cơ học, dễ bị hiểu là được hồi sinh bởi một tác nhân nào đó, và không phải cách công bố phục sinh thông dụng. Tiếng Việt không có một đối ứng thụ động tự nhiên cho ἠγέρθη trong trường hợp này. Dùng «Ngài đã sống lại» trong bản chính, kèm chú thích về thể thụ động Hy Lạp, vừa rõ nghĩa vừa bảo toàn thông tin ngữ pháp quan trọng.
  - severity: low
    issue: Chú thích a dùng «người quê Na-xa-rét» và phiên âm «Na-xa-rên» không phải những lựa chọn tốt nhất cho tiếng Việt chuẩn hiện đại.
    rationale: «Người quê» có sắc thái khẩu ngữ và thu hẹp nghĩa; «người thành Na-xa-rét» trung tính hơn. «Na-xa-rê» có thể được nêu như một cách phiên âm khác để phản ánh «Nazorean», nhưng chú thích cần nói rõ đây là danh xưng bắt nguồn từ Na-xa-rét.
