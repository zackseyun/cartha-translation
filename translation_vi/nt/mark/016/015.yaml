  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Hãy đi khắp thế gian và công bố tin mừng[b] cho toàn thể tạo vật[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cho mọi thụ tạo.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa tập thể hoặc theo nghĩa từng cá thể.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “Phúc Âm.” Từ Hy Lạp εὐαγγέλιον có nghĩa đen là “tin mừng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Hãy đi
  rationale: Phân từ bất định quá khứ đứng trước mệnh lệnh chính κηρύξατε có sắc thái hành động đi kèm; dịch bằng mệnh lệnh tự nhiên trong tiếng Việt, giữ rõ sức mạnh của lời sai phái.
- source_word: κόσμον ἅπαντα
  choice: khắp thế gian
  rationale: κόσμος chỉ thế giới như phạm vi của sứ mạng, còn ἅπαντα nhấn mạnh tính toàn thể. “Khắp thế gian” tự nhiên, trang trọng và giữ phạm vi phổ quát.
- source_word: κηρύξατε
  choice: công bố
  rationale: κηρύσσω mang nghĩa loan báo công khai với thẩm quyền. “Công bố” truyền đạt sắc thái ấy mà không thu hẹp thành hoạt động giảng thuyết trong hội thánh.
- source_word: τὸ εὐαγγέλιον
  choice: tin mừng
  rationale: εὐαγγέλιον có nghĩa trực tiếp là tin tốt lành. “Tin mừng” là cách diễn đạt rõ nghĩa và quen thuộc trong tiếng Việt hiện đại; chú thích giữ thuật ngữ truyền thống “Phúc Âm”.
- source_word: πάσῃ τῇ κτίσει
  choice: cho toàn thể tạo vật
  rationale: κτίσις có thể chỉ sự sáng tạo, toàn thể tạo vật, hoặc từng thụ tạo. Cách dịch này giữ bề rộng và sắc thái tập thể của tiếng Hy Lạp mà không tự ý thu hẹp thành chỉ mọi người.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài phán với họ
  rationale: Diễn đạt lời dẫn kể chuyện của λέγω với tân ngữ gián tiếp αὐτοῖς; “phán” phù hợp với chủ thể là Chúa Giê-su và giữ văn phong trang trọng.
theological_decisions:
- issue: Phạm vi của πάσῃ τῇ κτίσει trong mệnh lệnh sai phái
  choice: Dịch rộng là “cho toàn thể tạo vật” để giữ phạm vi phổ quát và khả năng hiểu theo nghĩa tập thể của tiếng Hy Lạp.
  alternative: “cho mọi thụ tạo” hoặc, theo cách hiểu hẹp hơn trong ngữ cảnh, “cho mọi người”
  rationale: Cụm từ có thể được hiểu theo nghĩa tập thể hoặc phân phối. Bản dịch chính không giới hạn trước vào từng cá nhân hay chỉ nhân loại, còn chú thích bảo tồn cách dịch phân phối chân thực.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” và “phán” phù hợp văn cảnh lời Chúa Giê-su; “khắp thế gian” và “công bố” tạo nhịp tự nhiên, rõ tính sai phái. Các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
