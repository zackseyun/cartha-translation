  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: vi
  text: Bà ấy đi báo tin cho những người từng ở với Ngài; họ đang đau buồn và khóc lóc.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: Bà ấy
  rationale: Đại từ chỉ định này nhắc lại Ma-ri Ma-đơ-len ở câu trước. “Bà ấy” tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái quy chiếu rõ hơn so với chỉ dùng “bà”.
- source_word: πορευθεῖσα
  choice: đi
  rationale: Phân từ bất định diễn tả hành động xảy ra trước hoặc đi liền với động từ chính; cấu trúc “đi báo tin” truyền đạt trình tự ấy một cách tự nhiên.
- source_word: ἀπήγγειλεν
  choice: báo tin
  rationale: Động từ có nghĩa là báo lại hoặc loan báo một thông tin. “Báo tin” phù hợp với việc bà truyền đạt điều vừa xảy ra; nội dung của tin được hiểu từ ngữ cảnh dù không có tân ngữ nêu rõ trong tiếng Hy Lạp.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: cho những người từng ở với Ngài
  rationale: Cụm phân từ xác định những người trước đó đã ở cùng và gắn bó với Chúa Giê-su. “Từng ở với” vừa tự nhiên vừa giữ quan hệ thời gian quá khứ.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: họ đang đau buồn và khóc lóc
  rationale: Hai phân từ hiện tại mô tả tình trạng đồng thời của nhóm người nhận tin. “Đau buồn” diễn đạt πενθέω, còn “khóc lóc” diễn đạt κλαίω, nhờ đó không gộp mất hai hành động liên hệ nhưng khác nhau.
