source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: vi
  text: 'Còn những dấu lạ này sẽ đi cùng[a] những người đã tin: nhân danh tôi, họ sẽ đuổi quỷ; họ sẽ nói các thứ tiếng mới.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sẽ theo sau”. Động từ Hy Lạp cũng có nghĩa là đi cùng hoặc đồng hành.
    reason: lexical_alternative
  - marker: b
    text: Hay “các ngôn ngữ mới”. Từ Hy Lạp có thể chỉ ngôn ngữ nói chung; “các thứ tiếng” giữ nguyên độ mở của cách diễn đạt ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: dấu lạ
  rationale: “Dấu lạ” vừa tự nhiên trong văn cảnh Kinh Thánh tiếng Việt, vừa giữ được sắc thái một hiện tượng kỳ diệu có ý nghĩa làm dấu, thay vì chỉ nói chung là “phép lạ”.
- source_word: τοῖς πιστεύσασιν
  choice: những người đã tin
  rationale: Cách dịch này phản ánh phân từ bất định πιστεύσασιν như một hành động tin đã diễn ra, đồng thời vẫn chỉ chung một nhóm người.
- source_word: ταῦτα
  choice: này
  rationale: Đại từ chỉ định trực tiếp hướng đến danh sách các dấu lạ được nêu tiếp theo.
- source_word: παρακολουθήσει
  choice: sẽ đi cùng
  rationale: παρακολουθέω ở đây diễn tả việc các dấu lạ đồng hành hoặc đi kèm những người đã tin, không nhất thiết chỉ là theo sau theo thứ tự.
- source_word: ἐν τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về hành động được thực hiện dưới danh và thẩm quyền của Chúa Giê-su.
- source_word: δαιμόνια
  choice: quỷ
  rationale: Từ này trực tiếp chỉ các hữu thể tà linh; “quỷ” là cách diễn đạt ngắn gọn, thông dụng và không nhập cụm từ khác là “uế linh”.
- source_word: ἐκβαλοῦσιν
  choice: sẽ đuổi
  rationale: “Đuổi quỷ” diễn đạt tự nhiên và chính xác hành động trục xuất trong ngữ cảnh này.
- source_word: γλώσσαις
  choice: các thứ tiếng
  rationale: γλῶσσα có thể chỉ lưỡi, tiếng nói hoặc ngôn ngữ. “Các thứ tiếng” là cách nói tự nhiên, giữ được độ mở của hiện tượng hơn “các ngôn ngữ”.
- source_word: λαλήσουσιν
  choice: họ sẽ nói
  rationale: Đây là cách dịch trực tiếp, tự nhiên của động từ λαλέω.
- source_word: καιναῖς
  choice: mới
  rationale: “Mới” phản ánh trực tiếp καινός mà không tự ý giải thích là mới đối với người nói, xa lạ, hay thuộc một loại hiện tượng cụ thể.
theological_decisions:
- issue: Ý nghĩa của “các thứ tiếng” trong câu “họ sẽ nói các thứ tiếng mới”
  choice: Giữ cách diễn đạt “các thứ tiếng” mà không xác định đó là những ngôn ngữ loài người hay lời nói xuất thần.
  alternative: Dịch là “các ngôn ngữ mới” hoặc giải thích là lời nói xuất thần.
  rationale: Bản thân γλώσσαις không xác định chính xác bản chất của hiện tượng trong câu này. Giữ cách diễn đạt rộng tránh áp đặt cách hiểu riêng của một truyền thống thần học.
- issue: Mối liên hệ giữa các dấu lạ và những người đã tin
  choice: Dịch παρακολουθήσει là “sẽ đi cùng”.
  alternative: “Sẽ theo sau”.
  rationale: “Sẽ đi cùng” nhấn mạnh sự đồng hành như động từ Hy Lạp cho phép, nhưng không bổ sung kết luận thần học về tần suất hoặc việc mọi dấu lạ phải xuất hiện nơi từng cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dấu lạ”, “nhân danh tôi” và “đuổi quỷ” theo cách nói quen thuộc nhưng không quá cổ; giữ cấu trúc liệt kê và sự mơ hồ có thật của γλώσσαις.
