  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: vi
  text: Người đã tin và đã chịu phép báp-têm sẽ được cứu[a], nhưng người không tin[b] sẽ bị kết án.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn đạt tự nhiên hơn: “Ai tin và chịu phép báp-têm sẽ được cứu, nhưng ai không tin sẽ bị kết án.”'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, “người không tin” là một phân từ aorist thể chủ động dùng như danh từ; cũng có thể dịch sát hình thái hơn là “người đã không tin”, nhưng cách ấy kém tự nhiên trong tiếng Việt.
    reason: source_form
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: người đã tin
  rationale: Mạo từ đi với phân từ bất định thì quá khứ tạo thành cách gọi một người theo hành động ấy. “Người đã tin” giữ số ít đại diện và sắc thái hành động có trước kết quả ở thì tương lai.
- source_word: βαπτισθεὶς
  choice: đã chịu phép báp-têm
  rationale: Phân từ bất định thì quá khứ, thể bị động, được diễn đạt bằng “đã chịu phép báp-têm”, vừa giữ rõ thể bị động vừa cho thấy hành động có trước kết quả được nêu sau đó.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Động từ tương lai thể bị động mang nghĩa cứu rỗi trong ngữ cảnh này; cách dịch này trực tiếp, quen thuộc và không thêm diễn giải giáo lý.
- source_word: ὁ δὲ ἀπιστήσας
  choice: nhưng người không tin
  rationale: “Nhưng” thể hiện sự tương phản của δὲ. “Người không tin” là tiếng Việt tự nhiên cho phân từ được dùng như danh từ; tránh cách nói nặng nề “người đã không tin” nhưng vẫn giữ sự đối lập với “người đã tin”.
- source_word: κατακριθήσεται
  choice: sẽ bị kết án
  rationale: Thì tương lai thể bị động của κατακρίνω chỉ phán quyết bất lợi dẫn đến sự kết án; “sẽ bị kết án” là tương đương trực tiếp và tự nhiên.
- source_word: καὶ
  choice: và
  rationale: Liên từ nối hai phân từ trong mệnh đề đầu mà không thêm sắc thái nhân quả.
- source_word: δὲ
  choice: nhưng
  rationale: Ở đây δὲ đánh dấu sự tương phản giữa hai đối tượng và hai kết quả.
theological_decisions:
- issue: Mối liên hệ giữa đức tin, phép báp-têm và sự cứu rỗi
  choice: Dịch thẳng cả hai phân từ như những đặc điểm của người sẽ được cứu, không biến phép báp-têm thành nguyên nhân công hiệu được nói rõ, cũng không hạ thấp mối liên hệ mà câu văn nêu ra.
  alternative: Có thể diễn giải theo hướng phép báp-têm là phương tiện tất yếu để được cứu, hoặc theo hướng phép báp-têm chỉ là chi tiết phụ không liên quan đến lời hứa.
  rationale: Tiếng Hy Lạp nối “đã tin” với “đã chịu phép báp-têm” để mô tả người sẽ được cứu, nhưng vế sau chỉ nói người không tin sẽ bị kết án, chứ không nói rõ về người chưa chịu phép báp-têm. Bản dịch vì thế giữ nguyên sức căng thần học của câu.
- issue: Cấu trúc giống đực số ít mang nghĩa đại diện
  choice: Dùng “người” ở số ít với nghĩa khái quát.
  alternative: Dùng số nhiều “những người” hoặc đại từ “ai”.
  rationale: Các phân từ giống đực số ít trong tiếng Hy Lạp có chức năng danh từ và mang nghĩa đại diện. Tiếng Việt không đánh dấu giống ở từ “người”, nên cách dịch này vừa giữ số ít vừa không tạo hàm ý chỉ nói về nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ thuật ngữ “phép báp-têm” để diễn đạt hành động chịu báp-têm theo thể bị động; tránh bổ sung cách giải thích mang tính hệ phái.
