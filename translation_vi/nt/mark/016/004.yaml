  register: Tiếng Việt tiêu chuẩn hiện đại, sáng rõ và trang nghiêm. Giữ trình tự nhận biết của câu Hy Lạp và sắc thái kết quả của thì hoàn thành bị động; tránh cách diễn đạt cổ hoặc mang màu sắc hệ phái.
