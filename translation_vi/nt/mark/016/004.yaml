  source_fidelity: 'Bản dịch giữ đúng trình tự: các phụ nữ ngước nhìn rồi thấy tảng đá đang ở tình trạng đã được lăn khỏi vị trí trước đó. Tuy nhiên, “đã được lăn ra rồi” không tự nhiên trong tiếng Việt và “ra” có thể gợi chuyển động đi ra khỏi một không gian hơn là khỏi chỗ che cửa mộ. “Đã lăn ra” diễn đạt tự nhiên tình trạng kết quả của thể hoàn thành bị động mà không suy đoán tác nhân.'
