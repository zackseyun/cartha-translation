base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: vi
  text: Ngước mắt lên, họ thấy tảng đá đã lăn ra, vì tảng đá ấy rất lớn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: Ngước mắt lên
  rationale: Diễn đạt tự nhiên hành động các phụ nữ nâng tầm nhìn về phía mộ, đồng thời giữ sắc thái của phân từ aorist đi trước động từ chính.
- source_word: θεωροῦσιν
  choice: họ thấy
  rationale: Trong mạch kể chuyện, cách dịch đơn giản này truyền đạt rõ sự nhận biết bằng mắt và tự nhiên hơn các từ trang trọng như “quan sát” hay “chiêm ngưỡng”.
- source_word: ὅτι
  choice: (thể hiện bằng cấu trúc trực tiếp sau “thấy”)
  rationale: Tiếng Việt không cần một từ tương ứng với “rằng” trong cấu trúc này; lược từ nối giúp câu tự nhiên mà vẫn giữ nguyên nội dung điều họ thấy.
- source_word: ἀποκεκύλισται
  choice: đã được lăn ra rồi
  rationale: “Đã được” giữ thể bị động và hành động hoàn tất; “rồi” nhấn mạnh tình trạng kết quả đang hiện hữu khi họ nhìn thấy.
- source_word: ὁ λίθος
  choice: tảng đá
  rationale: Chỉ tảng đá dùng để chắn cửa mộ; “tảng đá” tự nhiên và gợi đúng kích thước hơn “hòn đá”, không thêm ý ngoài bản Hy Lạp.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: vì tảng đá ấy rất lớn
  rationale: “Vì” giữ chức năng giải thích của γάρ; “rất lớn” chuyển tải cường độ của σφόδρα bằng tiếng Việt hiện đại, trang trọng và tự nhiên.
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Trong tiếng Việt, mở câu bằng “Và” ở đây dễ nặng tính mô phỏng; sự tiếp nối trình thuật đã rõ từ ngữ cảnh, nên lược bỏ để câu tự nhiên mà không mất ý.
