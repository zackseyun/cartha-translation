reference: Mark 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: vi
  text: Sau đó, Ngài hiện ra với chính Mười Một khi họ đang dùng bữa[a]. Ngài quở trách sự không tin và lòng chai cứng của họ, vì họ không tin những người đã thấy Ngài sau khi Ngài đã được phục sinh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “khi họ đang nằm nghiêng”; đây là tư thế thường dùng khi ăn vào thời ấy.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “những người đã thấy Ngài trong tình trạng đã được phục sinh.” Nguyên văn dùng một phân từ hoàn thành thể bị động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Sau đó
  rationale: Diễn đạt tự nhiên một sự việc xảy ra về sau trong trình tự tường thuật; cũng có thể dịch là “Về sau”.
- source_word: ἀνακειμένοις
  choice: khi họ đang dùng bữa
  rationale: Động từ chỉ tư thế nằm nghiêng theo tập tục khi ăn; bản dịch chính truyền đạt hoàn cảnh bữa ăn một cách tự nhiên trong tiếng Việt, còn chú thích giữ chi tiết văn hóa.
- source_word: αὐτοῖς τοῖς ἕνδεκα
  choice: với chính mười một môn đồ
  rationale: “Chính” phản ánh sắc thái nhấn mạnh của αὐτοῖς; “môn đồ” giúp độc giả nhận ra đây là nhóm Mười Một sau khi Giu-đa không còn ở trong nhóm.
- source_word: ἐφανερώθη
  choice: hiện ra
  rationale: Trong bối cảnh các lần hiện ra sau phục sinh, “hiện ra” là cách diễn đạt rõ ràng, tự nhiên và phù hợp với thể bị động của động từ Hy Lạp.
- source_word: ὠνείδισεν
  choice: quở trách
  rationale: Truyền đạt lời khiển trách mạnh mẽ mà không dùng từ cổ hoặc quá nặng sắc thái diễn giải.
- source_word: ἀπιστίαν
  choice: sự vô tín
  rationale: Chỉ việc không tin lời chứng đã được thuật lại; “sự vô tín” giữ được dạng danh từ và sắc thái thần học của nguyên văn.
- source_word: σκληροκαρδίαν
  choice: lòng cứng cỏi
  rationale: Giữ hình ảnh Kinh Thánh về nội tâm kháng cự, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với lối ghép từ quá sát chữ.
- source_word: θεασαμένοις
  choice: những người đã thấy
  rationale: Diễn đạt trực tiếp rằng đây là những người tận mắt thấy Chúa Giê-su sau khi Ngài được khiến sống lại.
- source_word: ἐγηγερμένον
  choice: sau khi Ngài được khiến sống lại
  rationale: Giữ ý nghĩa phục sinh và sắc thái bị động của phân từ hoàn thành ἐγείρω, đồng thời đặt sự nhìn thấy sau biến cố ấy một cách rõ ràng trong tiếng Việt.
- source_word: οὐκ ἐπίστευσαν
  choice: họ không tin
  rationale: Diễn đạt tự nhiên việc họ đã từ chối tin lời chứng trước khi Chúa hiện ra; trình tự thời gian đã rõ từ ngữ cảnh.
theological_decisions:
- issue: Cách diễn đạt ἐγηγερμένον về sự phục sinh
  choice: sau khi Ngài được khiến sống lại
  alternative: sau khi Ngài sống lại; thấy Ngài đã sống lại
  rationale: Nguyên văn dùng phân từ hoàn thành thể bị động. Bản dịch giữ thể bị động thay vì âm thầm chuyển thành chủ động, nhưng không bổ sung danh tính của tác nhân mà câu Hy Lạp không nêu.
- issue: Hình ảnh trong σκληροκαρδία
  choice: lòng cứng cỏi
  alternative: sự ngoan cố
  rationale: Giữ hình ảnh “lòng” của nguyên văn và sức nặng thần học về sự kháng cự bên trong, thay vì thu hẹp ý nghĩa thành một nét tính cách đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; giữ các cách nói giàu âm hưởng Kinh Thánh như “sự vô tín” và “lòng cứng cỏi”, đồng thời dùng “đang dùng bữa” trong câu chính để tránh khiến độc giả hiện đại hiểu sai tập tục nằm nghiêng khi ăn.
