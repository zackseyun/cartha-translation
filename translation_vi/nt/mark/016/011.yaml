  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: vi
  text: Còn họ, khi nghe tin rằng Ngài còn sống và đã được bà nhìn thấy, thì không tin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: họ
  rationale: Đại từ chỉ nhóm người vừa được nhắc đến; trong tiếng Việt, “họ” tự nhiên hơn việc dịch cứng sắc thái chỉ định, còn mạch nối được thể hiện qua cấu trúc câu.
- source_word: ἀκούσαντες
  choice: Khi nghe
  rationale: Phân từ bất định mang chức năng trạng ngữ thời gian; “khi nghe” diễn đạt rõ trình tự sự việc bằng tiếng Việt hiện đại.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung họ nghe được.
- source_word: ζῇ
  choice: Ngài đang sống
  rationale: Động từ hiện tại diễn tả tình trạng sống đang tiếp diễn. “Đang sống” giữ rõ giá trị hiện tại của nguyên văn trong bối cảnh phục sinh.
- source_word: καὶ
  choice: và
  rationale: 'Liên kết hai nội dung của lời chứng: Ngài đang sống và bà ấy đã thấy Ngài.'
- source_word: ἐθεάθη
  choice: đã thấy Ngài
  rationale: Động từ bất định thể bị động theo hình thức, nghĩa sát là “Ngài đã được bà ấy nhìn thấy”; tiếng Việt tự nhiên thường chuyển thành chủ động với người thấy làm chủ thể mà không đổi nội dung.
- source_word: ὑπ’ αὐτῆς
  choice: bà ấy
  rationale: Giữ đại từ hồi chỉ về người phụ nữ ở văn cảnh trước, không tự ý thay bằng tên riêng.
- source_word: ἠπίστησαν
  choice: họ không tin
  rationale: Diễn đạt trực tiếp sự không tin vào lời thuật lại, không thêm sắc thái cố ý khước từ vốn không bắt buộc trong từ Hy Lạp.
theological_decisions:
- issue: Cách diễn đạt sự sống sau phục sinh
  choice: Ngài đang sống
  alternative: Ngài vẫn sống; Ngài sống
  rationale: Giữ thì hiện tại của ζῇ và ý nghĩa sự sống đang tiếp diễn, không biến lời chứng thành một tình trạng chỉ thuộc quá khứ.
- issue: Góc nhìn của ἐθεάθη
  choice: bà ấy đã thấy Ngài
  alternative: Ngài đã được bà ấy nhìn thấy; Ngài đã hiện ra cho bà ấy
  rationale: Cách chủ động tự nhiên trong tiếng Việt vẫn giữ sự kiện bà ấy nhìn thấy Ngài. Không chọn “hiện ra” trong chính văn vì từ này có thể nhấn mạnh sự tự bày tỏ của Chúa Giê-su nhiều hơn điều thể bị động của θεάομαι nhất thiết hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối xưng gọi kính trọng phổ biến; “bà ấy” giữ liên kết đại từ với người phụ nữ trong câu trước. Không cần chú thích vì các sắc thái chính của nguyên văn đã được thể hiện rõ trong câu dịch.
