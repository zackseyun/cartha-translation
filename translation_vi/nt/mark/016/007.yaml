source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: vi
  text: 'Nhưng hãy đi báo cho các môn đệ của Ngài và Phi-e-rơ[a] rằng: ‘Ngài đã đi trước anh em đến Ga-li-lê. Ở đó anh em sẽ thấy Ngài, đúng như Ngài đã nói với anh em.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phi-e-rơ được nêu riêng bên cạnh “các môn đệ của Ngài”. Điều này có thể gợi đến sự phục hồi của ông sau khi chối Ngài, nhưng bản Hy Lạp không nói rõ “đặc biệt là Phi-e-rơ”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản và chuyển hướng mạnh sang mệnh lệnh phải hành động; cách dịch ngắn gọn, tự nhiên.
- source_word: ὑπάγετε
  choice: hãy đi
  rationale: Mệnh lệnh số nhiều, truyền đạt rõ yêu cầu rời chỗ và lên đường mà không diễn giải quá mức sắc thái thể.
- source_word: εἴπατε
  choice: nói với
  rationale: Phù hợp với các đối tượng nhận ở cách dữ và nội dung lời nhắn theo sau; tự nhiên trong tiếng Việt.
- source_word: τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ
  choice: các môn đồ của Ngài và Phi-e-rơ
  rationale: Giữ nguyên phép nối đơn giản bằng καί và việc Phi-e-rơ được nêu riêng, không thêm ý ‘đặc biệt là’ hoặc ‘kể cả’.
- source_word: ὅτι
  choice: 'rằng: ‘…’'
  rationale: Giới thiệu nội dung lời nhắn; dấu hai chấm và lời trích dẫn giúp câu tiếng Việt rõ ràng.
- source_word: Προάγει ὑμᾶς
  choice: Ngài đang đi trước các ngươi
  rationale: Giữ sắc thái chuyển động đi trước của προάγω và thì hiện tại, đồng thời tránh từ ngữ quá trang trọng.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: đến Ga-li-lê
  rationale: Trong ngữ cảnh chỉ đích đến, εἰς có thể diễn đạt tự nhiên là ‘đến’; tiếng Việt không cần ép sắc thái ‘vào trong’.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: Tại đó, các ngươi sẽ thấy Ngài
  rationale: Chuyển tải trực tiếp trạng từ chỉ nơi chốn và hành động thấy/gặp trong tương lai.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: đúng như Ngài đã nói với các ngươi
  rationale: Giữ quan hệ tương ứng do καθώς biểu thị và diễn đạt tự nhiên lời Đức Giê-su đã nói trước đó.
theological_decisions:
- issue: Phi-e-rơ được nêu riêng sau ‘các môn đồ của Ngài’
  choice: Giữ nguyên ‘các môn đồ của Ngài và Phi-e-rơ’
  alternative: ‘các môn đồ của Ngài, đặc biệt là Phi-e-rơ’ hoặc ‘các môn đồ của Ngài, kể cả Phi-e-rơ’
  rationale: Bản Hy Lạp nêu đích danh Phi-e-rơ bằng phép nối đơn giản, nhưng không nói rõ ‘đặc biệt’ hay ‘kể cả’. Cách dịch giữ nguyên sức căng về ý nghĩa tường thuật và thần học, không biến hàm ý có thể có về sự phục hồi thành lời khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘Ngài’ cho Đức Giê-su và ‘các ngươi’ cho đại từ số nhiều ὑμᾶς/ὑμῖν nhằm giữ rõ số nhiều và sắc thái lời truyền trực tiếp. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
