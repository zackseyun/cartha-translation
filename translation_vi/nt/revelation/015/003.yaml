id: REV.15.3
reference: Revelation 15:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: vi
  text: 'Họ hát bài ca của Môi-se, tôi tớ của Đức Chúa Trời, và bài ca của Chiên Con, rằng:


    “Công việc của Ngài thật lớn lao và kỳ diệu,

    Lạy Chúa, Đức Chúa Trời, Đấng Toàn Năng!

    Đường lối Ngài thật công chính và chân thật,

    Lạy Vua của muôn thời đại[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Vua của các dân tộc” thay cho “Vua của muôn thời đại.”'
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: Họ hát
  rationale: Thì hiện tại trong lời thuật khải tượng được chuyển tự nhiên bằng hiện tại tiếng Việt.
- source_word: ᾠδὴν
  choice: bài ca
  rationale: Diễn đạt nghĩa thông thường là một bài hát, đồng thời phù hợp với văn phong trang trọng mà không tự ý thêm sắc thái nghi lễ.
- source_word: Μωϋσέως
  choice: Môi-se
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: δούλου
  choice: tôi tớ
  rationale: Trong danh hiệu trang trọng của Môi-se, “tôi tớ” diễn tả người thuộc về và phụng sự Đức Chúa Trời; “nô lệ” sát nét lệ thuộc hơn nhưng trong tiếng Việt hiện nay dễ gợi chủ yếu đến sự cưỡng bức và làm lệch sắc thái của danh hiệu này.
- source_word: ἀρνίου
  choice: Chiên Con
  rationale: Giữ nguyên hình ảnh và danh hiệu chỉ về Đấng Christ vốn có tính nhất quán trong sách Khải Huyền.
- source_word: λέγοντες
  choice: rằng
  rationale: Dẫn trực tiếp nội dung bài ca một cách tự nhiên trong tiếng Việt.
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: những việc Ngài làm thật lớn lao và kỳ diệu
  rationale: Giữ cấu trúc vị ngữ và ý nghĩa về các hành động của Đức Chúa Trời, đồng thời tránh cách nói cứng “các công việc của Ngài”.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Lạy Chúa là Đức Chúa Trời, Đấng Toàn Năng
  rationale: 'Giữ đủ ba yếu tố của chuỗi xưng hô: Chúa, Đức Chúa Trời và Đấng Toàn Năng; “Lạy” thể hiện cách xưng hô trực tiếp.'
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: đường lối Ngài thật công chính và chân thật
  rationale: “Đường lối” giữ hình ảnh của ὁδοί; “công chính” và “chân thật” bảo toàn cả chiều kích đạo đức lẫn độ đáng tin cậy.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: Lạy Vua của muôn đời
  rationale: Diễn đạt tự nhiên danh hiệu dựa trên bản văn αἰώνων, mang nghĩa các thời đại/muôn đời, mà không đồng hóa với dị bản “các dân tộc”.
theological_decisions:
- issue: Cách dịch δοῦλος trong danh hiệu của Môi-se
  choice: tôi tớ của Đức Chúa Trời
  alternative: nô lệ của Đức Chúa Trời
  rationale: “Tôi tớ” là cách nói trang trọng, tự nhiên trong tiếng Việt và vẫn biểu thị sự thuộc về, vâng phục cùng chức vụ được giao. “Nô lệ” có thể làm nổi bật sự lệ thuộc nhưng dễ đưa vào sắc thái cưỡng bức không phải trọng tâm của danh hiệu trong ngữ cảnh này.
- issue: Dạng bản văn của danh hiệu cuối câu
  choice: Vua của muôn đời
  alternative: Vua của các dân tộc
  rationale: Bản chính đi theo SBLGNT với αἰώνων. Dị bản quan trọng ἐθνῶν được giữ trong chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp với một bài ca tôn thờ. Trật tự câu được điều chỉnh nhẹ cho tiếng Việt tự nhiên; các danh hiệu và phép song hành của nguyên văn được giữ rõ.
