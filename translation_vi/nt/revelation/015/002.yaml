id: REV.15.2
reference: Revelation 15:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: vi
  text: Tôi thấy như một biển thủy tinh pha lẫn lửa, và những người đã chiến thắng con thú, hình tượng của nó và con số của tên nó[a] đang đứng trên biển thủy tinh, cầm đàn hạc của Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: những người đã thoát khỏi quyền lực của con thú, hình tượng của nó và con số của tên nó. Cấu trúc Hy Lạp có thể nhấn mạnh sự chiến thắng đối với các thế lực ấy hoặc việc thoát khỏi quyền lực của chúng.'
    reason: alternative_reading
  - marker: b
    text: Cụm từ này cũng có thể chỉ những đàn hạc thuộc về Đức Chúa Trời, do Ngài ban, hoặc được dành riêng cho Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: một cảnh tượng như
  rationale: Diễn tả sự so sánh trong khải tượng, không khẳng định đó thật sự là một biển theo nghĩa đen.
- source_word: θάλασσαν ὑαλίνην
  choice: biển bằng thủy tinh
  rationale: Giữ hình ảnh nổi bật và cách diễn đạt được lặp lại trong câu; ὑάλινος có thể chỉ vật bằng thủy tinh hoặc giống thủy tinh.
- source_word: μεμιγμένην πυρί
  choice: pha lẫn lửa
  rationale: Phản ánh phân từ hoàn thành và giữ nguyên hình ảnh khác thường mà không giải thích thêm.
- source_word: τοὺς νικῶντας
  choice: những người đã chiến thắng
  rationale: Thể hiện ý thắng vượt của νικάω trong văn mạch sách Khải Huyền bằng cách nói tự nhiên và trang trọng.
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: con thú, hình tượng của nó và con số của tên nó
  rationale: Sau động từ 'chiến thắng', tiếng Việt không cần lặp giới từ; chú thích lưu lại khả năng ἐκ nhấn mạnh việc thoát ra khỏi quyền lực của con thú.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: đang đứng trên biển bằng thủy tinh
  rationale: Giữ nghĩa trực tiếp và hình ảnh gây ấn tượng của ἐπί với đối cách; không làm nhẹ thành 'bên biển'.
- source_word: κιθάρας τοῦ θεοῦ
  choice: những cây đàn hạc của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu rộng của sở hữu cách, có thể chỉ quyền sở hữu, nguồn ban hoặc sự dành riêng cho Đức Chúa Trời.
theological_decisions:
- issue: Quan hệ giữa những người chiến thắng và con thú được diễn tả bằng ἐκ lặp lại sau νικῶντας
  choice: Họ đã chiến thắng con thú, hình tượng của nó và con số của tên nó.
  alternative: Họ đã thoát khỏi con thú, hình tượng của nó và con số của tên nó, tức ra khỏi phạm vi quyền lực ấy.
  rationale: Cách hiểu 'chiến thắng' phù hợp mô-típ νικάω trong Khải Huyền và tự nhiên trong tiếng Việt, còn chú thích bảo tồn sắc thái xuất ly hay thoát khỏi có thể có của ἐκ.
- issue: Quan hệ sở hữu cách trong κιθάρας τοῦ θεοῦ
  choice: đàn hạc của Đức Chúa Trời
  alternative: đàn hạc do Đức Chúa Trời ban hoặc dành riêng cho Đức Chúa Trời
  rationale: Bản dịch chính không quyết định sở hữu cách chỉ quyền sở hữu, nguồn gốc hay sự dâng hiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός; giữ hình ảnh khải tượng sát nguyên ngữ. “Hình tượng” được chọn thay vì “hình ảnh” để chỉ biểu tượng được dựng lên và thờ lạy trong văn mạch Khải Huyền.
