id: REV.15.8
reference: Revelation 15:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: vi
  text: Đền thánh[a] tràn ngập khói từ vinh quang của Đức Chúa Trời và từ quyền năng của Ngài; không ai có thể vào đền thánh cho đến khi bảy tai họa của bảy thiên sứ hoàn tất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch “đền thờ” thay cho “đền thánh” (Hy Lạp: ναός), dù từ này thường chỉ cụ thể hơn nơi thánh bên trong, nơi Đức Chúa Trời ngự, chứ không phải toàn bộ khuôn viên đền thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: đền thánh
  rationale: Trong Khải Huyền, từ này thường chỉ nơi ngự thánh bên trong hơn là toàn bộ khuôn viên đền thờ; “đền thánh” vừa tự nhiên vừa giữ được sắc thái chuyên biệt ấy.
- source_word: ἐγεμίσθη
  choice: đầy
  rationale: Diễn đạt tự nhiên trạng thái phát sinh từ động từ aorist bị động; trong tiếng Việt, “đầy khói” truyền tải rõ nghĩa “được làm cho đầy” mà không cần dùng cấu trúc bị động nặng nề.
- source_word: καπνοῦ
  choice: khói
  rationale: Đây là nghĩa thông dụng và phù hợp với hình ảnh thần hiện trong văn mạch.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ
  choice: phát ra từ vinh quang của Đức Chúa Trời và từ quyền năng Ngài
  rationale: “Phát ra từ” làm rõ ἐκ chỉ nguồn gốc của khói, đồng thời giữ nguyên hai nguồn được cấu trúc Hy Lạp nêu song song.
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: không ai có thể vào
  rationale: Cách nói hiện đại, tự nhiên, truyền đạt đúng ý không có ai có khả năng vào.
- source_word: ἄχρι τελεσθῶσιν
  choice: cho đến khi ... hoàn tất
  rationale: Giữ giới hạn thời gian và sắc thái đạt đến sự hoàn thành của động từ bị động, đồng thời tránh lối diễn đạt tiếng Việt gượng ép.
- source_word: πληγαὶ
  choice: tai họa
  rationale: Trong Khải Huyền, từ này chỉ những đòn phán xét giáng xuống; “tai họa” rõ nghĩa và tự nhiên hơn “dịch lệ” vì không phải mọi πληγή trong chuỗi này đều là bệnh dịch.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: của bảy thiên sứ
  rationale: Giữ nguyên quan hệ sở thuộc/liên hệ của cấu trúc sở hữu cách mà không xác định quá mức thiên sứ là người mang hay thi hành các tai họa.
theological_decisions:
- issue: Cách dịch ναός trong bối cảnh thờ phượng trên trời mang tính khải huyền
  choice: đền thánh
  alternative: đền thờ
  rationale: “Đền thánh” hướng đến nơi ngự thánh bên trong của Đức Chúa Trời, phù hợp cách dùng ναός, nhưng không thêm một khẳng định giáo lý vượt quá câu văn.
- issue: Quan hệ giữa khói với vinh quang và quyền năng của Đức Chúa Trời
  choice: khói phát ra từ vinh quang ... và từ quyền năng
  alternative: khói bởi vinh quang ... và quyền năng
  rationale: Cách chọn giữ ἐκ như dấu chỉ nguồn gốc, không đồng nhất khói với chính vinh quang hay quyền năng và cũng không giải thích thêm bản chất của hiện tượng.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời”, “Ngài”, “thiên sứ” theo lối Kinh Thánh phổ thông; giữ cấu trúc song song “từ ... và từ ...”. Dấu chú thích [a] được đặt ngay sau mệnh đề có thuật ngữ được giải thích.
