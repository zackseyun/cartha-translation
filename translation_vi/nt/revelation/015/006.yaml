    issue: «vải gai» dịch λίνον không chính xác
    rationale: λίνον chỉ lanh/vải lanh (linen, flax), còn «vải gai» trong tiếng Việt chỉ chất liệu gai/hemp; hai chất liệu này không đồng nhất.
  - severity: low
    issue: «nơi thánh» có thể quá chuyên biệt hoặc mơ hồ đối với ναός
    rationale: Trong ngữ cảnh này ναός là thánh điện/đền thờ thiên thượng, không nhất thiết là khu vực thường gọi riêng là «Nơi Thánh». «Thánh điện» rõ hơn, đồng thời chú thích bảo lưu «đền thờ».
