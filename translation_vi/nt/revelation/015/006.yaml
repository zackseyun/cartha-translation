id: REV.15.6
reference: Revelation 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: vi
  text: Và bảy thiên sứ mang bảy tai họa từ thánh điện[a] đi ra, mặc áo vải lanh sạch, sáng chói[b], và thắt quanh ngực những đai vàng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đền thờ”; từ Hy Lạp ναός thường chỉ thánh điện hoặc phần thánh bên trong, chứ không phải toàn bộ khuôn viên đền thờ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vải lanh tinh sạch, rực sáng.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “thắt quanh ngực những đai vàng.”'
    reason: literal_rendering
lexical_decisions:
- source_word: ἐξῆλθον
  choice: đi ra
  rationale: Động từ chỉ sự di chuyển từ bên trong ra ngoài; “đi ra” tự nhiên trong tiếng Việt và không áp đặt điểm nhìn bằng “đến”.
- source_word: οἱ ἑπτὰ ἄγγελοι
  choice: bảy thiên sứ
  rationale: Trong khải tượng thiên thượng của sách Khải Huyền, ἄγγελοι chỉ các thiên sứ, không phải sứ giả loài người.
- source_word: τὰς ἑπτὰ πληγὰς
  choice: bảy tai họa
  rationale: πληγή ở đây chỉ những đòn giáng phán xét từ Đức Chúa Trời; “tai họa” rõ nghĩa và phù hợp mạch văn.
- source_word: ἐκ τοῦ ναοῦ
  choice: từ nơi thánh
  rationale: ναός thường chỉ chính điện hoặc phần thánh bên trong, hẹp hơn toàn bộ khuôn viên đền thờ; “nơi thánh” vừa dễ hiểu vừa giữ được nét nghĩa ấy.
- source_word: ἐνδεδυμένοι λίνον
  choice: mặc vải gai
  rationale: Cụm từ mô tả trạng thái được mặc bằng chất liệu λίνον. “Vải gai” là cách gọi tiếng Việt thông dụng cho vải lanh trong văn phong Kinh Thánh.
- source_word: καθαρὸν λαμπρὸν
  choice: sạch và sáng
  rationale: 'Giữ riêng hai phẩm tính của nguyên văn: καθαρός là sạch/tinh sạch và λαμπρός là sáng/rực sáng, không gộp nghĩa.'
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: ngực thắt
  rationale: Diễn đạt gọn và tự nhiên tư thế thắt hoặc quấn đai quanh vùng ngực, đồng thời giữ vị trí khác thường của đai thay vì chuyển xuống thắt lưng.
- source_word: ζώνας χρυσᾶς
  choice: đai vàng
  rationale: ζώνη là đai hoặc dải thắt; “đai” phù hợp với vật được thắt quanh ngực, còn χρυσᾶς được diễn đạt trực tiếp là “vàng”.
theological_decisions:
- issue: Phạm vi nghĩa của ναός trong khung cảnh đền thờ thiên thượng
  choice: nơi thánh
  alternative: đền thờ
  rationale: “Nơi thánh” bảo toàn nghĩa cụ thể hơn của ναός là phần thánh hoặc chính điện, nhưng chú thích vẫn nêu cách dịch rộng và quen thuộc là “đền thờ”.
- issue: Sắc thái của καθαρόν khi mô tả y phục thiên sứ
  choice: sạch
  alternative: tinh sạch
  rationale: Nguyên văn có thể gợi cả sự sạch sẽ lẫn sự tinh sạch; bản chính dùng nghĩa trực tiếp “sạch” và chú thích bảo tồn khả năng “tinh sạch” mà không biến sắc thái thành một khẳng định giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được tách làm hai để tránh chuỗi bổ nghĩa nặng nề trong tiếng Việt. “Thiên sứ”, “tai họa”, “nơi thánh” duy trì sắc thái khải tượng; các chú thích bảo tồn những lựa chọn từ vựng có ý nghĩa mà không làm rối câu chính.
