revisions:
- from: Bảy thiên sứ mang bảy tai họa từ nơi thánh[a] đi ra. Họ mặc vải gai sạch và sáng[b], ngực thắt đai vàng[c].
  to: Và bảy thiên sứ mang bảy tai họa từ thánh điện[a] đi ra, mặc áo vải lanh sạch, sáng chói[b], và thắt quanh ngực những đai vàng[c].
  rationale: Sửa chất liệu y phục từ «vải gai» thành «vải lanh» để phù hợp với λίνον. Đổi «nơi thánh» thành «thánh điện» để phản ánh ναός rõ hơn trong khải tượng, nhưng không loại bỏ cách dịch «đền thờ» trong chú thích. Giữ nguyên số lượng, quan hệ sở hữu «mang bảy tai họa», vị trí đặc biệt của đai quanh ngực, và các chú thích có neo hợp lệ.
