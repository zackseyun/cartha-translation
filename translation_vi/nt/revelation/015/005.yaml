source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: vi
  text: Sau những điều ấy, tôi thấy đền thờ[a] ở trên trời của Lều Chứng Ước[b] được mở ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi thánh”; ναός có thể nhấn mạnh phần thánh bên trong, chứ không phải toàn bộ khuôn viên đền thờ.
    reason: lexical_alternative
  - marker: b
    text: “Lều Chứng Ước” gợi lại ngôn ngữ Cựu Ước về nơi thánh, đặc biệt là lều trong hoang mạc gắn với chứng ước giao ước của Đức Chúa Trời.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: Sau những điều ấy
  rationale: Giữ số nhiều của ταῦτα và công thức chuyển tiếp theo trình tự trong văn khải huyền; tiếng Việt không cần giữ liên từ mở đầu một cách máy móc.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Diễn đạt trực tiếp sự tri nhận trong khải tượng; “tôi nhìn” sẽ nhấn vào hành động nhìn hơn là điều được thấy.
- source_word: ἠνοίγη
  choice: được mở ra
  rationale: Phản ánh thể bị động aorist và diễn tả tự nhiên việc đền thờ chuyển sang trạng thái mở.
- source_word: ναὸς
  choice: đền thờ
  rationale: Là cách gọi quen thuộc, trang trọng; trong ngữ cảnh này từ Hy Lạp có thể nhấn mạnh chính nơi thánh bên trong, nên ghi chú phương án “nơi thánh”.
- source_word: τῆς σκηνῆς
  choice: của Lều
  rationale: “Lều” giữ hình ảnh nơi thờ phượng thời hoang mạc và tự nhiên hơn từ vay mượn “đền tạm”; viết hoa trong cụm danh xưng “Lều Chứng Ước”.
- source_word: τοῦ μαρτυρίου
  choice: Chứng Ước
  rationale: Trong ngữ cảnh thờ phượng, μαρτύριον gợi đến chứng ngôn giao ước gắn với lều thánh; “Chứng Ước” bảo tồn liên hệ Cựu Ước tốt hơn cách dịch chung chung “lời chứng”.
- source_word: ἐν τῷ οὐρανῷ
  choice: ở trên trời
  rationale: Cách nói tiếng Việt tự nhiên, xác định đền thờ thuộc cõi trời.
theological_decisions:
- issue: Hình ảnh nơi thánh trên trời
  choice: đền thờ của Lều Chứng Ước ở trên trời
  alternative: nơi thánh trên trời; đền thờ ở trên trời, tức là Lều Chứng Ước
  rationale: Giữ quan hệ sở hữu chồng lớp trong nguyên văn và âm hưởng thờ phượng của Cựu Ước, không giản lược các hình ảnh thành một lời diễn giải thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp tự nhiên theo tiếng Việt nhưng vẫn giữ đầy đủ chuỗi hình ảnh thờ phượng và trình tự của nguyên văn.
