id: REV.15.4
reference: Revelation 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: vi
  text: Ai lại không kính sợ Ngài, lạy Chúa, và tôn vinh danh Ngài? Vì chỉ một mình Ngài là thánh. Mọi dân tộc sẽ đến thờ phượng trước mặt Ngài, vì những việc công chính của Ngài đã được bày tỏ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những phán quyết công chính của Ngài.” Từ Hy Lạp cũng có thể chỉ các phán quyết tư pháp hoặc luật lệ; ở đây có lẽ nói đến những việc công chính của Đức Chúa Trời nay đã được bày tỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Ai lại không kính sợ Ngài
  rationale: Câu hỏi tu từ với οὐ μή có sức nhấn mạnh và chờ đợi câu trả lời “không một ai”; “Ai lại không” diễn đạt tự nhiên sức mạnh ấy trong tiếng Việt. “Kính sợ” phù hợp với thái độ tôn kính trước Đức Chúa Trời, không chỉ là sợ hãi.
- source_word: κύριε
  choice: lạy Chúa
  rationale: κύριε là hô cách; “lạy Chúa” thể hiện trực tiếp lời xưng hô trang trọng trong ngữ cảnh thờ phượng.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: tôn vinh danh Ngài
  rationale: Giữ thành ngữ Kinh Thánh về việc quy vinh quang và danh dự cho danh, tức phẩm tính và uy danh được bày tỏ của Đức Chúa Trời.
- source_word: μόνος ὅσιος
  choice: chỉ một mình Ngài là thánh
  rationale: ὅσιος ở đây nói về sự thánh khiết và chính trực đặc biệt của Đức Chúa Trời trong một bài ca tôn vinh; thêm hệ từ “là” để câu tiếng Việt tự nhiên.
- source_word: πάντα τὰ ἔθνη
  choice: mọi dân tộc
  rationale: ἔθνη chỉ toàn thể các dân; “mọi dân tộc” giữ sắc thái tập thể và phổ quát, thích hợp với viễn cảnh cánh chung.
- source_word: ἥξουσιν
  choice: sẽ đến
  rationale: Thì tương lai được giữ rõ ràng, phù hợp với lời tuyên bố mang tính tiên tri.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: thờ phượng trước mặt Ngài
  rationale: προσκυνέω trong bối cảnh phụng vụ của Khải Huyền chỉ hành vi thờ phượng; ἐνώπιόν σου được thể hiện bằng “trước mặt Ngài”.
- source_word: τὰ δικαιώματά σου
  choice: những việc công chính của Ngài
  rationale: δικαιώματα có thể chỉ hành động công chính, phán quyết hoặc quy định. Trong ngữ cảnh các việc công chính của Đức Chúa Trời được hiển lộ cho muôn dân, cách dịch rộng này không thu hẹp từ thành luật lệ hoặc phán quyết בלבד.
- source_word: ἐφανερώθησαν
  choice: đã được bày tỏ
  rationale: Giữ thể bị động và biểu thị hành động đã xảy ra, nay trở nên rõ ràng trước mọi dân.
theological_decisions:
- issue: Ý nghĩa của ὅσιος trong lời tôn vinh Đức Chúa Trời
  choice: thánh
  alternative: thành tín; mộ đạo
  rationale: “Thánh” phù hợp nhất với lời ca thờ phượng và phẩm tính độc nhất của Đức Chúa Trời; “mộ đạo” thường mô tả con người, còn “thành tín” thu hẹp trường nghĩa.
- issue: Ý nghĩa của δικαιώματα trong bối cảnh phán xét khải huyền
  choice: những việc công chính
  alternative: những phán quyết công chính; các luật lệ
  rationale: Bối cảnh ca ngợi sự công chính của Đức Chúa Trời đã trở nên hữu hình qua những gì Ngài làm. Cách dịch này giữ độ rộng của từ Hy Lạp; chú thích nêu khả năng liên quan đến phán quyết.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng đại từ kính trọng “Ngài” và hô ngữ “lạy Chúa.” Cấu trúc câu hỏi tu từ được giữ tự nhiên; các vế lặp “vì” phản ánh mạch lý do của nguyên văn.
