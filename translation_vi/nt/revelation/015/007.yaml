  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu Hy Lạp: một trong bốn sinh vật, bảy thiên sứ, bảy bát vàng, sự thịnh nộ của Đức Chúa Trời, và Đức Chúa Trời sống đời đời. “Sinh vật” bảo toàn sự phân biệt quan trọng giữa ζῷον và θηρίον trong Khải Huyền. Tuy nhiên, cụm “sống đời đời vô cùng” hơi chồng nghĩa và kém tự nhiên trong tiếng Việt hiện đại.'
