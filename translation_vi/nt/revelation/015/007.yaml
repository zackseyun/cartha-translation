  terminology: “Thiên sứ,” “bát bằng vàng,” “cơn thịnh nộ,” và “Đức Chúa Trời” đều phù hợp văn phong Kinh Thánh tiếng Việt trang trọng và phản ánh tốt các từ ἄγγελοι, φιάλας χρυσᾶς, θυμός, và θεός. Giữ “sinh vật” là lựa chọn tốt để không lẫn với “con thú” (θηρίον).
  issues:
