id: REV.15.7
reference: Revelation 15:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: vi
  text: Một trong bốn sinh vật trao cho bảy thiên sứ bảy bát bằng vàng, đầy cơn thịnh nộ của Đức Chúa Trời, Đấng sống đời đời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “đến các đời của các đời.” Đây là thành ngữ chỉ thời gian vô tận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: một trong bốn sinh vật
  rationale: Trong Khải Huyền, ζῷον chỉ các hữu thể sống quanh ngai, khác với θηρίον là “con thú”; “sinh vật” vừa tự nhiên vừa giữ được sự phân biệt ấy.
- source_word: ἔδωκεν
  choice: trao cho
  rationale: Động từ δίδωμι có nghĩa cơ bản là “cho”; trong cảnh một vật được giao vào tay các thiên sứ, “trao cho” là cách diễn đạt tự nhiên mà không thêm ý.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: cho bảy thiên sứ
  rationale: ἄγγελος trong bối cảnh khải tượng chỉ các thiên sứ trên trời; “thiên sứ” là cách gọi trang trọng, quen thuộc.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: bảy bát bằng vàng
  rationale: φιάλη là vật chứa dạng bát rộng và tương đối nông, nên “bát” chính xác hơn “chai/lọ”; χρυσᾶς mô tả chất liệu, được diễn đạt rõ là “bằng vàng”.
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: đầy cơn thịnh nộ của Đức Chúa Trời
  rationale: γέμω với sở hữu cách diễn tả trạng thái đầy; θυμός ở đây chỉ cơn thịnh nộ của Đức Chúa Trời trong sự phán xét, và “thịnh nộ” giữ được sắc thái mạnh, trang nghiêm.
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: Đấng sống đời đời vô cùng
  rationale: Phân từ τοῦ ζῶντος bổ nghĩa cho Đức Chúa Trời, còn thành ngữ εἰς τοὺς αἰῶνας τῶν αἰώνων diễn tả sự tồn tại không cùng; cách dịch này tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ chỉ cơn thịnh nộ của Đức Chúa Trời
  choice: cơn thịnh nộ của Đức Chúa Trời
  alternative: cơn giận của Đức Chúa Trời
  rationale: “Thịnh nộ” bảo toàn cường độ của θυμός và sắc thái phán xét cánh chung, không giảm nhẹ thành cảm xúc giận dữ thông thường.
- issue: Mối liên hệ giữa sự sống của Đức Chúa Trời và thời gian vô tận
  choice: Đức Chúa Trời, Đấng sống đời đời vô cùng
  alternative: Đức Chúa Trời hằng sống cho đến đời đời
  rationale: Cách chọn gắn τοῦ ζῶντος trực tiếp với Đức Chúa Trời và để cụm chỉ thời gian bổ nghĩa cho việc Ngài sống, phù hợp cú pháp Hy Lạp mà không thêm một khẳng định ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “sinh vật” để tránh nhầm với “con thú” trong Khải Huyền; dùng “bát bằng vàng” nhằm diễn đạt rõ hình dạng và chất liệu của φιάλη. Dấu chú thích [a] được đặt ngay sau cụm thành ngữ tương ứng.
