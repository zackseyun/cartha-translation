id: REV.15.1
reference: Revelation 15:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: vi
  text: 'Rồi tôi thấy một dấu lạ khác trên trời, lớn lao và kỳ diệu: bảy thiên sứ mang bảy tai họa cuối cùng, vì trong các tai họa ấy, cơn thịnh nộ của Đức Chúa Trời được hoàn tất.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: dấu lạ
  rationale: Trong văn cảnh Khải Huyền, cụm từ này chỉ một hiện tượng hữu hình mang ý nghĩa biểu tượng; “dấu lạ” tự nhiên và rõ hơn “điềm” trong tiếng Việt hiện đại.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Chỉ cõi trời trong khải tượng, không chỉ bầu trời hữu hình; “trên trời” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: μέγα καὶ θαυμαστόν
  choice: lớn lao và kỳ diệu
  rationale: Giữ cả ý về tầm vóc lớn và sự gây kinh ngạc, đồng thời duy trì giọng văn trang trọng.
- source_word: ἔχοντας πληγὰς ἑπτὰ
  choice: cầm bảy tai họa
  rationale: “Cầm” diễn đạt tự nhiên việc các thiên sứ đang mang theo hoặc nắm giữ các tai họa; “tai họa” phù hợp với các hành động phán xét trong Khải Huyền.
- source_word: τὰς ἐσχάτας
  choice: cuối cùng
  rationale: Phản ánh trực tiếp vị trí sau cùng trong chuỗi các tai họa mà không diễn giải thêm.
- source_word: ὅτι
  choice: vì
  rationale: 'Giữ quan hệ nguyên nhân: đây là những tai họa cuối cùng vì cơn thịnh nộ của Đức Chúa Trời đạt đến sự hoàn tất qua chúng.'
- source_word: ἐν αὐταῖς
  choice: qua những tai họa ấy
  rationale: Trong tiếng Việt, “qua” diễn đạt tự nhiên phương diện hoặc phương tiện mà trong đó cơn thịnh nộ đạt đến chỗ hoàn tất; đại từ được triển khai để tránh mơ hồ.
- source_word: ἐτελέσθη
  choice: được hoàn tất
  rationale: Giữ thể bị động và sắc thái đạt đến sự trọn vẹn hoặc đích điểm, thay vì chỉ đơn thuần chấm dứt.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  rationale: Bảo toàn cường độ và tính trang trọng của ngôn ngữ phán xét trong văn cảnh Khải Huyền.
theological_decisions:
- issue: Ngôn ngữ về sự phán xét của Đức Chúa Trời
  choice: cơn thịnh nộ của Đức Chúa Trời
  alternative: cơn giận của Đức Chúa Trời
  rationale: “Thịnh nộ” giữ được sức nặng trang trọng của θυμός mà không làm nhẹ hoặc cường điệu ý nghĩa.
- issue: Ý nghĩa của ἐτελέσθη đối với cơn thịnh nộ
  choice: được hoàn tất
  alternative: chấm dứt
  rationale: Bản dịch giữ ý cơn thịnh nộ đạt đến sự hoàn thành trong các tai họa này, nhưng không suy diễn rằng câu này khẳng định mọi sự phán xét ở mọi phương diện đều kết thúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Rồi tôi thấy” để nối mạch khải tượng; giữ cấu trúc hai vế với dấu hai chấm nhằm làm rõ nội dung của dấu lạ.
