  terminology: «dấu lạ», «thiên sứ», «tai họa», «cơn thịnh nộ của Đức Chúa Trời» và «được hoàn tất» phù hợp với văn cảnh Khải Huyền và giữ sắc thái phán xét trang trọng. Không cần chú thích.
