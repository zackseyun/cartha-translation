revisions:
- from: 'Rồi tôi thấy một dấu lạ khác trên trời, lớn lao và kỳ diệu: bảy thiên sứ cầm bảy tai họa cuối cùng, vì qua những tai họa ấy, cơn thịnh nộ của Đức Chúa Trời được hoàn tất.'
  to: 'Rồi tôi thấy một dấu lạ khác trên trời, lớn lao và kỳ diệu: bảy thiên sứ mang bảy tai họa cuối cùng, vì trong các tai họa ấy, cơn thịnh nộ của Đức Chúa Trời được hoàn tất.'
  rationale: Thay «cầm» bằng «mang» để phản ánh chính xác hơn phân từ ἔχοντας mà không thêm chi tiết về cách các thiên sứ giữ các tai họa. Thay «qua những tai họa ấy» bằng «trong các tai họa ấy» để giữ ἐν αὐταῖς và tránh diễn giải quan hệ này thành phương tiện thuần túy. Các phần còn lại được giữ nguyên vì sát nghĩa và tự nhiên.
