id: REV.4.5
reference: Revelation 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: vi
  text: Từ ngai phát ra những tia chớp, những âm thanh và những tiếng sấm vang[a]; và trước ngai có bảy ngọn đèn lửa đang cháy[b], đó là bảy thần linh của Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “những tiếng nói” thay cho “những âm thanh”.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “bảy ngọn đuốc lửa đang cháy trước ngai”.'
    reason: lexical_alternative
  - marker: c
    text: Nhiều người hiểu “bảy thần linh của Đức Chúa Trời” là cách nói biểu tượng về sự viên mãn của Đức Thánh Linh duy nhất; nguyên văn Hy Lạp viết “bảy thần linh”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: phát ra
  rationale: Diễn tả tự nhiên các hiện tượng đang từ ngai mà ra, đồng thời giữ sắc thái thì hiện tại.
- source_word: ἀστραπαὶ
  choice: những tia chớp
  rationale: Cách nói tự nhiên trong tiếng Việt và phản ánh hình thức số nhiều.
- source_word: φωναὶ
  choice: những âm thanh
  rationale: φωνή có thể chỉ tiếng nói hoặc âm thanh; trong chuỗi hiện tượng gồm chớp và sấm, “âm thanh” không xác định quá mức nguồn phát.
- source_word: βρονταί
  choice: những tiếng sấm vang
  rationale: Diễn đạt tự nhiên sức mạnh và tính lặp lại của danh từ số nhiều.
- source_word: λαμπάδες πυρὸς
  choice: bảy ngọn đuốc rực lửa
  rationale: λαμπάς thường chỉ đuốc; “rực lửa” diễn đạt tự nhiên thuộc cách πυρός mà không làm mất hình ảnh cụ thể.
- source_word: καιόμεναι
  choice: đang cháy
  rationale: Giữ ý nghĩa tiếp diễn của phân từ hiện tại.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: trước ngai
  rationale: Cách diễn đạt không gian ngắn gọn, tự nhiên trong khung cảnh thiên đình.
- source_word: ἅ εἰσιν
  choice: đó là
  rationale: Đưa vào sự đồng nhất mang tính biểu tượng một cách rõ ràng, tự nhiên.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: bảy thần linh của Đức Chúa Trời
  rationale: Giữ nguyên hình thức số nhiều rõ ràng của tiếng Hy Lạp, không diễn giải thành “Thánh Linh bảy phương diện” hay một công thức thần học khác.
theological_decisions:
- issue: Cách hiểu τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: Dịch sát là “bảy thần linh của Đức Chúa Trời” trong chính văn.
  alternative: “Thánh Linh của Đức Chúa Trời trong sự viên mãn trọn vẹn” hoặc một cách nói tương đương về một Thánh Linh duy nhất.
  rationale: Nguyên văn dùng số nhiều “bảy thần linh”. Chính văn giữ sự căng thẳng thần học và tính biểu tượng của câu; chú thích chỉ nêu cách hiểu phổ biến chứ không thay thế lời văn Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “ngai” cho khung cảnh thiên đình, “Đức Chúa Trời” cho θεός, và giữ hình ảnh khải huyền cùng số nhiều của nguyên văn.
