  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của tiếng Hy Lạp: các hiện tượng phát ra từ ngai, ba danh từ số nhiều, bảy vật cháy trước ngai, và sự đồng nhất biểu tượng với “bảy thần linh của Đức Chúa Trời”. Tuy nhiên, chú thích b hiện lặp gần như nguyên văn cách dịch chính “ngọn đuốc”, nên không còn cung cấp phương án từ vựng thực sự khác biệt cho λαμπάδες πυρός.'
