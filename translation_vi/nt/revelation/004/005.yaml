  to: Từ ngai phát ra những tia chớp, những âm thanh và những tiếng sấm vang[a]; và trước ngai có bảy ngọn đèn lửa đang cháy[b], đó là bảy thần linh của Đức Chúa Trời[c].
  rationale: Đổi cách dịch chính của λαμπάδες πυρός thành “bảy ngọn đèn lửa” để tạo một lựa chọn chính tự nhiên trong tiếng Việt và để chú thích b có thể nêu thực chất phương án “ngọn đuốc”, vốn cũng được λαμπάς cho phép. Giữ nguyên số nhiều “bảy thần linh” trong chính văn. Điều chỉnh chú thích c chỉ nhằm tăng tính tự nhiên tiếng Việt, không giải quyết căng thẳng biểu tượng của nguyên văn.
