id: REV.4.1
reference: Revelation 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: vi
  text: 'Sau những điều ấy, tôi nhìn xem, và kìa, một cánh cửa đã mở sẵn trên trời; tiếng nói đầu tiên[a] mà tôi đã nghe, như tiếng kèn đang nói với tôi[c], phán: “Hãy lên đây, tôi sẽ cho anh thấy những điều phải xảy ra sau những điều ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “tiếng nói đầu tiên” có lẽ chỉ về tiếng nói Giăng đã nghe trước đó; xem Khải Huyền 1:10.
    reason: cross_reference
  - marker: b
    text: Cụm Hy Lạp “sau những điều ấy” xuất hiện cả ở đầu lẫn cuối câu. Cũng có thể dịch tự nhiên hơn là “sau đó” hoặc “sau việc này”.
    reason: lexical_alternative
  - marker: c
    text: Cụm được dịch là “đang nói với tôi” sát chữ hơn là “đang nói cùng tôi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những điều ấy
  rationale: Giữ số nhiều và sự lặp lại ở đầu lẫn cuối câu; không thu hẹp trình tự này thành một cách hiểu cánh chung cụ thể.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: tôi nhìn xem, và kìa
  rationale: Diễn đạt tự nhiên hành động hướng mắt vào khải tượng, đồng thời giữ dấu hiệu gây chú ý đột ngột ἰδού.
- source_word: θύρα ἠνεῳγμένη
  choice: một cánh cửa đang mở
  rationale: Thể hiện trạng thái hiện tại là cửa đã được mở và vẫn mở, phù hợp với phân từ hoàn thành bị động.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Chỉ cõi trời trong bối cảnh khải tượng, không phải đơn thuần bầu trời hữu hình.
- source_word: ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα
  choice: Tiếng nói đầu tiên mà tôi đã nghe
  rationale: Giữ cách gọi 'đầu tiên' và sắc thái hồi chỉ về tiếng nói đã nghe trước đó.
- source_word: ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ
  choice: như tiếng kèn đang nói với tôi
  rationale: Giữ phép so sánh với tiếng kèn và chuyển μετ’ ἐμοῦ sang cách nói Việt tự nhiên; chú thích nêu nghĩa sát chữ hơn.
- source_word: Ἀνάβα ὧδε
  choice: Hãy lên đây
  rationale: Mệnh lệnh hướng Giăng đi lên vị trí của người đang phán, tự nhiên và đúng điểm nhìn chỉ xuất.
- source_word: ἃ δεῖ γενέσθαι
  choice: những điều phải xảy ra
  rationale: Giữ sắc thái tất yếu của δεῖ mà không giải thích nguồn hay bản chất của sự tất yếu ấy.
theological_decisions:
- issue: Giá trị thời gian của cụm μετὰ ταῦτα được lặp lại
  choice: Dịch cả hai lần là 'sau những điều ấy'.
  alternative: Có thể dịch tự nhiên hơn là 'sau đó' hoặc 'sau việc này'.
  rationale: Bảo toàn sự lặp lại và số nhiều của nguyên văn, không quyết định rằng trình tự này nhất thiết là trình tự lịch sử, văn chương hay một sơ đồ cánh chung cụ thể.
- issue: Đối tượng được gọi là 'tiếng nói đầu tiên'
  choice: Giữ nguyên 'tiếng nói đầu tiên' và chỉ nêu khả năng hồi chỉ trong chú thích.
  alternative: Diễn giải ngay trong câu là 'tiếng nói tôi đã nghe lần đầu'.
  rationale: Nguyên văn có thể gợi lại tiếng nói ở Khải Huyền 1:10, nhưng không nên biến suy luận liên văn bản thành lời giải thích chắc chắn trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ 'kìa' để bảo toàn sắc thái khải tượng; dùng 'anh' khi tiếng nói trực tiếp gọi Giăng, tránh lối xưng hô quá cổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
