  verdict: revise
  source_fidelity: Bản dịch giữ đúng hai phép so sánh thị giác (ὅμοιος ὁράσει), không biến mô tả khải tượng thành khẳng định rằng Đấng ngự được cấu tạo bằng đá quý. “Mã não đỏ” là cách hiểu hiện đại hợp lý của σαρδίῳ; chú thích bảo lưu tên truyền thống “sardius”. “Cầu vồng” phản ánh trực tiếp ἶρις, và “chung quanh ngai” truyền đạt κυκλόθεν τοῦ θρόνου.
  naturalness: “Đấng ngự đó” không tự nhiên trong tiếng Việt hiện đại, vì “đó” ở đây có vẻ khẩu ngữ và không cần thiết. “Đấng ngự” vừa trang trọng vừa phù hợp với ngữ cảnh ngai. “Trông như” tự nhiên, ngắn gọn, vẫn bảo toàn ý nghĩa “về diện mạo”.
  terminology: Giữ “jasper” vì sự đồng nhất khoáng vật cổ không hoàn toàn chắc chắn; “mã não đỏ” và “ngọc lục bảo” là các tên dễ hiểu trong tiếng Việt hiện đại. Cách gọi “ngai” và động từ “ngự” duy trì văn phong trang trọng thích hợp mà không áp đặt diễn giải thần học.
