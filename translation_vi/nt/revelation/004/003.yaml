id: REV.4.3
reference: Revelation 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: vi
  text: Đấng ngự trông như đá jasper và mã não đỏ[a]. Chung quanh ngai có một cầu vồng[b] trông như ngọc lục bảo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ngọc sardius”, tên gọi truyền thống của loại đá quý này.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “một quầng sáng”; từ Hy Lạp có thể chỉ ánh sáng giống cầu vồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: Đấng ngự đó
  rationale: Phân từ có mạo từ chỉ Đấng đang ngồi trên ngai. “Ngự” là cách diễn đạt trang trọng, tự nhiên trong ngữ cảnh ngai, còn “đó” nối với khung cảnh đã được nêu ở câu trước.
- source_word: ὅμοιος ὁράσει
  choice: trông giống như
  rationale: Diễn đạt sự tương đồng về thị giác, không khẳng định Đấng ngự trên ngai có bản thể hay vật chất là đá quý.
- source_word: λίθῳ ἰάσπιδι
  choice: đá jasper
  rationale: Giữ tên loại đá là jasper vì việc đồng nhất chính xác loại đá cổ này không chắc chắn; tránh dùng “ngọc thạch”, vốn trong tiếng Việt hiện đại dễ bị hiểu là jade hoặc đá quý nói chung.
- source_word: σαρδίῳ
  choice: mã não đỏ
  rationale: Đây là tên gọi dễ hiểu trong tiếng Việt hiện đại cho carnelian, loại ngọc màu đỏ đến đỏ cam; chú thích giữ tên truyền thống “sardius” để người đọc đối chiếu.
- source_word: ἶρις
  choice: cầu vồng
  rationale: Nghĩa trực tiếp và tự nhiên nhất trong khải tượng là một dải sáng giống cầu vồng; chú thích bảo lưu khả năng hiểu là quầng sáng.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: chung quanh ngai
  rationale: Thể hiện rõ vị trí bao quanh ngai mà không thêm chi tiết ngoài nguyên văn.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: trông giống như ngọc lục bảo
  rationale: Giữ ngôn ngữ so sánh về diện mạo và dùng tên gọi phổ thông của emerald trong tiếng Việt.
theological_decisions:
- issue: Khải tượng mô tả Đấng ngự trên ngai bằng phép so sánh thay vì mô tả trực tiếp thân thể
  choice: Giữ cách nói “trông giống như”
  alternative: Diễn đạt rằng Đấng ấy được cấu tạo từ đá quý hoặc phát ra những màu xác định của đá quý
  rationale: Cụm ὅμοιος ὁράσει nhấn mạnh sự tương đồng trong điều người thấy, không đồng nhất bản thể của Đấng ngự trên ngai với các loại đá.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ngự” phù hợp với hình ảnh ngai và tước vị thần thượng; các câu ngắn, rõ. Giữ tên vay mượn “jasper” để tránh đồng nhất không chắc chắn với jade, đồng thời dùng “mã não đỏ” và “ngọc lục bảo” là các tên dễ hiểu hơn với độc giả phổ thông.
