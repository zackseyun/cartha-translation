  terminology: '“Thánh Linh,” “ngai,” và “ngự” phù hợp văn cảnh khải huyền. Chú thích nên dùng “trong thần trí” thay cho “trong tâm linh”: cách nói này tự nhiên hơn trong văn phong Kinh Thánh tiếng Việt và diễn đạt rõ khả năng chỉ trạng thái khải tượng, không nhất thiết đồng nhất với Thánh Linh.'
  issues:
