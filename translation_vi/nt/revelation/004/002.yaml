  - severity: low
    issue: Chú thích dùng “trong tâm linh” cho lựa chọn “in spirit.”
    rationale: “Trong thần trí” là lựa chọn Việt ngữ tự nhiên và chính xác hơn cho trạng thái nội tâm/khải tượng; nó cũng tránh gợi một khái niệm trừu tượng hóa quá mức.
