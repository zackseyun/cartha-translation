  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: tính tức thời (εὐθέως), trạng thái ἐν πνεύματι, lời gọi chú ý ἰδού, ngai ở trên trời, và nhân vật ngự trên ngai. Tuy nhiên, “có Đấng ngự” dễ làm mờ tính chất giới thiệu của phân từ danh từ hóa καθήμενος; thêm “một” bảo toàn tốt hơn việc câu Hy Lạp chưa nêu danh tính.'
