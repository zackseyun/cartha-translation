id: REV.4.2
reference: Revelation 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: vi
  text: Lập tức, tôi ở trong Thánh Linh[a]; và kìa, một ngai được đặt trên trời, trên ngai có một Đấng ngự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thần trí.” Cụm từ Hy Lạp không có mạo từ và có thể chỉ việc ở trong Thánh Linh hoặc ở trong một trạng thái tâm linh/khải tượng.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Lập tức
  rationale: Diễn tả sự chuyển tiếp xảy ra ngay, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐγενόμην
  choice: tôi ở
  rationale: Trong cụm ἐγενόμην ἐν πνεύματι, cách dịch này tự nhiên hơn 'tôi trở nên' trong tiếng Việt; trạng từ 'lập tức' vẫn thể hiện việc bước vào trạng thái khải tượng.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Trong sách Khải Huyền, cụm này thường đánh dấu trạng thái tiên tri/khải tượng do Thánh Linh tác động; chú thích giữ lại khả năng hiểu là 'trong tâm linh'.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Từ gọi sự chú ý phù hợp với sắc thái khải huyền, trang trọng nhưng vẫn dễ hiểu.
- source_word: θρόνος
  choice: một ngai
  rationale: Danh từ không có mạo từ giới thiệu một yếu tố mới trong khải tượng; 'một' thể hiện tự nhiên chức năng này trong tiếng Việt.
- source_word: ἔκειτο
  choice: được đặt
  rationale: κεῖμαι ở đây chỉ chiếc ngai hiện diện, được đặt tại một vị trí; 'được đặt' phù hợp với ngai hơn nghĩa đen 'nằm'.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Chỉ cõi trời trong bối cảnh khải huyền, không phải bầu trời khí quyển.
- source_word: καθήμενος
  choice: Đấng ngự
  rationale: Phân từ được dùng như danh từ chỉ nhân vật ngồi trên ngai. 'Đấng ngự' trang trọng, tự nhiên trong ngữ cảnh ngai trời và không nêu danh tính vượt quá bản Hy Lạp.
theological_decisions:
- issue: ἐν πνεύματι chỉ Thánh Linh hay trạng thái tâm linh/khải tượng
  choice: trong Thánh Linh
  alternative: trong tâm linh
  rationale: Công thức này trong Khải Huyền nhiều khả năng nói đến kinh nghiệm tiên tri dưới tác động của Thánh Linh. Tuy nhiên, tiếng Hy Lạp không có mạo từ, nên khả năng chỉ trạng thái tâm linh được bảo lưu trong chú thích.
- issue: Danh tính của καθήμενος
  choice: Đấng ngự
  alternative: một vị đang ngồi
  rationale: Viết hoa và dùng 'Đấng' phù hợp với nhân vật thiên thượng ngự ngai trong văn cảnh, nhưng bản dịch không thêm tên hay danh xưng thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu sắc thái khải huyền. Tách câu sau πνεύματι để tiếng Việt sáng rõ; giữ 'Kìa' nhằm tái hiện lời gọi chú ý của ἰδοὺ.
