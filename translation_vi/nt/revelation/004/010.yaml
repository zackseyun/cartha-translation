- from: hai mươi bốn trưởng lão sẽ sấp mình trước Đấng ngự trên ngai, thờ phượng Đấng hằng sống đời đời vô cùng[a], và ném mão triều thiên của mình xuống trước ngai mà nói rằng:[b]
  to: 'Hai mươi bốn trưởng lão sẽ sấp mình trước Đấng ngự trên ngai, thờ phượng Đấng hằng sống đời đời vô cùng[a], và ném các vương miện của mình[b] trước ngai, mà nói rằng:'
  rationale: Bản sửa loại bỏ chi tiết “xuống” không được nêu trong nguyên ngữ, thay cách gọi ít tự nhiên “mão triều thiên” bằng “vương miện,” và chuyển neo chú thích [b] đến đúng danh từ στεφάνους. Các danh xưng mô tả vẫn không định danh thêm đối tượng thần học ngoài điều câu văn nói.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung phản ánh đúng ba hành động ở thì tương lai, các danh xưng mô tả của Đấng trên ngai, và tính chất tôn thờ của προσκυνέω. Tuy nhiên, “ném ... xuống” thêm hướng chuyển động không được nói rõ trong βάλλω, và “mão triều thiên” kém tự nhiên, có sắc thái dư thừa so với στεφάνους.
  naturalness: Văn phong trang trọng và dễ hiểu. “Vương miện” là từ hiện đại, tự nhiên hơn “mão triều thiên”; đặt chú thích ngay sau từ được chú giải cũng rõ ràng hơn.
  terminology: Giữ “trưởng lão,” “Đấng ngự trên ngai,” “thờ phượng,” và “Đấng hằng sống” là phù hợp. “Vương miện” chuyển đạt tự nhiên στεφάνους, đồng thời chú thích bảo lưu nghĩa vòng hoa/vòng nguyệt quế chiến thắng.
  issues:
