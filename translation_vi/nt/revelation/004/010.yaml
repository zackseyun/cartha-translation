  - severity: low
    issue: “mão triều thiên” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này vừa có sắc thái cổ vừa gần như lặp nghĩa. “Vương miện” là cách gọi hiện đại, rõ nghĩa và phù hợp với hình ảnh στεφάνους; chú thích có thể nêu sắc thái vòng hoa chiến thắng.
  - severity: low
    issue: Ký hiệu chú thích [b] đặt ở cuối câu thay vì sau danh từ được giải thích.
    rationale: Chú thích [b] giải thích στεφάνους/vương miện, nên cần neo ngay sau “vương miện” để tránh bị hiểu là chú thích cho cả mệnh đề “mà nói rằng.”
