id: REV.4.10
reference: Revelation 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: vi
  text: 'Hai mươi bốn trưởng lão sẽ sấp mình trước Đấng ngự trên ngai, thờ phượng Đấng hằng sống đời đời vô cùng[a], và ném các vương miện của mình[b] trước ngai, mà nói rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “cho đến các thời đại của các thời đại.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “vương miện” cũng có thể chỉ vòng hoa chiến thắng được trao như dấu hiệu vinh dự.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: sẽ sấp mình
  rationale: Diễn tả hành động hạ mình xuống trong sự tôn kính; tự nhiên hơn cách dịch máy móc “sẽ ngã xuống” và không nhất thiết xác định tư thế chi tiết hơn nguyên văn.
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: hai mươi bốn trưởng lão
  rationale: “Trưởng lão” là cách gọi phổ thông, trang trọng và phù hợp với bối cảnh thiên đình trong sách Khải Huyền.
- source_word: ἐνώπιον
  choice: trước
  rationale: Tương đương ngắn gọn, tự nhiên cho cả hai lần xuất hiện, mang nghĩa ở trước mặt hoặc trong sự hiện diện của.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Đấng ngự trên ngai
  rationale: Giữ cấu trúc danh hóa của phân từ, đồng thời dùng lối diễn đạt tiếng Việt trang trọng và tự nhiên về một nhân vật đang ở địa vị trị vì.
- source_word: προσκυνήσουσιν
  choice: thờ phượng
  rationale: Trong ngữ cảnh hướng đến Đấng ngự ngai, động từ chỉ sự tôn thờ, không chỉ là cử chỉ cúi lạy.
- source_word: τῷ ζῶντι
  choice: Đấng hằng sống
  rationale: Diễn đạt tự nhiên danh xưng dựa trên phân từ, nhấn mạnh sự sống bền vững của Đấng ấy mà không thêm định danh ngoài câu.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Thành ngữ tiếng Việt trang trọng và dễ hiểu, truyền đạt thời gian không dứt; nghĩa sát chữ được ghi ở chú thích.
- source_word: βαλοῦσιν
  choice: ném ... xuống
  rationale: Giữ nét mạnh và sinh động của βάλλω hơn “đặt xuống”, đồng thời “xuống” làm hành động trước ngai rõ ràng trong tiếng Việt.
- source_word: τοὺς στεφάνους αὐτῶν
  choice: mão triều thiên của mình
  rationale: “Mão triều thiên” phù hợp hình ảnh vương quyền và vinh dự trong Khải Huyền; chú thích bảo lưu sắc thái vòng hoa chiến thắng của στέφανος.
- source_word: λέγοντες
  choice: mà nói rằng
  rationale: Liên kết tự nhiên phân từ với chuỗi hành động trước đó và báo hiệu lời phát biểu theo sau.
theological_decisions:
- issue: Đối tượng của các danh xưng “Đấng ngự trên ngai” và “Đấng hằng sống”
  choice: Giữ nguyên các danh xưng mô tả, không nêu rõ là Đức Chúa Trời hay Đức Chúa Cha.
  alternative: Diễn giải trực tiếp đối tượng là Đức Chúa Trời hoặc Đức Chúa Cha.
  rationale: Ngữ cảnh cho thấy Đấng ngự ngai là Đức Chúa Trời, nhưng chính câu Hy Lạp chỉ dùng các danh xưng mô tả. Bản dịch không đưa thêm một định danh thần học mà câu này không phát biểu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “Đấng ngự” và “Đấng hằng sống” để giữ sắc thái tôn kính của khải tượng; dùng “mão triều thiên” thay vì từ chuyên môn hoặc cổ hơn. Dấu chú thích [a] được đặt ngay sau cụm mà chú thích giải thích; [b] được đặt ở cuối câu vì chú thích liên quan đến danh từ xuất hiện trước đó.
