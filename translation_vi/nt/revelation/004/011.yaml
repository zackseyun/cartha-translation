id: REV.4.11
reference: Revelation 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: vi
  text: '“Ngài xứng đáng[a], lạy Chúa và Đức Chúa Trời của chúng con,

    nhận lấy vinh quang, sự tôn kính và quyền năng,

    vì chính Ngài đã tạo dựng muôn vật;

    do ý muốn của Ngài[b], chúng hiện hữu và được tạo dựng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo trật tự ít nhấn mạnh hơn: “Lạy Chúa và Đức Chúa Trời của chúng con, Ngài xứng đáng.” Tiếng Hy Lạp đặt “xứng đáng” ở đầu câu để nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bởi ý muốn của Ngài.” Cụm từ Hy Lạp διὰ τὸ θέλημά σου chủ yếu có sắc thái nguyên nhân (“do, vì”), nhưng cũng có thể được hiểu với sắc thái phương tiện (“bởi”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Ngài thật xứng đáng
  rationale: Diễn đạt tự nhiên vị ngữ chỉ sự xứng đáng, đồng thời đặt ở đầu câu như tiếng Hy Lạp để giữ sự nhấn mạnh; “thật” làm rõ sắc thái tung hô mà không thêm nội dung mới.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: lạy Chúa và Đức Chúa Trời của chúng con
  rationale: Cụm danh từ có mạo từ được dùng như lời xưng hô trực tiếp trong ngữ cảnh thờ phượng. “Lạy” tạo thể hô cách tự nhiên và trang trọng; hai tước hiệu cùng chỉ Đấng đang được thưa với.
- source_word: λαβεῖν
  choice: nhận lấy
  rationale: Động từ nguyên mẫu bổ nghĩa cho “xứng đáng”, nói về điều Đấng được xưng tụng đáng nhận. “Nhận lấy” phù hợp ngữ cảnh thờ phượng hơn nghĩa vật lý “cầm lấy”.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: vinh quang, tôn quý và quyền năng
  rationale: Giữ nguyên ba yếu tố của lời tôn vinh và nhịp điệu trang trọng. Tiếng Việt không cần lặp từ xác định trước từng danh từ.
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: vì Ngài đã tạo dựng muôn vật
  rationale: ὅτι nêu lý do cho sự xứng đáng; đại từ σὺ được thể hiện bằng “Ngài”, còn τὰ πάντα được chuyển thành “muôn vật” để giữ phạm vi bao quát trong văn phong trang trọng.
- source_word: διὰ τὸ θέλημά σου
  choice: do ý muốn của Ngài
  rationale: διά với đối cách chủ yếu chỉ nguyên nhân hoặc căn cứ. “Do” tự nhiên trong tiếng Việt, đặt sự hiện hữu và tạo dựng trong quan hệ với ý muốn của Đức Chúa Trời mà không buộc cụm từ chỉ thuần nguyên nhân hay phương tiện.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: chúng đã hiện hữu và được tạo dựng
  rationale: 'Giữ riêng hai động từ: ἦσαν nói đến sự hiện hữu, còn ἐκτίσθησαν là thể thụ động nói đến việc được tạo dựng. “Đã” đánh dấu bình diện quá khứ mà không lặp nặng nề.'
theological_decisions:
- issue: Cách hiểu chuỗi tước hiệu dùng như lời xưng hô
  choice: lạy Chúa và Đức Chúa Trời của chúng con
  alternative: Chúa là Đức Chúa Trời của chúng con
  rationale: Bản dịch giữ cả hai tước hiệu và chức năng xưng hô trực tiếp của câu Hy Lạp, không biến câu thành một mệnh đề đồng nhất hóa có động từ vốn không xuất hiện trong nguyên văn.
- issue: Quan hệ giữa ý muốn của Đức Chúa Trời với sự hiện hữu và tạo dựng
  choice: do ý muốn của Ngài
  alternative: bởi ý muốn của Ngài
  rationale: Cách dịch chính ưu tiên sắc thái nguyên nhân thường thấy của διά với đối cách, nhưng không diễn giải thêm về cơ chế tạo dựng. Chú thích ghi nhận khả năng hiểu theo sắc thái phương tiện.
- issue: Quan hệ giữa ἦσαν và ἐκτίσθησαν
  choice: chúng đã hiện hữu và được tạo dựng
  alternative: chúng có mặt rồi được tạo dựng
  rationale: Giữ nguyên sự căng thẳng của hai động từ nối tiếp thay vì sắp xếp lại thành một trình tự triết học hoặc thời gian mà câu Hy Lạp không giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp điệu phụng tụng. Dùng “Ngài” để xưng hô tôn kính, “muôn vật” để diễn đạt phạm vi bao quát, và giữ hai động từ “hiện hữu”/“được tạo dựng” nhằm phản ánh cấu trúc cùng độ căng của nguyên văn.
