revisions:
- from: Chung quanh ngai có hai mươi bốn ngai khác; trên các ngai ấy có hai mươi bốn trưởng lão đang ngồi, mình mặc y phục trắng, đầu đội những mão miện bằng vàng.[a]
  to: Chung quanh ngai có hai mươi bốn ngai; trên các ngai ấy có hai mươi bốn trưởng lão ngồi, mặc y phục trắng, đầu đội những mão miện bằng vàng.[a]
  rationale: Bản sửa loại bỏ yếu tố “khác” không có trong nguyên văn, làm câu tiếng Việt tự nhiên hơn, và điều chỉnh chú thích để phản ánh đầy đủ phạm vi nghĩa của στέφανος mà không áp đặt một cách hiểu về căn tính hay địa vị của các trưởng lão.
  reviewer_model: gpt-5.6-terra
