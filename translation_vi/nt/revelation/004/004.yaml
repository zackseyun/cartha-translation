id: REV.4.4
reference: Revelation 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: vi
  text: Chung quanh ngai có hai mươi bốn ngai; trên các ngai ấy có hai mươi bốn trưởng lão ngồi, mặc y phục trắng, đầu đội những mão miện bằng vàng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những vòng hoa bằng vàng”; từ Hy Lạp có thể chỉ mão hoặc vòng hoa được trao để tôn vinh hay thưởng cho chiến thắng, chứ không chỉ vương miện của vua.
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: chung quanh
  rationale: Diễn tả vị trí bao quanh ngai trung tâm một cách tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: θρόνοι
  choice: ngai
  rationale: Nguyên văn lặp lại cùng danh từ θρόνος đã dùng cho ngai trung tâm. Giữ từ “ngai” bảo toàn hình ảnh vương quyền hoặc xét xử; thêm “khác” chỉ nhằm phân biệt các ngai bao quanh với ngai trung tâm, không hàm ý khác loại.
- source_word: εἴκοσι τέσσαρες
  choice: hai mươi bốn
  rationale: Cách diễn đạt chuẩn của số từ trong tiếng Việt.
- source_word: ἐπὶ τοὺς θρόνους
  choice: trên các ngai ấy
  rationale: Diễn đạt tự nhiên vị trí của các trưởng lão, đồng thời liên kết rõ với hai mươi bốn ngai vừa được nhắc đến.
- source_word: πρεσβυτέρους
  choice: trưởng lão
  rationale: Đây là danh xưng của một nhóm trong khải tượng, không chỉ đơn thuần mô tả tuổi tác; cách dịch này không xác định thêm căn tính của họ.
- source_word: καθημένους
  choice: đang ngồi
  rationale: Chuyển phân từ sang cách diễn đạt tự nhiên trong tiếng Việt, mô tả tư thế của các trưởng lão trong cảnh tượng.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: mình mặc y phục trắng
  rationale: Thể hiện trạng thái đang khoác mặc; “y phục” giữ sắc thái trang trọng mà không thu hẹp nghĩa thành một kiểu áo cụ thể như áo dài hay áo choàng.
- source_word: στεφάνους χρυσοῦς
  choice: những mão miện bằng vàng
  rationale: “Mão miện” truyền đạt hình ảnh vật đội đầu biểu thị danh dự, chiến thắng hoặc địa vị; “bằng vàng” diễn đạt trực tiếp chất liệu. Chú thích giữ lại khả năng hiểu là vòng hoa chiến thắng.
theological_decisions:
- issue: Tính chất của hai mươi bốn θρόνοι bao quanh
  choice: Dịch là “ngai” thay vì “ghế” để giữ sự lặp từ và hình ảnh vương quyền hoặc xét xử trong nguyên văn.
  alternative: Dịch là “ghế” để tránh gợi ý rằng các trưởng lão có chủ quyền ngang với Đấng ngự trên ngai trung tâm.
  rationale: Nguyên văn dùng lại chính danh từ θρόνος. Ngữ cảnh vẫn phân biệt ngai trung tâm với các ngai chung quanh, nên không cần làm yếu hình ảnh bằng một từ khác.
- issue: Căn tính của hai mươi bốn trưởng lão
  choice: Giữ danh xưng “trưởng lão” mà không giải thích thêm.
  alternative: Diễn giải họ là đại diện Hội Thánh, các hữu thể thiên sứ, hoặc đại diện Israel cùng các sứ đồ.
  rationale: Câu này chỉ gọi họ là πρεσβύτεροι và không xác định căn tính; bản dịch không nên đưa một cách giải thích thần học riêng vào chính văn.
- issue: Sắc thái của στεφάνους
  choice: Dịch là “mão miện” và ghi chú khả năng chỉ vòng hoa chiến thắng hoặc danh dự.
  alternative: Dịch thẳng là “vòng hoa chiến thắng”.
  rationale: στέφανος có thể chỉ mão hoặc vòng được trao vì chiến thắng hay danh dự, không nhất thiết là vương miện hoàng gia. Chính văn giữ hình ảnh quen thuộc, còn chú thích bảo toàn phạm vi nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngai”, “trưởng lão”, “y phục” và “mão miện” để giữ sắc thái uy nghi của khải tượng mà không trở nên cổ kính quá mức. Dấu chấm phẩy giúp làm rõ hai phần của cấu trúc dài trong nguyên văn.
