id: REV.4.8
reference: Revelation 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: vi
  text: 'Bốn sinh vật, mỗi sinh vật có sáu cánh, đầy mắt cả chung quanh lẫn phía trong; ngày đêm chúng không hề nghỉ, cứ nói:


    “Thánh thay, thánh thay, thánh thay,

    Chúa, là Đức Chúa Trời, Đấng Toàn Năng,

    Đấng đã có, hiện có và đang đến.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách truyền thống: “Đấng đã có, hiện có và sẽ đến.”'
    reason: Nêu cách dịch thành ngữ truyền thống của ὁ ἐρχόμενος, bên cạnh cách dịch chính giữ sắc thái phân từ hiện tại.
lexical_decisions:
- source_word: ζῷα
  choice: sinh vật
  rationale: Trong Khải Huyền, từ này chỉ các hữu thể sống thuộc khải tượng; “sinh vật” tự nhiên hơn “thú vật” và không khiến người đọc hiểu chúng chỉ là động vật thông thường.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: mỗi sinh vật
  rationale: 'Diễn đạt rõ ý phân phối: từng sinh vật trong số bốn sinh vật.'
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: có sáu cánh
  rationale: Cách nói gọn và tự nhiên, đồng thời cho thấy mỗi sinh vật đều có sáu cánh.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: ở chung quanh và phía trong
  rationale: Giữ cả hai chiều không gian của nguyên văn mà không diễn giải thêm vị trí chính xác của các mắt.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: đầy những mắt
  rationale: Phản ánh trực tiếp động từ “đầy” cùng hình ảnh khải tượng sống động.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: không ngừng nghỉ
  rationale: Giữ nghĩa không có sự nghỉ ngơi hay gián đoạn, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἡμέρας καὶ νυκτός
  choice: ngày đêm
  rationale: Thành ngữ tiếng Việt ngắn gọn diễn tả hoạt động liên tục.
- source_word: λέγοντες
  choice: mà nói
  rationale: Giữ sắc thái trung tính của động từ, không thêm cường độ như “kêu lớn” hay “hô vang”.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Thánh thay, thánh thay, thánh thay
  rationale: Bảo toàn nguyên vẹn sự lặp lại ba lần và dùng cách tung hô trang trọng, tự nhiên trong tiếng Việt.
- source_word: κύριος, ὁ θεός
  choice: Chúa là Đức Chúa Trời
  rationale: Phản ánh hai danh hiệu thần linh κύριος và ὁ θεός, đồng thời tạo câu tung hô tiếng Việt rõ nghĩa.
- source_word: ὁ παντοκράτωρ
  choice: Đấng Toàn Năng
  rationale: Danh hiệu quen thuộc, trang trọng, truyền đạt quyền năng và quyền tể trị bao trùm tất cả.
- source_word: ὁ ἐρχόμενος
  choice: Đấng đang đến
  rationale: Giữ lực của phân từ hiện tại, trình bày sự đến như đang hướng tới và không làm phẳng thành một tương lai đơn thuần.
theological_decisions:
- issue: Công thức thời gian thần linh ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: Đấng đã có, hiện có và đang đến
  alternative: Đấng đã có, hiện có và sẽ đến
  rationale: “Đang đến” bảo toàn sắc thái của phân từ hiện tại ὁ ἐρχόμενος và tính khẩn thiết cánh chung, trong khi “sẽ đến” là cách dịch truyền thống, tự nhiên nhưng thiên về tương lai hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Lời tung hô được xuống dòng theo thể thơ phụng vụ; dấu câu tránh câu quá dài. Đại từ “chúng” dùng cho các sinh vật để tự nhiên trong tiếng Việt mà không định nghĩa bản thể của chúng.
