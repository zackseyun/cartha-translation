id: REV.4.7
reference: Revelation 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: vi
  text: Sinh vật thứ nhất giống như sư tử; sinh vật thứ hai giống như bò con; sinh vật thứ ba có khuôn mặt như người[a]; còn sinh vật thứ tư giống như đại bàng đang bay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có một khuôn mặt con người.” Tiếng Hy Lạp sát nghĩa là: “có khuôn mặt như người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: sinh vật
  rationale: Diễn đạt một hữu thể sống, đồng thời tránh dùng “con thú”, vốn dễ lẫn với θηρίον chỉ các thế lực thù nghịch về sau trong sách Khải Huyền.
- source_word: ὅμοιον
  choice: giống như
  rationale: Giữ rõ ý so sánh, không đồng nhất các sinh vật với sư tử, bò con hay đại bàng.
- source_word: λέοντι
  choice: sư tử
  rationale: Tương đương tự nhiên và trực tiếp của danh từ Hy Lạp.
- source_word: μόσχῳ
  choice: bò con
  rationale: μόσχος thường chỉ bò non; “bò con” giữ độ rộng về giới tính và không đưa thêm hàm ý tế lễ.
- source_word: ἔχων
  choice: có
  rationale: Chuyển phân từ thành động từ hữu hạn để câu tiếng Việt tự nhiên mà vẫn giữ nguyên nội dung miêu tả.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: có mặt giống như mặt người
  rationale: Giữ cả danh từ πρόσωπον và lực so sánh của ὡς; “người” trong tiếng Việt tự nhiên bao quát con người mà không cần ấn định giới tính.
- source_word: ἀετῷ πετομένῳ
  choice: đại bàng đang bay
  rationale: “Đại bàng” là nghĩa phù hợp nhất trong hình ảnh khải tượng; “đang bay” diễn đạt trực tiếp phân từ πετομένῳ và làm nổi bật trạng thái chuyển động.
theological_decisions:
- issue: Cách diễn đạt ἀνθρώπου trong diện mạo của sinh vật thứ ba
  choice: mặt giống như mặt người
  alternative: mặt người
  rationale: Bản dịch chính giữ phép so sánh do ὡς đánh dấu, thay vì biến hình ảnh thành sự đồng nhất; tiếng Việt “người” có thể chỉ con người nói chung.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng cấu trúc liệt kê cân đối; thêm “còn” ở vế cuối để câu tiếng Việt trôi chảy. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
