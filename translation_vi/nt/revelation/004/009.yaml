  terminology: “Vinh quang,” “sự tôn kính,” “lời cảm tạ,” “ngai,” và “đời đời vô cùng” phù hợp với tiếng Việt hiện đại trang trọng. Cần chỉnh riêng chú thích để nêu phương án sát hình thức mà không khiến “các thời đại” bị hiểu như một mốc đích do từ “đến.”
