id: REV.4.9
reference: Revelation 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: vi
  text: Mỗi khi các sinh vật dâng vinh quang, sự tôn kính và lời cảm tạ lên Đấng ngồi trên ngai, Đấng sống đời đời vô cùng[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa: “cho các thời đại của các thời đại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Mỗi khi
  rationale: Diễn đạt sắc thái thời gian bất định và có tính lặp lại của ὅταν trong khung cảnh thờ phượng này, thay vì chỉ một lần duy nhất.
- source_word: δώσουσιν
  choice: dâng
  rationale: Động từ δίδωμι có nghĩa cơ bản là “cho”; trong ngữ cảnh các sinh vật hướng vinh quang, sự tôn kính và lời cảm tạ lên Đấng ngự ngai, “dâng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt mà không thêm nội dung vào ba bổ ngữ.
- source_word: τὰ ζῷα
  choice: các sinh vật
  rationale: Chỉ các hữu thể sống quanh ngai đã được giới thiệu trước đó. Không thêm “bốn” vì câu này không lặp lại con số ấy.
- source_word: δόξαν
  choice: vinh quang
  rationale: Giữ nghĩa trực tiếp và sắc thái tôn vinh của δόξα, không chuyển thành hành động “ca ngợi”.
- source_word: τιμήν
  choice: sự tôn kính
  rationale: Diễn đạt τιμή như sự kính trọng dành cho Đấng trên ngai; danh từ có “sự” giữ cấu trúc song song với các danh từ còn lại.
- source_word: εὐχαριστίαν
  choice: lời cảm tạ
  rationale: Thể hiện hành vi cảm tạ được bày tỏ, tự nhiên hơn “sự biết ơn” vốn có thể chỉ thiên về tâm trạng bên trong.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: lên Đấng ngồi trên ngai
  rationale: “Đấng ngồi trên ngai” bám sát phân từ và hình ảnh ngai; “lên” kết hợp tự nhiên với động từ “dâng” trong tiếng Việt.
- source_word: τῷ ζῶντι
  choice: Đấng sống
  rationale: Giữ danh xưng bằng phân từ và cấu trúc đồng vị của tiếng Hy Lạp, không tự ý thêm danh xưng “Đức Chúa Trời”.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Đây là thành ngữ chỉ thời gian không cùng; “đời đời vô cùng” rõ nghĩa, trang trọng và tự nhiên trong văn phong Kinh Thánh tiếng Việt. Cách dịch sát hình thức hơn được ghi ở chú thích.
theological_decisions:
- issue: Cách thể hiện danh xưng của Đấng ngự ngai mà không thêm sự xác định ngoài nguyên văn
  choice: Đấng ngồi trên ngai, Đấng sống đời đời vô cùng
  alternative: Đức Chúa Trời ngồi trên ngai, là Đấng sống đời đời vô cùng
  rationale: Nguyên văn nhận diện Đấng này qua việc ngồi trên ngai và sống đời đời, nhưng không trực tiếp thêm danh từ “Đức Chúa Trời”. Bản dịch giữ cấu trúc đồng vị và để ngữ cảnh xác định đối tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp ba thành tố “vinh quang, sự tôn kính và lời cảm tạ”, đồng thời duy trì dấu phẩy cuối câu vì câu 9 tiếp tục sang câu kế tiếp.
