id: REV.4.6
reference: Revelation 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: vi
  text: Trước ngai có vật gì như một biển thủy tinh[a], giống như pha lê. Ở giữa ngai và xung quanh ngai[c] có bốn sinh vật[b] đầy mắt, ở phía trước và phía sau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một biển như thủy tinh.” Tiếng Hy Lạp trình bày đây là một sự so sánh: có vật gì như một biển thủy tinh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bốn hữu thể sống.” Từ Hy Lạp ở đây không chỉ những “con thú” thù nghịch xuất hiện về sau trong sách Khải Huyền.'
    reason: lexical_alternative
  - marker: c
    text: Cụm “ở giữa ngai và xung quanh ngai” khó hình dung về mặt không gian. Có lẽ cách nói này phản ánh phối cảnh của thị kiến; bản dịch giữ sát cách diễn đạt của nguyên văn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: phía trước
  rationale: Diễn đạt quan hệ không gian với ngai một cách tự nhiên trong tiếng Việt, không mở rộng thành ý niệm trừu tượng về sự hiện diện.
- source_word: ὡς
  choice: có vật gì như
  rationale: Giữ rõ tính so sánh và sự xấp xỉ của cảnh tượng khải thị, thay vì đồng nhất vật được thấy với một biển thật.
- source_word: θάλασσα ὑαλίνη
  choice: biển bằng thủy tinh
  rationale: Giữ hình ảnh danh từ–tính từ của Hy Lạp và cách diễn đạt quen thuộc, sống động; chú thích nêu phương án ‘biển như thủy tinh’ để tránh hiểu quá cứng theo nghĩa chất liệu.
- source_word: ὁμοία κρυστάλλῳ
  choice: giống như pha lê
  rationale: Thể hiện phép so sánh thứ hai, gợi vẻ trong sáng và rực rỡ mà không giải thích thêm ngoài bản văn.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: ở giữa ngai và chung quanh ngai
  rationale: Bám sát mô tả không gian khó của nguyên văn và giữ nguyên phối cảnh khải thị thay vì sắp xếp lại thành một hình học rõ ràng hơn.
- source_word: ζῷα
  choice: sinh vật
  rationale: Chỉ những hữu thể sống quanh ngai, đồng thời tránh từ ‘thú’ dễ khiến độc giả liên tưởng đến các con thú thù nghịch ở những đoạn sau của Khải Huyền.
- source_word: γέμοντα ὀφθαλμῶν
  choice: đầy những mắt
  rationale: Diễn đạt trực tiếp cấu trúc phân từ với bổ ngữ sở thuộc và giữ hình ảnh khác thường của nguyên văn.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: phía trước và phía sau
  rationale: Cặp từ chỉ vị trí tự nhiên trong tiếng Việt và không xác định quá mức mắt nằm trên những phần nào của các sinh vật.
theological_decisions:
- issue: Cách dịch ζῷα trong cảnh ngai trời
  choice: sinh vật
  alternative: hữu thể sống; thú
  rationale: ‘Sinh vật’ truyền đạt các hữu thể có sự sống trong thị kiến và tránh sắc thái thù nghịch mà ‘thú’ có thể gợi ra từ các đoạn sau, nhưng không xác định bản chất của chúng vượt quá nguyên văn.
- issue: Xử lý sự căng thẳng không gian trong ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: giữ nguyên ‘ở giữa ngai và chung quanh ngai’
  alternative: làm rõ thành ‘chung quanh ngai, ở vị trí trung tâm’; giải thích là ‘giữa ngai và vòng bao quanh ngai’
  rationale: Nguyên văn mô tả một vị trí khó hình dung, có thể phản ánh phối cảnh thị kiến. Bản dịch giữ sự mơ hồ đó, không áp đặt một sơ đồ không gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngai” theo lối diễn đạt Kinh Thánh quen thuộc; giữ nhịp câu thị kiến và những hình ảnh khác thường, không thêm lời giải nghĩa vào chính văn.
