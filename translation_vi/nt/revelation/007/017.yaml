id: REV.7.17
reference: Revelation 7:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: vi
  text: vì Chiên Con ở giữa ngai[a] sẽ chăn dắt họ và dẫn họ[b] đến các nguồn nước sự sống[c]; Đức Chúa Trời sẽ lau sạch mọi giọt lệ khỏi mắt họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở chính giữa ngai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hướng dẫn họ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đến các nguồn nước hằng sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: Chiên Con
  rationale: Giữ danh hiệu mang tính khải huyền và Kitô học quen thuộc trong sách Khải Huyền, đồng thời bảo toàn âm hưởng hiến tế và Mê-si.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: ở giữa ngai
  rationale: Diễn đạt vị trí trung tâm trong tương quan với ngai và giữ hình ảnh không gian sống động của nguyên văn; cách hiểu “ở chính giữa ngai” được ghi ở chú thích.
- source_word: ποιμανεῖ
  choice: sẽ chăn dắt
  rationale: 'Giữ nghĩa trực tiếp của động từ ποιμαίνω và nghịch lý có chủ ý: Chiên Con lại là Đấng chăn dắt.'
- source_word: ὁδηγήσει
  choice: dẫn
  rationale: Diễn đạt tự nhiên hành động đưa họ đến đích; “hướng dẫn” cũng khả dĩ nhưng ít phù hợp hơn với chuyển động đến các nguồn nước.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: đến các nguồn nước sự sống
  rationale: Hiểu ζωῆς bổ nghĩa cho nước, đồng thời dùng “nguồn” cho πηγή để gợi nước tự nhiên tuôn ra. Chú thích bảo lưu cách phân tích khả dĩ “các nguồn nước hằng sống”.
- source_word: ἐξαλείψει
  choice: sẽ lau sạch
  rationale: Phù hợp với hình ảnh an ủi về việc lau nước mắt; tự nhiên trong tiếng Việt mà vẫn thể hiện sự loại bỏ hoàn toàn.
- source_word: πᾶν δάκρυον
  choice: mọi giọt lệ
  rationale: Giữ sắc thái toàn thể và cụ thể của số ít đi với πᾶν; “giọt lệ” tạo hình ảnh tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: khỏi mắt họ
  rationale: Cách diễn đạt tiếng Việt tự nhiên cho nguồn hoặc vị trí mà nước mắt được lau sạch.
theological_decisions:
- issue: 'Nghịch lý Kitô học: Chiên Con là Đấng chăn dắt'
  choice: Giữ nguyên hình ảnh “Chiên Con ... sẽ chăn dắt họ”
  alternative: Chiên Con ... sẽ chăm nom họ / cai trị họ
  rationale: Nguyên văn cố ý kết hợp hình ảnh Chiên Con với vai trò người chăn. Dịch thành “chăm nom” hoặc “cai trị” sẽ làm yếu đi sự tương phản và liên hệ mục tử.
- issue: Quan hệ giữa Đức Chúa Trời và Chiên Con trong mệnh đề cuối
  choice: Giữ “Đức Chúa Trời” làm chủ ngữ được nêu rõ của mệnh đề cuối
  alternative: Hiểu Chiên Con tiếp tục là chủ ngữ ngầm
  rationale: Nguyên văn nêu rõ ὁ θεός là chủ ngữ của ἐξαλείψει; bản dịch không đồng nhất hai chủ thể trong khải tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chiên Con” và “Đức Chúa Trời” theo lối gọi quen thuộc trong tiếng Việt; giữ nhịp câu khải huyền và nghịch lý mục tử của nguyên văn.
