id: REV.7.12
reference: Revelation 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: vi
  text: 'họ nói: “A-men! Sự chúc tụng, vinh quang, sự khôn ngoan, lời cảm tạ, sự tôn quý, quyền năng và sức mạnh đều thuộc về Đức Chúa Trời chúng ta đời đời vô cùng.[a] A-men!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “cho đến các đời của các đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: họ nói
  rationale: Phân từ hiện tại chủ động, số nhiều, mở đầu nội dung lời tung hô; tiếng Việt tự nhiên dùng mệnh đề “họ nói”.
- source_word: Ἀμήν / ἀμήν
  choice: A-men
  rationale: Giữ cách phiên âm quen thuộc trong ngữ cảnh phụng vụ và lời tôn vinh; hai lần xuất hiện tạo thành khung cho lời tung hô.
- source_word: ἡ εὐλογία
  choice: sự chúc tụng
  rationale: Diễn đạt lời chúc tụng dâng lên Đức Chúa Trời, đồng thời giữ hình thức danh từ trong chuỗi bảy yếu tố.
- source_word: ἡ δόξα
  choice: vinh quang
  rationale: Cách dịch chuẩn, tự nhiên trong lời tôn vinh; tiếng Việt không cần lặp từ chỉ định tương ứng với mạo từ Hy Lạp.
- source_word: ἡ σοφία
  choice: sự khôn ngoan
  rationale: Giữ ý nghĩa về sự khôn ngoan và hình thức danh từ trong chuỗi.
- source_word: ἡ εὐχαριστία
  choice: lời cảm tạ
  rationale: Tự nhiên hơn “sự cảm tạ” trong tiếng Việt hiện đại mà vẫn bảo toàn ý nghĩa hành động tạ ơn được dâng lên.
- source_word: ἡ τιμή
  choice: sự tôn quý
  rationale: Trong ngữ cảnh thờ phượng, từ này chỉ sự tôn kính và phẩm giá được quy cho Đức Chúa Trời, không mang nghĩa giá trị kinh tế.
- source_word: ἡ δύναμις
  choice: quyền năng
  rationale: Từ ngữ quen thuộc và trang trọng để diễn đạt năng lực, quyền lực trong ngữ cảnh tôn vinh Đức Chúa Trời.
- source_word: ἡ ἰσχύς
  choice: sức mạnh
  rationale: Phân biệt với δύναμις (“quyền năng”) trong khi vẫn giữ sự gần nghĩa có chủ ý của hai từ.
- source_word: τῷ θεῷ ἡμῶν
  choice: đều thuộc về Đức Chúa Trời chúng ta
  rationale: Dịch cách cho chỉ đối tượng nhận hoặc đối tượng được quy về trong câu tôn vinh không có động từ; thêm “đều thuộc về” để câu tiếng Việt trọn nghĩa mà không xác định quá mức quan hệ cú pháp.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Thành ngữ tiếng Việt tự nhiên, trang trọng, diễn đạt thời gian không dứt; cách nói sát chữ hơn được ghi ở chú thích.
theological_decisions:
- issue: Bổ sung động từ bị lược trong lời tôn vinh
  choice: đều thuộc về Đức Chúa Trời chúng ta
  alternative: xin quy về Đức Chúa Trời chúng ta
  rationale: Bản Hy Lạp không có động từ sau chuỗi danh từ. “Đều thuộc về” tạo câu tiếng Việt tự nhiên và giữ ý quy thuộc; “xin quy về” cũng có thể diễn đạt sắc thái dâng lời tôn vinh nhưng khiến câu mang tính cầu chúc rõ hơn nguyên văn.
- issue: Phân biệt δύναμις và ἰσχύς
  choice: quyền năng ... sức mạnh
  alternative: năng lực ... uy lực
  rationale: Hai từ gần nghĩa được đặt cạnh nhau có chủ ý. Dùng hai cách diễn đạt khác nhau bảo toàn sức đầy đặn của lời tung hô thay vì nhập chúng thành một khái niệm.
translation_notes:
  register: Văn phong trang trọng, có nhịp điệu phụng vụ nhưng vẫn rõ ràng đối với độc giả Việt Nam hiện đại. Không lặp từ tương ứng với mạo từ trước từng danh từ vì sẽ nặng nề trong tiếng Việt; cấu trúc liệt kê và đủ bảy yếu tố vẫn được giữ nguyên.
