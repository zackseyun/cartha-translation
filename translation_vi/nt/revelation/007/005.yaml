id: REV.7.5
reference: Revelation 7:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: vi
  text: Từ chi phái Giu-đa, mười hai ngàn người đã được đóng ấn[a]; từ chi phái Ru-bên, mười hai ngàn; từ chi phái Gát, mười hai ngàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát hình thức hơn: “từ chi phái Giu-đa, mười hai ngàn người được đóng ấn.” Tiếng Hy Lạp dùng một phân từ bị động (“được đóng ấn”) sau con số của chi phái đầu tiên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: từ
  rationale: Diễn đạt tự nhiên ý nguồn gốc/xuất thân và giữ được công thức lặp lại của bản Hy Lạp.
- source_word: φυλῆς
  choice: chi phái
  rationale: Trong danh sách các chi phái Israel, “chi phái” là thuật ngữ tiếng Việt quen thuộc và chính xác hơn “thị tộc”.
- source_word: Ἰούδα
  choice: Giu-đa
  rationale: Dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: δώδεκα χιλιάδες
  choice: mười hai ngàn người
  rationale: Chuyển trực tiếp con số; thêm “người” để câu tiếng Việt tự nhiên và làm rõ đối tượng được đếm mà không thay đổi ý nghĩa.
- source_word: ἐσφραγισμένοι
  choice: đã được đóng ấn
  rationale: Giữ thể bị động của phân từ và diễn đạt rõ lực vị ngữ trong tiếng Việt; từ này đứng ở mệnh đề đầu nhưng theo cấu trúc song song được hiểu là áp dụng cho cả danh sách.
- source_word: Ῥουβὴν
  choice: Ru-bên
  rationale: Dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: Γὰδ
  choice: Gát
  rationale: Dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Lực và phạm vi của ἐσφραγισμένοι trong danh sách các chi phái
  choice: Dịch rõ là “đã được đóng ấn” ở mệnh đề đầu và giữ tỉnh lược ở hai mệnh đề tiếp theo.
  alternative: Dịch sát hình thức hơn là “mười hai ngàn người được đóng ấn”, hoặc lặp lại “đã được đóng ấn” sau mỗi chi phái.
  rationale: Bản Hy Lạp đặt phân từ bị động sau con số đầu tiên. Cách dịch đã chọn làm rõ lực vị ngữ trong tiếng Việt nhưng không thêm sự lặp lại mà nguyên văn không có, đồng thời không quyết định quá mức bản chất hay ý nghĩa thần học của việc đóng ấn.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. Dùng “chi phái” cùng các tên phiên âm quen thuộc; giữ nhịp liệt kê và sự tỉnh lược của nguyên văn.
