id: REV.7.1
reference: Revelation 7:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: vi
  text: Sau đó[a], tôi thấy bốn thiên sứ đứng ở bốn góc của đất[b], giữ lại bốn ngọn gió của đất, để không một ngọn gió nào thổi trên đất, trên biển hay trên bất cứ cây nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hình thức hơn: “Sau những điều này, tôi thấy.”'
    reason: lexical_alternative
  - marker: b
    text: “Bốn góc của đất” là cách nói quy ước chỉ những nơi tận cùng của đất hoặc bốn phương.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Sau đó
  rationale: Đây là dấu hiệu diễn ngôn chỉ trình tự thường gặp trong văn khải huyền. “Sau đó” tự nhiên trong tiếng Việt hiện đại và vẫn giữ rõ quan hệ thời gian; cách sát hình thức hơn được ghi ở chú thích.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Động từ ὁράω ở đây trực tiếp thuật lại điều Giăng nhìn thấy trong khải tượng; không cần thêm ý “tôi nhìn” vốn không có trong nguyên văn.
- source_word: τέσσαρας ἀγγέλους
  choice: bốn thiên sứ
  rationale: Chuyển trực tiếp số từ và danh từ; “thiên sứ” là cách gọi trang trọng, quen thuộc và không làm mờ bản chất của các nhân vật trong khải tượng.
- source_word: ἑστῶτας
  choice: đứng
  rationale: Phân từ hoàn thành của ἵστημι mô tả trạng thái đang đứng. “Đứng” minh bạch hơn “được bố trí”, vốn thêm sắc thái diễn giải.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: ở bốn góc của đất
  rationale: Giữ nguyên hình ảnh vũ trụ học mang tính quy ước của văn khải huyền. Giới từ “ở” tự nhiên trong tiếng Việt; “đất” phù hợp với phạm vi toàn cảnh gồm đất, biển và cây cối.
- source_word: κρατοῦντας
  choice: giữ lại
  rationale: Trong ngữ cảnh, các thiên sứ ngăn những ngọn gió thổi; “giữ lại” diễn đạt lực kiềm giữ được hàm ý bởi mệnh đề mục đích tiếp theo mà không cường điệu thành “trấn áp”.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: bốn ngọn gió của đất
  rationale: Giữ hình ảnh bốn luồng gió tương ứng với bốn hướng trong cảnh tượng. “Ngọn gió” là cách nói tự nhiên và vẫn bảo toàn danh từ cụ thể của nguyên văn.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: để không một ngọn gió nào thổi
  rationale: ἵνα với giả định cách diễn tả mục đích hoặc kết quả dự kiến. Cấu trúc tiếng Việt này nêu rõ sự ngăn cản hoàn toàn nhưng không buộc phải chọn riêng giữa sắc thái mục đích và kết quả.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: trên đất, trên biển hay trên bất cứ cây nào
  rationale: Chuỗi μήτε…μήτε phối hợp ba phạm vi bị phủ định. Dưới mệnh đề phủ định phía trước, “hay” là liên từ tự nhiên; “bất cứ cây nào” thể hiện đúng ý phân phối của πᾶν δένδρον.
theological_decisions:
- issue: Phạm vi của γῆ trong khải tượng
  choice: Dịch là “đất” xuyên suốt câu, với nghĩa toàn thể mặt đất trong cảnh tượng vũ trụ.
  alternative: xứ; vùng đất
  rationale: Bốn góc, bốn ngọn gió, đất, biển và mọi cây tạo nên một cảnh tượng có phạm vi rộng. Dịch là “xứ” hoặc “vùng đất” sẽ thu hẹp phạm vi quá mức so với ngữ cảnh.
- issue: Bản chất của hình ảnh “bốn góc của đất”
  choice: Giữ nguyên thành ngữ hình ảnh trong chính văn.
  alternative: bốn phương của đất; bốn cực của địa cầu
  rationale: Cụm từ là ngôn ngữ quy ước trong khải tượng. Giữ hình ảnh giúp bảo toàn cách diễn đạt của bản văn mà không biến nó thành một khẳng định khoa học; chú thích giải thích nghĩa quy ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ nhịp câu khải tượng, lặp lại “đất” theo nguyên văn và bảo toàn hình ảnh “bốn góc” thay vì giải nghĩa ngay trong chính văn. Các dấu chú thích [a], [b] đều xuất hiện tại vị trí liên quan.
