revisions:
- from: 'Tôi thưa với vị ấy: “Thưa ngài, chính ngài biết.” Vị ấy nói với tôi: “Đây là những người đang ra khỏi cơn hoạn nạn lớn[a]. Họ đã giặt áo dài của mình và làm cho trắng trong huyết Chiên Con[b].”'
  to: 'Tôi thưa với vị ấy: “Thưa ngài, chính ngài biết.” Vị ấy nói với tôi: “Đây là những người đang ra khỏi cơn hoạn nạn lớn[a]. Họ đã giặt áo choàng của mình và tẩy trắng chúng trong huyết Chiên Con[b].”'
  rationale: Chỉ thay cách gọi y phục và diễn đạt động từ làm trắng để bảo đảm nghĩa của στολάς và ἐλεύκαναν được truyền đạt tự nhiên, chính xác. Các lựa chọn then chốt khác được giữ nguyên, kể cả thì tiếp diễn của phân từ, tính không xác định về thần học của “cơn hoạn nạn lớn,” và giới từ “trong.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành phần chính của câu Hy Lạp: lời đáp kính trọng προς vị trưởng lão, phân từ hiện tại “những người đang ra khỏi,” cụm từ không được diễn giải “cơn hoạn nạn lớn,” hai động từ quá khứ về việc giặt và làm trắng áo, cùng hình ảnh nghịch lý “trong huyết Chiên Con.” Tuy nhiên, “áo dài” trong tiếng Việt hiện đại thường chỉ một trang phục văn hóa xác định, không thích hợp để chỉ στολάς trong khung cảnh Khải Huyền.'
  naturalness: Cấu trúc câu nhìn chung tự nhiên và trang trọng. Cần thay “áo dài” bằng “áo choàng” để tránh liên tưởng sai và để cụm “tẩy trắng chúng” có đối tượng quy chiếu rõ ràng, tự nhiên hơn.
  terminology: “Thưa ngài,”, “cơn hoạn nạn lớn,” “huyết,” và “Chiên Con” đều phù hợp với văn phong Kinh Thánh hiện đại và không áp đặt một lập trường giáo phái. Giữ “trong huyết” phản ánh trực tiếp ἐν và bảo tồn hình ảnh nguyên văn.
  issues:
  - severity: medium
    issue: “Áo dài” không phải là cách gọi phù hợp cho στολάς.
    rationale: Trong tiếng Việt hiện đại, “áo dài” chủ yếu gợi trang phục truyền thống Việt Nam, trong khi στολή chỉ áo choàng/y phục dài và trang trọng. “Áo choàng” truyền đạt đúng hình ảnh hơn, không thêm màu sắc văn hóa ngoài bản văn.
  - severity: low
    issue: Cụm “làm cho trắng trong huyết Chiên Con” hơi gượng và lược đối tượng ở vế thứ hai.
    rationale: Dù vẫn hiểu được từ “áo dài” ở vế trước, “tẩy trắng chúng trong huyết Chiên Con” diễn đạt rõ động từ ἐλεύκαναν, giữ hình ảnh nguyên văn, và tự nhiên hơn trong tiếng Việt.
