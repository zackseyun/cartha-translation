id: REV.7.14
reference: Revelation 7:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: vi
  text: 'Tôi thưa với vị ấy: “Thưa ngài, chính ngài biết.” Vị ấy nói với tôi: “Đây là những người đang ra khỏi cơn hoạn nạn lớn[a]. Họ đã giặt áo choàng của mình và tẩy trắng chúng trong huyết Chiên Con[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cơn khốn khó lớn” hoặc “cơn đau khổ lớn”. Từ Hy Lạp có thể chỉ áp lực, hoạn nạn hoặc khốn khó.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “trong huyết Chiên Con” được giữ theo hình ảnh có chủ ý của nguyên văn. Giới từ Hy Lạp cũng có thể được hiểu theo nghĩa phương tiện là “nhờ huyết”, nhưng cách dịch trong chính văn bảo tồn hình ảnh nghịch lý về sự tẩy sạch trong huyết.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: Tôi thưa
  rationale: Dù là hình thái hoàn thành, động từ ở đây làm chức năng dẫn lời trong trình thuật; tiếng Việt tự nhiên dùng “thưa” để vừa diễn đạt hành động nói vừa thể hiện sự kính trọng đối với vị trưởng lão.
- source_word: Κύριέ μου
  choice: Thưa ngài
  rationale: Người được thưa chuyện là một vị trưởng lão trên trời, không phải Đức Chúa Trời hay Đấng Christ. “Thưa ngài” giữ sắc thái kính trọng mà không khiến người đọc hiểu đây là một danh xưng thần tính.
- source_word: σὺ οἶδας
  choice: chính ngài biết
  rationale: “Chính ngài” thể hiện mức nhấn nhẹ của đại từ σὺ và lời khiêm nhường thừa nhận rằng vị trưởng lão biết câu trả lời.
- source_word: οἱ ἐρχόμενοι
  choice: những người đang ra khỏi
  rationale: Giữ giá trị tiếp diễn của phân từ hiện tại, không biến hành động thành một sự kiện đơn thuần đã hoàn tất.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: ra khỏi cơn hoạn nạn lớn
  rationale: “Hoạn nạn” diễn đạt θλῖψις trong văn cảnh trang trọng và giữ nguyên tính khái quát của cụm từ, không áp đặt một hệ thống giải thích thời kỳ cuối cùng.
- source_word: ἔπλυναν
  choice: đã giặt
  rationale: Diễn đạt động từ bất định quá khứ như một hành động được nhìn nhận trọn vẹn.
- source_word: στολάς
  choice: áo dài
  rationale: στολή chỉ loại áo choàng dài, trang trọng; “áo dài” ở đây được dùng theo nghĩa mô tả y phục dài, sát nghĩa hơn từ chung chung “áo”.
- source_word: ἐλεύκαναν
  choice: làm cho trắng
  rationale: 'Giữ rõ ý nghĩa gây khiến của động từ: họ làm cho những chiếc áo trở nên trắng.'
- source_word: ἐν τῷ αἵματι
  choice: trong huyết
  rationale: Giữ giới từ “trong” để bảo tồn hình ảnh nghịch lý đầy chủ ý về việc tẩy trắng trong huyết; không âm thầm chuyển thành nghĩa phương tiện “nhờ huyết”.
- source_word: τοῦ ἀρνίου
  choice: Chiên Con
  rationale: Trong Khải Huyền, từ này là danh hiệu chỉ Đấng Christ; viết hoa cho thấy cách dùng như danh hiệu.
theological_decisions:
- issue: Cách dịch κύριος khi Giăng thưa với vị trưởng lão
  choice: Thưa ngài
  alternative: Lạy Chúa tôi; thưa chủ tôi
  rationale: Văn cảnh xác định người nghe là vị trưởng lão. Cách dịch được chọn giữ sự tôn kính nhưng không gán căn tính thần linh hoặc Kitô học cho vị ấy.
- issue: Ý nghĩa của “cơn hoạn nạn lớn”
  choice: Giữ cách nói “cơn hoạn nạn lớn” mà không diễn giải thêm trong chính văn
  alternative: cơn khốn khó lớn; cảnh áp bức lớn
  rationale: Cụm từ được dịch theo nghĩa từ vựng, không quyết định đây chỉ là một giai đoạn cánh chung riêng biệt hay chỉ sự đau khổ nói chung của các tín hữu.
- issue: Quan hệ được diễn đạt bởi ἐν trong “ἐν τῷ αἵματι”
  choice: trong huyết Chiên Con
  alternative: nhờ huyết Chiên Con; bằng huyết Chiên Con
  rationale: “Trong” bảo tồn hình ảnh nghịch lý của nguyên văn, dù ἐν cũng có thể được hiểu theo nghĩa phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vị ấy” để chỉ vị trưởng lão, tránh đại từ quá khẩu ngữ. “Huyết” được giữ thay vì “máu” vì đây là hình ảnh tế lễ và là cách nói trang trọng quen thuộc trong ngữ cảnh Kinh Thánh; tuy vậy câu vẫn duy trì cấu trúc tự nhiên của tiếng Việt.
