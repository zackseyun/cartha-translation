id: REV.7.10
reference: Revelation 7:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: vi
  text: 'Họ lớn tiếng kêu lên rằng: “Sự cứu rỗi thuộc về Đức Chúa Trời chúng ta, Đấng ngự trên ngai, và thuộc về Chiên Con!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát cấu trúc hơn: “Sự cứu rỗi cho Đức Chúa Trời chúng ta, Đấng ngự trên ngai, và cho Chiên Con!” Bản Hy Lạp là một lời tung hô không có động từ; các cụm “cho” diễn tả sự quy thuộc.'
    reason: Giữ cấu trúc lời tung hô không động từ của tiếng Hy Lạp, đồng thời tránh cách dùng “đến” không tự nhiên và có thể gây sai nghĩa trong tiếng Việt.
lexical_decisions:
- source_word: κράζουσι
  choice: kêu lên
  rationale: Động từ hiện tại số nhiều diễn tả hành động sống động trong khải tượng; “kêu lên” giữ được cường độ của κράζω mà vẫn tự nhiên trong tiếng Việt.
- source_word: φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Cụm tặng cách chỉ cách thức; “lớn tiếng” là cách diễn đạt tự nhiên, rõ nghĩa và tránh lối dịch cứng “bằng một tiếng lớn”.
- source_word: λέγοντες
  choice: rằng
  rationale: Phân từ dẫn vào nội dung lời tung hô; tiếng Việt tự nhiên kết nối động từ phát ngôn với nội dung bằng “rằng”.
- source_word: Ἡ σωτηρία
  choice: Sự cứu rỗi thuộc về
  rationale: Đây là lời tung hô không có động từ trong tiếng Hy Lạp. “Thuộc về” diễn đạt hợp lý tặng cách quy thuộc, trong khi vẫn giữ nội dung là “sự cứu rỗi”, không diễn giải thành “chiến thắng”.
- source_word: τῷ θεῷ ἡμῶν
  choice: Đức Chúa Trời chúng ta
  rationale: Tặng cách chỉ Đấng được quy sự cứu rỗi cho; danh xưng này trang trọng, dễ hiểu và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Đấng ngự trên ngai
  rationale: Cụm phân từ đồng vị với “Đức Chúa Trời chúng ta”; “ngự” diễn tả tư thế ngồi trị vì một cách trang trọng và tự nhiên.
- source_word: τῷ ἀρνίῳ
  choice: Chiên Con
  rationale: Giữ hình ảnh và tước hiệu đặc trưng trong sách Khải Huyền, đồng thời dùng dạng viết hoa để biểu thị tước hiệu chỉ về một nhân vật xác định.
theological_decisions:
- issue: Mối liên hệ của “sự cứu rỗi” với Đức Chúa Trời và Chiên Con
  choice: 'Dịch như một lời tung hô quy sự cứu rỗi chung cho Đức Chúa Trời và Chiên Con: “Sự cứu rỗi thuộc về Đức Chúa Trời chúng ta ... và thuộc về Chiên Con!”'
  alternative: 'Dịch sát cấu trúc hơn: “Sự cứu rỗi đến Đức Chúa Trời chúng ta ... và đến Chiên Con!”'
  rationale: Cách dịch chính làm rõ chức năng quy thuộc của hai tặng cách mà không giải thích thêm bản chất thần học của mối liên hệ ấy; đồng thời giữ nguyên việc Đức Chúa Trời và Chiên Con cùng nhận lời tung hô.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “lớn tiếng kêu lên rằng” tạo nhịp tự nhiên; “Đấng ngự trên ngai” và “Chiên Con” duy trì sắc thái phụng vụ, vương quyền và biểu tượng của nguyên bản.
