id: REV.7.13
reference: Revelation 7:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: vi
  text: 'Bấy giờ, một trong các trưởng lão đáp lời và nói với tôi: “Những người đang mặc áo choàng trắng kia là ai, và họ từ đâu đến?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Bấy giờ
  rationale: Dùng như từ nối thúc đẩy diễn tiến của khải tượng; tự nhiên trong tiếng Việt mà vẫn giữ mạch kể.
- source_word: ἀπεκρίθη
  choice: lên tiếng hỏi
  rationale: Động từ có nghĩa cơ bản là “đáp/lên tiếng”, dù ngay trước đó không có câu hỏi trực tiếp. Vì lời tiếp theo là một câu hỏi, cách diễn đạt này tự nhiên hơn “trả lời” trong tiếng Việt mà không thay đổi chức năng phát ngôn.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: một trong các trưởng lão
  rationale: Thể hiện tự nhiên cấu trúc bộ phận, xác định người nói thuộc nhóm các trưởng lão.
- source_word: λέγων μοι
  choice: hỏi tôi
  rationale: Gộp phân từ “nói với tôi” vào động từ dẫn nhập để câu tiếng Việt trôi chảy; nội dung trực tiếp là câu hỏi.
- source_word: Οὗτοι
  choice: những người ... kia
  rationale: Đại từ chỉ định nói về nhóm đang hiện diện trong khải tượng; “kia” giúp giữ sắc thái chỉ trỏ.
- source_word: οἱ περιβεβλημένοι
  choice: mặc
  rationale: Phân từ hoàn thành diễn tả trạng thái hiện tại do hành động trước đó tạo nên; “mặc” là cách nói tự nhiên và không khẳng định rõ tác nhân mặc áo cho họ.
- source_word: τὰς στολὰς τὰς λευκάς
  choice: áo dài trắng
  rationale: στολή chỉ loại áo choàng hay áo dài; “áo dài trắng” giữ ý về y phục dài và màu trắng, đồng thời tránh nhầm với chiếc áo dài dân tộc bằng ngữ cảnh số nhiều và khải tượng.
- source_word: τίνες εἰσὶν
  choice: là ai
  rationale: Cách hỏi danh tính tự nhiên trong tiếng Việt.
- source_word: πόθεν ἦλθον
  choice: từ đâu đến
  rationale: Giữ rõ ý về nguồn gốc/nơi xuất phát; tiếng Việt không bắt buộc đánh dấu đối lập giữa quá khứ đơn và hiện tại hoàn thành như tiếng Anh.
theological_decisions:
- issue: Giá trị thì/thể của ἦλθον
  choice: họ từ đâu đến
  alternative: họ đã từ đâu đến
  rationale: Động từ Hy Lạp ở aorist chỉ một sự đến trong quá khứ, nhưng tiếng Việt tự nhiên có thể không dùng “đã” khi ngữ cảnh và động từ “đến” đã đủ rõ. Cách dịch giữ mở cả sự kiện đến và sự hiện diện hiện tại, không gán thêm ý nghĩa giáo lý.
- issue: Sắc thái của ἀπεκρίθη khi không có câu hỏi ngay trước đó
  choice: lên tiếng hỏi tôi
  alternative: đáp lời và nói với tôi
  rationale: Giữ chức năng mở lời của động từ nhưng tránh tạo ấn tượng trong tiếng Việt rằng trưởng lão đang trả lời một câu hỏi vừa được nêu. Nội dung phát ngôn là câu hỏi, nên “hỏi tôi” truyền đạt tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ hai vế hỏi song song. Không thêm chú thích vì sự khác biệt thì/thể của tiếng Anh (“have come”/“did come”) không tạo thành một đối lập bắt buộc trong tiếng Việt.
