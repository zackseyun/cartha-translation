id: REV.7.7
reference: Revelation 7:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: vi
  text: từ chi tộc Si-mê-ôn, mười hai ngàn người; từ chi tộc Lê-vi, mười hai ngàn người; từ chi tộc Y-sa-ca, mười hai ngàn người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: từ
  rationale: Diễn đạt nguồn gốc hoặc thành phần được lấy ra từ mỗi chi tộc; “từ” tự nhiên trong tiếng Việt và giữ được công thức lặp của nguyên văn.
- source_word: φυλῆς
  choice: chi tộc
  rationale: Trong bối cảnh các đơn vị gia phả của Israel, “chi tộc” là cách gọi quen thuộc và chính xác hơn “bộ tộc”.
- source_word: Συμεὼν
  choice: Si-mê-ôn
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: δώδεκα χιλιάδες
  choice: mười hai ngàn người
  rationale: Viết bằng chữ để phù hợp văn mạch trang trọng; thêm “người” theo ngữ cảnh số người được đóng ấn ở 7:4, không làm thay đổi ý nghĩa.
- source_word: Λευὶ
  choice: Lê-vi
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và giữ nguyên việc nguyên văn liệt kê Lê-vi.
- source_word: Ἰσσαχὰρ
  choice: Y-sa-ca
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cú pháp lặp trong danh sách các chi tộc
  choice: Giữ trọn công thức “từ chi tộc…, mười hai ngàn người” cho từng chi tộc.
  alternative: Rút gọn thành “từ các chi tộc Si-mê-ôn, Lê-vi và Y-sa-ca, mỗi chi tộc mười hai ngàn người”.
  rationale: Nguyên văn lặp lại đầy đủ từng đơn vị, tạo nhịp liệt kê trang trọng; giữ sự lặp tránh làm phẳng cấu trúc.
- issue: Việc Lê-vi được đưa vào danh sách
  choice: Nêu Lê-vi trực tiếp, không giải thích thêm trong chính văn.
  alternative: Thêm lời giải thích về vị trí khác thường của Lê-vi trong cách liệt kê các chi tộc.
  rationale: Nguyên văn chỉ liệt kê Lê-vi; lời giải thích trong chính văn sẽ đưa thêm cách diễn giải không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp ba vế song song của nguyên văn. Không đặt chú thích cho ἐκ vì “từ” bao quát tự nhiên sắc thái nguồn gốc; phương án “ra từ” kém tự nhiên trong cấu trúc tiếng Việt này.
