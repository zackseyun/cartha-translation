id: REV.7.11
reference: Revelation 7:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: vi
  text: Tất cả các thiên sứ đang đứng xung quanh ngai, các trưởng lão và bốn sinh vật[a]. Họ ngã sấp mặt xuống trước ngai và thờ phượng Đức Chúa Trời,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bốn hữu thể sống.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: tất cả các thiên sứ
  rationale: Diễn đạt trực tiếp toàn thể nhóm thiên sứ; “thiên sứ” là từ chuẩn, tự nhiên trong văn cảnh Khải Huyền.
- source_word: εἱστήκεισαν
  choice: đứng
  rationale: Dạng quá khứ hoàn thành có giá trị trạng thái, mô tả họ đang ở tư thế đứng; tiếng Việt dùng “đứng” tự nhiên mà vẫn giữ được trạng thái trong mạch kể.
- source_word: κύκλῳ
  choice: chung quanh
  rationale: Giữ rõ ý nghĩa vị trí bao quanh với cách diễn đạt tiếng Việt tự nhiên.
- source_word: τοῦ θρόνου
  choice: ngai
  rationale: “Ngai” bảo toàn hình ảnh vương quyền và thiên giới xuyên suốt Khải Huyền.
- source_word: τῶν πρεσβυτέρων
  choice: các trưởng lão
  rationale: Đây là danh xưng quen thuộc cho nhóm nhân vật thiên giới này trong Khải Huyền.
- source_word: τῶν τεσσάρων ζῴων
  choice: bốn sinh vật
  rationale: “Sinh vật” nhấn mạnh đây là các hữu thể sống mà không hạ thấp thành thú vật hay tự ý xác định bản chất của họ.
- source_word: ἔπεσαν
  choice: sấp mặt xuống
  rationale: Kết hợp hành động ngã xuống với cụm chỉ tư thế ở ngay sau để tạo câu tiếng Việt tự nhiên và diễn tả rõ sự phủ phục.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: trước ngai
  rationale: Giữ nghĩa không gian trực tiếp, trang trọng và tự nhiên.
- source_word: ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: sấp mặt
  rationale: Diễn đạt thành ngữ về tư thế phủ phục hoàn toàn bằng tiếng Việt hiện đại.
- source_word: προσεκύνησαν
  choice: thờ phượng
  rationale: Vì đối tượng là Đức Chúa Trời và động tác phủ phục đã được nêu rõ, từ này diễn tả hành vi thờ phượng chứ không chỉ cúi lạy.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, quen thuộc và phù hợp cho θεός trong văn cảnh thờ phượng.
theological_decisions:
- issue: Cách gọi các hữu thể quanh ngai (ζῷα)
  choice: sinh vật
  alternative: hữu thể sống
  rationale: “Sinh vật” bảo toàn tính sống động và sự không xác định của hình ảnh khải tượng, không biến họ thành thú vật hay áp đặt một căn tính thần học cụ thể.
- issue: Sắc thái của προσκυνέω khi hướng đến Đức Chúa Trời
  choice: thờ phượng Đức Chúa Trời
  alternative: cúi lạy trước Đức Chúa Trời
  rationale: Câu trước đã mô tả sự phủ phục về thể chất; ở đây “thờ phượng” truyền đạt đầy đủ ý nghĩa tôn giáo của động từ khi Đức Chúa Trời là đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chia thành hai câu để tránh chuỗi liên từ nặng nề trong tiếng Việt, nhưng giữ nguyên thứ tự và quan hệ của các thành phần Hy Lạp. Dấu phẩy cuối câu được giữ vì câu này tiếp nối sang câu kế trong nguyên văn.
