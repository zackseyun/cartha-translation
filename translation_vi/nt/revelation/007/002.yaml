id: REV.7.2
reference: Revelation 7:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: vi
  text: Tôi thấy một thiên sứ khác đi lên từ phương đông[a], mang ấn của Đức Chúa Trời hằng sống, và thiên sứ ấy cất tiếng kêu lớn với bốn thiên sứ đã được phép làm hại đất và biển,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ nơi mặt trời mọc.”'
    reason: Bảo tồn hình ảnh sát chữ của cụm ἀπὸ ἀνατολῆς ἡλίου bên cạnh cách diễn đạt phương hướng tự nhiên trong chính văn.
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: một thiên sứ khác
  rationale: Diễn đạt tự nhiên một thiên sứ khác, phân biệt với bốn thiên sứ vừa được nhắc đến.
- source_word: ἀναβαίνοντα
  choice: đi lên
  rationale: Giữ nghĩa chuyển động hướng lên của phân từ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: từ phương đông
  rationale: Đây là cách diễn đạt phương hướng tự nhiên; hình ảnh nguyên văn được giữ trong chú thích.
- source_word: ἔχοντα σφραγῖδα
  choice: mang ấn
  rationale: “Mang” diễn đạt ἔχοντα tự nhiên, còn “ấn” giữ hình ảnh cụ thể của σφραγίς mà không xác định thêm chức năng.
- source_word: θεοῦ ζῶντος
  choice: của Đức Chúa Trời hằng sống
  rationale: Cách nói trang trọng, quen thuộc và sát nghĩa cụm thuộc cách Hy Lạp.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: lớn tiếng gọi
  rationale: Truyền đạt cường độ của κράζω và φωνῇ μεγάλῃ bằng tiếng Việt gọn, tự nhiên.
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: bốn thiên sứ
  rationale: Chuyển trực tiếp đối tượng gián tiếp của động từ gọi.
- source_word: οἷς ἐδόθη αὐτοῖς ἀδικῆσαι
  choice: đã được ban cho việc làm hại
  rationale: Giữ cấu trúc bị động và ý nghĩa được giao hay cho phép, đồng thời không thêm danh từ “quyền” vốn không có trong nguyên văn.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: đất và biển
  rationale: “Đất” giữ được độ rộng nghĩa của γῆ và tạo cặp tự nhiên với “biển” trong cảnh tượng này.
theological_decisions:
- issue: Tính chất của điều được ban trong ἐδόθη
  choice: đã được ban cho việc làm hại
  alternative: đã được ban quyền làm hại; đã được phép làm hại
  rationale: Nguyên văn dùng động từ bị động “được ban” nhưng không nêu rõ “quyền” hay “sự cho phép”; bản dịch không thêm đối tượng và cũng không chỉ rõ chủ thể ban.
- issue: Cụm chỉ hướng ἀπὸ ἀνατολῆς ἡλίου
  choice: từ phương đông trong chính văn
  alternative: từ nơi mặt trời mọc
  rationale: “Phương đông” chuyển tải nghĩa chỉ hướng rõ ràng cho độc giả hiện đại, còn hình ảnh nguyên văn được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thiên sứ,” “ấn,” và “Đức Chúa Trời hằng sống” giữ sắc thái Kinh Thánh quen thuộc; dấu phẩy cuối câu phản ánh việc câu Hy Lạp tiếp tục sang câu kế tiếp.
