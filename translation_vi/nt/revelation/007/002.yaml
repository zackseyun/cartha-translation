revisions:
- from: Tôi lại thấy một thiên sứ khác đi lên từ phương đông[a], mang ấn của Đức Chúa Trời hằng sống. Vị ấy lớn tiếng gọi bốn thiên sứ đã được ban cho việc làm hại đất và biển,
  to: Tôi thấy một thiên sứ khác đi lên từ phương đông[a], mang ấn của Đức Chúa Trời hằng sống, và thiên sứ ấy cất tiếng kêu lớn với bốn thiên sứ đã được phép làm hại đất và biển,
