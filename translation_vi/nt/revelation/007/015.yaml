id: REV.7.15
reference: Revelation 7:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: vi
  text: Vì thế, họ ở trước ngai Đức Chúa Trời và phụng sự Ngài ngày đêm trong đền thờ Ngài; Đấng ngự trên ngai sẽ giăng lều của Ngài trên họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ ngự trên họ” hoặc “sẽ che chở họ.” Động từ Hy Lạp có liên hệ với hình ảnh “lều” hoặc “đền tạm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: Vì thế
  rationale: Cụm từ chỉ kết luận dựa trên lời giải thích ngay trước đó. “Vì thế” tự nhiên trong tiếng Việt và giữ rõ mối liên hệ nhân quả-suy luận.
- source_word: ἐνώπιον
  choice: ở trước
  rationale: Diễn đạt ngắn gọn cả vị trí lẫn sự hiện diện trước ngai Đức Chúa Trời.
- source_word: λατρεύουσιν
  choice: phụng sự
  rationale: Động từ chỉ sự phục vụ mang tính thờ phượng dành cho Đức Chúa Trời. “Phụng sự” giữ được sắc thái thánh thiêng trong bối cảnh đền thờ mà không thu hẹp ý nghĩa vào lời ca ngợi.
- source_word: ἡμέρας καὶ νυκτός
  choice: ngày đêm
  rationale: Giữ hình ảnh nguyên ngữ về sự phụng sự liên tục, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: ναῷ
  choice: đền thờ
  rationale: ναός chỉ nơi thánh hoặc đền thờ, không phải toàn bộ khuôn viên. “Đền thờ” quen thuộc, rõ nghĩa; bối cảnh cho thấy đây là cảnh tượng trên trời.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: Đấng ngự trên ngai
  rationale: Giữ tính chất tước hiệu của phân từ và dùng lối diễn đạt trang trọng, tự nhiên trong tiếng Việt khi nói về Đức Chúa Trời.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: sẽ giăng lều của Ngài trên họ
  rationale: Giữ hình ảnh lều hoặc đền tạm của σκηνόω và hướng nghĩa “trên họ” của ἐπί. Cách dịch này bảo tồn hình ảnh về sự hiện diện che chở của Đức Chúa Trời mà không thay thế ẩn dụ bằng một lời giải nghĩa.
theological_decisions:
- issue: Cách dịch σκηνώσει trong hình ảnh về sự hiện diện của Đức Chúa Trời
  choice: sẽ giăng lều của Ngài trên họ
  alternative: sẽ ngự trên họ; sẽ che chở họ
  rationale: Nguyên ngữ gợi hình ảnh lều hoặc đền tạm, vừa nói đến sự hiện diện vừa có thể hàm ý che chở. Bản dịch chính giữ hình ảnh ấy và không giới hạn ý nghĩa vào riêng việc cư ngụ hay bảo vệ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Phụng sự” thể hiện sắc thái thờ phượng trong đền thờ; “Đấng ngự trên ngai” giữ giọng văn khải tượng. Dấu chấm phẩy phân tách hai mệnh đề chính mà vẫn giữ sự liên kết chặt chẽ.
