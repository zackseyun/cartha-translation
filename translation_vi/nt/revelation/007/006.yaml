id: REV.7.6
reference: Revelation 7:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: vi
  text: từ chi tộc A-se[a], mười hai nghìn; từ chi tộc Nép-ta-li, mười hai nghìn; từ chi tộc Ma-na-se, mười hai nghìn;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo văn cảnh, có thể diễn đạt đầy đủ hơn: “từ chi tộc A-se, mười hai nghìn người được đóng ấn” (và tương tự đối với các chi tộc tiếp theo). Bản Hy Lạp của chính câu này không lặp lại động từ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: từ
  rationale: Giới từ chỉ nguồn gốc hoặc xuất xứ; trong công thức liệt kê này, “từ” là cách diễn đạt tự nhiên và chính xác.
- source_word: φυλῆς
  choice: chi tộc
  rationale: Trong bối cảnh phả hệ của Israel, φυλή chỉ một chi tộc của dân Israel; “chi tộc” là cách gọi rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: Ἀσὴρ
  choice: A-se
  rationale: Phiên âm tên riêng theo cách đọc gần nguyên ngữ và phù hợp với lối viết tên Kinh Thánh bằng tiếng Việt.
- source_word: δώδεκα χιλιάδες
  choice: mười hai ngàn người
  rationale: Cụm từ nêu số lượng người thuộc mỗi chi tộc. Thêm danh từ loại “người” để câu tiếng Việt tự nhiên, nhưng không thêm động từ “được đóng ấn” vì câu Hy Lạp này không lặp lại động từ ấy.
- source_word: Νεφθαλὶμ
  choice: Nép-ta-li
  rationale: Phiên âm tên chi tộc theo dạng Hy Lạp, đồng thời giữ hình thức dễ đọc đối với độc giả Việt.
- source_word: Μανασσῆ
  choice: Ma-na-se
  rationale: Phiên âm tên riêng theo cách đọc gần nguyên ngữ và dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Có nên bổ sung động từ hàm ý “được đóng ấn” từ văn cảnh hay không
  choice: Không thêm động từ trong chính văn; giữ dạng liệt kê không có động từ như nguyên văn Hy Lạp.
  alternative: “từ chi tộc A-se, mười hai ngàn người được đóng ấn; từ chi tộc Nép-ta-li, mười hai ngàn người; từ chi tộc Ma-na-se, mười hai ngàn người”
  rationale: Ý niệm đóng ấn đã được xác lập trong câu trước, nhưng câu Hy Lạp ở đây chỉ gồm các cụm giới từ và con số. Giữ cấu trúc liệt kê ngắn gọn giúp tránh đưa vào chính văn những từ không hiện diện trong câu, còn chú thích giải thích điều được hiểu ngầm từ văn cảnh.
translation_notes:
  register: Văn phong trang trọng, gọn và dễ hiểu; giữ nhịp liệt kê của nguyên văn. Dùng “ngàn” tự nhiên trong tiếng Việt hiện đại và “chi tộc” để chỉ các đơn vị phả hệ của Israel. Dấu chú thích [a] được đặt ngay sau tên A-se như lớp tham khảo tiếng Anh đã kiểm định.
