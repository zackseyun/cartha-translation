source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: vi
  text: 'Và tôi nghe con số những người đã được đóng ấn: một trăm bốn mươi bốn nghìn người, được đóng ấn từ mọi chi phái của các con trai của Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con cái của Israel.” Tiếng Hy Lạp chép sát nghĩa là “các con trai của Israel,” giữ cách diễn đạt giống đực mang tính gia phả.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: tôi nghe
  rationale: Động từ aorist chỉ một hành động nghe trong mạch tường thuật; “tôi nghe” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: τὸν ἀριθμὸν
  choice: số người
  rationale: ἀριθμός có nghĩa là “số”; thêm “người” làm rõ đây là tổng số những người được đóng ấn mà không thay đổi nội dung.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: những người đã được đóng ấn / được đóng ấn
  rationale: Phân từ hoàn thành thể bị động diễn tả hành động đã hoàn tất với kết quả còn hiệu lực. Bản dịch giữ cả ý bị động lẫn sự lặp lại trong nguyên văn.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: một trăm bốn mươi bốn ngàn người
  rationale: Đây là cách đọc số tự nhiên trong tiếng Việt; “người” được bổ sung để danh hóa con số theo ngữ cảnh.
- source_word: ἐκ
  choice: từ
  rationale: Giới từ đánh dấu nguồn gốc hoặc nhóm xuất thân; “từ” vừa sát nghĩa vừa tự nhiên.
- source_word: πάσης φυλῆς
  choice: mọi chi phái
  rationale: 'Cấu trúc số ít với πᾶς mang ý phân phối: những người được đóng ấn đến từ từng chi phái. “Mọi chi phái” bảo toàn ý này.'
- source_word: υἱῶν Ἰσραήλ
  choice: các con trai Israel
  rationale: Giữ danh từ giống đực υἱῶν và sắc thái gia phả của cách gọi trong nguyên văn; “Israel” được giữ theo tên riêng quen dùng hiện nay.
theological_decisions:
- issue: Cách dịch υἱῶν Ἰσραήλ trong ngữ cảnh danh sách các chi phái
  choice: các con trai Israel
  alternative: con cái Israel; dân Israel
  rationale: Nguyên văn dùng danh từ giống đực “các con trai” trong một ngữ cảnh mang tính gia phả. Cách dịch chính bảo toàn hình thức ấy mà không quyết định trước nhóm này phải được hiểu theo một hệ thống cánh chung cụ thể. Chú thích nêu cách diễn đạt bao quát và quen thuộc hơn trong truyền thống tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp câu tường thuật cùng sự lặp lại của “được đóng ấn”; dùng “chi phái” để bảo toàn thuật ngữ bộ tộc Kinh Thánh.
