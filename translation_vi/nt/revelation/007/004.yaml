  rationale: Bản sửa chỉ làm rõ quan hệ sở hữu trong cụm υἱῶν Ἰσραήλ và chuẩn hóa cách viết số từ cho văn phong trang trọng. Ý nghĩa, sự lặp lại của “được đóng ấn,” tính phân phối của “mọi chi phái,” và chú thích về phương án từ vựng đều được giữ nguyên.
