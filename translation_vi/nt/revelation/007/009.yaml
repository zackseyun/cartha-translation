id: REV.7.9
reference: Revelation 7:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: vi
  text: Sau những điều ấy, tôi nhìn xem, và kìa, một đoàn người đông đảo không ai có thể đếm được, đến từ mọi dân tộc, mọi bộ tộc, mọi dân và mọi ngôn ngữ,[a] đang đứng trước ngai và trước Chiên Con, mặc áo choàng trắng, tay cầm những nhành cọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn theo sự chuyển đổi số trong tiếng Hy Lạp: “đến từ mọi dân tộc, các bộ tộc, các dân và các ngôn ngữ.”'
    reason: Ghi nhận cấu trúc nguyên văn, trong đó “dân tộc” ở số ít còn ba danh từ sau ở số nhiều; chính văn dùng lối phân phối tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những điều ấy
  rationale: Giữ số nhiều của ταῦτα và trình tự của khải tượng, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: tôi nhìn xem, và kìa
  rationale: “Nhìn xem” phù hợp với lời dẫn nhập một cảnh tượng; “kìa” giữ chức năng thu hút sự chú ý của ἰδού.
- source_word: ὄχλος πολύς
  choice: một đoàn người đông đảo
  rationale: Diễn đạt tự nhiên một tập hợp người vô cùng đông mà không thêm sắc thái ngoài nguyên văn.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: không ai có thể đếm được
  rationale: Giữ rõ ý về sự bất khả của việc đếm và chuyển cấu trúc Hy Lạp sang tiếng Việt tự nhiên.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: đến từ mọi dân tộc, mọi bộ tộc, mọi dân và mọi ngôn ngữ
  rationale: Phân biệt bốn phạm trù và diễn đạt giá trị bao quát theo lối phân phối tự nhiên của tiếng Việt; chú thích ghi nhận sự chuyển số trong tiếng Hy Lạp.
- source_word: ἑστῶτες
  choice: đang đứng
  rationale: Giữ hình ảnh tức thời của phân từ hiện tại và xác định rõ tư thế của đoàn người.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: trước ngai và trước Chiên Con
  rationale: Lặp lại “trước” theo nguyên văn để giữ nhịp trang trọng; “Chiên Con” là danh hiệu Kitô học quen thuộc trong Khải Huyền.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: mình mặc áo dài trắng
  rationale: στολή chỉ loại áo dài hay lễ phục; cách dịch này rõ nghĩa và không gán thêm tính chất nghi lễ mà văn bản không nói rõ.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: tay cầm những nhành cọ
  rationale: Trong ngữ cảnh, φοίνικες là nhành cây cọ; cách diễn đạt này tự nhiên và giữ nguyên hình ảnh.
theological_decisions:
- issue: Cách dịch ἀρνίον như một danh hiệu Kitô học
  choice: Chiên Con
  alternative: chiên nhỏ
  rationale: Trong Khải Huyền, ἀρνίον hoạt động như một danh hiệu cố định. “Chiên Con” giữ được tính nhận diện và trọng lượng thần học mà không biến hình thái giảm nhẹ thành một mô tả vụn vặt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp khải tượng qua “Sau những điều ấy, tôi nhìn xem, và kìa”; tránh từ cổ khó hiểu, đồng thời bảo tồn danh hiệu “Chiên Con” và sự lặp lại có chủ ý của “trước”.
