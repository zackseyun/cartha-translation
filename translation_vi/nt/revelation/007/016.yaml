  - severity: low
    issue: Chú thích hiện tại nhấn vào nghĩa đen “rơi, giáng xuống” quá nhiều.
    rationale: Chú thích nên giải thích phủ định nhấn mạnh của οὐδὲ μὴ và nêu phương án tự nhiên theo ngữ cảnh, thay vì cổ vũ một cách diễn đạt không tự nhiên trong bản văn chính.
