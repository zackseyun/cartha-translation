revisions:
- from: Họ sẽ không còn đói, cũng không còn khát nữa; mặt trời chắc chắn sẽ không giáng xuống trên họ, cũng không một sức nóng thiêu đốt nào.[a]
  to: Họ sẽ không còn đói nữa, cũng không còn khát nữa; mặt trời sẽ nhất định không chiếu gắt trên họ[a], và họ sẽ không chịu bất cứ sức nóng thiêu đốt nào.
  rationale: Sửa cách diễn đạt về mặt trời từ “giáng xuống” thành “chiếu gắt” để phản ánh nghĩa ngữ cảnh của πέσῃ ἐπ’ αὐτούς bằng tiếng Việt tự nhiên. Giữ “sẽ nhất định không” để biểu đạt phủ định tương lai nhấn mạnh. Làm rõ vế cuối bằng động từ “chịu,” vốn được hiểu từ mệnh đề trước trong nguyên văn, và điều chỉnh chú thích theo nghĩa thành ngữ trong ngữ cảnh.
