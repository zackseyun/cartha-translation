id: REV.7.16
reference: Revelation 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: vi
  text: Họ sẽ không còn đói nữa, cũng không còn khát nữa; mặt trời sẽ nhất định không chiếu gắt trên họ[a], và họ sẽ không chịu bất cứ sức nóng thiêu đốt nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mặt trời sẽ không hề thiêu đốt họ.” Cụm Hy Lạp οὐδὲ μὴ πέσῃ là một lối phủ định nhấn mạnh, diễn tả sự việc chắc chắn sẽ không xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεινάσουσιν
  choice: sẽ không còn đói
  rationale: Động từ tương lai πεινάω diễn tả tình trạng chịu đói; trong tiếng Việt, “đói” là cách diễn đạt tự nhiên và song song với “khát”.
- source_word: ἔτι
  choice: còn ... nữa
  rationale: Trong mệnh đề phủ định, ἔτι chỉ sự chấm dứt từ nay về sau; cấu trúc “không còn ... nữa” truyền đạt tự nhiên ý này.
- source_word: οὐδὲ
  choice: cũng không
  rationale: Giữ phép nối phủ định tích lũy giữa các vế theo cách tự nhiên trong tiếng Việt.
- source_word: διψήσουσιν
  choice: sẽ không còn khát nữa
  rationale: Diễn đạt trực tiếp động từ tương lai διψάω và duy trì sự song hành với vế nói về đói.
- source_word: οὐδὲ μὴ πέσῃ
  choice: chắc chắn sẽ không giáng xuống
  rationale: οὐδὲ μή với động từ giả định aorist là phủ định tương lai nhấn mạnh. “Giáng xuống” giữ hình ảnh chuyển động của πίπτω, còn “chắc chắn” biểu đạt lực nhấn mạnh.
- source_word: ἐπ’ αὐτούς
  choice: trên họ
  rationale: ἐπί với đối cách ở đây chỉ hướng tác động đến họ; “trên họ” vừa sát hình ảnh vừa rõ nghĩa.
- source_word: ὁ ἥλιος
  choice: mặt trời
  rationale: Tương đương từ vựng trực tiếp và tự nhiên.
- source_word: πᾶν καῦμα
  choice: không một sức nóng thiêu đốt nào
  rationale: καῦμα là sức nóng gay gắt, thiêu đốt; πᾶν dưới phạm vi phủ định được diễn đạt tự nhiên bằng “không một ... nào”.
theological_decisions:
- issue: Sự liên tưởng đến Ê-sai 49:10 và ngôn ngữ phục hồi thời sau cùng
  choice: Giữ nguyên các hình ảnh cụ thể về đói, khát, mặt trời và sức nóng thiêu đốt.
  alternative: Hiểu và dịch đói khát chủ yếu như ẩn dụ cho sự khao khát thuộc linh.
  rationale: Văn cảnh đem lại sự an ủi mang tính khải huyền và vang vọng lời hứa phục hồi trong Ê-sai. Bản dịch không giải nghĩa quá mức theo hướng thuộc linh, nhưng để nguyên cả nghĩa cụ thể lẫn dư âm thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp “không còn ... nữa” giữ nhịp song hành; “chắc chắn sẽ không” bảo toàn sắc thái phủ định nhấn mạnh của nguyên văn. Dấu chú thích [a] đặt ngay sau toàn bộ lời hứa liên quan đến mặt trời và sức nóng.
