id: REV.7.3
reference: Revelation 7:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: vi
  text: 'rằng: “Đừng làm hại đất, biển hay cây cối cho đến khi chúng ta đã đóng ấn trên trán các nô lệ[a] của Đức Chúa Trời chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các tôi tớ”. Từ Hy Lạp δοῦλος chỉ người thuộc quyền một chủ; ở đây, “nô lệ” giữ rõ sắc thái ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: người nói
  rationale: Phân từ hiện tại nối với chủ thể ở câu trước; cách dịch này giữ sự liên kết cú pháp và tự nhiên khi câu được đọc trong văn mạch.
- source_word: ἀδικήσητε
  choice: làm hại
  rationale: Với các đối tượng là đất, biển và cây cối, động từ chỉ việc gây tổn hại hoặc tàn phá, không phải đối xử bất công với con người.
- source_word: γῆν
  choice: đất
  rationale: Trong bộ ba đất–biển–cây cối của cảnh phán xét mang tầm vũ trụ, “đất” vừa trực tiếp vừa không thu hẹp nghĩa thành một vùng lãnh thổ.
- source_word: θάλασσαν
  choice: biển
  rationale: Tương đương trực tiếp, rõ ràng và tự nhiên trong tiếng Việt.
- source_word: δένδρα
  choice: cây cối
  rationale: Diễn đạt tự nhiên danh từ số nhiều chỉ cây nói chung.
- source_word: ἄχρι
  choice: cho đến khi
  rationale: 'Đánh dấu giới hạn thời gian của lệnh cấm: sự gây hại phải chờ việc đóng ấn hoàn tất.'
- source_word: σφραγίσωμεν
  choice: chúng ta đóng ấn
  rationale: Giữ ngôi thứ nhất số nhiều và hình ảnh đóng ấn của nguyên văn; trong cấu trúc “cho đến khi”, tiếng Việt không cần thêm yếu tố chỉ hoàn thành.
- source_word: δούλους
  choice: các nô lệ
  rationale: “Nô lệ” giữ rõ ý thuộc quyền một chủ của δοῦλος, điều đặc biệt nổi bật trong cảnh những người thuộc về Đức Chúa Trời được đánh dấu; chú thích cung cấp cách dịch truyền thống nhẹ hơn.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: của Đức Chúa Trời chúng ta
  rationale: Giữ nguyên quan hệ sở hữu và đại từ “chúng ta” của nguyên văn.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: trên trán
  rationale: Diễn đạt tự nhiên vị trí của dấu ấn trong tiếng Việt; đối tượng số nhiều đã rõ qua “các nô lệ” nên không cần lặp “của họ”.
theological_decisions:
- issue: Cách dịch δοῦλος trong văn cảnh thuộc quyền và được đóng ấn
  choice: các nô lệ
  alternative: các tôi tớ
  rationale: Việc đóng ấn cho thấy những người này thuộc về Đức Chúa Trời, nên “nô lệ” bảo toàn sắc thái lệ thuộc và sở hữu của từ Hy Lạp; “tôi tớ” là cách dịch truyền thống, tự nhiên hơn nhưng làm nhẹ sắc thái ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong Kinh Thánh tiếng Việt; giữ hình ảnh khải huyền “đóng ấn” và sắc thái mạnh của δοῦλος.
