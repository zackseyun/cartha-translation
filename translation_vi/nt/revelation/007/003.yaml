  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: lệnh cấm gây hại cho đất, biển và cây cối; giới hạn thời gian trước khi việc đóng ấn hoàn tất; ngôi thứ nhất số nhiều «chúng ta»; và việc các nô lệ thuộc về Đức Chúa Trời được đóng ấn trên trán. «Nô lệ» bảo toàn sắc thái thuộc quyền của δούλους. Tuy nhiên, λέγων là phân từ liên kết với người nói trong văn mạch trước, và «người nói:» không phải là cách nối tự nhiên hay sát chức năng cú pháp nhất trong tiếng Việt; «rằng:» phù hợp hơn.'
