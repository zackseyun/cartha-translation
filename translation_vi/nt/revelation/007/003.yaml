  terminology: «Đức Chúa Trời», «đóng ấn», và «nô lệ» nhất quán với văn phong Kinh Thánh và với lực nghĩa của từ nguồn. Chú thích giữ được phương án truyền thống nhẹ hơn là «các tôi tớ» mà không làm yếu bản văn chính.
