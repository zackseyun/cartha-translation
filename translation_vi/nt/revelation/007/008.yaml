id: REV.7.8
reference: Revelation 7:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: vi
  text: từ chi phái Sa-bu-lôn, mười hai ngàn người; từ chi phái Giô-sép, mười hai ngàn người; từ chi phái Bên-gia-min, mười hai ngàn người—đều đã được đóng ấn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã được đóng ấn” hoặc “là những người được đóng ấn.” Phân từ Hy Lạp ở cuối câu tổng kết các nhóm vừa được liệt kê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: từ chi phái
  rationale: Diễn đạt tự nhiên nguồn gốc thuộc từng chi phái trong danh sách Israel, đồng thời giữ công thức lặp lại của nguyên văn.
- source_word: Ζαβουλών
  choice: Sa-bu-lôn
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: δώδεκα χιλιάδες
  choice: mười hai ngàn người
  rationale: Giữ nguyên con số; thêm “người” theo ngữ cảnh để câu tiếng Việt rõ và tự nhiên mà không bổ sung một nhóm đối tượng khác.
- source_word: Ἰωσήφ
  choice: Giô-sép
  rationale: Giữ đúng tên Giô-sép như nguyên văn, không thay bằng Ép-ra-im hay Ma-na-se dù có liên hệ với truyền thống danh sách chi phái.
- source_word: Βενιαμίν
  choice: Bên-gia-min
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: ἐσφραγισμένοι
  choice: đều là những người đã được đóng ấn
  rationale: Thể hiện phân từ hoàn thành bị động, nhấn mạnh trạng thái do hành động đóng ấn đã xảy ra; “đều” cho thấy cụm cuối tổng kết các nhóm vừa được liệt kê.
theological_decisions:
- issue: Phạm vi và sắc thái của ἐσφραγισμένοι ở cuối câu
  choice: Đặt cụm “đều là những người đã được đóng ấn” ở cuối để tổng kết cả ba nhóm trong câu.
  alternative: “sau khi đã được đóng ấn” hoặc “là những người được đóng ấn”
  rationale: Nguyên văn đặt phân từ ở cuối danh sách và dùng thể hoàn thành bị động. Bản dịch giữ vị trí tổng kết và kết quả của hành động, nhưng không giải thích bản chất hay thời điểm thần học của việc đóng ấn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ nhịp liệt kê của tiếng Hy Lạp; dùng dấu gạch ngang trước cụm tổng kết để làm rõ phạm vi của phân từ cuối câu.
