id: REV.11.2
reference: Revelation 11:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: vi
  text: Nhưng hãy loại sân phía ngoài điện thánh[a] ra, đừng đo sân ấy, vì sân ấy đã được trao cho các dân[b]; họ sẽ giày xéo thành thánh trong bốn mươi hai tháng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sân phía ngoài đền thờ.” Từ Hy Lạp ναός có thể chỉ riêng điện thánh hoặc nơi thánh, thay vì toàn bộ khu đền thờ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “các dân ngoại.” Từ Hy Lạp ἔθνεσιν có thể mang nghĩa “các dân” hoặc “các dân ngoại,” tùy ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: sân
  rationale: Trong ngữ cảnh đền thờ, từ này chỉ khu sân; “sân” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: phía ngoài nơi thánh
  rationale: Cụm này xác định sân nằm bên ngoài ναός. Cách dịch giữ rõ tương quan không gian và dùng “nơi thánh” cho nghĩa hẹp của ναός.
- source_word: ναός
  choice: nơi thánh
  rationale: Ở đây ναός đối lập với sân phía ngoài và có thể chỉ phần điện thánh trung tâm, không nhất thiết toàn bộ khu đền thờ. “Nơi thánh” giữ được nghĩa hẹp ấy mà vẫn dễ hiểu.
- source_word: ἔκβαλε ἔξωθεν
  choice: hãy bỏ ... ra
  rationale: Trong mạch lệnh đo đạc, thành ngữ này có ý loại sân ấy khỏi phạm vi đo, chứ không nhất thiết diễn tả hành động ném đi theo nghĩa đen.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: đừng đo sân ấy
  rationale: Giữ nguyên lực cấm của mệnh lệnh ngôi thứ hai số ít; lặp lại “sân” giúp câu tiếng Việt rõ đối tượng.
- source_word: ἐδόθη
  choice: đã được trao
  rationale: Giữ thể bị động và không tự ý nêu tác nhân; thì quá khứ cũng diễn tả sân đã bị giao vào quyền của các dân.
- source_word: τοῖς ἔθνεσιν
  choice: cho các dân
  rationale: “Các dân” giữ nghĩa rộng và sắc thái ngôn ngữ tiên tri; nghĩa “các dân ngoại” được bảo lưu trong chú thích.
- source_word: πόλιν τὴν ἁγίαν
  choice: thành thánh
  rationale: Cách diễn đạt ngắn gọn, trang trọng, không tự ý xác định thành ấy là Giê-ru-sa-lem ngay trong chính văn.
- source_word: πατήσουσιν
  choice: họ sẽ giày xéo
  rationale: Diễn tả mạnh mẽ hành động chà đạp, xúc phạm hoặc thống trị, phù hợp hình ảnh khải huyền.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: trong bốn mươi hai tháng
  rationale: “Trong” diễn đạt tự nhiên khoảng thời gian kéo dài của hành động trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của ναός trong hình ảnh đền thờ
  choice: Dịch là “nơi thánh” trong chính văn.
  alternative: “đền thờ”
  rationale: Sự đối lập với sân phía ngoài gợi rằng ναός có thể chỉ điện thánh hay phần trung tâm của đền thờ. Tuy vậy, nghĩa rộng “đền thờ” vẫn khả hữu nên được ghi ở chú thích.
- issue: Ý nghĩa của ἔθνεσιν
  choice: Dịch là “các dân” trong chính văn.
  alternative: “các dân ngoại”
  rationale: Từ Hy Lạp có thể chỉ các dân nói chung hoặc dân ngoại đối lập với dân Do Thái. “Các dân” ít hạn định hơn và hợp văn phong tiên tri, còn sắc thái dân tộc–tôn giáo được giữ trong chú thích.
- issue: Tác nhân của ἐδόθη
  choice: Giữ thể bị động “đã được trao”.
  alternative: Nêu rõ “Đức Chúa Trời đã trao”.
  rationale: Nguyên văn không nói rõ tác nhân. Không thêm Đức Chúa Trời vào chính văn, dù thể bị động có thể ngầm hàm ý quyền cho phép của Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ mệnh lệnh trực tiếp, thể bị động không nêu tác nhân, cùng hình ảnh mạnh “giày xéo.” Các chú thích bảo lưu hai điểm mơ hồ quan trọng của nguyên văn.
