  source_fidelity: 'Bản dịch giữ đúng các quan hệ chính của nguyên văn: sân ở bên ngoài ναός bị loại khỏi việc đo; sân ấy được trao cho các dân; và các dân sẽ giày xéo thành thánh trong thời hạn bốn mươi hai tháng. Thể bị động của ἐδόθη và tính không xác định của tác nhân được duy trì. “Các dân” bảo toàn độ mở của ἔθνεσιν, với phương án “các dân ngoại” trong chú thích.'
