  - severity: medium
    issue: Ký hiệu chú thích [b] neo sai vị trí.
    rationale: Chú thích [b] nói về “Hòm Giao Ước ... của Ngài”/giao ước của Ngài, nhưng hiện đặt sau “đền thờ Ngài”; cần chuyển đến ngay sau cụm “Hòm Giao Ước của Ngài”.
  - severity: low
    issue: “Những tiếng vang” không phải là lựa chọn chú thích sát nghĩa cho φωναί.
    rationale: φωναί có thể chỉ “tiếng nói,” “âm thanh,” hoặc “tiếng động”; “tiếng vang” hàm ý sự vọng lại không được nguyên văn nêu.
