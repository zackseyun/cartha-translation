id: REV.11.19
reference: Revelation 11:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: vi
  text: Bấy giờ, đền thờ của Đức Chúa Trời ở trên trời[a] được mở ra, và Hòm Giao Ước của Ngài[b] được nhìn thấy trong đền thờ Ngài. Rồi có những tia chớp, những tiếng nói[c], những tiếng sấm, một trận động đất và một trận mưa đá lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nơi thánh” hoặc “điện thánh”; từ Hy Lạp ναός nhấn mạnh nơi ngự thánh bên trong hơn là toàn bộ khuôn viên đền thờ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể gọi theo cách quen thuộc là “Hòm Giao Ước”; nguyên văn Hy Lạp nói rõ “hòm của giao ước Ngài”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “những âm thanh” hoặc “những tiếng động”. Trong sách Khải Huyền, từ này thường xuất hiện trong các cảnh Đức Chúa Trời bày tỏ uy nghi và phán xét.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: đền thờ
  rationale: “Đền thờ” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với nơi ngự trên trời của Đức Chúa Trời; “nơi thánh” vẫn là khả năng hẹp nghĩa hơn, nhấn mạnh phần thánh bên trong.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: ở trên trời
  rationale: Giữ rõ ý chỉ vị trí của đền thờ, đồng thời thuận cú pháp tiếng Việt.
- source_word: ἠνοίγη
  choice: được mở ra
  rationale: Giữ thể bị động và tính chất sự kiện của động từ Hy Lạp, không tự ý nêu tác nhân.
- source_word: ὤφθη
  choice: được nhìn thấy
  rationale: Bám sát thể bị động, không quyết định thay người đọc rằng chiếc hòm chủ động hiện ra hay chỉ trở nên hữu hình.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: Hòm Giao Ước của Ngài
  rationale: 'Dùng thuật ngữ Kinh Thánh quen thuộc, đồng thời thể hiện rõ αὐτοῦ: giao ước thuộc về Đức Chúa Trời.'
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: trong đền thờ Ngài
  rationale: Lặp lại cùng cách dịch cho ναός và giữ đại từ sở hữu αὐτοῦ.
- source_word: ἐγένοντο
  choice: rồi có
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để giới thiệu chuỗi hiện tượng xảy đến.
- source_word: ἀστραπαὶ
  choice: những tia chớp
  rationale: Diễn đạt rõ dạng số nhiều và tự nhiên trong tiếng Việt hiện đại.
- source_word: φωναὶ
  choice: những tiếng nói
  rationale: Giữ nghĩa trực tiếp của từ Hy Lạp và lối diễn đạt thần hiện đặc trưng trong sách Khải Huyền, thay vì làm phẳng thành âm thanh chung chung.
- source_word: βρονταὶ
  choice: những tiếng sấm
  rationale: Cách nói tự nhiên, thể hiện dạng số nhiều của chuỗi tiếng sấm.
- source_word: σεισμὸς
  choice: một trận động đất
  rationale: Cách dịch tiêu chuẩn, tự nhiên cho σεισμός trong ngữ cảnh khải huyền.
- source_word: χάλαζα μεγάλη
  choice: một trận mưa đá lớn
  rationale: Giữ ý cường độ hoặc quy mô lớn của μεγάλη mà vẫn tự nhiên hơn cách nói sát chữ “mưa đá lớn” đứng riêng.
theological_decisions:
- issue: Bản chất của ναός trên trời
  choice: Dịch là “đền thờ” trong chính văn.
  alternative: “nơi thánh” hoặc “điện thánh”
  rationale: “Đền thờ” dễ hiểu và không áp đặt một mô hình kiến trúc thần học quá cụ thể; chú thích bảo lưu nghĩa hẹp hơn của ναός là khu vực thánh bên trong.
- issue: Ý nghĩa của φωναὶ trong chuỗi hiện tượng thần hiện
  choice: Dịch là “những tiếng nói”.
  alternative: “những âm thanh” hoặc “những tiếng vang”
  rationale: Cách dịch trực tiếp bảo toàn lối nói lặp lại trong Khải Huyền và sự mơ hồ giữa tiếng nói có nội dung với những âm thanh uy nghi; chú thích nêu các khả năng rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ các thể bị động của nguyên văn khi chúng bảo toàn sự kín nhiệm về tác nhân; duy trì nhịp liệt kê dồn dập của cảnh thần hiện. Viết hoa “Hòm Giao Ước” theo cách gọi danh vật đã quen thuộc trong tiếng Việt Kinh Thánh, nhưng không viết hoa các danh từ chung khác.
