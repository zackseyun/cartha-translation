id: REV.11.1
reference: Revelation 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: vi
  text: 'Tôi được trao một cây sậy giống như một cây gậy; có lời phán rằng: “Hãy đứng dậy, đo đền thờ[a] của Đức Chúa Trời, bàn thờ và những người thờ phượng trong đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nơi thánh”; từ Hy Lạp ναός có thể chỉ cụ thể phần thánh bên trong, chứ không phải toàn bộ khuôn viên đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: tôi được trao
  rationale: Giữ thể bị động và trọng tâm của nguyên văn ở vật được trao, đồng thời không nêu rõ người trao.
- source_word: κάλαμος
  choice: một cây sậy
  rationale: Giữ nghĩa cơ bản của κάλαμος; không dịch sẵn thành “thước đo”, vì chức năng đo chỉ được hàm ý qua mệnh lệnh theo sau.
- source_word: ὅμοιος ῥάβδῳ
  choice: giống như cây gậy
  rationale: Thể hiện trực tiếp cấu trúc so sánh mà không diễn giải thêm tính chất hay công dụng của cây gậy.
- source_word: λέγων
  choice: kèm theo lời rằng
  rationale: Diễn đạt tự nhiên trong tiếng Việt nhưng vẫn không xác định người nói, phù hợp với cấu trúc phân từ đột ngột và chủ thể hàm ẩn trong tiếng Hy Lạp.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh rõ ràng, tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: μέτρησον
  choice: đo
  rationale: Giữ nghĩa trực tiếp của động từ và sắc thái mệnh lệnh.
- source_word: ναὸν τοῦ θεοῦ
  choice: đền thờ của Đức Chúa Trời
  rationale: “Đền thờ” là cách diễn đạt tự nhiên và rộng rãi trong tiếng Việt; sắc thái cụ thể hơn của ναός được ghi ở chú thích.
- source_word: θυσιαστήριον
  choice: bàn thờ
  rationale: Tương đương thông dụng, không tự ý xác định đây là bàn thờ dâng hương hay bàn thờ dâng sinh tế.
- source_word: τοὺς προσκυνοῦντας
  choice: những người đang thờ phượng
  rationale: Giữ sắc thái động từ của phân từ danh hóa và cho thấy hành động đang được thực hiện trong khải tượng.
- source_word: ἐν αὐτῷ
  choice: trong đó
  rationale: Đại từ được hiểu tự nhiên là quy chiếu về đền thờ, diễn tả vị trí mà không thêm cách giải thích biểu tượng.
theological_decisions:
- issue: Ý nghĩa của ναός trong bối cảnh khải huyền
  choice: đền thờ của Đức Chúa Trời
  alternative: nơi thánh của Đức Chúa Trời
  rationale: Câu này không tự xác định đó là đền thờ dưới đất, nơi thánh trên trời hay biểu tượng về dân Đức Chúa Trời. Bản dịch giữ cách gọi từ vựng chung và không áp đặt một hệ thống cánh chung.
- issue: Danh tính của người nói được hàm ý bởi λέγων
  choice: không xác định, qua cụm “kèm theo lời rằng”
  alternative: một thiên sứ nói / có tiếng phán
  rationale: Nguyên văn không nêu rõ người nói; vì vậy bản dịch không thêm “thiên sứ”, “tiếng” hay một chủ thể cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “kèm theo lời rằng” được dùng để giữ sự mơ hồ về người nói mà tránh lối dịch quá cứng theo cú pháp Hy Lạp.
