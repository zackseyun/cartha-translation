id: REV.11.8
reference: Revelation 11:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: vi
  text: 'Thi thể của họ[a] nằm trên đường phố của thành lớn, thành ấy theo nghĩa thuộc linh được gọi là Sô-đôm và Ai Cập[b], cũng chính là nơi Chúa của họ đã bị đóng đinh trên thập tự giá.[c]


    [a] Nguyên văn Hy Lạp dùng “thi thể” ở số ít, dù nói về hai nhân chứng, có lẽ xem họ như một thể thống nhất. Trong tiếng Việt, “thi thể của họ” không buộc phải xác định số ít hay số nhiều.

    [b] Cũng có thể dịch: “theo nghĩa biểu tượng được gọi là Sô-đôm và Ai Cập.”

    [c] Cụm từ “nơi Chúa của họ đã bị đóng đinh trên thập tự giá” hướng đến Giê-ru-sa-lem, nhưng câu Kinh Thánh vẫn giữ danh xưng mang tính biểu tượng là “thành lớn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng “thi thể” ở số ít, dù nói về hai nhân chứng, có lẽ xem họ như một thể thống nhất. Trong tiếng Việt, “thi thể của họ” không buộc phải xác định số ít hay số nhiều.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “theo nghĩa biểu tượng được gọi là Sô-đôm và Ai Cập.”'
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “nơi Chúa của họ đã bị đóng đinh trên thập tự giá” hướng đến Giê-ru-sa-lem, nhưng câu Kinh Thánh vẫn giữ danh xưng mang tính biểu tượng là “thành lớn.”
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: thi thể của họ
  rationale: πτῶμα chỉ thân thể đã chết và ở dạng số ít, còn αὐτῶν quy chiếu đến hai nhân chứng. Cách dịch này tự nhiên trong tiếng Việt và không áp đặt số nhiều lên danh từ Hy Lạp.
- source_word: ἐπὶ τῆς πλατείας
  choice: trên đường phố
  rationale: πλατεῖα có thể chỉ đường phố rộng hoặc quảng trường. “Trên đường phố” giữ hình ảnh công khai và không xác định quá mức địa điểm.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: của thành lớn
  rationale: Giữ sát danh xưng khải huyền quan trọng “thành lớn,” thay vì giải nghĩa trực tiếp là một địa danh.
- source_word: πνευματικῶς
  choice: theo nghĩa thuộc linh
  rationale: Giữ nghĩa trực tiếp của trạng từ πνευματικῶς, đồng thời diễn đạt tự nhiên hơn lối dịch từng chữ “một cách thuộc linh.” Nghĩa “biểu tượng” được ghi ở chú thích.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sô-đôm và Ai Cập
  rationale: Dùng các dạng tên riêng quen thuộc trong tiếng Việt, giữ nguyên cặp hình ảnh biểu tượng mà không diễn giải thêm trong chính văn.
- source_word: ὅπου καὶ
  choice: cũng chính là nơi
  rationale: “Nơi” chuyển tải ὅπου, còn “cũng chính” thể hiện sắc thái bổ sung và nhấn mạnh của καί trong câu tiếng Việt tự nhiên.
- source_word: ὁ κύριος αὐτῶν
  choice: Chúa của họ
  rationale: “Chúa” phù hợp với tước hiệu κύριος trong ngữ cảnh thần học và αὐτῶν được giữ là “của họ,” quy chiếu đến hai nhân chứng.
- source_word: ἐσταυρώθη
  choice: đã bị đóng đinh trên thập tự giá
  rationale: Diễn đạt thể bị động và biến cố quá khứ của động từ σταυρόω bằng cách nói quen thuộc, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Danh từ πτῶμα số ít với sở hữu từ số nhiều
  choice: Dịch “thi thể của họ,” không thêm từ chỉ số nhiều.
  alternative: các thi thể của họ
  rationale: Nguyên văn dùng danh từ số ít, có thể trình bày hai nhân chứng như một thể thống nhất. Tiếng Việt cho phép giữ cách nói không đánh dấu số mà vẫn tự nhiên.
- issue: Ý nghĩa của πνευματικῶς
  choice: Dịch trong chính văn là “theo nghĩa thuộc linh.”
  alternative: theo nghĩa biểu tượng; theo nghĩa bóng
  rationale: Cách chọn giữ yếu tố “thuộc linh” của nguyên văn và không thu hẹp nó thành một phạm trù tu từ đơn thuần; cách hiểu biểu tượng được nêu trong chú thích.
- issue: Danh tính của “thành lớn”
  choice: Không thay “thành lớn” bằng “Giê-ru-sa-lem” trong chính văn.
  alternative: thành Giê-ru-sa-lem
  rationale: Mệnh đề về nơi Chúa bị đóng đinh hướng rõ đến Giê-ru-sa-lem, nhưng tác giả vẫn dùng danh xưng khải huyền “thành lớn” và gọi thành ấy là Sô-đôm cùng Ai Cập. Bản dịch cần giữ sự căng thẳng biểu tượng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ nhịp khải huyền của nguyên văn; các tên riêng dùng dạng tiếng Việt quen thuộc. Bản dịch ưu tiên sát nghĩa nhưng tận dụng đặc điểm không bắt buộc đánh dấu số của danh từ tiếng Việt để bảo tồn cách diễn đạt số ít trong tiếng Hy Lạp.
