id: REV.11.4
reference: Revelation 11:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: vi
  text: Hai vị này là hai cây ô-liu và hai chân đèn; họ đứng trước Chúa của đất.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này gợi đến Xa-cha-ri 4, nơi hình ảnh cây ô-liu và chân đèn tượng trưng cho những người được Đức Chúa Trời chỉ định và ban năng lực bởi Thần Khí của Ngài.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể diễn đạt: “Hai vị này là hai cây ô-liu và hai chân đèn; họ đang đứng trước Chúa của đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Hai vị này
  rationale: Đại từ chỉ định giống đực số nhiều quy chiếu về hai nhân chứng trong văn cảnh. “Hai vị này” tự nhiên trong tiếng Việt, cho thấy đối tượng là người mà không chèn lại danh xưng “nhân chứng” vốn không có trong câu này.
- source_word: ἐλαῖαι
  choice: cây ô-liu
  rationale: Trong hình ảnh khải huyền gợi đến Xa-cha-ri 4, từ này chỉ cây ô-liu, không chỉ quả ô-liu; cách dịch giữ nguyên hình tượng liên văn bản.
- source_word: λυχνίαι
  choice: chân đèn
  rationale: Từ Hy Lạp chỉ giá hoặc chân đặt đèn chứ không phải chính ngọn đèn; “chân đèn” cũng nhất quán với hình tượng quan trọng trong sách Khải Huyền.
- source_word: ἐνώπιον
  choice: trước
  rationale: Diễn tả vị trí trong sự hiện diện của một nhân vật; “trước” ngắn gọn, trang trọng và sát nghĩa.
- source_word: κυρίου
  choice: Chúa Tể
  rationale: Ở đây κύριος là tước hiệu biểu thị quyền chủ tể. “Chúa Tể” tạo thành danh hiệu tiếng Việt tự nhiên với bổ ngữ “của đất” và giữ sắc thái tôn kính.
- source_word: γῆς
  choice: đất
  rationale: Trong tầm vóc vũ trụ của Khải Huyền, γῆ nói đến đất/thế gian hơn là một miền đất riêng. “Đất” giữ được lối diễn đạt Kinh Thánh mà không thêm ý “toàn thể” vốn không được nói rõ.
- source_word: ἑστῶτες
  choice: đứng
  rationale: Phân từ hoàn thành chủ động giống đực số nhiều diễn tả trạng thái đã đứng vào vị trí và hiện vẫn đứng. “Đứng” truyền đạt tự nhiên trạng thái này; chú thích nêu cách diễn đạt làm rõ rằng từ này quy chiếu về hai vị.
theological_decisions:
- issue: Mối liên hệ của hình tượng với Xa-cha-ri 4 và căn tính của hai nhân chứng
  choice: 'Giữ nguyên phép đồng nhất bằng hình tượng: “hai cây ô-liu và hai chân đèn”, không giải nghĩa biểu tượng trong chính câu.'
  alternative: Diễn giải thành “Hai nhân chứng này giống như hai cây ô-liu và hai chân đèn.”
  rationale: Bản Hy Lạp trực tiếp đồng nhất họ với các hình tượng khải huyền, chứ không dùng một phép so sánh được giải thích. Giữ nguyên cách nói này bảo tồn sức căng thần học và âm vang liên văn bản.
- issue: Phạm vi quy chiếu của ἑστῶτες (“đứng”)
  choice: Giữ kết cấu gọn “hai cây ô-liu và hai chân đèn đứng trước…”, đồng thời nêu cách dịch làm rõ chủ thể trong chú thích.
  alternative: “Hai vị này là hai cây ô-liu và hai chân đèn; họ đứng trước Chúa Tể của đất.”
  rationale: Về ngữ pháp Hy Lạp, phân từ giống đực số nhiều phù hợp với Οὗτοί và quy chiếu về hai vị, trong khi các danh từ hình tượng là giống cái. Tuy nhiên, kết cấu câu có thể được chuyển sang tiếng Việt theo dạng phân từ gắn với toàn cụm; chú thích giúp người đọc thấy rõ khả năng diễn đạt sát quan hệ ngữ pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ô-liu” là tên cây thông dụng trong ngôn ngữ Kinh Thánh tiếng Việt; dùng “chân đèn” để phân biệt với ngọn đèn. “Hai vị này” tôn trọng đối tượng là người mà không thêm danh xưng ngoài nguyên văn.
