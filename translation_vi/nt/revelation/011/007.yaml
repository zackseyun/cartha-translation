id: REV.11.7
reference: Revelation 11:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: vi
  text: Khi họ hoàn tất lời chứng của mình, con thú từ vực sâu đi lên sẽ giao chiến với họ[a], thắng họ và giết họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ gây chiến chống lại họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελέσωσιν
  choice: hoàn tất
  rationale: 'Diễn đạt tự nhiên hành động đưa nhiệm vụ làm chứng đến chỗ trọn vẹn; cấu trúc ὅταν với động từ giả định aorist được chuyển thành mệnh đề thời gian hướng tới tương lai: “Khi họ hoàn tất”.'
- source_word: μαρτυρίαν
  choice: lời chứng
  rationale: Giữ nghĩa làm chứng/chứng ngôn trong bối cảnh Khải Huyền và kết hợp tự nhiên với “hoàn tất” trong tiếng Việt.
- source_word: θηρίον
  choice: con thú
  rationale: Cách gọi rõ ràng, quen thuộc trong văn chương khải huyền, không thêm sắc thái diễn giải như “dã thú”.
- source_word: ἀναβαῖνον
  choice: đi lên
  rationale: Phân từ hiện tại bổ nghĩa cho “con thú” được diễn đạt bằng cụm động từ tự nhiên, giữ hình ảnh nó từ vực sâu đi lên.
- source_word: ἀβύσσου
  choice: vực sâu
  rationale: Phản ánh sát ἄβυσσος mà không thêm ý “không đáy” vốn không được nêu trực tiếp trong từ Hy Lạp ở câu này.
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: sẽ giao chiến với họ
  rationale: “Giao chiến với” là thành ngữ tiếng Việt tự nhiên, giữ được cấu trúc quan hệ với μετά và thể hiện rõ tính thù địch nhờ chính động từ “giao chiến”.
- source_word: νικήσει
  choice: thắng họ
  rationale: Giữ nghĩa chiến thắng/áp đảo trong mạch xung đột, đồng thời ngắn gọn và tự nhiên; không làm mạnh thêm thành ý tiêu diệt vì động từ kế tiếp đã nói “giết”.
- source_word: ἀποκτενεῖ
  choice: giết họ
  rationale: Cách chuyển ngữ trực tiếp, hiện đại của động từ chỉ việc lấy mạng.
theological_decisions:
- issue: Quan hệ thù địch trong ποιήσει μετ’ αὐτῶν πόλεμον
  choice: sẽ giao chiến với họ
  alternative: sẽ gây chiến chống lại họ
  rationale: Bản dịch chính giữ gần cấu trúc μετά + sở hữu cách (“với họ”) nhưng dùng “giao chiến” để quan hệ thù địch không bị mơ hồ. Chú thích bảo lưu cách diễn đạt nhấn mạnh hướng chống đối.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp dồn liên tiếp của ba động từ tương lai: giao chiến, thắng và giết. Dấu chú thích được đặt ngay sau cụm mà phương án thay thế liên quan đến.'
