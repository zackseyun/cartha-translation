id: REV.11.3
reference: Revelation 11:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: vi
  text: Ta sẽ ban cho hai nhân chứng của Ta[a], và họ sẽ nói tiên tri trong một ngàn hai trăm sáu mươi ngày, mặc áo vải thô[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Ta sẽ ban cho hai nhân chứng của Ta.” Tiếng Hy Lạp không nói rõ điều được ban là gì; ngữ cảnh có thể hàm ý quyền hạn, năng lực hoặc sứ mạng để nói tiên tri.'
    reason: lexical_alternative
  - marker: b
    text: Vải thô thường gắn với tang chế, sự ăn năn và lời than của ngôn sứ.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: Ta sẽ ban cho
  rationale: Động từ có nghĩa cơ bản là “ban/cho”, nhưng tân ngữ trực tiếp không được nói rõ. Bản dịch giữ nguyên sự bỏ lửng có chủ ý của câu Hy Lạp, vì tiếng Việt vẫn có thể dùng “ban cho” theo cách này mà không cần thêm “thẩm quyền” hay “năng lực” vào chính văn.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: hai nhân chứng của Ta
  rationale: Giữ cả số lượng, quan hệ sở hữu và nghĩa làm chứng của μάρτυς; “nhân chứng” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: προφητεύσουσιν
  choice: họ sẽ nói tiên tri
  rationale: Diễn đạt trực tiếp hoạt động nói lời tiên tri, rõ nghĩa hơn động từ ít thông dụng “tiên tri” khi đứng độc lập.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: trong một ngàn hai trăm sáu mươi ngày
  rationale: Đối cách chỉ khoảng thời gian; “trong … ngày” là cách diễn đạt tự nhiên, đồng thời giữ nguyên con số của nguyên văn.
- source_word: περιβεβλημένοι σάκκους
  choice: mình mặc vải thô
  rationale: Phân từ hoàn thành mô tả trạng thái đang mặc. σάκκους chỉ loại vải/áo thô gắn với tang chế và sám hối; “mình mặc vải thô” giữ hình ảnh mà không giải nghĩa ngay trong chính văn.
theological_decisions:
- issue: Tân ngữ bị lược của δώσω
  choice: Giữ cách nói “Ta sẽ ban cho hai nhân chứng của Ta” mà không bổ sung tân ngữ.
  alternative: Ta sẽ ban thẩm quyền cho hai nhân chứng của Ta.
  rationale: Nguyên văn không nói rõ điều gì được ban. Ngữ cảnh có thể gợi đến quyền hạn, năng lực hoặc sứ mạng nói tiên tri, nhưng đưa một trong các ý ấy vào chính văn sẽ thu hẹp sự mơ hồ thật sự của tiếng Hy Lạp.
- issue: Ý nghĩa biểu tượng của σάκκους
  choice: Giữ hình ảnh “vải thô” trong chính văn.
  alternative: mặc áo tang / mặc trang phục biểu thị sự ăn năn
  rationale: Vải thô có liên hệ văn hóa với tang chế, ăn năn và lời than của ngôn sứ, nhưng câu này chỉ nêu hình ảnh chứ không xác định duy nhất một ý nghĩa.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp văn chương khải huyền. Đại từ “Ta” phản ánh lời của nhân vật có thẩm quyền thần thượng trong ngữ cảnh. Câu giữ sự lặp liên từ của nguyên văn ở mức tự nhiên trong tiếng Việt và không giải quyết thay người đọc điều mà tiếng Hy Lạp để ngỏ.
