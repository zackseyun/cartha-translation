id: REV.11.18
reference: Revelation 11:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: vi
  text: Các dân tộc đã nổi giận, và cơn thịnh nộ của Ngài đã đến; cũng đã đến thời điểm để những người chết chịu phán xét, để Ngài ban phần thưởng cho các đầy tớ Ngài[a]—các nhà tiên tri, các thánh đồ và những người kính sợ danh Ngài, cả kẻ thấp lẫn người cao—và để Ngài hủy diệt những kẻ hủy hoại trái đất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nô lệ Ngài”; từ Hy Lạp doulos có thể chỉ đầy tớ hoặc nô lệ, tùy văn cảnh.
    reason: alternative_reading
  - marker: b
    text: “Hủy hoại” cũng có thể hiểu là “làm bại hoại” hoặc “làm hư hỏng”; từ Hy Lạp gē được dịch là “trái đất” ở đây cũng có thể có nghĩa là “đất” hoặc “xứ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: các dân tộc
  rationale: Diễn đạt tự nhiên tập thể các dân trên thế giới trong bối cảnh Khải Huyền, không thu hẹp nghĩa thành riêng các dân ngoại đối lập với người Do Thái.
- source_word: ὠργίσθησαν
  choice: đã nổi giận
  rationale: Giữ sắc thái bắt đầu hoặc bộc phát cơn giận của động từ mà không tăng cường quá mức thành “cuồng nộ”.
- source_word: ὀργή
  choice: cơn thịnh nộ
  rationale: Giữ sức nặng tư pháp và cánh chung của cơn giận thần thượng, đồng thời tạo thế đối ứng với việc các dân tộc nổi giận.
- source_word: καιρός
  choice: thời điểm
  rationale: Chỉ thời khắc quyết định đã đến; “thời điểm” tự nhiên và cụ thể hơn “thời gian” trong cấu trúc tiếng Việt này.
- source_word: τῶν νεκρῶν
  choice: những người chết
  rationale: Cách diễn đạt danh từ hóa tự nhiên trong tiếng Việt, chỉ toàn thể người đã chết.
- source_word: κριθῆναι
  choice: chịu phán xét
  rationale: Thể hiện rõ thể bị động và sắc thái tư pháp của động từ.
- source_word: μισθός
  choice: phần thưởng
  rationale: Phù hợp với sự báo đáp của Đức Chúa Trời dành cho dân Ngài mà không gợi quan hệ tiền công mang tính giao dịch.
- source_word: δούλοις
  choice: các đầy tớ
  rationale: “Đầy tớ” là danh xưng trang trọng, quen thuộc cho những người phụng sự và thuộc về Đức Chúa Trời; nghĩa mạnh hơn “nô lệ” được giữ trong chú thích.
- source_word: προφήταις
  choice: các nhà tiên tri
  rationale: Tên gọi tự nhiên trong tiếng Việt cho nhóm người được xác định trong nguyên văn.
- source_word: ἁγίοις
  choice: các thánh đồ
  rationale: Thuật ngữ Kinh Thánh quen thuộc chỉ cộng đồng những người được biệt riêng cho Đức Chúa Trời, không chủ ý giới hạn vào những nhân vật được phong thánh.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: những người kính sợ danh Ngài
  rationale: Giữ thành ngữ Kinh Thánh về lòng kính sợ tôn reverence đối với Đức Chúa Trời mà vẫn tự nhiên trong tiếng Việt.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: cả người nhỏ lẫn người lớn
  rationale: Giữ cặp đối xứng và ý bao quát mọi địa vị; không diễn giải quá mức thành tuổi tác hay phẩm chất.
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: hủy diệt những kẻ hủy hoại
  rationale: Tái hiện lối chơi lặp cùng gốc động từ, đồng thời phân biệt hành động phán xét dứt khoát với hành động gây tàn phá của đối tượng.
- source_word: γῆ
  choice: trái đất
  rationale: Bối cảnh phán xét cánh chung và phạm vi các dân tộc nghiêng về nghĩa toàn thế giới; nghĩa “đất/xứ” vẫn được ghi nhận trong chú thích.
theological_decisions:
- issue: Cách dịch δοῦλος khi chỉ dân thuộc về Đức Chúa Trời
  choice: đầy tớ
  alternative: nô lệ
  rationale: Trọng tâm tại đây là những người được Đức Chúa Trời nhìn nhận và ban thưởng, không trực tiếp nhấn mạnh địa vị bị sở hữu; “đầy tớ” giữ ý phụng sự và thuộc về Ngài, còn nghĩa “nô lệ” được bảo lưu trong chú thích.
- issue: Phạm vi nghĩa của γῆ
  choice: trái đất
  alternative: đất hoặc xứ
  rationale: Khung cảnh phán xét mang tầm cánh chung và toàn cầu ủng hộ “trái đất”, nhưng nguyên ngữ cũng có thể chỉ đất hay một xứ nên không loại bỏ khả năng ấy.
- issue: Quan hệ giữa các nhóm nhận phần thưởng
  choice: giữ chuỗi “các nhà tiên tri, các thánh đồ và những người kính sợ danh Ngài”
  alternative: hiểu các cụm sau là phần giải thích hoặc đồng quy chiếu với “các đầy tớ”
  rationale: Cú pháp cho thấy tất cả đều thuộc phạm vi những người nhận phần thưởng, nhưng không buộc bản dịch giải quyết dứt khoát liệu đây là các nhóm tách biệt hay các cách gọi chồng lấn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Duy trì nhịp liệt kê long trọng của nguyên văn nhưng dùng dấu chấm phẩy và dấu gạch ngang để làm rõ cấu trúc. Đại từ “Ngài” thể hiện lời thưa trực tiếp với Đức Chúa Trời. Hai lần thêm “Ngài” trước các động từ “ban” và “hủy diệt” làm rõ chủ thể vốn được hàm chứa bởi cấu trúc Hy Lạp, không thay đổi nội dung.
