  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: vi
  text: Vào chính giờ ấy, một trận động đất lớn xảy ra; một phần mười của thành phố sụp đổ, và bảy nghìn người[a] bị giết trong trận động đất. Những người còn lại trở nên kinh hãi và dâng vinh quang cho Đức Chúa Trời trên trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “tên của người, bảy nghìn”—một lối diễn đạt chỉ số người được đếm, tức bảy nghìn người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ngay trong giờ ấy
  rationale: Giữ hình ảnh thời gian cụ thể và tính tức thời của lời văn khải huyền; “ngay” giúp câu tự nhiên trong tiếng Việt mà không làm thành một mốc thời gian mơ hồ hơn.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: một trận động đất lớn xảy ra
  rationale: “Trận động đất lớn” chuyển tải trực tiếp danh từ và tính từ Hy Lạp; “xảy ra” diễn đạt tự nhiên sắc thái biến cố của ἐγένετο.
- source_word: τὸ δέκατον τῆς πόλεως
  choice: một phần mười thành phố
  rationale: Cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt, đồng thời giữ nguyên tỷ lệ chính xác của nguyên văn.
- source_word: ἔπεσεν
  choice: sụp đổ
  rationale: Trong ngữ cảnh một phần thành phố chịu động đất, “sụp đổ” là cách nói tự nhiên trong tiếng Việt cho hành động “ngã/đổ xuống”, nhưng không thêm chi tiết về mức độ tàn phá.
- source_word: ἀπεκτάνθησαν
  choice: bị giết
  rationale: Giữ thể bị động và ý nghĩa trực tiếp của động từ, không dùng từ cổ hoặc tô đậm sắc thái bạo lực ngoài nguyên văn.
- source_word: ὀνόματα ἀνθρώπων
  choice: người
  rationale: Cụm từ có nghĩa đen là “các tên của loài người” nhưng được dùng để chỉ những người được đếm. Bản văn chính dùng cách nói tự nhiên; nghĩa đen đáng chú ý được giữ trong chú thích.
- source_word: χιλιάδες ἑπτά
  choice: bảy ngàn
  rationale: Cách biểu đạt số đếm thông dụng và chính xác trong tiếng Việt hiện đại.
- source_word: οἱ λοιποὶ
  choice: những người còn lại
  rationale: Dịch trực tiếp mà không diễn giải thành “những người sống sót”, dù điều đó có thể được suy ra từ ngữ cảnh.
- source_word: ἔμφοβοι ἐγένοντο
  choice: trở nên kinh hãi
  rationale: “Trở nên” giữ sắc thái chuyển biến của ἐγένοντο, còn “kinh hãi” thể hiện cường độ mạnh của ἔμφοβοι.
- source_word: ἔδωκαν δόξαν
  choice: dâng vinh quang
  rationale: Giữ thành ngữ Kinh Thánh về việc quy vinh quang cho Đức Chúa Trời; “dâng” tự nhiên và trang trọng hơn lối dịch máy móc “đưa/cho” trong tiếng Việt.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: cho Đức Chúa Trời của trời
  rationale: Giữ cấu trúc danh hiệu “Đức Chúa Trời của trời” trong nguyên văn, thay vì đổi thành “Đức Chúa Trời ở trên trời”, vốn có thể làm yếu đi sắc thái danh hiệu.
theological_decisions:
- issue: Phản ứng của “những người còn lại” có phải là sự ăn năn hoặc đức tin cứu rỗi hay không
  choice: Chỉ nói họ “trở nên kinh hãi và dâng vinh quang cho Đức Chúa Trời của trời”.
  alternative: Diễn giải rằng họ thật lòng ăn năn, hoặc rằng họ chỉ miễn cưỡng thừa nhận quyền năng của Đức Chúa Trời.
  rationale: Nguyên văn xác nhận sự kinh hãi và hành động dâng vinh quang, nhưng không định rõ phẩm chất thuộc linh bên trong của phản ứng ấy. Bản dịch vì thế giữ nguyên sự căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể dồn dập của văn khải huyền, tránh từ cổ và không thêm cách giải thích giáo phái.
