id: REV.11.14
reference: Revelation 11:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: vi
  text: Tai họa thứ hai đã qua. Kìa, tai họa thứ ba đang đến mau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “sắp đến”. Từ Hy Lạp ταχύ có thể nhấn mạnh sự gần kề về thời gian hoặc tốc độ xảy đến.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: tai họa
  rationale: Trong câu này, οὐαί được danh từ hóa và được đánh số trong chuỗi ba tai họa. “Tai họa” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại, đồng thời giữ sắc thái bi thương và điềm báo về sự hủy diệt.
- source_word: δευτέρα
  choice: thứ hai
  rationale: Số thứ tự trực tiếp xác định tai họa trong chuỗi và được chuyển dịch thẳng.
- source_word: ἀπῆλθεν
  choice: đã qua
  rationale: Dạng aorist của ἀπέρχομαι diễn tả việc tai họa thứ hai đã rời đi hoặc kết thúc; “đã qua” là cách nói tự nhiên trong ngữ cảnh một giai đoạn tai họa đã hoàn tất.
- source_word: ἰδού
  choice: kìa
  rationale: “Kìa” thu hút sự chú ý tức thời và giữ giọng trang trọng, tiên tri của ἰδού mà vẫn tự nhiên trong tiếng Việt.
- source_word: τρίτη
  choice: thứ ba
  rationale: Số thứ tự trực tiếp xác định tai họa tiếp theo và được chuyển dịch thẳng.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Cách dịch này giữ tính sống động của thì hiện tại Hy Lạp và diễn tả tai họa đang tiến đến, không thêm ý chắc chắn rằng nó đã cận kề hơn mức nguyên văn.
- source_word: ταχύ
  choice: mau
  rationale: ταχύ có thể chỉ sự gần kề về thời gian hoặc tốc độ, sự đột ngột. “Mau” giữ được tính cấp bách và phần nào bảo tồn cả hai sắc thái, thay vì ấn định một lịch trình cánh chung cụ thể.
theological_decisions:
- issue: Cách dịch ταχύ trong bối cảnh cánh chung
  choice: mau
  alternative: sắp đến
  rationale: Nguyên ngữ có thể nhấn mạnh tai họa đến trong tương lai gần hoặc đến nhanh, đột ngột. “Mau” giữ sự căng thẳng giữa hai khả năng; chú thích nêu cách hiểu thiên về sự gần kề thời gian mà không buộc câu chính phải giải quyết vấn đề đang còn hàm hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách bằng dấu chấm để lời báo “Kìa” có sức nhấn tự nhiên trong tiếng Việt. “Tai họa” được dùng nhất quán như một danh từ có thể đánh số trong chuỗi khải huyền.
