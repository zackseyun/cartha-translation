id: REV.11.12
reference: Revelation 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: vi
  text: 'Rồi họ nghe một tiếng lớn từ trời phán với họ: “Hãy lên đây!” Họ lên trời trong đám mây[a], và các kẻ thù của họ nhìn thấy họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một đám mây.” Tiếng Hy Lạp viết “trong đám mây,” có thể gợi lại những cảnh Kinh Thánh trong đó đám mây biểu thị sự hiện diện và sự minh oan của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: họ nghe
  rationale: Động từ aorist chỉ sự kiện họ nghe tiếng từ trời, không nhấn mạnh hành động chăm chú lắng nghe.
- source_word: φωνῆς μεγάλης
  choice: một tiếng lớn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt cường độ và tính uy nghiêm của tiếng nói.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Trong bối cảnh khải tượng và lời phán thần thượng của sách Khải Huyền, οὐρανός chỉ cõi trời hơn là bầu trời vật lý.
- source_word: λεγούσης αὐτοῖς
  choice: phán với họ
  rationale: Phân từ bổ nghĩa cho tiếng nói; “phán” phù hợp với tiếng phát ra từ trời, còn “với họ” giữ rõ αὐτοῖς.
- source_word: Ἀνάβατε ὧδε
  choice: Hãy lên đây!
  rationale: Giữ mệnh lệnh số nhiều và hướng đi lên của ἀναβαίνω, đồng thời diễn đạt tự nhiên chỉ từ ὧδε.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: họ lên trời
  rationale: Diễn đạt gọn, tự nhiên và giữ chuyển động hướng lên cõi trời mà không dùng thuật ngữ thần học chuyên biệt.
- source_word: ἐν τῇ νεφέλῃ
  choice: trong đám mây
  rationale: Giữ mạo từ xác định của nguyên văn và để ngỏ khả năng ám chỉ đám mây biểu thị sự hiện diện và minh oan của Đức Chúa Trời.
- source_word: ἐθεώρησαν
  choice: nhìn thấy
  rationale: Trong tiếng Việt, “nhìn thấy” tự nhiên và có thể biểu thị việc tận mắt chứng kiến; tránh “theo dõi,” vốn dễ gợi ý theo dõi diễn tiến kéo dài.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: các kẻ thù của họ
  rationale: Giữ quan hệ sở hữu và sự xác định của nhóm người thù nghịch với hai nhân chứng.
theological_decisions:
- issue: Khả năng ám chỉ thần học trong cụm “đám mây”
  choice: Giữ “trong đám mây” ở chính văn
  alternative: trong một đám mây
  rationale: Nguyên văn có mạo từ xác định; cách dịch này bảo tồn khả năng liên hệ với mô-típ Kinh Thánh về đám mây của sự hiện diện và sự minh oan thần thượng mà không khẳng định dứt khoát ám chỉ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rồi” nối tự nhiên với diễn tiến khải tượng; “phán” phù hợp nguồn tiếng từ trời. Dấu chấm than thể hiện sức thúc giục của mệnh lệnh mà không thêm từ ngoài nguyên văn.
