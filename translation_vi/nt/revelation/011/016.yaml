id: REV.11.16
reference: Revelation 11:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: vi
  text: Hai mươi bốn vị trưởng lão đang ngồi trước mặt Đức Chúa Trời, trên các ngai của họ, ngã sấp mặt xuống và thờ phượng Đức Chúa Trời,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: hai mươi bốn vị trưởng lão
  rationale: “Trưởng lão” là cách gọi quen thuộc dành cho các nhân vật thuộc hội đồng thiên thượng trong sách Khải Huyền; từ “vị” giữ sắc thái tôn kính và tự nhiên trong tiếng Việt.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt rõ vị trí và sự hiện diện trước Đức Chúa Trời, đồng thời phù hợp với văn phong trang trọng của khung cảnh ngai trời.
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: đang ngồi trên ngai của mình
  rationale: Phân từ hiện tại diễn tả tư thế đang tiếp diễn; “ngai” là từ tự nhiên, trang trọng cho θρόνος. “Của mình” quy chiếu chung đến ngai tương ứng của mỗi trưởng lão.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: liền sấp mặt xuống
  rationale: Giữ hình ảnh phủ phục cụ thể của nguyên văn; “liền” giúp chuyển tự nhiên từ tư thế ngồi sang hành động chính mà không thêm nội dung giải thích.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: thờ phượng Đức Chúa Trời
  rationale: Vì đối tượng là Đức Chúa Trời trong khung cảnh phụng thờ trên trời, động từ mang nghĩa tôn giáo rõ ràng, không chỉ là cúi lạy xã giao.
- source_word: θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, phổ biến và dễ hiểu để chỉ Đức Chúa Trời trong Kinh Thánh.
theological_decisions:
- issue: Sắc thái của προσκυνέω trong khung cảnh phụng thờ thiên thượng
  choice: thờ phượng
  alternative: cúi lạy; phủ phục trước
  rationale: Đối tượng trực tiếp là Đức Chúa Trời và bối cảnh là quang cảnh ngai trời, nên “thờ phượng” truyền đạt đúng trọng tâm tôn giáo của hành động; tư thế phủ phục đã được diễn tả riêng bằng “sấp mặt xuống”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ trật tự mô tả các trưởng lão, vị trí trước Đức Chúa Trời, tư thế trên ngai, rồi hành động phủ phục và thờ phượng. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp nối sang lời nói ở câu sau.
