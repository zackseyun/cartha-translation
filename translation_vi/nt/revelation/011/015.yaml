id: REV.11.15
reference: Revelation 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: vi
  text: 'Và thiên sứ thứ bảy thổi kèn; trên trời vang lên những tiếng nói lớn, nói rằng: “Vương quốc[a] của thế gian đã trở thành vương quốc của Chúa chúng ta và của Đấng Mê-si[b] của Ngài; Ngài sẽ trị vì đời đời vô cùng.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép “các vương quốc của thế gian đã trở thành” hoặc “vương quốc của thế gian này đã trở thành.” Bản SBLGNT chép ở số ít: “vương quốc của thế gian.”'
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “Đấng Ki-tô.” Từ Hy Lạp Χριστός ở đây được dịch là “Đấng Mê-si” để giữ rõ nghĩa tước hiệu.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hy Lạp là “cho đến các thời đại của các thời đại,” một thành ngữ chỉ thời gian không bao giờ chấm dứt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Động từ σαλπίζω chỉ hành động làm cho kèn vang lên; “thổi kèn” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: φωναὶ μεγάλαι
  choice: những tiếng lớn
  rationale: φωνή có thể là tiếng, giọng nói hoặc tiếng kêu. Vì theo sau là “nói rằng”, cụm này chỉ những tiếng có lời; “những tiếng lớn” giữ được sắc thái của μεγάλαι mà không xác định thêm người nói.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Trong ngữ cảnh Khải Huyền, οὐρανός chỉ cõi trời; “trên trời” là cách nói tự nhiên trong tiếng Việt.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Vương quốc của thế gian đã trở thành
  rationale: Bản SBLGNT dùng βασιλεία ở số ít. “Đã trở thành” diễn đạt ἐγένετο như một thực tại được công bố là đã xảy ra.
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: của Chúa chúng ta và của Đấng Mê-si thuộc về Ngài
  rationale: Lặp lại “của” làm rõ cấu trúc sở hữu. “Đấng Mê-si” giữ Χριστός như một tước hiệu; “thuộc về Ngài” diễn đạt αὐτοῦ mà không đổi quan hệ sở hữu thành một tên riêng.
- source_word: καὶ βασιλεύσει
  choice: Ngài sẽ trị vì
  rationale: Động từ βασιλεύσει ở ngôi thứ ba số ít. Đại từ số ít giữ nguyên sự cô đọng và không giải quyết dứt khoát tiền ngữ mà câu Hy Lạp để ngỏ.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Đây là thành ngữ chỉ thời gian không chấm dứt; “đời đời vô cùng” là cách diễn đạt trang trọng, quen thuộc và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Ở đây Χριστός rõ ràng là một tước hiệu trong cụm “Đấng Mê-si thuộc về Ngài”, nên “Đấng Mê-si” giữ được ý nghĩa tước hiệu của từ Hy Lạp.
- issue: Chủ thể của βασιλεύσει
  choice: Ngài sẽ trị vì
  alternative: Chúa và Đấng Mê-si của Ngài sẽ trị vì
  rationale: Động từ Hy Lạp ở số ít, vì vậy không nên chuyển thành chủ thể số nhiều. “Ngài” giữ sự cô đọng và độ mơ hồ thực sự về tiền ngữ của đại từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lời công bố được giữ cô đọng; bản dịch tránh xác định rõ hơn nguyên văn về chủ thể số ít của hành động trị vì.
