id: REV.11.10
reference: Revelation 11:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: vi
  text: Những người sống trên đất vui mừng vì họ và ăn mừng, rồi sẽ gửi quà cho nhau, vì hai nhà tiên tri này đã gây khổ sở cho những người sống trên đất.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: những người sống trên đất
  rationale: Giữ sắc thái động từ của cấu trúc phân từ và có thể lặp lại tự nhiên ở cả hai vị trí; trong sách Khải Huyền, đây còn là một cách diễn đạt thường dùng về cộng đồng trần thế chống nghịch Đức Chúa Trời.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: vui mừng về cái chết của họ
  rationale: ἐπ’ αὐτοῖς chỉ đối tượng hoặc nguyên cớ của niềm vui. Ngữ cảnh ngay trước đó nói rõ hai nhân chứng đã chết, nên bổ sung “cái chết” giúp câu tiếng Việt rõ và tự nhiên mà không thay đổi ý.
- source_word: εὐφραίνονται
  choice: ăn mừng
  rationale: Diễn đạt niềm vui mang tính lễ hội, đồng thời phân biệt tự nhiên với χαίρουσιν; “ăn mừng” là cách nói hiện đại và không cổ kính.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: sẽ gửi quà cho nhau
  rationale: Giữ thì tương lai của πέμψουσιν và ý nghĩa trực tiếp của việc gửi quà cho nhau, không diễn giải thành “trao đổi quà”.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: hai nhà tiên tri này
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ đầy đủ từ chỉ định và số lượng.
- source_word: ἐβασάνισαν
  choice: đã làm khổ
  rationale: Truyền đạt tác động gây đau khổ hoặc thống khổ mạnh mẽ trong ngữ cảnh. “Làm khổ” tự nhiên hơn “hành hạ” khi chưa xác định phương thức trực tiếp, nhưng không làm nhẹ ý của bản Hy Lạp.
theological_decisions:
- issue: Cách dịch cụm từ lặp lại trong Khải Huyền chỉ cộng đồng trần thế chống nghịch Đức Chúa Trời
  choice: những người sống trên đất
  alternative: cư dân trên đất
  rationale: Cách chọn giữ cấu trúc mang tính động từ và sự lặp lại của nguyên văn, không đưa ý nghĩa thần học hàm ẩn vào thẳng bản văn.
- issue: Mức độ tác động của hai nhà tiên tri
  choice: đã làm khổ
  alternative: đã hành hạ
  rationale: βασανίζω có cường độ mạnh, nhưng ở đây có thể bao gồm nỗi thống khổ do lời chứng và các tai họa gây ra chứ không nhất thiết là hành vi tra tấn trực tiếp. “Làm khổ” giữ được phạm vi nghĩa đó mà không giải quyết quá mức cách thức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ sự lặp lại có chủ ý của “những người sống trên đất” và nhịp tiến triển từ vui mừng, ăn mừng đến gửi quà.
