review_pass:
  verdict: revise
  source_fidelity: Bản nháp thêm cụm “cái chết” vào chỗ ἐπ’ αὐτοῖς. Dù cái chết của hai nhân chứng là ngữ cảnh trực tiếp, câu Hy Lạp chỉ nói họ vui mừng ‘vì/về’ hai nhà tiên tri; không nên nêu rõ nguyên cớ ấy trong bản văn. Các thành phần khác, gồm thì tương lai của ‘sẽ gửi’, sự lặp lại của ‘những người sống trên đất’, và số lượng ‘hai nhà tiên tri’, được phản ánh đúng.
  naturalness: 'Câu sửa vẫn là tiếng Việt tiêu chuẩn, rõ ràng và giữ được nhịp liệt kê tăng tiến: vui mừng, ăn mừng, gửi quà. “Vui mừng vì họ” tự nhiên hơn việc thêm lời giải thích, đồng thời cho phép ngữ cảnh làm rõ đối tượng/nguyên cớ của niềm vui.'
  terminology: “Những người sống trên đất” nhất quán cho οἱ κατοικοῦντες ἐπὶ τῆς γῆς. “Ăn mừng” phân biệt hợp lý với “vui mừng”. “Đã gây khổ sở cho” diễn đạt cường độ của ἐβασάνισαν mà không nhất thiết giới hạn động từ vào hành vi tra tấn trực tiếp.
  issues:
  - severity: medium
    issue: Thêm “cái chết” sau “vui mừng về”.
    rationale: Cụm ἐπ’ αὐτοῖς quy chiếu đến hai nhà tiên tri, chứ không nêu danh từ ‘cái chết’ trong chính câu này. Ngữ cảnh có thể gợi điều đó, nhưng bản dịch tối ưu-tương-đương không nên đưa chi tiết ngữ cảnh vào mệnh đề khi nguyên văn không nói rõ.
  revised_text: Những người sống trên đất vui mừng vì họ và ăn mừng, rồi sẽ gửi quà cho nhau, vì hai nhà tiên tri này đã gây khổ sở cho những người sống trên đất.
