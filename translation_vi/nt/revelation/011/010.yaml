revisions:
- from: Những người sống trên đất vui mừng về cái chết của họ và ăn mừng, rồi sẽ gửi quà cho nhau, vì hai nhà tiên tri này đã làm khổ những người sống trên đất.
  to: Những người sống trên đất vui mừng vì họ và ăn mừng, rồi sẽ gửi quà cho nhau, vì hai nhà tiên tri này đã gây khổ sở cho những người sống trên đất.
  rationale: Chỉ bỏ phần bổ sung không có trong nguyên văn là “cái chết”, thay bằng cách diễn đạt tự nhiên giữ quan hệ ngữ nghĩa mở của ἐπ’ αὐτοῖς. Đồng thời điều chỉnh “đã làm khổ” thành “đã gây khổ sở cho” để phản ánh rõ hơn sức nặng của βασανίζω mà không áp đặt một phương thức gây khổ cụ thể.
