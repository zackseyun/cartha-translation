id: REV.11.9
reference: Revelation 11:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: vi
  text: Một số người từ các dân tộc, các bộ tộc, các ngôn ngữ và các nước nhìn thi thể của họ trong ba ngày rưỡi[a], và họ không cho phép các thi thể của họ được đặt vào phần mộ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp trước hết dùng “thi thể của họ” ở số ít, rồi dùng “các thi thể của họ” ở số nhiều. Số ít có thể trình bày hai chứng nhân như một thực thể chung trước khi chuyển lại sang các thi thể riêng của họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: nhìn
  rationale: Giữ hành động thị giác trực tiếp và sắc thái hiện tại sống động của động từ; “nhìn” tự nhiên hơn “chiêm ngắm” trong văn cảnh.
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: một số người thuộc các dân, các bộ tộc, các ngôn ngữ và các nước
  rationale: “Một số người thuộc” diễn đạt rõ nghĩa bộ phận của ἐκ; bốn nhóm được giữ riêng theo công thức liệt kê của Khải Huyền.
- source_word: λαῶν
  choice: các dân
  rationale: Giữ số nhiều và ý nghĩa các cộng đồng dân cư riêng biệt.
- source_word: φυλῶν
  choice: các bộ tộc
  rationale: Cách dịch chuẩn, rõ nghĩa cho các nhóm huyết tộc hoặc sắc tộc trong danh sách này.
- source_word: γλωσσῶν
  choice: các ngôn ngữ
  rationale: Trong công thức chỉ các cộng đồng nhân loại, từ này mang nghĩa hoán dụ là những nhóm ngôn ngữ; cách dịch sát giúp giữ cấu trúc nguyên văn.
- source_word: ἐθνῶν
  choice: các nước
  rationale: Phù hợp với công thức phổ quát của Khải Huyền và tránh thu hẹp nghĩa thành “dân ngoại”.
- source_word: τὸ πτῶμα αὐτῶν
  choice: thi thể chung của họ
  rationale: Từ “chung” giúp tiếng Việt biểu đạt số ít bất thường của πτῶμα dù đại từ chỉ hai chứng nhân, thay vì âm thầm đổi thành số nhiều.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: suốt ba ngày rưỡi
  rationale: Diễn đạt tự nhiên đối cách chỉ khoảng thời gian và giữ nguyên thời hạn khải huyền.
- source_word: τὰ πτώματα αὐτῶν
  choice: các thi thể của họ
  rationale: Giữ sự chuyển sang số nhiều trong mệnh đề thứ hai và nói rõ đây là những thi thể.
- source_word: οὐκ ἀφίουσιν
  choice: không cho phép
  rationale: Ở đây ἀφίημι mang nghĩa cho phép, không phải tha thứ hay rời bỏ.
- source_word: τεθῆναι εἰς μνῆμα
  choice: được đặt vào phần mộ
  rationale: Giữ hình ảnh cụ thể là đặt thi thể vào nơi an táng, thay vì khái quát thành “được chôn”.
theological_decisions:
- issue: Số ít πτῶμα trong mệnh đề đầu đối lập với số nhiều πτώματα trong mệnh đề sau
  choice: Giữ sự chuyển đổi bằng “thi thể chung của họ” rồi “các thi thể của họ”
  alternative: Dịch cả hai chỗ ở số nhiều là “các thi thể của họ” để câu văn trôi chảy hơn
  rationale: Nguyên văn chủ ý hoặc ít nhất thực sự có sự không tương hợp số; bản dịch không nên xóa đi. “Thi thể chung” cho phép độc giả nhận ra hai chứng nhân trước hết được nhìn như một chứng tá tập thể, rồi lại được nói đến như các cá nhân, nhưng chú thích không khẳng định đây là cách giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thi thể” giữ sắc thái nghiêm túc; “phần mộ” tự nhiên hơn lối cổ “mồ mả”. Cụm “thi thể chung” hơi khác thường nhưng cần thiết để làm lộ rõ nét số ít của nguyên văn, đồng thời chú thích giải thích sự chuyển đổi.
