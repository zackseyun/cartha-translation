  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng ý nghĩa bộ phận của ἐκ ("một số người thuộc/từ"), chuỗi bốn nhóm người, thời lượng ba ngày rưỡi, và việc không cho chôn cất. Tuy nhiên, "thi thể chung" thêm một cách giải thích trực tiếp vào bản văn: số ít πτῶμα có thể được giữ bằng "thi thể của họ" mà không khẳng định tính “chung”. "Suốt" cũng dễ gợi ý hành động nhìn diễn ra không gián đoạn, mạnh hơn đối cách chỉ thời lượng trong tiếng Hy Lạp.'
  naturalness: '"Thi thể chung của họ" không tự nhiên trong tiếng Việt hiện đại và gây cảm giác giải thích hơn là dịch. "Một số người từ các dân tộc, các bộ tộc, các ngôn ngữ và các nước" là cách diễn đạt mạch lạc hơn; trong công thức Khải Huyền, "các ngôn ngữ" có thể được hiểu hoán dụ cho các cộng đồng ngôn ngữ. "Trong ba ngày rưỡi" biểu đạt trung tính khoảng thời gian.'
  terminology: '"Thi thể", "bộ tộc", và "phần mộ" phù hợp văn phong trang trọng hiện đại. Dịch λαῶν là "các dân tộc" giúp phân biệt rõ với ἐθνῶν là "các nước" trong tiếng Việt. Chú thích nên mô tả biến đổi số ít/số nhiều mà không đưa cách giải thích tập thể vào chính văn.'
