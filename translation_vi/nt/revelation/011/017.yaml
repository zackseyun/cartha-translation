id: REV.11.17
reference: Revelation 11:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: vi
  text: 'nói rằng: “Chúng con cảm tạ Ngài, lạy Chúa là Đức Chúa Trời, Đấng Toàn Năng, Đấng hiện hữu và đã hiện hữu[a], vì Ngài đã nắm lấy quyền năng lớn lao của Ngài và bắt đầu trị vì[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng đang hiện hữu và Đấng đã hiện hữu.” Một số bản chép tay và bản dịch ở những chỗ khác trong sách Khải Huyền có thêm “và Đấng sẽ đến,” nhưng bản Hy Lạp tại đây không có cụm từ ấy.'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “đã trị vì” hoặc “đã trở thành Vua.” Động từ Hy Lạp có thể nhấn mạnh sự khởi đầu hoặc việc thực thi quyền cai trị; tại đây, có lẽ câu này nhấn mạnh sự biểu lộ công khai vương quyền của Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: nói rằng
  rationale: Phân từ hiện tại chủ động số nhiều, nối lời của các trưởng lão với câu trước; “nói rằng” tự nhiên trong tiếng Việt và dẫn vào nội dung phát biểu.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Chúng con cảm tạ Ngài
  rationale: Diễn đạt hành động dâng lời cảm tạ trong bối cảnh thờ phượng. Đại từ “chúng con” phù hợp khi những người thờ phượng cùng thưa với Đức Chúa Trời, còn “Ngài” giữ sắc thái tôn kính.
- source_word: κύριε, ὁ θεός
  choice: lạy Chúa là Đức Chúa Trời
  rationale: Giữ lời xưng hô trực tiếp và quan hệ đồng vị giữa “Chúa” và “Đức Chúa Trời”; từ “lạy” thể hiện tự nhiên ngữ khí hô cách trang trọng trong tiếng Việt.
- source_word: ὁ παντοκράτωρ
  choice: Đấng Toàn Năng
  rationale: Danh hiệu thần linh quen thuộc, chính xác và trang trọng, diễn tả Đấng có mọi quyền năng.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: Đấng hiện có và đã có
  rationale: Giữ hai mốc hiện tại và quá khứ của công thức danh xưng, đồng thời không bổ sung vế “sẽ đến” vốn không có trong bản Hy Lạp ở câu này.
- source_word: ὅτι
  choice: vì
  rationale: 'Dùng theo nghĩa nguyên nhân: lời cảm tạ được dâng lên vì hành động của Đức Chúa Trời.'
- source_word: εἴληφας
  choice: Ngài đã nắm lấy
  rationale: Thể hoàn thành của λαμβάνω chỉ hành động đã xảy ra và còn hiệu lực; “nắm lấy” giữ hình ảnh chủ động tiếp nhận hoặc vận dụng quyền năng.
- source_word: τὴν δύναμίν σου τὴν μεγάλην
  choice: quyền năng lớn lao của Ngài
  rationale: Giữ nghĩa trực tiếp của δύναμις và tính từ μεγάλη, với trật tự từ tự nhiên trong tiếng Việt.
- source_word: ἐβασίλευσας
  choice: bắt đầu trị vì
  rationale: Thể bất định có thể nhấn mạnh việc bước vào hoặc biểu lộ quyền cai trị. Cách dịch này phù hợp ngữ cảnh về sự trị vì được thể hiện cách quyết định, nhưng không hàm ý Đức Chúa Trời trước đó hoàn toàn không có chủ quyền.
theological_decisions:
- issue: Công thức danh xưng thần linh không có vế “Đấng sẽ đến”
  choice: Đấng hiện có và đã có
  alternative: Đấng hiện có, đã có và sẽ đến
  rationale: Bản Hy Lạp SBLGNT tại đây chỉ có ὁ ὢν καὶ ὁ ἦν. Bản dịch không hòa đồng câu này với các công thức dài hơn ở nơi khác trong sách Khải Huyền.
- issue: Sắc thái của ἐβασίλευσας đối với vương quyền của Đức Chúa Trời
  choice: bắt đầu trị vì
  alternative: đã trị vì; đã trở thành Vua
  rationale: Ngữ cảnh ca ngợi sự biểu lộ quyết định của quyền cai trị. “Bắt đầu trị vì” truyền đạt sắc thái khởi phát có thể có của động từ mà không chủ ý phủ nhận chủ quyền vốn có của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mang sắc thái phụng thờ. Cấu trúc lời xưng hô được giữ rõ nhưng sắp xếp tự nhiên theo tiếng Việt. Các danh hiệu “Đức Chúa Trời,” “Đấng Toàn Năng” và đại từ “Ngài” được viết hoa theo thông lệ Kinh Thánh tiếng Việt.
