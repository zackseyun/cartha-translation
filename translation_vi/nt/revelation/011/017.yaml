  terminology: “Đức Chúa Trời,” “Đấng Toàn Năng,” “Ngài,” và “trị vì” nhất quán với văn phong Kinh Thánh tiếng Việt. “Bắt đầu trị vì” là một cách diễn đạt có thể chấp nhận để phản ánh sắc thái khởi phát của aorist, đồng thời không thêm vế “sẽ đến” không có trong SBLGNT.
