  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: lời nói tiếp từ câu trước, lời cảm tạ, chuỗi danh hiệu dành cho Đức Chúa Trời, lý do cảm tạ, và sắc thái khởi phát có thể có của ἐβασίλευσας. Tuy nhiên, “Đấng hiện có và đã có” không chuyển tải tự nhiên công thức ὁ ὢν καὶ ὁ ἦν trong tiếng Việt; đặc biệt “đã có” có thể bị hiểu là từng sở hữu điều gì đó, thay vì “đã hiện hữu.”'
