id: REV.11.5
reference: Revelation 11:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: vi
  text: Nếu ai muốn làm hại họ, thì lửa từ miệng họ phun ra và thiêu nuốt kẻ thù của họ. Nếu ai muốn làm hại họ, thì người ấy phải bị giết như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: làm hại
  rationale: Trong ngữ cảnh khải huyền này, động từ chỉ hành động thù địch chống lại hai nhân chứng; “làm hại” tự nhiên, rõ nghĩa và không quy định quá mức cách thức tấn công.
- source_word: πῦρ
  choice: lửa
  rationale: Giữ nguyên hình ảnh cụ thể, sống động của nguyên bản thay vì diễn giải thành lời phán xét hay một biểu tượng nào đó.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: từ miệng họ phun ra
  rationale: “Phun ra” diễn đạt tự nhiên hướng chuyển động của lửa từ miệng, đồng thời giữ danh từ số ít “miệng” đi với chủ thể số nhiều như nguyên bản Hy Lạp.
- source_word: κατεσθίει
  choice: thiêu nuốt
  rationale: “Thiêu nuốt” vừa giữ sức mạnh của động từ mang nghĩa nuốt sạch/tiêu diệt, vừa phù hợp tự nhiên với chủ thể là lửa.
- source_word: ἐχθροὺς
  choice: kẻ thù
  rationale: Cách dịch thông dụng, trực tiếp cho những người thù địch với hai nhân chứng.
- source_word: θέλει / θελήσῃ
  choice: muốn
  rationale: Tiếng Việt không cần đánh dấu riêng sự khác biệt giữa hiện tại chỉ định và bất định quá khứ trong hai mệnh đề điều kiện; lặp lại “muốn” giữ ý nghĩa mà vẫn tự nhiên.
- source_word: οὕτως
  choice: theo cách đó
  rationale: Chỉ ngược về cách thức vừa được mô tả, không quyết định thêm lửa phải được hiểu theo nghĩa đen hay biểu tượng.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt rõ tính tất yếu của nguyên bản mà không thêm căn nguyên thần học cho sự tất yếu ấy.
- source_word: ἀποκτανθῆναι
  choice: bị giết
  rationale: Giữ thể bị động và ý nghĩa trực tiếp bằng lối nói hiện đại, không cổ kính.
theological_decisions:
- issue: Nên giữ nguyên hay diễn giải hình ảnh lửa từ miệng
  choice: 'Giữ hình ảnh như nguyên bản: “lửa từ miệng họ phun ra.”'
  alternative: Diễn giải là lời phán xét hoặc quyền năng hủy diệt phát ra từ họ.
  rationale: Bản văn trình bày trực tiếp một hình ảnh khải huyền; bản dịch không nên quyết định thay người đọc rằng hình ảnh ấy là nghĩa đen hay biểu tượng.
- issue: Sắc thái tất yếu trong δεῖ
  choice: Dịch là “phải bị giết.”
  alternative: Diễn giải rõ thành một mệnh lệnh hay sự định trước của Đức Chúa Trời.
  rationale: “Phải” bảo toàn sức nặng của sự tất yếu nhưng không thêm tác nhân hay hệ thống thần học mà câu Hy Lạp không nêu rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc điều kiện lặp lại của nguyên bản. Dùng “miệng họ” ở số ít để phản ánh στόματος số ít với sở hữu từ số nhiều; trong tiếng Việt cách nói này vẫn chấp nhận được nên không cần chú thích. Không có dấu chú thích trong câu vì bản thảo không kèm chú thích.
