id: REV.11.11
reference: Revelation 11:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: vi
  text: Sau ba ngày rưỡi ấy, sinh khí từ Đức Chúa Trời[a] nhập vào họ; họ đứng dậy trên đôi chân mình, và nỗi sợ hãi lớn ập xuống những người đang quan sát họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thần linh sự sống từ Đức Chúa Trời”; hoặc có thể hiểu là “Thần Linh sự sống từ Đức Chúa Trời.” Từ Hy Lạp πνεῦμα có thể có nghĩa là hơi thở, thần linh hoặc Thần Linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: Sau ba ngày rưỡi ấy
  rationale: μετά với đối cách chỉ thời gian tiếp sau. Từ “ấy” diễn đạt tính xác định của mạo từ và liên kết tự nhiên với khoảng thời gian đã được nêu trong văn cảnh.
- source_word: πνεῦμα ζωῆς
  choice: sinh khí
  rationale: πνεῦμα có thể chỉ hơi thở, khí hoặc linh; trong cảnh phục sinh này, “sinh khí” diễn đạt luồng khí ban sự sống và gợi âm hưởng Ê-xê-chi-ên 37 mà không đồng nhất rõ ràng với Đức Thánh Linh.
- source_word: ἐκ τοῦ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: Diễn đạt tự nhiên nguồn gốc thần linh của sinh khí; “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong tiếng Việt Kinh Thánh.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: nhập vào họ
  rationale: Diễn đạt sự đi vào bên trong một cách gọn và tự nhiên, phù hợp với hình ảnh sinh khí làm cho họ sống lại.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: họ đứng dậy trên đôi chân mình
  rationale: Dạng động từ mang nghĩa nội động ở đây. “Đứng dậy” làm rõ sự chuyển từ trạng thái nằm chết sang đứng, còn “trên đôi chân mình” giữ hình ảnh cụ thể của nguyên văn.
- source_word: φόβος μέγας
  choice: nỗi sợ hãi lớn
  rationale: Giữ mức độ mạnh của μέγας nhưng không diễn giải quá mức thành kinh hoàng hay hoảng loạn.
- source_word: ἐπέπεσεν ἐπὶ
  choice: ập xuống trên
  rationale: Giữ hình ảnh sống động của điều gì đó bất ngờ giáng xuống hoặc bao trùm người chứng kiến.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: những người đang nhìn họ
  rationale: Thể hiện sắc thái tiếp diễn của phân từ và hành động quan sát trực tiếp, bằng cách nói hiện đại, dễ hiểu.
theological_decisions:
- issue: πνεῦμα ζωῆς là sinh khí ban sự sống hay được xác định rõ là Đức Thánh Linh
  choice: sinh khí từ Đức Chúa Trời
  alternative: một linh sự sống từ Đức Chúa Trời; Thần ban sự sống từ Đức Chúa Trời
  rationale: Nguyên văn xác nhận nguồn gốc từ Đức Chúa Trời nhưng không minh nhiên đồng nhất πνεῦμα với Đức Thánh Linh. Bản chính giữ hình ảnh hơi thở/sinh khí trong cảnh phục sinh, còn chú thích bảo lưu các khả năng nghĩa khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể dồn dập của ba mệnh đề nối tiếp trong nguyên văn. “Sinh khí” được chọn để vừa tự nhiên trong tiếng Việt vừa bảo lưu sự mơ hồ của πνεῦμα qua chú thích.
