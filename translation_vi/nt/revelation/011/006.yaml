  verdict: revise
  source_fidelity: Bản dịch truyền đạt chính xác hai phạm vi thẩm quyền và các hành động được nêu trong câu. Tuy nhiên, “Hai người ấy” thêm số từ không được lặp lại trong οὗτοι ở câu này, dù phù hợp với văn cảnh. “Trên các nguồn nước” cũng kém tự nhiên khi diễn tả phạm vi thẩm quyền.
  naturalness: Văn phong nhìn chung hiện đại, rõ ràng. “Đối với các nguồn nước” tự nhiên hơn “trên các nguồn nước”; đặt trạng ngữ thời gian gần mệnh đề mưa giúp quan hệ nghĩa sáng rõ hơn.
  terminology: “Thẩm quyền,” “bầu trời,” “biến ... thành máu,” và “mọi tai họa” đều phù hợp. Chú thích hiện có nêu một cách diễn đạt khả dĩ cho cụm thời gian, nhưng bỏ qua điểm mơ hồ từ vựng nổi bật của οὐρανός (“bầu trời/trời”) và không tương ứng với chú thích của vệt kiểm tra tiếng Anh.
