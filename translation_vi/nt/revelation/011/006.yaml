id: REV.11.6
reference: Revelation 11:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: vi
  text: Những người này có thẩm quyền đóng bầu trời lại, để trong những ngày họ nói tiên tri, mưa không rơi xuống[a]. Họ cũng có thẩm quyền đối với các nguồn nước, biến chúng thành máu và giáng mọi tai họa xuống đất, bao nhiêu lần tùy ý.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đóng trời lại”. Từ Hy Lạp có thể chỉ “trời” hoặc “bầu trời”; ở đây chọn “bầu trời” vì ngữ cảnh nói đến mưa.
    reason: Lựa chọn từ vựng
lexical_decisions:
- source_word: οὗτοι
  choice: Hai người ấy
  rationale: Đại từ chỉ định quy chiếu trực tiếp đến hai nhân chứng ở văn cảnh trước. Tiếng Việt cần nêu danh ngữ tự nhiên hơn; việc thêm “hai người” làm rõ đối tượng mà không thay đổi nội dung văn cảnh.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Diễn đạt quyền được ban hoặc quyền hành xử, thay vì chỉ khả năng hay sức mạnh thuần túy.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: đóng bầu trời lại
  rationale: οὐρανός có thể là “trời/thiên đàng” hoặc “bầu trời”; ngữ cảnh mưa khiến “bầu trời” là nghĩa tự nhiên nhất, còn “đóng ... lại” giữ hình ảnh mạnh của κλεῖσαι.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: để mưa không rơi xuống
  rationale: Giữ quan hệ mục đích/kết quả của ἵνα và diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: trong những ngày họ nói tiên tri
  rationale: Cụm Hy Lạp chỉ thời kỳ họ thực hiện hoạt động tiên tri; cách diễn đạt bằng động từ rõ nghĩa và tự nhiên hơn “những ngày lời tiên tri của họ”.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: trên các nguồn nước
  rationale: ἐπί với ἐξουσία biểu thị phạm vi quyền hành. Dạng số nhiều τῶν ὑδάτων được thể hiện bằng “các nguồn nước”, một cách nói tự nhiên chỉ nước nói chung trong nhiều nơi.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: biến chúng thành máu
  rationale: Giữ trực tiếp hình ảnh biến đổi của στρέφειν ... εἰς và đại từ số nhiều quy chiếu về các nguồn nước.
- source_word: πατάξαι τὴν γῆν
  choice: giáng ... xuống đất
  rationale: πατάσσω mang nghĩa đánh hoặc giáng tai họa; cấu trúc “giáng ... xuống đất” vừa tự nhiên vừa giữ lực tác động của động từ.
- source_word: ἐν πάσῃ πληγῇ
  choice: mọi tai họa
  rationale: ἐν có chức năng chỉ phương tiện; πάσῃ πληγῇ được chuyển sát nghĩa là “mọi tai họa”, không thêm ý “mọi loại” vốn không được nói rõ.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: bao nhiêu lần tùy ý
  rationale: Giữ sắc thái lặp lại và tùy thuộc ý muốn của cấu trúc ὁσάκις ἐάν.
theological_decisions:
- issue: Ngôn ngữ gợi nhắc các phép lạ gắn với Ê-li và Môi-se
  choice: Giữ các hành động kỳ diệu bằng ngôn ngữ trực tiếp, không giải thích theo nghĩa biểu tượng trong bản dịch.
  alternative: Diễn giải các hành động như những biểu tượng hoặc đồng nhất rõ hai nhân chứng với các nhân vật Cựu Ước.
  rationale: Câu văn trình bày đây là thẩm quyền được ban cho các nhân chứng, nhưng không quyết định trong chính câu này các hành động là hoàn toàn theo nghĩa đen, biểu tượng, hay cả hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thẩm quyền” giữ sắc thái quyền được trao; “bầu trời” phù hợp với ngữ cảnh mưa. Nhịp câu được chia thành hai câu để tiếng Việt sáng rõ mà vẫn giữ cấu trúc song hành của nguyên văn.
