id: REV.20.11
reference: Revelation 20:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: vi
  text: Rồi tôi thấy một ngai lớn màu trắng và Đấng ngự trên ngai ấy; đất và trời chạy trốn khỏi sự hiện diện của Ngài[a], và không tìm thấy chỗ nào cho chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát chữ: “khỏi mặt Ngài.”'
    reason: Nêu phương án sát chữ cho ἀπὸ τοῦ προσώπου; chính văn dùng “khỏi sự hiện diện của Ngài” để diễn đạt tự nhiên ý đất và trời chạy trốn khỏi Ngài.
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: một ngai lớn màu trắng
  rationale: Giữ đủ ý về sự lớn lao và màu trắng của ngai, đồng thời dùng trật tự tính từ tự nhiên trong tiếng Việt.
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: Đấng ngự trên ngai ấy
  rationale: “Ngự” phù hợp tự nhiên với hình ảnh ngai và giữ sắc thái trang trọng; “Đấng” không xác định cụ thể nhân vật vượt quá điều câu văn nói.
- source_word: ἀπὸ τοῦ προσώπου
  choice: trước mặt Ngài
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc đất trời chạy khỏi diện kiến của Đấng ngự ngai, đồng thời vẫn gần với nghĩa đen “khỏi mặt” hơn cách diễn giải trừu tượng.
- source_word: ἔφυγεν
  choice: đều trốn đi
  rationale: Giữ hình ảnh nhân cách hóa sống động của động từ φεύγω thay vì diễn giải là “biến mất”; “đều” cho thấy cả đất lẫn trời cùng là chủ thể.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: đất và trời
  rationale: Cặp từ quen thuộc, trang trọng và tự nhiên trong tiếng Việt; “trời” thích hợp với văn cảnh khải huyền hơn “bầu trời”.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: không còn tìm thấy chỗ nào cho chúng
  rationale: Giữ cấu trúc bị động về nghĩa và liên hệ đại từ số nhiều với đất và trời; “không còn” diễn đạt tự nhiên kết quả trong mạch thị kiến.
theological_decisions:
- issue: Danh tính của Đấng ngự trên ngai
  choice: Giữ cách gọi hàm ẩn là “Đấng ngự trên ngai ấy”
  alternative: Xác định rõ là Đức Chúa Trời, Đức Chúa Cha hoặc Đấng Christ
  rationale: Bản thân câu này không nêu danh tính, nên bản dịch không áp đặt một cách nhận diện thần học cụ thể.
- issue: Đất và trời trốn đi
  choice: Giữ hình ảnh nhân cách hóa “trốn đi”
  alternative: Diễn giải thành “biến mất” hoặc “bị hủy diệt”
  rationale: Động từ Hy Lạp mô tả sự chạy trốn; câu không trực tiếp giải thích cơ chế hay bản chất cánh chung của biến cố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngai” và “ngự” để giữ sắc thái vương quyền; không thêm danh tính cho Đấng ngự ngai. Dấu chấm phẩy giúp phân định cảnh tượng ngai với phản ứng của đất trời.
