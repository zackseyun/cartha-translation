  source_fidelity: 'Bản nháp giữ đúng các thành tố chính: ngai lớn trắng, Đấng ngự trên ngai, đất và trời chạy trốn, và không có chỗ cho chúng. Tuy nhiên, “trước mặt Ngài” thường chỉ vị trí hoặc hành động xảy ra trước mặt ai đó, trong khi ἀπὸ τοῦ προσώπου diễn tả việc chạy trốn khỏi sự hiện diện của Đấng ấy. Cụm “không còn” cũng thêm sắc thái thời gian/kết quả không được nêu rõ trong nguyên văn.'
