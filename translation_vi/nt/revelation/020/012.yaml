id: REV.20.12
reference: Revelation 20:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: vi
  text: Tôi thấy những người chết, cả lớn lẫn nhỏ, đang đứng trước ngai. Các sách[a] được mở ra. Một sách khác cũng được mở ra, ấy là sách sự sống. Những người chết bị phán xét dựa trên những điều đã được ghi trong các sách, tùy theo các việc làm của họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sách” ở đây cũng có thể dịch là “các cuộn sách”, theo hình thức văn bản thời cổ đại.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “theo những gì họ đã làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: những người chết
  rationale: Diễn đạt tính từ được danh từ hóa, chỉ chung những người đã chết; tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: cả lớn lẫn nhỏ
  rationale: Giữ phép bao quát mọi địa vị và thứ bậc, đồng thời là cách nói tự nhiên trong tiếng Việt.
- source_word: ἑστῶτας
  choice: đang đứng
  rationale: 'Thể hiện trạng thái hiện hữu của phân từ hoàn thành: họ ở trong tư thế đứng trước ngai.'
- source_word: ἐνώπιον τοῦ θρόνου
  choice: trước ngai
  rationale: Dịch trực tiếp ἐνώπιον và θρόνος, không thêm ý giải thích như 'tòa phán xét'.
- source_word: βιβλία
  choice: các sách
  rationale: Giữ nghĩa rộng và cách dùng quen thuộc trong văn cảnh Kinh Thánh; phương tiện cổ đại có thể là các cuộn sách nên được ghi chú.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: được mở ra
  rationale: Phản ánh trực tiếp dạng bị động của ἀνοίγω, không thêm ý 'tháo ấn' vốn không có trong động từ.
- source_word: ἄλλο βιβλίον
  choice: một sách khác
  rationale: Chỉ thêm một sách riêng biệt bên cạnh các sách vừa nói đến.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: ấy là sách sự sống
  rationale: Bổ sung danh từ 'sách' được tỉnh lược trong tiếng Hy Lạp và giữ danh xưng quen thuộc, chính xác.
- source_word: ἐκρίθησαν
  choice: bị phán xét
  rationale: Giữ sắc thái tư pháp của κρίνω nhưng không mặc nhiên biến sự phán xét thành kết án.
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: dựa trên những điều đã được ghi trong các sách
  rationale: Diễn đạt các điều được ghi là căn cứ của sự phán xét, đồng thời phản ánh kết quả hoàn tất của phân từ hoàn thành.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: tùy theo các việc làm của họ
  rationale: Giữ nguyên mối tương ứng giữa sự phán xét và ἔργα, với cách diễn đạt trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sự phán xét tùy theo việc làm
  choice: tùy theo các việc làm của họ
  alternative: theo những gì họ đã làm
  rationale: Câu Hy Lạp nói rõ sự phán xét tương ứng với các việc làm. Bản dịch giữ nguyên sức nặng thần học này, không làm nhẹ đi và cũng không đưa vào một tổng hợp giáo lý nằm ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “ngai”, “sách sự sống” và “phán xét” để giữ sắc thái Khải Huyền và tính liên văn bản; tránh thêm từ “tòa” vì nguyên văn chỉ nói đến ngai.
