id: REV.20.2
reference: Revelation 20:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: vi
  text: Người bắt lấy con rồng—con rắn xưa[a], tức là Ma Quỷ và Sa-tan—và trói nó trong một ngàn năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con rắn cổ xưa” hoặc “con rắn thuở xưa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκράτησεν
  choice: bắt lấy
  rationale: Diễn đạt hành động mạnh mẽ, dứt khoát của κρατέω, tự nhiên trong tiếng Việt và không thêm ý nghĩa ngoài văn bản.
- source_word: δράκοντα
  choice: con rồng
  rationale: Cách gọi quen thuộc, giữ nguyên hình tượng khải huyền và tính liên tục trong sách Khải Huyền.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: con rắn xưa kia
  rationale: Giữ cấu trúc đồng vị dùng để nhận diện con rồng; “xưa kia” diễn đạt tự nhiên ý nghĩa cổ xưa/lâu đời của ἀρχαῖος mà không nhất thiết biến nó thành phẩm tính “cổ xưa”.
- source_word: Διάβολος
  choice: Ma Quỷ
  rationale: Danh xưng tiếng Việt phổ biến cho Διάβολος, phù hợp ngữ cảnh xác định danh tính.
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Phiên âm tên gọi theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἔδησεν
  choice: trói ... lại
  rationale: Giữ hình ảnh cụ thể của δέω; tiểu từ “lại” khiến câu tự nhiên và nhấn mạnh tình trạng bị trói mà không diễn giải bản chất sự kiềm chế.
- source_word: χίλια ἔτη
  choice: trong một ngàn năm
  rationale: Diễn đạt tự nhiên đối cách chỉ khoảng thời gian, đồng thời giữ nguyên con số và không giải thích nó theo nghĩa đen hay biểu tượng.
theological_decisions:
- issue: Bản chất của một ngàn năm
  choice: Dịch thẳng là “một ngàn năm” mà không xác định thời kỳ này theo nghĩa đen, biểu tượng hay cách hiểu khác.
  alternative: Một thời kỳ đúng một ngàn năm; hoặc một thiên niên kỷ mang tính biểu tượng.
  rationale: Nguyên văn chỉ nêu khoảng thời gian; bản dịch cần giữ nguyên sự căng thẳng thần học thay vì quyết định một hệ thống cánh chung.
- issue: Danh tính của con rồng
  choice: 'Giữ đầy đủ chuỗi nhận diện: con rồng—con rắn xưa kia—Ma Quỷ và Sa-tan.'
  alternative: Rút gọn các danh xưng thành một tên gọi duy nhất.
  rationale: Câu Hy Lạp chủ ý nêu đủ các danh xưng, vì vậy không nên giản lược.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ thành phần đồng vị; “tức là” truyền đạt chức năng giải thích của mệnh đề nhận diện. Đại từ “Người” nối với chủ thể ở câu trước và dùng chữ hoa theo quy ước chỉ thiên sứ trong ngữ cảnh.
