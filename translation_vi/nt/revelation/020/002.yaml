revisions:
- from: Người bắt lấy con rồng—con rắn xưa kia[a], tức là Ma Quỷ và Sa-tan—rồi trói nó lại trong một ngàn năm.
  to: Người bắt lấy con rồng—con rắn xưa[a], tức là Ma Quỷ và Sa-tan—và trói nó trong một ngàn năm.
  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt ὁ ὄφις ὁ ἀρχαῖος thành “con rắn xưa” để phản ánh rõ tính từ bổ nghĩa, và giản lược “trói nó lại” thành “trói nó.” Chuỗi danh xưng, hình ảnh con rồng, và thời hạn “một ngàn năm” đều được giữ nguyên, không áp đặt cách hiểu về thiên niên kỷ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các yếu tố chính của câu Hy Lạp: hành động bắt giữ con rồng, chuỗi đồng nhất hóa với con rắn cổ xưa, Ma Quỷ và Sa-tan, cùng thời hạn một ngàn năm. Tuy nhiên, “xưa kia” thường hoạt động như trạng ngữ chỉ thời điểm quá khứ hơn là phẩm tính của “con rắn”; “xưa” truyền đạt sát và tự nhiên hơn tính từ ἀρχαῖος.'
  naturalness: Câu nhìn chung rõ ràng, hiện đại và giữ được nhịp văn khải huyền. Thay “con rắn xưa kia” bằng “con rắn xưa” giúp cụm đồng vị tự nhiên hơn. Bỏ “lại” khỏi “trói nó lại” tránh thêm sắc thái không cần thiết; dùng “và” phản ánh hai liên từ καὶ trong nguyên văn mà vẫn tự nhiên.
  terminology: “Con rồng,” “Ma Quỷ,” và “Sa-tan” là các thuật ngữ phù hợp. “Con rắn xưa” duy trì cách gọi nhận diện có tính liên văn trong Khải Huyền mà không giải thích thêm về bản chất hay niên đại của hình tượng.
  issues:
  - severity: low
    issue: Cụm “con rắn xưa kia”
    rationale: ἀρχαῖος là tính từ bổ nghĩa cho “con rắn,” nghĩa là “xưa/cổ xưa.” Trong tiếng Việt hiện đại, “xưa kia” dễ được hiểu như trạng ngữ “vào thời trước”; “con rắn xưa” hoặc “con rắn cổ xưa” sát chức năng ngữ pháp và tự nhiên hơn.
  - severity: low
    issue: Tiểu từ “lại” trong “trói nó lại”
    rationale: δέω chỉ đơn giản là “trói/buộc.” “Lại” có thể là tiểu từ hoàn tất tự nhiên, nhưng không cần thiết và có thể tạo sắc thái bổ sung không được nêu trong nguyên văn.
  revised_text: Người bắt lấy con rồng—con rắn xưa[a], tức là Ma Quỷ và Sa-tan—và trói nó trong một ngàn năm.
  revised_footnotes:
