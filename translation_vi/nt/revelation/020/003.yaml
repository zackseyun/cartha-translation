id: REV.20.3
reference: Revelation 20:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: vi
  text: Vị ấy ném hắn xuống vực thẳm[a], đóng lại và niêm phong kín phía trên hắn, để hắn không còn lừa dối các dân tộc nữa[b] cho đến khi mãn một ngàn năm. Sau đó, hắn phải được thả ra trong một thời gian ngắn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hố không đáy”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “dẫn các dân tộc đi lạc”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “được thả ra trong ít lâu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: ném
  rationale: Động từ βάλλω ở đây diễn tả hành động mạnh, đưa đối tượng xuống một nơi; “ném” tự nhiên và giữ được sắc thái cưỡng bức.
- source_word: ἄβυσσον
  choice: vực thẳm
  rationale: ἄβυσσος là thuật ngữ chỉ nơi sâu thẳm trong văn chương khải huyền. “Vực thẳm” rõ nghĩa, trang trọng và không diễn giải quá mức thành một cấu trúc vật lý cụ thể.
- source_word: ἔκλεισεν
  choice: đóng vực lại
  rationale: κλείω có nghĩa là đóng lại. Tiếng Việt cần nêu lại đối tượng ngầm hiểu là vực thẳm để câu rõ ràng, nhưng không thêm ý “khóa” vốn không được nói trực tiếp.
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: niêm phong bên trên hắn
  rationale: “Niêm phong” thể hiện σφραγίζω, còn “bên trên hắn” giữ quan hệ không gian của ἐπάνω αὐτοῦ mà không xác định thêm vật được dùng để niêm phong.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: để hắn không còn lừa dối các dân tộc nữa
  rationale: πλανάω có thể là lừa dối hoặc dẫn đi sai lạc; “lừa dối” ngắn gọn và tự nhiên. Cấu trúc “không còn… nữa” diễn đạt đầy đủ ἔτι trong mệnh đề phủ định.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: cho đến khi một ngàn năm kết thúc
  rationale: τελεσθῇ chỉ việc thời kỳ đi đến chỗ hoàn tất; “kết thúc” diễn đạt tự nhiên ranh giới thời gian do ἄχρι mở đầu.
- source_word: μετὰ ταῦτα
  choice: Sau đó
  rationale: Cách chuyển tiếp thời gian tự nhiên trong tiếng Việt, tương ứng với “sau những điều này” nhưng tránh lối diễn đạt nặng nề.
- source_word: δεῖ
  choice: phải
  rationale: “Phải” giữ nguyên ý nghĩa cần thiết của δεῖ nhưng không giải thích nguồn gốc của sự cần thiết ấy.
- source_word: λυθῆναι αὐτὸν
  choice: hắn phải được thả ra
  rationale: Dạng bị động của λύω ở đây nói đến việc được giải khỏi sự giam giữ; “được thả ra” là cách nói hiện đại, rõ nghĩa.
- source_word: μικρὸν χρόνον
  choice: trong một thời gian ngắn
  rationale: Cụm từ chỉ khoảng thời gian hữu hạn; cách dịch này trực tiếp và tự nhiên.
theological_decisions:
- issue: Bản chất của “một ngàn năm”
  choice: Dịch trực tiếp là “một ngàn năm” mà không thêm lời định tính.
  alternative: Hiểu là một thiên niên kỷ theo nghĩa đen hoặc một thời kỳ dài mang tính biểu tượng.
  rationale: Câu Hy Lạp không tự giải quyết tranh luận về tính literal hay biểu tượng của thời kỳ này; bản dịch giữ nguyên sự mở ngỏ ấy.
- issue: Sắc thái của δεῖ trong bối cảnh khải huyền
  choice: Dịch là “phải”.
  alternative: Giải thích rõ là do sắc lệnh thần thượng hoặc chỉ là diễn tiến tất yếu của câu chuyện.
  rationale: δεῖ biểu thị sự cần thiết, nhưng câu này không nói rõ cơ chế hay nguồn gốc của sự cần thiết; “phải” bảo toàn lực nghĩa mà không áp đặt hệ thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vị ấy” chỉ chủ thể thiên sứ từ văn cảnh trước mà không đồng nhất vị này với Đức Chúa Trời; “hắn” giữ quy chiếu cá nhân đối với con rồng/Sa-tan và tạo sự phân biệt đại từ rõ ràng. Câu dịch không quyết định cách hiểu biểu tượng hay theo nghĩa đen của một ngàn năm.
