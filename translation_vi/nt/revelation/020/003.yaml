revisions:
- from: Vị ấy ném hắn xuống vực thẳm[a], đóng vực lại và niêm phong bên trên hắn, để hắn không còn lừa dối các dân tộc nữa[b] cho đến khi một ngàn năm kết thúc. Sau đó, hắn phải được thả ra trong một thời gian ngắn[c].
  to: Vị ấy ném hắn xuống vực thẳm[a], đóng lại và niêm phong kín phía trên hắn, để hắn không còn lừa dối các dân tộc nữa[b] cho đến khi mãn một ngàn năm. Sau đó, hắn phải được thả ra trong một thời gian ngắn[c].
  rationale: Bản sửa làm rõ và tự nhiên hóa cách diễn đạt hành động niêm phong mà không thêm chi tiết vật chất nào; đồng thời thay chú thích có hàm ý “xiềng” bằng một phương án phù hợp với λυθῆναι. Các đại từ duy trì quy chiếu từ văn cảnh trước và bản dịch vẫn để ngỏ mọi cách hiểu về “một ngàn năm.”
  reviewer_model: gpt-5.6-terra
