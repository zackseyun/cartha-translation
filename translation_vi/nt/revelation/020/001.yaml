id: REV.20.1
reference: Revelation 20:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: vi
  text: Và tôi thấy một thiên sứ từ trời xuống, tay cầm chìa khóa của vực thẳm[a] và một sợi xích lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vực sâu không đáy”. Tiếng Hy Lạp là “vực thẳm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Và
  rationale: Giữ liên từ đơn giản và nhịp kể nối tiếp của sách Khải Huyền, không diễn giải rõ thành quan hệ thời gian như “Rồi” hay “Kế đó”.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Diễn đạt trực tiếp động từ ὁράω trong lời thuật khải tượng, không thêm ý.
- source_word: ἄγγελον
  choice: một thiên sứ
  rationale: Trong ngữ cảnh này, từ này chỉ một hữu thể thuộc trời; “thiên sứ” rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: từ trời xuống
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ cả nguồn xuất phát và hướng chuyển động của thiên sứ.
- source_word: ἔχοντα
  choice: tay cầm
  rationale: Diễn đạt tự nhiên hình ảnh thiên sứ mang chìa khóa và dây xích, đồng thời kết nối với cụm ἐπὶ τὴν χεῖρα αὐτοῦ ở cuối câu.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: chìa khóa của vực thẳm
  rationale: Giữ quan hệ sở thuộc của cấu trúc Hy Lạp và tránh xác định thêm chức năng ngoài điều bản văn nói.
- source_word: τῆς ἀβύσσου
  choice: vực thẳm
  rationale: “Vực thẳm” thể hiện trực tiếp ἄβυσσος trong bối cảnh khải huyền mà không thêm tính từ “không đáy” vào chính văn.
- source_word: ἅλυσιν μεγάλην
  choice: một sợi xích lớn
  rationale: “Sợi xích” là cách gọi tự nhiên trong tiếng Việt; “lớn” giữ nghĩa kích thước hoặc sự đồ sộ của μεγάλην mà không cường điệu.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: tay cầm
  rationale: Thay vì dịch cứng là “trên tay”, cấu trúc tiếng Việt này truyền đạt tự nhiên hình ảnh các vật ở trong tay thiên sứ.
theological_decisions:
- issue: Cách dịch ἄβυσσος trong bối cảnh khải huyền
  choice: vực thẳm
  alternative: vực sâu không đáy
  rationale: “Vực thẳm” bám sát danh từ Hy Lạp và không cụ thể hóa hình ảnh quá mức; cách dịch truyền thống “vực sâu không đáy” được ghi ở chú thích để người đọc nhận biết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc thị kiến trực tiếp, nhưng dùng “tay cầm” để tránh lối dịch máy móc “trên tay”. Dấu chú thích được đặt ngay sau “vực thẳm”, là từ ngữ mà chú thích giải thích.
