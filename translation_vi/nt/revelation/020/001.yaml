  source_fidelity: 'Bản dịch truyền đạt đầy đủ các yếu tố của câu Hy Lạp: sự tiếp nối thị kiến (Καὶ), người kể thấy thiên sứ, chuyển động từ trời xuống, chìa khóa liên hệ với vực thẳm, và một sợi xích lớn được cầm trong tay. Cụm “tay cầm” diễn đạt tự nhiên hai phân từ và hình ảnh ἐπὶ τὴν χεῖρα αὐτοῦ mà không thêm ý nghĩa.'
