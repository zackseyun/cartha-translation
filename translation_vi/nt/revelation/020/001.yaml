  terminology: “Thiên sứ” phù hợp ngữ cảnh Khải Huyền. “Vực thẳm” bám sát ἄβυσσος và tránh đưa cụm diễn giải “không đáy” vào chính văn. Chú thích nêu lựa chọn từ vựng thay thế, được đặt đúng ngay sau thuật ngữ cần giải thích.
