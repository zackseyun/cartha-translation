id: REV.20.8
reference: Revelation 20:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: vi
  text: Rồi nó sẽ đi ra để lừa dối[a] các dân tộc khắp bốn phương trên đất—Gót và Ma-gót[b]—và tập hợp họ lại để giao chiến[c]. Số người ấy đông như cát biển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn đi lạc.”'
    reason: lexical_alternative
  - marker: b
    text: “Gót và Ma-gót” gợi lại Ê-xê-chi-ên 38–39 và có thể được dùng như tên gọi mang tính hình mẫu cho các dân tộc tụ họp trong cuộc nổi loạn cuối cùng.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch: “để tham chiến” hoặc “cho trận chiến.” Từ Hy Lạp có thể chỉ chiến tranh hay trận chiến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: nó sẽ đi ra
  rationale: Động từ tương lai diễn tả Sa-tan đi ra sau khi được thả (c. 7). Đại từ “nó” nối với chủ thể trong văn cảnh và phù hợp cách gọi một hữu thể ác.
- source_word: πλανῆσαι
  choice: để lừa dối
  rationale: πλανάω có thể là “lừa dối” hoặc “dẫn đi lạc”; “lừa dối” tự nhiên và hợp văn cảnh Khải Huyền, còn nghĩa thay thế được ghi chú.
- source_word: τὰ ἔθνη
  choice: các dân tộc
  rationale: Chỉ các dân tộc hay cộng đồng trên toàn thế giới, không nhất thiết nhấn mạnh sự đối lập giữa dân ngoại và người Do Thái.
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: ở bốn phương đất
  rationale: Thành ngữ chỉ mọi miền xa rộng của thế giới; “bốn phương đất” tự nhiên trong tiếng Việt và tránh gợi ý trái đất có bốn góc theo nghĩa đen.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Gót và Ma-gót
  rationale: Phiên âm các tên riêng và đặt đồng vị với “các dân tộc”, không quyết định quá mức ý nghĩa biểu tượng hoặc địa lý của chúng.
- source_word: συναγαγεῖν
  choice: tập hợp họ lại
  rationale: Diễn tả mục đích tiếp theo của việc đi ra; “tập hợp… lại” là cách nói tự nhiên và giữ hình ảnh quy tụ.
- source_word: εἰς τὸν πόλεμον
  choice: để giao chiến
  rationale: πόλεμος có thể chỉ chiến tranh hoặc một trận chiến. Cách dịch này giữ nghĩa quân sự mà không buộc phải chọn giữa hai sắc thái danh từ.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: Số người ấy
  rationale: Quy chiếu rõ đến những người thuộc các dân tộc được tập hợp; tách thành câu mới giúp tiếng Việt sáng rõ.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: đông như cát biển
  rationale: Thành ngữ tiếng Việt tự nhiên, bảo toàn phép so sánh Kinh Thánh về số lượng vô cùng đông đảo.
theological_decisions:
- issue: Chủ thể ngầm của “sẽ đi ra”
  choice: Dùng “nó”, quy chiếu về Sa-tan trong câu 7
  alternative: Lặp lại danh xưng “Sa-tan”
  rationale: Bản Hy Lạp không nêu lại chủ thể; đại từ duy trì sự liên tục ngữ pháp mà không thêm danh xưng vào câu.
- issue: Ý nghĩa của “Gót và Ma-gót”
  choice: Xem là phần đồng vị chỉ các dân tộc bị lừa dối, đồng thời giữ nguyên các tên gọi
  alternative: Giải thích trực tiếp là biểu tượng về những kẻ thù cuối cùng của Đức Chúa Trời hoặc là thực thể địa lý cụ thể
  rationale: Cách dịch giữ tiếng vọng từ Ê-xê-chi-ên 38–39 nhưng không giải quyết thay cho bản văn câu hỏi các tên này mang tính biểu tượng, hình mẫu hay địa lý.
- issue: Phạm vi nghĩa của πόλεμος
  choice: “để giao chiến”
  alternative: “cho chiến tranh” hoặc “cho trận chiến”
  rationale: Giữ được sự căng nghĩa giữa chiến tranh và trận chiến, không xác định hẹp hơn điều tiếng Hy Lạp cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bốn phương đất” chuyển tải thành ngữ chỉ toàn thế giới theo lối nói Việt tự nhiên. Dấu gạch ngang làm rõ “Gót và Ma-gót” là phần đồng vị; câu cuối được tách riêng để tránh cấu trúc quan hệ nặng nề. Mọi ký hiệu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
