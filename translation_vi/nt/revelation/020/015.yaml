id: REV.20.15
reference: Revelation 20:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: vi
  text: Và nếu không tìm thấy ai được ghi trong Sách Sự Sống[a], người ấy bị ném vào hồ lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cuộn sách sự sống.” Từ Hy Lạp có thể chỉ một quyển sách hoặc một cuộn sách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: nếu ai
  rationale: Diễn đạt tự nhiên một điều kiện bất định, áp dụng cho bất cứ người nào.
- source_word: οὐχ εὑρέθη
  choice: không được thấy
  rationale: Giữ sắc thái bị động và tính chất phát hiện/xác nhận trong bối cảnh phán xét.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: trong sách sự sống
  rationale: “Sách sự sống” là cách diễn đạt rõ ràng, quen thuộc; βίβλος cũng có thể chỉ một cuộn sách, nên phương án đó được ghi ở chú thích.
- source_word: γεγραμμένος
  choice: là có ghi
  rationale: Chuyển phân từ hoàn thành bị động sang cấu trúc tiếng Việt tự nhiên, vẫn diễn đạt tình trạng người ấy đã được ghi trong sách.
- source_word: ἐβλήθη
  choice: bị ném
  rationale: Diễn đạt trực tiếp thể bị động và hành động mạnh của βάλλω mà không cường điệu thành “quăng mạnh”.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: vào hồ lửa
  rationale: Giữ nguyên hình ảnh khải huyền cô đọng của nguyên văn.
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: ai ... người ấy
  rationale: Tiếng Việt dùng “người ấy” để nối lại đối tượng số ít bất định một cách tự nhiên; hình thái giống đực trong tiếng Hy Lạp ở đây có chức năng đại diện và không nhất thiết xác định người đó là nam.
theological_decisions:
- issue: Hình ảnh sự phán xét cuối cùng
  choice: hồ lửa
  alternative: hồ bằng lửa
  rationale: Giữ nguyên hình ảnh của nguyên văn mà không giải thích thêm bản chất hay thời hạn của hình phạt.
- issue: Đối tượng số ít bất định
  choice: người ấy bị ném
  alternative: người đó bị ném
  rationale: Duy trì đối tượng số ít của mệnh đề Hy Lạp, đồng thời dùng đại từ tiếng Việt tự nhiên và không gán giới tính mà ngữ cảnh không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “không được thấy là có ghi” giữ ý của nguyên văn mà tránh bổ sung từ “tên”, vốn không xuất hiện trực tiếp trong câu Hy Lạp.
