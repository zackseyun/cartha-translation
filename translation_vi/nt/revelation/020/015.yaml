review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện, hình ảnh «sách sự sống» và hành động bị động «bị ném vào hồ lửa». Tuy nhiên, cụm «không được thấy là có ghi» không diễn đạt tự nhiên ý εὑρέθη ... γεγραμμένος (“được tìm thấy là đã được ghi”).
  naturalness: «Không được thấy là có ghi» gượng và dễ gây khó hiểu trong tiếng Việt hiện đại. Đảo thành «không tìm thấy ai được ghi» diễn đạt tự nhiên hơn mà vẫn giữ nghĩa phán xét/công bố của động từ bị động Hy Lạp.
  terminology: «Sách Sự Sống» và «hồ lửa» là các thuật ngữ rõ ràng, phù hợp văn mạch Khải Huyền. Chú thích về βίβλος/cộn sách là phù hợp và được giữ lại.
  issues:
  - severity: medium
    issue: Cụm «không được thấy là có ghi» thiếu tự nhiên và mơ hồ.
    rationale: Trong tiếng Việt, «thấy là có ghi» không kết hợp tự nhiên với chủ ngữ «ai» và không rõ điều gì được ghi. Cấu trúc «không tìm thấy ai được ghi trong Sách Sự Sống» chuyển tải rõ phân từ hoàn thành bị động γεγραμμένος mà không cần thêm «tên» vốn không hiện diện trực tiếp trong câu Hy Lạp.
  revised_text: Và nếu không tìm thấy ai được ghi trong Sách Sự Sống[a], người ấy bị ném vào hồ lửa.
