id: REV.20.9
reference: Revelation 20:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: vi
  text: Họ tiến lên khắp bề rộng của mặt đất và bao vây trại của các thánh đồ và thành yêu dấu.[a] Rồi lửa từ trời giáng xuống thiêu nuốt họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không xác định danh tính của “thành yêu dấu”; cách gọi này thường được hiểu là Giê-ru-sa-lem hoặc, theo nghĩa rộng hơn, thành của Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: tiến lên
  rationale: Động từ có nghĩa là đi lên hoặc tiến lên; trong ngữ cảnh đoàn quân tràn khắp mặt đất, “tiến lên” tự nhiên mà không ấn định địa hình.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: khắp bề rộng của đất
  rationale: Giữ hình ảnh về bề rộng hay khoảng trải rộng của γῆ, không thêm ý “đồng bằng” vốn không có trong nguyên văn. “Đất” bảo toàn khả năng chỉ đất liền hoặc toàn cõi đất.
- source_word: ἐκύκλευσαν
  choice: bao vây
  rationale: Diễn đạt rõ hành động vây quanh trong ngữ cảnh thù địch.
- source_word: παρεμβολὴν
  choice: trại
  rationale: Từ này chỉ trại hoặc nơi đóng trại, thường mang sắc thái quân sự; “trại” ngắn gọn và không diễn giải quá mức.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: Cách gọi quen thuộc trong Tân Ước dành cho những người thuộc về Đức Chúa Trời, đồng thời giữ tính liên văn bản trong sách Khải Huyền.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: thành yêu dấu
  rationale: Giữ ý của phân từ bị động hoàn thành “được yêu” mà không tự ý nêu chủ thể yêu hoặc đồng nhất thành ấy.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: lửa từ trời giáng xuống
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ nguyên hướng chuyển động và nguồn gốc từ trời.
- source_word: κατέφαγεν αὐτούς
  choice: thiêu nuốt họ
  rationale: Động từ có nghĩa đen là ăn nuốt và nghĩa mở rộng là nuốt chửng, tiêu diệt; với lửa làm chủ thể, “thiêu nuốt” vừa tự nhiên vừa giữ sức mạnh của hình ảnh.
theological_decisions:
- issue: Đối tượng được gọi là “thành yêu dấu”
  choice: Giữ cách gọi chung “thành yêu dấu” và không xác định danh tính trong chính văn.
  alternative: Giê-ru-sa-lem; hoặc thành/dân của Đức Chúa Trời trong thời kỳ cuối cùng.
  rationale: Nguyên văn không nêu tên thành trong câu này. Việc xác định cụ thể sẽ giải quyết thay cho người đọc một điểm mà bản văn vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tiến lên” để phù hợp cảnh đoàn quân tiến quân; giữ “bề rộng” nhằm bám sát πλάτος và tránh thêm địa hình “đồng bằng”. Chỉ dùng một chú thích cần thiết cho điểm quy chiếu còn để ngỏ trong nguyên văn.
