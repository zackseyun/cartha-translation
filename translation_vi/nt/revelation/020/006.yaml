id: REV.20.6
reference: Revelation 20:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: vi
  text: Phước cho người có phần trong sự sống lại thứ nhất; người ấy là thánh. Sự chết thứ hai không có quyền trên những người ấy; nhưng họ sẽ là thầy tế lễ của Đức Chúa Trời và của Đấng Mê-si[a], và sẽ cùng ngài trị vì một ngàn năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng được xức dầu.”
    reason: Nêu cách gọi tương đương quen thuộc, đồng thời giữ rõ sắc thái tước hiệu của Χριστός trong thân văn.
lexical_decisions:
- source_word: μακάριος
  choice: Phước thay
  rationale: Cách diễn đạt tự nhiên, trang trọng của lời tuyên phước trong Kinh Thánh; không thu hẹp ý nghĩa vào cảm xúc vui vẻ chủ quan.
- source_word: ἅγιος
  choice: thánh khiết thay
  rationale: Giữ ý nghĩa về địa vị được biệt riêng cho Đức Chúa Trời, đồng thời phối hợp tự nhiên với cấu trúc tuyên phước.
- source_word: ὁ ἔχων μέρος
  choice: người được dự phần
  rationale: Diễn đạt sự tham dự hay có phần trong biến cố; lối dùng 'được' tự nhiên trong tiếng Việt mà không xác định thêm tác nhân.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: vào sự sống lại thứ nhất
  rationale: Giữ nguyên thuật ngữ và thứ tự thời gian của nguyên văn, không diễn giải theo một hệ thống cánh chung cụ thể.
- source_word: ἐπὶ τούτων
  choice: trên những người ấy
  rationale: Với ἐπί và sở hữu cách, cụm từ chỉ phạm vi quyền cai quản đối với những người vừa được nói đến.
- source_word: ὁ δεύτερος θάνατος
  choice: sự chết thứ hai
  rationale: Cách dịch trực tiếp, giữ nguyên thuật ngữ khải huyền của câu.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: không có quyền
  rationale: ἐξουσία ở đây thiên về thẩm quyền hay quyền chi phối hơn là sức mạnh thuần túy.
- source_word: ἱερεῖς
  choice: thầy tế lễ
  rationale: Thuật ngữ quen thuộc, biểu đạt trực tiếp chức vụ tế lễ và giữ hình ảnh tư tế của nguyên văn.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: của Đức Chúa Trời và của Đấng Christ
  rationale: Lặp lại 'của' để phản ánh hai sở hữu cách và làm rõ quan hệ song song; 'Đấng Christ' giữ sắc thái tước hiệu của Χριστός.
- source_word: βασιλεύσουσιν μετ’ αὐτοῦ
  choice: sẽ cùng ngài trị vì
  rationale: Diễn đạt tự nhiên sự đồng trị vì với Đấng Christ; đại từ viết thường không áp đặt quy ước tôn xưng ngoài nguyên văn.
- source_word: χίλια ἔτη
  choice: một ngàn năm
  rationale: Giữ nguyên phát biểu thời lượng, không thêm cách giải thích theo nghĩa đen hay biểu tượng.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Christ
  alternative: Đấng Mê-si
  rationale: Trong tiếng Việt Kinh Thánh, 'Đấng Christ' là tước hiệu quen thuộc và trang trọng; chú thích nêu tương đương 'Đấng Mê-si' để bảo toàn sắc thái tước hiệu.
- issue: Ý nghĩa của một ngàn năm
  choice: một ngàn năm
  alternative: một thiên niên kỷ
  rationale: Dịch trực tiếp con số và đơn vị thời gian, không quyết định câu phải được hiểu theo nghĩa đen, biểu tượng, tiền thiên niên hay vô thiên niên.
- issue: Thẩm quyền của sự chết thứ hai
  choice: không có quyền trên những người ấy
  alternative: không có quyền lực đối với họ
  rationale: Giữ nét nghĩa thẩm quyền hoặc quyền tài phán của ἐξουσία, không biến nó thành phát biểu đơn thuần về năng lực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng cấu trúc tuyên phước “Phước thay...!”; giữ các thuật ngữ khải huyền “sự sống lại thứ nhất” và “sự chết thứ hai” mà không giải nghĩa theo một hệ phái.
