revisions:
- from: Phước thay và thánh khiết thay người được dự phần vào sự sống lại thứ nhất! Sự chết thứ hai không có quyền trên những người ấy; nhưng họ sẽ làm thầy tế lễ của Đức Chúa Trời và của Đấng Christ[a], và sẽ cùng ngài trị vì một ngàn năm.
  to: Phước cho người có phần trong sự sống lại thứ nhất; người ấy là thánh. Sự chết thứ hai không có quyền trên những người ấy; nhưng họ sẽ là thầy tế lễ của Đức Chúa Trời và của Đấng Mê-si[a], và sẽ cùng ngài trị vì một ngàn năm.
  rationale: Bản sửa làm rõ cú pháp tuyên bố của μακάριος καὶ ἅγιος đối với cùng một chủ thể, thay cụm từ kém tự nhiên bằng tiếng Việt hiện đại và giữ sự chuyển từ đơn số sang số nhiều như nguyên văn. “Có phần trong” phản ánh ἔχων μέρος ἐν mà không hàm ý thêm tác nhân. Các thuật ngữ khải huyền và diễn đạt về thẩm quyền vẫn được giữ nguyên. “Đấng Mê-si” trong thân văn phù hợp với giá trị tước hiệu của Χριστός; chú thích bảo lưu “Đấng Christ” như cách dịch quen thuộc. Đại từ “ngài” được giữ viết thường để không áp đặt quy ước tôn xưng; ngữ cảnh chỉ Đấng Mê-si.
