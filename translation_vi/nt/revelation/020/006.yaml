  - severity: medium
    issue: Thân văn dịch Χριστός là “Đấng Christ” nhưng chú thích mới nêu “Đấng Mê-si”
    rationale: Hồ sơ tiếng Anh và quyết định thuật ngữ xác định Χριστός ở đây là tước hiệu “Messiah.” Đảo lại để thân văn dùng “Đấng Mê-si,” còn chú thích nêu “Đấng Christ,” sẽ nhất quán hơn mà vẫn bảo tồn cách gọi quen thuộc.
