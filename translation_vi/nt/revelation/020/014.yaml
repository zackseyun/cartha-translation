id: REV.20.14
reference: Revelation 20:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: vi
  text: Sự Chết và Âm Phủ[a] bị ném vào hồ lửa. Đó là sự chết thứ hai—hồ lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp là Hades, chỉ cõi người chết. Ở đây, Âm Phủ khác với hồ lửa vì chính nó bị ném vào hồ lửa; vì vậy, dịch là “hỏa ngục” có thể gây hiểu lầm. Cũng có thể dịch là “cõi chết”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: Sự Chết / sự chết
  rationale: Trong mệnh đề đầu, viết hoa để thể hiện sự nhân cách hóa khi Sự Chết được đặt song song với Âm Phủ và bị ném vào hồ lửa; trong cụm “sự chết thứ hai”, viết thường vì đây là tên gọi của một thực tại phán xét.
- source_word: ᾅδης
  choice: Âm Phủ
  rationale: “Âm Phủ” là cách gọi tự nhiên trong tiếng Việt cho cõi người chết, đồng thời giữ nó phân biệt với “hồ lửa”. Không dịch là “hỏa ngục” vì trong câu này ᾅδης chính nó bị ném vào hồ lửa.
- source_word: ἐβλήθησαν
  choice: bị ném vào
  rationale: Diễn đạt thể bị động và ý bị cưỡng bức đưa vào một cách rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: λίμνη τοῦ πυρός
  choice: hồ lửa
  rationale: Cách dịch ngắn gọn, quen thuộc và sát hình ảnh khải huyền của nguyên văn.
- source_word: οὗτος
  choice: Đó là
  rationale: Giữ rõ đại từ chỉ định và cấu trúc đồng nhất của nguyên văn, không diễn giải thành “điều này có nghĩa là”.
- source_word: θάνατος ὁ δεύτερος
  choice: sự chết thứ hai
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời bảo toàn thuật ngữ khải huyền lặp lại trong sách Khải Huyền.
- source_word: ἡ λίμνη τοῦ πυρός
  choice: hồ lửa
  rationale: Lặp lại nguyên vẹn hình ảnh như nguyên văn; dấu gạch ngang thể hiện quan hệ đồng vị mà không giải thích quá mức.
theological_decisions:
- issue: Cách dịch ᾅδης trong bối cảnh phán xét cánh chung
  choice: Âm Phủ
  alternative: hỏa ngục; phần mộ
  rationale: Nguyên văn phân biệt ᾅδης với hồ lửa, vì chính ᾅδης bị ném vào đó. “Hỏa ngục” dễ đồng nhất hai hình ảnh, còn “phần mộ” thu hẹp nghĩa vào nơi chôn xác. “Âm Phủ” bảo toàn ý cõi người chết mà không áp đặt một mô hình giáo lý cụ thể.
- issue: Sự nhân cách hóa θάνατος
  choice: Viết hoa “Sự Chết” ở mệnh đề đầu, viết thường trong “sự chết thứ hai”
  alternative: Viết thường hoặc viết hoa trong cả hai trường hợp
  rationale: Mệnh đề đầu trình bày Sự Chết cùng với Âm Phủ như những thực thể bị hành động tác động; cụm sau gọi tên “sự chết thứ hai”. Cách phân biệt này giữ hiệu lực văn chương mà không thêm một khẳng định giáo lý.
- issue: Quan hệ giữa “sự chết thứ hai” và “hồ lửa”
  choice: Giữ cấu trúc đồng vị bằng dấu gạch ngang
  alternative: Diễn giải “tức là hồ lửa” hoặc đảo thành “Hồ lửa là sự chết thứ hai”
  rationale: Nguyên văn đặt “hồ lửa” sau “sự chết thứ hai” theo lối đồng vị. Dấu gạch ngang tạo câu tiếng Việt rõ ràng nhưng vẫn giữ trật tự và lực nhận diện của nguyên văn, không mở rộng thành lời giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. “Âm Phủ” dễ hiểu đối với độc giả Việt Nam nhưng được chú thích để tránh đồng nhất với hồ lửa. Việc viết hoa “Sự Chết” biểu thị phép nhân cách hóa trong văn cảnh khải huyền; dấu gạch ngang giữ quan hệ đồng vị ở cuối câu.
