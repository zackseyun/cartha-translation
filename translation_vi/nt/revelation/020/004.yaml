  source_fidelity: 'Cần sửa hai điểm: κρίμα ἐδόθη αὐτοῖς được dịch là “quyền xét xử được ban cho họ” đã thu hẹp κρίμα vào nghĩa thẩm quyền, trong khi nguyên ngữ để mở nghĩa sự xét xử/phán quyết hoặc thẩm quyền xét xử. Ngoài ra, hai vị trí của dấu được nối bằng καὶ (“và”), không phải “hoặc”. Các yếu tố còn lại giữ đúng trật tự khải tượng, không định danh chủ ngữ hàm ẩn của ἐκάθισαν, và bảo toàn sự mơ hồ của “lời chứng của Đức Giê-su.”'
