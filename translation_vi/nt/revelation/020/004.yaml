id: REV.20.4
reference: Revelation 20:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: vi
  text: Tôi thấy những ngai, và những người ngồi trên đó; sự xét xử được ban cho họ. Tôi cũng thấy linh hồn của những người đã bị chém đầu vì lời chứng của Đức Giê-su[a] và vì lời Đức Chúa Trời, cùng những người không thờ lạy con thú hay hình tượng của nó và không nhận dấu trên trán và trên tay mình. Họ sống lại và trị vì với Đấng Mê-si-a[b] một ngàn năm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp “lời chứng của Đức Giê-su” có thể chỉ lời chứng do Đức Giê-su đưa ra hoặc lời chứng về Đức Giê-su.
    reason: Giữ sự mơ hồ của sở hữu cách Ἰησοῦ giữa nghĩa chủ thể và nghĩa đối tượng.
  - marker: b
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός là một danh hiệu, nghĩa là “Đấng được xức dầu.”
    reason: Ghi nhận cách gọi quen thuộc khác và làm rõ lý do dùng danh hiệu “Đấng Mê-si-a” trong chính văn.
lexical_decisions:
- source_word: θρόνους
  choice: những ngai
  rationale: Cách dịch trực tiếp, giữ hình ảnh cụ thể và sắc thái khải huyền.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: những người ngồi trên đó
  rationale: Tiếng Hy Lạp có chủ ngữ số nhiều hàm ẩn nhưng không xác định danh tính; cách dịch này tránh gán họ là các thánh đồ, người tử đạo hay nhân vật thiên thượng.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: quyền xét xử được ban cho họ
  rationale: Trong ngữ cảnh những người ngồi trên ngai, κρίμα được hiểu tự nhiên là thẩm quyền thi hành việc xét xử; diễn đạt này rõ nghĩa trong tiếng Việt mà không xác định đối tượng hay phán quyết.
- source_word: ψυχὰς
  choice: linh hồn
  rationale: Giữ nguyên hình ảnh của khải tượng và sự phân biệt giữa tình trạng đã chết với việc sau đó sống lại.
- source_word: πεπελεκισμένων
  choice: đã bị chém đầu
  rationale: Diễn đạt tự nhiên và chính xác hành hình bằng cách chém đầu, không cần nêu thêm dụng cụ.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: vì lời chứng của Đức Giê-su
  rationale: Giữ cấu trúc sở hữu vốn có thể chỉ lời chứng do Đức Giê-su làm chứng hoặc lời chứng về Đức Giê-su; chú thích nêu cách hiểu còn lại.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: vì lời Đức Chúa Trời
  rationale: διά với đối cách diễn tả nguyên nhân; 'lời Đức Chúa Trời' là cách nói rõ và quen thuộc.
- source_word: προσεκύνησαν
  choice: không thờ lạy
  rationale: Thể hiện đúng ý nghĩa tôn giáo của động từ trong ngữ cảnh, hơn là chỉ hành động cúi mình.
- source_word: θηρίον
  choice: con thú
  rationale: Cách dịch trực tiếp và nhất quán với hình tượng khải huyền.
- source_word: εἰκόνα
  choice: hình tượng
  rationale: Giữ ý về hình ảnh đại diện được thờ lạy mà không diễn giải hẳn thành 'thần tượng'.
- source_word: χάραγμα
  choice: dấu
  rationale: Từ ngắn gọn, tự nhiên và phù hợp với cách dùng xuyên suốt ngữ cảnh Khải Huyền.
- source_word: ἔζησαν
  choice: sống lại
  rationale: Thể hiện lực khởi phát của động từ trong mạch văn, nhưng không quy định thêm bản chất của sự sống lại.
- source_word: χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός tại đây mang chức năng danh hiệu; cách dịch này truyền đạt ý 'Đấng được xức dầu' thay vì dùng như tên riêng.
- source_word: χίλια ἔτη
  choice: một ngàn năm
  rationale: Dịch trực tiếp con số và đơn vị thời gian, không thêm cách giải thích biểu tượng hay theo nghĩa đen.
theological_decisions:
- issue: Danh tính của những người ngồi trên ngai và nhận quyền xét xử
  choice: Không xác định danh tính, chỉ gọi là 'những người'.
  alternative: Các thánh đồ, những người tử đạo, các sứ đồ, hoặc các nhân vật trong hội đồng thiên thượng.
  rationale: Chủ ngữ của ἐκάθισαν chỉ được hàm ẩn trong tiếng Hy Lạp; việc gọi đích danh một nhóm sẽ vượt quá điều câu này nói rõ.
- issue: Ý nghĩa của μαρτυρίαν Ἰησοῦ
  choice: Giữ 'lời chứng của Đức Giê-su' trong chính văn.
  alternative: Lời chứng của họ về Đức Giê-su.
  rationale: Sở hữu cách Ἰησοῦ có thể được hiểu theo chủ thể hoặc đối tượng; chính văn giữ độ mơ hồ và chú thích ghi nhận cách hiểu phổ biến khác.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Từ này hoạt động như một danh hiệu trong câu; 'Đấng Mê-si-a' bảo toàn tính chất danh hiệu mà không thêm nét nghĩa cứu thế không biểu đạt trực tiếp bởi chính từ này.
- issue: Ý nghĩa của ἔζησαν
  choice: Họ sống lại.
  alternative: Họ sống; họ lại sống.
  rationale: Mạch văn chuyển từ linh hồn những người đã bị giết sang việc họ sống và trị vì. 'Sống lại' diễn đạt tự nhiên biến cố ấy nhưng không xác định cơ chế hoặc hệ thống cánh chung.
- issue: Bản chất của một ngàn năm
  choice: Dịch đơn giản là 'một ngàn năm'.
  alternative: Diễn giải là thời kỳ hoàn toàn theo nghĩa đen hoặc hoàn toàn mang tính biểu tượng.
  rationale: Câu văn nêu thời lượng nhưng không tự giải quyết tranh luận về cách hiểu; bản dịch không nên nhập một lập trường hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được chia nhịp để tránh chuỗi liên từ nặng nề của nguyên bản nhưng vẫn giữ trình tự khải tượng. Dùng “Đức Giê-su,” “Đức Chúa Trời” và “Đấng Mê-si-a” theo lối xưng gọi tôn kính; không áp đặt một hệ thống giải thích thiên niên kỷ.
