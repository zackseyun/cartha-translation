  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc cơ bản: biển, Sự Chết và Âm Phủ lần lượt trao trả người chết, rồi từng người bị xét xử theo việc mình đã làm. Tuy nhiên, “ở trong đó” không thể hiện rõ đại từ số nhiều αὐτοῖς, vốn quy chiếu đến cả Sự Chết và Âm Phủ; trong tiếng Việt, nó cũng dễ bị hiểu là chỉ riêng Âm Phủ.'
