id: REV.20.13
reference: Revelation 20:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: vi
  text: Biển trao trả những người chết ở trong nó; Sự Chết và Âm Phủ[a] trao trả những người chết ở trong chúng; mỗi người đều bị xét xử theo những việc mình đã làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp là ᾅδης (Ha-đét), cũng có thể dịch là “cõi người chết”; từ này khác với những thuật ngữ thường được dịch là “địa ngục.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: trao trả
  rationale: Trong ngữ cảnh biển, Sự Chết và Âm Phủ phải đưa người chết ra để chịu xét xử, “trao trả” diễn đạt tự nhiên ý giao nộp lại, đồng thời không thêm ý giải thích quá mức.
- source_word: ἡ θάλασσα
  choice: Biển
  rationale: Cách dịch trực tiếp, thông dụng của danh từ xác định này; trong mạch văn, “Biển” được nhân cách hóa như một thực thể trao trả người chết.
- source_word: τοὺς νεκρούς
  choice: những người chết
  rationale: Diễn đạt rõ danh từ hóa của tính từ νεκρός bằng tiếng Việt hiện đại.
- source_word: ὁ θάνατος
  choice: Sự Chết
  rationale: Viết hoa để biểu thị sự nhân cách hóa trong hình ảnh khải huyền, phù hợp với vai trò chủ thể của động từ “trao trả”.
- source_word: ὁ ᾅδης
  choice: Âm Phủ
  rationale: “Âm Phủ” chỉ cõi người chết và giữ được sự phân biệt với thuật ngữ chỉ nơi hình phạt cuối cùng; cách này tự nhiên hơn việc phiên âm “Ha-đét” đối với độc giả Việt phổ thông.
- source_word: ἐν αὐτοῖς
  choice: ở trong đó
  rationale: Đại từ Hy Lạp ở số nhiều quy chiếu về Sự Chết và Âm Phủ. Tiếng Việt tự nhiên dùng “đó” để quy chiếu chung đến hai thực thể vừa nêu, tránh cách nói gượng “ở trong chúng”.
- source_word: ἐκρίθησαν ἕκαστος
  choice: Mỗi người đều bị xét xử
  rationale: Giữ cả ý bị động của động từ và sức phân phối theo từng cá nhân của ἕκαστος, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: theo những việc mình đã làm
  rationale: “Những việc… đã làm” truyền đạt tự nhiên nghĩa của ἔργα trong ngữ cảnh xét xử. “Mình” quy chiếu phân phối về “mỗi người”, không thay đổi tiêu chuẩn xét xử của câu Hy Lạp.
theological_decisions:
- issue: Cách dịch ᾅδης trong bối cảnh phán xét thời tận cùng
  choice: Âm Phủ
  alternative: Ha-đét; cõi người chết; địa ngục
  rationale: “Âm Phủ” biểu đạt cõi người chết mà không đồng nhất ᾅδης với “hồ lửa” ở văn cảnh kế cận hoặc với thuật ngữ γέεννα. Chú thích ghi rõ từ Hy Lạp để tránh nhập các liên tưởng thần học không có trong nguyên văn.
- issue: Sự nhân cách hóa θάνατος
  choice: Sự Chết
  alternative: sự chết; cái chết
  rationale: 'Viết hoa giúp người đọc nhận ra hình ảnh nhân cách hóa: Sự Chết cùng với Âm Phủ hành động như những thực thể trao trả người chết, nhưng không biến hình ảnh ấy thành một khẳng định giáo lý ngoài câu văn.'
- issue: Tiêu chuẩn xét xử trong κατὰ τὰ ἔργα αὐτῶν
  choice: theo những việc mình đã làm
  alternative: theo các công việc của họ; căn cứ vào hành vi của họ
  rationale: Giữ nguyên lời khẳng định rằng từng người được xét xử theo việc làm, không diễn giải thêm mối quan hệ giữa việc làm, đức tin, ân điển hay sự cứu rỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “trao trả” để giữ hình ảnh mạnh của nguyên văn; viết hoa “Sự Chết” và “Âm Phủ” nhằm thể hiện sự nhân cách hóa trong văn chương khải huyền. Dấu chấm tách mệnh đề xét xử để câu tiếng Việt sáng rõ mà không thay đổi quan hệ ý nghĩa.
