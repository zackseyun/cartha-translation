id: REV.20.10
reference: Revelation 20:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: vi
  text: Và ma quỷ, kẻ lừa dối họ, bị ném vào hồ lửa và diêm sinh[a], nơi con thú và tiên tri giả cũng đang ở. Chúng sẽ bị dày vò ngày đêm, đời đời vô cùng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Diêm sinh” là lưu huỳnh.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa tiếng Hy Lạp: “vào các thời đại của các thời đại,” một thành ngữ nhấn mạnh thời gian không chấm dứt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: ma quỷ
  rationale: Trong sách Khải Huyền, từ này là danh xưng quen thuộc chỉ Sa-tan; “ma quỷ” là cách gọi tự nhiên, phổ biến trong tiếng Việt hiện đại.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: kẻ đã lừa dối họ
  rationale: Cụm phân từ có mạo từ nhận diện ma quỷ qua hoạt động lừa dối; cách diễn đạt này phù hợp với hành động kéo dài vừa được thuật lại trong mạch truyện.
- source_word: ἐβλήθη
  choice: bị ném
  rationale: Giữ thể bị động và sắc thái bị cưỡng bức quăng vào nơi phán xét.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: hồ lửa và diêm sinh
  rationale: θεῖον là lưu huỳnh; “diêm sinh” giữ được hình ảnh văn chương trang trọng, quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt, và được chú thích bằng từ hiện đại hơn.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: nơi con thú và tiên tri giả cũng đang ở đó
  rationale: Nguyên văn không có động từ; bổ sung “đang ở” theo hiện tại để diễn đạt sự hiện diện tiếp diễn từ 19:20, đồng thời không biến điều hàm ẩn thành chi tiết quá mức.
- source_word: θηρίον
  choice: con thú
  rationale: Cách dịch trực tiếp và nhất quán cho nhân vật khải huyền này.
- source_word: ψευδοπροφήτης
  choice: tiên tri giả
  rationale: Cách tương đương trực tiếp, rõ nghĩa và quen dùng trong tiếng Việt.
- source_word: βασανισθήσονται
  choice: chúng sẽ bị hành hạ
  rationale: Diễn đạt sự đau đớn nghiêm trọng trong bối cảnh phán xét mà không xác định thêm phương thức.
- source_word: ἡμέρας καὶ νυκτός
  choice: ngày đêm
  rationale: Thành ngữ tự nhiên trong tiếng Việt, biểu thị tính liên tục không gián đoạn.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Cách diễn đạt trang trọng, dễ hiểu cho thành ngữ Hy Lạp nhấn mạnh thời gian không chấm dứt; chú thích giữ dạng sát chữ.
theological_decisions:
- issue: Thời hạn của sự hình phạt trong εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  alternative: cho đến các thời đại của các thời đại
  rationale: Bản dịch thể hiện sức nhấn mạnh tự nhiên của thành ngữ Hy Lạp về thời gian không chấm dứt, không dùng câu này để giải quyết những tranh luận giáo lý rộng hơn.
- issue: Động từ được hiểu ngầm trong ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: đang ở
  alternative: đã ở
  rationale: 'Tiếng Hy Lạp lược bỏ động từ. Hiện tại tiếp diễn phù hợp nhất với văn cảnh: con thú và tiên tri giả đã bị ném vào đó ở 19:20 và hiện vẫn ở đó; đây là sự bổ sung ngữ pháp chứ không phải một khẳng định giáo lý ngoài nguyên văn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Còn” để nối mạch thuật chuyện; giữ hình ảnh khải huyền và thể bị động của nguyên văn. Đại từ số nhiều “chúng” quy chiếu tự nhiên đến ma quỷ, con thú và tiên tri giả.
