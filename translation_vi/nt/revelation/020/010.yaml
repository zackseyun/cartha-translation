revisions:
- from: Còn ma quỷ, kẻ đã lừa dối họ, bị ném vào hồ lửa và diêm sinh[a], nơi con thú và tiên tri giả cũng đang ở đó. Chúng sẽ bị hành hạ ngày đêm đời đời vô cùng[b].
  to: Và ma quỷ, kẻ lừa dối họ, bị ném vào hồ lửa và diêm sinh[a], nơi con thú và tiên tri giả cũng đang ở. Chúng sẽ bị dày vò ngày đêm, đời đời vô cùng[b].
