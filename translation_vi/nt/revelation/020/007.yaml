  rationale: Chỉnh nhẹ để diễn đạt tự nhiên hơn sự hoàn tất của thời kỳ được nói đến, đồng thời giữ rõ tính xác định của “một ngàn năm ấy”, tương lai bị động “sẽ được thả ra”, và sở hữu cách trong “ngục tù của Sa-tan”. Không diễn giải bản chất của một ngàn năm.
