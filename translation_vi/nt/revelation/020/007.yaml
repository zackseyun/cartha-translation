id: REV.20.7
reference: Revelation 20:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: vi
  text: Khi một ngàn năm ấy đã mãn, Sa-tan sẽ được thả ra khỏi ngục tù của Sa-tan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: Dẫn vào mệnh đề chỉ thời gian trong tương lai; “khi” tự nhiên và không thêm sắc thái diễn giải như “sau khi”.
- source_word: τελεσθῇ
  choice: kết thúc
  rationale: Diễn đạt việc một khoảng thời gian xác định đi đến điểm hoàn tất; tiếng Việt dùng “kết thúc” tự nhiên dù không biểu thị hình thái bị động như tiếng Hy Lạp.
- source_word: τὰ χίλια ἔτη
  choice: một ngàn năm ấy
  rationale: “Một ngàn năm” thể hiện con số của nguyên văn, còn “ấy” giữ tính xác định và liên hệ với khoảng thời gian đã được nhắc trước đó.
- source_word: λυθήσεται
  choice: sẽ được thả ra
  rationale: Giữ ý tương lai và bị động của động từ, đồng thời diễn đạt tự nhiên việc giải thoát khỏi tình trạng giam giữ mà không mang hàm ý tán thành.
- source_word: ὁ Σατανᾶς
  choice: Sa-tan
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên gọi này.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: ra khỏi nhà tù của hắn
  rationale: “Nhà tù” là nghĩa phù hợp của φυλακή trong bối cảnh bị giam giữ; “ra khỏi” thể hiện rõ chuyển động từ bên trong, và “của hắn” bảo toàn đại từ sở hữu αὐτοῦ.
theological_decisions:
- issue: Bản chất của một ngàn năm
  choice: Dịch trực tiếp là “một ngàn năm ấy”, không xác định đây là thời kỳ theo nghĩa đen hay biểu tượng.
  alternative: Hiểu là triều đại đúng một ngàn năm theo nghĩa đen, hoặc là một thời kỳ dài mang tính biểu tượng.
  rationale: Câu này nói đến một khoảng thời gian xác định đã được nhắc trong ngữ cảnh nhưng không tự giải quyết các hệ thống giải thích về thiên niên kỷ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hắn” cho đại từ chỉ Sa-tan để tránh sắc thái kính trọng; câu giữ trật tự thời gian và cấu trúc thụ động cốt lõi của nguyên văn.
