id: REV.20.5
reference: Revelation 20:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: vi
  text: Những người chết còn lại không sống lại cho đến khi một ngàn năm kết thúc.[a] Đây là sự sống lại thứ nhất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không sống cho đến khi một ngàn năm kết thúc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: những người chết còn lại
  rationale: Diễn đạt tự nhiên nhóm người chết còn lại, đối lập với nhóm đã được nói đến ở câu trước.
- source_word: οὐκ ἔζησαν
  choice: không sống lại
  rationale: Trong ngữ cảnh trực tiếp nói về sự sống lại, động từ ζάω ở đây có sắc thái bắt đầu sống; “sống lại” vừa tự nhiên trong tiếng Việt vừa phù hợp với ngữ cảnh. Chú thích giữ lại khả năng dịch sát hơn là “không sống”.
- source_word: ἄχρι τελεσθῇ
  choice: cho đến khi ... kết thúc
  rationale: Giữ rõ mốc thời gian mà ἄχρι biểu thị và ý hoàn tất của động từ τελέω.
- source_word: τὰ χίλια ἔτη
  choice: một ngàn năm
  rationale: Chỉ khoảng một ngàn năm cụ thể đã được nhắc đến trong văn cảnh; cách nói này trực tiếp và tự nhiên trong tiếng Việt.
- source_word: ἡ ἀνάστασις ἡ πρώτη
  choice: sự sống lại thứ nhất
  rationale: “Sự sống lại” là cách diễn đạt tiếng Việt thông dụng cho ἀνάστασις, còn “thứ nhất” bảo toàn trật tự phân hạng của πρώτη.
theological_decisions:
- issue: Đối tượng mà câu “Đây là sự sống lại thứ nhất” quy chiếu đến
  choice: Giữ đại từ chỉ định “Đây” có phạm vi rộng như nguyên văn, không xác định thêm một hệ thống thiên niên kỷ.
  alternative: Hiểu riêng về các người tử đạo ở câu 4; hiểu rộng về mọi người công chính đã chết; hoặc hiểu theo nghĩa thuộc linh thay vì thân thể.
  rationale: Nguyên văn chỉ khẳng định “Đây là sự sống lại thứ nhất”; việc giải thích chi tiết hơn sẽ đưa một lập trường cánh chung vào bản dịch.
- issue: Sắc thái của ἔζησαν
  choice: Dịch là “sống lại” theo ngữ cảnh sự sống lại ngay trong câu.
  alternative: “sống” hoặc hiểu là sống lại theo nghĩa thuộc linh.
  rationale: Ngữ cảnh nâng đỡ sắc thái bắt đầu sống, nhưng bản dịch không thêm lời xác định bản chất hay cơ chế của sự sống ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “một ngàn” thay vì dạng Hán-Việt “một nghìn” hoặc thuật ngữ diễn giải “thiên niên kỷ”; giữ câu ngắn, trực tiếp và không áp đặt một cách giải thích cánh chung.
