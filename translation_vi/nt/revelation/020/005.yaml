  source_fidelity: 'Bản dịch chuyển tải trung thành cấu trúc và ý nghĩa Hy Lạp: «Những người chết còn lại» tương ứng οἱ λοιποὶ τῶν νεκρῶν; «không sống lại» diễn đạt phù hợp οὐκ ἔζησαν trong ngữ cảnh phục sinh; «cho đến khi một ngàn năm kết thúc» giữ mốc hoàn tất của ἄχρι τελεσθῇ; và «Đây là sự sống lại thứ nhất» phản ánh sát αὕτη ἡ ἀνάστασις ἡ πρώτη. Cách dùng «một ngàn năm» vẫn có thể chỉ giai đoạn xác định đã nêu trong ngữ cảnh, dù tiếng Hy Lạp có mạo từ.'
