  terminology: «Người chết», «sống lại» và «sự sống lại thứ nhất» nhất quán, tự nhiên, và bảo toàn thuật ngữ then chốt mà không áp đặt cách giải thích cánh chung. Chú thích nêu đúng phương án từ vựng thay thế «sống».
