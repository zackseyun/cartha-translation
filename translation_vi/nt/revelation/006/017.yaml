id: REV.6.17
reference: Revelation 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: vi
  text: vì ngày trọng đại của cơn thịnh nộ của họ đã đến[a], và ai có thể đứng vững?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch mang tính diễn giải dùng “cơn thịnh nộ của Ngài”; nhưng bản Hy Lạp chép “của họ,” quy chiếu chung về Đấng ngự trên ngai và Chiên Con.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Liên từ nêu nguyên nhân cho nỗi kinh hoàng được mô tả ở câu trước; “vì” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἦλθεν
  choice: đã đến
  rationale: Thì aorist của ἔρχομαι diễn tả biến cố đã xảy đến và hiện đã thành hiện thực trong lời tuyên bố khải huyền.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: ngày lớn
  rationale: Giữ sắc thái long trọng và cánh chung của cụm từ Hy Lạp, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: τῆς ὀργῆς
  choice: của cơn thịnh nộ
  rationale: Trong bối cảnh phán xét, ὀργή mạnh hơn sự tức giận thông thường và mang sắc thái xét xử; “cơn thịnh nộ” truyền đạt phù hợp sức nặng ấy.
- source_word: αὐτῶν
  choice: của họ
  rationale: 'Đại từ số nhiều quy chiếu về hai nhân vật ở câu trước: Đấng ngự trên ngai và Chiên Con. Giữ nguyên số nhiều thay vì hòa giải thành số ít.'
- source_word: τίς δύναται
  choice: ai có thể
  rationale: Diễn đạt tự nhiên câu hỏi tu từ về khả năng chịu nổi sự phán xét.
- source_word: σταθῆναι
  choice: đứng vững được
  rationale: Trong ngữ cảnh phán xét, động từ không chỉ nói đến tư thế đứng mà hàm ý còn đứng nổi hoặc chịu đựng được; “đứng vững được” thể hiện rõ hàm ý ấy mà vẫn gần nguyên văn.
theological_decisions:
- issue: Đại từ số nhiều đi với “cơn thịnh nộ,” quy chiếu về Đấng ngự trên ngai và Chiên Con
  choice: Giữ cách diễn đạt số nhiều “cơn thịnh nộ của họ”
  alternative: Dịch là “cơn thịnh nộ của Ngài” hoặc quy về một chủ thể số ít
  rationale: Bản Hy Lạp SBLGNT đọc αὐτῶν, nghĩa là “của họ,” và ngữ cảnh ngay trước đó nêu hai đối tượng. Cách dịch này bảo tồn căng thẳng ngữ pháp và thần học trong bản văn, không tự ý giải quyết theo một cách diễn giải giáo lý.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Cơn thịnh nộ” giữ sắc thái phán xét mạnh; “đứng vững được” tự nhiên hơn lối dịch sát chữ “đứng” trong ngữ cảnh này. Dấu [a] được đặt ngay sau mệnh đề liên quan.
