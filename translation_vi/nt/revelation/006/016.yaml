id: REV.6.16
reference: Revelation 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: vi
  text: 'Họ nói với các núi và các tảng đá: “Hãy đổ xuống trên chúng tôi và che giấu chúng tôi khỏi trước mặt[a] Đấng ngự trên ngai và khỏi cơn thịnh nộ của Chiên Con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi sự hiện diện của Đấng ngự trên ngai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: Họ nói
  rationale: Thì hiện tại trong lời kể khải huyền được giữ như hiện tại sống động, tạo cảm giác trực tiếp mà không ép thành ý tiếp diễn.
- source_word: ὄρεσιν
  choice: núi non
  rationale: ὄρος chỉ núi; “núi non” tự nhiên trong tiếng Việt và giữ được quy mô mạnh mẽ của hình ảnh.
- source_word: πέτραις
  choice: các vầng đá
  rationale: πέτρα chỉ khối đá hay mỏm đá lớn; “vầng đá” tránh gợi những viên đá nhỏ và phù hợp với hình ảnh tìm nơi che phủ.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Hãy đổ xuống trên chúng tôi
  rationale: Mệnh lệnh aorist số nhiều diễn tả lời cầu xin khẩn thiết; cách dịch giữ rõ chuyển động rơi đổ xuống trên họ.
- source_word: κρύψατε ἡμᾶς
  choice: che khuất chúng tôi
  rationale: κρύπτω ở đây nói đến việc khiến họ không còn bị nhìn thấy; “che khuất” tự nhiên và hợp với hình ảnh núi đá phủ lên họ.
- source_word: ἀπὸ προσώπου
  choice: khỏi mặt
  rationale: Giữ nghĩa cụ thể của πρόσωπον là “mặt” và hình ảnh đáng sợ của cuộc đối diện trực tiếp; nghĩa hoán dụ “sự hiện diện” được nêu trong chú thích.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: Đấng ngự trên ngai
  rationale: Phân từ được danh từ hóa chỉ Đấng đang ở địa vị trị vì; “ngự” là cách diễn đạt trang trọng, tự nhiên trong tiếng Việt, còn “trên ngai” bám sát cấu trúc Hy Lạp.
- source_word: ὀργῆς
  choice: cơn thịnh nộ
  rationale: ὀργή trong bối cảnh phán xét mạnh hơn sự tức giận thông thường; “cơn thịnh nộ” giữ được sức nặng cánh chung.
- source_word: τοῦ ἀρνίου
  choice: Chiên Con
  rationale: ἀρνίον là tước hiệu Kitô học đặc trưng trong Khải Huyền; “Chiên Con” giữ nghịch lý giữa hình ảnh hy sinh hiền lành và thẩm quyền phán xét.
theological_decisions:
- issue: Các chủ thể phối hợp trong cảnh phán xét khải huyền
  choice: Giữ riêng biệt nhưng song hành “Đấng ngự trên ngai” và “Chiên Con” như hai đối tượng mà người ta muốn lẩn tránh.
  alternative: Gộp cả câu thành một cách nói chung chỉ về Đức Chúa Trời, hoặc làm nhẹ “cơn thịnh nộ của Chiên Con”.
  rationale: 'Bản Hy Lạp nêu hai cụm do ἀπό chi phối: προσώπου τοῦ καθημένου... và τῆς ὀργῆς τοῦ ἀρνίου. Bản dịch giữ nguyên sự phân biệt và nghịch lý thần học rằng Chiên Con chịu hy sinh cũng mang cơn thịnh nộ trong cuộc phán xét.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngự” và “ngai” để diễn tả địa vị trị vì; “vầng đá” giúp người đọc hình dung những khối hay mỏm đá lớn thay vì đá vụn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
