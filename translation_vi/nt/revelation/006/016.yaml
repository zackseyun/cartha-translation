review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng thì hiện tại sống động của λέγουσιν, hai mệnh lệnh số nhiều, hai đối tượng sau ἀπό, và lực phán xét của “cơn thịnh nộ của Chiên Con”. Tuy nhiên, “vầng đá” không phải cách gọi tự nhiên hay chính xác cho πέτραις trong ngữ cảnh các khối/mỏm đá có thể đổ xuống; “các tảng đá” truyền đạt tốt hơn. “Che khuất chúng tôi khỏi mặt...” cũng kém trực tiếp hơn κρύψατε ἡμᾶς và cấu trúc “khỏi trước mặt” tự nhiên hơn để diễn đạt ἀπὸ προσώπου.
  naturalness: “Các núi và các tảng đá” là cách nói rõ ràng, hiện đại. “Hãy đổ xuống trên chúng tôi và che giấu chúng tôi khỏi trước mặt Đấng ngự trên ngai” vừa trang trọng vừa tự nhiên trong văn mạch khải huyền. Chú thích được neo trực tiếp vào “trước mặt”, tức cụm được chú giải.
  terminology: Giữ “Đấng ngự trên ngai”, “cơn thịnh nộ”, và “Chiên Con” là nhất quán, trang trọng, và bảo toàn các thuật ngữ chủ đạo của Khải Huyền. Không cần giải quyết hay làm nhẹ sự phối hợp giữa Đấng ngự trên ngai và Chiên Con.
  issues:
  - severity: medium
    issue: “các vầng đá”
    rationale: “Vầng” thường gợi vật tròn, sáng hoặc một dải/lớp (như vầng trăng), không phải cách kết hợp tự nhiên với đá. πέτραις ở đây chỉ các khối hoặc mỏm đá lớn; “các tảng đá” phù hợp hơn.
  - severity: low
    issue: “che khuất chúng tôi khỏi mặt Đấng...”
    rationale: κρύψατε có nghĩa là “giấu/che giấu chúng tôi”; “che khuất” dễ chuyển trọng tâm sang việc che mờ một vật. Cụm “khỏi trước mặt Đấng” là thành ngữ tiếng Việt tự nhiên hơn và vẫn bảo toàn hình ảnh “mặt/presence” của προσώπου.
  - severity: low
    issue: Vị trí neo chú thích
    rationale: Chú thích về ἀπὸ προσώπου nên được đặt ngay sau “trước mặt”, thay vì sau “ngai”, để phạm vi chú giải được minh bạch.
