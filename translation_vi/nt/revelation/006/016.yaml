revisions:
- from: 'Họ nói với núi non và các vầng đá: “Hãy đổ xuống trên chúng tôi và che khuất chúng tôi khỏi mặt Đấng ngự trên ngai[a], và khỏi cơn thịnh nộ của Chiên Con.”'
  to: 'Họ nói với các núi và các tảng đá: “Hãy đổ xuống trên chúng tôi và che giấu chúng tôi khỏi trước mặt[a] Đấng ngự trên ngai và khỏi cơn thịnh nộ của Chiên Con.”'
  rationale: Sửa “vầng đá” thành “tảng đá” để phản ánh πέτρα cách tự nhiên và chính xác. Sửa động từ cùng cấu trúc giới từ thành “che giấu chúng tôi khỏi trước mặt” để truyền đạt trực tiếp κρύψατε ἡμᾶς ἀπὸ προσώπου mà vẫn giữ được khả năng hiểu “mặt” theo nghĩa “sự hiện diện” trong chú thích. Các yếu tố thần học và cú pháp trọng yếu còn lại được giữ nguyên.
  reviewer_model: gpt-5.6-terra
