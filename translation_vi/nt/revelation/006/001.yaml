  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: vi
  text: 'Tôi thấy khi Chiên Con mở một trong bảy ấn, và tôi nghe một trong bốn sinh vật nói bằng giọng như tiếng sấm: “Hãy đến!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đi ra!” nếu hiểu mệnh lệnh này dành cho người cưỡi ngựa, thay vì dành cho Giăng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: Chiên Con
  rationale: Trong sách Khải Huyền, từ này là tước hiệu chỉ Chúa Giê-su. “Chiên Con” là cách dịch trang trọng, quen thuộc và không nhấn quá mức sắc thái giảm nhẹ của hình thức từ.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: một trong bảy ấn
  rationale: Diễn đạt tự nhiên cấu trúc phân bộ, chỉ một chiếc ấn thuộc tổng số bảy ấn.
- source_word: ζῴων
  choice: sinh vật
  rationale: Trong ngữ cảnh phòng ngai, từ này chỉ các hữu thể sống đặc biệt, không phải thú vật thông thường; “sinh vật” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: ὡς φωνῇ βροντῆς
  choice: như tiếng sấm
  rationale: Giữ phép so sánh của nguyên văn và diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: Ἔρχου
  choice: Hãy đến!
  rationale: Mệnh lệnh của ἔρχομαι trực tiếp nhất là “hãy đến”; nguyên văn không nêu rõ người được truyền lệnh nên bản dịch chính không xác định đối tượng.
- source_word: ὅτε
  choice: khi
  rationale: Diễn đạt quan hệ thời gian trực tiếp giữa việc thấy và việc Chiên Con mở ấn.
- source_word: εἶδον
  choice: Tôi thấy
  rationale: Chuyển tải trực tiếp động từ trần thuật mà không thêm ý “nhìn” vốn không có trong nguyên văn.
- source_word: ἤκουσα
  choice: tôi nghe
  rationale: Cách dịch tiêu chuẩn, phù hợp mạch kể nối tiếp.
- source_word: λέγοντος
  choice: nói
  rationale: Diễn đạt tự nhiên phân từ trong tiếng Việt mà không thêm sắc thái như “kêu lớn” ngoài nguyên văn.
theological_decisions:
- issue: Đối tượng và sắc thái của mệnh lệnh Ἔρχου
  choice: Dịch “Hãy đến!” và không nêu rõ người được gọi trong chính văn.
  alternative: “Hãy đi ra!” nếu hiểu mệnh lệnh dành cho người cưỡi ngựa, thay vì dành cho Giăng.
  rationale: Tiếng Hy Lạp chỉ ghi mệnh lệnh “hãy đến” mà không xác định rõ đối tượng. Giữ nguyên sự bỏ ngỏ này tránh giải quyết thay cho người đọc một vấn đề diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chiên Con” như tước hiệu quen thuộc; “bốn sinh vật” tránh liên tưởng đến động vật thông thường. Dấu chấm than thể hiện mệnh lệnh mạnh, phù hợp hình ảnh tiếng sấm.
