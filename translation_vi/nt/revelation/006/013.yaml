source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: vi
  text: Các ngôi sao trên trời rơi xuống đất, như cây vả trút những trái chưa chín[a] khi bị gió mạnh lay chuyển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trái vả mùa đông,” “trái vả xanh” hoặc “trái vả muộn”; từ Hy Lạp chỉ loại trái vả chưa trưởng thành, bị rung rụng trước khi chín.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: các ngôi sao
  rationale: Giữ nghĩa thông thường và hình ảnh khải huyền của từ Hy Lạp, không diễn giải thành thiên sứ hay nhà cầm quyền.
- source_word: τοῦ οὐρανοῦ
  choice: trên trời
  rationale: Cách nói tự nhiên trong tiếng Việt cho nguồn gốc/vị trí của các ngôi sao, đồng thời giữ sắc thái vũ trụ của οὐρανός.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: rơi xuống đất
  rationale: Diễn đạt tự nhiên chuyển động hướng xuống mặt đất được cấu trúc động từ với εἰς thể hiện.
- source_word: συκῆ
  choice: cây vả
  rationale: Tên gọi tiếng Việt quen thuộc trong văn mạch Kinh Thánh dành cho cây sung Địa Trung Hải (fig tree).
- source_word: βάλλει
  choice: trút
  rationale: Trong ngữ cảnh cây mất quả vì gió, “trút” tự nhiên hơn nghĩa đen “ném” và gợi việc nhiều quả rụng xuống.
- source_word: ὀλύνθους
  choice: những trái chưa chín
  rationale: Truyền đạt rõ nghĩa của loại trái vả non hoặc chưa trưởng thành bị gió làm rụng trước khi chín; không áp đặt một cách phân loại thực vật quá hẹp.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: bị một cơn gió mạnh
  rationale: “Gió mạnh” diễn đạt tự nhiên sức lực của ἄνεμος μέγας trong tiếng Việt hiện đại.
- source_word: σειομένη
  choice: khi bị ... lay chuyển
  rationale: Giữ thể bị động và giá trị hoàn cảnh của phân từ hiện tại; “lay chuyển” phù hợp với tác động của gió lên cả cây.
theological_decisions:
- issue: Hình ảnh khải huyền về các ngôi sao rơi xuống đất
  choice: Giữ nguyên hình ảnh từ vựng “các ngôi sao trên trời rơi xuống đất” mà không thêm lời giải thích.
  alternative: Diễn giải các ngôi sao là thiên sứ, nhà cầm quyền hoặc một biểu tượng cụ thể.
  rationale: Bản văn không tự xác định đối tượng biểu trưng ngay trong câu này. Giữ hình ảnh nguyên dạng bảo toàn tính đa nghĩa và sức căng thần học của văn chương khải huyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu hình ảnh. Câu tiếng Việt giữ phép so sánh của nguyên văn, dùng “trút” và “lay chuyển” để tự nhiên mà vẫn bảo toàn sức mạnh của cảnh tượng. Dấu chú thích [a] được đặt ngay sau cụm từ có vấn đề từ vựng.
