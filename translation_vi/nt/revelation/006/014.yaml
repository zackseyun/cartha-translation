source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: vi
  text: Bầu trời bị tách ra như một cuộn sách đang được cuộn lại[a], và mọi núi và hải đảo đều bị dời khỏi chỗ của chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bầu trời rút đi” hoặc “bầu trời lìa đi.” Động từ Hy Lạp có thể diễn tả sự phân tách hoặc rút khỏi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: bầu trời
  rationale: Trong khải tượng về biến động vũ trụ này, từ ngữ chỉ khoảng không nhìn thấy phía trên mặt đất; “bầu trời” tự nhiên và không mặc nhiên chỉ nơi ngự của Đức Chúa Trời.
- source_word: ἀπεχωρίσθη
  choice: tách ra
  rationale: Động từ có thể diễn tả sự phân tách hoặc rút khỏi; “tách ra” giữ được hình ảnh và không khẳng định bầu trời bị tiêu biến.
- source_word: βιβλίον
  choice: cuộn sách
  rationale: Trong bối cảnh thế kỷ thứ nhất và với hành động cuộn lại, từ này chỉ một cuộn sách chứ không phải sách đóng gáy hiện đại.
- source_word: ἑλισσόμενον
  choice: đang được cuộn lại
  rationale: Dạng phân từ hiện tại bị động diễn tả tiến trình cuộn lại, phù hợp với hình ảnh cuộn sách.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: mọi núi cùng hải đảo
  rationale: πᾶν đi với các danh từ số ít mang ý nghĩa phân phối; cách dịch này bao quát từng núi và từng đảo, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: khỏi vị trí của mình
  rationale: Nguyên văn dùng số nhiều “khỏi các vị trí của chúng”; tiếng Việt có thể dùng “của mình” theo nghĩa phân phối cho từng núi và hải đảo.
- source_word: ἐκινήθησαν
  choice: đều bị dời
  rationale: Động từ bị động ở đây nói đến việc bị chuyển khỏi địa điểm, không chỉ là rung chuyển.
theological_decisions:
- issue: Thuật ngữ vũ trụ trong hình ảnh khải huyền
  choice: Dịch οὐρανός là “bầu trời”
  alternative: “trời” hoặc “thiên đàng”
  rationale: “Bầu trời” phù hợp với hiện tượng vũ trụ nhìn thấy trong khải tượng và tránh biến câu này thành một khẳng định không cần thiết về nơi ngự của Đức Chúa Trời.
- issue: Bản chất hành động của bầu trời
  choice: Dịch ἀπεχωρίσθη là “tách ra”
  alternative: “rút đi” hoặc “biến mất”
  rationale: “Tách ra” phản ánh trực tiếp nét nghĩa phân tách của động từ và giữ nguyên sự mơ hồ của hình ảnh, thay vì quả quyết đó là sự tiêu biến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cuộn sách” truyền đạt đúng vật thể cổ đại mà không cần chú thích văn hóa riêng; “hải đảo” giữ sắc thái trang trọng của văn chương khải huyền.
