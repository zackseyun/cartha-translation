  - severity: low
    issue: “khỏi vị trí của mình” làm giảm số nhiều của τῶν τόπων αὐτῶν.
    rationale: Cách nói phân phối trong tiếng Việt có thể chấp nhận được, nhưng “khỏi chỗ của chúng” vừa tự nhiên vừa giữ rõ các địa điểm riêng của các núi và hải đảo.
