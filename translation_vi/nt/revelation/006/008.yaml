  source_fidelity: 'Bản dịch truyền đạt trung thành các yếu tố chính: χλωρός là “xanh tái”; Sự Chết và Âm Phủ được nhân cách hóa nhưng phân biệt; αὐτοῖς là số nhiều; “một phần tư trái đất” phản ánh τὸ τέταρτον τῆς γῆς; và “dịch bệnh” cho ἐν θανάτῳ được giải thích minh bạch trong chú thích. Tuy nhiên, vế cuối hiện liệt kê các phương tiện không thật rõ quan hệ cú pháp của thú dữ với động từ “giết”. Bản sửa làm rõ rằng thú dữ là tác nhân/phương tiện cuối cùng, tương ứng với ὑπό.'
