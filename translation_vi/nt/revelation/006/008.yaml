  to: Tôi nhìn, và kìa, một con ngựa xanh tái[a]. Người ngồi trên lưng nó có tên là Sự Chết, và Âm Phủ đi theo cùng người ấy. Họ được ban quyền trên một phần tư trái đất, để giết bằng gươm, bằng nạn đói và bằng dịch bệnh[b], và để thú dữ trên đất giết.
