id: REV.6.8
reference: Revelation 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: vi
  text: Tôi nhìn, và kìa, một con ngựa xanh tái[a]. Người ngồi trên lưng nó có tên là Sự Chết, và Âm Phủ đi theo cùng người ấy. Họ được ban quyền trên một phần tư trái đất, để giết bằng gươm, bằng nạn đói và bằng dịch bệnh[b], và để thú dữ trên đất giết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một con ngựa tái nhợt.” Từ Hy Lạp χλωρός chỉ màu xanh hoặc xanh nhợt, ở đây gợi sắc tái bệnh hoạn.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “sự chết.” Trong danh mục hình phạt vang vọng Cựu Ước, đặc biệt Ê-xê-chi-ên 14, từ này có thể chỉ dịch bệnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: xanh tái
  rationale: Giữ sắc xanh nhợt được từ Hy Lạp biểu thị, đồng thời gợi vẻ tái bệnh hoặc tử thi; tự nhiên hơn cách ghép quá sát từng chữ.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: người ngồi trên lưng nó
  rationale: Diễn đạt minh bạch cấu trúc phân từ và xác định tự nhiên vị trí trên con ngựa.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: Người ngồi trên lưng nó có tên là Sự Chết
  rationale: Giữ rõ công thức gọi tên và sự nhân cách hóa của Θάνατος.
- source_word: Θάνατος
  choice: Sự Chết
  rationale: Viết hoa để thể hiện đây là tên của nhân vật được nhân cách hóa.
- source_word: ᾅδης
  choice: Âm Phủ
  rationale: Chỉ cõi người chết, phân biệt với hình phạt chung cuộc; tránh nhập khái niệm 'địa ngục' vào câu.
- source_word: μετ’ αὐτοῦ
  choice: cùng người ấy
  rationale: Giữ nghĩa căn bản 'cùng với'; kết hợp với 'đi theo' để câu tiếng Việt tự nhiên mà không đổi thành chỉ đơn thuần 'ở phía sau'.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: Họ được ban quyền
  rationale: Giữ ý quyền hạn được trao và lối bị động thần học, đồng thời diễn đạt gọn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: trên một phần tư trái đất
  rationale: τέταρτον là một phần tư; 'trái đất' phù hợp phạm vi rộng của cảnh phán xét.
- source_word: ἀποκτεῖναι
  choice: để giết
  rationale: Nghĩa trực tiếp, rõ ràng và hiện đại của động từ nguyên mẫu.
- source_word: ἐν ῥομφαίᾳ
  choice: bằng gươm
  rationale: Thể hiện phương tiện gây chết và giữ hình ảnh cổ điển của ῥομφαία.
- source_word: ἐν λιμῷ
  choice: nạn đói
  rationale: λιμός nói đến nạn đói, không chỉ cảm giác đói của cá nhân.
- source_word: ἐν θανάτῳ
  choice: dịch bệnh
  rationale: Trong danh mục hình phạt vang vọng Ê-xê-chi-ên 14, 'sự chết' có thể là cách gọi dịch bệnh; bản dịch này làm rõ thành ngữ nhưng giữ nghĩa sát chữ ở chú thích.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: và thú dữ trên đất
  rationale: 'Giữ sự chuyển đổi giới từ của nguyên văn: các tai họa trước là phương tiện, còn thú dữ là tác nhân.'
theological_decisions:
- issue: Cách dịch ᾅδης
  choice: Âm Phủ
  alternative: địa ngục; mồ mả; cõi người chết
  rationale: Nguyên văn phân biệt Sự Chết được nhân cách hóa với cõi người chết đi theo; 'Âm Phủ' không đồng nhất nơi này với hình phạt chung cuộc.
- issue: Ý nghĩa của ἐν θανάτῳ trong danh mục hình phạt
  choice: dịch bệnh
  alternative: sự chết
  rationale: Cách chọn phản ánh công thức phán xét trong Cựu Ước, đặc biệt Ê-xê-chi-ên 14, nhưng chú thích vẫn bảo tồn cách hiểu sát chữ và sự căng thẳng từ vựng.
- issue: Chủ thể số nhiều của αὐτοῖς
  choice: Họ được ban quyền
  alternative: chúng được ban quyền
  rationale: Đại từ số nhiều chỉ Sự Chết và Âm Phủ. Dùng 'họ' phù hợp với sự nhân cách hóa trong cảnh tượng mà không xác định thêm bản thể của hai nhân vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu hình ảnh; dùng “kìa” để giữ sắc thái thị kiến của ἰδού. “Xanh tái” bảo tồn màu sắc của χλωρός mà vẫn dễ hiểu. Các vế phương tiện được rút gọn tự nhiên trong tiếng Việt, còn sự khác biệt giữa ἐν và ὑπό được giữ qua “bằng” và tác nhân “thú dữ”.
