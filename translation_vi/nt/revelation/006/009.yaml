id: REV.6.9
reference: Revelation 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: vi
  text: Khi Chiên Con mở ấn thứ năm, tôi thấy dưới bàn thờ những linh hồn của những người đã bị sát tế[a] vì lời của Đức Chúa Trời và vì lời chứng họ có.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã bị sát hại” hoặc, theo lối truyền thống, “đã bị giết”. Động từ Hy Lạp mang sắc thái mạnh và có thể gợi đến việc sát tế.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “lời chứng mà họ có”. Từ Hy Lạp cũng có thể được dịch là “sự làm chứng” hoặc “chứng ngôn”.'
    reason: ambiguity
lexical_decisions:
- source_word: ἤνοιξεν
  choice: mở
  rationale: Cách dịch tự nhiên và chính xác của ἀνοίγω trong công thức mở các ấn; chủ ngữ được diễn đạt là “Chiên Con” theo ngữ cảnh trực tiếp để tiếng Việt rõ nghĩa.
- source_word: σφραγῖδα
  choice: ấn
  rationale: “Ấn” là thuật ngữ ngắn gọn, quen thuộc cho σφραγίς trong hình ảnh khải huyền.
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: dưới bàn thờ
  rationale: Giữ nguyên quan hệ không gian và hình ảnh tế tự mà không xác định thêm bàn thờ thuộc loại nào.
- source_word: ψυχὰς
  choice: linh hồn
  rationale: Phù hợp với cảnh tượng thị kiến về những người đã chết, đồng thời không biến hình ảnh này thành một khẳng định nhân học rộng hơn.
- source_word: ἐσφαγμένων
  choice: đã bị sát tế
  rationale: σφάζω chỉ hành động giết dữ dội và có âm hưởng hiến tế; “sát tế” nối kết tự nhiên với hình ảnh bàn thờ, mạnh hơn từ chung chung “bị giết”.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: vì lời của Đức Chúa Trời
  rationale: διά với đối cách biểu thị nguyên nhân; “vì” tự nhiên và giữ đúng quan hệ nhân quả.
- source_word: μαρτυρίαν
  choice: lời chứng
  rationale: Giữ sắc thái làm chứng/tuyên xưng của μαρτυρία và phù hợp với cách nói tiếng Việt.
- source_word: ἣν εἶχον
  choice: họ đã giữ
  rationale: Nghĩa đen là “họ có”; trong kết hợp với “lời chứng”, “đã giữ” tự nhiên hơn trong tiếng Việt nhưng không xác định lời chứng ấy là của ai.
theological_decisions:
- issue: Bản chất của ψυχὰς trong thị kiến
  choice: Dịch là “linh hồn” trong chính văn.
  alternative: “sinh mạng” hoặc “những người”
  rationale: “Linh hồn” bảo tồn nét đặc thù của thị kiến về những người đã chết dưới bàn thờ mà không dùng câu này để giải quyết toàn bộ vấn đề nhân học.
- issue: Sắc thái của ἐσφαγμένων
  choice: Dùng “đã bị sát tế”.
  alternative: “đã bị giết” hoặc “đã bị sát hại”
  rationale: Cách dịch này giữ sức nặng bạo lực và âm hưởng hiến tế của động từ, đặc biệt bên cạnh hình ảnh bàn thờ.
- issue: Đối tượng hoặc nội dung của μαρτυρία
  choice: Giữ cách nói “lời chứng họ đã giữ”.
  alternative: “lời chứng họ đã làm” hoặc “việc làm chứng về Chúa Giê-su”
  rationale: Nguyên văn không nêu rõ trong câu này lời chứng thuộc về ai hay có nội dung gì; không nên bổ sung một đối tượng thần học mà câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Chiên Con” để làm rõ đại từ chủ ngữ theo ngữ cảnh ngay trước đó; dùng “ấn”, “bàn thờ”, “linh hồn” nhằm bảo tồn hệ thống hình ảnh khải huyền và tế tự. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
