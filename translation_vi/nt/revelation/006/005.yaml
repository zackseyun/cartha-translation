id: REV.6.5
reference: Revelation 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: vi
  text: 'Khi Ngài mở ấn thứ ba, tôi nghe sinh vật thứ ba nói: “Hãy đến!”[a] Tôi nhìn, và kìa, một con ngựa đen; người ngồi trên nó cầm một cái cân[b] trong tay.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy lại đây!” Mệnh lệnh này có thể được hiểu là nói với Giăng, hoặc là lời gọi con ngựa cùng người ngồi trên nó xuất hiện.'
    reason: alternative_reading
  - marker: b
    text: Tức là một dụng cụ cân đo, có thể gọi là “cân đĩa”; trong văn cảnh này, có lẽ nó được dùng để cân chia lương thực.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: mở
  rationale: Cách diễn đạt trực tiếp và tự nhiên cho hành động mở một ấn; không thêm sắc thái ‘phá’ vốn không được động từ này đòi hỏi.
- source_word: σφραγῖδα τὴν τρίτην
  choice: ấn thứ ba
  rationale: Giữ nguyên thứ tự của chuỗi các ấn và dùng thuật ngữ ngắn gọn, quen thuộc trong văn cảnh Khải Huyền.
- source_word: ζῴου
  choice: sinh vật
  rationale: Chỉ hữu thể sống trong cảnh ngai trời, không phải một con vật thông thường; ‘sinh vật’ vừa tự nhiên vừa tránh xác định thêm bản chất của hữu thể này.
- source_word: Ἔρχου
  choice: Hãy đến!
  rationale: Giữ mệnh lệnh ngắn, mạnh của nguyên văn mà không xác định người hay vật được gọi.
- source_word: εἶδον … ἰδοὺ
  choice: tôi nhìn, và kìa
  rationale: Tái hiện diễn tiến sống động của thị kiến, đồng thời giữ lực nhấn của ἰδού bằng ‘kìa’.
- source_word: ἵππος μέλας
  choice: một con ngựa đen
  rationale: Dịch trực tiếp, bảo toàn màu sắc mang ý nghĩa biểu tượng trong thị kiến.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: người ngồi trên nó
  rationale: Theo sát cấu trúc phân từ của tiếng Hy Lạp và không diễn giải thêm bằng một danh xưng như ‘kỵ sĩ’.
- source_word: ζυγὸν
  choice: một cái cân
  rationale: Trong ngữ cảnh phân chia lương thực ở câu kế tiếp, từ này chỉ dụng cụ cân đo hơn là cái ách; ‘cái cân’ là cách nói hiện đại, dễ hiểu.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: trong tay
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; chủ thể sở hữu đã rõ từ ‘người ngồi trên nó’.
theological_decisions:
- issue: Đối tượng của mệnh lệnh Ἔρχου
  choice: Chỉ dịch “Hãy đến!” mà không nêu đối tượng được gọi.
  alternative: Có thể hiểu là lời gọi Giăng đến xem, hoặc lời triệu con ngựa và người cưỡi nó xuất hiện.
  rationale: Nguyên văn không nói rõ đối tượng của mệnh lệnh; bản dịch giữ nguyên sự mơ hồ thay vì giải quyết bằng diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ ngữ ngầm đã có tiền ngữ trong văn cảnh, “kìa” để giữ sắc thái thị kiến sống động, và tránh thêm các cách giải thích giáo phái vào chính văn.
