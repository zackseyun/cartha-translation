id: REV.6.2
reference: Revelation 6:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: vi
  text: Tôi nhìn xem, kìa, một con ngựa trắng. Người ngồi trên ngựa[b] cầm một cây cung; người ấy được ban cho một mão[a], rồi ra đi, chinh phục và để chinh phục.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một mão chiến thắng” hoặc “một vòng hoa chiến thắng.” Từ Hy Lạp στέφανος thường chỉ mão hay vòng hoa gắn với chiến thắng, khác với vương miện hoàng gia.'
    reason: lexical_alternative
  - marker: b
    text: Bản văn không cho biết người cưỡi ngựa là ai; có nhiều cách giải thích khác nhau.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: Tôi nhìn xem
  rationale: Diễn đạt hành vi thị kiến trong chuỗi khải tượng; tự nhiên hơn lối dịch đơn thuần “tôi thấy” khi đi cùng ἰδού.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ lời gọi chú ý đột ngột và sắc thái sống động của văn khải huyền bằng một từ trang trọng nhưng dễ hiểu.
- source_word: ἵππος λευκός
  choice: một con ngựa trắng
  rationale: Cụm danh từ không có mạo từ, giới thiệu một hình ảnh mới trong khải tượng.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Người ngồi trên ngựa
  rationale: Giữ cấu trúc phân từ và xác định rõ đại từ chỉ con ngựa, đồng thời phù hợp văn phong tiếng Việt.
- source_word: ἔχων τόξον
  choice: cầm một cây cung
  rationale: ἔχω có thể chỉ sở hữu hoặc cầm giữ; “cầm” tạo hình ảnh trực tiếp, tự nhiên trong cảnh tượng này.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: Người ấy được ban cho một mão triều thiên
  rationale: Giữ thể bị động thần học của ἐδόθη và dùng “mão triều thiên” cho στέφανος, đồng thời chú thích sắc thái vòng hoa/mão chiến thắng.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Phản ánh nghĩa cơ bản và hướng kể chuyện của động từ.
- source_word: νικῶν
  choice: vừa chiến thắng
  rationale: Phân từ hiện tại diễn tả hành động đi kèm và đang tiếp diễn; νικάω có thể mang nghĩa thắng, chế ngự hoặc chinh phục.
- source_word: ἵνα νικήσῃ
  choice: vừa tiến tới chiến thắng
  rationale: Diễn đạt mục đích/hướng tới của ἵνα với thể giả định, đồng thời tránh cách nói tiếng Việt gượng như “để mà chiến thắng” sau phân từ cùng gốc.
theological_decisions:
- issue: Danh tính người cưỡi ngựa trắng
  choice: Không xác định danh tính trong bản dịch.
  alternative: Đấng Christ hoặc một hình ảnh giống Đấng Christ; một nhà chinh phục hay đế quốc; kẻ chống Đấng Christ hoặc một nhà chinh phục lừa dối.
  rationale: Nguyên văn chỉ mô tả người cưỡi ngựa, vũ khí, mão và hành động, chứ không nêu danh tính. Bản dịch không áp đặt một cách giải nghĩa đang còn tranh luận.
- issue: Sắc thái của στέφανος
  choice: mão triều thiên, kèm chú thích về mão/vòng hoa chiến thắng
  alternative: mão chiến thắng; vòng hoa chiến thắng
  rationale: Từ này thường gắn với phần thưởng chiến thắng hơn là vương miện hoàng gia, nhưng ngữ cảnh không buộc phải diễn đạt hoàn toàn theo một sắc thái duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và giàu tính thị kiến. Dấu câu chia chuỗi liên từ Hy Lạp thành các câu tiếng Việt tự nhiên mà vẫn giữ nhịp diễn tiến. “Kìa” bảo tồn lời gọi chú ý; tránh dùng thuật ngữ diễn giải để định danh người cưỡi ngựa.
