revisions:
- from: Tôi nhìn xem, kìa, một con ngựa trắng! Người ngồi trên ngựa cầm một cây cung. Người ấy được ban cho một mão triều thiên[a], rồi đi ra, vừa chiến thắng vừa tiến tới chiến thắng.[b]
  to: Tôi nhìn xem, kìa, một con ngựa trắng. Người ngồi trên ngựa[b] cầm một cây cung; người ấy được ban cho một mão[a], rồi ra đi, chinh phục và để chinh phục.
  rationale: Sửa “mão triều thiên” thành “mão” để không áp đặt ý nghĩa vương quyền không có trong στέφανος. Sửa mệnh đề kết thành “chinh phục và để chinh phục” để phản ánh phân từ νικῶν và mệnh đề ἵνα νικήσῃ, đồng thời bảo toàn sự lặp nhấn mạnh của nguyên văn. Di chuyển ký hiệu chú thích danh tính đến cụm chỉ người cưỡi để neo chú thích đúng đối tượng; ký hiệu chú thích từ vựng được đặt ngay sau “mão.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:30Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các hình ảnh chính: ngựa trắng, người ngồi trên ngựa, cung, việc được ban cho στέφανος, và hành động đi ra. Tuy nhiên, “mão triều thiên” dễ đồng nhất στέφανος với vương miện hoàng gia (διάδημα), trái với sắc thái từ vựng được chính chú thích thừa nhận. Cụm “vừa chiến thắng vừa tiến tới chiến thắng” không chuyển đạt rõ cấu trúc νικῶν καὶ ἵνα νικήσῃ, trong đó vế sau biểu thị mục đích/kết quả hướng đến việc chinh phục.'
  naturalness: “Kìa” phù hợp văn phong khải huyền. “Ra đi, chinh phục và để chinh phục” giữ nhịp lặp có chủ ý của nguyên văn, tự nhiên và rõ hơn “vừa chiến thắng vừa tiến tới chiến thắng.”
  terminology: Dùng “mão” cho στέφανος, kèm chú thích về mão/vòng hoa chiến thắng, tránh gán sắc thái vương quyền của “triều thiên.” “Chinh phục” nhất quán với hình tượng và động từ νικάω trong ngữ cảnh này. Danh tính người cưỡi vẫn không được xác định.
  issues:
  - severity: medium
    issue: “mão triều thiên” cho στέφανος
    rationale: “Triều thiên” gợi vương miện hoàng gia và có nguy cơ làm mờ sự phân biệt giữa στέφανος (mão/vòng hoa, thường liên hệ chiến thắng) và διάδημα. Nguyên văn không xác định đây là vương miện hoàng gia.
  - severity: medium
    issue: “vừa chiến thắng vừa tiến tới chiến thắng”
    rationale: Cách diễn đạt này biến vế ἵνα νικήσῃ thành một ý song hành mơ hồ, thay vì giữ rõ hướng mục đích/kết quả “để chinh phục”; đồng thời “tiến tới chiến thắng” yếu hơn sắc thái chinh phục của νικάω trong câu.
