id: REV.6.12
reference: Revelation 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: vi
  text: Tôi thấy khi Chiên Con mở ấn thứ sáu, thì một trận động đất lớn xảy ra. Mặt trời trở nên đen như vải bao thô dệt bằng lông[a], và toàn bộ mặt trăng trở nên như máu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như vải bao bằng lông”; đây là loại vải thô làm từ lông, thường gắn với sự than khóc.'
    reason: Nêu cách diễn đạt khác cho σάκκος τρίχινος và giải thích ngắn gọn bối cảnh văn hóa của loại vải này.
lexical_decisions:
- source_word: εἶδον
  choice: Tôi thấy
  rationale: Động từ ở thì aorist thuật lại điều người thấy khải tượng đã chứng kiến; “Tôi thấy” tự nhiên và sát nghĩa.
- source_word: ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: Chiên Con mở ấn thứ sáu
  rationale: “Mở ấn thứ sáu” chuyển tải trực tiếp hình ảnh mở ấn. Chủ ngữ hàm ẩn trong động từ Hy Lạp được diễn đạt là “Chiên Con” theo chủ thể đã được xác lập trong mạch văn, tránh đại từ tiếng Việt mơ hồ.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: một trận động đất lớn xảy ra
  rationale: σεισμός trong ngữ cảnh này chỉ động đất; “xảy ra” thể hiện tính sự kiện của ἐγένετο bằng tiếng Việt tự nhiên.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: Mặt trời trở nên đen
  rationale: μέλας có nghĩa cụ thể là “đen”, còn “trở nên” giữ được mô thức lặp lại của ἐγένετο.
- source_word: ὡς σάκκος τρίχινος
  choice: như vải bao thô dệt bằng lông
  rationale: σάκκος là loại vải bao thô, còn τρίχινος cho biết chất liệu bằng lông; cách diễn đạt này rõ nghĩa với độc giả hiện đại.
- source_word: ἡ σελήνη ὅλη
  choice: toàn thể mặt trăng
  rationale: Diễn đạt rõ sự nhấn mạnh của ὅλη rằng mặt trăng trong toàn thể trở nên giống như máu.
- source_word: ἐγένετο ὡς αἷμα
  choice: trở nên như máu
  rationale: Giữ ὡς như một phép so sánh, không biến hình ảnh thành lời khẳng định rằng mặt trăng thực sự biến thành máu.
theological_decisions:
- issue: Bản chất của các dấu hiệu vũ trụ
  choice: Trình bày trực tiếp các hình ảnh khải tượng mà không xác định chúng là hiện tượng thiên văn theo nghĩa đen, biểu tượng, hay đồng thời mang cả hai phương diện.
  alternative: Giải thích rõ đây là thảm họa thiên văn theo nghĩa đen, hoặc chủ yếu là biểu tượng về sự phán xét và biến động chính trị.
  rationale: Bản Hy Lạp dùng các phép so sánh sinh động nhưng không tự giải quyết cuộc tranh luận rộng hơn về cách hiểu; bản dịch vì thế giữ nguyên sự căng thẳng diễn giải.
- issue: Chủ ngữ của ἤνοιξεν
  choice: Dùng “Chiên Con” theo chủ thể đã được xác lập trong văn cảnh gần.
  alternative: Dùng đại từ “Ngài” hoặc “vị ấy”.
  rationale: Tiếng Hy Lạp chỉ mã hóa chủ ngữ ngôi thứ ba số ít trong động từ, nhưng tiếng Việt cần chủ ngữ được diễn đạt rõ hơn. “Chiên Con” tự nhiên, không mơ hồ và phù hợp với văn cảnh mở các ấn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được ngắt sau cảnh động đất để tránh chuỗi liên từ quá dài trong tiếng Việt, trong khi vẫn giữ trình tự và nhịp dồn dập của khải tượng.
