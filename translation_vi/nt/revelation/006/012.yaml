revisions:
- from: Tôi thấy khi Chiên Con mở ấn thứ sáu, thì một trận động đất lớn xảy ra. Mặt trời trở nên đen như vải bao thô dệt bằng lông[a], và toàn thể mặt trăng trở nên như máu.
  to: Tôi thấy khi Chiên Con mở ấn thứ sáu, thì một trận động đất lớn xảy ra. Mặt trời trở nên đen như vải bao thô dệt bằng lông[a], và toàn bộ mặt trăng trở nên như máu.
  rationale: Chỉ thay “toàn thể mặt trăng” bằng “toàn bộ mặt trăng” để câu văn tự nhiên hơn trong tiếng Việt hiện đại. Các yếu tố còn lại được giữ vì phản ánh đúng từ vựng, cú pháp và tính hình tượng không được giải thích thêm của bản Hy Lạp.
  reviewer_model: gpt-5.6-terra
