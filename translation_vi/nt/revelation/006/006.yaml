id: REV.6.6
reference: Revelation 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: vi
  text: 'Tôi nghe như có một tiếng nói từ giữa bốn sinh vật ấy: “Một lít[a] lúa mì giá một đồng đơ-ni-ê[b], và ba lít lúa mạch giá một đồng đơ-ni-ê; còn dầu và rượu thì đừng làm hại[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là một choinix, đơn vị đo vật khô cổ đại xấp xỉ một lít, thường được xem là khoảng khẩu phần ngũ cốc hằng ngày của một người.
    reason: cultural_note
  - marker: b
    text: Một đồng đơ-ni-ê thường tương đương tiền công một ngày của người lao động; mức giá ở đây cho thấy tình trạng khan hiếm nghiêm trọng.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “đừng làm hư hỏng dầu và rượu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: như có một tiếng nói
  rationale: Cách diễn đạt này giữ sắc thái tri giác hoặc tương tự của ὡς, không khẳng định quá mức danh tính của người nói, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: từ giữa bốn sinh vật ấy
  rationale: “Từ giữa” diễn đạt vị trí hoặc nguồn phát của tiếng nói; “sinh vật” phân biệt các hữu thể quanh ngai với những con thú thù nghịch xuất hiện về sau trong sách Khải Huyền.
- source_word: Χοῖνιξ
  choice: một lít
  rationale: χοῖνιξ là đơn vị đo vật khô cổ đại xấp xỉ một lít và thường tương đương khẩu phần ngũ cốc hằng ngày của một người. Dùng đơn vị gần đúng dễ hiểu trong chính văn và giải thích độ xấp xỉ ở chú thích.
- source_word: σίτου
  choice: lúa mì
  rationale: Diễn đạt cụ thể σῖτος trong thế đối chiếu với κριθή, tức lúa mạch.
- source_word: δηναρίου
  choice: giá một đồng đơ-ni-ê
  rationale: Đây là sở hữu cách chỉ giá. “Giá” làm rõ quan hệ mua bán, còn tên đồng tiền cổ được giữ lại thay vì quy đổi tùy tiện sang tiền hiện đại.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: ba lít lúa mạch
  rationale: Giữ nhất quán cách diễn đạt đơn vị đo, đồng thời truyền đạt sự chênh lệch về lượng giữa lúa mì và lúa mạch ở cùng một mức giá.
- source_word: μὴ ἀδικήσῃς
  choice: đừng làm hại
  rationale: ἀδικέω ở đây có thể mang nghĩa gây hại hoặc làm hư hỏng. “Làm hại” giữ phạm vi nghĩa tương đối rộng; phương án “làm hư hỏng” được ghi ở chú thích.
- source_word: τὸ ἔλαιον καὶ τὸν οἶνον
  choice: dầu và rượu
  rationale: Cách dịch trực tiếp, tự nhiên; trong bối cảnh này dầu thường là dầu ô-liu nhưng không cần bổ sung mức độ cụ thể mà nguyên văn không nêu rõ.
theological_decisions:
- issue: Cách gọi ζῴων trong khải tượng quanh ngai
  choice: sinh vật
  alternative: thú vật; các con thú
  rationale: “Sinh vật” phản ánh nghĩa cơ bản là hữu thể sống và tránh khiến độc giả nhầm bốn hữu thể quanh ngai với các con thú thù nghịch xuất hiện về sau trong Khải Huyền.
- issue: Mức độ hiện đại hóa đơn vị đo và tiền tệ cổ
  choice: Dùng đơn vị thể tích hiện đại gần đúng nhưng giữ tên đồng tiền đơ-ni-ê
  alternative: Phiên âm cả choinix lẫn denarius; hoặc quy đổi cả hai sang đơn vị hiện đại
  rationale: Cách này giúp người đọc hình dung lượng ngũ cốc mà vẫn giữ bối cảnh kinh tế cổ đại. Chú thích nêu rõ phép quy đổi thể tích chỉ là xấp xỉ và giải thích giá trị tiền công của đồng đơ-ni-ê.
- issue: Ý nghĩa của mệnh lệnh đối với dầu và rượu
  choice: Giữ mệnh lệnh trực tiếp “đừng làm hại” mà không giải thích đối tượng tượng trưng
  alternative: Diễn giải thành bảo vệ hàng xa xỉ, cây trồng hoặc một tầng lớp xã hội
  rationale: Nguyên văn không giải thích tại sao dầu và rượu không bị làm hại; bản dịch giữ nguyên sự căng thẳng và không đưa một cách giải nghĩa biểu tượng riêng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu dẫn “nghe như có” giữ sắc thái khải tượng; lời công bố dùng cấu trúc giá cả ngắn gọn, tạo nhịp điệu nghiêm trọng. “Đơ-ni-ê” được phiên âm theo lối quen thuộc trong tiếng Việt và có chú thích văn hóa.
