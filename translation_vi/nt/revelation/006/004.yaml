revisions:
- from: Rồi một con ngựa khác đi ra[a], đỏ rực như lửa. Người ngồi trên nó được cho phép lấy sự bình an khỏi mặt đất[b], để người ta tàn sát lẫn nhau[c]; và người ấy được ban cho một thanh gươm lớn.
  to: Rồi một con ngựa khác đi ra[a], đỏ rực như lửa. Người ngồi trên nó được ban cho để lấy đi sự bình an khỏi mặt đất[b], để người ta tàn sát lẫn nhau[c]; và người ấy được ban cho một thanh gươm lớn.
  rationale: Thay “được cho phép lấy” bằng “được ban cho để lấy đi” để giữ hai thể bị động ἐδόθη mà không xác định người ban hay diễn giải loại quyền được ban. Đồng thời, “lấy đi ... khỏi” là cách diễn đạt tự nhiên hơn trong tiếng Việt và vẫn phản ánh chính xác hành động lấy hòa bình ra khỏi mặt đất.
