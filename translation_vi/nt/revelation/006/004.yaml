id: REV.6.4
reference: Revelation 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: vi
  text: Rồi một con ngựa khác đi ra[a], đỏ rực như lửa. Người ngồi trên nó được ban cho để lấy đi sự bình an khỏi mặt đất[b], để người ta tàn sát lẫn nhau[c]; và người ấy được ban cho một thanh gươm lớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch ngắn gọn là “một con ngựa đỏ.” Tính từ Hy Lạp πυρρός gợi cụ thể sắc đỏ như lửa.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp γῆ có thể chỉ “mặt đất,” “đất” hoặc “xứ.” Ở đây, “mặt đất” phù hợp với tầm vóc rộng lớn của khải tượng, nhưng nguyên văn không hoàn toàn loại trừ nghĩa hẹp hơn.
    reason: lexical_alternative
  - marker: c
    text: Động từ được dịch là “tàn sát” mạnh hơn từ thông thường có nghĩa là “giết,” và gợi cảnh đổ máu dữ dội.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: khác
  rationale: Trong mạch khải tượng nối tiếp, từ này chỉ một con ngựa tiếp theo, khác với con trước.
- source_word: ἵππος πυρρός
  choice: con ngựa... đỏ rực như lửa
  rationale: πυρρός không chỉ màu đỏ nói chung mà gợi sắc đỏ của lửa; cách diễn đạt này giữ được hình ảnh sống động và vẫn tự nhiên trong tiếng Việt.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: người ngồi trên nó
  rationale: Giữ sát cấu trúc phân từ của nguyên văn, thay vì diễn giải gọn thành “kỵ sĩ”.
- source_word: ἐδόθη αὐτῷ λαβεῖν
  choice: được cho phép lấy
  rationale: Cách dịch bị động và tự nhiên trong tiếng Việt, không nêu rõ chủ thể ban phép; sắc thái được trao quyền được hàm chứa trong cấu trúc Hy Lạp.
- source_word: τὴν εἰρήνην ἐκ τῆς γῆς
  choice: sự bình an khỏi mặt đất
  rationale: “Sự bình an” phù hợp với εἰρήνη trong bối cảnh đối lập với bạo lực; “mặt đất” giữ nghĩa rộng của γῆ mà không loại trừ nghĩa “đất/xứ” có thể có.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: để người ta tàn sát lẫn nhau
  rationale: “Để” bảo toàn quan hệ mục đích/kết quả của ἵνα; “tàn sát” truyền đạt sức nặng bạo liệt của σφάζω mạnh hơn từ chung chung “giết”.
- source_word: μάχαιρα μεγάλη
  choice: một thanh gươm lớn
  rationale: “Gươm” là cách gọi rõ ràng, trang trọng và phù hợp với hình ảnh khải huyền; “lớn” giữ trực tiếp tính từ μεγάλη.
theological_decisions:
- issue: Thể bị động trong hai mệnh đề ἐδόθη
  choice: Giữ cách nói bị động “được cho phép” và “được ban cho”, không nêu người ban
  alternative: “Đức Chúa Trời cho phép” hoặc “Đức Chúa Trời ban cho”
  rationale: Nguyên văn không chỉ rõ tác nhân. Giữ thể bị động bảo toàn lối diễn đạt và sự căng thẳng thần học về quyền tể trị hay sự cho phép của Đức Chúa Trời mà không giải thích thay cho bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp nối tiếp của khải tượng bằng “Rồi”; tránh thuật ngữ giáo phái và không xác định tác nhân của các thể bị động.
