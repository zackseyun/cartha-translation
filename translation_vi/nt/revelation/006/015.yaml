id: REV.6.15
reference: Revelation 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: vi
  text: Các vua trên đất, các bậc quyền quý, các tướng lĩnh, những người giàu có, những kẻ hùng mạnh, cùng mọi người, dù là nô lệ hay người tự do, đều ẩn mình trong các hang động và giữa những vách đá trên núi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: γῆ có thể là “đất” hoặc “xứ”; trong bối cảnh phán xét mang tầm vóc toàn thế giới của Khải Huyền, “trên đất” phù hợp với phạm vi và cách dùng lặp lại của sách.
- source_word: μεγιστᾶνες
  choice: các bậc quyền quý
  rationale: Từ này chỉ những người có địa vị cao hoặc nổi bật. “Các bậc quyền quý” tự nhiên trong tiếng Việt và không giới hạn quá hẹp vào tầng lớp quý tộc cha truyền con nối.
- source_word: χιλίαρχοι
  choice: các tướng lĩnh
  rationale: Nghĩa đen là người chỉ huy một nghìn quân; “các tướng lĩnh” truyền đạt rõ cấp chỉ huy quân sự mà không dùng thuật ngữ cổ hoặc gượng ép.
- source_word: πλούσιοι
  choice: những người giàu có
  rationale: Diễn đạt tự nhiên tính từ được danh từ hóa, giữ nguyên nhóm người được xác định theo của cải.
- source_word: ἰσχυροὶ
  choice: những kẻ hùng mạnh
  rationale: Giữ sắc thái sức mạnh và quyền lực của ἰσχυροί, đồng thời phân biệt tương đối với địa vị xã hội đã được nêu ở các nhóm trước.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: mọi người, dù là nô lệ hay người tự do
  rationale: Cặp đối lập nô lệ/tự do cho thấy địa vị lệ thuộc là trọng tâm. Cấu trúc “mọi người, dù là...” chuyển tải tự nhiên lực đại diện của cặp giống đực số ít, bao gồm mọi người thuộc hai địa vị.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: đều ẩn mình
  rationale: Diễn đạt tự nhiên ý phản thân “giấu chính mình”; “đều” giúp liên kết toàn bộ danh sách chủ thể với động từ số nhiều.
- source_word: εἰς τὰ σπήλαια
  choice: trong các hang động
  rationale: Sau động từ “ẩn mình”, tiếng Việt tự nhiên dùng quan hệ vị trí “trong”; kết quả của chuyển động vào nơi ẩn náu vẫn được bảo toàn.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: giữa những vách đá trên núi
  rationale: πέτραι trong ngữ cảnh chỉ các khối đá, vách đá hoặc khe đá thuộc vùng núi. Cách dịch này diễn đạt một nơi có thể ẩn náu tự nhiên hơn lối dịch máy móc “vào trong đá”.
theological_decisions:
- issue: Cách dịch δοῦλος trong cặp nô lệ/người tự do
  choice: nô lệ
  alternative: đầy tớ
  rationale: Sự đối lập trực tiếp với ἐλεύθερος làm nổi bật địa vị xã hội bị lệ thuộc; “nô lệ” bảo toàn sự tương phản rõ hơn “đầy tớ”.
- issue: Phạm vi giới tính của πᾶς δοῦλος καὶ ἐλεύθερος
  choice: mọi người, dù là nô lệ hay người tự do
  alternative: mỗi người nam nô lệ và tự do
  rationale: Dù các từ Hy Lạp ở giống đực số ít, đây là cặp phân loại xã hội có chức năng đại diện. “Mọi người” giữ đúng phạm vi bao quát mà không áp đặt sự giới hạn chỉ dành cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp liệt kê dồn dập của nguyên văn, nhưng dùng các cụm từ tự nhiên trong tiếng Việt. Không thêm chú thích vì các lựa chọn thay thế không tạo ra khác biệt thiết yếu cần xuất bản ở câu này.
