id: REV.6.11
reference: Revelation 6:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: vi
  text: Mỗi người trong số họ được ban một áo choàng trắng, và họ được bảo phải nghỉ ngơi thêm ít lâu, cho đến khi những người đồng nô lệ và anh em của họ[b]—những người cũng sắp bị giết như chính họ—được làm cho trọn đủ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói đơn giản là “được làm cho trọn đủ/được hoàn tất.” Cũng có thể hiểu là “đủ số,” nhưng từ “số” không xuất hiện trong tiếng Hy Lạp.
    reason: alternative_reading
  - marker: b
    text: “Anh em” dịch danh từ giống đực số nhiều trong tiếng Hy Lạp; tại đây từ này có thể chỉ các anh chị em cùng đức tin nói chung, kể cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: một chiếc áo choàng trắng
  rationale: στολή chỉ áo dài hoặc áo choàng; “áo choàng” tự nhiên trong tiếng Việt và tránh gợi đến trang phục Việt Nam mang tên “áo dài.”
- source_word: ἑκάστῳ
  choice: mỗi người trong số họ
  rationale: Diễn đạt rõ sắc thái phân phối của đại từ số ít ở cách cho.
- source_word: ἐρρέθη αὐτοῖς
  choice: họ được bảo
  rationale: Giữ thể bị động nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: phải nghỉ ngơi thêm một thời gian ngắn
  rationale: “Nghỉ ngơi” giữ nghĩa căn bản của ἀναπαύω; “thêm một thời gian ngắn” thể hiện cả ἔτι và χρόνον μικρόν mà không đổi thành ý “chờ đợi.”
- source_word: πληρωθῶσιν
  choice: được trọn đủ
  rationale: Giữ ý bị động về sự hoàn tất hoặc đạt mức đầy đủ, đồng thời không tự ý thêm danh từ “số lượng” vốn không có trong tiếng Hy Lạp.
- source_word: σύνδουλοι
  choice: các bạn đồng nô lệ
  rationale: σύνδουλος nói về những người cùng là nô lệ dưới một chủ; “đồng nô lệ” giữ được quan hệ lệ thuộc mạnh hơn “đồng đầy tớ.”
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên ngữ; trong cách dùng của cộng đồng Cơ Đốc thời đầu, từ này cũng có thể chỉ rộng hơn đến các tín hữu.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: những người cũng sắp bị giết
  rationale: “Sắp” thể hiện tính tương lai gần hoặc điều đang chờ xảy đến của μέλλω mà không tăng sắc thái tiền định.
- source_word: ὡς καὶ αὐτοί
  choice: như chính họ
  rationale: Cụm từ so sánh quy chiếu về những người đã bị giết; “chính họ” làm rõ sự đối chiếu mà không thêm nội dung.
theological_decisions:
- issue: Ý nghĩa của πληρωθῶσιν khi chủ thể là các bạn đồng nô lệ và anh em
  choice: được trọn đủ
  alternative: đủ số; được hoàn tất; được ứng nghiệm
  rationale: Nguyên ngữ không có từ “số” và có thể nói về việc nhóm người được làm cho đầy đủ hoặc hoàn tất. Cách dịch chính giữ độ mở này thay vì xác định một sơ đồ số lượng cụ thể.
- issue: Phạm vi giới tính của ἀδελφοί
  choice: anh em
  alternative: anh chị em; các tín hữu
  rationale: Bản chính giữ danh từ giống đực số nhiều của nguyên ngữ, còn chú thích cho biết từ này trong ngữ cảnh cộng đồng có thể bao gồm cả phụ nữ.
- issue: Sắc thái của σύνδουλοι
  choice: các bạn đồng nô lệ
  alternative: các bạn đồng đầy tớ
  rationale: Hình ảnh cùng thuộc về một chủ là nổi bật trong từ σύνδουλος; “đồng nô lệ” giữ quan hệ lệ thuộc ấy mà không làm nhẹ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thể bị động của nguyên ngữ ở các điểm quan trọng. Dấu gạch ngang giúp mệnh đề nói về những người sắp bị giết gắn rõ với cả “các bạn đồng nô lệ” lẫn “anh em.”
