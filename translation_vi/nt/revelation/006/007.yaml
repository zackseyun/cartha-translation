id: REV.6.7
reference: Revelation 6:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: vi
  text: 'Khi Chiên Con mở ấn thứ tư, tôi nghe tiếng của sinh vật thứ tư nói: “Hãy đến!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: “Hãy đi ra!” Tiếng Hy Lạp sát nghĩa hơn là “Hãy đến!”, nhưng có những cách hiểu khác nhau về việc mệnh lệnh này dành cho Giăng hay cho kỵ sĩ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: mở
  rationale: Động từ aorist của ἀνοίγω được diễn đạt tự nhiên là “mở”; chủ ngữ “Chiên Con” được lấy từ ngữ cảnh trực tiếp của chuỗi mở ấn trong Khải Huyền 6 để tiếng Việt rõ và tự nhiên.
- source_word: σφραγῖδα
  choice: ấn
  rationale: Trong ngữ cảnh cuộn sách được niêm phong, “ấn” là thuật ngữ tiếng Việt ngắn gọn, quen thuộc và chính xác.
- source_word: τετάρτην / τετάρτου
  choice: thứ tư
  rationale: Hai tính từ số thứ tự đều được dịch nhất quán là “thứ tư”.
- source_word: φωνὴν
  choice: tiếng
  rationale: “Nghe tiếng của…” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn chỉ rõ nguồn phát tiếng nhờ cụm sở hữu theo sau.
- source_word: ζῴου
  choice: sinh vật
  rationale: Ở Khải Huyền, ζῷον chỉ các hữu thể sống quanh ngai, không phải thú vật thông thường; “sinh vật” phân biệt chúng với θηρίον, thường được dịch là “con thú”.
- source_word: λέγοντος
  choice: nói
  rationale: Phân từ hiện tại được chuyển thành động từ “nói” trong cấu trúc tiếng Việt tự nhiên “nghe tiếng… nói”.
- source_word: Ἔρχου
  choice: Hãy đến!
  rationale: Mệnh lệnh ἔρχου có nghĩa trực tiếp là “hãy đến”; bản dịch không nêu người được truyền lệnh để giữ nguyên sự mơ hồ của nguyên văn.
theological_decisions:
- issue: Đối tượng nhận mệnh lệnh Ἔρχου
  choice: Dịch đơn giản là “Hãy đến!” mà không xác định người được gọi.
  alternative: Có thể hiểu lời này nói với Giăng hoặc truyền cho kỵ sĩ tiến ra.
  rationale: Bản Hy Lạp chỉ có mệnh lệnh Ἔρχου và không nêu rõ đối tượng; giữ nguyên lệnh trần trụi bảo toàn sự căng thẳng và mơ hồ của trình thuật.
- issue: Chủ ngữ hàm ẩn của ἤνοιξεν
  choice: Diễn đạt là “Chiên Con” theo chủ thể đang mở các ấn trong ngữ cảnh trực tiếp.
  alternative: Dịch sát hình thức là “ngài mở” hoặc “người mở”.
  rationale: Tiếng Việt tự nhiên thường cần nêu lại chủ thể; “Chiên Con” làm rõ đại từ hàm ẩn từ ngữ cảnh mà không thay đổi căn tính của nhân vật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chiên Con”, “ấn”, “sinh vật” theo thuật ngữ nhất quán của văn mạch Khải Huyền; câu ngắn giữ nhịp kể trang nghiêm.
