id: REV.6.3
reference: Revelation 6:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: vi
  text: 'Khi Chiên Con mở ấn thứ hai, tôi nghe sinh vật thứ hai nói: “Hãy đến!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đi!” Một số người hiểu mệnh lệnh này là dành cho người cưỡi ngựa, thay vì là lời gọi đến gần.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Khi
  rationale: Trong tiếng Việt, không cần dịch Καὶ thành “Và” ở đầu câu; quan hệ tiếp nối vẫn được thể hiện tự nhiên bằng mệnh đề thời gian mở đầu với ὅτε.
- source_word: ὅτε ἤνοιξεν
  choice: Khi Chiên Con mở
  rationale: “Khi… mở” chuyển đúng quan hệ thời gian và nghĩa của ἀνοίγω. Chủ thể hàm ẩn được nêu là “Chiên Con” theo ngữ cảnh trực tiếp của Khải Huyền 6:1, giúp câu tiếng Việt rõ nghĩa mà không thay đổi quy chiếu.
- source_word: τὴν σφραγῖδα τὴν δευτέραν
  choice: ấn thứ hai
  rationale: “Ấn” là cách gọi tự nhiên, trang trọng cho con dấu niêm phong trong ngữ cảnh cuộn sách; trật tự “ấn thứ hai” phù hợp tiếng Việt và giữ số thứ tự.
- source_word: ἤκουσα
  choice: tôi nghe
  rationale: Diễn đạt trực tiếp động từ ἀκούω ở thể kể chuyện.
- source_word: τοῦ δευτέρου ζῴου
  choice: sinh vật thứ hai
  rationale: ζῷον ở đây chỉ một hữu thể sống quanh ngai, không phải thú vật thông thường; “sinh vật” rõ nghĩa và tránh hàm ý sai.
- source_word: λέγοντος
  choice: nói
  rationale: Cấu trúc “nghe… nói” là cách diễn đạt tiếng Việt tự nhiên cho phân từ λέγοντος lệ thuộc vào ἤκουσα.
- source_word: Ἔρχου
  choice: Hãy đến!
  rationale: Nghĩa trực tiếp của mệnh lệnh ἔρχου là “hãy đến”; dấu chấm than thể hiện lực mệnh lệnh mà không xác định thêm người được gọi.
theological_decisions:
- issue: Cách dịch Ἔρχου và đối tượng nhận mệnh lệnh
  choice: Hãy đến!
  alternative: Hãy đi!
  rationale: Giữ nghĩa từ vựng thông thường là “đến” trong chính văn, nhưng ghi chú cách hiểu “đi” khi lời truyền được xem là hướng đến người cưỡi ngựa. Không tự quyết định đối tượng nhận lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chiên Con” theo quy chiếu trong ngữ cảnh; “sinh vật” tránh khiến độc giả hiểu ζῷον là động vật bình thường. Dấu chú thích [a] được đặt ngay sau lời truyền mà chú thích giải thích.
