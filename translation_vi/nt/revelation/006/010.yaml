id: REV.6.10
reference: Revelation 6:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: vi
  text: 'Họ lớn tiếng kêu lên rằng: “Lạy Chủ Tể, Đấng thánh khiết và chân thật, cho đến bao giờ Ngài còn chưa xét xử và đòi lại huyết của chúng con từ tay những kẻ cư ngụ trên đất?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chủ Tể” dịch danh xưng Hy Lạp despótēs, nhấn mạnh quyền làm chủ và thẩm quyền tuyệt đối; danh xưng này khác với kýrios, thường được dịch là “Chúa”. Cụm “từ tay những kẻ cư ngụ trên đất” diễn tả việc đòi lại huyết từ những người ấy; cũng có thể diễn đạt là “báo thù cho huyết chúng con trên những kẻ cư ngụ trên đất”. “Những kẻ cư ngụ trên đất” là một cách gọi mang tính chủ đề, xuất hiện nhiều lần trong sách Khải Huyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: Họ kêu lớn
  rationale: Diễn đạt tự nhiên trong tiếng Việt cả động từ chỉ tiếng kêu khẩn thiết lẫn cụm chỉ âm lượng, không cần giữ cách nói kém tự nhiên ‘bằng một tiếng lớn’.
- source_word: Ἕως πότε
  choice: cho đến bao giờ
  rationale: Cách nói tự nhiên của lời than van về việc hành động bị trì hoãn, đồng thời giữ sắc thái khẩn cầu.
- source_word: δεσπότης
  choice: Chủ Tể
  rationale: Giữ ý về quyền làm chủ và thẩm quyền tuyệt đối, đồng thời phân biệt với κύριος, thường được dịch là ‘Chúa’.
- source_word: ὁ ἅγιος καὶ ἀληθινός
  choice: thánh khiết và chân thật
  rationale: Giữ hai phẩm tính đặt song song của Đấng được thưa với; ‘chân thật’ có thể bao hàm cả sự chân thực và đáng tin cậy.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: Ngài mới xét xử và báo trả
  rationale: Trong câu hỏi với ‘cho đến bao giờ’, hiện tại Hy Lạp hướng đến hành động công lý vẫn đang bị trì hoãn; ‘mới’ thể hiện điều đó tự nhiên. ‘Báo trả’ giữ sắc thái tư pháp của ἐκδικέω mà không biến lời cầu xin thành hành vi trả thù cá nhân.
- source_word: τὸ αἷμα ἡμῶν
  choice: huyết chúng con
  rationale: Giữ nguyên hình ảnh Kinh Thánh về máu đã đổ do bị sát hại; ‘huyết’ phù hợp với văn phong trang trọng và cụm từ này.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: nơi những kẻ cư ngụ trên đất
  rationale: ἐκ có thể nêu những người mà từ họ sự báo trả được đòi hỏi, trong khi toàn cụm là danh xưng lặp lại trong Khải Huyền. ‘Nơi’ giữ được phần nào độ mở giữa nguồn và đối tượng của hành động.
theological_decisions:
- issue: Danh xưng dành cho Đức Chúa Trời δεσπότης
  choice: Chủ Tể
  alternative: Chúa Tể; Chúa toàn quyền
  rationale: ‘Chủ Tể’ vừa trang trọng vừa phản ánh quyền sở hữu và quyền tuyệt đối, không đồng nhất danh xưng này với κύριος và không thêm tính từ ‘toàn quyền’ vốn không hiện diện riêng trong câu.
- issue: Lời cầu xin xét xử và báo trả
  choice: xét xử và báo trả huyết chúng con
  alternative: xét xử và báo thù cho huyết chúng con; xét xử và minh oan cho chúng con
  rationale: Bản dịch giữ nguyên sức nặng xét xử–báo trả của câu Hy Lạp, không làm nhẹ thành chỉ ‘minh oan’, nhưng cũng tránh gợi rằng các vị tử đạo tự mình thực hiện sự trả thù.
- issue: Quan hệ của ἐκ với những kẻ cư ngụ trên đất
  choice: báo trả huyết chúng con nơi những kẻ cư ngụ trên đất
  alternative: báo trả huyết chúng con trên những kẻ cư ngụ trên đất; đòi huyết chúng con từ những kẻ cư ngụ trên đất
  rationale: Cấu trúc có thể được hiểu theo hướng nguồn mà sự báo trả được đòi hỏi hoặc những người chịu hành động báo trả. Cách dịch chính tránh khép lại hoàn toàn độ mở này; chú thích nêu rõ các khả năng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Giữ ‘Chủ Tể’ và ‘huyết’ để bảo toàn sắc thái uy nghiêm cùng hình ảnh Kinh Thánh; cấu trúc lời cầu xin được diễn đạt tự nhiên bằng ‘cho đến bao giờ... mới’. Mọi dấu chú thích đều có mặt trong chính văn.
