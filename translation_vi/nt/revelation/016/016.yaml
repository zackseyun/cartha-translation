revisions:
- from: Rồi vị ấy[a] tập hợp họ tại nơi mà tiếng Hê-bơ-rơ gọi là Ha-ma-ghê-đôn[b].
  to: Rồi kẻ ấy[a] tập hợp họ đến nơi mà trong tiếng Hê-bơ-rơ được gọi là Ha-ma-ghê-đôn[b].
  rationale: Thay “vị ấy” bằng “kẻ ấy” để không thêm sắc thái kính ngữ hay xác định tác nhân là một nhân vật đáng tôn kính; vẫn giữ số ít của động từ SBLGNT và sự mơ hồ về tác nhân. Thay “tại nơi” bằng “đến nơi” để phản ánh εἰς. Cấu trúc bị động “trong tiếng Hê-bơ-rơ được gọi là” tự nhiên hơn và sát với καλούμενον. Các neo chú thích được giữ nguyên và nội dung chú thích a được đồng bộ với bản văn sửa đổi.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:43Z'
