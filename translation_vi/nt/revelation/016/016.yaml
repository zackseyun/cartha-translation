id: REV.16.16
reference: Revelation 16:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: vi
  text: Rồi kẻ ấy[a] tập hợp họ đến nơi mà trong tiếng Hê-bơ-rơ được gọi là Ha-ma-ghê-đôn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp dùng động từ số ít: “kẻ ấy/nó tập hợp họ.” Tuy nhiên, các câu 13–14 nói các tà linh đi tập hợp các vua, nên theo ngữ cảnh cũng có thể hiểu: “chúng tập hợp họ.”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể hiểu là “trong ngôn ngữ Hê-bơ-rơ/A-ram.” Trong sách Khải Huyền, cách nói “tiếng Hê-bơ-rơ” có thể chỉ dạng tên thuộc ngôn ngữ Xê-mít, không nhất thiết phân biệt nghiêm ngặt tiếng Hê-bơ-rơ với tiếng A-ram.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: vị ấy tập hợp
  rationale: Động từ Hy Lạp ở ngôi thứ ba số ít, nên bản chính giữ nguyên số ít thay vì đổi thành số nhiều theo ngữ cảnh. Đại từ “vị ấy” để ngỏ căn tính của tác nhân và phù hợp văn phong trang trọng.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ đối cách số nhiều chỉ những người bị tập hợp; trong ngữ cảnh là các vua được nhắc đến trước đó.
- source_word: εἰς τὸν τόπον
  choice: tại nơi
  rationale: Diễn đạt tự nhiên trong tiếng Việt cho đích điểm của hành động tập hợp, đồng thời giữ nghĩa cơ bản của τόπος là “nơi/chỗ”.
- source_word: τὸν καλούμενον
  choice: mà ... gọi là
  rationale: Chuyển phân từ bị động sang mệnh đề quan hệ tự nhiên trong tiếng Việt; cấu trúc “tiếng Hê-bơ-rơ gọi là” truyền đạt tên gọi theo ngôn ngữ ấy.
- source_word: Ἑβραϊστὶ
  choice: tiếng Hê-bơ-rơ
  rationale: Cách dịch minh bạch và quen thuộc; chú thích bảo lưu khả năng từ này chỉ rộng hơn đến ngôn ngữ Hê-bơ-rơ/A-ram thuộc môi trường Do Thái.
- source_word: Ἁρμαγεδών
  choice: Ha-ma-ghê-đôn
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt theo dạng đã quen dùng trong truyền thống Kinh Thánh tiếng Việt, không diễn giải địa danh.
theological_decisions:
- issue: Tác nhân thực hiện việc tập hợp
  choice: vị ấy tập hợp họ
  alternative: chúng tập hợp họ
  rationale: συνήγαγεν thực sự là động từ số ít, trong khi các tà linh ở câu 13–14 là những tác nhân đi tập hợp các vua. Bản chính giữ hình thái số ít của nguyên văn và chú thích nêu sự căng thẳng với ngữ cảnh, không xác định “vị ấy” là Đức Chúa Trời, con rồng, con thú hay một tác nhân nào khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ động từ số ít đúng theo SBLGNT, đồng thời dùng chú thích để bảo toàn khả năng hiểu số nhiều do ngữ cảnh. Mọi dấu chú thích [a], [b] đều xuất hiện trong bản văn.
