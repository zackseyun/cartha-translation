id: REV.16.10
reference: Revelation 16:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: vi
  text: Vị thứ năm[a] đổ bát của mình trên ngai của con thú; vương quốc của nó trở nên tối tăm[b], và họ cứ cắn lưỡi mình vì đau đớn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “vị thứ năm”; từ ngữ cảnh có thể hiểu đây là thiên sứ thứ năm.
    reason: contextual_ellipsis
  - marker: b
    text: 'Cũng có thể dịch: “bị chìm trong tối tăm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: vị thứ năm
  rationale: Giữ nguyên cách nói tỉnh lược của tiếng Hy Lạp, chỉ dùng số thứ tự có mạo từ; “thiên sứ” được hiểu từ chuỗi sự kiện trong ngữ cảnh nhưng không được thêm vào chính văn.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: đổ bát mình
  rationale: “Đổ” diễn đạt tự nhiên động tác ἐκχέω; “bát” phù hợp với loại vật đựng miệng rộng được chỉ bởi φιάλη và giữ nhất quán với hình tượng các bát thịnh nộ.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: trên ngai của con thú
  rationale: Dịch trực tiếp giới từ ἐπί với đối cách và giữ nguyên hình tượng khải huyền của θηρίον.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: vương quốc của nó
  rationale: βασιλεία ở đây chỉ lãnh vực cai trị của con thú. Đại từ “nó” quy chiếu tự nhiên đến “con thú” trong tiếng Việt mà không cần quyết định con thú được nhân cách hóa đến mức nào.
- source_word: ἐγένετο ... ἐσκοτωμένη
  choice: trở nên tối tăm
  rationale: Diễn đạt trạng thái phát sinh do cấu trúc γίνομαι với phân từ hoàn thành bị động, đồng thời không thêm hình ảnh ngoài nguyên văn.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: họ cứ cắn lưỡi mình
  rationale: “Cứ cắn” thể hiện hành động kéo dài của thì chưa hoàn thành; “lưỡi mình” là cách quy chiếu phản thân tự nhiên trong tiếng Việt.
- source_word: ἐκ τοῦ πόνου
  choice: vì đau đớn
  rationale: ἐκ ở đây biểu thị nguyên nhân; cách dịch này ngắn gọn, tự nhiên và giữ rõ quan hệ nhân quả.
theological_decisions:
- issue: Chủ thể được hàm ý trong cụm ὁ πέμπτος
  choice: Không thêm “thiên sứ” vào chính văn; dùng “vị thứ năm” và giải thích trong chú thích.
  alternative: Thiên sứ thứ năm
  rationale: Ngữ cảnh cho biết đây là thiên sứ thứ năm, nhưng danh từ “thiên sứ” không xuất hiện trong câu này. Giữ cách nói tỉnh lược tránh biến điều hàm ý thành từ ngữ hiển nhiên trong nguyên văn.
- issue: Cách quy chiếu đến con thú trong ἡ βασιλεία αὐτοῦ
  choice: vương quốc của nó
  alternative: vương quốc của hắn
  rationale: Tiếng Hy Lạp dùng đại từ giống trung phù hợp với θηρίον. “Nó” giữ cách quy chiếu đến con thú mà không áp đặt thêm sắc thái nhân cách hóa hay miệt thị.
- issue: Mức độ diễn giải hình phạt tối tăm
  choice: trở nên tối tăm
  alternative: bị chìm trong tối tăm
  rationale: Cách chọn bám sát cấu trúc chỉ sự chuyển sang trạng thái tối tăm; phương án thay thế sinh động hơn nhưng diễn giải mạnh hơn đôi chút.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vị thứ năm” để câu tỉnh lược vẫn tự nhiên; dùng “cứ cắn” nhằm truyền đạt sắc thái tiếp diễn của động từ Hy Lạp.
