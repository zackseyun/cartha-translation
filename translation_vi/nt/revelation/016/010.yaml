  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: không thêm “thiên sứ,” giữ hình tượng “con thú,” diễn đạt nguyên nhân bằng “vì đau đớn,” và phản ánh sắc thái tiếp diễn của ἐμασῶντο bằng “cứ.” Tuy nhiên, dấu chấm sau “con thú” tách một mệnh đề liên kết trực tiếp trong nguyên văn; nên dùng dấu chấm phẩy để bảo toàn quan hệ cú pháp và nhịp câu.'
