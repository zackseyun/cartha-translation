id: REV.16.17
reference: Revelation 16:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: vi
  text: 'Vị thứ bảy trút bát của mình vào không trung. Một tiếng lớn phát ra từ nơi thánh, từ ngai, nói rằng: “Đã xảy ra rồi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đã hoàn tất rồi” hoặc “Đã xong.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: Vị thứ bảy
  rationale: Nguyên văn chỉ dùng số thứ tự có mạo từ, không viết rõ “thiên sứ”; bản dịch giữ cách nói tỉnh lược nhưng dùng “vị” để câu tiếng Việt tự nhiên và chỉ một hữu thể có ngôi vị.
- source_word: ἐξέχεεν
  choice: trút
  rationale: “Trút” diễn đạt tự nhiên hành động đổ hết vật chứa và phù hợp công thức trút các bát phán xét trong chương.
- source_word: φιάλην
  choice: bát
  rationale: φιάλη chỉ một vật chứa dạng bát; “bát” rõ nghĩa trong tiếng Việt hiện đại và tránh hình ảnh chai lọ.
- source_word: ἐπὶ τὸν ἀέρα
  choice: vào không trung
  rationale: Với động từ chỉ sự trút đổ và ἐπί + đối cách, “vào không trung” diễn đạt hướng tác động tự nhiên hơn “trên không trung”.
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: Một tiếng lớn ... vang ra
  rationale: “Tiếng lớn” giữ nghĩa cường độ của μεγάλη, còn “vang ra” vừa thể hiện chuyển động từ nguồn vừa tự nhiên trong tiếng Việt.
- source_word: ἐκ τοῦ ναοῦ
  choice: từ nơi thánh
  rationale: ναός chỉ nơi thánh/điện thờ trung tâm, cụ thể hơn toàn bộ khu đền thờ; “nơi thánh” dễ hiểu và giữ được nét nghĩa ấy.
- source_word: ἀπὸ τοῦ θρόνου
  choice: từ ngai
  rationale: Giữ nguyên cụm nguồn thứ hai, không gộp với “từ nơi thánh”.
- source_word: λέγουσα
  choice: rằng
  rationale: Chuyển phân từ bổ nghĩa cho “tiếng” thành cấu trúc dẫn lời tự nhiên trong tiếng Việt.
- source_word: Γέγονεν
  choice: Đã hoàn tất rồi
  rationale: Thể hoàn thành của γίνομαι công bố một biến cố đã đạt tới kết quả; cách dịch này trang trọng, tự nhiên và giữ sắc thái hoàn tất, đồng thời chú thích bảo lưu khả năng dịch sát hơn theo nghĩa “đã xảy ra”.
theological_decisions:
- issue: Cách dịch ναός trong khung cảnh đền thờ trên trời
  choice: nơi thánh
  alternative: đền thờ
  rationale: Đây là lựa chọn từ vựng chứ không phải xác quyết giáo lý. “Nơi thánh” giữ nét chuyên biệt của ναός so với toàn thể khu đền thờ.
- issue: Cách dịch công thức Γέγονεν
  choice: Đã hoàn tất rồi
  alternative: Đã xảy ra rồi
  rationale: Câu công bố có thể nhấn mạnh sự kiện đã xảy đến hoặc kết quả nay đã hoàn tất. Bản chính chọn cách nói tự nhiên trong cao trào của bát thứ bảy, còn chú thích bảo lưu nghĩa gần hình thái từ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ cách gọi tỉnh lược “Vị thứ bảy” của nguyên văn, duy trì hai cụm chỉ nguồn “từ nơi thánh, từ ngai,” và tránh bổ sung “thiên sứ” dù ngữ cảnh cho thấy đó là đối tượng được nói đến.
