id: REV.16.3
reference: Revelation 16:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: vi
  text: Vị thứ hai đổ bát của mình xuống biển; biển biến thành máu như máu của người chết,[a] và mọi sinh vật sống trong biển đều chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như máu từ một xác chết”; nguyên văn Hy Lạp: “máu như của một người chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: Vị thứ hai
  rationale: Giữ cách nói tỉnh lược của Hy Lạp, không thêm “thiên sứ” dù ngữ cảnh cho thấy đối tượng được nói đến là vị thiên sứ thứ hai.
- source_word: ἐξέχεεν
  choice: trút
  rationale: “Trút” tự nhiên trong tiếng Việt đối với việc đổ hết vật chứa, đồng thời giữ hình ảnh phán xét từ các bát.
- source_word: φιάλην
  choice: bát
  rationale: φιάλη chỉ một vật chứa nông dạng bát; “bát” phù hợp hơn “lọ” hay “chai” và nhất quán với hình ảnh các bát thịnh nộ.
- source_word: εἰς τὴν θάλασσαν
  choice: xuống biển
  rationale: Diễn đạt tự nhiên hướng chuyển động của εἰς khi chất trong bát được trút vào biển.
- source_word: ἐγένετο αἷμα
  choice: Biển biến thành máu
  rationale: Nêu rõ chủ thể được ngầm hiểu là biển và giữ khẳng định mạnh của bản Hy Lạp rằng biển trở thành máu, không làm nhẹ thành “trông như máu”.
- source_word: ὡς νεκροῦ
  choice: như máu của người chết
  rationale: Bổ sung danh từ “máu” vốn được ngầm hiểu trong phép so sánh, giữ số ít và sắc thái liên hệ với một người đã chết.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: mọi sinh vật sống
  rationale: Trong ngữ cảnh sinh vật biển, cụm từ mang nghĩa mọi hữu thể sống; cách dịch này tránh khiến ψυχή bị hiểu riêng theo nghĩa thần học là “linh hồn”.
- source_word: ἀπέθανεν
  choice: đều chết
  rationale: Dịch trực tiếp động từ “chết”; “đều” truyền đạt phạm vi toàn thể của πᾶσα một cách tự nhiên.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: trong biển
  rationale: Gắn cụm chỉ nơi chốn trực tiếp với “mọi sinh vật sống”, là cách diễn đạt tiếng Việt tự nhiên và phản ánh đối tượng ở trong biển.
theological_decisions:
- issue: Bản chất của hình ảnh tai họa
  choice: Dịch biển thực sự “biến thành máu” trong khải tượng, không làm nhẹ ngôn ngữ phán xét.
  alternative: Dịch theo hiện tượng là “trông giống như máu”.
  rationale: Bản Hy Lạp nói ἐγένετο αἷμα, “trở thành máu”, rồi dùng ὡς νεκροῦ để mô tả tính chất của máu ấy. Bản dịch giữ nguyên sức nặng và sự căng thẳng của hình ảnh khải tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Vị thứ hai” để giữ sự tỉnh lược của nguyên văn; dùng “trút bát mình” theo lối Kinh Thánh tự nhiên mà không cổ hóa quá mức. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
