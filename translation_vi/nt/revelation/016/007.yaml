id: REV.16.7
reference: Revelation 16:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: vi
  text: 'Tôi nghe bàn thờ nói: “Phải, lạy Chúa là Đức Chúa Trời, Đấng Toàn Năng, các phán quyết của Ngài thật chân thật và công chính.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσα
  choice: Tôi nghe
  rationale: Thể quá khứ bất định chủ động của ἀκούω diễn tả một sự việc đơn giản đã xảy ra; “nghe” tự nhiên và không thêm sắc thái chủ ý như “lắng nghe”.
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: bàn thờ nói rằng
  rationale: Cấu trúc sở hữu cách với ἤκουσα có thể chỉ nguồn phát ra điều được nghe, nhưng phân từ λέγοντος tự nhiên nhất trình bày chính bàn thờ như đang nói, phù hợp với lối nhân cách hóa sống động của Khải Huyền.
- source_word: Ναί
  choice: Phải
  rationale: Tiểu từ khẳng định mạnh; “Phải” giữ được sắc thái đáp lời trang trọng và tự nhiên trong văn cảnh.
- source_word: κύριε, ὁ θεός
  choice: lạy Chúa là Đức Chúa Trời
  rationale: Giữ cả κύριε và ὁ θεός trong lời xưng hô trực tiếp, đồng thời dùng “là” để diễn đạt quan hệ đồng vị rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ὁ παντοκράτωρ
  choice: Đấng Toàn Năng
  rationale: Cách gọi quen thuộc, trang trọng, diễn đạt quyền năng và quyền tể trị bao trùm của παντοκράτωρ.
- source_word: ἀληθιναὶ
  choice: chân thật
  rationale: Diễn đạt tính đúng thật và đáng tin của các phán quyết; phù hợp với văn phong trang trọng hơn “đúng”.
- source_word: δίκαιαι
  choice: công chính
  rationale: Giữ sức nặng pháp lý và thần học của từ này; “công bằng” có thể hẹp hoặc nhẹ hơn trong ngữ cảnh phán xét của Đức Chúa Trời.
- source_word: αἱ κρίσεις σου
  choice: các phán quyết của Ngài
  rationale: κρίσεις ở đây chỉ những quyết định hoặc hành động xét xử; “phán quyết” giữ rõ sắc thái tư pháp hơn từ khái quát “sự phán xét”.
theological_decisions:
- issue: Nhân cách hóa bàn thờ như chủ thể nói
  choice: “Tôi nghe bàn thờ nói rằng”
  alternative: “Tôi nghe từ bàn thờ có tiếng nói rằng”
  rationale: Bản Hy Lạp nêu bàn thờ trong cấu trúc phụ thuộc vào động từ “nghe” và dùng phân từ “nói”. Cách dịch chính giữ phép nhân cách hóa và không thêm danh từ “tiếng” vốn không có trong câu.
- issue: Cách dịch chuỗi tước hiệu thần linh trong lời xưng hô
  choice: “lạy Chúa là Đức Chúa Trời, Đấng Toàn Năng”
  alternative: “lạy Chúa, Đức Chúa Trời Toàn Năng”
  rationale: Cách chọn giữ riêng cả ba yếu tố κύριε, ὁ θεός và ὁ παντοκράτωρ, phản ánh cấu trúc đồng vị của nguyên văn mà vẫn rõ nghĩa trong tiếng Việt.
- issue: Sắc thái của δίκαιαι khi nói về các κρίσεις của Đức Chúa Trời
  choice: “công chính”
  alternative: “công bằng”
  rationale: “Công chính” bảo toàn chiều kích đạo đức lẫn tư pháp, không làm nhẹ lời tuyên xưng về bản chất đúng đắn của các phán quyết thần linh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh khải huyền bằng cách nhân cách hóa “bàn thờ”; dùng “Ngài” trong lời thưa trực tiếp với Đức Chúa Trời và giữ sắc thái tư pháp qua “các phán quyết”.
