id: REV.16.19
reference: Revelation 16:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: vi
  text: Thành lớn bị chia thành ba phần, và các thành của các dân tộc đều sụp đổ. Ba-by-lôn vĩ đại được nhớ đến trước mặt Đức Chúa Trời, để Ngài trao cho nó chén rượu của cơn giận dữ thuộc về cơn thịnh nộ của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “chén rượu của cơn giận dữ của cơn thịnh nộ của Ngài.” Nguyên văn dùng hai từ liên hệ nhưng khác nhau, chỉ sự giận dữ mãnh liệt (θυμός) và cơn thịnh nộ (ὀργή).'
    reason: Giải thích chuỗi sở hữu dày đặc và bảo toàn sự phân biệt hai thuật ngữ Hy Lạp mà không làm nặng chính văn.
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: bị chia làm ba phần
  rationale: 'Cấu trúc chỉ trạng thái kết quả: thành trở nên gồm ba phần. Cách dịch này tự nhiên trong tiếng Việt và truyền đạt rõ sự phân chia mà không thêm nguyên nhân.'
- source_word: ἡ πόλις ἡ μεγάλη
  choice: thành lớn
  rationale: Giữ nguyên hình ảnh khải huyền và cách gọi đã có trong văn cảnh; “thành” là cách nói Kinh Thánh trang trọng nhưng vẫn quen thuộc.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: các thành của các dân tộc
  rationale: Trong bối cảnh phán xét toàn cầu, ἔθνη phù hợp nhất với “các dân tộc”, không thu hẹp nghĩa thành một nhóm tôn giáo hay sắc tộc.
- source_word: ἔπεσαν
  choice: sụp đổ
  rationale: “Sụp đổ” diễn đạt tự nhiên hậu quả đối với các thành phố; vẫn giữ sức mạnh của hình ảnh πίπτω trong bối cảnh tai biến.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Ba-by-lôn lớn
  rationale: Giữ danh xưng khải huyền và nét nhấn mạnh của tính từ theo sau danh từ.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: bị Đức Chúa Trời nhớ đến
  rationale: Diễn đạt tự nhiên thể bị động và thành ngữ Kinh Thánh về việc đối tượng được đưa vào sự lưu tâm của Đức Chúa Trời; văn cảnh cho thấy đó là để phán xét.
- source_word: δοῦναι αὐτῇ
  choice: để Ngài trao cho nó
  rationale: “Để” giữ quan hệ mục đích hoặc kết quả của động từ nguyên mẫu; “Ngài” làm rõ chủ thể vốn được hàm ý là Đức Chúa Trời, còn đại từ “nó” quy chiếu thành phố được nhân cách hóa.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: chén rượu
  rationale: Giữ biểu tượng Kinh Thánh về phần phán xét được trao uống, đồng thời tránh chuỗi sở hữu nặng nề trong tiếng Việt.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: thịnh nộ từ cơn giận của Ngài
  rationale: Dùng hai từ khác nhau để bảo toàn cả θυμός lẫn ὀργή và sự tăng cường tu từ; “từ” biểu thị quan hệ phát sinh tự nhiên hơn chuỗi “của... của...” trong tiếng Việt.
theological_decisions:
- issue: Thành ngữ phán xét ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: bị Đức Chúa Trời nhớ đến
  alternative: được nhắc đến trước mặt Đức Chúa Trời; được Đức Chúa Trời lưu tâm để phán xét
  rationale: Bản dịch giữ hình ảnh “nhớ đến” và không diễn giải sự phán xét ngay trong chính văn; mục đích trao chén ở vế sau tự làm rõ ý nghĩa tư pháp.
- issue: Phân biệt θυμός và ὀργή trong cùng một cụm
  choice: thịnh nộ từ cơn giận của Ngài
  alternative: cơn cuồng nộ của sự thịnh nộ Ngài; cơn thịnh nộ dữ dội của Ngài
  rationale: Giữ hai danh từ riêng biệt thay vì gộp thành một, nhưng sắp xếp chúng theo lối tiếng Việt dễ hiểu. Quan hệ chính xác giữa hai từ vẫn có độ cô đọng và căng nghĩa như nguyên văn.
- issue: Đại từ chỉ Ba-by-lôn được nhân cách hóa
  choice: nó
  alternative: ả; nàng
  rationale: Tiếng Hy Lạp dùng đại từ giống cái theo giống ngữ pháp của Βαβυλών và hình ảnh nhân cách hóa. “Nó” tự nhiên khi quy chiếu một thành phố và tránh đưa thêm sắc thái khinh miệt hoặc nữ tính không bắt buộc trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; giữ các hình ảnh “Ba-by-lôn”, “chén rượu” và “nhớ đến” thay vì giải nghĩa biểu tượng ngay trong câu.
