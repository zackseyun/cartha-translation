- from: Thành lớn bị chia làm ba phần, và các thành của các dân tộc đều sụp đổ. Ba-by-lôn lớn bị Đức Chúa Trời nhớ đến[a], để Ngài trao cho nó chén rượu thịnh nộ từ cơn giận của Ngài.
  to: Thành lớn bị chia thành ba phần, và các thành của các dân tộc đều sụp đổ. Ba-by-lôn vĩ đại được nhớ đến trước mặt Đức Chúa Trời, để Ngài trao cho nó chén rượu của cơn giận dữ thuộc về cơn thịnh nộ của Ngài.[a]
  rationale: Sửa vế cuối để phản ánh sát hơn cấu trúc và sự tăng cường của nguyên văn, đồng thời dùng “Ba-by-lôn vĩ đại” cho tự nhiên trong tiếng Việt hiện đại. Thành ngữ “được nhớ đến trước mặt Đức Chúa Trời” được giữ trong chính văn, không áp đặt diễn giải giáo phái; chức năng phán xét được làm rõ bởi việc trao chén trong cùng câu.
