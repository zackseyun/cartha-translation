id: REV.16.15
reference: Revelation 16:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: vi
  text: “Này, Ta đến như kẻ trộm. Phước cho người tỉnh thức[a] và giữ gìn y phục của mình, để người ấy không đi lại trần truồng và người ta không thấy sự phơi bày đáng hổ thẹn của người ấy[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người luôn tỉnh táo” hoặc “người canh thức.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “sự hổ thẹn”; từ Hy Lạp có thể chỉ sự lõa lồ hoặc sự phơi bày thân thể gây nhục nhã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Này
  rationale: Là thán từ thu hút sự chú ý, phù hợp với giọng trang trọng và khẩn thiết của văn chương khải huyền; tự nhiên hơn “Hãy xem” trong tiếng Việt hiện đại.
- source_word: ἔρχομαι
  choice: Ta đến
  rationale: Thì hiện tại Hy Lạp có sức diễn đạt sống động và hướng đến việc sắp xảy ra; “Ta đến” giữ được cả tính trực tiếp lẫn sắc thái cánh chung.
- source_word: ὡς κλέπτης
  choice: như kẻ trộm
  rationale: Giữ nguyên phép so sánh về tính bất ngờ của sự đến, không hàm ý đồng nhất về phương diện đạo đức.
- source_word: μακάριος
  choice: Phước cho
  rationale: Công thức chúc phước quen thuộc, trang trọng, có chiều sâu thần học hơn “hạnh phúc” hoặc “may mắn”.
- source_word: ὁ γρηγορῶν
  choice: người tỉnh thức
  rationale: Bao hàm cả nghĩa thức tỉnh và cảnh giác; phù hợp với lời cảnh báo mang tính ẩn dụ trong ngữ cảnh.
- source_word: τηρῶν
  choice: giữ gìn
  rationale: Diễn đạt việc giữ, bảo vệ hoặc không để mất áo, nhưng không quy định quá cụ thể cách hiểu.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: áo mình
  rationale: “Áo” tự nhiên và trang trọng vừa đủ trong tiếng Việt; vẫn giữ hình ảnh cụ thể và khả năng mang ý nghĩa biểu tượng.
- source_word: ἵνα μὴ
  choice: để khỏi
  rationale: Cách diễn đạt mục đích phủ định tự nhiên trong tiếng Việt, tương ứng với ἵνα μή.
- source_word: γυμνὸς περιπατῇ
  choice: phải đi lại trần truồng
  rationale: Giữ hình ảnh cụ thể của việc đi lại trong tình trạng lõa thể; “phải” thể hiện hệ quả cần tránh mà không xóa sắc thái mục đích.
- source_word: βλέπωσιν
  choice: bị người ta nhìn thấy
  rationale: Động từ Hy Lạp có chủ ngữ số nhiều không xác định; cấu trúc bị động với “người ta” diễn đạt tự nhiên sự bất định ấy trong tiếng Việt.
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: sự hổ thẹn của mình
  rationale: Giữ được cả ý bị phơi bày đáng xấu hổ lẫn sự nhục nhã, không thu hẹp chỉ còn “sự lõa lồ” hay dùng từ quá lâm sàng.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của áo, sự trần truồng và hổ thẹn trong bối cảnh khải huyền
  choice: Giữ nguyên các hình ảnh cụ thể “áo”, “trần truồng” và “sự hổ thẹn”, không giải nghĩa biểu tượng trong chính văn.
  alternative: Diễn giải áo là sự sẵn sàng hoặc việc công chính, và sự trần truồng là nỗi nhục trong ngày phán xét.
  rationale: Câu văn có khả năng mang ý nghĩa biểu tượng, nhưng nguyên văn trình bày bằng hình ảnh cụ thể. Bản dịch không nên tự quyết định một cách giải nghĩa thần học duy nhất.
- issue: Dạng giống đực số ít có tính đại diện
  choice: Dùng “người ... mình”, là cấu trúc số ít tự nhiên trong tiếng Việt và không thêm giới tính mà tiếng Việt không bắt buộc phải biểu thị.
  alternative: Chuyển thành số nhiều “những người ... áo của họ”.
  rationale: Duy trì cấu trúc đại diện số ít của nguyên văn, đồng thời dùng đại từ phản thân tự nhiên của tiếng Việt thay vì áp đặt một đại từ giới tính không có trong hệ thống xưng hô tương ứng.
- issue: Người nói trong lời xen vào
  choice: Dùng đại từ “Ta” viết hoa trong lời trực tiếp.
  alternative: Dùng “tôi” hoặc “ta” viết thường.
  rationale: Ngữ cảnh xác định đây là lời của Đấng Christ; “Ta” phù hợp với giọng uy nghiêm trong tiếng Việt Kinh Thánh mà không thêm một danh xưng không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp cảnh báo đột ngột của lời xen vào, công thức chúc phước, cùng dấu gạch ngang cuối câu theo nguồn vì câu này nằm trong mạch văn tiếp nối. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
