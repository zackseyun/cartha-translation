language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: vi
  text: Thiên sứ thứ nhất đi và trút bát của mình xuống đất. Một vết loét ghê gớm và hiểm độc[a] nổi trên những người mang dấu của con thú và thờ lạy hình tượng của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vết loét xấu xa và độc hại.” Tiếng Hy Lạp dùng hai tính từ mạnh, κακόν và πονηρόν, để nhấn mạnh tính chất tai hại và khủng khiếp của tai vạ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: Thiên sứ thứ nhất
  rationale: Cụm tính từ có mạo từ được dùng như danh từ và theo văn cảnh chỉ thiên sứ đầu tiên trong bảy thiên sứ. Tiếng Việt cần nêu lại danh từ để câu tự nhiên và rõ nghĩa.
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Động từ aorist trong chuỗi kể chuyện diễn tả hành động đi thực hiện mệnh lệnh; “đi” tự nhiên và không thêm sắc thái rời bỏ.
- source_word: ἐξέχεεν
  choice: trút
  rationale: “Trút” diễn đạt tự nhiên hành động đổ hết chất chứa trong bát và phù hợp công thức phán xét bằng các bát trong Khải Huyền.
- source_word: φιάλην
  choice: bát
  rationale: φιάλη chỉ một loại bát nông; “bát” là cách gọi dễ hiểu, tránh hình ảnh chai nhỏ mà cách dịch truyền thống khác có thể gợi ra.
- source_word: εἰς τὴν γῆν
  choice: xuống đất
  rationale: εἰς biểu thị hướng và đích của hành động trút. “Xuống đất” tự nhiên trong tiếng Việt; γῆ ở đây có thể chỉ đất hoặc trái đất, nên không viết hoa để giữ độ rộng nghĩa.
- source_word: ἕλκος
  choice: vết loét
  rationale: Từ này chỉ thương tổn lở loét, có thể mưng mủ. “Vết loét” dễ hiểu hơn từ ngữ y khoa và không thu hẹp nghĩa thành một loại nhọt cụ thể.
- source_word: κακὸν καὶ πονηρὸν
  choice: độc hại và đau đớn
  rationale: Hai tính từ mạnh được giữ riêng để truyền tải tính chất tai hại và khổ sở của bệnh dịch; chú thích ghi nhận các khả năng sắc thái khác.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: trên những người
  rationale: ἄνθρωποι chỉ con người nói chung, không riêng nam giới; giới từ ἐπί được thể hiện trong cấu trúc “xuất hiện trên”.
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: những người mang dấu của con thú
  rationale: “Mang dấu” diễn đạt tự nhiên trạng thái có dấu hiệu thuộc về con thú mà không thêm cách giải thích về bản chất của dấu.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: thờ lạy tượng nó
  rationale: προσκυνέω trong văn cảnh là hành vi thờ lạy; đại từ “nó” giữ đúng quy chiếu về con thú và tránh nhân cách hóa quá mức.
theological_decisions:
- issue: Hai tính từ κακὸν καὶ πονηρὸν bổ nghĩa cho ἕλκος
  choice: “một vết loét độc hại và đau đớn”
  alternative: “một vết loét xấu xa và ác độc”; “một vết loét ghê gớm và trầm trọng”
  rationale: Bản dịch giữ cả hai tính từ và sức nhấn mạnh cộng dồn, nhưng không quyết định rằng vết loét mang phẩm chất ác về luân lý. Chú thích bảo tồn dải nghĩa mạnh của nguyên văn.
- issue: Đối tượng chịu bệnh dịch
  choice: Giới hạn ở “những người mang dấu của con thú và thờ lạy tượng nó”
  alternative: Mở rộng thành toàn thể loài người hoặc coi hai nhóm là hoàn toàn tách biệt
  rationale: Hai phân từ có cùng mạo từ số nhiều và mô tả những người liên kết với con thú. Bản dịch giữ cấu trúc liên kết mà không áp đặt kết luận về việc đây là một nhóm hay hai nhóm có phần trùng nhau.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “thiên sứ” theo văn cảnh gần, “con thú” cho θηρίον và “thờ lạy” cho προσκυνέω. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
