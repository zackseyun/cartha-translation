id: REV.16.12
reference: Revelation 16:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: vi
  text: Người thứ sáu trút bát của mình xuống sông lớn Ơ-phơ-rát; nước sông cạn khô, để con đường của các vua từ nơi mặt trời mọc[a] được chuẩn bị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói đơn giản hơn: “từ phương đông”. Nguyên văn: “từ nơi mặt trời mọc”.'
    reason: Nêu cách diễn đạt tương đương tự nhiên hơn, đồng thời cho thấy hình ảnh cụ thể trong nguyên văn Hy Lạp.
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: Vị thứ sáu
  rationale: Giữ nguyên lối nói tỉnh lược của bản Hy Lạp, vốn không lặp lại danh từ “thiên sứ”; ngữ cảnh trước đó cho biết nhân vật này là ai.
- source_word: ἐξέχεεν
  choice: đổ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho hành động trút chất chứa trong bát, đồng thời giữ hình ảnh phán xét xuyên suốt phân đoạn.
- source_word: φιάλην
  choice: bát
  rationale: φιάλη chỉ một loại vật chứa rộng và nông; “bát” chính xác và dễ hiểu hơn những từ gợi một chai hoặc lọ nhỏ.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: xuống sông lớn Ơ-phơ-rát
  rationale: “Xuống” diễn đạt tự nhiên hướng của hành động đổ lên một địa điểm thấp hơn, còn “sông lớn Ơ-phơ-rát” giữ cấu trúc định danh của nguyên văn.
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: nước sông liền cạn khô
  rationale: Diễn đạt tự nhiên kết quả của động từ thụ động Hy Lạp; “liền” làm rõ diễn tiến kế tiếp trong lời thuật mà không thêm cách giải nghĩa biểu tượng.
- source_word: ἵνα ἑτοιμασθῇ ἡ ὁδὸς
  choice: để đường ... được dọn sẵn
  rationale: Giữ quan hệ mục đích của ἵνα và sắc thái thụ động của ἑτοιμασθῇ; “dọn sẵn đường” là cách nói tiếng Việt tự nhiên trong ngữ cảnh mở lối cho đoàn người đi qua.
- source_word: τῶν βασιλέων
  choice: cho các vua
  rationale: Trong tiếng Việt, “đường cho các vua” truyền đạt tự nhiên quan hệ sở thuộc hoặc dành cho của danh cách Hy Lạp mà không xác định quá mức.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: đến từ nơi mặt trời mọc
  rationale: Giữ hình ảnh theo sát thành ngữ Hy Lạp thay vì giản lược ngay thành “phương đông”; “đến từ” làm rõ rằng cụm này bổ nghĩa cho các vua.
theological_decisions:
- issue: Có nên nói rõ “vị thứ sáu” là một thiên sứ hay không
  choice: Giữ “Vị thứ sáu”, không thêm “thiên sứ”.
  alternative: Thiên sứ thứ sáu
  rationale: Ngữ cảnh xác định những vị đổ bát là các thiên sứ, nhưng câu này chỉ dùng số thứ tự có mạo từ. Không thêm danh từ giúp bản dịch trung thành với lối tỉnh lược của nguyên văn.
- issue: Có nên giải thích biểu tượng sông Ơ-phơ-rát cạn khô và các vua tiến đến hay không
  choice: Trình bày trực tiếp hình ảnh như nguyên văn, không chú giải biểu tượng trong chính văn.
  alternative: Diễn ý thành một cuộc xâm lược hoặc cuộc tập hợp thời sau cùng
  rationale: Bản thân câu không giải thích trọn ý nghĩa của hình ảnh khải huyền; dịch thẳng bảo toàn sự căng thẳng và tính đa nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Vị thứ sáu” để giữ lối tỉnh lược; dùng “Ơ-phơ-rát” theo cách phiên âm quen thuộc trong tiếng Việt. Dấu chấm phẩy giúp phân tách hành động đổ bát với kết quả tiếp theo mà vẫn giữ chúng trong một câu.
