id: REV.16.1
reference: Revelation 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: vi
  text: 'Tôi nghe một tiếng nói lớn từ đền thánh[a] nói với bảy thiên sứ: “Hãy đi và đổ bảy bát cơn thịnh nộ của Đức Chúa Trời xuống mặt đất.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đền thờ”; từ Hy Lạp ναός thường chỉ cụ thể hơn đến nơi thánh bên trong, chứ không phải toàn bộ khu đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: một tiếng lớn
  rationale: Trong kết hợp với φωνή, μέγας chỉ âm lượng lớn; “một tiếng lớn” tự nhiên, trang trọng và không buộc phải xác định người phát tiếng.
- source_word: ναοῦ
  choice: nơi thánh
  rationale: ναός thường chỉ phần thánh điện hoặc nơi thánh bên trong, cụ thể hơn toàn bộ khu đền thờ; “nơi thánh” phù hợp với bối cảnh thiên thượng trong Khải Huyền.
- source_word: λεγούσης
  choice: phán
  rationale: Phân từ giống cái bổ nghĩa cho “tiếng”; tiếng ấy truyền mệnh lệnh có thẩm quyền. “Phán” tự nhiên trong văn cảnh thần thánh nhưng vẫn giữ nguyên việc câu không nêu rõ người phát tiếng.
- source_word: Ὑπάγετε
  choice: Hãy đi
  rationale: Mệnh lệnh yêu cầu các thiên sứ lên đường để thi hành hành động tiếp theo.
- source_word: ἐκχέετε
  choice: đổ
  rationale: Diễn tả việc trút hết chất chứa trong các bát, giữ nguyên hình ảnh phán xét.
- source_word: φιάλας
  choice: bát
  rationale: φιάλη là bát hoặc đồ đựng nông, không phải chai hay lọ; “bát” chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: θυμοῦ τοῦ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  rationale: θυμός ở đây chỉ cơn giận dữ dội mang tính phán xét của Thiên Chúa; “cơn thịnh nộ” giữ được sắc thái nghiêm trọng và trang trọng.
- source_word: εἰς τὴν γῆν
  choice: xuống đất
  rationale: Với động từ “đổ”, εἰς biểu thị hướng đổ lên bề mặt hoặc vào phạm vi trái đất; “xuống đất” tự nhiên trong tiếng Việt và giữ hình ảnh chuyển động.
theological_decisions:
- issue: Cách dịch ναός trong khung cảnh thiên thượng
  choice: nơi thánh
  alternative: đền thờ
  rationale: “Nơi thánh” giữ nét nghĩa cụ thể của ναός là phần thánh điện bên trong, trong khi “đền thờ” có thể được hiểu là toàn bộ khu phức hợp. Chú thích bảo lưu cách dịch rộng hơn.
- issue: Cách dịch θυμός τοῦ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  alternative: cơn giận của Đức Chúa Trời
  rationale: Cụm từ nói đến sự phán xét dữ dội của Đức Chúa Trời đối với điều ác; “thịnh nộ” truyền đạt sức nặng của văn cảnh khải huyền mà không thêm một hệ thống giáo lý ngoài bản văn.
- issue: Chủ thể của tiếng phát ra từ nơi thánh
  choice: không xác định trong bản dịch
  alternative: diễn giải là tiếng của Đức Chúa Trời
  rationale: Bản Hy Lạp chỉ nói đến “một tiếng lớn” mà không trực tiếp nêu người phát tiếng. Dùng “phán” thể hiện uy quyền của mệnh lệnh nhưng không thêm chủ thể mà câu không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; giữ hình ảnh bảy bát và mệnh lệnh trực tiếp. Dấu chú thích [a] được đặt ngay sau “nơi thánh” trong chính văn.
