id: REV.16.13
reference: Revelation 16:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: vi
  text: Tôi thấy từ miệng con rồng, từ miệng con thú và từ miệng tiên tri giả đi ra ba linh ô uế giống như ếch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo trật tự gần sát với tiếng Hy Lạp: “Từ miệng con rồng, từ miệng con thú và từ miệng tiên tri giả, tôi thấy ba linh ô uế giống như ếch.” Tiếng Hy Lạp đặt ba cụm chỉ nguồn phát xuất trước cụm “ba linh ô uế.”'
    reason: Trật tự câu Hy Lạp đặt ba cụm chỉ nguồn phát xuất trước cụm “ba linh ô uế”; câu chính giữ trật tự ấy phần lớn nhưng thêm “đi ra” để tiếng Việt rõ nghĩa.
lexical_decisions:
- source_word: εἶδον
  choice: Tôi thấy
  rationale: Động từ aorist của ὁράω được dịch bằng động từ kể chuyện trực tiếp, tự nhiên trong lời thuật khải tượng.
- source_word: ἐκ ... τοῦ στόματος
  choice: từ miệng ... đi ra
  rationale: ἐκ diễn tả nguồn phát xuất. Cụm “đi ra” được bổ sung theo nghĩa hàm ẩn để câu tiếng Việt rõ và tự nhiên, đồng thời vẫn giữ ba cụm nguồn được đặt trước đối tượng như trật tự Hy Lạp.
- source_word: δράκοντος
  choice: con rồng
  rationale: Cách dịch thông dụng, giữ nguyên hình tượng biểu trưng đã được xác lập trong sách Khải Huyền.
- source_word: θηρίου
  choice: con thú
  rationale: Giữ hình tượng khải huyền của θηρίον, không làm nhẹ thành một từ chung chung hơn.
- source_word: ψευδοπροφήτου
  choice: tiên tri giả
  rationale: Cách gọi tự nhiên trong tiếng Việt cho người tự xưng hoặc xuất hiện như tiên tri nhưng là giả dối; phù hợp tính chất danh xưng trong văn cảnh.
- source_word: πνεύματα
  choice: tà linh
  rationale: Trong ngữ cảnh “ô uế” và hình tượng thù nghịch, “tà linh” diễn đạt rõ đây là các hữu thể thuộc linh xấu ác, không phải thái độ hay gió; không thêm sự đồng nhất cụ thể với ma quỷ vốn được nói rõ ở câu kế tiếp.
- source_word: τρία ἀκάθαρτα
  choice: ba tà linh ô uế
  rationale: ἀκάθαρτα được dịch là “ô uế” để giữ sắc thái luân lý–thuộc linh và âm hưởng Kinh Thánh; số từ và tính từ được sắp theo cú pháp tiếng Việt.
- source_word: ὡς βάτραχοι
  choice: giống như ếch
  rationale: ὡς biểu thị sự so sánh chứ không đồng nhất; “giống như ếch” giữ rõ phép ví von.
theological_decisions:
- issue: Bản chất của πνεύματα ἀκάθαρτα trong hình tượng khải huyền
  choice: Dịch là “ba tà linh ô uế giống như ếch” mà không giải nghĩa biểu tượng.
  alternative: “ba linh ô uế giống như ếch” hoặc “ba quỷ linh trông giống ếch”
  rationale: Câu này gọi chúng là các πνεύματα ἀκάθαρτα và ví chúng như ếch. “Tà linh” truyền đạt bản chất xấu ác được văn cảnh xác nhận, nhưng không thêm cách giải thích biểu tượng hay dùng “quỷ linh” để đưa lời xác định ở câu sau vào câu này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp lặp ba lần “từ miệng” và hình tượng khải huyền; không giải nghĩa biểu tượng trong chính văn.
