  source_fidelity: 'Bản dịch tái hiện đúng các thành tố của câu Hy Lạp: hành động “tôi thấy,” ba nguồn phát xuất được lặp lại, con rồng, con thú, tiên tri giả, số lượng ba, tính chất “ô uế,” và phép so sánh với ếch. Tuy nhiên, “tà linh” diễn giải πνεύματα theo hướng các hữu thể ác; dù phù hợp văn mạch gần, câu này chỉ nói “các linh ô uế” và câu sau mới xác định rõ là các linh của quỷ. “Linh ô uế” giữ sát văn bản hơn mà vẫn tự nhiên.'
