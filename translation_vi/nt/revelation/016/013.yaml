  terminology: “Con rồng,” “con thú,” “tiên tri giả,” và “ô uế” là các cách gọi nhất quán, tự nhiên, và thích hợp trong thuật ngữ Kinh Thánh tiếng Việt. Đổi “tà linh” thành “linh ô uế” tránh thêm sắc thái diễn giải không được nêu trực tiếp trong câu.
