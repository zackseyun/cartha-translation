source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: vi
  text: Vì chúng đã đổ máu của các thánh đồ và các nhà tiên tri[a], Ngài đã cho chúng uống máu; chúng đáng phải chịu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã làm đổ máu các thánh đồ và các nhà tiên tri.” Động từ Hy Lạp có nghĩa đen là “đổ ra”, đồng thời gợi lại các bát thịnh nộ được đổ ra trong văn cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “chúng là xứng đáng.” Trong văn cảnh, điều chúng đáng phải chịu là sự phán xét vừa được nêu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Giới từ liên kết này nêu lý do cho lời tuyên bố ở câu trước; “vì” diễn đạt quan hệ nhân quả tự nhiên trong tiếng Việt.
- source_word: αἷμα
  choice: máu
  rationale: Giữ cách dịch trực tiếp ở cả hai lần xuất hiện để bảo toàn sự lặp lại nhấn mạnh tính tương xứng của sự phán xét.
- source_word: ἁγίων
  choice: các thánh đồ
  rationale: Trong sách Khải Huyền, từ này chỉ dân thánh của Đức Chúa Trời nói chung, không riêng một hạng người được phong thánh về sau.
- source_word: προφητῶν
  choice: các nhà tiên tri
  rationale: Cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại dành cho những người nói lời tiên tri của Đức Chúa Trời.
- source_word: ἐξέχεαν
  choice: đã đổ
  rationale: Giữ hình ảnh nguyên ngữ “đổ ra”, đồng thời phù hợp với cách nói tiếng Việt “đổ máu” và gợi lại các bát thịnh nộ được đổ ra trong văn cảnh.
- source_word: αὐτοῖς
  choice: chúng
  rationale: Đại từ chỉ những kẻ đã đổ máu; “chúng” tự nhiên trong văn cảnh lên án và giữ rõ đối tượng nhận sự phán xét.
- source_word: δέδωκας
  choice: Ngài đã cho
  rationale: Diễn tả hành động đã hoàn tất của Đức Chúa Trời; tiếng Việt không mã hóa thì hoàn thành như tiếng Hy Lạp, nên “đã cho” là tự nhiên và đầy đủ.
- source_word: πιεῖν
  choice: uống
  rationale: Bổ ngữ trực tiếp, tự nhiên của động từ “cho”, bảo toàn hình ảnh cụ thể của nguyên văn.
- source_word: ἄξιοί εἰσιν
  choice: chúng thật đáng chịu như vậy
  rationale: Trong tiếng Việt, chỉ nói “chúng xứng đáng” dễ mang sắc thái khen ngợi hoặc thiếu bổ ngữ. “Đáng chịu như vậy” truyền đạt đúng ý chúng đáng nhận sự phán xét này, còn “thật” giữ giọng tuyên án trang trọng.
theological_decisions:
- issue: Ngôn ngữ công lý báo ứng
  choice: 'Giữ nguyên hình ảnh trực diện: Đức Chúa Trời cho những kẻ đã đổ máu uống máu, và chúng đáng chịu sự phán xét ấy.'
  alternative: Diễn giải nhẹ hơn như “Ngài đã báo trả chúng” hoặc “chúng đáng bị trừng phạt”.
  rationale: Nguyên văn trình bày sự phán xét theo cách gay gắt và tương xứng. Bản dịch không làm nhẹ hình ảnh máu hay biến nó thành một nhận định chung chung về hình phạt.
- issue: Đối tượng của ἁγίων
  choice: “các thánh đồ” theo nghĩa rộng là dân thánh của Đức Chúa Trời.
  alternative: “những người thánh” hoặc cách hiểu chỉ một nhóm tín hữu được giáo hội phong thánh.
  rationale: Cách chọn này phù hợp với cách dùng của Khải Huyền, đồng thời không đưa vào bản văn một phạm trù giáo hội hình thành về sau.
- issue: Ý nghĩa của ἄξιοί εἰσιν
  choice: Hiểu là họ đáng nhận sự phán xét vừa được nói đến.
  alternative: Hiểu “xứng đáng” theo nghĩa phẩm chất đạo đức đáng khen.
  rationale: Văn cảnh phán xét xác định rõ đây là sự đáng chịu hình phạt, chứ không phải lời khen về phẩm hạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép xưng hô “Ngài” đối với Đức Chúa Trời và dùng “chúng” cho những kẻ chịu phán xét. Dấu [a], [b] đều xuất hiện trong chính văn; cấu trúc nhân quả “vì… nên…” làm rõ quan hệ cú pháp với mệnh đề trước mà không giảm sức nặng của lời tuyên án.
