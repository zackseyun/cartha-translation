id: REV.16.21
reference: Revelation 16:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: vi
  text: Một trận mưa đá lớn, với mỗi viên nặng khoảng một ta-lâng[a], từ trời giáng xuống trên loài người. Loài người phạm thượng Đức Chúa Trời vì tai họa mưa đá ấy, bởi tai họa ấy vô cùng lớn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nặng chừng một ta-lâng”—tức mỗi viên có trọng lượng xấp xỉ một ta-lâng. Tiếng Hy Lạp diễn tả sự so sánh, không phải một số đo chính xác.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “vì tai họa ấy rất lớn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: một trận mưa đá lớn
  rationale: Danh từ số ít mang nghĩa tập hợp được diễn đạt tự nhiên trong tiếng Việt là “một trận mưa đá lớn”; phần tiếp theo cho thấy các viên mưa đá có kích thước phi thường.
- source_word: ὡς ταλαντιαία
  choice: với mỗi viên nặng khoảng một ta-lâng
  rationale: Diễn đạt rõ đây là trọng lượng ước chừng của từng viên; “khoảng” giữ sắc thái so sánh, không chính xác tuyệt đối, của ὡς.
- source_word: καταβαίνει
  choice: giáng xuống
  rationale: Thì hiện tại giàu tính cảnh tượng của lời tường thuật khải huyền được giữ bằng cách diễn đạt hiện tại; “giáng xuống” trang trọng, tự nhiên và phù hợp cảnh phán xét.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: “Trời” giữ được cả hướng từ không trung và sắc thái thiên thượng trong văn cảnh Khải Huyền mà không giải thích quá mức.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: trên loài người
  rationale: ἄνθρωποι chỉ con người nói chung, không riêng nam giới; “loài người” chính xác về giới và phù hợp văn phong trang trọng.
- source_word: ἐβλασφήμησαν
  choice: xúc phạm
  rationale: Trong quan hệ với Đức Chúa Trời, động từ chỉ lời nói bất kính, phạm thượng. “Xúc phạm” dễ hiểu trong tiếng Việt hiện đại và vẫn giữ mức độ nghiêm trọng của hành vi.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt cho θεός ở đây.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: vì tai họa mưa đá ấy
  rationale: ἐκ mang nghĩa nguyên nhân. πληγή trong Khải Huyền thường là tai họa do sự phán xét, nên “tai họa” tự nhiên hơn “dịch” khi nói về mưa đá và vẫn giữ liên hệ nội văn.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: bởi tai họa đó vô cùng khủng khiếp
  rationale: “Vô cùng khủng khiếp” truyền đạt cường độ của μεγάλη ... σφόδρα bằng tiếng Việt tự nhiên; đại từ “đó” quy chiếu về tai họa do mưa đá.
theological_decisions:
- issue: Nghĩa của οὐρανός trong cảnh phán xét khải huyền
  choice: từ trời
  alternative: từ bầu trời
  rationale: “Từ trời” bảo tồn cả nghĩa không gian trực tiếp lẫn sắc thái thần học của sự phán xét đến từ trên cao, nhưng không khẳng định thêm điều văn bản không nói.
- issue: Cách dịch ἄνθρωποι theo nghĩa chung
  choice: loài người
  alternative: người ta
  rationale: Danh từ Hy Lạp chỉ con người nói chung chứ không riêng nam giới. “Loài người” rõ nghĩa, trang trọng và không thêm phân biệt giới.
- issue: Sắc thái của βλασφημέω đối với Đức Chúa Trời
  choice: xúc phạm Đức Chúa Trời
  alternative: phạm thượng đến Đức Chúa Trời
  rationale: “Xúc phạm” dễ hiểu cho độc giả hiện đại và biểu đạt lời nói chống nghịch Đức Chúa Trời; phương án “phạm thượng” sát thuật ngữ hơn nhưng kém phổ thông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tính cảnh tượng, phù hợp thể loại khải huyền. Dùng “ta-lâng” để giữ đơn vị cổ, kèm chú thích giải nghĩa; tránh “đàn ông” vì ἄνθρωποι mang nghĩa chung. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
