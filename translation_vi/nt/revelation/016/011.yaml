id: REV.16.11
reference: Revelation 16:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: vi
  text: Họ phạm thượng Đức Chúa Trời trên trời[a] vì những cơn đau và các vết loét của mình[b], và không ăn năn về những việc làm của mình.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phỉ báng” hoặc “nói phạm đến Đức Chúa Trời trên trời.”
    reason: lexical_alternative
  - marker: b
    text: Hay “các vết lở.”
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “không ăn năn từ/khỏi những việc làm của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: xúc phạm
  rationale: Trong ngữ cảnh hướng đến Đức Chúa Trời, từ này chỉ lời nói phạm thượng, phỉ báng hoặc bất kính. “Xúc phạm” tự nhiên với độc giả hiện đại, còn chú thích bảo lưu sắc thái mạnh hơn là “phạm thượng”.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: Đức Chúa Trời của trời
  rationale: Giữ sát cấu trúc danh hiệu Hy Lạp và sắc thái trang nghiêm, khải huyền; không chuyển thành “Đức Chúa Trời ở trên trời,” vốn có thể làm genitive thành ý chỉ vị trí.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: vì những cơn đau ... của mình
  rationale: ἐκ mang nghĩa nguyên nhân trong ngữ cảnh này; πόνος chỉ sự đau đớn dữ dội, nên “những cơn đau” vừa rõ vừa tự nhiên.
- source_word: ἑλκῶν
  choice: các vết lở
  rationale: ἕλκος chỉ vết loét hoặc vết lở. “Vết lở” là cách nói phổ thông, không áp đặt mức độ hay chẩn đoán y khoa quá cụ thể.
- source_word: μετενόησαν
  choice: không ăn năn
  rationale: Trong sách Khải Huyền, μετανοέω mang ý nghĩa luân lý và tôn giáo là ăn năn, không chỉ đơn thuần đổi ý.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: từ bỏ những việc mình làm
  rationale: Sau μετανοέω, ἐκ biểu thị lìa khỏi những hành vi trước đó. “Ăn năn, từ bỏ” diễn đạt tự nhiên hướng tách lìa ấy, còn chú thích nêu cấu trúc sát chữ.
theological_decisions:
- issue: Chức năng của ba cụm từ dùng ἐκ
  choice: Hai cụm đầu được hiểu theo nghĩa nguyên nhân (“vì” đau đớn và vết lở); cụm cuối theo nghĩa lìa khỏi (“ăn năn, từ bỏ” các việc làm).
  alternative: Dịch đồng loạt theo nghĩa sát chữ “từ/do,” để ngỏ sắc thái nguồn gốc trong cả ba cụm.
  rationale: 'Cú pháp và ngữ cảnh cho thấy đau đớn cùng vết lở là nguyên cớ khiến họ xúc phạm Đức Chúa Trời, còn với μετανοέω, ἐκ chỉ điều họ phải lìa bỏ. Cách dịch này bảo tồn sự tương phản: chịu phán xét nhưng vẫn không ăn năn.'
- issue: Sắc thái của βλασφημέω khi đối tượng là Đức Chúa Trời
  choice: Dùng “xúc phạm” trong chính văn và ghi “phạm thượng, phỉ báng” ở chú thích.
  alternative: Dùng trực tiếp “phạm thượng” trong chính văn.
  rationale: “Xúc phạm” dễ hiểu và tự nhiên hơn trong tiếng Việt hiện đại, trong khi chú thích bảo lưu đầy đủ sắc thái tôn giáo và lời nói độc ác của từ Hy Lạp.
translation_notes:
  register: 'Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “họ/mình” để tránh lặp đại từ sở hữu nặng nề. Dấu “nhưng” làm rõ sự tương phản được hàm chứa bởi καὶ trong mạch văn: đau đớn dẫn đến xúc phạm chứ không dẫn đến ăn năn. Mọi dấu chú thích đều xuất hiện trong chính văn.'
