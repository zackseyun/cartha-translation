revisions:
- from: Họ xúc phạm Đức Chúa Trời của trời vì những cơn đau và các vết lở của mình,[a][b] nhưng không ăn năn, từ bỏ những việc mình làm.[c]
  to: Họ phạm thượng Đức Chúa Trời trên trời[a] vì những cơn đau và các vết loét của mình[b], và không ăn năn về những việc làm của mình.[c]
  rationale: Bản sửa dùng thuật ngữ mạnh và chính xác hơn cho βλασφημέω, thay lối diễn đạt calque bằng danh hiệu tiếng Việt tự nhiên, và tránh thêm động từ «từ bỏ». Hai cụm ἐκ đầu vẫn được dịch theo nghĩa nguyên nhân («vì»), còn cụm cuối được phản ánh trong «ăn năn về» và chú thích sát nghĩa. Các dấu chú thích được đặt cạnh đơn vị từ vựng/cú pháp tương ứng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng các thành tố chính: βλασφημέω, danh hiệu «Đức Chúa Trời của trời», quan hệ nguyên nhân của hai cụm ἐκ đầu, và sự không ăn năn khỏi các việc làm. Tuy nhiên, «xúc phạm» giảm nhẹ sắc thái nói phạm/phỉ báng đối với Đức Chúa Trời; «ăn năn, từ bỏ» thêm một động từ phối hợp không có trong nguyên văn; và «nhưng» thay cho καὶ làm nổi bật tương phản nhiều hơn văn bản trực tiếp biểu thị.'
  naturalness: «Đức Chúa Trời của trời» là lối calque không tự nhiên trong tiếng Việt hiện đại. «Đức Chúa Trời trên trời» là cách gọi Kinh Thánh tự nhiên, vẫn chuyển đạt danh hiệu «God of heaven» mà không khẳng định một phân tích ngữ pháp vượt quá nguyên văn. «Không ăn năn về những việc làm của mình» tự nhiên và rõ nghĩa hơn.
  terminology: Dùng «phạm thượng» trong chính văn bảo toàn sắc thái tôn giáo và ngôn ngữ của βλασφημέω khi đối tượng là Đức Chúa Trời. Dùng «vết loét» là thuật ngữ rõ ràng cho ἕλκη. «Ăn năn» giữ thuật ngữ phù hợp cho μετανοέω; chú thích có thể bảo lưu cấu trúc «từ/khỏi những việc làm».
  issues:
  - severity: medium
    issue: «Xúc phạm» làm yếu nghĩa của ἐβλασφήμησαν.
    rationale: Trong ngữ cảnh lời nói chống nghịch Đức Chúa Trời, βλασφημέω mang sắc thái «phạm thượng/phỉ báng», không chỉ là gây xúc phạm nói chung.
  - severity: medium
    issue: «Đức Chúa Trời của trời» không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này là bản dịch sát cấu trúc nhưng không phải cách gọi thông dụng; «Đức Chúa Trời trên trời» truyền đạt danh hiệu một cách tự nhiên và trang trọng.
  - severity: low
    issue: «Ăn năn, từ bỏ» thêm một động từ phối hợp và «nhưng» thay cho liên từ καὶ.
    rationale: Nguyên văn chỉ nói họ không ăn năn từ/khỏi các việc làm của họ. Bản sửa diễn đạt sự quy chiếu của việc ăn năn mà không thêm hành động độc lập, đồng thời giữ liên kết «và».
