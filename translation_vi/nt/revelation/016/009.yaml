id: REV.16.9
reference: Revelation 16:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: vi
  text: Người ta bị sức nóng dữ dội thiêu đốt, và họ phỉ báng danh Đức Chúa Trời, Đấng có quyền trên những tai họa này, và họ không ăn năn để tôn vinh Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: bị thiêu bỏng
  rationale: Động từ bị động diễn tả việc bị sức nóng làm bỏng; cách dịch này tự nhiên và không hàm ý họ bị thiêu hủy hoàn toàn.
- source_word: οἱ ἄνθρωποι
  choice: người ta
  rationale: Trong ngữ cảnh này, danh từ chỉ con người nói chung chứ không riêng nam giới; “người ta” truyền đạt tự nhiên phạm vi khái quát ấy.
- source_word: καῦμα μέγα
  choice: sức nóng dữ dội
  rationale: Cụm từ diễn tả mức độ hoặc tác nhân gây bỏng; “dữ dội” chuyển tải mức độ nghiêm trọng của μέγα bằng tiếng Việt hiện đại.
- source_word: ἐβλασφήμησαν
  choice: xúc phạm
  rationale: Khi đối tượng là danh Đức Chúa Trời, động từ chỉ lời nói bất kính, phỉ báng; “xúc phạm” rõ nghĩa với độc giả phổ thông và giữ sắc thái nghiêm trọng.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: danh Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh, trong đó “danh” đại diện cho căn tính và danh dự được bày tỏ của Đức Chúa Trời.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: Đấng có quyền trên những tai họa này
  rationale: Giữ lực hiện tại của phân từ ἔχοντος và ý nghĩa thẩm quyền của ἐξουσία; “trên” phản ánh quan hệ cai quản trong nguyên văn.
- source_word: πληγὰς
  choice: tai họa
  rationale: Trong Khải Huyền, từ này chỉ những tai họa phán xét; cách dịch này tự nhiên và giữ liên hệ với mạch văn.
- source_word: οὐ μετενόησαν
  choice: không ăn năn
  rationale: Trong bối cảnh phán xét, μετανοέω chỉ sự ăn năn về đạo đức và tâm linh, không chỉ là đổi ý.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: để tôn vinh Ngài
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả gắn với sự ăn năn, đồng thời giữ nội dung của thành ngữ “dâng vinh quang cho Ngài”.
theological_decisions:
- issue: Phạm vi của οἱ ἄνθρωποι
  choice: Chỉ con người nói chung qua cách nói “người ta”
  alternative: những người nam
  rationale: Ngữ cảnh nói về nhân loại chịu phán xét, không đưa ra dấu hiệu giới hạn đối tượng vào nam giới.
- issue: Quyền tể trị trong τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: Đức Chúa Trời có quyền trên những tai họa
  alternative: Đức Chúa Trời chỉ có liên hệ với những tai họa
  rationale: Nguyên văn trực tiếp quy ἐξουσία trên các tai họa cho Đức Chúa Trời; bản dịch giữ nguyên lời khẳng định này mà không mở rộng thêm.
- issue: Quan hệ của δοῦναι αὐτῷ δόξαν với μετενόησαν
  choice: “để tôn vinh Ngài” diễn tả mục đích hoặc kết quả dự kiến của sự ăn năn
  alternative: Tách việc ăn năn và tôn vinh thành hai hành động hoàn toàn độc lập
  rationale: Động từ nguyên mẫu gắn chặt với “ăn năn”; bản dịch giữ mối liên hệ ấy mà không xác định quá mức sắc thái cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ kính trọng “Ngài”; dấu chấm phẩy giúp thể hiện sự tương phản trước mệnh đề “nhưng họ không ăn năn”.
