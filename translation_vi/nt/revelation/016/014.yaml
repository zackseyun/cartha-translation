  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: các linh thuộc ma quỷ, làm dấu lạ, đi đến các vua trong phạm vi toàn thế giới nhằm tập hợp họ cho cuộc chiến liên hệ với ngày trọng đại của Đức Chúa Trời Toàn Năng. Tuy nhiên, “các vua trên khắp thế gian” có thể được hiểu là các vua đang ở nhiều nơi, thay vì “các vua của toàn thế giới”; cần làm rõ quan hệ sở hữu/phạm vi của τῆς οἰκουμένης ὅλης. Cụm “trong ngày trọng đại” là cách hiểu hợp ngữ cảnh của chuỗi sở hữu, nhưng “cuộc chiến của ngày trọng đại” giữ sát hơn mối liên hệ nguyên văn mà vẫn tự nhiên trong văn cảnh khải huyền.'
