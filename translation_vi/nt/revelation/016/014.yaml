id: REV.16.14
reference: Revelation 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: vi
  text: Vì chúng là các tà linh[a] làm những dấu lạ, đi đến các vua của khắp thế gian[b] để tập hợp họ cho cuộc chiến của ngày trọng đại của Đức Chúa Trời, Đấng Toàn Năng—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các linh của ma quỷ”.
    reason: lexical_alternative
  - marker: b
    text: Hay “các vua của toàn cõi có người ở”.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: các tà linh
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho các linh mang bản chất ma quỷ; chú thích giữ lại cách dịch sát cấu trúc sở hữu của nguyên ngữ.
- source_word: ποιοῦντα σημεῖα
  choice: làm những dấu lạ
  rationale: Giữ nghĩa trực tiếp của σημεῖα mà không xác định đó chỉ là trò giả mạo hay phép lạ cùng bản chất với công việc của Đức Chúa Trời.
- source_word: ἃ ἐκπορεύεται
  choice: Chúng đi
  rationale: Quy chiếu số nhiều về các tà linh; không mô phỏng sự bất tương hợp số trong hình thái Hy Lạp. Tách thành câu mới giúp tiếng Việt rõ và tự nhiên.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: đến các vua
  rationale: Trong ngữ cảnh chuyển động và mục đích tập hợp, ἐπί chỉ hướng đến các vua.
- source_word: τῆς οἰκουμένης ὅλης
  choice: trên khắp thế gian
  rationale: Diễn đạt tự nhiên phạm vi toàn cầu của οἰκουμένη, trong khi chú thích bảo lưu nghĩa sát là toàn cõi có người ở.
- source_word: συναγαγεῖν
  choice: để tập hợp
  rationale: Thể hiện rõ mục đích của động từ nguyên mẫu.
- source_word: εἰς τὸν πόλεμον
  choice: cho cuộc chiến
  rationale: Diễn đạt giá trị hướng đích của εἰς và giữ số ít của cuộc xung đột được nói đến.
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: trong ngày trọng đại
  rationale: Hiểu chuỗi sở hữu như việc cuộc chiến diễn ra vào ngày trọng đại; cách này tự nhiên trong tiếng Việt và không làm thay đổi quan hệ ý nghĩa.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: của Đức Chúa Trời Toàn Năng
  rationale: Giữ παντοκράτωρ như một tước hiệu thần thượng quen thuộc và trang trọng.
theological_decisions:
- issue: Bản chất của những dấu lạ do các tà linh làm
  choice: Dịch thẳng là “những dấu lạ”, không xác định cơ chế hay bản chất của chúng.
  alternative: Diễn giải thành trò lừa giả hoặc phép lạ theo đúng nghĩa của công việc thần thượng.
  rationale: Nguyên văn quy các dấu lạ cho các tà linh nhưng không giải quyết chúng là hiện tượng giả tạo, hành động siêu nhiên có thật, hay sự kết hợp của cả hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cuối câu được giữ vì câu tiếp tục sang đơn vị kế tiếp. Đại từ “chúng” giúp làm rõ chủ thể số nhiều bất chấp dạng động từ số ít bất thường trong bản Hy Lạp.
