source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: vi
  text: Thiên sứ thứ ba trút bát của mình vào các sông và các nguồn nước, và nước biến thành máu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn có thể dịch sát hơn: “và nó trở thành máu”; động từ số ít tóm gộp lượng nước trong các sông và các nguồn nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: thiên sứ thứ ba
  rationale: Tiếng Hy Lạp chỉ ghi “người thứ ba”, nhưng danh từ “thiên sứ” được hàm ý rõ từ ngữ cảnh gần (Khải Huyền 16:1–3). Trong tiếng Việt, thêm danh từ hàm ý giúp câu tự nhiên và tránh cách diễn đạt cụt nghĩa.
- source_word: ἐξέχεεν
  choice: trút
  rationale: ἐκχέω chỉ hành động đổ hoặc trút chất chứa trong vật đựng. “Trút” ngắn gọn, tự nhiên và phù hợp với hành động dùng bát trong chuỗi phán xét này.
- source_word: φιάλην
  choice: bát
  rationale: φιάλη là một vật đựng dạng bát nông; “bát” là từ hiện đại, rõ nghĩa và chính xác hơn các từ gợi một chai nhỏ.
- source_word: εἰς τοὺς ποταμούς
  choice: xuống các sông
  rationale: εἰς với đối cách diễn tả hướng chuyển động vào hoặc xuống nơi nhận. “Xuống các sông” diễn đạt tự nhiên hành động trút bát vào các dòng sông.
- source_word: πηγὰς τῶν ὑδάτων
  choice: các nguồn nước
  rationale: πηγή có thể chỉ suối, mạch hoặc nguồn; “các nguồn nước” là cách nói tự nhiên, bao quát và giữ quan hệ sở hữu của cụm Hy Lạp.
- source_word: ἐγένετο αἷμα
  choice: nước biến thành máu
  rationale: Động từ Hy Lạp ở số ít và chủ thể không được nêu rõ; “nước” được suy ra tự nhiên từ “các nguồn nước” và toàn bộ các sông, nguồn vừa nói đến. Cách dịch này giữ ý biến đổi mà không dùng đại từ số ít mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Chủ thể hàm ý của ἐγένετο
  choice: Nước trong các sông và nguồn nước biến thành máu
  alternative: Các sông và các nguồn nước biến thành máu
  rationale: Dạng động từ số ít cùng danh từ vị ngữ “máu” cho phép hiểu lượng nước được nói đến như một tổng thể. Dùng “nước” làm chủ thể hàm ý vừa tự nhiên trong tiếng Việt vừa không thu hẹp phạm vi của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thiên sứ” được bổ sung từ ngữ cảnh để hoàn chỉnh cách diễn đạt tiếng Việt; chú thích bảo lưu cấu trúc số ít và mức độ hàm ý của nguyên văn.
