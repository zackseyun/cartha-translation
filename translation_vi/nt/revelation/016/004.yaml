  terminology: “Bát,” “thiên sứ,” “các sông,” “các nguồn nước,” và “máu” đều phù hợp. “Các nguồn nước” giữ được phạm vi bao quát của πηγαὶ τῶν ὑδάτων; không cần ép nghĩa thành một loại nguồn cụ thể.
