revisions:
- from: Thiên sứ thứ ba trút bát mình xuống các sông và các nguồn nước, và nước biến thành máu.[a]
  to: Thiên sứ thứ ba trút bát của mình vào các sông và các nguồn nước, và nước biến thành máu.[a]
  rationale: Chỉ điều chỉnh cách diễn đạt tiếng Việt để phản ánh rõ sở hữu của “bát” và hướng “vào” của εἰς. Cách dịch “nước biến thành máu” được giữ lại vì diễn đạt tự nhiên chủ thể hàm ý tập thể/số ít của mệnh đề Hy Lạp, không thu hẹp phạm vi các sông và nguồn nước. Chú thích được giữ để bảo lưu sắc thái cấu trúc số ít của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:32Z'
