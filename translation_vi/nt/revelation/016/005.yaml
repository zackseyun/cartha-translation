revisions:
- from: 'Tôi nghe thiên sứ của các nguồn nước[c] nói: “Ngài thật công chính[b]—Đấng hiện có và đã có, Đấng Thánh[a]—vì Ngài đã phán xét những điều này.”'
  to: 'Tôi nghe thiên sứ của nước[c] nói: “Ngài thật công chính[b]—Đấng hiện có và đã có, Đấng Thánh[a]—vì Ngài đã phán xét những điều này.”'
  rationale: Chỉ sửa cụm chỉ phạm vi của thiên sứ và chú thích liên hệ để tránh thu hẹp τῶν ὑδάτων thành «các nguồn nước» hoặc áp đặt ý «cai quản». Các danh xưng thần thượng, trật tự lời xưng tụng, sắc thái nhân quả, và dị bản về công thức danh xưng đều được giữ nguyên theo SBLGNT và hồ sơ tiếng Anh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch bám sát cấu trúc và ý nghĩa của SBLGNT: lời của thiên sứ, lời tuyên xưng Đức Chúa Trời công chính, danh xưng rút gọn «Đấng hiện có và đã có, Đấng Thánh», và lý do là việc Ngài đã phán xét. Tuy nhiên, «các nguồn nước» thu hẹp τῶν ὑδάτων («của nước/các vùng nước») thành các mạch hay nguồn nước, điều nguyên văn không nói.'
  naturalness: Văn phong trang trọng, hiện đại và mạch lạc. «Thiên sứ của nước» hơi cô đọng nhưng tự nhiên trong văn cảnh Kinh Thánh, đồng thời bảo toàn sự không xác định của sở hữu cách Hy Lạp tốt hơn «các nguồn nước».
  terminology: «Thiên sứ», «công chính», «Đấng Thánh», và «phán xét» phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Không nên dùng «cai quản các nguồn nước» ở chú thích, vì vừa đổi «nước» thành «nguồn nước» vừa diễn giải vai trò thiên sứ mạnh hơn nguyên văn.
  issues:
  - severity: medium
    issue: «các nguồn nước» dịch τῶν ὑδάτων quá cụ thể.
    rationale: Ὕδατα là «nước/các vùng nước», không riêng các nguồn hay mạch nước. Dù các câu gần đó có nhắc sông và nguồn nước, câu này không dùng từ «nguồn».
  - severity: low
    issue: Chú thích c diễn giải và thu hẹp cụm từ gốc.
    rationale: «Thiên sứ cai quản các nguồn nước» thêm ý «cai quản» và thay «nước» bằng «nguồn nước». Một lựa chọn như «thiên sứ trên nước» phản ánh cách hiểu thay thế mà không thêm mức độ chi phối.
