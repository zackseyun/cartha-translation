id: REV.16.5
reference: Revelation 16:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: vi
  text: 'Tôi nghe thiên sứ của nước[c] nói: “Ngài thật công chính[b]—Đấng hiện có và đã có, Đấng Thánh[a]—vì Ngài đã phán xét những điều này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản có danh xưng đầy đủ hơn, chẳng hạn: “Đấng hiện có, đã có và đang đến”; có lẽ cách đọc này được hòa hợp với những công thức tương tự ở các chỗ khác trong sách Khải Huyền. Bản văn được dùng ở đây đọc: “Đấng hiện có và đã có, Đấng Thánh.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Ngài thật công bằng.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “thiên sứ trên nước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: thiên sứ của các nguồn nước
  rationale: Giữ sát cấu trúc sở hữu cách của tiếng Hy Lạp. Trong ngữ cảnh, cụm từ có thể chỉ thiên sứ gắn với hoặc cai quản các nguồn nước, nhưng bản dịch chính không diễn giải quá mức.
- source_word: Δίκαιος
  choice: công chính
  rationale: Từ này có thể mang nghĩa “công chính” hoặc “công bằng”. “Công chính” diễn tả phẩm tính đạo đức toàn vẹn của Đức Chúa Trời khi phán xét và phù hợp với giọng tôn vinh.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: Đấng hiện có và đã có
  rationale: Bảo tồn danh xưng thần thượng theo sát hai thành tố của bản Hy Lạp, không tự ý thêm yếu tố chỉ tương lai vốn không có trong bản văn SBLGNT tại đây.
- source_word: ὁ ὅσιος
  choice: Đấng Thánh
  rationale: ὅσιος chỉ sự thánh khiết, ngay lành và trung tín về mặt đạo đức; “Đấng Thánh” là danh xưng tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: 'Diễn đạt trực tiếp quan hệ nguyên nhân: việc Đức Chúa Trời phán xét như vậy là cơ sở cho lời tuyên xưng Ngài công chính.'
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ đại từ chỉ định khái quát của nguyên văn thay vì diễn giải thành “những sự phán xét này” hoặc “các hình phạt này”.
- source_word: ἔκρινας
  choice: đã phán xét
  rationale: Thể aorist nói đến hành động đã được thực hiện; “đã phán xét” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tư pháp của động từ.
theological_decisions:
- issue: Danh xưng thần thượng không có thành tố chỉ tương lai thường thấy ở những chỗ khác trong sách Khải Huyền
  choice: Đấng hiện có và đã có, Đấng Thánh
  alternative: Đấng hiện có, đã có và đang đến
  rationale: Bản SBLGNT đọc ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος. Bản dịch theo bản văn Hy Lạp được in, không hòa hợp câu này với công thức dài hơn ở những chỗ khác; dị bản được ghi ở chú thích.
- issue: Quan hệ cú pháp của ὁ ὅσιος với lời xưng tụng
  choice: Dùng danh xưng đồng vị “Đấng Thánh”, đặt trong cặp gạch ngang cùng với danh xưng đứng trước
  alternative: 'Hiểu như lời gọi trực tiếp: “Lạy Đấng Thánh, Ngài là Đấng hiện có và đã có”'
  rationale: Cách trình bày đồng vị phản ánh chuỗi danh xưng trong bản văn Hy Lạp nhưng không loại trừ hoàn toàn khả năng hiểu cụm này theo sắc thái hô cách.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” duy trì lối xưng hô tôn kính; “thiên sứ” phù hợp với văn phong Kinh Thánh hiện đại. Cặp gạch ngang giúp người đọc nhận ra hai danh xưng đồng vị mà không làm phẳng cấu trúc cô đọng của nguyên văn.
