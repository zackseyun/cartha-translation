id: REV.16.20
reference: Revelation 16:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: vi
  text: Mọi hải đảo đều chạy trốn[a], và núi non không được tìm thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “biến mất”. Động từ Hy Lạp theo nghĩa trực tiếp là “chạy trốn”, tạo nên hình ảnh nhân hóa sống động.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: mọi hải đảo
  rationale: Danh từ số ít đi với πᾶσα mang nghĩa phân phối, chỉ từng hải đảo; “mọi hải đảo” diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἔφυγεν
  choice: chạy trốn
  rationale: Giữ nghĩa trực tiếp của φεύγω và hình ảnh nhân hóa sống động; trong ngữ cảnh, kết quả là các đảo biến mất.
- source_word: ὄρη
  choice: núi non
  rationale: Diễn đạt tự nhiên dạng số nhiều ὄρη, không thêm ý nghĩa xác định mà nguyên văn không nêu.
- source_word: οὐχ εὑρέθησαν
  choice: không còn được tìm thấy
  rationale: Giữ cấu trúc bị động “không được tìm thấy”; từ “còn” làm rõ hàm ý ngữ cảnh rằng núi non không còn hiện diện mà không thay bằng cách diễn giải quá xa.
- source_word: καὶ ... καὶ
  choice: Mọi ... và
  rationale: Liên từ đầu câu được thể hiện qua sự tiếp nối của câu trong văn mạch, còn liên từ thứ hai dịch là “và”, giữ lối kể nối tiếp của sách Khải Huyền mà tránh mở câu tiếng Việt nặng nề.
theological_decisions:
- issue: Nên hiểu hình ảnh khải huyền là sự biến mất theo nghĩa đen hay là hình ảnh biểu tượng
  choice: Giữ hình ảnh cụ thể và nhân hóa “chạy trốn”
  alternative: Diễn giải là “biến mất” hoặc “tiêu tan”
  rationale: Nguyên văn mô tả biến động vũ trụ bằng hình ảnh sống động; bản dịch không quyết định thay người đọc rằng cảnh tượng này phải được hiểu theo nghĩa đen hay nghĩa biểu tượng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Hải đảo” phù hợp văn phong Kinh Thánh mà vẫn thông dụng; “chạy trốn” chủ ý giữ phép nhân hóa của nguyên văn.
