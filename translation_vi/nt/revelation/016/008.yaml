id: REV.16.8
reference: Revelation 16:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: vi
  text: Thiên sứ thứ tư đổ bát của mình xuống mặt trời,[a] và mặt trời được ban quyền thiêu đốt loài người bằng lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “và được ban cho nó để thiêu đốt loài người trong lửa.” Đại từ “nó” rất có thể chỉ mặt trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: Thiên sứ thứ tư
  rationale: Tính từ có mạo từ được dùng như danh từ và theo mạch văn chỉ thiên sứ thứ tư trong chuỗi thiên sứ trút bát. Tiếng Việt cần nêu danh từ để câu tự nhiên và rõ nghĩa.
- source_word: ἐξέχεεν
  choice: trút
  rationale: “Trút bát” là cách diễn đạt gọn, tự nhiên, diễn tả việc đổ hết vật chứa và phù hợp công thức lặp lại trong chương.
- source_word: φιάλην
  choice: bát
  rationale: Chỉ một vật chứa nông dạng bát; cách gọi này hiện đại và giữ được hình ảnh nghi lễ/phán xét trong sách Khải Huyền.
- source_word: ἐπὶ τὸν ἥλιον
  choice: trên mặt trời
  rationale: ἐπί với đối cách đánh dấu đích mà bát được trút xuống; “trên mặt trời” bám sát cấu trúc nguồn.
- source_word: ἐδόθη αὐτῷ
  choice: mặt trời được ban quyền
  rationale: Chuyển đại từ thành “mặt trời” để tránh đại từ vô tri mơ hồ trong tiếng Việt. “Quyền” được bổ sung theo nghĩa hàm ẩn của cấu trúc ἐδόθη + động từ nguyên mẫu, nhưng không nêu chủ thể ban quyền.
- source_word: καυματίσαι
  choice: thiêu đốt
  rationale: Diễn đạt sức nóng dữ dội gây bỏng cháy; trang trọng, tự nhiên và phù hợp hình ảnh lửa.
- source_word: τοὺς ἀνθρώπους
  choice: loài người
  rationale: ἄνθρωποι ở đây chỉ con người nói chung, không riêng nam giới; “loài người” giữ sắc thái tập thể phổ quát.
- source_word: ἐν πυρί
  choice: bằng lửa
  rationale: ἐν có thể biểu thị phương tiện hoặc phạm vi; “bằng lửa” là cách nói tự nhiên trong tiếng Việt, còn nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Tác nhân thần linh hàm ẩn trong ἐδόθη
  choice: Giữ thể bị động “được ban quyền” mà không nêu ai ban.
  alternative: Đức Chúa Trời ban cho mặt trời quyền
  rationale: Cách bị động trong Khải Huyền thường hàm ý quyền được ban từ Đức Chúa Trời, nhưng câu Hy Lạp không trực tiếp gọi tên tác nhân; bản dịch không nên làm điều hàm ẩn thành minh thị.
- issue: Sở chỉ của αὐτῷ
  choice: Hiểu là mặt trời.
  alternative: Thiên sứ thứ tư hoặc một tác nhân không xác định
  rationale: Danh từ gần nhất là ἥλιον, và chức năng thiêu đốt loài người phù hợp tự nhiên với mặt trời. Tuy vậy, chú thích giữ lại dạng sát chữ để người đọc thấy cấu trúc đại từ của nguyên văn.
- issue: Ý nghĩa đại diện của ἀνθρώπους
  choice: loài người
  alternative: những người nam; dân chúng
  rationale: Từ Hy Lạp chỉ con người nói chung trong cảnh phán xét, không mang nghĩa giới tính nam.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản chính ưu tiên sự tự nhiên của tiếng Việt nhưng chú thích bảo tồn cấu trúc sát chữ và mức độ mơ hồ của đại từ Hy Lạp.
