  to: Thiên sứ thứ tư đổ bát của mình xuống mặt trời,[a] và mặt trời được ban quyền thiêu đốt loài người bằng lửa.
  rationale: Chỉnh động từ và giới từ để câu tiếng Việt tự nhiên hơn, đồng thời chuyển neo chú thích đến cụm từ mà chú thích làm sáng tỏ. Giữ thể bị động không nêu tác nhân, giữ “quyền” như cách diễn đạt tự nhiên cho cấu trúc được-ban-để, và bảo tồn trong chú thích cả cách nói sát chữ lẫn mức độ dè dặt về sở chỉ đại từ.
