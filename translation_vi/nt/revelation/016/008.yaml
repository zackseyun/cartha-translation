  terminology: “Thiên sứ”, “bát”, “loài người”, và “thiêu đốt ... bằng lửa” phù hợp văn phong Khải Huyền và tiếng Việt hiện đại, trang trọng. Không cần nêu minh thị tác nhân ban quyền.
