  source_fidelity: 'Bản nháp truyền đạt đúng trình tự và nội dung Hy Lạp: thiên sứ thứ tư trút bát lên mặt trời; mặt trời được ban khả năng để thiêu đốt loài người bằng lửa. Việc hiểu αὐτῷ là mặt trời là hợp mạch văn, nhưng không nên trình bày như hoàn toàn không còn khả năng khác. Cụm “được ban quyền” là cách diễn đạt chấp nhận được cho bị động ἐδόθη + nguyên mẫu, dù “quyền” không được nêu trực tiếp.'
