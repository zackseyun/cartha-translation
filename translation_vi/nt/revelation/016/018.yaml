- from: Bấy giờ có những tia chớp, những tiếng động và những tiếng sấm; lại có một trận động đất lớn, chưa từng có trận nào như thế kể từ khi loài người xuất hiện trên đất—trận động đất ấy lớn đến vậy.
  to: Có chớp, tiếng động và tiếng sấm; có một trận động đất lớn, chưa từng có trận động đất nào như thế kể từ khi loài người xuất hiện trên mặt đất—một trận động đất lớn đến như vậy.
  rationale: Chỉnh sửa tối thiểu để làm rõ danh từ được so sánh, diễn đạt “trên mặt đất” tự nhiên hơn, và duy trì sự lặp lại nhấn mạnh của nguyên văn về trận động đất. Không cần chú thích vì “loài người” đã truyền đạt rõ nghĩa tổng quát của ἄνθρωποι và không có vấn đề văn bản được nêu.
