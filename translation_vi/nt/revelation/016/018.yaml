review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng chuỗi hiện tượng, trận động đất chưa từng có và sự nhấn mạnh lặp lại về quy mô. Tuy nhiên, “chưa từng có trận nào như thế” lược mất danh từ “động đất” trong mệnh đề so sánh; bản sửa phục hồi rõ đối tượng so sánh. “Trên mặt đất” phản ánh tự nhiên hơn ἐπὶ τῆς γῆς trong tiếng Việt hiện đại.
  naturalness: Cấu trúc liệt kê và dấu chấm phẩy phù hợp văn phong trang trọng. Bản sửa làm câu cuối tự nhiên hơn và tránh để “trận nào” hơi khẩu ngữ/thiếu tham chiếu rõ ràng.
  terminology: “Chớp,” “tiếng động,” “tiếng sấm,” “trận động đất,” và “loài người” đều phù hợp. “Loài người” diễn đạt đúng nghĩa bao quát của ἄνθρωποι, không hàm ý riêng nam giới.
  issues:
  - severity: low
    issue: Mệnh đề so sánh dùng “trận nào” thay vì nêu rõ “trận động đất nào”.
