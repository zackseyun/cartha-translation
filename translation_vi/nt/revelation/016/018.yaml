  - severity: low
    issue: “Trên đất” có thể gợi nghĩa trên đất liền hơn là trên thế giới/mặt đất.
    rationale: “Trên mặt đất” là cách nói tự nhiên, rõ ràng hơn cho ἐπὶ τῆς γῆς trong ngữ cảnh lịch sử phổ quát.
