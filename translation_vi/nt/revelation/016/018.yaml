id: REV.16.18
reference: Revelation 16:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: vi
  text: Có chớp, tiếng động và tiếng sấm; có một trận động đất lớn, chưa từng có trận động đất nào như thế kể từ khi loài người xuất hiện trên mặt đất—một trận động đất lớn đến như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: những tia chớp
  rationale: Danh từ số nhiều chỉ các tia chớp liên tiếp; cách diễn đạt này tự nhiên và giữ được ý số nhiều.
- source_word: φωναὶ
  choice: những tiếng động
  rationale: φωνή có thể là tiếng nói hoặc âm thanh. Trong chuỗi hiện tượng gồm chớp và sấm, “tiếng động” giữ nghĩa phi ngôn ngữ phù hợp ngữ cảnh mà không xác định quá mức nguồn âm thanh.
- source_word: βρονταί
  choice: những tiếng sấm
  rationale: Cách dịch tự nhiên trong tiếng Việt, đồng thời thể hiện hình thức số nhiều và tính lặp lại của tiếng sấm.
- source_word: σεισμὸς
  choice: trận động đất
  rationale: Tương đương thông dụng và rõ ràng trong ngữ cảnh.
- source_word: μέγας
  choice: lớn
  rationale: Giữ sắc thái trang trọng, trực tiếp và phù hợp văn phong khải huyền.
- source_word: οἷος οὐκ ἐγένετο
  choice: chưa từng có trận nào như thế
  rationale: Diễn đạt tự nhiên phép so sánh nhấn mạnh tính chưa từng có, đồng thời làm rõ danh từ “trận động đất” đã nêu.
- source_word: ἀφ’ οὗ
  choice: kể từ khi
  rationale: Giữ đúng quan hệ thời gian của cụm từ Hy Lạp.
- source_word: ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: loài người xuất hiện trên đất
  rationale: ἄνθρωποι ở đây chỉ toàn thể nhân loại chứ không riêng nam giới; “loài người” trang trọng, chính xác và ἐγένοντο được thể hiện tự nhiên bằng “xuất hiện”.
- source_word: τηλικοῦτος ... οὕτω μέγας
  choice: lớn đến vậy
  rationale: Giữ sự nhấn mạnh lặp lại về quy mô phi thường của trận động đất mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi chỉ định của ἄνθρωποι trong phép so sánh lịch sử mang tính khải huyền
  choice: loài người
  alternative: người ta; con người
  rationale: Cụm từ nói đến nhân loại nói chung, không riêng nam giới. “Loài người” bảo toàn ý nghĩa bao quát và sắc thái trang trọng, không đưa thêm lập trường giáo phái.
- issue: Tính chất của φωναὶ trong chuỗi hiện tượng thần hiện
  choice: những tiếng động
  alternative: những tiếng nói
  rationale: Ngữ cảnh chớp và sấm nghiêng về các âm thanh, nhưng từ Hy Lạp cũng có thể mang nghĩa “tiếng nói”. Bản dịch chính chọn nghĩa phù hợp ngữ cảnh nhất mà không gán nội dung lời nói vốn không được câu này nêu ra.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp liệt kê của nguyên văn, đồng thời dùng dấu chấm phẩy và gạch ngang để thể hiện hai điểm nhấn: chuỗi hiện tượng và độ lớn chưa từng có của trận động đất.'
