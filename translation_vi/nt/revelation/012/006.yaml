id: REV.12.6
reference: Revelation 12:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: vi
  text: Người phụ nữ chạy trốn vào vùng hoang vắng, tại đó bà có một nơi được Đức Chúa Trời chuẩn bị sẵn, để tại đó họ nuôi dưỡng bà[a] trong một nghìn hai trăm sáu mươi ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để bà được nuôi dưỡng tại đó trong một nghìn hai trăm sáu mươi ngày.” Tiếng Hy Lạp dùng động từ chủ động ngôi thứ ba số nhiều nhưng không nêu chủ thể, theo nghĩa đen là “để họ nuôi dưỡng bà tại đó.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: chạy trốn
  rationale: Diễn đạt hành động lánh đi để thoát nguy hiểm, giữ được sắc thái khẩn cấp của động từ φεύγω mà không thêm chi tiết.
- source_word: ἔρημον
  choice: hoang mạc
  rationale: Chỉ nơi hoang vắng, ít người ở; cách dịch này giữ âm hưởng Kinh Thánh và không giới hạn ý nghĩa vào một vùng toàn cát.
- source_word: τόπον
  choice: một nơi
  rationale: Tương ứng trực tiếp và tự nhiên với τόπος, đồng thời giữ sắc thái bất định.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: được Đức Chúa Trời chuẩn bị sẵn
  rationale: Phân từ hoàn thành bị động cho thấy nơi ấy đã được chuẩn bị; 'sẵn' truyền đạt trạng thái đã hoàn tất, còn ἀπό chỉ tác nhân.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mục đích của mệnh đề ἵνα trong tiếng Việt hiện đại.
- source_word: τρέφωσιν αὐτὴν
  choice: họ nuôi dưỡng bà
  rationale: Giữ ngôi thứ ba số nhiều chủ động với chủ thể không được nêu rõ trong nguyên văn; 'nuôi dưỡng' bao hàm việc cung cấp thức ăn và chăm sóc lâu dài.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: trong một ngàn hai trăm sáu mươi ngày
  rationale: Diễn đạt đối cách chỉ khoảng thời gian bằng 'trong' và viết số bằng chữ cho phù hợp văn xuôi Kinh Thánh.
- source_word: ὅπου ἔχει ἐκεῖ
  choice: tại đó bà có
  rationale: Giữ ý về địa điểm được nhấn mạnh bởi ὅπου và ἐκεῖ nhưng tránh lặp từ gượng gạo trong tiếng Việt.
theological_decisions:
- issue: Chủ thể không được xác định của τρέφωσιν
  choice: 'Giữ dạng chủ động không xác định: “họ nuôi dưỡng bà”.'
  alternative: “bà được nuôi dưỡng tại đó” hoặc “Đức Chúa Trời nuôi dưỡng bà tại đó”
  rationale: Nguyên văn dùng động từ ngôi thứ ba số nhiều chủ động mà không nêu chủ thể. Không nên tự ý xác định chủ thể là Đức Chúa Trời; chuyển sang bị động sẽ làm mất cấu trúc chủ động và tính không xác định của bản Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” để quy chiếu tự nhiên đến “người phụ nữ”; giữ “họ” dù chủ thể không được nêu nhằm bảo toàn sự mơ hồ của nguyên văn.
