  terminology: “Đức Chúa Trời”, “chuẩn bị sẵn”, và “nuôi dưỡng” đều phù hợp. Không nên xác định “họ” là Đức Chúa Trời hoặc một nhóm cụ thể. Chú thích cần đặt neo ngay sau mệnh đề mà nó giải thích.
