revisions:
- from: Người phụ nữ chạy trốn vào hoang mạc, tại đó bà có một nơi được Đức Chúa Trời chuẩn bị sẵn, để họ nuôi dưỡng bà tại đó trong một ngàn hai trăm sáu mươi ngày.[a]
  to: Người phụ nữ chạy trốn vào vùng hoang vắng, tại đó bà có một nơi được Đức Chúa Trời chuẩn bị sẵn, để tại đó họ nuôi dưỡng bà[a] trong một nghìn hai trăm sáu mươi ngày.
  rationale: Thay “hoang mạc” bằng “vùng hoang vắng” để phản ánh ἔρημος mà không thu hẹp nghĩa vào sa mạc. Đổi “một ngàn” thành “một nghìn” theo chuẩn chính tả-văn phong hiện đại. Chuyển neo chú thích đến ngay sau cụm động từ chủ động số nhiều không xác định mà chú thích giải thích; không thay đổi nghĩa hay giải quyết sự mơ hồ về chủ thể.
