    rationale: Từ Hy Lạp có thể chỉ sa mạc hoặc vùng hoang vắng; “vùng hoang vắng” giữ được độ rộng nghĩa mà không thêm đặc điểm địa lý như cát.
  - severity: low
    issue: Neo chú thích hiện ở cuối cả câu thay vì sát mệnh đề có cách dịch thay thế.
    rationale: Chú thích giải thích τρέφωσιν αὐτήν, không giải thích toàn câu; đặt [a] sau “nuôi dưỡng bà tại đó” làm chức năng chú thích rõ ràng hơn.
