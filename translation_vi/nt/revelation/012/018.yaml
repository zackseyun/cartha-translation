id: REV.12.18
reference: Revelation 12:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: vi
  text: Rồi nó đứng trên cát biển[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Rồi tôi đứng trên cát biển.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối tiếp diễn biến của câu trước; “Rồi” diễn đạt tự nhiên sự tiếp nối trong văn kể tiếng Việt.
- source_word: ἐστάθη
  choice: nó đứng
  rationale: Dạng aorist có hình thức bị động của ἵστημι nhưng được dùng với nghĩa nội động từ “đứng”. Chủ ngữ ngôi thứ ba số ít theo ngữ cảnh chỉ con rồng ở câu trước; đại từ “nó” phù hợp với một sinh vật được nhắc đến.
- source_word: ἐπὶ
  choice: trên
  rationale: Với ngữ cảnh của động từ “đứng”, giới từ diễn tả vị trí trên bề mặt.
- source_word: τὴν ἄμμον
  choice: cát
  rationale: ἄμμος chỉ vật chất “cát”; giữ hình ảnh cụ thể thay vì chuyển thành nghĩa rộng hơn là “bờ”.
- source_word: τῆς θαλάσσης
  choice: biển
  rationale: Danh từ sở hữu cách bổ nghĩa cho “cát”. Cụm “cát biển” là cách nói tự nhiên, gọn và giữ quan hệ của nguyên văn.
theological_decisions:
- issue: Chủ ngữ và dị bản của động từ
  choice: Bản văn chính theo SBLGNT ἐστάθη, dịch “nó đứng”, trong ngữ cảnh tự nhiên chỉ con rồng ở câu trước.
  alternative: Một số thủ bản có ἐστάθην, nghĩa là “tôi đứng”.
  rationale: Giữ cách đọc ngôi thứ ba của bản văn nguồn trong chính văn, đồng thời ghi nhận dị bản ngôi thứ nhất ở chú thích để không xóa bỏ sự khác biệt văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cát biển” tự nhiên hơn lối dịch sát chữ “cát của biển”; đại từ “nó” nối với con rồng trong văn cảnh mà không gọi đích danh chủ thể.
