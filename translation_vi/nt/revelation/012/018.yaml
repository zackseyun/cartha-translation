  source_fidelity: Bản dịch theo đúng cách đọc SBLGNT ἐστάθη, hiểu là động từ nội động từ “đứng”. Chủ ngữ ngôi thứ ba được cung cấp theo văn cảnh trước đó (con rồng); “nó” giữ được sự quy chiếu mà không thêm định danh vào nguyên văn. “Trên cát biển” chuyển đạt tự nhiên ἐπὶ τὴν ἄμμον τῆς θαλάσσης.
