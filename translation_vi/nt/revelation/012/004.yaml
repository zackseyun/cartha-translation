revisions:
- from: Đuôi nó quét một phần ba các ngôi sao trên trời và ném chúng xuống đất. Con rồng đứng trước người phụ nữ sắp sinh, để khi nàng sinh con, nó sẽ nuốt chửng đứa con của nàng.
  to: Đuôi nó quét đi một phần ba các ngôi sao trên trời, rồi ném chúng xuống đất. Con rồng đứng trước người phụ nữ sắp sinh, để khi nàng sinh con, nó sẽ nuốt chửng đứa con của nàng.
  rationale: Chỉnh tối thiểu «quét» thành «quét đi» để phản ánh sát hơn σύρει trong hình ảnh cái đuôi cuốn/kéo các sao, và thêm «rồi» để câu tiếng Việt mạch lạc. Giữ nguyên hình ảnh biểu tượng, các đại từ quy chiếu, ý hướng của ἵνα, và sự đối lập hiện tại–aorist của hai động từ đầu câu.
