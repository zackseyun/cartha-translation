review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: đuôi con rồng, một phần ba sao trên trời, việc bị ném xuống đất, con rồng đứng trước người phụ nữ sắp sinh, và ý định nuốt chửng con của nàng. Tuy nhiên, σύρει có sắc thái kéo/quét đi; «quét» không có «đi» hơi thiếu hướng-tác động trong ngữ cảnh. Cấu trúc phối hợp cũng nên làm rõ hành động thứ hai nối tiếp hành động thứ nhất, đồng thời vẫn giữ hiện tại σύρει và quá khứ ἔβαλεν.'
  naturalness: «Đuôi nó quét đi ... rồi ném chúng xuống đất» tự nhiên, rõ quan hệ giữa hai động từ, và duy trì nhịp thị kiến. «Người phụ nữ», «sắp sinh», và «nuốt chửng» phù hợp tiếng Việt hiện đại, trang trọng.
  terminology: «Con rồng» dịch đúng δράκων; «một phần ba», «các ngôi sao trên trời», và «nuốt chửng» đều chính xác. Không cần chú thích diễn giải biểu tượng hay áp đặt đồng nhất các ngôi sao với thiên sứ.
  issues:
  - severity: low
    issue: Sắc thái hướng của σύρει chưa được biểu lộ đầy đủ.
    rationale: «Quét» có thể chỉ hành động quét nói chung, trong khi σύρει ở đây diễn tả kéo/quét đi một phần ba các sao. Thêm «đi» biểu đạt tự nhiên tác động cuốn đi mà không diễn giải quá mức.
  - severity: low
    issue: Liên kết hai động từ ở mệnh đề đầu hơi gãy và có thể làm mờ trình tự.
    rationale: Thêm «rồi» giúp tiếng Việt đọc tự nhiên hơn, biểu thị hành động ném (aorist) theo sau động tác quét đi (hiện tại), nhưng không xóa sự chuyển đổi thì của nguyên ngữ.
  revised_text: Đuôi nó quét đi một phần ba các ngôi sao trên trời, rồi ném chúng xuống đất. Con rồng đứng trước người phụ nữ sắp sinh, để khi nàng sinh con, nó sẽ nuốt chửng đứa con của nàng.
