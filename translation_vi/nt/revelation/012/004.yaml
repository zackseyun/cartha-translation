id: REV.12.4
reference: Revelation 12:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: vi
  text: Đuôi nó quét đi một phần ba các ngôi sao trên trời, rồi ném chúng xuống đất. Con rồng đứng trước người phụ nữ sắp sinh, để khi nàng sinh con, nó sẽ nuốt chửng đứa con của nàng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: quét
  rationale: Động từ ở thì hiện tại, gợi chuyển động kéo/quét bằng đuôi; “quét” tự nhiên trong tiếng Việt và giữ được sắc thái sống động.
- source_word: τὸ τρίτον
  choice: một phần ba
  rationale: Cách diễn đạt thông dụng, chính xác về tỷ lệ.
- source_word: ἔβαλεν
  choice: ném
  rationale: Động từ aorist mang nghĩa quăng/ném xuống; giữ sự chuyển đổi thì đáng chú ý từ hiện tại σύρει sang quá khứ ἔβαλεν.
- source_word: ἕστηκεν
  choice: đứng
  rationale: Perfect có thể nhấn mạnh tư thế đã được thiết lập và còn tiếp diễn; tiếng Việt tự nhiên dùng “đứng” mà không buộc phải diễn giải thêm.
- source_word: μελλούσης τεκεῖν
  choice: sắp sinh
  rationale: Diễn đạt tự nhiên ý người phụ nữ đang ở vào thời điểm chuẩn bị sinh con.
- source_word: καταφάγῃ
  choice: nuốt chửng
  rationale: Truyền đạt sức mạnh của động từ chỉ việc ăn ngấu nghiến/tiêu nuốt hoàn toàn.
- source_word: τὸ τέκνον αὐτῆς
  choice: đứa con của nàng
  rationale: Giữ danh từ trung tính chỉ đứa trẻ/con; “nàng” tạo văn phong trang trọng vừa phải và tránh lặp “người phụ nữ”.
theological_decisions:
- issue: Ý nghĩa biểu tượng của một phần ba các ngôi sao
  choice: Giữ nguyên hình ảnh “một phần ba các ngôi sao trên trời” mà không xác định chúng là thiên sứ hay một nhóm hữu thể cụ thể.
  alternative: Diễn giải các ngôi sao là các thiên sứ sa ngã.
  rationale: Câu Hy Lạp không giải thích trực tiếp biểu tượng; bản dịch không nên áp đặt một cách giải nghĩa thần học.
- issue: Sự chuyển đổi thì giữa σύρει và ἔβαλεν
  choice: Dịch lần lượt “quét” và “ném”, bảo toàn sự chuyển đổi hiện tại–quá khứ trong nguồn.
  alternative: Đồng nhất cả hai ở thì hiện tại hoặc quá khứ để câu trôi chảy hơn.
  rationale: Sự bất tương hợp về thì có thật trong văn bản SBLGNT và có thể mang sắc thái thị kiến; không nên âm thầm làm phẳng.
- issue: Mục đích của con rồng
  choice: Dịch trực tiếp mệnh đề ἵνα là “để… nó sẽ nuốt chửng”.
  alternative: Dùng “hầu có thể nuốt chửng” để nhấn mạnh thức giả định.
  rationale: Tiếng Việt không biểu thị thức giả định như tiếng Hy Lạp; “để” giữ rõ ý định mà không khẳng định hành động đã thành công.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ nhịp kể thị kiến, hình ảnh mạnh, cùng sự chuyển đổi thì bất thường của nguyên bản; không thêm giải nghĩa biểu tượng.
