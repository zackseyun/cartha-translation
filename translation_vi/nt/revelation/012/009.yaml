id: REV.12.9
reference: Revelation 12:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: vi
  text: Con rồng lớn bị quăng xuống—con rắn thuở xưa[a], kẻ được gọi là Ma Quỷ và Sa-tan, kẻ lừa dối toàn thể thế gian[b]. Nó bị quăng xuống đất, và các thiên sứ của nó cũng bị quăng xuống cùng với nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hình ảnh “con rắn thuở xưa” gợi lại con rắn trong Sáng Thế Ký 3.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “toàn bộ thế giới có người ở.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: bị quăng xuống
  rationale: Diễn đạt sự trục xuất mạnh mẽ theo hướng từ trên xuống, đồng thời giữ nguyên sự lặp lại có chủ ý của động từ trong câu.
- source_word: δράκων ὁ μέγας
  choice: con rồng lớn
  rationale: “Rồng” là từ tương ứng tự nhiên với hình tượng khải huyền δράκων; “lớn” giữ sắc thái của μέγας.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: con rắn thuở xưa
  rationale: “Con rắn” rõ nghĩa và gợi lại Sáng Thế Ký 3; “thuở xưa” diễn đạt ἀρχαῖος tự nhiên mà không giải thích quá mức thành “nguyên thủy”.
- source_word: ὁ καλούμενος
  choice: kẻ được gọi là
  rationale: Giữ chức năng định danh của phân từ và nối tự nhiên với hai danh xưng tiếp theo.
- source_word: Διάβολος
  choice: Ma Quỷ
  rationale: Trong ngữ cảnh này, từ ấy được dùng như danh xưng quen thuộc của một nhân vật, nên dịch bằng cách gọi chuẩn trong tiếng Việt thay vì nghĩa từ nguyên “kẻ vu cáo”.
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Phiên âm tên gọi theo quy ước tiếng Việt, không thay bằng cách giải nghĩa “Kẻ Chống Đối” trong chính văn.
- source_word: ὁ πλανῶν
  choice: kẻ lừa dối
  rationale: πλανάω có thể chỉ việc lừa dối hoặc dẫn đi lạc; “lừa dối” ngắn gọn, tự nhiên và phù hợp với hành động mang tầm mức toàn cầu ở đây.
- source_word: τὴν οἰκουμένην ὅλην
  choice: toàn thể thế gian
  rationale: Diễn đạt tự nhiên phạm vi phổ quát của “toàn bộ thế giới có người ở”; chú thích giữ lại sắc thái từ vựng cụ thể hơn.
- source_word: εἰς τὴν γῆν
  choice: xuống đất
  rationale: Ngữ cảnh đối lập nơi trời với cõi đất và động từ hàm ý hướng xuống; cách nói này tự nhiên trong tiếng Việt.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: các thiên sứ của nó
  rationale: Trong ngữ cảnh khải huyền, ἄγγελοι chỉ các hữu thể siêu nhiên đi theo con rồng, không đơn thuần là sứ giả loài người.
- source_word: μετ’ αὐτοῦ
  choice: cùng với nó
  rationale: Giữ rõ ý đồng hành trong sự kiện bị quăng xuống.
theological_decisions:
- issue: Cách trình bày Διάβολος và Σατανᾶς trong chuỗi đồng vị ngữ
  choice: kẻ được gọi là Ma Quỷ và Sa-tan
  alternative: kẻ được gọi là Kẻ Vu Cáo và Kẻ Chống Đối
  rationale: Bản Hy Lạp dùng hai danh xưng để nhận diện con rồng. Cách dịch này giữ tên gọi quen thuộc trong Kinh Thánh mà không thêm diễn giải giáo lý.
- issue: Phạm vi của οἰκουμένη
  choice: toàn thể thế gian
  alternative: toàn bộ thế giới có người ở
  rationale: “Toàn thể thế gian” giữ tầm mức phổ quát phù hợp với văn cảnh khải huyền, trong khi chú thích nêu nghĩa cụ thể hơn mà không thu hẹp cách hiểu của chính văn.
- issue: Đại từ chỉ con rồng và các thiên sứ thuộc về nó
  choice: nó / của nó
  alternative: hắn / của hắn
  rationale: Tiền ngữ trực tiếp là “con rồng” và “con rắn”; dùng “nó” duy trì hình tượng biểu trưng của bản văn, không biến hình tượng ấy thành một nhân vật mang cách xưng hô thuần nhân loại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ chuỗi đồng vị ngữ đầy kịch tính của câu Hy Lạp; sự lặp lại “bị quăng xuống” được bảo toàn để duy trì nhịp điệu và điểm nhấn. Mọi dấu chú thích đều xuất hiện đúng vị trí trong chính văn.
