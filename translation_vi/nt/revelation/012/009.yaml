  terminology: '“Ma Quỷ” và “Sa-tan” giữ các danh xưng quen thuộc, không diễn giải các tên gọi thành một lập trường thần học. “Thiên sứ” phù hợp ngữ cảnh khải huyền. Các chú thích được đặt đúng chỗ trong bản tiếng Việt: chú thích về Sáng Thế Ký 3 neo tại “con rắn thuở xưa”, còn chú thích từ vựng neo tại “toàn thể thế gian”.'
