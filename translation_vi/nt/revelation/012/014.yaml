revisions:
- from: Người phụ nữ được ban cho đôi cánh của đại bàng lớn, để nàng bay vào hoang mạc, đến nơi dành cho mình. Tại đó, nàng được nuôi dưỡng trong một kỳ, các kỳ và nửa kỳ, xa khỏi mặt con rắn.
  to: Người phụ nữ được ban cho hai cánh của con đại bàng lớn, để nàng bay vào hoang mạc, đến chỗ của mình; tại chính nơi đó, nàng được nuôi dưỡng một thời kỳ, các thời kỳ và nửa thời kỳ, tránh xa con rắn.
  rationale: Bản sửa loại bỏ ý bổ sung về một nơi “dành sẵn”, làm tự nhiên thành ngữ chỉ sự lánh xa con rắn, và cải thiện cách diễn đạt công thức thời gian mà không diễn giải số nhiều thành “hai” hoặc thành ba năm rưỡi. “Tại chính nơi đó” duy trì được phần nhấn mạnh của ἐκεῖ trong giới hạn văn phong tiếng Việt tự nhiên.
