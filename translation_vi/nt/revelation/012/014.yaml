    issue: “đến nơi dành cho mình” thêm sắc thái nơi đã được dành sẵn.
    rationale: τὸν τόπον αὐτῆς nghĩa đen là “chỗ/nơi của nàng”; nguyên văn không nói nơi ấy được dành hay chuẩn bị cho nàng.
  - severity: medium
    issue: “xa khỏi mặt con rắn” là lối bám chữ không tự nhiên.
    rationale: ἀπὸ προσώπου τοῦ ὄφεως là thành ngữ chỉ tránh xa khỏi sự hiện diện hay sự truy đuổi của con rắn. “Tránh xa con rắn” chuyển tải nghĩa này tự nhiên trong tiếng Việt.
  - severity: low
    issue: “các kỳ” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Các thời kỳ” đọc tự nhiên hơn, đồng thời vẫn duy trì số nhiều không xác định của καιρούς.
