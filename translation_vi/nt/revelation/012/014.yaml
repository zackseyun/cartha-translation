id: REV.12.14
reference: Revelation 12:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: vi
  text: Người phụ nữ được ban cho hai cánh của con đại bàng lớn, để nàng bay vào hoang mạc, đến chỗ của mình; tại chính nơi đó, nàng được nuôi dưỡng một thời kỳ, các thời kỳ và nửa thời kỳ, tránh xa con rắn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθησαν
  choice: được ban cho
  rationale: Giữ thể bị động và sắc thái một ân ban hay sự cung ứng mà không xác định tác nhân.
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: đôi cánh của đại bàng lớn
  rationale: “Đôi cánh” diễn đạt tự nhiên chính xác số hai; cấu trúc sở hữu giữ hình ảnh của nguyên văn.
- source_word: ἔρημον
  choice: hoang mạc
  rationale: Phù hợp bối cảnh Kinh Thánh và có thể chỉ vùng hoang vắng, không nhất thiết chỉ sa mạc cát.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: đến nơi dành cho mình
  rationale: Diễn đạt tự nhiên ý “nơi của nàng” như một chỗ đã dành sẵn, không thêm nhận định về chủ thể chuẩn bị nơi ấy.
- source_word: τρέφεται
  choice: được nuôi dưỡng
  rationale: Giữ thể bị động và nghĩa được cung cấp thức ăn/chăm sóc, không nêu tác nhân vốn không xuất hiện trong câu.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: một kỳ, các kỳ và nửa kỳ
  rationale: Bảo tồn cách diễn đạt biểu tượng và sự không xác định của số nhiều καιρούς thay vì diễn giải thành một con số cụ thể.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: xa khỏi mặt con rắn
  rationale: Giữ hình ảnh Semit của πρόσωπον và ý tách khỏi sự hiện diện hay tầm với của con rắn.
theological_decisions:
- issue: Khoảng thời gian biểu tượng
  choice: một kỳ, các kỳ và nửa kỳ
  alternative: ba năm rưỡi
  rationale: Nguyên văn không nói thẳng “ba năm rưỡi”; bản dịch giữ công thức biểu tượng và không áp đặt cách tính hoặc cách giải nghĩa.
- issue: Tác nhân nuôi dưỡng người phụ nữ
  choice: dùng thể bị động “được nuôi dưỡng” mà không nêu tác nhân
  alternative: Đức Chúa Trời nuôi dưỡng nàng
  rationale: Câu Hy Lạp không xác định tác nhân; không nên thêm một sự nhận diện thần học dù văn cảnh có thể gợi ý.
- issue: Ý nghĩa của người phụ nữ, đại bàng và con rắn
  choice: giữ nguyên các hình tượng, không diễn giải trong chính văn
  alternative: thay bằng các thực thể được một truyền thống giải nghĩa cụ thể
  rationale: Bảo tồn tính khải tượng và tránh nhập các lập trường giáo phái vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để quy chiếu rõ đến người phụ nữ trong mạch kể; giữ “một kỳ, các kỳ và nửa kỳ” cùng thành ngữ “xa khỏi mặt” nhằm bảo toàn hình ảnh và độ mơ hồ chân thực của nguyên văn.
