id: REV.12.15
reference: Revelation 12:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: vi
  text: Con rắn phun từ miệng nó một dòng nước như sông về phía người phụ nữ[a], nhằm làm cho bà bị dòng sông cuốn đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau người phụ nữ” hoặc “ở phía sau người phụ nữ.” Cụm Hy Lạp có thể chỉ vị trí ở phía sau hoặc hướng truy đuổi.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “làm cho bà thành người bị sông cuốn.” Từ Hy Lạp hiếm dùng ở đây chỉ việc bị dòng sông cuốn hoặc mang đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: phun
  rationale: Trong hình ảnh nước tuôn ra từ miệng con rắn, “phun” tự nhiên và sinh động trong tiếng Việt, đồng thời vẫn diễn tả hành động mạnh hướng về phía người phụ nữ.
- source_word: ὁ ὄφις
  choice: con rắn
  rationale: Cách gọi thông dụng, trang trọng vừa đủ và giữ nguyên hình tượng Kinh Thánh mà không thêm lời giải thích biểu tượng.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: từ miệng nó
  rationale: Diễn đạt trực tiếp nguồn phát ra của dòng nước; đại từ “nó” phù hợp với con vật trong tiếng Việt.
- source_word: ὀπίσω τῆς γυναικός
  choice: đuổi theo người phụ nữ
  rationale: Trong ngữ cảnh tấn công và truy đuổi, cụm này diễn tả hướng nước nhắm theo người phụ nữ; chú thích vẫn bảo lưu nghĩa không gian “ở phía sau”.
- source_word: ὕδωρ ὡς ποταμόν
  choice: một dòng nước như sông
  rationale: Giữ phép so sánh do ὡς biểu thị và hình ảnh ποταμός là sông, không đổi thành cách giải thích như “lũ”.
- source_word: ἵνα
  choice: nhằm
  rationale: Diễn tả rõ mục đích của hành động trong tiếng Việt hiện đại.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: làm cho bà bị dòng sông cuốn đi
  rationale: Giữ cấu trúc gây khiến của ποιέω và ý nghĩa hiếm của ποταμοφόρητος là bị sông cuốn/chở đi, không thêm ý chết đuối.
theological_decisions:
- issue: Hình ảnh biểu tượng về cuộc tấn công của con rắn
  choice: Giữ nguyên hình ảnh “dòng nước như sông” và “bị dòng sông cuốn đi”, không giải mã biểu tượng trong chính văn.
  alternative: Diễn giải nước là quân đội, sự bách hại, lời dối trá hoặc hỗn mang.
  rationale: Nguyên văn trình bày hình ảnh khải huyền mà không trực tiếp xác định đối tượng được tượng trưng; bản dịch không nên áp đặt một cách giải nghĩa giáo lý.
- issue: Sắc thái mục đích của ἵνα
  choice: Dịch là “nhằm” để thể hiện chủ ý của con rắn.
  alternative: Dịch theo kết quả đơn thuần là “đến nỗi”.
  rationale: Trong ngữ cảnh hành động thù địch có chủ đích, nghĩa mục đích là tự nhiên hơn, dù ἵνα đôi khi có thể mang sắc thái kết quả.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, câu văn rõ và giàu hình ảnh nhưng vẫn trang trọng. Dùng “người phụ nữ” theo cách gọi trong văn mạch; chuyển sang “bà” ở mệnh đề sau để tránh lặp nặng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
