id: REV.12.10
reference: Revelation 12:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: vi
  text: 'Rồi tôi nghe một tiếng nói lớn trên trời nói rằng: “Giờ đây, sự cứu rỗi, quyền năng, vương quốc của Đức Chúa Trời chúng ta và thẩm quyền của Đấng Mê-si-a của Ngài đã đến, vì kẻ tố cáo anh em chúng ta[a] đã bị quăng xuống, kẻ ngày đêm tố cáo họ trước mặt Đức Chúa Trời chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” có thể chỉ chung các tín hữu, gồm cả phụ nữ lẫn nam giới.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: một tiếng lớn
  rationale: Cụm từ chỉ một tiếng nói vang lớn; cách diễn đạt này tự nhiên, trang trọng và không buộc phải thêm danh từ “nói” vốn không có trong cụm Hy Lạp.
- source_word: Ἄρτι ἐγένετο
  choice: Giờ đây ... đã đến
  rationale: Ἄρτι đánh dấu thời điểm quyết định hiện tại, còn ἐγένετο diễn tả biến cố nay đã thành hiện thực; “đã đến” truyền đạt sắc thái kết quả trong ngữ cảnh khải huyền.
- source_word: ἡ σωτηρία
  choice: sự cứu rỗi
  rationale: Thuật ngữ quen thuộc, trang trọng, diễn đạt hành động và thực tại cứu thoát của Đức Chúa Trời.
- source_word: ἡ δύναμις
  choice: quyền năng
  rationale: Phân biệt sức mạnh hữu hiệu của Đức Chúa Trời với ἐξουσία là thẩm quyền hay quyền cai trị.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: vương quốc của Đức Chúa Trời chúng ta
  rationale: βασιλεία có thể chỉ vương quốc hoặc quyền trị vì; “vương quốc” giữ được hình ảnh vương quyền và văn phong khải huyền.
- source_word: ἡ ἐξουσία
  choice: thẩm quyền
  rationale: Diễn đạt quyền chính đáng để hành động và cai trị, tránh đồng nhất với δύναμις.
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: của Đấng Mê-si-a Ngài
  rationale: Χριστός ở đây là tước hiệu của Đấng được Đức Chúa Trời xức dầu; “Đấng Mê-si-a” giữ chức năng tước hiệu và sắc thái Do Thái của từ.
- source_word: κατήγωρ ... ὁ κατηγορῶν
  choice: kẻ tố cáo ... kẻ ... tố cáo
  rationale: Giữ phép lặp có chủ ý giữa danh từ và phân từ, đồng thời thể hiện bối cảnh buộc tội trước Đức Chúa Trời.
- source_word: ἐβλήθη
  choice: đã bị quăng xuống
  rationale: Thể bị động và động tác mạnh phù hợp với cảnh kẻ tố cáo bị đánh bại và loại khỏi trời.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: anh em chúng ta
  rationale: Giữ hình thức nam số nhiều của nguyên văn; trong ngữ cảnh cộng đồng đức tin, cụm này có thể bao gồm cả nam lẫn nữ, nên được giải thích ở chú thích.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Từ này hoạt động như một tước hiệu trong cụm “Đấng Mê-si-a Ngài”; lựa chọn này chuyển tải nghĩa “Đấng được xức dầu” mà không biến nó thành tên riêng.
- issue: Phạm vi giới tính của ἀδελφῶν
  choice: anh em
  alternative: anh chị em
  rationale: Bản chính giữ gần hình thức giống đực số nhiều của Hy Lạp, còn chú thích nêu rõ từ có thể chỉ toàn thể các tín hữu, gồm cả nữ giới.
- issue: Tác nhân hàm ẩn trong ἐβλήθη
  choice: giữ thể bị động “đã bị quăng xuống”
  alternative: Đức Chúa Trời đã quăng xuống
  rationale: Nguyên văn không nêu tác nhân trong câu này; giữ thể bị động tránh bổ sung một cách giải nghĩa thần học không được phát biểu trực tiếp.
- issue: βασιλεία là vương quốc hay sự trị vì
  choice: vương quốc
  alternative: quyền trị vì
  rationale: Cả hai nghĩa đều khả hữu; “vương quốc” giữ cách nói cụ thể và truyền thống của văn chương khải huyền mà không phủ nhận ý niệm quyền cai trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ nhịp tuyên cáo long trọng của nguyên văn. Dấu gạch ngang làm rõ cụm đồng vị “kẻ ngày đêm tố cáo họ” mà vẫn bảo toàn phép lặp. Chỉ dùng một chú thích vì biến thể “Đấng Christ” không cần thiết để hiểu câu và lựa chọn “Đấng Mê-si-a” đã trực tiếp chuyển tải chức năng tước hiệu.
