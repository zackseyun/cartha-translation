revisions:
- from: 'Rồi tôi nghe một tiếng lớn trên trời nói rằng: “Giờ đây, sự cứu rỗi, quyền năng, vương quốc của Đức Chúa Trời chúng ta và thẩm quyền của Đấng Mê-si-a Ngài đã đến, vì kẻ tố cáo anh em chúng ta—kẻ ngày đêm tố cáo họ trước mặt Đức Chúa Trời chúng ta—đã bị quăng xuống.[a]”'
  to: 'Rồi tôi nghe một tiếng nói lớn trên trời nói rằng: “Giờ đây, sự cứu rỗi, quyền năng, vương quốc của Đức Chúa Trời chúng ta và thẩm quyền của Đấng Mê-si-a của Ngài đã đến, vì kẻ tố cáo anh em chúng ta[a] đã bị quăng xuống, kẻ ngày đêm tố cáo họ trước mặt Đức Chúa Trời chúng ta.”'
  rationale: 'Sửa ba điểm hình thức và ngữ dụng an toàn: dùng “tiếng nói lớn”; biểu thị rõ sở hữu trong “Đấng Mê-si-a của Ngài”; và chuyển neo chú thích đến ngay sau “anh em chúng ta”. Mệnh đề đồng vị về hành vi tố cáo được đặt sau “đã bị quăng xuống” để phản ánh sát hơn trật tự của nguyên văn Hy Lạp, không thay đổi ý nghĩa.'
  reviewer_model: gpt-5.6-terra
