id: REV.12.12
reference: Revelation 12:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: vi
  text: Vì thế, hỡi các tầng trời và những ai cư ngụ trong đó, hãy vui mừng! Khốn cho đất và biển[a], vì Ma Quỷ đã xuống với các ngươi, mang cơn thịnh nộ lớn[b], vì biết rằng mình chỉ còn ít thời gian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đất liền và biển”. Từ Hy Lạp γῆ có thể có nghĩa là “đất” theo nghĩa toàn cõi đất hoặc “đất liền”; trong ngữ cảnh này, “đất” được chọn vì phạm vi mang tính vũ trụ.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “với cơn thịnh nộ lớn”.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “mình có ít thời gian”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn tả tự nhiên quan hệ suy luận từ chiến thắng trên trời vừa được thuật lại.
- source_word: εὐφραίνεσθε
  choice: hãy vui mừng
  rationale: Giữ nguyên lực mệnh lệnh và sắc thái vui mừng, hân hoan.
- source_word: οἱ οὐρανοὶ
  choice: hỡi các tầng trời
  rationale: Danh cách được dùng như hô cách; “hỡi” thể hiện lời gọi trực tiếp, còn số nhiều của οὐρανοί được giữ bằng “các tầng trời”.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: những ai cư ngụ trong đó
  rationale: σκηνόω có hình ảnh gốc là ở trong lều, nhưng tại đây chỉ việc cư ngụ; cách dịch này rõ ràng và vẫn giữ quan hệ với “các tầng trời” số nhiều.
- source_word: οὐαὶ
  choice: khốn cho
  rationale: Tương đương tự nhiên với công thức than báo tai họa hoặc phán xét trong văn phong tiên tri.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: đất và biển
  rationale: Giữ cặp phạm vi mang tầm vóc vũ trụ; γῆ vẫn có thể được hiểu là đất liền, nên ghi nhận khả năng ấy trong chú thích.
- source_word: κατέβη
  choice: đã xuống
  rationale: Thể hiện hành động đã hoàn tất và có hậu quả hiện tại mà không áp đặt sắc thái thời quá chi tiết.
- source_word: ὁ διάβολος
  choice: Ma Quỷ
  rationale: Đây là danh xưng đã xác lập cho nhân vật trong ngữ cảnh; viết hoa để thể hiện cách dùng như một danh hiệu riêng.
- source_word: πρὸς ὑμᾶς
  choice: xuống chỗ các ngươi
  rationale: πρός với đối cách chỉ hướng đến hoặc nơi đến. “Chỗ các ngươi” truyền đạt đích đến mà không tự thêm nghĩa “chống lại”.
- source_word: ἔχων θυμὸν μέγαν
  choice: trong cơn cuồng nộ dữ dội
  rationale: Diễn đạt tự nhiên cường độ rất mạnh của θυμός và μέγαν; chú thích bảo lưu cấu trúc sát chữ hơn.
- source_word: εἰδὼς
  choice: bởi biết rằng
  rationale: Thể hiện sắc thái giải thích/nguyên nhân của phân từ trong mạch câu.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: mình chỉ còn ít thời gian
  rationale: Diễn đạt tự nhiên ý khoảng thời gian bị giới hạn; “chỉ còn” làm rõ hàm ý thời gian còn lại, còn cách nói sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Đối tượng của “các ngươi” trong câu Ma Quỷ đã xuống
  choice: Giữ lời xưng hô trực tiếp với “đất và biển” như những phạm vi vừa bị tuyên bố tai họa, không chèn thêm “cư dân”.
  alternative: Diễn giải “các ngươi” là những người sống trên đất và biển.
  rationale: Mạch văn chuyển từ các tầng trời sang đất và biển, nhưng nguyên văn nhân cách hóa chính “đất và biển”. Giữ cách xưng hô ấy bảo tồn hình ảnh và không giải quyết quá mức đối tượng cụ thể.
- issue: Quan hệ của εἰδὼς với cơn cuồng nộ của Ma Quỷ
  choice: Dịch “bởi biết rằng” để cho thấy sự biết mình có ít thời gian giải thích cho cơn cuồng nộ.
  alternative: Dịch đơn thuần “biết rằng”, chỉ biểu thị hành động đồng thời.
  rationale: Phân từ có thể mang sắc thái giải thích hoặc nguyên nhân trong ngữ cảnh; “bởi” thể hiện mạch ý rõ ràng nhưng không khẳng định một quan hệ thần học vượt quá cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tính khải huyền. “Hỡi” và “khốn cho” duy trì sắc thái tuyên cáo; “các ngươi” được dùng vì lời nói hướng đến “đất và biển” đã được nhân cách hóa. Từ “Nhưng” làm rõ thế tương phản giữa niềm vui trên trời và tai họa dưới đất, tương ứng chức năng diễn ngôn của câu dù không có liên từ đối lập riêng trong nguyên văn.
