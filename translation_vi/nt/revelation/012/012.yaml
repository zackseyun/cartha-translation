revisions:
- from: Vì thế, hỡi các tầng trời và những ai cư ngụ trong đó, hãy vui mừng! Nhưng khốn cho đất và biển[a], vì Ma Quỷ đã xuống chỗ các ngươi trong cơn cuồng nộ dữ dội[b], bởi biết rằng mình chỉ còn ít thời gian[c].
  to: Vì thế, hỡi các tầng trời và những ai cư ngụ trong đó, hãy vui mừng! Khốn cho đất và biển[a], vì Ma Quỷ đã xuống với các ngươi, mang cơn thịnh nộ lớn[b], vì biết rằng mình chỉ còn ít thời gian[c].
  rationale: Bản sửa thay cách diễn đạt không tự nhiên “xuống chỗ các ngươi” bằng “xuống với các ngươi”, giữ trực tiếp lời gọi đến đất và biển mà không thêm “cư dân”. “Mang cơn thịnh nộ lớn” phản ánh rõ ἔχων θυμὸν μέγαν. Việc bỏ “Nhưng” tránh thêm một liên từ không được nêu trong nguyên văn, đồng thời vẫn bảo toàn tương phản tu từ. Các chú thích được giữ đủ ba điểm từ vựng và đặt đúng neo.
