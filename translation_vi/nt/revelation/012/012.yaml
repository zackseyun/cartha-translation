  - severity: low
    issue: “trong cơn cuồng nộ dữ dội”
    rationale: ἔχων θυμὸν μέγαν nghĩa là “mang/có cơn thịnh nộ lớn”. Bản hiện tại không sai ý, nhưng bản sửa giữ rõ phân từ và tránh sắc thái diễn giải của “cuồng nộ dữ dội”.
