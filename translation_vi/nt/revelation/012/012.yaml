  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: lời kêu gọi trời vui mừng, lời khốn cho đất và biển, Ma Quỷ xuống với cơn thịnh nộ lớn vì biết thời gian mình còn lại ít. Tuy nhiên, “xuống chỗ các ngươi” không tự nhiên trong tiếng Việt và làm yếu quan hệ hướng đến trong πρὸς ὑμᾶς. Cụm “trong cơn cuồng nộ dữ dội” cũng chuyển phân từ ἔχων (“mang/có”) thành một trạng ngữ cách thức khá tự do.'
  naturalness: “Hỡi”, “hãy vui mừng” và “khốn cho” hợp văn phong khải huyền hiện đại. Nên bỏ “Nhưng”, vì nguyên văn chuyển cảnh bằng lời khốn mà không có liên từ đối lập; thế tương phản đã rõ trong chính cấu trúc câu. “Đã xuống với các ngươi, mang cơn thịnh nộ lớn” vừa tự nhiên vừa theo sát cú pháp hơn.
  terminology: “Ma Quỷ” là danh xưng có thể chấp nhận cho ὁ διάβολος trong ngữ cảnh này. “Đất và biển” giữ được tầm vóc vũ trụ của γῆ và θάλασσα. Chú thích về khả năng “đất liền” là phù hợp; nên diễn đạt rõ rằng đây là lựa chọn từ vựng, không thay đổi cách hiểu chính.
