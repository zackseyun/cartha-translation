revisions:
- from: 'Rồi một dấu hiệu lớn xuất hiện trên trời: một người phụ nữ khoác lấy mặt trời, mặt trăng ở dưới chân bà, và trên đầu bà là một vương miện[a] gồm mười hai ngôi sao.'
  to: 'Rồi một dấu hiệu lớn xuất hiện trên trời: một người phụ nữ mình khoác mặt trời, mặt trăng ở dưới chân bà, và trên đầu bà là một triều thiên[a] gồm mười hai ngôi sao.'
  rationale: Sửa “khoác lấy” thành “mình khoác” để biểu đạt tình trạng hình tượng của người phụ nữ được mặc mặt trời. Đổi “vương miện” thành “triều thiên” để tránh gán sắc thái hoàng gia riêng của διάδημα cho στέφανος; chú thích tiếp tục bảo lưu các khả năng dịch và sự phân biệt từ vựng. Không thêm nhận diện biểu tượng nào cho người phụ nữ hay mười hai ngôi sao.
