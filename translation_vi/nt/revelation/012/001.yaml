id: REV.12.1
reference: Revelation 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: vi
  text: 'Rồi một dấu hiệu lớn xuất hiện trên trời: một người phụ nữ mình khoác mặt trời, mặt trăng ở dưới chân bà, và trên đầu bà là một triều thiên[a] gồm mười hai ngôi sao.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vòng miện” hoặc “vòng miện của người chiến thắng”; từ Hy Lạp là στέφανος, khác với vương miện hoàng gia (διάδημα).
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον μέγα
  choice: một dấu hiệu lớn
  rationale: “Dấu hiệu” giữ được ý nghĩa biểu tượng của thị kiến khải huyền; “lớn” diễn đạt cả tầm vóc lẫn ý nghĩa nổi bật.
- source_word: ὤφθη ἐν τῷ οὐρανῷ
  choice: xuất hiện trên trời
  rationale: Dạng bị động theo nghĩa đen là “được nhìn thấy”, nhưng “xuất hiện” tự nhiên hơn trong lời thuật thị kiến. “Trên trời” phù hợp với bối cảnh Khải Huyền hơn “trên bầu trời”.
- source_word: γυνὴ
  choice: một người phụ nữ
  rationale: Câu này giới thiệu một nhân vật nữ mang tính biểu tượng nhưng không nói rõ bà là vợ của ai; vì thế không dịch là “người vợ”.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: khoác lấy mặt trời
  rationale: Diễn đạt hình ảnh người phụ nữ được mặt trời bao phủ như y phục, đồng thời giữ sắc thái thị kiến mà không giải thích thêm biểu tượng.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: mặt trăng ở dưới chân bà
  rationale: Giữ nguyên quan hệ không gian và hình ảnh của nguyên văn bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: στέφανος
  choice: vương miện
  rationale: “Vương miện” là cách gọi dễ hiểu về vật đội đầu mang ý nghĩa vinh dự và quyền thế; chú thích bảo lưu sự phân biệt rằng στέφανος vốn là vòng miện, khác với loại vương miện hoàng gia được gọi là διάδημα.
- source_word: ἀστέρων δώδεκα
  choice: gồm mười hai ngôi sao
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu của tiếng Hy Lạp mà không thêm cách giải thích về ý nghĩa của mười hai ngôi sao.
theological_decisions:
- issue: Danh tính biểu tượng của người phụ nữ
  choice: Không xác định danh tính trong bản dịch; chỉ mô tả nhân vật đúng như thị kiến.
  alternative: Y-sơ-ra-ên; Ma-ri; dân của Đức Chúa Trời; Hội Thánh.
  rationale: Câu này không trực tiếp cho biết người phụ nữ là ai. Không đưa một cách giải thích thần học cụ thể vào chính bản dịch giúp bảo toàn tính đa nghĩa và sự căng thẳng thần học của biểu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” để chỉ lại “người phụ nữ” một cách tự nhiên và tôn trọng. Dấu hai chấm giữ cấu trúc giới thiệu rồi mô tả dấu hiệu. Đặt ký hiệu chú thích ngay sau “vương miện”, là từ mà chú thích giải nghĩa.
