id: REV.12.5
reference: Revelation 12:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: vi
  text: Người nữ sinh một con trai, một bé trai, là người sắp chăn dắt[a] mọi dân tộc bằng cây gậy sắt; và con của bà được cất vụt lên, đến với Đức Chúa Trời và đến với ngai của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là người sẽ cai trị mọi dân tộc bằng cây gậy sắt.” Động từ Hy Lạp có nghĩa đen là “chăn dắt”, nhưng ở đây lời văn vọng lại Thi Thiên 2 và hàm ý quyền cai trị của vua.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: sinh
  rationale: Cách nói tự nhiên, trực tiếp trong tiếng Việt hiện đại, giữ nguyên hình ảnh sinh nở cụ thể.
- source_word: υἱόν, ἄρσεν
  choice: một con trai, một con trẻ thuộc nam giới
  rationale: Giữ cả hai yếu tố của nguyên văn và sắc thái nhấn mạnh đồng vị, dù sự lặp lại có chủ ý nghe khác thường trong tiếng Việt.
- source_word: μέλλει ποιμαίνειν
  choice: sắp chăn dắt
  rationale: Diễn đạt sắc thái tương lai gần hoặc hành động đã được định sẽ xảy ra của μέλλει kết hợp với động từ nguyên mẫu, mà không giản lược thành tương lai thuần túy.
- source_word: ποιμαίνειν
  choice: chăn dắt
  rationale: Giữ ẩn dụ mục tử của ποιμαίνω; trong liên hệ với Thi Thiên 2, từ này đồng thời hàm ý quyền cai trị của vua.
- source_word: πάντα τὰ ἔθνη
  choice: mọi dân tộc
  rationale: Chỉ toàn thể các dân trên thế giới trong bối cảnh vương quyền và khải huyền; không thu hẹp thành người ngoại.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: bằng cây gậy sắt
  rationale: Giữ nghĩa phương tiện của ἐν và hình ảnh cây gậy bằng sắt trong lời vọng lại Thi Thiên 2.
- source_word: ἡρπάσθη
  choice: được cất vụt lên
  rationale: Thể hiện thể bị động, chuyển động hướng lên và tính đột ngột, mạnh mẽ của ἁρπάζω.
- source_word: τὸ τέκνον αὐτῆς
  choice: con của bà
  rationale: Phản ánh sự chuyển từ υἱός sang từ rộng hơn là τέκνον, đồng thời tự nhiên trong tiếng Việt.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: đến với Đức Chúa Trời và đến với ngai Ngài
  rationale: Lặp lại 'đến với' để phản ánh hai lần πρὸς và giữ chuyển động hướng đến cả Đức Chúa Trời lẫn ngai Ngài.
theological_decisions:
- issue: Lời ám chỉ Đấng Mê-si trong ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ, vọng lại Thi Thiên 2
  choice: Giữ ẩn dụ “chăn dắt” trong chính văn và giải thích sắc thái vương quyền trong chú thích.
  alternative: cai trị mọi dân tộc bằng cây gậy sắt
  rationale: Ngữ cảnh nói đến vương quyền của Đấng Mê-si, nhưng động từ Hy Lạp là ποιμαίνω, nghĩa đen là chăn dắt. Cách dịch này bảo toàn cả hình ảnh mục tử lẫn sự căng thẳng thần học của lời ám chỉ.
- issue: Sắc thái của μέλλει
  choice: sắp
  alternative: sẽ; được định sẽ
  rationale: “Sắp” giữ rõ sắc thái hướng đến hành động sắp xảy ra của dạng hiện tại μέλλει, trong khi vẫn để ngỏ nét nghĩa hành động đã được định trong văn chương khải huyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “một con trai, một con trẻ thuộc nam giới” cố ý giữ sự nhấn mạnh khác thường của υἱόν, ἄρσεν. Đại từ “Ngài” dùng để quy chiếu trang trọng về Đức Chúa Trời.
