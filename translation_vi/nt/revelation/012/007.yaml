language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: vi
  text: 'Rồi chiến tranh bùng nổ trên trời[a]: Mi-ca-ên cùng các thiên sứ của mình giao chiến với con rồng[b]. Con rồng và các thiên sứ của nó giao chiến[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có chiến tranh trên trời” hoặc “một cuộc chiến nổi lên trên trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát cấu trúc Hy Lạp hơn: “Mi-ca-ên và các thiên sứ của mình để giao chiến với con rồng”; nguyên văn dùng động từ nguyên mẫu có mạo từ để diễn tả hành động hoặc mục đích trong một cấu trúc cô đọng.'
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát hơn: “Con rồng giao chiến, và các thiên sứ của nó.” Động từ được nêu với “con rồng”; phần sau tiếp nối bằng phép tỉnh lược động từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: chiến tranh bùng nổ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, thể hiện một biến cố phát sinh như cấu trúc γίνομαι + danh từ, thay vì chỉ nói tĩnh là “có chiến tranh”.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Trong ngữ cảnh Khải Huyền 12, οὐρανός chỉ cõi trời; “trên trời” là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: Μιχαὴλ
  choice: Mi-ca-ên
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt, không thêm danh hiệu hay lời giải thích về nhân vật.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: các thiên sứ của mình
  rationale: “Của mình” quy chiếu tự nhiên về Mi-ca-ên và giữ rõ mối liên hệ giữa ông với các thiên sứ đi cùng.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: giao chiến với con rồng
  rationale: Diễn đạt thành động từ hữu hạn để câu tiếng Việt tự nhiên, đồng thời giữ nghĩa đối đầu của πολεμέω và nét nghĩa “với” trong μετά theo ngữ cảnh thù địch.
- source_word: δράκοντος / δράκων
  choice: con rồng
  rationale: Giữ nguyên hình tượng khải huyền trực tiếp của δράκων.
- source_word: ἐπολέμησεν
  choice: giao chiến
  rationale: Không thêm sắc thái đáp trả vốn chỉ được suy ra từ mạch văn; lựa chọn này bám sát động từ Hy Lạp hơn “đánh trả”.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: và các thiên sứ của nó cũng vậy
  rationale: Giữ cấu trúc hậu置 và sự tỉnh lược khác thường của tiếng Hy Lạp theo cách vẫn hiểu được trong tiếng Việt; “nó” chỉ con rồng và tránh nhân hóa quá mức.
theological_decisions:
- issue: Thân phận và địa vị của Mi-ca-ên
  choice: Chỉ nêu tên “Mi-ca-ên”, không thêm danh hiệu hay cách đồng nhất thần học.
  alternative: Gọi Mi-ca-ên là tổng lãnh thiên sứ hoặc đồng nhất ông với một nhân vật Kitô học.
  rationale: Câu này chỉ nêu tên Mi-ca-ên, không xác định cấp bậc và cũng không đồng nhất ông với Đấng Christ; bản dịch giữ nguyên khoảng mở thần học ấy.
- issue: Sắc thái hành động của con rồng
  choice: Dịch ἐπολέμησεν là “giao chiến”.
  alternative: Dịch là “đánh trả”, nhấn mạnh hành động đáp lại.
  rationale: Mạch văn có thể gợi ý sự đáp trả, nhưng chính động từ không mã hóa rõ sắc thái đó; cách dịch trung tính bảo toàn sự mơ hồ của nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Giao chiến” phù hợp ngữ cảnh khải huyền hơn lối nói khẩu ngữ “đánh nhau”. Câu cuối chủ ý giữ phần nào cấu trúc cô đọng của nguyên văn; dấu phẩy cuối phản ánh việc câu tiếp tục sang câu kế tiếp trong đơn vị văn bản được cung cấp.
