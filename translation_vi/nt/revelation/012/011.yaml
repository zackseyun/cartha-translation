  rationale: Thay phần diễn giải “đến nỗi tránh né cái chết” bằng “cho đến chết” để phản ánh trực tiếp ἄχρι θανάτου và không thêm hành động không có trong nguồn. Đổi “nó” thành “hắn” cho tự nhiên và rõ quy chiếu hơn. Giữ nguyên các lựa chọn then chốt “nhờ huyết,” “Chiên Con,” “lời làm chứng,” và “mạng sống.”
