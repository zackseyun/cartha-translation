id: REV.12.11
reference: Revelation 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: vi
  text: Họ đã chiến thắng hắn nhờ huyết của Chiên Con và nhờ lời làm chứng của họ; họ không yêu quý mạng sống mình cho đến chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ không yêu mạng sống mình cho đến chết.” “Mạng sống” dịch từ từ Hy Lạp psychē, có thể chỉ mạng sống, bản thân, hoặc linh hồn; trong ngữ cảnh này, nghĩa phù hợp là mạng sống họ sẵn lòng không giữ lấy ngay cả khi phải chết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: đã chiến thắng
  rationale: Giữ hình ảnh xung đột và chiến thắng nổi bật trong sách Khải Huyền; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: διὰ τὸ αἷμα
  choice: nhờ huyết
  rationale: διά với đối cách ở đây có thể chỉ phương tiện hoặc nguyên do; “nhờ” giữ được sắc thái phương tiện mà không loại trừ nền tảng nguyên nhân.
- source_word: τοῦ ἀρνίου
  choice: của Chiên Con
  rationale: “Chiên Con” là danh hiệu chỉ Đấng Christ trong Khải Huyền, đồng thời duy trì hình ảnh hiến tế.
- source_word: διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: nhờ lời làm chứng của mình
  rationale: Phản ánh cả λόγος và μαρτυρία, đồng thời dùng “mình” để quy chiếu tự nhiên về chủ ngữ số nhiều “họ”.
- source_word: οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν
  choice: họ không yêu quý mạng sống mình
  rationale: “Mạng sống” diễn đạt ψυχή theo ngữ cảnh tử đạo, không áp đặt sự đối lập giữa thân thể và linh hồn; “yêu quý” truyền đạt việc coi mạng sống là quý báu.
- source_word: ἄχρι θανάτου
  choice: đến nỗi tránh né cái chết
  rationale: Diễn đạt tự nhiên ý họ không quý mạng sống đến mức rút lui trước cái chết, tuy có phần giải nghĩa quan hệ của cụm từ.
theological_decisions:
- issue: Chiến thắng nhờ huyết Chiên Con
  choice: Dịch “nhờ huyết của Chiên Con” để trình bày huyết như nền tảng/phương tiện của chiến thắng mà không khai triển thêm một công thức chuộc tội.
  alternative: “vì huyết của Chiên Con”
  rationale: Cấu trúc διά với đối cách có thể mang sắc thái nguyên nhân hoặc phương tiện; “nhờ” phù hợp ngữ cảnh và vẫn giữ độ mở vừa phải.
- issue: Nghĩa của ψυχή trong bối cảnh tử đạo
  choice: Dịch là “mạng sống”.
  alternative: “linh hồn” hoặc “bản thân”
  rationale: Ngữ cảnh nói đến việc chấp nhận cái chết; “mạng sống” chính xác hơn và không đưa vào một quan niệm nhân học mà câu này không xác định.
- issue: Mức độ tự nguyện đối diện cái chết
  choice: Diễn đạt rằng họ không quý mạng sống đến mức tránh né cái chết.
  alternative: “họ không yêu mạng sống mình cho đến chết”
  rationale: Cách chọn làm rõ thành ngữ Hy Lạp trong tiếng Việt nhưng không nói rằng họ tìm kiếm cái chết; trọng tâm là lòng trung thành bất chấp cái chết.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “huyết” thay vì “máu” vì đây là ngôn ngữ biểu tượng hiến tế và là cách gọi quen thuộc trong văn cảnh Kinh Thánh; câu vẫn tránh sắc thái cổ quá mức.
