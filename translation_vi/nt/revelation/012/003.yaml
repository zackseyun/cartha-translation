id: REV.12.3
reference: Revelation 12:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: vi
  text: 'Lại có một dấu lạ khác xuất hiện trên trời: Kìa, một con rồng lớn màu đỏ như lửa[a], có bảy đầu và mười sừng; trên các đầu nó có bảy vương miện[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một con rồng lớn màu đỏ” hoặc “đỏ rực.” Từ Hy Lạp πυρρός chỉ sắc đỏ giống màu lửa.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp διάδημα chỉ vương miện hoặc dải miện biểu thị vương quyền, khác với vòng hoa dành cho người chiến thắng.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὤφθη
  choice: xuất hiện
  rationale: Thể bị động aorist của ὁράω trong văn thuật khải tượng mang nghĩa thành ngữ là “xuất hiện”; cách dịch này tự nhiên hơn “được nhìn thấy”.
- source_word: ἄλλο σημεῖον
  choice: một dấu lạ khác
  rationale: Trong Khải Huyền, σημεῖον chỉ một dấu hiệu mang tính biểu tượng trong khải tượng; “dấu lạ” vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: οὐρανός có thể là bầu trời hoặc cõi trời; trong bối cảnh khải tượng mang tầm vũ trụ, “trên trời” giữ được ý nghĩa rộng mà vẫn tự nhiên.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Từ này thu hút sự chú ý đột ngột đến cảnh tượng; “Kìa” trang trọng, tự nhiên và giữ được sức nhấn của lời thuật.
- source_word: δράκων μέγας πυρρός
  choice: một con rồng lớn màu đỏ như lửa
  rationale: “Rồng” dịch trực tiếp δράκων; “lớn” giữ μέγας; “đỏ như lửa” diễn đạt sắc đỏ rực, giống màu lửa của πυρρός mà không biến nó thành mô tả bản chất đang cháy.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: có bảy đầu và mười sừng
  rationale: Dịch trực tiếp các chi tiết của hình tượng, không giải thích biểu tượng ngay trong bản văn.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: trên các đầu nó có bảy vương miện
  rationale: Giữ vị trí của các διάδημα trên những cái đầu. Đại từ “nó” tự nhiên trong tiếng Việt khi nói về con rồng và không làm mất tính nhân cách hóa có thể có của hình tượng.
- source_word: διαδήματα
  choice: vương miện
  rationale: διάδημα là dấu hiệu vương quyền, phân biệt với vòng hoa chiến thắng στέφανος; “vương miện” truyền đạt rõ ý nghĩa này cho độc giả hiện đại.
theological_decisions:
- issue: Sắc màu của con rồng trong πυρρός
  choice: màu đỏ như lửa
  alternative: màu đỏ; đỏ rực
  rationale: Cách dịch giữ liên hệ từ vựng với lửa và hình ảnh sống động của nguyên văn, nhưng không thêm ý rằng con rồng thực sự bốc cháy.
- issue: Cách diễn đạt αὐτοῦ khi chỉ con rồng
  choice: nó
  alternative: hắn
  rationale: Tiếng Hy Lạp dùng đại từ giống đực theo danh từ δράκων, nhưng tiếng Việt không có yêu cầu tương ứng. “Nó” tự nhiên, không vô cớ xác định mức độ nhân cách hóa; việc đồng nhất nhân vật được để cho phần văn mạch sau.
- issue: Phân biệt διάδημα với στέφανος
  choice: vương miện
  alternative: miện; mão triều thiên
  rationale: “Vương miện” biểu thị quyền vua và giữ được khác biệt ý niệm với vòng hoa chiến thắng, đồng thời dễ hiểu hơn các từ cổ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tính thị kiến. Dùng “Kìa” để giữ lực nhấn của ἰδού; dùng dấu hai chấm và dấu chấm phẩy để câu tiếng Việt rõ nhịp mà vẫn bảo toàn chuỗi mô tả của nguyên văn. Mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
