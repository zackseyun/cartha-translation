revisions:
- from: Con rồng nổi giận với người phụ nữ và đi giao chiến với những người còn lại thuộc dòng dõi bà, là những người vâng giữ các điều răn của Đức Chúa Trời và nắm giữ lời chứng của Đức Giê-su.[a]
  to: Con rồng nổi giận với người phụ nữ, rồi bỏ đi để giao chiến với những người còn lại thuộc dòng dõi bà, là những người vâng giữ các điều răn của Đức Chúa Trời và nắm giữ lời chứng của Đức Giê-su.[a]
  rationale: Bản sửa bổ sung “bỏ đi để” để phản ánh ἀπῆλθεν mà vẫn giữ câu tiếng Việt tự nhiên. Cụm “lời chứng của Đức Giê-su” được giữ nguyên để bảo tồn sự mơ hồ của sở hữu cách Ἰησοῦ; chú thích được điều chỉnh để nêu khả năng chủ thể mà không diễn giải thêm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: con rồng, người phụ nữ, phần còn lại của dòng dõi bà, việc vâng giữ điều răn của Đức Chúa Trời, và cụm sở hữu cách mơ hồ “lời chứng của Đức Giê-su”. Tuy nhiên, “đi giao chiến” chưa thể hiện rõ động từ ἀπῆλθεν (“bỏ đi/đi khỏi”), vốn nêu một chuyển động tiếp sau cơn giận.'
  naturalness: Văn phong trang trọng, hiện đại và dễ đọc. “Bỏ đi để giao chiến với” vừa tự nhiên vừa phản ánh đầy đủ hơn chuỗi hành động trong nguyên văn.
  terminology: “Con rồng”, “người phụ nữ”, “dòng dõi”, “điều răn của Đức Chúa Trời”, và “lời chứng của Đức Giê-su” đều phù hợp. Chú thích cần tránh “do Đức Giê-su ban”, vì “ban” thêm một sắc thái không có trong μαρτυρία; “do Đức Giê-su làm chứng” phản ánh trực tiếp hơn khả năng sở hữu cách chủ thể.
  issues:
  - severity: medium
    issue: Chưa diễn đạt minh thị ἀπῆλθεν.
    rationale: Cụm “đi giao chiến” có thể chỉ mục đích đi đến giao chiến, nhưng không cho thấy rõ con rồng đã “bỏ đi/đi khỏi” sau khi nổi giận. Thêm “bỏ đi để” bảo toàn trình tự và chuyển động của bản Hy Lạp.
  - severity: low
    issue: Cách nêu khả năng chủ thể trong chú thích dùng từ “ban” quá diễn giải.
    rationale: “Lời chứng do Đức Giê-su ban” có thể gợi ý một lời chứng được trao ban; sở hữu cách chủ thể đơn giản hơn là lời chứng do Đức Giê-su làm chứng. Cách này giữ đúng tính mơ hồ đang được chú thích mà không thêm ý.
  revised_text: Con rồng nổi giận với người phụ nữ, rồi bỏ đi để giao chiến với những người còn lại thuộc dòng dõi bà, là những người vâng giữ các điều răn của Đức Chúa Trời và nắm giữ lời chứng của Đức Giê-su.[a]
