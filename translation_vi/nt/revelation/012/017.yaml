id: REV.12.17
reference: Revelation 12:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: vi
  text: Con rồng nổi giận với người phụ nữ, rồi bỏ đi để giao chiến với những người còn lại thuộc dòng dõi bà, là những người vâng giữ các điều răn của Đức Chúa Trời và nắm giữ lời chứng của Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời chứng về Đức Giê-su”; hoặc: “lời chứng do Đức Giê-su làm chứng.” Sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo nhiều cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: nổi giận
  rationale: Diễn đạt tự nhiên ý nghĩa bắt đầu hoặc trở nên giận dữ của động từ, đồng thời phù hợp với phản ứng thù nghịch trong văn cảnh.
- source_word: δράκων
  choice: con rồng
  rationale: Cách dịch thông dụng, rõ ràng, bảo toàn hình tượng khải huyền và đối tượng đã được xác định trong chương.
- source_word: γυναικί
  choice: người phụ nữ
  rationale: Dịch trực tiếp danh từ γυνή; ngữ cảnh và mạo từ chỉ người phụ nữ đã được giới thiệu.
- source_word: ἀπῆλθεν
  choice: đi
  rationale: Tiếng Việt tự nhiên trong chuỗi hành động; diễn tả sự chuyển hướng để tiến hành cuộc chiến mà không thêm suy diễn về địa điểm.
- source_word: ποιῆσαι πόλεμον μετὰ
  choice: giao chiến với
  rationale: Thành ngữ Việt hiện đại diễn đạt chính xác hành động tiến hành chiến tranh và làm rõ quan hệ đối địch vốn hàm chứa trong cụm từ Hy Lạp.
- source_word: τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: những người còn lại thuộc dòng dõi bà
  rationale: Bảo toàn ý niệm phần còn lại và quan hệ hậu duệ của σπέρμα, đồng thời tránh cách nói 'hạt giống' thiếu tự nhiên khi chỉ người.
- source_word: τηρούντων
  choice: vâng giữ
  rationale: Diễn đạt việc trung thành tuân theo các điều răn, vừa tự nhiên vừa giữ sắc thái tôn giáo của τηρέω.
- source_word: τὰς ἐντολὰς τοῦ θεοῦ
  choice: các điều răn của Đức Chúa Trời
  rationale: Giữ trọng lượng Kinh Thánh của ἐντολαί và dùng danh xưng trang trọng, quen thuộc trong tiếng Việt.
- source_word: ἐχόντων
  choice: nắm giữ
  rationale: Giữ gần nghĩa cơ bản 'có/giữ' của ἔχω, đồng thời truyền đạt sự gắn bó bền vững trong văn cảnh.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: lời chứng của Đức Giê-su
  rationale: 'Cấu trúc ''của Đức Giê-su'' bảo toàn sự mơ hồ của sở hữu cách Hy Lạp: có thể là lời chứng về Đức Giê-su hoặc lời chứng do chính Ngài ban.'
theological_decisions:
- issue: Ý nghĩa sở hữu cách trong τὴν μαρτυρίαν Ἰησοῦ
  choice: lời chứng của Đức Giê-su
  alternative: lời chứng về Đức Giê-su; hoặc lời chứng do Đức Giê-su ban
  rationale: Sở hữu cách Ἰησοῦ có thể được hiểu theo nghĩa khách thể hoặc chủ thể. Bản văn chính giữ cách diễn đạt có chủ ý không phân giải, còn chú thích nêu hai cách hiểu chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể mạnh của văn chương khải huyền; dùng “giao chiến với” thay cho lối dịch sát chữ nhưng kém tự nhiên “làm chiến tranh với.” Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
