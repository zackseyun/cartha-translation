  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: vi
  text: Nhưng con rồng ấy không đủ sức[a], và trên trời cũng không còn tìm thấy chỗ nào cho chúng nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nó không thắng thế.” Động từ Hy Lạp này có thể chỉ sự mạnh sức, có khả năng, hoặc thắng thế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: Trong mạch kể về cuộc giao chiến ở câu trước, καί mang sắc thái tương phản; “Nhưng” diễn đạt tự nhiên hơn “Và” trong tiếng Việt.
- source_word: οὐκ ἴσχυσεν
  choice: nó không đủ mạnh
  rationale: ἰσχύω có thể chỉ sức mạnh, khả năng hoặc sự thắng thế. Cách dịch này giữ hình ảnh sức mạnh trong bối cảnh giao chiến và giữ chủ ngữ số ít, chỉ con rồng ở câu trước.
- source_word: οὐδὲ
  choice: và ... không
  rationale: Kết cấu này nối tự nhiên với mệnh đề phủ định trước trong tiếng Việt, đồng thời bảo toàn lực phủ định của οὐδέ.
- source_word: τόπος
  choice: chỗ nào
  rationale: τόπος chỉ một nơi hay vị trí; trong cấu trúc phủ định, “chỗ nào” là cách nói tự nhiên và rõ nghĩa.
- source_word: εὑρέθη
  choice: tìm thấy
  rationale: Giữ ý bị động của động từ εὑρίσκω qua cấu trúc tiếng Việt “không còn tìm thấy”, thay vì chỉ diễn đạt rằng không còn chỗ.
- source_word: αὐτῶν
  choice: cho chúng
  rationale: Đại từ số nhiều chỉ con rồng cùng các thiên sứ của nó; “cho chúng” diễn đạt tự nhiên quan hệ trong cụm “chỗ ... cho chúng”.
- source_word: ἔτι
  choice: không còn ... nữa
  rationale: Trong ngữ cảnh phủ định, ἔτι cho biết tình trạng trước đó đã chấm dứt; cấu trúc “không còn ... nữa” là tương đương tự nhiên.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Ở đây οὐρανός chỉ cõi trời, không phải bầu trời hữu hình; “trên trời” là cách diễn đạt thông dụng, trang trọng và phù hợp ngữ cảnh Khải Huyền.
theological_decisions:
- issue: Chủ thể số ít của ἴσχυσεν
  choice: “nó”, chỉ con rồng ở câu trước
  alternative: Dịch theo nghĩa tập thể là “chúng không đủ mạnh”
  rationale: Động từ Hy Lạp ở số ít tiếp nối chủ thể “con rồng” trong câu 7, còn αὐτῶν ở mệnh đề sau chỉ cả con rồng và các thiên sứ của nó. Giữ sự chuyển đổi số ít–số nhiều phản ánh sát ngữ pháp và mạch văn.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “nó/chúng” để phản ánh con rồng và phe của nó, đồng thời giữ sự phân biệt số ít–số nhiều của nguyên văn.
