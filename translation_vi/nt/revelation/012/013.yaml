  terminology: “Con rồng,” “người phụ nữ,” và “truy đuổi” đều thích hợp, không áp đặt cách giải thích biểu tượng. Chú thích a bảo lưu đúng khả năng nghĩa “bắt bớ.” Chú thích b cần nói chính xác hơn rằng nguyên văn là “người nam/giống đực” theo cách danh từ hóa, còn “đứa con trai” là cách diễn đạt theo ngữ cảnh sinh nở.
