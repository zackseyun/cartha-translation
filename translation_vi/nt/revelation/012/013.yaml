  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của câu Hy Lạp: δράκων là “con rồng,” thể bị động của ἐβλήθη được giữ trong “bị quăng xuống,” và ἐδίωξεν được dịch phù hợp là “truy đuổi.” Tuy nhiên, γῆ trong bối cảnh vũ trụ của Khải Huyền nên được nêu rõ là “trái đất,” thay vì “đất,” vì “đất” có thể bị hiểu là mặt đất/đất đai. “Đứa con trai” cũng diễn đạt tự nhiên hơn quan hệ sinh nở, đồng thời vẫn giữ được nét giới tính được đánh dấu của τὸν ἄρσενα.'
