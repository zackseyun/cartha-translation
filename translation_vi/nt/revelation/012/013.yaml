source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: vi
  text: Khi con rồng thấy mình đã bị quăng xuống trái đất, nó truy đuổi[a] người phụ nữ đã sinh đứa con trai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bắt bớ”. Động từ Hy Lạp có thể mang nghĩa “truy đuổi” hoặc “bắt bớ”; trong câu này có lẽ bao hàm cả sự săn đuổi thù nghịch lẫn sự bắt bớ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “người nam” hoặc “giống đực”; bản dịch dùng “đứa con trai” theo ngữ cảnh sinh nở và mạch văn xung quanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: con rồng
  rationale: Giữ nguyên hình tượng khải huyền của danh từ Hy Lạp, không đồng nhất hóa với “con rắn” từ các câu khác.
- source_word: ἐβλήθη
  choice: đã bị quăng xuống
  rationale: Thể bị động diễn tả việc bị cưỡng bức ném khỏi vị trí trước đó; “quăng xuống” tự nhiên và giữ được sắc thái mạnh.
- source_word: εἰς τὴν γῆν
  choice: xuống đất
  rationale: Trong bối cảnh tương phản với trời, γῆ chỉ trái đất; tiếng Việt tự nhiên dùng “xuống đất” sau động từ “quăng xuống”.
- source_word: ἐδίωξεν
  choice: truy đuổi
  rationale: διώκω có thể chỉ việc đuổi theo hoặc bắt bớ. “Truy đuổi” giữ hành động cụ thể trong mạch kể mà vẫn gợi tính thù nghịch; chú thích bảo lưu nghĩa “bắt bớ”.
- source_word: τὴν γυναῖκα
  choice: người phụ nữ
  rationale: Cách dịch trực tiếp, tự nhiên, không áp đặt danh tính biểu tượng của người phụ nữ.
- source_word: ἥτις ἔτεκεν
  choice: đã sinh
  rationale: Diễn đạt tự nhiên hành động sinh con xảy ra trước cuộc truy đuổi.
- source_word: τὸν ἄρσενα
  choice: con trai
  rationale: Nguyên văn dùng dạng danh từ hóa nghĩa đen là “người giống đực/người nam”; “con trai” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh sinh nở, còn chú thích ghi rõ hình thức nguyên văn.
theological_decisions:
- issue: Danh tính biểu tượng của người phụ nữ và con trai
  choice: Giữ các hình ảnh “người phụ nữ” và “con trai” mà không giải thích danh tính.
  alternative: Giải thích người phụ nữ là Ma-ri, Israel hoặc dân Đức Chúa Trời/Hội Thánh, và con trai theo một cách nhận diện thần học cụ thể.
  rationale: Câu Hy Lạp không trực tiếp xác định đầy đủ các đối tượng biểu tượng tại đây; bản dịch không nên giải quyết một vấn đề còn có nhiều cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con rồng” cho hình tượng khải huyền, đại từ “nó” để câu tự nhiên; không thêm cách giải nghĩa biểu tượng.
