source:
  edition: SBLGNT
  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: vi
  text: Nàng đang mang thai[a], và nàng kêu la trong cơn đau chuyển dạ[b], quằn quại[c] để sinh con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “có trong lòng/dạ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đau đớn vì chuyển dạ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bị giày vò” hoặc “vô cùng đau đớn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: đang mang thai
  rationale: Thành ngữ Hy Lạp có nghĩa đen là “có trong lòng/dạ” và là cách nói thông thường về việc mang thai; cách dịch này tự nhiên, hiện đại và chính xác.
- source_word: κράζει
  choice: nàng kêu la
  rationale: Động từ hiện tại tạo nét sống động cho khải tượng; “kêu la” diễn tả tiếng kêu lớn trong cơn đau mà không chuyển sang thì quá khứ.
- source_word: ὠδίνουσα
  choice: trong cơn đau chuyển dạ
  rationale: Phân từ chỉ việc chịu những cơn đau sinh nở; cách diễn đạt này rõ nghĩa và giữ được hình ảnh đau đớn của nguyên văn.
- source_word: βασανιζομένη
  choice: quằn quại
  rationale: Phân từ bị động diễn tả sự đau đớn dữ dội. Trong ngữ cảnh sinh nở, “quằn quại” tự nhiên hơn “bị hành hạ” nhưng vẫn giữ cường độ mạnh.
- source_word: τεκεῖν
  choice: vì sắp sinh con
  rationale: Động từ nguyên mẫu chỉ việc sinh nở gắn với sự đau đớn hiện tại. “Vì sắp sinh con” diễn đạt tự nhiên quan hệ hoàn cảnh/nguyên nhân mà không thêm cách giải thích biểu tượng.
- source_word: καὶ ... καὶ
  choice: và ...
  rationale: Giữ liên từ mở đầu và thể hiện chuỗi mô tả dồn dập bằng cú pháp tiếng Việt tự nhiên, tránh lặp “và” một cách gượng gạo.
theological_decisions:
- issue: Cường độ và bản chất nỗi đau của người phụ nữ trong khải tượng
  choice: Dịch βασανιζομένη bằng từ mạnh “quằn quại”, đồng thời không xác định người phụ nữ tượng trưng cho ai.
  alternative: Dịch nhẹ hơn là “đau đớn” hoặc dịch sát hình thức bị động là “bị hành hạ”.
  rationale: Nguyên văn nhấn mạnh nỗi đau dữ dội nhưng câu này không giải thích căn tính biểu tượng của người phụ nữ. Bản dịch giữ sức nặng của từ Hy Lạp mà không đưa vào một khuôn khổ giải nghĩa thần học riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để duy trì mạch kể về hình tượng người phụ nữ; câu văn giữ tính sống động của hiện tại trong khải tượng và cường độ của cảnh sinh nở.
