id: REV.12.16
reference: Revelation 12:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: vi
  text: Và đất[a] đã giúp người phụ nữ; đất mở miệng mình và nuốt dòng sông mà con rồng đã ném ra từ miệng nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mặt đất” hoặc “vùng đất”. Từ Hy Lạp γῆ có thể mang các nghĩa này.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mà con rồng đã phun ra từ miệng nó” hoặc “mà con rồng đã tuôn ra từ miệng nó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: Liên từ καί thường là “và”, nhưng ở đây câu kể chuyển sang hành động giải cứu đối nghịch với mối đe dọa ngay trước đó; “nhưng” diễn đạt tự nhiên quan hệ ngữ cảnh này trong tiếng Việt.
- source_word: ἐβοήθησεν
  choice: đã giúp
  rationale: Diễn đạt trực tiếp động từ βοηθέω ở thì aorist, giữ nhịp kể đơn giản và tự nhiên.
- source_word: ἡ γῆ
  choice: đất
  rationale: γῆ có thể chỉ đất, mặt đất hoặc vùng đất. “Đất” vừa tự nhiên trong hình ảnh đất há miệng, vừa không thu hẹp thành một địa phương cụ thể.
- source_word: τῇ γυναικί
  choice: người phụ nữ
  rationale: Chuyển dịch trực tiếp danh từ có mạo từ, giữ nguyên nhân vật biểu tượng mà không thêm lời giải thích.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: đất há miệng
  rationale: “Há miệng” là cách nói tự nhiên, sinh động trong tiếng Việt và bảo toàn phép nhân hóa của nguyên văn.
- source_word: κατέπιεν
  choice: nuốt
  rationale: Tương đương trực tiếp với καταπίνω; không cần thêm “chửng” hay “hết” vốn sẽ làm tăng sắc thái không được nêu rõ.
- source_word: τὸν ποταμόν
  choice: dòng sông
  rationale: ποταμός thường có nghĩa là sông. “Dòng sông” phù hợp với thực thể đang chảy và tránh diễn giải thành “nước lũ”.
- source_word: ὃν ἔβαλεν
  choice: mà ... đã phun ra
  rationale: βάλλω cơ bản có nghĩa ném hoặc tung ra, nhưng với một dòng sông đi ra từ miệng, “phun ra” tạo câu tiếng Việt tự nhiên và vẫn giữ hành động mạnh; chú thích ghi nhận cách dịch sát hình thức hơn.
- source_word: ὁ δράκων
  choice: con rồng
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với δράκων, duy trì nhất quán hình tượng khải huyền.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: từ miệng nó
  rationale: Dịch trực tiếp giới từ ἐκ. Đại từ “nó” quy chiếu rõ đến con rồng mà không nhân hóa thêm.
theological_decisions:
- issue: Sự nhân hóa của đất trong hình ảnh khải huyền
  choice: Giữ nguyên việc đất giúp người phụ nữ, há miệng và nuốt dòng sông.
  alternative: Giải thích đất là một dân tộc, lãnh thổ hoặc phương tiện quan phòng đem lại sự giải cứu.
  rationale: Nguyên văn đưa ra hình ảnh khải huyền mà không giải mã biểu tượng tại đây; bản dịch không nên tự ý xác định ý nghĩa thần học của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc lặp lại “đất” bảo toàn sự nhấn mạnh của nguyên văn; “há miệng” duy trì phép nhân hóa sống động. Các dấu chú thích đều xuất hiện trong chính văn.
