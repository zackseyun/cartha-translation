id: REV.10.11
reference: Revelation 10:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: vi
  text: 'Họ nói với tôi: “Ông phải nói tiên tri một lần nữa về các dân tộc, các quốc gia, các ngôn ngữ và nhiều vua.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν
  choice: họ nói
  rationale: Giữ chủ ngữ số nhiều không xác định của bản Hy Lạp và sắc thái hiện tại lịch sử trong một lối kể tự nhiên bằng tiếng Việt.
- source_word: Δεῖ σε
  choice: Ông phải
  rationale: Diễn đạt sự cần thiết bắt buộc của δεῖ; đại từ “ông” phù hợp với lời trực tiếp nói với Giăng trong văn phong trang trọng, hiện đại.
- source_word: πάλιν προφητεῦσαι
  choice: lại nói tiên tri
  rationale: Giữ rõ nghĩa “một lần nữa/lại” của πάλιν và hành động công bố lời tiên tri của προφητεύω.
- source_word: ἐπὶ
  choice: về
  rationale: Trong ngữ cảnh này, giới từ có thể chỉ đối tượng hoặc nội dung mà lời tiên tri hướng đến; “về” giữ cách hiểu tự nhiên mà không buộc nghĩa thành “chống lại” hay “trước mặt”.
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: nhiều dân tộc, quốc gia, ngôn ngữ và vua chúa
  rationale: Bảo toàn chuỗi bốn nhóm và để “nhiều” bao quát toàn bộ danh sách như vị trí hậu định của πολλοῖς trong tiếng Hy Lạp.
theological_decisions:
- issue: Phạm vi nghĩa của ἐπὶ sau προφητεῦσαι
  choice: về
  alternative: cho, trước mặt, chống lại
  rationale: “Về” giữ được độ mở của giới từ và phù hợp nhất với lời tiên tri liên quan đến nhiều nhóm người cùng vua chúa, không tự ý thêm sắc thái phán xét hay xác định địa điểm công bố.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu; giữ cấu trúc lời truyền phán trực tiếp và nhịp liệt kê của nguyên văn. Không thêm chú thích vì câu này không có dị bản hay điểm mơ hồ cần giải thích bắt buộc.
