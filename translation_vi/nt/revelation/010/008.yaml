id: REV.10.8
reference: Revelation 10:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: vi
  text: 'Và tiếng tôi đã nghe từ trời lại nói với tôi rằng: “Hãy đi, lấy cuộn sách[a] đã mở trong tay thiên sứ đứng trên biển và trên đất[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cuộn sách nhỏ”. Các câu chung quanh dùng dạng giảm nhẹ, nhưng câu này dùng βιβλίον, “cuộn sách”.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “trái đất”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: tiếng
  rationale: Trong ngữ cảnh, đây là tiếng nói phát ra từ trời; tiếng Việt tự nhiên có thể dùng “tiếng” khi động từ theo sau cho biết tiếng ấy đang nói.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả việc tiếng từ trời nói với Giăng thêm một lần nữa, ngắn gọn và tự nhiên.
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: lại nói với tôi rằng
  rationale: Gộp hai phân từ có quan hệ gần nhau thành cấu trúc tiếng Việt tự nhiên, không làm mất hành động phát lời trực tiếp với người kể.
- source_word: Ὕπαγε λάβε
  choice: Hãy đi lấy
  rationale: Hai mệnh lệnh liên tiếp được chuyển thành một chỉ thị tự nhiên trong tiếng Việt, vẫn giữ cả ý đi và lấy.
- source_word: βιβλίον
  choice: cuộn sách
  rationale: Phù hợp với dạng sách cuộn trong bối cảnh cổ đại; câu này dùng βιβλίον chứ không dùng dạng từ giảm nhẹ chỉ cuộn sách nhỏ.
- source_word: ἠνεῳγμένον
  choice: đang mở
  rationale: Diễn đạt trạng thái hiện tại do đã được mở ra, vừa tự nhiên vừa giữ kết quả của thể hoàn thành bị động.
- source_word: ἐν τῇ χειρὶ
  choice: trong tay
  rationale: Giữ sát giới từ ἐν và mô tả vị trí của cuộn sách; ý lấy khỏi tay được hàm chứa trong mệnh lệnh.
- source_word: ἄγγελος
  choice: thiên sứ
  rationale: Trong khải tượng này, từ chỉ một hữu thể thiên giới; “thiên sứ” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: ἑστῶτος
  choice: đứng
  rationale: Diễn đạt trạng thái đang đứng một cách gọn và tự nhiên trong mệnh đề bổ nghĩa tiếng Việt.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: trên biển và trên đất
  rationale: “Đất” tạo thế đối ứng không gian trực tiếp với “biển” và phù hợp với tư thế của thiên sứ trong khải tượng.
theological_decisions:
- issue: Cách dịch γῆ trong hình ảnh khải huyền
  choice: đất
  alternative: trái đất
  rationale: Hình ảnh trước mắt đối chiếu biển với phần đất liền nơi thiên sứ đứng; “đất” không áp đặt một khẳng định vũ trụ học rộng hơn.
- issue: Cách dịch βιβλίον trong mối liên hệ với văn cảnh
  choice: cuộn sách
  alternative: cuộn sách nhỏ
  rationale: Chính câu này dùng βιβλίον, không phải dạng giảm nhẹ βιβλαρίδιον xuất hiện ở các câu lân cận; vì vậy không hòa đồng hóa từ ngữ của câu này với văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể khải tượng, dùng “từ trời” thay cho cách dài dòng hơn, và tránh chú thích không thực sự cần thiết vì các phương án chính đã được thể hiện rõ trong bản dịch.
