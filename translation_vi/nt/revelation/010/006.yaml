id: REV.10.6
reference: Revelation 10:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: vi
  text: 'và lấy danh Đấng hằng sống đời đời mà thề: sẽ không còn trì hoãn nữa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát chữ: “sẽ không còn thời gian nữa.” Trong ngữ cảnh này, “thời gian” có thể được hiểu là khoảng chờ đợi hoặc trì hoãn trước khi Đức Chúa Trời thực hiện hành động cuối cùng.'
    reason: Giữ lại cách hiểu sát chữ của χρόνος và sự mơ hồ có thật giữa “thời gian” và “sự trì hoãn.”
lexical_decisions:
- source_word: ὤμοσεν
  choice: thề
  rationale: Động từ ὀμνύω chỉ việc lập lời thề; “thề” ngắn gọn, tự nhiên và giữ được sắc thái trang nghiêm.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: nhân danh Đấng sống đời đời
  rationale: Tặng cách sau ὀμνύω chỉ Đấng được viện đến để làm chứng cho lời thề. “Nhân danh” diễn đạt tự nhiên quan hệ này trong tiếng Việt; “Đấng sống đời đời” truyền đạt phân từ danh từ hóa và thành ngữ chỉ thời gian vô tận.
- source_word: ἔκτισεν
  choice: đã tạo dựng
  rationale: κτίζω trong công thức sáng tạo vũ trụ mang nghĩa “tạo dựng”; dạng quá khứ “đã tạo dựng” phản ánh động từ aorist.
- source_word: τὸν οὐρανὸν
  choice: trời
  rationale: Trong bộ ba vũ trụ trời–đất–biển, οὐρανός chỉ cõi trời; “trời” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: mọi vật trong đó / mọi vật trên đó
  rationale: Cách dịch này giữ phép lặp của công thức sáng tạo. Với đất, “trên đó” tự nhiên hơn trong tiếng Việt và phù hợp ý chỉ các vật ở trên mặt đất.
- source_word: γῆν
  choice: đất
  rationale: Trong bộ ba trời–đất–biển, γῆ mang nghĩa toàn thể đất, không phải một vùng đất riêng.
- source_word: θάλασσαν
  choice: biển
  rationale: “Biển” là tương đương trực tiếp, đồng thời giữ số ít và cấu trúc công thức sáng tạo.
- source_word: ὅτι
  choice: rằng
  rationale: Sau động từ thề, ὅτι giới thiệu nội dung lời thề; “rằng” thể hiện đúng chức năng này.
- source_word: χρόνος οὐκέτι ἔσται
  choice: sẽ không còn trì hoãn nữa
  rationale: Trong mạch văn dẫn sang câu 7, χρόνος nhiều khả năng chỉ khoảng trì hoãn trước khi kế hoạch của Đức Chúa Trời được hoàn tất. Cách dịch này tránh khiến độc giả mặc nhiên hiểu rằng bản thân thời gian chấm dứt, còn nghĩa sát chữ được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa của χρόνος trong nội dung lời thề
  choice: “không còn trì hoãn nữa,” hiểu là thời gian chờ đợi trước hành động quyết định của Đức Chúa Trời đã hết
  alternative: “sẽ không còn thời gian nữa”
  rationale: Câu kế tiếp nói đến sự hoàn tất mầu nhiệm của Đức Chúa Trời, nên nghĩa “trì hoãn” phù hợp với mạch văn. Tuy nhiên, vì χρόνος theo nghĩa thông thường là “thời gian,” bản dịch sát chữ vẫn là một khả năng thật sự và được nêu rõ trong chú thích, không xóa bỏ độ căng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Cấu trúc “nhân danh… mà thề rằng” tự nhiên trong tiếng Việt và vẫn giữ quan hệ cú pháp của lời thề. Phép lặp trời–đất–biển cùng các vật thuộc mỗi cõi được duy trì để phản ánh nhịp điệu của nguyên văn.
