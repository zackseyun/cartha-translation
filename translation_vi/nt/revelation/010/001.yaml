  to: Rồi tôi thấy một thiên sứ hùng mạnh khác[a] từ trời xuống, được mây bao phủ; trên đầu vị ấy có cầu vồng[b], mặt vị ấy như mặt trời, và chân vị ấy như những trụ lửa.
