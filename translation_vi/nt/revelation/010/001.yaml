id: REV.10.1
reference: Revelation 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: vi
  text: Rồi tôi thấy một thiên sứ hùng mạnh khác[a] từ trời xuống, được mây bao phủ; trên đầu vị ấy có cầu vồng[b], mặt vị ấy như mặt trời, và chân vị ấy như những trụ lửa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thiên sứ đầy quyền năng khác.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp này cũng có thể gợi đến một quầng sáng rực rỡ, nhưng nghĩa thông thường là “cầu vồng” và phù hợp với hình ảnh trong sách Khải Huyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: một thiên sứ ... khác
  rationale: Trong khải tượng này, ἄγγελος tự nhiên chỉ một thiên sứ; từ ἄλλον được giữ bằng “khác” mà không xác định thêm căn tính của vị ấy.
- source_word: ἰσχυρὸν
  choice: hùng mạnh
  rationale: Diễn đạt sức mạnh phi thường của nhân vật theo văn phong trang trọng, tự nhiên trong tiếng Việt.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: từ trời xuống
  rationale: Giữ rõ hướng chuyển động từ trời đi xuống, đồng thời phù hợp cú pháp tiếng Việt hiện đại.
- source_word: περιβεβλημένον νεφέλην
  choice: mình khoác mây
  rationale: Giữ hình ảnh mặc hoặc được bao bọc bằng mây của περιβάλλω; cách nói cô đọng, giàu hình ảnh và không biến đám mây thành y phục theo nghĩa đen.
- source_word: ἡ ἶρις
  choice: cầu vồng
  rationale: Nghĩa thông thường của ἶρις là “cầu vồng” và phù hợp với hình ảnh đã xuất hiện trong Khải Huyền 4:3; khả năng chỉ quầng sáng được ghi ở chú thích.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: trên đầu vị ấy
  rationale: ἐπί với đối cách ở đây mô tả vị trí trên hoặc phía trên đầu; “trên đầu” giữ được hình ảnh mà vẫn tự nhiên.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: mặt như mặt trời
  rationale: Giữ nguyên phép so sánh ngắn gọn của tiếng Hy Lạp; tiếng Việt không cần thêm động từ nối.
- source_word: οἱ πόδες αὐτοῦ
  choice: chân
  rationale: Dịch sát nghĩa thông thường của πούς và không thu hẹp hình ảnh vào riêng bàn chân hay mở rộng thành cả cẳng chân.
- source_word: στῦλοι πυρός
  choice: những trụ lửa
  rationale: Giữ kết cấu hình ảnh trực tiếp “trụ bằng/làm nên bởi lửa”; “trụ lửa” quen thuộc và sinh động trong tiếng Việt Kinh Thánh.
theological_decisions:
- issue: Căn tính của thiên sứ hùng mạnh
  choice: Dịch trung tính là “một thiên sứ hùng mạnh khác”, không đồng nhất vị ấy với Đấng Christ hay xác định đây chỉ là một thiên sứ thọ tạo.
  alternative: Hiểu nhân vật là một thiên sứ thọ tạo, hoặc là sự hiện hiện của Đấng Christ.
  rationale: Bản Hy Lạp chỉ gọi nhân vật là ἄλλον ἄγγελον ἰσχυρόν. Bản dịch giữ nguyên cách gọi này để không giải quyết thay cho bản văn một vấn đề còn được tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu hình ảnh. Câu giữ nhịp liệt kê của khải tượng Hy Lạp nhưng dùng dấu chấm phẩy để người đọc tiếng Việt dễ theo dõi. “Vị ấy” tránh sự suồng sã và không hàm ý quyết định căn tính thần học của nhân vật.
