source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: vi
  text: tay cầm một cuộn sách nhỏ đã được mở[a]. Người đặt chân phải trên biển, còn chân trái trên đất liền[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “mở sẵn.” Phân từ hoàn thành bị động trong tiếng Hy Lạp chỉ cuộn sách đã được mở và vẫn ở trạng thái mở.
    reason: aspectual_alternative
  - marker: b
    text: Hay “trên đất.” Từ Hy Lạp γῆ có thể có nghĩa là “đất,” “đất liền” hoặc “trái đất”; ở đây chọn “đất liền” để làm rõ sự tương phản với “biển.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: tay cầm
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý vị thiên sứ đang có và cầm vật ấy trong tay; vẫn duy trì sự nối tiếp với câu 1.
- source_word: βιβλαρίδιον
  choice: một cuộn sách nhỏ
  rationale: Danh từ giảm nghĩa chỉ một cuộn sách hay quyển sách nhỏ; “cuộn sách nhỏ” phù hợp hình ảnh văn bản thời cổ và ngữ cảnh Khải Huyền.
- source_word: ἠνεῳγμένον
  choice: đang mở
  rationale: Phân từ hoàn thành bị động nói đến vật đã được mở và hiện vẫn ở trạng thái mở; tiếng Việt tự nhiên dùng “đang mở” để nhấn mạnh trạng thái hiện tại.
- source_word: ἔθηκεν
  choice: đặt
  rationale: Truyền đạt hành động có chủ ý và trang trọng mà không làm câu nặng nề.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιὸν
  choice: chân phải
  rationale: Cách nói trực tiếp, tự nhiên, giữ rõ sở chỉ của danh từ và tính từ Hy Lạp.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: trên biển
  rationale: Giữ nguyên hình ảnh khải huyền sống động và nghĩa thông thường của giới từ cùng danh từ.
- source_word: τὸν δὲ εὐώνυμον
  choice: còn chân trái
  rationale: Bổ sung lại “chân” trong tiếng Việt để cấu trúc đối xứng, rõ nghĩa; δέ được thể hiện bằng “còn”.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất liền
  rationale: γῆ có thể là đất, đất liền hoặc trái đất; “đất liền” làm rõ sự tương phản trực tiếp với biển.
theological_decisions:
- issue: Cách dịch γῆ khi tương phản với θάλασσα
  choice: đất liền
  alternative: đất; trái đất
  rationale: Hình ảnh mô tả tư thế của thiên sứ với một chân trên biển và chân kia trên phần đất khô. “Đất liền” giữ đúng sự tương phản không gian, không áp đặt ý nghĩa vũ trụ học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mở đầu tiếp nối trực tiếp mô tả thiên sứ ở câu 1; dùng “Người” để chỉ thiên sứ một cách tôn trọng nhưng không thần hóa. Dấu phẩy cuối được giữ vì câu còn tiếp sang câu kế.
