id: REV.10.3
reference: Revelation 10:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: vi
  text: Người kêu lớn tiếng như sư tử gầm. Khi người kêu lên, bảy tiếng sấm cất lên tiếng nói của riêng mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bảy tiếng sấm phát ra tiếng nói của riêng mình.” Nguyên văn Hy Lạp có lối diễn đạt nổi bật, nhân cách hóa các tiếng sấm như đang nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: kêu lớn tiếng / kêu lên
  rationale: Động từ chỉ một tiếng kêu mạnh. Cách dịch này giữ cường độ mà không mặc nhiên hàm ý đau đớn như một số cách dùng của “la khóc”.
- source_word: φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Diễn đạt tự nhiên trong tiếng Việt cho cụm chỉ cách thức “bằng/với một tiếng lớn”, đồng thời vẫn giữ ý về giọng phát ra mạnh.
- source_word: ὥσπερ λέων μυκᾶται
  choice: như sư tử gầm
  rationale: Giữ nguyên phép so sánh; “gầm” là động từ tự nhiên cho tiếng của sư tử.
- source_word: ὅτε
  choice: khi
  rationale: Giữ quan hệ thời gian mà không diễn giải quá mức thành “sau khi”.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: bảy tiếng sấm
  rationale: “Tiếng sấm” là cách gọi tự nhiên trong tiếng Việt, đồng thời có thể được nhân cách hóa trong mệnh đề tiếp theo.
- source_word: ἐλάλησαν ... τὰς ἑαυτῶν φωνάς
  choice: cất tiếng của riêng mình
  rationale: Giữ hình ảnh nhân cách hóa và sắc thái nhấn mạnh của đại từ phản thân ἑαυτῶν, nhưng diễn đạt theo cú pháp tiếng Việt tự nhiên.
theological_decisions:
- issue: Sự nhân cách hóa bảy tiếng sấm
  choice: Giữ cách nói “bảy tiếng sấm cất tiếng của riêng mình”
  alternative: bảy tiếng sấm vang lên / bảy tiếng sấm phát ra sứ điệp
  rationale: Bản Hy Lạp mô tả các tiếng sấm như chủ thể nói và có tiếng nói riêng. Giữ phép nhân cách hóa bảo toàn hình ảnh khải huyền, không giản lược thành hiệu ứng âm thanh hay tự ý xác định đó là các “sứ điệp”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” theo ngữ cảnh nói về nhân vật vừa được nhắc đến, tránh bổ sung danh xưng không có trong câu. “Cất tiếng” vừa tự nhiên vừa duy trì phép nhân cách hóa khác thường của nguyên văn.
