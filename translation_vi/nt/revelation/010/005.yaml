id: REV.10.5
reference: Revelation 10:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: vi
  text: Thiên sứ mà tôi đã thấy đứng trên biển và trên đất liền[a] giơ tay phải lên trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên đất” hoặc “trên trái đất”.
    reason: lexical_alternative
  - marker: b
    text: Hay “về phía trời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: thiên sứ
  rationale: Trong ngữ cảnh Khải Huyền, từ này chỉ một hữu thể từ trời; “thiên sứ” vừa tự nhiên vừa cụ thể hơn nghĩa khái quát “sứ giả”.
- source_word: ἑστῶτα
  choice: đứng
  rationale: Phân từ hoàn thành diễn tả tư thế hay trạng thái hiện tại của thiên sứ; “đứng” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: trên biển
  rationale: Giữ nguyên hình ảnh sống động của bản Hy Lạp và phù hợp với cảnh tượng đã nêu trước đó.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất liền
  rationale: Trong thế đối lập trực tiếp với “biển”, “đất liền” truyền đạt rõ nét sự tương phản không gian; γῆ cũng có thể mang nghĩa rộng hơn là “đất” hay “trái đất”.
- source_word: ἦρεν
  choice: giơ ... lên
  rationale: Trong cử chỉ chuẩn bị tuyên thệ, “giơ tay ... lên” tự nhiên và trang trọng hơn cách dịch máy móc “nâng”.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: tay phải
  rationale: Giữ đúng sự xác định rõ ràng của nguyên văn rằng đó là bàn tay phải của thiên sứ.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: εἰς diễn tả hướng của cử chỉ; “lên trời” là lối nói tự nhiên, đồng thời giữ được sắc thái thần học của οὐρανός trong ngữ cảnh lời thề ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch γῆ khi đối lập với θάλασσα
  choice: đất liền
  alternative: đất; trái đất
  rationale: Cảnh tượng mô tả thiên sứ đứng trên hai miền là biển và đất liền. Lựa chọn này giữ rõ hình ảnh không gian mà không áp đặt một khẳng định vũ trụ học rộng hơn; chú thích bảo lưu khả năng dịch khác.
- issue: Cách dịch οὐρανός
  choice: trời
  alternative: bầu trời
  rationale: Cử chỉ này dẫn vào lời thề nhân danh Đấng Tạo Hóa ở câu sau, nên “trời” giữ được chiều kích thần học mà vẫn trung thành với hướng chuyển động trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” theo ngữ cảnh khải tượng; cấu trúc câu được điều chỉnh tự nhiên trong tiếng Việt nhưng vẫn giữ thứ tự các hình ảnh chính của nguyên văn.
