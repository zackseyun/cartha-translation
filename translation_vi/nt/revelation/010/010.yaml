id: REV.10.10
reference: Revelation 10:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: vi
  text: Tôi lấy cuộn sách nhỏ[a] từ tay thiên sứ và ăn hết nó. Trong miệng tôi, nó ngọt như mật; và khi tôi đã ăn nó, bụng tôi trở nên đắng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyển sách nhỏ.” Từ Hy Lạp có dạng giảm nhẹ và có thể chỉ một văn bản nhỏ; “cuộn sách nhỏ” phù hợp hơn với hình thức văn bản có khả năng được nói đến trong bối cảnh cổ đại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “dạ dày tôi trở nên đắng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: cuộn sách nhỏ
  rationale: Dạng giảm nhẹ chỉ một văn bản nhỏ; “cuộn sách” phù hợp với hình thức văn bản cổ đại, còn “nhỏ” giữ được sắc thái của từ Hy Lạp.
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: từ tay thiên sứ
  rationale: Cách diễn đạt tự nhiên, sát nghĩa và giữ hình ảnh trực tiếp nhận cuộn sách từ tay thiên sứ.
- source_word: κατέφαγον
  choice: ăn hết
  rationale: Động từ ghép có thể mang sắc thái ăn trọn hoặc ăn hết; cách dịch này tự nhiên trong tiếng Việt và biểu đạt lực của động từ mà không cường điệu thành “ngấu nghiến”.
- source_word: ὡς μέλι γλυκύ
  choice: ngọt như mật
  rationale: Giữ nguyên phép so sánh và là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὅτε ἔφαγον αὐτό
  choice: sau khi tôi ăn
  rationale: 'Làm rõ trình tự kể chuyện: vị đắng xuất hiện sau hành động ăn, nhưng không gán thêm giá trị thời cho thì aorist.'
- source_word: ἐπικράνθη
  choice: trở nên đắng
  rationale: Diễn đạt tự nhiên kết quả của biến đổi nơi bụng; tránh lối bị động gượng gạo “bị làm cho đắng” trong tiếng Việt.
- source_word: κοιλία
  choice: bụng
  rationale: “Bụng” là từ hiện đại, thông dụng và bao quát đúng vùng cơ thể được chỉ đến; “dạ dày” sẽ cụ thể hơn mức từ Hy Lạp đòi hỏi.
theological_decisions:
- issue: Hành động biểu tượng ăn cuộn sách
  choice: Dịch trực tiếp hình ảnh ngọt trong miệng và đắng trong bụng, không giải thích biểu tượng ngay trong câu.
  alternative: Giải thích vị ngọt và đắng là niềm vui cùng sự phán xét hoặc đau khổ.
  rationale: Bản văn câu này trình bày biểu tượng nhưng chưa tự giải nghĩa đầy đủ; giữ nguyên hình ảnh bảo toàn sự hàm súc và căng thẳng thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thiên sứ” theo văn phong Kinh Thánh phổ thông; giữ nhịp kể ngôi thứ nhất và hình ảnh thân thể cụ thể của nguyên văn.
