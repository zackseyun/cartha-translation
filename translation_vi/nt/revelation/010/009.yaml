id: REV.10.9
reference: Revelation 10:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: vi
  text: 'Vậy tôi đi đến thiên sứ và bảo vị ấy trao cho tôi cuộn sách nhỏ[a]. Vị ấy nói với tôi[b]: “Hãy cầm lấy và ăn hết đi. Nó sẽ làm đắng bụng ngươi[c], nhưng trong miệng ngươi, nó sẽ ngọt như mật ong.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyển sách nhỏ”. Từ Hy Lạp βιβλαρίδιον là dạng giảm nhẹ, có thể chỉ một cuộn sách nhỏ hoặc một quyển sách mỏng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng thì hiện tại: “vị ấy nói với tôi”, tức hiện tại lịch sử nhằm làm lời kể thêm sống động.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “làm dạ dày ngươi đắng”. Từ Hy Lạp κοιλία ở đây chỉ bụng hoặc phần bên trong liên quan đến việc ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: tôi đi đến thiên sứ
  rationale: Diễn đạt tự nhiên chuyển động của Giăng về phía thiên sứ; không dịch cứng tiền tố ἀπ- thành “đi khỏi” vì ngữ cảnh nhấn mạnh đích đến.
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: bảo vị ấy trao cho tôi
  rationale: Giữ nội dung lời nói đi kèm mà không thêm sắc thái lịch sự của “xin”; “trao” tự nhiên khi nói đến vật đang ở trong tay thiên sứ.
- source_word: βιβλαρίδιον
  choice: cuộn sách nhỏ
  rationale: Giữ sắc thái nhỏ của hình thức giảm nhẹ và phản ánh dạng cuộn sách có khả năng phù hợp nhất với bối cảnh cổ đại.
- source_word: λέγει μοι
  choice: vị ấy nói với tôi
  rationale: Tiếng Việt thường dùng thì kể chuyện không đánh dấu; cách dịch này tự nhiên hơn việc cố tái tạo hiện tại lịch sử của tiếng Hy Lạp, đồng thời chú thích nêu rõ đặc điểm ấy.
- source_word: Λάβε
  choice: Hãy cầm lấy
  rationale: Mệnh lệnh trực tiếp, tự nhiên; “cầm lấy” phù hợp với một cuộn sách cụ thể.
- source_word: κατάφαγε αὐτό
  choice: ăn hết đi
  rationale: Động từ ghép κατεσθίω có thể mang lực mạnh hơn ἐσθίω đơn thuần; “ăn hết đi” truyền đạt hành động trọn vẹn mà không quá kịch tính như “ngấu nghiến”.
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: Nó sẽ làm bụng ngươi đắng
  rationale: Giữ cấu trúc gây khiến và hình ảnh vị đắng trong phần bụng sau khi ăn; đại từ “ngươi” phù hợp lời truyền phán trang trọng trực tiếp.
- source_word: γλυκὺ ὡς μέλι
  choice: ngọt như mật ong
  rationale: Tái hiện trực tiếp và tự nhiên phép so sánh của nguyên văn.
theological_decisions:
- issue: Hành động biểu tượng ăn cuộn sách
  choice: Giữ nguyên mệnh lệnh cụ thể “cầm lấy và ăn hết đi” mà không giải thích biểu tượng trong chính văn.
  alternative: Diễn giải thành việc tiếp nhận hoặc thấm nhuần sứ điệp của Đức Chúa Trời.
  rationale: Nguyên văn trình bày hành động tiên tri bằng hình ảnh cụ thể; giải nghĩa ngay trong câu sẽ thu hẹp ý nghĩa và làm mất sức căng thần học vốn có.
- issue: Tính tương phản giữa đắng trong bụng và ngọt trong miệng
  choice: Giữ nguyên trật tự và sự tương phản của nguyên văn.
  alternative: Giải thích vị ngọt là niềm vui tiếp nhận lời và vị đắng là đau khổ do nội dung lời tiên tri.
  rationale: Những cách hiểu biểu tượng này có thể hợp lý nhưng không được phát biểu trực tiếp trong câu, nên không đưa vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” theo lối Kinh Thánh phổ thông; dùng “vị ấy” để tránh lặp và thể hiện sự kính trọng vừa phải. Trong lời thiên sứ, “ngươi” duy trì sắc thái trang trọng của lời truyền phán. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại phần chính văn liên quan.
