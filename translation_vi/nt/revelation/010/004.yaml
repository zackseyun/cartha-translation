id: REV.10.4
reference: Revelation 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: vi
  text: 'Khi bảy tiếng sấm cất tiếng, tôi đang định viết xuống thì nghe một tiếng nói từ trời rằng: “Hãy niêm phong những điều bảy tiếng sấm đã nói, và đừng viết chúng xuống.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ ἑπτὰ βρονταί
  choice: bảy tiếng sấm
  rationale: Giữ hình ảnh khải huyền và sự nhân cách hóa trong nguyên văn, nơi bảy tiếng sấm được mô tả như những chủ thể lên tiếng.
- source_word: ἐλάλησαν
  choice: đã lên tiếng / đã nói
  rationale: “Lên tiếng” tự nhiên khi nói về tiếng sấm được nhân cách hóa; “đã nói” trong mệnh lệnh sau giúp câu rõ ràng mà vẫn giữ nghĩa của λαλέω.
- source_word: ἤμελλον γράφειν
  choice: tôi định viết lại
  rationale: 'Diễn đạt hành động sắp được thực hiện trong ngữ cảnh: Giăng chuẩn bị ghi lại nội dung vừa nghe. “Viết lại” ở đây có nghĩa là ghi chép lại, không phải viết lần thứ hai.'
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: một tiếng từ trời
  rationale: Giữ nguyên nguồn phát ra từ trời mà không xác định danh tính của người phán, vì nguyên văn không nói rõ.
- source_word: Σφράγισον
  choice: Hãy niêm phong
  rationale: “Niêm phong” thể hiện mệnh lệnh dứt khoát nhằm giữ kín nội dung mặc khải, phù hợp với sắc thái của động từ σφραγίζω.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: những điều bảy tiếng sấm đã nói
  rationale: Thể hiện rõ đại từ quan hệ trung tính số nhiều ἃ chỉ nội dung những điều đã được nói.
- source_word: μὴ αὐτὰ γράψῃς
  choice: đừng ghi lại những điều ấy
  rationale: “Những điều ấy” giữ được hình thức số nhiều của αὐτά và quy chiếu tự nhiên đến các điều bảy tiếng sấm đã nói.
theological_decisions:
- issue: Danh tính của tiếng phán từ trời
  choice: một tiếng từ trời
  alternative: tiếng của Đức Chúa Trời từ trời
  rationale: Nguyên văn chỉ nói đó là một tiếng phát ra từ trời, không trực tiếp xác định người phán; bản dịch không bổ sung danh tính.
- issue: Ý nghĩa của việc niêm phong
  choice: không giải thích thêm lý do hoặc thời hạn
  alternative: giữ bí mật vĩnh viễn những điều ấy
  rationale: Câu chỉ truyền lệnh niêm phong và không ghi lại; không nên suy diễn thời hạn hay mục đích vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho tiếng từ trời để phù hợp ngữ cảnh mặc khải nhưng không qua đó xác định danh tính người phán. Cấu trúc “những điều… những điều ấy” hơi lặp có chủ ý nhằm giữ rõ đối tượng số nhiều của ἃ và αὐτά.
