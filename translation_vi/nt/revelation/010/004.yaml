  - severity: low
    issue: “Nhưng” thêm sắc thái đối lập.
    rationale: Liên từ καί ở đây nối diễn tiến; việc Giăng nghe tiếng từ trời ngăn ông viết có thể được hiểu theo ngữ cảnh, nhưng nguyên văn không dùng liên từ đối lập.
  - severity: low
    issue: “Một tiếng từ trời” hơi thiếu tự nhiên.
    rationale: “Một tiếng nói từ trời” diễn đạt tự nhiên hơn φωνὴν ἐκ τοῦ οὐρανοῦ mà vẫn không đồng nhất tiếng nói ấy với một nhân vật cụ thể.
