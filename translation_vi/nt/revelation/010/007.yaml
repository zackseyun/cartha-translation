id: REV.10.7
reference: Revelation 10:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: vi
  text: Nhưng trong những ngày tiếng của thiên sứ thứ bảy cất lên, khi vị ấy sắp thổi kèn, thì mầu nhiệm của Đức Chúa Trời được hoàn tất, đúng như Ngài đã loan báo tin mừng cho các nô lệ thuộc về Ngài[a], tức là các nhà tiên tri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các đầy tớ thuộc về Ngài.” Từ Hy Lạp có thể mang nghĩa “đầy tớ” hoặc “nô lệ”; tại đây, cụm từ nhấn mạnh rằng họ thuộc về Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Giữ quan hệ tương phản với lời tuyên bố trước đó, đồng thời tự nhiên và súc tích trong tiếng Việt.
- source_word: ἐν ταῖς ἡμέραις
  choice: trong những ngày
  rationale: Giữ cách diễn đạt thời gian trang trọng của văn chương khải huyền mà vẫn dễ hiểu.
- source_word: τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: tiếng của thiên sứ thứ bảy vang lên
  rationale: φωνή có thể chỉ tiếng hoặc âm thanh. Thêm “vang lên” để câu tiếng Việt tự nhiên nhưng không đồng nhất từ này hoàn toàn với hành động thổi kèn.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: khi vị ấy sắp thổi kèn
  rationale: μέλλῃ với động từ nguyên mẫu diễn tả việc sắp xảy ra; σαλπίζειν trong ngữ cảnh này là thổi kèn.
- source_word: καὶ ἐτελέσθη
  choice: thì ... được hoàn tất
  rationale: Cách dịch bị động giữ ý kế hoạch của Đức Chúa Trời đạt đến chỗ thành tựu. Dạng không ghi rõ thời trong tiếng Việt phù hợp với mệnh đề hướng về tương lai mà không xóa sắc thái aorist của tiếng Hy Lạp.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: mầu nhiệm của Đức Chúa Trời
  rationale: Giữ thuật ngữ thần học chỉ ý định của Đức Chúa Trời vốn kín giấu, thay vì diễn giải cụ thể hơn mức nguyên văn.
- source_word: ὡς εὐηγγέλισεν
  choice: đúng như Ngài đã báo tin mừng
  rationale: Giữ nghĩa công bố tin tốt lành của εὐαγγελίζω và thể hiện hành động đã được thực hiện trước đó.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: các nô lệ của chính Ngài
  rationale: δοῦλος có thể được dịch là “đầy tớ” hoặc “nô lệ”; ἑαυτοῦ nhấn mạnh họ thuộc về Đức Chúa Trời, nên bản chính giữ sắc thái lệ thuộc mạnh hơn và chú thích cách dịch tự nhiên khác.
- source_word: τοὺς προφήτας
  choice: tức là các nhà tiên tri
  rationale: Cụm này đồng vị với những người vừa được nói đến; “tức là” làm rõ quan hệ ấy trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δοῦλος khi nói về các nhà tiên tri của Đức Chúa Trời
  choice: nô lệ
  alternative: đầy tớ
  rationale: “Nô lệ” giữ rõ quan hệ thuộc quyền được ἑαυτοῦ nhấn mạnh; “đầy tớ” được ghi trong chú thích vì tự nhiên hơn và cũng nằm trong phạm vi nghĩa của từ Hy Lạp.
- issue: Sắc thái của ἐτελέσθη với μυστήριον trong mệnh đề hướng về tương lai
  choice: được hoàn tất
  alternative: đã được hoàn tất; sẽ được hoàn tất
  rationale: Tiếng Hy Lạp dùng aorist nhưng cả cấu trúc đặt biến cố trong thời điểm thiên sứ thứ bảy sắp thổi kèn. Cách dịch không đánh dấu thời rõ rệt trong tiếng Việt bảo tồn sức căng giữa hình thức động từ và hướng thời gian của ngữ cảnh, không áp đặt một hệ thống cánh chung.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Giữ sắc thái khải huyền qua “trong những ngày” và “mầu nhiệm,” nhưng dùng “vang lên” cùng “tức là” để câu tiếng Việt sáng rõ. Đại từ “Ngài” quy chiếu về Đức Chúa Trời.
