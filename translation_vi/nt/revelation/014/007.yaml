id: REV.14.7
reference: Revelation 14:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: vi
  text: 'Người ấy lớn tiếng nói: “Hãy kính sợ Đức Chúa Trời[a] và tôn vinh Ngài, vì giờ phán xét của Ngài đã đến. Hãy thờ phượng Đấng đã dựng nên trời, đất, biển và các nguồn nước[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy sợ Đức Chúa Trời.” Động từ Hy Lạp có thể chỉ cả lòng kính sợ lẫn nỗi sợ trước sự phán xét.'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, cả “nguồn” và “nước” đều ở dạng số nhiều.
    reason: source_form
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: người nói lớn tiếng
  rationale: Giữ liên hệ phân từ với câu trước qua “người nói”, đồng thời diễn đạt ἐν φωνῇ μεγάλῃ bằng lối nói tự nhiên trong tiếng Việt.
- source_word: Φοβήθητε τὸν θεὸν
  choice: Hãy kính sợ Đức Chúa Trời
  rationale: “Kính sợ” giữ được cả lòng tôn kính lẫn ý thức run sợ trước Đấng phán xét, phù hợp với sự kết hợp giữa phán xét và thờ phượng trong câu.
- source_word: δότε αὐτῷ δόξαν
  choice: tôn vinh Ngài
  rationale: Diễn đạt tự nhiên hành động quy vinh quang về Đức Chúa Trời mà không làm yếu sắc thái tôn giáo của δόξα.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: vì giờ phán xét của Ngài đã đến
  rationale: “Vì” thể hiện quan hệ nguyên nhân; “giờ” giữ tính khẩn cấp mang sắc thái khải huyền của ὥρα; “của Ngài” bảo lưu cách diễn đạt cô đọng của sở hữu cách Hy Lạp.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: Hãy thờ phượng Đấng đã dựng nên
  rationale: “Thờ phượng” phù hợp nghĩa tôn giáo của προσκυνέω trong Khải Huyền; “Đấng đã dựng nên” giữ lực động từ của phân từ ποιήσαντι và có văn phong trang trọng, tự nhiên.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: trời, đất, biển và các nguồn nước
  rationale: Giữ chuỗi các thực tại được tạo dựng và âm hưởng ngôn ngữ sáng tạo; “các nguồn nước” là cách nói tiếng Việt tự nhiên cho πηγὰς ὑδάτων.
theological_decisions:
- issue: Sắc thái của mệnh lệnh Φοβήθητε τὸν θεόν
  choice: Hãy kính sợ Đức Chúa Trời
  alternative: Hãy sợ Đức Chúa Trời
  rationale: “Kính sợ” không thu hẹp mệnh lệnh thành nỗi kinh hãi đơn thuần, nhưng vẫn giữ yếu tố sợ hãi thích hợp trong bối cảnh phán xét; chú thích bảo lưu khả năng dịch trực tiếp hơn.
- issue: Quan hệ sở hữu trong τῆς κρίσεως αὐτοῦ
  choice: giờ phán xét của Ngài
  alternative: giờ Ngài phán xét
  rationale: 'Cách dịch được chọn bảo lưu độ cô đọng và phần nào tính mở của sở hữu cách: sự phán xét thuộc về, phát xuất từ, hoặc được Đức Chúa Trời thi hành, thay vì chỉ định rõ một quan hệ duy nhất.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “Ngài” theo văn phong Kinh Thánh phổ thông; tránh lối diễn đạt quá cổ. Dấu [a] được đặt ngay sau cụm có phương án từ vựng khác; dấu [b] được đặt tại “các nguồn nước”, đúng với nội dung chú thích về πηγὰς ὑδάτων.
