id: REV.14.11
reference: Revelation 14:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: vi
  text: Khói của sự hành hạ họ cứ bốc lên đời đời kiếp kiếp[a], và họ không được nghỉ ngơi ngày đêm—những kẻ thờ lạy con thú và tượng của nó, và nếu ai nhận dấu của tên nó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “đến các thời đại của các thời đại.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp kết thúc đột ngột bằng câu “và nếu ai nhận dấu của tên nó”, có lẽ tiếp tục mô tả những người chịu phán xét; một số bản dịch làm câu trôi chảy hơn thành “và bất cứ ai nhận”.
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς τοῦ βασανισμοῦ αὐτῶν
  choice: khói từ sự đau đớn của họ
  rationale: Giữ nguyên hình ảnh cụ thể về khói phát sinh từ cảnh chịu đau đớn; “sự đau đớn” tự nhiên hơn “sự hành hạ” trong tiếng Việt và không xác định thêm phương thức gây đau.
- source_word: εἰς αἰῶνας αἰώνων
  choice: đời đời vô cùng
  rationale: Diễn đạt thành ngữ chỉ thời gian kéo dài không dứt trong văn phong Khải Huyền, đồng thời chú thích nghĩa sát chữ.
- source_word: ἀναβαίνει
  choice: cứ bốc lên
  rationale: “Bốc lên” hợp tự nhiên với chủ ngữ “khói”; từ “cứ” thể hiện sắc thái tiếp diễn của thì hiện tại.
- source_word: οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός
  choice: không được nghỉ ngơi ngày đêm
  rationale: Chuyển đạt trực tiếp tình trạng không có sự nghỉ ngơi liên tục cả ngày lẫn đêm.
- source_word: προσκυνοῦντες
  choice: thờ lạy
  rationale: Thể hiện cả hành vi phủ phục và ý nghĩa tôn thờ, phù hợp ngữ cảnh lòng trung thành mang tính tôn giáo.
- source_word: τὸ θηρίον
  choice: con thú
  rationale: Cách gọi rõ ràng, tự nhiên, giữ hình tượng khải huyền và nhất quán với danh từ có mạo từ.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: tượng của nó
  rationale: Trong ngữ cảnh Khải Huyền, “tượng” diễn đạt một hình tượng được dựng lên để thờ lạy tự nhiên hơn “hình ảnh”; không thu hẹp thành chất liệu hay loại tượng cụ thể.
- source_word: εἴ τις λαμβάνει
  choice: nếu ai nhận
  rationale: Bám sát sự chuyển đột ngột trong tiếng Hy Lạp từ phân từ số nhiều sang điều kiện bất định số ít, thay vì làm phẳng thành một mệnh đề quan hệ.
- source_word: τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ
  choice: dấu của tên nó
  rationale: Giữ quan hệ sở hữu khá sát nguyên văn và thuật ngữ “dấu” quen thuộc trong mạch văn Khải Huyền mà không diễn giải thêm.
theological_decisions:
- issue: Thời hạn của sự phán xét trong εἰς αἰῶνας αἰώνων
  choice: đời đời vô cùng
  alternative: qua các thời đại của các thời đại
  rationale: Cách dịch chính truyền đạt sức nặng thông thường của công thức trong Khải Huyền là thời gian không dứt; chú thích vẫn cho thấy cấu trúc sát chữ để không che khuất cách diễn đạt Hy Lạp.
- issue: Cú pháp và phạm vi của mệnh đề cuối
  choice: giữ dạng đột ngột “và nếu ai nhận”
  alternative: làm trơn thành “và bất cứ ai nhận” hoặc gộp vào nhóm “những kẻ”
  rationale: Nguyên văn chuyển từ mô tả số nhiều sang điều kiện bất định số ít. Giữ sự chuyển này bảo tồn độ căng cú pháp và không quyết định quá mức quan hệ chính xác của mệnh đề cuối với nhóm đang chịu phán xét.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “cứ bốc lên” để giữ hình ảnh sống động; dấu chấm phẩy giúp câu tiếng Việt rõ hơn nhưng vẫn bảo tồn sự chuyển cú pháp bất ngờ ở mệnh đề cuối. Mọi ký hiệu chú thích [a], [b] đều có trong chính văn.
