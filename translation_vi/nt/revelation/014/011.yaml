review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh. Cụm τοῦ βασανισμοῦ là sở thuộc trực tiếp, nên “khói của sự hành hạ họ” sát hơn “khói từ sự đau đớn của họ”; “đau đớn” cũng yếu và chung hơn βασανισμός trong ngữ cảnh phán xét. Bản sửa giữ hiện tại hình tượng của ἀναβαίνει, công thức thời lượng mạnh của εἰς αἰῶνας αἰώνων, và sự chuyển cú pháp đột ngột ở εἴ τις λαμβάνει.
  naturalness: “Đời đời vô cùng” không phải cách nói hiện đại tự nhiên bằng “đời đời kiếp kiếp” trong văn phong Kinh Thánh. Câu thứ hai của bản nháp gắn “và nếu ai...” sau dấu chấm phẩy nhưng chưa phản ánh rõ đây là sự đứt đoạn có chủ ý của nguyên văn; dùng gạch ngang giúp người đọc nhận ra sự chuyển bất thường, đồng thời chú thích giải thích đầy đủ.
  terminology: “Sự hành hạ” diễn đạt βασανισμός chính xác hơn mà không xác định phương thức. Giữ “thờ lạy”, “con thú”, “tượng”, và “dấu của tên nó” là phù hợp với thuật ngữ Khải Huyền. “Đời đời kiếp kiếp” chuyển đạt thành ngữ Hy Lạp theo cách quen thuộc và trang trọng.
  issues:
  - severity: medium
    issue: “khói từ sự đau đớn của họ” làm lỏng quan hệ sở thuộc và giảm sắc thái của βασανισμός.
    rationale: Nguyên văn nói “khói của sự hành hạ họ”; không chỉ là khói phát sinh từ một cảm giác đau nói chung.
  - severity: low
    issue: “đời đời vô cùng” hơi trùng ý và kém tự nhiên trong tiếng Việt hiện đại.
    rationale: “Đời đời kiếp kiếp” là cách diễn đạt trang trọng, tự nhiên và tương xứng với εἰς αἰῶνας αἰώνων.
  - severity: low
    issue: Chú thích a dùng “qua các thời đại” chưa sát hướng của εἰς.
    rationale: “Đến các thời đại của các thời đại” phản ánh trực tiếp hơn giới từ và cấu trúc thành ngữ.
