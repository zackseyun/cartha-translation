  terminology: “Thiên sứ,” “thờ lạy,” “con thú,” “tượng,” và “dấu” phù hợp văn mạch Khải Huyền và giữ đúng sắc thái thờ phượng của προσκυνεῖ. “Tượng của nó” phản ánh cách quy chiếu không nhân cách hóa của giống trung τὸ θηρίον trong tiếng Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
