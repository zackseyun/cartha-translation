  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố của nguyên văn: thiên sứ khác là vị thứ ba, theo sau các vị trước, lời công bố lớn tiếng, điều kiện phổ quát, việc thờ lạy con thú và tượng của nó, cùng việc nhận một dấu trên trán hoặc tay của chính người ấy. Câu được giữ dang dở đúng theo cú pháp nguyên văn, vốn tiếp tục ở câu sau.'
