id: REV.14.9
reference: Revelation 14:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: vi
  text: 'Rồi một thiên sứ khác, là thiên sứ thứ ba, theo sau họ và lớn tiếng nói: “Nếu ai thờ lạy con thú cùng tượng của nó, và nhận một dấu trên trán hoặc trên tay mình,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: một thiên sứ khác, là thiên sứ thứ ba
  rationale: Giữ cả ý ‘khác’ và thứ tự ‘thứ ba’ của cụm Hy Lạp, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: theo sau họ
  rationale: 'Thể hiện trực tiếp diễn tiến của khải tượng: vị thiên sứ này xuất hiện sau các vị trước.'
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: lớn tiếng nói
  rationale: Lối nói tự nhiên, trang trọng trong tiếng Việt, giữ tính công khai và mạnh mẽ của lời cảnh báo.
- source_word: Εἴ τις
  choice: Nếu ai
  rationale: Cấu trúc điều kiện bất định, có phạm vi áp dụng chung cho bất cứ người nào.
- source_word: προσκυνεῖ
  choice: thờ lạy
  rationale: Trong ngữ cảnh này, động từ chỉ sự tôn thờ và quy phục mang tính tôn giáo; ‘thờ lạy’ cũng bảo lưu sắc thái cúi mình của từ Hy Lạp.
- source_word: τὸ θηρίον
  choice: con thú
  rationale: Cách gọi rõ ràng, quen thuộc cho nhân vật khải huyền θηρίον, phù hợp danh từ chỉ sinh vật trong tiếng Việt.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: tượng của nó
  rationale: εἰκών ở đây là hình tượng được dựng lên để nhận sự thờ lạy; ‘tượng’ tự nhiên hơn ‘hình ảnh’, còn ‘của nó’ không áp đặt giới tính lên θηρίον.
- source_word: λαμβάνει χάραγμα
  choice: nhận một dấu
  rationale: ‘Nhận’ diễn tả việc tiếp nhận dấu hiệu nhận diện; danh từ không có mạo từ được chuyển là ‘một dấu’.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: trên trán hoặc trên tay mình
  rationale: Giữ vị trí của dấu và số ít quy chiếu về ‘ai’; đại từ phản thân ‘mình’ tự nhiên trong tiếng Việt và không làm thay đổi phạm vi chung của lời cảnh báo.
theological_decisions:
- issue: Sắc thái của προσκυνέω đối với con thú
  choice: thờ lạy
  alternative: sấp mình trước
  rationale: Ngữ cảnh Khải Huyền nói đến sự tôn thờ và trung thành mang tính thờ phượng, chứ không chỉ một tư thế thân thể; ‘thờ lạy’ giữ được cả hai sắc thái.
- issue: Đại từ số ít αὐτοῦ quy chiếu về τις
  choice: trên trán hoặc trên tay mình
  alternative: trên trán hoặc trên tay người ấy
  rationale: ‘Mình’ quy chiếu tự nhiên về chủ thể bất định ‘ai’, duy trì số ít và tính bao quát mà không buộc tiếng Việt dùng đại từ giống đực.
- issue: Cách hiểu εἰκών trong bối cảnh thờ lạy
  choice: tượng của nó
  alternative: hình tượng của nó
  rationale: ‘Tượng’ diễn đạt cụ thể đối tượng được thờ lạy trong văn cảnh, nhưng không xác định thêm chất liệu hay hình thức mà nguyên văn không nêu.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu ở trạng thái chưa kết thúc vì lời điều kiện tiếp tục sang câu kế tiếp. Không cần chú thích: các sắc thái quan trọng được chuyển trực tiếp bằng ‘thờ lạy’ và đại từ ‘mình’.'
