id: REV.14.2
reference: Revelation 14:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: vi
  text: Tôi nghe một âm thanh từ trời, như tiếng nhiều dòng nước và như tiếng sấm lớn; âm thanh mà tôi nghe được thì như tiếng những người chơi đàn lia đang gảy đàn lia của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đàn lia” dịch từ κιθάρα, một nhạc cụ dây cổ đại được gảy; theo truyền thống, từ này đôi khi được dịch là “đàn hạc”.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: âm thanh / tiếng
  rationale: Trong câu này, từ này chỉ hiện tượng nghe được, được ví với nước, sấm và nhạc cụ; cách dịch này tránh mặc nhiên hiểu đó là tiếng nói, đồng thời tiếng Việt tự nhiên dùng “tiếng” trong các phép so sánh.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Trong ngữ cảnh Khải Huyền, οὐρανός chỉ cõi trời; “từ trời” vừa sát nghĩa vừa tự nhiên.
- source_word: ὑδάτων πολλῶν
  choice: nhiều dòng nước
  rationale: Giữ hình ảnh Kinh Thánh về khối nước tạo tiếng vang dữ dội, nhưng thêm “dòng” để cụm từ rõ và tự nhiên hơn trong tiếng Việt.
- source_word: βροντῆς μεγάλης
  choice: sấm lớn
  rationale: μέγας diễn tả cường độ và sự hùng mạnh; “sấm lớn” giữ cấu trúc hình ảnh mà không giải thích quá mức.
- source_word: κιθαρῳδῶν κιθαριζόντων
  choice: những người chơi đàn lia đang gảy đàn
  rationale: Cụm từ nói đến người sử dụng κιθάρα và hành động chơi nhạc cụ; “gảy” phù hợp với loại nhạc cụ dây này.
- source_word: κιθάραις
  choice: đàn lia
  rationale: κιθάρα cổ đại gần với đàn lia hơn đàn hạc hiện đại; cách dịch này tránh tạo hình dung sai về nhạc cụ.
theological_decisions:
- issue: Bản chất của âm thanh từ trời
  choice: Dịch φωνή chủ yếu là “âm thanh/tiếng”, không xác định đó là tiếng nói của một nhân vật.
  alternative: Dịch nhất quán là “tiếng nói”.
  rationale: Các phép so sánh với nước, sấm và tiếng đàn nhấn mạnh đặc tính âm học; nguyên văn không nêu rõ một người đang nói, nên không nên tự ý xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “âm thanh” ở mệnh đề chính để rõ nghĩa, rồi dùng “tiếng” trong các phép so sánh cho tự nhiên; giữ nhịp lặp của nguyên văn.
