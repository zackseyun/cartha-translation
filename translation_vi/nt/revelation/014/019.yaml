id: REV.14.19
reference: Revelation 14:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: vi
  text: Và thiên sứ vung lưỡi liềm trên đất, thu hoạch cây nho của đất rồi ném cây nho ấy vào bồn ép nho lớn của cơn thịnh nộ Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: vung lưỡi liềm trên đất
  rationale: Trong ngữ cảnh gặt hái, ἔβαλεν diễn tả động tác đưa/vung lưỡi liềm để thu hoạch; “trên đất” truyền đạt hướng tác động tự nhiên hơn trong tiếng Việt, tránh gợi ý lưỡi liềm bị ném hoặc cắm xuống đất.
- source_word: ἐτρύγησεν
  choice: thu hoạch
  rationale: Động từ này thường chỉ hái hoặc thu hoạch nho; cách dịch giữ liên hệ trực tiếp với “cây nho” mà vẫn tự nhiên.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: cây nho của đất
  rationale: Giữ hình ảnh số ít tập thể và cấu trúc sở hữu của nguyên văn, không diễn giải thành dân cư hay mùa màng.
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: bồn ép nho lớn
  rationale: ληνός là bồn/máng dùng để ép nho; “bồn ép nho” rõ nghĩa với độc giả hiện đại và “lớn” giữ tính từ của nguyên văn.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: của cơn thịnh nộ Đức Chúa Trời
  rationale: “Cơn thịnh nộ” phù hợp sắc thái mạnh của θυμός trong cảnh phán xét; “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Hình ảnh cây nho và bồn ép trong sự phán xét
  choice: Giữ nguyên hình ảnh, không xác định cây nho tượng trưng cho nhóm người cụ thể nào
  alternative: Diễn giải cây nho là những kẻ gian ác hoặc các dân tộc
  rationale: Câu Hy Lạp trình bày biểu tượng mà không trực tiếp nêu đối tượng; bản dịch không nên giải quyết thay sự căng thẳng biểu tượng của văn bản.
- issue: Sắc thái của θυμός
  choice: cơn thịnh nộ
  alternative: cơn giận
  rationale: “Thịnh nộ” giữ cường độ và sắc thái phán xét trang trọng, nhưng không thêm nội dung thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; nhịp câu giữ chuỗi ba hành động liên tiếp của thiên sứ. Không dùng chú thích vì các lựa chọn dịch có thể thể hiện rõ trong chính văn.
