id: REV.14.15
reference: Revelation 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: vi
  text: 'Rồi một thiên sứ khác từ đền thờ đi ra, lớn tiếng gọi Đấng ngồi trên đám mây: “Hãy đưa lưỡi liềm của ngài ra mà gặt, vì giờ gặt đã đến, bởi hoa màu trên đất đã chín.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: đền thờ
  rationale: Chỉ nơi thánh/đền thờ trên trời trong ngữ cảnh Khải Huyền; “đền thờ” tự nhiên và dễ hiểu, không thu hẹp quá mức thành riêng gian chí thánh.
- source_word: κράζων ἐν φωνῇ μεγάλῃ
  choice: lớn tiếng gọi
  rationale: Diễn đạt tự nhiên cường độ của lời kêu lớn mà không lặp vụng “kêu bằng tiếng lớn”.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Hãy đưa lưỡi liềm của ngài ra
  rationale: Giữ sắc thái sai khiến và ý đưa/phóng dụng cụ vào công việc; “đưa ... ra” tự nhiên hơn cách dịch máy móc “sai lưỡi liềm”.
- source_word: ἐξηράνθη
  choice: đã chín
  rationale: Động từ theo nghĩa đen là “đã khô”, nhưng trong hình ảnh mùa gặt chỉ cây lúa đã chín và sẵn sàng để gặt; bản dịch truyền đạt đúng hàm ý nông nghiệp trong tiếng Việt.
- source_word: ὁ θερισμὸς τῆς γῆς
  choice: mùa màng trên đất
  rationale: Ở đây θερισμός theo hoán dụ là hoa màu sẵn để gặt; “mùa màng trên đất” tự nhiên và giữ phạm vi toàn cõi đất.
theological_decisions:
- issue: Cách xưng hô với Đấng ngồi trên mây
  choice: ngài
  alternative: Ngài
  rationale: Nguyên văn không xác định trực tiếp danh tính bằng một tước hiệu thần linh trong câu này; viết thường tránh áp đặt cách giải thích, đồng thời vẫn giữ lối xưng hô kính trọng.
- issue: Tính chất của mùa gặt
  choice: đã chín
  alternative: đã khô / đã chín khô
  rationale: Không giải thích mùa gặt là cứu rỗi hay phán xét ngay trong bản văn; cách dịch trung tính giữ nguyên sức căng của ngữ cảnh biểu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc; giữ hình ảnh khải huyền, nhịp câu mạch lạc, không thêm diễn giải giáo lý.
