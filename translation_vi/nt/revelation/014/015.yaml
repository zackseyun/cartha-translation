  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính: một thiên sứ khác ra từ ναός, kêu lớn với Đấng ngồi trên mây, truyền dùng lưỡi liềm để gặt, và nêu hai lý do với ὅτι. “Đền thờ,” “lớn tiếng gọi,” và “đã chín” đều phù hợp trong ngữ cảnh hình ảnh mùa gặt; ἐξηράνθη nghĩa đen là “đã khô,” nhưng có thể chỉ hoa màu đã đủ chín để gặt. Tuy nhiên, ὁ θερισμὸς τῆς γῆς chỉ sản vật/hoa màu cần gặt, không phải chính “mùa màng” theo nghĩa mùa vụ hoặc tình trạng mùa vụ.'
