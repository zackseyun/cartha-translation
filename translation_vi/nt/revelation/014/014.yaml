id: REV.14.14
reference: Revelation 14:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: vi
  text: Rồi tôi nhìn, và kìa, một đám mây trắng. Trên mây có một người ngồi, giống như con trai loài người[a]; trên đầu người ấy có một mão vàng[b], và trong tay có một lưỡi liềm sắc bén.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một vị tựa như Con Người.” Cụm từ này vang vọng Đa-ni-ên 7:13 và thường được hiểu là một tước hiệu chỉ Đấng Mê-si-a, dù tiếng Hy Lạp ở đây không có mạo từ trước cụm “con trai loài người.”'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp ở đây là stephanos, thường chỉ vòng miện của người chiến thắng hơn là vương miện hoàng gia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ sức gợi trực tiếp, sống động của lời thuật khải tượng, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: νεφέλη λευκή
  choice: một đám mây trắng
  rationale: Chuyển tải trực tiếp danh từ và tính từ Hy Lạp, không diễn giải λευκή thành “sáng chói”.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: trên mây có một vị đang ngồi
  rationale: Diễn đạt tự nhiên tư thế ngồi trên đám mây và dùng “một vị” để chỉ nhân vật với sắc thái trang trọng vừa phải.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: trông giống như một con người
  rationale: Giữ ý so sánh và nghĩa thành ngữ chỉ một người thuộc nhân loại, không tự động biến cụm từ không có mạo từ thành tước hiệu xác định; liên hệ với Đa-ni-ên 7:13 được nêu trong chú thích.
- source_word: στέφανον χρυσοῦν
  choice: mão miện bằng vàng
  rationale: Cách nói rõ ràng, trang trọng và dễ hiểu; sắc thái στέφανος là vòng miện, thường gắn với chiến thắng, được bảo lưu trong chú thích.
- source_word: δρέπανον ὀξύ
  choice: một lưỡi liềm sắc bén
  rationale: Tên dụng cụ gặt quen thuộc trong tiếng Việt, phù hợp trực tiếp với hình ảnh mùa gặt ở ngữ cảnh kế tiếp.
theological_decisions:
- issue: Có nên dịch υἱὸν ἀνθρώπου thành tước hiệu Cơ Đốc luận rõ ràng hay không
  choice: Bản văn chính dùng “một vị… giống như một con người”
  alternative: “một vị tựa như Con Người”
  rationale: Tiếng Hy Lạp ở đây không có mạo từ, nên bản văn chính không tăng cường thành một tước hiệu xác định. Tuy vậy, cụm từ vang vọng Đa-ni-ên 7:13 và thường được hiểu theo nghĩa Đấng Mê-si-a; khả năng ấy được giữ trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và sáng rõ, thích hợp với lời thuật khải tượng. “Kìa” giữ nét đột ngột của cảnh tượng; câu được chia nhịp để tránh cấu trúc liên kết dồn dập, thiếu tự nhiên trong tiếng Việt.
