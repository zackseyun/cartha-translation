  verdict: revise
  source_fidelity: Bản nháp giữ đúng các thành tố chính của câu, gồm việc hát, ngai, bốn sinh vật, các trưởng lão, sự bất khả học bài ca, nhóm 144.000, và phân từ bị động hoàn thành của ἀγοράζω. Tuy nhiên, “một bài ca dường như là bài ca mới” không phản ánh tự nhiên cấu trúc ὡς ᾠδὴν καινήν và tạo ra một sự lặp vô cớ. “Được mua từ đất” cũng khiến ἀπὸ τῆς γῆς nghe như nguồn xuất xứ của món hàng hơn là việc được mua ra khỏi phạm vi trái đất.
  naturalness: Cần chỉnh để tiếng Việt hiện đại trôi chảy hơn. “Hát như hát một bài ca mới” là cách diễn đạt tự nhiên hơn để giữ ὡς mà không biến nó thành lời khẳng định rằng bài ca chỉ ‘dường như’ mới. “Được mua về từ trái đất” truyền đạt tự nhiên hơn hình ảnh mua từ/ra khỏi trái đất.
  terminology: “Ngai,” “bốn sinh vật,” “các trưởng lão,” và “bài ca” phù hợp văn phong Khải Huyền. Giữ “được mua về” trong chính văn để phản ánh ἠγορασμένοι; chú thích có thể nêu “được chuộc” như một cách dịch diễn giải quen dùng. “Trái đất” rõ nghĩa hơn “đất” trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: Cụm “một bài ca dường như là bài ca mới” vừa lặp vừa không tự nhiên.
    rationale: Nguyên ngữ có ὡς trước “một bài ca mới”; nó có thể chỉ cách thức/sự tương tự trong cảnh tượng, nhưng không có cơ sở để thêm cấu trúc đồng nhất hóa “là bài ca mới.”
  - severity: medium
    issue: “Đã được mua từ đất” không tự nhiên và dễ bị hiểu sai quan hệ của giới từ ἀπό.
    rationale: Trong tiếng Việt, một người ‘được mua từ đất’ gợi nguồn bán hoặc đất đai. “Được mua về từ trái đất” diễn đạt rõ việc họ được mua ra từ phạm vi trái đất mà vẫn giữ ẩn dụ thương mại.
