revisions:
- from: Họ hát một bài ca dường như là bài ca mới[a] trước ngai, trước bốn sinh vật và các trưởng lão. Không ai có thể học được bài ca ấy, ngoại trừ một trăm bốn mươi bốn ngàn người—những người đã được mua từ đất[b].
  to: Họ hát như hát một bài ca mới[a] trước ngai, trước bốn sinh vật và các trưởng lão. Không ai có thể học bài ca ấy, ngoại trừ một trăm bốn mươi bốn ngàn người—những người đã được mua về từ trái đất[b].
  rationale: Bản sửa thay cấu trúc không tự nhiên quanh ὡς bằng “như hát một bài ca mới,” một cách nói tiếng Việt giữ được tính so sánh/cách thức của nguyên ngữ mà không áp đặt rằng bài ca không thực sự mới. “Được mua về từ trái đất” làm rõ hướng nghĩa của ἀπὸ τῆς γῆς và vẫn giữ hình ảnh thương mại của ἠγορασμένοι. Các dấu chú thích vẫn được đặt đúng tại những chỗ có phương án dịch đáng lưu ý.
