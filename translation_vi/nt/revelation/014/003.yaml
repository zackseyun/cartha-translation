id: REV.14.3
reference: Revelation 14:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: vi
  text: Họ hát như hát một bài ca mới[a] trước ngai, trước bốn sinh vật và các trưởng lão. Không ai có thể học bài ca ấy, ngoại trừ một trăm bốn mươi bốn ngàn người—những người đã được mua về từ trái đất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ hát một bài ca mới” hoặc “họ hát như một bài ca mới.” Từ Hy Lạp ὡς có thể diễn tả cách thức hay sự tương tự trong lời mô tả khải tượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “những người đã được chuộc khỏi trái đất.” Động từ Hy Lạp theo nghĩa đen là “mua” hoặc “mua về”; cách dịch “chuộc” diễn giải hình ảnh mua bán.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: họ hát
  rationale: Động từ ở thì hiện tại, ngôi thứ ba số nhiều; tiếng Việt dùng hiện tại đơn tự nhiên mà vẫn giữ được lối kể sống động của khải tượng.
- source_word: ὡς ᾠδὴν καινὴν
  choice: một bài ca dường như là bài ca mới
  rationale: ὡς có thể biểu thị cách thức, sự tương tự hoặc ấn tượng trong khải tượng. Cách dịch này giữ sắc thái tri giác mà không phủ nhận đó thực sự là bài ca mới.
- source_word: ἐνώπιον
  choice: trước
  rationale: Ngắn gọn, tự nhiên, và giữ ý hiện diện trước ngai cùng các hữu thể thuộc thiên giới.
- source_word: τῶν τεσσάρων ζῴων
  choice: bốn sinh vật
  rationale: ζῷον chỉ các hữu thể sống quanh ngai; “sinh vật” tránh nghĩa thú vật thấp kém và phù hợp văn cảnh Khải Huyền.
- source_word: τῶν πρεσβυτέρων
  choice: các trưởng lão
  rationale: Đây là danh xưng của một nhóm xác định trong triều đình thiên thượng, không đơn thuần chỉ những người lớn tuổi.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: không ai có thể học được
  rationale: Giữ nghĩa khả năng của ἐδύνατο và nghĩa căn bản “học” của μαθεῖν.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: một trăm bốn mươi bốn ngàn người
  rationale: Viết bằng chữ để giữ văn phong trang trọng; thêm “người” theo cú pháp tiếng Việt, phù hợp với mệnh đề giải thích theo sau.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: những người đã được mua từ đất
  rationale: Giữ trực tiếp ẩn dụ mua bán của ἀγοράζω và giới từ ἀπό, thay vì đưa thuật ngữ thần học diễn giải vào chính văn.
theological_decisions:
- issue: Sắc thái của ὡς trong mô tả khải tượng
  choice: “dường như là bài ca mới”
  alternative: “như một bài ca mới”
  rationale: ὡς có thể đánh dấu điều người thấy cảm nhận trong khải tượng. Cách dịch chính giữ sắc thái hiện tượng học nhưng không khẳng định rằng bài ca ấy không thật sự mới; phương án sát hình thức hơn được ghi ở chú thích.
- issue: Cách dịch ἠγορασμένοι
  choice: “đã được mua”
  alternative: “đã được chuộc”
  rationale: Động từ mang nghĩa căn bản là mua. “Được chuộc” thích hợp về thần học và văn cảnh nhưng diễn giải ẩn dụ rõ hơn nguyên văn, nên được giữ trong chú thích.
- issue: Phạm vi của ἀπὸ τῆς γῆς
  choice: “từ đất”
  alternative: “khỏi thế gian” hoặc “từ giữa loài người”
  rationale: γῆ có thể chỉ đất, trái đất hoặc cõi người tùy văn cảnh. Chính văn giữ cách nói gọn và gần nguyên ngữ, không tự ý xác định đó là địa cầu hay xã hội loài người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bài ca” thay vì “bài hát” để hợp sắc thái thờ phượng; dùng “ngai” và “trưởng lão” theo thuật ngữ Kinh Thánh quen thuộc. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
