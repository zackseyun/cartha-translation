id: REV.14.8
reference: Revelation 14:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: vi
  text: 'Một thiên sứ khác, là thiên sứ thứ hai, theo sau và nói: “Đã sụp đổ, đã sụp đổ rồi, Ba-by-lôn vĩ đại—nó đã khiến mọi dân tộc uống rượu của cơn cuồng nhiệt trong sự gian dâm của nó[a][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rượu của cơn thịnh nộ trong sự gian dâm của nó.” Từ Hy Lạp θυμός có thể chỉ cơn thịnh nộ, sự cuồng nộ, hoặc đam mê mãnh liệt.'
    reason: lexical_alternative
  - marker: b
    text: “Sự gian dâm” của Ba-by-lôn có lẽ là hình ảnh tượng trưng cho ảnh hưởng bại hoại, thờ thần tượng và bất trung của nó, nhưng câu này không giới hạn ý nghĩa vào chỉ một khía cạnh.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: Một thiên sứ khác, là thiên sứ thứ hai
  rationale: Giữ cả ἄλλος (‘khác’) lẫn δεύτερος (‘thứ hai’), đồng thời dùng kết cấu đồng vị tự nhiên trong tiếng Việt.
- source_word: ἠκολούθησεν λέγων
  choice: theo sau và nói
  rationale: Diễn đạt rõ trình tự trong khải tượng; chuyển phân từ λέγων thành động từ phối hợp là tự nhiên trong tiếng Việt.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Đã sụp đổ, đã sụp đổ rồi
  rationale: Giữ nguyên phép lặp đầy sức nhấn mạnh và sắc thái tuyên cáo về biến cố đã xảy ra; ‘sụp đổ’ phù hợp với một thành tượng trưng.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Ba-by-lôn vĩ đại
  rationale: Phiên âm tên riêng theo lối quen thuộc và giữ sắc thái danh hiệu của ἡ μεγάλη.
- source_word: ἣ
  choice: nó
  rationale: Đại từ quan hệ giống cái quy chiếu về Ba-by-lôn được diễn đạt bằng đại từ tự nhiên dành cho thành phố trong tiếng Việt, không áp đặt nhân hóa bằng ‘nàng’.
- source_word: ἐκ τοῦ οἴνου
  choice: uống rượu
  rationale: Kết hợp tự nhiên với động từ sai khiến uống; ý ‘từ rượu’ vốn không cần biểu thị riêng trong tiếng Việt.
- source_word: τοῦ θυμοῦ
  choice: cuồng nhiệt
  rationale: θυμός có thể chỉ cơn giận dữ hoặc một xung lực mãnh liệt; trong chuỗi sở hữu gắn với πορνεία, ‘cuồng nhiệt’ giữ được ý dục vọng mãnh liệt mà không loại bỏ hoàn toàn sắc thái dữ dội.
- source_word: τῆς πορνείας αὐτῆς
  choice: của sự gian dâm mình
  rationale: ‘Gian dâm’ giữ được hình ảnh tình dục và khả năng dùng theo nghĩa biểu tượng, thay vì giải nghĩa trực tiếp thành thờ thần tượng hay bất trung.
- source_word: πεπότικεν πάντα τὰ ἔθνη
  choice: đã khiến mọi dân tộc uống
  rationale: Giữ nghĩa sai khiến của ποτίζω và giá trị hoàn thành của thì hoàn thành, đồng thời diễn đạt πάντα τὰ ἔθνη tự nhiên.
theological_decisions:
- issue: Ý nghĩa biểu tượng của πορνεία nơi Ba-by-lôn
  choice: Giữ hình ảnh ‘sự gian dâm’ trong chính văn.
  alternative: Dịch giải thành ‘sự thờ thần tượng’, ‘sự bất trung’ hoặc ‘ảnh hưởng bại hoại’.
  rationale: Nguyên văn không giới hạn hình ảnh vào một cách giải nghĩa duy nhất; cách dịch này bảo toàn sức căng giữa nghĩa tình dục và nghĩa biểu tượng.
- issue: Nghĩa của θυμός trong cụm τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς
  choice: Dịch là ‘cuồng nhiệt’.
  alternative: ‘cơn thịnh nộ’ hoặc ‘sự cuồng nộ’.
  rationale: Cấu trúc Hy Lạp cho phép hiểu là đam mê mãnh liệt của sự gian dâm, nhưng θυμός cũng mang sắc thái giận dữ; ghi chú bảo lưu phương án truyền thống mà không đồng nhất ngay với cơn thịnh nộ của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ phép lặp mang tính tiên tri, cả hai yếu tố ‘khác’ và ‘thứ hai’, cùng hình ảnh rượu và gian dâm của nguyên văn. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
