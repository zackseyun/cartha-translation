reference: Revelation 14:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: vi
  text: 'Rồi một thiên sứ khác từ bàn thờ đi ra, là vị có quyền trên lửa. Vị ấy lớn tiếng gọi người đang cầm lưỡi liềm sắc bén rằng: “Hãy tra lưỡi liềm sắc bén của ngươi vào[a] và hái những chùm nho của cây nho của đất[b], vì nho của nó đã chín.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy sai lưỡi liềm sắc bén của ngươi đi.” Động từ Hy Lạp theo nghĩa đen là “sai đi” hoặc “đưa đi”; trong hình ảnh gặt hái, có thể diễn đạt tự nhiên là “tra liềm vào.”'
    reason: lexical_alternative
  - marker: b
    text: “Cây nho của đất” là một hình ảnh khải huyền. Câu này không nói rõ hình ảnh ấy chỉ về ai hay điều gì, dù văn cảnh xung quanh nói về sự phán xét.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: một thiên sứ khác
  rationale: Trong các khải tượng của sách Khải Huyền, ἄγγελος thường chỉ hữu thể thiên thượng; “khác” giữ được diễn tiến liên tiếp của trình thuật.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: từ bàn thờ đi ra
  rationale: “Bàn thờ” là cách dịch tự nhiên của θυσιαστήριον; thêm “đi ra” làm rõ chuyển động được hàm ý bởi giới từ ἐκ trong mạch kể.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: là vị có quyền trên lửa
  rationale: Giữ cấu trúc mô tả của phân từ có mạo từ và ý nghĩa quyền hạn hay quyền kiểm soát đối với lửa.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: lớn tiếng gọi
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ cả hành động gọi và cường độ lớn của tiếng nói.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: vị cầm lưỡi liềm sắc bén
  rationale: “Cầm” diễn đạt tự nhiên việc nhân vật đang có lưỡi liềm; “sắc bén” được giữ vì tính từ này được lặp lại để nhấn mạnh.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Hãy đưa lưỡi liềm sắc bén của ngươi ra
  rationale: πέμπω có nghĩa cơ bản là “sai/đưa đi”; trong hình ảnh gặt hái, “đưa ... ra” vừa dễ hiểu vừa không chuyển hẳn sang cách giải thích “tra liềm vào”.
- source_word: τρύγησον
  choice: thu hoạch
  rationale: Động từ chỉ việc hái hay thu hoạch nho; “thu hoạch” phù hợp với tân ngữ là những chùm nho và giữ sắc thái mùa hái nho.
- source_word: τοὺς βότρυας
  choice: những chùm nho
  rationale: βότρυς chỉ chùm nho; nói rõ “nho” giúp hình ảnh tự nhiên và minh bạch trong tiếng Việt.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: của cây nho dưới đất
  rationale: Giữ nguyên hình ảnh khải huyền và mối liên hệ sở hữu; “dưới đất” là cách nói tự nhiên cho τῆς γῆς mà không đồng nhất cây nho với một nhóm người cụ thể.
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: nho của nó đã chín
  rationale: ἀκμάζω diễn tả việc đạt độ chín; thể aorist được thể hiện tự nhiên bằng “đã chín”, còn “của nó” quy chiếu về cây nho.
theological_decisions:
- issue: Hình ảnh τῆς ἀμπέλου τῆς γῆς
  choice: Giữ là “cây nho dưới đất” trong chính văn.
  alternative: Diễn giải cây nho là những kẻ gian ác hoặc nhân loại bị phán xét.
  rationale: Văn cảnh cho thấy cảnh phán xét, nhưng câu này dùng một hình ảnh khải huyền mà không trực tiếp xác định đối tượng; bản dịch không nên biến cách giải thích thần học thành chính văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “thiên sứ” theo ngữ cảnh khải tượng, “vị” để tránh lặp đại từ thiếu trang trọng, và “ngươi” trong mệnh lệnh trực tiếp nhằm giữ sắc thái trang nghiêm của lời truyền phán. Các dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong chính văn.
