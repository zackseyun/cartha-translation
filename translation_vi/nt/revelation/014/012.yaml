source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: vi
  text: Đây là sự kiên trì của các thánh, là những người giữ các điều răn của Đức Chúa Trời và đức tin của Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đức tin nơi Giê-su”; hoặc: “lòng trung tín của Giê-su.” Cụm từ Hy Lạp này có nhiều cách hiểu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: Đây là
  rationale: Giữ sắc thái chỉ điểm và sức nhấn tu từ của trạng từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὑπομονὴ
  choice: sự bền chí
  rationale: Diễn tả sự kiên định chịu đựng và tiếp tục trung thành giữa thử thách; gọn và tự nhiên hơn cách nói dài “sự kiên nhẫn chịu đựng”.
- source_word: ἁγίων
  choice: các thánh đồ
  rationale: Cách gọi quen thuộc trong Kinh Thánh dành cho dân thánh của Đức Chúa Trời, không hàm ý chỉ một tầng lớp đặc biệt được phong thánh.
- source_word: τηροῦντες
  choice: giữ
  rationale: Trong ngữ cảnh các điều răn, từ này bao hàm việc tuân giữ và làm theo, đồng thời tương ứng trực tiếp với động từ Hy Lạp.
- source_word: ἐντολὰς
  choice: các điều răn
  rationale: Giữ được trọng lượng của những mệnh lệnh đến từ Đức Chúa Trời và phù hợp với cách dùng Kinh Thánh quen thuộc.
- source_word: πίστιν
  choice: đức tin
  rationale: Là cách dịch trực tiếp, quen thuộc của πίστις và không tự ý chuyển sang nghĩa “lòng trung tín”; các khả năng khác được nêu trong chú thích.
- source_word: Ἰησοῦ
  choice: của Chúa Giê-su
  rationale: Dịch sát dạng sở hữu cách Hy Lạp và giữ nguyên tính mơ hồ của kết cấu πίστιν Ἰησοῦ thay vì âm thầm quyết định đối tượng hay chủ thể của đức tin.
theological_decisions:
- issue: Ý nghĩa của τὴν πίστιν Ἰησοῦ
  choice: đức tin của Chúa Giê-su
  alternative: đức tin nơi Chúa Giê-su; hoặc lòng trung tín của Chúa Giê-su
  rationale: Kết cấu sở hữu cách trong tiếng Hy Lạp thực sự có thể chỉ đức tin hướng đến Chúa Giê-su hoặc đức tin/lòng trung tín gắn với chính Chúa Giê-su. Bản văn chính giữ cách diễn đạt gần nguyên văn, còn các cách hiểu rõ nghĩa hơn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và phù hợp với tiếng Việt tiêu chuẩn hiện đại. Cụm “tức là những người” làm rõ quan hệ đồng vị của phân từ οἱ τηροῦντες mà không biến nó thành quan hệ nguyên nhân hay điều kiện. Dấu chú thích được đặt ngay sau cụm từ có cách hiểu khác nhau.
