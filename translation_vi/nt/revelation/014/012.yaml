revisions:
- from: Đây là sự bền chí của các thánh đồ, tức là những người giữ các điều răn của Đức Chúa Trời và đức tin của Chúa Giê-su.[a]
  to: Đây là sự kiên trì của các thánh, là những người giữ các điều răn của Đức Chúa Trời và đức tin của Giê-su.[a]
  rationale: Sửa “sự bền chí” thành “sự kiên trì” để diễn đạt tự nhiên hơn ὑπομονή; đổi “các thánh đồ” thành “các thánh” để tránh sắc thái hệ phái; bỏ tước hiệu “Chúa” được thêm vào trước tên Giê-su vì không có trong bản nguồn; và đặt ký hiệu chú thích ngay sau cụm từ sở hữu cách đang được chú giải. Bản chính vẫn giữ nguyên tính mơ hồ của τὴν πίστιν Ἰησοῦ, không quyết định trước giữa “đức tin nơi Giê-su” và “lòng trung tín của Giê-su”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: ὑπομονή là sự kiên trì/bền chí; mệnh đề phân từ οἱ τηροῦντες có tính đồng vị với “các thánh”; và kết cấu τὴν πίστιν Ἰησοῦ được giữ mơ hồ. Tuy nhiên, việc thêm “Chúa” vào tên Giê-su không có trong bản nguồn và làm nghiêng cách diễn đạt chính theo một tước hiệu không được nêu ở đây.'
  naturalness: “Sự bền chí” có thể hiểu được, nhưng “sự kiên trì” là cách nói tự nhiên, thông dụng hơn trong tiếng Việt hiện đại cho sự bền bỉ chịu đựng của ὑπομονή. “Các thánh” trung tính và phổ thông hơn “các thánh đồ”, vốn gắn rõ với một truyền thống dịch thuật nhất định.
  terminology: Dùng “các thánh” cho ἁγίων tránh sắc thái giáo phái của “thánh đồ” mà vẫn giữ thuật ngữ Kinh Thánh. “Đức Chúa Trời” và “các điều răn” có thể giữ nguyên. “Đức tin của Giê-su” bảo toàn sở hữu cách mơ hồ; chú thích cần neo ngay tại cụm này và nêu các cách hiểu thay thế.
  issues:
  - severity: medium
    issue: Tên Giê-su được mở rộng thành “Chúa Giê-su” trong bản văn chính và chú thích.
    rationale: SBLGNT chỉ có Ἰησοῦ, không có κύριος. Dù “Chúa Giê-su” là lối gọi quen thuộc, việc thêm tước hiệu không được nêu trong câu làm giảm tính tương ứng với nguồn.
  - severity: low
    issue: “Các thánh đồ” mang sắc thái truyền thống/giáo phái rõ hơn cần thiết.
    rationale: ἅγιοι chỉ các người thánh của Đức Chúa Trời. “Các thánh” vừa trực tiếp hơn vừa phù hợp tiếng Việt tiêu chuẩn hiện đại.
  - severity: low
    issue: Dấu chú thích hiện đặt ở cuối câu thay vì sát cụm πίστιν Ἰησοῦ.
    rationale: Chú thích chỉ nhằm giải quyết tính mơ hồ của “đức tin của Giê-su”; neo chú thích ngay sau cụm đó giúp phạm vi chú thích rõ ràng.
  revised_text: Đây là sự kiên trì của các thánh, là những người giữ các điều răn của Đức Chúa Trời và đức tin của Giê-su.[a]
