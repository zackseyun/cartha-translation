id: REV.14.13
reference: Revelation 14:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: vi
  text: 'Rồi tôi nghe một tiếng từ trời phán: “Hãy viết: Phước cho những người chết, là những người từ nay chết trong Chúa.” Thánh Linh phán: “Phải, để họ được nghỉ ngơi khỏi những nhọc nhằn của mình[a], vì những việc họ làm theo họ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lao nhọc của mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đi cùng họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: một tiếng từ trời phán
  rationale: “Một tiếng từ trời” diễn đạt tự nhiên nguồn phát của tiếng nói; “phán” giữ sắc thái trang trọng phù hợp với lời từ trời.
- source_word: Γράψον
  choice: Hãy viết
  rationale: Giữ nguyên mệnh lệnh trực tiếp ở ngôi số ít, không thêm tân ngữ vốn không có trong tiếng Hy Lạp.
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Công thức chúc phước quen thuộc, trang trọng và tự nhiên hơn cách dịch thuần cảm xúc như “hạnh phúc”.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: những người chết, là những người ... qua đời trong Chúa
  rationale: Giữ cả danh từ “những người chết” và phân từ mô tả họ; “qua đời” tự nhiên trong tiếng Việt, còn “trong Chúa” bảo toàn chiều rộng thần học của ἐν κυρίῳ.
- source_word: ἀπ’ ἄρτι
  choice: từ nay
  rationale: Diễn đạt gọn và đúng ý mốc thời gian bắt đầu từ hiện tại.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: 'Thánh Linh phán: “Phải”'
  rationale: “Phải” là lời xác nhận dứt khoát; “Thánh Linh” là cách gọi rõ ràng, trang trọng trong tiếng Việt.
- source_word: ἵνα ἀναπαήσονται
  choice: để họ được nghỉ
  rationale: “Để” giữ sắc thái mục đích hoặc kết quả của ἵνα mà không buộc câu theo một cách giải thích duy nhất; “được nghỉ” diễn đạt sự chấm dứt nhọc nhằn.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: khỏi những nhọc nhằn của mình
  rationale: κόπος bao gồm lao nhọc, vất vả và sự mệt mỏi do công việc; “nhọc nhằn” vừa tự nhiên vừa đủ rộng.
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: vì những việc họ làm
  rationale: Diễn đạt ἔργα bằng tiếng Việt hiện đại, tự nhiên, không hàm ý trước về công trạng.
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: đi theo cùng họ
  rationale: Giữ rõ μετά, nghĩa là “cùng với,” thay vì giản lược thành “theo họ”.
theological_decisions:
- issue: Ý nghĩa của “trong Chúa” đối với những người chết
  choice: Giữ nguyên “qua đời trong Chúa.”
  alternative: “qua đời mà vẫn trung tín với Chúa” hoặc “qua đời khi thuộc về Chúa”
  rationale: Bản dịch không thu hẹp cụm từ vào riêng sự trung tín, sự thuộc về hay sự hiệp nhất, vì nguyên văn có thể bao hàm các chiều kích ấy.
- issue: Sắc thái của ἵνα ἀναπαήσονται
  choice: “để họ được nghỉ”
  alternative: “vì họ sẽ được nghỉ” hoặc “hầu cho họ được nghỉ”
  rationale: Cách dịch giữ được độ mở giữa mục đích và kết quả, không giải quyết dứt khoát một cấu trúc Hy Lạp có nét bất thường.
- issue: Mối liên hệ giữa các việc làm và những người được chúc phước
  choice: Nói rằng những việc họ làm “đi theo cùng họ.”
  alternative: Giải thích các việc làm là công trạng đem lại sự cứu rỗi hoặc chỉ là ký ức còn lại sau khi chết.
  rationale: Nguyên văn chỉ khẳng định các việc làm đi cùng họ, không xác định cơ chế hay xây dựng học thuyết về công trạng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phước cho” theo lối chúc phước Kinh Thánh; tránh từ cổ không cần thiết. Các dấu chú thích [a], [b] đều được đặt ngay trong chính văn.
