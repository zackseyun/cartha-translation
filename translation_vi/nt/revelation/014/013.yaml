revisions:
- from: 'Rồi tôi nghe một tiếng từ trời phán: “Hãy viết: Phước cho những người chết, là những người từ nay qua đời trong Chúa.” Thánh Linh phán: “Phải, để họ được nghỉ khỏi những nhọc nhằn của mình[a], vì những việc họ làm đi theo cùng họ[b].”'
  to: 'Rồi tôi nghe một tiếng từ trời phán: “Hãy viết: Phước cho những người chết, là những người từ nay chết trong Chúa.” Thánh Linh phán: “Phải, để họ được nghỉ ngơi khỏi những nhọc nhằn của mình[a], vì những việc họ làm theo họ[b].”'
  rationale: Bản sửa giữ nguyên nội dung và độ mở cú pháp của nguyên văn, đồng thời cải thiện tính tự nhiên của tiếng Việt. “Để họ được nghỉ ngơi” vẫn bảo toàn sắc thái mục đích/kết quả của ἵνα. “Theo họ” là cách Việt ngữ gọn, tự nhiên cho ý các việc làm theo cùng họ; chú thích giữ khả năng diễn đạt rõ nét đồng hành là “đi cùng họ.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của nguyên văn: tiếng từ trời, mệnh lệnh viết, phước cho người chết trong Chúa kể từ nay, lời xác nhận của Thánh Linh, sự nghỉ ngơi khỏi lao nhọc, và các việc làm theo họ. Tuy nhiên, “được nghỉ khỏi” chưa phải cách kết hợp tự nhiên nhất, và “đi theo cùng họ” vừa nặng vừa kém tự nhiên trong tiếng Việt. Cụm “theo họ” trong ngữ cảnh này vẫn diễn đạt đầy đủ ý các việc làm đồng hành/theo sau họ, không cần diễn giải thêm.'
  naturalness: Nên thay “là những người từ nay qua đời trong Chúa” bằng “là những người từ nay chết trong Chúa” để giữ mối quan hệ mô tả của phân từ Hy Lạp rõ ràng hơn và tránh lối nói uyển ngữ hơi làm mờ sự lặp lại có chủ ý của “người chết/chết”. “Nghỉ ngơi khỏi” tự nhiên hơn “nghỉ khỏi”.
  terminology: “Phước cho,” “Chúa,” và “Thánh Linh” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. “Những việc họ làm” là cách dịch tự nhiên của ἔργα và không áp đặt quan điểm về công trạng. Giữ “trong Chúa” là cần thiết để không thu hẹp nghĩa thần học của ἐν κυρίῳ.
  issues:
  - severity: medium
    issue: Cách diễn đạt “được nghỉ khỏi những nhọc nhằn” chưa tự nhiên.
    rationale: ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν nói về sự nghỉ ngơi khỏi/sau lao nhọc; trong tiếng Việt, “nghỉ ngơi khỏi những nhọc nhằn” là kết hợp từ ngữ rõ và tự nhiên hơn.
  - severity: medium
    issue: “Đi theo cùng họ” nặng và không phải cách diễn đạt Việt ngữ tự nhiên.
    rationale: ἀκολουθεῖ μετ’ αὐτῶν xác nhận rằng các việc làm theo hoặc đồng hành với họ. “Theo họ” trong tiếng Việt đã biểu đạt sự đi cùng/theo sau trong ngữ cảnh này; không cần cấu trúc lặp ý “đi theo cùng”.
  - severity: low
    issue: “Qua đời” làm yếu đi sự lặp lại có chủ ý giữa “người chết” và “chết”.
    rationale: Dùng “chết” ở vế mô tả vừa tự nhiên trong văn phong Kinh Thánh trang trọng, vừa phản ánh trực tiếp οἱ νεκροὶ ... ἀποθνῄσκοντες.
  revised_text: 'Rồi tôi nghe một tiếng từ trời phán: “Hãy viết: Phước cho những người chết, là những người từ nay chết trong Chúa.” Thánh Linh phán: “Phải, để họ được nghỉ ngơi khỏi những nhọc nhằn của mình[a], vì những việc họ làm theo họ[b].”'
