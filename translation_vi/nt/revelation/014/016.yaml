    rationale: Dù chính văn đã đúng khi không định danh, chú thích này có trong hồ sơ kiểm tra tiếng Anh và giúp nêu rõ rằng việc đồng nhất với Con Người là suy ra từ văn cảnh, không phải điều câu này phát biểu trực tiếp.
  - severity: low
    issue: Chú thích b dùng “đã bị gặt”, một cách nói kém tự nhiên và hầu như không cung cấp lựa chọn dịch có ích.
