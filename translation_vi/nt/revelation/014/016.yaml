  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: chủ thể được mô tả chứ không được định danh, đám mây xác định, lưỡi liềm, hướng hành động về đất, và kết quả bị động là đất được gặt. Tuy nhiên, “đưa lưỡi liềm ... xuống đất” hơi giảm lực hành động của ἔβαλεν trong ngữ cảnh gặt; “vung” diễn đạt tự nhiên hơn hành động khởi sự gặt mà vẫn không biến động từ thành một diễn giải quá mức.'
  naturalness: Câu sửa giữ văn phong trang trọng, hiện đại và hình ảnh khải huyền rõ ràng. “Vung lưỡi liềm ... xuống đất” tự nhiên hơn “đưa lưỡi liềm ... xuống đất”; “đất đã được gặt” cố ý giữ phép lặp và bị động của nguyên văn, dù là hình ảnh nhân cách hóa/khải huyền.
  terminology: “Lưỡi liềm” và “gặt” là các tương đương chuẩn cho δρέπανον và θερίζω. “Đấng ngồi trên đám mây” bảo toàn tính mô tả của ὁ καθήμενος và không áp đặt danh tính Kitô học. Thêm chú thích về danh tính nhân vật để phản ánh đầy đủ dấu vết kiểm tra tiếng Anh mà không đưa diễn giải vào chính văn.
