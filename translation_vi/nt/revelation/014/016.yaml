id: REV.14.16
reference: Revelation 14:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: vi
  text: Đấng ngồi trên đám mây[c] vung lưỡi liềm của mình xuống đất[a], và đất đã được gặt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quăng lưỡi liềm của mình xuống đất.” Động từ Hy Lạp theo nghĩa đen là “ném/quăng”, nhưng trong cảnh gặt hái này, nó nói đến việc đưa lưỡi liềm vào hành động gặt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và đất đã được thu hoạch.”'
    reason: lexical_alternative
  - marker: c
    text: Người ngồi trên đám mây thường được đồng nhất, dựa vào văn cảnh trước đó, với Con Người; tuy nhiên, câu này chỉ nói “Đấng ngồi trên đám mây.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: đưa ... xuống
  rationale: βάλλω thường có nghĩa là “ném/quăng”, nhưng cùng với “lưỡi liềm” trong cảnh gặt hái, cụm này diễn tả việc đưa lưỡi liềm vào hành động gặt. “Đưa ... xuống” tự nhiên trong tiếng Việt và vẫn giữ hướng chuyển động được ἐπί với đối cách biểu thị.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: Đấng ngồi trên đám mây
  rationale: Giữ cách gọi mô tả của phân từ danh từ hóa, không đưa danh tính được suy ra từ văn cảnh vào chính câu này. “Đấng” phù hợp với văn phong trang trọng và nhân vật siêu việt trong khải tượng.
- source_word: νεφέλης
  choice: đám mây
  rationale: Mạo từ xác định và văn cảnh chỉ lại đám mây đã được nhắc đến ở câu trước; tiếng Việt không cần thêm từ chỉ định nếu tham chiếu đã rõ.
- source_word: δρέπανον
  choice: lưỡi liềm
  rationale: Tương đương thông dụng, rõ nghĩa trong tiếng Việt, giữ nguyên hình ảnh nông nghiệp và phán xét.
- source_word: ἐπὶ τὴν γῆν
  choice: xuống đất
  rationale: ἐπί với đối cách biểu thị hướng tác động về phía mặt đất; cách nói này tự nhiên hơn “trên đất” khi đi với động tác dùng lưỡi liềm.
- source_word: ἐθερίσθη
  choice: đã được gặt
  rationale: Giữ thể bị động và tính hoàn tất của động từ aorist θερίζω; “gặt” là từ tự nhiên, trực tiếp trong tiếng Việt.
- source_word: ἡ γῆ
  choice: đất
  rationale: Trong khung cảnh khải huyền, γῆ có phạm vi rộng là đất/địa cầu. “Đất” vừa tự nhiên vừa duy trì sự lặp lại ý niệm của γῆ.
theological_decisions:
- issue: Danh tính của người gặt ngồi trên đám mây
  choice: Dịch mô tả là “Đấng ngồi trên đám mây”, không nêu đích danh trong chính văn.
  alternative: Nêu rõ là Con Người/Đấng Mê-si; hoặc hiểu là một thiên sứ thi hành mệnh lệnh của Đức Chúa Trời.
  rationale: Bản Hy Lạp của riêng câu này chỉ nói “Đấng ngồi trên đám mây”. Văn cảnh trước đó gợi mạnh đến Con Người, nhưng bản dịch không nên biến sự suy nhận từ văn cảnh thành lời nói trực tiếp của câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc song hành và thể bị động của nguyên văn; không nêu đích danh nhân vật vượt quá lời của câu.
