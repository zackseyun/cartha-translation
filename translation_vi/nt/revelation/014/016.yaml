    rationale: βάλλω theo nghĩa cơ bản là ném/quăng; trong ngữ cảnh dùng lưỡi liềm để gặt, “vung” là cách diễn đạt tiếng Việt tự nhiên hơn cho hành động đưa lưỡi liềm vào việc gặt, đồng thời vẫn giữ hình ảnh cụ thể.
  - severity: low
