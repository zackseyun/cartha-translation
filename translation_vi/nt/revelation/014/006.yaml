id: REV.14.6
reference: Revelation 14:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: vi
  text: Rồi tôi thấy một thiên sứ khác đang bay giữa trời[a], mang một Tin Lành đời đời để công bố cho những người sống trên đất[b], cho mọi nước, mọi bộ tộc, mọi ngôn ngữ và mọi dân tộc,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở giữa bầu trời” hoặc “trên tầng trời cao”; từ Hy Lạp này là một cách nói đặc trưng trong văn chương khải huyền.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “những người ngồi trên đất”; trong sách Khải Huyền, cách nói này được dùng như một thành ngữ chỉ cư dân trên đất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: một thiên sứ khác
  rationale: “Thiên sứ” phù hợp với nhân vật thuộc thiên giới trong bối cảnh khải huyền; “khác” giữ đúng trình tự kể chuyện của ἄλλον.
- source_word: πετόμενον
  choice: đang bay
  rationale: Phân từ hiện tại mô tả hành động đang diễn ra; cách dịch này tự nhiên trong tiếng Việt.
- source_word: ἐν μεσουρανήματι
  choice: giữa trời
  rationale: Diễn đạt vị trí ở khoảng trời cao/trung thiên bằng một cụm từ tự nhiên, đồng thời giữ hình ảnh khải huyền đặc trưng; các khả năng cụ thể hơn được nêu ở chú thích.
- source_word: ἔχοντα
  choice: mang
  rationale: “Mang” diễn đạt tự nhiên việc thiên sứ có sứ điệp để công bố mà không nhất thiết gợi ý đang cầm một vật hữu hình.
- source_word: εὐαγγέλιον αἰώνιον
  choice: một Tin Lành đời đời
  rationale: Giữ thuật ngữ Kitô giáo quen thuộc và sắc thái không xác định của danh ngữ không có mạo từ; “đời đời” truyền đạt tính bền vững vô tận của αἰώνιον.
- source_word: εὐαγγελίσαι
  choice: để công bố
  rationale: Động từ nguyên mẫu chỉ mục đích; “công bố” tránh lặp vụng về với “Tin Lành” mà vẫn giữ ý loan báo công khai.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: cho những người sống trên đất
  rationale: καθημένους theo nghĩa đen là “ngồi”, nhưng trong công thức của Khải Huyền chỉ cư dân trên đất; “sống” truyền đạt chức năng thành ngữ mà không khiến người đọc hiểu là tư thế.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: mọi nước, mọi bộ tộc, mọi ngôn ngữ và mọi dân tộc
  rationale: Giữ đủ bốn thành phần và nhịp liệt kê mang tính toàn cầu; lặp “mọi” làm rõ phạm vi bao quát trong tiếng Việt.
theological_decisions:
- issue: Cách dịch εὐαγγέλιον αἰώνιον bằng thuật ngữ truyền thống hay cách nói khái quát
  choice: một Tin Lành đời đời
  alternative: tin mừng đời đời
  rationale: “Tin Lành” giữ liên hệ thần học và kinh điển của εὐαγγέλιον nhưng không thêm nội dung giáo phái; “một” không biến danh ngữ không có mạo từ thành một danh hiệu xác định.
- issue: Cách hiểu τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: những người sống trên đất
  alternative: những người ngồi trên đất
  rationale: Cách chọn phản ánh thành ngữ chỉ cư dân trên đất trong Khải Huyền, tránh biến hình ảnh thành mô tả tư thế; nghĩa đen được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ liên từ cùng dấu phẩy ở cuối vì câu Hy Lạp còn tiếp sang câu kế tiếp. “Rồi tôi thấy” tạo mạch kể tự nhiên cho Καὶ εἶδον; “giữa trời” tránh lối ghép từ Hán-Việt khó hiểu như “trung thiên”.
