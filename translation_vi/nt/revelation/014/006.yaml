  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố của câu Hy Lạp: thiên sứ «khác», hành động đang bay, vị trí ἐν μεσουρανήματι, việc mang «một Tin Lành đời đời» với mục đích công bố, đối tượng là cư dân trên đất, và công thức bốn thành phần chỉ phạm vi phổ quát. Cấu trúc «cho... cho...» phản ánh thích đáng hai cụm ἐπί được nối bằng καί. Dấu phẩy cuối câu đúng vì câu Hy Lạp tiếp tục sang câu 7.'
