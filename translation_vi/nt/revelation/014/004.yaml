id: REV.14.4
reference: Revelation 14:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: vi
  text: Đây là những người không bị ô uế với phụ nữ[a], vì họ còn đồng trinh. Đây là những người theo Chiên Con bất cứ nơi nào Ngài đi. Họ đã được mua từ giữa loài người, làm của đầu mùa dâng cho Đức Chúa Trời và Chiên Con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu hình ảnh này nói về sự thanh sạch thuộc linh hoặc không bị ô uế bởi việc thờ thần tượng, thay vì chỉ là lời nói theo nghĩa đen về việc kiêng quan hệ tình dục.
    reason: alternative_reading
  - marker: b
    text: “Loài người” ở đây chỉ toàn thể con người nói chung, không riêng nam giới.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: không làm ô uế mình
  rationale: Động từ ở thể bị động mang nghĩa bị ô uế hoặc nhiễm uế, với sắc thái luân lý hay nghi lễ. Cách diễn đạt này tự nhiên trong tiếng Việt và thể hiện trạng thái của họ trong mối liên hệ được nêu.
- source_word: μετὰ γυναικῶν
  choice: với phụ nữ
  rationale: μετά với sở hữu cách có nghĩa là “với”; γυναικῶν ở đây chỉ phụ nữ nói chung, không nhất thiết là vợ.
- source_word: παρθένοι
  choice: những người đồng trinh
  rationale: Giữ nghĩa cụ thể trực tiếp của παρθένος, không diễn giải trước thành “thanh sạch” hay chỉ theo nghĩa biểu tượng.
- source_word: ἀκολουθοῦντες
  choice: theo
  rationale: Phân từ hiện tại diễn tả hành động có tính liên tục và đặc trưng; “theo” truyền đạt tự nhiên trong tiếng Việt.
- source_word: ἀρνίῳ
  choice: Chiên Con
  rationale: Trong Khải Huyền, đây là danh hiệu và hình ảnh chỉ Chúa Giê-su; viết hoa để thể hiện cách dùng như một danh xưng.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: bất cứ nơi nào Ngài đi
  rationale: ὅπου ἄν với giả định cách diễn tả tính bất định, tương đương “bất cứ nơi nào”; “Ngài” phù hợp văn phong tôn kính tiếng Việt.
- source_word: ἠγοράσθησαν
  choice: đã được mua
  rationale: Giữ nguyên ẩn dụ mua chuộc của ἀγοράζω mà không đưa từ diễn giải thần học “cứu chuộc” vào chính văn.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: từ giữa loài người
  rationale: ἀνθρώπων chỉ nhân loại nói chung chứ không riêng nam giới; “từ giữa” truyền đạt ý được chọn ra từ trong cộng đồng loài người.
- source_word: ἀπαρχὴ
  choice: trái đầu mùa
  rationale: ἀπαρχή là phần đầu tiên của mùa màng được biệt riêng để dâng; “trái đầu mùa” giữ hình ảnh mùa gặt và lễ vật quen thuộc trong ngôn ngữ Kinh Thánh.
theological_decisions:
- issue: Cụm “không làm ô uế mình với phụ nữ” và “những người đồng trinh” nên được dịch theo nghĩa cụ thể hay diễn giải như biểu tượng
  choice: Giữ cách nói cụ thể trong chính văn.
  alternative: Hiểu hình ảnh này là sự thanh sạch thuộc linh hoặc không bị ô uế bởi việc thờ thần tượng.
  rationale: Nguyên văn dùng ngôn ngữ cụ thể. Vì Khải Huyền có nhiều hình ảnh biểu tượng nhưng câu này không tự giải thích trực tiếp, bản dịch giữ nguyên sự căng thẳng diễn giải và nêu khả năng biểu tượng trong chú thích.
- issue: Sắc thái của ἀπαρχὴ trong quan hệ với Đức Chúa Trời và Chiên Con
  choice: “để làm trái đầu mùa dâng cho Đức Chúa Trời và Chiên Con”
  alternative: “là những người đầu tiên được cứu cho Đức Chúa Trời và Chiên Con”
  rationale: Giữ hình ảnh lễ vật và mùa gặt của ἀπαρχή, không đồng nhất “trái đầu mùa” với một hệ thống thứ tự cứu rỗi cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các hình ảnh đặc trưng của nguyên văn như “Chiên Con”, “được mua” và “trái đầu mùa”; tránh giải quyết dứt khoát tính biểu tượng của câu.
