  source_fidelity: 'Bản nháp giữ đúng các thành tố chính của nguyên văn: hình ảnh không ô uế với phụ nữ/đồng trinh, việc theo Chiên Con, được mua khỏi loài người, và hình ảnh ἀπαρχή dâng cho Đức Chúa Trời và Chiên Con. Tuy nhiên, “không làm ô uế mình” đổi thể bị động của ἐμολύνθησαν thành hành động chủ động-phản thân; nên giữ cách diễn đạt bị động để sát nguồn hơn. “Trái đầu mùa” có thể hiểu quá cụ thể là sản vật; “của đầu mùa” phù hợp hơn khi quy chiếu đến con người như lễ vật đầu mùa.'
