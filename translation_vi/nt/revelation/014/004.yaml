  terminology: 'Giữ nhất quán các thuật ngữ trọng yếu: “Chiên Con” cho ἀρνίον, “được mua” cho ἠγοράσθησαν, “loài người” cho ἀνθρώπων, và “của đầu mùa” cho ἀπαρχή. Chú thích a tiếp tục nêu khả năng biểu tượng mà không áp đặt cách hiểu; chú thích b bảo toàn nghĩa bao quát về nhân loại của ἀνθρώπων.'
