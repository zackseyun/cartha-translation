id: REV.14.1
reference: Revelation 14:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: vi
  text: Rồi tôi nhìn, và kìa, Chiên Con đứng trên núi Si-ôn; cùng với Ngài có một trăm bốn mươi bốn ngàn người có danh Ngài và danh của Cha Ngài được ghi trên trán họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chỉ ghi: “danh của Cha Ngài được ghi trên trán họ.”'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Rồi tôi nhìn
  rationale: Dùng cách chuyển tiếp tự nhiên trong trình thuật khải tượng, diễn tả sự tiếp nối của điều Giăng nhìn thấy mà không quá sát chữ thành cứng nhắc.
- source_word: ἰδοὺ
  choice: và kìa
  rationale: Giữ sắc thái kêu gọi chú ý và giọng trang trọng của văn khải huyền, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: τὸ ἀρνίον
  choice: Chiên Con
  rationale: Cách gọi quen thuộc và trang trọng dành cho Đấng Christ trong sách Khải Huyền; viết hoa để thể hiện đây là danh xưng.
- source_word: ἑστὸς
  choice: đứng
  rationale: Phân từ hoàn thành diễn tả trạng thái đang đứng; tiếng Việt dùng động từ đơn vẫn truyền đạt tự nhiên trạng thái này.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: trên núi Si-ôn
  rationale: Cách diễn đạt địa danh tự nhiên trong tiếng Việt, đồng thời phiên âm Σιών theo lối quen thuộc.
- source_word: μετ’ αὐτοῦ
  choice: cùng với Ngài có
  rationale: Bổ sung 'có' để tạo vị ngữ tự nhiên cho cụm số lượng theo sau; 'Ngài' phù hợp với lối xưng hô tôn kính dành cho Chiên Con.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: một trăm bốn mươi bốn ngàn người
  rationale: Giữ nguyên con số chính xác; thêm 'người' do giống cái số nhiều của phân từ ἔχουσαι quy chiếu đến một tập thể người và để câu tiếng Việt rõ nghĩa.
- source_word: ἔχουσαι
  choice: trên trán họ có ghi
  rationale: Chuyển cấu trúc phân từ sang mệnh đề tiếng Việt tự nhiên, kết hợp với phân từ bị động γεγραμμένον để diễn tả các danh đã được ghi trên trán.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: danh Ngài và danh Cha Ngài
  rationale: Giữ hai đối tượng được nối song song trong tiếng Hy Lạp, tránh đồng nhất hóa hai danh; 'danh' phù hợp văn phong Kinh Thánh và hàm ý căn tính, quyền sở hữu.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: trên trán họ có ghi
  rationale: Diễn đạt tự nhiên kết quả của hành động đã ghi, đồng thời giữ rõ vị trí trên trán.
theological_decisions:
- issue: Căn tính của τὸ ἀρνίον
  choice: Dịch bằng danh xưng “Chiên Con” mà không thêm lời giải thích.
  alternative: Chiên Con làm sinh tế
  rationale: Ngữ cảnh Khải Huyền xác định đây là Đấng Christ, nhưng câu này không có từ ngữ bổ nghĩa về sinh tế; không nên đưa phần diễn giải thần học vào chính văn.
- issue: Mối quan hệ giữa hai danh
  choice: Giữ “danh Ngài và danh Cha Ngài” như hai thành phần phối hợp.
  alternative: danh Ngài, tức là danh Cha Ngài
  rationale: Bản Hy Lạp dùng καί để nối hai danh, không trình bày chúng như đồng vị; bản dịch giữ cả sự phân biệt lẫn sự liên hệ chặt chẽ mà không giải quyết thay cho nguyên văn.
- issue: Dị bản về dòng chữ trên trán
  choice: 'Theo SBLGNT: “danh Ngài và danh Cha Ngài”.'
  alternative: chỉ “danh Cha Ngài”
  rationale: Chính văn SBLGNT có cả hai danh; dị bản lược bỏ “danh Ngài” làm thay đổi đáng kể nội dung nên được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ từ kêu gọi chú ý “kìa” cùng danh xưng “Chiên Con”; dùng “Ngài” để chỉ Chiên Con và “Cha” viết hoa trong quan hệ thần linh. Dấu chú thích [a] đặt ngay sau câu có dị bản.
