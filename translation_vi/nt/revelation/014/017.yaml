  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: một thiên sứ khác, sự đi ra từ ναός ở trên trời, sự nhấn mạnh rằng vị này «cũng» có liềm, và tính từ «sắc bén». Tuy nhiên, đảo «đi ra từ» tự nhiên hơn và bám rõ quan hệ xuất phát từ đền thờ; dùng dấu phẩy giữ liên kết phân từ «cũng có» với mệnh đề chính sát hơn dấu chấm phẩy và đại từ bổ sung.'
