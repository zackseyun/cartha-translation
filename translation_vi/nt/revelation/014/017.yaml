  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: vi
  text: Một thiên sứ khác đi ra từ đền thờ trên trời[a], cũng có một lưỡi liềm sắc bén.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi thánh trên trời.” Từ Hy Lạp ναός có thể chỉ đền thờ theo nghĩa hẹp hơn, tức nơi thánh hoặc cung thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: một thiên sứ khác
  rationale: Diễn đạt tự nhiên ý về một thiên sứ khác trong chuỗi các nhân vật thiên sứ của khải tượng.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Động từ chỉ sự đi từ bên trong ra ngoài. Tiếng Hy Lạp không tự thân ấn định điểm nhìn là 'đến' hay 'đi'; trong câu tiếng Việt này, 'đi ra' tự nhiên và không thêm điểm nhìn không có trong nguyên bản.
- source_word: ναοῦ
  choice: đền thờ
  rationale: ναός chỉ đền thờ, và có thể cụ thể hơn là nơi thánh bên trong. 'Đền thờ' rõ ràng, quen thuộc trong tiếng Việt; phương án cụ thể hơn được ghi ở chú thích.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Cụm thuộc tính xác định đền thờ ở trên trời; cách diễn đạt này ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἔχων καὶ αὐτὸς
  choice: vị ấy cũng có
  rationale: 'Giữ được điểm nhấn καὶ αὐτός: thiên sứ này cũng có một chiếc liềm, tương ứng với nhân vật trước đó, đồng thời chuyển phân từ thành mệnh đề tự nhiên trong tiếng Việt.'
- source_word: δρέπανον
  choice: một chiếc liềm
  rationale: δρέπανον là dụng cụ gặt hình lưỡi cong; 'liềm' là từ tương đương chuẩn, rõ nghĩa trong bối cảnh thu hoạch.
- source_word: ὀξύ
  choice: sắc bén
  rationale: Truyền đạt trực tiếp đặc tính sắc của chiếc liềm và giữ hình ảnh sinh động của nguyên bản.
theological_decisions:
- issue: Bản chất của hình ảnh đền thờ trên trời
  choice: Dịch ναός là 'đền thờ' mà không diễn giải thêm.
  alternative: Dịch là 'nơi thánh' để nhấn mạnh phần thánh điện bên trong, hoặc diễn ý thành nơi ngự mang tính biểu tượng trên trời.
  rationale: Câu văn trình bày hình ảnh khải huyền về một đền thờ trên trời nhưng không giải thích hình ảnh ấy theo nghĩa kiến trúc, biểu tượng hay phụng tự. Bản dịch giữ nguyên sự rộng mở này và tránh áp đặt một hệ giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thiên sứ' phù hợp văn phong Kinh Thánh tiếng Việt; 'vị ấy' tránh lặp nặng nề mà vẫn tôn trọng nhân vật. Dấu chấm phẩy giúp làm rõ mệnh đề chính và mệnh đề mô tả đi kèm.
