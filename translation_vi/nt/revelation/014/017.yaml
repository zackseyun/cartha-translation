  terminology: Giữ «thiên sứ», «đền thờ», và «trên trời» là phù hợp. Chú thích nên nói rõ ναός có thể mang nghĩa hẹp hơn là «nơi thánh/cung thánh», thay vì cụm «phần thánh điện bên trong của đền thờ», vốn vừa không tự nhiên vừa lặp nghĩa.
