source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: vi
  text: Bồn ép nho bị giẫm ở ngoài thành, và máu chảy ra từ bồn, dâng cao tới hàm thiếc ngựa, suốt một ngàn sáu trăm sta-đi-ôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sta-đi-ôn là một đơn vị đo chiều dài thời xưa; 1.600 sta-đi-ôn tương đương khoảng 296 kilômét.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπατήθη
  choice: bị giẫm đạp
  rationale: Giữ dạng bị động và hình ảnh đạp nho bằng chân của πατέω; tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ληνός / ληνοῦ
  choice: máy ép nho
  rationale: Cách gọi thông dụng, dễ hiểu, đồng thời giữ nguyên hình ảnh thu hoạch và phán xét trong khải tượng.
- source_word: ἔξωθεν τῆς πόλεως
  choice: ở bên ngoài thành
  rationale: Diễn đạt trực tiếp vị trí trong nguyên văn; “thành” phù hợp văn cảnh đô thị cổ và văn phong Kinh Thánh.
- source_word: ἐξῆλθεν αἷμα
  choice: máu từ máy ép nho chảy ra
  rationale: “Chảy ra” diễn đạt tự nhiên chuyển động của máu trong tiếng Việt. Tuy cụ thể hơn nghĩa cơ bản “đi/ra,” đây là nghĩa do ngữ cảnh vật chất đòi hỏi và tránh câu gượng “máu đi ra.”
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: cao đến hàm thiếc của ngựa
  rationale: ἄχρι chỉ giới hạn; thêm “cao” làm rõ đây là mức nước máu đạt tới. χαλινός là bộ phận dùng để điều khiển ngựa, trong hình ảnh này cụ thể là hàm thiếc.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: suốt một ngàn sáu trăm sta-đi-ôn
  rationale: ἀπό cùng khoảng cách ở đây diễn tả phạm vi kéo dài. Giữ đơn vị cổ trong chính văn và giải thích bằng chú thích để tránh áp đặt độ chính xác quy đổi.
theological_decisions:
- issue: Có nên giải nghĩa hình ảnh này như biểu tượng phán xét hoặc làm nhẹ bớt tính dữ dội hay không
  choice: Giữ nguyên hình ảnh cụ thể về máu, hàm thiếc của ngựa và khoảng cách rất lớn
  alternative: Diễn giải thành một lời khái quát về sự phán xét áp đảo
  rationale: Nguyên văn cố ý dùng hình ảnh khải huyền dữ dội; bản dịch không nên giải quyết ý nghĩa biểu tượng hay làm nhẹ sức căng thần học của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “máy ép nho,” “giẫm đạp” và “hàm thiếc” để giữ hình ảnh cụ thể; viết số bằng chữ trong chính văn. Dấu chú thích [a] đặt ngay sau cụm đơn vị mà chú thích giải thích.
