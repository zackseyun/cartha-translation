revisions:
- from: Máy ép nho bị giẫm đạp ở bên ngoài thành, và máu từ máy ép nho chảy ra, cao đến hàm thiếc của ngựa, suốt một ngàn sáu trăm sta-đi-ôn.[a]
  to: Bồn ép nho bị giẫm ở ngoài thành, và máu chảy ra từ bồn, dâng cao tới hàm thiếc ngựa, suốt một ngàn sáu trăm sta-đi-ôn.[a]
  rationale: Sửa “máy ép nho” thành “bồn ép nho” để tái hiện đúng vật thể và hành động trong hình ảnh ληνός/ἐπατήθη. Các chỉnh sửa còn lại chỉ nhằm tăng tính tự nhiên của tiếng Việt, trong khi vẫn giữ nguyên hình ảnh khải huyền mạnh, mức máu tới hàm thiếc ngựa, đơn vị cổ và phạm vi 1.600 sta-đi-ôn. Không thêm giải thích biểu tượng hay xác quyết giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ được trật tự hình ảnh và các yếu tố chính của nguyên văn: bồn ép nho bị động, ở ngoài thành, máu đi ra từ bồn, mức tới hàm thiếc ngựa, và quãng 1.600 sta-đi-ôn. Tuy nhiên, “máy ép nho bị giẫm đạp” gây lệch hình ảnh cổ của ληνός, vì một cái máy không phải vật người ta giẫm để ép nho. “Bồn ép nho” phù hợp hơn với cảnh ép nho bằng chân và vẫn không thêm diễn giải.'
  naturalness: “Bồn ép nho bị giẫm” tự nhiên và nhất quán với bối cảnh cổ hơn “máy ép nho bị giẫm đạp.” “Ngoài thành” gọn và tự nhiên hơn “ở bên ngoài thành.” Cụm “máu ... chảy ra, cao đến” có thể chỉnh thành “máu chảy ra từ bồn, dâng cao tới...” để liên kết rõ mức cao của máu với hàm thiếc ngựa.
  terminology: “Hàm thiếc” là thuật ngữ Việt ngữ có thể dùng cho bộ phận kim loại trong miệng ngựa và phù hợp với hình ảnh χαλινός trong ngữ cảnh này; không cần thay bằng “dây cương,” vốn có thể chỉ toàn bộ dây điều khiển. “Sta-đi-ôn” và chú thích quy đổi được giữ lại.
  issues:
  - severity: medium
    issue: “Máy ép nho bị giẫm đạp” không phù hợp với hình ảnh của ληνός.
    rationale: ληνός là nơi/bồn ép nho, thường được giẫm bằng chân trong hình tượng này; diễn đạt bằng “máy” khiến hành động bị giẫm trở nên không tự nhiên và dễ tạo hình dung hiện đại sai.
  - severity: low
    issue: Cách diễn đạt vị trí và mức cao có thể tự nhiên hơn.
    rationale: “Ngoài thành” là cách nói gọn trong văn phong Kinh Thánh hiện đại; “dâng cao tới” làm rõ quan hệ giữa máu và hàm thiếc mà không tăng nội dung.
  revised_text: Bồn ép nho bị giẫm ở ngoài thành, và máu chảy ra từ bồn, dâng cao tới hàm thiếc ngựa, suốt một ngàn sáu trăm sta-đi-ôn.[a]
