  terminology: “Thịnh nộ” (θυμός) và “giận dữ” (ὀργή) phân biệt hợp lý, không áp đặt một khác biệt thần học cứng nhắc. “Diêm sinh,” “các thiên sứ thánh,” và “Chiên Con” đều phù hợp với thuật ngữ Kinh Thánh tiếng Việt hiện đại và văn cảnh Khải Huyền.
