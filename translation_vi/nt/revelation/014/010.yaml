id: REV.14.10
reference: Revelation 14:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: vi
  text: Chính người ấy cũng sẽ uống rượu thịnh nộ của Đức Chúa Trời, là rượu được pha sẵn nhưng không pha loãng trong chén giận dữ của Ngài,[a] và người ấy sẽ bị hành hạ trong lửa và diêm sinh trước mặt các thiên sứ thánh và trước mặt Chiên Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn ghép ý “được pha sẵn” với “không pha loãng”: rượu được chuẩn bị trong chén nhưng vẫn nguyên sức, không bị làm yếu đi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: thì chính người ấy cũng
  rationale: Đại từ có tính nhấn mạnh và nối lại người vừa được nói đến ở câu trước; “chính người ấy cũng” giữ được cả sắc thái nhấn mạnh lẫn ý bổ sung.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: sẽ uống rượu
  rationale: Diễn đạt tự nhiên trong tiếng Việt; quan hệ với nguồn rượu được hàm chứa đầy đủ trong động từ “uống rượu”.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: thịnh nộ của Đức Chúa Trời
  rationale: “Thịnh nộ” diễn tả cơn giận dữ dội trong bối cảnh phán xét và giúp phân biệt với ὀργή ở vế sau.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: đã được pha mà không pha loãng
  rationale: 'Giữ nghịch hợp có chủ ý của nguyên văn: rượu được chuẩn bị hoặc pha trong chén nhưng không bị pha loãng, nhấn mạnh sự phán xét nguyên sức.'
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: trong chén giận dữ của Ngài
  rationale: Giữ nghĩa thông thường của ἐν là “trong” và phân biệt ὀργή bằng “giận dữ” thay vì lặp lại “thịnh nộ”.
- source_word: βασανισθήσεται
  choice: sẽ chịu đau đớn
  rationale: Truyền đạt sự hành hạ và đau khổ nghiêm trọng do hình phạt, bằng cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: trong lửa và diêm sinh
  rationale: “Diêm sinh” là từ tiếng Việt đã quen thuộc trong văn cảnh Kinh Thánh cho lưu huỳnh cháy; “trong” giữ hình ảnh bao quanh của ἐν.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: trước mặt các thiên sứ thánh và trước mặt Chiên Con
  rationale: Lặp lại “trước mặt” theo nguyên văn để giữ sức nhấn mạnh; “Chiên Con” là danh xưng nhất quán trong sách Khải Huyền.
theological_decisions:
- issue: Phân biệt θυμός và ὀργή trong cùng một câu
  choice: Dịch θυμός là “thịnh nộ” và ὀργή là “giận dữ”
  alternative: Dịch cả hai là “thịnh nộ”, hoặc dịch θυμός là “cơn cuồng nộ” và ὀργή là “thịnh nộ”
  rationale: Nguyên văn dùng hai từ gần nghĩa nhưng khác nhau ở khoảng cách rất gần; dùng hai cách diễn đạt bảo toàn sự phân biệt và sức tu từ mà không áp đặt khác biệt thần học quá mức.
- issue: Nghịch hợp τοῦ κεκερασμένου ἀκράτου
  choice: Giữ trong chính văn là “đã được pha mà không pha loãng”
  alternative: Diễn ý là “được rót nguyên chất” hoặc “được pha nguyên độ”
  rationale: Cách dịch sát giữ được căng thẳng ngôn ngữ thật sự của nguyên văn và hình ảnh rượu được chuẩn bị nhưng không bị làm yếu đi.
- issue: Bản chất và thời lượng của βασανισθήσεται
  choice: Chỉ dịch hành động tương lai bị đau đớn, không thêm thời lượng hay cách giải thích
  alternative: Dịch diễn giải theo một quan niệm cụ thể về hình phạt cuối cùng
  rationale: Câu này khẳng định hình phạt đau đớn nhưng tự nó chưa nêu thời lượng; bản dịch không nên giải quyết trước vấn đề thần học được triển khai trong văn cảnh rộng hơn.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; giữ hình ảnh khải huyền cùng sự lặp lại có chủ ý của nguyên văn.
