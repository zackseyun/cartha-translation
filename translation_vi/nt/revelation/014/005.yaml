  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: vi
  text: Không hề tìm thấy sự dối trá trong miệng họ; họ không chỗ trách được.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không tì vết” hoặc “không có lỗi”; từ Hy Lạp này có thể gợi đến sự tinh sạch của lễ vật hiến tế, đồng thời chỉ tư cách đạo đức không chỗ trách được.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: trong miệng họ
  rationale: Giữ sát hình thức số ít mang nghĩa tập thể của nguyên văn, đồng thời là cách diễn đạt tự nhiên trong văn phong Kinh Thánh tiếng Việt về nội dung lời nói.
- source_word: οὐχ εὑρέθη
  choice: không tìm thấy
  rationale: 'Giữ cấu trúc bị động và trọng tâm của nguyên văn: khi xem xét, không hề thấy điều dối trá nơi lời nói của họ.'
- source_word: ψεῦδος
  choice: lời dối trá
  rationale: Diễn đạt trực tiếp sự giả dối trong lời nói; thêm “lời” làm rõ sự liên hệ với “miệng” mà không chuyển nghĩa sang phẩm chất hay ý đồ lừa gạt nói chung.
- source_word: ἄμωμοί
  choice: những người không chỗ trách được
  rationale: Truyền đạt ý nghĩa đạo đức của từ trong tiếng Việt hiện đại, nhưng vẫn để ngỏ sắc thái “không tì vết” liên quan đến lễ tế qua chú thích.
- source_word: καὶ
  choice: —
  rationale: Không dịch riêng liên từ mở đầu vì câu tiếng Việt đứng độc lập tự nhiên hơn; quan hệ tiếp nối với câu trước vẫn được bảo toàn trong mạch văn.
theological_decisions:
- issue: Diễn đạt ἄμωμοί sao cho giữ được ngôn ngữ về sự thánh sạch mà không khẳng định quá mức rằng họ tuyệt đối vô tội
  choice: không chỗ trách được
  alternative: không tì vết; không có lỗi
  rationale: Từ Hy Lạp có thể chỉ sự không tì vết của lễ vật lẫn tư cách đạo đức không đáng trách. Bản văn chính dùng cách nói tự nhiên về tư cách đạo đức, còn chú thích bảo tồn hình ảnh lễ tế và phương án từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “trong miệng họ không tìm thấy” có sắc thái Kinh Thánh nhưng vẫn rõ nghĩa; “không chỗ trách được” tránh cách hiểu quá mạnh về sự vô tội tuyệt đối.
