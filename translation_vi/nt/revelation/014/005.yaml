  source_fidelity: 'Bản nháp truyền đạt đúng hai mệnh đề của nguyên văn: không có ψεῦδος trong lời nói của họ, và họ là ἄμωμοι. Tuy nhiên, cụm “những người không chỗ trách được” thêm danh từ chỉ người không có trong tiếng Hy Lạp và làm câu kém trực tiếp. Cách “Không hề tìm thấy sự dối trá trong miệng họ” vẫn bảo lưu thể bị động aorist οὐχ εὑρέθη và trọng tâm là sự vắng mặt của điều dối trá.'
  naturalness: “Trong miệng họ không tìm thấy lời dối trá” hiểu được nhưng trật tự từ hơi gượng trong tiếng Việt hiện đại. Đưa động từ bị động lên đầu câu và dùng “sự dối trá” tạo câu tự nhiên, trang trọng, đồng thời không giới hạn ψεῦδος chỉ ở một “lời” cụ thể. “Họ không chỗ trách được” là cách diễn đạt gọn và tự nhiên hơn.
