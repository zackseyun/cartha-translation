id: REV.2.13
reference: Revelation 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: vi
  text: Ta biết ngươi sống ở đâu—nơi có ngai của Sa-tan. Thế nhưng, ngươi vẫn giữ vững danh Ta và không chối bỏ đức tin nơi Ta[a], ngay cả trong những ngày An-ti-pa, nhân chứng của Ta[b], người trung tín của Ta, đã bị giết giữa các ngươi, nơi Sa-tan cư ngụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách dịch “đức tin nơi Ta” hiểu cụm Hy Lạp này theo nghĩa đức tin hướng về Ta. Sát chữ là “đức tin của Ta”; cũng có thể hiểu là “sự thành tín của Ta”.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp được dịch là “nhân chứng” cũng có thể mang nghĩa “người tử đạo”, nhất là trong bối cảnh chịu khổ hoặc bị giết.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Ta biết
  rationale: Diễn đạt trực tiếp động từ hoàn thành mang nghĩa hiện tại; “biết” tự nhiên và chính xác.
- source_word: ποῦ κατοικεῖς
  choice: ngươi sống ở đâu
  rationale: κατοικέω chỉ việc sống hay cư trú tại một nơi; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: nơi ngai của Sa-tan ngự
  rationale: Giữ nguyên hình ảnh khải huyền mạnh mẽ về ngai của Sa-tan; “ngự” phù hợp với hình ảnh ngai mà không giải thích biểu tượng ấy là gì.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: ngươi vẫn giữ vững danh Ta
  rationale: “Giữ vững” thể hiện sự bám giữ và trung thành; “danh Ta” bảo toàn cách nói của nguyên văn thay vì diễn giải thành danh tiếng hay lời xưng nhận.
- source_word: οὐκ ἠρνήσω τὴν πίστιν μου
  choice: không chối bỏ đức tin nơi Ta
  rationale: Trong ngữ cảnh này, cụm từ được hiểu tự nhiên là lòng tin hướng về Đấng Christ. Chú thích bảo lưu cấu trúc sát chữ và những khả năng khác của sở hữu cách μου.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: trong những ngày An-ti-pa
  rationale: Bảo toàn thành ngữ thời gian và tên riêng của nguyên văn, không thêm ý rằng đây nhất thiết là toàn bộ thời đời của An-ti-pa.
- source_word: ὁ μάρτυς μου
  choice: nhân chứng của Ta
  rationale: μάρτυς trước hết có nghĩa là nhân chứng; bối cảnh bị giết làm nổi bật sắc thái tử đạo, được ghi trong chú thích.
- source_word: ὁ πιστός μου
  choice: người trung tín của Ta
  rationale: Giữ πιστός như một thành phần đồng vị riêng, thay vì nhập nó vào danh từ “nhân chứng”.
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: bị giết giữa các ngươi
  rationale: “Bị giết” phản ánh thể bị động của động từ; “giữa các ngươi” thể hiện παρά với tặng cách mà không hàm ý hội thánh là thủ phạm.
- source_word: ὅπου ὁ Σατανᾶς κατοικεῖ
  choice: tại nơi Sa-tan cư ngụ
  rationale: Giữ sự lặp lại có chủ ý của địa điểm và động từ cư trú, đồng thời dùng cách nói trang trọng, tự nhiên.
theological_decisions:
- issue: Ý nghĩa của τὴν πίστιν μου
  choice: đức tin nơi Ta
  alternative: đức tin của Ta; sự thành tín của Ta
  rationale: Sở hữu cách μου có thể được hiểu theo nhiều quan hệ. Trong mạch văn “không chối bỏ”, “đức tin nơi Ta” là cách đọc tự nhiên nhất, nhưng chú thích giữ lại tính cô đọng và các khả năng thần học khác của nguyên văn.
- issue: Sắc thái của μάρτυς trong bối cảnh An-ti-pa bị giết
  choice: nhân chứng
  alternative: người tử đạo
  rationale: Nghĩa căn bản là “nhân chứng”; việc câu văn nói rõ ông bị giết khiến sắc thái “tử đạo” có thể hiện diện mà không cần thay nghĩa căn bản trong chính văn.
- issue: Số ít và số nhiều trong lời phán
  choice: “ngươi” ở các động từ số ít, “các ngươi” ở παρ’ ὑμῖν số nhiều
  alternative: đồng nhất toàn câu thành số ít hoặc số nhiều
  rationale: 'Bảo toàn sự chuyển đổi có ý nghĩa trong nguyên văn: lời được nói với một đối tượng số ít, nhưng An-ti-pa bị giết ở giữa cộng đồng số nhiều.'
translation_notes:
  register: Dùng lối xưng hô “Ta–ngươi” để giữ giọng phán trang trọng và số ít của nguyên văn, đồng thời dùng “các ngươi” tại chỗ nguyên văn chuyển sang số nhiều. Câu văn theo cú pháp tiếng Việt hiện đại nhưng vẫn giữ sắc thái trang nghiêm và hình ảnh khải huyền.
