revisions:
- from: Ta biết ngươi sống ở đâu—nơi ngai của Sa-tan ngự. Thế nhưng, ngươi vẫn giữ vững danh Ta và không chối bỏ đức tin nơi Ta[a], ngay cả trong những ngày An-ti-pa, nhân chứng của Ta[b], người trung tín của Ta, bị giết giữa các ngươi, tại nơi Sa-tan cư ngụ.
  to: Ta biết ngươi sống ở đâu—nơi có ngai của Sa-tan. Thế nhưng, ngươi vẫn giữ vững danh Ta và không chối bỏ đức tin nơi Ta[a], ngay cả trong những ngày An-ti-pa, nhân chứng của Ta[b], người trung tín của Ta, đã bị giết giữa các ngươi, nơi Sa-tan cư ngụ.
  rationale: Sửa “ngai ... ngự” thành “có ngai” để diễn đạt chính xác và tự nhiên mệnh đề tồn tại trong nguyên ngữ. Thêm “đã” để làm rõ mệnh đề quan hệ về An-ti-pa. Chú thích a được chỉnh để bảo lưu tính đa nghĩa của τὴν πίστιν μου mà không tự mâu thuẫn với bản dịch chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch bảo toàn tốt các yếu tố chính của bản Hy Lạp: ngôi số ít ở lời phán và số nhiều trong “giữa các ngươi,” sự lặp lại về nơi Sa-tan cư ngụ, các đồng vị dành cho An-ti-pa, và thể bị động “đã bị giết.” Cách dịch “đức tin nơi Ta” là một cách hiểu có thể chấp nhận được của τὴν πίστιν μου, miễn chú thích tiếp tục bảo lưu các cách hiểu khác. Tuy nhiên, “nơi ngai của Sa-tan ngự” không diễn đạt tự nhiên nghĩa ὅπου ὁ θρόνος τοῦ Σατανᾶ (“nơi có/đặt ngai của Sa-tan”) và dễ khiến “ngự” được hiểu theo nghĩa hành động của một chủ thể.'
  naturalness: “Nơi có ngai của Sa-tan” tự nhiên, rõ nghĩa và vẫn giữ nguyên hình ảnh khải huyền. Việc thêm “đã” trong mệnh đề quan hệ về An-ti-pa làm rõ rằng “bị giết” quy chiếu đến An-ti-pa, tránh chuỗi đồng vị quá nén trong tiếng Việt.
  terminology: “Danh Ta,” “đức tin nơi Ta,” “nhân chứng,” “người trung tín,” và “bị giết” đều phù hợp. Chú thích về πίστις nên được viết lại để không gọi cách dịch chính là một khả năng phụ, đồng thời bảo lưu nghĩa sát chữ và các cách hiểu thay thế. Chú thích về μάρτυς được giữ với neo đặt sau “nhân chứng.”
  issues:
  - severity: medium
    issue: “nơi ngai của Sa-tan ngự”
    rationale: Nguyên ngữ nói “nơi ngai của Sa-tan [ở/hiện diện],” không gán động từ “ngự” cho ngai. Cụm hiện tại gượng và có thể làm lệch cấu trúc hình ảnh.
  - severity: low
    issue: Mệnh đề về An-ti-pa thiếu dấu hiệu quá khứ rõ ràng
    rationale: “An-ti-pa ... người trung tín của Ta, bị giết...” có thể đọc được, nhưng “đã bị giết” phản ánh aorist bị động và giúp mệnh đề quan hệ tiếng Việt rõ, tự nhiên hơn.
  - severity: low
    issue: Cách diễn đạt chú thích a
    rationale: Chú thích hiện nói nguyên văn “cũng có thể được hiểu là ‘đức tin nơi Ta’,” dù đây đã là cách dịch chính. Nên xác định đây là cách dịch đang dùng, rồi nêu sát chữ và các khả năng còn lại.
