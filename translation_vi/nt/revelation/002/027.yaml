  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: vi
  text: và người ấy sẽ chăn dắt họ bằng gậy sắt[a], như những đồ gốm bị đập tan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ cai trị họ bằng gậy sắt.” Động từ này có nghĩa đen là “chăn dắt”, nhưng trong lời ám chỉ Thi Thiên 2, nó cũng hàm ý cai trị mang tính vương quyền.'
    reason: alternative_reading
  - marker: b
    text: Câu này ám chỉ Thi Thiên 2:9, nơi các dân bị đập vỡ như đồ gốm.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ để nối câu này với lời hứa ở câu trước.
- source_word: ποιμανεῖ
  choice: sẽ chăn dắt
  rationale: Giữ nguyên hình ảnh chăn dắt của ποιμαίνω, đồng thời ngữ cảnh vương quyền và cây gậy sắt vẫn gợi ý nghĩa cai trị.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: bằng một cây gậy sắt
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ hình ảnh cây gậy vừa thuộc mục vụ vừa biểu thị quyền lực trong bối cảnh Thi Thiên 2.
- source_word: ὡς
  choice: như
  rationale: Diễn đạt trực tiếp quan hệ so sánh.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: những đồ gốm
  rationale: Tự nhiên và dễ hiểu trong tiếng Việt, bao quát các vật dụng hay bình bằng đất nung mà không thu hẹp quá mức.
- source_word: συντρίβεται
  choice: bị đập tan
  rationale: Truyền đạt sức mạnh của động từ συντρίβω; dùng dạng số nhiều tự nhiên theo chủ ngữ tiếng Việt, thay vì mô phỏng sự hòa hợp ngữ pháp Hy Lạp.
theological_decisions:
- issue: Sự ám chỉ vương quyền-Mê-si trong Thi Thiên 2:9 qua ποιμανεῖ và hình ảnh cây gậy sắt
  choice: Giữ ẩn dụ “chăn dắt” trong chính văn, để ý nghĩa cai trị và phán xét được gợi lên bởi ngữ cảnh.
  alternative: Dịch ποιμανεῖ là “cai trị” để nêu bật quyền thống trị.
  rationale: Bản Hy Lạp dùng động từ ποιμαίνω, nghĩa đen là chăn dắt, chứ không dùng một động từ chung chỉ việc cai trị. Cách dịch này bảo tồn sự căng thẳng giữa chăm sóc mục vụ và thi hành vương quyền.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Người ấy” nối tự nhiên với chủ thể ở câu trước; “đồ gốm” tránh lối diễn đạt cổ và vẫn giữ hình ảnh mong manh của vật bằng đất nung.
