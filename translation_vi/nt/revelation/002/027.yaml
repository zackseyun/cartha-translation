    issue: 'Cách diễn đạt trong chú thích a: “ý nghĩa cai trị của vua.”'
    rationale: Cụm này hơi gượng và có thể được diễn đạt tự nhiên, chính xác hơn là “hàm ý cai trị mang tính vương quyền.”
  - severity: low
    issue: “bằng một cây gậy sắt” có thể rút gọn thành “bằng gậy sắt.”
    rationale: Bản rút gọn tự nhiên hơn trong văn phong Kinh Thánh tiếng Việt và không thêm sắc thái bất định/đơn chiếc không cần thiết.
