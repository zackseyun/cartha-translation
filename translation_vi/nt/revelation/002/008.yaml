id: REV.2.8
reference: Revelation 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: vi
  text: 'Hãy viết cho thiên sứ[a] của hội thánh tại Si-miệc-nơ: “Đấng Đầu Tiên và Đấng Cuối Cùng, Đấng đã chết và đã sống lại[b], phán thế này:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sứ giả”.
    reason: alternative_reading
  - marker: b
    text: Hoặc “đã chết và đã sống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Trong bối cảnh khải huyền của sách Khải Huyền, “thiên sứ” là nghĩa mặc định phù hợp; “sứ giả” vẫn là khả năng từ vựng nên được ghi ở chú thích.
- source_word: ἐκκλησίας
  choice: hội thánh
  rationale: Từ này chỉ cộng đồng Cơ Đốc tại Si-miệc-nơ, vì vậy “hội thánh” chuyển tải rõ hơn nghĩa tôn giáo-cộng đồng so với “hội chúng” hay “hội nghị” chung chung.
- source_word: Τάδε λέγει
  choice: phán thế này
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, đồng thời giữ công thức mở đầu sứ điệp mang tính tiên tri.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Đấng Đầu Tiên và Đấng Cuối Cùng
  rationale: Cụm từ có chức năng như một tước hiệu; thêm “Đấng” và viết hoa giúp câu tự nhiên trong tiếng Việt và thể hiện lực xưng danh mà không diễn giải thêm.
- source_word: ἐγένετο νεκρὸς
  choice: đã chết
  rationale: “Đã chết” là cách nói tự nhiên và chính xác trong tiếng Việt, vẫn thể hiện biến cố bước vào sự chết; dịch sát hình thức như “đã trở nên chết” sẽ gượng gạo.
- source_word: ἔζησεν
  choice: đã sống lại
  rationale: Trong thế đối lập trực tiếp với “đã chết”, “đã sống lại” truyền đạt tự nhiên ý nghĩa trở lại sự sống; chú thích giữ phương án sát hơn là “đã sống”.
theological_decisions:
- issue: Tước hiệu của Đấng Christ và lời nói về sự chết cùng sự sống lại
  choice: Giữ “Đấng Đầu Tiên và Đấng Cuối Cùng” như một tước hiệu, rồi dịch “đã chết và đã sống lại”.
  alternative: “đấng đầu tiên và đấng cuối cùng, là đấng đã chết và đã sống”
  rationale: Bản dịch giữ nguyên lời tự xưng cao trọng và sự tương phản giữa chết với sống, nhưng không thêm lời giải thích tín lý ngoài văn bản.
- issue: Căn tính của ἀγγέλῳ
  choice: thiên sứ
  alternative: sứ giả
  rationale: Ngữ cảnh khải huyền nghiêng về một hữu thể thiên giới, nhưng từ Hy Lạp cũng có thể chỉ sứ giả; sự mơ hồ chính đáng được bảo tồn bằng chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Si-miệc-nơ” là dạng phiên âm quen thuộc trong tiếng Việt; cấu trúc lời truyền “Hãy viết… rằng” và công thức “phán thế này” duy trì nhịp điệu long trọng của nguyên văn.
