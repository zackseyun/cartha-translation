  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố chính: mệnh lệnh viết cho thiên sứ của hội thánh tại Si-miệc-nơ, tước hiệu “Đấng Đầu Tiên và Đấng Cuối Cùng,” cùng sự đối lập chết—sống. “Đã sống lại” là cách chuyển ngữ tự nhiên và phù hợp ngữ cảnh cho ἔζησεν, dù động từ Hy Lạp tự nó chỉ nói “đã sống.”'
  naturalness: Câu hiện có bị rối dấu ngoặc kép do đồng thời đặt toàn bộ câu trong ngoặc kép và lồng thêm một lời trích dẫn. Dùng một dấu hai chấm sau “Si-miệc-nơ” và chỉ một cặp ngoặc kép cho nội dung phải viết sẽ tự nhiên, rõ cấu trúc hơn trong tiếng Việt hiện đại.
  terminology: “Thiên sứ,” “hội thánh,” “Đấng Đầu Tiên và Đấng Cuối Cùng,” và “phán thế này” phù hợp văn phong trang trọng của Khải Huyền. Dạng tên riêng “Si-miệc-nơ” có thể giữ theo lối phiên âm Kinh Thánh Việt ngữ quen dùng. Chú thích b nên được diễn đạt là một phương án thay thế, không gọi “đã chết và đã sống” là bản dịch “sát hơn” của cả cụm, vì phương án ấy chủ yếu không nêu rõ hàm ý sống lại trong ngữ cảnh.
