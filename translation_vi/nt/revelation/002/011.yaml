id: REV.2.11
reference: Revelation 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: vi
  text: Ai có tai, hãy nghe điều Thánh Linh phán với các hội thánh. Người chiến thắng[a] chắc chắn sẽ không bị sự chết thứ hai làm hại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người vượt thắng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “chắc chắn sẽ không bị làm hại từ hoặc bởi sự chết thứ hai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ai có tai
  rationale: Diễn đạt tự nhiên trong tiếng Việt, vẫn giữ hình ảnh số ít của nguyên văn và ý nghĩa đại diện phổ quát.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Truyền đạt mệnh lệnh ngôi thứ ba theo lối khuyến cáo trang trọng, tự nhiên trong tiếng Việt.
- source_word: τί
  choice: điều
  rationale: Trong cấu trúc tiếng Việt, “điều ... phán” diễn đạt tự nhiên nội dung lời Thánh Linh nói.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong điệp khúc Khải Huyền 2–3, từ này chỉ Đấng thần linh đang phán với các hội thánh; “Thánh Linh” là cách gọi rõ ràng và thông dụng trong tiếng Việt.
- source_word: λέγει
  choice: phán
  rationale: “Phán” phù hợp với lời của Đấng thần linh, giữ sắc thái trang trọng mà vẫn quen thuộc.
- source_word: ταῖς ἐκκλησίαις
  choice: với các hội thánh
  rationale: Chỉ các cộng đồng tín hữu được nhắn gửi trong Khải Huyền 2–3; “hội thánh” là cách dịch rõ và chuẩn trong ngữ cảnh.
- source_word: ὁ νικῶν
  choice: Người chiến thắng
  rationale: Giữ hình ảnh thắng trận sống động của νικάω và diễn đạt người có đặc điểm là thắng vượt qua thử thách.
- source_word: οὐ μὴ
  choice: chắc chắn sẽ không
  rationale: Thể hiện phép phủ định nhấn mạnh của οὐ μή với động từ giả định.
- source_word: ἀδικηθῇ
  choice: bị ... làm hại
  rationale: Động từ bị động ở đây nói đến việc chịu tổn hại; cách diễn đạt này tự nhiên hơn “bị đối xử bất công” trong ngữ cảnh sự chết thứ hai.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: bị sự chết thứ hai làm hại
  rationale: Diễn đạt quan hệ nguồn/tác nhân của ἐκ theo cú pháp tiếng Việt tự nhiên, không giải thích quá mức bản chất của sự chết thứ hai.
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: sự chết thứ hai
  rationale: Giữ nguyên thuật ngữ khải huyền có ý nghĩa thần học, không thêm phần diễn giải giáo lý.
theological_decisions:
- issue: Đối tượng được gọi là τὸ πνεῦμα
  choice: Thánh Linh phán với các hội thánh
  alternative: thần linh tiên tri nói theo nghĩa rộng hơn
  rationale: Điệp khúc lặp lại trong Khải Huyền cho thấy đây là Đấng thần linh có thẩm quyền phán với các hội thánh; cách viết “Thánh Linh” phản ánh đối tượng có khả năng nhất.
- issue: Dạng giống đực số ít mang ý nghĩa đại diện
  choice: Dùng “Ai có tai” và “Người chiến thắng”
  alternative: Diễn đạt bằng đại từ số nhiều hoặc một cấu trúc trung tính khác
  rationale: Tiếng Việt không buộc phải đánh dấu giống ngữ pháp; các cấu trúc số ít này giữ được ý nghĩa đại diện của nguyên văn mà không thêm giới tính không có giá trị ngữ nghĩa trong tiếng Việt.
- issue: Ý nghĩa của “sự chết thứ hai”
  choice: Giữ nguyên cụm từ, không diễn giải
  alternative: Giải nghĩa trực tiếp là sự kết án đời đời hoặc sự phán xét cuối cùng
  rationale: Khải Huyền tự triển khai ý nghĩa của cụm từ này ở phần sau; dịch giả không nên đưa một cách giải nghĩa thần học đầy đủ vào chính câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán” giữ sắc thái lời thần linh; “hội thánh” phù hợp ngữ cảnh các cộng đồng tín hữu. Các dấu chú thích [a], [b] đều được đặt trong chính văn tại đúng điểm liên quan.
