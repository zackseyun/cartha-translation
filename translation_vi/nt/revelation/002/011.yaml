  terminology: “Thánh Linh,” “hội thánh,” và “sự chết thứ hai” là các thuật ngữ phù hợp, nhất quán và không áp đặt diễn giải giáo phái. Tuy nhiên, cụm thay thế “Người thắng vượt” trong chú thích a không phải cách dùng tự nhiên của tiếng Việt chuẩn; “Người vượt thắng” là lựa chọn tự nhiên hơn cho sắc thái lexical alternative của ὁ νικῶν.
