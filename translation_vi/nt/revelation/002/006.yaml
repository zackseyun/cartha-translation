id: REV.2.6
reference: Revelation 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: vi
  text: 'Nhưng con có điều này: con ghét những việc làm[a] của phái Ni-cô-la; Ta cũng ghét những việc ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những hành vi.” Từ Hy Lạp chỉ các hành động hoặc cách thực hành.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với lời quở trách trước đó, đồng thời chuyển sang một điểm đáng khen.
- source_word: τοῦτο ἔχεις
  choice: con có điều này
  rationale: Giữ sát thành ngữ Hy Lạp và vị trí nhấn mạnh của τοῦτο, nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι giới thiệu nội dung của “điều này”; dấu hai chấm truyền đạt chức năng ấy rõ ràng và tự nhiên.
- source_word: μισεῖς
  choice: con ghét
  rationale: Giữ nguyên sắc thái mạnh của μισέω và cách xưng hô trực tiếp số ít trong văn cảnh thư gửi hội thánh.
- source_word: τὰ ἔργα
  choice: những việc làm
  rationale: Chỉ các hành động hoặc thực hành của nhóm này; cách dịch không khiến đối tượng bị ghét trở thành chính con người họ.
- source_word: τῶν Νικολαϊτῶν
  choice: của phái Ni-cô-la
  rationale: Dùng tên phiên âm dễ đọc và từ “phái” để biểu thị đây là tên một nhóm người.
- source_word: ἃ
  choice: là những việc
  rationale: Làm rõ đại từ quan hệ giống trung số nhiều quy chiếu về “những việc làm”, tránh khả năng hiểu nhầm là quy chiếu về người thuộc phái Ni-cô-la.
- source_word: κἀγὼ
  choice: Ta cũng
  rationale: Thể hiện καὶ ἐγώ, nhấn mạnh rằng người phán có cùng thái độ đối với các việc làm ấy.
- source_word: μισῶ
  choice: ghét
  rationale: Lặp lại cùng động từ “ghét” như ở vế trước, đúng với sự lặp từ trong nguyên bản.
theological_decisions:
- issue: Đối tượng của sự căm ghét
  choice: Những việc làm của phái Ni-cô-la là đối tượng bị ghét.
  alternative: Cách diễn đạt lỏng hơn có thể khiến người đọc hiểu rằng chính những người thuộc phái ấy bị ghét.
  rationale: τὰ ἔργα là tân ngữ trực tiếp; bản dịch cần bảo toàn sự phân biệt giữa việc lên án hành động và việc ghét con người.
- issue: Sự đồng thuận của Đấng phán với hội thánh
  choice: “là những việc Ta cũng ghét”
  alternative: “mà chính Ta cũng ghét”
  rationale: Giữ trực tiếp sức nặng của κἀγὼ μισῶ mà không thêm sắc thái nhấn mạnh vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con” phù hợp với lời trực tiếp của Đấng Christ nói với thiên sứ đại diện cho hội thánh. Tên nhóm được phiên âm là “phái Ni-cô-la”. Dấu chú thích [a] được đặt ngay sau tên nhóm theo lớp tham khảo tiếng Anh, còn nội dung chú thích giải thích nghĩa của “việc làm”.
