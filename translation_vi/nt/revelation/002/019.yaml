id: REV.2.19
reference: Revelation 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: vi
  text: 'Ta biết các việc làm của ngươi: lòng yêu thương, đức tin[a], sự phục vụ và lòng kiên trì của ngươi. Ta cũng biết rằng những việc làm về sau của ngươi nhiều hơn những việc làm ban đầu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự trung tín.” Từ Hy Lạp ở đây có thể mang nghĩa “đức tin” hoặc “sự trung tín.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Ta biết
  rationale: οἶδα có lực hiện tại, chỉ trạng thái biết. “Ta biết” tự nhiên và phù hợp với công thức được lặp lại trong các lời gửi cho các hội thánh.
- source_word: ἔργα
  choice: các việc làm / những việc làm
  rationale: ἔργα chỉ những hành động cụ thể. Giữ danh từ “việc làm” ở cả hai lần xuất hiện để bảo toàn sự lặp lại và sắc thái đánh giá hành vi.
- source_word: ἀγάπην
  choice: lòng yêu thương
  rationale: ἀγάπη ở đây là đức tính yêu thương được thể hiện tích cực; “lòng yêu thương” tự nhiên trong danh sách các phẩm chất.
- source_word: πίστιν
  choice: đức tin
  rationale: πίστις có thể chỉ đức tin hoặc sự trung tín trong ngữ cảnh này. Bản văn chính dùng “đức tin”, còn nghĩa thay thế được giữ trong chú thích.
- source_word: διακονίαν
  choice: sự phục vụ
  rationale: διακονία ở đây nói đến hoạt động phục vụ, không nhất thiết là một chức vụ chính thức; cách dịch này dễ hiểu và không áp đặt ý niệm về phẩm trật.
- source_word: ὑπομονήν
  choice: lòng kiên trì
  rationale: ὑπομονή diễn tả sự bền bỉ, đứng vững dưới áp lực. “Lòng kiên trì” tự nhiên trong tiếng Việt và phù hợp với danh sách đức tính.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: những việc làm về sau của ngươi
  rationale: ἔσχατα ở đây mang nghĩa thời gian và đối lập với “ban đầu”; “về sau” truyền đạt rõ hơn “cuối cùng” trong tiếng Việt hiện đại.
- source_word: πλείονα τῶν πρώτων
  choice: nhiều hơn những việc làm ban đầu
  rationale: πλείονα có thể nói đến số lượng hoặc mức độ. “Nhiều hơn” giữ độ mở của phép so sánh thay vì xác định rằng các việc làm chỉ tốt hơn hay lớn lao hơn.
theological_decisions:
- issue: Ý nghĩa của πίστις trong danh sách các đức tính
  choice: đức tin
  alternative: sự trung tín
  rationale: Trong ngữ cảnh này, πίστις có thể nói đến lòng tin cậy nơi Đức Chúa Trời/Đấng Christ hoặc sự đáng tin và trung tín được thể hiện qua cách sống. Bản văn chính giữ “đức tin”, còn chú thích bảo toàn cách hiểu kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta—ngươi” giữ sắc thái lời phán có thẩm quyền trong Khải Huyền; cấu trúc được làm tự nhiên cho tiếng Việt nhưng vẫn giữ sự lặp lại của “việc làm” và độ mở của từ so sánh.
