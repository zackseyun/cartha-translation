  to: 'Ta biết các việc làm của ngươi: lòng yêu thương, đức tin[a], sự phục vụ và lòng kiên trì của ngươi. Ta cũng biết rằng những việc làm về sau của ngươi nhiều hơn những việc làm ban đầu.'
