revisions:
- from: 'Nhưng Ta có vài điều trách ngươi: ở đó, ngươi có những kẻ giữ theo lời dạy của Ba-la-am, là kẻ đã dạy Ba-lác đặt cớ vấp ngã trước mặt con cái Y-sơ-ra-ên[a], khiến họ ăn đồ cúng thần tượng và phạm tội gian dâm.'
  to: 'Nhưng Ta có vài điều trách ngươi: ở đó, ngươi có một số người bám giữ lời dạy của Ba-la-am, là kẻ đã dạy Ba-lác đặt một cớ vấp ngã trước mặt con cái Y-sơ-ra-ên[a], khiến họ ăn thức ăn đã dâng cúng cho thần tượng và phạm tội gian dâm.'
  rationale: 'Chỉnh sửa giới hạn ở hai chỗ để tăng độ chính xác từ vựng và độ tự nhiên tiếng Việt: κρατοῦντας được dịch là “bám giữ,” và εἰδωλόθυτα là “thức ăn đã dâng cúng cho thần tượng.” Cấu trúc “khiến họ ăn ... và phạm tội gian dâm” vẫn diễn đạt chức năng của “cớ vấp ngã” mà không áp đặt một cách hiểu giáo phái.'
