id: REV.2.14
reference: Revelation 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: vi
  text: 'Nhưng Ta có vài điều trách ngươi: ở đó, ngươi có một số người bám giữ lời dạy của Ba-la-am, là kẻ đã dạy Ba-lác đặt một cớ vấp ngã trước mặt con cái Y-sơ-ra-ên[a], khiến họ ăn thức ăn đã dâng cúng cho thần tượng và phạm tội gian dâm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “các con trai của Y-sơ-ra-ên”; cũng có thể dịch là “dân Y-sơ-ra-ên.”'
    reason: Bảo tồn cách diễn đạt giống đực theo nguyên văn và nêu cách gọi tập thể tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: ὀλίγα
  choice: vài điều
  rationale: Tính từ trung tính số nhiều được dùng như danh từ; “vài điều” tự nhiên trong tiếng Việt và diễn đạt đúng những điều bị quở trách.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: giữ theo lời dạy
  rationale: κρατέω ở đây chỉ sự bám giữ và trung thành với một giáo huấn, không phải hành động nắm giữ theo nghĩa vật lý.
- source_word: Βαλαάμ / Βαλὰκ
  choice: Ba-la-am / Ba-lác
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: đã dạy Ba-lác
  rationale: Thì chưa hoàn thành gợi hành động trong trình thuật quá khứ; tiếng Việt tự nhiên không bắt buộc đánh dấu diễn tiến, nên “đã dạy” truyền đạt rõ quan hệ hành động.
- source_word: βαλεῖν σκάνδαλον
  choice: đặt cớ vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về việc gây cho người khác sa vào tội lỗi, đồng thời dùng cách nói Kinh Thánh dễ hiểu trong tiếng Việt.
- source_word: ἐνώπιον τῶν υἱῶν Ἰσραήλ
  choice: trước mặt con cái Y-sơ-ra-ên
  rationale: “Trước mặt” phản ánh ἐνώπιον; “con cái Y-sơ-ra-ên” là cách gọi tập thể tự nhiên và quen thuộc trong tiếng Việt cho thành ngữ Híp-ri được Hy Lạp hóa.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: ăn đồ cúng thần tượng
  rationale: Diễn đạt ngắn gọn, rõ ràng loại thực phẩm đã được dâng cúng cho các thần tượng.
- source_word: πορνεῦσαι
  choice: phạm tội gian dâm
  rationale: Diễn đạt hành vi tình dục trái đạo đức với sắc thái luân lý rõ ràng, không thu hẹp quá mức vào một hình thức cụ thể.
theological_decisions:
- issue: Cách hiểu σκάνδαλον
  choice: cớ vấp ngã
  alternative: cạm bẫy; nguyên cớ phạm tội
  rationale: Giữ nguyên ẩn dụ thần học về sự vấp ngã thay vì giải thích hoàn toàn thành sự dụ dỗ phạm tội.
- issue: Cách dịch τῶν υἱῶν Ἰσραήλ
  choice: con cái Y-sơ-ra-ên
  alternative: các con trai của Y-sơ-ra-ên; dân Y-sơ-ra-ên
  rationale: Nguyên văn là “các con trai của Y-sơ-ra-ên,” nhưng đây là danh xưng tập thể truyền thống. “Con cái Y-sơ-ra-ên” vừa gần hình thức nguồn vừa tự nhiên và bao quát trong tiếng Việt; chú thích bảo tồn dạng sát chữ.
- issue: Quan hệ của các động từ nguyên mẫu φαγεῖν và πορνεῦσαι
  choice: khiến họ ăn… và phạm…
  alternative: để ăn… và phạm…
  rationale: Hai động từ giải thích nội dung hay hậu quả của “cớ vấp ngã.” Thêm “khiến họ” làm rõ chủ thể ngầm trong tiếng Việt mà không quyết định sâu hơn về cơ chế dụ dỗ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta/ngươi” duy trì giọng phán có thẩm quyền của Đấng Christ trong văn cảnh Khải Huyền; các tên riêng dùng dạng phiên âm Kinh Thánh quen thuộc.
