  revision_rationale: 'Chỉnh sửa giới hạn ở hai chỗ để tăng độ chính xác từ vựng và độ tự nhiên tiếng Việt: κρατοῦντας được dịch là “bám giữ,” và εἰδωλόθυτα là “thức ăn đã dâng cúng cho thần tượng.” Cấu trúc “khiến họ ăn ... và phạm tội gian dâm” vẫn diễn đạt chức năng của “cớ vấp ngã” mà không áp đặt một cách hiểu giáo phái.'
