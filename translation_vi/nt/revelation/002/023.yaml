id: REV.2.23
reference: Revelation 2:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: vi
  text: Ta sẽ giết con cái nó bằng sự chết[a]. Tất cả các hội thánh sẽ biết rằng Ta là Đấng dò xét lòng dạ và tâm trí[b], và Ta sẽ trả cho từng người trong các ngươi tùy theo việc làm của các ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bằng dịch bệnh”; nguyên văn Hy Lạp nói sát chữ là “bằng sự chết,” một cách diễn đạt có thể nhấn mạnh sự phán xét hoặc gợi lại ngôn ngữ phán xét trong Cựu Ước.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “thận và lòng,” một thành ngữ Kinh Thánh chỉ con người bên trong, bao gồm động cơ, tư tưởng và ước muốn.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: con cái
  rationale: Giữ nghĩa tự nhiên của từ chỉ con cái, đồng thời không quyết định đó là con ruột hay những người theo bà ấy về mặt tinh thần.
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: sẽ giết ... bằng sự chết
  rationale: Giữ cách diễn đạt mạnh và khác thường của nguyên văn, cùng âm hưởng ngôn ngữ phán xét trong Kinh Thánh; cách hiểu cụ thể là dịch bệnh được nêu trong chú thích.
- source_word: ἐκκλησίαι
  choice: các hội thánh
  rationale: Trong sách Khải Huyền, từ này chỉ các cộng đồng Cơ Đốc được sách hướng đến; “hội thánh” là cách gọi rõ ràng và quen thuộc trong tiếng Việt.
- source_word: ὁ ἐραυνῶν
  choice: Đấng dò xét
  rationale: Diễn đạt hành động thấu tra liên tục với sắc thái trang nghiêm và xét đoán.
- source_word: νεφροὺς καὶ καρδίας
  choice: lòng dạ và tâm trí
  rationale: Chuyển thành ngữ nhân học Kinh Thánh sang cách nói tiếng Việt tự nhiên về con người bên trong, gồm động cơ, tư tưởng và ước muốn; nghĩa đen được bảo lưu trong chú thích.
- source_word: δώσω ὑμῖν ἑκάστῳ
  choice: Ta sẽ trả cho từng người trong các ngươi
  rationale: Trong ngữ cảnh xét đoán, “trả cho” truyền đạt ý ban lại hay báo ứng theo việc làm, còn “từng người” giữ sắc thái phân phối của ἑκάστῳ.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: tùy theo việc làm của các ngươi
  rationale: “Việc làm” tự nhiên hơn “công việc” trong công thức xét đoán, đồng thời vẫn phản ánh trực tiếp ἔργα.
theological_decisions:
- issue: Căn tính của Đấng phán là Đấng dò xét con người bên trong
  choice: 'Giữ nguyên lời tự nhận ở ngôi thứ nhất: “Ta là Đấng dò xét lòng dạ và tâm trí.”'
  alternative: Giảm nhẹ thành ý chỉ biết hoặc quan sát nói chung.
  rationale: Nguyên văn trình bày một lời tự nhận mạnh mẽ về quyền thấu biết và xét đoán của Chúa Giê-su phục sinh; bản dịch không làm nhẹ sức nặng thần học này.
- issue: Ý nghĩa của “con cái nó”
  choice: Để ngỏ nghĩa đen hoặc nghĩa bóng trong chính văn.
  alternative: Giải thích rõ là con ruột, hoặc là những môn đồ/người theo bà ấy.
  rationale: Ngữ cảnh có thể hướng đến những người theo nhân vật được gọi là Giê-sa-bên, nhưng nguyên văn không buộc phải chọn riêng một cách hiểu.
translation_notes:
  register: Dùng văn phong hiện đại nhưng trang nghiêm. Đại từ “Ta” và “các ngươi” phù hợp với lời tuyên phán xét trực tiếp, còn “con cái nó” giữ được tham chiếu ngắn gọn của nguyên văn mà không giải thích trước căn tính của những người được nói đến. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
