id: REV.2.16
reference: Revelation 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: vi
  text: Vậy, hãy ăn năn. Nếu không, ta sẽ mau đến với ngươi và dùng thanh gươm của miệng ta[b] mà giao chiến với chúng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát từng chữ là “cùng với chúng”; trong ngữ cảnh “giao chiến”, cụm này mang nghĩa đối địch.
    reason: lexical_alternative
  - marker: b
    text: “Thanh gươm của miệng ta” là hình ảnh khải huyền về lời phán xét có thẩm quyền của Đấng Christ.
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: hãy ăn năn
  rationale: Mệnh lệnh aorist kêu gọi một sự ăn năn dứt khoát. “Ăn năn” là cách diễn đạt ngắn gọn, quen thuộc và giữ được sức nặng đạo đức–thuộc linh của động từ.
- source_word: οὖν
  choice: vậy
  rationale: Nối lời kêu gọi với lời quở trách trước đó theo quan hệ suy luận, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰ δὲ μή
  choice: nếu không
  rationale: Giữ nguyên công thức cảnh báo có điều kiện và sự tương phản rõ rệt; tiếng Việt không cần thêm “nhưng” để diễn đạt tự nhiên.
- source_word: ἔρχομαί σοι
  choice: ta sẽ mau đến với ngươi
  rationale: Dịch hướng đến người nhận bằng “đến với ngươi”, không tự đưa sắc thái “chống lại” vào cụm này. Thì hiện tại Hy Lạp mang sắc thái sắp xảy đến được diễn đạt tự nhiên bằng tương lai gần trong tiếng Việt.
- source_word: ταχύ
  choice: mau
  rationale: Giữ được khả năng chỉ cả sự sớm xảy ra lẫn tính nhanh chóng, bất ngờ, mà không thu hẹp nghĩa quá mức.
- source_word: πολεμήσω
  choice: giao chiến
  rationale: Giữ hình ảnh quân sự mạnh của πολεμέω và trang trọng hơn “đánh nhau”, nhưng vẫn dễ hiểu.
- source_word: μετ’ αὐτῶν
  choice: với chúng
  rationale: Trong kết cấu đi với “giao chiến”, “với chúng” tự nhiên mang nghĩa đối địch trong tiếng Việt, đồng thời bám sát nghĩa thông thường của μετά với sở hữu cách mà không gây cảm tưởng liên minh.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: dùng thanh gươm
  rationale: Diễn đạt giá trị công cụ của ἐν bằng cấu trúc tiếng Việt tự nhiên “dùng… mà”.
- source_word: ῥομφαίᾳ
  choice: thanh gươm
  rationale: Giữ hình ảnh khải huyền rõ ràng mà không thêm một loại gươm cụ thể ngoài điều văn bản đòi hỏi.
- source_word: τοῦ στόματός μου
  choice: của miệng ta
  rationale: Giữ quan hệ sở hữu theo hình thức của cụm sở hữu cách Hy Lạp và không làm phẳng hình ảnh thành “lời ta”.
theological_decisions:
- issue: Hành động bị đe dọa của Đấng Christ đối với hội thánh và những người sai phạm
  choice: Giữ sự phân biệt giữa việc Ngài đến “với ngươi” và giao chiến “với chúng”.
  alternative: Hiểu rằng Ngài đến chống lại toàn thể hội thánh không phân biệt, hoặc chỉ đến với những kẻ sai phạm mà không liên quan đến hội thánh.
  rationale: Đại từ số ít σοι hướng đến người nhận mang tính tập thể, còn αὐτῶν chỉ nhóm người bị giao chiến. Bản dịch giữ cả hai vế và không giải quyết thay sự căng thẳng trong văn bản.
- issue: Phương tiện phán xét trong hình ảnh khải huyền
  choice: Giữ nguyên hình ảnh “thanh gươm của miệng ta”.
  alternative: Diễn giải thành “lời ta” hoặc “quyền năng của lời phán ta”.
  rationale: Nguyên văn dùng một hình ảnh sống động, có chủ ý trong sách Khải Huyền. Giữ ẩn dụ bảo toàn sức nặng văn chương và thần học, thay vì thu hẹp nó vào một lời giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “ta—ngươi” giữ giọng phán uy nghiêm của Đấng Christ và cách xưng hô số ít trong nguyên văn. Cấu trúc câu ngắn nhằm bảo toàn tính cấp bách của lời cảnh báo.
