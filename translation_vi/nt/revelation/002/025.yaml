- from: Tuy nhiên[a], hãy giữ vững điều các con đang có cho đến khi Ta đến.
  to: Nhưng[a] hãy giữ vững điều anh em đang có cho đến khi Ta đến.
  rationale: Đổi “Tuy nhiên” thành “Nhưng” để phản ánh ngắn gọn lực đối lập/giới hạn của πλὴν; đổi “các con” thành “anh em” để phản ánh ngôi số nhiều hướng đến hội thánh mà không thêm quan hệ con cái. Những thành phần còn lại giữ đúng tính mệnh lệnh, nội dung chưa xác định của ὃ ἔχετε, và sự mơ hồ có chủ ý về cuộc đến của Đấng Christ.
