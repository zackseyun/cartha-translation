  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: vi
  text: Nhưng[a] hãy giữ vững điều anh em đang có cho đến khi Ta đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chỉ cần giữ vững điều anh em đang có cho đến khi Ta đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Tuy nhiên
  rationale: Diễn đạt tự nhiên sắc thái đối lập hoặc giới hạn của từ Hy Lạp trong mạch văn; chú thích giữ lại khả năng hiểu là “Chỉ cần”.
- source_word: ὃ ἔχετε
  choice: điều các con đang có
  rationale: Đại từ quan hệ trung tính cùng động từ ἔχετε nói khái quát về điều cộng đoàn hiện có; “đang có” làm rõ trạng thái hiện tại mà không xác định nội dung vượt quá nguyên văn.
- source_word: κρατήσατε
  choice: hãy giữ vững
  rationale: Truyền đạt sức mạnh mệnh lệnh của κρατέω và ý kiên trì nắm giữ, bằng cách nói trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἄχρι οὗ ἂν
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên giới hạn thời gian hướng đến một biến cố trong tương lai.
- source_word: ἥξω
  choice: Ta đến
  rationale: Giữ ý đến/hiện diện của ἥκω và không xác định đây là lần đến cuối cùng hay một cuộc viếng thăm để phán xét. Đại từ “Ta” phù hợp lời của Đấng Christ trong văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Lời Chúa Giê-xu nói về sự đến cuối cùng hay về việc Ngài đến xét đoán/viếng thăm hội thánh này
  choice: cho đến khi Ta đến
  alternative: cho đến khi Ta đến xét đoán; cho đến ngày Ta trở lại cuối cùng
  rationale: Nguyên văn không xác định tính chất hoặc thời điểm của việc đến; bản dịch vì thế giữ nguyên sự mở về thần học thay vì giải nghĩa ngay trong câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “các con” vì lời được Đấng Christ trực tiếp phán với cộng đoàn; dùng “Ta” cho người nói. Cấu trúc ngắn gọn giữ sắc thái khích lệ nhưng cấp thiết của mệnh lệnh.
