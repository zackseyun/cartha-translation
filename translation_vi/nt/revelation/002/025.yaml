review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh số nhiều κρατήσατε, đối tượng khái quát “điều ... có”, và mốc thời gian tương lai “cho đến khi Ta đến”. Tuy nhiên, “các con” thêm một quan hệ con cái không có trong đại từ số nhiều hàm ẩn của tiếng Hy Lạp; trong lời gửi cả hội thánh, “anh em” trung tính và sát ngữ cảnh hơn.
  naturalness: Câu ngắn gọn, tự nhiên và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Nhưng” diễn đạt πλὴν trực tiếp, tự nhiên hơn “Tuy nhiên” trong câu mệnh lệnh ngắn này.
  terminology: Giữ “Ta” cho lời của Đấng Christ và “anh em” cho tập thể người nhận tạo cách xưng hô trang trọng, nhất quán, không áp đặt quan hệ gia đình cụ thể. “Giữ vững” diễn đạt thích đáng κρατήσατε; “Ta đến” giữ mở tính chất cuộc đến như nguyên văn.
  issues:
  - severity: medium
    issue: “các con” được thêm vào làm người nhận
    rationale: Nguyên văn chỉ có ngôi thứ hai số nhiều trong κρατήσατε, không có danh từ hay cách xưng hô tương đương “các con”. Cách gọi này dễ hàm ý quan hệ con cái và thu hẹp/diễn giải giọng điệu của lời phán. “Anh em” là cách gọi cộng đoàn tự nhiên hơn mà không thêm ý đó.
  revised_text: Nhưng[a] hãy giữ vững điều anh em đang có cho đến khi Ta đến.
  revised_footnotes:
