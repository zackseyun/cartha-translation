    issue: “ăn trái cây sự sống, là cây”
    rationale: Bản dịch thay “cây sự sống” (ξύλον τῆς ζωῆς) bằng “trái cây sự sống,” rồi lại gọi đối tượng ấy là “cây,” gây lỗi cú pháp và làm mờ thuật ngữ liên văn bản “cây sự sống.”
  - severity: medium
    issue: “nơi phước lạc” cho παραδείσῳ
    rationale: Đây là diễn giải khái niệm hơn là dịch thuật ngữ. “Thiên đàng” phản ánh trực tiếp hơn “paradise” trong ngữ cảnh cánh chung mà không thu hẹp thành một định nghĩa về phước lạc.
  - severity: low
    issue: Chú thích “Người nào thắng vượt qua”
    rationale: Cụm từ không tự nhiên trong tiếng Việt hiện đại. “Người nào vượt thắng” là phương án từ vựng rõ ràng, tương ứng với “overcomes.”
