id: REV.2.7
reference: Revelation 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: vi
  text: Ai có tai, hãy nghe điều Thánh Linh phán với các hội thánh. Người nào chiến thắng[a], Ta sẽ cho người ấy được ăn từ cây sự sống, là cây ở trong thiên đàng của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người nào vượt thắng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ai có tai
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp ở số ít, đồng thời giữ nguyên hình ảnh ‘tai’ trong lời kêu gọi lắng nghe.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Giữ lực mệnh lệnh của thể mệnh lệnh aorist ngôi thứ ba mà không cần thêm đại từ giới tính trong tiếng Việt.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong điệp khúc Khải Huyền 2–3, từ này chỉ Thánh Linh đang phán với các hội thánh; cách gọi này tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: phán với các hội thánh
  rationale: ‘Phán’ phù hợp với lời nói có thẩm quyền thần thượng trong ngữ cảnh; ‘các hội thánh’ phản ánh số nhiều và nghĩa ngữ cảnh của ἐκκλησίαις.
- source_word: τῷ νικῶντι
  choice: Người nào chiến thắng
  rationale: Giữ sắc thái thắng trận của νικάω và hình ảnh xung đột xuyên suốt sách Khải Huyền.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: Ta sẽ cho người ấy ăn
  rationale: Phản ánh cả đại từ gián tiếp αὐτῷ lẫn động từ nguyên mẫu φαγεῖν bằng một cấu trúc tiếng Việt tự nhiên.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: trái cây sự sống
  rationale: Trong tiếng Việt, ‘ăn trái cây sự sống’ tự nhiên hơn ‘ăn từ cây’; danh xưng ‘cây sự sống’ vẫn được giữ nguyên để bảo toàn liên hệ với Sáng Thế Ký và Khải Huyền.
- source_word: παραδείσῳ
  choice: nơi phước lạc
  rationale: Truyền đạt một nơi vườn phước hạnh thuộc thực tại thần thượng, tránh khiến độc giả hiểu đây chỉ là một khu vườn bình thường.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Diễn đạt trực tiếp sở thuộc cách Hy Lạp và dùng danh xưng trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ bởi τὸ πνεῦμα
  choice: Thánh Linh
  alternative: thần linh
  rationale: Công thức lặp lại trong Khải Huyền 2–3 trình bày đây là Đấng phán lời thần thượng với các hội thánh.
- issue: Cách dịch νικάω trong lời hứa
  choice: chiến thắng
  alternative: thắng vượt qua
  rationale: ‘Chiến thắng’ giữ rõ hình ảnh thắng trận của từ Hy Lạp; phương án thay thế nhấn mạnh việc vượt qua thử thách nhưng kém gọn và ít tự nhiên hơn.
- issue: Đại từ của người phán trong δώσω
  choice: Ta
  alternative: tôi
  rationale: ‘Ta’ phù hợp giọng phán trang trọng của Đấng Christ trong ngữ cảnh, nhưng không thêm danh tính vào chính câu này.
- issue: Quan hệ giữa việc ăn và cây sự sống
  choice: ăn trái cây sự sống
  alternative: ăn từ cây sự sống
  rationale: Bản Hy Lạp nói sát là ‘ăn từ cây sự sống’; tiếng Việt cần nêu vật được ăn là trái cây để câu tự nhiên. Điều này không giải thích thêm bản chất của cây hay lời hứa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu giữ nhịp của lời kêu gọi mang tính công thức; câu sau giữ lời hứa trực tiếp. Dùng ‘hội thánh’, ‘Thánh Linh’ và ‘Đức Chúa Trời’ theo lối dùng phổ thông trong Kinh Thánh tiếng Việt.
