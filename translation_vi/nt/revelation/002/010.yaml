    rationale: βάλλω có thể diễn tả hành động quăng/bỏ vào, nhưng “bỏ ... vào tù” tự nhiên hơn trong tiếng Việt trang trọng mà không thêm sắc thái thô bạo.
  - severity: low
    issue: “Một số người trong các con” hơi nặng nề.
    rationale: “Một số anh em” diễn đạt tự nhiên hơn ý ἐξ ὑμῶν (“một số trong anh em/các con”) trong lời nói với cộng đồng.
