id: REV.2.10
reference: Revelation 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: vi
  text: Đừng sợ những điều con sắp phải chịu. Kìa, ma quỷ sắp bỏ một số anh em vào tù để anh em bị thử thách[a], và anh em sẽ chịu hoạn nạn trong mười ngày. Hãy trung tín cho đến chết[b], rồi Ta sẽ ban cho con vòng hoa sự sống[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để anh em bị thử nghiệm” hoặc “để anh em bị cám dỗ”; động từ Hy Lạp có thể chỉ sự thử nghiệm, thử thách hoặc cám dỗ, tùy văn cảnh.
    reason: lexical_alternative
  - marker: b
    text: “Cho đến chết” cũng có thể hiểu là “đến mức phải chết,” tức là vẫn trung tín ngay cả khi phải chịu tử đạo.
    reason: alternative_reading
  - marker: c
    text: Từ Hy Lạp chỉ “vòng hoa” (stephanos) nói đến vòng hoa hoặc phần thưởng của người chiến thắng, không phải vương miện hoàng gia.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định với μηδέν cấm sự sợ hãi; cách diễn đạt này tự nhiên, trực tiếp trong tiếng Việt hiện đại.
- source_word: ἃ μέλλεις πάσχειν
  choice: những điều con sắp phải chịu
  rationale: Giữ được tân ngữ số nhiều ἃ, sắc thái cận kề của μέλλω và nghĩa chịu đau khổ của πάσχω.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Tiểu từ thu hút sự chú ý; “Kìa” trang trọng vừa phải và tự nhiên trong văn cảnh mặc khải.
- source_word: μέλλει βάλλειν ... εἰς φυλακήν
  choice: sắp tống ... vào tù
  rationale: “Tống vào tù” chuyển tải tự nhiên động tác mạnh của βάλλω cùng kết quả là bị giam giữ, còn “sắp” giữ sắc thái cận kề của μέλλω.
- source_word: ὁ διάβολος
  choice: ma quỷ
  rationale: Trong văn cảnh, từ này chỉ kẻ thù siêu nhiên mang tính ngôi vị; “ma quỷ” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt.
- source_word: ἐξ ὑμῶν
  choice: một số người trong các con
  rationale: Diễn đạt rõ rằng chỉ một bộ phận trong cộng đồng sẽ bị bắt giam.
- source_word: ἵνα πειρασθῆτε
  choice: để các con bị thử thách
  rationale: πειράζω có thể chỉ thử nghiệm, thử thách hoặc cám dỗ. Trong bối cảnh tù đày và hoạn nạn, “bị thử thách” phù hợp nhất mà vẫn giữ thể bị động.
- source_word: ἕξετε θλῖψιν
  choice: các con sẽ chịu hoạn nạn
  rationale: “Hoạn nạn” giữ sức nặng của θλῖψις trong sách Khải Huyền; động từ “chịu” tự nhiên hơn cấu trúc sát chữ “có hoạn nạn”.
- source_word: ἡμερῶν δέκα
  choice: trong mười ngày
  rationale: Diễn đạt tự nhiên sở hữu cách chỉ khoảng thời gian kéo dài.
- source_word: γίνου πιστός
  choice: Hãy trung tín
  rationale: Diễn đạt mệnh lệnh bước vào và tiếp tục ở trong trạng thái πιστός, đồng thời giữ lời kêu gọi ngắn gọn.
- source_word: ἄχρι θανάτου
  choice: cho đến chết
  rationale: Giữ cách nói trực tiếp của nguyên văn, có thể bao hàm cả sự trung tín suốt đời lẫn trung tín đến mức phải chết.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: mão triều thiên của sự sống
  rationale: Giữ hình ảnh phần thưởng chiến thắng của στέφανος và kết cấu sở hữu cách, vốn có thể gợi chiếc mão được đặc trưng bởi hoặc ban sự sống.
theological_decisions:
- issue: Ý nghĩa của πειρασθῆτε khi ma quỷ gây ra tù đày và bách hại
  choice: bị thử thách
  alternative: bị thử nghiệm; bị cám dỗ
  rationale: Bối cảnh nghiêng về cuộc thử thách chứng nghiệm lòng trung tín, nhưng động từ vẫn có thể mang nghĩa cám dỗ; chú thích bảo tồn độ rộng ngữ nghĩa ấy.
- issue: Phạm vi ý nghĩa của ἄχρι θανάτου
  choice: cho đến chết
  alternative: đến mức phải chết; ngay cả khi phải chết
  rationale: Cách dịch chính không giới hạn câu chỉ vào tử đạo, nhưng vẫn để ngỏ và chú thích rõ khả năng trung tín ngay cả khi cái chết là hậu quả.
- issue: Hình ảnh στέφανος
  choice: mão triều thiên
  alternative: vòng hoa chiến thắng; mão của người chiến thắng
  rationale: Cách gọi chính trang trọng và quen thuộc, còn chú thích phân biệt στέφανος là vòng/mão vinh dự dành cho người chiến thắng chứ không phải vương miện hoàng gia.
translation_notes:
  register: 'Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con/các con” phản ánh lời trực tiếp của Đấng Christ với cộng đồng: số ít ở lời nói với thiên sứ/người đại diện của hội thánh và số nhiều khi nói đến các thành viên. Dấu chú thích được đặt ngay sau cụm từ tương ứng; thứ tự [a], [b], [c] thống nhất với nội dung chú thích.'
