revisions:
- from: Đừng sợ những điều con sắp phải chịu. Kìa, ma quỷ sắp tống một số người trong các con vào tù để các con bị thử thách[a], và các con sẽ chịu hoạn nạn trong mười ngày. Hãy trung tín cho đến chết[b], rồi Ta sẽ ban cho con mão triều thiên của sự sống[c].
  to: Đừng sợ những điều con sắp phải chịu. Kìa, ma quỷ sắp bỏ một số anh em vào tù để anh em bị thử thách[a], và anh em sẽ chịu hoạn nạn trong mười ngày. Hãy trung tín cho đến chết[b], rồi Ta sẽ ban cho con vòng hoa sự sống[c].
  rationale: Bản sửa thay các cách diễn đạt hơi gượng bằng tiếng Việt tự nhiên hơn, đồng thời đổi “mão triều thiên” thành “vòng hoa” để thể hiện chính xác sự phân biệt ngữ nghĩa giữa στέφανος và vương miện hoàng gia. Các đại từ số ít và số nhiều vẫn được giữ theo nguyên văn, và mọi dấu chú thích vẫn neo đúng cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:31:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc số ít/số nhiều của nguyên văn: lời mở đầu, mệnh lệnh trung tín và lời hứa cuối cùng hướng đến người nhận số ít; phần nói về tù đày, thử thách và hoạn nạn hướng đến cộng đồng số nhiều. “Sắp,” “bị thử thách,” và “trong mười ngày” chuyển tải tốt μέλλω, πειρασθῆτε, và ἡμερῶν δέκα. Tuy nhiên, “mão triều thiên” dễ gợi vương miện hoàng gia, trong khi στέφανος là vòng/mão phần thưởng của người chiến thắng, không phải διάδημα.'
  naturalness: Văn phong nhìn chung trang trọng, rõ ràng và phù hợp tiếng Việt hiện đại trong văn cảnh Kinh Thánh. “Một số người trong các con” và đặc biệt “tống ... vào tù” hơi gượng hoặc khẩu ngữ; “một số anh em” và “bỏ ... vào tù” tự nhiên hơn mà vẫn giữ đúng nghĩa.
  terminology: Nên dịch τὸν στέφανον τῆς ζωῆς là “vòng hoa sự sống” để phân biệt rõ với vương miện hoàng gia, phù hợp với chú thích văn hóa. “Ma quỷ” có thể giữ nguyên như danh xưng quen thuộc trong ngữ cảnh này. Chú thích về πειράζω và ἄχρι θανάτου bảo tồn các khả năng nghĩa cần thiết.
