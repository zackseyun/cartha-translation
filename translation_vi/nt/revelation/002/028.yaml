id: REV.2.28
reference: Revelation 2:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: vi
  text: cũng như chính Ta đã nhận từ Cha Ta; và Ta sẽ ban cho người ấy ngôi sao mai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “ngôi sao lúc bình minh.” Hình ảnh này có thể gợi đến vương quyền của Đấng Mê-si và cũng có thể báo trước Khải Huyền 22:16, nơi Chúa Giê-su tự xưng là “ngôi sao mai sáng chói.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: cũng như chính Ta
  rationale: “Cũng như” thể hiện quan hệ đối chiếu với lời hứa ở câu trước; “chính Ta” giữ sắc thái nhấn mạnh của κἀγώ mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἴληφα
  choice: đã nhận
  rationale: Diễn đạt hành động tiếp nhận đã hoàn tất và còn hiệu lực trong ngữ cảnh; “nhận” phù hợp hơn “lấy” vì nguồn ban được nêu rõ là Cha.
- source_word: παρὰ τοῦ πατρός μου
  choice: từ Cha Ta
  rationale: παρά với sở hữu cách chỉ nguồn gốc; cách dịch này giữ nguyên quan hệ phụ tử được văn bản nói rõ mà không thêm diễn giải thần học.
- source_word: καὶ δώσω αὐτῷ
  choice: và Ta sẽ ban cho người ấy
  rationale: Giữ rõ thì tương lai và liên từ; “ban cho” phù hợp với ngữ cảnh lời hứa, còn “người ấy” quy chiếu về người chiến thắng ở phần trước.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: ngôi sao mai
  rationale: Đây là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, giữ nguyên hình ảnh biểu tượng mà không xác định thay cho tác giả ý nghĩa của biểu tượng ấy.
theological_decisions:
- issue: Danh tính và ý nghĩa của “ngôi sao mai”
  choice: Giữ nguyên hình ảnh “ngôi sao mai” trong chính văn.
  alternative: Giải thích đó là Đấng Christ, biểu tượng vương quyền Mê-si, hoặc phần thưởng vinh quang thời sau cùng.
  rationale: Câu này không trực tiếp định nghĩa biểu tượng. Giữ nguyên ẩn dụ bảo toàn tính đa nghĩa và mối liên hệ nội tại có thể có với Khải Huyền 22:16.
- issue: Quan hệ của Đấng Christ với Cha trong cụm “từ Cha Ta”
  choice: Dịch trực tiếp là “từ Cha Ta” mà không thêm lời giải thích.
  alternative: Bổ sung rằng đây là thẩm quyền được ủy giao hoặc giải thích theo một mô hình thần học về công cuộc cứu chuộc.
  rationale: Bản dịch phản ánh đúng quan hệ phụ tử và hành động tiếp nhận được văn bản nêu ra, đồng thời tránh đưa hệ thống thần học vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán của Đấng Christ trong văn mạch. Dấu chấm phẩy giữ mối liên kết cú pháp với lời hứa ở câu trước, đồng thời giúp câu trích riêng vẫn dễ đọc.
