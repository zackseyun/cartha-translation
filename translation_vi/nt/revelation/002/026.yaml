    rationale: Liên từ καὶ ở đây đơn giản là “và”; không có yếu tố đối lập rõ ràng để biện minh cho “Còn”.
  - severity: low
    issue: “Các công việc của ta” dễ gợi nghĩa nhiệm vụ hay công tác.
    rationale: τὰ ἔργα μου là “các việc làm/works của Ta”; quan hệ của “Ta” với các việc ấy được để mở. “Các việc làm của Ta” bảo toàn sự để ngỏ này tốt hơn.
