language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: vi
  text: Và người nào chiến thắng và giữ các việc làm của Ta cho đến cuối cùng, Ta sẽ ban cho người ấy thẩm quyền trên các dân tộc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các việc làm của Ta” có thể chỉ những việc làm thuộc về hoặc phù hợp với Chúa Giê-su—những việc Ngài làm, những mục đích của Ngài, hoặc những việc Ngài đòi hỏi; tiếng Hy Lạp không xác định cụ thể hơn mối quan hệ này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: người chiến thắng
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ người có đặc trưng là thắng vượt. “Chiến thắng” giữ được hình ảnh xung đột mạnh mẽ xuyên suốt sách Khải Huyền.
- source_word: ὁ τηρῶν
  choice: giữ
  rationale: τηρέω có thể mang nghĩa giữ, tuân giữ hoặc canh giữ. “Giữ” bảo tồn độ rộng nghĩa và không thu hẹp thành chỉ vâng lời.
- source_word: ἄχρι τέλους
  choice: cho đến cuối cùng
  rationale: Diễn đạt tự nhiên ý bền lòng tới điểm kết thúc.
- source_word: τὰ ἔργα μου
  choice: các công việc của ta
  rationale: Giữ nguyên quan hệ sở hữu không được xác định rõ trong tiếng Hy Lạp, thay vì diễn giải thành các mệnh lệnh hay việc làm cho Chúa Giê-su.
- source_word: δώσω αὐτῷ
  choice: ta sẽ ban cho người ấy
  rationale: “Ban” phù hợp với việc trao thẩm quyền; “người ấy” chuyển tải số ít đại diện một cách tự nhiên trong tiếng Việt mà không hàm ý chỉ nam giới.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Chỉ quyền được trao hay quyền cai trị, chính xác hơn từ rộng nghĩa “quyền năng” trong ngữ cảnh này.
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: trên các dân tộc
  rationale: ἐπί với sở hữu cách ở đây diễn tả quyền cai trị; ἔθνη nói đến các dân tộc hơn là riêng dân ngoại đối lập với người Do Thái.
theological_decisions:
- issue: Ngôn ngữ giống đực số ít mang tính đại diện
  choice: Dùng “người ấy” ở số ít
  alternative: Dùng đại từ chỉ nam “ông ấy” hoặc chuyển sang số nhiều
  rationale: Tiếng Hy Lạp dùng hình thức giống đực số ít theo nghĩa đại diện. “Người ấy” giữ số ít mà không khiến độc giả Việt hiểu sai rằng lời hứa chỉ dành cho nam giới.
- issue: Ý nghĩa của “các công việc của ta”
  choice: Giữ cụm “các công việc của ta”
  alternative: “những điều ta truyền” hoặc “những việc làm cho ta”
  rationale: Sở thuộc cách trong nguyên văn không xác định cụ thể đây là việc Chúa Giê-su làm, việc phù hợp với Ngài, hay việc Ngài đòi hỏi; bản dịch không tự ý giải quyết sự đa nghĩa ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” cho lời của Đấng Christ theo sắc thái có thẩm quyền; dùng “người ấy” để giữ cấu trúc số ít đại diện. Dấu phẩy cuối câu của bản trích nguồn được chuyển thành dấu chấm vì câu được trình bày độc lập.
