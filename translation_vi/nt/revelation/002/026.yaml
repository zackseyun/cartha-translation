revisions:
- from: Còn người chiến thắng và giữ các công việc của ta cho đến cuối cùng, ta sẽ ban cho người ấy thẩm quyền trên các dân tộc.[a]
  to: Và người nào chiến thắng và giữ các việc làm của Ta cho đến cuối cùng, Ta sẽ ban cho người ấy thẩm quyền trên các dân tộc.[a]
  rationale: Sửa liên từ đầu câu để phản ánh καὶ mà không thêm ý đối lập; dùng cấu trúc “người nào ... và ...” cho tự nhiên và rõ hai hành động cùng quy chiếu; thay “công việc” bằng “việc làm” để gần τὰ ἔργα hơn và duy trì tính mơ hồ của sở thuộc cách. Dấu neo chú thích vẫn gắn ngay sau cụm “các dân tộc” theo bản nháp, vì chú thích giải thích cụm “các việc làm của Ta” trong toàn câu; nếu chuẩn biên tập yêu cầu neo sát từ được chú giải, có thể đặt [a] sau “Ta”.
  reviewer_model: gpt-5.6-terra
