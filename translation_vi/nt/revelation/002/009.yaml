  to: Ta biết nỗi gian truân của con, cảnh nghèo khó của con—nhưng con giàu có—và lời vu khống[a] từ những kẻ tự xưng là người Do Thái nhưng không phải, mà là hội đường của Sa-tan[b].
  rationale: 'Bản sửa chỉ thực hiện các điều chỉnh an toàn: chuyển dấu neo chú thích a về đúng thuật ngữ được chú giải; bỏ “thật ra” để không thêm sắc thái ngoài nguyên văn; và dùng cấu trúc liệt kê trực tiếp, tự nhiên cho ba điều được nói là Đấng Christ “biết”. Không thêm cách giải thích về căn tính sắc tộc hay ý nghĩa thuộc linh của sự giàu có.'
