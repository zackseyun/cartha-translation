    rationale: Chú thích a giải thích βλασφημίαν/lời vu khống, không giải thích mệnh đề về những người tự xưng là người Do Thái; cần chuyển dấu neo để liên kết minh bạch và đúng đối tượng.
  - severity: low
    issue: Cụm “mà thật ra không phải” thêm từ “thật ra”.
    rationale: καὶ οὐκ εἰσίν chỉ nói “và không phải/không là”; “thật ra” làm tăng sắc thái đối lập không cần thiết. Bỏ cụm này giúp sát nguyên văn hơn mà vẫn tự nhiên.
