id: REV.2.9
reference: Revelation 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: vi
  text: Ta biết nỗi gian truân của con, cảnh nghèo khó của con—nhưng con giàu có—và lời vu khống[a] từ những kẻ tự xưng là người Do Thái nhưng không phải, mà là hội đường của Sa-tan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lời vu khống” cũng có thể dịch là “lời phạm thượng” hoặc “lời lăng mạ.” Ở đây, ngữ cảnh nói đến lời lẽ thù nghịch nhằm bôi nhọ các tín hữu.
    reason: lexical_alternative
  - marker: b
    text: “Hội đường” dịch sát từ Hy Lạp συναγωγή, từ này cũng có thể có nghĩa là “hội chúng” hoặc “cuộc tụ họp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: nỗi gian truân
  rationale: Diễn đạt tình cảnh chịu áp lực, khốn khó hoặc bách hại bằng tiếng Việt tự nhiên, trang trọng, không gợi một thuật ngữ cánh chung chuyên biệt.
- source_word: πτωχείαν
  choice: cảnh nghèo khó
  rationale: Truyền đạt trực tiếp tình trạng nghèo về vật chất, đồng thời tạo thế tương phản rõ với “giàu có”.
- source_word: πλούσιος
  choice: giàu có
  rationale: Giữ nguyên nghịch lý sắc nét với cảnh nghèo khó và không tự ý thêm nghĩa “thuộc linh” vốn chỉ được hàm ý trong ngữ cảnh.
- source_word: βλασφημίαν
  choice: lời vu khống
  rationale: Trong ngữ cảnh này, từ chỉ lời lẽ thù nghịch nhằm bôi nhọ các tín hữu; “vu khống” tránh khiến độc giả hiện đại mặc nhiên hiểu là lời phạm thượng trực tiếp chống lại Đức Chúa Trời.
- source_word: ἐκ τῶν λεγόντων
  choice: từ những kẻ tự xưng
  rationale: “Từ” giữ ý nguồn phát sinh của lời vu khống; “tự xưng” diễn đạt tự nhiên cấu trúc nói chính mình là người Do Thái mà không thêm tiêu chuẩn xác thực ngoài câu.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: là người Do Thái
  rationale: Dịch trực tiếp danh xưng Ἰουδαίους, không thay bằng một cách diễn giải thần học như “dân thật của Đức Chúa Trời”.
- source_word: συναγωγὴ
  choice: hội đường
  rationale: Giữ tính đặc thù lịch sử và tôn giáo của συναγωγή; chú thích nêu nghĩa rộng hơn là hội chúng hoặc cuộc tụ họp.
- source_word: τοῦ Σατανᾶ
  choice: của Sa-tan
  rationale: Giữ sát sở hữu cách và sức nặng luận chiến của nguyên văn mà không làm dịu hay diễn giải thêm.
theological_decisions:
- issue: Cách dịch lời luận chiến về những người tự xưng là người Do Thái nhưng không phải
  choice: Giữ nguyên “người Do Thái” và sự phủ định như nguyên văn, không thêm “thật” hay chuyển thành một cách nói về dân Đức Chúa Trời.
  alternative: những người tự xưng là người Do Thái thật; những người tự nhận là dân Đức Chúa Trời
  rationale: Ἰουδαίους được nói rõ trong nguyên văn. Bản dịch cần bảo toàn căng thẳng thần học của lời tuyên bố nhưng không biến nó thành lời phủ nhận sắc tộc hoặc bổ sung một tiêu chuẩn thần học không được phát biểu.
- issue: Có nên nói rõ sự giàu có là về thuộc linh hay không
  choice: Để nguyên “nhưng con giàu có” mà không thêm định ngữ.
  alternative: nhưng con giàu có về thuộc linh
  rationale: Ngữ cảnh hàm ý một loại giàu có không phải vật chất, nhưng nguyên văn không dùng từ tương đương với “thuộc linh”; thêm vào sẽ biến điều hàm ý thành lời khẳng định minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta/con” phù hợp lời Đấng Christ phán với vị sứ giả của hội thánh trong văn mạch. Dấu gạch ngang giữ phần xen vào có tính nghịch lý. Các chú thích được đặt ngay sau những cụm từ liên quan.
