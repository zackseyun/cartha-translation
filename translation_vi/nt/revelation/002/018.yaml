id: REV.2.18
reference: Revelation 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: vi
  text: 'Hãy viết cho thiên sứ[a] của Hội Thánh tại Thyatira rằng: Đây là lời phán của Con Đức Chúa Trời, Đấng có đôi mắt như ngọn lửa rực cháy và đôi chân tựa đồng sáng bóng[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả”.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp ở đây rất hiếm; có thể chỉ chung một loại kim loại hoặc hợp kim đã được tinh luyện và phát sáng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Trong công thức mở đầu lặp lại ở các thư trong Khải Huyền, “thiên sứ” phù hợp nhất với bối cảnh khải huyền; nghĩa “sứ giả” vẫn có thể có và được ghi ở chú thích.
- source_word: ἐκκλησίας
  choice: Hội Thánh
  rationale: Chỉ cộng đồng Cơ Đốc tại Thyatira; “Hội Thánh” là cách diễn đạt tự nhiên, trang trọng và quen thuộc trong tiếng Việt hiện đại.
- source_word: Τάδε λέγει
  choice: Đây là lời phán của
  rationale: Giữ sắc thái của công thức tuyên phán trang trọng, đồng thời tự nhiên hơn lối dịch sát chữ “Những điều này phán rằng”.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Chuyển tải trực tiếp tước hiệu chỉ quan hệ làm Con và quy chiếu thần linh, không diễn giải giảm nhẹ.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: đôi mắt như ngọn lửa
  rationale: Giữ phép so sánh và hình ảnh khải huyền của nguyên văn; trong tiếng Việt, “ngọn lửa” đã diễn đạt tự nhiên ý φλόγα πυρός.
- source_word: πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: đôi chân tựa đồng sáng bóng
  rationale: “Tựa” giữ phép so sánh; “đồng sáng bóng” diễn đạt hình ảnh kim loại tinh luyện, rực sáng mà không khẳng định quá mức thành phần chính xác của thuật ngữ hiếm χαλκολίβανον.
theological_decisions:
- issue: Tước hiệu Cơ Đốc học trong lời tự xưng
  choice: Con Đức Chúa Trời
  alternative: không diễn giải thành một tước hiệu chức năng khác
  rationale: Nguyên văn gọi trực tiếp người phán là ὁ υἱὸς τοῦ θεοῦ; bản dịch giữ nguyên nội dung và sức nặng của tước hiệu này.
- issue: Đối tượng được gọi là ἀγγέλῳ
  choice: thiên sứ
  alternative: sứ giả
  rationale: “Thiên sứ” phù hợp với văn cảnh khải huyền và công thức gửi thư lặp lại, nhưng “sứ giả” là khả năng từ vựng thực sự nên được bảo lưu trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Hãy viết… rằng” cho mệnh lệnh mở đầu, “lời phán” để giữ âm hưởng tuyên ngôn, và viết hoa “Hội Thánh” theo quy ước phổ biến trong văn bản Kinh Thánh tiếng Việt. Các dấu chú thích được đặt ngay sau đúng từ ngữ mà chúng giải thích.
