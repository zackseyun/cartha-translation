revisions:
- from: '“Hãy viết cho thiên sứ[a] của Hội Thánh tại Thyatira rằng: ‘Đây là lời phán của Con Đức Chúa Trời, Đấng có đôi mắt như ngọn lửa và đôi chân tựa đồng sáng bóng[b]:’”'
  to: 'Hãy viết cho thiên sứ[a] của Hội Thánh tại Thyatira rằng: Đây là lời phán của Con Đức Chúa Trời, Đấng có đôi mắt như ngọn lửa rực cháy và đôi chân tựa đồng sáng bóng[b]:'
  rationale: Chỉnh cách trình bày dấu câu và ngoặc kép để câu mệnh lệnh cùng công thức lời phán rõ ràng, tự nhiên hơn trong tiếng Việt. Điều chỉnh nhẹ hình ảnh «ngọn lửa» thành «ngọn lửa rực cháy» để phản ánh đầy đủ hơn φλόγα πυρός. Giữ nguyên các lựa chọn thuật ngữ chính và các chú thích, trong đó chú thích b bảo lưu bất định từ vựng của χαλκολίβανον.
