id: REV.2.20
reference: Revelation 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: vi
  text: 'Nhưng Ta có điều này chống lại ngươi: ngươi dung túng người đàn bà Giê-sa-bên[a], kẻ tự xưng là nữ tiên tri[b], dạy dỗ và lừa dối[c] các nô lệ của Ta, khiến họ phạm tội dâm dục và ăn thức ăn đã cúng tế cho các thần tượng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép ghi “vợ ngươi, Giê-sa-bên” thay cho “người đàn bà Giê-sa-bên”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “kẻ nhận mình là nữ tiên tri”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “dẫn đi lạc”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản rõ với lời khen ở phần trước và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔχω κατὰ σοῦ
  choice: Ta có điều này trách ngươi
  rationale: Chuyển tải thành ngữ chỉ lời khiển trách hoặc cáo buộc; cách diễn đạt trang trọng, rõ nghĩa.
- source_word: ἀφεῖς
  choice: ngươi dung túng
  rationale: Trong ngữ cảnh, động từ chỉ việc để cho một ảnh hưởng tai hại tiếp diễn; “dung túng” giữ được sắc thái người nghe phải chịu trách nhiệm.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: người đàn bà Giê-sa-bên
  rationale: Bám sát bản văn chính “người đàn bà Giê-sa-bên”, không đưa dị bản “vợ ngươi” vào chính văn.
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: kẻ tự xưng là nữ tiên tri
  rationale: Giữ rõ đây là địa vị do chính người ấy tự nhận và bảo toàn giống cái được biểu thị trong προφῆτιν.
- source_word: διδάσκει
  choice: dạy dỗ
  rationale: Thể hiện hành động đang diễn ra hoặc mang tính thường xuyên; “dạy dỗ” tự nhiên trong ngữ cảnh tôn giáo.
- source_word: πλανᾷ
  choice: lừa dối
  rationale: Diễn đạt việc khiến người khác lìa khỏi chân lý hay đường ngay; sắc thái “dẫn đi lạc” được ghi ở chú thích.
- source_word: τοὺς ἐμοὺς δούλους
  choice: các nô lệ của Ta
  rationale: Giữ sắc thái thuộc quyền và thuộc về Đấng Christ của δοῦλος, dù “đầy tớ” là cách diễn đạt mềm và quen thuộc hơn trong tiếng Việt.
- source_word: πορνεῦσαι
  choice: phạm tội vô luân về tình dục
  rationale: Diễn đạt phạm vi rộng của hành vi tình dục trái phép, tránh thu hẹp nghĩa thành riêng tội ngoại tình.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: ăn thức ăn đã cúng cho thần tượng
  rationale: Cách diễn đạt rõ và tự nhiên cho thức ăn gắn với việc hiến tế cho các thần tượng.
theological_decisions:
- issue: Căn tính của “Giê-sa-bên”
  choice: Giữ nguyên tên gọi Giê-sa-bên mà không xác định đó là tên thật hay một danh xưng mang tính biểu tượng.
  alternative: Hiểu là một phụ nữ thật mang tên Giê-sa-bên, hoặc là tên biểu tượng gợi đến Giê-sa-bên trong Cựu Ước.
  rationale: Câu này không tự giải quyết vấn đề căn tính; bản dịch giữ nguyên sự mở về mặt giải thích.
- issue: Cách dịch δοῦλος
  choice: các nô lệ của Ta
  alternative: các đầy tớ của Ta
  rationale: Đại từ sở hữu ἐμοὺς nhấn mạnh sự thuộc về Đấng Christ; “nô lệ” bảo toàn rõ hơn sức nặng về quyền sở hữu và lòng quy phục của từ nguồn.
- issue: Quan hệ giữa lời dạy, sự lừa dối và hai hành vi
  choice: Dịch “dạy dỗ và lừa dối… khiến họ…”
  alternative: 'Dịch sát cấu trúc hơn: “dạy dỗ và lừa dối… để họ…”'
  rationale: “Khiến họ” thể hiện tự nhiên rằng hai động từ dẫn đến các hành vi được nêu, nhưng không xác định thêm động cơ hay mức độ cưỡng ép.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, dùng cặp đại từ “Ta—ngươi” phù hợp lời phán trực tiếp trong văn chương Khải Huyền. Tên Giê-sa-bên theo lối phiên âm Kinh Thánh quen thuộc; câu văn vẫn giữ sức nặng khiển trách của nguyên bản.
