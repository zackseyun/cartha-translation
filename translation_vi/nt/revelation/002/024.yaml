id: REV.2.24
reference: Revelation 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: vi
  text: 'Nhưng với những người còn lại ở Thy-a-ti-ra, Ta nói: tất cả những ai không theo lời dạy này và chưa biết đến “những điều sâu xa của Sa-tan,” như họ nói—Ta không đặt thêm gánh nặng nào khác lên anh em.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς λοιποῖς
  choice: những người còn lại
  rationale: Diễn đạt nhóm tín hữu còn lại, đối lập với những người theo lời dạy bị lên án; cách nói này giữ rõ ý phân biệt của nguyên văn.
- source_word: ἐν Θυατείροις
  choice: tại Thy-a-ti-ra
  rationale: Phiên âm địa danh theo cách quen dùng trong tiếng Việt, đồng thời dùng “tại” cho văn phong tự nhiên.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: giữ theo lời dạy này
  rationale: Trong ngữ cảnh, ἔχω chỉ việc tiếp nhận và gắn bó với một lời dạy, không đơn thuần là sở hữu; “giữ theo” vừa tự nhiên vừa tránh diễn giải quá mức.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: chưa biết đến
  rationale: Giữ ý họ chưa bước vào hoặc trải nghiệm thứ tri thức được nói đến, nhưng không xác định cụ thể bản chất của việc “biết”.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: những điều sâu nhiệm của Sa-tan
  rationale: Giữ hình ảnh về những điều “sâu” và sắc thái có thể mang tính mỉa mai đối với lời tuyên bố về tri thức thuộc linh sâu xa.
- source_word: ὡς λέγουσιν
  choice: như họ nói
  rationale: Bám sát cách diễn đạt cô đọng của tiếng Hy Lạp, không xác định quá mức ai là chủ thể của lời gọi này hay lời ấy mang sắc thái trích dẫn hay mỉa mai.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: Ta không đặt thêm gánh nặng nào khác trên anh em
  rationale: “Đặt ... trên” chuyển tải thành ngữ βάλλω ἐπί, còn “gánh nặng” giữ nguyên hình ảnh về một nghĩa vụ được áp đặt.
theological_decisions:
- issue: Ý nghĩa và chủ thể của cụm “những điều sâu nhiệm của Sa-tan, như họ nói”
  choice: Giữ cách diễn đạt như một danh xưng được thuật lại, có thể mang sắc thái mỉa mai, mà không xác định ai đã đặt toàn bộ danh xưng ấy.
  alternative: Những giáo sư giả tự nhận có tri thức “sâu nhiệm,” còn Giăng xác định nguồn của nó là Sa-tan; hoặc toàn bộ cụm từ là cách gọi mỉa mai được thuật lại.
  rationale: Cú pháp Hy Lạp cô đọng và cho phép nhiều cách hiểu về phạm vi của lời được dẫn cũng như chủ thể của “họ nói.” Bản dịch bảo tồn sự căng thẳng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời phán của Đấng Christ trong ngữ cảnh; “anh em” được dùng theo nghĩa tập thể. Dấu ngoặc kép cho thấy tính chất được thuật lại của cụm từ nhưng không giải quyết sự mơ hồ vốn có.
