revisions:
- from: 'Nhưng Ta nói với những người còn lại tại Thy-a-ti-ra, tức là tất cả những ai không giữ theo lời dạy này và chưa biết đến “những điều sâu nhiệm của Sa-tan,” như họ nói[a]: Ta không đặt thêm gánh nặng nào khác trên anh em.'
  to: 'Nhưng với những người còn lại ở Thy-a-ti-ra, Ta nói: tất cả những ai không theo lời dạy này và chưa biết đến “những điều sâu xa của Sa-tan,” như họ nói—Ta không đặt thêm gánh nặng nào khác lên anh em.'
  rationale: Bản sửa làm cho tiếng Việt gọn và tự nhiên hơn, thay cách diễn đạt có phần diễn giải bằng từ ngữ sát hơn với βαθέα, và giữ nguyên sự mơ hồ có chủ ý của ὡς λέγουσιν. Dấu ngoặc kép chỉ đánh dấu cụm từ được thuật lại/được tranh luận, không xác định ai là người gọi như vậy.
