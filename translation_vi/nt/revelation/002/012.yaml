  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: vi
  text: 'Hãy viết cho thiên sứ của hội thánh tại Bẹt-găm rằng: “Đây là lời phán của Đấng có thanh gươm sắc, hai lưỡi:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả” thay cho “thiên sứ”. Có những cách hiểu khác nhau về việc từ này chỉ một thiên sứ trên trời hay một người đại diện cho hội thánh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Từ này có thể chỉ thiên sứ trên trời hoặc sứ giả. “Thiên sứ” là cách dùng quen thuộc trong Khải Huyền và giữ được sự chưa xác định về đối tượng; nghĩa “sứ giả” được nêu trong chú thích.
- source_word: ἐκκλησίας
  choice: hội thánh
  rationale: Trong bối cảnh Cơ Đốc của sách Khải Huyền, từ này chỉ cộng đồng tín hữu; “hội thánh” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: γράψον
  choice: Hãy viết
  rationale: Thể mệnh lệnh được chuyển trực tiếp bằng “Hãy viết”; nội dung phải viết được dẫn ngay sau đó.
- source_word: Τάδε λέγει
  choice: Đây là lời phán của
  rationale: Cách diễn đạt trang trọng, tự nhiên trong tiếng Việt, đồng thời giữ chức năng của công thức tuyên bố mang tính tiên tri và vương quyền.
- source_word: ὁ ἔχων
  choice: Đấng có
  rationale: Danh hóa phân từ này tạo thành một tước hiệu mô tả. “Đấng có” vừa gọn, trang trọng, vừa không bổ sung danh tính ngoài văn bản.
- source_word: ῥομφαίαν
  choice: thanh gươm
  rationale: Từ Hy Lạp chỉ một loại gươm, có thể là gươm lớn; “thanh gươm” đủ chính xác mà không đặc tả quá mức.
- source_word: δίστομον
  choice: hai lưỡi
  rationale: Nghĩa đen là “hai miệng”, là thành ngữ chỉ gươm có hai lưỡi. “Hai lưỡi” là cách nói tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: ὀξεῖαν
  choice: sắc
  rationale: Tính từ mô tả thanh gươm là sắc bén; “sắc” ngắn gọn và tự nhiên.
- source_word: Περγάμῳ
  choice: Pẹt-găm
  rationale: Dùng dạng phiên âm tiếng Việt dễ đọc cho địa danh Πέργαμος, thay vì dạng tiếng Anh.
theological_decisions:
- issue: Danh tính của “thiên sứ” thuộc hội thánh
  choice: Giữ “thiên sứ” trong chính văn, không xác định đó là hữu thể trên trời hay người đại diện.
  alternative: “sứ giả”, có thể được hiểu là người đưa tin hoặc lãnh đạo hội thánh
  rationale: ἄγγελος cho phép cả nghĩa thiên sứ lẫn sứ giả, còn câu này không giải quyết danh tính của đối tượng. Chính văn và chú thích cùng bảo toàn sự mơ hồ có thật trong nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Công thức “Đây là lời phán của” được chọn thay cho lối dịch cứng theo trật tự Hy Lạp. Dấu phẩy trong “thanh gươm sắc, hai lưỡi” giúp hai đặc tính cùng bổ nghĩa rõ ràng cho “thanh gươm”.
