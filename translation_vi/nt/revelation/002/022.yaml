revisions:
- from: Này, ta sẽ quăng nó lên giường[a], còn những kẻ ngoại tình với nó thì ta sẽ quăng vào cảnh khốn khổ lớn[b], nếu họ không ăn năn mà từ bỏ những việc làm của nó.
  to: Này, Ta sẽ ném bà ấy lên giường[a], và ném những kẻ ngoại tình với bà ấy vào cơn hoạn nạn lớn[b], trừ khi họ ăn năn, từ bỏ những việc làm của bà ấy.
  rationale: Bản sửa giữ nguyên tính mơ hồ có chủ ý của κλίνη («giường») và chiều kích literal/biểu tượng của «ngoại tình». Sửa cấu trúc điều kiện để phản ánh chính xác ἐὰν μὴ… ἐκ («trừ khi họ ăn năn, từ bỏ…»), dùng cách diễn đạt tự nhiên hơn cho θλῖψις μεγάλη, và điều chỉnh từ ngữ cho văn phong Việt ngữ chuẩn, trang trọng.
  reviewer_model: gpt-5.6-terra
