review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp nhìn chung phản ánh đúng các thành tố của SBLGNT: mệnh lệnh gây chú ý, hành động phán xét, «giường» theo nghĩa đen, người ngoại tình với bà ấy, «hoạn nạn lớn», và điều kiện ăn năn khỏi các việc của bà ấy. Tuy nhiên, «nếu họ không ăn năn mà từ bỏ» đảo cách diễn đạt của điều kiện và có thể bị hiểu là họ phải đồng thời không ăn năn và không từ bỏ; cần diễn đạt trực tiếp «trừ khi họ ăn năn, từ bỏ…».'
  naturalness: «Cảnh khốn khổ lớn» không tự nhiên trong tiếng Việt chuẩn và kém sát cụm θλῖψιν μεγάλην. «Cơn hoạn nạn lớn» là cách nói tự nhiên, trang trọng, và sát nghĩa hơn. «Ném» phù hợp văn phong Kinh Thánh hiện đại hơn «quăng», vốn có sắc thái khẩu ngữ. Dùng «bà ấy» để chỉ nhân vật nữ đã được xác định trong văn cảnh tự nhiên hơn «nó», vốn có thể gây cảm giác phi nhân hóa không do đại từ Hy Lạp tự nó đòi hỏi.
  terminology: Giữ «ngoại tình», «ăn năn», và «việc làm» là phù hợp. «Hoạn nạn lớn» dịch trực tiếp θλῖψις μεγάλη mà không buộc nó thành một thuật ngữ cánh chung chuyên biệt. Chú thích giữ «giường bệnh» như một khả năng diễn giải, không đưa vào chính văn.
  issues:
  - severity: medium
    issue: Cấu trúc điều kiện «nếu họ không ăn năn mà từ bỏ»
    rationale: ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς có nghĩa «trừ khi họ ăn năn/từ bỏ các việc của bà ấy». Cách dùng «nếu ... không ... mà ...» trong bản nháp mơ hồ về quan hệ phủ định và phối hợp của hai động từ.
  - severity: medium
    issue: «cảnh khốn khổ lớn»
    rationale: Cụm này gượng trong tiếng Việt và không phản ánh trực tiếp, thành ngữ hóa cụm εἰς θλῖψιν μεγάλην. «vào cơn hoạn nạn lớn» tự nhiên và sát hơn.
  - severity: low
    issue: «quăng» và đại từ «nó»
    rationale: «Quăng» thiên về khẩu ngữ; «ném» trang trọng hơn mà vẫn giữ lực của βάλλω. Trong văn cảnh chỉ một người nữ cụ thể, «bà ấy» rõ tham chiếu và tự nhiên hơn «nó».
