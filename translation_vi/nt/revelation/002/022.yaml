id: REV.2.22
reference: Revelation 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: vi
  text: Này, Ta sẽ ném bà ấy lên giường[a], và ném những kẻ ngoại tình với bà ấy vào cơn hoạn nạn lớn[b], trừ khi họ ăn năn, từ bỏ những việc làm của bà ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “lên giường bệnh”. Tiếng Hy Lạp nói sát nghĩa là “lên giường”; trong văn cảnh, nhiều người hiểu đây là một chiếc giường của sự đau đớn hoặc bệnh tật như một hình phạt.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vào sự khốn khổ lớn”. Ở đây, cụm từ này chỉ sự đau khổ, áp bức, hoặc khốn đốn nghiêm trọng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Dùng thán từ tự nhiên, trang trọng để thu hút sự chú ý, thay cho lối cổ hơn như “Kìa”.
- source_word: βάλλω
  choice: ta sẽ quăng
  rationale: Động từ hiện tại có sắc thái hành động phán xét sắp xảy đến; tiếng Việt dùng thì tương lai theo ngữ cảnh. “Quăng” giữ được sức mạnh và tính sống động của βάλλω.
- source_word: αὐτὴν εἰς κλίνην
  choice: nó lên giường
  rationale: κλίνη chỉ “giường” theo nghĩa trực tiếp và không tự nó bắt buộc nghĩa “giường bệnh”; cách hiểu ấy được giữ ở chú thích.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: những kẻ ngoại tình với nó
  rationale: Giữ nghĩa trực tiếp của μοιχεύω là ngoại tình, đồng thời không loại bỏ khả năng hình ảnh này mang hàm ý bất trung thuộc linh trong văn cảnh Khải Huyền.
- source_word: εἰς θλῖψιν μεγάλην
  choice: vào cảnh khốn khổ lớn
  rationale: θλῖψις diễn tả sự khốn khổ, áp bức hoặc hoạn nạn nghiêm trọng; “cảnh khốn khổ lớn” rõ nghĩa và không mặc nhiên áp đặt một hệ thống cánh chung.
- source_word: ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς
  choice: nếu họ không ăn năn mà từ bỏ những việc làm của nó
  rationale: ἐκ sau μετανοέω hàm ý quay khỏi hoặc từ bỏ. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ hướng của sự ăn năn, trong khi vẫn giữ liên hệ với “những việc làm của nó”.
theological_decisions:
- issue: Có nên dịch κλίνη rõ thành “giường bệnh” như một hình phạt hay không
  choice: Giữ “giường” trong chính văn
  alternative: giường bệnh
  rationale: Văn cảnh cho thấy đây là sự phán xét, nhưng danh từ κλίνη tự nó chỉ có nghĩa là “giường”. Vì vậy, bản dịch không đưa cách giải thích “giường bệnh” vào chính văn mà ghi ở chú thích.
- issue: μοιχεύοντας chỉ sự ngoại tình thể xác, sự bất trung thuộc linh, hay cả hai
  choice: Dịch theo nghĩa từ vựng trực tiếp là “ngoại tình” và để chiều kích biểu tượng tùy văn cảnh
  alternative: phạm tội gian dâm với nó; bất trung cùng với nó
  rationale: μοιχεύω trực tiếp chỉ hành vi ngoại tình. Khải Huyền có thể dùng hình ảnh này theo nghĩa biểu tượng, nhưng chuyển thành một cách diễn giải rộng hơn sẽ làm mất tính cụ thể và sự căng thẳng của nguyên văn.
- issue: Chủ thể của “những việc làm của nó” trong lời kêu gọi ăn năn
  choice: 'Giữ đại từ sở hữu số ít giống cái của nguyên văn: “những việc làm của nó”'
  alternative: những việc làm của họ
  rationale: SBLGNT đọc αὐτῆς, quy các việc làm về người phụ nữ. Không sửa thành αὐτῶν dù một số truyền thống văn bản có biến thể hoặc cách hiểu khác.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ta” phù hợp lời phán của Đấng Christ và dùng “nó” cho nhân vật nữ bị lên án nhằm giữ khoảng cách phán xét trong văn cảnh; lặp “ta sẽ quăng” để câu tiếng Việt rõ quan hệ cú pháp mà vẫn giữ hình ảnh mạnh của nguyên văn.
