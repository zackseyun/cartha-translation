id: REV.2.5
reference: Revelation 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: vi
  text: Vậy, hãy nhớ xem ngươi đã rơi xuống từ đâu[a], hãy ăn năn và làm những việc ban đầu. Nếu không, Ta sẽ đến với ngươi và dời chân đèn của ngươi khỏi chỗ của nó[b], trừ khi ngươi ăn năn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “ngươi đã rơi xuống từ độ cao nào.” Nguyên văn nói sát nghĩa là “ngươi đã rơi xuống từ đâu”; một số người hiểu đây là hình ảnh ngầm nói đến độ cao.'
    reason: lexical_alternative
  - marker: b
    text: Trong Khải Huyền 1:20, “chân đèn” là hình ảnh tượng trưng cho một hội thánh.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: hãy nhớ lại
  rationale: Mệnh lệnh hiện tại kêu gọi sự ghi nhớ liên tục; “hãy nhớ lại” tự nhiên trong tiếng Việt và phù hợp với lời kêu gọi nhìn lại tình trạng trước kia.
- source_word: οὖν
  choice: vậy
  rationale: Giữ quan hệ suy luận với lời quở trách trước đó bằng một liên từ tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: πόθεν πέπτωκας
  choice: mình đã sa sút từ đâu
  rationale: “Từ đâu” giữ nguyên πόθεν mà không tự ý thêm ý “độ cao”; “đã sa sút” bảo tồn hình ảnh sa ngã cùng kết quả hiện tại, đồng thời tự nhiên hơn “đã rơi” khi nói về tình trạng của một cộng đồng.
- source_word: μετανόησον / μετανοήσῃς
  choice: hãy ăn năn / bạn ăn năn
  rationale: “Ăn năn” là cách diễn đạt quen thuộc, trang trọng và thích hợp cho sự thay đổi đạo đức-tâm linh được đòi hỏi trong ngữ cảnh.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: làm những việc ban đầu
  rationale: Diễn đạt ngắn gọn các việc làm đặc trưng cho giai đoạn đầu, không thêm đối tượng hoặc động cơ mà bản văn không nói rõ.
- source_word: εἰ δὲ μή
  choice: nếu không
  rationale: Giữ tính điều kiện và sự chuyển sang lời cảnh báo một cách súc tích.
- source_word: ἔρχομαί σοι
  choice: tôi sẽ đến với bạn
  rationale: Thì hiện tại Hy Lạp có sắc thái tương lai gần trong lời cảnh báo; tiếng Việt dùng “sẽ đến” tự nhiên hơn, còn “với bạn” không thêm ý “chống lại” vốn không được nói tường minh.
- source_word: κινήσω
  choice: dời
  rationale: Giữ nghĩa cơ bản “làm cho chuyển khỏi vị trí” và phù hợp trực tiếp với cụm “khỏi chỗ nó”, ít diễn giải hơn “loại bỏ”.
- source_word: τὴν λυχνίαν σου
  choice: chân đèn của bạn
  rationale: λυχνία là giá/chân đặt đèn chứ không phải ngọn đèn; hình ảnh cụ thể được giữ lại như trong Khải Huyền 1:20.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: khỏi chỗ nó
  rationale: Cách diễn đạt tự nhiên, trực tiếp, bảo tồn hình ảnh chân đèn bị chuyển khỏi vị trí.
theological_decisions:
- issue: Bản chất của lời cảnh báo về chân đèn
  choice: Giữ nguyên hình ảnh biểu tượng về việc dời chân đèn của hội thánh.
  alternative: Giải thích thành mất vai trò làm chứng, hội thánh bị xóa bỏ, hoặc cá nhân mất sự cứu rỗi.
  rationale: Khải Huyền 1:20 cho biết các chân đèn tượng trưng cho các hội thánh, nhưng câu này không xác định đầy đủ hệ quả theo một hệ thống thần học. Bản dịch vì thế giữ hình ảnh và sức căng của lời cảnh báo.
- issue: Sắc thái của πόθεν πέπτωκας
  choice: “mình đã sa sút từ đâu”
  alternative: “mình đã sa sút từ độ cao nào”
  rationale: Nguyên văn nói “từ đâu” chứ không nêu rõ “độ cao”; chú thích ghi nhận cách hiểu ẩn dụ mà không đưa nó vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “tôi—bạn” để lời phán trực tiếp, rõ ràng; “bạn” ở đây có thể chỉ tập thể hội thánh theo ngữ cảnh. Giữ nhịp mệnh lệnh và lời cảnh báo súc tích của nguyên văn.
