source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: vi
  text: 'Hãy viết cho thiên sứ[a] của hội thánh tại Ê-phê-sô: Đây là lời phán của Đấng cầm bảy ngôi sao trong tay phải Ngài và đi giữa bảy chân đèn bằng vàng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sứ giả”.
    reason: Giữ nghĩa thay thế có thật của ἀγγέλῳ và sự không chắc chắn về đối tượng được nói đến.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Từ này có thể chỉ một thiên sứ trên trời hoặc một sứ giả loài người. “Thiên sứ” phù hợp với bối cảnh khải huyền và cách dùng truyền thống, còn nghĩa “sứ giả” được giữ trong chú thích.
- source_word: ἐκκλησίας
  choice: hội thánh
  rationale: Trong bối cảnh cộng đồng Cơ Đốc, “hội thánh” là cách gọi tự nhiên và đã được xác lập trong tiếng Việt.
- source_word: γράψον
  choice: hãy viết
  rationale: Truyền đạt trực tiếp mệnh lệnh aorist bằng một mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: Τάδε λέγει
  choice: phán thế này
  rationale: Giữ sắc thái trang trọng của công thức tuyên phán tiên tri, đồng thời tự nhiên hơn lối dịch sát từng chữ.
- source_word: κρατῶν
  choice: cầm
  rationale: Diễn tả việc nắm giữ và làm chủ; “cầm” vừa rõ hình ảnh vừa tự nhiên trong tiếng Việt.
- source_word: δεξιᾷ
  choice: tay phải
  rationale: Giữ nguyên hình ảnh cụ thể của nguyên văn cùng hàm ý biểu tượng mà không diễn giải thêm.
- source_word: περιπατῶν … ἐν μέσῳ
  choice: đi giữa
  rationale: Diễn tả chuyển động ở giữa các chân đèn một cách gọn và tự nhiên.
- source_word: λυχνιῶν
  choice: chân đèn
  rationale: Từ Hy Lạp chỉ vật dùng để đặt đèn, không phải chính ngọn đèn; cách dịch này cũng giữ sự nhất quán với hình ảnh trong Khải Huyền 1.
- source_word: χρυσῶν
  choice: bằng vàng
  rationale: Diễn đạt tự nhiên chất liệu vàng của các chân đèn.
theological_decisions:
- issue: Đối tượng được gọi là ἀγγέλῳ của hội thánh
  choice: Giữ “thiên sứ” trong chính văn
  alternative: sứ giả
  rationale: Nguyên ngữ cho phép cả hai nghĩa. Thể loại khải huyền và hình ảnh thiên giới nghiêng về “thiên sứ”, nhưng vì đối tượng cụ thể vẫn còn được tranh luận, chú thích giữ lại khả năng “sứ giả” mà không giải quyết dứt khoát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Công thức “phán thế này” giữ giọng tuyên cáo; cấu trúc lặp “Đấng …, Đấng …” bảo tồn nhịp điệu và hai mô tả song song trong nguyên văn. Dấu [a] được đặt ngay sau “thiên sứ”, là từ mà chú thích giải thích.
