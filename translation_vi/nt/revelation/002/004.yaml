  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: vi
  text: 'Nhưng Ta có điều này để trách con: con đã bỏ tình yêu ban đầu của con.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con đã rời bỏ tình yêu ban đầu của con.” Cụm này có thể chỉ tình yêu lúc ban đầu, hướng về Chúa, hướng về nhau, hoặc cả hai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ tương phản rõ nét với lời khen trước đó; “Nhưng” tự nhiên và trực tiếp trong tiếng Việt hiện đại.
- source_word: ἔχω κατὰ σοῦ
  choice: Ta có điều này trách con
  rationale: Thành ngữ ἔχω κατά diễn tả việc có lời khiển trách hay cáo trách đối với một người. Cách dịch này tự nhiên, trang trọng và giữ được sắc thái quở trách.
- source_word: ὅτι
  choice: ': con đã'
  rationale: ὅτι giới thiệu nội dung của lời trách. Dấu hai chấm thể hiện quan hệ giải thích tự nhiên trong tiếng Việt mà không diễn giải thành quan hệ nguyên nhân.
- source_word: ἀγάπην
  choice: tình yêu
  rationale: “Tình yêu” là cách tương đương thông dụng và phù hợp với ἀγάπη trong ngữ cảnh này.
- source_word: τὴν πρώτην
  choice: ban đầu
  rationale: Trong cụm này, πρώτην chỉ tình yêu có từ thời kỳ đầu. “Ban đầu” tự nhiên hơn “thứ nhất” trong tiếng Việt, đồng thời không xác định đối tượng của tình yêu.
- source_word: ἀφῆκες
  choice: đã lìa bỏ
  rationale: Động từ ἀφίημι ở đây mang nghĩa rời bỏ hay bỏ lại. “Lìa bỏ” giữ được mức độ nghiêm trọng của lời quở trách nhưng vẫn trang trọng và dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của “tình yêu ban đầu”
  choice: Giữ nguyên cụm mở “tình yêu ban đầu của mình”, không xác định đối tượng của tình yêu.
  alternative: “tình yêu con dành cho Ta thuở ban đầu”; “tình yêu con từng có lúc đầu”; hoặc tình yêu đối với nhau
  rationale: Cụm Hy Lạp τὴν ἀγάπην σου τὴν πρώτην không nói rõ đây là tình yêu đối với Chúa, đối với nhau, hay cả hai. Bản dịch giữ sự hàm hồ có thật của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Ta–con” thể hiện lời Đấng Christ phán với thiên sứ/hội thánh trong văn cảnh, không bổ sung cách giải nghĩa hệ phái. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
