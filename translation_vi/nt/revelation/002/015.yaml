    rationale: Nguyên văn có cả οὕτως ở đầu câu và ὁμοίως ở cuối câu. Gộp cả hai thành một “Cũng vậy” làm mất trạng từ cuối câu, trong khi chú thích xác nhận sự hiện diện và chức năng của nó.
  - severity: low
    issue: Chú thích nói nguyên văn «có thêm từ» nhưng từ ấy không xuất hiện trong bản dịch chính.
    rationale: Chú thích thay vì nêu một phương án dịch nên được dùng để giải thích phạm vi bổ nghĩa còn mơ hồ của “theo cách tương tự.”
  - severity: low
    issue: “giữ theo sự dạy dỗ” chưa tự nhiên.
    rationale: “Bám giữ giáo huấn” phản ánh tốt hơn κρατοῦντας và trôi chảy hơn trong tiếng Việt hiện đại.
