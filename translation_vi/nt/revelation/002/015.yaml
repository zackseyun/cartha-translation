  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: vi
  text: Như vậy, ngươi cũng có những người bám giữ giáo huấn của phái Ni-cô-la theo cách tương tự[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cũng như vậy.” Trạng từ Hy Lạp ở cuối câu có thể nhấn mạnh cách họ bám giữ giáo huấn này, hoặc sự tương đồng rộng hơn với những người được nói đến ở câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Nối lời quở trách này với trường hợp ở câu trước và giữ sắc thái so sánh của nguyên ngữ.
- source_word: ἔχεις
  choice: ngươi có
  rationale: Giữ cách nói trực tiếp của động từ Hy Lạp; trong ngữ cảnh, nghĩa là trong hội thánh có những người như thế.
- source_word: καὶ σὺ
  choice: chính ngươi
  rationale: Thể hiện sự nhấn mạnh vào đại từ σὺ; ý bổ sung của καί được chuyển tải cùng với οὕτως bằng “Cũng vậy” để câu tiếng Việt tự nhiên.
- source_word: κρατοῦντας
  choice: những kẻ giữ theo
  rationale: Diễn tả việc bám giữ và tiếp tục theo một sự dạy dỗ, đồng thời phù hợp với văn phong quở trách của ngữ cảnh.
- source_word: διδαχὴν
  choice: sự dạy dỗ
  rationale: Là cách diễn đạt phổ thông, trang trọng vừa phải, không mang sắc thái chuyên môn giáo hội quá mức.
- source_word: Νικολαϊτῶν
  choice: phái Ni-cô-la
  rationale: Chuyển tên nhóm người sang dạng quen dùng và dễ hiểu trong tiếng Việt, với “phái” cho thấy đây là một nhóm theo sự dạy dỗ ấy.
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Đặt ở đầu câu để giữ sức liên kết với câu 14 mà không buộc trạng từ chỉ bổ nghĩa riêng cho hành động “giữ theo”.
theological_decisions:
- issue: Phạm vi bổ nghĩa của οὕτως và ὁμοίως
  choice: Gộp sức so sánh của hai trạng từ trong cách mở đầu “Cũng vậy”, để liên kết toàn mệnh đề với câu trước.
  alternative: “Ngươi cũng có những kẻ giữ theo sự dạy dỗ của phái Ni-cô-la theo cùng một cách ấy.”
  rationale: Trật tự Hy Lạp có thể khiến ὁμοίως liên hệ với cách họ giữ sự dạy dỗ hoặc với sự tương đồng rộng hơn với những người ở câu 14. Bản dịch chính tránh xác định quá hẹp quan hệ này; chú thích bảo lưu khả năng còn lại.
translation_notes:
  register: Tiếng Việt hiện đại, trực tiếp và trang trọng. Dùng “ngươi” vì lời phán hướng đến thiên sứ của hội thánh ở số ít; “những kẻ” phù hợp sắc thái quở trách. Dấu chú thích [a] xuất hiện ngay sau tên nhóm liên quan.
