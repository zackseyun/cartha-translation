revisions:
- from: Cũng vậy, chính ngươi có những kẻ giữ theo sự dạy dỗ của phái Ni-cô-la[a].
  to: Như vậy, ngươi cũng có những người bám giữ giáo huấn của phái Ni-cô-la theo cách tương tự[a].
  rationale: Bản sửa giữ riêng cả οὕτως (“Như vậy”) và ὁμοίως (“theo cách tương tự”), đồng thời vẫn không quyết định dứt khoát trạng từ cuối câu bổ nghĩa hẹp cho “bám giữ” hay cho sự so sánh với câu 14. Chú thích nay giải thích đúng tính mơ hồ cú pháp thay vì ghi nhận một từ đã bị lược trong bản văn chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp làm rõ liên hệ với câu trước và chuyển đúng ý cơ bản của ἔχεις, καὶ σὺ, κρατοῦντας, διδαχὴν, và Νικολαϊτῶν. Tuy nhiên, bản văn chính chỉ có một lần “Cũng vậy” để gộp οὕτως và ὁμοίως, trong khi chú thích lại nói ὁμοίως là một từ «có thêm» ở cuối câu. Cách này không thể hiện rõ trạng từ cuối câu trong bản dịch và làm chú thích trở thành mô tả một yếu tố bị lược khỏi bản văn chính.
  naturalness: “Giữ theo sự dạy dỗ” khá gượng trong tiếng Việt hiện đại. “Bám giữ giáo huấn” diễn đạt tự nhiên hơn ý tiếp tục nắm giữ/kiên trì theo một giáo huấn. Cấu trúc “Như vậy ... theo cách tương tự” có chủ ý giữ hai trạng từ so sánh của tiếng Hy Lạp, dù tạo sắc thái nhấn mạnh như nguyên văn.
  terminology: “Giáo huấn” là từ hiện đại, trang trọng vừa phải cho διδαχή. “Phái Ni-cô-la” là cách gọi nhóm phù hợp; không cần thêm diễn giải lịch sử hoặc giáo phái.
