revisions:
- from: Ta biết các việc làm, sự lao nhọc và lòng kiên trì của con; Ta cũng biết con không dung chịu những kẻ xấu xa.[a] Con đã kiểm tra những kẻ tự xưng là sứ đồ mà thật ra không phải,[b] và nhận ra họ là giả dối.
  to: Ta biết các việc làm, sự lao nhọc và lòng kiên trì của con. Ta biết con không thể dung thứ cho những kẻ ác.[a] Con đã kiểm tra những kẻ tự xưng là sứ đồ nhưng không phải là sứ đồ,[b] và đã nhận ra họ là giả mạo.
  rationale: Bản sửa giữ nguyên nội dung và chuỗi ý của tiếng Hy Lạp, đồng thời dùng các cách kết hợp tự nhiên hơn trong tiếng Việt hiện đại. Việc lặp “là sứ đồ” làm sáng tỏ đối tượng phủ định vốn được lược trong tiếng Hy Lạp, và “giả mạo” diễn tả kết quả kiểm tra các người mạo nhận cách rõ ràng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:31:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: Đấng phán biết việc làm, sự lao nhọc, lòng kiên trì; hội thánh không chịu dung thứ người ác; họ đã kiểm tra người tự nhận là sứ đồ và phát hiện họ là giả. Tuy nhiên, “không dung chịu” không tự nhiên trong tiếng Việt hiện đại, còn “họ là giả dối” không phải cách diễn đạt rõ và tự nhiên nhất cho ψευδεῖς khi nói về những người tự nhận địa vị sứ đồ.'
  naturalness: Cặp xưng hô “Ta—con” phù hợp văn cảnh lời phán trang trọng. Cần thay “không dung chịu” bằng “không thể dung thứ cho” và làm rõ “mà không phải là sứ đồ” để câu trôi chảy, không dựa vào lược bỏ vị ngữ. “Là giả mạo” diễn đạt tự nhiên việc họ là những người mạo nhận.
  terminology: “Sứ đồ” là lựa chọn thích hợp cho ἀποστόλους trong bối cảnh này. “Những kẻ ác” phản ánh κακούς như một tính từ được danh từ hóa chỉ người, đồng thời hợp văn phong Khải Huyền. “Kiểm tra” là cách dịch rõ ràng cho ἐπείρασας.
  issues:
  - severity: medium
    issue: “không dung chịu” không phải cách kết hợp tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm οὐ δύνῃ βαστάσαι theo ngữ cảnh có nghĩa không thể chịu đựng/dung thứ. “Không thể dung thứ cho” diễn đạt rõ, tự nhiên và giữ sắc thái này; chú thích vẫn bảo lưu cách hiểu sát chữ là “chịu đựng.”
  - severity: medium
    issue: “nhận ra họ là giả dối” diễn đạt ψευδεῖς chưa tự nhiên và chưa cụ thể về việc mạo nhận.
    rationale: “Giả dối” thường mô tả lời nói, hành vi hoặc tính cách. Trong ngữ cảnh những người tự nhận là sứ đồ, “họ là giả mạo” rõ hơn về việc họ là người mạo nhận, mà không thêm một cơ cấu hay phán đoán giáo lý ngoài văn bản.
