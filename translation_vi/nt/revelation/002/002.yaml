id: REV.2.2
reference: Revelation 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: vi
  text: Ta biết các việc làm, sự lao nhọc và lòng kiên trì của con. Ta biết con không thể dung thứ cho những kẻ ác.[a] Con đã kiểm tra những kẻ tự xưng là sứ đồ nhưng không phải là sứ đồ,[b] và đã nhận ra họ là giả mạo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “con không thể chịu đựng những kẻ ác.” Tiếng Hy Lạp sát chữ hơn là “không thể mang/chịu”; trong ngữ cảnh này, cụm từ có ý nói không chấp nhận hoặc không dung túng họ.
    reason: lexical_alternative
  - marker: b
    text: Hay “những kẻ tuyên bố mình là sứ đồ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Ta biết
  rationale: Diễn đạt trực tiếp trạng thái biết và sự đánh giá mang tính cá nhân của Đấng đang phán. “Ta” phù hợp với lời trang trọng của Chúa Giê-su nói với thiên sứ của hội thánh.
- source_word: τὰ ἔργα σου
  choice: các việc làm của con
  rationale: Giữ nghĩa rộng của ἔργα là các hành động và hoạt động, đồng thời dùng tiếng Việt tự nhiên.
- source_word: τὸν κόπον
  choice: sự lao nhọc
  rationale: κόπος chỉ công việc đòi hỏi nhiều công sức, thường hàm ý mệt nhọc; “sự lao nhọc” giữ được sắc thái ấy.
- source_word: τὴν ὑπομονήν σου
  choice: lòng kiên trì của con
  rationale: ὑπομονή nói đến sự bền bỉ đứng vững dưới áp lực. “Lòng kiên trì” tự nhiên và không thêm ý giải nghĩa quá mức.
- source_word: οὐ δύνῃ βαστάσαι
  choice: con không dung chịu
  rationale: βαστάζω theo nghĩa đen là mang hoặc chịu, nhưng ở đây diễn tả việc không chấp nhận hay dung túng. “Không dung chịu” giữ được hình ảnh chịu đựng đồng thời truyền đạt lực ngữ cảnh; chú thích bảo lưu cách hiểu sát chữ hơn.
- source_word: κακούς
  choice: những kẻ xấu xa
  rationale: Tính từ giống đực số nhiều được dùng như danh từ để chỉ người. “Những kẻ xấu xa” thể hiện rõ đối tượng là người mà không giới hạn vào nam giới.
- source_word: ἐπείρασας
  choice: đã kiểm tra
  rationale: Trong ngữ cảnh này, πειράζω nói đến việc thử để xác định tính chân thật của lời tự nhận. “Kiểm tra” rõ ràng và tự nhiên hơn “thử nghiệm” khi đối tượng là người.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: những kẻ tự xưng là sứ đồ
  rationale: “Tự xưng” bảo toàn lực phản thân của ἑαυτούς và cho thấy đây là địa vị do chính họ tuyên bố.
- source_word: ἀποστόλους
  choice: sứ đồ
  rationale: Trong bối cảnh hội thánh, từ này nhiều khả năng chỉ chức danh hoặc vai trò có thẩm quyền, không chỉ một sứ giả nói chung.
- source_word: ψευδεῖς
  choice: giả dối
  rationale: Giữ dạng tính từ vị ngữ mô tả những người ấy là không chân thật. “Kẻ nói dối” sẽ làm lời buộc tội cụ thể và mạnh hơn hình thức trực tiếp của bản Hy Lạp.
theological_decisions:
- issue: Địa vị mà những người ấy tự nhận qua từ ἀποστόλους
  choice: sứ đồ
  alternative: sứ giả
  rationale: Bối cảnh nói đến việc hội thánh kiểm tra những người tự nhận thẩm quyền thuộc linh; “sứ đồ” giữ nghĩa chuyên biệt có khả năng cao nhất mà không áp đặt một cơ cấu giáo hội về sau.
- issue: Sắc thái của οὐ δύνῃ βαστάσαι
  choice: không dung chịu, với chú thích về cách dịch sát chữ
  alternative: không thể chịu đựng
  rationale: Ngữ cảnh khen ngợi cho thấy ý không dung túng điều xấu, nhưng cấu trúc Hy Lạp cũng có thể được nghe sát chữ là “không thể chịu đựng.” Bản dịch chính truyền đạt lực ngữ cảnh, còn chú thích bảo lưu sắc thái hình thức.
- issue: Phạm vi giới tính của κακούς
  choice: những kẻ xấu xa
  alternative: những người đàn ông xấu xa
  rationale: Giống đực số nhiều ở đây được dùng để chỉ những người nói chung; bản dịch không thu hẹp đối tượng vào nam giới khi ngữ cảnh không đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con” để phản ánh lời của Chúa Giê-su trực tiếp phán với người nhận trong văn cảnh Khải Huyền. Cấu trúc được chia thành hai câu để tiếng Việt sáng rõ, nhưng vẫn bảo toàn chuỗi ý của câu Hy Lạp.
