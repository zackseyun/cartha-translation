id: REV.2.29
reference: Revelation 2:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: vi
  text: Ai có tai, hãy nghe điều Thánh Linh phán với các hội thánh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ai có
  rationale: Cụm mạo từ với phân từ hiện tại được dùng như danh từ, chỉ bất cứ người nào có khả năng nghe. “Ai có” tự nhiên trong tiếng Việt và vẫn giữ sắc thái lời kêu gọi mang tính phổ quát.
- source_word: οὖς
  choice: tai
  rationale: Danh từ Hy Lạp ở số ít. Tiếng Việt dùng tự nhiên “có tai” trong công thức này, vừa giữ hình thức số ít vừa gợi khả năng tiếp nhận và đáp ứng.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Động từ mệnh lệnh aorist ngôi ba số ít. “Hãy nghe” truyền đạt trực tiếp sức nặng mệnh lệnh và giữ âm hưởng trang trọng của điệp khúc trong Khải Huyền.
- source_word: τί
  choice: điều
  rationale: Đại từ nghi vấn ở đây giới thiệu nội dung lời phán. Cấu trúc “điều ... phán” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong điệp khúc của Khải Huyền 2–3, từ này chỉ Thánh Linh là Đấng phán với các hội thánh. “Thánh Linh” xác định sở chỉ thần linh mà không thêm lời giải thích vào câu.
- source_word: λέγει
  choice: phán
  rationale: Thì hiện tại diễn tả lời nói đang có hiệu lực hoặc mang tính thường xuyên. “Phán” phù hợp với chủ thể thần linh và văn phong Kinh Thánh trang trọng, nhưng vẫn quen thuộc với độc giả Việt.
- source_word: ταῖς ἐκκλησίαις
  choice: với các hội thánh
  rationale: Trong Khải Huyền 2–3, ἐκκλησίαις chỉ các cộng đồng tín hữu được nhận sứ điệp. “Các hội thánh” là cách gọi rõ ràng, quen thuộc; giới từ “với” diễn đạt tự nhiên đối tượng được Thánh Linh phán bảo.
theological_decisions:
- issue: Sở chỉ của τὸ πνεῦμα
  choice: Thánh Linh phán với các hội thánh
  alternative: một thần linh; tâm linh; tinh thần hay sứ điệp của Đức Chúa Jêsus
  rationale: Điệp khúc lặp lại trong Khải Huyền 2–3 trình bày Thánh Linh như Đấng phán lời thần linh qua các sứ điệp gửi cho toàn thể hội thánh. Bản dịch xác định sở chỉ này nhưng không thêm một lời giải nghĩa thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ nhịp kêu gọi của nguyên văn. Không dùng chú thích vì câu không có biến thể văn bản hay sự mơ hồ cần giải thích trong bản văn chính.
source_grounding:
  english_pob_role: consult_only
