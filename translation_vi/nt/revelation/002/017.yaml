id: REV.2.17
reference: Revelation 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: vi
  text: Ai có tai, hãy nghe điều Thần Khí phán với các hội thánh. Người chiến thắng[a], ta sẽ ban cho người ấy một phần ma-na được giấu kín. Ta cũng sẽ ban cho người ấy một viên đá trắng[b]; trên viên đá có viết một tên mới mà không ai biết, ngoại trừ người nhận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người vượt thắng” hoặc “người thắng được.”'
    reason: lexical_alternative
  - marker: b
    text: “Viên đá trắng” có thể gợi đến viên sỏi dùng để biểu quyết, dấu hiệu được tuyên trắng án, hoặc thẻ vào cửa; chính câu này không cho biết nền văn hóa nào được nhắm đến.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ai có tai
  rationale: Giữ hình ảnh số ít của thành ngữ Hy Lạp, đồng thời dùng cấu trúc tiếng Việt tự nhiên và có phạm vi áp dụng chung.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Diễn đạt trực tiếp mệnh lệnh cách mà không thêm sắc thái giải thích.
- source_word: τὸ πνεῦμα
  choice: Thần Khí
  rationale: Chỉ Đấng thiêng liêng trong công thức lặp lại của Khải Huyền, nhưng không thêm từ “Thánh” vì nguyên văn chỉ có “Thần Khí”.
- source_word: ταῖς ἐκκλησίαις
  choice: các hội thánh
  rationale: Chỉ các cộng đoàn tín hữu được ngỏ lời trong Khải Huyền; đây là cách gọi quen thuộc và phù hợp ngữ cảnh.
- source_word: τῷ νικῶντι
  choice: Người chiến thắng
  rationale: Giữ sắc thái thắng trận của νικάω trong Khải Huyền mà không xác định cụ thể đối tượng hay phương diện của sự chiến thắng.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: một phần ma-na được giấu kín
  rationale: Sở hữu cách sau δίδωμι có thể diễn tả việc ban một phần từ một chất; phân từ hoàn thành cho thấy ma-na đang ở trong tình trạng được che giấu.
- source_word: ψῆφον λευκήν
  choice: một viên đá trắng
  rationale: Dịch tối thiểu, không quyết định đó là viên sỏi bỏ phiếu, dấu hiệu tuyên trắng án hay thẻ cho phép vào dự tiệc.
- source_word: ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον
  choice: trên viên đá có viết một tên mới
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ rõ vị trí của tên mới trên viên đá và trạng thái đã được viết.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: mà không ai biết, ngoại trừ người nhận
  rationale: Giữ nguyên việc nguyên văn không nói rõ người ấy nhận riêng viên đá, tên, hay toàn bộ vật mang tên; tránh tự ý bổ sung một tân ngữ.
theological_decisions:
- issue: Phạm vi của các hình thức số ít trong lời kêu gọi và lời hứa
  choice: Dùng “Ai có tai” và “người ấy”, vừa giữ số ít vừa có ý nghĩa áp dụng chung.
  alternative: Dùng cách nói số nhiều hoặc lặp lại “người nào”.
  rationale: Nguyên văn dùng số ít giống đực theo chức năng đại diện; tiếng Việt có thể giữ số ít mà không buộc xác định giới tính.
- issue: Ý nghĩa biểu tượng của ψῆφος λευκή
  choice: Dịch là “một viên đá trắng” và để ngỏ ý nghĩa biểu tượng.
  alternative: Giải thích là dấu hiệu tuyên trắng án, viên sỏi bỏ phiếu hoặc thẻ vào dự tiệc.
  rationale: Câu Kinh Thánh không xác định nền văn hóa hay chức năng cụ thể của viên đá, nên bản dịch không nên giải quyết thay sự mơ hồ này.
- issue: Đối tượng được “nhận” ở cuối câu
  choice: 'Không thêm đại từ chỉ rõ tân ngữ: “ngoại trừ người nhận”.'
  alternative: “Ngoại trừ người nhận nó”, trong đó “nó” có thể được hiểu là viên đá hoặc tên mới.
  rationale: Động từ λαμβάνων không có tân ngữ được nêu rõ trong mệnh đề; giữ cách diễn đạt mở giúp bảo toàn độ mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu ngắn và nhịp rõ. “Ta” phù hợp lời phán có thẩm quyền của Đấng Christ trong ngữ cảnh. Không thêm “Thánh” vào “Thần Khí”, không giải thích biểu tượng viên đá trắng trong chính văn, và không xác định tân ngữ bị lược ở cuối câu.
