id: REV.2.21
reference: Revelation 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: vi
  text: Ta đã cho bà ấy thời gian để ăn năn, nhưng bà ấy không muốn ăn năn về sự vô luân về tình dục của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “ăn năn khỏi sự vô luân về tình dục của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκα
  choice: đã cho
  rationale: Thì aorist chỉ hành động ban cho một khoảng thời gian; tiếng Việt diễn đạt tự nhiên bằng “đã cho”.
- source_word: αὐτῇ
  choice: bà ấy
  rationale: Đại từ giống cái chỉ người phụ nữ được gọi tượng trưng là Giê-sa-bên trong văn cảnh. “Bà ấy” giữ sắc thái trung tính của nguyên văn, không thêm ý miệt thị.
- source_word: χρόνον
  choice: thời gian
  rationale: χρόνος chỉ thời gian hoặc một khoảng thời gian; “thời gian” vừa tự nhiên vừa giữ được ý Chúa dành cơ hội cho bà ăn năn.
- source_word: ἵνα μετανοήσῃ
  choice: để ăn năn
  rationale: ἵνα với động từ ở lối giả định diễn tả mục đích; cấu trúc “cho… thời gian để…” tự nhiên trong tiếng Việt.
- source_word: οὐ θέλει
  choice: không muốn
  rationale: θέλω ở đây diễn tả ý muốn. “Không muốn” giữ trực tiếp yếu tố chủ ý mà không tăng nghĩa thành lời khước từ tuyệt đối.
- source_word: μετανοῆσαι
  choice: ăn năn
  rationale: Động từ nguyên mẫu bổ nghĩa cho θέλει; lặp lại “ăn năn” bảo toàn sự nhấn mạnh của nguyên văn.
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: về sự vô luân tình dục của mình
  rationale: πορνεία có nghĩa rộng là sự vô luân về tình dục. Trong tiếng Việt, “ăn năn về” tự nhiên hơn khi đi với đối tượng của sự ăn năn; chú thích giữ lại sắc thái ἐκ là lìa khỏi.
theological_decisions:
- issue: Nghĩa của πορνεία trong lời quở trách mang tính khải huyền
  choice: sự vô luân tình dục
  alternative: sự gian dâm; sự vô luân; việc mại dâm của bà ấy
  rationale: Cách dịch cụ thể này giữ nghĩa từ vựng thông thường của πορνεία mà không quyết định rằng từ ấy chỉ mang nghĩa đen hay hoàn toàn là ẩn dụ cho sự thờ thần tượng. Văn cảnh rộng hơn vẫn có thể chuyển tải các âm hưởng tiên tri và biểu tượng.
- issue: Sắc thái của giới từ ἐκ sau μετανοέω
  choice: Trong chính văn dùng cách nói tự nhiên “ăn năn về”, kèm chú thích về nghĩa lìa khỏi
  alternative: ăn năn mà lìa khỏi sự vô luân tình dục của mình
  rationale: ἐκ theo nghĩa sát là “khỏi/ra khỏi”, hàm ý quay khỏi lối sống ấy. Chính văn ưu tiên cú pháp tiếng Việt tự nhiên, còn chú thích bảo tồn hình ảnh chuyển hướng mà không biến một quan hệ ngữ pháp thành hai hành động tách biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời phán trực tiếp của Đấng Christ; “bà ấy” tránh thêm sắc thái khinh miệt không có trong đại từ Hy Lạp. Thuật ngữ “sự vô luân tình dục” rộng hơn “gian dâm”, phù hợp phạm vi nghĩa của πορνεία.
