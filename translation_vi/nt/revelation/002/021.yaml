  source_fidelity: 'Bản dịch phản ánh đúng mạch chính: aorist ἔδωκα là “đã cho”, χρόνον là “thời gian”, mệnh đề mục đích ἵνα μετανοήσῃ là “để ăn năn”, và οὐ θέλει giữ ý chí không sẵn lòng qua “không muốn”. Cách “ăn năn về” là lối nói Việt tự nhiên cho μετανοεῖν, đồng thời chú thích có thể nêu sắc thái ἐκ (“khỏi/lìa khỏi”) mà không ép chính văn thành một cấu trúc bất thường.'
  naturalness: Câu văn nhìn chung rõ và trang trọng. Tuy nhiên, cụm “sự vô luân tình dục” chưa phải kết hợp từ ngữ tự nhiên trong tiếng Việt hiện đại; “sự vô luân về tình dục” rõ nghĩa và trôi chảy hơn. Chú thích hiện có, “ăn năn mà lìa khỏi”, thêm liên từ “mà” và dễ bị hiểu là hai hành động phối hợp, thay vì chỉ nêu sắc thái giới từ ἐκ.
  terminology: 'Giữ “ăn năn” là phù hợp với μετανοέω trong văn phong Kinh Thánh hiện đại. “Sự vô luân về tình dục” duy trì tính cụ thể của πορνεία mà không quyết định trước liệu trong văn cảnh biểu tượng nó có thêm hàm ý thờ hình tượng hay không. “Bà ấy” có thể giữ nguyên: đây là cách quy chiếu tự nhiên tới người phụ nữ đã được nêu ở văn mạch trước, không tự thêm một lời đánh giá.'
