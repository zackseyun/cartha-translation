review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng ba ý chính của câu: có sự bền bỉ, đã chịu đựng vì danh của Đấng nói, và chưa hề kiệt sức. Tuy nhiên, “sự kiên trì” sát với danh từ ὑπομονή hơn “lòng kiên trì”, và mệnh đề cuối nên giữ rõ sắc thái hoàn thành bằng cách nói “đã không hề mệt mỏi.”'
  naturalness: Cú pháp liệt kê với chủ ngữ được lược ở các mệnh đề sau là tự nhiên trong tiếng Việt. “Ngươi/Ta” thuộc văn phong trang trọng, phù hợp với lời phán trực tiếp trong Khải Huyền; viết hoa “Ta” nhất quán với quy ước tôn kính.
  terminology: “Sự kiên trì” diễn đạt sự bền bỉ/kiên định dưới áp lực mà không thu hẹp thành một cảm xúc nội tâm. “Đã chịu đựng” giữ được ý βαστάζω trong ngữ cảnh mà không xác định loại gian khó. “Vì danh Ta” bảo toàn thành ngữ và sắc thái nguyên nhân/mục đích của διὰ + đối cách.
  issues:
  - severity: low
    issue: “Lòng kiên trì” thêm sắc thái nội tâm không cần thiết.
    rationale: Ὑπομονή là phẩm chất/sự bền bỉ được sở hữu; “sự kiên trì” là cách gọi trực tiếp và trung tính hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: Mệnh đề cuối chưa biểu thị rõ thì hoàn thành của κεκοπίακες.
    rationale: “Không hề mệt mỏi” tự nhiên, nhưng thêm “đã” giúp phản ánh việc người nhận đã không trở nên mệt mỏi/kiệt sức đến nay, mà không ép một cách hiểu cụ thể về lao động.
  - severity: low
    issue: Chú thích b dùng cụm “không trở nên mệt nhọc” chưa tự nhiên.
    rationale: “Không trở nên mệt mỏi” hoặc “không kiệt sức” tự nhiên hơn; chú thích cũng cần nêu khả năng liên hệ với lao nhọc mà không biến mệnh đề thành khẳng định rằng họ không lao động.
  revised_text: Ngươi có sự kiên trì, đã chịu đựng vì danh Ta[a], và đã không hề mệt mỏi[b].
