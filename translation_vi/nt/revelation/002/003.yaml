  to: Ngươi có sự kiên trì, đã chịu đựng vì danh Ta[a], và đã không hề mệt mỏi[b].
  rationale: Bản sửa thay “lòng kiên trì” bằng “sự kiên trì” để bám sát hơn danh từ ὑπομονή, thêm “đã” ở mệnh đề cuối để biểu đạt tốt hơn thì hoàn thành, và làm mượt chú thích b. Trật tự ba mệnh đề, sự mơ hồ về loại gian khó/lao nhọc, cùng các vị trí neo chú thích đều được giữ nguyên.
