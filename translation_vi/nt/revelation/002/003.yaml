source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: vi
  text: Ngươi có sự kiên trì, đã chịu đựng vì danh Ta[a], và đã không hề mệt mỏi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi danh Ta” hoặc “vì cớ danh Ta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã không trở nên mệt mỏi” hoặc “đã không kiệt sức.” Động từ này cũng có thể gợi đến sự lao nhọc: “đã không mệt mỏi vì lao nhọc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: lòng kiên trì
  rationale: Danh từ ὑπομονή chỉ sự bền lòng, vững chí dưới thử thách. “Lòng kiên trì” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa thành sự nhẫn nại thụ động.
- source_word: ἔχεις
  choice: ngươi có
  rationale: Giữ trực tiếp thể hiện tại và lời khen dành cho đối tượng số ít. “Ngươi” phù hợp với lời phán trang trọng trong văn cảnh Khải Huyền.
- source_word: ἐβάστασας
  choice: đã chịu đựng
  rationale: βαστάζω có thể mang nghĩa mang, gánh hoặc chịu đựng. Trong văn cảnh này, từ chỉ việc chịu sức nặng hay gian khó; “đã chịu đựng” diễn đạt tự nhiên mà không xác định một hình thức bắt bớ cụ thể.
- source_word: διὰ τὸ ὄνομά μου
  choice: vì danh ta
  rationale: διά với đối cách có thể diễn tả nguyên nhân hoặc mục đích. “Vì danh ta” giữ thành ngữ Kinh Thánh ngắn gọn và để ngỏ sắc thái “bởi danh ta” hay “vì cớ danh ta”.
- source_word: οὐ κεκοπίακες
  choice: không hề mệt mỏi
  rationale: κοπιάω có thể chỉ lao nhọc hoặc trở nên mệt mỏi. Trong cấu trúc phủ định song song với sự kiên trì, “không hề mệt mỏi” diễn tả trạng thái còn tiếp tục của thì hoàn thành, đồng thời không loại bỏ hoàn toàn liên hệ với sự lao nhọc.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ chịu đựng và kiên trì trong lời khen
  choice: Câu này khen sự bền lòng và chịu gian khó vì danh Chúa Giê-su, nhưng không xác định cụ thể đó là hình thức bắt bớ hay công việc nào.
  alternative: Mệnh đề cuối có thể được hiểu hẹp hơn theo nghĩa “ngươi không mệt mỏi vì lao nhọc” hoặc liên hệ trực tiếp với công việc phục vụ.
  rationale: Cách dịch giữ lời khen và sự căng nghĩa của nguyên văn, không đưa thêm một quan niệm cụ thể về bắt bớ, chức vụ hay phần thưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi/ta” duy trì lời phán trực tiếp, long trọng trong Khải Huyền. Các liên từ được tiết giảm vừa phải để câu tiếng Việt tự nhiên, trong khi vẫn giữ ba ý khen nối tiếp của nguyên văn.
