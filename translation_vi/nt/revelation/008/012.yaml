id: REV.8.12
reference: Revelation 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: vi
  text: Thiên sứ thứ tư thổi kèn. Một phần ba mặt trời, một phần ba mặt trăng và một phần ba các ngôi sao bị đánh, khiến một phần ba của chúng bị tối đi; ban ngày không chiếu sáng trong một phần ba thời gian[a], và ban đêm cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để ban ngày không chiếu sáng trong một phần ba thời gian.” Cấu trúc Hy Lạp với ἵνα cũng có thể mang sắc thái mục đích, thay vì chủ yếu diễn tả kết quả.'
    reason: Bảo tồn khả năng hiểu ἵνα theo sắc thái mục đích hoặc kết quả.
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Động từ σαλπίζω chỉ hành động làm cho kèn vang lên; “thổi kèn” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐπλήγη
  choice: bị đánh
  rationale: Dạng bị động của πλήσσω mang nghĩa bị đánh hoặc bị giáng vào; “bị đánh” giữ được hình ảnh phán xét và thể bị động của nguyên văn.
- source_word: τὸ τρίτον
  choice: một phần ba
  rationale: Cách dịch này truyền đạt trực tiếp tỷ lệ được lặp lại trong câu và tự nhiên trong tiếng Việt.
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: mặt trời / mặt trăng / các ngôi sao
  rationale: Đây là các danh từ chỉ thiên thể, được dịch theo nghĩa trực tiếp.
- source_word: ἵνα
  choice: khiến
  rationale: Trong mạch văn này, ἵνα có thể giới thiệu kết quả hoặc mục đích. “Khiến” diễn đạt tự nhiên sắc thái kết quả, còn sắc thái mục đích được giữ trong chú thích.
- source_word: σκοτισθῇ
  choice: bị tối đi
  rationale: Giữ thể bị động và diễn tả việc ánh sáng của các thiên thể bị suy giảm.
- source_word: τὸ τρίτον αὐτῶν
  choice: một phần ba ánh sáng của chúng
  rationale: Đại từ số nhiều quy chiếu chung đến mặt trời, mặt trăng và các ngôi sao. Việc thêm “ánh sáng” làm rõ điều bị tối đi theo ngữ cảnh mà không xác định cơ chế của hiện tượng.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: ban ngày không chiếu sáng
  rationale: φαίνω có thể mang nghĩa chiếu sáng hoặc xuất hiện; trong bối cảnh các thiên thể bị tối đi, “không chiếu sáng” giữ đúng hình ảnh ánh sáng bị hạn chế.
- source_word: τὸ τρίτον αὐτῆς
  choice: trong một phần ba thời gian
  rationale: Cụm từ chỉ phần bị ảnh hưởng của ban ngày; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ giới hạn định lượng của nguyên văn.
- source_word: ἡ νὺξ ὁμοίως
  choice: và ban đêm cũng vậy
  rationale: ὁμοίως cho biết giới hạn tương tự cũng áp dụng cho ban đêm; cách dịch ngắn gọn và trung thành.
theological_decisions:
- issue: Bản chất của hình ảnh phán xét trên vũ trụ
  choice: Trình bày trực tiếp việc các thiên thể bị tối đi như ngôn ngữ khải huyền về sự phán xét, không xác định đó là hoàn toàn theo nghĩa đen, hoàn toàn mang tính biểu tượng, hay gồm cả hai.
  alternative: Giải thích đây hoặc là một biến cố thiên văn hoàn toàn theo nghĩa đen, hoặc là biểu tượng thuần túy về biến động chính trị hay vũ trụ.
  rationale: Câu này mô tả sự tối tăm giáng trên một phần ba các thiên thể, ban ngày và ban đêm, nhưng không giải thích bản chất của hình ảnh. Bản dịch cần giữ nguyên độ mở thần học ấy.
- issue: Sắc thái của ἵνα
  choice: Dùng cách diễn đạt thiên về kết quả trong chính văn và ghi nhận sắc thái mục đích trong chú thích.
  alternative: 'Dịch toàn bộ mệnh đề theo sắc thái mục đích: “để ... không chiếu sáng.”'
  rationale: ἵνα cùng động từ giả định có thể biểu thị mục đích hoặc kết quả trong văn cảnh này; không nên loại bỏ một trong hai khả năng.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu được chia sau hành động thổi kèn để tránh chuỗi liên từ nặng nề, trong khi vẫn giữ nguyên trình tự sự kiện và sự lặp lại nhấn mạnh của “một phần ba”.
