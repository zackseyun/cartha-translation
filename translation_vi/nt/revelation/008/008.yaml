id: REV.8.8
reference: Revelation 8:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: vi
  text: Và thiên sứ thứ hai thổi kèn; rồi một vật như một ngọn núi lớn đang cháy rực lửa bị ném vào biển, và một phần ba biển hóa thành máu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và như một ngọn núi lớn đang cháy rực lửa”; tiếng Hy Lạp biểu thị sự tương tự, không nhất thiết là đồng nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Động từ σαλπίζω có nghĩa là thổi hoặc làm vang tiếng kèn; “thổi kèn” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt và đối tượng được hàm ý từ ngữ cảnh.
- source_word: ὡς
  choice: một vật giống như
  rationale: ὡς biểu thị sự tương tự chứ không nhất thiết xác định đồng nhất; cách dịch này giữ rõ tính chất thị kiến mà không khẳng định đó thật sự là một ngọn núi.
- source_word: ὄρος μέγα
  choice: ngọn núi lớn
  rationale: Diễn đạt trực tiếp cụm danh từ–tính từ, giữ sắc thái trang trọng và tầm vóc của hình ảnh khải huyền.
- source_word: πυρὶ καιόμενον
  choice: đang cháy rực trong lửa
  rationale: Giữ hình ảnh vật đang bốc cháy cùng yếu tố “lửa”, đồng thời dùng lối nói tự nhiên, sống động trong tiếng Việt mà không suy đoán đó là núi lửa hay thiên thể.
- source_word: ἐβλήθη
  choice: bị ném
  rationale: Thể bị động aorist cho biết vật ấy bị ném xuống; “bị ném” hiện đại và không thêm mức độ mạnh như “bị quăng mạnh”.
- source_word: εἰς τὴν θάλασσαν
  choice: xuống biển
  rationale: Trong chuyển động từ trên cao vào biển, “xuống biển” tự nhiên trong tiếng Việt và tương ứng với εἰς theo ngữ cảnh.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: một phần ba biển
  rationale: Đây là cách diễn đạt phân lượng tự nhiên, giữ nguyên tỷ lệ phán xét được nêu trong sách Khải Huyền.
- source_word: αἷμα
  choice: máu
  rationale: Danh từ có nghĩa trực tiếp là “máu”; không cần thêm lời giải thích mang tính diễn giải.
theological_decisions:
- issue: Bản chất của vật giống ngọn núi
  choice: Dịch rõ đây là “một vật giống như ngọn núi” mà không xác định bản chất của nó.
  alternative: Hiểu đó là núi theo nghĩa đen, một thiên thể, hoặc biểu tượng của sự phán xét.
  rationale: Từ ὡς đánh dấu sự tương tự. Bản dịch cần giữ sự mở ngỏ của thị kiến, không tự quyết định hình ảnh là theo nghĩa đen, nghĩa biểu tượng, hay cả hai.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” và “thổi kèn” phù hợp văn mạch Kinh Thánh; tránh thuật ngữ cổ và tránh giải thích hình ảnh theo một hệ phái. Dấu chú thích [a] được đặt sau mệnh đề liên quan đến phép so sánh.
