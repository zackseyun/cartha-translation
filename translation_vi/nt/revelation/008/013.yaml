id: REV.8.13
reference: Revelation 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: vi
  text: 'Rồi tôi thấy và nghe một con đại bàng[a] đang bay giữa trời[b], cất tiếng lớn nói rằng: “Khốn thay! Khốn thay! Khốn thay cho những người sống trên đất, vì những tiếng kèn còn lại của ba thiên sứ sắp thổi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “một thiên sứ” thay cho “một con đại bàng”.
    reason: textual_variant
  - marker: b
    text: Cũng có thể dịch là “giữa không trung”; từ Hy Lạp chỉ vùng trời ở điểm cao nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: đại bàng
  rationale: Danh từ này thông thường chỉ đại bàng. Ngữ cảnh không nói đến xác chết nên không ưu tiên nghĩa có thể có là “kền kền”; bản chính theo SBLGNT, còn dị bản “thiên sứ” được ghi ở chú thích.
- source_word: μεσουρανήματι
  choice: giữa trời
  rationale: Chỉ vùng trời cao nhất hoặc khoảng trời rộng ngay trên cao. “Giữa trời” tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái thị kiến và tầm vóc vũ trụ của câu.
- source_word: φωνῇ μεγάλῃ
  choice: cất tiếng lớn
  rationale: Cách diễn đạt tự nhiên, trang trọng, truyền đạt lời công bố vang lớn mà không thêm ý giải thích.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Khốn thay! Khốn thay! Khốn thay
  rationale: Giữ nguyên ba lần lặp để bảo toàn cường độ tu từ và âm hưởng tiên tri.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: những người sống trên đất
  rationale: Diễn đạt rõ ràng, tự nhiên đối tượng của lời khốn; “trên đất” giữ liên hệ với cụm từ lặp lại trong sách Khải Huyền mà không diễn giải thêm tình trạng thuộc linh của họ.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: vì những tiếng kèn còn lại
  rationale: Trong ngữ cảnh, ἐκ nêu nguyên nhân nên dịch là “vì”; φωναί của kèn được diễn đạt tự nhiên là “tiếng kèn”, còn λοιπῶν là “còn lại”.
- source_word: τῶν τριῶν ἀγγέλων
  choice: của ba thiên sứ
  rationale: Trong bối cảnh khải huyền này, ἄγγελοι là các thiên sứ, không phải sứ giả loài người.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: sắp thổi
  rationale: μέλλω với động từ nguyên mẫu biểu thị điều sắp xảy ra; “thổi” tự nhiên trong tiếng Việt vì đối tượng là kèn đã hiện rõ ngay trước đó.
theological_decisions:
- issue: Dị bản về sứ giả bay giữa trời
  choice: một con đại bàng
  alternative: một thiên sứ
  rationale: Bản chính theo SBLGNT với ἀετοῦ, nghĩa là “đại bàng”. Dị bản “thiên sứ” có trong một số thủ bản được giữ ở chú thích để người đọc biết, nhưng không thay thế bản văn nguồn được cung cấp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ba lời “Khốn thay” thành ba câu cảm thán để tái hiện sức nặng của lời cảnh báo. Các dấu chú thích được đặt ngay sau những từ mà chúng giải thích.
