  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố của tiếng Hy Lạp: tên ngôi sao, phép lặp giữa Ἄψινθος và ἄψινθον, tỷ lệ một phần ba, nguyên nhân chết “vì nước,” và mệnh đề cuối quy chiếu về nước đã bị làm đắng. “Hóa thành ngải đắng” giữ được hình ảnh biến đổi cụ thể của εἰς ἄψινθον mà không diễn giải thêm hành động uống nước hay tác nhân làm đắng.'
  naturalness: Câu văn hiện đại, rõ ràng và có register trang trọng phù hợp văn cảnh Khải Huyền. “Tên ngôi sao ấy là Ngải Đắng” và sự đối ứng “Ngải Đắng/ngải đắng” tự nhiên trong vai trò tên riêng và danh từ chung. Cụm “bởi nước đã bị làm cho đắng” làm rõ quy chiếu vốn có thể mơ hồ trong tiếng Việt mà không làm đổi nghĩa.
  terminology: “Ngải đắng” là cách gọi phù hợp cho wormwood và được viết hoa hợp lý khi là tên ngôi sao. “Nước” cho ὕδατα, “nhiều người” cho πολλοὶ τῶν ἀνθρώπων, và “đã bị làm cho đắng” cho bị động ἐπικράνθησαν đều chính xác. Chú thích a bảo toàn liên hệ từ vựng trung tâm; chú thích b phân biệt điều được ngụ ý với điều không được phát biểu trong nguyên văn.
