id: REV.8.11
reference: Revelation 8:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: vi
  text: Tên ngôi sao ấy là Ngải Đắng[a]. Một phần ba nước hóa thành ngải đắng, và nhiều người đã chết vì nước ấy[b], bởi nước đã bị làm cho đắng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp Ἄψινθος/ἄψινθον chỉ ngải đắng, một loài cây nổi tiếng vì vị rất đắng. Việc lặp lại cùng một từ nối tên ngôi sao với tình trạng đắng của nước.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nói họ “chết vì nước”; việc uống nước được ngụ ý nhưng không được nói rõ.
    reason: translation_clarity
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος
  choice: tên ngôi sao ấy
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ nguyên ý chỉ tên gọi của ngôi sao trong khải tượng.
- source_word: λέγεται
  choice: là
  rationale: Trong cấu trúc nói về tên gọi, tiếng Việt tự nhiên dùng “tên… là”; dịch máy móc là “được gọi” sẽ nặng và thừa.
- source_word: Ἄψινθος / ἄψινθον
  choice: Ngải Đắng / ngải đắng
  rationale: “Ngải đắng” chỉ loài cây có vị rất đắng; viết hoa khi làm tên riêng của ngôi sao và viết thường khi nói về nước, qua đó giữ mối liên hệ do nguyên văn lặp lại cùng một từ.
- source_word: ἐγένετο … εἰς ἄψινθον
  choice: hóa thành ngải đắng
  rationale: Thể hiện sự biến đổi hay kết quả, đồng thời giữ hình ảnh cụ thể của nguyên văn thay vì chỉ diễn giải là “trở nên đắng”.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: một phần ba nước
  rationale: Cách nói gọn, tự nhiên trong tiếng Việt và giữ chính xác tỷ lệ của cấu trúc bộ phận.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: nhiều người
  rationale: ἄνθρωποι chỉ con người nói chung, không riêng nam giới; tiếng Việt không cần tái hiện cấu trúc bộ phận một cách cứng nhắc.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: đã chết vì nước ấy
  rationale: ἐκ biểu thị nguồn hay nguyên nhân. “Vì nước ấy” rõ và tự nhiên, nhưng không thêm hành động “uống” vốn chỉ được ngụ ý chứ không được nói rõ.
- source_word: ὅτι ἐπικράνθησαν
  choice: bởi nước đã bị làm cho đắng
  rationale: Nêu rõ chủ thể được ngầm hiểu là nước và giữ sắc thái bị động của động từ Hy Lạp.
theological_decisions:
- issue: Chủ thể của động từ bị động ἐπικράνθησαν
  choice: Hiểu là nước đã bị làm cho đắng.
  alternative: Hiểu là những người ấy trở nên cay đắng hoặc bị tác hại.
  rationale: 'Danh từ số nhiều gần nhất và mạch văn đều quy chiếu về “nước”: người ta chết vì nước đã trở nên đắng. Bản dịch làm rõ quy chiếu này nhưng không thêm tác nhân gây ra sự biến đổi.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngải Đắng” như tên riêng nhưng “ngải đắng” khi chỉ kết quả xảy đến với nước, nhằm bảo toàn phép lặp từ quan trọng trong nguyên văn. Giữ hình ảnh cụ thể “hóa thành ngải đắng” và sắc thái bị động ở mệnh đề cuối.
