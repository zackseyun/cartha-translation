id: REV.8.6
reference: Revelation 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: vi
  text: Bảy thiên sứ có bảy chiếc kèn đã tự chuẩn bị để thổi kèn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “làm cho kèn vang lên.” Động từ Hy Lạp có nghĩa là “thổi kèn” hoặc “làm cho kèn vang lên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: thiên sứ
  rationale: Trong bối cảnh khải huyền này, từ này chỉ các hữu thể thuộc trời; “thiên sứ” là cách gọi tự nhiên và quen thuộc trong tiếng Việt hiện đại.
- source_word: ἔχοντες
  choice: cầm
  rationale: Phân từ diễn tả việc bảy thiên sứ đang có các kèn trong tay; “cầm” tự nhiên và cụ thể hơn “có” trong cảnh thuật này.
- source_word: σάλπιγγας
  choice: kèn
  rationale: σάλπιγξ chỉ loại kèn dùng để phát tín hiệu; “kèn” giữ được hình ảnh quen thuộc trong văn chương khải huyền mà không áp đặt một kiểu nhạc cụ hiện đại quá cụ thể.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: chuẩn bị
  rationale: Cụm động từ với đại từ phản thân có nghĩa họ tự làm cho mình sẵn sàng. Trong tiếng Việt, “chuẩn bị” tự nhiên đã hàm ý chủ thể tự chuẩn bị trong cấu trúc này.
- source_word: ἵνα σαλπίσωσιν
  choice: để thổi kèn
  rationale: ἵνα nêu mục đích, còn σαλπίζω nghĩa là làm cho kèn phát tiếng. “Để thổi kèn” diễn đạt rõ mục đích và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là ἄγγελοι trong bối cảnh khải huyền
  choice: các thiên sứ thuộc trời
  alternative: các sứ giả loài người
  rationale: Khung cảnh trên trời và việc họ được giao bảy chiếc kèn cho thấy đây là các thiên sứ, nhưng bản dịch không thêm những mô tả thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bấy giờ” nối câu với diễn tiến trước đó tự nhiên hơn việc dịch máy móc Καὶ là “Và”. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
