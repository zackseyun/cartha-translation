id: REV.8.10
reference: Revelation 8:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: vi
  text: Thiên sứ thứ ba thổi kèn; một ngôi sao lớn[c] từ trời[a] rơi xuống, cháy như ngọn đuốc[b]. Nó rơi xuống một phần ba các sông và các nguồn nước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “từ bầu trời.” Từ Hy Lạp có thể chỉ thiên giới hoặc bầu trời; “trời” được dùng để giữ độ mở nghĩa trong bối cảnh thị kiến khải huyền.
    reason: lexical_alternative
  - marker: b
    text: Hay “cháy như ngọn đèn.” Từ Hy Lạp có thể chỉ đuốc hoặc đèn; “ngọn đuốc” phù hợp hơn với hình ảnh ngôi sao đang rực cháy và rơi xuống.
    reason: lexical_alternative
  - marker: c
    text: Bản văn giữ nguyên hình ảnh “ngôi sao”. Có những cách hiểu khác nhau, như một hữu thể thiên sứ, một vật thể giống thiên thạch, hoặc một quyền lực mang tính biểu tượng.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Động từ σαλπίζω có nghĩa là thổi hoặc vang tiếng kèn; “thổi kèn” tự nhiên, rõ nghĩa trong tiếng Việt và phù hợp chuỗi thị kiến.
- source_word: ἀστὴρ μέγας
  choice: một ngôi sao lớn
  rationale: Giữ nguyên hình ảnh của bản Hy Lạp; “lớn” có thể chỉ kích thước hoặc tầm vóc nổi bật mà không giải thích thêm.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: οὐρανός có thể chỉ trời theo nghĩa thiên giới hoặc bầu trời; “trời” giữ được độ mở nghĩa và hợp văn phong khải huyền.
- source_word: καιόμενος ὡς λαμπάς
  choice: cháy như ngọn đuốc
  rationale: καιόμενος diễn tả trạng thái đang cháy, còn λαμπάς trong hình ảnh này phù hợp nhất với ngọn đuốc đang rực cháy.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: rơi xuống ... Nó rơi xuống
  rationale: 'Giữ sự lặp lại của động từ Hy Lạp nhằm bảo toàn nhịp điệu và sự nhấn mạnh: trước hết là chuyển động từ trời, sau đó là nơi nó rơi vào.'
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: xuống một phần ba các sông
  rationale: τὸ τρίτον trong chuỗi tai họa của sách Khải Huyền mang nghĩa định lượng là một phần ba; cách diễn đạt này rõ ràng trong tiếng Việt hiện đại.
- source_word: πηγὰς τῶν ὑδάτων
  choice: các nguồn nước
  rationale: πηγή chỉ nguồn hoặc mạch nước; “các nguồn nước” tự nhiên hơn lối dịch sát cấu trúc sở hữu Hy Lạp nhưng vẫn truyền đạt đầy đủ ý nghĩa.
theological_decisions:
- issue: Đối tượng mà ngôi sao sa xuống tượng trưng
  choice: Dịch nguyên hình ảnh là “một ngôi sao lớn”, không xác định đó là hữu thể thiên sứ, thiên thể hay quyền lực biểu tượng.
  alternative: Giải thích là một thiên sứ, một vật thể giống thiên thạch, hoặc một nhà cai trị/quyền lực mang tính biểu tượng.
  rationale: Câu này gọi đối tượng là một ngôi sao nhưng không trực tiếp xác định ý nghĩa biểu tượng của nó; giữ nguyên hình ảnh bảo toàn tính hàm hồ và tránh đưa cách giải thích vào bản dịch.
- issue: Nghĩa của οὐρανός
  choice: Dùng “trời” để có thể được hiểu là thiên giới hoặc bầu trời.
  alternative: Dùng riêng “thiên đàng” hoặc “bầu trời”.
  rationale: Nguyên ngữ cho phép cả hai sắc thái; “trời” trong tiếng Việt giữ được độ mở nghĩa phù hợp với thị kiến khải huyền.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Cấu trúc câu giữ nhịp kể của thị kiến; sự lặp lại “rơi xuống” phản ánh nguyên văn. Các từ “thiên sứ”, “ngọn đuốc”, “một phần ba” và “nguồn nước” là những cách nói phổ thông nhưng vẫn phù hợp sắc thái Kinh Thánh.
