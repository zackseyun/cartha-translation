id: REV.8.3
reference: Revelation 8:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: vi
  text: Một thiên sứ khác đến và đứng bên bàn thờ, tay cầm một lư hương bằng vàng[a]. Vị ấy được ban cho rất nhiều hương để dâng cùng lời cầu nguyện của tất cả các thánh đồ[b] trên bàn thờ bằng vàng ở trước ngai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một dụng cụ xông hương bằng vàng.”
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “để vị ấy trao [hương] cho lời cầu nguyện của tất cả các thánh đồ”; trong ngữ cảnh, có thể hiểu hương được dâng cùng hoặc được thêm vào lời cầu nguyện của họ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: một thiên sứ khác
  rationale: Diễn tả một thiên sứ nữa xuất hiện trong trình tự, không hàm ý đây là một loại hữu thể khác.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: đứng bên bàn thờ
  rationale: Với ἐπί và sở hữu cách trong ngữ cảnh này, “bên bàn thờ” diễn tả vị trí tự nhiên hơn và tránh gây hiểu lầm rằng thiên sứ đứng trên mặt bàn thờ.
- source_word: λιβανωτὸν χρυσοῦν
  choice: một lư hương bằng vàng
  rationale: λιβανωτός chỉ dụng cụ dùng để đốt hương; “lư hương” là cách gọi ngắn gọn, quen thuộc trong tiếng Việt, còn χρυσοῦν được thể hiện bằng “bằng vàng”.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: vị ấy được ban cho rất nhiều hương
  rationale: Giữ cấu trúc bị động của nguyên văn; “hương” được dùng như danh từ khối, còn πολλὰ được diễn đạt tự nhiên là “rất nhiều”.
- source_word: ἵνα δώσει
  choice: để dâng
  rationale: Mệnh đề ἵνα nêu mục đích. Trong bối cảnh nghi lễ có hương và bàn thờ, δίδωμι mang ý trình lên hay dâng, dù nghĩa sát chữ là “trao/đưa”.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: cùng lời cầu nguyện của tất cả các thánh đồ
  rationale: Cách ở đây có quan hệ cú pháp khó xác định; “cùng” truyền đạt hợp lý hình ảnh hương đi kèm lời cầu nguyện mà không phát triển thêm một học thuyết ngoài câu.
- source_word: ἅγιοι
  choice: các thánh đồ
  rationale: Trong Khải Huyền, từ này thường chỉ những người thuộc về Đức Chúa Trời và được biệt riêng cho Ngài; “thánh đồ” là cách dịch ngắn gọn, quen thuộc.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: trên bàn thờ bằng vàng
  rationale: ἐπί với đối cách trong mạch hành động dâng hương chỉ hướng đến và đặt lễ vật lên bàn thờ.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: ở trước ngai
  rationale: Diễn đạt quan hệ không gian của ἐνώπιον một cách rõ ràng và tự nhiên.
theological_decisions:
- issue: Mối liên hệ giữa hương và lời cầu nguyện của các thánh đồ
  choice: Hương được dâng cùng với lời cầu nguyện của tất cả các thánh đồ.
  alternative: 'Theo sát cấu trúc cách ngữ pháp: hương được “trao cho/thêm vào lời cầu nguyện” của tất cả các thánh đồ.'
  rationale: Cú pháp Hy Lạp cô đọng và có thể được hiểu theo hơn một cách. Bản chính dùng “cùng” vì phù hợp với hình ảnh thờ phượng tại bàn thờ, còn chú thích giữ lại nét bất thường của nguyên văn và không khẳng định một giáo lý chi tiết về vai trò trung gian của thiên sứ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu văn rõ và dễ đọc. Dùng “thiên sứ”, “lư hương”, “thánh đồ” và “ngai” là các thuật ngữ Kinh Thánh quen thuộc; chú thích giải thích những chỗ có thể khó hiểu hoặc còn mơ hồ trong nguyên văn.
