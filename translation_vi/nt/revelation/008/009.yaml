source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: vi
  text: Một phần ba số sinh vật trong biển—tức là những sinh vật có sự sống—đã chết,[a] và một phần ba số tàu thuyền đã bị phá hủy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “có sinh mạng” hoặc “là những sinh vật sống”. Tiếng Hy Lạp: “những [sinh vật] có sự sống/linh hồn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: đã chết
  rationale: Động từ ἀποθνῄσκω ở thì aorist trực tiếp chỉ sự chết; “đã chết” tự nhiên và chính xác trong tiếng Việt.
- source_word: τὸ τρίτον
  choice: một phần ba
  rationale: Cách diễn đạt định lượng tự nhiên trong tiếng Việt, giữ nguyên tỷ lệ của nguyên văn.
- source_word: κτισμάτων
  choice: các sinh vật
  rationale: κτίσμα có thể là vật thọ tạo hoặc sinh vật; cụm bổ nghĩa τὰ ἔχοντα ψυχάς cho thấy ở đây nói đến các sinh vật sống trong biển.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: trong biển
  rationale: Diễn đạt ngắn gọn, tự nhiên và giữ đúng ý chỉ địa điểm.
- source_word: τὰ ἔχοντα ψυχάς
  choice: tức là những loài có sự sống
  rationale: Cụm này theo sát ý “những loài có ψυχαί” nhưng tránh khiến độc giả hiểu đây là một khẳng định kỹ thuật về bản thể linh hồn của động vật; dấu gạch ngang giữ sắc thái giải thích của cụm đồng vị.
- source_word: ψυχάς
  choice: sự sống
  rationale: Trong ngữ cảnh các sinh vật biển, ψυχή chỉ sự sống hữu thể hoặc sinh mạng; “sự sống” là cách nói tự nhiên, đồng thời chú thích bảo lưu các khả năng từ vựng khác.
- source_word: πλοίων
  choice: tàu thuyền
  rationale: πλοῖον có thể chỉ tàu hoặc thuyền; “tàu thuyền” bao quát và tự nhiên trong bối cảnh hàng hải.
- source_word: διεφθάρησαν
  choice: bị phá hủy
  rationale: Thể bị động của διαφθείρω ở đây chỉ sự hủy hoại vật chất trong tai họa trên biển, không phải sự băng hoại đạo đức.
theological_decisions:
- issue: Cách dịch ψυχάς khi nói về các sinh vật biển
  choice: Dịch trong chính văn là “có sự sống” và ghi chú nghĩa sát chữ.
  alternative: “có linh hồn sống”, “có sinh mạng”, hoặc “là những sinh vật sống”
  rationale: Ngữ cảnh nhấn mạnh sự sống của các sinh vật, không nhất thiết đưa ra một giáo lý kỹ thuật về linh hồn động vật. Cách dịch này tự nhiên trong tiếng Việt, còn chú thích giữ lại độ rộng và sắc thái của ψυχή.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tàu thuyền” để bao quát πλοῖον; dùng cụm giải thích giữa hai dấu gạch ngang nhằm phản ánh cấu trúc đồng vị của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
