id: REV.8.5
reference: Revelation 8:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: vi
  text: Rồi thiên sứ lấy lư hương, đổ đầy lư hương bằng lửa lấy từ bàn thờ, rồi ném xuống đất; liền có những tiếng sấm, những âm thanh[a], những tia chớp và một trận động đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những tiếng nói.” Từ Hy Lạp có thể chỉ tiếng nói có lời hoặc các âm thanh, tiếng động trong một cảnh thần hiển.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: lấy
  rationale: Dùng quá khứ kể chuyện tự nhiên trong tiếng Việt; động từ diễn tả thiên sứ cầm/lấy lư hương để thực hiện hành động tiếp theo.
- source_word: λιβανωτόν
  choice: lư hương
  rationale: Thuật ngữ ngắn gọn, quen thuộc trong văn cảnh thờ phượng, chỉ vật dụng dùng để đốt hương và đựng than lửa.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: đổ đầy lửa từ bàn thờ vào đó
  rationale: Diễn đạt tự nhiên trong tiếng Việt rằng lư hương được làm đầy bằng lửa lấy từ bàn thờ, đồng thời giữ rõ nguồn gốc biểu tượng của lửa.
- source_word: θυσιαστηρίου
  choice: bàn thờ
  rationale: Cách dịch tiêu chuẩn của thuật ngữ chỉ bàn thờ trong hình ảnh đền thờ.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: ném xuống đất
  rationale: “Ném” giữ được sức mạnh của hành động; “xuống đất” trong tiếng Việt tự nhiên và ở đây chỉ trái đất trong bối cảnh phán xét mang tầm vũ trụ.
- source_word: ἐγένοντο
  choice: liền có
  rationale: Diễn tả tự nhiên sự xuất hiện đột ngột của các hiện tượng sau hành động ném lư hương.
- source_word: βρονταὶ
  choice: những tiếng sấm
  rationale: Giữ sắc thái số nhiều, gợi các tiếng sấm liên tiếp.
- source_word: φωναὶ
  choice: những âm thanh
  rationale: φωνή có thể chỉ tiếng nói hoặc âm thanh. “Âm thanh” không mặc nhiên xác định có người nói, nên giữ được sự mơ hồ trong công thức thần hiển.
- source_word: ἀστραπαὶ
  choice: những tia chớp
  rationale: Cách diễn đạt hiện đại, tự nhiên và giữ số nhiều.
- source_word: σεισμός
  choice: một trận động đất
  rationale: Cách nói tự nhiên trong tiếng Việt cho danh từ đếm được số ít.
theological_decisions:
- issue: Nghĩa của γῆ trong bối cảnh phán xét khải huyền
  choice: đất, hiểu là trái đất
  alternative: mặt đất; xứ
  rationale: Hình ảnh phán xét trong Khải Huyền có phạm vi vũ trụ; cách dịch “xuống đất” tự nhiên trong tiếng Việt mà không giới hạn thành một địa phương hay chỉ bề mặt đất.
- issue: Nghĩa của φωναί trong công thức thần hiển
  choice: âm thanh
  alternative: tiếng nói
  rationale: Không có người nói nào được xác định. “Âm thanh” giữ nguyên khả năng đây là những tiếng động hoặc những tiếng nói, thay vì ngầm khẳng định có lời phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể dồn dập của chuỗi καί bằng “rồi” và dấu chấm phẩy; dùng thuật ngữ thờ phượng quen thuộc “lư hương,” “bàn thờ.”
