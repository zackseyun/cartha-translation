  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: vi
  text: Khói hương, cùng với những lời cầu nguyện của các thánh[b], từ tay thiên sứ bốc lên[a] trước mặt Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bay lên” hoặc “dâng lên”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “cùng với những lời cầu nguyện của các thánh”; cách diễn đạt này liên kết khói hương với những lời cầu nguyện nhưng không nói rõ rằng hai điều ấy là một.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: bay lên
  rationale: Động từ chỉ sự chuyển động hướng lên; “bay lên” tự nhiên khi nói về khói và vẫn giữ hình ảnh cụ thể.
- source_word: καπνὸς
  choice: khói
  rationale: Nghĩa thông thường là khói theo nghĩa cụ thể; không cần diễn giải thêm hình ảnh khải huyền.
- source_word: θυμιαμάτων
  choice: hương
  rationale: θυμίαμα chỉ hương dùng trong nghi lễ. “Hương” là cách nói tự nhiên, trang trọng và phù hợp với ngữ cảnh thờ phượng.
- source_word: ταῖς προσευχαῖς
  choice: cùng với những lời cầu nguyện
  rationale: Giữ quan hệ liên kết trong cách dùng tặng cách mà không xác định rằng hương đồng nhất với, chuyên chở hay tượng trưng cho các lời cầu nguyện.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: “Các thánh đồ” là thuật ngữ Kinh Thánh quen thuộc chỉ những người thuộc về Đức Chúa Trời, không hàm ý riêng về những người được một truyền thống về sau phong thánh.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: từ tay thiên sứ
  rationale: Giữ hình ảnh cụ thể của nguyên văn đồng thời diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt rõ ý ở trong sự hiện diện của Đức Chúa Trời và phù hợp với văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Mối quan hệ giữa hương và những lời cầu nguyện
  choice: “Khói hương cùng với những lời cầu nguyện ... bay lên”
  alternative: “Khói hương, tức là những lời cầu nguyện ...” hoặc “khói hương bay lên vì những lời cầu nguyện ...”
  rationale: Cấu trúc Hy Lạp liên kết khói hương với các lời cầu nguyện nhưng không minh nhiên đồng nhất hai điều ấy hoặc xác định quan hệ mục đích; bản dịch giữ nguyên độ mở thần học này.
- issue: Đối tượng được gọi là τῶν ἁγίων
  choice: “các thánh đồ” theo nghĩa rộng là dân thánh của Đức Chúa Trời
  alternative: “những người thánh” hoặc “dân thánh của Đức Chúa Trời”
  rationale: Giữ thuật ngữ Kinh Thánh truyền thống nhưng không thu hẹp nghĩa vào một hạng người được phong thánh theo quan niệm giáo phái về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ trật tự tương đối tự nhiên trong tiếng Việt, dùng “bay lên” cho hình ảnh khói và “các thánh đồ” theo nghĩa Kinh Thánh rộng.
