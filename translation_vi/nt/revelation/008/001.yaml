id: REV.8.1
reference: Revelation 8:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: vi
  text: Khi Ngài mở ấn thứ bảy[a], trên trời im lặng khoảng nửa giờ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp chỉ nói “mở ấn thứ bảy”; cũng có thể hiểu theo hành động là “phá ấn thứ bảy để mở ra”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bấy giờ trên trời xuất hiện sự im lặng trong khoảng nửa giờ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: Trong mạch tường thuật về một biến cố duy nhất, “khi” diễn đạt tự nhiên giá trị thời gian của ὅταν; “mỗi khi” sẽ gợi tính lặp lại không phù hợp.
- source_word: ἤνοιξεν
  choice: Ngài mở
  rationale: ἀνοίγω có nghĩa cơ bản là “mở”. Đại từ kính ngữ “Ngài” cung cấp chủ ngữ cần thiết trong tiếng Việt nhưng không nêu đích danh Chiên Con.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: ấn thứ bảy
  rationale: “Ấn” là cách gọi ngắn gọn, quen thuộc cho σφραγίς trong bối cảnh cuộn sách; số thứ tự được diễn đạt tự nhiên là “thứ bảy”.
- source_word: ἐγένετο σιγὴ
  choice: im lặng
  rationale: Cấu trúc tiếng Việt “trên trời im lặng” diễn đạt tự nhiên việc trạng thái yên lặng xuất hiện, đồng thời giữ sức nặng trang nghiêm của σιγή.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Ở đây οὐρανός chỉ thiên giới; “trên trời” là cách nói tiếng Việt tự nhiên và rõ nghĩa hơn “trong bầu trời”.
- source_word: ὡς ἡμιώριον
  choice: khoảng nửa giờ
  rationale: ὡς biểu thị sự ước lượng trước một khoảng thời gian; “khoảng nửa giờ” vừa chính xác vừa tự nhiên.
theological_decisions:
- issue: Chủ thể hàm ẩn của ἤνοιξεν
  choice: Dùng “Ngài” mà không nêu đích danh
  alternative: “Chiên Con mở” hoặc “người mở”
  rationale: Động từ Hy Lạp có chủ ngữ ngôi ba số ít hàm ẩn, theo văn cảnh chỉ về Chiên Con. “Ngài” duy trì liên kết ấy mà không thêm danh xưng vốn không có trong câu; đồng thời phù hợp văn phong trang trọng tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Trật tự câu được điều chỉnh theo tiếng Việt tự nhiên. Hai dấu chú thích đều xuất hiện trong chính văn và đặt sát nội dung liên quan.
