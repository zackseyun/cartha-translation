  source_fidelity: 'Bản dịch chuyển đạt đúng các yếu tố chính của câu Hy Lạp: mốc thời gian của ὅταν trong một biến cố tường thuật, hành động “mở” (ἤνοιξεν), “ấn thứ bảy,” sự im lặng xảy ra trên trời, và thời lượng ước chừng nửa giờ. “Ngài” phản ánh chủ ngữ số ít hàm ẩn mà không thêm danh xưng vào câu.'
  naturalness: “Khi Ngài mở ấn thứ bảy, trên trời im lặng khoảng nửa giờ” là câu tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Cấu trúc “trên trời im lặng” diễn đạt tự nhiên trạng thái im lặng diễn ra trong thiên giới; không cần thêm “có sự” vốn sẽ nặng câu.
  terminology: “Ấn thứ bảy,” “trên trời,” và “khoảng nửa giờ” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại và với nghĩa của σφραγίς, οὐρανός, và ὡς ἡμιώριον. Các chú thích giữ đúng tính chất phương án diễn đạt, không biến một suy luận ngữ cảnh thành nghĩa bắt buộc của nguyên văn.
