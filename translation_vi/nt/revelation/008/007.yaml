- from: Thiên sứ thứ nhất thổi kèn; liền có mưa đá và lửa trộn với máu đổ xuống đất.[a] Một phần ba đất bị thiêu rụi, một phần ba cây cối bị thiêu rụi, và mọi cỏ xanh đều bị thiêu rụi.
  to: Thiên sứ thứ nhất thổi kèn. Rồi có mưa đá và lửa trộn với máu bị ném xuống đất.[a] Một phần ba đất bị thiêu rụi, một phần ba cây cối bị thiêu rụi, và mọi cỏ xanh đều bị thiêu rụi.
  rationale: Sửa duy nhất cần thiết là thay “đổ xuống” bằng “bị ném xuống” để bảo toàn thể bị động và lực ngữ nghĩa của ἐβλήθη. Giữ “Thiên sứ” vì chủ thể hàm ẩn được xác định trực tiếp bởi văn cảnh, và giữ “đất” cùng chú thích để không áp đặt một trong các nghĩa khả dĩ của γῆ.
