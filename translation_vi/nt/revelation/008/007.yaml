  terminology: “Thiên sứ thứ nhất,” “thổi kèn,” “mưa đá,” “thiêu rụi,” và “cỏ xanh” đều phù hợp. “Đất” là lựa chọn có thể chấp nhận để giữ độ mở của γῆ; chú thích nên nêu rõ các khả năng mà không buộc cách hiểu địa lý.
