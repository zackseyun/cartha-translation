id: REV.8.7
reference: Revelation 8:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: vi
  text: Thiên sứ thứ nhất thổi kèn. Rồi có mưa đá và lửa trộn với máu bị ném xuống đất.[a] Một phần ba đất bị thiêu rụi, một phần ba cây cối bị thiêu rụi, và mọi cỏ xanh đều bị thiêu rụi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đất” (γῆ) cũng có thể chỉ “trái đất” hoặc “xứ”; trong ngữ cảnh này, từ này không xác định rõ phạm vi địa lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: Thiên sứ thứ nhất
  rationale: Danh từ “thiên sứ” được lược trong tiếng Hy Lạp nhưng được xác định rõ bởi văn cảnh gần về bảy thiên sứ cầm bảy chiếc kèn (Kh 8:2, 6). Tiếng Việt không thể dùng tự nhiên một mình “người thứ nhất” mà không gây mơ hồ ngoài ý muốn.
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Diễn đạt tự nhiên động từ σαλπίζω trong tiếng Việt; đối tượng là chiếc kèn đã rõ từ văn cảnh.
- source_word: ἐγένετο
  choice: liền có
  rationale: Giữ sắc thái sự kiện xuất hiện trong trình thuật khải huyền và nối tự nhiên với hành động thổi kèn.
- source_word: χάλαζα καὶ πῦρ
  choice: mưa đá và lửa
  rationale: Chuyển trực tiếp hai yếu tố hủy diệt, giữ nguyên hình ảnh sống động.
- source_word: μεμιγμένα ἐν αἵματι
  choice: trộn với máu
  rationale: Phản ánh trạng thái hòa trộn của μεμιγμένα và quan hệ kết hợp của ἐν, không giải thích hình ảnh theo nghĩa biểu tượng.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: đổ xuống đất
  rationale: Động từ số ít nhìn hiện tượng mưa đá và lửa như một toàn thể. “Đổ xuống” tự nhiên trong tiếng Việt đối với hiện tượng từ trời nhưng vẫn giữ ý bị quăng/ném xuống của thể bị động.
- source_word: τὸ τρίτον τῆς γῆς
  choice: một phần ba đất
  rationale: Diễn đạt tự nhiên cấu trúc phân lượng. “Đất” có thể chỉ mặt đất hoặc đất đai và không buộc người đọc hiểu rằng một phần ba toàn bộ hành tinh bị cháy.
- source_word: κατεκάη
  choice: bị thiêu rụi
  rationale: Thể hiện sắc thái mạnh của κατακαίω, tức bị lửa đốt đến mức hủy hoại, đồng thời giữ thể bị động.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: một phần ba cây cối
  rationale: Cách diễn đạt phân lượng tự nhiên, bao quát tập hợp các cây.
- source_word: πᾶς χόρτος χλωρός
  choice: mọi cỏ xanh
  rationale: Giữ hình ảnh cụ thể của χόρτος và nghĩa xanh tươi của χλωρός, tránh mở rộng thành toàn bộ thảm thực vật.
theological_decisions:
- issue: Phạm vi nghĩa của γῆ trong cảnh phán xét khải huyền
  choice: đất
  alternative: trái đất; xứ
  rationale: γῆ có thể chỉ đất, đất đai, xứ hoặc trái đất. “Đất” phù hợp ở cả hai lần xuất hiện và giữ được độ rộng nghĩa hơn “xứ” hay “trái đất”; chú thích nêu các khả năng thực sự.
- issue: Chủ thể được gọi là ὁ πρῶτος
  choice: Thiên sứ thứ nhất
  alternative: người thứ nhất; vị thứ nhất
  rationale: Mặc dù danh từ không được lặp lại trong câu này, văn cảnh trực tiếp xác định đó là một trong bảy thiên sứ. Việc bổ sung danh từ hàm ẩn giúp câu tiếng Việt rõ và tự nhiên mà không đưa thêm cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng nhịp câu dồn dập để giữ chuỗi καί của nguyên bản, nhưng lược bớt liên từ ở đầu mệnh đề thứ hai cho tự nhiên trong tiếng Việt. Dấu [a] đặt sau lần xuất hiện đầu của “đất” và áp dụng cho cả hai lần dùng γῆ.
