id: REV.8.2
reference: Revelation 8:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: vi
  text: Tôi thấy bảy thiên sứ đứng trước mặt Đức Chúa Trời[a], và họ được ban cho bảy chiếc kèn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang đứng trước mặt Đức Chúa Trời” hoặc “đã đứng trước mặt Đức Chúa Trời”; động từ hoàn thành trong tiếng Hy Lạp nhấn mạnh việc họ ở trong trạng thái đứng kéo dài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: Tôi thấy
  rationale: Động từ bất định quá khứ của ὁράω trong lời thuật khải tượng được chuyển tự nhiên là “Tôi thấy”, vừa rõ ràng vừa giữ sức nặng của việc nhìn thấy trong khải tượng.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: bảy thiên sứ
  rationale: “Thiên sứ” là cách gọi trang trọng, quen thuộc cho các hữu thể trên trời trong ngữ cảnh ngai Đức Chúa Trời. Tiếng Việt không có mạo từ xác định tương ứng, nhưng ngữ cảnh và mệnh đề quan hệ vẫn nhận diện đây là một nhóm cụ thể.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý nghĩa không gian—tương quan của ἐνώπιον.
- source_word: ἑστήκασιν
  choice: đứng
  rationale: Thì hoàn thành của ἵστημι nhấn mạnh trạng thái đứng đang tiếp diễn; “đứng” là cách diễn đạt gọn và tự nhiên nhất, còn các sắc thái về trạng thái kéo dài được ghi ở chú thích.
- source_word: ἐδόθησαν αὐτοῖς
  choice: họ được ban cho
  rationale: Giữ cấu trúc bị động và để người ban không được nêu rõ như nguyên văn. “Được ban cho” phù hợp văn phong trang trọng hơn “được cho”.
- source_word: ἑπτὰ σάλπιγγες
  choice: bảy chiếc kèn
  rationale: “Kèn” là từ thông dụng và phù hợp với hình ảnh khải huyền; loại từ “chiếc” khiến câu tự nhiên trong tiếng Việt mà không xác định thêm loại nhạc cụ.
theological_decisions:
- issue: Danh tính và địa vị của bảy thiên sứ
  choice: Dịch đơn giản là “bảy thiên sứ đứng trước mặt Đức Chúa Trời”, không chỉ định cấp bậc.
  alternative: “bảy tổng lãnh thiên sứ” hoặc diễn giải họ là một nhóm thiên sứ theo truyền thống hậu kỳ
  rationale: Nguyên văn gọi họ là ἄγγελοι, không dùng ἀρχάγγελοι và không xác định cấp bậc; bản dịch không nên đưa truyền thống giải thích về sau vào câu.
- issue: Chủ thể ban bảy chiếc kèn
  choice: 'Giữ thể bị động: “họ được ban cho”.'
  alternative: Nêu rõ Đức Chúa Trời là Đấng ban hoặc đổi sang chủ động “họ nhận lấy”
  rationale: Tiếng Hy Lạp không nêu tác nhân. Giữ thể bị động bảo toàn sự kín nhiệm và tránh xác quyết điều câu này không nói trực tiếp.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “thiên sứ” và “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông; tránh từ cổ và không thêm thuật ngữ chỉ cấp bậc thiên sứ.
