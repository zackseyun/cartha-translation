id: REV.21.23
reference: Revelation 21:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: vi
  text: Thành ấy không cần mặt trời hay mặt trăng chiếu sáng cho thành[a], vì vinh quang của Đức Chúa Trời đã soi sáng thành, và ngọn đèn của thành là Chiên Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rọi trên thành.” Nguyên văn Hy Lạp nói theo nghĩa đen là “chiếu cho/trên thành.”'
    reason: Giữ lại khả năng diễn đạt khác của dữ cách αὐτῇ đi với φαίνω.
lexical_decisions:
- source_word: πόλις
  choice: thành ấy
  rationale: Trong ngữ cảnh về Giê-ru-sa-lem mới, πόλις chỉ thành; thêm “ấy” giúp cách diễn đạt tiếng Việt tự nhiên và xác định rõ thành đang được nói đến.
- source_word: οὐ χρείαν ἔχει
  choice: không cần
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp “không có nhu cầu”, đồng thời giữ nguyên ý rằng thành không cần đến các nguồn sáng ấy.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: mặt trời hay mặt trăng
  rationale: “Hay” phù hợp với phủ định “không cần” và tái hiện cặp danh từ được nối bằng οὐδέ.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: chiếu sáng cho thành
  rationale: φαίνω với mặt trời và mặt trăng làm chủ thể mang nghĩa “chiếu sáng”; “cho thành” thể hiện đại từ dữ cách αὐτῇ mà không dùng đại từ “nó” kém trang trọng.
- source_word: δόξα
  choice: vinh quang
  rationale: “Vinh quang” là cách dịch trực tiếp, quen thuộc và giữ được sức nặng thần học của δόξα trong văn chương khải huyền.
- source_word: ἐφώτισεν
  choice: đã soi sáng
  rationale: Thể hiện hành động chiếu sáng cụ thể của động từ aorist, đồng thời phân biệt vừa đủ với φαίνω ở mệnh đề trước.
- source_word: λύχνος
  choice: ngọn đèn
  rationale: λύχνος là một chiếc đèn, không phải ánh sáng nói chung hay chân đèn; “ngọn đèn” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἀρνίον
  choice: Chiên Con
  rationale: Trong sách Khải Huyền, đây là tước hiệu chỉ Chúa Giê-xu; viết hoa biểu thị cách dùng như tước hiệu mà không thêm lời giải thích vào câu.
theological_decisions:
- issue: Quan hệ ẩn dụ trong câu “ngọn đèn của thành là Chiên Con”
  choice: 'Giữ trực tiếp hình ảnh ngọn đèn: “ngọn đèn của thành là Chiên Con.”'
  alternative: “Chiên Con là ánh sáng của thành” hoặc “ánh sáng của thành là Chiên Con.”
  rationale: Bản Hy Lạp dùng λύχνος, “ngọn đèn”, chứ không dùng từ chung chỉ “ánh sáng”. Cách dịch này giữ sự phân biệt giữa vinh quang của Đức Chúa Trời là điều soi sáng thành và Chiên Con là ngọn đèn của thành.
- issue: Hình ảnh Đức Chúa Trời soi sáng thành
  choice: Dịch đúng lời khẳng định của câu mà không thêm lời giải thích về tình trạng tương lai của mặt trời và mặt trăng.
  alternative: Mở rộng câu để nói Đức Chúa Trời thay thế hoặc loại bỏ mọi nguồn sáng thọ tạo.
  rationale: Câu chỉ nói thành không cần mặt trời hay mặt trăng vì vinh quang của Đức Chúa Trời soi sáng thành; bản dịch không giải quyết những vấn đề cánh chung mà nguyên văn không trực tiếp nói đến.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Lặp lại “thành” thay cho đại từ “nó” để giữ giọng văn trang nghiêm và tránh mơ hồ. Cấu trúc hình ảnh “ngọn đèn của thành là Chiên Con” được giữ nguyên, không diễn giải thêm.
