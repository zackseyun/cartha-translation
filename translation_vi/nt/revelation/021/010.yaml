id: REV.21.10
reference: Revelation 21:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: vi
  text: Vị ấy đưa tôi đi trong Thánh Linh[a], lên một ngọn núi lớn và cao, rồi chỉ cho tôi thấy thành thánh Giê-ru-sa-lem đang từ Đức Chúa Trời, từ trời xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thần trí.” Cụm từ Hy Lạp có thể chỉ một trạng thái khải tượng; trong sách Khải Huyền, cụm từ này thường mở đầu một khải tượng tiên tri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: đưa tôi đi
  rationale: Diễn đạt sự chuyển từ một vị trí quan sát sang một vị trí khác trong bối cảnh khải tượng, tự nhiên hơn trong tiếng Việt mà vẫn giữ ý được đưa đi.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Giữ công thức khải tượng lặp lại trong sách Khải Huyền và khả năng nói đến tác động của Thánh Linh; chú thích bảo lưu cách hiểu về trạng thái tâm linh.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: lên một ngọn núi lớn và cao
  rationale: “Lên” thể hiện chuyển động hướng tới hoặc lên trên; giữ riêng cả hai tính từ μέγα và ὑψηλόν.
- source_word: ἔδειξέν μοι
  choice: chỉ cho tôi thấy
  rationale: Cách nói tự nhiên trong tiếng Việt, không thêm sắc thái thần học ngoài nghĩa của động từ.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: thành thánh Giê-ru-sa-lem
  rationale: Giữ danh xưng mô tả và quan hệ đồng vị giữa “thành thánh” với “Giê-ru-sa-lem” mà không thêm từ giải thích.
- source_word: καταβαίνουσαν
  choice: đang ... xuống
  rationale: Thể hiện hành động đang diễn ra của phân từ hiện tại.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời xuống
  rationale: Thể hiện nguồn xuất phát từ trời và hướng đi xuống.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: từ Đức Chúa Trời mà đến
  rationale: Giữ Đức Chúa Trời là nguồn của thành; thêm “mà đến” chỉ để câu tiếng Việt tự nhiên, không thêm ý “từ sự hiện diện của” vốn không có trong bản Hy Lạp.
theological_decisions:
- issue: Đối tượng được nói đến trong công thức ἐν πνεύματι
  choice: Thánh Linh là tác nhân của khải tượng
  alternative: “trong tâm linh,” chỉ một trạng thái khải tượng hoặc tâm linh của Giăng
  rationale: Cách viết “Thánh Linh” phản ánh cách hiểu có khả năng cao trong công thức khải tượng lặp lại của Khải Huyền, còn chú thích bảo lưu sự mơ hồ thật có trong tiếng Hy Lạp.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. “Vị ấy” giữ đại từ ngôi ba của nguyên văn mà không lặp thêm danh xưng “thiên sứ.” Cấu trúc cuối câu giữ riêng hai nguồn được nêu trong tiếng Hy Lạp: từ trời và từ Đức Chúa Trời.'
