  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của câu Hy Lạp: chủ thể được mô tả là người đang nói với Giăng mà không thêm “thiên sứ”; người ấy có một dụng cụ đo bằng vàng; và mục đích là đo thành, các cổng, cùng tường thành. “Để đo” diễn đạt đúng sắc thái mục đích của ἵνα μετρήσῃ. Cụm “tường thành” tự nhiên hàm nghĩa bức tường của thành, phù hợp với αὐτῆς.'
  naturalness: Câu văn rõ, gọn và tự nhiên trong tiếng Việt tiêu chuẩn hiện đại. “Cây thước đo bằng vàng” là cách gọi dễ hiểu cho dụng cụ được nói đến; “thành, các cổng và tường thành” giữ được giọng văn trang trọng, thích hợp với sách Khải Huyền.
  terminology: 'Các thuật ngữ được chọn nhất quán và phù hợp: “thành” cho πόλις, “cổng” cho πυλών, và “tường thành” cho τεῖχος. Không viết rõ danh tính là “thiên sứ”, nên không vượt quá điều câu này trực tiếp nói. Chú thích [a] nêu lựa chọn “cây sậy” cho κάλαμος, đồng thời giải thích nghĩa dụng cụ trong ngữ cảnh, là chính xác.'
