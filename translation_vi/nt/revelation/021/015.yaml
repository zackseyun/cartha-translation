id: REV.21.15
reference: Revelation 21:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: vi
  text: Người đang nói với tôi có một cây thước đo bằng vàng[a] để đo thành, các cổng và tường thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cây sậy bằng vàng dùng để đo.” Từ Hy Lạp κάλαμος có nghĩa đen là “cây sậy”, ở đây chỉ một cây que dùng làm thước đo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: Người đang nói với tôi
  rationale: Giữ cách diễn đạt bằng phân từ hiện tại có chức năng danh từ và sắc thái hành động đang diễn ra; không thêm “thiên sứ”, vì danh từ ấy không xuất hiện trong câu Hy Lạp này.
- source_word: εἶχεν
  choice: có
  rationale: Diễn đạt nghĩa thông thường của thể chưa hoàn thành ἔχω; tránh thêm ý “đang cầm” dù ngữ cảnh có thể hàm ý dụng cụ ở trong tay.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: một cây thước đo bằng vàng
  rationale: Truyền đạt tự nhiên chức năng của dụng cụ đo trong tiếng Việt hiện đại. κάλαμος vốn chỉ cây sậy rồi cũng chỉ cây que hoặc thước làm từ sậy; phương án sát chữ được giữ trong chú thích.
- source_word: ἵνα μετρήσῃ
  choice: để đo
  rationale: Cấu trúc “để” diễn đạt rõ và tự nhiên mục đích của ἵνα với động từ ở thức giả định.
- source_word: τὴν πόλιν
  choice: thành
  rationale: “Thành” là cách gọi tự nhiên, trang trọng cho đô thị được mô tả trong văn cảnh; không đưa tên Giê-ru-sa-lem Mới vào khi câu này chỉ nói “thành”.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: các cổng
  rationale: πυλών chỉ cổng hoặc lối cổng, thường mang tính đồ sộ; “các cổng” là cách diễn đạt gọn và tự nhiên.
- source_word: τὸ τεῖχος αὐτῆς
  choice: tường thành
  rationale: τεῖχος là bức tường phòng thủ bao quanh một thành; “tường thành” chính xác và tự nhiên hơn “bức tường” trong ngữ cảnh kiến trúc này.
theological_decisions:
- issue: Có nên gọi rõ người đang nói là thiên sứ hay không
  choice: Giữ “Người đang nói với tôi”, không thêm “thiên sứ”.
  alternative: “Thiên sứ đang nói với tôi”
  rationale: Văn cảnh rộng hơn cho biết nhân vật này thuộc nhóm các thiên sứ, nhưng chính câu Hy Lạp dùng một mô tả bằng phân từ chứ không có danh từ “thiên sứ”. Bản dịch giữ nguyên mức độ xác định của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “thành”, “cổng” và “tường thành” để giữ sắc thái kiến trúc; câu gọn, tự nhiên, đồng thời không làm rõ hơn nguyên văn về danh tính của người nói.
