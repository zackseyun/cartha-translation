id: REV.21.24
reference: Revelation 21:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: vi
  text: Các dân sẽ bước đi nhờ ánh sáng của thành ấy[a], và các vua trên đất sẽ đem vinh quang của họ[b] vào thành ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua ánh sáng của thành ấy” hoặc “trong ánh sáng của thành ấy”.'
    reason: lexical_alternative
  - marker: b
    text: “Vinh quang” ở đây cũng có thể hiểu là “vẻ huy hoàng” hoặc “danh dự”.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hy Lạp là “vào nàng”; đại từ mang giống cái vì từ “thành” trong tiếng Hy Lạp thuộc giống cái. Ở đây đại từ chỉ về thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: sẽ bước đi
  rationale: Giữ hình ảnh cụ thể về việc bước đi dưới ánh sáng, thay vì chuyển thành nghĩa ẩn dụ như “sống” hay “ăn ở”; thì tương lai của động từ cũng được thể hiện rõ.
- source_word: τὰ ἔθνη
  choice: các dân
  rationale: Diễn đạt ý nghĩa tập thể về các dân tộc trong khải tượng cánh chung, đồng thời giữ mối liên hệ với ngôn ngữ tiên tri Cựu Ước; không thu hẹp thành riêng người ngoại bang.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: nhờ ánh sáng của thành ấy
  rationale: διά với sở hữu cách có thể chỉ phương tiện; “nhờ” diễn đạt tự nhiên rằng ánh sáng của thành là phương tiện giúp các dân bước đi. Đại từ được khai triển thành “thành ấy” để rõ sở chỉ trong tiếng Việt.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: Đây là cách diễn đạt quen thuộc trong sách Khải Huyền về các nhà cai trị thuộc thế gian; “trên đất” tự nhiên hơn “của đất” trong tiếng Việt.
- source_word: φέρουσιν
  choice: sẽ đem
  rationale: Dù bản Hy Lạp dùng thì hiện tại sau động từ ở thì tương lai, ngữ cảnh khải tượng hướng đến hành động sắp xảy ra; “sẽ đem” giúp câu tiếng Việt liền mạch mà không thay đổi nội dung hành động.
- source_word: τὴν δόξαν αὐτῶν
  choice: vinh quang của họ
  rationale: “Vinh quang” giữ được bề rộng nghĩa gồm danh dự, vẻ huy hoàng và sự cao quý, đồng thời bảo tồn âm hưởng Kinh Thánh và liên văn bản với các lời tiên tri.
- source_word: εἰς αὐτήν
  choice: vào thành ấy
  rationale: εἰς diễn tả hướng đi vào bên trong. Việc nhắc lại “thành ấy” rõ nghĩa và tự nhiên trong tiếng Việt, thay vì cố mô phỏng giống cái ngữ pháp của đại từ Hy Lạp.
theological_decisions:
- issue: Sở chỉ và sắc thái nhân cách hóa của đại từ giống cái nói về Giê-ru-sa-lem mới
  choice: Dịch αὐτῆς và αὐτήν bằng “của thành ấy” và “vào thành ấy”.
  alternative: Dùng cách gọi mang tính nhân cách hóa như “của nàng” và “vào với nàng”, nhấn mạnh hình ảnh cô dâu.
  rationale: 'Chương 21 có nhân cách hóa Giê-ru-sa-lem mới như cô dâu, nhưng trong mệnh đề này hình ảnh trực tiếp mang tính đô thị và không gian: các dân bước đi nhờ ánh sáng của thành, còn các vua đem vinh quang vào thành. Cách dịch “thành ấy” giữ rõ sở chỉ mà không áp đặt sắc thái nhân cách hóa lên đại từ vốn mang giống cái theo ngữ pháp Hy Lạp.'
- issue: Quan hệ thời giữa περιπατήσουσιν và φέρουσιν
  choice: Dùng “sẽ” cho cả hai hành động trong tiếng Việt.
  alternative: 'Dịch động từ thứ hai ở hiện tại: “các vua trên đất đem…”'
  rationale: Động từ thứ nhất ở thì tương lai, còn động từ thứ hai mang hình thức hiện tại nhưng nằm trong cùng khải tượng và cùng chuỗi hành động. Tiếng Việt dùng “sẽ” cho cả hai để diễn đạt mạch tương lai rõ ràng; điều này không khẳng định một lịch trình thần học chi tiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Bước đi” duy trì hình ảnh cụ thể của nguyên văn; “các dân”, “các vua trên đất” và “vinh quang” giữ âm hưởng khải huyền mà không quá cổ kính. Việc lặp “thành ấy” tránh đại từ mơ hồ trong tiếng Việt.
