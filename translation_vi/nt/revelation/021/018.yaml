revisions:
- from: Vật liệu của tường thành là đá ngọc thạch[a], còn thành thì bằng vàng ròng, giống như thủy tinh tinh khiết[b].
  to: Vật liệu làm tường thành là bích ngọc[a], và thành ấy là vàng ròng, như thủy tinh trong suốt[b].
  rationale: Sửa thuật ngữ đá quý để phản ánh ἴασπις chính xác hơn trong tiếng Việt, bỏ liên từ mang ý đối lập không có trong nguyên văn, và dùng cách diễn đạt tự nhiên cho hình ảnh “thủy tinh” mà vẫn bảo toàn sắc thái của καθαρός qua chú thích. Các dấu chú thích a và b được giữ đúng vị trí.
