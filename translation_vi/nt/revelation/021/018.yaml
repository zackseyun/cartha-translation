  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: vi
  text: Vật liệu làm tường thành là bích ngọc[a], và thành ấy là vàng ròng, như thủy tinh trong suốt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Công trình xây dựng của tường thành là bích ngọc.” Từ Hy Lạp ἐνδώμησις có thể chỉ việc xây dựng, cấu trúc, hoặc vật liệu của công trình; trong ngữ cảnh này, “vật liệu” phù hợp với sự nhấn mạnh về chất liệu.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “như thủy tinh tinh khiết.” Từ Hy Lạp καθαρός cũng được dùng cho “vàng ròng” trong câu này; khi nói về thủy tinh, nó gợi đặc biệt độ trong suốt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: vật liệu
  rationale: Danh từ có thể chỉ việc xây dựng, cấu trúc, hoặc vật liệu của công trình. Vì ἴασπις làm vị ngữ và vế kế tiếp cũng nhấn mạnh chất liệu của thành, “vật liệu” phù hợp ngữ cảnh và tự nhiên trong tiếng Việt.
- source_word: τεῖχος
  choice: tường thành
  rationale: Trong ngữ cảnh một thành phố, τεῖχος chỉ tường bao phòng thủ; “tường thành” chính xác hơn từ “tường” đơn thuần.
- source_word: ἴασπις
  choice: đá ngọc thạch
  rationale: Đây là tên quy ước của một loại đá quý trong tiếng Việt Kinh Thánh. Loại đá cổ đại được nói đến có thể không hoàn toàn tương ứng với jasper hiện đại, nên giữ tên gọi truyền thống thay vì xác định thêm màu sắc.
- source_word: χρυσίον καθαρόν
  choice: vàng ròng
  rationale: Cụm từ chỉ vàng tinh khiết; “vàng ròng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὅμοιον
  choice: giống như
  rationale: Diễn đạt trực tiếp quan hệ so sánh mà không đồng nhất vàng với thủy tinh.
- source_word: ὕαλῳ καθαρῷ
  choice: thủy tinh tinh khiết
  rationale: Bám sát sự lặp lại của καθαρός trong nguyên văn. Trong phép so sánh này, cụm từ cũng gợi độ trong sáng, nhưng không nên âm thầm thu hẹp nghĩa thành chỉ “trong suốt”.
