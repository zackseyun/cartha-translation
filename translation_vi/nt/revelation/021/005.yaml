id: REV.21.5
reference: Revelation 21:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: vi
  text: 'Đấng ngự trên ngai phán: “Này, Ta đang làm mới mọi sự.” Rồi Ngài phán: “Hãy viết, vì những lời này là đáng tin cậy và chân thật.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: Đấng ngự trên ngai
  rationale: “Ngự” tự nhiên và trang trọng trong tiếng Việt khi nói về nhân vật ở trên ngai, đồng thời giữ hình ảnh hiện tại phân từ mà không thêm danh tính ngoài bản văn.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái long trọng, nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: καινὰ ποιῶ πάντα
  choice: Ta đang làm mới mọi sự
  rationale: “Đang làm” phản ánh thì hiện tại của ποιῶ; “làm mới” bám sát ποιέω và không đưa thêm ý “sáng tạo”; “mọi sự” giữ phạm vi toàn diện của πάντα mà không quyết định đó là thay thế hay biến đổi.
- source_word: Γράψον
  choice: Hãy viết
  rationale: Giữ nguyên mệnh lệnh trực tiếp, không thêm tân ngữ vốn không có trong tiếng Hy Lạp.
- source_word: ὅτι
  choice: vì
  rationale: 'Diễn đạt tự nhiên quan hệ lý do: phải viết vì các lời ấy đáng tin và chân thật.'
- source_word: οὗτοι οἱ λόγοι
  choice: những lời này
  rationale: Cách diễn đạt trực tiếp, tự nhiên, chỉ các lời mặc khải đang được nói đến.
- source_word: πιστοὶ
  choice: đáng tin cậy
  rationale: Khi bổ nghĩa cho “những lời”, cụm này diễn đạt rõ rằng các lời ấy có thể được tin cậy, tự nhiên hơn “trung tín” trong tiếng Việt.
- source_word: ἀληθινοί
  choice: chân thật
  rationale: Giữ ý về tính thật, xác thực của các lời và phối hợp tự nhiên với “đáng tin cậy”.
theological_decisions:
- issue: Phạm vi và bản chất của sự đổi mới cánh chung trong καινὰ ποιῶ πάντα
  choice: Ta đang làm mới mọi sự
  alternative: Ta làm cho mọi vật trở nên mới; Ta làm mới tất cả
  rationale: Bản dịch giữ sắc thái tiến hành của động từ hiện tại và phạm vi bao quát của πάντα, đồng thời không tự ý giải quyết câu hỏi bản văn nói đến sự thay thế hoàn toàn hay sự biến đổi, phục hồi.
- issue: Cách trình bày Đấng phán qua hình ảnh ngai
  choice: Đấng ngự trên ngai
  alternative: Đấng đang ngồi trên ngai; Đấng ngồi trên ngai
  rationale: Giữ nguyên hình ảnh về thẩm quyền và sự trị vì, nhưng không thêm một sự định danh thần học không được nêu trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/Ngài” phù hợp lời phán của Đấng ngự trên ngai; tránh lối cổ quá mức. Không cần chú thích vì các phương án dịch đáng kể đã được thể hiện tự nhiên mà không làm mất sự mơ hồ thực sự của nguyên văn.
