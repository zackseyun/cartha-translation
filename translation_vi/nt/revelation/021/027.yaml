id: REV.21.27
reference: Revelation 21:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: vi
  text: Không điều ô uế nào, cũng không ai thực hành điều ghê tởm và sự giả dối, sẽ được vào thành ấy; chỉ những người đã được ghi trong sách sự sống của Chiên Con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: không ... nào được vào
  rationale: Cấu trúc οὐ μή với động từ ở thể giả định aorist diễn tả sự phủ định tuyệt đối. Cách diễn đạt này tự nhiên trong tiếng Việt và nhấn mạnh rằng việc vào thành hoàn toàn bị loại trừ.
- source_word: εἰς αὐτὴν
  choice: vào thành ấy
  rationale: Đại từ αὐτήν chỉ thành Giê-ru-sa-lem mới. Lặp lại danh từ 'thành' giúp câu tiếng Việt rõ nghĩa mà không nhân cách hóa thành phố.
- source_word: πᾶν κοινὸν
  choice: không một điều ô uế nào
  rationale: Cụm trung tính số ít với πᾶν mang nghĩa bao quát là 'không gì'. Trong bối cảnh thanh sạch Do Thái, κοινός có thể chỉ điều ô uế, phàm tục hoặc bị làm cho không thanh sạch; 'ô uế' truyền đạt rõ nhất sắc thái thanh sạch và đạo đức ở đây.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: ai làm điều ghê tởm và điều giả dối
  rationale: Phân từ dùng như danh từ chỉ người thực hiện hành vi; ποιῶν chi phối cả βδέλυγμα và ψεῦδος. Bản dịch giữ liên từ 'và' của tiếng Hy Lạp và diễn đạt hai danh từ trừu tượng bằng tiếng Việt tự nhiên.
- source_word: εἰ μὴ
  choice: chỉ ... mới
  rationale: Cụm này nêu ngoại lệ duy nhất đối với sự loại trừ; cấu trúc 'chỉ ... mới' diễn đạt rõ tính giới hạn trong tiếng Việt.
- source_word: οἱ γεγραμμένοι
  choice: những người đã được ghi
  rationale: Phân từ hoàn thành bị động diễn tả những người đang ở trong tình trạng đã được ghi. Không thêm từ 'tên', vì nguyên văn câu này không nói rõ danh từ ấy.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: trong sách sự sống của Chiên Con
  rationale: '''Sách sự sống'' là cách diễn đạt rõ và quen thuộc cho βιβλίον τῆς ζωῆς. Sở hữu cách τοῦ ἀρνίου được giữ bằng ''của Chiên Con'', đồng thời bảo tồn tước hiệu mang tính biểu tượng.'
theological_decisions:
- issue: Phạm vi những gì bị loại khỏi Giê-ru-sa-lem mới
  choice: Giữ riêng cả điều ô uế và người làm điều ghê tởm, giả dối.
  alternative: Hiểu mệnh đề đầu chỉ nói về sự ô uế phi nhân cách, rồi mệnh đề sau mới nói riêng về con người.
  rationale: Nguyên văn phối hợp dạng trung tính πᾶν κοινόν với phân từ chỉ người ποιῶν; bản dịch không nhập hai phạm vi này làm một.
- issue: Đối tượng được ghi trong sách sự sống
  choice: Dịch sát là 'những người đã được ghi'.
  alternative: Mở rộng thành 'những người có tên đã được ghi'.
  rationale: Hình ảnh cuốn sách hàm ý tên người, nhưng câu Hy Lạp không có từ 'tên'; không bổ sung từ ngữ từ các câu song song.
- issue: Quan hệ giữa 'điều ghê tởm' và 'điều giả dối'
  choice: Giữ liên từ 'và'.
  alternative: Dịch thành 'hoặc' để nêu hai loại hành vi tách biệt.
  rationale: καί trong bản văn nối βδέλυγμα và ψεῦδος dưới cùng một phân từ ποιῶν. Giữ 'và' bảo toàn hình thức phối hợp và không quyết định thay nguyên văn cách áp dụng hai đặc điểm này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thành ấy' để làm rõ sở chỉ của đại từ; dùng 'Chiên Con' như tước hiệu viết hoa. Việc lặp 'được vào' làm sáng cấu trúc phủ định và đối lập trong tiếng Việt.
