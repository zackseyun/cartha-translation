revisions:
- from: Không một điều ô uế nào được vào thành ấy[a], cũng không một ai làm điều ghê tởm và điều giả dối[b] được vào; chỉ những người đã được ghi trong sách sự sống của Chiên Con mới được vào.
  to: Không điều ô uế nào, cũng không ai thực hành điều ghê tởm và sự giả dối, sẽ được vào thành ấy; chỉ những người đã được ghi trong sách sự sống của Chiên Con.
  rationale: Sửa cách diễn đạt của ψεῦδος để tiếng Việt tự nhiên hơn mà vẫn giữ nghĩa rộng của “sự giả dối.” Sắp xếp lại câu để một lần “sẽ được vào thành ấy” chi phối đầy đủ hai đối tượng bị loại trừ, đồng thời duy trì ngoại lệ duy nhất dành cho những người đã được ghi trong sách sự sống của Chiên Con. Chú thích a được làm gọn và chính xác hơn về mặt từ vựng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:26:02Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phân biệt đúng giữa “không một điều ô uế nào” (πᾶν κοινόν) và con người được diễn tả bởi phân từ ποιῶν. Tuy nhiên, “làm điều ghê tởm và điều giả dối” chưa tự nhiên cho ποιῶν ... ψεῦδος; ψεῦδος là “sự giả dối/điều dối trá,” không nhất thiết là một “điều” cụ thể. Cấu trúc phủ định kép οὐ μή được chuyển đạt rõ bằng “sẽ không ... nào được vào.”
  naturalness: Câu hiện tại lặp “được vào” ba lần và đặt “vào thành ấy” chỉ trong mệnh đề đầu, khiến nhịp câu nặng. Đặt động từ chính một lần sau hai chủ thể loại trừ vừa tự nhiên vừa phản ánh việc εἰσέλθῃ chi phối cả hai vế. “Thực hành điều ghê tởm và sự giả dối” là cách diễn đạt hiện đại, trang trọng hơn.
  terminology: Giữ “ô uế,” “sách sự sống,” và “Chiên Con,” những thuật ngữ phù hợp với ngữ cảnh Khải Huyền. Giữ “và,” tương ứng với καί, không thay bằng “hoặc.” Không thêm “tên” vào οἱ γεγραμμένοι.
  issues:
  - severity: medium
    issue: Cụm “làm điều ghê tởm và điều giả dối” không tự nhiên và chưa phản ánh tốt danh từ ψεῦδος.
    rationale: ψεῦδος chỉ sự giả dối, điều dối trá hoặc lời nói dối; trong cấu trúc này, “thực hành ... sự giả dối” diễn đạt tốt hơn hành vi mang đặc tính ấy mà không thu hẹp nghĩa thành chỉ nói dối.
  - severity: low
    issue: Lặp lại “được vào” làm câu nặng và không cần thiết.
    rationale: Nguyên văn dùng một động từ εἰσέλθῃ cho cả “mọi điều ô uế” và “người làm điều ghê tởm và giả dối.” Một động từ tiếng Việt sau hai thành phần giữ được cấu trúc và tăng độ trôi chảy.
  - severity: low
    issue: Chú thích a dùng cách nói dài và kém tự nhiên “điều bị làm cho không thanh sạch.”
    rationale: Có thể nêu lựa chọn từ vựng trực tiếp hơn là “điều không thanh sạch,” vẫn phản ánh sắc thái thanh sạch/nghi lễ của κοινόν.
  revised_text: Không điều ô uế nào, cũng không ai thực hành điều ghê tởm và sự giả dối, sẽ được vào thành ấy; chỉ những người đã được ghi trong sách sự sống của Chiên Con.
  revised_footnotes:
  - marker: a
    text: Cũng có thể dịch là “điều phàm tục” hoặc “điều không thanh sạch” (πᾶν κοινόν).
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “làm điều ghê tởm và sự giả dối.”'
    reason: lexical_alternative
  revision_rationale: Sửa cách diễn đạt của ψεῦδος để tiếng Việt tự nhiên hơn mà vẫn giữ nghĩa rộng của “sự giả dối.” Sắp xếp lại câu để một lần “sẽ được vào thành ấy” chi phối đầy đủ hai đối tượng bị loại trừ, đồng thời duy trì ngoại lệ duy nhất dành cho những người đã được ghi trong sách sự sống của Chiên Con. Chú thích a được làm gọn và chính xác hơn về mặt từ vựng.
