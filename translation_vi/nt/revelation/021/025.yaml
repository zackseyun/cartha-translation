  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: vi
  text: Các cổng của thành ấy sẽ không bao giờ bị đóng vào ban ngày, vì ở đó sẽ không có ban đêm.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Các cổng của thành ấy nhất định sẽ không bao giờ bị đóng vào ban ngày.” Tiếng Hy Lạp dùng một cấu trúc phủ định nhấn mạnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Lý do được nêu ra là: “Ở đó sẽ không có ban đêm.”'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Các
  rationale: Trong tiếng Việt, καί nối tiếp lời mô tả ở câu trước; không nhất thiết phải dịch thành “và” ở đầu câu, vì lược bỏ liên từ tạo câu tự nhiên mà vẫn giữ mạch liên tục.
- source_word: οἱ πυλῶνες αὐτῆς
  choice: các cổng thành
  rationale: πυλῶνες chỉ các cổng hoặc cụm cổng của thành; “các cổng thành” tự nhiên, rõ nghĩa và để quan hệ sở hữu được hiểu theo ngữ cảnh.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: sẽ không bao giờ đóng
  rationale: Cấu trúc οὐ μή với động từ ở thể thụ động diễn tả sự phủ định tương lai rất mạnh. “Sẽ không bao giờ đóng” truyền đạt cả ý tương lai lẫn sắc thái nhấn mạnh; tiếng Việt có thể dùng “đóng” theo nghĩa nội động một cách tự nhiên.
- source_word: ἡμέρας
  choice: vào ban ngày
  rationale: Dạng sở hữu cách được dùng như trạng từ chỉ thời gian; “vào ban ngày” giữ sự đối lập trực tiếp với “ban đêm” ở mệnh đề sau.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: vì tại đó sẽ không có ban đêm
  rationale: “Vì” thể hiện rõ chức năng giải thích của γάρ, còn “sẽ không có” diễn đạt tự nhiên ý hiện hữu của ἔσται.
theological_decisions:
- issue: Mức độ nhân cách hóa Giê-ru-sa-lem mới
  choice: Dùng “các cổng thành”, không dùng đại từ mang giới tính.
  alternative: “các cổng của nàng” hoặc “các cổng của thành ấy”
  rationale: αὐτῆς giống cái do hòa hợp ngữ pháp với danh từ chỉ thành phố. Tiếng Việt không cần chuyển đặc điểm ngữ pháp này thành sự nhân cách hóa; “các cổng thành” tự nhiên và không làm lu mờ trọng tâm là thành luôn rộng mở.
- issue: Quan hệ giữa việc cổng không đóng và việc không có ban đêm
  choice: Giữ quan hệ nguyên nhân bằng “vì”.
  alternative: Nối hai mệnh đề bằng “và”
  rationale: γάρ trình bày việc không có ban đêm như lý do cho việc các cổng không bao giờ đóng; bản dịch không nên làm yếu quan hệ giải thích này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tại đó” thay cho “ở đó” để giữ sắc thái trang nghiêm vừa phải; giữ hai chú thích ngay sau câu theo yêu cầu.
