id: REV.21.1
reference: Revelation 21:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: vi
  text: Rồi tôi thấy trời mới và đất mới, vì trời thứ nhất và đất thứ nhất[a] đã qua đi, và biển không còn nữa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trời trước kia và đất trước kia.” Tiếng Hy Lạp viết sát nghĩa là “trời thứ nhất và đất thứ nhất,” có thể chỉ trật tự trước đó, đối lập với trật tự mới.
    reason: lexical_alternative
  - marker: b
    text: “Biển” có thể được hiểu theo nghĩa đen; tuy nhiên, trong sách Khải Huyền, biển cũng có thể gợi đến sự hỗn mang, hiểm nguy hoặc ngăn cách.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: tôi thấy
  rationale: Động từ aorist chỉ một hành động trong trình thuật; “tôi thấy” trực tiếp, tự nhiên và không thêm sắc thái ngoài nguyên văn.
- source_word: οὐρανὸν ... γῆν
  choice: trời ... đất
  rationale: Trong bối cảnh khải huyền mang tầm vũ trụ, cặp từ này chỉ toàn thể trật tự thọ tạo, không chỉ bầu trời và phần đất liền.
- source_word: καινὸν ... καινήν
  choice: mới ... mới
  rationale: καινός diễn tả tính mới, nhất là về phẩm chất hoặc trật tự; “mới” giữ nguyên độ mở về việc đây là thay thế hay đổi mới.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: trời thứ nhất và đất thứ nhất
  rationale: “Thứ nhất” bám sát πρῶτος và duy trì sự đối chiếu trực tiếp với trời mới và đất mới; “trước kia” là một cách hiểu tự nhiên nhưng có phần diễn giải hơn.
- source_word: ἀπῆλθαν
  choice: đã qua đi
  rationale: Trong ngữ cảnh này, động từ diễn tả trật tự cũ không còn hiện diện; “đã qua đi” vừa tự nhiên vừa giữ được hình ảnh chuyển qua, không áp đặt cơ chế hủy diệt hay biến đổi.
- source_word: ἡ θάλασσα
  choice: biển
  rationale: Đây là nghĩa trực tiếp của θάλασσα. Bản dịch giữ hình ảnh cụ thể thay vì đưa ý nghĩa biểu tượng vào chính văn.
- source_word: οὐκ ἔστιν ἔτι
  choice: không còn nữa
  rationale: Cách diễn đạt này chuyển tải rõ sự phủ định hiện tại kết hợp với ἔτι, đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của “trời mới và đất mới”
  choice: Dịch là “mới” mà không xác định đó là sự thay thế hoàn toàn hay sự đổi mới của công trình sáng tạo hiện có.
  alternative: Hiểu là thay thế hoàn toàn, hoặc hiểu là đổi mới và biến đổi công trình sáng tạo hiện có.
  rationale: καινός khẳng định tính mới, nhưng riêng câu này không giải quyết cách thức hay bản thể của sự mới ấy.
- issue: Ý nghĩa của việc “biển không còn nữa”
  choice: Giữ nguyên hình ảnh “biển” trong chính văn, không giải thích biểu tượng.
  alternative: Hiểu theo nghĩa đen là biển không còn tồn tại, hoặc theo nghĩa biểu tượng là hỗn mang, hiểm nguy hay sự ngăn cách bị loại bỏ.
  rationale: Hình ảnh trong sách Khải Huyền có thể mang nhiều tầng liên tưởng; bản dịch không nên chọn thay người đọc một cách hiểu mà câu chữ chưa xác định.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Rồi” nối câu với diễn tiến thị kiến; cấu trúc song hành “trời mới và đất mới / trời thứ nhất và đất thứ nhất” được giữ để phản ánh nhịp và sự đối chiếu của nguyên văn.
