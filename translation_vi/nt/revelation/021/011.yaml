- from: mang vinh quang của Đức Chúa Trời. Ánh sáng[a] của thành giống như một viên đá quý nhất, như đá ngọc thạch anh[b] trong suốt tựa pha lê.
  to: Thành ấy mang vinh quang của Đức Chúa Trời. Ánh sáng[a] của thành giống như một viên đá vô cùng quý giá, như đá bích ngọc, trong như pha lê[b].
  rationale: Sửa tên đá từ “ngọc thạch anh” thành “bích ngọc” để phản ánh ἴασπις, đồng thời giữ dè dặt cần thiết vì việc đồng nhất chính xác các tên đá cổ với khoáng vật hiện đại không hoàn toàn chắc chắn. Điều chỉnh cách diễn đạt của tính từ so sánh nhất cho tự nhiên hơn trong tiếng Việt, và chuyển neo chú thích b đến cụm mà nó giải thích. Các yếu tố thần học và cấu trúc mô tả của nguyên văn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:49Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng liên hệ phân từ với “thành” ở câu trước, cùng các ý chính “vinh quang của Đức Chúa Trời,” ánh sáng/rạng ngời, đá cực quý, và phẩm chất như pha lê. Tuy nhiên, “ngọc thạch anh” không phải là cách gọi phù hợp cho ἴασπις (jasper); nó chuyển hình ảnh sang thạch anh và làm sai định danh của đá trong bản văn.
  naturalness: “Mang” là tự nhiên khi thêm chủ ngữ “Thành ấy” để câu tiếng Việt đứng độc lập. “Một viên đá quý nhất” hơi gượng trong tiếng Việt hiện đại; “một viên đá vô cùng quý giá” tự nhiên hơn và vẫn diễn tả lực nhấn mạnh của so sánh nhất. “Trong như pha lê” gọn và tự nhiên.
  terminology: “Vinh quang của Đức Chúa Trời” phù hợp và giữ trọng lượng thần học của δόξα. “Ánh sáng” là cách dịch an toàn cho φωστήρ trong ngữ cảnh này; chú thích bảo lưu các khả năng “vẻ rạng ngời” và “nguồn sáng.” Dùng “bích ngọc” cho ἴασπις theo cách gọi Kinh Thánh thông dụng, nhưng không khẳng định đồng nhất khoáng vật học hiện đại.
  issues:
