    issue: “ngọc thạch anh” dịch sai ἰάσπιδι.
    rationale: ἴασπις là jasper, không phải thạch anh. Cách dịch hiện tại thay đổi loại đá được nêu trong nguyên văn.
  - severity: low
    issue: “một viên đá quý nhất” chưa tự nhiên.
    rationale: Cấu trúc này ít tự nhiên trong tiếng Việt hiện đại. “Một viên đá vô cùng quý giá” truyền đạt tốt mức độ nhấn mạnh của τιμιωτάτῳ.
  - severity: low
    issue: Vị trí chú thích b nên gắn với cụm mô tả pha lê.
    rationale: Chú thích b giải thích lựa chọn cho κρυσταλλίζοντι, vì vậy nên đặt sau “trong như pha lê,” thay vì sau tên đá.
