source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: vi
  text: Thành ấy mang vinh quang của Đức Chúa Trời. Ánh sáng[a] của thành giống như một viên đá vô cùng quý giá, như đá bích ngọc, trong như pha lê[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “vẻ rạng ngời” hoặc “nguồn sáng” (Hy Lạp: φωστήρ).'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lấp lánh tựa pha lê”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: mang
  rationale: Phân từ hiện tại giống cái bổ nghĩa cho thành ở câu trước; “mang” giữ được sự liên kết và diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: vinh quang của Đức Chúa Trời
  rationale: “Vinh quang” bảo toàn sức nặng thần học của δόξα và phù hợp với hình ảnh sự hiện diện hiển lộ của Đức Chúa Trời.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: ánh sáng của thành
  rationale: φωστήρ có thể chỉ nguồn sáng hoặc vẻ sáng; “ánh sáng” tự nhiên, dễ hiểu và không khép lại sắc thái từ vựng vào riêng “hào quang” hay một thiên thể.
- source_word: λίθῳ τιμιωτάτῳ
  choice: một viên đá quý nhất
  rationale: Giữ hình ảnh λίθος và lực so sánh cao nhất của τιμιώτατος.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: như đá ngọc thạch anh
  rationale: Dùng tên gọi tiếng Việt quen thuộc cho ἴασπις, đồng thời giữ từ “đá” được lặp lại trong nguyên văn.
- source_word: κρυσταλλίζοντι
  choice: trong suốt tựa pha lê
  rationale: Diễn đạt phẩm chất giống pha lê của viên đá; cách dịch này tự nhiên và vẫn để chú thích ghi nhận khả năng nhấn mạnh vẻ lấp lánh.
theological_decisions:
- issue: Cách dịch δόξα τοῦ θεοῦ trong khải tượng
  choice: vinh quang của Đức Chúa Trời
  alternative: vẻ huy hoàng của Đức Chúa Trời
  rationale: “Vinh quang” không chỉ mô tả vẻ đẹp thị giác mà còn giữ ý nghĩa thần học về sự hiện diện và uy nghi được bày tỏ của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong bản dịch Kinh Thánh tiếng Việt; giữ cấu trúc hình ảnh trùng điệp của nguyên văn mà tránh câu chữ gượng.
