id: REV.21.19
reference: Revelation 21:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: vi
  text: 'Các nền của tường thành được trang hoàng bằng đủ loại đá quý: nền thứ nhất là bích ngọc[a], nền thứ hai là lam ngọc, nền thứ ba là ngọc can-xê-đoan[b], nền thứ tư là ngọc lục bảo,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng mọi viên đá quý.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa phân phối, nên chính văn dịch là “đủ loại đá quý.”'
    reason: lexical_alternative
  - marker: b
    text: “Can-xê-đoan” là cách gọi truyền thống của từ Hy Lạp này; không thể xác định chắc chắn một số loại đá quý thời cổ.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: các nền
  rationale: Danh từ số nhiều chỉ các nền hoặc lớp đá nền của tường thành; “các nền” tự nhiên và không thêm ý diễn giải quá mức.
- source_word: τείχους τῆς πόλεως
  choice: của tường thành
  rationale: “Tường thành” là cách nói tự nhiên trong tiếng Việt cho bức tường bao quanh một thành phố, đồng thời gọn hơn “tường của thành phố”.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: bằng đủ loại đá quý
  rationale: Diễn đạt tự nhiên sắc thái phân phối có thể có của πᾶς, nhưng ghi chú cũng bảo lưu cách hiểu sát mặt chữ là “mọi viên đá quý”.
- source_word: κεκοσμημένοι
  choice: được trang hoàng
  rationale: Bảo toàn thể bị động và trạng thái đã được làm cho đẹp của phân từ hoàn thành; văn phong trang trọng, phù hợp với khải tượng.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: nền thứ nhất
  rationale: Giữ cách liệt kê từng nền theo thứ tự mà không tự ý thêm “viên đá nền”.
- source_word: ἴασπις
  choice: ngọc bích
  rationale: Tên gọi quen thuộc trong tiếng Việt Kinh Thánh cho ἴασπις; nhận dạng khoáng vật cổ không nhất thiết hoàn toàn trùng với jasper hiện đại.
- source_word: σάπφιρος
  choice: lam ngọc
  rationale: Tương đương tiếng Việt thông dụng, trang nhã của sapphire.
- source_word: χαλκηδών
  choice: ngọc can-xê-đoan
  rationale: Phiên âm tên đá truyền thống để tránh khẳng định quá mức về một loại khoáng vật cổ chưa thể xác định chắc chắn.
- source_word: σμάραγδος
  choice: ngọc lục bảo
  rationale: Tương đương tiếng Việt tiêu chuẩn và được thừa nhận rộng rãi của emerald.
theological_decisions:
- issue: Cách trình bày danh sách đá quý trong khải tượng
  choice: Dịch thẳng các tên đá, không giải thích biểu tượng trong chính văn.
  alternative: Gắn từng loại đá với các chi phái Y-sơ-ra-ên, các sứ đồ hoặc phẩm phục tư tế.
  rationale: Câu này chỉ mô tả sự trang hoàng mà không tự giải thích ý nghĩa biểu tượng; bản dịch không nên đưa vào một hệ thống thần học không được nêu rõ trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “tường thành” và cấu trúc liệt kê cân đối để giữ nhịp văn khải tượng. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
