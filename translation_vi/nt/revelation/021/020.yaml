id: REV.21.20
reference: Revelation 21:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: vi
  text: thứ năm, ngọc sardonyx; thứ sáu, ngọc sardius[a]; thứ bảy, ngọc chrysolite; thứ tám, ngọc beryl; thứ chín, ngọc topaz; thứ mười, ngọc chrysoprase; thứ mười một, ngọc hyacinth[b]; thứ mười hai, thạch anh tím.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mã não đỏ”; việc xác định chính xác loại đá quý cổ đại này vẫn chưa chắc chắn.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây chỉ một loại đá quý, không phải hoa dạ lan hương; cũng có thể phiên là “jacinth”.
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρδόνυξ
  choice: ngọc sardonyx
  rationale: Dùng tên khoáng vật quốc tế để giữ sự phân biệt với σάρδιον và tránh đồng nhất quá chắc chắn một loại đá quý cổ đại với tên gọi hiện đại.
- source_word: σάρδιον
  choice: ngọc sardius
  rationale: Giữ tên truyền thống có dạng phiên chuyển để phân biệt với sardonyx; loại đá cổ đại này thường được liên hệ với mã não đỏ (carnelian), nhưng việc nhận diện không hoàn toàn chắc chắn.
- source_word: χρυσόλιθος
  choice: ngọc chrysolite
  rationale: Giữ tên đá quý quy ước; nghĩa từ nguyên gần với “đá vàng”, nhưng loại khoáng vật cổ đại chính xác vẫn còn bất định.
- source_word: βήρυλλος
  choice: ngọc beryl
  rationale: Beryl là tên khoáng vật hiện đại tương ứng phổ biến và dễ nhận diện.
- source_word: τοπάζιον
  choice: ngọc topaz
  rationale: Dùng tên đá quý hiện hành, đồng thời không diễn giải màu sắc vốn không được câu Hy Lạp nêu rõ.
- source_word: χρυσόπρασος
  choice: ngọc chrysoprase
  rationale: Dùng tên khoáng vật được xác lập thay vì dịch sát từ nguyên khó hiểu.
- source_word: ὑάκινθος
  choice: ngọc hyacinth
  rationale: Giữ tên đá quý theo thuật ngữ Hy Lạp, tránh khiến người đọc hiểu nhầm là hoa dạ lan hương.
- source_word: ἀμέθυστος
  choice: thạch anh tím
  rationale: Đây là tên tiếng Việt hiện đại, rõ nghĩa và thông dụng của amethyst.
theological_decisions: []
translation_notes:
  register: Giữ nhịp liệt kê trang trọng, cô đọng của nguyên văn. Các tên đá khó xác định được giữ theo dạng quốc tế quen dùng trong khoáng vật học, có thêm “ngọc” để người đọc phổ thông nhận ra đây là đá quý; riêng amethyst được dịch bằng tên tiếng Việt thông dụng “thạch anh tím”.
