translation:
  language: vi
  text: Họ sẽ đem vinh quang và danh dự của các dân tộc vào thành ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vào nàng”; tiếng Hy Lạp dùng đại từ giống cái, phù hợp với việc nhân cách hóa thành phố.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và (được thể hiện qua sự tiếp nối tự nhiên của câu; không nhất thiết mở đầu bằng liên từ trong bản dịch độc lập)
  rationale: Liên từ nối câu này với khải tượng ở câu trước. Trong tiếng Việt hiện đại, mối liên kết vẫn rõ dù câu trích độc lập không cần mở đầu bằng “Và”.
- source_word: οἴσουσιν
  choice: Họ sẽ đem
  rationale: Động từ tương lai chủ động của φέρω diễn tả việc đưa một vật từ ngoài vào trong. “Đem” tự nhiên và cụ thể trong ngữ cảnh này; chủ ngữ số nhiều được diễn đạt bằng “Họ” mà không xác định thêm danh tính.
- source_word: τὴν δόξαν
  choice: vinh quang
  rationale: “Vinh quang” giữ được cả sắc thái rực rỡ lẫn sự cao trọng thường có của δόξα trong sách Khải Huyền.
- source_word: τὴν τιμὴν
  choice: danh dự
  rationale: “Danh dự” diễn đạt ý nghĩa căn bản của τιμή là sự quý trọng và tôn kính, đồng thời không thu hẹp từ này thành của cải hay giá trị vật chất.
- source_word: τῶν ἐθνῶν
  choice: của các dân tộc
  rationale: ἔθνη ở đây chỉ rộng đến các dân, các quốc gia; “các dân tộc” tránh áp đặt sự đối lập Do Thái–dân ngoại vốn không được nhấn mạnh trong câu.
- source_word: εἰς αὐτήν
  choice: vào thành ấy
  rationale: Đại từ giống cái αὐτήν quy chiếu về thành Giê-ru-sa-lem mới. Lặp lại “thành ấy” giúp tiếng Việt rõ nghĩa và tự nhiên, trong khi sắc thái nhân cách hóa được ghi nhận ở chú thích.
theological_decisions:
- issue: Đối tượng quy chiếu và sự nhân cách hóa trong αὐτήν
  choice: “vào thành ấy”
  alternative: “vào nàng”
  rationale: Danh từ Hy Lạp chỉ “thành” là giống cái, và văn cảnh cũng nhân cách hóa thành như cô dâu. Tuy nhiên, tiếng Việt thông thường không dùng “nàng” để chỉ một thành phố; “thành ấy” rõ ràng hơn, còn phương án nhân cách hóa được bảo lưu trong chú thích.
- issue: Ý nghĩa của “vinh quang và danh dự của các dân tộc”
  choice: Giữ nguyên cách nói rộng, không giải thích thêm
  alternative: Của cải của các dân tộc; vẻ huy hoàng hay những nét ưu tú của các nền văn hóa; sự tôn kính do các dân tộc dâng lên
  rationale: Cụm từ Hy Lạp cho phép nhiều sắc thái và văn cảnh không buộc phải chọn một cách giải thích cánh chung cụ thể. Bản dịch vì thế giữ sự rộng nghĩa của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đem” tạo hình ảnh chuyển vật vào thành; “vinh quang và danh dự” giữ sắc thái Kinh Thánh nhưng không cổ hóa. Đại từ “Họ” bảo toàn chủ ngữ số nhiều không được nêu rõ trong câu Hy Lạp.
