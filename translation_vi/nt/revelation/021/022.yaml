id: REV.21.22
reference: Revelation 21:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: vi
  text: Tôi không thấy đền thờ[a] nào trong thành ấy, vì Chúa, Đức Chúa Trời Toàn Năng, là đền thờ của thành, và Chiên Con cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thánh điện”. Từ Hy Lạp ναός có thể chỉ đền thờ theo nghĩa hẹp, đặc biệt là khu thánh điện bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: đền thờ
  rationale: Từ ναός chỉ đền thờ, đặc biệt có thể nhấn mạnh phần thánh điện bên trong. “Đền thờ” là cách diễn đạt tự nhiên, rõ nghĩa và giữ được sự tương phản giữa việc không có một đền thờ hữu hình với việc chính Đức Chúa Trời và Chiên Con là đền thờ của thành.
- source_word: οὐκ εἶδον
  choice: Tôi không thấy ... nào
  rationale: Diễn đạt trực tiếp động từ ở thì aorist cùng sự phủ định, đồng thời nhấn mạnh sự hoàn toàn vắng mặt của đền thờ.
- source_word: ἐν αὐτῇ
  choice: trong thành ấy
  rationale: Đại từ giống cái trong Hy Lạp quy chiếu về thành. Tiếng Việt tự nhiên hơn khi nêu rõ “thành ấy”, tránh một đại từ mơ hồ mà không đưa ý nghĩa giống ngữ pháp vào bản dịch.
- source_word: ὁ κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Chúa, Đức Chúa Trời Toàn Năng
  rationale: Giữ chuỗi danh xưng đồng vị của nguyên văn bằng lối diễn đạt trang trọng, gọn và tự nhiên trong tiếng Việt.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: là đền thờ của thành
  rationale: Phản ánh vị ngữ số ít trong nguyên văn và làm rõ đại từ sở hữu quy chiếu về thành.
- source_word: καὶ τὸ ἀρνίον
  choice: và Chiên Con cũng vậy
  rationale: Giữ cấu trúc Chiên Con được thêm vào sau mệnh đề chính bằng καί. “Cũng vậy” bổ sung vị ngữ đã được lược trong tiếng Hy Lạp, giúp câu tiếng Việt trọn nghĩa mà không làm Chiên Con thành một ý phụ.
theological_decisions:
- issue: Cách hiểu cụm vị ngữ “ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον”
  choice: Chúa, Đức Chúa Trời Toàn Năng, là đền thờ của thành, và Chiên Con cũng vậy.
  alternative: Chúa, Đức Chúa Trời Toàn Năng, và Chiên Con là đền thờ của thành.
  rationale: 'Cách chọn giữ động từ số ít và trật tự đặc thù của nguyên văn: mệnh đề trước xác nhận Đức Chúa Trời là đền thờ, rồi καί thêm Chiên Con vào cùng lời xác nhận ấy. “Cũng vậy” làm rõ phép tỉnh lược cần thiết trong tiếng Việt nhưng không áp đặt một công thức thần học về sau.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thành ấy” thay cho đại từ mang giống ngữ pháp; giữ danh xưng “Chiên Con” theo cách dùng quen thuộc trong sách Khải Huyền. Cấu trúc “và Chiên Con cũng vậy” vừa tự nhiên trong tiếng Việt vừa bảo tồn cách Chiên Con được thêm vào sau vị ngữ số ít của nguyên văn.
