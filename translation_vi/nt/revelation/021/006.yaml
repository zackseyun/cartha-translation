id: REV.21.6
reference: Revelation 21:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: vi
  text: 'Ngài phán với tôi: “Những điều ấy đã trở thành hiện thực.[a] Ta là An-pha và Ô-mê-ga, là khởi đầu và kết thúc. Ta sẽ ban cho người đang khát nước từ suối nước sự sống, không phải trả giá.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống: “Đã xong rồi.” Động từ Hy Lạp ở số nhiều, có thể hiểu là “những điều ấy đã xảy ra” hoặc “những điều ấy đã thành hiện thực.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “miễn phí” hoặc “như một món quà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Những điều ấy đã trở thành hiện thực
  rationale: Động từ hoàn thành ở số nhiều, nên bản dịch phản ánh nhiều điều đã xảy ra hoặc đã thành hiện thực, thay vì làm phẳng thành công thức số ít “Đã xong rồi”.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: An-pha và Ô-mê-ga
  rationale: Giữ tên hai chữ cái Hy Lạp như các tước hiệu biểu tượng quen thuộc trong sách Khải Huyền; vế tiếp theo giải thích ý nghĩa là “khởi đầu và kết thúc”.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: khởi đầu và kết thúc
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ được cả sắc thái thời gian lẫn ý nghĩa về nguồn gốc và đích điểm mà không diễn giải quá mức.
- source_word: τῷ διψῶντι
  choice: cho người đang khát
  rationale: Phân từ hiện tại được dùng như danh từ, chỉ một người có đặc điểm là đang khát; cách dịch giữ tính cá nhân và hình ảnh cơn khát.
- source_word: δώσω
  choice: Ta sẽ ban
  rationale: Diễn đạt trực tiếp lời hứa ở thì tương lai; “ban” phù hợp với lời phán thần thượng nhưng vẫn rõ nghĩa.
- source_word: ἐκ τῆς πηγῆς
  choice: từ nguồn
  rationale: πηγή chỉ mạch, suối hoặc nguồn nước; “nguồn” tự nhiên trong tiếng Việt và hợp với hình ảnh nước đem lại sự sống.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: nước sự sống
  rationale: Giữ cấu trúc và hình ảnh Kinh Thánh thay vì diễn giải thành “nước ban sự sống”.
- source_word: δωρεάν
  choice: không phải trả giá
  rationale: Nêu rõ ý nghĩa được ban miễn phí, không đòi phí tổn; cách nói này tự nhiên hơn trạng từ “cách nhưng không” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch lời tuyên bố Γέγοναν với hình thái số nhiều
  choice: Những điều ấy đã trở thành hiện thực
  alternative: Đã xong rồi
  rationale: Lời phán đánh dấu việc các thực tại của công cuộc sáng tạo mới đã thành hiện thực. Giữ số nhiều tránh thay thế hình thái Hy Lạp bằng một công thức truyền thống ở số ít.
- issue: Giữ hình ảnh An-pha và Ô-mê-ga như tước hiệu thần thượng
  choice: An-pha và Ô-mê-ga
  alternative: chữ đầu và chữ cuối
  rationale: Giữ nguyên tên chữ cái Hy Lạp bảo tồn hình ảnh biểu tượng và mối liên hệ nội tại trong sách Khải Huyền, trong khi cụm “khởi đầu và kết thúc” ngay sau đó đã làm sáng tỏ ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dùng trong lời dẫn và “Ta” trong lời tự xưng của Đức Chúa Trời. Cấu trúc câu được điều chỉnh nhẹ để tiếng Việt tự nhiên, đồng thời giữ nguyên hình ảnh “nguồn nước sự sống” và tính nhưng không của món quà.
