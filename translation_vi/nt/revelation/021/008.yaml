id: REV.21.8
reference: Revelation 21:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: vi
  text: Nhưng những kẻ hèn nhát, những kẻ không tin[a], những kẻ đáng ghê tởm, những kẻ giết người, những kẻ gian dâm, những kẻ hành nghề phù phép, những kẻ thờ thần tượng, cùng tất cả những kẻ nói dối, thì phần của họ ở trong hồ đang cháy rực lửa và lưu huỳnh[b]; đó là sự chết thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những kẻ bất trung” hoặc “những kẻ không trung tín”.
    reason: alternative_reading
  - marker: b
    text: 'Theo cách gọi truyền thống: “diêm sinh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειλοῖς
  choice: những kẻ hèn nhát
  rationale: Diễn đạt sự sợ hãi đáng trách về mặt đạo đức, chứ không phải cảm giác sợ hãi thông thường.
- source_word: ἀπίστοις
  choice: những kẻ không tin
  rationale: Trong danh sách chịu phán xét này, nghĩa trực tiếp nhất là những người không tin; nét nghĩa “bất trung” được giữ trong chú thích.
- source_word: ἐβδελυγμένοις
  choice: những kẻ đáng ghê tởm
  rationale: Giữ sắc thái ghê tởm mạnh của phân từ hoàn thành và mô tả những người mang đặc tính ô uế, đáng ghét.
- source_word: φονεῦσι
  choice: những kẻ giết người
  rationale: Chỉ người phạm tội giết người, tự nhiên và chính xác hơn cách nói quá rộng như “những kẻ giết”.
- source_word: πόρνοις
  choice: những kẻ gian dâm
  rationale: Cách nói ngắn gọn, quen thuộc trong văn phong Kinh Thánh hiện đại, chỉ những người thực hành sự vô luân về tình dục.
- source_word: φαρμάκοις
  choice: những kẻ hành nghề phù phép
  rationale: Trong sách Khải Huyền, từ này chỉ người thực hành ma thuật hoặc huyền thuật, không phải dược sĩ hay đơn thuần là người dùng độc dược.
- source_word: εἰδωλολάτραις
  choice: những kẻ thờ thần tượng
  rationale: Diễn đạt trực tiếp hành vi thờ các tượng thần và dễ hiểu hơn thuật ngữ Hán-Việt nặng.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: tất cả những kẻ nói dối
  rationale: Tính từ được dùng như danh từ để chỉ những người giả dối; “những kẻ nói dối” tự nhiên và rõ nghĩa trong danh sách này.
- source_word: τὸ μέρος αὐτῶν
  choice: phần của họ ở
  rationale: μέρος chỉ phần được dành hoặc số phận dành cho họ; câu tiếng Hy Lạp không có động từ và tiếng Việt có thể giữ cấu trúc hiện tại giàu tính tuyên bố.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: trong hồ cháy bằng lửa và lưu huỳnh
  rationale: Giữ hình ảnh chiếc hồ đang cháy cùng hai danh từ cụ thể “lửa” và “lưu huỳnh”; “lưu huỳnh” là tên gọi hiện đại, chính xác của θείον.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: đó là sự chết thứ hai
  rationale: Đại từ quan hệ giống trung quy chiếu về toàn bộ hình ảnh hồ lửa; tiếng Việt dùng “đó là” tự nhiên và vẫn giữ chức năng giải thích.
theological_decisions:
- issue: Nghĩa của ἄπιστος trong danh sách chịu phán xét
  choice: những kẻ không tin
  alternative: những kẻ bất trung / không trung tín
  rationale: Ngữ cảnh thuận lợi cho nghĩa “không tin”, nhưng từ này cũng có thể chỉ sự bất trung; chú thích bảo tồn độ mở thần học ấy.
- issue: Cách hiểu ἐβδελυγμένοις
  choice: những kẻ đáng ghê tởm
  alternative: những kẻ làm điều ghê tởm
  rationale: Hình thái bị động và trạng thái hoàn thành mô tả chính những người bị xem là ghê tởm; không nên tự ý chuyển thành một mệnh đề chỉ hành vi dù đó là cách hiểu khả dĩ theo ngữ cảnh.
- issue: Hình ảnh θείῳ
  choice: lưu huỳnh
  alternative: diêm sinh
  rationale: “Lưu huỳnh” bám sát danh từ nguồn và là từ hiện đại, dễ hiểu; không cần dùng từ truyền thống, ít thông dụng hơn là “diêm sinh” trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Phép lặp “những kẻ” được duy trì để làm rõ từng nhóm trong danh sách và giữ nhịp cảnh cáo long trọng; liên từ được tiết chế theo cú pháp tiếng Việt. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
