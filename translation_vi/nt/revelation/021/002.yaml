  to: Và tôi thấy thành thánh, Giê-ru-sa-lem mới, từ Đức Chúa Trời từ trời xuống, đã được chuẩn bị như một cô dâu trang điểm cho chồng mình.
  rationale: Chỉnh sửa nhằm làm câu tự nhiên hơn và làm rõ hai cụm chỉ xuất xứ cùng bổ nghĩa cho hình ảnh thành đang từ trời xuống. Không thêm diễn giải về biểu tượng thành hay cô dâu, và vẫn giữ trạng thái hoàn thành bị động của ἡτοιμασμένην qua “đã được chuẩn bị.”
