id: REV.21.2
reference: Revelation 21:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: vi
  text: Và tôi thấy thành thánh, Giê-ru-sa-lem mới, từ Đức Chúa Trời từ trời xuống, đã được chuẩn bị như một cô dâu trang điểm cho chồng mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: thành thánh
  rationale: “Thành” diễn đạt cụ thể πόλις, còn “thánh” giữ nguyên sức nặng giao ước và thần học của ἁγίαν; cụm từ tự nhiên trong tiếng Việt Kinh Thánh.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: Giê-ru-sa-lem mới
  rationale: Tên riêng được phiên âm theo cách quen thuộc trong tiếng Việt, còn καινήν được dịch là “mới”, giữ sắc thái mô tả thay vì biến cả cụm thành một danh hiệu do cách viết hoa quyết định.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Dịch trực tiếp động từ aorist của ὁράω, không thêm ý “nhìn xem” vốn không có trong nguyên văn.
- source_word: καταβαίνουσαν ἐκ τοῦ οὐρανοῦ
  choice: từ trời xuống
  rationale: Diễn đạt tự nhiên chuyển động đi xuống từ bên trong/nguồn là trời, giữ hướng chuyển động của καταβαίνουσαν và sắc thái nguồn của ἐκ.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: đến từ Đức Chúa Trời
  rationale: ἀπό chỉ nguồn gốc; cách dịch này phân biệt nguồn tối hậu là Đức Chúa Trời với hình ảnh chuyển động “từ trời xuống”, đồng thời không thêm ý “từ sự hiện diện của”.
- source_word: ἡτοιμασμένην
  choice: đã được chuẩn bị
  rationale: Thể hoàn thành bị động mô tả thành ở trong trạng thái đã được chuẩn bị xong; “đã được chuẩn bị” thể hiện cả kết quả lẫn thể bị động.
- source_word: ὡς νύμφην
  choice: như một cô dâu
  rationale: ὡς giới thiệu phép so sánh, còn νύμφην không có mạo từ; “như một cô dâu” giữ rõ hình thức ví von mà không biến hình ảnh thành một sự đồng nhất được giải thích sẵn.
- source_word: κεκοσμημένην τῷ ἀνδρὶ αὐτῆς
  choice: được trang sức cho chồng mình
  rationale: “Được trang sức” giữ thể bị động và hình ảnh trang hoàng của κοσμέω; trong bối cảnh cô dâu, ἀνήρ được hiểu tự nhiên là “chồng”, không đổi thành từ chuyên biệt hơn là “chàng rể”.
theological_decisions:
- issue: Có nên coi “Giê-ru-sa-lem mới” là một danh hiệu thần học cố định hay không
  choice: Dịch “Giê-ru-sa-lem mới” theo cấu trúc tên riêng kèm tính từ mô tả
  alternative: Xử lý toàn cụm như một danh hiệu cố định tương đương “Tân Giê-ru-sa-lem”
  rationale: Nguyên văn đặt καινήν với Ἰερουσαλήμ nhưng không tự nó quyết định quy ước danh hiệu trong tiếng Việt. Cách dịch đã chọn bảo toàn nghĩa mô tả “Giê-ru-sa-lem mới” mà không áp đặt thêm cách phân loại thần học.
- issue: Có nên giải thích thành thánh chính là Hội Thánh hoặc cô dâu của Chiên Con ngay trong câu này hay không
  choice: Giữ nguyên phép so sánh “như một cô dâu” mà không diễn giải biểu tượng
  alternative: Mở rộng thành “như Hội Thánh, cô dâu của Chiên Con”
  rationale: Câu này trình bày hình ảnh bằng ὡς, tức một phép so sánh. Việc xác định đầy đủ biểu tượng ngay trong bản dịch sẽ đưa phần giải nghĩa thần học vào lời văn và làm mất độ căng vốn có của khải tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ câu đơn theo mạch khải tượng của nguyên văn; dùng “Và” để phản ánh καί mở đầu. Cụm “từ trời xuống, đến từ Đức Chúa Trời” chủ ý bảo toàn cả ἐκ và ἀπό mà tránh lặp “từ” nặng nề trong tiếng Việt.
