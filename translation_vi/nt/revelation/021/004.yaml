id: REV.21.4
reference: Revelation 21:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: vi
  text: Ngài sẽ lau sạch mọi giọt lệ khỏi mắt họ[a]. Sự chết sẽ không còn nữa; sẽ không còn tang tóc, kêu khóc hay đau đớn nữa[b]. Những điều trước kia đã qua rồi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả nước mắt”. Danh từ Hy Lạp ở số ít mang ý phân phối: từng giọt lệ.'
    reason: lexical_alternative
  - marker: b
    text: Từ được dịch là “kêu khóc” cũng có thể chỉ “tiếng kêu” hoặc “tiếng la lớn”.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch sát hơn: “những điều đầu tiên đã qua rồi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: sẽ lau sạch
  rationale: Trong ngữ cảnh nói đến nước mắt, ἐξαλείφω diễn tả hành động đích thân lau đi. “Lau sạch” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái loại bỏ hoàn toàn.
- source_word: πᾶν δάκρυον
  choice: mọi giọt lệ
  rationale: Danh từ số ít đi với πᾶν mang ý phân phối, nhấn mạnh từng giọt lệ. “Mọi giọt lệ” giữ được nét nghĩa ấy và có văn phong trang trọng, dễ hiểu.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: khỏi mắt họ
  rationale: ἐκ chỉ sự loại bỏ ra khỏi một nơi; “khỏi mắt họ” là cách nói tiếng Việt gọn và tự nhiên.
- source_word: ὁ θάνατος
  choice: sự chết
  rationale: “Sự chết” diễn đạt thực tại bị xóa bỏ một cách toàn diện, phù hợp văn phong Kinh Thánh tiếng Việt mà vẫn dễ hiểu.
- source_word: οὐκ ἔσται ἔτι
  choice: sẽ không còn nữa
  rationale: Cụm từ chỉ sự chấm dứt hoàn toàn. Cách dịch này trang trọng, tự nhiên và được giữ nhất quán ở cả hai lần xuất hiện.
- source_word: πένθος
  choice: tang tóc
  rationale: Từ này chỉ nỗi than khóc, đặc biệt trong bối cảnh mất mát. “Tang tóc” phù hợp với chuỗi sự chết, kêu khóc và đau đớn.
- source_word: κραυγή
  choice: kêu khóc
  rationale: κραυγή có thể là tiếng kêu lớn hoặc tiếng la. Trong văn cảnh an ủi này, “kêu khóc” diễn đạt tự nhiên tiếng kêu phát ra bởi đau buồn, nhưng chú thích vẫn bảo lưu nghĩa rộng hơn.
- source_word: πόνος
  choice: đau đớn
  rationale: Trong danh sách các khổ đau bị xóa bỏ, “đau đớn” là tương đương rõ ràng và đủ rộng để bao gồm nỗi đau thể chất lẫn tinh thần.
- source_word: τὰ πρῶτα
  choice: những điều trước kia
  rationale: Cụm danh từ trung tính số nhiều nói đến những thực tại thuộc trật tự trước. “Những điều trước kia” tự nhiên hơn lối dịch sát “những điều đầu tiên” mà không áp đặt một cách giải thích chi tiết.
- source_word: ἀπῆλθαν
  choice: đã qua rồi
  rationale: Động từ aorist trình bày sự ra đi như một sự kiện hoàn tất. “Đã qua rồi” chuyển tải tính hoàn tất và âm hưởng tuyên bố của câu.
theological_decisions:
- issue: Chủ thể của động từ “sẽ lau sạch” được hiểu từ ngữ cảnh trước đó chứ không được nêu lại trong câu Hy Lạp.
  choice: Dùng “Ngài” mà không chèn danh từ “Đức Chúa Trời” vào câu.
  alternative: “Đức Chúa Trời sẽ lau sạch” hoặc “Người sẽ lau sạch”.
  rationale: Động từ Hy Lạp ngôi thứ ba số ít có chủ thể ngầm từ Khải Huyền 21:3. “Ngài” giữ liên kết ngữ cảnh và tránh thêm danh từ không có trong câu, đồng thời là đại từ kính trọng tự nhiên trong tiếng Việt.
- issue: Phạm vi chấm dứt của sự chết và mọi đau khổ trong tạo vật mới.
  choice: 'Dùng lời khẳng định tuyệt đối: “sẽ không còn nữa”.'
  alternative: “sẽ không còn tồn tại” hoặc diễn đạt giảm nhẹ rằng chúng chỉ bớt đi.
  rationale: Nguyên văn khẳng định sự chấm dứt dứt khoát, không phải chỉ giảm bớt. Bản dịch giữ nguyên tính tuyệt đối mà không thêm điều kiện thần học.
- issue: Mối quan hệ của mệnh đề cuối với các mệnh đề trước.
  choice: Dùng liên từ “vì” để thể hiện giá trị giải thích tự nhiên của câu cuối trong tiếng Việt.
  alternative: 'Tách thành câu độc lập không có liên từ: “Những điều trước kia đã qua rồi.”'
  rationale: Nguyên văn đặt mệnh đề cuối liền sau danh sách mà không có liên từ. Trong diễn ngôn, nó tự nhiên cung cấp nền tảng cho lời khẳng định trước; “vì” làm rõ quan hệ ngầm ấy nhưng không thay đổi nội dung. Dấu câu tách câu vẫn là một khả năng hợp lệ.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng và giàu tính an ủi. Các từ “giọt lệ”, “sự chết”, “tang tóc” giữ âm hưởng Kinh Thánh nhưng vẫn thông dụng. Nhịp câu cân đối, tránh biệt ngữ giáo phái; các khả năng từ vựng chân thực của nguyên văn được bảo lưu trong chú thích.
