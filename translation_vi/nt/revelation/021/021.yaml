  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: mười hai cổng tương ứng mười hai ngọc trai, mỗi cổng từ một ngọc trai, và hình ảnh vàng tinh khiết như thủy tinh trong suốt. Tuy nhiên, πλατεῖα là danh từ số ít, thường gợi một đường rộng/đường lớn hoặc quảng trường; “đường phố” trong tiếng Việt thường gợi hệ thống hay nhiều đường phố và làm giảm nét số ít cùng sắc thái “rộng” của từ Hy Lạp.'
