id: REV.21.21
reference: Revelation 21:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: vi
  text: Mười hai cổng là mười hai viên ngọc trai; mỗi cổng được làm từ một viên ngọc trai. Con đường lớn[a] của thành bằng vàng ròng, trong suốt như thủy tinh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “quảng trường của thành”; từ Hy Lạp πλατεῖα có thể chỉ một con đường rộng hoặc một không gian công cộng rộng.
    reason: lexical_alternative
lexical_decisions:
- source_word: πυλῶνες
  choice: cổng
  rationale: Trong bối cảnh kiến trúc của Giê-ru-sa-lem mới, từ này chỉ cổng hoặc công trình cổng; “cổng” tự nhiên, rõ nghĩa và không quá kỹ thuật.
- source_word: μαργαρῖται / μαργαρίτου
  choice: những viên ngọc trai / một viên ngọc trai
  rationale: μαργαρίτης trực tiếp có nghĩa là ngọc trai. Cách chuyển từ số nhiều sang số ít được giữ lại để diễn tả mười hai cổng tương ứng với mười hai viên, mỗi cổng từ một viên.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: mỗi cổng
  rationale: Cụm này có ý phân phối mạnh, nghĩa là từng cổng một; “mỗi cổng” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ trọng tâm.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: được làm từ một viên ngọc trai
  rationale: ἐξ chỉ chất liệu hoặc nguồn gốc. “Được làm từ” diễn đạt rõ quan hệ vật liệu được hàm ý trong mô tả kiến trúc; “một viên” giữ ý nhấn mạnh của ἑνός.
- source_word: πλατεῖα
  choice: đường phố
  rationale: πλατεῖα có thể chỉ đường rộng hoặc không gian công cộng rộng. “Đường phố” tự nhiên trong tiếng Việt và không buộc hình ảnh phải là quảng trường; các khả năng khác được ghi ở chú thích.
- source_word: χρυσίον καθαρὸν
  choice: vàng ròng
  rationale: Cụm này chỉ vàng tinh khiết; “vàng ròng” là cách nói hiện đại, trang trọng và quen thuộc trong tiếng Việt.
- source_word: ὡς ὕαλος διαυγής
  choice: trong suốt như thủy tinh
  rationale: Cách đặt tính từ trước phép so sánh tạo câu tiếng Việt tự nhiên, đồng thời bảo toàn hình ảnh vàng có độ trong suốt như thủy tinh.
theological_decisions:
- issue: Hình ảnh πλατεῖα trong thành
  choice: Dịch là “đường phố của thành”, giữ dạng số ít tập hợp và không xác định chi tiết quy hoạch đô thị.
  alternative: “đường lớn của thành” hoặc “quảng trường của thành”
  rationale: Đây chủ yếu là điểm mơ hồ từ vựng. Bản dịch chính chọn cách hiểu tự nhiên trong khung cảnh thành phố, còn chú thích bảo lưu các khả năng thật sự của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vàng ròng” thay cho cách nói nặng tính cổ văn; giữ nhịp song song của câu và hình ảnh thị kiến nổi bật. Dấu chú thích [a] xuất hiện ngay sau cụm từ có vấn đề từ vựng.
