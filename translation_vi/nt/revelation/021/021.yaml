  to: Mười hai cổng là mười hai viên ngọc trai; mỗi cổng được làm từ một viên ngọc trai. Con đường lớn[a] của thành bằng vàng ròng, trong suốt như thủy tinh.
  rationale: Đổi “đường phố” thành “con đường lớn” để phản ánh sát hơn danh từ số ít πλατεῖα và ý nghĩa đường rộng; giữ khả năng “quảng trường” trong chú thích. Dời neo chú thích đến đúng cụm từ được chú giải. Các hình ảnh và thuật ngữ còn lại được giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
