revisions:
- from: 'Rồi tôi nghe một tiếng lớn từ ngai phán rằng: “Kìa, nơi ngự của Đức Chúa Trời ở cùng loài người![a] Ngài sẽ ngự cùng họ, họ sẽ là các dân của Ngài,[b] và chính Đức Chúa Trời sẽ ở cùng họ.”'
  to: 'Rồi tôi nghe một tiếng nói lớn từ ngai phán rằng: “Kìa, nơi ngự của Đức Chúa Trời ở cùng loài người,[a] Ngài sẽ ngự cùng họ, họ sẽ là các dân của Ngài,[b] và chính Đức Chúa Trời sẽ ở cùng họ.”'
  rationale: Sửa dấu câu để giữ cấu trúc liên tục của câu Hy Lạp, thay “một tiếng lớn” bằng “một tiếng nói lớn” cho tự nhiên hơn, và làm rõ chú thích về liên hệ σκηνή/σκηνώσει. Các lựa chọn thuật ngữ và số nhiều “các dân” được giữ nguyên.
