id: REV.21.3
reference: Revelation 21:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: vi
  text: 'Rồi tôi nghe một tiếng nói lớn từ ngai phán rằng: “Kìa, nơi ngự của Đức Chúa Trời ở cùng loài người,[a] Ngài sẽ ngự cùng họ, họ sẽ là các dân của Ngài,[b] và chính Đức Chúa Trời sẽ ở cùng họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nơi ngự” dịch từ σκηνή, nghĩa đen là “lều” hoặc “đền tạm.” Động từ Hy Lạp ngay sau đó, dịch là “ngự,” có liên hệ từ nguyên với từ này; có thể dịch sát là “dựng lều” hoặc “ở trong lều” cùng họ.
    reason: lexical_alternative
  - marker: b
    text: 'Bản Hy Lạp dùng số nhiều: “các dân,” không phải “dân” ở số ít.'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: một tiếng lớn
  rationale: Cách nói tự nhiên, trang trọng trong văn phong Kinh Thánh tiếng Việt, diễn đạt âm lượng và uy lực của lời công bố.
- source_word: ἐκ τοῦ θρόνου
  choice: từ ngai
  rationale: Giữ nguyên hình ảnh ngai trong Khải Huyền và diễn đạt rõ nguồn phát ra tiếng nói.
- source_word: λεγούσης
  choice: phán rằng
  rationale: Vì tiếng phát ra từ ngai và mang sắc thái tuyên cáo thần thượng, “phán” phù hợp hơn “nói” trong ngữ cảnh trang trọng này, nhưng không xác định thêm người nói.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ lực kêu gọi chú ý của ἰδού bằng một từ hiện đại nhưng vẫn trang trọng.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: nơi ngự của Đức Chúa Trời
  rationale: Diễn đạt rõ nơi Đức Chúa Trời hiện diện giữa nhân loại; chú thích giữ hình ảnh sát nghĩa là lều hoặc đền tạm.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: ở cùng loài người
  rationale: ἄνθρωποι chỉ con người nói chung; “loài người” vừa tự nhiên vừa không giới hạn theo giới tính.
- source_word: σκηνώσει μετ’ αὐτῶν
  choice: Ngài sẽ ngự cùng họ
  rationale: “Ngự” diễn đạt sự hiện diện lâu dài và trang trọng của Đức Chúa Trời; chú thích cho biết động từ cùng gốc với “lều/đền tạm” để bảo tồn liên tưởng nguyên ngữ.
- source_word: λαοὶ αὐτοῦ
  choice: các dân của Ngài
  rationale: Giữ số nhiều λαοί, không san phẳng thành “dân” số ít; “các dân” là cách nói tự nhiên trong tiếng Việt.
- source_word: αὐτὸς ὁ θεός
  choice: chính Đức Chúa Trời
  rationale: “Chính” thể hiện sắc thái nhấn mạnh của αὐτός.
- source_word: μετ’ αὐτῶν ἔσται
  choice: sẽ ở cùng họ
  rationale: Diễn đạt trực tiếp công thức về sự hiện diện của Đức Chúa Trời, không thêm ý ngoài bản văn.
theological_decisions:
- issue: Số nhiều λαοὶ so với cách dịch truyền thống ở số ít
  choice: họ sẽ là các dân của Ngài
  alternative: họ sẽ là dân của Ngài
  rationale: Bản SBLGNT đọc λαοί ở số nhiều. Giữ “các dân” bảo tồn một nét có ý nghĩa của bản văn mà không giải thích dứt khoát mối quan hệ giữa tính đa dạng của các dân và sự hiệp nhất của cộng đồng được cứu chuộc.
- issue: Hình ảnh lều/đền tạm trong σκηνή và σκηνόω
  choice: nơi ngự ... Ngài sẽ ngự
  alternative: lều của Đức Chúa Trời ... Ngài sẽ dựng lều ở cùng họ; đền tạm của Đức Chúa Trời ... Ngài sẽ ở giữa họ
  rationale: Bản chính ưu tiên tiếng Việt rõ ràng, trang trọng; chú thích bảo tồn hình ảnh lều/đền tạm và sự lặp từ trong tiếng Hy Lạp, vốn gợi sự hiện diện của Đức Chúa Trời.
- issue: Chủ thể của tiếng phán từ ngai
  choice: một tiếng lớn từ ngai phán rằng
  alternative: một tiếng lớn từ ngai nói rằng
  rationale: Bản văn nói tiếng phát ra từ ngai nhưng không nêu danh người nói. Cách dịch không đồng nhất tiếng ấy với Đức Chúa Trời hay một hữu thể cụ thể, nhờ đó giữ sự không xác định của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; “ngự” duy trì sắc thái tôn kính. Các dấu chú thích [a], [b] đều xuất hiện trong bản chính ngay tại nội dung liên quan.
