source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: vi
  text: Ở phía đông[a] có ba cổng, ở phía bắc có ba cổng, ở phía nam có ba cổng, và ở phía tây có ba cổng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Từ phía đông ... từ phía bắc ... từ phía nam ... từ phía tây”; ở đây cụm từ được dịch theo cách tự nhiên để chỉ phía có các cổng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: phía đông
  rationale: Trong phần mô tả sơ đồ thành, cụm này chỉ vị trí ở phía đông. Cách dịch này tự nhiên trong tiếng Việt và tránh sắc thái chuyển động hoặc nguồn gốc mà “từ phía đông” có thể gợi ra.
- source_word: πυλῶνες
  choice: cổng
  rationale: πυλών có thể chỉ cổng hoặc lối cổng, kể cả một kiến trúc cổng lớn. “Cổng” rõ ràng, tự nhiên và phù hợp với các lối ra vào trên tường thành.
- source_word: τρεῖς
  choice: ba
  rationale: Số từ được lặp lại ở từng phía để giữ nhịp liệt kê cân xứng của nguyên văn.
- source_word: ἀπὸ βορρᾶ
  choice: phía bắc
  rationale: Chỉ vị trí ở phía bắc của thành và được dịch song song với các phương hướng khác.
- source_word: ἀπὸ νότου
  choice: phía nam
  rationale: Chỉ vị trí ở phía nam của thành và giữ cấu trúc cân xứng.
- source_word: ἀπὸ δυσμῶν
  choice: phía tây
  rationale: δυσμαί liên hệ với nơi mặt trời lặn, tức hướng tây; “phía tây” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: dùng dấu phẩy trong ba vế đầu và “và” trước vế cuối
  rationale: Tiếng Việt hiện đại thường không lặp “và” giữa mọi thành phần của một phép liệt kê. Cấu trúc bốn vế song song và việc lặp “có ba cổng” vẫn bảo toàn nhịp điệu cân xứng, còn “và” trước vế cuối phản ánh sự kết nối của nguyên văn.
theological_decisions:
- issue: Cách hiểu phần mô tả vị trí các cổng của Giê-ru-sa-lem mới
  choice: 'Dịch như một bản liệt kê trực tiếp: mỗi phía trong bốn phía có ba cổng.'
  alternative: Có thể hiểu thêm ý nghĩa biểu tượng liên hệ với cách bố trí các chi phái Israel hoặc khải tượng thành-đền thờ trong Ê-xê-chi-ên.
  rationale: Bản thân câu này chỉ liệt kê các cổng theo bốn phương. Bản dịch không đưa những liên hệ biểu tượng có thể có vào chính văn, nhờ đó để ngỏ việc giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bốn vế song song cùng việc lặp “có ba cổng” giữ nét đều đặn, cân xứng của nguyên văn; “phía đông/bắc/nam/tây” diễn đạt vị trí tự nhiên hơn “từ phía...” trong tiếng Việt.
