id: REV.21.7
reference: Revelation 21:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: vi
  text: Người chiến thắng sẽ thừa hưởng những điều này[a]. Ta sẽ là Đức Chúa Trời của người ấy, và người ấy sẽ là con trai của Ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người vượt thắng.” Động từ Hy Lạp νικάω là một từ ngữ lặp lại trong sách Khải Huyền, diễn tả sự vượt thắng hoặc chiến thắng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “người ấy sẽ là con trai của Ta.” “Con trai” ở đây có thể mang ý nghĩa đại diện, nhưng bản dịch giữ nguyên hình ảnh làm con và thừa hưởng trong nguyên văn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Người chiến thắng
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ người có đặc trưng là thắng vượt. “Người chiến thắng” tự nhiên trong tiếng Việt và giữ được mô-típ νικάω lặp lại trong sách Khải Huyền; chú thích nêu phương án “người thắng vượt” để làm rõ sắc thái kiên vững thắng hơn.
- source_word: κληρονομήσει
  choice: sẽ thừa hưởng
  rationale: Giữ ý nhận phần gia nghiệp cùng sắc thái gia đình và giao ước, đồng thời phù hợp với lời cha–con ngay sau đó.
- source_word: ταῦτα
  choice: những điều này
  rationale: Phản ánh trực tiếp đại từ chỉ định số nhiều, quy chiếu đến những điều trong khải tượng vừa được mô tả mà không tự ý thêm ý “tất cả”.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: Ta sẽ là Đức Chúa Trời của người ấy
  rationale: Diễn đạt tự nhiên công thức quan hệ giao ước và chuyển tải lực của cách dữ cách αὐτῷ.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: người ấy sẽ là con trai của Ta
  rationale: Giữ quan hệ phụ tử trong nguyên văn và diễn đạt tự nhiên bằng tiếng Việt; không biến danh từ không có mạo từ thành “một người con” một cách không cần thiết.
- source_word: υἱός
  choice: con trai
  rationale: Giữ danh từ giống đực cụ thể và hình ảnh quyền thừa kế–làm con; phạm vi đại diện có thể rộng hơn giới tính nam được giải thích trong chú thích thay vì trung tính hóa chính văn.
theological_decisions:
- issue: Ngôn ngữ làm con mang giống đực trong lời hứa có tính đại diện
  choice: Giữ “con trai” trong chính văn
  alternative: con
  rationale: υἱός là danh từ giống đực số ít và gắn chặt với hình ảnh thừa hưởng. Cách nói có thể mang tính đại diện cho mọi người chiến thắng, nhưng không nên xóa nét phụ tử của nguyên văn.
- issue: Âm hưởng công thức giao ước
  choice: “Ta sẽ là Đức Chúa Trời của người ấy, và người ấy sẽ là con trai của Ta”
  alternative: “Ta sẽ là Đức Chúa Trời đối với người ấy, và người ấy sẽ là một người con đối với Ta”
  rationale: Bản chọn tự nhiên hơn trong tiếng Việt, vẫn bảo toàn quan hệ giao ước và ngôn ngữ phụ tử, không thêm diễn giải giáo lý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” trong lời phán trực tiếp của Đức Chúa Trời; dùng “người ấy” để tránh đại từ mang sắc thái suồng sã và duy trì quan hệ quy chiếu rõ ràng. Mọi dấu chú thích [a], [b] đều có mặt trong chính văn.
