  - severity: low
    issue: Chú thích [a] nói νικάω «chỉ việc trung tín mà thắng hơn».
    rationale: «Trung tín» là diễn giải theo văn cảnh Khải Huyền, không phải nghĩa từ vựng được nêu trực tiếp bởi động từ. Nên mô tả trung tính là thuật ngữ lặp lại về sự vượt thắng/chiến thắng.
