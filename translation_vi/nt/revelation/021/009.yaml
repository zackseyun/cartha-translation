id: REV.21.9
reference: Revelation 21:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: vi
  text: 'Bấy giờ, một trong bảy thiên sứ có bảy chiếc bát đầy bảy tai họa cuối cùng đến nói với tôi[a]: “Hãy lại đây, tôi sẽ chỉ cho ông thấy cô dâu, là vợ của Chiên Con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nói cùng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên bước tiến của mạch kể, đồng thời giữ chức năng liên kết của Καὶ.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: một trong bảy thiên sứ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc chỉ một thành viên thuộc một nhóm.
- source_word: τὰς ἑπτὰ φιάλας
  choice: bảy chiếc bát
  rationale: φιάλη chỉ loại bát hoặc chén nông; “bát” tránh hình dung sai về những chiếc lọ nhỏ.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: đầy bảy tai họa cuối cùng
  rationale: Giữ ý nghĩa “đầy” của γέμω, dịch πληγή là “tai họa” phù hợp văn cảnh Khải Huyền và ἔσχατος là “cuối cùng” theo trình tự.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: nói với tôi
  rationale: Là cách nói tự nhiên trong tiếng Việt; chú thích lưu lại sắc thái sát chữ của μετά là “cùng/với”.
- source_word: Δεῦρο
  choice: Hãy lại đây
  rationale: Chuyển lời mời gọi hoặc mệnh lệnh đến gần một cách rõ ràng, tự nhiên.
- source_word: δείξω σοι
  choice: tôi sẽ chỉ cho ông thấy
  rationale: Giữ trực tiếp thì tương lai và đại từ số ít; “ông” phù hợp lời một thiên sứ nói với người kể chuyện trong văn phong trang trọng.
- source_word: τὴν νύμφην
  choice: cô dâu
  rationale: Tương đương trực tiếp và tự nhiên của νύμφη trong hình ảnh hôn lễ.
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: là vợ của Chiên Con
  rationale: γυνή trong thế đồng vị với “cô dâu” mang nghĩa “vợ”; “Chiên Con” được viết hoa vì là danh hiệu chỉ về Đức Kitô trong Khải Huyền.
theological_decisions:
- issue: Quan hệ giữa νύμφην và γυναῖκα
  choice: 'Giữ cả hai danh từ: “cô dâu, là vợ của Chiên Con”'
  alternative: “cô dâu của Chiên Con” hoặc “người vợ mới cưới của Chiên Con”
  rationale: Bản Hy Lạp đặt hai danh từ đồng vị. Giữ cả “cô dâu” và “vợ” bảo toàn hình ảnh hôn lễ và không thu gọn cách diễn đạt của nguyên văn.
- issue: ἀρνίον như một danh hiệu Kitô học
  choice: Chiên Con
  alternative: con chiên
  rationale: Trong Khải Huyền, từ này được dùng như một danh hiệu chỉ về Chúa Giê-su; viết hoa thể hiện chức năng danh hiệu mà không thêm phần giải nghĩa thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể khải tượng, dùng “thiên sứ,” “tai họa” và danh hiệu “Chiên Con” nhất quán với ngữ vực Kinh Thánh; không thêm cách giải thích giáo phái.
