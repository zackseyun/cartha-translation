  to: 'Bấy giờ, một trong bảy thiên sứ có bảy chiếc bát đầy bảy tai họa cuối cùng đến nói với tôi[a]: “Hãy lại đây, tôi sẽ chỉ cho ông thấy cô dâu, là vợ của Chiên Con.”'
