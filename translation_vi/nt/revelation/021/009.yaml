    rationale: “Nói chuyện” có thể gợi một cuộc trò chuyện kéo dài hơn điều câu văn xác định. Phương án “nói cùng tôi” vừa sát cấu trúc ἐλάλησεν μετ’ ἐμοῦ hơn, vừa là một lựa chọn từ vựng rõ ràng đối lập với bản văn chính “nói với tôi.”
