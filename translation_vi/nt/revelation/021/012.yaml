  source_fidelity: 'Bản nháp phản ánh đúng các yếu tố chính của bản Hy Lạp: tường lớn và cao, mười hai cổng, mười hai thiên sứ tại các cổng, và các tên thuộc mười hai chi phái của các con trai Ít-ra-ên. Tuy nhiên, “Trên đó” có tiền chỉ không rõ trong tiếng Việt và cấu trúc “chi phái con trai Ít-ra-ên” thiếu quan hệ sở thuộc cần thiết để diễn đạt chính xác φυλῶν υἱῶν Ἰσραήλ.'
