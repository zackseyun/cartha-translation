id: REV.21.12
reference: Revelation 21:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: vi
  text: Thành ấy có một bức tường lớn và cao, có mười hai cổng; tại các cổng có mười hai thiên sứ, và trên các cổng có ghi những tên của mười hai chi phái của các con trai Ít-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo cách truyền thống: “mười hai chi phái của con cái Ít-ra-ên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: có
  rationale: Phân từ hiện tại giống cái số ít bổ nghĩa cho thành ở câu trước; tiếng Việt tự nhiên dùng “có” mà vẫn giữ dòng mô tả.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: một bức tường lớn và cao
  rationale: Giữ riêng cả hai tính từ μέγα và ὑψηλόν bằng cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: πυλῶνας δώδεκα
  choice: mười hai cổng
  rationale: “Cổng” là từ thông dụng và phù hợp với hình ảnh một thành có tường bao.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: tại các cổng
  rationale: ἐπί với cách dữ ở đây mang nghĩa vị trí; “tại” tránh hàm ý các thiên sứ ở ngay trên nóc cổng.
- source_word: ἀγγέλους δώδεκα
  choice: mười hai thiên sứ
  rationale: “Thiên sứ” là cách gọi trang trọng, quen thuộc trong tiếng Việt và diễn đạt đúng ἄγγελος trong ngữ cảnh này.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: có khắc những tên
  rationale: ἐπιγεγραμμένα chỉ việc được viết hoặc khắc trên một bề mặt; “khắc” phù hợp với bối cảnh kiến trúc và sắc thái bền vững.
- source_word: φυλῶν
  choice: chi phái
  rationale: “Chi phái” là cách diễn đạt chuẩn, dễ hiểu cho các đơn vị bộ tộc của Israel trong văn cảnh Kinh Thánh.
- source_word: υἱῶν Ἰσραήλ
  choice: con trai Ít-ra-ên
  rationale: Giữ nghĩa cụ thể của υἱῶν là “các con trai”, đồng thời hiểu Ít-ra-ên là tên tổ phụ trong cấu trúc này.
theological_decisions:
- issue: Cách dịch danh xưng tập thể υἱῶν Ἰσραήλ
  choice: con trai Ít-ra-ên
  alternative: con cái Ít-ra-ên
  rationale: Bản văn Hy Lạp dùng từ chỉ “con trai”. Bản chính giữ nét thân tộc giống đực mà không đồng nhất hóa thành một thuật ngữ rộng hơn; cách nói truyền thống, có thể mang nghĩa tập thể rộng hơn, được nêu ở chú thích.
- issue: Đối tượng của các tên được khắc
  choice: những tên của mười hai chi phái
  alternative: những tên, là [tên] của mười hai chi phái
  rationale: Mệnh đề ἅ ἐστιν τῶν... xác định các tên thuộc về mười hai chi phái. Tiếng Việt cần nêu quan hệ sở thuộc cho tự nhiên, nhưng không xác định cụ thể đó là tên người hay tên gọi chi phái ngoài điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “thành”, “chi phái”, “thiên sứ” để giữ sắc thái khải tượng Kinh Thánh; phiên âm “Ít-ra-ên” theo lối tiếng Việt phổ thông. Dấu [a] đặt ngay sau cụm từ được chú thích.
