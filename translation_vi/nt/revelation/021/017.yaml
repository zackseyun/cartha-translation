id: REV.21.17
reference: Revelation 21:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: vi
  text: Người đo tường thành ấy được 144 cu-bít, theo thước đo của con người, cũng là thước đo của thiên sứ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “theo thước đo của một người, tức là của một thiên sứ.” Tiếng Hy Lạp có thể nhấn mạnh rằng thiên sứ dùng đơn vị đo của con người, hoặc rằng thước đo của con người và của thiên sứ tương ứng với nhau ở đây.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: đo … được
  rationale: Động từ aorist chủ động của μετρέω chỉ hành động đo; cấu trúc “đo … được” tự nhiên trong tiếng Việt khi nêu kết quả đo.
- source_word: τεῖχος
  choice: tường thành
  rationale: τεῖχος ở đây là tường bao của thành; “tường thành” rõ nghĩa và phù hợp với bối cảnh Giê-ru-sa-lem mới.
- source_word: αὐτῆς
  choice: ấy
  rationale: Đại từ sở hữu quy chiếu về thành; tiếng Việt tự nhiên diễn đạt bằng “tường thành ấy”, tránh lối dịch cứng “tường của nó”.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 cu-bít
  rationale: Giữ nguyên đơn vị cổ thay vì quy đổi vì bản văn nhấn mạnh chính chuẩn đo; dùng chữ số giúp dễ đọc.
- source_word: μέτρον
  choice: thước đo
  rationale: μέτρον có thể chỉ phép đo hoặc chuẩn đo; “thước đo” ngắn gọn, tự nhiên và giữ được sắc thái chuẩn dùng để đo.
- source_word: ἀνθρώπου
  choice: của con người
  rationale: ἄνθρωπος mang nghĩa chung về loài người, không nhất thiết chỉ một người nam; cách dịch này chính xác về giới và tự nhiên trong tiếng Việt.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: cũng là thước đo của thiên sứ
  rationale: Bổ sung lại “thước đo” để làm rõ cấu trúc tỉnh lược của tiếng Hy Lạp; “cũng” thể hiện khả năng hai chuẩn đo tương ứng mà không giải thích quá mức.
theological_decisions:
- issue: Ý nghĩa của μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Diễn đạt rằng thước đo của con người cũng là thước đo của thiên sứ trong trường hợp này.
  alternative: Theo thước đo của một người, tức là của một thiên sứ; hoặc thiên sứ dùng một đơn vị đo của con người.
  rationale: Câu Hy Lạp cô đọng và có thể nhấn mạnh đơn vị đo mà thiên sứ sử dụng hoặc sự tương ứng giữa phép đo của con người và thiên sứ. Bản dịch chính giữ cách giải thích tương đương, còn chú thích bảo tồn độ mơ hồ thực sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tường thành” xác định đúng vật được đo; “cu-bít” giữ đơn vị cổ. Dấu chú thích được đặt sau toàn bộ mệnh đề có tính giải thích để bao quát điểm mơ hồ của nguyên văn.
