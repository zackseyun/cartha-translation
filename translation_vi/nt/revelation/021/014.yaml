  terminology: “Chiên Con” chuyển tải đúng danh hiệu ἀρνίον trong Khải Huyền, với viết hoa phù hợp chức năng danh hiệu. “Sứ đồ” giữ đúng sắc thái thuật ngữ của ἀπόστολοι. Chú thích nêu khả năng “tảng đá móng” một cách thận trọng, không áp đặt một cách hiểu kiến trúc duy nhất.
