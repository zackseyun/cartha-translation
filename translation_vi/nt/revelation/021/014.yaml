  source_fidelity: 'Bản dịch bảo toàn đầy đủ các yếu tố của bản Hy Lạp: bức tường thuộc thành, mười hai nền móng, mười hai tên ở trên các nền ấy, và mười hai sứ đồ của Chiên Con. Cách chuyển phân từ ἔχων thành động từ hữu hạn “có” là tự nhiên trong tiếng Việt và không thêm hay giảm nghĩa. “Trên đó” quy chiếu thích hợp đến “mười hai nền móng.”'
