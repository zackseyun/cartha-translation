id: REV.21.14
reference: Revelation 21:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: vi
  text: Tường thành có mười hai nền móng[a], và trên đó có mười hai tên của mười hai sứ đồ của Chiên Con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mười hai tảng đá móng”. Từ Hy Lạp θεμελίους trong ngữ cảnh kiến trúc có thể chỉ các nền móng hoặc các tảng đá móng.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: tường thành
  rationale: Trong ngữ cảnh kiến trúc đô thị, cụm này tự nhiên và chính xác hơn từ chung chung “tường”, đồng thời diễn đạt bức tường bao quanh thành.
- source_word: πόλεως
  choice: thành
  rationale: Kết hợp với τεῖχος thành cụm tiếng Việt tự nhiên “tường thành”, vẫn bảo toàn quan hệ sở thuộc của nguyên văn.
- source_word: ἔχων
  choice: có
  rationale: Phân từ hiện tại được chuyển thành động từ hữu hạn để câu tiếng Việt tự nhiên, không làm thay đổi ý nghĩa miêu tả.
- source_word: θεμελίους δώδεκα
  choice: mười hai nền móng
  rationale: θεμέλιος có thể chỉ nền móng hoặc đá móng; “nền móng” là cách dịch trực tiếp, dễ hiểu, còn khả năng chỉ các khối đá móng được ghi ở chú thích.
- source_word: ἐπ’ αὐτῶν
  choice: trên đó
  rationale: Diễn đạt vị trí trên các nền móng một cách gọn và tự nhiên; “đó” quy chiếu rõ về cụm số nhiều theo ngữ cảnh dù tiếng Việt không biến đổi số.
- source_word: ὀνόματα
  choice: tên
  rationale: Giữ đúng nghĩa đơn giản của nguyên văn, không thêm ý rằng các tên được khắc hay ghi.
- source_word: ἀποστόλων
  choice: sứ đồ
  rationale: “Sứ đồ” là thuật ngữ Kinh Thánh quen thuộc trong tiếng Việt, giữ được nghĩa chức vụ đặc thù thay vì làm nhạt thành “sứ giả”.
- source_word: τοῦ ἀρνίου
  choice: của Chiên Con
  rationale: “Chiên Con” bảo toàn danh hiệu Cơ Đốc học nổi bật trong sách Khải Huyền; viết hoa để biểu thị chức năng danh hiệu.
theological_decisions:
- issue: Danh hiệu Cơ Đốc học ἀρνίον
  choice: Chiên Con
  alternative: chiên con
  rationale: Trong Khải Huyền, ἀρνίον thường xuyên hoạt động như danh hiệu chỉ Chúa Giê-su. Viết hoa biểu thị chức năng danh hiệu mà không thêm nội dung ngoài văn bản.
- issue: Quan hệ của các sứ đồ với Chiên Con
  choice: mười hai sứ đồ của Chiên Con
  alternative: mười hai sứ đồ thuộc về Chiên Con
  rationale: Giữ nguyên cấu trúc sở hữu/liên hệ của τοῦ ἀρνίου, không xác định hẹp hơn bản chất của quan hệ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tường thành”, “nền móng”, “sứ đồ” và danh hiệu “Chiên Con” theo cách dùng Kinh Thánh tiếng Việt quen thuộc; giữ nhịp lặp “mười hai” của nguyên văn.
