- from: 'Thành có hình vuông[a], chiều dài bằng chiều rộng. Vị ấy dùng thước đo[b] đo thành: mười hai ngàn sta-đi-ôn[c]. Chiều dài, chiều rộng và chiều cao của thành đều bằng nhau.'
  to: Thành có dạng hình vuông[a], chiều dài bằng chiều rộng. Người dùng thước đo[b] đo thành được mười hai ngàn sta-đi-ôn[c]. Chiều dài, chiều rộng và chiều cao của thành đều bằng nhau.
  rationale: Bản sửa giữ nguyên nghĩa và mức độ trực tiếp của tiếng Hy Lạp, đặc biệt là sự bằng nhau của ba kích thước thay vì gọi thành là một khối lập phương. Các thay đổi chỉ cải thiện cú pháp, độ tự nhiên và cách dùng thuật ngữ trong chú thích. Các dấu chú thích được giữ ngay sau các từ/cụm từ liên quan.
