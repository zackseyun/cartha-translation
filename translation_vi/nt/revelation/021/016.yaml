id: REV.21.16
reference: Revelation 21:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: vi
  text: Thành có dạng hình vuông[a], chiều dài bằng chiều rộng. Người dùng thước đo[b] đo thành được mười hai ngàn sta-đi-ôn[c]. Chiều dài, chiều rộng và chiều cao của thành đều bằng nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Thành được bố trí hình vuông.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn cũng có thể dịch là “cây sậy”; ở đây từ này chỉ một dụng cụ dùng để đo.
    reason: lexical_alternative
  - marker: c
    text: Sta-đi-ôn là một đơn vị đo khoảng cách thời cổ. Mười hai ngàn sta-đi-ôn tương đương khoảng 2.220 kilômét, tùy theo độ dài được dùng để tính một sta-đi-ôn.
    reason: cultural_note
lexical_decisions:
- source_word: τετράγωνος
  choice: có hình vuông
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý thành có bốn cạnh theo mặt bằng; không thêm kết luận diễn giải rằng toàn thành là một khối lập phương.
- source_word: κεῖται
  choice: Thành có hình
  rationale: Trong mô tả bố cục của thành, ý trạng thái hoặc cách thành được bố trí được diễn đạt tự nhiên bằng cấu trúc “có hình vuông”, tránh lối dịch cứng “nằm vuông”.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: chiều dài bằng chiều rộng
  rationale: ὅσον biểu thị sự tương đương về kích thước; cách nói này rõ ràng, ngắn gọn và tự nhiên.
- source_word: ἐμέτρησεν
  choice: đo
  rationale: Động từ aorist đơn giản chỉ hành động đo; chủ ngữ được dịch là “vị ấy” theo ngữ cảnh gần, tránh mặc định giới tính quá mạnh trong tiếng Việt.
- source_word: τῷ καλάμῳ
  choice: dùng thước đo
  rationale: κάλαμος vốn có thể là cây sậy, nhưng tại đây là dụng cụ đo; “thước đo” truyền đạt đúng chức năng trong ngữ cảnh.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: mười hai ngàn sta-đi-ôn
  rationale: Giữ nguyên đơn vị cổ và hấp thụ giới từ vào cách nêu kết quả đo tự nhiên trong tiếng Việt.
- source_word: στάδιος
  choice: sta-đi-ôn
  rationale: Phiên âm đơn vị đo khoảng cách cổ, thay vì đưa con số quy đổi có tính xấp xỉ vào chính văn.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Chiều dài, chiều rộng và chiều cao của thành đều bằng nhau
  rationale: Giữ nguyên lời khẳng định trực tiếp của tiếng Hy Lạp rằng cả ba kích thước bằng nhau, không thay bằng nhãn hình học diễn giải.
theological_decisions:
- issue: Giữ đơn vị cổ hay đổi sang đơn vị hiện đại trong chính văn
  choice: Giữ “mười hai ngàn sta-đi-ôn” trong chính văn
  alternative: Khoảng 2.220 kilômét
  rationale: Nguyên văn dùng đơn vị cổ; số quy đổi phụ thuộc độ dài stadion được giả định nên thích hợp hơn trong chú thích.
- issue: Có gọi thành là một khối lập phương hay không
  choice: Nói trực tiếp rằng chiều dài, chiều rộng và chiều cao đều bằng nhau
  alternative: Thành là một khối lập phương hoàn hảo
  rationale: Hình khối lập phương là hệ luận hợp lý, nhưng nguyên văn chỉ trực tiếp nêu sự bằng nhau của ba kích thước; bản dịch giữ cách diễn đạt ấy để không giải quyết thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thành” theo văn cảnh Khải Huyền và “vị ấy” cho chủ thể đo đã xuất hiện trong ngữ cảnh trước. Các dấu chú thích [a], [b], [c] đều có mặt trong chính văn và đặt ngay sau từ ngữ liên quan.
