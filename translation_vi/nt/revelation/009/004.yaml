id: REV.9.4
reference: Revelation 9:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: vi
  text: Chúng được bảo không được làm hại cỏ trên đất, hoặc bất cứ thứ gì xanh, hoặc bất cứ cây nào, mà chỉ được làm hại những người không có ấn của Đức Chúa Trời trên trán họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: Chúng được bảo
  rationale: Giữ thể bị động và không nêu rõ người truyền lệnh, đồng thời diễn đạt tự nhiên trong tiếng Việt; đại từ chỉ các tác nhân đã được nói đến trong ngữ cảnh.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: không được làm hại
  rationale: ἀδικέω trong bối cảnh tai họa mang nghĩa gây tổn hại; “không được” thể hiện lực của lời chỉ thị mà không thêm chủ thể ra lệnh.
- source_word: τὸν χόρτον τῆς γῆς
  choice: cỏ trên đất
  rationale: χόρτος chỉ cỏ hoặc thảm thực vật thấp; cách diễn đạt này tự nhiên và giữ quan hệ với γῆ.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: bất cứ thứ gì xanh tươi
  rationale: Giữ tính khái quát của tính từ được danh từ hóa χλωρόν, không thu hẹp thành riêng một loại cây cỏ.
- source_word: οὐδὲ πᾶν δένδρον
  choice: hay bất cứ cây nào
  rationale: Dịch trực tiếp δένδρον và phối hợp tự nhiên với các đối tượng thực vật đứng trước.
- source_word: εἰ μὴ τοὺς ἀνθρώπους
  choice: mà chỉ được làm hại những người
  rationale: εἰ μή nêu ngoại lệ duy nhất; lặp lại “được làm hại” giúp câu tiếng Việt rõ nghĩa. ἄνθρωποι chỉ con người nói chung.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: ấn của Đức Chúa Trời
  rationale: “Ấn” bảo toàn hình ảnh σφραγίς về dấu xác nhận, quyền sở hữu hoặc sự bảo hộ trong sách Khải Huyền.
- source_word: ἐπὶ τῶν μετώπων
  choice: trên trán
  rationale: μέτωπον là trán; tiếng Việt có thể dùng danh từ số ít theo nghĩa phân bố cho cả nhóm người mà không cần thêm đại từ sở hữu.
theological_decisions:
- issue: Phạm vi của τοὺς ἀνθρώπους
  choice: những người, tức con người nói chung
  alternative: những người đàn ông
  rationale: Ngữ cảnh đối lập thảm thực vật với những con người không có ấn; nguyên văn không giới hạn đối tượng ở nam giới.
- issue: Chủ thể của ἐρρέθη
  choice: Giữ chủ thể truyền lệnh không được nêu rõ
  alternative: Nói rõ rằng Đức Chúa Trời truyền lệnh
  rationale: Thể bị động trong tiếng Hy Lạp không xác định người nói. Dù ngữ cảnh hàm ý thẩm quyền thần thượng, bản dịch không nên thêm một chủ thể mà câu không nêu.
- issue: Ý nghĩa của ấn Đức Chúa Trời
  choice: Giữ nguyên hình ảnh “ấn” mà không giải thích ngay trong câu
  alternative: Diễn giải thành dấu bảo vệ hoặc dấu sở hữu của Đức Chúa Trời
  rationale: σφραγίς có sức gợi thần học đa diện trong Khải Huyền; diễn giải thành chỉ một chức năng sẽ thu hẹp ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός theo cách gọi Tin Lành quen thuộc trong tiếng Việt; giữ nhịp liệt kê và sự đối lập của nguyên văn. Không thêm chú thích vì các lựa chọn dịch chính có thể được thể hiện rõ ngay trong câu.
