id: REV.9.1
reference: Revelation 9:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: vi
  text: Vị thiên sứ thứ năm thổi kèn; tôi thấy một ngôi sao đã rơi từ trời xuống đất[a][b], và ngôi sao ấy được trao chìa khóa của giếng thông xuống vực sâu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch gọn: “một ngôi sao rơi từ trời xuống đất.” Dạng hoàn thành trong tiếng Hy Lạp có lẽ cho biết việc rơi đã xảy ra trước khi Giăng nhìn thấy.'
    reason: lexical_alternative
  - marker: b
    text: “Ngôi sao” có thể tượng trưng cho một hữu thể có ngôi vị, vì câu tiếp tục nói rằng ngôi sao ấy được trao chìa khóa.
    reason: alternative_reading
  - marker: c
    text: 'Theo cách dịch truyền thống: “chìa khóa của hố vực sâu” hoặc “chìa khóa vực sâu không đáy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Động từ σαλπίζω chỉ hành động thổi hoặc làm vang tiếng kèn. “Thổi kèn” tự nhiên, rõ nghĩa trong tiếng Việt và giữ nguyên hình ảnh của nguyên văn.
- source_word: ἀστέρα
  choice: một ngôi sao
  rationale: ἀστήρ có nghĩa trực tiếp là “ngôi sao”. Dù trong văn khải huyền hình ảnh này có thể tượng trưng cho một hữu thể có ngôi vị, bản dịch không thay hình ảnh bằng lời diễn giải.
- source_word: πεπτωκότα
  choice: đã ... rơi xuống
  rationale: Phân từ hoàn thành diễn tả việc rơi đã xảy ra và tình trạng kết quả vẫn còn khi Giăng nhìn thấy; từ “đã” thể hiện quan hệ thời gian này.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: từ trời ... xuống đất
  rationale: Cách dịch này giữ sự tương phản mang tính vũ trụ giữa trời và đất trong khải tượng, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐδόθη αὐτῷ
  choice: ngôi sao ấy được trao
  rationale: Giữ thể bị động và không nêu danh tính người trao, qua đó bảo toàn sự dè dặt của nguyên văn. Lặp lại “ngôi sao ấy” giúp tránh phải gán giới tính hay xác định bản thể qua đại từ tiếng Việt.
- source_word: ἡ κλεὶς
  choice: chìa khóa
  rationale: κλείς là chìa khóa, biểu thị quyền mở hoặc đóng. Ngữ cảnh xác định khiến cụm “được trao chìa khóa” tự nhiên mà không cần thêm “một”.
- source_word: τοῦ φρέατος τῆς ἀβύσσου
  choice: của giếng thông xuống vực sâu
  rationale: φρέαρ có thể chỉ giếng, hố hoặc một trục sâu; ἄβυσσος là vực sâu. “Giếng thông xuống vực sâu” phân biệt lối đi hoặc cửa mở với chính vực sâu, đồng thời diễn đạt quan hệ sở thuộc rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Có nên xác định “ngôi sao” là thiên sứ hoặc Sa-tan trong chính văn hay không
  choice: Giữ hình ảnh “ngôi sao” mà không xác định danh tính
  alternative: Dịch thành “một thiên sứ” hoặc một nhân vật thuộc về Sa-tan
  rationale: Câu này dùng hình ảnh ngôi sao và cho biết ngôi sao nhận chìa khóa, nên có thể hàm ý một hữu thể có ngôi vị; tuy nhiên, nguyên văn không xác định rõ danh tính. Bản dịch giữ nguyên sự căng thẳng ấy.
- issue: Có nên nói rõ Đức Chúa Trời là Đấng trao chìa khóa hay không
  choice: Giữ thể bị động “được trao” và không nêu tác nhân
  alternative: “Đức Chúa Trời trao cho ngôi sao ấy”
  rationale: Tác nhân của ἐδόθη không được nêu. Dù thể bị động có thể hàm ý sự cho phép hoặc quyền tể trị của Đức Chúa Trời, thêm danh Ngài vào chính văn sẽ vượt quá điều câu Hy Lạp nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu được tách ra để nhịp văn tiếng Việt sáng rõ. “Ngôi sao ấy” được lặp lại thay vì dùng “nó” hoặc “người”, nhằm tránh sắc thái thiếu trang trọng và không áp đặt cách hiểu về bản thể của hình ảnh.
