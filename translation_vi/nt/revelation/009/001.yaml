    issue: Trật tự từ ở cụm chỉ ngôi sao sa ngã hơi thiếu tự nhiên.
    rationale: 'Đặt “đã” ngay trước “rơi” trong “đã rơi từ trời xuống đất” là lối diễn đạt trôi chảy hơn. Sửa đổi này vẫn truyền đạt phân từ hoàn thành πεπτωκότα: ngôi sao đã rơi trước khi được thấy.'
