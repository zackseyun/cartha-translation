id: REV.9.8
reference: Revelation 9:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: vi
  text: Chúng có tóc như tóc phụ nữ[a], và răng chúng như răng sư tử.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “như tóc của phụ nữ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶχον
  choice: có
  rationale: Thì chưa hoàn thành trong lời miêu tả khải tượng được diễn đạt tự nhiên bằng động từ “có”; ngữ cảnh đã xác lập thời quá khứ.
- source_word: τρίχας
  choice: tóc
  rationale: Dù tiếng Hy Lạp dùng dạng số nhiều, tiếng Việt tự nhiên dùng danh từ tập hợp “tóc”.
- source_word: ὡς τρίχας γυναικῶν
  choice: như tóc phụ nữ
  rationale: Giữ nguyên phép so sánh do ὡς biểu thị, đồng thời dùng cách nói gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: răng chúng
  rationale: Diễn đạt quan hệ sở hữu rõ ràng và tự nhiên, với “chúng” tiếp nối chủ thể số nhiều của khải tượng.
- source_word: ὡς λεόντων
  choice: như răng sư tử
  rationale: Bổ sung danh từ “răng” vốn được hàm ý trong phép so sánh để câu tiếng Việt rõ nghĩa, không tạo cảm giác rằng chính những chiếc răng được ví với cả con sư tử.
- source_word: ἦσαν
  choice: như
  rationale: Trong cấu trúc tiếng Việt “răng chúng như răng sư tử”, hệ từ “là” có thể lược bỏ tự nhiên; quan hệ so sánh và ý nghĩa miêu tả vẫn được giữ đầy đủ.
theological_decisions:
- issue: Bản chất của hình ảnh trong lời miêu tả khải huyền
  choice: Giữ nguyên trực tiếp hai phép so sánh mà không giải nghĩa biểu tượng.
  alternative: Dùng lời diễn giải nhằm xác định ý nghĩa tượng trưng của tóc và răng.
  rationale: Bản Hy Lạp chỉ trình bày các nét tương đồng trong khải tượng mà không giải thích ý nghĩa; bản dịch vì thế không nên tự ý hóa giải sự căng thẳng hay tính bí ẩn của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng” phù hợp với các sinh vật được miêu tả trong ngữ cảnh; giữ nhịp hai vế song song của nguyên văn.
