base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: vi
  text: Bởi ba tai họa này, một phần ba loài người đã bị giết—bởi lửa, khói và lưu huỳnh ra từ miệng chúng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Diêm sinh” là tên gọi khác, có tính truyền thống hơn, của lưu huỳnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Bởi ba tai họa này
  rationale: Ở đây ἀπό chỉ nguyên nhân hoặc phương tiện. “Bởi” diễn đạt tự nhiên rằng ba tai họa là tác nhân gây chết, còn “này” giữ nghĩa của τούτων.
- source_word: ἀπεκτάνθησαν
  choice: đã bị giết
  rationale: Giữ thể bị động và ý nghĩa hoàn tất của động từ aorist mà không nêu thêm tác nhân ngoài điều văn bản nói.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: một phần ba loài người
  rationale: Cụm từ mang nghĩa phân lượng là một phần ba; ἀνθρώπων chỉ con người nói chung, không riêng nam giới. “Loài người” trang trọng, rõ nghĩa và tự nhiên trong văn cảnh phán xét.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: bởi lửa, khói và lưu huỳnh
  rationale: ἐκ nêu nguồn hoặc tác nhân của sự chết. “Lưu huỳnh” là cách gọi hiện đại, chính xác của θεῖον; tiếng Việt không cần lặp từ nối để giữ nhịp trang trọng.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: phun ra từ miệng chúng
  rationale: “Phun ra” chuyển tải hình ảnh vật chất đang tuôn ra khỏi miệng một cách sinh động và tự nhiên. Đại từ “chúng” quy chiếu về các con ngựa trong câu trước.
theological_decisions:
- issue: Phạm vi nghĩa của ἀνθρώπων trong cảnh phán xét
  choice: loài người
  alternative: người ta; nhân loại
  rationale: Từ Hy Lạp nói về con người nói chung chứ không chỉ nam giới. “Loài người” giữ phạm vi phổ quát và sắc thái trang trọng mà không thêm một lập trường thần học.
- issue: Quan hệ nhân quả của ba tai họa
  choice: bởi
  alternative: từ
  rationale: Cả ἀπό đầu câu và ἐκ trong phần giải thích có thể gợi nguồn hoặc phương tiện. “Bởi” làm rõ vai trò gây chết trong tiếng Việt nhưng không xác định thêm chủ thể tối hậu của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ cấu trúc giải thích nhấn mạnh của câu Hy Lạp. Bản dịch dùng “loài người” theo nghĩa bao quát mọi người, và “diêm sinh” chỉ được giữ trong chú thích như cách gọi truyền thống.
