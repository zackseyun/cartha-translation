  rationale: Bản sửa chỉ giảm sắc thái diễn giải của “phun ra” thành “ra từ,” phù hợp với ἐκπορευομένου và vẫn giữ rõ hình ảnh ba yếu tố phát ra từ miệng chúng. Chú thích được chỉnh để mô tả đúng quan hệ từ vựng giữa “lưu huỳnh” và “diêm sinh.”
