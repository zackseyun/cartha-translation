    issue: “ngọc dạ lan hương”
    rationale: Nguyên văn ὑακινθίνους không nói đến ngọc hay đá quý. Cụm này thêm một đối tượng và có thể làm người đọc hiểu sai chất liệu/hình ảnh được mô tả.
  - severity: low
    issue: “áo giáp che ngực”
    rationale: Không sai nghĩa, nhưng “áo giáp ngực” là cách gọi gọn và tự nhiên hơn cho θώρακες trong tiếng Việt hiện đại.
