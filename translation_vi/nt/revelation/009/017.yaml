  to: 'Tôi thấy trong khải tượng những con ngựa và những người ngồi trên chúng như sau: họ mặc áo giáp ngực đỏ rực như lửa, xanh tím như hoa dạ lan hương và vàng như lưu huỳnh[a]. Đầu của những con ngựa giống như đầu sư tử, và từ miệng chúng tuôn ra lửa, khói và lưu huỳnh[b].'
  rationale: Sửa “ngọc dạ lan hương” thành “hoa dạ lan hương” để loại bỏ ý niệm đá quý không có trong nguyên văn, đồng thời đổi “áo giáp che ngực” thành “áo giáp ngực” cho tự nhiên hơn. Các yếu tố còn lại, kể cả các sắc màu được diễn giải và các mốc chú thích, được giữ nguyên về nghĩa.
