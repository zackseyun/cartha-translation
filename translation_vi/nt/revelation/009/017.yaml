id: REV.9.17
reference: Revelation 9:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: vi
  text: 'Tôi thấy trong khải tượng những con ngựa và những người ngồi trên chúng như sau: họ mặc áo giáp ngực đỏ rực như lửa, xanh tím như hoa dạ lan hương và vàng như lưu huỳnh[a]. Đầu của những con ngựa giống như đầu sư tử, và từ miệng chúng tuôn ra lửa, khói và lưu huỳnh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “áo giáp ngực rực lửa, màu dạ lan hương và đậm chất lưu huỳnh.” Nguyên văn có thể nhấn mạnh dáng vẻ hoặc tính chất, chứ không trực tiếp nêu tên ba màu.'
    reason: lexical_alternative
  - marker: b
    text: “Lưu huỳnh” theo cách gọi truyền thống cũng là “diêm sinh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: như sau
  rationale: Giới thiệu cách thức và hình dạng của cảnh tượng mà Giăng thấy; “như sau” tự nhiên trong tiếng Việt và giữ được lực chỉ định của từ Hy Lạp.
- source_word: ἐν τῇ ὁράσει
  choice: trong khải tượng
  rationale: Trong văn cảnh Khải Huyền, ὅρασις chỉ một kinh nghiệm mặc khải bằng thị kiến, không chỉ là dáng vẻ nhìn thấy.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: những người ngồi trên chúng
  rationale: Giữ hình thức diễn đạt cụ thể của nguyên văn thay vì rút gọn thành “kỵ binh” hay “người cưỡi ngựa”.
- source_word: θώρακας
  choice: áo giáp che ngực
  rationale: Diễn đạt rõ loại giáp bảo vệ phần ngực bằng tiếng Việt phổ thông, đồng thời giữ hình ảnh cụ thể.
- source_word: πυρίνους
  choice: màu đỏ như lửa
  rationale: Trong chuỗi mô tả thị giác về áo giáp, từ này gợi màu và dáng vẻ của lửa; bản dịch làm rõ sắc màu nhưng vẫn giữ hình ảnh lửa.
- source_word: ὑακινθίνους
  choice: xanh tím như ngọc dạ lan hương
  rationale: Từ này chỉ màu gắn với hyacinth/jacinth, thường được hiểu là xanh đậm hoặc xanh tím; cách dịch vừa dễ hình dung vừa giữ liên hệ từ vựng cổ.
- source_word: θειώδεις
  choice: vàng như lưu huỳnh
  rationale: Trong ba tính từ phối hợp mô tả áo giáp, từ này nhiều khả năng chỉ dáng vẻ hoặc sắc vàng đặc trưng của lưu huỳnh.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: giống như đầu sư tử
  rationale: Giữ phép so sánh rõ ràng của ὡς và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐκπορεύεται
  choice: tuôn ra
  rationale: Động từ hiện tại diễn tả lửa, khói và lưu huỳnh liên tục đi ra từ miệng ngựa; tiếng Việt không cần đánh dấu số hay thì bằng hình thái.
- source_word: θεῖον
  choice: lưu huỳnh
  rationale: “Lưu huỳnh” là tên gọi hiện đại, rõ nghĩa của chất được chỉ đến; “diêm sinh” là cách gọi truyền thống hơn.
theological_decisions:
- issue: Ba tính từ mô tả áo giáp là chất liệu, tính chất hay màu sắc
  choice: Diễn đạt chủ yếu như ba sắc màu gắn với lửa, ngọc dạ lan hương và lưu huỳnh.
  alternative: Dịch sát hình thức hơn là “rực lửa, màu dạ lan hương và đậm chất lưu huỳnh”, không nêu rõ đỏ, xanh tím và vàng.
  rationale: Văn cảnh là một khải tượng giàu hình ảnh, và ba tính từ song song nhiều khả năng mô tả vẻ ngoài của áo giáp. Tuy vậy, nguyên văn không trực tiếp nêu các danh từ chỉ màu, nên chú thích bảo lưu khả năng dịch sát hơn.
- issue: Chủ thể mặc áo giáp
  choice: Hiểu ἔχοντας là nói về những người ngồi trên ngựa.
  alternative: Về mặt ngữ pháp, dạng giống đực số nhiều cũng có thể liên hệ với cả những con ngựa, nhưng hình ảnh áo giáp phù hợp trực tiếp nhất với người cưỡi.
  rationale: Cụm phân từ đứng gần “những người ngồi trên chúng” và theo nghĩa tự nhiên mô tả trang bị của những người cưỡi; bản dịch dùng “họ” để làm rõ quan hệ cú pháp này mà không thêm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “khải tượng” để phù hợp văn chương mặc khải; dùng “áo giáp che ngực” thay cho thuật ngữ quân sự ít quen thuộc. Cấu trúc được chia thành hai câu để tránh một câu quá dài nhưng vẫn giữ thứ tự các hình ảnh trong nguyên văn.
