id: REV.9.13
reference: Revelation 9:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: vi
  text: Thiên sứ thứ sáu thổi kèn; rồi tôi nghe một tiếng nói[a] phát ra từ các sừng của bàn thờ bằng vàng ở trước mặt Đức Chúa Trời,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một tiếng nói duy nhất.” Tiếng Hy Lạp nhấn mạnh rằng tiếng nói ấy là một.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: thổi kèn
  rationale: Động từ σαλπίζω có nghĩa là thổi hoặc làm vang tiếng kèn. “Thổi kèn” tự nhiên trong tiếng Việt và phù hợp với chuỗi tiếng kèn trong khải tượng.
- source_word: φωνὴν μίαν
  choice: một tiếng nói
  rationale: Cách dịch này giữ được nghĩa thông thường của φωνή và sự nhấn mạnh vào tính duy nhất của μίαν, nhưng không xác định người nói.
- source_word: ἐκ τῶν κεράτων
  choice: phát ra từ các sừng
  rationale: ἐκ chỉ nguồn phát ra; κέρατα là các phần nhô ra như sừng ở các góc bàn thờ. “Phát ra từ các sừng” diễn đạt tự nhiên nguồn của tiếng nói và giữ nguyên hình ảnh nghi lễ.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: bàn thờ bằng vàng
  rationale: Cụm từ này chỉ bàn thờ được mô tả là bằng vàng. Cách diễn đạt hiện đại, rõ ràng và giữ hình ảnh nơi thánh.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: ở trước mặt Đức Chúa Trời
  rationale: ἐνώπιον diễn tả vị trí trước mặt hoặc trong sự hiện diện của Đức Chúa Trời. Cách dịch này gần với cấu trúc Hy Lạp và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἄγγελος
  choice: thiên sứ
  rationale: Trong khải tượng của sách Khải Huyền, từ này chỉ một hữu thể thiên giới; “thiên sứ” là cách gọi trang trọng, quen thuộc và không gây nhầm với sứ giả loài người.
theological_decisions:
- issue: Danh tính của tiếng nói
  choice: Giữ cách diễn đạt trung tính “một tiếng nói”, không xác định chủ thể của tiếng nói.
  alternative: Diễn giải đó là tiếng của Đức Chúa Trời, của một thiên sứ, hoặc tiếng nói được nhân cách hóa của bàn thờ.
  rationale: Bản Hy Lạp chỉ nói Giăng nghe một tiếng nói phát ra từ các sừng của bàn thờ bằng vàng. Việc không bổ sung danh tính bảo toàn sự mơ hồ có chủ ý của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ”, “bàn thờ” và “Đức Chúa Trời” theo cách dùng Kinh Thánh phổ biến; giữ hình ảnh các sừng của bàn thờ mà không diễn giải thêm. Dấu phẩy cuối câu được giữ vì câu này tiếp tục sang nội dung lời nói ở câu kế tiếp.
