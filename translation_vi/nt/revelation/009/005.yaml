id: REV.9.5
reference: Revelation 9:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: vi
  text: Chúng được ban cho quyền, không phải để giết những người ấy, nhưng để những người ấy phải chịu đau đớn trong năm tháng; nỗi đau đớn do chúng gây ra giống như nỗi đau đớn do bò cạp gây ra khi nó chích một người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: chúng được ban cho quyền
  rationale: Giữ thể bị động, không nêu đích danh Đấng ban, đồng thời diễn đạt tự nhiên hàm ý quyền hoặc sự cho phép trong ngữ cảnh khải huyền.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: không giết những người ấy
  rationale: Diễn đạt nội dung giới hạn được đặt trên các tác nhân giống châu chấu; “những người ấy” giúp phân biệt đối tượng với chủ thể số nhiều.
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: nhưng hành hạ họ trong năm tháng
  rationale: Chuyển cấu trúc bị động Hy Lạp bất thường sau ἵνα thành lối nói chủ động tự nhiên trong tiếng Việt, trong khi vẫn giữ rõ sự tương phản giữa không giết và gây đau đớn trong một thời hạn.
- source_word: βασανισθήσονται / βασανισμός
  choice: hành hạ / nỗi đau đớn
  rationale: “Hành hạ” thể hiện tác động gây khổ sở nghiêm trọng; trong phép so sánh với bò cạp, “nỗi đau đớn” tự nhiên hơn việc lặp cứng nhắc cùng một từ.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: nỗi đau đớn chúng gây ra
  rationale: 'Làm rõ quan hệ chủ thể hợp lý theo ngữ cảnh: đây là sự đau đớn do các tác nhân ấy gây cho con người, không phải nỗi đau mà chính chúng chịu.'
- source_word: ὡς βασανισμὸς σκορπίου
  choice: giống như nỗi đau do bò cạp gây ra
  rationale: Giữ phép so sánh và diễn đạt quan hệ sở hữu/chủ thể của sở hữu cách bằng tiếng Việt tự nhiên.
- source_word: ὅταν παίσῃ ἄνθρωπον
  choice: khi nó chích một người
  rationale: παίω có nghĩa cơ bản là đánh hoặc đập, nhưng với chủ thể là bò cạp, “chích” truyền đạt chính xác hành động theo ngữ cảnh; ἄνθρωπον mang nghĩa chỉ người nói chung nên dịch là “một người”.
theological_decisions:
- issue: Thể bị động hàm ý tác nhân thần linh trong sự phán xét khải huyền
  choice: Giữ thể bị động “được ban cho quyền” mà không nêu người ban.
  alternative: “Đức Chúa Trời ban cho chúng quyền” hoặc “chúng được phép”
  rationale: Nguyên văn không nêu tác nhân. Cách dịch này bảo toàn sự dè dặt của bản văn về quyền tể trị thần linh và sự phán xét qua trung gian.
- issue: Quan hệ của αὐτῶν trong ὁ βασανισμὸς αὐτῶν
  choice: Hiểu là nỗi đau đớn chúng gây ra.
  alternative: “sự hành hạ của chúng” với quan hệ để ngỏ
  rationale: Mạch văn nói các tác nhân không được giết mà được gây đau đớn; phép so sánh với bò cạp cũng hướng đến nỗi đau chúng gây cho người khác.
- issue: Phạm vi của ἄνθρωπον
  choice: Dịch là “một người”, mang nghĩa đại diện chung.
  alternative: “một người đàn ông”
  rationale: ἄνθρωπος ở đây chỉ con người nói chung, không nhấn mạnh giới tính; “một người” vừa chính xác vừa tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bò cạp” là cách gọi phổ thông; “chích” tự nhiên và chính xác theo ngữ cảnh hơn cách dịch sát nghĩa từ vựng là “đánh”. Không dùng chú thích vì các sắc thái cần thiết có thể truyền đạt rõ trong chính văn.
