revisions:
- from: Chúng được ban cho quyền không giết những người ấy, nhưng hành hạ họ trong năm tháng; và nỗi đau đớn chúng gây ra giống như nỗi đau do bò cạp gây ra khi nó chích một người.
  to: Chúng được ban cho quyền, không phải để giết những người ấy, nhưng để những người ấy phải chịu đau đớn trong năm tháng; nỗi đau đớn do chúng gây ra giống như nỗi đau đớn do bò cạp gây ra khi nó chích một người.
  rationale: Bản sửa giữ thể bị động hàm ý trong “được ban cho” mà không nêu Đấng ban, đồng thời biểu đạt rõ đối tượng của βασανισθήσονται là “những người ấy phải chịu đau đớn.” Cấu trúc “không phải để ... nhưng để ...” phản ánh tương phản của hai mệnh đề ἵνα. Sự lặp “nỗi đau đớn” bảo toàn liên hệ từ vựng giữa βασανισθήσονται và βασανισμός; “chích một người” là cách diễn đạt tự nhiên, chính xác theo ngữ cảnh của παίω với bò cạp và ἄνθρωπον mang nghĩa chung.
  reviewer_model: gpt-5.6-terra
