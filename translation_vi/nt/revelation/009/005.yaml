review_pass:
  verdict: revise
  source_fidelity: Bản dịch diễn đạt đúng bối cảnh chung, nhưng “nhưng hành hạ họ” chuyển rõ mệnh đề bị động βασανισθήσονται (“họ phải chịu đau đớn/bị hành hạ”) sang chủ động. Dù tác nhân được hàm ý từ mạch văn, bản dịch nên giữ việc những người ấy là người chịu đau đớn. “Được ban cho quyền” cũng thêm rõ danh từ “quyền” vào chỗ nguyên văn chỉ dùng bị động vô nhân xưng “được ban cho”; đây là cách diễn đạt có thể chấp nhận nếu cấu trúc câu giữ được sự dè dặt về tác nhân ban quyền.
  naturalness: “Bò cạp” và “chích một người” là tiếng Việt hiện đại, tự nhiên. Tuy nhiên, cụm “nỗi đau đớn chúng gây ra” và “nỗi đau do bò cạp gây ra” lặp cấu trúc giải thích và làm câu nặng hơn cần thiết. Có thể giữ sự lặp từ βασανισμός bằng “nỗi đau đớn do ... gây ra” ở cả hai vế, đồng thời làm rõ chủ thể chịu đau ở mệnh đề trước.
  terminology: “Đau đớn” truyền đạt phù hợp nhóm từ βασανίζω/βασανισμός trong hình ảnh bò cạp mà không thu hẹp thành tra tấn tư pháp. “Một người” phản ánh đúng nghĩa khái quát của ἄνθρωπον, không hàm ý giới tính. Không cần chú thích để giải thích các lựa chọn này trong tiếng Việt.
  issues:
  - severity: medium
    issue: Mệnh đề bị động βασανισθήσονται được chuyển thành chủ động “hành hạ họ”.
    rationale: Nguyên văn nói những người bị nhắm đến “phải chịu đau đớn,” không trực tiếp phát biểu các tác nhân là chủ ngữ của động từ. Mạch văn cho phép hiểu họ gây đau đớn, nhưng bản dịch nên bảo toàn cấu trúc và trọng tâm bị động của câu.
  - severity: low
    issue: “Nỗi đau đớn chúng gây ra” giải thích sở hữu cách αὐτῶν quá trực tiếp.
    rationale: Cách hiểu này hợp lý theo ngữ cảnh, nhưng một diễn đạt nhấn vào nỗi đau mà những người ấy chịu vừa phản ánh mệnh đề bị động trước đó, vừa tránh làm quan hệ sở hữu cách trở nên quá diễn giải.
  revised_text: Chúng được ban cho quyền, không phải để giết những người ấy, nhưng để những người ấy phải chịu đau đớn trong năm tháng; nỗi đau đớn do chúng gây ra giống như nỗi đau đớn do bò cạp gây ra khi nó chích một người.
