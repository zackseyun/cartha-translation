source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: vi
  text: Chúng có những giáp che ngực giống như giáp bằng sắt, và tiếng cánh chúng như tiếng của nhiều xe ngựa[a] lao vào trận.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa hơn: “như tiếng chiến xa của nhiều ngựa đang chạy vào trận.”'
    reason: Cụm ἁρμάτων ἵππων πολλῶν có cấu trúc sở hữu cách cô đọng; τρεχόντων là phân từ giống đực, số nhiều, phù hợp trực tiếp với ἵππων (“ngựa”). Chú thích bảo lưu cách diễn đạt gần nguyên văn mà không làm câu chính trở nên gượng.
lexical_decisions:
- source_word: θώρακας
  choice: giáp che ngực
  rationale: Chỉ loại giáp bảo vệ phần ngực hoặc thân trên; cách diễn đạt này chính xác và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὡς θώρακας σιδηροῦς
  choice: giống như giáp bằng sắt
  rationale: Giữ rõ phép so sánh do ὡς đánh dấu và diễn đạt chất liệu sắt một cách tự nhiên.
- source_word: φωνὴ
  choice: tiếng
  rationale: Trong ngữ cảnh âm thanh của cánh và chiến xa, φωνή mang nghĩa âm thanh chứ không phải tiếng nói.
- source_word: πτερύγων
  choice: cánh
  rationale: Tương đương trực tiếp của πτέρυξ; sở hữu từ αὐτῶν được thể hiện bằng 'của chúng'.
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: nhiều chiến xa cùng ngựa
  rationale: Giữ hiện diện rõ cả chiến xa lẫn ngựa, đồng thời tránh xác quyết quá mức quan hệ cú pháp vốn có thể được hiểu là chiến xa có ngựa hoặc chiến xa của nhiều ngựa.
- source_word: τρεχόντων
  choice: lao
  rationale: Diễn tả chuyển động nhanh, mạnh của hình ảnh chiến xa và ngựa trong ngữ cảnh tiến vào chiến trận mà không thêm ý nghĩa giải thích.
- source_word: εἰς πόλεμον
  choice: vào trận
  rationale: Cách nói tự nhiên, súc tích cho chuyển động hướng vào chiến trận.
theological_decisions:
- issue: Bản chất của hình ảnh trong khải tượng
  choice: Trình bày nguyên trạng các phép so sánh trong khải tượng, không đồng nhất các sinh vật với máy móc, quỷ hay một đạo quân cụ thể.
  alternative: Giải thích hình ảnh theo nghĩa quân sự literal hoặc gán cho một đối tượng biểu tượng xác định.
  rationale: Câu Hy Lạp dùng ὡς để tạo các phép so sánh; bản dịch cần bảo toàn hình ảnh khải huyền và sự mở ngỏ trong cách hiểu.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “chúng” phù hợp với chủ thể số nhiều trong ngữ cảnh; “chiến xa” gợi đúng phương tiện chiến trận cổ đại. Dấu chú thích [a] được đặt sau mệnh đề mà chú thích giải thích.
