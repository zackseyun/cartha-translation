id: REV.9.15
reference: Revelation 9:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: vi
  text: Bốn thiên sứ đã được chuẩn bị sẵn cho giờ, ngày, tháng và năm ấy[a] được thả ra để giết một phần ba nhân loại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho giờ, ngày, tháng và năm này.” Cụm từ Hy Lạp có thể nhấn mạnh một thời điểm đã được ấn định chính xác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: được thả ra
  rationale: Động từ aorist bị động của λύω; trong ngữ cảnh các thiên sứ trước đó bị trói, cách dịch này tự nhiên và giữ rõ thể bị động.
- source_word: οἱ τέσσαρες ἄγγελοι
  choice: bốn thiên sứ
  rationale: Trong bối cảnh khải huyền, ἄγγελοι chỉ các hữu thể siêu nhiên, không phải sứ giả loài người.
- source_word: οἱ ἡτοιμασμένοι
  choice: đã được chuẩn bị sẵn
  rationale: Phân từ hoàn thành bị động diễn tả việc chuẩn bị đã xảy ra trước đó và tình trạng sẵn sàng vẫn còn hiệu lực.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: cho đúng giờ, ngày, tháng và năm ấy
  rationale: Giữ chuỗi mốc thời gian tích lũy và diễn đạt tự nhiên ý về một thời điểm được ấn định chính xác, nhưng không biến câu thành một sơ đồ tính niên đại.
- source_word: ἵνα ἀποκτείνωσιν
  choice: để giết
  rationale: ἵνα cùng động từ giả định nêu mục đích; cách dịch ngắn gọn này tự nhiên trong tiếng Việt và giữ nguyên lực mục đích.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: một phần ba nhân loại
  rationale: Đây là cấu trúc phân lượng; ἀνθρώπων chỉ con người nói chung chứ không riêng nam giới.
theological_decisions:
- issue: Ý nghĩa của cụm “giờ, ngày, tháng và năm”
  choice: Diễn đạt một thời điểm cụ thể, được ấn định chính xác.
  alternative: Có thể được hiểu là một khoảng thời gian cộng dồn gồm một năm, một tháng, một ngày và một giờ.
  rationale: Một mạo từ chi phối cả chuỗi mốc thời gian, nên cách hiểu tự nhiên hơn là nhấn mạnh thời điểm chính xác. Bản dịch và chú thích vẫn để ngỏ mức độ hàm ý về niên đại khải huyền.
- issue: Phạm vi của ἀνθρώπων
  choice: nhân loại
  alternative: người ta; loài người
  rationale: Danh từ này bao quát con người nói chung, không chỉ nam giới; “nhân loại” giữ được sắc thái tập thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” theo cách gọi Kinh Thánh quen thuộc; “được thả ra” tránh sắc thái cổ của “được tháo ra”. Đại từ chỉ định “ấy” làm rõ cả chuỗi thời gian thuộc về một thời điểm xác định.
