  rationale: Bản sửa cải thiện ngữ pháp và nhịp câu tiếng Việt, đồng thời không ấn định sở chỉ của đại từ Hy Lạp tại điểm văn bản có thể hiểu hơn một cách. Ghi chú được neo ngay sau mệnh đề liên quan để nêu lựa chọn dịch sát và giới hạn của cách hiểu.
