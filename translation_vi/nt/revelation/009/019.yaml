review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: quyền năng ở miệng và đuôi, đuôi giống rắn và có đầu, rồi gây hại. Tuy nhiên, việc xác định rõ «ἐν αὐταῖς» là «dùng những chiếc đuôi ấy» giải quyết một điểm quy chiếu mà tiếng Hy Lạp để mở: đại từ giống cái số nhiều có thể được hiểu theo các «đuôi» hoặc các «đầu» vừa nêu. Bản sửa giữ sự không xác định này và ghi chú nó.'
