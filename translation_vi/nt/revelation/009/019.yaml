id: REV.9.19
reference: Revelation 9:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: vi
  text: Vì quyền năng của những con ngựa ở miệng và đuôi của chúng; vì đuôi của chúng giống như rắn, có đầu, và chúng dùng những thứ ấy để gây hại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «và nhờ chúng mà gây hại». Tiếng Hy Lạp nói sát chữ là «và trong chúng chúng gây hại»; «chúng» có thể được hiểu là các đuôi hoặc các đầu vừa được nhắc đến.'
    reason: Bảo lưu sự mơ hồ về sở chỉ của đại từ giống cái số nhiều ἐν αὐταῖς.
lexical_decisions:
- source_word: ἐξουσία
  choice: quyền năng
  rationale: Trong khải tượng này, từ này chỉ năng lực hữu hiệu để gây hại, hơn là thẩm quyền pháp lý được trao.
- source_word: στόματι
  choice: miệng
  rationale: Tiếng Hy Lạp dùng số ít theo lối phân phối sau chủ thể số nhiều; tiếng Việt dùng “miệng” tự nhiên với đại từ sở hữu tập hợp “chúng”.
- source_word: οὐραῖς
  choice: đuôi
  rationale: Nghĩa thông thường của οὐρά; tiếng Việt không bắt buộc đánh dấu số nhiều vì ngữ cảnh đã rõ.
- source_word: ὅμοιαι ὄφεσιν
  choice: giống như rắn
  rationale: “Rắn” là cách gọi tự nhiên, hiện đại và vẫn giữ nguyên hình ảnh bò sát của nguyên văn.
- source_word: ἔχουσαι κεφαλάς
  choice: có đầu
  rationale: Giữ nét mô tả trực tiếp và sinh động của phân từ Hy Lạp mà không thêm cách giải thích.
- source_word: ἀδικοῦσιν
  choice: gây hại
  rationale: Trong văn cảnh Khải Huyền, động từ này nói đến việc làm tổn hại, không chủ yếu nói về sự bất công theo nghĩa trừu tượng.
- source_word: ἐν αὐταῖς
  choice: dùng những chiếc đuôi ấy
  rationale: ἐν có nghĩa chỉ phương tiện ở đây; cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ sở chỉ của đại từ giống cái số nhiều là các đuôi.
- source_word: γὰρ
  choice: vì / bởi
  rationale: Cả hai lần đều mang chức năng giải thích; thay đổi nhẹ từ nối giúp câu tiếng Việt tự nhiên mà không thay đổi quan hệ lập luận.
theological_decisions:
- issue: Hình ảnh khải huyền về đuôi và đầu của những con ngựa
  choice: Diễn đạt hình ảnh đúng như lời mô tả, không giải nghĩa biểu tượng
  alternative: Đồng nhất những chiếc đuôi với giáo huấn sai lạc hoặc tác nhân ma quỷ
  rationale: Nguyên văn trình bày một cảnh tượng khải huyền nhưng không giải thích biểu tượng ngay trong câu; bản dịch không nên đưa một cách diễn giải thần học vào nội dung.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc giải thích lặp lại của hai γάρ, đồng thời tránh lối diễn đạt quá sát chữ như “ở trong chúng” vốn mơ hồ trong tiếng Việt.
