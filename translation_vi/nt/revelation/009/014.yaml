id: REV.9.14
reference: Revelation 9:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: vi
  text: 'nói với thiên sứ thứ sáu, là vị đang cầm kèn: “Hãy thả bốn thiên sứ đang bị trói[a] tại sông lớn Ơ-phơ-rát.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bị trói” hoặc “đã bị trói và vẫn còn bị giữ”; phân từ hoàn thành trong tiếng Hy Lạp nhấn mạnh tình trạng bị kiềm giữ hiện tại, là kết quả của việc trói trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: nói
  rationale: Phân từ hiện tại nối tiếp hành động của tiếng nói ở câu trước; tiếng Việt tự nhiên dùng “nói” mà vẫn giữ sự liên kết cú pháp.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: với thiên sứ thứ sáu
  rationale: Dịch trực tiếp tân ngữ gián tiếp ở cách dữ liệu, theo trật tự tự nhiên trong tiếng Việt.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: là vị đang cầm kèn
  rationale: Cụm phân từ có mạo từ xác định vị thiên sứ được truyền lệnh; “đang cầm” diễn đạt tự nhiên ý có hoặc giữ chiếc kèn trong bối cảnh.
- source_word: Λῦσον
  choice: Hãy thả
  rationale: Mệnh lệnh aorist của λύω yêu cầu tháo bỏ sự kiềm giữ; “hãy thả” rõ ràng, hiện đại và phù hợp với những đối tượng đang bị trói.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: bốn thiên sứ
  rationale: Dịch trực tiếp cụm tân ngữ có số từ, không thêm nhận định về bản chất hay địa vị đạo đức của họ.
- source_word: τοὺς δεδεμένους
  choice: đang bị trói
  rationale: Phân từ hoàn thành bị động mô tả tình trạng hiện tại do một hành động trói trước đó tạo nên; “đang bị trói” nhấn mạnh trạng thái hiện hữu, còn chú thích ghi nhận sắc thái kết quả kéo dài.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: tại sông
  rationale: ἐπί với cách dữ liệu mang nghĩa địa điểm; “tại” giữ phạm vi đủ rộng, không buộc phải hiểu là trên mặt sông hay bên bờ.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: sông lớn Ơ-phơ-rát
  rationale: Giữ danh hiệu “lớn” cùng tên riêng, theo cấu trúc tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Căn tính và địa vị đạo đức của bốn thiên sứ
  choice: Chỉ dịch là “bốn thiên sứ”, không xác định họ là thánh hay sa ngã.
  alternative: “bốn thiên sứ sa ngã” hoặc “bốn thiên sứ được chỉ định để phán xét”
  rationale: Câu này chỉ cho biết họ là các thiên sứ đang bị trói tại Ơ-phơ-rát. Thêm một tính từ diễn giải sẽ giải quyết điều mà bản văn cố ý để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” nhất quán với ngữ vực Kinh Thánh; phiên âm địa danh là “Ơ-phơ-rát”. Dấu hai chấm làm rõ rằng cụm nhận diện vị thiên sứ đứng trước lời truyền lệnh.
