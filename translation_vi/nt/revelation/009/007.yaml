id: REV.9.7
reference: Revelation 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: vi
  text: Hình dáng của những con châu chấu giống như những con ngựa đã được chuẩn bị để ra trận. Trên đầu chúng có những vật trông như vòng miện[a], tựa như vàng, và mặt chúng giống như mặt người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp στέφανοι cũng có thể chỉ “các vòng miện chiến thắng”, tức những vòng đội đầu gắn với danh dự hoặc chiến thắng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “mặt của loài người”; cách nói này chỉ con người nói chung, không riêng nam giới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοιώματα
  choice: hình dạng
  rationale: Danh từ này có thể chỉ hình thể, diện mạo hoặc sự tương tự; “hình dạng” diễn đạt rõ ấn tượng thị giác trong khải tượng mà không đồng nhất hình ảnh với thực thể theo nghĩa đen.
- source_word: ἀκρίδων
  choice: những con châu chấu
  rationale: Đây là nghĩa thông thường của ἀκρίς; văn cảnh khải huyền không đòi hỏi đổi nghĩa từ vựng căn bản.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: giống như những con ngựa đã được chuẩn bị để ra trận
  rationale: Giữ dấu hiệu so sánh của ὅμοια và trạng thái đã được chuẩn bị của phân từ hoàn thành bị động ἡτοιμασμένοις; “ra trận” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: trên đầu chúng
  rationale: Chuyển ngữ trực tiếp quan hệ không gian của ἐπί trong lời mô tả khải tượng.
- source_word: ὡς στέφανοι
  choice: những vật trông như mão miện
  rationale: Cách diễn đạt này giữ tính hiện tượng và so sánh của ὡς, tránh khẳng định rằng đó thực sự là mão miện.
- source_word: στέφανοι
  choice: mão miện
  rationale: στέφανος có thể là mão hoặc vòng miện, thường gắn với vinh dự hay chiến thắng. “Mão miện” là cách gọi khái quát, trang trọng; sắc thái vòng miện chiến thắng được ghi ở chú thích.
- source_word: ὅμοιοι χρυσῷ
  choice: tựa như vàng
  rationale: Giữ ý tương tự của ὅμοιοι với χρυσῷ, không biến thành lời khẳng định rằng các mão được làm bằng vàng.
- source_word: πρόσωπα ἀνθρώπων
  choice: mặt người
  rationale: πρόσωπα chỉ khuôn mặt nhìn thấy được, còn ἀνθρώπων mang nghĩa loài người nói chung chứ không riêng nam giới.
theological_decisions:
- issue: Ngôn ngữ so sánh trong hình ảnh khải huyền
  choice: 'Giữ các dấu hiệu so sánh lặp lại: “giống như”, “trông như”, “tựa như”'
  alternative: Diễn đạt các hình ảnh như những đặc điểm có thật theo nghĩa đen
  rationale: Bản Hy Lạp liên tiếp dùng ὅμοια và ὡς để nói về sự tương tự. Bản dịch bảo toàn tính khải tượng và không quyết định bản thể của những hình ảnh được thấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu được tách làm hai để mô tả rõ ràng hơn mà vẫn giữ trình tự và nhịp liệt kê của nguyên văn.
