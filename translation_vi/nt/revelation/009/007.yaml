  to: Hình dáng của những con châu chấu giống như những con ngựa đã được chuẩn bị để ra trận. Trên đầu chúng có những vật trông như vòng miện[a], tựa như vàng, và mặt chúng giống như mặt người[b].
  rationale: Chỉ điều chỉnh cách gọi στέφανοι và ngắt câu để tiếng Việt hiện đại tự nhiên hơn và để hai phép so sánh trong nguyên văn được nhận ra rõ ràng. Các chi tiết hình ảnh, tính khải tượng, và nghĩa tổng quát của “người” đều được giữ nguyên.
