    issue: “Mão miện” ít tự nhiên trong tiếng Việt tiêu chuẩn hiện đại.
    rationale: “Vòng miện” là cách gọi thông dụng hơn cho vật đội đầu dạng crown/wreath, đồng thời không áp đặt nghĩa vương quyền.
  - severity: low
    issue: Cụm “mão miện tựa như vàng” có thể đọc hơi vướng vì hai lớp so sánh không được tách rõ.
    rationale: Nguyên văn phân biệt vật “như các vòng miện” với các vòng miện ấy “giống vàng.” Dấu phẩy làm rõ hai tầng này mà không đổi nghĩa.
