id: REV.9.6
reference: Revelation 9:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: vi
  text: Trong những ngày ấy, người ta sẽ tìm kiếm cái chết nhưng nhất định sẽ không tìm thấy nó[a]; họ sẽ khao khát được chết, nhưng cái chết chạy trốn khỏi họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng cấu trúc phủ định nhấn mạnh, có nghĩa: “nhất định sẽ không tìm thấy nó.”'
    reason: Làm rõ sức nhấn mạnh của οὐ μή mà vẫn giữ câu chính tự nhiên.
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Trong những ngày ấy
  rationale: Cách diễn đạt thời gian tự nhiên, trang trọng, giữ được sắc thái chỉ định của ἐκείναις.
- source_word: ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον
  choice: người ta sẽ tìm cái chết
  rationale: “Người ta” diễn đạt tự nhiên nghĩa khái quát của οἱ ἄνθρωποι trong tiếng Việt; “tìm cái chết” giữ nguyên tính chủ ý và hình ảnh của nguyên văn.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: mà chắc chắn không tìm được
  rationale: “Chắc chắn không” chuyển tải sức nhấn mạnh của cấu trúc phủ định οὐ μή với động từ tương lai; tiếng Việt có thể lược đại từ chỉ “cái chết” để câu tự nhiên mà quy chiếu vẫn rõ.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: họ sẽ khao khát được chết
  rationale: “Khao khát” thể hiện cường độ mạnh của ἐπιθυμέω; “được chết” tự nhiên trong ngữ cảnh họ mong muốn nhưng không thể đạt tới cái chết.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: cái chết cứ trốn khỏi họ
  rationale: Giữ cái chết làm chủ thể được nhân cách hóa. “Cứ trốn” diễn đạt thể hiện tại giàu hình ảnh φεύγει và sự lẩn tránh liên tục, không làm phẳng thành “họ không thể chết”.
theological_decisions:
- issue: Sự nhân cách hóa cái chết trong cảnh phán xét khải huyền
  choice: Giữ trực tiếp hình ảnh “cái chết cứ trốn khỏi họ”.
  alternative: Diễn giải thành “họ không thể chết”.
  rationale: Nguyên văn đặt ὁ θάνατος làm chủ thể của φεύγει. Giữ hình ảnh này tôn trọng văn phong khải huyền và không giải quyết thay cho độc giả sự căng thẳng của câu.
- issue: Phạm vi chỉ người của οἱ ἄνθρωποι
  choice: Dịch là “người ta”, mang nghĩa khái quát về con người.
  alternative: Dịch là “những người đàn ông” hoặc “nhân loại”.
  rationale: Trong ngữ cảnh này ἄνθρωποι chỉ con người nói chung, không có bằng chứng giới hạn ở nam giới. “Người ta” vừa chính xác vừa tự nhiên trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ta” theo nghĩa khái quát; giữ phép nhân cách hóa “cái chết” và nhịp tương phản của câu. Mọi dấu chú thích trong bản văn đều có mục chú thích tương ứng.
