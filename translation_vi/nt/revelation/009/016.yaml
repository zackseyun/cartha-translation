  source_fidelity: 'Bản dịch chính giữ đúng cấu trúc và ý nghĩa của câu Hy Lạp: số lượng các lực lượng kỵ binh là 200.000.000, và người nói đã nghe con số của họ. Tuy nhiên, chú thích hiện nói “hai vạn lần vạn”, vốn tương ứng với 100.000.000 chứ không phải 200.000.000. δισμυριάδες μυριάδων diễn đạt hai vạn của các vạn, tức 200.000.000.'
