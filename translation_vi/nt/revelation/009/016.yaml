  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: vi
  text: Quân số của các đạo kỵ binh là hai trăm triệu[a]; tôi đã nghe quân số của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp, sát chữ: “hai vạn của các vạn”, tức hai trăm triệu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀριθμὸς
  choice: quân số
  rationale: Trong ngữ cảnh quân sự, “quân số” diễn đạt tự nhiên ý nghĩa “số lượng” và được lặp lại để phản ánh sự lặp từ trong tiếng Hy Lạp.
- source_word: στρατευμάτων
  choice: các đạo
  rationale: Danh từ số nhiều chỉ các đơn vị hoặc lực lượng quân sự; “các đạo” giữ sắc thái tập thể và kết hợp tự nhiên với “kỵ binh”.
- source_word: ἱππικοῦ
  choice: kỵ binh
  rationale: Dạng danh từ hóa chỉ lực lượng chiến đấu trên lưng ngựa; “kỵ binh” là thuật ngữ quân sự chính xác, gọn và thông dụng.
- source_word: δισμυριάδες μυριάδων
  choice: hai trăm triệu
  rationale: Cụm từ có thể tính thành 200.000.000; cách dịch bằng con số tương đương giúp độc giả hiện đại hiểu ngay, còn cấu trúc Hy Lạp sát chữ được ghi ở chú thích.
- source_word: ἤκουσα
  choice: tôi đã nghe
  rationale: Động từ aorist kể lại một sự việc đã xảy ra; “đã nghe” tự nhiên trong tiếng Việt và nhấn mạnh người kể trực tiếp tiếp nhận con số.
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu quy chiếu về những người thuộc lực lượng kỵ binh; “của họ” tự nhiên hơn cách dịch sát chữ “của chúng” khi nói về quân lính.
