revisions:
- from: Chúng có những cái đuôi giống như đuôi bọ cạp, có cả ngòi chích; và quyền năng làm hại loài người trong năm tháng nằm ở đuôi chúng.
  to: Chúng có đuôi như bọ cạp và có ngòi chích; trong đuôi chúng có quyền làm hại loài người trong năm tháng.
  rationale: Bản sửa giữ hình ảnh và sự mơ hồ có chủ ý của nguyên văn về phép so sánh với bọ cạp, đồng thời đặt “trong năm tháng” cạnh “làm hại” để phản ánh đúng phạm vi cú pháp. Câu cũng được làm gọn theo lối diễn đạt hiện đại, trang trọng của tiếng Việt.
  reviewer_model: gpt-5.6-terra
