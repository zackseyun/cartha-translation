id: REV.9.10
reference: Revelation 9:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: vi
  text: Chúng có đuôi như bọ cạp và có ngòi chích; trong đuôi chúng có quyền làm hại loài người trong năm tháng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς ὁμοίας σκορπίοις
  choice: những cái đuôi giống như đuôi bọ cạp
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời làm rõ rằng chính các đuôi được đem so sánh với đuôi bọ cạp; không thay đổi hình ảnh của nguyên văn.
- source_word: κέντρα
  choice: ngòi chích
  rationale: Trong hình ảnh bọ cạp, từ này chỉ bộ phận nhọn dùng để chích; “ngòi chích” cụ thể và dễ hiểu hơn “mũi nhọn” hay “vết chích”.
- source_word: ἐξουσία
  choice: quyền năng
  rationale: Ở đây từ này nói đến khả năng hữu hiệu để gây hại, nhưng vẫn có sắc thái quyền được ban hoặc cho phép; “quyền năng” giữ được cả hai nét nghĩa tốt hơn chỉ nói “sức mạnh”.
- source_word: ἀδικῆσαι
  choice: làm hại
  rationale: Trong ngữ cảnh tai họa khải huyền, động từ chỉ việc gây tổn hại, không chủ yếu nói về hành vi bất công theo nghĩa pháp lý hay đạo đức.
- source_word: τοὺς ἀνθρώπους
  choice: loài người
  rationale: Danh từ số nhiều ở đây chỉ con người nói chung, không riêng nam giới; “loài người” giữ phạm vi khái quát và hợp với văn phong trang trọng.
- source_word: μῆνας πέντε
  choice: trong năm tháng
  rationale: Đối cách chỉ khoảng thời gian được diễn đạt tự nhiên bằng “trong năm tháng”.
theological_decisions:
- issue: Sắc thái của ἐξουσία trong hình ảnh tai họa
  choice: quyền năng
  alternative: thẩm quyền; sức mạnh
  rationale: “Quyền năng” diễn tả năng lực thực sự để gây hại mà không loại bỏ khả năng quyền ấy chỉ tồn tại trong giới hạn được cho phép trong khải tượng.
- issue: Phạm vi của τοὺς ἀνθρώπους
  choice: loài người
  alternative: người ta; con người; đàn ông
  rationale: Ngữ pháp giống đực số nhiều trong tiếng Hy Lạp có chức năng chỉ nhân loại nói chung tại đây; bản dịch không thu hẹp đối tượng thành nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc hai vế của câu Hy Lạp nhưng điều chỉnh trật tự từ cho tự nhiên trong tiếng Việt. Không thêm chú thích vì các lựa chọn từ vựng có thể được chuyển tải rõ trong chính văn.
