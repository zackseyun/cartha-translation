id: REV.9.3
reference: Revelation 9:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: vi
  text: Rồi từ trong khói, châu chấu ra trên mặt đất, và chúng được ban cho quyền[a] như quyền của bọ cạp trên đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thẩm quyền” hoặc “quyền hạn”. Từ Hy Lạp có thể chỉ quyền hạn, quyền được phép, hoặc sức mạnh; “quyền” được chọn vì thể bị động cho thấy quyền ấy được ban cho chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: từ trong khói
  rationale: Diễn đạt chuyển động từ bên trong ra ngoài, giữ hình ảnh sống động của ἐκ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐξῆλθον ... εἰς τὴν γῆν
  choice: ra đến mặt đất
  rationale: Kết hợp động từ chuyển động với hướng đích của εἰς, tránh thêm cách thức như “bay” vốn không được nói rõ trong nguyên văn.
- source_word: ἀκρίδες
  choice: những con châu chấu
  rationale: “Châu chấu” là nghĩa thông thường và phù hợp với văn cảnh khải huyền; từ chỉ loại được thêm để câu tiếng Việt rõ ràng, tự nhiên.
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: chúng được ban cho quyền
  rationale: Giữ thể bị động và không xác định rõ người ban. “Quyền” vừa tự nhiên hơn “thẩm quyền” khi nói về bọ cạp, vừa có thể chỉ quyền hạn hoặc khả năng được trao.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: giống như quyền của ...
  rationale: Giữ phép so sánh và sự lặp lại của ἐξουσία, đồng thời tạo cấu trúc tiếng Việt tự nhiên.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: loài bọ cạp trên đất
  rationale: Trong tiếng Việt, “trên đất” diễn đạt tự nhiên quan hệ của cụm từ này và phân biệt bọ cạp thuộc thế giới trên mặt đất với những sinh vật đi ra từ khói.
theological_decisions:
- issue: Bản chất quyền được ban cho châu chấu
  choice: Dịch ἐξουσία là “quyền” và giữ thể bị động “được ban cho” mà không nêu danh tính người ban.
  alternative: Dịch là “sức mạnh” hoặc nói rõ Đức Chúa Trời là Đấng ban.
  rationale: “Quyền” giữ được sắc thái quyền hạn hay khả năng được trao, còn thể bị động bảo toàn sự dè dặt của nguyên văn và không xác định điều bản văn không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “ra đến mặt đất” bảo toàn chuyển động và hướng đích mà không thêm ý châu chấu “bay”; “quyền” tránh sắc thái hành chính quá mạnh của “thẩm quyền” trong phép so sánh với bọ cạp.
