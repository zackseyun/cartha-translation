id: REV.9.12
reference: Revelation 9:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: vi
  text: Tai họa thứ nhất đã qua[a]. Kìa, còn hai tai họa nữa sẽ đến sau những điều ấy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp có thể dịch sát là: “tai họa một”; trong văn cảnh, cụm này có nghĩa là tai họa thứ nhất trong một chuỗi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Kìa, còn hai tai họa nữa đang đến sau những điều này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: tai họa
  rationale: Trong ngữ cảnh khải huyền, từ này chỉ lời công bố long trọng về tai ương và sự phán xét sắp xảy đến. “Tai họa” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ được sức nặng của công thức lặp lại trong phân đoạn.
- source_word: ἡ μία
  choice: thứ nhất
  rationale: Nghĩa sát chữ là “một” hoặc “cái duy nhất”, nhưng trong ngữ cảnh ba tai họa được công bố theo thứ tự, cụm này mang chức năng số thứ tự. “Thứ nhất” làm rõ chuỗi sự kiện mà không thêm cách giải thích ngoài văn cảnh.
- source_word: ἀπῆλθεν
  choice: đã qua
  rationale: Động từ aorist trình bày tai họa thứ nhất như một sự việc đã kết thúc. “Đã qua” là cách nói tự nhiên đối với một thời kỳ hay biến cố chấm dứt, phù hợp hơn nghĩa không gian “đã đi khỏi”.
- source_word: ἰδού
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý khẩn thiết của từ chỉ thị, đồng thời phù hợp với văn phong tiên tri–khải huyền trang trọng.
- source_word: ἔτι δύο οὐαὶ
  choice: còn hai tai họa nữa
  rationale: Cấu trúc “còn ... nữa” diễn đạt tự nhiên ý của ἔτι rằng sau tai họa thứ nhất vẫn còn hai tai họa khác.
- source_word: ἔρχεται
  choice: sẽ đến
  rationale: Dù nguyên văn dùng động từ số ít với chủ ngữ số nhiều, tiếng Việt không cần đánh dấu số ở động từ. “Sẽ đến” truyền đạt rõ hai tai họa vẫn ở phía trước; sắc thái gần kề được nâng đỡ bởi “Kìa” và “còn ... nữa”.
- source_word: μετὰ ταῦτα
  choice: sau những điều ấy
  rationale: Giữ số nhiều của đại từ ταῦτα và lối diễn đạt tuần tự thường gặp trong sách Khải Huyền.
theological_decisions:
- issue: Trình tự ba tai họa trong khải tượng
  choice: Câu này đánh dấu tai họa thứ nhất đã kết thúc và hai tai họa khác vẫn còn phải đến.
  alternative: Diễn đạt οὐαί nói chung thành “sự phán xét” hoặc “thảm họa”, không giữ công thức lặp lại và trình tự được đánh số.
  rationale: Nguyên văn nhấn mạnh chuỗi ba tai họa trong khải tượng. Giữ “tai họa” và dịch ἡ μία là “thứ nhất” bảo toàn cấu trúc văn chương và sức căng thần học về các sự phán xét tiếp nối, mà không xác định thêm bản chất hay thời điểm của chúng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Kìa” giữ sắc thái tiên tri–khải huyền; “tai họa” được lặp lại để bảo toàn công thức và trình tự của nguyên văn. Cấu trúc câu ưu tiên sự tự nhiên nhưng vẫn giữ “sau những điều ấy” theo số nhiều của tiếng Hy Lạp.
