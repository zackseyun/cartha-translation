id: REV.9.2
reference: Revelation 9:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: vi
  text: Ngôi sao ấy mở giếng của vực thẳm[a]. Khói bốc lên từ giếng, như khói từ một lò lớn; mặt trời và không khí bị khói từ giếng làm cho tối sầm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hố của vực thẳm”; theo cách dịch truyền thống: “vực không đáy.”'
    reason: Nêu phương án dịch φρέαρ và cách gọi truyền thống của ἄβυσσος, trong khi chính văn vẫn phân biệt giếng/lối mở với vực thẳm.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: mở
  rationale: Diễn đạt trực tiếp động từ ἀνοίγω, không thêm ý 'mở khóa' vốn không có trong nguyên văn.
- source_word: τὸ φρέαρ τῆς ἀβύσσου
  choice: giếng sâu dẫn xuống vực thẳm
  rationale: φρέαρ có thể chỉ giếng hoặc hố sâu; cách diễn đạt này giữ hình ảnh một lối mở thẳng đứng thông xuống ἄβυσσος, đồng thời không đồng nhất giếng với chính vực thẳm.
- source_word: ἀβύσσου
  choice: vực thẳm
  rationale: Phản ánh ý nghĩa của ἄβυσσος trong văn cảnh khải huyền mà không thêm cách hiểu truyền thống 'không đáy' vào chính văn.
- source_word: ἀνέβη καπνὸς
  choice: khói ... bốc lên
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ rõ chuyển động đi lên của ἀναβαίνω.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: như khói của một lò lửa lớn
  rationale: Giữ phép so sánh ὡς, hình ảnh κάμινος và sắc thái kích thước/cường độ của μεγάλης.
- source_word: ἐσκοτώθη
  choice: trở nên tối tăm
  rationale: Truyền đạt kết quả bị khói làm cho tối; nguyên nhân được nêu rõ bằng cụm 'vì khói từ giếng'.
- source_word: ὁ ἥλιος καὶ ὁ ἀὴρ
  choice: mặt trời và không khí
  rationale: Dịch trực tiếp hai danh từ, đặc biệt giữ ἀήρ là 'không khí' thay vì chuyển thành 'bầu trời'.
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: vì khói từ giếng
  rationale: Diễn đạt tự nhiên cả quan hệ nguyên nhân và nguồn phát xuất của khói.
theological_decisions:
- issue: Cách gọi địa điểm khải huyền mà không đưa cách giải thích truyền thống vào chính văn
  choice: Dùng 'giếng sâu dẫn xuống vực thẳm' cho τὸ φρέαρ τῆς ἀβύσσου.
  alternative: '''hố của vực thẳm''; theo cách dịch truyền thống, ''vực không đáy''.'
  rationale: Giữ sự phân biệt giữa φρέαρ, tức lối mở hoặc giếng sâu, với ἄβυσσος, tức vực thẳm; đồng thời tránh khẳng định thêm rằng vực ấy 'không đáy'.
- issue: Chủ thể của động từ ἤνοιξεν
  choice: Dùng 'Ngôi sao ấy' để nối rõ với chủ thể đã được nêu trong câu 1.
  alternative: Dùng đại từ 'người' hoặc 'nó'.
  rationale: Bản thân câu 2 chỉ có chủ ngữ hàm ẩn trong động từ ngôi thứ ba số ít; văn cảnh gần nhất xác định đó là ngôi sao đã được ban chìa khóa. Tiếng Việt cần nêu chủ thể để câu tự nhiên và tránh đại từ nhân xưng giải thích ngôi sao là một nhân vật theo cách quá dứt khoát.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng 'giếng sâu dẫn xuống' để hình ảnh không bị hiểu như một giếng nước thông thường; giữ nhịp câu giàu hình ảnh phù hợp thể văn khải huyền.
