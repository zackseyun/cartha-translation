id: REV.9.21
reference: Revelation 9:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: vi
  text: Họ cũng không ăn năn từ bỏ những vụ giết người của mình, những tà thuật[a] của mình, sự vô luân về tình dục của mình, hay những vụ trộm cắp của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được dịch là “những việc phù phép”; từ này còn có thể liên quan đến dược chất, thuốc độc hoặc việc đầu độc.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: ăn năn từ bỏ
  rationale: Cụm này diễn đạt không chỉ sự đổi ý bên trong mà còn sự ăn năn quay khỏi các hành vi được liệt kê; cách nói “ăn năn từ bỏ” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: φόνων
  choice: những hành vi giết người
  rationale: φόνος chỉ sự giết người hoặc các vụ giết người mang tính tội ác; “những hành vi giết người” giữ được sắc thái đạo đức mà không thu hẹp vào một thuật ngữ pháp lý cụ thể.
- source_word: φαρμάκων
  choice: những việc tà thuật
  rationale: Trong bối cảnh sách Khải Huyền, từ này nhiều khả năng chỉ các thực hành ma thuật hay phù phép. “Tà thuật” ngắn gọn, dễ hiểu và tránh liên hệ sai với dược phẩm hiện đại; phạm vi nghĩa rộng hơn được ghi ở chú thích.
- source_word: πορνείας
  choice: sự gian dâm
  rationale: πορνεία là thuật ngữ rộng chỉ hành vi tình dục trái luân lý. “Sự gian dâm” là cách diễn đạt trang trọng, quen thuộc trong văn cảnh Kinh Thánh tiếng Việt, dù không nhằm giới hạn từ này chỉ vào ngoại tình.
- source_word: κλεμμάτων
  choice: những việc trộm cắp
  rationale: Cách dịch này bao quát các hành vi hoặc vụ trộm cắp và phù hợp với danh từ số nhiều trong danh sách các điều xấu.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: dấu phẩy ... hay
  rationale: Tiếng Việt hiện đại thường liệt kê các thành phần phủ định dưới phạm vi của “không” rồi dùng “hay” trước thành phần cuối; cách này tự nhiên mà vẫn giữ quan hệ phủ định đối với toàn bộ danh sách.
theological_decisions:
- issue: Phạm vi nghĩa của φαρμάκων trong danh sách các điều xấu
  choice: những việc tà thuật
  alternative: những việc phù phép; việc dùng thuốc độc hoặc đầu độc
  rationale: Các từ cùng gốc trong sách Khải Huyền thường liên quan đến ma thuật và sự mê hoặc, nên “tà thuật” phù hợp nhất với văn cảnh. Tuy nhiên, từ Hy Lạp cũng có thể gắn với dược chất, thuốc độc hoặc việc đầu độc; chú thích bảo lưu độ rộng từ vựng này.
- issue: Phạm vi nghĩa của πορνείας
  choice: sự gian dâm
  alternative: sự vô luân về tình dục
  rationale: “Sự gian dâm” là cách nói cô đọng và trang trọng trong tiếng Việt, nhưng được hiểu theo nghĩa rộng của πορνεία chứ không chủ ý giải quyết các ranh giới đạo đức cụ thể mà từ này có thể bao hàm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “họ” phù hợp với mạch văn; “của mình” được đặt sau nhóm đầu và cuối để diễn đạt quyền sở hữu lặp lại trong tiếng Hy Lạp mà không khiến câu tiếng Việt quá nặng. Dấu chú thích [a] được đặt đúng sau “tà thuật”, là từ mà chú thích giải thích.
