revisions:
- from: Chúng có một vua cai trị chúng, là thiên sứ của vực sâu.[a] Tên của nó trong tiếng Hê-bơ-rơ là A-ba-đôn,[b] còn trong tiếng Hy Lạp, nó mang tên A-pô-ly-ôn.[c]
  to: Chúng có một vua cai trị chúng, là thiên sứ của vực sâu.[a] Tên của thiên sứ ấy trong tiếng Hê-bơ-rơ là A-ba-đôn,[b] còn trong tiếng Hy Lạp, thiên sứ ấy mang tên A-pô-ly-ôn.[c]
  rationale: Chỉ thay đại từ “nó” bằng “thiên sứ ấy” ở cả hai lần để đạt cách quy chiếu tự nhiên và trung tính hơn trong tiếng Việt hiện đại. Không thay đổi ý nghĩa, quan hệ cú pháp, thuật ngữ chủ đạo, tên riêng, hoặc hệ thống neo chú thích.
