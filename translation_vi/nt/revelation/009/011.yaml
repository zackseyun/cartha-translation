id: REV.9.11
reference: Revelation 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: vi
  text: Chúng có một vua cai trị chúng, là thiên sứ của vực sâu.[a] Tên của thiên sứ ấy trong tiếng Hê-bơ-rơ là A-ba-đôn,[b] còn trong tiếng Hy Lạp, thiên sứ ấy mang tên A-pô-ly-ôn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vực sâu” cũng có thể dịch là “vực không đáy”.
    reason: alternative_reading
  - marker: b
    text: A-ba-đôn là tên Hê-bơ-rơ liên hệ với sự hủy diệt.
    reason: lexical_alternative
  - marker: c
    text: A-pô-ly-ôn là tên Hy Lạp có nghĩa là “Kẻ Hủy Diệt”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: Chúng có một vua cai trị chúng
  rationale: Giữ động từ “có” và ý nghĩa ἐπί là ở trên/cai trị, đồng thời diễn đạt tự nhiên bằng tiếng Việt; “chúng” chỉ các sinh vật giống châu chấu trong văn cảnh trước.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: là thiên sứ của vực sâu
  rationale: ἄγγελος trong sách Khải Huyền được hiểu tự nhiên là “thiên sứ”; “vực sâu” chuyển tải trực tiếp ἄβυσσος mà không thêm ý “không đáy” vốn không được nói rõ trong từ Hy Lạp.
- source_word: Ἑβραϊστὶ
  choice: trong tiếng Hê-bơ-rơ
  rationale: Cách diễn đạt hiện đại, rõ nghĩa cho trạng từ chỉ ngôn ngữ “bằng tiếng Hê-bơ-rơ”.
- source_word: Ἀβαδδών
  choice: A-ba-đôn
  rationale: Phiên âm tên riêng sang dạng dễ đọc trong tiếng Việt; ý nghĩa liên hệ với sự hủy diệt được bảo tồn trong chú thích.
- source_word: καὶ ἐν τῇ Ἑλληνικῇ
  choice: còn trong tiếng Hy Lạp
  rationale: “Còn” thể hiện tự nhiên sự đối chiếu giữa tên gọi trong hai ngôn ngữ.
- source_word: ὄνομα ἔχει
  choice: nó mang tên
  rationale: Giữ phần nào cấu trúc lặp lại “có tên” của nguyên văn nhưng dùng lối nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: Ἀπολλύων
  choice: A-pô-ly-ôn
  rationale: Phiên âm như tên riêng; nghĩa “Kẻ Hủy Diệt” được nêu trong chú thích vì sắc thái này rõ ràng trong tiếng Hy Lạp.
theological_decisions:
- issue: Dịch nghĩa hay phiên âm Ἀβαδδών và Ἀπολλύων
  choice: 'Phiên âm cả hai tên trong chính văn: “A-ba-đôn” và “A-pô-ly-ôn”.'
  alternative: Dịch một hoặc cả hai là “Sự Hủy Diệt” hoặc “Kẻ Hủy Diệt”.
  rationale: Trong câu, cả hai từ hoạt động như tên riêng của thiên sứ. Phiên âm bảo tồn chức năng ấy, còn nội hàm từ nguyên được cung cấp trong chú thích.
- issue: Cách dịch ἀβύσσου
  choice: vực sâu
  alternative: vực không đáy
  rationale: “Vực sâu” gần với nghĩa trực tiếp của ἄβυσσος và tránh đưa tính chất “không đáy” vào chính văn khi nguyên ngữ không diễn đạt minh nhiên.
- issue: Đại từ chỉ thiên sứ
  choice: nó
  alternative: ông ấy / người
  rationale: Nguyên văn chỉ dùng đại từ giống đực theo ngữ pháp và không quyết định cách xưng hô mang tính nhân vị trong tiếng Việt. “Nó” nối tự nhiên với “thiên sứ” như một hữu thể trong cảnh tượng, không thêm sắc thái tôn kính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vua cai trị chúng” để bảo tồn cả hình ảnh vua và quan hệ ở trên chúng. Các tên riêng được phiên âm theo âm tiết để độc giả Việt dễ đọc; mọi dấu chú thích [a]–[c] đều xuất hiện trong chính văn.
