  rationale: Sửa cách diễn đạt về nhóm người sống sót để phản ánh λοιποί, thay thuật ngữ dễ gây hiểu lầm “thần tượng” bằng “hình tượng”, và bỏ yếu tố “còn” không được đánh dấu trực tiếp trong mệnh đề ἵνα μή. Các điểm còn lại giữ nguyên nghĩa, chuỗi vật liệu, và tính mơ hồ mục đích/kết quả của nguyên văn.
