    rationale: λοιποί có nghĩa chính là phần còn lại/remainder, không chỉ là những người khác. “Những người còn lại” vừa chính xác vừa tự nhiên hơn.
  - severity: medium
    issue: “những thần tượng”
    rationale: Trong tiếng Việt đương đại, “thần tượng” thường nghĩa là nhân vật được ngưỡng mộ. εἴδωλα ở đây là các hình tượng thờ cúng; “hình tượng” tránh hiểu nhầm.
  - severity: low
    issue: “để không còn thờ lạy”
    rationale: “Không còn” diễn giải thêm ý chấm dứt đang diễn ra. “Để không thờ lạy” sát hơn với ἵνα μή προσκυνήσουσιν, trong khi chú thích vẫn nêu sắc thái mục đích/kết quả.
