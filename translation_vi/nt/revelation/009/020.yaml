id: REV.9.20
reference: Revelation 9:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: vi
  text: Còn những người còn lại[a], là những người không bị giết trong các tai họa này, vẫn không hề ăn năn về những việc tay mình làm ra[b], để không thờ lạy ma quỷ và các hình tượng bằng vàng, bạc, đồng, đá và gỗ[c]—những thứ không thể thấy, nghe hay bước đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “phần nhân loại còn lại.” Từ Hy Lạp chỉ con người nói chung, không riêng nam giới.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ăn năn khỏi những việc của tay mình”; trong ngữ cảnh này, thành ngữ ấy đặc biệt nói đến những vật họ làm ra rồi thờ lạy.'
    reason: lexical_alternative
  - marker: c
    text: 'Mệnh đề Hy Lạp có thể mang sắc thái mục đích hoặc kết quả dự định: sự ăn năn sẽ khiến họ không thờ lạy ma quỷ và các hình tượng.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: những người khác trong nhân loại
  rationale: Diễn đạt số người còn lại sau các tai họa, đồng thời giữ nghĩa phổ quát, không riêng nam giới, của ἀνθρώπων.
- source_word: ἀπεκτάνθησαν
  choice: không bị giết
  rationale: Chuyển trực tiếp thể bị động quá khứ của ἀποκτείνω bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: πληγαῖς
  choice: các tai họa
  rationale: Trong ngữ cảnh Khải Huyền, πληγή chỉ những tai họa giáng xuống; “tai họa” tự nhiên hơn “dịch bệnh” và không thu hẹp nghĩa.
- source_word: οὐδὲ μετενόησαν
  choice: vẫn không ăn năn
  rationale: '“Vẫn không” truyền đạt sức nhấn của οὐδέ: dù sống sót qua các tai họa, họ vẫn không ăn năn.'
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: ăn năn từ bỏ những công việc do tay mình làm ra
  rationale: Giữ giới từ ἐκ theo nghĩa quay khỏi/từ bỏ và bảo tồn hình ảnh cụ thể “công việc của tay,” ở đây đặc biệt hướng đến các tượng do họ chế tác và thờ lạy.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: để không còn thờ lạy
  rationale: Giữ sắc thái mục đích hoặc kết quả dự định của ἵνα μή, đồng thời “không còn” làm rõ rằng sự ăn năn sẽ bao hàm việc chấm dứt sự thờ lạy đang diễn ra.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: δαιμόνια trong Tân Ước chỉ các hữu thể thuộc linh thù nghịch; “các quỷ” là cách gọi rõ và quen thuộc.
- source_word: τὰ εἴδωλα
  choice: những thần tượng
  rationale: Trong ngữ cảnh thờ phượng, εἴδωλα là các tượng được tôn thờ, không phải hình ảnh trung tính.
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: bằng vàng, bạc, đồng, đá và gỗ
  rationale: Các tính từ Hy Lạp mô tả vật liệu làm tượng; cấu trúc “bằng...” là tự nhiên và giữ nguyên chuỗi liệt kê.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: là những thứ không thể thấy, nghe hay đi được
  rationale: Giữ ba khả năng bị phủ định nhằm phơi bày sự bất lực của thần tượng; περιπατεῖν được dịch theo nghĩa cụ thể là “đi.”
theological_decisions:
- issue: Phạm vi của ἀνθρώπων
  choice: nhân loại
  alternative: loài người; người ta
  rationale: “Nhân loại” giữ nghĩa tập thể và bao gồm mọi người, không biến từ ngữ chung này thành cách gọi riêng nam giới.
- issue: Quan hệ giữa sự ăn năn và việc thờ thần tượng trong ἵνα μὴ προσκυνήσουσιν
  choice: để không còn thờ lạy
  alternative: đến nỗi họ không thờ lạy; để họ đừng thờ lạy
  rationale: Cách dịch giữ được sắc thái mục đích/kết quả dự định mà không quyết định cứng nhắc giữa hai giá trị gần nhau của mệnh đề ἵνα; đồng thời cho thấy sự ăn năn gắn với việc lìa bỏ sự thờ lạy sai lạc.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dễ hiểu. Dùng “vẫn không” để chuyển sức nhấn của οὐδέ; dùng “tai họa” thay vì thuật ngữ chỉ riêng dịch bệnh; giữ hình ảnh “do tay mình làm ra” và chuỗi vật liệu của các thần tượng.
