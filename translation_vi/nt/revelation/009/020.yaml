- from: Còn những người khác trong nhân loại[a], là những người không bị giết bởi các tai họa ấy, vẫn không ăn năn từ bỏ những công việc do tay mình làm ra[b], để không còn thờ lạy các quỷ và những thần tượng bằng vàng, bạc, đồng, đá và gỗ[c]—là những thứ không thể thấy, nghe hay đi được.
