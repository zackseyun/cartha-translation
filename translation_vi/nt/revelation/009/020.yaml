review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng mạch chính, nhưng “những người khác trong nhân loại” chưa phản ánh rõ λοιποί là “những người còn lại”. “Thần tượng” trong tiếng Việt hiện đại thường chỉ người nổi tiếng; trong ngữ cảnh εἴδωλα cần dùng “hình tượng” để chỉ các đối tượng thờ cúng. Cụm “ăn năn từ bỏ” có thể được làm rõ và tự nhiên hơn bằng “ăn năn về”, vẫn giữ quan hệ ἐκ trong ngữ cảnh.
  naturalness: 'Bản sửa dùng cách nói hiện đại, trang trọng và tự nhiên hơn: “những người còn lại”, “những việc tay mình làm ra”, và “các hình tượng”. Cấu trúc liệt kê cùng mệnh đề quan hệ vẫn giữ nhịp văn Khải Huyền.'
  terminology: Dùng “ma quỷ” cho δαιμόνια, “hình tượng” cho εἴδωλα, và “tai họa” cho πληγαῖς. “Để không thờ lạy” bảo toàn sắc thái mục đích/kết quả dự định của ἵνα μή mà không thêm khía cạnh thời gian không có trong nguyên văn.
