id: REV.13.17
reference: Revelation 13:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: vi
  text: để không ai có thể mua hoặc bán, trừ người có dấu[a], tên của con thú hoặc con số của tên nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu “tên của con thú hoặc con số của tên nó” là phần xác định “dấu”; cú pháp Hy Lạp cũng có thể được đọc như một chuỗi các mục.
    reason: Bảo tồn sự mơ hồ cú pháp giữa cách hiểu đồng vị và cách hiểu liệt kê.
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: để không ai có thể
  rationale: ἵνα nêu mục đích hoặc kết quả, μή τις chỉ một chủ thể bất định bị phủ định, còn δύνηται diễn tả khả năng. Cách dịch này tự nhiên trong tiếng Việt và giữ nguyên lực của mệnh đề.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: mua hoặc bán
  rationale: Hai động từ nguyên mẫu chỉ hoạt động thương mại thông thường; cách dịch trực tiếp này rõ ràng và tự nhiên.
- source_word: εἰ μὴ ὁ ἔχων
  choice: nếu không có
  rationale: εἰ μή nêu ngoại lệ duy nhất, còn phân từ có mạo từ ὁ ἔχων có nghĩa là “người có”. Tiếng Việt có thể diễn đạt gọn bằng cấu trúc “nếu không có” mà vẫn mang nghĩa chung cho bất kỳ người nào.
- source_word: τὸ χάραγμα
  choice: dấu ấy
  rationale: χάραγμα là dấu, vết khắc hoặc dấu đóng. “Dấu ấy” vừa tự nhiên vừa liên kết với dấu đã được nhắc đến trong ngữ cảnh trước.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: tên của con thú
  rationale: Giữ cấu trúc sở hữu và dùng “con thú” làm danh hiệu biểu tượng quen thuộc của θηρίον trong sách Khải Huyền.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: hoặc con số của tên nó
  rationale: Dịch sát cấu trúc Hy Lạp và dùng “nó” phù hợp tự nhiên với tiền ngữ “con thú”, nhưng không phủ nhận tính chủ thể được nhân cách hóa trong văn cảnh.
theological_decisions:
- issue: Quan hệ giữa “dấu”, “tên của con thú” và “con số của tên nó”
  choice: dùng “tức là” để biểu thị rằng phần sau xác định nội dung của dấu
  alternative: 'coi đây là ba dấu hiệu độc lập trong một danh sách: “dấu ấy, tên của con thú hoặc con số của tên nó”'
  rationale: Cấu trúc đồng vị không có liên từ giữa τὸ χάραγμα và τὸ ὄνομα khiến phần “tên... hoặc con số...” có khả năng giải thích dấu là gì. Tuy vậy, cú pháp có độ mơ hồ thật sự, nên phương án liệt kê được ghi ở chú thích.
- issue: Đại từ αὐτοῦ quy chiếu về θηρίον
  choice: tên nó
  alternative: tên hắn
  rationale: θῆριον là danh từ giống trung trong tiếng Hy Lạp, và “nó” là đại từ tiếng Việt tự nhiên cho “con thú”. “Hắn” vẫn có thể được dùng nếu nhấn mạnh tính chủ thể, nhưng sẽ nhân cách hóa rõ hơn nguyên văn.
- issue: Biểu thức giống đực số ít mang nghĩa khái quát ὁ ἔχων
  choice: diễn đạt phi giới tính bằng “nếu không có”
  alternative: “trừ người có”
  rationale: Giống ngữ pháp trong tiếng Hy Lạp ở đây mang tính khái quát chứ không giới hạn đối tượng là nam giới. Tiếng Việt không cần thêm đại từ có giới tính để chuyển đạt ý này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con thú” nhất quán với ngôn ngữ khải huyền; tránh đại từ mang giới tính khi nguyên ngữ dùng giống đực theo nghĩa khái quát.
