  verdict: revise
  source_fidelity: Bản nháp thêm “tức là”, khiến quan hệ cú pháp giữa “dấu”, “tên của con thú” và “con số của tên nó” được xác định là giải thích/đồng vị trong thân văn. Nguyên văn có thể được hiểu theo hướng này, nhưng cũng có thể được đọc như một chuỗi các mục; vì vậy nên giữ sự mơ hồ trong bản dịch chính. “Trừ người có” phản ánh rõ hơn phân từ thực thể hóa ὁ ἔχων, đồng thời vẫn có nghĩa khái quát, phi giới tính trong tiếng Việt.
  naturalness: “Để không ai có thể mua hoặc bán, trừ người có…” là tiếng Việt hiện đại, trang trọng và rõ nghĩa. Bỏ “ấy” tránh thêm sắc thái chỉ định không được nêu trong câu Hy Lạp này, dù “dấu” đã có bối cảnh gần.
  terminology: Giữ “dấu”, “con thú”, “tên”, và “con số” là phù hợp với cách dùng khải huyền và với các từ χάραγμα, θηρίον, ὄνομα, ἀριθμός. Đại từ “nó” là tự nhiên khi quy chiếu về “con thú” và không áp đặt nhân cách hóa vượt quá văn bản.
