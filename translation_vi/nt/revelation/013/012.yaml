id: REV.13.12
reference: Revelation 13:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: vi
  text: Nó thực thi toàn bộ thẩm quyền của con thú thứ nhất trước mặt con thú ấy.[a] Nó khiến trái đất và những người cư ngụ trên đó thờ lạy con thú thứ nhất, con thú có vết thương chí tử đã được chữa lành.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong sự hiện diện của con thú ấy.” Cụm từ này có thể nhấn mạnh rằng con thú thứ hai hành động dưới ánh mắt hoặc trong sự hiện diện của con thú thứ nhất.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “vết thương của sự chết của nó đã được chữa lành”; nghĩa là “vết thương chí tử đã được chữa lành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Diễn tả quyền được thi hành hay quyền cai quản, thay vì chỉ sức mạnh thuần túy.
- source_word: πᾶσαν
  choice: toàn bộ
  rationale: Nhấn mạnh tính trọn vẹn của thẩm quyền mà con thú thứ hai thực thi.
- source_word: ποιεῖ (lần thứ nhất)
  choice: thực thi
  rationale: Cụm ποιεῖ τὴν ἐξουσίαν mang nghĩa đưa thẩm quyền vào hành động; “thực thi thẩm quyền” tự nhiên trong tiếng Việt.
- source_word: ἐνώπιον αὐτοῦ
  choice: ngay trước mặt con thú ấy
  rationale: 'Giữ được ý nghĩa không gian và quan hệ: hành động trước sự hiện diện hoặc dưới ánh mắt của con thú thứ nhất.'
- source_word: ποιεῖ (lần thứ hai)
  choice: khiến
  rationale: Với tân ngữ và mệnh đề ἵνα theo sau, động từ có lực gây khiến, nhưng không nhất thiết xác định mức độ cưỡng ép.
- source_word: τὴν γῆν
  choice: đất
  rationale: Trong văn cảnh Khải Huyền, γῆ chỉ thế giới dưới đất đối lập với trời; cách nói “đất” phù hợp với nhịp văn Kinh Thánh và cụm tiếp theo.
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: những người sống trên đất
  rationale: Tái hiện cấu trúc động từ κατοικέω một cách tự nhiên, đồng thời giữ mô-típ những người cư ngụ trên đất trong Khải Huyền.
- source_word: ἵνα προσκυνήσουσιν
  choice: thờ lạy
  rationale: Sau động từ gây khiến, tiếng Việt diễn đạt tự nhiên bằng “khiến ... thờ lạy”; “thờ lạy” giữ sắc thái tôn giáo của προσκυνέω.
- source_word: θηρίον
  choice: con thú
  rationale: Cách dịch trực tiếp, quen thuộc của θηρίον trong văn chương khải huyền.
- source_word: πρῶτον
  choice: thứ nhất
  rationale: Phân biệt con thú này với con thú thứ hai trong văn cảnh gần.
- source_word: ἐθεραπεύθη
  choice: đã được chữa lành
  rationale: Giữ thể bị động và hình ảnh chữa lành của động từ θεραπεύω.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: vết thương chí tử
  rationale: Diễn đạt tự nhiên một vết thương dẫn đến cái chết, đồng thời chú thích giữ lại cấu trúc nguyên văn “vết thương của sự chết”.
theological_decisions:
- issue: Mức độ tác động của con thú thứ hai đối với những người sống trên đất
  choice: khiến ... thờ lạy
  alternative: ép buộc ... thờ lạy
  rationale: Cấu trúc gây khiến cho biết con thú thứ hai làm phát sinh sự thờ lạy, nhưng riêng câu này không xác định rõ mức độ cưỡng bức; “khiến” giữ nguyên độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nó” theo mạch văn chỉ con thú thứ hai; các chỗ có thể gây mơ hồ được làm rõ bằng “con thú ấy” mà không thêm cách giải thích thần học.
