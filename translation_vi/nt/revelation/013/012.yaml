  to: Nó thực thi toàn bộ thẩm quyền của con thú thứ nhất trước mặt con thú ấy.[a] Nó khiến trái đất và những người cư ngụ trên đó thờ lạy con thú thứ nhất, con thú có vết thương chí tử đã được chữa lành.[b]
  rationale: Bản sửa loại bỏ sự nhấn mạnh thêm của “ngay”, dùng “trái đất” để phản ánh phạm vi của γῆ trong văn cảnh Khải Huyền, và chỉnh chú thích b để bao gồm rõ αὐτοῦ. Không thay đổi mức độ gây khiến của ποιεῖ hoặc áp đặt diễn giải thần học.
