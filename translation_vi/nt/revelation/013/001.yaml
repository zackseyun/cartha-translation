- from: Rồi tôi thấy một con thú từ biển đi lên[a], có mười sừng và bảy đầu; trên các sừng của nó có mười vương miện[b], còn trên các đầu của nó có những danh hiệu phạm thượng[c].
  to: Rồi tôi thấy một con thú từ trong biển đi lên[a], có mười sừng và bảy đầu; trên các sừng của nó có mười vương miện[b], còn trên các đầu của nó có những tên phạm thượng.
  rationale: Bản sửa bảo toàn hình tượng khải huyền và không giải nghĩa con thú hay các biểu tượng. “Từ trong biển” phản ánh trực tiếp ἐκ; “những tên phạm thượng” phản ánh ὀνόματα βλασφημίας mà không quy chúng thành tước hiệu. Chú thích về διαδήματα chỉ bảo lưu sắc thái từ vựng “diadem”, thay cho lời diễn giải về biểu tượng vương quyền. Chú thích c không còn cần thiết vì cách dịch chính văn đã dùng chính phương án mà chú thích ấy nêu.
