id: REV.13.1
reference: Revelation 13:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: vi
  text: Rồi tôi thấy một con thú từ trong biển đi lên[a], có mười sừng và bảy đầu; trên các sừng của nó có mười vương miện[b], còn trên các đầu của nó có những tên phạm thượng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ biển đi lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mười mũ miện (diadem).”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: tôi thấy
  rationale: Dịch trực tiếp động từ aorist chỉ hành động nhìn thấy trong diễn tiến khải tượng, không thêm ý “trong khải tượng” vốn không được nói rõ tại đây.
- source_word: ἐκ τῆς θαλάσσης ... ἀναβαῖνον
  choice: từ biển đi lên
  rationale: Giữ hình ảnh con thú xuất hiện từ trong biển và diễn đạt tự nhiên trong tiếng Việt; chú thích nêu cách dịch sát nét xuất phát hơn.
- source_word: θηρίον
  choice: một con thú
  rationale: “Con thú” là cách gọi tự nhiên, giữ nguyên hình tượng khải huyền mà không giải thích nó là nhân vật hay quyền lực nào.
- source_word: κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: mười sừng và bảy đầu
  rationale: Dịch trực tiếp các chi tiết tượng trưng, không diễn giải ý nghĩa.
- source_word: διαδήματα
  choice: vương miện
  rationale: διάδημα chỉ loại mũ miện biểu thị vương quyền; “vương miện” vừa dễ hiểu vừa phân biệt tương đối rõ với chiếc mão nói chung.
- source_word: ὀνόματα βλασφημίας
  choice: những danh hiệu phạm thượng
  rationale: ὄνομα trong ngữ cảnh chữ được ghi trên các đầu có thể chỉ tên gọi hoặc danh hiệu; “danh hiệu” tự nhiên hơn với nhiều đầu và vẫn giữ sức nặng của βλασφημία. Chú thích bảo lưu cách hiểu “những tên phạm thượng”.
theological_decisions:
- issue: Hình tượng khải huyền mang tính biểu tượng
  choice: Giữ nguyên các hình ảnh “con thú”, “mười sừng”, “bảy đầu” và “vương miện” trong bản văn.
  alternative: Đồng nhất con thú với một đế quốc, vua, chính quyền hoặc tác nhân thuộc Sa-tan.
  rationale: Câu này thuật lại hình ảnh được thấy nhưng không tự giải nghĩa; bản dịch không nên đưa một hệ thống giải kinh cụ thể vào chính văn.
- issue: Quan hệ ngữ nghĩa trong ὀνόματα βλασφημίας
  choice: “những danh hiệu phạm thượng”
  alternative: “những danh hiệu xúc phạm Đức Chúa Trời” hoặc “những tên của sự phạm thượng”
  rationale: “Phạm thượng” giữ sự cô đọng và độ mở của cụm Hy Lạp, không chỉ rõ đối tượng bị xúc phạm khi câu không nêu ra.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và giàu hình ảnh. Dùng “Rồi” để nối mạch tường thuật của Καί; dùng dấu chấm phẩy để câu dài vẫn rõ. Đại từ “nó” phù hợp với “con thú” và tránh nhân cách hóa quá mức.
