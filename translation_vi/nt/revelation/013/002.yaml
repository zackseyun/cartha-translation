id: REV.13.2
reference: Revelation 13:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: vi
  text: Con thú tôi thấy giống như con báo[a]; chân nó như chân gấu, còn miệng nó như miệng sư tử. Con rồng trao cho nó quyền năng, ngai và thẩm quyền lớn của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hình ảnh con báo, con gấu và con sư tử gợi lại các khải tượng về những con thú trong Đa-ni-ên 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: con thú
  rationale: Trong Khải Huyền, từ này chỉ một thú vật quái dị mang ý nghĩa khải huyền; “con thú” tự nhiên trong tiếng Việt và giữ được sức nặng biểu tượng, không trung hòa thành “sinh vật” hay “động vật”.
- source_word: ὅμοιον παρδάλει
  choice: giống như con báo
  rationale: ὅμοιος với cách ba diễn tả sự tương tự; cách dịch này tự nhiên và không giải thích quá mức hình ảnh trong khải tượng.
- source_word: πόδες ... ὡς ἄρκου
  choice: chân nó như chân gấu
  rationale: “Chân” phản ánh nghĩa thông thường của πόδες; lặp lại “chân” để làm rõ phép so sánh tỉnh lược trong tiếng Hy Lạp mà không cụ thể hóa thành “bàn chân” hay “vuốt”.
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: miệng nó như miệng sư tử
  rationale: Giữ nguyên sự lặp lại của στόμα, duy trì tính cân đối và vẻ sống động của lời mô tả.
- source_word: δράκων
  choice: con rồng
  rationale: Đây là cách dịch trực tiếp và quen thuộc cho nhân vật khải huyền này trong Khải Huyền.
- source_word: ἔδωκεν
  choice: trao cho
  rationale: “Trao cho” diễn đạt tự nhiên hành động ban giao quyền lực trong ngữ cảnh, đồng thời vẫn gần với nghĩa “cho” của δίδωμι.
- source_word: δύναμιν
  choice: quyền năng
  rationale: Diễn tả năng lực hoạt động được con rồng trao, đồng thời phân biệt với ἐξουσία là quyền hay thẩm quyền hành使.
- source_word: θρόνον
  choice: ngai
  rationale: “Ngai” giữ nguyên hình ảnh vương quyền và cai trị của θρόνος trong Khải Huyền.
- source_word: ἐξουσίαν μεγάλην
  choice: thẩm quyền lớn
  rationale: “Thẩm quyền” giữ sắc thái quyền được phép thi hành hoặc cai trị, phân biệt với δύναμις; “lớn” phản ánh trực tiếp μεγάλην.
- source_word: αὐτοῦ
  choice: của mình
  rationale: Trong cụm cuối, “của mình” quy chiếu tự nhiên về chủ ngữ “con rồng” và cho thấy cả quyền năng, ngai lẫn thẩm quyền đều thuộc về nó trước khi được trao.
theological_decisions:
- issue: Cách biểu đạt quan hệ giữa con rồng và con thú
  choice: Dùng “nó” cho con thú và “của mình” để quy chiếu các sở hữu về con rồng.
  alternative: Lặp lại “của nó” sau từng danh từ hoặc dùng đại từ nhân xưng mang tính người cho con rồng.
  rationale: Tiếng Hy Lạp dùng cùng dạng đại từ, không tự nó ấn định mức độ nhân cách hóa. Cách dịch tiếng Việt giữ rõ quan hệ quy chiếu mà không thêm kết luận thần học.
- issue: Giữ nguyên hình ảnh tổng hợp từ các loài thú
  choice: Dịch trực tiếp các so sánh với báo, gấu và sư tử; chỉ nêu liên hệ với Đa-ni-ên 7 trong chú thích.
  alternative: Đưa lời giải thích về Đa-ni-ên 7 vào chính văn.
  rationale: Bản văn gợi lại các khải tượng trong Đa-ni-ên nhưng không giải thích trực tiếp tại đây; giữ hình ảnh trong chính văn bảo toàn tính hàm súc và căng thẳng diễn giải.
- issue: Phân biệt δύναμις và ἐξουσία
  choice: Dịch lần lượt là “quyền năng” và “thẩm quyền”.
  alternative: Dịch cả hai bằng “quyền lực” hoặc diễn giải ἐξουσία là “quyền cai trị”.
  rationale: Hai từ có trường nghĩa giao nhau nhưng không đồng nhất; cách dịch này duy trì sự phân biệt giữa năng lực và quyền hành mà không thu hẹp ἐξουσία vào một cách giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp mô tả cân đối của nguyên văn; dùng “con thú” và “con rồng” theo cách gọi tự nhiên trong tiếng Việt, tránh từ ngữ cổ hoặc diễn giải giáo phái.
