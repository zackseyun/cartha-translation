revisions:
- from: Nó mở miệng thốt ra những lời phạm thượng chống lại Đức Chúa Trời, xúc phạm danh Ngài và nơi ngự của Ngài—tức là những người đang ngự trên trời.[a][b]
  to: Nó mở miệng thốt ra những lời phạm thượng chống lại Đức Chúa Trời, để báng bổ danh Ngài và nơi ngự của Ngài[b]—tức là những người cư ngụ trên trời.[a]
  rationale: Sửa “đang ngự trên trời” thành “cư ngụ trên trời” để dịch đúng σκηνοῦντας và tránh gán ý nghĩa trị vì. Đổi “xúc phạm” thành “báng bổ” để phản ánh rõ βλασφημῆσαι. Giữ cách đọc đồng vị bằng “—tức là”, đồng thời chú thích [a] đặt tại cụm cuối để bảo lưu cách đọc khả dĩ khác là một đối tượng phối hợp thứ ba. Chú thích [b] được đặt ngay sau “nơi ngự” là từ nó giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc cơ bản: con thú mở miệng nói phạm thượng chống Đức Chúa Trời, rồi báng bổ danh Ngài và σκηνή của Ngài. Tuy nhiên, “những người đang ngự trên trời” không phù hợp với τοὺς ... σκηνοῦντας: σκηνοῦντας chỉ những người cư ngụ/ở, không nói họ “ngự” (một động từ thường chỉ sự trị vì hoặc cách nói tôn kính dành cho Đức Chúa Trời/vua).'
  naturalness: “Nó mở miệng thốt ra những lời phạm thượng” và “nơi ngự của Ngài” tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Thay “đang ngự trên trời” bằng “cư ngụ trên trời” vừa tự nhiên vừa tránh hàm ý sai. Dấu gạch ngang cùng “tức là” diễn đạt rõ cách hiểu đồng vị đã được chọn, trong khi chú thích vẫn bảo lưu cách hiểu phối hợp.
  terminology: Giữ “Đức Chúa Trời”, “danh Ngài”, “phạm thượng”, và “nơi ngự của Ngài” phù hợp với văn phong trang trọng và thuật ngữ Kinh Thánh. Dùng “báng bổ” cho βλασφημῆσαι phản ánh trực tiếp động từ Hy Lạp và tránh lặp nguyên cụm “phạm thượng” quá sát.
  issues:
  - severity: medium
    issue: “những người đang ngự trên trời” dịch sai sắc thái của σκηνοῦντας.
    rationale: Phân từ hiện tại của σκηνόω nghĩa là ở, cư ngụ, hoặc dựng lều; nó không có nghĩa là ngự trị. “Ngự” gán một sắc thái tôn kính/vương quyền không có trong nguyên văn và gây nhầm lẫn khi chủ ngữ là “những người”.
  - severity: low
    issue: Động từ “xúc phạm” làm yếu sắc thái lặp lại của βλασφημῆσαι.
    rationale: Trong ngữ cảnh này, “báng bổ” là từ tương ứng trực tiếp và rõ hơn với βλασφημέω, đồng thời bảo toàn trường nghĩa của βλασφημίας ở mệnh đề trước.
  revised_text: Nó mở miệng thốt ra những lời phạm thượng chống lại Đức Chúa Trời, để báng bổ danh Ngài và nơi ngự của Ngài[b]—tức là những người cư ngụ trên trời.[a]
