id: REV.13.6
reference: Revelation 13:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: vi
  text: Nó mở miệng thốt ra những lời phạm thượng chống lại Đức Chúa Trời, để báng bổ danh Ngài và nơi ngự của Ngài[b]—tức là những người cư ngụ trên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch phần cuối là: “và những người cư ngụ trên trời,” hiểu đây là đối tượng thứ ba của hành động “báng bổ”, thay vì phần giải thích cho “nơi ngự của Ngài”.'
    reason: alternative_reading
  - marker: b
    text: “Nơi ngự” cũng có thể dịch là “đền tạm” hoặc “lều”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: Nó mở miệng
  rationale: Giữ hình ảnh sống động của nguyên văn; “nó” chỉ con thú trong ngữ cảnh, không biến nó thành một nhân vật nam.
- source_word: εἰς βλασφημίας
  choice: thốt ra những lời phạm thượng
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp trong tiếng Việt, đồng thời giữ sắc thái số nhiều của βλασφημίας là nhiều lời phát ngôn phạm thượng.
- source_word: πρὸς τὸν θεόν
  choice: chống lại Đức Chúa Trời
  rationale: Trong ngữ cảnh lời nói thù nghịch, πρός mang ý hướng chống lại; “Đức Chúa Trời” là cách gọi trang trọng, thông dụng.
- source_word: βλασφημῆσαι
  choice: xúc phạm
  rationale: Tránh lặp từ nặng nề ngay trong cùng câu nhưng vẫn truyền đạt hành động báng bổ danh và nơi ngự của Đức Chúa Trời.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: danh Ngài
  rationale: Giữ ngôn ngữ Kinh Thánh quen thuộc về danh, tức căn tính và danh dự được bày tỏ của Đức Chúa Trời, mà không diễn giải thêm.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: nơi ngự của Ngài
  rationale: σκηνή có thể là lều, đền tạm hoặc nơi ở; “nơi ngự” tự nhiên, trang trọng và phù hợp với nơi ở trên trời mà không áp đặt sắc thái nghi lễ.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: những người đang ngự trên trời
  rationale: Giữ mối liên hệ từ vựng giữa σκηνή và σκηνοῦντας qua “nơi ngự/ngự”, đồng thời phản ánh phân từ hiện tại.
theological_decisions:
- issue: Quan hệ giữa “nơi ngự của Ngài” và “những người đang ngự trên trời”
  choice: Đọc cụm cuối như phần đồng vị/giải thích cho “nơi ngự của Ngài”, được báo hiệu bằng dấu gạch ngang và “tức là”.
  alternative: 'Đọc cụm cuối như đối tượng thứ ba của “xúc phạm”: “và những người đang ngự trên trời”.'
  rationale: Cách đọc đồng vị phù hợp với dạng đối cách và mối liên hệ giữa σκηνή với σκηνοῦντας; tuy nhiên, cú pháp Hy Lạp cũng cho phép cách đọc liệt kê, nên giữ phương án ấy trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “nó” cho con thú và “Ngài” cho Đức Chúa Trời để phân biệt rõ các đại từ. Các dấu chú thích đều xuất hiện trong chính văn.
