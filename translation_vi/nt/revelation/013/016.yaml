id: REV.13.16
reference: Revelation 13:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: vi
  text: Nó khiến mọi người—người thấp kém và người quyền thế, người giàu và người nghèo, người tự do và nô lệ—được ban cho một dấu[a] trên tay phải hoặc trên trán của họ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “để họ ban cho những người ấy một dấu.” Cách diễn đạt Hy Lạp ở đây không nêu rõ “họ” là ai và khá khó chuyển tự nhiên sang tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: khiến
  rationale: Trong cấu trúc với ἵνα và động từ giả định, ποιεῖ diễn tả quan hệ gây khiến. “Khiến” tự nhiên trong tiếng Việt và không tự ý nhấn mạnh mức độ cưỡng ép.
- source_word: πάντας
  choice: mọi người
  rationale: Bao quát tất cả những người thuộc các cặp phạm trù xã hội được liệt kê tiếp theo.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: kẻ nhỏ và người lớn
  rationale: Giữ hình ảnh và nhịp đối xứng của nguyên văn, chỉ mọi địa vị từ thấp đến cao; “kẻ nhỏ” không mang nghĩa trẻ em trong văn cảnh này.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: người giàu và người nghèo
  rationale: Cách diễn đạt thông dụng, chính xác cho cặp tương phản kinh tế-xã hội.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: người tự do và nô lệ
  rationale: Sự đối lập với người tự do làm nổi bật thân phận bị sở hữu/ràng buộc của δοῦλος, nên “nô lệ” chính xác hơn “đầy tớ” ở đây.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: được ban cho một dấu
  rationale: Diễn đạt bị động tự nhiên vừa giữ ý gây khiến trong văn cảnh, vừa phản ánh δῶσιν (“họ ban/cho”) tốt hơn cách diễn giải “nhận”; cách dịch sát mặt chữ được bảo tồn trong chú thích.
- source_word: χάραγμα
  choice: dấu
  rationale: “Dấu” là từ tự nhiên và đủ rộng để chỉ dấu khắc, dấu in hoặc dấu hiệu nhận dạng trong sách Khải Huyền.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: trên tay phải
  rationale: Bám sát giới từ và danh từ số ít mang ý phân phối; tiếng Việt không cần đánh dấu số nhiều.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: hoặc trên trán của họ
  rationale: Giữ nguyên lựa chọn vị trí và đại từ sở hữu trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch δοῦλος trong cặp địa vị xã hội
  choice: nô lệ
  alternative: đầy tớ
  rationale: Cặp “người tự do và nô lệ” nói rõ địa vị pháp lý-xã hội, nên không làm nhẹ sắc thái lệ thuộc của từ Hy Lạp.
- issue: Cách diễn đạt mệnh đề khó ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: được ban cho một dấu
  alternative: để họ ban cho những người ấy một dấu
  rationale: Bản chính cần tự nhiên và phản ánh biến cố được mô tả mà không xác định quá mức chủ thể ngầm của “ban”; chú thích giữ cấu trúc sát chữ và sự khó hiểu thực có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì ba cặp đối xứng mang nhịp điệu của nguyên văn. Dấu gạch ngang giúp tách danh sách khỏi mệnh đề chính. Câu kết bằng dấu phẩy vì đây là phần tiếp nối sang câu 17.
