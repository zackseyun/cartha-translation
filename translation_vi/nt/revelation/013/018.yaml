id: REV.13.18
reference: Revelation 13:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: vi
  text: 'Đây là sự khôn ngoan: ai có trí khôn, hãy tính số của con thú, vì đó là số của một người[a], và số của nó là sáu trăm sáu mươi sáu[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì đó là một con số của con người.”'
    reason: alternative_reading
  - marker: b
    text: Một số bản chép tay ghi 616 thay vì 666.
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: Đây là sự khôn ngoan
  rationale: Giữ sát cấu trúc nêu điểm trọng yếu của nguyên văn, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὁ ἔχων νοῦν
  choice: ai có trí hiểu
  rationale: Diễn đạt cụm phân từ chỉ bất cứ người nào có khả năng nhận biết và suy xét; “trí hiểu” nhấn mạnh sự lĩnh hội hơn là chỉ cơ quan tư duy.
- source_word: ψηφισάτω
  choice: hãy tính
  rationale: Thể hiện mệnh lệnh tính toán hoặc xác định một trị số, phù hợp với ngữ cảnh về con số.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: số của con thú
  rationale: Dịch trực tiếp và nhất quán; “con thú” là cách gọi tự nhiên cho θηρίον trong văn cảnh khải huyền.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: vì đó là số của một người
  rationale: Giữ dạng số ít và mối quan hệ sở thuộc có thể có của ἀνθρώπου, nhưng không xác định người ấy là ai; chú thích bảo lưu cách hiểu rộng hơn là một con số thuộc bình diện con người.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: số của nó
  rationale: Đại từ quy chiếu về con thú; “nó” tự nhiên trong tiếng Việt và không áp đặt trước rằng con thú là một cá nhân nam.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: sáu trăm sáu mươi sáu
  rationale: Chuyển trực tiếp trị số 666 sang cách đọc số tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἀνθρώπου trong ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: Dịch “số của một người” trong chính văn.
  alternative: “một con số của con người” hoặc “một con số thuộc về loài người”
  rationale: Sở hữu cách số ít trong tiếng Hy Lạp có thể chỉ một người cụ thể, một người không xác định, hoặc tính chất con người nói chung. Chính văn giữ sắc thái số ít mà không nhận diện nhân vật; chú thích nêu cách hiểu rộng hơn để không hóa giải sự mơ hồ của câu.
- issue: Dị bản về con số của con thú
  choice: Giữ 666 trong chính văn.
  alternative: '616'
  rationale: SBLGNT đọc 666, được chứng thực rộng rãi hơn; tuy nhiên, dị bản 616 là cổ và đáng kể nên được ghi trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu mệnh lệnh dùng “ai… hãy…” để giữ tính khái quát; dấu chấm phẩy làm rõ bước chuyển từ lý do sang việc nêu con số, nhưng vẫn bảo toàn mạch lập luận của nguyên văn.
