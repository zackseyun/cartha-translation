- from: 'Đây là sự khôn ngoan: ai có trí hiểu, hãy tính số của con thú, vì đó là số của một người[a]; số của nó là sáu trăm sáu mươi sáu[b].'
  to: 'Đây là sự khôn ngoan: ai có trí khôn, hãy tính số của con thú, vì đó là số của một người[a], và số của nó là sáu trăm sáu mươi sáu[b].'
  rationale: Bản sửa chỉ cải thiện tính tự nhiên của tiếng Việt và làm gọn chú thích thay thế. «Số của một người» tiếp tục giữ số ít và tính mơ hồ của sở hữu cách ἀνθρώπου; chú thích bảo lưu khả năng hiểu theo nghĩa con người nói chung. Dị bản 616 vẫn được neo đúng tại con số trong chính văn.
