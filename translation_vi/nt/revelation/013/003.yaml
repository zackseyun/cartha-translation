id: REV.13.3
reference: Revelation 13:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: vi
  text: Một trong các đầu của nó dường như đã bị sát hại đến chết[a], và vết thương chí tử của nó đã được chữa lành. Cả thế gian đều kinh ngạc và đi theo con thú[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như thể đã bị sát hại đến chết.” Từ Hy Lạp có nghĩa là “như,” có thể chỉ vẻ bề ngoài hoặc sự tương tự, chứ không nhất thiết khẳng định thẳng rằng cái đầu ấy thật sự đã chết.'
    reason: lexical_alternative
  - marker: b
    text: “Cả thế gian” cũng có thể dịch là “cả xứ,” nhưng trong bối cảnh khải huyền này, nghĩa “cả thế gian” có khả năng phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: một trong các đầu của nó
  rationale: Diễn đạt tự nhiên cấu trúc bộ phận μίαν ἐκ với danh từ số nhiều, đồng thời giữ đại từ chỉ con thú.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: như đã bị giết chết
  rationale: “Như” giữ sắc thái so sánh hoặc vẻ bề ngoài của ὡς; “bị giết chết” truyền đạt sức mạnh của σφάζω và kết quả tử vong của εἰς θάνατον mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: vết tử thương của nó
  rationale: “Vết tử thương” là cách diễn đạt trang trọng, gọn và tự nhiên cho một vết thương mang tính chí tử, không buộc người đọc hiểu rằng cái chết thực sự đã xảy ra.
- source_word: ἐθεραπεύθη
  choice: đã được chữa lành
  rationale: Giữ thể bị động và ý nghĩa phục hồi khỏi vết thương.
- source_word: ἐθαυμάσθη
  choice: kinh ngạc
  rationale: Diễn tả phản ứng sửng sốt, thán phục mà không xác định phản ứng ấy là tích cực hay tiêu cực.
- source_word: ὅλη ἡ γῆ
  choice: cả thế gian
  rationale: Trong bối cảnh khải huyền có phạm vi rộng, “cả thế gian” truyền đạt tự nhiên ý toàn thể γῆ, đồng thời chú thích khả năng hiểu là “cả xứ”.
- source_word: ὀπίσω τοῦ θηρίου
  choice: đi theo con thú
  rationale: Truyền đạt cả hình ảnh đi theo phía sau lẫn hàm ý quy phục hoặc ủng hộ, nhưng không diễn giải quá mức.
- source_word: θηρίου
  choice: con thú
  rationale: Cách gọi thông dụng, rõ ràng cho θηρίον trong hình ảnh khải huyền; không viết hoa vì nguyên văn không đánh dấu đây là tên riêng.
theological_decisions:
- issue: Bản chất của việc con thú dường như chết rồi hồi phục
  choice: Giữ hình ảnh một cái đầu như bị giết chết và vết tử thương được chữa lành, không xác định cơ chế hay bản chất sự kiện.
  alternative: Hiểu đó là sự chết và sống lại theo nghĩa đen, sự phục hồi mang tính chính trị, hoặc một màn giả chết để lừa dối.
  rationale: Nguyên văn dùng ὡς (“như”) nhưng cũng nói vết tử thương đã được chữa lành. Bản dịch cần giữ nguyên sức căng và sự mơ hồ ấy, không áp đặt một hệ thống cánh chung cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu văn giữ hình ảnh khải huyền, dùng “vết tử thương” để súc tích mà không làm mất tính chất chí tử; các dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn.
