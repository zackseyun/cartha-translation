  source_fidelity: “Ai có tai, hãy nghe.” faithfully conveys Εἴ τις ἔχει οὖς ἀκουσάτω. The Vietnamese conditional-relative construction “Ai ... , hãy ...” naturally represents the Greek generic conditional exhortation. “tai” and “nghe” preserve the source’s compact hearing formula without interpretive expansion.
