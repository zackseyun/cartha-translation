id: REV.13.9
reference: Revelation 13:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: vi
  text: Ai có tai, hãy nghe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu Hy Lạp dùng dạng số ít nhưng mang ý nghĩa khái quát, chỉ bất cứ người nào.
    reason: Làm rõ rằng số ít trong công thức này không giới hạn lời kêu gọi vào một cá nhân hay một giới.
lexical_decisions:
- source_word: Εἴ τις
  choice: Ai
  rationale: Cụm điều kiện với đại từ bất định có thể chuyển tự nhiên sang tiếng Việt bằng “Ai”, vẫn giữ lực khái quát của lời kêu gọi; cấu trúc “Ai... hãy...” diễn đạt điều kiện hàm ẩn mà không nặng nề.
- source_word: ἔχει
  choice: có
  rationale: Diễn đạt trực tiếp động từ chỉ sự sở hữu, đồng thời tự nhiên trong công thức “có tai”.
- source_word: οὖς
  choice: tai
  rationale: Giữ danh từ số ít của tiếng Hy Lạp. Tiếng Việt không cần mạo từ nên “có tai” vừa sát nguồn vừa tự nhiên.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Mệnh lệnh ngôi thứ ba số ít được diễn đạt tự nhiên bằng “hãy nghe”; giữ động từ “nghe” và sắc thái lời kêu gọi trang trọng, không diễn giải thành “hiểu” hay thu hẹp thành hành vi nghe âm thanh.
theological_decisions:
- issue: Phạm vi quy chiếu khái quát của τις và hình thức số ít
  choice: Ai có tai, hãy nghe
  alternative: Nếu ai có tai, người ấy hãy nghe
  rationale: Tiếng Hy Lạp dùng số ít với quy chiếu khái quát. Tiếng Việt không đánh dấu giống ở đại từ hay mệnh lệnh, nên cấu trúc này giữ được số ít và tính bao quát mà không cần đưa thêm yếu tố giới tính vốn không hiện diện trong ngữ pháp tiếng Việt.
- issue: Lực thành ngữ của công thức về sự nghe
  choice: giữ “nghe”
  alternative: hãy hiểu; hãy lắng nghe
  rationale: “Nghe” bảo tồn âm hưởng tiên tri–khải huyền và sự căng thẳng giữa nghe bằng tai với tiếp nhận, đáp ứng; không âm thầm giới hạn ý nghĩa vào sự hiểu biết hay diễn giải quá mức.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và dễ hiểu trong tiếng Việt hiện đại. “Ai có tai, hãy nghe” giữ nhịp súc tích của nguyên văn và công thức Kinh Thánh quen thuộc.
