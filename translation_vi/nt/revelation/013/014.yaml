id: REV.13.14
reference: Revelation 13:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: vi
  text: Nó lừa dối[a] những người sống trên đất bằng những dấu lạ mà nó được ban cho thực hiện trước mặt con thú. Nó bảo những người sống trên đất làm một hình tượng cho con thú[b], tức là con thú có vết thương do gươm mà vẫn sống[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn lạc những người sống trên đất.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “làm một hình tượng của con thú”; nguyên văn sát hơn là “một hình tượng cho con thú.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “có vết thương do gươm và đã sống lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: lừa dối
  rationale: Diễn đạt rõ nghĩa khiến người khác hiểu sai và đi lạc hướng; chú thích giữ phương án “dẫn lạc”.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: những người sống trên đất
  rationale: Tự nhiên trong tiếng Việt hiện đại, đồng thời giữ dạng diễn đạt bằng động từ và mô-típ lặp lại trong Khải Huyền.
- source_word: διὰ τὰ σημεῖα
  choice: dùng những dấu lạ ... để
  rationale: διά với đối cách có thể chỉ nguyên nhân hoặc phương tiện; cấu trúc này truyền đạt vai trò phương tiện của các dấu lạ mà không loại bỏ sắc thái căn nguyên.
- source_word: σημεῖα
  choice: dấu lạ
  rationale: Trong văn cảnh Khải Huyền, “dấu lạ” vừa tự nhiên vừa giữ ý nghĩa dấu chỉ phi thường, không thêm từ giải thích như “phép lạ”.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: nó được ban cho thực hiện
  rationale: Giữ thể bị động và không nói rõ chủ thể ban quyền, phù hợp sự dè dặt của nguyên văn.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: trước mặt con thú
  rationale: Cách nói tiếng Việt tự nhiên, giữ nghĩa không gian và quan hệ của ἐνώπιον.
- source_word: λέγων
  choice: Nó bảo
  rationale: Chuyển phân từ sang mệnh đề độc lập cho tự nhiên; “bảo” truyền đạt việc nói với người khác mà không tăng lực thành “ra lệnh”.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: làm một hình tượng cho con thú
  rationale: Giữ giá trị tặng cách của τῷ θηρίῳ là “cho con thú”; không tự động đổi thành sở hữu “của con thú”.
- source_word: εἰκόνα
  choice: hình tượng
  rationale: Bao quát hình ảnh hay vật thể đại diện, đồng thời phù hợp văn cảnh thờ phượng hơn từ hẹp nghĩa “tượng”.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: là con thú đã mang vết thương do gươm
  rationale: Nêu rõ tiền ngữ của đại từ quan hệ để tránh nhập nhằng trong tiếng Việt; “đã mang” diễn đạt đặc điểm phát sinh từ biến cố trước đó dù ἔχει ở thì hiện tại.
- source_word: μάχαιρα
  choice: gươm
  rationale: Tương đương truyền thống, trang trọng và đủ rộng, không xác định quá mức loại vũ khí.
- source_word: καὶ ἔζησεν
  choice: mà vẫn sống
  rationale: Diễn đạt tự nhiên sự tương phản ngầm giữa vết thương do gươm và việc sống, nhưng không khẳng định rõ một sự phục sinh.
theological_decisions:
- issue: Hàm ý thần học của thể bị động ἐδόθη
  choice: Giữ “được ban cho” mà không nói ai ban.
  alternative: “Đức Chúa Trời ban cho nó quyền” hoặc “nó được phép”
  rationale: Nguyên văn để tác nhân không được nêu; bản dịch giữ nguyên sự dè dặt và sức căng về quyền tối thượng cùng sự cho phép.
- issue: Sắc thái của ἔζησεν sau vết thương
  choice: “mà vẫn sống”
  alternative: “sống lại” hoặc “hồi sinh”
  rationale: Câu cho thấy con thú sống bất chấp vết thương, nhưng không buộc người dịch xác định đây là sự phục sinh theo nghĩa đầy đủ.
- issue: Quan hệ giữa hình tượng và con thú
  choice: “hình tượng cho con thú”
  alternative: “hình tượng của con thú”
  rationale: Tặng cách trong nguyên văn trực tiếp nói “cho con thú”; bản dịch chính không biến hàm ý có thể có thành quan hệ sở hữu hay mô phỏng chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “con thú” nhất quán với ngôn ngữ Khải Huyền; tách câu dài của Hy Lạp thành hai câu tiếng Việt để rõ chủ thể. Các dấu chú thích được đặt ngay sau thành phần liên quan, thay vì gom lại một chỗ.
