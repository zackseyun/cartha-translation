  revision_rationale: 'Bản sửa duy trì đầy đủ ý nghĩa và sự mơ hồ có chủ ý của SBLGNT: cái miệng nói “những điều lớn lao” và những lời phạm thượng; thẩm quyền được ban cho để hành động trong thời gian xác định. Sửa “cũng” thành “và” để phản ánh chính xác hơn liên từ καί, và dùng “những điều lớn lao” để tránh diễn giải quá sớm μεγάλα. Chú thích dị bản được viết lại theo cách thận trọng, không khẳng định quá mức về quan hệ chính xác giữa thủ bản và truyền thống dịch.'
