id: REV.13.5
reference: Revelation 13:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: vi
  text: Nó được ban cho một cái miệng thốt ra những điều lớn lao[b] và những lời phạm thượng, và nó được ban cho thẩm quyền để hành động trong bốn mươi hai tháng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản và bản dịch có cách dịch: “nó được ban cho thẩm quyền để tiếp tục trong bốn mươi hai tháng.”'
    reason: textual_variant
  - marker: b
    text: Trong văn cảnh, “những điều lớn lao” có lẽ mang nghĩa những lời kiêu căng hoặc khoác lác.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: được ban cho
  rationale: Giữ thể bị động và sự lặp lại của động từ trong câu, cho thấy con thú nhận điều này chứ không tự mình vốn có.
- source_word: στόμα
  choice: một cái miệng
  rationale: Giữ hình ảnh khải huyền cụ thể của nguyên văn thay vì giản lược thành “khả năng nói” hay “lời nói”.
- source_word: λαλοῦν
  choice: thốt ra
  rationale: Diễn đạt tự nhiên trong tiếng Việt khi chủ thể ngữ pháp là “một cái miệng”, đồng thời giữ ý đang phát lời.
- source_word: μεγάλα
  choice: những lời lớn lao
  rationale: Giữ độ rộng và tính mơ hồ của nguyên văn; văn cảnh hàm ý lời kiêu căng hoặc khoác lác, nhưng từ Hy Lạp không trực tiếp nói “lời khoác lác”.
- source_word: βλασφημίας
  choice: những lời phạm thượng
  rationale: Thể hiện rõ nội dung phát ngôn xúc phạm đến Đức Chúa Trời và giữ dạng số nhiều.
- source_word: ἐξουσία
  choice: thẩm quyền
  rationale: Nhấn mạnh quyền hạn được trao hoặc cho phép, phù hợp với thể bị động “được ban cho”, hơn là chỉ sức mạnh thuần túy.
- source_word: ποιῆσαι
  choice: để hành động
  rationale: Động từ có nghĩa rộng là làm hoặc thực hiện; “hành động” phù hợp với khoảng thời gian đi kèm mà không đưa thêm một tân ngữ không có trong nguyên văn.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: trong bốn mươi hai tháng
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài trong tiếng Việt và giữ nguyên con số mang ý nghĩa khải huyền.
theological_decisions:
- issue: Sắc thái của μεγάλα trong lời nói của con thú
  choice: những lời lớn lao
  alternative: những lời khoác lác; những lời kiêu căng
  rationale: Văn cảnh cho thấy tính tự cao và chống nghịch Đức Chúa Trời, nhưng bản thân μεγάλα rộng nghĩa hơn. Bản dịch chính giữ sự căng thẳng này, còn chú thích nêu sắc thái có khả năng được hàm ý.
- issue: Ý nghĩa của ποιῆσαι khi đi với cụm chỉ thời gian
  choice: để hành động trong bốn mươi hai tháng
  alternative: để tiếp tục trong bốn mươi hai tháng
  rationale: Bản chính đi theo cách đọc ποιῆσαι của SBLGNT. Cách dịch “tiếp tục” gắn với một dị bản và truyền thống dịch khác nên được giữ trong chú thích, không đưa vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “nó” nối tự nhiên với con thú ở văn cảnh trước; cấu trúc bị động được giữ để phản ánh mô-típ quyền hạn được ban cho trong sách Khải Huyền.
