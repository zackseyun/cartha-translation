revisions:
- from: Nó làm những dấu lạ lớn[a], thậm chí khiến lửa từ trời giáng xuống đất trước mắt mọi người.[b]
  to: Nó làm những dấu lạ lớn[a], đến nỗi nó còn khiến lửa từ trời giáng xuống đất trước mắt mọi người.[b]
  rationale: Bản sửa chỉ làm sáng rõ quan hệ cú pháp của mệnh đề ἵνα καὶ và chỉnh chú thích từ vựng cho khớp đầy đủ với cụm σημεῖα μεγάλα. Các lựa chọn then chốt—“nó,” “dấu lạ,” “lửa,” “từ trời,” và “giáng xuống đất”—được giữ nguyên.
