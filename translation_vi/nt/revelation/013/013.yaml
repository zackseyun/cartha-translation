id: REV.13.13
reference: Revelation 13:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: vi
  text: Nó làm những dấu lạ lớn[a], đến nỗi nó còn khiến lửa từ trời giáng xuống đất trước mắt mọi người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những phép lạ lớn” hay “những điều kỳ diệu lớn”; Hy Lạp: “những dấu hiệu lớn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “trước mặt người ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: làm
  rationale: Khi đi với σημεῖα, “làm những dấu lạ” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt và vẫn giữ ý thực hiện các hành động mang tính dấu hiệu.
- source_word: σημεῖα μεγάλα
  choice: những dấu lạ lớn
  rationale: “Dấu lạ” giữ được sắc thái các hiện tượng phi thường có ý nghĩa biểu trưng và có thể dùng để lừa dối trong văn mạch Khải Huyền; “lớn” phản ánh trực tiếp μεγάλα.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: thậm chí khiến lửa
  rationale: 'Cách dịch này diễn đạt tự nhiên tác động gây ra trong mệnh đề ἵνα và giữ καὶ với nghĩa nhấn mạnh: đây là một dấu lạ đặc biệt nổi bật.'
- source_word: πῦρ
  choice: lửa
  rationale: Dịch theo nghĩa trực tiếp, phù hợp văn mạch và âm hưởng các trình thuật tiên tri về lửa từ trời.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: “Trời” phù hợp văn phong khải huyền và bảo toàn khả năng chỉ nguồn gốc thiên giới, thay vì giới hạn nghĩa vào bầu trời vật lý.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: giáng xuống đất
  rationale: “Giáng xuống” vừa tự nhiên vừa trang trọng, diễn tả rõ chuyển động từ trời xuống đất; “xuống đất” phản ánh εἰς τὴν γῆν.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: trước mắt mọi người
  rationale: Diễn đạt rõ tính công khai, có thể quan sát được của hành động; “mọi người” dùng theo nghĩa chung về con người, không giới hạn ở nam giới.
theological_decisions:
- issue: Bản chất của việc làm dấu lạ
  choice: Mô tả các dấu lạ như những hiện tượng được thực hiện công khai mà không xác định cơ chế là siêu nhiên hay ảo thuật.
  alternative: Dịch là “phép lạ” để hàm ý chắc chắn có quyền năng siêu nhiên, hoặc dùng từ ngữ coi đó chỉ là trò đánh lừa.
  rationale: Câu này khẳng định nó làm những dấu lạ và khiến lửa từ trời giáng xuống trước mắt người ta, nhưng không giải thích bản chất siêu hình hay cơ chế của hiện tượng. Bản dịch vì thế giữ nguyên sự căng thẳng của văn bản.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng đại từ “nó” theo mạch nói về con thú, không nhân cách hóa quá mức. “Dấu lạ” bảo toàn sắc thái Khải Huyền; “giáng xuống” tạo âm hưởng trang trọng thích hợp mà vẫn thông dụng.
