id: REV.13.15
reference: Revelation 13:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: vi
  text: Nó được ban cho quyền ban hơi thở[a] cho hình tượng của con thú, để hình tượng của con thú thậm chí có thể nói được và khiến[b] tất cả những ai không thờ lạy hình tượng của con thú đều bị giết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ban linh” hoặc “ban sự sống” cho hình tượng của con thú.
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “và làm cho tất cả những ai không thờ lạy hình tượng của con thú đều bị giết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: Nó được ban khả năng
  rationale: Giữ thể bị động và không xác định chủ thể ban, đồng thời diễn đạt tự nhiên trong tiếng Việt. Đại từ “nó” chỉ nhân vật con thú thứ hai trong ngữ cảnh mà không thêm một danh xưng giải thích vào câu.
- source_word: δοῦναι πνεῦμα
  choice: truyền hơi thở
  rationale: πνεῦμα có thể chỉ hơi thở, thần khí hoặc sự sống. “Hơi thở” phù hợp với việc hình tượng được làm cho nói, đồng thời không khẳng định rằng nó thật sự có sự sống hay có một thần linh ngự vào.
- source_word: εἰκών
  choice: hình tượng
  rationale: Diễn đạt rộng nghĩa của εἰκών trong bối cảnh thờ lạy, không thu hẹp hình thức vật chất thành “pho tượng”.
- source_word: θηρίον
  choice: con thú
  rationale: Thuật ngữ khải huyền quen thuộc và sát nghĩa, không tăng sắc thái diễn giải như “quái vật”.
- source_word: ἵνα καὶ λαλήσῃ
  choice: để ... thậm chí có thể nói được
  rationale: Diễn đạt mục đích hoặc kết quả của ἵνα với động từ giả định; “thậm chí” nêu bật điều đáng kinh ngạc là hình tượng nói được.
- source_word: ποιήσῃ ἵνα
  choice: và khiến
  rationale: Chuyển cấu trúc gây khiến trong tiếng Hy Lạp sang cách nói tiếng Việt tự nhiên mà vẫn giữ lực tác động của ποιέω.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: tất cả những ai không thờ lạy
  rationale: Thể hiện tự nhiên cấu trúc quan hệ bất định và phạm vi bao quát của ὅσοι.
- source_word: προσκυνήσωσιν
  choice: thờ lạy
  rationale: Trong sách Khải Huyền, từ này mang ý nghĩa tôn giáo rõ rệt khi đối tượng là con thú và hình tượng của nó.
- source_word: ἀποκτανθῶσιν
  choice: đều bị giết
  rationale: Giữ thể bị động và diễn đạt rõ ràng, hiện đại; “đều” liên kết tự nhiên với “tất cả những ai”.
theological_decisions:
- issue: Ý nghĩa của πνεῦμα khi hình tượng con thú được làm cho hoạt động
  choice: hơi thở
  alternative: thần khí; sự sống
  rationale: “Hơi thở” giữ được hình ảnh cụ thể liên quan đến khả năng nói và âm hưởng mô phỏng việc ban sự sống, nhưng không quyết đoán rằng hình tượng nhận được sự sống thật hay một thần linh.
- issue: Chủ thể ban trong thể bị động ἐδόθη
  choice: Không nêu chủ thể ban
  alternative: Nêu Đức Chúa Trời hoặc Sa-tan là chủ thể
  rationale: Bản Hy Lạp không nói rõ ai ban khả năng ấy; bản dịch giữ nguyên sự không xác định thay vì giải quyết một vấn đề thần học mà câu văn để ngỏ.
- issue: Chủ thể gây ra việc giết những người không thờ lạy
  choice: Giữ hình tượng của con thú làm chủ thể ngữ pháp gần nhất của “khiến”
  alternative: Hiểu con thú thứ hai là chủ thể tiếp tục của hành động gây khiến
  rationale: Cú pháp Hy Lạp có thể được đọc theo mạch trong đó hình tượng vừa nói vừa gây ra việc giết. Bản dịch không thêm tác nhân trực tiếp thực hiện hành vi giết.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “hình tượng” thay vì “pho tượng” để giữ phạm vi nghĩa rộng; dùng “thờ lạy” để phản ánh sắc thái tôn giáo trong văn cảnh. Cấu trúc bị động được duy trì ở những chỗ thần học và tu từ quan trọng.
