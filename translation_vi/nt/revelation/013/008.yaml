id: REV.13.8
reference: Revelation 13:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: vi
  text: Tất cả những người sống trên đất sẽ thờ lạy con thú ấy—mọi người mà tên không được ghi trong sách sự sống của Chiên Con, Đấng đã bị giết từ buổi sáng thế.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi người mà tên không được ghi từ buổi sáng thế trong sách sự sống của Chiên Con, Đấng đã bị giết.” Trong tiếng Hy Lạp, cụm “từ buổi sáng thế” có thể gắn với “Đấng đã bị giết” hoặc với “không được ghi”.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: sẽ thờ lạy
  rationale: Trong Khải Huyền, động từ này thường chỉ hành vi tôn thờ mang tính tôn giáo; “thờ lạy” vừa tự nhiên vừa giữ được sắc thái cúi mình tôn kính.
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: những người sống trên đất
  rationale: Cách diễn đạt rõ ràng trong tiếng Việt hiện đại và vẫn duy trì cụm từ lặp lại của Khải Huyền về cư dân trên đất.
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: mọi người có tên không được ghi
  rationale: Chuyển cấu trúc sở hữu số ít của tiếng Hy Lạp sang cách nói tự nhiên trong tiếng Việt, đồng thời giữ ý về danh tính riêng của từng người và trạng thái không có tên trong sách.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: sách sự sống
  rationale: Đây là cách gọi quen thuộc, dễ hiểu và bảo toàn hình ảnh khải huyền.
- source_word: τοῦ ἀρνίου
  choice: của Chiên Con
  rationale: Viết hoa để thể hiện đây là tước hiệu chỉ về Đấng Christ, đồng thời giữ hình ảnh hiến tế và Đấng Mê-si-a trong nguyên văn.
- source_word: τοῦ ἐσφαγμένου
  choice: Đấng đã bị giết
  rationale: Diễn đạt trang trọng và dễ hiểu; thể bị động cùng thì hoàn thành của phân từ cho thấy biến cố giết đã xảy ra và kết quả vẫn còn, dù tiếng Việt không mã hóa toàn bộ thể của tiếng Hy Lạp.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: từ khi đặt nền thế gian
  rationale: Giữ sát hình ảnh “đặt nền” của nguyên văn và chức năng chỉ thời gian của ἀπό, đồng thời là tiếng Việt trang trọng, dễ hiểu.
theological_decisions:
- issue: Quan hệ cú pháp của cụm “từ khi đặt nền thế gian”
  choice: Trong chính văn, gắn với “Đấng đã bị giết”
  alternative: 'Gắn với “không được ghi”: “mọi người có tên không được ghi từ khi đặt nền thế gian trong sách sự sống của Chiên Con đã bị giết”'
  rationale: Trật tự từ Hy Lạp cho phép và khá tự nhiên khi nối cụm thời gian với phân từ đứng ngay trước là “đã bị giết”. Tuy nhiên, Khải Huyền 17:8 tạo cơ sở mạnh cho cách nối cụm ấy với việc ghi tên. Vì nguyên văn thật sự có thể được phân tích theo cả hai cách, chính văn giữ liên hệ gần nhất còn chú thích bảo toàn cách hiểu kia.
- issue: Đại từ chỉ con thú trong αὐτόν
  choice: nó
  alternative: hắn
  rationale: Tiền ngữ là “con thú”; “nó” giữ sự quy chiếu theo hình tượng con vật và không biến nhân vật này thành một con người cụ thể hơn mức nguyên văn cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dấu gạch ngang làm rõ rằng mệnh đề tiếp theo xác định những người sẽ thờ lạy con thú. Giữ thuật ngữ khải huyền quen thuộc “sách sự sống” và tước hiệu “Chiên Con”, đồng thời dùng chú thích để bảo toàn sự mơ hồ cú pháp của nguyên văn.
