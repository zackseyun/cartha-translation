id: REV.13.4
reference: Revelation 13:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: vi
  text: 'Họ thờ lạy con rồng vì nó đã ban quyền cho con thú, và họ thờ lạy con thú, rồi nói rằng: “Ai sánh được với con thú?[a] Và ai có thể giao chiến với nó?”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ai giống như con thú?”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Ai có thể gây chiến chống lại nó?”'
    reason: lexical_alternative
  - marker: c
    text: Lời tung hô này có lẽ gợi lại cách diễn đạt trong Cựu Ước về sự vô song của Đức Chúa Trời (chẳng hạn Xuất Ai Cập 15:11; Thi Thiên 35:10), nhưng ở đây lại được áp dụng một cách phạm thượng cho con thú.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: thờ lạy
  rationale: Trong sách Khải Huyền, động từ này thường chỉ sự tôn thờ mang tính tôn giáo; “thờ lạy” diễn đạt rõ sắc thái thờ thần tượng trong ngữ cảnh.
- source_word: τῷ δράκοντι
  choice: con rồng
  rationale: Cách dịch trực tiếp, quen thuộc của hình tượng δράκων trong văn chương khải huyền, không diễn giải biểu tượng ngay trong câu.
- source_word: ὅτι ἔδωκεν
  choice: vì nó đã ban
  rationale: ὅτι mang nghĩa nguyên nhân; “đã ban” cho thấy việc trao quyền là căn nguyên của sự thờ lạy mà không cần áp đặt một quan hệ thời gian quá chi tiết.
- source_word: τὴν ἐξουσίαν
  choice: quyền
  rationale: ἐξουσία ở đây là quyền cai trị hoặc thẩm quyền được trao; “quyền” tự nhiên và chính xác trong tiếng Việt.
- source_word: τῷ θηρίῳ
  choice: con thú
  rationale: “Con thú” giữ nguyên hình tượng khải huyền của θηρίον và phù hợp cách gọi tự nhiên trong tiếng Việt.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Ai sánh được với con thú?
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ sức mạnh tu từ và tiếng vọng của công thức Kinh Thánh về sự vô song.
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: giao chiến với nó
  rationale: “Giao chiến” giữ sắc thái quân sự mạnh của πολεμέω; “với nó” bảo tồn cấu trúc nguồn và không quyết định quá mức rằng con thú phải được nhân cách hóa.
theological_decisions:
- issue: Đại từ dùng cho con thú
  choice: Dùng “nó”
  alternative: Dùng “hắn” hoặc lược bỏ đại từ bằng cách lặp lại “con thú”
  rationale: Danh từ θηρίον và đại từ quy chiếu trong tiếng Hy Lạp ở giống trung; “nó” theo sát cách gọi sinh vật này và tránh đưa thêm quyết định nhân cách hóa, dù con thú hành động như một tác nhân có ý chí.
- issue: Tiếng vọng của ngôn ngữ nói về sự vô song của Đức Chúa Trời
  choice: Giữ câu hỏi tu từ “Ai sánh được với con thú?” và giải thích bằng chú thích
  alternative: Mở rộng ngay trong chính văn để nói rõ đây là lời nhại báng bổ
  rationale: Chính văn cần giữ nguyên sự căng thẳng và tiếng vọng liên văn bản thay vì diễn giải ý nghĩa thần học ngay trong câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Lặp lại “thờ lạy” và “con thú” để bảo tồn nhịp điệu cùng sự nhấn mạnh của nguyên văn; dùng “giao chiến” thay cho cách nói cổ hoặc quá khẩu ngữ.
