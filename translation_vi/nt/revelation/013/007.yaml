id: REV.13.7
reference: Revelation 13:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: vi
  text: Nó được phép gây chiến chống lại các thánh đồ[a] và thắng họ[b]; nó cũng được ban thẩm quyền trên mọi bộ tộc, dân, ngôn ngữ[c] và quốc gia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “gây chiến với các thánh đồ”; trong thành ngữ này, “với” mang nghĩa đối địch, tức là “chống lại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đánh bại họ” hoặc “thắng được họ.”'
    reason: lexical_alternative
  - marker: c
    text: Dịch sát là “lưỡi”; ở đây từ này có nghĩa là “ngôn ngữ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ ποιῆσαι πόλεμον
  choice: nó được ban quyền gây chiến
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt, giữ thể bị động và không xác định ai là Đấng ban. “Gây chiến” chuyển tải thành ngữ ποιῆσαι πόλεμον; “quyền” ở đây diễn đạt điều được phép làm, còn ἐξουσία ở vế sau được phân biệt bằng “thẩm quyền”.
- source_word: μετὰ τῶν ἁγίων
  choice: chống lại các thánh đồ
  rationale: Trong thành ngữ chiến tranh, μετά mang ý đối địch. “Các thánh đồ” là cách gọi ngắn gọn, quen thuộc đối với những người thánh thuộc về Đức Chúa Trời trong ngữ cảnh này.
- source_word: νικῆσαι αὐτούς
  choice: thắng họ
  rationale: “Thắng” giữ được mô-típ νικάω xuyên suốt sách Khải Huyền và không giải thích quá mức bản chất hay thời hạn của chiến thắng này.
- source_word: ἐξουσία
  choice: thẩm quyền
  rationale: “Thẩm quyền” nhấn mạnh quyền cai quản được trao, thay vì chỉ sức mạnh thuần túy, đồng thời phù hợp với thể bị động “được ban”.
- source_word: φυλή
  choice: bộ tộc
  rationale: Tương đương tự nhiên cho một cộng đồng có quan hệ huyết tộc trong công thức liệt kê này.
- source_word: λαός
  choice: dân
  rationale: Giữ sự phân biệt với “bộ tộc” và “quốc gia,” đồng thời phản ánh danh từ tập hợp λαός.
- source_word: γλῶσσα
  choice: ngôn ngữ
  rationale: Trong danh sách các cộng đồng nhân loại, γλῶσσα chỉ ngôn ngữ; “ngôn ngữ” rõ nghĩa hơn cách dịch sát hình thức là “lưỡi”.
- source_word: ἔθνος
  choice: quốc gia
  rationale: Là cách dịch hiện đại, dễ hiểu trong công thức bốn thành phần, không tự ý thu hẹp nghĩa thành dân ngoại.
theological_decisions:
- issue: Thể bị động không nêu chủ thể trong hai lần dùng ἐδόθη
  choice: Giữ cách nói bị động “được ban” và không nêu Đấng ban.
  alternative: Dịch “Đức Chúa Trời cho phép nó” hoặc chuyển sang chủ động với một chủ thể được suy đoán.
  rationale: Nguyên văn không nêu chủ thể ban quyền. Bản dịch vì thế giữ nguyên sự căng thẳng giữa quyền tể trị của Đức Chúa Trời và hoạt động được dung cho của điều ác, thay vì giải quyết ngầm bằng cách thêm chủ thể.
- issue: Phạm vi của chiến thắng đối với các thánh đồ
  choice: Dịch đơn giản là “thắng họ.”
  alternative: Giải thích là chỉ giết hại, khuất phục thuộc thể hoặc chiến thắng tạm thời.
  rationale: Câu này không tự xác định phương diện hay thời hạn của việc thắng; bản dịch giữ nguyên sự súc tích và căng thẳng thần học của νικάω.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng dấu chấm phẩy để làm rõ hai mệnh đề song song có cùng thể bị động. Đại từ “nó” tiếp nối đối tượng đã được nêu trong ngữ cảnh trước mà không thêm danh xưng không có trong chính câu này.
