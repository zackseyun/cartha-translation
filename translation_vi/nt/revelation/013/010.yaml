id: REV.13.10
reference: Revelation 13:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: vi
  text: Nếu ai phải chịu cảnh tù đày, người ấy sẽ đi vào cảnh tù đày[a]; nếu ai phải bị giết bằng gươm, người ấy ắt bị giết bằng gươm[b]. Đây là sự kiên trì và đức tin[c] của các thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu ai đi vào cảnh tù đày, người ấy sẽ đi vào cảnh tù đày.” Câu này cũng có thể được hiểu là lời tuyên bố về số phận đã được định, chứ không phải một mệnh lệnh.'
    reason: alternative_reading
  - marker: b
    text: 'Một số thủ bản hoặc dị bản diễn đạt mệnh đề này theo nghĩa: “Nếu ai dùng gươm giết người, kẻ ấy phải bị giết bằng gươm.” Bản dịch chính theo bản văn được chọn ở đây, nhưng dị bản này có ảnh hưởng đáng kể đến cách hiểu câu.'
    reason: textual_variant
  - marker: c
    text: 'Cũng có thể dịch: “lòng trung tín của các thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Nếu ai
  rationale: Diễn đạt tự nhiên một điều kiện bất định, có tính khái quát, không giới hạn đối tượng.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: phải chịu cảnh tù đày ... sẽ đi vào cảnh tù đày
  rationale: Giữ lại sự lặp có chủ ý của αἰχμαλωσία và diễn đạt rõ động từ ὑπάγει; chữ “phải” truyền đạt sắc thái số phận đã được định mà không biến câu thành mệnh lệnh.
- source_word: αἰχμαλωσία
  choice: cảnh tù đày
  rationale: Truyền đạt tình trạng bị bắt giữ hoặc đưa đi làm tù nhân, đồng thời giữ sắc thái phán xét trang trọng; các khả năng khác được ghi nhận trong chú thích.
- source_word: ἐν μαχαίρῃ
  choice: bằng gươm
  rationale: Diễn đạt phương tiện một cách tự nhiên trong tiếng Việt và giữ hình ảnh phán xét của văn chương Kinh Thánh.
- source_word: ἀποκτανθῆναι
  choice: bị giết
  rationale: Giữ thể bị động của động từ Hy Lạp bằng lối diễn đạt rõ ràng, hiện đại.
- source_word: αὐτὸν ... ἀποκτανθῆναι
  choice: người ấy ắt bị giết
  rationale: Chuyển cấu trúc Hy Lạp cô đọng và gập ghềnh thành câu tiếng Việt mạch lạc, đồng thời giữ sắc thái tất yếu bằng “ắt”.
- source_word: ὧδέ ἐστιν
  choice: Đây là
  rationale: Cách nói tự nhiên, trực tiếp, có tác dụng hướng sự chú ý đến phẩm chất được nêu ngay sau đó.
- source_word: ὑπομονή
  choice: lòng kiên trì
  rationale: Diễn tả sự bền đỗ, đứng vững qua đau khổ mà không thêm ý nghĩa ngoài văn bản.
- source_word: πίστις
  choice: đức tin
  rationale: Đây là nghĩa thông dụng và phù hợp trong văn cảnh; sắc thái “lòng trung tín” vẫn có thể có nên được bảo tồn trong chú thích.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: Cách gọi ngắn gọn và quen thuộc dành cho dân thánh của Đức Chúa Trời trong sách Khải Huyền.
theological_decisions:
- issue: Hai mệnh đề đầu mô tả số phận tất yếu hay đưa ra mệnh lệnh
  choice: Mô tả số phận hoặc sự phán định tất yếu
  alternative: Mệnh lệnh không chống cự bằng bạo lực; hoặc nguyên tắc báo ứng rằng kẻ bắt bớ và giết người sẽ chịu cùng số phận
  rationale: Theo bản văn SBLGNT được cung cấp, cấu trúc cô đọng phù hợp nhất với một lời tuyên bố mang tính châm ngôn về điều đã được định. Bản dịch không biến câu này thành một giáo huấn đầy đủ về bất bạo động hay báo ứng.
- issue: Ý nghĩa của πίστις trong mệnh đề kết
  choice: đức tin
  alternative: lòng trung tín
  rationale: “Đức tin” giữ nghĩa chính quen thuộc, nhưng trong bối cảnh các thánh đồ bền đỗ dưới áp bức, “lòng trung tín” là một sắc thái hợp lý và được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp câu cân xứng và sắc thái châm ngôn của nguyên văn; tránh diễn giải câu thành một lập trường giáo phái về bất bạo động, báo ứng hoặc tiền định.
