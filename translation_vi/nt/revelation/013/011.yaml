id: REV.13.11
reference: Revelation 13:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: vi
  text: Rồi tôi thấy một con thú khác trồi lên từ đất[a]. Nó có hai sừng giống như chiên con và nói như rồng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trồi lên từ đất liền.” Từ Hy Lạp γῆ có thể có nghĩa là “đất” hoặc “đất liền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: một con thú khác
  rationale: “Con thú” giữ được thuật ngữ khải huyền quen thuộc dành cho quyền lực thù nghịch; “khác” diễn đạt trực tiếp ἄλλο.
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: từ đất đi lên
  rationale: Diễn đạt tự nhiên hình ảnh con thú đang trồi lên; γῆ có thể chỉ “đất” hoặc “đất liền”, nên ghi nhận nghĩa thay thế trong chú thích.
- source_word: κέρατα δύο ὅμοια ἀρνίῳ
  choice: hai sừng giống như sừng của một con chiên con
  rationale: Cách diễn đạt này làm rõ về mặt ngữ pháp rằng chính hai chiếc sừng được so sánh, đồng thời giữ hình ảnh “chiên con” vốn quan trọng trong sách Khải Huyền.
- source_word: ἐλάλει ὡς δράκων
  choice: nhưng lại nói như một con rồng
  rationale: “Nói như” giữ nguyên phép so sánh, không đồng nhất con thú với con rồng. “Nhưng lại” truyền đạt sự tương phản nổi bật giữa vẻ giống chiên con và lời nói giống rồng, vốn được cấu trúc câu Hy Lạp đặt cạnh nhau.
theological_decisions:
- issue: ἀρνίον có thể gợi đến hình tượng Chiên Con trong Khải Huyền
  choice: một con chiên con
  alternative: một con cừu con
  rationale: “Chiên con” là cách nói trang trọng, dễ hiểu trong văn mạch Kinh Thánh và giữ được sự liên hệ với hình tượng Chiên Con mà không đồng nhất con thú với Chiên Con thật.
- issue: Nghĩa của γῆ
  choice: đất
  alternative: đất liền
  rationale: “Đất” giữ phạm vi nghĩa rộng và sự đối lập mang tính biểu tượng với con thú từ biển; chú thích bảo tồn khả năng hiểu là “đất liền” mà không thu hẹp nội dung chính.
- issue: Sự tương phản giữa diện mạo và lời nói
  choice: nhưng lại nói như một con rồng
  alternative: và nói như một con rồng
  rationale: καί về hình thức là “và”, nhưng trong ngữ cảnh có sự tương phản rõ giữa nét giống chiên con và tiếng nói giống rồng. “Nhưng lại” thể hiện quan hệ diễn ngôn này mà không giải thích thêm căn tính của con thú.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “con thú”, “chiên con” và “con rồng” để giữ hình tượng khải huyền; câu văn làm rõ đối tượng được so sánh mà không thêm cách giải nghĩa biểu tượng.
