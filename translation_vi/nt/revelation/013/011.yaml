  to: Rồi tôi thấy một con thú khác trồi lên từ đất[a]. Nó có hai sừng giống như chiên con và nói như rồng.
  rationale: Bản sửa loại bỏ liên từ đối lập có tính diễn giải, giữ phép nối đơn giản của καί, và dùng cách so sánh sát nguyên văn hơn. “Trồi lên từ đất” bảo toàn chuyển động đang diễn ra của phân từ ἀναβαῖνον, trong khi chú thích vẫn ghi nhận khả năng “đất liền” của γῆ.
