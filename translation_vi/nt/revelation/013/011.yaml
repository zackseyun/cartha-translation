  source_fidelity: 'Bản thảo truyền đạt đúng các yếu tố chính của câu Hy Lạp: một con thú khác, đi lên từ γῆ, có hai sừng giống chiên con, và nói như rồng. Tuy nhiên, từ “nhưng lại” thêm quan hệ đối nghịch mà nguyên văn chỉ nối hai mệnh đề bằng καί (“và”); sự tương phản có thể được người đọc nhận ra từ hình ảnh mà không cần được diễn giải trong bản dịch.'
