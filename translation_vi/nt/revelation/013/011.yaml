  - severity: low
    issue: “giống như sừng của một con chiên con”
    rationale: Cụm này làm rõ theo hướng nguyên văn không cần thiết rằng sừng được so với sừng của chiên con. Hy Lạp chỉ nói “hai sừng giống như chiên con”; tiếng Việt có thể giữ phép so sánh ấy mà vẫn tự nhiên.
