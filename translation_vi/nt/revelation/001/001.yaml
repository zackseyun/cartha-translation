id: REV.1.1
reference: Revelation 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: vi
  text: Sự mặc khải của Đức Giê-su Ki-tô[a], mà Đức Chúa Trời đã ban cho Ngài để chỉ cho các đầy tớ của Ngài biết những điều phải sớm xảy ra[b]. Đức Giê-su Ki-tô đã truyền đạt điều ấy[c] bằng cách sai thiên sứ của Ngài đến với Giăng, là đầy tớ của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sự mặc khải từ Đức Giê-su Ki-tô” hoặc “Sự mặc khải về Đức Giê-su Ki-tô.” Sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo nhiều cách.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “nhanh chóng.” Cụm từ này có thể nói các việc ấy sắp xảy ra, hoặc chúng sẽ diễn ra nhanh chóng khi bắt đầu.'
    reason: lexical_alternative
  - marker: c
    text: Động từ Hy Lạp cũng có thể dịch là “báo hiệu” hoặc “truyền đạt bằng dấu hiệu,” phù hợp với tính biểu tượng của sách này.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: sự mặc khải
  rationale: Diễn đạt hành động vén mở, bày tỏ điều vốn bị che kín; đây cũng là thuật ngữ tiếng Việt quen thuộc và trang trọng trong văn cảnh Kinh Thánh.
- source_word: Ἰησοῦ Χριστοῦ
  choice: của Đức Giê-su Ki-tô
  rationale: Giữ cấu trúc sở hữu rộng của sở hữu cách Hy Lạp, không buộc câu chỉ có nghĩa là mặc khải 'từ' hay 'về' Đức Giê-su Ki-tô. 'Ki-tô' là cách gọi danh hiệu quen thuộc trong tiếng Việt.
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: mà Đức Chúa Trời đã ban cho Ngài
  rationale: Giữ nguyên mệnh đề quan hệ và sự phân biệt trong câu giữa Đức Chúa Trời với Đức Giê-su Ki-tô; 'Ngài' chỉ Đức Giê-su Ki-tô.
- source_word: δεῖξαι
  choice: để chỉ cho ... biết
  rationale: Thể hiện mục đích của việc ban mặc khải và chuyển nghĩa 'cho thấy' sang tiếng Việt tự nhiên trong văn cảnh truyền đạt khải tượng.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: các đầy tớ Ngài
  rationale: '''Đầy tớ'' vừa tự nhiên, trang trọng trong tiếng Việt vừa biểu thị quan hệ thuộc về và phục vụ chủ; tránh sắc thái xã hội hiện đại quá lấn át của ''nô lệ''.'
- source_word: ἃ δεῖ γενέσθαι
  choice: những điều phải ... xảy ra
  rationale: Giữ ý nghĩa về tính tất yếu của các biến cố mà không thêm lời giải thích thần học.
- source_word: ἐν τάχει
  choice: sớm
  rationale: Trong ngữ cảnh này, cách hiểu về sự gần kề theo thời gian là tự nhiên nhất; chú thích giữ lại khả năng hiểu là diễn ra nhanh chóng.
- source_word: ἐσήμανεν
  choice: đã truyền đạt điều ấy
  rationale: Diễn đạt rõ hành động làm cho biết, đồng thời chú thích nêu sắc thái báo hiệu hoặc truyền đạt bằng dấu hiệu của động từ Hy Lạp.
- source_word: ἀποστείλας
  choice: bằng cách sai
  rationale: Thể hiện phân từ như phương tiện mà việc truyền đạt được thực hiện, bằng tiếng Việt tự nhiên.
- source_word: διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: thiên sứ mình
  rationale: Trong kết cấu 'sai ... đến', trung gian được diễn đạt tự nhiên bằng bổ ngữ trực tiếp; 'thiên sứ' là thuật ngữ chuẩn cho ἄγγελος trong ngữ cảnh này.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: đến với Giăng, đầy tớ Ngài
  rationale: Nêu rõ Giăng là người nhận sứ điệp và duy trì cách dịch nhất quán của δοῦλος.
theological_decisions:
- issue: Sở hữu cách trong Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: Dịch là 'Sự mặc khải của Đức Giê-su Ki-tô', không xác định dứt khoát đó chủ yếu là mặc khải từ Ngài hay về Ngài.
  alternative: Sự mặc khải từ Đức Giê-su Ki-tô; Sự mặc khải về Đức Giê-su Ki-tô.
  rationale: Sở hữu cách Hy Lạp cho phép nhiều quan hệ nghĩa; mệnh đề tiếp theo nói Đức Chúa Trời ban mặc khải cho Đức Giê-su, nhưng không loại bỏ hoàn toàn sắc thái mặc khải nói về Ngài.
- issue: Cách dịch δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: '''Đầy tớ'' phù hợp văn phong Kinh Thánh tiếng Việt và vẫn nêu quan hệ thuộc về, phục vụ; chú thích không cần thiết vì câu không dựa vào sự phân biệt pháp lý giữa đầy tớ và nô lệ.'
- issue: Chủ thể của ἐσήμανεν
  choice: Giữ đại từ 'Ngài', theo chủ thể gần nhất là Đức Giê-su Ki-tô.
  alternative: Hiểu Đức Chúa Trời là chủ thể xuyên suốt của hành động truyền đạt.
  rationale: Cú pháp tự nhiên nhất nối αὐτῷ với Đức Giê-su và hiểu chủ thể ngầm của ἐσήμανεν là Đức Giê-su, nhưng bản dịch không thêm danh xưng để tránh giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Giê-su Ki-tô,” “Đức Chúa Trời,” “thiên sứ” và “Giăng” theo lối gọi Kinh Thánh tiếng Việt phổ biến. Mọi dấu chú thích [a]–[c] đều xuất hiện trong chính văn.
