id: REV.1.16
reference: Revelation 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: vi
  text: Ngài cầm bảy ngôi sao trong tay phải. Từ miệng Ngài phát ra một thanh gươm sắc bén, hai lưỡi[a], và diện mạo Ngài như mặt trời chiếu sáng với trọn sức mạnh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thanh gươm hai lưỡi sắc bén.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “chiếu sáng hết sức rực rỡ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: Ngài cầm
  rationale: Phân từ mô tả trạng thái trong khải tượng. Dùng động từ hữu hạn giúp câu tiếng Việt tự nhiên; “cầm” diễn đạt rõ việc các ngôi sao ở trong tay Ngài mà không làm mất nét mô tả liên tục.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: trong tay phải
  rationale: Giữ rõ danh từ χείρ (“tay”) có trong bản Hy Lạp và diễn đạt theo trật tự tự nhiên của tiếng Việt.
- source_word: ἀστέρας ἑπτά
  choice: bảy ngôi sao
  rationale: Cách dịch trực tiếp, tự nhiên trong tiếng Việt.
- source_word: ῥομφαία
  choice: thanh gươm
  rationale: ῥομφαία có thể chỉ một loại gươm lớn, nhưng “thanh gươm” rõ ràng và không đặc định quá mức loại vũ khí trong hình ảnh khải tượng.
- source_word: δίστομος ὀξεῖα
  choice: sắc bén có hai lưỡi
  rationale: 'Giữ cả hai ý riêng biệt của nguyên ngữ: gươm có hai lưỡi và sắc bén. Trật tự này tự nhiên trong tiếng Việt.'
- source_word: ἐκπορευομένη
  choice: phóng ra
  rationale: Diễn tả sinh động hướng chuyển động từ trong miệng ra ngoài, phù hợp hình ảnh khải tượng; không thêm lời giải thích biểu tượng.
- source_word: ἡ ὄψις αὐτοῦ
  choice: diện mạo Ngài
  rationale: ὄψις chỉ vẻ bề ngoài hay diện mạo nhìn thấy được, không nhất thiết chỉ riêng khuôn mặt. “Diện mạo” giữ được phạm vi nghĩa này với sắc thái trang trọng vừa phải.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: như mặt trời chiếu sáng
  rationale: Giữ nguyên phép so sánh và nét đang tỏa sáng của động từ hiện tại φαίνει.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: trong sức mạnh của nó
  rationale: Bám sát cấu trúc Hy Lạp và giữ hình ảnh sức mạnh hay cường độ của mặt trời; cách hiểu “hết mức rực rỡ” được nêu trong chú thích thay vì đưa thẳng vào chính văn.
theological_decisions:
- issue: Ý nghĩa của thanh gươm phóng ra từ miệng
  choice: Giữ nguyên hình ảnh khải tượng, không giải nghĩa thêm.
  alternative: Diễn giải thanh gươm là lời phán xét của Đấng Christ.
  rationale: Câu này trình bày biểu tượng nhưng chưa trực tiếp giải nghĩa. Việc đưa lời giải nghĩa vào chính văn sẽ thu hẹp sự căng thẳng và tính đa nghĩa vốn có của hình ảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo văn phong Kinh Thánh phổ thông; giữ hình ảnh khải tượng rõ ràng mà không thêm cách giải thích mang tính giáo phái.
