revisions:
- from: Ngài cầm bảy ngôi sao trong tay phải. Từ miệng Ngài phóng ra một thanh gươm sắc bén có hai lưỡi[a], và diện mạo Ngài như mặt trời chiếu sáng trong sức mạnh của nó[b].
  to: Ngài cầm bảy ngôi sao trong tay phải. Từ miệng Ngài phát ra một thanh gươm sắc bén, hai lưỡi[a], và diện mạo Ngài như mặt trời chiếu sáng với trọn sức mạnh[b].
  rationale: Sửa “phóng ra” thành “phát ra” để phản ánh ἐκπορευομένη mà không thêm sắc thái hành động mạnh; sửa thành ngữ chỉ cường độ mặt trời để tiếng Việt tự nhiên hơn, vẫn giữ nghĩa “trong/trọn sức mạnh của nó.” Dấu phẩy trong “sắc bén, hai lưỡi” giúp hai đặc tính của thanh gươm rõ ràng mà không thay đổi nghĩa.
  reviewer_model: gpt-5.6-terra
