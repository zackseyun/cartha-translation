revisions:
- from: Vậy, hãy viết lại những gì con đã thấy, những gì đang có, và những gì sắp xảy ra sau những điều này.[a]
  to: Vậy, con hãy viết những gì con đã thấy, những gì hiện có, và những gì sắp xảy ra sau những điều này.[a]
  rationale: Bản sửa chỉ loại bỏ sắc thái “viết lại” không có trong γράψον và điều chỉnh cách diễn đạt vế hiện tại cho tự nhiên hơn. Cấu trúc ba vế, sắc thái sắp xảy ra của μέλλει γίνεσθαι, cách xưng hô trong ngữ cảnh, và chú thích về phương án dịch đều được giữ nguyên.
