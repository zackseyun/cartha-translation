    issue: “Hãy viết lại” có thể bị hiểu là viết lại hoặc sửa lại điều đã viết.
    rationale: γράψον có nghĩa là “hãy viết/ghi chép”, không hàm ý lặp lại hay chỉnh sửa. Trong tiếng Việt hiện đại, từ “lại” tạo thêm sắc thái không có trong nguyên văn.
  - severity: low
    issue: “Những gì đang có” hơi gượng trong tiếng Việt hiện đại.
    rationale: “Những gì hiện có” diễn đạt tự nhiên hơn ἃ εἰσὶν, đồng thời vẫn để ngỏ nội hàm của “những điều đang là/hiện hữu”.
