source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: vi
  text: Vậy, con hãy viết những gì con đã thấy, những gì hiện có, và những gì sắp xảy ra sau những điều này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những gì sẽ xảy ra sau những điều này.” Trong một số văn cảnh, động từ Hy Lạp có thể gần với thì tương lai đơn thuần, dù thường mang ý nghĩa điều sắp xảy ra.'
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: hãy viết lại
  rationale: Động từ mệnh lệnh ngôi hai số ít truyền đạt trực tiếp lệnh ghi chép; “viết lại” ở đây mang nghĩa viết ra/ghi lại điều đã thấy, không phải sửa đổi văn bản.
- source_word: οὖν
  choice: vậy
  rationale: Giữ chức năng suy luận và tiếp nối từ sự ủy nhiệm trong khải tượng trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἃ εἶδες
  choice: những gì con đã thấy
  rationale: Giữ nội dung khải tượng đã được thấy và mối liên hệ của nó với mệnh lệnh hiện tại.
- source_word: ἃ εἰσὶν
  choice: những gì đang có
  rationale: Diễn đạt các thực tại hiện tại mà không thêm cách giải thích chúng là sự kiện, tình trạng hay một giai đoạn riêng biệt.
- source_word: μέλλει γίνεσθαι
  choice: những gì sắp xảy ra
  rationale: Giữ sắc thái sắp diễn ra thường có trong μέλλω kết hợp với động từ nguyên mẫu, thay vì làm phẳng thành tương lai đơn thuần.
- source_word: μετὰ ταῦτα
  choice: sau những điều này
  rationale: Phản ánh rõ nghĩa thời gian và dạng số nhiều của đại từ chỉ định, đồng thời giữ cách nói lặp lại đặc trưng trong sách Khải Huyền.
theological_decisions:
- issue: Sắc thái thời gian của μέλλει trong văn cảnh khải huyền
  choice: “sắp xảy ra” để giữ sắc thái cận kề
  alternative: “sẽ xảy ra” như một tương lai đơn thuần
  rationale: Cấu trúc Hy Lạp tự nhiên có thể hàm ý điều sắp diễn ra. Giữ sắc thái ấy bảo tồn sức căng thời gian của câu mà không dùng bản dịch để quyết định một hệ thống cánh chung.
- issue: Cấu trúc ba vế của câu
  choice: 'Giữ ba vế song song: điều đã thấy, điều đang có, và điều sắp xảy ra'
  alternative: Hiểu vế đầu như tiêu đề bao trùm hai vế sau
  rationale: Ngữ pháp có thể được bàn luận theo nhiều cách, nhưng bản dịch trực tiếp ba mệnh đề quan hệ bảo tồn cấu trúc bề mặt và không áp đặt một sơ đồ diễn giải.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng “con” theo ngữ cảnh Đấng Christ phán trực tiếp với Giăng; cấu trúc lặp “những gì” giữ nhịp song song của nguyên văn. Dấu chú thích [a] được đặt sau mệnh đề có phương án dịch khác.
