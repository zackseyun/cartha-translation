id: REV.1.17
reference: Revelation 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: vi
  text: 'Khi thấy Ngài, tôi ngã xuống dưới chân Ngài, như người chết[a]. Ngài đặt tay phải lên tôi và nói: “Đừng sợ[b]. Ta là Đấng Đầu Tiên và Đấng Cuối Cùng,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như thể đã chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đừng sợ hãi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Khi
  rationale: Diễn đạt tự nhiên mệnh đề thời gian trong tiếng Việt; mạch nối của καί vẫn được duy trì qua sự tiếp nối trực tiếp với câu trước mà không cần thêm “và” một cách gượng ép.
- source_word: εἶδον αὐτόν
  choice: thấy Ngài
  rationale: “Thấy” diễn đạt trực tiếp hành động tri giác của ὁράω. “Ngài” là đại từ tôn kính, phù hợp với nhân vật đang phán trong ngữ cảnh mà không thêm danh xưng không có trong nguyên văn.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: tôi ngã xuống dưới chân Ngài
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện việc Giăng đổ xuống ngay trước chân nhân vật; “ngã xuống” truyền đạt rõ động tác của ἔπεσα.
- source_word: ὡς νεκρός
  choice: như người chết
  rationale: Giữ nguyên phép so sánh minh nhiên của ὡς và không diễn giải rằng Giăng thực sự đã chết.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: Ngài đặt tay phải lên tôi
  rationale: “Đặt ... lên” tương ứng tự nhiên với τίθημι ... ἐπί; “tay phải” được giữ rõ vì nguyên văn nêu cụ thể và hình ảnh này có ý nghĩa trong văn cảnh.
- source_word: λέγων
  choice: và nói
  rationale: Chuyển phân từ đồng thời sang động từ nối bằng “và” để câu tiếng Việt tự nhiên, đồng thời giữ đúng quan hệ giữa cử chỉ và lời phán.
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định ngắn gọn, trực tiếp và hiện đại, truyền đạt đúng φοβέομαι.
- source_word: ἐγώ εἰμι
  choice: Ta là
  rationale: “Ta” giữ sắc thái tự xưng trang trọng và có thẩm quyền trong lời của Đấng được khải thị; “là” dẫn trực tiếp vào danh hiệu theo cấu trúc nguyên văn.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Đấng Đầu Tiên và Đấng Cuối Cùng
  rationale: Hai tính từ có mạo từ được dùng như danh hiệu. Thêm “Đấng” là cách danh hóa tự nhiên, trang trọng trong tiếng Việt; viết hoa biểu thị chức năng danh hiệu mà không thay đổi nội dung từ vựng.
theological_decisions:
- issue: Tính chất danh hiệu của ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: Đấng Đầu Tiên và Đấng Cuối Cùng
  alternative: đầu tiên và cuối cùng
  rationale: Cấu trúc có mạo từ cho thấy hai từ này hoạt động như danh hiệu tự xưng. Cách dịch bằng “Đấng” bảo toàn lực danh hiệu và sự trang trọng, đồng thời không thêm một kết luận thần học vượt quá lời Hy Lạp.
- issue: Sắc thái của ἐγώ εἰμι
  choice: Ta là
  alternative: Chính Ta là
  rationale: Nguyên văn có đại từ ἐγώ minh nhiên, nhưng tiếng Việt “Ta là” đã thể hiện rõ chủ thể và phù hợp với lời tự giới thiệu trang trọng. Không thêm “chính” để tránh nhấn mạnh quá mức điều văn bản có thể hàm ý.
- issue: Tình trạng của Giăng trong ὡς νεκρός
  choice: như người chết
  alternative: như thể đã chết
  rationale: Giữ đây là một phép so sánh, không khẳng định Giăng thực sự chết hay giải thích nguyên nhân thể lý hoặc thuộc linh của việc ông ngã xuống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta” trong lời tự xưng để phù hợp với lối xưng hô tôn kính tự nhiên của tiếng Việt. Câu kết giữ dấu phẩy vì lời phán tiếp tục sang câu kế tiếp.
