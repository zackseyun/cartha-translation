  source_fidelity: 'Bản dịch truyền đạt trung thành các yếu tố chính của câu Hy Lạp: mệnh đề thời gian, việc người kể ngã xuống tại chân nhân vật, phép so sánh «như người chết», hành động đặt tay phải lên người kể, lời trấn an, và danh hiệu «Đấng Đầu Tiên và Đấng Cuối Cùng». «Ngã xuống dưới chân Ngài» là thành ngữ Việt tự nhiên tương ứng với tư thế được diễn tả bởi πρὸς τοὺς πόδας αὐτοῦ; không hàm ý sai rằng người kể ở theo nghĩa đen bên dưới bàn chân. Việc không dịch riêng καί đầu câu là chấp nhận được trong mạch tiếng Việt.'
