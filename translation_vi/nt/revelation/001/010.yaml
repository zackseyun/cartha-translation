id: REV.1.10
reference: Revelation 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: vi
  text: Vào ngày của Chúa[a], tôi ở trong Thánh Linh[b] và nghe một tiếng lớn phía sau lưng mình, như tiếng kèn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một cách hiểu khác, nhưng ít có khả năng hơn: “vào ngày Chúa”, tức ngày cánh chung của Chúa. Tiếng Hy Lạp ở đây dùng cụm κυριακῇ ἡμέρᾳ, nghĩa là “ngày thuộc về Chúa”, chứ không dùng cách diễn đạt thông thường hơn cho “ngày của Chúa” trong ý nghĩa cánh chung.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “trong linh”. Cụm từ này có thể chỉ việc ở dưới sự tác động tiên tri của Đức Thánh Linh; nguyên văn không nói rõ là “xuất thần”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: tôi ở
  rationale: Trong kết cấu ἐγενόμην ἐν πνεύματι, động từ diễn tả việc bước vào hoặc ở trong một trạng thái. Tiếng Việt tự nhiên dùng “tôi ở”; sắc thái khởi đầu vẫn có thể được hiểu từ ngữ cảnh mà không cần lối dịch nặng nề “tôi trở nên ở”.
- source_word: ἐν πνεύματι
  choice: ở trong Thánh Linh
  rationale: Công thức khải tượng trong sách Khải Huyền nhiều khả năng chỉ sự tác động tiên tri của Đức Thánh Linh. Cách dịch này giữ nguyên hình thức giới từ và không diễn giải quá mức thành “xuất thần”.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: vào ngày của Chúa
  rationale: Tính từ κυριακός có nghĩa là “thuộc về Chúa”. “Ngày của Chúa” diễn đạt tự nhiên trong tiếng Việt và không tự động đồng nhất cụm này với công thức cánh chung thường dùng cho “ngày Chúa”.
- source_word: ἤκουσα
  choice: nghe
  rationale: Động từ ở đây chỉ sự tri nhận bằng thính giác, nên “nghe” là cách tương đương trực tiếp và tự nhiên.
- source_word: ὀπίσω μου
  choice: phía sau mình
  rationale: Cụm từ mang nghĩa không gian; “phía sau mình” xác định tiếng phát ra từ sau lưng người kể.
- source_word: φωνὴν μεγάλην
  choice: một tiếng lớn
  rationale: φωνή có thể là tiếng hoặc giọng nói; μέγας trong ngữ cảnh thính giác chỉ âm lượng hoặc sức mạnh. “Một tiếng lớn” giữ được phần nào độ rộng nghĩa trước khi câu sau xác định nội dung lời nói.
- source_word: ὡς σάλπιγγος
  choice: như tiếng kèn
  rationale: Phép so sánh nói đến đặc tính âm thanh. Thêm “tiếng” là cần thiết để câu tiếng Việt tự nhiên, nhưng không thêm ý “hồi kèn” hay “tiếng kèn vang” vốn không được nói rõ.
theological_decisions:
- issue: ἐν πνεύματι chỉ Đức Thánh Linh hay tinh thần/trạng thái thuộc linh
  choice: ở trong Thánh Linh
  alternative: ở trong tâm linh; ở trong linh; xuất thần
  rationale: Ngữ cảnh khải tượng của sách Khải Huyền khiến cách hiểu về Đức Thánh Linh có khả năng cao nhất, nhưng nguyên văn không nói rõ “xuất thần”. Chú thích bảo lưu khả năng dịch không viết hoa.
- issue: κυριακῇ ἡμέρᾳ là ngày hằng tuần thuộc về Chúa hay ngày cánh chung của Chúa
  choice: ngày của Chúa
  alternative: ngày Chúa; ngày của Đức Chúa Trời trong thời kỳ cuối cùng
  rationale: Cách dịch phản ánh tính từ κυριακός, “thuộc về Chúa”, thay vì biến nó thành công thức cánh chung thường có cấu trúc Hy Lạp khác. Bản dịch không xác định thêm ngày ấy là ngày nào trong tuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Trật tự đưa cụm thời gian lên đầu phù hợp tiếng Việt. Dùng “mình” để quy chiếu tự nhiên về người kể; giữ dấu phẩy cuối câu vì câu 10 tiếp tục sang lời được nghe ở câu kế tiếp.
