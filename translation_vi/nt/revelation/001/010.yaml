    rationale: “Trong linh” tuy ít thông dụng hơn, bảo lưu sát hơn khả năng không viết hoa của danh từ Hy Lạp. Có thể giải thích ngay trong chú thích về khả năng tác động tiên tri của Đức Thánh Linh.
