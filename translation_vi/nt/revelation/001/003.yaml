  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu Hy Lạp: một người đọc (số ít), nhiều người nghe và gìn giữ, cùng lý do là thời điểm gần kề. Tuy nhiên, “các lời của lời tiên tri này” là lặp từ không tự nhiên trong tiếng Việt; cần diễn đạt lại mà vẫn giữ λόγοι là “lời” và τῆς προφητείας là “lời tiên tri”. “Thời điểm đã gần” cũng kém tự nhiên hơn cách nói trạng thái “đã gần kề”.'
  naturalness: Nên chỉnh câu để tránh sự lặp âm và cấu trúc gượng của “các lời của lời tiên tri”, đồng thời dùng “đã gần kề” cho ἐγγύς. “Phước cho” và “vâng giữ” phù hợp với văn phong Kinh Thánh trang trọng, hiện đại.
  terminology: Giữ “Phước cho”, “lời tiên tri”, và “vâng giữ”. “Người đọc thành tiếng” chấp nhận được để phản ánh bối cảnh một người đọc trước nhiều người nghe; chú thích cần nêu đây là một khả năng theo ngữ cảnh. Thêm chú thích cho “thời điểm” để bảo tồn lựa chọn “thời điểm đã định”.
