id: REV.1.3
reference: Revelation 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: vi
  text: Phước cho người đọc thành tiếng[a], và cho những người nghe những lời được nói trong lời tiên tri này và vâng giữ những điều được viết trong đó[b], vì thời điểm đã gần kề.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người đọc”; tiếng Hy Lạp, xét theo sự đối lập giữa một người đọc và nhiều người nghe, có lẽ chỉ người đọc công khai trước hội chúng; vì vậy dịch là “đọc thành tiếng”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì kỳ đã định đã gần kề”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Phước cho
  rationale: Công thức chúc phước tự nhiên, trang trọng trong tiếng Việt Kinh Thánh; diễn tả ân phước hơn là cảm xúc vui vẻ đơn thuần.
- source_word: ὁ ἀναγινώσκων
  choice: người đọc thành tiếng
  rationale: Dạng số ít đối lập với nhiều người nghe cho thấy nhiều khả năng đây là người đọc công khai trước hội chúng; cách dịch vẫn ghi chú khả năng chỉ đơn giản là “đọc”.
- source_word: οἱ ἀκούοντες
  choice: những người nghe
  rationale: Giữ nghĩa trực tiếp của ἀκούω và phù hợp với bối cảnh một người đọc cho nhiều người nghe.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: các lời của lời tiên tri này
  rationale: Giữ λόγους là “các lời”, không khái quát hóa thành “sứ điệp”; “này” làm rõ lời tiên tri đang chứa trong sách.
- source_word: τηροῦντες
  choice: vâng giữ
  rationale: “Vâng giữ” diễn đạt cả việc tuân theo lẫn trung thành gìn giữ, thích hợp hơn “giữ” đơn thuần trong tiếng Việt hiện đại.
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: những điều được viết trong đó
  rationale: Cách diễn đạt tự nhiên, phản ánh danh hóa số nhiều và thể hoàn thành bị động mà không làm câu nặng nề.
- source_word: ὁ γὰρ καιρὸς
  choice: vì thời điểm
  rationale: “Thời điểm” gợi một thời khắc có ý nghĩa hoặc đã định nhưng không áp đặt cách giải thích cụ thể về lịch trình cánh chung.
- source_word: ἐγγύς
  choice: đã gần
  rationale: Diễn đạt rõ sự cận kề theo thời gian, tự nhiên trong tiếng Việt và không giải quyết thay văn bản vấn đề thời điểm ứng nghiệm.
theological_decisions:
- issue: Bối cảnh đọc công khai được gợi ý bởi một người đọc và nhiều người nghe
  choice: Dịch ἀναγινώσκων là “người đọc thành tiếng”.
  alternative: “người đọc” mà không nêu sắc thái đọc thành tiếng
  rationale: Sự tương phản giữa người đọc số ít và những người nghe số nhiều mạnh mẽ gợi bối cảnh hội chúng; chú thích bảo tồn nghĩa rộng hơn về mặt từ vựng.
- issue: Sức nặng cánh chung của καιρός ἐγγύς
  choice: Dịch là “thời điểm đã gần”.
  alternative: “thời gian đã gần” hoặc “kỳ đã định đã gần”
  rationale: Bản dịch giữ nguyên khẳng định về sự cận kề, đồng thời không đưa vào một hệ thống niên biểu hay quan điểm ứng nghiệm cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phước cho” theo nhịp văn chúc phước quen thuộc; dùng “vâng giữ” để tránh sắc thái chỉ cất giữ. Không thêm chú thích riêng cho καιρός vì lựa chọn “thời điểm” đã trực tiếp thể hiện sắc thái về thời khắc có ý nghĩa mà không cần đưa một phương án đồng nghĩa ít hữu ích.
