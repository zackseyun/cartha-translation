id: REV.1.5
reference: Revelation 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: vi
  text: và từ Giê-su, Đấng Mê-si-a[a], là nhân chứng trung tín, Đấng con đầu lòng từ cõi chết, và là Đấng cai trị các vua trên đất. Kính dâng Đấng yêu thương chúng ta và đã giải thoát chúng ta khỏi tội lỗi của chúng ta nhờ huyết Ngài—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su Christ” hoặc “Giê-su Ki-tô.” Từ Hy Lạp là tước hiệu “Mê-si-a.”'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: “đã rửa sạch chúng ta khỏi tội lỗi của chúng ta trong huyết Ngài,” thay vì: “đã giải thoát chúng ta khỏi tội lỗi của chúng ta nhờ huyết Ngài.”'
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Giê-su, Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu thay vì coi là họ; “Đấng Mê-si-a” vừa rõ nghĩa vừa quen thuộc trong tiếng Việt Cơ Đốc.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: nhân chứng thành tín
  rationale: μάρτυς ở đây là người làm chứng, không nhất thiết là người tử đạo; “thành tín” giữ được nét kiên định và đáng tin của πιστός.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: Đấng sinh đầu tiên từ cõi chết
  rationale: Giữ hình ảnh πρωτότοκος và quan hệ với những người chết, đồng thời diễn đạt tự nhiên hơn “con đầu lòng của những người chết” trong tiếng Việt.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: Đấng cai trị các vua trên đất
  rationale: Nêu rõ thẩm quyền của ἄρχων đối với các vua; γῆ trong phạm vi vũ trụ của Khải Huyền thích hợp là “đất”.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: Kính dâng Đấng yêu thương chúng ta
  rationale: Dạng phân từ hiện tại diễn tả tình yêu đang tiếp diễn; cấu trúc tặng cách mở đầu lời tôn vinh nên được thể hiện bằng “Kính dâng”.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: đã giải thoát chúng ta khỏi tội lỗi mình
  rationale: λύω mang nghĩa tháo cởi hay phóng thích; “giải thoát… khỏi” giữ rõ hình ảnh giải phóng và quan hệ phân cách của ἐκ.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: nhờ huyết Ngài
  rationale: Hiểu ἐν theo nghĩa phương tiện; “nhờ” diễn đạt tự nhiên phương cách giải thoát, còn “huyết” giữ ngôn ngữ hiến tế trang trọng.
theological_decisions:
- issue: Dị bản ở phân từ sau “yêu thương chúng ta”
  choice: λύσαντι, “đã giải thoát chúng ta”
  alternative: λούσαντι, “đã rửa sạch chúng ta”
  rationale: Theo văn bản SBLGNT được cung cấp; dị bản nổi tiếng và có ý nghĩa được ghi ở chú thích để bảo đảm minh bạch văn bản.
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Đấng Ki-tô
  rationale: Ngữ cảnh dùng Χριστός như tước hiệu; dịch nghĩa/tước hiệu tránh khiến độc giả hiểu đây chỉ là một phần của tên riêng.
- issue: Ý nghĩa của πρωτότοκος trong quan hệ với người chết
  choice: Đấng sinh đầu tiên từ cõi chết
  alternative: con đầu lòng của những người chết
  rationale: Giữ ẩn dụ về địa vị đầu tiên và sự ra khỏi cõi chết mà không diễn giải quá mức thành một công thức thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Giê-su” và đại từ tôn kính “Ngài”; duy trì dấu gạch ngang cuối câu vì câu tôn vinh còn tiếp tục sang câu kế. Các dấu chú thích [a], [b] đều có trong chính văn.
