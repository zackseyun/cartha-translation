id: REV.1.7
reference: Revelation 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: vi
  text: Kìa, Ngài đang đến với các đám mây; mọi mắt sẽ thấy Ngài, kể cả những kẻ đã đâm Ngài, và mọi chi tộc trên đất[a] sẽ than khóc vì Ngài. Phải, A-men!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi chi tộc trong xứ.” Cụm từ này có thể gợi lại Xa-cha-ri 12:10–12, nơi “xứ” là một cách hiểu phù hợp với ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Lời gọi chú ý sống động, trang trọng nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔρχεται
  choice: đang đến
  rationale: Diễn đạt hiện tại Hy Lạp mang sắc thái sống động và hướng tới tương lai.
- source_word: μετὰ τῶν νεφελῶν
  choice: với các đám mây
  rationale: Giữ giới từ 'với' và hình ảnh gợi Đa-ni-ên 7:13.
- source_word: ὄψεται ... πᾶς ὀφθαλμὸς
  choice: mọi mắt sẽ thấy
  rationale: Giữ hình ảnh cụ thể và cách diễn đạt phân bố số ít của nguyên văn.
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: những kẻ đã đâm Ngài
  rationale: Giữ quan hệ quy chiếu cùng liên hệ ngôn từ với Xa-cha-ri 12:10 và Giăng 19:37; 'kẻ' phù hợp với hành vi thù nghịch trong ngữ cảnh.
- source_word: κόψονται ἐπ’ αὐτὸν
  choice: sẽ than khóc vì Ngài
  rationale: κόπτομαι chỉ sự than khóc; 'vì Ngài' giữ được độ mở giữa than khóc về Ngài và than khóc do sự hiện đến của Ngài, tự nhiên hơn 'trên Ngài' trong tiếng Việt.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: mọi chi tộc trên đất
  rationale: ‘Chi tộc’ giữ nghĩa cụ thể của φυλαί. 'Đất' bảo tồn sự nhập nhằng của γῆ giữa đất/miền đất và toàn thể trái đất, thay vì buộc chọn một nghĩa ngay trong chính văn.
- source_word: ναί, ἀμήν
  choice: Phải, A-men!
  rationale: Giữ hai lời xác quyết liên tiếp và trọng lượng phụng vụ của ἀμήν.
theological_decisions:
- issue: Phạm vi của τῆς γῆς trong πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: mọi chi tộc trên đất
  alternative: mọi chi tộc trong xứ
  rationale: Ngữ cảnh 'mọi mắt' có thể gợi phạm vi toàn cầu, còn tiếng vọng Xa-cha-ri 12:10–12 cho phép hiểu về xứ. Chính văn dùng 'trên đất' để tự nhiên và tương đối bảo toàn độ mở; chú thích nêu rõ cách hiểu hẹp hơn.
- issue: Sắc thái của ἐπ’ αὐτόν sau κόψονται
  choice: than khóc vì Ngài
  alternative: than khóc về Ngài
  rationale: Giới từ có thể diễn tả đối tượng hoặc căn nguyên của sự than khóc. 'Vì Ngài' không xác định quá mức sự than khóc là ăn năn, thương tiếc hay kinh hãi trước phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa đại từ 'Ngài' theo quy ước kính trọng phổ biến trong tiếng Việt Cơ Đốc, không nhằm xác lập thêm một diễn giải thần học. Dấu chấm than cuối câu chuyển tải sức nặng của lời xác quyết kép.
