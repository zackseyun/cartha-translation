revisions:
- from: Kìa, Ngài đang đến với các đám mây; mọi mắt sẽ thấy Ngài, kể cả những kẻ đã đâm Ngài, và mọi chi tộc trên đất sẽ than khóc vì Ngài.[a] Phải, A-men!
  to: Kìa, Ngài đang đến với các đám mây; mọi mắt sẽ thấy Ngài, kể cả những kẻ đã đâm Ngài, và mọi chi tộc trên đất[a] sẽ than khóc vì Ngài. Phải, A-men!
