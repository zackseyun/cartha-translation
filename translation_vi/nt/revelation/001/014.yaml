- from: Đầu và tóc Người trắng[a] như lông chiên trắng, như tuyết; mắt Người như ngọn lửa[b].
  to: Đầu và tóc Người đều trắng[a] như lông chiên trắng, như tuyết; mắt Người như ngọn lửa bừng cháy[b].
  rationale: Bản sửa chỉ làm rõ cú pháp của nguyên văn và diễn đạt hình ảnh lửa đầy đủ hơn trong tiếng Việt hiện đại. Các phép so sánh và tính chất khải tượng vẫn được giữ nguyên, không áp đặt cách giải thích biểu tượng.
