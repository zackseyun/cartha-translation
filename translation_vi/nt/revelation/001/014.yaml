id: REV.1.14
reference: Revelation 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: vi
  text: Đầu và tóc Người đều trắng[a] như lông chiên trắng, như tuyết; mắt Người như ngọn lửa bừng cháy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đầu Người và tóc Người đều trắng như lông chiên trắng, như tuyết.”'
    reason: lexical_alternative
  - marker: b
    text: Hình ảnh này gợi lại Đa-ni-ên 7:9 và nhấn mạnh tính chất khải tượng của lời mô tả.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: không dịch riêng
  rationale: Đây là liên từ nhẹ tiếp nối phần mô tả; trong tiếng Việt, mạch văn đã đủ rõ nên không cần thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: κεφαλὴ
  choice: đầu
  rationale: Từ chỉ bộ phận cơ thể được dịch trực tiếp, phù hợp với hình ảnh trong khải tượng.
- source_word: τρίχες
  choice: tóc
  rationale: “Tóc” là cách nói tập hợp tự nhiên trong tiếng Việt.
- source_word: λευκαὶ
  choice: trắng
  rationale: Giữ nghĩa màu sắc cơ bản và sự nhấn mạnh về sắc trắng, không diễn giải thành “sáng chói” hay thêm ý nghĩa biểu tượng.
- source_word: ὡς ἔριον λευκόν
  choice: như lông chiên trắng
  rationale: Giữ nguyên phép so sánh và quan hệ trong đó λευκόν bổ nghĩa cho ἔριον.
- source_word: ὡς χιών
  choice: như tuyết
  rationale: Giữ phép so sánh thứ hai và hiệu quả hình ảnh tích lũy.
- source_word: ὀφθαλμοὶ
  choice: mắt
  rationale: Cách dịch thông dụng, tự nhiên cho danh từ chỉ đôi mắt.
- source_word: ὡς φλὸξ πυρός
  choice: như ngọn lửa
  rationale: “Ngọn lửa” diễn đạt tự nhiên thành ngữ Hy Lạp trong tiếng Việt mà vẫn bảo toàn hình ảnh lửa; dịch “ngọn lửa của lửa” sẽ gượng và dư nghĩa.
theological_decisions:
- issue: Hình ảnh biểu tượng về nhân vật giống Con Người được tôn cao
  choice: Giữ nguyên các hình ảnh so sánh trong bản dịch, không giải thích biểu tượng ngay trong câu.
  alternative: Diễn giải màu trắng là sự tinh sạch hoặc vĩnh cửu, và mắt lửa là sự phán xét.
  rationale: Câu này trình bày hình ảnh khải tượng chứ không trực tiếp xác định ý nghĩa giáo lý của từng chi tiết; không diễn giải giúp bảo toàn độ mở và sức căng thần học của bản văn.
- issue: Phạm vi của tính từ λευκαὶ
  choice: Bản chính đọc tự nhiên rằng cả đầu và tóc đều trắng, đồng thời ghi chú khả năng cấu trúc sát chữ hơn.
  alternative: 'Hiểu toàn bộ chuỗi theo cách: “đầu Người và tóc Người trắng như lông chiên trắng, như tuyết.”'
  rationale: Cú pháp Hy Lạp có thể được thể hiện theo hơn một cách trong tiếng Việt; ghi chú bảo tồn khả năng diễn đạt thay thế mà không làm câu chính nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” để quy chiếu nhân vật trong khải tượng với sắc thái tôn kính nhưng không thêm danh xưng ngoài nguyên văn. Dấu chấm phẩy giúp phân tách hai nét mô tả song song. Mọi dấu chú thích đều xuất hiện trong bản chính.
