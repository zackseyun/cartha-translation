id: REV.1.20
reference: Revelation 1:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: vi
  text: 'Còn điều huyền nhiệm về bảy ngôi sao mà con đã thấy trong tay phải ta, và về bảy chân đèn bằng vàng, là thế này: bảy ngôi sao là các thiên sứ[a] của bảy hội thánh, còn bảy chân đèn là bảy hội thánh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các sứ giả của bảy hội thánh.” Từ Hy Lạp này có thể chỉ thiên sứ hoặc sứ giả loài người.'
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: điều huyền nhiệm
  rationale: Giữ sắc thái khải huyền và thần học của từ Hy Lạp, đồng thời cho thấy đây là ý nghĩa kín nhiệm nay được giải bày, thay vì giản lược thành “ý nghĩa tượng trưng”.
- source_word: ἀστέρων / ἀστέρες
  choice: các ngôi sao
  rationale: Chuyển dịch trực tiếp hình ảnh trong khải tượng; mệnh đề sau giải thích đối tượng mà biểu tượng này chỉ về.
- source_word: οὓς εἶδες
  choice: mà con đã thấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ mệnh đề quan hệ bổ nghĩa cho “bảy ngôi sao” và thể quá khứ của động từ.
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: trong tay phải ta
  rationale: Phù hợp với hình ảnh ở văn cảnh gần và là cách diễn đạt tự nhiên trong tiếng Việt cho việc cầm các ngôi sao trong tay phải.
- source_word: λυχνίας
  choice: chân đèn
  rationale: Từ Hy Lạp chỉ giá hoặc chân đặt đèn, không phải chính ngọn đèn; “chân đèn” giữ hình ảnh cụ thể của đoạn sách.
- source_word: χρυσᾶς
  choice: bằng vàng
  rationale: Diễn đạt rõ chất liệu của các chân đèn bằng tiếng Việt hiện đại và tự nhiên.
- source_word: ἄγγελοι
  choice: các thiên sứ
  rationale: Khải Huyền thường dùng từ này cho các hữu thể trên trời. Tuy nhiên, vì từ Hy Lạp cũng có thể nghĩa là “sứ giả”, phương án ấy được giữ trong chú thích.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: các hội thánh / những hội thánh
  rationale: “Hội thánh” là cách gọi quen thuộc và phù hợp cho các cộng đồng tín hữu được nhắc đến trong sách Khải Huyền.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Còn điều huyền nhiệm về ... và về ... là thế này:'
  rationale: Tái hiện cấu trúc nêu chủ đề rồi giải thích của câu Hy Lạp, đồng thời tạo thành câu tiếng Việt rõ ràng, tự nhiên mà không thêm nội dung diễn giải.
theological_decisions:
- issue: Đối tượng được chỉ bởi ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: các thiên sứ của bảy hội thánh
  alternative: các sứ giả của bảy hội thánh
  rationale: ἄγγελος có thể chỉ thiên sứ trên trời hoặc sứ giả loài người. Vì cách dùng chỉ hữu thể trên trời phổ biến trong Khải Huyền nhưng bản văn tại đây không xác định dứt khoát, bản chính dùng “thiên sứ” và chú thích giữ phương án “sứ giả” để bảo toàn sự nhập nhằng của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “con—ta” phù hợp lời Đấng Christ phán với Giăng trong văn cảnh. Chú thích được đặt ngay sau “thiên sứ”, là từ mà chú thích giải nghĩa.
