id: REV.1.8
reference: Revelation 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: vi
  text: “Ta là An-pha và Ô-mê-ga,” Chúa là Đức Chúa Trời phán, “Đấng hiện có, đã có và đang đến[a], Đấng Toàn Năng.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ta là
  rationale: Đại từ ngôi thứ nhất được nêu rõ tạo sắc thái nhấn mạnh trong lời tự xưng trang trọng. “Ta là” tự nhiên trong văn phong thần phán và giữ được tính trang nghiêm.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: An-pha và Ô-mê-ga
  rationale: Giữ tên hai chữ cái Hy Lạp thay vì đổi thành chữ cái tiếng Việt, qua đó bảo tồn hình ảnh biểu tượng và cách diễn đạt khải huyền đã quen thuộc.
- source_word: λέγει
  choice: phán
  rationale: Trong ngữ cảnh Đức Chúa Trời trực tiếp tuyên bố, “phán” là từ tự nhiên, trang trọng và phù hợp với công thức phát ngôn thần linh; thì hiện tại của động từ Hy Lạp vẫn được thể hiện như lời tuyên bố đang có hiệu lực.
- source_word: κύριος, ὁ θεός
  choice: Chúa là Đức Chúa Trời
  rationale: Cụm Hy Lạp đặt κύριος và ὁ θεός cạnh nhau như tước hiệu và danh xưng đồng vị. Cách dịch này rõ nghĩa trong tiếng Việt và tránh cụm “Chúa Đức Chúa Trời” kém tự nhiên.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: Đấng hiện có, đã có và đang đến
  rationale: Dùng “Đấng” để liên kết tự nhiên ba thành phần chỉ về Đức Chúa Trời. “Đang đến” phản ánh trực tiếp phân từ hiện tại ἐρχόμενος và giữ sắc thái chuyển động hướng đến trong viễn tượng cánh chung.
- source_word: ὁ παντοκράτωρ
  choice: Đấng Toàn Năng
  rationale: Đây là cách diễn đạt tiếng Việt trang trọng, dễ hiểu và đã ổn định cho tước hiệu chỉ quyền tể trị, quyền năng bao trùm của Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch ὁ ἐρχόμενος trong lời tự xưng về sự hiện hữu đời đời và sự ngự đến tương lai của Đức Chúa Trời
  choice: đang đến
  alternative: sẽ đến
  rationale: Phân từ hiện tại ἐρχόμενος được phản ánh sát hơn bằng “đang đến”, nhấn mạnh hành động ngự đến năng động chứ không chỉ một sự kiện tương lai. “Sẽ đến” vẫn là cách hiểu hợp lệ, quen thuộc và được giữ trong chú thích để không xóa bỏ độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ta” trong lời Đức Chúa Trời tự xưng và “phán” cho lời tuyên bố thần linh. Các tước hiệu được viết hoa để nhận diện chức năng danh xưng trong câu; dấu gạch nối giúp người đọc Việt phát âm tên chữ cái Hy Lạp.
