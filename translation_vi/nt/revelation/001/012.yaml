id: REV.1.12
reference: Revelation 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: vi
  text: Tôi quay lại để xem tiếng nói đang nói với tôi[a]. Khi quay lại, tôi thấy bảy chân đèn bằng vàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang nói cùng tôi.” Theo nghĩa đen, tiếng Hy Lạp nói “đang nói với/cùng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: Tôi quay lại
  rationale: Động từ chỉ hành động xoay người theo nghĩa thể lý; “quay lại” tự nhiên trong tiếng Việt và không thêm ý quá mức.
- source_word: βλέπειν
  choice: để xem
  rationale: Động từ nguyên mẫu bổ nghĩa cho hành động quay lại, diễn tả mục đích nhận biết nguồn phát ra tiếng nói.
- source_word: φωνὴν
  choice: tiếng
  rationale: Trong tiếng Việt, “xem tiếng” giữ được hình ảnh tu từ khác thường của nguyên văn hơn “xem người đang nói”; mệnh đề sau cho thấy đây là tiếng nói chứ không chỉ là âm thanh.
- source_word: ἥτις
  choice: đang
  rationale: Quan hệ từ Hy Lạp được diễn đạt tự nhiên qua mệnh đề định ngữ không có đại từ quan hệ trong tiếng Việt.
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: đang nói với tôi
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn. “Nói với tôi” là cách nói tự nhiên, đồng thời có thể mang sắc thái hướng lời đến tôi hoặc giao tiếp cùng tôi.
- source_word: ἐπιστρέψας
  choice: Khi quay lại
  rationale: Phân từ quá khứ diễn tả hành động đi trước hoặc gắn sát với việc nhìn thấy; “khi” giữ trình tự mà vẫn tự nhiên.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Cách dịch trực tiếp, rõ ràng của động từ chỉ sự nhìn thấy.
- source_word: ἑπτὰ
  choice: bảy
  rationale: Số từ trực tiếp, không có điểm mơ hồ.
- source_word: λυχνίας
  choice: chân đèn
  rationale: Danh từ chỉ giá hoặc chân đặt đèn, không phải bản thân ngọn đèn; cách dịch này cũng giữ tính nhất quán với lời giải thích biểu tượng ở Khải Huyền 1:20.
- source_word: χρυσᾶς
  choice: bằng vàng
  rationale: Diễn đạt tự nhiên và rõ chất liệu trong tiếng Việt; sát nghĩa hơn khả năng hiểu “màu vàng”.
theological_decisions:
- issue: Cách dịch λυχνίας trong hình ảnh khải huyền
  choice: chân đèn
  alternative: đèn
  rationale: Nguyên ngữ nói đến vật dùng để đặt đèn. Giữ hình ảnh cụ thể này là cần thiết vì Khải Huyền 1:20 về sau giải thích ý nghĩa biểu tượng của bảy chân đèn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách nói có chủ ý khác thường “xem tiếng” của nguyên văn thay vì giải nghĩa thành “xem ai đang nói”. Dùng “chân đèn bằng vàng” để phân biệt rõ vật đỡ đèn với đèn và tránh hiểu tính từ chỉ màu sắc.
