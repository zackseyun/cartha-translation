id: REV.1.18
reference: Revelation 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: vi
  text: và là Đấng Hằng Sống—Ta đã chết[a], nhưng kìa, Ta sống đời đời[b], và Ta cầm chìa khóa của sự chết và Âm Phủ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Ta đã trở nên chết”; động từ Hy Lạp nhấn mạnh sự chuyển sang trạng thái chết.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp viết sát chữ là “cho đến các thời đại của các thời đại”, một thành ngữ chỉ thời gian vô tận.
    reason: lexical_alternative
  - marker: c
    text: “Âm Phủ” chỉ cõi người chết, không nhất thiết là nơi hình phạt chung cuộc.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: Đấng Hằng Sống
  rationale: Phân từ hiện tại có mạo từ được dùng như một danh hiệu. Cách dịch này tự nhiên, trang trọng và giữ được sắc thái danh xưng, thay vì chỉ diễn đạt một hành động.
- source_word: ἐγενόμην νεκρός
  choice: Ta đã chết
  rationale: γίνομαι với tính từ vị ngữ nhấn mạnh sự chuyển sang trạng thái chết. Tiếng Việt tự nhiên diễn đạt là “đã chết”; chú thích giữ lại sắc thái sát chữ “đã trở nên chết”.
- source_word: ἰδού
  choice: kìa
  rationale: Giữ sức gợi trực chỉ và sự nhấn mạnh của thán từ Hy Lạp trong văn phong trang trọng nhưng dễ hiểu.
- source_word: ζῶν εἰμι
  choice: nay Ta sống
  rationale: Diễn đạt tự nhiên trạng thái hiện đang sống, đồng thời “nay” làm rõ sự tương phản với việc đã chết mà không thay đổi nội dung.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời
  rationale: Thành ngữ tiếng Việt tự nhiên để diễn đạt công thức Hy Lạp chỉ thời gian vô tận; chú thích nêu hình thức sát chữ.
- source_word: κλεῖς
  choice: chìa khóa
  rationale: Tương đương trực tiếp; trong hình ảnh của câu, việc cầm chìa khóa hàm ý quyền mở, đóng và kiểm soát.
- source_word: τοῦ θανάτου
  choice: của sự chết
  rationale: Giữ trực tiếp kết cấu sở hữu của nguyên văn và không buộc phải nhân cách hóa sự chết.
- source_word: τοῦ ᾅδου
  choice: của Âm Phủ
  rationale: “Âm Phủ” chỉ cõi người chết trong tiếng Việt và phân biệt với hình phạt chung cuộc; phù hợp hơn “địa ngục” và rộng hơn “mồ mả”.
theological_decisions:
- issue: Cách dịch ᾅδης trong bối cảnh cánh chung
  choice: Âm Phủ
  alternative: cõi người chết; mồ mả; địa ngục
  rationale: Nguyên văn đặt “sự chết” và ᾅδης cạnh nhau như hai thực tại liên hệ nhưng không đồng nhất. “Âm Phủ” bảo toàn ý niệm cõi người chết, không thu hẹp thành mồ mả thể lý và không đồng nhất với nơi hình phạt chung cuộc.
- issue: Sắc thái của ἐγενόμην νεκρός
  choice: Ta đã chết, kèm chú thích về nghĩa sát chữ
  alternative: Ta đã trở nên chết; Ta từng chết
  rationale: Bản chính cần tiếng Việt tự nhiên, nhưng chú thích bảo tồn sắc thái chuyển trạng thái của γίνομαι và trình tự chết–sống lại mà không giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “Ta” phù hợp lời tự xưng uy nghi của Đấng Christ trong Khải Huyền. Dấu chấm sau danh hiệu giúp câu tiếng Việt rõ ràng; “nhưng” diễn đạt sự tương phản vốn được tạo bởi chuỗi mệnh đề καί trong ngữ cảnh. Mọi dấu chú thích đều xuất hiện ngay trong bản văn.
