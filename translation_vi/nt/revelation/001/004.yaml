id: REV.1.4
reference: Revelation 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: vi
  text: 'Giăng gửi đến bảy hội thánh tại A-si-a: Cầu chúc anh chị em được ân điển và bình an từ Đấng hiện có, đã có và đang đến[a], cùng từ bảy thần linh ở trước ngai Ngài[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch truyền thống hơn: “Đấng hiện có, đã có và sẽ đến.”'
    reason: lexical_alternative
  - marker: b
    text: “Bảy thần linh” có thể tượng trưng cho sự viên mãn của Đức Thánh Linh, hoặc chỉ bảy thần linh trên trời; nguyên văn Hy Lạp viết là “bảy thần linh.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc trong tiếng Việt, thay vì dịch nghĩa tên riêng.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: gửi bảy hội thánh
  rationale: Trong phần mở đầu thư, cách nói này diễn đạt tự nhiên đối tượng nhận thư; “hội thánh” là nghĩa phù hợp với các cộng đồng Cơ Đốc tại đây.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: tại A-si-a
  rationale: Giữ địa danh của nguyên văn; ở đây A-si-a là tỉnh A-si-a thuộc La Mã, không phải toàn bộ châu Á ngày nay.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Cầu chúc anh chị em được ân điển và bình an
  rationale: Diễn đạt tự nhiên công thức chúc phước của thư tín, đồng thời thể hiện rõ đại từ số nhiều ὑμῖν.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: từ Đấng hiện có, đã có và đang đến
  rationale: Giữ cấu trúc danh hiệu thần thánh và sắc thái hiện tại của ὁ ἐρχόμενος; “Đấng” thể hiện rõ đây là một tước hiệu chỉ về một thân vị.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: bảy thần linh
  rationale: Giữ nguyên số nhiều của tiếng Hy Lạp, không diễn giải thành “Thánh Linh bảy phương diện”; dùng chữ thường để không quyết định trước căn tính đang được tranh luận.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: ở trước ngai Ngài
  rationale: Diễn đạt gọn và tự nhiên vị trí của bảy thần linh; “Ngài” quy chiếu về Đấng vừa được nhắc đến.
theological_decisions:
- issue: Căn tính của “Đấng hiện có, đã có và đang đến”
  choice: 'Trình bày như một danh hiệu thần thánh: “Đấng hiện có, đã có và đang đến.”'
  alternative: “Đấng đang có, đã có và sẽ đến.”
  rationale: Bản dịch giữ tính trang trọng và sự lặp lại của danh hiệu, đồng thời dịch ὁ ἐρχόμενος theo dạng đang diễn tiến thay vì đổi thành thì tương lai đơn thuần.
- issue: Căn tính của “bảy thần linh”
  choice: Giữ nguyên cụm từ số nhiều trong chính văn.
  alternative: Có thể hiểu theo biểu tượng là sự viên mãn của Đức Thánh Linh, hoặc là bảy thần linh trên trời.
  rationale: Nguyên văn nói “bảy thần linh,” còn căn tính chính xác của họ là vấn đề được giải thích khác nhau; bản dịch không nên tự quyết định tranh luận này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp lời mở đầu thư tín. Dùng “anh chị em” để diễn đạt đại từ số nhiều một cách tự nhiên và bao quát. Dấu phẩy cuối câu được giữ vì câu còn tiếp tục sang câu kế.
