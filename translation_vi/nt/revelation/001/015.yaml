  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: vi
  text: Chân Ngài giống như đồng rực sáng[a], như đã được nung đỏ trong lò, và tiếng Ngài tựa tiếng của nhiều nước[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Thuật ngữ Hy Lạp ở đây rất hiếm và chưa rõ chính xác chỉ loại kim loại nào; có thể hiểu là một loại đồng hoặc hợp kim đã được tinh luyện và rực sáng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn lặp lại cùng một từ có thể mang nghĩa “tiếng nói” hoặc “âm thanh”: “tiếng Ngài tựa tiếng của nhiều nước.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: chân
  rationale: Danh từ πούς trực tiếp chỉ bàn chân, nhưng tiếng Việt thường dùng “chân” tự nhiên hơn trong lời mô tả hình thể và vẫn có thể bao quát phần dưới của chi.
- source_word: ὅμοιοι
  choice: giống như
  rationale: Diễn đạt rõ quan hệ tương tự của ὅμοιος bằng cách nói tự nhiên trong tiếng Việt.
- source_word: χαλκολιβάνῳ
  choice: đồng sáng bóng
  rationale: Đây là một thuật ngữ kim loại cực hiếm, chưa xác định chắc thành phần. “Đồng sáng bóng” truyền đạt vẻ rực sáng của kim loại mà không khẳng định quá mức đó là một hợp kim cụ thể.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: như đã được nung luyện trong lò
  rationale: κάμινος là lò nung, còn dạng của πυρόω gợi việc bị nung bằng lửa, có thể bao hàm ý tinh luyện. “Nung luyện” giữ được cả sức nóng lẫn hình ảnh luyện kim.
- source_word: φωνή
  choice: tiếng
  rationale: φωνή có thể chỉ tiếng nói hoặc âm thanh. “Tiếng Ngài” tự nhiên trong tiếng Việt, mang sắc thái cá nhân nhưng không loại bỏ khía cạnh âm thanh.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: tựa tiếng của nhiều dòng nước
  rationale: Giữ sự lặp lại của φωνή bằng “tiếng” và bảo tồn hình ảnh Kinh Thánh về “nhiều nước”; thêm “dòng” để cụm từ rõ và tự nhiên trong tiếng Việt mà không thu hẹp thành sóng biển hay thác nước.
theological_decisions:
- issue: Cách dịch φωνή được lặp lại trong phép so sánh cuối câu
  choice: tiếng Ngài tựa tiếng của nhiều dòng nước
  alternative: tiếng Ngài tựa âm thanh của nhiều dòng nước
  rationale: Lặp lại “tiếng” phản ánh cấu trúc Hy Lạp và duy trì sự liên hệ giữa tiếng của nhân vật với tiếng nước hùng vĩ. Cách dịch không xác định đó là tiếng sóng, thác hay hiện tượng cụ thể nào, nhờ vậy bảo tồn độ rộng của hình ảnh thần hiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” phù hợp lời mô tả khải tượng; giữ cấu trúc song hành cùng hình ảnh “nhiều nước”, đồng thời tránh xác định quá mức thành phần kim loại hoặc loại âm thanh.
