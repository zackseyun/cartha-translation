  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính của câu: chân, sự ví như kim loại sáng, lò nung, và tiếng Ngài như tiếng của nhiều nước. Tuy nhiên, “nhiều dòng nước” thêm nét nghĩa “dòng” không có trong ὑδάτων πολλῶν và thu hẹp hình ảnh. “Đồng sáng bóng” cũng thiên về độ bóng đã đánh bóng hơn là vẻ rực/cháy nóng mà πεπυρωμένης gợi ra trong ngữ cảnh lò nung.'
