  to: Chân Ngài giống như đồng rực sáng[a], như đã được nung đỏ trong lò, và tiếng Ngài tựa tiếng của nhiều nước[b].
  rationale: Sửa “nhiều dòng nước” thành “nhiều nước” để không thêm hoặc thu hẹp hình ảnh nguồn. Sửa mô tả kim loại và cụm lò nung để diễn đạt rõ hơn sắc thái kim loại rực sáng, đã được đốt nóng của nguyên ngữ, trong khi vẫn thận trọng trước nghĩa chưa chắc chắn của χαλκολιβάνῳ. Giữ các mốc chú thích đúng chỗ và nội dung chú thích phù hợp với bản văn sửa.
