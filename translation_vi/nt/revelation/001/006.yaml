id: REV.1.6
reference: Revelation 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: vi
  text: và đã làm cho chúng ta trở thành một vương quốc[a], những tư tế phục vụ Đức Chúa Trời, là Cha của Ngài—vinh quang và quyền thống trị thuộc về Ngài cho đến đời đời[b]. A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản muộn hơn chép “các vua và các tư tế” thay cho “một vương quốc, những tư tế”. Chính văn dịch theo bản Hy Lạp được cung cấp.
    reason: textual_variant
  - marker: b
    text: 'Sát chữ hơn: “cho đến các thời đại của các thời đại”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: đã lập ... thành
  rationale: Động từ aorist được diễn đạt bằng hành động đã xảy ra; cấu trúc “lập ... thành” tự nhiên trong tiếng Việt và giữ ý thiết lập một căn tính, địa vị.
- source_word: βασιλείαν
  choice: một vương quốc
  rationale: Danh từ số ít chỉ vương quốc hay quyền trị vì, không phải “các vua”; cách dịch này giữ căn tính cộng đồng của những người được cứu chuộc.
- source_word: ἱερεῖς
  choice: các tư tế
  rationale: Giữ nguyên hình ảnh thờ phượng và giao ước của danh từ số nhiều, bằng một thuật ngữ trang trọng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: cho Đức Chúa Trời và Cha của Ngài
  rationale: Giữ giới từ chỉ sự quy hướng/phục vụ và bảo toàn cách diễn đạt của Hy Lạp rằng Đức Chúa Trời là Đức Chúa Trời và Cha của Chúa Giê-su; “Ngài” theo ngữ cảnh chỉ Chúa Giê-su.
- source_word: δόξα
  choice: vinh quang
  rationale: Tương đương chuẩn và tự nhiên trong lời tôn vinh.
- source_word: κράτος
  choice: quyền thống trị
  rationale: Diễn đạt sức mạnh mang tính chủ quyền và cai trị trong văn cảnh tôn vinh, cụ thể hơn từ chung chung “quyền năng”.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: cho đến đời đời
  rationale: Thành ngữ tiếng Việt tự nhiên diễn đạt thời gian vô tận; cách nói sát chữ hơn được ghi ở chú thích.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ lời xác nhận phụng vụ quen thuộc, đồng thời viết theo cách giúp độc giả tiếng Việt phát âm rõ.
theological_decisions:
- issue: Đối tượng của cụm “Đức Chúa Trời và Cha của Ngài”
  choice: “Ngài” chỉ Chúa Giê-su trong ngữ cảnh liền trước; cộng đồng được lập làm các tư tế cho Đức Chúa Trời và Cha của Chúa Giê-su.
  alternative: Làm phẳng thành “cho Đức Chúa Trời là Cha Ngài” hoặc “cho Đức Chúa Trời, Cha chúng ta”.
  rationale: Bản dịch giữ cách diễn đạt quan hệ và sự phân biệt trong nguyên văn, không giải hòa hoặc diễn giải thêm căng thẳng thần học của câu.
- issue: Địa vị của cộng đồng
  choice: Giữ “một vương quốc, ... các tư tế”.
  alternative: “các vua và các tư tế”.
  rationale: Bản SBLGNT được cung cấp đọc βασιλείαν, ἱερεῖς; vì vậy bản dịch phản ánh danh từ số ít “vương quốc” thay vì đưa biến thể hậu kỳ “các vua” vào chính văn.
- issue: Tính chất của lời tôn vinh
  choice: “vinh quang và quyền thống trị thuộc về Ngài”.
  alternative: “nguyện vinh quang và quyền thống trị thuộc về Ngài”.
  rationale: Nguyên văn là mệnh đề không có động từ; cách dịch đã chọn diễn đạt lời quy tôn trực tiếp mà không buộc nó thành một lời cầu chúc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “vương quốc” để giữ số ít của nguyên văn, “các tư tế” để tránh biến câu thành một tước hiệu vương quyền cá nhân, và “quyền thống trị” để thể hiện sắc thái chủ quyền của κράτος. Các dấu chú thích được đặt đúng ngay sau cụm từ mà mỗi chú thích giải thích.
