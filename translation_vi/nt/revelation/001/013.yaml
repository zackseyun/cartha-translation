id: REV.1.13
reference: Revelation 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: vi
  text: và giữa các chân đèn là một Đấng giống như một con người[a], mặc áo dài đến chân và quấn một dải đai vàng ngang ngực.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một Đấng giống như Con Người.” Cách nói Hy Lạp gợi lại Đa-ni-ên 7:13 và tại đây được áp dụng cho Đức Giê-su được tôn cao.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: giữa
  rationale: Diễn đạt tự nhiên và sát nghĩa vị trí ở giữa hoặc giữa vòng các chân đèn, đồng thời phù hợp văn phong khải tượng.
- source_word: λυχνιῶν
  choice: các chân đèn
  rationale: λυχνία chỉ giá hoặc chân đặt đèn, không phải chính ngọn đèn; cách dịch này cũng giữ nhất quán với hình ảnh được giải thích trong văn mạch.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: một vị giống như con người
  rationale: Cụm Hy Lạp không có mạo từ trước υἱὸν và vang vọng Đa-ni-ên 7:13. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ nét so sánh và không mặc nhiên biến cụm từ thành một danh hiệu cố định.
- source_word: ἐνδεδυμένον
  choice: mặc
  rationale: Diễn đạt rõ trạng thái nhân vật đang khoác y phục, tự nhiên hơn trong tiếng Việt hiện đại mà vẫn phản ánh kết quả của phân từ hoàn thành.
- source_word: ποδήρη
  choice: áo dài chấm chân
  rationale: Từ này chỉ loại áo dài tới bàn chân; cách dịch ngắn gọn, rõ nghĩa và giữ sắc thái trang nghiêm.
- source_word: περιεζωσμένον
  choice: thắt
  rationale: Giữ hình ảnh đai được quấn hoặc buộc quanh thân, đồng thời tự nhiên hơn từ ngữ cổ như 'nịt' trong tiếng Việt hiện đại.
- source_word: πρὸς τοῖς μαστοῖς
  choice: ngang ngực
  rationale: Chỉ vị trí đai ở cao trên thân mình; cách dịch này rõ ràng, tự nhiên và không gây sự chú ý không cần thiết vào cách gọi giải phẫu sát chữ.
- source_word: ζώνην χρυσᾶν
  choice: một đai vàng
  rationale: ζώνη có thể là đai hoặc dải thắt; 'đai vàng' vừa tự nhiên vừa phù hợp với vị trí ngang ngực trong khải tượng.
theological_decisions:
- issue: Sức nặng Cơ Đốc học của ὅμοιον υἱὸν ἀνθρώπου
  choice: Dịch trong chính văn là 'một vị giống như con người'.
  alternative: một vị giống như Con Người
  rationale: Chính văn giữ cấu trúc không có mạo từ của tiếng Hy Lạp và tiếng vọng Đa-ni-ên 7:13 mà không áp đặt một danh hiệu rõ hơn cú pháp trực tiếp. Chú thích bảo tồn cách hiểu truyền thống mang tính danh hiệu, vì Khải Huyền áp dụng khải tượng này cho Đức Giê-su được tôn cao.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Dùng 'một vị' để chỉ nhân vật trong khải tượng một cách kính trọng; tránh lối quá cổ như 'ở giữa vòng', 'mặc áo dài tận chân' hoặc 'nịt đai'.
