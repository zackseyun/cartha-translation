revisions:
- from: Tôi là Giăng, người anh em của anh chị em và là người cùng dự phần trong hoạn nạn, vương quốc và sự kiên trì trong Đức Giê-su. Tôi đã ở trên đảo gọi là Pát-mô vì lời Đức Chúa Trời và lời chứng của Đức Giê-su.[a]
  to: Tôi, Giăng, là anh em của anh chị em và là người cùng dự phần trong hoạn nạn, vương quốc và sự kiên trì trong Đức Giê-su. Tôi đã ở trên hòn đảo gọi là Pát-mô vì lời Đức Chúa Trời và lời chứng của Đức Giê-su.[a]
  rationale: Các sửa đổi chỉ cải thiện cấu trúc tự xưng, tính tự nhiên của cụm chỉ địa điểm, và độ chính xác của lời giải thích trong chú thích. Không thay đổi nghĩa, phạm vi của “trong Đức Giê-su,” hay tính mơ hồ có chủ ý của “lời chứng của Đức Giê-su.”
  reviewer_model: gpt-5.6-terra
