id: REV.1.9
reference: Revelation 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: vi
  text: Tôi, Giăng, là anh em của anh chị em và là người cùng dự phần trong hoạn nạn, vương quốc và sự kiên trì trong Đức Giê-su. Tôi đã ở trên hòn đảo gọi là Pát-mô vì lời Đức Chúa Trời và lời chứng của Đức Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời chứng về Đức Giê-su.” Sở hữu cách trong tiếng Hy Lạp có thể chỉ lời chứng do Đức Giê-su làm chứng hoặc lời chứng nói về Đức Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: người cùng dự phần
  rationale: Diễn đạt sự cùng chia sẻ và tham dự vào những thực tại được nêu tiếp theo, tự nhiên trong tiếng Việt và không mang sắc thái thương mại như một số cách nói tương đương với “đối tác”.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: trong hoạn nạn, vương quốc và sự kiên trì
  rationale: Giữ ba danh từ song song dưới cùng giới từ như trong tiếng Hy Lạp. “Hoạn nạn” giữ được sức nặng của θλῖψις trong văn cảnh khải huyền; “sự kiên trì” diễn đạt ὑπομονή mà không thêm ý giải thích.
- source_word: ἐν Ἰησοῦ
  choice: trong Đức Giê-su
  rationale: Giữ cách diễn đạt thần học cô đọng và để cụm này bổ nghĩa tự nhiên cho cả ba thực tại vừa nêu, thay vì diễn giải thành “hiệp nhất với”.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: Tôi đã ở trên đảo
  rationale: γίνομαι ở đây có thể dùng theo nghĩa hiện diện hoặc ở tại một nơi. Cách dịch này tự nhiên và không suy đoán cách Giăng đến đảo.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: gọi là Pát-mô
  rationale: Cách diễn đạt thông dụng, rõ nghĩa cho phân từ καλουμένῃ; tên riêng được phiên âm theo âm đọc quen dùng trong tiếng Việt.
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: vì lời Đức Chúa Trời
  rationale: διά với đối cách nêu nguyên nhân. “Vì” giữ mở việc nguyên nhân cụ thể là công bố, trung thành với, hay bị bắt bớ do lời ấy.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: lời chứng của Đức Giê-su
  rationale: 'Giữ cấu trúc sở hữu có phần mơ hồ của nguyên văn: có thể là lời chứng do Đức Giê-su ban hoặc lời chứng về Đức Giê-su. Chú thích nêu rõ cách hiểu thứ hai.'
- source_word: ἀδελφὸς ὑμῶν
  choice: người anh em của anh chị em
  rationale: Giăng tự gọi mình là một người anh em, còn “anh chị em” truyền đạt tự nhiên số nhiều ὑμῶν khi ông nói với toàn thể cộng đồng gồm cả nam và nữ.
theological_decisions:
- issue: Tính mơ hồ của sở hữu cách trong μαρτυρίαν Ἰησοῦ
  choice: Dịch “lời chứng của Đức Giê-su” trong chính văn
  alternative: lời chứng về Đức Giê-su
  rationale: Sở hữu cách Ἰησοῦ có thể là chủ thể hoặc đối thể. Chính văn không quyết định thay cho độc giả; chú thích bảo lưu cách hiểu lời chứng nói về Đức Giê-su.
- issue: Phạm vi của ἐν Ἰησοῦ
  choice: Gắn “trong Đức Giê-su” với cả hoạn nạn, vương quốc và sự kiên trì
  alternative: Chỉ gắn với “sự kiên trì”
  rationale: Cấu trúc phối hợp và vị trí của cụm giới từ cho phép hiểu cả ba thực tại được cùng định vị trong mối liên hệ với Đức Giê-su; bản dịch vẫn giữ trật tự cô đọng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người cùng dự phần” để tránh lối nói cổ; giữ “trong Đức Giê-su” nhằm bảo toàn cách diễn đạt cô đọng của nguyên văn. Tách thành hai câu để tiếng Việt sáng rõ mà không thay đổi quan hệ ý nghĩa.
