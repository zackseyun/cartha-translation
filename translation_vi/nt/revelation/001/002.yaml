id: REV.1.2
reference: Revelation 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: vi
  text: người đã làm chứng về lời của Đức Chúa Trời, về lời chứng của Giê-su, Đấng Mê-si[a], và về mọi điều người đã thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời chứng do Giê-su, Đấng Mê-si ban” hoặc “lời chứng về Giê-su, Đấng Mê-si”. Cấu trúc Hy Lạp có thể được hiểu theo cả hai cách.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: đã làm chứng
  rationale: Diễn đạt rõ hành động làm chứng trong quá khứ, giữ được sắc thái nhân chứng của động từ μαρτυρέω và phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  rationale: Giữ nghĩa cơ bản của λόγος là “lời” và cách nói Kinh Thánh quen thuộc, thay vì thu hẹp thành “sứ điệp”.
- source_word: τὴν μαρτυρίαν
  choice: lời chứng
  rationale: “Lời chứng” tự nhiên trong tiếng Việt và duy trì mối liên hệ từ vựng với động từ “làm chứng”.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si
  rationale: Χριστός tại đây vẫn mang chức năng tước hiệu; “Đấng Mê-si” truyền đạt nghĩa ấy rõ ràng, còn dấu phẩy giúp cụm từ tự nhiên trong tiếng Việt.
- source_word: ὅσα εἶδεν
  choice: mọi điều ông đã thấy
  rationale: “Mọi điều” thể hiện sắc thái bao quát của ὅσα; đại từ “ông” chỉ Giăng theo ngữ cảnh mà không thêm chức danh vào câu.
theological_decisions:
- issue: Tính đa nghĩa của sở hữu cách trong τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: lời chứng của Giê-su, Đấng Mê-si
  alternative: lời chứng do Giê-su, Đấng Mê-si ban; hoặc lời chứng về Giê-su, Đấng Mê-si
  rationale: 'Từ “của” duy trì được sự chưa xác định của nguyên văn: Giê-su có thể là chủ thể ban lời chứng hoặc là đối tượng được làm chứng. Chú thích nêu rõ hai khả năng mà không quyết định thay cho nguyên văn.'
- issue: Cách dịch Χριστοῦ như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh mở đầu sách Khải Huyền, Χριστός vẫn có sức nặng của một tước hiệu; “Đấng Mê-si” chuyển tải nghĩa tước hiệu thay vì coi đây đơn thuần là một phần của tên riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Câu giữ hình thức mệnh đề quan hệ nối tiếp câu 1:1; “tức là” làm rõ chức năng tổng kết của ὅσα εἶδεν mà không thay đổi nội dung. Dấu chú thích [a] được đặt ngay sau cụm từ có cách hiểu đa nghĩa.
