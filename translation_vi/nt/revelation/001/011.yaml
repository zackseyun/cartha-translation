id: REV.1.11
reference: Revelation 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: vi
  text: 'nói rằng: “Điều ông thấy, hãy viết vào một quyển sách[a], rồi gửi cho bảy hội thánh tại Ê-phê-sô, Si-miệc-nơ, Pẹt-ga-môn, Thi-a-ti-rơ, Sạt-đe, Phi-la-đen-phi và Lao-đi-xê.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một cuộn sách”; từ Hy Lạp βιβλίον có thể chỉ cuộn sách, sách hoặc văn bản.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: nói rằng
  rationale: Phân từ hiện tại, chủ động, giống cái, sở hữu cách số ít tiếp nối việc mô tả tiếng nói ở câu trước. “Nói rằng” tự nhiên trong tiếng Việt và không xác định quá mức chủ thể ngay trong câu này.
- source_word: Ὃ βλέπεις
  choice: Điều con thấy
  rationale: Đại từ quan hệ giống trung số ít cùng động từ hiện tại chỉ toàn bộ nội dung khải tượng. “Điều con thấy” vừa tự nhiên vừa giữ phạm vi rộng của nguyên ngữ.
- source_word: γράψον
  choice: hãy viết
  rationale: Mệnh lệnh cách aorist của γράφω; “hãy viết” truyền đạt trực tiếp mệnh lệnh mà không thêm ý nghĩa chuyên biệt như “ghi chép”.
- source_word: εἰς βιβλίον
  choice: vào một quyển sách
  rationale: βιβλίον có thể chỉ sách, cuộn sách hoặc văn bản. “Quyển sách” dễ hiểu trong tiếng Việt hiện đại; khả năng chỉ cuộn sách được giữ trong chú thích.
- source_word: πέμψον
  choice: rồi gửi
  rationale: Mệnh lệnh cách aorist của πέμπω. Tân ngữ được hiểu từ nội dung vừa được truyền phải viết; tiếng Việt có thể lược tân ngữ mà vẫn rõ nghĩa và tự nhiên.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: đến bảy hội thánh
  rationale: ἐκκλησία ở đây chỉ các cộng đồng tín hữu cụ thể tại Tiểu Á. “Hội thánh” là cách diễn đạt quen thuộc, không hàm ý một cơ cấu hệ phái riêng.
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: đến Ê-phê-sô ... và đến Lao-đi-xê
  rationale: Lặp lại “đến” trước từng địa danh để phản ánh việc nguyên ngữ lặp giới từ εἰς, làm rõ mỗi thành phố là một địa chỉ nhận riêng.
theological_decisions:
- issue: Ý nghĩa của ἐκκλησίαις trong Khải Huyền 1:11
  choice: hội thánh
  alternative: cộng đồng hội họp
  rationale: Từ này nói đến bảy cộng đồng tín hữu cụ thể được Đấng Christ phục sinh truyền sứ điệp qua Giăng. “Hội thánh” diễn đạt đúng đối tượng thuộc cộng đồng đức tin mà không du nhập nét riêng của hệ phái nào.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và dễ hiểu đối với độc giả Việt Nam hiện đại. Dùng đại từ “con” vì lời truyền trực tiếp hướng đến Giăng trong văn mạch. Các địa danh được phiên âm theo lối Việt hóa dễ đọc; phép lặp “đến” giữ nhịp liệt kê và tính phân phối của nguyên ngữ.
