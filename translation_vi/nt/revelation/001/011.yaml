- from: 'nói rằng: “Điều con thấy, hãy viết vào một quyển sách[a] rồi gửi đến bảy hội thánh: đến Ê-phê-sô, đến Si-miệc-na, đến Pẹt-ga-mum, đến Thy-a-ti-ra, đến Sạt-đe, đến Phi-la-đen-phi-a và đến Lao-đi-xê.”'
  to: 'nói rằng: “Điều ông thấy, hãy viết vào một quyển sách[a], rồi gửi cho bảy hội thánh tại Ê-phê-sô, Si-miệc-nơ, Pẹt-ga-môn, Thi-a-ti-rơ, Sạt-đe, Phi-la-đen-phi và Lao-đi-xê.”'
  rationale: Bản sửa loại bỏ đại từ “con” có tính diễn giải, làm trơn cú pháp chỉ các hội thánh và địa điểm của họ, đồng thời chuẩn hóa các địa danh theo lối phiên âm Việt hóa dễ đọc. Nghĩa của mệnh lệnh, phạm vi điều được thấy và tính đa nghĩa của βιβλίον đều được giữ nguyên.
