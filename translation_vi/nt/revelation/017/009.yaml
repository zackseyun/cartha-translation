revisions:
- from: 'Đây cần có tâm trí khôn ngoan: Bảy cái đầu là bảy ngọn núi, trên đó người đàn bà ngồi[a]; chúng cũng là bảy vua.'
  to: 'Đây là điều cần có sự khôn ngoan: Bảy đầu là bảy ngọn núi[a], trên đó người đàn bà ngồi; và chúng là bảy vua.'
  rationale: Bản sửa diễn đạt công thức mở đầu theo tiếng Việt tự nhiên, đồng thời giữ chức năng kêu gọi sự khôn ngoan để hiểu biểu tượng. Các biểu tượng và quan hệ giữa chúng được giữ nguyên, không xác định bảy núi hay bảy vua là thực thể lịch sử nào. “Bảy đầu” và “và chúng là bảy vua” sát nghĩa, gọn hơn; chú thích vẫn bảo tồn khả năng dịch ὄρη là “đồi”.
