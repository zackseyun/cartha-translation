id: REV.17.9
reference: Revelation 17:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: vi
  text: 'Đây là điều cần có sự khôn ngoan: Bảy đầu là bảy ngọn núi[a], trên đó người đàn bà ngồi; và chúng là bảy vua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bảy ngọn đồi”. Từ Hy Lạp có thể chỉ núi hoặc đồi; “núi” là cách dịch trực tiếp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: Đây cần có
  rationale: Trong ngữ cảnh lời giải thích mang tính khải huyền, cách diễn đạt này tự nhiên trong tiếng Việt và dẫn vào yêu cầu về sự nhận biết, đồng thời không biến ὧδε thành một chỉ từ thuần túy về địa điểm.
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: tâm trí khôn ngoan
  rationale: Giữ ý về năng lực nhận biết có sự khôn ngoan mà không diễn giải thành một giáo lý hay cách hiểu cụ thể; toàn cụm được diễn đạt tự nhiên là “Đây cần có tâm trí khôn ngoan”.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: bảy cái đầu
  rationale: Giữ nguyên hình tượng biểu trưng, không giải thích trước biểu tượng ấy.
- source_word: ἑπτὰ ὄρη
  choice: bảy ngọn núi
  rationale: ὄρη trực tiếp chỉ núi; cách dịch này tránh mặc nhiên đồng nhất hình tượng với “bảy ngọn đồi” của Rô-ma. Nghĩa thay thế được ghi ở chú thích.
- source_word: ὅπου ... κάθηται ἐπ’ αὐτῶν
  choice: trên đó người đàn bà ngồi
  rationale: Chuyển cấu trúc Hy Lạp có ὅπου và ἐπ’ αὐτῶν sang tiếng Việt tự nhiên, vẫn giữ rõ vị trí người đàn bà ngồi trên bảy ngọn núi.
- source_word: ἡ γυνὴ
  choice: người đàn bà
  rationale: Giữ nhân vật biểu trưng mà không thêm cách nhận diện mang tính diễn giải.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: chúng cũng là bảy vua
  rationale: “Chúng” quy chiếu về bảy cái đầu; “cũng” thể hiện phép nối thêm một sự đồng nhất biểu trưng, tránh tách câu thành lời khẳng định không liên hệ rằng có bảy vua.
theological_decisions:
- issue: Ý nghĩa lịch sử của bảy cái đầu, bảy ngọn núi và bảy vua
  choice: Giữ nguyên các sự tương ứng biểu trưng mà câu văn nêu ra, không xác định chúng là Rô-ma, các hoàng đế, các vương quốc hay một hệ thống khải huyền cụ thể.
  alternative: Giải thích “bảy ngọn núi” là bảy ngọn đồi của Rô-ma, hoặc xác định “bảy vua” là một danh sách vua hay đế quốc cụ thể.
  rationale: Bản văn xác lập các mối tương ứng nhưng không tự giải quyết đầy đủ đối tượng lịch sử; bản dịch cần bảo toàn sự mở và căng thẳng diễn giải ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người đàn bà” phù hợp với nhân vật biểu trưng trong phân đoạn; dùng “vua” thay vì diễn giải thành “vương quốc” hay “nhà cai trị”. Cấu trúc “Đây cần có tâm trí khôn ngoan” truyền đạt tự nhiên chức năng của câu mở đầu, dù tiếng Hy Lạp sát chữ hơn là “Đây là tâm trí có sự khôn ngoan”.
