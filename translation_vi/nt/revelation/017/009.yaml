  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các tương ứng biểu tượng: bảy đầu, bảy núi, người đàn bà ngồi trên đó, và bảy vua. Tuy nhiên, “Đây cần có tâm trí khôn ngoan” không tự nhiên và chưa phản ánh rõ chức năng thành ngữ của Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν, là lời báo rằng điều sau đây đòi hỏi sự khôn ngoan/nhận thức. “Cũng” trong mệnh đề cuối thêm một sắc thái không được biểu thị rõ bởi καί.'
  naturalness: Cần sửa câu mở đầu để thành tiếng Việt hiện đại, trang trọng và sáng nghĩa hơn. “Bảy đầu” tự nhiên hơn “bảy cái đầu” trong hình tượng khải huyền. Việc đặt ký hiệu chú thích ngay sau “núi” làm đối tượng của chú thích từ vựng rõ ràng hơn.
  terminology: Giữ “ngọn núi”, với chú thích “ngọn đồi”, phù hợp với ὄρη và không áp đặt cách đồng nhất với Rô-ma. Giữ “người đàn bà” cho ἡ γυνή và “vua” cho βασιλεῖς, không diễn giải các biểu tượng thành nhân vật hay vương quốc cụ thể.
  issues:
  - severity: medium
    issue: Câu mở đầu “Đây cần có tâm trí khôn ngoan” chưa tự nhiên và không diễn đạt sáng rõ công thức Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν.
    rationale: Cấu trúc Hy Lạp theo sát chữ là “Đây là trí/tâm trí có sự khôn ngoan”, nhưng trong ngữ cảnh lời kêu gọi phân định, tiếng Việt tự nhiên là “Đây là điều cần có sự khôn ngoan.” Cách này truyền đạt chức năng câu mà không giải thích biểu tượng.
  - severity: low
    issue: “Bảy cái đầu” và “chúng cũng là bảy vua” kém gọn và thêm sắc thái nhẹ.
    rationale: Trong tiếng Việt, “bảy đầu” tự nhiên khi nói về hình tượng con thú. Καί chỉ cần dịch là “và”; “cũng” có thể gợi một ý bổ sung/đối chiếu mạnh hơn bản gốc.
  - severity: low
    issue: Ký hiệu chú thích đặt sau “ngồi” thay vì ngay sau “núi”.
    rationale: Chú thích giải thích ὄρη, nên neo chú thích sau từ “núi” sẽ minh bạch hơn.
