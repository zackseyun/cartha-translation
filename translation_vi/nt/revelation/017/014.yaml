revisions:
- from: Những kẻ ấy sẽ gây chiến chống lại Chiên Con[a], nhưng Chiên Con sẽ chiến thắng chúng, vì Ngài là Chúa của các chúa và Vua của các vua; còn những người ở với Ngài là những người được kêu gọi, được tuyển chọn và trung tín.
  to: Những kẻ ấy sẽ gây chiến chống lại Chiên Con[a], và Chiên Con sẽ chiến thắng chúng, vì Ngài là Chúa của các chúa và Vua của các vua; những người ở với Ngài là những người được kêu gọi, được tuyển chọn và trung tín.
  rationale: Thay “nhưng” bằng “và” và bỏ “còn” để không áp đặt quan hệ đối lập mà nguyên văn chỉ nối bằng καί. Các lựa chọn từ vựng còn lại được giữ nguyên vì sát nguồn, tự nhiên và phù hợp với thuật ngữ của Khải Huyền.
