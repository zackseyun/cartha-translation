  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: các thế lực ấy sẽ giao chiến chống Chiên Con, Chiên Con sẽ chiến thắng vì địa vị tối thượng của Ngài, và những người ở với Ngài được mô tả là được kêu gọi, được tuyển chọn và trung tín. Tuy nhiên, δύο liên từ καί được dịch lần lượt là “nhưng” và “còn”, tạo sắc thái đối lập mà nguyên văn không nêu rõ. “Và” cùng cách đặt mệnh đề cuối không có “còn” giữ liên kết phối hợp của tiếng Hy Lạp trung tính hơn.'
  naturalness: “Gây chiến chống lại,” “Chiên Con,” “Chúa của các chúa,” “Vua của các vua,” và chuỗi “được kêu gọi, được tuyển chọn và trung tín” đều tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Bản sửa chỉ làm câu trung tính hơn về quan hệ logic mà vẫn trôi chảy.
