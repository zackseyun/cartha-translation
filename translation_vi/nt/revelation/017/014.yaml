id: REV.17.14
reference: Revelation 17:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: vi
  text: Những kẻ ấy sẽ gây chiến chống lại Chiên Con[a], và Chiên Con sẽ chiến thắng chúng, vì Ngài là Chúa của các chúa và Vua của các vua; những người ở với Ngài là những người được kêu gọi, được tuyển chọn và trung tín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dịch sát là “sẽ gây chiến với Chiên Con”; trong văn cảnh, cụm này có nghĩa là gây chiến chống lại Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Những kẻ ấy
  rationale: Giữ sắc thái chỉ định và quy chiếu về các vua cùng những thế lực đứng về phía con thú trong văn cảnh; “kẻ” cũng phù hợp với vai trò đối nghịch của họ mà không thêm danh tính mới.
- source_word: μετὰ τοῦ ἀρνίου πολεμήσουσιν
  choice: sẽ gây chiến chống lại Chiên Con
  rationale: Trong kết cấu chiến tranh này, μετά với sở hữu cách chỉ đối tượng bị giao chiến. “Chống lại” làm rõ quan hệ thù địch, tránh để người đọc hiểu lầm rằng họ cùng phe với Chiên Con.
- source_word: ἀρνίον
  choice: Chiên Con
  rationale: Danh xưng Kitô học đặc trưng trong sách Khải Huyền; cách dịch này trang trọng, quen thuộc và giữ được hình ảnh con chiên.
- source_word: νικήσει
  choice: sẽ chiến thắng
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ chủ đề chiến thắng lặp lại của động từ νικάω trong sách Khải Huyền.
- source_word: ὅτι
  choice: vì
  rationale: 'Giữ rõ quan hệ nguyên nhân: địa vị tối cao của Chiên Con là lý do cho chiến thắng của Ngài.'
- source_word: κύριος κυρίων
  choice: Chúa của các chúa
  rationale: Giữ cấu trúc danh hiệu tối thượng của nguyên văn và dùng “Chúa” như tước hiệu của Chiên Con.
- source_word: βασιλεὺς βασιλέων
  choice: Vua của các vua
  rationale: Giữ thành ngữ diễn tả vương quyền tối cao, đồng thời tạo thế song hành với “Chúa của các chúa”.
- source_word: οἱ μετ’ αὐτοῦ
  choice: những người ở với Ngài
  rationale: Cách diễn đạt tự nhiên, không xác định quá mức căn tính hoặc vai trò của những người đồng hành với Chiên Con.
- source_word: κλητοὶ
  choice: được kêu gọi
  rationale: Giữ âm hưởng thần học của κλητός nhưng không quyết định lời kêu gọi là lời mời hay sự triệu gọi hữu hiệu.
- source_word: ἐκλεκτοὶ
  choice: được tuyển chọn
  rationale: Diễn đạt dễ hiểu và sát nghĩa, không nhập vào bản dịch một hệ thống thần học về sự tuyển chọn.
- source_word: πιστοί
  choice: trung tín
  rationale: Trong chuỗi ba phẩm tính này, “trung tín” bao hàm sự kiên định và lòng trung thành tốt hơn cách dịch chỉ nhấn mạnh hành vi tin.
theological_decisions:
- issue: Danh xưng và ngôn ngữ chiến thắng của Chiên Con
  choice: Dùng “Chiên Con” và “sẽ chiến thắng” để giữ vốn từ Kitô học cùng chủ đề νικάω của sách Khải Huyền.
  alternative: “con chiên ... sẽ thắng được” hoặc “Chiên Con ... sẽ đắc thắng”
  rationale: Bản dịch duy trì sự liên kết nội tại của sách mà không thêm một kết luận tín lý vượt quá câu văn.
- issue: Ba từ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: Dịch là “được kêu gọi, được tuyển chọn và trung tín”.
  alternative: “được mời, được chọn và trung thành”
  rationale: Giữ cả ba đặc điểm và sự căng thẳng thần học giữa chúng, không giải quyết thay cho nguyên văn các tranh luận về sự kêu gọi, tuyển chọn hay tiến trình cứu rỗi.
- issue: Quan hệ của mệnh đề cuối với chiến thắng của Chiên Con
  choice: Dùng dấu chấm phẩy và “còn” để trình bày những người ở với Ngài như một nhóm được mô tả trong cùng lời tuyên bố.
  alternative: Hiểu họ là đồng chủ thể trực tiếp của động từ “sẽ chiến thắng” và dịch “cùng với những người...”
  rationale: Nguyên văn không có động từ riêng cho nhóm này, nên không nên khẳng định quá mức quan hệ cú pháp; cách dịch giữ họ gắn với Chiên Con nhưng không nói rõ hơn văn bản rằng họ trực tiếp tham chiến hay chiến thắng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Viết hoa “Chiên Con”, “Chúa”, “Vua” và đại từ “Ngài” để thể hiện đây là các danh xưng cùng quy chiếu tôn kính dành cho nhân vật trung tâm, không thêm một định nghĩa tín lý ngoài văn bản. Dùng “nhưng” để biểu thị sự tương phản tự nhiên giữa hành động gây chiến và kết quả chiến thắng, dù liên từ Hy Lạp là καί.
