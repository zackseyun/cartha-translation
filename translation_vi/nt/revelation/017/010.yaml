id: REV.17.10
reference: Revelation 17:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: vi
  text: Năm vua đã sụp đổ[a], một vua đang hiện diện, vua kia chưa đến; và khi vua ấy đến, vua ấy phải ở lại ít lâu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: “Năm vua đã ngã xuống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: Năm vua
  rationale: Mạo từ cùng số từ quy chiếu về bảy vua ở câu trước. Tiếng Việt cần nêu lại “vua” để câu tự nhiên và rõ nghĩa; điều này không xác định họ là những nhân vật lịch sử nào.
- source_word: ἔπεσαν
  choice: đã sụp đổ
  rationale: Động từ πίπτω theo nghĩa đen là “ngã,” nhưng trong ngữ cảnh các vua, “sụp đổ” diễn đạt tự nhiên sự thất thế hoặc chấm dứt quyền lực mà không quy định chính xác cách thức.
- source_word: ὁ εἷς ἔστιν
  choice: một vua hiện đang có
  rationale: Giữ nét cô đọng của tiếng Hy Lạp “một vị đang là/có.” “Hiện đang có” diễn đạt sự hiện hữu ở thời điểm được nói đến, không diễn giải thành “đang trị vì.”
- source_word: ὁ ἄλλος
  choice: vua kia
  rationale: ἄλλος chỉ vị còn lại trong chuỗi đối lập với năm vua và một vua; “vua kia” tự nhiên hơn “vua khác” trong cấu trúc này.
- source_word: οὔπω ἦλθεν
  choice: vẫn chưa đến
  rationale: Diễn đạt tự nhiên trạng thái chưa xảy ra cho tới thời điểm nói, đồng thời giữ động từ “đến” của ἔρχομαι.
- source_word: ὅταν ἔλθῃ
  choice: khi vua ấy đến
  rationale: ὅταν với lối giả định chỉ một sự kiện tương lai; “khi” phù hợp hơn “bất cứ khi nào” trong chuỗi kế tiếp này.
- source_word: ὀλίγον
  choice: trong một thời gian ngắn
  rationale: ὀλίγον được dùng theo chức năng trạng từ, chỉ khoảng thời gian ngắn; cách diễn đạt này rõ ràng, tự nhiên và không thêm sắc thái “chỉ” vốn không được biểu thị tường minh.
- source_word: αὐτὸν δεῖ μεῖναι
  choice: vua ấy phải tồn tại
  rationale: δεῖ diễn đạt tính tất yếu; μεῖναι là “ở lại/tiếp tục tồn tại.” Trong ngữ cảnh một vua xuất hiện trong chuỗi lịch sử, “tồn tại” tránh gợi hình ảnh không phù hợp của việc ở lại một địa điểm.
theological_decisions:
- issue: Mức độ cụ thể khi diễn đạt hình ảnh bảy vua
  choice: Nêu danh từ “vua” theo ngữ cảnh trực tiếp nhưng không đồng nhất các vua với nhân vật hay đế quốc cụ thể.
  alternative: 'Giữ hoàn toàn lược danh từ: “Năm đã sụp đổ, một hiện có, người kia chưa đến”; hoặc đưa một sơ đồ nhận diện các hoàng đế La Mã vào bản dịch.'
  rationale: Khải Huyền 17:9–10 tường minh gọi các đối tượng là “bảy vua,” nên bổ sung danh từ trong tiếng Việt giúp câu dễ hiểu. Tuy nhiên, nguyên văn không xác định danh tính của họ, vì vậy bản dịch không giải quyết tranh luận lịch sử-thần học.
- issue: Ý nghĩa của δεῖ
  choice: Dịch là “phải,” giữ tính tất yếu mà không giải thích nguồn gốc của sự tất yếu ấy.
  alternative: Diễn giải là “theo ý định của Đức Chúa Trời, vua ấy chỉ được phép tồn tại.”
  rationale: δεῖ biểu thị điều cần phải xảy ra, nhưng câu không nói tường minh đó là tất yếu do định mệnh, ý định thần thượng hay một nguyên nhân khác; bản dịch giữ nguyên sức căng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu duy trì nhịp liệt kê mang tính khải huyền; dùng “vua” để tránh đại từ mơ hồ trong tiếng Việt nhưng không thêm bất kỳ nhận diện lịch sử nào.
