revisions:
- from: Năm vua đã sụp đổ[a], một vua hiện đang có, vua kia vẫn chưa đến; và khi vua ấy đến, vua ấy phải tồn tại trong một thời gian ngắn.
  to: Năm vua đã sụp đổ[a], một vua đang hiện diện, vua kia chưa đến; và khi vua ấy đến, vua ấy phải ở lại ít lâu.
  rationale: Bản sửa giữ việc nêu «vua», vốn được xác định ở ngữ cảnh liền trước, nhưng không nhận diện các vua hay chuyển mệnh đề «một vua là/đang hiện diện» thành một tuyên bố minh thị về sự trị vì. «Ở lại ít lâu» sát μεῖναι và ὀλίγον hơn «tồn tại trong một thời gian ngắn», đồng thời vẫn giữ sự ngắn ngủi và tính tất yếu của mệnh đề.
  reviewer_model: gpt-5.6-terra
