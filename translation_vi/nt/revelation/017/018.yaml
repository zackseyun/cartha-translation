id: REV.17.18
reference: Revelation 17:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: vi
  text: Người phụ nữ mà ngươi đã thấy chính là thành phố lớn đang có quyền thống trị trên các vua trên đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thành phố lớn có vương quyền trên các vua trên đất.” Cụm từ Hy Lạp nghĩa đen là “có vương quyền/vương quốc,” và cũng có thể chỉ quyền trị vì hay quyền cai trị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: người phụ nữ
  rationale: Trong khải tượng, danh từ này chỉ nhân vật nữ mang tính biểu tượng; “người phụ nữ” tự nhiên và không đưa thêm cách giải thích ngoài bản văn.
- source_word: ἣν εἶδες
  choice: mà ngươi đã thấy
  rationale: Giữ nguyên mệnh đề quan hệ xác định nhân vật mà Giăng đã thấy trong khải tượng; “ngươi” phù hợp với lời thiên sứ trực tiếp nói với Giăng trong văn mạch.
- source_word: πόλις ἡ μεγάλη
  choice: thành phố lớn
  rationale: Chuyển đạt trực tiếp danh từ πόλις và tính từ μεγάλη bằng cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔχουσα βασιλείαν
  choice: đang nắm quyền cai trị
  rationale: Cụm Hy Lạp có nghĩa đen là “có vương quyền/vương quốc”; trong cấu trúc “trên các vua”, trọng tâm là quyền thống trị đang được nắm giữ, không nhất thiết là một lãnh thổ.
- source_word: ἐπὶ τῶν βασιλέων
  choice: các vua
  rationale: Quan hệ quyền lực của ἐπί với sở hữu cách được thể hiện tự nhiên trong toàn cụm “nắm quyền cai trị các vua”, tránh lặp từ “trên” thiếu tự nhiên.
- source_word: τῆς γῆς
  choice: trên đất
  rationale: “Đất” bảo toàn phạm vi rộng của γῆ trong văn chương khải huyền; giới từ “trên” tạo thành cách nói tiếng Việt tự nhiên về các vua ở khắp mặt đất.
theological_decisions:
- issue: Bản chất sự đồng nhất giữa người phụ nữ và thành phố
  choice: 'Dùng lời đồng nhất trực tiếp: “người phụ nữ ... chính là thành phố lớn”.'
  alternative: Diễn giải rằng người phụ nữ “tượng trưng cho” hoặc “đại diện cho” thành phố.
  rationale: Bản Hy Lạp dùng hệ từ ἔστιν, nghĩa là “là”. Cách dịch trực tiếp giữ nguyên hình tượng và sự căng thẳng thần học của bản văn thay vì giải thích biểu tượng ngay trong câu.
- issue: Sắc thái của βασιλεία
  choice: Hiểu theo nghĩa quyền cai trị và ghi chú nghĩa đen có thể là vương quyền hoặc vương quốc.
  alternative: Dịch ngay trong chính văn là “có một vương quốc trên các vua”.
  rationale: Với bổ ngữ “các vua trên đất”, nghĩa quyền thống trị phù hợp với cú pháp và tự nhiên hơn trong tiếng Việt, nhưng chú thích vẫn bảo tồn phạm vi nghĩa và sự mơ hồ của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để duy trì lời xưng hô trực tiếp mang sắc thái Kinh Thánh trong ngữ cảnh thiên sứ nói với Giăng. Cấu trúc “chính là” nhấn rõ lời đồng nhất biểu tượng mà không biến nó thành lời diễn giải.
