  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng trình tự tự sự, nhóm bảy thiên sứ với bảy bát, lời triệu gọi, sự phán xét, và hình ảnh biểu tượng người đàn bà ngồi trên nhiều nước. Tuy nhiên, «đến nói với tôi» dễ hòa hai động từ thành ý “đến để nói với tôi” và làm mờ hai hành động liên tiếp trong nguyên tác: thiên sứ đến, rồi nói với Giăng. Thêm liên từ «và» khôi phục rõ ràng quan hệ này mà không làm câu kém tự nhiên.'
  naturalness: Văn phong trang nghiêm, hiện đại và dễ hiểu. «Gái điếm lớn» giữ hình ảnh mạnh, mang tính luận chiến của πόρνη mà không dùng lối Hán-Việt quá cổ. «Nhiều dòng nước» là cách diễn đạt tự nhiên trong ngữ cảnh biểu tượng và không diễn giải trước ý nghĩa của hình ảnh.
  terminology: «Thiên sứ», «bát», «sự phán xét» và «gái điếm lớn» nhất quán với sắc thái khải huyền. Chú thích về κρίμα nêu các khả năng hợp lệ; chú thích về «đại kỹ nữ» chỉ nên được hiểu là lựa chọn văn phong/truyền thống, không phải một cách giải nghĩa biểu tượng.
