id: REV.17.1
reference: Revelation 17:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: vi
  text: 'Rồi một trong bảy thiên sứ có bảy chiếc bát đến và nói với tôi rằng: “Hãy lại đây! Tôi sẽ chỉ cho ông thấy sự phán xét[a] dành cho gái điếm lớn[b], kẻ ngồi trên nhiều dòng nước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự kết án” hoặc “hình phạt”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch theo lối trang trọng, truyền thống hơn là “đại kỹ nữ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Rồi
  rationale: Diễn tả tự nhiên sự tiếp nối của trình thuật, đồng thời giữ chức năng liên kết của Καὶ.
- source_word: ἦλθεν
  choice: đến
  rationale: 'Động từ aorist của ἔρχομαι ở đây chỉ hành động xảy ra trong trình thuật: thiên sứ đến với người thấy khải tượng.'
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: một trong bảy thiên sứ
  rationale: Chuyển ngữ tự nhiên cấu trúc phân chia, xác định một vị thuộc nhóm bảy thiên sứ.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: có bảy chiếc bát
  rationale: Mệnh đề này xác định nhóm thiên sứ. φιάλη chỉ loại bát rộng, nông dùng trong hình ảnh của sách Khải Huyền; “chiếc bát” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: nói với tôi rằng
  rationale: Gộp cách dẫn lời của tiếng Hy Lạp thành cấu trúc tiếng Việt tự nhiên, trong khi “với tôi” vẫn phản ánh μετά với sở hữu cách.
- source_word: Δεῦρο
  choice: Hãy lại đây!
  rationale: Lời gọi trực tiếp, tự nhiên trong tiếng Việt; dấu chấm than truyền đạt sắc thái triệu gọi mà không thêm nội dung.
- source_word: δείξω σοι
  choice: Tôi sẽ chỉ cho ông thấy
  rationale: Giữ trực tiếp thì tương lai và ý nghĩa khiến người nghe nhìn thấy điều sắp được mặc khải.
- source_word: τὸ κρίμα
  choice: sự phán xét
  rationale: κρίμα có thể bao gồm phán quyết kết tội lẫn hình phạt thi hành. “Sự phán xét” giữ được độ rộng nghĩa đó.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: dành cho gái điếm lớn
  rationale: πόρνη là gái điếm và ở đây là một danh xưng ẩn dụ. “Gái điếm” hiện đại, dễ hiểu và giữ sức nặng của hình ảnh; “lớn” phản ánh trực tiếp μεγάλης mà không xác định trước danh tính biểu tượng.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: kẻ ngồi trên nhiều dòng nước
  rationale: Giữ nguyên hình ảnh biểu tượng “ngồi trên” thay vì giải thích trước ý nghĩa được nêu về sau trong chương. “Nhiều dòng nước” là cách nói tiếng Việt tự nhiên cho ὕδατα πολλά trong ngữ cảnh này.
theological_decisions:
- issue: Phạm vi ý nghĩa của κρίμα trong bối cảnh khải huyền
  choice: sự phán xét
  alternative: sự kết án; hình phạt
  rationale: Câu này mở đầu việc bày tỏ hành động tư pháp đối với người đàn bà. “Sự phán xét” không thu hẹp nghĩa chỉ còn bản án kết tội hoặc chỉ còn việc thi hành hình phạt.
- issue: Danh xưng ẩn dụ πόρνη dành cho Ba-by-lôn
  choice: gái điếm lớn
  alternative: đại kỹ nữ
  rationale: Bản dịch giữ nguyên ẩn dụ tình dục mang tính tiên tri và luận chiến nhưng không áp đặt một cách nhận diện giáo phái cụ thể đối với Ba-by-lôn. “Gái điếm” dễ hiểu hơn trong tiếng Việt hiện đại, còn “đại kỹ nữ” trang trọng hơn nhưng mang sắc thái Hán-Việt và ít thông dụng.
- issue: Hình ảnh ngồi trên nhiều dòng nước
  choice: giữ nguyên hình ảnh biểu tượng
  alternative: diễn giải các dòng nước là các dân tộc và quốc gia
  rationale: Ý nghĩa biểu tượng được chính chương này giải thích về sau; không nên đưa lời giải thích ấy vào câu 1 và làm mất tiến trình mặc khải của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Cách dẫn lời được Việt hóa tự nhiên; các hình ảnh pháp đình và biểu tượng của nguyên tác vẫn được giữ. Các dấu chú thích được đặt ngay sau những từ mà chúng giải thích.
