id: REV.17.17
reference: Revelation 17:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: vi
  text: 'Vì Đức Chúa Trời đã đặt vào lòng họ ý muốn thực hiện ý định của Ngài: có chung một ý định[a] và trao vương quyền của họ cho con thú, cho đến khi những lời của Đức Chúa Trời được ứng nghiệm[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “làm nên một ý định”; cũng có thể dịch: “có chung một ý định” hoặc “nhất trí”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được hoàn tất” hoặc “thành hiện thực”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: đã đặt vào lòng họ
  rationale: Giữ hình ảnh về tấm lòng trong thành ngữ Hy Lạp, đồng thời diễn đạt tự nhiên việc Đức Chúa Trời tác động đến ý muốn bên trong của họ.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: thực hiện ý định của Ngài
  rationale: γνώμη ở đây chỉ ý định hay chủ đích; “thực hiện ý định” tự nhiên và không giải thích quá mức thành một kế hoạch chi tiết.
- source_word: ποιῆσαι μίαν γνώμην
  choice: đồng lòng
  rationale: Cụm Hy Lạp cô đọng, sát nghĩa là “làm nên một ý định”; “đồng lòng” chuyển tải sự thống nhất về ý chí và mục tiêu trong tiếng Việt tự nhiên.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: trao vương quyền của họ
  rationale: Trong ngữ cảnh các vua trao quyền cai trị cho con thú, βασιλεία hợp lý hơn khi hiểu là quyền trị vì thay vì lãnh thổ; “vương quyền” giữ sắc thái chính trị và số ít của nguyên văn.
- source_word: τῷ θηρίῳ
  choice: cho con thú
  rationale: Duy trì hình tượng nhất quán của θηρίον trong sách Khải Huyền.
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: cho đến khi những lời của Đức Chúa Trời được ứng nghiệm
  rationale: “Được ứng nghiệm” phù hợp với văn cảnh tiên tri và diễn tả việc những lời ấy đi đến chỗ hoàn tất.
theological_decisions:
- issue: Quyền tể trị của Đức Chúa Trời và hành động thực sự của các vua
  choice: Giữ cả hành động chủ động của Đức Chúa Trời—“đặt vào lòng họ”—lẫn việc họ đồng lòng trao quyền cho con thú.
  alternative: Làm nhẹ vai trò của Đức Chúa Trời thành “cho phép”, hoặc diễn giải mạnh hơn nguyên văn theo hướng tất định.
  rationale: Câu Hy Lạp khẳng định đồng thời sự tác động của Đức Chúa Trời và hành động có chủ ý của các vua; bản dịch không giải quyết thay cho nguyên văn sự căng thẳng thần học này.
- issue: Quan hệ cú pháp giữa hai mệnh đề với ποιῆσαι
  choice: Hiểu “đồng lòng trao” là hành động thống nhất thực hiện ý định của Đức Chúa Trời.
  alternative: 'Tách thành ba hành động song song rõ rệt: thực hiện ý định của Ngài, hành động với một mục đích, và trao vương quốc.'
  rationale: Cách diễn đạt tiếng Việt gọn và tự nhiên, phản ánh chuỗi động từ nguyên mẫu của Hy Lạp mà không làm mất sự thống nhất ý chí của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi phổ biến trong tiếng Việt Tin Lành; “con thú” giữ hình tượng khải huyền; “vương quyền” làm rõ sắc thái quyền cai trị của βασιλεία trong ngữ cảnh.
