id: REV.17.7
reference: Revelation 17:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: vi
  text: 'Thiên sứ nói với tôi: “Tại sao ông kinh ngạc? Tôi sẽ cho ông biết điều huyền nhiệm về người phụ nữ và về con thú chở[a] bà ấy—con thú có bảy đầu và mười sừng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mang”.
    reason: βάσταζω có thể có nghĩa là mang, chở, hoặc nâng đỡ. “Chở” diễn đạt tự nhiên nhất hình ảnh con thú mang người phụ nữ; chú thích bảo lưu một phương án từ vựng gần nghĩa.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: kinh ngạc
  rationale: Diễn đạt sự sửng sốt, kinh ngạc trước khải tượng, mạnh hơn ý tò mò đơn thuần và phù hợp với thì quá khứ trong câu hỏi.
- source_word: μυστήριον
  choice: điều huyền nhiệm
  rationale: Chỉ một thực tại vốn bị che giấu nhưng sắp được bày tỏ; cách dịch này giữ sắc thái khải huyền mà không biến từ này thành một câu đố đơn thuần.
- source_word: γυναικός
  choice: người phụ nữ
  rationale: Trong ngữ cảnh, γυνή chỉ nhân vật nữ mang tính biểu tượng; không có quan hệ hôn nhân nào khiến phải dịch là “người vợ”.
- source_word: θηρίου
  choice: con thú
  rationale: Giữ nguyên hình tượng khải huyền và sự nhất quán của thuật ngữ chỉ thế lực thù nghịch trong sách Khải Huyền.
- source_word: βαστάζοντος
  choice: đang mang
  rationale: Diễn đạt trực tiếp hình ảnh con thú mang người phụ nữ; phân từ hiện tại cũng được thể hiện bằng “đang”.
- source_word: ἔχοντος
  choice: có
  rationale: Chuyển phân từ thành mệnh đề miêu tả tự nhiên trong tiếng Việt mà vẫn gắn rõ bảy đầu và mười sừng với con thú.
- source_word: κεφαλάς
  choice: đầu
  rationale: Giữ nguyên hình ảnh cụ thể có vai trò trung tâm trong khải tượng.
- source_word: κέρατα
  choice: sừng
  rationale: Giữ nguyên biểu tượng khải huyền quen thuộc và mối liên hệ với các đoạn khác trong sách.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi nguyên nhân tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: ἐρῶ σοι
  choice: Tôi sẽ cho ông biết
  rationale: Diễn đạt tự nhiên lời báo trước rằng thiên sứ sắp giải bày điều huyền nhiệm, không thêm ý vượt quá động từ “nói”.
theological_decisions:
- issue: Đối tượng được mô tả là có bảy đầu và mười sừng
  choice: Gắn lời mô tả rõ ràng với con thú.
  alternative: Để cấu trúc lỏng hơn, có thể khiến lời mô tả bị hiểu là nói về người phụ nữ hoặc toàn bộ điều huyền nhiệm.
  rationale: Các phân từ giống đực/trung số ít τοῦ βαστάζοντος và τοῦ ἔχοντος hòa hợp với θηρίου, chứ không hòa hợp với γυναικός. Dấu gạch ngang và việc lặp lại “con thú” làm rõ quan hệ cú pháp vốn đã rõ trong tiếng Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” thay cho lối gọi cổ hơn; đại từ “ông” tạo lời thoại tự nhiên, tôn trọng mà không quá thân mật. “Điều huyền nhiệm” tránh sắc thái giáo phái và giữ ý về thực tại ẩn giấu được mặc khải.
