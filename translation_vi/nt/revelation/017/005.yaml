  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: vi
  text: 'Trên trán người đàn bà có ghi một tên: “Huyền nhiệm, Ba-by-lôn Lớn, mẹ của các gái mại dâm và các điều ghê tởm của toàn cõi đất.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: Trên trán người đàn bà
  rationale: Diễn đạt trực tiếp vị trí của dòng chữ; lặp lại “người đàn bà” tự nhiên và rõ đối tượng hơn đại từ đơn lập trong tiếng Việt.
- source_word: ὄνομα γεγραμμένον
  choice: có viết một danh hiệu
  rationale: ὄνομα ở đây chỉ tên gọi mang tính tước hiệu trong dòng chữ. “Có viết” giữ ý bị động/kết quả của γεγραμμένον mà vẫn tự nhiên trong tiếng Việt.
- source_word: μυστήριον
  choice: Huyền nhiệm
  rationale: Giữ sắc thái khải huyền và thần học của từ, đồng thời đặt như một phần của danh hiệu được ghi; không thu hẹp nghĩa thành “bí mật”.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Ba-by-lôn Vĩ Đại
  rationale: Phiên âm tên riêng Βαβυλών theo cách quen thuộc trong Kinh Thánh tiếng Việt và chuyển ἡ μεγάλη thành tước hiệu trang trọng.
- source_word: ἡ μήτηρ τῶν πορνῶν
  choice: mẹ của các gái mại dâm
  rationale: Dịch cụ thể πόρνη là người nữ hành nghề mại dâm, giữ hình ảnh tình dục và đạo đức của nguyên văn mà tránh từ miệt thị quá mức.
- source_word: τῶν βδελυγμάτων τῆς γῆς
  choice: những điều ghê tởm trên đất
  rationale: “Những điều ghê tởm” truyền đạt tính đáng ghét về tôn giáo và đạo đức của βδελύγματα; “trên đất” là cách diễn đạt tiếng Việt tự nhiên cho phạm vi thuộc thế gian trong ngữ cảnh Khải Huyền.
theological_decisions:
- issue: μυστήριον là một phần của dòng danh hiệu hay lời dẫn giải thích ý nghĩa tượng trưng của danh hiệu
  choice: 'Đặt “Huyền nhiệm” trong chính dòng danh hiệu: “Huyền nhiệm, Ba-by-lôn Vĩ Đại...”'
  alternative: 'Hiểu là lời dẫn: “có viết một danh hiệu, một huyền nhiệm: Ba-by-lôn Vĩ Đại...”'
  rationale: Nguyên văn Hy Lạp không có dấu câu và cho phép cả hai cách hiểu. Cách dịch chính đi theo khả năng μυστήριον thuộc dòng chữ, còn cách hiểu khả hữu kia được giữ trong chú thích để không xóa bỏ sự mơ hồ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ sắc thái khải huyền. Dùng “gái mại dâm” thay cho từ cổ hoặc mang tính nhục mạ, và giữ sự mơ hồ về chức năng của μυστήριον bằng chú thích.
