revisions:
- from: 'Trên trán người đàn bà có viết một danh hiệu: “Huyền nhiệm[a], Ba-by-lôn Vĩ Đại, mẹ của các gái mại dâm và những điều ghê tởm trên đất.”'
  to: 'Trên trán người đàn bà có ghi một tên: “Huyền nhiệm, Ba-by-lôn Lớn, mẹ của các gái mại dâm và các điều ghê tởm của toàn cõi đất.”'
  rationale: Chỉnh “danh hiệu” thành “tên” để bám sát ὄνομα; chuyển “trên đất” thành “của toàn cõi đất” để bảo toàn quan hệ genitive và phạm vi khải huyền của τῆς γῆς; và dùng “Ba-by-lôn Lớn” như cách chuyển ἡ μεγάλη tự nhiên, trung tính hơn. Chú thích tiếp tục bảo lưu sự mơ hồ có thực về vai trò của μυστήριον.
  reviewer_model: gpt-5.6-terra
