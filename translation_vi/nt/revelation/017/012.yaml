id: REV.17.12
reference: Revelation 17:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: vi
  text: Mười sừng mà ông đã thấy là mười vua. Họ chưa nhận được vương quốc, nhưng cùng với con thú, họ nhận quyền hành với tư cách là vua trong một giờ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong một thời gian ngắn.” Cách nói “một giờ” trong hình ảnh khải huyền có lẽ chỉ một khoảng thời gian ngắn và có giới hạn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: những chiếc sừng
  rationale: Dịch sát hình ảnh khải huyền là “sừng”; chính câu này giải thích biểu tượng ấy là các vua, nên không diễn giải thành “thế lực” trong chính văn.
- source_word: βασιλεῖς
  choice: các vua
  rationale: Đây là nghĩa từ vựng trực tiếp, đồng thời vẫn để ngỏ tính biểu tượng của các vua trong bối cảnh khải huyền.
- source_word: βασιλείαν
  choice: vương quốc
  rationale: Giữ sự phân biệt giữa βασιλείαν, tức vương quốc hoặc quyền trị vì, và ἐξουσίαν, tức quyền hành, ở vế sau.
- source_word: οὔπω ἔλαβον
  choice: chưa nhận được
  rationale: Diễn đạt tự nhiên trạng thái hiện tại của những người cho đến lúc ấy vẫn chưa nhận vương quốc.
- source_word: ἐξουσίαν
  choice: quyền hành
  rationale: Chỉ quyền lực hoặc thẩm quyền được ban để cai trị, nhưng không đồng nhất với “vương quốc” trong cùng câu.
- source_word: ὡς βασιλεῖς
  choice: với tư cách là vua
  rationale: Thể hiện trực tiếp địa vị hoặc vai trò mà trong đó họ nhận quyền hành, thay vì dịch mơ hồ là “giống như vua”.
- source_word: μίαν ὥραν
  choice: trong một giờ
  rationale: Giữ nguyên cách nói khải huyền của nguyên văn; khả năng chỉ một thời gian ngắn, có giới hạn được nêu trong chú thích.
- source_word: λαμβάνουσιν
  choice: nhận
  rationale: Giữ thì hiện tại giàu tính trực hiện của lời khải huyền; ngữ cảnh vẫn có thể hàm ý sự việc sắp xảy đến.
- source_word: μετὰ τοῦ θηρίου
  choice: cùng với con thú
  rationale: Diễn đạt sự đồng thời và liên kết với con thú một cách tự nhiên.
- source_word: θηρίου
  choice: con thú
  rationale: Giữ hình ảnh nhất quán của θηρίον trong sách Khải Huyền, không diễn giải danh tính biểu tượng.
theological_decisions:
- issue: Mười vua là các quân vương theo nghĩa đen hay các nhà cai trị hoặc thế lực mang tính biểu tượng
  choice: Giữ cách dịch từ vựng “mười vua” và không giải nghĩa biểu tượng trong chính văn.
  alternative: mười nhà cai trị mang tính biểu tượng; mười thế lực chính trị
  rationale: Nguyên văn nói rõ “mười vua”, còn thể loại khải huyền cho thấy khả năng biểu tượng. Bản dịch giữ nguyên sự căng thẳng này thay vì quyết định thay người đọc.
- issue: “Một giờ” là khoảng thời gian theo nghĩa đen hay hình ảnh chỉ thời gian ngắn
  choice: Giữ “trong một giờ” trong chính văn và nêu khả năng nghĩa bóng trong chú thích.
  alternative: trong một thời gian ngắn; trong chốc lát
  rationale: μίαν ὥραν theo hình thức là “một giờ”, nhưng trong hình ảnh khải huyền có thể nhấn mạnh sự ngắn ngủi và giới hạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho đại từ ngôi thứ hai hướng đến người thấy khải tượng, tránh sắc thái cổ của “ngươi”; giữ các hình ảnh “sừng”, “vua”, “một giờ” và “con thú” thay vì diễn giải biểu tượng.
