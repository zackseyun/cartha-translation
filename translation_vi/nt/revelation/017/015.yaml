id: REV.17.15
reference: Revelation 17:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: vi
  text: 'Người nói với tôi: “Các vùng nước mà ông đã thấy, nơi con điếm ngồi, là các dân, các đám đông, các nước và các thứ tiếng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại trong lời kể mang tính sống động; tiếng Việt tự nhiên dùng “nói” mà không cần đánh dấu thì.
- source_word: Τὰ ὕδατα
  choice: Những dòng nước
  rationale: Giữ hình ảnh số nhiều của ὕδατα, đồng thời diễn đạt tự nhiên hơn “các nước” vốn dễ bị hiểu nhầm là các quốc gia.
- source_word: ἡ πόρνη
  choice: con điếm
  rationale: Diễn đạt trực tiếp, phổ thông và giữ sắc thái miệt thị mạnh của danh từ Hy Lạp trong ngữ cảnh biểu tượng.
- source_word: λαοὶ
  choice: các dân
  rationale: Giữ nghĩa tập thể của λαοί và phân biệt với ἔθνη.
- source_word: ὄχλοι
  choice: các đám đông
  rationale: Phản ánh nghĩa cụ thể “đám đông/quần chúng” và phân biệt với λαοί.
- source_word: ἔθνη
  choice: các nước
  rationale: Trong chuỗi các tập thể nhân loại, cách dịch này tự nhiên và giữ sự phân biệt với “các dân”.
- source_word: γλῶσσαι
  choice: các thứ tiếng
  rationale: Ở đây γλῶσσαι chỉ các cộng đồng được nhận diện theo ngôn ngữ hoặc chính các ngôn ngữ; “các thứ tiếng” giữ cách nói quen thuộc của văn chương Khải Huyền.
theological_decisions:
- issue: Ý nghĩa biểu tượng của những dòng nước
  choice: 'Giữ lời giải thích đồng nhất trực tiếp: “là các dân, các đám đông, các nước và các thứ tiếng.”'
  alternative: Diễn giải thành toàn thể nhân loại hoặc các dân tộc trên thế giới.
  rationale: Bản Hy Lạp liệt kê bốn nhóm và không tự đồng nhất chúng với một công thức thần học rộng hơn; bản dịch không nên thu hẹp hay mở rộng.
- issue: Chủ thể không được nêu của λέγει
  choice: “Người nói với tôi”
  alternative: “Thiên sứ nói với tôi” hoặc “Ông nói với tôi”.
  rationale: Câu Hy Lạp chỉ có động từ ngôi thứ ba số ít với chủ thể được hiểu từ văn cảnh. “Người” giữ được tính không nêu danh trong câu này mà vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” cho đại từ số ít μοι trong lời thiên sứ nói với người được mặc khải; tránh lối quá cổ. Chuỗi bốn danh từ được giữ riêng biệt để bảo toàn nhịp và phạm vi của nguyên văn.
