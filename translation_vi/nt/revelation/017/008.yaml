revisions:
- from: Con thú mà ngươi đã thấy từng có, hiện không còn, và sắp từ vực thẳm đi lên rồi đi đến chỗ diệt vong. Những người sống trên đất—những người có tên không được ghi trong sách sự sống từ khi thế gian được dựng nên—sẽ kinh ngạc khi thấy con thú, vì nó từng có, hiện không còn và sẽ hiện diện.[a]
  to: Con thú mà ngươi đã thấy từng có, hiện không còn, và sắp từ vực thẳm đi lên, rồi đi đến chỗ diệt vong. Những người sống trên đất—những người mà tên họ không được ghi trong sách sự sống từ khi thế gian được dựng nên—sẽ kinh ngạc khi thấy con thú, vì nó từng có, hiện không còn và sẽ hiện diện.[a]
  rationale: Chỉnh sửa chỉ nhằm làm rõ ranh giới cú pháp giữa việc con thú sắp đi lên và việc nó đi đến diệt vong, đồng thời làm câu quan hệ về tên được ghi tự nhiên hơn. Cách dịch chính và chú thích tiếp tục giữ mở cả cách hiểu nguyên nhân lẫn nội dung cho ὅτι, cũng như các sắc thái khả dĩ của παρέσται.
