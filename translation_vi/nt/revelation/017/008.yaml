id: REV.17.8
reference: Revelation 17:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: vi
  text: Con thú mà ngươi đã thấy từng có, hiện không còn, và sắp từ vực thẳm đi lên, rồi đi đến chỗ diệt vong. Những người sống trên đất—những người mà tên họ không được ghi trong sách sự sống từ khi thế gian được dựng nên—sẽ kinh ngạc khi thấy con thú, vì nó từng có, hiện không còn và sẽ hiện diện.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ kinh ngạc khi thấy rằng con thú từng có, hiện không còn và sẽ đến” hoặc “sẽ xuất hiện.” Từ Hy Lạp có thể giới thiệu nguyên nhân (“vì”) hoặc nội dung (“rằng”); động từ cuối có nghĩa là “sẽ hiện diện,” và cũng có thể hàm ý “sẽ đến.”'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: con thú
  rationale: Giữ sắc thái đáng sợ và tính biểu tượng khải huyền của từ này, đồng thời là cách gọi tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: từng có, hiện không còn
  rationale: Diễn đạt rõ sự tương phản về thời gian trong tiếng Việt mà không giải thích thêm bản chất sự tồn tại của con thú.
- source_word: μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου
  choice: sắp từ vực thẳm đi lên
  rationale: “Sắp” truyền đạt sắc thái cận kề của μέλλει; “đi lên” giữ hướng chuyển động của ἀναβαίνειν; “vực thẳm” tránh cách diễn giải mang tính truyền thống như “vực không đáy.”
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: đi đến chỗ diệt vong
  rationale: Giữ hình ảnh chuyển động hướng tới kết cục hủy diệt, không xác định thêm cách thức hay thời điểm.
- source_word: θαυμασθήσονται
  choice: sẽ kinh ngạc
  rationale: Trong ngữ cảnh này, động từ chỉ sự sửng sốt, thán phục trước điều lạ thường; “kinh ngạc” tự nhiên và không hàm ý họ tôn thờ.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: những người sống trên đất
  rationale: Giữ công thức lặp lại trong sách Khải Huyền bằng lối nói rõ ràng, dễ hiểu.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: những người có tên không được ghi
  rationale: Phản ánh dạng số ít phân phối của “tên” trong tiếng Hy Lạp bằng cấu trúc tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: trong sách sự sống
  rationale: Tiếng Việt tự nhiên nói tên được ghi “trong” một cuốn sách; cách chọn này không làm thay đổi ý nghĩa của giới từ Hy Lạp trong ngữ cảnh.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: từ khi thế gian được dựng nên
  rationale: Truyền đạt mốc thời gian từ lúc thế giới được thiết lập bằng cách diễn đạt hiện đại nhưng trang trọng.
- source_word: βλεπόντων
  choice: khi thấy
  rationale: Diễn đạt tự nhiên giá trị thời gian của phân từ, nối sự kinh ngạc với việc nhìn thấy con thú.
- source_word: παρέσται
  choice: sẽ hiện diện
  rationale: Giữ nghĩa căn bản về sự có mặt của dạng tương lai πάρειμι và duy trì thế đối lập với “hiện không còn,” thay vì mặc nhiên diễn giải là sống lại.
theological_decisions:
- issue: Phạm vi bổ nghĩa của “từ khi thế gian được dựng nên”
  choice: Gắn cụm từ này với việc tên không được ghi trong sách sự sống.
  alternative: Hiểu cụm từ theo một hệ thống thần học rộng hơn về sự tuyển chọn hoặc gắn nó với một ý niệm từ câu khác.
  rationale: Trật tự cú pháp Hy Lạp đặt cụm thời gian ngay sau lời nói về việc ghi tên trong sách sự sống. Bản dịch giữ mối liên hệ này nhưng không giải quyết thêm các câu hỏi thần học mà câu văn không trực tiếp giải thích.
- issue: Sắc thái của παρέσται
  choice: sẽ hiện diện
  alternative: sẽ đến; sẽ xuất hiện
  rationale: Dạng tương lai của πάρειμι có thể chỉ sự hiện diện hoặc đến nơi. “Sẽ hiện diện” giữ sự đối xứng với “hiện không còn” và không đưa ý niệm phục sinh vào câu một cách quá mức.
- issue: Chức năng của ὅτι trong mệnh đề cuối
  choice: 'Hiểu theo nghĩa nguyên nhân: “vì nó từng có...”'
  alternative: 'Hiểu theo nghĩa nội dung: họ kinh ngạc “rằng nó từng có...”'
  rationale: Cả hai cách đều có thể phù hợp về ngữ pháp. Bản chính chọn quan hệ nguyên nhân tự nhiên trong văn cảnh, còn chú thích bảo tồn cách hiểu kia.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được giữ để phù hợp với lời thiên sứ nói trực tiếp với Giăng trong văn phong khải huyền; các mệnh đề thời gian được diễn đạt tự nhiên nhưng vẫn giữ nhịp đối lập cô đọng của nguyên văn.
