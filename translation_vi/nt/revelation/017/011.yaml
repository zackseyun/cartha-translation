id: REV.17.11
reference: Revelation 17:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: vi
  text: Và con thú đã có mà nay không có, chính nó là thứ tám[a], và từ bảy vị ấy[b], rồi đi đến chỗ diệt vong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chính nó là vị vua thứ tám.” Danh từ “vua” được hiểu theo ngữ cảnh nhưng không có trong câu Hy Lạp.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “là một trong bảy vị ấy.” Tiếng Hy Lạp sát hơn là “từ bảy vị ấy”, có thể chỉ nguồn gốc, tư cách thành viên hoặc mối liên hệ gần gũi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: con thú
  rationale: Trong sách Khải Huyền, từ này là thuật ngữ khải huyền chỉ một quyền lực quái dị chống nghịch Đức Chúa Trời; “con thú” tự nhiên trong tiếng Việt và giữ được sức nặng biểu tượng.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: đã có mà hiện không có
  rationale: Giữ sự đối xứng rõ nét của nguyên văn và tiếng vọng với công thức lặp lại trong chương, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτὸς
  choice: chính nó
  rationale: Thể hiện sắc thái nhấn mạnh của αὐτός và quy chiếu rõ về “con thú”, không mặc nhiên biến biểu tượng này thành một nhân vật nam.
- source_word: ὄγδοός
  choice: kẻ thứ tám
  rationale: Tiếng Hy Lạp chỉ có tính từ số thứ tự giống đực và không nêu danh từ “vua”. “Kẻ thứ tám” giữ danh từ hàm ẩn ở mức khái quát, phù hợp ngữ cảnh nói về các vua mà không thêm thẳng “vua” vào câu.
- source_word: ἐκ τῶν ἑπτά
  choice: xuất thân từ bảy kẻ kia
  rationale: Diễn đạt trực tiếp ý nguồn gốc hoặc xuất phát của ἐκ, đồng thời không thu hẹp nghĩa thành “một trong bảy”; “kẻ kia” giúp cụm từ tự nhiên và liên kết với bảy vua vừa được nhắc đến.
- source_word: εἰς ἀπώλειαν
  choice: đến chỗ diệt vong
  rationale: Truyền đạt số phận hủy diệt chung cuộc với sắc thái trang trọng, rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ὑπάγει
  choice: đi
  rationale: Giữ thì hiện tại sinh động và chuyển động trực tiếp của động từ mà không thêm sắc thái thời gian ngoài nguyên văn.
theological_decisions:
- issue: Có nên nói rõ danh từ được hàm ý là “vua” hay không
  choice: Dùng “kẻ thứ tám” trong chính văn, không thêm “vua”.
  alternative: “vị vua thứ tám”
  rationale: Ngữ cảnh gần nói về các vua nên cách hiểu này hợp lý, nhưng câu Hy Lạp không có danh từ βασιλεύς. Chính văn giữ sự cô đọng, còn chú thích nêu cách bổ sung theo ngữ cảnh.
- issue: Nên hiểu ἐκ τῶν ἑπτά là nguồn gốc hay tư cách thành viên
  choice: Dịch “xuất thân từ bảy kẻ kia”.
  alternative: “là một trong bảy kẻ kia”
  rationale: Giới từ ἐκ có thể chỉ nguồn gốc, xuất xứ hoặc quan hệ gần gũi; nguyên văn không buộc phải hiểu cụ thể rằng con thú là một thành viên trong số bảy. Bản dịch giữ độ mở biểu tượng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp nghịch lý “đã có mà hiện không có”, tránh thêm “vua” vào chính văn, và dùng hai chú thích để bảo tồn các điểm mơ hồ thật sự của nguyên văn.
