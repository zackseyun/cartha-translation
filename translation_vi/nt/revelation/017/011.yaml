  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các thành tố chính của câu Hy Lạp, gồm sự nhấn mạnh của αὐτός, số thứ tự hàm ẩn ở ὄγδοός và kết cục εἰς ἀπώλειαν. Tuy nhiên, “xuất thân từ” thu hẹp ἐκ τῶν ἑπτά vào ý nguồn gốc/xuất xứ mạnh hơn mức nguyên văn bảo đảm. Cụm “từ bảy vị ấy” giữ được tính mở về nguồn gốc, thuộc nhóm hay quan hệ với bảy vị trong ngữ cảnh.
  naturalness: '“Con thú đã có mà hiện không có” và “đi đến chỗ diệt vong” tự nhiên, trang trọng. Tuy vậy, “chính nó là kẻ thứ tám” tạo lệch quy chiếu không cần thiết: “kẻ” thường chỉ người, trong khi chủ ngữ trực tiếp là “con thú”. Dạng vị ngữ “là thứ tám” vừa tự nhiên vừa bảo toàn danh từ hàm ẩn.'
  terminology: “Con thú” là lựa chọn thích hợp, nhất quán với thuật ngữ khải huyền. Không nên đưa “vua” vào chính văn, vì βασιλεύς không xuất hiện trong câu này; chú thích có thể nêu cách hiểu theo ngữ cảnh. “Diệt vong” diễn đạt phù hợp ἀπώλεια.
