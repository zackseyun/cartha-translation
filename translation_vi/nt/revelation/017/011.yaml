  - severity: low
    issue: “kẻ thứ tám” không phù hợp tối ưu với quy chiếu “con thú”.
    rationale: Dù ngữ cảnh nói về các vua, “kẻ” trong tiếng Việt chủ yếu quy chiếu người và khiến chính văn ngả về một nhân vật. “Thứ tám” giữ danh từ hàm ẩn như tiếng Hy Lạp và tránh thêm quy chiếu.
