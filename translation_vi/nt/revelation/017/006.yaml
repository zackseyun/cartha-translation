revisions:
- from: Tôi thấy người đàn bà ấy say máu các thánh đồ và máu những người làm chứng cho Đức Giê-su[a]. Khi thấy bà, tôi vô cùng kinh ngạc.
  to: Tôi thấy người đàn bà ấy say sưa vì máu của các thánh đồ và vì máu của những người làm chứng của Đức Giê-su[a]. Thấy bà, tôi vô cùng kinh ngạc.
  rationale: Bản sửa làm rõ hình ảnh “say sưa vì máu” của μεθύουσαν ἐκ τοῦ αἵματος, thay vì dùng cách nói có thể nghiêng sang nghĩa khát máu trong tiếng Việt hiện đại. Đồng thời, đổi “cho Đức Giê-su” thành “của Đức Giê-su” để không thu hẹp sắc thái sở hữu cách trong τῶν μαρτύρων Ἰησοῦ. Các yếu tố còn lại, gồm “các thánh đồ,” cường độ của sự kinh ngạc, và chú thích từ vựng, được giữ nguyên về nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung chính của câu: người đàn bà ở trong tình trạng say do máu các thánh và máu các người làm chứng, rồi người thấy bà kinh ngạc mạnh mẽ. Tuy nhiên, “say máu” trong tiếng Việt hiện đại có thể nghiêng về nghĩa “khát máu/tàn bạo” hơn là hình ảnh nguyên văn về sự say sưa do máu. Ngoài ra, “cho Đức Giê-su” diễn giải sở hữu cách Ἰησοῦ theo một hướng (“làm chứng cho/về”), trong khi nguyên văn để mở quan hệ “của Đức Giê-su.”'
  naturalness: “Say sưa vì máu của...” là cách diễn đạt hiện đại, rõ nghĩa và vẫn giữ hình ảnh khải huyền ghê rợn. “Thấy bà, tôi vô cùng kinh ngạc” tự nhiên, trang trọng và phản ánh tốt phân từ ἰδὼν cùng cấu trúc nhấn mạnh θαῦμα μέγα.
  terminology: “Các thánh đồ” là thuật ngữ Kinh Thánh quen thuộc để chỉ τῶν ἁγίων. Giữ “những người làm chứng của Đức Giê-su” trong bản chính bảo toàn độ mở của μαρτύρων Ἰησοῦ; chú thích nêu phương án “người tử đạo” phù hợp với ngữ cảnh máu đổ mà không ép nghĩa ấy vào bản văn chính.
  issues:
