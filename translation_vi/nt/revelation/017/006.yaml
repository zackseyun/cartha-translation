    rationale: μεθύουσαν ἐκ τοῦ αἵματος mô tả tình trạng người đàn bà bị say sưa bởi máu. Thêm “say sưa vì máu của” làm sáng rõ quan hệ này, đồng thời bảo toàn hình ảnh nguyên văn.
  - severity: low
    issue: “những người làm chứng cho Đức Giê-su” thu hẹp phần nào sở hữu cách Ἰησοῦ.
    rationale: Giới từ “cho” ưu tiên ý làm chứng hướng về Đức Giê-su. “Của Đức Giê-su” giữ được tính cô đọng và độ mở của tiếng Hy Lạp về quan hệ thuộc về Ngài hay lời chứng liên hệ với Ngài.
  revised_text: Tôi thấy người đàn bà ấy say sưa vì máu của các thánh đồ và vì máu của những người làm chứng của Đức Giê-su[a]. Thấy bà, tôi vô cùng kinh ngạc.
