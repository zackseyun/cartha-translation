id: REV.17.6
reference: Revelation 17:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: vi
  text: Tôi thấy người đàn bà ấy say sưa vì máu của các thánh đồ và vì máu của những người làm chứng của Đức Giê-su[a]. Thấy bà, tôi vô cùng kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người tử đạo vì Đức Giê-su.” Từ Hy Lạp có thể có nghĩa là “người làm chứng” hoặc “người tử đạo”; ở đây, việc nhắc đến máu của họ khiến nghĩa “người tử đạo” đặc biệt thích hợp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: say máu
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ nguyên hình ảnh ghê rợn về tình trạng say sưa vì máu đổ.
- source_word: τῶν ἁγίων
  choice: các thánh đồ
  rationale: Chỉ những người thuộc về Đức Chúa Trời và được biệt riêng cho Ngài; cách gọi ngắn gọn, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: những người làm chứng cho Đức Giê-su
  rationale: Giữ nghĩa căn bản của μάρτυς là người làm chứng. Giới từ “cho” diễn đạt tự nhiên việc họ làm chứng về hoặc vì Đức Giê-su, trong khi ngữ cảnh nhắc đến máu cho thấy họ đã chịu chết vì lời chứng ấy.
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: tôi vô cùng kinh ngạc
  rationale: Diễn đạt tự nhiên cường độ của cấu trúc đồng căn trong tiếng Hy Lạp mà không tạo lối lặp gượng gạo.
- source_word: ἰδὼν αὐτὴν
  choice: Khi thấy bà
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên, gắn trực tiếp việc nhìn thấy bà với phản ứng kinh ngạc.
theological_decisions:
- issue: Nghĩa của μαρτύρων trong bối cảnh bắt bớ
  choice: những người làm chứng cho Đức Giê-su
  alternative: những người tử đạo vì Đức Giê-su
  rationale: Từ này có thể chỉ “người làm chứng” và về sau mang nghĩa “người tử đạo”. Việc đề cập đến máu khiến sắc thái tử đạo đặc biệt thích hợp, nhưng bản chính giữ nghĩa từ vựng rộng hơn và chú thích phương án theo ngữ cảnh.
- issue: Sắc thái của sở hữu cách Ἰησοῦ
  choice: cho Đức Giê-su
  alternative: của Đức Giê-su
  rationale: Sở hữu cách có thể gợi quan hệ thuộc về Đức Giê-su hoặc lời chứng hướng đến Ngài. “Cho Đức Giê-su” là tiếng Việt tự nhiên trong ngữ cảnh làm chứng, nhưng không nhằm loại bỏ sắc thái thuộc về Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Say máu” giữ sức mạnh của hình ảnh khải huyền; “vô cùng kinh ngạc” truyền đạt cấu trúc nhấn mạnh của nguyên văn mà không quá cổ kính.
