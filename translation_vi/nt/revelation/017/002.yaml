id: REV.17.2
reference: Revelation 17:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: vi
  text: Các vua trên đất đã gian dâm[b] với người đàn bà ấy[a], và những người cư ngụ trên đất[c] đã say vì rượu của sự dâm loạn[d] của bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với bà ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Ở đây, ngôn ngữ “gian dâm/dâm loạn” có lẽ mang ý nghĩa biểu tượng về những liên minh băng hoại, thờ thần tượng hoặc bất trung, nhưng vẫn giữ nguyên sức mạnh của hình ảnh tình dục.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “cư dân trên đất.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “rượu của sự mại dâm của bà.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: chính với người đàn bà ấy mà
  rationale: Giữ quan hệ đại từ nối về người đàn bà ở câu trước; cấu trúc «chính… mà» giúp câu tiếng Việt tự nhiên và vẫn làm nổi bật đối tượng của hành vi.
- source_word: ἐπόρνευσαν
  choice: đã phạm tội dâm loạn
  rationale: Giữ nguyên hình ảnh tình dục và phạm vi nghĩa tương đối rộng của động từ, đồng thời không thu hẹp biểu tượng thành riêng sự thờ thần tượng hay liên minh chính trị.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: Phản ánh cách dùng rộng của γῆ trong Khải Huyền và duy trì cách diễn đạt lặp lại của sách.
- source_word: ἐμεθύσθησαν
  choice: đã say
  rationale: Diễn đạt tự nhiên trạng thái kết quả của động từ thụ động mà không buộc phải thêm tác nhân.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: những người cư ngụ trên đất
  rationale: Giữ dạng diễn đạt bằng động từ của cụm từ quen thuộc trong Khải Huyền, thay vì nén thành danh từ «cư dân».
- source_word: ἐκ τοῦ οἴνου
  choice: vì rượu
  rationale: ἐκ ở đây biểu thị nguồn hoặc nguyên nhân; «vì» truyền đạt quan hệ nhân quả tự nhiên trong tiếng Việt mà vẫn giữ nguyên ẩn dụ rượu.
- source_word: τῆς πορνείας αὐτῆς
  choice: dâm loạn của bà
  rationale: Dùng cùng trường từ vựng với động từ ἐπόρνευσαν, giữ hình ảnh tình dục và ý nghĩa biểu tượng rộng; đại từ «bà» quy chiếu rõ về người đàn bà.
theological_decisions:
- issue: Có nên diễn giải πορνεύω/πορνεία ngay trong chính văn thành sự thờ thần tượng hoặc liên minh chính trị-tôn giáo bất trung hay không
  choice: Giữ hình ảnh «dâm loạn» trong chính văn, không diễn giải thu hẹp
  alternative: phạm tội ngoại tình thuộc linh; liên kết với bà trong sự thờ thần tượng
  rationale: Khải Huyền chủ ý dùng hình ảnh tình dục để biểu trưng sự băng hoại và bất trung về tôn giáo-chính trị. Giữ nguyên ẩn dụ bảo toàn sức nặng cùng độ mở thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. «Cư ngụ» duy trì sắc thái văn chương vừa phải và sự nhất quán với cụm từ lặp lại trong Khải Huyền; «dâm loạn» đủ rộng để giữ cả nghĩa trực tiếp lẫn nghĩa biểu tượng.
