revisions:
- from: Chính với người đàn bà ấy[a] mà các vua trên đất đã phạm tội dâm loạn[b], và những người cư ngụ trên đất[c] đã say vì rượu dâm loạn[d] của bà.
  to: Các vua trên đất đã gian dâm[b] với người đàn bà ấy[a], và những người cư ngụ trên đất[c] đã say vì rượu của sự dâm loạn[d] của bà.
  rationale: 'Bản sửa loại bỏ sự nhấn mạnh không có trong nguyên văn, dùng «gian dâm với» để phản ánh trực tiếp động từ πορνεύω cùng giới từ μετὰ, và làm rõ chuỗi sở thuộc trong «rượu của sự dâm loạn của bà». Các chú thích được giữ đúng vị trí: a cho đại từ quan hệ, b cho trường nghĩa biểu tượng của πορνεύω/πορνεία, c cho cụm κατοικοῦντες τὴν γῆν, và d cho lựa chọn «mại dâm».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:24:55Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng hai mệnh đề, các chủ thể và hình ảnh biểu tượng của nguyên văn. Tuy nhiên, «Chính ... mà» thêm sắc thái nhấn mạnh không có trong tiếng Hy Lạp, và «rượu dâm loạn của bà» dễ khiến “dâm loạn” bổ nghĩa trực tiếp cho “rượu”, thay vì diễn đạt genitive «rượu của sự dâm loạn của bà».
  naturalness: «Các vua trên đất đã gian dâm với người đàn bà ấy» là cách nói tự nhiên, trang trọng và vẫn giữ được hình ảnh tình dục-biểu tượng. «Rượu của sự dâm loạn của bà» rõ quan hệ sở thuộc/đặc trưng trong nguyên văn hơn.
  terminology: Dùng nhất quán «gian dâm/sự dâm loạn», không diễn giải thành thờ thần tượng hoặc bất trung thuộc linh trong chính văn. «Những người cư ngụ trên đất» bảo lưu cụm từ đặc trưng của Khải Huyền.
  issues:
  - severity: medium
    issue: Sắc thái nhấn mạnh thừa trong «Chính với người đàn bà ấy mà».
    rationale: μεθ’ ἧς chỉ có nghĩa “với người đàn bà ấy/với bà ấy”; nguyên văn không có yếu tố tương ứng với «chính ... mà».
  - severity: medium
    issue: Cụm «rượu dâm loạn của bà» mơ hồ về quan hệ ngữ pháp.
    rationale: τοῦ οἴνου τῆς πορνείας αὐτῆς là “rượu của sự dâm loạn của bà ấy.” Cần nêu rõ danh từ trừu tượng «sự dâm loạn» để tránh hiểu rằng rượu tự nó “dâm loạn”.
  - severity: low
    issue: «Phạm tội dâm loạn» thêm cách đóng khung pháp lý/đạo đức không được phát biểu rõ bằng động từ πορνεύω.
    rationale: «Gian dâm với» tương ứng trực tiếp hơn với cấu trúc πορνεύω μετὰ và vẫn giữ sức nặng biểu tượng của hình ảnh.
