revisions:
- from: Những người này đồng một lòng[a], và họ trao quyền năng cùng thẩm quyền của mình cho con thú.
  to: Những người này đều đồng lòng[a], và họ trao quyền lực cùng thẩm quyền của mình cho con thú.
  rationale: Bản sửa thay cách nói không chuẩn “đồng một lòng” bằng “đều đồng lòng”, vẫn giữ được phạm vi nghĩa rộng của thành ngữ Hy Lạp. “Quyền lực” phù hợp hơn với năng lực hữu hiệu trong bối cảnh chính trị, còn “thẩm quyền” giữ sự phân biệt với quyền hành/quyền cai trị. Chú thích được chỉnh để phản ánh chính xác hơn trường nghĩa của γνώμη và không áp đặt riêng nghĩa “mục đích”.
  reviewer_model: gpt-5.6-terra
