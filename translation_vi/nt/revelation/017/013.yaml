source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: vi
  text: Những người này đều đồng lòng[a], và họ trao quyền lực cùng thẩm quyền của mình cho con thú.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “có cùng một mục đích.” Cụm Hy Lạp nói sát là “có một ý kiến”; trong ngữ cảnh, cụm này có thể diễn tả sự đồng thuận, quyết tâm hoặc mục đích chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Những người này
  rationale: Đại từ chỉ định quy chiếu về mười vua đã được nhắc đến; cách dịch này giữ rõ lực chỉ định và tự nhiên trong tiếng Việt.
- source_word: μίαν γνώμην ἔχουσιν
  choice: đồng một lòng
  rationale: Cụm Hy Lạp nói sát là “có một ý nghĩ/quan điểm”, có thể chỉ sự đồng thuận, chung quyết tâm hoặc chung mục đích. “Đồng một lòng” giữ được sắc thái hiệp nhất mà không thu hẹp nghĩa chỉ còn một mục tiêu.
- source_word: δύναμιν
  choice: quyền năng
  rationale: Trong bối cảnh chính trị-khải huyền, từ này chỉ năng lực hay sức mạnh hữu hiệu; “quyền năng” phân biệt được với thẩm quyền cai trị ở từ kế tiếp.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Từ này nhấn mạnh quyền hành hoặc quyền cai trị, khác với năng lực hữu hiệu của δύναμις.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: quyền năng cùng thẩm quyền của mình
  rationale: Giữ lại hai danh từ khác biệt trong nguyên văn; “của mình” quy chiếu tự nhiên về chủ ngữ “họ” trong tiếng Việt.
- source_word: τῷ θηρίῳ
  choice: cho con thú
  rationale: “Con thú” là cách dịch trực tiếp, dễ hiểu cho hình tượng khải huyền θηρίον; ngữ cảnh xác định rõ đối tượng.
- source_word: διδόασιν
  choice: họ trao
  rationale: Thì hiện tại được giữ trong lời thuật khải tượng. “Trao” diễn đạt tự nhiên hành động giao quyền năng và thẩm quyền cho một đối tượng, không thêm ý cưỡng ép hay từ bỏ vĩnh viễn.
theological_decisions:
- issue: Sắc thái của thành ngữ μίαν γνώμην ἔχουσιν trong bối cảnh chính trị-khải huyền
  choice: đồng một lòng
  alternative: có cùng một mục đích
  rationale: Cụm từ có thể nói đến chung quan điểm, quyết tâm hoặc mục đích. “Đồng một lòng” bảo tồn độ rộng nghĩa và sự căng mở của nguyên văn, thay vì xác định riêng là mục đích.
- issue: Phân biệt δύναμις với ἐξουσία
  choice: quyền năng cùng thẩm quyền
  alternative: sức mạnh và quyền cai trị
  rationale: Dịch bằng hai thuật ngữ riêng để không nhập năng lực hữu hiệu và quyền hành cai trị thành một khái niệm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đồng một lòng” để giữ sắc thái thành ngữ và tính hàm nghĩa; dùng “quyền năng” và “thẩm quyền” nhằm duy trì sự phân biệt từ vựng trong nguyên văn.
