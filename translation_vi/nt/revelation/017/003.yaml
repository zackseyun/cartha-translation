id: REV.17.3
reference: Revelation 17:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: vi
  text: Người ấy đem tôi đi vào một vùng hoang vắng trong Thánh Linh.[a] Tôi thấy một người phụ nữ ngồi trên một con thú đỏ thắm, đầy những tên phạm thượng, có bảy đầu và mười sừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong thần trí.” Cụm từ Hy Lạp có thể chỉ một trạng thái thuộc linh hoặc việc được Thánh Linh đưa đi; trong sách Khải Huyền, cụm từ này thường mở đầu một trải nghiệm khải tượng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: đưa ... vào
  rationale: Động từ diễn tả việc chuyển người thuật chuyện đến một nơi khác trong trải nghiệm khải tượng; “đưa ... vào” tự nhiên trong tiếng Việt và đi liền rõ ràng với đích đến.
- source_word: εἰς ἔρημον
  choice: vào một nơi hoang vắng
  rationale: ἔρημος có thể chỉ vùng hoang vu, đồng vắng hoặc nơi không người; cách dịch này giữ nghĩa rộng và phản ánh dạng không có mạo từ, không thu hẹp thành sa mạc cát.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Trong sách Khải Huyền, cụm từ này thường mở đầu một trải nghiệm khải tượng và có khả năng nói đến tác động của Thánh Linh; ghi chú giữ lại khả năng hiểu là trạng thái thuộc linh.
- source_word: γυναῖκα
  choice: một người phụ nữ
  rationale: Cách dịch trực tiếp, tự nhiên của danh từ làm tân ngữ cho “tôi thấy”.
- source_word: καθημένην ἐπὶ
  choice: ngồi trên
  rationale: Diễn đạt trực tiếp tư thế và vị trí của người phụ nữ trên con thú.
- source_word: θηρίον
  choice: con thú
  rationale: Thuật ngữ khải huyền nhất quán chỉ sinh vật mang tính biểu tượng; “con thú” tự nhiên và không thêm cách giải thích.
- source_word: κόκκινον
  choice: đỏ tươi
  rationale: κόκκινος chỉ màu đỏ thắm hoặc đỏ tươi; lựa chọn này rõ nghĩa trong tiếng Việt hiện đại mà vẫn giữ hình ảnh màu sắc nổi bật.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: mình đầy những danh hiệu phạm thượng
  rationale: γέμοντα có nghĩa là “đầy”; ὀνόματα trong ngữ cảnh có thể là các tên hoặc danh xưng mang tính phạm thượng. “Danh hiệu” diễn đạt tự nhiên việc các tên được mang hoặc ghi trên con thú mà không thêm ý “phủ kín” vốn không được nói rõ.
- source_word: ἔχων
  choice: có
  rationale: Cách diễn đạt tiếng Việt gọn và tự nhiên cho phân từ tiếp tục mô tả con thú.
- source_word: κεφαλὰς ἑπτὰ
  choice: bảy đầu
  rationale: Bản dịch trực tiếp, giữ nguyên hình tượng khải huyền.
- source_word: κέρατα δέκα
  choice: mười sừng
  rationale: Bản dịch trực tiếp, giữ nguyên hình tượng khải huyền.
theological_decisions:
- issue: Cách hiểu ἐν πνεύματι
  choice: trong Thánh Linh
  alternative: trong tâm linh; trong trạng thái thuộc linh
  rationale: Cụm từ trong Khải Huyền thường đánh dấu kinh nghiệm khải tượng và có thể hàm ý Thánh Linh là tác nhân. Vì nguyên ngữ không dùng chữ hoa để quyết định cách hiểu, ghi chú bảo tồn khả năng chỉ trạng thái thuộc linh.
- issue: Chủ thể ngầm của ἀπήνεγκέν
  choice: vị ấy
  alternative: thiên sứ ấy; người ấy
  rationale: Động từ Hy Lạp chỉ có chủ thể ngôi ba số ít, được nhận diện từ ngữ cảnh trước là thiên sứ. “Vị ấy” giữ liên kết ngữ cảnh mà không lặp lại hoặc bổ sung danh xưng không hiện diện trong chính câu này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “nơi hoang vắng” thay vì từ cổ hoặc nghĩa hẹp “sa mạc.” Câu được chia nhịp tự nhiên trong tiếng Việt, đồng thời giữ chuỗi hình ảnh và sự mơ hồ thần học của nguyên ngữ.
