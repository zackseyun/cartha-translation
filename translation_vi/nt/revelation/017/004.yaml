revisions:
- from: Người đàn bà mặc áo màu tím và đỏ tươi, trang sức bằng vàng, đá quý và ngọc trai. Trong tay bà cầm một chén vàng đầy những điều ghê tởm và những thứ ô uế do sự gian dâm của bà[a].
  to: Người đàn bà ấy mặc y phục màu tía và đỏ tươi, được trang sức bằng vàng, đá quý và ngọc trai; tay bà cầm một chén vàng đầy những điều ghê tởm và những thứ ô uế của sự vô luân về tình dục của bà[a].
  rationale: 'Bản sửa giữ nguyên trình tự và toàn bộ các thành tố của câu Hy Lạp: y phục màu tía và đỏ tươi, sự tô điểm bằng vàng, đá quý, ngọc trai, rồi chiếc chén vàng chứa các điều ghê tởm và các thứ ô uế. Sửa cấu trúc tiếng Việt cho trôi chảy hơn, dùng quan hệ «của» thay vì «do» để không áp đặt quan hệ nhân quả, và chọn một cách dịch rộng cho πορνεία kèm chú thích về các lựa chọn hợp lệ.'
  reviewer_model: gpt-5.6-terra
