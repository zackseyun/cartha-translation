id: REV.17.4
reference: Revelation 17:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: vi
  text: Người đàn bà ấy mặc y phục màu tía và đỏ tươi, được trang sức bằng vàng, đá quý và ngọc trai; tay bà cầm một chén vàng đầy những điều ghê tởm và những thứ ô uế của sự vô luân về tình dục của bà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Sự vô luân về tình dục» cũng có thể dịch là «mại dâm» hoặc «gian dâm»; trong sách Khải Huyền, từ Hy Lạp này có thể mang cả nghĩa đen lẫn nghĩa biểu tượng về sự bất trung và thờ thần tượng.
    reason: Nêu các khả năng từ vựng của πορνεία và bảo toàn lực nghĩa vừa đen vừa biểu tượng trong văn cảnh khải huyền.
lexical_decisions:
- source_word: περιβεβλημένη
  choice: mặc áo
  rationale: Diễn đạt tự nhiên trạng thái được mặc y phục, phù hợp với kết cấu ngoại vi ἦν + phân từ hoàn thành mà không làm câu tiếng Việt nặng nề.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: màu tím và đỏ tươi
  rationale: Giữ hai màu sắc xa hoa, nổi bật của nguyên văn; “đỏ tươi” cụ thể và tự nhiên hơn từ Hán-Việt ít thông dụng “đỏ điều”.
- source_word: κεχρυσωμένη
  choice: trang sức bằng
  rationale: Thể hiện việc được tô điểm xa hoa, đồng thời không xác định vàng và các vật quý được gắn hay phủ theo cách nào.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: vàng, đá quý và ngọc trai
  rationale: Giữ đầy đủ ba loại vật trang sức; “đá quý” được dùng theo nghĩa loại chung dù λίθῳ ở số ít.
- source_word: ποτήριον χρυσοῦν
  choice: một chén vàng
  rationale: Cách nói gọn, tự nhiên và chính xác cho chiếc chén làm bằng vàng.
- source_word: γέμον
  choice: đầy
  rationale: Phản ánh trực tiếp trạng thái chiếc chén chứa đầy những gì theo sau.
- source_word: βδελυγμάτων
  choice: những điều ghê tởm
  rationale: Giữ sắc thái đạo đức và tôn giáo mạnh của từ Hy Lạp nhưng vẫn dễ hiểu với độc giả hiện đại.
- source_word: τὰ ἀκάθαρτα
  choice: những thứ ô uế
  rationale: Giữ dạng danh từ hóa số nhiều và sắc thái vừa nghi lễ vừa đạo đức của nguyên văn.
- source_word: πορνείας
  choice: sự gian dâm
  rationale: Trong tiếng Việt Kinh Thánh hiện đại, “gian dâm” có thể gợi cả hành vi tình dục bất chính lẫn sự bất trung mang tính biểu tượng, phù hợp văn cảnh Khải Huyền.
theological_decisions:
- issue: πορνεία trong hình ảnh khải huyền có thể mang nghĩa tình dục theo nghĩa đen và sự bất trung/thờ thần tượng theo nghĩa biểu tượng
  choice: sự gian dâm
  alternative: sự mại dâm; sự vô luân về tình dục
  rationale: “Sự gian dâm” giữ được sức nặng đạo đức và khả năng dùng theo nghĩa biểu tượng, không thu hẹp hình ảnh chỉ vào mại dâm thương mại hay chỉ giải thích thành thờ thần tượng.
- issue: Quan hệ của cụm τῆς πορνείας αὐτῆς với τὰ ἀκάθαρτα
  choice: những thứ ô uế do sự gian dâm của bà
  alternative: những thứ ô uế thuộc về sự gian dâm của bà
  rationale: “Do” diễn đạt tự nhiên quan hệ nguồn gốc/liên hệ của sở hữu cách trong tiếng Việt, nhưng không giải thích cụ thể các thứ ô uế ấy là gì.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Tách thành hai câu để tránh chuỗi phân từ dài, nhưng giữ nguyên trình tự hình ảnh: y phục, đồ trang sức, rồi chiếc chén cùng nội dung ô uế.'
