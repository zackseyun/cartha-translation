id: REV.17.16
reference: Revelation 17:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: vi
  text: Mười cái sừng mà ngươi đã thấy, và con thú—chính chúng sẽ ghét gái mại dâm ấy, khiến nó trở nên hoang tàn và trần truồng[a]; chúng sẽ ăn thịt nó[b] và dùng lửa thiêu rụi nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể diễn đạt là “bị lột trần”. Từ Hy Lạp có nghĩa đen là “trần truồng”; trong ngữ cảnh này, hình ảnh còn gợi sự phơi bày và làm nhục công khai.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn nói theo nghĩa đen là “thịt”. Trong hệ thống hình ảnh khải huyền của sách Khải Huyền, cách nói này mô tả sự hủy diệt hoàn toàn và dữ dội.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: những cái sừng
  rationale: Giữ nguyên biểu tượng khải huyền của nguyên văn thay vì diễn giải thành “các vua” hay “các thế lực”; đối tượng biểu trưng được giải thích trong văn cảnh.
- source_word: θηρίον
  choice: con thú
  rationale: Cách dịch quen thuộc, tự nhiên, giữ được sắc thái biểu tượng đáng sợ của θηρίον mà không diễn giải quá mức.
- source_word: πόρνην
  choice: gái mại dâm
  rationale: Tương đương hiện đại, rõ nghĩa và trang trọng hơn các cách gọi miệt thị; danh ngữ có “ấy” để chỉ lại nhân vật đã xuất hiện trong văn cảnh.
- source_word: μισήσουσι
  choice: sẽ căm ghét
  rationale: Diễn đạt trực tiếp thì tương lai và cường độ của μισέω; “căm ghét” tự nhiên trong tiếng Việt và phù hợp chuỗi hành động bạo liệt tiếp theo.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: khiến nó trở nên hoang tàn
  rationale: Giữ cấu trúc gây khiến và trạng thái kết quả của nguyên văn; “hoang tàn” cũng bảo tồn âm hưởng phán xét.
- source_word: γυμνήν
  choice: trần truồng
  rationale: Dịch trực tiếp tính từ Hy Lạp; ý bị phơi bày và làm nhục được ghi chú chứ không thay thế từ ngữ của chính câu.
- source_word: σάρκας
  choice: thịt
  rationale: Trong tiếng Việt, “ăn thịt” là cách diễn đạt trực tiếp và tự nhiên cho hình ảnh cụ thể, dữ dội này; “xác thịt” ở đây kém tự nhiên hơn.
- source_word: φάγονται
  choice: sẽ ăn
  rationale: Giữ nghĩa cơ bản của ἐσθίω, không tăng cường thành “ngấu nghiến” hoặc “nuốt chửng” khi nguyên văn chỉ nói “ăn”.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: dùng lửa thiêu rụi
  rationale: “Thiêu rụi” thể hiện sắc thái đốt cháy hoàn toàn của κατακαίω, còn “dùng lửa” diễn đạt tự nhiên ἐν πυρί.
- source_word: οὗτοι
  choice: chính chúng
  rationale: Phản ánh đại từ số nhiều mang tính nhấn mạnh, quy chiếu chung về mười cái sừng và con thú.
theological_decisions:
- issue: Quan hệ và sự hòa hợp số giữa “mười cái sừng ... cùng với con thú” và các động từ số nhiều
  choice: 'Giữ chủ ngữ tập hợp rồi dùng đại từ nhấn mạnh số nhiều: “—chính chúng sẽ...”'
  alternative: Làm trơn thành “mười cái sừng ... cùng với con thú sẽ...” hoặc xem con thú là thành phần đồng vị với các sừng
  rationale: Nguyên văn nối hình tượng trung tính số nhiều với danh từ trung tính số ít rồi tiếp lại bằng đại từ giống đực số nhiều οὗτοι và các động từ số nhiều. Cách dịch này vừa dễ đọc vừa giữ việc các tác nhân liên minh cùng hành động.
- issue: Bản chất hình ảnh hủy diệt gái mại dâm
  choice: Giữ nguyên ẩn dụ khải huyền, kể cả “ăn thịt” và “thiêu rụi”, không giải mã biểu tượng trong chính văn
  alternative: Dịch trực tiếp gái mại dâm thành một thành phố, đế chế hoặc hệ thống
  rationale: Câu văn trình bày sự phán xét bằng biểu tượng. Việc xác định trực tiếp đối tượng biểu trưng trong bản dịch sẽ giải quyết một vấn đề giải nghĩa mà nguyên câu vẫn trình bày bằng hình ảnh.
- issue: Đại từ chỉ gái mại dâm
  choice: Dùng “nó”
  alternative: Dùng “ả” hoặc lặp lại “người phụ nữ ấy”
  rationale: Trong hình tượng hóa một thành phố/quyền lực dưới dạng gái mại dâm, “nó” giữ khoảng cách và theo tự nhiên tiếng Việt; “ả” thêm sắc thái khinh miệt không nhất thiết nằm trong giá trị từ vựng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Giữ nhịp liệt kê dồn dập của câu Hy Lạp và dấu gạch ngang để thể hiện đại từ tiếp nối có tính nhấn mạnh. Dùng “ngươi” phù hợp lời thiên sứ trực tiếp nói với Giăng trong văn cảnh Kinh Thánh; tránh từ cổ khó hiểu và tránh giải nghĩa biểu tượng ngay trong chính văn.
