source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: vi
  text: 'Người ấy nói với tôi: “Đừng niêm phong[a] những lời tiên tri trong sách này, vì thời điểm đã gần[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đừng giữ kín”. So sánh Đa-ni-ên 12:4, nơi Đa-ni-ên được truyền phải đóng kín lời ấy và niêm phong sách; tại đây mệnh lệnh là ngược lại.
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “vì kỳ hạn đã gần.” Từ Hy Lạp καιρός có thể chỉ thời điểm quyết định hoặc thời điểm đã được định.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: Người nói với tôi
  rationale: Giữ thì hiện tại mang tính kể chuyện của tiếng Hy Lạp, tạo sắc thái sống động; “người” theo ngữ cảnh chỉ nhân vật đang nói mà không thêm danh xưng không có trong câu.
- source_word: Μὴ σφραγίσῃς
  choice: Đừng niêm phong
  rationale: “Niêm phong” diễn đạt trực tiếp hành động đóng kín, đồng thời giữ được âm vang ngôn ngữ tiên tri về việc một mặc khải bị đóng lại hay để ngỏ.
- source_word: τοὺς λόγους
  choice: những lời
  rationale: Giữ dạng số nhiều cụ thể của λόγοι thay vì diễn giải thành “sứ điệp”.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: tiên tri trong sách này
  rationale: Tiếng Việt tự nhiên dùng “những lời tiên tri trong sách này”; cách diễn đạt này bảo toàn quan hệ giữa lời tiên tri và cuốn sách mà không tạo chuỗi sở hữu nặng nề.
- source_word: ὁ καιρὸς
  choice: thời điểm ấy
  rationale: καιρός có thể chỉ một thời điểm mang tính quyết định hoặc đã được định; “thời điểm ấy” tự nhiên và gợi đúng sắc thái hơn từ chung chung “thời gian”, nhưng không xác định thêm lịch trình.
- source_word: ἐγγύς ἐστιν
  choice: đã gần rồi
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại rằng thời điểm đang cận kề, không làm nhẹ đi lời khẳng định về tính gần kề.
theological_decisions:
- issue: Ngôn ngữ về tính gần kề trong bối cảnh khải huyền
  choice: vì thời điểm ấy đã gần rồi
  alternative: vì kỳ hạn đã gần
  rationale: Giữ nguyên sức căng của lời tuyên bố rằng thời điểm đang gần, không áp đặt một lịch trình cánh chung hay giải thích lại “gần” theo một hệ phái.
- issue: Mệnh lệnh trái ngược với Đa-ni-ên 12:4
  choice: Đừng niêm phong
  alternative: Đừng giữ kín
  rationale: Giữ hình ảnh niêm phong cụ thể và sự tương phản liên văn bản, nhưng không đưa phần giải thích vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “niêm phong” để giữ hình ảnh tiên tri; tránh từ cổ “kíp” hoặc lối diễn đạt giáo phái. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
