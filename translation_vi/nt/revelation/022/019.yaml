id: REV.22.19
reference: Revelation 22:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: vi
  text: Và nếu ai bớt đi khỏi những lời của sách tiên tri này, Đức Chúa Trời sẽ lấy đi phần của người ấy khỏi cây sự sống[a] và khỏi thành thánh—những điều được chép trong sách này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “sách sự sống” thay vì “cây sự sống”.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: bớt đi / sẽ lấy đi
  rationale: “Bớt đi” diễn đạt tự nhiên hành vi cắt bỏ khỏi lời tiên tri; “lấy đi” ở mệnh đề sau giữ rõ sự đáp trả tương ứng của Đức Chúa Trời đối với hành vi ấy.
- source_word: λόγων
  choice: những lời
  rationale: Chỉ nội dung bằng lời của lời tiên tri và phù hợp với tính trang trọng của lời cảnh báo về việc sửa đổi văn bản.
- source_word: βιβλίου
  choice: sách
  rationale: “Sách” là cách gọi tự nhiên, dễ hiểu trong tiếng Việt hiện đại, dù vật mang văn bản thời cổ có thể là cuộn sách.
- source_word: προφητείας
  choice: tiên tri
  rationale: Trong cụm “sách tiên tri này”, từ này bảo toàn tính chất và thể loại tiên tri mà không diễn giải thêm thành “sứ điệp tiên tri”.
- source_word: μέρος
  choice: phần
  rationale: Diễn đạt phần được dự hưởng hay dự phần của một người trong các phước lành được nêu, đồng thời không xác định quá mức bản chất thần học của phần ấy.
- source_word: ξύλου τῆς ζωῆς
  choice: cây sự sống
  rationale: Phù hợp với ngữ cảnh Khải Huyền 22:2, 14 và cách gọi quen thuộc trong tiếng Việt.
- source_word: πόλεως τῆς ἁγίας
  choice: thành thánh
  rationale: Cách diễn đạt trang trọng, gọn và sát cụm danh từ Hy Lạp.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: là những điều đã được ghi trong sách này
  rationale: Giữ sắc thái hoàn thành, bị động của γεγραμμένων và để cụm này quy chiếu tự nhiên tới cả cây sự sống lẫn thành thánh.
theological_decisions:
- issue: Dị bản “cây sự sống” và “sách sự sống”
  choice: cây sự sống
  alternative: sách sự sống
  rationale: Bản SBLGNT được cung cấp đọc ξύλου τῆς ζωῆς, được các ấn bản phê bình ủng hộ và phù hợp với ngữ cảnh gần trong Khải Huyền 22. Dị bản quen thuộc “sách sự sống” được giữ trong chú thích.
- issue: Ý nghĩa của “phần” (μέρος)
  choice: Giữ cách nói “phần của người ấy” mà không giải thích thêm
  alternative: Diễn giải thành mất sự cứu rỗi hoặc mất phần thưởng
  rationale: Câu Hy Lạp nêu hậu quả nghiêm trọng nhưng không trực tiếp phân loại hậu quả theo các hệ thống thần học; bản dịch không nên tự ý giải quyết căng thẳng ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc điều kiện được giữ rõ; cách diễn đạt tránh thuật ngữ hệ phái và không diễn giải quá mức hậu quả thần học.
