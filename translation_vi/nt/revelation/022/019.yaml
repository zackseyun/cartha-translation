  to: Và nếu ai bớt đi khỏi những lời của sách tiên tri này, Đức Chúa Trời sẽ lấy đi phần của người ấy khỏi cây sự sống[a] và khỏi thành thánh—những điều được chép trong sách này.
  rationale: 'Bản sửa giữ sát SBLGNT: hành vi bớt khỏi các lời của sách tiên tri được đáp lại bằng việc Đức Chúa Trời lấy đi phần của người ấy khỏi cây sự sống và khỏi thành thánh. Dấu gạch ngang làm rõ rằng “những điều được chép trong sách này” bổ nghĩa cho cả hai đối tượng trước đó, đồng thời bảo toàn sắc thái hoàn thành bị động của γεγραμμένων. Không diễn giải “phần” thành một kết luận thần học cụ thể.'
  reviewer_model: gpt-5.6-terra
