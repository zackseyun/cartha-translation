id: REV.22.20
reference: Revelation 22:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: vi
  text: 'Đấng làm chứng về những điều này phán: “Phải, ta sẽ sớm đến.[a]” A-men! Lạy Chúa Giê-su, xin hãy đến!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ta sẽ đến nhanh chóng.” Trạng từ Hy Lạp có thể nhấn mạnh việc đến gần kề về thời gian hoặc việc đến diễn ra mau lẹ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: phán
  rationale: Động từ hiện tại dẫn lời trực tiếp. Trong tiếng Việt, “phán” tự nhiên và trang trọng khi chủ thể là Chúa Giê-su, nhưng không thêm nội dung ngoài hành vi nói.
- source_word: ὁ μαρτυρῶν
  choice: Đấng làm chứng
  rationale: Phân từ hiện tại dùng như danh từ, chỉ Chúa Giê-su là Đấng đang làm chứng; “làm chứng” giữ rõ sắc thái chứng nhân của μαρτυρέω.
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều của đại từ chỉ định và quy chiếu đến nội dung khải thị vừa được trình bày.
- source_word: Ναί
  choice: Phải
  rationale: Diễn đạt lời xác nhận trực tiếp, trang trọng và tự nhiên trong văn cảnh lời phán; không tăng sắc thái quả quyết như “chắc chắn”.
- source_word: ἔρχομαι
  choice: ta sẽ đến
  rationale: Hiện tại Hy Lạp mang ý nghĩa hướng đến tương lai. Tiếng Việt dùng “sẽ đến” tự nhiên hơn trong lời hứa, còn đại từ “ta” phù hợp với lời Chúa Giê-su tự xưng trong văn phong Kinh Thánh trang trọng.
- source_word: ταχύ
  choice: sớm
  rationale: Trong lời hứa cánh chung, “sớm” diễn đạt tự nhiên ý gần về thời gian; nghĩa “nhanh chóng” được giữ trong chú thích vì trạng từ Hy Lạp có thể mang cả hai sắc thái.
- source_word: Ἀμήν
  choice: A-men
  rationale: Giữ nguyên lời đáp phụng vụ quen thuộc, thể hiện sự đồng tình và lời cầu nguyện.
- source_word: ἔρχου
  choice: xin hãy đến
  rationale: Mệnh lệnh trực tiếp được diễn đạt thành lời khẩn cầu kính cẩn trong tiếng Việt; “xin hãy” giữ cả tính tha thiết lẫn sắc thái cầu nguyện.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Hô cách được diễn đạt tự nhiên bằng “Lạy”; “Chúa” giữ tước hiệu κύριος dành cho Chúa Giê-su.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách dùng tiếng Việt phổ biến.
theological_decisions:
- issue: Ý nghĩa của ταχύ trong lời hứa Chúa Giê-su đến
  choice: sớm
  alternative: nhanh chóng
  rationale: ταχύ có thể nhấn mạnh sự gần kề về thời gian hoặc tốc độ khi việc đến xảy ra. Bản chính chọn “sớm” vì hợp với lời hứa và lời cầu đáp lại, đồng thời chú thích giữ nghĩa thay thế để không giải quyết thay người đọc sự căng thẳng cánh chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính cầu nguyện. Dùng “Đấng” cho danh xưng chỉ Chúa Giê-su, “phán” cho lời của Ngài, và “Lạy Chúa” để thể hiện hô cách tự nhiên. Dấu chú thích [a] đặt ngay sau mệnh đề chứa từ đa nghĩa.
