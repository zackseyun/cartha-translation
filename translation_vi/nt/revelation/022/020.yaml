  source_fidelity: 'Bản dịch chuyển tải đầy đủ cấu trúc và ý nghĩa của bản SBLGNT: chủ thể là “Đấng làm chứng,” đối tượng số nhiều “những điều này,” lời xác nhận Ναί, lời hứa Chúa đến, lời đáp “A-men,” và lời cầu trực tiếp với Chúa Giê-su. “Ta sẽ sớm đến” là cách chuyển tự nhiên cho hiện tại có lực hướng tương lai ἔρχομαι, còn chú thích bảo lưu hợp lý nghĩa khả dĩ “nhanh chóng” của ταχύ.'
  naturalness: Văn bản tự nhiên trong tiếng Việt hiện đại với sắc thái trang trọng, cầu nguyện phù hợp phần kết Khải Huyền. “Phán,” “Đấng,” “ta,” và “Lạy Chúa” tạo một đăng ký Kinh Thánh nhất quán mà không gây tối nghĩa. “Xin hãy đến” diễn đạt tự nhiên lời thỉnh cầu của mệnh lệnh ἔρχου.
  terminology: “Đấng làm chứng” giữ được trường nghĩa chứng nhận/chứng nhân của ὁ μαρτυρῶν; “Chúa Giê-su” chuyển tải đúng κύριε Ἰησοῦ; “A-men” là cách viết tiếng Việt thông dụng cho lời đáp phụng vụ. Không có lựa chọn thuật ngữ nào áp đặt diễn giải giáo phái.
