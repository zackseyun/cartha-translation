id: REV.22.12
reference: Revelation 22:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: vi
  text: “Này, Ta sắp đến[a], và phần thưởng của Ta ở cùng Ta, để trả cho mỗi người tùy theo việc làm của người ấy.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta đến mau chóng.” Từ Hy Lạp ταχύ có thể nhấn mạnh sự gần kề (“sắp”) hoặc tốc độ, tính bất ngờ (“mau chóng”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng kêu gọi chú ý trong lời tiên tri, với sắc thái trang trọng nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔρχομαι ταχύ
  choice: Ta sắp đến
  rationale: Diễn đạt tự nhiên ý hiện tại mang hướng tương lai cùng nét nghĩa gần kề của ταχύ. Khả năng nhấn mạnh tốc độ hoặc tính đột ngột được giữ trong chú thích.
- source_word: ὁ μισθός μου
  choice: phần thưởng của Ta
  rationale: μισθός có thể chỉ tiền công, phần thưởng hoặc sự báo đáp; “phần thưởng” phù hợp văn cảnh và dễ hiểu hơn “tiền công”, đồng thời không mang sắc thái thương mại quá mạnh.
- source_word: μετ’ ἐμοῦ
  choice: ở với Ta
  rationale: Bổ sung hệ từ vốn được hàm ẩn trong mệnh đề Hy Lạp, đồng thời giữ hình ảnh phần thưởng đang ở cùng Đấng phán.
- source_word: ἀποδοῦναι
  choice: để báo trả
  rationale: Giữ ý trao lại hoặc đáp trả tương xứng, đồng thời thể hiện mục đích của việc đến. “Báo trả” có thể bao quát cả thưởng lẫn sự phán xét hơn “ban thưởng”.
- source_word: ἑκάστῳ
  choice: mỗi người
  rationale: Giữ sắc thái phân phối và trách nhiệm cá nhân của dạng số ít.
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: tùy theo việc làm của người ấy
  rationale: Diễn đạt tự nhiên tiêu chuẩn báo trả, vẫn giữ danh từ ἔργον qua “việc làm” thay vì giải thích rộng hơn thành một kết luận thần học.
theological_decisions:
- issue: Tính đại diện của giống đực số ít trong ἑκάστῳ ... αὐτοῦ
  choice: mỗi người ... người ấy
  alternative: mỗi người ... việc mình đã làm
  rationale: Tiếng Việt không buộc phải đánh dấu giống ở đại từ này. “Người ấy” giữ số ít và tính quy chiếu cá nhân mà không thêm giới tính vốn chỉ mang tính ngữ pháp trong tiếng Hy Lạp.
- issue: Bản chất của sự báo trả theo việc làm
  choice: phần thưởng ... báo trả mỗi người tùy theo việc làm của người ấy
  alternative: ban thưởng cho mỗi người theo việc họ đã làm
  rationale: Bản dịch giữ nguyên mối liên hệ giữa sự báo trả và việc làm, nhưng không suy diễn rằng câu này tự nó xác định toàn bộ cơ sở của sự cứu rỗi hay bản chất cuối cùng của phần thưởng.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu. Đại từ “Ta” thích hợp với lời phán đầy thẩm quyền của Đấng Christ trong văn cảnh. Dấu chấm than sau lời công bố đầu tiên làm rõ sức nặng của lời cảnh báo mà không thêm nội dung ngoài bản văn.
