review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: lời kêu gọi chú ý, lời đến gần, phần thưởng ở cùng Đấng phán, và sự báo trả riêng cho từng người theo việc làm của người ấy. Tuy nhiên, động từ ἀποδοῦναι đi với người nhận ở cách gián tiếp; tiếng Việt cần thêm “cho” để biểu đạt quan hệ này rõ và tự nhiên.'
  naturalness: “Báo trả mỗi người” thiếu giới từ và không tự nhiên trong tiếng Việt hiện đại; “trả cho mỗi người” vừa tự nhiên vừa trung tính hơn. “Ở cùng Ta” phù hợp hơn “ở với Ta” trong văn phong Kinh Thánh trang trọng.
  terminology: “Phần thưởng” là lựa chọn phù hợp cho μισθός trong ngữ cảnh này. “Trả cho mỗi người tùy theo việc làm của người ấy” giữ được ngôn ngữ báo đáp theo việc làm mà không áp đặt kết luận thần học. Đại từ “Ta” và “người ấy” nhất quán với register trang trọng và tính phân phối số ít.
  issues:
  - severity: medium
    issue: Cụm “để báo trả mỗi người” thiếu “cho”.
    rationale: ἑκάστῳ là cách gián tiếp, nghĩa là “cho mỗi người.” Trong tiếng Việt, “báo trả mỗi người” không phải cách kết hợp tự nhiên; “trả cho mỗi người” diễn đạt đúng vai trò người nhận và tránh sắc thái trả đũa dễ có của “báo trả.”
  - severity: low
    issue: “Ở với Ta” có thể đổi thành “ở cùng Ta”.
    rationale: Cả hai đều hiểu được, nhưng “ở cùng Ta” tự nhiên và trang trọng hơn trong văn cảnh lời phán khải huyền, đồng thời giữ sát μετ’ ἐμοῦ.
  revised_text: “Này, Ta sắp đến[a], và phần thưởng của Ta ở cùng Ta, để trả cho mỗi người tùy theo việc làm của người ấy.”
