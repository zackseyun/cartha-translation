- from: “Này, Ta sắp đến[a]! Phần thưởng của Ta ở với Ta, để báo trả mỗi người tùy theo việc làm của người ấy.”
  to: “Này, Ta sắp đến[a], và phần thưởng của Ta ở cùng Ta, để trả cho mỗi người tùy theo việc làm của người ấy.”
  rationale: 'Bản sửa chỉ điều chỉnh cách diễn đạt tiếng Việt: thêm “cho” để phản ánh người nhận của ἀποδοῦναι và dùng “ở cùng Ta” cho tự nhiên hơn. Giữ “sắp” cùng chú thích về “mau chóng” để bảo tồn sự mơ hồ ngữ nghĩa của ταχύ; giữ “việc làm của người ấy” để phản ánh danh từ số ít và tính quy chiếu cá nhân của nguyên ngữ.'
  reviewer_model: gpt-5.6-terra
