id: REV.22.7
reference: Revelation 22:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: vi
  text: “Này, ta sắp đến.[a] Phước cho người gìn giữ những lời tiên tri trong sách này.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ta đến mau chóng”; từ Hy Lạp có thể nhấn mạnh sự gần kề về thời gian (“sắp”) hoặc cách đến nhanh, đột ngột.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cuộn sách này.”'
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của lời công bố khải huyền, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔρχομαι
  choice: ta sắp đến
  rationale: Dịch hiện tại mang ý hướng tương lai trong ngữ cảnh bằng “sắp đến”, diễn đạt sự đến gần mà không thêm danh tính người nói vốn không được nêu rõ trong câu Hy Lạp.
- source_word: ταχύ
  choice: sắp
  rationale: Trong ngữ cảnh này, trạng từ chủ yếu chỉ sự gần kề về thời gian. Khả năng hiểu là đến nhanh hoặc đột ngột được giữ trong chú thích.
- source_word: μακάριος
  choice: Phước cho
  rationale: Cách nói tự nhiên, trang trọng trong một lời chúc phước, truyền đạt ý được ban phước hơn là chỉ một cảm xúc vui vẻ.
- source_word: ὁ τηρῶν
  choice: người gìn giữ
  rationale: Giữ được phạm vi nghĩa vừa trân trọng, bảo tồn, vừa sống theo những lời đã nhận; tránh thu hẹp hoàn toàn thành “vâng lời”.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: những lời tiên tri
  rationale: Diễn đạt gọn và tự nhiên mối liên hệ giữa “những lời” và “lời tiên tri”, không giản lược thành một “thông điệp” khái quát.
- source_word: τοῦ βιβλίου τούτου
  choice: trong sách này
  rationale: Tiếng Việt tự nhiên dùng “sách” cho sự tự quy chiếu của sách Khải Huyền; bối cảnh vật chất cổ đại có thể là cuộn sách nên được nêu trong chú thích.
theological_decisions:
- issue: Danh tính người nói câu “ta sắp đến”
  choice: Không thêm tên riêng hay danh xưng vào câu dịch
  alternative: Thêm rõ “Đức Chúa Jêsus” hoặc một danh xưng khác làm chủ thể
  rationale: Bản Hy Lạp chỉ có lời nói ở ngôi thứ nhất; danh tính người nói phải được nhận ra từ văn mạch thay vì được bản dịch bổ sung.
- issue: Nội hàm của τηρέω đối với lời tiên tri
  choice: Dịch là “gìn giữ”
  alternative: Dịch hẹp hơn là “vâng giữ” hoặc “tuân theo”
  rationale: “Gìn giữ” bảo tồn sức căng giữa việc giữ lấy, coi trọng và thực hành lời tiên tri, không giới hạn động từ chỉ vào sự tuân lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Này” giữ âm hưởng công bố; “ta” phù hợp với lời nói đầy thẩm quyền trong văn mạch nhưng không nêu đích danh người nói. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
