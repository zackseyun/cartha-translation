  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố chính của câu Hy Lạp: hô ngữ ἰδού (“Này”), lời tự xưng ngôi thứ nhất mà không thêm danh tính người nói, ý sắp đến của ταχύ, lời chúc phước μακάριος, và việc “gìn giữ” các lời tiên tri của sách này. “Những lời tiên tri trong sách này” là cách diễn đạt tiếng Việt tự nhiên cho τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, dù cấu trúc Hy Lạp sát hơn là “những lời của lời tiên tri”; bản dịch không làm thay đổi nội dung đáng kể.'
