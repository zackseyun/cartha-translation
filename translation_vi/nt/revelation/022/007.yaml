  terminology: “Phước,” “gìn giữ,” “lời tiên tri,” và “sách này” được dùng nhất quán và phù hợp. “Gìn giữ” không thu hẹp τηρέω chỉ còn nghĩa tuân lệnh. Chú thích về “cuộn sách” phản ánh đúng khả năng nghĩa vật chất cổ đại của βιβλίον.
