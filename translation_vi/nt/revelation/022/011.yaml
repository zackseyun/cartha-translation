id: REV.22.11
reference: Revelation 22:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: vi
  text: Người làm điều bất chính, cứ tiếp tục làm điều bất chính; người ô uế, cứ tiếp tục bị làm cho ô uế[a]; người công chính, cứ tiếp tục thực hành sự công chính[b]; và người thánh, cứ tiếp tục được làm nên thánh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cứ tiếp tục ô uế.” Động từ Hy Lạp ở thể bị động, theo sát là “bị làm cho ô uế.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thực thi công lý.” Từ Hy Lạp δικαιοσύνη có thể chỉ sự công chính hoặc công lý.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “được thánh hóa.” Động từ Hy Lạp có nghĩa là được làm nên thánh hoặc được biệt riêng làm thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν / ἀδικησάτω ἔτι
  choice: người làm điều bất chính, cứ tiếp tục làm điều bất chính
  rationale: Cách dịch giữ động tính của phân từ ἀδικῶν và lực mệnh lệnh ngôi thứ ba của ἀδικησάτω; “cứ tiếp tục” diễn đạt ἔτι trong ngữ cảnh về sự kéo dài hay kiên trì trong một tình trạng.
- source_word: ὁ ῥυπαρός
  choice: người ô uế
  rationale: Tính từ được dùng như danh từ chỉ người; “ô uế” tự nhiên trong tiếng Việt và giữ cả sắc thái nhơ bẩn lẫn bất khiết về đạo đức.
- source_word: ῥυπαρευθήτω ἔτι
  choice: cứ tiếp tục bị làm cho ô uế
  rationale: Giữ thể bị động của động từ mệnh lệnh aorist và để tác nhân không được nói rõ, dù cách diễn đạt có chủ ý gây sửng sốt.
- source_word: ὁ δίκαιος / δικαιοσύνην ποιησάτω ἔτι
  choice: người công chính, cứ tiếp tục thực hành sự công chính
  rationale: “Thực hành sự công chính” diễn đạt tự nhiên kết cấu ποιεῖν δικαιοσύνην, nhấn mạnh hành vi chứ không chỉ tình trạng; “công lý” vẫn là một khả năng từ vựng.
- source_word: ὁ ἅγιος / ἁγιασθήτω ἔτι
  choice: người thánh, cứ tiếp tục được làm nên thánh
  rationale: Giữ sự đối xứng và thể bị động của ἁγιασθήτω; “được làm nên thánh” dễ hiểu hơn thuật ngữ “được thánh hóa” mà vẫn giữ ý nghĩa.
theological_decisions:
- issue: Lực mệnh lệnh trong bối cảnh tình trạng đạo đức cuối cùng
  choice: Dịch cả bốn động từ bằng kết cấu mệnh lệnh “cứ tiếp tục…”
  alternative: 'Dịch như lời tiên báo: “sẽ tiếp tục…”'
  rationale: Các hình thái Hy Lạp là mệnh lệnh ngôi thứ ba. Bản dịch giữ nguyên lực tu từ nghiêm trọng ấy mà không biến lời này thành sự tán thành điều ác.
- issue: Thể của ῥυπαρευθήτω và ἁγιασθήτω
  choice: 'Giữ thể bị động: “bị làm cho ô uế” và “được làm nên thánh”'
  alternative: 'Dịch theo trạng thái hoặc nội động: “cứ ô uế” và “cứ nên thánh”'
  rationale: Hai động từ đều ở thể bị động. Việc để tác nhân hàm ẩn bảo tồn sự căng thẳng thần học của nguyên văn thay vì âm thầm giải quyết nó.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Dùng dấu chấm phẩy để làm rõ bốn vế song song. Cụm “cứ tiếp tục” được lặp lại nhằm thể hiện ἔτι trong từng vế và duy trì nhịp điệu cảnh cáo của câu.
