id: REV.22.3
reference: Revelation 22:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: vi
  text: Sẽ không còn lời nguyền nào nữa[a]. Ngai của Đức Chúa Trời và của Chiên Con sẽ ở trong thành ấy, và các nô lệ của Ngài[c] sẽ phụng thờ Ngài[d][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ điều gì bị nguyền rủa” hoặc “bất cứ vật gì bị nguyền rủa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp dùng dạng số ít: “Ngai” của “Đức Chúa Trời và Chiên Con” ... “các nô lệ của Ngài sẽ phụng thờ Ngài.” Cách nói này vừa phân biệt Đức Chúa Trời với Chiên Con, vừa diễn tả quyền trị vì chung của hai Đấng.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “các đầy tớ” hoặc “những người thuộc quyền Ngài.”'
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “sẽ phục vụ” hoặc “sẽ thực hiện việc phụng sự thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: lời nguyền nào
  rationale: Trong ngữ cảnh trời đất mới, cách diễn đạt này tự nhiên và gợi đúng sự chấm dứt hoàn toàn của lời nguyền; chú thích giữ lại khả năng hiểu danh từ theo nghĩa cụ thể là vật hoặc điều bị nguyền rủa.
- source_word: οὐκ ἔσται ἔτι
  choice: sẽ không còn ... nữa
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý tương lai và ý 'không còn nữa' của ἔτι.
- source_word: ὁ θρόνος
  choice: Ngai
  rationale: Giữ danh từ ở số ít như nguyên văn; viết hoa theo chức năng chỉ ngai trị vì của Đức Chúa Trời và Chiên Con.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: của Đức Chúa Trời và của Chiên Con
  rationale: Giữ rõ cả hai sở thuộc song song; 'Chiên Con' bảo toàn hình ảnh hiến tế và Đấng Mê-si đặc trưng trong Khải Huyền.
- source_word: ἐν αὐτῇ
  choice: ở trong thành ấy
  rationale: Đại từ giống cái số ít quy chiếu về thành/thành Giê-ru-sa-lem mới; nêu rõ tiền ngữ giúp tiếng Việt tự nhiên mà không đổi nghĩa định vị.
- source_word: δοῦλοι
  choice: các nô lệ
  rationale: '''Nô lệ'' giữ rõ ý thuộc quyền sở hữu và hoàn toàn thuộc về chủ của δοῦλος; chú thích cung cấp cách dịch mềm hơn theo chức năng là ''đầy tớ''.'
- source_word: λατρεύσουσιν
  choice: sẽ phụng thờ
  rationale: '''Phụng thờ'' vừa truyền đạt sự thờ phượng vừa giữ sắc thái phục vụ thiêng liêng của λατρεύω trong bối cảnh ngai và đền thờ.'
- source_word: αὐτοῦ ... αὐτῷ
  choice: của Ngài ... Ngài
  rationale: Giữ đại từ số ít của nguyên văn sau cụm 'Đức Chúa Trời và Chiên Con', không tự ý chuyển thành số nhiều hoặc giải tỏa sự căng thẳng thần học của câu.
theological_decisions:
- issue: Một ngai thuộc về Đức Chúa Trời và Chiên Con, đi cùng các đại từ số ít
  choice: Giữ một 'Ngai' và đại từ số ít 'Ngài'.
  alternative: Dùng cách nói số nhiều như 'của hai Đấng' hoặc 'phụng thờ các Ngài'.
  rationale: Nguyên văn vừa phân biệt Đức Chúa Trời với Chiên Con, vừa dùng một ngai và các đại từ số ít. Bản dịch giữ nguyên sự kết hợp này thay vì giải thích nó theo một hệ phái hoặc công thức thần học về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. 'Phụng thờ' được chọn để kết hợp sắc thái thờ phượng và phục vụ thiêng liêng. 'Nô lệ' có sức nặng hơn lời nói thông thường nhưng được giữ nhằm phản ánh quan hệ thuộc quyền trong nguyên văn; chú thích cung cấp phương án quen thuộc hơn.
