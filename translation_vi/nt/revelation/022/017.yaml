revisions:
- from: 'Thánh Linh và cô dâu cùng nói: “Hãy đến!” Người nào nghe cũng hãy nói: “Hãy đến!” Người nào khát, hãy đến; người nào ao ước, hãy nhận nước sự sống, hoàn toàn miễn phí.[a][b]'
  to: 'Thánh Linh và cô dâu nói: “Hãy đến!”[b] Người nghe hãy nói: “Hãy đến!” Người nào khát, hãy đến; người nào muốn, hãy nhận nước sự sống cách nhưng không.[a]'
  rationale: Sửa vị trí neo chú thích để chú thích b theo đúng hai lời “Hãy đến!” đầu tiên và chú thích a theo đúng δωρεάν. Đồng thời lược bỏ các yếu tố nhấn mạnh hoặc liên kết không cần thiết, dùng cách diễn đạt tự nhiên hơn cho ὁ ἀκούων và ὁ θέλων, nhưng không thay đổi ý nghĩa hay giải quyết đối tượng còn bỏ ngỏ của hai lời gọi đầu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:27:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: Thánh Linh, cô dâu, hai lời “Hãy đến!”, người nghe, người khát, người muốn, nước sự sống và tính nhưng không. Tuy nhiên, “cũng” trong “cũng hãy nói” thêm một sắc thái không được nêu rõ; “hoàn toàn” cũng tăng cường ý của δωρεάν vượt quá mức cần thiết. Quan trọng hơn, chú thích b hiện được gắn ở cuối câu, dù nội dung chú thích giải thích hai lời “Hãy đến!” đầu tiên.'
  naturalness: “Người nghe hãy nói” và “người nào muốn” là cách nói hiện đại, gọn và tự nhiên hơn trong cấu trúc song hành của câu. “Cách nhưng không” là cách diễn đạt Kinh Thánh tiếng Việt rõ nghĩa, trang trọng vừa phải, và phù hợp với trạng từ δωρεάν.
  terminology: “Thánh Linh,” “cô dâu,” và “nước sự sống” đều thích hợp. Giữ “cô dâu” bảo toàn hình ảnh biểu tượng mà không diễn giải. “Cách nhưng không” phản ánh δωρεάν mà không thêm cường độ của từ “hoàn toàn.”
  issues:
  - severity: medium
    issue: Vị trí neo chú thích b không đúng cụm được giải thích.
    rationale: Chú thích b giải thích hai lời gọi “Hãy đến!” đầu tiên, nhưng hiện đặt sau “hoàn toàn miễn phí” ở cuối câu. Neo cần đặt ngay sau lời “Hãy đến!” đầu tiên (hoặc phạm vi hai lời gọi), trong khi chú thích a cần theo sát trạng từ δωρεάν.
  - severity: low
    issue: Các từ tăng thêm “cũng” và “hoàn toàn” không cần thiết.
    rationale: εἰπάτω chỉ truyền đạt mệnh lệnh “hãy nói”; δωρεάν nghĩa là “cách nhưng không/miễn phí,” không tự nó có nghĩa nhấn mạnh “hoàn toàn.” Bỏ các từ này giúp sát nguồn hơn mà vẫn tự nhiên.
