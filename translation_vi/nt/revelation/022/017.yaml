id: REV.22.17
reference: Revelation 22:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: vi
  text: 'Thánh Linh và cô dâu nói: “Hãy đến!”[b] Người nghe hãy nói: “Hãy đến!” Người nào khát, hãy đến; người nào muốn, hãy nhận nước sự sống cách nhưng không.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cách nhưng không” cũng có thể dịch là “không phải trả giá” hoặc “như một món quà.”
    reason: lexical_alternative
  - marker: b
    text: Hai lời gọi “Hãy đến!” đầu tiên thường được hiểu là lời kêu cầu Chúa đến; sau đó câu chuyển sang mời người khát đến và người muốn nhận nước sự sống.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong ngữ cảnh sách Khải Huyền, danh từ có mạo từ này tự nhiên nhất chỉ về Thánh Linh; cách dịch tránh hiểu thành tâm thần hay thái độ của con người.
- source_word: ἡ νύμφη
  choice: cô dâu
  rationale: Giữ nguyên hình ảnh biểu tượng của nguyên văn, không diễn giải ngay trong câu là Hội Thánh, dân Đức Chúa Trời hay Giê-ru-sa-lem mới.
- source_word: λέγουσιν
  choice: cùng nói
  rationale: Thì hiện tại được diễn đạt tự nhiên bằng hiện tại; “cùng” thể hiện hai chủ thể liên kết bởi καὶ mà không làm thay đổi nội dung lời gọi.
- source_word: Ἔρχου
  choice: Hãy đến!
  rationale: Mệnh lệnh ngôi thứ hai được chuyển bằng lời kêu gọi trực tiếp, mạnh và tự nhiên trong tiếng Việt.
- source_word: ὁ ἀκούων
  choice: Người nào nghe
  rationale: Diễn đạt phân từ có mạo từ theo nghĩa khái quát, không giới hạn giới tính.
- source_word: εἰπάτω
  choice: cũng hãy nói
  rationale: Giữ lực mệnh lệnh ngôi thứ ba và dùng “cũng” để thể hiện người nghe hưởng ứng lời gọi trước đó.
- source_word: ὁ διψῶν
  choice: Người nào khát
  rationale: Giữ hình ảnh cơn khát và cách diễn đạt khái quát, gọn tự nhiên.
- source_word: ἐρχέσθω
  choice: hãy đến
  rationale: Truyền đạt lời mời mang lực mệnh lệnh dành cho người khát.
- source_word: ὁ θέλων
  choice: người nào ao ước
  rationale: θέλω biểu thị ý muốn hoặc khát vọng; “ao ước” giữ sắc thái mong muốn mà không thêm tân ngữ không có trong nguyên văn.
- source_word: λαβέτω
  choice: hãy nhận
  rationale: Trong ngữ cảnh món quà được ban miễn phí, “nhận” tự nhiên hơn “lấy” mà vẫn nằm trong phạm vi nghĩa của λαμβάνω.
- source_word: ὕδωρ ζωῆς
  choice: nước sự sống
  rationale: Giữ cấu trúc sở hữu của nguyên văn và thuật ngữ quen thuộc trong văn chương Giăng, không đổi thành “nước sống” vốn có thể tạo sắc thái khác.
- source_word: δωρεάν
  choice: hoàn toàn miễn phí
  rationale: Nêu rõ nghĩa không phải trả giá; “hoàn toàn” làm câu tiếng Việt tự nhiên và nhấn mạnh tính nhưng không của món quà.
theological_decisions:
- issue: Đối tượng của hai lời “Hãy đến!” đầu tiên
  choice: Không nêu tân ngữ trong chính văn; giữ nguyên lời gọi mở, có thể được hiểu là Thánh Linh, cô dâu và người nghe kêu cầu Chúa đến, trước khi câu chuyển sang mời người khát đến nhận sự sống.
  alternative: Hiểu mọi lời “Hãy đến!” đều là lời mời người khát, hoặc thêm rõ “Lạy Chúa, xin hãy đến.”
  rationale: Nguyên văn không nói rõ đối tượng của hai mệnh lệnh ngôi thứ hai, rồi mới chuyển sang mệnh lệnh ngôi thứ ba dành cho người khát và người ao ước. Không thêm đối tượng sẽ bảo toàn sự chuyển hướng và độ mở thần học của câu.
- issue: Ý nghĩa biểu tượng của “cô dâu”
  choice: Giữ nguyên biểu tượng “cô dâu”.
  alternative: Diễn giải là Hội Thánh, dân Đức Chúa Trời hoặc Giê-ru-sa-lem mới.
  rationale: Sách Khải Huyền liên kết hình ảnh này với nhiều tầng ý nghĩa; diễn giải trong chính văn sẽ thu hẹp biểu tượng vượt quá lời của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thánh Linh” theo cách gọi phổ biến trong nhiều cộng đồng Cơ Đốc tiếng Việt; giữ “cô dâu” và “nước sự sống” để bảo toàn hệ thống hình ảnh của sách Khải Huyền. Các dấu [a], [b] được đặt ngay sau cụm liên quan ở cuối câu.
