  source_fidelity: Bản nháp truyền đạt đúng chủ thể được nhấn mạnh, hai hành động nghe/thấy, việc Giăng phủ phục trước chân thiên sứ, và mục đích προσκυνῆσαι. Tuy nhiên, liên từ καί đầu câu (Κἀγώ) chưa được phản ánh; nên giữ “Và” để nối mạch văn. Cụm “Khi nghe và thấy” làm mất hai aorist ngôi thứ nhất số ít ἤκουσα καὶ ἔβλεψα; tiếng Việt tự nhiên nên nêu rõ “khi tôi đã nghe và thấy.”
  naturalness: “Giăng” và “thiên sứ” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Sấp mình xuống trước chân” tự nhiên. Tuy nhiên, câu đầu với “Chính tôi, Giăng” không có “Và” đã làm yếu liên kết diễn ngôn của nguyên văn; việc thêm “Và” vẫn tự nhiên và trang trọng. “Khi tôi đã nghe và thấy” rõ chủ ngữ và thời điểm hoàn tất hơn.
  terminology: “Giăng,” “thiên sứ,” và “thờ lạy” là các thuật ngữ phù hợp. “Thờ lạy” có thể giữ trong thân bài vì văn mạch Khải Huyền và câu kế tiếp xác định tính không thích hợp của hành động đối với thiên sứ. Chú thích nêu các khả năng khác mà không áp đặt cách giải thích giáo phái.
