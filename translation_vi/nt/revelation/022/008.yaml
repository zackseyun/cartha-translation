id: REV.22.8
reference: Revelation 22:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: vi
  text: Và chính tôi, Giăng, là người đang nghe và thấy những điều này. Khi tôi đã nghe và thấy, tôi sấp mình xuống trước chân vị thiên sứ đang chỉ cho tôi những điều ấy để thờ lạy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sấp mình trước” hoặc “bày tỏ lòng tôn kính”. Động từ Hy Lạp có thể chỉ hành động phủ phục hay tôn kính; ở đây dịch là “thờ lạy” vì từ này thường mang nghĩa đó trong sách Khải Huyền và vì lời ngăn cản ngay sau đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: Chính tôi, Giăng
  rationale: Καί nối tiếp mạch văn, còn đại từ ἐγώ được nêu rõ tạo sắc thái nhấn mạnh. Trong tiếng Việt, “Chính tôi” truyền đạt sự nhấn mạnh tự nhiên; tên Ἰωάννης được dùng theo dạng Kinh Thánh quen thuộc “Giăng”.
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: là người đang nghe và thấy
  rationale: Giữ cấu trúc phân từ có mạo từ và sắc thái hiện tại/đang diễn ra của hai phân từ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ταῦτα
  choice: những điều này / những điều ấy
  rationale: Giữ số nhiều của đại từ chỉ định. Lần sau dùng “những điều ấy” để tránh lặp cứng mà vẫn quy chiếu đến cùng các khải tượng vừa được nói đến.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: Khi nghe và thấy
  rationale: ὅτε được dịch là “khi”, không diễn giải quá mức thành “sau khi”. Chủ ngữ “tôi” được lược theo lối tiếng Việt vì đã rõ từ mệnh đề chính.
- source_word: ἔπεσα
  choice: tôi sấp mình xuống
  rationale: Trong ngữ cảnh hành động trước chân thiên sứ nhằm προσκυνέω, “sấp mình xuống” biểu đạt rõ tư thế phủ phục hàm chứa trong toàn cụm, tự nhiên hơn cách dịch máy móc “ngã xuống”.
- source_word: προσκυνῆσαι
  choice: để thờ lạy
  rationale: “Thờ lạy” giữ lực tôn giáo mạnh thường thấy của động từ trong Khải Huyền và không làm nhẹ sự căng thẳng trước lời quở trách ở câu kế tiếp.
- source_word: ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου
  choice: trước chân vị thiên sứ
  rationale: Giữ giới từ ἔμπροσθεν và danh từ “chân”; “vị thiên sứ” là cách gọi tự nhiên, trang trọng đối với hữu thể thiên giới.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: đang chỉ cho tôi những điều ấy
  rationale: “Đang chỉ” giữ sắc thái chưa hoàn tất của phân từ hiện tại và vai trò liên tục của thiên sứ trong khải tượng.
theological_decisions:
- issue: Ý nghĩa của προσκυνέω khi hướng về thiên sứ
  choice: thờ lạy
  alternative: sấp mình trước; bày tỏ lòng tôn kính
  rationale: Động từ có thể chỉ hành động phủ phục hoặc tỏ lòng tôn kính, nhưng trong Khải Huyền thường mang lực nghĩa thờ phượng. Lời ngăn cản ngay sau đó cho thấy hành động này không thích hợp với thiên sứ; bản dịch không nên làm nhẹ từ ngữ để giải quyết trước sự căng thẳng thần học của trình thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chính tôi” để thể hiện đại từ chủ ngữ được nhấn mạnh; dùng “sấp mình xuống” cho tư thế cụ thể, còn “thờ lạy” cho mục đích của hành động. Dấu chú thích [a] được đặt ngay sau từ ngữ cần giải thích.
