id: REV.22.6
reference: Revelation 22:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: vi
  text: 'Người ấy nói với tôi: “Những lời này đáng tin cậy và chân thật. Chúa, là Đức Chúa Trời của tâm linh các nhà tiên tri, đã sai thiên sứ của Ngài đến để chỉ cho các nô lệ của Ngài những điều phải sớm xảy ra.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều phải xảy ra nhanh chóng.” Cụm từ Hy Lạp có thể nhấn mạnh sự gần kề về thời gian (“sớm”) hoặc tốc độ diễn ra (“nhanh chóng”).'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: đáng tin cậy và chân thật
  rationale: 'Diễn đạt tự nhiên phẩm chất của các lời được phán: chúng vừa đáng tin vừa đúng thật; đồng thời giữ hai tính từ riêng biệt của nguyên văn.'
- source_word: κύριος
  choice: Chúa
  rationale: Giữ tước hiệu thần thượng quen thuộc và phù hợp với cụm đồng vị theo sau.
- source_word: θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Đức Chúa Trời của tâm linh các nhà tiên tri
  rationale: Giữ cấu trúc sở hữu và sự mơ hồ thật sự của nguyên văn, không diễn giải thành ‘Đấng cảm thúc các nhà tiên tri’ hay xác định đây là các thần linh tiên tri.
- source_word: ἄγγελον
  choice: thiên sứ
  rationale: Bối cảnh khải huyền chỉ một hữu thể thiên giới; ‘thiên sứ’ là cách gọi tự nhiên, trang trọng trong tiếng Việt.
- source_word: δούλοις
  choice: các nô lệ
  rationale: Giữ nghĩa mạnh của δοῦλος là những người thuộc quyền sở hữu của chủ, thay vì làm nhẹ thành ‘đầy tớ’ hay ‘tôi tớ’.
- source_word: δεῖξαι
  choice: chỉ cho
  rationale: Phản ánh trực tiếp nghĩa của δείκνυμι và phù hợp với bối cảnh thị kiến.
- source_word: ἃ δεῖ γενέσθαι
  choice: những điều phải xảy ra
  rationale: Giữ ý về sự tất yếu trong δεῖ và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν τάχει
  choice: sớm
  rationale: Trong ngữ cảnh, cụm từ chủ yếu nhấn mạnh sự gần kề về thời gian; nghĩa ‘nhanh chóng’ vẫn được giữ trong chú thích.
- source_word: Καὶ εἶπέν μοι
  choice: Người ấy nói với tôi
  rationale: Đại từ tránh tự ý xác định lại danh tính người nói, còn tiếng Việt tự nhiên không cần dịch καί bằng ‘và’ ở đầu câu.
theological_decisions:
- issue: Ý nghĩa của ἐν τάχει trong bối cảnh cánh chung
  choice: sớm
  alternative: nhanh chóng
  rationale: Cụm từ có thể nói đến sự gần kề về thời gian hoặc tốc độ diễn ra. Bản chính chọn ‘sớm’ theo ngữ cảnh nhấn mạnh tính gần kề, nhưng chú thích bảo tồn cách hiểu còn lại.
- issue: Sắc thái của δοῦλοι khi nói về dân thuộc về Đức Chúa Trời
  choice: các nô lệ
  alternative: các đầy tớ; các tôi tớ
  rationale: ‘Nô lệ’ giữ rõ quan hệ thuộc quyền sở hữu vốn có trong δοῦλος. Dù ‘đầy tớ’ tự nhiên hơn trong truyền thống tiếng Việt, nó có thể làm nhẹ sắc thái của từ Hy Lạp.
- issue: Quan hệ trong θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: Đức Chúa Trời của tâm linh các nhà tiên tri
  alternative: Đức Chúa Trời, Đấng cảm thúc các nhà tiên tri; Đức Chúa Trời của các thần linh tiên tri
  rationale: Giữ nguyên quan hệ sở hữu mơ hồ thay vì xác quyết một cách hiểu về sự cảm thúc hay bản thể của ‘các tâm linh’.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Người ấy’ để tránh thêm căn tính không được nêu ngay trong câu; viết hoa các danh xưng và đại từ chỉ Đức Chúa Trời theo quy ước tiếng Việt Cơ Đốc phổ biến. ‘Nô lệ’ được giữ dù tạo cảm giác mạnh, vì phản ánh sát quan hệ lệ thuộc trong δοῦλος.
