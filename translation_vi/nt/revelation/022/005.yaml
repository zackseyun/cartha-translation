id: REV.22.5
reference: Revelation 22:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: vi
  text: Đêm sẽ không còn nữa. Họ sẽ không cần ánh sáng của đèn hay ánh sáng mặt trời, vì Chúa là Đức Chúa Trời sẽ chiếu sáng trên họ[a], và họ sẽ trị vì đời đời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ soi sáng họ” hoặc “sẽ ban ánh sáng cho họ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “cho đến các thời đại của các thời đại”, một thành ngữ chỉ thời gian vô tận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: đêm
  rationale: Nghĩa cơ bản là “đêm”; cách diễn đạt không có mạo từ trong tiếng Hy Lạp được chuyển tự nhiên sang tiếng Việt.
- source_word: οὐκ ἔσται ἔτι
  choice: sẽ không còn nữa
  rationale: Diễn đạt sự chấm dứt hoàn toàn, đồng thời giữ sắc thái trang trọng và hướng đến tương lai.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: họ sẽ không cần
  rationale: Dù động từ Hy Lạp ở thì hiện tại, các động từ tương lai xung quanh đặt mệnh đề trong cảnh tượng tương lai; tiếng Việt dùng “sẽ” để mạch văn rõ và tự nhiên.
- source_word: φωτὸς λύχνου
  choice: ánh sáng của đèn
  rationale: Giữ rõ cấu trúc sở hữu và hình ảnh nguồn sáng nhân tạo, không thu hẹp loại đèn quá mức.
- source_word: φῶς ἡλίου
  choice: ánh sáng mặt trời
  rationale: Cách nói tự nhiên trong tiếng Việt, tương ứng trực tiếp với ánh sáng do mặt trời phát ra.
- source_word: κύριος ὁ θεός
  choice: Chúa, Đức Chúa Trời
  rationale: Dùng hai danh xưng theo quan hệ đồng vị để tránh khiến câu bị hiểu thành một mệnh đề đồng nhất “Chúa là Đức Chúa Trời”, đồng thời phản ánh cụm “Chúa là Đức Chúa Trời/Lord God” trong nguyên ngữ.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: sẽ chiếu sáng trên họ
  rationale: Giữ hình ảnh ánh sáng hướng đến và phủ trên họ; chú thích nêu cách hiểu gần nghĩa khác.
- source_word: βασιλεύσουσιν
  choice: sẽ trị vì
  rationale: Diễn đạt hành động cai trị với tư cách vương giả mà không thêm đối tượng hay phạm vi không có trong nguyên văn.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời
  rationale: Đây là cách diễn đạt tiếng Việt tự nhiên cho thành ngữ Hy Lạp nhấn mạnh thời gian vô tận; nghĩa đen được ghi ở chú thích.
theological_decisions:
- issue: Thời điểm của οὐκ ἔχουσιν χρείαν trong khải tượng hướng đến tương lai
  choice: 'Dịch theo tương lai: “họ sẽ không cần”.'
  alternative: 'Dịch sát hình thái hiện tại: “họ không cần”.'
  rationale: Thì hiện tại Hy Lạp có thể làm cho khải tượng trở nên sống động, nhưng các động từ rõ ràng ở tương lai trong cùng câu cho thấy trạng thái được mô tả thuộc cảnh hoàn tất trong tương lai.
- issue: Quan hệ giữa κύριος và ὁ θεός
  choice: 'Dịch đồng vị: “Chúa, Đức Chúa Trời”.'
  alternative: “Chúa là Đức Chúa Trời” hoặc “Đức Chúa Trời là Chúa”.
  rationale: Cụm Hy Lạp là một danh xưng cho chủ thể, không nhất thiết là mệnh đề có động từ “là”; cách đồng vị bảo toàn quan hệ ấy và không thêm một khẳng định thần học riêng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp khải tượng và các hình ảnh đêm, đèn, mặt trời, ánh sáng và trị vì; không thêm chủ thể, đối tượng cai trị hay cách giải thích giáo phái.
