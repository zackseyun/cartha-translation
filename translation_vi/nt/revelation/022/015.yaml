id: REV.22.15
reference: Revelation 22:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: vi
  text: Bên ngoài là những con chó[a], những kẻ hành tà thuật, những kẻ sống vô luân về tình dục, những kẻ giết người, những kẻ thờ hình tượng, và tất cả những ai yêu thích và thực hành điều giả dối.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chó” ở đây có lẽ là hình ảnh ẩn dụ chỉ những kẻ bị loại trừ và ô uế về đạo đức; một số người hiểu từ này theo nghĩa cụ thể hơn.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “tất cả những ai yêu thích và thực hành một lời nói dối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξω
  choice: Bên ngoài là
  rationale: Giữ vị trí nhấn mạnh ở đầu câu và diễn đạt sự bị loại khỏi thành trong ngữ cảnh.
- source_word: κύνες
  choice: những kẻ bị gọi là chó
  rationale: Giữ nguyên hình ảnh cụ thể và sắc thái ẩn dụ chỉ những người bị loại trừ, đồng thời cách diễn đạt tiếng Việt cho thấy đây không phải lời mô tả động vật theo nghĩa đen.
- source_word: φάρμακοι
  choice: những kẻ hành tà thuật
  rationale: Trong sách Khải Huyền, từ này chỉ người thực hành ma thuật hoặc phù phép; cách dịch này rõ nghĩa và phù hợp văn phong hiện đại.
- source_word: πόρνοι
  choice: những kẻ gian dâm
  rationale: Diễn đạt loại người thực hành sự vô luân về tình dục mà không thu hẹp vào một hành vi duy nhất.
- source_word: φονεῖς
  choice: những kẻ giết người
  rationale: Chuyển tải trực tiếp danh từ chỉ người phạm tội giết người.
- source_word: εἰδωλολάτραι
  choice: những kẻ thờ thần tượng
  rationale: Cách nói tự nhiên, rõ ràng trong tiếng Việt hiện đại, giữ nguyên ý thờ lạy các thần tượng.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: tất cả những ai yêu thích và thực hành điều giả dối
  rationale: Hai phân từ hiện tại mô tả khuynh hướng và nếp sống đặc trưng; “điều giả dối” giữ được nghĩa rộng của ψεῦδος.
- source_word: ψεῦδος
  choice: điều giả dối
  rationale: Có thể chỉ một lời nói dối hoặc sự giả dối nói chung; cách dịch chính giữ phạm vi rộng, còn nghĩa hẹp được ghi ở chú thích.
theological_decisions:
- issue: Có nên giải nghĩa κύνες trong chính văn thành một nhóm cụ thể hay không
  choice: Giữ hình ảnh “chó” trong chính văn, kèm chú thích về tính ẩn dụ.
  alternative: kẻ ô uế; kẻ trơ trẽn; một nhóm phạm tội cụ thể
  rationale: Nguyên văn dùng hình ảnh cụ thể và không xác định rõ một nhóm riêng; giữ hình ảnh tránh áp đặt một cách giải thích còn tranh luận.
- issue: Nên hiểu ψεῦδος là “một lời nói dối” hay “điều giả dối” theo nghĩa rộng
  choice: điều giả dối
  alternative: một lời nói dối
  rationale: Cụm “yêu thích và thực hành” có thể mô tả sự gắn bó thường xuyên với cái giả dối nói chung, nhưng nghĩa hẹp vẫn có thể có nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê được giữ để phản ánh nhịp điệu của nguyên văn; các từ “những kẻ” làm rõ rằng danh sách nói về các hạng người. Mọi dấu chú thích đều xuất hiện trong chính văn.
