id: REV.22.13
reference: Revelation 22:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: vi
  text: Ta là An-pha và Ô-mê-ga, là Đấng Đầu Tiên và Đấng Cuối Cùng, là Khởi Đầu và Kết Thúc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “là Nguồn Gốc và Đích Đến.”'
    reason: Bảo lưu các sắc thái từ vựng có thể có của ἀρχή và τέλος.
lexical_decisions:
- source_word: ἐγὼ
  choice: Ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để nhấn mạnh. “Ta” phù hợp với lời tự xưng trang nghiêm của Đấng phán trong văn cảnh này.
- source_word: τὸ Ἄλφα
  choice: An-pha
  rationale: Giữ tên chữ cái đầu tiên của bảng chữ cái Hy Lạp như một danh hiệu biểu tượng, thay vì đổi thành chữ cái tiếng Việt.
- source_word: τὸ Ὦ
  choice: Ô-mê-ga
  rationale: Giữ tên chữ cái cuối cùng của bảng chữ cái Hy Lạp, tương ứng với An-pha và bảo toàn danh hiệu quen thuộc trong sách Khải Huyền.
- source_word: ὁ πρῶτος
  choice: Đấng Đầu Tiên
  rationale: Tính từ có mạo từ được dùng như danh từ chỉ danh hiệu; thêm “Đấng” giúp tiếng Việt tự nhiên và thể hiện chức năng danh xưng.
- source_word: ὁ ἔσχατος
  choice: Đấng Cuối Cùng
  rationale: Dịch đối xứng với “Đấng Đầu Tiên”, giữ nguyên tính toàn diện của cặp danh hiệu.
- source_word: ἡ ἀρχὴ
  choice: Khởi Đầu
  rationale: Giữ sự song song cô đọng với τέλος; cách viết hoa thể hiện đây là một phần của chuỗi danh hiệu.
- source_word: τὸ τέλος
  choice: Kết Thúc
  rationale: Là đối ngữ tự nhiên của “Khởi Đầu”; vẫn để ngỏ sắc thái “đích đến” có thể có của τέλος qua chú thích.
theological_decisions:
- issue: Ba cặp danh hiệu diễn tả tính bao quát và quyền tối thượng mà không giải thích quá mức hàm ý siêu hình
  choice: Ta là An-pha và Ô-mê-ga, là Đấng Đầu Tiên và Đấng Cuối Cùng, là Khởi Đầu và Kết Thúc.
  alternative: Ta là An-pha và Ô-mê-ga, là Đấng Đầu Tiên và Đấng Cuối Cùng, là Nguồn Gốc và Đích Đến.
  rationale: Bản dịch chính giữ cấu trúc ba cặp song song của nguyên văn và cách diễn đạt quen thuộc “khởi đầu—kết thúc”. Chú thích bảo lưu khả năng ἀρχή và τέλος nhấn mạnh nguồn gốc và mục tiêu, không áp đặt một cách hiểu thần học duy nhất.
translation_notes:
  register: Văn phong trang nghiêm, cô đọng và dễ hiểu trong tiếng Việt hiện đại. Dùng “Ta” cho lời tự xưng uy nghi; phiên âm “An-pha” và “Ô-mê-ga” theo cách đọc quen thuộc. Các thành tố danh hiệu được viết hoa nhất quán.
