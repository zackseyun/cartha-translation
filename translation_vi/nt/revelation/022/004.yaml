source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: vi
  text: Họ sẽ thấy mặt Ngài,[a][b] và danh Ngài sẽ ở trên trán họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ sẽ nhìn thấy mặt Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: Đại từ số ít “Ngài” có thể chỉ Đức Chúa Trời, hoặc phản ánh quyền trị vì chung của Đức Chúa Trời và Chiên Con trong văn cảnh liền trước.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: sẽ thấy
  rationale: Động từ tương lai của ὁράω ở đây mang nghĩa trực tiếp là nhìn thấy. “Sẽ thấy” tự nhiên trong tiếng Việt hiện đại và giữ được ý nghĩa thị giác; “sẽ chiêm ngưỡng” trang trọng hơn nhưng thêm sắc thái không bắt buộc.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: mặt Ngài
  rationale: πρόσωπον trước hết có nghĩa là “mặt”; làm tân ngữ trực tiếp của ὄψονται nên cách hiểu cụ thể “thấy mặt Ngài” phù hợp hơn “thấy sự hiện diện của Ngài”. Đại từ αὐτοῦ được giữ bằng “Ngài”, không thay bằng một danh xưng cụ thể.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: danh Ngài
  rationale: ὄνομα được dịch theo nghĩa căn bản là “danh”. Cách nói này tự nhiên trong văn phong Kinh Thánh trang trọng và không đưa các hàm ý như quyền sở hữu, căn tính hay phẩm cách vào chính câu dịch.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: ở trên trán họ
  rationale: ἐπί với sở hữu cách diễn tả vị trí. “Ở trên trán họ” rõ ràng, tự nhiên và giữ quan hệ vị trí của nguyên văn; tiếng Việt dùng danh từ số ít tập hợp “trán” sau đại từ số nhiều một cách tự nhiên.
- source_word: καὶ … καὶ
  choice: Họ …, và …
  rationale: Hai mệnh đề được nối bằng “và”, bảo toàn cấu trúc phối hợp, bổ sung của nguyên văn. Liên từ đầu câu được thể hiện tự nhiên qua sự nối tiếp với văn cảnh thay vì dùng “Và” một cách cứng nhắc.
theological_decisions:
- issue: Đối tượng được chỉ bởi αὐτοῦ trong “mặt Ngài” và “danh Ngài”
  choice: Giữ đại từ tôn kính “Ngài”, không xác định rõ là Đức Chúa Trời hay Chiên Con.
  alternative: Dịch rõ thành “mặt Đức Chúa Trời” và “danh Đức Chúa Trời”, hoặc hiểu đại từ số ít trong mối liên hệ với quyền trị vì chung của Đức Chúa Trời và Chiên Con.
  rationale: Văn cảnh gần đặt Đức Chúa Trời và Chiên Con trong quan hệ chặt chẽ (Khải Huyền 22:3), còn nguyên văn dùng đại từ số ít mà không lặp lại danh xưng. Giữ “Ngài” bảo toàn sự mơ hồ và sức căng thần học của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để vừa thể hiện sự tôn kính vừa giữ nguyên tính không xác định của đại từ Hy Lạp. “Danh” phù hợp văn phong Kinh Thánh hơn “tên” trong ngữ cảnh thần học này. Các dấu chú thích đều xuất hiện trong chính văn.
