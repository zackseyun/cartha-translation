id: REV.22.9
reference: Revelation 22:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: vi
  text: 'Người ấy nói với tôi: “Đừng làm thế![a] Tôi cũng là nô lệ[b] như anh, như các anh em anh—là những nhà tiên tri—và như những người tuân giữ những lời của sách này. Hãy thờ phượng Đức Chúa Trời!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp nói lược, sát chữ là “Hãy coi chừng, đừng”; điều bị cấm—việc Giăng định thờ lạy thiên sứ—được hiểu từ ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Cụm được dịch là “cũng là nô lệ như” chỉ những người cùng mang thân phận nô lệ dưới một chủ; thiên sứ khẳng định mình cũng lệ thuộc Đức Chúa Trời như Giăng và những người khác.
    reason: lexical_alternative
  - marker: c
    text: 'So sánh Khải Huyền 19:10, nơi thiên sứ cũng sửa lại hành động ấy bằng mệnh lệnh: “Hãy thờ phượng Đức Chúa Trời!”'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Đừng làm thế!
  rationale: Cụm Hy Lạp là một lời ngăn cấm đột ngột, theo sát ngữ cảnh Giăng đang định phủ phục thờ lạy thiên sứ. Tiếng Việt cần nêu hành động được ngầm hiểu để câu tự nhiên và rõ nghĩa.
- source_word: σύνδουλός
  choice: Tôi cũng là nô lệ như anh
  rationale: σύνδουλος chỉ người cùng mang thân phận nô lệ dưới một chủ. Cách diễn đạt này giữ được ý về thân phận lệ thuộc chung mà tự nhiên hơn từ ghép sát chữ “đồng nô lệ” trong tiếng Việt.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: các anh em của anh là những nhà tiên tri
  rationale: Giữ danh từ giống đực số nhiều của nguyên văn và thể hiện cụm “những nhà tiên tri” theo nghĩa đồng vị, xác định các anh em được nói đến.
- source_word: τηρούντων
  choice: tuân giữ
  rationale: τηρέω ở đây bao hàm việc gìn giữ và trung thành làm theo; “tuân giữ” bảo toàn cả sắc thái trân trọng lẫn vâng theo mà không thu hẹp thành chỉ “bảo quản” hay chỉ “vâng lời”.
- source_word: τοὺς λόγους τοῦ βιβλίου τούτου
  choice: những lời trong sách này
  rationale: “Những lời” phản ánh trực tiếp λόγους, còn “trong sách này” là cách nói tiếng Việt tự nhiên cho nội dung bằng lời của cuốn sách.
- source_word: τῷ θεῷ προσκύνησον
  choice: Hãy thờ phượng Đức Chúa Trời!
  rationale: προσκυνέω trong ngữ cảnh này chỉ hành vi thờ lạy; mệnh lệnh đặt việc thờ phượng đúng đối tượng là Đức Chúa Trời đối lập với việc thờ lạy thiên sứ.
theological_decisions:
- issue: Cách dịch ngôn ngữ về thân phận nô lệ trong σύνδουλος
  choice: Giữ rõ danh từ “nô lệ” trong câu “Tôi cũng là nô lệ như anh”.
  alternative: Tôi là bạn đồng phục vụ với anh / Tôi là đầy tớ như anh
  rationale: Lập luận của thiên sứ dựa trên việc mình cũng ở địa vị lệ thuộc dưới quyền Đức Chúa Trời, chứ không phải là đối tượng được thờ phượng. “Nô lệ” giữ được sức nặng của thân phận ấy, trong khi cấu trúc “cũng… như” làm câu tự nhiên trong tiếng Việt.
- issue: Bổ sung hành động được ngầm hiểu trong Ὅρα μή
  choice: Đừng làm thế!
  alternative: Chớ! / Hãy coi chừng, đừng!
  rationale: Nguyên văn cố ý nói lược, nhưng ngữ cảnh xác định rõ điều bị cấm là hành động thờ lạy thiên sứ. Cách dịch này làm sáng nghĩa ngữ dụng mà không thêm một khẳng định thần học mới.
- issue: Mối quan hệ giữa “các anh em” và “những nhà tiên tri”
  choice: 'Hiểu “những nhà tiên tri” là cụm đồng vị: “các anh em của anh là những nhà tiên tri”.'
  alternative: các anh em của anh và các nhà tiên tri
  rationale: Cấu trúc Hy Lạp liên kết hai cụm bằng mạo từ theo lối xác định thêm cho “các anh em”, chứ không rõ ràng nêu hai nhóm riêng biệt. Bản dịch giữ cách hiểu cú pháp có khả năng nhất mà không diễn giải họ là một tầng lớp chức vụ đặc thù.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ấy” không thêm danh xưng ngoài nguyên văn; “Đừng làm thế!” truyền đạt giọng ngăn cấm đột ngột; “nô lệ” giữ sức nặng xã hội-thần học của σύνδουλος, còn cấu trúc so sánh tránh từ ghép “đồng nô lệ” kém tự nhiên. Dùng “anh” theo ngữ cảnh một người nam được trực tiếp nói đến.
