id: REV.22.18
reference: Revelation 22:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: vi
  text: 'Tôi làm chứng[a] cho mọi người nghe những lời tiên tri của sách này[b]: nếu ai thêm vào những lời ấy, Đức Chúa Trời sẽ thêm cho người ấy những tai họa đã được chép trong sách này.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi làm chứng long trọng”; động từ ở đây là ngôn ngữ làm chứng, chứ không chỉ đơn thuần có nghĩa “tôi cảnh cáo”.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp dịch là “sách” cũng có thể chỉ “cuộn sách”, là hình thức vật chất phổ biến của văn bản thời cổ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Tôi làm chứng
  rationale: Động từ μαρτυρέω là ngôn ngữ làm chứng, mang sắc thái trang nghiêm và có thể gợi bối cảnh pháp lý. Cách dịch này giữ nguyên lực của nguyên ngữ, thay vì diễn giải trực tiếp thành “tôi cảnh cáo”.
- source_word: παντὶ τῷ ἀκούοντι
  choice: với tất cả những ai nghe
  rationale: Cụm danh hóa với phân từ hiện tại chỉ mọi người tiếp nhận lời được đọc/nghe. Cách diễn đạt này tự nhiên trong tiếng Việt và không ép phân từ thành ý tiếp diễn quá mức.
- source_word: τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου
  choice: những lời tiên tri của sách này
  rationale: “Những lời” giữ nội dung bằng lời của λόγοι, còn “tiên tri” giữ thể loại và tính chất của προφητεία. Cách diễn đạt tránh lối lặp cứng “những lời của lời tiên tri” nhưng không thu hẹp ý thành những dự đoán đơn thuần.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: Nếu ai thêm vào những lời ấy
  rationale: ἐπιτίθημι với ἐπί ở đây có nghĩa là thêm vào. Nêu lại “những lời ấy” làm rõ đại từ số nhiều αὐτά và tự nhiên hơn trong tiếng Việt.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: Đức Chúa Trời sẽ thêm cho người ấy
  rationale: 'Lặp lại “thêm” để bảo toàn phép đối ứng có chủ ý của cùng một động từ: ai thêm vào lời tiên tri thì Đức Chúa Trời sẽ thêm tai họa cho người ấy.'
- source_word: τὰς πληγὰς
  choice: những tai họa
  rationale: Trong sách Khải Huyền, πληγή thường chỉ các tai họa đoán phạt. “Tai họa” là cách nói tự nhiên, trang nghiêm và phù hợp ngữ cảnh hơn nghĩa đen “đòn đánh”.
- source_word: τὰς γεγραμμένας
  choice: đã được chép
  rationale: Phân từ hoàn thành bị động diễn tả những điều đã được ghi và hiện vẫn ở trong văn bản. “Đã được chép” truyền đạt phù hợp trạng thái ấy.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: trong sách này
  rationale: βιβλίον có thể chỉ một cuộn sách trong hình thức vật chất cổ đại, nhưng “sách” là cách gọi tự nhiên cho tác phẩm và giữ nhất quán trong câu.
theological_decisions:
- issue: Lời mở đầu là lời làm chứng hay lời cảnh cáo
  choice: Tôi làm chứng
  alternative: Tôi cảnh cáo
  rationale: Nguyên ngữ dùng động từ thuộc ngôn ngữ làm chứng. Nội dung tiếp theo rõ ràng có chức năng cảnh cáo, nhưng bản dịch không nên thay động từ gốc bằng phần diễn giải chức năng ấy.
- issue: Phạm vi của “sách này”
  choice: Giữ nguyên cách nói “sách này” mà không xác định rộng hơn
  alternative: Toàn bộ Kinh Thánh
  rationale: Trong cú pháp trực tiếp, cụm từ quy chiếu đến sách/lời tiên tri đang được nhắc đến. Bản dịch không mở rộng hoặc thu hẹp phạm vi theo một kết luận giáo lý nằm ngoài câu.
- issue: Tính đối ứng của sự đoán phạt
  choice: Lặp động từ “thêm” ở cả hành vi của con người và hành động của Đức Chúa Trời
  alternative: Nếu ai xuyên tạc… Đức Chúa Trời sẽ giáng…
  rationale: Nguyên văn cố ý lặp ἐπιτίθημι. Giữ phép đối ứng truyền đạt sự tương xứng trong lời tuyên án mà không giải thích thêm bản chất thần học của hình phạt.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ nghe khi đọc công khai. Dùng “Đức Chúa Trời” theo cách gọi phổ thông trong văn bản Kinh Thánh tiếng Việt; giữ phép lặp “thêm… thêm” dù vế sau hơi trang trọng hơn khẩu ngữ, nhằm bảo toàn cấu trúc tu từ của nguyên văn. Các ký hiệu chú thích đều xuất hiện trong chính văn.
