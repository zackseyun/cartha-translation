  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: vi
  text: Nguyện ân điển của Chúa Giê-su ở cùng mọi người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Nguyện ân điển của Chúa Giê-su ở cùng tất cả các thánh đồ”; những thủ bản khác chép: “ở cùng tất cả anh chị em.”'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Cách diễn đạt quen thuộc và trang trọng trong tiếng Việt cho χάρις ở lời chúc phước kết thư, giữ được sắc thái ân huệ cứu rỗi và mối tương giao.
- source_word: κυρίου
  choice: Chúa
  rationale: Thể hiện κύριος như tước hiệu chỉ về Đức Giê-su, tự nhiên và đã được xác lập trong cách dùng Cơ Đốc giáo tiếng Việt.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách viết tiếng Việt thông dụng.
- source_word: μετὰ
  choice: ở cùng
  rationale: Nguyên văn không có động từ; tiếng Việt cần bổ sung tối thiểu cụm 'Nguyện ... ở cùng' để diễn đạt tự nhiên công thức chúc phước.
- source_word: πάντων
  choice: mọi người
  rationale: Giữ phạm vi rộng, không thêm 'anh chị em' hay 'các thánh đồ'; 'mọi người' là cách diễn đạt tự nhiên hơn một từ 'tất cả' đứng độc lập trong tiếng Việt.
theological_decisions:
- issue: Có nên xác định rõ những người nhận lời chúc phước hay không
  choice: mọi người
  alternative: tất cả anh chị em; tất cả các thánh đồ
  rationale: Bản SBLGNT chỉ có πάντων, không kèm danh từ hoặc đại từ xác định. 'Mọi người' bảo toàn tính rộng và không xác định ấy, trong khi các cách khác sẽ đưa vào nội dung thuộc những dị bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng công thức chúc phước tự nhiên “Nguyện ... ở cùng”, đồng thời giữ đối tượng của πάντων rộng và không bị giới hạn. Dấu chú thích [a] xuất hiện trong chính văn.
