  terminology: “Cây sự sống,” “chữa lành,” và “các dân tộc” là các thuật ngữ phù hợp, nhất quán với sắc thái liên văn bản và phạm vi của ξύλον ζωῆς, θεραπεία, và ἔθνη. “Đường phố của thành ấy” là cách chuyển tự nhiên cho τῆς πλατείας αὐτῆς trong ngữ cảnh thành thánh.
