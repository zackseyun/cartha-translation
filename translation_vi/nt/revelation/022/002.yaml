id: REV.22.2
reference: Revelation 22:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: vi
  text: Giữa đường phố của thành ấy[a], và ở phía này và phía kia con sông, là cây sự sống, sinh ra mười hai quả[b], mỗi tháng đều cho ra quả[c]. Lá của cây ấy dùng để chữa lành các dân tộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách mô tả trong tiếng Hy Lạp rất cô đọng: cây ở giữa đường phố và “ở phía này và phía kia” con sông. Phần sau cũng có thể được hiểu là “ở hai bên con sông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “mười hai quả.” Cụm từ này có thể chỉ mười hai loại quả hoặc một chu kỳ kết quả trọn vẹn, dồi dào.'
    reason: lexical_alternative
  - marker: c
    text: Hình ảnh này gợi lại cây sự sống trong Sáng Thế Ký 2:9 và những cây ra quả mỗi tháng trong Ê-xê-chi-ên 47:12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: ở giữa đường phố của thành
  rationale: Diễn đạt tự nhiên vị trí ở giữa đường phố; “của thành” làm rõ đại từ giống cái αὐτῆς quy chiếu về thành phố trong mạch văn mà không lặp cứng nhắc.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: ở bên này lẫn bên kia
  rationale: Giữ sát cách diễn đạt phân bố không gian của tiếng Hy Lạp và không làm phẳng hình ảnh thành một mô tả địa lý quá rõ ràng.
- source_word: ξύλον ζωῆς
  choice: cây sự sống
  rationale: ξύλον trong liên văn bản Sáng Thế Ký–Khải Huyền chỉ cây; dạng số ít và hình ảnh quen thuộc được bảo toàn.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: sinh ra mười hai quả
  rationale: Giữ số từ và danh từ như bản Hy Lạp, không tự thêm “loại” hay “mùa”; chú thích nêu các cách hiểu hợp lý.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: mỗi tháng cho quả của mình
  rationale: “Mỗi tháng” thể hiện tính phân phối đều đặn; “cho quả” là cách nói tự nhiên về cây cối mà vẫn phản ánh ἀποδιδοῦν.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: dùng để chữa lành các dân tộc
  rationale: Giữ mục đích của εἰς và phạm vi rộng của ἔθνη; “chữa lành” bảo toàn sắc thái phục hồi thay vì chỉ nói sức khỏe.
theological_decisions:
- issue: Cấu trúc không gian khó xác định của cây đối với đường phố và hai bên sông
  choice: Giữ một “cây sự sống” số ít ở giữa đường phố và ở bên này lẫn bên kia sông, không tái cấu trúc để giải thích địa hình.
  alternative: Dịch thành nhiều cây, hoặc sắp xếp lại rằng cây đứng ở mỗi bên sông.
  rationale: Câu Hy Lạp trình bày một hình ảnh khải tượng cô đọng và có độ căng về không gian. Giữ số ít tôn trọng văn bản và liên hệ với cây sự sống trong Sáng Thế Ký mà không giải quyết thay cho độc giả.
- issue: Ý nghĩa của “mười hai quả”
  choice: Dịch sát là “mười hai quả” và giải thích sự mơ hồ trong chú thích.
  alternative: Dịch rõ thành “mười hai loại quả” hoặc “mười hai mùa quả”.
  rationale: καρποὺς δώδεκα không nói rõ “loại” hay “mùa”; bản dịch chính vì vậy không nên âm thầm quyết định một cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp của một mệnh đề tiếp nối từ câu trước. Tránh từ cổ, đồng thời bảo toàn hình ảnh khải tượng và các điểm mơ hồ thực sự của nguyên văn.
