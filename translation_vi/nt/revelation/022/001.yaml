  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: vi
  text: Rồi người ấy chỉ cho tôi thấy một con sông nước sự sống, sáng ngời như pha lê, chảy ra từ ngai của Đức Chúa Trời và Chiên Con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: chỉ cho tôi
  rationale: Diễn đạt trực tiếp hành động cho người khác thấy trong khải tượng, không thêm sắc thái giải nghĩa như “mặc khải”.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: một dòng sông nước sự sống
  rationale: Giữ hình ảnh và chuỗi sở hữu của nguyên văn; “dòng sông” tự nhiên trong tiếng Việt và không thu nhỏ thành một con suối.
- source_word: λαμπρὸν
  choice: sáng ngời
  rationale: Từ này chủ yếu chỉ sự sáng chói, rực sáng; “sáng ngời” tự nhiên hơn và không chuyển nghĩa thành “trong suốt” chỉ vì phép so sánh với pha lê.
- source_word: ὡς κρύσταλλον
  choice: như pha lê
  rationale: Giữ nguyên phép so sánh do ὡς biểu thị; “pha lê” là cách gọi phổ thông, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐκπορευόμενον ἐκ
  choice: chảy ra từ
  rationale: Diễn tả tự nhiên chuyển động của một dòng sông và nguồn phát xuất của nó, đồng thời giữ giá trị hiện tại của phân từ.
- source_word: τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: ngai của Đức Chúa Trời và Chiên Con
  rationale: Giữ danh từ “ngai” ở số ít cùng hai sở hữu ngữ phối hợp, và bảo toàn tước hiệu khải huyền “Chiên Con”.
theological_decisions:
- issue: Một ngai gắn với Đức Chúa Trời và Chiên Con
  choice: ngai của Đức Chúa Trời và Chiên Con
  alternative: các ngai của Đức Chúa Trời và Chiên Con
  rationale: Nguyên văn dùng “ngai” ở số ít với hai sở hữu ngữ, nên bản dịch giữ nguyên hình ảnh một ngai mà không giải thích thêm bản chất của sự đồng trị vì; chuyển sang số nhiều sẽ trái với hình thức Hy Lạp.
- issue: Ý nghĩa của “nước sự sống”
  choice: nước sự sống
  alternative: nước ban sự sống
  rationale: Cấu trúc sở hữu trong nguyên văn được giữ lại để không quyết định thay cho độc giả rằng đây chỉ là nước có tác dụng ban sự sống; cách diễn đạt vẫn bảo toàn chiều sâu biểu tượng Kinh Thánh.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Vị ấy” giữ đại từ ngôi thứ ba của nguyên văn mà không tự ý nêu rõ danh tính; “Rồi” nối cảnh khải tượng tự nhiên. Câu giữ trật tự hình ảnh của tiếng Hy Lạp nhưng vẫn đọc trôi chảy trong tiếng Việt.
