revisions:
- from: Rồi vị ấy chỉ cho tôi một dòng sông nước sự sống, sáng ngời như pha lê[a], chảy ra từ ngai của Đức Chúa Trời và Chiên Con.[b]
  to: Rồi người ấy chỉ cho tôi thấy một con sông nước sự sống, sáng ngời như pha lê, chảy ra từ ngai của Đức Chúa Trời và Chiên Con.
  rationale: Bản sửa chỉ làm cho cách diễn đạt tiếng Việt tự nhiên hơn và bỏ các chú thích không hỗ trợ một bất định thực sự của nguyên văn. Bản sửa vẫn giữ chủ ngữ không nêu tên, mạo từ bất định của “một con sông,” hình ảnh “nước sự sống,” sắc thái sáng chói của λαμπρόν, phép so sánh với κρύσταλλος, và một ngai chung của Đức Chúa Trời cùng Chiên Con.
  reviewer_model: gpt-5.6-terra
