id: REV.22.14
reference: Revelation 22:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: vi
  text: Phước cho những người giặt áo choàng của mình[a][b], để họ có quyền đến với cây sự sống và được vào thành qua các cổng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Phước cho những người làm theo các điều răn của Ngài,” hoặc “tuân giữ các điều răn của Ngài,” thay cho “giặt áo choàng của mình.”'
    reason: textual_variant
  - marker: b
    text: Hình ảnh giặt áo gợi lại Khải Huyền 7:14, nơi áo được giặt và làm trắng trong huyết Chiên Con.
    reason: cross_reference
  - marker: c
    text: 'Hay: “theo lối các cổng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Cách diễn đạt quen thuộc của lời chúc phước, giữ được chiều kích giao ước và cánh chung, thay vì chỉ diễn tả cảm giác vui sướng hay hoàn cảnh may mắn.
- source_word: πλύνοντες
  choice: giặt
  rationale: Giữ hình ảnh cụ thể của hành động giặt áo; dạng phân từ hiện tại mô tả đặc điểm của nhóm người này mà không cần diễn giải thêm cơ chế thần học.
- source_word: στολάς
  choice: áo choàng
  rationale: Diễn đạt tự nhiên loại y phục dài trong các khải tượng của sách Khải Huyền, đồng thời tránh để độc giả hiện đại hiểu nhầm “áo dài” là trang phục truyền thống Việt Nam.
- source_word: ἵνα
  choice: để
  rationale: Truyền đạt tự nhiên quan hệ mục đích hoặc kết quả của mệnh đề Hy Lạp mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: họ có quyền
  rationale: Diễn đạt đúng ngữ cảnh về quyền được tiếp cận, tự nhiên hơn lối dịch sát chữ “quyền của họ sẽ có,” và không gợi ý quyền cai trị.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: đến với cây sự sống
  rationale: Trong kết cấu với ἐξουσία, giới từ ἐπί chỉ đối tượng mà họ được quyền tiếp cận; “đến với” giữ ý tiếp cận mà không thêm ý hưởng dụng hay thống trị.
- source_word: τοῖς πυλῶσιν
  choice: theo lối các cổng
  rationale: Dạng tặng cách không có giới từ có thể chỉ phương tiện hoặc lối đi; cách dịch này tự nhiên trong tiếng Việt và giữ hình ảnh vào thành bằng lối cổng.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: được vào thành
  rationale: Truyền đạt tự nhiên động từ vào cùng sắc thái được phép hoặc được ban quyền trong mạch văn của mệnh đề ἵνα.
theological_decisions:
- issue: Dị bản văn bản trong mệnh đề đầu
  choice: 'Dịch theo SBLGNT: “những người giặt áo choàng của mình.”'
  alternative: “những người làm theo các điều răn của Ngài” hoặc “những người tuân giữ các điều răn của Ngài.”
  rationale: Bản văn nguồn được cung cấp có πλύνοντες τὰς στολὰς αὐτῶν. Dị bản về việc làm hoặc tuân giữ các điều răn có ảnh hưởng đáng kể trong truyền thống sao chép và dịch thuật nên được ghi ở chú thích, nhưng không thay thế bản văn chính.
- issue: Mối liên hệ giữa việc giặt áo và quyền đến với sự sống
  choice: Giữ nguyên mối liên hệ mà câu văn nêu, không giải thích việc giặt áo như công trạng của con người hay nêu cơ chế cứu rỗi trong chính văn.
  alternative: Giải thích trực tiếp đây là hành động lập công, hoặc thêm vào chính văn rằng áo được giặt trong huyết Chiên Con.
  rationale: Câu này không tự trình bày cơ chế thần học. Khải Huyền 7:14 giúp nhận ra tiếng vọng biểu tượng, nhưng thông tin ấy phù hợp với chú thích hơn là được thêm vào bản dịch chính.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Phước cho” giữ âm hưởng của lời chúc phước; “áo choàng” tránh nghĩa riêng dễ gây nhầm của “áo dài.” Câu văn không thêm chủ thể thần học hay cơ chế cứu rỗi ngoài những gì bản văn nêu.
