  to: Ta, Đức Giê-su, đã sai thiên sứ của Ta đến làm chứng cho anh em về những điều này cho các hội thánh.[a] Ta là rễ và hậu duệ của Đa-vít,[b] là sao mai sáng chói.
  rationale: Sửa đại từ người nghe từ “các con” thành “anh em” để không thêm sắc thái quan hệ ngoài nguyên văn, và sửa cấu trúc mở đầu thành đồng cách tự nhiên trong tiếng Việt. Các phần còn lại được giữ vì phản ánh trung thành nguyên văn và bảo toàn tính đa nghĩa đã được chú thích của ἐπὶ ταῖς ἐκκλησίαις.
