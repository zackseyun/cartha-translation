id: REV.22.16
reference: Revelation 22:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: vi
  text: Ta, Đức Giê-su, đã sai thiên sứ của Ta đến làm chứng cho anh em về những điều này cho các hội thánh.[a] Ta là rễ và hậu duệ của Đa-vít,[b] là sao mai sáng chói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các hội thánh” hoặc “liên quan đến các hội thánh.” Cụm từ Hy Lạp ἐπὶ ταῖς ἐκκλησίαις có thể mang nhiều sắc thái.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “dòng dõi của Đa-vít.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Chính Ta, là Đức Giê-su
  rationale: Đại từ được nêu rõ mang sắc thái nhấn mạnh, còn tên riêng xác định người nói. Cách diễn đạt này tự nhiên trong tiếng Việt và không biến cụm từ thành một mệnh đề đồng nhất riêng biệt.
- source_word: ἔπεμψα
  choice: đã sai
  rationale: Thì aorist chỉ hành động sai phái đã xảy ra; “đã sai” diễn đạt rõ hành động hoàn tất mà không áp đặt sắc thái thời quá chi tiết.
- source_word: τὸν ἄγγελόν μου
  choice: thiên sứ của Ta
  rationale: Trong bối cảnh Khải Huyền, ἄγγελος phù hợp nhất với một hữu thể thiên giới; “thiên sứ” là cách gọi trang trọng và quen thuộc.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: đến làm chứng cho các con về những điều này
  rationale: Động từ nguyên mẫu nêu mục đích của việc sai phái. Tiếng Việt cần “về” để diễn đạt tự nhiên nội dung được làm chứng; “các con” thể hiện số nhiều của ὑμῖν trong lời trực tiếp của Chúa Giê-su.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: vì các hội thánh
  rationale: ἐπί với cách dữ liệu cho phép nhiều sắc thái. “Vì các hội thánh” thể hiện đối tượng hưởng lợi hoặc phạm vi hướng đến mà không buộc cụm từ mang nghĩa địa điểm.
- source_word: ἡ ῥίζα
  choice: rễ
  rationale: Giữ nguyên hình ảnh ẩn dụ về nguồn gốc, không diễn giải thành “cội nguồn” và vì thế bảo toàn nghịch lý của danh hiệu.
- source_word: τὸ γένος Δαυίδ
  choice: hậu duệ của Đa-vít
  rationale: γένος có thể chỉ dòng dõi hoặc hậu duệ; trong lời tự xưng số ít, “hậu duệ” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: sao mai sáng chói
  rationale: Cụm danh hiệu chồng lớp mô tả ngôi sao vừa sáng chói vừa thuộc buổi sớm; cách gộp này tự nhiên và giữ hình ảnh sống động.
theological_decisions:
- issue: Sự tự nhận mang tính Mê-si liên hệ với Đa-vít
  choice: “rễ và hậu duệ của Đa-vít”
  alternative: “cội nguồn và dòng dõi của Đa-vít”
  rationale: Bản dịch giữ nguyên sự căng thẳng khi Đức Giê-su vừa được gọi là “rễ” vừa là “hậu duệ” của Đa-vít, không giải thích nghịch lý theo một hệ phái.
- issue: Danh hiệu Ki-tô học “sao mai”
  choice: “sao mai sáng chói”
  alternative: “ngôi sao sáng, tức sao mai”
  rationale: Giữ đây là lời Đức Giê-su trực tiếp tự nhận, bảo toàn cả yếu tố ánh sáng và buổi sớm mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” để thể hiện lời phán trực tiếp cùng đại từ số nhiều; dùng “hội thánh” theo nghĩa cộng đồng tín hữu. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
