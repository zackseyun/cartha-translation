id: REV.19.2
reference: Revelation 19:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: vi
  text: vì các phán quyết của Ngài là chân thật và công chính; vì Ngài đã xét xử đại kỹ nữ, kẻ đã làm bại hoại cả đất bởi sự gian dâm của mình, và đã báo thù cho máu của các nô lệ của Ngài do tay nó đổ ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nô lệ” dịch từ doulos trong tiếng Hy Lạp; từ này cũng có thể được dịch là “tôi tớ”. Cách dịch “nô lệ” giữ sắc thái mạnh về việc họ thuộc về một chủ.
    reason: Nêu phương án dịch quan trọng của thuật ngữ δοῦλος và giải thích sắc thái của lựa chọn trong bản chính.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ
  choice: các phán quyết của Ngài là chân thật và công chính
  rationale: 'Giữ cấu trúc vị ngữ và sắc thái tư pháp: ἀληθιναί nói các phán quyết phù hợp với chân lý, còn δίκαιαι nói chúng ngay thẳng, chính đáng.'
- source_word: ἔκρινεν
  choice: đã xét xử
  rationale: Diễn đạt động từ aorist κρίνω bằng hành động đã hoàn tất, đồng thời không thu hẹp nghĩa thành riêng việc kết án.
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: đại kỹ nữ
  rationale: “Kỹ nữ” là từ hiện đại, trang trọng vừa đủ và giữ sức nặng của hình tượng; “đại” phù hợp văn phong Khải Huyền hơn cụm dài “kỹ nữ vĩ đại”.
- source_word: ἔφθειρεν τὴν γῆν
  choice: làm bại hoại đất
  rationale: φθείρω tại đây có sắc thái làm hư hoại về đạo đức và tôn giáo; γῆ trong tầm nhìn phổ quát của Khải Huyền được dịch là “đất”, không thu hẹp thành một miền.
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: bởi sự gian dâm của mình
  rationale: ἐν có thể chỉ phương tiện hoặc phạm vi; “bởi” diễn đạt tự nhiên việc sự gian dâm là cách thức gây bại hoại. “Gian dâm” giữ cả nghĩa tình dục trực tiếp lẫn khả năng biểu tượng về sự bất trung thờ thần tượng.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: đã báo trả cho máu
  rationale: ἐκδικέω chỉ việc thi hành công lý để báo trả cho nạn nhân. Cách nói này giữ thành ngữ Kinh Thánh “máu” đại diện cho sinh mạng bị sát hại, thay vì giải thích quá mức.
- source_word: τῶν δούλων αὐτοῦ
  choice: các nô lệ Ngài
  rationale: δοῦλος theo nghĩa căn bản là người thuộc quyền một chủ. “Nô lệ” giữ sắc thái thuộc trọn về Ngài mạnh hơn “đầy tớ”, dù tiếng Việt hiện đại có thể thấy từ này khắc nghiệt.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: từ tay nó
  rationale: Giữ hình ảnh Semit chỉ tác nhân và trách nhiệm. Đại từ “nó” quy chiếu về hình tượng đại kỹ nữ và tránh nhân hóa kính trọng.
theological_decisions:
- issue: Cách dịch δοῦλοι khi nói về những người thuộc về Đức Chúa Trời
  choice: các nô lệ Ngài
  alternative: các tôi tớ Ngài
  rationale: Bản chính giữ sức nặng pháp lý-xã hội của δοῦλος và ý niệm thuộc trọn quyền Chủ. Chú thích nêu “tôi tớ” là cách dịch tiếng Việt tự nhiên, truyền thống hơn mà không khẳng định một hệ phái.
- issue: Sắc thái của πορνεία trong hình tượng Khải Huyền
  choice: sự gian dâm
  alternative: sự vô luân về tình dục; sự bất trung mang tính thờ thần tượng
  rationale: Không giải quyết dứt khoát hình tượng theo một nghĩa duy nhất; “gian dâm” cho phép cả nghĩa tình dục và nghĩa biểu tượng về bất trung.
- issue: Ý nghĩa của ἐξεδίκησεν τὸ αἷμα
  choice: đã báo trả cho máu
  alternative: đã báo thù cho máu; đã đòi lại công lý cho máu
  rationale: “Báo trả” giữ cả công lý tư pháp lẫn sự trừng phạt, tránh làm hành động của Đức Chúa Trời nghe như sự trả thù cá nhân.
translation_notes:
  register: Văn phong trang trọng, giàu sắc thái tư pháp và phù hợp lời ca ngợi trong Khải Huyền. Dùng “Ngài” cho đại từ chỉ Đức Chúa Trời; không bổ sung danh xưng không có trong câu Hy Lạp. Dấu chú thích được đặt ngay sau mệnh đề chứa thuật ngữ cần giải thích.
