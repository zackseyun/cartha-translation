id: REV.19.4
reference: Revelation 19:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: vi
  text: 'Hai mươi bốn trưởng lão và bốn sinh vật sấp mình xuống và thờ phượng Đức Chúa Trời, là Đấng ngự trên ngai, rồi nói: “A-men! Ha-lê-lu-gia![a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nghĩa là “Hãy ngợi khen Yah!”; cũng có thể diễn là “Hãy ngợi khen CHÚA!” Đây là một lời tung hô phụng vụ Hê-bơ-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: sấp mình xuống
  rationale: Trong bối cảnh thờ phượng, động từ chỉ hành động phủ phục chứ không phải vô tình té ngã; cách dịch này tự nhiên và làm rõ tư thế tôn kính.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: hai mươi bốn trưởng lão
  rationale: “Trưởng lão” là cách gọi quen thuộc, trang trọng và phù hợp với vai trò của các nhân vật này trong sách Khải Huyền.
- source_word: τὰ τέσσαρα ζῷα
  choice: bốn sinh vật
  rationale: “Sinh vật” giữ được ý về những hữu thể sống quanh ngai, đồng thời không khiến người đọc hiểu đơn giản là thú vật thông thường.
- source_word: προσεκύνησαν
  choice: thờ phượng
  rationale: Vì đối tượng là Đức Chúa Trời và hành động đi kèm sự phủ phục, động từ ở đây biểu thị sự thờ phượng, không chỉ là cúi chào.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Đây là cách gọi θεός trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt Cơ Đốc.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: Đấng ngự trên ngai
  rationale: Cách diễn đạt trang trọng, tự nhiên, giữ chức năng xác định Đức Chúa Trời là Đấng đang ở trên ngai.
- source_word: λέγοντες
  choice: và nói
  rationale: Diễn đạt tự nhiên trong tiếng Việt mối liên hệ giữa hành động thờ phượng và lời tung hô tiếp theo.
- source_word: Ἀμήν
  choice: A-men
  rationale: Giữ nguyên lời đáp phụng vụ đã quen thuộc thay vì giải nghĩa thành “thật vậy” hoặc “xin được như vậy”.
- source_word: Ἁλληλουϊά
  choice: Ha-lê-lu-gia
  rationale: Phiên âm lời tung hô phụng vụ Hê-bơ-rơ đã được đưa nguyên dạng vào bản văn Hy Lạp; ý nghĩa được nêu ở chú thích.
theological_decisions:
- issue: Cách chuyển dịch Ἁλληλουϊά, lời tung hô Hê-bơ-rơ được phiên âm trong bản văn Hy Lạp
  choice: Ha-lê-lu-gia
  alternative: Hãy ca ngợi CHÚA; Hãy ca ngợi Yah
  rationale: Giữ hình thức phiên âm bảo tồn tính chất lời tung hô phụng vụ của bản văn và không biến nó thành một câu trần thuật; chú thích cung cấp nghĩa gốc mà không áp đặt cách phục nguyên danh riêng trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “sấp mình xuống” để biểu đạt rõ hành động phủ phục trong thờ phượng; giữ hai lời tung hô phụng vụ dưới dạng phiên âm quen thuộc. Dấu chú thích [a] được đặt ngay sau “Ha-lê-lu-gia!”.
