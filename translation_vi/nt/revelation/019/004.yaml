  - severity: low
    issue: Chú thích gọi “Hãy ca ngợi CHÚA” là nghĩa chính và “Hãy ca ngợi Yah” là sát nghĩa hơn.
    rationale: Ha-lê-lu-gia là lời tung hô Hê-bơ-rơ có nghĩa sát là “Hãy ngợi khen Yah.” Cách dùng “CHÚA” có thể nêu như phương án diễn dịch theo quy ước dịch YHWH, nhưng không nên đảo thứ tự nghĩa sát.
