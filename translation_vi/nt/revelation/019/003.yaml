  source_fidelity: 'Bản dịch truyền đạt đầy đủ các yếu tố của Hy Lạp: lời nói được lặp lại «lần thứ hai», lời tung hô Ἁλληλουϊά được giữ ở dạng phiên âm, và hình ảnh khói của Ba-by-lôn bốc lên với thời hạn «đời đời vô cùng». «Cứ bốc lên» diễn đạt thích đáng sắc thái hiện tại/tính tiếp diễn của ἀναβαίνει trong khi mệnh đề thời gian đã làm rõ tính vĩnh viễn. «Khói của nó» quy chiếu tự nhiên đến thành Ba-by-lôn trong tiếng Việt, vốn không đánh dấu giống ngữ pháp như tiếng Hy Lạp.'
  naturalness: Văn bản tự nhiên, trang trọng, và phù hợp văn cảnh khải huyền. «Rồi lần thứ hai, họ nói» nối mạch rõ ràng với lời tung hô trước đó; «đời đời vô cùng» là lối nói Kinh Thánh quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
