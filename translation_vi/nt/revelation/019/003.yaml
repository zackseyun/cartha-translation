id: REV.19.3
reference: Revelation 19:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: vi
  text: 'Rồi lần thứ hai, họ nói: “Ha-lê-lu-gia!” Khói của nó cứ bốc lên đời đời vô cùng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp sát nghĩa là “cho đến các thời đại của các thời đại,” một thành ngữ chỉ thời gian không chấm dứt.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: lần thứ hai
  rationale: Danh cách đối cách dùng như trạng từ, chỉ sự lặp lại có trình tự; “lần thứ hai” giữ rõ sắc thái tuần tự của nguyên văn.
- source_word: εἴρηκαν
  choice: họ nói
  rationale: Đây là dạng hoàn thành của λέγω. Trong lối kể tiếng Việt, “họ nói” tự nhiên và không thêm sắc thái lớn tiếng vốn không nằm trong chính động từ.
- source_word: Ἁλληλουϊά
  choice: Ha-lê-lu-gia
  rationale: Giữ hình thức phiên âm của lời tung hô phụng vụ quen thuộc, thay vì diễn giải thành “Hãy ngợi khen Đức Chúa Trời,” để bảo tồn công thức đặc thù trong phân đoạn.
- source_word: ὁ καπνὸς αὐτῆς
  choice: khói của nó
  rationale: Đại từ αὐτῆς quy chiếu về Ba-by-lôn, vốn được nhân cách hóa như một phụ nữ/thành phố. Tiếng Việt không có giống ngữ pháp tương ứng; “của nó” quy chiếu tự nhiên về thành mà không thêm sắc thái khinh miệt như “mụ ta.”
- source_word: ἀναβαίνει
  choice: cứ bốc lên
  rationale: Thì hiện tại tạo hình ảnh đang tiếp diễn; “cứ bốc lên” diễn đạt tự nhiên sức kéo dài của hành động trong ngữ cảnh.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Đây là thành ngữ chỉ thời gian không chấm dứt. “Đời đời vô cùng” là cách nói trang trọng, quen thuộc trong tiếng Việt và phù hợp văn cảnh khải huyền.
theological_decisions:
- issue: Thời hạn được diễn tả bởi εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  alternative: cho đến các thời đại của các thời đại
  rationale: Trong văn cảnh phán xét chung cuộc, thành ngữ Hy Lạp truyền đạt tự nhiên ý thời gian không chấm dứt. Bản dịch giữ sức nặng ấy, đồng thời chú thích cấu trúc sát chữ để minh bạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rồi lần thứ hai” nối tự nhiên với lời tung hô trước đó; “cứ bốc lên” bảo tồn sắc thái tiếp diễn của thì hiện tại. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
