id: REV.19.20
reference: Revelation 19:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: vi
  text: Con thú bị bắt, cùng với nó là tên tiên tri giả, kẻ đã làm các dấu lạ trước mặt nó và dùng những dấu ấy để lừa dối những người đã nhận dấu của con thú cùng những người thờ lạy tượng của nó. Cả hai bị quăng sống vào hồ lửa đang cháy với lưu huỳnh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: bị bắt
  rationale: Diễn đạt tự nhiên thể bị động của πιάζω, chỉ việc bị bắt giữ.
- source_word: θηρίον
  choice: con thú
  rationale: Giữ nguyên hình tượng khải huyền quen thuộc của sách Khải Huyền.
- source_word: μετ’ αὐτοῦ
  choice: cùng với nó
  rationale: Đại từ quy chiếu về τὸ θηρίον; “nó” giữ cách gọi trung tính, không áp đặt sự nhân cách hóa.
- source_word: ψευδοπροφήτης
  choice: tên tiên tri giả
  rationale: “Tiên tri giả” chuyển trực tiếp danh từ ghép; “tên” giúp câu tiếng Việt tự nhiên và thể hiện nhân vật này là một người/nhân vật có chủ ý.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: kẻ đã làm các dấu lạ
  rationale: “Đã làm” thể hiện hành động có trước việc bị bắt; “dấu lạ” giữ sắc thái dấu hiệu của σημεῖα thay vì chỉ nhấn mạnh tính kỳ diệu.
- source_word: ἐνώπιον αὐτοῦ
  choice: trước mặt nó
  rationale: Cách nói tự nhiên, sát nghĩa “trước mặt/trong sự hiện diện của nó”.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: dùng những dấu ấy để lừa dối
  rationale: Làm rõ công cụ tính của ἐν οἷς và chuyển πλανάω bằng cách nói hiện đại, dễ hiểu.
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: những người đã nhận dấu
  rationale: “Đã nhận” thể hiện hành động đi trước; “dấu” là cách dịch chính xác và quen thuộc của χάραγμα trong Khải Huyền.
- source_word: προσκυνοῦντας
  choice: thờ lạy
  rationale: Phù hợp sắc thái phụng thờ trong văn cảnh, đồng thời giữ hình ảnh cúi mình hàm chứa trong động từ.
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Cả hai bị quăng sống
  rationale: Giữ sự nhấn mạnh rằng cả hai vẫn sống khi bị quăng xuống, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
- source_word: λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: hồ lửa cháy bằng lưu huỳnh
  rationale: Bảo tồn trực tiếp hình tượng phán xét; θείον là lưu huỳnh, còn ἐν biểu thị vật liệu/chất làm ngọn lửa cháy.
theological_decisions:
- issue: Đại từ quy chiếu về con thú
  choice: Dùng “nó/của nó”
  alternative: Dùng “hắn/của hắn” để nhân cách hóa con thú
  rationale: Danh từ Hy Lạp θηρίον thuộc giống trung; “nó” tránh đưa thêm một cách hiểu nhân cách hóa, trong khi văn cảnh vẫn cho thấy tác năng của hình tượng này.
- issue: Hình ảnh sự phán xét cuối cùng
  choice: Giữ nguyên hình ảnh “hồ lửa cháy bằng lưu huỳnh”
  alternative: Diễn giải thành địa ngục hoặc hình phạt đời đời
  rationale: Câu này trình bày một hình ảnh khải huyền cụ thể; bản dịch không nên đưa vào các công thức thần học không được nêu trực tiếp tại đây.
- issue: Quan hệ giữa các dấu lạ và sự lừa dối
  choice: 'Hiểu ἐν οἷς theo nghĩa phương tiện: “dùng những dấu ấy”'
  alternative: 'Dịch hình thức hơn: “trong những dấu ấy”'
  rationale: Trong ngữ cảnh, các dấu lạ là phương tiện tên tiên tri giả dùng để lừa dối; cách dịch này rõ nghĩa mà không thêm nội dung.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “con thú”, “tiên tri giả”, “dấu lạ”, “thờ lạy”, “hồ lửa” để duy trì thuật ngữ nhất quán của văn chương khải huyền. Không thêm chú thích vì tiếng Việt không gặp sự nhập nhằng đại từ giống ngữ pháp như tiếng Anh, và “lưu huỳnh” là từ hiện đại, rõ nghĩa.
