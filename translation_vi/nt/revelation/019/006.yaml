id: REV.19.6
reference: Revelation 19:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: vi
  text: 'Rồi tôi nghe như tiếng của một đoàn người đông đảo, như tiếng của nhiều dòng nước và như những tràng sấm dữ dội; họ nói: “Ha-lê-lu-gia! Vì Chúa, Đức Chúa Trời, Đấng Toàn Năng, trị vì[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “đã trị vì”, “đã bắt đầu trị vì” hoặc “đã lên ngôi làm vua”; động từ Hy Lạp có thể ca tụng sự biểu lộ mang tính quyết định của vương quyền Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: tôi nghe
  rationale: Động từ aorist trong mạch kể được dịch trực tiếp là “tôi nghe”.
- source_word: ὡς φωνὴν
  choice: như có tiếng / như tiếng
  rationale: ὡς biểu thị sự so sánh trong khải tượng; “như có tiếng” tự nhiên trong tiếng Việt và không đồng nhất âm thanh ấy tuyệt đối với các hình ảnh theo sau.
- source_word: ὄχλου πολλοῦ
  choice: một đoàn người đông đảo
  rationale: Diễn đạt một tập thể rất lớn, vừa dễ hiểu vừa giữ sắc thái trang trọng.
- source_word: ὑδάτων πολλῶν
  choice: nhiều dòng nước
  rationale: Giữ hình ảnh Kinh Thánh về âm thanh lớn lao, dồn dập mà không diễn giải thành một loại nước cụ thể.
- source_word: βροντῶν ἰσχυρῶν
  choice: sấm vang dội
  rationale: Chuyển tải sức mạnh của ἰσχυρῶν bằng một cách nói tự nhiên, giàu âm hưởng trong tiếng Việt.
- source_word: λεγόντων
  choice: cất lên rằng
  rationale: Giới thiệu nội dung lời tung hô và phù hợp với chủ thể tập thể cùng chuỗi hình ảnh âm thanh.
- source_word: Ἁλληλουϊά
  choice: Ha-lê-lu-gia
  rationale: Phiên âm lời tung hô phụng vụ có gốc Hê-bơ-rơ, theo dạng quen thuộc với độc giả Kinh Thánh tiếng Việt.
- source_word: ὅτι
  choice: Vì
  rationale: Giới thiệu lý do cho lời tung hô.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: Chúa, Đức Chúa Trời, Đấng Toàn Năng
  rationale: Giữ ba danh xưng đặt cạnh nhau trong bản Hy Lạp, không thêm đại từ sở hữu “chúng ta” vốn không có trong văn bản SBLGNT được cung cấp.
- source_word: ἐβασίλευσεν
  choice: trị vì
  rationale: Trong lời tung hô này, “trị vì” diễn đạt tự nhiên việc vương quyền của Đức Chúa Trời được công bố; chú thích giữ lại những cách hiểu khả dĩ của thể aorist.
theological_decisions:
- issue: Thời và sắc thái của ἐβασίλευσεν đối với sự trị vì của Đức Chúa Trời
  choice: trị vì
  alternative: đã trị vì; đã bắt đầu trị vì; đã lên ngôi làm vua
  rationale: Cách dịch chính tránh gợi ý rằng quyền tể trị của Đức Chúa Trời chỉ mới tồn tại từ lúc này, đồng thời chú thích bảo tồn khả năng câu nói ca tụng sự biểu lộ quyết định của vương quyền Ngài.
- issue: Có thêm đại từ sở hữu vào danh xưng Đức Chúa Trời hay không
  choice: Chúa, Đức Chúa Trời, Đấng Toàn Năng
  alternative: Chúa là Đức Chúa Trời chúng ta, Đấng Toàn Năng
  rationale: Bản SBLGNT được cung cấp không có ἡμῶν (“của chúng ta”), nên bản chính không thêm từ này; dị bản được nêu minh bạch trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu nhịp điệu. Phép lặp “như tiếng” duy trì cấu trúc thính giác của khải tượng; “cất lên rằng” giúp câu tự nhiên hơn trong tiếng Việt. Không thêm “chúng ta” vào bản chính vì ưu tiên văn bản Hy Lạp được cung cấp.
