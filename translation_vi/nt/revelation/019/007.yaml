revisions:
- from: Chúng ta hãy vui mừng, hân hoan và dâng vinh quang lên Ngài[a], vì hôn lễ của Chiên Con đã đến, và cô dâu của Ngài[b] đã tự chuẩn bị sẵn sàng.
  to: Chúng ta hãy vui mừng, hân hoan và dâng vinh quang cho Ngài[a], vì hôn lễ của Chiên Con đã đến, và cô dâu của Ngài[b] đã chuẩn bị sẵn sàng.
  rationale: Chỉnh sửa thuần túy về kết hợp từ và tính tự nhiên của tiếng Việt, không thay đổi nghĩa, sắc thái khuyến dụ, hay hình ảnh hôn phối của nguyên văn. Các dấu chú thích vẫn gắn chính xác với mệnh đề có hình thức tương lai và danh từ γυνή.
  reviewer_model: gpt-5.6-terra
