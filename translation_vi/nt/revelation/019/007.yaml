id: REV.19.7
reference: Revelation 19:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: vi
  text: Chúng ta hãy vui mừng, hân hoan và dâng vinh quang cho Ngài[a], vì hôn lễ của Chiên Con đã đến, và cô dâu của Ngài[b] đã chuẩn bị sẵn sàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và chúng ta sẽ dâng vinh quang cho Ngài.” Động từ Hy Lạp ở thì tương lai, nhưng tại đây có thể mang lực khuyến dụ, song song với “hãy vui mừng” và “hân hoan”.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “vợ của Ngài.” Từ Hy Lạp γυνή có thể có nghĩa là “người nữ”, “vợ” hoặc, trong ngữ cảnh hôn lễ, “cô dâu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: Chúng ta hãy vui mừng
  rationale: Thể giả định ngôi thứ nhất số nhiều mang lực khuyến dụ; cách dịch này tự nhiên và giữ lời kêu gọi chung.
- source_word: ἀγαλλιῶμεν
  choice: hân hoan
  rationale: Giữ sắc thái vui mừng mãnh liệt hơn và tạo sự tăng cường bên cạnh “vui mừng” mà không thành nặng nề.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: dâng vinh quang lên Ngài
  rationale: Dù động từ có hình thức tương lai, trong chuỗi lời kêu gọi phụng vụ này nó có thể mang lực khuyến dụ. “Dâng vinh quang” tự nhiên trong tiếng Việt và giữ danh từ δόξα.
- source_word: ἦλθεν
  choice: đã đến
  rationale: Diễn đạt một biến cố đã xảy đến với ý nghĩa hiện tại trong lời công bố khải tượng.
- source_word: γάμος
  choice: hôn lễ
  rationale: Trong ngữ cảnh cô dâu đã chuẩn bị, “hôn lễ” diễn đạt tự nhiên sự kiện cưới mà không nhập thêm ý “tiệc cưới”, vốn được nói rõ ở câu kế tiếp.
- source_word: τοῦ ἀρνίου
  choice: của Chiên Con
  rationale: Giữ danh hiệu Kitô học đặc trưng của sách Khải Huyền theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: cô dâu của Ngài
  rationale: γυνή có thể là người nữ, vợ hoặc cô dâu; trong khung cảnh hôn lễ, “cô dâu” là cách diễn đạt phù hợp và tự nhiên nhất.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: đã tự chuẩn bị sẵn sàng
  rationale: Giữ rõ ý phản thân của ἑαυτήν và trạng thái sẵn sàng do chính cô dâu chuẩn bị.
theological_decisions:
- issue: Cách gọi γυνὴ αὐτοῦ trong hình ảnh hôn lễ
  choice: cô dâu của Ngài
  alternative: vợ của Ngài
  rationale: “Cô dâu” phù hợp với cảnh hôn lễ đang đến và sự chuẩn bị cho hôn lễ; “vợ” vẫn là khả năng từ vựng thực sự nên được bảo lưu trong chú thích.
- issue: Lực ngữ pháp của δώσομεν trong chuỗi khuyến dụ
  choice: và dâng vinh quang lên Ngài
  alternative: và chúng ta sẽ dâng vinh quang lên Ngài
  rationale: Hai động từ trước là thể giả định mang nghĩa khuyến dụ; hiểu động từ tương lai tiếp theo như một phần của cùng lời kêu gọi tạo mạch văn phụng vụ tự nhiên, nhưng nghĩa tương lai trực tiếp vẫn cần được ghi nhận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có nhịp điệu phụng vụ. Dùng “hân hoan” để phân biệt sắc thái với “vui mừng”; dùng đại từ tôn kính “Ngài” nhất quán khi chỉ Chiên Con.
