id: REV.19.10
reference: Revelation 19:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: vi
  text: 'Tôi liền sấp mình xuống trước chân người ấy để thờ lạy người. Nhưng người bảo tôi: “Đừng làm vậy! Tôi là người cùng làm nô lệ với anh và với các anh em của anh[b], những người có lời chứng của Đức Giê-su[a]. Hãy thờ lạy Đức Chúa Trời, vì lời chứng của Đức Giê-su[a] là thần khí của lời tiên tri[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “lời chứng của Đức Giê-su” có thể có nghĩa là “lời chứng về Đức Giê-su” hoặc “lời chứng của chính Đức Giê-su”. Sự mơ hồ này áp dụng cho cả hai lần cụm từ xuất hiện trong câu.
    reason: alternative_reading
  - marker: b
    text: “Anh em” ở đây có thể được dùng theo nghĩa đại diện, bao gồm cả nam lẫn nữ trong cộng đồng tín hữu.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “tinh thần của lời tiên tri”; nguyên ngữ có thể nhấn mạnh thần khí hay động lực làm nên lời tiên tri, chứ không nhất thiết chỉ có nghĩa là “bản chất”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: sấp mình xuống trước chân người ấy
  rationale: Diễn đạt rõ tư thế phủ phục và giữ sắc thái của ἔμπροσθεν (‘trước’), đồng thời tự nhiên trong tiếng Việt.
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: để thờ lạy người / Hãy thờ lạy Đức Chúa Trời
  rationale: Trong ngữ cảnh, hành động này bị thiên sứ khước từ và hướng về Đức Chúa Trời, nên ‘thờ lạy’ thể hiện đúng sức nặng tôn giáo của προσκυνέω hơn là chỉ ‘cúi lạy’.
- source_word: Ὅρα μή
  choice: Đừng làm vậy!
  rationale: Chuyển tải lời ngăn cấm đột ngột, mạnh và tự nhiên trong tiếng Việt hiện đại.
- source_word: σύνδουλός
  choice: Tôi cũng là nô lệ như anh
  rationale: Giữ ý cùng chung thân phận nô lệ dưới quyền một chủ; cách nói này tự nhiên hơn một danh từ ghép như ‘đồng nô lệ’ mà vẫn bảo toàn sắc thái lệ thuộc của δοῦλος.
- source_word: ἀδελφῶν σου
  choice: các anh em của anh
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn; chú thích cho biết từ này có thể được dùng theo nghĩa đại diện cho toàn thể các tín hữu.
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: những người có lời chứng của Đức Giê-su
  rationale: ‘Có’ phản ánh trực tiếp ἔχω và không thêm ý nghĩa ‘làm chứng’ mà động từ Hy Lạp ở đây không nói rõ.
- source_word: μαρτυρία Ἰησοῦ
  choice: lời chứng của Đức Giê-su
  rationale: 'Cấu trúc ‘của Đức Giê-su’ bảo tồn độ mơ hồ của sở hữu cách Hy Lạp: có thể là lời chứng về Đức Giê-su hoặc lời chứng do chính Đức Giê-su ban ra.'
- source_word: πνεῦμα τῆς προφητείας
  choice: thần khí của lời tiên tri
  rationale: ‘Thần khí’ giữ nội dung thần học và độ mở của πνεῦμα, thay vì mặc nhiên thu hẹp thành ‘bản chất’ hay ‘tinh thần’ theo nghĩa trừu tượng.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong μαρτυρία Ἰησοῦ
  choice: Giữ cách dịch mơ hồ ‘lời chứng của Đức Giê-su’ ở cả hai lần xuất hiện
  alternative: ‘lời chứng về Đức Giê-su’ hoặc ‘lời chứng do Đức Giê-su ban’
  rationale: Sở hữu cách Ἰησοῦ có thể được hiểu theo nghĩa khách thể hoặc chủ thể; nguyên văn không buộc phải chọn một nghĩa, nên bản dịch không âm thầm giải quyết sự căng thẳng này.
- issue: Sắc thái của σύνδουλος
  choice: ‘Tôi cũng là nô lệ như anh’
  alternative: ‘Tôi là bạn cùng phục vụ với anh’ hoặc ‘tôi tớ đồng bạn’
  rationale: Lời của thiên sứ nhấn mạnh rằng mình cũng ở dưới quyền Đức Chúa Trời như Giăng và các tín hữu khác, không phải là đối tượng đáng được thờ lạy; vì vậy giữ sắc thái nô lệ của δοῦλος.
- issue: Ý nghĩa của πνεῦμα trong πνεῦμα τῆς προφητείας
  choice: ‘thần khí của lời tiên tri’
  alternative: ‘tinh thần của lời tiên tri’ hoặc ‘cốt lõi của lời tiên tri’
  rationale: πνεῦμα là từ có sức nặng thần học và có thể gợi đến nguồn linh hứng hay động lực làm nên lời tiên tri. Không nên mặc nhiên giản lược nó thành ‘bản chất’.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Đại từ ‘tôi/anh’ tránh lối ‘ta/ngươi’ cổ, trong khi danh xưng ‘Đức Chúa Trời’ và ‘Đức Giê-su’ duy trì sắc thái tôn kính. Lời cấm được diễn đạt ngắn, mạnh để phản ánh Ὅρα μή.
