source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: vi
  text: Ngài mặc một áo choàng đã nhúng trong máu[a], và danh Ngài được gọi là Lời của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhuốm máu.” Động từ Hy Lạp, theo nghĩa sát, là “nhúng” hoặc “nhuộm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: khoác
  rationale: Phân từ hoàn thành diễn tả trạng thái hiện tại của nhân vật; “khoác” tự nhiên trong tiếng Việt và phù hợp với áo choàng.
- source_word: ἱμάτιον
  choice: áo choàng
  rationale: Chỉ y phục mặc ngoài; “áo choàng” hợp với bối cảnh trang trọng của hình ảnh vị vua-chiến binh mà không xác định quá mức.
- source_word: βεβαμμένον αἵματι
  choice: đã nhúng trong máu
  rationale: Động từ βάπτω có nghĩa cốt lõi là nhúng; cách dịch này giữ hình ảnh mạnh và không tự ý đổi thành “vấy máu” hay “rảy máu”.
- source_word: κέκληται
  choice: được gọi là
  rationale: Thể hoàn thành bị động chỉ một danh xưng đã được đặt và hiện vẫn có hiệu lực; “được gọi là” diễn đạt tự nhiên ý này.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: danh Ngài
  rationale: Cách diễn đạt trang trọng, gọn và tự nhiên cho cấu trúc sở hữu Hy Lạp trong văn cảnh danh hiệu.
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: Lời Đức Chúa Trời
  rationale: λόγος ở đây là danh hiệu riêng của nhân vật cưỡi ngựa, không chỉ mang nghĩa “thông điệp”; viết hoa “Lời” làm rõ chức năng danh hiệu.
theological_decisions:
- issue: Danh hiệu Kitô học ὁ Λόγος τοῦ Θεοῦ
  choice: Lời Đức Chúa Trời
  alternative: lời của Đức Chúa Trời; sứ điệp của Đức Chúa Trời
  rationale: Mạo từ cùng ngữ cảnh cho thấy đây là danh hiệu cá nhân của nhân vật, nên cần giữ “Lời” như một danh hiệu mà không diễn giải thêm bản chất thần học.
- issue: Máu trên áo choàng thuộc về ai
  choice: Không xác định
  alternative: Máu của kẻ thù; máu của chính Ngài
  rationale: Câu Hy Lạp chỉ nói áo đã nhúng trong máu, không xác định nguồn gốc của máu; bản dịch giữ nguyên sự căng thẳng và mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho nhân vật trung tâm và “Đức Chúa Trời” theo cách gọi quen thuộc trong tiếng Việt; giữ cấu trúc “danh Ngài được gọi là” để phản ánh sắc thái đặt danh hiệu của nguyên văn.
