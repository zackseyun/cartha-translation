    rationale: Cụm ἐν δικαιοσύνῃ diễn tả cách thức hoặc chuẩn mực cho cả việc phán xét lẫn giao chiến. “Theo lẽ công chính” giữ phạm vi nghĩa rộng của δικαιοσύνη và đọc trôi chảy hơn; chú thích vẫn bảo lưu sắc thái công minh/công lý.
