revisions:
- from: Rồi tôi thấy trời mở ra, và kìa, một con ngựa trắng! Đấng ngồi trên ngựa được gọi là Đấng Thành Tín và Chân Thật. Ngài phán xét và giao chiến trong sự công chính.[a]
  to: Rồi tôi thấy trời mở ra, và kìa, một con ngựa trắng! Đấng ngồi trên ngựa được gọi là Đấng Trung Tín và Chân Thật. Ngài phán xét và giao chiến theo lẽ công chính.[a]
  rationale: Sửa “Thành Tín” thành “Trung Tín” để phản ánh chính xác hơn πιστός trong danh xưng và trong cách dùng tiếng Việt hiện đại. Đổi “trong sự công chính” thành “theo lẽ công chính” nhằm tăng tính tự nhiên, không thu hẹp nghĩa của δικαιοσύνη; chú thích tiếp tục giữ phương án nhấn mạnh công minh/công lý.
