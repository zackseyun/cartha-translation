    rationale: πιστός ở đây nói đến sự trung tín/đáng tin cậy của Đấng được gọi là “Faithful”; trong tiếng Việt hiện đại, “thành tín” thường chỉ thái độ chân thành, thành thật. “Trung Tín” rõ và sát hơn, đồng thời kết hợp tự nhiên với “Chân Thật.”
  - severity: low
