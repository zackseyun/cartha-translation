id: REV.19.11
reference: Revelation 19:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: vi
  text: Rồi tôi thấy trời mở ra, và kìa, một con ngựa trắng! Đấng ngồi trên ngựa được gọi là Đấng Trung Tín và Chân Thật. Ngài phán xét và giao chiến theo lẽ công chính.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài phán xét và giao chiến một cách công minh.”'
    reason: δικαιοσύνη ở đây cũng có thể nhấn mạnh công lý hay sự công minh trong việc phán xét và giao chiến.
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: mở ra
  rationale: Phân từ hoàn thành bị động mô tả trời ở trong trạng thái đã được mở; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái kết quả.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ sức gợi trực tiếp và tính sống động của thị kiến khải huyền.
- source_word: ἵππος λευκός
  choice: một con ngựa trắng
  rationale: Cách diễn đạt trực tiếp, tự nhiên, với loại từ phù hợp trong tiếng Việt.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: Đấng ngồi trên ngựa
  rationale: Bám sát cấu trúc phân từ của tiếng Hy Lạp; “Đấng” phù hợp với nhân vật được tôn xưng trong ngữ cảnh mà không diễn giải thêm danh tính.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: được gọi là Đấng Thành Tín và Chân Thật
  rationale: Thể hiện καλούμενος là sự gọi tên và trình bày hai tính từ như các danh hiệu trong ngữ cảnh.
- source_word: πιστός
  choice: Thành Tín
  rationale: Diễn đạt sự đáng tin cậy và trung thành; đồng thời kết hợp trang trọng, tự nhiên với “Chân Thật” như một danh hiệu.
- source_word: ἀληθινός
  choice: Chân Thật
  rationale: Giữ nghĩa “thật, chân thật” và phù hợp với cách dùng mang tính danh hiệu.
- source_word: ἐν δικαιοσύνῃ
  choice: trong sự công chính
  rationale: Giữ gần hình thức và trường nghĩa của δικαιοσύνη, không thu hẹp hoàn toàn thành công lý pháp lý; cách hiểu “một cách công minh” được ghi ở chú thích.
- source_word: κρίνει
  choice: phán xét
  rationale: Diễn đạt hành động xét đoán trong ngữ cảnh quyền uy và phán xét khải huyền, không thêm trạng từ ngoài câu nguồn.
- source_word: πολεμεῖ
  choice: giao chiến
  rationale: Tự nhiên hơn “tiến hành chiến tranh” trong câu tiếng Việt và vẫn giữ rõ sắc thái quân sự của động từ.
theological_decisions:
- issue: Cách trình bày các danh xưng của Đấng cưỡi ngựa
  choice: Viết “Đấng Thành Tín và Chân Thật” như các danh hiệu.
  alternative: 'Dịch như các phẩm chất mô tả: “thành tín và chân thật”.'
  rationale: Trong mạch văn Khải Huyền, cụm từ có chức năng gọi tên nhân vật. Việc viết hoa và dùng “Đấng” báo hiệu tính danh hiệu nhưng không nói rõ danh tính ngoài điều câu nguồn nêu.
- issue: Phạm vi nghĩa của δικαιοσύνη
  choice: Dùng “sự công chính” trong chính văn.
  alternative: Dùng “sự công minh” hoặc “công lý”.
  rationale: “Sự công chính” bảo toàn trường nghĩa luân lý rộng của từ; chú thích ghi cách hiểu theo công lý/công minh đặc biệt thích hợp với hành động phán xét và giao chiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” giữ giọng thị kiến sống động; dấu chấm than giúp tái hiện lực trình bày của ἰδού. Các danh hiệu được viết hoa, còn cấu trúc câu tránh từ ngữ giáo phái hoặc diễn giải danh tính của Đấng cưỡi ngựa.
