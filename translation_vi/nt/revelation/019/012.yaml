id: REV.19.12
reference: Revelation 19:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: vi
  text: Mắt Ngài là ngọn lửa, trên đầu Ngài có nhiều vương miện[a], và Ngài có một danh được ghi mà không ai biết ngoài chính Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhiều mão miện”; từ Hy Lạp chỉ cụ thể loại mão biểu thị vương quyền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὀφθαλμοὶ αὐτοῦ
  choice: Mắt Ngài
  rationale: Cách diễn đạt sở hữu tự nhiên trong tiếng Việt; không cần thêm “đôi” vì nguyên văn dùng danh từ số nhiều nhưng không nhấn mạnh số lượng.
- source_word: δὲ
  choice: —
  rationale: Đây là tiểu từ nối nhẹ trong chuỗi miêu tả; tiếng Việt không cần dịch thành một từ riêng.
- source_word: φλὸξ πυρός
  choice: ngọn lửa
  rationale: Giữ phép ẩn dụ danh từ của nguyên văn, không tự ý thêm “như”. Trong tiếng Việt, “ngọn lửa” đã bao hàm ý nghĩa của cụm “flame of fire”, nên tránh cách nói thừa “ngọn lửa của lửa”.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: trên đầu Ngài
  rationale: Diễn đạt trực tiếp và tự nhiên ý nghĩa vị trí của ἐπί trong ngữ cảnh.
- source_word: διαδήματα πολλά
  choice: nhiều vương miện
  rationale: διάδημα chỉ loại mão biểu thị vương quyền; “vương miện” vừa dễ hiểu vừa giữ được sắc thái hoàng gia. Biến thể kỹ thuật hơn được nêu trong chú thích.
- source_word: ἔχων
  choice: Ngài có
  rationale: Chuyển phân từ hiện tại thành mệnh đề hữu hạn để câu tiếng Việt tự nhiên, đồng thời vẫn nối tiếp phần miêu tả nhân vật.
- source_word: ὄνομα γεγραμμένον
  choice: một danh được ghi
  rationale: “Được ghi” thể hiện trạng thái kết quả của phân từ hoàn thành bị động mà không xác định thêm nơi ghi; “danh” phù hợp với văn phong trang trọng của Khải Huyền.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: mà không ai biết
  rationale: Cách dịch tự nhiên của mệnh đề quan hệ; οἶδεν có nghĩa hiện tại trong ngữ cảnh.
- source_word: εἰ μὴ αὐτός
  choice: ngoài chính Ngài
  rationale: Giữ trọn tính loại trừ và sắc thái nhấn mạnh của αὐτός mà không diễn giải thêm.
theological_decisions:
- issue: Chủ thể duy nhất biết danh được ghi
  choice: “không ai biết ngoài chính Ngài” quy chiếu trực tiếp về nhân vật đang được miêu tả
  alternative: Hiểu câu chủ yếu như một khẳng định khái quát về tính bất khả thấu hiểu của danh ấy
  rationale: Cấu trúc Hy Lạp nói rõ rằng không ai biết ngoại trừ chính nhân vật đó. Bản dịch giữ nguyên sự độc quyền này nhưng không mở rộng thành một kết luận thần học ngoài lời văn.
- issue: Ẩn dụ hay so sánh trong φλὸξ πυρός
  choice: 'Giữ dạng ẩn dụ: “Mắt Ngài là ngọn lửa”'
  alternative: “Mắt Ngài như ngọn lửa”
  rationale: Nguyên văn là một mệnh đề danh từ không có tiểu từ so sánh. Dù cách hiểu miêu tả có thể mang tính so sánh, bản dịch không thêm “như”, nhờ đó giữ được sức mạnh và độ căng của hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ kính trọng “Ngài” theo ngữ cảnh Khải Huyền; dùng “danh” thay vì “tên” để phù hợp sắc thái trang nghiêm, nhưng không thêm bất kỳ danh hiệu hay cách giải thích giáo phái nào.
