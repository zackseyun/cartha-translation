id: REV.19.16
reference: Revelation 19:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: vi
  text: 'Trên áo choàng và trên đùi mình, Ngài có một danh được viết: “Vua của các vua và Chúa của các chúa.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một danh được khắc.” Tiếng Hy Lạp nói sát nghĩa là “một danh được viết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: có
  rationale: Thì hiện tại được giữ bằng “có”, phù hợp với lối hiện tại sống động của khải tượng; không diễn giải thành “mang” hay “mặc”.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: trên áo choàng
  rationale: ἱμάτιον chỉ y phục; trong bối cảnh vị vua-chiến binh, “áo choàng” tự nhiên và cụ thể, còn quan hệ sở hữu được diễn đạt qua cấu trúc tiếng Việt của cả câu.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: trên đùi mình
  rationale: μηρός có nghĩa trực tiếp là “đùi”. “Mình” quy chiếu tự nhiên về chủ thể Ngài và giữ nguyên địa điểm thứ hai mà không giải thích thêm.
- source_word: ὄνομα γεγραμμένον
  choice: một danh được viết
  rationale: Giữ nghĩa trạng thái của phân từ hoàn thành bị động γεγραμμένον và không cụ thể hóa quá mức thành “khắc”.
- source_word: Βασιλεὺς βασιλέων
  choice: Vua của các vua
  rationale: Diễn đạt trực tiếp kết cấu sở hữu mang ý nghĩa tối thượng, đồng thời giữ hình thức tước hiệu trang trọng.
- source_word: κύριος κυρίων
  choice: Chúa của các chúa
  rationale: Giữ κύριος là “Chúa” và bảo toàn kết cấu song song với “Vua của các vua” cùng ý nghĩa thần học của tước hiệu.
theological_decisions:
- issue: Có nên diễn giải các tước hiệu theo lối so sánh tối thượng hay giữ hình thức nguyên văn
  choice: Giữ “Vua của các vua và Chúa của các chúa” như danh/tước hiệu được viết.
  alternative: “Vua tối cao và Chúa tối cao”
  rationale: Nguyên văn nêu một danh/tước hiệu bằng hai kết cấu sở hữu song song. Cách dịch trực tiếp giữ cả ngôn từ lẫn sức nặng Kitô học mà không thêm lời diễn giải.
- issue: Cách xử lý hai vị trí “trên áo choàng” và “trên đùi”
  choice: Dịch trực tiếp cả hai vị trí, không giải thích mối liên hệ không gian giữa chúng.
  alternative: “trên áo choàng, tức là phần áo phủ đùi Ngài”
  rationale: Bản Hy Lạp có hai cụm ἐπί riêng biệt; cần giữ nguyên hình ảnh và sự không xác định thay vì giải quyết một vấn đề mà câu văn không giải thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể trong khải tượng, “danh” và các tước hiệu viết hoa để giữ sắc thái tôn nghiêm; cấu trúc câu được đảo trạng ngữ lên đầu cho tự nhiên và làm rõ cả hai vị trí.
