  - severity: medium
    issue: “rượu thịnh nộ, tức cơn giận”
    rationale: Liên từ “tức” giải thích hoặc đồng nhất hai thành tố, trong khi nguyên văn duy trì một chuỗi genitive có chủ ý tăng cường. Nên giữ hai thuật ngữ riêng biệt trong bản văn.
