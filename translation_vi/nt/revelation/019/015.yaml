id: REV.19.15
reference: Revelation 19:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: vi
  text: Từ miệng Ngài phát ra một thanh gươm sắc để Ngài dùng nó đánh các dân tộc. Chính Ngài sẽ chăn dắt họ bằng một cây gậy sắt[a], và chính Ngài giày đạp bồn ép rượu của cơn cuồng nộ, của cơn thịnh nộ của Đức Chúa Trời, Đấng Toàn Năng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cai trị họ bằng một cây gậy sắt.” Động từ Hy Lạp có nghĩa đen là “chăn dắt,” gợi lại Thi Thiên 2 và vẫn giữ hình ảnh mục tử.
    reason: alternative_reading
  - marker: b
    text: 'Cụm Hy Lạp dùng hai từ gần nghĩa để nhấn mạnh cơn giận dữ dội của Đức Chúa Trời; cũng có thể dịch: “bồn ép rượu của cơn thịnh nộ dữ dội của Đức Chúa Trời, Đấng Toàn Năng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: phóng ra
  rationale: Diễn tả tự nhiên hình ảnh sống động ở thì hiện tại về thanh gươm phát ra từ miệng Ngài; mạnh và hợp ngữ cảnh hơn cách dịch đơn thuần là “đi ra”.
- source_word: ῥομφαία ὀξεῖα
  choice: một thanh gươm sắc
  rationale: Giữ đúng hình ảnh vũ khí lớn mà không xác định quá mức loại gươm; ὀξεῖα được chuyển trực tiếp là “sắc”.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: để dùng nó đánh
  rationale: “Để” thể hiện mục đích của ἵνα; “dùng nó” chuyển nghĩa công cụ của ἐν αὐτῇ; “đánh” không thêm ý “ngã xuống” vốn không được nêu rõ trong động từ.
- source_word: τὰ ἔθνη
  choice: các dân tộc
  rationale: Chỉ các dân tộc nói chung trong Khải Huyền, không thu hẹp thành dân ngoại đối lập với người Do Thái.
- source_word: ποιμανεῖ
  choice: sẽ chăn dắt
  rationale: Giữ nguyên ẩn dụ mục tử của động từ Hy Lạp, đồng thời ngữ cảnh và cây gậy sắt vẫn biểu thị quyền cai trị và phán xét.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: bằng một cây gậy sắt
  rationale: “Bằng” thể hiện nghĩa công cụ của ἐν; “cây gậy sắt” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πατεῖ
  choice: giày đạp
  rationale: Giữ hình ảnh mạnh của hành động đạp nho trong bồn ép và sắc thái phán xét ở thì hiện tại sống động.
- source_word: τὴν ληνὸν
  choice: bồn ép rượu
  rationale: Chỉ nơi nho được giẫm hoặc ép để làm rượu; cách dịch này rõ với độc giả hiện đại hơn “máy ép rượu” và không hiện đại hóa dụng cụ.
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: của rượu thịnh nộ, tức cơn giận
  rationale: Giữ cả hai danh từ gần nghĩa θυμός và ὀργή, đồng thời dùng “tức” để chuỗi sở hữu dày đặc trở nên dễ hiểu trong tiếng Việt mà không làm mất cường độ.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: của Đức Chúa Trời Toàn Năng
  rationale: Dùng danh xưng tiếng Việt trang trọng, quen thuộc; “Toàn Năng” giữ chức năng tước hiệu của παντοκράτωρ.
theological_decisions:
- issue: ποιμανεῖ trong lời vọng Thi Thiên 2 và bối cảnh phán xét
  choice: sẽ chăn dắt họ bằng một cây gậy sắt
  alternative: sẽ cai trị họ bằng một cây gậy sắt
  rationale: Động từ có nghĩa đen là chăn dắt nhưng trong lời ám chỉ về vua Mê-si-a cũng hàm ý cai trị. Bản chính giữ ẩn dụ mục tử cùng sự căng thẳng giữa chăm sóc, quyền vương giả và phán xét; cách hiểu “cai trị” được ghi ở chú thích.
- issue: Cụm tăng cường θυμοῦ τῆς ὀργῆς
  choice: thịnh nộ, tức cơn giận
  alternative: cơn thịnh nộ dữ dội
  rationale: Giữ dấu vết của cả hai từ Hy Lạp gần nghĩa thay vì gộp hoàn toàn thành một từ, qua đó bảo toàn sức nặng của hình ảnh phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu hình ảnh. Lặp “chính Ngài” để phản ánh hai lần αὐτὸς được nhấn mạnh. Các đại từ tôn kính được viết hoa theo lối dùng phổ biến trong Kinh Thánh tiếng Việt. Mọi dấu chú thích [a], [b] đều có trong bản văn chính.
