id: REV.19.9
reference: Revelation 19:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: vi
  text: 'Thiên sứ nói với tôi: “Hãy viết: Phước cho những người đã được mời đến dự tiệc cưới của Chiên Con.[a]” Rồi thiên sứ nói với tôi: “Đây là những lời chân thật của Đức Chúa Trời.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được gọi đến dự tiệc cưới của Chiên Con.”'
    reason: lexical_alternative
  - marker: b
    text: “Chân thật” cũng có thể hiểu là “đáng tin cậy”; câu này khẳng định những lời ấy thật sự thuộc về Đức Chúa Trời và có thể tin cậy được.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: thiên sứ nói với tôi
  rationale: Động từ hiện tại mang sắc thái kể chuyện được chuyển tự nhiên sang quá khứ trong tiếng Việt. Chủ ngữ hàm ẩn được làm rõ là thiên sứ từ ngữ cảnh gần (Khải Huyền 19:5, 10), tránh đại từ mơ hồ.
- source_word: Γράψον
  choice: Hãy viết
  rationale: Mệnh lệnh aorist số ít được diễn đạt trực tiếp, trang trọng và tự nhiên.
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Giữ công thức chúc phước quen thuộc của các lời tuyên phước trong Kinh Thánh, đồng thời không thu hẹp ý nghĩa thành cảm xúc 'hạnh phúc'.
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: những người đã được mời đến dự tiệc
  rationale: Phân từ hoàn thành bị động κεκλημένοι chỉ những người đang ở trong tình trạng đã được gọi/mời. Trong bối cảnh yến tiệc, 'được mời' truyền đạt nghĩa tự nhiên mà không áp đặt một quan niệm thần học chuyên biệt về sự kêu gọi.
- source_word: δεῖπνον τοῦ γάμου
  choice: tiệc cưới
  rationale: δεῖπνον là bữa ăn chính hoặc yến tiệc, còn γάμος trong kết cấu này tạo hình ảnh tiệc mừng hôn lễ. 'Tiệc cưới' là cách nói hiện đại, gọn và tự nhiên trong tiếng Việt.
- source_word: τοῦ ἀρνίου
  choice: của Chiên Con
  rationale: Giữ danh hiệu mang tính Cơ Đốc học nổi bật trong sách Khải Huyền và viết hoa theo chức năng danh hiệu.
- source_word: Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν
  choice: Đây là những lời chân thật của Đức Chúa Trời
  rationale: Giữ kết cấu sở hữu 'của Đức Chúa Trời' thay vì diễn giải thành 'đến từ Đức Chúa Trời'; 'chân thật' bao hàm tính đúng thật và đáng tin.
theological_decisions:
- issue: Ý nghĩa của κεκλημένοι trong bối cảnh tiệc cánh chung
  choice: được mời
  alternative: được gọi
  rationale: Trong ngữ cảnh dự tiệc, 'được mời' là nghĩa dụng học tự nhiên; chú thích bảo lưu cách dịch sát hình thức 'được gọi' vì từ này cũng có thể gợi trường nghĩa rộng hơn của sự kêu gọi.
- issue: Sở thuộc/cội nguồn trong τοῦ θεοῦ
  choice: của Đức Chúa Trời
  alternative: đến từ Đức Chúa Trời
  rationale: Cách dịch chính giữ nguyên độ mở của sở hữu cách Hy Lạp; phương án 'đến từ' xác định rõ nguồn gốc hơn văn bản.
- issue: Sắc thái của ἀληθινοί
  choice: chân thật
  alternative: đáng tin cậy
  rationale: '''Chân thật'' gần hình thức và bao quát cả tính đúng thật lẫn xác thực; ''đáng tin cậy'' làm nổi bật hệ quả về độ khả tín nhưng mang tính diễn giải hơn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phước cho” theo ngôn ngữ tuyên phước; “Chiên Con” và “Đức Chúa Trời” giữ hệ thuật ngữ Kinh Thánh phổ biến. Thêm danh từ “thiên sứ” để làm rõ chủ ngữ hàm ẩn theo ngữ cảnh, không nhằm xác định vượt quá nhân vật đang nói trong đoạn văn.
