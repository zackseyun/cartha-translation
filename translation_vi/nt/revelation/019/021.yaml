  terminology: “Thanh gươm,” “Đấng,” và “Ngài” phù hợp với cách dùng trang trọng trong văn mạch Khải Huyền. Bản dịch giữ nguyên hình tượng thanh gươm từ miệng mà không áp đặt cách giải thích thần học. Chú thích b neo đúng vị trí và chỉ dẫn Khải Huyền 19:15 phù hợp; chú thích a nêu lựa chọn từ vựng hợp lệ.
