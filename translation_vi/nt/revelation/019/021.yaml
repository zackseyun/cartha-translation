id: REV.19.21
reference: Revelation 19:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: vi
  text: Còn những kẻ khác bị giết bởi thanh gươm của Đấng ngồi trên ngựa[a]—thanh gươm từ miệng Ngài phóng ra[b]—và mọi loài chim đều ăn thịt họ đến no nê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị sát hại.”'
    reason: lexical_alternative
  - marker: b
    text: “Thanh gươm” phóng ra từ miệng Ngài là hình ảnh khải huyền; xem Khải Huyền 19:15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: những kẻ khác
  rationale: Chỉ những người còn lại sau khi con thú và tiên tri giả đã bị xử lý trong văn cảnh trước; cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἀπεκτάνθησαν
  choice: bị giết
  rationale: Giữ thể bị động của động từ aorist ἀποκτείνω và dùng từ hiện đại, trực tiếp.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: bởi thanh gươm
  rationale: Diễn đạt phương tiện gây ra cái chết, đồng thời giữ nguyên hình ảnh cụ thể và lặp lại của ῥομφαία trong sách Khải Huyền.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: của Đấng ngồi trên ngựa
  rationale: Phản ánh sát cấu trúc phân từ; viết hoa “Đấng” phù hợp với nhân vật đã được xác định trong văn cảnh mà không thêm danh xưng ngoài nguyên văn.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: thanh gươm từ miệng Ngài phóng ra
  rationale: Làm rõ phân từ thuộc tính bổ nghĩa cho “thanh gươm,” bảo toàn hình ảnh khải huyền sống động; “phóng ra” tự nhiên hơn cách dịch máy móc “đi ra” trong tiếng Việt.
- source_word: πάντα τὰ ὄρνεα
  choice: mọi loài chim
  rationale: Không thêm ý “chim ăn thịt” vì danh từ Hy Lạp chỉ nói chung là chim, dù văn cảnh cho thấy chúng ăn xác.
- source_word: ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν
  choice: đều ăn thịt họ đến no nê
  rationale: Chuyển ngữ tự nhiên kết quả của χορτάζω cùng nguồn thức ăn được nêu bằng ἐκ; tránh câu Việt gượng như “được làm đầy từ thịt họ,” nhưng vẫn giữ rõ hành động ăn thịt và trạng thái no đủ.
theological_decisions:
- issue: Bản chất của thanh gươm từ miệng Đấng cưỡi ngựa
  choice: Giữ nguyên hình ảnh cụ thể “thanh gươm từ miệng Ngài phóng ra” mà không giải nghĩa biểu tượng trong chính văn.
  alternative: Diễn giải thanh gươm là lời phán hoặc sự phán xét của Ngài.
  rationale: Nguyên văn trình bày hình tượng khải huyền và không trực tiếp giải thích biểu tượng tại câu này; bản dịch không nên tự ý hóa giải sự căng thẳng biểu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giúp nhận rõ cụm đồng vị giải thích “thanh gươm.” Đại từ “Ngài” phù hợp văn cảnh chỉ Đấng cưỡi ngựa trắng. Cụm “ăn thịt họ đến no nê” ưu tiên tiếng Việt tự nhiên mà vẫn phản ánh đầy đủ hành động và kết quả trong nguyên văn.
