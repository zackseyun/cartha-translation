id: REV.19.18
reference: Revelation 19:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: vi
  text: để các ngươi ăn thịt của các vua, thịt của những người chỉ huy quân đội, thịt của những người hùng mạnh, thịt của ngựa và thịt của những người cưỡi trên chúng, cùng thịt của mọi người, cả người tự do lẫn nô lệ, cả người thấp bé lẫn người cao trọng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: để các ngươi ăn
  rationale: Giữ sắc thái mục đích của ἵνα với động từ giả định ngôi hai số nhiều; “để ... ăn” tự nhiên trong tiếng Việt và nối với lời triệu tập ở câu trước.
- source_word: σάρκας
  choice: thịt
  rationale: Chỉ phần thịt của thân thể theo nghĩa đen trong cảnh phán xét; lặp lại “thịt” để giữ nhịp liệt kê và sức nặng tu từ của nguyên văn.
- source_word: βασιλέων
  choice: của các vua
  rationale: Diễn đạt trực tiếp tước vị vua, không làm nhạt thành nghĩa chung là người cai trị.
- source_word: χιλιάρχων
  choice: của các tướng chỉ huy
  rationale: Danh từ chỉ sĩ quan quân đội, theo nghĩa gốc là người chỉ huy một nghìn quân; cách dịch này rõ nghĩa trong tiếng Việt hiện đại mà không lệ thuộc một quân hàm cụ thể.
- source_word: ἰσχυρῶν
  choice: của những kẻ hùng mạnh
  rationale: Tính từ được danh từ hóa, chỉ những người có sức mạnh hoặc quyền thế; giữ độ rộng nghĩa thay vì thu hẹp thành riêng chiến binh.
- source_word: ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν
  choice: của ngựa và những người cưỡi trên chúng
  rationale: Giữ cả ngựa lẫn những người ở trên ngựa; “người cưỡi” là cách diễn đạt tự nhiên, rõ ràng cho phân từ καθημένων trong ngữ cảnh này.
- source_word: πάντων
  choice: của mọi người
  rationale: Tóm quát toàn thể các tầng lớp được nêu tiếp theo.
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: cả người tự do lẫn nô lệ
  rationale: Giữ cặp đối lập về địa vị xã hội; δοῦλος ở đây chỉ rõ tình trạng không tự do nên “nô lệ” chính xác hơn “đầy tớ”.
- source_word: μικρῶν καὶ μεγάλων
  choice: cả người thấp hèn lẫn người cao sang
  rationale: Trong danh sách địa vị xã hội, cặp từ này là lối bao quát các tầng lớp thấp và cao; cách dịch truyền đạt ý nghĩa cho độc giả hiện đại thay vì dùng “nhỏ và lớn” dễ bị hiểu là tuổi tác hoặc kích thước.
theological_decisions:
- issue: Cách dịch δοῦλος trong cặp đối lập với ἐλεύθερος
  choice: nô lệ
  alternative: đầy tớ
  rationale: Sự đối lập trực tiếp với “người tự do” làm nổi bật thân phận bị lệ thuộc về pháp lý-xã hội; “nô lệ” bảo toàn nét nghĩa ấy.
- issue: Ý nghĩa của μικρῶν καὶ μεγάλων
  choice: người thấp hèn lẫn người cao sang
  alternative: kẻ nhỏ lẫn người lớn
  rationale: Cụm này có chức năng bao quát mọi cấp bậc trong bối cảnh liệt kê các địa vị; bản dịch tránh khiến độc giả hiểu nhầm là nói về tuổi hoặc vóc dáng, nhưng không thu hẹp thành một hệ thống chức tước cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mạnh, phù hợp cảnh phán xét. Dùng “các ngươi” vì đối tượng được thiên sứ gọi là các loài chim ở câu trước, tạo sắc thái số nhiều rõ ràng. Giữ phép lặp “thịt” để bảo toàn nhịp điệu dồn dập của nguyên văn.
