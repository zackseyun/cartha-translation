id: REV.19.17
reference: Revelation 19:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: vi
  text: 'Rồi tôi thấy một thiên sứ đứng trong mặt trời. Thiên sứ ấy kêu lớn tiếng với mọi chim đang bay giữa trời[a], rằng: “Hãy đến, tụ họp lại dự bữa tiệc lớn của Đức Chúa Trời!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giữa không trung” hoặc “ở giữa bầu trời.” Từ Hy Lạp μεσουράνημα là một cách diễn đạt đặc trưng của sách Khải Huyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: một thiên sứ
  rationale: Giữ lại số từ ἕνα bằng “một”, đồng thời đây cũng là cách diễn đạt tự nhiên trong tiếng Việt khi giới thiệu một nhân vật mới trong khải tượng.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: đứng trong mặt trời
  rationale: Dịch trực tiếp ἐν là “trong”, bảo toàn hình ảnh khải huyền nổi bật thay vì diễn giải nhẹ thành “trước mặt trời” hay “trên mặt trời”.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: lớn tiếng gọi
  rationale: Diễn đạt tự nhiên sức mạnh của κράζω và φωνῇ μεγάλῃ, đồng thời tránh lối lặp nặng nề “kêu bằng một tiếng lớn”.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: tất cả các loài chim
  rationale: ὄρνεον chỉ chim nói chung; không thêm nghĩa “chim ăn xác” hay “chim săn mồi”, vì sắc thái ấy đến từ ngữ cảnh kế tiếp.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: đang bay giữa trời
  rationale: “Giữa trời” là cách nói tiếng Việt tự nhiên, trang trọng và giàu hình ảnh cho μεσουράνημα; chú thích ghi nhận các cách hiểu không gian gần nghĩa.
- source_word: Δεῦτε
  choice: Hãy đến
  rationale: Thể hiện trực tiếp lời triệu tập bằng một mệnh lệnh tự nhiên trong tiếng Việt.
- source_word: συνάχθητε
  choice: tụ họp lại
  rationale: Truyền đạt ý quy tụ của động từ, không ép hình thái thụ động Hy Lạp thành một cấu trúc tiếng Việt thiếu tự nhiên.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: để dự đại tiệc của Đức Chúa Trời
  rationale: “Đại tiệc” diễn đạt tự nhiên δεῖπνον τὸ μέγα và giữ liên hệ với hình ảnh tiệc trong văn cảnh; “của Đức Chúa Trời” bảo toàn cấu trúc sở hữu mà không quyết định thêm Đức Chúa Trời là chủ tiệc hay nguồn của tiệc.
theological_decisions:
- issue: Hình ảnh không gian mang tính khải huyền
  choice: đứng trong mặt trời
  alternative: đứng trước mặt trời
  rationale: Nguyên văn tạo ra một hình ảnh cố ý gây ấn tượng mạnh. Bản dịch giữ cách nói trực tiếp, không âm thầm làm dịu hoặc giải thích hình ảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tách sau hình ảnh thiên sứ đứng trong mặt trời để tiếng Việt sáng rõ hơn mà vẫn giữ trình tự của khải tượng. Dấu chú thích [a] được đặt ngay sau “giữa trời”, là cụm từ mà chú thích giải thích.
