id: REV.19.1
reference: Revelation 19:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: vi
  text: 'Sau những điều ấy, tôi nghe một tiếng vang lớn như của một đoàn người rất đông trên trời đang nói: “Ha-lê-lu-gia![a] Sự cứu rỗi, vinh quang và quyền năng thuộc về Đức Chúa Trời chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa là: “Hãy ngợi khen Yah.”'
    reason: Giải nghĩa trực tiếp lời tung hô Hê-bơ-rơ được phiên âm trong bản văn Hy Lạp.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những điều ấy
  rationale: Giữ sắc thái số nhiều của đại từ chỉ định và trình tự của khải tượng, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἤκουσα
  choice: tôi nghe
  rationale: Động từ aorist trong mạch kể được chuyển bằng cách kể quá khứ tự nhiên của tiếng Việt; tiếng Việt không bắt buộc đánh dấu thì trên động từ.
- source_word: ὡς
  choice: như
  rationale: Giữ nguyên nét so sánh hoặc cảm nhận gần đúng của lối mô tả khải tượng, không đồng nhất tuyệt đối âm thanh với tiếng của đoàn người.
- source_word: φωνὴν μεγάλην
  choice: tiếng lớn
  rationale: Trong ngữ cảnh âm thanh, μεγάλην chỉ cường độ lớn; “tiếng lớn” trang trọng và gọn hơn “một giọng nói lớn” khi âm thanh phát ra từ đám đông.
- source_word: ὄχλου πολλοῦ
  choice: của một đoàn người đông đảo
  rationale: Diễn đạt một tập thể rất đông đang đồng thanh; “đoàn người” phù hợp với cảnh thờ phượng hơn cách nói đời thường “đám đông”.
- source_word: ἐν τῷ οὐρανῷ
  choice: ở trên trời
  rationale: Chỉ cõi trời trong khải tượng, không phải bầu trời khí quyển.
- source_word: λεγόντων
  choice: nói rằng
  rationale: Phân từ số nhiều quy chiếu về đoàn người và dẫn trực tiếp nội dung lời tung hô.
- source_word: Ἁλληλουϊά
  choice: Ha-lê-lu-gia
  rationale: Phiên âm lời tung hô phụng vụ gốc Hê-bơ-rơ theo dạng quen thuộc với độc giả Việt, đồng thời chú thích nghĩa từ nguyên.
- source_word: ἡ σωτηρία
  choice: Sự cứu rỗi
  rationale: Chuyển danh từ trừu tượng chỉ hành động và kết quả giải cứu của Đức Chúa Trời bằng thuật ngữ rõ nghĩa, trang trọng.
- source_word: ἡ δόξα
  choice: vinh quang
  rationale: Tương đương tự nhiên và truyền thống của δόξα trong lời tôn vinh.
- source_word: ἡ δύναμις
  choice: quyền năng
  rationale: Diễn đạt năng lực và sức mạnh thuộc về Đức Chúa Trời trong văn cảnh tung hô, với sắc thái trang trọng.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: thuộc về Đức Chúa Trời chúng ta
  rationale: Làm rõ quan hệ sở hữu hoặc quy thuộc của cấu trúc sở hữu cách mà không thêm nội dung thần học.
theological_decisions:
- issue: Cách chuyển lời tung hô Ἁλληλουϊά
  choice: Ha-lê-lu-gia
  alternative: Hãy ca ngợi Yah / Hãy ca ngợi CHÚA
  rationale: Phiên âm bảo tồn đặc tính phụng vụ và mối liên hệ liên văn bản của tiếng Hê-bơ-rơ được đưa vào bản văn Hy Lạp; chú thích cung cấp nghĩa mà không áp đặt một cách đọc danh xưng duy nhất.
- issue: Quan hệ của sự cứu rỗi, vinh quang và quyền năng với Đức Chúa Trời
  choice: thuộc về Đức Chúa Trời chúng ta
  alternative: là của Đức Chúa Trời chúng ta
  rationale: Diễn đạt tự nhiên quan hệ sở hữu hoặc quy thuộc trong τοῦ θεοῦ ἡμῶν, không biến lời tung hô thành một phát biểu giáo lý chi tiết hơn bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” cho θεός; giữ cấu trúc cảm nhận “nghe như” để bảo tồn tính gần đúng của ὡς. Dấu chú thích [a] được đặt ngay sau “Ha-lê-lu-gia!”.
