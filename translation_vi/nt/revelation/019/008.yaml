id: REV.19.8
reference: Revelation 19:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: vi
  text: Nàng được ban cho chiếc áo vải lanh mịn, sáng ngời và sạch, để mặc; vì vải lanh mịn là những việc công chính[a] của các thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những hành động công chính.” Trong các ngữ cảnh khác, từ Hy Lạp này còn có thể mang nghĩa “những yêu cầu công chính”, nhưng ở đây nghĩa tự nhiên nhất là những việc công chính của các thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: Nàng được ban cho
  rationale: Diễn đạt tự nhiên cấu trúc bị động và đối tượng nhận là người nữ, đồng thời không nêu rõ Đấng ban vì nguyên văn để tác nhân hàm ẩn.
- source_word: ἵνα περιβάληται
  choice: để mặc vào
  rationale: 'Giữ ý mục đích/kết quả của ἵνα và sắc thái trung động: chính nàng mặc áo vào.'
- source_word: βύσσινον
  choice: áo vải lanh mịn / vải lanh mịn
  rationale: Lần đầu thêm “áo” để câu tiếng Việt tự nhiên trong ngữ cảnh mặc; lần sau giữ danh từ chất liệu trong lời giải thích biểu tượng.
- source_word: λαμπρὸν
  choice: sáng ngời
  rationale: Chuyển tải hình ảnh rực sáng của λαμπρός bằng cách nói tự nhiên, trang trọng.
- source_word: καθαρόν
  choice: tinh sạch
  rationale: Giữ nét nghĩa sạch/pure của καθαρός và phù hợp với văn phong khải tượng, nhưng không biến mô tả chiếc áo thành một mệnh đề thần học trừu tượng.
- source_word: τὰ δικαιώματα
  choice: những việc công chính
  rationale: Trong ngữ cảnh số nhiều này, từ ngữ tự nhiên nhất chỉ những hành vi phù hợp với sự công chính; chú thích bảo lưu phương án “những hành động công chính”.
- source_word: τῶν ἁγίων
  choice: của các thánh đồ
  rationale: “Các thánh đồ” là cách gọi Kinh Thánh quen thuộc dành cho cộng đồng những người thuộc về Đức Chúa Trời, không hàm ý một tầng lớp đặc biệt.
theological_decisions:
- issue: Ý nghĩa của δικαιώματα trong mối liên hệ với áo của cô dâu
  choice: Vải lanh mịn tượng trưng cho những việc công chính của các thánh đồ.
  alternative: Vải tượng trưng cho các đòi hỏi công chính liên quan đến các thánh đồ, hoặc cho địa vị/sự minh oan công chính của họ.
  rationale: Trong lời giải thích biểu tượng này, danh từ số nhiều tự nhiên nhất chỉ các việc làm công chính. Câu vẫn giữ nguyên sức căng giữa việc chiếc áo được ban và việc nó tượng trưng cho cách sống công chính của các thánh đồ.
- issue: Tác nhân của thể bị động ἐδόθη
  choice: 'Không nêu đích danh người ban: “Nàng được ban cho.”'
  alternative: “Đức Chúa Trời ban cho nàng.”
  rationale: Tác nhân rất có thể được hiểu là Đức Chúa Trời, nhưng nguyên văn không nói rõ; bản dịch không bổ sung điều chỉ được hàm ý.
- issue: Quan hệ biểu tượng trong ἐστίν
  choice: Dịch rõ là “tượng trưng cho”.
  alternative: 'Dịch sát hình thức: “vải lanh mịn là những việc công chính”.'
  rationale: Trong ngữ cảnh khải tượng, “tượng trưng cho” diễn đạt tự nhiên chức năng đồng nhất mang tính biểu tượng, không biến chất liệu chiếc áo thành các hành vi theo nghĩa vật chất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Nàng” nối với hình ảnh cô dâu trong văn cảnh; “sáng ngời và tinh sạch” duy trì nhịp mô tả; “các thánh đồ” giữ thuật ngữ cộng đồng quen thuộc. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
