revisions:
- from: Nàng được ban cho áo vải lanh mịn, sáng ngời và tinh sạch, để mặc vào; vì vải lanh mịn tượng trưng cho những việc công chính[a] của các thánh đồ.
  to: Nàng được ban cho chiếc áo vải lanh mịn, sáng ngời và sạch, để mặc; vì vải lanh mịn là những việc công chính[a] của các thánh.
  rationale: Bản sửa làm rõ cú pháp “được ban cho ... để mặc”, bỏ động từ diễn giải “tượng trưng cho” để dịch trực tiếp ἐστίν, và dùng “sạch” theo nghĩa mô tả của καθαρόν. Không nêu tác nhân của thể bị động và vẫn bảo lưu sức căng của câu giữa điều được ban và những việc công chính của các thánh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:25Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được thể bị động không nêu tác nhân của ἐδόθη, quy chiếu nữ tính của αὐτῇ, và nghĩa số nhiều của δικαιώματα. Tuy nhiên, trật tự “được ban cho áo ... để mặc vào” làm quan hệ giữa điều được ban và mệnh đề ἵνα περιβάληται kém rõ; “mặc” đủ nghĩa hơn “mặc vào”. Động từ ἐστίν nên được dịch trực tiếp là “là”, không thêm “tượng trưng cho”, dù ngữ cảnh hiển nhiên có tính biểu tượng. “Sạch” phản ánh καθαρόν chính xác hơn “tinh sạch”, vốn dễ chuyển mô tả vật chất sang phẩm chất đạo đức.
  naturalness: 'Bản sửa dùng cấu trúc tiếng Việt hiện đại, rõ ràng: “được ban cho chiếc áo ... để mặc”. Cách phối hợp “sáng ngời và sạch” tự nhiên trong mô tả y phục khải tượng. “Các thánh” là thuật ngữ Kinh Thánh ngắn gọn, thông dụng và không hàm ý một giai cấp đặc biệt.'
  terminology: Giữ “vải lanh mịn” cho βύσσινον và “những việc công chính” cho δικαιώματα. Dùng “các thánh” cho τῶν ἁγίων. Chú thích bảo lưu lựa chọn từ vựng “những hành động công chính” và nêu khả năng nghĩa “những yêu cầu công chính” ở ngữ cảnh khác, không áp đặt cách hiểu đó cho câu này.
  issues:
  - severity: medium
    issue: Cấu trúc “Nàng được ban cho áo ... để mặc vào” chưa thể hiện thật rõ ἵνα περιβάληται.
    rationale: Nguyên văn nói rằng nàng được ban cho để tự mặc y phục. Thêm “chiếc áo” và dùng “để mặc” làm rõ đối tượng được ban đồng thời giữ được hướng mục đích/kết quả và sắc thái tự thân của động từ trung động.
  - severity: low
    issue: “Tượng trưng cho” thêm một cách diễn giải vào mệnh đề đồng nhất ἐστίν.
    rationale: Hình ảnh chắc chắn mang tính biểu tượng trong văn cảnh, nhưng tiếng Hy Lạp chỉ nói “vải lanh mịn là những việc công chính”. Bản dịch trực tiếp giữ hình thức và sức mạnh của lời giải thích nguyên văn.
  - severity: low
    issue: “Tinh sạch” dễ đạo đức hóa καθαρόν trong phần mô tả chiếc áo.
    rationale: καθαρόν trước hết mô tả y phục là sạch; ý nghĩa đạo đức được giải thích ở mệnh đề sau. “Sạch” bảo toàn sự phân biệt này.
  revised_text: Nàng được ban cho chiếc áo vải lanh mịn, sáng ngời và sạch, để mặc; vì vải lanh mịn là những việc công chính[a] của các thánh.
  revised_footnotes:
