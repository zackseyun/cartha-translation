id: REV.19.19
reference: Revelation 19:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: vi
  text: Tôi thấy con thú, các vua trên đất và quân đội của họ đã tập hợp lại[a] để gây chiến chống lại[b] Đấng ngồi trên ngựa và quân đội của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được quy tụ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “làm chiến tranh với”; trong ngữ cảnh này, cụm từ mang nghĩa thù địch: “gây chiến chống lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: con thú
  rationale: Trong sách Khải Huyền, từ này là một danh xưng khải huyền mang sắc thái đe dọa; “con thú” tự nhiên trong tiếng Việt và giữ được sức nặng biểu tượng.
- source_word: βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: γῆ có thể là “đất” hoặc “trái đất”; trong phạm vi khải huyền rộng lớn của sách, “các vua trên đất” diễn đạt tự nhiên các nhà cai trị thuộc thế giới này.
- source_word: στρατεύματα αὐτῶν
  choice: quân đội của họ
  rationale: Ngữ cảnh chiến tranh khiến “quân đội” chính xác và tự nhiên hơn các từ khái quát như “lực lượng”.
- source_word: συνηγμένα
  choice: đã tập hợp lại
  rationale: Phân từ hoàn thành bị động mô tả họ ở trong trạng thái đã được gom lại; cách dịch này gọn, tự nhiên và không xác định tác nhân.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: để gây chiến
  rationale: Đây là thành ngữ chỉ việc tiến hành chiến tranh; “gây chiến” rõ nghĩa và phù hợp với văn cảnh thù địch.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: với Đấng ngồi trên ngựa
  rationale: Sau động từ “gây chiến”, “với” trong tiếng Việt tự nhiên mang nghĩa đối địch; “Đấng ngồi trên ngựa” giữ nguyên lối mô tả bằng phân từ thay vì thay bằng một tước hiệu.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: và quân đội của Ngài
  rationale: Cụm này tiếp tục phụ thuộc vào “gây chiến với”; danh từ số ít được giữ bằng danh từ tập hợp “quân đội”.
theological_decisions:
- issue: Danh tính của Đấng ngồi trên ngựa
  choice: Giữ nguyên cách gọi mô tả “Đấng ngồi trên ngựa”
  alternative: Đấng Mê-si hoặc Đấng Christ
  rationale: Văn cảnh nhận diện nhân vật này, nhưng chính câu 19 dùng một cụm mô tả chứ không nêu tước hiệu. Giữ nguyên cách diễn đạt tránh đưa vào bản văn một danh xưng không có trong tiếng Hy Lạp.
- issue: Viết hoa đại từ chỉ Đấng ngồi trên ngựa
  choice: Dùng “Đấng” và “Ngài”
  alternative: người và ông ấy
  rationale: Cách viết hoa là lối xưng hô tôn kính tự nhiên trong tiếng Việt theo nhân vật đã được nhận diện trong văn cảnh, nhưng không thay cụm mô tả bằng một tước hiệu thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê của câu Hy Lạp được giữ tương đối sát, đồng thời dùng “gây chiến với” là thành ngữ tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
