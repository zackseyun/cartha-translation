id: REV.19.5
reference: Revelation 19:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: vi
  text: 'Rồi một tiếng từ ngai phát ra, nói rằng: “Hãy ca ngợi Đức Chúa Trời chúng ta, hỡi tất cả các đầy tớ của Ngài, và những người kính sợ Ngài, cả nhỏ lẫn lớn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ
  choice: một tiếng
  rationale: Trong ngữ cảnh có λέγουσα (‘rằng/nói’), φωνή chỉ tiếng nói; cách nói ‘một tiếng … phát ra’ tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: từ ngai phát ra
  rationale: Giữ ngai là nguồn phát của tiếng nói và diễn đạt tự nhiên động từ ἐξέρχομαι trong tiếng Việt.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Hãy ca ngợi Đức Chúa Trời chúng ta
  rationale: Mệnh lệnh số nhiều được thể hiện bằng ‘hãy’; ‘ca ngợi’ phù hợp lời kêu gọi thờ phượng, còn sở hữu từ ‘chúng ta’ bám sát nguyên văn.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: hỡi tất cả các đầy tớ của Ngài
  rationale: ‘Đầy tớ’ là cách gọi tự nhiên, trang trọng và có thể biểu đạt người hoàn toàn thuộc quyền chủ; ‘hỡi’ làm rõ nhóm được trực tiếp kêu gọi. Không thêm chú thích vì dữ liệu đầu vào gắn chú thích a không nhất quán với vị trí trong bản Anh.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: những người kính sợ Ngài
  rationale: ‘Kính sợ’ giữ được thành ngữ Kinh Thánh, kết hợp lòng tôn kính với sự kính úy, thay vì thu hẹp thành sợ hãi đơn thuần.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: cả nhỏ lẫn lớn
  rationale: Giữ cặp đối xứng của nguyên văn và bao quát mọi địa vị; ‘cả… lẫn…’ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của δοῦλοι trong quan hệ với Đức Chúa Trời
  choice: đầy tớ
  alternative: nô lệ
  rationale: ‘Đầy tớ’ tự nhiên và trang trọng hơn trong tiếng Việt hiện đại, vẫn chỉ người phụng sự và thuộc quyền Đức Chúa Trời; ‘nô lệ’ nhấn mạnh quyền sở hữu nhưng dễ gợi chủ yếu chế độ cưỡng bức xã hội trong câu kêu gọi thờ phượng này.
- issue: Ý nghĩa của việc φοβέομαι đối với Đức Chúa Trời
  choice: kính sợ Ngài
  alternative: tôn kính Ngài
  rationale: ‘Kính sợ’ bảo tồn sức nặng và độ căng của thành ngữ Kinh Thánh, không làm yếu yếu tố kính úy bằng cách chỉ dịch là ‘tôn kính’.
- issue: Quan hệ cú pháp của οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: ‘cả nhỏ lẫn lớn’ bổ nghĩa cho những người kính sợ Ngài trong cùng lời gọi
  alternative: xem đây là một nhóm được gọi riêng biệt
  rationale: Cách đặt nối tiếp trong tiếng Hy Lạp thuận với lối đồng vị, đồng thời vẫn giữ nguyên khả năng lời kêu gọi bao gồm mọi người thuộc cả địa vị thấp và cao.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Viết hoa đại từ ‘Ngài’ theo quy ước tôn kính phổ biến trong Kinh Thánh tiếng Việt. Không dùng dấu chú thích vì không có chú thích nào cần thiết cho bản dịch này; mọi dấu chú thích nếu có đều phải xuất hiện trong chính văn.
