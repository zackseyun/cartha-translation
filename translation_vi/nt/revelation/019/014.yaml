  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: vi
  text: Các đạo quân ở trên trời đi theo Ngài trên những con ngựa trắng[a], mặc vải lanh mịn, trắng và sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các đạo quân của trời.” Cụm từ Hy Lạp dịch sát là: “các đạo quân, những đạo quân ở trên trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: các đạo quân
  rationale: Danh từ số nhiều chỉ những lực lượng quân sự có tổ chức; “các đạo quân” tự nhiên, trực tiếp và phù hợp với bối cảnh chiến trận khải huyền.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: ở trên trời
  rationale: Cụm từ có nghĩa định vị, cho biết các đạo quân ở đâu mà không quyết định họ là thiên sứ, các thánh hay cả hai.
- source_word: ἠκολούθει αὐτῷ
  choice: đi theo Ngài
  rationale: Diễn đạt hành động đang tiếp diễn trong khải tượng một cách tự nhiên trong tiếng Việt; đại từ “Ngài” giữ văn phong tôn kính đối với nhân vật trung tâm.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: cưỡi những con ngựa trắng
  rationale: “Cưỡi” là cách diễn đạt tiếng Việt tự nhiên cho việc đi trên lưng ngựa, đồng thời giữ nguyên màu trắng mang tính biểu tượng.
- source_word: ἐνδεδυμένοι
  choice: mặc
  rationale: Cách nói hiện đại, rõ nghĩa về trạng thái phục sức và tránh lối diễn đạt nặng nề.
- source_word: βύσσινον
  choice: vải gai mịn
  rationale: Chỉ loại vải lanh quý, mịn; cách dịch này nhất quán với hình ảnh βύσσινον trong sách Khải Huyền và dễ hiểu trong tiếng Việt Kinh Thánh.
- source_word: λευκὸν καθαρόν
  choice: trắng và sạch
  rationale: Giữ riêng cả hai tính từ, chuyển tải màu sắc và tình trạng tinh sạch mà không diễn giải καθαρόν thành một kết luận thần học mạnh hơn.
theological_decisions:
- issue: Danh tính và đặc điểm của các đạo quân trên trời
  choice: Dịch theo lối mô tả là “các đạo quân ở trên trời”, không xác định họ là thiên sứ, các thánh hay cả hai.
  alternative: “các đạo quân của trời” hoặc chú giải rõ họ là thiên sứ hay các thánh đã được vinh hiển
  rationale: Bản Hy Lạp xác định vị trí và y phục của họ nhưng không nói rõ danh tính trong câu này; bản dịch giữ nguyên sự dè dặt và căng thẳng thần học của văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “đạo quân” cho sắc thái quân sự rõ ràng; giữ cấu trúc mô tả của khải tượng và không thêm lời xác định danh tính của đoàn quân.
