revisions:
- from: Các đạo quân ở trên trời đi theo Ngài, cưỡi những con ngựa trắng[a] và mặc vải gai mịn, trắng và sạch.
  to: Các đạo quân ở trên trời đi theo Ngài trên những con ngựa trắng[a], mặc vải lanh mịn, trắng và sạch.
  rationale: Chỉnh «vải gai mịn» thành «vải lanh mịn» để phản ánh βύσσινον chính xác và tự nhiên hơn trong tiếng Việt hiện đại. Điều chỉnh nhẹ trật tự cụm từ để câu rõ và mượt hơn, nhưng vẫn giữ tính tiếp diễn của ἠκολούθει, vị trí «ở trên trời», tính không xác định danh tính của các đạo quân, và cả hai tính từ «trắng và sạch».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: các đạo quân được xác định bằng vị trí «ở trên trời», đang theo Ngài, trên ngựa trắng, và mặc βύσσινον trắng, sạch. Tuy nhiên, «vải gai mịn» không phải cách gọi hiện đại chuẩn, rõ nghĩa nhất cho βύσσινον; «vải lanh mịn» phản ánh chính xác hơn loại vải lanh mịn/quý này.'
  naturalness: «Các đạo quân ở trên trời» và «đi theo Ngài» phù hợp văn phong trang trọng hiện đại. Đặt «trên những con ngựa trắng» ngay sau động từ giúp làm rõ đây là tình trạng của các đạo quân đang theo Ngài; tránh phối hợp «cưỡi ... và mặc ...» có thể hơi nặng và kém sát cấu trúc mô tả của nguyên văn.
  terminology: Giữ «đạo quân» cho στρατεύματα và không xác định danh tính của họ. Dùng «vải lanh mịn» cho βύσσινον; giữ riêng «trắng và sạch» cho λευκὸν καθαρόν, không thay bằng thuật ngữ diễn giải như «tinh sạch».
  issues:
  - severity: medium
    issue: «vải gai mịn» cho βύσσινον
    rationale: βύσσινον chỉ vải lanh mịn/fine linen. Trong tiếng Việt hiện đại, «vải lanh mịn» là cách gọi trực tiếp, ít mơ hồ hơn; «vải gai» dễ gợi một loại sợi/vải khác hoặc cách dùng cổ.
  - severity: low
    issue: Cấu trúc «đi theo Ngài, cưỡi ... và mặc ...»
    rationale: Không sai nghĩa, nhưng «đi theo Ngài trên những con ngựa trắng, mặc ...» trôi chảy hơn và liên kết rõ các nét miêu tả của đoàn quân trong khải tượng.
  revised_text: Các đạo quân ở trên trời đi theo Ngài trên những con ngựa trắng[a], mặc vải lanh mịn, trắng và sạch.
