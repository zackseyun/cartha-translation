id: REV.5.10
reference: Revelation 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: vi
  text: và Ngài đã làm cho họ thành một vương quốc và các thầy tế lễ[a] cho Đức Chúa Trời của chúng ta; họ trị vì trên đất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “các vua và các thầy tế lễ” thay cho “một vương quốc và các thầy tế lễ”.
    reason: textual_variant
  - marker: b
    text: Một số thủ bản chép “họ sẽ trị vì trên đất” thay cho “họ trị vì trên đất”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: Ngài đã làm cho
  rationale: Động từ aorist chủ động, ngôi thứ hai số ít; cách dịch này diễn đạt tự nhiên một hành động đã thực hiện, đồng thời đại từ “Ngài” giữ sắc thái tôn kính trong lời ca hướng đến Chiên Con.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ đối cách số nhiều, chỉ những người được chuộc ở câu trước; trong cấu trúc tiếng Việt “làm cho họ thành…”, “họ” là cách diễn đạt tự nhiên.
- source_word: τῷ θεῷ ἡμῶν
  choice: cho Đức Chúa Trời của chúng ta
  rationale: Dative có thể mang nghĩa “cho” hoặc “đối với”; “cho” tự nhiên trong tiếng Việt và không diễn giải quá mức mối quan hệ.
- source_word: βασιλείαν
  choice: một vương quốc
  rationale: Danh từ đối cách số ít chỉ một cộng đồng được lập thành vương quốc; giữ nguyên số ít của bản văn SBLGNT thay vì theo dị bản “các vua”.
- source_word: ἱερεῖς
  choice: các thầy tế lễ
  rationale: Cách dịch chuẩn, dễ hiểu của danh từ số nhiều, đồng thời giữ liên hệ với Xuất Ê-díp-tô Ký 19:6 và Khải Huyền 1:6.
- source_word: βασιλεύουσιν
  choice: họ trị vì
  rationale: Hình thái trong bản văn được cung cấp là hiện tại chủ động, ngôi thứ ba số nhiều; vì vậy dịch ở hiện tại. Dị bản tương lai được ghi ở chú thích.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: ἐπί với sở hữu cách ở đây được chuyển trực tiếp là “trên”; tránh “cai trị đất” hay “trên toàn cõi đất” vì những cách ấy thêm sắc thái không có rõ trong giới từ.
theological_decisions:
- issue: Căn tính của những người được chuộc trong βασιλείαν
  choice: một vương quốc
  alternative: các vua
  rationale: Bản văn SBLGNT được cung cấp đọc βασιλείαν, “một vương quốc”. Dị bản “các vua” được bảo lưu trong chú thích vì có ảnh hưởng đáng kể trong truyền thống bản văn và dịch thuật.
- issue: Thời điểm họ trị vì
  choice: họ trị vì
  alternative: họ sẽ trị vì
  rationale: Bản văn Hy Lạp được cung cấp có βασιλεύουσιν ở thì hiện tại. Bản dịch không biến hiện tại thành tương lai để giải quyết một vấn đề cánh chung; dị bản tương lai được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho ngôi thứ hai hướng đến Chiên Con; “Đức Chúa Trời của chúng ta” diễn đạt đầy đủ đại từ sở hữu. Dấu chấm phẩy làm rõ hai mệnh đề phối hợp mà không phá nhịp của lời ca.
