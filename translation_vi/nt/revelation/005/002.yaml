  source_fidelity: 'Bản nháp chuyển tải đúng các thành tố chính của câu Hy Lạp: Giăng thấy (καὶ εἶδον), một thiên sứ mạnh (ἄγγελον ἰσχυρόν), đang công bố (κηρύσσοντα) bằng tiếng lớn (ἐν φωνῇ μεγάλῃ), và câu hỏi về người xứng đáng mở βιβλίον cùng tháo các ấn của nó. Tuy nhiên, “đầy quyền năng” hơi diễn giải phẩm tính ἰσχυρός như sự sở hữu quyền năng, thay vì trực tiếp mô tả thiên sứ là mạnh/mạnh mẽ. “Lớn tiếng” có thể mang sắc thái quở trách trong tiếng Việt hiện đại; “bằng tiếng lớn” sát nguồn và trung tính hơn.'
