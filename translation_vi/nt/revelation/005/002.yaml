source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: vi
  text: 'Tôi thấy một thiên sứ mạnh mẽ công bố bằng tiếng lớn: “Ai xứng đáng để mở cuộn sách[a] và tháo các ấn của nó?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sách.” Từ Hy Lạp βιβλίον có thể chỉ một văn bản nói chung, nhưng trong bối cảnh vật có nhiều ấn, “cuộn sách” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: một thiên sứ đầy quyền năng
  rationale: ἰσχυρός chỉ sức mạnh hoặc quyền năng. “Đầy quyền năng” tự nhiên trong tiếng Việt khi nói về một thiên sứ và truyền đạt rõ sức mạnh nổi bật của vị ấy.
- source_word: κηρύσσοντα
  choice: đang ... công bố
  rationale: κηρύσσω diễn tả việc công khai loan báo như một sứ giả. “Công bố” phù hợp với lời tuyên cáo long trọng trong khải tượng hơn “rao giảng”.
- source_word: ἐν φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Đây là thành ngữ chỉ lời nói vang lớn, mạnh mẽ. “Lớn tiếng” là cách diễn đạt tự nhiên, gọn và đúng nghĩa trong tiếng Việt.
- source_word: Τίς ἄξιος
  choice: Ai xứng đáng
  rationale: ἄξιος diễn tả tư cách hoặc sự xứng hợp để thực hiện một nhiệm vụ trọng đại. “Xứng đáng” vừa thông dụng vừa giữ được sức nặng thần học của câu hỏi.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: mở cuộn sách
  rationale: βιβλίον có thể chỉ sách hoặc văn bản nói chung, nhưng vật có nhiều ấn trong bối cảnh thế kỷ thứ nhất được hình dung tự nhiên nhất là một cuộn sách.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: tháo các ấn của nó
  rationale: λύω có nghĩa gốc là tháo, cởi hoặc làm cho được mở. “Tháo các ấn” giữ hình ảnh cụ thể mà không nhất thiết hàm ý phải đập vỡ chúng; đại từ “nó” quy chiếu về cuộn sách.
theological_decisions:
- issue: Cách dịch βιβλίον trong khải tượng tại ngai
  choice: cuộn sách
  alternative: sách
  rationale: Khải tượng mô tả một văn bản có nhiều ấn; trong bối cảnh cổ đại, “cuộn sách” phù hợp hơn về mặt lịch sử và hình ảnh. Đây là quyết định từ vựng-lịch sử, không nhằm áp đặt một cách giải thích giáo lý.
- issue: Cách diễn đạt hành động λῦσαι đối với các ấn
  choice: tháo các ấn
  alternative: phá các ấn
  rationale: λύω có phạm vi nghĩa gồm tháo, cởi và giải phóng. “Tháo” bảo toàn hình ảnh mở từng ấn và tránh xác định quá mức phương thức vật lý, trong khi “phá” cũng là cách hiểu có thể có trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” theo lối dùng Kinh Thánh phổ biến; câu hỏi trực tiếp giữ nhịp long trọng của lời công bố. Không thêm chú thích vì bản dịch chính đã thể hiện rõ vật thể là cuộn sách, còn “sách” không cần thiết phải nêu như một dị bản trong câu đơn này.
