  terminology: Giữ “thiên sứ,” “xứng đáng,” “cuộn sách,” và “ấn” là nhất quán với văn phong Kinh Thánh Việt ngữ. Thêm chú thích cho “cuộn sách” để bảo toàn lựa chọn từ vựng βιβλίον và phương án “sách” trong dấu vết kiểm tra tiếng Anh, không biến phương án này thành một khác biệt văn bản.
