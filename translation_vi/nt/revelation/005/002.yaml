  - severity: low
    issue: “lớn tiếng công bố”
    rationale: “Lớn tiếng” trong cách dùng hiện đại đôi khi gợi giọng gay gắt hay cãi vã. “Công bố bằng tiếng lớn” diễn đạt trung tính hơn ἐν φωνῇ μεγάλῃ và giữ sắc thái long trọng.
