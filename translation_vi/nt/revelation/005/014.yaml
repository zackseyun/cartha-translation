id: REV.5.14
reference: Revelation 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: vi
  text: 'Bốn sinh vật cứ nói: “A-men.” Các trưởng lão sấp mình xuống và thờ phượng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản thêm đối tượng rõ ràng sau từ “thờ phượng”, chẳng hạn “Đấng sống đời đời” hoặc “Ngài”. Phần chính theo cách đọc ngắn hơn của SBLGNT, trong đó đối tượng được hiểu theo văn cảnh.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: sinh vật
  rationale: Trong sách Khải Huyền, từ này chỉ các hữu thể sống trên trời quanh ngai; “sinh vật” là cách gọi tự nhiên, trang trọng và duy trì mối liên hệ với khải tượng ngai trong sách Ê-xê-chi-ên.
- source_word: ἔλεγον
  choice: cứ nói
  rationale: Thì chưa hoàn thành gợi hành động đang tiếp diễn hoặc lặp lại; “cứ nói” chuyển tải sắc thái ấy rõ ràng và tự nhiên trong ngữ cảnh lời tung hô.
- source_word: Ἀμήν
  choice: A-men
  rationale: Giữ nguyên lời tung hô phụng vụ quen thuộc bằng hình thức phiên âm thông dụng trong tiếng Việt, thay vì thu hẹp nghĩa thành “Thật vậy” hoặc “Nguyện được như vậy”.
- source_word: πρεσβύτεροι
  choice: các trưởng lão
  rationale: Ở đây từ này là danh xưng của một nhóm trên trời, không đơn thuần nói đến những người cao tuổi.
- source_word: ἔπεσαν
  choice: sấp mình xuống
  rationale: Diễn đạt rõ tư thế hạ mình phủ phục trong bối cảnh thờ phượng, tự nhiên hơn cách dịch từng chữ là “ngã xuống”.
- source_word: προσεκύνησαν
  choice: thờ phượng
  rationale: Trong cảnh quanh ngai trên trời, động từ này mang ý nghĩa tôn kính mang tính thờ phượng, chứ không chỉ mô tả động tác cúi lạy.
theological_decisions:
- issue: Đối tượng của hành động thờ phượng được để hàm ẩn
  choice: Giữ cách nói tuyệt đối “thờ phượng”, không thêm đối tượng.
  alternative: “thờ phượng Ngài”, “thờ phượng Đức Chúa Trời” hoặc “thờ phượng Đấng sống đời đời”
  rationale: Bản SBLGNT kết thúc bằng καὶ προσεκύνησαν mà không nêu đối tượng. Tiếng Việt vẫn có thể để đối tượng được hiểu theo văn cảnh; thêm đối tượng sẽ đưa vào câu chữ từ dị bản hoặc từ suy luận theo văn cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Cứ nói” bảo lưu sắc thái tiếp diễn hoặc lặp lại của thì chưa hoàn thành; “sấp mình xuống và thờ phượng” phân biệt tư thế thân thể với hành động thờ phượng. Dấu chú thích được đặt sau “thờ phượng”, đúng nơi có dị bản.
