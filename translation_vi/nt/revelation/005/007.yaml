id: REV.5.7
reference: Revelation 5:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: vi
  text: Ngài đến và lấy cuộn sách từ tay phải của Đấng ngự trên ngai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: đến
  rationale: Động từ ἔρχομαι ở thì bất định thuật lại chuyển động của Chiên Con về phía Đấng ngự trên ngai. “Đến” tự nhiên và không thêm sắc thái diễn giải như “tiến lại gần”.
- source_word: εἴληφεν
  choice: lấy cuộn sách
  rationale: Dạng hoàn thành của λαμβάνω trong mạch tường thuật khải tượng được diễn đạt tự nhiên bằng “lấy”. Tân ngữ được nói rõ là “cuộn sách” theo văn cảnh trực tiếp, giúp câu tiếng Việt sáng nghĩa mà không thêm nội dung mới.
- source_word: ἐκ
  choice: từ
  rationale: Diễn đạt nguồn nơi vật được lấy ra; “từ” là cách nói tự nhiên trong tiếng Việt.
- source_word: τῆς δεξιᾶς
  choice: tay phải
  rationale: Trong cấu trúc này, δεξιά chỉ bàn tay phải, giữ nguyên hình ảnh cụ thể của khải tượng.
- source_word: τοῦ καθημένου
  choice: Đấng ngự
  rationale: Phân từ dùng như danh từ chỉ nhân vật đang ngồi. “Đấng ngự” là lối diễn đạt trang trọng, tự nhiên trong ngữ cảnh ngai trời, đồng thời không xác định thêm danh tính ngoài điều bản văn nói.
- source_word: ἐπὶ τοῦ θρόνου
  choice: trên ngai
  rationale: Giữ nghĩa vị trí thông thường của ἐπί và dùng cách diễn đạt tiếng Việt hiện đại, trang nghiêm.
theological_decisions:
- issue: Tân ngữ được hàm ý của εἴληφεν
  choice: Nói rõ “cuộn sách”, dựa vào văn cảnh ngay trước đó.
  alternative: “Ngài đến và lấy từ tay phải...” hoặc dùng đại từ “nó”.
  rationale: Tiếng Hy Lạp để tân ngữ ngầm hiểu vì cuộn sách đã được nêu rõ trong văn cảnh. Tiếng Việt cần một tân ngữ để câu tự nhiên; lặp lại “cuộn sách” rõ ràng và tránh đại từ thiếu trang trọng hoặc mơ hồ.
- issue: Cách gọi nhân vật ngự trên ngai
  choice: “Đấng ngự trên ngai”
  alternative: “Đấng đang ngồi trên ngai” hoặc “vị ngồi trên ngai”.
  rationale: Cách dịch này giữ sự phân biệt giữa Chiên Con và Đấng trên ngai, phản ánh phân từ Hy Lạp mà không thêm lời giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” để nối với Chiên Con trong văn cảnh và “Đấng ngự” cho nhân vật trên ngai. Không cần chú thích vì các lựa chọn đều được văn cảnh xác định rõ.
