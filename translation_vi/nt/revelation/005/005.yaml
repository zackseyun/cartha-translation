id: REV.5.5
reference: Revelation 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: vi
  text: 'Một trong các trưởng lão nói với tôi: “Đừng khóc nữa. Kìa, Sư Tử từ chi phái Giu-đa, Cội Rễ Đa-vít, đã chiến thắng[b] để mở cuộn sách và bảy ấn của nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Cũng có thể dịch là “đã đắc thắng” hoặc “đã thắng.” Động từ Hy Lạp này là một từ khóa trong sách Khải Huyền, diễn tả sự chiến thắng.
    reason: Bảo lưu các sắc thái quan trọng của νικάω mà một lựa chọn tiếng Việt đơn lẻ không thể chuyển tải trọn vẹn.
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Trong sách Khải Huyền, từ này chỉ một nhóm nhân vật trên trời có địa vị được nhận biết, chứ không chỉ nói đến những người cao tuổi.
- source_word: λέγει
  choice: nói
  rationale: Giữ thì hiện tại kể chuyện của tiếng Hy Lạp, tạo tính trực tiếp mà vẫn tự nhiên trong tiếng Việt.
- source_word: Μὴ κλαῖε
  choice: Đừng khóc nữa
  rationale: Diễn đạt tự nhiên mệnh lệnh ở thì hiện tại trong bối cảnh Giăng đang khóc; “nữa” gợi ý chấm dứt hành động đang diễn ra mà không làm thay đổi ý chính.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Một từ thu hút sự chú ý, trang trọng vừa phải và tự nhiên hơn lối cổ “Này, hãy xem” trong ngữ cảnh này.
- source_word: ἐνίκησεν
  choice: đã chiến thắng
  rationale: Bảo toàn mô-típ chiến thắng quan trọng của νικάω trong Khải Huyền; cách này cũng để ngỏ sắc thái “đắc thắng/chinh phục” thay vì chỉ rõ phương thức bằng bạo lực.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: Sư Tử đến từ bộ tộc Giu-đa
  rationale: Phản ánh trực tiếp giới từ ἐκ, đồng thời giữ nguyên hình ảnh và tước hiệu Mê-si-a.
- source_word: ἡ ῥίζα Δαυίδ
  choice: Cội Rễ của Đa-vít
  rationale: Giữ nguyên hình ảnh Kinh Thánh và tính chất tước hiệu; “cội rễ” tự nhiên, trang trọng và gợi cả nguồn gốc lẫn dòng dõi.
- source_word: ἀνοῖξαι
  choice: để mở
  rationale: Bám sát động từ nguyên mẫu tiếng Hy Lạp và giữ được độ mở về quan hệ mục đích, kết quả hoặc tư cách giữa chiến thắng và việc mở cuộn sách.
- source_word: τὸ βιβλίον
  choice: cuộn sách
  rationale: Phù hợp với vật thể được mô tả trong bối cảnh cổ đại và trong Khải Huyền 5 hơn từ chung “sách”.
- source_word: σφραγῖδας
  choice: ấn
  rationale: Thuật ngữ tiếng Việt chuẩn, ngắn gọn, chỉ những con dấu niêm phong cuộn sách.
- source_word: αὐτοῦ
  choice: của nó
  rationale: Đại từ quy chiếu về cuộn sách; cách diễn đạt này giữ rõ quan hệ sở hữu trong nguyên văn.
theological_decisions:
- issue: Hai tước hiệu hoàng gia/Mê-si-a
  choice: Giữ trực tiếp cả “Sư Tử đến từ bộ tộc Giu-đa” và “Cội Rễ của Đa-vít”.
  alternative: Diễn giải một hoặc cả hai tước hiệu bằng lời giải thích về Đấng Mê-si-a.
  rationale: Nguyên văn chủ ý đặt cạnh nhau hai hình ảnh bắt nguồn từ Kinh Thánh Israel; giữ nguyên giúp bảo toàn sức nặng Cơ Đốc học mà không thêm lời giải nghĩa giáo phái.
- issue: Quan hệ của ἀνοῖξαι với ἐνίκησεν
  choice: Dịch “đã chiến thắng để mở”.
  alternative: “đã chiến thắng, nên có thể mở” hoặc “đã chiến thắng và mở”.
  rationale: “Để mở” phản ánh sát cấu trúc động từ nguyên mẫu và không quyết định quá mức rằng đây chỉ là mục đích, kết quả hay năng quyền/tư cách đạt được nhờ chiến thắng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Sư Tử” và “Cội Rễ” vì chúng hoạt động như các tước hiệu trong câu. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn; [b] đặt ngay sau “chiến thắng”, còn [a] đặt sau toàn cụm liên quan đến việc mở cuộn sách và các ấn.
