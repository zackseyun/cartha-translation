revisions:
- from: 'Một trong các trưởng lão nói với tôi: “Đừng khóc nữa. Kìa, Sư Tử đến từ bộ tộc Giu-đa, tức Cội Rễ của Đa-vít, đã chiến thắng[b] để mở cuộn sách và bảy ấn của nó.[a]”'
  to: 'Một trong các trưởng lão nói với tôi: “Đừng khóc nữa. Kìa, Sư Tử từ chi phái Giu-đa, Cội Rễ Đa-vít, đã chiến thắng[b] để mở cuộn sách và bảy ấn của nó.”'
  rationale: Bản sửa thay “bộ tộc” bằng “chi phái,” bỏ “tức” để giữ hai tước hiệu song song như nguyên văn, và loại chú thích [a] vì nó thêm diễn giải thao tác vật lý không cần thiết. Các lựa chọn còn lại được giữ nguyên vì vừa trung thành với tiếng Hy Lạp vừa tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa hai điểm để bám sát nguyên văn hơn: φυλή trong ngữ cảnh Giu-đa nên là “chi phái” hơn là “bộ tộc”; và “tức” biến tước hiệu thứ hai thành lời giải thích đồng nhất quá trực tiếp, trong khi tiếng Hy Lạp chỉ đặt hai tước hiệu song song theo cách apposition. Cụm “để mở” có thể giữ, vì phản ánh nguyên mẫu ἀνοῖξαι mà không áp đặt cách hiểu duy nhất về quan hệ với “đã chiến thắng”.'
  naturalness: Bản văn đã rõ ràng và trang trọng. “Sư Tử từ chi phái Giu-đa, Cội Rễ Đa-vít” tự nhiên trong văn phong Kinh Thánh hiện đại và giữ được nhịp liệt kê tước hiệu. “Đừng khóc nữa” phù hợp với ngữ cảnh người nhận đang khóc.
  terminology: '“Trưởng lão,” “cuộn sách,” và “ấn” đều thích hợp. “Chi phái” là thuật ngữ chuẩn hơn cho φυλή trong liên hệ với Giu-đa. Viết hoa “Sư Tử” và “Cội Rễ” phù hợp vì đây là các tước hiệu. Chú thích [a] không nên giữ: bản dịch chính văn đã phản ánh đúng cấu trúc “mở cuộn sách và bảy ấn của nó,” còn phương án “tháo” hoặc “phá” là diễn giải về thao tác thực tế, không phải một cách dịch song song cần thiết của nguyên văn.'
  issues:
  - severity: medium
    issue: “bộ tộc Giu-đa” dịch φυλή kém chính xác trong ngữ cảnh Kinh Thánh.
    rationale: φυλή ở đây chỉ chi phái Israel; “chi phái Giu-đa” là cách gọi tiếng Việt chuẩn và bảo toàn liên hệ Kinh Thánh.
  - severity: medium
    issue: Từ “tức” trước “Cội Rễ của Đa-vít” diễn giải quan hệ giữa hai tước hiệu quá cụ thể.
    rationale: Nguyên văn đặt “Sư Tử ... Giu-đa” và “Cội Rễ Đa-vít” song song trong đồng vị ngữ. Bỏ “tức” giữ cấu trúc và không thêm sắc thái giải thích.
  - severity: low
    issue: Chú thích [a] đưa vào diễn giải không cần thiết về việc “tháo hoặc phá” các ấn.
    rationale: Câu Hy Lạp dùng cùng động từ “mở” với cuộn sách và bảy ấn. Chính văn có thể giữ cách diễn đạt này; chú thích hiện tại dễ khiến độc giả tưởng nguyên văn dùng một động từ riêng với nghĩa “tháo” cho các ấn.
