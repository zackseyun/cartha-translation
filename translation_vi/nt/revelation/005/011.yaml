  to: Rồi tôi nhìn[a] và nghe tiếng của nhiều thiên sứ ở chung quanh ngai, các sinh vật và các trưởng lão. Số của họ là muôn muôn và ngàn ngàn[b].
  rationale: Chỉ chỉnh chú thích b để diễn đạt chính xác và tự nhiên thành ngữ số lượng trong tiếng Hy Lạp. Chính văn được giữ nguyên vì đã bảo toàn quan hệ cú pháp, tính tập thể của «tiếng», và tính không xác định chính xác của các con số.
