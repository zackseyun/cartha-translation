id: REV.5.11
reference: Revelation 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: vi
  text: Rồi tôi nhìn[a] và nghe tiếng của nhiều thiên sứ ở chung quanh ngai, các sinh vật và các trưởng lão. Số của họ là muôn muôn và ngàn ngàn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi thấy”.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “vạn vạn và ngàn ngàn”, một lối nói chỉ một đoàn đông vô cùng lớn; cũng có thể dịch: “hàng vạn hàng vạn và hàng ngàn hàng ngàn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: tôi nhìn
  rationale: Trong diễn tiến của khải tượng, cách dịch này tự nhiên khi Giăng hướng sự chú ý rồi thuật lại điều mình nghe; “tôi thấy” cũng có thể hiểu được và được ghi ở chú thích.
- source_word: ἤκουσα
  choice: nghe
  rationale: Cách dịch trực tiếp, tự nhiên của động từ ἀκούω trong lời kể.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: tiếng của nhiều thiên sứ
  rationale: “Tiếng” có thể chỉ tiếng nói hoặc âm thanh tập thể, nhờ đó không buộc phải xác định các thiên sứ đồng thanh hay phát ra nhiều tiếng; cụm sở hữu giữ sát cấu trúc Hy Lạp.
- source_word: κύκλῳ
  choice: ở chung quanh
  rationale: Diễn đạt rõ vị trí bao quanh ngai và các nhân vật thuộc cảnh ngai trời.
- source_word: τῶν ζῴων
  choice: các sinh vật
  rationale: Giữ thuật ngữ chỉ bốn hữu thể sống đặc thù trong Khải Huyền mà không đồng nhất chúng với thú vật thông thường.
- source_word: τῶν πρεσβυτέρων
  choice: các trưởng lão
  rationale: Cách dịch quen thuộc, trang trọng và nhất quán cho πρεσβύτεροι trong cảnh ngai trời.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: Số của họ là
  rationale: Giữ mệnh đề nói rõ về số lượng, đồng thời dùng cách diễn đạt Việt ngữ ngắn gọn.
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: muôn muôn và ngàn ngàn
  rationale: Giữ phép lặp tăng cường và sắc thái con số mênh mông của nguyên văn; chú thích cung cấp lối diễn đạt đầy đủ hơn để tránh hiểu đây chỉ là hai con số nhỏ.
theological_decisions:
- issue: Cách gọi các hữu thể quanh ngai (ζῷα)
  choice: các sinh vật
  alternative: các hữu thể sống
  rationale: “Các sinh vật” là cách gọi tự nhiên, phân biệt được với các thiên sứ và trưởng lão, nhưng không giải thích thêm bản chất của bốn hữu thể này.
- issue: Phạm vi của cụm “ở chung quanh”
  choice: giữ chuỗi “ở chung quanh ngai, các sinh vật và các trưởng lão”
  alternative: diễn giải rằng các thiên sứ tạo thành vòng ngoài bao quanh cả ngai lẫn hai nhóm hữu thể
  rationale: Giữ nguyên quan hệ cú pháp của câu Hy Lạp và không thêm sơ đồ không gian chi tiết hơn điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Rồi” để nối diễn tiến khải tượng; giữ nhịp lặp giàu tính khải huyền của các con số và không biến chúng thành một tổng số chính xác.
