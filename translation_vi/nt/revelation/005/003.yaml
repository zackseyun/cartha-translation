id: REV.5.3
reference: Revelation 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: vi
  text: Không một ai trên trời, trên đất hay dưới đất có thể mở cuộn sách ấy hoặc nhìn vào cuộn sách ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyển sách.” Từ Hy Lạp có thể chỉ một văn bản nói chung, nhưng trong bối cảnh này, “cuộn sách” phù hợp hơn với hình ảnh thời cổ đại.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: không một ai
  rationale: Diễn đạt rõ đại từ phủ định tuyệt đối, tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἐδύνατο
  choice: có thể
  rationale: Trong mạch kể quá khứ, tiếng Việt không bắt buộc đánh dấu thì; kết hợp với “không một ai” diễn tả đúng sự bất lực.
- source_word: ἐν τῷ οὐρανῷ
  choice: trên trời
  rationale: Cách nói tiếng Việt tự nhiên cho vị trí trong cõi trời, đồng thời phù hợp với cấu trúc không gian ba tầng.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Giữ nghĩa vị trí và cân xứng với “trên trời” và “bên dưới đất”.
- source_word: ὑποκάτω τῆς γῆς
  choice: bên dưới đất
  rationale: Chuyển tải trực tiếp tầng không gian thứ ba trong hình ảnh vũ trụ của khải tượng.
- source_word: ἀνοῖξαι
  choice: mở
  rationale: Động từ đơn giản, trực tiếp, không thêm ý ngoài nguyên văn.
- source_word: τὸ βιβλίον
  choice: cuộn sách
  rationale: Trong bối cảnh khải tượng cổ đại, từ này nhiều khả năng chỉ một văn bản dạng cuộn hơn là sách đóng quyển.
- source_word: οὔτε βλέπειν αὐτό
  choice: hoặc nhìn vào đó
  rationale: Giữ sự phối hợp phủ định của οὔτε mà không thêm sắc thái “thậm chí” vốn không được biểu thị rõ trong nguyên văn; “nhìn vào” phù hợp với hành động hướng mắt xem cuộn sách.
theological_decisions:
- issue: Phạm vi vũ trụ của những kẻ không thể mở cuộn sách
  choice: 'Giữ nguyên ba tầng không gian: “trên trời, trên đất hay bên dưới đất.”'
  alternative: Khái quát hóa thành “ở bất cứ đâu trong tạo vật.”
  rationale: Ba tầng không gian nhấn mạnh sự bất lực phổ quát và bảo tồn hình ảnh khải huyền của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp liệt kê ba tầng không gian và không thêm từ nhấn mạnh không có trong tiếng Hy Lạp.
