  source_fidelity: Bản dịch giữ đúng phủ định phổ quát, ba tầng không gian của khải tượng, sự bất lực được diễn tả bởi ἐδύνατο, và hai hành động ἀνοῖξαι ... οὔτε βλέπειν. Tuy nhiên, “nhìn vào đó” dùng đại từ chỉ nơi chốn (“đó”), trong khi αὐτό quy chiếu trực tiếp đến cuộn sách; cách này có thể bị hiểu là nhìn vào bên trong một nơi/vật hơn là nhìn cuộn sách.
  naturalness: Câu có nhịp liệt kê tự nhiên và trang trọng. Thay “đó” bằng việc lặp lại “cuộn sách ấy” làm quy chiếu rõ ràng, tự nhiên hơn trong tiếng Việt hiện đại, đồng thời tránh đại từ “nó” có thể kém trang trọng trong văn phong Kinh Thánh.
  terminology: “Cuộn sách” là lựa chọn phù hợp cho βιβλίον trong bối cảnh khải tượng cổ đại. “Trên trời, trên đất hay dưới đất” bảo toàn hình ảnh không gian ba tầng mà không diễn giải thần học thêm. Chú thích thay thế “quyển sách” là thích đáng.
