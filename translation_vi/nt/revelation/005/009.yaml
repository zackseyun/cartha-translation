revisions:
- from: 'Họ hát một bài ca mới rằng:

    “Ngài xứng đáng nhận cuộn sách

    và mở các ấn của nó,

    vì Ngài đã bị giết,

    và bằng huyết mình, Ngài đã mua cho Đức Chúa Trời những người[a]

    từ mọi bộ tộc, ngôn ngữ, dân tộc và quốc gia.”'
  to: 'Họ hát một bài ca mới rằng:


    “Ngài xứng đáng nhận cuộn sách

    và mở các ấn niêm phong của nó,

    vì Ngài đã bị giết,

    và bằng huyết của Ngài, đã mua về cho Đức Chúa Trời những người[a]

    từ mọi bộ tộc, ngôn ngữ, dân tộc và quốc gia.”'
  rationale: 'Sửa các điểm diễn đạt để tiếng Việt hiện đại rõ và tự nhiên hơn: xác định “ấn” là ấn niêm phong của cuộn sách, diễn đạt τῷ θεῷ bằng “mua về cho Đức Chúa Trời”, và lược bớt một chủ ngữ lặp lại. Chú thích về tân ngữ được thêm vào vẫn cần thiết, chính xác và được giữ nguyên. Không cần thêm chú thích cho các khả năng “cho/to Đức Chúa Trời” hoặc “bằng/với huyết”, vì bản dịch đã chọn những cách diễn đạt tự nhiên và không làm mất một dị bản văn bản nào.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:23Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát SBLGNT: giữ hiện tại “hát”, “bài ca mới”, cuộn sách, các ấn, sự bị giết, phương tiện “bằng huyết”, và công thức bốn thành phần. Tuy nhiên, “các ấn của nó” không tự nhiên và có thể khiến “ấn” được hiểu là con dấu thuộc sở hữu cuộn sách, trong khi thành ngữ ngữ cảnh là các ấn niêm phong cuộn sách; “mở các ấn niêm phong của nó” rõ hơn mà không thêm diễn giải đáng kể. “Mua cho Đức Chúa Trời” cũng có thể được hiểu là mua thay cho Đức Chúa Trời; “mua về cho Đức Chúa Trời” diễn đạt tốt hơn đích/quy thuộc của τῷ θεῷ, vẫn giữ độ mở của cách dative.'
  naturalness: Cấu trúc thơ và giọng trang trọng phù hợp. Cần tránh lặp chủ ngữ “Ngài” sau liên từ trong cùng một lời ca, và đổi “các ấn của nó” thành cụm tự nhiên hơn. “Bằng huyết mình” là cách nói Kinh Thánh tự nhiên; thêm “của Ngài” sau “huyết” giúp tránh khả năng mơ hồ tham chiếu trong văn bản độc lập.
  terminology: “Cuộn sách”, “bài ca mới”, “huyết”, và “Đức Chúa Trời” nhất quán với văn phong Kinh Thánh hiện đại. Giữ “đã bị giết” là an toàn, dù không chuyển tải trọn sắc thái tế lễ/bạo liệt của ἐσφάγης; ngữ cảnh “huyết” duy trì phần nào sắc thái này. “Bộ tộc, ngôn ngữ, dân tộc và quốc gia” bảo toàn bốn mục, tuy các thuật ngữ không hoàn toàn tách biệt về nghĩa trong tiếng Việt, điều không cần giải quyết bằng diễn giải.
  issues:
  - severity: medium
    issue: “mở các ấn của nó” thiếu tự nhiên và chưa làm rõ chức năng niêm phong của σφραγῖδες.
    rationale: Trong ngữ cảnh cuộn sách được niêm phong, “các ấn niêm phong của nó” là tiếng Việt rõ và tự nhiên hơn, vẫn tương ứng trực tiếp với τὰς σφραγῖδας αὐτοῦ.
  - severity: medium
    issue: “mua cho Đức Chúa Trời” có thể hàm ý hành động mua thay mặt Đức Chúa Trời.
    rationale: τῷ θεῷ ở đây có thể chỉ đích/quy thuộc hoặc người hưởng lợi. “Mua về cho Đức Chúa Trời” truyền đạt tự nhiên hơn mà không ép thành “dâng lên” hay một công thức thần học.
  - severity: low
    issue: Lặp “Ngài” trong “vì Ngài đã bị giết, / và bằng huyết mình, Ngài đã mua...” hơi nặng trong tiếng Việt.
    rationale: Chủ ngữ ở mệnh đề sau có thể lược bỏ vì cùng quy chiếu, giúp lời ca trôi chảy mà không thay đổi nghĩa.
