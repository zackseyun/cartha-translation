id: REV.5.9
reference: Revelation 5:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: vi
  text: 'Họ hát một bài ca mới rằng:


    “Ngài xứng đáng nhận cuộn sách

    và mở các ấn niêm phong của nó,

    vì Ngài đã bị giết,

    và bằng huyết của Ngài, đã mua về cho Đức Chúa Trời những người[a]

    từ mọi bộ tộc, ngôn ngữ, dân tộc và quốc gia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hy Lạp không nêu tường minh tân ngữ “những người”; từ này được bổ sung theo hàm ý của ngữ cảnh.
    reason: textual_clarity
lexical_decisions:
- source_word: ᾄδουσιν
  choice: họ hát
  rationale: Thì hiện tại tạo nét tường thuật sống động; “hát” tự nhiên và không thêm ý “ngợi khen” vốn không được nói rõ trong động từ.
- source_word: ᾠδὴν καινὴν
  choice: một bài ca mới
  rationale: Cách nói tự nhiên, trang trọng, đồng thời giữ nguyên mô-típ Kinh Thánh về “bài ca mới”.
- source_word: Ἄξιος εἶ
  choice: Ngài xứng đáng
  rationale: Giữ lời tung hô trực tiếp và dùng đại từ tôn kính tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ βιβλίον
  choice: cuộn sách
  rationale: Chỉ văn kiện dạng cuộn thời cổ đang được niêm phong, chính xác hơn “quyển sách” trong ngữ cảnh Khải Huyền.
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: mở các ấn của nó
  rationale: Theo sát cách diễn đạt cô đọng của Hy Lạp; tránh diễn giải thành “phá ấn” dù đó là hàm ý thực tế.
- source_word: ἐσφάγης
  choice: Ngài đã bị giết
  rationale: Diễn đạt tự nhiên và rõ ràng trong tiếng Việt; ngữ cảnh Chiên Con và “huyết” vẫn bảo toàn sắc thái bạo lực, tế lễ của σφάζω.
- source_word: ἠγόρασας
  choice: đã mua
  rationale: Giữ nghĩa thương mại căn bản của động từ, không chuyển sang “cứu chuộc” là cách diễn giải thần học rộng hơn.
- source_word: τῷ θεῷ
  choice: cho Đức Chúa Trời
  rationale: Dative chỉ người hưởng lợi hoặc đích quy thuộc được diễn đạt tự nhiên bằng “cho”; những người được mua thuộc về Đức Chúa Trời.
- source_word: ἐν τῷ αἵματί σου
  choice: bằng huyết mình
  rationale: ἐν có chức năng chỉ phương tiện; “bằng” làm rõ huyết là phương tiện của việc mua. “Huyết” giữ văn phong Kinh Thánh trang trọng và sắc thái tế lễ.
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: từ mọi bộ tộc, ngôn ngữ, dân tộc và quốc gia
  rationale: Giữ cấu trúc bốn thành phần và phạm vi toàn thế giới. “Ngôn ngữ” là tương đương tự nhiên của γλῶσσα; “dân tộc” và “quốc gia” phân biệt tương đối λαός với ἔθνος trong tiếng Việt.
theological_decisions:
- issue: Tân ngữ của ἠγόρασας không được nêu tường minh trong bản văn SBLGNT
  choice: bổ sung “những người” và đánh dấu chú thích
  alternative: 'để tân ngữ hàm ẩn: “Ngài đã mua cho Đức Chúa Trời từ mọi bộ tộc...”'
  rationale: Tiếng Việt cần một tân ngữ để câu rõ nghĩa; ngữ cảnh cho thấy đối tượng là con người. Chú thích minh bạch rằng từ này được bổ sung theo hàm ý chứ không hiện diện trong bản Hy Lạp.
- issue: Ngôn ngữ chuộc mua bằng huyết
  choice: giữ hình ảnh cụ thể “bằng huyết mình” mà không khai triển thành công thức tín lý
  alternative: diễn giải “bằng sự chết của Ngài”
  rationale: Bản văn trực tiếp quy việc mua cho huyết của Chiên Con; giữ hình ảnh ấy bảo toàn sắc thái tế lễ và căng thẳng thần học của câu.
- issue: Giá trị của dative τῷ θεῷ
  choice: dịch “cho Đức Chúa Trời”
  alternative: dịch “dâng lên Đức Chúa Trời” hoặc “thuộc về Đức Chúa Trời”
  rationale: “Cho” bảo toàn độ mở của dative giữa ý người hưởng lợi và đích quy thuộc, không diễn giải quá mức.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu đối với độc giả tiếng Việt hiện đại. Dùng “Ngài” cho lời thưa trực tiếp với Chiên Con, “Đức Chúa Trời” cho θεός, và “huyết” để giữ sắc thái Kinh Thánh, tế lễ. Bố cục theo thể thơ nhằm phản ánh lời của bài ca.
