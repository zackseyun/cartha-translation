id: REV.5.13
reference: Revelation 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: vi
  text: 'Tôi nghe mọi tạo vật[a] ở trên trời, trên đất, dưới đất và trên biển, cùng tất cả những gì ở trong các nơi ấy, nói rằng:


    “Lời chúc tụng, sự tôn quý, vinh quang và quyền năng

    thuộc về Đấng ngự trên ngai và Chiên Con

    cho đến đời đời vô cùng[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi vật được tạo dựng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “cho đến các đời của các đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: mọi tạo vật
  rationale: κτίσμα chỉ một hữu thể hay vật được tạo dựng. “Mọi tạo vật” giữ được lực phân bố của πᾶν, phù hợp với cảnh toàn thể thọ tạo cất tiếng tôn ngợi, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với “mọi vật được tạo dựng”.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: ở trên trời, trên đất, dưới đất và trên biển, cùng tất cả những gì ở trong các nơi ấy
  rationale: Giữ nguyên chuỗi bốn cõi và ý nghĩa bao quát toàn thể công trình tạo dựng. “Các nơi ấy” làm rõ đại từ số nhiều αὐτοῖς mà không thu hẹp phạm vi.
- source_word: ἤκουσα λέγοντας
  choice: Tôi nghe ... nói rằng
  rationale: Cấu trúc này chuyển tự nhiên động từ cùng phân từ tiếng Hy Lạp; chủ thể tập thể “mọi tạo vật” vẫn được hiểu là những bên đang cất lời.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: thuộc về Đấng ngự trên ngai
  rationale: “Đấng ngự” diễn đạt tự nhiên danh hóa phân từ καθημένῳ trong văn phong trang trọng, còn “trên ngai” giữ nguyên hình ảnh vương quyền.
- source_word: τῷ ἀρνίῳ
  choice: Chiên Con
  rationale: Giữ danh hiệu Kitô học đặc trưng của sách Khải Huyền và hình ảnh hiến tế của ἀρνίον.
- source_word: ἡ εὐλογία
  choice: lời chúc tụng
  rationale: Trong lời tôn vinh, εὐλογία là sự chúc tụng được dâng lên. “Lời chúc tụng” tự nhiên và rõ hơn “phước lành” khi hướng về Đấng nhận lời thờ phượng.
- source_word: ἡ τιμή
  choice: sự tôn quý
  rationale: Diễn đạt lòng kính trọng và địa vị cao quý được quy về đối tượng trong công thức tôn vinh.
- source_word: ἡ δόξα
  choice: vinh quang
  rationale: Đây là cách tương đương quen thuộc và chính xác của δόξα trong ngữ cảnh thờ phượng.
- source_word: τὸ κράτος
  choice: quyền năng
  rationale: κράτος nhấn mạnh sức mạnh hữu hiệu hay quyền lực được biểu lộ. “Quyền năng” giữ được nghĩa này mà không buộc từ ngữ chỉ còn nghĩa cai trị.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: cho đến đời đời vô cùng
  rationale: Thành ngữ chỉ thời gian không chấm dứt. Cách nói tiếng Việt này trang trọng, dễ hiểu và giữ được sắc thái tăng cường của cụm từ Hy Lạp.
theological_decisions:
- issue: Lời tôn vinh chung hướng đến Đức Chúa Trời và Chiên Con
  choice: Giữ một lời tôn vinh duy nhất cùng hướng đến “Đấng ngự trên ngai và Chiên Con”.
  alternative: Tách thành hai lời tôn vinh hoặc thêm động từ riêng cho từng đối tượng.
  rationale: Bản Hy Lạp đặt hai đối tượng song song dưới cùng một lời quy tôn, không giải thích thêm. Bản dịch giữ nguyên cấu trúc và sức căng thần học ấy.
- issue: Phạm vi của κτίσμα trong cảnh toàn vũ trụ ca ngợi
  choice: Dịch là “mọi tạo vật”.
  alternative: “Toàn thể công trình tạo dựng” hoặc “mọi vật được tạo dựng”.
  rationale: Câu văn mô tả các tạo vật cất tiếng nói, nên cách dịch có tính cá thể phù hợp hơn, nhưng vẫn không giới hạn phạm vi bao quát của πᾶν.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp với cảnh thờ phượng. Dùng “Đấng ngự” và “Chiên Con” để giữ sắc thái tôn kính, nhưng tránh từ cổ khó hiểu. Bố cục xuống dòng làm nổi bật lời tôn vinh mà không thay đổi cú pháp hay nội dung nguồn.
