id: REV.5.12
reference: Revelation 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: vi
  text: 'Họ lớn tiếng nói: “Chiên Con, Đấng đã bị giết[a], xứng đáng nhận quyền năng, sự giàu có[b], sự khôn ngoan, sức mạnh[c], danh dự, vinh quang và lời chúc tụng!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã bị sát hại.” Từ Hy Lạp có thể được dịch mạnh hơn là “bị làm thịt” hoặc “bị giết như con vật hiến tế,” nhưng “đã bị giết” phù hợp với văn phong tung hô trang trọng ở đây.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “của cải.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “uy lực.” Bản dịch dùng “sức mạnh” để phân biệt từ này với “quyền năng” ở trước.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες φωνῇ μεγάλῃ
  choice: Họ lớn tiếng nói
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ hình ảnh cụ thể về tiếng nói lớn và sự liên kết với đoàn thể ở câu trước.
- source_word: Ἄξιόν ἐστιν
  choice: thật xứng đáng
  rationale: Giữ trọng tâm của lời tung hô về sự xứng đáng; từ “thật” tạo sắc thái trang trọng, mạnh mẽ mà không thêm nội dung thần học.
- source_word: τὸ ἀρνίον
  choice: Chiên Con
  rationale: Cách gọi quen thuộc và trang trọng cho tước hiệu mang tính Cơ Đốc học trong sách Khải Huyền; viết hoa để cho thấy đây là tước hiệu.
- source_word: τὸ ἐσφαγμένον
  choice: đã bị giết
  rationale: Phản ánh phân từ hoàn thành bị động, nêu cái chết đã xảy ra và còn có ý nghĩa trong hiện tại; tự nhiên hơn “đã bị sát hại” trong khung cảnh thờ phượng.
- source_word: λαβεῖν
  choice: nhận
  rationale: Phù hợp với việc Chiên Con được dâng quyền năng và sự tôn kính trong bài ca, đồng thời không áp đặt sắc thái chủ động mạnh của “lấy”.
- source_word: δύναμιν
  choice: quyền năng
  rationale: Cách dịch thông dụng trong văn cảnh Kinh Thánh và phân biệt được với ἰσχύς ở phần sau.
- source_word: πλοῦτον
  choice: sự giàu có
  rationale: Diễn đạt rõ nghĩa về sự phong phú và nguồn lực bằng tiếng Việt hiện đại.
- source_word: σοφίαν
  choice: sự khôn ngoan
  rationale: Cách dịch trực tiếp, tự nhiên và trang trọng.
- source_word: ἰσχὺν
  choice: sức mạnh
  rationale: Giữ sự phân biệt từ vựng với δύναμις, được dịch là “quyền năng”.
- source_word: τιμὴν
  choice: danh dự
  rationale: Thể hiện sự tôn trọng và địa vị được quy dâng cho Chiên Con.
- source_word: δόξαν
  choice: vinh quang
  rationale: Cách dịch chuẩn và thích hợp với văn cảnh thờ phượng.
- source_word: εὐλογίαν
  choice: lời chúc tụng
  rationale: Trong chuỗi tung hô này, từ ngữ chỉ lời ngợi khen, chúc tụng được quy dâng, chứ không chỉ một phước lành được ban xuống.
theological_decisions:
- issue: Tước hiệu Cơ Đốc học và cách viết hoa
  choice: Chiên Con
  alternative: chiên con
  rationale: Trong sách Khải Huyền, ἀρνίον được dùng như tước hiệu của Chúa Giê-xu; viết hoa biểu thị chức năng tước hiệu mà không thêm một xác quyết giáo phái.
- issue: Ngôn ngữ về cái chết của Chiên Con
  choice: đã bị giết
  alternative: đã bị sát hại
  rationale: Bản dịch giữ rõ cái chết bạo lực và mối liên hệ giữa cái chết ấy với sự xứng đáng của Chiên Con, nhưng không tự diễn giải cơ chế chuộc tội.
- issue: Ý nghĩa của λαβεῖν trong lời tung hô
  choice: nhận
  alternative: lấy
  rationale: “Nhận” phù hợp hơn với chuỗi những điều được toàn thể thọ tạo quy dâng cho Chiên Con, trong khi vẫn không giải thích quá mức bản chất của việc nhận ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp với một lời tung hô công khai. Câu tiếng Việt đưa chủ thể “Chiên Con đã bị giết” lên trước cụm “thật xứng đáng” để tự nhiên, dễ hiểu, trong khi vẫn duy trì trọng tâm tu từ vào sự xứng đáng và chuỗi bảy điều được quy dâng.
