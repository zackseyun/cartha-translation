id: REV.5.4
reference: Revelation 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: vi
  text: Và tôi khóc rất nhiều, vì không tìm thấy ai xứng đáng để mở cuộn sách hoặc nhìn vào nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhìn nó” hoặc “nhìn xem nó.” Động từ Hy Lạp có thể chỉ đơn giản là nhìn cuộn sách ấy; trong ngữ cảnh, nó cũng có thể hàm ý nhìn vào nội dung của cuộn sách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: Còn tôi thì
  rationale: Liên từ καί tiếp nối mạch kể, còn đại từ ἐγώ được nêu rõ để nhấn vào người đang trải nghiệm; “Còn tôi thì” diễn đạt tự nhiên sự chuyển trọng tâm ấy.
- source_word: ἔκλαιον
  choice: khóc
  rationale: Thì chưa hoàn thành chỉ hành động đang tiếp diễn trong quá khứ; trong tiếng Việt, ngữ cảnh kể chuyện cùng cụm “rất nhiều” truyền đạt đầy đủ tính kéo dài mà không cần thêm một trợ từ dễ làm nặng câu.
- source_word: πολύ
  choice: rất nhiều
  rationale: Dạng đối cách dùng như trạng từ nhấn mạnh mức độ khóc, không tự nó xác định là khóc lớn tiếng hay cay đắng.
- source_word: οὐδεὶς
  choice: không ai
  rationale: Cách diễn đạt tiếng Việt chuẩn, chỉ sự vắng mặt của bất kỳ người nào đáp ứng điều kiện.
- source_word: ἄξιος
  choice: xứng đáng
  rationale: Giữ được sức nặng về tư cách và địa vị trong khung cảnh ngai trời, thay vì làm phẳng nghĩa thành chỉ “đủ khả năng”.
- source_word: εὑρέθη
  choice: được thấy là
  rationale: Giữ thể bị động của động từ Hy Lạp và diễn đạt kết quả thẩm định, không bổ sung chủ thể thực hiện việc tìm xét.
- source_word: ἀνοῖξαι
  choice: mở
  rationale: Động từ nguyên mẫu nêu hành động mà một người phải xứng đáng để thực hiện.
- source_word: τὸ βιβλίον
  choice: cuộn sách
  rationale: Trong bối cảnh Khải Huyền 5, vật được mô tả phù hợp với cuộn sách cổ hơn là sách đóng gáy hiện đại.
- source_word: οὔτε βλέπειν αὐτό
  choice: hoặc nhìn vào đó
  rationale: οὔτε phối hợp hai hành động nằm dưới sự phủ định “không ai”; “nhìn vào đó” giữ được khả năng chỉ việc nhìn cuộn sách, đồng thời tự nhiên gợi đến nội dung bên trong mà không khẳng định quá mức.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu nguyên nhân khiến người kể khóc.
theological_decisions:
- issue: Sắc thái của ἄξιος trong khung cảnh ngai trời
  choice: xứng đáng
  alternative: đủ tư cách; đủ khả năng
  rationale: Bối cảnh liên quan đến sự xứng đáng trước Đức Chúa Trời để thực hiện mục đích được chứa trong cuộn sách, chứ không chỉ là năng lực thủ tục; bản dịch giữ sức nặng ấy mà không giải nghĩa thêm.
- issue: Hình thức của βιβλίον trong Khải Huyền 5
  choice: cuộn sách
  alternative: quyển sách
  rationale: Khung cảnh cổ đại và hành động mở vật này ủng hộ hình ảnh cuộn sách, nhưng nghĩa từ vựng rộng hơn được ghi nhận trong chú thích.
- issue: Phạm vi nghĩa của βλέπειν αὐτό
  choice: nhìn vào đó
  alternative: nhìn nó; nhìn xem nó
  rationale: Cụm Hy Lạp có thể chỉ đơn giản là nhìn vật ấy hoặc, theo ngữ cảnh, nhìn vào nội dung của cuộn sách. Cách dịch chính giữ sự tự nhiên và chú thích bảo tồn phương án nghĩa hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khóc rất nhiều” tránh thêm sắc thái “lớn tiếng” hoặc “cay đắng” vốn không được nói rõ. Chỉ dùng một chú thích vì “cuộn sách” là cách gọi tự nhiên và chính xác trong tiếng Việt đối với vật thể cổ đại này; phương án “quyển sách” đã được ghi nhận trong hồ sơ quyết định từ vựng.
