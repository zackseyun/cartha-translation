revisions:
- from: Khi Chiên Con lấy cuộn sách, bốn sinh vật và hai mươi bốn trưởng lão phủ phục trước Ngài. Mỗi vị đều cầm một cây đàn hạc[a] và những bát vàng đầy hương; hương ấy chính là những lời cầu nguyện của các thánh đồ.[b]
  to: Khi Chiên Con lấy cuộn sách, bốn sinh vật và hai mươi bốn trưởng lão phủ phục trước Ngài. Mỗi vị cầm một đàn hạc[a] và những bát vàng đầy hương; những bát ấy chính là những lời cầu nguyện của các thánh đồ.[b]
  rationale: Bản sửa giữ trật tự, hình ảnh, và sự đồng nhất trực tiếp của nguyên văn, nhưng điều chỉnh tiền ngữ của mệnh đề quan hệ để phù hợp với giống và số của αἵ. Không thêm cách giải thích thần học về biểu tượng, cũng không thu hẹp phạm vi của ἕκαστος vượt quá điều bản văn xác định.
