id: REV.5.8
reference: Revelation 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: vi
  text: Khi Chiên Con lấy cuộn sách, bốn sinh vật và hai mươi bốn trưởng lão phủ phục trước Ngài. Mỗi vị cầm một đàn hạc[a] và những bát vàng đầy hương; những bát ấy chính là những lời cầu nguyện của các thánh đồ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đàn lia.”
    reason: lexical_alternative
  - marker: b
    text: Hay “dân thánh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: cuộn sách
  rationale: Trong bối cảnh Khải Huyền, từ này chỉ văn bản cuộn thời cổ; “cuộn sách” vừa tự nhiên vừa giữ đúng hình ảnh của phân đoạn.
- source_word: ζῷα
  choice: sinh vật
  rationale: Chỉ các hữu thể sống trên trời quanh ngai, không mang sắc thái miệt thị của “thú vật”.
- source_word: πρεσβύτεροι
  choice: trưởng lão
  rationale: Cách gọi tự nhiên, trang trọng cho hai mươi bốn nhân vật trên trời, không áp đặt một chức vụ giáo hội về sau.
- source_word: ἔπεσαν ἐνώπιον τοῦ ἀρνίου
  choice: phủ phục trước Ngài
  rationale: “Phủ phục” diễn đạt hành động sấp mình trong sự tôn kính; “Ngài” tránh lặp nặng sau khi đã nêu rõ “Chiên Con” ở đầu câu.
- source_word: ἀρνίου
  choice: Chiên Con
  rationale: Giữ danh hiệu mang ý nghĩa Cơ Đốc học và sắc thái hiến tế đặc trưng trong Khải Huyền.
- source_word: ἔχοντες ἕκαστος
  choice: Mỗi vị đều cầm
  rationale: Giữ lực phân phối của ἕκαστος, đồng thời tách thành câu mới để tiếng Việt sáng rõ và tự nhiên.
- source_word: κιθάραν
  choice: một cây đàn hạc
  rationale: Đây là nhạc cụ dây; “đàn hạc” là cách gọi quen thuộc trong tiếng Việt, còn “đàn lia” được ghi ở chú thích như một khả năng kỹ thuật hơn.
- source_word: φιάλας χρυσᾶς
  choice: những bát vàng
  rationale: φιάλη là loại bát hoặc đồ đựng nông; “bát vàng” rõ nghĩa hơn những từ cổ như “bình” hay “chén” vốn có thể gợi hình dạng khác.
- source_word: γεμούσας θυμιαμάτων
  choice: đầy hương
  rationale: “Hương” trong ngữ cảnh thờ phượng chỉ hương đốt và chuyển tự nhiên danh từ số nhiều Hy Lạp sang danh từ khối trong tiếng Việt.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: hương ấy chính là những lời cầu nguyện của các thánh đồ
  rationale: Giữ nguyên sự đồng nhất trực tiếp của mệnh đề Hy Lạp, không làm yếu đi thành “tượng trưng cho”; “chính là” giúp quan hệ quy chiếu rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Sự đồng nhất mang tính biểu tượng giữa hương và lời cầu nguyện
  choice: “hương ấy chính là những lời cầu nguyện”
  alternative: “hương ấy tượng trưng cho những lời cầu nguyện”
  rationale: Bản Hy Lạp dùng mệnh đề đồng nhất trực tiếp αἵ εἰσιν. Bản dịch giữ cách nói mạnh của khải tượng thay vì diễn giải bản chất của biểu tượng.
- issue: Cách dịch ἅγιοι
  choice: các thánh đồ
  alternative: dân thánh
  rationale: “Các thánh đồ” là cách gọi quen thuộc đối với những người được biệt riêng cho Đức Chúa Trời, nhưng chú thích nêu “dân thánh” để tránh việc người đọc hiểu từ này chỉ nói đến một nhóm đã được phong thánh về sau.
- issue: Phạm vi của “mỗi vị”
  choice: Giữ cách diễn đạt phân phối áp dụng theo cấu trúc câu cho nhóm bốn sinh vật và hai mươi bốn trưởng lão
  alternative: Chỉ áp dụng rõ ràng cho hai mươi bốn trưởng lão
  rationale: Cú pháp Hy Lạp đặt ἔχοντες ἕκαστος sau cả hai nhóm chủ thể và không giới hạn minh nhiên vào riêng các trưởng lão; bản dịch không âm thầm thu hẹp phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu Hy Lạp dài được chia thành hai câu tiếng Việt để tránh nặng nề mà vẫn giữ trình tự của khải tượng. Các danh hiệu “Chiên Con” và “Ngài” được viết hoa nhất quán; dấu chấm phẩy làm rõ lời giải thích về hương.
