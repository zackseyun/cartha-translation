id: REV.5.1
reference: Revelation 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: vi
  text: Tôi thấy trong tay phải của Đấng ngồi trên ngai có một cuộn sách[a], được viết ở bên trong và ở mặt sau[b], được niêm phong bằng bảy ấn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một quyển sách”. Trong bối cảnh này, từ Hy Lạp βιβλίον nhiều khả năng chỉ một cuộn sách hơn là sách đóng quyển.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “được viết ở bên trong và ở mặt sau”. Một số bản dịch diễn đạt vế sau rộng hơn là “ở bên ngoài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: Tôi thấy
  rationale: Động từ aorist của ὁράω được diễn đạt tự nhiên bằng động từ kể chuyện ở quá khứ theo ngữ cảnh; tiếng Việt không cần đánh dấu thì bằng hình thái.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: trong tay phải
  rationale: Dù ἐπί với đối cách có thể mang nghĩa “trên”, trong hình ảnh này cụm từ diễn tả vật ở nơi nắm giữ hoặc sở hữu; “trong tay phải” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: của Đấng ngồi trên ngai
  rationale: Giữ cách mô tả bằng phân từ danh từ hóa của tiếng Hy Lạp, không đưa tên hay căn tính thần học cụ thể vào câu. “Đấng” tạo sắc thái trang trọng phù hợp mà vẫn là một danh xưng mô tả.
- source_word: βιβλίον
  choice: một cuộn sách
  rationale: Trong bối cảnh thế kỷ thứ nhất và hình ảnh vật được viết cả hai mặt rồi niêm phong, từ này nhiều khả năng chỉ một cuộn sách hơn là sách đóng quyển.
- source_word: γεγραμμένον
  choice: có chữ
  rationale: Phân từ hoàn thành bị động mô tả cuộn sách đang ở trạng thái đã được viết. “Có chữ” tự nhiên trong cấu trúc tiếng Việt và kết hợp rõ với hai bề mặt được nêu.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: bên trong và mặt sau đều
  rationale: “Bên trong” diễn đạt ἔσωθεν; “mặt sau” giữ hình ảnh cụ thể của ὄπισθεν thay vì khái quát thành “bên ngoài”. Từ “đều” làm rõ rằng cả hai mặt đều có chữ mà không thêm nội dung.
- source_word: κατεσφραγισμένον
  choice: được niêm phong
  rationale: Diễn đạt trạng thái hoàn tất của phân từ hoàn thành bị động một cách tự nhiên; không cần tách riêng sắc thái tăng cường của tiền tố κατα-.
- source_word: σφραγῖσιν ἑπτά
  choice: bằng bảy ấn
  rationale: Giới từ “bằng” thể hiện cách dùng công cụ của tặng cách; “ấn” là từ trang trọng, quen thuộc cho vật hoặc dấu dùng để niêm phong.
theological_decisions:
- issue: Cách gọi nhân vật ngồi trên ngai
  choice: Đấng ngồi trên ngai
  alternative: vị ngồi trên ngai; người ngồi trên ngai
  rationale: Nguyên văn chỉ mô tả nhân vật chứ không nêu danh tính trực tiếp. Bản dịch giữ cách trình bày ấy, không thêm danh xưng thần học cụ thể; “Đấng” duy trì văn phong trang trọng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu theo nhịp kể khải tượng; dùng “cuộn sách”, “ngai”, “niêm phong” và “ấn” để giữ hình ảnh cổ đại mà không trở nên khó hiểu. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
