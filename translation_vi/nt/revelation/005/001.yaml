  to: Tôi thấy trong tay phải của Đấng ngồi trên ngai có một cuộn sách[a], được viết ở bên trong và ở mặt sau[b], được niêm phong bằng bảy ấn.
  rationale: Sửa nhẹ để phản ánh trực tiếp hơn phân từ γεγραμμένον (“được viết”) và hai trạng ngữ vị trí ἔσωθεν καὶ ὄπισθεν (“ở bên trong và ở mặt sau”). Không xác định thêm căn tính của nhân vật trên ngai, không thay đổi hình ảnh cuộn sách hay ý nghĩa của bảy ấn. Các ký hiệu chú thích vẫn được đặt trong chính văn và khớp với bộ chú thích.
  reviewer_model: gpt-5.6-terra
