  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: Giăng thấy một cuộn sách ở trong tay phải của nhân vật ngồi trên ngai, cuộn sách có chữ ở hai phía và được niêm phong bằng bảy ấn. Tuy nhiên, “bên trong và mặt sau đều có chữ” diễn đạt γεγραμμένον gián tiếp hơn và có thể làm “bên trong” được hiểu là phía bên trong vật chứa. Cách nói trực tiếp “được viết ở bên trong và ở mặt sau” bám sát cấu trúc và hình ảnh của nguyên văn hơn.'
