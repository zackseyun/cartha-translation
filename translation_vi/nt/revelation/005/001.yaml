  terminology: “Đấng ngồi trên ngai,” “cuộn sách,” “niêm phong,” và “bảy ấn” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Cuộn sách” phản ánh đúng xác suất ngữ cảnh của βιβλίον mà không loại trừ phương án “quyển sách” trong chú thích.
