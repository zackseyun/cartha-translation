id: REV.5.6
reference: Revelation 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: vi
  text: Tôi thấy giữa ngai và bốn sinh vật, giữa các trưởng lão, có một Chiên Con đang đứng, trông như đã bị giết[a]. Chiên Con có bảy sừng và bảy mắt; bảy mắt ấy là bảy Thần của Đức Chúa Trời[b], được sai đi khắp đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “như đã bị sát tế” hoặc “như thể đã bị giết.”'
    reason: lexical_alternative
  - marker: b
    text: Bản văn viết “bảy Thần của Đức Chúa Trời”; một số người hiểu đây là cách nói biểu tượng về Đức Thánh Linh trong sự viên mãn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: giữa ... giữa
  rationale: Giữ lại sự lặp lại trong cách định vị của nguyên văn, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ζῴων
  choice: sinh vật
  rationale: Trong bối cảnh phòng ngai của sách Khải Huyền, từ này chỉ các hữu thể sống đặc biệt, không phải thú vật thông thường.
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Đây là danh xưng của một nhóm trong khải tượng thiên thượng, không chỉ nói chung về người cao tuổi.
- source_word: ἀρνίον
  choice: Chiên Con
  rationale: Giữ hình ảnh hiến tế và Đấng Mê-si quen thuộc, với cách viết hoa để chỉ nhân vật mang tước hiệu trong ngữ cảnh.
- source_word: ἑστηκὸς
  choice: đang đứng
  rationale: Diễn tả trạng thái đứng hiện hữu của Chiên Con một cách rõ ràng và tự nhiên.
- source_word: ὡς ἐσφαγμένον
  choice: trông như đã bị giết
  rationale: “Trông như” giữ sắc thái so sánh hoặc dáng vẻ của ὡς; “đã bị giết” thể hiện hành động hoàn tất và thể bị động mà không làm mất nghịch lý Chiên Con sống nhưng mang dấu vết bị giết.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: có bảy sừng và bảy mắt
  rationale: Giữ nguyên các hình ảnh khải huyền thay vì diễn giải ý nghĩa biểu tượng ngay trong bản văn.
- source_word: οἵ εἰσιν
  choice: bảy mắt ấy là
  rationale: Làm rõ trong tiếng Việt rằng mệnh đề quan hệ nối tự nhiên với danh từ gần nhất là “bảy mắt”, đồng thời không thêm cách giải nghĩa ngoài văn bản.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: bảy Thần của Đức Chúa Trời
  rationale: Giữ nguyên hình thức số nhiều và sự căng thẳng thần học của nguyên văn, không diễn giải thành “Thánh Linh bảy phương diện” hay một công thức giáo lý khác.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: được sai đi khắp đất
  rationale: Giữ thể bị động và số nhiều của phân từ, đồng thời dùng cách nói tiếng Việt gọn, tự nhiên.
theological_decisions:
- issue: Đối tượng của mệnh đề “là bảy Thần của Đức Chúa Trời”
  choice: Hiểu mệnh đề này trực tiếp xác định bảy mắt của Chiên Con.
  alternative: Có thể hiểu rộng hơn là cùng chỉ cả bảy sừng lẫn bảy mắt.
  rationale: “Bảy mắt” là tiền ngữ gần nhất và phù hợp nhất với hình ảnh liên văn bản; bản dịch làm rõ liên kết này nhưng không diễn giải thêm ý nghĩa biểu tượng.
- issue: Cách dịch “bảy Thần của Đức Chúa Trời”
  choice: Giữ nguyên cách nói số nhiều “bảy Thần của Đức Chúa Trời”.
  alternative: “Thần của Đức Chúa Trời trong sự viên mãn gấp bảy” hoặc “Đức Thánh Linh trong sự viên mãn.”
  rationale: Nguyên văn dùng số nhiều và cách diễn đạt này còn được hiểu theo nhiều hướng. Bản dịch không nên âm thầm đồng nhất hoặc giải quyết hình ảnh bằng một cách diễn giải giáo lý.
- issue: Nghịch lý Chiên Con đứng nhưng đã bị giết
  choice: Dịch “đang đứng, trông như đã bị giết”.
  alternative: “đứng như bị sát tế” hoặc “đứng như thể đã bị giết”.
  rationale: Cách dịch giữ đồng thời trạng thái đang sống và dấu hiệu của cái chết đã xảy ra, không làm phẳng nghịch lý thần học của khải tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chiên Con” theo hình ảnh Kinh Thánh quen thuộc; giữ “bảy Thần” thay vì diễn giải giáo lý. Dấu chấm tách hai cụm mô tả để câu tiếng Việt rõ hơn mà vẫn bảo toàn cấu trúc và tiến trình của khải tượng.
