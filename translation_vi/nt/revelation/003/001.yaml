revisions:
- from: '“Hãy viết cho thiên sứ[a] của hội thánh tại Sạt-đe rằng: ‘Đấng có bảy thần linh của Đức Chúa Trời[b] và bảy ngôi sao phán thế này: Ta biết các việc con làm. Con mang tiếng là đang sống[c], nhưng thật ra con đã chết.’”'
  to: '“Hãy viết cho thiên sứ[a] của hội thánh tại Sạt-đe rằng: ‘Đấng có bảy thần linh của Đức Chúa Trời[b] và bảy ngôi sao phán thế này: Ta biết các việc làm của con; con có tiếng là sống[c], nhưng con đã chết.’”'
  rationale: Bản sửa loại bỏ sắc thái không cần thiết của “mang tiếng” và “thật ra,” dùng cách diễn đạt trung tính, tự nhiên hơn cho ὄνομα ἔχεις ὅτι ζῇς, đồng thời giữ nguyên tính mơ hồ thần học của “bảy thần linh” và sức mạnh của phán quyết “con đã chết.” Các ký hiệu chú thích vẫn gắn đúng các cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:22:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung theo sát nguyên văn: giữ “thiên sứ,” số nhiều trong “bảy thần linh,” bảy ngôi sao, và hình ảnh sống/chết. Tuy nhiên, “thật ra” thêm một sắc thái giải thích không có trực tiếp trong nguyên văn; “mang tiếng là” thường hàm ý tiếng xấu hoặc lời đồn không đáng có, không trung tính bằng ý ὄνομα ἔχεις; và “các việc con làm” có thể chỉnh thành “các việc làm của con” để phản ánh τὰ ἔργα rõ hơn.'
  naturalness: Cấu trúc câu trang trọng và dễ hiểu. “Con có tiếng là sống” tự nhiên hơn “con mang tiếng là đang sống” và giữ đúng ý có danh tiếng/tiếng tăm. Dùng dấu chấm phẩy trước mệnh đề đối lập giúp câu rõ nhịp hơn.
  terminology: Giữ “hội thánh,” “thiên sứ,” “Đức Chúa Trời,” và “Ta—con” phù hợp văn phong Cơ Đốc giáo Việt ngữ trang trọng. “Bảy thần linh của Đức Chúa Trời” giữ được số nhiều của πνεύματα mà không áp đặt cách giải thích. Chú thích cần diễn đạt sát nghĩa và trung tính hơn.
  issues:
  - severity: medium
    issue: “Con mang tiếng là đang sống” không truyền đạt tối ưu ὄνομα ἔχεις ὅτι ζῇς.
    rationale: “Mang tiếng” trong tiếng Việt hiện đại thường nghiêng về tai tiếng hoặc một tiếng xấu; cụm Hy Lạp nói đến danh tiếng/tiếng tăm là đang sống. “Có tiếng là sống” tự nhiên và trung tính hơn.
  - severity: low
    issue: “Thật ra” là phần giải thích thêm.
    rationale: Sự đối lập đã được thể hiện đầy đủ bằng “nhưng”; nguyên văn không có từ tương đương với “thật ra.”
  - severity: low
    issue: 'Chú thích c dùng cách nói sát chữ chưa tự nhiên: “con có một cái tên rằng con sống.”'
    rationale: Nên nêu sát nghĩa bằng “con có danh tiếng là con sống,” rồi giải thích đây là tiếng tăm hoặc sự nhìn nhận công khai.
