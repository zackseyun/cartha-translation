id: REV.3.1
reference: Revelation 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: vi
  text: '“Hãy viết cho thiên sứ[a] của hội thánh tại Sạt-đe rằng: ‘Đấng có bảy thần linh của Đức Chúa Trời[b] và bảy ngôi sao phán thế này: Ta biết các việc làm của con; con có tiếng là sống[c], nhưng con đã chết.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ giả”; từ Hy Lạp ἄγγελος có thể chỉ thiên sứ hoặc sứ giả.
    reason: alternative_reading
  - marker: b
    text: Cụm từ “bảy thần linh của Đức Chúa Trời” được giữ theo nguyên văn. Cụm từ này có thể tượng trưng cho sự viên mãn của Thánh Linh, nhưng cũng có người hiểu là bảy linh thể thiên giới.
    reason: alternative_reading
  - marker: c
    text: 'Sát nghĩa: “con có danh tiếng là con sống”; ở đây chỉ tiếng tăm hoặc sự nhìn nhận rằng con đang sống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Giữ nghĩa thông dụng trong bối cảnh khải huyền; từ Hy Lạp cũng có thể chỉ sứ giả nên ghi chú phương án này.
- source_word: ἐκκλησίας
  choice: hội thánh
  rationale: Cách gọi quen thuộc, tự nhiên đối với cộng đồng tín hữu Cơ Đốc tại Sạt-đe.
- source_word: Τάδε λέγει
  choice: phán thế này
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái công thức tuyên phán mang tính tiên tri.
- source_word: ὁ ἔχων
  choice: Đấng có
  rationale: Giữ cấu trúc chỉ một nhân vật được xác định bằng điều mình sở hữu và phù hợp với văn phong trang trọng.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: bảy thần linh của Đức Chúa Trời
  rationale: Giữ nguyên hình thức số nhiều của tiếng Hy Lạp, không tự quyết định ý nghĩa biểu tượng đang được tranh luận.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: bảy ngôi sao
  rationale: Bản dịch trực tiếp, rõ nghĩa, không đưa lời giải biểu tượng từ chỗ khác vào câu này.
- source_word: Οἶδά
  choice: Ta biết
  rationale: Cách diễn đạt ngắn gọn, tự nhiên và phù hợp với lời của Đấng Christ trong ngữ cảnh.
- source_word: τὰ ἔργα
  choice: các việc con làm
  rationale: Tự nhiên hơn 'các công việc của con' trong tiếng Việt và truyền đạt rõ ý nghĩa hành động, việc làm.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: con mang tiếng là đang sống
  rationale: Thành ngữ 'mang tiếng là' chuyển tải ý có danh tiếng hoặc tiếng tăm rằng mình sống, đồng thời giữ sắc thái bề ngoài đối lập với thực trạng.
- source_word: νεκρὸς εἶ
  choice: thật ra con đã chết
  rationale: Giữ lời phán trực tiếp, mạnh mẽ; 'thật ra' làm rõ sự tương phản do καί mang sắc thái đối nghịch trong ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của 'bảy thần linh của Đức Chúa Trời'
  choice: Giữ cụm từ số nhiều theo nguyên văn trong chính văn.
  alternative: Diễn giải là Thánh Linh trong sự viên mãn gấp bảy, hoặc là bảy linh thể thiên giới.
  rationale: Nguyên văn dùng số nhiều và không giải thích biểu tượng ngay tại đây; bản dịch không nên giải quyết một vấn đề thần học còn để ngỏ.
- issue: Đối tượng được gọi là ἀγγέλῳ
  choice: Dịch là 'thiên sứ'.
  alternative: Sứ giả hoặc người đại diện của hội thánh.
  rationale: Bối cảnh khải huyền ủng hộ nghĩa 'thiên sứ', nhưng nghĩa 'sứ giả' vẫn có thể có về mặt từ vựng nên được giữ trong chú thích.
- issue: Tình trạng 'sống' và 'chết'
  choice: Giữ nguyên hình ảnh sống/chết mà không thêm từ 'thuộc linh'.
  alternative: Diễn giải là sống hoặc chết về phương diện thuộc linh.
  rationale: Nguyên văn đưa ra phán quyết bằng ẩn dụ nhưng không nêu rõ phương diện; thêm 'thuộc linh' sẽ thu hẹp cách hiểu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cặp đại từ 'Ta—con' cho lời Đấng Christ phán với đối tượng đại diện của hội thánh. Dấu câu và lời dẫn được sắp xếp tự nhiên trong tiếng Việt, trong khi công thức tiên tri và sự tương phản gay gắt của nguyên văn vẫn được giữ.
