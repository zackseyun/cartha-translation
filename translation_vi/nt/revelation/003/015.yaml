id: REV.3.15
reference: Revelation 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: vi
  text: 'Ta biết các việc làm của ngươi: ngươi không lạnh cũng không nóng. Phải chi ngươi lạnh hoặc nóng![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ước gì ngươi lạnh hoặc nóng!”'
    reason: Cách dịch khác của ὄφελον, vẫn giữ sắc thái ước muốn mạnh mẽ.
lexical_decisions:
- source_word: Οἶδά
  choice: Ta biết
  rationale: οἶδα có nghĩa trạng thái ở hiện tại; “biết” diễn đạt trực tiếp giọng đánh giá. “Ta” phù hợp với lời phán trang trọng của Đấng Christ.
- source_word: σου τὰ ἔργα
  choice: các việc làm của ngươi
  rationale: Giữ danh từ ἔργα và công thức đánh giá quen thuộc trong Khải Huyền, thay vì diễn giải thành “những gì ngươi làm”.
- source_word: ψυχρὸς
  choice: lạnh
  rationale: Giữ nguyên hình ảnh nhiệt độ và sự đối lập trực tiếp với ζεστός, không giải nghĩa ẩn dụ ngay trong bản văn.
- source_word: ζεστός
  choice: nóng
  rationale: “Nóng” là từ đối lập tự nhiên với “lạnh” trong tiếng Việt và không áp đặt nghĩa diễn giải như “sốt sắng”.
- source_word: ὄφελον
  choice: Phải chi
  rationale: Diễn đạt một ước muốn trái với thực trạng hiện tại bằng lối nói tự nhiên, giàu sức biểu cảm trong tiếng Việt hiện đại.
- source_word: ἢ
  choice: hoặc
  rationale: Thể hiện phép lựa chọn đơn giản giữa hai trạng thái.
theological_decisions:
- issue: Ý nghĩa của ẩn dụ nhiệt độ “lạnh” và “nóng”
  choice: Giữ nguyên ẩn dụ theo nghĩa đen trong chính văn, không xác định “lạnh” là chống đối hoặc vô tín và “nóng” là sốt sắng.
  alternative: Có thể hiểu “lạnh” là nguội lạnh/vô tín và “nóng” là sốt sắng; hoặc hiểu cả nước lạnh lẫn nước nóng đều hữu ích theo những cách khác nhau.
  rationale: Câu này không tự giải mã hình ảnh. Giữ các từ chỉ nhiệt độ bảo toàn sự mơ hồ có thật và tránh đưa một cách giải thích thần học cụ thể vào bản dịch.
translation_notes:
  register: Văn phong trực tiếp, trang trọng và dễ hiểu. Cặp đại từ “Ta–ngươi” duy trì sắc thái lời phán có thẩm quyền; “phải chi” là cách nói hiện đại, tự nhiên hơn lối cổ “chớ gì”.
source_grounding:
  english_pob_role: consult_only
