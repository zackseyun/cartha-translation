id: REV.3.14
reference: Revelation 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: vi
  text: 'Hãy viết cho thiên sứ của hội thánh tại Lao-đi-xê[a]: “Đấng A-men, Chứng Nhân thành tín và chân thật, là Khởi Đầu của sự sáng tạo của Đức Chúa Trời[b], phán thế này:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sứ giả của hội thánh tại Lao-đi-xê.”
    reason: lexical_alternative
  - marker: b
    text: Hay “Nguồn Gốc của sự sáng tạo của Đức Chúa Trời” hoặc “Đấng Cai Trị sự sáng tạo của Đức Chúa Trời.” Từ Hy Lạp archē có thể có nghĩa là “khởi đầu,” “nguồn gốc” hoặc “người cai trị.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Từ này có thể chỉ thiên sứ trên trời hoặc sứ giả con người. Trong công thức lặp lại khi gửi lời cho bảy hội thánh trong sách Khải Huyền, “thiên sứ” là cách dịch tự nhiên và quen thuộc hơn; nghĩa “sứ giả” vẫn được ghi ở chú thích.
- source_word: Τάδε λέγει
  choice: Đây là lời … phán
  rationale: Cách diễn đạt này chuyển tải tự nhiên công thức tuyên cáo mang tính tiên tri, đồng thời giữ giọng trang trọng của nguyên văn.
- source_word: ὁ Ἀμήν
  choice: Đấng A-men
  rationale: Giữ nguyên “A-men” như một tước hiệu đặc biệt, bảo toàn âm hưởng Hê-bơ-rơ về sự chắc chắn và chân thật thay vì diễn giải tước hiệu ngay trong chính văn.
- source_word: μάρτυς
  choice: Chứng Nhân
  rationale: “Chứng nhân” diễn đạt rõ cả ý làm chứng và tư cách của Đấng làm chứng trong ngữ cảnh mặc khải.
- source_word: πιστὸς
  choice: thành tín
  rationale: “Thành tín” giữ sắc thái trung thành và hoàn toàn đáng tin cậy, phù hợp với tước hiệu dành cho Đấng Christ.
- source_word: ἀληθινός
  choice: chân thật
  rationale: “Chân thật” kết hợp tự nhiên với “thành tín” và diễn đạt điều thật, xác thực, tương ứng trọn vẹn với thực tại.
- source_word: ἀρχὴ
  choice: Khởi Đầu
  rationale: Đây là cách dịch trực tiếp, cho phép giữ lại sức căng ngữ nghĩa và thần học của từ Hy Lạp, vốn cũng có thể mang nghĩa nguồn gốc hoặc quyền cai trị.
- source_word: κτίσεως
  choice: công trình sáng tạo
  rationale: Cụm từ này tự nhiên trong tiếng Việt và có thể chỉ toàn thể công trình tạo dựng của Đức Chúa Trời mà không thêm một kết luận thần học vào chính văn.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách Hy Lạp bằng một kết cấu sở hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ khi được dùng làm tước hiệu về Đấng Christ
  choice: Khởi Đầu của công trình sáng tạo của Đức Chúa Trời
  alternative: Nguồn Gốc của công trình sáng tạo của Đức Chúa Trời; hoặc Đấng Cai Trị công trình sáng tạo của Đức Chúa Trời
  rationale: ἀρχή có phạm vi nghĩa gồm khởi đầu, nguồn gốc và quyền cai trị. Chính văn giữ cách dịch trực tiếp “Khởi Đầu” để không âm thầm giải quyết một vấn đề thần học gây tranh luận; chú thích nêu các khả năng từ vựng khác để người đọc thấy rõ sự mơ hồ thực sự của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Các tước hiệu được viết hoa để làm rõ chức năng danh xưng; “A-men” được giữ dưới dạng phiên âm quen thuộc. Câu kết bằng dấu hai chấm vì đây là phần mở đầu cho lời phán tiếp theo.
