    rationale: «Đây là lời Đấng A-men phán» không sai, nhưng «Đấng A-men ... phán thế này» tự nhiên hơn và phản ánh trực tiếp hơn Τάδε λέγει.
  - severity: medium
    issue: «công trình sáng tạo» cho κτίσεως
    rationale: Cụm này có thể được hiểu là công việc/hành động sáng tạo; «sự sáng tạo» là cách chuyển trực tiếp hơn cho danh từ κτίσις và không bổ sung sắc thái diễn giải.
