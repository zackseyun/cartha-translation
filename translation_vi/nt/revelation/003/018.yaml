- from: Ta khuyên con hãy mua từ Ta vàng đã được tinh luyện trong lửa[a], để con trở nên giàu có; áo trắng[b] để mặc vào, hầu sự xấu hổ vì con trần truồng không bị phơi bày; và thuốc xức mắt[c] để xức lên mắt con, hầu con nhìn thấy.
