id: REV.3.18
reference: Revelation 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: vi
  text: Ta khuyên con hãy mua nơi Ta vàng đã được tinh luyện trong lửa[a], để con trở nên giàu có; mua áo trắng[b] để con mặc vào, hầu sự xấu hổ về tình trạng trần truồng của con không bị phơi bày; và mua thuốc xức mắt[c] để xức lên mắt con, hầu con nhìn thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được làm cho tinh sạch bằng lửa” hoặc “đã được thử nghiệm trong lửa.”'
    reason: lexical_alternative
  - marker: b
    text: “Áo” ở đây là từ chỉ y phục nói chung; tùy văn cảnh cũng có thể hiểu là “áo choàng.”
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp chỉ một chế phẩm làm thuốc để xức lên mắt.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: Ta khuyên con
  rationale: Diễn đạt lời khuyên có thẩm quyền nhưng không biến thành mệnh lệnh; đại từ Ta–con phù hợp với lời Đấng Christ trực tiếp phán với người được đại diện hóa ở số ít.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: hãy mua từ Ta
  rationale: Giữ nguyên ẩn dụ mua bán và ý nghĩa nguồn cung của παρά với sở hữu cách.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: vàng đã được tinh luyện trong lửa
  rationale: Phân từ hoàn thành bị động chỉ vàng ở trạng thái đã trải qua lửa; cách nói này giữ hình ảnh luyện kim tự nhiên trong tiếng Việt.
- source_word: ἵνα πλουτήσῃς
  choice: để con trở nên giàu có
  rationale: “Trở nên” thể hiện sắc thái bước vào tình trạng giàu có của động từ ở thể aorist.
- source_word: ἱμάτια λευκά
  choice: áo trắng
  rationale: “Áo” là cách gọi rộng, tự nhiên cho y phục trong tiếng Việt và không thu hẹp thành một loại lễ phục cụ thể.
- source_word: ἵνα περιβάλῃ
  choice: để mặc vào
  rationale: Diễn đạt tự nhiên hành động mặc y phục, đồng thời phản ánh sắc thái trung động mà không tạo câu gượng.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: hầu sự xấu hổ vì con trần truồng không bị phơi bày
  rationale: “Bị phơi bày” phù hợp với thể bị động và ngữ cảnh trần truồng; “vì con trần truồng” chuyển quan hệ sở hữu cách thành tiếng Việt tự nhiên.
- source_word: κολλούριον
  choice: thuốc xức mắt
  rationale: Chỉ chế phẩm dùng cho mắt; cách gọi này rõ nghĩa, phổ thông và tránh thuật ngữ chuyên môn xa lạ.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: để xức lên mắt con
  rationale: “Xức lên” giữ ý bôi thuốc bằng cách xoa/xức nhưng không hàm ý một nghi thức bí tích.
- source_word: ἵνα βλέπῃς
  choice: hầu con nhìn thấy
  rationale: Giữ mục đích được nêu trong bản Hy Lạp và không giải thích thêm đối tượng hay bản chất của sự thấy.
theological_decisions:
- issue: Ý nghĩa biểu tượng của vàng, áo trắng và thuốc xức mắt
  choice: Giữ nguyên ba hình ảnh cụ thể trong chính văn, không chú giải các sở chỉ thuộc linh.
  alternative: Diễn giải chúng ngay trong câu là sự giàu có thuộc linh, sự công chính hoặc thanh sạch, và khả năng nhận biết thuộc linh.
  rationale: Câu Hy Lạp trình bày hình ảnh nhưng không giải nghĩa tường minh từng biểu tượng; bản dịch cần bảo toàn tính gợi mở và sức căng thần học.
- issue: Sắc thái của ἐγχρῖσαι
  choice: Dịch là “xức lên” theo hành động bôi thuốc.
  alternative: Dùng “xức dầu” với sắc thái nghi lễ, hoặc chỉ dùng “bôi” để loại bỏ mọi âm hưởng biểu tượng.
  rationale: Động từ chỉ việc xoa/xức một chất lên bề mặt. “Xức lên” trung thành với hành động trong văn cảnh y dược mà không áp đặt ý nghĩa bí tích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “Ta–con” để thể hiện lời phán trực tiếp có thẩm quyền; giữ người nghe ở số ít như bản Hy Lạp. Dấu chấm phẩy làm rõ ba món được khuyên mua mà không phá vỡ cấu trúc câu.
