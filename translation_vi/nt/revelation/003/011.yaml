  - severity: low
    issue: “đang có” thêm một sắc thái diễn tiến không được biểu thị riêng trong ὃ ἔχεις.
    rationale: Sự thêm này không làm sai nghĩa đáng kể, nhưng “điều con có” sát và gọn hơn.
