source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: vi
  text: Ta sắp đến[a]. Hãy giữ vững điều con có, để không ai lấy vòng hoa của con[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đến nhanh chóng.” Trạng từ Hy Lạp có thể nhấn mạnh thời điểm gần hoặc hành động mau chóng.'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp chỉ vòng hoa hoặc miện dành cho người chiến thắng hay để tôn vinh, không đặc biệt chỉ vương miện của vua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Ta sắp đến
  rationale: Thì hiện tại mang sắc thái một cuộc đến đang cận kề; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được ý hướng tương lai gần.
- source_word: ταχύ
  choice: sắp
  rationale: Trạng từ có thể chỉ thời điểm gần ('sớm, chẳng bao lâu nữa') hoặc tốc độ hành động ('nhanh chóng'). Trong lời cảnh tỉnh này, 'sắp' diễn đạt tự nhiên sắc thái cận kề, còn nghĩa kia được giữ trong chú thích.
- source_word: κράτει
  choice: Hãy giữ vững
  rationale: Mệnh lệnh của κρατέω đòi hỏi tiếp tục nắm giữ cách kiên định; 'giữ vững' vừa rõ nghĩa vừa có sức thúc giục.
- source_word: ὃ ἔχεις
  choice: điều con đang có
  rationale: Giữ đối tượng không xác định như nguyên văn, để văn cảnh xác định nội dung thay vì diễn giải thêm.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả được nhắm đến.
- source_word: μηδεὶς
  choice: không ai
  rationale: Cách tương đương trung tính và thông dụng của đại từ phủ định.
- source_word: λάβῃ
  choice: lấy mất
  rationale: Động từ trong mệnh đề mục đích phủ định nói về kết quả cần ngăn ngừa; 'lấy mất' tự nhiên hơn 'lấy' đơn thuần và không mạnh quá mức như 'cướp đoạt'.
- source_word: στέφανόν
  choice: mão triều thiên
  rationale: στέφανος là vòng miện trao cho người chiến thắng hoặc để tôn vinh, không nhất thiết là vương miện hoàng gia. 'Mão triều thiên' là cách gọi Kinh Thánh trang trọng, dễ nhận biết; chú thích làm rõ sắc thái.
theological_decisions:
- issue: Sắc thái của ταχύ trong lời hứa Đấng Christ đến
  choice: sắp
  alternative: nhanh chóng
  rationale: Nguyên ngữ có thể nhấn mạnh sự gần kề về thời gian hoặc sự mau chóng của hành động. Bản chính chọn 'sắp' theo mạch cảnh tỉnh về cuộc đến cận kề, nhưng giữ cách hiểu kia trong chú thích để không xóa bỏ sự đa nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và trực tiếp. Đại từ 'Ta—con' phù hợp lời Đấng Christ phán với thiên sứ/hội thánh trong văn cảnh. Câu ngắn giữ nhịp cảnh tỉnh của nguyên văn.
