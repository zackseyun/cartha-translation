  source_fidelity: 'Bản dịch giữ đúng cấu trúc và ý chính của Hy Lạp: lời đến cận kề, mệnh lệnh kiên trì giữ điều đang có, và mục đích ngăn người khác lấy phần thưởng. Tuy nhiên, “mão triều thiên” gợi rõ vương quyền và lại không phù hợp với sắc thái không-hoàng-gia của στέφανος.'
  naturalness: “Ta sắp đến” và “Hãy giữ vững...” tự nhiên, trang trọng, phù hợp văn phong hiện đại. “Điều con có” gọn hơn “điều con đang có” mà vẫn sát nguyên văn. “Vòng hoa” là cách diễn đạt hiện đại, dễ hiểu hơn “mão triều thiên”; chú thích làm rõ đây là vòng hoa/miện vinh dự hay chiến thắng.
  terminology: στέφανος cần được phân biệt với vương miện hoàng gia/διάδημα. Thay “mão triều thiên” bằng “vòng hoa” tránh gán ý vương quyền vào từ nguồn; chú thích bảo lưu sắc thái phần thưởng vinh dự hoặc chiến thắng.
  issues:
