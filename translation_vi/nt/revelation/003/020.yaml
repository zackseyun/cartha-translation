id: REV.3.20
reference: Revelation 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: vi
  text: Này[a], Ta đứng ngoài cửa và gõ. Nếu ai nghe tiếng Ta và mở cửa, Ta sẽ vào với người ấy[b] và dùng bữa với người ấy[c], người ấy cũng sẽ dùng bữa với Ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kìa, Ta đã đứng ngoài cửa và đang gõ.” Động từ “đứng” trong tiếng Hy Lạp ở dạng hoàn thành nhưng mang ý nghĩa trạng thái hiện tại, còn “gõ” ở thì hiện tại; cả hai nhấn mạnh tư thế và hành động đang tiếp diễn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta sẽ vào gặp người ấy.” Cách diễn đạt Hy Lạp hướng hành động vào chính người ấy, chứ không chỉ việc đi vào một địa điểm.'
    reason: lexical_alternative
  - marker: c
    text: Hình ảnh dùng bữa diễn tả sự hiệp thông thân mật và tương hỗ. Có cách hiểu đây là sự ám chỉ Tiệc Thánh, sự hoán cải, hoặc sự phục hồi mối tương giao; chính câu này không nói rõ phải giới hạn vào cách hiểu nào.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Tiểu từ gây chú ý được chuyển bằng cách nói ngắn gọn, trang trọng và tự nhiên trong tiếng Việt; tránh sắc thái thị giác quá cụ thể của “Hãy nhìn”.
- source_word: ἕστηκα
  choice: Ta đứng
  rationale: Dạng hoàn thành của ἵστημι mang lực trạng thái hiện tại, chỉ tư thế đang được duy trì; “Ta đứng” diễn đạt tự nhiên mà không biến thành hành động quá khứ.
- source_word: ἐπὶ τὴν θύραν
  choice: ngoài cửa
  rationale: Trong ngữ cảnh một người gõ để được mở cửa, tiếng Việt tự nhiên nói “đứng ngoài cửa”; cách dịch này làm rõ vị trí hàm ẩn mà không đổi hình ảnh cửa.
- source_word: κρούω
  choice: gõ
  rationale: Thì hiện tại diễn tả hành động đang tiếp diễn song song với việc đứng; “gõ” là cách diễn đạt gọn và tự nhiên.
- source_word: ἐάν τις
  choice: Nếu ai
  rationale: Giữ nguyên tính bất định và bao quát của điều kiện, không hàm ý giới tính.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: nghe tiếng Ta
  rationale: φωνή ở đây là tiếng nói/giọng của người đang gọi; “nghe tiếng Ta” tự nhiên hơn “nghe giọng Ta” trong văn cảnh này và không tự thêm ý vâng lời.
- source_word: ἀνοίξῃ τὴν θύραν
  choice: mở cửa
  rationale: Cách chuyển trực tiếp và tự nhiên của hành động trong mệnh đề điều kiện.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: Ta sẽ vào với người ấy
  rationale: “Vào” phản ánh εἰσελεύσομαι, còn “với người ấy” giữ hướng quy chiếu mang tính cá nhân của πρὸς αὐτόν, thay vì chỉ nói vào một nơi.
- source_word: δειπνήσω
  choice: dùng bữa
  rationale: δειπνέω chỉ việc ăn bữa chính, thường là bữa tối. “Dùng bữa” trang trọng, phổ thông và không thu hẹp hình ảnh theo một tập quán bữa ăn cụ thể.
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: với người ấy, người ấy cũng sẽ dùng bữa với Ta
  rationale: Tiếng Hy Lạp lược động từ ở vế sau để nhấn mạnh tính tương hỗ. Tiếng Việt cần nhắc lại “dùng bữa” để câu rõ và tự nhiên, đồng thời vẫn giữ sự hiệp thông hai chiều.
theological_decisions:
- issue: Hình ảnh dùng bữa và sự hiệp thông
  choice: Giữ nguyên hình ảnh dùng bữa thân mật, tương hỗ mà không xác định đó là Tiệc Thánh, sự quy đạo hay sự phục hồi mối tương giao.
  alternative: Diễn giải cụ thể là Tiệc Thánh, lời mời tin Chúa lần đầu, hoặc việc phục hồi mối tương giao với tín hữu hay hội thánh.
  rationale: Bản văn biểu đạt rõ sự hiệp thông cá nhân và hai chiều, nhưng không tự xác định duy nhất ý nghĩa thần học cụ thể của bữa ăn.
- issue: Đối tượng của lời mời
  choice: Dịch vô định là “nếu ai”, không giới hạn người nghe vào người chưa tin hay tín hữu.
  alternative: Diễn giải “ai” riêng là người chưa tin hoặc riêng là thành viên hội thánh Lao-đi-xê.
  rationale: Ngữ cảnh là lời phán cho hội thánh, nhưng đại từ bất định τις vẫn mở; bản dịch không nên giải quyết thay cho bản văn phạm vi áp dụng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” giữ giọng uy nghiêm của Đấng Christ trong lời phán trực tiếp; “người ấy” tránh chỉ định giới tính. Trật tự các chú thích được đặt theo vị trí xuất hiện [a], [b], [c].
