  naturalness: Văn bản chính tự nhiên, trang trọng và phù hợp với lời phán trực tiếp trong Khải Huyền. Việc lặp lại “dùng bữa” ở vế cuối là cần thiết cho tiếng Việt, nơi không thể giữ phép tỉnh lược của tiếng Hy Lạp mà vẫn rõ nghĩa. Trong chú thích, “sự quy đạo” không phải cách dùng hiện đại, phổ thông; “sự hoán cải” thích hợp hơn.
  terminology: “Ta,” “tiếng Ta,” “dùng bữa,” và “Tiệc Thánh” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. Chú thích về hình ảnh bữa ăn duy trì đúng sự không xác định của bản văn, không áp đặt cách giải thích bí tích, hoán cải, hay phục hồi tương giao.
