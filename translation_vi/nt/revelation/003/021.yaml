id: REV.3.21
reference: Revelation 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: vi
  text: Người chiến thắng[a], Ta sẽ cho người ấy được ngồi với Ta trên ngai của Ta, như Ta cũng đã chiến thắng và đã ngồi với Cha Ta trên ngai của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người thắng.” Cùng một động từ Hy Lạp νικάω được dùng hai lần trong câu này; bản dịch dùng “chiến thắng” ở cả hai chỗ để giữ rõ mối liên hệ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Người chiến thắng
  rationale: Phân từ hiện tại dùng như danh từ, chỉ bất cứ ai chiến thắng. Cách dịch này tự nhiên trong tiếng Việt và giữ được mô-típ chiến thắng xuyên suốt sách Khải Huyền.
- source_word: δώσω αὐτῷ καθίσαι
  choice: Ta sẽ cho người ấy ngồi
  rationale: Động từ δίδωμι đi với động từ nguyên mẫu diễn tả việc ban cho một đặc ân. “Cho ... ngồi” vừa sát nghĩa vừa tự nhiên, không cần thêm ý “quyền” vốn không được nói rõ trong nguyên văn.
- source_word: μετ’ ἐμοῦ
  choice: với Ta
  rationale: Diễn đạt trực tiếp ý cùng ở và cùng dự phần; đại từ “Ta” phù hợp với lời phán trang trọng của Đấng Christ.
- source_word: ἐν τῷ θρόνῳ μου
  choice: trên ngai Ta
  rationale: Dù ἐν thường có nghĩa là “trong”, tiếng Việt dùng “trên ngai” để diễn tả việc ngự ngai.
- source_word: ὡς κἀγὼ
  choice: như chính Ta cũng
  rationale: “Như” giữ quan hệ so sánh; “chính ... cũng” chuyển tải sắc thái nhấn mạnh và bổ sung của κἀγώ.
- source_word: ἐνίκησα
  choice: đã chiến thắng
  rationale: Dùng cùng từ với νικῶν để bảo toàn liên kết từ vựng và chủ đề chiến thắng; “đã” thể hiện hành động hoàn tất của thì aorist trong văn cảnh.
- source_word: ἐκάθισα
  choice: ngồi
  rationale: Diễn đạt tự nhiên hành động lên ngự ngai đã hoàn tất; từ “ngai” làm rõ bối cảnh tôn vương mà không cần diễn giải thêm.
- source_word: μετὰ τοῦ πατρός μου
  choice: với Cha Ta
  rationale: Giữ nguyên quan hệ thân vị và tương giao được câu văn nêu rõ.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: trên ngai Ngài
  rationale: “Trên ngai” là cách nói tự nhiên trong tiếng Việt; “Ngài” chỉ Đức Chúa Cha một cách trang trọng và tránh chuỗi sở hữu nặng nề.
theological_decisions:
- issue: Phạm vi của lời hứa dành cho ὁ νικῶν và αὐτῷ ở số ít giống đực
  choice: Dịch là “Người chiến thắng ... người ấy”
  alternative: “Ai chiến thắng ... họ” hoặc “người nam chiến thắng ... người ấy”
  rationale: Tiếng Hy Lạp dùng dạng số ít giống đực với chức năng đại diện. Tiếng Việt không bắt buộc đánh dấu giống ở “người ấy”, nên bản dịch giữ số ít và phạm vi đại diện mà không thu hẹp lời hứa vào nam giới.
- issue: Mối quan hệ song song giữa người chiến thắng với ngai của Đấng Christ và Đấng Christ với ngai của Cha
  choice: Giữ nguyên phép so sánh mạnh và trực tiếp của câu
  alternative: Giảm nhẹ thành hình ảnh hoàn toàn tượng trưng hoặc thêm lời giải thích về bản thể vào chính câu dịch
  rationale: Nguyên văn hứa cho người chiến thắng được ngồi với Đấng Christ, rồi đặt điều đó song song với chiến thắng và sự ngự ngai của chính Ngài bên Cha. Bản dịch không xác định thêm bản chất của việc dự phần cũng không xóa nhòa sự phân biệt giữa Đấng Christ và Cha.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta”, “Cha Ta”, “Ngài” theo ngữ vực lời phán thần thượng; tránh lối cổ như “kẻ đắc thắng” nhưng vẫn giữ nhịp điệu uy nghiêm. Không thêm chú thích về giống vì “người ấy” trong tiếng Việt vốn có tính đại diện và không đánh dấu giới tính.
