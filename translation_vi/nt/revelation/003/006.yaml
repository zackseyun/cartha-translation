  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: vi
  text: Ai có tai[a], hãy nghe điều Thánh Linh phán với các hội thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng “tai” ở số ít; đây là lời kêu gọi mang tính khái quát, hướng đến bất cứ ai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Ai có
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ bất cứ người nào có tai. “Ai có” tự nhiên trong tiếng Việt và giữ được tính khái quát của lời kêu gọi.
- source_word: οὖς
  choice: tai
  rationale: Nguyên văn dùng danh từ số ít “tai”. Tiếng Việt không bắt buộc đánh dấu số nên “có tai” vừa sát hình thức nguồn vừa giữ sắc thái thành ngữ.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Động từ mệnh lệnh ngôi thứ ba số ít mang sức thúc giục. “Hãy nghe” là cách diễn đạt tự nhiên, trang trọng và không làm yếu mệnh lệnh.
- source_word: τί
  choice: điều
  rationale: Đại từ nghi vấn ở đây giới thiệu nội dung được nói. Cấu trúc “nghe điều ... phán” tự nhiên hơn trong tiếng Việt mà vẫn truyền đạt đúng nghĩa “những gì/điều mà”.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong điệp khúc của Khải Huyền 2–3, danh xưng này nhiều khả năng chỉ Đức Thánh Linh. “Thánh Linh” là cách gọi quen thuộc, rõ ràng và trang trọng trong tiếng Việt.
- source_word: λέγει
  choice: phán
  rationale: Thì hiện tại diễn tả lời nói đang có hiệu lực hoặc mang tính thường xuyên. “Phán” phù hợp với lời của Thánh Linh trong văn cảnh trang trọng; không cần thêm dấu hiệu tiếp diễn.
- source_word: ταῖς ἐκκλησίαις
  choice: với các hội thánh
  rationale: Tặng cách số nhiều sau λέγει chỉ đối tượng được nói với. “Các hội thánh” là thuật ngữ Tân Ước quen thuộc; “phán với” tự nhiên và giữ quan hệ trực tiếp với các cộng đồng.
theological_decisions:
- issue: Đối tượng được gọi là τὸ πνεῦμα
  choice: Thánh Linh
  alternative: thần linh; linh
  rationale: Điệp khúc lặp lại trong Khải Huyền 2–3 trình bày Thánh Linh là Đấng phán với các hội thánh. Viết hoa và thêm “Thánh” làm rõ đối tượng rất có khả năng được văn cảnh nói đến, không nhằm áp đặt nét riêng của một hệ phái.
- issue: Tính khái quát của cấu trúc số ít
  choice: Ai có tai, hãy nghe
  alternative: Người nào có tai, người ấy hãy nghe; Ai có tai thì hãy nghe
  rationale: Tiếng Hy Lạp dùng phân từ và mệnh lệnh số ít với ý nghĩa đại diện, áp dụng cho mọi người chứ không chỉ nam giới. Tiếng Việt không cần đại từ mang giới tính, nên cách dịch này vừa giữ số ít về ý niệm vừa biểu đạt tự nhiên tính phổ quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ công thức khuyên nhủ ngắn gọn của nguyên văn; dùng “phán” và “hội thánh” để phù hợp văn thể Khải Huyền và thuật ngữ Tân Ước quen thuộc.
