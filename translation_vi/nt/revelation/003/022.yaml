  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: vi
  text: Ai có tai, hãy nghe điều Thánh Linh[a] nói với các hội thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng từ “thần/linh” có mạo từ; trong ngữ cảnh này, từ ấy chỉ Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ai có tai
  rationale: Kết cấu mạo từ với phân từ hiện tại được dùng như danh từ, chỉ bất cứ người nào thuộc nhóm được mô tả. “Ai có tai” tự nhiên trong tiếng Việt, vẫn giữ danh từ số ít và sắc thái lời kêu gọi mang tính đại diện.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Động từ mệnh lệnh aorist ngôi ba số ít diễn đạt lời thúc giục. Tiếng Việt dùng “hãy nghe” tự nhiên và giữ được lực mệnh lệnh mà không cần đưa đại từ mang giới tính vào.
- source_word: τί
  choice: điều
  rationale: Đại từ nghi vấn ở đây dẫn vào nội dung cần nghe. “Điều ... phán” là cách diễn đạt tự nhiên, tương ứng với “những gì” nhưng gọn hơn trong công thức lặp lại này.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong điệp khúc của Khải Huyền 2–3, từ này chỉ Thánh Linh nói với các hội thánh. “Thánh Linh” là cách gọi trang trọng, quen thuộc trong tiếng Việt; cước chú ghi rõ rằng nguyên văn chỉ viết “Linh” với mạo từ.
- source_word: λέγει
  choice: phán
  rationale: Thì hiện tại chỉ hành động nói của Thánh Linh. “Phán” phù hợp với chủ thể thần linh và văn phong Kinh Thánh trang trọng, nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ταῖς ἐκκλησίαις
  choice: với các hội thánh
  rationale: Cách ở đây chỉ những người tiếp nhận lời phán. “Các hội thánh” phù hợp với những cộng đoàn được nhắc đến trong Khải Huyền 2–3; “với” đi tự nhiên với động từ “phán” trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt số ít mang tính đại diện
  choice: Ai có tai, hãy nghe
  alternative: Người nào có tai, người ấy hãy nghe
  rationale: Tiếng Hy Lạp dùng dạng giống đực số ít nhưng có chức năng đại diện. Tiếng Việt không buộc đánh dấu giới tính; “ai” giữ tính áp dụng cho từng cá nhân, giữ “tai” ở số ít và tránh thêm sắc thái giới tính không cần thiết.
- issue: Đối tượng được gọi là τὸ πνεῦμα
  choice: Thánh Linh
  alternative: Linh
  rationale: Ngữ cảnh của công thức lặp lại trong các thư gửi hội thánh xác định Đấng đang phán là Thánh Linh. Bản dịch thể hiện đối tượng theo ngữ cảnh, đồng thời cước chú bảo lưu hình thức sát chữ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu ngắn giữ nhịp của lời kêu gọi nguyên văn. Dùng “hội thánh” cho ἐκκλησία theo ngữ cảnh Khải Huyền 2–3; dùng “phán” để diễn đạt lời nói có thẩm quyền của Thánh Linh.
