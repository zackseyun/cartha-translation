  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: vi
  text: Ai có tai, hãy nghe điều Thánh Linh phán với các hội thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “các hội chúng” thay cho “các hội thánh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: Ai có tai
  rationale: Cụm phân từ có mạo từ mang nghĩa khái quát, ở số ít. “Ai có tai” là cách nói tự nhiên, trang trọng trong tiếng Việt và giữ nguyên hình ảnh “tai” ở số ít.
- source_word: ἀκουσάτω
  choice: hãy nghe
  rationale: Động từ mệnh lệnh ngôi ba số ít kêu gọi người nghe không chỉ tiếp nhận âm thanh mà còn chú tâm và đáp ứng; “hãy nghe” giữ được công thức lặp lại trong sách Khải Huyền.
- source_word: τί
  choice: điều
  rationale: Ở đây τί dẫn vào nội dung lời phán. “Điều ... phán” tự nhiên hơn “những gì” trong cấu trúc câu tiếng Việt này mà vẫn truyền đạt đầy đủ ý nghĩa.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong công thức khuyên bảo lặp lại ở Khải Huyền, từ này chỉ Thánh Linh. Cách viết hoa và danh xưng “Thánh Linh” làm rõ sở chỉ phù hợp với văn cảnh.
- source_word: λέγει
  choice: phán
  rationale: Thì hiện tại diễn tả hành động nói trong công thức sứ điệp. “Phán” phù hợp với lời của Thánh Linh, giữ giọng văn trang trọng mà vẫn quen thuộc.
- source_word: ταῖς ἐκκλησίαις
  choice: với các hội thánh
  rationale: Dữ cách chỉ những cộng đồng nhận lời phán. “Các hội thánh” là cách dịch chuẩn, phù hợp với bảy hội thánh trong văn cảnh; giới từ “với” diễn đạt tự nhiên hành động nói hướng đến họ.
theological_decisions:
- issue: Sở chỉ của τὸ πνεῦμα
  choice: Thánh Linh phán với các hội thánh
  alternative: “thần linh” hoặc “linh” theo nghĩa phi ngôi vị
  rationale: Công thức khuyên bảo lặp lại trong Khải Huyền cho thấy đây là Thánh Linh đang truyền đạt sứ điệp tiên tri cho các hội thánh; lựa chọn này theo sát sở chỉ có khả năng nhất trong văn cảnh mà không thêm nét giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ câu ngắn, nhịp khuyên bảo và hình ảnh số ít “tai” của nguyên văn; không thêm “để nghe” vì nguyên văn chỉ nói “có tai”.
