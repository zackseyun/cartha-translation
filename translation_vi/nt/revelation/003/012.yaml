id: REV.3.12
reference: Revelation 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: vi
  text: Người nào chiến thắng[a], Ta sẽ làm người ấy thành một trụ cột trong đền thờ của Đức Chúa Trời của Ta, và người ấy sẽ chẳng bao giờ ra khỏi đó nữa[b]. Ta sẽ viết trên người ấy danh của Đức Chúa Trời của Ta, danh của thành của Đức Chúa Trời của Ta, tức Giê-ru-sa-lem mới, là thành từ trời xuống, từ Đức Chúa Trời của Ta, và chính danh mới của Ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người nào thắng.” Động từ Hy Lạp νικάω là một từ được lặp lại trong sách Khải Huyền để chỉ sự chiến thắng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp dùng lối phủ định đặc biệt mạnh: người ấy chắc chắn sẽ không bao giờ ra khỏi đó nữa.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch đơn giản: “danh mới của Ta.” Cấu trúc Hy Lạp có sắc thái nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Người nào chiến thắng
  rationale: Phân từ hiện tại dùng như danh từ chỉ người chiến thắng; cách dịch này giữ mô-típ νικάω lặp lại trong sách Khải Huyền và sắc thái chiến thắng nhờ lòng trung tín.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: Ta sẽ làm người ấy thành một trụ cột
  rationale: Giữ nguyên hình ảnh kiến trúc về sự bền vững và vinh dự; thêm “thành” để cấu trúc tiếng Việt tự nhiên.
- source_word: ἐν τῷ ναῷ
  choice: trong đền thờ
  rationale: ναός chỉ đền thờ hoặc nơi thánh, không phải toàn bộ khuôn viên; “đền thờ” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: sẽ không bao giờ ra khỏi đó nữa
  rationale: “Không bao giờ… nữa” chuyển tải lối phủ định đặc biệt mạnh οὐ μή và tính vĩnh viễn; “đó” làm rõ nơi được ngầm chỉ là đền thờ.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: Ta sẽ viết trên người ấy
  rationale: Giữ cách diễn đạt trực tiếp của γράφω ἐπί mà không diễn giải thêm ý nghĩa biểu tượng.
- source_word: τὸ ὄνομα
  choice: danh
  rationale: “Danh” là từ trang trọng, quen thuộc trong văn phong Kinh Thánh, có thể mang sức nặng về căn tính và sự thuộc về mà không cần giải nghĩa trong chính văn.
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: Giê-ru-sa-lem mới
  rationale: Giữ “mới” như tính từ của địa danh và dùng dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: thành từ trời xuống, từ Đức Chúa Trời của Ta
  rationale: Giữ sắc thái mô tả của phân từ hiện tại và phân biệt cả nguồn không gian “từ trời” lẫn nguồn tác nhân “từ Đức Chúa Trời của Ta”.
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: chính danh mới của Ta
  rationale: “Chính” thể hiện cấu trúc nhấn mạnh của tiếng Hy Lạp nhưng không suy đoán nội dung của danh mới.
theological_decisions:
- issue: Giống đực số ít trong công thức lời hứa
  choice: Dùng “người ấy” ở số ít
  alternative: Dùng đại từ số nhiều hoặc lặp lại “người chiến thắng”
  rationale: “Người ấy” giữ số ít đại diện của nguyên bản. Tiếng Việt không bắt buộc đánh dấu giống trong đại từ này, nên không cần đưa thêm giới tính mà bản dịch tự nhiên không đòi hỏi.
- issue: Cụm từ “Đức Chúa Trời của Ta” trong lời của Đấng Christ được tôn cao
  choice: Giữ đủ cả bốn lần
  alternative: Lược bớt các lần lặp để câu văn gọn hơn
  rationale: Nguyên bản cố ý lặp lại τοῦ θεοῦ μου bốn lần; giữ nguyên sự lặp lại bảo toàn sức nhấn mạnh và căng thẳng thần học của chính văn.
- issue: Cụm từ chỉ danh mới ở cuối câu
  choice: “chính danh mới của Ta”
  alternative: “danh mới của Ta”
  rationale: Từ “chính” phản ánh cấu trúc nhấn mạnh τὸ ὄνομά μου τὸ καινόν, đồng thời để ngỏ nội dung và ý nghĩa cụ thể của danh ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời phán trực tiếp của Đấng Christ, “Đức Chúa Trời” cho θεός, và “danh” thay vì “tên” để giữ âm hưởng trang nghiêm cùng chiều sâu biểu tượng. Dấu gạch ngang làm rõ phần đồng vị giải thích thành của Đức Chúa Trời là Giê-ru-sa-lem mới.
