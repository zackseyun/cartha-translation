id: REV.3.17
reference: Revelation 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: vi
  text: 'Vì ngươi nói: “Ta giàu có, ta đã trở nên giàu sang và chẳng cần gì cả,” và ngươi không biết rằng chính ngươi là kẻ khốn khổ, đáng thương, nghèo khó, mù lòa và trần truồng.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: 'Vì ngươi nói:'
  rationale: ὅτι đầu có nghĩa nguyên nhân trong ngữ cảnh; ὅτι thứ hai dẫn nội dung lời nói, được thể hiện tự nhiên bằng dấu hai chấm và lời trích dẫn.
- source_word: Πλούσιός εἰμι
  choice: Ta giàu có
  rationale: Chuyển tải trực tiếp lời tự đánh giá về sự giàu có và giữ nền tảng cho sự tương phản với πτωχός.
- source_word: πεπλούτηκα
  choice: ta đã trở nên giàu sang
  rationale: Thể hoàn thành diễn tả việc đạt đến tình trạng giàu có vẫn còn hiệu lực; cách dịch này phân biệt với mệnh đề trước mà không làm mất sự lặp lại có chủ ý.
- source_word: οὐδὲν χρείαν ἔχω
  choice: chẳng cần gì cả
  rationale: Lối nói Việt tự nhiên, đồng thời giữ sức nhấn mạnh của οὐδέν.
- source_word: οὐκ οἶδας
  choice: ngươi không biết
  rationale: Giữ nguyên động từ nhận thức, không diễn giải thành “không nhận ra”.
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: chính ngươi là kẻ khốn khổ
  rationale: “Chính ngươi” thể hiện sự nhấn mạnh của đại từ σὺ; “kẻ khốn khổ” chuyển tải sắc thái chỉ đích danh của mạo từ ὁ trước tính từ ταλαίπωρος.
- source_word: ἐλεεινός
  choice: đáng thương
  rationale: Diễn tả người ở trong tình trạng đáng được thương xót, đồng thời phân biệt với ταλαίπωρος.
- source_word: πτωχός
  choice: nghèo khó
  rationale: Giữ sự đối lập trực tiếp và mỉa mai với lời tự nhận là giàu có.
- source_word: τυφλός
  choice: mù lòa
  rationale: Giữ hình ảnh của nguyên bản, không thêm lời giải thích theo nghĩa thuộc linh.
- source_word: γυμνός
  choice: trần truồng
  rationale: Cách dịch trực tiếp, rõ ràng, giữ nguyên sức mạnh tu từ của chuỗi mô tả.
theological_decisions:
- issue: Có nên nói rõ sự tương phản này là về tình trạng thuộc linh hay không
  choice: Giữ nguyên các hình ảnh giàu có, nghèo khó, mù lòa và trần truồng mà không thêm “thuộc linh”.
  alternative: Ta giàu có về vật chất… nhưng thuộc linh ngươi nghèo khó…
  rationale: Nguyên văn để chính sự tương phản và ngữ cảnh tạo nên ý nghĩa ẩn dụ; thêm các từ giải nghĩa sẽ thu hẹp sự căng thẳng thần học và tu từ của câu.
- issue: Mức độ nhấn mạnh trong σὺ εἶ ὁ ταλαίπωρος
  choice: “chính ngươi là kẻ khốn khổ”
  alternative: “ngươi khốn khổ”
  rationale: Cách chọn giữ cả sự nhấn mạnh của σὺ lẫn tính chất chỉ đích danh do mạo từ ὁ tạo ra, nhưng vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong trang trọng, dễ hiểu, dùng cặp đại từ “ta—ngươi” phù hợp lời phán trực tiếp trong Khải Huyền. Chuỗi tính từ được giữ dồn dập như nguyên văn. Không thêm chú giải vì các khác biệt dịch thuật quan trọng có thể được thể hiện rõ và tự nhiên ngay trong chính văn.
