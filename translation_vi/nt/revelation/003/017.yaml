review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc nhân quả của ὅτι đầu, lời tự nhận giàu có, sắc thái hoàn thành của πεπλούτηκα, và chuỗi năm mô tả nghịch lý. Tuy nhiên, liên từ καὶ trước οὐκ οἶδας là liên từ phối hợp («và»), không phải đối lập trực tiếp («nhưng»).
  naturalness: Cặp đại từ «ta—ngươi» phù hợp văn cảnh lời phán trong Khải Huyền và văn phong trang trọng hiện đại. «Chính ngươi là kẻ khốn khổ» diễn đạt tự nhiên sự nhấn mạnh. Thay «nhưng» bằng «và» vừa sát nguyên văn vừa vẫn trôi chảy trong tiếng Việt.
  terminology: «Giàu có / trở nên giàu sang / nghèo khó», «đáng thương», «mù lòa», và «trần truồng» giữ được các hình ảnh và tương phản của nguyên văn, không áp đặt cách giải thích thuộc linh. Không cần chú thích cho câu này.
  issues:
  - severity: low
    issue: Liên từ «nhưng» trước «ngươi không biết»
    rationale: Nguyên văn dùng καὶ («và»), nối hai yếu tố làm căn cứ cho lời quở trách. Dù ý tương phản có thể cảm nhận từ ngữ cảnh, «nhưng» thêm một quan hệ đối lập không được biểu thị bằng liên từ Hy Lạp.
