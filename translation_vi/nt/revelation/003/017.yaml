revisions:
- from: 'Vì ngươi nói: “Ta giàu có, ta đã trở nên giàu sang và chẳng cần gì cả,” nhưng ngươi không biết rằng chính ngươi là kẻ khốn khổ, đáng thương, nghèo khó, mù lòa và trần truồng.'
  to: 'Vì ngươi nói: “Ta giàu có, ta đã trở nên giàu sang và chẳng cần gì cả,” và ngươi không biết rằng chính ngươi là kẻ khốn khổ, đáng thương, nghèo khó, mù lòa và trần truồng.'
