review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung bám sát mệnh lệnh, liên từ suy luận, πῶς (“cách/thế nào”), sức nhấn của οὐ μή, và sự mơ hồ về phạm vi cuộc đến. Tuy nhiên, “ta sẽ đến trên con” không phải cách diễn đạt tiếng Việt tự nhiên cho ἥξω ἐπὶ σέ; “ta sẽ ập đến trên con” truyền đạt được hướng đến/giáng xuống mang sắc thái bất lợi mà không xác định bản chất cuộc viếng thăm.
  naturalness: Văn phong trang nghiêm, hiện đại và nhất quán với lối xưng hô ta/con. Cụm “đến trên con” gượng và khó hiểu trong tiếng Việt hiện đại; thay bằng “ập đến trên con” tự nhiên hơn trong ngữ cảnh cảnh báo bất ngờ.
  terminology: “Tỉnh thức,” “ăn năn,” và “kẻ trộm” phù hợp với văn phong Kinh Thánh Việt ngữ hiện đại. “Giữ lấy điều ấy” là cách chuyển an toàn cho τήρει, không thu hẹp nghĩa vào chỉ vâng lời.
  issues:
