id: REV.3.3
reference: Revelation 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: vi
  text: Vậy, hãy nhớ lại cách con đã tiếp nhận và nghe; hãy giữ lấy điều ấy và ăn năn. Vì thế, nếu con không tỉnh thức,[a] ta sẽ đến như kẻ trộm,[b] và con chắc chắn sẽ không biết giờ nào ta sẽ ập đến trên con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tỉnh thức” cũng có thể dịch là “canh thức” hoặc “luôn cảnh giác.”
    reason: lexical_alternative
  - marker: b
    text: Lời cảnh báo “ta sẽ đến như kẻ trộm” nói đến một cuộc đến bất ngờ. Riêng câu này không xác định đó là sự phán xét cuối cùng hay một lần sửa phạt gần hơn.
    reason: theological_ambiguity
lexical_decisions:
- source_word: μνημόνευε
  choice: hãy nhớ lại
  rationale: Mệnh lệnh hiện tại kêu gọi tiếp tục ghi nhớ; “nhớ lại” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: οὖν
  choice: vậy / vì thế
  rationale: Từ nối chỉ hệ quả từ lời quở trách trước đó. Hai lần xuất hiện được diễn đạt tự nhiên theo ngữ cảnh mà vẫn giữ mạch suy luận.
- source_word: πῶς
  choice: cách
  rationale: Giữ nghĩa trực tiếp là cách thức tiếp nhận và nghe, thay vì âm thầm đổi thành nội dung “điều gì”.
- source_word: εἴληφας καὶ ἤκουσας
  choice: con đã tiếp nhận và nghe
  rationale: “Đã tiếp nhận” diễn đạt hành động trong quá khứ vẫn có ý nghĩa hiện tại; “nghe” phản ánh trực tiếp ἤκουσας.
- source_word: τήρει
  choice: hãy giữ lấy điều ấy
  rationale: Bao hàm ý gìn giữ và làm theo điều đã tiếp nhận, nhưng không thu hẹp động từ chỉ còn nghĩa vâng lời.
- source_word: μετανόησον
  choice: ăn năn
  rationale: Cách diễn đạt quen thuộc, trang trọng cho lời kêu gọi quay khỏi tội lỗi.
- source_word: γρηγορήσῃς
  choice: tỉnh thức
  rationale: Giữ hình ảnh thức canh và sự cảnh giác, đồng thời phù hợp với hình ảnh kẻ trộm theo sau.
- source_word: ἥξω ὡς κλέπτης
  choice: ta sẽ đến như kẻ trộm
  rationale: Giữ nguyên phép so sánh về một cuộc đến bất ngờ.
- source_word: οὐ μὴ γνῷς
  choice: con chắc chắn sẽ không biết
  rationale: Diễn đạt sức nhấn mạnh của cấu trúc phủ định οὐ μή mà không dùng lối văn cổ.
- source_word: ποίαν ὥραν
  choice: giờ nào
  rationale: Giữ hình ảnh cụ thể “giờ” của nguyên văn và vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπὶ σέ
  choice: đến trên con
  rationale: Giữ sắc thái trang nghiêm và phần nào bất thường của chuyển động hướng đến hoặc giáng trên đối tượng, không quyết định sẵn đó là viếng thăm hay phán xét.
theological_decisions:
- issue: Ý nghĩa của πῶς trong lời kêu gọi ghi nhớ
  choice: “hãy nhớ lại cách con đã tiếp nhận và nghe”
  alternative: “hãy nhớ lại điều con đã tiếp nhận và nghe”
  rationale: Nguyên văn dùng πῶς, trực tiếp nói đến cách thức; tuy vậy, cách hiểu quy chiếu đến chính sứ điệp vẫn có thể có, nên không giải quyết dứt điểm bằng cách thay πῶς thành “điều”.
- issue: Bản chất của lời cảnh báo “ta sẽ đến như kẻ trộm”
  choice: Không xác định đây là sự tái lâm cuối cùng hay một cuộc viếng phạt gần hơn
  alternative: Nêu rõ là ngày tái lâm hoặc một sự phán xét lịch sử tại chỗ
  rationale: Câu này nhấn mạnh tính bất ngờ nhưng không tự xác định phạm vi của cuộc đến; bản dịch giữ nguyên sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “ta/con” vì đây là lời trực tiếp của Đấng Christ gửi cho hội thánh qua vị thiên sứ; giữ “đến trên con” để bảo toàn sắc thái ἐπὶ σέ. Không thêm chú thích riêng cho πῶς vì bản văn chính đã thể hiện rõ bằng “cách”.
