    issue: Cụm “ta sẽ đến trên con” không tự nhiên trong tiếng Việt.
    rationale: Dù ἐπὶ σέ có thể hàm ý cuộc đến hướng đến/giáng trên người nhận, việc dịch sát từng chữ là “đến trên con” tạo một cấu trúc không thành ngữ. “Ta sẽ ập đến trên con” diễn đạt cuộc đến bất ngờ, có hướng tác động đến người nhận, mà không áp đặt cách giải thích về chung thẩm hay sửa phạt.
