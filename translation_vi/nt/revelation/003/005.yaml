id: REV.3.5
reference: Revelation 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: vi
  text: Người chiến thắng[a] sẽ mặc y phục trắng như vậy. Ta quyết không xóa[b] tên người ấy khỏi sách sự sống[c], và Ta sẽ tuyên xưng[d] tên người ấy trước mặt Cha Ta và trước mặt các thiên sứ của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người vượt thắng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ta sẽ không bao giờ xóa tên người ấy khỏi sách sự sống.” Tiếng Hy Lạp dùng một lối phủ định đặc biệt mạnh.'
    reason: lexical_alternative
  - marker: c
    text: “Sách sự sống” là hình ảnh về sổ bộ trên trời ghi những người thuộc về Đức Chúa Trời và được hưởng sự sống.
    reason: cultural_note
  - marker: d
    text: “Tuyên xưng” cũng có thể dịch là “công nhận.” So sánh Ma-thi-ơ 10:32.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Người chiến thắng
  rationale: Phân từ hiện tại được danh từ hóa, diễn tả người mang đặc tính bền bỉ chiến thắng; cách dịch này tự nhiên và giữ mô-típ chiến thắng xuyên suốt sách Khải Huyền.
- source_word: οὕτως
  choice: như vậy
  rationale: Giữ rõ trạng từ liên kết với lời hứa và hình ảnh ngay trước đó, không diễn giải thêm quan hệ.
- source_word: περιβαλεῖται ἐν ἱματίοις λευκοῖς
  choice: sẽ được mặc áo trắng
  rationale: Dạng trung động/thụ động được chuyển thành kết quả thụ động tự nhiên trong tiếng Việt; “áo” đủ rộng để chỉ y phục mà không thu hẹp thành một kiểu lễ phục cụ thể.
- source_word: οὐ μὴ ἐξαλείψω
  choice: Ta quyết không xóa
  rationale: “Quyết không” truyền đạt phủ định nhấn mạnh οὐ μή với động từ tương lai, đồng thời “xóa” phù hợp hình ảnh tên ghi trong một cuốn sách.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: tên người ấy
  rationale: Giữ số ít và ý nghĩa đại diện của cấu trúc giống đực Hy Lạp, nhưng dùng đại từ tiếng Việt tự nhiên, không mặc nhiên giới hạn lời hứa cho nam giới.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: khỏi sách sự sống
  rationale: Đây là cách diễn đạt Kinh Thánh quen thuộc và sáng rõ cho hình ảnh sổ bộ thiên thượng; βίβλος có thể là sách hoặc cuộn sách nhưng ngữ cảnh không đòi hỏi xác định hình thức vật chất.
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: sẽ tuyên nhận tên người ấy
  rationale: “Tuyên nhận” giữ nghĩa công khai nhìn nhận và tuyên bố thuộc về, mạnh hơn “thừa nhận” nhưng tránh sắc thái chủ yếu là thú tội của “xưng nhận” trong tiếng Việt hiện đại.
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: trước mặt Cha Ta và trước mặt các thiên sứ của Ngài
  rationale: Lặp lại “trước mặt” theo nguyên văn để giữ tính trang trọng và song song; “của Ngài” tự nhiên quy chiếu về Cha trong cú pháp gần nhất.
theological_decisions:
- issue: Hàm ý của lời “quyết không xóa” đối với tranh luận về sự bền đỗ hoặc bội đạo
  choice: Dịch thẳng như một lời hứa bảo đảm dành cho người chiến thắng, không suy diễn thành kết luận hệ thống về việc tín hữu thật có thể hay không thể sa ngã sau cùng.
  alternative: Hiểu như bằng chứng dứt khoát cho sự bền đỗ của các thánh đồ, hoặc như lời cảnh báo rằng một số người có thể mất sự cứu rỗi.
  rationale: Câu này dùng hình ảnh sổ bộ để đưa ra một lời hứa nhấn mạnh. Bản dịch cần giữ cả sức bảo đảm của lời hứa lẫn khoảng mở thần học mà chính câu văn không giải quyết hoàn toàn.
- issue: Giống ngữ pháp của cấu trúc số ít giống đực
  choice: Dùng “người ấy” và lặp lại “tên người ấy”, giữ số ít cùng chức năng đại diện.
  alternative: Dùng “tên họ” hoặc chỉ rõ “tên của người nam ấy”.
  rationale: Tiếng Việt không bắt buộc đánh dấu giống trong đại từ này. “Người ấy” trung thành với số ít đại diện mà không thêm giới tính vốn không phải trọng tâm của lời hứa.
- issue: Chủ thể sở hữu trong “các thiên sứ của Ngài”
  choice: Để đại từ quy chiếu tự nhiên về “Cha Ta”, danh từ gần nhất trong nguyên văn.
  alternative: Diễn giải thành “các thiên sứ của Đức Chúa Trời” hoặc “các thiên sứ của Ta”.
  rationale: Giữ đại từ của bản Hy Lạp bảo toàn cấu trúc và tránh sự hài hòa hóa thần học không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời phán uy quyền của Đấng Christ; “Cha Ta” giữ quan hệ phụ tử trong nguyên văn. Cấu trúc câu gần với nhịp ba vế của tiếng Hy Lạp nhưng được ngắt thành hai câu để tiếng Việt sáng rõ hơn. Tất cả dấu chú thích đều đặt ngay sau cụm từ liên quan.
