revisions:
- from: Người chiến thắng sẽ được mặc áo trắng như vậy[a]. Ta quyết không xóa tên người ấy khỏi sách sự sống[b][c], nhưng sẽ tuyên nhận tên người ấy trước mặt Cha Ta và trước mặt các thiên sứ của Ngài[d].
  to: Người chiến thắng[a] sẽ mặc y phục trắng như vậy. Ta quyết không xóa[b] tên người ấy khỏi sách sự sống[c], và Ta sẽ tuyên xưng[d] tên người ấy trước mặt Cha Ta và trước mặt các thiên sứ của Ngài.
  rationale: Bản sửa thay liên từ đối lập bằng “và” để phản ánh καί, dùng “y phục trắng” cho ἱματίοις λευκοῖς, thay “tuyên nhận” bằng “tuyên xưng” cho ὁμολογήσω, và đặt lại các mốc chú thích sát đơn vị từ vựng được giải thích. Lời hứa về sách sự sống vẫn được dịch trực tiếp, không giải quyết các tranh luận thần học ngoài câu văn.
