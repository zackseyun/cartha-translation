id: REV.3.7
reference: Revelation 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: vi
  text: '“Hãy viết cho thiên sứ[b] của hội thánh tại Phi-la-đen-phi: ‘Đây là lời phán của Đấng Thánh, Đấng Chân Thật, Đấng có chìa khóa của Đa-vít[a], Đấng mở thì sẽ không ai có thể đóng, Đấng đóng thì không ai có thể mở:’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chìa khóa của Đa-vít” có lẽ gợi đến Ê-sai 22:22, một hình ảnh về thẩm quyền hoàng gia để mở và đóng.
    reason: cross_reference
  - marker: b
    text: Từ Hy Lạp được dịch là “thiên sứ” cũng có thể có nghĩa là “sứ giả”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: thiên sứ
  rationale: Từ này có thể chỉ thiên sứ hoặc sứ giả. Trong công thức lặp lại ở các thư gửi bảy hội thánh, “thiên sứ” là cách dịch tự nhiên, quen thuộc, đồng thời chú thích vẫn giữ lại khả năng “sứ giả”.
- source_word: ἐκκλησίας
  choice: hội thánh
  rationale: Ở đây từ này chỉ cộng đồng tín hữu tại một địa phương; “hội thánh” là cách diễn đạt rõ ràng và thông dụng trong tiếng Việt.
- source_word: Τάδε λέγει
  choice: phán thế này
  rationale: Cách dịch này giữ sắc thái trang trọng của công thức tuyên phán mang âm hưởng ngôn sứ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ ἅγιος
  choice: Đấng Thánh
  rationale: Mạo từ cùng tính từ được danh từ hóa tạo thành một tước hiệu; “Đấng Thánh” giữ được hình thức và sắc thái trang nghiêm ấy.
- source_word: ὁ ἀληθινός
  choice: Đấng Chân Thật
  rationale: ἀληθινός có thể bao hàm ý chân thật, đích thực và xác thực. “Đấng Chân Thật” giữ độ rộng ngữ nghĩa tốt hơn cách chỉ nhấn mạnh sự thành thật.
- source_word: κλεῖν Δαυίδ
  choice: chìa khóa của Đa-vít
  rationale: Dịch trực tiếp cấu trúc sở hữu và bảo toàn hình ảnh về thẩm quyền hoàng gia có liên hệ với Ê-sai 22:22.
- source_word: ἀνοίγων
  choice: Đấng mở
  rationale: Phân từ hiện tại tiếp nối chuỗi tước hiệu và mô tả về Đấng đang phán; cấu trúc “Đấng…” tự nhiên và trang trọng trong tiếng Việt.
- source_word: κλείσει
  choice: sẽ đóng được
  rationale: Giữ ý tương lai của động từ Hy Lạp; thêm “được” diễn đạt tự nhiên hàm ý không ai có khả năng đảo ngược hành động của Đấng ấy.
- source_word: κλείων
  choice: Đấng đóng
  rationale: Giữ cấu trúc song song với “Đấng mở” và tiếp tục chuỗi mô tả về người phán.
- source_word: ἀνοίγει
  choice: mở được
  rationale: Dịch thì hiện tại theo cách tự nhiên trong tiếng Việt; “được” làm rõ ý bất khả đảo ngược mà không thay đổi nội dung mệnh đề.
theological_decisions:
- issue: Các tước hiệu Kitô học ὁ ἅγιος và ὁ ἀληθινός
  choice: Dịch là “Đấng Thánh, Đấng Chân Thật”, những tước hiệu trực tiếp của Đấng Christ phục sinh.
  alternative: “đấng thánh và chân thật” hoặc “đấng thánh, đấng đích thực”
  rationale: Các cấu trúc có mạo từ và tính từ được danh từ hóa hoạt động như những tước hiệu trang trọng. Cách dịch này bảo toàn Kitô học cao của câu mà không thêm khẳng định ngoài văn bản.
- issue: Ẩn dụ “chìa khóa của Đa-vít”
  choice: Giữ nguyên hình ảnh trong chính văn và giải thích liên hệ với Ê-sai 22:22 trong chú thích.
  alternative: Diễn giải thành “quyền cai trị vương quốc Đa-vít”
  rationale: Cụm từ gợi đến thẩm quyền hoàng gia thuộc dòng Đa-vít, nhưng bản dịch nên bảo toàn hình ảnh Kinh Thánh thay vì thay nó bằng một lối giải nghĩa.
- issue: Bản chất của ἀγγέλῳ
  choice: Dùng “thiên sứ” trong chính văn, ghi “sứ giả” là khả năng khác trong chú thích.
  alternative: Dịch thẳng là “sứ giả”
  rationale: Ngữ cảnh không xác định dứt khoát đây là hữu thể thiên thượng hay người đưa tin. Cách trình bày này không che khuất sự mơ hồ thật sự của từ Hy Lạp.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Phi-la-đen-phi” theo lối phiên âm quen thuộc; giữ nhịp song song “Đấng mở… Đấng đóng…” và đặt các chú thích đúng tại nội dung liên quan.
