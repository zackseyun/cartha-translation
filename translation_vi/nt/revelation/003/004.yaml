id: REV.3.4
reference: Revelation 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: vi
  text: Nhưng tại Sạt-đe, ngươi có một vài người[a] chưa làm ô uế áo mình[b]. Họ sẽ bước đi với ta trong áo trắng[c], vì họ xứng đáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một vài tên”, tức là một vài người.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chưa làm bẩn áo mình”.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn nói gọn: “trong màu trắng”; áo trắng được hiểu ngầm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản rõ rệt với lời quở trách trước đó, tự nhiên và súc tích trong tiếng Việt.
- source_word: ἔχεις ὀλίγα ὀνόματα ἐν Σάρδεσιν
  choice: tại Sạt-đe, ngươi vẫn có một vài người
  rationale: ὀνόματα theo nghĩa đen là “tên”, nhưng ở đây dùng hoán dụ chỉ những cá nhân; “một vài người” rõ nghĩa và tự nhiên hơn trong tiếng Việt. “Vẫn” làm nổi bật sự tương phản hàm chứa trong văn cảnh mà không thay đổi nội dung.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: chưa làm ô uế áo mình
  rationale: μολύνω có nghĩa làm bẩn hoặc làm ô uế; “làm ô uế” giữ được cả hình ảnh y phục lẫn sắc thái đạo đức. “Áo mình” là cách diễn đạt tự nhiên cho đại từ phản thân theo ngữ cảnh.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: sẽ ... bước đi với ta
  rationale: Giữ nguyên hình ảnh “bước đi” và ý nghĩa đồng hành, tương giao; “ta” phù hợp với lời trực tiếp trang trọng của Đấng Christ.
- source_word: ἐν λευκοῖς
  choice: mặc áo trắng
  rationale: Cụm Hy Lạp nói gọn là “trong màu trắng”, với danh từ y phục được hiểu ngầm. Tiếng Việt cần làm rõ tự nhiên là mặc áo trắng, phù hợp với hình ảnh áo ngay trước đó.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: vì họ xứng đáng
  rationale: Chuyển thẳng ý nguyên nhân và giữ nguyên khẳng định về sự xứng đáng, không thêm lời giải thích thần học.
theological_decisions:
- issue: Nên giữ nghĩa đen “một vài tên” hay diễn đạt hoán dụ là “một vài người”
  choice: Dùng “một vài người” trong chính văn và ghi nghĩa đen trong chú thích
  alternative: một vài tên
  rationale: Trong tiếng Hy Lạp, “tên” chỉ những cá nhân cụ thể. Tiếng Việt “một vài tên” dễ bị hiểu là cách gọi miệt thị hoặc danh sách tên, nên “một vài người” truyền đạt đúng nghĩa trong ngữ cảnh; chú thích bảo tồn hình thức đặc sắc của nguyên văn.
- issue: Sắc thái của μολύνω trong hình ảnh y phục
  choice: chưa làm ô uế áo mình
  alternative: chưa làm bẩn áo mình
  rationale: “Ô uế” giữ được cả hình ảnh vết bẩn và hàm ý đạo đức thuộc linh của câu, trong khi chú thích nêu cách dịch cụ thể hơn.
- issue: Ý nghĩa của ἄξιοί εἰσιν
  choice: vì họ xứng đáng
  alternative: vì họ đáng được như vậy
  rationale: Giữ nguyên sức nặng và sự căng thẳng thần học của lời văn, không làm nhẹ đi hay giải thích theo một hệ thống giáo lý về công trạng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi/ta” để duy trì lời phán trực tiếp với sắc thái trang nghiêm. Địa danh được phiên âm là “Sạt-đe”. Các hình ảnh áo bị ô uế, bước đi và áo trắng được giữ liền mạch.
