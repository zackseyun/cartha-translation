  source_fidelity: Bản dịch truyền đạt đúng tương phản, số ít trực tiếp của ἔχεις, ý hoán dụ của ὀλίγα ὀνόματα, hình ảnh áo không bị ô uế, lời hứa sẽ bước đi với Đấng phán, và lý do «vì họ xứng đáng». Tuy nhiên, «vẫn» thêm một sắc thái thời gian/tiếp diễn không được nêu trực tiếp trong câu Hy Lạp; còn «mặc áo trắng bước đi» chuyển cấu trúc cô đọng ἐν λευκοῖς thành một hành động mặc áo rõ nét hơn. Có thể sửa an toàn để giữ sát hơn sự cô đọng và hình ảnh của nguyên văn.
  naturalness: «Nhưng tại Sạt-đe, ngươi có một vài người...» tự nhiên trong văn phong Kinh Thánh hiện đại. «Họ sẽ bước đi với ta trong áo trắng» trôi chảy hơn trật tự «mặc áo trắng bước đi với ta», đồng thời liên kết rõ với hình ảnh áo ở mệnh đề trước.
  terminology: «Sạt-đe», «làm ô uế», «áo», «bước đi», «ta/ngươi», và «xứng đáng» phù hợp với văn phong trang trọng hiện đại. Dùng «một vài người» là cách diễn đạt tiếng Việt thích hợp cho hoán dụ «một vài tên»; chú thích bảo lưu cách nói nguyên văn.
