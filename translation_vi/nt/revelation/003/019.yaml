id: REV.3.19
reference: Revelation 3:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: vi
  text: Còn Ta, những ai Ta yêu mến[a], Ta đều khiển trách và sửa dạy[b]. Vậy, hãy sốt sắng[c] và ăn năn!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bất cứ ai Ta yêu mến”.'
    reason: lexical_alternative
  - marker: b
    text: “Sửa dạy” ở đây bao hàm sự uốn nắn và giáo luyện nhằm sửa sai, chứ không chỉ là trừng phạt.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “hãy nhiệt thành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Còn Ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp có sắc thái nhấn mạnh. “Còn Ta” thể hiện độ nổi bật ấy một cách tự nhiên trong tiếng Việt; viết hoa “Ta” phù hợp với lời trực tiếp của Đấng Christ.
- source_word: ὅσους ἐὰν
  choice: những ai ... đều
  rationale: Kết cấu quan hệ bất định mang nghĩa “bất cứ ai / tất cả những người mà”; cặp “những ai ... đều” truyền đạt cả tính bất định lẫn phạm vi bao quát.
- source_word: φιλῶ
  choice: Ta yêu mến
  rationale: φιλέω chỉ tình yêu và sự trìu mến thực sự. “Yêu mến” tự nhiên, trang trọng và không áp đặt sự phân biệt kỹ thuật với ἀγαπάω.
- source_word: ἐλέγχω
  choice: Ta ... khiển trách
  rationale: Trong ngữ cảnh này, từ ngữ chỉ sự vạch lỗi và quở trách nhằm đưa người nghe đến thay đổi; “khiển trách” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: παιδεύω
  choice: sửa dạy
  rationale: Từ này bao gồm sự uốn nắn và giáo luyện mang tính sửa trị, không chỉ hình phạt. “Sửa dạy” giữ được cả hai phương diện sửa sai và đào luyện.
- source_word: ζήλευε
  choice: hãy sốt sắng
  rationale: Mệnh lệnh hiện tại kêu gọi một thái độ nhiệt thành, chuyên tâm liên tục. “Sốt sắng” diễn đạt tự nhiên cường độ của từ mà không giới hạn vào cảm xúc.
- source_word: οὖν
  choice: Vậy
  rationale: “Vậy” biểu thị kết luận từ việc tình yêu dẫn đến khiển trách và sửa dạy, đồng thời tự nhiên hơn “vì vậy” trong câu mệnh lệnh ngắn này.
- source_word: μετανόησον
  choice: hãy ... ăn năn
  rationale: “Ăn năn” là cách dịch chuẩn xác và quen thuộc cho sự thay đổi hướng đi về đạo đức và tâm linh; không thu hẹp nghĩa thành cảm giác hối tiếc đơn thuần.
theological_decisions:
- issue: Bản chất của φιλῶ trong mối liên hệ giữa tình yêu và sự sửa trị
  choice: Dịch là “yêu mến”, giữ nguyên tình yêu chân thật làm nền tảng cho việc khiển trách và sửa dạy.
  alternative: “thương” hoặc “có tình cảm với”
  rationale: “Yêu mến” giữ được sức nặng thần học của tình yêu mà không làm yếu thành sự ưa thích, cũng không du nhập một đối lập kỹ thuật giữa φιλέω và ἀγαπάω.
- issue: Ý nghĩa của παιδεύω
  choice: Dịch là “sửa dạy”, bao gồm cả uốn nắn và đào luyện.
  alternative: “trừng phạt”, “rèn luyện” hoặc “sửa phạt”
  rationale: “Trừng phạt” quá thiên về hình phạt, còn “rèn luyện” làm nhẹ yếu tố sửa sai. “Sửa dạy” bảo toàn tính chất vừa chỉnh sửa vừa hình thành của hành động.
- issue: Sắc thái của ζήλευε
  choice: Dịch là “hãy sốt sắng”.
  alternative: “hãy nhiệt thành” hoặc “hãy nghiêm túc”
  rationale: “Sốt sắng” giữ được sức mạnh của lời kêu gọi nhiệt thành mà không diễn giải cụ thể đối tượng của lòng sốt sắng, vốn không được nêu rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dịch giữ cấu trúc nhân-quả của οὖν, sắc thái nhấn mạnh của ἐγώ và hai mệnh lệnh mạnh ở cuối câu. Dùng dấu chấm than để truyền đạt lực mệnh lệnh chung mà không thêm nội dung.
