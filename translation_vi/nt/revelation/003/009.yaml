id: REV.3.9
reference: Revelation 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: vi
  text: Này, Ta ban cho con một số người từ hội đường của Sa-tan[a]—những kẻ tự xưng là người Do Thái mà không phải là người Do Thái, nhưng nói dối—này, Ta sẽ khiến họ đến và phủ phục trước chân con[b], và họ sẽ biết rằng Ta đã yêu con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Ta ban từ hội đường của Sa-tan”; cách diễn đạt này có lẽ chỉ một số người từ nhóm ấy sẽ được khiến phải đến.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đến và thờ lạy trước chân con.” Động từ Hy Lạp có thể mang nghĩa “phủ phục” hoặc “thờ lạy”; ở đây dùng “phủ phục” để không hàm ý rằng các tín hữu nhận sự thờ phượng dành cho Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Dùng thán từ trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt để thu hút sự chú ý; từ này xuất hiện hai lần và được giữ lại cả hai.
- source_word: διδῶ
  choice: Ta ban cho con
  rationale: Giữ thì hiện tại của động từ Hy Lạp và ý nghĩa trao ban. Bổ sung 'con' làm bổ ngữ gián tiếp theo văn cảnh lời Đức Chúa Giê-su phán với thiên sứ của hội thánh.
- source_word: ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: một số người từ hội đường của Sa-tan
  rationale: 'Cụm ''một số người'' được bổ sung để câu tiếng Việt rõ nghĩa, đồng thời giữ lực phân xuất của ἐκ: những người từ nhóm ấy, không nhất thiết toàn thể nhóm.'
- source_word: συναγωγῆς
  choice: hội đường
  rationale: Đây là cách gọi quen thuộc và chính xác trong tiếng Việt đối với nơi hoặc cộng đồng hội họp Do Thái trong văn cảnh này.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: những kẻ tự xưng là người Do Thái
  rationale: '''Tự xưng'' chuyển tải tự nhiên cấu trúc phản thân. ''Những kẻ'' phù hợp sắc thái luận chiến gay gắt của câu nhưng không thêm một phán đoán ngoài bản văn.'
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: mà không phải, nhưng đang nói dối
  rationale: Giữ nguyên sự đối lập sắc bén và sắc thái hiện tại của ψεύδονται, không diễn giải họ 'giả mạo' theo nghĩa sắc tộc.
- source_word: ποιήσω αὐτοὺς
  choice: Ta sẽ khiến họ
  rationale: Diễn đạt trực tiếp lực sai khiến của động từ ở thì tương lai.
- source_word: ἥξουσιν καὶ προσκυνήσουσιν
  choice: đến phủ phục
  rationale: '''Phủ phục'' biểu đạt cử chỉ hạ mình, quy phục của προσκυνέω mà không mặc nhiên biến hành động trước chân tín hữu thành sự thờ phượng dành cho thần linh.'
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: trước chân con
  rationale: Bám sát cấu trúc không gian của nguyên văn hơn 'dưới chân con', đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: họ sẽ biết rằng Ta đã yêu con
  rationale: Giữ quan hệ kết quả và thì quá khứ của ἠγάπησα; đại từ 'Ta/con' phù hợp lời Đấng Christ phán với người nhận.
theological_decisions:
- issue: Ý nghĩa của lời 'tự xưng là người Do Thái mà không phải'
  choice: Giữ nguyên lời phán xét luận chiến về căn tính được tuyên xưng, không giải thích đó là sự phủ nhận sắc tộc.
  alternative: Diễn giải thành định nghĩa hoàn toàn thuộc linh về người Do Thái, hoặc thành lời phủ nhận căn tính dân tộc của nhóm người này.
  rationale: Bản văn đưa ra một phán xét thần học gay gắt nhưng không giải thích cụ thể phương diện nào của căn tính bị phủ nhận. Bản dịch cần giữ sự căng thẳng ấy và tránh mở rộng thành tuyên bố chống người Do Thái.
- issue: Lực nghĩa của προσκυνήσουσιν trước chân tín hữu
  choice: Dịch là 'phủ phục' để chỉ cử chỉ quy phục hoặc tôn kính.
  alternative: Dịch là 'thờ lạy' hoặc 'thờ phượng'.
  rationale: Động từ có thể chỉ thờ phượng hoặc phủ phục. Vì hành động diễn ra trước chân người nhận, 'phủ phục' giữ được cử chỉ cụ thể mà không ngầm khẳng định tín hữu nhận sự thờ phượng thần linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ 'Ta—con' thể hiện lời Đấng Christ phán trực tiếp mà không quá cổ kính. Giữ nguyên hai lần 'này' để phản ánh cấu trúc nhấn mạnh của nguyên văn; giữ tính luận chiến nhưng không gia tăng sắc thái bài Do Thái.
