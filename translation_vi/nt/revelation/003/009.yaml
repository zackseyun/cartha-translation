  to: Này, Ta ban cho con một số người từ hội đường của Sa-tan[a]—những kẻ tự xưng là người Do Thái mà không phải là người Do Thái, nhưng nói dối—này, Ta sẽ khiến họ đến và phủ phục trước chân con[b], và họ sẽ biết rằng Ta đã yêu con.
