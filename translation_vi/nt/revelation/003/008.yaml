id: REV.3.8
reference: Revelation 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: vi
  text: Ta biết các việc làm của con. Này, ta đã đặt trước mặt con một cánh cửa đã được mở[a], không ai có thể đóng lại. Vì con có ít sức lực, con đã giữ lời ta và không chối danh ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cánh cửa đang mở.” Phân từ Hy Lạp cho biết cánh cửa đã được mở và hiện vẫn ở trạng thái mở.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Ta biết các việc làm của con
  rationale: οἶδα có hình thức hoàn thành nhưng mang nghĩa hiện tại; “biết” diễn đạt tự nhiên. “Các việc làm” giữ danh từ số nhiều ἔργα và công thức lặp lại trong Khải Huyền.
- source_word: ἰδοὺ
  choice: Này
  rationale: Dấu hiệu diễn ngôn thu hút sự chú ý; “Này” trang trọng, gọn và tự nhiên trong lời tuyên bố.
- source_word: δέδωκα ἐνώπιόν σου
  choice: ta đã đặt trước mặt con
  rationale: Cách nói này tự nhiên với hình ảnh cánh cửa, đồng thời giữ ý hành động đã hoàn tất và còn hiệu lực của thể hoàn thành.
- source_word: θύραν ἠνεῳγμένην
  choice: một cánh cửa đã được mở
  rationale: Giữ rõ lực động từ và trạng thái kết quả của phân từ hoàn thành bị động ἠνεῳγμένην, thay vì chỉ dùng tính từ “mở”.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: không ai có thể đóng lại
  rationale: “Có thể” diễn đạt khả năng của δύναται; “đóng lại” tự nhiên với cánh cửa và hàm ý đảo ngược trạng thái đã mở.
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: Vì con có ít sức lực
  rationale: ὅτι được hiểu theo quan hệ nguyên nhân. “Ít sức lực” giữ cách diễn đạt giảm nhẹ của nguyên văn, không biến thành “không có sức” hay xác định loại năng lực.
- source_word: καὶ ἐτήρησάς μου τὸν λόγον
  choice: nhưng vẫn giữ lời ta
  rationale: Trong ngữ cảnh, καί có thể mang sắc thái tương phản sau lời nhìn nhận về sức lực ít ỏi; “nhưng vẫn” làm rõ quan hệ diễn ngôn tự nhiên mà không đổi nội dung. “Giữ lời” bảo tồn độ rộng nghĩa của τηρέω và λόγος, gồm trung thành, tuân giữ và gìn giữ.
- source_word: καὶ οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: và không chối danh ta
  rationale: “Chối danh ta” giữ sát ἀρνέομαι và τὸ ὄνομά μου, bảo tồn ý nghĩa về sự công nhận và lòng trung thành mà không diễn giải thêm.
theological_decisions:
- issue: Ý nghĩa của hình ảnh “cánh cửa đã được mở”
  choice: Giữ nguyên hình ảnh, không xác định cánh cửa tượng trưng cho điều gì.
  alternative: Diễn giải là cơ hội truyền giáo, lối vào sự cứu rỗi/vương quốc, hoặc một cơ hội do Đức Chúa Trời ban.
  rationale: Câu này không tự giải thích ẩn dụ; bản dịch cần giữ sự rộng mở và căng thẳng thần học của hình ảnh.
- issue: Quan hệ giữa “ít sức lực” và sự trung thành
  choice: Dùng “nhưng vẫn” để biểu đạt sắc thái nhượng bộ/tương phản trong mạch câu.
  alternative: 'Nối thuần túy bằng “và”: “vì con có ít sức lực, và con đã giữ...”'
  rationale: 'καί về hình thức là “và”, nhưng trong ngữ cảnh có thể mang sắc thái tương phản: dù năng lực hạn chế, hội thánh vẫn trung thành. Cách dịch không biến “ít sức lực” thành lời chê trách hay điều kiện công trạng.'
- issue: Sắc thái thể hoàn thành
  choice: Dịch “đã đặt” và “đã được mở” để cho thấy hành động hoàn tất với kết quả còn tồn tại; dùng cách diễn đạt tự nhiên cho các hành động trung thành của hội thánh.
  alternative: Dùng toàn bộ thì quá khứ đơn hoặc thêm “đã” trước mọi động từ.
  rationale: Tiếng Việt không mã hóa thể như tiếng Hy Lạp; lặp “đã” trước mọi động từ sẽ nặng nề. Trạng thái kết quả được nêu rõ nhất tại hình ảnh cánh cửa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “ta—con” phù hợp lời Đấng Christ phán với hội thánh như một tập thể số ít. Giữ “danh ta” và “lời ta” để bảo tồn ngôn ngữ thần học cùng các liên hệ nội văn của Khải Huyền.
