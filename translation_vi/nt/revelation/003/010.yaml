revisions:
- from: Vì con đã giữ lời kiên trì của Ta[a], nên Ta cũng sẽ giữ con khỏi giờ thử thách[b] sắp đến trên toàn thế giới có người ở, để thử những kẻ sống trên đất.
  to: Vì con đã giữ lời Ta dạy về sự kiên trì[a], nên Ta cũng sẽ giữ con khỏi giờ thử thách[b] sắp đến trên toàn thế giới có người ở, để thử những người cư ngụ trên đất.
  rationale: Sửa hai chỗ để tiếng Việt hiện đại tự nhiên và chính xác hơn, đồng thời giữ nguyên ý nghĩa, quan hệ từ vựng, sắc thái khải huyền, và sự không xác định thần học của nguyên văn. Cách dịch chính về «lời ... sự kiên trì» chọn một cách diễn đạt tiếng Việt dễ hiểu; chú thích nêu các khả năng gần nhau của cụm Hy Lạp.
