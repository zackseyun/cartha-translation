id: REV.3.10
reference: Revelation 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: vi
  text: Vì con đã giữ lời Ta dạy về sự kiên trì[a], nên Ta cũng sẽ giữ con khỏi giờ thử thách[b] sắp đến trên toàn thế giới có người ở, để thử những người cư ngụ trên đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời về sự kiên trì của Ta” hoặc “lời Ta kêu gọi phải kiên trì.” Cụm từ Hy Lạp có thể được hiểu theo vài cách gần nhau.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “Ta sẽ gìn giữ con qua giờ thử thách” hoặc “Ta sẽ giữ con ở ngoài giờ thử thách.” Tiếng Hy Lạp nói “giữ… khỏi” và tự nó không phân định các cuộc tranh luận thần học về cách sự bảo vệ này diễn ra.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: đã giữ
  rationale: Diễn đạt tự nhiên thể aorist trong mệnh đề nguyên nhân và giữ được mối liên hệ từ vựng với τηρήσω ở vế sau.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: lời kiên trì của Ta
  rationale: 'Cách dịch tương đối sát, cô đọng và không hoàn toàn khép lại quan hệ sở hữu cách: đó có thể là lời nói về sự kiên trì của Chúa Giê-xu, lời mang đặc tính kiên trì, hoặc lời kêu gọi người nghe kiên trì.'
- source_word: κἀγώ
  choice: Ta cũng
  rationale: 'Thể hiện sắc thái nhấn mạnh và tương ứng: vì họ đã giữ, nên chính Ngài cũng sẽ giữ.'
- source_word: τηρήσω ἐκ
  choice: sẽ giữ con khỏi
  rationale: Phản ánh trực tiếp τηρέω + ἐκ mà không tự quyết định cơ chế bảo vệ trong cuộc tranh luận cánh chung.
- source_word: ὥρας
  choice: giờ
  rationale: Giữ hình ảnh thời gian của nguyên ngữ và lối diễn đạt khải huyền, dù từ này cũng có thể chỉ một thời kỳ.
- source_word: πειρασμοῦ
  choice: thử thách
  rationale: Bao quát ý thử nghiệm và hoạn nạn trong ngữ cảnh, đồng thời tránh thu hẹp thành sự cám dỗ về đạo đức.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: sắp đến
  rationale: Diễn đạt tự nhiên ý tương lai gần hoặc sự việc đang chờ xảy đến của μέλλω + động từ nguyên mẫu.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: trên toàn thế giới có người ở
  rationale: Phân biệt οἰκουμένη, tức thế giới có cư dân, với cách nói rộng hơn về toàn thể vũ trụ, dù cấu trúc vẫn dễ hiểu trong tiếng Việt.
- source_word: πειράσαι
  choice: để thử
  rationale: Giữ quan hệ mục đích của động từ nguyên mẫu và sự liên kết từ vựng với πειρασμοῦ.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: những kẻ sống trên đất
  rationale: Giữ dạng diễn đạt bằng động từ và âm hưởng của cụm từ lặp lại trong sách Khải Huyền.
theological_decisions:
- issue: Ý nghĩa của τηρήσω ἐκ trong bối cảnh cánh chung
  choice: sẽ giữ con khỏi
  alternative: sẽ gìn giữ con qua; sẽ giữ con ở ngoài
  rationale: Bản dịch theo cấu trúc từ vựng trực tiếp nhưng không xác định lời hứa có nghĩa là được đưa đi trước, được bảo vệ xuyên qua, hay được miễn khỏi tác động của giờ thử thách.
- issue: Quan hệ sở hữu cách trong τὸν λόγον τῆς ὑπομονῆς μου
  choice: lời kiên trì của Ta
  alternative: lời về sự kiên trì của Ta; lời Ta kêu gọi phải kiên trì
  rationale: Nguyên ngữ cho phép vài cách hiểu gần nhau; câu chính giữ độ mở thay vì chọn dứt khoát một sắc thái thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp; dùng đại từ “Ta—con” phù hợp lời Đấng Christ phán với hội thánh. Giữ “giờ” và các cấu trúc lặp từ để duy trì âm hưởng khải huyền cùng liên kết nội tại của câu.
