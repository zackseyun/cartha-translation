id: REV.3.2
reference: Revelation 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: vi
  text: Hãy tỉnh dậy[a] và củng cố những gì còn lại, vốn sắp chết, vì ta thấy các công việc của ngươi chưa được hoàn tất trước mặt Đức Chúa Trời của ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tỉnh thức.”'
    reason: γρηγορέω có thể nhấn mạnh việc thức dậy hoặc duy trì trạng thái tỉnh thức/cảnh giác.
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Hãy tỉnh dậy
  rationale: Cụm này theo sát ý ‘hãy trở nên tỉnh thức/đang thức’; trong lời cảnh tỉnh gửi Hội Thánh Sạt-đe, ‘tỉnh dậy’ tự nhiên và truyền đạt rõ hình ảnh đối lập với tình trạng chết ở câu trước.
- source_word: στήρισον
  choice: củng cố
  rationale: Diễn đạt hành động làm cho phần còn lại trở nên vững chắc, mạnh mẽ hơn.
- source_word: τὰ λοιπὰ
  choice: những gì còn lại
  rationale: Giữ tính khái quát của danh từ trung tính số nhiều, không tự ý xác định đó là người, việc hay phẩm chất.
- source_word: ἔμελλον ἀποθανεῖν
  choice: vốn sắp chết
  rationale: Giữ sắc thái tình trạng cận kề cái chết của μέλλω với động từ nguyên mẫu ‘chết’.
- source_word: τὰ ἔργα πεπληρωμένα
  choice: các công việc ... được hoàn tất
  rationale: Phản ánh πεπληρωμένα ở thể hoàn thành bị động, với ý các công việc chưa đạt đến sự hoàn thành.
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: trước mặt Đức Chúa Trời của ta
  rationale: Giữ nguyên quan hệ sở hữu ‘của ta’ và hình ảnh đứng trước sự nhìn nhận/phán xét của Đức Chúa Trời.
theological_decisions:
- issue: Đối tượng của ‘những gì còn lại’
  choice: Giữ cách nói khái quát ‘những gì còn lại’
  alternative: ‘những người còn lại’ hoặc ‘những việc còn lại’
  rationale: Nguyên văn dùng dạng trung tính số nhiều và không xác định rõ đối tượng; bản dịch không nên thu hẹp nghĩa.
- issue: Ý nghĩa của πεπληρωμένα
  choice: ‘được hoàn tất’
  alternative: ‘trọn vẹn’ hoặc ‘đầy đủ’
  rationale: Cách dịch này bảo toàn ý hoàn thành mà không diễn giải thành sự hoàn hảo đạo đức hay một học thuyết riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp; dùng ‘ta/ngươi’ để phản ánh lời phán có thẩm quyền trong ngữ cảnh Khải Huyền. Dấu chân chú [a] được đặt ngay sau cụm từ liên quan.
