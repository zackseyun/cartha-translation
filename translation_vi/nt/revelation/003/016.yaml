id: REV.3.16
reference: Revelation 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: vi
  text: Vậy, vì ngươi hâm hẩm, không nóng cũng không lạnh, ta sắp mửa[a] ngươi ra khỏi miệng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nôn ngươi ra khỏi miệng ta.” Động từ Hy Lạp chỉ hành động mửa hoặc nôn, mạnh hơn “nhổ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Vậy
  rationale: Diễn tả kết luận/hệ quả từ lời ở câu trước bằng một từ nối tự nhiên trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân dẫn đến lời phán xét sắp được tuyên bố.
- source_word: χλιαρός
  choice: hâm hẩm
  rationale: Diễn đạt trạng thái nhiệt độ ở giữa nóng và lạnh, tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: không nóng cũng không lạnh
  rationale: Giữ nguyên cặp tương phản của nguyên văn mà không diễn giải thêm ý nghĩa ẩn dụ.
- source_word: μέλλω
  choice: ta sắp
  rationale: Thể hiện hành động đang cận kề, bảo toàn tính khẩn cấp của lời cảnh báo.
- source_word: ἐμέσαι
  choice: nôn
  rationale: Tương đương trực tiếp với động từ Hy Lạp chỉ việc nôn/mửa, giữ nguyên hình ảnh mạnh thay vì làm nhẹ thành 'nhổ'.
- source_word: ἐκ τοῦ στόματός μου
  choice: ra khỏi miệng ta
  rationale: Giữ hình ảnh thân thể sống động và hướng chuyển động ra ngoài trong nguyên văn.
theological_decisions:
- issue: Mức độ mạnh của hình ảnh phán xét trong ἐμέσαι
  choice: Giữ hình ảnh trực diện bằng từ “nôn”.
  alternative: nhổ; phun
  rationale: Nguyên văn cố ý dùng hình ảnh gây sốc về sự loại bỏ; dùng từ nhẹ hơn sẽ làm suy giảm sức nặng tu từ và thần học của lời cảnh báo.
- issue: Giá trị thời gian của μέλλω
  choice: Dịch là “sắp” để chỉ hành động cận kề.
  alternative: sẽ; định
  rationale: Cách dịch này giữ tính sắp xảy ra của lời phán xét mà không biến nó thành một tuyên bố chung chung hoặc chỉ nói về ý định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. Đại từ “ta—ngươi” giữ ngôi số ít và sắc thái của lời phán uy nghiêm; không viết hoa đại từ để tránh đưa quy ước hệ phái vào bản dịch. Cấu trúc “Vậy, vì…” giữ cả lực suy luận của οὕτως lẫn quan hệ nguyên nhân của ὅτι.
