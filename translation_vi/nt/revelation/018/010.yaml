id: REV.18.10
reference: Revelation 18:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: vi
  text: 'Họ đứng ở xa vì sợ sự hành hạ mà thành ấy phải chịu, và nói:


    “Khốn thay, khốn thay, thành lớn, Ba-by-lôn, thành hùng mạnh! Vì chỉ trong một giờ, sự phán xét của ngươi đã đến.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: Họ đứng từ xa
  rationale: Diễn tả tự nhiên trạng thái đứng ở một khoảng cách; thể hoàn thành của ἑστηκότες nhấn vào tư thế/trạng thái hơn là hành động đứng dậy.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: vì sợ sự đau đớn mà nó phải chịu
  rationale: διά với đối cách chỉ nguyên nhân. βασανισμός nói đến sự đau đớn dữ dội; cách diễn đạt này làm rõ đại từ giống cái quy về thành phố mà không hàm ý thành phố là một nhân vật nữ theo nghĩa đen.
- source_word: Οὐαὶ οὐαί
  choice: Khốn thay! Khốn thay!
  rationale: Giữ được cả sắc thái than khóc lẫn lời báo họa của thán từ trong văn phong tiên tri–khải huyền.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: Thành vĩ đại
  rationale: Chuyển cấu trúc mạo từ lặp lại sang cụm từ tiếng Việt tự nhiên, vẫn giữ sắc thái nổi bật của tính từ.
- source_word: Βαβυλὼν
  choice: Ba-by-lôn
  rationale: Phiên âm tên riêng theo dạng quen thuộc và dễ đọc trong tiếng Việt.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: thành hùng mạnh
  rationale: ἰσχυρά có thể chỉ sự mạnh mẽ, quyền thế hoặc hùng mạnh; “hùng mạnh” tự nhiên khi mô tả một thành phố có thế lực.
- source_word: μιᾷ ὥρᾳ
  choice: chỉ trong một giờ
  rationale: Giữ ý nghĩa thời gian của cách dữ cách và dùng “chỉ” để truyền đạt sự đột ngột được nhấn mạnh trong ngữ cảnh.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: sự phán xét dành cho ngươi đã đến
  rationale: ἦλθεν được diễn đạt bằng “đã đến” để chỉ sự phán xét nay đã xảy đến; “dành cho ngươi” khiến sở hữu cách σου tự nhiên và rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của thán từ khải huyền οὐαί
  choice: Khốn thay! Khốn thay!
  alternative: Ôi than ôi!
  rationale: “Khốn thay” bảo toàn sức nặng của lời báo họa đồng thời vẫn có thể biểu đạt than khóc, không thu hẹp câu chỉ còn là lời tiếc thương.
- issue: Quan hệ của βασανισμός với Ba-by-lôn
  choice: sự đau đớn mà nó phải chịu
  alternative: sự hành hạ nó
  rationale: Cách chọn không xác định cơ chế gây đau đớn và tránh làm từ này hẹp lại thành hành vi tra tấn cụ thể; đồng thời cho thấy đây là đau đớn giáng trên thành phố được nhân cách hóa.
- issue: Ý nghĩa của κρίσις
  choice: sự phán xét
  alternative: án phạt
  rationale: “Sự phán xét” giữ phạm vi nghĩa của κρίσις và không tự động đồng nhất hành động xét xử với riêng hình phạt, dù ngữ cảnh rõ ràng là phán xét bất lợi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ nhịp điệu lời than trong văn chương khải huyền. Đại từ “ngươi” được dùng trong lời trực tiếp hướng đến thành phố đã được nhân cách hóa; “nó” ở phần tường thuật giúp tiếng Việt tự nhiên và không áp đặt giới tính.
