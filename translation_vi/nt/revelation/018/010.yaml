revisions:
- from: 'Họ đứng từ xa vì sợ sự đau đớn mà nó phải chịu, và nói:


    “Khốn thay! Khốn thay! Thành vĩ đại,

    Ba-by-lôn, thành hùng mạnh!

    Vì chỉ trong một giờ, sự phán xét dành cho ngươi đã đến.”'
  to: 'Họ đứng ở xa vì sợ sự hành hạ mà thành ấy phải chịu, và nói:


    “Khốn thay, khốn thay, thành lớn, Ba-by-lôn, thành hùng mạnh! Vì chỉ trong một giờ, sự phán xét của ngươi đã đến.”'
  rationale: Bản chỉnh sửa tăng độ sát nghĩa của βασανισμός bằng «sự hành hạ», làm rõ quy chiếu αὐτῆς bằng «thành ấy», và dịch sát hơn κρίσις σου là «sự phán xét của ngươi». Các thay đổi về «ở xa», «thành lớn» và dấu câu giúp câu văn hiện đại, tự nhiên, đồng thời giữ nhịp than vãn–báo họa của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính của câu: những người đứng ở xa, nguyên nhân là sợ sự βασανισμός của Ba-by-lôn, lời than «οὐαὶ οὐαί», và sự phán xét đến trong một giờ. Tuy nhiên, «sự đau đớn mà nó phải chịu» yếu hơn βασανισμός và dùng «nó» kém thích hợp trong văn phong trang trọng khi quy chiếu thành phố được nhân cách hóa. Cụm «sự phán xét dành cho ngươi» có thể hiểu là một phán xét được chuẩn bị cho Ba-by-lôn, trong khi σου trực tiếp xác định phán xét ấy thuộc/về Ba-by-lôn; «sự phán xét của ngươi» sát nguồn hơn.'
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên và nhất quán hơn: «đứng từ xa» nên là «đứng ở xa»; «thành vĩ đại» hơi gượng đối với πόλις μεγάλη trong lời than, còn «thành lớn» tự nhiên và sát nghĩa. «Khốn thay, khốn thay» nên đặt trong cùng một nhịp câu thay vì tách thành hai câu cảm thán.'
  terminology: «Sự hành hạ» là cách dịch phù hợp hơn cho βασανισμός trong Khải Huyền, vẫn không định rõ cơ chế. Giữ «Ba-by-lôn», «thành hùng mạnh», «sự phán xét», và đại từ trực tiếp «ngươi» là thích hợp. Không cần chú thích vì các lựa chọn tiếng Việt không tạo mơ hồ đáng kể cần neo chú thích.
  issues:
  - severity: medium
    issue: «sự đau đớn mà nó phải chịu» cho τοῦ βασανισμοῦ αὐτῆς
    rationale: βασανισμός chỉ sự hành hạ/đau khổ khốc liệt, không chỉ cảm giác đau đớn. «Nó» cũng làm suy giảm sắc thái nhân cách hóa và không hợp bằng «thành ấy» trong văn phong trang trọng.
  - severity: medium
    issue: «sự phán xét dành cho ngươi» cho ἡ κρίσις σου
    rationale: Cách nói này có thể gợi một sự phán xét được dành sẵn cho đối tượng. «Sự phán xét của ngươi» bảo toàn quan hệ sở hữu/quy chiếu trực tiếp của σου mà không thêm sắc thái.
  - severity: low
    issue: «Thành vĩ đại» và «đứng từ xa»
    rationale: Không sai nghĩa, nhưng «thành lớn» và «đứng ở xa» tự nhiên hơn trong tiếng Việt hiện đại, đồng thời vẫn truyền đạt πόλις μεγάλη và ἀπὸ μακρόθεν.
