id: REV.18.23
reference: Revelation 18:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: vi
  text: Ánh sáng của ngọn đèn sẽ chẳng còn chiếu sáng trong ngươi nữa, và tiếng của chú rể và cô dâu sẽ chẳng còn được nghe trong ngươi nữa; vì các thương gia của ngươi là những người quyền thế trên đất[b], vì muôn dân đã bị tà thuật của ngươi[a] làm cho lầm lạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “phép thuật” hoặc “phù phép.” Từ Hy Lạp φαρμακεία chỉ tà thuật hay những thực hành ma thuật có sức mê hoặc, lừa dối.
    reason: lexical_alternative
  - marker: b
    text: Hay “những nhân vật lớn trên đất.” Từ Hy Lạp chỉ những người có địa vị, ảnh hưởng hoặc quyền lực lớn.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: ánh đèn
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu trong tiếng Hy Lạp, chỉ ánh sáng phát ra từ đèn; ngắn gọn và phù hợp văn cảnh.
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: sẽ không bao giờ còn chiếu sáng ... nữa
  rationale: Cấu trúc οὐ μή với động từ giả định mang sức phủ định mạnh; cách dịch này truyền đạt tính dứt khoát và vĩnh viễn của sự phán xét.
- source_word: ἐν σοὶ
  choice: trong ngươi
  rationale: Giữ lối xưng hô trực tiếp với Ba-by-lôn được nhân cách hóa, thay vì diễn giải thành “giữa thành ngươi”.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: tiếng chú rể và cô dâu
  rationale: φωνή có thể là “tiếng” hoặc “giọng”; “tiếng” tự nhiên hơn trong tiếng Việt và vẫn giữ âm vang của ngôn ngữ phán xét trong các sách tiên tri.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: sẽ không bao giờ còn được nghe ... nữa
  rationale: Giữ thể bị động của tiếng Hy Lạp và sức phủ định mạnh, nhấn mạnh sự chấm dứt không thể đảo ngược.
- source_word: οἱ ἔμποροί σου
  choice: các thương gia của ngươi
  rationale: ἔμποροι chỉ những người buôn bán; “thương gia” phù hợp chủ đề thương mại xuyên suốt Khải Huyền 18.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: những người quyền thế trên đất
  rationale: μεγιστᾶνες chỉ những người nổi bật, có địa vị hoặc quyền lực; “người quyền thế” tự nhiên và không thu hẹp họ thành giới quý tộc hay tài phiệt.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: bị tà thuật của ngươi
  rationale: φαρμακεία trong văn cảnh này chỉ phép thuật hoặc phù phép dùng để mê hoặc; “tà thuật” rõ nghĩa, trang trọng và không bị hiểu sai theo nghĩa dược phẩm hiện đại.
- source_word: ἐπλανήθησαν
  choice: bị ... làm cho lầm lạc
  rationale: Giữ ý nghĩa bị dẫn sai đường hoặc bị lừa dối của thể bị động, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: πάντα τὰ ἔθνη
  choice: muôn dân
  rationale: Cách nói trang trọng, quen thuộc, diễn đạt toàn thể các dân tộc mà không giới hạn vào một nhóm sắc tộc hay tôn giáo.
theological_decisions:
- issue: Ý nghĩa của φαρμακεία trong lời phán xét mang tính khải huyền
  choice: tà thuật
  alternative: phép thuật; phù phép
  rationale: Từ này có thể gợi đến bùa chú, dược liệu hoặc độc dược dùng trong thực hành ma thuật, nhưng trọng tâm ở đây là quyền lực mê hoặc và làm lầm lạc các dân. “Tà thuật” giữ sắc thái đạo đức-tôn giáo mà không quy giản thành việc dùng thuốc.
- issue: Sức mạnh của hai cấu trúc οὐ μή lặp lại
  choice: sẽ không bao giờ còn ... nữa
  alternative: sẽ chẳng còn ... nữa; chắc chắn sẽ không còn
  rationale: Cách dịch được chọn thể hiện tính dứt khoát, vĩnh viễn của sự phán xét trên Ba-by-lôn mà vẫn tự nhiên trong tiếng Việt.
- issue: Tác nhân và trách nhiệm trong ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν
  choice: muôn dân đã bị tà thuật của ngươi làm cho lầm lạc
  alternative: ngươi đã dùng tà thuật khiến muôn dân lầm lạc
  rationale: Giữ thể bị động và trọng tâm của nguyên văn nơi các dân bị dẫn lạc, đồng thời vẫn quy nguyên nhân cho tà thuật của Ba-by-lôn mà không diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ cách xưng “ngươi” vì Ba-by-lôn được nhân cách hóa và trực tiếp bị tuyên án. Nhịp câu song song bảo tồn sắc thái lời phán xét. Các dấu chú thích được đặt ngay sau đúng thuật ngữ cần giải thích.
