revisions:
- from: Ánh đèn sẽ không bao giờ còn chiếu sáng trong ngươi, tiếng chú rể và cô dâu cũng sẽ không bao giờ còn được nghe trong ngươi nữa; vì các thương gia của ngươi từng là những người quyền thế trên đất[a], và vì muôn dân đã bị tà thuật của ngươi làm cho lầm lạc[b].
  to: Ánh sáng của ngọn đèn sẽ chẳng còn chiếu sáng trong ngươi nữa, và tiếng của chú rể và cô dâu sẽ chẳng còn được nghe trong ngươi nữa; vì các thương gia của ngươi là những người quyền thế trên đất[b], vì muôn dân đã bị tà thuật của ngươi[a] làm cho lầm lạc.
  rationale: Bản sửa bảo tồn cấu trúc song song và sắc thái phán xét của nguyên văn, loại bỏ hàm ý không cần thiết của “từng”, làm trôi chảy hai mệnh đề phủ định, và đưa các ký hiệu chú thích về đúng thuật ngữ tương ứng trong audit trail tiếng Anh. Không thay đổi ý nghĩa thần học hay diễn giải thêm về đối tượng được gọi là “ngươi”.
