  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung truyền đạt đúng các thành tố của nguyên văn: sự phủ định nhấn mạnh lặp lại, lối xưng hô với thành bị nhân cách hóa, giới thương nhân quyền thế, và việc mọi dân bị dẫn lạc bởi φαρμακεία. Tuy nhiên, “từng là” có thể hàm ý không còn là người quyền thế, trong khi ἦσαν ở đây không nhất thiết xác định sự thay đổi địa vị; nên dùng “là”. Các ký hiệu chú thích cũng cần được đồng bộ với audit trail tiếng Anh: a cho φαρμακεία và b cho μεγιστᾶνες.'
  naturalness: “Sẽ không bao giờ còn ... nữa” hiểu được nhưng có phần chồng lặp trong tiếng Việt. “Sẽ chẳng còn ... nữa” vừa tự nhiên, vừa vẫn thể hiện lực phủ định mạnh của οὐ μή ... ἔτι. “Ánh sáng của ngọn đèn” phản ánh rõ hơn cấu trúc φῶς λύχνου.
  terminology: Giữ “ngươi” phù hợp với Ba-by-lôn được nhân cách hóa; “thương gia”, “người quyền thế”, và “tà thuật” đều thích hợp với văn mạch. “Tà thuật” là cách dịch an toàn cho φαρμακεία; chú thích nêu các phương án “phép thuật/phù phép” mà không quy từ này về nghĩa dược phẩm hiện đại.
