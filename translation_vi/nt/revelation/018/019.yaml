revisions:
- from: 'Họ tung bụi lên đầu mình, rồi vừa khóc lóc, than van vừa lớn tiếng kêu rằng: “Khốn thay! Khốn thay[a] cho thành lớn, nơi tất cả những người có tàu trên biển đã trở nên giàu có nhờ sự giàu sang của nó[b]! Vì chỉ trong một giờ, nó đã bị tàn phá.”'
  to: 'Họ tung bụi lên đầu mình, rồi vừa khóc lóc vừa than khóc mà lớn tiếng kêu lên rằng: “Khốn thay! Khốn thay![a] Thành lớn ấy, nơi tất cả những người có tàu trên biển đã trở nên giàu có nhờ sự xa hoa của nó[b], vì chỉ trong một giờ, nó đã bị tàn phá.”'
  rationale: Sửa “than van” thành “than khóc” để phản ánh chính xác πενθοῦντες; điều chỉnh cấu trúc câu cho tự nhiên hơn; đặt lại neo chú thích a cho đúng phạm vi. “Sự xa hoa” được chọn cho τιμιότης để giữ sắc thái giá trị đắt giá/tráng lệ trong lời than thương mại, với các cách hiểu kinh tế và mỹ lệ được bảo lưu trong chú thích. Không có thay đổi giáo lý hay diễn giải vượt nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: cử chỉ rải bụi, tiếng kêu than, thành lớn, những người có tàu trên biển, sự hủy diệt xảy ra trong một giờ, và thể bị động đều được giữ lại. Tuy nhiên, “than van” dễ gợi ý nài xin hoặc oán trách hơn là πενθοῦντες (đau buồn/than khóc).'
  naturalness: Câu hiện tại có nhịp văn phù hợp, nhưng cấu trúc “vừa khóc lóc, than van vừa lớn tiếng kêu” chưa thật cân xứng trong tiếng Việt. Đặt dấu chú thích sau trọn công thức lặp “Khốn thay! Khốn thay!” cũng rõ phạm vi hơn.
  terminology: “Khốn thay” phù hợp với Οὐαί trong sắc thái than khóc và phán xét. “Thành lớn” và “bị tàn phá” phù hợp văn cảnh Khải Huyền. “Sự giàu sang” có thể dùng, nhưng “sự xa hoa” phản ánh rõ hơn τιμιότης, vốn nhấn vào giá trị đắt giá, sự tráng lệ hoặc xa xỉ mà thành đem lại.
  issues:
  - severity: medium
    issue: “than van” không phản ánh chính xác πενθοῦντες.
    rationale: πενθέω chỉ sự đau buồn, để tang, than khóc; “than van” trong tiếng Việt hiện đại thường có thể gợi việc kêu ca hoặc nài xin. “Than khóc” giữ đúng trường nghĩa tang thương và vẫn phân biệt được với “khóc lóc.”
  - severity: low
    issue: Cấu trúc phối hợp các phân từ chưa thật tự nhiên.
    rationale: “vừa khóc lóc, than van vừa lớn tiếng kêu” thiếu sự song hành rõ ràng. “vừa khóc lóc vừa than khóc mà lớn tiếng kêu lên” diễn đạt mạch lạc hơn mà không thay đổi quan hệ của các phân từ Hy Lạp.
  - severity: low
    issue: Neo chú thích a chỉ đặt sau tiếng “Khốn thay” thứ hai.
    rationale: Chú thích giải thích toàn bộ công thức lặp Οὐαὶ οὐαί; đặt neo sau trọn cụm cảm thán giúp phạm vi chú thích rõ ràng hơn.
