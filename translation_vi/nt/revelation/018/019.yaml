id: REV.18.19
reference: Revelation 18:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: vi
  text: 'Họ tung bụi lên đầu mình, rồi vừa khóc lóc vừa than khóc mà lớn tiếng kêu lên rằng: “Khốn thay! Khốn thay![a] Thành lớn ấy, nơi tất cả những người có tàu trên biển đã trở nên giàu có nhờ sự xa hoa của nó[b], vì chỉ trong một giờ, nó đã bị tàn phá.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ôi! Ôi!” Từ cảm thán Hy Lạp vừa có thể diễn tả lời than, vừa mang âm hưởng công bố tai họa; “Khốn thay” giữ rõ hơn sắc thái phán xét mang tính tiên tri.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự giàu sang” hoặc “vẻ huy hoàng.” Từ Hy Lạp có thể chỉ tính đắt giá, sự tráng lệ hoặc sự giàu có.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: Họ tung bụi lên đầu mình
  rationale: Diễn đạt tự nhiên hành động tung bụi lên đầu như một cử chỉ tang chế, đồng thời giữ nguyên hình ảnh cụ thể của tiếng Hy Lạp.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: vừa khóc lóc, than van vừa lớn tiếng kêu
  rationale: Phân biệt κλαίοντες là khóc lóc, πενθοῦντες là than van vì đau buồn, và giữ cường độ của ἔκραξαν bằng “lớn tiếng kêu”.
- source_word: Οὐαὶ οὐαί
  choice: Khốn thay! Khốn thay
  rationale: Giữ được cả sắc thái than khóc lẫn âm hưởng phán xét mang tính tiên tri; cách nói trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: thành lớn
  rationale: Cách dịch gọn, tự nhiên của cụm danh từ xác định, phù hợp văn phong Khải Huyền.
- source_word: ἐν ᾗ
  choice: nơi
  rationale: Giữ nghĩa địa điểm gần với nguyên văn “trong đó/nơi đó” mà không chuyển hẳn sang nghĩa công cụ.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: tất cả những người có tàu trên biển
  rationale: Bám sát động từ “có” mà không xác định quá mức rằng họ nhất thiết là chủ sở hữu; “trên biển” giữ hình ảnh nguyên văn.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: nhờ sự giàu sang của nó
  rationale: Trong bối cảnh thương mại, “sự giàu sang” truyền đạt giá trị, sự đắt giá và vẻ xa hoa của thành; chú thích giữ lại các sắc thái từ vựng khác.
- source_word: μιᾷ ὥρᾳ
  choice: chỉ trong một giờ
  rationale: Từ “chỉ” làm rõ sức nhấn của cách nói về sự hủy diệt đột ngột mà không thay đổi khoảng thời gian trong nguyên văn.
- source_word: ἠρημώθη
  choice: nó đã bị tàn phá
  rationale: Giữ thể bị động và kết quả của hành động làm cho hoang tàn; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Công thức than khóc Οὐαὶ οὐαί trong bối cảnh phán xét khải huyền
  choice: Khốn thay! Khốn thay
  alternative: Ôi! Ôi!
  rationale: “Khốn thay” bảo toàn sự đan xen giữa lời than và lời công bố tai họa/phán xét, thay vì làm nhẹ câu thành một tiếng than buồn thuần túy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp điệu dồn dập của lời than trong văn khải huyền; “thành” duy trì sắc thái Kinh Thánh mà không cổ hóa quá mức. Đại từ “nó” tự nhiên trong tiếng Việt và không cố tái tạo giống ngữ pháp giống cái của πόλις.
