id: REV.18.12
reference: Revelation 18:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: vi
  text: hàng hóa gồm vàng, bạc, đá quý, ngọc trai, vải lanh mịn, vải tím, lụa, vải đỏ thắm; đủ loại gỗ thơm quý[a], đủ loại đồ vật bằng ngà, đủ loại đồ vật làm bằng gỗ vô cùng quý, đồng, sắt và đá cẩm thạch,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ chỉ một loại gỗ quý có hương thơm, theo truyền thống thường được gọi là “gỗ thyine”; loài cây cụ thể không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: hàng hóa
  rationale: Danh từ chỉ hàng hoặc kiện hàng chuyên chở trên tàu; trong danh sách thương mại này, “hàng hóa” tự nhiên hơn “kiện hàng” và giữ được nghĩa tập hợp.
- source_word: λίθου τιμίου
  choice: đá quý
  rationale: Dạng số ít Hy Lạp có chức năng chỉ chất liệu hoặc loại hàng nói chung; “đá quý” trong tiếng Việt cũng có thể mang nghĩa tập hợp tự nhiên.
- source_word: μαργαριτῶν
  choice: ngọc trai
  rationale: Cách gọi thông dụng, phù hợp với danh từ số nhiều Hy Lạp mà tiếng Việt không cần đánh dấu số.
- source_word: βυσσίνου
  choice: vải gai mịn
  rationale: Chỉ loại vải lanh mịn, sang trọng; “vải gai mịn” là cách diễn đạt dễ hiểu trong tiếng Việt hiện đại.
- source_word: πορφύρας
  choice: vải tím
  rationale: Từ này có thể chỉ thuốc nhuộm, màu tím hay vải tím; trong danh mục hàng hóa, “vải tím” thể hiện rõ món hàng nhưng không xác định quá mức loại vải.
- source_word: σιρικοῦ
  choice: lụa
  rationale: Nghĩa thông dụng là lụa hoặc hàng bằng lụa; “lụa” ngắn gọn và tự nhiên trong danh sách thương phẩm.
- source_word: κοκκίνου
  choice: vải đỏ thắm
  rationale: Chỉ vật liệu có màu đỏ thắm; thêm “vải” theo ngữ cảnh các mặt hàng dệt may.
- source_word: πᾶν ξύλον θύϊνον
  choice: đủ loại gỗ thơm quý
  rationale: θύϊνος chỉ một loại gỗ đắt giá và có hương thơm nhưng việc xác định chính xác loài cây không chắc chắn; bản dịch mô tả giữ thông tin cốt lõi và tránh gán chắc là gỗ citron.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: đủ loại đồ vật bằng ngà
  rationale: σκεῦος là từ rộng, có thể chỉ vật dụng, đồ chứa hoặc đồ chế tác; “đồ vật” giữ độ rộng tốt hơn “bình” hay “vật chứa”.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: đủ loại đồ vật làm bằng gỗ cực quý
  rationale: Giữ cấu trúc lặp và thể hiện τιμιωτάτου ở dạng so sánh cao nhất bằng “cực quý” theo cách tự nhiên.
- source_word: χαλκοῦ
  choice: đồng
  rationale: χαλκός có thể là đồng đỏ hoặc đồng hợp kim; “đồng” giữ được độ rộng từ vựng trong tiếng Việt.
- source_word: σιδήρου
  choice: sắt
  rationale: Nghĩa trực tiếp và thông dụng.
- source_word: μαρμάρου
  choice: đá cẩm thạch
  rationale: Cách gọi thông dụng của marble trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ dạng danh sách nối tiếp từ câu trước. Dùng “đủ loại đồ vật” thay cho thuật ngữ hẹp để bảo toàn phạm vi nghĩa của σκεῦος; dấu phẩy cuối cho thấy câu còn tiếp.
