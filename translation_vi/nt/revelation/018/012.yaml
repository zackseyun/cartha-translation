  source_fidelity: Bản dịch nhìn chung bám sát danh mục hàng hóa trong nguyên ngữ, giữ được tính tập hợp của γόμον, phạm vi rộng của σκεῦος qua “đồ vật”, và sắc thái so sánh cao nhất của τιμιωτάτου. Tuy nhiên, βυσσίνου là vải lanh/vải gai lanh mịn, không phải “vải gai mịn”; “vải gai” trong tiếng Việt thường gợi sợi gai (hemp/ramie) và do đó dễ sai chất liệu.
  naturalness: Cấu trúc liệt kê, dấu chấm phẩy và dấu phẩy cuối đều tự nhiên, phù hợp vì câu tiếp diễn từ câu trước và sang câu sau. “Vải lanh mịn” là cách nói hiện đại, rõ nghĩa và trang trọng hơn trong ngữ cảnh này.
  terminology: “Đá quý,” “ngọc trai,” “vải tím,” “lụa,” “vải đỏ thắm,” “đồ vật bằng ngà,” “đồng,” “sắt,” và “đá cẩm thạch” phù hợp. “Gỗ thơm quý” cùng chú thích bảo toàn sự không chắc chắn về việc định danh θύϊνον. Đổi “gỗ cực quý” thành “gỗ vô cùng quý” để diễn đạt trang trọng, tự nhiên hơn mà vẫn truyền đạt lực so sánh cao nhất.
