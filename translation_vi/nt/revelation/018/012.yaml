  - severity: low
    issue: “gỗ cực quý” có sắc thái khẩu ngữ nhẹ
    rationale: “Cực quý” hiểu được, nhưng “vô cùng quý” tự nhiên và phù hợp văn phong trang trọng hơn, đồng thời vẫn phản ánh τιμιωτάτου.
