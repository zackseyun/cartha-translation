revisions:
- from: Vì tội lỗi của nó đã chất cao tận trời[a], và Đức Chúa Trời đã nhớ đến những việc bất chính của nó.[b]
  to: Vì tội lỗi của nó đã chồng chất lên tận trời[a], và Đức Chúa Trời đã nhớ đến những việc bất chính của nó.[b]
  rationale: Thay «đã chất cao tận trời» bằng «đã chồng chất lên tận trời» để câu Việt tự nhiên hơn, đồng thời duy trì hình ảnh tội lỗi tích tụ đến trời và không làm yếu hay mở rộng nghĩa nguyên văn. Chú thích a được điều chỉnh nhẹ thành «kết dính với nhau» để giải thích sát hơn sắc thái nghĩa đen của ἐκολλήθησαν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:04Z'
