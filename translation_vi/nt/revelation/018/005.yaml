id: REV.18.5
reference: Revelation 18:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: vi
  text: Vì tội lỗi của nó đã chồng chất lên tận trời[a], và Đức Chúa Trời đã nhớ đến những việc bất chính của nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã kết dính với nhau lên tận trời”; động từ Hy Lạp theo nghĩa đen là “dính/kết lại”, ở đây diễn tả tội lỗi tích tụ thành một khối lớn.'
    reason: lexical_alternative
  - marker: b
    text: 'Trong ngữ cảnh này, “nhớ đến” mang sức nặng xét xử: Đức Chúa Trời không bỏ qua những việc bất chính của nó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ quan hệ nguyên nhân với mệnh lệnh ở câu trước, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐκολλήθησαν
  choice: đã chất cao
  rationale: Động từ theo nghĩa đen là dính, kết lại; trong hình ảnh tội lỗi vươn tới trời, cách dịch này diễn đạt sự tích tụ thành khối lớn mà không làm câu tối nghĩa.
- source_word: ἁμαρτίαι
  choice: tội lỗi
  rationale: Tương đương thông dụng và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: tận trời
  rationale: Diễn đạt trực tiếp giới hạn 'đến tận trời', giữ hình ảnh chiều cao và âm hưởng phán xét.
- source_word: ἐμνημόνευσεν
  choice: đã nhớ đến
  rationale: Giữ nguyên thành ngữ Kinh Thánh về việc Đức Chúa Trời nhớ đến, không diễn giải thẳng thành trừng phạt dù ngữ cảnh mang sức nặng xét xử.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc và dễ hiểu trong tiếng Việt.
- source_word: ἀδικήματα
  choice: những việc bất chính
  rationale: Giữ sự phân biệt với ἁμαρτίαι ở vế trước và bao quát các hành vi sai trái, bất công.
theological_decisions:
- issue: Phân biệt ἁμαρτίαι và ἀδικήματα trong cùng một câu
  choice: Dịch lần lượt là 'tội lỗi' và 'những việc bất chính'
  alternative: Dịch cả hai là 'tội lỗi' hoặc 'gian ác'
  rationale: Nguyên văn dùng hai danh từ có liên hệ nhưng khác nhau; giữ hai cách gọi bảo toàn độ đầy tu từ mà không áp đặt một phân biệt thần học quá sắc nét.
- issue: Sức nặng của việc Đức Chúa Trời 'nhớ đến'
  choice: Giữ 'đã nhớ đến'
  alternative: Diễn giải là 'đã gọi ra xét xử' hoặc 'đã trừng phạt'
  rationale: Trong ngữ cảnh, sự nhớ đến có hàm ý xét xử và hành động, nhưng nguyên văn vẫn dùng động từ 'nhớ'; bản dịch giữ nguyên sự căng thẳng thần học ấy.
- issue: Đại từ chỉ Ba-by-lôn được nhân cách hóa như phụ nữ
  choice: Dùng 'nó'
  alternative: Dùng 'mụ ta' hoặc 'nàng'
  rationale: '''Nó'' tự nhiên khi nói về thành phố/quyền lực được nhân cách hóa và tránh thêm sắc thái khinh miệt hay trìu mến không có sẵn trong đại từ Hy Lạp.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu bám sát hai vế của nguyên văn; dùng 'tận trời' để giữ hình ảnh mạnh và gọn. Mọi dấu chú thích đều được đặt trong chính văn.
