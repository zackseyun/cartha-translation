id: REV.18.9
reference: Revelation 18:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: vi
  text: Các vua trên đất—những kẻ đã cùng nó phạm tội gian dâm[a] và sống xa hoa—sẽ khóc lóc và than khóc[b] cho nó khi thấy khói bốc lên từ đám cháy thiêu nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “cùng nó phạm tội gian dâm” có thể thuộc hình ảnh xuyên suốt sách Khải Huyền về liên minh bại hoại và thờ thần tượng, nhưng vẫn giữ nguyên sắc thái tình dục của tiếng Hy Lạp.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp có thể gợi cảnh than khóc công khai kèm cử chỉ như đấm ngực; cũng có thể dịch là “kêu than”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: sẽ khóc lóc
  rationale: Diễn đạt tiếng khóc thành lời hoặc sự than khóc rõ rệt, giữ được sức nặng cảm xúc của động từ κλαίω.
- source_word: κόψονται
  choice: sẽ than vãn
  rationale: Trong thành ngữ chỉ tang chế, động từ ở thể trung diễn tả sự than khóc công khai, có thể kèm cử chỉ đấm ngực; “than vãn” truyền đạt ý chính mà không khiến độc giả hiểu là tự gây thương tích.
- source_word: ἐπ’ αὐτὴν
  choice: cho nó
  rationale: Sau các động từ khóc than, ἐπί với đối cách chỉ đối tượng khiến người ta thương khóc. “Cho nó” tự nhiên trong tiếng Việt và giữ Babylon như đối tượng được than khóc.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: Giữ cách nói khải huyền quen thuộc, chỉ các nhà cai trị thuộc phạm vi thế gian; “trên đất” tự nhiên hơn “của trái đất” trong câu này.
- source_word: μετ’ αὐτῆς
  choice: cùng nó
  rationale: Giữ quan hệ kết hợp của μετά với sở hữu cách và cho phép cụm này liên hệ tự nhiên với cả việc phạm tội gian dâm lẫn sống xa hoa.
- source_word: πορνεύσαντες
  choice: phạm tội gian dâm
  rationale: Giữ nguyên hình ảnh tình dục mạnh của πορνεύω, đồng thời không thu hẹp trước ý nghĩa ẩn dụ về liên minh bại hoại và thờ thần tượng trong sách Khải Huyền.
- source_word: στρηνιάσαντες
  choice: sống xa hoa
  rationale: Diễn đạt lối sống xa xỉ, buông thả và tự nuông chiều do στρηνιάω gợi lên, bằng ngôn ngữ hiện đại, dễ hiểu.
- source_word: ὅταν βλέπωσιν
  choice: khi thấy
  rationale: Trong lời tiên báo này, ὅταν với động từ giả định hiện tại diễn tả một tình huống tương lai; “khi thấy” là cách nói tự nhiên trong tiếng Việt.
- source_word: τὸν καπνὸν
  choice: khói bốc lên
  rationale: “Khói” là tương đương trực tiếp; thêm “bốc lên” làm rõ quan hệ tự nhiên giữa khói và đám cháy mà không thêm nội dung thần học.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: từ đám cháy thiêu nó
  rationale: Diễn đạt rõ quá trình bị thiêu cháy của πύρωσις, tránh cách danh hóa nặng nề như “sự thiêu đốt của nó” và không nhập thêm từ ngữ của các câu lân cận.
theological_decisions:
- issue: Bản chất hình ảnh “phạm tội gian dâm” với Babylon
  choice: Giữ ngôn ngữ gian dâm trong chính văn, đồng thời ghi nhận sức gợi ẩn dụ trong chú thích.
  alternative: Dịch trừu tượng thành “làm điều vô luân” hoặc “bất trung với Đức Chúa Trời”.
  rationale: Khải Huyền dùng hình ảnh mại dâm và gian dâm cho sự thờ thần tượng cùng những liên minh bại hoại. Giữ từ ngữ tình dục bảo toàn hình ảnh tiên tri và không giải quyết thay độc giả sự căng thẳng giữa nghĩa cụ thể với nghĩa ẩn dụ.
- issue: Ý nghĩa của κόψονται
  choice: Dịch theo nghĩa than khóc, đồng thời chú thích cử chỉ tang chế mà động từ có thể gợi lên.
  alternative: Dịch sát hình ảnh thành “sẽ đấm ngực” hoặc gây hiểu lầm thành “sẽ tự cắt mình”.
  rationale: Trong ngữ cảnh này, động từ chỉ sự than khóc biểu lộ ra bên ngoài, chứ trọng tâm không phải hành vi tự gây thương tích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nó” duy trì hình ảnh Babylon vừa là thành vừa được nhân cách hóa như một người nữ, nhưng tránh thêm sắc thái miệt thị không có trong nguyên văn. Dấu gạch ngang làm rõ cụm phân từ mô tả các vua mà không làm câu nặng nề.
