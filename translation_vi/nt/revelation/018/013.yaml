  source_fidelity: Bản dịch theo sát danh mục thương phẩm của nguyên văn Hy Lạp. “Quế,” “hương liệu,” “hương đốt,” “dầu thơm,” “nhũ hương,” “dầu ô-liu,” “bột mịn,” “lúa mì,” “bò,” “chiên,” “ngựa,” và “xe ngựa” truyền đạt đúng các mục hàng tương ứng. “Thân thể và linh hồn con người” giữ được cách diễn đạt gây sốc, mang tính hàng hóa hóa con người, của σωμάτων καὶ ψυχὰς ἀνθρώπων mà không diễn giải quá mức trong chính văn.
