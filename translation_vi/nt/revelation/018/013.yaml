id: REV.18.13
reference: Revelation 18:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: vi
  text: cùng quế, hương liệu[a], hương đốt, dầu thơm, nhũ hương, rượu, dầu ô-liu, bột mịn, lúa mì, bò, chiên, ngựa, xe ngựa, thân thể[b] và linh hồn con người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “amomum,” một loại hương liệu quý.'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa đen là “thân thể”; ở đây chỉ những người bị bán làm nô lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: quế
  rationale: Chỉ mặt hàng quế nhập khẩu; “quế” là cách gọi tự nhiên và chính xác trong tiếng Việt.
- source_word: ἄμωμον
  choice: hương liệu
  rationale: Chỉ một loại cây hoặc gia vị thơm quý, thường được nhận diện là amomum; cách dịch khái quát giữ được ý nghĩa hàng hóa xa xỉ, còn tên gọi cụ thể được nêu trong chú thích.
- source_word: θυμιάματα
  choice: hương đốt
  rationale: Trong danh mục thương phẩm này, từ chỉ chất thơm dùng để đốt, không phải hành động dâng hương.
- source_word: μύρον
  choice: dầu thơm
  rationale: Chỉ dầu hoặc thuốc xức có mùi thơm đắt tiền; “dầu thơm” tự nhiên và phù hợp bối cảnh cổ đại.
- source_word: λίβανον
  choice: nhũ hương
  rationale: Chỉ riêng frankincense, phân biệt với từ rộng hơn θυμιάματα ở trước.
- source_word: ἔλαιον
  choice: dầu ô-liu
  rationale: Trong bối cảnh Địa Trung Hải, đây là dầu ô-liu; nói rõ giúp độc giả hiện đại tránh hiểu thành một loại dầu bất kỳ.
- source_word: σεμίδαλιν
  choice: bột mịn
  rationale: Chỉ loại bột hảo hạng, xay mịn.
- source_word: σῖτον
  choice: lúa mì
  rationale: Dù có thể chỉ ngũ cốc nói chung, trong danh mục thương mại này nghĩa cụ thể có khả năng nhất là lúa mì.
- source_word: κτήνη
  choice: bò
  rationale: Chỉ gia súc lớn đã thuần hóa; “bò” tạo sự phân biệt tự nhiên với chiên được kể ngay sau.
- source_word: πρόβατα
  choice: chiên
  rationale: Từ này trực tiếp chỉ chiên; đây cũng là cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ῥεδῶν
  choice: xe ngựa
  rationale: Chỉ loại xe bốn bánh, có thể là xe sang dùng để chở người; “xe ngựa” tự nhiên hơn “chiến xa” và không áp đặt chức năng quân sự.
- source_word: σωμάτων
  choice: thân thể
  rationale: Dịch sát nghĩa đen để giữ sức nặng gây sốc của việc biến con người thành hàng hóa; nghĩa nô lệ được giải thích trong chú thích.
- source_word: ψυχὰς ἀνθρώπων
  choice: linh hồn con người
  rationale: Giữ cách diễn đạt khác thường và cao trào của nguyên văn, đồng thời không thu hẹp ψυχή thành chỉ “mạng sống” hay đồng nhất ngay với “người”.
theological_decisions:
- issue: Cách hiểu σωμάτων καὶ ψυχὰς ἀνθρώπων
  choice: thân thể và linh hồn con người
  alternative: nô lệ, tức là những con người
  rationale: 'Cách dịch sát giữ nguyên sự căng thẳng tu từ: thương nhân buôn cả “thân thể” lẫn “linh hồn con người.” Chú thích làm rõ bối cảnh buôn bán nô lệ nhưng không thay thế hình ảnh gây sốc của nguyên văn bằng một lời diễn giải.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì nhịp liệt kê dồn dập của nguyên văn; dùng “hương đốt” để phân biệt với “nhũ hương,” và giữ “thân thể” trong chính văn nhằm bảo toàn hình ảnh con người bị hàng hóa hóa.
