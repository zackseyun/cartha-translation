id: REV.18.3
reference: Revelation 18:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: vi
  text: Vì mọi dân tộc đã sa ngã vì rượu thịnh nộ của sự gian dâm của thành ấy[a]; các vua của đất đã gian dâm với thành ấy[b]; còn các thương gia của đất đã trở nên giàu có nhờ sức mạnh của sự xa hoa phóng túng của thành ấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số chứng cứ văn bản chép “đã uống” thay cho “đã sa ngã”. Cụm này cũng có thể hiểu là “rượu cuồng nhiệt của sự gian dâm”; chuỗi sở hữu cách trong tiếng Hy Lạp có thể được phân tích theo nhiều cách, và θυμός có thể mang nghĩa “thịnh nộ” hoặc “cuồng nhiệt”.
    reason: textual_variant_and_lexical_alternative
  - marker: b
    text: Ở đây, hình ảnh “gian dâm” có lẽ chỉ những liên minh bại hoại, thờ thần tượng và bóc lột; bản dịch vẫn giữ hình ảnh tình dục của tiếng Hy Lạp.
    reason: metaphorical_sense
  - marker: c
    text: Từ Hy Lạp chỉ sự xa hoa phóng túng, ngạo mạn và quá độ, chứ không đơn thuần là đời sống tiện nghi.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ chức năng nêu nguyên nhân của câu này đối với lời tuyên bố ngay trước đó.
- source_word: ἐκ τοῦ οἴνου
  choice: bởi rượu
  rationale: ἐκ chỉ nguồn hoặc nguyên nhân; với động từ πέπτωκαν trong văn bản được cung cấp, “bởi rượu” diễn đạt tự nhiên rằng rượu là tác nhân khiến các dân sa ngã.
- source_word: θυμοῦ
  choice: thịnh nộ
  rationale: θυμός có thể chỉ cơn thịnh nộ hoặc cảm xúc mãnh liệt. “Thịnh nộ” phù hợp với sắc thái phán xét trong Khải Huyền, còn khả năng “cuồng nhiệt” được ghi chú.
- source_word: πορνείας / ἐπόρνευσαν
  choice: sự gian dâm / đã gian dâm
  rationale: Giữ nhất quán hình ảnh tình dục có chủ ý trong nguyên văn, không diễn giải thu hẹp thành sự thờ thần tượng hay liên minh chính trị.
- source_word: πέπτωκαν
  choice: đã sa ngã
  rationale: Dịch đúng hình thức của πίπτω (“ngã, sa ngã”) trong văn bản SBLGNT được cung cấp, thay vì âm thầm thay bằng dị bản πέπωκαν (“đã uống”).
- source_word: πάντα τὰ ἔθνη
  choice: mọi dân tộc
  rationale: Chỉ toàn thể các dân bị Ba-by-lôn ảnh hưởng; cách nói này tự nhiên và không tạo đối lập không cần thiết giữa dân ngoại với người Do Thái.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: các vua trên đất
  rationale: Giữ cách diễn đạt quen thuộc của Khải Huyền và phạm vi toàn cầu trong hình ảnh.
- source_word: ἔμποροι
  choice: các thương gia
  rationale: Phù hợp với bối cảnh buôn bán hàng xa xỉ trong chương 18.
- source_word: ἐκ τῆς δυνάμεως
  choice: nhờ sức mạnh của
  rationale: Giữ nghĩa căn bản “sức mạnh, quyền lực” của δύναμις và diễn đạt tác động làm giàu của lối sống xa hoa ấy.
- source_word: στρήνους
  choice: lối sống xa hoa phóng túng
  rationale: στρῆνος không chỉ là tiện nghi vật chất mà là sự xa hoa ngạo mạn, buông thả và quá độ; cụm từ này truyền đạt sắc thái đó trong tiếng Việt hiện đại.
- source_word: ἐπλούτησαν
  choice: đã trở nên giàu có
  rationale: Diễn đạt rõ kết quả kinh tế của động từ aorist πλουτέω.
theological_decisions:
- issue: Nên dịch πορνεία/πορνεύω theo hình ảnh tình dục hay diễn giải trực tiếp là thờ thần tượng và liên minh bại hoại
  choice: Giữ “sự gian dâm/đã gian dâm” trong chính văn
  alternative: sự thờ thần tượng; sự ngoại tình thuộc linh; liên minh bại hoại
  rationale: Khải Huyền cố ý dùng hình ảnh tình dục để bao hàm sự bất trung về tôn giáo cùng các liên minh chính trị và kinh tế bại hoại. Giữ hình ảnh ấy tránh khóa câu vào một cách giải thích duy nhất.
- issue: Quan hệ ý nghĩa trong cụm θυμοῦ τῆς πορνείας
  choice: “rượu thịnh nộ của sự gian dâm”
  alternative: “rượu cuồng nhiệt do sự gian dâm”; “rượu khiến người ta mê cuồng mà gian dâm”
  rationale: Chuỗi sở hữu cách trong tiếng Hy Lạp thực sự mơ hồ. Chính văn giữ cấu trúc và sắc thái phán xét, còn chú thích nêu cách hiểu theo nghĩa đam mê mãnh liệt.
- issue: Dị bản πέπτωκαν và πέπωκαν
  choice: Dịch πέπτωκαν là “đã sa ngã” theo nguồn được cung cấp
  alternative: “đã uống” theo dị bản πέπωκαν
  rationale: Bản dịch ưu tiên văn bản nguồn được chỉ định. Dị bản “đã uống” khớp trực tiếp hơn với hình ảnh rượu và được bảo lưu trong chú thích, nhưng không được thay thế chính văn một cách ngầm định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nó” để quy chiếu thành Ba-by-lôn được nhân cách hóa, tránh áp đặt giới tính ngữ pháp lên tiếng Việt. Dấu chấm phẩy giúp giữ ba vế song song mà câu vẫn sáng rõ.
