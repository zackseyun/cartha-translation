revisions:
- from: Vì mọi dân tộc đã sa ngã bởi rượu thịnh nộ của sự gian dâm của nó[a]; các vua trên đất đã gian dâm với nó[b], còn các thương gia trên đất đã trở nên giàu có nhờ sức mạnh của lối sống xa hoa phóng túng của nó[c].
  to: Vì mọi dân tộc đã sa ngã vì rượu thịnh nộ của sự gian dâm của thành ấy[a]; các vua của đất đã gian dâm với thành ấy[b]; còn các thương gia của đất đã trở nên giàu có nhờ sức mạnh của sự xa hoa phóng túng của thành ấy[c].
  rationale: Bản sửa giữ πέπτωκαν là “đã sa ngã” theo SBLGNT, đồng thời làm câu tiếng Việt tự nhiên và mạch lạc hơn. Không theo audit trail tiếng Anh ở chỗ thay động từ thành “đã uống”, vì điều đó mâu thuẫn với văn bản Hy Lạp được cung cấp. Chú thích về dị bản và tính mơ hồ của θυμός vẫn được giữ để không che khuất các khả năng văn bản và ngữ nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản chính dịch đúng động từ SBLGNT πέπτωκαν là “đã sa ngã”, không theo quyết định tiếng Anh “đã uống”, vốn không phù hợp với văn bản nguồn được chỉ định. Các thành phần còn lại—các dân tộc, các vua của đất, các thương gia, sự gian dâm, và sự giàu lên bởi sức mạnh của sự xa hoa phóng túng—được giữ sát nguyên văn. Tuy nhiên, “bởi rượu” có thể được diễn đạt tự nhiên hơn là “vì rượu”, vẫn phản ánh lực nguyên nhân/hệ quả của ἐκ trong cấu trúc này.
  naturalness: Câu dự thảo nhìn chung rõ, nhưng việc lặp “của nó” và cụm “sức mạnh của lối sống xa hoa phóng túng của nó” hơi nặng. Dùng “thành ấy” làm quy chiếu cho Ba-by-lôn được nhân cách hóa giúp tiếng Việt sáng rõ hơn mà không áp đặt một diễn giải thần học. “Sự xa hoa phóng túng” gọn và tự nhiên hơn “lối sống xa hoa phóng túng” trong câu này.
  terminology: Giữ “gian dâm” nhất quán cho πορνεία/πορνεύω, bảo tồn hình ảnh tình dục mà không quy nó trực tiếp thành thờ thần tượng. “Thịnh nộ” cho θυμός là một khả năng chính đáng; chú thích phải duy trì khả năng “cuồng nhiệt/đam mê mãnh liệt”. “Xa hoa phóng túng” truyền đạt tốt στρῆνος.
  issues:
  - severity: low
    issue: Quy chiếu “nó” lặp lại và không thật tự nhiên trong hình ảnh thành Ba-by-lôn được nhân cách hóa.
    rationale: “Của nó ... với nó ... của nó” làm câu nặng và mơ hồ hơn cần thiết. “Thành ấy” xác định rõ đối tượng văn cảnh mà không diễn giải ẩn dụ.
  - severity: low
    issue: “Bởi rượu” và “sức mạnh của lối sống xa hoa phóng túng” hơi gượng.
    rationale: “Vì rượu” diễn đạt hệ quả của ἐκ tự nhiên hơn với “đã sa ngã”; “sức mạnh của sự xa hoa phóng túng” gần cấu trúc Hy Lạp hơn và gọn hơn.
