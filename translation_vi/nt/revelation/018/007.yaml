id: REV.18.7
reference: Revelation 18:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: vi
  text: 'Nàng đã tự tôn vinh mình và sống xa hoa[a] bao nhiêu, hãy cho nàng chịu khổ hình và tang tóc bấy nhiêu. Vì nàng tự nhủ trong lòng rằng: “Ta ngồi làm nữ hoàng; ta không phải là góa phụ, và chắc chắn ta sẽ không bao giờ thấy tang tóc.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sống buông thả” hoặc “sống theo dục lạc”. Động từ Hy Lạp có thể chỉ lối sống xa hoa, phóng túng và tự nuông chiều.
    reason: lexical_alternative
  - marker: b
    text: Cụm “chắc chắn ta sẽ không bao giờ thấy tang tóc” dùng một cấu trúc phủ định nhấn mạnh trong tiếng Hy Lạp, bày tỏ niềm tin quả quyết rằng tang tóc sẽ không bao giờ xảy đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: bao nhiêu ... bấy nhiêu
  rationale: Giữ nguyên cấu trúc tương liên chỉ sự báo trả tương xứng, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐδόξασεν αὑτὴν
  choice: đã tự tôn vinh
  rationale: Giữ rõ ý phản thân và sự tự đề cao của Ba-by-lôn, đồng thời duy trì nét nghĩa vinh quang/tôn cao.
- source_word: ἐστρηνίασεν
  choice: sống xa hoa
  rationale: Diễn đạt lối sống xa xỉ, buông thả và tự nuông chiều mà không thu hẹp từ này vào sắc thái tình dục.
- source_word: δότε αὐτῇ
  choice: hãy cho nàng chịu
  rationale: Chuyển mệnh lệnh theo cách tự nhiên trong tiếng Việt và kết hợp rõ với hậu quả phán xét theo sau.
- source_word: βασανισμὸν
  choice: khổ hình
  rationale: Thể hiện sự đau đớn nghiêm trọng trong bối cảnh phán xét, nhưng không giới hạn vào một hình thức tra tấn thể xác cụ thể.
- source_word: πένθος
  choice: tang tóc
  rationale: Phù hợp với sự mất mát và than khóc; cùng một cách dịch được giữ ở cả hai lần xuất hiện để bảo toàn sự lặp lại.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: trong lòng nàng nói
  rationale: Giữ thành ngữ Kinh Thánh về lời tự nhủ và sự tự tin kiêu ngạo ở nội tâm.
- source_word: Κάθημαι βασίλισσα
  choice: Ta ngồi ngôi nữ hoàng
  rationale: Giữ hình ảnh tư thế trị vì và cảm giác an toàn của một nữ hoàng; “ngồi ngôi” diễn đạt sắc thái vương quyền tự nhiên hơn trong tiếng Việt.
- source_word: χήρα οὐκ εἰμί
  choice: ta không phải là góa phụ
  rationale: Dịch trực tiếp hình ảnh người góa phụ, không giải nghĩa thay cho độc giả hay làm mất tính biểu tượng.
- source_word: οὐ μὴ ἴδω
  choice: chắc chắn ta sẽ không bao giờ thấy
  rationale: Truyền đạt sức nhấn mạnh của cấu trúc phủ định οὐ μή cùng động từ giả định, thể hiện niềm tin ngạo mạn rằng tang tóc tuyệt đối sẽ không đến.
theological_decisions:
- issue: Ba-by-lôn được nhân cách hóa thành người nữ, nữ hoàng và góa phụ
  choice: Duy trì ngôi nữ xuyên suốt bằng “nàng”, “nữ hoàng” và “góa phụ”.
  alternative: Chuyển thành một thành phố hoặc hệ thống phi nhân xưng.
  rationale: Bản Hy Lạp nhất quán nhân cách hóa Ba-by-lôn thành người nữ; hình ảnh này là thành phần thiết yếu trong lối tu từ tiên tri của Khải Huyền.
- issue: Ngôn ngữ phán xét trong βασανισμός
  choice: Dùng “khổ hình”.
  alternative: Dùng “đau đớn” hoặc “tra tấn”.
  rationale: “Khổ hình” giữ mức độ nghiêm trọng và sắc thái chịu phán xét mà không xác định một cơ chế thể xác hẹp hơn điều nguyên văn nói.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc “bao nhiêu ... bấy nhiêu” bảo toàn sự báo trả tương xứng; lời khoe khoang được diễn đạt trực tiếp, giữ tính nhân cách hóa và sức căng của lời phán xét.
