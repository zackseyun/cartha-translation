id: REV.18.22
reference: Revelation 18:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: vi
  text: Âm thanh của những người chơi đàn lia, các nhạc công, người thổi sáo và người thổi kèn sẽ không bao giờ còn được nghe thấy trong ngươi nữa[a]; không một thợ thủ công nào, thuộc bất cứ nghề nào, sẽ còn được tìm thấy trong ngươi nữa; tiếng cối xay sẽ không bao giờ còn được nghe thấy trong ngươi nữa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “người thổi kèn ống” thay cho “người thổi sáo”; từ Hy Lạp chỉ người chơi αὐλός, một nhạc cụ hơi cổ không hoàn toàn giống sáo hiện đại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “tiếng đá xay”; từ Hy Lạp có thể chỉ cụ thể đá xay, còn “cối xay” diễn đạt rộng hơn hình ảnh hoạt động xay nghiền.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: tiếng / tiếng đàn
  rationale: Trong ngữ cảnh này, từ này chỉ âm thanh nghe được chứ không phải lời nói. Cách dịch này giữ hình ảnh mọi âm thanh của đời sống đô thị đều im bặt; ở đầu câu thêm “đàn” để tiếng Việt tự nhiên với nhóm người chơi nhạc cụ dây.
- source_word: κιθαρῳδῶν
  choice: những người chơi đàn lia
  rationale: Từ này chỉ người biểu diễn với κιθάρα, một loại đàn dây cổ thuộc họ đàn lia. “Đàn lia” gần với nhạc cụ cổ hơn “đàn hạc” và vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: μουσικῶν
  choice: các nhạc công
  rationale: “Nhạc công” diễn đạt tự nhiên người biểu diễn âm nhạc và phù hợp với danh sách những người chơi nhạc cụ.
- source_word: αὐλητῶν
  choice: người thổi sáo
  rationale: Đây là người chơi αὐλός. “Người thổi sáo” rõ nghĩa đối với độc giả hiện đại, còn chú thích lưu ý rằng nhạc cụ cổ này không hoàn toàn giống sáo hiện đại.
- source_word: σαλπιστῶν
  choice: người thổi kèn
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, chỉ người thổi loại kèn dùng để phát tín hiệu.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: sẽ không bao giờ còn được nghe thấy ... nữa
  rationale: Kết cấu οὐ μή với động từ ở lối giả định diễn tả sự phủ định mạnh; “không bao giờ còn ... nữa” giữ được tính dứt khoát và chung cuộc.
- source_word: ἐν σοὶ
  choice: trong ngươi
  rationale: Giữ nguyên lối xưng hô trực tiếp với Ba-by-lôn được nhân cách hóa như một thành phố.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: không một thợ thủ công nào, dù thuộc bất cứ nghề gì
  rationale: Truyền đạt đầy đủ tính bao quát của hai lần dùng πᾶς/πάσης, đồng thời tự nhiên hơn trong tiếng Việt so với việc lặp sát chữ “thợ của mọi nghề”.
- source_word: εὑρεθῇ
  choice: sẽ còn được tìm thấy
  rationale: Khi đi với οὐ μή và ἔτι, cụm từ nhấn mạnh sự vắng bóng hoàn toàn, không còn hiện diện nữa.
- source_word: μύλου
  choice: cối xay
  rationale: Từ này có thể chỉ cối xay hoặc bộ phận đá xay. “Tiếng cối xay” là hình ảnh tự nhiên trong tiếng Việt về hoạt động xay nghiền hằng ngày, đồng thời chú thích bảo lưu nghĩa hẹp hơn.
theological_decisions:
- issue: Hình ảnh cuộc phán xét Ba-by-lôn
  choice: Giữ ba lời tuyên bố cụ thể rằng âm nhạc, lao động thủ công và hoạt động xay lương thực sẽ chấm dứt hoàn toàn trong thành bị xét đoán.
  alternative: Xem các chi tiết này chỉ là những nét trang trí, không mang sức nặng biểu tượng.
  rationale: Công thức lặp lại οὐ μή ... ἔτι nhấn mạnh cảnh hoang tàn dứt khoát và không thể đảo ngược. Bản dịch giữ nguyên các hình ảnh cụ thể mà không áp đặt một cách giải nghĩa biểu tượng riêng lên từng chi tiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi” để bảo toàn lời phán trực tiếp với thành Ba-by-lôn được nhân cách hóa. Chia cấu trúc Hy Lạp dài thành ba câu tiếng Việt nhằm làm rõ nhịp phán quyết lặp lại mà không làm mất sự song hành.
