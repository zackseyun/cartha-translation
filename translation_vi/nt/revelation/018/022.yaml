  source_fidelity: Bản dịch giữ được cấu trúc ba vế, lời xưng hô trực tiếp với thành bị nhân cách hóa, và sắc thái phủ định mạnh, chung cuộc của οὐ μὴ ... ἔτι. Tuy nhiên, nên dùng một cách diễn đạt thống nhất cho φωνή ở đầu câu, thay vì tách thành “Tiếng đàn ... tiếng của ...”, để phản ánh một danh từ “âm thanh/tiếng” chi phối toàn bộ danh sách. Chú thích a hiện dùng “người thổi ống”, không phải một cách gọi tự nhiên hay chính xác trong tiếng Việt cho lựa chọn “pipers.”
  naturalness: “Âm thanh của ... sẽ không bao giờ còn được nghe thấy” tự nhiên, trang trọng và giữ được phép lặp của nguyên văn. “Không một thợ thủ công nào, thuộc bất cứ nghề nào” gọn và rõ hơn “dù thuộc bất cứ nghề gì.”
  terminology: “Đàn lia,” “nhạc công,” “người thổi sáo,” “người thổi kèn,” “thợ thủ công,” và “cối xay” phù hợp với tiếng Việt hiện đại. “Cối xay” là cách chuyển ngữ dễ hiểu cho μύλου trong văn cảnh, còn chú thích bảo lưu khả năng hiểu cụ thể là “đá xay.”
