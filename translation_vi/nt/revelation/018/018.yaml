  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: vi
  text: 'Họ kêu lớn khi thấy khói do thành ấy bị thiêu cháy, và nói: “Có thành nào giống như thành lớn ấy?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν
  choice: họ kêu lớn
  rationale: Động từ chỉ tiếng kêu lớn; cách dịch này giữ được cường độ mà vẫn tự nhiên trong tiếng Việt.
- source_word: βλέποντες
  choice: khi thấy
  rationale: Phân từ hiện tại diễn tả hành động xảy ra đồng thời với việc kêu lớn.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: khói từ nơi nó bị thiêu cháy bốc lên
  rationale: Diễn đạt tự nhiên quan hệ giữa khói và sự thiêu cháy của thành; đại từ “nó” quy chiếu rõ đến thành trong tiếng Việt.
- source_word: λέγοντες
  choice: và nói
  rationale: Nối tự nhiên tiếng kêu lớn với nội dung lời nói trực tiếp.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Có thành nào giống như thành vĩ đại ấy?
  rationale: Tiếng Hy Lạp tỉnh lược động từ và danh từ sau τίς; tiếng Việt cần bổ sung “thành nào” để phép so sánh rõ ràng, nhưng không thêm ý ngoài ngữ cảnh.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: thành vĩ đại ấy
  rationale: “Ấy” xác định thành đã được nói đến trong ngữ cảnh, còn “vĩ đại” giữ sắc thái của μεγάλη.
theological_decisions:
- issue: Sự nhân cách hóa Ba-by-lôn/thành phố
  choice: Dùng “nó” khi quy chiếu đến thành, đồng thời giữ thành là chủ thể bị thiêu cháy
  alternative: Dùng đại từ “nàng” để tái hiện giống cái ngữ pháp và hình tượng người nữ
  rationale: Tiếng Việt không có giống ngữ pháp; “nó” là cách quy chiếu tự nhiên đến một thành phố. Hình tượng nhân cách hóa vẫn được duy trì bởi văn mạch rộng hơn, không cần áp đặt đại từ giống cái tại đây.
- issue: Thì của phép so sánh tỉnh lược
  choice: 'Không thêm dấu hiệu quá khứ hay hiện tại: “Có thành nào giống như…”'
  alternative: “Thành nào đã từng giống như…” hoặc “Thành nào giống như…”
  rationale: Câu Hy Lạp không có động từ được phát biểu; kết cấu tiếng Việt không đánh dấu thì bảo tồn sự tỉnh lược và tránh quyết định thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không cần chú thích vì tiếng Việt có thể giữ sự tỉnh lược về thì bằng câu hiện hữu “Có thành nào…”, đồng thời bổ sung danh từ “thành” một cách tự nhiên theo ngữ cảnh.
