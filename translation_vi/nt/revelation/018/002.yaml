id: REV.18.2
reference: Revelation 18:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: vi
  text: 'Người lớn tiếng[a] kêu rằng: “Sụp đổ! Sụp đổ rồi! Ba-by-lôn vĩ đại đã trở thành nơi ở của các quỷ, nơi giam giữ[c] mọi tà linh ô uế, nơi giam giữ mọi loài chim ô uế, và nơi giam giữ mọi loài thú ô uế và bị ghét bỏ[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bằng một tiếng lớn” hoặc “bằng một giọng mạnh mẽ”.
    reason: Cụm ἐν ἰσχυρᾷ φωνῇ có thể nhấn mạnh sức mạnh của tiếng nói hoặc âm lượng lớn.
  - marker: b
    text: Một số thủ bản không có cụm “và nơi giam giữ mọi loài thú ô uế và bị ghét bỏ”.
    reason: Ghi nhận dị bản văn bản liên quan đến mệnh đề cuối.
  - marker: c
    text: Từ được dịch là “nơi giam giữ” cũng có thể chỉ nơi cư ngụ hoặc nơi thường lui tới.
    reason: φυλακή có khoảng nghĩa gồm nơi giam giữ, canh giữ, hoặc một nơi có các hữu thể lui tới/cư ngụ.
lexical_decisions:
- source_word: ἔκραξεν
  choice: kêu lớn
  rationale: Diễn đạt tự nhiên hành động cất tiếng vang lớn của κράζω, đồng thời tránh sắc thái đau buồn mà riêng “kêu than” có thể gợi ra.
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: cất tiếng mạnh mẽ
  rationale: Giữ sắc thái sức mạnh của ἰσχυρός thay vì chỉ chuyển thành âm lượng “lớn”; kết hợp với “kêu lớn” tạo câu tiếng Việt tự nhiên và trang trọng.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Đã sụp đổ, đã sụp đổ rồi
  rationale: Giữ nguyên sự lặp lại đầy tính tuyên cáo và diễn tả biến cố đã xảy ra với kết quả hiện rõ; “sụp đổ” phù hợp với sự phán xét một thành biểu tượng.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Ba-by-lôn vĩ đại
  rationale: Giữ tên riêng quen thuộc và sắc thái danh hiệu của cấu trúc Hy Lạp; “vĩ đại” trang trọng hơn “lớn” trong ngữ cảnh này.
- source_word: ἐγένετο
  choice: đã trở thành
  rationale: Diễn đạt cả sự biến đổi lẫn tình trạng là kết quả hiện tại của biến cố sụp đổ.
- source_word: κατοικητήριον
  choice: nơi ở
  rationale: Cách nói hiện đại, rõ nghĩa cho một địa điểm có cư dân, không mang sắc thái cổ hoặc quá văn chương.
- source_word: δαιμονίων
  choice: các quỷ
  rationale: Chuyển trực tiếp danh từ chỉ các hữu thể ma quỷ, không đồng nhất nó với cụm “tà linh” xuất hiện ngay sau đó.
- source_word: φυλακὴ
  choice: nơi giam giữ
  rationale: Phản ánh nghĩa nơi canh giữ hoặc giam cầm, đồng thời giữ được tính cụ thể của hình ảnh; nghĩa nơi trú ngụ hoặc lui tới được ghi ở chú thích [a].
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: mọi tà linh ô uế
  rationale: “Tà linh” tự nhiên trong tiếng Việt và phân biệt với δαιμόνια; “ô uế” bảo tồn âm hưởng tôn giáo và liên văn bản của ἀκάθαρτος.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: mọi loài chim ô uế
  rationale: Không tự ý thu hẹp thành chim ăn xác; “mọi loài” diễn đạt tự nhiên phạm vi của πᾶς với danh từ giống loài.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: mọi loài thú ô uế và đáng ghét
  rationale: Dùng danh từ chung “loài thú”, không biến thành danh hiệu “Con Thú”; “đáng ghét” truyền đạt trạng thái bị ghét bỏ của phân từ hoàn thành thụ động theo lối Việt tự nhiên.
theological_decisions:
- issue: θῆριον là danh hiệu “Con Thú” hay danh từ chung chỉ loài vật
  choice: danh từ chung “loài thú”
  alternative: danh hiệu “Con Thú”
  rationale: Từ này đi cùng πᾶς và nằm trong chuỗi gồm tà linh, chim và thú; cú pháp ủng hộ nghĩa khái quát về loài vật hơn là nhân vật biểu tượng số ít ở những đoạn khác.
- issue: Ý nghĩa của φυλακή trong cảnh phán xét
  choice: nơi giam giữ
  alternative: nơi trú ngụ hoặc nơi lui tới
  rationale: φυλακή có thể chỉ sự canh giữ, nhà giam hay nơi giữ; bản chính giữ nghĩa giam giữ cụ thể nhưng chú thích bảo tồn khả năng đây là nơi các hữu thể ấy cư ngụ hoặc thường lui tới.
- issue: Đại từ chỉ Ba-by-lôn
  choice: “nó”
  alternative: “nàng”
  rationale: Ngữ pháp Hy Lạp không có đại từ giống cái minh nhiên tại mệnh đề này. “Nó” chỉ thành phố theo tiếng Việt tự nhiên và không áp đặt nhân cách hóa nữ giới, dù ngữ cảnh rộng hơn của Khải Huyền nhân cách hóa Ba-by-lôn.
translation_notes:
  register: Văn phong trang trọng, giàu nhịp điệu tuyên cáo nhưng vẫn dùng tiếng Việt hiện đại. Sự lặp lại “đã sụp đổ” được giữ để bảo tồn âm hưởng ngôn sứ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
