revisions:
- from: 'Người cất tiếng mạnh mẽ[a] kêu lớn rằng: “Đã sụp đổ, đã sụp đổ rồi, Ba-by-lôn vĩ đại! Nó đã trở thành nơi ở của các quỷ, nơi giam giữ mọi tà linh ô uế, nơi giam giữ mọi loài chim ô uế, cùng mọi loài thú ô uế và đáng ghét[b].”'
  to: 'Người lớn tiếng[a] kêu rằng: “Sụp đổ! Sụp đổ rồi! Ba-by-lôn vĩ đại đã trở thành nơi ở của các quỷ, nơi giam giữ[c] mọi tà linh ô uế, nơi giam giữ mọi loài chim ô uế, và nơi giam giữ mọi loài thú ô uế và bị ghét bỏ[b].”'
  rationale: Bản sửa phục hồi đầy đủ ba lần φυλακή của nguyên văn, làm rõ giá trị bị động của μεμισημένου, và chỉnh câu mở đầu cho tự nhiên. Dấu [b] được đặt sau toàn bộ mệnh đề bị dị bản chi phối; chú thích từ vựng về φυλακή được đặt ngay tại từ tương ứng. Cách dịch vẫn bảo tồn tính khái quát của θηρίον và không giải thích thêm biểu tượng Ba-by-lôn.
  reviewer_model: gpt-5.6-terra
