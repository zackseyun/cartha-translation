id: REV.18.20
reference: Revelation 18:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: vi
  text: Hỡi trời, hãy vui mừng về nó! Các thánh đồ, các sứ đồ và các nhà tiên tri, hãy vui mừng, vì Đức Chúa Trời đã xét xử vụ án của anh em đối với nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp rất cô đọng: “Đức Chúa Trời đã xét xử sự xét xử của anh em từ nó.” Cũng có thể hiểu: “Đức Chúa Trời đã xét xử nó vì anh em” hoặc “Đức Chúa Trời đã báo trả cho anh em về điều nó đã làm.”'
    reason: Giữ lại cấu trúc khó và các cách hiểu khả dĩ của nguyên văn mà không buộc bản chính phải chọn riêng ý minh oan hay báo trả.
lexical_decisions:
- source_word: Εὐφραίνου
  choice: hãy vui mừng
  rationale: Giữ nguyên sức mạnh của mệnh lệnh số ít, trực tiếp kêu gọi trời vui mừng; cách nói tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐπ’ αὐτῇ
  choice: về nó
  rationale: ἐπί với động từ chỉ sự vui mừng nêu đối tượng hoặc duyên cớ của niềm vui. “Về nó” giữ cách diễn đạt cô đọng mà không tự ý thêm rõ “về sự sụp đổ của nó”.
- source_word: οὐρανέ
  choice: Hỡi trời
  rationale: Giữ lời xưng hô trực tiếp ở thể hô cách và sắc thái nhân cách hóa của “trời”.
- source_word: οἱ ἅγιοι
  choice: các thánh đồ
  rationale: Chỉ những người thuộc về Đức Chúa Trời; đây là cách gọi ngắn gọn, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: Giữ nghĩa chuyên biệt của ἀπόστολοι trong ngữ cảnh hội thánh, thay vì nghĩa rộng là “các sứ giả”.
- source_word: οἱ προφῆται
  choice: các nhà tiên tri
  rationale: Cách dịch hiện đại, rõ nghĩa của προφῆται.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho lời kêu gọi vui mừng.
- source_word: ἔκρινεν
  choice: đã xét xử
  rationale: Giữ trường nghĩa tư pháp của κρίνω và trình bày hành động của Đức Chúa Trời như một việc đã được thực hiện.
- source_word: τὸ κρίμα ὑμῶν
  choice: vụ án của anh em
  rationale: “Vụ án” tự nhiên hơn phép lặp cứng “xét xử sự xét xử”, đồng thời vẫn giữ ý về vụ việc tư pháp thuộc về hoặc liên quan đến những người được xưng hô.
- source_word: ἐξ αὐτῆς
  choice: đối với nó
  rationale: Cụm Hy Lạp rất cô đọng và khó xác định chính xác; cách dịch này nối vụ án của họ với Ba-by-lôn mà chưa diễn đạt thẳng thành “báo thù” hay “minh oan”.
theological_decisions:
- issue: Mức độ diễn giải hành động xét xử của Đức Chúa Trời đối với Ba-by-lôn vì dân Ngài
  choice: Giữ ngôn ngữ tư pháp và dịch “đã xét xử vụ án của anh em đối với nó”, kèm chú thích về cấu trúc cô đọng.
  alternative: “đã xét xử nó vì anh em” hoặc “đã báo trả cho anh em trên nó”
  rationale: Bản Hy Lạp dùng cặp từ cùng trường nghĩa κρίνω/κρίμα chứ không dùng trực tiếp động từ “báo thù”. Bản chính vì thế không nên làm rõ quá mức theo một cách hiểu duy nhất, nhưng tiếng Việt vẫn cần đủ tự nhiên để người đọc nhận ra đây là hành động xét xử liên quan đến vụ việc của các thánh đồ.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. Câu đầu tách lời gọi “Hỡi trời” để giữ thể hô cách; câu thứ hai chuyển mệnh lệnh ngữ pháp số ít thành lời kêu gọi tự nhiên dành cho ba nhóm người cũng được nêu trong câu. Đại từ “nó” tiếp nối hình tượng Ba-by-lôn như một thành/thực thể và tránh tự ý tăng sắc thái khinh miệt.
