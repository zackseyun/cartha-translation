  to: Vì chỉ trong một giờ, khối tài sản lớn lao dường ấy đã bị tàn phá! Mọi thuyền trưởng, mọi người đi tàu đến một nơi nào đó[a], các thủy thủ và tất cả những người làm việc trên biển đều đứng đằng xa.
  rationale: Sửa “cơ nghiệp” thành “khối tài sản” để phản ánh trực tiếp πλοῦτος, điều chỉnh nhóm người đi tàu để không mở rộng số ít τόπον thành số nhiều trong bản văn chính, và thay “đứng từ xa” bằng “đứng đằng xa” cho tự nhiên hơn. Chú thích giữ các khả năng hiểu hợp lý của cụm thành ngữ mà không xác định họ là hành khách hoặc thương nhân.
