  source_fidelity: Bản dịch giữ đúng trình tự các nhóm hàng hải và ý họ đứng cách xa. Tuy nhiên, “cơ nghiệp” không phải tương đương trực tiếp, rõ ràng nhất của πλοῦτος trong câu này; từ này thường gợi sản nghiệp/cơ đồ hơn là khối của cải. “Khối tài sản lớn lao dường ấy” phản ánh sát hơn ὁ τοσοῦτος πλοῦτος. Cụm “đến các nơi” diễn giải số nhiều so với τόπον số ít; nên dùng một cách diễn đạt giữ tính không xác định của thành ngữ Hy Lạp và để chú thích nêu các khả năng.
