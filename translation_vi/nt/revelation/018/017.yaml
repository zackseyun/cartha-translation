  terminology: “Thuyền trưởng,” “thủy thủ,” và “những người làm việc trên biển” phù hợp với văn cảnh và giữ được các nhóm riêng biệt. “Khối tài sản” phù hợp hơn “cơ nghiệp” cho πλοῦτος.
