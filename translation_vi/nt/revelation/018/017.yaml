  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: vi
  text: Vì chỉ trong một giờ, khối tài sản lớn lao dường ấy đã bị tàn phá! Mọi thuyền trưởng, mọi người đi tàu đến một nơi nào đó[a], các thủy thủ và tất cả những người làm việc trên biển đều đứng đằng xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi người đi tàu đến một cảng” hoặc “mọi người đi tàu đến bất cứ nơi nào.” Cụm từ Hy Lạp mang tính thành ngữ và có thể chỉ chung những người đi đường biển tới các điểm đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do hoặc nội dung của lời than trong văn mạch trước.
- source_word: μιᾷ ὥρᾳ
  choice: chỉ trong một giờ
  rationale: Diễn đạt tự nhiên cách dùng tặng cách chỉ thời gian và làm nổi bật tính đột ngột mà không quyết định đây là thời lượng theo nghĩa đen.
- source_word: ἠρημώθη
  choice: đã bị tàn phá
  rationale: Thể bị động được giữ lại; cụm từ truyền đạt ý bị hủy hoại, trở nên hoang tàn.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: cơ nghiệp lớn dường ấy
  rationale: “Cơ nghiệp” phù hợp với πλοῦτος là khối của cải được than tiếc trong văn cảnh; “lớn dường ấy” giữ sắc thái nhấn mạnh của τοσοῦτος.
- source_word: πᾶς κυβερνήτης
  choice: mọi thuyền trưởng
  rationale: Trong ngữ cảnh hàng hải, từ này chỉ người điều khiển hoặc chỉ huy tàu; “thuyền trưởng” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: mọi người đi tàu đến các nơi
  rationale: Giữ ý những người đi đường biển tới các địa điểm mà không thu hẹp họ thành hành khách hay thương nhân; chú thích ghi nhận tính thành ngữ và các khả năng dịch.
- source_word: ναῦται
  choice: các thủy thủ
  rationale: Tương đương hiện đại, rõ ràng của danh từ chỉ người làm việc trên tàu.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: tất cả những người làm việc trên biển
  rationale: Giữ phạm vi rộng hơn riêng thủy thủ và hình ảnh lao động gắn với biển, không diễn giải thành một nghề cụ thể.
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: đều đứng từ xa
  rationale: Diễn đạt vị trí cách biệt cùng hành động được thuật lại ở thể bất định quá khứ; “đều” nối tự nhiên với toàn bộ các nhóm được liệt kê.
theological_decisions:
- issue: Phạm vi các nhóm người hoạt động hàng hải trong lời than về Ba-by-lôn
  choice: 'Dịch thành các nhóm riêng biệt: thuyền trưởng, người đi tàu đến các nơi, thủy thủ và những người làm việc trên biển'
  alternative: Gộp tất cả thành “những người đi biển,” hoặc xác định nhóm thứ hai là hành khách hay thương nhân
  rationale: Bản Hy Lạp phối hợp nhiều nhóm khác nhau để diễn tả phạm vi thiệt hại kinh tế rộng lớn. Giữ các nhóm riêng tránh đưa vào sự xác định mà nguyên văn không nêu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, thích hợp với lời than mang tính khải huyền. Dấu chấm than phản ánh sắc thái cảm thán của câu trong văn mạch. Các nhóm hàng hải được giữ riêng; cấu trúc tiếng Việt được điều chỉnh vừa đủ để dễ hiểu.
