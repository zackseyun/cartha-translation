id: REV.18.14
reference: Revelation 18:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: vi
  text: Trái chín mà lòng ngươi khao khát đã rời xa ngươi; mọi thứ xa hoa và lộng lẫy đều đã biến mất khỏi ngươi, và người ta sẽ không bao giờ tìm thấy chúng nữa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng sẽ không bao giờ được tìm thấy nữa”; tiếng Hy Lạp dùng động từ ngôi thứ ba số nhiều nhưng không nêu rõ chủ ngữ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: trái chín
  rationale: Từ này chỉ trái cây, đặc biệt là trái đã chín hoặc trái cuối mùa; “trái chín” giữ được hình ảnh cụ thể trong danh mục hàng hóa xa xỉ.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: mà lòng ngươi khao khát
  rationale: Diễn đạt tự nhiên chuỗi sở hữu cách Hy Lạp, đồng thời giữ sắc thái ham muốn sâu xa của ψυχή và ἐπιθυμία.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: đã rời xa ngươi
  rationale: Phản ánh động từ chỉ sự ra đi cùng giới từ ἀπό và nhấn mạnh tình trạng mất mát hiện tại.
- source_word: πάντα τὰ λιπαρὰ
  choice: mọi thứ xa hoa
  rationale: Trong bối cảnh thương mại và sự giàu sang của Ba-by-lôn, λιπαρά chỉ những thứ phong phú, xa xỉ hơn là riêng thức ăn béo.
- source_word: τὰ λαμπρὰ
  choice: lộng lẫy
  rationale: Chuyển tải vẻ sáng chói, huy hoàng và phô trương của các vật phẩm sang trọng.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: đều đã tiêu tan khỏi ngươi
  rationale: Thể hiện sự mất đi hoàn toàn và không thể phục hồi của ἀπόλλυμι ở cách dùng nội động.
- source_word: οὐκέτι οὐ μὴ
  choice: không bao giờ ... nữa
  rationale: Truyền đạt phép phủ định được nhấn mạnh và tính chung cuộc của sự mất mát.
- source_word: αὐτὰ εὑρήσουσιν
  choice: người ta ... tìm thấy chúng
  rationale: Ngôi thứ ba số nhiều không có chủ ngữ minh thị được chuyển bằng chủ ngữ phiếm chỉ “người ta”, vừa tự nhiên trong tiếng Việt vừa tránh xác định một tác nhân cụ thể.
theological_decisions:
- issue: Chủ ngữ ngầm của εὑρήσουσιν
  choice: Dùng chủ ngữ phiếm chỉ “người ta”
  alternative: 'Chuyển sang bị động: “chúng sẽ không bao giờ được tìm thấy nữa”'
  rationale: Bản Hy Lạp dùng động từ chủ động ngôi thứ ba số nhiều nhưng không nêu chủ ngữ. “Người ta” bảo toàn hình thức chủ động và tính bất định; chú thích ghi nhận cách dịch bị động tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu nhịp điệu than khóc. Dùng “ngươi” vì lời nói trực tiếp hướng đến Ba-by-lôn đã được nhân cách hóa; giữ hình ảnh cụ thể “trái chín” và không làm rõ quá mức chủ ngữ bất định ở mệnh đề cuối.
