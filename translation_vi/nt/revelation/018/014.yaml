revisions:
- from: Trái chín mà lòng ngươi khao khát đã rời xa ngươi; mọi thứ xa hoa và lộng lẫy đều đã tiêu tan khỏi ngươi, và người ta sẽ không bao giờ tìm thấy chúng nữa.[a]
  to: Trái chín mà lòng ngươi khao khát đã rời xa ngươi; mọi thứ xa hoa và lộng lẫy đều đã biến mất khỏi ngươi, và người ta sẽ không bao giờ tìm thấy chúng nữa.[a]
  rationale: Chỉ thay “tiêu tan khỏi ngươi” bằng “biến mất khỏi ngươi” để sửa tính tự nhiên của tiếng Việt, không thay đổi nghĩa mất mát dứt khoát của nguyên ngữ. Giữ nguyên cách dịch chủ ngữ phiếm chỉ và chú thích thay thế bị động, vì nguyên văn để chủ ngữ của động từ số nhiều không xác định.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T01:25:12Z'
