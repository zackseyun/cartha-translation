id: REV.18.6
reference: Revelation 18:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: vi
  text: Hãy báo trả cho nó như chính nó đã báo trả; hãy trả cho nó gấp đôi[a] tùy theo những việc nó đã làm. Trong chén thức uống nó đã pha, hãy pha cho nó một phần gấp đôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn cũng có thể dịch sát hơn: “hãy nhân đôi cho nó những điều gấp đôi.” Cách nói Hy Lạp cô đọng, mạnh mẽ và có thể nhấn vào mức báo trả gia tăng.'
    reason: lexical_alternative
  - marker: b
    text: Tức là trong chén thức uống do nó pha chế; hình ảnh này gợi đến chén phán xét được chuẩn bị.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Hãy báo trả cho nó
  rationale: Động từ mệnh lệnh ἀποδίδωμι ở đây diễn tả sự hoàn trả mang tính báo ứng. “Báo trả” giữ sắc thái phán xét và trang trọng, còn đại từ “nó” phù hợp với hình tượng thành Ba-by-lôn được nhân cách hóa.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: như chính nó đã báo trả
  rationale: “Chính nó” thể hiện đại từ nhấn mạnh αὐτή; việc lặp lại “báo trả” phản ánh sự lặp từ của nguyên văn và giữ quan hệ tương xứng giữa hành động với sự báo ứng.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: hãy trả gấp đôi
  rationale: Cụm Hy Lạp cô đọng và có sức nhấn mạnh bằng phép lặp. Cách dịch này tự nhiên trong tiếng Việt, giữ ý báo trả gấp đôi nhưng không buộc phải hiểu như một công thức số học tuyệt đối.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: tùy theo những việc nó đã làm
  rationale: Cách diễn đạt hiện đại, dễ hiểu cho ἔργα, đồng thời giữ ý sự báo ứng được định theo các hành vi của nó.
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: Trong chén nó đã pha
  rationale: “Chén” giữ hình ảnh biểu tượng quen thuộc của ποτήριον; “pha” phản ánh κεράννυμι, tức chuẩn bị thức uống bằng cách pha trộn.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: hãy pha cho nó một phần gấp đôi
  rationale: Giữ sự lặp lại động từ “pha” trong nguyên văn và diễn đạt διπλοῦν thành một lượng gấp đôi theo cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất của mệnh lệnh báo trả gấp đôi
  choice: Giữ nguyên hình ảnh báo ứng tư pháp và mức gấp đôi, nhưng không xác định đó là phép tính hình phạt theo nghĩa đen.
  alternative: Diễn giải “gấp đôi” như một mức phạt toán học tuyệt đối, hoặc làm nhẹ thành một lời khẳng định chung về công lý.
  rationale: Ngôn ngữ khải huyền trình bày sự phán xét nghiêm khắc đối với Ba-by-lôn. Bản dịch bảo tồn cả tính tương xứng “tùy theo những việc” lẫn sức nhấn mạnh “gấp đôi”, không xóa đi sự căng thẳng giữa hai ý này.
- issue: Hình ảnh chén được pha
  choice: Giữ hình ảnh thức uống được pha để diễn tả sự phán xét dành lại cho Ba-by-lôn.
  alternative: Thay hình ảnh bằng lời diễn giải trực tiếp như “chuẩn bị hình phạt”.
  rationale: Hình ảnh chén nối với ngôn ngữ biểu tượng trong sách Khải Huyền và truyền thống tiên tri; việc giữ nguyên hình ảnh tránh áp đặt một cách giải nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các mệnh lệnh “hãy” giữ lực của nguyên văn; phép lặp “báo trả” và “pha” được bảo tồn để duy trì nhịp điệu cùng hình ảnh. Mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
