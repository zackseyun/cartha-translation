  naturalness: “Báo trả” phù hợp ngữ cảnh phán xét, nhưng “trong chén nó đã pha” không tự nhiên trong tiếng Việt hiện đại. “Trong chén thức uống nó đã pha” làm rõ quan hệ ngữ nghĩa cần thiết mà không diễn giải hình ảnh thành một lời giải thích thần học.
