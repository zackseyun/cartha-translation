id: REV.18.8
reference: Revelation 18:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: vi
  text: 'Vì thế, trong một ngày, các tai họa của nó sẽ ập đến: chết chóc, tang tóc và đói kém; nó sẽ bị thiêu rụi trong lửa, vì Chúa là Đức Chúa Trời quyền năng, Đấng đã xét xử nó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả với lời tuyên án ở văn cảnh trước.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: trong một ngày
  rationale: Giữ nguyên cách nói nhấn mạnh sự phán xét đến nhanh và dồn dập, không tự ý đổi thành “chỉ trong một ngày”.
- source_word: αἱ πληγαὶ αὐτῆς
  choice: các tai họa của nó
  rationale: πληγαί trong ngữ cảnh là những tai họa giáng xuống; đại từ giống cái chỉ Babylon được nhân cách hóa, nhưng tiếng Việt tự nhiên có thể dùng “nó” cho thành phố/quyền lực này.
- source_word: θάνατος καὶ πένθος καὶ λιμός
  choice: chết chóc, tang tóc và đói kém
  rationale: Giữ ba tai họa riêng biệt; “chết chóc” phù hợp hơn “cái chết” khi mô tả tai ương trên diện rộng.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: sẽ bị thiêu rụi trong lửa
  rationale: Thể hiện thể bị động và sắc thái đốt cháy hoàn toàn của κατακαίω.
- source_word: ἰσχυρός
  choice: thật quyền năng
  rationale: Trong lời khẳng định về Đức Chúa Trời thi hành phán xét, “quyền năng” tự nhiên và trang trọng hơn “mạnh”, đồng thời không làm mất ý về sức mạnh.
- source_word: ὁ κρίνας αὐτήν
  choice: Đấng xét xử nó
  rationale: Phân từ aorist được diễn đạt bằng mệnh đề định ngữ; tiếng Việt không buộc phải đánh dấu quá khứ ở đây, và cách này giữ trọng tâm vào tư cách Đấng xét xử.
theological_decisions:
- issue: Mối liên hệ giữa quyền năng của Đức Chúa Trời và sự phán xét Babylon
  choice: “vì Chúa là Đức Chúa Trời, Đấng xét xử nó, thật quyền năng”
  alternative: “vì Chúa là Đức Chúa Trời quyền năng, Đấng đã xét xử nó”
  rationale: Giữ ἰσχυρός làm vị ngữ được nhấn mạnh, thay vì chỉ biến nó thành tính từ bổ nghĩa; đồng thời không thêm một cách giải thích thần học ngoài câu nguồn.
- issue: Thời điểm của hành động κρίνας
  choice: “Đấng xét xử nó”
  alternative: “Đấng đã xét xử nó”
  rationale: Aorist có thể nhìn hành động phán xét như một toàn thể hoặc như điều đã được quyết định; tiếng Việt hiện tại mang tính định danh giữ được độ mở này tốt hơn việc bắt buộc xác định thời quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chúa là Đức Chúa Trời” để phản ánh κύριος ὁ θεός mà không viết hoa toàn bộ danh xưng. Tách câu ở dấu chấm phẩy để tiếng Việt sáng rõ, nhưng giữ nguyên tiến trình ý nghĩa.
