source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: vi
  text: 'họ nói: “Khốn thay! Khốn thay! Thành lớn kia, được khoác vải lanh mịn, vải tím và vải đỏ tươi, được trang hoàng bằng vàng, đá quý và ngọc trai,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: họ nói
  rationale: Phân từ hiện tại chủ động số nhiều nối lời than này với các chủ thể ở câu trước; tiếng Việt tự nhiên cần nêu đại từ để tránh một phân từ mở đầu gượng gạo.
- source_word: Οὐαὶ οὐαί
  choice: Khốn thay! Khốn thay!
  rationale: Giữ được cả sắc thái than khóc lẫn lời báo họa trong văn phong tiên tri–khải huyền.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: Thành vĩ đại kia
  rationale: Diễn đạt tự nhiên cấu trúc có mạo từ lặp lại và giữ sắc thái quy chiếu đến thành đã được nhận diện trong ngữ cảnh.
- source_word: περιβεβλημένη
  choice: từng mặc
  rationale: Phân từ hoàn thành mô tả tình trạng xa hoa của thành trước khi bị hủy diệt; “từng” làm rõ góc nhìn hồi tưởng trong lời than.
- source_word: βύσσινον
  choice: vải gai mịn
  rationale: Chỉ loại vải lanh cao cấp, đắt giá; cách gọi này vừa rõ chất liệu vừa giữ hình ảnh xa hoa.
- source_word: πορφυροῦν
  choice: màu tím
  rationale: Giữ màu sắc gắn với sự giàu sang và địa vị cao.
- source_word: κόκκινον
  choice: màu đỏ tươi
  rationale: Diễn đạt rõ sắc đỏ nổi bật của κόκκινον trong tiếng Việt hiện đại.
- source_word: κεχρυσωμένη
  choice: từng được trang sức bằng
  rationale: Động từ hoàn thành bị động có thể chỉ dát vàng hoặc tô điểm; vì bổ ngữ gồm vàng, đá quý và ngọc trai, “trang sức bằng” bao quát toàn bộ danh sách tự nhiên hơn.
- source_word: χρυσίῳ
  choice: vàng
  rationale: Chuyển trực tiếp chất liệu dùng để trang sức.
- source_word: λίθῳ τιμίῳ
  choice: đá quý
  rationale: Danh từ số ít trong tiếng Hy Lạp có thể được hiểu theo nghĩa chất liệu hoặc tập hợp; “đá quý” tự nhiên trong tiếng Việt mà không buộc phải đánh dấu số.
- source_word: μαργαρίτῃ
  choice: ngọc trai
  rationale: Danh từ tiếng Việt không bắt buộc đánh dấu số, nên “ngọc trai” vừa tự nhiên vừa không giải quyết quá mức vấn đề số ít mang nghĩa tập hợp.
theological_decisions:
- issue: Sắc thái lời than về sự sụp đổ của Babylon
  choice: Dịch οὐαί là “Khốn thay” để giữ đồng thời sắc thái than tiếc và phán xét
  alternative: “Ôi, ôi” để nhấn mạnh nỗi đau buồn
  rationale: Trong mạch văn phán xét của Khải Huyền, “Khốn thay” giữ lực của lời báo họa tiên tri mà vẫn có thể được thốt lên như tiếng than.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm than được dùng để thể hiện nhịp điệu mạnh của lời than lặp đôi. Không thêm chú thích vì “Khốn thay” truyền đạt đầy đủ sắc thái chính, còn phương án “Ôi” không cần thiết cho việc hiểu câu.
