id: REV.18.24
reference: Revelation 18:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: vi
  text: Trong nàng[c], người ta đã tìm thấy máu của các nhà tiên tri và các thánh đồ[a], và máu của tất cả những người đã bị tàn sát trên mặt đất[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người thánh” hoặc “dân thánh của Đức Chúa Trời”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tất cả những người đã bị giết trên mặt đất”. Động từ Hy Lạp mạnh hơn một từ chung chung chỉ việc giết và có thể mang nghĩa “bị tàn sát”.
    reason: lexical_alternative
  - marker: c
    text: “Nàng” chỉ về Ba-by-lôn, được khắc họa như một người nữ trong khải tượng xung quanh.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: nơi nàng
  rationale: Đại từ giống cái chỉ về Ba-by-lôn, vốn được nhân cách hóa như một người nữ trong khải tượng. “Nàng” giữ được hình ảnh nhân cách hóa này.
- source_word: αἷμα
  choice: máu
  rationale: Dịch trực tiếp danh từ Hy Lạp, đồng thời giữ sắc thái về trách nhiệm gây đổ máu trong lời kết án.
- source_word: προφητῶν
  choice: các nhà tiên tri
  rationale: Cách gọi chuẩn, rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἁγίων
  choice: các thánh đồ
  rationale: Chỉ những người thuộc về Đức Chúa Trời và được biệt riêng cho Ngài. “Các thánh đồ” ngắn gọn, quen thuộc; chú thích nêu các cách diễn đạt minh giải khác.
- source_word: εὑρέθη
  choice: người ta đã tìm thấy
  rationale: Diễn đạt tự nhiên thể bị động vô nhân xưng trong tiếng Việt, vẫn giữ ý sự việc được phát hiện hoặc phơi bày.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: tất cả những người đã bị tàn sát
  rationale: “Tàn sát” giữ sức nặng bạo lực của σφάζω, mạnh hơn một từ chung chung như “giết”; “đã bị” thể hiện hành động đã hoàn tất.
- source_word: ἐπὶ τῆς γῆς
  choice: trên mặt đất
  rationale: Giữ phạm vi rộng của γῆ trong văn cảnh khải huyền, không thu hẹp thành một vùng đất cụ thể.
theological_decisions:
- issue: Đối tượng quy trách nhiệm và phạm vi tội lỗi của Ba-by-lôn
  choice: Giữ nguyên lời cáo buộc bao quát rằng nơi Ba-by-lôn có máu của các nhà tiên tri, các thánh đồ và tất cả những người bị tàn sát trên mặt đất.
  alternative: Có thể hiểu mệnh đề cuối là lối nói khải huyền cường điệu về mọi sự đổ máu mà Ba-by-lôn đại diện, hoặc là lời quy trách nhiệm mang tính phổ quát trong khuôn khổ biểu tượng của khải tượng.
  rationale: Bản Hy Lạp không giải thích cụ thể biểu tượng này ứng với lịch sử như thế nào; bản dịch vì thế không thu hẹp hay giải quyết thay cho người đọc độ bao quát của lời kết án.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Cấu trúc “người ta đã tìm thấy nơi nàng” tránh lối bị động cứng, đồng thời giữ trọng tâm tư pháp và hình ảnh Ba-by-lôn được nhân cách hóa. Việc lặp lại “máu” trước vế cuối giúp câu tiếng Việt sáng nghĩa mà không thay đổi phạm vi của lời cáo buộc.
