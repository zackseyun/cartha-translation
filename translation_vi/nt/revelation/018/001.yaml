id: REV.18.1
reference: Revelation 18:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: vi
  text: Sau những điều ấy, tôi thấy một thiên sứ khác từ trời xuống, có thẩm quyền lớn; và đất được chiếu sáng bởi vinh quang của vị ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “được chiếu sáng từ vinh quang của vị ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Sau những điều ấy
  rationale: Giữ số nhiều của ταῦτα và trình tự nối tiếp giữa các khải tượng, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: εἶδον
  choice: tôi thấy
  rationale: Chuyển dịch trực tiếp động từ aorist ὁράω, không thêm sắc thái như “tôi nhìn và thấy” vốn không được biểu đạt rõ trong nguyên văn.
- source_word: ἄλλον ἄγγελον
  choice: một thiên sứ khác
  rationale: ἄλλον chỉ một thiên sứ khác trong chuỗi khải tượng; cách dịch này tự nhiên và chính xác.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: từ trời xuống
  rationale: Diễn đạt tự nhiên cả hướng đi xuống của καταβαίνοντα lẫn nguồn xuất phát được đánh dấu bởi ἐκ.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: có thẩm quyền lớn
  rationale: “Thẩm quyền” phản ánh ἐξουσία là quyền hạn hoặc quyền được trao, thay vì chỉ sức mạnh thuần túy.
- source_word: ἡ γῆ
  choice: đất
  rationale: Giữ được phạm vi nghĩa của γῆ, có thể chỉ đất hoặc toàn thể địa cầu; ngữ cảnh hình ảnh mang tầm vóc rộng lớn mà không cần thêm từ “khắp” vốn không có trong nguyên văn.
- source_word: ἐφωτίσθη
  choice: được chiếu sáng
  rationale: Giữ thể bị động của φωτίζω và sắc thái trang trọng của cảnh tượng.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: bởi vinh quang của vị ấy
  rationale: Trong cấu trúc này, ἐκ có thể nêu nguồn hoặc nguyên nhân. “Bởi” là tiếng Việt tự nhiên, đồng thời bản dịch sát hơn được ghi ở chú thích.
theological_decisions:
- issue: Bản chất của thẩm quyền và vinh quang nơi thiên sứ
  choice: Giữ nguyên việc thiên sứ có “thẩm quyền lớn” và “vinh quang” mà không đồng nhất vị ấy với Đức Chúa Trời.
  alternative: Có thể hiểu ánh huy hoàng chiếu sáng đất là ngôn ngữ đặc biệt tôn cao thiên sứ.
  rationale: Nguyên văn quy thẩm quyền lớn và vinh quang cho thiên sứ nhưng không tuyên bố thiên sứ là thần linh. Bản dịch giữ sức căng của hình ảnh mà không thêm kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thiên sứ” phù hợp ngữ vực Kinh Thánh phổ thông; “vị ấy” tôn trọng nhân vật và tránh lặp từ, còn dấu chấm phẩy giúp làm rõ hai mô tả liên tiếp trong câu dài.
