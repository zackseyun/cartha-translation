id: REV.18.21
reference: Revelation 18:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: vi
  text: 'Rồi một thiên sứ mạnh mẽ nhấc một hòn đá như cối xay lớn và ném xuống biển, nói: “Thành lớn Ba-by-lôn cũng sẽ bị quăng xuống một cách dữ dội như thế[a] và sẽ không bao giờ còn được tìm thấy nữa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “với một cú lao mạnh”, “với sức mạnh” hoặc “một cách mãnh liệt”. Từ Hy Lạp diễn tả một chuyển động đột ngột, đầy sức mạnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: nhấc
  rationale: Động từ αἴρω ở đây diễn tả thiên sứ nhấc hòn đá lên để thực hiện hành động mang tính biểu tượng; “nhấc” tự nhiên và giữ được chuyển động có chủ ý.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: một thiên sứ mạnh mẽ
  rationale: “Một” giữ ý về một nhân vật thiên sứ đơn lẻ; “mạnh mẽ” chuyển tải ἰσχυρός bằng lối diễn đạt hiện đại, trang trọng nhưng dễ hiểu.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: một hòn đá tựa như một thớt cối lớn
  rationale: Giữ rõ phép so sánh do ὡς biểu thị, không đồng nhất tuyệt đối hòn đá với thớt cối; “thớt cối” chỉ phiến đá dùng để xay và truyền đạt hình ảnh nặng, lớn.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: ném xuống biển
  rationale: “Ném” diễn tả trực tiếp động tác của βάλλω; “xuống biển” tự nhiên trong tiếng Việt và làm rõ hướng chuyển động vốn hiển nhiên trong hình ảnh.
- source_word: Οὕτως
  choice: như thế
  rationale: Cụm từ nối lời tuyên bố với hành động biểu tượng vừa diễn ra, giữ chức năng chỉ cách thức của Οὕτως.
- source_word: ὁρμήματι
  choice: dữ dội
  rationale: Danh từ ở cách dữ liệu được chuyển thành trạng ngữ, diễn tả chuyển động đột ngột và đầy sức mạnh. Chú thích giữ các sắc thái khả dĩ khác.
- source_word: βληθήσεται
  choice: sẽ bị quăng xuống
  rationale: Dạng tương lai bị động của βάλλω lặp lại hành động ném hòn đá. “Quăng xuống” giữ liên hệ hình ảnh và sắc thái sụp đổ, hủy diệt trong ngữ cảnh.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Thành lớn Ba-by-lôn
  rationale: Cách diễn đạt này giữ Ba-by-lôn là thành được gọi là lớn/vĩ đại, đồng thời có trật tự từ tự nhiên trong tiếng Việt.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: sẽ không bao giờ còn được tìm thấy nữa
  rationale: “Không bao giờ” phản ánh lối phủ định nhấn mạnh οὐ μή, còn “còn…nữa” chuyển tải ἔτι và tính chung cuộc của lời phán.
theological_decisions:
- issue: Bản chất của hình ảnh Ba-by-lôn bị hủy diệt
  choice: Diễn đạt sự phán xét là dữ dội và chung cuộc nhưng không xác định Ba-by-lôn là hoàn toàn theo nghĩa đen, hoàn toàn biểu tượng hay cả hai.
  alternative: Hiểu là thành Ba-by-lôn theo nghĩa đen; một hệ thống/thành phố biểu tượng chống nghịch Đức Chúa Trời; hoặc một biểu tượng khải huyền tổng hợp.
  rationale: Câu này trình bày một hành động biểu tượng kèm lời tuyên bố về sự lật đổ. Bản dịch giữ nguyên hình ảnh và tính chung cuộc mà không đưa vào một hệ thống cánh chung không được chính câu Hy Lạp xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ,” “thớt cối” và tên phiên âm “Ba-by-lôn” theo lối quen thuộc trong tiếng Việt Kinh Thánh; cấu trúc câu giữ nhịp kể và lời tuyên phán của văn chương khải huyền.
