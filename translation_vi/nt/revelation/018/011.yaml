  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: vi
  text: Các thương nhân trên thế gian[a] khóc lóc và than khóc nàng, vì không còn ai mua số hàng[b] của họ nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên đất.” Từ Hy Lạp có thể chỉ đất hoặc thế gian; trong Khải Huyền, cụm từ này thường có phạm vi rộng.'
    reason: lexical_alternative
  - marker: b
    text: Hay “hàng chở” hoặc “hàng hóa.” Từ Hy Lạp có thể chỉ số hàng được chở trên tàu hoặc hàng hóa dùng trong giao thương.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: các thương nhân
  rationale: “Thương nhân” là cách gọi tự nhiên, trang trọng cho những người buôn bán, phù hợp với bối cảnh thương mại quy mô lớn trong Khải Huyền 18.
- source_word: τῆς γῆς
  choice: trên thế gian
  rationale: γῆ có thể chỉ “đất” hoặc “thế gian.” Trong bối cảnh phán xét mang tầm rộng lớn của Khải Huyền, “trên thế gian” diễn đạt tự nhiên phạm vi rộng mà không loại bỏ khả năng từ này chỉ đất.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: khóc lóc và than tiếc
  rationale: 'Giữ lại hai động từ riêng biệt và sắc thái tăng cường: κλαίω nói đến hành động khóc, còn πενθέω nói đến sự than tiếc, đau buồn.'
- source_word: ἐπ’ αὐτήν
  choice: nàng
  rationale: Trong cấu trúc với các động từ than khóc, cụm này nêu đối tượng của lời than. “Nàng” giữ nguyên hình ảnh Ba-by-lôn được nhân cách hóa ở giống cái.
- source_word: γόμον
  choice: hàng hóa
  rationale: γόμος có thể chỉ hàng chở, nhất là hàng trên tàu, hoặc số hàng dùng trong giao thương. “Hàng hóa” tự nhiên trong tiếng Việt và phù hợp với danh sách các mặt hàng ngay sau câu này; chú thích bảo lưu sắc thái “hàng chở.”
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu chỉ số hàng thuộc về các thương nhân.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: không còn ai mua ... nữa
  rationale: Cấu trúc tiếng Việt này truyền đạt rõ cả ý không một ai mua và sự chấm dứt được nhấn mạnh bởi οὐκέτι.
theological_decisions:
- issue: Đối tượng và cách nhân cách hóa Ba-by-lôn
  choice: Dùng “nàng” để giữ hình ảnh thành Ba-by-lôn được nhân cách hóa như một phụ nữ.
  alternative: Dùng “nó” để chỉ thành phố hoặc hệ thống một cách phi nhân xưng.
  rationale: Nguyên văn dùng đại từ giống cái và toàn phân đoạn chủ ý nhân cách hóa Ba-by-lôn. “Nàng” bảo toàn hình ảnh văn chương-thần học mà không xác định thêm Ba-by-lôn tượng trưng cho điều gì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp than khóc của nguyên văn, đồng thời dùng cấu trúc “không còn ai… nữa” tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] được đặt ngay sau từ ngữ mà chú thích giải thích.
