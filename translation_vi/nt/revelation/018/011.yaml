- from: Các thương nhân trên thế gian[a] khóc lóc và than tiếc nàng, vì không còn ai mua hàng hóa[b] của họ nữa.
  to: Các thương nhân trên thế gian[a] khóc lóc và than khóc nàng, vì không còn ai mua số hàng[b] của họ nữa.
  rationale: Thay «than tiếc» bằng «than khóc» để phản ánh chính xác và tự nhiên hơn cặp động từ «khóc và than» trong nguyên văn. Thay «hàng hóa» bằng «số hàng» để biểu đạt rõ hơn γόμον là số/chuyến hàng của các thương nhân. Các neo chú thích vẫn đặt đúng tại những cụm từ được giải thích; không thay đổi ý nghĩa hay mức độ mơ hồ của nguyên văn.
