id: REV.18.4
reference: Revelation 18:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: vi
  text: 'Rồi tôi nghe một tiếng khác từ trời nói: “Hỡi dân ta, hãy ra khỏi nó[a], để không dự phần vào những tội lỗi của nó[b], và để không nhận phần trong những tai họa của nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đi ra khỏi nó.” Động từ Hy Lạp là một mệnh lệnh kêu gọi rời khỏi Babylon; tiếng Việt thường chỉ cần nói “hãy ra khỏi nó”.'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, đại từ chỉ Babylon ở đây thuộc giống cái, tiếp tục hình ảnh Babylon được nhân cách hóa như một người đàn bà. Tiếng Việt dùng “nó” một cách tự nhiên khi nói về thành hoặc thế lực này.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: một tiếng khác
  rationale: Diễn đạt tự nhiên một tiếng nói khác, phân biệt với tiếng hoặc người nói trước đó.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Trong văn cảnh Khải Huyền, οὐρανός chỉ cõi trời; “từ trời” vừa gọn vừa tự nhiên trong tiếng Việt.
- source_word: Ἐξέλθατε
  choice: hãy ra khỏi
  rationale: Mệnh lệnh số nhiều kêu gọi dứt khoát rời khỏi Babylon; tiếng Việt không buộc phải chọn hướng nhìn “đến” hay “đi” như trong tiếng Anh.
- source_word: ὁ λαός μου
  choice: Hỡi dân Ta
  rationale: Giữ lực xưng hô trực tiếp và sắc thái giao ước; viết hoa “Ta” theo quy ước tiếng Việt dành cho lời Đức Chúa Trời mà không thêm danh xưng không có trong nguyên văn.
- source_word: ἐξ αὐτῆς
  choice: khỏi nó
  rationale: “Nó” là đại từ tự nhiên khi tiếng Việt quy chiếu về một thành hoặc thực thể; chú thích bảo lưu thông tin rằng tiếng Hy Lạp dùng giống cái và nhân cách hóa Babylon.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: để không dự phần vào những tội lỗi của nó
  rationale: “Dự phần” truyền đạt ý tham gia, liên đới hoặc cùng chia sẻ trong συγκοινωνέω, đồng thời tránh làm nhẹ trách nhiệm đạo đức.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: và để không nhận phần trong những tai họa của nó
  rationale: “Nhận phần trong” phản ánh λαμβάνω với ἐκ, tức nhận một phần từ các tai họa dành cho Babylon; “tai họa” phù hợp ngôn ngữ phán xét trong Khải Huyền.
theological_decisions:
- issue: Hình ảnh giống cái trong αὐτῆς
  choice: Dùng đại từ tự nhiên “nó” trong câu chính và giải thích sự nhân cách hóa giống cái ở chú thích.
  alternative: Dùng “mụ ta” hoặc “người đàn bà ấy” để biểu thị giống cái ngay trong câu chính.
  rationale: Tiếng Việt không có giống ngữ pháp tương ứng. “Mụ ta” thêm sắc thái miệt thị, còn “người đàn bà ấy” bổ sung danh từ không có tại đây. Chú thích giữ được hình ảnh văn chương mà không áp đặt sắc thái mới.
- issue: Quan hệ của hai mệnh đề ἵνα μή
  choice: Lặp “để không … và để không …” nhằm thể hiện hai mục đích/cảnh báo song song.
  alternative: Gộp thành một mệnh đề hoặc dùng “kẻo”.
  rationale: Việc lặp ἵνα trong nguyên văn tạo cấu trúc phối hợp và nhấn mạnh hai hậu quả cần tránh; bản dịch giữ cấu trúc ấy mà vẫn tự nhiên.
- issue: Chủ thể ngầm của hai động từ số nhiều
  choice: Không thêm đại từ sau “dân Ta”.
  alternative: Thêm “các ngươi”, “anh em” hoặc “các con”.
  rationale: Tiếng Việt cho phép lược chủ ngữ khi đã rõ. Cách này giữ số đông theo ngữ cảnh mà không thêm sắc thái cổ, thân tộc hay quan hệ mà hình thái Hy Lạp không tự quy định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tiếng … nói” thay vì “phán” vì nguyên văn chỉ có phân từ “nói”, không xác định rõ danh tính tiếng nói. Cụm “Hỡi dân Ta” giữ sắc thái long trọng của lời kêu gọi, còn hai lần “để không” bảo toàn nhịp cảnh báo song song.
