id: REV.18.15
reference: Revelation 18:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: vi
  text: Những thương nhân buôn các thứ ấy[a], là những người đã trở nên giàu có nhờ nàng, sẽ đứng từ xa vì sợ nỗi thống khổ của nàng, vừa khóc lóc vừa than khóc,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các thương nhân của những hàng hóa ấy”; cụm từ này chỉ ngược về các mặt hàng xa xỉ được liệt kê trong văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: những thương nhân
  rationale: Chỉ những người làm nghề buôn bán; “thương nhân” tự nhiên, trang trọng và phù hợp với bối cảnh thương mại.
- source_word: τούτων
  choice: buôn bán các thứ ấy
  rationale: Đại từ sở hữu cách chỉ ngược về các mặt hàng xa xỉ đã được liệt kê. Cách diễn đạt này làm rõ quan hệ tự nhiên trong tiếng Việt mà không xác định quá mức bản thân các món hàng.
- source_word: πλουτήσαντες
  choice: đã trở nên giàu có
  rationale: Phân từ bất định chỉ việc họ đã trở nên giàu có trước đó; cách dịch giữ sắc thái phát triển thành giàu có, thay vì hàm ý thể bị động.
- source_word: ἀπ’ αὐτῆς
  choice: nhờ nàng
  rationale: ἀπό chỉ nguồn gốc; trong tiếng Việt, “nhờ nàng” diễn đạt tự nhiên rằng nàng là nguồn đem lại sự giàu có, nhưng không nhất thiết khẳng định nàng chủ động làm giàu cho họ.
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: sẽ đứng từ xa
  rationale: Giữ hình ảnh họ đứng cách xa để quan sát vì sợ hãi; “từ xa” là cách nói tự nhiên và súc tích.
- source_word: διὰ τὸν φόβον
  choice: vì sợ
  rationale: διά với đối cách nêu nguyên nhân. “Vì sợ” tự nhiên hơn cấu trúc danh từ cứng nhắc nhưng vẫn giữ rõ quan hệ nhân quả.
- source_word: βασανισμοῦ
  choice: sự hành hạ nàng phải chịu
  rationale: Giữ mức độ đau đớn nghiêm trọng của βασανισμός trong ngôn ngữ phán xét, đồng thời làm rõ nàng là đối tượng chịu sự hành hạ; không thu hẹp thành đau khổ kinh tế hay cảm xúc.
- source_word: κλαίοντες
  choice: khóc lóc
  rationale: Diễn tả hành động khóc thành tiếng và phù hợp với văn cảnh bi thương.
- source_word: πενθοῦντες
  choice: than tiếc
  rationale: Phân biệt với κλαίοντες bằng cách nhấn mạnh sự than khóc vì mất mát; phù hợp khi các thương nhân tiếc thương sự sụp đổ đem lại thiệt hại cho họ.
theological_decisions:
- issue: Bản chất của βασανισμός trong ngôn ngữ phán xét khải huyền
  choice: Dịch là “sự hành hạ nàng phải chịu”, không làm nhẹ thành nỗi buồn hay thiệt hại kinh tế.
  alternative: “sự trừng phạt nàng phải chịu” hoặc “nỗi đau khổ của nàng”
  rationale: Văn cảnh trực tiếp nói về sự phán xét Ba-by-lôn, và βασανισμός trong sách Khải Huyền diễn tả đau đớn nghiêm trọng mang tính hình phạt. Bản dịch giữ sức nặng của lời phán xét nhưng không mở rộng thành một giáo lý chi tiết mà câu này không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nàng” để duy trì cách nhân cách hóa Ba-by-lôn trong ngữ cảnh. Cặp “khóc lóc” và “than tiếc” giữ hai hành động gần nghĩa nhưng không đồng nhất. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp nối sang lời than ở câu sau.
