  source_fidelity: 'Bản nháp truyền đạt đúng các quan hệ chính: các thương nhân đã giàu lên từ/nhờ ‘nàng’, đứng xa vì sợ, và đang khóc than trước sự đau khổ của nàng. Tuy nhiên, “sự hành hạ nàng phải chịu” diễn giải βασανισμός theo hướng có một tác nhân hành hạ được nêu rõ hơn nguyên văn; “nỗi thống khổ của nàng” giữ ý đau đớn khốc liệt mà không thêm tác nhân. “Than tiếc” nghiêng về nuối tiếc hơn là πενθοῦντες (‘than khóc, để tang’).'
