id: JUD.1.12
reference: Jude 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: vi
  text: Những kẻ này là đá ngầm trong các tiệc yêu thương của anh em[a]; họ cùng dự tiệc mà không chút sợ hãi, chăn dắt chính mình[b][c]. Họ là những đám mây không nước bị gió cuốn đi; những cây mùa thu không trái, chết hai lần, bị nhổ bật rễ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những vết nhơ” hoặc “những vết bẩn trong các tiệc yêu thương của anh em.” Từ Hy Lạp có thể được hiểu theo nghĩa đạo đức, nhưng cũng có thể chỉ những đá ngầm nguy hiểm; nghĩa sau phù hợp hơn với chuỗi ẩn dụ sống động của Giu-đe.'
    reason: alternative_reading
  - marker: b
    text: “Chăn dắt chính mình” cũng có thể dịch là “nuôi chính mình,” nhấn mạnh cách hành xử chỉ nhằm phục vụ bản thân.
    reason: lexical_alternative
  - marker: c
    text: Đối chiếu Ê-xê-chi-ên 34 về hình ảnh những người chăn chỉ nuôi mình thay vì chăm sóc bầy chiên.
    reason: cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: đá ngầm
  rationale: Giữ hình ảnh về mối nguy hiểm ẩn giấu giữa sinh hoạt chung của cộng đồng và phù hợp với chuỗi ẩn dụ thiên nhiên sống động trong câu. Nghĩa ‘vết nhơ’ vẫn được ghi ở chú thích vì từ Hy Lạp có thể được hiểu theo hướng đạo đức.
- source_word: ἀγάπαις
  choice: các tiệc yêu thương
  rationale: Dạng số nhiều ở đây chỉ những bữa ăn chung của cộng đồng Cơ Đốc, đồng thời giữ được liên hệ trực tiếp với ý niệm ‘yêu thương’.
- source_word: συνευωχούμενοι
  choice: cùng dự tiệc
  rationale: Diễn đạt tự nhiên hành động tham dự một bữa tiệc chung mà không thêm một đối tượng không được nêu minh nhiên trong bản Hy Lạp.
- source_word: ἀφόβως
  choice: không chút sợ hãi
  rationale: Giữ độ mở của nguyên ngữ giữa thái độ không e dè, không kiêng nể và thiếu lòng kính sợ, thay vì giải thích theo một hướng duy nhất.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: chỉ chăn dắt chính mình
  rationale: Giữ ẩn dụ người chăn của ποιμαίνω và làm rõ sắc thái tự vị kỷ do đại từ phản thân tạo nên; cách hiểu ‘chỉ nuôi mình’ được nêu trong chú thích.
- source_word: νεφέλαι ἄνυδροι
  choice: những đám mây không nước
  rationale: Bám sát hình ảnh cụ thể về vẻ hứa hẹn nhưng không đem lại điều cần thiết.
- source_word: ὑπὸ ἀνέμων παραφερόμεναι
  choice: bị gió cuốn đi
  rationale: Giữ thể bị động và ý bị các sức lực bên ngoài mang đi, với cách nói tự nhiên trong tiếng Việt.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: những cây mùa thu không trái
  rationale: Giữ mùa được nêu trong nguyên ngữ và hình ảnh cụ thể về cây không sinh trái, không chuyển sớm sang nghĩa trừu tượng.
- source_word: δὶς ἀποθανόντα
  choice: chết hai lần
  rationale: Bảo toàn cách nói mạnh, lạ và có chủ ý của nguyên ngữ, không giải nghĩa thành ‘hoàn toàn chết’.
- source_word: ἐκριζωθέντα
  choice: bị nhổ bật rễ
  rationale: Diễn tả sống động việc cây đã bị bật khỏi rễ, nhấn mạnh tình trạng không còn sự sống.
theological_decisions:
- issue: Cách hiểu σπιλάδες khi mô tả những kẻ giả dối
  choice: Đá ngầm nguy hiểm ẩn trong các tiệc chung của cộng đồng
  alternative: Những vết nhơ hoặc vết bẩn trong các tiệc yêu thương
  rationale: ‘Đá ngầm’ phù hợp với chuỗi ẩn dụ và ý về hiểm họa kín giấu; tuy vậy, truyền thống dịch ‘vết nhơ’ có cơ sở từ khả năng diễn giải từ này theo nghĩa đạo đức nên được bảo lưu trong chú thích.
- issue: Sắc thái của ποιμαίνοντες trong ἑαυτοὺς ποιμαίνοντες
  choice: Giữ ẩn dụ ‘chăn dắt chính mình’
  alternative: ‘Nuôi chính mình’ hoặc ‘chỉ lo cho mình’
  rationale: Động từ Hy Lạp thường mang nghĩa chăn dắt. Giữ ẩn dụ giúp bảo toàn âm hưởng về những người chăn vị kỷ, đồng thời không thu hẹp ngay ý nghĩa vào việc ăn uống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê dồn dập của nguyên ngữ bằng dấu chấm phẩy; các hình ảnh ‘đá ngầm,’ ‘mây không nước,’ ‘cây mùa thu không trái’ và ‘chết hai lần’ được giữ cụ thể, không giải thích hóa trong chính văn.
