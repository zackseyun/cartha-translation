id: JUD.1.13
reference: Jude 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: vi
  text: những ngọn sóng dữ của biển, phun bọt ra những điều ô nhục của chính mình[a]; những ngôi sao lang thang, mà bóng tối mịt mù đã được dành sẵn cho họ cho đến đời đời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phun bọt ra sự nhục nhã của chính mình” hoặc “phun bọt ra những việc đáng hổ thẹn của chính mình.” Từ Hy Lạp ở số nhiều có thể chỉ chính nỗi ô nhục hoặc những hành vi ô nhục phơi bày con người họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự âm u của bóng tối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: những ngọn sóng dữ của biển
  rationale: Giữ nguyên hình ảnh và cấu trúc sở hữu của tiếng Hy Lạp; “sóng dữ” tự nhiên, mạnh và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐπαφρίζοντα
  choice: phun bọt ra
  rationale: Diễn đạt hành động liên tục của sóng tạo và đẩy bọt ra, đồng thời nối tự nhiên với tân ngữ chỉ những điều ô nhục.
- source_word: τὰς ἑαυτῶν αἰσχύνας
  choice: những điều ô nhục của chính mình
  rationale: Giữ số nhiều nổi bật của αἰσχύνας và sắc thái nhấn mạnh của ἑαυτῶν; cách nói này vẫn để ngỏ nghĩa là sự nhục nhã hoặc những hành vi đáng hổ thẹn.
- source_word: ἀστέρες πλανῆται
  choice: những ngôi sao lang thang
  rationale: Giữ phép ẩn dụ cổ đại về các thiên thể lang thang, không áp đặt nghĩa thiên văn hiện đại “các hành tinh”.
- source_word: οἷς
  choice: là những kẻ mà
  rationale: Làm rõ đại từ quan hệ quy về những người đang được ví như sao lang thang, thay vì quy về các vật thể vô tri.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: bóng tối mịt mù
  rationale: Truyền đạt sức tăng cường của hai từ chỉ sự tối tăm bằng một cụm từ Việt tự nhiên và trang trọng.
- source_word: εἰς αἰῶνα
  choice: cho đến đời đời
  rationale: Trong văn cảnh phán xét, cụm từ diễn tả thời hạn không cùng; “cho đến đời đời” giữ sắc thái trang trọng và sức nặng của lời cảnh báo.
- source_word: τετήρηται
  choice: đã được dành sẵn
  rationale: Thể hoàn thành bị động diễn tả một sự dành giữ đã được thực hiện và hiện vẫn có hiệu lực; “dành sẵn” phù hợp tự nhiên với hình phạt đang chờ đợi.
theological_decisions:
- issue: Thời hạn của hình ảnh phán xét trong εἰς αἰῶνα
  choice: cho đến đời đời
  alternative: cho đến thời đại
  rationale: Trong văn cảnh này, cách hiểu tự nhiên nhất là thời hạn không cùng. Bản dịch giữ nguyên sức nặng của lời phán xét nhưng không bổ sung mô tả giáo lý vượt quá câu văn.
- issue: Đối tượng của οἷς
  choice: hiểu là những người được ví với các ngôi sao lang thang
  alternative: hiểu theo ngữ pháp bề mặt là chính các ngôi sao
  rationale: Toàn bộ chuỗi ẩn dụ mô tả những người đã được nói đến; cách diễn đạt nhân xưng làm rõ quy chiếu mà không xóa phép ẩn dụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu hình ảnh. Giữ cấu trúc phân đoạn bằng dấu chấm phẩy của nguyên bản; tránh thuật ngữ giáo phái và không hiện đại hóa “sao lang thang” thành thuật ngữ thiên văn “hành tinh”.
