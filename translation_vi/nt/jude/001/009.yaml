id: JUD.1.9
reference: Jude 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: vi
  text: 'Nhưng khi tổng lãnh thiên sứ Mi-ca-ên tranh chấp với ma quỷ và tranh luận về thi thể của Môi-se, người không dám đưa ra lời kết án phỉ báng chống lại nó[a], mà nói: “Xin Chúa quở trách ngươi!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không dám buông lời lăng mạ để kết án nó.”'
    reason: lexical_alternative
  - marker: b
    text: Lời này gợi lại Xa-cha-ri 3:2, nơi Chúa quở trách Sa-tan.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: tổng lãnh thiên sứ
  rationale: Danh xưng quen thuộc trong tiếng Việt, diễn đạt một thiên sứ có địa vị đứng đầu mà không bổ sung chi tiết về phẩm trật.
- source_word: διαβόλῳ
  choice: ma quỷ
  rationale: Trong ngữ cảnh này, từ ngữ chỉ đích danh kẻ thù siêu nhiên; “ma quỷ” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: διακρινόμενος
  choice: tranh chấp
  rationale: Diễn đạt sự đối đầu, tranh chấp đang diễn ra và giữ được sắc thái pháp lý của ngữ cảnh.
- source_word: διελέγετο
  choice: tranh luận
  rationale: Phản ánh cuộc trao đổi bằng lời mang tính đối kháng, đồng thời không nhập làm một với διακρινόμενος.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: về thi thể của Môi-se
  rationale: “Thi thể” tự nhiên khi nói đến thân thể của người đã chết; cấu trúc “của Môi-se” giữ rõ quan hệ sở hữu.
- source_word: οὐκ ἐτόλμησεν
  choice: không dám
  rationale: Cách diễn đạt trực tiếp, tự nhiên cho ý không dám hoặc không tự tiện làm điều gì.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: đưa ra lời kết án phỉ báng chống lại nó
  rationale: Giữ sắc thái xét xử của κρίσις và tính xúc phạm, phỉ báng của βλασφημία, đồng thời tránh khẳng định quá mức rằng Mi-ca-ên phạm thượng với Đức Chúa Trời.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: Xin Chúa quở trách ngươi!
  rationale: Thể optative diễn tả lời cầu xin hoặc nguyện ước; “Xin” truyền đạt rõ lực ngữ pháp này trong tiếng Việt tự nhiên.
- source_word: κύριος
  choice: Chúa
  rationale: Danh xưng tiêu chuẩn và trang trọng trong tiếng Việt; viết hoa vì ở đây chỉ về Chúa.
theological_decisions:
- issue: Bản chất sự kiềm chế của Mi-ca-ên khi đối diện ma quỷ
  choice: Mi-ca-ên không tự mình đưa ra lời kết án mang tính phỉ báng, nhưng cầu xin Chúa quở trách ma quỷ.
  alternative: Mi-ca-ên không dám buông lời lăng mạ để kết án nó.
  rationale: Cụm Hy Lạp khó giải thích dứt khoát. Bản dịch giữ sự tương phản rõ ràng giữa việc Mi-ca-ên không tự kết án và việc người viện đến sự quở trách của Chúa, nhưng không xây dựng thêm một hệ thống thiên sứ học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” để nói về Mi-ca-ên và “nó/ngươi” cho ma quỷ nhằm tránh mơ hồ về đại từ. Các dấu chú thích được đặt sau toàn bộ lời trích dẫn vì chú thích [a] giải thích mệnh đề ngay trước đó, còn [b] giải thích lời trích dẫn.
