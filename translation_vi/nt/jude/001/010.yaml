id: JUD.1.10
reference: Jude 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: vi
  text: Nhưng những kẻ này phỉ báng những gì họ không hiểu[a]; còn những gì họ biết theo bản năng, như loài vật không có lý trí[b], thì chính bởi những điều ấy họ bị hủy hoại[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những gì họ không biết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những gì họ biết một cách tự nhiên, như loài vật không biết suy xét.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trong những điều ấy, họ trở nên bại hoại.” Động từ Hy Lạp có thể chỉ sự bại hoại hoặc sự hủy diệt.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: những kẻ này
  rationale: Đại từ chỉ những kẻ xâm nhập đang bị Giu-đe lên án trong văn cảnh; cách dịch này tự nhiên, rõ đối tượng và không thêm sắc thái chỉ nam giới.
- source_word: βλασφημοῦσιν
  choice: phỉ báng
  rationale: Động từ chỉ lời nói xúc phạm hoặc bôi nhọ, có thể hướng đến người hay những thực tại thiêng liêng. “Phỉ báng” giữ được độ nghiêm trọng mà không giới hạn nghĩa vào xúc phạm trực tiếp đến Đức Chúa Trời.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: những gì họ không hiểu
  rationale: Trong thế đối lập với sự biết theo bản năng, “không hiểu” diễn đạt phù hợp hơn ý thiếu nhận thức thấu đáo, dù động từ cũng có thể dịch sát là “không biết”.
- source_word: φυσικῶς
  choice: theo bản năng
  rationale: Trạng từ nói đến sự biết tự nhiên và được làm rõ bởi phép so sánh với loài vật; “theo bản năng” tự nhiên trong tiếng Việt và làm nổi bật sự tương phản với hiểu biết có lý trí.
- source_word: ἄλογα ζῷα
  choice: loài vật không có lý trí
  rationale: ἄλογα nhấn mạnh sự thiếu khả năng suy lý; cách dịch này rõ ràng, hiện đại và tránh sắc thái miệt thị dư thừa.
- source_word: ἐπίστανται
  choice: biết
  rationale: Ở đây động từ nói đến sự nhận biết giới hạn theo bản năng. “Biết” tạo thế đối lập tự nhiên với “không hiểu” và tránh gán cho loài vật sự hiểu biết có suy lý.
- source_word: ἐν τούτοις
  choice: chính bởi những điều ấy
  rationale: Cụm từ có thể mang nghĩa phạm vi “trong những điều ấy” hoặc phương tiện/nguyên nhân “bởi những điều ấy.” Cách dịch chính văn diễn đạt ý những điều họ theo bản năng biết trở thành phương tiện dẫn đến sự hủy hoại.
- source_word: φθείρονται
  choice: họ bị hủy hoại
  rationale: Động từ bao hàm cả sự bại hoại lẫn đi đến diệt vong. “Bị hủy hoại” giữ được sắc thái thụ động/trung gian và sức nặng về hậu quả mà không quyết định hoàn toàn giữa suy đồi đạo đức và sự diệt vong.
theological_decisions:
- issue: Nghĩa của βλασφημέω khi tân ngữ không nói rõ là Đức Chúa Trời
  choice: Dịch là “phỉ báng”
  alternative: “nói phạm thượng” hoặc “lăng mạ”
  rationale: Câu lên án việc nói xúc phạm về những điều họ không hiểu, nhưng không xác định tân ngữ là Đức Chúa Trời. “Phỉ báng” giữ tính nghiêm trọng mà không thu hẹp thành một khẳng định thần học không được nói rõ.
- issue: Sắc thái của φθείρονται
  choice: Dịch là “họ bị hủy hoại”
  alternative: “họ trở nên bại hoại” hoặc “họ bị diệt vong”
  rationale: Trong văn cảnh Giu-đe, sự suy đồi đạo đức và hậu quả phán xét đan xen. Cách dịch này giữ nguyên sức căng giữa hai sắc thái thay vì chỉ chọn một.
- issue: Quan hệ ngữ pháp của ἐν τούτοις
  choice: 'Hiểu theo nghĩa phương tiện/nguyên nhân: “chính bởi những điều ấy”'
  alternative: 'Hiểu theo nghĩa phạm vi: “trong những điều ấy”'
  rationale: Cả hai cách đều khả hữu. Chính văn chọn nghĩa phương tiện vì nối tự nhiên các bản năng họ theo đuổi với sự hủy hoại, còn chú thích bảo lưu cách hiểu theo phạm vi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Những kẻ này” giữ giọng luận chiến của thư Giu-đe; “loài vật không có lý trí” rõ nghĩa với độc giả phổ thông. Dấu chấm phẩy làm nổi bật cấu trúc tương phản μὲν…δὲ.
