revisions:
- from: Nhưng anh chị em, những người được yêu quý, hãy nhớ lại những lời đã được các sứ đồ của Chúa chúng ta là Đức Giê-su Ki-tô nói trước đây.
  to: Nhưng anh chị em yêu dấu, hãy nhớ những lời mà các sứ đồ của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, đã nói từ trước.[a]
  rationale: Chỉnh lời xưng hô cho tự nhiên, diễn đạt quan hệ của các sứ đồ với các lời được nói trước bằng một mệnh đề quan hệ tiếng Việt, và dịch Χριστός là danh hiệu «Đấng Mê-si-a». Chú thích bảo lưu cách gọi truyền thống mà không làm mờ nghĩa danh hiệu trong chính văn.
  reviewer_model: gpt-5.6-terra
