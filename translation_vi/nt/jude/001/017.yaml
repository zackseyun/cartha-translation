source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: vi
  text: Nhưng anh chị em yêu dấu, hãy nhớ những lời mà các sứ đồ của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, đã nói từ trước.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: «Đức Giê-su Ki-tô».'
    reason: Phương án tên-hiệu truyền thống cho «Đức Giê-su, Đấng Mê-si-a».
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: Nhưng anh chị em
  rationale: Giữ sắc thái tương phản của δέ và chủ ngữ được nhấn mạnh Ὑμεῖς, đồng thời dùng cách xưng hô số nhiều tự nhiên trong tiếng Việt để chuyển trọng tâm từ những kẻ vừa được nói đến sang độc giả.
- source_word: ἀγαπητοί
  choice: những người được yêu quý
  rationale: Chuyển lời gọi thân tình ở số nhiều, giữ được sắc thái được yêu thương mà không giới hạn giới tính.
- source_word: μνήσθητε
  choice: hãy nhớ lại
  rationale: Thể hiện trực tiếp mệnh lệnh nhớ lại điều đã được dạy trước đó.
- source_word: τῶν ῥημάτων
  choice: những lời
  rationale: ῥήματα chỉ các lời phát biểu; “những lời” vừa chính xác vừa tự nhiên trong ngữ cảnh.
- source_word: τῶν προειρημένων
  choice: đã được ... nói trước đây
  rationale: Giữ ý bị động và tính có trước về thời gian của phân từ hoàn thành; tránh “tiên báo,” vốn có thể khiến người đọc hiểu quá mạnh theo nghĩa lời tiên tri dự đoán.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: được các sứ đồ ... nói
  rationale: Dùng thuật ngữ Tân Ước quen thuộc “sứ đồ” và thể hiện rõ các sứ đồ là tác nhân của lời nói.
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: Giữ quan hệ sở thuộc trong nguyên văn và cách gọi κύριος theo văn phong Kinh Thánh tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su Ki-tô
  rationale: Dùng dạng tên gọi trang trọng, quen thuộc và tự nhiên trong tiếng Việt; “Ki-tô” là cách phiên chuyển truyền thống của Χριστός trong cụm tên-hiệu này.
theological_decisions:
- issue: Chức năng của Χριστοῦ trong cụm Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su Ki-tô
  alternative: Đức Giê-su, Đấng Mê-si-a
  rationale: Trong tiếng Việt hiện đại, “Đức Giê-su Ki-tô” là cách gọi trang trọng, phổ thông và vẫn bảo tồn danh hiệu Χριστός; dịch “Đấng Mê-si-a” làm nghĩa chức danh rõ hơn nhưng có thể tạo cảm giác giải nghĩa quá mức trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được sắp xếp để tiếng Việt tự nhiên nhưng vẫn giữ sự tương phản, lời gọi thân tình, mệnh lệnh và quan hệ giữa các sứ đồ với Chúa Giê-su.
