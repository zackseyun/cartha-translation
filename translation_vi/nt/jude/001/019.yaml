id: JUD.1.19
reference: Jude 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: vi
  text: Chính họ là những kẻ gây chia rẽ[a], sống theo bản tính tự nhiên[b], không có Thánh Linh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự tách mình ra” hoặc “tạo ra những phe phái.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thuộc về tự nhiên” hoặc “không thuộc linh.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên ngữ cũng có thể dịch là “linh”, nhưng trong văn cảnh, từ này rất có thể chỉ Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: Chính họ
  rationale: Đại từ chỉ định hồi chỉ về những kẻ đã được mô tả trong văn cảnh; “chính họ” tự nhiên trong tiếng Việt và giữ sắc thái nhận diện nhấn mạnh.
- source_word: οἱ ἀποδιορίζοντες
  choice: những kẻ gây chia rẽ
  rationale: Phân từ mô tả hoạt động gây phân hóa của họ. Cách dịch này phù hợp nhất với văn cảnh, đồng thời khả năng “tự tách mình ra” được giữ trong chú thích.
- source_word: ψυχικοί
  choice: sống theo bản tính tự nhiên
  rationale: Từ này đối lập với việc có Thánh Linh, chỉ những người sống ở bình diện thuần tự nhiên, không được Thánh Linh chi phối. Cách diễn đạt này dễ hiểu hơn “thuộc về hồn” và tránh để “thế tục” mang nghĩa quá rộng.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Trong sự đối lập trực tiếp với ψυχικοί và theo mạch thần học của thư Giu-đe, từ này rất có thể chỉ Thánh Linh. Tuy nhiên, vì nguyên ngữ không có mạo từ và về mặt từ vựng cũng có thể là “linh”, khả năng ấy được ghi ở chú thích.
- source_word: μὴ ἔχοντες
  choice: không có
  rationale: Diễn đạt ngắn gọn, tự nhiên và sát nghĩa cấu trúc phân từ phủ định của nguyên ngữ.
theological_decisions:
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: linh
  rationale: Sự tương phản với ψυχικοί trong văn cảnh nghiêng mạnh về Thánh Linh, nhưng bản thân hình thức Hy Lạp vẫn để ngỏ khả năng hiểu là “linh”; bản dịch chính chọn cách hiểu có xác suất cao hơn và chú thích bảo tồn độ mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những kẻ” giữ sắc thái lên án rõ rệt của văn cảnh; “sống theo bản tính tự nhiên” chuyển tải ψυχικοί mà không dùng thuật ngữ khó hiểu. Mọi điểm mơ hồ đáng kể đều được giữ trong chú thích.
