revisions:
- from: Tuy vậy, cũng giống như thế, những kẻ này dựa vào chiêm bao[a] mà làm ô uế xác thịt, khước từ quyền cai trị và phỉ báng các đấng vinh hiển[b].
  to: Tuy vậy, cũng như thế, những kẻ này dựa vào những giấc mơ[a] mà làm ô uế xác thịt, khước từ quyền cai trị và phỉ báng các hữu thể vinh hiển[b].
  rationale: Các chỉnh sửa chỉ nhằm làm văn phong Việt tự nhiên hơn và giảm sắc thái tước hiệu không cần thiết. Chúng không thay đổi nghĩa, không xác định quá mức đối tượng của δόξας, và vẫn bảo lưu cách hiểu có tính diễn giải của ἐνυπνιαζόμενοι trong chú thích.
  reviewer_model: gpt-5.6-terra
