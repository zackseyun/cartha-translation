id: JUD.1.8
reference: Jude 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: vi
  text: Tuy vậy, cũng như thế, những kẻ này dựa vào những giấc mơ[a] mà làm ô uế xác thịt, khước từ quyền cai trị và phỉ báng các hữu thể vinh hiển[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang chiêm bao.” Phân từ Hy Lạp có thể được dịch sát như vậy, nhưng tại đây có lẽ hàm ý rằng họ viện đến các giấc mơ để biện minh cho hành vi của mình.'
    reason: lexical_alternative
  - marker: b
    text: “Các hữu thể vinh hiển” có lẽ chỉ những hữu thể thiên thượng cao trọng, có thể là các thiên sứ; nguyên văn Hy Lạp là “các sự vinh hiển.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: Tuy vậy, cũng giống như thế
  rationale: Giữ cả ý so sánh của ὁμοίως với các trường hợp trước đó lẫn sắc thái đối lập nhẹ của μέντοι.
- source_word: οὗτοι
  choice: những kẻ này
  rationale: Chỉ những kẻ xâm nhập đang bị Giu-đe lên án; cách gọi này tự nhiên trong văn cảnh và không thêm nét chỉ riêng nam giới.
- source_word: ἐνυπνιαζόμενοι
  choice: dựa vào chiêm bao
  rationale: Diễn đạt cách hiểu khả dĩ rằng họ lấy các kinh nghiệm chiêm bao làm cơ sở cho hành vi; chú thích giữ lại cách dịch sát hình thức hơn.
- source_word: σάρκα
  choice: xác thịt
  rationale: Giữ thuật ngữ cụ thể của tiếng Hy Lạp và tránh thu hẹp thành thân thể của chính họ hoặc diễn giải thành một thuật ngữ thần học chuyên biệt.
- source_word: μιαίνουσιν
  choice: làm ô uế
  rationale: Phù hợp với sắc thái ô nhiễm về luân lý hoặc nghi lễ và giọng lên án của thư.
- source_word: κυριότητα
  choice: quyền cai trị
  rationale: Giữ ý lordship/dominion mà không quyết định đó là quyền của Đức Chúa Trời, của các hữu thể thiên thượng hay quyền bính nói chung.
- source_word: ἀθετοῦσιν
  choice: khước từ
  rationale: Diễn đạt hành động bác bỏ hoặc không thừa nhận điều đáng phải được công nhận.
- source_word: δόξας
  choice: các đấng vinh hiển
  rationale: Dạng số nhiều có lẽ chỉ các hữu thể thiên thượng cao trọng; cách dịch này giữ tính rộng của nguyên ngữ mà không xác định ngay là thiên sứ.
- source_word: βλασφημοῦσιν
  choice: phỉ báng
  rationale: Truyền đạt lời nói xúc phạm, lăng mạ nghiêm trọng đối với các hữu thể được tôn cao, không giới hạn động từ vào lời phạm thượng chống Đức Chúa Trời.
theological_decisions:
- issue: Đối tượng của δόξας
  choice: một cách gọi rộng chỉ các đấng hoặc hữu thể vinh hiển, cao trọng
  alternative: các thiên sứ; các quyền uy thiên thượng; các sự vinh hiển theo nghĩa trừu tượng
  rationale: Văn cảnh kế tiếp hướng tới các hữu thể thiên thượng, nhưng danh từ ở đây không nói rõ là thiên sứ. Bản dịch chính giữ độ rộng ấy và chú thích nêu khả năng cụ thể hơn.
- issue: Sắc thái của ἐνυπνιαζόμενοι
  choice: hành vi của họ gắn với việc dựa vào chiêm bao
  alternative: đang chiêm bao; là những kẻ mộng mị
  rationale: Phân từ có thể nêu cơ sở hoặc cách thức hành động. Cách dịch chính thể hiện cách hiểu này, còn chú thích bảo lưu lối dịch sát hơn để không che khuất sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những kẻ này” giữ giọng quở trách mạnh của Giu-đe; “xác thịt,” “quyền cai trị” và “các đấng vinh hiển” bảo lưu tính hàm súc cùng những điểm chưa xác định rõ trong nguyên ngữ.
