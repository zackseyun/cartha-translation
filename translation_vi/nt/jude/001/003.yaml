revisions:
- from: Anh chị em yêu dấu, trong khi tôi hết lòng muốn viết cho anh chị em về sự cứu rỗi chung của chúng ta, tôi nhận thấy cần phải viết để khuyên anh chị em hãy hết sức tranh đấu cho đức tin đã được truyền lại một lần đủ cả cho dân thánh.[a][b]
  to: Anh chị em yêu dấu, dù tôi đã hết sức sốt sắng viết cho anh chị em về sự cứu rỗi chung của chúng ta, tôi thấy cần phải viết để tha thiết khuyên anh chị em hãy hết sức tranh đấu cho đức tin[a] đã được truyền lại một lần là đủ cho dân thánh.[b]
  rationale: Bản sửa phục hồi sắc thái sốt sắng của πᾶσαν σπουδὴν ποιούμενος, diễn đạt tự nhiên hơn tính dứt khoát của ἅπαξ, và làm rõ lực khích lệ của παρακαλῶν. Cấu trúc vẫn giữ hai lần “viết” của nguyên văn, nhưng không lặp lại “cho anh chị em” khi đối tượng đã rõ. Các chú thích được neo trực tiếp tại những thuật ngữ chúng giải thích.
  reviewer_model: gpt-5.6-terra
