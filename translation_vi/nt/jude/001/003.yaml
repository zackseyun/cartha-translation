id: JUD.1.3
reference: Jude 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: vi
  text: Anh chị em yêu dấu, dù tôi đã hết sức sốt sắng viết cho anh chị em về sự cứu rỗi chung của chúng ta, tôi thấy cần phải viết để tha thiết khuyên anh chị em hãy hết sức tranh đấu cho đức tin[a] đã được truyền lại một lần là đủ cho dân thánh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đức tin” ở đây chủ yếu chỉ nội dung đức tin được trao truyền cho cộng đồng tín hữu, chứ không chỉ hành vi tin cậy của mỗi cá nhân.
    reason: alternative_reading
  - marker: b
    text: “Dân thánh” là những người thuộc về Đức Chúa Trời, tức cộng đồng tín hữu; từ này không chỉ một tầng lớp đặc biệt đã được phong thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Cách xưng hô số nhiều này vừa tự nhiên trong cộng đồng tín hữu Việt Nam, vừa giữ được sắc thái trìu mến và mối liên hệ với tình yêu.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: trong khi tôi hết lòng muốn
  rationale: Cụm từ diễn tả sự sốt sắng và chuyên tâm. Trong ngữ cảnh, nó nêu dự định ban đầu trước khi một nhu cầu cấp thiết khiến Giu-đe đổi trọng tâm thư; cách dịch này giữ quan hệ ấy mà không buộc phải thêm sắc thái nhượng bộ quá rõ.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: về sự cứu rỗi chung của chúng ta
  rationale: Giữ ý κοινός là điều cùng chung, được chia sẻ, đồng thời dùng cách diễn đạt trang trọng và dễ hiểu.
- source_word: ἀνάγκην ἔσχον
  choice: tôi nhận thấy cần phải
  rationale: Diễn đạt tự nhiên sự cần thiết nảy sinh từ hoàn cảnh, không tăng cường thành ý bị cưỡng ép.
- source_word: παρακαλῶν
  choice: để khuyên
  rationale: Trong cấu trúc câu, phân từ nêu nội dung hay mục đích cấp thiết của việc viết; 'khuyên' rõ ràng, nghiêm túc nhưng không quá nặng.
- source_word: ἐπαγωνίζεσθαι
  choice: hãy hết sức tranh đấu
  rationale: Động từ ghép mang sắc thái nỗ lực mạnh mẽ. 'Hết sức tranh đấu' giữ cường độ mà không mặc nhiên biến lời kêu gọi thành bạo lực thể chất.
- source_word: τῇ ... πίστει
  choice: cho đức tin
  rationale: Trong ngữ cảnh một điều đã được truyền cho cộng đồng, πίστις chủ yếu chỉ nội dung đức tin được tin nhận, không chỉ hành vi tin của cá nhân.
- source_word: ἅπαξ
  choice: một lần đủ cả
  rationale: Giữ sắc thái dứt khoát, không lặp lại của ἅπαξ trong ngữ cảnh này.
- source_word: παραδοθείσῃ
  choice: đã được truyền lại
  rationale: Động từ chỉ việc trao truyền hoặc giao phó. 'Truyền lại' làm rõ sự chuyển giao giáo huấn mà vẫn giữ thể bị động của nguyên văn.
- source_word: τοῖς ἁγίοις
  choice: cho dân thánh
  rationale: Trong cách dùng Cơ Đốc giáo ban đầu, cụm từ chỉ cộng đồng những người thuộc về Đức Chúa Trời; 'dân thánh' tránh hàm ý chỉ một tầng lớp đặc biệt đã được phong thánh.
theological_decisions:
- issue: Ý nghĩa của πίστις trong cụm 'tranh đấu cho đức tin'
  choice: Nội dung đức tin được giao cho cộng đồng tín hữu
  alternative: Hành vi tin cậy mang tính cá nhân
  rationale: Mệnh đề 'đã được truyền lại ... cho dân thánh' cho thấy đây chủ yếu là điều được trao truyền cho cả cộng đồng. Bản dịch vẫn dùng từ 'đức tin' để không đóng kín hoàn toàn trường nghĩa.
- issue: Sức nặng của ἅπαξ παραδοθείσῃ
  choice: Một sự trao truyền dứt khoát, một lần đủ cả
  alternative: Đã được truyền lại một lần, chỉ nêu thời điểm trong quá khứ
  rationale: Trong cấu trúc này, ἅπαξ tự nhiên nhấn mạnh tính dứt khoát của việc trao truyền; cách dịch không thêm một hệ thống giáo lý về phương thức hay thời điểm hoàn tất.
- issue: Quan hệ của πᾶσαν σπουδὴν ποιούμενος với mệnh đề chính
  choice: Mệnh đề hoàn cảnh nêu ý định sốt sắng ban đầu
  alternative: 'Mệnh đề nhượng bộ rõ: ''mặc dù tôi đã hết sức...'''
  rationale: Phân từ có thể được hiểu theo sắc thái hoàn cảnh hoặc nhượng bộ từ ngữ cảnh. 'Trong khi' bảo tồn độ mở cú pháp tốt hơn, còn sự chuyển hướng do nhu cầu cấp thiết vẫn rõ trong toàn câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính mục vụ. Dùng 'anh chị em' để thể hiện số nhiều bao gồm cả cộng đồng; giữ các thuật ngữ quen thuộc 'sự cứu rỗi' và 'đức tin'. Tránh lặp 'viết cho anh chị em' lần thứ hai vì đối tượng đã rõ, nhưng vẫn phản ánh hai động từ nguyên ngữ qua 'muốn viết' và 'cần phải viết'.
