revisions:
- from: Nhưng anh chị em, là những người được yêu dấu, hãy tự xây dựng mình trên đức tin chí thánh của anh chị em[a], và cầu nguyện trong Đức Thánh Linh[b],
  to: Còn anh chị em yêu dấu, hãy xây dựng chính mình trên đức tin chí thánh của anh chị em[a], và cầu nguyện trong Đức Thánh Linh[b],
  rationale: Sửa lời gọi trực tiếp để phản ánh hô cách ἀγαπητοί và làm câu tiếng Việt tự nhiên hơn. Giữ “hãy” để truyền đạt lực khuyên bảo của chuỗi phân từ trong câu 20–21, đồng thời giữ dấu phẩy cuối câu để nối với câu tiếp theo. Các chú thích vẫn bảo tồn những khả năng của dữ cách với ἐποικοδομοῦντες và của ἐν πνεύματι ἁγίῳ.
