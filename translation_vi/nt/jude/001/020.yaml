  verdict: revise
  source_fidelity: Bản nháp giữ đúng sự tương phản của δέ, hình ảnh ἐποικοδομοῦντες, tính phản thân của ἑαυτούς, cấp so sánh tuyệt đối trong ἁγιωτάτῃ, và cách hiểu tự nhiên của ἐν πνεύματι ἁγίῳ là Đức Thánh Linh. “Trên đức tin” là cách chuyển ngữ có cơ sở cho dữ cách đi với động từ ‘xây trên’; chú thích đã bảo lưu cách hiểu ‘trong’.
  naturalness: “Là những người được yêu dấu” không hoạt động tự nhiên như một lời gọi trực tiếp cho ἀγαπητοί, và làm yếu nét xưng hô của nguyên văn. “Còn anh chị em yêu dấu” vừa tự nhiên trong tiếng Việt hiện đại vừa giữ rõ đối lập và hô cách. “Hãy xây dựng chính mình” diễn đạt mạch khích lệ hướng đến các mệnh đề tiếp theo rõ hơn.
