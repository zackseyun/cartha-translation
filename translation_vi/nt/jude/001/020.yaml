source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: vi
  text: Còn anh chị em yêu dấu, hãy xây dựng chính mình trên đức tin chí thánh của anh chị em[a], và cầu nguyện trong Đức Thánh Linh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy xây dựng chính mình trong đức tin chí thánh của anh chị em.” Cấu trúc Hy Lạp có thể chỉ việc xây trên một nền hoặc việc được xây dựng trong mối liên hệ với đức tin ấy. “Đức tin” ở đây cũng có thể mang sắc thái “sự tin cậy” hoặc “lòng trung tín,” dù trong Giu-đe nhiều khả năng từ này chỉ đức tin chung của cộng đồng Cơ Đốc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhờ Đức Thánh Linh.” Cụm từ có thể nhấn mạnh phạm vi mà lời cầu nguyện diễn ra (“trong”) hoặc tác động ban năng lực của Đức Thánh Linh (“nhờ”).'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Nhưng anh chị em
  rationale: δέ tạo sự tương phản với những người vừa được nói đến, còn đại từ ὑμεῖς nhấn mạnh chính cộng đồng được خطاب; cách dịch này tự nhiên trong tiếng Việt và giữ được cả sự tương phản lẫn lời hướng trực tiếp.
- source_word: ἀγαπητοί
  choice: là những người được yêu dấu
  rationale: Danh từ xưng hô số nhiều diễn tả tình cảm sâu sắc và địa vị của người nhận như những người được yêu; cách diễn đạt này trang trọng nhưng vẫn dễ hiểu.
- source_word: ἐποικοδομοῦντες ἑαυτοὺς
  choice: hãy tự xây dựng mình
  rationale: Phân từ mang lực khuyên bảo trong chuỗi mệnh lệnh của câu 20–21. “Tự xây dựng mình” giữ hình ảnh xây dựng và đại từ phản thân số nhiều, đồng thời có thể được hiểu theo nghĩa cộng đồng.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: trên đức tin chí thánh của anh chị em
  rationale: Dữ cách có thể chỉ nền tảng hoặc phạm vi. “Trên” làm rõ hình ảnh xây trên nền nhưng không thêm một nền tảng ngoài điều bản văn nêu; “chí thánh” giữ sắc thái tối cao của ἁγιωτάτῃ.
- source_word: πίστει
  choice: đức tin
  rationale: Trong thư Giu-đe, từ này nhiều khả năng chỉ đức tin Cơ Đốc chung đã được tiếp nhận, nhưng bản dịch vẫn để ngỏ sắc thái tin cậy hoặc trung tín qua chú thích.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: Cụm từ tự nhiên nhất chỉ Đức Thánh Linh. “Trong” giữ nguyên giới từ ἐν và không quyết định dứt khoát giữa phạm vi hoạt động và tác nhân ban năng lực.
- source_word: προσευχόμενοι
  choice: cầu nguyện
  rationale: Phân từ hiện tại phối hợp với hành động xây dựng và nối tiếp sang câu sau; cách diễn đạt bằng lời khuyên trực tiếp tự nhiên hơn trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được chỉ bởi πνεύματι ἁγίῳ
  choice: Đức Thánh Linh
  alternative: một tâm thần hoặc thái độ thánh khiết của con người
  rationale: Cách dùng trong bối cảnh Cơ Đốc giáo sơ kỳ và lời khuyên cầu nguyện khiến việc hiểu đây là Đức Thánh Linh hợp lý nhất; bản dịch không thêm diễn giải thần học vượt quá câu chữ.
- issue: Ý nghĩa của πίστις trong cụm “đức tin chí thánh của anh chị em”
  choice: đức tin chung mà cộng đồng tin nhận
  alternative: hành động tin cậy hoặc lòng trung tín của họ
  rationale: Ngôn ngữ về “đức tin” trong Giu-đe hướng đến nội dung đức tin đã được truyền lại, nhưng từ ngữ vẫn có thể mang các sắc thái khác nên chú thích bảo tồn khả năng ấy.
- issue: Quan hệ của τῇ ἁγιωτάτῃ ὑμῶν πίστει với hình ảnh xây dựng
  choice: đức tin là nền mà cộng đồng xây dựng trên đó
  alternative: việc xây dựng diễn ra trong mối liên hệ hoặc phạm vi của đức tin
  rationale: Động từ ghép ἐποικοδομέω thường gợi ý xây trên một nền có sẵn; tuy nhiên, dữ cách cũng cho phép cách hiểu rộng hơn nên ghi chú nêu phương án thay thế.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho lời xưng hô số nhiều trong cộng đồng; giữ hình ảnh xây dựng và nhịp câu mở để nối tự nhiên sang câu 21.
