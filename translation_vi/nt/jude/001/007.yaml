revisions:
- from: Cũng như Sô-đôm, Gô-mô-rơ và các thành chung quanh, họ đã phạm tội gian dâm theo cách giống như những kẻ ấy[a] và chạy theo xác thịt khác lạ[b], nên bị bày ra làm gương, chịu hình phạt của lửa đời đời.
  to: Cũng như Sô-đôm, Gô-mô-rơ và các thành chung quanh chúng, đã theo cách tương tự như những kẻ ấy[a] buông mình vào sự vô luân tình dục và theo đuổi xác thịt khác[b], được nêu ra làm gương, đang chịu hình phạt của lửa đời đời.
  rationale: Bản sửa giữ sự mơ hồ của τούτοις qua “những kẻ ấy” và chú thích, giữ cách nói không diễn giải “xác thịt khác,” đồng thời điều chỉnh cú pháp để các phân từ Hy Lạp mô tả các thành và dẫn tự nhiên đến mệnh đề chính. Không thêm diễn giải về bản chất của hành vi hay về phạm vi thần học của lửa đời đời.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:31:19Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các thành tố chính của câu, gồm các thành quanh Sô-đôm và Gô-mô-rơ, sự so sánh có tiền ngữ chưa xác định, “xác thịt khác,” gương cảnh cáo, và lửa đời đời. Tuy nhiên, “họ” không có tiền ngữ tự nhiên sau một chủ ngữ là các thành, “nên” làm quan hệ giữa các phân từ và mệnh đề chính trở nên nhân quả rõ hơn cấu trúc nguyên văn, và “chạy theo” hơi khẩu ngữ trong văn cảnh này.
  naturalness: Cần chỉnh để câu tiếng Việt hiện đại, trang trọng và mạch lạc hơn. “Các thành chung quanh chúng” rõ hơn “các thành chung quanh”; “được nêu ra làm gương” tự nhiên hơn “bị bày ra làm gương”; “theo đuổi xác thịt khác” giữ phép ẩn dụ theo đuổi của tiếng Hy Lạp mà bớt khẩu ngữ.
  terminology: “Vô luân tình dục” diễn đạt bao quát ἐκπορνεύσασαι hơn “phạm tội gian dâm,” vốn trong tiếng Việt thường gợi riêng hành vi ngoại tình. Giữ “xác thịt khác” để phản ánh σαρκὸς ἑτέρας mà không áp đặt cách giải thích. “Lửa đời đời” và “hình phạt” phù hợp với πυρὸς αἰωνίου và δίκην ὑπέχουσαι.
  issues:
  - severity: medium
    issue: Đại từ “họ” và liên từ “nên” làm lệch cấu trúc câu.
    rationale: Chủ ngữ được nêu là Sô-đôm, Gô-mô-rơ và các thành; “họ” tạo quy chiếu kém tự nhiên. “Nên” biến các phân từ mô tả thành quan hệ nguyên nhân-kết quả minh thị hơn nguyên văn, trong khi mệnh đề chính là “được nêu ra làm gương ... chịu hình phạt.”
  - severity: medium
    issue: “Phạm tội gian dâm” có thể bị hiểu hẹp.
    rationale: ἐκπορνεύσασαι chỉ sự buông mình vào/vướng vào vô luân tình dục, không nhất thiết chỉ hành vi ngoại tình theo nghĩa phổ biến của “gian dâm” trong tiếng Việt.
  - severity: low
    issue: “Chạy theo” hơi khẩu ngữ và “bị bày ra” không tự nhiên bằng cách diễn đạt công khai làm gương.
    rationale: “Theo đuổi” phản ánh tốt hơn ἀπελθοῦσαι ὀπίσω trong văn phong trang trọng; “được nêu ra làm gương” diễn đạt tự nhiên chức năng của πρόκεινται δεῖγμα.
