id: JUD.1.7
reference: Jude 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: vi
  text: Cũng như Sô-đôm, Gô-mô-rơ và các thành chung quanh chúng, đã theo cách tương tự như những kẻ ấy[a] buông mình vào sự vô luân tình dục và theo đuổi xác thịt khác[b], được nêu ra làm gương, đang chịu hình phạt của lửa đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đại từ “những kẻ ấy” có thể chỉ các thiên sứ được nói đến ở câu trước, hoặc rộng hơn là những đối tượng trong các trường hợp nổi loạn và phán xét đã nêu trước đó.
    reason: alternative_reading
  - marker: b
    text: Hay “xác thịt khác lạ”; theo truyền thống cũng dịch là “xác thịt xa lạ”. Cụm từ được dịch sát và không bị thu hẹp vào một cách giải thích cụ thể.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Cũng như
  rationale: Diễn đạt rõ quan hệ so sánh với các trường hợp được nêu trước đó.
- source_word: Σόδομα καὶ Γόμορρα
  choice: Sô-đôm, Gô-mô-rơ
  rationale: Dùng dạng phiên âm quen thuộc của các địa danh Kinh Thánh trong tiếng Việt.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: các thành chung quanh
  rationale: Chuyển tải tự nhiên ý nghĩa địa lý của περὶ với đối cách.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: theo cách giống như những kẻ ấy
  rationale: Giữ cả ý so sánh và đại từ τούτοις; chú thích nêu sự không chắc chắn về đối tượng mà đại từ chỉ đến.
- source_word: ἐκπορνεύσασαι
  choice: đã phạm tội gian dâm
  rationale: Diễn đạt thẳng thắn hành vi vô luân tình dục; trong văn cảnh Sô-đôm và Gô-mô-rơ, “gian dâm” là cách nói trang trọng và dễ hiểu.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: chạy theo
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ ý theo đuổi của cụm Hy Lạp.
- source_word: σαρκὸς ἑτέρας
  choice: xác thịt khác lạ
  rationale: Giữ sát danh từ σάρξ và nét nghĩa “khác/thuộc loại khác” của ἕτερος, không thu hẹp thành một cách giải thích cụ thể.
- source_word: πρόκεινται δεῖγμα
  choice: bị bày ra làm gương
  rationale: Thể hiện việc được đặt ra công khai như một trường hợp cảnh báo.
- source_word: πυρὸς αἰωνίου
  choice: lửa đời đời
  rationale: Cách dịch trực tiếp, trang trọng và quen thuộc, không mở rộng thành một kết luận thần học ngoài câu.
- source_word: δίκην ὑπέχουσαι
  choice: chịu hình phạt
  rationale: Giữ ý pháp lý của thành ngữ Hy Lạp bằng lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng mà τούτοις chỉ đến
  choice: Giữ đại từ không xác định là “những kẻ ấy” và giải thích sự mơ hồ trong chú thích.
  alternative: Hiểu là các thiên sứ ở câu 6, hoặc rộng hơn là những đối tượng trong các trường hợp nổi loạn và phán xét đã nêu trước đó.
  rationale: Bản Hy Lạp nêu quan hệ tương đồng nhưng không xác định dứt khoát tiền ngữ; bản dịch không nên âm thầm giải quyết sự mơ hồ này.
- issue: Ý nghĩa của σαρκὸς ἑτέρας
  choice: Dịch sát là “xác thịt khác lạ”.
  alternative: “xác thịt khác” hoặc diễn giải cụ thể thành hành vi đồng giới hay sự vượt ranh giới thiên sứ–con người.
  rationale: Cụm từ Hy Lạp không tự nó xác định chính xác bản chất của đối tượng; cách dịch sát giữ nguyên sức căng giải nghĩa và tránh nhập một lập trường giáo phái.
- issue: Sức nặng của πυρὸς αἰωνίου
  choice: Giữ nguyên cách nói “lửa đời đời”.
  alternative: “lửa vĩnh viễn”.
  rationale: Phản ánh trực tiếp ngôn ngữ phán xét của câu mà không làm nhẹ đi hoặc phát triển thành một hệ thống giáo lý đầy đủ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc so sánh của nguyên văn, ngôn ngữ phán xét mạnh, cùng hai điểm mơ hồ thực sự là tiền ngữ của τούτοις và ý nghĩa chính xác của σαρκὸς ἑτέρας.
