id: JUD.1.18
reference: Jude 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: vi
  text: 'Họ từng nói với anh chị em rằng: “Trong thời kỳ cuối cùng[a] sẽ có những kẻ nhạo báng[b], sống theo những ham muốn vô đạo của chính mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vào cuối thời gian.” Tiếng Hy Lạp dùng từ “thời kỳ/thời gian” ở số ít, không phải “những ngày.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “những kẻ chế giễu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: từng nói
  rationale: Thì chưa hoàn thành gợi lời nói đã được lặp lại hoặc thường xuyên nói trong quá khứ; “từng nói” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: Trong thời kỳ cuối cùng
  rationale: Giữ danh từ số ít χρόνος (“thời kỳ/thời gian”), không đổi thành cách nói quen thuộc nhưng kém sát hơn là “những ngày cuối cùng”.
- source_word: ἐμπαῖκται
  choice: những kẻ nhạo báng
  rationale: Diễn đạt rõ hành vi chế nhạo, chống đối và dễ hiểu trong tiếng Việt hiện đại.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: theo những ham muốn ... của chính mình
  rationale: κατά với đối cách chỉ sự sống phù hợp hoặc bị chi phối bởi các ham muốn của chính họ; “ham muốn” giữ nghĩa rộng hơn “dục vọng”.
- source_word: πορευόμενοι
  choice: sống theo
  rationale: Động từ có nghĩa đen là đi lại nhưng ở đây mô tả lối sống; “sống theo” truyền đạt tự nhiên nghĩa ẩn dụ trong tiếng Việt.
- source_word: τῶν ἀσεβειῶν
  choice: vô đạo
  rationale: Cụm sở hữu cách mô tả những ham muốn mang tính bất kính đối với Đức Chúa Trời; tính từ “vô đạo” giữ phán định luân lý-tôn giáo mà không thu hẹp vào ham muốn tình dục.
theological_decisions:
- issue: Cụm từ chỉ thời kỳ cánh chung
  choice: Trong thời kỳ cuối cùng
  alternative: Vào cuối thời gian; trong những ngày cuối cùng
  rationale: Bản dịch giữ số ít của χρόνος và không đồng nhất hóa cách nói riêng của Giu-đe với những công thức cánh chung quen thuộc ở nơi khác.
- issue: Đặc tính luân lý của các ham muốn
  choice: những ham muốn vô đạo
  alternative: những ham muốn bất kính; những dục vọng vô đạo
  rationale: Cách dịch giữ lời phán định tiêu cực của nguyên văn nhưng không giới hạn ἐπιθυμίαι vào dục vọng tình dục.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện đại từ số nhiều ὑμῖν theo cách tự nhiên, bao quát trong tiếng Việt. Các dấu chú thích được đặt ngay sau đúng cụm từ mà chúng giải thích.
