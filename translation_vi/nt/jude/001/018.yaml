  terminology: “Kẻ nhạo báng” là cách dịch chuẩn xác và dễ hiểu cho ἐμπαῖκται; chú thích “kẻ chế giễu” cung cấp phương án từ vựng gần nghĩa. “Vô đạo” duy trì sắc thái bất kính/không tin kính của ἀσέβεια mà không áp đặt một cách diễn giải giáo phái.
