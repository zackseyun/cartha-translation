id: JUD.1.1
reference: Jude 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: vi
  text: Giu-đe, nô lệ của Giê-su, Đấng Mê-si, và là anh em của Gia-cơ, kính gửi những người được yêu thương trong Đức Chúa Trời là Cha[b], được gìn giữ cho Giê-su, Đấng Mê-si[a], và được kêu gọi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được Giê-su, Đấng Mê-si, gìn giữ.” Dữ cách Hy Lạp có thể chỉ tác nhân (“bởi”) hoặc sở hướng/lợi ích (“cho”).'
    reason: alternative_reading
  - marker: b
    text: Một số thủ bản chép “được thánh hóa trong Đức Chúa Trời là Cha” thay cho “được yêu thương trong Đức Chúa Trời là Cha.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἰούδας
  choice: Giu-đe
  rationale: Dùng dạng tên quen thuộc trong Kinh Thánh tiếng Việt, phân biệt tác giả với Giu-đa Ích-ca-ri-ốt.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Trong lời tự giới thiệu của một thư tín, “đầy tớ” diễn đạt tự nhiên sự lệ thuộc và tận hiến hoàn toàn cho Chúa; “nô lệ” sát nghĩa sở hữu hơn nhưng dễ gợi trọng tâm xã hội ngoài ý của câu.
- source_word: Χριστοῦ / Χριστῷ
  choice: Đấng Mê-si
  rationale: Χριστός là tước hiệu chỉ Đấng được xức dầu; dịch nghĩa giúp người đọc nhận ra đây không chỉ là một thành tố của tên riêng.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: và là anh em của Gia-cơ
  rationale: δέ có sắc thái nối nhẹ; “và” tự nhiên trong phần tự giới thiệu. “Anh em” giữ lại sự không xác định của ἀδελφός về anh hay em.
- source_word: ἐν θεῷ πατρὶ
  choice: trong Đức Chúa Trời là Cha
  rationale: Giữ nghĩa phạm vi/liên hiệp của ἐν và diễn đạt tự nhiên quan hệ đồng vị trong tiếng Việt.
- source_word: ἠγαπημένοις
  choice: được yêu thương
  rationale: Thể hoàn thành bị động nói đến tình trạng hiện tại phát sinh từ hành động yêu thương đã được ban; cách dịch không tự thêm chủ thể.
- source_word: τετηρημένοις
  choice: được gìn giữ cho
  rationale: Diễn đạt trạng thái được bảo tồn, còn “cho” phản ánh cách hiểu sở hướng/lợi ích của dữ cách Ἰησοῦ Χριστῷ mà không biến nó thành tác nhân.
- source_word: κλητοῖς
  choice: được kêu gọi
  rationale: Tính từ dùng cho người nhận thư, song song về ý với hai mô tả bị động trước đó; cách diễn đạt này tự nhiên và giữ hàm ý lời gọi đến từ Đức Chúa Trời.
- source_word: Ἰάκωβος
  choice: Gia-cơ
  rationale: Dùng dạng tên Tân Ước đã quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa τετηρημένοις và Ἰησοῦ Χριστῷ
  choice: được gìn giữ cho Đức Chúa Jêsus, Đấng Mê-si
  alternative: được Đức Chúa Jêsus, Đấng Mê-si, gìn giữ
  rationale: Dữ cách có thể chỉ sở hướng/lợi ích (“cho”) hoặc tác nhân (“bởi”). Bản chính chọn “cho” nhưng ghi chú cách hiểu còn lại để giữ sự mơ hồ thật của cú pháp.
- issue: Dị bản tại ἠγαπημένοις
  choice: được yêu thương
  alternative: được thánh hóa
  rationale: Bản chính theo SBLGNT với ἠγαπημένοις; dị bản ἡγιασμένοις có ý nghĩa và được ghi ở chú thích.
- issue: Quan hệ giới tính/tuổi tác trong ἀδελφός
  choice: anh em của Gia-cơ
  alternative: anh của Gia-cơ / em của Gia-cơ
  rationale: Nguyên văn không xác định Giu-đe là anh hay em của Gia-cơ, nên tránh buộc câu theo một hướng.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “kính gửi” theo quy ước thư tín tiếng Việt; giữ cấu trúc một câu. “Đức Chúa Jêsus, Đấng Mê-si” vừa theo cách gọi quen thuộc vừa làm rõ tước hiệu. Tất cả dấu chú thích [a], [b] đều có trong bản văn chính.
