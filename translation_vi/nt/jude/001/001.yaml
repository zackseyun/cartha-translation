revisions:
- from: Giu-đe, đầy tớ của Đức Chúa Jêsus, Đấng Mê-si, và là anh em của Gia-cơ, kính gửi những người được yêu thương trong Đức Chúa Trời là Cha, được gìn giữ cho Đức Chúa Jêsus, Đấng Mê-si,[a] và được kêu gọi.[b]
  to: Giu-đe, nô lệ của Giê-su, Đấng Mê-si, và là anh em của Gia-cơ, kính gửi những người được yêu thương trong Đức Chúa Trời là Cha[b], được gìn giữ cho Giê-su, Đấng Mê-si[a], và được kêu gọi.
  rationale: Bản sửa khôi phục lực nghĩa của δοῦλος, không thêm tước hiệu không hiện diện trong tiếng Hy Lạp, chuẩn hóa “Giê-su”, và sửa toàn bộ hệ neo chú thích để chú thích dị bản gắn với “được yêu thương” còn chú thích cú pháp gắn với “được gìn giữ”. Cấu trúc ba thuộc tính của người nhận—được yêu thương, được gìn giữ, được kêu gọi—được giữ nguyên, cũng như tính mơ hồ của quan hệ giữa τετηρημένοις và Ἰησοῦ Χριστῷ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:31:17Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa để phản ánh chính xác hơn δοῦλος, vốn chỉ thân phận lệ thuộc/bị sở hữu chứ không chỉ là người phục dịch. Bản chính cũng không nên thêm tước hiệu “Đức Chúa” trước Ἰησοῦ, vì nguyên văn ở cả hai chỗ chỉ có “Giê-su, Đấng Mê-si”. Cách dịch “được gìn giữ cho” cùng chú thích về cách hiểu “bởi” giữ được sự mơ hồ của dữ cách.
  naturalness: Câu thư tín vẫn tự nhiên và trang trọng trong tiếng Việt hiện đại. “Nô lệ” mạnh hơn cách dùng truyền thống “đầy tớ”, nhưng là cách tương ứng trực tiếp, rõ nghĩa với δοῦλος trong lời tự xưng này. “Anh em của Gia-cơ” không áp đặt Giu-đe là anh hay em.
  terminology: Dùng nhất quán dạng chính tả hiện đại “Giê-su” và tước hiệu dịch nghĩa “Đấng Mê-si”. Giữ “Đức Chúa Trời là Cha” cho θεῷ πατρί. Các dấu chú thích phải được chuyển về đúng cụm từ mà chúng giải thích.
  issues:
  - severity: high
    issue: Các neo chú thích hiện bị đặt sai đối tượng.
    rationale: '[a] đang gắn với “được gìn giữ” nhưng chú thích [a] trong bản thảo lại là phương án cho τετηρημένοις; tuy nhiên [b] lại gắn sau “được kêu gọi” trong khi nội dung chú thích [b] nói về dị bản tại ἠγαπημένοις (“được yêu thương”). Cần đặt [b] sau “được yêu thương” và [a] sau cụm “được gìn giữ cho Giê-su, Đấng Mê-si”.'
  - severity: medium
    issue: “Đức Chúa Jêsus” thêm một tước hiệu không có trong nguyên văn và dùng chính tả không phải dạng hiện đại chuẩn.
    rationale: SBLGNT có Ἰησοῦ Χριστοῦ / Ἰησοῦ Χριστῷ, không có κύριος. “Giê-su, Đấng Mê-si” chuyển tải tên và tước hiệu mà không thêm “Chúa”; “Giê-su” là dạng chính tả hiện đại thông dụng.
  - severity: medium
    issue: “Đầy tớ” làm nhẹ nghĩa của δοῦλος.
    rationale: Trong lời tự nhận địa vị với Đấng Mê-si, δοῦλος nêu quan hệ lệ thuộc/bị sở hữu. “Nô lệ” giữ được lực nghĩa này rõ hơn; không cần suy giảm nghĩa để tránh liên tưởng xã hội hiện đại.
