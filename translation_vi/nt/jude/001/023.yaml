  source_fidelity: 'Bản dịch giữ đúng cấu trúc hai nhóm của bản văn SBLGNT: cứu một số người bằng cách giật họ ra khỏi lửa, và thương xót một số người khác trong sự sợ hãi. “Giật ... ra khỏi lửa” diễn tả tốt lực và tính khẩn cấp của ἁρπάζοντες. “Chiếc áo trong đã bị xác thịt làm ô uế” truyền đạt được χιτών, phân từ hoàn thành bị động ἐσπιλωμένον, và hình ảnh ẩn dụ của σάρξ mà không xác định quá mức ý nghĩa của “lửa” hay “sợ hãi”.'
  naturalness: Văn phong hiện đại, rõ và có nhịp điệu tự nhiên. “Với sự sợ hãi” hơi sát chữ nhưng vẫn là tiếng Việt trang trọng dễ hiểu trong văn mạch Kinh Thánh; chú thích giải thích hai khả năng nghĩa giúp tránh phải diễn giải trong chính văn. “Còn những người khác” phản ánh hợp lý sự đối lập/phân nhóm của δέ.
  terminology: “Cứu,” “thương xót,” “lửa,” “xác thịt,” và “làm ô uế” nhất quán với register Kinh Thánh hiện đại và không áp đặt hệ thống thần học. “Áo trong” là cách cụ thể, thích hợp cho χιτών. Chú thích c nêu “bản tính tội lỗi” chỉ như một khả năng diễn giải và xác nhận từ Hy Lạp là “xác thịt”, nên không thay thế thuật ngữ chính văn.
