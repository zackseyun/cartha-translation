id: JUD.1.23
reference: Jude 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: vi
  text: Hãy cứu những người khác bằng cách giật họ ra khỏi lửa[a]; còn những người khác, hãy thương xót với sự sợ hãi[b], đồng thời ghét cả chiếc áo trong đã bị xác thịt làm ô uế[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy giải cứu những người khác, giật họ ra khỏi lửa.” Hình ảnh này có thể chỉ sự phán xét sắp đến hoặc một mối nguy nghiêm trọng về thuộc linh.'
    reason: alternative_reading
  - marker: b
    text: “Với sự sợ hãi” có thể nói đến lòng kính sợ trước Đức Chúa Trời, hoặc sự dè chừng để chính mình không bị lôi cuốn vào sự ô uế.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “chiếc áo đã bị bản tính tội lỗi làm ô uế.” Tiếng Hy Lạp dùng từ “xác thịt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: hãy cứu
  rationale: Giữ sức nặng của động từ “cứu” và thể hiện rõ sắc thái mệnh lệnh trong ngữ cảnh; hình ảnh theo sau cũng cho phép hiểu theo nghĩa giải cứu.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: bằng cách giật họ ra khỏi lửa
  rationale: Phân từ nêu cách thực hiện hành động cứu; “giật... ra” diễn đạt tính mạnh mẽ, khẩn cấp của ἁρπάζω và giữ nguyên hình ảnh sinh động.
- source_word: ἐλεᾶτε
  choice: hãy thương xót
  rationale: Cách diễn đạt tự nhiên, trang trọng và trực tiếp cho mệnh lệnh bày tỏ lòng thương xót.
- source_word: ἐν φόβῳ
  choice: với sự sợ hãi
  rationale: Giữ nguyên độ rộng nghĩa của φόβος, không quyết định đó là lòng kính sợ trước Đức Chúa Trời hay sự dè chừng vì nguy cơ bị ô nhiễm về đạo đức.
- source_word: μισοῦντες
  choice: ghét
  rationale: Tương đương trực tiếp, giữ nguyên sắc thái đạo đức mạnh của nguyên văn mà không làm dịu thành “tránh xa”.
- source_word: χιτῶνα
  choice: chiếc áo trong
  rationale: χιτών là loại áo mặc sát bên trong; “áo trong” cụ thể hơn “áo” hay “y phục” và phù hợp bối cảnh cổ đại.
- source_word: ἐσπιλωμένον
  choice: đã bị... làm ô uế
  rationale: Diễn đạt trạng thái đã bị vấy bẩn của phân từ hoàn thành bị động, đồng thời giữ cả hình ảnh vết bẩn trên áo lẫn hàm ý ô nhiễm đạo đức.
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ hình ảnh và sự căng thẳng thần học của σάρξ, tránh thay bằng cách diễn giải có tính hệ thống hơn như “bản tính tội lỗi”.
theological_decisions:
- issue: Ý nghĩa của “lửa” trong hình ảnh giải cứu
  choice: Giữ nguyên “lửa” mà không xác định rõ đối tượng quy chiếu trong chính văn.
  alternative: Sự phán xét đời sau hoặc mối nguy hủy diệt về thuộc linh ở hiện tại.
  rationale: Nguyên văn dùng hình ảnh mạnh nhưng không trực tiếp giải thích “lửa”; bản dịch không nên tự giới hạn hình ảnh vào một cách hiểu.
- issue: Ý nghĩa của ἐν φόβῳ
  choice: Dịch là “với sự sợ hãi”.
  alternative: “Với lòng kính sợ” hoặc “một cách dè chừng”.
  rationale: Cụm từ có thể nói đến lòng kính sợ trước Đức Chúa Trời hoặc sự thận trọng để chính người giúp đỡ không bị lôi cuốn vào sự ô uế; chính văn bảo tồn sự mơ hồ này.
- issue: Ý nghĩa của σάρξ trong cụm nói về chiếc áo bị ô uế
  choice: Dịch là “xác thịt”.
  alternative: “Bản tính tội lỗi”.
  rationale: Dù ngữ cảnh mang hàm ý ô uế đạo đức, “xác thịt” giữ nguyên phép ẩn dụ và không áp đặt một cách diễn giải thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “còn những người khác” phản ánh sự phân nhóm trong nguyên văn; “đồng thời” làm rõ quan hệ của phân từ μισοῦντες với mệnh lệnh thương xót mà không biến nó thành một mệnh lệnh độc lập.
