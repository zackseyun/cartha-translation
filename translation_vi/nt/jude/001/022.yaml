  text: And have mercy on those who are doubting,[a]
translation:
  language: vi
  text: Hãy thương xót những người đang nghi ngờ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đang dao động”; hoặc có thể là: “những người đang tranh luận.” Phân từ Hy Lạp trong ngữ cảnh này có thể mang nhiều sắc thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Hãy
  rationale: Trong mạch các lời khuyên liên tiếp, liên từ có thể được thể hiện tự nhiên qua sự tiếp nối của câu mệnh lệnh; tiếng Việt không nhất thiết phải thêm “và” ở đầu câu.
- source_word: οὓς μὲν
  choice: những người
  rationale: Đại từ quan hệ cùng μέν mở đầu nhóm thứ nhất trong một chuỗi đối tượng. “Những người” diễn đạt tự nhiên, còn quan hệ đối chiếu sẽ được hoàn tất trong các mệnh đề tiếp theo.
- source_word: ἐλεᾶτε
  choice: thương xót
  rationale: Động từ chỉ việc bày tỏ lòng thương xót hay trắc ẩn. “Hãy thương xót” giữ rõ lực mệnh lệnh và có văn phong trang trọng, dễ hiểu.
- source_word: διακρινομένους
  choice: đang nghi ngờ
  rationale: Phân từ có thể chỉ sự nghi ngờ, dao động, hoặc tranh luận/bất đồng. Trong ngữ cảnh chăm sóc mục vụ, “đang nghi ngờ” là cách hiểu phù hợp, đồng thời các nét nghĩa khả dĩ khác được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa của διακρινομένους trong lời khuyên về cách đối xử với những người gặp nguy cơ
  choice: những người đang nghi ngờ
  alternative: những người đang dao động; những người đang tranh luận hoặc bất đồng
  rationale: Cách dịch chính trình bày nhóm này như những người chưa vững lòng và cần được thương xót, nhưng không tuyệt đối hóa cách hiểu ấy vì từ Hy Lạp vẫn có thể mang sắc thái dao động hoặc tranh luận/bất đồng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, ngắn gọn, trang trọng và dễ hiểu. Dùng “thương xót” để giữ sắc thái đạo đức–mục vụ; chú thích bảo tồn sự đa nghĩa thực sự của nguyên ngữ.
