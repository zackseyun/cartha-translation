  terminology: “Thương xót” biểu đạt tốt ἐλεᾶτε. “Nghi ngờ,” cùng các lựa chọn thay thế trong chú thích, phản ánh thích đáng phạm vi nghĩa đang được tranh luận của διακρινομένους. Dấu neo chú thích [a] được đặt đúng sau cụm từ liên quan.
