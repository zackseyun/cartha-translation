  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh ἐλεᾶτε là hãy bày tỏ lòng thương xót đối với nhóm người được nêu bằng οὓς μὲν. Cách hiểu chính của διακρινομένους là “đang nghi ngờ” phù hợp với một nghĩa có cơ sở trong ngữ cảnh; chú thích cũng bảo lưu các khả năng “dao động” và “tranh luận,” nên không ép nguyên ngữ đa nghĩa vào một cách hiểu duy nhất. Việc không dịch riêng καὶ ở đầu câu là tự nhiên trong tiếng Việt và không làm mất liên kết lập luận đáng kể.
