id: JUD.1.4
reference: Jude 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: vi
  text: Vì có một số người đã lén lút xâm nhập[a]. Họ là những kẻ từ lâu đã được ghi trước liên quan đến sự phán xét này[b]—những kẻ không tin kính, biến ân điển của Đức Chúa Trời chúng ta thành sự phóng đãng[c], và chối bỏ Đấng Chủ Tể duy nhất và Chúa của chúng ta, là Chúa Giê-su, Đấng Mê-si[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã lẻn vào mà không ai hay biết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “từ trước đã được chép đến liên quan đến sự phán xét này” hoặc “từ lâu đã được chỉ định cho sự phán xét này.”'
    reason: alternative_reading
  - marker: c
    text: 'Hay: “sự buông thả”, “lối sống trụy lạc”.'
    reason: lexical_alternative
  - marker: d
    text: 'Tiếng Hy Lạp: “Giê-su Christos”; ở đây Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: đã lẻn vào mà không ai hay biết
  rationale: Diễn đạt tự nhiên hành động bí mật xâm nhập và sắc thái không bị nhận ra của động từ.
- source_word: πάλαι προγεγραμμένοι
  choice: từ lâu đã được ghi trước
  rationale: Giữ được cả ý thời gian xa trước đó và nét nghĩa 'được viết/ghi trước', không diễn giải mạnh thành tiền định.
- source_word: κρίμα
  choice: sự phán xét
  rationale: Giữ phạm vi tư pháp rộng của từ Hy Lạp, thay vì thu hẹp ngay thành án phạt hay sự kết án.
- source_word: ἀσεβεῖς
  choice: những kẻ không tin kính
  rationale: Cách nói quen thuộc, trang trọng vừa phải, chỉ thái độ bất kính đối với Đức Chúa Trời.
- source_word: χάριτα
  choice: ân điển
  rationale: Thuật ngữ thần học tiếng Việt thông dụng và chính xác trong ngữ cảnh nói về ân huệ của Đức Chúa Trời.
- source_word: μετατιθέντες εἰς
  choice: biến ... thành cớ để
  rationale: Truyền đạt việc đổi hoặc xuyên tạc ân điển theo hướng sống buông thả; 'thành cớ để' làm rõ quan hệ tự nhiên trong tiếng Việt mà không thêm một giáo lý riêng.
- source_word: ἀσέλγειαν
  choice: sống buông thả
  rationale: Diễn đạt dễ hiểu sự phóng túng trơ trẽn, thường gồm sắc thái tình dục, mà không thu hẹp hoàn toàn vào một hành vi cụ thể.
- source_word: τὸν μόνον δεσπότην καὶ κύριον
  choice: Đấng Chủ Tể và Chúa duy nhất
  rationale: Phân biệt hai tước hiệu δεσπότης và κύριος, đồng thời để 'duy nhất' bổ nghĩa tự nhiên cho toàn cụm.
- source_word: Ἰησοῦν Χριστόν
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Dùng cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt và chuyển Χριστός theo tư cách tước hiệu.
- source_word: ἀρνούμενοι
  choice: chối bỏ
  rationale: Thể hiện sự phủ nhận hoặc khước từ cả bằng niềm tin lẫn cách sống.
theological_decisions:
- issue: Ý nghĩa của προγεγραμμένοι εἰς τοῦτο τὸ κρίμα
  choice: được ghi trước là phải chịu sự phán xét này
  alternative: đã được định trước cho sự kết án này; từ trước đã được chép đến liên quan đến sự phán xét này
  rationale: Bản dịch giữ nét nghĩa được ghi hoặc nói đến từ trước và mối liên hệ với phán xét, nhưng không quả quyết một cách hiểu tiền định cá nhân mạnh hơn điều câu Hy Lạp nhất thiết đòi hỏi.
- issue: Đối tượng của hai tước hiệu δεσπότην καὶ κύριον
  choice: cả 'Đấng Chủ Tể' và 'Chúa' đều chỉ về Đức Chúa Jêsus, Đấng Mê-si
  alternative: '''Đấng Chủ Tể'' chỉ Đức Chúa Trời là Cha, còn ''Chúa'' chỉ Đức Chúa Jêsus'
  rationale: Cú pháp tự nhiên nhất nối cả hai tước hiệu với danh ngữ theo sau là Ἰησοῦν Χριστόν, dù cách hiểu phân chia từng được đề xuất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được tách sau mệnh đề mở đầu để tránh cấu trúc quá dài; dấu gạch ngang làm rõ phần đồng vị mô tả những kẻ xâm nhập. Giữ các thuật ngữ Kinh Thánh phổ biến như “ân điển”, “phán xét”, “không tin kính”, đồng thời tránh lối diễn đạt quá cổ.
