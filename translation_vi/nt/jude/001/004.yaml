  source_fidelity: Bản nháp truyền đạt tốt ý những người lén xâm nhập, sự không tin kính, việc từ chối Chúa Giê-su, và phân biệt hai tước hiệu δεσπότης và κύριος. Tuy nhiên, “được ghi trước là phải chịu sự phán xét này” thêm ý tất định “phải chịu”, vượt quá cách diễn đạt dè dặt cần có đối với προγεγραμμένοι εἰς τοῦτο τὸ κρίμα. “Biến ... thành cớ để sống buông thả” cũng diễn giải rộng hơn động từ μετατιθέντες εἰς, vốn trực tiếp nói đến việc biến đổi ân điển thành sự phóng đãng.
  naturalness: Câu sửa giữ văn phong hiện đại, trang trọng và mạch lạc. “Lén lút xâm nhập” diễn đạt tự nhiên sắc thái bí mật; “sự phóng đãng” phù hợp hơn với danh từ trừu tượng ἀσέλγεια. Chính tả “Giê-su” là dạng hiện đại, trung tính hơn “Jêsus”.
  terminology: Giữ “ân điển”, “phán xét”, và “không tin kính” là các thuật ngữ quen thuộc. “Đấng Chủ Tể duy nhất và Chúa của chúng ta” bảo toàn riêng cả δεσπότης lẫn κύριος, đồng thời phản ánh vị trí của μόνος. “Đấng Mê-si” biểu đạt Χριστός như một tước hiệu.
  issues:
