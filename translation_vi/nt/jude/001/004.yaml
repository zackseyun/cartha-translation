  to: Vì có một số người đã lén lút xâm nhập[a]. Họ là những kẻ từ lâu đã được ghi trước liên quan đến sự phán xét này[b]—những kẻ không tin kính, biến ân điển của Đức Chúa Trời chúng ta thành sự phóng đãng[c], và chối bỏ Đấng Chủ Tể duy nhất và Chúa của chúng ta, là Chúa Giê-su, Đấng Mê-si[d].
  rationale: Bản sửa loại bỏ ý bắt buộc/hệ quả tất định không được nói minh nhiên trong câu chính, nhờ đó giữ sự mơ hồ có chủ ý của προγεγραμμένοι. Đồng thời, bản sửa dịch trực tiếp μετατιθέντες εἰς ἀσέλγειαν, cập nhật chính tả tên riêng theo chuẩn hiện đại, và giữ các tước hiệu cũng như tước hiệu Mê-si theo tiếng Hy Lạp.
