id: JUD.1.14
reference: Jude 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: vi
  text: 'Hê-nóc, người thứ bảy kể từ A-đam, cũng đã nói tiên tri về những kẻ này[a] rằng: “Kìa[b], Chúa đã đến cùng muôn vàn đấng thánh của Ngài[c],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “với những kẻ này” hoặc “chống lại những kẻ này.” Cách dữ Hy Lạp τούτοις có thể chỉ những người mà lời tiên tri nhắm đến; trong văn cảnh, đó là những kẻ vô đạo đã được đề cập.
    reason: lexical_alternative
  - marker: b
    text: Lời này tương ứng với 1 Hê-nóc 1:9.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch: “cùng hàng vạn đấng thánh của Ngài.” Từ Hy Lạp có thể chỉ hàng vạn hoặc muôn vàn, nói về một đoàn thể thánh vô cùng đông đảo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: đã nói tiên tri
  rationale: Giữ nghĩa của hành vi phát ngôn tiên tri, không thu hẹp thành chỉ dự báo tương lai.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Diễn đạt tự nhiên chức năng nối tiếp nhẹ của δέ và sắc thái bổ sung của καί.
- source_word: τούτοις
  choice: về những kẻ này
  rationale: Hiểu cách dữ cách là chỉ đối tượng mà lời tiên tri nói đến; “những kẻ này” liên hệ tự nhiên với những kẻ vô đạo trong văn cảnh mà không thêm giới tính.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: người thứ bảy kể từ A-đam
  rationale: Diễn đạt trực tiếp vị trí gia phả, đồng thời rõ nghĩa trong tiếng Việt hiện đại.
- source_word: Ἑνὼχ
  choice: Hê-nóc
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn trang trọng và gây chú ý của lời tiên tri.
- source_word: ἦλθεν
  choice: đã đến
  rationale: Phản ánh hình thái quá khứ aorist của động từ; không tự ý chuyển thành tương lai dù có thể được hiểu là quá khứ tiên tri.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu mà không xác định thêm danh tính của vị được nói đến.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: cùng muôn vàn đấng thánh của Ngài
  rationale: “Cùng” diễn đạt nghĩa đồng hành của ἐν trong ngữ cảnh; “muôn vàn” truyền đạt một đoàn thể vô cùng đông đảo, còn “đấng thánh” không tự ý xác định họ là thiên sứ.
theological_decisions:
- issue: Danh tính của “Chúa” trong lời trích dẫn
  choice: Chỉ dịch là “Chúa”
  alternative: Xác định rõ là Đức Chúa Trời hoặc Chúa Giê-su
  rationale: Bản Hy Lạp chỉ ghi κύριος; giữ cách gọi này bảo toàn độ mở thần học của câu.
- issue: Tính chất của lời dẫn liên quan đến 1 Hê-nóc
  choice: Trình bày như lời tiên tri của Hê-nóc và ghi quan hệ văn bản trong chú thích
  alternative: Tuyên bố trong chính văn rằng đây là trích dẫn kinh điển hoặc chỉ là truyền thống
  rationale: Giu-đe giới thiệu Hê-nóc là người nói tiên tri nhưng câu này không đưa ra phán quyết về địa vị kinh điển của tác phẩm 1 Hê-nóc.
- issue: Thì của ἦλθεν trong lời tiên tri
  choice: “đã đến”
  alternative: “sẽ đến” hoặc “đang đến”
  rationale: Giữ hình thức quá khứ của nguyên văn, dù trong ngôn ngữ tiên tri nó có thể trình bày một biến cố tương lai như đã xảy ra.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Kìa” giữ giọng tiên tri; “muôn vàn” dễ hiểu hơn từ vay mượn “myriad.” Chính văn tránh xác định các đấng thánh là thiên sứ và tránh giải quyết danh tính của “Chúa”.
