  - severity: low
    issue: Neo chú thích liên văn bản hiện đặt sau dấu phẩy sau ngoặc kép.
    rationale: Đặt neo ngay sau “Kìa” làm rõ rằng chú thích nói về lời trích dẫn/công thức trích dẫn, đồng thời tránh trình bày dấu câu và neo chú thích kém tự nhiên.
