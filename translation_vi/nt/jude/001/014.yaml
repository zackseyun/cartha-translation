revisions:
- from: 'Hê-nóc, người thứ bảy kể từ A-đam, cũng đã nói tiên tri về những kẻ này rằng: “Kìa, Chúa đã đến cùng muôn vàn đấng thánh của Ngài[a],”[b]'
  to: 'Hê-nóc, người thứ bảy kể từ A-đam, cũng đã nói tiên tri về những kẻ này[a] rằng: “Kìa[b], Chúa đã đến cùng muôn vàn đấng thánh của Ngài[c],”'
  rationale: Giữ nguyên các lựa chọn dịch chính vì chúng trung thành với nguyên văn và tự nhiên trong tiếng Việt. Bổ sung chú thích cho τούτοις để không tuyệt đối hóa cách hiểu theo văn cảnh, đồng thời sắp xếp lại các neo chú thích cho đúng phần văn bản mà chúng giải thích.
