id: JUD.1.6
reference: Jude 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: vi
  text: Và các thiên sứ không giữ địa vị của mình[a] mà lìa bỏ nơi ở riêng của họ[b], thì Ngài đã giữ họ trong xiềng xích đời đời, dưới bóng tối mịt mù[c], cho cuộc phán xét của ngày trọng đại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyền hạn của mình” hoặc “phạm vi của mình”.
    reason: lexical_alternative
  - marker: b
    text: Hay “nơi cư ngụ của chính họ”.
    reason: lexical_alternative
  - marker: c
    text: Hay “dưới sự tối tăm”; từ Hy Lạp chỉ bóng tối sâu thẳm, mịt mù.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: các thiên sứ
  rationale: Trong bối cảnh phán xét này, từ ngữ chỉ các hữu thể siêu nhiên phù hợp hơn nghĩa thông thường là “sứ giả”.
- source_word: τηρήσαντας / τετήρηκεν
  choice: không giữ / đã giam giữ
  rationale: 'Lặp lại từ “giữ” để phản ánh phép đối ý của Giu-đe: họ không giữ địa vị của mình, nên Ngài giam giữ họ để phán xét. Thêm “giam” ở lần thứ hai giúp câu tiếng Việt tự nhiên trong ngữ cảnh xiềng xích.'
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: địa vị của mình
  rationale: ἀρχή có thể chỉ địa vị, quyền hạn hoặc phạm vi cai quản. “Địa vị” diễn đạt một vị trí được ấn định mà không quyết đoán quá mức rằng đây là quyền cai trị hay một lãnh vực không gian.
- source_word: ἀπολιπόντας
  choice: lìa bỏ
  rationale: “Lìa bỏ” thể hiện sự rời đi có chủ ý và phù hợp với sắc thái xét xử của câu.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: nơi cư ngụ dành cho họ
  rationale: οἰκητήριον là nơi ở; cách diễn đạt này chuyển tải cả ý nơi cư ngụ và sắc thái nơi thích hợp hay được dành riêng cho họ.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: cho cuộc phán xét của ngày lớn
  rationale: Giữ mối liên hệ trực tiếp của εἰς với mục đích hoặc hướng đến sự phán xét, đồng thời bảo tồn cấu trúc sở hữu của cụm Hy Lạp mà không tự ý đổi thành “cho đến”.
- source_word: δεσμοῖς ἀϊδίοις
  choice: bằng xiềng xích vĩnh viễn
  rationale: “Xiềng xích” cụ thể và tự nhiên; “vĩnh viễn” diễn đạt thời hạn bền lâu của ἀΐδιος mà không thêm diễn giải giáo lý.
- source_word: ὑπὸ ζόφον
  choice: dưới chốn tối tăm
  rationale: ζόφος chỉ bóng tối âm u, sâu thẳm chứ không chỉ sự thiếu ánh sáng thông thường; “chốn tối tăm” giữ được hình ảnh và kết hợp tự nhiên với giới từ “dưới”.
- source_word: τε
  choice: Và
  rationale: Liên từ này nối ví dụ về các thiên sứ với những trường hợp phán xét trước đó; “Và” là cách nối rõ ràng, tự nhiên.
theological_decisions:
- issue: Bản chất sự phạm tội của các thiên sứ
  choice: Nêu rằng họ không giữ địa vị của mình và lìa bỏ nơi cư ngụ dành cho họ, nhưng không xác định thêm địa vị hay nơi cư ngụ ấy chính xác là gì.
  alternative: Hiểu cụ thể là truyền thống về Sáng Thế Ký 6, hoặc nói chung là cuộc sa ngã ban đầu của các thiên sứ.
  rationale: Câu này có thể gợi đến một truyền thống Do Thái quen thuộc với độc giả đầu tiên, nhưng chính văn Hy Lạp không giải thích đầy đủ bối cảnh. Bản dịch vì thế giữ nguyên độ mở của câu.
- issue: Sắc thái của ἀΐδιος
  choice: vĩnh viễn
  alternative: đời đời; trường tồn
  rationale: Từ này chỉ tính kéo dài bền vững. “Vĩnh viễn” rõ ràng trong tiếng Việt hiện đại nhưng không đưa thêm một hệ thống giáo lý về bản chất của xiềng xích.
- issue: Chủ thể của τετήρηκεν
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Động từ Hy Lạp không nêu lại chủ ngữ trong câu này; “Ngài” nối với chủ thể thần linh từ văn mạch mà không bổ sung danh xưng không có ngay trong câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Cấu trúc “không giữ… đã giam giữ” duy trì phép lặp có chủ ý trong nguyên văn; “thì” giúp người đọc theo dõi câu dài. Các thuật ngữ được chọn không áp đặt một cách giải thích riêng về truyền thống thiên sứ sa ngã.
