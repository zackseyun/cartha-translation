revisions:
- from: Và các thiên sứ đã không giữ địa vị của mình[a] mà lìa bỏ nơi cư ngụ dành cho họ[b], thì Ngài đã giam giữ họ bằng xiềng xích vĩnh viễn dưới chốn tối tăm[c], cho cuộc phán xét của ngày lớn.
  to: Và các thiên sứ không giữ địa vị của mình[a] mà lìa bỏ nơi ở riêng của họ[b], thì Ngài đã giữ họ trong xiềng xích đời đời, dưới bóng tối mịt mù[c], cho cuộc phán xét của ngày trọng đại.
  rationale: Bản sửa bảo toàn cấu trúc và độ mở của câu Hy Lạp, không xác định bản chất sự sa ngã của các thiên sứ. “Giữ ... đã giữ” phản ánh phép lặp τηρέω; “nơi ở riêng của họ” sát ἴδιον οἰκητήριον mà không thêm ý; và các điều chỉnh về “bóng tối mịt mù” cùng “ngày trọng đại” tăng tính tự nhiên của tiếng Việt hiện đại. Các neo chú thích được đặt ngay sau những cụm từ tương ứng.
