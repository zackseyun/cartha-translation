revisions:
- from: Còn Đấng có quyền gìn giữ anh chị em khỏi vấp ngã[a], và khiến anh chị em đứng trước vinh quang Ngài, không chỗ trách được[b], trong niềm hân hoan,
  to: Còn Đấng có thể gìn giữ anh chị em khỏi vấp ngã[a] và làm cho anh chị em đứng trước vinh quang Ngài[b], không chỗ trách[c], trong niềm hân hoan,
  rationale: Bản sửa thay “có quyền” bằng “có thể” để giữ đúng nghĩa năng lực của δυναμένῳ; chỉnh “không chỗ trách được” thành “không chỗ trách” cho tự nhiên và sát nghĩa hơn; đồng thời bổ sung chú thích cho τῆς δόξης αὐτοῦ. Không thay đổi sự mơ hồ của nguyên văn về phạm vi của “vấp ngã,” cũng không áp đặt cách hiểu giáo phái.
