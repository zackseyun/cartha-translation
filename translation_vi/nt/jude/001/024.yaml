id: JUD.1.24
reference: Jude 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: vi
  text: Còn Đấng có thể gìn giữ anh chị em khỏi vấp ngã[a] và làm cho anh chị em đứng trước vinh quang Ngài[b], không chỗ trách[c], trong niềm hân hoan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi sa ngã.” Tính từ Hy Lạp mang ý không vấp hoặc không ngã.'
    reason: lexical_alternative
  - marker: b
    text: 'Bản dịch truyền thống thường có: “trước sự hiện diện vinh hiển của Ngài”; dịch sát hơn là: “trước vinh quang Ngài.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “không tì vết” hoặc “không chỗ lỗi.” Từ Hy Lạp cũng có thể gợi hình ảnh lễ vật không có khuyết tật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: Còn Đấng có quyền
  rationale: Cấu trúc phân từ có mạo từ ở cách dữ cách mở đầu lời chúc tụng tiếp sang câu 25. “Đấng có quyền” tự nhiên và trang trọng; “Còn” thể hiện sự chuyển ý nhẹ của δέ mà không thêm ý thời gian.
- source_word: φυλάξαι ὑμᾶς ἀπταίστους
  choice: gìn giữ anh chị em khỏi vấp ngã
  rationale: “Gìn giữ” chuyển tải ý bảo vệ của φυλάσσω. ἀπταίστους mang hình ảnh không vấp hay không ngã; cách nói “khỏi vấp ngã” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa vào một lập trường thần học cụ thể.
- source_word: καὶ στῆσαι
  choice: và khiến anh chị em đứng
  rationale: στῆσαι là động từ nguyên mẫu chủ động gây khiến, nghĩa sát là làm cho hoặc khiến đứng. Giữ hình ảnh “đứng” thay vì diễn giải thành “trình diện” nhằm phản ánh trực tiếp cấu trúc Hy Lạp.
- source_word: κατενώπιον τῆς δόξης αὐτοῦ
  choice: trước vinh quang Ngài
  rationale: Cách dịch sát và tự nhiên, giữ danh từ δόξα là “vinh quang” thay vì mở rộng thành “sự hiện diện vinh hiển”.
- source_word: ἀμώμους
  choice: không chỗ trách được
  rationale: Diễn đạt trạng thái không thể bị trách cứ, đồng thời vẫn để ngỏ sắc thái “không tì vết” vốn có thể gợi đến ngôn ngữ tế lễ.
- source_word: ἐν ἀγαλλιάσει
  choice: trong niềm hân hoan
  rationale: ἀγαλλίασις chỉ niềm vui mừng mãnh liệt, hớn hở. “Niềm hân hoan” giữ dạng danh từ và sắc thái trang trọng mà không thêm từ “lớn lao” vốn không có trực tiếp trong nguyên văn.
theological_decisions:
- issue: Cách hiểu việc được giữ ἀπταίστους
  choice: khỏi vấp ngã
  alternative: khỏi sa ngã
  rationale: “Vấp ngã” bảo toàn hình ảnh cốt lõi và không quyết định rằng câu này chỉ nói đến lỗi lầm hằng ngày hay sự lìa bỏ đức tin cuối cùng.
- issue: Cách dịch τῆς δόξης αὐτοῦ
  choice: vinh quang Ngài
  alternative: sự hiện diện vinh hiển của Ngài
  rationale: Nguyên văn nói trực tiếp đến “vinh quang của Ngài”; bản dịch không thêm danh từ “sự hiện diện,” dù ý hiện diện có thể được hàm ý trong ngữ cảnh.
- issue: Sắc thái của ἀμώμους
  choice: không chỗ trách được
  alternative: không tì vết
  rationale: Lựa chọn chính dễ hiểu theo nghĩa đạo đức và phán xét, còn chú thích lưu lại âm hưởng tế lễ “không tì vết” mà không buộc câu chỉ mang một sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” để biểu đạt đại từ số nhiều ὑμᾶς theo cách bao hàm tự nhiên trong tiếng Việt. Dấu phẩy cuối câu cho thấy cú pháp lời chúc tụng còn tiếp tục sang Giu-đe 1:25.
