id: JUD.1.11
reference: Jude 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: vi
  text: Khốn cho họ! Vì họ đã đi theo con đường của Ca-in, vì tiền công mà đổ xô vào sự lầm lạc của Ba-la-am[a], và đã diệt vong trong cuộc phản loạn của Cô-rê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vì tiền công mà đổ mình vào sự lầm lạc của Ba-la-am.”'
    reason: Giữ lại hình ảnh theo nghĩa đen của ἐξεχύθησαν trong cụm từ Hy Lạp cô đọng và khó chuyển ngữ.
lexical_decisions:
- source_word: οὐαὶ αὐτοῖς
  choice: Khốn cho họ!
  rationale: “Khốn” giữ được sắc thái tuyên án mạnh mẽ của lời cảnh cáo mang tính tiên tri; dấu chấm than diễn đạt tự nhiên tính chất cảm thán của οὐαί.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: đã đi theo con đường của Ca-in
  rationale: ὁδός được dùng ẩn dụ về lối sống hay cách hành xử; “đi theo con đường” vừa tự nhiên trong tiếng Việt vừa duy trì hình ảnh của nguyên văn.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: vào sự lầm lạc của Ba-la-am
  rationale: πλάνη có thể chỉ sự sai lầm, lừa dối hoặc lạc đường. “Sự lầm lạc” giữ được cả ý sai trái lẫn hình ảnh đi chệch đường mà không xác định quá mức ai là người lừa dối.
- source_word: μισθοῦ
  choice: vì tiền công
  rationale: μισθός chỉ tiền công hay thù lao; cách dịch này nêu rõ động cơ vụ lợi mà không thêm sắc thái ngoài nguyên văn.
- source_word: ἐξεχύθησαν
  choice: đổ xô
  rationale: Động từ có nghĩa đen là “đổ ra” và tại đây diễn tả sự lao theo một cách không kiềm chế. “Đổ xô” là thành ngữ tiếng Việt tự nhiên, vẫn giữ phần nào hình ảnh tuôn đổ; cách dịch sát hơn được ghi ở chú thích.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: trong cuộc phản loạn của Cô-rê
  rationale: ἀντιλογία có thể là sự chống đối, cãi lại hoặc phản loạn. Trong liên hệ với Dân Số Ký 16, “cuộc phản loạn” diễn đạt rõ sự kiện được ám chỉ.
- source_word: ἀπώλοντο
  choice: đã diệt vong
  rationale: ἀπόλλυμι ở đây chỉ sự hủy diệt hay diệt vong. “Đã diệt vong” trang trọng, mạnh và không xác định thêm phương thức hủy diệt.
theological_decisions:
- issue: Cách chuyển ngữ cụm khó καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν
  choice: vì tiền công mà đổ xô vào sự lầm lạc của Ba-la-am
  alternative: vì tiền công mà đổ mình vào sự lầm lạc của Ba-la-am
  rationale: Cụm Hy Lạp cô đọng và dùng hình ảnh khác thường. Bản chính ưu tiên câu tiếng Việt dễ hiểu nhưng vẫn gợi hình ảnh tuôn đổ của ἐξεχύθησαν; chú thích bảo tồn cách diễn đạt sát hình ảnh hơn, thay vì âm thầm giải quyết hoàn toàn chỗ khó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Duy trì cấu trúc ba vế song song, các tên riêng quen dùng trong Kinh Thánh tiếng Việt (Ca-in, Ba-la-am, Cô-rê), cùng sức nặng của lời tuyên án.
