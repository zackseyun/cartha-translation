id: JUD.1.5
reference: Jude 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: vi
  text: Tôi muốn nhắc anh chị em[a], dù anh chị em đã biết mọi điều này từ trước, rằng Giê-su, sau khi cứu một dân ra khỏi đất Ai Cập, về sau đã tiêu diệt những người không tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Chúa” hoặc “Đức Chúa Trời” thay cho “Giê-su”.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: Tôi muốn nhắc
  rationale: Diễn đạt tự nhiên ý muốn làm cho người đọc nhớ lại điều họ đã biết, đồng thời không thêm một trạng từ thời gian không có trong nguyên văn.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: dù anh chị em đã biết tất cả những điều này một lần đủ cả
  rationale: Hiểu phân từ theo nghĩa nhượng bộ trong ngữ cảnh; πάντα chỉ toàn bộ những điều đang được nói đến, còn ἅπαξ nhấn mạnh việc đã được biết một lần có giá trị dứt khoát. Cách diễn đạt hơi khác thường nhằm giữ sự mơ hồ và sắc thái của nguyên văn.
- source_word: Ἰησοῦς
  choice: Chúa Giê-su
  rationale: SBLGNT đọc Ἰησοῦς, vì vậy bản dịch nêu đích danh Chúa Giê-su và giữ nguyên sức nặng Cơ Đốc luận của mệnh đề. Danh xưng tiếng Việt tự nhiên thêm 'Chúa' nhưng không thay thế tên riêng.
- source_word: λαὸν
  choice: một dân
  rationale: Giữ cách nói tập thể và tính không xác định của danh từ không có mạo từ, trong khi ngữ cảnh ám chỉ dân Y-sơ-ra-ên.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: ra khỏi đất Ai Cập
  rationale: Giữ hình ảnh xuất hành và công thức Kinh Thánh của cụm từ Hy Lạp.
- source_word: σώσας
  choice: sau khi cứu
  rationale: Thể hiện hành động của phân từ bất định xảy ra trước động từ chính một cách tự nhiên trong tiếng Việt.
- source_word: τὸ δεύτερον
  choice: về sau
  rationale: Truyền đạt hành động tiếp theo sau việc giải cứu mà không ép thành cách nói thiếu tự nhiên 'lần thứ hai'.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: những người không tin
  rationale: Cách diễn đạt trực tiếp, rõ ràng cho nhóm người đã không tin.
- source_word: ἀπώλεσεν
  choice: đã tiêu diệt
  rationale: Giữ nguyên mức độ nghiêm khắc của sự phán xét được động từ Hy Lạp diễn tả.
theological_decisions:
- issue: Chủ thể Cơ Đốc luận trong biến cố xuất hành
  choice: Dịch Ἰησοῦς là 'Chúa Giê-su' trong chính văn.
  alternative: Một số thủ bản chép 'Chúa' hoặc 'Đức Chúa Trời'.
  rationale: Bản Hy Lạp được cung cấp đọc Ἰησοῦς. Chính văn vì thế phải giữ lời khẳng định mạnh rằng Chúa Giê-su hành động trong cuộc xuất hành, thay vì làm nhẹ hoặc dung hòa cách đọc này; các dị bản quan trọng được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' để xưng hô với cộng đồng độc giả; giữ 'một dân', 'đất Ai Cập' và 'tiêu diệt' để bảo toàn âm hưởng lịch sử cứu chuộc và mức độ nghiêm trọng của lời cảnh báo.
