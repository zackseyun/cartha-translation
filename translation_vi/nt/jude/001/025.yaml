id: JUD.1.25
reference: Jude 1:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: vi
  text: Nguyện vinh quang, uy nghi, quyền năng và thẩm quyền thuộc về Đức Chúa Trời duy nhất, Đấng Cứu Rỗi chúng ta, qua Đức Giê-su, Đấng Mê-si-a, Chúa chúng ta, từ trước mọi thời đại, hiện nay và cho đến muôn đời.[a] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trước mọi thời đại ... cho đến mọi thời đại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ
  choice: Đức Chúa Trời duy nhất
  rationale: Diễn đạt tự nhiên cấu trúc tặng cách trong lời tôn vinh và giữ sự nhấn mạnh của μόνος về tính độc nhất của Đức Chúa Trời.
- source_word: σωτῆρι ἡμῶν
  choice: Đấng Cứu Rỗi chúng ta
  rationale: Giữ nghĩa cứu độ thông dụng của σωτήρ và sắc thái trang trọng của lời tôn vinh.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: qua Đức Giê-su, Đấng Mê-si, Chúa chúng ta
  rationale: διά với sở hữu cách được dịch là “qua”, giữ ý trung gian; Χριστός được chuyển nghĩa theo chức danh là “Đấng Mê-si”, còn κύριος là “Chúa”.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: vinh quang, uy nghi, quyền năng và thẩm quyền
  rationale: Bảo toàn chuỗi bốn danh từ; “quyền năng” diễn đạt sức mạnh hữu hiệu của κράτος, còn “thẩm quyền” phân biệt quyền chính đáng của ἐξουσία.
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: từ trước mọi thời đại
  rationale: Theo sát hình ảnh thời đại của αἰών mà vẫn tự nhiên trong tiếng Việt; “từ” kết hợp với toàn chuỗi thời gian để cho thấy lời tôn vinh luôn thuộc về Đức Chúa Trời.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: hiện nay và cho đến muôn đời
  rationale: Giữ ba chiều thời gian của câu và chuyển thành cách nói trang trọng, dễ hiểu trong tiếng Việt.
- source_word: ἀμήν
  choice: A-men
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt, thích hợp để kết lời tôn vinh.
theological_decisions:
- issue: Cụm chỉ sự trung gian trong lời tôn vinh
  choice: Lời tôn vinh hướng đến Đức Chúa Trời duy nhất, Đấng Cứu Rỗi chúng ta, và được dâng qua Đức Giê-su, Đấng Mê-si, Chúa chúng ta.
  alternative: Có thể hiểu cụm “qua Đức Giê-su...” gắn lỏng hơn với toàn bộ lời tôn vinh, nhưng vẫn biểu thị vai trò trung gian của Ngài.
  rationale: Cú pháp tự nhiên nhất nối διά với lời quy vinh cho Đức Chúa Trời; cách dịch giữ cả trọng tâm độc thần lẫn vai trò trung gian của Đức Giê-su mà không đồng nhất các ngôi.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ; Ki-tô
  rationale: Ở đây Χριστός mang chức năng tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa của tước hiệu thay vì chỉ phiên âm thành một phần của tên riêng.
- issue: Giá trị thời gian của động từ ngầm hiểu trong lời tôn vinh
  choice: Dùng “nguyện ... thuộc về” cho toàn bộ chuỗi “từ trước mọi thời đại, hiện nay và cho đến muôn đời”.
  alternative: 'Dịch như một mệnh đề xác nhận: “vinh quang... vốn thuộc về”.'
  rationale: Nguyên văn lược động từ nên có thể mang sắc thái cầu chúc hoặc xác nhận. “Nguyện ... thuộc về” phù hợp thể loại tôn vinh, nhưng không thêm một động từ mang nội dung thần học riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp một lời tôn vinh công khai. Trật tự tiếng Việt đưa các phẩm tính lên đầu để câu rõ và tự nhiên, đồng thời vẫn giữ Đức Chúa Trời là đối tượng nhận lời tôn vinh. Dùng “Đấng Mê-si” như một tước hiệu có dấu phẩy đồng vị; tránh thuật ngữ riêng của một hệ phái.
