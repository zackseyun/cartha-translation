id: JUD.1.16
reference: Jude 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: vi
  text: Đó là những kẻ hay lẩm bẩm than phiền, than trách số phận mình, sống theo những ham muốn của chính mình[a], miệng họ nói những lời huênh hoang[b], và họ thiên vị người khác[c] để mưu lợi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những dục vọng của chính mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “miệng họ nói những lời khoa trương.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “thán phục các khuôn mặt”—một thành ngữ chỉ việc thiên vị hoặc ưu ái người ta.'
    reason: idiom_explanation
lexical_decisions:
- source_word: γογγυσταί
  choice: những kẻ hay lẩm bẩm than phiền
  rationale: Danh từ chỉ những người có thói quen lẩm bẩm bất bình. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái than phiền dai dẳng.
- source_word: μεμψίμοιροι
  choice: than trách số phận mình
  rationale: Từ hiếm này chỉ sự bất mãn và phàn nàn về phần số hoặc hoàn cảnh của mình. Cách dịch phân biệt nó với lời lẩm bẩm chung chung của γογγυσταί.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: họ sống theo những ham muốn của chính mình
  rationale: πορεύομαι ở đây nói ẩn dụ về lối sống; ἐπιθυμίαι có nghĩa rộng là những ham muốn, nhưng văn cảnh cho thấy chúng bị lên án về mặt đạo đức.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: miệng họ nói những lời ngạo mạn
  rationale: Giữ hình ảnh số ít tập hợp “miệng họ” của tiếng Hy Lạp. ὑπέρογκα diễn tả lời lẽ phô trương, tự cao và quá mức; “những lời ngạo mạn” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: θαυμάζοντες πρόσωπα
  choice: họ thiên vị người khác
  rationale: Dịch theo nghĩa thành ngữ thay vì dịch từng chữ “thán phục các khuôn mặt”; cụm này nói đến việc ưu ái người ta vì vị thế hoặc vì lợi ích có thể nhận được.
- source_word: ὠφελείας χάριν
  choice: để mưu lợi
  rationale: Cụm từ nêu động cơ vụ lợi. “Để mưu lợi” ngắn gọn, tự nhiên và không giới hạn lợi ích ấy chỉ vào tiền bạc.
- source_word: οὗτοί εἰσιν
  choice: Đó là những kẻ
  rationale: Cách chỉ định trực tiếp, rõ ràng trong tiếng Việt và phù hợp với giọng quở trách của văn cảnh.
theological_decisions:
- issue: Phạm vi đạo đức của ἐπιθυμίαι
  choice: những ham muốn
  alternative: những dục vọng
  rationale: Từ Hy Lạp có thể chỉ các ham muốn mạnh nói chung; trong văn cảnh chúng mang nghĩa xấu nhưng không nhất thiết chỉ dục vọng tình dục. “Những ham muốn” giữ được độ rộng ấy.
- issue: Nghĩa thành ngữ của θαυμάζοντες πρόσωπα
  choice: thiên vị người khác
  alternative: tâng bốc người khác
  rationale: Thành ngữ nhấn mạnh việc đối đãi thiên lệch với người ta vì lợi ích. “Tâng bốc” có thể là phương thức thực hiện, nhưng hẹp hơn ý của cụm Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ chuỗi lời tố cáo dồn dập của câu Hy Lạp, đồng thời dùng dấu chấm phẩy để phân định phần nhận diện với các hành vi tiếp theo. “Miệng họ” được giữ nhằm phản ánh hình ảnh tập hợp ở nguyên bản.
