  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đầy đủ chuỗi tố cáo trong nguyên văn: những kẻ lẩm bẩm than phiền, bất mãn về phần mình, sống theo các ham muốn riêng, nói lời tự cao/phóng đại, và thiên vị vì tư lợi. Tuy nhiên, ὑπέρογκα nghiêng về lời lẽ phô trương, huênh hoang hoặc quá đáng hơn là chỉ “ngạo mạn”.'
  naturalness: Tiếng Việt nhìn chung tự nhiên, đúng văn phong trang trọng hiện đại. Có thể nối chuỗi các đặc tính bằng dấu phẩy để phản ánh cấu trúc liệt kê dồn dập của câu Hy Lạp; cách này cũng tránh sự ngắt đoạn hơi mạnh trước “họ sống”.
  terminology: “Ham muốn” giữ đúng phạm vi rộng của ἐπιθυμίαι; “để mưu lợi” diễn đạt tốt ὠφελείας χάριν. “Thiên vị” phù hợp nghĩa thành ngữ θαυμάζοντες πρόσωπα. Chú thích thành ngữ phải được neo trực tiếp vào cụm “thiên vị người khác”, không phải vào “mưu lợi”.
