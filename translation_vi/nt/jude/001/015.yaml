  source_fidelity: Bản dịch phản ánh đúng cấu trúc tư pháp của ποιῆσαι κρίσιν và ἐλέγξαι, hướng ‘chống lại’ của κατά, cũng như đối tượng quy chiếu ngữ cảnh của αὐτοῦ. Tuy nhiên, cụm ‘mọi việc không tin kính họ đã làm một cách không tin kính’ chưa diễn đạt tự nhiên quan hệ giữa ‘các việc’ và động từ ἠσέβησαν, dù có ý giữ sự lặp lại nhấn mạnh của nguyên văn.
  naturalness: Câu nhìn chung trang trọng, rõ và phù hợp tiếng Việt hiện đại. Cần thay cụm ở giữa bằng cách nói trôi chảy hơn, vẫn duy trì ba lần lặp ‘không tin kính’ trong phần tương ứng với ἀσεβής/ἀσέβεια/ἀσεβέω.
