  to: để thi hành sự phán xét chống lại mọi người và kết tội tất cả những kẻ không tin kính[a] về mọi hành vi không tin kính mà họ đã phạm trong sự không tin kính, cũng như về mọi lời lẽ cay nghiệt[b] mà những tội nhân không tin kính đã nói chống lại Ngài[c].
