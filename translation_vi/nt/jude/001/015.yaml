id: JUD.1.15
reference: Jude 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: vi
  text: để thi hành sự phán xét chống lại mọi người và kết tội tất cả những kẻ không tin kính[a] về mọi hành vi không tin kính mà họ đã phạm trong sự không tin kính, cũng như về mọi lời lẽ cay nghiệt[b] mà những tội nhân không tin kính đã nói chống lại Ngài[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “vạch trần” hoặc “chứng minh là có tội”. Động từ Hy Lạp có thể chỉ việc đưa điều sai trái ra ánh sáng, nhưng tại đây nằm trong bối cảnh tư pháp cùng với cụm “thi hành sự phán xét”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “những lời cứng cỏi”. Từ Hy Lạp có lẽ chỉ những lời cay nghiệt, ngang ngược hoặc hỗn xược nói chống lại Ngài.
    reason: lexical_alternative
  - marker: c
    text: “Ngài” theo ngữ cảnh chỉ về Chúa được nhắc đến trong câu trước.
    reason: cross_reference
lexical_decisions:
- source_word: ποιῆσαι κρίσιν
  choice: thi hành sự phán xét
  rationale: Diễn đạt hành động thực thi phán quyết trong bối cảnh tư pháp và cánh chung, thay vì chỉ đưa ra một quyết định.
- source_word: κατὰ πάντων
  choice: chống lại mọi người
  rationale: κατά với sở hữu cách ở đây mang nghĩa đối nghịch/tư pháp; “chống lại” giữ hướng tác động của sự phán xét.
- source_word: ἐλέγξαι
  choice: kết tội
  rationale: Trong ngữ cảnh tư pháp đi cùng κρίσιν, động từ chỉ việc phơi bày và xác lập tội trạng, mạnh hơn nghĩa đơn thuần khiển trách.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: tất cả những kẻ không tin kính
  rationale: Cụm tính từ được danh từ hóa và ở số nhiều; cách dịch này rõ nghĩa, đồng thời giữ mối liên hệ với chuỗi từ ἀσέβεια/ἀσεβέω.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν
  choice: về mọi việc không tin kính họ đã làm một cách không tin kính
  rationale: Chủ ý giữ sự lặp lại nhấn mạnh của nhóm từ đồng gốc ἀσεβ-, dù tiếng Việt phải diễn đạt bằng danh ngữ và trạng ngữ.
- source_word: πάντων τῶν σκληρῶν
  choice: mọi lời lẽ cay nghiệt
  rationale: Trong ngữ cảnh lời nói, σκληρός chỉ những lời gay gắt, ngang ngược hoặc xúc phạm; thêm “lời lẽ” làm rõ điều vốn được ngữ cảnh hàm ý.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: đã nói chống lại Ngài
  rationale: Thì quá khứ thể hiện các hành vi lời nói đã xảy ra; “chống lại” phản ánh κατά với sở hữu cách.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: những tội nhân không tin kính
  rationale: Giữ cả hai yếu tố mô tả và sự nhấn mạnh cao trào của câu, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của αὐτοῦ trong cụm “đã nói chống lại Ngài”
  choice: Giữ đại từ “Ngài” trong chính văn
  alternative: Dịch rõ thành “Chúa” hoặc “Đức Chúa Trời”
  rationale: Ngữ cảnh câu trước cho thấy đại từ quy chiếu đến Chúa, nhưng nguyên văn dùng đại từ. Giữ đại từ tránh giải nghĩa quá mức và bảo toàn cách diễn đạt của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc nối tiếp của lời tiên tri, sắc thái tư pháp, cùng sự lặp lại có chủ ý của nhóm từ “không tin kính”. Dùng “Ngài” để đại từ quy chiếu trang trọng mà không thay nguyên văn bằng một danh xưng được giải nghĩa.
