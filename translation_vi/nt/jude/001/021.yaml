id: JUD.1.21
reference: Jude 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: vi
  text: Hãy giữ mình trong tình yêu của Đức Chúa Trời,[a] đang khi trông đợi lòng thương xót của Chúa Giê-su, Đấng Mê-si, là Chúa chúng ta,[b] hướng tới sự sống đời đời.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong tình yêu Đức Chúa Trời dành cho anh em” hoặc “trong tình yêu của anh em đối với Đức Chúa Trời.”
    reason: alternative_reading
  - marker: b
    text: 'Tiếng Hy Lạp: “Giê-su Christos”; Christos là chức hiệu có nghĩa là “Đấng Mê-si,” tức Đấng được xức dầu.'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể hiểu là “cho sự sống đời đời” hoặc “để được sự sống đời đời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: Hãy giữ mình
  rationale: Động từ mệnh lệnh trực tiếp ở ngôi thứ hai số nhiều; cách diễn đạt này tự nhiên trong tiếng Việt và không thêm ý về phương cách gìn giữ.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: trong tình yêu của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu của tiếng Hy Lạp và không quyết định tình yêu ấy là tình yêu Đức Chúa Trời dành cho con người hay tình yêu con người hướng về Ngài.
- source_word: προσδεχόμενοι
  choice: đang khi trông đợi
  rationale: Phân từ hiện tại diễn tả tư thế trông mong liên tục đi kèm với mệnh lệnh chính.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Cách dịch thông dụng, diễn đạt sự thương cảm và ân huệ dành cho người không xứng đáng.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch chuẩn và trang trọng của κύριος trong ngữ cảnh Tân Ước.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Giữ tên riêng theo truyền thống tiếng Việt và dịch Χριστός theo chức hiệu Mê-si, thay vì coi đó chỉ như một phần của tên.
- source_word: εἰς ζωὴν αἰώνιον
  choice: để được sự sống đời đời
  rationale: Diễn đạt tự nhiên hướng đích của εἰς trong tiếng Việt; chú thích bảo lưu các sắc thái có thể có của quan hệ này.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách trong ἀγάπῃ θεοῦ
  choice: tình yêu của Đức Chúa Trời
  alternative: tình yêu Đức Chúa Trời dành cho anh em; tình yêu của anh em đối với Đức Chúa Trời
  rationale: Nguyên văn cho phép cả cách hiểu chủ thể và đối thể; bản dịch chính giữ nguyên độ mở thay vì chọn một phía.
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ; Ki-tô
  rationale: Χριστός có sức nặng của một chức hiệu trong cụm từ này; dịch nghĩa giúp độc giả nhận ra chức hiệu ấy.
- issue: Quan hệ của εἰς ζωὴν αἰώνιον với lòng thương xót
  choice: để được sự sống đời đời
  alternative: dẫn đến sự sống đời đời; cho đến sự sống đời đời
  rationale: εἰς biểu thị hướng đích hoặc kết quả nhưng không xác định thật hẹp quan hệ cú pháp; bản dịch dùng cách nói tự nhiên và ghi nhận các khả năng khác trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” được hàm ý trong đại từ phản thân số nhiều “mình”; giữ nhịp câu khuyên bảo và mối liên hệ đồng thời của phân từ. Các dấu chú thích đều xuất hiện ngay sau cụm từ liên quan.
