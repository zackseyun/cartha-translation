id: JUD.1.2
reference: Jude 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: vi
  text: Nguyện lòng thương xót và sự bình an và tình yêu thương được nhân thêm cho anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “càng gia tăng” hoặc “ngày càng dồi dào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Cách diễn đạt tự nhiên và trang trọng trong tiếng Việt, giữ được cả ý niệm thương cảm lẫn ân huệ được ban cho người nhận.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Dịch cách dữ chỉ hướng của lời chúc phước; “anh chị em” phù hợp với lời gửi đến cộng đồng tín hữu và dễ hiểu trong tiếng Việt hiện đại.
- source_word: εἰρήνη
  choice: sự bình an
  rationale: Giữ ý nghĩa rộng của εἰρήνη về bình an, hòa thuận và an lành mà không diễn giải quá mức.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: “Tình yêu thương” là cách dịch tự nhiên, rõ nghĩa và có phẩm cách của ἀγάπη trong tiếng Việt hiện đại.
- source_word: πληθυνθείη
  choice: nguyện ... được gia tăng
  rationale: “Nguyện” thể hiện lực cầu chúc của thể mong ước; “được gia tăng” giữ sắc thái bị động và hình ảnh tăng thêm của động từ.
- source_word: καὶ ... καὶ ... καὶ
  choice: và ... và ... và
  rationale: Giữ ba liên từ lặp lại để bảo tồn nhịp điệu tích lũy và trang trọng của nguyên văn.
theological_decisions:
- issue: Cách thể hiện thức mong ước trong lời chúc phước
  choice: Nguyện ... được gia tăng cho anh chị em.
  alternative: Cầu xin ... càng thêm lên trong anh chị em.
  rationale: “Nguyện” diễn đạt trực tiếp lời cầu chúc mà không xác định thêm tác nhân; “được gia tăng” bảo tồn dạng bị động và không giải quyết thay nguyên văn việc các ân phước tăng lên bằng cách nào.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ phép lặp “và” của nguyên văn thay vì chuyển thành danh sách dùng dấu phẩy; dùng “anh chị em” để chỉ số nhiều một cách bao quát.
