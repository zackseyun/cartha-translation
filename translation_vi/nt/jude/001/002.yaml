- from: Nguyện lòng thương xót và sự bình an và tình yêu thương được gia tăng cho anh chị em.[a]
  to: Nguyện lòng thương xót và sự bình an và tình yêu thương được nhân thêm cho anh chị em.[a]
  rationale: Sửa “được gia tăng” thành “được nhân thêm” để phản ánh sát hơn πληθυνθείη mà vẫn giữ thể bị động và lực cầu chúc của câu. Chú thích được chỉnh để nêu các phương án tiếng Việt tự nhiên cho các sắc thái ‘increase’ và ‘abound’.
