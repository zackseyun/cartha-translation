revisions:
- from: Anh yêu dấu,[a] anh đang hành động cách trung tín trong bất cứ việc gì anh làm cho các anh em,[b] và nhất là khi họ là những người xa lạ.[c]
  to: Anh thân mến,[a] anh trung tín trong mọi việc anh làm cho các anh em,[b] đặc biệt là đối với những người xa lạ.[c]
  rationale: Chỉnh lời xưng hô và thành ngữ chỉ sự trung tín cho tự nhiên hơn trong tiếng Việt hiện đại. Thay mệnh đề “khi họ là” bằng cấu trúc “đối với” để không áp đặt một quan hệ thời gian không có trong nguyên văn, đồng thời giữ cách hiểu nhấn mạnh theo mạch văn và bảo lưu độ mở cú pháp trong chú thích.
  reviewer_model: gpt-5.6-terra
