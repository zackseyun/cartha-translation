source:
  edition: SBLGNT
  text: Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ ⸀τοῦτο ξένους,
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/005.yaml
  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: vi
  text: Anh thân mến,[a] anh trung tín trong mọi việc anh làm cho các anh em,[b] đặc biệt là đối với những người xa lạ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Người yêu dấu.” Từ Hy Lạp ở hô cách số ít, là lời gọi thân mật dành cho người nhận thư.'
    reason: lexical_alternative
  - marker: b
    text: “Các anh em” dịch danh từ giống đực số nhiều ἀδελφοὺς. Trong ngữ cảnh, từ này chỉ những người cùng đức tin, dù nhóm ấy có thể bao gồm cả phụ nữ.
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát hơn: “và điều đó đối với những người xa lạ.” Cụm Hy Lạp cô đọng này có thể chỉ các anh em là những người Gai-út chưa quen biết; cũng có thể được hiểu là mở rộng việc làm trung tín đến những người xa lạ. “Những người xa lạ” không nhất thiết là người ngoại quốc.'
    reason: ambiguity
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Anh yêu dấu
  rationale: Danh từ hóa tính từ ở hô cách số ít, dùng để thân mật gọi người nhận thư là Gai-út. “Anh yêu dấu” giữ được sắc thái trìu mến và trang trọng của lời xưng hô.
- source_word: πιστὸν ποιεῖς
  choice: anh đang hành động cách trung tín
  rationale: Thành ngữ này theo sát nghĩa là “anh làm một việc trung tín”; cách diễn đạt đã chọn tự nhiên hơn trong tiếng Việt mà vẫn giữ lời khen về lòng trung tín và đáng tin cậy.
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: trong bất cứ việc gì anh làm
  rationale: Đại từ quan hệ đi với ἐάν và động từ giả định tạo nghĩa bất định, tức “bất cứ việc gì”. Ở đây ἐργάζομαι chỉ rộng về những việc phục vụ thực tế, nên “làm” phù hợp hơn “lao động”.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: cho các anh em
  rationale: εἰς mang nghĩa hướng đến hoặc vì lợi ích của người khác trong ngữ cảnh này. ἀδελφοὺς là giống đực số nhiều và ở đây chỉ những người cùng đức tin; “các anh em” vừa gần hình thức Hy Lạp vừa quen thuộc trong văn phong thư tín Cơ Đốc.
- source_word: καὶ τοῦτο ξένους
  choice: và nhất là khi họ là những người xa lạ
  rationale: Cụm rút gọn này nhấn mạnh rằng lòng trung tín ấy còn được bày tỏ đối với những anh em mà Gai-út không quen biết. “Nhất là khi” diễn đạt tự nhiên lực nhấn mạnh, trong khi chú thích giữ lại cách hiểu sát chữ và sắc thái “dù là” có thể có.
- source_word: ξένους
  choice: những người xa lạ
  rationale: Trong bối cảnh tiếp đón khách, ξένος nói đến người chưa quen biết đối với chủ nhà, không nhất thiết là người ngoại quốc.
theological_decisions:
- issue: Phạm vi của τοὺς ἀδελφοὺς
  choice: Dịch theo hình thức giống đực là “các anh em”, đồng thời giải thích rằng ngữ cảnh nói đến những người cùng đức tin.
  alternative: “các anh chị em” hoặc “các tín hữu”
  rationale: Bản dịch giữ dấu vết ngữ pháp của nguyên văn mà không khẳng định rằng đoàn người nhất thiết chỉ có nam giới; chú thích làm rõ phạm vi ngữ cảnh.
- issue: Quan hệ giữa “các anh em” và “những người xa lạ”
  choice: Hiểu “những người xa lạ” là những anh em cùng đức tin nhưng chưa quen biết Gai-út.
  alternative: 'Hiểu đây là hai nhóm riêng biệt: các anh em và cả những người xa lạ nói chung.'
  rationale: Cách đọc đồng vị hoặc vị ngữ phù hợp nhất với cú pháp và mạch văn kế tiếp, nhưng cụm Hy Lạp cô đọng nên chú thích vẫn nêu cách dịch sát chữ thay vì làm mất độ mở của câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và có sắc thái thư tín thân tình. Đại từ “anh” phù hợp với việc tác giả trực tiếp nói với Gai-út; cấu trúc câu được làm tự nhiên nhưng các chú thích bảo lưu tính cô đọng và độ mơ hồ thật sự của καὶ τοῦτο ξένους.
