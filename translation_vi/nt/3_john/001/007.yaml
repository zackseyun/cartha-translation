source:
  edition: SBLGNT
  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: vi
  text: Vì họ đã lên đường vì Danh ấy, không nhận gì từ dân ngoại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người ngoại giáo” hoặc “người không tin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: vì
  rationale: Với sở hữu cách τοῦ ὀνόματος, ὑπέρ chỉ lý do hoặc mục đích thúc đẩy họ ra đi. “Vì” diễn đạt tự nhiên ý “vì cớ/vì lợi ích của” mà không hàm ý thay thế.
- source_word: τοῦ ὀνόματος
  choice: Danh ấy
  rationale: Cụm Hy Lạp có nghĩa đen là “Danh”, một cách nói tôn kính ám chỉ Chúa Giê-su/Chúa mà không nêu rõ danh xưng. “Danh ấy” tự nhiên hơn trong tiếng Việt, đồng thời giữ nguyên tính hàm ẩn và sắc thái thần học của nguyên văn.
- source_word: ἐξῆλθον
  choice: đã lên đường
  rationale: Động từ aorist nói đến việc họ ra đi, nhiều khả năng trong hành trình truyền giáo. “Đã lên đường” là cách nói hiện đại, tự nhiên và phù hợp ngữ cảnh hơn cách dịch sát chữ “đã đi ra”.
- source_word: μηδὲν λαμβάνοντες
  choice: không nhận gì
  rationale: 'Phân từ hiện tại mô tả cách họ lên đường: họ không nhận sự trợ giúp vật chất nào. “Không nhận gì” rõ nghĩa và tự nhiên trong tiếng Việt.'
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: từ những người ngoại
  rationale: Trong ngữ cảnh này, ἐθνικοί chỉ những người thuộc các dân ngoài cộng đồng đức tin, mang sắc thái vừa dân tộc vừa tôn giáo. “Những người ngoại” giữ được khung nhìn Do Thái–Cơ Đốc ban đầu mà không thu hẹp nghĩa như “người ngoại giáo” hay diễn giải thành “người không tin”.
theological_decisions:
- issue: Đối tượng được ám chỉ bằng “Danh ấy”
  choice: Giữ cách nói tôn kính và hàm ẩn “Danh ấy”, chỉ Chúa Giê-su/Chúa.
  alternative: Dịch rõ thành “danh Chúa Giê-su”, “danh Đấng Christ” hoặc “danh Ngài”.
  rationale: Nguyên văn không nêu trực tiếp đối tượng mà dùng “Danh” như một cách nói tôn kính. Giữ cách diễn đạt này bảo tồn sức gợi thần học và tránh thêm sự xác định không có trong câu.
- issue: Nghĩa của ἐθνικῶν
  choice: “những người ngoại” trong chính văn.
  alternative: “những người ngoại giáo” hoặc “những người không tin”.
  rationale: Trong ngữ cảnh, từ này có thể chỉ những người ngoài cộng đồng Cơ Đốc, nhưng cũng giữ dấu vết của sự phân biệt giữa dân Do Thái và các dân. Chính văn dùng cách dịch rộng hơn; chú thích bảo tồn các cách hiểu theo tôn giáo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Lên đường” diễn đạt tự nhiên bối cảnh sai phái; “Danh ấy” được viết hoa để giữ sắc thái tôn kính. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
