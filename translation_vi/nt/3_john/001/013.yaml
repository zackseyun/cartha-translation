base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/013.yaml
  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: vi
  text: Tôi có nhiều điều muốn viết cho anh, nhưng tôi không muốn viết cho anh bằng mực và bút[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “bằng mực và bút sậy.”'
    reason: Giữ nghĩa cụ thể của κάλαμος là dụng cụ viết làm bằng sậy, trong khi chính văn dùng “bút” tự nhiên hơn.
lexical_decisions:
- source_word: Πολλὰ
  choice: nhiều điều
  rationale: Tính từ trung tính số nhiều được dùng như danh từ; “nhiều điều” tự nhiên trong tiếng Việt và giữ rõ ý số nhiều.
- source_word: εἶχον γράψαι σοι
  choice: Tôi có nhiều điều để viết cho anh
  rationale: Cấu trúc ἔχω với động từ nguyên mẫu diễn tả những điều người viết dự định viết. “Có… để viết” vừa tự nhiên vừa không thêm sắc thái vượt quá nguyên văn; “anh” phù hợp với người nhận thư là Gai-út.
- source_word: ἀλλ’ οὐ θέλω
  choice: nhưng tôi không muốn
  rationale: Diễn đạt trực tiếp ý muốn hay ý định của θέλω bằng lối nói hiện đại, tự nhiên.
- source_word: διὰ μέλανος καὶ καλάμου
  choice: dùng mực và bút
  rationale: διά với sở hữu cách chỉ phương tiện. μέλαν là mực; κάλαμος theo nghĩa đen là cây sậy nhưng trong ngữ cảnh này là dụng cụ viết, nên “bút” truyền đạt chức năng rõ ràng trong chính văn.
- source_word: γράφειν
  choice: mà viết
  rationale: Động từ nguyên mẫu hiện tại có thể gợi hoạt động viết đang kéo dài, nhưng “mà viết” diễn đạt tự nhiên sự tương phản với việc gặp mặt và trò chuyện ở câu kế tiếp mà không diễn giải quá mức.
theological_decisions: []
translation_notes:
  register: Văn phong thư tín hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” thể hiện người nhận là một người nam cụ thể mà không tạo khoảng cách quá trang trọng.
