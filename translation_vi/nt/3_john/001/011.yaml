id: 3JN.1.11
reference: 3 John 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: vi
  text: Anh yêu dấu, đừng bắt chước điều ác, nhưng hãy bắt chước điều thiện. Người làm điều thiện[a] thuộc về Đức Chúa Trời; người làm điều ác chưa hề thấy Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người làm điều thiện” và “người làm điều ác” cũng có thể dịch là “người đang làm điều thiện” và “người đang làm điều ác”; các phân từ hiện tại Hy Lạp có thể nhấn mạnh hành vi tiếp diễn hoặc lối sống đặc trưng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Người yêu dấu
  rationale: Hô cách số ít của ἀγαπητός, diễn tả lời xưng hô trìu mến. “Người yêu dấu” giữ được sắc thái thân thương và văn phong Giăng rõ hơn “bạn thân mến”.
- source_word: μὴ μιμοῦ ... ἀλλὰ
  choice: đừng bắt chước ... nhưng hãy bắt chước
  rationale: “Bắt chước” tương ứng trực tiếp với μιμέομαι và giữ trọng tâm về việc noi theo một gương mẫu đạo đức. Lặp lại động từ trong vế sau giúp câu tiếng Việt rõ và tự nhiên.
- source_word: τὸ κακὸν / τὸ ἀγαθόν
  choice: điều ác / điều thiện
  rationale: Các tính từ trung tính có mạo từ được dùng như danh từ, chỉ những phạm trù đạo đức nói chung. “Điều ác/điều thiện” vừa gọn vừa giữ sự đối xứng.
- source_word: ὁ ἀγαθοποιῶν
  choice: Người làm điều thiện
  rationale: Phân từ hiện tại chủ động được danh từ hóa. Cách dịch này giữ nghĩa hành động và có thể hàm ý lối sống hay hành vi đặc trưng mà không diễn giải quá mức.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: thuộc về Đức Chúa Trời
  rationale: Trong lối nói của Giăng, ἐκ có thể biểu thị nguồn gốc hoặc sự thuộc về. “Thuộc về Đức Chúa Trời” tự nhiên trong tiếng Việt, đồng thời giữ mối liên hệ nguồn gốc–thuộc về mà không biến thành một công thức giáo lý.
- source_word: ὁ κακοποιῶν
  choice: người làm điều ác
  rationale: Giữ cấu trúc song song với ὁ ἀγαθοποιῶν và sắc thái hành vi đặc trưng của phân từ hiện tại.
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: chưa từng thấy Đức Chúa Trời
  rationale: Giữ nguyên hình ảnh “thấy” của ὁράω và sức nặng của thì hoàn thành. “Chưa từng” diễn đạt tự nhiên kết quả kéo dài đến hiện tại, thay vì đổi thành “không biết,” vốn mang tính diễn giải.
theological_decisions:
- issue: Công thức của Giăng nối hành vi đạo đức với mối quan hệ cùng Đức Chúa Trời
  choice: 'Giữ các phạm trù của bản văn: người làm điều thiện “thuộc về Đức Chúa Trời,” còn người làm điều ác “chưa từng thấy Đức Chúa Trời.”'
  alternative: Diễn giải thành một mệnh đề hệ thống về sự tái sinh, sự trọn lành, hoặc tuyệt đối hóa mọi hành vi riêng lẻ thành bằng chứng không hề có mối quan hệ nào với Đức Chúa Trời.
  rationale: Bản Hy Lạp đưa ra sự phân định đạo đức–thuộc linh bằng ngôn ngữ đặc trưng của Giăng. Bản dịch không làm nhẹ lời cảnh báo, nhưng cũng không nhập vào đó những kết luận giáo phái nằm ngoài câu chữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán; giữ lời xưng hô trìu mến “Người yêu dấu” và sự đối xứng nhịp nhàng giữa điều ác/điều thiện, làm điều thiện/làm điều ác.
