- from: Bình an cho bạn.[a] Các bạn hữu gửi lời chào bạn. Hãy chào từng bạn hữu đích danh.[b]
  to: Bình an cho bạn.[a] Các bạn hữu gửi lời chào đến bạn. Hãy chào từng bạn hữu theo tên.[b]
