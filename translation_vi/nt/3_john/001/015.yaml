    issue: Cụm “gửi lời chào bạn” thiếu từ nối tự nhiên.
    rationale: Thêm “đến” làm rõ người nhận lời chào và phù hợp cách diễn đạt tiếng Việt hiện đại, không thay đổi nghĩa của ἀσπάζονταί σε.
  - severity: low
    issue: Cụm “từng bạn hữu đích danh” hơi gượng; chú thích b chưa được neo ngay sau cụm tương ứng rõ nhất.
    rationale: κατ’ ὄνομα được diễn đạt trực tiếp hơn bằng “theo tên”; đặt ký hiệu chú thích ngay sau cụm này giúp liên kết chính xác với quyết định từ vựng.
