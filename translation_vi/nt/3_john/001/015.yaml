  text: Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατ’ ὄνομα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/015.yaml
  text: Peace to you[a]. The friends greet you[b]. Greet the friends by name.
translation:
  language: vi
  text: Bình an cho bạn.[a] Các bạn hữu gửi lời chào đến bạn. Hãy chào từng bạn hữu theo tên.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bình an ở cùng bạn.” Tiếng Hy Lạp sát nghĩa là “Bình an cho bạn”, một lời chúc thư tín cô đọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Hãy chào từng bạn hữu một” hoặc “Hãy chào từng bạn hữu riêng.” Tiếng Hy Lạp nói “theo tên”, nhấn mạnh lời chào có tính cá nhân dành cho mỗi người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: Bình an cho bạn
  rationale: Giữ sát cấu trúc lời chúc thư tín ngắn gọn trong tiếng Hy Lạp; “bạn” phù hợp với lời nói trực tiếp ở ngôi thứ hai số ít mà không thêm sắc thái tôn ti không có trong nguyên văn.
- source_word: ἀσπάζονταί σε
  choice: gửi lời chào bạn
  rationale: Trong ngữ cảnh kết thư, động từ này diễn tả việc chuyển lời chào; cách dịch này tự nhiên trong tiếng Việt và phân biệt rõ với mệnh lệnh trực tiếp ở câu sau.
- source_word: οἱ φίλοι / τοὺς φίλους
  choice: các bạn hữu / từng bạn hữu
  rationale: “Bạn hữu” giữ đúng nghĩa φίλοι và sắc thái trang trọng vừa phải, không đồng hóa với cách gọi “anh em” thường gặp trong thư tín Cơ Đốc.
- source_word: ἀσπάζου
  choice: Hãy chào
  rationale: Thể hiện trực tiếp mệnh lệnh số ít của nguyên văn và duy trì sự liên kết với lời chào ở mệnh đề trước.
- source_word: κατ’ ὄνομα
  choice: đích danh
  rationale: Chuyển tải thành ngữ “theo tên”, nhấn mạnh rằng mỗi người cần được chào một cách riêng và có tính cá nhân.
