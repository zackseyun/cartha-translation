  text: ἐλπίζω δὲ εὐθέως ⸂σε ἰδεῖν⸃, καὶ στόμα πρὸς στόμα λαλήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/014.yaml
  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: vi
  text: Nhưng tôi hy vọng sẽ sớm gặp anh, và chúng ta sẽ nói chuyện mặt đối mặt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “miệng đối miệng.” Đây là thành ngữ chỉ việc trò chuyện trực tiếp, tức là “mặt đối mặt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: tôi hy vọng
  rationale: Động từ hiện tại diễn tả niềm hy vọng hoặc sự mong đợi của người viết; cách dịch này tự nhiên trong lời kết thư và không làm mức độ chắc chắn mạnh hơn nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với việc viết thư được nhắc đến trước đó.
- source_word: εὐθέως
  choice: sớm
  rationale: Trong bối cảnh dự định gặp gỡ, từ này chỉ thời điểm gần, không nhất thiết là hành động xảy ra tức khắc.
- source_word: σε ἰδεῖν
  choice: gặp anh
  rationale: Theo sát ý 'thấy anh' nhưng dùng cách nói tiếng Việt tự nhiên cho một cuộc gặp trực tiếp; đại từ 'anh' phù hợp với lời xưng hô thân tình dành cho một người nam, dù tiếng Hy Lạp tự nó không mã hóa sắc thái xã hội của đại từ tiếng Việt.
- source_word: στόμα πρὸς στόμα
  choice: mặt đối mặt
  rationale: Nghĩa đen là 'miệng đối miệng', nhưng đây là thành ngữ chỉ cuộc trò chuyện trực tiếp; 'mặt đối mặt' tự nhiên và tránh gây hiểu lầm trong tiếng Việt.
- source_word: λαλήσομεν
  choice: chúng ta sẽ nói chuyện
  rationale: Thì tương lai diễn tả cuộc trò chuyện được mong đợi; 'nói chuyện' tự nhiên hơn 'nói' đơn độc trong ngữ cảnh này.
theological_decisions: []
