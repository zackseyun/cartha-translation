  register: Văn phong hiện đại, trang trọng vừa phải và gần gũi, phù hợp với lời kết của một bức thư cá nhân. Giữ liên từ chuyển ý và sắc thái hy vọng của nguyên văn; diễn đạt thành ngữ Hy Lạp bằng tiếng Việt tự nhiên.
