  to: Họ đã làm chứng trước hội thánh về tình yêu thương của anh, và anh sẽ làm tốt khi tiễn họ lên đường một cách xứng đáng với Đức Chúa Trời.[a]
  rationale: Bản sửa giữ cấu trúc và sắc thái khích lệ của nguyên văn, dùng “tiễn họ lên đường” cho nghĩa cơ bản của προπέμπω, đồng thời bảo tồn trong chú thích hàm ý hỗ trợ hành trình. “Một cách xứng đáng với Đức Chúa Trời” được đặt ngay sau hành động tiễn đi để làm rõ đây là tiêu chuẩn cho việc tiếp đãi/tiễn họ.
