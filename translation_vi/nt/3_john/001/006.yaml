  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: vi
  text: Họ đã làm chứng trước hội thánh về tình yêu thương của anh, và anh sẽ làm tốt khi tiễn họ lên đường một cách xứng đáng với Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “giúp họ tiếp tục hành trình”; động từ Hy Lạp có thể hàm ý tiễn người đi đường với sự chu cấp hoặc hỗ trợ thiết thực cho chặng đường tiếp theo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: đã làm chứng
  rationale: Thì aorist trình bày một hành động đã xảy ra; “đã làm chứng” tự nhiên trong tiếng Việt và giữ được sắc thái thuật lại, xác nhận của động từ.
- source_word: σου τῇ ἀγάπῃ
  choice: về tình yêu thương của anh
  rationale: 'Cách dịch này diễn đạt tự nhiên nội dung lời chứng: những người ấy đã thuật lại tình yêu thương của Gai-út.'
- source_word: ἐνώπιον ἐκκλησίας
  choice: trước hội thánh
  rationale: Giữ ý lời chứng được đưa ra trước cộng đồng tín hữu đang nhóm họp; “hội thánh” phù hợp văn cảnh thư tín Cơ Đốc.
- source_word: καλῶς ποιήσεις
  choice: anh sẽ làm một việc tốt
  rationale: Giữ hình thức tương lai và lực khuyên nhủ, khen ngợi lịch sự của thành ngữ Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
- source_word: προπέμψας
  choice: khi giúp họ tiếp tục hành trình
  rationale: προπέμπω không chỉ có thể chỉ việc tiễn đi mà thường hàm ý giúp đỡ để khách lữ hành đi tiếp; cách dịch này truyền đạt sắc thái tiếp trợ mà không giới hạn vào một hình thức vật chất cụ thể.
- source_word: ἀξίως τοῦ θεοῦ
  choice: theo cách xứng đáng với Đức Chúa Trời
  rationale: 'Diễn đạt rõ trạng thái cách thức và giữ nguyên sức nặng thần học: việc tiếp trợ phải phù hợp với phẩm giá, danh dự và ý muốn của Đức Chúa Trời.'
theological_decisions:
- issue: Sắc thái của προπέμπω trong việc tiếp đãi những người phục vụ lưu hành
  choice: Dịch “giúp họ tiếp tục hành trình” và chú thích rằng từ này có thể bao gồm việc tiễn đi, chu cấp hoặc hỗ trợ thiết thực.
  alternative: tiễn họ lên đường
  rationale: Trong văn cảnh tiếp đãi Cơ Đốc, động từ thường hàm ý hỗ trợ cho chặng đường kế tiếp, chứ không chỉ nói lời từ biệt. Bản dịch chính giữ sắc thái rộng, còn chú thích bảo tồn các khả năng cụ thể mà không xác quyết quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” vì lời thư trực tiếp gửi Gai-út, nhưng không đưa tên riêng vào câu khi nguyên văn chỉ dùng đại từ. Cấu trúc hai mệnh đề được giữ trong một câu để phản ánh mạch Hy Lạp.
