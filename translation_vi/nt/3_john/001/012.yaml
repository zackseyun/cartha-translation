reference: 3 John 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: vi
  text: Mọi người đều làm chứng cho Đê-mê-triu[a], và chính sự thật cũng làm chứng cho ông[b]. Chúng tôi cũng làm chứng về ông, và bạn biết rằng lời chứng của chúng tôi là chân thật.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng thể hoàn thành bị động của động từ “làm chứng”, nhấn mạnh rằng lời chứng về Đê-mê-triu đã được xác lập. Cũng có thể dịch: “Đê-mê-triu đã được mọi người làm chứng cho.” Ngữ cảnh cho thấy đây là lời chứng thuận lợi.'
    reason: lexical_alternative
  - marker: b
    text: “Chính sự thật” có thể hàm ý đời sống của Đê-mê-triu phù hợp với sự thật; hoặc, theo nghĩa rộng hơn, sự thật—có thể chỉ Tin Mừng—làm chứng có lợi cho ông.
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: Đê-mê-triu
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc, rõ ràng trong tiếng Việt.
- source_word: μεμαρτύρηται ὑπὸ πάντων
  choice: Mọi người đều làm chứng tốt về
  rationale: Thể hoàn thành bị động nói đến lời chứng đã được xác lập và còn hiệu lực. Cách diễn đạt chủ động tự nhiên hơn trong tiếng Việt; từ “tốt” làm rõ tính chất tán thành được ngữ cảnh hàm ý, không coi đó là một tính từ có sẵn trong nguyên văn.
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: chính sự thật cũng vậy
  rationale: Giữ nguyên sức nhấn của αὐτῆς và hình ảnh nhân cách hóa “sự thật”, không thu hẹp thành “Tin Mừng” hay giải nghĩa thành nếp sống của Đê-mê-triu.
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: Chúng tôi cũng làm chứng về ông
  rationale: Diễn đạt lực bổ sung của καὶ...δέ và bổ sung đối tượng “ông” vốn được ngữ cảnh xác định để câu tiếng Việt tự nhiên.
- source_word: οἶδας
  choice: bạn biết
  rationale: οἶδα tuy có hình thái hoàn thành nhưng mang nghĩa trạng thái hiện tại; đại từ số ít được giữ, không suy đoán giới tính người nhận.
- source_word: ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν
  choice: lời chứng của chúng tôi là chân thật
  rationale: Duy trì liên hệ từ vựng giữa động từ “làm chứng” và danh từ “lời chứng”; “chân thật” diễn đạt trực tiếp ἀληθής và gợi lại “sự thật” ở mệnh đề trước.
theological_decisions:
- issue: Ý nghĩa của “chính sự thật” trong văn phong Giăng
  choice: Giữ nguyên “chính sự thật” và để sự thật được trình bày như một chủ thể làm chứng.
  alternative: “chính Tin Mừng” hoặc “đời sống phù hợp với sự thật của ông làm chứng”
  rationale: Nguyên văn có thể gợi rằng đời sống Đê-mê-triu phù hợp với sự thật, hoặc rộng hơn rằng sự thật/Tin Mừng chứng nhận ông. Bản dịch không nên thu hẹp sự hàm súc thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bạn” cho đại từ số ít trong οἶδας nhằm tránh tự ý xác định giới tính; giữ “sự thật” thay vì diễn giải theo một truyền thống thần học cụ thể.
