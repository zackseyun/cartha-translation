source:
  edition: SBLGNT
  text: Ἔγραψά ⸀τι τῇ ἐκκλησίᾳ· ἀλλ’ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: vi
  text: Tôi đã viết điều gì đó cho hội thánh[a], nhưng Đi-ô-trép, người thích đứng đầu trong số họ, không tiếp nhận chúng tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã viết một lời ngắn cho hội thánh.” Bản Hy Lạp dùng một cách nói bất định (“đã viết điều gì đó”); một số thủ bản mở rộng cách diễn đạt này.'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “không đón tiếp chúng tôi” hoặc “không thừa nhận chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: Tôi đã viết
  rationale: Thì aorist chỉ định được chuyển tự nhiên bằng một hành động đã xảy ra; cách diễn đạt này rõ ràng trong tiếng Việt mà không áp đặt sắc thái thời gian vượt quá nguyên văn.
- source_word: τι
  choice: đôi điều
  rationale: Đại từ bất định giống trung τι chỉ một nội dung không được xác định. “Đôi điều” là cách nói tiếng Việt tự nhiên, vẫn giữ tính không xác định và không tự ý thêm đối tượng như “một lá thư”.
- source_word: τῇ ἐκκλησίᾳ
  choice: cho hội thánh
  rationale: ἐκκλησία ở đây chỉ cộng đồng tín hữu địa phương. “Hội thánh” là cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Diễn đạt trực tiếp sự tương phản mạnh giữa việc tác giả đã viết và phản ứng của Đi-ô-trép.
- source_word: ὁ φιλοπρωτεύων
  choice: kẻ thích đứng đầu
  rationale: Từ này mô tả người ham vị trí thứ nhất hoặc địa vị nổi trội. “Thích đứng đầu” rõ nghĩa và giữ được sắc thái phê phán; “kẻ” phản ánh giọng khiển trách trong ngữ cảnh.
- source_word: αὐτῶν
  choice: trong số họ
  rationale: Cụm này xác định nhóm người mà giữa họ Đi-ô-trép muốn đứng đầu, nhưng không tự ý khẳng định ông có thẩm quyền chính thức trên họ.
- source_word: Διοτρέφης
  choice: Đi-ô-trép
  rationale: Tên riêng được phiên âm theo cách đọc quen thuộc và dễ đọc trong tiếng Việt.
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: không tiếp nhận chúng tôi
  rationale: ἐπιδέχομαι có thể bao hàm việc đón tiếp, chấp nhận hoặc thừa nhận. “Tiếp nhận” giữ được phạm vi nghĩa rộng hơn, không giới hạn câu vào lòng hiếu khách hay thẩm quyền.
theological_decisions:
- issue: Bản chất sự chống đối của Đi-ô-trép
  choice: không tiếp nhận chúng tôi
  alternative: không đón tiếp chúng tôi; không thừa nhận chúng tôi
  rationale: Nguyên văn không buộc phải hiểu riêng về việc tiếp đón cá nhân, lòng hiếu khách hay sự thừa nhận thẩm quyền. Cách dịch rộng giữ nguyên sự căng thẳng này và tránh đưa vào một kết luận giáo hội học hẹp hơn câu Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng gần gũi. Câu giữ cấu trúc tương phản của nguyên văn, dùng “đôi điều” để diễn đạt tự nhiên tính bất định của τι, và giữ “tiếp nhận” đủ rộng để không giải quyết thay cho độc giả bản chất chính xác của sự chống đối.
