id: 3JN.1.4
reference: 3 John 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: vi
  text: 'Tôi không có niềm vui nào lớn hơn điều này: được nghe rằng các con của tôi đang bước đi trong chân lý.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Tôi không có niềm vui nào lớn hơn những điều này.”'
    reason: lexical_alternative
  - marker: b
    text: “Các con của tôi” rất có thể chỉ những người con thuộc linh của Gioan—các tín hữu ở dưới sự chăm sóc mục vụ của ông.
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν
  choice: lớn hơn
  rationale: Tính từ so sánh bổ nghĩa cho χαράν; cách nói “không có niềm vui nào lớn hơn” tự nhiên và trang trọng trong tiếng Việt.
- source_word: τούτων
  choice: điều này
  rationale: Đây là sở hữu cách dùng để so sánh. Dù hình thức Hy Lạp là số nhiều (“những điều này”), mệnh đề theo sau nêu nội dung cụ thể của niềm vui, nên “điều này” tự nhiên hơn; dạng sát chữ được ghi ở chú thích.
- source_word: χαράν
  choice: niềm vui
  rationale: Tương đương thông dụng, giữ được sắc thái cảm xúc và sức nặng thần học của danh từ Hy Lạp.
- source_word: ἵνα ἀκούω
  choice: được nghe rằng
  rationale: ἵνα ở đây giới thiệu nội dung tạo nên niềm vui, không nhất thiết chỉ mục đích. “Được nghe rằng” diễn đạt tự nhiên và không làm mất quan hệ ý nghĩa ấy.
- source_word: τὰ ἐμὰ τέκνα
  choice: các con của tôi
  rationale: Giữ nguyên ẩn dụ gia đình của τέκνα, không xác định ngay trong chính văn đó là con ruột hay con cái thuộc linh.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: trong chân lý
  rationale: Mạo từ làm cho cụm từ có tính xác định. “Chân lý” giữ được cả chiều kích niềm tin lẫn đời sống chân thật trong văn chương Gioan, thay vì thu hẹp thành sự thành thật đơn thuần.
- source_word: περιπατοῦντα
  choice: đang bước đi
  rationale: Giữ ẩn dụ đạo đức về cách sống trong nguyên văn; đây cũng là lối diễn đạt Kinh Thánh dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: τέκνα chỉ con ruột hay con cái thuộc linh
  choice: Giữ cách gọi “các con của tôi” trong chính văn.
  alternative: các con thuộc linh của tôi; những người tôi đã dẫn đến đức tin
  rationale: Ngữ cảnh rất có thể nói đến những tín hữu ở dưới sự chăm sóc thuộc linh của tác giả, nhưng nguyên văn chỉ dùng từ thân tộc “con cái”. Giữ nguyên hình ảnh tránh thu hẹp nghĩa trong bản dịch.
- issue: Ý nghĩa của ἐν τῇ ἀληθείᾳ
  choice: Dịch là “trong chân lý”.
  alternative: một cách chân thật; theo giáo huấn chân chính
  rationale: Cách dùng của Gioan thường gắn kết chân lý được tin nhận với đời sống phù hợp chân lý ấy. Bản dịch không tách hoặc đồng nhất cụm từ với riêng một phương diện.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ các hình ảnh “các con” và “bước đi”, đồng thời dùng “chân lý” để bảo toàn chiều rộng thần học của câu.
