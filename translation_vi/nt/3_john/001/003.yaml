id: 3JN.1.3
reference: 3 John 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: vi
  text: Vì tôi rất vui mừng khi các anh em đến và làm chứng về chân lý nơi anh[a], đúng như anh đang bước đi trong chân lý.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm chứng về lòng trung thành của anh đối với chân lý.” Cụm Hy Lạp dịch sát là “làm chứng cho chân lý của anh”; cách nói này có thể chỉ chân lý được biểu lộ nơi anh hoặc sự trung thành của anh đối với chân lý.'
    reason: Nguyên văn σου τῇ ἀληθείᾳ có thể nhấn mạnh chân lý hiện diện trong đời sống người nhận hoặc sự trung thành của ông đối với chân lý; bản văn không hoàn toàn phân định giữa các sắc thái ấy.
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: Vì tôi rất vui mừng
  rationale: Diễn đạt tự nhiên sắc thái giải thích của γὰρ và mức độ mạnh của λίαν; ἐχάρην có nghĩa chủ động dù mang hình thái thụ động.
- source_word: ἐρχομένων ἀδελφῶν
  choice: khi các anh em đến
  rationale: Hiểu kết cấu phân từ sở hữu cách theo nghĩa thời gian. “Các anh em” giữ hình thức giống đực số nhiều của nguyên văn và cách gọi thân thuộc giữa các tín hữu.
- source_word: μαρτυρούντων
  choice: làm chứng
  rationale: Giữ hình ảnh và sắc thái chứng nhận của μαρτυρέω, thay vì làm nhẹ thành “thuật lại” hay “báo tin”.
- source_word: σου τῇ ἀληθείᾳ
  choice: về việc anh sống theo chân lý
  rationale: Cụm sở hữu cách σου cùng tặng cách τῇ ἀληθείᾳ khó chuyển sát từng chữ sang tiếng Việt mà không gợi ý sai về “chân lý riêng” của người nhận. Cách dịch này liên kết tự nhiên với mệnh đề giải thích tiếp theo nhưng không thu hẹp chân lý thành sự chân thành đơn thuần.
- source_word: καθὼς
  choice: đúng như
  rationale: Nêu rõ sự tương ứng giữa lời chứng của các anh em và nếp sống thực tế của người nhận.
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: anh vẫn đang bước đi trong chân lý
  rationale: Giữ ẩn dụ đạo đức “bước đi” của περιπατέω và thể hiện hành động đang tiếp diễn của thì hiện tại. “Vẫn đang” nhấn mạnh sự bền bỉ mà không biến câu thành một nhận định chỉ về khoảnh khắc hiện tại.
theological_decisions:
- issue: Ý nghĩa của ἀλήθεια trong bối cảnh đạo đức của văn phẩm Giăng
  choice: Giữ “chân lý” ở cả hai ý niệm, đồng thời diễn đạt lần đầu là “việc anh sống theo chân lý”.
  alternative: “sự chân thật của anh”, “lòng trung thành của anh đối với chân lý”, hoặc sát chữ “chân lý của anh”
  rationale: Nguyên văn liên kết chân lý được người khác làm chứng với cách sống của Gai-út. Bản dịch tránh biến ἀλήθεια thành sự chân thành thuần túy, nhưng cũng không quyết định dứt khoát rằng từ này chỉ nói về giáo lý hay chỉ nói về đạo đức.
- issue: Phạm vi chỉ người của ἀδελφῶν
  choice: các anh em
  alternative: anh chị em hoặc các tín hữu
  rationale: Danh từ Hy Lạp mang giống đực số nhiều và có thể chỉ những nam tín hữu cụ thể đã đến. Chú thích ghi nhận khả năng cách gọi này được dùng rộng hơn cho những người cùng đức tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ “tôi—anh” phù hợp một bức thư cá nhân gửi cho một người nam. Giữ ẩn dụ “bước đi trong chân lý” để bảo toàn phong cách của văn phẩm Giăng; tránh cụm “chân lý của anh” trong chính văn vì tiếng Việt hiện đại dễ hiểu thành chân lý chủ quan riêng của người nhận.
