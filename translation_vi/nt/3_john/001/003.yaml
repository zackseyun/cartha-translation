  source_fidelity: 'Bản dịch truyền đạt đúng mạch chính: niềm vui lớn của tác giả, việc các anh em đến làm chứng, và nếp sống của người nhận trong chân lý. Tuy nhiên, “vẫn đang” thêm ý tiếp diễn/bền bỉ (“vẫn”) không được nêu bởi thì hiện tại περιπατεῖς. Cách diễn đạt lần đầu “về việc anh sống theo chân lý” cũng gần như đồng nhất hóa nội dung lời chứng với mệnh đề sau, thay vì giữ liên hệ sở hữu/ngữ nghĩa cô đọng của σου τῇ ἀληθείᾳ.'
