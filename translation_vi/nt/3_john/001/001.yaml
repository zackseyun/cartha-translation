id: 3JN.1.1
reference: 3 John 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: vi
  text: Trưởng lão gửi Gai-út yêu dấu, người mà tôi yêu trong lẽ thật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thật lòng”; hoặc “trong chân lý”. Cụm từ Hy Lạp có thể nói đến tình yêu chân thành, tình yêu đặt nền trên lẽ thật của Tin Mừng, hoặc cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: Trưởng lão
  rationale: Cụm có mạo từ, dùng như danh từ để người gửi tự xưng. “Trưởng lão” là cách gọi tự nhiên trong tiếng Việt, giữ được sắc thái địa vị hoặc chức vụ mà không biến thành một thuật ngữ giáo phái riêng.
- source_word: Γαΐῳ
  choice: Gai-út
  rationale: Phiên âm tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc, đồng thời phản ánh tên Hy Lạp Γάϊος.
- source_word: τῷ ἀγαπητῷ
  choice: người yêu dấu
  rationale: Diễn đạt lời gọi thân ái dành cho người nhận và giữ mối liên hệ từ vựng với động từ ἀγαπῶ ở phần sau của câu.
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: là người tôi yêu
  rationale: Đại từ quan hệ làm tân ngữ của “yêu”; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn thể hiện đại từ ἐγώ được nêu rõ trong nguyên văn.
- source_word: ἐν ἀληθείᾳ
  choice: trong lẽ thật
  rationale: Giữ hình ảnh và chiều sâu của danh từ ἀλήθεια, không thu hẹp cụm từ chỉ còn nghĩa “thật lòng”; đồng thời để ngỏ khả năng nói đến tình yêu chân thành, tình yêu đặt nền trên lẽ thật của Tin Mừng, hoặc cả hai.
theological_decisions:
- issue: Sắc thái của ἀλήθεια trong cụm kết câu
  choice: trong lẽ thật
  alternative: thật lòng; trong chân lý
  rationale: Văn phẩm Giăng thường dùng “lẽ thật” với chiều sâu thần học, nhưng câu này không buộc phải quyết định cụm từ chỉ nói về sự chân thành hay về lẽ thật của Tin Mừng. Bản dịch chính giữ nguyên độ mở ấy, còn chú thích nêu các khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Trưởng lão” và “lẽ thật” theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc; dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
