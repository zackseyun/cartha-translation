  naturalness: 'Cần chỉnh nhẹ để văn xuôi hiện đại trôi chảy hơn: dùng “nêu ra” cho ὑπομνήσω, diễn đạt lời công kích là “nói những lời ác ý, nhảm nhí chống lại,” và dùng thành ngữ “không lấy những điều ấy làm đủ.”'
  terminology: “Các anh em,” “tiếp đón,” và “hội thánh” phù hợp ngữ cảnh. Chú thích a giữ đúng tính khả dĩ của quy chiếu đến những người truyền đạo lưu động mà không khẳng định quá mức. Chú thích b phù hợp với lực của ἐκβάλλει và không áp đặt một thủ tục giáo hội cụ thể.
