id: 3JN.1.10
reference: 3 John 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: vi
  text: 'Vì vậy, nếu tôi đến, tôi sẽ nêu ra những việc ông ta đang làm: ông ta nói những lời ác ý, nhảm nhí chống lại chúng tôi. Không lấy những điều ấy làm đủ, chính ông ta không tiếp đón các anh em[a], mà còn ngăn cản những người muốn tiếp đón họ và đuổi họ ra khỏi hội thánh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các anh em” có lẽ chỉ những anh em Cơ Đốc đi đây đó, chẳng hạn các giáo sĩ; cũng có thể dịch rộng hơn là “các tín hữu.”
    reason: lexical_alternative
  - marker: b
    text: Hay “loại họ khỏi hội thánh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Giữ rõ quan hệ nguyên nhân–kết quả, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐὰν ἔλθω
  choice: nếu tôi đến
  rationale: Phản ánh trực tiếp điều kiện trong nguyên văn và góc nhìn thư tín.
- source_word: ὑπομνήσω
  choice: tôi sẽ vạch rõ
  rationale: Trong ngữ cảnh, tác giả sẽ đưa hành vi của Đi-ô-trép ra ánh sáng và khiến cộng đồng chú ý, chứ không chỉ đơn thuần nhắc lại.
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: những việc ông ta đang làm
  rationale: Giữ số nhiều và thể hiện hành động đang tiếp diễn bằng cách diễn đạt tự nhiên.
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: dùng những lời độc ác mà nói nhảm chống lại chúng tôi
  rationale: “Nói nhảm” giữ sắc thái lời lẽ rỗng tuếch của φλυαρέω; “độc ác” phản ánh πονηροῖς, còn “chống lại” nêu rõ đối tượng công kích.
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: Chưa thỏa mãn với những điều ấy
  rationale: Giữ hình ảnh ông ta không cho những hành vi trước đó là đủ, thay vì diễn giải thành việc chỉ đơn giản “không dừng lại”.
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: chính ông ta không tiếp đón các anh em
  rationale: “Tiếp đón” diễn đạt việc đón nhận, đặc biệt theo nghĩa tiếp khách và hỗ trợ người đi đường; “chính ông ta” giữ nhấn mạnh của αὐτός.
- source_word: τοὺς βουλομένους κωλύει
  choice: ngăn cản những người muốn tiếp đón họ
  rationale: Làm rõ bổ ngữ được hiểu ngầm từ mệnh đề trước mà không thay đổi ý nghĩa; “muốn” giữ sắc thái ý chí của βούλομαι.
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: đuổi họ ra khỏi hội thánh
  rationale: Giữ sức mạnh của ἐκβάλλει và chỉ sự loại trừ khỏi cộng đồng hội thánh địa phương.
theological_decisions:
- issue: Phạm vi chỉ người của τοὺς ἀδελφούς trong bối cảnh tiếp đãi của hội thánh
  choice: các anh em
  alternative: anh chị em / các tín hữu
  rationale: Danh từ giống đực số nhiều trong mạch văn nhiều khả năng chỉ những anh em Cơ Đốc đi đây đó, có thể là các giáo sĩ. Bản dịch giữ nét giới tính của nguyên văn thay vì tự mở rộng thành một nhóm hỗn hợp.
- issue: Ý nghĩa của việc ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: đuổi họ ra khỏi hội thánh
  alternative: khai trừ họ khỏi hội thánh
  rationale: Nguyên văn mô tả hành động loại họ khỏi cộng đồng nhưng không xác định đầy đủ thủ tục kỷ luật chính thức; vì vậy tránh từ “khai trừ,” vốn có thể hàm ý một quy trình giáo hội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ta” để duy trì quy chiếu đến Đi-ô-trép với sắc thái phê phán của ngữ cảnh; dùng “hội thánh” cho ἐκκλησία theo cách gọi phổ biến trong văn cảnh Tân Ước.
