revisions:
- from: 'Vì vậy, nếu tôi đến, tôi sẽ vạch rõ những việc ông ta đang làm: dùng những lời độc ác mà nói nhảm chống lại chúng tôi. Chưa thỏa mãn với những điều ấy, chính ông ta không tiếp đón các anh em[a], lại còn ngăn cản những người muốn tiếp đón họ và đuổi họ ra khỏi hội thánh[b].'
  to: 'Vì vậy, nếu tôi đến, tôi sẽ nêu ra những việc ông ta đang làm: ông ta nói những lời ác ý, nhảm nhí chống lại chúng tôi. Không lấy những điều ấy làm đủ, chính ông ta không tiếp đón các anh em[a], mà còn ngăn cản những người muốn tiếp đón họ và đuổi họ ra khỏi hội thánh[b].'
  rationale: Bản sửa giữ nguyên nội dung và các neo chú thích, nhưng thay cách diễn đạt của lời vu khống ác ý để phản ánh đồng thời λόγοις πονηροῖς và φλυαρῶν một cách tự nhiên, đồng thời sửa cấu trúc câu. “Không lấy những điều ấy làm đủ” bảo toàn ý hành vi sai trái tiếp diễn của mệnh đề phân từ.
