id: 3JN.1.2
reference: 3 John 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: vi
  text: Anh thân mến, tôi cầu nguyện cho anh được mọi sự hanh thông[a] và được khỏe mạnh[b], cũng như tâm hồn anh đang hanh thông[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong mọi sự.” Cụm từ Hy Lạp tự nhiên hơn khi chỉ phạm vi, chứ không phải “trên hết.”
    reason: alternative_reading
  - marker: b
    text: Hay “có sức khỏe tốt.”
    reason: lexical_alternative
  - marker: c
    text: Hay “mọi sự đều tốt đẹp với tâm hồn anh” hoặc “con người bên trong của anh đang hanh thông.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: Anh yêu quý
  rationale: Lối xưng hô trực tiếp, trìu mến và tự nhiên trong tiếng Việt hiện đại; vẫn giữ mối liên hệ ý nghĩa với tình yêu mà không thêm danh xưng “anh em” vốn không có trong câu Hy Lạp.
- source_word: περὶ πάντων
  choice: về mọi phương diện
  rationale: Diễn tả phạm vi của lời cầu nguyện, phù hợp với nghĩa tự nhiên “xét về mọi sự,” thay vì hiểu là thứ tự ưu tiên “trên hết.”
- source_word: εὔχομαί
  choice: tôi cầu nguyện
  rationale: Trong văn cảnh thư tín Cơ Đốc, động từ diễn tả lời cầu xin hay ước nguyện; “cầu nguyện” giữ được sắc thái tôn giáo của câu.
- source_word: σε εὐοδοῦσθαι
  choice: anh được hanh thông
  rationale: “Hanh thông” diễn tả việc tiến triển thuận lợi và có cuộc sống tốt đẹp, nhưng không giới hạn ý nghĩa vào sự giàu có vật chất.
- source_word: ὑγιαίνειν
  choice: có sức khỏe tốt
  rationale: Cách nói tự nhiên, rõ ràng về tình trạng sức khỏe thể chất.
- source_word: καθὼς
  choice: cũng như
  rationale: Đánh dấu sự so sánh giữa tình trạng bên ngoài, thể chất của người nhận thư và tình trạng của tâm hồn người ấy.
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: tâm hồn anh đang được hanh thông
  rationale: Giữ sự lặp lại của εὐοδόομαι ở hai vế và thể hiện trạng thái đang tiếp diễn, dù cách kết hợp “tâm hồn… hanh thông” hơi giàu tính ẩn dụ.
- source_word: ψυχή
  choice: tâm hồn
  rationale: Trong văn cảnh này, từ chỉ phương diện nội tâm hay sự sống bên trong của con người. “Tâm hồn” giữ được sự phân biệt với sức khỏe thể chất mà không áp đặt một hệ nhân học kỹ thuật.
theological_decisions:
- issue: Ý nghĩa của περὶ πάντων trong lời chúc nguyện
  choice: về mọi phương diện
  alternative: trên hết
  rationale: Cụm từ Hy Lạp tự nhiên hơn khi chỉ phạm vi—mọi phương diện của đời sống—chứ không phải điều được ưu tiên cao nhất.
- issue: Phạm vi ý nghĩa của εὐοδοῦσθαι
  choice: được hanh thông
  alternative: được thịnh vượng
  rationale: “Hanh thông” bao quát việc mọi sự tiến triển tốt đẹp, tránh thu hẹp lời cầu nguyện thành lời hứa hay sự bảo đảm về giàu có vật chất.
- issue: Ý nghĩa của ψυχή
  choice: tâm hồn
  alternative: sự sống; con người bên trong
  rationale: Bản dịch giữ sự đối chiếu với sức khỏe thể chất nhưng không xác quyết một quan niệm hệ thống về các thành phần cấu tạo con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh yêu quý” phù hợp với lời xưng hô trìu mến dành cho Gai-út; “hanh thông” được lặp lại để bảo toàn sự liên kết từ vựng trong nguyên văn, đồng thời các chú thích làm rõ những cách diễn đạt tự nhiên khác.
