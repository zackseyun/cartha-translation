- from: Vì vậy, chúng ta có bổn phận tiếp đón những người như thế[b], để trở nên những người cùng làm việc cho chân lý.[a]
  to: Vì vậy, chúng ta có bổn phận tiếp đón những người như thế[b], để chúng ta trở thành những người cộng tác cho chân lý.[a]
  rationale: Chỉnh sửa chỉ nhằm làm câu và chú thích tự nhiên hơn trong tiếng Việt chuẩn hiện đại. Bản sửa giữ nguyên quan hệ mục đích, nghĩa vụ đạo đức, sắc thái “trở thành,” và cách hiểu chính của τῇ ἀληθείᾳ; các cách hiểu thay thế vẫn được bảo lưu trong chú thích.
