source:
  edition: SBLGNT
  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: vi
  text: Vì vậy, chúng ta có bổn phận tiếp đón những người như thế[b], để chúng ta trở thành những người cộng tác cho chân lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người cộng tác với chân lý” hoặc “những người cộng tác trong chân lý.” Cách ba trong tiếng Hy Lạp có thể được hiểu theo nhiều cách; bản văn chính hiểu là cùng góp phần phục vụ công cuộc của chân lý.
    reason: alternative_reading
  - marker: b
    text: Động từ được dịch là “tiếp đón” cũng có thể bao hàm việc đón tiếp cách hiếu khách và hỗ trợ vật chất cho những người phục vụ đi đây đó như thế.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: chúng ta
  rationale: Giữ đại từ được nêu rõ trong tiếng Hy Lạp, vừa bao gồm tác giả và độc giả vừa tạo sắc thái nhấn mạnh.
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn đạt kết luận rút ra từ câu trước bằng một liên từ tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: ὀφείλομεν
  choice: có bổn phận
  rationale: Truyền đạt nghĩa vụ đạo đức của động từ mà không biến lời khuyên thành một mệnh lệnh tuyệt đối; cách nói trang trọng nhưng dễ hiểu.
- source_word: ὑπολαμβάνειν
  choice: tiếp đón
  rationale: Trong ngữ cảnh những người đi đây đó phục vụ, từ này chỉ việc đón nhận với lòng hiếu khách và có thể bao hàm cả sự hỗ trợ thiết thực.
- source_word: τοὺς τοιούτους
  choice: những người như thế
  rationale: Chỉ hạng người vừa được mô tả ở câu trước; cách dịch tự nhiên và không thêm giới tính mà cụm từ Hy Lạp không bắt buộc phải nêu.
- source_word: ἵνα
  choice: để
  rationale: Nêu mục đích hoặc kết quả dự kiến một cách gọn và tự nhiên.
- source_word: συνεργοὶ
  choice: những người cùng làm việc
  rationale: Giữ ý nghĩa cộng tác trong một công việc chung mà không dùng thuật ngữ giáo hội chuyên biệt.
- source_word: γινώμεθα
  choice: trở nên
  rationale: 'Giữ sắc thái đi vào một vai trò hay tình trạng mới: nhờ tiếp đón và hỗ trợ họ, người tin Chúa trở thành người dự phần vào công việc.'
- source_word: τῇ ἀληθείᾳ
  choice: cho chân lý
  rationale: Hiểu cách ba như chỉ đối tượng hay mục tiêu mà sự cộng tác phục vụ, đồng thời ghi nhận trong chú thích rằng cấu trúc Hy Lạp cũng có thể được hiểu là “với chân lý” hoặc “trong chân lý”.
theological_decisions:
- issue: Quan hệ ngữ nghĩa của τῇ ἀληθείᾳ với συνεργοὶ
  choice: “cho chân lý,” tức cùng góp phần phục vụ công cuộc của chân lý
  alternative: “với chân lý” hoặc “trong chân lý”
  rationale: Ngữ cảnh nói đến việc hỗ trợ những người ra đi vì Danh; cách dịch chính làm rõ rằng người tiếp đón họ dự phần vào công việc phục vụ chân lý. Tuy nhiên, cách ba trong tiếng Hy Lạp vẫn có thể mang sắc thái đồng hành hoặc phạm vi, nên các khả năng ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. “Có bổn phận” giữ sắc thái nghĩa vụ đạo đức; “tiếp đón” phù hợp ngữ cảnh hiếu khách hơn từ chung chung “tiếp nhận.” Mọi khả năng quan trọng của cách ba τῇ ἀληθείᾳ được giữ trong chú thích thay vì bị giải quyết dứt khoát.
