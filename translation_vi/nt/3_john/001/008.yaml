    rationale: “Lưu hành” thường dùng cho văn bản, tiền tệ hoặc sản phẩm. Ngữ cảnh nói về người phục vụ di chuyển từ nơi này sang nơi khác; “đi đây đó” hoặc “lưu động” phù hợp hơn.
