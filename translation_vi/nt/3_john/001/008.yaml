    rationale: Cấu trúc này có thể hiểu được nhưng mang tính dịch sát và nặng nề. “Trở thành những người cộng tác” tự nhiên hơn, đồng thời vẫn phản ánh γινώμεθα (“trở thành”) và συνεργοί (“những người cùng làm việc/cộng tác viên”).
  - severity: low
