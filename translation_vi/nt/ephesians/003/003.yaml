source:
  edition: SBLGNT
  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: vi
  text: ấy là nhờ sự mặc khải mà mầu nhiệm đã được tỏ cho tôi biết[a], như tôi đã viết vắn tắt trước đây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo sự mặc khải” hoặc “qua sự mặc khải.” Nguyên văn động từ: “đã được làm cho tôi biết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong ít lời” hoặc “bằng vài lời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: nhờ sự mặc khải
  rationale: Diễn đạt tự nhiên phương cách mà điều ấy được cho biết, đồng thời giữ danh từ ἀποκάλυψις và không xác định quá mức tác nhân.
- source_word: ἐγνωρίσθη μοι
  choice: đã được tỏ cho tôi biết
  rationale: Giữ sắc thái bị động của γνωρίζω và ý nghĩa ‘được làm cho biết’, tránh đồng nhất hoàn toàn động từ này với ‘mặc khải’ vốn đã xuất hiện ngay trước đó.
- source_word: τὸ μυστήριον
  choice: mầu nhiệm
  rationale: Trong văn mạch Phao-lô, từ này chỉ ý định thần thượng trước kia ẩn giấu nay được bày tỏ; ‘mầu nhiệm’ giữ được phạm trù thần học mà chưa giải thích nội dung vượt quá câu.
- source_word: καθὼς
  choice: như
  rationale: Liên từ so sánh ngắn gọn, tự nhiên, nối lời khẳng định này với phần tác giả đã viết trước.
- source_word: προέγραψα
  choice: tôi đã viết ... trước đây
  rationale: Thể hiện nghĩa viết trước đó trong chính bức thư, không đưa vào những nghĩa khác có thể có của προγράφω nhưng không thích hợp ở đây.
- source_word: ἐν ὀλίγῳ
  choice: vắn tắt
  rationale: Diễn đạt tự nhiên ý viết ngắn gọn hoặc bằng ít lời.
theological_decisions:
- issue: Ý nghĩa của μυστήριον trong cách dùng của Phao-lô
  choice: Giữ ‘mầu nhiệm’ như một ý định thần thượng trước kia ẩn giấu và nay được bày tỏ, không diễn giải nội dung ngay trong câu này.
  alternative: bí mật; kế hoạch ẩn giấu của Đức Chúa Trời
  rationale: Câu này nêu khái niệm nhưng chưa định nghĩa đầy đủ; giải thích thành nội dung cụ thể sẽ đưa thông tin từ văn mạch kế cận vào bản văn.
- issue: Tác nhân của động từ bị động ἐγνωρίσθη
  choice: Giữ cấu trúc bị động ‘đã được tỏ cho tôi biết’.
  alternative: Đức Chúa Trời đã tỏ cho tôi biết
  rationale: Văn mạch gợi ý tác nhân thần thượng, nhưng câu Hy Lạp không nêu tác nhân; bản dịch không nên bổ sung rõ điều bản văn để ngầm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc mở đầu ‘ấy là’ phản ánh rằng câu này tiếp nối cú pháp từ câu trước. Dùng ‘mầu nhiệm’ theo lối viết chuẩn hiện đại và giữ sự cô đọng của nguyên văn.
