  source_fidelity: Bản dịch giữ đúng quan hệ phương tiện/phương cách của κατὰ ἀποκάλυψιν (“nhờ sự mặc khải”), thể bị động và người tiếp nhận của ἐγνωρίσθη μοι (“đã được tỏ cho tôi biết”), và không thêm tác nhân. “Mầu nhiệm” chuyển đạt τὸ μυστήριον phù hợp cách dùng Phao-lô mà không giải nghĩa vượt câu. “Như tôi đã viết vắn tắt trước đây” phản ánh đúng καθὼς προέγραψα ἐν ὀλίγῳ.
  naturalness: Văn phong trang trọng, hiện đại và dễ hiểu. Mở đầu “ấy là” là một mảnh cú pháp có chủ ý, phù hợp với việc câu 3 tiếp nối lập luận/cú pháp của câu trước; không cần làm tròn thành một câu độc lập vì như thế có thể làm mờ liên kết nguyên văn.
  terminology: “Sự mặc khải,” “mầu nhiệm,” và “tỏ cho tôi biết” nhất quán với thuật ngữ thần học phổ biến trong tiếng Việt, đồng thời tránh đồng nhất động từ γνωρίζω với danh từ ἀποκάλυψις. Chính tả “mầu nhiệm” là cách dùng chuẩn và thông dụng.
