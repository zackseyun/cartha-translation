id: EPH.3.6
reference: Ephesians 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: vi
  text: ấy là các dân ngoại[a] là những người đồng thừa kế, cùng thuộc về một thân thể[c], và cùng dự phần vào lời hứa trong Đấng Mê-si-a Giê-su[b] nhờ Tin Mừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các dân tộc.” Ở đây, từ này nói cụ thể đến những người không phải Do Thái được bao gồm cùng với dân Y-sơ-ra-ên trong lời hứa cứu chuộc của Đức Chúa Trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách dịch truyền thống: “trong Đấng Christ Giê-su.” Từ Hy Lạp Χριστός được dịch ở đây là “Đấng Mê-si-a” để giữ rõ ý nghĩa danh hiệu.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “cùng là những chi thể của một thân thể.”'
    reason: previous_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong ngữ cảnh này, từ này chỉ những người không thuộc dân Do Thái đang được đón nhận cùng với họ, chứ không chủ yếu nói về các quốc gia theo nghĩa địa chính trị.
- source_word: συγκληρονόμα
  choice: được cùng thừa hưởng
  rationale: Giữ ý của tiền tố σύν về việc cùng chia sẻ một cơ nghiệp, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: σύσσωμα
  choice: cùng thuộc về một thân thể
  rationale: 'Diễn đạt hình ảnh hiếm và cô đọng của từ Hy Lạp: các bên được hợp lại trong cùng một thân thể; cách dịch này không thêm từ ''chi thể'' vốn không hiện diện trực tiếp trong từ nguồn.'
- source_word: συμμέτοχα
  choice: cùng dự phần
  rationale: Giữ sự song hành của ba từ ghép có tiền tố σύν và diễn đạt rõ việc cùng chia sẻ một thực tại.
- source_word: τῆς ἐπαγγελίας
  choice: vào lời hứa
  rationale: Danh từ sở hữu cách phụ thuộc vào συμμέτοχα; tiếng Việt tự nhiên dùng 'dự phần vào lời hứa' mà vẫn giữ số ít của nguyên bản.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός theo lực danh hiệu trong lập luận về lời hứa cứu chuộc, đồng thời giữ giới từ ἐν.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: nhờ Tin Mừng
  rationale: διά với sở hữu cách chỉ phương tiện; 'nhờ' diễn đạt tự nhiên phương tiện qua đó các dân ngoại dự phần.
- source_word: εἶναι
  choice: ấy là ... được
  rationale: Cụm nguyên mẫu tiếp nối câu trước để giải thích nội dung của mầu nhiệm; 'ấy là' nối tự nhiên với ngữ cảnh tiếng Việt.
theological_decisions:
- issue: Χριστῷ nên được thể hiện như danh hiệu hay dạng gần với tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su / Christ Jesus
  rationale: Trong ngữ cảnh lời hứa của Đức Chúa Trời được ứng nghiệm và mở rộng đến các dân ngoại, lực danh hiệu của Χριστός vẫn nổi bật; 'Đấng Mê-si-a' làm rõ nghĩa mà không áp đặt một hệ phái.
- issue: Đối tượng của τὰ ἔθνη
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Mạch văn nói cụ thể đến người không phải Do Thái được cùng dự phần với dân Do Thái; 'các dân ngoại' bảo toàn sự đối chiếu này.
- issue: Mức độ khai triển ẩn dụ σύσσωμα
  choice: cùng thuộc về một thân thể
  alternative: cùng là chi thể của một thân thể
  rationale: Lựa chọn chính giữ hình ảnh 'cùng một thân thể' nhưng không đưa 'chi thể' vào câu như thể đó là thành tố từ vựng minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Ba vế dùng lặp từ “cùng” để tái hiện nhịp điệu của ba từ ghép Hy Lạp có tiền tố σύν. “Tin Mừng” là cách gọi phổ thông, trang trọng của εὐαγγέλιον trong tiếng Việt.
