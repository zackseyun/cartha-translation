  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: vi
  text: Trong Đấng ấy, chúng ta có sự mạnh dạn và quyền đến gần, với sự tin cậy, nhờ đức tin nơi Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ sự thành tín của Ngài.” Cụm từ Hy Lạp có thể chỉ đức tin hướng đến Ngài hoặc sự thành tín của chính Ngài.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Đấng ấy
  rationale: Đại từ quan hệ giống đực số ít quy chiếu tự nhiên về Đấng Christ trong ngữ cảnh trước; cách dịch này giữ sắc thái ở trong Đấng Christ.
- source_word: παρρησίαν
  choice: lòng dạn dĩ
  rationale: Diễn đạt sự mạnh dạn, cởi mở và không sợ hãi, đồng thời không nhập nghĩa với πεποίθησις ở phần sau.
- source_word: προσαγωγὴν
  choice: được đến gần Đức Chúa Trời
  rationale: Từ này chỉ việc được tiếp cận hay vào trong sự hiện diện của Đức Chúa Trời. Bổ sung đối tượng hàm ẩn từ ngữ cảnh để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: ἐν πεποιθήσει
  choice: với niềm tin chắc
  rationale: 'Diễn tả cách thức đến gần: trong sự tin tưởng vững vàng; cách nói này tự nhiên trong tiếng Việt và vẫn phân biệt với lòng dạn dĩ.'
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: nhờ đức tin nơi Ngài
  rationale: Hiểu αὐτοῦ theo sở hữu cách khách thể, tức đức tin hướng đến Đấng Christ; sự mơ hồ với cách hiểu sở hữu cách chủ thể được giữ trong chú thích.
theological_decisions:
- issue: Cách hiểu διὰ τῆς πίστεως αὐτοῦ
  choice: nhờ đức tin nơi Ngài
  alternative: nhờ sự thành tín của Ngài
  rationale: Cấu trúc sở hữu cách có thể nói về đức tin đặt nơi Đấng Christ hoặc sự thành tín của chính Ngài. Bản văn chính theo cách hiểu khách thể phổ biến trong ngữ cảnh nói về việc các tín hữu được đến gần, nhưng không loại bỏ cách hiểu chủ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đấng ấy” giữ tham chiếu mang tính ngôi vị về Đấng Christ; “Đức Chúa Trời” được nêu rõ như đối tượng hàm ẩn của việc đến gần.
