revisions:
- from: Trong Đấng ấy, chúng ta có lòng dạn dĩ và được đến gần Đức Chúa Trời với niềm tin chắc, nhờ đức tin nơi Ngài.[a]
  to: Trong Đấng ấy, chúng ta có sự mạnh dạn và quyền đến gần, với sự tin cậy, nhờ đức tin nơi Ngài.[a]
  rationale: Bản sửa bỏ phần bổ sung đối tượng không được nêu trong tiếng Hy Lạp, đồng thời dùng “quyền đến gần” cho προσαγωγή và duy trì sự phân biệt giữa sự mạnh dạn với sự tin cậy. Chú thích tiếp tục bảo lưu sự mơ hồ có thật của διὰ τῆς πίστεως αὐτοῦ.
  reviewer_model: gpt-5.6-terra
