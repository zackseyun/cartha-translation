    rationale: “Hẳn anh chị em đã nghe” biến mệnh đề điều kiện thành xác quyết; ghi chú không hoàn toàn bù lại thay đổi này. “Nếu quả thật” vừa sát nguyên văn vừa tự nhiên.
  - severity: medium
    issue: “Được giao cho tôi” không phản ánh rõ việc “ân điển” là điều được ban.
    rationale: τῆς δοθείσης là phân từ bị động giống cái số ít, bổ nghĩa cho χάριτος. Dùng “đã được ban cho tôi” phản ánh chính xác hơn đối tượng và động từ của nguyên văn.
