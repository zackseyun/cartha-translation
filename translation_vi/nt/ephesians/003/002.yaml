base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: vi
  text: Nếu quả thật anh chị em đã nghe về việc quản lý ân điển của Đức Chúa Trời đã được ban cho tôi vì anh chị em[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “hẳn anh chị em đã nghe.” Tiếng Hy Lạp dùng hình thức điều kiện, dù trong ngữ cảnh Phao-lô dường như xem điều này là đúng.'
    reason: alternative_reading
  - marker: b
    text: “Việc quản lý” cũng có thể dịch là “việc quản trị” hoặc “sứ mạng được giao.” Từ Hy Lạp chỉ việc quản lý hay điều hành điều đã được giao phó.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: hẳn ... đã
  rationale: Diễn đạt giả định tu từ mà Phao-lô xem là đúng trong ngữ cảnh, đồng thời ghi chú bảo lưu hình thức điều kiện của tiếng Hy Lạp.
- source_word: ἠκούσατε
  choice: đã nghe
  rationale: Thì quá khứ tự nhiên trong tiếng Việt, trình bày việc nghe như một sự kiện trọn vẹn.
- source_word: οἰκονομίαν
  choice: trách nhiệm quản lý
  rationale: Nêu rõ ý một công việc quản trị được giao phó, phù hợp với vai trò Phao-lô nhận lãnh; các khả năng “việc quản trị” và “sứ mạng” được bảo lưu trong chú thích.
- source_word: χάριτος τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: Giữ thuật ngữ thần học quen thuộc “ân điển” và quan hệ sở hữu/nguồn gốc của cụm sở hữu cách.
- source_word: τῆς δοθείσης μοι
  choice: được giao cho tôi
  rationale: Giữ thể bị động và sắc thái được ban/giao phó; về ngữ pháp, phân từ có thể gắn trực tiếp với “ân điển”, còn trong mạch văn nó liên hệ mật thiết với trách nhiệm quản lý.
- source_word: εἰς ὑμᾶς
  choice: vì anh chị em
  rationale: Diễn đạt hướng đến lợi ích của người đọc bằng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được giao trong cụm “trách nhiệm quản lý ân điển”
  choice: Trình bày đây là trách nhiệm quản lý liên quan đến ân điển Đức Chúa Trời, được giao cho Phao-lô vì người đọc.
  alternative: Hiểu οἰκονομία chủ yếu là kế hoạch hay sự sắp đặt cứu rỗi của chính Đức Chúa Trời.
  rationale: Ngữ cảnh gần nhấn mạnh chức vụ được giao cho Phao-lô đối với các dân ngoại; cách dịch vẫn không tách trách nhiệm ấy khỏi kế hoạch rộng lớn của Đức Chúa Trời.
- issue: Sắc thái của εἴ γε
  choice: Dùng “hẳn” để thể hiện một giả định tu từ được mong đợi là đúng.
  alternative: Dịch sát hình thức điều kiện là “nếu quả thật”.
  rationale: Ngữ cảnh cho thấy Phao-lô dường như không thật sự nghi ngờ người đọc đã nghe biết, nhưng chú thích vẫn bảo lưu sự mơ hồ do cấu trúc điều kiện trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς. Trật tự dấu chú thích [a][b] theo điểm xuất hiện của vấn đề trong câu.
