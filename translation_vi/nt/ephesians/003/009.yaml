reference: Ephesians 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φωτίσαι ⸀πάντας τίς ἡ οἰκονομία τοῦ μυστηρίου τοῦ ἀποκεκρυμμένου ἀπὸ τῶν αἰώνων ἐν τῷ θεῷ τῷ τὰ πάντα ⸀κτίσαντι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/009.yaml
  text: and to bring to light for everyone what is the administration of the mystery hidden from the ages in God[a], who created all things[b],
translation:
  language: vi
  text: và làm sáng tỏ cho mọi người biết sự quản trị của mầu nhiệm là gì—mầu nhiệm đã được giấu kín từ bao đời[b] trong Đức Chúa Trời, Đấng tạo dựng muôn vật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng đã tạo dựng muôn vật.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “từ các thời đại”; cũng có thể hiểu là “suốt bao thời đại”, hoặc diễn giải mạnh hơn là “từ muôn thuở”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωτίσαι
  choice: làm sáng tỏ
  rationale: Giữ hình ảnh ánh sáng của động từ Hy Lạp, đồng thời diễn đạt tự nhiên việc khiến điều từng kín giấu trở nên rõ ràng.
- source_word: πάντας
  choice: cho mọi người
  rationale: Diễn đạt tự nhiên phạm vi phổ quát hướng đến con người của πάντας.
- source_word: τίς ἡ οἰκονομία
  choice: cách mầu nhiệm ấy được thực hiện
  rationale: οἰκονομία có thể chỉ sự quản trị, sắp đặt hoặc kế hoạch triển khai. Cách dịch này truyền đạt ý về việc mầu nhiệm được đưa vào thực hiện mà không biến danh từ thành một thuật ngữ hệ phái.
- source_word: μυστηρίου
  choice: mầu nhiệm
  rationale: Giữ thuật ngữ quen thuộc trong văn mạch Phao-lô về mục đích của Đức Chúa Trời trước kia kín giấu nhưng nay được bày tỏ; sâu hơn nghĩa một bí mật thông thường.
- source_word: τοῦ ἀποκεκρυμμένου
  choice: đã được giấu kín
  rationale: Thể hoàn thành bị động cho thấy một sự che giấu trước đó dẫn đến trạng thái kín giấu; tiếng Việt này giữ được cả ý bị động lẫn trạng thái kết quả.
- source_word: ἀπὸ τῶν αἰώνων
  choice: từ bao đời
  rationale: Cách nói tự nhiên trong tiếng Việt, vẫn giữ hình ảnh nhiều thời đại và tránh khẳng định rõ hơn nguyên văn rằng đó là từ cõi đời đời.
- source_word: ἐν τῷ θεῷ
  choice: trong Đức Chúa Trời
  rationale: Dịch trực tiếp giới từ ἐν, giữ nét nghĩa mầu nhiệm được giấu kín trong chính Đức Chúa Trời thay vì chỉ ở cùng Ngài.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: Đấng tạo dựng muôn vật
  rationale: Mệnh đề mô tả Đức Chúa Trời được chuyển thành cấu trúc tôn kính, tự nhiên trong tiếng Việt; muôn vật diễn đạt τὰ πάντα.
theological_decisions:
- issue: Nghĩa của οἰκονομία trong quan hệ với mầu nhiệm
  choice: cách mầu nhiệm ấy được thực hiện
  alternative: sự quản trị mầu nhiệm; sự quản nhiệm mầu nhiệm; kế hoạch về mầu nhiệm
  rationale: Cách dịch chính giữ trọng tâm nơi sự triển khai hoặc quản trị mầu nhiệm, nhưng không áp đặt một hệ thống thần học kỹ thuật về các thời kỳ. Chú thích bảo tồn các khả năng từ vựng khác.
- issue: Sức nặng thời gian của ἀπὸ τῶν αἰώνων
  choice: từ bao đời
  alternative: từ các thời đại; suốt bao thời đại; từ muôn thuở
  rationale: Nguyên văn nói đến các thời đại, không nói minh nhiên đến cõi đời đời. Bản dịch dùng lối nói tự nhiên nhưng chú thích giữ khả năng dịch sát hơn và phân biệt với cách hiểu mạnh hơn là từ muôn thuở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Làm sáng tỏ” giữ ẩn dụ ánh sáng; dấu gạch ngang giúp người đọc nhận ra mệnh đề giải thích cho “mầu nhiệm”. “Đức Chúa Trời” và “Đấng” được dùng nhất quán theo văn phong Kinh Thánh tiếng Việt trang trọng.
