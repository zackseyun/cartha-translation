base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: vi
  text: để Ngài ban cho anh chị em, theo sự phong phú của vinh quang Ngài, được làm cho mạnh mẽ nhờ quyền năng, qua Thánh Linh của Ngài, trong con người bên trong[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hướng vào con người bên trong.” Tiếng Hy Lạp dùng giới từ có thể nhấn mạnh đích mà sự thêm sức hướng tới; cụm “con người bên trong” chỉ bản ngã nội tâm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δῷ ὑμῖν
  choice: để Ngài ban cho anh chị em
  rationale: ἵνα với động từ giả định nêu nội dung đồng thời mang sắc thái mục đích của lời cầu nguyện; “để Ngài ban cho” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: theo sự phong phú của vinh quang Ngài
  rationale: κατά với đối cách chỉ chuẩn mực hoặc mức độ. “Theo” tránh hàm ý chỉ lấy ra một phần; “sự phong phú” diễn đạt πλοῦτος tự nhiên hơn “sự giàu có” khi bổ nghĩa cho vinh quang.
- source_word: δυνάμει κραταιωθῆναι
  choice: được thêm mạnh mẽ bằng quyền năng
  rationale: Giữ thể bị động của κραταιωθῆναι và chức năng phương tiện của δυνάμει, đồng thời dùng cách nói hiện đại, dễ hiểu.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: nhờ Thánh Linh của Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc tác nhân. Trong ngữ cảnh Phao-lô, πνεῦμα ở đây chỉ Thánh Linh của Đức Chúa Trời.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: trong con người bên trong
  rationale: Cụm từ chỉ bản ngã hoặc phương diện nội tâm. “Con người bên trong” giữ hình ảnh ἄνθρωπος mà không tạo nghĩa chỉ riêng nam giới; “trong” diễn đạt tự nhiên đích hoặc phạm vi của sự làm cho mạnh mẽ.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεῦμα
  choice: Thánh Linh của Ngài
  alternative: thần linh của Ngài hoặc ảnh hưởng thần linh không mang tính ngôi vị
  rationale: Ngữ cảnh nói đến tác nhân thần linh làm tín hữu mạnh mẽ, và cách dùng của Phao-lô ủng hộ mạnh mẽ việc hiểu đây là Thánh Linh của Đức Chúa Trời.
- issue: Cách hiểu ἔσω ἄνθρωπον
  choice: con người bên trong
  alternative: nội tâm; con người nội tại
  rationale: Bản dịch giữ hình ảnh nhân học của nguyên văn và tính đại diện, không giới hạn theo giới tính, nhưng không xác định quá mức bản chất chính xác của phương diện nội tâm này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμῖν theo cách bao gồm cả cộng đồng. Câu được giữ ở dạng mệnh đề phụ vì câu 16 tiếp nối lời cầu nguyện bắt đầu ở câu trước.
