  - severity: low
    issue: “Sự am tường” hơi không tự nhiên
    rationale: Cụm này có thể dùng, nhưng “sự hiểu biết sâu sắc” là cách nói hiện đại, rõ nghĩa hơn cho σύνεσις.
  - severity: low
