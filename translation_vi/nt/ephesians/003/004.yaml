  to: Nhờ đọc điều này, anh chị em có thể hiểu được sự hiểu biết sâu sắc của tôi về mầu nhiệm của Đấng Mê-si-a.[a]
  rationale: Điều chỉnh nhẹ để làm rõ phương tiện của việc đọc, dùng cách diễn đạt tự nhiên hơn cho σύνεσις, và dùng “mầu nhiệm” theo thuật ngữ Kinh Thánh Việt ngữ thông dụng. Không thay đổi ý nghĩa, tính mơ hồ của sở hữu cách, hay lựa chọn dịch Χριστός là “Đấng Mê-si-a.”
