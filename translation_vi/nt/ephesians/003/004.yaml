source:
  edition: SBLGNT
  text: πρὸς ὃ δύνασθε ἀναγινώσκοντες νοῆσαι τὴν σύνεσίν μου ἐν τῷ μυστηρίῳ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/004.yaml
  text: By reading this[a], you are able to understand my insight into the mystery of Messiah,
translation:
  language: vi
  text: Nhờ đọc điều này, anh chị em có thể hiểu được sự hiểu biết sâu sắc của tôi về mầu nhiệm của Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có thể được dịch là “Đấng Mê-si-a,” hoặc theo cách gọi truyền thống là “Đấng Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ ... ἀναγινώσκοντες
  choice: Khi đọc điều này
  rationale: πρὸς ὃ liên kết với điều Phao-lô vừa viết, còn phân từ ἀναγινώσκοντες nêu hoàn cảnh hoặc phương tiện để độc giả hiểu. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ mối liên hệ hồi chỉ.
- source_word: δύνασθε
  choice: anh chị em có thể
  rationale: Động từ chỉ khả năng. Đại từ xưng hô số nhiều này phù hợp với lời gửi cho cộng đồng tín hữu và tự nhiên trong tiếng Việt hiện đại.
- source_word: νοῆσαι
  choice: hiểu được
  rationale: νοέω ở đây nói đến việc nhận biết hoặc nắm bắt bằng trí; “hiểu được” rõ nghĩa và tự nhiên.
- source_word: τὴν σύνεσίν μου
  choice: sự am tường của tôi
  rationale: σύνεσις chỉ sự hiểu biết sâu sắc hoặc khả năng thấu hiểu. “Sự am tường” tránh lặp từ “hiểu” mà vẫn giữ sắc thái nhận thức.
- source_word: ἐν τῷ μυστηρίῳ
  choice: về huyền nhiệm
  rationale: ἐν xác định phạm vi hay đối tượng của sự am tường. Sau danh từ này, “về” là cách kết hợp tự nhiên trong tiếng Việt; “huyền nhiệm” diễn đạt điều trước kia kín giấu nay được Đức Chúa Trời bày tỏ, không hàm ý một câu đố đơn thuần.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Χριστός là tước hiệu tương ứng với “Đấng Mê-si-a/Đấng được xức dầu.” Ở đây cách dịch theo tước hiệu bảo toàn nội dung từ nguyên và chức năng thần học.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cụm “huyền nhiệm của Χριστός,” từ này vẫn có thể được hiểu như một tước hiệu. Bản chính dùng “Đấng Mê-si-a” để truyền đạt ý nghĩa ấy; cách gọi truyền thống “Đấng Christ” được giữ trong chú thích.
- issue: Quan hệ của τοῦ Χριστοῦ với μυστηρίῳ
  choice: huyền nhiệm của Đấng Mê-si-a
  alternative: huyền nhiệm liên quan đến Đấng Mê-si-a
  rationale: Nguyên văn dùng sở hữu cách và không xác định dứt khoát đó là huyền nhiệm thuộc về, do, hay liên quan đến Đấng Mê-si-a. Giữ cấu trúc “của” bảo toàn độ mở này.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng độc giả số nhiều; dùng “huyền nhiệm” theo nghĩa mặc khải từng được giấu kín, phù hợp văn mạch thư Ê-phê-sô.
