    rationale: “Nhỏ bé” có thể gợi tuổi tác, vóc dáng, hoặc tầm quan trọng nói chung. “Thấp kém nhất” phù hợp hơn với lời tự nhận mình là kẻ thấp nhất giữa các thánh.
