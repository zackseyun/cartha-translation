source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: vi
  text: Ân điển này đã được ban cho tôi—là người thấp kém nhất trong tất cả các thánh đồ[a]—để rao truyền cho dân ngoại[b] sự phong phú không thể dò thấu của Đấng Mê-si-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “người thấp kém hơn cả người thấp kém nhất trong tất cả các thánh đồ.” Dạng từ Hy Lạp bất thường nhấn mạnh sự tự hạ mình của Phao-lô.'
    reason: lexical_alternative
  - marker: b
    text: Hay “các dân tộc.” Trong ngữ cảnh này, từ Hy Lạp nhiều khả năng chỉ dân ngoại, tức những người không phải dân Do Thái.
    reason: lexical_alternative
  - marker: c
    text: Hay “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng được xức dầu” và có thể được dịch là “Đấng Mê-si-a” hoặc gọi theo truyền thống là “Đấng Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: người nhỏ bé nhất
  rationale: Dạng nhấn mạnh bất thường này diễn tả sự tự hạ mình tột bậc của Phao-lô. Cách dịch này tự nhiên trong tiếng Việt hiện đại; chú thích giữ lại lối diễn đạt sát mặt chữ hơn.
- source_word: ἁγίων
  choice: các thánh đồ
  rationale: Trong cách dùng của Phao-lô, từ này chỉ những người thuộc về Đức Chúa Trời và được biệt riêng cho Ngài. “Các thánh đồ” ngắn gọn, quen thuộc và không hàm ý một tầng lớp tín hữu đặc biệt.
- source_word: χάρις
  choice: ân điển
  rationale: Ở đây từ này vừa chỉ ân huệ Đức Chúa Trời ban nhưng không, vừa bao hàm nhiệm vụ được giao cho Phao-lô; “ân điển” duy trì mối liên hệ thần học và từ vựng trong các thư Phao-lô.
- source_word: ἔθνεσιν
  choice: dân ngoại
  rationale: Trong ngữ cảnh này, từ này chủ yếu chỉ những người không phải dân Do Thái, chứ không đơn thuần là các quốc gia theo nghĩa chính trị.
- source_word: εὐαγγελίσασθαι
  choice: rao truyền ... Tin Mừng về
  rationale: Động từ có nghĩa loan báo tin mừng. Cấu trúc tiếng Việt này vừa làm rõ nội dung tốt lành của lời công bố, vừa nối tự nhiên với đối tượng theo sau trong tiếng Hy Lạp.
- source_word: ἀνεξιχνίαστον
  choice: không thể dò thấu
  rationale: Cách dịch giữ hình ảnh về điều không thể lần theo hay khám phá đến tận cùng, đồng thời rõ nghĩa với độc giả hiện đại.
- source_word: πλοῦτος
  choice: sự phong phú
  rationale: Danh từ số ít được dùng theo nghĩa ẩn dụ về nguồn dồi dào vô hạn nơi Đấng Mê-si-a. “Sự phong phú” tự nhiên hơn “của cải” trong ngữ cảnh này và không gợi chủ yếu đến tài sản vật chất.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός ở đây mang giá trị tước hiệu, chỉ Đấng được xức dầu. Dịch nghĩa là “Đấng Mê-si-a” bảo tồn chức năng tước hiệu thay vì xử lý như một tên riêng.
theological_decisions:
- issue: Cách hiểu χάρις trong lời kêu gọi của Phao-lô
  choice: Giữ “ân điển” và để mệnh đề mục đích cho thấy ân điển ấy bao gồm sứ mạng rao truyền
  alternative: Dịch là “đặc ân” hoặc “ơn được giao”
  rationale: Bản Hy Lạp không tách ân huệ cứu độ khỏi nhiệm vụ được ban; “ân điển” bảo tồn độ rộng và sức căng ấy.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong câu này, Χριστός có thể được nghe như tước hiệu hoặc cách gọi đã gần với tên riêng. Bản chính dịch ý nghĩa của tước hiệu, còn chú thích ghi cách gọi truyền thống để không loại bỏ khả năng thứ hai.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu được sắp xếp lại theo cú pháp tiếng Việt để làm rõ người nhận ân điển và mục đích của ân điển, không xóa bỏ mối liên hệ giữa ân điển với sứ mạng. “Không thể dò thấu” giữ hình ảnh của nguyên ngữ; “sự phong phú” tránh sắc thái thuần vật chất của “của cải.”
