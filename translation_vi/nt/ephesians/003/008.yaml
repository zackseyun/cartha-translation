  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: ân điển được ban cho Phao-lô, sự tự hạ mình trước toàn thể các thánh, sứ mạng hướng đến dân ngoại, và sự phong phú không thể dò thấu thuộc về Đấng Mê-si-a. Tuy nhiên, việc thêm danh ngữ viết hoa “Tin Mừng” làm đối tượng trực tiếp có thể khiến câu được hiểu là rao truyền một “Tin Mừng về” sự phong phú, trong khi nguyên ngữ dùng động từ “loan báo tin mừng” trực tiếp với “sự phong phú không thể dò thấu.” Bản sửa tránh thêm một đối tượng kỹ thuật không có trong câu Hy Lạp.'
  naturalness: Câu sửa dùng dấu gạch ngang để đóng khung lời tự hạ mình của Phao-lô và dùng “rao truyền cho dân ngoại sự phong phú...” để giữ quan hệ trực tiếp giữa động từ và đối tượng. “Người thấp kém nhất” tự nhiên hơn “người nhỏ bé nhất” trong lời tự đánh giá của người trưởng thành và diễn đạt rõ sắc thái hạ mình.
  terminology: Giữ “ân điển,” “dân ngoại,” “không thể dò thấu,” và “Đấng Mê-si-a.” “Các thánh đồ” vẫn là thuật ngữ quen dùng trong nhiều bản Kinh Thánh tiếng Việt, dù có sắc thái hội thánh; chú thích làm rõ lực nhấn mạnh của dạng so sánh bất thường. Chú thích về Χριστός giữ hợp lý phương án truyền thống “Đấng Christ.”
