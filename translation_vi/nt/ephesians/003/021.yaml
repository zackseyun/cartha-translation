source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: vi
  text: Nguyện vinh quang thuộc về Ngài trong Hội Thánh và trong Đấng Mê-si-a[a] Giê-su, qua mọi thế hệ cho đến đời đời vô cùng. A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ Giê-su”. Từ Hy Lạp Χριστός là một tước hiệu, có nghĩa là “Đấng được xức dầu”.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: Nguyện vinh quang thuộc về Ngài
  rationale: Câu Hy Lạp không có động từ và mang tính tôn vinh; cách diễn đạt này chuyển tải tự nhiên ý nguyện cầu hoặc quy vinh, mà không xác định quá mức sắc thái vốn hàm ẩn.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: trong Hội Thánh
  rationale: Giữ giới từ ἐν là “trong” và dùng cách gọi quen thuộc, trang trọng cho cộng đồng dân Chúa.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: và trong Đấng Mê-si-a Giê-su
  rationale: Giữ cấu trúc song song với “trong Hội Thánh”; dịch Χριστός như một tước hiệu có ý nghĩa và phiên âm tên Ἰησοῦ.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: trải qua mọi thế hệ
  rationale: Diễn đạt sự kéo dài xuyên suốt tất cả các thế hệ bằng tiếng Việt tự nhiên.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Thành ngữ tôn vinh quen thuộc trong tiếng Việt, truyền đạt thời gian vô tận thay vì dịch sát tối nghĩa là “thời đại của các thời đại”.
- source_word: ἀμήν
  choice: A-men
  rationale: Phiên âm nghi lễ quen thuộc của lời xác nhận kết thúc bài tôn vinh.
theological_decisions:
- issue: Χριστός được hiểu như tước hiệu hay yếu tố gần như tên riêng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Dịch rõ ý nghĩa tước hiệu “Đấng được xức dầu”, đồng thời chú thích cách gọi truyền thống để người đọc nhận biết thuật ngữ tương đương.
- issue: Sắc thái của mệnh đề tôn vinh không có động từ
  choice: Nguyện vinh quang thuộc về Ngài
  alternative: Vinh quang thuộc về Ngài
  rationale: “Nguyện” phản ánh cách hiểu chúc tụng thường thấy, nhưng không thêm một chủ thể hay hành động thần học ngoài công thức tôn vinh của nguyên bản.
translation_notes:
  register: Văn phong tôn nghiêm nhưng hiện đại; duy trì nhịp điệu của lời tôn vinh và cấu trúc song song “trong Hội Thánh và trong Đấng Mê-si-a Giê-su”. Dùng “Ngài” theo lối kính ngữ thông dụng trong văn bản Cơ Đốc tiếng Việt.
