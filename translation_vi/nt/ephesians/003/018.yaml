id: EPH.3.18
reference: Ephesians 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ἐξισχύσητε καταλαβέσθαι σὺν πᾶσιν τοῖς ἁγίοις τί τὸ πλάτος καὶ μῆκος καὶ ⸂ὕψος καὶ βάθος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: vi
  text: để anh chị em có đủ sức thấu hiểu, cùng với tất cả các thánh đồ, chiều rộng, chiều dài, chiều cao và chiều sâu là thế nào[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp không nói rõ bốn chiều kích này mô tả điều gì; nhiều người hiểu ý này được hoàn tất ở câu kế tiếp bằng tình yêu của Đấng Christ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn tả mục đích hoặc kết quả của lời cầu nguyện ở phần trước một cách tự nhiên trong tiếng Việt.
- source_word: ἐξισχύσητε
  choice: anh chị em có đủ sức
  rationale: Giữ ý về sức lực hay khả năng đầy đủ để thực hiện điều được nêu trong động từ nguyên mẫu theo sau.
- source_word: καταλαβέσθαι
  choice: thấu hiểu
  rationale: Diễn đạt việc nắm bắt sâu sắc bằng tâm trí, vừa tự nhiên vừa giữ sắc thái trang trọng của ngữ cảnh.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: cùng với tất cả các thánh đồ
  rationale: Giữ ý cùng tham dự của σύν và thuật ngữ quen thuộc của Phao-lô dành cho những người thuộc về Đức Chúa Trời.
- source_word: τί
  choice: là thế nào
  rationale: Tạo câu hỏi gián tiếp tự nhiên trong tiếng Việt mà không thêm ý diễn giải như “lớn lao biết bao”.
- source_word: τὸ πλάτος
  choice: chiều rộng
  rationale: Tương đương trực tiếp và hiện đại của thuật ngữ chỉ kích thước πλάτος.
- source_word: μῆκος
  choice: chiều dài
  rationale: Tương đương trực tiếp, tự nhiên của thuật ngữ chỉ kích thước.
- source_word: ὕψος
  choice: chiều cao
  rationale: Tương đương trực tiếp của thuật ngữ chỉ kích thước.
- source_word: βάθος
  choice: chiều sâu
  rationale: Tương đương trực tiếp của thuật ngữ chỉ kích thước.
theological_decisions:
- issue: Đối tượng được mô tả bằng bốn chiều kích
  choice: Không nêu đối tượng trong chính văn, đúng như câu Hy Lạp.
  alternative: Thêm “tình yêu của Đấng Christ” hoặc “kế hoạch cứu rỗi của Đức Chúa Trời”.
  rationale: Bản Hy Lạp không nói rõ các chiều kích này thuộc về điều gì. Thêm đối tượng sẽ giải quyết thay người đọc một điểm được để mở và có thể được khai triển ở câu kế tiếp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm thể hiện cộng đồng người nhận; dùng “thánh đồ” để giữ thuật ngữ Phao-lô quen thuộc. Trật tự bốn chiều kích được bảo toàn.
