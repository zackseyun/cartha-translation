lexical_decisions:
- source_word: κατὰ
  choice: theo
  rationale: Diễn đạt sự phù hợp với một mục đích, tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: πρόθεσιν
  choice: mục đích
  rationale: Chỉ ý định có chủ tâm của Đức Chúa Trời; giữ được sắc thái thần học mà không diễn giải quá mức thành một kế hoạch chi tiết.
- source_word: τῶν αἰώνων
  choice: đời đời
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian của thành ngữ sở hữu cách số nhiều; cách nói sát chữ hơn là “của các thời đại” được ghi ở chú thích.
- source_word: ἣν
  choice: mà
  rationale: Đại từ quan hệ quy chiếu về “mục đích”; “mà” là cấu trúc tự nhiên trong tiếng Việt.
- source_word: ἐποίησεν
  choice: đã thực hiện
  rationale: Trong kết hợp với “mục đích”, ποιέω mang ý nghĩa đưa mục đích vào thực tế; “thực hiện” rõ ràng mà không khẳng định quá mức sắc thái hoàn tất tuyệt đối.
- source_word: ἐν
  choice: trong
  rationale: Giữ nghĩa trực tiếp của giới từ và để ngỏ khả năng sắc thái công cụ; cách hiểu “qua” được nêu trong chú thích.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Χριστός ở đây mang chức năng tước hiệu; “Đấng Mê-si-a” chuyển tải ý nghĩa và bối cảnh Do Thái của tước hiệu.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Phiên âm tên riêng theo lối viết tiếng Việt hiện đại, dễ đọc.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Cách dịch trang trọng, quen thuộc của κύριος trong ngữ cảnh Tân Ước.
- source_word: ἡμῶν
  choice: chúng ta
  rationale: Đại từ sở hữu được diễn đạt tự nhiên sau danh từ trong cụm “Chúa chúng ta”.
theological_decisions:
- issue: Ý nghĩa của τῶν αἰώνων trong πρόθεσιν τῶν αἰώνων
  choice: mục đích đời đời
  alternative: mục đích của các thời đại
  rationale: “Đời đời” là cách diễn đạt tự nhiên trong tiếng Việt đối với ý nghĩa thường được hiểu của cụm từ, còn chú thích bảo tồn cấu trúc Hy Lạp sát chữ để người đọc thấy được tính đa nghĩa.
- issue: Sắc thái của ἐν τῷ Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  alternative: qua Đấng Mê-si-a Giê-su
  rationale: “Trong” bảo tồn giới từ ἐν và không âm thầm quyết định rằng nó chỉ phương tiện; cách hiểu công cụ được ghi nhận trong chú thích.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Từ này hoạt động như một tước hiệu; “Đấng Mê-si-a” làm rõ ý nghĩa của tước hiệu thay vì để nó giống một thành phần của tên riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc câu tự nhiên trong tiếng Việt. “Đấng Mê-si-a” giữ chức năng tước hiệu; “Giê-su” dùng chính tả phiên âm dễ tiếp cận. Các chú thích bảo tồn cách nói sát chữ và sự không xác định của giới từ Hy Lạp.
