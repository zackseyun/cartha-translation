id: EPH.3.20
reference: Ephesians 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: vi
  text: Còn Đấng có thể làm vượt xa mọi điều chúng ta cầu xin hay nghĩ đến[b], một cách vô cùng dư dật[a], theo quyền năng đang hoạt động trong chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dồi dào vượt quá” hoặc “vượt quá mọi mức độ”; từ Hy Lạp nhấn mạnh mạnh mẽ việc vượt xa những gì được cầu xin hay nghĩ đến.
    reason: lexical_alternative
  - marker: b
    text: “Nghĩ đến” cũng có thể dịch là “hình dung”, nhấn mạnh điều tâm trí có thể nhận thức hoặc tưởng tượng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ δὲ δυναμένῳ
  choice: Còn Đấng có thể
  rationale: “Đấng có thể” diễn đạt tự nhiên phân từ có mạo từ dùng như danh từ; “còn” thể hiện sự chuyển ý nhẹ của δέ mà không biến nó thành ý tương phản mạnh. Không thêm danh từ “Đức Chúa Trời”, vì câu Hy Lạp chỉ hàm chỉ Đấng ấy và câu 21 mới hoàn tất lời tôn vinh.
- source_word: ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ
  choice: làm vượt quá vô cùng mọi điều
  rationale: Cách diễn đạt này giữ cả động từ đơn giản ποιῆσαι (“làm”) lẫn sức nhấn mạnh đặc biệt của ὑπερεκπερισσοῦ, đồng thời rõ ràng trong tiếng Việt hiện đại.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: chúng ta cầu xin hay nghĩ đến
  rationale: αἰτούμεθα là “cầu xin” trong ngữ cảnh hướng về Đức Chúa Trời; νοοῦμεν chỉ hoạt động nhận thức hoặc điều tâm trí có thể hình dung, nên “nghĩ đến” giữ được nghĩa rộng.
- source_word: κατὰ τὴν δύναμιν
  choice: theo quyền năng
  rationale: “Theo” bảo toàn sắc thái chuẩn mực hoặc mức độ của κατά, thay vì thu hẹp thành phương tiện đơn thuần như “bởi”.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: đang hoạt động trong chúng ta
  rationale: Thì hiện tại của phân từ diễn tả quyền năng đang tác động hữu hiệu; “trong chúng ta” là nghĩa trực tiếp nhất và không loại trừ chiều kích cộng đồng.
theological_decisions:
- issue: Đấng nhận lời tôn vinh được hàm chỉ
  choice: Đấng có thể
  alternative: Đức Chúa Trời, Đấng có thể
  rationale: Ngữ cảnh xác định Đấng ấy là Đức Chúa Trời, nhưng câu Hy Lạp không lặp lại danh xưng. Bản dịch không thêm danh từ thần học vắng mặt trong câu.
- issue: Quyền năng hoạt động nơi các tín hữu
  choice: quyền năng đang hoạt động trong chúng ta
  alternative: quyền năng đang hoạt động giữa chúng ta
  rationale: “Trong chúng ta” giữ nghĩa tự nhiên của ἐν ἡμῖν và khẳng định quyền năng hữu hiệu nơi cộng đồng tín hữu mà không áp đặt một cách giải thích hệ phái về phương thức hoạt động ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu được giữ kết thúc bằng dấu phẩy vì đây là phần đầu của lời tôn vinh, về mặt cú pháp sẽ được hoàn tất ở câu 21. Các từ “Còn” và “Đấng” giúp duy trì sự nối tiếp ấy trong tiếng Việt.
