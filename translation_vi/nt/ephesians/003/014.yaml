id: EPH.3.14
reference: Ephesians 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: vi
  text: Vì lý do đó, tôi quỳ gối trước Cha,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Vì lý do đó
  rationale: Cụm thành ngữ này nêu lý do cho hành động tiếp theo và nối lại mạch tư tưởng trước đó; cách dịch này tự nhiên, rõ ràng và giữ nguyên liên kết diễn ngôn.
- source_word: κάμπτω τὰ γόνατά μου
  choice: tôi quỳ gối
  rationale: Nghĩa đen là “tôi uốn/cong đầu gối mình,” nhưng tiếng Việt hiện đại diễn đạt tư thế ấy tự nhiên bằng “quỳ gối.” Cách dịch vẫn giữ hình ảnh đầu gối và tư thế cầu nguyện, tránh câu gượng “cong đầu gối.”
- source_word: πρὸς
  choice: trước
  rationale: Trong ngữ cảnh cầu nguyện hướng về một thân vị, “trước” diễn đạt tự nhiên tư thế quỳ trong sự hiện diện của Đấng được cầu nguyện. “Với” hoặc “hướng về” sát hình thức hơn nhưng kém tự nhiên trong câu tiếng Việt này.
- source_word: τὸν πατέρα
  choice: Cha
  rationale: Ngữ cảnh xác định đây là Đức Chúa Trời được Phao-lô hướng lời cầu nguyện đến. Tiếng Việt dùng “Cha” như danh xưng trực tiếp, tự nhiên và trang trọng; không cần mạo từ tương ứng với τὸν.
theological_decisions:
- issue: Có nên dịch πατέρα như một danh hiệu thần học hay danh từ chung
  choice: Cha
  alternative: người cha
  rationale: Ngữ cảnh là lời cầu nguyện hướng đến Đức Chúa Trời, và câu kế tiếp tiếp tục khai triển hình ảnh phụ tử. Viết hoa “Cha” thể hiện đúng đối tượng quy chiếu mà không thêm nội dung ngoài bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quỳ gối” được ưu tiên hơn lối dịch máy móc “cong đầu gối,” vì đây là thành ngữ tự nhiên trong tiếng Việt mà vẫn bảo toàn hình ảnh thân thể của nguyên văn.
