revisions:
- from: và nhận biết tình yêu của Đấng Mê-si—tình yêu vượt quá sự hiểu biết—[a] để anh chị em được đầy dẫy, đạt đến mọi sự viên mãn của Đức Chúa Trời.[b]
  to: và nhận biết tình yêu của Đấng Mê-si vượt quá sự hiểu biết,[a] để anh chị em được đầy dẫy cho đến mọi sự viên mãn của Đức Chúa Trời.[b]
  rationale: Sửa cụm cuối để “được đầy dẫy” vẫn là vị ngữ duy nhất, còn “cho đến mọi sự viên mãn” biểu lộ chức năng hướng đích của εἰς. Đồng thời bỏ sự lặp lại có tính giải thích trong mệnh đề về tình yêu; các chú thích vẫn giữ đúng vị trí và chức năng.
