language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: vi
  text: và nhận biết tình yêu của Đấng Mê-si vượt quá sự hiểu biết,[a] để anh chị em được đầy dẫy cho đến mọi sự viên mãn của Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “tình yêu của Đấng Mê-si” có thể được hiểu là tình yêu Đấng Mê-si dành cho chúng ta; về mặt ngữ pháp, cũng có thể chỉ tình yêu dành cho Đấng Mê-si.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “để anh chị em được đầy dẫy mọi sự viên mãn của Đức Chúa Trời.” Nguyên văn dùng một giới từ chỉ hướng tới mục tiêu, tạo nên một cách diễn đạt cô đọng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: nhận biết
  rationale: Giữ nghĩa trực tiếp của γινώσκω, đồng thời trong ngữ cảnh lời cầu nguyện có thể bao hàm cả sự nhận biết bằng trải nghiệm chứ không chỉ tri thức.
- source_word: τε
  choice: và
  rationale: Liên kết nhẹ động từ nguyên mẫu này với các lời cầu xin đứng trước; “và” là tự nhiên trong tiếng Việt.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: vượt quá sự hiểu biết
  rationale: Bảo tồn nghịch lý có chủ ý giữa việc “nhận biết” và một tình yêu vượt quá khả năng hiểu biết.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: tình yêu của Đấng Mê-si
  rationale: Giữ nguyên cấu trúc sở hữu chưa được phân giải của tiếng Hy Lạp; Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả trong tiếng Việt.
- source_word: πληρωθῆτε
  choice: anh chị em được đầy dẫy
  rationale: Phản ánh thể bị động và số nhiều; “anh chị em” biểu thị rõ đối tượng được nói đến bằng lối xưng hô hiện đại, trang trọng.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: đạt đến mọi sự viên mãn của Đức Chúa Trời
  rationale: “Đạt đến” truyền đạt hướng tiến tới mục tiêu của εἰς tự nhiên hơn cách dịch sát chữ “cho đến”; vẫn giữ nguyên cụm thần học cô đọng “mọi sự viên mãn của Đức Chúa Trời”.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός vẫn mang giá trị tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
- issue: Quan hệ sở hữu trong ἀγάπην τοῦ Χριστοῦ
  choice: tình yêu của Đấng Mê-si
  alternative: tình yêu Đấng Mê-si dành cho chúng ta; tình yêu dành cho Đấng Mê-si
  rationale: Cấu trúc tiếng Hy Lạp không tự nó xác định dứt khoát chiều hướng của tình yêu. Bản dịch chính giữ sự mơ hồ, dù ngữ cảnh nghiêng về tình yêu của Đấng Mê-si dành cho các tín hữu.
- issue: Ý nghĩa của εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: được đầy dẫy, đạt đến mọi sự viên mãn của Đức Chúa Trời
  alternative: được đầy dẫy mọi sự viên mãn của Đức Chúa Trời
  rationale: Cách dịch chính bảo tồn sắc thái hướng tới mục tiêu của εἰς và tránh biến cụm từ thành một bổ ngữ đơn giản chỉ vật được đổ đầy; chú thích ghi nhận cách hiểu truyền thống.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng “tình yêu vượt quá sự hiểu biết” bổ nghĩa cho “tình yêu của Đấng Mê-si”, đồng thời giữ nghịch lý tu từ. “Đầy dẫy” duy trì sắc thái Kinh Thánh quen thuộc nhưng vẫn thông dụng; “đạt đến” diễn đạt tự nhiên lực hướng đích của εἰς.
