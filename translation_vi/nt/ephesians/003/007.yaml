source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: vi
  text: Tôi đã trở thành người phục vụ của phúc âm ấy, theo ân tứ của ân điển Đức Chúa Trời được ban cho tôi, theo sự vận hành của quyền năng Ngài—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi đã được lập làm người phục vụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: phúc âm ấy
  rationale: Đại từ quan hệ sở hữu giống trung, số ít, quy chiếu về εὐαγγέλιον ở câu trước. Tiếng Việt cần nêu lại danh từ để câu tự nhiên và rõ nghĩa.
- source_word: ἐγενήθην
  choice: tôi đã trở thành
  rationale: Diễn đạt nghĩa thông dụng của γίνομαι ở thì bất định, nhấn mạnh việc Phao-lô bước vào vai trò này mà không loại bỏ sắc thái thụ động có thể có.
- source_word: διάκονος
  choice: người phục vụ
  rationale: Giữ nghĩa chức năng là người phục vụ, tránh tự động hiểu đây là chức vụ giáo hội về sau như ‘chấp sự’.
- source_word: κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ
  choice: theo ân tứ của ân điển Đức Chúa Trời
  rationale: Giữ cấu trúc κατά và chuỗi sở hữu, đồng thời phân biệt δωρεά là ân tứ với χάρις là ân điển.
- source_word: τῆς δοθείσης μοι
  choice: đã ban cho tôi
  rationale: Phân từ thụ động bổ nghĩa cho ân điển; ‘ban’ thể hiện tự nhiên tính chất quà tặng và ngầm giữ Đức Chúa Trời là tác nhân.
- source_word: κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ
  choice: theo sự vận hành của quyền năng Ngài
  rationale: ‘Sự vận hành’ diễn đạt hoạt động hữu hiệu của ἐνέργεια, còn ‘quyền năng’ là cách dịch quen thuộc và chính xác của δύναμις.
theological_decisions:
- issue: Bản chất vai trò διάκονος của Phao-lô
  choice: người phục vụ
  alternative: người thi hành chức vụ; chấp sự
  rationale: Ngữ cảnh nói đến sự phục vụ phúc âm, không xác định một chức danh chính thức trong cơ cấu hội thánh.
- issue: Sắc thái tác nhân trong ἐγενήθην
  choice: tôi đã trở thành
  alternative: tôi đã được lập làm
  rationale: Cách dịch chính giữ cách nói tự nhiên và độ mở của động từ; các cụm nói về ân điển và quyền năng Đức Chúa Trời vẫn cho thấy nguồn gốc thần thượng của sự phục vụ này.
- issue: Quan hệ giữa δωρεά và χάρις
  choice: ân tứ của ân điển Đức Chúa Trời
  alternative: ân tứ là ân điển Đức Chúa Trời; ân tứ do ân điển Đức Chúa Trời
  rationale: Cụm sở hữu Hy Lạp có thể gợi ân tứ bắt nguồn từ hoặc mang nội dung ân điển; giữ cấu trúc sở hữu tránh giải quyết quá mức mối quan hệ này.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng ‘Đức Chúa Trời’, ‘ân điển’, ‘quyền năng’ theo vốn từ Kinh Thánh Tin Lành quen thuộc; ‘người phục vụ’ tránh sắc thái chức danh giáo phẩm. Dấu gạch ngang cuối câu được giữ vì câu Hy Lạp tiếp tục sang ý kế tiếp.
