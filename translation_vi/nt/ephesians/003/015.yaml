  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶσα πατριὰ ἐν οὐρανοῖς καὶ ἐπὶ γῆς ὀνομάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/015.yaml
  text: from whom every family in heaven and on earth is named,[a]
translation:
  language: vi
  text: từ Đấng mà mọi gia tộc trên trời và trên đất đều được gọi tên,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ Đấng mà toàn thể gia đình trên trời và trên đất được gọi tên”; hoặc, theo lối diễn giải hơn: “từ Đấng mà mọi tư cách làm cha trên trời và trên đất nhận tên gọi.”'
    reason: Bảo lưu hai cách hiểu khả dĩ của πᾶσα πατριά—một gia đình toàn thể hoặc khái niệm tư cách làm cha—và sắc thái nguồn gốc trong ἐξ οὗ cùng ὀνομάζεται.
lexical_decisions:
- source_word: ἐξ οὗ
  choice: là Đấng mà ... được đặt tên theo
  rationale: 'Cụm ἐξ với đại từ quan hệ sở hữu cách diễn tả nguồn gốc: “từ Đấng ấy.” Trong tiếng Việt, kết cấu “Đấng mà ... được đặt tên theo” tự nhiên hơn và kết hợp rõ với động từ bị động ὀνομάζεται, nhưng không diễn giải mạnh thành “bắt nguồn từ.”'
- source_word: πᾶσα
  choice: mọi
  rationale: Đi với danh từ số ít πατριά, πᾶσα có thể mang nghĩa phân phối “mỗi/mọi” hoặc nghĩa toàn thể. “Mọi” giữ cách hiểu phân phối có khả năng cao hơn, đồng thời phương án “toàn thể” được ghi ở chú thích.
- source_word: πατριά
  choice: gia tộc
  rationale: πατριά chỉ một nhóm gia đình, dòng họ hay thị tộc. “Gia tộc” chuyển tải phạm vi rộng hơn gia đình hạt nhân và vẫn dễ hiểu trong tiếng Việt; nó cũng không biến lối chơi chữ với πατήρ ở câu trước thành khái niệm trừu tượng “tư cách làm cha.”
- source_word: ἐν οὐρανοῖς
  choice: trên trời
  rationale: Dù οὐρανοῖς ở số nhiều, “trên trời” là cách nói địa điểm tự nhiên trong tiếng Việt để chỉ cõi trời.
- source_word: ἐπὶ γῆς
  choice: dưới đất
  rationale: “Dưới đất” tạo cặp đối xứng tự nhiên với “trên trời” và diễn đạt đúng vị trí trên mặt đất; không hàm ý ở bên dưới lòng đất.
- source_word: ὀνομάζεται
  choice: được đặt tên theo
  rationale: Động từ hiện tại bị động có nghĩa trực tiếp là “được gọi/được đặt tên.” Thêm “theo” thể hiện quan hệ nguồn gọi tên với ἐξ οὗ trong tiếng Việt mà chưa diễn giải thành một tuyên bố đầy đủ về nguồn gốc bản thể.
theological_decisions:
- issue: Ý nghĩa của πᾶσα πατριά trong quan hệ với “Cha” ở câu trước
  choice: mọi gia tộc
  alternative: toàn thể gia đình; mọi tư cách làm cha
  rationale: Bản dịch chính giữ nghĩa thông thường của πατριά là một cộng đồng thân tộc và hiểu πᾶσα theo nghĩa phân phối. Cách này không vội xác định rằng Phao-lô chỉ nói đến một gia đình duy nhất, cũng không trừu tượng hóa lối chơi chữ πατήρ–πατριά thành “mọi tư cách làm cha.” Các khả năng còn lại được bảo lưu trong chú thích.
- issue: Sắc thái nguồn gốc trong quan hệ giữa ἐξ οὗ và ὀνομάζεται
  choice: được đặt tên theo Đấng ấy
  alternative: nhận tên mình từ Đấng ấy; bắt nguồn tên gọi từ Đấng ấy
  rationale: “Được đặt tên theo” giữ hình ảnh gọi tên và quan hệ nguồn gốc mà không khẳng định quá mức cơ chế thần học hàm chứa trong câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “gia tộc” để tránh thu hẹp πατριά thành gia đình hạt nhân; dùng cặp tự nhiên “trên trời và dưới đất.” Đại từ tôn kính “Đấng” phù hợp vì đại từ quan hệ chỉ Đức Chúa Cha ở câu trước.
