  naturalness: «Từ Đấng mà mọi gia tộc trên trời và trên đất đều được gọi tên» là văn phong trang trọng, tự nhiên trong ngữ cảnh câu phụ thuộc vào câu 14, đồng thời phản ánh rõ hơn quan hệ nguồn gốc của nguyên ngữ. «Trên trời và trên đất» tránh nét nghĩa không mong muốn của «dưới đất».
  terminology: «Gia tộc» là lựa chọn phù hợp cho πατριά, rộng hơn gia đình hạt nhân. «Đấng» phù hợp với quy chiếu về Đức Chúa Cha ở câu trước, không thêm diễn giải giáo phái.
