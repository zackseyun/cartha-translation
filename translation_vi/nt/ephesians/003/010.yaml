id: EPH.3.10
reference: Ephesians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα γνωρισθῇ νῦν ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις ἐν τοῖς ἐπουρανίοις διὰ τῆς ἐκκλησίας ἡ πολυποίκιλος σοφία τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: vi
  text: để giờ đây, qua Hội Thánh, sự khôn ngoan muôn hình muôn vẻ của Đức Chúa Trời được biết đến bởi các bậc cai trị và các thế lực trong cõi trời[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các bậc cai trị và các thế lực trong cõi trời” có lẽ chỉ những quyền lực thuộc linh hoặc vũ trụ, chứ không chỉ các nhà cầm quyền của loài người.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “ở những nơi trên trời”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα γνωρισθῇ
  choice: để ... được bày tỏ
  rationale: ἵνα nêu mục đích, còn γνωρισθῇ là thể bị động; cách dịch này giữ cả quan hệ mục đích lẫn ý nghĩa làm cho điều gì được biết đến.
- source_word: νῦν
  choice: giờ đây
  rationale: Diễn đạt trực tiếp sắc thái thời gian hiện tại, đồng thời phù hợp với văn phong trang trọng tự nhiên.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: cho các bậc cai trị và các thế lực
  rationale: 'Giữ hai danh từ phân biệt: ἀρχαί chỉ những lực lượng có địa vị cai trị, còn ἐξουσίαι chỉ các quyền lực hay thế lực có thẩm quyền. Ngữ cảnh cõi trời cho thấy đây là các quyền lực siêu phàm, nhưng chính văn không xác định cụ thể hơn.'
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: trong cõi trời
  rationale: Diễn tả lĩnh vực thuộc trời theo cách gọn và tự nhiên, không làm cụm từ mang tính địa điểm cụ thể quá mức.
- source_word: διὰ τῆς ἐκκλησίας
  choice: qua Hội Thánh
  rationale: διά với sở hữu cách chỉ phương tiện; “qua” giữ rõ ý Đức Chúa Trời dùng Hội Thánh làm phương tiện bày tỏ.
- source_word: ἡ πολυποίκιλος σοφία τοῦ θεοῦ
  choice: sự khôn ngoan muôn hình muôn vẻ của Đức Chúa Trời
  rationale: πολυποίκιλος mô tả sự đa dạng phong phú, nhiều mặt; thành ngữ “muôn hình muôn vẻ” dễ hiểu và giữ được hình ảnh nguyên ngữ.
theological_decisions:
- issue: Danh tính của “các bậc cai trị và các thế lực”
  choice: Giữ cách gọi rộng trong chính văn, với chú thích cho biết ngữ cảnh hướng đến các quyền lực thuộc linh hoặc vũ trụ.
  alternative: Các nhà cai trị và giới cầm quyền của loài người; hoặc một phạm vi bao gồm cả quyền lực trần thế lẫn thuộc trời.
  rationale: Cụm từ này trong văn chương Phao-lô, đặc biệt khi đi với “trong cõi trời”, nghiêng mạnh về các quyền lực siêu phàm. Tuy nhiên, chính văn không thêm “thiên sứ” hay phân loại thiện ác, nhằm tránh giải quyết quá mức điều nguyên ngữ chưa nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Hội Thánh” cho ἐκκλησία và “Đức Chúa Trời” cho θεός. Trật tự câu được điều chỉnh nhẹ cho tự nhiên nhưng vẫn giữ mạch mục đích, phương tiện, nội dung được bày tỏ và đối tượng tiếp nhận của nguyên ngữ.
