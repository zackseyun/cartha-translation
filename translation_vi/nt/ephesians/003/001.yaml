  - severity: low
    issue: Cụm đồng vị “những người thuộc dân ngoại” hơi nặng và chưa rõ liên hệ trực tiếp với “anh chị em.”
    rationale: “anh chị em thuộc các dân ngoại” là cách nói gọn, hiện đại, và biểu thị trực tiếp rằng τῶν ἐθνῶν bổ nghĩa/đồng vị với ὑμῶν.
