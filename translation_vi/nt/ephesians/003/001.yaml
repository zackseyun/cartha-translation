source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: vi
  text: Vì lý do đó, tôi, Phao-lô, tù nhân của Đấng Mê-si-a Jêsus vì anh chị em thuộc các dân ngoại[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì anh chị em là dân ngoại.”'
    reason: τῶν ἐθνῶν đồng vị với “anh chị em”; tiếng Việt có thể diễn đạt quan hệ này bằng “thuộc các dân ngoại” hoặc bằng mệnh đề “là dân ngoại.”
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Vì lý do đó
  rationale: Cụm này nối với lập luận trước và nêu lý do cho điều Phao-lô sắp nói; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được lực suy luận.
- source_word: ἐγὼ Παῦλος
  choice: tôi là Phao-lô
  rationale: Đại từ được nêu rõ tạo điểm nhấn; cấu trúc “tôi là Phao-lô” truyền đạt tự nhiên sự tự xưng trong tiếng Việt.
- source_word: ὁ δέσμιος
  choice: tù nhân
  rationale: Danh từ chỉ người đang bị giam giữ; “tù nhân” trực tiếp hơn cách diễn giải “người đang mang xiềng xích”.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: của Đấng Mê-si-a Jêsus
  rationale: Χριστός được giữ như một tước hiệu mang nghĩa “Đấng Mê-si-a”, còn Ἰησοῦ được phiên âm như tên riêng. Giới từ sở hữu “của” giữ được khả năng hiểu Phao-lô thuộc về và phục vụ Đấng Mê-si-a, thay vì chỉ quy tác nhân gây tù đày.
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh chị em
  rationale: Trong ngữ cảnh này, ὑπέρ diễn tả sự chịu khổ vì lợi ích hoặc vì cớ người nhận thư. “Vì anh chị em” tự nhiên và không thu hẹp nghĩa vào sự đại diện pháp lý.
- source_word: τῶν ἐθνῶν
  choice: những người thuộc dân ngoại
  rationale: Cụm này đồng vị với “anh chị em” và chỉ những người không phải Do Thái, chứ không nói về các quốc gia theo nghĩa địa chính trị.
theological_decisions:
- issue: Χριστοῦ nên được thể hiện như tước hiệu hay như một phần tên gọi quen dùng
  choice: Đấng Mê-si-a Jêsus
  alternative: Đấng Christ Jêsus
  rationale: Trong nguyên văn, Χριστός vẫn mang nội dung tước hiệu. Bản dịch chính chuyển nghĩa tước hiệu thay vì đối xử với từ này như một họ; cách gọi truyền thống không được đưa vào chính văn để tránh che khuất ý nghĩa ấy.
- issue: Quan hệ sở hữu trong “tù nhân của Đấng Mê-si-a Jêsus”
  choice: Giữ nguyên cách nói “của”
  alternative: tù nhân vì Đấng Mê-si-a Jêsus
  rationale: Sở hữu cách τοῦ có thể gợi ý Phao-lô là tù nhân thuộc về hoặc phục vụ Đấng Mê-si-a, trong khi thực tế ông bị giam do sự phục vụ ấy. Không nên buộc câu chỉ mang một trong hai sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận thư gồm cả nam lẫn nữ. Dấu gạch ngang cuối câu được giữ lại vì câu Hy Lạp bị ngắt và ý sẽ được tiếp nối ở các câu sau.
