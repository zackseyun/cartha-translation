id: EPH.3.17
reference: Ephesians 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: vi
  text: để Đấng Mê-si-a[a] ngự trong lòng anh chị em nhờ đức tin[b], là những người đã được bén rễ và lập nền vững chắc trong tình yêu[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa “Đấng Mê-si-a,” tức Đấng được xức dầu.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp πίστις cũng có thể mang nghĩa “lòng tin” hoặc “sự trung tín,” nhưng “đức tin” phù hợp nhất ở đây.
    reason: lexical_alternative
  - marker: c
    text: Cụm từ “trong tình yêu” được hiểu tự nhiên nhất là bổ nghĩa cho “đã được bén rễ và lập nền vững chắc”; một số người lại nối cụm từ này với “ngự trong lòng anh chị em.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: ngự
  rationale: Diễn tả việc cư ngụ bền vững, thích hợp với chủ thể là Đấng Mê-si-a và giữ sắc thái trang trọng; động từ nguyên mẫu phụ thuộc vào lời cầu xin ở câu trước.
- source_word: τὸν Χριστόν
  choice: Đấng Mê-si-a
  rationale: Chuyển nghĩa tước hiệu Χριστός thay vì chỉ phiên âm; mạo từ và cú pháp tại đây phù hợp với cách hiểu như một tước hiệu.
- source_word: διὰ τῆς πίστεως
  choice: nhờ đức tin
  rationale: Nhờ diễn đạt phương tiện một cách tự nhiên; đức tin là nghĩa phù hợp nhất của πίστις trong văn cảnh này.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng anh chị em
  rationale: Lòng là cách diễn đạt tự nhiên trong tiếng Việt về con người nội tâm, không chỉ riêng cảm xúc; anh chị em thể hiện số nhiều của ὑμῶν.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu
  rationale: Giữ giới từ và hình ảnh về môi trường trong đó người tin được bén rễ và lập nền; tình yêu là cách dịch trực tiếp, tự nhiên của ἀγάπη.
- source_word: ἐρριζωμένοι
  choice: đã được bén rễ
  rationale: Thể hoàn thành bị động chỉ một hành động đã xảy ra với kết quả còn tiếp diễn; cách nói này giữ hình ảnh nông nghiệp.
- source_word: τεθεμελιωμένοι
  choice: lập nền vững chắc
  rationale: Giữ hình ảnh kiến trúc đi đôi với hình ảnh bén rễ, đồng thời truyền đạt trạng thái đã được thiết lập trên nền móng.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Dịch ý tước hiệu giúp bảo tồn nghĩa Đấng được xức dầu mà không áp đặt một cách hiểu hệ phái.
- issue: Ý nghĩa của πίστις trong διὰ τῆς πίστεως
  choice: nhờ đức tin
  alternative: nhờ lòng tin; nhờ sự trung tín
  rationale: Trong cấu trúc này, đức tin của người tin được hiểu tự nhiên nhất là phương tiện để Đấng Mê-si-a ngự trong lòng họ; các nghĩa khác của πίστις ít phù hợp hơn nhưng vẫn được ghi nhận.
- issue: Phạm vi bổ nghĩa của ἐν ἀγάπῃ
  choice: gắn với “đã được bén rễ và lập nền vững chắc”
  alternative: gắn với “ngự trong lòng anh chị em”
  rationale: Trật tự từ và mạch cú pháp nghiêng về việc tình yêu là môi trường của hai hình ảnh bén rễ và lập nền, nhưng câu Hy Lạp vẫn cho phép cách nối khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều và giọng văn cộng đồng. Giữ nguyên hai ẩn dụ nông nghiệp và kiến trúc, đồng thời giữ dấu phẩy cuối câu vì đây là phần tiếp nối của một câu dài hơn.
