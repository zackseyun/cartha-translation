id: EPH.3.5
reference: Ephesians 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: vi
  text: là điều mà trong các thế hệ khác không được cho con cái loài người biết như hiện nay đã được mặc khải cho các sứ đồ thánh và các nhà tiên tri thánh của Ngài trong Thánh Linh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cho loài người”; nguyên văn Hy Lạp là “cho các con trai của loài người.”
    reason: lexical_alternative
  - marker: b
    text: Hay “bởi Thánh Linh”; cụm từ Hy Lạp có thể chỉ phạm vi hoặc phương tiện.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: là điều
  rationale: Đại từ quan hệ giống trung liên kết với “mầu nhiệm” ở câu trước; “là điều” giữ mạch cú pháp tiếng Việt mà không lặp lại rõ tiền ngữ.
- source_word: ἑτέραις γενεαῖς
  choice: trong các thế hệ khác
  rationale: Hiểu cách ba theo nghĩa thời gian và phản ánh trực tiếp ἑτέραις là “khác”, thay vì diễn giải thành “trước kia”.
- source_word: οὐκ ἐγνωρίσθη
  choice: đã không được tỏ ... biết
  rationale: Giữ thể bị động và ý nghĩa khiến cho biết/công bố của γνωρίζω; cách nói này tự nhiên và trang trọng trong tiếng Việt.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: cho con cái loài người
  rationale: Giữ hình ảnh thành ngữ theo sát nguyên văn nhưng dùng “con cái” tự nhiên hơn “các con trai” trong tiếng Việt; thành ngữ chỉ loài người nói chung.
- source_word: ὡς νῦν
  choice: như nay
  rationale: 'Giữ lực so sánh về cách thức hoặc mức độ: trước kia không được tỏ cho biết như hiện nay.'
- source_word: ἀπεκαλύφθη
  choice: được mặc khải
  rationale: Giữ thể bị động và thuật ngữ mặc khải quan trọng trong văn mạch Phao-lô.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: cho các sứ đồ thánh và các nhà tiên tri của Ngài
  rationale: “Thánh” được đặt sau “sứ đồ” theo tiếng Việt; cấu trúc Hy Lạp có thể hiểu tính từ chi phối cả hai nhóm, còn “của Ngài” tự nhiên nhất được hiểu thuộc về cả cụm phối hợp.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Văn mạch mặc khải nghiêng mạnh về Thánh Linh; “trong” giữ nguyên độ mở của ἐν giữa phạm vi và phương tiện.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματι
  choice: Thánh Linh
  alternative: tinh thần con người hoặc phương thức thuộc linh
  rationale: Văn mạch về sự mặc khải cho các sứ đồ và nhà tiên tri ủng hộ Thánh Linh; viết hoa thể hiện cách hiểu có xác suất cao nhất.
- issue: Sắc thái của ἐν trong ἐν πνεύματι
  choice: trong Thánh Linh
  alternative: bởi Thánh Linh
  rationale: “Trong” bảo tồn khả năng chỉ phạm vi hoặc sự hiệp thông, đồng thời chú thích nêu khả năng chỉ phương tiện/tác nhân, tránh giải quyết quá mức sự mơ hồ thật của giới từ.
- issue: Mức độ tương phản trong ὡς νῦν
  choice: không được tỏ cho biết như nay
  alternative: hoàn toàn không được biết trước đây
  rationale: ὡς tạo phép so sánh, có thể nói đến cách thức hoặc mức độ mặc khải; bản dịch không biến câu thành lời phủ nhận tuyệt đối mọi hiểu biết trước đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Con cái loài người” giữ sắc thái Kinh Thánh của thành ngữ nhưng không khiến người đọc hiểu sai là chỉ nam giới. “Ngài” viết hoa theo quy ước tiếng Việt để chỉ hữu thể thần linh, dù tiền ngữ cụ thể của αὐτοῦ được để theo văn mạch. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
