review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng mệnh đề quan hệ chỉ “mầu nhiệm” của câu trước, ý thời gian của ἑτέραις γενεαῖς, thể bị động của hai động từ, và lực so sánh của ὡς νῦν. Tuy nhiên, vị trí của “thánh” trong cụm phối hợp hiện tại có thể khiến người đọc hiểu rằng chỉ các sứ đồ là thánh, trong khi ἁγίοις bổ nghĩa cho cả sứ đồ lẫn nhà tiên tri.
  naturalness: “Đã không được tỏ cho ... biết” hơi nặng và “như nay” ít tự nhiên trong tiếng Việt hiện đại. “Không được cho ... biết như hiện nay đã được mặc khải” vẫn giữ thể bị động và phép so sánh, đồng thời trôi chảy hơn.
  terminology: “Mặc khải,” “sứ đồ,” “nhà tiên tri,” và “Thánh Linh” phù hợp văn phong Kinh Thánh hiện đại và văn mạch Phao-lô. Lặp lại “thánh” là cách an toàn, rõ ràng để biểu đạt tính từ Hy Lạp chi phối cả hai danh từ phối hợp.
  issues:
  - severity: medium
    issue: Phạm vi bổ nghĩa của “thánh” chưa rõ
    rationale: Trong “các sứ đồ thánh và các nhà tiên tri của Ngài”, trật tự tiếng Việt dễ gắn “thánh” riêng với “sứ đồ”. Nguyên văn τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις hiểu tự nhiên nhất là “các sứ đồ thánh và các nhà tiên tri thánh của Ngài”.
  - severity: low
    issue: Cách diễn đạt “tỏ cho ... biết” hơi gượng
    rationale: γνωρίζω ở bị động là “được cho biết/được tỏ ra”; “không được cho con cái loài người biết” tự nhiên hơn mà không làm mất ý khiến cho biết.
