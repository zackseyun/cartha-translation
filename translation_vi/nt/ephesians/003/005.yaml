revisions:
- from: là điều trong các thế hệ khác đã không được tỏ cho con cái loài người biết như nay được mặc khải cho các sứ đồ thánh và các nhà tiên tri của Ngài trong Thánh Linh.[a][b]
  to: là điều mà trong các thế hệ khác không được cho con cái loài người biết như hiện nay đã được mặc khải cho các sứ đồ thánh và các nhà tiên tri thánh của Ngài trong Thánh Linh.[a][b]
  rationale: Sửa tối thiểu để tiếng Việt tự nhiên hơn và để “thánh” được hiểu rõ là áp dụng cho cả hai nhóm. Bản sửa giữ liên kết quan hệ với “mầu nhiệm” ở câu trước, không biến sự tương phản ὡς νῦν thành phủ nhận tuyệt đối mọi sự hiểu biết trước đó, và giữ độ mở của ἐν πνεύματι qua “trong Thánh Linh” cùng chú thích phương án “bởi Thánh Linh”.
