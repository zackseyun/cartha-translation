source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: vi
  text: Vì thế, tôi xin anh chị em đừng nản lòng trước những hoạn nạn tôi chịu vì lợi ích của anh chị em; những hoạn nạn ấy là vinh quang của anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Những hoạn nạn ấy” chủ yếu chỉ những hoạn nạn Phao-lô chịu vì lợi ích của anh chị em; cách nói này cũng có thể bao quát rộng hơn sự chịu khổ của ông trong chức vụ vì họ.
    reason: referent_ambiguity
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Diễn đạt ngắn gọn quan hệ suy luận từ phần lập luận ngay trước đó.
- source_word: αἰτοῦμαι
  choice: tôi xin anh chị em
  rationale: Động từ mở đầu lời khẩn khoản của Phao-lô; thêm đối tượng hàm ẩn “anh chị em” để câu tiếng Việt tự nhiên và phù hợp với ngữ cảnh.
- source_word: μὴ ἐγκακεῖν
  choice: đừng nản lòng
  rationale: Diễn đạt đúng ý mất can đảm hoặc trở nên chán nản, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: vì những hoạn nạn tôi chịu
  rationale: Trong kết cấu này, ἐν chỉ nguyên nhân hoặc hoàn cảnh khiến người ta nản lòng. “Hoạn nạn” giữ được mức độ nghiêm trọng của θλῖψις; thêm “tôi chịu” làm rõ quan hệ sở hữu theo cách tự nhiên trong tiếng Việt.
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh chị em
  rationale: Giữ ý Phao-lô chịu hoạn nạn vì lợi ích của những người nhận thư mà không giải thích quá mức.
- source_word: ἥτις
  choice: điều đó
  rationale: Đại từ quy chiếu đến ý vừa nêu như một toàn thể, đồng thời không ép câu phải chỉ đến một danh từ riêng lẻ.
- source_word: δόξα ὑμῶν
  choice: vinh quang của anh chị em
  rationale: “Vinh quang” bảo tồn sức nặng thần học và tu từ của δόξα, thay vì thu hẹp nghĩa thành danh dự hay lý do để tự hào.
theological_decisions:
- issue: Chủ thể hàm ẩn của động từ nguyên mẫu μὴ ἐγκακεῖν
  choice: Hiểu người được xin đừng nản lòng là những người nhận thư.
  alternative: Có thể hiểu Phao-lô đang xin Chúa để chính ông không nản lòng.
  rationale: Ngữ cảnh trực tiếp và cách hiểu phổ biến của cú pháp ủng hộ việc những người nhận thư là chủ thể hàm ẩn; tuy vậy, nguyên văn không nêu chủ thể một cách minh thị, nên ghi nhận khả năng khác trong chú thích.
- issue: Sở chỉ của mệnh đề ἥτις ἐστὶν δόξα ὑμῶν
  choice: Dùng “điều đó” để quy chiếu chủ yếu đến những hoạn nạn Phao-lô chịu vì họ, được nhìn như một toàn thể.
  alternative: Mệnh đề có thể quy chiếu rộng hơn đến toàn bộ chức vụ và sự chịu khổ của Phao-lô vì họ.
  rationale: Những hoạn nạn là tiền ngữ gần nhất về ý nghĩa, nhưng đại từ quan hệ số ít sau danh từ số nhiều và mạch văn cho phép một sở chỉ khái quát hơn. Bản dịch tránh thu hẹp điều này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμῶν theo lối xưng hô bao quát, tự nhiên trong cộng đồng đức tin; “hoạn nạn” giữ sắc thái nghiêm trọng và phẩm cách của câu.
