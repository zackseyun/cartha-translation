revisions:
- from: Vì thế, tôi xin anh chị em đừng nản lòng[a] vì những hoạn nạn tôi chịu vì anh chị em; điều đó chính là vinh quang của anh chị em.[b]
  to: Vì thế, tôi xin anh chị em đừng nản lòng trước những hoạn nạn tôi chịu vì lợi ích của anh chị em; những hoạn nạn ấy là vinh quang của anh chị em.[b]
  rationale: Bản sửa loại bỏ chú thích ngữ pháp dễ gây hiểu lầm, làm mượt cách diễn đạt quan hệ ἐν ... ὑπέρ, và xác định rõ tiền ngữ trực tiếp của mệnh đề quan hệ mà không thu hẹp khả năng nó bao quát toàn bộ sự chịu khổ trong chức vụ của Phao-lô.
