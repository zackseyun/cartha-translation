  - severity: low
    issue: Vị trí chú thích trong bản dịch không tương ứng với các neo và lý do của bản tiếng Anh.
    rationale: Chú thích về Thi Thiên 8:6 nên neo sau “dưới chân Người”; chú thích về khả năng hiểu tặng cách τῇ ἐκκλησίᾳ là ‘vì lợi ích’ nên neo sau “hội thánh”. Điều này giúp người đọc nhận đúng cụm từ được chú giải.
