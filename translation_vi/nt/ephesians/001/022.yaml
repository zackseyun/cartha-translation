source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: vi
  text: Ngài đã khiến muôn vật phục dưới chân Người[a], và đã ban Người làm Đầu trên muôn vật cho hội thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách diễn đạt này gợi lại Thi Thiên 8:6, nơi muôn vật được đặt dưới chân người cai trị.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể hiểu: “vì lợi ích của hội thánh”; dạng tặng cách τῇ ἐκκλησίᾳ có thể chỉ bên hưởng lợi cũng như bên tiếp nhận.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: muôn vật
  rationale: Dạng trung tính số nhiều chỉ toàn thể mọi sự vật, bảo toàn tầm mức bao quát của câu; “muôn vật” tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὑπέταξεν
  choice: đã đặt ... dưới
  rationale: Cách dịch này vừa diễn đạt việc khiến muôn vật ở địa vị phục tùng, vừa kết hợp tự nhiên với hình ảnh “dưới chân” trong nguyên văn.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: dưới chân Người
  rationale: Giữ nguyên hình ảnh cụ thể về quyền thống trị và sự quy phục, đồng thời bảo toàn tiếng vọng Kinh Thánh từ Thi Thiên 8:6.
- source_word: αὐτὸν ἔδωκεν
  choice: ban Người
  rationale: Giữ nghĩa căn bản của δίδωμι là “ban/trao”, thay vì thu hẹp thành “lập” hay “bổ nhiệm”; đại từ tiếp tục chỉ về Đấng Christ theo văn cảnh.
- source_word: κεφαλὴν
  choice: làm Đầu
  rationale: Giữ ẩn dụ “đầu” của nguyên văn, biểu thị địa vị đứng đầu và quyền tối thượng mà không diễn giải quá mức.
- source_word: ὑπὲρ πάντα
  choice: trên muôn vật
  rationale: ὑπέρ tại đây diễn tả địa vị cao hơn hoặc quyền trên toàn thể muôn vật; cách dịch ngắn gọn này giữ được cả hình ảnh lẫn phạm vi phổ quát.
- source_word: τῇ ἐκκλησίᾳ
  choice: cho hội thánh
  rationale: “Cho” có thể diễn đạt hội thánh là bên tiếp nhận, đồng thời vẫn để ngỏ sắc thái hội thánh là bên được hưởng lợi; “hội thánh” là cách gọi quen thuộc, phù hợp văn cảnh Phao-lô.
theological_decisions:
- issue: Mối liên hệ giữa quyền làm Đầu của Đấng Christ, muôn vật và hội thánh
  choice: Đấng Christ được ban cho hội thánh trong tư cách là Đầu trên muôn vật.
  alternative: Đức Chúa Trời đặt Đấng Christ làm Đầu trên muôn vật vì lợi ích của hội thánh.
  rationale: Cú pháp gắn tự nhiên “làm Đầu” với “trên muôn vật”, còn τῇ ἐκκλησίᾳ có thể chỉ bên tiếp nhận hoặc bên hưởng lợi. Bản dịch chính và chú thích cùng bảo toàn quyền tối thượng phổ quát của Đấng Christ cũng như mối liên hệ đặc biệt với hội thánh, không buộc câu chỉ mang một sắc thái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho chủ thể thần linh và “Người” cho Đấng Christ để tránh lẫn hai đại từ trong cùng câu. Viết hoa “Đầu” nhằm làm rõ đây là tước vị ẩn dụ trong câu, không phải bộ phận cơ thể; vẫn giữ nguyên hình ảnh của nguyên văn.
