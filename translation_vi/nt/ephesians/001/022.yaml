  rationale: Sửa “đã đặt” thành “đã khiến ... phục” để chuyển tải chính xác sắc thái quy phục của ὑπέταξεν, nhưng vẫn giữ hình ảnh thành ngữ ‘dưới chân’. Sắp xếp lại mệnh đề thứ hai để “trên muôn vật” gắn trực tiếp với “Đầu”, còn “cho hội thánh” vẫn giữ độ mở của tặng cách—bên tiếp nhận hay bên hưởng lợi. Điều chỉnh neo chú thích theo đúng các cụm được giải thích.
