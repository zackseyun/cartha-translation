    rationale: “Ân điển vinh quang của Ngài” có thể mô tả ân điển là vinh quang. Tiếng Hy Lạp nói “vinh quang của ân điển của Ngài”; cần đặt “vinh quang” làm danh từ chính.
  - severity: low
    issue: Thiếu chú thích từ vựng cho ἐχαρίτωσεν và neo chú thích không tương ứng với hai chú thích của bản kiểm toán.
    rationale: Dù không phải lỗi cấu trúc, chú thích về cách dịch động từ cùng gốc với χάρις giúp minh bạch quyết định dịch; “Đấng Yêu Dấu” nên có neo chú thích riêng.
