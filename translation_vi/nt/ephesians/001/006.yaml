  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: vi
  text: để vinh quang của ân điển Ngài[a] được ca ngợi, tức là ân điển Ngài đã rộng ban cho chúng ta trong Đấng Yêu Dấu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ân điển mà Ngài đã ban ân huệ cho chúng ta” hoặc “ân điển mà Ngài đã ưu ái chúng ta.” Động từ Hy Lạp có cùng gốc với từ “ân điển,” diễn tả việc Đức Chúa Trời đã thi ân cho chúng ta.'
    reason: lexical_alternative
  - marker: b
    text: “Đấng Yêu Dấu” chỉ về Con, tức là Đấng Mê-si-a.
    reason: cross_reference
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: để ... được ca ngợi
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa mục đích/kết quả của εἰς trong thành ngữ này.
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: ân điển vinh quang của Ngài
  rationale: Giữ cả δόξα và χάρις, đồng thời dùng trật tự tiếng Việt tự nhiên; cụm từ mô tả ân điển của Đức Chúa Trời là vinh quang.
- source_word: ἐχαρίτωσεν
  choice: đã ban
  rationale: Trong ngữ cảnh, động từ chỉ hành động Đức Chúa Trời rộng ban ân huệ; tiếng Việt không có một động từ tự nhiên cùng gốc với “ân điển”, nên dùng “ban” và lặp lại “ân điển” để làm rõ quan hệ với χάρις.
- source_word: ἐν
  choice: trong
  rationale: Giữ nghĩa cơ bản và tính phong phú của giới từ Hy Lạp, không thu hẹp thành chỉ phương tiện hay sự hiệp nhất.
- source_word: τῷ ἠγαπημένῳ
  choice: Đấng Yêu Dấu
  rationale: Giữ hình thức danh hiệu của phân từ được dùng như danh từ, không thêm từ “Con” vốn không hiện diện rõ trong câu.
theological_decisions:
- issue: Mối liên hệ giữa χάρις và χαριτόω
  choice: ân điển ... ân điển Ngài đã ban
  alternative: ân điển ... nhờ đó Ngài đã ban ân huệ cho chúng ta
  rationale: Việc lặp “ân điển” trong tiếng Việt vừa tự nhiên vừa tái hiện phần nào lối chơi từ cùng gốc trong tiếng Hy Lạp, mà không dùng cấu trúc gượng như “Ngài đã ân điển hóa chúng ta”.
- issue: Sắc thái của ἐν τῷ ἠγαπημένῳ
  choice: trong Đấng Yêu Dấu
  alternative: qua Đấng Yêu Dấu
  rationale: “Trong” bảo tồn sự mơ hồ có chủ ý về phạm vi, sự liên hiệp và phương diện trung gian, thay vì quyết định chỉ một nét nghĩa.
- issue: Danh tính của τῷ ἠγαπημένῳ
  choice: Đấng Yêu Dấu
  alternative: Con yêu dấu của Ngài
  rationale: Danh hiệu này trong văn cảnh chỉ về Đấng Christ, nhưng bản câu không trực tiếp có danh từ “Con”; bản dịch không nên thêm vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng mệnh đề sau giải thích “ân điển”, đồng thời tránh một đại từ quan hệ tiếng Việt nặng nề. Viết hoa “Đấng Yêu Dấu” để biểu thị danh hiệu chỉ về Đấng Christ.
