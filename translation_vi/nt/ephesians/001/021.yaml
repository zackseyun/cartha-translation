id: EPH.1.21
reference: Ephesians 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπεράνω πάσης ἀρχῆς καὶ ἐξουσίας καὶ δυνάμεως καὶ κυριότητος καὶ παντὸς ὀνόματος ὀνομαζομένου οὐ μόνον ἐν τῷ αἰῶνι τούτῳ ἀλλὰ καὶ ἐν τῷ μέλλοντι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/021.yaml
  text: far above every rule and authority and power and dominion[a], and every name that is named[c][b], not only in this age but also in the one to come.
translation:
  language: vi
  text: cao hơn hẳn mọi quyền cai trị, mọi thẩm quyền, mọi quyền năng, mọi quyền thống trị[a], và mọi danh hiệu được xưng ra[b], không chỉ trong thời đại này mà cả trong thời đại sắp đến[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi quyền lãnh đạo, thẩm quyền, quyền năng và quyền chủ trị.” Các từ Hy Lạp có thể chỉ những cấp bậc hoặc phạm vi quyền lực, kể cả các quyền lực vũ trụ hay thuộc linh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi tước hiệu được ban.”'
    reason: lexical_alternative
  - marker: c
    text: 'Trong tiếng Hy Lạp, “thời đại” ở vế thứ hai được lược bỏ nhưng được hiểu ngầm từ vế trước; sát chữ: “trong thời đại này ... trong thời đại sắp đến.”'
    reason: source_form
lexical_decisions:
- source_word: ὑπεράνω
  choice: cao vượt trên
  rationale: Diễn đạt tự nhiên sắc thái ở cao hơn hẳn và ưu việt hơn trong ngữ cảnh Đấng Christ được tôn cao.
- source_word: πάσης ἀρχῆς
  choice: mọi quyền cai trị
  rationale: Giữ nghĩa rộng về quyền lực hoặc phạm vi cai trị, không tự ý xác định đó là người, thiên sứ hay một loại hữu thể cụ thể.
- source_word: ἐξουσίας
  choice: mọi thẩm quyền
  rationale: Thể hiện quyền hành được nắm giữ hoặc thi hành, đồng thời phân biệt với δύναμις.
- source_word: δυνάμεως
  choice: mọi quyền năng
  rationale: Cách dịch thông dụng, trang trọng, diễn tả sức mạnh hay năng lực và giữ được sự phân biệt với ἐξουσία.
- source_word: κυριότητος
  choice: mọi quyền thống trị
  rationale: Diễn tả địa vị hoặc phạm vi làm chủ mà không gây nhầm lẫn với danh xưng thần học “Chúa”.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: mọi danh được xưng
  rationale: Giữ lối diễn đạt có chủ ý lặp lại giữa ὄνομα và ὀνομάζω, đồng thời để ngỏ nghĩa rộng gồm tên gọi, danh vị hoặc tước hiệu.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: không chỉ ... mà cả
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt, giữ nguyên sự nhấn mạnh của bản Hy Lạp.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: trong thời đại này
  rationale: αἰών ở đây mang nghĩa thời kỳ, phù hợp với sự đối chiếu mang tính thời gian với thời đại sắp đến.
- source_word: ἐν τῷ μέλλοντι
  choice: trong thời đại sắp đến
  rationale: Bổ sung danh từ “thời đại” vốn được hiểu ngầm từ vế trước để câu tiếng Việt rõ ràng và tự nhiên.
theological_decisions:
- issue: Bản chất của các quyền lực được liệt kê (ἀρχή, ἐξουσία, δύναμις, κυριότης)
  choice: Dịch thành các phạm trù rộng về quyền cai trị và quyền lực, không xác định đó là quyền lực loài người hay các hữu thể thuộc linh.
  alternative: Dịch rõ là các thế lực vũ trụ hoặc các cấp bậc thiên sứ.
  rationale: Ngữ cảnh có thể bao gồm các quyền lực thuộc linh hoặc vũ trụ, nhưng câu Hy Lạp không xác định rõ bản thể của chúng. Cách dịch này giữ nguyên độ rộng và sự căng thẳng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chuỗi bốn thuật ngữ được giữ riêng biệt để phản ánh nhịp liệt kê của nguyên văn; các cách diễn đạt không xác định cụ thể bản chất của những quyền lực này.
