  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: vi
  text: Ân điển mà Ngài đã tuôn đổ dồi dào trên chúng ta[a] trong mọi sự khôn ngoan và sự sáng suốt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “ân điển mà Ngài đã làm cho dư dật đối với chúng ta”.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “trong mọi sự khôn ngoan và sự sáng suốt” có thể mô tả cách Đức Chúa Trời tuôn đổ ân điển, hoặc sự khôn ngoan và sáng suốt gắn với điều Ngài ban cho các tín hữu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ân điển mà
  rationale: Đại từ quan hệ sở hữu giống cái số ít quy chiếu về “ân điển” ở câu 7. Việc nêu lại danh từ trong tiếng Việt làm mối liên kết rõ ràng, tự nhiên mà không thay đổi đối tượng quy chiếu.
- source_word: ἐπερίσσευσεν
  choice: đã tuôn đổ dồi dào
  rationale: Động từ ở đây mang sắc thái tác động, diễn tả việc Đức Chúa Trời làm cho ân điển trở nên dư dật đối với người nhận. “Tuôn đổ dồi dào” truyền đạt hình ảnh phong phú vượt mức bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰς ἡμᾶς
  choice: trên chúng ta
  rationale: εἰς chỉ hướng ân điển đến những người nhận; “trên chúng ta” kết hợp tự nhiên với “tuôn đổ” và giữ được hướng tác động.
- source_word: ἐν
  choice: trong
  rationale: Giữ hình thức rộng nghĩa của giới từ Hy Lạp, không quyết định trước rằng cụm từ chỉ cách Đức Chúa Trời hành động hay điều gắn với ân điển được ban.
- source_word: πάσῃ
  choice: mọi sự
  rationale: Với các danh từ trừu tượng số ít, từ này diễn tả tính toàn diện; “mọi sự khôn ngoan” là cách diễn đạt trang trọng và dễ hiểu.
- source_word: σοφίᾳ
  choice: khôn ngoan
  rationale: Đây là cách tương đương chuẩn và minh bạch cho σοφία trong văn cảnh Phao-lô.
- source_word: φρονήσει
  choice: sáng suốt
  rationale: “Sáng suốt” diễn tả khả năng hiểu và nhận định thực tiễn, đồng thời phân biệt tự nhiên với “khôn ngoan” mà không mang sắc thái cổ của một số lựa chọn khác.
theological_decisions:
- issue: Cụm “trong mọi sự khôn ngoan và sáng suốt” bổ nghĩa cho điều gì
  choice: Giữ cấu trúc mở, không nói rõ đây là cách Đức Chúa Trời tuôn đổ ân điển hay là sự khôn ngoan và sáng suốt gắn với điều tín hữu nhận được.
  alternative: Có thể hiểu cụm từ mô tả sự khôn ngoan và sáng suốt của Đức Chúa Trời khi ban ân điển, hoặc mô tả sự khôn ngoan và sáng suốt được ban cho tín hữu cùng với ân điển.
  rationale: Cú pháp Hy Lạp cho phép cả hai cách liên kết. Bản dịch giữ nguyên sự mơ hồ có thật thay vì giải quyết một vấn đề thần học mà nguyên văn không xác định dứt khoát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” giữ cách xưng hô tôn kính; “tuôn đổ dồi dào” diễn đạt sức mạnh của động từ mà không dùng lối nói quá cổ. Cấu trúc không chèn dấu phẩy trước cụm cuối nhằm duy trì khả năng liên kết theo cả hai cách của nguyên văn.
