  rationale: Sửa “mắt của lòng” thành “mắt lòng” cho tự nhiên hơn, và thêm “đã được” để phản ánh hợp lý sắc thái kết quả còn hiệu lực của phân từ hoàn thành bị động. Thay “từ” bằng sở hữu cách để không diễn giải quan hệ giữa hy vọng và sự kêu gọi. Phục hồi chuỗi sở hữu cách của nguyên văn trong cụm nói về sự phong phú/vinh quang/cơ nghiệp. Chú thích a bị loại vì nó không gắn đúng với một lựa chọn từ vựng có đánh dấu trong bản tiếng Việt; chú thích b được giữ, gắn sau cụm mà nó chú giải.
