id: EPH.1.18
reference: Ephesians 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: vi
  text: mắt lòng anh chị em đã được soi sáng, để anh chị em biết niềm hy vọng của sự kêu gọi của Ngài là gì, và sự phong phú của vinh quang của cơ nghiệp Ngài giữa các thánh đồ[b] là gì,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Cũng có thể dịch: “cơ nghiệp của Ngài trong các thánh đồ” hoặc “giữa dân thánh của Ngài.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: được soi sáng
  rationale: Giữ thể bị động và kết quả còn hiệu lực của phân từ hoàn thành; trong tiếng Việt, cụm này tự nhiên khi gắn với “mắt của lòng”.
- source_word: ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: mắt của lòng anh chị em
  rationale: Giữ nguyên ẩn dụ nổi bật của Phao-lô thay vì diễn giải thành “tâm trí” hay “sự hiểu biết”.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: để anh chị em biết
  rationale: Diễn đạt tự nhiên cấu trúc chỉ mục đích của nguyên văn.
- source_word: ἐλπὶς
  choice: niềm hy vọng
  rationale: Cách dịch thông dụng, bao hàm sự trông đợi vững chắc trong văn mạch Phao-lô.
- source_word: κλήσεως αὐτοῦ
  choice: sự kêu gọi của Ngài
  rationale: Giữ từ vựng thần học của nguyên văn và không diễn giải dài hơn mức cần thiết; “Ngài” chỉ Đức Chúa Trời theo văn mạch.
- source_word: πλοῦτος
  choice: sự phong phú
  rationale: Truyền đạt ý nghĩa dồi dào, sung mãn trong tiếng Việt hiện đại; “sự giàu có” được ghi nhận như một cách dịch sát hình ảnh hơn.
- source_word: δόξης
  choice: vinh quang
  rationale: Cách dịch Kinh Thánh tiêu chuẩn, giữ được chiều sâu thần học của từ này.
- source_word: κληρονομίας αὐτοῦ
  choice: cơ nghiệp của Ngài
  rationale: Giữ cấu trúc sở hữu mở của tiếng Hy Lạp, không quyết định đó là cơ nghiệp thuộc về Đức Chúa Trời hay cơ nghiệp Ngài ban.
- source_word: ἐν τοῖς ἁγίοις
  choice: giữa các thánh đồ
  rationale: “Giữa” tự nhiên trong tiếng Việt và phù hợp sắc thái cộng đồng; vẫn giữ danh xưng “các thánh đồ” của nguyên văn.
theological_decisions:
- issue: “Cơ nghiệp của Ngài giữa/trong các thánh đồ” nói về dân thánh là cơ nghiệp của Đức Chúa Trời hay về cơ nghiệp Ngài ban cho họ
  choice: cơ nghiệp của Ngài giữa các thánh đồ
  alternative: cơ nghiệp của Ngài trong các thánh đồ; cơ nghiệp Ngài ban giữa dân thánh
  rationale: Sở hữu cách và giới từ trong tiếng Hy Lạp cho phép nhiều sắc thái. Bản chính giữ nguyên sự căng thẳng thần học thay vì chọn một cách giải thích riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại; dùng “anh chị em” cho số nhiều ὑμῶν/ὑμᾶς, “Ngài” theo văn mạch chỉ Đức Chúa Trời, và giữ ẩn dụ “mắt của lòng”. Câu được để ở dạng tiếp nối với dấu phẩy cuối vì đây là một phần của câu cầu nguyện dài trong Ê-phê-sô 1:17–19.
