source:
  edition: SBLGNT
  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: vi
  text: Ngài đã cho chúng ta biết lẽ mầu nhiệm của ý muốn Ngài, theo ý tốt lành mà Ngài đã định trong Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong Đấng Christ”; một số người, theo ngữ cảnh, hiểu cả cụm này là “trong chính Ngài” (tức là trong chính Đức Chúa Trời).
    reason: alternative_reading
lexical_decisions:
- source_word: γνωρίσας
  choice: đã cho chúng ta biết
  rationale: Diễn đạt tự nhiên hành động γνωρίζω và giữ sắc thái hoàn thành của phân từ aorist; trong mạch câu dài, chủ ngữ được hiểu là Đức Chúa Trời.
- source_word: μυστήριον
  choice: lẽ mầu nhiệm
  rationale: Trong cách dùng của Phao-lô, từ này chỉ ý định của Đức Chúa Trời từng được che giấu nhưng nay được bày tỏ, chứ không phải điều vĩnh viễn không thể hiểu.
- source_word: θέλημα
  choice: ý muốn
  rationale: Là cách tương ứng trực tiếp, đồng thời không làm lu mờ sự phân biệt với προέθετο ở cuối câu.
- source_word: εὐδοκία
  choice: ý tốt lành
  rationale: Giữ cả sắc thái điều đẹp lòng và ý hướng tốt lành của Đức Chúa Trời mà không thu hẹp thành một kế hoạch thuần lý trí.
- source_word: προέθετο
  choice: đã định
  rationale: Truyền đạt hành động chủ ý đặt ra hoặc hoạch định; cách nói này gọn và tự nhiên trong tiếng Việt.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ đại từ của nguyên văn và không tự ý xác định nó là Đấng Christ hay mang nghĩa phản thân là chính Đức Chúa Trời.
theological_decisions:
- issue: Đối tượng quy chiếu của ἐν αὐτῷ
  choice: Giữ cách nói “trong Ngài” ở chính văn.
  alternative: “trong Đấng Christ” hoặc “trong chính mình”
  rationale: Ngữ cảnh có thể hướng đến Đấng Christ, nhưng đại từ cũng được hiểu theo nghĩa phản thân chỉ Đức Chúa Trời. Chính văn không giải quyết thay sự mơ hồ này; chú thích nêu các cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Lẽ mầu nhiệm” giữ thuật ngữ thần học quen thuộc nhưng được hiểu là điều từng kín giấu nay được cho biết. Cụm “trong Ngài” hơi cô đọng có chủ ý để bảo toàn sự mơ hồ của nguyên văn.
