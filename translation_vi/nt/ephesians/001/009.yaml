  to: Ngài đã cho chúng ta biết lẽ mầu nhiệm của ý muốn Ngài, theo ý tốt lành mà Ngài đã định trong Ngài[a].
  rationale: Giữ nguyên chính văn vì nó dịch sát và tự nhiên, đồng thời bảo toàn sự mơ hồ về đối tượng của ἐν αὐτῷ. Chỉ sửa chú thích để mô tả chính xác rằng cách hiểu “trong chính Ngài” là một cách giải thích theo ngữ cảnh, không phải một nghĩa phản thân vốn có của αὐτῷ.
