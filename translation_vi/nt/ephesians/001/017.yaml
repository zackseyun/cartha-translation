id: EPH.1.17
reference: Ephesians 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: vi
  text: để Đức Chúa Trời của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, Cha của vinh quang,[a] ban cho anh chị em một tinh thần khôn ngoan và mặc khải[b] trong sự nhận biết Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “Cha của vinh quang”; cũng có thể hiểu là “Cha đầy vinh quang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Đức Thánh Linh khôn ngoan và mặc khải.” Từ Hy Lạp πνεῦμα có thể chỉ một tinh thần do Đức Chúa Trời ban hoặc chỉ Đức Thánh Linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Nối với lời cầu nguyện ở câu trước và diễn đạt tự nhiên nội dung/mục đích của lời cầu xin.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Trời của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a
  rationale: Giữ quan hệ sở hữu của nguyên văn; dùng “Chúa” như tước hiệu và dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si-a”.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: tức Cha vinh quang
  rationale: Giữ cấu trúc danh từ thuộc cách gần với nguyên văn; “tức” làm rõ đây là cụm đồng vị chỉ cùng một Đấng.
- source_word: δώῃ ὑμῖν
  choice: ban cho anh chị em
  rationale: “Ban” phù hợp với hành động Đức Chúa Trời trao tặng; “anh chị em” diễn đạt số nhiều ὑμῖν theo cách bao hàm và tự nhiên.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: một tâm linh khôn ngoan và được mặc khải
  rationale: “Tâm linh” để ngỏ khả năng nói về tinh thần/năng lực nội tâm do Đức Chúa Trời ban; cấu trúc tiếng Việt diễn đạt hai đặc tính mà không khẳng định quá mức rằng đây chắc chắn là Đức Thánh Linh.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: trong sự nhận biết Ngài
  rationale: Giữ giới từ ἐν và sắc thái nhận biết sâu xa của ἐπίγνωσις, đồng thời bảo tồn khả năng αὐτοῦ quy về Đức Chúa Trời/Cha.
theological_decisions:
- issue: πνεῦμα chỉ Đức Thánh Linh hay một tâm linh/tinh thần do Đức Chúa Trời ban
  choice: một tâm linh
  alternative: Đức Thánh Linh
  rationale: Danh từ không có mạo từ và ngữ cảnh cho phép cả hai cách hiểu. Bản chính không viết hoa theo hướng xác quyết thần học; chú thích giữ cách hiểu quy chiếu đến Đức Thánh Linh.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn mang chức năng tước hiệu; “Đấng Mê-si-a” chuyển tải nghĩa thay vì chỉ phiên âm theo truyền thống.
- issue: Quan hệ trong ὁ πατὴρ τῆς δόξης
  choice: Cha vinh quang
  alternative: Cha đầy vinh quang
  rationale: Bản chính giữ độ cô đọng và sức nặng của cấu trúc thuộc cách; cách thay thế diễn giải nó như một phẩm tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều; viết hoa “Ngài” theo quy ước kính ngữ tiếng Việt. Dấu phẩy trước [a] gắn chú thích với cụm “Cha vinh quang”.
