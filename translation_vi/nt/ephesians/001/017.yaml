revisions:
- from: để Đức Chúa Trời của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, tức Cha vinh quang,[a] ban cho anh chị em một tâm linh[b] khôn ngoan và được mặc khải trong sự nhận biết Ngài.
  to: để Đức Chúa Trời của Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, Cha của vinh quang,[a] ban cho anh chị em một tinh thần khôn ngoan và mặc khải[b] trong sự nhận biết Ngài.
  rationale: Sửa “được mặc khải” thành danh từ “mặc khải” để phản ánh hai thuộc cách song hành σοφίας καὶ ἀποκαλύψεως. Thay “Cha vinh quang” bằng “Cha của vinh quang” để giữ cấu trúc nguyên ngữ và tiếng Việt tự nhiên. Điều chỉnh chú thích về πνεῦμα để bảo tồn khả năng quy chiếu đến Đức Thánh Linh mà không thêm nội dung diễn giải.
  reviewer_model: gpt-5.6-terra
