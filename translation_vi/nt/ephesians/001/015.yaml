id: EPH.1.15
reference: Ephesians 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: vi
  text: Vì lẽ đó, tôi cũng, sau khi nghe nói về đức tin của anh chị em nơi Chúa Giê-su[a] và tình yêu của anh chị em dành cho tất cả các thánh đồ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sự tin cậy của anh chị em nơi Chúa Giê-su”; trong một số ngữ cảnh, danh từ Hy Lạp cũng có thể mang nghĩa “sự trung tín”.
    reason: lexical_alternative
  - marker: b
    text: Hay “tình yêu của anh chị em hướng đến tất cả các thánh đồ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Cụm διά với đại từ chỉ định ở đối cách quy chiếu về phần chúc tụng trước đó và nêu căn cứ cho phản ứng của Phao-lô; cách dịch này giữ rõ quan hệ suy luận.
- source_word: κἀγώ
  choice: tôi cũng vậy
  rationale: Dạng rút gọn của καί và ἐγώ mang ý bổ sung chính Phao-lô vào phản ứng đang được nói đến; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái nhấn thêm.
- source_word: ἀκούσας
  choice: sau khi nghe
  rationale: Phân từ bất định quá khứ bổ nghĩa cho chủ thể Phao-lô, chủ yếu biểu thị hành động xảy ra trước; chuyển thành cụm thời gian là tự nhiên trong tiếng Việt mà không làm thay đổi quan hệ cú pháp.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: đức tin của anh chị em
  rationale: Thành ngữ κατά + ὑμᾶς chỉ điều thuộc về hoặc hiện có nơi những người nhận thư; cách dịch sở hữu rõ nghĩa và tự nhiên.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ chỉ mối quan hệ tin cậy của độc giả nơi Chúa Giê-su; “đức tin” là thuật ngữ quen thuộc, trang trọng và không loại bỏ hoàn toàn sắc thái tin cậy.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: nơi Chúa Giê-su
  rationale: “Nơi” giữ được giới từ ἐν và thành ngữ thần học của Phao-lô tự nhiên hơn “trong” khi đi với đức tin trong tiếng Việt.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Giữ danh hiệu mang trọng lượng Cơ Đốc học của κύριος và phù hợp cách gọi tự nhiên trong tiếng Việt.
- source_word: ἀγάπην
  choice: tình yêu
  rationale: Đây là cách tương đương hiện đại, rõ ràng của ἀγάπη, không dùng từ cổ hoặc thu hẹp loại tình yêu được nói đến.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: dành cho tất cả các thánh đồ
  rationale: εἰς sau ἀγάπη chỉ hướng tình yêu đến các đối tượng; “dành cho” tự nhiên trong tiếng Việt và giữ ý hướng đến.
- source_word: ἁγίους
  choice: thánh đồ
  rationale: Giữ cách gọi tập thể quen thuộc của Phao-lô dành cho các tín hữu, thay vì diễn giải thành một nhóm đã được phong thánh về sau.
theological_decisions:
- issue: Sắc thái của πίστις trong mối liên hệ với Chúa Giê-su
  choice: đức tin
  alternative: sự tin cậy; sự trung tín
  rationale: Cấu trúc ở đây trực tiếp nói đến mối quan hệ tin của người nhận thư nơi Chúa Giê-su. “Sự trung tín” vẫn là một khả năng từ vựng trong những ngữ cảnh khác nhưng kém trực tiếp hơn ở đây; chú thích giữ lại sắc thái “tin cậy” gần nhất.
- issue: Cách dịch κύριος như danh hiệu của Chúa Giê-su
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” giữ được chức năng danh hiệu và trọng lượng Cơ Đốc học của từ Hy Lạp, trong khi “Chủ” dễ bị hiểu thuần túy theo quan hệ xã hội.
- issue: Cách gọi πάντας τοὺς ἁγίους
  choice: tất cả các thánh đồ
  alternative: tất cả những người thánh; toàn thể dân thánh của Đức Chúa Trời
  rationale: “Thánh đồ” bảo tồn cách gọi đặc trưng của Phao-lô mà không thêm cụm giải thích không có trực tiếp trong câu; ngữ cảnh cho thấy đây là toàn thể các tín hữu, không phải một tầng lớp được phong thánh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận thư; “Chúa Giê-su” và “thánh đồ” giữ sắc thái Kinh Thánh quen thuộc. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế tiếp.
