id: EPH.1.1
reference: Ephesians 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: vi
  text: Phao-lô, sứ đồ của Đấng Mê-si-a Giê-su theo ý muốn của Đức Chúa Trời, kính gửi các thánh đồ [ở Ê-phê-sô][a] và trung tín trong Đấng Mê-si-a Giê-su.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản cổ không có cụm từ “ở Ê-phê-sô”; vì vậy, có người hiểu thư này ban đầu được gửi lưu hành rộng rãi chứ không chỉ dành cho hội thánh tại Ê-phê-sô.
    reason: textual_variant
  - marker: b
    text: “Trung tín” cũng có thể dịch là “tin” hoặc “là những người tin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt hiện đại.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Đây là chức danh Cơ Đốc giáo sơ khai chỉ người được sai phái với thẩm quyền; “sứ đồ” giữ được nghĩa chuyên biệt tốt hơn “sứ giả”.
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: của / trong Đấng Mê-si-a là Đức Chúa Giê-su
  rationale: Χριστός vẫn mang lực của tước hiệu tại đây. Cách diễn đạt này vừa giữ danh xưng Mê-si-a vừa tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: διὰ θελήματος θεοῦ
  choice: theo ý muốn của Đức Chúa Trời
  rationale: Trong công thức xác nhận sự ủy nhiệm này, διά với sở hữu cách diễn tả nền tảng hoặc phương tiện của chức vụ; “theo ý muốn” là cách nói tiếng Việt tự nhiên, không hàm ý Phao-lô chỉ hành động vì sở thích riêng.
- source_word: ἁγίοις
  choice: các thánh đồ
  rationale: Chỉ cộng đồng dân thuộc về và được biệt riêng cho Đức Chúa Trời; đây là thuật ngữ quen thuộc trong tiếng Việt và không giới hạn vào một tầng lớp được phong thánh.
- source_word: τοῖς οὖσιν
  choice: đang ở
  rationale: Kết hợp tự nhiên với địa danh trong tiếng Việt, tương ứng với phân từ của εἰμί dùng để xác định người nhận.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[Ê-phê-sô]'
  rationale: Giữ ngoặc vuông để thể hiện sự bất định văn bản của cụm từ chỉ địa điểm.
- source_word: πιστοῖς
  choice: những người trung tín
  rationale: Giữ sắc thái tính từ về lòng trung tín hoặc sự đáng tin, đồng thời ghi nhận nghĩa khả dĩ “những người tin” trong chú thích.
theological_decisions:
- issue: Cách dịch Χριστός trong lời mở đầu
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong câu này Χριστός vẫn có thể được nghe như một tước hiệu. “Đấng Mê-si-a” giữ rõ nghĩa “Đấng được xức dầu” mà không biến tước hiệu thành một phần tên riêng.
- issue: Tình trạng văn bản của ἐν Ἐφέσῳ
  choice: Giữ [Ê-phê-sô] trong ngoặc vuông
  alternative: Lược bỏ “ở Ê-phê-sô”
  rationale: Một số chứng bản sớm không có cụm từ này; ngoặc vuông biểu thị công khai sự bất định thay vì âm thầm quyết định một cách đọc.
- issue: Nghĩa của πιστοῖς
  choice: những người trung tín
  alternative: những người tin
  rationale: Từ Hy Lạp có thể chỉ phẩm chất trung tín hoặc căn tính của người tin. Bản chính giữ sắc thái thứ nhất, còn chú thích bảo lưu cách hiểu thứ hai.
translation_notes:
  register: Văn phong thư tín trang trọng nhưng dễ hiểu. Dùng “kính gửi” để thể hiện chức năng của cách tặng trong lời chào; dùng các dạng tên quen thuộc Phao-lô, Ê-phê-sô và Đức Chúa Giê-su. Dấu ngoặc vuông trong chính văn phản ánh trực tiếp tình trạng bất định của địa danh.
