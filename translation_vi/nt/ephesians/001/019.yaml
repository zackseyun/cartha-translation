id: EPH.1.19
reference: Ephesians 1:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τί τὸ ὑπερβάλλον μέγεθος τῆς δυνάμεως αὐτοῦ εἰς ἡμᾶς τοὺς πιστεύοντας κατὰ τὴν ἐνέργειαν τοῦ κράτους τῆς ἰσχύος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: vi
  text: và quyền năng của Ngài đối với chúng ta là những người tin lớn lao vượt trội dường nào, theo sự vận hành của sức mạnh đầy uy lực của Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: vượt trội
  rationale: Phân từ hiện tại được dùng như tính từ cho μέγεθος; “vượt trội” giữ ý vượt quá mà không đẩy mạnh thành “vô hạn” hay “không thể đo lường”.
- source_word: μέγεθος
  choice: sự vĩ đại
  rationale: Cách diễn đạt tự nhiên, trang trọng cho danh từ trừu tượng chỉ mức độ lớn lao.
- source_word: δύναμις
  choice: quyền năng
  rationale: Diễn đạt năng lực hữu hiệu của Đức Chúa Trời, đồng thời phân biệt với κράτος và ἰσχύς trong chuỗi từ gần nghĩa.
- source_word: εἰς ἡμᾶς
  choice: hướng đến chúng ta
  rationale: Giữ trực tiếp sắc thái hướng tới của εἰς và không tự ý xác định quyền năng ấy chỉ hoạt động “trong” hay chỉ hành động “vì” người tin.
- source_word: τοὺς πιστεύοντας
  choice: là những người tin
  rationale: Giữ tính chất động từ của phân từ hiện tại và phù hợp với tiếng Việt hiện đại.
- source_word: κατά
  choice: theo
  rationale: 'Biểu thị sự tương ứng hay chuẩn mực: quyền năng hướng đến người tin tương xứng với sự vận hành được mô tả tiếp theo.'
- source_word: ἐνέργεια
  choice: sự vận hành
  rationale: Chỉ hoạt động hữu hiệu đang phát huy tác dụng; “sự vận hành” rõ nghĩa và tránh liên tưởng hiện đại không phù hợp của từ “năng lượng”.
- source_word: κράτος
  choice: sức mạnh
  rationale: Diễn đạt sức mạnh được thể hiện, đồng thời giữ một từ riêng biệt trong chuỗi nhấn mạnh về quyền năng.
- source_word: ἰσχύς
  choice: uy lực
  rationale: Chỉ sức lực hay năng lực mạnh mẽ; “uy lực” giúp không gộp từ này với δύναμις và κράτος, dù các từ có phần chồng lấn nghĩa.
- source_word: καὶ τί
  choice: và đâu là
  rationale: Nối tiếp nội dung lời cầu nguyện ở câu trước; “đâu là” tự nhiên trong mệnh đề gián tiếp tiếng Việt và bổ sung yếu tố liên kết được ngữ cảnh hàm ý.
theological_decisions:
- issue: Cách chuyển chuỗi δύναμις / ἐνέργεια / κράτος / ἰσχύς
  choice: 'Giữ sự tích lũy tu từ bằng các từ liên hệ nhưng khác nhau: “quyền năng ... sự vận hành ... sức mạnh ... uy lực”.'
  alternative: Rút gọn thành ít từ hơn, hoặc diễn ý chung là “toàn bộ sức mạnh quyền năng của Ngài”.
  rationale: Phao-lô cố ý xếp nhiều từ gần nghĩa để nhấn mạnh quy mô và hiệu lực của quyền năng Đức Chúa Trời; giữ chuỗi này tránh làm mất sức nặng tu từ hoặc biến mỗi từ thành một thuật ngữ thần học riêng.
- issue: Hướng tác động của quyền năng trong εἰς ἡμᾶς
  choice: “hướng đến chúng ta là những người tin”
  alternative: “trong chúng ta là những người tin” hoặc “cho chúng ta là những người tin”
  rationale: Bản Hy Lạp dùng εἰς chứ không phải ἐν. “Hướng đến” bảo toàn sắc thái phương hướng, không giải quyết thay bản văn câu hỏi quyền năng được nhấn mạnh là hoạt động bên trong hay đem ích lợi đến cho người tin.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc giữ tính chất nối tiếp câu trước và bảo toàn chuỗi từ gần nghĩa nhấn mạnh quyền năng, dù cụm cuối hơi cô đọng như nguyên văn Hy Lạp.
