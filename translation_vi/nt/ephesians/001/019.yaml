- from: và đâu là sự vĩ đại vượt trội của quyền năng Ngài hướng đến chúng ta là những người tin[a], theo sự vận hành của sức mạnh từ uy lực Ngài.
  to: và quyền năng của Ngài đối với chúng ta là những người tin lớn lao vượt trội dường nào, theo sự vận hành của sức mạnh đầy uy lực của Ngài.
  rationale: Bản sửa chuyển τί ... μέγεθος bằng cấu trúc tiếng Việt tự nhiên “lớn lao vượt trội dường nào,” đồng thời dùng “đối với chúng ta” như một cách rõ và tự nhiên để giữ hướng nghĩa của εἰς. Phần cuối sửa quan hệ cú pháp của chuỗi genitive và vẫn duy trì tính tích lũy tu từ của các từ chỉ quyền năng. Chú thích được giữ, chỉ điều chỉnh “hướng đến” thành “đối với” để khớp bản dịch sửa.
