  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: vi
  text: Trong Đấng ấy, chúng ta có sự cứu chuộc nhờ huyết của Ngài, tức là sự tha thứ các vi phạm[a], theo sự phong phú của ân điển Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các lỗi phạm”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Đấng ấy
  rationale: Đại từ quan hệ chỉ về Đấng Được Yêu trong câu trước; cách dịch này tự nhiên, trang trọng và giữ được ý ở trong Đấng Christ.
- source_word: ἔχομεν
  choice: chúng ta có
  rationale: Động từ hiện tại diễn tả một thực tại hiện có; đây là cách dịch trực tiếp và tự nhiên.
- source_word: ἀπολύτρωσιν
  choice: sự cứu chuộc
  rationale: Giữ ý giải phóng bằng một giá phải trả và sắc thái thần học quen thuộc trong văn chương Phao-lô.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: nhờ huyết của Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện; giữ nguyên hình ảnh cụ thể về huyết thay vì diễn giải thành sự chết.
- source_word: ἄφεσιν
  choice: sự tha thứ
  rationale: Trong ngữ cảnh này, từ chỉ việc tội lỗi được tha; cách dịch rõ ràng và hiện đại.
- source_word: παραπτωμάτων
  choice: những vi phạm
  rationale: Diễn đạt hành vi sai phạm hay xúc phạm về mặt đạo đức mà không thu hẹp nghĩa vào việc phá một điều luật cụ thể.
- source_word: κατὰ τὸ πλοῦτος
  choice: theo sự phong phú
  rationale: κατά với đối cách nêu chuẩn mực hoặc mức độ; cách dịch giữ ý ân điển dồi dào là thước đo của sự cứu chuộc và tha thứ.
- source_word: χάριτος
  choice: ân điển
  rationale: Đây là thuật ngữ trung tâm trong thần học Phao-lô, chỉ ân huệ nhưng không của Đức Chúa Trời.
theological_decisions:
- issue: Quan hệ giữa “sự cứu chuộc” và “sự tha thứ những vi phạm”
  choice: Dịch vế sau theo lối đồng vị giải thích bằng “tức là”
  alternative: Giữ hai cụm danh từ liền nhau mà không thêm từ nối
  rationale: Hai cụm đối cách có quan hệ đồng vị; “tức là” làm rõ cấu trúc trong tiếng Việt nhưng không thêm một nội dung thần học mới.
- issue: Ngôn ngữ chuộc tội trong διὰ τοῦ αἵματος αὐτοῦ
  choice: Giữ hình ảnh cụ thể “nhờ huyết của Ngài”
  alternative: nhờ sự chết của Ngài; nhờ cái chết hiến tế của Ngài
  rationale: Nguyên văn nói rõ đến huyết. Giữ hình ảnh này bảo toàn sắc thái hiến tế và giao ước, tránh diễn giải quá mức.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng ấy” để liên kết rõ với tiền ngữ ở câu trước; dùng “Ngài” cho đại từ chỉ Đấng Christ. “Huyết” được giữ vì sắc thái Kinh Thánh và tế lễ, trong khi cú pháp được làm tự nhiên cho độc giả phổ thông.
