  to: Trong Đấng ấy, chúng ta có sự cứu chuộc nhờ huyết của Ngài, tức là sự tha thứ các vi phạm[a], theo sự phong phú của ân điển Ngài.
  rationale: Chỉ điều chỉnh cú pháp tiếng Việt và phương án chú thích để bản dịch tự nhiên, hiện đại hơn. Các lựa chọn thuật ngữ và cấu trúc thần học của bản nháp được giữ nguyên; đặc biệt, “huyết” không bị diễn giải thành “sự chết,” và quan hệ đồng vị giữa “sự cứu chuộc” với “sự tha thứ” vẫn được bảo toàn.
