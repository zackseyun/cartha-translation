id: EPH.1.10
reference: Ephesians 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: vi
  text: cho sự sắp đặt khi các thời kỳ đạt đến sự viên mãn, để quy tụ muôn vật trong Đấng Mê-si—cả những gì ở trên trời lẫn những gì ở trên đất—trong Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tóm kết muôn vật trong Đấng Mê-si” hoặc “đưa muôn vật về dưới một Đầu là Đấng Mê-si.” Động từ Hy Lạp có thể mang cả ý tổng kết lẫn quy tụ dưới một đầu.'
    reason: Bảo lưu phạm vi nghĩa và sắc thái thần học của ἀνακεφαλαιώσασθαι.
lexical_decisions:
- source_word: οἰκονομίαν
  choice: sự sắp đặt
  rationale: Diễn đạt sự tổ chức và điều hành có chủ đích, đồng thời tránh thu hẹp nghĩa thành chỉ một “kế hoạch” hoặc chức vụ “quản trị”.
- source_word: πληρώματος τῶν καιρῶν
  choice: khi các thời kỳ đã viên mãn
  rationale: Giữ ý các thời kỳ được ấn định đã đạt đến mức trọn đầy, nhưng chuyển cấu trúc danh từ Hy Lạp sang cách nói tự nhiên trong tiếng Việt.
- source_word: ἀνακεφαλαιώσασθαι
  choice: quy tụ
  rationale: “Quy tụ” diễn đạt việc đưa mọi sự về một mối; sắc thái tổng kết hoặc đặt dưới một đầu được bảo lưu trong chú thích.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Cách nói trang trọng, tự nhiên và có phạm vi bao quát trong bối cảnh vũ trụ.
- source_word: ἐν τῷ Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός mang chức năng tước hiệu tại đây; “Đấng Mê-si” làm rõ nghĩa “Đấng được xức dầu” mà không biến thành tên riêng.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς
  choice: cả những gì ở trên trời lẫn những gì ở dưới đất
  rationale: Giữ sự đối xứng không gian và phạm vi vũ trụ của nguyên văn; tiếng Việt tự nhiên dùng “trên trời” ở dạng tập hợp dù οὐρανοῖς là số nhiều.
- source_word: ἐν αὐτῷ
  choice: trong chính Ngài
  rationale: Lặp lại ý “trong Ngài” và dùng “chính” để thể hiện sự nhấn mạnh do cụm này được đặt riêng ở cuối, nhưng không thêm nghĩa loại trừ.
theological_decisions:
- issue: Ý nghĩa của ἀνακεφαλαιώσασθαι
  choice: quy tụ muôn vật
  alternative: tóm kết muôn vật; đưa muôn vật về dưới một Đầu
  rationale: Động từ có thể gợi cả việc tổng kết và đưa về một đầu mối. Bản chính dùng cách nói tự nhiên, không quyết định hoàn toàn giữa hai sắc thái; chú thích bảo lưu các khả năng ấy.
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này hoạt động như một tước hiệu trong lời tuyên bố thần học về mục đích vũ trụ của Đức Chúa Trời.
- issue: Quan hệ cú pháp của εἰς οἰκονομίαν và động từ nguyên mẫu
  choice: 'nhằm thực hiện sự sắp đặt…: quy tụ'
  alternative: cho sự quản trị… để quy tụ
  rationale: Cách dịch giữ quan hệ mục đích và sự sắp đặt có trật tự, đồng thời dùng dấu hai chấm để làm rõ nội dung của sự sắp đặt mà không khẳng định một phân tích thần học hẹp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sự sắp đặt” giữ sắc thái có trật tự của οἰκονομία; “các thời kỳ đã viên mãn” bảo toàn sức nặng thời kỳ luận của nguyên văn mà không diễn giải thành một hệ thống giáo lý. Dấu gạch ngang giữ cấu trúc giải thích về phạm vi của “muôn vật”.
