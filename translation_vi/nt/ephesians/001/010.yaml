revisions:
- from: 'nhằm thực hiện sự sắp đặt khi các thời kỳ đã viên mãn: quy tụ muôn vật trong Đấng Mê-si—cả những gì ở trên trời lẫn những gì ở dưới đất—trong chính Ngài.[a]'
  to: cho sự sắp đặt khi các thời kỳ đạt đến sự viên mãn, để quy tụ muôn vật trong Đấng Mê-si—cả những gì ở trên trời lẫn những gì ở trên đất—trong Ngài.[a]
  rationale: 'Bản sửa khôi phục quan hệ: sự sắp đặt/quản trị diễn ra khi các thời kỳ đạt sự viên mãn và có mục đích quy tụ muôn vật. «Ở trên đất» bám sát ἐπὶ τῆς γῆς hơn, trong khi vẫn tự nhiên trong phép đối xứng với «ở trên trời». Đã bỏ «chính» để không thêm nhấn mạnh ngoài nguyên văn.'
  reviewer_model: gpt-5.6-terra
