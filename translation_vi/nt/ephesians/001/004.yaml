id: EPH.1.4
reference: Ephesians 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: vi
  text: Cũng như Ngài đã chọn chúng ta trong Đấng ấy từ trước khi đặt nền móng thế gian, để chúng ta nên thánh và không chỗ trách[a] trước mặt Ngài trong tình yêu thương.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không tì vết.”
    reason: lexical_alternative
  - marker: b
    text: 'Cụm từ “trong tình yêu thương” cũng có thể được nối với câu sau: “Trong tình yêu thương, Ngài đã định trước cho chúng ta...”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Cũng vậy
  rationale: Giữ quan hệ nối kết với lời chúc tụng ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐξελέξατο
  choice: đã chọn
  rationale: Diễn đạt trực tiếp hành động lựa chọn của Đức Chúa Trời mà không đưa thêm sắc thái hệ thống thần học của một thuật ngữ chuyên biệt.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Đại từ ngôi thứ nhất số nhiều, vừa là đối tượng của hành động chọn vừa là chủ thể được hiểu của mệnh đề chỉ mục đích.
- source_word: ἐν αὐτῷ
  choice: trong Đấng ấy
  rationale: Giữ cách nói cô đọng của Phao-lô về mối liên hệ với Đấng Christ và bảo lưu đại từ của nguyên văn; viết hoa theo quy ước chỉ thân vị thần thượng.
- source_word: πρὸ καταβολῆς κόσμου
  choice: từ trước khi đặt nền móng thế gian
  rationale: Giữ ý nghĩa thời gian và hình ảnh nguyên ngữ, với cấu trúc tiếng Việt tự nhiên.
- source_word: εἶναι ἡμᾶς
  choice: để chúng ta nên
  rationale: Thể hiện chức năng mục đích hoặc kết quả của cấu trúc nguyên mẫu; việc lặp lại “chúng ta” giúp câu tiếng Việt rõ chủ thể.
- source_word: ἁγίους
  choice: thánh
  rationale: Giữ cả sắc thái thuộc về Đức Chúa Trời và sự thanh sạch về đạo đức.
- source_word: ἀμώμους
  choice: không chỗ trách được
  rationale: Diễn đạt tự nhiên ý không thể bị quy trách, đồng thời chú thích nghĩa sát chữ mang hình ảnh tế lễ.
- source_word: κατενώπιον αὐτοῦ
  choice: trước mặt Ngài
  rationale: Diễn đạt ngắn gọn sự hiện diện và trách nhiệm trước Đức Chúa Trời.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Giữ nguyên vị trí cuối câu và cách diễn đạt đủ rộng để không loại bỏ sự mơ hồ về quan hệ cú pháp với câu 4 hoặc câu 5.
theological_decisions:
- issue: Khả năng đọc quá mức giáo lý từ ἐξελέξατο
  choice: đã chọn chúng ta
  alternative: đã tuyển chọn chúng ta
  rationale: “Đã chọn” truyền đạt rõ hành động của Đức Chúa Trời nhưng tránh áp đặt một hệ thống thần học hậu kỳ lên từ ngữ Hy Lạp.
- issue: Quan hệ cú pháp của ἐν ἀγάπῃ
  choice: đặt “trong tình yêu thương” ở cuối câu 4 và ghi chú sự mơ hồ
  alternative: 'gắn với câu 5: “Trong tình yêu thương, Ngài đã định trước...”'
  rationale: Nguyên văn có thể được hiểu là bổ nghĩa cho sự nên thánh, không chỗ trách được ở câu 4, hoặc cho hành động định trước ở câu 5; bản dịch không nên quyết định thay nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp độc giả phổ thông. Cấu trúc được làm rõ vừa đủ cho tiếng Việt, đồng thời giữ cách nói “trong Đấng ấy” và sự mơ hồ thực sự của cụm cuối câu.
