id: EPH.1.13
reference: Ephesians 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: vi
  text: 'Trong Đấng ấy[a], anh chị em cũng vậy: sau khi nghe lời chân lý, tức tin mừng về sự cứu rỗi của anh chị em[b], và sau khi tin nơi Ngài[c], anh chị em đã được đóng ấn bằng Đức Thánh Linh của lời hứa[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong Ngài”.
    reason: lexical_alternative
  - marker: b
    text: Hay “phúc âm về sự cứu rỗi của anh chị em”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch “sau khi tin Ngài”.
    reason: syntactic_ambiguity
  - marker: d
    text: Hay “bằng Đức Thánh Linh đã được hứa ban”.
    reason: interpretive_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Đấng ấy
  rationale: Đại từ quan hệ quy chiếu về Đấng Christ trong ngữ cảnh trước; cách dịch này giữ ý hiệp nhất với Đấng Christ và tự nhiên hơn lối dịch sát chữ “trong người mà”.
- source_word: καὶ ὑμεῖς
  choice: anh chị em cũng vậy
  rationale: Giữ sắc thái bổ sung, nhấn mạnh người đọc cũng được dự phần cùng nhóm “chúng tôi” ở các câu trước.
- source_word: ἀκούσαντες
  choice: sau khi nghe
  rationale: Phân từ bất định quá khứ đứng trước động từ chính thường diễn tả hành động có trước; cách dịch này nêu trình tự mà không áp đặt một hệ thống thần học chi tiết.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: lời chân lý
  rationale: Giữ thành ngữ Phao-lô và sắc thái của λόγος, đồng thời vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: tin mừng về sự cứu rỗi của anh chị em
  rationale: “Tin mừng” truyền đạt trực tiếp nghĩa của εὐαγγέλιον; “về” cho phép cụm sở hữu chỉ nội dung hoặc kết quả cứu rỗi mà không thu hẹp quá mức.
- source_word: πιστεύσαντες
  choice: sau khi tin
  rationale: Phản ánh lực thời gian tự nhiên của phân từ bất định quá khứ so với “đã được đóng ấn”, nhưng không khẳng định quá mức về thời điểm tiếp nhận Thánh Linh.
- source_word: ἐν ᾧ καὶ πιστεύσαντες
  choice: và sau khi tin trong Ngài
  rationale: Giữ cụm ἐν ᾧ như một yếu tố riêng, tránh tự động biến nó thành bổ ngữ trực tiếp “tin Ngài”; chú thích ghi nhận cách hiểu tự nhiên khác.
- source_word: ἐσφραγίσθητε
  choice: đã được đóng ấn
  rationale: Giữ thể bị động và hình ảnh con dấu, có thể hàm ý quyền sở hữu, sự xác nhận và bảo đảm.
- source_word: τῷ πνεύματι
  choice: bằng Đức Thánh Linh
  rationale: Diễn đạt cách dùng công cụ của cách Dative trong hình ảnh đóng ấn; không loại trừ sắc thái liên kết của cấu trúc Hy Lạp.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: Đức Thánh Linh của lời hứa
  rationale: Giữ cấu trúc sở hữu cô đọng và trật tự ý nghĩa của nguyên văn; cách diễn giải “Đức Thánh Linh đã được hứa ban” được nêu trong chú thích.
theological_decisions:
- issue: Quan hệ giữa nghe, tin và được đóng ấn
  choice: Dịch hai phân từ là “sau khi nghe” và “sau khi tin”, biểu thị trình tự tự nhiên trước động từ chính.
  alternative: Có thể dịch “khi nghe… khi tin”, xem các hành động gần như đồng thời.
  rationale: Cấu trúc Hy Lạp thuận với ý hành động đi trước, nhưng câu dịch không xác định một khoảng thời gian hay áp đặt lập trường hệ phái về thứ tự cứu rỗi.
- issue: Quan hệ của cụm ἐν ᾧ thứ hai với πιστεύσαντες
  choice: 'Giữ “trong Ngài” như phạm vi hiệp nhất với Đấng Christ: “sau khi tin trong Ngài”.'
  alternative: Hiểu theo cách nói “tin Ngài” hoặc “tin nơi Ngài”.
  rationale: Nguyên văn lặp ἐν ᾧ; giữ lại cấu trúc này bảo tồn sắc thái thần học Phao-lô và sự mơ hồ cú pháp, trong khi chú thích cung cấp cách hiểu thành ngữ.
- issue: Ý nghĩa của “Thánh Linh của lời hứa”
  choice: Giữ cấu trúc “Đức Thánh Linh của lời hứa”.
  alternative: “Đức Thánh Linh đã được hứa ban”.
  rationale: Cấu trúc sở hữu Hy Lạp cô đọng và có thể chỉ Thánh Linh được Đức Chúa Trời hứa ban hoặc Thánh Linh gắn với lời hứa; bản chính không âm thầm thu hẹp về một cách giải thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để chỉ cộng đồng tín hữu số nhiều. “Tin mừng” ưu tiên tính dễ hiểu; “phúc âm” được giữ ở chú thích. Câu duy trì hai lần quy chiếu về Đấng Christ và hình ảnh “đóng ấn” của nguyên văn.
