id: EPH.1.2
reference: Ephesians 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: vi
  text: Nguyện ân điển và bình an từ Đức Chúa Trời, Cha chúng ta, và từ Chúa Giê-su, Đấng Mê-si[a], đến với anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa Giê-su Cơ Đốc.” Từ Hy Lạp Χριστός có thể được dùng như tước hiệu “Đấng Mê-si”, hoặc trong một số ngữ cảnh như một thành tố gần với tên riêng, “Cơ Đốc”.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Trong lời chào của Phao-lô, từ này vừa mang sắc thái chào chúc vừa chỉ ân huệ nhưng không của Đức Chúa Trời; “ân điển” giữ được chiều sâu thần học mà vẫn quen thuộc trong tiếng Việt.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Đây là đại từ số nhiều chỉ những người nhận thư. Cách diễn đạt này tự nhiên trong lời chúc tiếng Việt và thể hiện rõ đối tượng gồm cả cộng đồng.
- source_word: εἰρήνη
  choice: bình an
  rationale: “Bình an” diễn đạt tự nhiên cả trạng thái yên ổn lẫn âm hưởng rộng hơn của lời chúc shalom trong truyền thống Do Thái.
- source_word: ἀπὸ
  choice: từ
  rationale: Giới từ này nêu nguồn ban ân điển và bình an. Tiếng Việt lặp lại “từ” trước vế thứ hai để làm rõ hai danh xưng song song, dù tiếng Hy Lạp chỉ dùng giới từ một lần.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: 'Chuỗi sở hữu cách được hiểu theo quan hệ đồng vị: Đức Chúa Trời chính là Cha của chúng ta, chứ không phải “Đức Chúa Trời và Cha chúng ta” như hai đối tượng.'
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” giữ được sức nặng của tước hiệu κύριος trong cách dùng Tân Ước và phù hợp với văn phong tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: Ἰησοῦ được phiên âm như tên riêng, còn Χριστοῦ được dịch như tước hiệu “Đấng Mê-si”. Dấu phẩy thể hiện quan hệ đồng vị tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Cơ Đốc
  rationale: Χριστός có thể hoạt động như tước hiệu “Đấng Mê-si” hoặc trở thành thành tố gần như tên riêng trong cách dùng quen thuộc. Bản chính dịch ý nghĩa của tước hiệu, còn chú thích giữ cách gọi truyền thống để không che khuất độ linh hoạt của từ Hy Lạp.
- issue: Quan hệ giữa θεοῦ và πατρὸς ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  alternative: Đức Chúa Trời và Cha chúng ta
  rationale: Không có liên từ giữa hai danh ngữ trong tiếng Hy Lạp; cách hiểu đồng vị phù hợp nhất với công thức chào thăm của Phao-lô và tránh tạo cảm giác nói đến hai đối tượng.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Nguyện … đến với anh chị em” chuyển công thức chào chúc không có động từ trong tiếng Hy Lạp thành câu tự nhiên trong tiếng Việt; “anh chị em” biểu đạt số nhiều theo lối bao quát. Dấu phẩy quanh “Cha chúng ta” và “Đấng Mê-si” làm rõ quan hệ đồng vị.
