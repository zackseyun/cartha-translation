  text: οὐ παύομαι εὐχαριστῶν ὑπὲρ ὑμῶν ⸀μνείαν ποιούμενος ἐπὶ τῶν προσευχῶν μου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: vi
  text: Tôi không ngừng tạ ơn vì anh chị em, và nhắc đến anh chị em trong những lời cầu nguyện của tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παύομαι
  choice: Tôi không ngừng
  rationale: Diễn đạt hành động không ngưng nghỉ đang tiếp diễn, đồng thời giữ nhịp trang trọng của câu Hy Lạp.
- source_word: εὐχαριστῶν
  choice: tạ ơn
  rationale: Phân từ hiện tại diễn tả việc tạ ơn diễn ra đồng thời với ý 'không ngừng'; 'tạ ơn' tự nhiên và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh chị em
  rationale: Trong ngữ cảnh tạ ơn, ὑπέρ với sở hữu cách chỉ những người là nguyên do hoặc đối tượng liên hệ của lời tạ ơn; 'vì anh chị em' là cách nói tự nhiên trong tiếng Việt.
- source_word: μνείαν ποιούμενος
  choice: nhắc đến anh chị em
  rationale: Giữ sát thành ngữ Hy Lạp 'làm sự nhắc đến'; bổ sung tân ngữ 'anh chị em' vốn được ngữ cảnh hàm ý, mà không chuyển hẳn sang nghĩa diễn giải 'nhớ đến'.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: trong những lời cầu nguyện của tôi
  rationale: Diễn tả hoàn cảnh hoặc dịp mà việc nhắc đến diễn ra; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' cho đại từ số nhiều ὑμῶν nhằm bao quát cộng đồng tín hữu; liên từ 'và' làm rõ quan hệ giữa hai phân từ mà không thay đổi nội dung.
