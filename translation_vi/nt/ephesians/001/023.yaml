id: EPH.1.23
reference: Ephesians 1:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἥτις ἐστὶν τὸ σῶμα αὐτοῦ, τὸ πλήρωμα τοῦ τὰ πάντα ἐν πᾶσιν πληρουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/023.yaml
  text: which is his body[b][a], the fullness of the one who fills all things in all.
translation:
  language: vi
  text: Hội Thánh ấy là thân thể Ngài, là sự viên mãn[a] của Đấng làm đầy[b] mọi sự trong mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự viên mãn” cũng có thể được hiểu là “điều được làm đầy” hoặc “phần làm nên sự trọn vẹn.”
    reason: lexical_alternative
  - marker: b
    text: Phân từ Hy Lạp cũng có thể được hiểu là “Đấng được làm đầy,” dù đa số hiểu ở đây là “Đấng làm đầy.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἥτις
  choice: Hội Thánh ấy
  rationale: Đại từ quan hệ giống cái chỉ lại ἐκκλησία ở câu 22. Tiếng Việt tự nhiên cần nêu lại tiền ngữ; “ấy” giữ chức năng liên kết mà không làm nặng câu.
- source_word: τὸ σῶμα αὐτοῦ
  choice: thân thể Ngài
  rationale: Giữ nguyên ẩn dụ quen thuộc của Phao-lô về mối liên hệ giữa Hội Thánh và Đấng Christ.
- source_word: τὸ πλήρωμα
  choice: sự viên mãn
  rationale: Cách dịch này giữ được chiều sâu và tính đa nghĩa của danh từ, không quyết định rằng Hội Thánh chỉ là đối tượng được làm đầy hay là phần làm nên sự trọn vẹn.
- source_word: τοῦ ... πληρουμένου
  choice: của Đấng làm đầy
  rationale: Dù phân từ có hình thái trung động/bị động, ngữ cảnh ủng hộ nghĩa chủ động “Đấng làm đầy”; khả năng bị động được ghi ở chú thích.
- source_word: τὰ πάντα
  choice: mọi sự
  rationale: Diễn đạt tự nhiên một cụm số nhiều trung tính có phạm vi bao quát, đồng thời giữ sắc thái vũ trụ.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Bám sát cấu trúc cô đọng và giữ lại sự mơ hồ của πᾶσιν, thay vì thu hẹp thành “trong mọi người” hoặc diễn giải thành “trên mọi phương diện” ngay trong chính văn.
theological_decisions:
- issue: Ý nghĩa của πλήρωμα trong quan hệ giữa Hội Thánh và Đấng Christ
  choice: Dịch là “sự viên mãn” và không giải nghĩa thêm trong chính văn.
  alternative: “điều được làm đầy” hoặc “phần làm nên sự trọn vẹn”
  rationale: Nguyên văn cho phép nhiều cách hiểu có liên hệ gần nhau; cách dịch được chọn bảo tồn sự căng thẳng thần học thay vì quyết định vượt quá lời văn.
- issue: Thái của πληρουμένου
  choice: 'Hiểu theo nghĩa chủ động: “Đấng làm đầy”.'
  alternative: “Đấng được làm đầy”
  rationale: Nghĩa chủ động phù hợp ngữ cảnh hơn, nhưng hình thái Hy Lạp vẫn cho phép cách hiểu bị động nên cần ghi nhận trong chú thích.
- issue: Phạm vi của ἐν πᾶσιν
  choice: Giữ cách nói “trong mọi sự”.
  alternative: “trên mọi phương diện” hoặc “trong mọi người”
  rationale: Cụm Hy Lạp ngắn gọn và có thể được hiểu theo nhiều cách; bản dịch không thu hẹp phạm vi một cách không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hội Thánh ấy” nối rõ với câu trước; “sự viên mãn” giữ thuật ngữ cô đọng, còn “trong mọi sự” cố ý bảo tồn độ mở của nguyên văn.
