id: EPH.1.3
reference: Ephesians 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: vi
  text: Chúc tụng Đức Chúa Trời, là Cha của Chúa chúng ta là Đức Giê-su, Đấng Mê-si, là Đấng đã ban phước cho chúng ta bằng mọi phước lành thuộc linh[b] trong các cõi trên trời[c], trong Đấng Mê-si[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách gọi truyền thống: “Đức Chúa Giê-su Christ” và “trong Đấng Christ.” Từ Hy Lạp Χριστός là danh hiệu có nghĩa “Đấng Mê-si,” tức “Đấng Được Xức Dầu.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể hiểu: “mọi phước lành do Thánh Linh ban” hoặc “mọi phước lành thuộc về Thánh Linh.” Tính từ Hy Lạp có thể mang nghĩa rộng là “thuộc linh” hoặc chỉ điều liên hệ đến Thánh Linh.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “trong những nơi trên trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Chúc tụng
  rationale: Dạng tính từ vị ngữ trong lời tôn tụng; “Chúc tụng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và hướng lời ca ngợi về Đức Chúa Trời.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Đức Chúa Trời, là Cha
  rationale: 'Giữ cả hai danh xưng và diễn đạt quan hệ đồng vị tự nhiên trong tiếng Việt: Đức Chúa Trời chính là Cha của Chúa Giê-su.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: của Chúa chúng ta
  rationale: “Chúa” giữ lực danh hiệu của κύριος; trật tự này tự nhiên trong tiếng Việt.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Giê-su là tên riêng; Χριστός mang nghĩa danh hiệu “Đấng Mê-si.” Dấu phẩy giúp người đọc nhận ra đây là danh hiệu.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: Ngài đã ban phước cho chúng ta
  rationale: Phân từ aorist chỉ hành động Đức Chúa Trời đã thực hiện; “ban phước” là kết hợp từ tự nhiên và phân biệt với lời “chúc tụng” dành cho Đức Chúa Trời.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: bằng mọi phước lành thuộc linh
  rationale: “Bằng” thể hiện phương diện/nội dung của việc ban phước theo lối Việt tự nhiên; “mọi” giữ tính bao quát của πάσῃ, còn “thuộc linh” bảo lưu độ rộng nghĩa của πνευματικῇ.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ở các cõi trên trời
  rationale: Cụm tính từ số nhiều chỉ phạm vi thiên giới; “các cõi trên trời” vừa dễ hiểu vừa không thu hẹp thành những địa điểm vật chất cụ thể.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ cấu trúc cô đọng “trong” vốn quan trọng trong thần học Phao-lô, đồng thời dịch nghĩa danh hiệu Χριστός.
theological_decisions:
- issue: Cách dịch Χριστός trong các công thức của Phao-lô
  choice: Đấng Mê-si trong cả “Đức Giê-su, Đấng Mê-si” và “trong Đấng Mê-si”
  alternative: Đấng Christ / Đức Chúa Giê-su Christ / trong Đấng Christ
  rationale: Χριστός vẫn có lực danh hiệu và tương ứng với “Đấng Mê-si.” Cách dịch này làm rõ ý nghĩa thay vì chỉ phiên chuyển theo truyền thống, nhưng chú thích vẫn ghi nhận cách gọi quen thuộc.
- issue: Ý nghĩa của πνευματικῇ
  choice: thuộc linh
  alternative: do Thánh Linh ban / thuộc về Thánh Linh
  rationale: Tính từ có thể chỉ tính chất thuộc linh nói chung hoặc điều liên hệ đến Thánh Linh. Bản chính giữ độ rộng nghĩa; chú thích nêu khả năng cụ thể hơn.
- issue: Phạm vi bổ nghĩa của ἐν τοῖς ἐπουρανίοις và ἐν Χριστῷ
  choice: đặt “trong Đấng Mê-si” gần động từ và để “ở các cõi trên trời” bổ nghĩa cho toàn cụm phước lành
  alternative: “bằng mọi phước lành thuộc linh ở các cõi trên trời trong Đấng Mê-si” theo sát thứ tự Hy Lạp
  rationale: 'Tiếng Việt cần sắp xếp lại để tránh cách hiểu vụng rằng Đấng Mê-si ở trong các cõi. Câu vẫn bảo lưu hai phạm vi: các phước lành thuộc thiên giới và được ban trong sự hiệp nhất với Đấng Mê-si.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời,” “Chúa,” “Đức Giê-su” theo lối Kinh Thánh Việt ngữ quen thuộc; dùng “Đấng Mê-si” để chuyển nghĩa danh hiệu Χριστός. Dấu chấm than phản ánh sắc thái lời tôn tụng mở đầu, còn câu thứ hai giúp tránh một câu tiếng Việt quá dài.
