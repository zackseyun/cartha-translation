id: EPH.1.14
reference: Ephesians 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: vi
  text: Ngài là bảo chứng cho cơ nghiệp của chúng ta, hướng đến sự cứu chuộc phần sở hữu[a], để vinh quang Ngài được ca ngợi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phần sở hữu” có thể chỉ dân mà Đức Chúa Trời đã nhận làm của riêng, hoặc phần đã được dành để thuộc về Ngài.
    reason: Làm rõ phạm vi nghĩa của περιποίησις mà không khóa câu vào một cách giải thích duy nhất.
lexical_decisions:
- source_word: ὅ
  choice: Ngài
  rationale: Đại từ chỉ về Đức Thánh Linh trong văn cảnh trước; tiếng Việt dùng đại từ tôn kính chỉ ngôi vị, thay vì dịch máy móc theo giống trung của danh từ Hy Lạp πνεῦμα.
- source_word: ἀρραβών
  choice: bảo chứng
  rationale: Diễn đạt khoản bảo đảm được trao trước, vừa xác nhận vừa bảo đảm việc nhận trọn cơ nghiệp; tự nhiên và trang trọng hơn “tiền đặt cọc” trong văn cảnh này.
- source_word: κληρονομία
  choice: cơ nghiệp
  rationale: Giữ ý phần thừa hưởng được hứa ban và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: εἰς
  choice: hướng đến
  rationale: Giữ sắc thái định hướng/mục tiêu của giới từ, không thu hẹp chắc chắn thành chỉ thời gian hay chỉ mục đích.
- source_word: περιποίησις
  choice: phần sở hữu
  rationale: Giữ nghĩa về điều hay dân được dành làm sở hữu mà không tự ý xác định hoàn toàn chủ thể sở hữu trong chính câu.
- source_word: ἔπαινος τῆς δόξης
  choice: để vinh quang Ngài được ca ngợi
  rationale: Chuyển cấu trúc danh từ Hy Lạp thành câu tự nhiên trong tiếng Việt mà vẫn bảo toàn mục đích tôn vinh.
theological_decisions:
- issue: “Sự cứu chuộc phần sở hữu” chỉ về ai hoặc điều gì
  choice: Giữ cách nói mở “phần sở hữu” và giải thích trong chú thích
  alternative: “để dân thuộc về Ngài được cứu chuộc” hoặc “cho đến khi chúng ta được cứu chuộc hoàn toàn”
  rationale: Cụm τῆς περιποιήσεως có thể được hiểu là dân mà Đức Chúa Trời đã nhận làm của riêng, hoặc điều được dành làm sở hữu; nguyên văn không nói rõ chủ thể ngay trong cụm từ, nên không nên âm thầm giải quyết sự nhập nhằng.
- issue: Sắc thái của εἰς trước ἀπολύτρωσιν
  choice: “hướng đến”
  alternative: “cho đến khi” hoặc “nhằm”
  rationale: “Hướng đến” bảo tồn độ mở giữa đích đến, kết quả và mục tiêu vốn có trong giới từ εἰς.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Bảo chứng” tránh sắc thái giao dịch quá đời thường của “tiền đặt cọc”, còn “hướng đến” giữ được sự căng nghĩa của nguyên văn.
