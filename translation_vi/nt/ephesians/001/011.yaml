language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: vi
  text: Trong Đấng ấy, chúng ta cũng đã được chọn làm cơ nghiệp của Đức Chúa Trời[a], là những người đã được định trước theo mục đích của Đấng thực hiện mọi sự theo ý định của ý muốn Ngài,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng ta cũng đã nhận được một cơ nghiệp.” Động từ Hy Lạp có thể được hiểu là nhận được cơ nghiệp hoặc được chọn làm phần sở hữu, tức cơ nghiệp, của Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Đấng ấy
  rationale: Đại từ quan hệ chỉ về Đấng Christ trong văn cảnh trước; cách dịch này tự nhiên, trang trọng và giữ được ý ở trong sự hiệp nhất với Đấng Christ.
- source_word: ἐκληρώθημεν
  choice: đã được làm thành cơ nghiệp của Đức Chúa Trời
  rationale: Thể bị động của κληρόω có thể diễn tả việc được chỉ định làm phần sở hữu hay cơ nghiệp. Cách dịch này giữ nghĩa được ưu tiên theo bối cảnh giao ước; cụm “của Đức Chúa Trời” được thêm để làm rõ ý hàm ẩn, còn cách hiểu khả dĩ khác được ghi ở chú thích.
- source_word: προορισθέντες
  choice: vì đã được định trước
  rationale: Phân từ diễn tả một sự ấn định từ trước. “Được định trước” truyền đạt trực tiếp ý nghĩa từ vựng mà không đưa thêm một hệ thống thần học vào câu; “vì” thể hiện quan hệ giải thích hợp lý của phân từ với mệnh đề chính.
- source_word: κατὰ πρόθεσιν
  choice: theo mục đích
  rationale: πρόθεσις ở đây chỉ ý định có chủ đích; “theo mục đích” vừa sát nguyên văn vừa tự nhiên trong tiếng Việt.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: của Đấng thực hiện mọi sự
  rationale: Phân từ có mạo từ chỉ Đức Chúa Trời là chủ thể hành động. “Thực hiện” diễn đạt hiệu lực của ἐνεργέω rõ ràng hơn “làm việc” trong tiếng Việt, mà không quy định quá mức phương thức hành động.
- source_word: τὰ πάντα
  choice: mọi sự
  rationale: Giữ nguyên phạm vi bao quát trong lời khẳng định của Phao-lô.
- source_word: κατὰ τὴν βουλὴν
  choice: theo quyết định
  rationale: βουλή mang sắc thái suy xét rồi quyết định. “Quyết định” là cách nói hiện đại, tự nhiên và vẫn giữ chiều kích chủ ý, trong khi “mưu định” dễ mang sắc thái tiêu cực hoặc cổ.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: của ý muốn Ngài
  rationale: Giữ quan hệ sở hữu của nguyên văn và diễn đạt ý muốn thuộc về Đức Chúa Trời bằng lối văn trang trọng, dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của ἐκληρώθημεν
  choice: Các tín hữu được làm thành cơ nghiệp, tức phần dân thuộc về Đức Chúa Trời.
  alternative: Các tín hữu nhận được một cơ nghiệp.
  rationale: Dạng bị động của κληρόω cho phép cả hai cách hiểu. Bối cảnh về mục đích cứu chuộc của Đức Chúa Trời và nền tảng Cựu Ước về dân Ngài là cơ nghiệp của Ngài ủng hộ cách dịch chính, nhưng cách hiểu “nhận cơ nghiệp” vẫn có cơ sở và được giữ trong chú thích.
- issue: Phạm vi hành động của Đức Chúa Trời trong τὰ πάντα
  choice: Giữ nguyên lời khẳng định bao quát “mọi sự” mà không giải thích thêm cách thức hoặc quan hệ nhân quả.
  alternative: Thu hẹp thành mọi sự thuộc kế hoạch cứu rỗi trong văn cảnh.
  rationale: Nguyên văn dùng cụm từ bao quát và không nêu giới hạn tại đây; bản dịch không nên tự ý thu hẹp hoặc biến câu này thành một tuyên bố thần học chi tiết hơn điều Phao-lô trực tiếp nói.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc một câu vì câu này tiếp nối văn mạch dài của Ê-phê-sô 1:3–14. Dùng “Đấng ấy” để chỉ Đấng Christ và “Ngài” để chỉ Đức Chúa Trời. Dấu phẩy cuối câu được giữ theo dữ liệu câu trích, vốn tiếp nối sang câu 12.
