source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: vi
  text: quyền năng mà Ngài đã thi thố trong Đấng Mê-si[a] khi khiến Đấng ấy sống lại từ cõi chết và đặt ngồi bên phải Ngài trong các nơi trên trời[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đấng Christ.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “trong các cõi trên trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: mà
  rationale: Đại từ quan hệ giống cái liên kết với ý niệm về quyền năng ở câu trước; tiếng Việt dùng “mà” tự nhiên và không cần biểu thị giống ngữ pháp.
- source_word: ἐνήργηκεν
  choice: đã thi thố
  rationale: Diễn đạt việc Đức Chúa Trời vận dụng quyền năng cách hữu hiệu, đồng thời phù hợp với tân ngữ được hiểu từ ngữ cảnh trước.
- source_word: ἐν τῷ Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ giới từ ἐν và thể hiện Χριστός như tước hiệu cứu thế; “Đấng Mê-si” là cách gọi hiện đại, dễ hiểu trong tiếng Việt.
- source_word: ἐγείρας αὐτὸν
  choice: khi khiến Đấng ấy sống lại
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian, không xác quyết quá mức quan hệ thời gian hay phương tiện; “Đấng ấy” làm rõ đối tượng là Đấng Mê-si.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt về sự phục sinh, tương ứng với thành ngữ Hy Lạp chỉ việc ra khỏi tình trạng hay phạm vi của những người chết.
- source_word: καθίσας
  choice: và đặt ngồi
  rationale: Giữ hành động thứ hai song song với ἐγείρας và biểu thị Đức Chúa Trời là Đấng đặt Đấng Mê-si vào vị trí tôn cao.
- source_word: ἐν δεξιᾷ αὐτοῦ
  choice: bên phải Ngài
  rationale: Thành ngữ tiếng Việt chỉ vị trí danh dự và quyền uy, thay vì hiểu theo nghĩa ở trong bàn tay phải.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: trong các cõi trên trời
  rationale: Diễn đạt tính chất số nhiều và phạm vi thiên thượng của cụm tính từ được danh từ hóa, bằng ngôn ngữ tự nhiên hơn “trong những thuộc thiên”.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này từ mang chức năng tước hiệu; bản dịch chính nêu rõ ý nghĩa Mê-si, còn cách phiên âm truyền thống được giữ trong chú thích.
- issue: Phạm vi nghĩa của ἐν τοῖς ἐπουρανίοις
  choice: trong các cõi trên trời
  alternative: tại những nơi trên trời
  rationale: “Các cõi trên trời” truyền đạt phạm vi thiên thượng mà không buộc cụm từ chỉ những địa điểm cụ thể; phương án sát hình thức địa điểm được ghi chú.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Câu được giữ ở dạng mệnh đề tiếp nối câu trước vì ἣν phụ thuộc vào tiền ngữ trong Ê-phê-sô 1:19. Dùng “Đấng ấy” để tránh việc chuỗi đại từ “Ngài” khiến độc giả khó phân biệt Đức Chúa Trời với Đấng Mê-si.
