  naturalness: “Đặt ngồi bên phải Ngài” là cách diễn đạt trang trọng, tự nhiên trong văn phong Kinh Thánh hiện đại. Tuy nhiên, “các cõi trên trời” có thể gợi nhiều tầng/cõi vũ trụ và kém trực tiếp hơn cụm định ngữ được danh từ hóa ἐν τοῖς ἐπουρανίοις. “Các nơi trên trời” vừa tự nhiên vừa sát nghĩa locative hơn.
