revisions:
- from: để chúng ta, là những người đã đặt hy vọng nơi Đấng Mê-si-a từ trước,[a] làm nên lời ca ngợi vinh quang của Ngài.
  to: để chúng ta là những người đã đặt hy vọng nơi Đấng Mê-si-a từ trước trở nên sự ca ngợi vinh quang của Ngài.[a]
  rationale: Sửa riêng cách diễn đạt mục đích “làm nên lời ca ngợi” thành “trở nên sự ca ngợi”, sát εἰς τὸ εἶναι ... εἰς ἔπαινον hơn và không gợi nghĩa sáng tác. Đồng thời đặt cụm xác định nhóm không chen giữa hai dấu phẩy. Cách dịch “đã đặt hy vọng ... từ trước” cùng chú thích thay thế tiếp tục bảo toàn sự dè dặt trước nghĩa đang được tranh luận của προηλπικότας.
