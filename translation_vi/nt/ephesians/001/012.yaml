base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: vi
  text: để chúng ta là những người đã đặt hy vọng nơi Đấng Mê-si-a từ trước trở nên sự ca ngợi vinh quang của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “là những người đầu tiên đặt hy vọng nơi Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: để ... làm nên
  rationale: Cấu trúc εἰς với động từ nguyên mẫu có mạo từ diễn tả mục đích hoặc kết quả. Cách diễn đạt này tự nhiên trong tiếng Việt mà vẫn giữ lực hướng đích của câu.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Đại từ này chỉ nhóm có cả người nói; trong cấu trúc tiếng Việt của mệnh đề mục đích, dạng chủ ngữ “chúng ta” là phù hợp.
- source_word: εἰς ἔπαινον
  choice: làm nên lời ca ngợi
  rationale: Cách dịch này diễn đạt tự nhiên ý một dân được định hướng đến việc đem lại sự ca ngợi, đồng thời tránh lối nói cứng “trở nên cho sự ca ngợi”.
- source_word: δόξης αὐτοῦ
  choice: vinh quang của Ngài
  rationale: Giữ nguyên kết cấu sở hữu và thuật ngữ thần học giàu ý nghĩa δόξα; “Ngài” phù hợp với văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: τοὺς προηλπικότας
  choice: là những người đã đặt hy vọng ... từ trước
  rationale: Phân từ hoàn thành của προελπίζω chỉ sự hy vọng có trước và còn liên hệ đến hiện tại. Cách dịch này giữ ý thời gian mà không khẳng định quá mức rằng đây nhất thiết là nhóm đầu tiên theo trình tự lịch sử.
- source_word: ἐν τῷ Χριστῷ
  choice: nơi Đấng Mê-si-a
  rationale: ἐν ở đây chỉ đối tượng hoặc phạm vi đặt hy vọng. Dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si-a”, giữ ý “Đấng Được Xức Dầu” thay vì biến tước hiệu thành tên riêng.
theological_decisions:
- issue: προηλπικότας có nghĩa đơn giản là đã hy vọng từ trước hay xác định một nhóm là những người đầu tiên hy vọng
  choice: đã đặt hy vọng nơi Đấng Mê-si-a từ trước
  alternative: là những người đầu tiên đặt hy vọng nơi Đấng Mê-si-a
  rationale: Tiền tố προ- biểu thị tính có trước, nhưng bản văn không tự nó giải quyết dứt khoát liệu đây có phải là nhóm đầu tiên trong lịch sử cứu chuộc hay không. Bản chính giữ cách hiểu thận trọng hơn, còn cách hiểu mạnh hơn được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dấu phẩy bao quanh cụm giải thích giúp câu dài sáng nghĩa; thuật ngữ “vinh quang” và tước hiệu “Đấng Mê-si-a” được giữ vì sức nặng thần học.
