reference: Ephesians 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: vi
  text: Ngài đã định trước cho chúng ta được nhận làm con[a] qua Đức Chúa Giê-su, Đấng Được Xức Dầu[b], cho chính Ngài[c], theo ý tốt của ý muốn Ngài,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ việc được đặt vào địa vị của một người con trai trong gia đình, nhấn mạnh địa vị pháp lý và quyền thừa kế.
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Ki-tô” hoặc “Đấng Mê-si-a.” Từ Hy Lạp Christos là tước hiệu có nghĩa “Đấng Được Xức Dầu.”
    reason: alternative_reading
  - marker: c
    text: Hay “về chính Ngài.” Cụm từ Hy Lạp có thể chỉ hướng đến Ngài hoặc mục đích dành cho chính Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: đã định trước
  rationale: Diễn đạt trực tiếp ý nghĩa quyết định từ trước của προορίζω, đồng thời tránh biến từ này thành một thuật ngữ hệ phái. Dạng phân từ được thể hiện tự nhiên trong tiếng Việt theo mạch câu dài của 1:3–14.
- source_word: εἰς υἱοθεσίαν
  choice: được nhận làm con
  rationale: Cách nói tự nhiên trong tiếng Việt cho địa vị được nhận làm con; chú thích bảo lưu sắc thái pháp lý và yếu tố 'con trai' trong từ Hy Lạp.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qua Đức Chúa Giê-su, Đấng Được Xức Dầu
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian. Χριστός được dịch theo nghĩa tước hiệu là 'Đấng Được Xức Dầu', thay vì bị xem như một phần tên riêng.
- source_word: εἰς αὐτόν
  choice: để thuộc về chính Ngài
  rationale: Diễn đạt tự nhiên đích hướng về Đức Chúa Trời trong việc nhận làm con. Chú thích giữ lại khả năng hiểu là 'cho chính Ngài' hoặc 'về với chính Ngài'.
- source_word: κατὰ τὴν εὐδοκίαν
  choice: theo ... tốt lành
  rationale: κατά diễn tả sự phù hợp với; εὐδοκία mang nghĩa sự vui lòng hay chủ ý tốt lành. Trong tiếng Việt, cụm này được kết hợp tự nhiên với 'ý muốn'.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ý muốn tốt lành của Ngài
  rationale: Giữ nghĩa trực tiếp của θέλημα là 'ý muốn', không đổi thành 'kế hoạch' hay 'mục đích', đồng thời diễn đạt εὐδοκία bằng tính chất tốt lành của ý muốn ấy.
theological_decisions:
- issue: Ý nghĩa của προορίσας trong ngữ cảnh có tranh luận thần học
  choice: đã định trước
  alternative: đã quyết định từ trước; đã tiền định
  rationale: Bản dịch giữ nguyên lực từ vựng về một quyết định có trước, nhưng không đưa thêm một hệ thống thần học về sự tiền định ngoài điều câu văn khẳng định.
- issue: Sắc thái giới tính và pháp lý của υἱοθεσία
  choice: được nhận làm con
  alternative: được lập làm con trai; được ban địa vị làm con
  rationale: Cách dịch chính tự nhiên và áp dụng rõ cho toàn thể người tin; chú thích cho biết từ Hy Lạp nói theo nghĩa đen đến địa vị của người con trai, vốn gắn với quyền thừa kế trong bối cảnh cổ đại.
- issue: Tước hiệu Χριστοῦ
  choice: Đấng Được Xức Dầu
  alternative: Đấng Ki-tô; Đấng Mê-si
  rationale: Dịch nghĩa tước hiệu Hy Lạp thay vì chỉ phiên âm, nhờ đó người đọc hiện đại nhận ra đây là một tước hiệu.
- issue: Hướng hoặc mục đích của εἰς αὐτόν
  choice: để thuộc về chính Ngài
  alternative: cho chính Ngài; về với chính Ngài
  rationale: Cách dịch chính diễn đạt tự nhiên việc Đức Chúa Trời là đích đến của sự nhận làm con, còn chú thích bảo lưu độ mở giữa hướng đến Ngài và mục đích cho chính Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dạng nối tiếp bằng dấu phẩy vì đây là một phần của câu chúc tụng dài trong Ê-phê-sô 1:3–14. Đại từ “Ngài” theo ngữ cảnh chỉ Đức Chúa Trời là Cha.
