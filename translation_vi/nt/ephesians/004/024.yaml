id: EPH.4.24
reference: Ephesians 4:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐνδύσασθαι τὸν καινὸν ἄνθρωπον τὸν κατὰ θεὸν κτισθέντα ἐν δικαιοσύνῃ καὶ ὁσιότητι τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/024.yaml
  text: and to put on the new man[d][c][b][a], created according to God in righteousness and holiness of the truth.
translation:
  language: vi
  text: và mặc lấy con người mới[a], được dựng nên theo Đức Chúa Trời[b], trong sự công chính[c] và thánh khiết của chân lý.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bản ngã mới” hoặc “người mới”. Tiếng Hy Lạp là “con người mới”, tương ứng với “con người cũ” trong văn cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “giống Đức Chúa Trời” hoặc “theo khuôn mẫu của Đức Chúa Trời”.'
    reason: lexical_alternative
  - marker: c
    text: Từ này cũng có thể mang nghĩa “công lý”.
    reason: alternative_reading
  - marker: d
    text: 'Cũng có thể dịch: “trong sự công chính và thánh khiết chân thật” hoặc “đến từ chân lý”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδύσασθαι
  choice: mặc lấy
  rationale: Giữ nguyên hình ảnh mặc áo và nối tự nhiên với ý “cởi bỏ/mặc lấy” trong văn cảnh.
- source_word: καινὸν ἄνθρωπον
  choice: con người mới
  rationale: “Con người” diễn đạt ἄνθρωπος tự nhiên trong tiếng Việt, đồng thời giữ mối liên hệ trực tiếp với “con người cũ” ở câu trước; tránh thu hẹp thành “bản ngã”.
- source_word: κατὰ θεὸν
  choice: theo Đức Chúa Trời
  rationale: Giữ cấu trúc κατά với nghĩa phù hợp theo khuôn mẫu hoặc phù hợp với Đức Chúa Trời, nhưng không giải nghĩa quá mức trong chính văn.
- source_word: κτισθέντα
  choice: được dựng nên
  rationale: Thể bị động và ngôn ngữ sáng tạo được bảo tồn; “dựng nên” trang trọng nhưng vẫn quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: δικαιοσύνῃ
  choice: sự công chính
  rationale: Là cách dịch thần học thông dụng của δικαιοσύνη trong văn mạch Phao-lô; “công lý” được ghi nhận như khả năng khác.
- source_word: ὁσιότητι
  choice: sự thánh khiết
  rationale: Diễn đạt phẩm chất thánh thiện, phù hợp với sắc thái đạo đức và hướng về Đức Chúa Trời của ὁσιότης.
- source_word: τῆς ἀληθείας
  choice: của chân lý
  rationale: Giữ quan hệ sở hữu/genitive và sự mơ hồ về việc cụm này bổ nghĩa cho cả “công chính” lẫn “thánh khiết”, thay vì quyết định thành tính từ “chân thật”.
theological_decisions:
- issue: Cách diễn đạt nhân học trong “con người mới”
  choice: con người mới
  alternative: bản ngã mới; người mới
  rationale: Cách chọn này giữ danh từ ἄνθρωπος và sự đối ứng với “con người cũ”, nhưng trong tiếng Việt không mang nghĩa giới tính nam như từ “man” trong tiếng Anh.
- issue: Ý nghĩa của κατὰ θεόν
  choice: theo Đức Chúa Trời
  alternative: giống Đức Chúa Trời; theo hình ảnh Đức Chúa Trời
  rationale: Bản chính văn bảo tồn cách nói cô đọng và khả năng chỉ sự phù hợp với Đức Chúa Trời; các cách khác giải thích rõ hơn nhưng có thể đưa thêm ý “hình ảnh” không hiện diện trực tiếp.
- issue: Quan hệ của τῆς ἀληθείας với hai danh từ
  choice: sự công chính và thánh khiết của chân lý
  alternative: sự công chính và thánh khiết chân thật; sự công chính và thánh khiết đến từ chân lý
  rationale: Giữ nguyên cấu trúc sở hữu để không quyết định liệu genitive mang tính phẩm chất hay nguồn gốc, và để ngỏ khả năng bổ nghĩa cho cả hai danh từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mặc lấy” giữ ẩn dụ nguyên văn; “con người mới” tự nhiên hơn “người nam mới” và chính xác về phạm vi nghĩa. Cấu trúc “của chân lý” hơi cô đọng nhưng được giữ có chủ ý để bảo tồn sự mơ hồ của nguyên ngữ.
