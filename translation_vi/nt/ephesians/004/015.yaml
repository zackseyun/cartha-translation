source:
  edition: SBLGNT
  text: ἀληθεύοντες δὲ ἐν ἀγάπῃ αὐξήσωμεν εἰς αὐτὸν τὰ πάντα, ὅς ἐστιν ἡ κεφαλή, ⸀Χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/015.yaml
  text: but speaking truth in love[a], let us grow in every way into him who is the head, Messiah[c][b],
translation:
  language: vi
  text: Nhưng, nói sự thật trong tình yêu thương[a], chúng ta hãy lớn lên về mọi phương diện[b], hướng đến Đấng là đầu, tức là Đấng Mê-si-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sống chân thật” hoặc “thực hành sự thật”; động từ Hy Lạp có thể bao hàm cả lời nói chân thật lẫn cách sống theo sự thật.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong mọi sự”; sát chữ là “mọi sự”.'
    reason: lexical_alternative
  - marker: c
    text: Tiếng Hy Lạp là Χριστός, nghĩa là “Đấng được xức dầu”; tại đây được dịch là “Đấng Mê-si-a” vì từ này có chức năng danh hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀληθεύοντες
  choice: hãy nói sự thật
  rationale: Phân từ này có thể bao hàm cả lời nói chân thật lẫn việc sống theo sự thật. Trong ngữ cảnh đối lập với sự lừa dối và giáo huấn sai lạc, “nói sự thật” là cách diễn đạt tự nhiên; nghĩa rộng hơn được giữ trong chú thích.
- source_word: δὲ
  choice: nhưng
  rationale: Đánh dấu sự tương phản nhẹ với tình trạng chao đảo và bị lừa dối ở câu trước.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Giữ được cả sắc thái phương cách lẫn phạm vi của ἐν với tặng cách, đồng thời là cách nói trang trọng và quen thuộc trong tiếng Việt.
- source_word: αὐξήσωμεν
  choice: để chúng ta lớn lên
  rationale: Động từ giả định ngôi thứ nhất số nhiều mang lực khích lệ; cấu trúc tiếng Việt này diễn đạt lời kêu gọi chung một cách tự nhiên.
- source_word: εἰς αὐτὸν
  choice: hướng vào Đấng
  rationale: Giữ sắc thái định hướng của εἰς và hình ảnh tăng trưởng quy hướng, gắn kết vào Đấng Christ, thay vì làm phẳng thành “đến với”.
- source_word: τὰ πάντα
  choice: về mọi phương diện
  rationale: 'Trong cấu trúc với động từ “lớn lên”, cụm từ có nghĩa bao quát: lớn lên trong mọi mặt. Chú thích giữ cách dịch sát chữ hơn.'
- source_word: κεφαλή
  choice: đầu
  rationale: Dịch trực tiếp và bảo toàn ẩn dụ thân thể, không áp đặt cách hiểu tranh luận như “nguồn” hay “người có thẩm quyền”.
- source_word: Χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây từ này đứng đồng vị với “đầu” và có chức năng danh hiệu; “Đấng Mê-si-a” truyền đạt rõ chức năng ấy trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của ἀληθεύοντες
  choice: Dịch trong chính văn là “hãy nói sự thật”
  alternative: “hãy sống chân thật” hoặc “hãy thực hành sự thật”
  rationale: Ngữ cảnh gần nói đến giáo huấn sai lạc và sự lừa dối, nên nghĩa liên quan đến lời nói nổi bật; tuy nhiên, động từ có thể rộng hơn lời nói, vì vậy chú thích bảo lưu sự đa nghĩa.
- issue: Lực giải nghĩa của κεφαλή
  choice: Dịch đơn giản là “đầu”
  alternative: “nguồn” hoặc “người có thẩm quyền trên”
  rationale: Giữ nguyên ẩn dụ của Phao-lô mà không giải quyết trong bản dịch cuộc tranh luận thần học về hàm ý cụ thể của từ này.
- issue: Quan hệ cú pháp của Χριστός
  choice: “tức là Đấng Mê-si-a”
  alternative: “Đấng Christ”
  rationale: Cụm từ đồng vị xác định Đấng là đầu. Dịch như một danh hiệu giúp làm rõ chức năng của Χριστός mà không biến nó thành tên riêng thuần túy.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tình yêu thương” để diễn đạt ἀγάπη tự nhiên; viết hoa “Đấng” trong các cách gọi quy chiếu về Đấng Mê-si-a. Trật tự câu được điều chỉnh vừa phải để rõ nghĩa, đồng thời giữ hình ảnh tăng trưởng và “đầu” của nguyên văn.
