translation:
  language: vi
  text: và được đổi mới trong tinh thần của tâm trí anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu “tinh thần” ở đây là Thánh Linh, tức là anh chị em được Thánh Linh đổi mới. Tuy nhiên, cụm “của tâm trí anh chị em” nhiều khả năng chỉ chiều sâu nội tâm hoặc khuynh hướng chi phối tâm trí, hơn là trực tiếp nói đến Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνανεοῦσθαι
  choice: được đổi mới
  rationale: 'Giữ thể bị động của động từ nguyên mẫu hiện tại; cách dịch này tự nhiên và phù hợp với chuỗi ý trong văn cảnh: cởi bỏ, được đổi mới, mặc lấy. Tiến trình liên tục có thể được hàm ý mà không cần thêm trạng từ.'
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ là từ nối nhẹ trong chuỗi các động từ nguyên mẫu, không nhất thiết biểu thị sự tương phản mạnh.
- source_word: τῷ πνεύματι
  choice: trong tâm thần
  rationale: Hiểu cách ba như phạm vi hoặc phương diện của sự đổi mới. “Tâm thần” ở đây chỉ chiều sâu nội tâm hay khuynh hướng chi phối, đồng thời không loại bỏ hoàn toàn khả năng liên hệ đến Thánh Linh.
- source_word: νοὸς
  choice: tâm trí
  rationale: Diễn đạt trực tiếp năng lực nhận thức và suy nghĩ, đồng thời giữ được cấu trúc “tâm thần của tâm trí” vốn có phần khác thường trong nguyên văn.
- source_word: ὑμῶν
  choice: anh chị em
  rationale: Làm rõ đại từ ngôi thứ hai số nhiều bằng cách xưng hô tự nhiên, bao quát trong tiếng Việt hiện đại.
theological_decisions:
- issue: πνεύματι chỉ Thánh Linh hay tâm thần/khuynh hướng nội tâm của con người
  choice: “tâm thần của tâm trí anh chị em,” chủ yếu chỉ chiều sâu hoặc khuynh hướng nội tâm của tâm trí
  alternative: “bởi Thánh Linh trong tâm trí anh chị em”
  rationale: Cụm τοῦ νοὸς ὑμῶν bổ nghĩa tự nhiên nhất cho πνεύματι, tạo thành một cách diễn đạt về con người nội tâm. Tuy nhiên, chú thích bảo tồn khả năng hiểu πνεύματι là Thánh Linh, thay vì loại trừ dứt khoát.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc hơi khác thường “tâm thần của tâm trí” để phản ánh nguyên văn và bảo tồn sự mơ hồ thần học; “anh chị em” thể hiện rõ số nhiều của ὑμῶν.
