id: EPH.4.25
reference: Ephesians 4:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: vi
  text: Vì vậy, sau khi đã từ bỏ sự giả dối[a], mỗi người hãy nói sự thật với người lân cận mình, vì chúng ta là những chi thể của nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều dối trá.”'
    reason: Giữ khả năng hiểu danh từ có mạo từ τὸ ψεῦδος theo nghĩa xác định hoặc tập hợp, thay vì chỉ thói giả dối nói chung.
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với lời khuyên bảo ngay trước đó và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀποθέμενοι
  choice: sau khi đã từ bỏ
  rationale: Diễn đạt phân từ bất định quá khứ như hành động từ bỏ dứt khoát làm nền cho mệnh lệnh chính, nhưng không biến nó thành một mệnh lệnh độc lập.
- source_word: τὸ ψεῦδος
  choice: sự giả dối
  rationale: Chỉ thói giả dối như một phạm trù đạo đức trong thế đối lập với sự thật; cách dịch này tự nhiên hơn việc buộc mạo từ Hy Lạp thành một sự giả dối riêng biệt.
- source_word: λαλεῖτε ἀλήθειαν ἕκαστος
  choice: mỗi người hãy nói sự thật
  rationale: Thể hiện lực mệnh lệnh hiện tại và ý nghĩa phân phối của ἕκαστος đối với toàn thể cộng đoàn.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: với người lân cận mình
  rationale: Giữ nghĩa liên kết của μετά với sở hữu phản thân tự nhiên trong tiếng Việt; “người lân cận” bảo toàn sắc thái đạo đức-xã hội của πλησίον.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu trực tiếp lý do cho mệnh lệnh nói sự thật.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: chúng ta là những chi thể của nhau
  rationale: Giữ hình ảnh thân thể của μέλη và sự lệ thuộc hỗ tương được diễn đạt bằng ἀλλήλων, không diễn giải thành một ý thần học chi tiết hơn.
theological_decisions:
- issue: Phạm vi nghĩa của τὸ ψεῦδος
  choice: sự giả dối
  alternative: điều dối trá
  rationale: Văn cảnh khuyên bảo đạo đức nghiêng về thói giả dối nói chung, nhưng cấu trúc có mạo từ vẫn cho phép cách hiểu mang tính xác định hoặc tập hợp; khả năng ấy được giữ trong chú thích.
- issue: Ngôn ngữ phân phối có giống ngữ pháp
  choice: mỗi người ... người lân cận mình
  alternative: mỗi người ... người lân cận của người ấy
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở các cụm từ này. “Mình” truyền đạt tự nhiên quan hệ quy chiếu của αὐτοῦ mà không thêm giới tính không hiện diện như một giới hạn về nghĩa.
- issue: Ẩn dụ thân thể trong μέλη
  choice: những chi thể của nhau
  alternative: những bộ phận thuộc về nhau
  rationale: “Chi thể” giữ nguyên ẩn dụ về thân thể và cách nói hỗ tương gây suy ngẫm của nguyên văn, thay vì giải quyết sự căng thẳng bằng lối diễn giải “thuộc về nhau”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp để đọc công khai. “Người lân cận” cùng “chi thể” là các từ quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt, đồng thời giữ được hình ảnh và quan hệ của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
