    rationale: «Ân phúc» thiên về «phước lành» và không diễn đạt trực tiếp nét nghĩa «ân điển/ân huệ, sự ưu đãi» của χάρις. «Đem ân điển đến» gần nguyên văn hơn và vẫn tự nhiên trong văn phong Kinh Thánh hiện đại.
