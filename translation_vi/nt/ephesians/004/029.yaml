review_pass:
  verdict: revise
  source_fidelity: Bản dịch bảo toàn tốt cấu trúc mệnh lệnh phủ định, sự đối lập với lời tốt, ẩn dụ «xây dựng», và mục đích đối với người nghe. Tuy nhiên, «ân phúc» thường chỉ phước lành nhận được hơn là χάρις/ân điển hay sự ưu đãi được lời nói đem lại; vì vậy chưa sát nhất với χάριν trong câu này.
  naturalness: Câu nhìn chung tự nhiên và đúng văn phong hiện đại. «Lời thối nát» là một ẩn dụ hơi gắt nhưng có chủ ý và có thể chấp nhận được, vì phản ánh σαπρός. Thêm «hãy nói» sau «nhưng chỉ» giúp vế đối lập rõ và trôi chảy hơn trong tiếng Việt.
  terminology: Nên dùng «ân điển» thay cho «ân phúc» cho χάρις. Cách này giữ được từ vựng đặc trưng của Phao-lô mà không quyết định rằng lời nói tự nó ban ân cứu độ; ngữ cảnh vẫn giới hạn ý nghĩa ở điều lời nói đem đến cho người nghe.
