source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: vi
  text: Đừng để bất cứ lời thối nát nào thốt ra từ miệng anh em,[a] nhưng chỉ hãy nói lời tốt lành để xây dựng tùy theo nhu cầu,[b] hầu đem ân điển đến cho người nghe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời hư hoại” hoặc “lời độc hại”. Từ Hy Lạp theo nghĩa đen chỉ điều “thối nát, mục nát”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để xây dựng theo điều đang cần” hoặc “để xây dựng sao cho hợp lúc”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “hầu đem ích lợi đến cho người nghe”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: bất cứ lời thối nát nào
  rationale: 'Dưới mệnh lệnh phủ định, πᾶς với danh từ số ít mang nghĩa phân phối: không một lời nào thuộc loại ấy. “Thối nát” giữ hình ảnh mạnh của σαπρός, đồng thời có thể chỉ lời nói xấu xa, gây hại.'
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: Đừng để ... thốt ra từ miệng anh em
  rationale: Cách diễn đạt này thể hiện mệnh lệnh cấm và giữ hình ảnh lời nói đi ra từ miệng. “Anh em” là đại từ số nhiều, còn “miệng” số ít phản ánh lối diễn đạt tập hợp của nguyên văn.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: nhưng chỉ nói lời tốt lành
  rationale: Cấu trúc Hy Lạp lược bỏ danh từ λόγος đã nêu trước đó. Tiếng Việt thêm “nói lời” để câu tự nhiên; “chỉ” làm rõ sự tương phản giữa lời bị cấm và lời được chấp nhận.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: để xây dựng tùy theo nhu cầu
  rationale: “Xây dựng” giữ ẩn dụ của οἰκοδομή. Cụm sở hữu cách τῆς χρείας cô đọng và có thể hiểu là sự xây dựng phù hợp với nhu cầu hiện có; “tùy theo nhu cầu” giữ nét nghĩa ấy mà không đổi thành chỉ hoàn cảnh nói chung.
- source_word: ἵνα δῷ χάριν
  choice: hầu đem ân phúc đến
  rationale: χάρις tại đây có thể là ân phúc, ân huệ hoặc lợi ích. “Ân phúc” giữ sắc thái về ân điển và tác động tốt lành của lời nói, nhưng không khẳng định quá mức rằng chính lời nói ban ân cứu độ.
- source_word: τοῖς ἀκούουσιν
  choice: cho người nghe
  rationale: Diễn đạt tự nhiên cho phân từ hiện tại, chỉ những người đang nghe hoặc tiếp nhận lời nói.
theological_decisions:
- issue: Ý nghĩa của χάρις trong lời khuyên đạo đức
  choice: ân phúc
  alternative: ích lợi; ân huệ
  rationale: Ngữ cảnh nhấn mạnh lời nói có tác dụng tốt đối với người nghe. “Ân phúc” bảo tồn vốn từ đặc trưng của Phao-lô và sắc thái ban ơn, trong khi chú thích vẫn ghi nhận nghĩa thực dụng “ích lợi” mà không buộc câu vào một cách hiểu thần học hẹp.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Lời thối nát” cố ý giữ ẩn dụ sinh động của nguyên văn; “xây dựng” giữ ẩn dụ kiến thiết quen thuộc trong văn mạch cộng đồng. Nhịp câu mệnh lệnh–tương phản–mục đích được bảo toàn.
