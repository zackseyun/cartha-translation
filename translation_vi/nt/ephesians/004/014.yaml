id: EPH.4.14
reference: Ephesians 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: vi
  text: để chúng ta không còn là trẻ con, bị sóng đánh chao đảo và bị mọi luồng gió của những lời dạy cuốn đi, do trò lừa bịp của con người[a], do sự xảo quyệt nhằm vào những mưu chước lừa dối[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong trò chơi xúc xắc của con người”, một hình ảnh chỉ sự gian lận hay lừa bịp.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “hướng tới mưu chước của sự sai lạc” hoặc “trong mưu chước của sự lừa dối”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν
  choice: để chúng ta không còn là
  rationale: Diễn đạt tự nhiên sắc thái mục đích của ἵνα với động từ giả định, đồng thời giữ ý chấm dứt tình trạng trước đây của μηκέτι.
- source_word: νήπιοι
  choice: trẻ con
  rationale: Chỉ sự non nớt theo nghĩa ẩn dụ; cách nói này tự nhiên hơn “trẻ sơ sinh” trong ngữ cảnh.
- source_word: κλυδωνιζόμενοι
  choice: bị sóng đánh dạt
  rationale: 'Giữ hình ảnh hàng hải của động từ: bị sóng xô đẩy, không có sự ổn định.'
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: bị mọi luồng gió giáo huấn cuốn đi
  rationale: Giữ thể bị động và hình ảnh gió, đồng thời dịch διδασκαλία là “giáo huấn”, tức điều được dạy, chứ không giới hạn vào một hệ thống giáo lý chính thức.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: bởi trò lừa bịp của con người
  rationale: κυβεία vốn gợi việc chơi xúc xắc gian lận, rồi mở rộng thành sự lừa bịp; bản dịch chuyển tải nghĩa trong ngữ cảnh và chú thích giữ lại hình ảnh văn hóa.
- source_word: ἐν πανουργίᾳ
  choice: bởi sự xảo quyệt
  rationale: Thể hiện sự khôn ngoan gian trá, có sắc thái đạo đức tiêu cực của πανουργία.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: nhằm thực hiện mưu kế của sự sai lạc
  rationale: “Nhằm thực hiện” diễn đạt hướng đích của πρός; “mưu kế” giữ tính có phương pháp của μεθοδεία, còn “sự sai lạc” bảo tồn độ rộng của πλάνη giữa sai lầm và lừa dối.
theological_decisions:
- issue: Cách dịch διδασκαλία
  choice: giáo huấn
  alternative: giáo lý
  rationale: “Giáo huấn” là từ hiện đại, trang trọng và đủ rộng cho điều được truyền dạy; “giáo lý” có thể khiến câu chỉ đến hệ thống tín điều chính thức.
- issue: Cách dịch πλάνη
  choice: sự sai lạc
  alternative: sự lừa dối
  rationale: πλάνη có thể chỉ tình trạng lầm lạc hoặc sự lừa dối. “Sự sai lạc” giữ tính mơ hồ chân thực, trong khi các từ κυβεία và πανουργία đã nêu rõ yếu tố gian trá có chủ ý.
- issue: Quan hệ của πρός với μεθοδεία
  choice: nhằm thực hiện mưu kế
  alternative: trong mưu kế
  rationale: Cách chọn giữ sắc thái hướng tới hoặc nhằm vào của πρός mà không khẳng định quá mức rằng toàn bộ cụm chỉ phương tiện; câu Hy Lạp cô đọng và có thể được hiểu theo hơn một cách.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ chuỗi hình ảnh trẻ con, sóng và gió; tránh thuật ngữ giáo phái. Các dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong câu chính.
