revisions:
- from: Chỉ có một thân thể và một Thánh Linh[a], cũng như anh chị em đã được kêu gọi trong một niềm hy vọng thuộc về sự kêu gọi của mình.
  to: Có một thân thể và một Thánh Linh[a], như anh chị em cũng đã được kêu gọi trong một niềm hy vọng gắn liền với sự kêu gọi của anh chị em.
  rationale: Bản sửa loại bỏ “Chỉ có” để không thêm sắc thái loại trừ ngoài nguyên văn, phục hồi rõ sắc thái bổ sung của καί bằng “anh chị em cũng,” và thay cụm sở hữu cách không tự nhiên bằng một cách nói hiện đại, rõ nghĩa, vẫn bảo toàn quan hệ giữa niềm hy vọng và sự kêu gọi. Chú thích được giữ nguyên vì nó thích hợp để ghi nhận tính mơ hồ từ vựng của πνεῦμα.
  reviewer_model: gpt-5.6-terra
