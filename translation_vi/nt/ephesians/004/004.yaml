source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: vi
  text: Có một thân thể và một Thánh Linh[a], như anh chị em cũng đã được kêu gọi trong một niềm hy vọng gắn liền với sự kêu gọi của anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một linh”. Từ Hy Lạp có thể có nghĩa là “linh” hoặc “Thánh Linh”; trong công thức về sự hiệp nhất của phân đoạn này, từ ấy rất có thể chỉ Đức Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: một
  rationale: Giữ sự lặp lại có chủ ý nhằm nhấn mạnh tính hiệp nhất.
- source_word: σῶμα
  choice: thân thể
  rationale: Giữ nguyên ẩn dụ chỉ cộng đồng tín hữu hiệp nhất, không diễn giải quá mức thành một thuật ngữ giáo phái.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Trong công thức hiệp nhất của Ê-phê-sô 4:4–6, từ này rất có thể chỉ Đức Thánh Linh; ghi chú bảo lưu khả năng từ Hy Lạp có nghĩa là “linh”.
- source_word: καθὼς καὶ
  choice: cũng như
  rationale: Diễn đạt tự nhiên quan hệ so sánh và sắc thái bổ sung của καί trong tiếng Việt.
- source_word: ἐκλήθητε
  choice: đã được kêu gọi
  rationale: Giữ thể bị động, không nêu rõ tác nhân vốn cũng không được nêu trong nguyên văn.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: trong một niềm hy vọng
  rationale: Giữ giới từ ἐν và mô-típ “một”, đồng thời dùng cách diễn đạt dễ hiểu trong tiếng Việt.
- source_word: τῆς κλήσεως ὑμῶν
  choice: thuộc về sự kêu gọi của mình
  rationale: Thể hiện quan hệ sở thuộc/liên hệ của sở hữu cách và giữ liên hệ từ vựng giữa ἐκλήθητε với κλήσεως.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεῦμα
  choice: Thánh Linh
  alternative: linh; một thực tại hoặc tâm thái thiêng liêng chung giữa các tín hữu
  rationale: Chuỗi “một thân thể… một Thánh Linh… một Chúa… một Đức Chúa Trời và Cha” trong 4:4–6 ủng hộ mạnh mẽ cách hiểu là Đức Thánh Linh. Tuy nhiên, chữ Hy Lạp cổ không phân biệt viết hoa, nên ghi chú vẫn bảo lưu sự mơ hồ từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; dùng “của mình” để quy chiếu tự nhiên về cộng đồng người nghe. “Chỉ có” làm rõ cấu trúc tồn tại được hàm ý trong mệnh đề không có động từ của tiếng Hy Lạp.
