review_pass:
  verdict: revise
  source_fidelity: Bản nháp bảo toàn tốt mô-típ lặp lại của ἓν, ẩn dụ σῶμα, thể bị động của ἐκλήθητε, và cách hiểu rất có xác suất của πνεῦμα là Thánh Linh. Tuy nhiên, “Chỉ có” thêm sắc thái loại trừ/độc hữu mà mệnh đề danh từ tiếng Hy Lạp không phát biểu trực tiếp. Cụm “thuộc về sự kêu gọi của mình” cũng gây mơ hồ về sở chỉ của “mình” và không tự nhiên.
  naturalness: “Có một...” là cách mở đầu tự nhiên, sát với cấu trúc liệt kê của nguyên văn mà không thêm nhấn mạnh. “Niềm hy vọng gắn liền với sự kêu gọi của anh chị em” diễn đạt sở hữu cách τῆς κλήσεως ὑμῶν rõ ràng và tự nhiên hơn, đồng thời tránh để “mình” bị hiểu là từng cá nhân.
  terminology: “Thân thể,” “Thánh Linh,” “được kêu gọi,” và “niềm hy vọng” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích duy trì đúng tính không phân biệt chữ hoa/chữ thường của πνεῦμα trong tiếng Hy Lạp và không biến lựa chọn dịch thành một khẳng định giáo phái vượt quá văn mạch.
  issues:
  - severity: medium
    issue: “Chỉ có” trong câu mở đầu
    rationale: ἓν σῶμα καὶ ἓν πνεῦμα là một mệnh đề danh từ/liệt kê, khẳng định “một thân thể và một Thần/Linh”; từ “chỉ” thêm rõ nét ý loại trừ không được biểu đạt riêng trong nguyên văn.
  - severity: medium
    issue: “thuộc về sự kêu gọi của mình”
    rationale: Cụm này nặng và đại từ phản thân “mình” có thể quy về từng người thay vì nhóm người được ngỏ lời. Cần diễn đạt rõ quan hệ giữa “niềm hy vọng” và “sự kêu gọi” mà vẫn giữ tính liên hệ của sở hữu cách.
  - severity: low
    issue: Sắc thái “cũng” của καί chưa được nêu rõ trong vế sau
    rationale: “Cũng như” chủ yếu chuyển tải καθώς; thêm “cũng” sau chủ ngữ phản ánh tốt hơn καὶ gắn với việc người nghe đã được gọi.
