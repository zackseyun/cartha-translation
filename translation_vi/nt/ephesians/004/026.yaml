  terminology: “Phạm tội,” “mặt trời lặn,” và “cơn giận” đều chuẩn xác, dễ hiểu. Các chú thích phân biệt đúng giữa cách hiểu mệnh lệnh và nhượng bộ, đồng thời bảo tồn dải nghĩa của παροργισμός mà không quyết định quá mức.
