id: EPH.4.26
reference: Ephesians 4:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: vi
  text: Hãy giận mà đừng phạm tội.[a] Đừng để mặt trời lặn khi anh chị em vẫn còn giận.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu anh chị em giận thì đừng phạm tội.” Nguyên văn Hy Lạp có hình thức mệnh lệnh (“Hãy giận”), nhưng trong ngữ cảnh, một số người hiểu đây là lời nhượng bộ.'
    reason: alternative_reading
  - marker: b
    text: Phao-lô có lẽ nhắc lại Thi Thiên 4:4 (theo bản Bảy Mươi là 4:5), nối cơn giận với mệnh lệnh không được phạm tội.
    reason: cross_reference
  - marker: c
    text: Cụm từ này cũng có thể hiểu là “trên điều khiến anh chị em phẫn nộ” hoặc “khi anh chị em vẫn còn bực tức.” Từ Hy Lạp có thể chỉ cơn giận hoặc tình trạng hay nguyên nhân gây phẫn nộ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: Hãy giận
  rationale: Giữ nguyên lực mệnh lệnh của động từ Hy Lạp và tiếng vọng Thi Thiên 4:4 (LXX 4:5), thay vì chuyển ngay thành câu điều kiện. Cách dịch này vẫn để mệnh lệnh kế tiếp giới hạn cơn giận.
- source_word: μὴ ἁμαρτάνετε
  choice: mà đừng phạm tội
  rationale: Diễn đạt trực tiếp mệnh lệnh phủ định; liên từ “mà” tự nhiên trong tiếng Việt và làm rõ sự tương phản mà không thêm ý thần học.
- source_word: ὁ ἥλιος μὴ ἐπιδυέτω
  choice: Đừng để mặt trời lặn
  rationale: Cách nói tự nhiên trong tiếng Việt để chuyển tải mệnh lệnh ngôi thứ ba phủ định, đồng thời giữ nguyên hình ảnh mặt trời lặn.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: khi anh chị em vẫn còn giận
  rationale: παροργισμός có thể chỉ cơn giận, sự bực tức hoặc điều gây phẫn nộ. Trong ngữ cảnh, cách dịch này tự nhiên và nêu rõ rằng không được kéo dài trạng thái giận dữ, nhưng ghi chú vẫn bảo tồn các khả năng từ vựng khác.
theological_decisions:
- issue: Mệnh đề mở đầu là lời truyền khiến hay lời nhượng bộ có điều kiện
  choice: 'Dịch theo hình thức mệnh lệnh: “Hãy giận mà đừng phạm tội.”'
  alternative: “Nếu anh chị em giận thì đừng phạm tội.”
  rationale: 'Nguyên văn dùng hình thức mệnh lệnh. Giữ hình thức ấy bảo tồn sức căng của câu: lời này không mặc nhiên tán thành mọi cơn giận, vì ngay sau đó cơn giận bị giới hạn về đạo đức và thời gian.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm thể hiện cộng đồng người nhận; giữ hình ảnh cụ thể “mặt trời lặn” và cấu trúc mệnh lệnh của nguyên văn.
