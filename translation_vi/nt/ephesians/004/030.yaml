source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: vi
  text: Và đừng làm buồn Đức Thánh Linh của Đức Chúa Trời, trong Ngài, anh chị em đã được đóng ấn cho ngày cứu chuộc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến ngày cứu chuộc.” Tiếng Hy Lạp nói sát nghĩa là “cho ngày cứu chuộc” (εἰς ἡμέραν ἀπολυτρώσεως), một cách diễn đạt hướng tới ngày cứu chuộc trong tương lai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: làm buồn
  rationale: Mệnh lệnh hiện tại đi với μή diễn tả lời cấm. “Làm buồn” tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái đau buồn trong mối quan hệ, thay vì giảm nhẹ thành “xúc phạm”.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: Đức Thánh Linh của Đức Chúa Trời
  rationale: Giữ đầy đủ danh xưng và sở hữu cách τοῦ θεοῦ. “Đức Thánh Linh” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: ἐν ᾧ
  choice: trong Ngài
  rationale: Giữ giới từ ἐν và dùng đại từ chỉ ngôi để phản ánh Đấng được nói đến là Đức Thánh Linh, dù đại từ Hy Lạp mang giống trung theo danh từ πνεῦμα.
- source_word: ἐσφραγίσθητε
  choice: anh chị em đã được đóng ấn
  rationale: Diễn đạt thể thụ động và hành động được nhìn như đã xảy ra, đồng thời giữ nguyên hình ảnh ấn chứng mà không diễn giải thêm ý nghĩa sở hữu, xác nhận hay bảo vệ.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: cho ngày cứu chuộc
  rationale: “Cho” giữ sắc thái hướng tới mục tiêu của εἰς và vẫn tự nhiên trong tiếng Việt; cụm từ chỉ ngày cứu chuộc trong tương lai mà không buộc phải hiểu thuần túy theo nghĩa thời hạn.
theological_decisions:
- issue: Cách quy chiếu về Đức Thánh Linh trong mệnh đề quan hệ
  choice: Dùng “trong Ngài”
  alternative: “nhờ Ngài”; “trong đó”
  rationale: “Trong Ngài” giữ cấu trúc ἐν ᾧ và tính ngôi vị của Đức Thánh Linh; “nhờ Ngài” nghiêng rõ hơn về tác nhân, còn “trong đó” dễ tạo cảm giác phi ngôi vị.
- issue: Quan hệ giữa việc đóng ấn và ngày cứu chuộc
  choice: “cho ngày cứu chuộc”
  alternative: “đến ngày cứu chuộc”
  rationale: Cách dịch chính giữ lực hướng đích của εἰς và không áp đặt một kết luận thần học cụ thể về cơ chế hay thời hạn của việc đóng ấn. Cách hiểu theo hướng thời gian vẫn được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện số nhiều của ἐσφραγίσθητε; dùng “Đức Chúa Trời” và “Đức Thánh Linh” theo lối gọi quen thuộc trong cộng đồng Cơ Đốc nói tiếng Việt. Dấu chú thích được đặt ngay sau câu có liên quan.
