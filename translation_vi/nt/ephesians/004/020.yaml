  yaml_path: translation/nt/ephesians/004/020.yaml
  text: But you did not learn Messiah in this way,[a]
translation:
  language: vi
  text: Nhưng anh chị em không học Đấng Mê-si theo cách ấy,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng anh chị em không học Đấng Christ theo cách ấy.”'
    reason: Nêu cách dịch thay thế của Χριστόν, vốn có thể được hiểu và chuyển sang tiếng Việt bằng tước hiệu “Đấng Christ”.
lexical_decisions:
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được diễn đạt bằng cách xưng hô tự nhiên với cộng đồng tín hữu; sự tương phản và nhấn mạnh còn được thể hiện qua “Nhưng”.
- source_word: δὲ
  choice: Nhưng
  rationale: Biểu thị sự tương phản với lối sống của dân ngoại được mô tả ngay trước đó.
- source_word: οὐχ οὕτως
  choice: không ... theo cách ấy
  rationale: Cụm phủ định với οὕτως nói về cách thức, đối lập việc học Đấng Mê-si với nếp sống vừa được mô tả.
- source_word: ἐμάθετε
  choice: học
  rationale: Giữ nghĩa trực tiếp của μανθάνω và cấu trúc khác thường “học [một người]”, thay vì diễn giải thành “được dạy” hay “nhận biết”.
- source_word: τὸν Χριστόν
  choice: Đấng Mê-si
  rationale: Χριστός mang ý nghĩa tước hiệu; “Đấng Mê-si” giữ sắc thái này mà không tự ý thêm tên Giê-su.
theological_decisions:
- issue: Dịch Χριστόν như tước hiệu hay dạng gần với tên riêng
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh nói đến nhân vật trung tâm của lời công bố Tin Mừng, và dạng có mạo từ hỗ trợ việc giữ sắc thái tước hiệu. Chú thích bảo tồn cách gọi truyền thống “Đấng Christ” mà không giải quyết quá mức khả năng tên gọi hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện số nhiều và phù hợp lời hướng đến cộng đồng. Cấu trúc khác thường “học Đấng Mê-si” được cố ý giữ lại để bảo toàn cách diễn đạt thần học của nguyên văn.
