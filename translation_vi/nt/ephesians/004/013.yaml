id: EPH.4.13
reference: Ephesians 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: vi
  text: cho đến khi tất cả chúng ta đạt đến sự hiệp nhất trong đức tin[a] và trong sự nhận biết Con Đức Chúa Trời[b], đạt đến một người trưởng thành[c], đạt đến mức tầm vóc của sự viên mãn của Đấng Mê-si[d][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong lòng tin”. Cụm từ này có thể nhấn mạnh đức tin chung mà các tín hữu cùng tuyên xưng, hoặc đức tin nói chung của họ.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “sự nhận biết đầy đủ” hoặc “sự nhận biết sâu sắc”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “đạt đến tình trạng trưởng thành”. Tiếng Hy Lạp nói sát nghĩa là “một người trưởng thành”, dùng hình ảnh giống đực số ít để chỉ sự trưởng thành chung của toàn thể hội thánh.
    reason: lexical_alternative
  - marker: d
    text: Từ được dịch là “tầm vóc” cũng có thể mang nghĩa “sự trưởng thành” hoặc “tuổi trưởng thành”.
    reason: lexical_alternative
  - marker: e
    text: Tiếng Hy Lạp là Christos, nghĩa là “Đấng được xức dầu”; cũng thường được phiên chuyển là “Đấng Christ”.
    reason: alternative_reading
lexical_decisions:
- source_word: μέχρι
  choice: cho đến khi
  rationale: Diễn tả điểm đích của tiến trình trang bị được nói đến ở câu trước, đồng thời kết hợp tự nhiên với động từ ở thể giả định.
- source_word: καταντήσωμεν οἱ πάντες
  choice: tất cả chúng ta đạt đến
  rationale: Giữ rõ chủ thể bao gồm toàn thể cộng đồng và ý nghĩa tiến tới, đạt tới một mục tiêu.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως
  choice: đạt đến sự hiệp nhất trong đức tin
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ ý hướng đến sự hiệp nhất mà đức tin chung đem lại, nhưng không loại trừ hoàn toàn nghĩa đức tin của các tín hữu.
- source_word: ἐπιγνώσεως
  choice: sự nhận biết
  rationale: Diễn tả sự hiểu biết có tính nhận thức và quan hệ; chú thích giữ lại khả năng nhấn mạnh sự nhận biết đầy đủ hoặc sâu sắc.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Chuyển trực tiếp tước hiệu Kitô học và đối tượng của sự nhận biết.
- source_word: εἰς ἄνδρα τέλειον
  choice: đạt đến một người trưởng thành
  rationale: Giữ hình ảnh số ít giống đực của nguyên văn về toàn thể hội thánh như một con người đã trưởng thành; τέλειος trong văn cảnh tăng trưởng thích hợp với 'trưởng thành' hơn 'hoàn hảo'.
- source_word: εἰς μέτρον ἡλικίας
  choice: đạt đến mức đo của tầm vóc
  rationale: Giữ cả ý đo lường của μέτρον và hình ảnh tăng trưởng về tầm vóc trong ἡλικία.
- source_word: τοῦ πληρώματος
  choice: viên mãn
  rationale: Bảo tồn sắc thái thần học cô đọng của πλήρωμα và tránh diễn giải quá mức.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός mang sắc thái tước hiệu của Đấng được xức dầu trong văn cảnh này; 'Đấng Mê-si' thể hiện rõ chức năng ấy.
theological_decisions:
- issue: Ý nghĩa của τῆς πίστεως
  choice: đức tin chung được cộng đồng cùng tuyên xưng
  alternative: lòng tin hay sự tin cậy của các tín hữu
  rationale: Mạo từ và văn cảnh về sự trưởng thành hiệp nhất của toàn hội thánh nghiêng về nghĩa đức tin chung, nhưng bản dịch và chú thích vẫn giữ khả năng chỉ hành vi tin.
- issue: Hình ảnh εἰς ἄνδρα τέλειον
  choice: một người trưởng thành
  alternative: tình trạng trưởng thành; một người hoàn hảo
  rationale: Nguyên văn dùng danh từ giống đực số ít làm hình ảnh cho sự trưởng thành mang tính tập thể; không nên làm mất hình ảnh ấy hoặc biến τέλειος thành sự hoàn hảo tuyệt đối.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός có sức nặng của một tước hiệu thần học; 'Đấng Mê-si' chuyển tải nghĩa Đấng được xức dầu mà không thêm một lập trường hệ phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ đọc. Cấu trúc lặp “đạt đến” phản ánh ba cụm εἰς chỉ cùng một đích đến. Cụm “mức đo của tầm vóc viên mãn” chủ ý giữ hình ảnh đo lường và tăng trưởng của nguyên văn, dù đậm chất văn chương hơn lời nói thường ngày.
