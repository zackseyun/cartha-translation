  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: vi
  text: Còn lời “Ngài đã lên” thì có nghĩa gì, nếu không phải là Ngài cũng đã xuống những miền thấp hơn của đất?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xuống các miền thấp hơn, tức là đất.” Cụm từ này có thể chỉ việc Ngài xuống thế gian, hoặc cụ thể hơn là xuống cõi người chết.'
    reason: Bảo lưu hai cách phân tích ngữ pháp và các cách hiểu chính của cụm từ Hy Lạp đang còn được tranh luận.
lexical_decisions:
- source_word: Ἀνέβη
  choice: Ngài đã lên cao
  rationale: Động từ aorist của ἀναβαίνω tiếp nối lời trích dẫn trước đó và giữ hình ảnh chuyển động hướng lên; “lên cao” tự nhiên trong tiếng Việt và tương ứng với “đã xuống”.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: có nghĩa gì, nếu không phải là
  rationale: Diễn đạt tự nhiên lối lập luận suy ra từ cụm từ vừa được trích dẫn, đồng thời không làm yếu quan hệ logic của câu Hy Lạp.
- source_word: καὶ κατέβη
  choice: cũng đã xuống
  rationale: Giữ sắc thái bổ sung của καί và thế đối xứng giữa đi lên với đi xuống.
- source_word: εἰς
  choice: xuống
  rationale: Ý hướng chuyển động vào trong được thể hiện tự nhiên trong tiếng Việt qua kết cấu động từ “xuống” đi với đích đến; thêm “vào” ở đây dễ khiến câu nặng nề.
- source_word: τὰ κατώτερα μέρη
  choice: những miền thấp hơn
  rationale: Giữ nghĩa so sánh của κατώτερα và nghĩa không gian của μέρη, nhưng dùng “miền” thay cho cách nói kém tự nhiên “các phần”.
- source_word: τῆς γῆς
  choice: của đất
  rationale: Dịch sát kết cấu sở hữu để bảo lưu khả năng hiểu là các miền thấp hơn thuộc về đất, đồng thời không loại trừ cách hiểu đồng vị rằng các miền thấp hơn chính là đất.
theological_decisions:
- issue: Cách hiểu εἰς τὰ κατώτερα μέρη τῆς γῆς
  choice: 'Giữ cách diễn đạt mở: “xuống những miền thấp hơn của đất”'
  alternative: “xuống các miền thấp hơn, tức là đất” hoặc hiểu cụ thể là xuống cõi người chết
  rationale: Ngữ pháp Hy Lạp cho phép hiểu τῆς γῆς theo quan hệ sở thuộc/phân bộ hoặc theo nghĩa đồng vị. Bản dịch chính không quyết định rằng câu nhất thiết nói về việc xuống cõi chết hay chỉ nói về việc xuống thế gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn” thể hiện chức năng chuyển sang bình luận lời trích dẫn của τὸ δέ mà không tạo sắc thái thời gian như “bây giờ”. Đại từ “Ngài” phù hợp với quy chiếu về Đấng Christ trong ngữ cảnh.
