id: EPH.4.10
reference: Ephesians 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: vi
  text: Đấng đã xuống cũng chính là Đấng đã lên cao vượt trên mọi tầng trời[a], để Ngài làm đầy mọi sự[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lên trên tất cả các tầng trời.” Cụm từ này có thể nhấn mạnh sự tôn cao vượt trên mọi cõi trời.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để Ngài làm trọn mọi sự.” Động từ Hy Lạp trong một số văn cảnh có nghĩa là “làm trọn”, nhưng ở đây nghĩa “làm đầy” phù hợp hơn với văn cảnh trực tiếp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: Đấng đã xuống
  rationale: Phân từ bất định quá khứ có mạo từ được dùng như danh từ; cách diễn đạt này tự nhiên, trang trọng và giữ nguyên tính quy chiếu.
- source_word: αὐτός ἐστιν καὶ
  choice: cũng chính là
  rationale: Giữ sắc thái nhấn mạnh của αὐτός và khẳng định Đấng đã xuống với Đấng đã lên là cùng một Đấng.
- source_word: ὁ ἀναβὰς
  choice: Đấng đã lên
  rationale: Dịch song song với ὁ καταβὰς, đồng thời chuyển phân từ thành mệnh đề tự nhiên trong tiếng Việt.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: lên cao vượt trên mọi tầng trời
  rationale: “Vượt trên” diễn đạt ý ở cao hơn và cao trọng hơn; “mọi tầng trời” giữ số nhiều và phạm vi bao quát của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt ngắn gọn và tự nhiên ý mục đích của liên từ ἵνα.
- source_word: πληρώσῃ
  choice: làm đầy dẫy
  rationale: Giữ nghĩa căn bản “làm cho đầy/đổ đầy” trong văn cảnh, thay vì quyết định theo nghĩa “làm ứng nghiệm”; “đầy dẫy” phù hợp văn phong Kinh Thánh trang trọng nhưng vẫn dễ hiểu.
- source_word: τὰ πάντα
  choice: muôn vật
  rationale: Giữ phạm vi bao quát và sắc thái vũ trụ của cụm trung tính số nhiều, không thu hẹp thành “mọi người” hay diễn giải thành “toàn thể vũ trụ”.
theological_decisions:
- issue: Đồng nhất Đấng xuống và Đấng lên
  choice: Dùng “cũng chính là” để nhấn mạnh hai hành động thuộc về cùng một Đấng.
  alternative: Chỉ dịch “cũng là”, với mức nhấn mạnh nhẹ hơn.
  rationale: αὐτός cùng cấu trúc song song của hai phân từ có mạo từ nhấn mạnh sự đồng nhất; bản dịch giữ điểm này mà không thêm lời giải thích ngoài câu.
- issue: Phạm vi của τὰ πάντα
  choice: Dịch là “muôn vật” để giữ phạm vi toàn diện.
  alternative: “mọi sự” hoặc “tất cả”; không thu hẹp thành “mọi người”.
  rationale: Nguyên văn cố ý rộng; bản dịch không giải quyết thay độc giả phạm vi chính xác của cụm từ.
- issue: Nghĩa của πληρόω
  choice: Dịch là “làm đầy dẫy”.
  alternative: “làm trọn” hoặc “hoàn tất”.
  rationale: Trong văn cảnh trực tiếp, nghĩa “làm đầy” phù hợp hơn, nhưng chú thích vẫn ghi nhận khả năng từ vựng “làm trọn” để bảo toàn độ mở của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Viết hoa “Đấng” và “Ngài” theo quy chiếu rõ ràng trong văn cảnh, không thêm danh xưng Kitô học vốn không xuất hiện trực tiếp trong câu. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
