  - severity: low
    issue: “Làm đầy dẫy” hơi cổ và có thể làm lệch nhẹ sắc thái của πληρόω.
    rationale: Trong câu này πληρώσῃ trực tiếp diễn tả “làm đầy”; “làm đầy mọi sự” rõ, hiện đại, và sát nghĩa hơn, trong khi chú thích vẫn có thể nêu phương án “làm trọn”.
