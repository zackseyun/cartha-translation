  rationale: Sửa “muôn vật” thành “mọi sự” để phản ánh phạm vi không bị giới hạn của τὰ πάντα, và “làm đầy dẫy” thành “làm đầy” để diễn đạt πληρόω chính xác, tự nhiên hơn trong tiếng Việt hiện đại. Các yếu tố còn lại, gồm sự nhấn mạnh về cùng một Đấng và ý mục đích, được giữ nguyên.
