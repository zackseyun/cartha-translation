id: EPH.4.1
reference: Ephesians 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: vi
  text: Vậy, tôi, người tù trong Chúa[a], khuyên anh chị em hãy bước đi xứng đáng với sự kêu gọi mà anh chị em đã nhận[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “tù nhân của Chúa” hoặc “người bị tù vì Chúa.”
    reason: alternative_reading
  - marker: b
    text: Hay “hãy sống một cách xứng hợp với sự kêu gọi mà anh chị em đã nhận.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: khuyên
  rationale: Động từ này diễn tả lời kêu gọi tha thiết, có sức nặng mục vụ. “Khuyên” tự nhiên trong tiếng Việt hiện đại; trong ngữ cảnh này, nó mạnh hơn một lời đề nghị thông thường mà không mang sắc thái áp đặt.
- source_word: οὖν
  choice: Vậy
  rationale: Từ nối này đánh dấu kết luận thực hành rút ra từ phần lập luận trước. “Vậy” diễn đạt rõ quan hệ suy luận và tự nhiên hơn “do đó” trong lời khuyên trực tiếp.
- source_word: δέσμιος
  choice: người tù
  rationale: Danh từ chỉ một người đang bị giam cầm. “Người tù” rõ nghĩa, trang trọng vừa phải và không thêm ý ngoài nguyên văn.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên thành ngữ thần học đặc trưng của Phao-lô và không thu hẹp quan hệ này thành sở hữu (“tù nhân của Chúa”) hay nguyên nhân (“bị tù vì Chúa”).
- source_word: ἀξίως
  choice: xứng đáng
  rationale: Diễn tả cách sống phù hợp với địa vị hay sự kêu gọi đã nhận. “Xứng đáng” là cách nói tự nhiên, không hàm ý con người tự tạo ra công trạng để nhận sự kêu gọi.
- source_word: περιπατῆσαι
  choice: hãy bước đi
  rationale: Giữ hình ảnh ẩn dụ Phao-lô dùng về nếp sống. Trong tiếng Việt, “bước đi” vẫn dễ hiểu theo nghĩa cách sống, còn chú thích nêu cách diễn đạt trực tiếp hơn.
- source_word: κλήσεως
  choice: sự kêu gọi
  rationale: Cụm từ này giữ được hành động Đức Chúa Trời kêu gọi cũng như địa vị và đời sống phát sinh từ lời gọi ấy, mà không thu hẹp thành một nghề nghiệp hay lời mời thông thường.
- source_word: ἧς ἐκλήθητε
  choice: mà anh chị em đã nhận
  rationale: Nguyên văn dùng cấu trúc đồng gốc “sự kêu gọi mà anh chị em đã được gọi,” nhưng lặp như vậy gượng trong tiếng Việt. “Đã nhận” truyền đạt tự nhiên rằng họ là đối tượng tiếp nhận sự kêu gọi, không biến họ thành người chủ động tạo ra nó.
theological_decisions:
- issue: Sắc thái của lời tự mô tả ὁ δέσμιος ἐν κυρίῳ
  choice: người tù trong Chúa
  alternative: tù nhân của Chúa; người bị tù vì Chúa
  rationale: 'Bản dịch giữ giới từ “trong” để bảo tồn độ rộng thần học của nguyên văn: tình trạng tù đày của Phao-lô được xác định trong mối liên hệ với Chúa, nhưng câu không nói rõ đó chủ yếu là sở hữu, nguyên nhân hay mục đích.'
- issue: Quan hệ giữa đời sống và sự kêu gọi
  choice: bước đi xứng đáng với sự kêu gọi
  alternative: sống một cách xứng hợp với sự kêu gọi
  rationale: Cách dịch giữ hình ảnh “bước đi” và ý về sự tương hợp giữa cách sống với lời gọi đã nhận. “Xứng đáng” không được diễn giải thành việc kiếm được hay xứng công nhận sự kêu gọi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt số nhiều, hướng đến toàn thể cộng đồng. Bản văn giữ thành ngữ “trong Chúa” và ẩn dụ “bước đi,” đồng thời dùng “đã nhận” để tránh cấu trúc lặp gượng “đã được kêu gọi bằng sự kêu gọi” trong tiếng Việt.
