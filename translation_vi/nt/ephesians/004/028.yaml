id: EPH.4.28
reference: Ephesians 4:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: vi
  text: Người nào trộm cắp thì đừng trộm cắp nữa, nhưng phải chịu khó làm việc, dùng chính tay mình làm điều tốt[a], để có mà chia sẻ với người đang thiếu thốn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm công việc tốt” hoặc “làm ra điều hữu ích.”'
    reason: Cụm ἐργαζόμενος … τὸ ἀγαθόν có thể nhấn mạnh hành động làm điều tốt, công việc lương thiện, hoặc tạo ra điều có ích.
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: Người nào trộm cắp
  rationale: Mạo từ đi với phân từ hiện tại được dùng như danh từ, chỉ người có hành vi trộm cắp; cách dịch này giữ được sắc thái hành vi mà không đóng khung người ấy bằng nhãn gọi “kẻ trộm”.
- source_word: μηκέτι κλεπτέτω
  choice: thì đừng trộm cắp nữa
  rationale: Diễn đạt tự nhiên mệnh lệnh ngôi thứ ba cùng ý chấm dứt một hành vi trước đây hoặc đang diễn ra.
- source_word: μᾶλλον δὲ κοπιάτω
  choice: nhưng phải chịu khó làm việc
  rationale: Giữ sự tương phản sửa đổi của μᾶλλον δὲ và sắc thái lao nhọc, nỗ lực của κοπιάω.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: dùng chính tay mình làm điều tốt
  rationale: Giữ cấu trúc chỉ cách thức, sự nhấn mạnh vào lao động của chính mình, và nghĩa rộng của τὸ ἀγαθόν; không thu hẹp cụm từ chỉ còn “công việc tốt”.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: để có mà chia sẻ
  rationale: Thể hiện mệnh đề mục đích và ý chia phần từ những gì mình có; “có mà” tự nhiên trong tiếng Việt dù tân ngữ của ἔχῃ được hiểu ngầm.
- source_word: τῷ χρείαν ἔχοντι
  choice: với người đang thiếu thốn
  rationale: Dịch rõ người nhận là người có nhu cầu, đồng thời dùng giới từ phù hợp với động từ “chia sẻ” trong tiếng Việt.
theological_decisions:
- issue: Mục đích đạo đức của lao động
  choice: Lao động lương thiện thay thế việc trộm cắp và nhằm giúp người thiếu thốn.
  alternative: Nhấn mạnh chủ yếu vào việc tự nuôi sống bản thân hoặc bồi hoàn những gì đã lấy.
  rationale: Mệnh đề mục đích nói rõ việc có được thành quả lao động là để chia sẻ với người đang thiếu thốn. Tự túc có thể được hàm ý, nhưng sự rộng lòng là mục tiêu được nêu trực tiếp; việc bồi hoàn không được nói rõ trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chịu khó làm việc” truyền tải sắc thái nỗ lực của κοπιάω; “dùng chính tay mình” giữ sự nhấn mạnh của ταῖς ἰδίαις χερσίν. Đại từ giống đực không được thêm vào vì tiếng Hy Lạp ở đây có thể được diễn đạt bao quát tự nhiên trong tiếng Việt.
