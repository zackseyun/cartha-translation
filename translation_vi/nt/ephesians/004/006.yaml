  - severity: low
    issue: Cấu trúc “chỉ có một Đức Chúa Trời và là Cha” không tự nhiên.
    rationale: Liên từ “và” nối với “là Cha” khiến mệnh đề danh từ hơi gượng. Dấu phẩy và “là Cha” diễn đạt rõ quan hệ đồng vị của θεὸς καὶ πατήρ.
  - severity: low
