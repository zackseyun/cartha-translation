  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: vi
  text: một Đức Chúa Trời, là Cha của tất cả[a], Đấng ở trên tất cả, qua tất cả và ở trong tất cả.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Cha của mọi người” hoặc “Cha của muôn vật.” Trong tiếng Hy Lạp, từ “tất cả” được dùng mà không nêu rõ là người hay vật.'
    reason: lexical_alternative
  - marker: b
    text: '“Ở trong tất cả” cũng có thể hiểu là “ở trong mọi người.” Một số thủ bản chép: “ở trong tất cả anh em.”'
    reason: textual_variant
lexical_decisions:
- source_word: εἷς θεὸς καὶ πατὴρ πάντων
  choice: chỉ có một Đức Chúa Trời và là Cha của tất cả
  rationale: Diễn đạt tự nhiên cấu trúc tuyên xưng về sự hiệp nhất; “chỉ có một” làm rõ sức nhấn của εἷς trong chuỗi “một” ở văn cảnh, còn “tất cả” giữ nguyên độ rộng không xác định của πάντων.
- source_word: ὁ ἐπὶ πάντων
  choice: Đấng ở trên tất cả
  rationale: “Đấng” nối tự nhiên với tước hiệu thần linh; “ở trên” bảo toàn ý nghĩa về địa vị tối cao hoặc quyền tể trị của ἐπί với sở hữu cách.
- source_word: διὰ πάντων
  choice: hành động qua tất cả
  rationale: διά với sở hữu cách biểu thị phương tiện hoặc môi giới. Thêm “hành động” để câu tiếng Việt rõ nghĩa, nhưng không xác định “tất cả” là người hay vật.
- source_word: ἐν πᾶσιν
  choice: ở trong tất cả
  rationale: Bám sát ἐν với tặng cách và giữ thế song hành của ba cụm giới từ; không tự ý thu hẹp đối tượng thành mọi người hay mọi tín hữu.
theological_decisions:
- issue: Phạm vi của πάντων / πᾶσιν được lặp lại
  choice: Dịch nhất quán là “tất cả” mà không bổ sung danh từ chỉ người hoặc vật.
  alternative: mọi người; mọi tín hữu; muôn vật
  rationale: Nguyên văn không nêu danh từ đi kèm. Văn cảnh gần nói về sự hiệp nhất của hội thánh, nhưng cách diễn đạt vẫn rộng; bản dịch giữ nguyên sự mở này thay vì quyết định thay cho văn bản.
- issue: Biến thể văn bản tại ἐν πᾶσιν
  choice: ở trong tất cả
  alternative: ở trong tất cả anh em / ở trong tất cả anh chị em
  rationale: SBLGNT đọc πᾶσιν; một số thủ bản đọc ὑμῖν πᾶσιν, nghĩa là “trong tất cả anh em.” Bản chính theo văn bản nguồn và ghi biến thể trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Duy trì ba lần “tất cả” để phản ánh phép lặp của nguyên văn và chủ đề hiệp nhất. Dùng “Đức Chúa Trời” và “Cha” theo văn phong Kinh Thánh Tin Lành phổ biến, nhưng không thêm nét giáo phái.
