  terminology: “Ma quỷ” là cách gọi thông dụng trong tiếng Việt tôn giáo cho διάβολος trong ngữ cảnh này. Không cần chuyển thành “kẻ vu khống,” vì đó không phải nghĩa quy chiếu phù hợp nhất ở đây.
