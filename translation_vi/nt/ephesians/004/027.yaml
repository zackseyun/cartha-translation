  text: and do not give place to the devil[a].
translation:
  language: vi
  text: cũng đừng cho ma quỷ có cơ hội.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát: “đừng dành chỗ cho ma quỷ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: cũng đừng
  rationale: Trong mạch văn, liên từ này tiếp nối lời khuyên răn trước đó; “cũng đừng” vừa giữ sức nối kết vừa diễn đạt tự nhiên bằng tiếng Việt.
- source_word: δίδοτε
  choice: tạo
  rationale: Động từ có nghĩa cơ bản là “cho”; khi kết hợp với τόπον theo nghĩa thành ngữ, “tạo cơ hội” diễn đạt tự nhiên hành động dành phạm vi hay dịp để tác động.
- source_word: τόπον
  choice: cơ hội
  rationale: Nghĩa đen là “chỗ/nơi”, nhưng trong ngữ cảnh này chỉ phạm vi hoặc dịp để hành động. “Cơ hội” rõ nghĩa trong tiếng Việt hiện đại; nghĩa đen được giữ trong chú thích.
- source_word: τῷ διαβόλῳ
  choice: cho ma quỷ
  rationale: Ở đây διάβολος có mạo từ và được dùng như danh xưng chỉ thực thể ác đối nghịch; “ma quỷ” là cách gọi thông dụng, phù hợp trong tiếng Việt.
theological_decisions:
- issue: Nên hiểu διάβολος là danh từ chung “kẻ vu khống” hay là thực thể ác mang tính cá vị
  choice: ma quỷ
  alternative: kẻ vu khống
  rationale: Trong lời khuyên luân lý của Phao-lô, cụm từ này nhiều khả năng chỉ kẻ đối nghịch mang tính cá vị, chứ không chỉ một người vu khống; cách dịch không thêm nội dung ngoài câu.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên. “Tạo cơ hội” chuyển tải nghĩa thành ngữ của δίδοτε τόπον, còn chú thích bảo tồn hình ảnh nguyên văn “dành chỗ”.
