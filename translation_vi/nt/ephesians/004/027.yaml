  source_fidelity: Bản nháp hiểu đúng μηδέ như một lời cấm nối tiếp, τόπον theo nghĩa cơ hội/dịp, và τῷ διαβόλῳ là chỉ Ma Quỷ. Tuy nhiên, “tạo cơ hội cho” nghiêng về việc chủ động tạo ra một cơ hội mới, trong khi δίδοτε τόπον là “cho/dành chỗ, nhường cơ hội”; cách diễn đạt “cho ... có cơ hội” gần với cấu trúc và lực nghĩa của nguyên văn hơn.
