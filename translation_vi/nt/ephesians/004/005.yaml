  text: one Lord[a], one faith, one baptism;
translation:
  language: vi
  text: một Chúa, một đức tin[a], một phép báp-têm;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp πίστις cũng có thể có nghĩa là “lòng trung tín” hoặc “sự tin cậy”; tuy nhiên, “đức tin” phù hợp nhất với sự hiệp nhất chung được nhấn mạnh ở đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: một
  rationale: Ba dạng giống của cùng một số từ được dịch nhất quán là “một” để giữ phép song hành và sự nhấn mạnh về tính hiệp nhất.
- source_word: κύριος
  choice: Chúa
  rationale: Trong mạch văn Ê-phê-sô 4:4–6, đây tự nhiên là tước hiệu chỉ Đấng Christ; “Chúa” vừa quen thuộc vừa trang trọng trong tiếng Việt.
- source_word: πίστις
  choice: đức tin
  rationale: Ở đây từ này nhiều khả năng chỉ đức tin chung hoặc sự tin nhận liên kết cộng đồng; “đức tin” là cách diễn đạt tự nhiên và chính xác hơn “sự tin” trong ngữ cảnh này.
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Đây là thuật ngữ quen dùng cho nghi thức được βάπτισμα biểu thị, đồng thời không tự quyết định phương thức hay hiệu lực thần học của nghi thức ấy.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ tước hiệu “Chúa”, được hiểu tự nhiên nhất là chỉ Chúa Giê-su trong mạch văn.
  alternative: Hiểu theo nghĩa tổng quát hơn là chỉ Đức Chúa Trời.
  rationale: Cấu trúc “một Thánh Linh” (c. 4), “một Chúa” (c. 5), và “một Đức Chúa Trời, là Cha” (c. 6) khiến đối tượng tự nhiên nhất ở đây là Đức Chúa Con, nhưng bản dịch không thêm tên vào câu.
- issue: Ý nghĩa của “một phép báp-têm”
  choice: Dịch trung tính là “một phép báp-têm”, nhấn mạnh lời khẳng định về sự hiệp nhất.
  alternative: Hiểu câu này theo nghĩa chuyên biệt về bí tích, hoặc chủ yếu về phép báp-têm thuộc linh/ẩn dụ.
  rationale: Chính câu này không xác định phương thức, hiệu lực, hay giải quyết tranh luận giữa các truyền thống; vì vậy bản dịch giữ nguyên độ mở của nguyên văn.
translation_notes:
  register: Câu văn ngắn, trang trọng và dễ hiểu. Thêm “chỉ có” để diễn đạt tự nhiên lực nhấn mạnh của chuỗi ba lần “một” trong tiếng Việt, đồng thời giữ nguyên cấu trúc nhịp nhàng. Dùng “phép báp-têm” là thuật ngữ phổ biến, không gắn với một quan điểm hệ phái cụ thể.
