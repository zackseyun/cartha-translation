id: EPH.4.31
reference: Ephesians 4:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: vi
  text: Mọi cay đắng, nóng giận, giận dữ, la lối và lời lăng mạ[a] phải được loại bỏ khỏi anh chị em, cùng với mọi ác ý.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời phỉ báng”; theo cách dịch truyền thống là “lời phạm thượng”. Trong ngữ cảnh này, từ Hy Lạp có lẽ nói đến lời gây tổn hại cho người khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: mọi
  rationale: Diễn đạt trọn vẹn phạm vi của mệnh lệnh và kết hợp tự nhiên với danh sách các thói xấu.
- source_word: πικρία
  choice: cay đắng
  rationale: Giữ hình ảnh và nghĩa chỉ thái độ oán hận khắc nghiệt đã ăn sâu.
- source_word: θυμός
  choice: nóng giận
  rationale: Chỉ cảm xúc giận dữ bùng phát, nhờ đó vẫn phân biệt được với ὀργή đứng ngay sau.
- source_word: ὀργή
  choice: giận dữ
  rationale: Diễn đạt sự giận dữ theo nghĩa rộng hơn, đồng thời giữ sự phân biệt tương đối với θυμός mà không ép hai từ thành hai khái niệm hoàn toàn tách biệt.
- source_word: κραυγή
  choice: la lối
  rationale: Trong danh sách thói xấu này, từ chỉ tiếng nói lớn, ồn ào và mang tính thù nghịch; “la lối” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: βλασφημία
  choice: lời phỉ báng
  rationale: Ngữ cảnh đạo đức liên cá nhân nghiêng về lời nói gây tổn hại hoặc xúc phạm người khác; chú thích bảo lưu các khả năng rộng hơn và cách dịch truyền thống.
- source_word: ἀρθήτω
  choice: phải được loại bỏ
  rationale: Giữ thể mệnh lệnh bị động của động từ và ý loại trừ dứt khoát.
- source_word: ἀφ’ ὑμῶν
  choice: khỏi anh chị em
  rationale: Diễn đạt trực tiếp việc những điều này phải bị loại khỏi đời sống cá nhân và cộng đồng của các tín hữu.
- source_word: σὺν πάσῃ κακίᾳ
  choice: cùng với mọi ác ý
  rationale: Giữ nghĩa đi kèm của σύν và hiểu κακία ở đây là ác tâm, ý muốn gây hại, thay vì điều ác theo nghĩa quá rộng.
theological_decisions:
- issue: Nghĩa của βλασφημία trong danh sách các thói xấu
  choice: lời phỉ báng trong quan hệ giữa người với người
  alternative: lời lăng mạ; lời phạm thượng hướng về Đức Chúa Trời
  rationale: Các từ xung quanh nói về thái độ và lời nói phá hoại quan hệ cộng đồng, nên nghĩa liên cá nhân phù hợp nhất; tuy nhiên, chú thích không xóa bỏ phạm vi nghĩa rộng hơn của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc bị động “phải được loại bỏ” phản ánh hình thức Hy Lạp; cặp “nóng giận, giận dữ” giữ hai thuật ngữ gần nghĩa liên tiếp mà không tạo ra sự phân biệt giáo lý quá mức. Đại từ số nhiều “anh chị em” thể hiện lời khuyên dành cho cả cộng đồng.
