  rationale: Chỉ điều chỉnh cách dịch βλασφημία và đảo các phương án trong chú thích để thân bài phản ánh rõ hơn nghĩa liên cá nhân có khả năng nhất trong ngữ cảnh, nhưng vẫn bảo lưu các nghĩa thay thế. Các phần còn lại trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
