id: EPH.4.18
reference: Ephesians 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἐσκοτωμένοι τῇ διανοίᾳ ὄντες, ἀπηλλοτριωμένοι τῆς ζωῆς τοῦ θεοῦ, διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς, διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: vi
  text: tâm trí họ trở nên tối tăm[a], họ bị xa cách sự sống của Đức Chúa Trời[b][c] vì sự thiếu hiểu biết ở trong họ, vì lòng họ đã chai lì[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự hiểu biết của họ trở nên tối tăm.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bị loại khỏi sự sống của Đức Chúa Trời.”
    reason: lexical_alternative
  - marker: c
    text: “Sự sống của Đức Chúa Trời” có thể chỉ sự sống thuộc về Đức Chúa Trời hoặc sự sống đến từ Đức Chúa Trời.
    reason: alternative_reading
  - marker: d
    text: “Chai lì” cũng có thể dịch là “cứng cỏi” hoặc “mất cảm giác.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι τῇ διανοίᾳ ὄντες
  choice: tâm trí họ trở nên tối tăm
  rationale: Diễn đạt trạng thái kết quả của phân từ hoàn thành bị động ἐσκοτωμένοι và phương diện được nêu bởi τῇ διανοίᾳ; tiếng Việt tự nhiên không cần dịch riêng ὄντες.
- source_word: διανοίᾳ
  choice: tâm trí
  rationale: Bao quát năng lực suy nghĩ và hiểu biết, đồng thời phù hợp tự nhiên với hình ảnh “trở nên tối tăm” trong tiếng Việt.
- source_word: ἀπηλλοτριωμένοι
  choice: bị xa cách
  rationale: Giữ nghĩa bị động và trạng thái tách lìa, nhưng tránh sắc thái pháp lý quá hẹp của “bị loại trừ”.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: sự sống của Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc sở hữu mơ hồ của Hy Lạp, có thể chỉ sự sống thuộc về Đức Chúa Trời hoặc sự sống đến từ Ngài.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: vì sự thiếu hiểu biết ở trong họ
  rationale: Hai lần διά với đối cách nêu nguyên nhân; “ở trong họ” giữ rõ tính nội tại của sự thiếu hiểu biết.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: vì lòng họ đã chai lì
  rationale: “Chai lì” truyền đạt πώρωσις như sự cứng lại và mất nhạy cảm. “Lòng họ” là cách nói tiếng Việt tự nhiên, không buộc phải phân biệt hình thái số ít của danh từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của “sự sống của Đức Chúa Trời”
  choice: Giữ cụm “sự sống của Đức Chúa Trời” mà không xác định thêm.
  alternative: “sự sống đến từ Đức Chúa Trời” hoặc “sự sống riêng của Đức Chúa Trời”
  rationale: Sở hữu cách τοῦ θεοῦ có thể mang cả hai sắc thái; bản dịch không nên tự ý giải quyết sự mơ hồ có thật.
- issue: Quan hệ giữa hai nguyên nhân được nêu bằng διά
  choice: Giữ hai cụm song song “vì… vì…”.
  alternative: Diễn giải sự chai lì là nguyên nhân của sự thiếu hiểu biết, rồi sự thiếu hiểu biết là nguyên nhân của sự xa cách.
  rationale: Cú pháp cho phép nhận thấy một chuỗi nguyên nhân nhưng không hoàn toàn bắt buộc cách phân cấp đó; giữ cấu trúc song song bảo toàn độ mở của câu.
- issue: καρδία số ít với chủ thể số nhiều
  choice: Dịch tự nhiên là “lòng họ”.
  alternative: “tấm lòng của họ” hoặc “lòng của mỗi người trong họ”
  rationale: Tiếng Việt “lòng họ” không đánh dấu số ở danh từ và do đó vừa tự nhiên vừa phản ánh được cách dùng tập thể của bản Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ chuỗi các mệnh đề phân từ của nguyên văn nhưng dùng đại từ và động từ hữu hạn để tiếng Việt trôi chảy. “Đức Chúa Trời” được dùng theo lối gọi quen thuộc trong bản dịch Kinh Thánh tiếng Việt; không thêm diễn giải giáo phái.
