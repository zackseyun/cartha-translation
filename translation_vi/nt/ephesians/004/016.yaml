id: EPH.4.16
reference: Ephesians 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: vi
  text: Từ Ngài, cả thân thể được ghép nối và gắn kết qua mọi khớp nối cung ứng; theo hoạt động tương xứng với mức độ của từng bộ phận, thân thể làm cho chính mình tăng trưởng để tự gây dựng trong tình yêu thương.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua mọi mối nối nâng đỡ,” “qua mọi khớp được cung ứng,” hoặc “qua mọi dây chằng hỗ trợ.”'
    reason: Cụm διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας có thể chỉ khớp, điểm tiếp nối, hay dây chằng; τῆς ἐπιχορηγίας hàm ý sự cung ứng hoặc nâng đỡ.
  - marker: b
    text: 'Sát nghĩa: “theo sự hoạt động trong mức độ của mỗi một bộ phận.”'
    reason: Ghi lại cấu trúc cô đọng của κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους và không thêm ý rằng mức độ ấy được ban cho.
lexical_decisions:
- source_word: ἐξ οὗ
  choice: Từ Ngài
  rationale: Đại từ quan hệ chỉ về Đấng Christ ở câu 15; cách dịch mang tính ngôi vị giữ Ngài là nguồn của sự tăng trưởng.
- source_word: πᾶν τὸ σῶμα
  choice: toàn thân
  rationale: Tự nhiên trong tiếng Việt và giữ nguyên hình ảnh một thân thể trọn vẹn.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: được kết nối và gắn chặt với nhau
  rationale: Giữ sắc thái bị động của hai phân từ, đồng thời diễn đạt cả việc các phần được ghép nối lẫn được giữ thành một khối.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: nhờ mọi khớp cung ứng
  rationale: Giữ hình ảnh cụ thể về thân thể của ἁφή và ý cung cấp, nâng đỡ trong ἐπιχορηγία mà không xác định quá mức về giải phẫu.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: Khi mỗi bộ phận hoạt động theo mức được ban cho mình
  rationale: Diễn đạt tự nhiên ý hoạt động tương xứng với mức của từng phần; cụm 'được ban cho' làm rõ mức phân định trong ngữ cảnh nhưng được ghi chú vì không hiện diện thành một động từ riêng trong Hy Lạp.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: thân thể tăng trưởng
  rationale: Tiếng Việt tự nhiên; chủ ngữ toàn thân được duy trì và nghĩa 'làm nên sự tăng trưởng của thân thể' được diễn đạt không vụng.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ
  choice: tự gây dựng
  rationale: Giữ lực phản thân của ἑαυτοῦ và ẩn dụ gây dựng của οἰκοδομή.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Cách diễn đạt phổ thông, trang trọng và nhất quán với trọng tâm của phân đoạn.
theological_decisions:
- issue: Nguồn và tác nhân của sự tăng trưởng
  choice: Đấng Christ là nguồn ('Từ Ngài'), còn toàn thân tăng trưởng qua hoạt động có mức độ của từng bộ phận.
  alternative: Hiểu đại từ theo nghĩa phi ngôi vị, hoặc quy toàn bộ tác nhân tăng trưởng trực tiếp cho Đấng Christ.
  rationale: Ngữ pháp và câu 15 chỉ về Đấng Christ, trong khi cấu trúc câu 16 cũng trình bày toàn thân như chủ thể tăng trưởng. Bản dịch giữ cả hai phương diện.
- issue: Hình ảnh của ἁφῆς τῆς ἐπιχορηγίας
  choice: Giữ hình ảnh thân thể bằng 'khớp cung ứng'.
  alternative: Dịch là 'dây chằng nâng đỡ' hoặc khái quát hóa thành 'mối liên kết cung cấp'.
  rationale: Cụm Hy Lạp có thể nhấn mạnh điểm nối, khớp hoặc sự tiếp xúc có chức năng cung ứng; bản dịch chính giữ độ cụ thể mà không quyết định quá mức.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Chia câu Hy Lạp dài thành hai câu tiếng Việt để sáng nghĩa nhưng vẫn giữ mạch: nguồn từ Đấng Christ, sự liên kết của toàn thân, hoạt động của từng phần, rồi sự tăng trưởng và gây dựng trong tình yêu thương.'
