id: EPH.4.32
reference: Ephesians 4:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: vi
  text: Hãy đối xử nhân từ với nhau, có lòng thương xót, tha thứ cho nhau, như Đức Chúa Trời cũng đã tha thứ cho anh chị em trong Đấng Mê-si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνεσθε
  choice: Hãy đối xử
  rationale: Động từ mệnh lệnh hiện tại kêu gọi một nếp sống liên tục. Trong tiếng Việt, kết hợp “hãy đối xử nhân từ” tự nhiên hơn “hãy trở nên nhân từ” trong quan hệ hỗ tương.
- source_word: εἰς ἀλλήλους
  choice: với nhau
  rationale: Diễn đạt tự nhiên hướng tương giao và ý nghĩa hỗ tương của cụm từ.
- source_word: χρηστοί
  choice: nhân từ
  rationale: Chỉ thái độ tử tế, tốt lành trong cách đối xử; “nhân từ” giữ được sắc thái đạo đức và trang trọng.
- source_word: εὔσπλαγχνοι
  choice: có lòng thương xót
  rationale: Diễn tả lòng trắc ẩn sâu xa. Cách dịch này phân biệt được với χρηστοί và dễ hiểu trong tiếng Việt hiện đại.
- source_word: χαριζόμενοι
  choice: tha thứ
  rationale: Trong ngữ cảnh này, hành động của Đức Chúa Trời ở vế so sánh xác nhận nghĩa tha thứ lỗi phạm, dù động từ cũng hàm ý ban ơn.
- source_word: ἑαυτοῖς
  choice: cho nhau
  rationale: Đại từ phản thân số nhiều mang chức năng hỗ tương trong ngữ cảnh, nên dịch tự nhiên là “cho nhau”.
- source_word: καθὼς καὶ
  choice: như ... cũng
  rationale: Giữ cả ý so sánh của καθὼς và sắc thái tương ứng/nhấn mạnh của καί mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, quen thuộc, chỉ chủ thể của hành động tha thứ.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ giới từ ἐν và dịch Χριστός theo chức danh “Đấng Mê-si”, không diễn giải thành “nhờ” hay “qua”.
- source_word: ἐχαρίσατο
  choice: đã tha thứ
  rationale: Thì bất định quy chiếu hành động đã xảy ra; trong ngữ cảnh, χαρίζομαι mang nghĩa tha thứ.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Đại từ số nhiều được diễn đạt minh nhiên và bao quát, phù hợp lời khuyên dành cho cả cộng đồng.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός tại đây là tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa tước hiệu rõ ràng, còn “Đấng Christ” là dạng truyền thống được giữ ở chú thích.
- issue: Quan hệ của ἐν trong ἐν Χριστῷ
  choice: trong Đấng Mê-si
  alternative: nhờ Đấng Mê-si
  rationale: Bản văn cho phép chiều kích liên hiệp/phạm vi cũng như phương tiện. Dịch sát “trong” bảo toàn độ mở của cụm từ thay vì quyết định đó chỉ là phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện đại từ số nhiều ὑμῖν hướng đến toàn thể cộng đồng; giữ cấu trúc so sánh và sự lặp lại hỗ tương của câu Hy Lạp.
