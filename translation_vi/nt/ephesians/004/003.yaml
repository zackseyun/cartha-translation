  text: σπουδάζοντες τηρεῖν τὴν ἑνότητα τοῦ πνεύματος ἐν τῷ συνδέσμῳ τῆς εἰρήνης·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/003.yaml
  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: vi
  text: hãy hết sức[a] gìn giữ sự hiệp nhất của Thánh Linh[b] trong mối dây hòa bình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chuyên tâm duy trì” hoặc “hãy nỗ lực bảo toàn.”'
    reason: lexical_alternative
  - marker: b
    text: “Thánh Linh” ở đây rất có thể chỉ Đức Thánh Linh, dù một số người hiểu theo nghĩa tổng quát hơn là tinh thần chung giữa các tín hữu.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: hãy hết lòng
  rationale: Phân từ hiện tại diễn tả sự chuyên tâm và nỗ lực thiết tha; trong mạch khuyên bảo của câu 1–2, cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sức thúc giục của nguyên văn.
- source_word: τηρεῖν
  choice: gìn giữ
  rationale: Diễn tả việc bảo toàn một thực tại đã có, chứ không tạo ra sự hiệp nhất mới; “gìn giữ” vừa tự nhiên vừa hàm ý trân trọng và duy trì.
- source_word: ἑνότητα
  choice: sự hiệp nhất
  rationale: Tương đương thông dụng, rõ nghĩa với ἑνότης trong bối cảnh cộng đồng tín hữu.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Mạo từ và văn cảnh Ê-phê-sô, đặc biệt câu 4, khiến việc hiểu là Thánh Linh hợp lý nhất; cách viết hoa thể hiện nhận định này.
- source_word: ἐν
  choice: trong
  rationale: Giữ nghĩa trực tiếp của giới từ, cho phép cụm từ diễn tả phạm vi hoặc phương tiện mà sự hiệp nhất được gìn giữ.
- source_word: συνδέσμῳ
  choice: mối dây
  rationale: Giữ hình ảnh về điều nối kết hay ràng buộc, đồng thời là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: τῆς εἰρήνης
  choice: hòa bình
  rationale: 'Dịch gọn cấu trúc sở hữu, để ngỏ quan hệ chính xác: hòa bình có thể là mối dây hoặc là điều tạo nên mối dây liên kết.'
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματος
  choice: Thánh Linh
  alternative: tinh thần chung giữa các tín hữu
  rationale: Cách dùng trong Ê-phê-sô và văn cảnh gần nhất ủng hộ mạnh việc quy chiếu đến Thánh Linh, nhưng chú thích vẫn ghi nhận cách hiểu tổng quát hơn.
- issue: Bản chất của sự hiệp nhất
  choice: một sự hiệp nhất đã có và cần được gìn giữ
  alternative: một sự hiệp nhất do các tín hữu tạo nên
  rationale: Động từ τηρεῖν mang nghĩa giữ gìn hoặc bảo toàn, không phải thiết lập; bản dịch tránh nói quá điều nguyên văn khẳng định.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hết lòng” truyền đạt sự chuyên tâm tích cực; “gìn giữ” nhấn mạnh bảo toàn điều đã có; “mối dây hòa bình” giữ nguyên ẩn dụ cô đọng của tiếng Hy Lạp.
