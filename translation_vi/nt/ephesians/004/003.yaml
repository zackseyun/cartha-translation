  - severity: low
    issue: Vị trí ký hiệu chú thích b chưa gắn trực tiếp với “Thánh Linh.”
    rationale: Chú thích b giải thích đối tượng quy chiếu của τοῦ πνεύματος, nên ký hiệu cần đặt ngay sau “Thánh Linh” để neo chú thích rõ ràng.
