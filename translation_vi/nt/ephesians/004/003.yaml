  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính của câu: sự chuyên cần/nỗ lực, gìn giữ một sự hiệp nhất đã có, Thánh Linh, và hình ảnh mối dây hòa bình. Tuy nhiên, “hết lòng” thiên về lòng thành hay sự tận tâm hơn là nỗ lực tích cực, khẩn thiết của σπουδάζοντες. “Hết sức” phản ánh sát hơn sắc thái “making every effort/being diligent.”'
  naturalness: Cấu trúc câu ngắn gọn, trang trọng và tự nhiên. “Hãy hết sức gìn giữ” là cách diễn đạt hiện đại, rõ nghĩa hơn “hãy hết lòng gìn giữ.” “Mối dây hòa bình” giữ được ẩn dụ cô đọng và vẫn thông dụng trong văn phong Kinh Thánh tiếng Việt.
  terminology: “Sự hiệp nhất,” “Thánh Linh,” và “gìn giữ” là các lựa chọn phù hợp. Chú thích về “Thánh Linh” cần được đặt ngay sau thuật ngữ mà nó giải thích, thay vì ở cuối câu. Không cần giải quyết thêm quan hệ ngữ pháp của “mối dây hòa bình.”
  issues:
