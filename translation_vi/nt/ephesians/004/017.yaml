id: EPH.4.17
reference: Ephesians 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: vi
  text: 'Vậy, tôi nói điều này và làm chứng trong Chúa: anh em không được tiếp tục sống như các dân ngoại sống[a], trong sự hư không của tâm trí họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các dân”; một số bản dịch dùng “những người ngoại đạo”.
    reason: Nêu các khả năng từ vựng của ἔθνη mà không áp đặt sắc thái tôn giáo mạnh hơn lên chính danh từ.
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: Vậy, tôi nói điều này
  rationale: οὖν đánh dấu kết luận suy ra từ lời khuyên trước đó; “vậy” nối kết tự nhiên trong tiếng Việt, còn Τοῦτο được giữ rõ là “điều này”.
- source_word: μαρτύρομαι
  choice: làm chứng
  rationale: Giữ sắc thái xác nhận long trọng và đích thân của động từ, thay vì diễn giải thành “khẩn thiết yêu cầu” hay “quả quyết”.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cấu trúc có thể chỉ phạm vi hiệp nhất với Chúa hoặc thẩm quyền trong đó Phao-lô nói, không thu hẹp thành “nhân danh Chúa” hay “trước mặt Chúa”.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: anh em không được tiếp tục sống
  rationale: μηκέτι đòi hỏi chấm dứt lối sống trước kia; cấu trúc nguyên mẫu mang lực khuyên răn/mệnh lệnh. “Sống” truyền đạt tự nhiên ẩn dụ đạo đức của περιπατέω trong tiếng Việt hiện đại.
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: như các dân ngoại
  rationale: “Các dân ngoại” giữ phạm trù dân tộc-giao ước quen thuộc trong Phao-lô, không thêm sắc thái miệt thị hoặc phán xét tôn giáo của “dân ngoại đạo”.
- source_word: περιπατεῖ
  choice: sống
  rationale: Dùng cùng một từ với περιπατεῖν để bảo toàn phép lặp và ý chỉ cách ăn ở, lối sống.
- source_word: ἐν ματαιότητι
  choice: trong sự hư không
  rationale: ματαιότης biểu thị tính trống rỗng, vô hiệu, không đạt mục đích. “Sự hư không” giữ độ rộng ngữ nghĩa và giọng trang trọng, dù “phù phiếm” hoặc “vô ích” cũng có thể diễn đạt một phần ý.
- source_word: τοῦ νοὸς αὐτῶν
  choice: của tâm trí họ
  rationale: νοῦς chỉ tâm trí, năng lực suy nghĩ; “tâm trí” trực tiếp hơn “sự hiểu biết” và không lẫn quá mức với διάνοια ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch ἔθνη trong lời đối chiếu đạo đức gửi đến cộng đồng phần lớn thuộc dân ngoại
  choice: các dân ngoại
  alternative: các dân; những người ngoại đạo
  rationale: “Các dân ngoại” bảo tồn phạm trù có tính dân tộc và giao ước trong cách dùng của Phao-lô, nhưng không biến danh từ thành lời quy kết rằng họ là “ngoại đạo”. Câu nói đối chiếu lối sống cũ với đời sống mới, không nhất thiết đưa ra khẳng định bản thể về mọi người không phải Do Thái.
- issue: Lực của nguyên mẫu περιπατεῖν sau λέγω καὶ μαρτύρομαι
  choice: anh em không được tiếp tục sống
  alternative: để anh em không còn sống; anh em phải thôi sống
  rationale: Tiếng Việt cần biểu đạt rõ lực khuyên răn nghiêm trọng của cú pháp. “Không được tiếp tục” chuyển tải yêu cầu chấm dứt mà không thêm một phạm trù thần học ngoài văn bản.
- issue: Ý nghĩa của ἐν κυρίῳ
  choice: trong Chúa
  alternative: bởi Chúa; trước mặt Chúa; nhân danh Chúa
  rationale: Giữ nguyên sự mơ hồ chân thực giữa phạm vi hiệp nhất với Chúa và thẩm quyền phát ngôn, thay vì chỉ chọn một quan hệ cụ thể.
translation_notes:
  register: Văn phong trang trọng, tự nhiên và dễ hiểu. Đại từ “anh em” phù hợp lời khuyên gửi cộng đồng. Dịch περιπατέω là “sống” thay vì “bước đi” vì đây là ẩn dụ về cách ăn ở; phép lặp được giữ ở cả hai lần xuất hiện. Dấu [a] có mặt ngay sau cụm từ liên quan.
