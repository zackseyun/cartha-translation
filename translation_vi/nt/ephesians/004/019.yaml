  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: vi
  text: Họ đã trở nên chai lì[a], tự buông mình vào sự phóng túng[b], để làm mọi điều ô uế với lòng tham vô độ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã mất hết cảm giác” hoặc “không còn nhạy cảm nữa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự trụy lạc” hoặc “sự buông thả vô liêm sỉ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “trong sự tham lam”; từ này diễn tả ham muốn có hoặc hưởng thụ ngày càng nhiều, không biết đủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Họ
  rationale: Đại từ quan hệ nối với những người ngoại quốc vừa được nhắc đến; dùng “Họ” tạo câu tiếng Việt tự nhiên mà không thêm sắc thái nhấn mạnh không chắc chắn.
- source_word: ἀπηλγηκότες
  choice: đã trở nên chai lì
  rationale: Phân từ hoàn thành diễn tả tình trạng mất nhạy cảm về đạo đức đã hình thành và còn tiếp diễn. “Chai lì” rõ nghĩa, tự nhiên và không giới hạn vào sự tê liệt cảm xúc.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: tự buông mình vào
  rationale: Giữ được ý chủ động tự trao nộp hoặc phó mặc chính mình cho thói xấu; cách nói này tự nhiên trong tiếng Việt hiện đại.
- source_word: τῇ ἀσελγείᾳ
  choice: lối sống phóng túng
  rationale: ἀσέλγεια chỉ sự buông thả vô liêm sỉ, thường nhưng không chỉ mang nghĩa tình dục. “Lối sống phóng túng” giữ phạm vi rộng và hợp văn cảnh.
- source_word: εἰς ἐργασίαν
  choice: để làm
  rationale: Diễn đạt mục đích hoặc kết quả của việc tự buông mình; ngắn gọn và tự nhiên hơn cách dịch sát chữ “để thực hành”.
- source_word: ἀκαθαρσίας πάσης
  choice: đủ mọi điều ô uế
  rationale: Truyền đạt tính bao quát của πάσης và biến danh từ trừu tượng thành cách nói tiếng Việt dễ hiểu mà không thu hẹp nội dung.
- source_word: ἐν πλεονεξίᾳ
  choice: với lòng tham vô độ
  rationale: πλεονεξία diễn tả ham muốn chiếm hữu hoặc hưởng thụ ngày càng nhiều. Cụm này giữ sắc thái không biết đủ và có thể bổ nghĩa cho cách họ làm điều ô uế.
theological_decisions:
- issue: Sức nặng đạo đức–tâm lý của ἀπηλγηκότες
  choice: Dịch là tình trạng “chai lì” về đạo đức.
  alternative: “mất hết cảm giác” hoặc “không còn biết hổ thẹn”
  rationale: Văn cảnh nói về sự xa cách Đức Chúa Trời và việc tự buông mình vào ô uế. “Chai lì” phản ánh sự mất nhạy cảm đạo đức nhưng không diễn giải quá mức thành hoàn toàn mất cảm xúc hay chỉ mất lòng hổ thẹn.
- issue: Phạm vi nghĩa của ἀσέλγεια
  choice: “lối sống phóng túng” theo nghĩa rộng của sự buông thả vô liêm sỉ.
  alternative: “dâm dục” hoặc “trụy lạc”
  rationale: Từ Hy Lạp thường bao gồm tội lỗi tình dục nhưng không nhất thiết chỉ giới hạn ở đó; bản dịch giữ độ rộng của thuật ngữ trong khi vẫn phù hợp với “mọi điều ô uế”.
- issue: Quan hệ của ἐν πλεονεξίᾳ với mệnh đề
  choice: 'Hiểu là cách thức hoặc thái độ khi làm điều ô uế: “với lòng tham vô độ”.'
  alternative: “trong sự tham lam” hoặc hiểu πλεονεξία theo nghĩa ham muốn chiếm hữu
  rationale: Cấu trúc Hy Lạp cho phép sắc thái tham muốn không biết đủ. Bản dịch không thu hẹp nó chỉ vào lòng tham tiền bạc, cũng không quyết đoán rằng nó chỉ là ham muốn tình dục.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chai lì,” “tự buông mình,” và “lòng tham vô độ” giữ sức nặng đạo đức của câu mà tránh từ cổ hoặc thuật ngữ giáo phái. Các chú thích bảo tồn những khả năng nghĩa chính của bản Hy Lạp.
