  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: vi
  text: với tất cả sự khiêm nhường và dịu dàng, với lòng kiên nhẫn, chịu đựng nhau trong tình yêu thương,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: với tất cả lòng khiêm nhường
  rationale: μετά với sở hữu cách diễn tả sự đi kèm; πάσης nhấn mạnh mức độ trọn vẹn. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên lực nhấn mạnh của nguyên văn.
- source_word: πραΰτητος
  choice: sự dịu dàng
  rationale: Từ này chỉ phẩm chất hiền hòa, mềm mại nhưng có tự chủ. “Sự dịu dàng” là cách nói hiện đại, rõ nghĩa và không gợi sự yếu đuối như một số cách dịch khác.
- source_word: μακροθυμίας
  choice: lòng kiên nhẫn
  rationale: Danh từ này nói đến sự nhẫn nại lâu dài đối với người khác, đặc biệt là chậm nóng giận. “Lòng kiên nhẫn” phù hợp với ngữ cảnh quan hệ giữa người với người.
- source_word: ἀνεχόμενοι
  choice: chịu đựng
  rationale: Phân từ hiện tại diễn tả việc tiếp tục nhẫn nhịn và dung chịu người khác. “Chịu đựng” giữ được sắc thái gánh chịu trong quan hệ mà không quá khẩu ngữ.
- source_word: ἀλλήλων
  choice: nhau
  rationale: Đại từ hỗ tương được diễn đạt tự nhiên và đầy đủ trong tiếng Việt bằng “nhau”.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: ἐν có thể chỉ phạm vi hoặc cách thức; “trong tình yêu thương” giữ được cấu trúc và sự mở nghĩa ấy. “Tình yêu thương” diễn đạt tự nhiên phẩm chất ἀγάπη trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch ἀγάπη
  choice: tình yêu thương
  alternative: tình yêu; lòng yêu thương
  rationale: “Tình yêu thương” rõ ràng, trang trọng và tự nhiên trong ngữ cảnh đạo đức cộng đồng; không thu hẹp từ này vào tình cảm lãng mạn hay áp đặt một nét nghĩa giáo phái.
- issue: Quan hệ của ἐν ἀγάπῃ với ἀνεχόμενοι
  choice: chịu đựng nhau trong tình yêu thương
  alternative: lấy tình yêu thương mà chịu đựng nhau
  rationale: Giữ “trong” bảo tồn khả năng ἐν chỉ cả phạm vi lẫn cách thức, thay vì quyết định dứt khoát rằng cụm từ chỉ phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc chuỗi phẩm chất của nguyên văn; dấu phẩy cuối phản ánh đây là phần tiếp nối của câu trong Ê-phê-sô 4:1–3.
