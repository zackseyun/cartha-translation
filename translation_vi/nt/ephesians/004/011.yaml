id: EPH.4.11
reference: Ephesians 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: vi
  text: 'Và chính Ngài đã ban những người này: một số làm sứ đồ, một số làm nhà tiên tri, một số làm người truyền giảng Tin Lành, và một số làm người chăn[a] và người dạy dỗ[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mục sư”. Tiếng Hy Lạp theo nghĩa đen là “người chăn”.
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, chỉ có một mạo từ đứng trước cụm “người chăn và người dạy dỗ”. Điều này có thể cho thấy hai vai trò có liên hệ đặc biệt gần gũi, nhưng cụm từ không nhất thiết chỉ một chức vụ duy nhất.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Và (được thể hiện tự nhiên trong mạch nối bằng câu mở đầu “Chính Ngài”)
  rationale: Liên từ nối câu này với ngữ cảnh trước; trong tiếng Việt, mối nối có thể được giữ tự nhiên mà không nhất thiết mở đầu cứng nhắc bằng “Và”.
- source_word: αὐτὸς
  choice: Chính Ngài
  rationale: Giữ sắc thái nhấn mạnh của đại từ Hy Lạp, đồng thời dùng cách diễn đạt trang trọng và tự nhiên.
- source_word: ἔδωκεν
  choice: đã ban cho
  rationale: δίδωμι mang nghĩa căn bản là “ban/cho”; “ban cho” hợp với chủ thể là Đấng Christ và không thu hẹp nghĩa thành “bổ nhiệm”.
- source_word: τοὺς μὲν ἀποστόλους
  choice: một số người làm sứ đồ
  rationale: Cấu trúc lặp τοὺς μὲν ... τοὺς δὲ biểu thị sự phân nhóm; “một số người làm...” diễn đạt rõ các vai trò mà những người ấy được ban cho.
- source_word: προφήτας
  choice: nhà tiên tri
  rationale: Cách dịch trực tiếp, quen thuộc và phù hợp với danh sách các vai trò phục vụ.
- source_word: εὐαγγελιστάς
  choice: người truyền giảng Tin Lành
  rationale: Diễn đạt rõ nghĩa của εὐαγγελιστής bằng tiếng Việt hiện đại hơn danh từ vay mượn hoặc thuật ngữ khó hiểu.
- source_word: ποιμένας
  choice: người chăn dắt
  rationale: Giữ hình ảnh người chăn của ποιμήν, nhưng “người chăn dắt” tự nhiên hơn “người chăn” khi chỉ vai trò chăm sóc cộng đồng; “mục sư” được ghi ở chú thích như cách dịch truyền thống.
- source_word: καὶ διδασκάλους
  choice: và giáo sư
  rationale: Dịch trực tiếp danh từ chỉ người dạy dỗ; giữ nguyên phép nối để không quyết định thay văn bản rằng đây là một chức vụ duy nhất hay hai chức năng có quan hệ gần gũi.
theological_decisions:
- issue: Nên dịch ποιμένας bằng hình ảnh nguyên ngữ hay danh xưng giáo hội truyền thống
  choice: người chăn dắt
  alternative: mục sư
  rationale: Bản chính giữ hình ảnh chăn dắt của tiếng Hy Lạp, tránh áp đặt cơ cấu chức vụ phát triển về sau; cách gọi truyền thống được bảo lưu trong chú thích.
- issue: “Người chăn dắt và giáo sư” là một nhóm kết hợp hay hai nhóm riêng
  choice: Giữ hai danh từ nối bằng “và”, không phân xử
  alternative: người vừa chăn dắt vừa dạy dỗ; hoặc hai nhóm chức vụ hoàn toàn tách biệt
  rationale: Một mạo từ chung trước hai danh từ gợi ý mối liên hệ đặc biệt gần gũi, nhưng cú pháp không buộc phải hiểu là một chức vụ duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Chính Ngài” để giữ sự nhấn mạnh; dùng “người truyền giảng Tin Lành” và “người chăn dắt” để rõ nghĩa với độc giả phổ thông, đồng thời bảo lưu thuật ngữ “mục sư” trong chú thích.
