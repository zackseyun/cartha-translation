- from: 'Vì thế, có lời rằng: “Khi lên nơi cao, Ngài đã dẫn theo một đoàn tù binh[a] và ban các quà tặng cho loài người[b].”'
  to: 'Vì thế, có lời rằng: “Khi lên nơi cao, Ngài đã dẫn đoàn tù binh đi[a] và ban những quà tặng cho loài người[b].”'
  rationale: Sửa chú thích a để diễn giải chính xác lối nói đồng căn Hy Lạp mà không ép cụm từ vào một cách giải thích lịch sử hoặc thần học. Chỉnh nhẹ bản chính để tiếng Việt tự nhiên hơn và giữ rõ hơn hình ảnh “dẫn ... đi,” trong khi vẫn không cố xác định các tù binh là ai.
