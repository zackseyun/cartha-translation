source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: vi
  text: 'Vì thế, có lời rằng: “Khi lên nơi cao, Ngài đã dẫn đoàn tù binh đi[a] và ban những quà tặng cho loài người[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một lối nói đồng căn, gần nghĩa là “bắt/đem một đoàn người bị bắt làm tù binh.” Cũng có thể dịch “dẫn những kẻ bị bắt đi.” Cách nói giàu hình ảnh này vọng lại Thi Thiên 68:18.
    reason: lexical_alternative
  - marker: b
    text: “Loài người” ở đây chỉ con người nói chung, không riêng nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Giữ quan hệ suy luận với lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγει
  choice: có lời rằng
  rationale: Động từ không có chủ ngữ được nêu rõ. Cách dịch này phù hợp với công thức trích dẫn mà không tự ý xác định chủ thể là Đức Chúa Trời, tác giả Thi Thiên hay Kinh Thánh.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: Khi lên nơi cao
  rationale: Diễn đạt tự nhiên phân từ bất định chỉ hành động đi lên, đồng thời giữ sắc thái trang trọng và tiếng vọng của Thi Thiên 68:18.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: đã dẫn theo một đoàn tù binh
  rationale: Chuyển thành ngữ đồng căn giàu hình ảnh của tiếng Hy Lạp sang một cách nói rõ nghĩa trong tiếng Việt, nhưng dùng chú thích để bảo lưu kết cấu và các khả năng hiểu khác.
- source_word: ἔδωκεν δόματα
  choice: ban các quà tặng
  rationale: “Ban” phù hợp với văn phong trang trọng; “các quà tặng” giữ nghĩa rộng của δόματα mà không vội chuyên biệt hóa thành một loại ân tứ thần học.
- source_word: τοῖς ἀνθρώποις
  choice: cho loài người
  rationale: ἄνθρωποι ở đây có thể chỉ con người nói chung; “loài người” truyền đạt đúng phạm vi bao quát và tự nhiên hơn cách dịch nam giới cụ thể.
theological_decisions:
- issue: Hình ảnh về việc bắt giữ trong lời trích dẫn Thi Thiên 68:18
  choice: dẫn theo một đoàn tù binh
  alternative: bắt sự tù đày làm tù binh; dẫn những kẻ bị bắt đi
  rationale: Cụm đồng căn trong tiếng Hy Lạp cố ý giàu sức gợi nhưng nếu sao chép từng chữ sẽ tối nghĩa trong tiếng Việt. Bản chính dùng cách diễn đạt dễ hiểu, còn chú thích giữ lại hình thức tu từ và không xác định danh tính hay ý nghĩa thần học của các tù binh.
- issue: Phạm vi giới tính của τοῖς ἀνθρώποις
  choice: loài người
  alternative: những người; người ta
  rationale: Danh từ số nhiều giống đực trong ngữ cảnh này được dùng theo nghĩa khái quát. “Loài người” không giới hạn quà tặng cho nam giới và không thêm một lập trường giáo phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Có lời rằng” bảo lưu việc câu Hy Lạp không nêu chủ ngữ; “dẫn theo một đoàn tù binh” tránh lối dịch từng chữ khó hiểu mà vẫn giữ hình ảnh chiến thắng của lời trích dẫn.
