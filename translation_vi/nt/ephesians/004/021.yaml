revisions:
- from: nếu quả thật anh chị em đã nghe chính Ngài và được dạy dỗ trong Ngài[a], đúng như chân lý ở trong Đức Chúa Jêsus[b],
  to: nếu quả thật anh chị em đã nghe Ngài và được dạy dỗ trong Ngài[a], đúng như chân lý ở trong Giê-su[b],
  rationale: Loại bỏ danh xưng «Đức Chúa» để phản ánh chính xác việc nguyên văn cố ý dùng tên riêng Ἰησοῦ; đổi sang «Giê-su» theo chính tả hiện đại. Bỏ «chính» trong bản văn để không thêm sắc thái nhấn, trong khi chú thích vẫn có thể nói đến tính nổi bật của cách dùng tân ngữ trực tiếp. Giữ các cụm «trong Ngài / ở trong Giê-su», thể bị động và dấu phẩy cuối câu vì đây là một mệnh đề phụ thuộc tiếp diễn sang câu sau.
  reviewer_model: gpt-5.6-terra
