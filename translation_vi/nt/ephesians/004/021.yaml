source:
  edition: SBLGNT
  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: vi
  text: nếu quả thật anh chị em đã nghe Ngài và được dạy dỗ trong Ngài[a], đúng như chân lý ở trong Giê-su[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nghe nói về Ngài.” Nguyên văn Hy Lạp sát nghĩa hơn là “đã nghe Ngài,” có lẽ hàm ý rằng khi nghe sứ điệp của các sứ đồ, họ thật sự nghe chính Đấng Christ.'
    reason: alternative_reading
  - marker: b
    text: Các cụm “trong Ngài” và “ở trong Giê-su” có thể diễn tả phạm vi, sự kết hiệp hoặc mối liên hệ mật thiết; nguyên văn Hy Lạp để ngỏ sắc thái rộng hơn cách hiểu đơn thuần là “bởi Ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: nếu quả thật
  rationale: Giữ hình thức điều kiện cùng sắc thái nhấn nhẹ của γε, trong khi không chuyển hẳn thành quan hệ nguyên nhân như “vì quả thật”.
- source_word: αὐτὸν ἠκούσατε
  choice: đã nghe chính Ngài
  rationale: Đại từ αὐτόν là tân ngữ trực tiếp, nên bản dịch giữ cách nói nổi bật “nghe chính Ngài”; từ “chính” làm rõ cấu trúc này trong tiếng Việt mà không biến thành “nghe nói về Ngài”.
- source_word: ἐν αὐτῷ
  choice: trong Ngài
  rationale: Giữ giới từ ἐν, để ngỏ các sắc thái về phạm vi, sự kết hiệp hay mối liên hệ mật thiết, thay vì thu hẹp thành tác nhân “bởi Ngài”.
- source_word: ἐδιδάχθητε
  choice: được dạy dỗ
  rationale: Diễn đạt tự nhiên thể bị động aorist và phù hợp với văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: καθώς
  choice: đúng như
  rationale: Thể hiện sức so sánh của καθώς và nối điều họ được dạy với chân lý ở trong Đức Chúa Jêsus.
- source_word: ἀλήθεια
  choice: chân lý
  rationale: Danh từ không có mạo từ được dịch không kèm từ chỉ định; “chân lý” tự nhiên trong ngữ cảnh giáo huấn và vẫn chỉ điều chân thật được tìm thấy nơi Đức Chúa Jêsus.
- source_word: ἐν τῷ Ἰησοῦ
  choice: ở trong Đức Chúa Jêsus
  rationale: Giữ tên riêng Ἰησοῦ và giới từ ἐν; “ở trong” tự nhiên hơn trong mệnh đề vị ngữ tiếng Việt, đồng thời bảo tồn độ rộng của cách diễn đạt Hy Lạp.
theological_decisions:
- issue: Nên hiểu αὐτὸν ἠκούσατε là “nghe chính Ngài” hay “nghe nói về Ngài”.
  choice: đã nghe chính Ngài
  alternative: đã nghe nói về Ngài
  rationale: Cấu trúc tân ngữ trực tiếp ủng hộ nghĩa sát là “nghe Ngài” và có thể gợi ý rằng qua lời rao giảng, họ thực sự nghe chính Đấng Christ. Chú thích giữ lại cách hiểu thành ngữ có thể có.
- issue: Cách chuyển hai cụm ἐν αὐτῷ và ἐν τῷ Ἰησοῦ.
  choice: trong Ngài / ở trong Đức Chúa Jêsus
  alternative: bởi Ngài / trong sự kết hiệp với Đức Chúa Jêsus
  rationale: Giữ ἐν bằng “trong/ở trong” bảo tồn sự căng mở giữa phạm vi, sự kết hiệp và mối liên hệ mật thiết, không thu hẹp thành tác nhân hoặc một cách diễn giải thần học duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều; viết hoa “Ngài” để quy chiếu rõ đến Đấng Christ. Giữ cách nói Phao-lô “trong Ngài / ở trong Đức Chúa Jêsus” thay vì diễn giải quá mức.
