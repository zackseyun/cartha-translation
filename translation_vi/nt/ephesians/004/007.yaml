source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: vi
  text: Nhưng ân điển đã được ban cho từng người trong chúng ta, theo mức độ của quà tặng của Đấng Mê-si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ”. Từ Hy Lạp Χριστός (ở đây ở dạng sở hữu Χριστοῦ) có nghĩa là “Đấng Mê-si”; “Đấng Christ” là cách gọi truyền thống.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑνὶ δὲ ἑκάστῳ ἡμῶν
  choice: Nhưng ... từng người trong chúng ta
  rationale: δέ đánh dấu sự chuyển nhẹ từ sự hiệp một ở các câu trước sang sự phân bổ khác nhau cho mỗi cá nhân; “từng người” giữ được sắc thái phân phối và nhấn mạnh của ἑνὶ ... ἑκάστῳ.
- source_word: ἐδόθη
  choice: đã được ban cho
  rationale: Giữ thể bị động và giá trị quá khứ đơn của động từ aorist, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἡ χάρις
  choice: ân điển
  rationale: Giữ thuật ngữ thần học quen thuộc của Phao-lô mà không thu hẹp nghĩa thành riêng ân điển cứu rỗi hay diễn giải thành năng lực phục vụ.
- source_word: κατὰ τὸ μέτρον
  choice: tùy theo mức độ
  rationale: κατά với đối cách diễn tả chuẩn mực hoặc tỷ lệ; cách dịch này rõ ràng, tự nhiên và giữ ý niệm phân bổ có mức lượng.
- source_word: τῆς δωρεᾶς
  choice: món quà
  rationale: δωρεά chỉ điều được ban tặng nhưng không đòi hỏi phải thêm tính từ “nhưng không”; “món quà” phân biệt được với χάρις trong cùng câu.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός tại đây vẫn mang nội dung tước hiệu; “Đấng Mê-si” chuyển tải nghĩa của tước hiệu thay vì chỉ phiên âm theo truyền thống.
theological_decisions:
- issue: Ý nghĩa của χάρις trong ngữ cảnh
  choice: Giữ là “ân điển” để câu văn có thể chỉ ân huệ được phân bổ cho từng người trong thân thể.
  alternative: Diễn giải là “ân tứ” hoặc “năng lực phục vụ”.
  rationale: Ngữ cảnh kế tiếp nói về các ân ban và chức vụ, nhưng bản thân χάρις vẫn là “ân điển”; không nên thu hẹp nghĩa ngay trong bản văn.
- issue: Quan hệ sở hữu trong τῆς δωρεᾶς τοῦ Χριστοῦ
  choice: “món quà của Đấng Mê-si”
  alternative: “món quà Đấng Mê-si ban” hoặc “món quà là chính Đấng Mê-si”
  rationale: Cấu trúc sở hữu Hy Lạp có thể được hiểu là món quà thuộc về hoặc do Đấng Mê-si ban. Bản dịch giữ cấu trúc mở, không tự ý xác định quan hệ chủ thể hay đồng nhất món quà với chính Đấng Mê-si.
- issue: Cách chuyển Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây từ này thích hợp được hiểu như tước hiệu; bản dịch chính bảo tồn nội dung nghĩa của tước hiệu, còn cách gọi truyền thống được ghi ở chú thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Từng người trong chúng ta” nhấn mạnh sự phân bổ cá nhân; “tùy theo mức độ” tránh lối nói quá cổ “theo lượng”. Dấu chú thích [a] được đặt ngay sau “Đấng Mê-si”, là cụm từ mà chú thích giải thích.
