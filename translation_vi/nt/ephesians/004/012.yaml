  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: vi
  text: nhằm trang bị các thánh đồ cho công việc phục vụ[a], nhằm xây dựng thân thể của Đấng Mê-si[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công việc thừa tác.” Từ Hy Lạp διακονία có thể chỉ sự phục vụ nói chung hoặc công tác phục vụ trong cộng đồng đức tin.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Được Xức Dầu.”
    reason: alternative_reading
  - marker: c
    text: 'Câu Hy Lạp cũng có thể được hiểu theo tiến trình: “nhằm trang bị các thánh đồ để làm công việc phục vụ, qua đó xây dựng thân thể của Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: nhằm trang bị
  rationale: Cụm này diễn tả mục đích; “trang bị” truyền đạt ý chuẩn bị, làm cho thích hợp để đảm nhận nhiệm vụ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τῶν ἁγίων
  choice: các thánh đồ
  rationale: Đây là cách gọi quen thuộc trong văn mạch Phao-lô dành cho toàn thể những người thuộc về Đức Chúa Trời, không chỉ một nhóm người được phong thánh về sau.
- source_word: εἰς ἔργον διακονίας
  choice: cho công việc phục vụ
  rationale: “Công việc” phản ánh danh từ số ít ἔργον; “phục vụ” giữ được nghĩa rộng của διακονία và không khiến người đọc hiểu rằng công việc này chỉ thuộc về hàng giáo phẩm.
- source_word: εἰς οἰκοδομὴν
  choice: nhằm xây dựng
  rationale: “Xây dựng” giữ nguyên ẩn dụ kiến thiết của οἰκοδομή và diễn đạt tự nhiên việc làm cho cộng đồng vững mạnh, trưởng thành.
- source_word: τοῦ σώματος
  choice: thân thể
  rationale: Giữ nguyên hình ảnh chủ đạo của Phao-lô về cộng đồng tín hữu như một thân thể.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu; “Đấng Mê-si” bảo tồn ý nghĩa tước hiệu của từ Hy Lạp, còn cách gọi “Đấng Christ” được ghi ở chú thích.
theological_decisions:
- issue: Quan hệ cú pháp giữa ba cụm chỉ mục đích πρὸς ... εἰς ... εἰς
  choice: Bản văn chính giữ hai vế sau như những cụm mục đích song song với việc trang bị các thánh đồ.
  alternative: 'Có thể hiểu theo tiến trình: trang bị các thánh đồ để họ làm công việc phục vụ, qua đó xây dựng thân thể của Đấng Mê-si.'
  rationale: Cấu trúc Hy Lạp cho phép cả cách hiểu song song lẫn cách hiểu theo tiến trình. Bản dịch chính bám sát hình thức cú pháp, còn chú thích bảo tồn cách hiểu tiến trình, tránh quyết định thay bản văn rằng công việc phục vụ chủ yếu thuộc về giới lãnh đạo hay toàn thể các thánh đồ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Các thánh đồ” duy trì thuật ngữ Phao-lô quen thuộc; “công việc phục vụ” dễ hiểu và không bị giới hạn vào chức vụ giáo sĩ. Dấu phẩy cuối được giữ vì câu này tiếp nối sang câu 13.
