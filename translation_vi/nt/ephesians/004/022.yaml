id: EPH.4.22
reference: Ephesians 4:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: vi
  text: cởi bỏ[a] con người cũ, tức con người thuộc về lối sống trước kia của anh chị em, đang bị hư hoại theo những ham muốn do sự lừa dối chi phối[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng động từ nguyên mẫu “cởi bỏ,” phụ thuộc vào mạch “anh chị em đã được dạy” ở câu 21. Cũng có thể dịch: “được dạy phải cởi bỏ.”'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Sát nghĩa: “những ham muốn của sự lừa dối”; tức là những ham muốn được sự lừa dối định hình hoặc chi phối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: hãy cởi bỏ
  rationale: Giữ hình ảnh thay y phục, tương ứng với “mặc lấy” ở câu 24. Dạng mệnh lệnh giúp câu tiếng Việt đứng tự nhiên trong mạch lời dạy, dù nguyên văn dùng động từ nguyên mẫu phụ thuộc vào câu 21; chú thích ghi nhận cấu trúc ấy.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: xét theo lối sống trước kia của anh chị em
  rationale: ἀναστροφή chỉ cách cư xử hay nếp sống; κατά ở đây nêu phương diện liên hệ. “Xét theo” diễn đạt quan hệ ấy mà không biến lối sống cũ thành nguyên nhân của sự hư hoại.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: con người cũ
  rationale: Dịch sát thành ngữ nhân học của Phao-lô, tự nhiên trong tiếng Việt và không giới hạn vào nam giới. Cách nói này giữ được sắc thái con người thuộc nếp sống cũ hơn là thu hẹp thành một phần nội tâm.
- source_word: τὸν φθειρόμενον
  choice: là con người đang bị hư hoại
  rationale: 'Giữ lực hiện tại, bị động của phân từ: một tiến trình suy đồi đang diễn ra.'
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: theo những ham muốn do sự lừa dối chi phối
  rationale: “Ham muốn” đủ rộng, không giới hạn vào dục vọng tình dục. Cách diễn đạt làm rõ sở hữu cách “của sự lừa dối” mà vẫn ghi nhận lối dịch sát trong chú thích.
theological_decisions:
- issue: Cách hiểu τὸν παλαιὸν ἄνθρωπον
  choice: con người cũ
  alternative: bản ngã cũ
  rationale: “Con người cũ” giữ hình thức nhân học và khả năng có sắc thái đại diện/cộng đồng, trong khi “bản ngã cũ” dễ thu hẹp ý nghĩa vào cái tôi nội tâm.
- issue: Lực của động từ nguyên mẫu ἀποθέσθαι
  choice: hãy cởi bỏ, đồng thời chú thích rằng nguyên văn dùng động từ nguyên mẫu
  alternative: được dạy phải cởi bỏ / đã cởi bỏ
  rationale: Trong tiếng Việt, “hãy” nối tự nhiên với nội dung giáo huấn, nhưng không nên âm thầm quyết định toàn bộ căng thẳng giữa lời truyền dạy, nội dung đã học và biến cố hoán cải; chú thích bảo tồn cấu trúc và sự mơ hồ của nguyên văn.
- issue: Quan hệ của τῆς ἀπάτης với ἐπιθυμίας
  choice: những ham muốn do sự lừa dối chi phối
  alternative: những ham muốn lừa dối / những ham muốn của sự lừa dối
  rationale: Sở hữu cách có thể chỉ nguồn gốc hoặc đặc tính. Bản dịch chính diễn đạt ảnh hưởng của sự lừa dối nhưng chú thích giữ dạng sát chữ, tránh xác quyết quá mức rằng chính các ham muốn là chủ thể thực hiện việc lừa dối.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm diễn đạt cộng đồng gồm cả nam lẫn nữ. Giữ ẩn dụ “cởi bỏ” và thuật ngữ “con người cũ.” Dấu phẩy cuối phản ánh câu Hy Lạp còn tiếp sang các câu kế tiếp.
