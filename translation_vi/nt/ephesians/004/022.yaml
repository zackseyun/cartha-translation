  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các yếu tố chính: ẩn dụ “cởi bỏ,” “con người cũ,” tiến trình bị động đang diễn ra của φθειρόμενον, và các ham muốn liên hệ với sự lừa dối. Tuy nhiên, “hãy cởi bỏ” chuyển động từ nguyên mẫu ἀποθέσθαι thành mệnh lệnh trực tiếp, trong khi nguyên ngữ để nó phụ thuộc vào nội dung của điều độc giả đã được dạy ở câu 21. Cụm “xét theo lối sống trước kia” đặt ở cuối câu cũng làm quan hệ của κατὰ τὴν προτέραν ἀναστροφὴν với “con người cũ” kém rõ.'
  naturalness: Bản sửa dùng một cụm chen giải thích để tiếng Việt tự nhiên hơn mà vẫn giữ cấu trúc phân đoạn của câu. “Con người cũ, tức con người thuộc về lối sống trước kia của anh chị em” diễn đạt rõ phạm vi/liên hệ của κατά mà không biến lối sống cũ thành nguyên nhân. “Đang bị hư hoại” là cách nói tự nhiên, phù hợp văn phong trang trọng vừa phải.
  terminology: “Con người cũ” là lựa chọn phù hợp cho τὸν παλαιὸν ἄνθρωπον và không giới hạn giới tính. “Cởi bỏ” bảo toàn hình ảnh y phục, đối ứng với “mặc lấy” ở câu 24. “Ham muốn do sự lừa dối chi phối” là một diễn đạt hợp lý cho sở hữu cách τῆς ἀπάτης, với chú thích giữ phương án sát chữ.
