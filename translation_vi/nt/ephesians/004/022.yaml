- from: hãy cởi bỏ[a] con người cũ, là con người đang bị hư hoại theo những ham muốn do sự lừa dối chi phối[b], xét theo lối sống trước kia của anh chị em,
  to: cởi bỏ[a] con người cũ, tức con người thuộc về lối sống trước kia của anh chị em, đang bị hư hoại theo những ham muốn do sự lừa dối chi phối[b],
  rationale: Bỏ “hãy” để không chuyển nguyên mẫu Hy Lạp thành mệnh lệnh trực tiếp. Đưa quan hệ với “lối sống trước kia” sát “con người cũ” bằng cụm “tức con người thuộc về...”, giúp phản ánh κατὰ theo nghĩa phương diện/liên hệ và làm rõ cú pháp trong tiếng Việt. Giữ “đang bị hư hoại,” “cởi bỏ,” và chú thích về sở hữu cách “của sự lừa dối.”
