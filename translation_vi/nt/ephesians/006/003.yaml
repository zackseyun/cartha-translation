  yaml_path: translation/nt/ephesians/006/003.yaml
  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: vi
  text: để mọi việc được tốt đẹp cho con và con sống lâu trên đất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong xứ,” theo cách diễn đạt của điều răn thứ năm trong Xuất Ai Cập 20:12 và Phục Truyền Luật Lệ 5:16.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn tả mục đích hoặc kết quả của lời hứa gắn với điều răn ở câu trước, tự nhiên và súc tích trong tiếng Việt.
- source_word: εὖ σοι γένηται
  choice: con được phước
  rationale: Cụm Hy Lạp có nghĩa đen là sự việc diễn tiến tốt đẹp đối với người nghe. “Được phước” là cách diễn đạt trang trọng, tự nhiên trong ngữ cảnh lời hứa, nhưng không xác định phước ấy chỉ là thịnh vượng vật chất.
- source_word: καὶ
  choice: và
  rationale: Giữ nguyên liên từ nối hai kết quả được hứa.
- source_word: ἔσῃ μακροχρόνιος
  choice: sống lâu
  rationale: ἔσῃ về hình thức là “con sẽ là,” còn μακροχρόνιος là “trường thọ”; cả cụm được chuyển tự nhiên thành “sống lâu.”
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Bám sát phạm vi nghĩa của γῆ, đồng thời giữ được sự mơ hồ giữa “đất/địa cầu” và tiếng vọng về “xứ” trong điều răn thứ năm.
theological_decisions:
- issue: Phạm vi của ἐπὶ τῆς γῆς trong mối liên hệ với lời hứa của điều răn thứ năm
  choice: trên đất
  alternative: trong xứ
  rationale: “Trên đất” theo sát câu Hy Lạp của Ê-phê-sô và không tự ý bổ sung ý niệm về miền đất giao ước; chú thích vẫn ghi nhận cách hiểu “trong xứ” do tiếng vọng từ Xuất Ai Cập 20:12 và Phục Truyền Luật Lệ 5:16.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” tiếp nối lời trực tiếp dành cho con cái ở câu trước. Cụm “được phước” truyền đạt thành ngữ εὖ σοι γένηται tự nhiên trong văn cảnh Kinh Thánh mà không giới hạn lời hứa vào sự sung túc vật chất.
