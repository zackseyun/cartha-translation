id: EPH.6.7
reference: Ephesians 6:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: vi
  text: hãy phục vụ với thiện ý, như phục vụ Chúa chứ không phải người ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “con người”; từ Hy Lạp chỉ loài người trong thế đối lập với Chúa.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: với thiện ý
  rationale: μετά với sở hữu cách diễn tả cách thức hoặc thái độ đi kèm; εὔνοια chỉ thiện chí, ý hướng tốt và lòng sẵn sàng. “Với thiện ý” ngắn gọn, trang trọng và giữ trọng tâm ở thái độ bên trong.
- source_word: δουλεύοντες
  choice: hãy phục vụ
  rationale: Phân từ δουλεύοντες mang nghĩa phục vụ trong thân phận nô lệ. Ngữ cảnh trước đã xác định người được nói với là nô lệ; ở đây “phục vụ” diễn đạt tự nhiên hành động được nhấn mạnh. Dùng thể mệnh lệnh để chuyển chức năng khuyên bảo của phân từ phụ thuộc trong mạch câu.
- source_word: ὡς
  choice: như
  rationale: ὡς đưa vào sự so sánh về cách phục vụ; “như” giữ được cấu trúc súc tích mà không thêm sắc thái giả định như “như thể”.
- source_word: τῷ κυρίῳ
  choice: phục vụ Chúa
  rationale: κύριος ở đây là tước hiệu chỉ Chúa, đối lập với những chủ nhân là người trong ngữ cảnh. Lặp lại “phục vụ” trong tiếng Việt làm quan hệ hướng đến Chúa rõ ràng và tự nhiên.
- source_word: ἀνθρώποις
  choice: người ta
  rationale: Dạng số nhiều chỉ loài người nói chung trong thế đối lập với Chúa. “Người ta” là cách diễn đạt tiếng Việt tự nhiên, không giới hạn vào nam giới, dù trong ngữ cảnh trực tiếp những người này là các chủ nhân.
theological_decisions:
- issue: Cách dịch κύριος khi đối lập với các chủ nhân là người
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” giữ tước hiệu quy chiếu đến Chúa Giê-su và tránh làm mờ sự phân biệt giữa Ngài với các chủ nhân trần thế trong đoạn văn.
- issue: Mức độ biểu đạt sắc thái nô lệ của δουλεύοντες
  choice: phục vụ
  alternative: phục dịch như nô lệ
  rationale: Ngữ cảnh gần đã nêu rõ thân phận nô lệ của người nghe. “Phục vụ” giữ trọng tâm của mệnh đề này ở hành động và thái độ, trong khi phương án dài hơn sẽ nhấn mạnh lại thân phận quá mức cần thiết.
- issue: Phạm vi giới tính của ἀνθρώποις
  choice: người ta
  alternative: đàn ông
  rationale: Ở đây ἄνθρωποι đối lập con người với Chúa, nên nghĩa là con người nói chung chứ không khẳng định giới tính nam. Cách dịch bao quát giữ đúng thế đối lập thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được trình bày như một lời khuyên trực tiếp để đứng độc lập tự nhiên trong tiếng Việt, dù nguyên văn Hy Lạp dùng phân từ nối với mạch câu trước.
