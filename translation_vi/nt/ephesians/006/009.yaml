id: EPH.6.9
reference: Ephesians 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: vi
  text: Còn những người làm chủ, hãy đối xử với họ cũng như vậy[a], đừng đe dọa họ nữa[b], vì biết rằng Chúa của họ cũng là Chúa của anh em, ngự trên trời[c], và Ngài không thiên vị ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy làm điều tương tự đối với họ.” Nguyên văn lặp lại sát lời chỉ dẫn trước đó và nhấn mạnh tính tương hỗ.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn có thể dịch sát hơn: “hãy từ bỏ việc đe dọa.” Ý nói phải chấm dứt thói quen đe dọa.'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “ở trong các tầng trời”; “trên trời” là cách diễn đạt tự nhiên trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: những người làm chủ
  rationale: Trong quy tắc gia đình cổ đại này, từ này chỉ những người có địa vị chủ đối với các nô lệ được nói đến ở câu trước. Cách dịch này giữ được bối cảnh lịch sử mà không biến thành quan hệ lao động hiện đại.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: hãy đối xử với họ cũng như vậy
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sự liên kết với lời dạy ở câu trước và nhấn mạnh tính tương hỗ.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: đừng đe dọa họ nữa
  rationale: ἀνίημι ở đây có nghĩa chấm dứt hoặc từ bỏ một tập quán; câu mệnh lệnh phủ định tự nhiên trong tiếng Việt truyền đạt rõ việc phải thôi đe dọa.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: 'Làm rõ sắc thái nguyên nhân của phân từ: sự hiểu biết này là cơ sở cho mệnh lệnh vừa nêu.'
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: Chúa của họ cũng là Chúa của anh em
  rationale: Giữ κύριος mang nghĩa thần linh là “Chúa” và thể hiện rõ rằng cả hai nhóm cùng ở dưới quyền một Chúa.
- source_word: ἐν οὐρανοῖς
  choice: ngự trên trời
  rationale: “Trên trời” là cách diễn đạt tiếng Việt tự nhiên cho hình thức số nhiều Hy Lạp; “ngự” phù hợp với văn phong trang trọng khi nói về Chúa.
- source_word: προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ
  choice: Ngài không thiên vị ai
  rationale: Truyền đạt trực tiếp, tự nhiên rằng sự thiên vị không có nơi Chúa, đồng thời giữ ý nghĩa đạo đức và xét xử của danh từ Hy Lạp.
theological_decisions:
- issue: Cùng một từ κύριος được dùng cho chủ nhân loài người và Chúa trên trời
  choice: Dịch κύριοι là “những người làm chủ” và κύριος chỉ Đấng trên trời là “Chúa”
  alternative: Dịch cả hai bằng “chủ” hoặc dịch κύριος thứ hai là “Chủ”
  rationale: 'Tiếng Việt cần phân biệt vai trò xã hội của con người với danh xưng thần linh, nhưng câu vẫn giữ rõ nghịch lý tu từ: những người làm chủ ở trần gian cũng ở dưới quyền Chúa trên trời.'
- issue: Thuật ngữ địa vị xã hội trong quy tắc gia đình cổ đại
  choice: những người làm chủ
  alternative: chủ nô; người sử dụng lao động
  rationale: “Chủ nô” nhấn mạnh quyền sở hữu hơn chính từ κύριοι, còn “người sử dụng lao động” hiện đại hóa sai bối cảnh. “Những người làm chủ” vừa dễ hiểu vừa bảo tồn quan hệ xã hội trong đoạn văn.
- issue: Quan hệ của Chúa với hai phía
  choice: Chúa của họ cũng là Chúa của anh em
  alternative: Chúa của cả họ lẫn anh em
  rationale: Cả hai cách đều khả dĩ; lựa chọn này tự nhiên và nhấn mạnh rằng người làm chủ không có địa vị ưu tiên trước Chúa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho số nhiều ngôi thứ hai trong cộng đồng tín hữu; dùng “Ngài” làm đại từ tôn kính chỉ Chúa. Cấu trúc câu làm rõ căn cứ của mệnh lệnh nhưng không làm mất sự tương phản giữa chủ nhân trần gian và Chúa trên trời.
