revisions:
- from: Nguyện ân điển ở cùng tất cả những ai yêu mến Chúa chúng ta là Giê-su, Đấng Mê-si-a, trong sự bất hoại.[a]
  to: Nguyện ân điển ở cùng tất cả những ai yêu mến Chúa Giê-su, Đấng Mê-si-a, của chúng ta trong sự bất hoại.[a]
  rationale: Chỉnh vị trí của “của chúng ta” để tiếng Việt biểu đạt rõ chuỗi tước hiệu đồng vị của nguyên văn, không tạo cảm giác nguyên văn đang đưa ra một mệnh đề định danh. Chú thích được làm tự nhiên hơn và điều chỉnh “không hư mất” thành cách diễn đạt đúng hơn cho tính không hư nát/không tàn phai, đồng thời vẫn bảo toàn tính mơ hồ của ἐν ἀφθαρσίᾳ trong chính văn.
  reviewer_model: gpt-5.6-terra
