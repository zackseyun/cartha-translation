base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: vi
  text: Nguyện ân điển ở cùng tất cả những ai yêu mến Chúa Giê-su, Đấng Mê-si-a, của chúng ta trong sự bất hoại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với một tình yêu không hề tàn phai”; hoặc “trong lòng chân thành”, hay “với tình yêu bất diệt”. Cụm từ Hy Lạp “trong sự bất hoại” cô đọng và có nhiều cách hiểu.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Giữ thuật ngữ quen thuộc chỉ ân huệ nhưng không của Đức Chúa Trời; thêm “Nguyện” để diễn đạt tự nhiên lời chúc phước không có động từ trong tiếng Hy Lạp.
- source_word: μετὰ πάντων
  choice: ở cùng tất cả
  rationale: Diễn đạt trực tiếp μετά với sở hữu cách trong công thức chúc phước; “ở” được bổ sung theo cú pháp tiếng Việt.
- source_word: τῶν ἀγαπώντων
  choice: những ai yêu mến
  rationale: Chuyển phân từ hiện tại dùng như danh từ thành mệnh đề quan hệ tự nhiên, đồng thời giữ nghĩa về đặc tính tiếp diễn.
- source_word: τὸν κύριον ἡμῶν
  choice: Chúa chúng ta
  rationale: Dịch κύριος theo nghĩa tước hiệu là “Chúa” và giữ đại từ sở hữu số nhiều.
- source_word: Ἰησοῦν Χριστόν
  choice: Giê-su, Đấng Mê-si-a
  rationale: Dùng dạng tên gọi tiếng Việt hiện hành “Giê-su”; dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si-a”, không làm mờ nghĩa của từ Hy Lạp.
- source_word: ἐν ἀφθαρσίᾳ
  choice: trong sự bất hoại
  rationale: Cách dịch sát và cô đọng giữ lại tính mơ hồ của cụm Hy Lạp, thay vì mặc nhiên xác định rằng từ này bổ nghĩa riêng cho tình yêu hay có nghĩa là lòng chân thành.
theological_decisions:
- issue: Cách hiểu ἐν ἀφθαρσίᾳ
  choice: Giữ cách diễn đạt sát và mơ hồ “trong sự bất hoại” trong chính văn.
  alternative: “với một tình yêu không hư mất”; “trong sự chân thành”; hoặc “với tình yêu không bao giờ tàn”.
  rationale: Cú pháp Hy Lạp không xác định dứt khoát sự bất hoại mô tả tình yêu, cách thức yêu, hay phạm vi/phẩm chất gắn với lời chúc phước. Chính văn vì thế không giải quyết thay cho người đọc, còn chú thích ghi các cách hiểu tự nhiên hơn.
translation_notes:
  register: Văn phong chúc phước trang trọng nhưng hiện đại. “Nguyện … ở cùng” là cách diễn đạt tự nhiên cho câu chúc không có động từ trong nguyên văn. Cụm “trong sự bất hoại” hơi khác thường có chủ ý nhằm bảo toàn sự cô đọng và mơ hồ thật sự của tiếng Hy Lạp; chú thích hỗ trợ độc giả bằng các cách diễn giải thông dụng.
