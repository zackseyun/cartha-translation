revisions:
- from: và cũng cầu nguyện cho tôi, để khi tôi mở miệng, lời nói được ban cho tôi, hầu tôi mạnh dạn bày tỏ huyền nhiệm của Tin Mừng.[a]
  to: và cũng cầu nguyện cho tôi, để khi tôi mở miệng, tôi được ban lời lẽ, hầu tôi mạnh dạn làm cho biết mầu nhiệm của Tin Mừng.[a]
  rationale: Sửa “lời nói được ban cho tôi” thành “tôi được ban lời lẽ” để câu tiếng Việt tự nhiên hơn, nhưng vẫn giữ bị động δοθῇ λόγος. Sửa “bày tỏ” thành “làm cho biết” để phản ánh trực tiếp γνωρίσαι. Dùng “mầu nhiệm” thay “huyền nhiệm” vì đây là thuật ngữ Kinh Thánh Việt ngữ quen thuộc hơn cho μυστήριον. Không thay đổi ý nghĩa hoặc thêm diễn giải thần học.
