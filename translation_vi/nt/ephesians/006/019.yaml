  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: vi
  text: và cũng cầu nguyện cho tôi, để khi tôi mở miệng, tôi được ban lời lẽ, hầu tôi mạnh dạn làm cho biết mầu nhiệm của Tin Mừng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để lời nói được ban cho tôi khi tôi mở miệng, hầu tôi dạn dĩ làm cho biết điều mầu nhiệm của Tin Lành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑπὲρ ἐμοῦ
  choice: và cũng cầu nguyện cho tôi
  rationale: Mạch văn từ câu trước nói về sự cầu nguyện; thêm động từ được hàm ý giúp tiếng Việt tự nhiên mà vẫn giữ nghĩa ‘và cho tôi’.
- source_word: δοθῇ λόγος
  choice: lời nói được ban cho tôi
  rationale: λόγος số ít ở đây chỉ lời lẽ hoặc nội dung để nói. ‘Lời nói’ giữ gần hình thức nguyên văn và không biến nó thành một danh xưng thần học.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: khi tôi mở miệng
  rationale: Diễn đạt tự nhiên thành ngữ chỉ lúc bắt đầu nói, đồng thời giữ hình ảnh ‘mở miệng’ của nguyên văn.
- source_word: ἐν παρρησίᾳ
  choice: mạnh dạn
  rationale: Truyền đạt sự thẳng thắn, công khai và can đảm trong lời nói; dạng trạng từ tự nhiên trong câu tiếng Việt.
- source_word: γνωρίσαι
  choice: bày tỏ
  rationale: Diễn tả hành động làm cho người khác biết; phù hợp với việc công bố nội dung Tin Mừng mà không thêm sắc thái ngoài nguyên văn.
- source_word: τὸ μυστήριον
  choice: huyền nhiệm
  rationale: Trong văn mạch Phao-lô, từ này chỉ ý định của Đức Chúa Trời từng bị che giấu nay được tỏ ra, không phải một câu đố chưa có lời giải.
- source_word: τοῦ εὐαγγελίου
  choice: của Tin Mừng
  rationale: ‘Tin Mừng’ là cách dịch trực tiếp, quen thuộc và trang trọng của εὐαγγέλιον trong tiếng Việt hiện đại.
theological_decisions:
- issue: Nghĩa của λόγος trong lời xin cầu nguyện
  choice: lời nói được ban cho tôi
  alternative: một sứ điệp được ban cho tôi; lời lẽ được ban cho tôi
  rationale: Giữ được tính rộng của λόγος, có thể bao gồm cả lời lẽ lẫn nội dung được ban, thay vì quyết định dứt khoát rằng từ này chỉ một ‘sứ điệp’.
- issue: Sắc thái của παρρησία
  choice: mạnh dạn
  alternative: cách dạn dĩ; cách thẳng thắn
  rationale: Thể hiện lòng can đảm và sự công khai trong việc nói, không thu hẹp từ này thành cảm giác tự tin chủ quan.
- issue: Ý nghĩa của μυστήριον
  choice: huyền nhiệm
  alternative: điều mầu nhiệm; bí nhiệm
  rationale: Giữ thuật ngữ thần học chỉ kế hoạch từng được che giấu nay được mặc khải, nhưng không giải thích thêm ngay trong chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Bổ sung ‘cầu nguyện’ theo ngữ cảnh của câu trước; giữ hình ảnh ‘mở miệng’ và dạng bị động ‘được ban’ của nguyên văn.
