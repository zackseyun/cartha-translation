  - severity: low
    issue: “Huyền nhiệm” kém quen thuộc hơn “mầu nhiệm” trong thuật ngữ Kinh Thánh Việt ngữ.
    rationale: “Mầu nhiệm” là cách dùng hiện hành, trang trọng và dễ hiểu hơn để chuyển μυστήριον trong văn mạch Phao-lô.
