source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: vi
  text: Nguyện các anh em nhận được bình an và tình yêu thương cùng với đức tin từ Đức Chúa Trời là Cha và Chúa Giê-su, Đấng Mê-si-a[c].[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các anh em”; danh từ Hy Lạp ở dạng giống đực số nhiều nhưng trong ngữ cảnh này có thể chỉ toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp cũng có thể mang nghĩa “sự thành tín” hoặc “lòng tin cậy”; ở đây dịch theo nghĩa thông dụng là “đức tin”.
    reason: lexical_alternative
  - marker: c
    text: “Đấng Mê-si-a” dịch nghĩa tước hiệu Χριστός; tước hiệu này cũng thường được dịch là “Đấng Christ”.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: Nguyện sự bình an
  rationale: Danh từ được dùng như một lời chúc phước rút gọn; thêm “Nguyện” diễn đạt tự nhiên lực chúc nguyện trong tiếng Việt mà không biến nó thành một lời khẳng định.
- source_word: τοῖς ἀδελφοῖς
  choice: đến với các anh chị em
  rationale: ἀδελφοῖς có hình thức giống đực số nhiều nhưng trong cách dùng của Phao-lô có thể chỉ toàn thể cộng đồng tín hữu. “Các anh chị em” truyền đạt đúng phạm vi quy chiếu trong tiếng Việt hiện đại; nghĩa sát hình thức được ghi ở chú thích.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng và quen thuộc cho ἀγάπη, đồng thời giữ sắc thái yêu thương thay vì tình yêu lãng mạn.
- source_word: μετὰ πίστεως
  choice: đi đôi với đức tin
  rationale: μετά với sở hữu cách biểu thị sự đồng hành. “Đi đôi với” tự nhiên hơn “với” trong cụm danh từ tiếng Việt và không xác định quá mức quan hệ giữa tình yêu thương và đức tin.
- source_word: ἀπὸ
  choice: từ ... và từ
  rationale: Diễn đạt nguồn gốc của lời chúc phước. Lặp lại “từ” giúp tiếng Việt cho thấy cả Đức Chúa Trời là Cha lẫn Chúa Giê-su đều là nguồn, phù hợp với một giới từ Hy Lạp chi phối hai thành phần liên kết.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Bản Hy Lạp không có “của chúng ta”. “Là Cha” thể hiện quan hệ đồng vị tự nhiên trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch chuẩn, trang trọng của κύριος trong tước hiệu dành cho Giê-su.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si-a
  rationale: Giữ Giê-su như tên riêng và dịch Χριστός theo nghĩa tước hiệu là Đấng Mê-si-a, thay vì chỉ phiên chuyển thành “Christ”.
theological_decisions:
- issue: Phạm vi quy chiếu của ἀδελφοῖς
  choice: các anh chị em
  alternative: các anh em
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, trong ngữ cảnh thư gửi hội thánh từ này có thể bao gồm cả nam lẫn nữ. Bản chính truyền đạt phạm vi cộng đồng, còn chú thích bảo tồn hình thức nguyên văn.
- issue: Nghĩa của πίστις
  choice: đức tin
  alternative: sự thành tín hoặc lòng tin cậy
  rationale: “Đức tin” là nghĩa mặc định và phù hợp trong lời chúc phước; các nghĩa từ vựng khả hữu khác được giữ trong chú thích, tránh loại bỏ sự đa nghĩa.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός mang giá trị tước hiệu; dịch nghĩa giúp người đọc nhận ra nội dung cứu thế của danh xưng, trong khi dạng truyền thống được nêu ở chú thích.
- issue: Quan hệ nguồn gốc trong ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: từ Đức Chúa Trời là Cha và từ Chúa Giê-su
  alternative: từ Đức Chúa Trời là Cha và Chúa Giê-su
  rationale: Lặp lại giới từ trong tiếng Việt làm rõ rằng cả hai danh xưng đều nằm dưới ἀπό, nhưng không giải thích thêm bản chất thần học của mối liên hệ ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ hình thức lời chúc phước ngắn gọn nhưng dùng “Nguyện” để thể hiện lực ngữ dụng. Dấu phẩy trước “Đấng Mê-si-a” làm rõ đây là tước hiệu đồng vị của Giê-su.
