id: EPH.6.22
reference: Ephesians 6:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: vi
  text: 'Tôi đã phái anh ấy đến với anh chị em chính vì mục đích này: để anh chị em biết chúng tôi ra sao[a], và để anh ấy khích lệ lòng anh chị em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “anh chị em biết tình hình của chúng tôi” hoặc “anh chị em biết những điều liên quan đến chúng tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: anh ấy
  rationale: Đại từ quan hệ đối cách giống đực số ít chỉ Ti-chi-cơ ở câu trước. Tiếng Việt tự nhiên dùng “anh ấy” để nối lại đối tượng đã được nhắc đến.
- source_word: ἔπεμψα
  choice: Tôi đã sai
  rationale: Thì aorist được chuyển bằng “đã” để diễn tả hành động sai đi; “sai” phù hợp với ngữ cảnh cử một người đến thi hành nhiệm vụ.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: πρός với đối cách sau động từ sai đi chỉ hướng đến người nhận. “Đến với” tự nhiên và nhấn mạnh việc Ti-chi-cơ hiện diện giữa họ.
- source_word: εἰς αὐτὸ τοῦτο
  choice: chính vì mục đích này
  rationale: “Chính” giữ sắc thái nhấn mạnh của αὐτὸ τοῦτο, còn “mục đích” làm rõ quan hệ mục đích được triển khai trong mệnh đề ἵνα.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt trực tiếp và tự nhiên ý mục đích trong tiếng Việt.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: anh chị em biết tình hình của chúng tôi
  rationale: τὰ περὶ ἡμῶν bao quát những điều liên quan đến Phao-lô và các bạn đồng hành. “Tình hình của chúng tôi” tự nhiên nhưng không giới hạn hoàn toàn vào hoàn cảnh bên ngoài; chú thích giữ các cách hiểu rộng hơn.
- source_word: καὶ
  choice: và để
  rationale: Lặp lại “để” giúp thấy rõ hai mục đích song song cùng phụ thuộc vào ἵνα.
- source_word: παρακαλέσῃ
  choice: anh ấy khích lệ
  rationale: παρακαλέω có thể mang nghĩa khích lệ, an ủi hoặc khuyên nhủ. Trong kết hợp với “lòng” và ngữ cảnh củng cố cộng đồng, “khích lệ” giữ được độ rộng thích hợp.
- source_word: τὰς καρδίας ὑμῶν
  choice: lòng anh chị em
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt cho trung tâm nội tâm, cảm xúc và ý chí, không làm phẳng thành một khái niệm trừu tượng.
theological_decisions:
- issue: Ý nghĩa của τὰ περὶ ἡμῶν
  choice: Dịch là “tình hình của chúng tôi.”
  alternative: “những điều liên quan đến chúng tôi” hoặc “chúng tôi ra sao”
  rationale: Cụm Hy Lạp có thể chỉ cả tình trạng cá nhân lẫn hoàn cảnh của Phao-lô và các cộng sự. Bản chính dùng cách nói tự nhiên; chú thích bảo tồn phạm vi nghĩa rộng và sự mơ hồ có thật.
- issue: Sắc thái của παρακαλέσῃ
  choice: Dịch là “khích lệ.”
  alternative: “an ủi” hoặc “khuyên nhủ”
  rationale: Ngữ cảnh không buộc phải thu hẹp động từ vào riêng sự an ủi hay khuyên bảo. “Khích lệ” diễn đạt hành động củng cố nội tâm mà không áp đặt một nét nghĩa giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς/ὑμῶν nhằm biểu đạt cộng đồng tín hữu một cách tự nhiên; giữ “lòng” như hình ảnh nhân học Kinh Thánh quen thuộc.
