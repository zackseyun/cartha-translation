  source_fidelity: 'Bản dịch chuyển tải đầy đủ các yếu tố chính của nguyên văn: δοῦλοι là “những người nô lệ”; mệnh lệnh hiện tại ὑπακούετε là “hãy vâng lời”; τοῖς κατὰ σάρκα κυρίοις là “các chủ theo xác thịt”; thành ngữ μετὰ φόβου καὶ τρόμου được giữ nguyên lực; ἐν ἁπλότητι τῆς καρδίας ὑμῶν được diễn đạt đúng là “bằng tấm lòng chân thành”; và phép so sánh ὡς τῷ Χριστῷ được làm rõ tự nhiên bằng “như vâng lời Đấng Mê-si-a.” Không có thêm ý nghĩa thần học hoặc làm nhẹ thực trạng nô lệ.'
  naturalness: Văn phong trang trọng, rõ ràng và phù hợp tiếng Việt hiện đại trong bản văn Kinh Thánh. “Theo xác thịt” là cách nói khá sát nguyên văn và có thể mang tính thành ngữ Kinh Thánh; chú thích đã giải thích đúng để tránh hiểu nó theo nghĩa đạo đức hay tình dục hiện đại. Việc lặp “vâng lời” ở vế cuối làm câu tiếng Việt sáng nghĩa mà không vượt quá lực của phép so sánh.
  terminology: “Nô lệ” phản ánh chính xác δοῦλοι trong bối cảnh chủ–nô lệ. “Các chủ” phù hợp κυρίοις và không lẫn với tước hiệu thần linh. “Đấng Mê-si-a” nhất quán với việc dịch Χριστός như một tước hiệu; chú thích b giải thích hợp lý cách gọi truyền thống “Đấng Christ.”
