id: EPH.6.5
reference: Ephesians 6:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: vi
  text: Hỡi những người nô lệ, hãy vâng lời các chủ theo xác thịt[a] với sự sợ hãi và run rẩy, bằng tấm lòng chân thành, như vâng lời Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Theo xác thịt” nghĩa là trong phạm vi quan hệ con người ở đời này; cũng có thể diễn đạt là “các chủ trần thế.”
    reason: lexical_alternative
  - marker: b
    text: 'Hy Lạp: Christos, nghĩa là “Đấng Được Xức Dầu”; theo cách gọi truyền thống là “Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλοι
  choice: những người nô lệ
  rationale: Trong quy tắc gia đình này, từ này chỉ những người ở trong thân phận bị sở hữu và phải phục dịch; “nô lệ” diễn đạt thẳng thắn thực trạng xã hội ấy, thay vì làm nhẹ nghĩa thành “đầy tớ” hay “tôi tớ”.
- source_word: ὑπακούετε
  choice: hãy vâng lời
  rationale: Động từ mệnh lệnh hiện tại kêu gọi sự vâng lời liên tục; “hãy vâng lời” tự nhiên và chính xác trong quan hệ được nói đến.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: 'Giữ hình ảnh và giới hạn của nguyên văn: họ là chủ trong phạm vi quan hệ con người, thân xác và đời này, chứ không phải theo nghĩa thuộc linh tối hậu.'
- source_word: κυρίοις
  choice: các chủ
  rationale: Trong quan hệ nô lệ–chủ, κύριος chỉ những người chủ có quyền trên nô lệ; “các chủ” phù hợp ngữ cảnh và tránh lẫn với tước hiệu dành cho Chúa.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: với sự sợ hãi và run rẩy
  rationale: Cách dịch tương đối sát giữ nguyên thành ngữ mạnh và nhịp tu từ của Phao-lô, không tự ý giảm φόβος thành chỉ sự kính trọng.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: bằng tấm lòng chân thành
  rationale: ἁπλότης ở đây diễn tả sự chân thật, không hai lòng; cách nói này tự nhiên trong tiếng Việt và giữ trọng tâm nội tâm.
- source_word: ὡς τῷ Χριστῷ
  choice: như vâng lời Đấng Mê-si-a
  rationale: Bổ sung lại động từ theo ngữ pháp tiếng Việt để làm rõ phép so sánh của ὡς mà không đồng nhất các chủ trần thế với Đấng Mê-si-a. Χριστός được hiểu là tước hiệu.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Đấng Được Xức Dầu
  rationale: Χριστός tại đây mang chức năng tước hiệu. “Đấng Mê-si-a” giữ rõ tính chất tước hiệu và được chú thích để người đọc nhận biết từ Hy Lạp cùng cách gọi truyền thống.
- issue: Cách dịch δοῦλοι trong bối cảnh nô lệ
  choice: những người nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Ngữ cảnh quy tắc gia đình trực tiếp nói với những người ở dưới quyền chủ. Dịch “nô lệ” không che mờ thực trạng lệ thuộc pháp lý và xã hội của nguyên văn.
- issue: Phạm vi của κατὰ σάρκα
  choice: giữ thành ngữ “theo xác thịt” và giải thích bằng chú thích
  alternative: ở đời này; về phương diện con người
  rationale: Nguyên văn phân định quyền làm chủ trong bình diện con người, thân xác hoặc trần thế. Giữ thành ngữ giúp bảo toàn sắc thái và sự đối lập thần học, còn chú thích hỗ trợ độc giả hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Hỡi” để thể hiện lời trực tiếp Οἱ δοῦλοι mà vẫn giữ sắc thái Kinh Thánh; tránh uyển ngữ làm nhẹ thực trạng nô lệ. Cấu trúc “như vâng lời” được dùng để tiếng Việt tự nhiên hơn nhưng vẫn giữ lực so sánh của ὡς.
