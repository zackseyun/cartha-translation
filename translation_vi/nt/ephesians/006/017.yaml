id: EPH.6.17
reference: Ephesians 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὴν περικεφαλαίαν τοῦ σωτηρίου ⸀δέξασθε, καὶ τὴν μάχαιραν τοῦ πνεύματος, ὅ ἐστιν ῥῆμα θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/017.yaml
  text: And receive the helmet of salvation[a], and the sword of the Spirit, which is the word of God[b],
translation:
  language: vi
  text: Hãy nhận mũ chiến của sự cứu rỗi[a] và gươm của Thánh Linh, tức là lời Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy cầm lấy mũ chiến của sự cứu rỗi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “lời phán của Đức Chúa Trời”; từ Hy Lạp rhēma có thể nhấn mạnh một lời được phán hoặc một sứ điệp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξασθε
  choice: hãy nhận
  rationale: Động từ mệnh lệnh số nhiều diễn tả việc tiếp nhận hoặc cầm lấy thứ được trao. “Hãy nhận” giữ được sắc thái ấy và vẫn phù hợp với hình ảnh trang bị khí giới.
- source_word: περικεφαλαίαν
  choice: mũ chiến
  rationale: Chỉ vật bảo vệ đầu trong quân trang. “Mũ chiến” tự nhiên, dễ hiểu và giữ rõ hình ảnh quân sự.
- source_word: τοῦ σωτηρίου
  choice: của sự cứu rỗi
  rationale: Giữ cấu trúc sở hữu của nguyên văn và sắc thái cứu độ quen thuộc trong thư Phao-lô, mà không ấn định quan hệ chính xác của sở hữu cách.
- source_word: μάχαιραν
  choice: gươm
  rationale: Chỉ vũ khí có lưỡi, thường là loại tương đối ngắn. “Gươm” là từ trang trọng, tự nhiên trong văn cảnh khí giới và không thu hẹp quá mức loại vũ khí.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Trong văn cảnh này, πνεῦμα hợp lý nhất là Thánh Linh; cách viết hoa và từ “Thánh Linh” làm rõ quy chiếu nhưng không giải thích quá mức quan hệ sở hữu cách.
- source_word: ὅ ἐστιν
  choice: tức là
  rationale: Truyền đạt chức năng giải thích và đồng nhất của mệnh đề quan hệ Hy Lạp một cách tự nhiên trong tiếng Việt.
- source_word: ῥῆμα θεοῦ
  choice: lời Đức Chúa Trời
  rationale: “Lời” là tương đương tự nhiên và quen thuộc, trong khi chú thích bảo lưu khả năng ῥῆμα nhấn mạnh lời được phán hoặc sứ điệp.
theological_decisions:
- issue: Quy chiếu của τοῦ πνεύματος
  choice: Thánh Linh
  alternative: linh của con người hoặc tính chất thuộc linh nói chung
  rationale: Trong hình ảnh khí giới của Đức Chúa Trời và với phần giải thích tiếp theo là “lời Đức Chúa Trời”, cách hiểu quy chiếu đến Thánh Linh là tự nhiên nhất. Bản dịch không quyết định thêm liệu sở hữu cách chủ yếu mang nghĩa nguồn ban, sở hữu hay phương tiện.
- issue: Quan hệ của “gươm” với “lời Đức Chúa Trời”
  choice: tức là lời Đức Chúa Trời
  alternative: một cách diễn đạt chỉ xem lời Đức Chúa Trời như công cụ được gươm tượng trưng
  rationale: Giữ lực đồng nhất/giải thích của ὅ ἐστιν mà không triển khai một lý thuyết thần học vượt quá câu văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “mũ chiến” để làm rõ vật đội đầu quân sự; dùng “gươm” phù hợp với hình ảnh Kinh Thánh. Đại từ mệnh lệnh được lược bỏ vì ngữ cảnh đã hướng đến số nhiều; “hãy” truyền đạt mệnh lệnh tự nhiên.
