revisions:
- from: Biết rằng mỗi người, làm điều tốt nào thì sẽ nhận lại điều ấy từ Chúa[a], dù là nô lệ[b] hay người tự do.
  to: Biết rằng mỗi người, bất cứ điều tốt nào người ấy làm, sẽ nhận lại điều ấy[a] từ Chúa, dù là nô lệ[b] hay người tự do.
  rationale: Sửa cấu trúc câu để diễn đạt tự nhiên và minh bạch quan hệ giữa “mỗi người” với mệnh đề “bất cứ điều tốt nào người ấy làm”, đồng thời giữ nguyên tính phân phối và bất định của nguyên văn. Dời neo chú thích a đến “nhận lại” để khớp với mục từ κομίσεται được chú giải. Không thay đổi ý nghĩa hay mức độ xác quyết của bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các thành tố chính: tính phân phối của ἕκαστος, tính bất định của ὃ ἂν, sự tương ứng trong τοῦτο/κομίσεται, nguồn là παρὰ κυρίου, và đối lập xã hội δοῦλος/ἐλεύθερος. Tuy nhiên, trật tự hiện tại “mỗi người, làm điều tốt nào thì...” không tạo thành cấu trúc tiếng Việt tự nhiên. Cần đặt mệnh đề quan hệ/bất định rõ hơn. Chú thích về κομίσεται cũng phải được neo ngay tại cụm “nhận lại”, thay vì tại “Chúa”.'
  naturalness: '“Biết rằng” phù hợp với phân từ εἰδότες và với tính lệ thuộc vào mệnh lệnh câu trước. Câu được sửa thành một cấu trúc tiếng Việt mạch lạc, trang trọng và hiện đại: “mỗi người, bất cứ điều tốt nào người ấy làm, sẽ...”'
  terminology: “Chúa” giữ đúng giá trị của κυρίου trong ngữ cảnh Phao-lô; “nô lệ” và “người tự do” phản ánh trực tiếp đối lập δοῦλος/ἐλεύθερος mà không làm nhẹ địa vị xã hội được nói đến.
