    rationale: Cụm “làm điều tốt nào” cần được gắn rõ với “mỗi người” bằng cấu trúc như “bất cứ điều tốt nào người ấy làm”; điều này cũng biểu đạt chính xác tính bất định của ὃ ἄν.
  - severity: low
