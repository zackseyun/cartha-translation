language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: vi
  text: Biết rằng mỗi người, bất cứ điều tốt nào người ấy làm, sẽ nhận lại điều ấy[a] từ Chúa, dù là nô lệ[b] hay người tự do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể được hiểu là “sẽ được Chúa báo đáp về điều ấy”; từ này hàm ý nhận lại điều tương ứng với việc mình làm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đầy tớ”, nhưng từ Hy Lạp ở đây chỉ người ở địa vị nô lệ và được đặt đối lập với “người tự do”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: Biết rằng
  rationale: Giữ dạng phân từ mang ý nghĩa hoàn cảnh của nguyên văn và sự nối kết với lời khuyên ở câu trước, không buộc phải diễn giải rõ thành quan hệ nguyên nhân như “vì anh em biết”.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ sắc thái phân phối, nhấn mạnh từng cá nhân, đồng thời tự nhiên và bao quát trong tiếng Việt hiện đại.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: làm điều tốt nào
  rationale: Cấu trúc “điều tốt nào… điều ấy” chuyển tải tính bất định của ὃ ἄν và phẩm chất đạo đức của ἀγαθόν một cách gọn, tự nhiên.
- source_word: τοῦτο
  choice: điều ấy
  rationale: Chỉ ngược lại chính điều tốt đã làm và duy trì mối tương ứng được nhấn mạnh trong nguyên văn.
- source_word: κομίσεται
  choice: sẽ nhận lại
  rationale: Diễn đạt ý nhận lại điều tương ứng với hành động, nhưng không biến câu thành một phép tính hay giao dịch thương mại cứng nhắc.
- source_word: παρὰ κυρίου
  choice: từ Chúa
  rationale: παρά với sở hữu cách chỉ nguồn; “Chúa” giữ trọng lượng thần học và phù hợp với cách dùng của Phao-lô trong ngữ cảnh này.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Vì được đặt đối lập trực tiếp với ἐλεύθερος, từ này nói đến địa vị bị lệ thuộc, nên “nô lệ” chính xác hơn cách nói nhẹ hơn là “đầy tớ”.
- source_word: ἐλεύθερος
  choice: người tự do
  rationale: Diễn đạt rõ địa vị xã hội đối lập với nô lệ và tự nhiên hơn nếu chỉ dùng tính từ “tự do” như một danh từ trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δοῦλος trong đoạn nói về quan hệ nô lệ–chủ
  choice: nô lệ
  alternative: đầy tớ
  rationale: Sự đối lập rõ ràng với “người tự do” khiến địa vị nô lệ trở thành trọng tâm; “nô lệ” không làm nhẹ đi thực tại lịch sử và xã hội của lời văn.
- issue: Danh xưng κύριος
  choice: Chúa
  alternative: chủ
  rationale: Dù ngữ cảnh gần nói về các chủ nhân loài người, nguồn ban sự báo đáp ở đây là Chúa; cách dịch này giữ được tham chiếu thần học có khả năng chỉ về Đấng Christ mà không hòa lẫn Ngài với người chủ trong gia đình.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc tương liên “điều tốt nào… điều ấy” vừa tự nhiên trong tiếng Việt vừa giữ sự nhấn mạnh của nguyên văn; không thêm đại từ giới tính vì ἕκαστος có nghĩa đại diện cho từng người.
