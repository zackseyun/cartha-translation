    issue: “Các quyền cai trị” quá trừu tượng cho ἀρχάς.
    rationale: Trong chuỗi các tân ngữ của πρὸς, ἀρχάς đứng song song với ἐξουσίας, κοσμοκράτορας, và τὰ πνευματικά. “Các bậc cầm quyền” giữ rõ hơn các quyền lực/tác nhân được nêu.
