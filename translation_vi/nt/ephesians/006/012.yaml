id: EPH.6.12
reference: Ephesians 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: vi
  text: Vì cuộc vật lộn của chúng ta không phải chống lại thịt và máu[a], nhưng chống lại các bậc cầm quyền, chống lại các thế lực có thẩm quyền, chống lại những kẻ thống trị thế gian thuộc bóng tối này[b], và chống lại các thế lực thuộc linh của sự gian ác ở các miền trên trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Thịt và máu” nghĩa là con người phàm. Cũng có thể dịch phần đầu: “Vì cuộc chiến đấu của chúng ta không phải chống lại thịt và máu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những kẻ thống trị thế gian thuộc bóng tối hiện tại này.”'
    reason: lexical_alternative
  - marker: c
    text: Hay “ở những nơi thuộc trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: cuộc chiến đấu
  rationale: Từ này chỉ sự vật lộn hoặc giao chiến ở cự ly gần. “Cuộc chiến đấu” giữ được hình ảnh xung đột mà vẫn tự nhiên trong tiếng Việt hiện đại; sắc thái sát chữ hơn là “vật lộn” được ghi ở chú thích.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: chống lại thịt và máu
  rationale: Cụm từ nói đến con người bằng xương bằng thịt. Bản dịch giữ hình ảnh cụ thể của nguyên văn, đồng thời chú thích làm rõ nghĩa thành ngữ.
- source_word: ἀρχάς
  choice: các quyền cai trị
  rationale: Trong ngữ cảnh này, danh từ số nhiều chỉ các quyền lực có địa vị cai trị. Cách dịch này giữ ý nghĩa quyền lực mà không mặc nhiên đồng nhất chúng với nhà cầm quyền loài người.
- source_word: ἐξουσίας
  choice: các thế lực cầm quyền
  rationale: Từ này có thể chỉ quyền hành hoặc những thực thể nắm quyền hành. “Các thế lực cầm quyền” phân biệt tương đối với ἀρχάς và phù hợp với chuỗi các đối thủ siêu phàm trong câu.
- source_word: κοσμοκράτορας
  choice: những kẻ thống trị thế gian
  rationale: Danh từ ghép hiếm này có nghĩa sát là những kẻ thống trị thế giới. Cách dịch giữ thành tố “thế gian” và tính chủ thể của danh từ, thay vì diễn giải rộng thành “các quyền lực vũ trụ”.
- source_word: τοῦ σκότους τούτου
  choice: thuộc bóng tối này
  rationale: Sở hữu cách mô tả những kẻ thống trị là thuộc về hoặc mang đặc tính của “bóng tối này”. Không thêm ý “hiện tại” vào chính văn vì nguyên ngữ không nêu trực tiếp.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: các thế lực tà ác thuộc linh
  rationale: Tính từ trung tính số nhiều được dùng như danh từ, trong ngữ cảnh chỉ các hữu thể hoặc quyền lực thuộc lĩnh vực thần linh. “Các thế lực” làm rõ sở chỉ, còn “tà ác thuộc linh” giữ cả đặc tính gian ác lẫn bản chất không phải con người.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ở các miền trên trời
  rationale: Cụm từ chỉ phạm vi thuộc trời và xuất hiện nhiều lần trong thư Ê-phê-sô. “Các miền trên trời” tự nhiên hơn lối dịch sát chữ “những nơi thuộc trời” và không thu hẹp ý nghĩa vào một địa điểm duy nhất.
theological_decisions:
- issue: Bản chất của các đối thủ được kể tên
  choice: Dịch chuỗi danh xưng như các quyền lực siêu phàm và kết thúc bằng “các thế lực tà ác thuộc linh”.
  alternative: Hiểu các từ này chủ yếu là những nhà cai trị và cơ cấu chính trị của loài người, hoặc bao gồm cả quyền lực thần linh lẫn biểu hiện trần thế của chúng.
  rationale: Sự tương phản với “thịt và máu”, cùng với κοσμοκράτορας và τὰ πνευματικὰ τῆς πονηρίας, hướng trực tiếp đến các đối thủ thuộc linh. Bản dịch không thêm lời phủ nhận khả năng các quyền lực ấy có biểu hiện nơi trần thế.
- issue: Ý nghĩa của σάρξ trong thành ngữ αἷμα καὶ σάρκα
  choice: Giữ nghĩa cụ thể là “thịt” trong cụm “thịt và máu”, với chú thích giải thích rằng cụm này chỉ con người phàm.
  alternative: Dịch σάρξ là “bản tính tội lỗi”.
  rationale: Ở đây σάρξ thuộc một thành ngữ về con người có thân xác, không phải cách dùng thần học chỉ khuynh hướng tội lỗi.
- issue: Phạm vi của ἐν τοῖς ἐπουρανίοις
  choice: Gắn cụm “ở các miền trên trời” với “các thế lực tà ác thuộc linh”, đúng theo cấu trúc gần nhất của câu.
  alternative: Hiểu cụm này rộng hơn như phạm vi của toàn bộ cuộc xung đột hoặc toàn bộ các quyền lực vừa kể.
  rationale: Vị trí cú pháp thuận lợi nhất là bổ nghĩa cho nhóm cuối, nhưng bản thân cụm từ vẫn có thể gợi đến phạm vi rộng của thực tại thuộc trời; bản dịch không giải thích thêm để tránh đóng lại độ mở ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, giữ nhịp lặp “chống lại” của nguyên văn để nhấn mạnh từng tầng đối thủ. Các thuật ngữ được chọn nhằm dễ hiểu với độc giả phổ thông mà không dùng từ ngữ riêng của một hệ phái; “thuộc linh” được dùng có giới hạn để diễn đạt rõ sự tương phản với con người bằng xương bằng thịt.
