  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: vi
  text: Vậy, hãy đứng, thắt quanh lưng mình bằng chân lý và mặc áo giáp của sự công chính[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “áo giáp của công lý.” Từ Hy Lạp δικαιοσύνη có thể mang nghĩa cả sự công chính lẫn công lý trong các thư của Phao-lô.
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: hãy đứng
  rationale: Động từ mệnh lệnh kêu gọi người đọc đứng vào vị trí một cách dứt khoát. Không thêm “vững” vì ý ấy do văn cảnh gợi ra chứ không nằm trực tiếp trong từ này.
- source_word: οὖν
  choice: vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận với lời khuyên ở trước.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν
  choice: lấy … thắt quanh lưng
  rationale: Giữ hành động quấn hoặc thắt quanh vùng eo/lưng mà không thêm danh từ “dây thắt lưng,” vốn không xuất hiện trong nguyên văn.
- source_word: ἐν ἀληθείᾳ
  choice: lấy chân lý
  rationale: “Chân lý” làm phương tiện cho hành động thắt quanh lưng; cách dịch này vẫn để ngỏ sắc thái về sự thật và tính chân thật.
- source_word: ἐνδυσάμενοι
  choice: mặc
  rationale: Đây là cách nói tiếng Việt tự nhiên cho hành động khoác lên người quần áo hoặc giáp trụ.
- source_word: θώρακα
  choice: áo giáp
  rationale: Chỉ phần giáp bảo vệ ngực và thân mình. “Áo giáp” dễ hiểu trong tiếng Việt hiện đại và duy trì hình ảnh quân trang.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: “Sự công chính” phù hợp với phạm vi nghĩa thường gặp trong thư Phao-lô, đồng thời “công lý” được giữ lại như một khả năng trong chú thích.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong hình ảnh áo giáp
  choice: sự công chính
  alternative: công lý
  rationale: Nguyên ngữ có thể chỉ sự công chính hoặc công lý. Bản chính dùng “sự công chính” mà không xác định đây chỉ là địa vị được ban hay chỉ là lối sống đạo đức; “công lý” được ghi nhận trong chú thích.
- issue: Sắc thái của ἀλήθεια
  choice: chân lý
  alternative: sự chân thật
  rationale: “Chân lý” giữ được chiều kích khách quan của điều chân thật, nhưng ngữ cảnh cũng có thể bao hàm tính chân thật và chính trực của người tin; không nên thu hẹp ý nghĩa vào một sắc thái duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hãy đứng” thay vì “hãy đứng vững” để không thêm nghĩa ngoài động từ Hy Lạp; giữ hai phân từ như những hành động đi kèm mệnh lệnh chính bằng cấu trúc tiếng Việt gọn tự nhiên. Dấu phẩy cuối câu được giữ vì câu này tiếp nối sang câu sau trong nguyên đoạn.
