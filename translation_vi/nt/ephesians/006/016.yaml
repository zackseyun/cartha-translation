id: EPH.6.16
reference: Ephesians 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: vi
  text: Trong mọi hoàn cảnh, hãy cầm lấy khiên đức tin; nhờ chiếc khiên ấy, anh em sẽ có thể dập tắt mọi mũi tên[a] rực lửa của kẻ ác.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể chỉ các vật phóng nói chung; cũng có thể dịch là “phi tiêu”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự ác”; tiếng Hy Lạp có thể được hiểu theo nghĩa trừu tượng, dù cách hiểu “kẻ ác” phù hợp hơn với bối cảnh chiến trận ở đây.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: Trong mọi hoàn cảnh
  rationale: Cụm giới từ này được hiểu theo nghĩa trạng ngữ trong mạch văn về khí giới, chỉ mọi tình huống; cách dịch này tự nhiên hơn lối dịch sát chữ “trong mọi sự”.
- source_word: ἀναλαβόντες
  choice: hãy cầm lấy
  rationale: Phân từ bất định nối với chuỗi lời khuyên trong đoạn văn. Dùng mệnh lệnh giúp câu đứng riêng rõ nghĩa mà vẫn giữ hành động đi kèm của nguyên văn.
- source_word: τὸν θυρεὸν τῆς πίστεως
  choice: khiên đức tin
  rationale: θυρεός là loại khiên, còn πίστις trong ngữ cảnh này thích hợp nhất với “đức tin”, diễn tả sự tin cậy nơi Đức Chúa Trời như phương tiện phòng vệ.
- source_word: ἐν ᾧ
  choice: nhờ chiếc khiên ấy
  rationale: Giới từ mang nghĩa phương tiện và đại từ quan hệ quy chiếu về chiếc khiên; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: δυνήσεσθε
  choice: anh em sẽ có thể
  rationale: Giữ nghĩa khả năng và thì tương lai của động từ Hy Lạp; “anh em” phù hợp với đối tượng số nhiều được Phao-lô trực tiếp khuyên bảo.
- source_word: πάντα τὰ βέλη ... πεπυρωμένα
  choice: mọi mũi tên rực lửa
  rationale: βέλη chỉ các vật phóng nói chung nhưng “mũi tên” dễ hiểu và hợp hình ảnh chiến trận; “rực lửa” diễn đạt tự nhiên trạng thái đã bị đốt cháy của πεπυρωμένα.
- source_word: τοῦ πονηροῦ
  choice: của kẻ ác
  rationale: Trong bối cảnh chiến trận thuộc linh, cụm có mạo từ này nhiều khả năng chỉ một tác nhân có ngôi vị, nhưng cách hiểu trừu tượng vẫn được ghi nhận ở chú thích.
- source_word: σβέσαι
  choice: dập tắt
  rationale: Diễn đạt chính xác việc làm tắt lửa và tự nhiên hơn “dập” hoặc các cách nói cổ trong tiếng Việt hiện đại.
theological_decisions:
- issue: Nghĩa của τοῦ πονηροῦ
  choice: kẻ ác
  alternative: sự ác
  rationale: Ngữ cảnh cuộc chiến thuộc linh và những đòn tấn công thù nghịch ủng hộ cách hiểu có ngôi vị. Tuy nhiên, hình thái Hy Lạp cũng có thể được hiểu theo nghĩa trừu tượng, nên phương án đó được giữ trong chú thích.
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong ẩn dụ này, “đức tin” vừa là cách dùng quen thuộc, vừa diễn tả sự tin cậy của người tin nơi Đức Chúa Trời. “Sự trung tín” có thể thuộc phạm vi nghĩa của từ nhưng kém phù hợp hơn trong ngữ cảnh trực tiếp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu dùng hình ảnh quân sự rõ ràng, tránh “tên lửa” vì trong tiếng Việt hiện nay dễ bị hiểu là hỏa tiễn. Đại từ “anh em” duy trì lời khuyên trực tiếp dành cho cộng đồng tín hữu.
