source:
  edition: SBLGNT
  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: vi
  text: Cuối cùng, anh chị em hãy được thêm sức[a] trong Chúa và trong quyền năng của sức mạnh của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy mạnh mẽ”. Động từ Hy Lạp có thể được diễn đạt tự nhiên như vậy, nhưng “hãy được thêm sức” giữ rõ hơn sắc thái tiếp nhận sức mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Cuối cùng
  rationale: Cụm này làm dấu chuyển ý, mở đầu phần kết của thư. “Cuối cùng” tự nhiên trong tiếng Việt hiện đại và giữ được chức năng diễn ngôn ấy.
- source_word: ἐνδυναμοῦσθε
  choice: hãy được thêm sức
  rationale: Dạng mệnh lệnh hiện tại thụ động/trung gian số nhiều được diễn đạt theo hướng tiếp nhận sức mạnh, thay vì chỉ kêu gọi người đọc tự làm mình mạnh mẽ. “Được thêm sức” vừa tự nhiên vừa giữ sắc thái này.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ giới từ “trong” để bảo tồn ngôn ngữ chỉ mối liên hệ hoặc phạm vi của Phao-lô, không xác định quá mức thành phương tiện như “nhờ Chúa”.
- source_word: κράτει τῆς ἰσχύος αὐτοῦ
  choice: trong quyền năng mạnh mẽ của Ngài
  rationale: Cách diễn đạt này chuyển tải sự chồng lớp của hai từ chỉ sức mạnh (κράτος và ἰσχύς) bằng tiếng Việt tự nhiên hơn cấu trúc sát chữ “quyền năng của sức mạnh Ngài”, đồng thời không thêm ý “vô hạn” vốn không có trực tiếp trong câu Hy Lạp.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ quy chiếu tự nhiên về “Chúa”; “Ngài” là cách xưng hô trang trọng và rõ nghĩa trong văn cảnh.
theological_decisions:
- issue: Thể của ἐνδυναμοῦσθε và nguồn sức mạnh
  choice: 'Diễn đạt như lời kêu gọi tiếp nhận sức mạnh: “hãy được thêm sức”.'
  alternative: “Hãy mạnh mẽ” hoặc “hãy trở nên mạnh mẽ”.
  rationale: Dạng thụ động/trung gian cho phép giữ trọng tâm rằng sức mạnh không đơn thuần phát sinh từ ý chí nội tại của người tin. Tuy nhiên, bản dịch không xác định quá mức tác nhân hay một cơ chế thần học cụ thể.
- issue: Ý nghĩa của ἐν trong ἐν κυρίῳ
  choice: “trong Chúa”, giữ mở sắc thái quan hệ hoặc phạm vi.
  alternative: “nhờ Chúa” hoặc “bởi Chúa”.
  rationale: “Nhờ/bởi Chúa” sẽ quyết định rõ nghĩa công cụ hoặc tác nhân hơn mức câu Hy Lạp buộc phải có; “trong Chúa” bảo tồn cách diễn đạt đặc trưng của Phao-lô.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: Trong văn cảnh thư Phao-lô, κύριος tự nhiên chỉ Chúa Giê-su được tôn cao. “Chúa” là cách dịch chuẩn, trang trọng, không cần diễn giải thêm trong chính câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Anh chị em” làm rõ đối tượng số nhiều của mệnh lệnh mà không giới hạn giới tính. Cụm “quyền năng mạnh mẽ” tránh lối dịch quá cứng “quyền năng của sức mạnh”, đồng thời vẫn phản ánh hai từ Hy Lạp nhấn mạnh sức lực.
