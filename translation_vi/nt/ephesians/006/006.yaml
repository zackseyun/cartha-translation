  - severity: low
    issue: Chú thích a giải thích nghĩa đen là “sự phục vụ trước mắt.”
    rationale: Cách giải thích này không rõ nghĩa trong tiếng Việt và làm mờ yếu tố “mắt/người quan sát” của từ ghép. Nên nêu “sự phục vụ vì mắt người” hoặc “phục vụ để người ta thấy,” đồng thời giữ phương án diễn giải tự nhiên.
