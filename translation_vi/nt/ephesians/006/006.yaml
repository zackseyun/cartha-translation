id: EPH.6.6
reference: Ephesians 6:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ κατ’ ὀφθαλμοδουλίαν ὡς ἀνθρωπάρεσκοι ἀλλ’ ὡς ⸀δοῦλοι Χριστοῦ ποιοῦντες τὸ θέλημα τοῦ θεοῦ, ἐκ ψυχῆς
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/006.yaml
  text: not by eye-service[a], as people-pleasers, but as servants of Messiah[c][b], doing the will of God from the soul.
translation:
  language: vi
  text: không phục vụ chỉ khi có người trông thấy[a], như những kẻ lấy lòng người, nhưng như những nô lệ của Đấng Mê-si[b], làm theo ý muốn của Đức Chúa Trời bằng cả tâm hồn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không theo kiểu phục vụ để người ta thấy” hoặc “không chỉ phục vụ khi có người quan sát”; từ Hy Lạp có nghĩa đen là “sự phục vụ vì mắt người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ”. Từ Hy Lạp Christos có nghĩa là “Đấng được xức dầu”, tương ứng với “Đấng Mê-si”.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “hết lòng”; theo nghĩa đen là “từ tâm hồn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: phục vụ chỉ để người ta thấy
  rationale: Từ ghép hiếm này có nghĩa đen liên quan đến “mắt” và “sự phục vụ”, chỉ việc làm cốt để tỏ ra tốt khi có người quan sát. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng ý phê phán của từ.
- source_word: ἀνθρωπάρεσκοι
  choice: những kẻ lấy lòng người
  rationale: Diễn đạt tự nhiên thái độ làm việc nhằm được con người chấp thuận, đồng thời giữ sắc thái tiêu cực của nguyên ngữ.
- source_word: δοῦλοι
  choice: những nô lệ
  rationale: Ngữ cảnh trực tiếp nói với những người nô lệ và nhấn mạnh sự lệ thuộc, thuộc về Đấng Mê-si; “nô lệ” giữ được sức nặng mà “đầy tớ” có thể làm nhẹ đi.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός là tước hiệu chỉ Đấng được xức dầu. “Đấng Mê-si” truyền đạt ý nghĩa tước hiệu thay vì biến nó thành một tên riêng.
- source_word: ποιοῦντες τὸ θέλημα τοῦ θεοῦ
  choice: làm theo ý muốn của Đức Chúa Trời
  rationale: “Làm theo” thể hiện rõ hành động thực hiện điều Đức Chúa Trời muốn, phù hợp với chức năng của phân từ trong lời khuyên của ngữ cảnh.
- source_word: ἐκ ψυχῆς
  choice: bằng cả tâm hồn
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt, vừa giữ hình ảnh ψυχή (“tâm hồn/linh hồn”) vừa diễn tả sự chân thành trọn vẹn từ bên trong.
theological_decisions:
- issue: Cách dịch δοῦλοι trong quy tắc gia đình có nhắc đến chế độ nô lệ
  choice: những nô lệ của Đấng Mê-si
  alternative: những đầy tớ của Đấng Christ
  rationale: Câu này nói với những nô lệ theo nghĩa xã hội trong ngữ cảnh gần và tái định hướng căn tính của họ về Đấng Mê-si. Giữ “nô lệ” bảo toàn sự căng thẳng lịch sử và thần học của lời văn.
- issue: Χριστοῦ là tước hiệu hay dạng gần như tên riêng
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm “nô lệ của Χριστός”, sự quy thuộc vào vị vua được xức dầu vẫn nổi bật. Bản dịch tước hiệu làm rõ nghĩa của từ mà không thêm một cách giải thích hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một phần tiếp nối cú pháp từ câu trước. “Phục vụ chỉ để người ta thấy” ưu tiên sự rõ nghĩa hơn một từ ghép gượng ép; “nô lệ” giữ nguyên sức nặng của ngữ cảnh; “bằng cả tâm hồn” vừa tự nhiên vừa bảo lưu hình ảnh nội tâm của nguyên ngữ.
