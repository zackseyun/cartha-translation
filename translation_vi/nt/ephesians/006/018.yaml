language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: vi
  text: Hãy cầu nguyện mọi lúc trong Thánh Linh[a], bằng mọi lời cầu nguyện và khẩn cầu. Vì vậy, hãy tỉnh thức với mọi sự kiên trì và khẩn cầu cho tất cả các thánh đồ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong tâm linh.” Nguyên văn Hy Lạp có thể được hiểu theo nghĩa khái quát hơn, nhưng trong văn mạch, từ này rất có thể chỉ Thánh Linh.'
    reason: alternative_reading
  - marker: b
    text: “Các thánh đồ” ở đây nghĩa là toàn thể dân thánh của Đức Chúa Trời, tức mọi người tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: dùng mọi lời cầu nguyện và nài xin
  rationale: διά với sở hữu cách diễn tả phương tiện; “dùng” truyền đạt rõ chức năng ấy. “Cầu nguyện” là từ khái quát, còn “nài xin” giữ sắc thái của lời khẩn cầu cụ thể.
- source_word: προσευχόμενοι ἐν παντὶ καιρῷ
  choice: mà cầu nguyện mọi lúc
  rationale: Giữ ý của phân từ hiện tại và phạm vi bao quát của παντί, đồng thời nối tự nhiên với lời khuyên ở văn cảnh trước.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Trong văn mạch Ê-phê-sô và ngay sau câu 17, πνεῦμα rất có thể chỉ Thánh Linh; chú thích vẫn bảo lưu khả năng hiểu là tâm linh con người.
- source_word: εἰς αὐτὸ ἀγρυπνοῦντες
  choice: Vì chính điều này, hãy tỉnh thức
  rationale: “Vì chính điều này” giữ sắc thái nhấn mạnh của αὐτό; “tỉnh thức” diễn đạt sự cảnh giác bền bỉ của ἀγρυπνέω.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: với tất cả lòng kiên trì trong sự nài xin
  rationale: Cách diễn đạt tự nhiên này cho thấy sự kiên trì thể hiện trong việc nài xin, phù hợp quan hệ ý nghĩa có thể có giữa hai danh từ, dù καί cũng có thể được hiểu theo nghĩa nối hai yếu tố song song.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: cho toàn thể các thánh đồ
  rationale: “Thánh đồ” là cách gọi quen thuộc dành cho những người thuộc về Đức Chúa Trời; “toàn thể” nhấn mạnh rằng lời cầu thay hướng đến tất cả họ.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματι
  choice: Thánh Linh
  alternative: tâm linh con người; cầu nguyện trong tâm linh
  rationale: Văn mạch gần và cách dùng của Phao-lô nghiêng về Thánh Linh, nhưng nguyên văn không có mạo từ nên vẫn tồn tại sự mơ hồ thực sự; điều này được ghi trong chú thích.
- issue: Ý nghĩa của ἅγιοι
  choice: toàn thể những người thuộc về Đức Chúa Trời, được gọi là “các thánh đồ”
  alternative: một nhóm người được giáo hội phong thánh theo nghĩa về sau
  rationale: Trong cách dùng của Phao-lô, danh từ này chỉ toàn cộng đồng tín hữu chứ không phải một tầng lớp được công nhận đặc biệt về sau.
- issue: Quan hệ giữa προσκαρτερήσει và δεήσει
  choice: lòng kiên trì trong sự nài xin
  alternative: tất cả lòng kiên trì và sự nài xin
  rationale: Bản chính chọn cách hiểu sự kiên trì bổ nghĩa về ý cho việc nài xin, tạo câu tiếng Việt tự nhiên; chú thích bảo lưu cách đọc phối hợp trực tiếp theo καί.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Thánh Linh” và “thánh đồ” theo lối diễn đạt Kinh Thánh quen thuộc; cấu trúc được chia thành hai câu để tránh chuỗi phân từ nặng nề mà vẫn giữ mạch khuyên nhủ của nguyên văn.
