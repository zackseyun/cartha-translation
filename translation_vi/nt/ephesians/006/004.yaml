id: EPH.6.4
reference: Ephesians 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: vi
  text: Còn những người làm cha, đừng chọc giận con cái mình, nhưng hãy nuôi dạy chúng bằng sự rèn luyện và khuyên bảo của Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “của Chúa” có thể chỉ sự rèn luyện và khuyên bảo đến từ Chúa, thuộc về Chúa, mang đặc tính của Chúa hoặc được Chúa định hướng.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: những người làm cha
  rationale: Danh từ Hy Lạp ở giống đực số nhiều, trực tiếp nói với những người cha; cách dịch này không mở rộng thành “cha mẹ” ngoài phạm vi của nguyên văn.
- source_word: παροργίζετε
  choice: chọc giận
  rationale: Động từ mang nghĩa khiến người khác nổi giận hoặc sinh lòng oán giận; “chọc giận” diễn đạt tự nhiên và giữ rõ sắc thái gây ra cơn giận.
- source_word: τέκνα
  choice: con cái
  rationale: Từ này chỉ những người con trong gia đình, không phân biệt trai hay gái; “con cái” là cách nói tự nhiên trong tiếng Việt.
- source_word: ἐκτρέφετε
  choice: nuôi dạy
  rationale: Trong bối cảnh dưỡng dục con cái, động từ không chỉ nói đến nuôi dưỡng thể chất mà còn bao hàm việc chăm sóc và dạy dỗ để trưởng thành.
- source_word: παιδείᾳ
  choice: sự rèn luyện
  rationale: Từ này bao gồm quá trình đào luyện, uốn nắn và sửa trị; “rèn luyện” giữ được sắc thái hình thành nhân cách mà không thu hẹp vào hình phạt.
- source_word: νουθεσίᾳ
  choice: khuyên bảo
  rationale: Danh từ chỉ sự hướng dẫn bằng lời, nhắc nhở hoặc cảnh tỉnh nhằm điều chỉnh hành vi; “khuyên bảo” rõ ràng và tự nhiên với độc giả hiện đại.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ cấu trúc sở hữu rộng của nguyên văn, không quyết định cụ thể rằng sự rèn luyện và khuyên bảo đến từ Chúa, thuộc về Chúa hay được định hướng bởi Chúa.
theological_decisions:
- issue: Phạm vi của πατέρες trong lời chỉ dạy gia đình
  choice: Dịch cụ thể là “những người làm cha”.
  alternative: “cha mẹ”
  rationale: Nguyên văn trực tiếp gọi những người cha. Dù nguyên tắc này có thể được áp dụng rộng hơn, bản dịch không nên tự mở rộng đối tượng được nêu trong câu.
- issue: Ý nghĩa của κυρίου trong cụm παιδείᾳ καὶ νουθεσίᾳ κυρίου
  choice: Giữ cách diễn đạt “sự rèn luyện và khuyên bảo của Chúa”.
  alternative: “sự rèn luyện và khuyên bảo đến từ Chúa”, “về Chúa”, hoặc “theo Chúa”
  rationale: Sở hữu cách Hy Lạp có thể chỉ nguồn gốc, sự thuộc về, đặc tính hoặc định hướng. “Của Chúa” bảo tồn độ rộng thần học ấy thay vì chọn một nghĩa duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Còn” đánh dấu sự chuyển sang đối tượng tiếp theo trong quy tắc gia đình; “nuôi dạy” là cách diễn đạt tự nhiên cho trách nhiệm dưỡng dục lâu dài.
