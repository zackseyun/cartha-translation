  text: và trang bị cho đôi chân mình bằng sự sẵn sàng của tin mừng về sự bình an,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự chuẩn bị”. Cụm này cũng có thể mang nghĩa “sự sẵn sàng rao truyền tin mừng về sự bình an” hoặc “nền tảng vững chắc do tin mừng về sự bình an đem lại”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: mang vào chân
  rationale: Phân từ bất định trung động của ὑποδέομαι chỉ việc mang hoặc buộc giày dép vào chân. “Mang vào chân” tự nhiên trong tiếng Việt, giữ được hình ảnh trang bị cho đôi chân mà không thêm danh từ “giày” vốn không hiện diện trong câu Hy Lạp.
- source_word: τοὺς πόδας
  choice: chân
  rationale: Dịch trực tiếp danh từ chỉ “chân”, giữ nguyên hình ảnh thân thể trong ẩn dụ khí giới.
- source_word: ἐν
  choice: với ý nghĩa phương tiện được thể hiện bằng cấu trúc “mang vào chân…”
  rationale: Ở đây ἐν có thể chỉ phương tiện hoặc vật trang bị. Cấu trúc tiếng Việt không cần dịch thành một giới từ riêng, nhưng vẫn truyền đạt ý đôi chân được trang bị bằng điều theo sau.
- source_word: ἑτοιμασίᾳ
  choice: sự sẵn sàng
  rationale: Danh từ có nghĩa là sự sẵn sàng hoặc sự chuẩn bị. Cách dịch này trực tiếp và không tự ý xác định đó là sẵn sàng đi rao truyền hay là chỗ đứng vững chắc.
- source_word: εὐαγγελίου
  choice: Tin Lành
  rationale: Thuật ngữ quen thuộc, trang trọng và dễ hiểu trong tiếng Việt để chỉ tin mừng trong văn mạch Phao-lô.
- source_word: εἰρήνης
  choice: bình an
  rationale: “Bình an” là cách dịch tự nhiên của εἰρήνη trong văn phong Kinh Thánh tiếng Việt; sở hữu cách nối từ này với “Tin Lành”, chỉ Tin Lành có nội dung, đặc tính hoặc hiệu quả liên quan đến bình an.
theological_decisions:
- issue: Ý nghĩa của cụm ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης
  choice: Giữ cụm cô đọng là “sự sẵn sàng của Tin Lành bình an”
  alternative: “sẵn sàng rao truyền Tin Lành bình an” hoặc “chỗ đứng vững chắc do Tin Lành bình an ban cho”
  rationale: Cú pháp Hy Lạp cho phép hiểu là sự sẵn sàng gắn với hoặc đến từ Tin Lành, sự sẵn sàng để công bố Tin Lành, hay nền tảng vững chắc Tin Lành đem lại. Bản chính không giải quyết thay sự mơ hồ thật sự này; chú thích nêu các khả năng chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ như một phần nối tiếp của mệnh lệnh mặc lấy toàn bộ khí giới trong văn cảnh. “Tin Lành bình an” bảo toàn chuỗi sở hữu cách cô đọng của nguyên văn; chú thích giúp độc giả nhận biết các cách hiểu hợp lý mà không áp đặt một cách giải nghĩa.
