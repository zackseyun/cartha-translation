base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: vi
  text: Vì điều ấy, tôi là sứ giả trong xiềng xích[a], để trong điều ấy[b] tôi có thể mạnh dạn nói như tôi phải nói.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong một xiềng xích”; cách nói này gợi cảnh bị giam cầm.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong điều ấy/trong đó”. Theo văn mạch, nhiều khả năng chỉ “mầu nhiệm của Tin Lành” ở câu trước, hoặc Tin Lành; hình thức Hy Lạp cũng có thể được hiểu theo giống đực, nên có người hiểu là “trong Ngài”.'
    reason: alternative_reading
  - marker: c
    text: “Mạnh dạn” cũng hàm ý nói cách công khai, thẳng thắn và không sợ hãi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: Vì Tin Lành ấy
  rationale: Đại từ quan hệ ở giống trung, số ít, nhiều khả năng quy chiếu về “mầu nhiệm của Tin Lành” trong câu 19. “Vì” diễn đạt tự nhiên ý vì cớ hoặc phục vụ cho sứ điệp ấy.
- source_word: πρεσβεύω
  choice: tôi làm sứ giả
  rationale: Động từ chỉ việc thi hành vai trò của một sứ thần hay đặc sứ; “làm sứ giả” giữ được sắc thái đại diện chính thức mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐν ἁλύσει
  choice: trong xiềng xích
  rationale: Nguyên văn dùng danh từ số ít, nhưng “trong xiềng xích” là cách nói tiếng Việt tự nhiên về cảnh bị giam cầm, đồng thời giữ nguyên hình ảnh cụ thể.
- source_word: ἐν αὐτῷ
  choice: khi rao truyền Tin Lành ấy
  rationale: Đại từ là giống trung và có lẽ tiếp tục quy chiếu về Tin Lành hoặc mầu nhiệm của Tin Lành. Cách diễn đạt này làm rõ quan hệ theo ngữ cảnh mà không chuyển đại từ thành một quy chiếu giống đực.
- source_word: παρρησιάσωμαι
  choice: tôi mạnh dạn nói
  rationale: Động từ diễn tả việc nói công khai, thẳng thắn và can đảm. “Mạnh dạn nói” truyền đạt được trọng tâm ấy bằng tiếng Việt hiện đại.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: như tôi phải nói
  rationale: δεῖ biểu thị sự cần thiết hay bổn phận; “phải nói” giữ được sức nặng của nghĩa vụ và gọn tự nhiên.
theological_decisions:
- issue: Đối tượng quy chiếu của οὗ và αὐτῷ
  choice: Hiểu cả hai đại từ giống trung là quy chiếu về Tin Lành hoặc “mầu nhiệm của Tin Lành” trong câu 19.
  alternative: Hiểu rộng là việc công bố Tin Lành; một số cách giải thích đọc αὐτῷ theo nghĩa “trong Ngài”.
  rationale: Hình thái giống trung của cả hai đại từ ủng hộ mạnh quy chiếu về sự vật hoặc sứ điệp, chứ không trực tiếp về một nhân vật giống đực. Bản dịch giữ chỉ dấu ngữ pháp này, đồng thời ghi nhận cách hiểu khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tin Lành” được viết hoa như tên gọi quen thuộc của sứ điệp. Cấu trúc được làm tự nhiên trong tiếng Việt nhưng vẫn giữ hình ảnh sứ giả bị xiềng xích, mục đích cầu xin và ý nghĩa bổn phận của δεῖ.
