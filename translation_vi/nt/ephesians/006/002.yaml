base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/002.yaml
  text: Honor your father and mother—which is the first commandment with a promise—[a]
translation:
  language: vi
  text: “Hãy hiếu kính cha mẹ ngươi”—đó là điều răn đầu tiên đi kèm với một lời hứa—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát chữ hơn: “điều răn đầu tiên trong lời hứa”; ý nói đây là điều răn đầu tiên đi kèm với một lời hứa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμα
  choice: hãy hiếu kính
  rationale: Động từ mệnh lệnh đòi hỏi việc chủ động bày tỏ lòng tôn kính. “Hiếu kính” là cách diễn đạt tự nhiên trong tiếng Việt đối với bổn phận con cái dành cho cha mẹ và giữ được sức nặng luân lý của điều răn.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: cha mẹ ngươi
  rationale: Diễn đạt gọn và tự nhiên trong tiếng Việt, bao gồm trực tiếp cả cha lẫn mẹ. “Ngươi” giữ sắc thái trang trọng của lời trích dẫn điều răn mà vẫn dễ hiểu.
- source_word: ἥτις ἐστὶν
  choice: đó là
  rationale: Đại từ quan hệ quy chiếu về điều răn vừa được trích dẫn. “Đó là” tự nhiên trong tiếng Việt và làm rõ lời giải thích xen vào của Phao-lô.
- source_word: ἐντολὴ πρώτη
  choice: điều răn đầu tiên
  rationale: “Điều răn” giữ âm hưởng của Mười Điều Răn; πρώτη mang nghĩa thứ tự “đầu tiên”, không tự nó có nghĩa “quan trọng nhất”.
- source_word: ἐν ἐπαγγελίᾳ
  choice: đi kèm với một lời hứa
  rationale: Cụm Hy Lạp có dạng sát chữ là “trong lời hứa”, nhưng trong ngữ cảnh chỉ điều răn được kèm theo một lời hứa. Cách dịch này rõ nghĩa mà không làm mất cấu trúc tư tưởng.
theological_decisions:
- issue: Quan hệ giữa “điều răn đầu tiên” và cách đánh số Mười Điều Răn
  choice: điều răn đầu tiên đi kèm với một lời hứa
  alternative: điều răn đầu tiên trong lời hứa; điều răn đầu tiên thuộc bảng thứ hai
  rationale: Bản dịch nêu cách hiểu tự nhiên rằng đây là điều răn đầu tiên có lời hứa được nói rõ, nhưng chú thích vẫn bảo lưu cách diễn đạt sát chữ của tiếng Hy Lạp. Không áp đặt một cách đánh số Mười Điều Răn mang tính hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu ngoặc kép đánh dấu lời trích từ điều răn; dấu gạch ngang thể hiện lời giải thích xen vào. “Hiếu kính” phù hợp ngữ cảnh gia đình hơn “tôn trọng” đơn thuần, vì bao hàm sự tôn kính được bày tỏ bằng hành động.
