  source_fidelity: Bản dịch phản ánh đúng mục đích của ἵνα, sự bổ sung nhẹ của δέ, ý nhấn mạnh trong “anh chị em cũng”, và hai nội dung τὰ κατ’ ἐμέ / τί πράσσω. Tuy nhiên, cách đặt chú thích b sau “Chúa” không neo trực tiếp vào từ διάκονος mà chú thích đang giải thích.
  naturalness: Câu dự thảo dễ hiểu, nhưng việc lặp “biết” và đặt hai vế bằng dấu phẩy hơi nặng. Dùng “và việc tôi đang làm” tự nhiên hơn mà vẫn giữ đủ hai thành tố của nguyên văn.
  terminology: “Ty-chi-cơ,” “người anh em yêu dấu,” “người phục vụ trung tín,” và “trong Chúa” đều phù hợp. “Người phục vụ” giữ tính không xác định chức vụ của διάκονος; chú thích nêu khả năng “chấp sự” một cách thận trọng.
