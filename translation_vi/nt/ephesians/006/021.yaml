id: EPH.6.21
reference: Ephesians 6:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: vi
  text: Còn để anh chị em cũng biết tình hình của tôi[a] và việc tôi đang làm, Ty-chi-cơ, người anh em yêu dấu và là người phục vụ trung tín[b] trong Chúa, sẽ cho anh chị em biết mọi sự.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “những điều liên quan đến tôi”; cũng có thể dịch: “hoàn cảnh của tôi.”'
    reason: lexical_alternative
  - marker: b
    text: Từ được dịch là “người phục vụ” cũng có thể dịch là “người hầu việc”; trong một số ngữ cảnh, từ này chỉ “chấp sự.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: Nhưng để
  rationale: ἵνα diễn tả mục đích, còn δέ nối nhẹ với phần trước; “Nhưng để” giữ cả hai nét nghĩa mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: anh chị em cũng biết
  rationale: καί cùng đại từ được nhấn mạnh cho biết người nhận thư cũng sẽ được biết; “anh chị em” là cách xưng hô tự nhiên với cộng đồng tín hữu.
- source_word: τὰ κατ’ ἐμέ
  choice: tình hình của tôi
  rationale: Thành ngữ này chỉ những điều liên quan đến Phao-lô, tức hoàn cảnh hay tình hình của ông; cách dịch này tự nhiên mà không thu hẹp thành tình trạng sức khỏe.
- source_word: τί πράσσω
  choice: tôi đang làm gì
  rationale: Diễn đạt trực tiếp hoạt động hay công việc hiện tại của Phao-lô.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: sẽ cho anh chị em biết mọi sự
  rationale: Giữ nghĩa của γνωρίζω là làm cho biết hoặc thông báo, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: Τυχικὸς
  choice: Ty-chi-cơ
  rationale: Phiên âm tên riêng theo cách đọc rõ ràng, quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: người anh em yêu dấu
  rationale: Giữ hình ảnh thân thuộc trong cộng đồng đức tin và tình cảm của ἀγαπητός.
- source_word: πιστὸς διάκονος
  choice: người phục vụ trung tín
  rationale: διάκονος ở đây mô tả vai trò phục vụ đáng tin cậy của Ty-chi-cơ, chưa đủ rõ để xác định một chức vụ giáo hội chính thức.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách nói đặc trưng của Phao-lô, chỉ mối liên hệ hoặc phạm vi thuộc về Chúa.
theological_decisions:
- issue: Cách dịch διάκονος khi nói về Ty-chi-cơ
  choice: người phục vụ
  alternative: người hầu việc; chấp sự
  rationale: Ngữ cảnh nhấn mạnh người cộng tác trung tín sẽ báo tin về Phao-lô, chứ không xác định rõ chức danh “chấp sự”; “người phục vụ” giữ nghĩa chức năng và tránh áp đặt cơ cấu giáo hội.
- issue: Cách dịch ἀδελφός
  choice: người anh em
  alternative: anh em đồng đạo
  rationale: Ty-chi-cơ là một cá nhân nam và được mô tả bằng ngôn ngữ gia đình của cộng đồng tín hữu; “người anh em” vừa chính xác vừa tự nhiên.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: Trong cụm từ đặc trưng của Phao-lô, κύριος là tước hiệu dành cho Chúa; “Chúa” phù hợp ngữ cảnh và truyền thống tiếng Việt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận; giữ cấu trúc mục đích của câu Hy Lạp và đặt hai chú thích tại đúng những điểm có khả năng dịch khác.
