source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: vi
  text: Hỡi các con, hãy vâng lời cha mẹ mình trong Chúa[a], vì điều đó là đúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thuộc về Chúa” / “trong sự hiệp nhất với Chúa”. Cụm “trong Chúa” có thể chỉ phạm vi hoặc cách thức của sự vâng lời, và cũng có thể hàm ý rằng sự vâng lời ấy được giới hạn bởi lòng trung thành với Chúa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Hỡi những người con
  rationale: Cụm hô cách số nhiều trực tiếp nói với những người con trong gia đình. Cách dịch này tự nhiên, bao gồm cả con trai lẫn con gái và giữ rõ sắc thái xưng gọi.
- source_word: ὑπακούετε
  choice: hãy vâng lời
  rationale: Động từ mệnh lệnh hiện tại đòi hỏi sự nghe theo bằng hành động, chứ không chỉ nghe âm thanh; “vâng lời” diễn đạt đúng lực của lời truyền dạy.
- source_word: τοῖς γονεῦσιν ὑμῶν
  choice: cha mẹ mình
  rationale: γονεῖς chỉ chung cha và mẹ. Đại từ phản thân “mình” là cách nói tiếng Việt tự nhiên trong mệnh lệnh hướng đến người nghe.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: 'Giữ cấu trúc ngắn gọn đặc trưng của Phao-lô và không khép lại sự đa nghĩa: cụm này có thể nói đến phạm vi, cách thức hoặc mối liên hệ với Chúa của sự vâng lời.'
- source_word: δίκαιον
  choice: điều phải
  rationale: Trong ngữ cảnh này, tính từ chỉ điều đúng đắn, hợp đạo lý. “Điều phải” trang trọng vừa đủ và tự nhiên hơn những cách dịch thiên về pháp lý như “công chính” hay “công bằng”.
theological_decisions:
- issue: Phạm vi ý nghĩa của cụm “trong Chúa”
  choice: 'Gắn cụm từ với mệnh lệnh: “hãy vâng lời cha mẹ mình trong Chúa”, đồng thời giữ nguyên tính rộng mở của nó.'
  alternative: Hiểu là “những người con ở trong Chúa” phải vâng lời, hoặc diễn giải thành “hãy vâng lời cha mẹ theo cách phù hợp với Chúa”.
  rationale: Vị trí trong tiếng Hy Lạp tự nhiên nhất khi gắn ἐν κυρίῳ với động từ mệnh lệnh, nhưng sắc thái chính xác không được nói rõ. Bản dịch sát cụm từ tránh quyết định thay người đọc rằng đây là căn tính của người con, phạm vi/cách thức vâng lời, hay giới hạn ngầm do lòng trung thành với Chúa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Hỡi” để thể hiện lời gọi trực tiếp của hô cách; giữ nguyên thành ngữ thần học “trong Chúa” thay vì diễn giải. Không thêm chú thích vì bản nguồn tiếng Anh đặt dấu [a] sau “Children” nhưng nội dung chú thích thực tế giải thích “in the Lord”; chuyển dấu ấy sang sau cụm từ sẽ làm thay đổi dữ liệu được cung cấp, còn giữ tại “những người con” sẽ gây liên kết sai.
