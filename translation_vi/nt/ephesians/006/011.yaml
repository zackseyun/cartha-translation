revisions:
- from: Hãy mặc lấy trọn bộ khí giới của Đức Chúa Trời[a], để anh em có thể đứng vững trước những mưu kế[b] của ma quỷ.
  to: Hãy mặc lấy toàn bộ trang bị chiến đấu[a] của Đức Chúa Trời, để anh chị em có thể đứng vững trước những mưu kế[b] của ma quỷ.
  rationale: 'Đã chuyển neo chú thích a đến cụm tương ứng với πανοπλία và điều chỉnh cách diễn đạt sang tiếng Việt hiện đại hơn. Các yếu tố ngữ nghĩa còn lại được giữ nguyên: mệnh lệnh, tính đầy đủ của trang bị, quan hệ rộng trong «của Đức Chúa Trời», mục đích, và các mưu kế của ma quỷ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh số nhiều «hãy mặc lấy», tính trọn vẹn của πανοπλία, mục đích «để ... có thể», và sắc thái xảo quyệt của μεθοδείας. «Đứng vững» là cách diễn đạt phù hợp trong hình ảnh chiến đấu. Tuy nhiên, chú thích a đang được neo sau «Đức Chúa Trời», trong khi chú thích này giải thích πανοπλία («toàn bộ trang bị»), nên cần đặt neo ngay sau cụm được giải thích.
  naturalness: «Toàn bộ trang bị chiến đấu» tự nhiên hơn «trọn bộ khí giới» trong tiếng Việt hiện đại, đồng thời làm rõ rằng πανοπλία là đầy đủ quân trang chứ không chỉ là các vũ khí. «Anh chị em» phản ánh đối tượng số nhiều mà không mặc định giới tính.
  terminology: Giữ «Đức Chúa Trời», «ma quỷ», và «mưu kế» phù hợp với văn cảnh và cách dùng Kinh Thánh tiếng Việt. Không cần giải thích thêm về nhân vật «ma quỷ» trong bản văn.
  issues:
  - severity: medium
    issue: Neo chú thích a đặt sai vị trí
    rationale: Chú thích a nêu phương án cho πανοπλία («toàn bộ trang bị chiến đấu»), nhưng hiện được đặt sau «Đức Chúa Trời». Neo phải theo ngay cụm «toàn bộ trang bị chiến đấu» để liên kết chú thích với từ/cụm từ mà nó giải thích.
  - severity: low
    issue: «Trọn bộ khí giới» kém tự nhiên và có thể thu hẹp nghĩa
    rationale: «Khí giới» thường gợi vũ khí, trong khi πανοπλία chỉ toàn bộ quân trang của người lính. «Toàn bộ trang bị chiến đấu» vừa tự nhiên vừa giữ phạm vi từ vựng rộng hơn.
  revised_text: Hãy mặc lấy toàn bộ trang bị chiến đấu[a] của Đức Chúa Trời, để anh chị em có thể đứng vững trước những mưu kế[b] của ma quỷ.
