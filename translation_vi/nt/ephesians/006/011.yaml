language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: vi
  text: Hãy mặc lấy toàn bộ trang bị chiến đấu[a] của Đức Chúa Trời, để anh chị em có thể đứng vững trước những mưu kế[b] của ma quỷ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trọn bộ khí giới.” Từ Hy Lạp chỉ toàn bộ trang bị của một người lính.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những thủ đoạn” hoặc “những phương cách xảo quyệt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: Hãy mặc lấy
  rationale: Động từ mệnh lệnh aorist, ngôi thứ hai số nhiều, truyền đạt lời kêu gọi chủ động khoác lên mình trang bị chiến đấu; “mặc lấy” tự nhiên trong hình ảnh này và giữ được sắc thái mệnh lệnh.
- source_word: πανοπλίαν
  choice: trọn bộ khí giới
  rationale: Danh từ chỉ toàn bộ trang bị của một người lính được vũ trang đầy đủ, chứ không chỉ riêng áo giáp. “Trọn bộ khí giới” nhấn mạnh tính đầy đủ mà vẫn giữ hình ảnh quân sự.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu rộng của nguyên văn, không quyết định quá mức rằng khí giới chỉ thuộc về Đức Chúa Trời hay được Ngài ban cấp.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: để anh em có thể đứng vững
  rationale: Cụm giới từ với động từ nguyên mẫu có mạo từ diễn tả mục đích hoặc kết quả. “Để… có thể” tự nhiên trong tiếng Việt; “đứng vững” truyền đạt ý đứng giữ vị trí trong bối cảnh chiến đấu.
- source_word: μεθοδείας
  choice: những mưu kế
  rationale: Từ này chỉ những phương cách, thủ đoạn hoặc chiến thuật xảo quyệt. “Mưu kế” rõ ràng, hiện đại và giữ sắc thái cố ý, lừa dối.
- source_word: τοῦ διαβόλου
  choice: của ma quỷ
  rationale: Trong bối cảnh cuộc chiến thuộc linh, διάβολος là danh xưng chỉ kẻ thù gian ác mang tính cá vị, không chỉ có nghĩa chung là một kẻ vu khống.
theological_decisions:
- issue: Đối tượng được gọi là διάβολος
  choice: ma quỷ, tức kẻ thù gian ác mang tính cá vị
  alternative: kẻ vu khống
  rationale: Bối cảnh chiến đấu thuộc linh trong Ê-phê-sô 6 ủng hộ cách hiểu đây là một đối thủ siêu nhiên mang tính cá vị. Bản dịch không thêm chi tiết giáo lý ngoài điều câu văn hàm ý.
- issue: Quan hệ trong cụm τοῦ θεοῦ
  choice: của Đức Chúa Trời
  alternative: do Đức Chúa Trời ban
  rationale: Sở hữu cách Hy Lạp có thể gợi cả quyền sở hữu lẫn nguồn cung cấp. Cách dịch sát “của Đức Chúa Trời” bảo tồn độ rộng ấy thay vì chỉ chọn một quan hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mặc lấy” duy trì hình ảnh khoác trang bị; “trọn bộ khí giới” có sắc thái Kinh Thánh vừa phải nhưng vẫn thông dụng. Đại từ số nhiều “anh em” thể hiện đối tượng cộng đồng của mệnh lệnh Hy Lạp.
