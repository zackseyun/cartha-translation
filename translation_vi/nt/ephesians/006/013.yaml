  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: vi
  text: Vì vậy, hãy cầm lấy trọn bộ khí giới của Đức Chúa Trời[a], để anh em có thể chống cự trong ngày gian ác[b] và, sau khi đã làm mọi sự[c], đứng vững.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “toàn bộ binh giáp của Đức Chúa Trời.” Từ Hy Lạp chỉ toàn bộ trang bị chiến đấu của một người lính.
    reason: lexical_alternative
  - marker: b
    text: “Ngày gian ác” có thể chỉ chung một thời kỳ gian ác hoặc thử thách dữ dội, không nhất thiết chỉ một biến cố tận thế cụ thể.
    reason: alternative_reading
  - marker: c
    text: Hay “sau khi đã hoàn tất mọi sự” hoặc “sau khi đã thực hiện tất cả.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ suy luận với lời khuyên ở câu trước.
- source_word: ἀναλάβετε
  choice: hãy cầm lấy
  rationale: Động từ chỉ việc nhấc lên hoặc nhận lấy; cách dịch này giữ được hình ảnh người lính trang bị vũ khí mà không đổi thành động từ 'mặc'.
- source_word: τὴν πανοπλίαν
  choice: trọn bộ khí giới
  rationale: πανοπλία chỉ toàn bộ trang bị chiến đấu của người lính; 'trọn bộ khí giới' vừa nêu tính đầy đủ vừa bao quát cả giáp, khiên và vũ khí.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ nguyên độ rộng của sở hữu cách Hy Lạp, không quyết định đó là khí giới thuộc về Đức Chúa Trời hay do Ngài ban.
- source_word: ἵνα δυνηθῆτε
  choice: để anh em có thể
  rationale: Thể hiện rõ cả mục đích lẫn khả năng, không thêm sắc thái thần học ngoài nguyên văn.
- source_word: ἀντιστῆναι
  choice: chống cự
  rationale: Trong ngữ cảnh chiến đấu, động từ mang nghĩa kháng cự hoặc đứng chống lại sự tấn công.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: trong ngày gian ác
  rationale: Giữ cách nói cô đọng và rộng nghĩa của nguyên văn, không giới hạn vào một biến cố tận thế cụ thể.
- source_word: ἅπαντα κατεργασάμενοι
  choice: sau khi đã làm mọi sự
  rationale: Giữ nghĩa rộng của phân từ κατεργασάμενοι—làm, thực hiện hoặc hoàn tất—mà không mặc nhiên biến nó thành tuyên bố chiến thắng.
- source_word: στῆναι
  choice: vẫn đứng vững
  rationale: Diễn đạt kết quả giữ được vị trí sau cuộc chống cự; 'vẫn' làm rõ sắc thái tiếp tục đứng, còn 'đứng vững' phù hợp tự nhiên với hình ảnh quân sự trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của 'ngày gian ác'
  choice: Để ngỏ như một thời kỳ hoặc hoàn cảnh gian ác và thử thách
  alternative: Một ngày tận thế cụ thể hoặc một ngày thử thách cá nhân
  rationale: Cụm từ Hy Lạp không buộc phải chỉ riêng một biến cố cánh chung; bản dịch giữ nguyên phạm vi rộng.
- issue: Sắc thái sở hữu của 'khí giới của Đức Chúa Trời'
  choice: Giữ cấu trúc 'của Đức Chúa Trời'
  alternative: Khí giới thuộc về Đức Chúa Trời hoặc khí giới do Đức Chúa Trời ban
  rationale: Sở hữu cách trong nguyên văn có thể gợi cả sự thuộc về lẫn nguồn ban; không nên thu hẹp bằng cách diễn giải một nghĩa duy nhất.
- issue: Quan hệ giữa 'làm mọi sự' và 'đứng vững'
  choice: Không diễn giải 'làm mọi sự' thành chiến thắng hoàn toàn
  alternative: Sau khi đã chiến thắng tất cả
  rationale: κατεργάζομαι có thể mang nghĩa hoàn thành hoặc thực hiện; ngữ cảnh không đòi hỏi phải dịch thành một lời khẳng định chiến thắng tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” phù hợp lời khuyên trực tiếp gửi cộng đồng. Cấu trúc quân sự được giữ nhất quán qua “khí giới,” “chống cự” và “đứng vững.”
