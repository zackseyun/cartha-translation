  yaml_path: translation/nt/ephesians/005/026.yaml
  text: so that he might sanctify her[a], having cleansed her by the washing of water with the word[c][b],
translation:
  language: vi
  text: để làm cho Hội Thánh nên thánh[a], sau khi đã thanh tẩy Hội Thánh bằng sự rửa bằng nước cùng với lời[c][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để thánh hóa Hội Thánh, sau khi đã thanh tẩy Hội Thánh bằng sự rửa bằng nước nhờ lời.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “sự rửa bằng nước cùng với lời” có lẽ gợi đến phép báp-têm, nhưng bản văn Hy Lạp tự nó không xác định cụ thể việc này mang tính bí tích đến mức nào.
    reason: cultural_note
  - marker: c
    text: '“Lời” (Hy Lạp: rhēma) cũng có thể được hiểu là “sứ điệp” hoặc “lời được phán”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn tả mục đích một cách tự nhiên và sát với liên từ chỉ mục đích trong tiếng Hy Lạp.
- source_word: αὐτὴν
  choice: Hội Thánh
  rationale: Đại từ giống cái số ít quy chiếu về Hội Thánh trong ngữ cảnh. Lặp lại danh từ giúp câu tiếng Việt rõ nghĩa vì tiếng Việt không có đại từ giống cái tương ứng tự nhiên cho một tập thể.
- source_word: ἁγιάσῃ
  choice: làm cho Hội Thánh nên thánh
  rationale: Giữ ý nghĩa khiến trở nên thánh của động từ, đồng thời dùng cách nói dễ hiểu hơn thuật ngữ chuyên biệt “thánh hóa”.
- source_word: καθαρίσας
  choice: sau khi thanh tẩy Hội Thánh
  rationale: Phân từ bất định quá khứ diễn tả hành động đi trước hoặc gắn liền với động từ chính; “sau khi” truyền đạt rõ quan hệ này. Tân ngữ được bổ sung từ αὐτήν theo ngữ cảnh.
- source_word: τῷ λουτρῷ
  choice: bằng sự rửa
  rationale: Cách tặng cách có giá trị phương tiện được diễn đạt bằng “bằng”; “sự rửa” giữ hình ảnh của λουτρόν mà không tự động đồng nhất với một nghi thức cụ thể.
- source_word: τοῦ ὕδατος
  choice: với nước
  rationale: Diễn đạt tự nhiên trong tiếng Việt mối liên hệ giữa việc rửa và nước, dù nguyên văn dùng cấu trúc sở hữu cách.
- source_word: ἐν ῥήματι
  choice: cùng với lời
  rationale: Giữ quan hệ giữa việc rửa bằng nước và ῥῆμα tương đối rộng, không quyết định dứt khoát đó là phương tiện, lời công bố hay công thức nghi lễ.
- source_word: ῥήματι
  choice: lời
  rationale: “Lời” bảo tồn phạm vi nghĩa gồm lời nói, phát ngôn hoặc sứ điệp, không thu hẹp thành “Tin Lành” hay một công thức cụ thể.
theological_decisions:
- issue: Mối liên hệ giữa sự thanh tẩy, sự rửa bằng nước và lời trong bối cảnh có thể liên quan đến phép báp-têm
  choice: Giữ nguyên hình ảnh rửa bằng nước cùng với lời mà không xác định một thần học bí tích cụ thể.
  alternative: Diễn giải rõ đây là phép báp-têm mang hiệu lực bí tích, hoặc xem toàn bộ là ẩn dụ không liên quan đến phép báp-têm.
  rationale: Ngôn ngữ Hy Lạp gợi mạnh đến hình ảnh phép báp-têm nhưng không tự nó giải quyết mức độ hay cách thức mang tính bí tích.
- issue: Ý nghĩa cụ thể của ῥήματι
  choice: Dùng “lời” trong chính văn.
  alternative: Dùng “sứ điệp”, “lời được phán” hoặc “lời Tin Lành”.
  rationale: Ngữ cảnh có thể chỉ lời công bố gắn với công việc cứu chuộc của Đấng Christ, nhưng từ Hy Lạp có phạm vi rộng hơn; “lời” giữ được sự mở nghĩa đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Hội Thánh” thay cho đại từ để tránh cách nhân cách hóa thiếu tự nhiên trong tiếng Việt; dùng “làm cho… nên thánh” trong chính văn và ghi “thánh hóa” ở chú thích. Trật tự ký hiệu [c][b] đặt ngay sau “lời” theo lớp tham khảo đã kiểm định.
