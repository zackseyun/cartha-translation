review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh đề chỉ mục đích của ἵνα, quy chiếu của đại từ giống cái số ít về Hội Thánh, và trình tự khái quát của động từ chính ἁγιάσῃ với phân từ καθαρίσας. Tuy nhiên, cụm “bằng sự rửa với nước cùng với lời” chưa phản ánh rõ và tự nhiên cấu trúc λουτρῷ τοῦ ὕδατος (“sự rửa bằng nước”). Sửa thành “bằng sự rửa bằng nước cùng với lời” giữ hình ảnh, không áp đặt cách giải thích bí tích, và vẫn để ngỏ quan hệ chính xác của ἐν ῥήματι.
  naturalness: “Làm cho Hội Thánh nên thánh” và việc lặp “Hội Thánh” đều rõ ràng, phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. Tuy nhiên, “sự rửa với nước” là kết hợp từ chưa tự nhiên; tiếng Việt chuẩn dùng “sự rửa bằng nước.” Việc thêm “đã” sau “sau khi” giúp quan hệ trước-sau của phân từ trở nên trôi chảy hơn.
  terminology: “Hội Thánh,” “thanh tẩy,” “nên thánh,” “lời,” và “phép báp-têm” phù hợp đăng ký trang trọng hiện đại. Không nên thay “lời” bằng cách diễn giải như “lời Tin Lành” hay xác quyết bí tích. Chú thích giữ thích đáng tính không quyết định của nguyên ngữ.
  issues:
  - severity: medium
    issue: Cụm “bằng sự rửa với nước” không tự nhiên và chưa biểu đạt rõ quan hệ giữa λουτρῷ và τοῦ ὕδατος.
    rationale: τοῦ ὕδατος bổ nghĩa cho τῷ λουτρῷ; “sự rửa bằng nước” là cách diễn đạt Việt ngữ tự nhiên và sát nghĩa hơn, không biến hình ảnh này thành một khẳng định giáo lý cụ thể.
  - severity: low
