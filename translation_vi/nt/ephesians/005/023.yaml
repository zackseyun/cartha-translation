id: EPH.5.23
reference: Ephesians 5:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: vi
  text: Vì[a] người chồng là đầu của người vợ, cũng như Đấng Mê-si-a[c] là đầu[b] của hội thánh, chính Ngài là Đấng Cứu Rỗi của thân thể[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vì” nêu lý do hoặc lời giải thích cho lời khuyên ở câu trước; cũng có thể hiểu là “bởi vì”.
    reason: lexical_alternative
  - marker: b
    text: “Đầu” giữ nguyên ẩn dụ Hy Lạp. Từ này được hiểu theo nhiều cách, chẳng hạn như hàm ý thẩm quyền, vị trí đứng đầu hoặc nguồn gốc.
    reason: lexical_alternative
  - marker: c
    text: 'Hy Lạp: “Christos”; cũng có thể dịch là “Đấng Christ”. “Đấng Mê-si-a” làm rõ đây là tước hiệu chỉ Đấng được xức dầu.'
    reason: alternative_reading
  - marker: d
    text: Nguyên văn nói “thân thể”, không ghi rõ “thân thể Ngài”; trong ngữ cảnh, thân thể này chỉ hội thánh.
    reason: translation_clarity
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Dẫn vào lý do hoặc lời giải thích cho lời khuyên ở câu trước; “Vì” giữ được quan hệ lập luận tự nhiên trong tiếng Việt.
- source_word: ἀνήρ
  choice: người chồng
  rationale: Trong ngữ cảnh các lời dạy dành cho vợ chồng, từ này mang nghĩa quan hệ hôn nhân, không phải nghĩa chung là “người đàn ông”.
- source_word: κεφαλή
  choice: đầu
  rationale: Giữ nguyên ẩn dụ Hy Lạp và không thu hẹp nghĩa thành một cách giải thích gây tranh luận như “nguồn”, “người lãnh đạo” hay “người có thẩm quyền”.
- source_word: γυνή
  choice: người vợ
  rationale: Khi đi đôi với ἀνήρ trong ngữ cảnh gia đình, từ này chỉ người vợ.
- source_word: ὡς καὶ
  choice: cũng như
  rationale: Diễn đạt tự nhiên cấu trúc so sánh giữa quan hệ chồng-vợ và quan hệ Đấng Mê-si-a–hội thánh mà không đồng nhất hoàn toàn hai quan hệ.
- source_word: Χριστός
  choice: Đấng Mê-si-a
  rationale: Ở đây từ này hoạt động như một tước hiệu; cách dịch giữ rõ ý nghĩa về Đấng được xức dầu.
- source_word: ἐκκλησία
  choice: hội thánh
  rationale: Trong ngữ cảnh Phao-lô, từ này chỉ cộng đồng những người thuộc về Đấng Mê-si-a; “hội thánh” là cách diễn đạt rõ và quen thuộc trong tiếng Việt.
- source_word: αὐτός
  choice: chính Ngài
  rationale: Đại từ có tính nhấn mạnh; “chính Ngài” quy vai trò cứu rỗi một cách rõ ràng cho Đấng Mê-si-a.
- source_word: σωτήρ
  choice: Đấng Cứu Rỗi
  rationale: Giữ cả ý giải cứu lẫn ý nghĩa cứu độ trong ngữ cảnh nói về Đấng Mê-si-a.
- source_word: σῶμα
  choice: thân thể
  rationale: Bảo tồn ẩn dụ thân thể của Phao-lô và không thêm đại từ sở hữu vốn không có trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của κεφαλή trong phép so sánh chồng-vợ và Đấng Mê-si-a–hội thánh
  choice: Giữ ẩn dụ “đầu” trong chính văn.
  alternative: Có thể được giải thích là “nguồn”, “người lãnh đạo” hoặc “người có thẩm quyền”.
  rationale: Từ này là đối tượng của nhiều cách giải thích. Giữ nguyên ẩn dụ giúp bảo toàn sự đa nghĩa và căng thẳng thần học của nguyên văn thay vì quyết định thay cho người đọc.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ngữ cảnh vẫn làm nổi bật chức danh của Chúa Giê-su; cách dịch “Đấng Mê-si-a” truyền đạt nội dung của tước hiệu thay vì chỉ phiên âm.
- issue: Quan hệ giữa Đấng Mê-si-a và “thân thể”
  choice: Dịch sát “Đấng Cứu Rỗi của thân thể”.
  alternative: Đấng Cứu Rỗi của thân thể Ngài / Đấng cứu hội thánh là thân thể Ngài
  rationale: Nguyên văn không có đại từ sở hữu và vẫn duy trì ẩn dụ “thân thể”; không nên diễn giải thêm trong chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “người chồng/người vợ” để làm rõ quan hệ hôn nhân; giữ các ẩn dụ “đầu” và “thân thể”. Cấu trúc “chính Ngài là” truyền đạt sự nhấn mạnh của αὐτός bằng tiếng Việt tự nhiên.
