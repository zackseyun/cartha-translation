reference: Ephesians 5:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: vi
  text: Vì lý do đó[a], người đàn ông sẽ lìa cha mẹ và gắn bó với vợ mình; hai người sẽ trở nên một thịt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì điều này.” Cụm từ Hy Lạp ἀντὶ τούτου ở đây được dùng như một liên từ chỉ nguyên nhân trong lời trích dẫn Sáng Thế Ký.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: Vì lý do đó
  rationale: Trong lời trích dẫn Sáng Thế Ký 2:24, cụm từ này đóng vai trò liên kết nêu nguyên nhân hoặc căn cứ, chứ không diễn tả sự thay thế theo nghĩa đen. Cách dịch này tự nhiên và phù hợp với mạch văn tiếng Việt.
- source_word: καταλείψει
  choice: sẽ lìa
  rationale: “Lìa” diễn tả việc rời cha mẹ để lập nên sự kết hợp hôn nhân mới, đồng thời giữ sắc thái trang trọng của lời trích dẫn mà không hàm ý ruồng bỏ.
- source_word: ἄνθρωπος
  choice: người đàn ông
  rationale: Dù từ này có thể chỉ con người nói chung, ở đây nó chỉ người chồng trong cặp hôn nhân nam–nữ và đi cùng cụm “vợ mình”.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: cha mẹ
  rationale: Tiếng Việt tự nhiên gộp cặp danh từ thành “cha mẹ”; sở hữu được hiểu theo chủ ngữ nên không cần lặp “của mình”.
- source_word: προσκολληθήσεται
  choice: gắn bó với
  rationale: Cách dịch này truyền đạt sự kết hợp bền chặt với người vợ. Cấu trúc chủ động là tự nhiên trong tiếng Việt mà vẫn giữ ý nghĩa quan hệ của dạng Hy Lạp.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: vợ mình
  rationale: Ngữ cảnh hôn nhân xác định γυνή mang nghĩa “vợ”; “mình” quy chiếu tự nhiên về người đàn ông.
- source_word: ἔσονται οἱ δύο
  choice: hai người sẽ trở nên
  rationale: Động từ Hy Lạp theo nghĩa đen là “sẽ là”, nhưng tiếng Việt dùng “trở nên” tự nhiên hơn để diễn tả kết quả của sự kết hợp; “hai người” giữ rõ οἱ δύο.
- source_word: εἰς σάρκα μίαν
  choice: một thịt
  rationale: Giữ nguyên hình ảnh Kinh Thánh về sự hiệp nhất hôn nhân và không giản lược thành “một thân thể”.
theological_decisions:
- issue: Ngôn ngữ chỉ giới tính trong lời trích dẫn về hôn nhân
  choice: người đàn ông … vợ mình
  alternative: một người … người phối ngẫu của mình
  rationale: Bản Hy Lạp trình bày cặp nam–nữ trong lời trích Sáng Thế Ký 2:24; bản dịch giữ cách diễn đạt có giới tính thay vì trung tính hóa.
- issue: Cách dịch σάρξ trong εἰς σάρκα μίαν
  choice: một thịt
  alternative: một thân thể
  rationale: Ở đây σάρξ thuộc ngôn ngữ về sự hiệp nhất hôn nhân trong Sáng Thế Ký, không phải ẩn dụ về bản tính tội lỗi. “Một thịt” giữ hình ảnh và sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lìa” để giữ âm hưởng của lời trích dẫn Kinh Thánh, “gắn bó” để diễn đạt tự nhiên sự kết hợp bền chặt, và giữ thành ngữ thần học “một thịt”.
