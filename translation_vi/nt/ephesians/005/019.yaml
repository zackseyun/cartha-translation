source:
  edition: SBLGNT
  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: vi
  text: Hãy dùng các thi thiên, thánh ca và bài hát thuộc linh[a] mà nói với nhau; hãy ca hát và hết lòng ngợi ca Chúa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “giữa anh chị em” hoặc “cho chính mình”; đại từ phản thân Hy Lạp ở đây thường được hiểu theo nghĩa tương hỗ: “với nhau.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hát ngợi ca” hoặc “tạo nên giai điệu”; từ Hy Lạp có thể chỉ việc hát lời ca ngợi hoặc tạo nên giai điệu, nhưng không nhất thiết nói rõ có nhạc cụ đi kèm.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: hãy nói
  rationale: Chuyển phân từ theo chức năng khuyên bảo trong mạch văn, đồng thời giữ nghĩa rộng của động từ là nói.
- source_word: ἑαυτοῖς
  choice: với nhau
  rationale: Đại từ phản thân số nhiều thường mang nghĩa tương hỗ trong ngữ cảnh cộng đồng; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ψαλμοῖς
  choice: các thi thiên
  rationale: Giữ thuật ngữ quen thuộc, không giới hạn dứt khoát vào riêng các Thi Thiên chính điển.
- source_word: ὕμνοις
  choice: thánh ca
  rationale: Tương đương tự nhiên và trang trọng, đồng thời duy trì sự phân biệt với thi thiên và bài hát.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: những bài hát thuộc linh
  rationale: Phản ánh trực tiếp tính từ πνευματικαῖς mà không khẳng định mạnh hơn rằng các bài hát được Đức Thánh Linh soi dẫn.
- source_word: ᾄδοντες
  choice: hãy ca hát
  rationale: Diễn đạt rõ hành động hát và giữ quan hệ song song với phân từ kế tiếp.
- source_word: ψάλλοντες
  choice: dâng khúc ngợi ca
  rationale: Truyền đạt sắc thái âm nhạc và ca ngợi trong cách nói Việt tự nhiên, nhưng không quy định có hay không có nhạc cụ.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: hết lòng
  rationale: Cách nói tự nhiên trong tiếng Việt để diễn đạt phương diện nội tâm và sự chân thành của cụm cách ba, dù nghĩa sát chữ là 'bằng/trong lòng anh chị em'.
- source_word: τῷ κυρίῳ
  choice: lên Chúa
  rationale: Diễn tả hướng và đối tượng của việc ca hát, ngợi ca; giữ nguyên danh xưng 'Chúa' mà không xác định thêm nhân vật.
theological_decisions:
- issue: Ý nghĩa của ψάλλοντες đối với việc thực hành âm nhạc
  choice: Dịch là 'dâng khúc ngợi ca', không nói rõ có nhạc cụ.
  alternative: Dịch là 'tấu nhạc', 'gảy đàn' hoặc chỉ là 'hát ngợi ca'.
  rationale: Trong lịch sử từ này có thể liên quan đến việc gảy dây, nhưng cách dùng thời Tân Ước ở đây không bắt buộc phải hiểu là có nhạc cụ. Bản dịch không áp đặt lập trường hệ phái về nhạc cụ trong sự thờ phượng.
- issue: Đối tượng được gọi là κύριος
  choice: Giữ là 'Chúa'.
  alternative: Nêu rõ là 'Chúa Giê-su' hoặc 'Đức Chúa Trời'.
  rationale: Ngữ cảnh có thể hỗ trợ việc hiểu là Đấng Christ, nhưng chính câu này chỉ dùng κύριος; vì vậy không thêm sự xác định mà nguyên văn không nêu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thi thiên, thánh ca, những bài hát thuộc linh” để giữ cấu trúc ba vế. “Hết lòng” tự nhiên hơn lối dịch sát “bằng lòng của anh chị em”; các chú thích bảo tồn những điểm mơ hồ từ vựng quan trọng.
