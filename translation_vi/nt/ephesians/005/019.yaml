    rationale: Cụm này làm ψάλλοντες thành một danh từ “khúc ngợi ca”, trong khi nguyên văn có hai phân từ song song, và “hết lòng” chủ yếu bổ nghĩa cho vế thứ hai. Cần một cấu trúc trong đó việc ca hát và ngợi ca cùng được thực hiện bằng/từ tấm lòng và hướng về Chúa.
