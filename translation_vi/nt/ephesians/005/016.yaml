  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: vi
  text: hãy tận dụng thời cơ[a], vì những ngày này là xấu xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chuộc lại thời gian”; thành ngữ Hy Lạp còn có thể mang nghĩa “hãy mua lấy cơ hội”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: hãy tận dụng
  rationale: Phân từ này tiếp nối sắc thái khuyên bảo của mệnh lệnh trong ngữ cảnh. Nghĩa đen gợi hình ảnh mua lấy hoặc chuộc lại, nhưng ở đây thành ngữ diễn tả việc tận dụng trọn vẹn thời cơ.
- source_word: τὸν καιρόν
  choice: thời cơ
  rationale: καιρός thường chỉ thời điểm thích hợp hay cơ hội, không đơn thuần là thời gian nói chung. “Thời cơ” diễn đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Từ này nêu lý do cho lời khuyên và được diễn đạt tự nhiên bằng “vì”.
- source_word: αἱ ἡμέραι
  choice: những ngày này
  rationale: Giữ hình ảnh số nhiều “những ngày”, đồng thời thêm từ chỉ định phù hợp với cách nói tiếng Việt để chỉ hoàn cảnh hiện tại.
- source_word: πονηραί
  choice: xấu xa
  rationale: Giữ chiều kích luân lý của πονηρός và cách nhân cách hóa “những ngày”, thay vì làm nhẹ nghĩa thành chỉ khó khăn hay bất ổn.
theological_decisions:
- issue: Có thể hiểu ἐξαγοραζόμενοι theo nghĩa cứu chuộc mang tính cứu rỗi
  choice: Lời khuyên hãy tận dụng thời cơ
  alternative: chuộc lại thời gian; mua lấy cơ hội
  rationale: Trong ngữ cảnh khuyên dạy này, cụm từ nói đến việc sử dụng trọn vẹn cơ hội hiện có, không nêu rõ hành động cứu chuộc theo nghĩa cứu rỗi. Chú thích bảo tồn hình ảnh mua hoặc chuộc của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được diễn đạt như một lời khuyên trực tiếp để phù hợp với lực ngữ pháp của phân từ phụ thuộc vào mệnh lệnh trong văn cảnh trước; giữ nguyên căng thẳng giữa nghĩa thành ngữ và hình ảnh mua/chuộc qua chú thích.
