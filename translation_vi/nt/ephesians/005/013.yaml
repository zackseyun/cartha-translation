  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: vi
  text: Nhưng mọi sự[a], khi bị ánh sáng phơi bày, đều trở nên thấy rõ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi sự bị ánh sáng phơi bày đều trở nên thấy rõ.” Phân từ và động từ Hy Lạp có thể được hiểu theo hai cách gần nhau, nhấn mạnh либо hành động phơi bày hoặc kết quả là trở nên thấy rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: mọi sự
  rationale: Cụm trung tính số nhiều có mạo từ mang phạm vi rộng và bao quát; “mọi sự” giữ được sắc thái trang trọng và hình thức của nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một bước chuyển có tính tương phản nhẹ với lời nói về những việc kín giấu ở câu trước.
- source_word: ἐλεγχόμενα
  choice: khi bị ... phơi bày
  rationale: Trong ngữ cảnh ánh sáng, ἐλέγχω thiên về việc vạch rõ hoặc làm lộ ra hơn là chỉ quở trách; cách dịch này giữ thể bị động và diễn đạt tự nhiên quan hệ với động từ chính.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: bị ánh sáng
  rationale: ὑπό với sở hữu cách chỉ tác nhân; “ánh sáng” giữ nguyên hình ảnh và không tự ý xác định cụ thể đối tượng quy chiếu.
- source_word: φανεροῦται
  choice: đều trở nên rõ ràng
  rationale: φανερόω ở dạng bị động có thể chỉ việc trở nên hiển hiện hoặc được làm cho thấy rõ. “Trở nên rõ ràng” phù hợp hình ảnh ánh sáng và tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của “ánh sáng” trong ngữ cảnh
  choice: Giữ nguyên “ánh sáng” mà không xác định đối tượng quy chiếu ngay trong câu.
  alternative: Đấng Christ; Tin Mừng; chân lý đạo đức; lời chứng của cộng đồng tín hữu.
  rationale: Ngữ cảnh gọi các tín hữu là ánh sáng trong Chúa và nói đến việc vạch trần các công việc tối tăm, nhưng chính câu này không thu hẹp “ánh sáng” vào một cách hiểu duy nhất.
- issue: Quan hệ cú pháp giữa phân từ ἐλεγχόμενα và động từ φανεροῦται
  choice: Hiểu là “mọi sự, khi bị ánh sáng phơi bày, đều trở nên rõ ràng.”
  alternative: “Mọi sự bị ánh sáng phơi bày đều trở nên rõ ràng.”
  rationale: Hai cách phân đoạn rất gần nhau và đều khả dĩ; bản chính làm nổi bật hoàn cảnh bị phơi bày, còn chú thích bảo tồn cách gắn phân từ trực tiếp hơn với “mọi sự”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Phơi bày” chuyển tải sức mạnh vạch rõ của ἐλέγχω trong hình ảnh ánh sáng; “trở nên rõ ràng” tránh lối diễn đạt quá cổ như “hiển lộ.” Dấu phẩy cuối câu được giữ vì câu 13 nối trực tiếp về cú pháp và ý tưởng với câu 14.
