id: EPH.5.6
reference: Ephesians 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: vi
  text: Đừng để ai dùng những lời sáo rỗng mà lừa dối anh chị em, vì những điều ấy mà cơn thịnh nộ của Đức Chúa Trời giáng trên những kẻ không vâng phục[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “những con trai của sự không vâng phục,” một cách nói thành ngữ chỉ những người được đặc trưng bởi sự không vâng phục.'
    reason: Giải thích thành ngữ và bảo lưu trong chú thích hình thức giống đực số nhiều của nguyên văn, với ký hiệu được neo vào cụm dịch tương ứng.
lexical_decisions:
- source_word: Μηδεὶς ... ἀπατάτω
  choice: Đừng để ai ... lừa dối anh chị em
  rationale: Diễn đạt tự nhiên mệnh lệnh cấm ở ngôi thứ ba trong tiếng Việt, đồng thời giữ rõ đối tượng số nhiều ὑμᾶς.
- source_word: κενοῖς λόγοις
  choice: dùng những lời sáo rỗng
  rationale: Giữ hình ảnh về những lời thiếu nội dung và giá trị; “sáo rỗng” tự nhiên hơn “trống rỗng” khi nói về lời lẽ trong tiếng Việt hiện đại.
- source_word: διὰ ταῦτα
  choice: vì chính bởi những điều ấy
  rationale: Thể hiện quan hệ nguyên nhân của διά với đối cách; “chính” nhấn mạnh sự quy chiếu về những hành vi vừa được kể trong văn cảnh mà không giải nghĩa quá mức.
- source_word: ἔρχεται
  choice: giáng trên
  rationale: Trong kết hợp với cơn thịnh nộ và giới từ ἐπί, “giáng trên” là cách nói tự nhiên, trang trọng, vẫn giữ lực hiện tại có thể mang nghĩa đang đến hoặc chắc chắn xảy đến.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: cơn thịnh nộ của Đức Chúa Trời
  rationale: Giữ nguyên sắc thái mạnh của ὀργή, không làm nhẹ thành khái niệm chung hơn là “sự phán xét”.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: những kẻ không vâng phục
  rationale: Đây là thành ngữ Semit chỉ những người có đặc tính là bất tuân. Tiếng Việt không dùng tự nhiên cấu trúc “các con trai của sự không vâng phục”; cách dịch theo nghĩa truyền đạt đúng đối tượng con người mà không hàm ý chỉ giới nam.
theological_decisions:
- issue: Cách dịch ngôn ngữ về cơn giận của Đức Chúa Trời
  choice: cơn thịnh nộ của Đức Chúa Trời
  alternative: sự phán xét của Đức Chúa Trời
  rationale: Nguyên văn dùng ὀργή, nên giữ ý niệm cơn thịnh nộ thay vì khái quát hoặc làm nhẹ thành “sự phán xét”.
- issue: Cách dịch thành ngữ τοὺς υἱοὺς τῆς ἀπειθείας
  choice: những kẻ không vâng phục
  alternative: những con cái của sự không vâng phục
  rationale: Cụm Hy Lạp mô tả những người mang đặc tính bất tuân. Bản dịch chính ưu tiên thành ngữ tự nhiên của tiếng Việt; chú thích bảo lưu hình thức nguyên văn để người đọc thấy sắc thái nguồn.
- issue: Lực thời-thể của ἔρχεται
  choice: giáng trên
  alternative: sẽ giáng trên
  rationale: Không thêm dấu hiệu tương lai vốn không hiện diện trong động từ hiện tại Hy Lạp, nhờ đó bảo lưu khả năng hiểu là thực tại đang đến, thường xuyên, hoặc chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς theo văn cảnh cộng đồng; dùng “Đức Chúa Trời” nhất quán cho θεός. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
