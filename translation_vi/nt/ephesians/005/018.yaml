source:
  edition: SBLGNT
  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: vi
  text: Và đừng say rượu, vì trong đó có sự phóng đãng; nhưng hãy được đầy dẫy Thánh Linh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hãy được đầy dẫy trong Thánh Linh”; một số người hiểu πνεύματι theo nghĩa tổng quát là “tinh thần.”'
    reason: 'Bảo tồn sự mơ hồ của ἐν πνεύματι: giới từ có thể được hiểu theo nghĩa phạm vi, và πνεῦμα có thể được hiểu không phải là Thánh Linh.'
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: say rượu
  rationale: Mệnh lệnh hiện tại đi với μή tạo thành lời cấm. “Đừng say rượu” là cách nói tự nhiên trong tiếng Việt, bao hàm việc rơi vào trạng thái say mà không cần diễn giải quá mức sắc thái thể.
- source_word: οἴνῳ
  choice: rượu
  rationale: Danh từ ở cách cho biết chất gây say; trong tiếng Việt, kết cấu “say rượu” tự nhiên và truyền đạt đúng quan hệ này mà không cần dịch riêng giới từ.
- source_word: ἐν ᾧ
  choice: trong đó
  rationale: Giữ liên kết tương đối với “rượu” theo hình thức của bản Hy Lạp và không âm thầm đổi thành một quan hệ nhân quả cụ thể hơn như “dẫn đến”.
- source_word: ἀσωτία
  choice: sự phóng đãng
  rationale: Từ này chỉ lối sống buông thả, thiếu kiềm chế và hoang phí. “Sự phóng đãng” giữ được sức nặng luân lý, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: πληροῦσθε
  choice: hãy được đầy dẫy
  rationale: Giữ hình thức bị động của mệnh lệnh Hy Lạp. “Đầy dẫy” diễn tả trạng thái được làm cho đầy, còn sắc thái tiếp diễn của thì hiện tại được để hàm ẩn như thường lệ trong tiếng Việt.
- source_word: ἐν πνεύματι
  choice: Thánh Linh
  rationale: Trong kết cấu tiếng Việt “được đầy dẫy Thánh Linh,” Thánh Linh được hiểu tự nhiên là nội dung hoặc nguồn của sự đầy dẫy. Cách dịch chính nhận πνεύματι là Thánh Linh, nhưng chú thích bảo tồn khả năng hiểu theo phạm vi “trong Thánh Linh” hoặc theo nghĩa tổng quát hơn là “tâm linh”.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεύματι
  choice: Thánh Linh
  alternative: thần linh/tâm linh; hoặc “trong Thánh Linh”
  rationale: Văn cảnh các lời khuyên của Phao-lô khiến cách hiểu chỉ Thánh Linh có sức thuyết phục hơn, dù danh từ Hy Lạp không có mạo từ. Viết hoa thể hiện lựa chọn dịch thuật này, còn chú thích giữ lại sự mơ hồ thật sự của nguyên văn.
- issue: Quan hệ được biểu thị bởi ἐν trong ἐν πνεύματι
  choice: đầy dẫy Thánh Linh
  alternative: được đầy dẫy trong Thánh Linh
  rationale: Tiếng Hy Lạp có thể gợi nội dung, phương tiện hoặc phạm vi. Bản dịch chính dùng cách diễn đạt tự nhiên nhất trong tiếng Việt nhưng không thêm tác nhân hoặc cơ chế thần học; cách hiểu theo phạm vi được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dấu chấm phẩy làm rõ sự tương phản giữa hai mệnh lệnh. “Phóng đãng” giữ sức nặng đạo đức của nguyên văn; “đầy dẫy” là cách diễn đạt quen thuộc nhưng vẫn dễ hiểu. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
