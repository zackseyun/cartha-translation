translation:
  language: vi
  text: thuận phục nhau trong sự kính sợ Đấng Mê-si[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong lòng tôn kính Đấng Mê-si” hoặc “trong niềm kính úy trước Đấng Mê-si.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp là Χριστός; ở đây dịch là “Đấng Mê-si” vì từ này được hiểu theo chức năng tước hiệu. Cách gọi truyền thống là “Đấng Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: thuận phục
  rationale: Phân từ hiện tại này tiếp nối chuỗi phân từ trong mạch văn trước. Tiếng Việt không biến đổi hình thái phân từ như tiếng Hy Lạp, nên “thuận phục” giữ được sự liên kết mà không tự ý thêm đại từ phản thân hay biến câu thành một mệnh lệnh độc lập.
- source_word: ἀλλήλοις
  choice: nhau
  rationale: Đại từ tương hỗ ở cách cho được diễn đạt tự nhiên và chính xác bằng “nhau” trong tiếng Việt.
- source_word: ἐν
  choice: trong
  rationale: “Trong” giữ sát ý về phạm vi hoặc cách thức của giới từ ἐν, đồng thời vẫn tự nhiên trong cụm “trong sự kính sợ”.
- source_word: φόβῳ
  choice: sự kính sợ
  rationale: φόβος có thể mang nghĩa sợ hãi, kính sợ hoặc tôn kính. “Kính sợ” bảo toàn sắc thái mạnh của từ nguồn trong bối cảnh hướng về Đấng Mê-si, không làm nhẹ thành sự lễ phép đơn thuần.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây vẫn có chức năng tước hiệu. “Đấng Mê-si” chuyển dịch ý nghĩa của tước hiệu thay vì chỉ phiên âm truyền thống; phương án “Đấng Christ” được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của cụm “sự kính sợ Đấng Mê-si”
  choice: Sự kính sợ hướng về Đấng Mê-si
  alternative: Sự kính sợ do Đấng Mê-si gây nên; lòng tôn kính đối với Đấng Christ
  rationale: Cách hiểu sở hữu cách theo nghĩa đối tượng là trực tiếp nhất trong ngữ cảnh. “Kính sợ” vẫn giữ sức nặng và sự căng thẳng thần học của φόβος, nhưng không buộc người đọc hiểu đó là nỗi kinh hãi co rúm.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm này, tước hiệu Χριστός vẫn đủ rõ để dịch theo nghĩa “Đấng Mê-si”. Chú thích bảo lưu cách gọi truyền thống “Đấng Christ”.
- issue: Quan hệ cú pháp với mạch văn trước
  choice: Giữ dạng không đánh dấu mệnh lệnh bằng “thuận phục”
  alternative: Hãy thuận phục nhau; đang thuận phục nhau
  rationale: ὑποτασσόμενοι là phân từ, có quan hệ với lời truyền dạy và chuỗi phân từ ở phần trước. Không thêm “hãy” giúp tránh biến nó thành một mệnh lệnh độc lập, còn cách diễn đạt tiếng Việt vẫn gọn và dễ hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thuận phục” phù hợp với ngữ cảnh quan hệ hỗ tương hơn “phục tùng”, vốn dễ gợi sắc thái cưỡng chế hoặc cơ cấu cấp bậc. Câu được giữ như một mệnh đề phụ thuộc về mặt mạch văn, tương ứng với phân từ Hy Lạp.
