revisions:
- from: Vì chẳng ai từng ghét chính thân thể mình, nhưng nuôi dưỡng và chăm sóc nó, cũng như Đấng Christ chăm sóc Hội Thánh.
  to: Vì chẳng ai từng ghét chính thân thể mình, nhưng nuôi dưỡng và chăm sóc nó, cũng như Đấng Mê-si-a[a] cũng nuôi dưỡng và chăm sóc Hội Thánh.
  rationale: Bản sửa lặp lại đầy đủ hai động từ mà nguyên văn tỉnh lược ở mệnh đề cuối, nhờ đó giữ trọn nội dung của phép so sánh. «Đấng Mê-si-a» dịch nghĩa chức danh Χριστός theo hướng tương đương tối ưu; chú thích giữ cách gọi truyền thống để hỗ trợ người đọc. Không thay đổi ý nghĩa của câu.
  reviewer_model: gpt-5.6-terra
