id: EPH.5.29
reference: Ephesians 5:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: vi
  text: Vì chẳng ai từng ghét chính thân thể mình, nhưng nuôi dưỡng và chăm sóc nó, cũng như Đấng Mê-si-a[a] cũng nuôi dưỡng và chăm sóc Hội Thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc «Đấng Christ». Tước hiệu Hy Lạp Christos có nghĩa là «Đấng Mê-si-a»; «Đấng Christ» là cách gọi quen thuộc trong nhiều bản dịch tiếng Việt.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: Vì chẳng ai từng
  rationale: Giữ chức năng giải thích của γάρ và ý nghĩa khái quát của οὐδεὶς...ποτε bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: chính thân thể mình
  rationale: Trong ngữ cảnh này, σάρξ chỉ con người về mặt thể chất; “thân thể” tự nhiên và rõ nghĩa hơn “xác thịt”, đồng thời tránh hàm ý về bản tính tội lỗi.
- source_word: ἐμίσησεν
  choice: ghét
  rationale: Tương đương trực tiếp, thông dụng của μισέω.
- source_word: ἐκτρέφει
  choice: nuôi dưỡng
  rationale: Diễn đạt việc cung cấp thức ăn và chăm lo để thân thể được duy trì, phù hợp với ẩn dụ thân thể.
- source_word: θάλπει
  choice: chăm sóc
  rationale: Ở đây động từ chỉ sự chăm nom ân cần; “chăm sóc” tự nhiên trong tiếng Việt và kết hợp rõ ràng với “nuôi dưỡng”.
- source_word: καθὼς καὶ
  choice: cũng như
  rationale: Giữ quan hệ so sánh và sắc thái bổ sung của καί.
- source_word: ὁ Χριστὸς
  choice: Đấng Christ
  rationale: Cách gọi đã được chuẩn hóa và dễ nhận biết trong tiếng Việt Cơ Đốc; “Đấng” giúp thể hiện chức danh của Χριστός.
- source_word: τὴν ἐκκλησίαν
  choice: Hội Thánh
  rationale: Cách dịch trang trọng, thông dụng trong tiếng Việt cho cộng đồng tín hữu được nói đến ở đây.
theological_decisions:
- issue: Ý nghĩa của σάρξ
  choice: thân thể
  alternative: xác thịt
  rationale: Ngữ cảnh nói đến bản thân về mặt thể chất trong phép so sánh hôn nhân–thân thể, không nói đến “xác thịt” theo nghĩa khuynh hướng tội lỗi.
- issue: Cách dịch Χριστός
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: Giữ rõ tính chất chức danh bằng “Đấng”, đồng thời dùng hình thức quen thuộc trong tiếng Việt; không biến Χριστός thành tên riêng thuần túy.
- issue: Động từ được tỉnh lược ở mệnh đề cuối
  choice: lặp lại “chăm sóc”
  alternative: lặp lại cả “nuôi dưỡng và chăm sóc”
  rationale: Nguyên văn tỉnh lược động từ trước “Hội Thánh”. Bổ sung “chăm sóc” tạo câu tiếng Việt tự nhiên và bao quát hành động ân cần vừa nêu mà không làm câu nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chẳng ai từng” để câu gọn tự nhiên; dùng “chính thân thể mình” thay cho cách nói dễ gây hiểu sai là “xác thịt mình”.
