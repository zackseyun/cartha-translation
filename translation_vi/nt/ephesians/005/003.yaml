  to: Nhưng sự vô luân tình dục, mọi điều ô uế hay lòng tham[b] cũng đừng được nhắc đến giữa anh chị em[a], vì những điều ấy không xứng hợp với dân thánh của Đức Chúa Trời[c].
  rationale: Sửa tối thiểu để phục hồi lực của καθὼς πρέπει mà không thêm quan hệ nhân quả, đồng thời làm câu tiếng Việt gọn và tự nhiên hơn. Chú thích a được thu về một phương án dịch trung tính, sát nguyên văn hơn; các thuật ngữ và phạm vi nghĩa chủ yếu được giữ nguyên.
