id: EPH.5.3
reference: Ephesians 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: vi
  text: Nhưng sự vô luân tình dục, mọi điều ô uế hay lòng tham[b] cũng đừng được nhắc đến giữa anh chị em[a], vì những điều ấy không xứng hợp với dân thánh của Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cũng đừng được gọi tên giữa anh chị em.”'
    reason: Cụm μηδὲ ὀνομαζέσθω nhấn mạnh rằng những điều này không được ngay cả bị gọi tên hoặc nhắc đến trong cộng đồng.
  - marker: b
    text: 'Cũng có thể dịch: “lòng tham muốn.”'
    reason: Nêu một cách diễn đạt khác cho πλεονεξία mà không giới hạn từ này vào ham muốn tình dục.
  - marker: c
    text: “Dân thánh” ở đây là các tín hữu được biệt riêng cho Đức Chúa Trời, không phải một tầng lớp được phong thánh về sau.
    reason: Giải thích cách Phao-lô dùng ἅγιοι và ngăn ngừa sự hiểu lầm do khái niệm phong thánh hình thành về sau.
lexical_decisions:
- source_word: Πορνεία
  choice: sự vô luân về tình dục
  rationale: Từ này chỉ rộng đến các hành vi tình dục trái với chuẩn mực đạo đức, không chỉ riêng quan hệ trước hôn nhân hay ngoại tình. Cách dịch này rõ nghĩa trong tiếng Việt hiện đại và tránh thu hẹp phạm vi của từ Hy Lạp.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ này đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lời khuyên ngay trước đó.
- source_word: ἀκαθαρσία πᾶσα
  choice: mọi điều ô uế
  rationale: Giữ được ý bao quát của πᾶσα và sắc thái đạo đức của ἀκαθαρσία, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἢ
  choice: hoặc
  rationale: Phản ánh đúng chức năng phân cách của liên từ Hy Lạp giữa các điều bị cấm.
- source_word: πλεονεξία
  choice: lòng tham
  rationale: Diễn tả ham muốn chiếm hữu nhiều hơn, thường bao hàm tính vụ lợi và bóc lột. Không thu hẹp từ này thành dục vọng tình dục chỉ vì văn cảnh đề cập đến luân lý tình dục.
- source_word: μηδὲ ὀνομαζέσθω
  choice: thậm chí cũng không được nhắc đến
  rationale: Truyền đạt mệnh lệnh cấm mạnh và giữ điểm nhấn 'thậm chí cũng không'; tự nhiên hơn lối dịch sát chữ 'không được gọi tên' trong tiếng Việt.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Diễn tả bình diện cộng đồng của cụm từ, chỉ những điều không nên hiện diện hoặc được nói đến trong cộng đồng tín hữu.
- source_word: καθὼς πρέπει
  choice: vì như thế mới xứng hợp
  rationale: Thể hiện tiêu chuẩn về điều thích đáng trong đời sống đạo đức; từ 'vì' làm rõ quan hệ giải thích vốn tự nhiên trong mệnh đề Hy Lạp.
- source_word: ἁγίοις
  choice: dân thánh của Đức Chúa Trời
  rationale: Chỉ toàn thể những người được biệt riêng cho Đức Chúa Trời. Cách dịch này dễ hiểu hơn 'các thánh đồ' đối với độc giả hiện đại và không gợi ý một tầng lớp được phong thánh về sau.
theological_decisions:
- issue: Nghĩa của πλεονεξία trong danh sách tật xấu có nội dung tình dục
  choice: Dịch theo nghĩa rộng là 'lòng tham'.
  alternative: lòng tham muốn; dục vọng tham lam
  rationale: Dù văn cảnh gần nói về đạo đức tình dục, từ Hy Lạp có phạm vi rộng hơn và thường chỉ ham muốn chiếm hữu. Bản dịch không thu hẹp nghĩa khi văn bản không buộc phải làm vậy.
- issue: Đối tượng được gọi là ἁγίοις
  choice: Dịch là 'dân thánh của Đức Chúa Trời', chỉ các tín hữu nói chung.
  alternative: các thánh đồ; những người thánh
  rationale: Trong cách dùng của Phao-lô, từ này nói đến cộng đồng những người được biệt riêng cho Đức Chúa Trời, chứ không phải một lớp người được giáo hội phong thánh về sau.
- issue: Phạm vi của lệnh 'không được nhắc đến'
  choice: Giữ cách nói mạnh của nguyên văn nhưng không diễn giải rằng tuyệt đối không bao giờ được bàn đến các tội này.
  alternative: không được tồn tại giữa anh chị em
  rationale: ὀνομαζέσθω theo nghĩa trực tiếp liên quan đến việc gọi tên hay nhắc đến, nhưng trong văn cảnh có thể ngụ ý rằng các điều ấy không được trở thành đặc điểm tai tiếng của cộng đồng. Bản chính giữ nguyên hình ảnh ngôn ngữ và ghi nhận độ rộng ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ngôi thứ hai theo nghĩa cộng đồng một cách bao quát; dùng “dân thánh của Đức Chúa Trời” thay cho thuật ngữ truyền thống “các thánh đồ” nhằm làm rõ nghĩa ngay trong câu.
