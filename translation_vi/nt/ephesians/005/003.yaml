review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng ba hạng mục Πορνεία, ἀκαθαρσία πᾶσα và πλεονεξία, cũng như tính cộng đồng của ἐν ὑμῖν. Tuy nhiên, “vì như thế mới xứng hợp” làm thay đổi nhẹ quan hệ diễn ngôn: καθὼς πρέπει nêu chuẩn mực “như/điều xứng hợp với dân thánh,” không phải lý do theo nghĩa “vì như thế mới.”'
  naturalness: Câu có thể tự nhiên và trực tiếp hơn bằng cách dùng “không xứng hợp với” thay cho cấu trúc “vì như thế mới xứng hợp.” “Sự vô luân tình dục” là cách nói hiện đại, rõ nghĩa và gọn hơn “sự vô luân về tình dục.”
  terminology: “Lòng tham” phản ánh tốt πλεονεξία theo nghĩa rộng. “Dân thánh của Đức Chúa Trời” truyền đạt đúng ἁγίοις trong văn mạch Phao-lô; chú thích c làm rõ mà không áp đặt cách hiểu giáo phái.
  issues:
  - severity: medium
    issue: “vì như thế mới xứng hợp” thêm sắc thái nhân quả và đảo cách diễn đạt của καθὼς πρέπει.
    rationale: Nguyên văn kết luận rằng những điều vừa nêu không phù hợp với những người thánh, chứ không nói “vì như thế mới” là lý do cho mệnh lệnh. Dùng “vì những điều ấy không xứng hợp với...” vừa tự nhiên vừa giữ ý chuẩn mực.
  - severity: low
    issue: Chú thích a diễn giải “mang tiếng là có” vượt quá mức cần thiết của một chú thích thay thế từ vựng.
    rationale: ὀνομαζέσθω có thể hàm ý các điều ấy không được là thực trạng tai tiếng trong cộng đồng, nhưng chú thích nên trước hết nêu phương án dịch sát và trung tính, không biến một hàm ý khả dĩ thành cách dịch thay thế.
