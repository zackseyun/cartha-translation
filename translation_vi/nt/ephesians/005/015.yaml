base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: vi
  text: 'Vậy, hãy hết sức chú ý đến cách anh chị em sống: đừng sống như người thiếu khôn ngoan, nhưng như người khôn ngoan—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: hãy chú ý
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều, kêu gọi cả cộng đồng liên tục lưu tâm đến cách sống của mình.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lời khuyên và lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀκριβῶς πῶς
  choice: hết sức ... đến cách
  rationale: Diễn đạt sự chú ý kỹ lưỡng mà ἀκριβῶς nhấn mạnh và giữ πῶς như lời dẫn vào cách thức sống.
- source_word: περιπατεῖτε
  choice: anh chị em sống
  rationale: περιπατέω theo nghĩa bóng chỉ nếp sống hay cách cư xử. Dịch trực tiếp là “bước đi” trong câu này dễ gợi hoạt động đi bộ hơn là cách sống đối với độc giả tiếng Việt phổ thông.
- source_word: μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί
  choice: đừng sống như người thiếu khôn ngoan, nhưng như người khôn ngoan
  rationale: Giữ cấu trúc đối lập với ὡς và phân biệt ἄσοφος là thiếu khôn ngoan, không nhất thiết mang sắc thái nặng của “ngu dại”. Danh từ “người” truyền đạt tự nhiên tính đại diện chung của các tính từ số nhiều.
theological_decisions:
- issue: Phạm vi giới tính của ἄσοφοι / σοφοί
  choice: người thiếu khôn ngoan ... người khôn ngoan
  alternative: những người nam thiếu khôn ngoan ... những người nam khôn ngoan
  rationale: Các tính từ giống đực số nhiều ở đây có chức năng đại diện và lời khuyên hướng đến toàn thể cộng đồng tín hữu; tiếng Việt không cần đánh dấu giống ngữ pháp, nên “người” vừa chính xác vừa không thêm giới tính sinh học ngoài văn bản.
- issue: Ẩn dụ περιπατέω
  choice: sống
  alternative: bước đi
  rationale: Trong ngữ cảnh đạo đức, động từ chỉ cách sống. Chuyển nghĩa bóng thành “sống” giúp câu rõ ràng trong tiếng Việt hiện đại mà không giải quyết hay thêm một vấn đề thần học nào.
translation_notes:
  register: Văn phong khuyên bảo trang trọng nhưng dễ hiểu. “Anh chị em” thể hiện ngôi thứ hai số nhiều và đối tượng là cả cộng đồng; dấu gạch cuối câu giữ sự tiếp nối cú pháp sang câu 16.
