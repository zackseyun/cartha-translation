language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: vi
  text: 'Vì anh chị em biết rõ điều này: không một người gian dâm, ô uế hay tham lam—là kẻ thờ thần tượng—có phần thừa kế trong vương quốc của Đấng Mê-si-a và Đức Chúa Trời.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: biết rõ điều này
  rationale: Hai động từ biết/nhận biết tạo sắc thái nhấn mạnh. “Biết rõ” diễn đạt tự nhiên sức nhấn ấy trong tiếng Việt mà không lặp vụng về.
- source_word: πόρνος
  choice: người gian dâm
  rationale: Chỉ người có đặc trưng là sự vô luân về tình dục; “gian dâm” là cách diễn đạt trang trọng, dễ hiểu trong văn cảnh đạo đức.
- source_word: ἀκάθαρτος
  choice: người ô uế
  rationale: Giữ được hình ảnh về sự ô uế và nghĩa đạo đức rộng của từ này trong danh sách các thói xấu của Phao-lô.
- source_word: πλεονέκτης
  choice: người tham lam
  rationale: Diễn đạt tự nhiên người bị đặc trưng bởi lòng tham muốn chiếm hữu.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: tức là kẻ thờ thần tượng
  rationale: Cách đọc theo người vừa được nói đến, đặc biệt là người tham lam, phù hợp văn cảnh; tuy nhiên đại từ quan hệ giống trung trong tiếng Hy Lạp vẫn để ngỏ cách hiểu trừu tượng, được ghi ở chú thích.
- source_word: κληρονομίαν
  choice: phần thừa kế
  rationale: Giữ sắc thái giao ước và cánh chung của khái niệm thừa kế, đồng thời tự nhiên sau động từ “có” trong tiếng Việt.
- source_word: βασιλείᾳ
  choice: vương quốc
  rationale: Bao hàm cả lãnh vực cai trị lẫn quyền trị vì và là cách gọi rõ ràng, quen thuộc.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός tại đây hoạt động như một tước hiệu, nên được dịch theo ý nghĩa “Đấng Mê-si-a” thay vì phiên âm.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: của Đấng Mê-si-a và Đức Chúa Trời
  rationale: Giữ nguyên cấu trúc hai danh từ sở hữu phối hợp, không áp đặt một kết luận thần học chuyên biệt vượt quá lời văn Hy Lạp.
theological_decisions:
- issue: Sở chỉ của ὅ ἐστιν εἰδωλολάτρης
  choice: 'Áp dụng cho người vừa được nhắc đến, đặc biệt là người tham lam: “tức là kẻ thờ thần tượng.”'
  alternative: “điều ấy là sự thờ thần tượng,” chủ yếu quy chiếu lòng tham.
  rationale: Đại từ quan hệ giống trung tạo nên sự mơ hồ thật sự. Văn cảnh và Cô-lô-se 3:5 ủng hộ mối liên hệ giữa lòng tham và sự thờ thần tượng; chú thích bảo toàn cách hiểu trừu tượng sát hình thức hơn.
- issue: Ý nghĩa của việc bị loại khỏi phần thừa kế
  choice: 'Dùng lời khẳng định ở hiện tại: “không ... có phần thừa kế.”'
  alternative: “sẽ không được thừa hưởng vương quốc.”
  rationale: Bản Hy Lạp dùng οὐκ ἔχει ở thì hiện tại, vì vậy bản dịch giữ tình trạng hiện tại và không chuyển lời cảnh báo thành một phát biểu chỉ nói về tương lai.
- issue: Quan hệ trong cụm “Đấng Mê-si-a và Đức Chúa Trời”
  choice: 'Dịch thẳng hai sở hữu từ phối hợp: “vương quốc của Đấng Mê-si-a và Đức Chúa Trời.”'
  alternative: Một cách dịch diễn giải nhằm khẳng định rõ một kết luận Kitô học cụ thể từ cấu trúc cú pháp.
  rationale: Cách dịch giữ nguyên lời văn và sự gắn kết chặt chẽ của cụm từ nhưng không buộc câu Hy Lạp phải mang một kết luận cú pháp gây tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Anh chị em” làm rõ ngôi số nhiều bao hàm của động từ Hy Lạp; dấu gạch ngang giúp mệnh đề giải thích được đọc tự nhiên. Thuật ngữ “Đấng Mê-si-a” giữ chức năng tước hiệu của Χριστός.
