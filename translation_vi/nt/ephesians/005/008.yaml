id: EPH.5.8
reference: Ephesians 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦτε γάρ ποτε σκότος, νῦν δὲ φῶς ἐν κυρίῳ· ὡς τέκνα φωτὸς περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: vi
  text: Vì trước kia anh chị em là bóng tối, nhưng bây giờ, trong Chúa, anh chị em là ánh sáng. Hãy bước đi[a] như con cái của ánh sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, diễn ý hơn: “Hãy sống như con cái của ánh sáng.” Tiếng Hy Lạp dùng động từ “bước đi”, một ẩn dụ Phao-lô thường dùng để chỉ nếp sống của một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: anh chị em là
  rationale: Thì vị hoàn thành của εἰμί diễn tả một tình trạng trong quá khứ; trạng từ “trước kia” đã xác định thời gian nên cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích, làm cơ sở cho lời khuyên ở văn cảnh trước.
- source_word: ποτε
  choice: trước kia
  rationale: Diễn đạt rõ tình trạng trước đây và tạo thế tương phản tự nhiên với “bây giờ”.
- source_word: σκότος
  choice: bóng tối
  rationale: 'Giữ nguyên danh từ vị ngữ và sức mạnh của ẩn dụ: câu không chỉ nói họ ở trong bóng tối mà họ từng là bóng tối.'
- source_word: νῦν δὲ
  choice: nhưng bây giờ
  rationale: Thể hiện rõ sự tương phản mạnh giữa tình trạng trước kia và hiện nay.
- source_word: φῶς
  choice: ánh sáng
  rationale: Giữ danh từ vị ngữ mang tính ẩn dụ và ngôn ngữ về căn tính, thay vì làm nhẹ thành “ở trong ánh sáng” hoặc “được soi sáng”.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ cách nói đặc trưng của Phao-lô, có thể chỉ phạm vi hoặc sự hiệp nhất; không thu hẹp nghĩa thành “bởi Chúa” hay “nhờ Chúa”.
- source_word: ὡς
  choice: như
  rationale: Diễn tả cách sống phù hợp với căn tính là con cái của ánh sáng.
- source_word: τέκνα φωτός
  choice: con cái của ánh sáng
  rationale: τέκνα bao gồm cả nam lẫn nữ; cấu trúc “của ánh sáng” giữ được hình ảnh và sắc thái đặc trưng hóa của nguyên văn.
- source_word: περιπατεῖτε
  choice: Hãy bước đi
  rationale: Giữ ẩn dụ đạo đức quen thuộc của Phao-lô về nếp sống, đồng thời chú thích cách diễn ý tự nhiên hơn.
theological_decisions:
- issue: Ngôn ngữ ẩn dụ về căn tính trong “trước kia ... là bóng tối, nhưng bây giờ ... là ánh sáng”
  choice: Giữ nguyên hai ẩn dụ mạnh “là bóng tối” và “là ánh sáng”.
  alternative: “ở trong bóng tối ... ở trong ánh sáng” hoặc “tối tăm ... được soi sáng”
  rationale: Nguyên văn dùng hai danh từ làm vị ngữ, không có giới từ, qua đó nhấn mạnh sự biến đổi về căn tính và tình trạng đạo đức-thuộc linh chứ không chỉ nói đến hoàn cảnh.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” phù hợp với cách dùng κύριος trong Tân Ước và giữ được âm hưởng thần học mà không thu hẹp nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu thị rõ đối tượng số nhiều gồm cả nam lẫn nữ; giữ các ẩn dụ “bóng tối”, “ánh sáng” và “bước đi” của nguyên văn.
