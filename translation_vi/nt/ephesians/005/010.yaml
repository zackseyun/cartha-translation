  text: testing what is pleasing to the Lord;[a]
translation:
  language: vi
  text: hãy xét xem điều gì đẹp lòng Chúa;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy phân định” hoặc “hãy tìm hiểu” điều gì đẹp lòng Chúa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: hãy xét xem
  rationale: Phân từ hiện tại chủ động tiếp nối mạch khuyên bảo của văn cảnh. “Hãy xét xem” diễn đạt hành động xem xét để nhận biết và xác định điều đạt chuẩn, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τί
  choice: điều gì
  rationale: Đại từ nghi vấn trong câu hỏi gián tiếp; “điều gì” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἐστιν
  choice: (hàm chứa trong cấu trúc “điều gì đẹp lòng”)
  rationale: Trong tiếng Việt, hệ từ thường được lược bỏ tự nhiên trước cụm vị ngữ tính chất; thêm “là” ở đây sẽ kém tự nhiên.
- source_word: εὐάρεστον
  choice: đẹp lòng
  rationale: “Đẹp lòng” là thành ngữ tiếng Việt trang trọng, dễ hiểu, diễn đạt điều làm cho một người hài lòng; giữ sắc thái tương quan rõ hơn “được chấp nhận”.
- source_word: τῷ κυρίῳ
  choice: Chúa
  rationale: Kết hợp tự nhiên với “đẹp lòng”; κύριος được dịch bằng tước hiệu “Chúa” mà không xác định thêm đối tượng quy chiếu.
theological_decisions:
- issue: Đối tượng quy chiếu của κύριος
  choice: Chúa
  alternative: Chúa Giê-su; Đức Chúa Trời
  rationale: Nguyên văn chỉ dùng tước hiệu κύριος. Dù văn cảnh có thể được hiểu theo hướng quy chiếu đến Chúa Giê-su, bản dịch giữ nguyên mức độ xác định của tiếng Hy Lạp, không tự ý giải quyết sự hàm hồ thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng hình thức khuyên bảo “hãy xét xem” để thể hiện chức năng của phân từ trong mạch văn; dấu chấm phẩy giữ liên kết với câu bao quanh.
