  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: vi
  text: Mầu nhiệm này lớn lao[a], nhưng tôi nói về Đấng Mê-si-a[b] và hội thánh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mầu nhiệm này thật sâu sắc.” Tiếng Hy Lạp sát nghĩa hơn là “lớn”, có thể nói đến sự lớn lao hoặc tầm quan trọng, chứ không chỉ độ sâu.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là Χριστός, nghĩa là “Đấng Mê-si-a” hay “Đấng Christ”; ở đây từ này được dùng như một tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: mầu nhiệm
  rationale: Trong cách dùng của Phao-lô, từ này chỉ chân lý thuộc về Đức Chúa Trời từng được che giấu rồi được bày tỏ, chứ không chỉ là điều khó hiểu. “Mầu nhiệm” giữ được sắc thái thần học ấy mà không diễn giải quá mức.
- source_word: μέγα
  choice: thật lớn lao
  rationale: Giữ nghĩa trực tiếp về sự lớn lao hoặc tầm quan trọng; từ “thật” giúp câu tiếng Việt tự nhiên mà không thu hẹp nghĩa thành chỉ “sâu sắc”.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện sự chuyển ý có sắc thái tương phản nhẹ từ lời khẳng định về mầu nhiệm sang lời giải thích của Phao-lô.
- source_word: λέγω
  choice: tôi đang nói
  rationale: Phản ánh thì hiện tại và giữ nguyên động từ nói, thay vì diễn giải thành “ý tôi là”.
- source_word: εἰς
  choice: về
  rationale: Sau λέγω, giới từ này chỉ đối tượng được nhắc đến. “Về” là cách diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: Χριστόν
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός mang chức năng tước hiệu rõ nét trong mối liên hệ với hội thánh; “Đấng Mê-si-a” chuyển tải trực tiếp ý nghĩa tước hiệu.
- source_word: ἐκκλησίαν
  choice: hội thánh
  rationale: Trong ngữ cảnh Phao-lô, từ này chỉ cộng đồng dân của Đức Chúa Trời trong căn tính tập thể, không phải một hội họp dân sự thông thường.
theological_decisions:
- issue: Đối tượng của cụm từ “mầu nhiệm này” trong phép so sánh giữa hôn nhân, Đấng Mê-si-a và hội thánh
  choice: Giữ cách nói khái quát của nguyên văn, rồi để mệnh đề sau xác định rằng Phao-lô đang nói về Đấng Mê-si-a và hội thánh.
  alternative: Có thể hiểu mầu nhiệm là sự nên một thịt trong hôn nhân, chính lời trích Sáng Thế Ký 2:24, hoặc ý nghĩa biểu trưng của hôn nhân hướng đến Đấng Mê-si-a và hội thánh.
  rationale: Nguyên văn không xác định hẹp đối tượng của “mầu nhiệm này”. Bản dịch vì thế bảo tồn tiến trình giải thích và sự căng thẳng thần học của câu, thay vì quyết định thay cho người đọc.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Dùng “mầu nhiệm” theo nghĩa đặc trưng trong thư Phao-lô; dùng “Đấng Mê-si-a” để làm rõ chức năng tước hiệu của Χριστός. Không diễn giải cụ thể “mầu nhiệm này” là hôn nhân, lời Sáng Thế Ký 2:24 hay mối liên hệ biểu trưng, nhằm giữ nguyên độ mở của câu Hy Lạp.
