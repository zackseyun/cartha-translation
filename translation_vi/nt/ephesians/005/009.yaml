  text: ὁ γὰρ καρπὸς τοῦ ⸀φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: vi
  text: vì trái của ánh sáng thể hiện trong mọi sự tốt lành, công chính[a] và chân thật.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý”. Từ Hy Lạp có thể mang cả hai sắc thái.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “trái của Thánh Linh” thay cho “trái của ánh sáng”.
    reason: textual_variant
lexical_decisions:
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do giải thích cho lời khuyên ở câu trước và giữ rõ quan hệ nối kết.
- source_word: καρπὸς
  choice: trái
  rationale: Giữ hình ảnh ẩn dụ quen thuộc về kết quả do một đời sống sinh ra.
- source_word: τοῦ φωτός
  choice: của ánh sáng
  rationale: Dịch trực tiếp sở hữu cách và nối lại ý ở câu 8, nơi các tín hữu được gọi là ánh sáng trong Chúa.
- source_word: ἐν
  choice: thể hiện trong
  rationale: Diễn đạt tự nhiên ý về phạm vi hoặc sự biểu hiện của trái, tránh khiến tiếng Việt hiểu như vị trí vật lý nhưng không thu hẹp thành định nghĩa tuyệt đối.
- source_word: πάσῃ
  choice: mọi điều
  rationale: Trước các danh từ trừu tượng, từ này mang nghĩa bao quát; thêm “điều” giúp câu tiếng Việt tự nhiên.
- source_word: ἀγαθωσύνῃ
  choice: tốt lành
  rationale: Chuyển tải phẩm chất đạo đức tốt và việc thiện mà không thu hẹp thành lòng tử tế.
- source_word: δικαιοσύνῃ
  choice: công chính
  rationale: Thuật ngữ tự nhiên trong tiếng Việt Kinh Thánh, bao hàm sự ngay thẳng; khả năng dịch là “công lý” được giữ ở chú thích.
- source_word: ἀληθείᾳ
  choice: chân thật
  rationale: Trong danh sách phẩm chất đạo đức, “chân thật” diễn đạt tự nhiên cả sự phù hợp với chân lý lẫn tính thành thật.
theological_decisions:
- issue: Dị bản trong cụm sở hữu cách
  choice: trái của ánh sáng
  alternative: trái của Thánh Linh
  rationale: Bản SBLGNT đọc φωτός (“ánh sáng”), phù hợp trực tiếp với ngữ cảnh câu 8. Dị bản πνεύματος (“Thánh Linh”) được ghi chú vì có ảnh hưởng đáng kể trong truyền thống thủ bản.
- issue: Phạm vi nghĩa của δικαιοσύνη
  choice: công chính
  alternative: công lý
  rationale: “Công chính” giữ nghĩa rộng về phẩm chất và cách hành xử ngay thẳng trong danh sách này; “công lý” là khả năng có thật nhưng có thể nhấn mạnh phương diện xã hội-pháp lý hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “trái”; dùng “thể hiện trong” để chuyển tải chức năng của ἐν tự nhiên hơn trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
