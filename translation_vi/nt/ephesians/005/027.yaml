id: EPH.5.27
reference: Ephesians 5:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: vi
  text: để chính Ngài trình Hội Thánh trước mặt chính mình trong vinh quang[a], không có vết nhơ, nếp nhăn hay bất cứ điều gì tương tự[b], nhưng để Hội Thánh được thánh khiết và không tì vết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vinh hiển”; tính từ Hy Lạp có thể nói về phẩm chất của Hội Thánh hoặc trạng thái vinh quang trong đó Hội Thánh được trình ra.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hay bất cứ điều gì thuộc loại ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: trình diện
  rationale: Động từ ở thể giả định sau ἵνα diễn tả mục đích. “Trình diện” giữ được ý đưa Hội Thánh đến trước mặt một cách trang trọng trong hình ảnh hôn lễ.
- source_word: αὐτὸς ἑαυτῷ
  choice: chính Ngài… cho mình
  rationale: Giữ cả sắc thái nhấn mạnh của αὐτός lẫn tính phản thân của ἑαυτῷ, dù cách nói này tạo nên một độ căng có chủ ý trong tiếng Việt.
- source_word: ἔνδοξον
  choice: trong vinh quang
  rationale: Diễn tả trạng thái rạng rỡ, vinh hiển của Hội Thánh khi được trình diện; đồng thời tránh chuỗi tính từ nặng nề.
- source_word: ἐκκλησίαν
  choice: Hội Thánh
  rationale: Trong văn cảnh Phao-lô, từ này chỉ cộng đồng dân Chúa xét như một toàn thể. “Hội Thánh” là cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: σπίλον
  choice: vết nhơ
  rationale: Giữ hình ảnh cụ thể về một dấu làm mất vẻ tinh sạch, đồng thời phù hợp với ngữ cảnh thanh tẩy ở câu trước.
- source_word: ῥυτίδα
  choice: nếp nhăn
  rationale: Là tương đương trực tiếp, tự nhiên trong tiếng Việt và bảo toàn hình ảnh cô dâu.
- source_word: ἤ τι τῶν τοιούτων
  choice: hay bất cứ điều gì tương tự
  rationale: Giữ tính khái quát mở rộng ra ngoài hai hình ảnh vừa nêu.
- source_word: ἁγία
  choice: thánh khiết
  rationale: Diễn đạt tự nhiên phẩm chất thánh sạch của Hội Thánh mà không thu hẹp từ này chỉ còn nghĩa “được biệt riêng”.
- source_word: ἄμωμος
  choice: không chỗ trách được
  rationale: Giữ nghĩa không có khuyết điểm hay căn cứ để trách cứ, đồng thời phân biệt với hình ảnh “vết nhơ” đã xuất hiện trước đó.
theological_decisions:
- issue: Hình ảnh Đấng Christ tự trình diện Hội Thánh cho chính mình
  choice: Giữ cách diễn đạt “chính Ngài… cho mình”.
  alternative: Lược bỏ tính phản thân, hoặc giải thích đây là sự trình diện trước Đức Chúa Trời.
  rationale: Bản Hy Lạp có cả đại từ nhấn mạnh αὐτός và đại từ phản thân ἑαυτῷ. Bản dịch không giải quyết thay người đọc ý nghĩa thần học của cấu trúc này.
- issue: Sự kết hợp giữa hình ảnh cô dâu và ngôn ngữ thánh sạch
  choice: Dùng “vết nhơ, nếp nhăn… thánh khiết và không chỗ trách được”.
  alternative: Dùng hoàn toàn ngôn ngữ tế lễ như “không tì vết”.
  rationale: Câu văn đan xen vẻ đẹp của cô dâu với sự tinh sạch về đạo đức và tế lễ; cách dịch giữ các lớp hình ảnh ấy mà không giới hạn chúng vào một cách giải thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo văn cảnh nói về Đấng Christ và viết hoa “Hội Thánh” theo quy ước tên gọi cộng đồng phổ quát; cấu trúc phản thân hơi khác khẩu ngữ được giữ lại vì có ý nghĩa trong nguyên văn.
