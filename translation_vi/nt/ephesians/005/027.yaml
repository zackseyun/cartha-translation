- from: để chính Ngài trình diện Hội Thánh cho mình trong vinh quang[a], không có vết nhơ, nếp nhăn hay bất cứ điều gì tương tự[b], nhưng để Hội Thánh nên thánh khiết và không chỗ trách được.
  to: để chính Ngài trình Hội Thánh trước mặt chính mình trong vinh quang[a], không có vết nhơ, nếp nhăn hay bất cứ điều gì tương tự[b], nhưng để Hội Thánh được thánh khiết và không tì vết.
  rationale: Sửa “trình diện” thành “trình ... trước mặt” để phản ánh đúng quan hệ động từ–tân ngữ của παραστήσῃ và giữ cả sự nhấn mạnh “chính Ngài” lẫn tính phản thân “trước mặt chính mình”. Sửa “không chỗ trách được” thành “không tì vết” để phản ánh trực tiếp hơn ἄμωμος trong chuỗi hình ảnh tinh sạch. “Được” trong mệnh đề cuối giúp tiếng Việt tự nhiên mà vẫn diễn tả trạng thái mục đích do ᾖ nêu ra.
  reviewer_model: gpt-5.6-terra
