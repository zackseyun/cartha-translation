  text: because we are members of his body[a].
translation:
  language: vi
  text: vì chúng ta là các chi thể của thân thể Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm: “từ thịt và xương của Ngài.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân hoặc giải thích với mệnh đề trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μέλη
  choice: những chi thể
  rationale: Diễn đạt các bộ phận cấu thành một thân thể và duy trì hình ảnh thân thể mang ý nghĩa cộng đồng trong thư Phao-lô; “chi thể” trang trọng nhưng vẫn quen thuộc trong ngữ cảnh Kinh Thánh.
- source_word: ἐσμὲν
  choice: chúng ta là
  rationale: Phản ánh trực tiếp động từ hiện tại ngôi thứ nhất số nhiều và bao gồm cả tác giả lẫn độc giả.
- source_word: τοῦ σώματος
  choice: của thân thể
  rationale: Giữ nguyên ẩn dụ thân thể đã được thiết lập trong ngữ cảnh, không diễn giải thêm.
- source_word: αὐτοῦ
  choice: Ngài
  rationale: Đại từ sở hữu trong tiếng Hy Lạp quy chiếu về Đấng Christ; cấu trúc “thân thể Ngài” tự nhiên và rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Có đưa dị bản dài “thuộc thịt Ngài và thuộc xương Ngài” vào chính văn hay không
  choice: 'Chỉ dịch bản văn SBLGNT ngắn: “vì chúng ta là những chi thể của thân thể Ngài.”'
  alternative: “vì chúng ta là những chi thể của thân thể Ngài, thuộc thịt Ngài và thuộc xương Ngài”
  rationale: Nguồn Hy Lạp được cung cấp có bản đọc ngắn. Bản đọc dài có thể phản ánh sự đồng hóa với ngôn ngữ Sáng Thế Ký 2:23; vì vậy không đưa vào chính văn nhưng ghi chú để minh bạch về dị bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “chi thể” để bảo toàn hình ảnh các phần của một thân thể và sắc thái cộng đồng; viết hoa “Ngài” theo quy ước tôn kính phổ biến.
