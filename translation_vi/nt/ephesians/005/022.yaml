translation:
  language: vi
  text: Những người vợ[a], đối với chồng mình như đối với Chúa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nhiều bản dịch bổ sung động từ “thuận phục” từ câu 21: “Những người vợ, hãy thuận phục chồng mình như thuận phục Chúa.” Chính câu 22 trong tiếng Hy Lạp có cấu trúc tỉnh lược và lệ thuộc vào cấu trúc ngay trước đó.'
    reason: Giải thích cách đọc thay thế và động từ được hiểu ngầm từ ngữ cảnh.
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Những người làm vợ
  rationale: Trong phần khuyên dạy về đời sống gia đình và khi đi đôi với ἀνδράσιν, từ γυναῖκες mang nghĩa quan hệ hôn nhân là “những người làm vợ”, không phải phụ nữ nói chung.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: đối với chồng mình
  rationale: ἀνήρ ở đây có nghĩa là “chồng”; ἰδίοις chỉ người chồng trong chính quan hệ hôn nhân của mỗi người. “Mình” diễn đạt tự nhiên ý sở hữu này trong tiếng Việt.
- source_word: ὡς
  choice: như
  rationale: Giữ nguyên phép so sánh đơn giản của tiếng Hy Lạp mà không xác định quá mức bản chất hay phạm vi của sự so sánh.
- source_word: τῷ κυρίῳ
  choice: đối với Chúa
  rationale: κύριος trong ngữ cảnh thư Phao-lô ở đây chỉ Chúa Jesus. Lặp lại “đối với” giúp câu tiếng Việt thể hiện rõ cấu trúc song song.
- source_word: động từ được hiểu theo ngữ cảnh từ ὑποτασσόμενοι ở câu 21
  choice: không thêm động từ trong chính văn
  rationale: Bản văn Hy Lạp của câu 22 không có động từ hữu hạn mà dựa vào “thuận phục nhau” ở câu 21. Giữ cấu trúc tỉnh lược trong chính văn bảo toàn đặc điểm của nguồn; chú thích nêu rõ nghĩa được hiểu ngầm.
theological_decisions:
- issue: Có nên thêm “hãy thuận phục” vào chính văn dù câu 22 tiếng Hy Lạp không có động từ hay không
  choice: Không thêm động từ; giữ câu tỉnh lược và giải thích trong chú thích.
  alternative: Những người làm vợ, hãy thuận phục chồng mình như thuận phục Chúa.
  rationale: Động từ “thuận phục” được hiểu từ câu 21, nên cách thêm vào là hợp lý về nghĩa nhưng sẽ làm người đọc tưởng rằng động từ xuất hiện rõ trong chính câu 22. Bản dịch giữ sự lệ thuộc cú pháp giữa hai câu và không giải quyết ngầm nét căng thẳng của bản văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc hơi bỏ lửng được chủ ý giữ lại để phản ánh câu Hy Lạp tỉnh lược; dấu phẩy cuối câu cho thấy ý văn tiếp tục sang phần kế tiếp.
