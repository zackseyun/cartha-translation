revisions:
- from: Cũng vậy, các người chồng phải yêu vợ mình như chính thân thể mình. Người yêu vợ mình là yêu chính mình.
  to: Cũng vậy, những người chồng cũng phải yêu vợ mình như yêu chính thân thể mình. Người nào yêu vợ mình là yêu chính mình.
  rationale: Chỉnh sửa chỉ nhằm làm rõ phép so sánh, bảo toàn cả οὕτως lẫn καί, và cải thiện độ tự nhiên của tiếng Việt hiện đại. Bản sửa vẫn giữ nghĩa vụ đạo đức của ὀφείλουσιν, ngữ cảnh đặc thù người chồng/vợ, sự nhấn mạnh phản thân, và không áp đặt diễn giải thần học vượt quá câu văn.
