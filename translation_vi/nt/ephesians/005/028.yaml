id: EPH.5.28
reference: Ephesians 5:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: vi
  text: Cũng vậy, những người chồng cũng phải yêu vợ mình như yêu chính thân thể mình. Người nào yêu vợ mình là yêu chính mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên hệ suy luận và so sánh với lời dạy ngay trước đó.
- source_word: ὀφείλουσιν
  choice: phải
  rationale: Trong tiếng Việt, “phải” diễn đạt rõ nghĩa vụ đạo đức của động từ mà không cần chuyển câu thành mệnh lệnh trực tiếp.
- source_word: καὶ οἱ ἄνδρες
  choice: các người chồng
  rationale: “Cũng” trong “Cũng vậy” chuyển tải thích hợp sắc thái bổ sung của καί; ἄνδρες trong ngữ cảnh hôn nhân chỉ những người chồng.
- source_word: ἀγαπᾶν
  choice: yêu
  rationale: Giữ nguyên sự lặp lại có chủ ý của động từ ἀγαπάω trong cả hai vế.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: vợ mình
  rationale: γυναῖκας mang nghĩa “vợ” trong ngữ cảnh này; đại từ “mình” tự nhiên trong tiếng Việt và bảo toàn ý phản thân của ἑαυτῶν.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: như chính thân thể mình
  rationale: “Như” giữ phép so sánh; “chính” nhấn mạnh sắc thái phản thân, còn “thân thể” dịch trực tiếp σώματα.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: Người yêu vợ mình
  rationale: Cấu trúc danh hóa bằng “người” chuyển tải tự nhiên phân từ có mạo từ; ngữ cảnh vẫn xác định người ấy là người chồng mà không cần thêm đại từ giống đực vốn không tự nhiên trong tiếng Việt.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: là yêu chính mình
  rationale: Bảo toàn kết luận và sự lặp lại động từ, đồng thời dùng “chính mình” để thể hiện rõ đại từ phản thân.
theological_decisions:
- issue: Ngôn ngữ chỉ giới trong lời khuyên về gia đình
  choice: Dùng “các người chồng” ở mệnh đề đầu và “người” ở mệnh đề sau
  alternative: Dùng “đàn ông” hoặc lặp lại “người chồng”
  rationale: Ngữ cảnh hôn nhân đòi hỏi nghĩa “người chồng”. Ở vế sau, tiếng Việt không có đại từ giống đực tương ứng tự nhiên với cách nói tiếng Hy Lạp; “người” vẫn quy chiếu rõ đến người chồng vừa nêu và tránh lối diễn đạt gượng ép.
- issue: Bản chất của phép so sánh giữa vợ và thân thể
  choice: Giữ nguyên phép so sánh và kết luận rằng yêu vợ là yêu chính mình
  alternative: Diễn giải câu này như một khẳng định về sự đồng nhất siêu hình
  rationale: Bản dịch bảo toàn lập luận đạo đức và thần học của câu nhưng không thêm một cách giải thích vượt quá lời văn Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cũng vậy” tạo liên kết tự nhiên với câu trước; “vợ mình” và “chính mình” thể hiện ý phản thân mà không tạo cảm giác cổ hoặc nặng nề. Không cần chú thích văn bản vì dị bản liên quan đến καί không làm phát sinh vấn đề cần trình bày trong bản dịch câu này.
