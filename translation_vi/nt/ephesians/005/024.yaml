id: EPH.5.24
reference: Ephesians 5:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: vi
  text: Nhưng như Hội Thánh thuận phục Đấng Mê-si, thì các người vợ cũng thuận phục chồng mình trong mọi sự.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Giữ chức năng tương phản và tiếp nối lập luận từ câu trước bằng một liên từ tự nhiên trong tiếng Việt.
- source_word: ὡς ... οὕτως καὶ
  choice: thế nào, thì ... thể ấy
  rationale: Tái hiện rõ cấu trúc so sánh tương liên của tiếng Hy Lạp bằng lối diễn đạt trang trọng nhưng tự nhiên trong tiếng Việt.
- source_word: ἡ ἐκκλησία
  choice: Hội Thánh
  rationale: Trong văn mạch Phao-lô, từ này chỉ cộng đồng những người tin; “Hội Thánh” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt.
- source_word: ὑποτάσσεται
  choice: thuận phục
  rationale: Diễn đạt sự tự đặt mình dưới một trật tự trong quan hệ, không tự ý thêm sắc thái cưỡng ép.
- source_word: τῷ Χριστῷ
  choice: Đấng Mê-si
  rationale: Χριστός mang chức năng tước hiệu trong câu này; “Đấng Mê-si” giữ rõ tính chất tước hiệu thay vì xử lý như một tên riêng đơn thuần.
- source_word: αἱ γυναῖκες
  choice: những người vợ
  rationale: Trong quy tắc gia đình và khi đi đôi với ἀνδράσιν, nghĩa quan hệ hôn nhân “những người vợ” được văn mạch xác định.
- source_word: τοῖς ἀνδράσιν
  choice: chồng mình
  rationale: Văn mạch hôn nhân đòi hỏi nghĩa “chồng”; “mình” diễn đạt tự nhiên mối quan hệ sở thuộc được hàm ý trong tiếng Hy Lạp.
- source_word: ἐν παντί
  choice: trong mọi sự
  rationale: Giữ nguyên phạm vi rộng của cụm từ Hy Lạp, không thêm điều kiện hay lời giải thích ngoài bản văn.
- source_word: '[động từ tỉnh lược trong mệnh đề αἱ γυναῖκες]'
  choice: cũng thuận phục
  rationale: Tiếng Hy Lạp lược động từ ở mệnh đề thứ hai và lấy lại ý từ ὑποτάσσεται; tiếng Việt cần nhắc lại động từ để câu rõ ràng, tự nhiên.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Bản chính làm nổi bật chức năng tước hiệu của Χριστός; cách gọi truyền thống “Đấng Ki-tô” được giữ trong chú thích như một phương án tương đương.
- issue: Phạm vi của lời thuận phục trong hôn nhân
  choice: Giữ nguyên “trong mọi sự” mà không thêm điều kiện hạn định
  alternative: Các cách diễn giải như “trong mọi sự thích hợp” hoặc “trong mọi điều chính đáng”
  rationale: Bản Hy Lạp chỉ có ἐν παντί. Thêm điều kiện vào câu dịch sẽ giải quyết trước một căng thẳng thần học mà chính câu này không giải thích.
- issue: Động từ bị tỉnh lược ở mệnh đề nói về người vợ
  choice: Nhắc lại “thuận phục” trong tiếng Việt
  alternative: 'Giữ nguyên sự tỉnh lược: “thì những người vợ cũng đối với chồng mình”'
  rationale: Việc nhắc lại chỉ làm hiển lộ động từ được ngữ pháp và cấu trúc so sánh của tiếng Hy Lạp hàm chứa, không thêm một mệnh lệnh hay ý thần học mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hội Thánh” và “Đấng Mê-si” được viết hoa như các danh xưng tôn giáo. Cấu trúc “thế nào, thì ... thể ấy” giữ phép so sánh của nguyên văn; động từ được nhắc lại ở vế thứ hai vì tiếng Việt không thể lược tự nhiên như tiếng Hy Lạp.
