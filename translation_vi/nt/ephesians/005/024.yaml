    reason: Nêu cách gọi truyền thống tương đương và làm rõ lựa chọn dịch tước hiệu.
  revision_rationale: Loại bỏ “thể ấy” để không thêm một quy chiếu hoặc sắc thái tình huống không có trong ἐν παντί. Cấu trúc so sánh được chỉnh thành “Nhưng như …, thì …” để diễn đạt tự nhiên ὡς … οὕτως καὶ, đồng thời vẫn giữ động từ “thuận phục” được hàm chứa ở vế thứ hai. Chú thích được rút gọn để tập trung vào phương án tương đương “Đấng Ki-tô.”
