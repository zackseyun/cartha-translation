revisions:
- from: Vì những việc họ làm trong chỗ kín đáo, ngay cả nói đến cũng đáng hổ thẹn.[a]
  to: Vì ngay cả nói đến những việc họ làm trong bí mật cũng đáng hổ thẹn.[a]
  rationale: Sửa “trong chỗ kín đáo” thành “trong bí mật” để phản ánh κρυφῇ chính xác hơn. Điều chỉnh trật tự câu để “ngay cả nói đến” liên kết minh bạch với các việc ấy, đồng thời vẫn giữ lực tăng tiến của καί, tác nhân “họ,” và không bổ sung tiền giả định về đối tượng của đại từ.
