  text: τὰ γὰρ κρυφῇ γινόμενα ὑπ’ αὐτῶν αἰσχρόν ἐστιν καὶ λέγειν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/012.yaml
  text: For it is shameful even to speak of the things done by them in secret[a].
translation:
  language: vi
  text: Vì ngay cả nói đến những việc họ làm trong bí mật cũng đáng hổ thẹn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những điều họ làm trong bí mật.”'
    reason: Nêu một cách diễn đạt thay thế cho cụm danh từ τὰ ... γινόμενα.
lexical_decisions:
- source_word: τὰ ... γινόμενα
  choice: những việc ... làm
  rationale: Mạo từ đi với phân từ hiện tại tạo thành cụm danh từ, chỉ các việc hay hành động; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu lý do cho lời khuyên ở câu trước.
- source_word: κρυφῇ
  choice: trong chỗ kín đáo
  rationale: Diễn đạt hành động được thực hiện kín giấu, không công khai; đồng thời giữ sắc thái trạng ngữ của từ Hy Lạp.
- source_word: γινόμενα
  choice: làm
  rationale: Trong cấu trúc có ὑπό chỉ tác nhân, động từ được hiểu theo nghĩa các việc do họ thực hiện; tiếng Việt chủ động hóa tự nhiên mà không đổi nội dung.
- source_word: ὑπ’ αὐτῶν
  choice: họ làm
  rationale: ὑπό với sở hữu cách chỉ tác nhân. Chuyển thành kết cấu chủ động trong tiếng Việt giúp câu rõ và tự nhiên, nhưng không xác định thêm họ là ai.
- source_word: αἰσχρόν
  choice: đáng hổ thẹn
  rationale: Thể hiện sự đánh giá về luân lý và danh dự của αἰσχρόν bằng cách nói hiện đại, trang trọng.
- source_word: καὶ λέγειν
  choice: ngay cả nói đến
  rationale: καί có sắc thái tăng tiến, nên dịch là “ngay cả”; “nói đến” tự nhiên hơn “nói” khi đề cập các việc ấy.
theological_decisions:
- issue: Phạm vi quy chiếu của αὐτῶν
  choice: Giữ đại từ “họ” mà không xác định rõ đối tượng ngay trong câu.
  alternative: Diễn giải thành “những kẻ không vâng phục” hoặc “những kẻ làm các việc tối tăm”.
  rationale: Nguyên văn chỉ dùng đại từ và để văn cảnh xác định đối tượng; thêm danh xưng cụ thể sẽ giải nghĩa vượt quá câu Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc chủ động “họ làm” để tránh câu bị động nặng nề, nhưng vẫn giữ đại từ không xác định như nguyên văn.
