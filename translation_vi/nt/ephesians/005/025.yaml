  terminology: “Đấng Mê-si” bảo toàn giá trị tước hiệu của ὁ Χριστός; “Hội Thánh” phù hợp với ἐκκλησία trong ngữ cảnh Phao-lô; “phó chính mình” là cách diễn đạt trang trọng, chuẩn mực cho παρέδωκεν. Các neo chú thích a và b được đặt đúng tại các cụm từ liên quan.
