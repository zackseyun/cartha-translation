id: EPH.5.25
reference: Ephesians 5:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: vi
  text: Những người chồng, hãy yêu vợ mình, như Đấng Mê-si[a] cũng đã yêu Hội Thánh và phó chính mình vì Hội Thánh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ.” Tước hiệu Hy Lạp Χριστός được dịch là “Đấng Mê-si” ở đây để giữ lại ý nghĩa của tước hiệu.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “trao nộp chính mình vì Hội Thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: Những người chồng
  rationale: Trong phần giáo huấn về gia đình và khi đi đôi với γυναῖκας, ἄνδρες chỉ những người nam trong quan hệ hôn nhân, tức là những người chồng, chứ không phải nam giới nói chung.
- source_word: ἀγαπᾶτε
  choice: hãy yêu
  rationale: Thể mệnh lệnh được diễn đạt tự nhiên bằng “hãy yêu”, đồng thời giữ liên hệ từ vựng với ἠγάπησεν (“đã yêu”) ở phần sau.
- source_word: τὰς γυναῖκας
  choice: vợ mình
  rationale: Trong ngữ cảnh hôn nhân, γυναῖκας có nghĩa là “vợ”. “Mình” diễn đạt tự nhiên rằng mỗi người chồng phải yêu chính vợ của mình, điều vốn được hàm ý trong tiếng Hy Lạp.
- source_word: καθὼς καὶ
  choice: như ... cũng
  rationale: Cách diễn đạt này giữ cả ý so sánh của καθώς lẫn sắc thái bổ sung/nhấn mạnh của καί mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὁ Χριστός
  choice: Đấng Mê-si
  rationale: Χριστός là một tước hiệu có nghĩa là Đấng được xức dầu; “Đấng Mê-si” bảo tồn chức năng tước hiệu tại đây.
- source_word: ἠγάπησεν
  choice: đã yêu
  rationale: Dịch bằng quá khứ đơn tự nhiên trong tiếng Việt và giữ sự lặp lại có chủ ý với mệnh lệnh “hãy yêu”.
- source_word: τὴν ἐκκλησίαν
  choice: Hội Thánh
  rationale: Trong ngữ cảnh thư Phao-lô, từ này chỉ cộng đồng dân của Đức Chúa Trời xét như một toàn thể; “Hội Thánh” là cách gọi rõ ràng và quen thuộc trong tiếng Việt.
- source_word: ἑαυτὸν παρέδωκεν
  choice: phó chính mình
  rationale: Cụm từ diễn tả hành động tự nguyện trao chính mình. “Phó chính mình” giữ được sức nặng của sự tự hiến mà không thêm thuật ngữ giải thích về sự chuộc tội.
- source_word: ὑπὲρ αὐτῆς
  choice: vì Hội Thánh
  rationale: ὑπέρ với sở hữu cách mang nghĩa “vì, thay cho, vì lợi ích của”. Lặp lại “Hội Thánh” giúp đại từ quy chiếu rõ ràng trong tiếng Việt, vốn không có đại từ giống cái tương ứng tự nhiên ở đây.
theological_decisions:
- issue: Cách dịch Χριστός trong phép so sánh giữa hôn nhân và Hội Thánh
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Bản dịch giữ ý nghĩa tước hiệu của Χριστός thay vì mặc nhiên xử lý từ này như một tên riêng; chú thích cung cấp cách gọi quen thuộc khác mà không áp đặt truyền thống hệ phái.
- issue: Mức độ hàm ý hy sinh trong παρέδωκεν ὑπὲρ αὐτῆς
  choice: phó chính mình vì Hội Thánh
  alternative: trao nộp chính mình vì Hội Thánh
  rationale: Câu Hy Lạp trình bày việc Đấng Mê-si tự trao mình vì Hội Thánh. Bản dịch giữ sức nặng thần học ấy nhưng không thêm một cách giải thích cụ thể về cơ chế chuộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những người chồng” thể hiện lời gọi trực tiếp mà không dùng “hỡi”, vốn dễ tạo sắc thái cổ. “Phó chính mình” có sắc thái trang trọng phù hợp với câu văn nhưng vẫn rõ nghĩa; chú thích ghi cách diễn đạt sát nghĩa từ vựng hơn.
