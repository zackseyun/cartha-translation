  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: lời gọi trực tiếp dành cho chồng, mệnh lệnh yêu thương, phép so sánh với Đấng Mê-si, tình yêu của ngài dành cho Hội Thánh, và hành động tự hiến vì Hội Thánh. “Phó chính mình vì Hội Thánh” phản ánh trung thành ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς mà không thêm diễn giải chuộc tội.'
