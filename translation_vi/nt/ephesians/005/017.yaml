id: EPH.5.17
reference: Ephesians 5:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: vi
  text: Vì vậy, đừng trở nên dại dột[a], nhưng hãy hiểu ý muốn của Chúa là gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng dại dột.” Tuy nhiên, động từ Hy Lạp γίνεσθε nhấn mạnh việc trở nên hoặc đi vào một trạng thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Cụm giới từ với đại từ chỉ định liên kết lời khuyên này với phần trước và mang ý suy luận hoặc nguyên nhân; “Vì vậy” tự nhiên và giữ rõ chức năng nối kết.
- source_word: μὴ γίνεσθε
  choice: đừng trở nên
  rationale: γίνομαι diễn tả việc trở thành hay đi vào một trạng thái, không chỉ trạng thái tĩnh; cách dịch này giữ được sắc thái tiến trình của mệnh lệnh cấm.
- source_word: ἄφρονες
  choice: dại dột
  rationale: Từ này chỉ sự thiếu hiểu biết hoặc thiếu phán đoán thực tiễn. “Dại dột” tự nhiên, trang trọng vừa phải, và tạo thế đối lập rõ với mệnh lệnh “hãy hiểu”.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ sự tương phản mạnh giữa mệnh lệnh phủ định và mệnh lệnh khẳng định.
- source_word: συνίετε
  choice: hãy hiểu
  rationale: συνίημι có nghĩa là hiểu, nắm bắt hoặc nhận thức; “hãy hiểu” rõ ràng và tự nhiên, đồng thời vẫn cho phép sắc thái suy xét trong văn cảnh.
- source_word: τί τὸ θέλημα
  choice: ý muốn ... là gì
  rationale: τί giới thiệu nội dung cần hiểu, còn θέλημα chỉ ý muốn, chủ đích hoặc điều được mong muốn thực hiện. Trật tự tiếng Việt này tự nhiên và giữ nguyên nội dung của câu Hy Lạp.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ danh xưng κύριος mà không xác định thêm danh tính của đối tượng ngoài điều câu Hy Lạp nói rõ.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” (τοῦ κυρίου)
  choice: Dịch đơn giản là “Chúa”, không thêm “Giê-xu” trong chính văn.
  alternative: “Chúa Giê-xu” hoặc “Đức Chúa Trời”
  rationale: Văn cảnh thư Ê-phê-sô thường dùng “Chúa” để nói về Chúa Giê-xu, nhưng chính câu này chỉ có κυρίου. Giữ cách diễn đạt không xác định thêm sẽ bảo toàn sự dè dặt của nguyên văn.
- issue: Sức nặng của mệnh lệnh cấm μὴ γίνεσθε
  choice: “đừng trở nên”
  alternative: “đừng dại dột” hoặc “đừng tiếp tục dại dột”
  rationale: “Đừng trở nên” bảo toàn ý đi vào một trạng thái và không ngầm khẳng định người nghe vốn đã hoàn toàn ở trong trạng thái ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. “Dại dột” dễ hiểu hơn “vô tri” và phân biệt với từ ngữ về sự khôn ngoan trong văn cảnh gần. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
