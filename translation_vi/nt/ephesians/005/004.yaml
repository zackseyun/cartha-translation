id: EPH.5.4
reference: Ephesians 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: vi
  text: Cũng không được có lời lẽ tục tĩu, lời nói ngu xuẩn hay đùa cợt thô tục[a], là những điều không thích hợp[b], nhưng đúng hơn là lời tạ ơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đùa giỡn khiếm nhã.” Từ Hy Lạp εὐτραπελία đôi khi có nghĩa rộng hơn là sự dí dỏm, nhưng tại đây mang nghĩa tiêu cực vì được xếp cùng những kiểu lời nói không thích hợp.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không đúng đắn” hoặc “không thích đáng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: lời tục tĩu
  rationale: Trong ngữ cảnh liệt kê các tật xấu liên quan đến lời nói và đối lập với sự tạ ơn, cụm này diễn đạt lời lẽ đáng hổ thẹn, khiếm nhã mà không mở rộng thành mọi loại hành vi bất chính.
- source_word: μωρολογία
  choice: chuyện trò ngu xuẩn
  rationale: Diễn đạt tự nhiên danh từ ghép chỉ lời nói ngu ngốc, vô nghĩa, đồng thời giữ rõ nét nghĩa liên quan đến phát ngôn.
- source_word: ἢ
  choice: hay
  rationale: Nối mục cuối trong danh sách theo nghĩa thông thường của liên từ, còn tính chất cấm đoán tích lũy được thể hiện qua toàn câu.
- source_word: εὐτραπελία
  choice: đùa cợt thô tục
  rationale: Từ này có thể chỉ sự dí dỏm trong ngữ cảnh khác, nhưng tại đây được xếp cùng các lời nói không thích hợp, nên cần thể hiện sắc thái tiêu cực.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: là những điều không thích hợp
  rationale: Đại từ quan hệ số nhiều quy chiếu chung về ba điều vừa nêu; cách dịch này giữ sự đánh giá về tính không đúng chỗ, không phù hợp.
- source_word: ἀλλὰ μᾶλλον
  choice: nhưng thay vào đó
  rationale: Làm rõ thế tương phản mạnh và ý thay thế giữa lối nói bị bác bỏ với việc tạ ơn.
- source_word: εὐχαριστία
  choice: hãy tạ ơn
  rationale: Dùng động từ để câu tiếng Việt tự nhiên và làm rõ hành động tích cực được đặt đối lập với các kiểu lời nói trước đó; vẫn giữ ý biểu đạt lòng biết ơn.
theological_decisions:
- issue: Phạm vi của danh sách tật xấu đối với lời nói
  choice: Hiểu và dịch cả ba danh từ chủ yếu như những tật xấu thể hiện trong lời nói, đối lập với lời tạ ơn.
  alternative: Hiểu αἰσχρότης rộng hơn là mọi sự ô uế hoặc hành vi đáng hổ thẹn.
  rationale: Hai danh từ kế tiếp rõ ràng liên quan đến lời nói, và εὐχαριστία cũng thường là sự tạ ơn được thốt ra; ngữ cảnh vì thế hỗ trợ cách hiểu tập trung vào ngôn từ mà không tuyệt đối phủ nhận phạm vi rộng hơn của αἰσχρότης.
- issue: Sự đánh giá đạo đức của εὐτραπελία
  choice: Dịch tiêu cực là “đùa cợt thô tục”.
  alternative: “sự dí dỏm” hoặc “tài ứng đối”.
  rationale: Dù từ Hy Lạp có thể mang nghĩa tích cực ở nơi khác, việc nó nằm trong danh sách các điều “không thích hợp” đòi hỏi sắc thái tiêu cực tại đây.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Cũng đừng có…” nối tự nhiên với ngữ cảnh khuyên răn của câu trước; “hãy tạ ơn” ưu tiên sự tự nhiên của tiếng Việt hơn việc giữ danh từ trừu tượng ở cuối câu.
