id: EPH.5.1
reference: Ephesians 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γίνεσθε οὖν μιμηταὶ τοῦ θεοῦ, ὡς τέκνα ἀγαπητά,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/001.yaml
  text: Therefore[a], become imitators of God, as beloved children,
translation:
  language: vi
  text: Vậy, hãy trở nên những người noi gương Đức Chúa Trời, như những người con yêu dấu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy là những người noi gương Đức Chúa Trời”; thể mệnh lệnh trong tiếng Hy Lạp có thể nhấn mạnh việc trở nên hoặc tiếp tục sống như vậy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: hãy trở nên
  rationale: Động từ mệnh lệnh hiện tại của γίνομαι có thể nhấn mạnh tiến trình trở thành hoặc trạng thái tiếp diễn. “Hãy trở nên” giữ được sắc thái tiến trình và sức thúc giục của câu.
- source_word: οὖν
  choice: vậy
  rationale: Từ này đánh dấu kết luận suy ra từ phần trước; “vậy” tự nhiên trong tiếng Việt hiện đại và vẫn giữ liên kết lập luận.
- source_word: μιμηταὶ
  choice: những người noi gương
  rationale: Danh từ chỉ người bắt chước hoặc noi theo mẫu mực. “Những người noi gương” diễn đạt trực tiếp ý mô phỏng mà không mang sắc thái tiêu cực thường có của “bắt chước” trong tiếng Việt.
- source_word: τοῦ θεοῦ
  choice: Đức Chúa Trời
  rationale: Cụm sở hữu xác định đối tượng được noi gương; danh xưng này trang trọng, rõ ràng và thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: ὡς
  choice: như
  rationale: Giữ sự cô đọng và độ mở của tiếng Hy Lạp về cách thức hoặc nền tảng của lời khuyên, không tự ý chuyển thành quan hệ nhân quả minh nhiên.
- source_word: τέκνα
  choice: những người con
  rationale: τέκνα bao gồm mọi giới và nhấn mạnh quan hệ con cái; “những người con” vừa tự nhiên vừa tránh giới hạn vào con trai.
- source_word: ἀγαπητά
  choice: yêu dấu
  rationale: Diễn đạt tình trạng được yêu thương cùng sắc thái trìu mến, trang trọng của ἀγαπητά.
theological_decisions:
- issue: Quan hệ giữa lời kêu gọi noi gương Đức Chúa Trời và căn tính làm con
  choice: Giữ cụm “như những người con yêu dấu” gắn với lời kêu gọi, để căn tính làm con là cách thức hoặc nền tảng của việc noi gương, nhưng không nói rằng người tin trở thành con nhờ noi gương.
  alternative: 'Hiểu đơn thuần là một phép so sánh: hãy noi gương Đức Chúa Trời giống như những đứa con được yêu quý vẫn làm.'
  rationale: ὡς có thể gợi cách thức lẫn nền tảng. Bản dịch giữ nguyên độ cô đọng và không bổ sung một mệnh đề nhân quả hoặc giáo lý về sự nhận làm con mà câu này không nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “noi gương” để giữ ý imitation trong sắc thái tích cực; dùng “những người con yêu dấu” để diễn đạt bao quát giới. Dấu chú thích được đặt ngay sau cụm liên quan.
