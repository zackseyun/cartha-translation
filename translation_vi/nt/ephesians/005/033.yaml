  terminology: “Vợ/chồng” phản ánh chính xác γυνή/ἀνήρ trong ngữ cảnh hôn nhân. “Phải yêu” diễn đạt lực mệnh lệnh. “Kính trọng” tránh thu hẹp φοβῆται thành sự khiếp sợ, còn chú thích bảo lưu nghĩa sát chữ và sắc thái tôn kính.
  issues:
