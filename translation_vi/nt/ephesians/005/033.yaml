id: EPH.5.33
reference: Ephesians 5:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: vi
  text: Dù vậy, mỗi người trong anh em[a] cũng phải yêu vợ mình như chính mình; còn người vợ phải kính trọng[b] chồng mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “mỗi người trong anh em” dịch một lối nói có tính phân phối và nhấn mạnh, cho biết lời dạy này áp dụng riêng cho từng người chồng.
    reason: lexical_alternative
  - marker: b
    text: “Kính trọng” dịch một động từ có nghĩa sát chữ là “sợ”; tại đây từ này mang sắc thái kính nể hoặc tôn kính.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Dù vậy
  rationale: Đánh dấu lời kết luận thực hành có sắc thái chuyển ý từ phần trình bày trước, tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: καὶ ὑμεῖς
  choice: anh em cũng
  rationale: Giữ sắc thái bao gồm và nhấn mạnh của καὶ, đồng thời dùng cách xưng hô số nhiều phù hợp với cộng đồng được khuyên dạy.
- source_word: οἱ καθ’ ἕνα ἕκαστος
  choice: mỗi người trong anh em
  rationale: 'Diễn đạt rõ lực phân phối mạnh: mệnh lệnh áp dụng riêng cho từng người chồng.'
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: vợ mình
  rationale: Trong ngữ cảnh hôn nhân, γυνή là 'vợ'; đại từ phản thân ἑαυτοῦ được thể hiện tự nhiên bằng 'mình'.
- source_word: οὕτως ἀγαπάτω
  choice: phải yêu
  rationale: Thể mệnh lệnh hiện tại được diễn đạt rõ bằng 'phải yêu'; οὕτως liên kết cách yêu này với lời so sánh và phần trình bày trước.
- source_word: ὡς ἑαυτόν
  choice: như chính mình
  rationale: Giữ tiêu chuẩn so sánh phản thân của nguyên văn, đồng thời 'chính' làm rõ sự nhấn mạnh.
- source_word: ἡ δὲ γυνὴ
  choice: còn người vợ
  rationale: δέ chuyển sang vế khuyên dạy thứ hai; 'còn' tự nhiên trong một câu tổng kết song hành.
- source_word: ἵνα φοβῆται
  choice: phải kính trọng
  rationale: φοβέομαι có nghĩa căn bản là sợ nhưng trong quan hệ này có thể chỉ lòng kính nể, tôn trọng; 'kính trọng' truyền đạt sắc thái ấy mà không gợi nỗi kinh hãi.
- source_word: τὸν ἄνδρα
  choice: chồng mình
  rationale: ἀνήρ trong ngữ cảnh này là 'chồng'; 'mình' diễn đạt quan hệ sở hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch φοβῆται trong lời khuyên về hôn nhân
  choice: kính trọng
  alternative: sợ; kính sợ
  rationale: Nguyên ngữ có thể mang nghĩa sợ, kính sợ hoặc kính trọng. Ngữ cảnh nói về thái độ đối với chồng, nên 'kính trọng' truyền đạt ý kính nể mà không mặc nhiên biến lời dạy thành sự khiếp sợ; nghĩa sát chữ được nêu trong chú thích để bảo toàn độ căng ngữ nghĩa.
- issue: Tính đặc thù giới và hôn nhân của câu
  choice: vợ mình ... người vợ ... chồng mình
  alternative: người phối ngẫu của mình
  rationale: Các danh từ và hình thức số ít trong nguyên văn nói cụ thể về người chồng và người vợ, vì vậy bản dịch không trung hòa giới.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự câu được điều chỉnh nhẹ cho tự nhiên, nhưng vẫn giữ cấu trúc kết luận gồm hai lời khuyên song hành và giữ sự mơ hồ ngữ nghĩa đáng kể của φοβῆται qua chú thích.
