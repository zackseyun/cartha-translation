  source_fidelity: 'Bản dịch bảo toàn đầy đủ các thành tố chính của nguyên văn: οὖν là quan hệ suy luận (“Vì vậy”), μὴ γίνεσθε là lệnh cấm mang sắc thái không trở thành/không đi vào một tình trạng (“đừng trở thành”), và συμμέτοχοι αὐτῶν là sự cùng dự phần với “họ” mà không thêm trực tiếp đối tượng như việc làm hay tội lỗi.'
  naturalness: Câu văn rõ ràng, trang trọng vừa phải và phù hợp tiếng Việt hiện đại. Cụm “những người cùng dự phần với họ” hơi có sắc thái Kinh Thánh nhưng vẫn tự nhiên, dễ hiểu, và diễn đạt tốt danh từ số nhiều συμμέτοχοι.
  terminology: '“Cùng dự phần” là lựa chọn thích hợp cho συμμέτοχοι: giữ được ý chia sẻ/tham dự mà không áp đặt nghĩa hẹp như “đồng lõa” hoặc mở rộng thành “dự phần vào việc làm của họ.” Chú thích nêu các cách dịch thay thế hợp lệ và phân biệt rõ phần hàm ý theo ngữ cảnh.'
