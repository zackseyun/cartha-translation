id: EPH.5.7
reference: Ephesians 5:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ οὖν γίνεσθε συμμέτοχοι αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/007.yaml
  text: Therefore[a], do not become partners with them.
translation:
  language: vi
  text: Vì vậy, đừng trở thành những người cùng dự phần với họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người cùng tham gia với họ” hoặc “những người cùng chia phần với họ.” Theo ngữ cảnh, cụm từ này nói đến việc cùng dự phần trong lối sống tội lỗi của họ hoặc trong hậu quả của lối sống ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: đừng
  rationale: Kết hợp tự nhiên với động từ mệnh lệnh, diễn đạt lệnh cấm trong tiếng Việt hiện đại.
- source_word: οὖν
  choice: Vì vậy
  rationale: Giữ quan hệ suy luận với lời cảnh báo ở các câu 3–6.
- source_word: γίνεσθε
  choice: trở thành
  rationale: Phản ánh ý nghĩa 'trở nên/đi vào một tình trạng' của γίνομαι, thay vì chỉ diễn đạt trạng thái bằng 'là'.
- source_word: συμμέτοχοι
  choice: những người cùng dự phần
  rationale: Diễn đạt ý cùng chia sẻ hoặc tham dự với người khác; vừa tự nhiên, vừa không xác định quá mức điều được cùng dự phần.
- source_word: αὐτῶν
  choice: với họ
  rationale: Giữ đại từ chỉ người của nguyên văn và quan hệ với συμμέτοχοι, không mở rộng thành 'trong việc làm của họ'.
theological_decisions:
- issue: Phạm vi của sự cùng dự phần trong cụm συμμέτοχοι αὐτῶν
  choice: Giữ lời cấm tổng quát về việc cùng dự phần với 'họ', để hành vi tội lỗi và hậu quả được ngữ cảnh gợi ra.
  alternative: đừng dự phần vào những việc ấy / đừng dự phần vào việc làm của họ
  rationale: Nguyên văn dùng đại từ chỉ người αὐτῶν ('họ'), chứ không nêu rõ 'những việc ấy'. Cách dịch không thu hẹp sự mơ hồ thực sự của câu, trong khi chú thích làm rõ hàm ý theo ngữ cảnh.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Cùng dự phần” giữ sắc thái Kinh Thánh quen thuộc nhưng vẫn dễ hiểu; cấu trúc “trở thành những người...” bảo toàn nét chuyển sang một tình trạng của γίνεσθε.
