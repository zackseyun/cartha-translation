id: EPH.5.14
reference: Ephesians 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: vi
  text: 'Vì mọi điều được bày tỏ đều là ánh sáng.[a] Vì thế, có lời rằng: “Hỡi người đang ngủ, hãy thức dậy; hãy trỗi dậy từ giữa những người chết,[c] và Đấng Mê-si-a[b] sẽ chiếu sáng trên bạn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi điều bị phơi bày đều là ánh sáng.” Từ Hy Lạp φανερούμενον có thể mang nghĩa “được làm cho thấy rõ”, “được bày tỏ” hoặc “bị phơi bày”.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “Đấng Christ”; ở đây dịch là “Đấng Mê-si-a” vì Χριστός được dùng như một tước hiệu.
    reason: alternative_reading
  - marker: c
    text: Không rõ lời trích dẫn này bắt nguồn từ đâu; có thể nó vọng lại các chủ đề trong Kinh Thánh, đặc biệt là Ê-sai 60:1, hoặc xuất phát từ một bài thánh ca Cơ Đốc thời đầu.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν
  choice: mọi điều
  rationale: Dạng trung tính số ít đi với phân từ có mạo từ mang nghĩa khái quát; “mọi điều” giữ phạm vi rộng mà không buộc phải hiểu là chỉ người hay chỉ vật.
- source_word: φανερούμενον
  choice: được bày tỏ
  rationale: Phân từ bị động có thể chỉ điều được làm cho thấy rõ, được bộc lộ hoặc bị phơi bày. “Được bày tỏ” tự nhiên trong tiếng Việt và giữ được phần nào độ rộng nghĩa; phương án “bị phơi bày” được ghi ở chú thích.
- source_word: φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh ánh sáng và không diễn giải ý nghĩa ẩn dụ.
- source_word: διὸ
  choice: vì thế
  rationale: Diễn tả kết luận suy ra từ mệnh đề trước một cách ngắn gọn, tự nhiên.
- source_word: λέγει
  choice: có lời rằng
  rationale: Tiếng Hy Lạp không nêu chủ thể. Cách dịch này giới thiệu lời trích dẫn mà không xác định đó là lời của Đức Chúa Trời, Kinh Thánh hay một bài thánh ca.
- source_word: Ἔγειρε
  choice: hãy thức dậy
  rationale: Mệnh lệnh trực tiếp dành cho người đang ngủ; cách nói hiện đại và giữ nguyên hình ảnh.
- source_word: ὁ καθεύδων
  choice: hỡi người đang ngủ
  rationale: Phân từ có mạo từ được dùng như danh từ và mang chức năng hô gọi; cách dịch này rõ ràng, trang trọng vừa phải.
- source_word: ἀνάστα
  choice: hãy trỗi dậy
  rationale: Giữ sắc thái đứng dậy và âm hưởng sống lại khi đi cùng cụm “từ giữa những người chết”.
- source_word: ἐκ τῶν νεκρῶν
  choice: từ giữa những người chết
  rationale: Diễn đạt rõ ἐκ cùng danh từ số nhiều, đồng thời giữ hình ảnh một người trỗi dậy ra khỏi số những người chết.
- source_word: ἐπιφαύσει
  choice: sẽ chiếu sáng trên
  rationale: Giữ hình ảnh ánh sáng chiếu đến một người thay vì diễn giải trừu tượng là ban sự hiểu biết hay cứu rỗi.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Mạo từ ὁ cho thấy từ này có chức năng tước hiệu; “Đấng Mê-si” chuyển tải nghĩa của tước hiệu thay vì xử lý nó đơn thuần như tên riêng.
theological_decisions:
- issue: Nguồn của lời trích dẫn
  choice: 'Dùng cách dẫn nhập không xác định: “có lời rằng”'
  alternative: “Kinh Thánh chép rằng”, “Ngài phán”, hoặc “một bài thánh ca viết rằng”
  rationale: Nguyên văn không nêu chủ thể của λέγει, và nguồn chính xác của câu trích dẫn vẫn chưa chắc chắn; bản dịch không nên tự giải quyết vấn đề này.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Kitô
  rationale: Trong câu này, Χριστός có mạo từ và hoạt động như một tước hiệu. “Đấng Mê-si” làm rõ ý nghĩa tước hiệu mà không thêm một lập trường hệ phái.
- issue: Ý nghĩa của lời kêu gọi người ngủ trỗi dậy từ cõi chết
  choice: Giữ nguyên hình ảnh mà không giải thích đó là sự hoán cải, phép báp-têm hay sự sống lại cuối cùng
  alternative: Diễn giải cụ thể theo một trong các cách hiểu thần học trên
  rationale: Lời thơ có sức gợi và có thể vận dụng nhiều lớp hình ảnh; bản dịch nên bảo toàn sự căng thẳng ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Hỡi” và “trỗi dậy” tạo nhịp thơ phù hợp với lời trích dẫn; đại từ “người” tránh giới tính hóa người được gọi và không dùng đại từ quá cổ. Dấu chấm phẩy phân tách hai mệnh lệnh song song.
