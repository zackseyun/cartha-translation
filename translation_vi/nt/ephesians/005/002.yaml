  - severity: low
    issue: “Đấng Christ” không dịch rõ tước hiệu ὁ Χριστός.
    rationale: Vì ὁ Χριστός có mạo từ và hoạt động như một tước hiệu, “Đấng Mê-si-a” phản ánh trực tiếp hơn nguồn Hy Lạp và nhất quán với quyết định kiểm tra tiếng Anh.
