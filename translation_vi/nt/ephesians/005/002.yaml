reference: Ephesians 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: vi
  text: và hãy sống trong tình yêu thương, như Đấng Mê-si-a cũng đã yêu thương chúng ta và phó chính mình vì chúng ta,[a] làm lễ vật và sinh tế dâng lên Đức Chúa Trời, để trở thành hương thơm ngào ngạt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “thay mặt chúng ta” hoặc “vì lợi ích của chúng ta.” Cụm từ Hy Lạp ὑπὲρ ἡμῶν không nhất thiết tự nó xác định chỉ một trong các sắc thái này.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “hương thơm ngào ngạt” gợi lại ngôn ngữ tế lễ trong Cựu Ước về lễ dâng được Đức Chúa Trời vui nhận.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: hãy sống
  rationale: Động từ theo nghĩa bóng chỉ nếp sống hay cách ăn ở. “Hãy sống” truyền đạt tự nhiên ý nghĩa này trong tiếng Việt hiện đại, thay vì giữ hình ảnh “bước đi” vốn dễ bị hiểu theo nghĩa đen.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Giữ giới từ và sắc thái tình yêu thương là môi trường cũng như cách thức của đời sống được truyền dạy.
- source_word: ὁ Χριστός
  choice: Đấng Christ
  rationale: Cách gọi quen thuộc, trang trọng trong tiếng Việt; “Đấng” giúp thể hiện Χριστός đang mang chức năng tước hiệu.
- source_word: ἠγάπησεν ἡμᾶς
  choice: đã yêu thương chúng ta
  rationale: Diễn đạt trực tiếp thì aorist và giữ liên hệ từ vựng với ἀγάπη ở đầu câu.
- source_word: παρέδωκεν ἑαυτὸν
  choice: phó chính mình
  rationale: Diễn tả hành động tự nguyện trao nộp bản thân trong bối cảnh hy sinh; “chính mình” nhấn đúng đại từ phản thân.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: Cách nói tự nhiên, giữ được nghĩa vì lợi ích hay thay mặt chúng ta mà không ép giới từ thành một công thức thay thế hẹp hơn.
- source_word: προσφορὰν καὶ θυσίαν
  choice: lễ vật và sinh tế
  rationale: Giữ riêng cả hai danh từ thuộc ngôn ngữ tế lễ, không gộp chúng thành một khái niệm.
- source_word: τῷ θεῷ
  choice: dâng lên Đức Chúa Trời
  rationale: Bổ sung động từ “dâng” theo quan hệ ngữ pháp và bối cảnh tế lễ để tiếng Việt rõ, tự nhiên; Đức Chúa Trời là Đấng tiếp nhận lễ vật và sinh tế.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: như hương thơm ngào ngạt
  rationale: Bảo tồn hình ảnh cụ thể và tiếng vọng của ngôn ngữ tế lễ Cựu Ước; “như” diễn đạt tự nhiên kết quả hay đặc tính của lễ dâng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: Có mạo từ và được dùng như một tước hiệu. “Đấng Christ” vừa quen thuộc trong tiếng Việt vừa giữ dấu hiệu tước hiệu qua từ “Đấng”; phương án “Đấng Mê-si-a” làm rõ nghĩa gốc nhưng kém quen thuộc hơn.
- issue: Sắc thái của ὑπὲρ ἡμῶν trong bối cảnh tế lễ
  choice: vì chúng ta
  alternative: thay cho chúng ta; vì lợi ích của chúng ta
  rationale: Cụm từ chắc chắn diễn tả sự tự hiến vì chúng ta, nhưng bản thân ὑπέρ có thể mang sắc thái thay mặt hoặc vì lợi ích. Bản dịch không thu hẹp sự mơ hồ chính đáng thành một công thức giáo lý duy nhất.
- issue: Quan hệ của εἰς ὀσμὴν εὐωδίας với sự hy sinh
  choice: như hương thơm ngào ngạt
  alternative: để trở nên hương thơm ngào ngạt; làm hương thơm đẹp lòng Đức Chúa Trời
  rationale: Giữ hình ảnh tế lễ mà không thêm trực tiếp ý “đẹp lòng,” dù ý đó hiện diện trong bối cảnh liên văn bản.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “hãy sống” để chuyển thành ngữ Phao-lô một cách tự nhiên; giữ các thuật ngữ tế lễ “lễ vật” và “sinh tế.” Tất cả dấu chú thích [a], [b] đều xuất hiện trong chính văn.
