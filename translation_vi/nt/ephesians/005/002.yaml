  to: và hãy sống trong tình yêu thương, như Đấng Mê-si-a cũng đã yêu thương chúng ta và phó chính mình vì chúng ta,[a] làm lễ vật và sinh tế dâng lên Đức Chúa Trời, để trở thành hương thơm ngào ngạt.[b]
