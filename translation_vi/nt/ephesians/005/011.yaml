  source_fidelity: Bản dịch truyền đạt đúng hai mệnh lệnh của συγκοινωνεῖτε và ἐλέγχετε, cũng như hình ảnh ἔργοις ἀκάρποις τοῦ σκότους. “Dự phần vào” diễn đạt sự tham dự/chung phần; “vạch trần” phù hợp với ἐλέγχετε trong văn mạch ánh sáng–bóng tối, mà không loại trừ sắc thái quở trách đã được bảo lưu trong chú thích. “Trái lại” thể hiện tương phản μᾶλλον δέ; lực gia tăng của καὶ được hàm ý đầy đủ qua mệnh lệnh chủ động thứ hai.
