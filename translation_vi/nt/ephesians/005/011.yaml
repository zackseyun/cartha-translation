id: EPH.5.11
reference: Ephesians 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ συγκοινωνεῖτε τοῖς ἔργοις τοῖς ἀκάρποις τοῦ σκότους, μᾶλλον δὲ καὶ ἐλέγχετε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/011.yaml
  text: And do not participate in the unfruitful works of darkness[a], but instead even expose them[b],
translation:
  language: vi
  text: Đừng dự phần[a] vào những việc làm không sinh hoa trái của bóng tối; trái lại, hãy vạch trần chúng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cùng tham gia” hoặc “thông phần vào”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “khiển trách” hoặc “quở trách chúng”. Từ Hy Lạp có thể bao hàm việc sửa trị bằng lời, nhưng trong văn mạch này cũng mang ý làm cho những việc ấy bị đưa ra ánh sáng.
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: dự phần
  rationale: “Dự phần” diễn đạt việc cùng tham gia hoặc có phần trong điều gì, giữ được ý nghĩa chủ động của động từ mà vẫn tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἔργοις
  choice: những việc làm
  rationale: “Những việc làm” phù hợp với ngữ cảnh đạo đức và tự nhiên hơn “những công việc”, đồng thời vẫn phản ánh danh từ số nhiều của nguyên văn.
- source_word: ἀκάρποις
  choice: không sinh hoa trái
  rationale: Cách dịch này giữ nguyên hình ảnh về hoa trái trong tiếng Hy Lạp và liên kết với chủ đề kết quả của đời sống trong văn mạch.
- source_word: τοῦ σκότους
  choice: của bóng tối
  rationale: Giữ cấu trúc sở hữu rộng nghĩa của nguyên văn, không thu hẹp thành những việc chỉ được thực hiện trong bóng tối.
- source_word: μᾶλλον δὲ καὶ
  choice: trái lại, hãy
  rationale: '“Trái lại” thể hiện rõ sự tương phản mạnh: không chỉ tránh dự phần mà còn phải có hành động đối nghịch. Từ “hãy” đưa mệnh lệnh thứ hai vào tự nhiên trong tiếng Việt; sắc thái gia tăng của καὶ được thể hiện qua chính sự chuyển từ không tham dự sang chủ động vạch trần.'
- source_word: ἐλέγχετε
  choice: vạch trần
  rationale: Trong văn mạch ánh sáng và bóng tối, “vạch trần” diễn đạt việc làm cho điều sai trái bị phơi bày, đồng thời vẫn hàm ý lên án hoặc sửa trị.
theological_decisions:
- issue: Ý nghĩa của ἐλέγχετε đối với những việc làm xấu
  choice: vạch trần chúng
  alternative: khiển trách chúng; quở trách chúng
  rationale: Văn mạch gần nhấn mạnh ánh sáng làm cho mọi sự lộ ra (c. 8, 13), nên “vạch trần” giữ được mối liên hệ hình tượng ấy. Chú thích bảo lưu khả năng động từ cũng chỉ sự khiển trách hoặc sửa trị bằng lời.
- issue: Sức mạnh của hai mệnh lệnh tương phản
  choice: đừng dự phần ... trái lại, hãy vạch trần
  alternative: đừng thông phần ... nhưng hãy quở trách
  rationale: Câu Hy Lạp đòi hỏi cả việc không tham gia lẫn hành động đối nghịch với các việc thuộc bóng tối, nhưng không quy định cụ thể phương thức hành động.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Dự phần” giữ sắc thái Kinh Thánh vừa phải; “việc làm không sinh hoa trái” bảo toàn ẩn dụ của nguyên văn; dấu chấm phẩy làm rõ hai vế mệnh lệnh tương phản.
