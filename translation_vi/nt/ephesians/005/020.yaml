id: EPH.5.20
reference: Ephesians 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: vi
  text: luôn cảm tạ Đức Chúa Trời là Cha về mọi sự, nhân danh Chúa chúng ta, là Đức Chúa Jêsus, Đấng Mê-si[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi truyền thống: “Đức Chúa Jêsus Christ.”'
    reason: alternative_reading
  - marker: b
    text: “Về mọi sự” cũng có thể dịch sát hơn là “về tất cả mọi điều”; một số người hiểu là “về mọi người”, nhưng văn mạch nghiêng về nghĩa bao quát mọi sự việc hoặc hoàn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: cảm tạ
  rationale: Phân từ hiện tại chủ động tiếp nối chuỗi lời khuyên trong văn mạch; “cảm tạ” tự nhiên, trang trọng và giữ được ý hành động liên tục khi đi cùng “luôn”.
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt ngắn gọn, tự nhiên ý “mọi lúc, luôn luôn”.
- source_word: ὑπὲρ πάντων
  choice: về mọi sự
  rationale: πάντων có thể mang giống trung hoặc giống đực; trong văn mạch, nghĩa bao quát về mọi sự việc phù hợp hơn, nhưng khả năng hiểu là “về mọi người” được giữ trong chú thích.
- source_word: ἐν ὀνόματι
  choice: nhân danh
  rationale: Thành ngữ Kinh Thánh quen thuộc trong tiếng Việt, bảo toàn sắc thái đại diện và trung gian mà không diễn giải quá mức.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch tự nhiên và chuẩn cho tước hiệu κύριος khi chỉ về Đức Chúa Jêsus.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Giữ Jêsus như tên riêng quen thuộc trong văn phong Kinh Thánh tiếng Việt và dịch Χριστός theo nghĩa tước hiệu là “Đấng Mê-si”; dấu phẩy giúp cụm tước hiệu tự nhiên, rõ nghĩa.
- source_word: τῷ θεῷ καὶ πατρί
  choice: Đức Chúa Trời là Cha
  rationale: Dữ cách chỉ Đấng nhận lời cảm tạ. Cấu trúc Hy Lạp nối θεῷ và πατρί dưới cùng một mạo từ; “Đức Chúa Trời là Cha” diễn đạt tự nhiên rằng hai danh xưng cùng chỉ một Đấng.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός vẫn có lực của một tước hiệu, nên bản chính dịch nghĩa là “Đấng Mê-si”; cách gọi truyền thống “Đấng Christ” được bảo lưu trong chú thích.
- issue: Phạm vi của πάντων trong ὑπὲρ πάντων
  choice: mọi sự
  alternative: mọi người
  rationale: Hình thái có thể được hiểu là giống trung hoặc giống đực. Văn mạch về lòng biết ơn bao quát nghiêng về “mọi sự”, nhưng không loại bỏ hoàn toàn cách hiểu “mọi người”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ nhịp phân từ của câu đang tiếp diễn bằng cụm “luôn cảm tạ”. Dùng các danh xưng quen thuộc “Đức Chúa Trời”, “Chúa” và “Đức Chúa Jêsus”, đồng thời dịch tước hiệu Χριστός là “Đấng Mê-si”. Mọi dấu chú thích đều xuất hiện trong bản văn.
