source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: vi
  text: Ngài đã đến và loan báo[b] bình an cho anh em là những người ở xa[a], và bình an cho những người ở gần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là, bình an được loan báo cho những người trước kia ở xa và những người ở gần—trong văn cảnh, lần lượt là dân ngoại và người Do Thái (xem Ê-phê-sô 2:11–13).
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “loan báo tin mừng bình an.” Động từ Hy Lạp thường có nghĩa là “loan báo tin mừng”, nhưng ở đây tân ngữ của động từ chỉ đơn giản là “bình an”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: đã đến
  rationale: Phân từ bất định chỉ hành động đi kèm hoặc chuẩn bị; cách dịch này tự nhiên trong tiếng Việt và giữ hình ảnh Ngài đến mà không làm câu nặng nề.
- source_word: εὐηγγελίσατο
  choice: loan báo
  rationale: Động từ có nghĩa công bố hay đem tin mừng. Vì tân ngữ trực tiếp ở đây là “bình an”, “loan báo” vừa tự nhiên vừa giữ sắc thái công bố, không thêm danh từ “tin mừng” vào chính văn.
- source_word: εἰρήνην
  choice: bình an
  rationale: Tương đương trực tiếp và quen thuộc của εἰρήνη, đồng thời có thể chuyên chở ý nghĩa hòa giải và sự toàn vẹn trong văn cảnh.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Dữ cách chỉ người tiếp nhận lời loan báo; “anh em” là cách xưng hô số nhiều tự nhiên, trang trọng vừa phải trong thư tín.
- source_word: τοῖς μακρὰν
  choice: những người ở xa
  rationale: Giữ nguyên hình ảnh khoảng cách của nguyên văn, không đưa thẳng sự đồng nhất theo văn cảnh với dân ngoại vào chính văn.
- source_word: τοῖς ἐγγύς
  choice: những người ở gần
  rationale: Giữ cấu trúc song song và sự tương phản với “những người ở xa”.
- source_word: καὶ ... καὶ
  choice: và ... và
  rationale: Phản ánh hai nhóm cùng nhận một lời loan báo, đồng thời giữ sự lặp lại có chủ ý của câu Hy Lạp.
theological_decisions:
- issue: Danh tính của “những người ở xa” và “những người ở gần”
  choice: Giữ cách nói ẩn dụ “những người ở xa” và “những người ở gần” trong chính văn.
  alternative: Dịch diễn giải là “anh em là dân ngoại vốn ở xa” và “người Do Thái vốn ở gần”.
  rationale: Văn cảnh Ê-phê-sô 2:11–13 cho thấy hai nhóm tương ứng là dân ngoại và người Do Thái, nhưng chính câu này dùng các phạm trù “xa” và “gần”. Giữ nguyên hình ảnh bảo tồn cách lập luận của Phao-lô và không biến lời giải thích theo văn cảnh thành chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngài” chỉ Đấng Christ theo văn cảnh; câu giữ nhịp song song của nguyên văn và tránh giải nghĩa dân ngoại/người Do Thái ngay trong chính văn.
