id: EPH.2.20
reference: Ephesians 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐποικοδομηθέντες ἐπὶ τῷ θεμελίῳ τῶν ἀποστόλων καὶ προφητῶν, ὄντος ἀκρογωνιαίου αὐτοῦ ⸂Χριστοῦ Ἰησοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/020.yaml
  text: having been built on the foundation of the apostles and prophets[a], Messiah Jesus himself being the cornerstone[b],
translation:
  language: vi
  text: được xây dựng trên nền móng của các sứ đồ và các nhà tiên tri[a], với chính Đấng Mê-si-a Giê-su[b] là đá góc nhà,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “của các sứ đồ và các nhà tiên tri” có thể chỉ nền móng gắn với lời chứng của họ, nền móng do họ đặt, hoặc nền móng gồm chính họ; sở hữu cách trong tiếng Hy Lạp không nói rõ hơn.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch theo cách gọi truyền thống: “Đấng Christ Giê-su.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: được xây dựng
  rationale: Giữ thể bị động của phân từ aorist và nối tự nhiên với câu đang tiếp diễn trong văn cảnh; người đọc được hình dung như một phần của công trình Đức Chúa Trời.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: trên nền móng
  rationale: Diễn đạt tự nhiên quan hệ nâng đỡ trong ẩn dụ kiến trúc; ἐπί với tặng cách ở đây chỉ việc xây trên một nền móng.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: của các sứ đồ và các nhà tiên tri
  rationale: Giữ nguyên tính rộng nghĩa của sở hữu cách Hy Lạp, không tự ý xác định đây là nền móng do họ đặt, thuộc về họ, hay gồm chính họ hoặc lời chứng của họ.
- source_word: ὄντος ... αὐτοῦ
  choice: còn chính ... là
  rationale: Chuyển cấu trúc phân từ thuộc cách tuyệt đối sang tiếng Việt tự nhiên, đồng thời giữ sắc thái nhấn mạnh của αὐτοῦ đối với Đấng Mê-si-a Giê-su.
- source_word: ἀκρογωνιαίου
  choice: đá góc nhà
  rationale: Thuật ngữ kiến trúc chỉ viên đá góc giữ vai trò định hướng và liên kết công trình; cách nói này rõ và quen thuộc trong văn phong Kinh Thánh tiếng Việt mà không thêm ý 'chính yếu' vốn không được nêu riêng trong từ Hy Lạp.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Χριστός mang nghĩa tước hiệu 'Đấng Mê-si-a/Đấng được xức dầu'; bản dịch giữ nghĩa của tước hiệu thay vì chỉ phiên chuyển theo truyền thống.
theological_decisions:
- issue: Ý nghĩa của cụm 'nền móng của các sứ đồ và các nhà tiên tri'
  choice: Giữ cấu trúc rộng nghĩa 'của các sứ đồ và các nhà tiên tri'.
  alternative: “nền móng do các sứ đồ và các nhà tiên tri đặt” hoặc “nền móng gồm các sứ đồ và các nhà tiên tri”.
  rationale: Sở hữu cách Hy Lạp không xác định chính xác quan hệ. Bản dịch không giải quyết thay cho nguyên văn sự căng thẳng giữa con người, chức vụ và lời chứng của họ trong hình ảnh nền móng.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong ngữ cảnh này Χριστός vẫn có sức nặng của một tước hiệu; 'Đấng Mê-si-a' bảo toàn nghĩa ấy, còn cách gọi truyền thống được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ dạng tiếp nối vì câu 20 trong nguyên văn phụ thuộc vào mạch cú pháp của các câu trước. Dùng “các nhà tiên tri” để rõ nghĩa với độc giả phổ thông, và “đá góc nhà” để giữ nguyên ẩn dụ kiến trúc.
