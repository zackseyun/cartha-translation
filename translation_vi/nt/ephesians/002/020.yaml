  terminology: “Sứ đồ,” “nhà tiên tri,” “nền móng,” và “đá góc nhà” phù hợp với cách dùng Việt ngữ Kinh Thánh. “Đấng Mê-si-a Giê-su” thể hiện Χριστός như tước hiệu, đồng thời chú thích nêu đúng dạng gọi truyền thống “Đấng Christ Giê-su.”
