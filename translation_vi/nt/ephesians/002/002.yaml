  to: Trong những điều ấy, trước kia anh chị em đã bước đi[a] theo thời đại của thế gian này, theo kẻ cai trị quyền lực của không trung[b], tức là thần linh hiện đang hoạt động trong những người con của sự bất tuân[c].
