reference: Ephesians 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: vi
  text: Trong những điều ấy, trước kia anh chị em đã bước đi[a] theo thời đại của thế gian này, theo kẻ cai trị quyền lực của không trung[b], tức là thần linh hiện đang hoạt động trong những người con của sự bất tuân[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã sống”. “Bước đi” là hình ảnh chỉ cách sống hay nếp sống.
    reason: lexical_alternative
  - marker: b
    text: “Không trung” phản ánh cách nói vũ trụ học thời cổ, chỉ phạm vi được liên hệ với các quyền lực thần linh thù nghịch.
    reason: cultural_note
  - marker: c
    text: Nguyên văn là “các con trai của sự bất tuân”, một thành ngữ chỉ những người mang đặc tính bất tuân.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αἷς
  choice: Trong những điều ấy
  rationale: Đại từ quan hệ số nhiều giống cái quay lại “những vi phạm và tội lỗi” ở câu 1; cách dịch này giữ được liên hệ ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: ποτε περιεπατήσατε
  choice: trước kia anh chị em đã bước đi
  rationale: “Trước kia” diễn đạt ποτε, còn “bước đi” giữ hình ảnh Phao-lô dùng để nói về nếp sống. Đại từ “anh chị em” truyền đạt số nhiều mà không hàm ý chỉ nam giới.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: theo thời đại của thế gian này
  rationale: Giữ sự phân biệt giữa αἰών (“thời đại”) và κόσμος (“thế gian”), đồng thời “theo” thể hiện ý sống phù hợp với khuôn mẫu hay trật tự ấy.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: kẻ cai trị quyền lực chốn không trung
  rationale: “Kẻ cai trị” diễn đạt ἄρχων bằng ngôn ngữ hiện đại; “quyền lực” giữ nghĩa cốt lõi của ἐξουσία; “chốn không trung” phản ánh ἀήρ mà không tự ý thay bằng một hệ thống vũ trụ học cụ thể.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: tức là thần linh hiện đang hoạt động
  rationale: “Tức là” thể hiện quan hệ đồng vị có khả năng nhất trong chuỗi sở hữu cách, nhưng không xác định quá mức thần linh này là chính kẻ cai trị hay một quyền lực ở dưới quyền hắn. Chữ thường và “thần linh” cho thấy đây không phải Đức Thánh Linh.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: trong những người con của sự bất tuân
  rationale: Giữ thành ngữ Semit “con của…” và danh từ trừu tượng “sự bất tuân”; “người con” tự nhiên hơn “con trai” trong tiếng Việt và bao gồm những người được mô tả bởi đặc tính này.
theological_decisions:
- issue: Quan hệ giữa “thần linh hiện đang hoạt động” và “kẻ cai trị quyền lực chốn không trung”
  choice: Dùng “tức là” để trình bày “thần linh” như lời mô tả đồng vị cho quyền lực vừa nói đến.
  alternative: Hiểu đây là chính Sa-tan bằng một danh xưng thứ hai, hoặc là một linh lực phi cá thể ở dưới quyền kẻ cai trị.
  rationale: Cấu trúc sở hữu cách và mạo từ trong tiếng Hy Lạp cho phép quan hệ đồng vị. Bản dịch giữ mối liên hệ nhưng không quyết định bản thể của “thần linh” vượt quá điều câu văn nói.
- issue: Thành ngữ υἱοὶ τῆς ἀπειθείας
  choice: “những người con của sự bất tuân”
  alternative: “những con trai của sự bất tuân” hoặc “những kẻ bất tuân”
  rationale: “Người con” giữ hình ảnh nguồn mà không tạo ấn tượng sai rằng câu chỉ nói đến nam giới; chú thích giải thích cả dạng giống đực trong tiếng Hy Lạp lẫn ý nghĩa thành ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hình ảnh “bước đi”, sự phân biệt giữa “thời đại” và “thế gian”, cùng thành ngữ “người con của sự bất tuân”; các chú thích giải thích những chỗ có thể gây khó hiểu mà không làm phẳng sự mơ hồ thần học của câu.
