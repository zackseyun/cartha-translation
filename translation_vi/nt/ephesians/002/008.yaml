    rationale: “Nhờ” diễn đạt tự nhiên phương tiện/cách thức và tạo nhịp song hành rõ với “nhờ ân điển”, không làm lẫn lộn vai trò phân biệt của ân điển và đức tin trong câu Hy Lạp.
