source:
  edition: SBLGNT
  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: vi
  text: Vì nhờ ân điển, anh em đã được cứu nhờ đức tin[a]; điều này[b] không đến từ chính anh em, nhưng là quà tặng của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “đức tin” cũng có thể mang nghĩa “lòng tin”; trong một số văn cảnh, từ này còn có thể mang nghĩa “sự trung tín”.
    reason: lexical_alternative
  - marker: b
    text: “Điều này” nhiều khả năng chỉ toàn bộ thực tại vừa nói—được cứu nhờ ân điển qua đức tin—hơn là chỉ riêng “đức tin” hay “ân điển”.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: ân điển
  rationale: Trong văn mạch Phao-lô, χάρις chỉ ân huệ nhưng không của Đức Chúa Trời. “Ân điển” vừa quen thuộc trong ngôn ngữ Kinh Thánh tiếng Việt vừa giữ được nội hàm thần học mà không diễn giải quá mức.
- source_word: ἐστε σεσῳσμένοι
  choice: anh em đã được cứu
  rationale: Kết cấu hoàn thành περιφραστικός (ἐστε + σεσῳσμένοι) diễn tả hành động cứu đã hoàn tất với kết quả còn tiếp diễn. “Đã được cứu” truyền đạt cả hành động đã xảy ra và thể bị động.
- source_word: διὰ πίστεως
  choice: qua đức tin
  rationale: διά với sở hữu cách chỉ phương tiện. “Qua đức tin” tự nhiên, sát nghĩa và không buộc πίστις phải mang nghĩa hẹp hơn là “lòng tin” hay nghĩa khác là “sự trung tín” trong văn cảnh này.
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định trung tính có khả năng quy chiếu đến toàn bộ thực tại vừa nêu—được cứu nhờ ân điển qua đức tin—thay vì riêng χάρις hoặc πίστις, vốn đều là danh từ giống cái.
- source_word: οὐκ ἐξ ὑμῶν
  choice: không đến từ chính anh em
  rationale: ἐκ chỉ nguồn gốc. Cách dịch này là tiếng Việt hiện đại, rõ nghĩa và nhấn mạnh rằng thực tại cứu rỗi không bắt nguồn từ người nhận.
- source_word: θεοῦ τὸ δῶρον
  choice: là quà tặng của Đức Chúa Trời
  rationale: Cụm danh từ đồng vị xác định điều vừa nói là quà tặng đến từ Đức Chúa Trời. Thêm “là” để câu tiếng Việt hoàn chỉnh và tự nhiên.
theological_decisions:
- issue: Đối tượng quy chiếu của τοῦτο (“điều này”)
  choice: Giữ “điều này” trong chính văn, với cách hiểu nhiều khả năng nhất là toàn bộ thực tại được cứu nhờ ân điển qua đức tin.
  alternative: Có thể hiểu τοῦτο quy chiếu riêng đến “đức tin” hoặc riêng đến “ân điển”.
  rationale: Vì τοῦτο là trung tính còn χάρις và πίστις đều là giống cái, đại từ này tự nhiên hơn khi tóm lại cả mệnh đề trước. Tuy vậy, bản dịch không thay đại từ bằng một lời diễn giải dài, nhờ đó vẫn giữ độ cô đọng và không áp đặt một kết luận hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều theo văn phong thư tín Kinh Thánh; “ân điển” và “đức tin” giữ thuật ngữ quen thuộc, còn “quà tặng” giúp câu tự nhiên hơn “món quà” trong ngữ cảnh trang trọng.
