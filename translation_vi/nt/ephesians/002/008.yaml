revisions:
- from: Vì nhờ ân điển, anh em đã được cứu qua đức tin; điều này không đến từ chính anh em[a], mà là quà tặng của Đức Chúa Trời.
  to: Vì nhờ ân điển, anh em đã được cứu nhờ đức tin[a]; điều này[b] không đến từ chính anh em, nhưng là quà tặng của Đức Chúa Trời.
  rationale: Bản sửa giữ nguyên ý nghĩa và sự dè dặt của nguyên văn về đối tượng quy chiếu của τοῦτο, đồng thời tách và đặt lại các chú thích đúng tại từ/cụm từ liên quan. “Nhờ đức tin” được dùng vì tự nhiên trong tiếng Việt hiện đại và vẫn diễn đạt διά πίστεως như phương tiện.
