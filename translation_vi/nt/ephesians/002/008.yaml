    rationale: Chú thích về “đức tin” cần neo tại “đức tin”; chú thích về “điều này” cần neo tại “điều này”. Tách chú thích giúp người đọc nhận biết rõ vấn đề văn bản mà không thay đổi nghĩa chính văn.
