id: EPH.2.12
reference: Ephesians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: vi
  text: rằng vào thời ấy, anh chị em không có Đấng Mê-si-a[a], bị xa cách cộng đồng Ít-ra-ên và là người xa lạ đối với các giao ước của lời hứa[b], không có niềm hy vọng và không có Đức Chúa Trời trong thế gian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có Đấng Christ.” Tước hiệu Hy Lạp Χριστός có thể được chuyển sang tiếng Việt theo cả hai cách; ở đây “Đấng Mê-si-a” làm rõ bối cảnh Do Thái và giao ước.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể hiểu: “các giao ước chứa đựng lời hứa” hoặc “các giao ước về lời hứa.”'
    reason: lexical_alternative
  - marker: c
    text: Cụm này cũng có thể dịch là “không tin kính.” Trong ngữ cảnh, nó có thể chỉ tình trạng không có Đức Chúa Trời chân thật, chứ không nhất thiết là chủ nghĩa vô thần theo nghĩa triết học.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: không có Đấng Mê-si
  rationale: Trong ngữ cảnh nói về Ít-ra-ên và các giao ước, Χριστός mang sắc thái tước hiệu; “Đấng Mê-si” giữ rõ ý nghĩa Do Thái–giao ước.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ
  choice: bị xa cách cộng đồng Ít-ra-ên
  rationale: Phân từ hoàn thành bị động diễn tả tình trạng bị tách khỏi đời sống cộng đồng mang căn tính dân sự của Ít-ra-ên; “cộng đồng” tự nhiên hơn các thuật ngữ chính trị hiện đại.
- source_word: ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας
  choice: là người xa lạ đối với các giao ước của lời hứa
  rationale: Giữ số nhiều của διαθηκῶν và số ít của ἐπαγγελίας, đồng thời bảo toàn quan hệ sở hữu vốn có thể hiểu theo hơn một cách.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: không có niềm hy vọng
  rationale: Diễn đạt tự nhiên tình trạng không có hy vọng mà phân từ Hy Lạp mô tả.
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: không có Đức Chúa Trời trong thế gian
  rationale: Tránh áp đặt khái niệm vô thần theo nghĩa triết học hiện đại; câu nhấn mạnh tình trạng không có mối liên hệ với Đức Chúa Trời chân thật.
theological_decisions:
- issue: Cách dịch Χριστός trong mạch văn Phao-lô
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Mạch văn về Ít-ra-ên, các giao ước và lời hứa làm nổi bật chức danh Đấng được xức dầu, chứ không chỉ cách dùng như tên riêng.
- issue: Ý nghĩa của ἄθεοι
  choice: không có Đức Chúa Trời
  alternative: không tin kính / vô thần
  rationale: Giữ trọng tâm giao ước và mối liên hệ với Đức Chúa Trời, không đồng nhất người ngoại với chủ nghĩa vô thần hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều, “Ít-ra-ên” theo lối phiên âm phổ thông, và giữ cấu trúc liệt kê dồn dập của nguyên văn.
