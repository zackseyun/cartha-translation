  source_fidelity: 'Bản dịch giữ đúng cấu trúc và các ý chính của nguyên văn: tình trạng trước kia tách khỏi Đấng Mê-si, bị loại khỏi cộng đồng/chính thể Ít-ra-ên, xa lạ với các giao ước của lời hứa, không hy vọng và không có Đức Chúa Trời trong thế gian. Số nhiều của “các giao ước” và số ít của “lời hứa” đều được giữ. Tuy nhiên, “Mê-si-a” là dạng phiên âm Việt ngữ chuẩn và dễ nhận biết hơn “Mê-si”.'
  naturalness: Câu văn trang trọng, tự nhiên và giữ được nhịp liệt kê của câu Hy Lạp. “Bị xa cách cộng đồng Ít-ra-ên” diễn đạt được tình trạng bị tách khỏi, dù sắc thái chính thể/công dân của πολιτεία được chuyển sang cách nói dễ đọc hơn.
