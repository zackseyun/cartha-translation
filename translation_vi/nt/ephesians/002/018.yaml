source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: vi
  text: Vì[a] nhờ Ngài, cả hai bên đều có lối đến với Cha[b] trong cùng một Thánh Linh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Bởi vì nhờ Ngài…”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ được dịch là “có lối đến với” cũng có thể được dịch là “có sự tiếp cận với,” “được dẫn vào,” hoặc “được đến với.”
    reason: lexical_alternative
  - marker: c
    text: Hay “nhờ cùng một Thánh Linh”; “trong cùng một Thánh Linh” giữ cách diễn đạt Hy Lạp, vốn có thể chỉ phương tiện hoặc phạm vi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Thật vậy
  rationale: Trong mạch văn, liên từ này mở đầu lời giải thích làm nền cho câu trước. “Thật vậy” tự nhiên trong tiếng Việt và giữ sắc thái giải thích; “bởi vì” vẫn là một khả năng.
- source_word: δι’ αὐτοῦ
  choice: nhờ Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc trung gian. “Nhờ Ngài” tự nhiên và giữ vai trò trung gian của Đấng Christ trong ngữ cảnh.
- source_word: ἔχομεν τὴν προσαγωγὴν
  choice: chúng ta … được đến với
  rationale: Cách diễn đạt này truyền đạt đặc ân được tiếp cận sự hiện diện của Cha bằng tiếng Việt tự nhiên. Danh từ προσαγωγή cũng có thể gợi ý việc được dẫn vào hoặc lối tiếp cận.
- source_word: οἱ ἀμφότεροι
  choice: cả hai chúng ta
  rationale: Giữ ngôi thứ nhất và sự liên đới của tác giả với hai bên đã được nói đến trong ngữ cảnh, mà không thêm trực tiếp các danh xưng “người Do Thái” và “dân ngoại” vào câu.
- source_word: ἐν ἑνὶ πνεύματι
  choice: trong cùng một Thánh Linh
  rationale: “Trong” giữ giới từ Hy Lạp và để ngỏ sắc thái phạm vi hay phương tiện; “cùng một” diễn đạt sự dự phần chung của cả hai bên. Viết hoa “Thánh Linh” phản ánh đối tượng được nhắc đến nhiều khả năng nhất trong ngữ cảnh.
- source_word: πρὸς τὸν πατέρα
  choice: đến với Cha
  rationale: πρός với đối cách chỉ hướng đến sự hiện diện của một thân vị. “Đến với Cha” trực tiếp, tự nhiên và không thêm từ “Đức Chúa Trời” vốn không có trong câu Hy Lạp.
theological_decisions:
- issue: Đối tượng của “một πνεῦμα”
  choice: Thánh Linh
  alternative: một tinh thần chung của con người
  rationale: Cấu trúc “nhờ Ngài … trong cùng một Thánh Linh … đến với Cha” và ngữ cảnh Ê-phê-sô 2 mạnh mẽ ủng hộ cách hiểu là Thánh Linh. Việc viết hoa thể hiện cách hiểu có khả năng nhất mà không thêm lời giải thích vào chính văn.
- issue: Sắc thái của προσαγωγή
  choice: đặc ân được đến với Cha
  alternative: một cuộc giới thiệu chính thức hoặc việc được dẫn vào trước mặt Cha
  rationale: Từ này có thể mang hình ảnh cung đình hoặc thờ phượng, nhưng ở đây trọng tâm là sự tiếp cận chung và hiện có của cả hai bên. Bản dịch không giới hạn từ này vào một lần giới thiệu ban đầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Ngài” chỉ Đấng Christ theo ngữ cảnh gần; “Cha” và “Thánh Linh” giữ cấu trúc quy hướng về Ba Ngôi của câu mà không thêm thuật ngữ tín lý vào chính văn.
