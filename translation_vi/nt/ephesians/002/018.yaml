    rationale: οἱ ἀμφότεροι quy chiếu đến hai nhóm trong ngữ cảnh trước đó; “cả hai bên” truyền đạt rõ hơn số nhiều tập thể mà không cần nêu thêm tên hai nhóm.
  - severity: medium
    issue: “được đến với” chưa phản ánh đầy đủ “có sự tiếp cận.”
    rationale: ἔχομεν τὴν προσαγωγήν nói về việc hiện đang có quyền/lối tiếp cận. “có lối đến với” giữ được cấu trúc sở hữu và sắc thái tiếp cận tốt hơn.
  - severity: low
    issue: “Thật vậy” kém trực tiếp hơn đối với liên từ giải thích/căn cứ ở đây.
    rationale: “Vì” là cách nối câu tự nhiên và sát hơn với lực giải thích của ὅτι trong mạch văn.
