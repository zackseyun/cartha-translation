- from: Thật vậy[a], nhờ Ngài, cả hai chúng ta đều được đến với Cha[b] trong cùng một Thánh Linh[c].
  to: Vì[a] nhờ Ngài, cả hai bên đều có lối đến với Cha[b] trong cùng một Thánh Linh[c].
  rationale: Bản sửa bảo toàn nghĩa giải thích của ὅτι, tính trung gian của δι’ αὐτοῦ, ý nghĩa hiện tại của ἔχομεν, và sắc thái “sự tiếp cận” của προσαγωγή. “Cả hai bên” làm rõ quy chiếu tập thể của οἱ ἀμφότεροι theo ngữ cảnh mà không bổ sung các nhãn “Do Thái” và “dân ngoại.” Các chú thích được cập nhật để neo đúng vào cách dịch mới và vẫn bảo tồn các khả năng từ vựng chính.
