source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: vi
  text: ngay cả khi chúng ta đã chết trong các vi phạm, Ngài cũng làm cho chúng ta sống lại cùng với Đấng Mê-si-a[a]—nhờ ân điển, anh em đã được cứu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng được xức dầu”; ở đây được dịch là “Đấng Mê-si-a” để làm rõ ý nghĩa ấy.'
    reason: alternative_rendering
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: ngay cả khi chúng ta đã chết
  rationale: Cách dịch này diễn đạt tự nhiên sắc thái thời gian–nhượng bộ của phân từ, đồng thời giữ nguyên tình trạng “đã chết” mà câu mô tả.
- source_word: τοῖς παραπτώμασιν
  choice: trong những vi phạm
  rationale: Giới từ “trong” giữ được khả năng hiểu cách ở đây là phạm vi hay tình trạng, thay vì quyết định dứt khoát rằng các vi phạm là nguyên nhân. Danh từ “vi phạm” diễn đạt hành vi bước lệch hoặc vượt quá điều đúng.
- source_word: συνεζωοποίησεν
  choice: làm cho chúng ta sống lại cùng
  rationale: “Làm cho… sống lại” truyền đạt hành động ban sự sống cho người đang chết; “cùng” giữ thành tố đồng hành/kết hợp trong động từ ghép và liên kết với Đấng Mê-si-a.
- source_word: τῷ Χριστῷ
  choice: với Đấng Mê-si-a
  rationale: 'Cách dịch này hiểu cách dữ liệu như sự liên kết: Đức Chúa Trời làm cho chúng ta sống lại cùng với Đấng được xức dầu. “Đấng Mê-si-a” giữ rõ chức danh của Χριστός.'
- source_word: χάριτί
  choice: nhờ ân điển
  rationale: “Nhờ” diễn đạt phương tiện hoặc căn cứ, còn “ân điển” là thuật ngữ tiếng Việt quen thuộc và chính xác cho ân huệ nhưng không của Đức Chúa Trời.
- source_word: ἐστε σεσῳσμένοι
  choice: anh em đã được cứu
  rationale: Cấu trúc “đã được cứu” giữ thể bị động và diễn đạt kết quả hiện còn của hành động đã hoàn tất. “Anh em” phân biệt ngôi thứ hai số nhiều với “chúng ta” ở đầu câu.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong ngữ cảnh này, Χριστός vẫn mang chức năng của một tước hiệu. “Đấng Mê-si-a” làm rõ nghĩa “Đấng được xức dầu”, còn cách gọi truyền thống được ghi ở chú thích.
- issue: Sắc thái của τοῖς παραπτώμασιν
  choice: trong những vi phạm
  alternative: vì những vi phạm
  rationale: Cách dịch “trong” bảo tồn sự mơ hồ giữa phạm vi/tình trạng và quan hệ nguyên nhân, không thu hẹp câu vào một cách giải thích duy nhất.
- issue: Mệnh đề χάριτί ἐστε σεσῳσμένοι
  choice: giữ như lời xen vào giữa hai dấu gạch ngang
  alternative: hòa mệnh đề này vào câu mà không nhấn bằng dấu câu
  rationale: Lối ngắt đột ngột của Phao-lô nhấn mạnh ân điển và báo trước phần giải thích đầy đủ hơn ở các câu 8–9; giữ dấu gạch ngang bảo tồn hiệu quả tu từ ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “anh em” được dùng cho ngôi thứ hai số nhiều, phân biệt với “chúng ta”. Viết hoa “Ngài” vì chủ thể được tiếp nối từ ngữ cảnh trước là Đức Chúa Trời. Cấu trúc và hai dấu gạch ngang được giữ để phản ánh câu Hy Lạp vốn nối tiếp từ câu trước và có lời xen nhấn mạnh.
