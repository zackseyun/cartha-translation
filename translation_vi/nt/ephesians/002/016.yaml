id: EPH.2.16
reference: Ephesians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: vi
  text: và để hòa giải cả hai với Đức Chúa Trời trong một thân thể nhờ thập tự giá, qua đó Ngài đã giết chết sự thù nghịch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: để hòa giải
  rationale: Diễn đạt động từ chỉ việc khôi phục mối quan hệ hòa thuận; giữ quan hệ mục đích trong mạch câu.
- source_word: τοὺς ἀμφοτέρους
  choice: cả hai
  rationale: Giữ nguyên cách gọi khái quát của nguyên văn, quy chiếu về hai nhóm đã được nói đến trong văn cảnh.
- source_word: ἐν ἑνὶ σώματι
  choice: trong một thân thể
  rationale: Bảo toàn hình ảnh thần học và sự mơ hồ có chủ ý về thân thể hợp nhất.
- source_word: διὰ τοῦ σταυροῦ
  choice: nhờ thập tự giá
  rationale: Thể hiện phương tiện qua đó sự hòa giải được thực hiện.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: đã giết chết sự thù nghịch
  rationale: Giữ sức mạnh của ẩn dụ ἀποκτείνω thay vì làm nhẹ thành 'xóa bỏ'.
- source_word: ἐν αὐτῷ
  choice: qua đó
  rationale: Đại từ có thể quy chiếu đến thập tự giá; 'qua đó' diễn đạt cách hiểu công cụ phù hợp với lớp tham khảo đã được xét duyệt mà không thêm một danh từ mới.
theological_decisions:
- issue: Đối tượng và phạm vi của sự hòa giải
  choice: hòa giải cả hai với Đức Chúa Trời trong một thân thể
  alternative: khiến cả hai hòa thuận với Đức Chúa Trời thành một thân thể
  rationale: Giữ Đức Chúa Trời là đích hướng đến của sự hòa giải và giữ riêng cụm 'trong một thân thể', tránh giải thích quá mức quan hệ cú pháp.
- issue: Ý nghĩa của ἐν αὐτῷ
  choice: qua đó
  alternative: trong thân thể ấy
  rationale: Chọn quy chiếu về thập tự giá theo cách hiểu công cụ được phản ánh trong bản POB tiếng Anh mới nhất, đồng thời tránh nhập thêm một diễn giải giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'thập tự giá' và 'sự thù nghịch' vì quen thuộc trong văn cảnh Kinh Thánh, đồng thời giữ hình ảnh mạnh của nguyên văn.
