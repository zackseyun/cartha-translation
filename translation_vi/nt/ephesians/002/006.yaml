  source_fidelity: 'Bản dịch phản ánh đúng hai động từ ghép συνήγειρεν và συνεκάθισεν: Đức Chúa Trời khiến “chúng ta” cùng dự phần với Đấng Mê-si-a trong sự sống lại và việc được đặt ngồi. Tuy nhiên, trật tự và cách lặp “cùng” trong bản nháp gây mơ hồ nhẹ: “cùng cho chúng ta ngồi với Ngài” không tự nhiên và có thể khiến “cùng” bị hiểu là trạng từ nối chung chung thay vì yếu tố ‘ngồi cùng’.'
  naturalness: Cần chỉnh để tiếng Việt hiện đại trôi chảy hơn. “Đã làm cho chúng ta cùng sống lại với Ngài” là có thể hiểu được nhưng hơi nặng; “đã khiến chúng ta sống lại cùng với Ngài” tự nhiên hơn. “Đã cho chúng ta ngồi cùng với Ngài” là cách diễn đạt rõ và chuẩn hơn “cùng cho chúng ta ngồi với Ngài.” “Các cõi trời” hợp với cách dùng Kinh Thánh Việt ngữ và diễn tả được số nhiều/trường nghĩa của ἐπουρανίοις.
  terminology: “Đấng Mê-si-a Giê-su” trung thành với quyết định dịch Χριστός như một tước hiệu và phù hợp văn phong trang trọng. Chú thích phương án “Đấng Christ Giê-su” là phù hợp. Tuy nhiên, chú thích cần nêu rõ đây là cách dịch thay thế của toàn cụm, chứ không chỉ của tước hiệu, để neo chú thích chính xác hơn.
  issues:
