source:
  edition: SBLGNT
  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: vi
  text: và đã khiến chúng ta sống lại cùng với Ngài, đã cho chúng ta ngồi cùng với Ngài ở các cõi trời trong Đấng Mê-si-a Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch cụm này là: “trong Đấng Christ Giê-su.”'
    reason: Cách diễn đạt thay thế cho cụm ἐν Χριστῷ Ἰησοῦ, dùng “Christ” thay cho “Mê-si-a” để biểu thị tước hiệu Χριστός.
lexical_decisions:
- source_word: συνήγειρεν
  choice: đã làm cho chúng ta cùng sống lại với Ngài
  rationale: Động từ ghép với tiền tố συν- diễn tả sự cùng tham dự với Đấng Christ trong việc sống lại. Tân ngữ “chúng ta” được bổ sung từ mạch câu trước, còn “với Ngài” làm rõ ý liên kết vốn có trong động từ.
- source_word: συνεκάθισεν
  choice: cùng cho chúng ta ngồi với Ngài
  rationale: Giữ ý căn bản là cho ngồi cùng với, tránh diễn giải quá mức thành “đồng trị vì” hay “đồng đăng quang,” dù ngữ cảnh có thể gợi đến sự tôn cao.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: ở các cõi trời
  rationale: Cụm đặc trưng trong thư Ê-phê-sô chỉ phạm vi thuộc trời. “Các cõi trời” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái không gian hoặc lĩnh vực của nguyên ngữ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Χριστός vẫn mang ý nghĩa tước hiệu tại đây; “Đấng Mê-si-a” truyền đạt nghĩa ấy thay vì chỉ phiên âm, còn “trong” giữ nguyên ngôn ngữ hiệp nhất đặc trưng của Phao-lô.
- source_word: καὶ
  choice: và / cùng
  rationale: Liên từ lặp lại nối các hành động của Đức Chúa Trời theo trình tự tích lũy; tiếng Việt dùng “và” rồi “cùng” để câu tự nhiên mà vẫn bảo toàn sự phối hợp.
theological_decisions:
- issue: Ngôn ngữ hiệp nhất với Đấng Christ trong hai động từ ghép
  choice: Diễn đạt rõ tiền tố συν- bằng “cùng… với Ngài” trong cả hai hành động.
  alternative: Chỉ dịch “làm cho chúng ta sống lại và cho chúng ta ngồi,” để mối liên kết ở dạng hàm ẩn.
  rationale: Cách chọn giữ trọng tâm của Phao-lô về việc các tín hữu cùng dự phần với Đấng Christ trong sự sống lại và được tôn cao, nhưng không thêm ý vượt quá hai động từ.
- issue: Χριστῷ là tước hiệu hay dạng gần như tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Bản dịch chính làm rõ nội dung tước hiệu của Χριστός; phương án quen thuộc “Đấng Christ” được ghi ở chú thích để không che khuất truyền thống thuật ngữ.
- issue: Ý nghĩa của việc “ngồi” ở các cõi trời
  choice: Giữ động từ trung tính “ngồi,” không chuyển thành “trị vì” hay “đăng quang.”
  alternative: “Cho chúng ta đồng trị vì với Ngài.”
  rationale: Nguyên ngữ nói trực tiếp đến việc cho ngồi cùng; ý cai trị có thể được suy ra theo ngữ cảnh nhưng không được phát biểu minh nhiên trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các cõi trời” được chọn thay cho cách quá sát chữ nhưng kém tự nhiên như “những nơi thuộc trời.” Đại từ “Ngài” chỉ Đấng Mê-si-a theo mạch văn trước; việc viết hoa phù hợp văn phong Kinh Thánh tiếng Việt.
