  text: not from works[a], so that no one may boast.
translation:
  language: vi
  text: không đến từ việc làm[a], để không ai khoe khoang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không do việc làm.” Cụm từ Hy Lạp nhấn mạnh nguồn gốc; theo sát chữ là “không từ việc làm.” Một số người cũng hiểu có sắc thái phương tiện: “không bởi việc làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ
  choice: không đến từ
  rationale: Giữ sắc thái nguồn gốc của ἐξ dưới sự phủ định οὐκ, đồng thời diễn đạt tự nhiên trong tiếng Việt và nối với mạch câu trước.
- source_word: ἔργων
  choice: việc làm
  rationale: Dịch rộng và sát nghĩa, không tự ý thu hẹp thành “việc làm theo luật pháp” hay mở rộng thành “nỗ lực của con người”.
- source_word: ἵνα μή τις
  choice: để không ai
  rationale: Diễn đạt rõ mệnh đề mục đích phủ định bằng tiếng Việt hiện đại.
- source_word: καυχήσηται
  choice: có thể khoe mình
  rationale: Giữ ý khoe khoang/tự hào về chính mình và phản ánh sắc thái khả hữu của thể giả định sau ἵνα.
theological_decisions:
- issue: Phạm vi ý nghĩa của “việc làm”
  choice: Giữ cụm từ rộng “việc làm”.
  alternative: “việc làm theo luật pháp”, “nỗ lực của con người”, hoặc “việc lành”
  rationale: Bản Hy Lạp chỉ nói ἔργων; thêm phạm vi cụ thể sẽ giải thích thay vì dịch và làm mất tính hàm súc của câu.
- issue: Sắc thái của ἐξ
  choice: 'Dịch theo nguồn gốc: “đến từ”.'
  alternative: “bởi/nhờ việc làm” theo sắc thái phương tiện
  rationale: ἐξ chủ yếu chỉ nguồn gốc; bản dịch giữ sắc thái ấy nhưng chú thích khả năng diễn đạt khác trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khoe mình” tự nhiên hơn lối nói quá cổ, đồng thời giữ trọng tâm của động từ Hy Lạp là sự khoe khoang về bản thân.
