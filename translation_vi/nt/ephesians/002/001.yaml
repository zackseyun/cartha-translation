  source_fidelity: 'Bản dịch phản ánh trung thành Καὶ ὑμᾶς ὄντας νεκρούς bằng một cấu trúc mở, giữ được tình trạng “chết” của người nhận thư và không tự ý bổ sung mệnh đề chính vốn chỉ xuất hiện ở câu 5. “Trong những vi phạm và tội lỗi của mình” diễn đạt thận trọng cách dữ τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ὑμῶν, không quyết định quá mức giữa sắc thái phạm vi và nguyên nhân. Điều này phù hợp với bản tiếng Anh POB: “And you were dead in your trespasses and sins,”.'
  naturalness: “Còn anh em, vốn đã chết trong những vi phạm và tội lỗi của mình—” là tiếng Việt hiện đại, trang trọng và dễ hiểu trong văn mạch thư tín. Dấu gạch ngang báo hiệu đúng rằng cấu trúc cú pháp còn tiếp diễn; nên được giữ nhất quán với cách xử lý các câu 2–5.
  terminology: “Anh em,” “chết,” “vi phạm,” và “tội lỗi” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Việc phân biệt “vi phạm” (παράπτωμα) với “tội lỗi” (ἁμαρτία) là hữu ích mà không tạo ra khác biệt thần học quá cứng.
