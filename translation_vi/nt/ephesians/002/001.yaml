source:
  edition: SBLGNT
  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: vi
  text: Còn anh em, vốn đã chết trong những vi phạm và tội lỗi của mình—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Còn
  rationale: Ở đây từ nối chuyển sự chú ý sang tình trạng trước kia của người đọc; “Còn” tự nhiên hơn “Và” trong tiếng Việt mà vẫn giữ mối liên kết với văn cảnh.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Đại từ số nhiều chỉ những người nhận thư; “anh em” là cách xưng hô trang trọng, tự nhiên trong thư tín Kinh Thánh.
- source_word: ὄντας νεκρούς
  choice: vốn đã chết
  rationale: Giữ hình ảnh thần học mạnh của νεκρός và phản ánh phân từ chỉ tình trạng có trước; dấu gạch ngang cho thấy câu còn tiếp sang các câu sau, thay vì biến phân từ thành một mệnh đề độc lập hoàn toàn.
- source_word: τοῖς παραπτώμασιν
  choice: trong những vi phạm
  rationale: “Vi phạm” diễn đạt hành vi bước lệch hoặc phạm điều sai trái; “trong” giữ sắc thái trạng thái/phạm vi của cách dữ cách mà không ép nó chỉ mang nghĩa nguyên nhân.
- source_word: ταῖς ἁμαρτίαις
  choice: tội lỗi
  rationale: Cách dịch thông dụng, rõ ràng của ἁμαρτία, phân biệt vừa đủ với “vi phạm”.
- source_word: ὑμῶν
  choice: của mình
  rationale: Nêu rõ đây là những vi phạm và tội lỗi của chính những người được nói đến, đồng thời tránh lặp đại từ thiếu tự nhiên.
theological_decisions:
- issue: Quan hệ của “vi phạm và tội lỗi” với tình trạng “chết”
  choice: trong những vi phạm và tội lỗi
  alternative: vì những vi phạm và tội lỗi
  rationale: Cách dữ cách Hy Lạp có thể được hiểu theo phạm vi/trạng thái hoặc nguyên nhân. “Trong” bảo tồn hình ảnh người đọc sống trong lãnh vực tội lỗi và không loại trừ liên hệ nguyên nhân, thay vì quyết định dứt khoát bằng “vì”.
- issue: Cấu trúc câu chưa hoàn tất ở câu 1
  choice: Giữ cấu trúc mở bằng dấu gạch ngang
  alternative: Anh em đã chết trong những vi phạm và tội lỗi của mình.
  rationale: ὄντας là phân từ phụ thuộc, và mệnh đề chính chỉ xuất hiện ở câu 5. Giữ câu mở phản ánh cú pháp và sức căng của nguyên văn, không âm thầm cung cấp một động từ chính riêng cho câu 1.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ phép ẩn dụ “chết” và cấu trúc kéo dài của câu Hy Lạp; nên đọc EPH.2.1 cùng các câu 2–5 để hoàn chỉnh cú pháp.
