id: EPH.2.19
reference: Ephesians 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: vi
  text: Vậy thì, anh chị em không còn là người xa lạ và người ngoại kiều[a], nhưng là đồng công dân với các thánh[b] và thuộc gia đình của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người ngoại kiều” chỉ người nước ngoài cư trú tại một nơi nhưng không có đầy đủ địa vị công dân.
    reason: lexical_alternative
  - marker: b
    text: “Các thánh” ở đây chỉ dân thánh của Đức Chúa Trời, không phải chỉ một hạng người đặc biệt được phong thánh.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy nên
  rationale: Cụm từ suy luận kép nhấn mạnh kết luận rút ra từ lập luận trước đó; “Vậy nên” tự nhiên và giữ rõ quan hệ kết luận.
- source_word: οὐκέτι
  choice: không còn
  rationale: Diễn đạt tự nhiên sự chấm dứt của địa vị trước kia.
- source_word: ξένοι
  choice: người xa lạ
  rationale: Giữ ý về những người không thuộc về cộng đồng, đồng thời tạo thế tương phản với hình ảnh “người trong nhà” ở cuối câu.
- source_word: πάροικοι
  choice: ngoại kiều
  rationale: Chỉ người nước ngoài cư trú tại một nơi nhưng không có đầy đủ địa vị công dân; từ này giữ được sắc thái xã hội-pháp lý của tiếng Hy Lạp.
- source_word: συμπολῖται
  choice: những người đồng hương
  rationale: Diễn đạt việc cùng chung tư cách công dân với một cộng đồng; trong tiếng Việt, “đồng hương với” tự nhiên hơn “đồng công dân với” trong câu này.
- source_word: τῶν ἁγίων
  choice: với các thánh đồ
  rationale: Dùng quan hệ kết hợp sau συμπολῖται và giữ thuật ngữ Kinh Thánh có phạm vi rộng, không thu hẹp đối tượng ngay trong chính văn.
- source_word: οἰκεῖοι
  choice: người trong nhà
  rationale: Thể hiện người thuộc về một gia đình/hộ gia đình, giữ hình ảnh gần gũi và tự nhiên của nguyên văn.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Thể hiện sở hữu cách một cách rõ ràng, trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là “các thánh đồ” (τῶν ἁγίων)
  choice: Giữ “các thánh đồ” trong chính văn, hiểu rộng là dân thánh của Đức Chúa Trời
  alternative: các thiên sứ; riêng các tín hữu Do Thái; toàn thể các tín hữu
  rationale: Ngữ cảnh nói về việc dân ngoại được hội nhập vào dân và nhà của Đức Chúa Trời. Bản dịch không thu hẹp đối tượng vào một cách giải thích riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện số nhiều ngôi thứ hai và giọng trực tiếp với cộng đồng. Giữ hai ẩn dụ chuyển tiếp từ địa vị công dân sang gia đình.
