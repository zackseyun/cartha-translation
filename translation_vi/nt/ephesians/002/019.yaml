revisions:
- from: Vậy nên, anh chị em không còn là người xa lạ và ngoại kiều[a], nhưng là những người đồng hương với các thánh đồ[b] và là người trong nhà của Đức Chúa Trời.
  to: Vậy thì, anh chị em không còn là người xa lạ và người ngoại kiều[a], nhưng là đồng công dân với các thánh[b] và thuộc gia đình của Đức Chúa Trời.
  rationale: Sửa “đồng hương” thành “đồng công dân” để phản ánh chính xác συμπολῖται. Đổi “các thánh đồ” thành “các thánh” là cách gọi ngắn gọn, hiện hành và vẫn không thu hẹp đối tượng của ἁγίων; chú thích duy trì phần làm rõ cần thiết. “Thuộc gia đình của Đức Chúa Trời” làm rõ quan hệ thuộc về trong οἰκεῖοι mà vẫn giữ hình ảnh gia đình của nguyên văn.
  reviewer_model: gpt-5.6-terra
