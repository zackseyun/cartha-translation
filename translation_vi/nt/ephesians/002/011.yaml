id: EPH.2.11
reference: Ephesians 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: vi
  text: Vì vậy, hãy nhớ rằng trước kia anh chị em, là những người ngoại về phần xác[a], bị những người được gọi là “cắt bì”[c]—việc cắt bì do tay người thực hiện trên thân thể—gọi là “không cắt bì”[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Về phần xác” nói đến thân thể và địa vị sắc tộc-xã hội của họ, không có nghĩa là “theo bản tính tội lỗi.”
    reason: lexical_clarification
  - marker: b
    text: “Không cắt bì” và “cắt bì” ở đây là các nhãn gọi tập thể mang ý nghĩa sắc tộc và giao ước, chứ không chỉ là những mô tả về thân thể.
    reason: cultural_note
  - marker: c
    text: Nguyên văn cũng có thể dịch sát hơn là “bởi điều được gọi là ‘cắt bì,’ được làm bằng tay trong phần xác.” Cách diễn đạt của Phao-lô có thể hàm ý phê bình việc chỉ dựa vào dấu hiệu cắt bì bên ngoài.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Vì thế
  rationale: Đánh dấu kết luận suy ra từ phần trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: μνημονεύετε
  choice: hãy nhớ rằng
  rationale: Truyền đạt rõ mệnh lệnh số nhiều; không diễn giải quá mức sắc thái tiếp diễn của thì hiện tại.
- source_word: ποτὲ ὑμεῖς
  choice: trước kia anh chị em
  rationale: Giữ sự tương phản về thời gian và nhấn vào chính các độc giả.
- source_word: τὰ ἔθνη ἐν σαρκί
  choice: những người thuộc các dân ngoại theo phần xác
  rationale: Trong thế đối lập Do Thái–dân ngoại, τὰ ἔθνη chỉ người không thuộc dân Do Thái; “theo phần xác” giữ nghĩa thân thể và địa vị sắc tộc-xã hội, không biến σάρξ thành bản tính tội lỗi.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: bị ... gọi là “hạng không cắt bì”
  rationale: Giữ hành động gán nhãn từ bên ngoài; “hạng” cho thấy đây là cách gọi một tập thể chứ không chỉ mô tả giải phẫu.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: bị những người thuộc cái gọi là “phép cắt bì” ... gọi
  rationale: Danh từ trừu tượng “cắt bì” được dùng để chỉ tập thể người chịu cắt bì. Cụm “cái gọi là” giữ khoảng cách tu từ của λεγομένης mà không làm giọng điệu trở nên miệt thị.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: phép cắt bì do tay người thực hiện trên thân thể
  rationale: Diễn đạt rõ χειροποίητος là do tay người làm và ἐν σαρκί là trên thân thể; cụm này bổ nghĩa chặt chẽ cho phép cắt bì.
theological_decisions:
- issue: Nghĩa của σάρξ trong ngữ cảnh này
  choice: theo phần xác / trên thân thể
  alternative: theo bản tính tội lỗi
  rationale: Câu này nói đến dấu hiệu thân thể và địa vị sắc tộc-giao ước, không nói đến sự sa ngã đạo đức; vì vậy không được chuyển σάρξ thành “bản tính tội lỗi.”
- issue: Tính chất của các danh xưng “cắt bì” và “không cắt bì”
  choice: Giữ cả hai như nhãn gọi tập thể trong dấu ngoặc kép
  alternative: Diễn giải trực tiếp thành “người Do Thái” và “người ngoại bang”
  rationale: Các thuật ngữ mang cả nội dung thân thể, sắc tộc và giao ước. Giữ hình ảnh gốc bảo toàn sức căng trong lập luận của Phao-lô.
- issue: Sắc thái của λεγομένης trước περιτομῆς
  choice: cái gọi là “phép cắt bì”
  alternative: những người đã chịu cắt bì
  rationale: Lặp lại ý “được gọi” phản ánh khoảng cách tu từ của nguyên văn và có thể ngụ ý phê bình việc dựa vào dấu hiệu bên ngoài, nhưng bản dịch không khẳng định một giọng mỉa mai mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “anh chị em” cho đại từ số nhiều hướng đến cộng đồng độc giả; dùng dấu gạch ngang cuối câu vì cú pháp và ý tưởng tiếp tục sang câu 12. Cấu trúc được điều chỉnh vừa đủ để tiếng Việt tự nhiên trong khi vẫn giữ sự lặp lại có chủ ý của các nhãn “cắt bì/không cắt bì” và khoảng cách tu từ của “cái gọi là.”
