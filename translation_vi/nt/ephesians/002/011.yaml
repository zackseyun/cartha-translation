revisions:
- from: Vì thế, hãy nhớ rằng trước kia anh chị em—những người thuộc các dân ngoại theo phần xác[a]—bị những người thuộc cái gọi là “phép cắt bì”[c], tức phép cắt bì do tay người thực hiện trên thân thể, gọi là “hạng không cắt bì”[b]—
  to: Vì vậy, hãy nhớ rằng trước kia anh chị em, là những người ngoại về phần xác[a], bị những người được gọi là “cắt bì”[c]—việc cắt bì do tay người thực hiện trên thân thể—gọi là “không cắt bì”[b]—
  rationale: Bản sửa giữ trật tự lập luận và câu dở dang nối sang câu 12, đồng thời làm cho tiếng Việt tự nhiên hơn. Nó chuyển τὰ ἔθνη thành “người ngoại,” duy trì nghĩa không-đạo-đức của σάρξ bằng “về phần xác,” bỏ sắc thái thừa trong “hạng,” và thể hiện περιτομή như một danh xưng tập thể. Phần chú thích c vẫn nêu khả năng dịch sát và mức độ phê bình có thể có, không khẳng định quá mức.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:16:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng mạch cú pháp và các thuật ngữ chính, nhưng “những người thuộc các dân ngoại theo phần xác” không tự nhiên và “hạng không cắt bì” thêm sắc thái miệt thị không có trong nguyên văn. Cụm “những người thuộc cái gọi là ‘phép cắt bì’” cũng làm mờ việc περιτομή là nhãn gọi tập thể cho nhóm người chịu cắt bì.
  naturalness: Nên dùng “người ngoại về phần xác” và “những người được gọi là ‘cắt bì’” để tiếng Việt hiện đại, rõ quan hệ chủ–bị và vẫn bảo toàn tính chất nhãn gọi của hai thuật ngữ.
  terminology: Dùng “người ngoại” cho τὰ ἔθνη trong đối lập Do Thái/người ngoại; giữ “phần xác,” “cắt bì,” và “không cắt bì.” “Được gọi là” ở cả hai vế chuyển đạt sự lặp lại của λεγόμενοι/λεγομένης mà không áp đặt một giọng mỉa mai mạnh hơn văn bản.
  issues:
  - severity: medium
    issue: “những người thuộc các dân ngoại theo phần xác” là cấu trúc không tự nhiên và không rõ nghĩa trong tiếng Việt.
    rationale: τὰ ἔθνη chỉ người ngoại trong ngữ cảnh này; “người ngoại về phần xác” vừa rõ vừa giữ ἐν σαρκί trong nghĩa thân thể/sắc tộc.
  - severity: medium
    issue: “hạng không cắt bì” thêm sắc thái khinh miệt.
    rationale: ἀκροβυστία là một nhãn gọi tập thể có thể mang tính đối kháng trong bối cảnh, nhưng bản thân từ ngữ không đòi hỏi thêm “hạng.” Dấu ngoặc kép và cấu trúc bị động đã đủ bảo toàn sắc thái gán nhãn.
  - severity: low
    issue: “những người thuộc cái gọi là ‘phép cắt bì’” diễn đạt vòng và làm yếu chức năng tập thể của περιτομή.
    rationale: Danh từ trừu tượng này được dùng để chỉ nhóm người; “những người được gọi là ‘cắt bì’” phản ánh cách dùng ấy và duy trì sự đối xứng với “được gọi là ‘không cắt bì.’”
