  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: chuyển ý thời gian-đối lập (νυνὶ δέ), quan hệ “trong Đấng Mê-si-a Giê-su,” tình trạng quá khứ “ở xa,” sự chuyển biến “đã trở nên gần,” và phương tiện “nhờ huyết của Đấng Mê-si-a.” “Đã trở nên gần” phản ánh trực tiếp ἐγενήθητε ἐγγύς mà không thêm tác nhân.'
  naturalness: Cần chỉnh nhẹ trật tự và dấu câu. Cụm “anh chị em là những người trước kia ở xa, đã...” dễ tạo cảm giác mệnh đề quan hệ nối không mượt. “Anh chị em, vốn trước kia ở xa, nay đã...” tự nhiên hơn trong tiếng Việt chuẩn và làm rõ tương phản thời gian. Các ký hiệu chú thích cũng nên đặt ngay sau đơn vị từ ngữ mà chúng chú giải.
  terminology: “Đấng Mê-si-a,” “Giê-su,” và “huyết” phù hợp với đăng ký trang trọng hiện đại và nhất quán trong câu. Chú thích về “Đấng Christ” bảo lưu cách dịch truyền thống mà không thay đổi cách dịch chính. Không cần thêm diễn giải chuộc tội.
  issues:
