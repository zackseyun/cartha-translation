source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: vi
  text: 'Nhưng giờ đây, trong Đấng Mê-si-a[a] Giê-su, anh chị em, vốn trước kia ở xa, nay đã trở nên gần[b] nhờ huyết của Đấng Mê-si-a.[c]


    [a] Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu.”


    [b] Cũng có thể dịch là “đã được đem đến gần.”


    [c] Cũng có thể dịch là “trong huyết” hoặc “bởi huyết của Đấng Mê-si-a.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã được đem đến gần.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “trong huyết” hoặc “bởi huyết của Đấng Mê-si-a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Nhưng giờ đây
  rationale: Giữ cả sắc thái chuyển ý đối lập của δέ và điểm nhấn thời gian của νυνί.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong,” vốn diễn đạt ngôn ngữ kết hợp/thuộc về của Phao-lô; dịch Χριστός theo nghĩa tước hiệu.
- source_word: ὑμεῖς οἵ ποτε ὄντες μακρὰν
  choice: anh chị em là những người trước kia ở xa
  rationale: Diễn đạt tự nhiên đại từ số nhiều cùng mệnh đề quan hệ, đồng thời giữ sự tương phản với tình trạng trước kia.
- source_word: ἐγενήθητε ἐγγὺς
  choice: đã trở nên gần
  rationale: Phản ánh trực tiếp nghĩa “trở nên” của γίνομαι mà không tự ý xác định tác nhân; phương án bị động được ghi ở chú thích.
- source_word: ἐν τῷ αἵματι
  choice: nhờ huyết
  rationale: Trong ngữ cảnh, ἐν có thể chỉ phương tiện; “nhờ” tự nhiên trong tiếng Việt và không triển khai thêm một lý thuyết chuộc tội ngoài câu chữ.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu, nhất quán với lần xuất hiện trước trong câu.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός mang chức năng tước hiệu trong câu; “Đấng Mê-si-a” truyền đạt nghĩa của tước hiệu, còn cách gọi truyền thống được bảo lưu trong chú thích.
- issue: Sắc thái của ἐγενήθητε ἐγγὺς
  choice: đã trở nên gần
  alternative: đã được đem đến gần
  rationale: Bản chính giữ dạng diễn đạt không nêu rõ tác nhân của động từ Hy Lạp, tránh làm hiển ngôn tác nhân hàm ẩn; phương án bị động vẫn được ghi nhận.
- issue: Chức năng của ἐν τῷ αἵματι τοῦ Χριστοῦ
  choice: nhờ huyết của Đấng Mê-si-a
  alternative: trong huyết / bởi huyết của Đấng Mê-si-a
  rationale: “Nhờ” diễn đạt cách hiểu chỉ phương tiện phù hợp với ngữ cảnh, trong khi chú thích bảo lưu khả năng hiểu gần với nghĩa phạm vi hoặc phương tiện khác của ἐν.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ὑμεῖς nhằm chỉ cộng đồng độc giả số nhiều; giữ thuật ngữ Kinh Thánh “huyết” vì sắc thái nghi lễ-thần học của αἷμα, đồng thời tránh lối văn quá cổ.
