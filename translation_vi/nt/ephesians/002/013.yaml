    rationale: “Anh chị em là những người trước kia ở xa, đã trở nên gần” có thể đọc như một cấu trúc gượng. Dùng mệnh đề chen giữa “vốn trước kia ở xa” và thêm “nay” thể hiện rõ nét đối lập thời gian trong nguyên văn.
  - severity: low
