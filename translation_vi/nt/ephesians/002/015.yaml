id: EPH.2.15
reference: Ephesians 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸν νόμον τῶν ἐντολῶν ἐν δόγμασιν καταργήσας, ἵνα τοὺς δύο κτίσῃ ἐν ⸀αὑτῷ εἰς ἕνα καινὸν ἄνθρωπον ποιῶν εἰρήνην,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/015.yaml
  text: having abolished the law of commandments expressed in decrees, so that he might create the two into one new man in himself, making peace,
translation:
  language: vi
  text: Ngài đã bãi bỏ luật pháp gồm các điều răn được quy định trong các sắc lệnh,[a] để Ngài tạo dựng hai bên trong chính Ngài thành một người mới,[b] làm nên hòa bình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các sắc lệnh,” “bao gồm các sắc lệnh,” hoặc theo cách dịch truyền thống: “trong các điều lệ.”'
    reason: lexical_alternative
  - marker: b
    text: '“Một người mới” là hình ảnh tập thể ở số ít; cũng có thể dịch: “một nhân loại mới.” Cả cụm cũng có thể sắp xếp: “để Ngài tạo dựng hai bên thành một người mới trong chính Ngài.”'
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: νόμον τῶν ἐντολῶν
  choice: luật pháp gồm các điều răn
  rationale: Giữ quan hệ bổ nghĩa của nguyên văn và sắc thái giao ước của ἐντολῶν, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν δόγμασιν
  choice: được quy định trong các sắc lệnh
  rationale: δόγμα chỉ sắc lệnh hay quy định. Cách dịch này diễn tả quan hệ có thể hiểu giữa cụm từ này với 'các điều răn' mà không thu hẹp thành các nghi thức.
- source_word: καταργήσας
  choice: đã bãi bỏ
  rationale: Truyền đạt hành động dứt khoát của phân từ bất định quá khứ; đối tượng được xác định cụ thể là luật pháp gồm các điều răn được quy định trong các sắc lệnh.
- source_word: τοὺς δύο
  choice: hai bên
  rationale: Giữ ý chỉ hai nhóm—người Do Thái và dân ngoại—trong văn cảnh; 'hai bên' tự nhiên hơn 'hai người' và không biến họ thành hai cá nhân.
- source_word: κτίσῃ
  choice: tạo dựng
  rationale: Bảo tồn sắc thái sáng tạo mới mạnh mẽ của κτίζω.
- source_word: ἐν αὑτῷ
  choice: trong chính mình
  rationale: 'Thể hiện đại từ phản thân và giữ sự mơ hồ có thật về quan hệ cú pháp: việc tạo dựng diễn ra trong chính Đấng Christ.'
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: thành một người mới
  rationale: Giữ hình ảnh số ít của nguyên văn; 'người' trong tiếng Việt vừa tự nhiên vừa có thể mang ý nghĩa đại diện, tập thể.
- source_word: ποιῶν εἰρήνην
  choice: qua đó kiến tạo hòa bình
  rationale: Diễn đạt phân từ hiện tại như kết quả gắn với hành động tạo dựng, đồng thời giữ động thái chủ động của ποιῶν.
theological_decisions:
- issue: Hình ảnh tập thể của ἕνα καινὸν ἄνθρωπον
  choice: một người mới
  alternative: một nhân loại mới
  rationale: '''Một người mới'' giữ hình ảnh số ít trong tiếng Hy Lạp và không giải nghĩa sẵn tính tập thể; chú thích nêu cách hiểu thay thế.'
- issue: Mức độ mạnh của καταργήσας đối với luật pháp
  choice: đã bãi bỏ
  alternative: đã làm cho vô hiệu
  rationale: Giữ sức mạnh của động từ trong văn cảnh, nhưng không mở rộng đối tượng vượt quá cụm từ cụ thể 'luật pháp gồm các điều răn được quy định trong các sắc lệnh'.
- issue: Vị trí và phạm vi của ἐν αὑτῷ
  choice: để trong chính mình, Ngài tạo dựng hai bên thành một người mới
  alternative: để Ngài tạo dựng hai bên thành một người mới trong chính mình
  rationale: Theo sát trật tự Hy Lạp và liên kết 'trong chính mình' với hành động tạo dựng; phương án khác cũng hợp cú pháp và được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng 'Ngài' để chỉ Đấng Christ theo văn cảnh. 'Sắc lệnh' giữ sắc thái pháp lý; 'tạo dựng' gợi ý sự sáng tạo mới; tránh diễn giải giáo phái về phạm vi của việc bãi bỏ luật pháp.
