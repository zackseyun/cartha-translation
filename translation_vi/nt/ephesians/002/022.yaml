source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: vi
  text: Trong Đấng ấy[a], anh chị em cũng đang được xây dựng chung thành nơi ngự của Đức Chúa Trời trong Thánh Linh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Trong toàn bộ tòa nhà ấy,” nếu đại từ quan hệ được hiểu là quy về toàn bộ công trình kiến trúc thay vì trực tiếp quy về Đấng Christ.
    reason: alternative_reading
  - marker: b
    text: Hoặc “trong tâm linh” hay “bởi Thánh Linh.” Cụm từ này có thể chỉ phạm vi nơi Đức Chúa Trời ngự hoặc tác động của Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Đấng ấy
  rationale: Đại từ quan hệ số ít ở cách dữ cách tự nhiên nhất quy về Đấng Christ trong mạch văn trước đó. Cách dịch này giữ trọng tâm quy hướng về Đấng Christ, đồng thời ghi nhận khả năng quy về toàn bộ công trình trong chú thích.
- source_word: καὶ ὑμεῖς
  choice: anh chị em cũng
  rationale: καί mang ý bổ sung, còn ὑμεῖς là đại từ số nhiều được nêu rõ để nhấn mạnh. “Anh chị em” diễn đạt trực tiếp và tự nhiên số nhiều trong tiếng Việt hiện đại.
- source_word: συνοικοδομεῖσθε
  choice: đang được cùng nhau xây dựng
  rationale: Động từ hiện tại, bị động, ngôi thứ hai số nhiều diễn tả tiến trình đang tiếp diễn; tiền tố σύν được thể hiện bằng “cùng nhau”.
- source_word: εἰς κατοικητήριον
  choice: thành nơi ngự
  rationale: εἰς chỉ mục tiêu hoặc kết quả, được diễn đạt tự nhiên bằng “thành”; κατοικητήριον là nơi cư ngụ, và “nơi ngự” phù hợp với chủ thể là Đức Chúa Trời, đồng thời giữ hình ảnh đền thờ.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch sát sở hữu cách và để ngữ cảnh cho thấy Đức Chúa Trời là Đấng ngự tại đó; cách nói này cũng tự nhiên trong tiếng Việt.
- source_word: ἐν πνεύματι
  choice: trong Thánh Linh
  rationale: Trong bối cảnh đền thờ và sự hiện diện của Đức Chúa Trời, πνεύματι nhiều khả năng chỉ Thánh Linh. Giữ giới từ “trong” nhằm không thu hẹp sắc thái thành phương tiện בלבד.
theological_decisions:
- issue: Đối tượng mà ἐν ᾧ quy chiếu
  choice: 'Quy về Đấng Christ: “Trong Đấng ấy”'
  alternative: 'Quy về toàn bộ công trình: “Trong công trình ấy”'
  rationale: Mạch văn gần nhất đặt sự kết hợp và tăng trưởng của công trình trong Đấng Christ. Tuy vậy, hình thái và hình ảnh kiến trúc vẫn cho phép cách hiểu quy về công trình, nên được bảo lưu trong chú thích.
- issue: Ý nghĩa của ἐν πνεύματι
  choice: Chỉ Thánh Linh, với cách dịch “trong Thánh Linh”
  alternative: “trong tâm linh” hoặc “bởi Thánh Linh”
  rationale: Ngôn ngữ về đền thờ và nơi Đức Chúa Trời ngự trong thư Ê-phê-sô ủng hộ việc hiểu đây là Thánh Linh. Giới từ “trong” giữ được khả năng chỉ phạm vi, sự hiện diện hoặc tác động mà không buộc câu chỉ mang nghĩa công cụ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Anh chị em” làm rõ đại từ số nhiều; “nơi ngự” giữ hình ảnh đền thờ mà không mang sắc thái cổ quá mức. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
