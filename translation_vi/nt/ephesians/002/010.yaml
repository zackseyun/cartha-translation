id: EPH.2.10
reference: Ephesians 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: vi
  text: Vì chúng ta là tác phẩm của Ngài, được tạo dựng trong Đấng Mê-si-a[a] Giê-su để thực hiện những việc lành mà Đức Chúa Trời đã chuẩn bị từ trước, hầu cho chúng ta bước đi trong những việc ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.” Từ Hy Lạp Χριστός là một danh hiệu, nghĩa là “Đấng được xức dầu,” tương đương với “Đấng Mê-si-a.”
    reason: alternative_reading
  - marker: b
    text: “Bước đi” là hình ảnh chỉ cách một người sống và cư xử.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίημα
  choice: tác phẩm
  rationale: Diễn đạt điều do Đức Chúa Trời làm nên, giữ được hình ảnh về sản phẩm do Ngài tạo tác mà không mang sắc thái máy móc.
- source_word: κτισθέντες
  choice: được tạo dựng
  rationale: Giữ thể bị động và ý nghĩa sáng tạo của κτίζω, đồng thời nối tự nhiên với mệnh đề “chúng ta là tác phẩm của Ngài.”
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ ἐν là “trong” và chuyển Χριστός theo nghĩa danh hiệu “Đấng Mê-si-a,” thay vì xem như một phần của tên riêng.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: để thực hiện những việc lành
  rationale: Diễn đạt tự nhiên ý hướng đích của ἐπί với tặng cách trong tiếng Việt; “những việc lành” giữ trọng tâm đạo đức của ἔργα ἀγαθά.
- source_word: προητοίμασεν
  choice: đã chuẩn bị từ trước
  rationale: Thể hiện rõ sắc thái thời gian của tiền tố προ- mà không thêm một hệ thống thần học ngoài câu văn.
- source_word: ἐν αὐτοῖς περιπατήσωμεν
  choice: chúng ta bước đi trong những việc ấy
  rationale: Giữ ẩn dụ “bước đi” đặc trưng của Phao-lô và quy chiếu “những việc ấy” về các việc lành; chú thích giải thích nghĩa lối sống.
- source_word: γάρ
  choice: Vì
  rationale: Duy trì quan hệ giải thích với lời khẳng định về ân điển và đức tin trong văn mạch trước.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ tôn kính, tự nhiên trong văn phong Kinh Thánh tiếng Việt, quy chiếu về Đức Chúa Trời.
theological_decisions:
- issue: Χριστός được hiểu là danh hiệu hay dạng gần như tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Cách chọn này chuyển tải nghĩa danh hiệu “Đấng được xức dầu” và sự kết hợp với Ngài, thay vì chỉ phiên âm theo truyền thống.
- issue: Quan hệ giữa sự chuẩn bị của Đức Chúa Trời và cách sống của con người
  choice: những việc lành mà Đức Chúa Trời đã chuẩn bị từ trước, hầu cho chúng ta bước đi trong những việc ấy
  alternative: những việc lành mà Đức Chúa Trời đã chuẩn bị từ trước để chúng ta thực hiện
  rationale: Giữ đồng thời sáng kiến của Đức Chúa Trời và mục đích con người sống trong sự vâng phục, nhưng không giải quyết thay bản văn các tranh luận rộng hơn về tiền định hay ý chí con người.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ các thuật ngữ quen thuộc “Đức Chúa Trời,” “việc lành” và ẩn dụ “bước đi”; dùng “hầu cho” để biểu đạt mục đích với sắc thái trang nghiêm mà vẫn rõ nghĩa.
