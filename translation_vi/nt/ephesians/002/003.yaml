id: EPH.2.3
reference: Ephesians 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: vi
  text: Trong số họ,[a] tất cả chúng ta cũng đã từng sống theo những ham muốn của xác thịt mình, làm theo những ý muốn của xác thịt và của tâm trí, và tự bản tính, chúng ta là con cái của cơn thịnh nộ,[b] cũng như những người còn lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “trong đó”. Đại từ Hy Lạp có thể chỉ phạm vi của sự không vâng phục hoặc những người được đặc trưng bởi sự không vâng phục; “trong số họ” hiểu theo những người ấy trong ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “những người phải chịu cơn thịnh nộ”. “Con cái của cơn thịnh nộ” là cách dịch sát thành ngữ Hy Lạp.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: Trong số họ
  rationale: Đại từ quan hệ số nhiều có thể quy chiếu về những người vừa được nhắc đến; cách dịch này tự nhiên trong tiếng Việt và giữ cách hiểu mang tính cá nhân theo ngữ cảnh.
- source_word: ἀνεστράφημέν
  choice: sống
  rationale: Động từ chỉ cách cư xử hay nếp sống; “sống” là cách diễn đạt hiện đại, tự nhiên.
- source_word: ἐπιθυμίαις
  choice: những ham muốn
  rationale: Diễn đạt những khao khát lệch lạc mà không thu hẹp nghĩa vào dục vọng tình dục.
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ thuật ngữ đặc trưng của Phao-lô và sắc thái nhân học–đạo đức, thay vì diễn giải hẹp thành “bản tính tội lỗi”.
- source_word: ποιοῦντες τὰ θελήματα
  choice: làm theo những điều ... muốn
  rationale: Diễn đạt tự nhiên hành động thực hiện các ý muốn, đồng thời phân biệt θέλημα với ἐπιθυμία.
- source_word: διανοιῶν
  choice: các ý tưởng
  rationale: Số nhiều chỉ những ý nghĩ, khuynh hướng hay định hướng tinh thần; “các ý tưởng” giữ sắc thái số nhiều và dễ hiểu.
- source_word: τέκνα ὀργῆς
  choice: con cái của cơn thịnh nộ
  rationale: Giữ nguyên thành ngữ Hy Lạp mang sắc thái Semit, không vội diễn giải thành “đối tượng chịu thịnh nộ”.
- source_word: φύσει
  choice: tự bản tính
  rationale: Giữ ý nghĩa “theo bản tính” mà không giới hạn thành “do sinh ra”.
- source_word: οἱ λοιποί
  choice: những người còn lại
  rationale: Cách nói tự nhiên, giữ sự so sánh với phần nhân loại còn lại.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong ngữ cảnh đạo đức của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo tồn từ ngữ và độ căng thần học của nguyên văn; “bản tính tội lỗi” sẽ giải thích nhân học của Phao-lô theo hướng hẹp hơn.
- issue: Sức nặng của τέκνα φύσει ὀργῆς
  choice: tự bản tính chúng ta là con cái của cơn thịnh nộ
  alternative: do sinh ra chúng ta là những đối tượng chịu cơn thịnh nộ
  rationale: Cách dịch chính giữ thành ngữ và sự mơ hồ thực sự về tình trạng, đặc tính hay trách nhiệm chịu phán xét, không hệ thống hóa câu theo một lập trường giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “xác thịt” và “con cái của cơn thịnh nộ” để bảo tồn thuật ngữ cùng độ căng thần học của nguyên văn.
