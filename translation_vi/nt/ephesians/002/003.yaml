revisions:
- from: Trong số họ, tất cả chúng ta trước kia cũng từng sống theo những ham muốn của xác thịt mình, làm theo những điều xác thịt và các ý tưởng muốn, và tự bản tính chúng ta là con cái của cơn thịnh nộ,[a] cũng như những người còn lại.
  to: Trong số họ,[a] tất cả chúng ta cũng đã từng sống theo những ham muốn của xác thịt mình, làm theo những ý muốn của xác thịt và của tâm trí, và tự bản tính, chúng ta là con cái của cơn thịnh nộ,[b] cũng như những người còn lại.
  rationale: Sửa cụm diễn đạt sai và khó hiểu về “những ý muốn của xác thịt và của tâm trí” để phản ánh đúng cấu trúc Hy Lạp, thay “các ý tưởng” bằng “tâm trí,” và bổ sung chú thích cho cách quy chiếu có tranh luận của ἐν οἷς. Các thuật ngữ thần học chủ chốt được giữ nguyên.
