reference: Ephesians 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: vi
  text: Vì chính Ngài là sự bình an của chúng ta, Đấng đã làm cho cả hai thành một và đã phá đổ bức tường ngăn cách—tức là sự thù nghịch—trong xác thịt Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “trong xác thịt Ngài” theo trật tự từ Hy Lạp cũng có thể được gắn trực tiếp với “sự thù nghịch”. Cách trình bày ở đây hiểu cụm ấy nói về việc Ngài phá đổ sự ngăn cách trong xác thịt hữu hình của Ngài; văn cảnh tiếp theo liên hệ điều này với thập tự giá.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: 'Giữ sắc thái nhấn mạnh của đại từ: chính Đấng Christ là sự bình an của chúng ta.'
- source_word: γάρ
  choice: Vì
  rationale: Giữ liên kết giải thích với mệnh đề trước.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: sự bình an của chúng ta
  rationale: Cách diễn đạt tự nhiên, đồng thời giữ hình ảnh Đấng Christ chính là sự bình an.
- source_word: τὰ ἀμφότερα ἓν
  choice: làm cho cả hai nên một
  rationale: Giữ nguyên sự hàm ẩn của “cả hai”; văn cảnh cho thấy đó là người Do Thái và dân ngoại.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: bức tường ngăn cách
  rationale: Hai danh từ Hy Lạp cùng mô tả một bức tường làm hàng rào phân cách; tiếng Việt gọn và tự nhiên hơn khi diễn đạt bằng cụm này.
- source_word: λύσας
  choice: phá đổ
  rationale: Phù hợp với hình ảnh một bức tường bị dỡ bỏ.
- source_word: τὴν ἔχθραν
  choice: sự thù nghịch
  rationale: Giữ danh từ trừu tượng chỉ tình trạng đối nghịch; đặt giữa hai dấu gạch ngang như lời giải thích cho bức tường ngăn cách.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: trong thân xác Ngài
  rationale: Trong tiếng Việt hiện đại, “thân xác” truyền đạt nghĩa thân thể hữu hình của Đấng Christ rõ hơn “xác thịt”, mà không biến cụm từ thành một lời giải nghĩa đầy đủ về sự chết của Ngài.
theological_decisions:
- issue: Đối tượng của “cả hai”
  choice: Để là “cả hai” trong chính văn
  alternative: Nói rõ “cả hai nhóm” hoặc “người Do Thái và dân ngoại”
  rationale: Hy Lạp để đối tượng hàm ẩn, còn văn cảnh gần xác định đó là người Do Thái và dân ngoại; bản dịch giữ cách nói của câu gốc mà không làm mất khả năng nhận biết từ văn cảnh.
- issue: Quan hệ cú pháp của “sự thù nghịch”
  choice: Xem như thành phần giải thích cho “bức tường ngăn cách”
  alternative: Gắn “sự thù nghịch” với câu kế tiếp hoặc xem là một tân ngữ riêng
  rationale: Hai dấu gạch ngang bảo tồn lối diễn đạt dồn tiếp của Hy Lạp và tránh hiểu rằng sự thù nghịch nằm trong thân xác Đấng Christ.
- issue: Ý nghĩa của ἐν τῇ σαρκὶ αὐτοῦ
  choice: Dịch “trong thân xác Ngài” và để cụm này bổ nghĩa cho hành động phá đổ
  alternative: “bởi thân xác Ngài”, “trong xác thịt Ngài” hoặc giải nghĩa “qua sự chết thân thể của Ngài”
  rationale: Cách dịch giữ sự căng thẳng cú pháp và tính cụ thể về thân thể, nhưng không khiến người đọc tưởng sự thù nghịch vốn ở trong Đấng Christ.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “Ngài” cho Đấng Christ theo lối xưng hô kính trọng phổ biến. Dấu chấm phẩy và cặp gạch ngang giúp giữ cấu trúc dài, tiếp diễn của nguyên văn mà vẫn làm rõ quan hệ giữa “bức tường ngăn cách” và “sự thù nghịch”.
