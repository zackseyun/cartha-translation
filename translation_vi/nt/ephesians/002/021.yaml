  text: ἐν ᾧ ⸀πᾶσα οἰκοδομὴ συναρμολογουμένη αὔξει εἰς ναὸν ἅγιον ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/021.yaml
  text: in whom the whole building[a], being fitted together, grows into a holy temple in the Lord,
translation:
  language: vi
  text: Trong Ngài, toàn bộ tòa nhà[a] đang được ghép nối chặt chẽ và lớn lên thành một đền thờ thánh trong Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mỗi tòa nhà.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa phân phối hoặc tập thể; bản chính theo hình ảnh một đền thờ hợp nhất trong văn cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong Ngài
  rationale: Đại từ quan hệ chỉ về Đấng Christ ở văn cảnh ngay trước; cách dịch nhân xưng giữ trọng tâm Cơ Đốc luận và sắc thái ở trong Ngài.
- source_word: πᾶσα οἰκοδομὴ
  choice: toàn thể công trình
  rationale: Cụm Hy Lạp không có mạo từ có thể được hiểu theo nghĩa tập thể hoặc phân phối. Văn cảnh nhấn mạnh một dân hợp nhất thành một đền thờ, nên bản chính chọn nghĩa tập thể; phương án còn lại được giữ trong chú thích.
- source_word: συναρμολογουμένη
  choice: được kết nối hài hòa
  rationale: Phân từ hiện tại bị động diễn tả tiến trình liên tục, trong đó các phần được ráp nối thành một chỉnh thể ăn khớp; cách dịch này giữ cả ý kết nối lẫn sự phối hợp chặt chẽ.
- source_word: αὔξει
  choice: lớn lên
  rationale: Động từ hiện tại diễn tả sự phát triển đang tiếp diễn và duy trì hình ảnh tăng trưởng hữu cơ được áp dụng cho công trình.
- source_word: εἰς
  choice: thành
  rationale: 'Giới từ chỉ kết quả hoặc đích đến: công trình phát triển để trở thành đền thờ; tiếng Việt tự nhiên dùng “thành”.'
- source_word: ναὸν ἅγιον
  choice: một đền thờ thánh
  rationale: ναός chỉ nơi thánh hay phần đền thờ theo nghĩa trọng tâm, nhưng “đền thờ” là cách diễn đạt rõ ràng, tự nhiên và phù hợp hình ảnh xuyên suốt; “thánh” chuyển tải trực tiếp ἅγιον.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên cách nói giàu ý nghĩa của Phao-lô, có thể bao hàm phạm vi và sự hiệp nhất với Chúa mà không giải thích quá mức.
theological_decisions:
- issue: Tiền ngữ của ᾧ là chính Đấng Christ hay công trình/hình ảnh đá góc theo nghĩa phi nhân xưng
  choice: 'Quy chiếu nhân xưng đến Đấng Christ: “Trong Ngài”'
  alternative: 'Quy chiếu phi nhân xưng: “trong đó”'
  rationale: Tiền ngữ tự nhiên trong câu trước là chính Đấng Christ Giê-su, và cách nói lặp lại “trong Ngài” trong văn cảnh nâng đỡ cách hiểu nhân xưng.
- issue: πᾶσα οἰκοδομὴ mang nghĩa tập thể hay phân phối
  choice: 'Nghĩa tập thể: “toàn thể công trình”'
  alternative: 'Nghĩa phân phối: “mỗi công trình”'
  rationale: Văn cảnh Ê-phê-sô 2:14–22 nhấn mạnh người Do Thái và dân ngoại được hợp nhất thành một dân và một đền thờ. Tuy nhiên, cấu trúc Hy Lạp vẫn cho phép nghĩa phân phối, nên phương án ấy được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Công trình” giữ ẩn dụ kiến trúc và tự nhiên hơn “tòa nhà” khi nói về một thực thể đang được kết nối rồi lớn lên thành đền thờ. Đại từ kính trọng “Ngài” dùng cho Đấng Christ; “Chúa” theo cách gọi truyền thống, phổ thông.
