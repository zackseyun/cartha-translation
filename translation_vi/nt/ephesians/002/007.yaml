id: EPH.2.7
reference: Ephesians 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: vi
  text: để trong những thời đại sắp đến[a], Ngài bày tỏ sự phong phú vượt bậc[b] của ân điển của Ngài trong lòng nhân từ đối với chúng ta trong Đấng Mê-si-a Giê-su.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong các thời đại sẽ đến.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự phong phú vô hạn của ân điển của Ngài.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nghĩa đen: “trong Đấng Christ Giê-su”; ở đây Χριστός được hiểu là tước hiệu “Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích hoặc kết quả nối tiếp mạch văn trước mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: ἐνδείξηται
  choice: Ngài bày tỏ
  rationale: Động từ mang ý cho thấy hoặc biểu lộ rõ ràng; “bày tỏ” vừa trang trọng vừa dễ hiểu và giữ được sắc thái công khai của hành động.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: trong những thời đại sắp đến
  rationale: Giữ số nhiều của αἰῶσιν và ý tương lai của τοῖς ἐπερχομένοις bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: sự phong phú vượt bậc
  rationale: πλοῦτος ở đây chỉ nguồn ân điển dồi dào; ὑπερβάλλον nhấn mạnh mức độ vượt trội. Cụm này tự nhiên hơn cách dịch sát là “sự giàu có vượt quá”.
- source_word: τῆς χάριτος αὐτοῦ
  choice: của ân điển Ngài
  rationale: “Ân điển” bảo toàn nội dung thần học quen thuộc của χάρις và vẫn dễ nhận biết đối với độc giả phổ thông.
- source_word: ἐν χρηστότητι
  choice: qua lòng nhân từ
  rationale: χρηστότης diễn tả lòng tốt lành, nhân hậu được thể hiện bằng hành động. “Qua” truyền đạt phương cách ân điển được bày tỏ mà không làm câu tiếng Việt gượng ép.
- source_word: ἐφ’ ἡμᾶς
  choice: đối với chúng ta
  rationale: 'Diễn đạt hướng quy chiếu của ἐπί với đối cách: lòng nhân từ hướng đến và dành cho cộng đồng người tin.'
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ cấu trúc “trong” quan trọng trong thần học Phao-lô và dịch Χριστός như một tước hiệu, không như họ riêng.
theological_decisions:
- issue: Sắc thái mục đích hay kết quả của ἵνα
  choice: để
  alternative: hầu cho; để rồi
  rationale: “Để” có thể bao hàm cả mục đích lẫn kết quả theo mạch văn, tránh giải quyết quá mức một quan hệ vốn có thể mang cả hai sắc thái.
- issue: Χριστός là tước hiệu hay thành tố tên gọi
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su; Chúa Cứu Thế Giê-su
  rationale: Χριστός vẫn mang nội dung tước hiệu “Đấng được xức dầu”. “Đấng Mê-si-a” giữ nội dung ấy mà không thêm danh xưng “Chúa”, vốn không có trong câu Hy Lạp.
- issue: Quan hệ của ἐν χρηστότητι với ân điển
  choice: qua lòng nhân từ đối với chúng ta
  alternative: trong lòng nhân từ dành cho chúng ta
  rationale: Bản dịch hiểu cụm này là cách thức hoặc biểu hiện của ân điển nhưng không tách nó khỏi hướng quy chiếu “đối với chúng ta”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để nối chủ thể là Đức Chúa Trời từ mạch văn trước; giữ hình ảnh “sự phong phú” và công thức hiệp nhất “trong Đấng Mê-si-a”, đồng thời tránh thêm “Chúa” trước tên Giê-su vì từ này không hiện diện trong nguyên văn.
