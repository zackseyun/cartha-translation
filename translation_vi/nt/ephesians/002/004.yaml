source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: vi
  text: Nhưng Đức Chúa Trời, vốn giàu lòng thương xót[a], vì tình yêu lớn lao của Ngài mà Ngài đã yêu chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp theo sát nghĩa là “giàu trong sự thương xót”; cũng có thể dịch tự nhiên là “dồi dào lòng thương xót.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với tình trạng chết vì vi phạm và ở dưới cơn thịnh nộ được nói đến trước đó.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: vốn giàu lòng thương xót
  rationale: Giữ hình ảnh 'giàu' và ý nghĩa của ἔλεος, đồng thời dùng một cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: vì tình yêu lớn lao
  rationale: διά với đối cách nêu nguyên nhân; πολλήν bổ nghĩa cho danh từ trừu tượng ἀγάπην nên được diễn đạt tự nhiên là 'lớn lao'.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: mà Ngài đã yêu chúng ta
  rationale: Giữ mệnh đề quan hệ và sự lặp có chủ ý giữa danh từ 'tình yêu' và động từ 'yêu', thay vì rút gọn thành 'tình yêu lớn lao dành cho chúng ta'.
theological_decisions:
- issue: Sự lặp từ cùng gốc ἀγάπην … ἠγάπησεν
  choice: tình yêu lớn lao mà Ngài đã yêu chúng ta
  alternative: tình yêu lớn lao Ngài dành cho chúng ta
  rationale: Cách chọn giữ được lối nhấn mạnh bằng danh từ–động từ cùng gốc trong tiếng Hy Lạp, dù câu tiếng Việt có phần trang trọng hơn.
- issue: Mối quan hệ giữa lòng thương xót và tình yêu
  choice: 'Giữ hai ý riêng biệt: ''giàu lòng thương xót'' và ''vì tình yêu lớn lao'''
  alternative: Gộp thành một ý như 'vì tình yêu đầy thương xót'
  rationale: Bản Hy Lạp trình bày lòng thương xót và tình yêu như hai khái niệm liên hệ nhưng không đồng nhất; không nên làm mất sự phân biệt này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu kết bằng dấu phẩy vì đây là phần mở đầu của một câu dài tiếp tục ở các câu sau. Đại từ kính trọng “Ngài” quy chiếu về Đức Chúa Trời.
