base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: vi
  text: nếu có ai không có gì đáng trách, là chồng của một người vợ[a], có con cái trung tín[b], không bị cáo buộc là sống phóng túng[c] hoặc là bất phục tùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người đàn ông của một phụ nữ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “có con cái là người có đức tin.” Từ Hy Lạp πιστά có thể có nghĩa là “trung tín” hoặc “có đức tin.”'
    reason: alternative_reading
  - marker: c
    text: 'Hoặc: “sống buông thả.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: không chỗ trách được
  rationale: Diễn đạt tình trạng không thể bị cáo buộc chính đáng, không hàm ý sự hoàn hảo tuyệt đối.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: chồng của một vợ
  rationale: Giữ cách diễn đạt minh bạch và đặc thù về giới của tiếng Hy Lạp, đồng thời không tự giải quyết các tranh luận về hàm ý của cụm từ.
- source_word: τέκνα
  choice: con cái
  rationale: Cách dịch tự nhiên, thông dụng trong ngữ cảnh gia đình.
- source_word: πιστά
  choice: trung tín
  rationale: Giữ nghĩa phẩm chất đáng tin và trung thành; nghĩa có đức tin được nêu trong chú thích vì từ Hy Lạp có thể mang cả hai nghĩa.
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: bị cáo buộc là sống phóng túng
  rationale: Giữ sắc thái cáo buộc của κατηγορία và diễn đạt ἀσωτία bằng lối nói hiện đại, dễ hiểu về đời sống buông thả, thiếu kiềm chế.
- source_word: ἀνυπότακτα
  choice: bất phục tùng
  rationale: Phản ánh ý không chịu quy phục trật tự hay thẩm quyền, phù hợp với ngữ cảnh quản trị gia đình.
theological_decisions:
- issue: Nghĩa của πιστά trong τέκνα ἔχων πιστά
  choice: con cái trung tín
  alternative: con cái có đức tin
  rationale: πιστά thực sự có thể chỉ sự trung tín/đáng tin hoặc việc tin Chúa. Bản văn chính chọn nghĩa rộng hơn và chú thích bảo lưu cách hiểu kia.
- issue: Ý nghĩa của μιᾶς γυναικὸς ἀνήρ
  choice: chồng của một vợ
  alternative: người đàn ông chỉ gắn bó với một phụ nữ
  rationale: Cách dịch sát cấu trúc giữ nguyên độ mở của thành ngữ, không áp đặt kết luận giáo phái về tình trạng hôn nhân, tái hôn hay sự chung thủy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu này tiếp nối cấu trúc điều kiện và danh sách phẩm chất từ văn cảnh trước, nên giữ dạng mở đầu “nếu”. Các thuật ngữ được chọn nhằm bảo lưu sự mơ hồ thật sự của nguyên văn mà không đưa thêm kết luận giáo lý.
