  rationale: Sửa số ít “cả gia đình” thành số nhiều “các hộ gia đình” để phản ánh ὅλους οἴκους. Điều chỉnh nhẹ mệnh đề phương tiện thành “bằng cách dạy” và thay phương án chú thích c bằng một cách diễn đạt sát hơn với sắc thái “đáng hổ thẹn/đê tiện” của αἰσχροῦ. Không thay đổi ý nghĩa hay thêm biện pháp cụ thể cho việc làm họ im tiếng.
