review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh cần ngăn chặn lời dạy, tính giải thích của οἵτινες, động từ ἀνατρέπουσιν, nội dung dạy điều không nên dạy, và động cơ αἰσχροῦ κέρδους χάριν. Tuy nhiên, “cả gia đình” ở số ít làm mờ số nhiều ὅλους οἴκους và có thể bị hiểu là chỉ một gia đình; cần dùng “các hộ gia đình” để giữ đúng phạm vi xã hội của οἶκοι.
  naturalness: “Cần phải làm cho họ im tiếng” là cách diễn đạt hiện đại, tự nhiên và vẫn để ngỏ biện pháp thực hiện. “Các hộ gia đình” rõ nghĩa hơn “cả gia đình” trong câu này. Cấu trúc “bằng cách dạy” làm rõ rằng việc dạy là phương tiện gây xáo trộn, phù hợp với phân từ διδάσκοντες.
  terminology: “Hộ gia đình” phản ánh tốt οἶκος như một đơn vị gia đình gồm người nhà/người phụ thuộc, không phải tòa nhà. “Lợi lộc đáng hổ thẹn” giữ được sắc thái đạo đức của αἰσχρός mà không thêm ý chuyên biệt như “bất chính.”
  issues:
