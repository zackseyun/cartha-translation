id: TIT.1.11
reference: Titus 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: vi
  text: Cần phải làm cho họ im tiếng[a], vì họ đang làm đảo lộn các hộ gia đình[b] bằng cách dạy những điều không nên dạy, chỉ vì lợi lộc đáng hổ thẹn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “bịt miệng họ lại.”'
    reason: lexical_alternative
  - marker: b
    text: “Các hộ gia đình” chỉ toàn bộ những người thuộc một hộ gia đình, kể cả người phụ thuộc, chứ không chỉ ngôi nhà vật chất.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “vì lợi lộc đê tiện.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς
  choice: họ
  rationale: Đại từ quan hệ chỉ lại những người được nói đến ở câu trước; tiếng Việt tự nhiên dùng “họ” làm tân ngữ trong mệnh đề độc lập.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt trực tiếp tính cần thiết và nghĩa vụ của δεῖ.
- source_word: ἐπιστομίζειν
  choice: làm họ im tiếng
  rationale: Truyền đạt thành ngữ Hy Lạp có nghĩa đen là “bịt miệng”, nhấn mạnh việc chặn lời dạy gây hại mà không tự ý quy định biện pháp cưỡng chế cụ thể.
- source_word: οἵτινες
  choice: vì họ
  rationale: Trong văn cảnh, đại từ quan hệ này mang sắc thái giải thích lý do tại sao cần làm họ im tiếng.
- source_word: ὅλους οἴκους
  choice: cả gia đình
  rationale: οἶκος ở đây phù hợp với đơn vị gia đình/hộ gia đình hơn là tòa nhà; “cả gia đình” giữ ý toàn bộ những người trong nhà và tự nhiên trong tiếng Việt.
- source_word: ἀνατρέπουσιν
  choice: đang làm đảo lộn
  rationale: Động từ chỉ việc lật đổ, phá rối hoặc gây đảo lộn nghiêm trọng; cách dịch này rõ nghĩa mà không đẩy đến ý hủy diệt hoàn toàn.
- source_word: διδάσκοντες
  choice: khi dạy
  rationale: Giữ quan hệ giữa hành động dạy và hậu quả làm đảo lộn gia đình; trong tiếng Việt, “khi dạy” tự nhiên và vẫn cho phép hiểu là phương cách hoặc hành động đi kèm.
- source_word: ἃ μὴ δεῖ
  choice: những điều không nên dạy
  rationale: Bổ sung lại động từ “dạy” theo ngữ cảnh để câu tiếng Việt rõ ràng, đồng thời giữ sự phán định đạo đức của δεῖ với μή.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: chỉ vì lợi lộc đáng hổ thẹn
  rationale: Diễn đạt động cơ kiếm lợi bị lên án về mặt đạo đức; “lợi lộc” có thể bao gồm lợi ích vật chất mà không thu hẹp quá mức vào một hình thức tiền bạc cụ thể.
theological_decisions:
- issue: Bản chất của yêu cầu đối với những người dạy sai
  choice: Phải làm họ im tiếng
  alternative: Phải bịt miệng họ
  rationale: Bản văn đòi chặn lời dạy gây hại nhưng không nói rõ phải dùng biện pháp dân sự, thể chất hay hình phạt nào; bản dịch giữ sức mạnh của mệnh lệnh mà không thêm một phương thức không có trong nguyên văn.
- issue: Mức độ thiệt hại đối với οἴκους
  choice: làm đảo lộn cả gia đình
  alternative: phá tan toàn bộ gia đình
  rationale: ἀνατρέπω có sức mạnh hơn sự khó chịu thông thường, nhưng văn cảnh không buộc phải hiểu là gia đình bị hủy diệt hoàn toàn; “làm đảo lộn” giữ được sự nghiêm trọng mà không cường điệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm họ im tiếng” giữ sắc thái mạnh nhưng tránh gợi một hình thức trừng phạt cụ thể; “cả gia đình” tự nhiên hơn các cách dịch máy móc như “toàn bộ các nhà”.
