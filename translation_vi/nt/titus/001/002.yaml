base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: vi
  text: trong niềm hy vọng về sự sống đời đời mà Đức Chúa Trời, Đấng không nói dối, đã hứa trước khi các thời đại bắt đầu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trước khi thời gian bắt đầu.” Cụm Hy Lạp theo sát nghĩa là “trước các thời kỳ đời đời”; đây là một cách nói về thời điểm trước các thời đại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: trong niềm hy vọng
  rationale: ἐπί với cách dữ có thể chỉ nền tảng, hoàn cảnh hoặc phạm vi. Cách dịch này tự nhiên trong tiếng Việt và giữ mối liên hệ với niềm hy vọng mà không ấn định quá mức quan hệ nhân quả.
- source_word: ζωῆς αἰωνίου
  choice: về sự sống đời đời
  rationale: Cụm sở hữu cách nêu nội dung hay đối tượng của niềm hy vọng. “Sự sống đời đời” là cách diễn đạt quen thuộc, rõ nghĩa và giữ được cả chiều kích trường tồn lẫn âm hưởng thần học.
- source_word: ἣν
  choice: là điều
  rationale: Đại từ quan hệ giống cái số ít quy chiếu tự nhiên nhất về “sự sống đời đời,” chứ không phải “niềm hy vọng.” “Là điều” nối mệnh đề tự nhiên trong tiếng Việt.
- source_word: ἐπηγγείλατο
  choice: đã hứa
  rationale: Diễn đạt chính xác và tự nhiên động từ aorist trung gian ἐπαγγέλλομαι; tiếng Việt không cần thể hiện riêng sắc thái trung gian ở đây.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Đức Chúa Trời—Đấng không nói dối—
  rationale: ἀψευδής có nghĩa là không nói dối, chân thật. Cách dịch bằng mệnh đề mô tả vừa tự nhiên, trang trọng, vừa không tăng cường thành ý “không thể nói dối.”
- source_word: πρὸ χρόνων αἰωνίων
  choice: từ trước các thời đại
  rationale: Giữ sát hình ảnh số nhiều của χρόνοι αἰώνιοι và ý nghĩa tiền thời đại, đồng thời tránh xác định siêu hình rằng thời gian tuyệt đối đã có một khởi điểm.
theological_decisions:
- issue: Cụm thời gian πρὸ χρόνων αἰωνίων và lời hứa của Đức Chúa Trời
  choice: từ trước các thời đại
  alternative: trước khi thời gian bắt đầu; từ trước muôn đời
  rationale: Bản Hy Lạp đặt lời hứa trước các thời đại nhưng không nói lời hứa ấy được ban cho ai hoặc cơ chế thần học của lời hứa. Bản dịch giữ nguyên khẳng định thời gian mà không giải quyết điều văn bản để ngỏ.
- issue: Mô tả Đức Chúa Trời là ἀψευδής
  choice: Đấng không nói dối
  alternative: Đấng không thể nói dối; Đức Chúa Trời chân thật
  rationale: Cách chọn phản ánh trực tiếp tính từ Hy Lạp mà không đưa thêm khẳng định mạnh hơn về khả năng, dù khẳng định ấy có thể phù hợp với một hệ thống thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang làm rõ cụm đồng vị mô tả Đức Chúa Trời. “Các thời đại” giữ nét ngôn ngữ Kinh Thánh và sự mơ hồ có chủ ý của nguyên văn.
