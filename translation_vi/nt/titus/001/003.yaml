source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: vi
  text: nhưng vào những thời điểm Ngài đã định, Ngài đã bày tỏ lời Ngài qua sự rao truyền được giao phó cho chính tôi,[a] theo mệnh lệnh của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu đại từ quan hệ là quy về “lời Ngài”: “lời Ngài ... mà tôi đã được giao phó.” Từ Hy Lạp được dịch là “sự rao truyền” cũng có thể chỉ hành động rao giảng hoặc sứ điệp được rao giảng.'
    reason: alternative_reading_and_lexical_alternative
  - marker: b
    text: 'Nguyên văn: “của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta.” Danh xưng “Đấng Cứu Rỗi chúng ta” đồng vị với “Đức Chúa Trời”.'
    reason: syntax_clarification
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: đã bày tỏ
  rationale: Diễn đạt tự nhiên hành động làm cho điều trước đó chưa được thấy rõ trở nên công khai; thì quá khứ phù hợp với động từ aorist trong văn cảnh.
- source_word: καιροῖς ἰδίοις
  choice: đến những thời điểm do chính Ngài định
  rationale: Giữ sắc thái số nhiều của καιροῖς và ý niệm các thời điểm thuộc quyền định liệu của Đức Chúa Trời, đồng thời rõ nghĩa hơn lối dịch sát chữ nhưng khó hiểu là “trong những thời điểm riêng của Ngài”.
- source_word: τὸν λόγον αὐτοῦ
  choice: lời mình
  rationale: “Lời” duy trì liên hệ từ vựng với λόγος và chỉ sứ điệp của Đức Chúa Trời; “mình” quy chiếu tự nhiên về chủ ngữ Ngài trong tiếng Việt.
- source_word: ἐν κηρύγματι
  choice: qua sự rao truyền
  rationale: ἐν mang nghĩa phương tiện trong văn cảnh; “sự rao truyền” có thể bao hàm cả hành động công bố lẫn nội dung được công bố.
- source_word: ὃ ἐπιστεύθην ἐγὼ
  choice: mà tôi được giao phó
  rationale: Đại từ quan hệ giống trung số ít gần nhất với κήρυγμα; động từ bị động ở đây nói đến việc Phao-lô được tín nhiệm giao một trách nhiệm hay nội dung, không phải việc ông tin.
- source_word: κατ’ ἐπιταγὴν
  choice: theo mệnh lệnh
  rationale: Diễn tả sự phù hợp với và căn cứ trên chỉ thị có thẩm quyền.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta
  rationale: Giữ cấu trúc sở hữu và làm rõ “Đấng Cứu Rỗi chúng ta” là danh xưng đồng vị của Đức Chúa Trời.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của ἐφανέρωσεν và sắc thái của καιροῖς ἰδίοις
  choice: 'Hiểu Đức Chúa Trời là chủ ngữ: “đến những thời điểm do chính Ngài định, Ngài đã bày tỏ.”'
  alternative: 'Có thể dịch phi nhân xưng: “đến thời điểm thích hợp, lời ấy đã được bày tỏ.”'
  rationale: Mạch văn trước đó nói về Đức Chúa Trời đã hứa, nên việc Ngài bày tỏ lời mình là diễn tiến tự nhiên; cách dịch cũng giữ được sắc thái sở hữu của ἰδίοις.
- issue: Sở chỉ của đại từ quan hệ ὃ
  choice: Hiểu ὃ quy chiếu gần nhất về “sự rao truyền.”
  alternative: 'Có thể hiểu ὃ quy chiếu về “lời mình”: “lời mình... là lời đã được giao phó cho tôi.”'
  rationale: κήρυγμα là tiền ngữ phù hợp gần nhất và cùng giống trung số ít; tuy nhiên cấu trúc cho phép liên hệ ý nghĩa chặt chẽ với “lời,” nên ghi chú bảo lưu cách hiểu khác.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ đọc. Dùng “Đức Chúa Trời” theo cách gọi phổ biến trong Kinh Thánh tiếng Việt; đại từ “Ngài” thể hiện sự tôn kính. Cụm “do chính Ngài định” làm sáng nghĩa thành ngữ Hy Lạp mà không biến số nhiều “những thời điểm” thành một thời điểm duy nhất.
