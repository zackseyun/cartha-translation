  terminology: Giữ “Đức Chúa Trời”, “Ngài”, “lời Ngài”, “sự rao truyền”, và “Đấng Cứu Rỗi” là nhất quán với văn phong Kinh Thánh Việt ngữ và không áp đặt diễn giải giáo phái. “Những thời điểm Ngài đã định” chuyển tải sắc thái các thời điểm thuộc sự định liệu của Ngài mà không thêm nội dung đáng kể.
