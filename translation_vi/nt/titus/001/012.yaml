revisions:
- from: 'Một người trong số họ, chính là nhà tiên tri của họ, đã nói: “Người Cơ-rết lúc nào cũng dối trá, là thú dữ độc ác, những cái bụng lười biếng.”[a]'
  to: 'Một người trong số họ, một nhà tiên tri của chính họ, đã nói: “Người Cơ-rết luôn là những kẻ nói dối, là thú dữ độc ác, là những cái bụng lười biếng[a].”'
  rationale: Sửa cụm đồng vị về “một nhà tiên tri của chính họ” để phản ánh chính xác ἴδιος αὐτῶν προφήτης, và đổi “dối trá” thành “những kẻ nói dối” để giữ nghĩa danh từ của ψεῦσται. Các hình ảnh gay gắt trong lời trích dẫn được bảo toàn; không giảm nhẹ hay biến chúng thành một khẳng định ngoài phạm vi lời được dẫn.
  reviewer_model: gpt-5.6-terra
