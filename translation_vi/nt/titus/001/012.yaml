  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: vi
  text: 'Một người trong số họ, một nhà tiên tri của chính họ, đã nói: “Người Cơ-rết luôn là những kẻ nói dối, là thú dữ độc ác, là những cái bụng lười biếng[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này có thể diễn ý là “những kẻ ham ăn mà lười biếng.” Nguyên văn là “những cái bụng lười biếng.”
    reason: Giải thích nghĩa hàm ẩn của thành ngữ trong khi câu chính giữ nguyên hình ảnh Hy Lạp.
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Một người trong số họ... đã nói
  rationale: Giữ nghĩa bất định của τις và quan hệ bộ phận của ἐξ αὐτῶν, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: chính là nhà tiên tri của họ
  rationale: ἴδιος nhấn mạnh người được dẫn lời thuộc về chính cộng đồng Cơ-rết; “chính là” truyền đạt sắc thái nhấn mạnh ấy mà không hàm ý đây là nhà tiên tri duy nhất của họ.
- source_word: Κρῆτες
  choice: Người Cơ-rết
  rationale: Tên gọi dân cư của đảo Cơ-rết, theo lối phiên âm quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ἀεὶ ψεῦσται
  choice: lúc nào cũng dối trá
  rationale: Truyền đạt trực tiếp nghĩa “luôn luôn là những kẻ nói dối” bằng cách nói tự nhiên, mạnh và mang tính châm ngôn trong tiếng Việt.
- source_word: κακὰ θηρία
  choice: thú dữ độc ác
  rationale: Giữ nguyên hình ảnh loài thú của θηρία cùng sắc thái đạo đức tiêu cực của κακά, thay vì diễn giải nhẹ đi.
- source_word: γαστέρες ἀργαί
  choice: những cái bụng lười biếng
  rationale: Dịch sát hình ảnh miệt thị “những cái bụng lười/nhàn rỗi,” vốn vừa gợi sự ham ăn vừa gợi sự không chịu làm việc; chú thích nêu nghĩa hàm ẩn để câu chính không mất ẩn dụ.
theological_decisions:
- issue: Lời trích dẫn mang tính định kiến về một sắc dân
  choice: Giữ nguyên lời trích dẫn gay gắt và trình bày rõ đó là lời của một người thuộc chính cộng đồng Cơ-rết
  alternative: Giảm nhẹ lời lẽ hoặc diễn giải thành nhận định chỉ áp dụng cho một số người Cơ-rết
  rationale: Bản Hy Lạp trực tiếp dẫn lại một câu nói khái quát, gay gắt. Bản dịch cần bảo toàn sức nặng và sự căng thẳng của lời trích dẫn, không tự ý làm mềm hoặc mở rộng nó thành một khẳng định thần học vượt quá văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời trích được giữ ngắn, nhịp mạnh, phù hợp tính chất châm ngôn; “những cái bụng lười biếng” cố ý giữ hình ảnh thô và gay gắt của nguyên tác.
