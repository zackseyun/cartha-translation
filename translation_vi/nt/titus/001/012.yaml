    rationale: Cách này có thể gợi một sự xác định đặc biệt hay độc nhất. “một nhà tiên tri của chính họ” giữ được ἴδιος (“chính họ/của họ”) mà không thêm sắc thái đó.
  - severity: low
    issue: “lúc nào cũng dối trá” làm mờ danh từ ψεῦσται.
    rationale: ψεῦσται nghĩa là “những kẻ nói dối”; cách sửa giữ loại từ và tính chất châm ngôn của câu trích.
  - severity: low
    issue: Ký hiệu chú thích chưa được neo trực tiếp vào cụm γαστέρες ἀργαί.
    rationale: Đặt [a] ngay sau “những cái bụng lười biếng” làm rõ chú thích giải thích chính cụm này.
