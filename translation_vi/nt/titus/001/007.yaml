  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của câu Hy Lạp: tính tất yếu của δεῖ, mối liên kết giải thích của γάρ, chức năng của ἐπίσκοπος và οἰκονόμος, cùng chuỗi các phẩm chất phủ định. “Người giám sát” và chú thích thay thế “giám mục” là lựa chọn phù hợp, không áp đặt cơ cấu chức vụ về sau. Câu vẫn kết thúc bằng dấu phẩy để cho thấy mạch liệt kê còn tiếp sang câu kế, phù hợp với nguyên văn.'
