id: TIT.1.7
reference: Titus 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: vi
  text: Vì người giám sát[a], với tư cách là quản gia của Đức Chúa Trời, phải là người không có gì đáng trách, không cố chấp theo ý mình, không nóng nảy, không mê rượu, không hung bạo, không tham món lợi đáng hổ thẹn[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giám mục”. Từ Hy Lạp chỉ người trông coi hay giám sát; “người giám sát” tránh đưa vào câu này những hàm ý về chức vụ giáo hội phát triển về sau.
    reason: alternative_reading
  - marker: b
    text: Hay “tham lợi bất chính”. Từ Hy Lạp nhấn mạnh sự ham muốn lợi lộc mang tính đáng hổ thẹn về mặt đạo đức.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt rõ tính cần thiết và nghĩa vụ, phù hợp với cấu trúc quy định phẩm chất trong ngữ cảnh.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên kết giải thích với câu trước.
- source_word: ἐπίσκοπον
  choice: người giám sát
  rationale: Chuyển tải nghĩa căn bản là người trông coi, giám sát mà không đưa vào văn bản những hàm ý về cơ cấu giáo hội hình thành về sau.
- source_word: ἀνέγκλητον
  choice: không chỗ trách được
  rationale: Diễn đạt việc không có căn cứ chính đáng để bị cáo trách, đồng thời tránh hàm ý tuyệt đối rằng người ấy hoàn toàn không có khuyết điểm.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: với tư cách là quản gia của Đức Chúa Trời
  rationale: Giữ hình ảnh người được giao quản lý và phải chịu trách nhiệm trước Đức Chúa Trời; cụm “với tư cách là” làm rõ chức năng của ὡς.
- source_word: αὐθάδη
  choice: không cố chấp theo ý mình
  rationale: Thể hiện khuynh hướng tự mãn, khăng khăng làm theo ý riêng; tự nhiên và rõ nghĩa hơn một từ Hán-Việt hiếm dùng.
- source_word: ὀργίλον
  choice: không nóng nảy
  rationale: Chỉ khuynh hướng dễ nổi giận chứ không phải một cơn giận đơn lẻ.
- source_word: πάροινον
  choice: không mê rượu
  rationale: Diễn tả việc bị rượu chi phối hoặc thường sa vào rượu chè mà không cường điệu thành nghiện rượu.
- source_word: πλήκτην
  choice: không hung bạo
  rationale: Truyền đạt rõ khuynh hướng đánh đập hoặc dùng bạo lực trong tiếng Việt hiện đại.
- source_word: αἰσχροκερδῆ
  choice: không tham món lợi đáng hổ thẹn
  rationale: Giữ cả yếu tố ham lợi lẫn tính chất đáng xấu hổ về mặt đạo đức của lợi lộc ấy, không thu hẹp nghĩa vào hành vi bất hợp pháp.
theological_decisions:
- issue: Cách dịch ἐπίσκοπος trong bối cảnh chức vụ của hội thánh
  choice: người giám sát
  alternative: giám mục
  rationale: “Người giám sát” phản ánh nghĩa từ vựng trong ngữ cảnh thế kỷ thứ nhất và không mặc nhiên áp đặt cơ cấu phẩm trật giáo hội về sau.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Chuỗi phủ định được giữ để phản ánh nhịp liệt kê của nguyên văn; dấu phẩy cuối câu được bảo lưu vì câu Hy Lạp tiếp tục sang mạch văn kế tiếp.
