  to: Vì người giám sát[a], với tư cách là quản gia của Đức Chúa Trời, phải là người không có gì đáng trách, không cố chấp theo ý mình, không nóng nảy, không mê rượu, không hung bạo, không tham món lợi đáng hổ thẹn[b],
