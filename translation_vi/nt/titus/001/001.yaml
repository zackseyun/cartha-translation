source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: vi
  text: Phao-lô, nô lệ của Đức Chúa Trời và là sứ đồ của Giê-su, Đấng Mê-si-a, vì đức tin của những người được Đức Chúa Trời chọn[a] và sự nhận biết chân lý[b] phù hợp với sự tin kính[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được chọn của Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự nhận biết đầy đủ chân lý.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “chân lý dẫn đến sự tin kính.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: nô lệ
  rationale: Giữ sắc thái thuộc trọn về Đức Chúa Trời và ở dưới quyền Ngài; mạnh hơn từ “đầy tớ” nhưng vẫn tự nhiên trong lời tự xưng của Phao-lô.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác cho chức vụ của người được sai phái có thẩm quyền.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Diễn đạt Χριστός như tước hiệu “Đấng Mê-si-a”; thêm “Chúa” theo cách gọi tự nhiên, trang trọng trong tiếng Việt, không làm thay đổi quan hệ cú pháp chính.
- source_word: κατὰ
  choice: nhằm gây dựng
  rationale: Trong cụm chỉ mối liên hệ giữa chức sứ đồ với đức tin và sự nhận biết, cách dịch này thể hiện hướng đích có khả năng cao, đồng thời tránh lối dịch sát chữ nhưng khó hiểu “theo đức tin”.
- source_word: πίστιν
  choice: đức tin
  rationale: Nghĩa thích hợp nhất trong văn cảnh là lòng tin của những người được Đức Chúa Trời chọn.
- source_word: ἐκλεκτῶν θεοῦ
  choice: những người được Đức Chúa Trời chọn
  rationale: Diễn đạt rõ hành động lựa chọn của Đức Chúa Trời mà không nhập thêm một hệ thống thần học cụ thể.
- source_word: ἐπίγνωσιν
  choice: sự nhận biết
  rationale: Tự nhiên hơn “kiến thức” trong văn cảnh thuộc linh và có thể bao hàm sự hiểu biết sâu sắc; sắc thái tăng cường được ghi chú.
- source_word: ἀληθείας
  choice: chân lý
  rationale: “Chân lý” trang trọng, tự nhiên và chỉ nội dung chân thật được nhận biết, không đơn thuần là một sự kiện đúng.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: phù hợp với lòng tin kính
  rationale: Giữ quan hệ phù hợp/đồng thuận do κατά biểu thị, không buộc cụm từ mang nghĩa nhân quả.
- source_word: εὐσέβειαν
  choice: lòng tin kính
  rationale: Diễn đạt thái độ tôn kính Đức Chúa Trời cùng đời sống tương ứng, phù hợp cách dùng trong các thư mục vụ.
theological_decisions:
- issue: Cách hiểu ἐκλεκτῶν θεοῦ
  choice: những người được Đức Chúa Trời chọn
  alternative: những người tuyển chọn của Đức Chúa Trời
  rationale: Bản Hy Lạp khẳng định sự được Đức Chúa Trời chọn nhưng không tự nó xác định mọi chi tiết của một học thuyết tuyển chọn.
- issue: Quan hệ của κατὰ πίστιν ... καὶ ἐπίγνωσιν với chức sứ đồ
  choice: nhằm gây dựng đức tin ... và sự nhận biết
  alternative: theo đức tin ... và sự nhận biết
  rationale: Cú pháp cô đọng cho phép sắc thái hướng đến mục đích hoặc quy chiếu. Bản chính ưu tiên hướng đích truyền giáo/mục vụ; ghi chú bảo tồn cách hiểu sát cấu trúc hơn.
- issue: Quan hệ giữa chân lý và εὐσέβεια
  choice: chân lý phù hợp với lòng tin kính
  alternative: chân lý dẫn đến lòng tin kính
  rationale: κατά có thể nói đến sự phù hợp hoặc định hướng; bản chính tránh khẳng định quan hệ nhân quả mạnh hơn điều bản văn buộc phải nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “nô lệ” để phản ánh độ mạnh của δοῦλος, “sứ đồ” theo thuật ngữ Kinh Thánh tiếng Việt quen thuộc, và “Đấng Mê-si-a” như một tước hiệu. Câu kết bằng dấu phẩy vì Tít 1:1 tiếp tục sang câu kế tiếp.
