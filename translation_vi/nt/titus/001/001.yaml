  - severity: low
    issue: Chú thích b thiếu bổ ngữ “chân lý”
    rationale: Phương án “sự nhận biết đầy đủ” nên giữ rõ đối tượng của ἐπίγνωσιν là “chân lý”.
  - severity: medium
