revisions:
- from: Phao-lô, nô lệ của Đức Chúa Trời và là sứ đồ của Chúa Giê-su, Đấng Mê-si-a, nhằm gây dựng đức tin của những người được Đức Chúa Trời chọn[a] và sự nhận biết[b] chân lý phù hợp với lòng tin kính[c],
  to: Phao-lô, nô lệ của Đức Chúa Trời và là sứ đồ của Giê-su, Đấng Mê-si-a, vì đức tin của những người được Đức Chúa Trời chọn[a] và sự nhận biết chân lý[b] phù hợp với sự tin kính[c],
  rationale: Loại bỏ “nhằm gây dựng” vì đây là diễn giải không được nêu rõ trong cú pháp κατὰ; dùng “vì” như một cách diễn đạt ngắn gọn, tự nhiên cho hướng quy chiếu/mục tiêu, đồng thời không quyết định quá mức tranh luận cú pháp. Loại bỏ tước hiệu “Chúa” không có trong nguyên văn. Chỉnh “lòng tin kính” thành “sự tin kính” và sửa toàn bộ chú thích để các phương án thay thế bám đúng đơn vị từ vựng/cú pháp mà chúng chú giải.
