id: TIT.1.5
reference: Titus 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: vi
  text: Vì lý do này, tôi đã để anh ở lại đảo Cơ-rết, để anh sắp xếp cho ổn thỏa những việc còn dang dở[a] và bổ nhiệm các trưởng lão trong mỗi thành[b], như tôi đã chỉ thị cho anh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều còn thiếu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “từng thành một.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “như tôi đã truyền lệnh cho anh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Vì lý do này
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân và giữ chức năng giải thích của cụm χάριν với sở hữu cách.
- source_word: ἀπέλιπόν σε
  choice: tôi đã để anh ở lại
  rationale: Trong ngữ cảnh, động từ nói đến việc Phao-lô rời đi nhưng để Tít tiếp tục ở Cơ-rết; “để anh ở lại” tự nhiên hơn “bỏ anh lại” và tránh sắc thái tiêu cực không có trong câu.
- source_word: ἐν Κρήτῃ
  choice: ở đảo Cơ-rết
  rationale: Giữ nghĩa địa điểm và thêm “đảo” để độc giả hiện đại dễ nhận biết địa danh, không làm thay đổi nội dung.
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ ý chỉ mục đích bằng cách diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: τὰ λείποντα
  choice: những việc còn dang dở
  rationale: Cụm phân từ chỉ những việc còn lại vì chưa được hoàn tất; cách dịch này kết hợp sắc thái “còn lại” và “chưa hoàn chỉnh” mà không xác định cụ thể các việc ấy.
- source_word: ἐπιδιορθώσῃ
  choice: sắp xếp cho ổn thỏa
  rationale: Truyền đạt ý sửa sang, chấn chỉnh hoặc đưa những việc chưa hoàn tất vào trật tự, bằng lối nói hiện đại và dễ hiểu.
- source_word: καταστήσῃς
  choice: bổ nhiệm
  rationale: Trong ngữ cảnh lãnh đạo hội thánh, từ này chỉ việc đặt người vào một trách nhiệm được công nhận.
- source_word: κατὰ πόλιν
  choice: trong mỗi thành
  rationale: 'Giữ nghĩa phân bố của κατά với danh từ số ít: việc bổ nhiệm được tiến hành tại từng thành.'
- source_word: πρεσβυτέρους
  choice: các trưởng lão
  rationale: Chỉ những người lãnh đạo được công nhận trong hội thánh, không chỉ những người đàn ông cao tuổi; thuật ngữ này không áp đặt một mô hình giáo quyền hậu kỳ cụ thể.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: như tôi đã chỉ thị cho anh
  rationale: “Chỉ thị” giữ được tính thẩm quyền của διατάσσω nhưng không nhất thiết đẩy sắc thái đến mức mạnh nhất là “ra lệnh”.
theological_decisions:
- issue: Thuật ngữ chức vụ hội thánh πρεσβυτέρους
  choice: Dịch là “các trưởng lão” mà không giải thích theo một cơ cấu giáo hội hệ phái cụ thể.
  alternative: các kỳ mục; các giám mục; những người cao tuổi
  rationale: Ngữ cảnh cho thấy đây là vai trò lãnh đạo hội thánh. “Trưởng lão” phản ánh nghĩa từ vựng và cách dùng Cơ Đốc giáo phổ biến, đồng thời để ngỏ những câu hỏi về mô hình quản trị hội thánh.
- issue: Sắc thái thẩm quyền của διεταξάμην
  choice: Dùng “đã chỉ thị cho anh”.
  alternative: đã truyền lệnh cho anh; đã căn dặn anh
  rationale: Động từ hàm ý sự hướng dẫn có thẩm quyền. “Chỉ thị” giữ sức nặng ấy, trong khi “truyền lệnh” có thể quá mạnh và “căn dặn” có thể quá nhẹ.
- issue: Phạm vi của τὰ λείποντα
  choice: Giữ cách nói khái quát “những việc còn dang dở”.
  alternative: những điều còn thiếu; mọi việc chưa hoàn tất
  rationale: Nguyên văn không liệt kê đầy đủ những việc được nói đến. Bản dịch không nên thu hẹp chúng chỉ vào việc bổ nhiệm trưởng lão hay một chương trình tổ chức giáo hội cụ thể.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Dùng đại từ “tôi—anh” phù hợp quan hệ giữa người viết và cộng sự trưởng thành, tránh sắc thái quá xa cách hoặc quá thân mật. Câu giữ nguyên quan hệ mục đích và hai nhiệm vụ song song của nguyên văn.
