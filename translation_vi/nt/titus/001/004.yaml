  to: 'Gửi Tít, người con chân thật của tôi theo đức tin chung[a]: Nguyện ân điển và bình an từ Đức Chúa Trời là Cha và Đấng Mê-si-a Giê-su, Cứu Chúa của chúng ta, ban cho con.'
