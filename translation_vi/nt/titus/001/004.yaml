id: TIT.1.4
reference: Titus 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: vi
  text: 'Gửi Tít, người con chân thật của tôi theo đức tin chung[a]: Nguyện ân điển và bình an từ Đức Chúa Trời là Cha và Đấng Mê-si-a Giê-su, Cứu Chúa của chúng ta, ban cho con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đức tin mà chúng ta cùng chia sẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: người con chân thật
  rationale: Giữ hình ảnh quan hệ cha-con thuộc linh; γνήσιος nhấn mạnh tính chân thật, đích thực của mối quan hệ chứ không nói về huyết thống.
- source_word: κατὰ κοινὴν πίστιν
  choice: theo đức tin chung
  rationale: κατά diễn tả sự quy chiếu hoặc chuẩn mực, còn κοινή chỉ điều được cùng chia sẻ; cách dịch ngắn gọn này giữ được cấu trúc và ý nghĩa của nguyên văn.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, từ này chỉ đức tin mà Phao-lô và Tít cùng chia sẻ, không chủ yếu nói đến đức thành tín.
- source_word: χάρις καὶ εἰρήνη
  choice: ân điển và bình an
  rationale: Đây là hai thuật ngữ quen thuộc trong lời chúc phước mở đầu thư của Phao-lô.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Nguyên văn không có đại từ 'của chúng ta' sau πατρός; 'là Cha' diễn đạt tự nhiên quan hệ đồng vị trong tiếng Việt.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός theo nghĩa tước hiệu là Đấng Mê-si-a thay vì chỉ phiên âm thành Christ; trật tự Hy Lạp được bảo tồn.
- source_word: σωτῆρος ἡμῶν
  choice: Cứu Chúa của chúng ta
  rationale: Cụm đồng vị trực tiếp xác định Đấng Mê-si-a Giê-su là Cứu Chúa của chúng ta.
theological_decisions:
- issue: Cách dịch Χριστός trong Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Χριστός vẫn mang nội dung tước hiệu 'Đấng được xức dầu'; dịch 'Đấng Mê-si-a' làm rõ nội dung đó mà không biến tước hiệu thành tên riêng.
- issue: Từ σωτῆρος ἡμῶν quy chiếu đến ai
  choice: '''Cứu Chúa của chúng ta'' đồng vị với Đấng Mê-si-a Giê-su'
  alternative: Hiểu rộng hơn như một tước hiệu liên hệ với toàn bộ cụm nguồn ban ân điển và bình an
  rationale: Mạo từ τοῦ và vị trí ngay sau Χριστοῦ Ἰησοῦ cho thấy cụm này tự nhiên nhất là đồng vị với Giê-su.
- issue: Sắc thái của lời chào χάρις καὶ εἰρήνη
  choice: 'Diễn đạt thành lời cầu chúc: ''Cầu xin ... ở cùng con'''
  alternative: 'Dịch tỉnh lược: ''ân điển và bình an từ...'''
  rationale: Nguyên văn là lời chào danh từ tỉnh lược động từ; tiếng Việt cần bổ sung động từ để câu tự nhiên, nhưng vẫn giữ nguồn ban là Đức Chúa Trời và Đấng Mê-si-a Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'con' ở cuối lời chúc để phù hợp với hình ảnh 'người con' và quan hệ người viết-người nhận; phần bổ sung này làm rõ động từ và đối tượng vốn được tỉnh lược trong lời chào Hy Lạp.
