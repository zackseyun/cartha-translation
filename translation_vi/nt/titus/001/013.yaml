source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: vi
  text: Lời chứng này là thật. Vì lý do đó, hãy quở trách họ cách nghiêm khắc, để họ được vững vàng trong đức tin[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp cũng có thể được hiểu là “vững vàng trong lòng tin”; hoặc là “vững vàng trong đức tin Cơ Đốc” xét như một hệ thống niềm tin.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: lời chứng
  rationale: Giữ sắc thái chứng nhận hay lời xác quyết về người Cơ-rết trong câu trích dẫn ngay trước đó; cụ thể hơn “lời nói” và tự nhiên hơn “chứng ngôn” trong tiếng Việt hiện đại.
- source_word: ἀληθής
  choice: thật
  rationale: 'Diễn đạt trực tiếp tính chân thực của lời chứng và tạo câu tiếng Việt gọn, tự nhiên: “Lời chứng ấy là thật.”'
- source_word: δι’ ἣν αἰτίαν
  choice: Vì lý do đó
  rationale: Giữ rõ quan hệ nguyên nhân–kết quả với nhận định ngay trước, đồng thời phù hợp văn phong tiếng Việt hiện đại.
- source_word: ἔλεγχε
  choice: quở trách
  rationale: Thể hiện mệnh lệnh phải trực tiếp đối diện và sửa trị sai lầm; mạnh hơn “sửa bảo” nhưng không nhất thiết hàm ý trừng phạt.
- source_word: ἀποτόμως
  choice: nghiêm khắc
  rationale: Chuyển tải mức độ mạnh và dứt khoát của sự quở trách bằng cách diễn đạt tự nhiên trong tiếng Việt, không đẩy nghĩa sang sự tàn nhẫn.
- source_word: ὑγιαίνωσιν
  choice: được lành mạnh
  rationale: Giữ hình ảnh sức khỏe của động từ Hy Lạp, đồng thời cho thấy mục đích phục hồi của việc quở trách.
- source_word: ἐν τῇ πίστει
  choice: trong đức tin
  rationale: 'Giữ cấu trúc và độ mơ hồ của nguyên văn: cụm từ có thể nói về tình trạng lành mạnh trong việc tin hoặc trong đức tin Cơ Đốc xét như nội dung được tin.'
theological_decisions:
- issue: Ý nghĩa của ἐν τῇ πίστει
  choice: trong đức tin
  alternative: trong việc tin; trong đức tin Cơ Đốc như một hệ thống niềm tin
  rationale: Nguyên văn có thể hướng đến đức tin chủ quan của họ hoặc đến đức tin Cơ Đốc như nội dung chân lý. Bản dịch chính không thêm từ để quyết định thay cho độc giả; chú thích nêu rõ hai khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Lời chứng ấy” chỉ ngược về lời trích dẫn trước đó. Cách nói “được lành mạnh trong đức tin” cố ý giữ ẩn dụ sức khỏe và sự mơ hồ thần học của nguyên văn; dấu phẩy cuối câu được giữ vì câu nguồn tiếp tục sang câu kế tiếp.
