revisions:
- from: Lời chứng ấy là thật. Vì lý do đó, hãy nghiêm khắc quở trách họ, để họ được lành mạnh trong đức tin[a],
  to: Lời chứng này là thật. Vì lý do đó, hãy quở trách họ cách nghiêm khắc, để họ được vững vàng trong đức tin[a],
  rationale: Sửa cách diễn đạt để tiếng Việt hiện đại tự nhiên hơn, đồng thời giữ lực của mệnh lệnh ἔλεγχε ἀποτόμως và mục đích phục hồi hàm trong ὑγιαίνωσιν. “Vững vàng” diễn đạt nghĩa bóng “sound/healthy” trong ngữ cảnh này mà không thêm một diễn giải giáo phái. Chú thích được viết lại để bảo tồn và giải thích hai cách hiểu có thể có của ἐν τῇ πίστει.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:44Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh đề xác quyết, quan hệ nguyên nhân, mệnh lệnh quở trách mạnh mẽ, và mục đích để họ trở nên “sound” trong đức tin. Tuy nhiên, “được lành mạnh trong đức tin” không tự nhiên trong tiếng Việt và cách dùng bị động “được” không phản ánh trực tiếp lối diễn đạt chủ động của ὑγιαίνωσιν.
  naturalness: “Để họ được lành mạnh trong đức tin” gượng và khó hiểu trong tiếng Việt hiện đại. “Để họ được vững vàng trong đức tin” tự nhiên, trang trọng, và diễn đạt phù hợp nghĩa bóng về sự lành mạnh/vững chắc trong đức tin. Chú thích hiện có cũng cần sửa các cụm không tự nhiên như “vững đúng” và “trong việc tin.”
  terminology: “Lời chứng,” “quở trách,” và “đức tin” đều phù hợp ngữ cảnh. “Nghiêm khắc quở trách” có thể hiểu được, nhưng “quở trách họ cách nghiêm khắc” là trật tự từ tự nhiên hơn. Giữ “đức tin” trong bản chính là thích hợp để không quyết định dứt khoát giữa lòng tin của người ấy và đức tin Cơ Đốc như nội dung được tin; chú thích nêu khả năng sau.
  issues:
  - severity: medium
    issue: Cụm “được lành mạnh trong đức tin” thiếu tự nhiên.
    rationale: Tiếng Việt hiện đại ít dùng “lành mạnh” để mô tả trực tiếp một người “trong đức tin,” và “được” khiến cấu trúc bị động gượng. Cần một cách nói thành ngữ hơn mà vẫn giữ nghĩa ẩn dụ của ὑγιαίνωσιν.
  - severity: medium
    issue: 'Chú thích có những cách diễn đạt không chuẩn tự nhiên: “trong việc tin” và “vững đúng.”'
    rationale: Các cụm này không diễn đạt rõ và tự nhiên hai khả năng ngữ nghĩa của ἐν τῇ πίστει. Chú thích nên trình bày khả năng “lòng tin/việc tin” và “đức tin Cơ Đốc như một hệ thống niềm tin” bằng tiếng Việt rõ ràng.
  revised_text: Lời chứng này là thật. Vì lý do đó, hãy quở trách họ cách nghiêm khắc, để họ được vững vàng trong đức tin[a],
