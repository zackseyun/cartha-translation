source:
  edition: SBLGNT
  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: vi
  text: không chú tâm đến những chuyện hoang đường của người Do Thái và những điều răn của những người quay lưng với chân lý.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không chuyên tâm vào những chuyện hoang đường của người Do Thái và những mệnh lệnh của con người—những người quay lưng với chân lý.”'
    reason: Nêu sắc thái khác của προσέχοντες và cách diễn đạt khác cho ἐντολαῖς ἀνθρώπων, đồng thời vẫn giữ mối liên hệ tự nhiên của phân từ với “những người”.
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: không chú tâm đến
  rationale: Cụm phân từ hiện tại tiếp nối lời khuyên ở câu trước và diễn tả điều họ không nên hướng tâm trí vào. “Không chú tâm đến” tự nhiên trong tiếng Việt hiện đại, đồng thời giữ được ý chú ý và dấn mình theo điều gì.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: những chuyện hoang đường của người Do Thái
  rationale: μῦθος chỉ những câu chuyện bịa đặt hoặc truyền thuyết không đáng tin; “chuyện hoang đường” rõ nghĩa và tự nhiên. Ἰουδαϊκοῖς xác định đặc tính hoặc nguồn gốc Do Thái của các chuyện ấy.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: những điều răn của những người
  rationale: ἐντολαῖς là các mệnh lệnh hoặc điều răn, còn ἀνθρώπων là sở hữu cách số nhiều. Cách dịch này vừa sát cấu trúc Hy Lạp vừa cho phép phân từ theo sau bổ nghĩa tự nhiên cho “những người”; câu nhấn mạnh nguồn gốc con người của các điều răn này.
- source_word: ἀποστρεφομένων
  choice: quay lưng với
  rationale: Phân từ sở hữu cách số nhiều bổ nghĩa tự nhiên nhất cho ἀνθρώπων. “Quay lưng với” giữ hình ảnh rời bỏ hoặc khước từ, thay vì thu hẹp nghĩa thành một hành động thuần túy trí thức.
- source_word: τὴν ἀλήθειαν
  choice: chân lý
  rationale: “Chân lý” là cách diễn đạt trang trọng, tự nhiên cho ἀλήθεια trong ngữ cảnh nói về điều người ta quay lưng lại. Không thêm “Tin Lành” vì bản văn không nói rõ như vậy.
theological_decisions:
- issue: Đối tượng được phân từ ἀποστρεφομένων bổ nghĩa
  choice: 'Hiểu phân từ là bổ nghĩa cho “những người”: “những điều răn của những người quay lưng với chân lý.”'
  alternative: Có thể hiểu rộng hơn rằng cả các chuyện hoang đường lẫn các điều răn đều gắn với những người quay lưng với chân lý.
  rationale: Sự phù hợp về sở hữu cách số nhiều và vị trí gần nhất khiến ἀνθρώπων là mối liên hệ ngữ pháp tự nhiên nhất. Cách dịch này không thêm một khẳng định thần học vượt quá cấu trúc của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chuyện hoang đường” thay cho từ vay mượn “huyền thoại”; dùng “quay lưng với” để giữ hình ảnh của động từ Hy Lạp. Dấu chú thích được đặt ngay sau câu có liên quan.
