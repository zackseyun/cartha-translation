source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: vi
  text: phải giữ vững lời đáng tin cậy[a], phù hợp với giáo huấn, để có thể vừa khuyên nhủ bằng giáo huấn lành mạnh, vừa khiển trách những người phản bác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữ chặt lời trung tín theo giáo huấn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bác bỏ những người phản bác.” Động từ Hy Lạp có thể mang nghĩa vạch rõ hoặc chứng minh một người là sai, cũng như khiển trách người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: giữ vững
  rationale: Diễn tả sự kiên định bám giữ và gắn bó; cách nói này tự nhiên trong tiếng Việt và phù hợp với ngữ cảnh về phẩm chất của một trưởng lão.
- source_word: πιστοῦ λόγου
  choice: lời đáng tin cậy
  rationale: πιστός ở đây chủ yếu chỉ tính xác thực, đáng tin của lời được truyền lại; giữ λόγος là “lời” để không thu hẹp nghĩa thành một thông điệp riêng lẻ.
- source_word: κατὰ τὴν διδαχήν
  choice: phù hợp với sự dạy dỗ
  rationale: κατά với đối cách diễn tả sự phù hợp theo một chuẩn mực; mạo từ xác định cho thấy đây là sự dạy dỗ đã được nhìn nhận, không phải ý kiến riêng.
- source_word: παρακαλεῖν
  choice: khuyên nhủ
  rationale: Trong ngữ cảnh lãnh đạo hội thánh, từ này mang ý khích lệ và thúc giục có thẩm quyền; “khuyên nhủ” truyền đạt được cả sự nâng đỡ lẫn kêu gọi hành động.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: bằng sự dạy dỗ lành mạnh
  rationale: Giữ hình ảnh ẩn dụ về điều khỏe mạnh của ὑγιαίνω, đồng thời dùng cách diễn đạt quen thuộc, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀντιλέγοντας
  choice: những người chống đối
  rationale: Chỉ những người lên tiếng phản bác lời hoặc sự dạy dỗ vừa được nhắc đến. “Chống đối” tự nhiên hơn cách dịch sát chữ “nói ngược lại” mà không thêm một tân ngữ không hiện diện trong tiếng Hy Lạp.
- source_word: ἐλέγχειν
  choice: khiển trách
  rationale: Từ này có thể bao gồm vạch rõ sai lầm, chứng minh là sai và sửa trách. “Khiển trách” giữ được sức nặng mục vụ của hành động sửa trị; sắc thái “bác bỏ” được ghi ở chú thích.
- source_word: δυνατὸς ᾖ
  choice: có khả năng
  rationale: Diễn đạt tự nhiên mục đích của ἵνα cùng ý niệm có đủ năng lực để thực hiện cả hai nhiệm vụ tiếp theo.
theological_decisions:
- issue: Sở chỉ của “lời đáng tin cậy” và “sự dạy dỗ”
  choice: Bản dịch trình bày đây là lời phù hợp với sự dạy dỗ đã được nhìn nhận và giao phó cho người lãnh đạo hội thánh.
  alternative: Hiểu theo nghĩa rộng hơn là lời giáo huấn đạo đức nói chung.
  rationale: Mạo từ của διδαχή và cách dùng πιστὸς λόγος trong các Thư Mục vụ hướng đến một nội dung giáo huấn Cơ Đốc đã ổn định; bản dịch không đồng nhất nội dung này với bất kỳ hệ thống tín điều hậu kỳ nào.
- issue: Sắc thái của ἐλέγχειν đối với người chống đối
  choice: khiển trách
  alternative: bác bỏ hoặc chứng minh là sai
  rationale: Mạch câu đặt việc khuyên nhủ tích cực bên cạnh việc sửa trị người chống đối. “Khiển trách” giữ lực sửa dạy, còn chú thích bảo lưu sắc thái tranh biện và vạch rõ sai lầm.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng từ phổ thông. “Sự dạy dỗ lành mạnh” giữ ẩn dụ của nguyên ngữ mà vẫn quen thuộc trong ngôn ngữ hội thánh; tránh thuật ngữ hệ phái và không làm rõ quá mức đối tượng ngầm của hành động chống đối.
