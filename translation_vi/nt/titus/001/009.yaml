- from: phải giữ vững lời đáng tin cậy[a] phù hợp với sự dạy dỗ, để có khả năng vừa khuyên nhủ bằng sự dạy dỗ lành mạnh, vừa khiển trách những người chống đối[b].
  to: phải giữ vững lời đáng tin cậy[a], phù hợp với giáo huấn, để có thể vừa khuyên nhủ bằng giáo huấn lành mạnh, vừa khiển trách những người phản bác[b].
  rationale: Sửa “chống đối” thành “phản bác” để phản ánh chính xác hơn ἀντιλέγοντας, và thay “sự dạy dỗ” bằng “giáo huấn” để câu tự nhiên, nhất quán hơn. Không thêm tân ngữ cho “phản bác”, vì tân ngữ được nguyên ngữ để ngầm theo ngữ cảnh. Chú thích được cập nhật để đồng bộ với bản văn.
  reviewer_model: gpt-5.6-terra
