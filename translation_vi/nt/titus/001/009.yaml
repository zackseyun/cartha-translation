    rationale: Phân từ này chỉ người phản bác hoặc nói ngược lại, trong ngữ cảnh là phản bác lời/giáo huấn vừa nêu; “chống đối” có thể bao quát cả sự đối kháng không bằng lời nói.
  - severity: low
    issue: “sự dạy dỗ” lặp lại và kém gọn trong câu.
    rationale: διδαχή ở cả hai chỗ có thể dịch nhất quán là “giáo huấn”, vừa tự nhiên hơn vừa vẫn biểu thị một nội dung giáo huấn đã được thừa nhận.
