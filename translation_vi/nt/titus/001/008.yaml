  text: ἀλλὰ φιλόξενον, φιλάγαθον, σώφρονα, δίκαιον, ὅσιον, ἐγκρατῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/008.yaml
  text: but hospitable[a], loving what is good, self-controlled, upright, holy, and disciplined[d][c][b],
translation:
  language: vi
  text: nhưng phải hiếu khách, yêu điều thiện, biết suy xét[a], công chính[b], thánh khiết[c] và tự chủ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hai từ Hy Lạp ở đây có nghĩa gần nhau nhưng khác trọng tâm: “biết suy xét” (σώφρονα) nói đến sự sáng suốt, chừng mực; “tự chủ” (ἐγκρατῆ) nói đến khả năng chế ngự bản thân.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ngay thẳng” hoặc “công bằng”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “thành kính”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng phải
  rationale: Liên từ tạo thế tương phản với các tính xấu ở câu trước; thêm “phải” để nối tự nhiên với yêu cầu dành cho người giám sát trong câu 7 mà không thay đổi nội dung.
- source_word: φιλόξενον
  choice: hiếu khách
  rationale: Diễn đạt tự nhiên phẩm chất sẵn lòng đón tiếp khách và người lạ.
- source_word: φιλάγαθον
  choice: yêu điều thiện
  rationale: Giữ rõ đối tượng của tình yêu là điều tốt lành, phù hợp cấu tạo và nghĩa của từ Hy Lạp.
- source_word: σώφρονα
  choice: biết suy xét
  rationale: Nêu sắc thái đầu óc tỉnh táo, chừng mực và phán đoán đúng đắn, đồng thời phân biệt với ἐγκρατῆ ở cuối câu.
- source_word: δίκαιον
  choice: công chính
  rationale: Bao quát sự ngay thẳng và cách cư xử đúng đắn; không thu hẹp vào nghĩa tư pháp.
- source_word: ὅσιον
  choice: thánh khiết
  rationale: Diễn tả sự thành kính và tư cách phù hợp với điều thánh; giữ được sức nặng tôn giáo của từ.
- source_word: ἐγκρατῆ
  choice: tự chủ
  rationale: Nhấn mạnh khả năng chế ngự ham muốn và xung động của bản thân.
theological_decisions:
- issue: Phân biệt hai phẩm chất gần nghĩa σώφρονα và ἐγκρατῆ
  choice: Dịch σώφρονα là “biết suy xét” và ἐγκρατῆ là “tự chủ”.
  alternative: Có thể dịch lần lượt là “tiết độ” và “tự chủ”, hoặc dùng hai cách diễn đạt gần nghĩa hơn.
  rationale: 'Hai từ Hy Lạp có miền nghĩa giao nhau nhưng không đồng nhất: từ trước nghiêng về sự sáng suốt, chừng mực; từ sau nhấn mạnh việc làm chủ bản thân. Cách dịch này tránh nhập hai phẩm chất thành một.'
- issue: Sắc thái của ὅσιον
  choice: thánh khiết
  alternative: thành kính
  rationale: “Thánh khiết” giữ mối liên hệ với điều thánh, còn “thành kính” nhấn mạnh lòng sùng kính. Ngữ cảnh danh sách phẩm chất cho phép cả hai sắc thái, nên ghi chú phương án kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chuỗi tính từ được diễn đạt cân đối; dùng “biết suy xét” và “tự chủ” để bảo toàn sự phân biệt giữa hai đức tính gần nghĩa trong nguyên văn.
