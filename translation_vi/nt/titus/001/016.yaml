  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: vi
  text: Họ tuyên bố rằng mình biết Đức Chúa Trời[a], nhưng bằng việc làm của mình, họ chối bỏ Ngài[b]; họ là những kẻ đáng ghê tởm[c], không vâng phục và không đủ tư cách cho mọi việc lành[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ tự nhận mình biết Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “nhưng bằng hành động của mình, họ phủ nhận Ngài.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “đáng kinh tởm.”'
    reason: lexical_alternative
  - marker: d
    text: 'Hay: “không thích hợp cho mọi việc lành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Đức Chúa Trời
  rationale: Tân ngữ của ὁμολογοῦσιν εἰδέναι; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt đối với Đấng mà họ tuyên bố mình biết.
- source_word: ὁμολογοῦσιν
  choice: tuyên bố
  rationale: Trong thế đối lập giữa lời nói và hành vi, “tuyên bố” diễn đạt rõ một lời công khai xác nhận mà không mặc nhiên khẳng định sự chân thành.
- source_word: εἰδέναι
  choice: biết
  rationale: Động từ nguyên mẫu bổ nghĩa cho ὁμολογοῦσιν, chỉ việc họ tự nhận có sự nhận biết Đức Chúa Trời.
- source_word: τοῖς δὲ ἔργοις
  choice: nhưng qua việc làm
  rationale: Dữ cách có thể chỉ phương tiện hoặc phương diện; “qua việc làm” tự nhiên trong tiếng Việt và cho thấy chính hành vi của họ biểu lộ sự chối bỏ.
- source_word: ἀρνοῦνται
  choice: họ lại chối bỏ Ngài
  rationale: “Chối bỏ” giữ được sức mạnh của động từ và sự tương phản với lời tuyên bố; “Ngài” được hiểu từ “Đức Chúa Trời” ở vế trước.
- source_word: βδελυκτοὶ
  choice: đáng ghê tởm
  rationale: Diễn đạt sự đáng kinh tởm về mặt đạo đức với mức độ mạnh, nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ὄντες
  choice: Họ là những kẻ
  rationale: Chuyển phân từ sang một mệnh đề độc lập để câu tiếng Việt rõ và tự nhiên, đồng thời giữ chức năng nêu các đặc điểm của họ.
- source_word: ἀπειθεῖς
  choice: không vâng phục
  rationale: Trong văn cảnh đạo đức, từ này nói đến thái độ không chịu phục tùng hơn là chỉ không bị thuyết phục.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: cho bất cứ việc lành nào
  rationale: πρός cùng đối cách diễn tả sự thích hợp đối với một mục đích; “bất cứ việc lành nào” truyền đạt tự nhiên phạm vi bao quát của πᾶν.
- source_word: ἀδόκιμοι
  choice: không thích hợp
  rationale: Diễn tả việc không đạt chuẩn hoặc không dùng được cho việc lành, nhưng tránh thu hẹp nghĩa vào một sự truất quyền mang tính thủ tục.
theological_decisions:
- issue: Mối quan hệ giữa lời tuyên bố và sự chối bỏ bằng hành vi
  choice: Câu dịch nói rằng họ tuyên bố biết Đức Chúa Trời nhưng chính việc làm của họ lại chối bỏ Ngài.
  alternative: Có thể hiểu sự chối bỏ theo nghĩa rộng là phủ nhận chân lý của Đức Chúa Trời.
  rationale: “Đức Chúa Trời” là tân ngữ được nêu rõ trong vế đầu và tự nhiên được hiểu tiếp làm đối tượng của ἀρνοῦνται. Cách dịch giữ nguyên sự căng thẳng giữa lời xưng nhận và đời sống mà không mở rộng thành một khẳng định giáo lý ngoài văn bản.
- issue: Ý nghĩa của ἀδόκιμοι đối với việc lành
  choice: “Không thích hợp” nhấn mạnh họ không đạt chuẩn hay không dùng được cho bất cứ việc lành nào.
  alternative: “Không đủ tư cách” hoặc “bị loại” có thể nhấn mạnh việc không vượt qua sự thử nghiệm.
  rationale: Từ Hy Lạp có trường nghĩa về việc không đạt chuẩn sau khi được thử nghiệm. Bản dịch chính giữ nghĩa rộng, còn chú thích bảo tồn sắc thái “không đủ tư cách” có thể có.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, câu ngắn và dễ hiểu. “Tuyên bố” làm nổi bật sự đối lập giữa lời nói và việc làm; “việc lành” duy trì sắc thái Kinh Thánh quen thuộc mà vẫn rõ nghĩa với độc giả phổ thông.
