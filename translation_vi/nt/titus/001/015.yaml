  source_fidelity: 'Bản dịch giữ đúng cấu trúc đối xứng và ý nghĩa cốt lõi của nguyên văn: πάντες/πάντα được diễn đạt bao quát, καθαρός được nhất quán là “thanh sạch,” và sự ô uế được quy cho cả tâm trí lẫn lương tâm. Tuy nhiên, “những kẻ” có sắc thái miệt thị không cần thiết trong tiếng Việt hiện đại; nguyên văn mô tả những người ở trong tình trạng ô uế và không tin, không thêm một danh xưng miệt thị.'
