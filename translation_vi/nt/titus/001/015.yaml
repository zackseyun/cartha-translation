id: TIT.1.15
reference: Titus 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: vi
  text: Mọi sự đều thanh sạch[a] đối với người thanh sạch; nhưng đối với những người đã bị ô uế và không tin, chẳng có gì là thanh sạch. Trái lại, cả tâm trí lẫn lương tâm của họ đều đã bị ô uế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sạch” xuyên suốt câu này; từ Hy Lạp có thể bao hàm cả sắc thái thanh sạch theo nghi lễ lẫn trong sạch về đạo đức.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Mọi sự
  rationale: Đại từ trung tính số nhiều mang nghĩa bao quát; “mọi sự” giữ được phạm vi rộng và sắc thái châm ngôn của câu.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: thanh sạch / người thanh sạch
  rationale: “Thanh sạch” có thể gợi cả sự sạch theo nghi lễ lẫn sự trong sạch về đạo đức, nhờ đó không thu hẹp nghĩa của καθαρός.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: đối với những kẻ ô uế
  rationale: Phân từ hoàn thành diễn tả tình trạng ô uế do sự làm ô uế đã xảy ra; cách dịch này tự nhiên và giữ được sắc thái trạng thái.
- source_word: ἀπίστοις
  choice: không tin
  rationale: Trong ngữ cảnh, từ này chủ yếu đối lập với đức tin chân thật; “không tin” rõ ràng hơn “bất tín”, vốn có thể gợi nghĩa không trung thành.
- source_word: οὐδὲν καθαρόν
  choice: chẳng có gì là thanh sạch
  rationale: Giữ cấu trúc vị ngữ và sự đối xứng với mệnh đề đầu.
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: 'Diễn đạt sự tương phản mạnh: vấn đề thực nằm ở tình trạng bên trong của họ.'
- source_word: μεμίανται
  choice: đều đã bị ô uế
  rationale: Thì hoàn thành nhấn mạnh một hành động dẫn đến tình trạng hiện tại; “đã bị ô uế” thể hiện rõ hơn sắc thái kết quả còn kéo dài.
- source_word: νοῦς
  choice: tâm trí
  rationale: Cách nói tự nhiên trong tiếng Việt cho khả năng suy nghĩ và nhận thức.
- source_word: συνείδησις
  choice: lương tâm
  rationale: Từ tương đương chuẩn trong ngữ cảnh Phao-lô, chỉ khả năng tự nhận thức và phán đoán về đạo đức.
- source_word: καὶ ... καὶ
  choice: cả ... lẫn ... đều
  rationale: Làm nổi bật rằng cả hai phương diện bên trong đều chịu sự ô uế.
theological_decisions:
- issue: Phạm vi của ngôn ngữ về sự thanh sạch
  choice: Dùng “thanh sạch” xuyên suốt để giữ cả sắc thái nghi lễ lẫn đạo đức.
  alternative: Dùng “sạch” xuyên suốt, nghiêng nhiều hơn về phạm trù thanh sạch theo nghi lễ.
  rationale: Ngữ cảnh có liên hệ đến các quy định và tranh luận Do Thái, nhưng lời khẳng định cũng hướng đến tình trạng nội tâm. “Thanh sạch” giữ được bề rộng và sự căng thẳng thần học ấy mà không giới hạn câu vào luật lệ về thức ăn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc châm ngôn cùng phép đối xứng của nguyên văn; dùng “thanh sạch” và “ô uế” để bảo tồn đồng thời sắc thái nghi lễ và đạo đức.
