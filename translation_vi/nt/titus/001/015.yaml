  to: Mọi sự đều thanh sạch[a] đối với người thanh sạch; nhưng đối với những người đã bị ô uế và không tin, chẳng có gì là thanh sạch. Trái lại, cả tâm trí lẫn lương tâm của họ đều đã bị ô uế.
