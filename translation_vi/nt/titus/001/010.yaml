  source_fidelity: Bản dịch truyền đạt đúng mạch giải thích của γὰρ, số lượng “nhiều,” tính không phục tùng, lời nói vô ích, hành vi đánh lừa, và sự nhấn mạnh “nhất là.” Cụm οἱ ἐκ τῆς περιτομῆς được giữ không xác định quá mức. Tuy nhiên, “giới chịu cắt bì” hơi gượng trong tiếng Việt hiện đại; “giới cắt bì” tự nhiên hơn mà vẫn không biến cụm này thành một đảng phái xác định.
