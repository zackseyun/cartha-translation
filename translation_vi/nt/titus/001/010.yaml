  terminology: “Không chịu phục tùng,” “lời rỗng tuếch,” và “lừa dối người khác” phù hợp ngữ cảnh. “Giới cắt bì” là cách gọi gọn, tự nhiên cho cụm Hy Lạp, còn chú thích bảo toàn các khả năng diễn giải lịch sử mà không áp đặt chúng vào bản văn chính.
  issues:
