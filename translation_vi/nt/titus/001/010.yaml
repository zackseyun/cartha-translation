  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: vi
  text: Vì có nhiều người không chịu phục tùng, chuyên nói lời rỗng tuếch và lừa dối người khác, nhất là những người thuộc giới cắt bì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người thuộc phe chủ trương cắt bì” hoặc “những người từ giới cắt bì.” Cụm từ này có lẽ chỉ các đối thủ người Do Thái hoặc những người cổ xúy việc cắt bì, nhưng nguyên văn Hy Lạp không nói rõ như vậy.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do giải thích cho chỉ thị ở câu trước và giữ mạch lập luận tự nhiên trong tiếng Việt.
- source_word: πολλοὶ
  choice: nhiều kẻ
  rationale: Diễn đạt số lượng, đồng thời thêm danh từ để các tính từ và danh từ chỉ người tiếp theo được tự nhiên trong tiếng Việt; “kẻ” phù hợp với sắc thái phê phán của ngữ cảnh.
- source_word: ἀνυπότακτοι
  choice: không chịu phục tùng
  rationale: Diễn tả sự khước từ phục tùng thẩm quyền chính đáng, rõ nghĩa và tự nhiên hơn cách dùng thuật ngữ Hán-Việt nặng nề.
- source_word: ματαιολόγοι
  choice: nói những lời rỗng tuếch
  rationale: Giữ ý về lời nói vô ích, trống rỗng và sắc thái phê phán của từ ghép Hy Lạp.
- source_word: φρεναπάται
  choice: lừa dối người khác
  rationale: Chuyển nghĩa chỉ những kẻ đánh lừa hoặc làm người khác lạc hướng sang lối nói tự nhiên; không cố tái tạo máy móc sắc thái nguyên tự liên quan đến tâm trí.
- source_word: μάλιστα
  choice: nhất là
  rationale: Đánh dấu một nhóm được đặc biệt nhấn mạnh trong số nhiều người vừa nêu.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: những người thuộc giới chịu cắt bì
  rationale: Giữ tương đối minh bạch thành ngữ “những người từ/thuộc sự cắt bì” mà không xác định dứt khoát họ là toàn thể người Do Thái hay một đảng phái cụ thể.
theological_decisions:
- issue: Đối tượng của cụm οἱ ἐκ τῆς περιτομῆς
  choice: những người thuộc giới chịu cắt bì
  alternative: những người thuộc phe chủ trương cắt bì; những người Do Thái
  rationale: Cụm Hy Lạp có thể chỉ những đối thủ người Do Thái hoặc những người cổ xúy việc cắt bì, nhưng không nói rõ “phe” hay trực tiếp dùng danh xưng “người Do Thái.” Bản dịch chính giữ độ hàm súc và sự mơ hồ có thật của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “không chịu phục tùng” và “nói những lời rỗng tuếch” để tránh lối diễn đạt quá cổ hoặc quá chuyên môn; giữ cụm chỉ sự cắt bì đủ gần nguyên văn và giải thích các cách hiểu trong chú thích.
