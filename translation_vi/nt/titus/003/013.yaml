base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: vi
  text: Hãy tận tình giúp Xê-na, luật gia, và A-pô-lô lên đường[a], để họ không thiếu điều gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tận tình lo liệu hành trình cho Xê-na, luật gia, và A-pô-lô.” Động từ Hy Lạp có thể bao hàm việc cung cấp những gì cần thiết cho chuyến đi, chứ không chỉ tiễn họ lên đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζηνᾶν
  choice: Xê-na
  rationale: Phiên âm tên riêng theo cách đọc Hy Lạp và quy ước viết tên nước ngoài dễ đọc trong tiếng Việt.
- source_word: τὸν νομικὸν
  choice: luật gia
  rationale: νομικός chỉ người thông thạo luật pháp; ở đây là thành phần đồng vị mô tả Xê-na. “Luật gia” ngắn gọn, tự nhiên và không mặc nhiên biến cụm từ này thành một chức danh thần học.
- source_word: Ἀπολλῶν
  choice: A-pô-lô
  rationale: Phiên âm tên riêng theo cách gọi quen thuộc và dễ nhận biết trong tiếng Việt.
- source_word: σπουδαίως
  choice: tận tình
  rationale: Trạng từ diễn tả sự sốt sắng, nghiêm túc và chu đáo. “Tận tình” kết hợp tự nhiên với việc trợ giúp người đi đường mà không thu hẹp nghĩa thành chỉ nhanh chóng.
- source_word: πρόπεμψον
  choice: giúp ... lên đường
  rationale: Trong bối cảnh hành trình, προπέμπω thường bao hàm việc tiễn đi và cung cấp sự trợ giúp cần thiết, chứ không chỉ đơn thuần bảo ai rời đi.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: để họ không thiếu thốn điều gì
  rationale: Giữ rõ ý mục đích và phạm vi rộng của μηδέν, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
