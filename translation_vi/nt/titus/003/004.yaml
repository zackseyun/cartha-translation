base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: vi
  text: Nhưng khi lòng nhân từ và tình yêu thương dành cho loài người của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta, đã xuất hiện,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được bày tỏ” hoặc “trở nên hiển hiện.” Động từ Hy Lạp diễn tả việc xuất hiện hay trở nên hiển hiện.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: ὅτε mở đầu mệnh đề thời gian, còn δέ tạo sự chuyển ý và tương phản nhẹ với tình trạng tội lỗi được mô tả trước đó.
- source_word: χρηστότης
  choice: lòng nhân từ
  rationale: Cụm này diễn đạt sự tử tế, tốt lành và thái độ nhân hậu trong quan hệ; “lòng nhân từ” tự nhiên, trang trọng và không trùng nghĩa với φιλανθρωπία.
- source_word: φιλανθρωπία
  choice: tình yêu thương dành cho loài người
  rationale: Từ Hy Lạp chỉ lòng yêu thương hay thiện ý đối với con người; cách dịch này minh bạch và tránh các nghĩa kỹ thuật hiện đại có thể gắn với “nhân đạo”.
- source_word: ἐπεφάνη
  choice: được bày tỏ
  rationale: Động từ diễn tả việc xuất hiện hay trở nên hiển hiện. “Được bày tỏ” tự nhiên trong tiếng Việt và giữ ý về sự biểu lộ mà không xác định quá mức phương thức.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta
  rationale: Cách đặt cụm đồng vị này tự nhiên trong tiếng Việt, bảo toàn tước hiệu “Đấng Cứu Rỗi” dành cho Đức Chúa Trời và cho thấy toàn bộ cụm sở hữu bổ nghĩa cho cả “lòng nhân từ” lẫn “tình yêu thương”.
theological_decisions:
- issue: Đối tượng được gọi là “Đức Chúa Trời, Đấng Cứu Rỗi chúng ta”
  choice: Giữ nguyên tước hiệu dành cho Đức Chúa Trời; trong văn cảnh câu này, cụm từ thường được hiểu là chỉ Đức Chúa Cha.
  alternative: Có thể đọc đây đơn giản là một tước hiệu thần linh mà không xác định ngôi vị chỉ từ riêng câu này.
  rationale: Các Thư Mục Vụ thường dùng “Đức Chúa Trời, Đấng Cứu Rỗi chúng ta” cho Đức Chúa Cha, trong khi câu 6 nhắc riêng đến Đức Chúa Jêsus Christ. Bản dịch không thêm lời giải nghĩa vào chính văn, nhờ đó tránh hòa lẫn các ngôi hoặc giải quyết quá mức sức căng thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “loài người” để diễn đạt tập thể nhân loại, còn “tình yêu thương dành cho” làm rõ hướng của φιλανθρωπία. Dấu phẩy làm rõ cụm đồng vị “Đấng Cứu Rỗi chúng ta.”
