id: TIT.3.7
reference: Titus 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: vi
  text: để sau khi được xưng công chính[b] bởi ân điển của Ngài, chúng ta trở nên những người thừa kế theo niềm hy vọng về sự sống đời đời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong niềm hy vọng về sự sống đời đời.”
    reason: lexical_alternative
  - marker: b
    text: “Được xưng công chính” cũng có thể dịch là “được tuyên bố là công chính.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả của mệnh đề mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: δικαιωθέντες
  choice: sau khi được xưng công chính
  rationale: Giữ thể bị động và hành động xảy ra trước động từ chính của phân từ bất định quá khứ; đồng thời duy trì mối liên hệ với thuật ngữ δικαιόω.
- source_word: τῇ ἐκείνου χάριτι
  choice: bởi ân điển của Ngài
  rationale: Diễn đạt cách dùng phương tiện của tặng cách. “Ngài” giữ đại từ mà không nêu đích danh chủ thể là Đức Chúa Trời hay Chúa Giê-su Christ.
- source_word: κληρονόμοι
  choice: những người thừa kế
  rationale: Giữ nguyên hình ảnh pháp lý và giao ước về quyền thừa kế.
- source_word: γενηθῶμεν
  choice: chúng ta trở nên
  rationale: Phản ánh ý bước vào một địa vị mới của γίνομαι, thay vì thêm rõ tác nhân như cách dịch “được làm cho trở thành”.
- source_word: κατ’ ἐλπίδα
  choice: theo niềm hy vọng
  rationale: Giữ tương đối sát giới từ κατά và mối liên hệ giữa địa vị thừa kế với niềm trông đợi cánh chung; cách hiểu “trong niềm hy vọng” được ghi ở chú thích.
- source_word: ζωῆς αἰωνίου
  choice: về sự sống đời đời
  rationale: Diễn đạt sở hữu cách như nội dung hoặc đối tượng của niềm hy vọng bằng thuật ngữ Kinh Thánh quen thuộc.
theological_decisions:
- issue: Ý nghĩa của δικαιωθέντες trong ngữ cảnh cứu rỗi
  choice: được xưng công chính
  alternative: được tuyên bố là công chính
  rationale: “Xưng công chính” duy trì thuật ngữ thần học và dạng bị động, nhưng chú thích cung cấp cách diễn đạt giải nghĩa gần nghĩa mà không thu hẹp cơ chế được nói đến.
- issue: Đối tượng được ἐκείνου chỉ đến
  choice: của Ngài
  alternative: của Đức Chúa Trời / của Chúa Giê-su Christ
  rationale: Không nêu danh tính cụ thể để giữ mức độ hàm ẩn của nguyên văn trong ngữ cảnh nói về hành động cứu rỗi của Đức Chúa Trời qua Chúa Giê-su Christ.
- issue: Quan hệ cú pháp của κατ’ ἐλπίδα
  choice: theo niềm hy vọng về sự sống đời đời
  alternative: trong niềm hy vọng về sự sống đời đời
  rationale: Bản chính giữ cấu trúc κατά tương đối minh bạch; chú thích bảo lưu cách hiểu thành ngữ tự nhiên hơn mà không giải quyết quá mức sắc thái của giới từ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ân điển,” “xưng công chính” và “sự sống đời đời” giữ các thuật ngữ Kinh Thánh quen thuộc; cấu trúc câu vẫn dễ hiểu đối với độc giả phổ thông. Đại từ “Ngài” tôn kính nhưng không làm rõ hơn nguyên văn về đối tượng được chỉ đến.
