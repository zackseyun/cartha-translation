id: TIT.3.2
reference: Titus 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: vi
  text: không nói xấu ai[a], không gây gổ[b], biết khoan hòa, và bày tỏ lòng nhu mì trọn vẹn[c] với mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không xúc phạm ai.” Động từ này có thể chỉ lời nói lăng mạ hoặc hạ nhục, rộng hơn hành vi vu khống.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “sống hiếu hòa” hoặc “không thích tranh cãi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “bày tỏ trọn vẹn sự dịu dàng với mọi người.” Từ Hy Lạp có thể được dịch là “dịu dàng,” nhưng ở đây dùng “nhu mì” để phân biệt với “khoan hòa” ở ngay trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: ai
  rationale: 'Trong cấu trúc phủ định “không ... ai”, cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ phạm vi tuyệt đối: không một người nào.'
- source_word: βλασφημεῖν
  choice: nói xấu
  rationale: Trong ngữ cảnh đạo đức liên quan đến cách cư xử với người khác, động từ chỉ lời nói xúc phạm hoặc hạ nhục, không phải hành vi phạm thượng đối với Đức Chúa Trời. “Nói xấu” dễ hiểu và đủ rộng hơn thuật ngữ pháp lý “vu khống”.
- source_word: ἀμάχους
  choice: không gây gổ
  rationale: Giữ hình thức phủ định của từ Hy Lạp và diễn đạt tự nhiên thái độ không thích tranh đấu hay cãi cọ.
- source_word: εἶναι
  choice: biết
  rationale: Trong chuỗi lời khuyên bằng tiếng Việt, “biết khoan hòa” truyền đạt tự nhiên phẩm chất cần có; ý nghĩa tồn tại/trở nên của εἶναι vẫn được hàm chứa.
- source_word: ἐπιεικεῖς
  choice: khoan hòa
  rationale: Diễn đạt tính ôn hòa, nhường nhịn và hợp tình hợp lý của ἐπιεικής, đồng thời phân biệt với πραΰτης ở vế sau.
- source_word: πᾶσαν
  choice: trọn vẹn
  rationale: Với danh từ trừu tượng πραΰτης, “trọn vẹn” là cách nói tự nhiên để thể hiện mức độ đầy đủ, toàn diện hơn là dịch máy móc thành “mọi”.
- source_word: ἐνδεικνυμένους
  choice: bày tỏ
  rationale: Diễn tả việc thể hiện phẩm chất ấy ra trong cách cư xử, phù hợp sắc thái của phân từ hiện tại.
- source_word: πραΰτητα
  choice: lòng nhu mì
  rationale: “Nhu mì” giữ sắc thái hiền hòa, tự chế và không áp đặt; thêm “lòng” tạo cách diễn đạt tự nhiên với danh từ trừu tượng trong tiếng Việt.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: với mọi người
  rationale: πρός chỉ sự hướng đến trong quan hệ ứng xử; ἀνθρώπους mang nghĩa chung về loài người, nên “mọi người” vừa chính xác vừa bao quát.
theological_decisions:
- issue: Phạm vi của πάντας ἀνθρώπους
  choice: mọi người
  alternative: mọi người nam
  rationale: ἀνθρώπους ở đây chỉ con người nói chung chứ không giới hạn ở nam giới; “mọi người” bảo toàn phạm vi phổ quát của lời khuyên.
- issue: Phân biệt ἐπιεικεῖς và πραΰτητα
  choice: khoan hòa ... nhu mì
  alternative: nhu mì ... dịu dàng
  rationale: 'Dùng hai từ khác nhau để không xóa nhòa hai phẩm chất gần nghĩa trong nguyên văn: ἐπιεικής nhấn mạnh sự ôn hòa, nhường nhịn; πραΰτης nhấn mạnh sự hiền hòa có tự chế.'
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Câu giữ dạng chuỗi lời khuyên của nguyên văn; “không gây gổ” và “khoan hòa” là cách nói thông dụng, còn “nhu mì” duy trì sắc thái Kinh Thánh mà vẫn quen thuộc trong tiếng Việt.
