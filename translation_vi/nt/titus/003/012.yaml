  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: vi
  text: Khi tôi sai A-tê-ma hoặc Ty-chi-cơ đến với anh, hãy cố gắng hết sức[a] đến gặp tôi ở Ni-cô-pô-li, vì tôi đã quyết định trú đông tại đó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chuyên tâm” hoặc “hãy khẩn trương.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi đã quyết định ở đó qua mùa đông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Khi tôi sai
  rationale: Ὅταν với động từ giả định thì aorist chỉ một sự việc tương lai được dự liệu; “khi” tự nhiên hơn “bất cứ khi nào” vì đây là một lần sai phái cụ thể.
- source_word: Ἀρτεμᾶν ... Τυχικόν
  choice: A-tê-ma ... Ti-chi-cơ
  rationale: Phiên âm hai tên riêng Hy Lạp theo lối dễ đọc và quen thuộc trong tiếng Việt.
- source_word: πρὸς σὲ
  choice: đến với anh
  rationale: Diễn đạt hướng sai phái về phía Tít; “anh” phù hợp với cách xưng hô cá nhân trong thư mà không thêm chức danh không có trong nguyên văn.
- source_word: σπούδασον
  choice: hãy cố gắng hết sức
  rationale: Mệnh lệnh này nhấn mạnh sự chuyên tâm, nỗ lực và tính khẩn thiết, chứ không chỉ đơn thuần là tốc độ.
- source_word: ἐλθεῖν πρός με
  choice: đến gặp tôi
  rationale: Diễn đạt chuyển động hướng về người viết; “gặp” giúp câu tiếng Việt tự nhiên mà vẫn giữ ý đến chỗ Phao-lô.
- source_word: εἰς Νικόπολιν
  choice: tại Ni-cô-pô-li
  rationale: Sau “đến gặp tôi”, “tại” tránh lặp “đến” và nêu rõ địa điểm cuộc gặp, trong khi vẫn giữ Ni-cô-pô-li là đích đến.
- source_word: γὰρ
  choice: vì
  rationale: Nêu lý do cho lời yêu cầu ngay trước đó.
- source_word: κέκρικα
  choice: tôi đã quyết định
  rationale: Thì hoàn thành diễn tả một quyết định đã được đưa ra và vẫn có hiệu lực.
- source_word: παραχειμάσαι
  choice: ở đó qua mùa đông
  rationale: Động từ có nghĩa lưu lại hoặc trú tại một nơi trong suốt mùa đông.
theological_decisions: []
