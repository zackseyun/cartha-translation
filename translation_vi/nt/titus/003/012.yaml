  register: Văn phong thư tín hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ quan hệ thời gian, mệnh lệnh và lý do của nguyên văn; tên riêng được phiên âm để người đọc tiếng Việt dễ phát âm.
