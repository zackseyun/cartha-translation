  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: vi
  text: mà Ngài đã tuôn đổ dồi dào trên chúng ta qua Đức Giê-su, Đấng Mê-si-a, Cứu Chúa của chúng ta,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: Đấng mà
  rationale: Đại từ quan hệ quy chiếu về Đức Thánh Linh ở câu 5. “Đấng mà” tự nhiên trong tiếng Việt, đồng thời thể hiện tiền ngữ là một thân vị.
- source_word: ἐξέχεεν
  choice: đã tuôn đổ
  rationale: Giữ hình ảnh căn bản của ἐκχέω và cách dùng quen thuộc khi nói về việc ban Đức Thánh Linh; thì quá khứ được biểu thị bằng “đã”.
- source_word: ἐφ’ ἡμᾶς
  choice: trên chúng ta
  rationale: ἐπί với đối cách diễn tả hướng đổ xuống trên người nhận; cách nói này vừa sát nghĩa vừa tự nhiên.
- source_word: πλουσίως
  choice: dồi dào
  rationale: Diễn đạt lượng phong phú, dư dật; tự nhiên hơn “một cách phong phú” trong văn cảnh này.
- source_word: διὰ
  choice: qua
  rationale: διά với sở hữu cách chỉ phương tiện hoặc trung gian; “qua” là cách diễn đạt ngắn gọn, tự nhiên.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si
  rationale: Dùng dạng tên hiện đại “Giê-su”; Χριστός được chuyển theo nghĩa tước hiệu là “Đấng Mê-si”, thay vì chỉ phiên chuyển thành “Christ”.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: Cứu Chúa của chúng ta
  rationale: Giữ σωτήρ như một tước hiệu cứu độ và chuyển đại từ sở hữu bằng cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Đối tượng quy chiếu của οὗ
  choice: “Đấng mà”, quy chiếu về Đức Thánh Linh trong câu 5
  alternative: Dùng một đại từ quan hệ ít mang tính ngôi vị hơn, như chỉ dịch “mà”
  rationale: Tiền ngữ gần nhất là Đức Thánh Linh. Cách dịch chính tôn trọng mạch cú pháp và không làm lu mờ tính ngôi vị, nhưng chú thích vẫn ghi nhận khả năng diễn đạt ít xác định hơn của đại từ Hy Lạp.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ / Ki-tô
  rationale: Trong cụm Ἰησοῦ Χριστοῦ, Χριστός vẫn mang nội dung tước hiệu “Đấng được xức dầu”. “Đấng Mê-si” truyền đạt ý nghĩa ấy trực tiếp, còn dạng truyền thống được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nguyên cấu trúc phụ thuộc của câu Hy Lạp bằng mở đầu “Đấng mà”, vì câu 6 nối trực tiếp với câu 5. Dùng “dồi dào” thay cho một trạng ngữ nặng nề hơn; dấu phẩy giữ sự liên kết với phần câu tiếp theo.
