source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: vi
  text: Tất cả những người ở với tôi gửi lời chào đến anh. Hãy gửi lời chào đến những người yêu mến chúng ta trong đức tin.[a] Nguyện ân điển ở cùng tất cả anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “trong sự thành tín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: gửi lời chào
  rationale: Đây là nghĩa thông dụng trong lời kết thư; cách diễn đạt tự nhiên trong tiếng Việt và giữ sắc thái gửi lời thăm hỏi từ xa.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Tất cả những người đang ở với tôi
  rationale: Giữ rõ πάντες là “tất cả” và μετά + sở hữu cách là những người hiện ở cùng Phao-lô.
- source_word: ἄσπασαι
  choice: Hãy gửi lời chào đến
  rationale: Thể mệnh lệnh của ἀσπάζομαι trong phần kết thư; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: φιλοῦντας
  choice: yêu mến
  rationale: Diễn đạt tình cảm gắn bó cá nhân của φιλέω bằng một từ trang trọng, tự nhiên, không làm yếu nghĩa thành chỉ “có thiện cảm”.
- source_word: ἐν πίστει
  choice: trong đức tin
  rationale: Giữ nghĩa thông thường của πίστις là “đức tin” và không thêm mạo từ xác định vốn không có trong tiếng Hy Lạp; cụm từ có thể chỉ phạm vi hoặc nền tảng chung của tình yêu mến.
- source_word: ἡ χάρις
  choice: Ân điển
  rationale: Thuật ngữ quen thuộc cho χάρις trong lời chúc phước của Phao-lô, chỉ ân huệ nhưng không của Đức Chúa Trời.
- source_word: μετὰ πάντων ὑμῶν
  choice: ở cùng tất cả anh chị em
  rationale: Bổ sung động từ “ở” được tỉnh lược trong tiếng Hy Lạp để câu chúc tự nhiên; “tất cả anh chị em” vừa giữ πάντων vừa thể hiện số nhiều của ὑμῶν.
theological_decisions:
- issue: Cách hiểu πίστις trong ἐν πίστει
  choice: đức tin
  alternative: sự thành tín; hoặc đức tin chung
  rationale: Trong lời chào kết thư, “trong đức tin” tự nhiên nhất khi chỉ phạm vi hoặc nền tảng đức tin chung của tình yêu mến. Tuy nhiên, πίστις cũng có thể mang nghĩa “sự thành tín”, và cụm từ có thể được hiểu theo nghĩa xác định là “trong đức tin chung”, nên ghi nhận các khả năng này trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” ở câu đầu vì σέ là số ít, chỉ Tít; dùng “anh chị em” ở lời chúc cuối vì ὑμῶν là số nhiều và bao gồm cả cộng đồng. Dùng “gửi lời chào” thay vì “chào” để phù hợp ngữ cảnh thư tín.
