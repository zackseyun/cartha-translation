revisions:
- from: Tất cả những người đang ở với tôi gửi lời chào anh. Hãy gửi lời chào đến những người yêu mến chúng ta trong đức tin.[a] Ân điển ở cùng tất cả anh chị em.
  to: Tất cả những người ở với tôi gửi lời chào đến anh. Hãy gửi lời chào đến những người yêu mến chúng ta trong đức tin.[a] Nguyện ân điển ở cùng tất cả anh chị em.
  rationale: Loại bỏ «đang» để không thêm sắc thái thời gian vào μετ’ ἐμοῦ. Điều chỉnh chú thích để chỉ giữ phương án ngữ nghĩa có cơ sở trực tiếp từ πίστει, tránh thêm ý «chung». Các đại từ vẫn phản ánh đúng số ít σέ («anh») và số nhiều ὑμῶν («anh chị em»); «Nguyện» làm rõ tính chúc nguyện vốn được hàm ý trong công thức ἡ χάρις μετὰ πάντων ὑμῶν.
