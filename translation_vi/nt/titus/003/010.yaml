revisions:
- from: Sau khi cảnh cáo lần thứ nhất và lần thứ hai, hãy đoạn tuyệt với người gây bè phái.[a]
  to: Sau khi đã khuyên bảo một lần rồi lần thứ hai, hãy tránh người gây bè phái.[a]
  rationale: Bản sửa dùng “khuyên bảo” để giữ nghĩa sửa dạy của νουθεσία và “tránh” để không làm mạnh quá mức παραιτοῦ. “Người gây bè phái” được giữ làm bản văn chính vì phản ánh tốt nhất nghĩa có khả năng của αἱρετικός trong bối cảnh này; chú thích bảo lưu cách dịch truyền thống mà không áp đặt nghĩa thần học hậu kỳ.
