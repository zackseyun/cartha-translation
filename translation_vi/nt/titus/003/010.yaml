  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: vi
  text: Sau khi đã khuyên bảo một lần rồi lần thứ hai, hãy tránh người gây bè phái.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người gây chia rẽ”; theo cách dịch truyền thống: “người tà giáo.” Từ Hy Lạp có lẽ chỉ người tạo phe nhóm và chia rẽ cộng đồng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: gây bè phái
  rationale: Trong văn cảnh Hy Lạp Koine, từ này nhiều khả năng chỉ người tạo phe nhóm và chia rẽ cộng đồng, chứ không chủ yếu mang nghĩa kỹ thuật về tà giáo hình thành về sau.
- source_word: ἄνθρωπον
  choice: người
  rationale: Danh từ chỉ một cá nhân; “người” là cách diễn đạt tự nhiên trong tiếng Việt và không thêm nét nghĩa không cần thiết.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: sau khi cảnh cáo lần thứ nhất và lần thứ hai
  rationale: Cụm từ diễn tả trình tự xử lý sau hai lần khuyên răn mang tính sửa dạy; “cảnh cáo” giữ được sức nặng của νουθεσία và rõ ràng trong tiếng Việt hiện đại.
- source_word: παραιτοῦ
  choice: hãy đoạn tuyệt với
  rationale: Mệnh lệnh này đòi hỏi từ chối tiếp tục liên hệ hoặc tiếp nhận người ấy; “đoạn tuyệt với” thể hiện hành động dứt khoát hơn “tránh” mà không diễn giải quá dài.
theological_decisions:
- issue: Nên hiểu αἱρετικὸν theo nghĩa gây phe phái trong thế kỷ thứ nhất hay theo thuật ngữ giáo hội về tà giáo về sau
  choice: người gây bè phái
  alternative: người theo tà giáo; người gây chia rẽ
  rationale: Lựa chọn này giữ trọng tâm có khả năng nhất là hành vi tạo phe nhóm, đồng thời tránh đưa nghĩa kỹ thuật về dị giáo của thời kỳ sau vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo cụm chỉ trình tự lên đầu để câu tiếng Việt tự nhiên, đồng thời giữ rõ rằng chỉ sau hai lần cảnh cáo mới thực hiện hành động dứt khoát.
