  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: vi
  text: Lời này là đáng tin cậy. Tôi muốn anh khẳng định dứt khoát những điều ấy, để những người đã tin Đức Chúa Trời[b] chuyên tâm làm các việc lành.[a] Những điều ấy thật tốt đẹp và ích lợi cho mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm này cũng có thể dịch: “dấn thân làm các việc lành,” “đảm nhận các việc lành,” hoặc “đứng đầu trong các việc lành.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “đã tin vào Đức Chúa Trời” hoặc “đã đặt lòng tin nơi Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Lời này là đáng tin cậy
  rationale: λόγος ở đây chỉ lời tuyên bố hoặc sứ điệp vừa nêu, còn πιστός diễn tả tính đáng tin; cách dịch này giữ được công thức thư tín và vẫn tự nhiên trong tiếng Việt.
- source_word: περὶ τούτων
  choice: những điều ấy
  rationale: Đại từ số nhiều hướng về các nội dung vừa được trình bày; trong câu tiếng Việt, quan hệ 'về những điều ấy' được chuyển tự nhiên vào cụm 'nhấn mạnh những điều ấy'.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: Tôi muốn anh quả quyết nhấn mạnh
  rationale: βούλομαι diễn tả ý muốn, còn διαβεβαιόομαι mang sắc thái khẳng định chắc chắn và mạnh mẽ. 'Quả quyết nhấn mạnh' truyền đạt cả sự xác quyết lẫn cường độ mà không hàm ý tranh cãi.
- source_word: ἵνα φροντίζωσιν
  choice: để ... chú tâm
  rationale: φροντίζω diễn tả việc quan tâm, suy xét cẩn thận hoặc chuyên chú; 'chú tâm' gọn, tự nhiên và kết nối tốt với hành động theo sau.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: dấn thân làm các việc lành
  rationale: Trong văn cảnh này, προΐστασθαι có thể chỉ chuyên tâm, đảm nhận hoặc dấn thân thực hành, chứ không nhất thiết là lãnh đạo. Cách dịch diễn tả sự cam kết tích cực và bền bỉ.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: những người đã tin Đức Chúa Trời
  rationale: Phân từ hoàn thành diễn tả những người đã tin và đang ở trong tình trạng ấy. Dữ cách θεῷ được giữ theo nghĩa trực tiếp là tin lời Đức Chúa Trời, thay vì tự động chuyển thành 'tin vào'.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα
  choice: Những điều ấy thật tốt đẹp và ích lợi
  rationale: ταῦτα là số nhiều dù động từ Hy Lạp ở số ít theo quy tắc giống trung; tiếng Việt dùng 'những điều ấy'. καλά và ὠφέλιμα lần lượt giữ khía cạnh tốt đẹp và đem lại ích lợi.
- source_word: τοῖς ἀνθρώποις
  choice: cho mọi người
  rationale: ἀνθρώποις chỉ con người nói chung, không riêng nam giới. 'Mọi người' thể hiện phạm vi khái quát tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa đức tin và việc lành
  choice: 'Giữ trình tự: những người đã tin Đức Chúa Trời được thúc giục dấn thân làm các việc lành.'
  alternative: Diễn đạt việc lành như căn cứ để được cứu hoặc chỉ như lời khuyên đạo đức chung.
  rationale: Cú pháp trình bày việc lành như kết quả được mong đợi nơi những người đã tin, không nói đó là căn cứ của sự cứu rỗi; bản dịch không thêm một hệ phái thần học nào.
- issue: Tân ngữ của πιστεύω với dữ cách θεῷ
  choice: đã tin Đức Chúa Trời
  alternative: đã tin vào Đức Chúa Trời; đã đặt lòng tin nơi Đức Chúa Trời
  rationale: Cách dịch chính giữ trực tiếp cấu trúc Hy Lạp và có thể nhấn mạnh việc tin điều Đức Chúa Trời phán. Không nên âm thầm đồng nhất nó với cách nói về sự hiện hữu của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” vì Phao-lô đang trực tiếp nói với Tít. “Đức Chúa Trời” theo lối gọi phổ biến trong tiếng Việt Cơ Đốc; không thêm thuật ngữ hệ phái. Dấu chú thích [a] được đặt ngay sau cụm có phương án dịch khác.
