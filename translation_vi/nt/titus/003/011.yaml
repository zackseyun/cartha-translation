  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: vi
  text: vì biết rằng một người như thế đã lầm lạc và đang phạm tội, tự chuốc lấy sự kết án.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị chính mình kết án” hoặc “tự kết án chính mình.” Từ Hy Lạp có thể hàm ý người ấy bị chính hành vi hoặc lời chứng của mình kết án.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: vì biết rằng
  rationale: Phân từ hoàn thành mang sắc thái hoàn cảnh và nối với mệnh lệnh ở câu trước; trong tiếng Việt, “vì biết rằng” diễn đạt tự nhiên quan hệ lý do, với chủ thể ngầm là người thi hành lời chỉ dẫn.
- source_word: ἐξέστραπται
  choice: đã lầm lạc
  rationale: Động từ hoàn thành cho thấy tình trạng hiện tại phát sinh từ việc đi chệch hướng trước đó. “Đã lầm lạc” giữ được cả ý đi lệch và kết quả còn tồn tại, mà không mang những liên tưởng chuyên biệt có thể có ở “sa đọa” hay “biến chất”.
- source_word: ὁ τοιοῦτος
  choice: một người như thế
  rationale: Cụm từ chỉ cá nhân thuộc loại vừa được nói đến. Dù hình thức Hy Lạp là giống đực số ít, trong văn cảnh này “một người như thế” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt, không khẳng định giới tính sinh học ngoài điều văn bản đòi hỏi.
- source_word: ἁμαρτάνει
  choice: đang phạm tội
  rationale: Thì hiện tại biểu thị hành động đang diễn ra; “đang phạm tội” truyền đạt trực tiếp sắc thái tiếp diễn mà không thêm ý nghĩa quá mức.
- source_word: ὢν
  choice: tự kết án chính mình
  rationale: Không dịch phân từ bằng một từ riêng biệt để tránh câu tiếng Việt nặng nề; quan hệ đồng thời hoặc mô tả được thể hiện tự nhiên bằng cụm vị ngữ cuối câu.
- source_word: αὐτοκατάκριτος
  choice: tự kết án chính mình
  rationale: Tính từ có thể chỉ người bị chính hành vi hoặc lời chứng của mình kết án. Cách dịch này giữ lực phản thân nhưng không áp đặt ý về một bản án chung thẩm chính thức.
theological_decisions:
- issue: Giới tính trong ὁ τοιοῦτος
  choice: một người như thế
  alternative: một người đàn ông như thế
  rationale: Giống đực ngữ pháp quy chiếu về kẻ gây chia rẽ ở câu trước, nhưng không nhất thiết nhấn mạnh giới tính. “Một người như thế” vừa tự nhiên trong tiếng Việt vừa bảo toàn tính quy chiếu cá thể.
- issue: Sắc thái của αὐτοκατάκριτος
  choice: tự kết án chính mình
  alternative: bị chính mình kết án
  rationale: Bản văn gắn sự kết án với chính tình trạng và hành vi của người ấy, nhưng không xác định rõ cơ chế là tự phán xét hay bị hành vi của mình làm chứng chống lại. Bản dịch chính giữ sự cô đọng; chú thích nêu khả năng còn lại.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, đồng thời giữ chuỗi ý: biết rõ tình trạng lầm lạc, hành vi phạm tội đang tiếp diễn và sự tự kết án.'
