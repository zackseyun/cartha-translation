  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: vi
  text: Hãy nhắc họ phải phục tùng các nhà cầm quyền và các nhà chức trách, phải vâng lời, sẵn sàng làm mọi việc lành.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Hãy nhắc
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số ít, truyền cho Tít tiếp tục nhắc nhở; tiếng Việt tự nhiên có thể dùng “Hãy nhắc” mà không cần diễn đạt tường minh sắc thái lặp lại.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ số nhiều chỉ các tín hữu tại Cơ-rết mà Tít đang hướng dẫn.
- source_word: ἀρχαῖς
  choice: các nhà cầm quyền
  rationale: Trong văn cảnh công dân, từ này chỉ những người nắm quyền cai trị, không phải các thế lực siêu nhiên.
- source_word: ἐξουσίαις
  choice: những người có thẩm quyền
  rationale: Đi cùng ἀρχαῖς, từ này chỉ các thẩm quyền cai trị; cách dịch giữ lại hai thành tố của cụm Hy Lạp.
- source_word: ὑποτάσσεσθαι
  choice: phải phục tùng
  rationale: Diễn tả việc đặt mình dưới trật tự thẩm quyền; “phục tùng” trang trọng, tự nhiên và không tự nó hàm ý vâng phục vô điều kiện.
- source_word: πειθαρχεῖν
  choice: phải vâng lời
  rationale: Động từ chỉ sự tuân theo người có thẩm quyền; “vâng lời” phân biệt rõ với sắc thái phục tùng của động từ trước.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: làm mọi việc lành
  rationale: πρός với đối cách nêu điều mà họ phải sẵn sàng hướng đến; “mọi việc lành” giữ sắc thái đạo đức của cụm từ.
- source_word: ἑτοίμους εἶναι
  choice: sẵn sàng
  rationale: Diễn tả trạng thái sẵn có để hành động; cách nói ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi phục tùng các cơ cấu dân sự
  choice: Dịch như một lời khuyên tổng quát về việc phục tùng và vâng lời nhà chức trách, nhưng không thêm ý rằng sự vâng lời ấy là tuyệt đối trong mọi hoàn cảnh.
  alternative: Diễn đạt mạnh hơn theo hướng phải vâng phục chính quyền vô điều kiện.
  rationale: Hai từ ἀρχαῖς và ἐξουσίαις trong văn cảnh chỉ giới cầm quyền dân sự. Bản dịch giữ nguyên lời khuyên nhưng không giải quyết thay văn bản những giới hạn mà câu này không nêu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Nhà cầm quyền” và “người có thẩm quyền” duy trì cặp từ của nguyên bản; “việc lành” phù hợp văn phong Kinh Thánh phổ thông mà vẫn tự nhiên.
