id: TIT.3.3
reference: Titus 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: vi
  text: Vì trước kia chính chúng ta cũng từng ngu dại, không vâng phục, bị dẫn đi lạc,[a] làm nô lệ cho đủ thứ ham muốn và khoái lạc, sống trong ác ý và ganh ghét, đáng ghét,[b] và thù ghét lẫn nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị lừa dối.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bị ghét.” Tính từ Hy Lạp có thể mang nghĩa chủ động (“đáng ghét”) hoặc bị động (“bị ghét”).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: Vì chính chúng ta trước kia cũng từng
  rationale: “Vì” giữ liên kết giải thích của γάρ với câu trước; “chính chúng ta… cũng” bảo toàn sắc thái bao gồm và nhấn mạnh của καὶ ἡμεῖς; “trước kia… từng” diễn đạt ποτε tự nhiên trong tiếng Việt.
- source_word: ἀνόητοι
  choice: ngu dại
  rationale: Diễn đạt sự thiếu hiểu biết và phán đoán đúng đắn trong bối cảnh đạo đức, bằng ngôn ngữ phổ thông nhưng trang trọng.
- source_word: ἀπειθεῖς
  choice: không vâng phục
  rationale: Giữ ý không chịu nghe theo và vì thế bất phục, không thu hẹp từ này thành một thái độ nổi loạn cụ thể.
- source_word: πλανώμενοι
  choice: bị dẫn lạc đường
  rationale: Giữ sắc thái bị động hoặc trung động và hình ảnh đi sai đường, rộng hơn nghĩa thuần túy trí thức là “bị lừa dối”.
- source_word: δουλεύοντες
  choice: làm nô lệ
  rationale: Bảo toàn sức nặng của ngôn ngữ nô lệ, trình bày con người như bị các ham muốn và khoái lạc chế ngự, thay vì chỉ đơn giản phục vụ chúng.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: cho đủ thứ ham muốn và khoái lạc
  rationale: “Ham muốn” đủ rộng, không giới hạn vào dục vọng tình dục; “đủ thứ” diễn đạt ποικίλαις tự nhiên và về nghĩa áp dụng cho cả hai danh từ.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: sống trong ác ý và ganh ghét
  rationale: “Sống trong” thể hiện tình trạng kéo dài của διάγοντες; “ác ý” phù hợp với bối cảnh các thói xấu giữa người với người, còn “ganh ghét” diễn đạt φθόνος bằng tiếng Việt thông dụng.
- source_word: στυγητοί
  choice: đáng ghét
  rationale: Chọn nghĩa chủ động là gây ghê tởm hoặc đáng ghét, phù hợp với danh sách phẩm chất xấu; nghĩa bị động “bị người ta ghét” vẫn được ghi ở chú thích.
- source_word: μισοῦντες ἀλλήλους
  choice: thù ghét lẫn nhau
  rationale: Diễn đạt trực tiếp hành động μισοῦντες và tính tương hỗ của ἀλλήλους; “thù ghét” phù hợp với mức độ mạnh của động từ.
theological_decisions:
- issue: Sắc thái lệ thuộc của δουλεύοντες khi các chủ thể cai trị là “ham muốn và khoái lạc”
  choice: làm nô lệ cho đủ thứ ham muốn và khoái lạc
  alternative: phục vụ đủ thứ ham muốn và khoái lạc
  rationale: Câu mô tả tình trạng bị các dục vọng chế ngự. “Làm nô lệ” giữ nguyên hình ảnh mạnh của bản văn mà không gắn thêm một hệ thống giáo lý ngoài câu.
- issue: Cách hiểu στυγητοί
  choice: đáng ghét
  alternative: bị người ta ghét
  rationale: Tính từ Hy Lạp có thể được hiểu theo nghĩa chủ động hoặc bị động. Bản chính chọn nghĩa “đáng ghét” vì ăn khớp với danh sách các đặc tính đạo đức, nhưng chú thích bảo lưu khả năng “bị ghét”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Nhịp liệt kê được giữ rõ; các từ “làm nô lệ,” “ác ý,” “ganh ghét” và “thù ghét” bảo toàn sức nặng đạo đức của nguyên văn mà không cổ hóa câu văn.
