  to: Vì trước kia chính chúng ta cũng từng ngu dại, không vâng phục, bị dẫn đi lạc,[a] làm nô lệ cho đủ thứ ham muốn và khoái lạc, sống trong ác ý và ganh ghét, đáng ghét,[b] và thù ghét lẫn nhau.
  rationale: Chỉnh “bị dẫn lạc đường” thành “bị dẫn đi lạc” để tiếng Việt tự nhiên hơn mà không thay đổi sắc thái ngữ pháp hay ý nghĩa. Chỉnh chú thích b để không thêm một tác nhân không có trong nguyên ngữ. Các phần còn lại giữ nguyên vì sát bản Hy Lạp và phù hợp với lối văn tiếng Việt tiêu chuẩn hiện đại.
