id: TIT.3.9
reference: Titus 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: vi
  text: Nhưng hãy tránh những cuộc tranh luận dại dột[a], những chuyện gia phả, những sự tranh chấp và những cuộc cãi vã về luật pháp[b], vì những điều ấy không ích lợi gì và vô bổ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những cuộc tranh chấp dại dột” hoặc “những suy đoán dại dột.”
    reason: lexical_alternative
  - marker: b
    text: Sát nghĩa là “những cuộc cãi vã liên quan đến luật pháp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: những cuộc tranh luận dại dột
  rationale: ζητήσεις trong ngữ cảnh các Thư Mục vụ chỉ những vấn đề được đem ra bàn cãi gây tranh chấp, không đơn thuần là câu hỏi; “tranh luận” tự nhiên trong tiếng Việt, còn “dại dột” giữ sắc thái đạo đức-thực tiễn của μωράς.
- source_word: γενεαλογίας
  choice: những chuyện gia phả
  rationale: Giữ nghĩa rộng của danh từ số nhiều mà không áp đặt một cách tái dựng lịch sử cụ thể; “chuyện gia phả” tự nhiên hơn “các gia phả” khi chỉ việc bàn luận về gia phả.
- source_word: ἔρεις
  choice: những sự tranh chấp
  rationale: ἔρις nói đến sự bất hòa, tranh chấp; cách dịch này phân biệt tương đối với μάχας kế tiếp nhưng vẫn giữ sự chồng lấn ý nghĩa trong nguyên văn.
- source_word: μάχας νομικὰς
  choice: những cuộc cãi vã về luật pháp
  rationale: μάχας ở đây chỉ xung đột bằng lời chứ không phải chiến đấu thể chất; νομικάς mô tả các cuộc cãi vã liên quan đến luật pháp, không phải kiện tụng pháp lý.
- source_word: περιΐστασο
  choice: hãy tránh
  rationale: Động từ mệnh lệnh trung cách yêu cầu chủ thể giữ mình tránh xa các điều ấy; “hãy tránh” ngắn gọn và tự nhiên.
- source_word: ἀνωφελεῖς
  choice: không ích lợi gì
  rationale: Diễn đạt rõ nghĩa không đem lại lợi ích của ἀνωφελεῖς bằng tiếng Việt hiện đại.
- source_word: μάταιοι
  choice: vô bổ
  rationale: “Vô bổ” truyền đạt tính rỗng không, vô ích và không đem lại kết quả của μάταιοι, đồng thời phối hợp tự nhiên với “không ích lợi gì”.
theological_decisions:
- issue: Bản chất của “những chuyện gia phả” và “những cuộc cãi vã về luật pháp”
  choice: Dịch các cụm từ theo nghĩa khái quát, không xác định chúng thuộc một hệ thống Do Thái, Ngộ đạo hay lạc giáo cụ thể.
  alternative: Hiểu “gia phả” là những tranh luận riêng về huyết thống Do Thái, hoặc hiểu cả cụm theo những suy đoán mang tính Ngộ đạo sơ khai.
  rationale: Chính câu này không cung cấp đủ chi tiết để xác định một bối cảnh lịch sử riêng biệt; giữ cách nói rộng bảo toàn sự mơ hồ thật sự của nguyên văn và tránh đưa một lối giải thích vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “luật pháp” để giữ khả năng chỉ Luật Môi-se trong ngữ cảnh mà không diễn giải quá mức; tránh “tranh tụng pháp lý,” vốn dễ gợi đến kiện tụng tại tòa.
