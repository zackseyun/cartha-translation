  source_fidelity: Bản dịch truyền đạt đúng thế đối lập giữa việc làm của con người và lòng thương xót của Đức Chúa Trời, giữ được trọng âm của ἡμεῖς qua “chính chúng ta,” và không áp đặt cách hiểu về báp-têm. Tuy nhiên, “những việc làm trong sự công chính” là cấu trúc quá sát tiếng Hy Lạp và dễ được hiểu là các việc làm khi người ta ở trong một tình trạng công chính, thay vì các việc làm có đặc tính công chính. “Những việc làm công chính” truyền đạt tự nhiên hơn chức năng bổ nghĩa của ἐν δικαιοσύνῃ.
  naturalness: Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên hơn. Cụm “sự tẩy rửa của sự tái sinh” giữ được thuật ngữ nhưng hơi trùng lặp danh từ trừu tượng; không bắt buộc phải thay đổi vì vẫn rõ nghĩa và phản ánh cấu trúc nguồn. Việc chuyển cụm “trong sự công chính” thành “công chính” là chỉnh sửa cần thiết nhất.
  terminology: Giữ “lòng thương xót,” “cứu,” “tái sinh,” “đổi mới,” và “Đức Thánh Linh” là phù hợp văn phong Cơ Đốc giáo tiếng Việt. “Công chính” là lựa chọn chính văn thích hợp cho δικαιοσύνη; chú thích tiếp tục bảo lưu “công lý.”
