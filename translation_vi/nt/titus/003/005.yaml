reference: Titus 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: vi
  text: Không phải bởi những việc làm công chính[a] mà chính chúng ta đã làm, nhưng theo lòng thương xót của Ngài, Ngài đã cứu chúng ta qua sự tẩy rửa[b] của sự tái sinh và sự đổi mới bởi Đức Thánh Linh[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “công lý.” Từ Hy Lạp có thể mang nghĩa “công chính” hoặc “công lý”; trong cách dùng của Phao-lô, chính văn giữ “công chính.”'
    reason: alternative_reading
  - marker: b
    text: “Sự tẩy rửa” có thể chỉ phép báp-têm, hình ảnh thanh tẩy, hoặc cả hai; bản thân từ Hy Lạp không buộc bản dịch phải chọn rõ một cách hiểu trong chính văn.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sự đổi mới của Đức Thánh Linh.” Cấu trúc Hy Lạp cho phép hiểu quan hệ giữa “Đức Thánh Linh” và “sự đổi mới” theo những cách hơi khác nhau.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: không phải bởi những việc làm
  rationale: ἐκ với sở hữu cách chỉ nguồn gốc hoặc cơ sở; “bởi” diễn đạt tự nhiên sự phủ định cơ sở của sự cứu rỗi và giữ thế tương phản với lòng thương xót.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: trong sự công chính
  rationale: Cụm giới từ bổ nghĩa cho “những việc làm”; “sự công chính” giữ thuật ngữ quen thuộc của Phao-lô, đồng thời chú thích bảo lưu nghĩa “công lý” có thể có.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: mà chính chúng ta đã làm
  rationale: Đại từ ἡμεῖς được nêu rõ để nhấn mạnh; “chính chúng ta” bảo lưu trọng âm ấy.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: theo lòng thương xót của Ngài
  rationale: κατά diễn tả chuẩn mực hoặc cơ sở phù hợp; cách dịch sát và rõ, không thu hẹp thành quan hệ nhân quả đơn thuần.
- source_word: ἔσωσεν ἡμᾶς
  choice: Ngài đã cứu chúng ta
  rationale: “Cứu” là cách dịch tự nhiên và chuẩn xác của σῴζω trong ngữ cảnh cứu rỗi.
- source_word: διὰ λουτροῦ
  choice: qua sự tẩy rửa
  rationale: διά với sở hữu cách chỉ phương tiện; “sự tẩy rửa” giữ hình ảnh làm sạch nhưng không tự ý quyết định đó là phép báp-têm, ẩn dụ, hay cả hai.
- source_word: παλιγγενεσίας
  choice: của sự tái sinh
  rationale: “Tái sinh” truyền đạt ý nghĩa sinh lại/được sinh mới của παλιγγενεσία và giữ sắc thái thần học.
- source_word: καὶ ἀνακαινώσεως
  choice: và sự đổi mới
  rationale: Danh từ “sự đổi mới” tương ứng với cấu trúc danh từ song song trong tiếng Hy Lạp.
- source_word: πνεύματος ἁγίου
  choice: bởi Đức Thánh Linh
  rationale: Diễn đạt Đức Thánh Linh là tác nhân hoặc nguồn của sự đổi mới, trong khi chú thích bảo lưu khả năng dịch theo quan hệ sở hữu.
theological_decisions:
- issue: Nghĩa của δικαιοσύνη trong ngữ cảnh Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” phù hợp hơn với cách dùng trong văn mạch này, nhưng δικαιοσύνη cũng có thể mang nghĩa “công lý”, nên phương án ấy được ghi chú.
- issue: Ý nghĩa của διὰ λουτροῦ παλιγγενεσίας
  choice: qua sự tẩy rửa của sự tái sinh
  alternative: qua sự tẩy rửa của phép báp-têm / qua sự thanh tẩy đem lại sự tái sinh
  rationale: Bản văn có thể gợi đến phép báp-têm, hình ảnh thanh tẩy, hoặc cả hai. Bản dịch không chèn một cách giải thích giáo phái vào chính văn.
- issue: Quan hệ của πνεύματος ἁγίου với ἀνακαινώσεως
  choice: sự đổi mới bởi Đức Thánh Linh
  alternative: sự đổi mới của Đức Thánh Linh
  rationale: Sở hữu cách Hy Lạp có thể diễn tả tác nhân/nguồn hoặc quan hệ sở hữu rộng hơn. Chính văn dùng cách hiểu tác nhân tự nhiên nhất trong tiếng Việt và ghi phương án khác ở chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp câu và thế tương phản của nguyên văn; dùng “Ngài” cho đại từ chỉ Đức Chúa Trời trong văn mạch. Không giải quyết dứt khoát hàm ý báp-têm của λουτρόν hay quan hệ sở hữu cách của πνεύματος ἁγίου.
