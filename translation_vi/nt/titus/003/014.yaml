id: TIT.3.14
reference: Titus 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: vi
  text: Những người thuộc về chúng ta cũng cần học cách chuyên tâm làm những việc tốt để đáp ứng các nhu cầu thiết yếu, hầu cho họ không phải là những người không kết quả.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: phải học
  rationale: Mệnh lệnh cách hiện tại, ngôi thứ ba số nhiều, mang sức thúc giục thực sự; “phải học” là cách diễn đạt tự nhiên trong tiếng Việt mà không biến câu thành một mệnh lệnh gay gắt quá mức.
- source_word: δὲ καὶ
  choice: Còn ... cũng
  rationale: Giữ sắc thái chuyển ý của δέ và ý bổ sung của καί bằng cấu trúc tiếng Việt tự nhiên.
- source_word: οἱ ἡμέτεροι
  choice: người của chúng ta
  rationale: Cụm này theo nghĩa đen là “những người thuộc về chúng ta”, chỉ cộng đồng gắn với Phao-lô và Tít; cách dịch không giới hạn đối tượng vào nam giới.
- source_word: καλῶν ἔργων
  choice: những việc tốt
  rationale: Diễn đạt rõ ràng, hiện đại cho các hành động tốt lành và hữu ích, đồng thời phù hợp với chủ đề lặp lại trong thư Tít.
- source_word: προΐστασθαι
  choice: chuyên tâm làm
  rationale: Động từ có thể mang nghĩa đứng đầu, chăm lo hoặc dấn thân thực hiện. Trong kết hợp với “những việc tốt”, “chuyên tâm làm” giữ được ý tham gia tích cực, có chủ tâm mà không áp đặt nghĩa lãnh đạo.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: để đáp ứng các nhu cầu thiết yếu
  rationale: εἰς biểu thị mục đích hoặc hướng đến; χρείας là các nhu cầu, còn ἀναγκαίας xác định đó là những nhu cầu cần thiết hay thiết yếu. “Đáp ứng” làm rõ quan hệ mục đích vốn tự nhiên trong tiếng Việt.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: hầu cho họ không trở nên không sinh quả
  rationale: Giữ mệnh đề mục đích của ἵνα và bảo tồn hình ảnh “không sinh quả” của ἄκαρποι thay vì diễn giải thành “vô ích” hay “không hiệu quả”.
theological_decisions:
- issue: Phạm vi của οἱ ἡμέτεροι
  choice: người của chúng ta, tức những người thuộc cộng đồng Cơ Đốc gắn với Phao-lô và Tít
  alternative: người nhà chúng ta; những người phe ta; người của chúng ta đối lập với người ngoài
  rationale: Cụm từ có tính quan hệ và cộng đồng, nhưng câu không xác định ranh giới đối lập một cách chi tiết. Bản dịch giữ cách gọi rộng và không thêm sự phân biệt giới tính.
- issue: Sắc thái của προΐστασθαι
  choice: chuyên tâm làm những việc tốt
  alternative: đứng đầu trong những việc tốt; chăm lo việc tốt; thực hành việc tốt
  rationale: Ngữ cảnh nhấn mạnh sự dấn thân vào việc tốt nhằm đáp ứng nhu cầu, chứ không minh nhiên nói đến một chức vụ lãnh đạo. Lựa chọn này vẫn giữ ý chủ động và bền bỉ.
- issue: Ẩn dụ ἄκαρποι
  choice: không sinh quả
  alternative: không hiệu quả; vô ích; cằn cỗi
  rationale: Giữ nguyên ẩn dụ đạo đức và thuộc linh của nguyên văn mà không quyết định cụ thể “quả” là thành quả xã hội, đạo đức hay thuộc linh.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Còn ... cũng” để nối mạch khuyên dạy; tránh từ ngữ giáo phái. Không thêm chú thích vì các nét nghĩa chính có thể được giữ trực tiếp trong câu mà không làm bản văn nặng nề.
