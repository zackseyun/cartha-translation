review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng mạch chính của câu: lời thúc giục cộng đồng học cách dấn thân vào việc tốt nhằm đáp ứng những nhu cầu thiết yếu. Tuy nhiên, “trở nên không sinh quả” thêm sắc thái biến đổi vốn không có trong ὦσιν (“họ là/ở trong tình trạng”), và cụm này cũng không tự nhiên.'
  naturalness: “Còn người của chúng ta cũng phải học chuyên tâm làm...” hơi gượng trong tiếng Việt hiện đại. “Những người thuộc về chúng ta cũng cần học cách chuyên tâm làm...” rõ chủ thể số nhiều và tự nhiên hơn. “Không trở nên không sinh quả” là lỗi diễn đạt do phủ định chồng lên nhau; “không phải là những người không kết quả” tự nhiên và giữ được tính ẩn dụ/tính từ của ἄκαρποι.
  terminology: “Việc tốt,” “nhu cầu thiết yếu,” và “chuyên tâm làm” đều phù hợp ngữ cảnh. “Những người thuộc về chúng ta” diễn đạt οἱ ἡμέτεροι rõ hơn “người của chúng ta,” không áp đặt giới tính hay ranh giới giáo phái cụ thể.
  issues:
  - severity: medium
    issue: “họ không trở nên không sinh quả”
    rationale: Cụm này không tự nhiên trong tiếng Việt, chứa phủ định chồng (“không trở nên không...”), và “trở nên” không được biểu thị trong mệnh đề ἵνα μὴ ὦσιν ἄκαρποι. Cần dùng một cấu trúc vị ngữ tự nhiên hơn mà vẫn tránh diễn giải ẩn dụ thành “vô ích”.
  - severity: low
    issue: “người của chúng ta”
    rationale: Dù có thể hiểu là số nhiều theo ngữ cảnh, cách nói này kém rõ và kém tự nhiên hơn “những người thuộc về chúng ta” cho οἱ ἡμέτεροι.
  revised_text: Những người thuộc về chúng ta cũng cần học cách chuyên tâm làm những việc tốt để đáp ứng các nhu cầu thiết yếu, hầu cho họ không phải là những người không kết quả.
