revisions:
- from: Còn người của chúng ta cũng phải học chuyên tâm làm những việc tốt để đáp ứng các nhu cầu thiết yếu, hầu cho họ không trở nên không sinh quả.
  to: Những người thuộc về chúng ta cũng cần học cách chuyên tâm làm những việc tốt để đáp ứng các nhu cầu thiết yếu, hầu cho họ không phải là những người không kết quả.
  rationale: Chỉnh sửa nhằm làm câu tiếng Việt tự nhiên hơn, xác định rõ chủ thể số nhiều của οἱ ἡμέτεροι, và thay cấu trúc phủ định không tự nhiên bằng cách diễn đạt sát với ἵνα μὴ ὦσιν ἄκαρποι. “Không kết quả” giữ tính khái quát của hình ảnh “không có quả,” không áp đặt quả ấy là đạo đức, thuộc linh, hay hiệu quả thực dụng.
  reviewer_model: gpt-5.6-terra
