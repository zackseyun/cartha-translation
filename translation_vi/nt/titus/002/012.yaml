id: TIT.2.12
reference: Titus 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: vi
  text: rèn luyện chúng ta[a], để chúng ta từ bỏ sự bất kính đối với Đức Chúa Trời và những ham muốn thuộc thế gian[b], mà sống tiết độ, công chính và tin kính[c] trong thời đại hiện nay,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dạy dỗ chúng ta” hoặc “sửa dạy chúng ta”; từ Hy Lạp bao hàm sự giáo dục, uốn nắn và rèn luyện.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những dục vọng thuộc thế gian.”'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn Hy Lạp dùng ba trạng từ, theo nghĩa đen là “sống một cách tiết độ, công chính và tin kính.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: rèn luyện
  rationale: Diễn tả tác động giáo dục và uốn nắn về đạo đức của ân điển; tự nhiên hơn cách chỉ nói “dạy dỗ”, đồng thời không thu hẹp nghĩa vào sự sửa phạt.
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ sắc thái mục đích của mệnh đề Hy Lạp và phù hợp với cú pháp tiếng Việt hiện đại.
- source_word: ἀρνησάμενοι
  choice: từ bỏ
  rationale: Diễn tả sự khước từ dứt khoát; trong tiếng Việt, cấu trúc “để chúng ta từ bỏ... mà sống...” truyền đạt tự nhiên quan hệ giữa việc khước từ và nếp sống mới mà không nhất thiết áp đặt một trình tự thời gian cứng nhắc.
- source_word: ἀσέβειαν
  choice: sự bất kính đối với Đức Chúa Trời
  rationale: Nêu rõ chiều kích chống nghịch, thiếu lòng tôn kính đối với Đức Chúa Trời; dễ hiểu hơn thuật ngữ Hán-Việt “bất kính” khi đứng riêng.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: những ham muốn thuộc thế gian
  rationale: Giữ nghĩa các ham muốn mang tính hoặc chịu sự định hình của trật tự thế gian, không đồng nhất mọi ham muốn với điều xấu.
- source_word: σωφρόνως
  choice: tiết độ
  rationale: Diễn đạt nếp sống biết tự chủ và có phán đoán đúng đắn, đồng thời duy trì chủ đề nổi bật trong thư Tít.
- source_word: δικαίως
  choice: công chính
  rationale: Giữ chiều kích đạo đức và thần học của cách sống phù hợp với điều phải.
- source_word: εὐσεβῶς
  choice: tin kính
  rationale: Diễn tả nếp sống kính sợ và hướng về Đức Chúa Trời bằng thuật ngữ tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ζήσωμεν
  choice: chúng ta ... sống
  rationale: Thể giả định dưới ἵνα được truyền đạt bằng mệnh đề mục đích “để chúng ta... sống”, tự nhiên hơn việc thêm một trợ động từ không cần thiết.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: trong thời đại hiện nay
  rationale: Giữ sắc thái cánh chung của αἰών, tức thời đại hiện tại tương phản với thời đại sẽ đến, thay vì giản lược thành “thế giới” hay “thời gian”.
theological_decisions:
- issue: Ba trạng từ σωφρόνως καὶ δικαίως καὶ εὐσεβῶς
  choice: sống tiết độ, công chính và tin kính
  alternative: sống một cách tự chủ, ngay thẳng và sùng kính
  rationale: Tiếng Việt có thể dùng ba từ này sau “sống” như các bổ ngữ chỉ cách thức, nhờ đó vừa giữ cấu trúc ba mặt của nguyên văn vừa tránh biến chúng thành ba loại “đời sống” riêng biệt.
- issue: Quan hệ của phân từ ἀρνησάμενοι với ζήσωμεν
  choice: từ bỏ ... mà sống
  alternative: sau khi đã từ bỏ ... thì sống
  rationale: Phân từ aorist có thể gợi hành động đi trước về mặt logic, nhưng câu tiếng Việt tránh nhấn quá mức một thứ tự thời gian tuyệt đối; vẫn bảo toàn sự khước từ dứt khoát gắn với nếp sống mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Rèn luyện” bảo toàn tính giáo dục-uốn nắn của παιδεύουσα; “sự bất kính đối với Đức Chúa Trời” làm rõ đối tượng hàm ẩn; ba phẩm chất đạo đức được trình bày cân xứng. Dấu phẩy cuối câu được giữ vì đây là một phần câu tiếp nối sang câu 13.
