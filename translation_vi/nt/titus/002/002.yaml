id: TIT.2.2
reference: Titus 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: vi
  text: Những người đàn ông lớn tuổi phải tiết độ, đáng kính, biết tự chủ, vững vàng trong đức tin[a], trong tình yêu thương và trong sự kiên trì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vững vàng trong sự trung tín”. Từ Hy Lạp πίστις có thể mang nghĩa “đức tin” hoặc “sự trung tín”, tùy ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: những người đàn ông lớn tuổi
  rationale: Trong ngữ cảnh lời dạy dành cho các nhóm tuổi, từ này chỉ những người nam cao tuổi, không phải chức vụ trưởng lão.
- source_word: νηφαλίους
  choice: tiết độ
  rationale: Từ này có thể chỉ sự tỉnh táo, không say, và theo nghĩa rộng là biết kiềm chế; “tiết độ” diễn đạt phẩm chất luân lý rộng hơn mà không giới hạn vào rượu.
- source_word: σεμνούς
  choice: đáng kính
  rationale: Diễn tả phẩm cách nghiêm trang, cao quý, khiến người khác kính trọng; cách nói này tự nhiên và không hàm ý chỉ là vẻ mặt nghiêm nghị.
- source_word: σώφρονας
  choice: biết tự chủ
  rationale: Diễn tả khả năng phán đoán chín chắn và chế ngự bản thân; “biết tự chủ” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὑγιαίνοντας
  choice: vững vàng
  rationale: Nghĩa đen là khỏe mạnh, lành mạnh; ở đây được dùng theo nghĩa bóng về tình trạng không khiếm khuyết trong các phẩm chất được nêu. “Vững vàng” tự nhiên với cả đức tin, tình yêu thương và sự kiên trì.
- source_word: τῇ πίστει
  choice: trong đức tin
  rationale: πίστις có thể mang nghĩa đức tin hoặc sự trung tín. Bản chính dùng “đức tin”, đồng thời giữ khả năng kia trong chú thích.
- source_word: τῇ ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Cách dịch thông dụng, rõ ràng của ἀγάπη; giới từ “trong” duy trì cấu trúc song hành của ba phẩm chất.
- source_word: τῇ ὑπομονῇ
  choice: trong sự kiên trì
  rationale: Ὑπομονή chỉ sự bền bỉ chịu đựng trong khó khăn; “sự kiên trì” là cách diễn đạt tự nhiên, dễ hiểu.
- source_word: εἶναι
  choice: phải
  rationale: Động từ nguyên mẫu lệ thuộc vào lời khuyên dạy ở câu trước; “phải” truyền đạt tự nhiên lực khuyên bảo trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của πίστις trong danh sách các phẩm chất
  choice: đức tin
  alternative: sự trung tín
  rationale: Trong bộ ba đức tin, tình yêu thương và sự kiên trì, πίστις có thể chỉ lòng tin cậy hoặc phẩm chất trung tín. Bản chính chọn “đức tin” nhưng không loại bỏ cách hiểu “sự trung tín”, nên ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc liệt kê được giữ gọn; ba cụm “trong...” được lặp lại để phản ánh cấu trúc song hành của nguyên văn và cho thấy “vững vàng” chi phối cả ba phẩm chất.
