  text: Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: vi
  text: Cũng vậy, hãy khuyên các thanh niên[a] biết tự chủ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người nam trẻ tuổi.” Tiếng Hy Lạp chỉ cụ thể những người nam trẻ tuổi, không phải người trẻ nói chung.
    reason: lexical_alternative
  - marker: b
    text: Hay “sống chừng mực” hoặc “có suy xét sáng suốt.” Từ Hy Lạp nhấn mạnh sự phán đoán đúng đắn và sự tự kiềm chế có kỷ luật.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: những người nam trẻ tuổi
  rationale: Dạng đối cách giống đực số nhiều có mạo từ chỉ cụ thể những người nam trẻ tuổi trong chuỗi lời dạy dành cho các nhóm theo tuổi tác và giới tính. Cách dịch này giữ đúng phạm vi giới tính của nguyên văn.
- source_word: ὡσαύτως
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên kết tương ứng với những lời chỉ dẫn ngay trước đó.
- source_word: παρακάλει
  choice: hãy khuyên
  rationale: Động từ mệnh lệnh hiện tại truyền đạt việc Tít cần thường xuyên khuyên bảo, thúc giục; “hãy khuyên” tự nhiên và đủ sức nặng trong tiếng Việt hiện đại.
- source_word: σωφρονεῖν
  choice: biết tự chủ
  rationale: Diễn tả sự phán đoán sáng suốt đi đôi với khả năng tiết chế và quản trị bản thân; “biết tự chủ” rõ ràng, tự nhiên và phù hợp với chủ đề lặp lại trong phân đoạn.
theological_decisions:
- issue: Phạm vi giới tính của νεωτέρους
  choice: chỉ cụ thể những người nam trẻ tuổi
  alternative: những người trẻ nói chung
  rationale: Ngữ cảnh lần lượt nói với các nhóm gồm đàn ông cao tuổi, phụ nữ cao tuổi, phụ nữ trẻ và sau đó là nam giới trẻ tuổi. Vì vậy, bản dịch không trung tính hóa danh từ giống đực số nhiều.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Những người nam trẻ tuổi” được dùng để giữ rõ nét giới tính của nguyên văn; chú thích cung cấp cách nói gọn, tự nhiên hơn là “các thanh niên.”
