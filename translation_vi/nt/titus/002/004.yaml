  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα ⸀σωφρονίζωσι τὰς νέας φιλάνδρους εἶναι, φιλοτέκνους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/004.yaml
  text: so that they may train the younger women to be loving toward their husbands and loving toward their children[c][b][a],
translation:
  language: vi
  text: để họ dạy dỗ[a] những phụ nữ trẻ[b] biết yêu chồng và yêu con[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khuyên bảo”, “rèn luyện” hoặc “dạy sống sáng suốt”; động từ Hy Lạp hàm ý hướng dẫn người khác đến cách suy nghĩ và cư xử đúng mực.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những người trẻ hơn” ở giống cái, tương phản với các phụ nữ cao tuổi trong văn cảnh.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “có lòng yêu thương chồng mình và con cái mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên ý mục đích của liên từ Hy Lạp trong mạch câu.
- source_word: σωφρονίζωσι
  choice: họ dạy dỗ
  rationale: Động từ này chỉ việc hướng dẫn, khuyên bảo và rèn luyện người khác hướng đến lối sống sáng suốt, đúng mực. “Dạy dỗ” thể hiện tính chất uốn nắn lâu dài, còn hình thái giả định được chuyển tải tự nhiên qua mệnh đề mục đích với “để”.
- source_word: τὰς νέας
  choice: những phụ nữ trẻ
  rationale: Tính từ giống cái số nhiều có mạo từ được dùng như danh từ, chỉ những phụ nữ trẻ hơn, đối lập với các phụ nữ cao tuổi trong văn cảnh; không thu hẹp thành “những người vợ trẻ” vì từ “vợ” không xuất hiện ở đây.
- source_word: φιλάνδρους
  choice: biết yêu chồng
  rationale: Tính từ này mô tả người có lòng yêu thương chồng. Cách nói “biết yêu chồng” tự nhiên trong tiếng Việt và phù hợp với ý được dạy dỗ để có phẩm chất ấy.
- source_word: εἶναι
  choice: biết
  rationale: Động từ nguyên mẫu “là/trở nên” nối việc dạy dỗ với các phẩm chất theo sau. Trong tiếng Việt, “biết” kết hợp tự nhiên với “dạy dỗ” và diễn tả việc hình thành nếp sống, không chỉ cảm xúc.
- source_word: φιλοτέκνους
  choice: yêu con
  rationale: Tính từ này mô tả lòng yêu thương con cái. “Yêu con” giữ được cấu trúc song song, ngắn gọn với “yêu chồng” trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của cụm “những phụ nữ trẻ” trong lời dạy về gia đình
  choice: Giữ cách gọi rộng là “những phụ nữ trẻ”, đồng thời dịch trực tiếp các phẩm chất yêu chồng và yêu con mà câu nêu ra.
  alternative: Dịch là “những người vợ trẻ”, hoặc diễn giải câu này thành một định nghĩa phổ quát về vai trò của mọi phụ nữ.
  rationale: Nguyên văn chỉ nói “những người trẻ hơn” ở giống cái, trong khi các phẩm chất tiếp theo giả định hoàn cảnh có chồng và con. Bản dịch không nên thu hẹp danh xưng vượt quá nguyên văn, cũng không nên biến hoàn cảnh cụ thể này thành một định nghĩa bao quát về mọi phụ nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Dạy dỗ” thể hiện sự hướng dẫn có tính hình thành nếp sống; cặp “yêu chồng và yêu con” giữ nhịp song song tự nhiên trong tiếng Việt. Dấu phẩy cuối câu được giữ vì đây là một phần của câu dài hơn trong văn cảnh.
