id: TIT.2.5
reference: Titus 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: vi
  text: biết tự chủ, thanh sạch, chăm lo việc nhà[a], nhân hậu, thuận phục chồng mình[b], để lời Đức Chúa Trời không bị phỉ báng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “siêng năng làm việc nhà” hoặc “chăm nom nhà cửa.” Từ Hy Lạp này hiếm gặp và nói đến việc tích cực đảm đương công việc gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vâng phục chồng mình.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “không bị nói xấu” hoặc “không bị bôi nhọ”; sát nghĩa hơn là “không bị phạm thượng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: biết tự chủ
  rationale: Diễn đạt sự sáng suốt thể hiện qua khả năng làm chủ bản thân; tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἁγνάς
  choice: thanh sạch
  rationale: Giữ nghĩa rộng về sự trong sạch, nhất là về đạo đức, mà không thu hẹp riêng vào sự trinh tiết.
- source_word: οἰκουργούς
  choice: chăm lo việc nhà
  rationale: Từ hiếm này gắn việc nhà với hoạt động lao động; cách dịch nhấn mạnh trách nhiệm và công việc trong gia đình nhưng không hàm ý bị giới hạn hay giam mình trong nhà.
- source_word: ἀγαθάς
  choice: nhân hậu
  rationale: Trong danh sách các phẩm chất, từ này nói đến sự tốt lành biểu hiện trong cách đối xử; “nhân hậu” tự nhiên và cụ thể hơn “tốt”.
- source_word: ὑποτασσομένας
  choice: thuận phục
  rationale: Giữ ý về việc đặt mình trong một trật tự quan hệ, đồng thời không thêm vào câu một hệ thống giáo lý rộng hơn.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: chồng mình
  rationale: Trong bối cảnh hôn nhân, ἀνήρ chỉ người chồng; “mình” chuyển tải ἰδίοις và giới hạn phạm vi vào chính người chồng của mỗi người.
- source_word: ἵνα μὴ
  choice: để ... không
  rationale: Diễn đạt tự nhiên sắc thái mục đích của liên từ Hy Lạp.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Cách dịch trực tiếp, quen thuộc và trang trọng, chỉ lời hay sứ điệp đến từ Đức Chúa Trời.
- source_word: βλασφημῆται
  choice: bị xúc phạm
  rationale: Truyền đạt việc lời Đức Chúa Trời bị nói xấu, phỉ báng hoặc bôi nhọ; phù hợp với đối tượng của động từ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Diễn đạt οἰκουργούς mà không biến trách nhiệm gia đình thành mệnh lệnh cách ly khỏi đời sống bên ngoài
  choice: chăm lo việc nhà
  alternative: làm việc tại nhà; chuyên lo việc nhà
  rationale: Từ Hy Lạp nhấn mạnh hoạt động và trách nhiệm liên quan đến gia đình, nhưng tự nó không tuyên bố rằng phụ nữ phải bị giới hạn hoàn toàn trong nhà.
- issue: Diễn đạt ὑποτασσομένας mà không áp đặt một hệ thống giáo phái về quan hệ vợ chồng
  choice: thuận phục chồng mình
  alternative: vâng phục chồng mình; đặt mình dưới chồng mình
  rationale: “Thuận phục” bảo toàn ý trật tự quan hệ trong câu, còn “chồng mình” giữ rõ giới hạn là quan hệ hôn nhân cụ thể; bản dịch không mở rộng câu thành một tuyên bố về mọi quan hệ nam nữ.
- issue: Diễn đạt βλασφημῆται khi đối tượng là lời Đức Chúa Trời
  choice: không bị xúc phạm
  alternative: không bị phỉ báng; không bị nói xấu
  rationale: Động từ có thể mang nghĩa phạm thượng hoặc phỉ báng. “Bị xúc phạm” giữ được phạm vi tương đối rộng, còn chú thích nêu những cách hiểu cụ thể hơn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu này là phần tiếp nối của một danh sách nên được giữ ở dạng cụm từ, không tự ý thêm chủ ngữ. Các từ “mình” và “chồng” bảo toàn phạm vi hôn nhân cụ thể của nguyên văn.
