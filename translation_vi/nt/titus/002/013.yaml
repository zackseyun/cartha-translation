    issue: Thêm “Chúa” trước “Giê-su”
    rationale: Nguyên văn chỉ có Ἰησοῦ Χριστοῦ. Dù “Chúa Giê-su” quen thuộc trong cách dùng Cơ Đốc giáo Việt Nam, từ “Chúa” là một tước hiệu bổ sung và không cần thiết để diễn đạt quan hệ đồng vị trong câu.
  - severity: low
    issue: Phiên âm “Mê-si” chưa tự nhiên/đầy đủ trong tiếng Việt chuẩn
    rationale: “Mê-si-a” là dạng phiên âm thông dụng và rõ ràng hơn cho Messiah; vẫn giữ ý nghĩa tước hiệu của Χριστός.
  - severity: low
    issue: “Sự hiện ra” kém tự nhiên hơn “sự xuất hiện”
    rationale: Cả hai đều có thể dùng, nhưng “sự xuất hiện của vinh quang” diễn đạt ἐπιφάνειαν tự nhiên hơn trong văn xuôi trang trọng hiện đại.
