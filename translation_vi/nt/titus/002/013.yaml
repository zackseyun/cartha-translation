  verdict: revise
  source_fidelity: Bản dịch giữ đúng mạch phân từ συνεχ diễn của προσδεχόμενοι, các ý “niềm hy vọng phước hạnh,” “sự xuất hiện của vinh quang,” và cách hiểu một quy chiếu của cụm một mạo từ. Tuy nhiên, “Chúa” trước “Giê-su” thêm một tước hiệu không có trong Ἰησοῦ Χριστοῦ; sự tôn kính không cần được biểu thị bằng một từ được thêm vào bản văn.
  naturalness: “Trong khi chúng ta trông đợi” và “niềm hy vọng phước hạnh” phù hợp văn phong Kinh Thánh Việt hiện đại. “Sự xuất hiện” tự nhiên hơn đôi chút so với “sự hiện ra” trong cụm danh từ này. Dạng “Mê-si-a” là cách phiên âm Việt ngữ đầy đủ, dễ nhận ra và tự nhiên hơn “Mê-si.”
  terminology: Giữ “Đức Chúa Trời,” “Đấng Cứu Rỗi,” và “vinh quang” là thích hợp với thanh vực trang trọng. Dịch Χριστός là “Đấng Mê-si-a” phù hợp chính sách dịch tước hiệu; không thêm “Chúa” vào tên Giê-su khi nguyên ngữ không có κύριος.
  issues:
