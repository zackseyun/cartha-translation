id: TIT.2.13
reference: Titus 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: vi
  text: trong khi chúng ta trông đợi niềm hy vọng phước hạnh và sự xuất hiện của vinh quang Đức Chúa Trời vĩ đại và Đấng Cứu Rỗi của chúng ta[a], là Giê-su, Đấng Mê-si-a,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch, nhưng ít khả dĩ hơn: “vinh quang của Đức Chúa Trời vĩ đại và của Đấng Cứu Rỗi chúng ta là Giê-su, Đấng Mê-si-a,” nếu hiểu “Đức Chúa Trời” và “Đấng Cứu Rỗi” là hai đối tượng riêng biệt, thay vì một tước hiệu thống nhất dành cho Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: trong khi chúng ta trông đợi
  rationale: Diễn đạt tự nhiên lực tiếp diễn của phân từ và sắc thái mong chờ tha thiết, đồng thời nối với mạch câu trước.
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: niềm hy vọng phước hạnh
  rationale: Giữ danh từ 'hy vọng' và sắc thái thần học của μακαρίαν; 'phước hạnh' trang trọng, quen thuộc mà không biến hy vọng thành cảm xúc chủ quan.
- source_word: ἐπιφάνειαν
  choice: sự hiện ra
  rationale: Diễn đạt rõ sự xuất hiện hữu hình trong bối cảnh cánh chung, tránh thuật ngữ chuyên môn khó hiểu.
- source_word: δόξης
  choice: vinh quang
  rationale: Giữ trực tiếp danh từ và cấu trúc 'sự hiện ra của vinh quang' của tiếng Hy Lạp.
- source_word: τοῦ μεγάλου θεοῦ
  choice: Đức Chúa Trời vĩ đại
  rationale: Chuyển tải trực tiếp tính từ μεγάλου bổ nghĩa cho θεοῦ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: σωτῆρος ἡμῶν
  choice: Đấng Cứu Rỗi của chúng ta
  rationale: Cách gọi trang trọng, dễ hiểu và quen thuộc; giữ đại từ sở hữu đi với toàn cụm tước hiệu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: Dịch Χριστός theo ý nghĩa tước hiệu 'Đấng Mê-si' thay vì phiên âm; thêm 'Chúa' trước tên Giê-su theo cách xưng gọi tự nhiên và tôn kính trong tiếng Việt, không dùng nó để dịch một từ riêng trong nguyên văn.
theological_decisions:
- issue: Cụm 'Đức Chúa Trời vĩ đại và Đấng Cứu Rỗi của chúng ta' chỉ một hay hai đối tượng
  choice: 'Hiểu là một đối tượng: Chúa Giê-su, Đấng Mê-si, được đồng nhất là Đức Chúa Trời vĩ đại và Đấng Cứu Rỗi của chúng ta.'
  alternative: 'Hiểu là hai đối tượng: Đức Chúa Trời vĩ đại và Đấng Cứu Rỗi của chúng ta là Chúa Giê-su, Đấng Mê-si.'
  rationale: Một mạo từ τοῦ chi phối hai danh từ chỉ ngôi số ít θεοῦ và σωτῆρος, rồi theo sau là Ἰησοῦ Χριστοῦ; cấu trúc này tự nhiên nhất khi chỉ một đối tượng. Dấu phẩy và 'là' làm rõ quan hệ đồng vị trong tiếng Việt, còn cách hiểu ít khả dĩ hơn được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc phụ thuộc của phân từ vì đây là một phần của câu dài hơn. Dùng 'Đấng Mê-si' để thể hiện Χριστός như một tước hiệu; giữ sự mơ hồ cú pháp có thật bằng chú thích thay vì âm thầm loại bỏ cách hiểu khác.
