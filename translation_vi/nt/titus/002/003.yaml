    rationale: '“Không làm nô lệ cho nhiều rượu” mang nghĩa chủ động: các phụ nữ không biến rượu thành nô lệ. Nguyên văn là phân từ hoàn thành bị động, mô tả họ không bị nhiều rượu nô dịch.'
