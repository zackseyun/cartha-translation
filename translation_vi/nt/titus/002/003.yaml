source:
  edition: SBLGNT
  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: vi
  text: Các phụ nữ lớn tuổi cũng vậy, phải có cung cách phù hợp với sự thánh khiết, không vu khống[a], không bị nhiều rượu bắt làm nô lệ[b], là những người dạy điều tốt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không cáo gian” hoặc “không nói hành ác ý.” Từ Hy Lạp ở đây có liên hệ với từ thường được dịch là “ma quỷ,” nhưng trong văn cảnh này chỉ những người hay vu khống.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không nghiện nhiều rượu.” Nguyên văn Hy Lạp sát nghĩa hơn là “không bị nhiều rượu bắt làm nô lệ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: các phụ nữ lớn tuổi
  rationale: Chỉ những phụ nữ cao tuổi, song song với những người đàn ông lớn tuổi ở câu trước; cách diễn đạt này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὡσαύτως
  choice: cũng vậy
  rationale: Giữ mối liên kết với lời khuyên dành cho nhóm người ở câu trước bằng một cách nói ngắn gọn, tự nhiên.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: có cung cách xứng hợp với sự thánh khiết
  rationale: κατάστημα nói đến phong thái hay cung cách biểu hiện ra bên ngoài, còn ἱεροπρεπής chỉ điều thích hợp với sự thánh khiết hoặc phạm vi thiêng thánh. Cách dịch này giữ được sắc thái ấy mà vẫn dễ hiểu.
- source_word: μὴ διαβόλους
  choice: không vu khống
  rationale: Trong danh sách đạo đức này, διάβολος chỉ hành vi hoặc người nói lời vu khống, không phải là danh xưng chỉ ma quỷ. Dịch bằng động từ phù hợp tự nhiên với cấu trúc tiếng Việt.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: cũng không làm nô lệ cho nhiều rượu
  rationale: Giữ hình ảnh bị rượu thống trị trong phân từ hoàn thành bị động của δουλόω, thay vì chỉ diễn giải là nghiện.
- source_word: καλοδιδασκάλους
  choice: dạy điều tốt
  rationale: Từ ghép hiếm này nói về việc dạy nội dung tốt lành. Cách dịch tránh sự mơ hồ của lối nói có thể chỉ người dạy giỏi.
theological_decisions:
- issue: Hình ảnh nô lệ trong lời khuyên về rượu
  choice: Giữ hình ảnh bằng cụm “làm nô lệ cho nhiều rượu”
  alternative: “nghiện nhiều rượu” hoặc “nghiện rượu nặng”
  rationale: Nguyên văn mô tả tình trạng bị nhiều rượu bắt làm nô lệ, nhấn mạnh quyền chi phối của rượu. Giữ hình ảnh này bảo toàn sức nặng thần học và đạo đức của câu mà không thu hẹp nghĩa thành một chẩn đoán nghiện theo cách hiểu hiện đại.
- issue: Sắc thái của ἱεροπρεπεῖς
  choice: “xứng hợp với sự thánh khiết”
  alternative: “đáng tôn kính”
  rationale: Lựa chọn này giữ mối liên hệ của từ Hy Lạp với điều thiêng thánh, thay vì chỉ diễn đạt sự đáng kính theo chuẩn mực xã hội.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “cung cách” để diễn đạt phong thái biểu hiện ra bên ngoài. Các dấu chú thích được đặt ngay sau đúng cụm từ mà chú thích giải thích; câu kết bằng dấu phẩy vì mệnh đề tiếp tục sang câu kế.
