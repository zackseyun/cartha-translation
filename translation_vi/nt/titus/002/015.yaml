reference: Titus 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: vi
  text: Hãy nói những điều ấy, khuyên bảo và quở trách với đầy đủ thẩm quyền. Đừng để ai coi thường con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng để ai khinh con” hoặc “Đừng để ai xem nhẹ con.”'
    reason: περιφρονέω bao gồm các sắc thái coi thường, khinh miệt và xem nhẹ; các cách dịch này đều khả hữu trong văn cảnh.
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều ấy
  rationale: Đại từ chỉ định trung tính số nhiều quy chiếu về các chỉ dẫn trước đó trong chương; cách dịch này giữ phạm vi quy chiếu rộng mà không thu hẹp thành riêng các giáo huấn.
- source_word: λάλει
  choice: hãy nói
  rationale: Mệnh lệnh hiện tại chỉ việc tiếp tục truyền đạt bằng lời; “nói” trực tiếp và không đồng nhất động từ này với nghĩa chuyên biệt hơn là “dạy”.
- source_word: παρακάλει
  choice: khuyên bảo
  rationale: παρακαλέω có thể mang nghĩa khích lệ, thúc giục hoặc khuyên nhủ. “Khuyên bảo” tự nhiên trong tiếng Việt và giữ được sức hướng dẫn luân lý trong văn cảnh.
- source_word: ἔλεγχε
  choice: quở trách
  rationale: ἐλέγχω ở đây nói đến việc vạch ra điều sai và sửa trị; “quở trách” giữ sức mạnh của mệnh lệnh mục vụ, mạnh hơn cách dịch đơn thuần là “sửa bảo”.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: với trọn thẩm quyền
  rationale: ἐπιταγή có thể chỉ mệnh lệnh, sự truyền lệnh hoặc thẩm quyền. Trong cấu trúc này, πάσης nhấn mạnh mức độ đầy đủ; “với trọn thẩm quyền” diễn đạt tự nhiên sức nặng được trao để thực hiện các hành động trên.
- source_word: μηδείς
  choice: đừng để ai
  rationale: Kết cấu mệnh lệnh cấm ở ngôi thứ ba được chuyển sang lối nói tiếng Việt tự nhiên “đừng để ai”, vẫn giữ phạm vi tuyệt đối của μηδείς.
- source_word: σου
  choice: con
  rationale: Đại từ số ít chỉ Ti-tút. “Con” phù hợp quan hệ thân tình giữa Phao-lô và Ti-tút thể hiện ở 1:4, đồng thời tự nhiên trong diễn ngôn tiếng Việt.
- source_word: περιφρονείτω
  choice: coi thường
  rationale: περιφρονέω có nghĩa nghĩ thấp về, khinh hoặc không coi trọng. “Coi thường” giữ được cả sắc thái hạ thấp người nói lẫn xem nhẹ lời và chức trách của người ấy.
theological_decisions:
- issue: Sức nặng của μετὰ πάσης ἐπιταγῆς đối với vai trò của Ti-tút
  choice: Ti-tút phải nói, khuyên bảo và quở trách với trọn thẩm quyền được hàm ý trong nhiệm vụ đã giao.
  alternative: Cụm từ chỉ yêu cầu giọng điệu ra lệnh, hoặc chỉ nói về thẩm quyền của sứ điệp chứ không liên hệ đến vai trò của Ti-tút.
  rationale: Cụm giới từ tự nhiên bổ nghĩa cho chuỗi mệnh lệnh và cho thấy sức nặng khi thi hành chúng. Bản dịch không thêm “được ủy thác”, nhờ đó tránh xác định quá mức nguồn hay bản chất của thẩm quyền ngoài điều câu văn trực tiếp nói.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ba động từ mệnh lệnh cân xứng: “nói, khuyên bảo và quở trách”. Đại từ “con” phản ánh cách Phao-lô gọi Ti-tút là “người con thật” ở 1:4; không dùng từ cổ. Dấu chú thích [a] được đặt ngay sau mệnh đề có từ ngữ cần giải thích.'
