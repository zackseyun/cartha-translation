  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: vi
  text: Trong mọi phương diện, con hãy tỏ mình là gương mẫu trong các việc lành[a]; trong sự dạy dỗ, hãy giữ sự không pha tạp[b] và sự nghiêm trang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong mọi sự, con hãy tỏ mình là khuôn mẫu về những việc lành.”'
    reason: Giữ các khả năng dịch của περὶ πάντα và τύπον.
  - marker: b
    text: Hay “sự liêm chính”, “sự thuần khiết” hoặc “tính không hư hoại.”
    reason: ἀφθορίαν chỉ điều không bị hư hoại hay pha tạp; trong ngữ cảnh này có thể quy về lời dạy hoặc phẩm chất của người dạy.
  - marker: c
    text: Hay “phẩm cách đáng kính” hoặc “sự đứng đắn.”
    reason: σεμνότητα chỉ phẩm chất nghiêm túc, đứng đắn và đáng được tôn trọng.
lexical_decisions:
- source_word: περὶ πάντα
  choice: trong mọi phương diện
  rationale: Cụm từ có chức năng trạng ngữ, diễn tả tính toàn diện trong cách sống. Cách dịch này tự nhiên trong tiếng Việt và tránh hiểu thành chủ đề “về mọi sự”.
- source_word: σεαυτὸν παρεχόμενος
  choice: chính con phải tỏ mình
  rationale: Giữ sắc thái phản thân và sự chủ động của Tít trong việc thể hiện bản thân; “chính con” cũng làm rõ sự chuyển từ lời khuyên chung sang lời trực tiếp dành cho Tít.
- source_word: τύπον
  choice: gương
  rationale: Trong ngữ cảnh đạo đức, từ này chỉ một mẫu mực để người khác noi theo. “Gương” là cách nói ngắn gọn, tự nhiên và trang trọng trong tiếng Việt.
- source_word: καλῶν ἔργων
  choice: những việc lành
  rationale: Diễn đạt trực tiếp các hành động tốt đẹp; “việc lành” vừa quen thuộc vừa không áp đặt một hệ thống thần học ngoài văn bản.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: trong sự dạy dỗ
  rationale: Chỉ hoạt động và nội dung giảng dạy của Tít. Cách dịch này giữ phạm vi rộng hơn “giáo lý” và không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: ἀφθορίαν
  choice: sự thuần khiết
  rationale: Trong ngữ cảnh dạy dỗ, từ này nói đến tình trạng không bị hư hoại hay pha tạp. “Thuần khiết” tự nhiên hơn “không thể hư hoại” trong tiếng Việt, nhưng vẫn giữ ý căn bản.
- source_word: σεμνότητα
  choice: phẩm cách đáng kính
  rationale: Diễn tả tính nghiêm trang, đứng đắn, xứng đáng được tôn trọng; cụm từ này truyền đạt đầy đủ hơn chỉ “nghiêm túc”.
theological_decisions:
- issue: Phạm vi của διδασκαλία
  choice: Dịch là “sự dạy dỗ”.
  alternative: “giáo lý” hoặc “việc giảng dạy của con”
  rationale: Văn bản có thể bao gồm cả nội dung lẫn cách thức dạy. “Sự dạy dỗ” giữ được độ rộng ấy mà không giới hạn vào hệ thống tín điều.
- issue: Ý nghĩa của ἀφθορίαν
  choice: Dịch là “sự thuần khiết”.
  alternative: “sự liêm chính”, “tính không hư hoại”
  rationale: Từ này có thể nhấn mạnh giáo huấn không bị pha tạp hoặc phẩm chất liêm chính của người dạy. Bản dịch chính giữ hình ảnh không bị hư hoại, còn chú thích bảo tồn khả năng hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” phù hợp lời Phao-lô trực tiếp khuyên Tít. Cấu trúc mệnh lệnh được làm rõ trong tiếng Việt để câu không trở thành một chuỗi danh từ rời rạc; các chú thích giữ những khả năng từ vựng thực sự của nguyên văn.
