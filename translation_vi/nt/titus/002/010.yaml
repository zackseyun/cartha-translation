  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: vi
  text: không lấy cắp, nhưng tỏ ra hoàn toàn trung tín[a], để trong mọi sự, họ làm đẹp cho lời dạy của Đức Chúa Trời, Đấng Cứu Rỗi của chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “chứng tỏ mình hoàn toàn đáng tin cậy.” Từ Hy Lạp cũng thường được dịch là “đức tin,” nhưng ở đây chủ yếu nói đến sự trung thành trong cách cư xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: không lấy cắp
  rationale: Động từ chỉ việc lén giữ hoặc lấy cho mình tài sản thuộc về người khác. “Lấy cắp” rõ nghĩa, tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành một hình thức biển thủ cụ thể.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: tỏ ra hoàn toàn trung tín
  rationale: Trong ngữ cảnh nói về cách đầy tớ cư xử với chủ, πίστις chủ yếu chỉ sự trung thành, đáng tin cậy. “Hoàn toàn” diễn đạt sức nhấn của πᾶσαν, còn “tỏ ra” tương ứng với ἐνδεικνυμένους.
- source_word: κοσμῶσιν
  choice: tôn thêm vẻ đẹp cho
  rationale: Giữ hình ảnh trang điểm, làm đẹp của động từ Hy Lạp, đồng thời diễn đạt tự nhiên rằng hạnh kiểm tốt khiến lời dạy được người khác trân trọng.
- source_word: διδασκαλίαν
  choice: lời dạy
  rationale: Cách nói hiện đại, dễ hiểu và chính xác hơn “giáo lý” trong câu này.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: của Đức Chúa Trời, Đấng Cứu Rỗi chúng ta
  rationale: Giữ nguyên cấu trúc và tước hiệu của câu Hy Lạp, không đồng nhất hóa cụm từ này với một chủ thể khác ngoài điều câu văn nói rõ.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Diễn đạt phạm vi toàn diện của hành vi và bám sát cụm từ Hy Lạp.
theological_decisions:
- issue: Nghĩa của πίστις trong ngữ cảnh đạo đức
  choice: trung tín
  alternative: đức tin; đáng tin cậy
  rationale: Ngữ cảnh về việc đầy tớ không lấy cắp của chủ cho thấy nghĩa đạo đức là sự trung thành và đáng tin. Chú thích bảo lưu cách diễn đạt gần nghĩa khác mà không biến câu này thành một phát biểu riêng về nội dung đức tin.
- issue: Tước hiệu “Đức Chúa Trời, Đấng Cứu Rỗi chúng ta”
  choice: Giữ nguyên tước hiệu dành cho Đức Chúa Trời trong chính mệnh đề này
  alternative: Diễn giải tước hiệu theo cách đồng nhất trực tiếp với Đấng Christ
  rationale: Bản dịch phản ánh điều câu này nói rõ và không đưa thêm một kết luận thần học vốn không được nêu trực tiếp tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Tôn thêm vẻ đẹp cho” giữ được ẩn dụ của nguyên ngữ mà không dùng từ cổ như “điểm tô.”
