id: TIT.2.8
reference: Titus 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: vi
  text: lời nói lành mạnh[a], không đáng bị lên án[b], để người chống đối[c] phải hổ thẹn vì không có điều gì xấu để nói về chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời lành mạnh” hoặc “sứ điệp lành mạnh.”
    reason: lexical_alternative
  - marker: b
    text: Hay “không chỗ chê trách” hoặc “không thể bị kết tội.”
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hy Lạp: “người từ phía đối nghịch,” tức là một đối thủ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: lời nói
  rationale: Trong mạch văn về việc dạy dỗ và làm gương, từ này chỉ nội dung và cách nói, không nhất thiết là một từ đơn lẻ. “Lời nói” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành một sứ điệp cụ thể.
- source_word: ὑγιῆ
  choice: lành mạnh
  rationale: Giữ hình ảnh về sự khỏe mạnh, vốn thường được dùng trong các thư mục vụ để chỉ điều đúng đắn về giáo lý và đạo đức.
- source_word: ἀκατάγνωστον
  choice: không đáng bị lên án
  rationale: Diễn tả lời nói không có cơ sở chính đáng để bị kết tội hay chê trách. Cách dịch này tự nhiên hơn “không thể bị lên án” và không hàm ý rằng trên thực tế sẽ chẳng ai lên án.
- source_word: ἵνα
  choice: để
  rationale: Thể hiện gọn và tự nhiên ý mục đích hoặc kết quả dự liệu.
- source_word: ὁ ἐξ ἐναντίας
  choice: người chống đối
  rationale: Thành ngữ chỉ người ở phía đối nghịch. “Người chống đối” rõ nghĩa trong tiếng Việt mà không thêm đối tượng cụ thể ngoài nguyên văn.
- source_word: ἐντραπῇ
  choice: phải hổ thẹn
  rationale: 'Truyền đạt tác động xã hội và đạo đức của thể bị động: người chống đối bị đưa đến chỗ hổ thẹn vì không có căn cứ buộc tội.'
- source_word: μηδὲν ἔχων λέγειν
  choice: không có điều gì ... để nói
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên ý người ấy không có lời cáo buộc nào để nêu ra.
- source_word: περὶ ἡμῶν
  choice: về chúng ta
  rationale: Giữ nguyên đại từ ngôi thứ nhất số nhiều của tiếng Hy Lạp, không tự ý giới hạn hoặc mở rộng đối tượng.
- source_word: φαῦλον
  choice: điều gì xấu
  rationale: Trong ngữ cảnh lời buộc tội, từ này mang nghĩa điều xấu xa hoặc đáng chê trách; “điều gì xấu” tự nhiên và vẫn giữ sức nặng đạo đức.
theological_decisions:
- issue: Phạm vi của đại từ ngôi thứ nhất số nhiều trong περὶ ἡμῶν
  choice: Dịch là “về chúng ta” mà không xác định thêm thành phần được bao gồm.
  alternative: “về anh”, “về các Cơ Đốc nhân” hoặc “về sự dạy dỗ của chúng ta”
  rationale: Nguyên văn dùng ngôi thứ nhất số nhiều. Giữ nguyên đại từ bảo toàn sự mơ hồ chân thực về việc “chúng ta” chỉ Phao-lô và Tít hay còn bao gồm cộng đồng rộng hơn.
- issue: Sắc thái của ἀκατάγνωστον
  choice: “không đáng bị lên án”
  alternative: “không thể bị lên án” hoặc “không chỗ chê trách”
  rationale: Cụm từ nói đến việc không có căn cứ chính đáng để kết án, chứ không nhất thiết bảo đảm rằng không ai sẽ lên án. Cách dịch đã chọn bảo toàn sự phân biệt này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ cấu trúc mệnh lệnh nối tiếp từ câu trước bằng cách bắt đầu với “lời nói,” đồng thời dùng “lành mạnh” để bảo toàn ẩn dụ của nguyên văn.
