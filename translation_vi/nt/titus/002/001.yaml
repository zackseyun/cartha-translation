  terminology: Giữ «sự dạy dỗ lành mạnh» cho διδασκαλία là phù hợp, không thu hẹp từ này thành một hệ thống giáo lý. Chú thích «giáo lý lành mạnh» là một phương án từ vựng hợp lệ.
