id: TIT.2.1
reference: Titus 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: vi
  text: Còn anh, hãy nói những điều phù hợp với sự dạy dỗ lành mạnh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giáo lý lành mạnh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Nhưng phần con
  rationale: Đại từ Σὺ được nêu rõ và kết hợp với δὲ để tạo thế tương phản với những người vừa được nói đến. “Nhưng phần con” diễn đạt tự nhiên cả ý đối lập lẫn sự nhấn mạnh vào Ti-tút.
- source_word: λάλει
  choice: hãy nói
  rationale: Mệnh lệnh này có nghĩa rộng là nói hoặc trình bày; “hãy nói” giữ nguyên phạm vi ấy, không thu hẹp thành việc giảng dạy chính thức.
- source_word: ἃ πρέπει
  choice: những điều phù hợp với
  rationale: Cách dịch này giữ số nhiều của đại từ quan hệ và diễn đạt ý thích hợp, tương xứng của πρέπει bằng tiếng Việt tự nhiên.
- source_word: ὑγιαινούσῃ
  choice: lành mạnh
  rationale: Từ này vốn chỉ trạng thái khỏe mạnh và ở đây được dùng theo nghĩa ẩn dụ về sự dạy dỗ đúng đắn, không lệch lạc. “Lành mạnh” giữ được hình ảnh của nguyên ngữ.
- source_word: διδασκαλίᾳ
  choice: sự dạy dỗ
  rationale: διδασκαλία có thể chỉ hoạt động hoặc nội dung giảng dạy. “Sự dạy dỗ” dễ hiểu và giữ được độ rộng ấy hơn thuật ngữ kỹ thuật “giáo lý”.
theological_decisions:
- issue: Cách dịch τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: sự dạy dỗ lành mạnh
  alternative: giáo lý lành mạnh
  rationale: Cụm từ nói đến sự chỉ dạy đúng đắn và có tính nuôi dưỡng thuộc linh. “Sự dạy dỗ lành mạnh” bảo toàn ẩn dụ về sức khỏe và không giới hạn διδασκαλία chỉ vào một hệ thống giáo lý, trong khi chú thích ghi nhận cách hiểu thay thế hợp lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp lời một người hướng dẫn thuộc linh nói với Ti-tút; câu giữ sắc thái tương phản rõ của Σὺ δὲ và hình ảnh “lành mạnh” trong nguyên ngữ.
