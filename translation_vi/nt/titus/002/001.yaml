  source_fidelity: 'Cấu trúc và ý nghĩa chính được chuyển đạt đúng: Σὺ δὲ nêu sự tương phản, λάλει là mệnh lệnh nói/trình bày, và ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ là những điều phù hợp với sự dạy dỗ lành mạnh. Tuy nhiên, «con» thêm một quan hệ vai vế/cha-con không có trong câu Hy Lạp này; đại từ Σὺ chỉ là «anh/bạn» được nhấn mạnh trong đối lập.'
