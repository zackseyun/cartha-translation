  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: vi
  text: Các nô lệ[a] phải vâng phục chủ của mình trong mọi sự, làm vừa lòng chủ của mình và không cãi lại[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ” hoặc “tôi tớ”; tuy nhiên, từ Hy Lạp doulos trong văn cảnh này có lẽ nói đến người mang thân phận nô lệ.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “không nói chống lại” hoặc “không phản đối”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: các nô lệ
  rationale: Trong bối cảnh có δεσπόταις (‘chủ’), δοῦλος chỉ những người ở trong thân phận lệ thuộc có tính sở hữu; ‘nô lệ’ giữ đúng thực tế xã hội ấy hơn ‘đầy tớ’ hay ‘người phục vụ’.
- source_word: ἰδίοις δεσπόταις
  choice: chủ mình
  rationale: 'δεσπότης ở đây chỉ người có quyền làm chủ đối với nô lệ; ‘chủ’ là cách nói tự nhiên trong tiếng Việt. ‘Mình’ chuyển tải sắc thái sở hữu của ἰδίοις theo quan hệ phân phối: mỗi nô lệ đối với chủ của mình.'
- source_word: ὑποτάσσεσθαι
  choice: phải vâng phục
  rationale: Động từ diễn tả việc đặt mình dưới thẩm quyền. ‘Phải vâng phục’ truyền đạt tự nhiên sức khuyên dạy của cấu trúc nguyên mẫu trong ngữ cảnh.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Cụm từ có phạm vi rộng và được giữ nguyên, không tự ý thêm giới hạn mà câu Hy Lạp không nêu.
- source_word: εὐαρέστους εἶναι
  choice: làm vừa lòng chủ
  rationale: εὐάρεστος mang nghĩa ‘đẹp lòng, vừa lòng’. Việc thêm ‘chủ’ làm rõ đối tượng được hàm ý từ mệnh đề trước và tạo câu tiếng Việt tự nhiên.
- source_word: μὴ ἀντιλέγοντας
  choice: không cãi lại
  rationale: ἀντιλέγω có thể chỉ nói ngược, chống lời hoặc phản đối. ‘Không cãi lại’ giữ trọng tâm về sự chống đối bằng lời nói và phù hợp với văn cảnh gia đình–xã hội.
theological_decisions:
- issue: Cách dịch δοῦλος trong quy tắc ứng xử gia đình
  choice: nô lệ
  alternative: đầy tớ; tôi tớ; người phục vụ
  rationale: Việc nhắc đến δεσπόταις cho thấy thân phận nô lệ thực sự là điểm nổi bật. Bản dịch gọi đúng thực tế xã hội của nguyên văn nhưng không vì thế mà biểu thị sự tán thành chế độ nô lệ.
- issue: Phạm vi của ἐν πᾶσιν
  choice: trong mọi sự
  alternative: về mọi mặt
  rationale: Giữ nguyên tính bao quát và sức căng của câu nguồn, thay vì âm thầm bổ sung ngoại lệ thần học hoặc đạo đức không được phát biểu ngay trong câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Nô lệ’ tránh làm nhẹ đi thực tế xã hội của nguyên văn; ‘vâng phục’, ‘làm vừa lòng’ và ‘cãi lại’ là những cách nói thông dụng nhưng vẫn phù hợp với văn phong Kinh Thánh.
