id: TIT.2.14
reference: Titus 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: vi
  text: Đấng đã phó chính mình vì chúng ta, để chuộc chúng ta khỏi mọi sự vô luật pháp và thanh tẩy cho chính mình một dân thuộc riêng về Ngài[a], sốt sắng làm các việc lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một dân quý báu” hoặc “một dân đặc biệt.” Cụm từ Hy Lạp nhấn mạnh một dân thuộc sở hữu riêng của Ngài và gợi lại ngôn ngữ giao ước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: đã phó chính mình
  rationale: Diễn tả hành động tự nguyện trao ban chính mình; “phó chính mình” trang trọng, tự nhiên trong văn cảnh và giữ rõ sức nặng của đại từ phản thân.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: Giữ được nghĩa rộng là vì lợi ích hay vì cớ chúng ta, đồng thời không giới hạn câu vào một cách giải thích duy nhất về sự chuộc tội.
- source_word: ἵνα λυτρώσηται
  choice: để chuộc chúng ta
  rationale: “Chuộc” bảo tồn ý niệm giải thoát bằng giá chuộc và âm hưởng cứu chuộc của động từ Hy Lạp.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: khỏi mọi điều vô luật pháp
  rationale: “Vô luật pháp” phản ánh sát ἀνομία hơn từ rộng nghĩa như “gian ác”; “mọi điều” diễn đạt tự nhiên tính toàn diện của πάσης.
- source_word: καθαρίσῃ
  choice: thanh tẩy
  rationale: Giữ cả sắc thái làm sạch lẫn sự tinh sạch về đạo đức và giao ước trong văn cảnh.
- source_word: ἑαυτῷ
  choice: cho chính mình
  rationale: 'Diễn đạt mục đích và sự quy thuộc: dân được thanh tẩy để thuộc về chính Đấng ấy.'
- source_word: λαὸν περιούσιον
  choice: một dân thuộc riêng về mình
  rationale: Bảo tồn ý nghĩa giao ước về một dân đặc biệt thuộc quyền sở hữu của Ngài, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: sốt sắng làm các việc lành
  rationale: Diễn đạt rõ lòng nhiệt thành hướng đến việc thực hành các việc tốt lành, thay vì chỉ một thái độ trừu tượng đối với chúng.
theological_decisions:
- issue: Sắc thái của ὑπὲρ ἡμῶν trong việc Đấng Christ tự hiến
  choice: vì chúng ta
  alternative: thay cho chúng ta; vì lợi ích của chúng ta
  rationale: Giữ nguyên độ rộng của giới từ Hy Lạp, có thể mang sắc thái vì lợi ích và trong một số văn cảnh hàm ý thay thế, nhưng câu này không buộc bản dịch phải chọn riêng một mô hình chuộc tội.
- issue: Sắc thái giao ước của λαὸν περιούσιον
  choice: một dân thuộc riêng về mình
  alternative: một dân quý báu; một dân đặc biệt
  rationale: Cách dịch đã chọn nhấn mạnh sự quy thuộc đặc biệt và bảo tồn tiếng vọng ngôn ngữ giao ước, thay vì chỉ mô tả dân ấy là đặc biệt hay quý giá.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng” để nối tự nhiên với tiền ngữ chỉ Đấng Christ trong câu trước; giữ các thuật ngữ có âm hưởng Kinh Thánh như “chuộc,” “thanh tẩy,” “việc lành” mà không trở nên cổ ngữ.
