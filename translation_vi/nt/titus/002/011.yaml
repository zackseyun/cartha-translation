id: TIT.2.11
reference: Titus 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: vi
  text: Vì ân điển của Đức Chúa Trời đã xuất hiện, đem ơn cứu rỗi đến cho mọi người[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ân điển cứu mọi người đã xuất hiện” hoặc “ân điển cứu độ của Đức Chúa Trời đã xuất hiện cho mọi người.” Tính từ Hy Lạp σωτήριος (“cứu độ”, “đem ơn cứu rỗi”) và cụm từ πᾶσιν ἀνθρώποις (“mọi người”) có thể được liên kết hơi khác nhau về mặt cú pháp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: đã xuất hiện
  rationale: Động từ aorist ἐπιφαίνω được dùng theo nghĩa nội động từ, chỉ sự xuất hiện hay được bày tỏ; cách dịch này tự nhiên và giữ sắc thái ân điển bước vào lịch sử một cách hiển hiện.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ γάρ nêu lý do làm nền tảng cho những lời khuyên ở phần trước; “Vì” thể hiện rõ quan hệ giải thích ấy.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: “Ân điển” là thuật ngữ quen thuộc, trang trọng và thích hợp trong văn mạch Phao-lô; cấu trúc “của Đức Chúa Trời” phản ánh trực tiếp sở hữu cách Hy Lạp.
- source_word: σωτήριος
  choice: đem ơn cứu rỗi đến
  rationale: Tính từ σωτήριος mô tả ân điển là điều cứu độ hoặc đem lại sự cứu rỗi. Cách diễn đạt bằng động từ tự nhiên trong tiếng Việt mà không thêm một hệ thống thần học.
- source_word: πᾶσιν ἀνθρώποις
  choice: cho mọi người
  rationale: ἄνθρωποι ở đây chỉ con người nói chung, không riêng nam giới. “Mọi người” giữ nguyên phạm vi rộng của πᾶσιν, còn “cho” phù hợp tự nhiên với ý đem ơn cứu rỗi đến.
theological_decisions:
- issue: Phạm vi của πᾶσιν ἀνθρώποις liên quan đến sự cứu rỗi
  choice: Dịch là “cho mọi người” để giữ phạm vi phổ quát của câu mà không xác định đây là từng cá nhân không ngoại lệ hay mọi hạng người.
  alternative: “cho toàn thể nhân loại”; “đã xuất hiện cho mọi người”; “cứu mọi người”
  rationale: Nguyên văn khẳng định chiều kích phổ quát của ân điển cứu độ, nhưng không tự nó giải quyết mọi tranh luận thần học về cách thức hay kết quả áp dụng sự cứu rỗi. Bản dịch vì thế không thu hẹp hoặc mở rộng hàm ý ấy.
- issue: Quan hệ cú pháp của σωτήριος với πᾶσιν ἀνθρώποις
  choice: Hiểu σωτήριος bổ nghĩa cho “ân điển” và diễn đạt là ân điển “đem ơn cứu rỗi đến cho mọi người”.
  alternative: “ân điển ... cứu mọi người” hoặc “ân điển ... đã xuất hiện cho mọi người”
  rationale: Cấu trúc Hy Lạp cho phép đôi chút khác biệt trong cách gắn tính từ σωτήριος và cụm tặng cách. Cách chọn giữ σωτήριος gắn trực tiếp với ân điển, đồng thời ghi nhận các khả năng khác trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “ân điển” theo văn phong Kinh Thánh Tin Lành quen thuộc; câu vẫn đủ tự nhiên cho độc giả phổ thông. Đại từ chỉ nhân loại được dịch bao quát là “mọi người”.
