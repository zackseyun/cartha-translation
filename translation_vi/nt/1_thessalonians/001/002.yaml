id: 1TH.1.2
reference: 1 Thessalonians 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: vi
  text: Chúng tôi luôn tạ ơn Đức Chúa Trời vì tất cả anh chị em, nhắc đến anh chị em trong những lời cầu nguyện của chúng tôi không ngừng[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “Chúng tôi không ngừng tạ ơn.” Trạng từ này có thể bổ nghĩa riêng cho việc nhắc đến anh chị em trong lời cầu nguyện, hoặc rộng hơn, cho toàn bộ lời tạ ơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Chúng tôi ... tạ ơn
  rationale: Động từ hiện tại chủ động, ngôi thứ nhất số nhiều. “Tạ ơn” là cách diễn đạt tự nhiên, trang trọng trong công thức cảm tạ của Phao-lô và giữ rõ đối tượng tiếp nhận lòng biết ơn.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Danh từ ở cách dữ, chỉ Đấng tiếp nhận lời tạ ơn; dịch theo cách gọi quen thuộc và trang trọng trong tiếng Việt.
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt tự nhiên ý nghĩa thời gian của πάντοτε mà không làm câu nặng nề.
- source_word: περὶ πάντων ὑμῶν
  choice: vì tất cả anh chị em
  rationale: περί với sở hữu cách ở đây chỉ đối tượng được quan tâm trong lời cảm tạ. “Vì” tự nhiên trong tiếng Việt và “tất cả anh chị em” giữ nguyên tính bao quát của πάντων ὑμῶν.
- source_word: μνείαν ποιούμενοι
  choice: nhắc đến anh chị em
  rationale: Thành ngữ phân từ có nghĩa sát là “làm sự nhắc đến.” Bản dịch tự nhiên “nhắc đến” giữ mối liên hệ cụ thể với việc cầu nguyện; tân ngữ được bổ sung từ ngữ cảnh.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: trong những lời cầu nguyện của chúng tôi
  rationale: ἐπί với sở hữu cách trong thành ngữ này chỉ hoàn cảnh hoặc dịp cầu nguyện; “trong những lời cầu nguyện” rõ ràng và tự nhiên.
- source_word: ἀδιαλείπτως
  choice: không ngừng
  rationale: Giữ sắc thái kiên trì, liên tục của trạng từ và vị trí cuối cụm theo tiếng Hy Lạp, đồng thời vẫn là cách nói hiện đại, dễ hiểu.
theological_decisions:
- issue: Phạm vi bổ nghĩa của ἀδιαλείπτως
  choice: Đặt “không ngừng” sau cụm nói về việc nhắc đến trong lời cầu nguyện, nhưng ghi chú rằng phạm vi cú pháp không chắc chắn.
  alternative: 'Hiểu trạng từ này bổ nghĩa cho lời tạ ơn nói chung: “Chúng tôi không ngừng tạ ơn...”'
  rationale: Vị trí của trạng từ ở cuối câu Hy Lạp cho phép nó gắn trực tiếp với việc nhắc đến trong lời cầu nguyện hoặc với toàn bộ lời khẳng định về sự tạ ơn. Không nên âm thầm loại bỏ sự mơ hồ này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν một cách bao quát và tự nhiên trong lời gửi cộng đồng; giữ dấu phẩy cuối câu vì câu cú tiếp tục sang câu 3 trong nguyên văn.
