id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: vi
  text: và trông đợi Con Ngài từ trời đến, là Đấng Ngài đã làm cho sống lại từ cõi chết—Đức Giê-su, Đấng giải cứu chúng ta khỏi cơn thịnh nộ đang đến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμένειν
  choice: trông đợi
  rationale: Diễn đạt sự chờ đợi đầy mong mỏi và kỳ vọng, đồng thời nối tự nhiên với nội dung về việc quay về với Đức Chúa Trời ở câu trước.
- source_word: τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν
  choice: Con Ngài từ trời đến
  rationale: Giữ nguyên tước hiệu “Con Ngài”; thêm “đến” vốn được hàm ý bởi hướng chuyển động từ trời, giúp câu tiếng Việt tự nhiên mà không bổ sung một ý thần học mới. Danh từ số nhiều trong tiếng Hy Lạp được chuyển thành “trời” theo cách dùng thông thường của tiếng Việt.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: Đấng Ngài đã làm cho sống lại từ cõi chết
  rationale: Tái hiện rõ hành động của Đức Chúa Trời làm Đức Giê-su sống lại; “từ cõi chết” là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hy Lạp này.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dùng dạng tên riêng quen thuộc, trang trọng trong tiếng Việt hiện đại.
- source_word: τὸν ῥυόμενον ἡμᾶς
  choice: Đấng giải cứu chúng ta
  rationale: Mệnh đề quan hệ diễn đạt tự nhiên phân từ hiện tại, mô tả Đức Giê-su là Đấng giải cứu mà không buộc hành động chỉ thuộc hiện tại hay tương lai.
- source_word: ἐκ τῆς ὀργῆς τῆς ἐρχομένης
  choice: khỏi cơn thịnh nộ đang đến
  rationale: “Thịnh nộ” giữ sắc thái cụ thể của ὀργή thay vì làm nhẹ thành “sự phán xét”; “đang đến” bảo toàn hình ảnh điều ấy đang tiến đến.
theological_decisions:
- issue: Bản chất của “cơn thịnh nộ đang đến”
  choice: Giữ nguyên cách nói rộng “cơn thịnh nộ đang đến”.
  alternative: Giải thích cụ thể là đại nạn thời cuối cùng, sự phán xét chung cuộc, hoặc án phạt đời đời.
  rationale: Câu Hy Lạp không xác định hẹp đối tượng hay giai đoạn của cơn thịnh nộ, nên bản dịch không áp đặt một hệ thống cánh chung cụ thể.
- issue: Thời tính của phân từ ῥυόμενον
  choice: Dịch “Đấng giải cứu chúng ta”.
  alternative: “Đấng sẽ giải cứu chúng ta” hoặc “Đấng đang giải cứu chúng ta”.
  rationale: Phân từ hiện tại mô tả đặc tính và hành động của Đức Giê-su; dù “cơn thịnh nộ đang đến” hướng về tương lai, nguyên văn không dùng một động từ tương lai rõ ràng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. “Trông đợi” chuyển tải cả sự chờ đợi lẫn kỳ vọng; “Con Ngài” và “Đấng” duy trì sắc thái tôn kính mà không thêm cách giải thích giáo phái.
