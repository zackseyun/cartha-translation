  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: tín hữu Tê-sa-lô-ni-ca đã trở nên người noi gương Phao-lô cùng các cộng sự của ông và Chúa, trong lúc/qua việc đón nhận lời giữa hoạn nạn lớn, nhưng với niềm vui có nguồn nơi Đức Thánh Linh. Tuy nhiên, chú thích hiện tại gọi “niềm vui của Đức Thánh Linh” là “tức là niềm vui do Đức Thánh Linh tạo nên,” nên thực tế không bảo lưu cách hiểu thay thế của sở hữu cách Hy Lạp.'
