source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: vi
  text: Anh chị em đã trở nên những người noi gương chúng tôi và Chúa, khi đón nhận lời ấy giữa nhiều hoạn nạn, với niềm vui đến từ Đức Thánh Linh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với niềm vui của Đức Thánh Linh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: những người noi gương
  rationale: Diễn đạt đúng ý bắt chước một gương mẫu, đồng thời tự nhiên và trang trọng hơn cách dịch máy móc bằng danh từ.
- source_word: ἐγενήθητε
  choice: đã trở nên
  rationale: Giữ ý thay đổi trạng thái của động từ γίνομαι ở thì aorist.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: Trong ngữ cảnh này, κύριος là tước hiệu chỉ Chúa Giê-su; cách dịch quen thuộc và trang trọng là “Chúa”.
- source_word: δεξάμενοι
  choice: khi đón nhận
  rationale: Phân từ aorist giải thích hoàn cảnh hoặc cách họ trở nên người noi gương; “đón nhận” cũng thể hiện sắc thái tiếp nhận tích cực.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Giữ cách nói đặc trưng của Phao-lô về lời được rao giảng; đại từ chỉ định ngầm giúp tiếng Việt tự nhiên mà không diễn giải thành “sứ điệp”.
- source_word: ἐν θλίψει πολλῇ
  choice: giữa nhiều hoạn nạn
  rationale: θλῖψις chỉ áp lực, khốn khó và sự bắt bớ; “giữa nhiều hoạn nạn” rõ nghĩa, tự nhiên và không áp đặt sắc thái cánh chung.
- source_word: μετὰ χαρᾶς πνεύματος ἁγίου
  choice: với niềm vui đến từ Đức Thánh Linh
  rationale: Diễn đạt cách hiểu có khả năng nhất rằng Đức Thánh Linh là nguồn của niềm vui, trong khi chú thích bảo lưu độ mở của cấu trúc sở hữu cách.
theological_decisions:
- issue: Quan hệ sở hữu cách trong χαρᾶς πνεύματος ἁγίου
  choice: niềm vui đến từ Đức Thánh Linh
  alternative: niềm vui của Đức Thánh Linh; niềm vui do Đức Thánh Linh tạo nên
  rationale: Bối cảnh đối lập hoạn nạn với niềm vui cho thấy Đức Thánh Linh có lẽ là nguồn của niềm vui. Bản chính dùng cách diễn đạt tự nhiên này, còn chú thích bảo lưu các sắc thái ngữ pháp gần nhau.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu đạt số nhiều ὑμεῖς theo lối xưng hô tự nhiên; giữ hình ảnh noi gương và thuật ngữ “lời” của Phao-lô.
