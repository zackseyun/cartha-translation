revisions:
- from: trước mặt Đức Chúa Trời, là Cha chúng ta, chúng tôi luôn nhớ đến công việc xuất phát từ đức tin[a], sự lao nhọc bởi tình yêu thương, và lòng bền bỉ nhờ niềm hy vọng nơi Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si-a[b],
  to: trước mặt Đức Chúa Trời là Cha chúng ta, chúng tôi luôn nhớ đến công việc của đức tin[a], sự lao nhọc của tình yêu thương, và sự bền bỉ của niềm hy vọng đặt nơi Chúa chúng ta là Giê-su, Đấng Mê-si-a[b],
  rationale: Bản sửa dùng “của” trong ba vế để duy trì cấu trúc tu từ và không áp đặt quá mức một cách hiểu về các sở hữu cách. Cụm “niềm hy vọng đặt nơi” làm rõ quan hệ với Chúa Giê-su, Đấng Mê-si-a theo cách tự nhiên trong tiếng Việt. Tên được chuẩn hóa thành “Giê-su”; các chú thích và dấu neo được giữ nguyên, với chú thích b chỉnh dạng từ Hy Lạp.
