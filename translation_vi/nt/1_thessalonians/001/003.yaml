id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: vi
  text: trước mặt Đức Chúa Trời là Cha chúng ta, chúng tôi luôn nhớ đến công việc của đức tin[a], sự lao nhọc của tình yêu thương, và sự bền bỉ của niềm hy vọng đặt nơi Chúa chúng ta là Giê-su, Đấng Mê-si-a[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đức tin” cũng có thể được hiểu là “sự trung tín” hoặc “lòng tin cậy”.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: Χριστός; cũng thường được dịch là “Đấng Christ”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: chúng tôi luôn nhớ đến
  rationale: Phân từ hiện tại tiếp nối ý của câu trước; “luôn nhớ đến” diễn đạt tự nhiên tính liên tục.
- source_word: ἔργου τῆς πίστεως
  choice: công việc xuất phát từ đức tin
  rationale: Làm rõ quan hệ sở hữu cách nhiều khả năng chỉ nguồn phát sinh, đồng thời không làm mất hai danh từ của nguyên văn.
- source_word: κόπου τῆς ἀγάπης
  choice: sự lao nhọc bởi tình yêu thương
  rationale: “Lao nhọc” giữ được sắc thái nỗ lực gian khó của κόπος; “bởi” biểu thị tình yêu là động lực hoặc nguồn phát sinh.
- source_word: ὑπομονῆς τῆς ἐλπίδος
  choice: lòng bền bỉ nhờ niềm hy vọng
  rationale: ὑπομονή nói đến sự kiên trì chịu đựng; “nhờ” diễn đạt niềm hy vọng là nền tảng tạo nên sự bền bỉ.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nơi Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Cụm sở hữu cách gắn gần nhất với “niềm hy vọng” và được diễn đạt như đối tượng của hy vọng; Χριστός được dịch theo chức danh là “Đấng Mê-si-a”.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: trước mặt Đức Chúa Trời, là Cha chúng ta
  rationale: Giữ nghĩa hiện diện trước Đức Chúa Trời và thể hiện quan hệ đồng vị giữa “Đức Chúa Trời” với “Cha chúng ta”.
theological_decisions:
- issue: Ý nghĩa của πίστις trong τῆς πίστεως
  choice: đức tin
  alternative: sự trung tín; lòng tin cậy
  rationale: “Đức tin” là nghĩa phù hợp nhất trong bộ ba đức tin, tình yêu và hy vọng, nhưng từ Hy Lạp cũng có thể mang sắc thái “sự trung tín” hoặc “lòng tin cậy”; các khả năng ấy được giữ trong chú thích.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός mang chức năng tước hiệu và tương ứng với “Đấng Mê-si-a”; dạng quen thuộc “Đấng Christ” được nêu trong chú thích.
- issue: Quan hệ của các sở hữu cách πίστεως, ἀγάπης và ἐλπίδος
  choice: xuất phát từ / bởi / nhờ
  alternative: công việc của đức tin, sự lao nhọc của tình yêu thương, lòng bền bỉ của niềm hy vọng
  rationale: Các sở hữu cách có thể chỉ phẩm chất hoặc nguồn phát sinh. Bản dịch chính diễn đạt quan hệ tự nhiên nhất trong tiếng Việt mà không áp đặt một hệ thống thần học riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc bộ ba “đức tin—tình yêu thương—niềm hy vọng”; đưa cụm “trước mặt Đức Chúa Trời” lên đầu để câu tiếng Việt rõ quan hệ hơn. Dấu phẩy cuối phản ánh đây là phần tiếp diễn từ câu trước trong nguyên văn.
