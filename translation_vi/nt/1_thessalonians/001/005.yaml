revisions:
- from: vì Tin Mừng của chúng tôi đã đến với anh chị em không chỉ bằng lời nói, mà còn bằng quyền năng, bằng Đức Thánh Linh và với niềm xác tín sâu sắc[a]. Chính anh chị em biết chúng tôi đã sống giữa anh chị em như thế nào vì lợi ích của anh chị em.[b]
  to: vì Tin Mừng của chúng tôi đã đến với anh chị em không chỉ bằng lời nói, mà còn bằng quyền năng, bằng Đức Thánh Linh và với sự xác tín mạnh mẽ[a], như anh chị em biết chúng tôi đã tỏ ra là những người thế nào giữa anh chị em, vì anh chị em.[b]
  rationale: Sửa cụm về các nhà truyền giáo để phản ánh οἷοι ἐγενήθημεν như một nhận định về loại người/phẩm chất họ đã tỏ ra là, thay vì chỉ về lối sống. Sửa δι’ ὑμᾶς thành “vì anh chị em” để tránh giải thích quá mức. Chú thích b được cập nhật cho khớp với bản văn chính; các mốc chú thích vẫn được neo đúng chỗ.
