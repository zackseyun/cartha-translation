id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: vi
  text: vì Tin Mừng của chúng tôi đã đến với anh chị em không chỉ bằng lời nói, mà còn bằng quyền năng, bằng Đức Thánh Linh và với sự xác tín mạnh mẽ[a], như anh chị em biết chúng tôi đã tỏ ra là những người thế nào giữa anh chị em, vì anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với sự bảo đảm trọn vẹn” hoặc “với sự chắc chắn lớn lao.”'
    reason: lexical_alternative
  - marker: b
    text: “Vì anh chị em” cũng có thể hiểu là “vì lợi ích của anh chị em” hoặc “do anh chị em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: Tin Mừng
  rationale: Cách gọi quen thuộc, trang trọng và tự nhiên trong tiếng Việt cho sứ điệp cứu rỗi được các sứ đồ rao truyền.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: đã đến với anh chị em
  rationale: Diễn đạt thành ngữ về việc Tin Mừng đến và tác động giữa người Tê-sa-lô-ni-ca, thay vì dịch sát chữ một cách gượng gạo.
- source_word: ἐν λόγῳ μόνον
  choice: không chỉ bằng lời nói
  rationale: Giữ rõ sự tương phản giữa lời rao giảng đơn thuần và quyền năng đi kèm; “bằng” tự nhiên hơn “trong” trong tiếng Việt.
- source_word: ἐν δυνάμει
  choice: bằng quyền năng
  rationale: Bảo toàn ý về năng lực hữu hiệu đi kèm sự rao giảng và giữ cấu trúc song song với cụm kế tiếp.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: bằng Đức Thánh Linh
  rationale: Chỉ Đức Thánh Linh chứ không phải tinh thần con người hay một bầu không khí thiêng liêng.
- source_word: πληροφορίᾳ πολλῇ
  choice: với niềm xác tín sâu sắc
  rationale: Diễn đạt tự nhiên mức độ đầy trọn, mạnh mẽ của sự chắc chắn/xác tín, đồng thời không chỉ rõ đó là sự xác tín của người giảng hay người nghe.
- source_word: καθὼς οἴδατε
  choice: Chính anh chị em biết
  rationale: Nêu bật lời xác nhận dựa trên hiểu biết trực tiếp của độc giả, phù hợp lực nhấn của καθώς trong ngữ cảnh.
- source_word: οἷοι ἐγενήθημεν
  choice: chúng tôi đã sống ... như thế nào
  rationale: Trong ngữ cảnh, cụm này nói đến phẩm chất và cách ứng xử mà các nhà truyền giáo thể hiện; cách diễn đạt này tự nhiên hơn “đã trở nên loại người nào” trong tiếng Việt.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Diễn tả sự hiện diện và cách cư xử trong cộng đồng tín hữu.
- source_word: δι’ ὑμᾶς
  choice: vì lợi ích của anh chị em
  rationale: Làm rõ nghĩa mục đích/lợi ích phù hợp ngữ cảnh, trong khi ghi nhận nghĩa nhân quả khả hữu ở chú thích.
theological_decisions:
- issue: Đối tượng của πνεύματι ἁγίῳ
  choice: Đức Thánh Linh
  alternative: một linh thánh hoặc sức mạnh thiêng liêng
  rationale: Cách dùng của Phao-lô và sự tương phản với lời nói đơn thuần cho thấy tác nhân thần linh là Đức Thánh Linh.
- issue: Chủ thể của πληροφορίᾳ πολλῇ
  choice: Giữ cụm “với niềm xác tín sâu sắc” mà không xác định chủ thể
  alternative: sự xác tín của người rao giảng; sự xác tín của người nghe; tính thuyết phục mạnh mẽ của việc rao giảng
  rationale: Nguyên văn không nói rõ sự xác tín thuộc về ai; bản dịch tránh thu hẹp sự mơ hồ chân thực này.
- issue: Sắc thái của οἷοι ἐγενήθημεν
  choice: Diễn đạt phẩm chất qua cách sống giữa cộng đồng
  alternative: chúng tôi đã chứng tỏ mình là những người thế nào; chúng tôi đã trở nên thế nào
  rationale: γίνομαι ở đây có thể gợi cả việc trở nên lẫn chứng tỏ mình; cách dịch theo lối ứng xử truyền đạt đúng trọng tâm ngữ cảnh mà không áp đặt một tuyên bố thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để xưng hô với toàn thể hội thánh; giữ nhịp ba vế “bằng quyền năng, bằng Đức Thánh Linh và với niềm xác tín sâu sắc.”
