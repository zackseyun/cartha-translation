    rationale: Tiếng Việt thường cần động từ hoặc cấu trúc rõ hơn để diễn đạt hướng rời bỏ. “Đã từ bỏ các thần tượng để quay về với Đức Chúa Trời” tự nhiên hơn và vẫn bảo toàn ý chuyển hướng khỏi thần tượng đến Đức Chúa Trời.
