  terminology: “Đức Chúa Trời,” “các thần tượng,” và “phụng sự” phù hợp ngữ vực Kinh Thánh tiếng Việt và chuyển tải đúng ý của θεός, εἴδωλα, và δουλεύειν. “Hằng sống và chân thật” giữ đầy đủ sự tương phản với thần tượng. Ghi chú về cách dịch “được cải đạo” được bổ sung để phản ánh lựa chọn thay thế trong audit trail mà không áp đặt nó vào bản văn chính.
