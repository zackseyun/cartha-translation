source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: vi
  text: Vì chính họ kể lại việc chúng tôi đã đến với anh chị em như thế nào[a], và việc anh chị em đã từ bỏ các thần tượng để quay về với Đức Chúa Trời[b], để phụng sự Đức Chúa Trời hằng sống và chân thật[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chúng tôi đã có một cuộc đến với anh chị em như thế nào”; cách nói Hy Lạp chỉ tính chất và tác động của việc Phao-lô cùng các bạn đồng hành đến giữa họ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “anh chị em đã được cải đạo để đến với Đức Chúa Trời, từ bỏ các thần tượng.”'
    reason: alternative_reading
  - marker: c
    text: Cụm từ “Đức Chúa Trời hằng sống và chân thật” tương phản Ngài với các thần tượng không có sự sống; xem Giê-rê-mi 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ γὰρ
  choice: Vì chính họ
  rationale: “Vì” giữ liên kết giải thích của γάρ với câu trước; “chính họ” bảo toàn sắc thái nhấn mạnh của αὐτοί.
- source_word: ἀπαγγέλλουσιν
  choice: thuật lại
  rationale: Diễn đạt tự nhiên hành động truyền kể một tin tức đang được nhiều người nói đến, đồng thời phù hợp với thì hiện tại Hy Lạp.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: chúng tôi đã đến với anh chị em như thế nào
  rationale: Giữ ý về tính chất và kết quả của lần Phao-lô cùng các bạn đồng hành đến, tự nhiên hơn cách dịch sát từng chữ “chúng tôi đã có một sự đi vào như thế nào đối với anh chị em”.
- source_word: πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: anh chị em đã từ các thần tượng quay về với Đức Chúa Trời
  rationale: Bảo toàn hình ảnh quay hướng, đồng thời thể hiện cả điểm rời khỏi là các thần tượng và đích hướng đến là Đức Chúa Trời.
- source_word: εἰδώλων
  choice: các thần tượng
  rationale: Là cách gọi hiện đại, rõ nghĩa đối với những hình tượng hay thần giả được thờ phượng; tránh từ “hình tượng” có thể chỉ đơn thuần một hình ảnh.
- source_word: δουλεύειν
  choice: để phụng sự
  rationale: Trong ngữ cảnh về lòng trung thành tôn giáo, “phụng sự” chuyển tải sự phục vụ tận hiến mà không làm sắc thái nô lệ trở nên quá mạnh hoặc thu hẹp nghĩa thành nghi lễ thờ phượng.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: Đức Chúa Trời hằng sống và chân thật
  rationale: Giữ cả hai phẩm tính, nhấn mạnh sự tương phản với các thần tượng không có sự sống và không phải thần thật.
theological_decisions:
- issue: Sắc thái chuyển đổi trong ἐπεστρέψατε
  choice: “đã từ các thần tượng quay về với Đức Chúa Trời”
  alternative: “đã được cải đạo, từ bỏ các thần tượng để trở về với Đức Chúa Trời”
  rationale: Cách dịch chủ động bảo toàn hình ảnh và hình thái của động từ Hy Lạp, không tự ý giải quyết vấn đề thần học về tác nhân tối hậu của sự quy đạo.
- issue: Sắc thái của δουλεύειν đối với Đức Chúa Trời
  choice: “phụng sự”
  alternative: “làm nô lệ cho” hoặc “thờ phượng”
  rationale: “Phụng sự” thể hiện sự tận hiến và trung thành; “làm nô lệ” dễ nhấn quá mạnh một nét nghĩa, còn “thờ phượng” có thể thu hẹp phạm vi phục vụ.
- issue: Sự tương phản trong θεῷ ζῶντι καὶ ἀληθινῷ
  choice: “Đức Chúa Trời hằng sống và chân thật”
  alternative: “một vị thần sống và thật”
  rationale: Cách dùng danh xưng xác định phù hợp với đối tượng duy nhất mà người tin quay về phụng sự, đồng thời giữ nguyên sự tương phản với các thần tượng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; “Đức Chúa Trời” làm danh xưng quen thuộc trong tiếng Việt. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang câu 10.
