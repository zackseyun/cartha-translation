revisions:
- from: Vì chính họ thuật lại về chúng tôi rằng chúng tôi đã đến với anh chị em như thế nào[a], và anh chị em đã từ các thần tượng quay về với Đức Chúa Trời để phụng sự Đức Chúa Trời hằng sống và chân thật[b],
  to: Vì chính họ kể lại việc chúng tôi đã đến với anh chị em như thế nào[a], và việc anh chị em đã từ bỏ các thần tượng để quay về với Đức Chúa Trời[b], để phụng sự Đức Chúa Trời hằng sống và chân thật[c],
  rationale: Sửa cấu trúc diễn đạt sự từ bỏ thần tượng và quay về với Đức Chúa Trời cho tự nhiên hơn trong tiếng Việt, đồng thời giữ rõ cả hai chiều của πρὸς… ἀπό. Cấu trúc “kể lại việc… và việc…” phản ánh hai bổ ngữ của ἀπαγγέλλουσιν một cách mạch lạc. Bổ sung chú thích lựa chọn về “được cải đạo” để bảo toàn audit trail, và tách chú thích đối chiếu về “Đức Chúa Trời hằng sống và chân thật” đúng tại cụm từ được chú giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:20Z'
