id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: vi
  text: 'Phao-lô, Si-lu-a-nô và Ti-mô-thê, gửi hội thánh[a] của người Tê-sa-lô-ni-ca ở trong Đức Chúa Trời là Cha và Chúa Giê-su, Đấng Mê-si-a[b]: Nguyện ân điển và bình an đến với anh chị em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hội chúng” hoặc “cộng đồng”; từ Hy Lạp ἐκκλησία chỉ cộng đồng được quy tụ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Đấng Christ.” Tước hiệu Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tên riêng Hy Lạp Παῦλος.
- source_word: Σιλουανὸς
  choice: Si-lu-a-nô
  rationale: Phiên âm trực tiếp dạng Hy Lạp Σιλουανός, thay vì dùng tên tương đương quen thuộc hơn là Si-la, vốn phản ánh một dạng Hy Lạp khác.
- source_word: Τιμόθεος
  choice: Ti-mô-thê
  rationale: Dạng phiên âm tiếng Việt quen thuộc của Τιμόθεος.
- source_word: ἐκκλησίᾳ
  choice: hội thánh
  rationale: Cách gọi tự nhiên và trang trọng trong tiếng Việt đối với cộng đồng tín hữu; chú thích giữ lại nghĩa khả dĩ là cộng đồng hay hội chúng tụ họp.
- source_word: Θεσσαλονικέων
  choice: của người Tê-sa-lô-ni-ca
  rationale: Danh từ sở hữu số nhiều chỉ những người thuộc thành Tê-sa-lô-ni-ca.
- source_word: ἐν
  choice: ở trong
  rationale: Giữ hình ảnh quan hệ hoặc phạm vi được diễn đạt bằng ἐν, không diễn giải hẹp thành 'thuộc về'.
- source_word: θεῷ πατρὶ
  choice: Đức Chúa Trời là Cha
  rationale: Phản ánh cấu trúc đồng vị của nguyên văn và không thêm đại từ 'chúng ta', vốn không có trong tiếng Hy Lạp.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Cách dịch tự nhiên, truyền thống và phù hợp ngữ cảnh Tân Ước của κύριος.
- source_word: Ἰησοῦ Χριστῷ
  choice: Giê-su, Đấng Mê-si-a
  rationale: Dịch Χριστός theo ý nghĩa tước hiệu là Đấng Mê-si-a, đồng thời dùng dấu phẩy để câu tiếng Việt rõ và tự nhiên.
- source_word: χάρις
  choice: ân điển
  rationale: Thuật ngữ tự nhiên trong văn phong Cơ Đốc tiếng Việt, giữ sắc thái thần học và chức năng chào thư của χάρις.
- source_word: εἰρήνη
  choice: bình an
  rationale: Cách dịch chuẩn của εἰρήνη, giữ cả ý nghĩa thông thường lẫn âm hưởng lời chào Do Thái.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Nguyện ân điển và bình an đến với anh chị em
  rationale: Diễn đạt lời chúc một cách tự nhiên trong tiếng Việt; 'anh chị em' bao quát cộng đồng người nhận thư mà không hàm ý chỉ nam giới.
theological_decisions:
- issue: Cách dịch Χριστός trong lời chào
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Christ
  rationale: Trong ngữ cảnh này, Χριστός vẫn có thể được nghe như một tước hiệu. Dịch nghĩa giúp độc giả nhận ra nội dung 'Đấng được xức dầu' thay vì chỉ xem đây là một phần của tên riêng.
- issue: Quan hệ được diễn đạt bởi ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ
  choice: hội thánh được mô tả là 'ở trong' Đức Chúa Trời là Cha và Chúa Giê-su, Đấng Mê-si-a
  alternative: hội thánh thuộc về Đức Chúa Trời là Cha và Chúa Giê-su, Đấng Mê-si-a
  rationale: Giữ 'ở trong' để bảo tồn độ mở thần học của ἐν về phạm vi, sự liên hiệp hoặc mối quan hệ, thay vì thu hẹp thành ý sở hữu.
- issue: Cách xưng hô với toàn thể người nhận
  choice: anh chị em
  alternative: anh em; các bạn
  rationale: Đại từ Hy Lạp ὑμῖν chỉ số nhiều và không xác định giới; 'anh chị em' tự nhiên trong cộng đồng đức tin và biểu đạt rõ tính bao quát.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tên riêng được phiên âm nhất quán; cấu trúc lời chào được điều chỉnh vừa đủ để tự nhiên trong tiếng Việt, trong khi cụm 'ở trong' được giữ nhằm bảo tồn sắc thái và độ mở của nguyên văn.
