source:
  edition: SBLGNT
  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: vi
  text: đến nỗi anh em trở thành tấm gương[a] cho tất cả những người tin tại Ma-xê-đô-ni-a và A-chai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là «khuôn mẫu» hoặc «mẫu mực».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: đến nỗi
  rationale: Diễn tả kết quả phát sinh từ việc người Tê-sa-lô-ni-ca tiếp nhận lời và noi theo gương được nói ở câu trước; cách nói này tự nhiên trong tiếng Việt và giữ sắc thái kết quả.
- source_word: γενέσθαι
  choice: trở thành
  rationale: Động từ nguyên mẫu aorist trong kết cấu với ὥστε diễn tả kết quả; tiếng Việt dùng mệnh đề hữu hạn «anh em trở thành» một cách tự nhiên.
- source_word: ὑμᾶς
  choice: anh em
  rationale: Đại từ số nhiều chỉ cộng đồng tín hữu được Phao-lô ngỏ lời; «anh em» là lối xưng hô trang trọng, tự nhiên trong văn thư Tân Ước tiếng Việt.
- source_word: τύπον
  choice: tấm gương
  rationale: Trong ngữ cảnh này, từ này chỉ một mẫu mực để người khác noi theo. «Tấm gương» rõ nghĩa và tự nhiên; «khuôn mẫu» vẫn là khả năng từ vựng đáng ghi chú.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: cho tất cả những người tin Chúa
  rationale: Phân từ được dùng như danh từ, chỉ toàn thể những người có đức tin. Bổ sung «Chúa» làm đối tượng hàm ẩn của hành động tin, phù hợp ngữ cảnh Cơ Đốc và tự nhiên trong tiếng Việt, nhưng không giới hạn nhóm người được nói đến.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: tại Ma-xê-đô-ni-a
  rationale: Cụm từ chỉ địa điểm, gọi tên vùng Ma-xê-đô-ni-a.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: và A-chai
  rationale: Nối vùng địa lý thứ hai; trong tiếng Việt, giới từ «tại» có thể chi phối cả hai địa danh mà vẫn giữ quan hệ song song của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng «anh em» để thể hiện đại từ số nhiều trong lời ngỏ với cộng đồng; phiên âm các địa danh theo cách quen thuộc trong Kinh Thánh tiếng Việt. Dấu chân chú [a] xuất hiện ngay sau cụm từ mà chú thích có liên quan.
