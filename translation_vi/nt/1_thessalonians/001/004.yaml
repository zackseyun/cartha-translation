    rationale: Chú thích b giải thích ἐκλογή, nhưng hiện được neo ở “anh chị em” thay vì tại “đã chọn”. Neo tại động từ chọn sẽ liên kết chú thích trực tiếp với từ/cụm từ được giải thích.
  - severity: low
    issue: Cách nêu phương án danh từ trong chú thích b có thể mơ hồ
    rationale: “Sự tuyển chọn anh chị em” có thể bị đọc là hành động anh chị em tuyển chọn. “Việc Đức Chúa Trời chọn anh chị em” làm rõ quan hệ mà vẫn chỉ là một phương án diễn đạt của danh từ Hy Lạp.
