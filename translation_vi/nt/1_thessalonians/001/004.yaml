  rationale: Sửa trật tự câu để “biết rằng” trực tiếp dẫn vào nội dung được biết, bỏ “thưa” vì không phù hợp trong mệnh đề trần thuật tiếng Việt, và chuyển vị trí các thành phần để lời gọi “anh chị em” cùng đặc tính “được Ngài yêu thương” vẫn được giữ. Dịch động từ “đã chọn” vẫn phản ánh ἐκλογή như bản nháp, còn chú thích bảo lưu hình thức danh từ và tính không xác định về các hệ thống thần học. Dấu phẩy cuối được giữ vì câu tiếp tục sang câu sau.
