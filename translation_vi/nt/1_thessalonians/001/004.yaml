review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính của εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ θεοῦ, τὴν ἐκλογὴν ὑμῶν: Phao-lô biết Đức Chúa Trời đã chọn các tín hữu Thessalonica và họ là những người được Ngài yêu thương. Tuy nhiên, trật tự “thưa anh chị em ... rằng” làm quan hệ cú pháp giữa “biết” và nội dung được biết không rõ, đồng thời neo chú thích về ἐκλογή không nằm tại cách diễn đạt hành động chọn lựa.'
  naturalness: “Thưa anh chị em ... rằng” không tự nhiên trong một mệnh đề trần thuật tiếng Việt; “thưa” thường mở đầu một lời trực tiếp. Đưa mệnh đề nội dung lên ngay sau “biết rằng” tạo câu văn hiện đại, rõ ràng, vẫn thích hợp với việc câu tiếp tục sang câu 5.
  terminology: Giữ “Đức Chúa Trời”, “anh chị em”, và “được ... yêu thương” là trang trọng, tự nhiên. “Đã chọn” diễn đạt rõ danh từ ἐκλογή mà không áp đặt một hệ thống thần học; chú thích nên nêu lựa chọn danh từ bằng một cách diễn đạt không mơ hồ là hành động của Đức Chúa Trời.
  issues:
  - severity: medium
    issue: Cú pháp của mệnh đề “rằng” sau cụm xưng hô
    rationale: Trong “Vì chúng tôi biết, thưa anh chị em ... , rằng Ngài đã chọn...”, “thưa anh chị em” chen giữa động từ “biết” và mệnh đề “rằng”, khiến câu thiếu tự nhiên và dễ gây ngập ngừng. Bản Hy Lạp có lời gọi ở dạng hô cách, nhưng tiếng Việt không cần dùng “thưa” trong cấu trúc này.
  - severity: low
