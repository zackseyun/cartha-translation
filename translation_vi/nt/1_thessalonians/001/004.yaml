lexical_decisions:
- source_word: εἰδότες
  choice: Vì chúng tôi biết
  rationale: Phân từ mang sắc thái giải thích và tiếp nối câu trước; chuyển thành mệnh đề hữu hạn giúp tiếng Việt tự nhiên mà vẫn giữ mạch lập luận của Phao-lô.
- source_word: ἀδελφοὶ
  choice: anh chị em
  rationale: Danh từ Hy Lạp ở giống đực số nhiều, nhưng trong cách xưng hô của Phao-lô thường chỉ toàn thể cộng đồng tín hữu. “Anh chị em” truyền đạt đúng phạm vi quy chiếu trong tiếng Việt hiện đại.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: được Đức Chúa Trời yêu thương
  rationale: Giữ thể bị động và trạng thái bền vững hàm chứa trong phân từ hoàn thành, đồng thời dùng lối diễn đạt tự nhiên, trang trọng.
- source_word: τὴν ἐκλογὴν ὑμῶν
  choice: rằng Ngài đã chọn anh chị em
  rationale: Tiếng Việt tự nhiên hơn khi diễn đạt danh từ ἐκλογή bằng mệnh đề “đã chọn”; chủ thể Đức Chúa Trời được làm rõ từ cụm ngay trước đó, nhưng không bổ sung cách giải thích về cơ chế hay phạm vi của sự chọn lựa.
theological_decisions:
- issue: Cách diễn đạt ἐκλογή trong bối cảnh có tranh luận giáo lý
  choice: Ngài đã chọn anh chị em
  alternative: sự tuyển chọn anh chị em
  rationale: Cách dịch theo động từ rõ nghĩa và tự nhiên đối với độc giả phổ thông, vẫn khẳng định hành động chọn lựa của Đức Chúa Trời nhưng không giải quyết thay văn bản những tranh luận thần học rộng hơn.
- issue: Phạm vi của ἀδελφοί
  choice: anh chị em
  alternative: anh em
  rationale: Trong thư Phao-lô, lời gọi này hướng đến cả hội chúng. Tiếng Việt dùng “anh chị em” để biểu đạt tự nhiên lực bao hàm ấy; chú thích vẫn nêu rõ hình thức nguyên ngữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán cho θεός; chọn lối xưng hô “anh chị em” phù hợp văn phong thư tín và phạm vi cả hội chúng. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế.
