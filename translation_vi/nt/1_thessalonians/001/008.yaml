  - severity: low
    issue: 'Trật tự mở câu hơi gượng: “Vì từ anh chị em, lời của Chúa...”'
    rationale: Đưa cụm nguồn phát sau động từ—“lời của Chúa đã vang ra từ anh chị em”—tự nhiên hơn trong tiếng Việt, vẫn bảo toàn sự nhấn mạnh của nguyên ngữ.
