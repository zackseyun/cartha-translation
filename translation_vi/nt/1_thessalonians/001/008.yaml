  to: Vì lời của Chúa đã vang ra từ anh chị em, không những trong miền Ma-xê-đô-ni-a và A-chai, mà đức tin của anh chị em hướng về Đức Chúa Trời cũng đã lan truyền khắp mọi nơi, đến nỗi chúng tôi không cần phải nói gì.
