id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: vi
  text: Vì lời của Chúa đã vang ra từ anh chị em, không những trong miền Ma-xê-đô-ni-a và A-chai, mà đức tin của anh chị em hướng về Đức Chúa Trời cũng đã lan truyền khắp mọi nơi, đến nỗi chúng tôi không cần phải nói gì.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήχηται
  choice: đã vang xa
  rationale: Giữ hình ảnh âm thanh vang ra từ một nguồn, đồng thời diễn đạt kết quả hiện còn của thì hoàn thành; tự nhiên hơn cách dịch quá sát như “đã phát tiếng ra”.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: lời của Chúa
  rationale: Giữ cách diễn đạt trang trọng, quen thuộc của Phao-lô và không thu hẹp quan hệ sở hữu/chủ đề trong sở hữu cách Hy Lạp.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: miền Ma-xê-đô-ni-a và A-chai
  rationale: Phiên âm các địa danh theo cách dễ đọc trong tiếng Việt; thêm “miền” để làm rõ đây là các vùng địa lý.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: mà ... khắp nơi
  rationale: “Khắp nơi” là cách nói tiếng Việt tự nhiên, truyền đạt đầy đủ ý phân bố ở mọi nơi của cụm Hy Lạp.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: đức tin của anh chị em hướng về Đức Chúa Trời
  rationale: “Đức tin” phù hợp ngữ cảnh đáp ứng tin cậy; “hướng về” bảo tồn sắc thái định hướng của πρὸς thay vì diễn giải đơn thuần là “nơi” Đức Chúa Trời.
- source_word: ἐξελήλυθεν
  choice: đã lan truyền
  rationale: Diễn đạt tự nhiên việc tin tức về đức tin đi ra và được biết rộng rãi, đồng thời vẫn giữ ý chuyển động của động từ.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: đến nỗi chúng tôi không cần
  rationale: Thể hiện tự nhiên mệnh đề kết quả do ὥστε dẫn nhập.
- source_word: λαλεῖν τι
  choice: phải nói gì thêm
  rationale: “Nói gì thêm” là tiếng Việt tự nhiên trong ngữ cảnh Phao-lô không cần bổ sung lời chứng nào; “thêm” làm rõ hàm ý ngữ cảnh mà không đổi ý chính.
theological_decisions:
- issue: Nghĩa của πίστις
  choice: đức tin
  alternative: sự trung tín; lòng tin cậy
  rationale: Trong ngữ cảnh này, từ ngữ chỉ sự đáp ứng tin cậy của tín hữu Tê-sa-lô-ni-ca đối với Đức Chúa Trời hơn là phẩm chất đáng tin của họ; “đức tin” cũng giữ thuật ngữ thần học quen thuộc.
- issue: Quan hệ trong cụm τοῦ κυρίου
  choice: lời của Chúa
  alternative: sứ điệp về Chúa
  rationale: Cách dịch bằng “của” giữ mở khả năng đây là lời đến từ Chúa và/hoặc lời liên quan đến Chúa, thay vì quyết định dứt khoát một quan hệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῶν nhằm nói trực tiếp với toàn thể cộng đồng; dùng “Đức Chúa Trời” cho θεός và “Chúa” cho κύριος. Không cần chú thích vì cụm “hướng về Đức Chúa Trời” đã giữ được nét nghĩa đáng chú ý của πρὸς ngay trong chính văn.
