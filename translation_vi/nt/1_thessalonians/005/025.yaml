  text: Ἀδελφοί, ⸀προσεύχεσθε περὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: vi
  text: Thưa anh em[a], hãy cầu nguyện cho chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa anh chị em,” vì lời xưng hô này có lẽ dành cho toàn thể hội chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Thưa anh em
  rationale: Danh từ số nhiều ở hô cách, dùng để trực tiếp gọi cộng đồng tín hữu. “Thưa anh em” tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ hình thức giống đực của tiếng Hy Lạp; chú thích nêu rõ cách gọi này có thể bao gồm cả nam lẫn nữ.
- source_word: προσεύχεσθε
  choice: hãy cầu nguyện
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều. “Hãy cầu nguyện” diễn đạt tự nhiên mệnh lệnh; không thêm “tiếp tục” vì sắc thái tiếp diễn không nhất thiết được nhấn mạnh trong lời kêu gọi ngắn này.
- source_word: περὶ ἡμῶν
  choice: cho chúng tôi
  rationale: περί đi với sở hữu cách ở đây diễn tả đối tượng được cầu thay. “Cho chúng tôi” là cách nói tiếng Việt tự nhiên, còn “chúng tôi” giữ nguyên số nhiều, chỉ Phao-lô và các cộng sự mà không xác định quá mức.
theological_decisions:
- issue: Cách xưng hô Ἀδελφοί có hình thức giống đực nhưng có thể chỉ toàn thể hội chúng gồm cả nam và nữ
  choice: Thưa anh em
  alternative: Thưa anh chị em
  rationale: Bản chính giữ hình thức giống đực của từ Hy Lạp, còn chú thích bảo tồn khả năng quy chiếu bao gồm cả nam và nữ trong hội chúng, tránh vừa thu hẹp đối tượng vừa âm thầm giải quyết nét không tương ứng về giới giữa hai ngôn ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thưa” đánh dấu lời gọi trực tiếp một cách tự nhiên; “hãy” thể hiện mệnh lệnh mà không làm câu trở nên gay gắt.
