id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: vi
  text: Vì Đức Chúa Trời không định cho chúng ta chịu cơn thịnh nộ, nhưng để chúng ta nhận được sự cứu rỗi[a] qua Đức Chúa Giê-su, Chúa chúng ta, là Đấng Mê-si-a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “để sở hữu sự cứu rỗi,” “để đạt được sự cứu rỗi,” hoặc có thể là “để được bảo toàn cho sự cứu rỗi.” Danh từ Hy Lạp περιποίησις có phạm vi nghĩa rộng hơn cách dịch “nhận được.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “Đấng Christ.” Danh xưng Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu lý do cho lời khuyên ở câu trước; “Vì” giữ rõ quan hệ nguyên nhân trong tiếng Việt.
- source_word: ἔθετο ... εἰς
  choice: định ... phải chịu / để được hưởng
  rationale: τίθημι với εἰς chỉ sự ấn định hướng đến một kết cuộc. “Định” diễn đạt ý ấy mà không áp đặt sắc thái tiền định mạnh hơn nguyên văn.
- source_word: ὀργήν
  choice: cơn thịnh nộ
  rationale: Trong ngữ cảnh cánh chung của Phao-lô, từ này chỉ cơn thịnh nộ, hàm ý cơn thịnh nộ của Đức Chúa Trời; không đổi thành “sự phán xét,” vốn mang tính diễn giải.
- source_word: περιποίησιν σωτηρίας
  choice: được hưởng sự cứu rỗi
  rationale: περιποίησις có thể chỉ sự đạt được, sở hữu hoặc bảo toàn. “Được hưởng sự cứu rỗi” tự nhiên trong tiếng Việt, phù hợp với kết cuộc đối lập với cơn thịnh nộ, đồng thời tránh sắc thái con người tự mình giành lấy sự cứu rỗi.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: qua Chúa chúng ta là Đức Chúa Jêsus, Đấng Mê-si
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân nên dịch là “qua.” Χριστός được diễn đạt theo nghĩa tước hiệu là “Đấng Mê-si,” còn cấu trúc đồng vị được chuyển tự nhiên sang tiếng Việt.
theological_decisions:
- issue: Mức độ tiền định trong ἔθετο
  choice: không định chúng ta phải chịu cơn thịnh nộ
  alternative: không tiền định chúng ta cho cơn thịnh nộ
  rationale: “Định” giữ lời khẳng định về ý định hay sự ấn định của Đức Chúa Trời nhưng không đưa vào câu một hệ thống thần học cụ thể mà động từ không tự nó đòi hỏi.
- issue: Phạm vi nghĩa của περιποίησις
  choice: để được hưởng sự cứu rỗi
  alternative: để đạt được sự cứu rỗi; để sở hữu sự cứu rỗi; để được bảo toàn cho sự cứu rỗi
  rationale: Cách dịch chính phù hợp với thế đối lập giữa hai kết cuộc, còn chú thích bảo lưu độ rộng từ vựng và sự mơ hồ thật của danh từ Hy Lạp.
- issue: Χριστός là tước hiệu hay dạng tên gọi truyền thống
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Sau tên Jêsus, Χριστός vẫn mang nội dung tước hiệu. “Đấng Mê-si” làm rõ ý nghĩa ấy; dạng truyền thống được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời,” “Đức Chúa Jêsus” theo lối gọi Tin Lành Việt ngữ quen thuộc; giữ “cơn thịnh nộ” thay vì diễn giải thành “sự phán xét.”
