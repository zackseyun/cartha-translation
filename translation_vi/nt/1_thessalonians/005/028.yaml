  text: ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/028.yaml
  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: vi
  text: Nguyện ân điển của Chúa chúng ta là Đức Giê-su Ki-tô ở cùng anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ki-tô” nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.
    reason: Làm rõ ý nghĩa tước hiệu Χριστός mà không thay đổi cách gọi quen thuộc trong chính văn.
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Trong lời chúc phước của Phao-lô, χάρις chỉ ân huệ nhưng không của Đức Chúa Trời và mang nội hàm thần học rõ rệt; “ân điển” là cách dịch quen thuộc, chính xác trong văn phong Kinh Thánh tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: κύριος ở đây là tước hiệu của Đức Giê-su; “Chúa” vừa tự nhiên vừa giữ được trọng lượng thần học của công thức này.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su Ki-tô
  rationale: Dùng hình thức tên gọi đã ổn định trong tiếng Việt. “Ki-tô” bảo tồn tước hiệu Χριστός trong công thức quen thuộc mà không biến nó thành một họ theo nghĩa hiện đại.
- source_word: μεθ’ ὑμῶν
  choice: ở cùng anh chị em
  rationale: Cụm giới từ có nghĩa đen là “cùng với anh chị em.” Tiếng Việt cần bổ sung “ở” và, trong công thức cầu chúc, “nguyện” để diễn đạt tự nhiên động từ được tỉnh lược trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong công thức kết thư của Phao-lô
  choice: Ki-tô
  alternative: Đấng Mê-si-a
  rationale: Χριστός vốn là tước hiệu tương đương “Đấng Mê-si-a,” nhưng trong cụm cố định “Đức Giê-su Ki-tô,” từ này đã trở thành cách gọi quen thuộc và trang trọng trong tiếng Việt. Lựa chọn này không phủ nhận ý nghĩa tước hiệu; chú thích nêu rõ nghĩa ấy.
- issue: Sắc thái của câu không có động từ
  choice: Dịch thành lời cầu chúc với “Nguyện ... ở cùng”
  alternative: “Ân điển ... ở cùng”
  rationale: Nguyên văn là một công thức chúc phước không có động từ. “Nguyện ... ở cùng” diễn đạt đúng lực cầu chúc trong tiếng Việt mà không khẳng định thêm nội dung vượt quá câu Hy Lạp.
- issue: Phạm vi của đại từ ὑμῶν
  choice: anh chị em
  alternative: các bạn; anh em
  rationale: ὑμῶν là đại từ số nhiều, không đánh dấu giới tính. “Anh chị em” truyền đạt tự nhiên rằng lời chúc hướng đến toàn thể cộng đồng tín hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su Ki-tô” theo quy ước tên gọi phổ biến; “anh chị em” diễn đạt đại từ số nhiều bao gồm cả cộng đồng. Dấu chú thích [a] xuất hiện đúng trong chính văn.
