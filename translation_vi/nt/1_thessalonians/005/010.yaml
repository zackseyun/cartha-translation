source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: vi
  text: Đấng đã chết vì chúng ta, để dù chúng ta thức hay ngủ[a], chúng ta cũng được sống cùng với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ này có lẽ có nghĩa là “dù chúng ta còn sống hay đã chết”. Cũng có thể dịch: “dù chúng ta tỉnh thức hay ngủ”, vì lời này có thể vọng lại lời khuyên phải tỉnh thức trong văn cảnh gần.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἀποθανόντος
  choice: Đấng đã chết
  rationale: Phân từ aorist bổ nghĩa cho Chúa Giê-su được nhắc ở câu trước. Cách diễn đạt bằng mệnh đề quan hệ ngầm với “Đấng” vừa tự nhiên trong tiếng Việt vừa giữ liên kết cú pháp với tiền ngữ.
- source_word: περὶ ἡμῶν
  choice: vì chúng ta
  rationale: Trong văn cảnh cứu chuộc, περί với sở hữu cách mang nghĩa “vì, cho, thay mặt cho”. “Vì chúng ta” tự nhiên và không áp đặt một mô hình thần học chi tiết hơn điều bản văn nói.
- source_word: ἵνα
  choice: để
  rationale: Giữ sắc thái mục đích hoặc kết quả dự định một cách gọn và tự nhiên.
- source_word: γρηγορῶμεν
  choice: chúng ta thức
  rationale: “Thức” duy trì hình ảnh đối lập với “ngủ” và vẫn để ngỏ cả nghĩa sống đối lập với chết lẫn âm hưởng tỉnh thức đạo đức trong văn cảnh gần.
- source_word: καθεύδωμεν
  choice: ngủ
  rationale: Giữ nguyên ẩn dụ của tiếng Hy Lạp; trong câu này nhiều khả năng chỉ việc đã chết, nhưng bản dịch không giải nghĩa ngay trong chính văn.
- source_word: ἅμα σὺν αὐτῷ
  choice: cùng sống với Ngài
  rationale: ἅμα và σύν cùng nhấn mạnh sự đồng hành, hiệp thông. “Cùng sống với Ngài” tránh lặp vụng “cùng... cùng với” mà vẫn truyền đạt trọn ý.
- source_word: ζήσωμεν
  choice: chúng ta cũng được ... sống
  rationale: Thể giả định dưới ἵνα diễn tả kết quả hoặc mục đích dự định. “Được... sống” phù hợp văn cảnh ân ban và tự nhiên trong tiếng Việt; “cũng” liên kết hai hoàn cảnh thức hoặc ngủ với cùng một kết quả.
theological_decisions:
- issue: Ý nghĩa của “thức hay ngủ”
  choice: Giữ nguyên hình ảnh, với nghĩa chính có lẽ là còn sống hay đã chết.
  alternative: Tỉnh thức về mặt đạo đức hay mê ngủ, bất cẩn về mặt thuộc linh.
  rationale: Cặp động từ có thể vọng lại lời khuyên tỉnh thức ở 5:6–7, nhưng mục đích “cùng sống với Ngài” và mạch tư tưởng từ 4:13–15 khiến cách hiểu còn sống hay đã chết phù hợp hơn. Chính văn giữ sự mơ hồ có thật; chú thích nêu cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Đấng Christ theo lối xưng hô kính trọng thông dụng; giữ cặp hình ảnh ngắn gọn “thức hay ngủ” nhằm bảo tồn sự đa nghĩa của nguyên văn.
