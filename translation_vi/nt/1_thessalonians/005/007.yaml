  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: vi
  text: Vì người ngủ thì ngủ vào ban đêm, và người say rượu thì say rượu vào ban đêm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên do cho lời khuyên ở câu trước và nối mạch lập luận một cách tự nhiên trong tiếng Việt.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: những người ngủ thì ngủ
  rationale: Dịch phân từ có mạo từ theo nghĩa khái quát và lặp lại động từ để bảo toàn cấu trúc song song cùng hình ảnh nguyên văn.
- source_word: νυκτός
  choice: ban đêm
  rationale: Sở hữu cách được dùng theo chức năng trạng từ chỉ thời gian; “ban đêm” là cách diễn đạt tự nhiên, ngắn gọn.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: những người say rượu thì say
  rationale: “Say rượu” diễn đạt rõ tình trạng say do chất uống có cồn; động từ “say” được lặp lại để giữ phép song song tu từ của nguyên văn.
- source_word: καί
  choice: và
  rationale: Liên từ phối hợp đơn giản, nối hai mệnh đề song song.
theological_decisions:
- issue: Nghĩa đen hay nghĩa ẩn dụ của việc ngủ và say trong phép so sánh giải thích
  choice: Giữ các hình ảnh nghĩa đen “ngủ” và “say rượu” trong chính văn
  alternative: Diễn giải thành sự thiếu tỉnh thức thuộc linh và lối sống buông thả
  rationale: Trong văn cảnh gần, Phao-lô dùng những hành vi thường gắn với ban đêm để nâng đỡ lời kêu gọi tỉnh thức. Giữ nguyên hình ảnh giúp bảo toàn phép so sánh và không đưa phần giải nghĩa vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “những người… thì…” tái hiện tính khái quát và nhịp song song của câu Hy Lạp; không cần chú thích.
