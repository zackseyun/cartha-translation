  source_fidelity: Bản nháp giữ đúng quan hệ giải thích của γάρ, tính khái quát của các phân từ có mạo từ, hai trạng ngữ thời gian, và cấu trúc song song. Tuy nhiên, ở vế hai, việc chỉ lặp “say” sau cụm “say rượu” làm yếu sự lặp lại của μεθυσκόμενοι ... μεθύουσιν và khiến động từ cuối dễ được hiểu như tính từ tình trạng.
  naturalness: Cấu trúc “người ... thì ...” tự nhiên trong tiếng Việt hiện đại và phù hợp với nhịp tu từ ngắn, song song của câu. Thêm “vào” trước “ban đêm” giúp liên kết trạng ngữ với mỗi hành động rõ hơn mà không thêm nghĩa.
  terminology: “Say rượu” là cách nói hiện đại, rõ nghĩa cho hành vi/tình trạng bị say do rượu; không áp đặt diễn giải thuộc linh. Không cần chú thích.
