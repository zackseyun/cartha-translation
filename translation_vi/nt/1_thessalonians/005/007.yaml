    rationale: Nguyên ngữ lặp hai hình thức cùng gốc μεθυσκόμενοι ... μεθύουσιν. Dịch “những người say rượu thì say” vẫn hiểu được, nhưng “say” ở vị ngữ kém rõ là hành động say rượu và làm giảm phép song song. Lặp “say rượu” là sửa đổi an toàn.
