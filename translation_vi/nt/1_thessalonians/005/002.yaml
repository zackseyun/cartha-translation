id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: vi
  text: Vì chính anh chị em biết rất rõ rằng ngày của Chúa sẽ đến như kẻ trộm trong đêm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: chính anh chị em
  rationale: Đại từ nhấn mạnh chủ thể đã hàm chứa trong động từ; “chính anh chị em” giữ được sắc thái nhấn mạnh và tự nhiên trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do hoặc lời giải thích cho ý trước đó; “Vì” giữ rõ chức năng liên kết này.
- source_word: ἀκριβῶς
  choice: rất rõ
  rationale: Trong kết hợp với động từ “biết”, cách nói “biết rất rõ” diễn đạt tự nhiên ý biết chính xác, cặn kẽ.
- source_word: οἴδατε
  choice: biết
  rationale: Đây là nghĩa trực tiếp và thông dụng của động từ trong ngữ cảnh.
- source_word: ὅτι
  choice: rằng
  rationale: Dùng để dẫn nội dung mà người đọc biết.
- source_word: ἡμέρα κυρίου
  choice: ngày của Chúa
  rationale: Giữ cấu trúc sở hữu và thuật ngữ cánh chung quen thuộc, chỉ ngày Chúa can thiệp và phán xét, không phải một ngày thờ phượng hằng tuần.
- source_word: ὡς κλέπτης ἐν νυκτί
  choice: như kẻ trộm trong đêm
  rationale: Giữ nguyên phép so sánh và hình ảnh chỉ sự xuất hiện bất ngờ; “trong đêm” bám sát giới từ Hy Lạp và tự nhiên trong tiếng Việt.
- source_word: οὕτως ἔρχεται
  choice: sẽ đến
  rationale: οὕτως liên kết cách thức đến với phép so sánh đứng trước và được diễn đạt tự nhiên bằng “đến như”; thì hiện tại Hy Lạp có quy chiếu tương lai nên “sẽ đến” làm rõ thời điểm trong tiếng Việt mà không thêm ý.
theological_decisions:
- issue: Cụm từ cánh chung ἡμέρα κυρίου
  choice: ngày của Chúa
  alternative: ngày Chúa; ngày thuộc về Chúa
  rationale: Ngữ cảnh nói về ngày can thiệp và phán xét của Chúa. Cách dịch này giữ liên hệ với truyền thống ngôn ngữ tiên tri và không biến cụm từ thành tên một ngày thờ phượng.
- issue: Ý nghĩa của phép so sánh “như kẻ trộm trong đêm”
  choice: Giữ nguyên hình ảnh, không diễn giải thêm
  alternative: Diễn giải thành “đến hoàn toàn bất ngờ”
  rationale: Hình ảnh chủ yếu gợi tính bất ngờ, nhưng bản dịch không nên thêm các khẳng định về tính bí mật, lịch trình hay một hệ thống cánh chung cụ thể mà câu không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu gồm cả nam lẫn nữ; giữ “Chúa” cho κύριος. Không cần chú thích vì câu không có biến thể hay độ mơ hồ cần giải trình trong bản văn.
