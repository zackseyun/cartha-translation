  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành phần chính của câu Hy Lạp: αὐτοὶ được nhấn bằng “chính anh chị em”; γάρ là “Vì”; ἀκριβῶς οἴδατε là “biết rất rõ”; và mệnh đề về “ngày của Chúa” đến “như kẻ trộm trong đêm” được giữ nguyên. “Sẽ đến” diễn đạt phù hợp hiện tại Hy Lạp mang quy chiếu tương lai trong ngữ cảnh cánh chung.'
