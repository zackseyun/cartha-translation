  terminology: “Anh chị em” phù hợp với cách xưng hô cộng đồng ở ngôi thứ hai số nhiều; “ngày của Chúa” bảo toàn thuật ngữ cánh chung ἡμέρα κυρίου và tránh nhầm với một ngày thờ phượng hằng tuần. “Chúa” là cách tương ứng chuẩn, trang trọng với κυρίου trong ngữ cảnh này.
