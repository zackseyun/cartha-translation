source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: vi
  text: Còn về các thời kỳ và các thời điểm[a], thưa anh em[b], thì anh em không cần ai viết cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thời kỳ và thời điểm” là một cặp từ chỉ các giai đoạn và những thời điểm thích hợp hoặc được ấn định, đặc biệt trong bối cảnh cánh chung.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “anh chị em”; tiếng Hy Lạp viết “anh em” nhưng có lẽ hướng đến toàn thể cộng đồng tín hữu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Còn về
  rationale: Περὶ nêu chủ đề, còn δέ đánh dấu sự chuyển ý; “Còn về” tự nhiên trong tiếng Việt và không biến δέ thành một sự tương phản mạnh.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: thời kỳ và thời điểm
  rationale: χρόνος nhấn mạnh khoảng hay tiến trình thời gian, còn καιρός chỉ thời điểm hoặc dịp thích hợp/được ấn định. Cách dịch giữ sự phân biệt trong cặp từ và phù hợp với ngữ cảnh cánh chung.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp trong lời gọi trực tiếp, đồng thời chú thích rằng từ này có thể hướng đến toàn thể cộng đồng tín hữu.
- source_word: οὐ χρείαν ἔχετε
  choice: anh em không cần
  rationale: Diễn đạt tự nhiên thành ngữ chỉ sự không cần thiết, đồng thời giữ chủ thể ngôi thứ hai số nhiều.
- source_word: ὑμῖν γράφεσθαι
  choice: được viết cho
  rationale: Giữ thể bị động của γράφεσθαι và không tự ý xác định người viết; ὑμῖν được thể hiện bằng “cho”.
theological_decisions:
- issue: Phạm vi của lời xưng hô ἀδελφοί
  choice: anh em trong chính văn, kèm chú thích về nghĩa bao gồm cộng đồng
  alternative: anh chị em
  rationale: Hình thức nguồn là danh từ giống đực số nhiều, nhưng trong thư tín có thể chỉ toàn thể hội chúng gồm cả nam và nữ. Cách trình bày này bảo toàn cả hình thức lẫn phạm vi dụng học có thể có.
- issue: Quan hệ giữa χρόνοι và καιροί trong bối cảnh cánh chung
  choice: thời kỳ và thời điểm
  alternative: thời gian và kỳ hạn
  rationale: 'Không đồng nhất hai danh từ: từ thứ nhất thiên về độ dài hoặc giai đoạn, từ thứ hai thiên về thời điểm thích hợp hay được ấn định. Bản dịch không giải quyết quá mức việc những thời điểm ấy được ấn định theo nghĩa thần học nào.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải. “Còn về” đánh dấu chuyển đề tài; “thưa anh em” thể hiện lời gọi trực tiếp. Cấu trúc bị động ở cuối hơi trang trọng nhưng được giữ để không thêm chủ thể viết vốn không được nêu rõ trong tiếng Hy Lạp.
