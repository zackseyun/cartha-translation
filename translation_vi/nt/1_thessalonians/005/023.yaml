id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: vi
  text: Chính Đức Chúa Trời của sự bình an nguyện thánh hóa anh chị em cách trọn vẹn; và nguyện tinh thần, linh hồn và thân thể của anh chị em được gìn giữ toàn vẹn, không chỗ trách được khi Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, quang lâm.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “khi Chúa chúng ta là Đức Giê-su, Đấng Christ, quang lâm.”'
    reason: Cung cấp cách gọi truyền thống cho tước hiệu Χριστός.
  - marker: b
    text: Phao-lô nêu “tinh thần, linh hồn và thân thể”. Có người hiểu đây là ba thành phần của con người; người khác hiểu đó là cách nhấn mạnh toàn bộ con người.
    reason: Giữ nguyên sự mơ hồ và căng thẳng thần học của cách diễn đạt Hy Lạp.
lexical_decisions:
- source_word: Αὐτὸς
  choice: Chính
  rationale: 'Giữ sắc thái nhấn mạnh: chính Đức Chúa Trời là Đấng thực hiện việc thánh hóa.'
- source_word: δὲ
  choice: không biểu thị riêng
  rationale: δέ đánh dấu sự chuyển sang lời cầu nguyện/chúc nguyện; trong tiếng Việt, không cần thêm một từ nối vốn có thể làm câu nặng hoặc hàm ý tương phản quá mức.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Đức Chúa Trời của sự bình an
  rationale: Giữ nguyên danh xưng đặc trưng của Phao-lô và quan hệ sở hữu/phẩm tính trong cụm Hy Lạp.
- source_word: ἁγιάσαι
  choice: nguyện thánh hóa
  rationale: Thể optative diễn tả lời cầu chúc; “thánh hóa” giữ mối liên hệ từ vựng và thần học với sự thánh khiết.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ cộng đồng tín hữu; cách gọi này tự nhiên, bao quát giới và phù hợp văn phong thư tín.
- source_word: ὁλοτελεῖς
  choice: cách trọn vẹn
  rationale: Diễn đạt tính toàn diện của việc thánh hóa mà không thêm một hệ thống nhân học vào câu.
- source_word: ὁλόκληρον
  choice: toàn thể
  rationale: Nhấn mạnh sự nguyên vẹn, toàn bộ, đồng thời dẫn tự nhiên vào ba danh từ tiếp theo.
- source_word: τὸ πνεῦμα
  choice: tâm linh
  rationale: Giữ sự phân biệt với ψυχή trong chuỗi ba thành tố; “tâm linh” ở đây chỉ phương diện tinh thần của con người, không phải Đức Thánh Linh.
- source_word: ἡ ψυχὴ
  choice: linh hồn
  rationale: Cách dịch quen thuộc và phù hợp trong cụm ba thành tố, giữ khác biệt từ vựng với πνεῦμα và σῶμα.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: Cách dịch chuẩn, trang trọng và tự nhiên cho σῶμα.
- source_word: ἀμέμπτως
  choice: không chỗ trách được
  rationale: Diễn đạt trạng thái không thể bị khiển trách trong lối nói tự nhiên của tiếng Việt.
- source_word: τηρηθείη
  choice: nguyện ... được gìn giữ
  rationale: Giữ thể bị động và sắc thái cầu chúc của động từ optative.
- source_word: ἐν τῇ παρουσίᾳ
  choice: cho đến khi ... quang lâm
  rationale: Trong ngữ cảnh cánh chung của Phao-lô, παρουσία chỉ sự hiện đến của Chúa; cách diễn đạt này hiểu việc được gìn giữ kéo dài đến sự kiện ấy.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Dịch Χριστός như một tước hiệu; thêm “Đấng” để tiếng Việt tự nhiên và thể hiện rõ chức danh.
theological_decisions:
- issue: Ba thành tố “tâm linh, linh hồn và thân thể”
  choice: Giữ nguyên cả ba thuật ngữ và đặt dưới ý “toàn thể”.
  alternative: Hiểu đây là lối nói tu từ nhấn mạnh toàn bộ con người, không phải một sự phân chia kỹ thuật thành ba phần.
  rationale: Bản Hy Lạp nêu đích danh cả ba nhưng không tự giải thích mối quan hệ giữa chúng; bản dịch không nên quyết định thay cho văn bản cuộc tranh luận về cấu tạo con người.
- issue: Phạm vi của ἀμέμπτως và cấu trúc lời cầu chúc
  choice: Để “không chỗ trách được” gắn với việc toàn thể con người được gìn giữ.
  alternative: Hiểu trạng từ này bổ nghĩa rộng hơn cho toàn bộ lời cầu xin.
  rationale: Cấu trúc gần nhất hỗ trợ việc gắn với τηρηθείη, nhưng tiếng Hy Lạp vẫn có độ nén; bản dịch tránh khai triển giáo lý vượt quá câu.
- issue: Ý nghĩa của παρουσία
  choice: Dịch theo nghĩa cánh chung là “quang lâm”.
  alternative: Dịch sát hơn là “sự hiện diện” hoặc “sự đến”.
  rationale: Trong ngữ cảnh thư Tê-sa-lô-ni-ca, từ này chỉ sự trở lại/hiện đến của Chúa Giê-su; “quang lâm” là cách nói ngắn gọn, trang trọng và quen thuộc.
- issue: Tước hiệu Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ hoặc Cơ Đốc
  rationale: Giữ nghĩa tước hiệu “Đấng được xức dầu” thay vì chỉ phiên âm; chú thích cung cấp cách gọi truyền thống quen thuộc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều của cộng đồng; giữ các thuật ngữ thần học phổ thông như “thánh hóa”, “linh hồn” và “quang lâm”. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
