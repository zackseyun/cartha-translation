revisions:
- from: Chính Đức Chúa Trời của sự bình an nguyện thánh hóa anh chị em cách trọn vẹn; và nguyện toàn thể tâm linh, linh hồn và thân thể của anh chị em được gìn giữ không chỗ trách được cho đến khi Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, quang lâm.[a][b]
  to: Chính Đức Chúa Trời của sự bình an nguyện thánh hóa anh chị em cách trọn vẹn; và nguyện tinh thần, linh hồn và thân thể của anh chị em được gìn giữ toàn vẹn, không chỗ trách được khi Chúa chúng ta là Đức Giê-su, Đấng Mê-si-a, quang lâm.[a][b]
  rationale: Đổi “cho đến khi” thành “khi” để phản ánh ἐν τῇ παρουσίᾳ mà không thêm ý về thời hạn. Đổi cấu trúc thứ hai thành “được gìn giữ toàn vẹn, không chỗ trách được” để lần lượt thể hiện ὁλόκληρον và ἀμέμπτως. Đổi “tâm linh” thành “tinh thần” vì đây là cách dùng hiện đại tự nhiên hơn cho πνεῦμα trong bộ ba, nhưng không giải quyết tranh luận về quan hệ giữa tinh thần và linh hồn.
