id: 1TH.5.4
reference: 1 Thessalonians 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: vi
  text: Nhưng thưa anh em[a], anh em không ở trong bóng tối đến nỗi ngày ấy[b] ập đến với anh em như kẻ trộm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp theo nghĩa đen là “anh em”, nhưng trong lời nói với hội chúng có thể bao gồm cả anh chị em, nam và nữ.
    reason: lexical_alternative
  - marker: b
    text: Trong văn cảnh ngay trước đó, “ngày ấy” là ngày của Chúa.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Nhưng ... anh em
  rationale: δέ nêu sự tương phản với những người vừa được nói đến, còn đại từ ὑμεῖς được nêu rõ để nhấn mạnh. Cách diễn đạt này giữ cả sắc thái tương phản lẫn trọng tâm hướng vào người nghe.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Đây là danh từ số nhiều ở hô cách, theo nghĩa đen là “anh em”. “Thưa anh em” là lời xưng hô tự nhiên, trang trọng trong tiếng Việt; chú thích làm rõ rằng trong ngữ cảnh hội chúng, từ này có thể bao gồm cả nam lẫn nữ.
- source_word: ἐν σκότει
  choice: ở trong bóng tối
  rationale: Giữ nguyên hình ảnh ẩn dụ về tình trạng tối tăm thuộc linh hoặc thiếu nhận biết, thay vì giải nghĩa trực tiếp và thu hẹp ý nghĩa.
- source_word: ἵνα
  choice: đến nỗi
  rationale: Trong câu phủ định này, “đến nỗi” diễn đạt tự nhiên mối liên hệ hệ quả giữa việc không ở trong bóng tối và việc ngày ấy không thể bắt gặp họ như kẻ trộm, đồng thời không quyết đoán quá mức giữa sắc thái mục đích và kết quả của ἵνα.
- source_word: ἡ ἡμέρα
  choice: ngày ấy
  rationale: Mạo từ chỉ một ngày cụ thể đã được xác định bởi văn cảnh. “Ngày ấy” tự nhiên trong tiếng Việt mà không đưa nguyên cụm “ngày của Chúa” vào chính văn.
- source_word: ὡς κλέπτης
  choice: như kẻ trộm
  rationale: Giữ nguyên phép so sánh và hình ảnh về sự xuất hiện bất ngờ.
- source_word: καταλάβῃ
  choice: ập đến với
  rationale: Trong văn cảnh, động từ mang ý bắt kịp hoặc chộp lấy cách bất ngờ. “Ập đến với” phù hợp với chủ ngữ là “ngày ấy” và hình ảnh kẻ trộm, nhưng không thêm hẳn cụm giải thích “khiến bất ngờ” vào chính văn.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφοί khi nói với hội chúng
  choice: anh em
  alternative: anh chị em; các anh chị em
  rationale: Chính văn giữ hình thức giống đực của từ Hy Lạp, trong khi chú thích bảo toàn khả năng từ này đại diện cho toàn thể hội chúng, gồm cả nam và nữ.
- issue: Ngày được nói đến trong ἡ ἡμέρα
  choice: ngày ấy
  alternative: ngày của Chúa; Ngày ấy
  rationale: Văn cảnh gần xác định đây là ngày của Chúa, nhưng bản thân câu chỉ viết “ngày”. Vì vậy chính văn không mở rộng cụm từ theo cách diễn giải; chú thích cung cấp thông tin văn cảnh.
- issue: Quan hệ logic của ἵνα sau mệnh đề phủ định
  choice: không ... đến nỗi
  alternative: nên ngày ấy sẽ không; để ngày ấy không
  rationale: Cách chọn giữ mối liên hệ chặt giữa hai mệnh đề và hàm ý phủ định của toàn cấu trúc, nhưng tránh biến ἵνα dứt khoát thành chỉ mục đích hoặc chỉ kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời gọi “thưa anh em” phù hợp với thư tín; “ở trong bóng tối” giữ hình ảnh thần học của nguyên văn, còn “ập đến” truyền đạt sức mạnh và tính bất ngờ của καταλαμβάνω trong phép so sánh với kẻ trộm.
