  text: τὸ πνεῦμα μὴ σβέννυτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: vi
  text: Đừng dập tắt Thánh Linh,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “linh.” Từ Hy Lạp có thể chỉ về linh nói chung, nhưng ở đây rất có thể chỉ về Thánh Linh, nhất là vì câu tiếp theo nhắc đến các lời tiên tri.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong lời khuyên của Phao-lô và nhất là trong mạch văn kế tiếp nói về các lời tiên tri (cc. 20–21), cụm từ này rất có thể chỉ về Thánh Linh. Tiếng Hy Lạp không phân biệt chữ hoa để xác định nghĩa này, nên phương án rộng hơn được ghi ở chú thích.
- source_word: μὴ
  choice: Đừng
  rationale: μή đi với động từ mệnh lệnh hiện tại tạo thành lời cấm; “Đừng” là cách diễn đạt tự nhiên, trực tiếp trong tiếng Việt.
- source_word: σβέννυτε
  choice: dập tắt
  rationale: Động từ σβέννυμι thường chỉ việc dập lửa hay làm tắt; “dập tắt” giữ được hình ảnh ẩn dụ và đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: linh; tinh thần; sự vận hành hay ân tứ thuộc linh
  rationale: Việc ngay sau đó Phao-lô nhắc đến các lời tiên tri khiến cách hiểu chỉ về Thánh Linh có khả năng cao nhất. Tuy nhiên, vì bản Hy Lạp tự nó vẫn có thể mang nghĩa rộng hơn, chú thích bảo lưu phương án “linh” mà không xóa bỏ sự mơ hồ.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và súc tích. “Đừng dập tắt” bảo toàn ẩn dụ về lửa trong nguyên văn; dấu phẩy được giữ vì câu này thuộc một chuỗi lời khuyên ngắn.
