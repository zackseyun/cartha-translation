  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: vi
  text: Vậy thì, chúng ta đừng ngủ như những người khác, nhưng hãy tỉnh thức[a] và giữ mình tỉnh táo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hãy thức” hoặc “hãy cảnh giác”. Động từ Hy Lạp có thể nhấn mạnh trạng thái thức hoặc sự cảnh giác.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “hãy tiết độ”, “hãy sáng suốt” hoặc “đừng say”. Động từ Hy Lạp chỉ trạng thái không say và, theo nghĩa mở rộng, sự tỉnh trí cùng khả năng tự kiềm chế.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy thì
  rationale: Cặp tiểu từ suy luận nhấn mạnh kết luận rút ra từ phần trước; “Vậy thì” tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái chuyển sang lời khuyên nhủ.
- source_word: μὴ καθεύδωμεν
  choice: chúng ta đừng ngủ
  rationale: Thể giả định hiện tại dùng theo lối khích lệ cùng với μή diễn đạt lời kêu gọi chung. Giữ nguyên hình ảnh “ngủ” thay vì diễn giải thành sự thờ ơ về đạo đức hay tâm linh.
- source_word: ὡς οἱ λοιποί
  choice: như những người khác
  rationale: Cụm từ chỉ những người còn lại, đối lập với các tín hữu trong văn cảnh. Cách dịch này rõ ràng và tự nhiên hơn lối nói “như phần còn lại” trong tiếng Việt.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Liên từ biểu thị sự tương phản trực tiếp giữa ngủ và tỉnh thức.
- source_word: γρηγορῶμεν
  choice: hãy tỉnh thức
  rationale: Động từ có thể chỉ thức hoặc cảnh giác. “Tỉnh thức” vừa duy trì sự đối lập với “ngủ”, vừa chuyển tải sắc thái cảnh giác trong lời khuyên.
- source_word: νήφωμεν
  choice: giữ mình tỉnh táo
  rationale: Động từ νήφω có nghĩa căn bản là không say, đồng thời mở rộng sang sự sáng suốt và tự chủ. “Giữ mình tỉnh táo” diễn đạt được trạng thái tỉnh trí lẫn yếu tố tự kiềm chế mà không thu hẹp từ này vào một nghĩa duy nhất.
theological_decisions:
- issue: Sức gợi hình ẩn dụ của ngủ và tỉnh thức
  choice: Giữ hình ảnh “ngủ” và “tỉnh thức” trong chính văn như một lời khuyên về đời sống đạo đức và tâm linh.
  alternative: Diễn giải thành sự thờ ơ đối lập với cảnh giác.
  rationale: Văn cảnh đối chiếu con cái ánh sáng với những người thuộc về đêm. Giữ nguyên hình ảnh giúp bảo toàn lập luận và thần học của Phao-lô mà không giải thích quá mức trong bản dịch.
- issue: Cách dịch νήφω
  choice: Dịch là “giữ mình tỉnh táo”, đồng thời ghi chú nghĩa liên quan đến không say và tự chủ.
  alternative: “hãy tiết độ”, “hãy sáng suốt” hoặc “đừng say”.
  rationale: Từ Hy Lạp có thể mang cả sắc thái tỉnh rượu theo nghĩa đen lẫn sự tỉnh trí, kiềm chế theo nghĩa mở rộng. Cách dịch và chú thích này giữ được độ mở của từ thay vì giải quyết căng thẳng ngữ nghĩa theo một hướng duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Tỉnh thức” phù hợp với văn phong Kinh Thánh nhưng vẫn thông dụng; “giữ mình tỉnh táo” làm rõ sắc thái chủ động và tự chủ. Các dấu chú thích được đặt ngay sau những từ ngữ mà chúng giải thích.
