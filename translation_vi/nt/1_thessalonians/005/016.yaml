lexical_decisions:
- source_word: πάντοτε
  choice: luôn
  rationale: Trạng từ này diễn tả tính thường xuyên không gián đoạn hoặc trong mọi hoàn cảnh. “Luôn” tự nhiên, ngắn gọn và giữ được sức tuyệt đối của nguyên văn.
- source_word: χαίρετε
  choice: hãy vui mừng
  rationale: Đây là động từ χαίρω ở thể mệnh lệnh chủ động hiện tại, ngôi thứ hai số nhiều. “Hãy vui mừng” giữ rõ sắc thái mệnh lệnh và ý niệm niềm vui; nét tiếp diễn của thì hiện tại được nêu trong chú thích.
