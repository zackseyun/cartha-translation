  - severity: low
    issue: Chính văn dùng “anh chị em” trong khi chú thích mô tả nghĩa sát chữ là “anh em”.
    rationale: “Anh chị em” là cách bao hàm tự nhiên trong tiếng Việt, nhưng “anh em” vừa sát hình thức ἀδελφοῖς hơn vừa vẫn có thể dùng theo nghĩa cộng đoàn bao gồm; chú thích bảo lưu thông tin ngữ pháp và ngữ cảnh.
