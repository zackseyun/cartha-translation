source:
  edition: SBLGNT
  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: vi
  text: Tôi nhân danh Chúa[a] long trọng truyền anh em phải cho đọc thư này cho tất cả anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước Chúa.” Cụm từ Hy Lạp có thể diễn tả việc Phao-lô trang nghiêm ràng buộc họ bằng cách viện dẫn Chúa làm thẩm quyền.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ở đây có dạng giống đực số nhiều, theo nghĩa sát chữ là “anh em”, nhưng trong ngữ cảnh này nhiều khả năng chỉ toàn thể hội chúng, bao gồm cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Tôi buộc anh em phải thề
  rationale: Động từ diễn tả việc đặt người nghe dưới lời thề hoặc ràng buộc họ bằng một lời thề trang nghiêm. Cách dịch này giữ được sức nặng pháp ngôn của từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸν κύριον
  choice: trước Chúa
  rationale: Với ἐνορκίζω, đối cách có thể chỉ Đấng được viện dẫn làm thẩm quyền cho lời thề. “Trước Chúa” diễn đạt tự nhiên việc Chúa là chứng nhân và thẩm quyền, đồng thời ghi nhận “nhân danh Chúa” như một khả năng trong chú thích.
- source_word: ἀναγνωσθῆναι
  choice: phải được đọc
  rationale: Động từ nguyên mẫu thụ động aorist có nghĩa là “được đọc”; ngữ cảnh rất có thể là đọc công khai trong hội chúng. Bản dịch giữ thể thụ động và không thêm thẳng “đọc lớn tiếng” vào chính văn.
- source_word: τὴν ἐπιστολήν
  choice: thư này
  rationale: Chỉ chính bức thư đang được gửi. “Thư này” là cách nói hiện đại và tự nhiên hơn “bức thư tín này”.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: cho tất cả anh chị em
  rationale: ἀδελφοῖς là giống đực số nhiều nhưng trong cách xưng hô của Phao-lô thường bao gồm toàn thể cộng đoàn, cả nam lẫn nữ. Tiếng Việt thường dùng “anh chị em” để chuyển đúng chức năng cộng đồng ấy mà không thay bằng khái niệm rộng hơn như “các tín hữu”.
theological_decisions:
- issue: Phạm vi của ἀδελφοῖς trong một hội chúng có cả nam và nữ
  choice: anh chị em
  alternative: anh em
  rationale: Hình thức Hy Lạp là giống đực số nhiều, nhưng trong ngữ cảnh lời dặn phải đọc thư cho toàn thể hội chúng, từ này nhiều khả năng bao gồm cả phụ nữ. Chính văn dùng cách xưng hô bao hàm tự nhiên của tiếng Việt; chú thích giữ lại thông tin về hình thức ngữ pháp Hy Lạp.
- issue: Quan hệ của τὸν κύριον với ἐνορκίζω
  choice: trước Chúa
  alternative: nhân danh Chúa
  rationale: Cú pháp có thể được hiểu là Chúa hiện diện như chứng nhân/thẩm quyền hoặc là Đấng được viện dẫn để ràng buộc lời thề. “Trước Chúa” giữ sắc thái trang nghiêm mà không loại bỏ cách hiểu còn lại, vốn được nêu trong chú thích.
translation_notes:
  register: Văn phong trang nghiêm nhưng hiện đại. “Buộc ... phải thề” giữ sức nặng của lời ràng buộc; “anh chị em” là cách xưng hô cộng đồng tự nhiên trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
