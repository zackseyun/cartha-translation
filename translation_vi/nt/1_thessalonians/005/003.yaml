id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: vi
  text: 'Khi họ nói: “Hòa bình và an ninh[a],” thì sự hủy diệt thình lình ập đến với họ, như cơn đau chuyển dạ[b] ập đến với một phụ nữ mang thai; và họ tuyệt đối sẽ không thoát được.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “an toàn.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cơn đau sinh nở.”
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hy Lạp dùng lối phủ định nhấn mạnh: “họ tuyệt đối sẽ không thoát được.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Khi người ta nói
  rationale: ὅταν với động từ giả định hướng đến một thời điểm trong tương lai; “khi” tự nhiên hơn “bất cứ khi nào” trong lời cảnh báo này. Chủ thể số nhiều không xác định được diễn đạt bằng “người ta”.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Hòa bình và an ninh
  rationale: “Hòa bình” diễn đạt εἰρήνη; “an ninh” giữ sắc thái trạng thái ổn định, không bị đe dọa của ἀσφάλεια. “An toàn” cũng là một khả năng nên được ghi ở chú thích.
- source_word: αἰφνίδιος ... ἐφίσταται ὄλεθρος
  choice: sự hủy diệt thình lình ập đến trên họ
  rationale: “Thình lình” nhấn mạnh tính bất ngờ, đột ngột; “ập đến” diễn đạt sức mạnh của ἐφίσταται trong ngữ cảnh tai họa giáng xuống. “Sự hủy diệt” giữ mức độ nghiêm trọng của ὄλεθρος mà không xác định thêm bản chất hay thời hạn của sự phán xét.
- source_word: ἡ ὠδὶν
  choice: cơn đau chuyển dạ
  rationale: Cụm từ hiện đại, tự nhiên, chỉ cơn đau gắn với tiến trình sinh con; “cơn đau sinh nở” là phương án tương đương.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: người phụ nữ mang thai
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp, theo nghĩa đen là người đang có thai trong bụng, đồng thời giữ nguyên hình ảnh so sánh.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: chắc chắn họ không thể thoát được
  rationale: οὐ μή với động từ giả định là lối phủ định mạnh về tương lai. “Chắc chắn ... không thể” chuyển tải sức nhấn mà vẫn tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của ὄλεθρος trong lời cảnh báo cánh chung
  choice: sự hủy diệt
  alternative: sự tàn phá; tai họa diệt vong
  rationale: Từ này nói đến sự hủy hoại nghiêm trọng do phán xét nhưng riêng câu này không xác định đó là sự tiêu diệt hoàn toàn hay một hình thức hoặc thời hạn trừng phạt cụ thể. Bản dịch không áp đặt một hệ thống cánh chung.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “người ta” cho chủ thể số nhiều không xác định, rồi dùng “họ” để nối kết tự nhiên với đối tượng chịu sự hủy diệt. Dấu chấm phẩy làm rõ vế kết luận mạnh ở cuối câu.
