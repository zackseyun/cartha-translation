  text: Abstain from every kind of evil[a].
translation:
  language: vi
  text: Hãy tránh xa mọi loại điều ác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi dạng điều ác”; theo cách dịch truyền thống: “mọi vẻ bề ngoài của điều ác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: hãy tránh xa
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều, kêu gọi tiếp tục giữ mình khỏi điều được nói đến. “Hãy tránh xa” tự nhiên trong tiếng Việt và giữ rõ sắc thái mệnh lệnh cùng ý nghĩa phân cách.
- source_word: ἀπὸ
  choice: xa
  rationale: Đi với ἀπέχεσθε để diễn tả sự tách khỏi hoặc tránh khỏi; trong tiếng Việt, ý nghĩa này được diễn đạt tự nhiên bằng cụm “tránh xa”.
- source_word: παντὸς
  choice: mọi
  rationale: Bổ nghĩa cho εἴδους theo nghĩa từng loại hay tất cả các loại; “mọi” là cách diễn đạt gọn và tự nhiên.
- source_word: εἴδους
  choice: loại
  rationale: Trong ngữ cảnh này, từ này hợp lý nhất là “loại” hay “dạng”, chứ không nhất thiết chỉ vẻ bề ngoài. “Loại” tránh tạo ấn tượng rằng câu chỉ dạy tránh những gì trông có vẻ ác.
- source_word: πονηροῦ
  choice: điều ác
  rationale: Danh từ hóa tính từ giúp câu tiếng Việt tự nhiên, chỉ sự ác hay những gì là ác; “điều ác” trực tiếp và dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của εἴδους trong cụm ἀπὸ παντὸς εἴδους πονηροῦ
  choice: mọi loại điều ác
  alternative: 'mọi dạng điều ác; theo cách dịch truyền thống: mọi vẻ bề ngoài của điều ác'
  rationale: Trong ngữ cảnh, εἶδος có khả năng mang nghĩa “loại” hoặc “dạng” hơn là chỉ “vẻ bề ngoài”. Bản chính dùng “loại” để tránh suy diễn rằng phải tránh cả những gì chỉ có vẻ là ác, đồng thời chú thích ghi nhận các cách hiểu khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu ngắn gọn, giữ nguyên lực mệnh lệnh và không áp đặt cách hiểu truyền thống của εἶδος.
