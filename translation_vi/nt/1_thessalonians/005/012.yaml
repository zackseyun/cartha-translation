id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: vi
  text: Thưa anh em[a], chúng tôi xin anh em nhìn nhận[b] những người khó nhọc làm việc giữa anh em, lãnh đạo anh em trong Chúa[c] và khuyên bảo anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thưa anh chị em”; từ Hy Lạp là “anh em”, được dùng ở đây để xưng hô với hội chúng.
    reason: lexical_alternative
  - marker: b
    text: Hay “hãy kính trọng” hoặc “hãy nhận biết” những người khó nhọc làm việc giữa anh em.
    reason: lexical_alternative
  - marker: c
    text: Hay “đứng đầu anh em trong Chúa”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: chúng tôi xin
  rationale: Diễn đạt lời thỉnh cầu mang tính mục vụ, nhẹ hơn một mệnh lệnh và tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ chỉ sự chuyển ý nhẹ; tiếng Việt không cần thêm một từ nối ở đây, tránh đưa vào ý thời gian không có trong nguyên văn.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức hô cách số nhiều giống đực của nguyên văn; trong ngữ cảnh, cách xưng hô này hướng đến toàn thể hội chúng.
- source_word: εἰδέναι
  choice: nhìn nhận
  rationale: Trong thành ngữ này, động từ không chỉ có nghĩa là biết mà còn là nhận biết và coi trọng vai trò của những người phục vụ, nhưng không hàm ý vâng phục hay tôn sùng quá mức.
- source_word: κοπιῶντας
  choice: những người đang khó nhọc làm việc
  rationale: Thể hiện sắc thái lao nhọc, tận lực của κοπιάω bằng cách nói rõ ràng, tự nhiên với độc giả hiện đại.
- source_word: ἐν ὑμῖν
  choice: giữa anh em
  rationale: Chỉ công việc được thực hiện trong cộng đồng hội chúng.
- source_word: προϊσταμένους ὑμῶν
  choice: lãnh đạo anh em
  rationale: Truyền đạt vai trò dẫn dắt và trông nom mà không áp đặt một mô hình phẩm trật giáo phái cụ thể.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ cách diễn đạt thần học quen thuộc và độ mở của mối liên hệ với Chúa trong nguyên văn.
- source_word: νουθετοῦντας
  choice: khuyên bảo anh em
  rationale: Bao gồm cả sự chỉ dẫn lẫn sửa bảo mang tính mục vụ; tự nhiên hơn từ Hán-Việt nặng như 'khuyến giới'.
theological_decisions:
- issue: Phạm vi của cách gọi ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Bản văn chính giữ hình thức giống đực của tiếng Hy Lạp, còn chú thích nêu rõ trong cách gọi hội chúng, từ này có thể bao gồm cả nam lẫn nữ.
- issue: Ý nghĩa của εἰδέναι đối với những người phục vụ và lãnh đạo
  choice: nhìn nhận
  alternative: kính trọng; nhận biết
  rationale: Cách dịch này giữ ý công nhận và coi trọng họ nhưng không biến câu thành một đòi hỏi về sự phục tùng hoặc tôn kính tuyệt đối.
- issue: Sắc thái của προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: lãnh đạo anh em trong Chúa
  alternative: đứng đầu anh em trong Chúa; chăm sóc anh em trong Chúa
  rationale: Động từ có thể chỉ dẫn dắt, quản nhiệm hoặc chăm nom. 'Lãnh đạo' cân bằng giữa thẩm quyền và trách nhiệm mà không quyết định một cơ cấu giáo hội cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thưa anh em” làm lời gọi trực tiếp; “khó nhọc làm việc” giữ sức nặng của lao tác; “khuyên bảo” truyền đạt sự chỉ dẫn có tính sửa bảo mà không quá cổ hoặc nặng tính giáo quyền.
