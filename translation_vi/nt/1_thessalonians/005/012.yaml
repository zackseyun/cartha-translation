  - severity: medium
    issue: Neo chú thích b và c đặt không đúng vị trí
    rationale: Chú thích b giải thích “nhìn nhận” (εἰδέναι), còn chú thích c giải thích “lãnh đạo ... trong Chúa” (προϊσταμένους ... ἐν κυρίῳ). Chúng cần được gắn ngay sau các cụm này, thay vì cùng đặt ở cuối câu sau “khuyên bảo anh em”.
