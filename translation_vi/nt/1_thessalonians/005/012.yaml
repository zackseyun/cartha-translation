revisions:
- from: Thưa anh em[a], chúng tôi xin anh em hãy nhìn nhận những người đang khó nhọc làm việc giữa anh em, lãnh đạo anh em trong Chúa và khuyên bảo anh em.[b][c]
  to: Thưa anh em[a], chúng tôi xin anh em nhìn nhận[b] những người khó nhọc làm việc giữa anh em, lãnh đạo anh em trong Chúa[c] và khuyên bảo anh em.
  rationale: Bản sửa chỉ loại bỏ yếu tố “hãy” dư thừa sau động từ thỉnh cầu và di chuyển các ký hiệu chú thích đến đúng các đơn vị tiếng Hy Lạp được giải thích. Nghĩa của câu, mức độ thẩm quyền của người phục vụ, và sắc thái mục vụ vẫn được giữ nguyên.
