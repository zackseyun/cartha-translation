base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: vi
  text: Vì vậy, hãy khích lệ nhau và gây dựng lẫn nhau[a], như anh chị em cũng đang làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khuyên nhủ nhau”; παρακαλεῖτε trong văn cảnh này có thể mang sắc thái khích lệ hoặc thúc giục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Diễn tả kết luận rút ra từ lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: παρακαλεῖτε
  choice: hãy khích lệ
  rationale: Động từ có thể mang nghĩa khích lệ, khuyên nhủ hoặc an ủi. Trong văn cảnh kêu gọi cộng đồng cùng làm cho nhau vững mạnh, “khích lệ” giữ được nghĩa rộng và sắc thái tích cực.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Cách diễn đạt tương hỗ tự nhiên trong tiếng Việt, cho thấy hành động hướng qua lại giữa các thành viên trong cộng đồng.
- source_word: οἰκοδομεῖτε
  choice: xây dựng
  rationale: Giữ lại hình ảnh xây cất trong nguyên ngữ; ở đây mang nghĩa làm cho người khác được vững mạnh và trưởng thành.
- source_word: εἷς τὸν ἕνα
  choice: lẫn nhau
  rationale: Thành ngữ Hy Lạp nhấn mạnh tính tương hỗ từng người đối với người khác. “Lẫn nhau” vừa tự nhiên vừa giữ sự lặp lại có chủ ý sau mệnh lệnh thứ hai.
- source_word: καθὼς καὶ ποιεῖτε
  choice: như anh chị em vẫn đang làm
  rationale: Giữ cả ý so sánh, xác nhận và hành động hiện đang tiếp diễn. “Anh chị em” làm rõ chủ thể số nhiều một cách tự nhiên, còn “vẫn đang làm” truyền đạt sự ghi nhận thực hành hiện tại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt ngôi thứ hai số nhiều trong cộng đồng tín hữu; giữ ẩn dụ “xây dựng” thay vì thay hoàn toàn bằng “làm vững mạnh”.
