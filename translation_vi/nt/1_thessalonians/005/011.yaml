  rationale: 'Điều chỉnh hai điểm nhỏ để bản văn tự nhiên hơn trong tiếng Việt hiện đại và sát hơn với sắc thái của nguyên ngữ: dùng “gây dựng” cho nghĩa ẩn dụ của οἰκοδομεῖτε, và “cũng đang làm” cho καθὼς καὶ ποιεῖτε. Giữ nguyên tính tương hỗ, giọng điệu khích lệ, và vị trí chú thích sau mệnh đề thứ hai.'
