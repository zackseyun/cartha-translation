  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: vi
  text: Đừng khinh thường các lời tiên tri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những lời phát ngôn tiên tri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: các lời tiên tri
  rationale: Danh từ đối cách số nhiều chỉ những trường hợp hoặc lời phát biểu mang tính tiên tri, không chỉ khái niệm tiên tri nói chung. “Các lời tiên tri” tự nhiên trong tiếng Việt, giữ được số nhiều và không thu hẹp ý nghĩa theo một lập trường giáo phái.
- source_word: μὴ
  choice: Đừng
  rationale: Kết hợp với mệnh lệnh hiện tại để diễn đạt lời cấm. “Đừng” là cách nói trực tiếp, tự nhiên và không tăng mức độ thành “không bao giờ”.
- source_word: ἐξουθενεῖτε
  choice: khinh thường
  rationale: Động từ mang nghĩa xem là không đáng kể, coi rẻ hoặc khinh miệt. “Khinh thường” vừa tự nhiên vừa giữ được sắc thái coi rẻ; “khước từ” sẽ hẹp hơn vì chỉ nói đến sự từ chối.
theological_decisions:
- issue: Ý nghĩa của προφητείας trong bối cảnh hội chúng Cơ Đốc ban đầu
  choice: Giữ cách dịch rộng là “các lời tiên tri”, không xác định cơ chế hay phạm trù giáo lý về ân tứ tiên tri.
  alternative: “những lời phát ngôn tiên tri” hoặc “những sứ điệp được cho là đến từ Đức Chúa Trời”
  rationale: Nguyên văn cảnh báo đừng coi rẻ lời nói tiên tri, nhưng không tự nó giải quyết các tranh luận giáo phái về sự tiếp tục hay chấm dứt của ân tứ này. Cách dịch trực tiếp giữ nguyên độ mở và sức căng thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đừng” cho mệnh lệnh số nhiều được ngữ cảnh hóa tự nhiên trong tiếng Việt; “các lời tiên tri” giữ số nhiều của nguyên văn.
