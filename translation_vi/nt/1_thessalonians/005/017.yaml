  text: Hãy cầu nguyện không ngừng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy luôn cầu nguyện” hoặc “Hãy cầu nguyện liên tục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: không ngừng
  rationale: Trạng từ này diễn tả sự bền bỉ, liên tục hoặc thường xuyên không gián đoạn. “Không ngừng” giữ được sức mạnh của nguyên ngữ mà tự nó không buộc người đọc hiểu là phải cầu nguyện thành lời trong từng giây.
- source_word: προσεύχεσθε
  choice: Hãy cầu nguyện
  rationale: Động từ ở thể mệnh lệnh hiện tại, ngôi thứ hai số nhiều, kêu gọi một hành động có tính tiếp diễn hoặc thành thói quen. “Hãy cầu nguyện” truyền đạt tự nhiên sắc thái mệnh lệnh; ý tiếp diễn đã được thể hiện qua “không ngừng”.
theological_decisions:
- issue: Ý nghĩa thực tiễn của mệnh lệnh
  choice: Giữ nguyên lời kêu gọi cầu nguyện bền bỉ, liên tục.
  alternative: Hiểu theo nghĩa tuyệt đối rằng phải cầu nguyện thành lời không gián đoạn trong từng khoảnh khắc.
  rationale: Sự kết hợp giữa mệnh lệnh hiện tại và ἀδιαλείπτως nhấn mạnh lòng chuyên tâm cùng sự kiên trì cầu nguyện. Bản dịch giữ nguyên sức căng của câu chữ, không áp đặt một cách hiểu khổ hạnh hoặc giáo phái hẹp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và súc tích. Đại từ số nhiều không cần biểu hiện riêng vì tiếng Việt dùng cùng một hình thức mệnh lệnh; ngữ cảnh thư tín xác định lời khuyên dành cho cộng đồng.
