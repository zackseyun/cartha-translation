id: 1TH.5.5
reference: 1 Thessalonians 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: vi
  text: Vì tất cả anh em đều là con của ánh sáng và con của ban ngày.[a] Chúng ta không thuộc về ban đêm cũng không thuộc về bóng tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng “con”, một thành ngữ chỉ những người thuộc về hoặc mang đặc tính của ánh sáng và ban ngày.
    reason: Giải thích thành ngữ và phạm vi bao gồm của υἱοί.
lexical_decisions:
- source_word: πάντες γὰρ ὑμεῖς
  choice: Vì tất cả anh em đều
  rationale: Giữ liên từ giải thích γάρ, sức nhấn mạnh bao quát của πάντες và đại từ ngôi thứ hai số nhiều; “anh em” là cách xưng hô tự nhiên trong văn cảnh thư tín, mang nghĩa bao gồm cả cộng đồng.
- source_word: υἱοὶ φωτός
  choice: con của ánh sáng
  rationale: Giữ danh từ υἱοί là “con” và cấu trúc thuộc cách, đồng thời diễn đạt tự nhiên thành ngữ chỉ những người thuộc về hoặc mang đặc tính của ánh sáng.
- source_word: υἱοὶ ἡμέρας
  choice: con của ban ngày
  rationale: Giữ phép song song với “con của ánh sáng” và sự đối lập ἡμέρα–νύξ; “ban ngày” tự nhiên và rõ nghĩa hơn “ngày” đứng riêng trong tiếng Việt.
- source_word: οὐκ ἐσμὲν
  choice: Chúng ta không
  rationale: Bảo toàn sự chuyển đổi có chủ ý từ ngôi thứ hai số nhiều ὑμεῖς sang ngôi thứ nhất số nhiều ἐσμέν, không đồng nhất hóa thành “anh em không”.
- source_word: νυκτός
  choice: thuộc về ban đêm
  rationale: Thuộc cách ở đây diễn tả sự thuộc về hoặc phạm vi; thêm “thuộc về” giúp tiếng Việt rõ và tự nhiên, đồng thời giữ hình ảnh đối lập với ban ngày.
- source_word: σκότους
  choice: thuộc về bóng tối
  rationale: Lặp lại “thuộc về” để làm rõ quan hệ thuộc cách và bảo toàn sự đối lập thần học, đạo đức giữa ánh sáng và bóng tối.
theological_decisions:
- issue: Ẩn dụ gia đình có dạng giống đực trong υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: con của ánh sáng và con của ban ngày
  alternative: những người thuộc về ánh sáng và ban ngày
  rationale: Tiếng Việt “con” không buộc phải đánh dấu giới tính như “con trai”, nên vừa bảo toàn ẩn dụ gia đình của υἱοί vừa tránh thu hẹp lời nói vào nam giới. Chú thích giải thích ý nghĩa thuộc về hoặc mang đặc tính.
- issue: Sự chuyển ngôi từ ngôi thứ hai sang ngôi thứ nhất số nhiều
  choice: tất cả anh em đều ... Chúng ta không ...
  alternative: tất cả anh em đều ... Anh em không ...
  rationale: Nguyên văn chuyển từ việc trực tiếp nói về người Tê-sa-lô-ni-ca sang lời bao gồm Phao-lô và các cộng sự; giữ sự chuyển ngôi bảo toàn nét tu từ và ý nghĩa cộng đồng.
- issue: Ý nghĩa của các thuộc cách νυκτός và σκότους
  choice: không thuộc về ban đêm cũng không thuộc về bóng tối
  alternative: không phải của ban đêm cũng không phải của bóng tối
  rationale: “Thuộc về” diễn đạt rõ quan hệ căn tính hay phạm vi mà không giải nghĩa quá mức theo một hệ phái hoặc biến ẩn dụ thành mệnh đề đạo đức trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô thư tín dành cho cả cộng đồng; dùng “con” thay vì “con trai” vì tiếng Việt có thể giữ ẩn dụ mà không áp đặt giới tính. Cấu trúc câu thứ hai bảo toàn sự chuyển ngôi trong nguyên văn.
