  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: vi
  text: và hết sức quý trọng họ trong tình yêu thương vì công việc của họ.[a] Hãy sống hòa thuận với nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và quý trọng họ hết mức trong tình yêu thương.” Trạng từ Hy Lạp ở đây có sức nhấn mạnh khác thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: quý trọng
  rationale: Trong cấu trúc này, động từ mang nghĩa đánh giá và coi trọng những người được nhắc đến ở câu trước; “quý trọng” tự nhiên, rõ ràng và phù hợp với sắc thái tích cực.
- source_word: ὑπερεκπερισσοῦ
  choice: hết lòng
  rationale: Trạng từ hiếm này có sức nhấn mạnh đặc biệt cao. “Hết lòng” diễn đạt tự nhiên cường độ ấy khi đi với “quý trọng”, dù cách nói sát hình thức hơn là “hết sức” cũng có thể dùng.
- source_word: ἐν ἀγάπῃ
  choice: trong tình yêu thương
  rationale: Giữ hình ảnh và từ khóa ἀγάπη, đồng thời cho biết tình yêu thương là phạm vi hoặc cách thức họ quý trọng những người ấy.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: vì công việc của họ
  rationale: διά với đối cách nêu lý do hoặc căn cứ; bản dịch giữ danh từ cụ thể ἔργον và không diễn giải thêm bản chất công việc.
- source_word: εἰρηνεύετε
  choice: Hãy sống hòa thuận
  rationale: Mệnh lệnh hiện tại kêu gọi một nếp sống liên tục. “Sống hòa thuận” là cách nói tiếng Việt tự nhiên, thể hiện sự bình an trong quan hệ cộng đồng.
- source_word: ἐν ἑαυτοῖς
  choice: với nhau
  rationale: Đại từ phản thân số nhiều chỉ quan hệ nội bộ trong cộng đồng; “với nhau” rõ nghĩa và tự nhiên hơn cách dịch máy móc “giữa chính anh em”.
- source_word: καὶ
  choice: và
  rationale: Giữ liên kết với lời khuyên ở câu trước.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ quy chiếu về những người phục vụ, lãnh đạo và khuyên bảo cộng đồng ở câu trước.
