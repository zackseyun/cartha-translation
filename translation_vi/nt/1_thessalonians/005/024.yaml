id: 1TH.5.24
reference: 1 Thessalonians 5:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: vi
  text: Đấng kêu gọi anh chị em là thành tín[a]; Ngài cũng sẽ làm điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng kêu gọi anh chị em là đáng tin cậy; Ngài cũng sẽ hoàn thành việc ấy.”'
    reason: Nêu phương án từ vựng hợp lệ cho πιστός và ποιήσει, đồng thời bảo tồn sắc thái đáng tin cậy và hoàn tất.
lexical_decisions:
- source_word: πιστὸς
  choice: thành tín
  rationale: Tính từ vị ngữ mô tả Đấng kêu gọi là đáng tin cậy và luôn giữ lời; “thành tín” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa giữ được sắc thái thần học của từ Hy Lạp.
- source_word: ὁ καλῶν
  choice: Đấng kêu gọi
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ, chỉ Đức Chúa Trời là Đấng đang và vẫn kêu gọi; cách dịch này trang trọng, tự nhiên và giữ được lực của phân từ.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều, chỉ toàn thể cộng đồng tín hữu; “anh chị em” biểu đạt rõ số nhiều và phù hợp cách xưng hô hiện đại.
- source_word: ὃς
  choice: Ngài
  rationale: Đại từ quan hệ quy chiếu về Đấng kêu gọi. Tách thành mệnh đề mới với “Ngài” tạo câu tiếng Việt tự nhiên mà vẫn giữ nguyên chủ thể.
- source_word: καὶ
  choice: cũng
  rationale: Nhấn mạnh rằng chính Đấng kêu gọi cũng là Đấng sẽ hành động.
- source_word: ποιήσει
  choice: sẽ làm điều ấy
  rationale: Động từ tương lai có nghĩa rộng là “làm, thực hiện”. “Điều ấy” cung cấp tân ngữ ngầm cần thiết trong tiếng Việt nhưng không giải thích quá mức nội dung mà câu Hy Lạp để hàm ẩn.
theological_decisions:
- issue: Tân ngữ ngầm của ποιήσει
  choice: “sẽ làm điều ấy”, quy chiếu khái quát về công việc thánh hóa và gìn giữ vừa được cầu xin ở câu 23
  alternative: “sẽ hoàn thành việc ấy” hoặc “sẽ khiến điều ấy thành hiện thực”
  rationale: Bản Hy Lạp không nêu tân ngữ. “Làm điều ấy” giữ được sự ngắn gọn và độ mở của nguyên văn, đồng thời cho phép văn cảnh câu 23 xác định điều được nói đến mà không áp đặt cách thức Đức Chúa Trời thực hiện.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng” và “Ngài” để quy chiếu về Đức Chúa Trời; “anh chị em” làm rõ đại từ số nhiều. Dấu chấm phẩy phản ánh quan hệ chặt chẽ giữa sự thành tín của Đấng kêu gọi và hành động Ngài sẽ thực hiện.
