id: 1TH.5.18
reference: 1 Thessalonians 5:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: vi
  text: Trong mọi hoàn cảnh, hãy tạ ơn[a], vì đây là ý muốn của Đức Chúa Trời dành cho anh chị em trong Đấng Mê-si-a Giê-su.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trong mọi sự.” Cụm Hy Lạp nói đến hoàn cảnh mà người tin tạ ơn, không nhất thiết có nghĩa là phải tạ ơn vì chính điều ác.'
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “trong Đấng Christ Giê-su.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: trong mọi hoàn cảnh
  rationale: ἐν với tặng cách chỉ hoàn cảnh hoặc phạm vi diễn ra việc tạ ơn. Cách dịch này tự nhiên trong tiếng Việt và tránh hàm ý rằng phải tạ ơn vì chính điều ác.
- source_word: εὐχαριστεῖτε
  choice: hãy tạ ơn
  rationale: Động từ mệnh lệnh hiện tại, ngôi hai số nhiều, kêu gọi cộng đồng duy trì việc tạ ơn. “Hãy tạ ơn” trực tiếp, trang trọng và không diễn giải quá mức sắc thái thể.
- source_word: τοῦτο
  choice: đây
  rationale: Đại từ chỉ định quy chiếu gần nhất về lời khuyên hãy tạ ơn; “đây” giữ được sự cô đọng của nguyên văn.
- source_word: γὰρ
  choice: vì
  rationale: γάρ nêu lý do làm nền cho mệnh lệnh; “vì” là liên từ tự nhiên và chính xác.
- source_word: θέλημα θεοῦ
  choice: ý muốn của Đức Chúa Trời
  rationale: Cụm sở hữu được dịch trực tiếp; cách diễn đạt này trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt Cơ Đốc.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a là Chúa Giê-su
  rationale: Giữ giới từ “trong” để bảo tồn ngôn ngữ thần học của Phao-lô về sự liên hiệp với Đấng Mê-si-a. “Đấng Mê-si-a” chuyển tải chức hiệu Χριστός, còn cấu trúc “là Chúa Giê-su” giúp cụm từ tự nhiên và rõ ràng trong tiếng Việt.
- source_word: εἰς ὑμᾶς
  choice: dành cho anh chị em
  rationale: εἰς với đại từ chỉ người ở đây diễn tả sự hướng đến hoặc liên quan; “dành cho” truyền đạt tự nhiên rằng ý muốn ấy áp dụng cho cộng đồng người nhận thư. “Anh chị em” thể hiện số nhiều và tính cộng đồng.
theological_decisions:
- issue: Phạm vi của mệnh lệnh tạ ơn
  choice: trong mọi hoàn cảnh
  alternative: trong mọi sự; vì mọi sự
  rationale: Nguyên văn ἐν παντί nói đến phạm vi hoặc hoàn cảnh của việc tạ ơn, không nhất thiết dạy phải cảm tạ vì bản thân điều ác. Chú thích bảo tồn cách dịch sát chữ “trong mọi sự”.
- issue: Dịch Χριστῷ như chức hiệu hay dạng truyền thống
  choice: Đấng Mê-si-a là Chúa Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Χριστός vẫn mang ý nghĩa chức hiệu “Đấng Mê-si-a”. Bản chính chuyển tải ý nghĩa ấy, đồng thời chú thích lưu lại cách gọi truyền thống quen thuộc.
- issue: Quan hệ của cụm ἐν Χριστῷ Ἰησοῦ
  choice: giữ nguyên “trong” và gắn với ý muốn của Đức Chúa Trời dành cho người tin
  alternative: diễn giải là “nhờ Đấng Mê-si-a” hoặc “đối với những người thuộc về Đấng Mê-si-a”
  rationale: Cú pháp Hy Lạp cho phép một mức độ rộng trong cách hiểu mối liên hệ của cụm giới từ. Giữ “trong” bảo tồn sự cô đọng và chiều sâu thần học thay vì âm thầm chọn một cách diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều ὑμᾶς một cách bao quát; dùng “Đấng Mê-si-a” để chuyển tải chức hiệu, với cách gọi truyền thống trong chú thích.
