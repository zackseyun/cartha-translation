revisions:
- from: Trong mọi hoàn cảnh, hãy tạ ơn[a], vì đây là ý muốn của Đức Chúa Trời dành cho anh chị em trong Đấng Mê-si-a là Chúa Giê-su.[b]
  to: Trong mọi hoàn cảnh, hãy tạ ơn[a], vì đây là ý muốn của Đức Chúa Trời dành cho anh chị em trong Đấng Mê-si-a Giê-su.[b]
  rationale: Chỉ bỏ «Chúa», một danh hiệu không hiện diện trong nguyên văn Hy Lạp, đồng thời giữ nguyên lựa chọn «trong mọi hoàn cảnh» có chú thích sát nghĩa và giữ giới từ «trong» của cụm ἐν Χριστῷ Ἰησοῦ.
