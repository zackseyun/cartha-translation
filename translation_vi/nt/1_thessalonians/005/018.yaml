    rationale: Χριστῷ Ἰησοῦ không có κύριος («Chúa»). Cấu trúc «là Chúa Giê-su» vừa thêm một danh hiệu không có trong câu nguồn, vừa chuyển cụm chức hiệu–tên thành mệnh đề đồng nhất. Nên dịch trực tiếp là «Đấng Mê-si-a Giê-su».
