  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: vi
  text: Hãy chào tất cả anh em bằng một cái hôn thánh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả anh chị em,” vì “anh em” có thể chỉ toàn thể cộng đồng tín hữu.'
    reason: lexical_alternative
  - marker: b
    text: “Cái hôn thánh” là một cử chỉ được công nhận trong văn hóa đương thời, bày tỏ tình thân và sự thông công giữa các tín hữu.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh trực tiếp ở ngôi thứ hai số nhiều; “hãy chào” tự nhiên, súc tích và giữ đúng ý nghĩa giao tiếp xã hội của ἀσπάζομαι.
- source_word: ἀδελφοὺς
  choice: anh em
  rationale: Danh từ Hy Lạp ở dạng giống đực số nhiều. “Anh em” vừa bám sát hình thức nguồn vừa là cách xưng gọi cộng đồng tín hữu quen thuộc trong tiếng Việt; khả năng bao gồm cả nam lẫn nữ được nêu ở chú thích.
- source_word: πάντας
  choice: tất cả
  rationale: Từ này nhấn mạnh toàn thể nhóm được nói đến; “tất cả” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: bằng cái hôn thánh
  rationale: ἐν diễn tả phương cách đi kèm nên được dịch là “bằng”; φίλημα là “cái hôn,” còn ἁγίῳ mô tả cái hôn ấy là thánh, thuộc về sự thông công thanh sạch của cộng đồng tín hữu.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί trong lời nói với hội chúng
  choice: anh em
  alternative: anh chị em
  rationale: Bản văn Hy Lạp dùng dạng giống đực số nhiều, nên phần chính giữ “anh em” để phản ánh hình thức nguồn. Tuy nhiên, từ này trong ngữ cảnh cộng đồng có thể chỉ toàn thể tín hữu, gồm cả nam và nữ; khả năng ấy được bảo lưu trong chú thích thay vì bị âm thầm giải quyết.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu mệnh lệnh dùng “Hãy” cho rõ lực khuyên bảo; giữ thành ngữ Kinh Thánh “cái hôn thánh” và giải thích bối cảnh văn hóa bằng chú thích.
