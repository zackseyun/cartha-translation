  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: vi
  text: Nhưng hãy kiểm nghiệm mọi điều[a]; điều gì tốt đẹp thì hãy giữ vững.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tất cả mọi sự”. Trong ngữ cảnh, lời dặn này đặc biệt bao gồm việc xem xét các lời tiên tri.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: mọi điều
  rationale: Đại từ/tính từ trung tính số nhiều đối cách có phạm vi bao quát. “Mọi điều” tự nhiên trong tiếng Việt và không thu hẹp câu lệnh chỉ vào các lời tiên tri.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ biểu thị sự chuyển ý có sắc thái tương phản nhẹ với những lời dặn ngay trước đó; “Nhưng” diễn đạt phù hợp trong ngữ cảnh.
- source_word: δοκιμάζετε
  choice: hãy kiểm nghiệm
  rationale: Động từ mệnh lệnh hiện tại chỉ việc xem xét, thử và đánh giá để nhận biết tính chân thật hoặc giá trị. “Kiểm nghiệm” giữ được ý nghĩa đánh giá có cân nhắc.
- source_word: τὸ καλὸν
  choice: điều gì tốt đẹp
  rationale: Tính từ trung tính số ít có mạo từ được dùng như danh từ. Cách diễn đạt này tự nhiên trong cấu trúc tiếng Việt và chỉ điều được xác nhận là tốt sau khi kiểm nghiệm.
- source_word: κατέχετε
  choice: hãy giữ vững
  rationale: Mệnh lệnh này mang ý nắm giữ, kiên trì gắn bó và không buông bỏ. “Giữ vững” truyền đạt lực nghĩa rõ hơn “giữ lại”.
theological_decisions:
- issue: Phạm vi của πάντα trong ngữ cảnh phân định lời tiên tri
  choice: Dịch bao quát là “mọi điều”, đồng thời ghi chú rằng ngữ cảnh trực tiếp đặc biệt bao gồm việc đánh giá các lời tiên tri.
  alternative: Thu hẹp thành “mọi lời tiên tri” hoặc “mọi điều được nói ra”.
  rationale: Câu Hy Lạp dùng πάντα mà không có danh từ giới hạn. Vì vậy, bản dịch giữ nguyên phạm vi rộng của mệnh lệnh, không biến một ứng dụng nổi bật trong ngữ cảnh thành toàn bộ ý nghĩa của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kiểm nghiệm” diễn tả sự xem xét có đánh giá; “giữ vững” nhấn mạnh sự kiên trì gắn bó với điều tốt đã được nhận biết.
