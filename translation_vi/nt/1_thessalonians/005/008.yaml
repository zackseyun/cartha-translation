id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: vi
  text: Nhưng vì chúng ta thuộc về ban ngày, hãy giữ mình tỉnh táo, mặc lấy áo giáp che ngực là đức tin[a] và tình yêu, đồng thời lấy niềm hy vọng về sự cứu rỗi làm mũ giáp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng trung tín”. Từ Hy Lạp pistis có thể mang nghĩa “đức tin”, “lòng tin cậy” hoặc “lòng trung tín”; ở đây bản văn chính dùng “đức tin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Nhưng vì chúng ta
  rationale: “Nhưng” thể hiện sự tương phản với những người thuộc về đêm trong ngữ cảnh trước; “vì” làm rõ quan hệ hợp lý giữa căn tính thuộc về ban ngày và lời khuyên theo sau.
- source_word: ἡμέρας ὄντες
  choice: thuộc về ban ngày
  rationale: Cách dịch này diễn đạt quan hệ thuộc về hay phạm vi của sở hữu cách, đồng thời giữ nguyên hình ảnh đối lập ngày–đêm của Phao-lô.
- source_word: νήφωμεν
  choice: hãy giữ mình tỉnh táo
  rationale: νήφω có thể chỉ sự không say và, theo nghĩa mở rộng, trạng thái tỉnh thức, tự chủ. “Giữ mình tỉnh táo” tự nhiên trong tiếng Việt và vẫn giữ được cả sắc thái tiết chế lẫn tỉnh thức trong ngữ cảnh.
- source_word: ἐνδυσάμενοι
  choice: mặc lấy
  rationale: Phân từ aorist trung động mô tả hành động đi kèm hoặc phương cách thực hiện lời khuyên. Dùng “mặc lấy” nối tiếp lời khuyên giúp câu tiếng Việt tự nhiên mà không áp đặt quan hệ thời gian kiểu “sau khi”.
- source_word: θώρακα
  choice: áo giáp che ngực
  rationale: Diễn đạt rõ loại giáp bảo vệ phần thân trên, giữ nguyên hình ảnh quân trang mà không dùng từ cổ khó hiểu.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong bộ ba đức tin, tình yêu và niềm hy vọng, “đức tin” là nghĩa phù hợp nhất; sắc thái “lòng trung tín” vẫn có thể có nên được ghi ở chú thích.
- source_word: ἀγάπης
  choice: tình yêu
  rationale: Đây là cách dịch trực tiếp, tự nhiên cho ἀγάπη trong bộ ba phẩm chất của câu.
- source_word: περικεφαλαίαν
  choice: mũ giáp
  rationale: Giữ hình ảnh quân trang và chức năng bảo vệ đầu, đồng thời tránh từ cổ “mão trụ”.
- source_word: ἐλπίδα σωτηρίας
  choice: niềm hy vọng về sự cứu rỗi
  rationale: Giữ cấu trúc danh từ và sự liên hệ có chủ ý giữa niềm hy vọng với sự cứu rỗi, thay vì giải thích quá cụ thể thời điểm hay phương diện của sự cứu rỗi.
theological_decisions:
- issue: Nghĩa của πίστις trong hình ảnh áo giáp
  choice: đức tin
  alternative: lòng trung tín; lòng tin cậy
  rationale: Việc ghép πίστις với tình yêu và niềm hy vọng nghiêng về phẩm chất “đức tin”, nhưng từ này cũng có thể mang nghĩa trung tín; chú thích bảo tồn khả năng ấy mà không quyết định thay cho văn bản.
- issue: Ý nghĩa của ἡμέρας ὄντες
  choice: thuộc về ban ngày
  alternative: là người của ban ngày
  rationale: Cách dịch được chọn giữ nguyên ẩn dụ về căn tính và phạm vi đạo đức, nhưng không thêm một giải thích giáo lý vượt quá câu văn.
- issue: Quan hệ giữa niềm hy vọng và sự cứu rỗi
  choice: niềm hy vọng về sự cứu rỗi
  alternative: niềm hy vọng được cứu rỗi
  rationale: Cụm sở hữu cách của tiếng Hy Lạp có thể được hiểu theo hướng đối tượng hay nội dung. Cách dịch chính giữ độ rộng của mối quan hệ này và tránh thu hẹp nó quá mức.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hình ảnh ngày–đêm và quân trang; dùng “áo giáp che ngực” và “mũ giáp” thay cho những thuật ngữ cổ. Nhịp câu khuyên nhủ được giữ tự nhiên, không biến phân từ ἐνδυσάμενοι thành một trình tự thời gian cứng nhắc.
