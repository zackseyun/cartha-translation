id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: vi
  text: 'Thưa anh em[a], chúng tôi khuyên anh em: hãy khuyên bảo những người sống vô kỷ luật[b], khích lệ những người nản lòng[c], nâng đỡ những người yếu đuối[d], và kiên nhẫn với mọi người.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em”; Phao-lô đang nói với toàn thể hội chúng.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “những người lười biếng” hoặc “những người vô trật tự”.
    reason: lexical_alternative
  - marker: c
    text: Hay “an ủi những người nhụt chí”.
    reason: lexical_alternative
  - marker: d
    text: Hay “hỗ trợ những người yếu đuối”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: chúng tôi khuyên
  rationale: Trong ngữ cảnh khuyên dạy, động từ diễn tả lời kêu gọi tha thiết; “khuyên” tự nhiên trong tiếng Việt hiện đại mà vẫn giữ được sức nặng của lời chỉ dẫn.
- source_word: δέ
  choice: không dịch thành một liên từ riêng
  rationale: δέ đánh dấu sự tiếp nối/chuyển ý nhẹ, không phải tương phản mạnh; cấu trúc xưng hô và dấu hai chấm truyền đạt tự nhiên sự chuyển ý này trong tiếng Việt.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức hô cách giống đực số nhiều của nguyên văn; trong ngữ cảnh, lời này hướng đến toàn thể hội chúng, điều được ghi rõ ở chú thích.
- source_word: νουθετεῖτε
  choice: khuyên bảo
  rationale: Diễn đạt sự chỉ bảo có tính sửa sai nhằm giúp người nghe thay đổi, nhưng không tạo sắc thái quá gay gắt.
- source_word: ἀτάκτους
  choice: những người sống vô kỷ luật
  rationale: Giữ nghĩa rộng của việc không sống đúng trật tự hoặc khuôn phép, không thu hẹp ngay thành sự lười biếng dù đó là một khả năng theo ngữ cảnh.
- source_word: παραμυθεῖσθε
  choice: khích lệ
  rationale: Động từ chỉ việc dùng lời lẽ nâng đỡ, an ủi và làm vững lòng; “khích lệ” phù hợp với chuỗi lời khuyên mục vụ.
- source_word: ὀλιγοψύχους
  choice: những người nản lòng
  rationale: Cách nói tự nhiên, dễ hiểu, diễn tả người thiếu can đảm hoặc suy sụp tinh thần mà không dùng từ cổ.
- source_word: ἀντέχεσθε
  choice: nâng đỡ
  rationale: Với đối tượng ở sở hữu cách, động từ mang ý gắn bó với, hỗ trợ hoặc chăm lo; “nâng đỡ” vừa tự nhiên vừa giữ sắc thái hỗ trợ bền bỉ.
- source_word: τῶν ἀσθενῶν
  choice: những người yếu đuối
  rationale: Giữ phạm vi nghĩa rộng, không xác định sự yếu đuối là thể chất, tinh thần, đạo đức hay xã hội.
- source_word: μακροθυμεῖτε
  choice: kiên nhẫn
  rationale: Diễn tả sự nhẫn nại lâu dài đối với con người bằng ngôn ngữ hiện đại, rõ ràng.
- source_word: πρὸς πάντας
  choice: với mọi người
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ trọn phạm vi phổ quát của mệnh lệnh.
theological_decisions:
- issue: Phạm vi bao gồm của ἀδελφοί khi nói với hội chúng
  choice: Dịch “anh em” trong chính văn và chú thích rằng lời xưng hô hướng đến toàn thể hội chúng.
  alternative: “anh chị em”
  rationale: “Anh em” giữ hình thức giống đực của nguyên văn, còn chú thích bảo tồn ý nghĩa bao gồm cả nam lẫn nữ trong hoàn cảnh hội chúng.
- issue: Loại yếu đuối được nói đến trong τῶν ἀσθενῶν
  choice: Giữ cách nói khái quát “những người yếu đuối”.
  alternative: Cụ thể hóa thành người đau yếu, yếu đức tin hoặc bất lực.
  rationale: Nguyên văn không chỉ rõ loại yếu đuối; không nên giải quyết sự mơ hồ theo một hướng thần học hoặc hoàn cảnh duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng chuỗi mệnh lệnh song song sau dấu hai chấm để phản ánh nhịp khuyên dạy của nguyên văn; tránh từ Hán-Việt quá chuyên biệt và không thu hẹp các từ có phạm vi nghĩa rộng.
