source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: vi
  text: Hãy coi chừng, đừng để ai đáp trả điều ác bằng điều ác đối với bất cứ người nào; nhưng hãy luôn ra sức làm điều tốt cho nhau và cho mọi người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “cho nhau và cho mọi người” có lẽ chuyển từ các tín hữu trong cộng đồng sang tất cả mọi người nói chung.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε μή τις
  choice: Hãy coi chừng, đừng để ai
  rationale: ὁρᾶτε được dùng theo nghĩa thành ngữ như một lời thúc giục cả cộng đồng phải lưu tâm và ngăn điều sắp nói xảy ra; cách diễn đạt này giữ được sắc thái cảnh giác của cấu trúc với μή τις.
- source_word: κακὸν ἀντὶ κακοῦ τινι ἀποδῷ
  choice: lấy điều ác báo điều ác cho bất cứ người nào
  rationale: Cụm 'điều ác báo điều ác' giữ nguyên công thức đáp trả tương xứng và phạm vi đạo đức rộng của κακόν; 'cho bất cứ người nào' thể hiện τινι là người nhận hành động đáp trả.
- source_word: πάντοτε
  choice: luôn
  rationale: Trạng từ chỉ thời gian được chuyển dịch ngắn gọn, tự nhiên và đầy đủ.
- source_word: τὸ ἀγαθὸν
  choice: điều tốt
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ điều tốt nói chung; 'điều tốt' tự nhiên trong tiếng Việt hiện đại.
- source_word: διώκετε
  choice: hãy ... theo đuổi
  rationale: Giữ sắc thái chủ động, bền bỉ và mạnh hơn việc chỉ mong muốn hoặc tìm kiếm.
- source_word: εἰς ἀλλήλους καὶ εἰς πάντας
  choice: đối với nhau và đối với mọi người
  rationale: Giữ cấu trúc song song và hướng tác động của εἰς, đồng thời không thêm đối tượng không được nêu trực tiếp trong câu.
theological_decisions:
- issue: Phạm vi của bổn phận làm điều tốt
  choice: Giữ nguyên sự chuyển tiếp từ 'đối với nhau' sang 'đối với mọi người'.
  alternative: '''Mọi người'' chỉ tất cả các tín hữu.'
  rationale: Hai cụm εἰς ἀλλήλους và εἰς πάντας tự nhiên gợi sự mở rộng từ quan hệ hỗ tương trong cộng đồng sang phạm vi rộng hơn, nhưng bản dịch chính không chèn lời giải thích này vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng mệnh lệnh số nhiều mang tính cộng đồng; duy trì sự lặp lại 'điều ác ... điều ác' và thế đối lập với 'điều tốt'.
