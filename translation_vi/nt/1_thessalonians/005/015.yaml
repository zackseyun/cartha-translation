revisions:
- from: Hãy coi chừng, đừng để ai lấy điều ác báo điều ác cho bất cứ người nào; nhưng hãy luôn theo đuổi điều tốt đối với nhau và đối với mọi người.[a]
  to: Hãy coi chừng, đừng để ai đáp trả điều ác bằng điều ác đối với bất cứ người nào; nhưng hãy luôn ra sức làm điều tốt cho nhau và cho mọi người.[a]
  rationale: Bản sửa làm rõ công thức báo trả “đáp trả điều ác bằng điều ác” và dùng “ra sức làm điều tốt” để chuyển tải sắc thái tích cực, bền bỉ của διώκετε bằng tiếng Việt tự nhiên. Không xác định thêm đối tượng của “mọi người” trong câu chính; nhận định phạm vi vẫn được giữ ở chú thích với mức độ dè dặt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:49Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc khuyến cáo của ὁρᾶτε μή τις, công thức κακὸν ἀντὶ κακοῦ, và sự mở rộng từ ἀλλήλους sang πάντας. Tuy nhiên, “báo điều ác ... cho bất cứ người nào” dễ hiểu là báo/đem điều ác cho một người, thay vì đáp trả điều ác bằng điều ác đối với bất cứ ai. Cần chỉnh để quan hệ đáp trả được rõ ràng.
  naturalness: “Theo đuổi điều tốt đối với nhau” khá sát chữ nhưng không thật tự nhiên trong tiếng Việt. “Ra sức làm điều tốt cho nhau” diễn đạt tự nhiên hơn, vẫn giữ tính chủ động và liên tục của διώκετε cùng hướng quan hệ của εἰς.
  terminology: “Điều ác,” “điều tốt,” “mọi người,” và lối mệnh lệnh số nhiều đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Đáp trả điều ác bằng điều ác” bảo toàn phép lặp và ý báo trả của nguyên văn.
  issues:
  - severity: medium
    issue: Cụm “lấy điều ác báo điều ác cho bất cứ người nào” mơ hồ về vai trò của “bất cứ người nào.”
    rationale: τινι là người mà hành vi báo trả hướng đến. Trong tiếng Việt, “báo ... cho” dễ gợi người nhận một điều ác, trong khi mệnh đề nguồn nói về việc đáp trả điều ác bằng điều ác đối với một người.
  - severity: low
    issue: “Theo đuổi điều tốt đối với nhau” không phải kết hợp từ tự nhiên.
    rationale: Cụm này có thể hiểu là theo đuổi một điều tốt trong tương quan với nhau, nhưng không diễn đạt rõ hành vi tích cực hướng đến người khác mà lời khuyên nhắm tới.
  revised_text: Hãy coi chừng, đừng để ai đáp trả điều ác bằng điều ác đối với bất cứ người nào; nhưng hãy luôn ra sức làm điều tốt cho nhau và cho mọi người.[a]
