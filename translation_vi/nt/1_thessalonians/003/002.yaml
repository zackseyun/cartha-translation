reference: 1 Thessalonians 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: vi
  text: và chúng tôi đã sai Ti-mô-thê, người anh em chúng tôi và là người cộng tác của Đức Chúa Trời[a] trong Tin Mừng của Đấng Mê-si-a[b], đến để củng cố và khích lệ anh chị em về đức tin của anh chị em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người cùng làm việc với Đức Chúa Trời.” Một số thủ bản có cách diễn đạt khác tại đây, chẳng hạn “người phục vụ Đức Chúa Trời.”'
    reason: alternative_reading
  - marker: b
    text: Tiếng Hy Lạp là Christos, thường được phiên là “Đấng Ki-tô”; tại đây dịch là “Đấng Mê-si-a” vì nghĩa tước hiệu nổi bật.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: chúng tôi đã sai
  rationale: Thì aorist được diễn đạt tự nhiên bằng hành động đã xảy ra; “sai” là cách nói trang trọng, quen thuộc khi cử một người đi làm nhiệm vụ.
- source_word: Τιμόθεον
  choice: Ti-mô-thê
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἀδελφὸν ἡμῶν
  choice: người anh em của chúng tôi
  rationale: Giữ hình ảnh gia đình trong nguyên văn và sắc thái gắn bó giữa những người tin.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: người cộng tác của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu/quan hệ của sở hữu cách Hy Lạp mà không làm yếu cách diễn đạt mạnh của nguyên văn; khả năng hiểu là “người cùng làm việc với Đức Chúa Trời” được nêu trong chú thích.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: trong Tin Mừng của Đấng Mê-si
  rationale: “Trong” diễn tả phạm vi hoạt động. Cấu trúc “Tin Mừng của” giữ được độ mở của sở hữu cách, không quyết định Tin Mừng do Đấng Mê-si ban hay Tin Mừng nói về ngài.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Trong kết cấu này, Χριστός nổi bật như một tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa ấy rõ ràng trong tiếng Việt hiện đại.
- source_word: εἰς τὸ στηρίξαι
  choice: đến để củng cố
  rationale: Kết cấu εἰς + động từ nguyên mẫu có mạo từ chỉ mục đích; “đến để” diễn đạt rõ mục đích của việc sai Ti-mô-thê.
- source_word: παρακαλέσαι
  choice: khích lệ
  rationale: Trong bối cảnh nâng đỡ đức tin, “khích lệ” giữ sắc thái hỗ trợ và động viên mà không thu hẹp nghĩa thành chỉ an ủi hay khuyên răn.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ cả cộng đoàn; “anh chị em” tự nhiên, bao hàm và duy trì sắc thái thân thuộc.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: về đức tin của anh chị em
  rationale: ὑπέρ với sở hữu cách ở đây có thể chỉ điều mà sự khích lệ hướng đến; “về” giữ cách diễn đạt rộng, không ép thành riêng nghĩa “vì lợi ích của”.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong văn cảnh này, πίστις chủ yếu nói đến lòng tin và sự nương cậy của tín hữu, nên “đức tin” là cách dịch chuẩn và thích hợp.
theological_decisions:
- issue: Cách dịch συνεργὸν τοῦ θεοῦ
  choice: người cộng tác của Đức Chúa Trời
  alternative: người cùng làm việc với Đức Chúa Trời; người phục vụ Đức Chúa Trời
  rationale: Bản văn SBLGNT có cách diễn đạt mạnh συνεργὸν τοῦ θεοῦ. Bản dịch không đổi thành “người phục vụ” chỉ để tránh sức căng thần học; chú thích bảo lưu cả khả năng diễn đạt quan hệ cộng tác và dị bản thủ bản.
- issue: Cách dịch Χριστοῦ trong εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Χριστός tại đây có sức nặng của một tước hiệu. “Đấng Mê-si” làm rõ nghĩa ấy, còn dạng truyền thống “Đấng Ki-tô” được ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” diễn đạt tự nhiên đại từ số nhiều của cộng đoàn; “Tin Mừng” và “đức tin” là các thuật ngữ phổ thông, không gắn riêng với một hệ phái. Dấu phẩy cuối câu được giữ vì câu này tiếp nối cú pháp từ câu trước và sang câu sau.
