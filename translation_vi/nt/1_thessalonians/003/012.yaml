id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: vi
  text: Còn xin Chúa làm cho anh chị em ngày càng gia tăng và tràn đầy tình yêu thương đối với nhau và đối với mọi người[a], cũng như chúng tôi yêu thương anh chị em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hướng đến nhau và hướng đến mọi người.”'
    reason: lexical_alternative
  - marker: b
    text: 'Mệnh đề cuối được tỉnh lược trong tiếng Hy Lạp, sát nghĩa là: “cũng như chúng tôi đối với anh chị em”; ý “yêu thương” được hiểu từ phần trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Còn
  rationale: Ở đây δέ chuyển nhẹ sang lời cầu chúc, không biểu thị sự tương phản mạnh. “Còn” nối câu tự nhiên với mạch trước.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu κύριος mà không giải thích thêm danh tính của đối tượng được nói đến ngay trong câu.
- source_word: πλεονάσαι καὶ περισσεύσαι
  choice: làm cho anh chị em ngày càng gia tăng và tràn đầy
  rationale: Hai động từ ở lối cầu chúc diễn tả sự tăng trưởng và dư dật. “Làm cho” nêu rõ Chúa là tác nhân, còn “gia tăng và tràn đầy” giữ hai ý song song và sắc thái nhấn mạnh.
- source_word: τῇ ἀγάπῃ
  choice: tình yêu thương
  rationale: Dịch ἀγάπη bằng cách nói phổ thông, trang trọng và phù hợp với quan hệ giữa người với người; cụm này chỉ phương diện trong đó họ được cầu xin cho gia tăng và tràn đầy.
- source_word: εἰς ἀλλήλους
  choice: đối với nhau
  rationale: Diễn đạt tự nhiên hướng của tình yêu giữa các thành viên trong cộng đồng, đồng thời không làm thay đổi quan hệ tương hỗ của ἀλλήλους.
- source_word: καὶ εἰς πάντας
  choice: và đối với mọi người
  rationale: πάντας được giữ với phạm vi rộng, không thu hẹp thành một nhóm cụ thể. “Mọi người” là cách nói tự nhiên trong tiếng Việt khi làm đối tượng của tình yêu.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: cũng như chúng tôi yêu thương anh chị em
  rationale: Mệnh đề Hy Lạp tỉnh lược động từ. Tiếng Việt cần bổ sung “yêu thương” từ văn cảnh để câu rõ và tự nhiên, nhưng chú thích vẫn ghi nhận hình thức nguyên văn.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Chỉ dịch là “Chúa”, không xác định thêm trong chính câu này.
  alternative: Hiểu cụ thể là Đấng Christ, hoặc hiểu theo nghĩa quy chiếu thần linh tổng quát hơn.
  rationale: κύριος là tước hiệu trong nguyên văn. Không thêm tên hay lời giải thích giúp bản dịch giữ nguyên khả năng quy chiếu theo văn cảnh thay vì áp đặt cách hiểu.
- issue: Phạm vi của πάντας
  choice: Dịch rộng là “mọi người”.
  alternative: “Mọi tín hữu” hoặc một nhóm giới hạn hơn.
  rationale: Nguyên văn không nêu rõ nhóm người nào. “Mọi người” bảo toàn độ rộng của câu và không thu hẹp tình yêu chỉ trong cộng đồng tín hữu.
translation_notes:
  register: 'Dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” diễn đạt số nhiều ngôi thứ hai trong lời gửi cộng đồng; “ngày càng” giúp lời cầu chúc về sự tăng trưởng nghe tự nhiên. Cấu trúc giữ cả hai động từ tăng cường ý nghĩa và đặt tình yêu theo hai hướng: trong cộng đồng và rộng đến mọi người.'
