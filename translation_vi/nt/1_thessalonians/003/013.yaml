revisions:
- from: để Ngài làm cho lòng anh chị em được vững vàng, không chỗ trách được trong sự thánh khiết trước mặt Đức Chúa Trời, là Cha chúng ta, khi Chúa chúng ta là Đức Chúa Jêsus quang lâm cùng tất cả các thánh của Ngài.[a]
  to: để Ngài làm cho lòng anh chị em được vững vàng, không có gì đáng trách trong sự thánh khiết trước mặt Đức Chúa Trời là Cha chúng ta, khi Chúa chúng ta là Giê-su quang lâm cùng tất cả các thánh của Ngài.[a]
  rationale: Bản sửa làm rõ tương ứng giữa tước hiệu «Chúa» và κύριος, chuẩn hóa tên «Giê-su» cho tiếng Việt hiện đại, và thay một thành ngữ cổ bằng cách nói tự nhiên hơn. Cụm «các thánh của Ngài» cùng chú thích vẫn bảo toàn sự mơ hồ của ἁγίων, không xác định đó là con người, thiên sứ hay cả hai.
