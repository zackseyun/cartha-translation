id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: vi
  text: để Ngài làm cho lòng anh chị em được vững vàng, không có gì đáng trách trong sự thánh khiết trước mặt Đức Chúa Trời là Cha chúng ta, khi Chúa chúng ta là Giê-su quang lâm cùng tất cả các thánh của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cùng tất cả những người thánh của Ngài.” Từ Hy Lạp được dịch là “các thánh” trong văn mạch này có thể chỉ những người thánh, các thiên sứ, hoặc cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: để Ngài làm cho ... được vững vàng
  rationale: Cấu trúc giới từ với động từ nguyên mẫu có mạo từ diễn tả mục đích hoặc kết quả nối tiếp câu trước; cách diễn đạt hữu hạn này tự nhiên trong tiếng Việt mà vẫn giữ lực chỉ mục đích.
- source_word: καρδίας
  choice: lòng
  rationale: Trong văn mạch Phao-lô, từ này chỉ con người bên trong, không chỉ cảm xúc; “lòng” là cách dịch tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἀμέμπτους ἐν ἁγιωσύνῃ
  choice: không chỗ trách được trong sự thánh khiết
  rationale: Giữ sắc thái không có căn cứ chính đáng để bị trách cứ, đồng thời diễn đạt ἁγιωσύνη như một phẩm chất hoặc trạng thái thánh khiết.
- source_word: ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: trước mặt Đức Chúa Trời, là Cha chúng ta
  rationale: “Trước mặt” diễn tả việc đứng trong sự hiện diện và dưới sự nhìn nhận của Đức Chúa Trời; dấu phẩy và “là” làm rõ rằng cùng một Đấng vừa là Đức Chúa Trời vừa là Cha chúng ta.
- source_word: ἐν τῇ παρουσίᾳ
  choice: khi ... quang lâm
  rationale: Trong văn mạch cánh chung, παρουσία chỉ sự đến và hiện diện của Chúa. “Quang lâm” là thuật ngữ tiếng Việt gọn, quen thuộc, diễn tả cuộc trở lại trong vinh quang.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: Chúa chúng ta là Đức Chúa Jêsus
  rationale: Giữ tước hiệu κύριος và tên riêng, đồng thời dùng cấu trúc tiếng Việt để xác định Jêsus là Chúa của chúng ta.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: cùng tất cả các thánh của Ngài
  rationale: “Các thánh” giữ nghĩa rộng của ἅγιοι là những hữu thể thuộc về Đức Chúa Trời và được biệt riêng cho Ngài; chú thích bảo toàn khả năng chỉ người thánh, thiên sứ, hoặc cả hai.
theological_decisions:
- issue: Đối tượng được gọi là πάντων τῶν ἁγίων αὐτοῦ
  choice: các thánh của Ngài
  alternative: những người thánh của Ngài; các thiên sứ thánh của Ngài
  rationale: Bản Hy Lạp không xác định rõ đây là các tín hữu được vinh hiển, các thiên sứ, hay cả hai. Bản dịch không thu hẹp đối tượng, và chú thích nêu rõ sự mơ hồ có thật.
- issue: Quan hệ trong cụm τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Đức Chúa Trời, là Cha chúng ta
  alternative: Đức Chúa Trời và Cha chúng ta
  rationale: Cách chọn diễn tả tự nhiên rằng một Đấng được gọi bằng cả hai danh xưng, tránh khả năng người đọc tiếng Việt hiểu lầm là hai đối tượng khác nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; dùng “quang lâm” vì ngắn gọn và quen thuộc trong văn liệu Cơ Đốc tiếng Việt, trong khi chú trọng ý nghĩa cánh chung của παρουσία. Danh xưng “Đức Chúa Jêsus” theo lối dùng Kinh Thánh tiếng Việt phổ biến.
