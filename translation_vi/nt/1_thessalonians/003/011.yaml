source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: vi
  text: Nguyện chính Đức Chúa Trời là Cha chúng ta và Chúa Giê-su của chúng ta[a] dẫn lối chúng tôi đến với anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong tiếng Hy Lạp, động từ “dẫn lối” ở số ít dù có hai chủ ngữ phối hợp: “Đức Chúa Trời là Cha chúng ta” và “Chúa Giê-su của chúng ta”.'
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “làm cho con đường chúng tôi đến với anh chị em được thẳng và thông suốt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: chính
  rationale: Dùng “chính” để giữ sắc thái nhấn mạnh đích thân của αὐτός, đồng thời đặt tự nhiên trước danh xưng trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu sự chuyển sang lời cầu nguyện hơn là sự tương phản rõ rệt; tiếng Việt không cần thêm “nhưng” hay “bây giờ” tại đây.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: Đức Chúa Trời, Cha chúng ta
  rationale: Giữ hai danh xưng cùng chỉ một Đấng, đồng thời diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: Chúa chúng ta là Đức Chúa Jêsus
  rationale: Giữ κύριος là “Chúa”, Ἰησοῦς là “Đức Chúa Jêsus”, và đại từ sở hữu “chúng ta”; từ “là” làm rõ quan hệ đồng vị tự nhiên trong tiếng Việt.
- source_word: κατευθύναι
  choice: dẫn đường
  rationale: Thể optative aorist được thể hiện bằng “Nguyện”; “dẫn đường” bao quát ý hướng dẫn và làm cho con đường đi thẳng hoặc thông suốt.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: dẫn đường chúng tôi
  rationale: Cách diễn đạt này tự nhiên hơn lối dịch sát “làm thẳng con đường của chúng tôi”, nhưng vẫn giữ hình ảnh hành trình thực tế đến Tê-sa-lô-ni-ca.
- source_word: πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Diễn đạt hướng chuyển động đến cộng đồng người nhận; “anh chị em” phù hợp với số nhiều và văn phong thư tín Cơ Đốc.
theological_decisions:
- issue: 'Động từ số ít đi với hai chủ thể phối hợp: Đức Chúa Trời là Cha và Chúa Jêsus'
  choice: Nêu rõ cả hai chủ thể trong một lời nguyện duy nhất và chú thích đặc điểm động từ số ít
  alternative: Tái cấu trúc để tránh đặc điểm số ít, hoặc hiểu động từ chủ yếu chỉ thuộc về Đức Chúa Trời
  rationale: Bản Hy Lạp đặt Đức Chúa Trời là Cha và Chúa Jêsus cạnh nhau làm chủ thể của một động từ số ít. Bản dịch giữ nguyên sự liên kết đáng chú ý ấy mà không suy diễn thêm về thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Nguyện” để thể hiện lời cầu chúc/cầu nguyện; dùng “anh chị em” cho ὑμᾶς số nhiều trong ngữ cảnh cộng đồng. Các dấu chú thích đều xuất hiện trong chính văn.
