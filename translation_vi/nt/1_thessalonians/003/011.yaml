revisions:
- from: Nguyện chính Đức Chúa Trời, Cha chúng ta, và Chúa chúng ta là Đức Chúa Jêsus[a], dẫn đường chúng tôi đến với anh chị em.[b]
  to: Nguyện chính Đức Chúa Trời là Cha chúng ta và Chúa Giê-su của chúng ta[a] dẫn lối chúng tôi đến với anh chị em.[b]
  rationale: Sửa danh xưng và chính tả tên riêng theo tiếng Việt chuẩn hiện đại, loại bỏ danh xưng được thêm vào không có trong nguồn, và thay cấu trúc đồng vị gượng bằng “Chúa Giê-su của chúng ta”. “Dẫn lối” giữ ý hướng dẫn/làm thẳng đường đi của κατευθύναι mà vẫn tự nhiên. Chú thích số ít được đặt sau toàn bộ cụm chủ ngữ để neo đúng hiện tượng ngữ pháp.
