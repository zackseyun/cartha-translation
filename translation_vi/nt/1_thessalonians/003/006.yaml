id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: vi
  text: Nhưng giờ đây, Ti-mô-thê vừa đến với chúng tôi từ chỗ anh chị em và báo tin vui cho chúng tôi về đức tin[a] và tình yêu thương của anh chị em, cũng cho biết anh chị em luôn nhớ đến chúng tôi với thiện cảm và mong mỏi được gặp chúng tôi, cũng như chúng tôi mong mỏi được gặp anh chị em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng trung tín.” Từ Hy Lạp pistis có thể mang nghĩa đức tin, sự tin cậy hoặc lòng trung tín.
    reason: Giữ lại phạm vi nghĩa của πίστις mà không buộc văn bản chính phải quyết định dứt khoát sắc thái có thể chồng lấn.
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Nhưng giờ đây
  rationale: Diễn tả sự chuyển ý nhẹ từ nỗi lo trước đó sang niềm nhẹ nhõm hiện tại; “giờ đây” cũng giữ sắc thái mới xảy ra khi đi với “vừa” trong mệnh đề kế tiếp.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Ti-mô-thê vừa từ chỗ anh chị em trở về với chúng tôi
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối sang mệnh đề hữu hạn tự nhiên trong tiếng Việt. “Vừa” thể hiện tính mới xảy ra của ἄρτι; “trở về” phù hợp với bối cảnh Ti-mô-thê đã được sai đến họ rồi quay lại với Phao-lô, dù động từ Hy Lạp đơn thuần là “đến”.
- source_word: εὐαγγελισαμένου
  choice: báo tin vui cho chúng tôi
  rationale: Trong ngữ cảnh này, động từ chỉ việc đem đến một bản tin tốt lành về hội thánh, không nhất thiết là hành vi rao giảng Tin Mừng; cách dịch vẫn giữ được sắc thái “tin vui” của động từ.
- source_word: τὴν πίστιν
  choice: đức tin
  rationale: “Đức tin” là cách dịch thông dụng và tự nhiên của πίστις trong văn mạch nói về việc họ tiếp tục tin; nghĩa khả dĩ “lòng trung tín” được giữ trong chú thích.
- source_word: τὴν ἀγάπην
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng và quen thuộc cho ἀγάπη trong tiếng Việt.
- source_word: μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: vẫn luôn nhớ tốt về chúng tôi
  rationale: Giữ khá sát ý “luôn có sự tưởng nhớ tốt đẹp về chúng tôi” nhưng tránh lối danh từ hóa nặng nề; không diễn giải quá mức thành “có thiện cảm” hay “nghĩ tốt”.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: mong mỏi được gặp chúng tôi
  rationale: “Mong mỏi” truyền đạt cường độ tình cảm của ἐπιποθέω bằng tiếng Việt hiện đại, tự nhiên.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: cũng như chúng tôi mong mỏi được gặp anh chị em
  rationale: Bổ sung động từ được tỉnh lược trong nguyên văn để câu tiếng Việt rõ nghĩa, đồng thời giữ sự mong nhớ tương hỗ.
theological_decisions:
- issue: πίστις có thể chỉ đức tin, sự tin cậy hoặc lòng trung tín
  choice: đức tin
  alternative: lòng trung tín
  rationale: Trong văn mạch, bản tin dường như nói đến việc tín hữu Tê-sa-lô-ni-ca vẫn vững tin, nên “đức tin” phù hợp nhất; tuy nhiên, trường nghĩa có thể bao hàm sự trung tín, vì vậy không loại bỏ khả năng ấy mà ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς nhằm biểu đạt cộng đồng gồm cả nam lẫn nữ. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 7.
