revisions:
- from: Nhưng giờ đây, Ti-mô-thê vừa từ chỗ anh chị em trở về với chúng tôi và báo tin vui cho chúng tôi về đức tin[a] và tình yêu thương của anh chị em, cũng cho biết anh chị em vẫn luôn nhớ tốt về chúng tôi và mong mỏi được gặp chúng tôi, cũng như chúng tôi mong mỏi được gặp anh chị em,
  to: Nhưng giờ đây, Ti-mô-thê vừa đến với chúng tôi từ chỗ anh chị em và báo tin vui cho chúng tôi về đức tin[a] và tình yêu thương của anh chị em, cũng cho biết anh chị em luôn nhớ đến chúng tôi với thiện cảm và mong mỏi được gặp chúng tôi, cũng như chúng tôi mong mỏi được gặp anh chị em,
