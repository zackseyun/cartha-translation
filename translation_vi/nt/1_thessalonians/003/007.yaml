id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: vi
  text: Vì vậy, thưa anh em[a], giữa mọi cảnh khốn khó và hoạn nạn của chúng tôi, chúng tôi đã được an ủi về phần anh em nhờ đức tin[b] của anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” là cách Phao-lô thường dùng để xưng hô với hội chúng và có thể bao gồm toàn thể cộng đồng tín hữu.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “lòng trung tín”. Từ Hy Lạp pistis có thể chỉ đức tin, sự tin cậy hoặc lòng trung tín; tại đây, từ này có lẽ cũng bao hàm sự kiên vững của người Tê-sa-lô-ni-ca trong đức tin.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân–kết quả với bản tin tốt lành vừa được nhắc đến ở câu trước.
- source_word: παρεκλήθημεν
  choice: chúng tôi đã được an ủi
  rationale: Thể bị động của παρακαλέω ở đây chỉ sự an ủi, nâng đỡ mà Phao-lô và các bạn đồng hành nhận được giữa nghịch cảnh.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của nguyên văn và dùng cách gọi trang trọng, tự nhiên trong tiếng Việt; chú thích nêu rõ phạm vi cộng đồng có thể rộng hơn nam giới.
- source_word: ἐφ’ ὑμῖν
  choice: về phần anh em
  rationale: Cho biết đối tượng mà sự an ủi liên quan đến, đồng thời tránh khiến người đọc hiểu rằng người Tê-sa-lô-ni-ca gây ra cảnh hoạn nạn.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: giữa mọi cảnh khốn khó và hoạn nạn của chúng tôi
  rationale: Diễn tả hoàn cảnh trong đó họ được an ủi; giữ cả hai danh từ gần nghĩa nói về áp lực và đau khổ.
- source_word: ἀνάγκῃ
  choice: cảnh khốn khó
  rationale: Trong ngữ cảnh chịu khổ, từ này nói đến tình trạng bức bách hơn là nghĩa trung tính 'sự cần thiết'.
- source_word: θλίψει
  choice: hoạn nạn
  rationale: Diễn đạt mức độ nghiêm trọng của áp lực và đau khổ bằng một từ quen thuộc, trang trọng trong tiếng Việt.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: nhờ đức tin của anh em
  rationale: διά với sở hữu cách biểu thị phương tiện hoặc nguyên do của sự an ủi; 'nhờ' tự nhiên trong tiếng Việt và vẫn giữ sắc thái phương tiện.
- source_word: πίστεως
  choice: đức tin
  rationale: Đây là cách dịch thông dụng của πίστις; trong ngữ cảnh, từ này cũng có thể nhấn mạnh lòng trung tín hoặc sự bền vững, nên khả năng ấy được giữ trong chú thích.
theological_decisions:
- issue: Nghĩa của πίστις khi sự kiên vững của tín hữu Tê-sa-lô-ni-ca cũng có thể được nhấn mạnh
  choice: đức tin
  alternative: lòng trung tín
  rationale: Nguyên văn có thể bao hàm cả sự tin cậy lẫn tính bền vững trong niềm tin. Bản chính giữ nghĩa thông dụng 'đức tin', còn chú thích bảo tồn sắc thái 'lòng trung tín' mà không buộc văn bản theo một cách hiểu duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu được điều chỉnh cho tự nhiên, đồng thời giữ rõ rằng sự an ủi liên quan đến người Tê-sa-lô-ni-ca và diễn ra giữa cảnh khốn khó của Phao-lô cùng các bạn đồng hành.
source_grounding:
  english_pob_role: consult_only
