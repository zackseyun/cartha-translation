id: 1TH.3.10
reference: 1 Thessalonians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νυκτὸς καὶ ἡμέρας ὑπερεκπερισσοῦ δεόμενοι εἰς τὸ ἰδεῖν ὑμῶν τὸ πρόσωπον καὶ καταρτίσαι τὰ ὑστερήματα τῆς πίστεως ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/010.yaml
  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: vi
  text: đêm ngày chúng tôi hết sức khẩn thiết cầu xin để được thấy mặt anh chị em và bổ sung những gì còn thiếu trong đức tin của anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bù đắp những gì còn thiếu trong đức tin của anh chị em.” Tiếng Hy Lạp cũng có thể được hiểu rộng hơn là kiện toàn hoặc củng cố những phương diện trong đức tin vẫn còn yếu hay chưa hoàn chỉnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: đêm ngày
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn tả hành động liên tục hoặc thường xuyên.
- source_word: ὑπερεκπερισσοῦ
  choice: hết sức khẩn thiết
  rationale: Diễn đạt sức nhấn mạnh đặc biệt của trạng từ hiếm này và bổ nghĩa tự nhiên cho việc cầu xin.
- source_word: δεόμενοι
  choice: cầu xin
  rationale: Phân từ chỉ lời cầu nguyện mang tính khẩn khoản; “cầu xin” giữ được sắc thái ấy mà không cường điệu.
- source_word: εἰς τὸ ἰδεῖν
  choice: để được thấy
  rationale: Cấu trúc giới từ với động từ nguyên mẫu có sắc thái mục đích; cách dịch này tự nhiên và giữ ý mong được gặp.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: mặt anh chị em
  rationale: Giữ hình ảnh cụ thể “mặt” của nguyên văn, đồng thời trong ngữ cảnh hàm ý được gặp trực tiếp.
- source_word: καταρτίσαι
  choice: bổ sung
  rationale: Trong kết hợp với “những gì còn thiếu”, từ này diễn tả việc cung ứng điều cần thiết để chỉnh đốn, kiện toàn hoặc làm vững mạnh.
- source_word: τὰ ὑστερήματα
  choice: những gì còn thiếu
  rationale: Giữ ý số nhiều của nguyên văn theo cách tự nhiên trong tiếng Việt, không quy kết họ hoàn toàn thiếu đức tin.
- source_word: τῆς πίστεως ὑμῶν
  choice: trong đức tin của anh chị em
  rationale: Diễn tả những phương diện còn cần được bổ sung hoặc củng cố trong đức tin của cộng đoàn.
theological_decisions:
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong ngữ cảnh này, từ chỉ đức tin/lòng tin của tín hữu đang cần được củng cố, chứ không chủ yếu nói đến đức tính trung tín; “đức tin” giữ thuật ngữ quen thuộc mà không phủ nhận sắc thái tin cậy.
- issue: Phạm vi nghĩa của καταρτίσαι τὰ ὑστερήματα
  choice: bổ sung những gì còn thiếu
  alternative: kiện toàn những gì còn yếu hoặc chưa hoàn chỉnh
  rationale: Nguyên văn có thể chỉ việc bù đắp điều thiếu, đồng thời rộng hơn là sửa sang, làm vững và đưa đến chỗ hoàn chỉnh; bản chính giữ cách diễn đạt gọn, còn chú thích bảo lưu độ rộng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm thể hiện lời nói với cả cộng đoàn. Giữ “thấy mặt” thay vì diễn giải hoàn toàn thành “gặp trực tiếp” để bảo tồn hình ảnh của nguyên văn.
