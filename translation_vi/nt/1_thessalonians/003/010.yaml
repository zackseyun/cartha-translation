  source_fidelity: 'Bản dịch truyền đạt chính xác các thành tố chính: νυκτὸς καὶ ἡμέρας là “đêm ngày”; ὑπερεκπερισσοῦ δεόμενοι là “hết sức khẩn thiết cầu xin”; εἰς τὸ ἰδεῖν ὑμῶν τὸ πρόσωπον là mục đích được gặp/thấy mặt độc giả; và καταρτίσαι τὰ ὑστερήματα τῆς πίστεως ὑμῶν là bổ sung những điều còn thiếu trong đức tin của họ. “Để được thấy mặt” là cách nói tiếng Việt tự nhiên, không làm mất mục đích của cấu trúc εἰς τὸ + nguyên mẫu.'
