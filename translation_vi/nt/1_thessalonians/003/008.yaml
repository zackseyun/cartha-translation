id: 1TH.3.8
reference: 1 Thessalonians 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι νῦν ζῶμεν ἐὰν ὑμεῖς στήκετε ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/008.yaml
  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: vi
  text: Vì[a] giờ đây chúng tôi sống[b], nếu anh em đứng vững trong Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bởi vì”; trong ngữ cảnh, từ này đưa ra lý do hoặc lời giải thích cho câu trước.'
    reason: lexical_alternative
  - marker: b
    text: “Chúng tôi sống” có lẽ là cách nói tu từ về niềm khích lệ hoặc sức sống được phục hồi, chứ không chỉ nói đến việc còn sống về thể xác.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, liên từ này nêu lý do hoặc lời giải thích cho sự an ủi vừa được nói đến. “Vì” giữ được quan hệ ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: νῦν
  choice: giờ đây
  rationale: Giữ rõ ý nghĩa thời gian hiện tại, đồng thời diễn đạt tự nhiên hơn “bây giờ” trong văn phong trang trọng.
- source_word: ζῶμεν
  choice: chúng tôi sống
  rationale: Dịch sát động từ hiện tại. Ngữ cảnh có thể hàm ý được hồi sinh tinh thần hoặc thêm sinh lực, nhưng bản văn chính không diễn giải quá mức.
- source_word: ἐὰν
  choice: nếu
  rationale: Giữ nguyên hình thức điều kiện của câu Hy Lạp, không đổi thành một lời khẳng định tuyệt đối.
- source_word: ὑμεῖς
  choice: anh em
  rationale: Đại từ số nhiều chỉ cộng đồng tín hữu Tê-sa-lô-ni-ca; “anh em” là cách xưng hô cộng đồng tự nhiên và trang trọng trong ngữ cảnh thư tín.
- source_word: στήκετε
  choice: đứng vững
  rationale: Diễn đạt sự kiên định, bền lòng; vừa sát nghĩa động từ vừa tự nhiên trong tiếng Việt.
- source_word: ἐν κυρίῳ
  choice: trong Chúa
  rationale: Giữ nguyên thành ngữ thần học rộng nghĩa của Phao-lô, không thu hẹp thành riêng ý trung thành hay hiệp nhất.
theological_decisions:
- issue: Ý nghĩa của câu “giờ đây chúng tôi sống”
  choice: Giữ nguyên cách nói “chúng tôi sống”, để câu có thể được hiểu như lời diễn tả sức sống và niềm khích lệ được phục hồi.
  alternative: Diễn giải thành “chúng tôi như được sống lại” hoặc hiểu gần như theo nghĩa đen rằng đời sống hay chức vụ của Phao-lô tùy thuộc vào sự bền vững của họ.
  rationale: Cách nói Hy Lạp mang hình thức trực tiếp nhưng có sức tu từ rõ rệt trong ngữ cảnh mục vụ. Bản dịch giữ sự căng thẳng này thay vì quyết định thay người đọc.
- issue: Ý nghĩa của “trong Chúa”
  choice: Giữ “trong Chúa” như một cách nói bao quát về phạm vi và mối liên hệ trong đó họ đứng vững.
  alternative: “hiệp nhất với Chúa” hoặc “trung thành với Chúa”.
  rationale: Các cách diễn giải thay thế có thể làm rõ một phương diện, nhưng sẽ thu hẹp chiều rộng thần học của thành ngữ Phao-lô.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc cô đọng và điều kiện của nguyên văn; “anh em” được dùng theo lối xưng hô cộng đồng trong thư tín.
