source:
  edition: SBLGNT
  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: vi
  text: để không ai bị dao động vì những hoạn nạn này.[a][b] Vì chính anh chị em biết rằng chúng ta được định để chịu những điều ấy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị xao động” hoặc “bị bất an”; trong những ngữ cảnh khác, động từ hiếm này còn có thể mang nghĩa “bị lừa dối” hoặc “bị lấy lòng bằng lời nịnh nọt”.
    reason: lexical_alternative
  - marker: b
    text: “Hoạn nạn” cũng có thể dịch là “gian truân” hoặc “khốn khó”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “chúng ta được đặt vào hoàn cảnh ấy” hoặc “đó là phần đã dành cho chúng ta”.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: để không một ai bị dao động
  rationale: Mạo từ đi với động từ nguyên mẫu tiếp nối ý câu trước và diễn tả mục đích/kết quả. Động từ hiếm σαίνεσθαι trong ngữ cảnh này chỉ việc bị lay chuyển hoặc bất an; “bị dao động” tự nhiên và giữ được hình ảnh ấy.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: vì những hoạn nạn này
  rationale: θλῖψις chỉ cảnh khốn khó, áp lực hay hoạn nạn. Với “bị dao động”, giới từ ἐν được diễn đạt tự nhiên bằng “vì”, nêu hoàn cảnh/nguyên nhân gây dao động.
- source_word: αὐτοὶ
  choice: chính anh chị em
  rationale: Đại từ mang tính nhấn mạnh; “chính anh chị em” bảo toàn sắc thái ấy và phù hợp cách xưng hô cộng đồng trong thư.
- source_word: γὰρ
  choice: '[hàm ý giải thích qua câu kế tiếp]'
  rationale: γάρ đưa ra lý do giải thích. Trong tiếng Việt, quan hệ này đã rõ khi câu bắt đầu bằng “Chính anh chị em biết rằng”; thêm “vì” sẽ kém tự nhiên sau mệnh đề mục đích đứng độc lập theo phạm vi trích dẫn.
- source_word: οἴδατε
  choice: biết
  rationale: 'Dù có hình thái hoàn thành, οἴδατε mang nghĩa hiện tại thông thường: “biết”.'
- source_word: εἰς τοῦτο
  choice: để chịu những điều ấy
  rationale: Cụm từ quy chiếu về các hoạn nạn vừa nói. Trong tiếng Việt cần bổ sung “chịu” để tránh cách nói mơ hồ hoặc không tự nhiên như “được định cho điều này”, nhưng không xác định thêm bản chất của sự định đặt.
- source_word: κείμεθα
  choice: chúng ta đã được định
  rationale: κεῖμαι theo nghĩa đen là được đặt/nằm, còn trong thành ngữ này mang nghĩa được ấn định hoặc dành cho. “Đã được định” giữ sắc thái bị động và sức nặng thần học mà không nói rõ tác nhân ngoài điều bản văn cho phép.
theological_decisions:
- issue: Mối liên hệ của người tin với hoạn nạn trong εἰς τοῦτο κείμεθα
  choice: chúng ta đã được định để chịu những điều ấy
  alternative: chúng ta được đặt vào hoàn cảnh ấy; đó là phần đã dành cho chúng ta
  rationale: Cách dịch cho thấy hoạn nạn là điều được dự liệu trong đời sống môn đồ, nhưng không biến câu này thành một tuyên bố chi tiết về tiền định hoặc chỉ rõ tác nhân khi nguyên văn không nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho số nhiều cộng đồng và “chúng ta” để giữ sự bao gồm của ngôi thứ nhất số nhiều. Các dấu chú thích đặt ngay sau từ/cụm từ liên quan, theo thứ tự xuất hiện.
