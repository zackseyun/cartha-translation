- from: Vì thế, khi không thể chịu đựng lâu hơn nữa[a], chúng tôi thấy tốt hơn nên ở lại một mình tại A-thên[b].
  to: Vì thế, không thể chịu đựng thêm được nữa[a], chúng tôi đã bằng lòng bị để lại ở A-thên, một mình[b].
  rationale: Bản sửa loại bỏ so sánh không có trong nguyên văn, phục hồi thể bị động của καταλειφθῆναι trong phần chính, và dùng cách diễn đạt tự nhiên hơn cho μηκέτι στέγοντες. Chú thích b nêu một phương án Việt ngữ trôi chảy hơn, đồng thời minh định đặc điểm bị động của tiếng Hy Lạp.
