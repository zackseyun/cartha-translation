base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: vi
  text: Vì thế, không thể chịu đựng thêm được nữa[a], chúng tôi đã bằng lòng bị để lại ở A-thên, một mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể cầm lòng thêm được nữa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “chúng tôi đã quyết định ở lại A-thên một mình.” Bản văn Hy Lạp dùng thể bị động: “bị để lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Vì thế
  rationale: Diễn tả kết luận suy ra từ mạch văn trước đó bằng một liên từ tự nhiên trong tiếng Việt hiện đại.
- source_word: μηκέτι στέγοντες
  choice: khi không thể chịu đựng lâu hơn nữa
  rationale: Kết hợp trạng từ μηκέτι với phân từ στέγοντες để diễn đạt giới hạn chịu đựng trước nỗi lo cho tín hữu Tê-sa-lô-ni-ca; cách dịch này tự nhiên mà vẫn giữ sắc thái chịu đựng.
- source_word: εὐδοκήσαμεν
  choice: chúng tôi thấy tốt hơn
  rationale: Trong ngữ cảnh quyết định chấp nhận một hoàn cảnh, cụm này giữ sắc thái đánh giá thuận và tự nguyện, không hàm ý rằng họ vui thích vì bị bỏ lại.
- source_word: καταλειφθῆναι
  choice: nên ở lại
  rationale: Dịch tự nhiên kết quả của thể bị động trong tiếng Việt; chú thích bảo lưu cách dịch sát hình thức hơn là “bị để lại”.
- source_word: ἐν Ἀθήναις
  choice: tại A-thên
  rationale: Cách diễn đạt địa điểm trang trọng, rõ nghĩa; dùng dạng địa danh quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: μόνοι
  choice: một mình
  rationale: Giữ nguyên hình thức số nhiều của chủ thể qua “chúng tôi” nhưng dùng thành ngữ tiếng Việt tự nhiên “ở lại một mình”, không quyết định nhóm ấy thực tế gồm bao nhiêu người.
theological_decisions:
- issue: Chủ thể của ngôi thứ nhất số nhiều và sự căng thẳng số ít/số nhiều trong bối cảnh rộng hơn
  choice: Giữ “chúng tôi” theo εὐδοκήσαμεν và không đổi thành lời nói số ít của Phao-lô.
  alternative: Dịch “tôi thấy tốt hơn nên ở lại một mình”, xem số nhiều là lối nói thư tín hoặc điều hòa với một cách tái dựng lịch sử dựa trên Công Vụ.
  rationale: Bản Hy Lạp dùng động từ và tính từ số nhiều. Bản dịch không nên tự giải quyết câu hỏi liệu “chúng tôi” chỉ chủ yếu về Phao-lô hay về cả nhóm truyền giáo.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ quan hệ suy luận, cảm xúc bị dồn đến giới hạn và ngôi thứ nhất số nhiều của nguyên văn; các cách dịch sát hình thức hoặc giàu sắc thái cảm xúc hơn được nêu trong chú thích.
