reference: 1 Thessalonians 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: vi
  text: Vì chúng tôi có thể dâng lại cho Đức Chúa Trời lời cảm tạ nào về anh em[a], vì tất cả niềm vui mà chúng tôi cảm nhận nhờ anh em trước mặt Đức Chúa Trời chúng ta?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể diễn đạt tự nhiên hơn: “Làm sao chúng tôi có thể cảm tạ Đức Chúa Trời cho đủ về anh em?” Nguyên văn sát hơn là: “Chúng tôi có thể dâng lại cho Đức Chúa Trời lời cảm tạ nào về anh em?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα … εὐχαριστίαν
  choice: lời cảm tạ nào
  rationale: Giữ nguyên dạng nghi vấn trực tiếp và danh từ “lời cảm tạ”, qua đó thể hiện rằng không lời cảm tạ nào có thể tương xứng với niềm vui của Phao-lô.
- source_word: δυνάμεθα
  choice: chúng tôi có thể
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên sắc thái câu hỏi tu từ về khả năng.
- source_word: ἀνταποδοῦναι
  choice: dâng lại
  rationale: “Dâng” phù hợp với lời cảm tạ hướng về Đức Chúa Trời, còn “lại” giữ ý hồi đáp của động từ Hy Lạp mà không gợi quá mạnh một món nợ vật chất.
- source_word: περὶ ὑμῶν
  choice: về anh em
  rationale: Diễn đạt phạm vi hoặc đối tượng được nhắc đến, đồng thời phân biệt với δι’ ὑμᾶς ở phần sau.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: để đáp lại tất cả niềm vui
  rationale: ἐπί với cách dữ ở đây nêu cơ sở hoặc nguyên do của lời cảm tạ. Cụm “để đáp lại” giúp câu tiếng Việt liên kết tự nhiên với ἀνταποδοῦναι, dù cũng có thể dịch sát hơn là “vì tất cả niềm vui”.
- source_word: ᾗ χαίρομεν
  choice: mà chúng tôi vui hưởng
  rationale: Diễn đạt tự nhiên mối liên hệ giữa “niềm vui” và hành động vui mừng; “vui hưởng” giữ nội dung mà tránh lối lặp vụng “niềm vui mà chúng tôi vui mừng”.
- source_word: δι’ ὑμᾶς
  choice: nhờ anh em
  rationale: διά với đối cách chỉ nguyên nhân. “Nhờ anh em” truyền đạt nguyên nhân tích cực của niềm vui; “vì anh em” cũng có thể dùng nhưng dễ trùng với các quan hệ từ khác trong câu.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: trước mặt Đức Chúa Trời chúng ta
  rationale: Giữ hình ảnh không gian của nguyên văn về sự hiện diện của Đức Chúa Trời và dịch ἡμῶν theo nghĩa bao hàm tự nhiên trong ngữ cảnh.
theological_decisions:
- issue: Hình ảnh dâng lại hoặc báo đáp lời cảm tạ cho Đức Chúa Trời
  choice: Giữ ý hồi đáp bằng cụm “dâng lại Đức Chúa Trời lời cảm tạ nào”.
  alternative: “Làm sao chúng tôi có thể cảm tạ Đức Chúa Trời cho đủ về anh em?”
  rationale: Động từ ἀνταποδοῦναι có ý trao lại để đáp lại. Câu hỏi tu từ cho thấy sự bất tương xứng của lòng biết ơn, chứ không dạy rằng con người có thể trả một món nợ ngang giá cho Đức Chúa Trời.
- issue: Quan hệ giữa niềm vui và sự hiện diện của Đức Chúa Trời
  choice: Gắn “trước mặt Đức Chúa Trời chúng ta” với việc vui hưởng niềm vui.
  alternative: Hiểu rộng hơn rằng toàn bộ hành động cảm tạ và vui mừng diễn ra trong sự hiện diện của Đức Chúa Trời.
  rationale: Trật tự Hy Lạp đặt cụm này sau mệnh đề nói về sự vui mừng, nhưng không loại trừ việc nó phủ nghĩa rộng hơn; bản dịch không thêm lời giải thích để thu hẹp sự mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” được dùng theo lối xưng hô cộng đồng trong thư tín Tân Ước; câu hỏi tu từ và hình ảnh “dâng lại” được giữ, nhưng cấu trúc được điều chỉnh vừa đủ để tự nhiên trong tiếng Việt.
