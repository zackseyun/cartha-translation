id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: vi
  text: Vì lý do đó, khi không thể chịu đựng thêm được nữa, tôi cũng đã sai người đi để biết đức tin của anh chị em[a], e rằng kẻ cám dỗ đã cám dỗ anh chị em và công khó của chúng tôi trở nên vô ích[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng tin” hoặc “sự trung tín của anh chị em.” Từ Hy Lạp có thể mang những sắc thái gần nhau tùy ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: Hay “thành ra uổng công” hoặc “trở thành công cốc.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì lý do đó
  rationale: Giữ quan hệ nguyên nhân và sự quy chiếu về lời giải thích ngay trước đó.
- source_word: κἀγὼ
  choice: chính tôi cũng
  rationale: Thể hiện cả yếu tố καί (‘cũng’) lẫn sắc thái nhấn mạnh của đại từ ἐγώ, phù hợp mạch văn sau câu 1, nơi Phao-lô nói về việc ‘chúng tôi’ sai Ti-mô-thê đi.
- source_word: μηκέτι στέγων
  choice: không thể chịu đựng thêm được nữa
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt sức chịu đựng đã đến giới hạn.
- source_word: ἔπεμψα
  choice: đã sai người đi
  rationale: Động từ không nêu tân ngữ trong câu này; ‘người’ cho câu tiếng Việt được trọn nghĩa nhưng không đưa tên Ti-mô-thê từ ngữ cảnh vào bản văn.
- source_word: εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν
  choice: để biết tình trạng đức tin của anh chị em
  rationale: Diễn đạt mục đích tìm hiểu và làm rõ rằng điều Phao-lô muốn biết là tình trạng đức tin của họ, thay vì hàm ý trước đó ông không biết họ có đức tin.
- source_word: μή πως
  choice: vì e rằng
  rationale: Truyền đạt tự nhiên sắc thái lo ngại của mệnh đề mà không biến điều Phao-lô e sợ thành một sự kiện chắc chắn.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: kẻ cám dỗ đã cám dỗ anh chị em
  rationale: Giữ phép lặp giữa phân từ chỉ chủ thể và động từ; ‘cám dỗ’ hợp với ngữ cảnh lôi kéo họ lìa khỏi đức tin hơn ‘thử thách’ trung tính.
- source_word: εἰς κενὸν γένηται
  choice: trở nên vô ích
  rationale: Giữ động thái của γένηται (‘trở nên’) và diễn đạt thành ngữ εἰς κενόν một cách tự nhiên trong tiếng Việt.
- source_word: ὁ κόπος ἡμῶν
  choice: công khó của chúng tôi
  rationale: ‘Công khó’ giữ sắc thái lao nhọc, vất vả của κόπος rõ hơn từ ‘công việc’ chung chung.
theological_decisions:
- issue: Sắc thái của πίστις trong cụm τὴν πίστιν ὑμῶν
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong ngữ cảnh, từ này tự nhiên nhất chỉ đức tin đang tiếp tục của tín hữu Tê-sa-lô-ni-ca; tuy vậy, πίστις có thể mang các sắc thái gần nhau là lòng tin hoặc sự trung tín, nên ghi nhận trong chú thích thay vì giải quyết dứt khoát.
- issue: Thân phận của ὁ πειράζων
  choice: kẻ cám dỗ
  alternative: Sa-tan; kẻ thử thách
  rationale: Ngữ cảnh gợi đến Sa-tan, nhưng tiếng Hy Lạp dùng danh xưng mô tả chứ không nêu tên riêng; bản dịch giữ nguyên cách gọi ấy và không làm trung tính ý xấu bằng ‘kẻ thử thách’.
- issue: Tính chưa chắc chắn trong điều Phao-lô lo ngại
  choice: vì e rằng ... đã ... và ... trở nên
  alternative: phòng khi ... có thể đã ... và ... có thể trở nên
  rationale: μή πως với lối giả định biểu thị nỗi lo chứ không khẳng định kết quả. Cấu trúc ‘e rằng’ của tiếng Việt đã bao quát cả hai vế phối hợp, giữ độ bất định mà không làm câu nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘anh chị em’ để chuyển số nhiều ὑμῶν theo lối xưng hô cộng đồng tự nhiên; dùng ‘công khó’ để giữ sắc thái lao nhọc. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt đúng sau các cụm liên quan.
