revisions:
- from: Vì lý do đó, chính tôi cũng không thể chịu đựng thêm được nữa, nên đã sai người đi để biết tình trạng đức tin của anh chị em[a], vì e rằng kẻ cám dỗ đã cám dỗ anh chị em, và công khó của chúng tôi trở nên vô ích[b].
  to: Vì lý do đó, khi không thể chịu đựng thêm được nữa, tôi cũng đã sai người đi để biết đức tin của anh chị em[a], e rằng kẻ cám dỗ đã cám dỗ anh chị em và công khó của chúng tôi trở nên vô ích[b].
  rationale: Loại bỏ hai yếu tố diễn giải/nhấn mạnh không cần thiết («tình trạng», «chính») để bám sát nguyên ngữ hơn, đồng thời giữ nguyên nghĩa, độ bất định của nỗi lo, các thuật ngữ chính, và toàn bộ hệ thống chú thích.
