reference: 1 Thessalonians 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: vi
  text: Vì ngay cả khi còn ở với anh chị em, chúng tôi vẫn báo trước với anh chị em rằng sẽ phải chịu hoạn nạn[a], đúng như đã xảy ra, và anh chị em biết rõ điều đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có thể chỉ việc chịu áp lực, khốn khó hoặc ngược đãi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Thật vậy, ngay
  rationale: Diễn đạt sức giải thích và nhấn mạnh của γάρ và καί một cách tự nhiên trong tiếng Việt, nối câu này với lời vừa nói ở câu trước.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: khi còn ở với anh chị em
  rationale: πρὸς ὑμᾶς với ἦμεν chỉ việc hiện diện và sống giữa cộng đồng; “ở với” tự nhiên và giữ sắc thái quan hệ.
- source_word: προελέγομεν ὑμῖν
  choice: chúng tôi đã nhiều lần báo trước
  rationale: Thì chưa hoàn thành gợi hành động lặp lại hoặc tiếp diễn; “nhiều lần” chuyển tải phương diện ấy. “Báo trước” giữ nghĩa nói trước mà không thu hẹp thành cảnh cáo.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: rằng chúng ta sẽ phải chịu hoạn nạn
  rationale: μέλλομεν diễn tả điều sắp hoặc chắc sẽ xảy đến; “sẽ phải” tự nhiên trong tiếng Việt. Đại từ ngôi thứ nhất số nhiều được giữ là “chúng ta” vì trong diễn ngôn trực tiếp trước đây, dạng bao gồm người nghe là khả dĩ và phù hợp với bối cảnh các tín hữu cũng chịu khổ, nhưng tiếng Hy Lạp tự nó không phân biệt bao gồm hay loại trừ.
- source_word: θλίβεσθαι
  choice: chịu hoạn nạn
  rationale: Giữ phạm vi nghĩa về áp lực, khốn khó và sự ngược đãi mà không giới hạn vào một loại đau khổ cụ thể hay biến từ này thành thuật ngữ cánh chung.
- source_word: καθὼς καὶ ἐγένετο
  choice: Điều ấy quả đã xảy ra
  rationale: “Quả” thể hiện sắc thái xác nhận của καί trong sự tương ứng giữa lời báo trước và sự việc đã xảy ra; tách thành câu mới giúp tiếng Việt sáng rõ.
- source_word: καὶ οἴδατε
  choice: và anh chị em biết rõ
  rationale: Giữ cấu trúc phối hợp của καί; “biết rõ” diễn đạt tự nhiên sự hiểu biết trực tiếp của người nhận thư, với đối tượng đã nêu ở mệnh đề trước.
theological_decisions:
- issue: Phạm vi của θλίβεσθαι
  choice: hoạn nạn nói chung, có thể bao gồm sự ngược đãi
  alternative: chỉ sự ngược đãi cụ thể, hoặc “đại nạn” theo nghĩa cánh chung chuyên biệt
  rationale: Ngữ cảnh nói đến chống đối và khổ đau, nhưng động từ không tự nó giới hạn vào một hình thức bách hại hay một biến cố cánh chung chuyên biệt.
- issue: Tính bao gồm của μέλλομεν (“chúng tôi/chúng ta”)
  choice: “chúng ta” trong nội dung lời báo trước
  alternative: “chúng tôi” chỉ Phao-lô và các cộng sự
  rationale: Tiếng Hy Lạp không phân biệt đại từ ngôi thứ nhất số nhiều bao gồm hay loại trừ. Bối cảnh gần nói cả các sứ đồ lẫn tín hữu Tê-sa-lô-ni-ca chịu hoạn nạn, nên “chúng ta” là cách hiểu khả dĩ; chú thích bảo tồn điểm mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chuyển tải cách xưng hô cộng đồng thân tình; tránh thuật ngữ kỹ thuật hoặc cách diễn đạt cổ. Nhịp câu được chia đôi để tiếng Việt tự nhiên mà vẫn giữ quan hệ giữa lời báo trước và sự ứng nghiệm.
