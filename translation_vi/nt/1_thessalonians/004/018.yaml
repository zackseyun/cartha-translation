  text: Therefore encourage one another with these words[a].
translation:
  language: vi
  text: Vậy, hãy dùng những lời này mà khích lệ nhau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy dùng những lời này mà an ủi nhau.” Động từ Hy Lạp có thể mang nghĩa khích lệ, an ủi hoặc khuyên nhủ; trong văn cảnh này, sắc thái trấn an đặc biệt nổi bật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Liên từ này rút ra kết luận từ lời dạy ngay trước đó về sự Chúa đến và sự sống lại; “Vậy” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: παρακαλεῖτε
  choice: hãy… khích lệ
  rationale: Động từ có thể chỉ sự khích lệ, an ủi hoặc khuyên nhủ. Trong bối cảnh trấn an về những tín hữu đã qua đời và cuộc đoàn tụ tương lai, “khích lệ” giữ được nghĩa rộng, đồng thời bao hàm sắc thái an ủi.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Diễn đạt tự nhiên tính tương hỗ của đại từ Hy Lạp.
- source_word: ἐν
  choice: dùng… mà
  rationale: Giới từ chỉ phương tiện ở đây; cấu trúc “dùng những lời này mà…” truyền đạt tự nhiên ý nghĩa ‘bằng/qua những lời này’.
- source_word: τοῖς λόγοις τούτοις
  choice: những lời này
  rationale: Cụm từ quy chiếu trực tiếp đến những điều Phao-lô vừa trình bày, nên “những lời này” vừa sát nguồn vừa rõ ràng.
theological_decisions:
- issue: Sắc thái của παρακαλεῖτε
  choice: khích lệ
  alternative: an ủi; khuyên nhủ
  rationale: Không thu hẹp động từ vào riêng sự an ủi hay khuyên bảo; ngữ cảnh mang tính trấn an, nhưng từ Hy Lạp vẫn có phạm vi nghĩa rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “dùng những lời này mà…” làm rõ phương tiện khích lệ mà không khiến câu trở nên nặng nề.
