id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: vi
  text: Vì nếu chúng ta tin rằng Giê-su đã chết và sống lại, thì cũng vậy, Đức Chúa Trời sẽ đem những người đã an giấc[a] qua Giê-su[b] đến cùng với Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người đã chết.” Trong văn cảnh này, Phao-lô dùng “an giấc” như một hình ảnh nói về sự chết của các tín hữu.'
    reason: lexical_alternative
  - marker: b
    text: Cụm “qua Giê-su” có thể nói đến tác nhân hoặc phương tiện; cũng có người hiểu cụm này theo nghĩa “những người đã an giấc trong Giê-su” hoặc “vì Giê-su.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả ý giải thích/suy luận của γάρ và điều kiện của εἰ, đồng thời nối tự nhiên với câu trước.
- source_word: πιστεύομεν
  choice: chúng ta tin
  rationale: Diễn đạt niềm tin chung được tuyên xưng về sự chết và sống lại của Giê-su.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Phiên âm tên riêng theo cách viết tiếng Việt hiện đại, không thêm tước hiệu vốn không có trong nguyên văn.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: đã chết và sống lại
  rationale: Hai động từ aorist chỉ các biến cố đã xảy ra; ἀνέστη là nội động từ nên “sống lại” thích hợp hơn cách diễn đạt bị động “được làm cho sống lại”.
- source_word: οὕτως καὶ
  choice: thì cũng vậy
  rationale: Giữ mối tương ứng giữa sự sống lại của Giê-su và hành động Đức Chúa Trời sẽ thực hiện đối với các tín hữu đã qua đời.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt dành cho θεός trong ngữ cảnh nói về Đức Chúa Trời duy nhất.
- source_word: τοὺς κοιμηθέντας
  choice: những người đã an giấc
  rationale: Giữ hình ảnh “ngủ” mà Phao-lô dùng cho cái chết, nhưng dùng cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: qua Giê-su
  rationale: Giữ nghĩa phương tiện hoặc tác nhân thông thường của διά với sở hữu cách mà không quyết định dứt khoát mối liên hệ cú pháp đang được tranh luận.
- source_word: ἄξει
  choice: sẽ đem ... đến
  rationale: Thể hiện thì tương lai và ý chính của ἄγω là đưa hoặc đem người nào đó đến.
- source_word: σὺν αὐτῷ
  choice: cùng với Ngài
  rationale: Giữ ý đồng hành của σύν và đại từ của nguyên văn; trong ngữ cảnh, “Ngài” chỉ về Giê-su.
theological_decisions:
- issue: Hình ảnh κοιμηθέντας nói về sự chết
  choice: Giữ hình ảnh bằng cụm “đã an giấc”.
  alternative: “đã chết” hoặc “đã qua đời”
  rationale: Hình ảnh ngủ vừa thừa nhận thực tại cái chết vừa phù hợp với niềm hy vọng sống lại trong văn cảnh; chú thích làm rõ để tránh hiểu là giấc ngủ thông thường.
- issue: Quan hệ của διὰ τοῦ Ἰησοῦ
  choice: Dịch “qua Giê-su” trong chính văn và nêu cách hiểu khác trong chú thích.
  alternative: “trong Giê-su”, “nhờ Giê-su” hoặc “vì Giê-su”
  rationale: Cụm từ có thể nói đến tác nhân/phương tiện, nguyên nhân, hoặc được hiểu gắn với những người đã an giấc trong mối liên hệ với Giê-su. Không nên âm thầm loại bỏ sự mơ hồ thật của nguyên văn.
- issue: Đối tượng của σὺν αὐτῷ
  choice: Giữ đại từ “Ngài”, với Giê-su là tiền ngữ tự nhiên theo văn cảnh.
  alternative: Lặp lại rõ tên “cùng với Giê-su”
  rationale: Giữ hình thức đại từ của nguyên văn, đồng thời trật tự câu và văn cảnh vẫn hướng người đọc về Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ hình ảnh “an giấc” và sự mơ hồ của διὰ τοῦ Ἰησοῦ; tên “Giê-su” được dùng không kèm tước hiệu vì nguyên văn chỉ có tên riêng.
