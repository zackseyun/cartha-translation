revisions:
- from: Vì chính Chúa sẽ từ trời ngự xuống, cùng với một tiếng truyền lệnh[a], với tiếng của một tổng lãnh thiên sứ và với tiếng kèn của Đức Chúa Trời; rồi những người đã chết trong Đấng Christ sẽ sống lại trước hết[b].
  to: Vì chính Chúa sẽ từ trời xuống cùng với một tiếng truyền lệnh[a], với tiếng của một tổng lãnh thiên sứ và với kèn của Đức Chúa Trời, và những người đã chết trong Đấng Mê-si-a sẽ sống lại trước hết[b].
  rationale: Bản sửa giải quyết nhất quán việc dịch danh hiệu Χριστός, phân biệt “kèn” với “tiếng kèn,” và tránh thêm sắc thái diễn tiến hay tôn xưng vào những chỗ bản Hy Lạp không nêu riêng. Các ba cụm đi kèm vẫn được giữ song hành, không xác định ai phát ra từng âm hiệu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần chỉnh nhẹ để bám sát hơn các chi tiết Hy Lạp: ἐν σάλπιγγι θεοῦ là “với kèn của Đức Chúa Trời,” không trực tiếp là “với tiếng kèn”; καὶ nối mệnh đề cuối đơn thuần, nên không cần thêm sắc thái diễn tiến rõ hơn bằng “rồi.” Χριστῷ phù hợp hơn với “Đấng Mê-si-a” theo chính sách dịch danh hiệu của dự án, đồng thời chú thích có thể bảo lưu cách dùng quen thuộc “Đấng Christ.”'
  naturalness: Bản sửa vẫn giữ văn phong trang trọng, hiện đại và tự nhiên. “Tiếng hô truyền lệnh,” “tiếng của một tổng lãnh thiên sứ,” và “kèn của Đức Chúa Trời” tạo thế song hành rõ ràng. “Từ trời xuống” diễn đạt trực tiếp καταβήσεται mà không thêm mức độ tôn xưng vào động từ.
  terminology: Giữ “Chúa” cho κύριος, “Đức Chúa Trời” cho θεοῦ, và “tổng lãnh thiên sứ” cho ἀρχαγγέλου. Dùng “Đấng Mê-si-a” cho Χριστός khi còn là danh hiệu, với chú thích về dạng truyền thống “Đấng Christ.”
  issues:
  - severity: medium
    issue: “Đấng Christ” được dùng ở văn bản chính thay cho danh hiệu được dịch.
    rationale: Χριστῷ là danh hiệu “Đấng được xức dầu”; hồ sơ tiếng Anh và chính sách dự án chọn “Messiah.” Bản tiếng Việt nên dùng “Đấng Mê-si-a” trong văn bản chính và giữ “Đấng Christ” ở chú thích như cách dịch truyền thống.
  - severity: low
    issue: “tiếng kèn của Đức Chúa Trời” chuyển σάλπιγξ từ nhạc cụ sang âm thanh.
    rationale: σάλπιγξ nghĩa là “kèn/trumpet.” Dù cách cũ tự nhiên trong ngữ cảnh âm thanh, “với kèn của Đức Chúa Trời” sát nguồn hơn và vẫn tự nhiên trong câu trang trọng.
  - severity: low
    issue: “rồi” và dấu chấm phẩy làm rõ quan hệ diễn tiến hơn liên từ καὶ.
    rationale: Bản văn chỉ nối hai mệnh đề bằng “và”; thứ tự đã được πρῶτον biểu thị. Dùng “và” bảo tồn tốt hơn cấu trúc và độ mở của nguồn.
  - severity: low
    issue: “ngự xuống” thêm sắc thái tôn xưng vào động từ καταβήσεται.
    rationale: Sự tôn kính đã có ở “Chúa”; “sẽ từ trời xuống” dịch trực tiếp “will descend from heaven” mà không bổ sung sắc thái không được động từ Hy Lạp nêu riêng.
