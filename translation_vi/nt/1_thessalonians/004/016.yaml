  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: vi
  text: Vì chính Chúa sẽ từ trời xuống cùng với một tiếng truyền lệnh[a], với tiếng của một tổng lãnh thiên sứ và với kèn của Đức Chúa Trời, và những người đã chết trong Đấng Mê-si-a sẽ sống lại trước hết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng với một tiếng hô truyền lệnh.” Từ Hy Lạp κέλευσμα có thể chỉ một lệnh triệu tập hoặc tiếng hô ra lệnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “trong Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này giải thích nền tảng cho lời bảo đảm ở câu trước; “Vì” diễn đạt tự nhiên chức năng giải thích ấy.
- source_word: αὐτὸς ὁ κύριος
  choice: chính Chúa
  rationale: “Chính” giữ được sắc thái nhấn mạnh của αὐτός, còn κύριος được dịch là “Chúa” theo cách dùng tự nhiên và trang trọng.
- source_word: ἐν κελεύσματι
  choice: cùng với một tiếng truyền lệnh
  rationale: κέλευσμα chỉ mệnh lệnh hoặc tiếng gọi có thẩm quyền, thường được cất lên thành tiếng; cách dịch này vừa giữ ý mệnh lệnh vừa cho thấy đây là âm thanh được nghe thấy.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: với tiếng của một tổng lãnh thiên sứ
  rationale: φωνή là “tiếng/giọng”, còn danh từ ἀρχάγγελος không có mạo từ; “một tổng lãnh thiên sứ” không mặc nhiên xác định một vị cụ thể.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: với tiếng kèn của Đức Chúa Trời
  rationale: σάλπιγξ là kèn dùng để phát tín hiệu; thêm “tiếng” phù hợp ngữ cảnh ba âm hiệu song song và tự nhiên trong tiếng Việt, còn θεοῦ được giữ bằng cấu trúc sở hữu.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: sẽ từ trời ngự xuống
  rationale: καταβαίνω nghĩa là đi hoặc xuống; “ngự xuống” giữ sắc thái trang trọng phù hợp với chủ thể là Chúa mà vẫn diễn đạt rõ hướng chuyển động từ trời.
- source_word: οἱ νεκροὶ
  choice: những người đã chết
  rationale: Tính từ được dùng như danh từ để chỉ người chết; cách diễn đạt này rõ ràng và tự nhiên hơn “những kẻ chết” trong tiếng Việt hiện đại.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Christ
  rationale: Cụm từ nói đến mối liên hệ hoặc sự hiệp nhất với Χριστός. “Đấng Christ” giữ danh hiệu truyền thống trong tiếng Việt và tránh biến danh hiệu thành một tên riêng thuần túy.
- source_word: ἀναστήσονται
  choice: sẽ sống lại
  rationale: Động từ tương lai dạng trung chỉ sự phục sinh; “sống lại” là cách diễn đạt trực tiếp, quen thuộc và không thêm sắc thái bị động.
- source_word: πρῶτον
  choice: trước hết
  rationale: Từ này đánh dấu thứ tự so với những người còn sống được nói đến ở câu tiếp theo.
theological_decisions:
- issue: Cách dịch Χριστῷ trong cụm ἐν Χριστῷ
  choice: trong Đấng Christ
  alternative: trong Đấng Mê-si-a
  rationale: Χριστός mang nghĩa danh hiệu “Đấng được xức dầu”. “Đấng Christ” là dạng danh hiệu đã được định hình và dễ hiểu trong tiếng Việt Cơ Đốc; chú thích bảo lưu nghĩa dịch trực tiếp “Đấng Mê-si-a” mà không áp đặt cách hiểu hệ phái.
- issue: Quan hệ của ba cụm ἐν với sự ngự xuống của Chúa
  choice: giữ ba âm hiệu song song mà không xác định ai phát ra từng âm thanh
  alternative: hiểu chính Chúa phát tiếng truyền lệnh và/hoặc tiếng của tổng lãnh thiên sứ
  rationale: Ngữ pháp nêu các hoàn cảnh đi kèm nhưng không nói tường minh chủ thể tạo ra từng âm thanh; bản dịch không nên giải quyết điều văn bản để ngỏ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “chính Chúa” và “ngự xuống” để giữ sắc thái tôn kính; dùng “những người đã chết” thay cho lối nói cổ. Dấu chấm phẩy giúp phân định sự ngự xuống và kết quả kế tiếp mà không làm mất mạch câu.
