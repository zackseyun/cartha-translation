  - severity: low
    issue: “Cùng với họ được cất lên” chưa thể hiện rõ bằng tiếng Việt nét đồng thời của ἅμα.
    rationale: Đặt “cùng” trực tiếp trước động từ trong “sẽ cùng được cất lên với họ” diễn đạt tự nhiên cả sự đồng thời lẫn đồng hành.
