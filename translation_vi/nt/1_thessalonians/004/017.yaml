source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: vi
  text: Kế đó, chúng ta, là những người đang sống và còn ở lại, sẽ cùng được cất lên[a] với họ trong các đám mây để gặp Chúa trên không trung[b]; và như thế, chúng ta sẽ luôn ở với Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị giật lên” hoặc “được cuốn lên.” Động từ Hy Lạp nhấn mạnh một hành động đột ngột và mạnh mẽ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để đi đón Chúa.” Cụm từ này có thể chỉ việc đi ra gặp một người đang đến, nhưng chính câu này không nói rõ trình tự rộng hơn sau cuộc gặp ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Kế đó
  rationale: Đánh dấu sự kiện tiếp theo sau việc những người đã chết trong Đấng Christ sống lại ở câu trước, đồng thời giữ rõ trình tự thời gian.
- source_word: οἱ ζῶντες
  choice: những người đang sống
  rationale: Diễn đạt phân từ có mạo từ chỉ nhóm tín hữu vẫn còn sống vào thời điểm Chúa đến.
- source_word: οἱ περιλειπόμενοι
  choice: còn lại
  rationale: Giữ ý những người vẫn còn ở lại cho đến thời điểm ấy, không thêm hàm ý họ sống sót qua một tai họa cụ thể.
- source_word: ἅμα σὺν αὐτοῖς
  choice: cùng với họ
  rationale: Diễn đạt tự nhiên cả sự đồng thời lẫn sự hiệp cùng những người đã được sống lại.
- source_word: ἁρπαγησόμεθα
  choice: sẽ ... được cất lên
  rationale: Giữ thể tương lai bị động và chuyển động hướng lên; chú thích nêu rõ sắc thái đột ngột, mạnh mẽ của động từ mà không đưa vào một hệ thống cánh chung cụ thể.
- source_word: ἐν νεφέλαις
  choice: trong các đám mây
  rationale: Giữ hình ảnh cụ thể ở số nhiều và âm hưởng thần hiện của nguyên văn.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: để gặp Chúa
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ mục đích của chuyển động nhưng không xác định diễn biến rộng hơn sau cuộc gặp.
- source_word: εἰς ἀέρα
  choice: trên không trung
  rationale: Diễn đạt địa điểm cuộc gặp theo tiếng Việt tự nhiên; ngữ cảnh chuyển động đã được thể hiện bằng 'được cất lên'.
- source_word: καὶ οὕτως
  choice: và như thế
  rationale: Có thể chỉ cách thức hoặc kết quả từ chuỗi sự kiện vừa nêu; cách dịch này giữ được độ mở ấy.
- source_word: πάντοτε
  choice: luôn
  rationale: Tương đương trực tiếp với trạng từ Hy Lạp, nhấn mạnh sự ở cùng Chúa không gián đoạn.
- source_word: σὺν κυρίῳ ἐσόμεθα
  choice: chúng ta sẽ luôn ở với Chúa
  rationale: Giữ lời bảo đảm ở thì tương lai và trọng tâm kết thúc là sự hiệp cùng Chúa.
theological_decisions:
- issue: Cách dịch ἁρπαγησόμεθα trong câu thường được dùng trong các tranh luận về sự cất lên
  choice: sẽ ... được cất lên
  alternative: sẽ ... bị giật lên / được cuốn lên
  rationale: Bản dịch thể hiện hành động bị động hướng lên nhưng không gắn câu này với một lập trường giáo phái về thời điểm hoặc bản chất của biến cố; chú thích bảo tồn sắc thái mạnh và đột ngột của từ Hy Lạp.
- issue: Ý nghĩa của εἰς ἀπάντησιν τοῦ κυρίου
  choice: để gặp Chúa
  alternative: để đi đón Chúa / để có cuộc gặp với Chúa
  rationale: Cách dịch nêu rõ cuộc gặp nhưng không tự quyết định Chúa và các tín hữu sẽ đi đâu tiếp theo, vì chính câu này không nói rõ diễn biến đó.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc nhấn mạnh “chúng ta” và hai đặc điểm “đang sống, còn lại”; tránh thuật ngữ hệ phái hoặc diễn giải quá mức về trình tự cánh chung.
