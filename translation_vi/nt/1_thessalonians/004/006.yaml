source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: vi
  text: không ai được vượt quá giới hạn và lợi dụng người anh em của mình[b] trong việc này,[a] vì Chúa là Đấng báo ứng về tất cả những điều này, như chúng tôi đã báo trước cho anh em và long trọng cảnh báo anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “gian lận với người anh em của mình trong việc ấy.” Từ Hy Lạp có thể chỉ việc chiếm lợi thế gây thiệt hại cho người khác; trong ngữ cảnh, lời cảnh báo rất có thể liên quan đến hành vi sai trái về tình dục.'
    reason: lexical_alternative
  - marker: b
    text: “Người anh em của mình” dịch một cụm từ Hy Lạp giống đực số ít. Cách nói này có lẽ nhấn mạnh đến một người cùng đức tin, dù lời cảnh báo đạo đức có thể áp dụng rộng hơn trong cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: không ai được vượt quá giới hạn
  rationale: Động từ diễn tả việc bước qua một ranh giới đạo đức; cách dịch này giữ hình ảnh của nguyên ngữ và thể hiện sức nặng khuyên răn.
- source_word: πλεονεκτεῖν
  choice: lợi dụng
  rationale: Từ này chỉ việc trục lợi hoặc chiếm phần hơn gây thiệt hại cho người khác. “Lợi dụng” giữ nghĩa rộng, không thu hẹp câu vào gian lận tài chính.
- source_word: ἐν τῷ πράγματι
  choice: trong việc này
  rationale: Cụm từ có ý nghĩa khá khái quát nhưng quy chiếu về vấn đề đang được bàn; ngữ cảnh gần là sự thánh khiết trong phương diện tình dục.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: anh em mình
  rationale: “Anh em” là cách gọi tự nhiên trong cộng đồng tín hữu Việt ngữ, vẫn phản ánh danh từ giống đực số ít mà không khiến câu nghe như chỉ nói về anh ruột.
- source_word: ἔκδικος κύριος
  choice: Chúa là Đấng báo trả
  rationale: Cách dịch truyền đạt vai trò thi hành công lý và trừng phạt điều sai trái, đồng thời tự nhiên và trang trọng hơn “Đấng báo thù” trong tiếng Việt hiện đại.
- source_word: περὶ πάντων τούτων
  choice: mọi điều ấy
  rationale: Giữ phạm vi số nhiều và rộng của nguyên ngữ, quy chiếu đến các hành vi sai trái vừa được đề cập.
- source_word: προείπαμεν
  choice: đã nói trước
  rationale: Giữ rõ ý nghĩa thời gian của tiền tố προ- mà không lặp lại sắc thái cảnh báo mạnh của động từ kế tiếp.
- source_word: διεμαρτυράμεθα
  choice: nghiêm trọng cảnh báo
  rationale: Diễn đạt lời chứng nhận và cảnh cáo đầy tính long trọng, mạnh mẽ trong ngữ cảnh khuyên răn.
theological_decisions:
- issue: Phạm vi của “việc này” và bản chất hành vi sai trái
  choice: Giữ cách nói rộng “lợi dụng ... trong việc này”, trong khi ngữ cảnh hướng đến hành vi sai trái về tình dục.
  alternative: Hiểu câu chủ yếu là cấm gian lận trong việc làm ăn hoặc các quan hệ nói chung.
  rationale: Các câu 3–5 trực tiếp bàn về sự thánh khiết và gian dâm. Tuy vậy, bản thân πλεονεκτεῖν và πρᾶγμα không nói rõ chi tiết, nên bản dịch chính không nên xác định quá mức.
- issue: Cách dịch ἀδελφός
  choice: anh em mình
  alternative: anh chị em mình; người cùng đức tin
  rationale: Nguyên ngữ dùng danh từ giống đực số ít, có khả năng chỉ một nam tín hữu; “anh em mình” giữ sắc thái cộng đồng đức tin và vẫn tự nhiên trong tiếng Việt.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: Trong ngữ cảnh phán xét thần học này, “Chúa” là cách dịch chính xác, quen thuộc và trang trọng.
- issue: Sắc thái của ἔκδικος
  choice: Đấng báo trả
  alternative: Đấng báo thù; Đấng thi hành công lý
  rationale: “Báo trả” bảo tồn khía cạnh xét xử và trừng phạt mà không gợi ý sự trả thù tùy tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” làm cách xưng hô cộng đồng xuyên suốt câu; giữ tính nghiêm nghị của lời cảnh báo và không xác định quá mức điều mà nguyên ngữ gọi khái quát là “việc này”.
