  terminology: Dùng “Chúa” cho κύριος là phù hợp. “Đấng báo ứng” diễn đạt ἔκδικος rõ hơn “Đấng báo trả” trong ngữ cảnh phán xét. “Người anh em của mình” giữ số ít giống đực của nguyên ngữ, đồng thời tránh hiểu nhầm là “anh em” số nhiều.
