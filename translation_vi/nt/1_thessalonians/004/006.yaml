    rationale: Trạng từ “nghiêm trọng” không bổ nghĩa tự nhiên cho “cảnh báo” ở cấu trúc này; “long trọng cảnh báo” diễn đạt tốt sắc thái nhấn mạnh, trang trọng của διεμαρτυράμεθα.
