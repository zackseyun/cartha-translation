  source_fidelity: 'Bản nháp chuyển tải đúng mạch chính của câu: không vượt quá giới hạn, không lợi dụng người khác trong vấn đề đang bàn, Chúa thi hành sự báo ứng, và lời cảnh báo đã được nói trước. Tuy nhiên, “anh em mình” không phản ánh rõ số ít của τὸν ἀδελφὸν αὐτοῦ, và chú thích b hiện được neo sau “mọi điều ấy” dù nội dung lại giải thích “anh em mình”.'
