revisions:
- from: 'Vậy, thưa anh chị em[a], chúng tôi nhân danh Chúa Giê-su mà xin và khuyên anh chị em: như anh chị em đã tiếp nhận từ chúng tôi cách mình phải sống và làm đẹp lòng Đức Chúa Trời—thật ra anh chị em đang sống như vậy—xin anh chị em càng tiến bộ hơn nữa.'
  to: 'Vậy thì, thưa anh chị em[a], chúng tôi xin và khuyên nhủ anh chị em trong Chúa Giê-su rằng: như anh chị em đã tiếp nhận từ chúng tôi cách anh chị em phải sống để làm đẹp lòng Đức Chúa Trời—và anh chị em đang sống như vậy—thì anh chị em hãy tiến bộ hơn nữa.'
  rationale: Bản sửa thay cách diễn đạt mang tính diễn giải “nhân danh” bằng “trong”, loại bỏ sắc thái thêm vào của “thật ra”, và điều chỉnh từ nối mở đầu. Các phần còn lại giữ đúng ý dạy về nếp sống làm đẹp lòng Đức Chúa Trời, sự xác nhận về cách sống hiện tại của độc giả, và lời kêu gọi tăng trưởng hơn nữa.
