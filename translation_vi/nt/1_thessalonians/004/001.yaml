id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: vi
  text: 'Vậy thì, thưa anh chị em[a], chúng tôi xin và khuyên nhủ anh chị em trong Chúa Giê-su rằng: như anh chị em đã tiếp nhận từ chúng tôi cách anh chị em phải sống để làm đẹp lòng Đức Chúa Trời—và anh chị em đang sống như vậy—thì anh chị em hãy tiến bộ hơn nữa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “anh em”, một cách gọi thường được dùng để hướng đến cả cộng đồng gồm nam và nữ.
    reason: Ghi nhận hình thức giống đực của ἀδελφοί, trong khi “anh chị em” trong bản dịch diễn đạt đối tượng bao hàm theo ngữ cảnh.
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: Vậy
  rationale: Cụm từ chuyển sang phần khuyên bảo tiếp theo; “Vậy” diễn đạt tự nhiên lực chuyển ý và suy luận trong tiếng Việt mà không khiến người đọc tưởng đây đã là lời kết cuối thư.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Dạng Hy Lạp là số nhiều giống đực nhưng trong ngữ cảnh chỉ toàn thể cộng đồng tín hữu; “anh chị em” là lối xưng hô tự nhiên, tôn trọng và bao hàm trong tiếng Việt.
- source_word: ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν
  choice: chúng tôi ... xin và khuyên anh chị em
  rationale: 'Giữ hai sắc thái bổ sung: lời thỉnh cầu của ἐρωτάω và lời khuyên thúc giục của παρακαλέω.'
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: nhân danh Chúa Giê-su
  rationale: Trong ngữ cảnh lời yêu cầu có thẩm quyền, “nhân danh” diễn đạt tự nhiên việc lời kêu gọi được đưa ra trong phạm vi và thẩm quyền của Chúa Giê-su, dù nghĩa sát hơn là “trong Chúa Giê-su”.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: như anh chị em đã tiếp nhận từ chúng tôi
  rationale: “Tiếp nhận” giữ được ý nhận lãnh sự dạy dỗ hay truyền thống từ các sứ đồ, không thu hẹp thành chỉ học kiến thức.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: cách mình phải sống
  rationale: περιπατεῖν theo nghĩa bóng chỉ nếp sống; chuyển thành “sống” giúp độc giả hiện đại hiểu ngay, còn “phải” giữ sức nặng đạo đức của δεῖ.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: và làm đẹp lòng Đức Chúa Trời
  rationale: Cách nói Việt tự nhiên và trực tiếp cho ý sống sao cho đẹp lòng Đức Chúa Trời.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: thật ra anh chị em đang sống như vậy
  rationale: Thể hiện lời xác nhận rằng họ hiện đã sống theo sự dạy dỗ; “thật ra” chuyển tải lực xác nhận của καί tự nhiên hơn “cũng” trong cấu trúc tiếng Việt.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: xin anh chị em càng tiến bộ hơn nữa
  rationale: Trong ngữ cảnh nếp sống, περισσεύω chỉ sự gia tăng hay vượt trội hơn mức hiện tại; “càng tiến bộ hơn nữa” rõ nghĩa và tự nhiên hơn cách dịch sát “dư dật”.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφοί
  choice: anh chị em
  alternative: anh em, kèm chú thích rằng từ này có thể bao gồm cả nam lẫn nữ
  rationale: Phao-lô hướng lời khuyên đến toàn thể hội chúng. Trong tiếng Việt hiện đại, “anh chị em” truyền đạt đúng đối tượng mà vẫn giữ sắc thái thân thuộc của cách gọi trong gia đình đức tin.
- issue: Ý nghĩa của ἐν κυρίῳ Ἰησοῦ
  choice: nhân danh Chúa Giê-su
  alternative: trong Chúa Giê-su
  rationale: Cụm từ có thể nói đến phạm vi hiệp nhất với Chúa hoặc thẩm quyền của Ngài. Ngữ cảnh “xin và khuyên” nghiêng về thẩm quyền, nhưng bản dịch không thêm một nguồn thẩm quyền nào ngoài chính Chúa Giê-su.
- issue: Ẩn dụ περιπατεῖν về đời sống đạo
  choice: sống
  alternative: bước đi
  rationale: Đây là ẩn dụ phổ biến cho cách cư xử và nếp sống. “Sống” tránh gây hiểu lầm là vận động thể chất, đồng thời không áp đặt một hệ thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và phù hợp lời khuyên mục vụ. Dùng “anh chị em” để xưng hô tự nhiên với toàn thể hội chúng; dùng dấu gạch ngang để tách lời xác nhận về nếp sống hiện tại, giúp câu Hy Lạp dài trở nên rõ ràng trong tiếng Việt.
