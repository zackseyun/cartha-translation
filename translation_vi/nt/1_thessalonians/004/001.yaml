  - severity: low
    issue: “thật ra anh chị em đang sống như vậy” cho καθὼς καὶ περιπατεῖτε
    rationale: '“Thật ra” thêm sắc thái đính chính hoặc tương phản không có trong καί. Mệnh đề Hy Lạp đơn giản xác nhận: “và anh chị em đang sống như vậy.”'
  - severity: low
    issue: “Vậy” chưa phản ánh trọn lực Λοιπὸν οὖν
    rationale: “Vậy thì” tự nhiên hơn để giữ cả chuyển đoạn của λοιπόν lẫn liên kết suy luận/resumptive của οὖν.
