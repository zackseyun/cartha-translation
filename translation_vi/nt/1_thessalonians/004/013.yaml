  - severity: low
    issue: Chú thích về ‘ngủ’ thêm xác định “những tín hữu”.
    rationale: Đây là suy luận hợp lý từ ngữ cảnh rộng nhưng không được phát biểu trong chính cụm từ; chú thích nên chỉ giải thích phép ẩn dụ.
