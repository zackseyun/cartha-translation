review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mạch lập luận của câu, nhưng “những người đang ngủ” trong tiếng Việt dễ được hiểu theo nghĩa đen là người hiện đang ngủ. Cụm “những người đã an giấc” giữ hình ảnh ‘ngủ’ của κοιμωμένων mà tự nhiên nhận biết đây là lối nói về người qua đời. “Không muốn anh chị em thiếu hiểu biết” cũng diễn đạt ὑμᾶς ἀγνοεῖν tự nhiên hơn phủ định kép.
  naturalness: Cần bỏ dấu phẩy ngay sau “Nhưng” và tránh cấu trúc “không muốn ... không biết”, vốn tuy hiểu được nhưng nặng trong văn phong hiện đại. “Những người khác, là những người không có hy vọng” làm rõ quan hệ bổ nghĩa mà vẫn giữ nguyên phép đối chiếu của nguyên văn.
  terminology: “Anh chị em” là cách xưng hô hội chúng tự nhiên trong tiếng Việt hiện đại; chú thích cần ghi nhận nguyên văn ἀδελφοί là “anh em”. “An giấc” là uyển ngữ phù hợp cho ẩn dụ κοιμωμένων; chú thích không nên khẳng định vượt quá câu rằng mọi người được nói đến đều là “tín hữu”, dù ngữ cảnh thư tín hướng đến cộng đồng tín hữu.
