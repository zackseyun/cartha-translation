id: 1TH.4.13
reference: 1 Thessalonians 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: vi
  text: Nhưng, thưa anh chị em,[a] chúng tôi không muốn anh chị em thiếu hiểu biết về những người đã an giấc,[b] để anh chị em không đau buồn như những người khác, là những người không có hy vọng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “anh em”, một cách xưng hô ở đây nhiều khả năng bao gồm cả nam lẫn nữ trong hội chúng.
    reason: cultural_note
  - marker: b
    text: “Đã an giấc” giữ hình ảnh “ngủ” trong nguyên văn; ở đây đó là cách nói về những người đã qua đời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν
  choice: Nhưng ... chúng tôi không muốn anh chị em không biết
  rationale: δέ được diễn đạt bằng “Nhưng” như một chuyển ý nhẹ; cấu trúc phủ định kép tự nhiên trong tiếng Việt giữ nghĩa “không muốn anh chị em thiếu hiểu biết về điều này” mà không mang sắc thái miệt thị.
- source_word: ἀδελφοί
  choice: thưa anh chị em
  rationale: Trong lối xưng hô của Phao-lô, danh từ số nhiều giống đực này hướng đến toàn thể hội chúng; “anh chị em” là cách gọi tự nhiên, trang trọng và chính xác về phạm vi giao tiếp trong tiếng Việt.
- source_word: περὶ τῶν κοιμωμένων
  choice: về những người đang ngủ
  rationale: Giữ nguyên ẩn dụ “ngủ” của hiện tại phân từ κοιμωμένων thay vì diễn giải thẳng thành “đã chết”; chú thích làm rõ rằng câu nói về những tín hữu đã qua đời.
- source_word: ἵνα μὴ λυπῆσθε
  choice: để anh chị em không đau buồn
  rationale: “để ... không” thể hiện tự nhiên mục đích của ἵνα với động từ giả định; câu không nhất thiết cấm mọi nỗi buồn mà đặt nỗi buồn ấy trong thế tương phản với người không có hy vọng.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: như những người còn lại
  rationale: Giữ phép so sánh và nghĩa phân biệt của οἱ λοιποί, tức những người ngoài cộng đồng đang được nói với.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: là những người không có niềm hy vọng
  rationale: Diễn đạt trực tiếp cụm phân từ, đồng thời giữ rõ đối tượng của phép so sánh.
theological_decisions:
- issue: Ý nghĩa của κοιμωμένων trong bối cảnh cánh chung
  choice: Giữ ẩn dụ “những người đang ngủ” trong chính văn.
  alternative: “những người đã chết” hoặc “những người đã an giấc”
  rationale: “Ngủ” là hình ảnh có chủ ý trong lời Phao-lô khi nói về người đã chết giữa bối cảnh hy vọng phục sinh. Giữ hình ảnh này bảo tồn sắc thái thần học và không giải nghĩa quá mức.
- issue: Phạm vi của ἀδελφοί
  choice: Dịch là “anh chị em” để thể hiện lời xưng hô với toàn thể hội chúng.
  alternative: “anh em”
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, trong ngữ cảnh đây nhiều khả năng là cách gọi hội chúng gồm cả nam lẫn nữ. Tiếng Việt hiện đại dùng “anh chị em” tự nhiên để biểu đạt đúng phạm vi ấy; chú thích ghi nhận hình thức nguyên ngữ.
- issue: Bản chất của nỗi đau buồn
  choice: Giữ “không đau buồn như” thay vì diễn giải thành lệnh tuyệt đối không được buồn.
  alternative: “đừng đau buồn”
  rationale: Cú pháp gắn sự đau buồn với phép so sánh về những người không có hy vọng; bản dịch không nên biến câu này thành lời phủ nhận mọi sự thương tiếc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” theo quy ước xưng hô hội chúng tự nhiên của tiếng Việt; giữ nguyên ẩn dụ “ngủ” và làm rõ bằng chú thích. Dấu phẩy sau “Nhưng” và cụm “thưa anh chị em” tạo nhịp chuyển ý mục vụ.
