source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: vi
  text: Vì vậy, ai bác bỏ điều này thì không phải bác bỏ một con người, mà là bác bỏ Đức Chúa Trời, Đấng cũng ban Thánh Linh của Ngài cho anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch phần cuối là “Đấng cũng ban Thánh Linh của Ngài vào trong anh chị em.” Giới từ Hy Lạp có nghĩa sát là “vào trong”, dù trong cấu trúc này tiếng Việt thường nói “ban ... cho anh chị em”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Vì vậy
  rationale: Diễn tả kết luận suy ra từ lời khuyên dạy ngay trước đó, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: ai khước từ ... khước từ
  rationale: Phân từ có mạo từ mang nghĩa khái quát; “ai” không giới hạn giới tính. “Khước từ” truyền đạt hành động bác bỏ hoặc gạt bỏ lời dạy có thẩm quyền.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: không phải ... con người, mà là ... Đức Chúa Trời
  rationale: Giữ sự đối lập cô đọng giữa con người nói chung và Đức Chúa Trời; cấu trúc tiếng Việt được bổ sung động từ để rõ nghĩa.
- source_word: τὸν καὶ διδόντα
  choice: Đấng cũng ban
  rationale: Chuyển phân từ hiện tại thành mệnh đề quan hệ tự nhiên; “cũng” phản ánh καί mà không nhấn mạnh quá mức.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Thánh Linh của Ngài
  rationale: Cụm từ trong văn cảnh Phao-lô chỉ Thánh Linh thuộc về Đức Chúa Trời; cách viết hoa thể hiện sở chỉ này.
- source_word: εἰς ὑμᾶς
  choice: cho anh chị em
  rationale: Với động từ “ban”, đây là cách diễn đạt tự nhiên trong tiếng Việt. Chú thích bảo tồn khả năng hiểu sát giới từ εἰς là “vào trong”.
theological_decisions:
- issue: Sở chỉ của “Thánh Linh của Ngài”
  choice: Cụm từ chỉ Thánh Linh do Đức Chúa Trời ban cho các tín hữu.
  alternative: “thần linh thánh” như một ân tứ hoặc khuynh hướng ít mang tính ngôi vị hơn.
  rationale: Cấu trúc Hy Lạp τὸ πνεῦμα αὐτοῦ τὸ ἅγιον và cách dùng của Phao-lô tự nhiên chỉ Thánh Linh; bản dịch không thêm nội dung tín lý ngoài văn bản.
- issue: Tính khái quát của ὁ ἀθετῶν
  choice: Dịch là “ai khước từ”, áp dụng cho bất cứ người nào.
  alternative: “người khước từ” hoặc cách diễn đạt giống đực riêng biệt.
  rationale: Giống đực số ít trong tiếng Hy Lạp có chức năng đại diện, không giới hạn ở nam giới.
- issue: Sắc thái của εἰς ὑμᾶς
  choice: Đưa “cho anh chị em” vào chính văn và ghi chú nghĩa sát là “vào trong anh chị em”.
  alternative: Dịch trực tiếp “vào trong anh chị em”.
  rationale: Giữ câu tiếng Việt tự nhiên nhưng không xóa bỏ sắc thái không gian hoặc nội tại có thể có của giới từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm nói trực tiếp với toàn thể cộng đồng, không giới hạn giới tính. “Đức Chúa Trời” và “Thánh Linh” theo lối dùng Tin Lành Việt ngữ quen thuộc, nhưng câu dịch không đưa thêm nét giáo phái.
