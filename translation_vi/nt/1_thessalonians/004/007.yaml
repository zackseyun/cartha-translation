source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: vi
  text: Vì Đức Chúa Trời không kêu gọi chúng ta sống trong sự ô uế[a], nhưng sống trong sự thánh khiết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự bất khiết.” Trong văn cảnh này, từ Hy Lạp chỉ sự ô uế về đạo đức, đặc biệt là ô uế về tình dục.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong sự nên thánh.” Từ Hy Lạp có thể chỉ trạng thái thánh khiết hoặc tiến trình được làm nên thánh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này nêu lý do cho lời khuyên ở câu trước; “Vì” tự nhiên và giữ rõ quan hệ lập luận.
- source_word: ἐκάλεσεν
  choice: kêu gọi
  rationale: Động từ aorist chỉ hành động Đức Chúa Trời đã gọi các tín hữu. Tiếng Việt không bắt buộc đánh dấu thì quá khứ; ngữ cảnh vẫn truyền đạt hành động ấy mà không áp đặt một hệ thống thần học chuyên biệt về sự kêu gọi.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: sống trong sự ô uế
  rationale: ἐπί với tặng cách ở đây diễn tả mục đích hoặc hoàn cảnh sống mà sự kêu gọi hướng tới. Thêm “sống” làm rõ ý đạo đức trong tiếng Việt, còn “sự ô uế” giữ được phạm vi nghĩa rộng, kể cả sự ô uế tình dục trong văn cảnh.
- source_word: ἀκαθαρσίᾳ
  choice: sự ô uế
  rationale: Cách dịch này giữ sắc thái đạo đức và âm hưởng thanh sạch–ô uế của từ Hy Lạp, đồng thời vẫn tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐν ἁγιασμῷ
  choice: trong sự thánh khiết
  rationale: Cụm từ đối lập với “sự ô uế” và có thể chỉ trạng thái, môi trường hoặc tiến trình nên thánh. “Trong sự thánh khiết” giữ giới từ và diễn đạt tự nhiên hơn “trong sự thánh hóa” ở câu chính.
- source_word: ἁγιασμῷ
  choice: sự thánh khiết
  rationale: Danh từ có thể chỉ sự thánh khiết hoặc sự thánh hóa. Trong phép đối lập với ô uế, cách dịch này làm nổi bật đời sống thánh sạch nhưng không loại bỏ nghĩa tiến trình, vốn được ghi chú.
theological_decisions:
- issue: Ý nghĩa của việc Đức Chúa Trời “kêu gọi”
  choice: Giữ nguyên ngôn ngữ về sự kêu gọi thật của Đức Chúa Trời làm nền tảng cho đời sống thánh khiết.
  alternative: Hiểu như một lời mời chung, hoặc xác định đây là “sự kêu gọi hữu hiệu” theo nghĩa thần học kỹ thuật.
  rationale: Câu này khẳng định Đức Chúa Trời kêu gọi các tín hữu và sự kêu gọi ấy có định hướng đạo đức, nhưng không giải thích cơ chế của sự kêu gọi. Vì vậy bản dịch không thêm nét nghĩa hệ phái.
- issue: Trạng thái hay tiến trình trong ἁγιασμός
  choice: Dùng “sự thánh khiết” trong câu chính và ghi chú khả năng “sự thánh hóa”.
  alternative: Dịch thẳng là “sự thánh hóa”.
  rationale: Từ Hy Lạp có thể chỉ cả trạng thái thánh khiết lẫn tiến trình được làm nên thánh. Phép đối lập với ô uế nghiêng về trạng thái hoặc nếp sống, nhưng sự đa nghĩa chân thực cần được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Trời” phù hợp với cách dùng Kinh Thánh Tin Lành quen thuộc; “sống trong” được thêm để diễn đạt tự nhiên hàm ý về mục đích hoặc môi trường sống của hai cụm giới từ đối lập. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
