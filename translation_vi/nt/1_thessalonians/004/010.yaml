reference: 1 Thessalonians 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: vi
  text: Vì quả thật, anh chị em đang bày tỏ tình yêu ấy đối với tất cả anh chị em cùng đức tin[a] trên khắp Ma-xê-đô-ni-a. Nhưng, thưa anh chị em, chúng tôi khuyên anh chị em hãy bày tỏ tình yêu ấy càng nhiều hơn nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng từ “anh em”, một cách gọi trong ngữ cảnh này chỉ những người cùng đức tin và có thể bao gồm cả nam lẫn nữ trong các hội thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Thật vậy
  rationale: Diễn đạt tự nhiên sắc thái giải thích và nhấn mạnh của tổ hợp liên từ, nối câu này với lời xác nhận về tình yêu thương anh em ở câu trước.
- source_word: ποιεῖτε αὐτὸ
  choice: anh chị em đang bày tỏ tình yêu ấy
  rationale: Thì hiện tại cho thấy hành động đang tiếp diễn; bổ sung danh từ được đại từ αὐτό quy chiếu là tình yêu thương anh em để câu tiếng Việt rõ và tự nhiên.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: đối với tất cả anh chị em cùng đức tin
  rationale: εἰς diễn tả đối tượng mà hành động yêu thương hướng đến. Cụm từ tiếng Việt bao quát cộng đồng tín hữu nam và nữ trong ngữ cảnh.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: trên khắp miền Ma-xê-đô-ni-a
  rationale: Giữ sắc thái phân bố địa lý của ἐν ὅλῃ và dùng cách gọi địa danh dễ hiểu trong tiếng Việt.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Nhưng ... chúng tôi khuyên anh chị em
  rationale: παρακαλέω ở đây là lời khuyên giục tha thiết; δέ chuyển từ lời khen sang lời thúc giục tiếp theo.
- source_word: περισσεύειν μᾶλλον
  choice: hãy làm điều đó ngày càng hơn nữa
  rationale: Truyền đạt sự gia tăng vượt trên mức hiện có và nối tự nhiên với việc bày tỏ tình yêu đã nêu ở đầu câu.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφοὺς / ἀδελφοί
  choice: anh chị em cùng đức tin / anh chị em
  alternative: anh em
  rationale: Trong ngữ cảnh hội thánh, danh từ giống đực số nhiều có chức năng bao quát cộng đồng tín hữu, nhiều khả năng gồm cả nam lẫn nữ. Cách dịch này làm rõ phạm vi ngữ dụng mà không đưa thêm một lập trường hệ phái.
- issue: Đối tượng của περισσεύειν
  choice: làm điều đó ngày càng hơn nữa
  alternative: càng thêm dư dật
  rationale: Động từ nguyên ngữ không lặp lại tân ngữ, nhưng trong mạch văn nó tiếp tục nói về tình yêu thương anh em. Đại từ “điều đó” giữ liên kết mà không thu hẹp thêm nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” theo cách xưng hô tự nhiên của tiếng Việt; “Ma-xê-đô-ni-a” là dạng phiên âm quen thuộc. Dấu chân chú [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
