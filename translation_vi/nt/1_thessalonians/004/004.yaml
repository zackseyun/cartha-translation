  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: vi
  text: mỗi người trong anh em phải biết cách có được chiếc bình của riêng mình trong sự thánh khiết và danh dự[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chiếc bình của riêng mình” có thể chỉ thân thể của chính người ấy; cũng có thể được hiểu là người vợ. Cụm “có được” cũng có thể mang sắc thái sở hữu hoặc biết sống với/đối xử với điều được nói đến một cách thánh khiết và danh dự.
    reason: Giữ lại sự mơ hồ có thật của σκεῦος và phạm vi nghĩa của κτᾶσθαι mà không áp đặt một cách giải thích vào chính văn.
lexical_decisions:
- source_word: σκεῦος
  choice: chiếc bình
  rationale: Giữ hình ảnh rộng của từ Hy Lạp, vốn chỉ một vật chứa hay dụng cụ, thay vì đưa thẳng một cách giải thích như “thân thể” hoặc “vợ” vào chính văn.
- source_word: κτᾶσθαι
  choice: có được
  rationale: Diễn đạt nghĩa đạt được/thu nhận của động từ ở thì hiện tại, đồng thời không thu hẹp thành “kiểm soát”; cách dịch này cũng phù hợp với chứng cứ nguồn và bản hiệu đính được cung cấp.
- source_word: ἁγιασμῷ
  choice: sự thánh khiết
  rationale: Chuyển tải ý thuộc riêng về Đức Chúa Trời và đời sống được thánh hóa trong ngữ cảnh luân lý.
- source_word: τιμῇ
  choice: tôn trọng
  rationale: Phản ánh ý danh giá, quý trọng và cách đối xử đáng trọng; tự nhiên hơn “danh dự” trong cấu trúc tiếng Việt này.
theological_decisions:
- issue: “Chiếc bình của riêng mình” chỉ điều gì
  choice: Giữ ẩn dụ trong chính văn và giải thích sự mơ hồ ở chú thích.
  alternative: Dịch trực tiếp là “thân thể mình” hoặc “vợ mình”.
  rationale: σκεῦος có thể được hiểu là thân thể của chính người ấy, hoặc theo một cách giải thích lâu đời khác là người vợ; văn bản Hy Lạp không tự nó giải quyết dứt khoát sự mơ hồ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu được giữ ở dạng mệnh đề nối tiếp theo cấu trúc của câu Hy Lạp; ẩn dụ “chiếc bình” có phần lạ trong tiếng Việt nhưng cần thiết để không xóa bỏ sự mơ hồ của nguyên văn.
