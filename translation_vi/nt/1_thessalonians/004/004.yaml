- from: mỗi người trong anh em phải biết cách có được chiếc bình của riêng mình trong sự thánh khiết và tôn trọng[a],
  to: mỗi người trong anh em phải biết cách có được chiếc bình của riêng mình trong sự thánh khiết và danh dự[a],
  rationale: Chỉ thay “tôn trọng” bằng “danh dự” trong chính văn và chú thích để phản ánh chính xác hơn τιμῇ, đồng thời giữ nguyên ẩn dụ và tính mơ hồ của σκεῦος cũng như lựa chọn “có được” cho κτᾶσθαι.
