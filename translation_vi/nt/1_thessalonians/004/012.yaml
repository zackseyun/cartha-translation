  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: vi
  text: để anh chị em sống cho đứng đắn đối với những người ngoài và không thiếu thốn gì[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không cần nhờ cậy ai.” Cụm từ này có thể nhấn mạnh việc không lệ thuộc vào người khác.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả nối với lời khuyên ở câu trước.
- source_word: περιπατῆτε
  choice: sống
  rationale: Động từ có nghĩa đen là “bước đi”, nhưng ở đây là ẩn dụ quen thuộc chỉ cách sống; “sống” truyền đạt rõ nghĩa trong tiếng Việt hiện đại.
- source_word: εὐσχημόνως
  choice: cách đúng đắn
  rationale: Diễn tả cách cư xử phải lẽ, đứng đắn và đáng trọng mà không thu hẹp nghĩa vào một phương diện đạo đức riêng biệt.
- source_word: πρὸς τοὺς ἔξω
  choice: trước những người ngoài
  rationale: Giữ sắc thái về cách sống được thể hiện trong quan hệ và trước sự quan sát của những người ở ngoài cộng đồng tín hữu.
- source_word: τοὺς ἔξω
  choice: những người ngoài
  rationale: Giữ nguyên cách phân biệt nhóm của nguyên văn, không diễn giải mạnh hơn thành “người không tin”.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: không thiếu thốn gì
  rationale: Truyền đạt cách hiểu tự nhiên rằng họ không lâm cảnh túng thiếu hoặc phải lệ thuộc vì nhu cầu vật chất, đồng thời giữ đối tượng của nhu cầu ở nghĩa rộng.
theological_decisions:
- issue: Ý nghĩa của mệnh đề μηδενὸς χρείαν ἔχητε
  choice: không thiếu thốn gì
  alternative: không cần nhờ cậy ai
  rationale: Ngữ pháp phù hợp nhất với nghĩa không thiếu thứ gì; trong ngữ cảnh làm việc bằng tay, câu cũng hàm ý tránh lệ thuộc vào người khác. Chú thích giữ lại cách hiểu khả dĩ hướng đến con người mà không áp đặt nó vào chính văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” theo ngữ cảnh lời khuyên dành cho cộng đồng; chọn “sống” thay cho cách dịch sát chữ “bước đi” để ẩn dụ Phao-lô được hiểu tự nhiên.
