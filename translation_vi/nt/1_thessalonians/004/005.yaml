id: 1TH.4.5
reference: 1 Thessalonians 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἐν πάθει ἐπιθυμίας καθάπερ καὶ τὰ ἔθνη τὰ μὴ εἰδότα τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/005.yaml
  text: not in the passion of lust[a], just as also the Gentiles who do not know God[b],
translation:
  language: vi
  text: không theo đam mê dục vọng[a], như các dân ngoại không biết Đức Chúa Trời[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong dục vọng mãnh liệt” hoặc “trong đam mê do ham muốn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: “các dân ngoại”; cũng có thể dịch là “các dân tộc,” hoặc diễn ý hơn là “những người ngoại giáo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: không theo đam mê dục vọng
  rationale: Cụm “theo” diễn đạt tự nhiên ý nghĩa về cách thức hoặc phạm vi của ἐν; “đam mê dục vọng” giữ lại sắc thái mạnh, tiêu cực và mang tính tình dục của hai danh từ πάθος và ἐπιθυμία trong văn cảnh.
- source_word: καθάπερ καὶ
  choice: như
  rationale: “Như” truyền đạt phép so sánh một cách tự nhiên trong tiếng Việt; không dịch καὶ thành một từ riêng vì “cũng” ở đây sẽ nặng câu mà không thêm ý nghĩa cần thiết.
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong cách dùng của Phao-lô, cụm này thường chỉ những dân không thuộc dân Do Thái; “các dân ngoại” bảo tồn phạm trù dân tộc–tôn giáo mà không diễn giải thành lời miệt thị.
- source_word: τὰ μὴ εἰδότα
  choice: không biết
  rationale: Phân từ phủ định mô tả tình trạng đang có của các dân ngoại; “không biết” là cách diễn đạt gọn và tự nhiên.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt và tương ứng trực tiếp với θεός trong câu.
theological_decisions:
- issue: Sắc thái của πάθει ἐπιθυμίας
  choice: đam mê dục vọng
  alternative: dục vọng mãnh liệt; đam mê do ham muốn
  rationale: Bản dịch giữ cả sức mạnh của πάθος lẫn tính ham muốn lệch lạc của ἐπιθυμία trong văn cảnh đạo đức tình dục, nhưng không xác định chi tiết hơn điều nguyên văn nói.
- issue: Phạm vi của τὰ ἔθνη
  choice: các dân ngoại
  alternative: các dân tộc; những người ngoại giáo
  rationale: “Các dân ngoại” giữ được cách phân loại thường gặp trong thư Phao-lô. “Những người ngoại giáo” nhấn mạnh tôn giáo hơn nguyên văn, còn “các dân tộc” trong tiếng Việt hiện đại có thể bị hiểu quá rộng.
- issue: Ý nghĩa của “không biết Đức Chúa Trời”
  choice: giữ nguyên mệnh đề, không giải thích thêm bản chất của sự không biết
  alternative: không nhận biết Đức Chúa Trời; không có mối quan hệ với Đức Chúa Trời
  rationale: Nguyên văn có thể bao hàm cả nhận thức lẫn sự nhận biết mang tính quan hệ. Bản dịch không thu hẹp sự căng thẳng thần học ấy bằng một lời diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng mệnh đề tiếp nối câu 4, nên mở đầu bằng chữ thường và kết thúc bằng dấu phẩy. “Theo đam mê dục vọng” tự nhiên hơn lối sao phỏng cứng “trong đam mê của dục vọng,” đồng thời vẫn bảo toàn nội dung của cụm Hy Lạp.
