  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: vi
  text: 'Vì chúng tôi nói với anh em điều này theo lời Chúa[a]: chúng ta là những người đang sống, còn ở lại cho đến khi Chúa quang lâm[b], chắc chắn sẽ không đi trước những người đã ngủ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng một lời từ Chúa.” Cụm Hy Lạp có thể chỉ một lời phán của Chúa Giê-su hoặc một sự mặc khải được ban với thẩm quyền của Chúa.'
    reason: alternative_reading
  - marker: b
    text: “Quang lâm” dịch từ tiếng Hy Lạp παρουσία, cũng có thể được diễn đạt là “sự đến” hoặc “sự hiện diện.”
    reason: lexical_alternative
  - marker: c
    text: “Những người đã ngủ” là hình ảnh chỉ những tín hữu đã chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: bằng một lời từ Chúa
  rationale: Cách dịch này giữ sắc thái phương tiện hoặc thẩm quyền của ἐν, đồng thời không xác định quá mức rằng đây là lời phán trực tiếp của Chúa Giê-su hay sự mặc khải được ban với thẩm quyền của Ngài.
- source_word: παρουσίαν
  choice: ngày Chúa quang lâm
  rationale: Trong ngữ cảnh cánh chung, παρουσία chỉ sự hiện đến của Chúa. “Quang lâm” là cách diễn đạt trang trọng, quen thuộc trong tiếng Việt và nhấn mạnh biến cố Chúa hiện đến; chú thích bảo lưu các nét nghĩa “sự hiện diện” và “sự đến”.
- source_word: οἱ ζῶντες
  choice: chúng ta là những người đang sống
  rationale: Giữ ngôi thứ nhất số nhiều và ý nghĩa hiện tại của phân từ, không biến lời nói của Phao-lô thành khẳng định rằng ông chắc chắn sẽ còn sống khi Chúa đến.
- source_word: οἱ περιλειπόμενοι
  choice: còn lại
  rationale: Diễn đạt trung tính những người vẫn còn sống cho đến thời điểm ấy, tránh thêm sắc thái “sống sót” vốn có thể mang tính diễn giải.
- source_word: οὐ μὴ φθάσωμεν
  choice: chắc chắn sẽ không đi trước
  rationale: “Chắc chắn sẽ không” thể hiện phủ định nhấn mạnh οὐ μή; “đi trước” truyền đạt nghĩa của φθάνω trong ngữ cảnh là có trước hoặc được ưu tiên trước.
- source_word: τοὺς κοιμηθέντας
  choice: những người đã ngủ
  rationale: Giữ nguyên ẩn dụ ngủ dành cho những người đã chết và phản ánh sắc thái của phân từ aorist là họ đã đi vào giấc ngủ.
- source_word: κύριος / κυρίου
  choice: Chúa
  rationale: Trong câu này, danh xưng κύριος chỉ Chúa Giê-su, đặc biệt trong bối cảnh Ngài quang lâm.
theological_decisions:
- issue: Bản chất của “một lời từ Chúa”
  choice: Dịch theo cách khẳng định thẩm quyền của Chúa nhưng không quyết định phương thức lời ấy được truyền đạt.
  alternative: Có thể hiểu là một lời phán đã được lưu truyền của Chúa Giê-su, hoặc một sự mặc khải mang thẩm quyền của Chúa ban cho Phao-lô.
  rationale: Cụm ἐν λόγῳ κυρίου không tự nó xác định rõ nguồn truyền đạt, nên bản dịch và chú thích bảo lưu sự mơ hồ chân thực này.
- issue: Việc Phao-lô dùng ngôi “chúng ta” về những người còn sống
  choice: Giữ nguyên ngôi thứ nhất số nhiều của bản Hy Lạp.
  alternative: Diễn giải thành “những người còn sống” để tránh hàm ý Phao-lô tự kể mình vào nhóm ấy.
  rationale: Nguyên văn nói ἡμεῖς οἱ ζῶντες. Giữ “chúng ta” không buộc phải hiểu rằng Phao-lô tuyên bố chắc chắn mình sẽ sống đến ngày Chúa quang lâm; nó bảo tồn hình thức và sức trực tiếp của lời văn.
- issue: Ý nghĩa của κοιμηθέντας
  choice: Giữ ẩn dụ “đã ngủ” về những tín hữu đã chết.
  alternative: Dịch thẳng là “những người đã chết”.
  rationale: Ẩn dụ ngủ bảo tồn sắc thái hy vọng phục sinh trong lời của Phao-lô mà không phủ nhận cái chết thể xác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” phù hợp với cách xưng hô cộng đồng trong thư tín; “quang lâm” giữ sắc thái cánh chung quen thuộc nhưng được giải thích bằng chú thích. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
