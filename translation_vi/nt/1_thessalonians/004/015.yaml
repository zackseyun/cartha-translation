review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: lời nói có thẩm quyền từ Chúa (ἐν λόγῳ κυρίου), nhóm “chúng ta” đang sống và còn lại, mốc παρουσία của Chúa, phủ định nhấn mạnh οὐ μὴ φθάσωμεν, và ẩn dụ “ngủ” cho người đã chết. Tuy nhiên, “ngày Chúa quang lâm” thêm khái niệm “ngày”, không có trong nguyên văn; nên thay bằng mệnh đề thời gian trực tiếp hơn.'
  naturalness: “Bằng một lời từ Chúa” hiểu được nhưng không tự nhiên bằng “theo lời Chúa” trong văn phong thư tín hiện đại. “Còn lại” đứng độc lập cũng có thể gợi nghĩa những người còn sót lại; “còn ở lại” làm rõ hơn ý của περιλειπόμενοι. Cấu trúc sửa vẫn giữ giọng trang trọng, hiện đại và cách xưng hô cộng đồng “anh em/chúng ta”.
  terminology: Giữ “Chúa” cho κύριος và “quang lâm” cho παρουσία là phù hợp với văn cảnh cánh chung. Chú thích cần bảo lưu các khả năng ngữ nghĩa của παρουσία. “Những người đã ngủ” giữ được ẩn dụ của κοιμηθέντας; chú thích giải nghĩa theo ngữ cảnh mà không thay ẩn dụ trong chính văn.
  issues:
  - severity: low
    issue: “ngày Chúa quang lâm” thêm từ “ngày”
    rationale: Nguyên văn chỉ nói “cho đến sự quang lâm/đến của Chúa” (εἰς τὴν παρουσίαν τοῦ κυρίου), không nêu “ngày”. “Cho đến khi Chúa quang lâm” truyền đạt mốc thời gian mà không thêm yếu tố này.
  - severity: low
    issue: Cụm “bằng một lời từ Chúa” hơi gượng trong tiếng Việt
    rationale: Cụm ἐν λόγῳ κυρίου có thể được diễn đạt tự nhiên là “theo lời Chúa”, vẫn nêu nền tảng/thẩm quyền của lời khẳng định và không quyết định đó là lời truyền trực tiếp hay mặc khải. Khả năng “bằng một lời từ Chúa” được giữ trong chú thích.
  - severity: low
    issue: “còn lại” chưa rõ nghĩa trong vị trí hiện tại
    rationale: '“Còn ở lại” diễn đạt tự nhiên hơn phân từ περιλειπόμενοι: những người vẫn còn sống cho tới thời điểm Chúa quang lâm, không thêm sắc thái “sống sót”.'
