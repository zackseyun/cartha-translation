  - severity: low
    issue: “Tránh xa” ít trực tiếp hơn “kiêng” đối với ἀπέχεσθαι.
    rationale: ἀπέχεσθαι mang nghĩa kiêng/nhịn khỏi điều gì. “Kiêng” là lựa chọn tự nhiên, gọn và sát hơn trong cấu trúc này.
