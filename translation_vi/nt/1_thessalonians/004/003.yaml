  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: vi
  text: 'Vì đây là ý muốn của Đức Chúa Trời: sự nên thánh của anh chị em, tức là anh chị em phải kiêng sự bất chính về tình dục[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự thánh khiết của anh chị em.”
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp porneia, một thuật ngữ rộng chỉ hành vi tình dục bất chính. Theo truyền thống thường dịch là “gian dâm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: ý muốn
  rationale: “Ý muốn” là cách diễn đạt tự nhiên và chuẩn trong tiếng Việt về ý định có thẩm quyền của Đức Chúa Trời; “ước muốn” sẽ quá nhẹ, còn “mục đích” có thể hàm ý tiền định mạnh hơn văn cảnh.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: sự nên thánh của anh chị em
  rationale: Cách dịch này giữ được cả ý nghĩa được biệt riêng cho Đức Chúa Trời lẫn đời sống ngày càng thánh khiết, mà không thu hẹp từ ngữ vào riêng địa vị hay tiến trình.
- source_word: ἀπέχεσθαι
  choice: tức là anh chị em phải tránh xa
  rationale: Động từ nguyên mẫu giải thích cụ thể nội dung của “sự nên thánh.” “Tức là” làm rõ quan hệ giải thích, còn “phải tránh xa” truyền đạt tự nhiên lực khuyên dạy của câu.
- source_word: πορνείας
  choice: sự gian dâm
  rationale: Trong cách dùng Kinh Thánh tiếng Việt, “gian dâm” có thể chỉ rộng các hành vi tình dục trái phép, nhưng vì độc giả hiện đại đôi khi hiểu hẹp là ngoại tình, chú thích nêu rõ phạm vi rộng của từ Hy Lạp.
- source_word: γάρ
  choice: Vì
  rationale: “Vì” giữ quan hệ nêu lý do giữa câu này và lời khuyên bảo ngay trước đó.
theological_decisions:
- issue: Ý nghĩa của ἁγιασμός trong lời khuyên về đạo đức
  choice: Dịch là “sự nên thánh,” với nội dung đạo đức được giải thích bằng mệnh đề tiếp theo.
  alternative: “Sự thánh khiết” hoặc “việc anh chị em được làm nên thánh.”
  rationale: Bản dịch giữ độ rộng thần học của từ Hy Lạp và không quyết định thay người đọc rằng Phao-lô chỉ nói về một địa vị đã có hay chỉ về một tiến trình đạo đức.
- issue: Phạm vi của πορνεία
  choice: Dịch là “sự gian dâm,” kèm chú thích xác định đây là thuật ngữ rộng.
  alternative: “Sự vô luân về tình dục” hoặc cách hiểu hẹp chỉ quan hệ tình dục trước hôn nhân.
  rationale: Từ Hy Lạp bao quát hành vi tình dục bất chính nói chung; chú thích ngăn cách hiểu quá hẹp mà không đưa thêm một danh mục giáo phái hay văn hóa vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμᾶς; giữ cấu trúc giải thích của câu Hy Lạp bằng dấu hai chấm và “tức là.”
