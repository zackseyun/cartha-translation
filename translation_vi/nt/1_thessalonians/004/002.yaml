  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: vi
  text: Vì anh chị em biết chúng tôi đã đưa ra cho anh chị em những chỉ thị nào qua Chúa Giê-su[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ thẩm quyền của Chúa Giê-su.”'
    reason: 'Cách hiểu khác của διά với sở hữu cách: ngoài ý trung gian hoặc phương tiện, ngữ cảnh cũng có thể hàm ý thẩm quyền.'
lexical_decisions:
- source_word: οἴδατε
  choice: anh chị em biết
  rationale: οἶδα là dạng hoàn thành nhưng mang nghĩa hiện tại trong tiếng Hy Lạp Koine; “biết” là cách diễn đạt tự nhiên trong tiếng Việt. “Anh chị em” diễn đạt đại từ số nhiều ὑμεῖς trong văn phong thư tín hiện đại.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này nêu lý do hoặc cơ sở giải thích cho lời trước đó; “Vì” giữ rõ mối liên kết lập luận.
- source_word: τίνας παραγγελίας
  choice: những chỉ thị nào
  rationale: παραγγελία chỉ lời chỉ dẫn có tính thẩm quyền, mệnh lệnh hoặc huấn thị. “Những chỉ thị” giữ được sắc thái thẩm quyền, còn τίνας được thể hiện tự nhiên bằng “nào”.
- source_word: ἐδώκαμεν ὑμῖν
  choice: chúng tôi đã truyền cho anh chị em
  rationale: Động từ δίδωμι có nghĩa đen là “ban/đưa ra”, nhưng khi đi với παραγγελίας, tiếng Việt tự nhiên dùng “truyền chỉ thị”. Dạng aorist được thể hiện bằng “đã”.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: qua Chúa Giê-su
  rationale: διά với sở hữu cách có thể chỉ phương tiện hoặc trung gian. “Qua Chúa Giê-su” bám sát cấu trúc nguồn và không loại trừ sắc thái thẩm quyền.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” là cách dịch tiêu chuẩn, trang trọng và quen thuộc của κύριος trong ngữ cảnh Tân Ước.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Dùng dạng phiên âm tiếng Việt tiêu chuẩn của tên riêng Ἰησοῦ.
theological_decisions:
- issue: Ý nghĩa của διὰ τοῦ κυρίου Ἰησοῦ
  choice: qua Chúa Giê-su
  alternative: nhờ thẩm quyền của Chúa Giê-su
  rationale: Cụm từ Hy Lạp có thể nhấn mạnh Chúa Giê-su là trung gian/phương tiện hoặc thẩm quyền mà dựa vào đó các chỉ thị được truyền. Bản chính giữ cách dịch gần hình thức “qua”, còn chú thích bảo lưu cách hiểu về thẩm quyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều nhằm nói trực tiếp với cả cộng đồng; “chỉ thị” giữ sắc thái có thẩm quyền của παραγγελία mà không quá nặng như “mệnh lệnh”.
