  source_fidelity: Bản dịch truyền đạt đúng mạch giải thích của γάρ, đại từ số nhiều, nội dung của τίνας παραγγελίας, và cụm διὰ τοῦ κυρίου Ἰησοῦ. Tuy nhiên, “đã truyền ... những chỉ thị” không phản ánh trực tiếp và rõ ràng bằng động từ ἐδώκαμεν (“đã đưa ra/ban cho”), đồng thời cách kết hợp này hơi gượng trong tiếng Việt.
  naturalness: “Vì anh chị em biết chúng tôi đã truyền cho anh chị em những chỉ thị nào...” có thể hiểu được, nhưng “truyền những chỉ thị” kém tự nhiên hơn “đưa ra cho ... những chỉ thị”. Bản sửa giữ văn phong thư tín trang trọng, hiện đại và rõ cú pháp.
