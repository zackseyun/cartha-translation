id: 1TH.4.11
reference: 1 Thessalonians 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: vi
  text: và hãy lấy việc sống bình lặng làm mục tiêu[a], lo việc riêng của mình[b] và làm việc bằng chính đôi tay mình, như chúng tôi đã truyền bảo anh chị em,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy quyết tâm sống bình lặng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chuyên tâm vào công việc của chính mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: hãy đặt mục tiêu
  rationale: Động từ diễn tả việc coi điều gì là mục tiêu đáng quý và nhiệt thành theo đuổi. “Hãy đặt mục tiêu” tự nhiên trong tiếng Việt hiện đại, đồng thời giữ được nét nghịch lý của việc chủ tâm hướng đến một đời sống yên lặng.
- source_word: ἡσυχάζειν
  choice: sống yên lặng
  rationale: Trong lời khuyên này, từ ngữ nói đến lối sống bình lặng, ổn định, chứ không chỉ là không nói năng.
- source_word: πράσσειν τὰ ἴδια
  choice: lo việc riêng của mình
  rationale: Cụm từ chỉ việc chuyên tâm xử lý những việc thuộc trách nhiệm của chính mình. Cách dịch này giữ đúng nghĩa thành ngữ mà không mang sắc thái gắt gỏng.
- source_word: ἐργάζεσθαι
  choice: làm việc
  rationale: Cách dịch tự nhiên và đủ rộng cho động từ chỉ làm việc hoặc lao động.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: bằng chính đôi tay mình
  rationale: Diễn đạt vai trò phương tiện của cách và giữ sự nhấn mạnh vào lao động bằng tay của chính người nghe.
- source_word: καθὼς
  choice: như
  rationale: Nối lời khuyên hiện tại với chỉ thị các sứ đồ đã ban trước đó một cách tự nhiên.
- source_word: παρηγγείλαμεν
  choice: chúng tôi đã truyền bảo
  rationale: “Truyền bảo” giữ sắc thái chỉ thị có thẩm quyền của động từ mà vẫn trang trọng, dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Uy lực đạo đức của lời chỉ dẫn từ các sứ đồ
  choice: đã truyền bảo
  alternative: đã chỉ dạy
  rationale: “Truyền bảo” thể hiện đây là lời chỉ dẫn có thẩm quyền chứ không chỉ là lời gợi ý, nhưng không cường điệu thành một mệnh lệnh cưỡng chế.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμῖν theo cách bao gồm cả cộng đồng. Cấu trúc nối tiếp bằng dấu phẩy được giữ vì câu này tiếp nối mạch cú pháp từ câu trước.
