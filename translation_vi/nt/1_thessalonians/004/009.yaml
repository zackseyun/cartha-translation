source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: vi
  text: Còn về tình yêu thương giữa anh chị em[a], anh chị em không cần ai viết cho mình[b], vì chính anh chị em được Đức Chúa Trời dạy yêu thương nhau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ dùng một từ chỉ tình yêu thương mang tính gia đình giữa anh chị em; trong bối cảnh thư, từ này nói về mối quan hệ giữa các tín hữu.
    reason: lexical_alternative
  - marker: b
    text: 'Sát theo cấu trúc nguyên ngữ: “anh chị em không có nhu cầu viết cho anh chị em.” Chủ thể của động từ “viết” được hàm ý nhưng không nêu rõ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Còn về
  rationale: Đánh dấu sự chuyển sang một chủ đề mới nhưng vẫn nối nhẹ với phần trước, không thêm ý thời gian vốn không có trong nguyên văn.
- source_word: φιλαδελφίας
  choice: tình yêu thương anh chị em trong Chúa
  rationale: Diễn đạt tình thân mang tính gia đình giữa các tín hữu, đồng thời phân biệt danh từ này với động từ ἀγαπᾶν ở cuối câu.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: anh chị em không cần ai viết để dạy mình
  rationale: Chủ ngữ của động từ nguyên mẫu không được nêu rõ. Cách dịch này giữ tính không xác định ấy, còn cụm 'để dạy mình' diễn đạt tự nhiên mục đích của việc viết trong ngữ cảnh.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: vì chính anh chị em
  rationale: Từ 'chính' chuyển tải sự nhấn mạnh của tổ hợp đại từ trong tiếng Hy Lạp.
- source_word: θεοδίδακτοί
  choice: đã được Đức Chúa Trời dạy
  rationale: Diễn đạt rõ tác nhân thần linh của tính từ hiếm θεοδίδακτος bằng tiếng Việt tự nhiên và trang trọng.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: phải yêu thương nhau
  rationale: Diễn đạt nội dung và hướng đích của sự dạy dỗ; 'yêu thương nhau' tự nhiên trong tiếng Việt và vẫn giữ động từ rộng nghĩa hơn φιλαδελφία.
theological_decisions:
- issue: Sự phân biệt giữa φιλαδελφία và ἀγαπᾶν trong cùng câu
  choice: Dịch φιλαδελφία là 'tình yêu thương anh chị em trong Chúa' và ἀγαπᾶν là 'yêu thương' để giữ sự biến đổi từ ngữ.
  alternative: Dùng cùng một cách diễn đạt 'yêu thương nhau' cho cả hai.
  rationale: Cách chọn giữ được hình ảnh gia đình trong cộng đồng tín hữu ở đầu câu mà không thu hẹp nghĩa của động từ yêu thương ở cuối câu.
- issue: Chủ ngữ hàm ẩn của γράφειν
  choice: Dùng chủ ngữ không xác định 'ai'.
  alternative: Dịch là 'chúng tôi viết cho anh chị em'.
  rationale: Phao-lô và các đồng tác giả rất có thể là chủ thể hàm ẩn theo ngữ cảnh, nhưng nguyên văn không nêu chủ ngữ; cách dịch được chọn giữ sự không xác định đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' để chuyển tải ngôn ngữ gia đình bao gồm cả nam lẫn nữ trong cộng đồng tín hữu; dùng 'Đức Chúa Trời' nhất quán cho θεός.
