    issue: “viết để dạy mình” thêm ý mục đích/nội dung cho việc viết.
    rationale: γράϕειν ὑμῖν chỉ nói việc viết cho người nhận; nguyên văn không nói rõ việc viết ấy là “để dạy.”
  - severity: medium
    issue: “phải yêu thương nhau” thêm sắc thái bắt buộc.
    rationale: Cấu trúc εἰς τὸ ἀγαπᾶν diễn tả hướng đích/kết quả của sự dạy dỗ, không dùng động từ chỉ nghĩa vụ như “phải.”
  - severity: low
    issue: “trong Chúa” là diễn giải được thêm vào bản văn chính.
    rationale: Bối cảnh thư hướng đến cộng đồng tín hữu, nhưng cụm này không xuất hiện trong 1 Tê-sa-lô-ni-ca 4:9; nên để thông tin bối cảnh ở chú thích.
