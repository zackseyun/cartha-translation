- from: Còn về tình yêu thương anh chị em trong Chúa[a], anh chị em không cần ai viết để dạy mình[b], vì chính anh chị em đã được Đức Chúa Trời dạy phải yêu thương nhau.
  to: Còn về tình yêu thương giữa anh chị em[a], anh chị em không cần ai viết cho mình[b], vì chính anh chị em được Đức Chúa Trời dạy yêu thương nhau.
  rationale: Bản sửa loại bỏ các ý được thêm vào (“để dạy,” “phải,” và “trong Chúa”) nhưng vẫn giữ câu tiếng Việt trôi chảy, tính bao gồm của “anh chị em,” sự nhấn mạnh của nguyên văn, và khác biệt từ vựng giữa φιλαδελφία với ἀγαπᾶν.
