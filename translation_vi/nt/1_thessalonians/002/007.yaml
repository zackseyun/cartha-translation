  to: Dù với tư cách là các sứ đồ của Đấng Mê-si[a], chúng tôi có thể có trọng lượng, nhưng chúng tôi đã trở nên dịu dàng giữa anh chị em, như người mẹ đang cho con bú âu yếm chính con mình.[b]
