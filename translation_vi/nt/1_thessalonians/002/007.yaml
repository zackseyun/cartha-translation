reference: 1 Thessalonians 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: vi
  text: Dù với tư cách là các sứ đồ của Đấng Mê-si[a], chúng tôi có thể có trọng lượng, nhưng chúng tôi đã trở nên dịu dàng giữa anh chị em, như người mẹ đang cho con bú âu yếm chính con mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “có thể đưa ra những đòi hỏi” hoặc “có thể trở thành gánh nặng” với tư cách là các sứ đồ của Đấng Mê-si. Tiếng Hy Lạp nói theo nghĩa đen là “có ở trong sức nặng.” “Đấng Christ” là cách dịch truyền thống của “Đấng Mê-si.”
    reason: Bảo lưu độ rộng của thành ngữ ἐν βάρει εἶναι, đồng thời ghi nhận cách dịch truyền thống của Χριστοῦ.
  - marker: b
    text: Hay “như một người nuôi trẻ” hoặc “như một nhũ mẫu”; hình ảnh nhấn mạnh sự chăm sóc dịu dàng như mẹ đối với con.
    reason: τροφός có phạm vi nghĩa rộng hơn riêng “người mẹ đang cho con bú”.
lexical_decisions:
- source_word: δυνάμενοι
  choice: Dù có thể
  rationale: Phân từ mang sắc thái nhượng bộ do tương phản với ἀλλά; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ἐν βάρει εἶναι
  choice: dùng uy thế
  rationale: Thành ngữ nghĩa đen là “ở trong sức nặng”; trong ngữ cảnh, nó có thể chỉ việc vận dụng địa vị hay quyền của sứ đồ. “Dùng uy thế” giữ được ẩn dụ về sức nặng mà không giới hạn nghĩa vào gánh nặng tài chính.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: của các sứ đồ của Đấng Mê-si
  rationale: ὡς nêu tư cách; Χριστοῦ là sở hữu cách và Χριστός ở đây mang tính tước hiệu, nên dịch là “Đấng Mê-si”.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: nhưng chúng tôi đã trở nên
  rationale: Giữ lực động của γίνομαι thay vì giản lược thành trạng thái “đã dịu dàng”.
- source_word: ἤπιοι
  choice: dịu dàng
  rationale: Truyền đạt tính hiền hòa, mềm mại và phù hợp với hình ảnh chăm sóc của người mẹ ở vế sau.
- source_word: ἐν μέσῳ ὑμῶν
  choice: giữa anh chị em
  rationale: Cách nói tự nhiên cho “ở giữa các bạn”; “anh chị em” phù hợp lối xưng hô cộng đồng trong thư tín mà không giả định chỉ một giới.
- source_word: ὡς ἐὰν τροφὸς
  choice: như người mẹ đang cho con bú
  rationale: τροφός có thể là người nuôi trẻ hay nhũ mẫu; khi đi với “chính con mình”, hình ảnh người mẹ cho con bú là tự nhiên nhất, nhưng độ rộng từ vựng được ghi chú.
- source_word: θάλπῃ
  choice: âu yếm
  rationale: Động từ có nghĩa gốc là sưởi ấm và mở rộng thành chăm sóc trìu mến; “âu yếm” diễn đạt sắc thái dịu dàng trong phép so sánh.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: chính con mình
  rationale: “Con” dịch τέκνα tự nhiên; “chính” thể hiện sự nhấn mạnh của đại từ phản thân ἑαυτῆς.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm “các sứ đồ của…”, Χριστός vận hành như tước hiệu; “Đấng Mê-si” làm rõ nghĩa này, còn cách gọi truyền thống được bảo lưu trong chú thích.
- issue: Sắc thái của ἐν βάρει εἶναι
  choice: dùng uy thế
  alternative: trở thành gánh nặng; đưa ra những đòi hỏi
  rationale: Cụm Hy Lạp cố ý rộng và có thể liên quan đến quyền hạn, yêu sách hoặc gánh nặng. Bản chính ưu tiên địa vị sứ đồ trong ngữ cảnh, đồng thời chú thích các khả năng khác để không khóa nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng tôi” cho nhóm tác giả và “anh chị em” cho cộng đồng nhận thư. Câu giữ thế tương phản nhượng bộ của nguyên văn và hình ảnh mẫu tử ở cuối câu.
