id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: vi
  text: ngăn cản chúng tôi nói với các dân ngoại để họ được cứu; như thế, họ cứ mãi làm cho tội lỗi của mình đầy trọn. Nhưng cơn thịnh nộ[b] rốt cuộc[a] đã đến trên họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Rốt cuộc” cũng có thể được hiểu là “hoàn toàn” hoặc “cho đến tận cùng” (Hy Lạp: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: “Cơn thịnh nộ” có lẽ chỉ sự phán xét của Đức Chúa Trời, nhưng ở đây Phao-lô không nói rõ là sự phán xét lịch sử đang xảy ra, sự phán xét chung cuộc, hay cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: ngăn cản
  rationale: Diễn đạt trực tiếp hành động cản trở đang tiếp diễn trong mạch mô tả trước đó, không hàm ý quá mức về một lệnh cấm pháp lý.
- source_word: τοῖς ἔθνεσιν
  choice: các dân ngoại
  rationale: Trong ngữ cảnh Phao-lô, cụm từ chỉ những người không thuộc dân Do Thái, không phải các quốc gia theo nghĩa địa chính trị.
- source_word: λαλῆσαι
  choice: nói với
  rationale: Giữ nghĩa trực tiếp của động từ; nội dung rao truyền được xác định bởi văn cảnh và mệnh đề mục đích tiếp theo.
- source_word: ἵνα σωθῶσιν
  choice: để họ được cứu
  rationale: Giữ mệnh đề mục đích cùng thể bị động của σῴζω mà không thu hẹp ý nghĩa thần học.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: như thế ... làm cho ... đầy trọn
  rationale: Phản ánh hệ quả trong văn cảnh mà không khẳng định rằng việc làm đầy tội lỗi là chủ ý có ý thức của họ; đồng thời không loại bỏ hoàn toàn sắc thái mục đích có thể có của cấu trúc Hy Lạp.
- source_word: ἀναπληρῶσαι
  choice: làm cho ... đầy trọn
  rationale: Diễn tả việc đưa đến mức đầy đủ. Không thêm danh từ 'mức' vốn không có trực tiếp trong câu Hy Lạp.
- source_word: πάντοτε
  choice: cứ mãi
  rationale: Diễn đạt tự nhiên một khuôn mẫu dai dẳng, tương ứng với trạng từ 'luôn luôn' trong nguyên văn.
- source_word: ἔφθασεν
  choice: đã giáng trên
  rationale: Trong kết hợp với ἐπ’ αὐτούς, cách nói này truyền đạt việc cơn thịnh nộ đã đến trên họ và có sức nặng phán xét, nhưng không xác định một biến cố lịch sử cụ thể.
- source_word: ὀργή
  choice: cơn thịnh nộ
  rationale: Giữ sức nặng thần học và sắc thái phán xét của từ Hy Lạp tốt hơn 'cơn giận'; không thay thẳng bằng 'sự phán xét', vốn mang tính diễn giải.
- source_word: εἰς τέλος
  choice: đến cùng
  rationale: Giữ được sự mơ hồ của cụm Hy Lạp giữa ý thời điểm chung cuộc, sự trọn vẹn và mức độ hoàn toàn; các khả năng được nêu trong chú thích.
theological_decisions:
- issue: Đối tượng và tính chất của 'cơn thịnh nộ'
  choice: Giữ 'cơn thịnh nộ' như một cách nói có sức nặng thần học, hàm ý cơn thịnh nộ hoặc sự phán xét của Đức Chúa Trời nhưng không xác định thời điểm.
  alternative: Một sự phán xét lịch sử cụ thể; sự phán xét chung cuộc; hoặc lời nói báo trước kết hợp hiện tại và tương lai.
  rationale: Câu văn nói cơn thịnh nộ đã đến trên họ nhưng không nêu rõ biến cố nào; bản dịch không nên tự giải quyết điều nguyên văn để ngỏ.
- issue: Sắc thái của εἰς τὸ ἀναπληρῶσαι
  choice: Dịch theo hướng hệ quả bằng 'như thế' nhưng vẫn để ngỏ sắc thái mục đích.
  alternative: 'Dịch rõ là mục đích: ''để làm đầy trọn tội lỗi của họ''.'
  rationale: Cách này tránh gán cho những người chống đối ý định có ý thức muốn hoàn tất tội lỗi, đồng thời tôn trọng cấu trúc Hy Lạp vốn có thể mang sắc thái mục đích hoặc kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'các dân ngoại' theo cách gọi quen thuộc trong Kinh Thánh tiếng Việt. Cụm 'đến cùng' hơi cô đọng nhưng chủ ý bảo tồn sự đa nghĩa của εἰς τέλος; chú thích giải thích các khả năng. Hai dấu chú thích được đặt sau toàn bộ mệnh đề cuối vì cả hai cùng làm rõ các yếu tố trong mệnh đề ấy.
