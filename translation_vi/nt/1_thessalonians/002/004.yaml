language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: vi
  text: Nhưng vì Đức Chúa Trời đã xét và chấp thuận giao phó Tin Mừng cho chúng tôi, nên chúng tôi nói như vậy—không phải để làm đẹp lòng người ta, nhưng để làm đẹp lòng Đức Chúa Trời[a], Đấng dò xét lòng chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp diễn đạt cô đọng: chỉ nêu rõ ý “làm đẹp lòng” ở vế đầu; ở vế sau, ý ấy được hiểu ngầm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: đã được Đức Chúa Trời xét và chấp thuận
  rationale: Thể hoàn thành bị động diễn tả một sự thẩm định đã diễn ra và kết quả vẫn còn hiệu lực. Cụm “xét và chấp thuận” giữ cả quá trình xem xét lẫn kết quả được công nhận, không hàm ý rằng họ tự chứng minh mình xứng đáng.
- source_word: πιστευθῆναι
  choice: để giao phó
  rationale: Trong cấu trúc bị động này, nghĩa là được Đức Chúa Trời giao Tin Mừng cho quản nhiệm, chứ không phải tin vào Tin Mừng. Tiếng Việt có thể diễn đạt tự nhiên bằng “được… chấp thuận để giao phó Tin Mừng”, trong đó người nhận việc giao phó là “chúng tôi”.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” là cách dịch quen thuộc, rõ nghĩa và trang trọng trong tiếng Việt, đồng thời giữ được nội hàm thần học của thuật ngữ Phao-lô dùng.
- source_word: οὕτως λαλοῦμεν
  choice: thì chúng tôi nói như vậy
  rationale: Cách dịch này giữ mối liên hệ giữa việc Đức Chúa Trời đã xét, chấp thuận và giao phó Tin Mừng với cách các sứ giả nói.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: không phải như đang làm đẹp lòng người ta
  rationale: Giữ cấu trúc phân từ và ý rằng cách họ nói không mang đặc tính chiều lòng con người. “Người ta” ở đây chỉ con người nói chung, đối lập với Đức Chúa Trời.
- source_word: ἀλλὰ θεῷ
  choice: nhưng Đức Chúa Trời
  rationale: 'Giữ sự tỉnh lược của nguyên văn: động từ “làm đẹp lòng” chỉ được nói rõ ở vế đầu nhưng được hiểu ngầm ở vế sau. Chú thích cung cấp cách diễn đạt đầy đủ, tự nhiên hơn.'
- source_word: τῷ δοκιμάζοντι
  choice: Đấng dò xét
  rationale: Phân từ hiện tại nói đến sự xem xét đang diễn ra của Đức Chúa Trời. “Dò xét” tự nhiên khi đi với “lòng” và truyền đạt sự thẩm định sâu kín, dù không lặp đúng một từ với “xét và chấp thuận” ở đầu câu.
- source_word: τὰς καρδίας ἡμῶν
  choice: lòng chúng tôi
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt về trung tâm nội tâm, ý hướng và động cơ của con người; không thu hẹp nghĩa thành riêng trí óc hay cảm xúc.
theological_decisions:
- issue: Diễn đạt sự tương phản giữa việc làm đẹp lòng con người và làm đẹp lòng Đức Chúa Trời mà không xóa sự tỉnh lược trong cú pháp của Phao-lô
  choice: 'Giữ vế tương phản rút gọn trong chính văn: “không phải như đang làm đẹp lòng người ta, nhưng Đức Chúa Trời”'
  alternative: “không phải để làm đẹp lòng người ta, nhưng để làm đẹp lòng Đức Chúa Trời”
  rationale: Nguyên văn chỉ nói rõ phân từ “làm đẹp lòng” trong vế đầu và để người đọc hiểu ngầm ở vế sau. Chính văn giữ phần nào sự cô đọng và căng thẳng tu từ ấy; chú thích nêu cách diễn đạt đầy đủ hơn để tránh hiểu lầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm nổi bật sự tương phản. Cụm “nhưng Đức Chúa Trời” được cố ý giữ cô đọng theo nguyên văn và đi kèm chú thích để bảo toàn cả sắc thái lẫn độ rõ nghĩa.
