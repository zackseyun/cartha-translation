  to: Nhưng vì Đức Chúa Trời đã xét và chấp thuận giao phó Tin Mừng cho chúng tôi, nên chúng tôi nói như vậy—không phải để làm đẹp lòng người ta, nhưng để làm đẹp lòng Đức Chúa Trời[a], Đấng dò xét lòng chúng tôi.
