id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: vi
  text: Vì chính anh em biết rằng lần chúng tôi đến với anh em không phải là vô ích, thưa anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ
  choice: chính anh em
  rationale: Đại từ nhấn mạnh làm nổi bật sự hiểu biết trực tiếp của chính các tín hữu Tê-sa-lô-ni-ca; “chính anh em” tự nhiên hơn nhưng vẫn giữ lực nhấn mạnh.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nối câu này với ý trước như một lời giải thích hoặc căn cứ; “Vì” giữ được mạch lập luận.
- source_word: οἴδατε
  choice: biết
  rationale: Dù có hình thức hoàn thành, οἶδα thường mang nghĩa hiện tại; “biết” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức xưng gọi giống đực của nguyên văn. Trong cách dùng của Phao-lô, từ này thường hướng đến toàn thể cộng đồng tín hữu, điều đó được nêu trong chú thích.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: việc chúng tôi đến với anh em
  rationale: Diễn đạt tự nhiên sự đến nơi và hiện diện của nhóm Phao-lô giữa người Tê-sa-lô-ni-ca, đồng thời giữ hướng nghĩa của πρὸς ὑμᾶς.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều họ biết.
- source_word: οὐ κενὴ γέγονεν
  choice: đã không trở nên vô ích
  rationale: 'Giữ sắc thái kết quả của thể hoàn thành γέγονεν và nghĩa đánh giá của κενή: chuyến đến ấy không rỗng không, không vô hiệu hay không kết quả.'
theological_decisions:
- issue: Phạm vi người được gọi bằng ἀδελφοί
  choice: thưa anh em
  alternative: thưa anh chị em
  rationale: Bản chính giữ hình thức giống đực của tiếng Hy Lạp, nhưng chú thích nêu rõ rằng trong văn cảnh thư tín Phao-lô, cách gọi này thường bao gồm cả cộng đồng tín hữu nam và nữ.
- issue: Ý nghĩa của οὐ κενὴ
  choice: đã không trở nên vô ích
  alternative: đã không trở nên trống rỗng / không kết quả
  rationale: “Vô ích” giữ được nhận định rộng của câu mà không buộc nghĩa chỉ vào thành quả truyền giáo hay động cơ của các sứ đồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “đã không trở nên vô ích” hơi trang trọng nhưng giúp phản ánh thể hoàn thành và tránh làm phẳng sắc thái của nguyên văn.
