id: 1TH.2.5
reference: 1 Thessalonians 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: vi
  text: Vì chúng tôi không bao giờ đến với lời nịnh hót[a], như anh chị em biết, cũng không lấy cớ để che đậy lòng tham[b]—Đức Chúa Trời làm chứng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng sự nịnh hót”; sát nghĩa: “trong lời nịnh hót.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “với cái cớ của lòng tham” hoặc “dùng vẻ bề ngoài để che giấu lòng tham.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: Vì chúng tôi không bao giờ
  rationale: “Vì” giữ liên kết giải thích của γάρ với câu trước; οὔτε ... ποτε được diễn đạt tự nhiên và nhấn mạnh về thời gian bằng “không bao giờ,” còn ý song hành của οὔτε được tiếp nối bằng “cũng không” ở vế sau.
- source_word: ἐν λόγῳ κολακείας
  choice: với lời nịnh hót
  rationale: λόγος ở đây chỉ lời nói, còn κολακεία là sự nịnh hót nhằm lấy lòng. Cách dịch này giữ sắc thái phương tiện của ἐν mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐγενήθημεν
  choice: đến
  rationale: Trong bối cảnh chuyến đến phục vụ tại Tê-sa-lô-ni-ca, γίνομαι mô tả cách Phao-lô và các cộng sự xuất hiện hoặc đến giữa họ. “Đến” phù hợp ngữ cảnh mà không dịch cứng thành “trở nên.”
- source_word: καθὼς οἴδατε
  choice: như anh chị em biết
  rationale: Giữ nguyên lời viện dẫn trực tiếp đến hiểu biết của cộng đồng người nhận thư; “anh chị em” là cách xưng hô cộng đồng tự nhiên, trang trọng và bao quát trong tiếng Việt hiện đại.
- source_word: ἐν προφάσει πλεονεξίας
  choice: lấy cớ để che đậy lòng tham
  rationale: πρόφασις có thể là cái cớ, vẻ bề ngoài hoặc sự che đậy; πλεονεξία là lòng tham muốn chiếm hữu thêm. Cách diễn đạt này làm rõ quan hệ giữa cái cớ bên ngoài và động cơ tham lam bị che giấu, đồng thời chú thích bảo lưu các cách hiểu sát hình thức hơn.
- source_word: θεὸς μάρτυς
  choice: Đức Chúa Trời làm chứng
  rationale: Giữ tính chất long trọng của lời kêu cầu Đức Chúa Trời làm chứng, đồng thời không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
theological_decisions:
- issue: Phạm vi lời phủ nhận về phương cách và động cơ của Phao-lô
  choice: Câu dịch phủ nhận cả lời nói nịnh hót lẫn lòng tham được che đậy bằng một cái cớ.
  alternative: Hiểu câu này như sự lên án mọi nghệ thuật tu từ, hoặc chỉ giới hạn lòng tham vào việc bóc lột tiền bạc.
  rationale: Bản Hy Lạp nêu cụ thể κολακεία và πλεονεξία. Vì vậy, bản dịch không mở rộng thành sự bác bỏ mọi lối nói trau chuốt, cũng không thu hẹp πλεονεξία chỉ vào tiền bạc, dù lợi ích vật chất có thể nằm trong phạm vi của từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều οἴδατε nhằm thể hiện cộng đồng người nhận thư mà không mặc định giới tính; nhịp câu song hành “không bao giờ ... cũng không ...” giữ sức biện hộ của nguyên văn.
