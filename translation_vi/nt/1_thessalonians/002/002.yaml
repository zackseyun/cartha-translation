  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: vi
  text: Nhưng sau khi đã chịu khổ và bị ngược đãi một cách nhục nhã[a] tại thành Phi-líp, như anh chị em đã biết, chúng tôi đã mạnh dạn trong Đức Chúa Trời của chúng tôi[b] để nói với anh chị em Tin Mừng của Đức Chúa Trời trong cuộc tranh đấu cam go[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị lăng nhục”, “bị đối xử tàn tệ” hoặc “bị ngược đãi”. Động từ Hy Lạp bao hàm ý bị đối xử xấc xược và làm nhục công khai.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhờ Đức Chúa Trời của chúng tôi mà mạnh dạn” hoặc “chúng tôi đã mạnh dạn nói trong Đức Chúa Trời của chúng tôi”. Cụm từ Hy Lạp có thể diễn tả phạm vi, nền tảng hoặc mối liên hệ của sự mạnh dạn.'
    reason: theological_ambiguity
  - marker: c
    text: 'Cũng có thể dịch: “trong nhiều sự tranh đấu”, “giữa nhiều xung đột” hoặc “trước nhiều sự chống đối”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với ý ở câu trước bằng liên từ tự nhiên trong tiếng Việt.
- source_word: προπαθόντες
  choice: dù trước đó chúng tôi đã chịu khổ
  rationale: Phân từ bất định chỉ sự chịu khổ xảy ra trước hành động chính; “trước đó” thể hiện sắc thái của tiền tố προ-.
- source_word: ὑβρισθέντες
  choice: bị đối xử nhục nhã
  rationale: Bao hàm việc bị ngược đãi một cách xấc xược, xúc phạm và làm mất danh dự, chứ không chỉ bị lăng mạ bằng lời nói.
- source_word: καθὼς οἴδατε
  choice: như anh chị em đã biết
  rationale: Giữ nguyên lời nhắc trực tiếp, mang tính xen chú, hướng đến cộng đồng tín hữu.
- source_word: ἐν Φιλίπποις
  choice: tại thành Phi-líp
  rationale: Dùng tên địa danh quen thuộc trong tiếng Việt và thêm “thành” để câu văn rõ, tự nhiên.
- source_word: ἐπαρρησιασάμεθα
  choice: chúng tôi vẫn mạnh dạn
  rationale: Động từ nói đến sự mạnh dạn, thẳng thắn, đặc biệt trong lời nói; “vẫn” làm rõ sự tương phản trong ngữ cảnh mà không thay đổi nội dung.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: trong Đức Chúa Trời của chúng tôi
  rationale: Giữ cấu trúc “trong” để bảo toàn sắc thái về phạm vi, mối liên hệ hoặc nền tảng của sự mạnh dạn, thay vì thu hẹp thành phương tiện hay nguyên nhân.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: mà nói cho anh chị em
  rationale: Diễn đạt tự nhiên hành động nói với người nghe, đồng thời giữ nội dung được xác định bởi cụm từ theo sau.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Tin Mừng của Đức Chúa Trời
  rationale: Giữ cấu trúc sở hữu chưa được xác định hẹp hơn—có thể chỉ nguồn gốc, quyền sở hữu hoặc nội dung liên hệ đến Đức Chúa Trời—và dùng thuật ngữ Cơ Đốc phổ thông.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: giữa nhiều sự chống đối
  rationale: Trong ngữ cảnh, ἀγών gợi một cuộc đấu tranh gay go giữa nghịch cảnh; cách dịch này dễ hiểu nhưng vẫn để chú thích nêu các khả năng “tranh đấu” và “xung đột”.
theological_decisions:
- issue: Sắc thái của ἐν τῷ θεῷ ἡμῶν
  choice: trong Đức Chúa Trời của chúng tôi
  alternative: nhờ Đức Chúa Trời của chúng tôi; với lòng tin cậy nơi Đức Chúa Trời của chúng tôi
  rationale: Bản dịch giữ ý nghĩa quan hệ hoặc phạm vi của giới từ ἐν, không mặc nhiên giới hạn Đức Chúa Trời chỉ là tác nhân tạo nên sự mạnh dạn.
- issue: Quan hệ sở hữu trong τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Tin Mừng của Đức Chúa Trời
  alternative: Tin Mừng đến từ Đức Chúa Trời; Tin Mừng nói về Đức Chúa Trời
  rationale: Cấu trúc “của Đức Chúa Trời” bảo toàn độ rộng của sở hữu cách Hy Lạp, tránh quyết định dứt khoát đó chỉ là nguồn gốc hay chỉ là nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς nhằm nói tự nhiên với toàn thể cộng đồng mà không giới hạn giới tính. “Đức Chúa Trời” và “Tin Mừng” là các thuật ngữ Cơ Đốc phổ thông; câu giữ sắc thái mạnh mẽ của lời chứng nhưng không tô đậm quá mức.
