  to: Nhưng sau khi đã chịu khổ và bị ngược đãi một cách nhục nhã[a] tại thành Phi-líp, như anh chị em đã biết, chúng tôi đã mạnh dạn trong Đức Chúa Trời của chúng tôi[b] để nói với anh chị em Tin Mừng của Đức Chúa Trời trong cuộc tranh đấu cam go[c].
