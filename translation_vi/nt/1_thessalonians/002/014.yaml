id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: vi
  text: Vì, thưa anh chị em, anh chị em đã noi gương các hội thánh của Đức Chúa Trời ở miền Giu-đê, trong Đấng Mê-si-a Jêsus[a], vì anh chị em cũng đã chịu những điều tương tự từ chính đồng bào mình, cũng như các hội thánh ấy đã chịu từ người Do Thái[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đấng Christ Jêsus.” Từ Hy Lạp Χριστός có nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “người Giu-đê.” Từ Hy Lạp ở đây có thể chỉ người Do Thái hoặc người thuộc miền Giu-đê, tùy ngữ cảnh; câu này không hàm ý mọi người Do Thái.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: đã noi gương
  rationale: Diễn đạt tự nhiên hành động trở thành người bắt chước, đồng thời giữ rõ ý so sánh của μιμηταί và sắc thái biến chuyển của ἐγενήθητε.
- source_word: ἀδελφοί
  choice: thưa anh chị em
  rationale: Lời gọi hướng đến toàn thể hội chúng; cách diễn đạt này truyền đạt lực bao hàm của số nhiều giống đực trong ngữ cảnh mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: các hội thánh của Đức Chúa Trời
  rationale: “Hội thánh” là cách gọi tự nhiên, trang trọng và quen thuộc cho cộng đồng tín hữu trong thư tín Phao-lô.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: tại miền Giu-đê
  rationale: Xác định vị trí địa lý của các hội thánh một cách gọn và rõ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a Jêsus
  rationale: Giữ thành ngữ hiệp nhất “ở trong” và chuyển tải Χριστός theo nghĩa tước hiệu “Đấng Mê-si-a”, không làm nó thành một tên riêng thuần túy.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: cũng đã chịu khổ
  rationale: πάσχω chỉ việc chịu đau khổ; “cũng” cùng cấu trúc so sánh ở cuối câu truyền đạt ý họ chịu những điều tương tự.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: chính đồng bào mình
  rationale: συμφυλέται nói đến người cùng dân tộc hoặc cộng đồng; ἰδίων được thể hiện bằng “chính ... mình” để giữ sắc thái thuộc về chính nhóm của họ.
- source_word: τῶν Ἰουδαίων
  choice: người Do Thái
  rationale: Đây là nghĩa dân tộc-tôn giáo tự nhiên trong sự đối chiếu với đồng bào của tín hữu Tê-sa-lô-ni-ca; phương án địa lý “người Giu-đê” được giữ trong chú thích vì từ Hy Lạp có thể mang cả hai nghĩa.
theological_decisions:
- issue: Χριστῷ là tước hiệu hay dạng gần như tên riêng
  choice: Đấng Mê-si-a Jêsus
  alternative: Đấng Christ Jêsus
  rationale: Bản dịch chính giữ nội dung tước hiệu của Χριστός, dù cụm này trong Phao-lô cũng có tính công thức cao.
- issue: Phạm vi của cụm “người Do Thái”
  choice: Không thêm từ ngữ khiến cụm này chỉ mọi người Do Thái nói chung
  alternative: người Giu-đê
  rationale: Ngữ cảnh nói đến những người đã gây khổ cho các hội thánh tại Giu-đê, không khẳng định mọi người Do Thái đều là tác nhân; bản dịch giữ cách gọi trực tiếp nhưng không phổ quát hóa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh chị em” để lời gọi bao gồm toàn thể hội chúng; “chính đồng bào mình” tự nhiên hơn một cách dịch sát hình thức nhưng vẫn giữ sắc thái nhấn mạnh. Cấu trúc “Thật vậy ... vì ...” phản ánh quan hệ giải thích-nguyên nhân của γάρ và ὅτι.
