revisions:
- from: Thật vậy, thưa anh chị em, anh chị em đã noi gương các hội thánh của Đức Chúa Trời tại miền Giu-đê, là những hội thánh ở trong Đấng Mê-si-a Jêsus[a], vì anh chị em cũng đã chịu khổ bởi chính đồng bào mình, giống như họ đã chịu bởi người Do Thái[b].
  to: Vì, thưa anh chị em, anh chị em đã noi gương các hội thánh của Đức Chúa Trời ở miền Giu-đê, trong Đấng Mê-si-a Jêsus[a], vì anh chị em cũng đã chịu những điều tương tự từ chính đồng bào mình, cũng như các hội thánh ấy đã chịu từ người Do Thái[b].
  rationale: Bản sửa phục hồi đầy đủ ý so sánh của τὰ αὐτὰ (“những điều tương tự”), dùng cách chỉ tác nhân tự nhiên hơn trong tiếng Việt, và làm rõ tiền ngữ của vế so sánh. Không thay đổi ý nghĩa, phạm vi quy chiếu, hay tính mơ hồ từ vựng của Ἰουδαίων.
  reviewer_model: gpt-5.6-terra
