id: 1TH.2.19
reference: 1 Thessalonians 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: vi
  text: Vì ai là niềm hy vọng, niềm vui hay vòng hoa của niềm tự hào của chúng tôi—chẳng phải cũng chính là anh chị em sao?—trước mặt Chúa chúng ta là Đức Giê-su khi Ngài đến[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khi Ngài hiện diện” hoặc “khi Ngài đến nơi”. Từ Hy Lạp παρουσία có thể chỉ sự hiện diện hoặc sự đến nơi; trong ngữ cảnh này, từ ấy nói đến lần đến trong tương lai của Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ai
  rationale: Từ Hy Lạp có thể là “ai” hoặc “gì”. Vì câu hỏi cuối cùng xác định những người Tê-sa-lô-ni-ca là niềm hy vọng, niềm vui và mão triều thiên, “ai” tự nhiên hơn trong tiếng Việt mà vẫn giữ cấu trúc tu từ của câu.
- source_word: γὰρ
  choice: vì
  rationale: Giữ quan hệ giải thích với mạch văn ngay trước đó.
- source_word: ἐλπὶς
  choice: niềm hy vọng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho sự trông đợi đầy tin cậy.
- source_word: χαρὰ
  choice: niềm vui
  rationale: Bản dịch trực tiếp, tự nhiên và giữ nguyên sắc thái tình cảm.
- source_word: στέφανος καυχήσεως
  choice: mão triều thiên để chúng tôi tự hào
  rationale: “Mão triều thiên” truyền đạt hình ảnh vòng hoa hay phần thưởng danh dự; cấu trúc “để chúng tôi tự hào” diễn đạt rõ quan hệ của καυχήσεως mà không biến nó thành “vui mừng”.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: chẳng phải chính là anh chị em sao?
  rationale: Câu hỏi tu từ chờ đợi câu trả lời khẳng định; “chính” chuyển tải sức nhấn mạnh của οὐχί và καί. “Anh chị em” là cách xưng hô cộng đồng tự nhiên, bao gồm cả nam lẫn nữ.
- source_word: ἔμπροσθεν
  choice: trước mặt
  rationale: Diễn đạt ngắn gọn việc ở trong sự hiện diện và trước sự chứng kiến của Chúa.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch tiêu chuẩn, tự nhiên của κύριος trong lời tuyên xưng về Đức Giê-su.
- source_word: παρουσίᾳ
  choice: khi Ngài đến
  rationale: Trong ngữ cảnh cánh chung của Phao-lô, từ này nói đến lần đến trong tương lai của Chúa Giê-su. Cách dịch này rõ ràng với độc giả hiện đại; nghĩa “hiện diện” và sắc thái “ngự đến” được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch παρουσίᾳ trong ngữ cảnh cánh chung
  choice: khi Ngài đến
  alternative: khi Ngài hiện diện; khi Ngài ngự đến
  rationale: Ngữ cảnh hướng đến lần đến trong tương lai của Chúa Giê-su, nhưng bản thân danh từ Hy Lạp cũng có thể chỉ sự hiện diện hoặc việc đến nơi. Bản chính dùng cách nói tự nhiên, còn chú thích bảo tồn phạm vi nghĩa và sự căng thẳng diễn giải.
- issue: Ý nghĩa của στέφανος καυχήσεως
  choice: mão triều thiên để chúng tôi tự hào
  alternative: mão triều thiên của niềm tự hào; vòng hoa chiến thắng để chúng tôi tự hào
  rationale: Bản dịch giữ cả hình ảnh phần thưởng danh dự lẫn ý tự hào, không mặc nhiên xác định đây là một loại phần thưởng cánh chung riêng biệt hay đổi καύχησις thành “vui mừng”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang giữ nét chen ngang đầy cảm xúc của câu Hy Lạp. Dùng “anh chị em” để chỉ toàn thể cộng đồng tín hữu và “Ngài” làm đại từ kính trọng dành cho Chúa Giê-su.
