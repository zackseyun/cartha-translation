  source_fidelity: Bản dịch giữ đúng liên từ γὰρ và phân biệt hợp lý hai vế nguồn gốc (ἐκ/ἐξ) với vế chỉ cách thức (ἐν). Tuy nhiên, “được thực hiện bằng thủ đoạn gian dối” hơi gượng vì chủ ngữ là “lời kêu gọi,” và “thủ đoạn” cụ thể hóa δόλῳ theo hướng một mánh khóe/phương kế hơn mức cần thiết.
  naturalness: “Lời kêu gọi” có thể hiểu là một lời hiệu triệu; trong ngữ cảnh biện hộ về sự rao giảng/khuyên nhủ, “lời khuyên nhủ” tự nhiên và sát παράκλησις hơn. “Được đưa ra bằng sự gian dối” là cách diễn đạt hiện đại, mạch lạc cho vế cuối.
