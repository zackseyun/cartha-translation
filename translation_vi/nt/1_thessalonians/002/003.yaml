source:
  edition: SBLGNT
  text: ἡ γὰρ παράκλησις ἡμῶν οὐκ ἐκ πλάνης οὐδὲ ἐξ ἀκαθαρσίας ⸀οὐδὲ ἐν δόλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: vi
  text: Vì lời khuyên nhủ của chúng tôi không xuất phát từ sự sai lầm, cũng không từ sự ô uế, và cũng không được đưa ra bằng sự gian dối.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lời khuyên nhủ” cũng có thể dịch là “lời kêu gọi” hoặc “lời khích lệ.” Từ Hy Lạp παράκλησις có thể mang các nghĩa này tùy ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: “Sự sai lầm” cũng có thể dịch là “sự lừa dối”; tuy nhiên, cụm “bằng sự gian dối” ở cuối câu trực tiếp diễn tả sự xảo trá có chủ ý hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: lời kêu gọi
  rationale: Trong ngữ cảnh Phao-lô biện hộ cho chức vụ và lời rao giảng của mình, “lời kêu gọi” diễn đạt tự nhiên hành động tha thiết khuyên nhủ người nghe, đồng thời không thu hẹp nghĩa vào sự an ủi.
- source_word: πλάνης
  choice: sự sai lầm
  rationale: Với ἐκ, từ này nói đến nguồn gốc của lời kêu gọi. “Sự sai lầm” giữ được khả năng chỉ điều sai lạc hoặc quan niệm sai, và phân biệt với δόλος là sự gian dối có chủ ý.
- source_word: ἀκαθαρσίας
  choice: sự ô uế
  rationale: Cách dịch này giữ nghĩa luân lý rộng của từ Hy Lạp, không tự ý giới hạn vào sự ô uế về tình dục.
- source_word: δόλῳ
  choice: thủ đoạn gian dối
  rationale: Cụm từ diễn tả cách thức hành động và hàm ý sự xảo trá có chủ ý. “Bằng thủ đoạn gian dối” tự nhiên trong tiếng Việt và phân biệt rõ với “sự sai lầm” ở vế trước.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: không xuất phát từ ... cũng không từ ... và cũng không được thực hiện bằng ...
  rationale: Phân biệt hai giới từ chỉ nguồn gốc ἐκ/ἐξ với ἐν chỉ cách thức hoặc phạm vi, đồng thời tạo câu tiếng Việt rõ ràng.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với câu trước và là liên từ mở đầu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của ἀκαθαρσία
  choice: Dịch rộng là “sự ô uế” mà không xác định riêng là hành vi tình dục.
  alternative: sự ô uế về tình dục; sự bất khiết
  rationale: Dù từ này có thể mang sắc thái tình dục trong một số ngữ cảnh của Phao-lô, chính câu này không xác định loại ô uế; vì vậy không nên đưa một cáo buộc hẹp hơn vào bản dịch.
- issue: Quan hệ giữa πλάνη và δόλος
  choice: Phân biệt “sự sai lầm” với “thủ đoạn gian dối”.
  alternative: Dịch cả hai theo hướng lừa dối.
  rationale: 'Cách dịch đã chọn bảo tồn sức căng của ba lời phủ định: nguồn gốc không phải là điều sai lạc hay ô uế, và phương cách không phải là sự xảo trá có chủ ý.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc phủ định ba vế, đồng thời diễn đạt rõ sự khác biệt giữa nguồn gốc (ἐκ/ἐξ) và cách thức (ἐν). Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
