source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: vi
  text: Vì chúng tôi đã muốn đến với anh chị em—chính tôi, Phao-lô, đã muốn đến hơn một lần—nhưng Sa-tan đã ngăn trở chúng tôi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διότι
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên nhân của mệnh đề trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἠθελήσαμεν
  choice: chúng tôi đã muốn
  rationale: Diễn đạt trực tiếp ý muốn hoặc ước muốn của chủ thể số nhiều, không thêm sắc thái quyết định hay kế hoạch chắc chắn.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: đến với anh chị em
  rationale: Giữ hình ảnh chuyển động hướng đến các tín hữu Tê-sa-lô-ni-ca; không tự ý thêm ý 'trở lại' hay thu hẹp thành một cuộc thăm viếng.
- source_word: ἐγὼ μὲν Παῦλος
  choice: riêng tôi là Phao-lô
  rationale: Làm rõ việc Phao-lô tự tách mình ra khỏi 'chúng tôi' để nhấn mạnh rằng chính ông đã nhiều lần muốn đến, mà không tạo một vế đối ứng không có trong câu.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: không chỉ một lần
  rationale: Chuyển tải thành ngữ nghĩa đen là 'cả một lần lẫn hai lần', tức là hơn một lần, bằng cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: ἐνέκοψεν
  choice: đã ngăn trở
  rationale: Giữ ý cản đường hoặc gây trở ngại, không tuyệt đối hóa thành việc ngăn chặn vĩnh viễn.
- source_word: ὁ Σατανᾶς
  choice: Sa-tan
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt và giữ nguyên tác nhân có tính ngôi vị được bản văn nêu rõ.
theological_decisions:
- issue: Vai trò của Sa-tan trong việc cản trở hành trình của Phao-lô
  choice: nhưng Sa-tan đã ngăn trở chúng tôi
  alternative: nhưng Kẻ Đối Nghịch đã ngăn chúng tôi lại
  rationale: Bản dịch giữ nguyên việc câu văn trực tiếp quy hành động cản trở cho Sa-tan, nhưng không suy diễn cách thức ông ta thực hiện hoặc biến sự cản trở ấy thành quyền quyết định tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμᾶς theo cách xưng hô cộng đồng tự nhiên trong tiếng Việt; dấu gạch ngang bảo toàn phần Phao-lô tự nhấn mạnh mình.
