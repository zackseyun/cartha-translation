reference: 1 Thessalonians 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: vi
  text: Vì lẽ đó, chúng tôi cũng không ngừng cảm tạ Đức Chúa Trời, vì khi tiếp nhận lời Đức Chúa Trời mà anh chị em nghe từ chúng tôi[a], anh chị em đã đón nhận lời ấy không phải như lời của loài người, nhưng đúng như lời ấy thật sự là—lời của Đức Chúa Trời[b]. Lời ấy[c] cũng đang hành động trong anh chị em, là những người tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ Hy Lạp rất cô đọng; cũng có thể dịch: “sứ điệp của Đức Chúa Trời mà anh chị em nghe từ chúng tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt: “không phải như một lời của con người, nhưng đúng như lời ấy thật sự là—lời Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: c
    text: 'Đại từ quan hệ Hy Lạp cũng có thể được hiểu là chỉ về Đức Chúa Trời: “Ngài cũng đang hành động trong anh chị em, là những người tin.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Giữ quan hệ nhân quả với phần trước, đồng thời diễn đạt tự nhiên và gọn trong tiếng Việt hiện đại.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: chúng tôi cũng không ngừng cảm tạ Đức Chúa Trời
  rationale: Diễn tả hành động cảm tạ liên tục mà không biến trạng từ thành một khẳng định tuyệt đối về từng khoảnh khắc.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: lời Đức Chúa Trời mà anh chị em nghe từ chúng tôi
  rationale: Tháo gỡ cụm sở hữu cô đọng của tiếng Hy Lạp theo cú pháp tiếng Việt, vẫn giữ trọng tâm là lời đến từ Đức Chúa Trời và được nghe qua những người rao truyền.
- source_word: ἐδέξασθε
  choice: anh chị em đã đón nhận lời ấy
  rationale: “Đón nhận” diễn đạt sự tiếp nhận với thái độ thuận phục, mạnh hơn việc chỉ nghe hoặc nhận được.
- source_word: οὐ λόγον ἀνθρώπων
  choice: không phải như lời của loài người
  rationale: Giữ sắc thái định tính và sự đối lập tu từ với “lời của Đức Chúa Trời”; “loài người” bao quát, trang trọng và không giới hạn giới tính.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: nhưng đúng như lời ấy thật sự là—lời của Đức Chúa Trời
  rationale: Giữ lời xác nhận xen giữa của Phao-lô và sự lặp lại đầy nhấn mạnh của “lời,” đồng thời dùng cấu trúc tự nhiên trong tiếng Việt.
- source_word: ἐνεργεῖται
  choice: đang hành động
  rationale: Diễn đạt hoạt động hữu hiệu và đang tiếp diễn, nhưng không quyết định quá mức sắc thái trung động hay bị động của dạng động từ Hy Lạp.
- source_word: τοῖς πιστεύουσιν
  choice: trong anh chị em, là những người tin
  rationale: Chuyển phân từ hiện tại thành một cụm giải thích tự nhiên, giữ đức tin như đặc điểm đang có của người nhận thư.
theological_decisions:
- issue: Từ đứng trước mệnh đề quan hệ ὃς chỉ về “lời” hay về Đức Chúa Trời
  choice: 'Hiểu là chỉ về “lời của Đức Chúa Trời”: “Lời ấy cũng đang hành động...”'
  alternative: 'Hiểu là chỉ về Đức Chúa Trời: “Ngài cũng đang hành động...”'
  rationale: Cả λόγος và θεός đều là danh từ giống đực số ít, nhưng “lời” là trung tâm của sự đối lập và là tiền ngữ tự nhiên hơn trong mạch câu. Cách hiểu kia vẫn khả hữu nên được giữ trong chú thích.
- issue: Ý nghĩa của λόγος θεοῦ trong lời rao giảng của các sứ đồ
  choice: Dịch trực tiếp là “lời của Đức Chúa Trời”
  alternative: “sứ điệp của Đức Chúa Trời”
  rationale: Bản văn trực tiếp đối lập lời của loài người với lời của Đức Chúa Trời. Bản dịch giữ nguyên sức nặng của cách diễn đạt này mà không mở rộng thành một tuyên bố giáo lý vượt quá câu văn.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; giữ “lời của Đức Chúa Trời” nhằm bảo toàn sự lặp lại và đối lập thần học của nguyên văn. Dấu hai chấm làm rõ nội dung của sự cảm tạ, còn dấu gạch ngang đánh dấu lời xác nhận nhấn mạnh mà không làm câu quá nặng.
