  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc phủ định liên kết với câu trước và phân biệt hai nguồn cụ thể: độc giả và những người khác. Tuy nhiên, trong ngữ cảnh ἐξ ἀνθρώπων, δόξαν nói về sự tôn trọng, danh dự hay sự tán thưởng từ con người; “vinh quang” trong tiếng Việt dễ gợi vinh quang theo nghĩa thần học hoặc uy nghi lớn hơn sắc thái ngữ cảnh.'
