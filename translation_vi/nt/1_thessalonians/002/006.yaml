translation:
  language: vi
  text: cũng không tìm kiếm sự tôn trọng từ người ta[a], dù từ anh chị em hay từ những người khác,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “vinh quang” hoặc “lời khen” thay cho “sự tôn trọng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: tìm kiếm
  rationale: Phân từ hiện tại bổ nghĩa cho chủ ngữ được ngầm hiểu từ mạch câu; “tìm kiếm” giữ được sắc thái hành động đang diễn ra mà không diễn giải quá mức động cơ.
- source_word: ἐξ ἀνθρώπων
  choice: từ người ta
  rationale: ἄνθρωποι chỉ con người nói chung, không riêng nam giới; “người ta” tự nhiên trong tiếng Việt và phù hợp với ý nói sự nhìn nhận đến từ con người.
- source_word: δόξαν
  choice: vinh quang
  rationale: Giữ liên hệ từ vựng với cách dùng phổ biến của δόξα trong Tân Ước, đồng thời chú thích các nghĩa phù hợp ngữ cảnh là “danh dự” hoặc “lời khen”.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: cũng không ... dù ... hay ...
  rationale: “Cũng không” nối mệnh đề này với phần phủ định trước đó; “dù... hay...” diễn đạt tự nhiên hai nguồn cụ thể đều bị loại trừ.
- source_word: ἀφ’ ὑμῶν
  choice: từ anh chị em
  rationale: Đại từ số nhiều chỉ trực tiếp các tín hữu Tê-sa-lô-ni-ca; “anh chị em” vừa tự nhiên trong văn phong thư tín Cơ Đốc vừa không hàm ý chỉ nam giới.
- source_word: ἀπ’ ἄλλων
  choice: từ những người khác
  rationale: Chỉ những người ngoài nhóm độc giả Tê-sa-lô-ni-ca; cách dịch rõ ràng và tự nhiên.
theological_decisions:
- issue: Bản chất của δόξα được tìm kiếm
  choice: vinh quang/sự tôn trọng đến từ con người
  alternative: danh dự hoặc lời khen của con người
  rationale: Cụm ἐξ ἀνθρώπων xác định nguồn là con người, không phải Đức Chúa Trời. Bản dịch giữ “vinh quang” nhưng chú thích các nghĩa ngữ cảnh để không khiến độc giả hiểu sai.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ dấu phẩy cuối câu vì câu Hy Lạp tiếp tục sang phần kế tiếp. Đại từ “anh chị em” thể hiện số nhiều và tính bao quát của ὑμῶν trong ngữ cảnh cộng đồng tín hữu.
