    rationale: 'Dù có thể dịch sát từ vựng, “vinh quang từ người ta” không phải cách diễn đạt tự nhiên nhất trong tiếng Việt hiện đại và có thể che khuất nghĩa ngữ cảnh: Phao-lô phủ nhận việc tìm sự tôn trọng hoặc lời tán thưởng của con người. Cần dùng thuật ngữ ngữ cảnh hơn, đồng thời nêu “vinh quang” ở chú thích như một khả năng từ vựng.'
