  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: vi
  text: là những người cũng đã giết Chúa Giê-su và các nhà tiên tri[a], đã đuổi chúng tôi đi[b], không làm đẹp lòng Đức Chúa Trời, và chống lại mọi người[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã xử tử Chúa Giê-su và các nhà tiên tri.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ này có nghĩa cụ thể là “đuổi đi” hoặc “trục xuất”, chứ không chỉ nói chung về sự bắt bớ.
    reason: lexical_alternative
  - marker: c
    text: Về mặt ngữ pháp, lời mô tả này tiếp tục nói về nhóm người được xác định trong câu trước; không nên hiểu đó là lời nói bao quát về mọi người Do Thái trong mọi thời đại và mọi nơi.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: đã giết
  rationale: Động tính từ aorist chủ động có nghĩa là giết hoặc làm cho chết. “Đã giết” tự nhiên, trực tiếp và không thêm hàm ý về động cơ như “đã sát hại”.
- source_word: κύριον Ἰησοῦν
  choice: Chúa là Đức Giê-su
  rationale: Giữ κύριος như tước hiệu Cơ Đốc học “Chúa”; từ “là” giúp tiếng Việt hiện đại nhận rõ “Đức Giê-su” là đồng vị ngữ của “Chúa”.
- source_word: τοὺς προφήτας
  choice: các nhà tiên tri
  rationale: Cách gọi thông dụng, trang trọng trong tiếng Việt; chỉ dòng các nhà tiên tri đã được biết đến.
- source_word: ἐκδιωξάντων
  choice: đã đuổi chúng tôi đi
  rationale: Giữ nghĩa cụ thể là xua đuổi hoặc trục xuất, thay vì khái quát hóa thành “bắt bớ”.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: không làm đẹp lòng Đức Chúa Trời
  rationale: Diễn đạt tự nhiên động tính từ hiện tại với θεῷ ở cách dữ cách, đồng thời giữ tính mô tả đang tiếp diễn.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: chống lại mọi người
  rationale: Chuyển tải ý đối nghịch của ἐναντίος mà không làm mạnh thêm thành thái độ thù ghét nội tâm.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: là những người cũng đã giết ... đã đuổi ... không làm đẹp lòng ... và chống lại ...
  rationale: Mệnh đề quan hệ tiếp nối nhóm được nói đến ở câu trước và tái hiện chuỗi động tính từ bằng cấu trúc tiếng Việt rõ ràng.
theological_decisions:
- issue: Đối tượng của chuỗi mô tả bằng động tính từ
  choice: Hiểu đây là phần tiếp tục mô tả nhóm người được xác định trong câu 14.
  alternative: Hiểu như lời kết án khái quát mọi người Do Thái trong mọi thời đại.
  rationale: Mạo từ sở hữu cách số nhiều τῶν cùng chuỗi động tính từ liên kết về mặt ngữ pháp với tiền ngữ ở câu trước. Bản dịch dùng “là những người” để duy trì liên kết ấy, còn chú thích ngăn việc phổ quát hóa ngoài phạm vi văn mạch.
- issue: Sắc thái của ἐναντίων
  choice: chống lại mọi người
  alternative: thù nghịch với mọi người
  rationale: “Chống lại” giữ được ý đối nghịch trong ngữ cảnh mà không quyết định quá mức rằng từ này nhất thiết mô tả cảm xúc thù ghét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt; giữ nhịp cáo buộc tích lũy của nguyên văn nhưng tránh từ ngữ nặng hơn chứng cứ Hy Lạp.
