  rationale: Chỉnh “Chúa là Đức Giê-su” thành “Chúa Giê-su” để phản ánh đúng và tự nhiên cụm κύριον Ἰησοῦν. Chỉnh chú thích a để phương án thay thế không biến hành động trực tiếp “giết” thành hành động gián tiếp “làm cho phải chết”. Các phần khác bảo toàn chuỗi động tính từ, sắc thái tiếp diễn của “không làm đẹp lòng”, và giới hạn văn mạch nêu trong chú thích c.
