  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς γάρ ἐστε ἡ δόξα ἡμῶν καὶ ἡ χαρά.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: vi
  text: Vì chính anh chị em là vinh quang và niềm vui của chúng tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “niềm hãnh diện” hoặc “danh dự” thay cho “vinh quang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: chính anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được nêu rõ để nhấn mạnh. “Chính anh chị em” diễn đạt tự nhiên sắc thái nhấn mạnh ấy và phù hợp với cộng đồng tín hữu gồm cả nam lẫn nữ.
- source_word: γάρ
  choice: Vì
  rationale: Liên từ nêu lý do hoặc lời giải thích cho câu trước; “Vì” giữ rõ mối liên kết lập luận.
- source_word: ἐστε
  choice: là
  rationale: Động từ hiện tại của “là”, được chuyển trực tiếp và tự nhiên bằng hệ từ tiếng Việt.
- source_word: ἡ δόξα ἡμῶν
  choice: vinh quang của chúng tôi
  rationale: “Vinh quang” bảo toàn phạm vi nghĩa và sức nặng tu từ của δόξα, còn đại từ sở hữu số nhiều ἡμῶν được diễn đạt rõ bằng “của chúng tôi”.
- source_word: ἡ χαρά
  choice: niềm vui
  rationale: Danh từ χαρά chỉ niềm vui hay sự vui mừng; “niềm vui” tự nhiên và giữ nguyên tính chất danh từ.
theological_decisions:
- issue: Cách dịch δόξα trong lời khẳng định mang tính quan hệ của Phao-lô
  choice: vinh quang
  alternative: niềm hãnh diện; danh dự
  rationale: Câu này nói các tín hữu Tê-sa-lô-ni-ca là nguồn vinh dự và vui mừng của những người truyền giáo. “Vinh quang” giữ được độ rộng nghĩa và sức mạnh của từ Hy Lạp mà không thu hẹp thành lòng tự hào cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ toàn thể cộng đồng tín hữu; thêm “chính” nhằm phản ánh sự nhấn mạnh của đại từ ὑμεῖς.
