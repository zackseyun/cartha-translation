reference: 1 Thessalonians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: vi
  text: khích lệ, an ủi và tha thiết thúc giục anh chị em, để anh chị em sống[a] sao cho xứng đáng với Đức Chúa Trời, Đấng kêu gọi anh chị em vào vương quốc và vinh quang của chính Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “bước đi”, một hình ảnh Kinh Thánh chỉ cách sống và cư xử của một người; cũng có thể dịch là “sống” hoặc “cư xử”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: khuyên bảo
  rationale: Động từ hiện tại phân từ diễn tả hoạt động mục vụ liên tục. “Khuyên bảo” tự nhiên trong tiếng Việt, bao hàm sự khích lệ lẫn khuyên nhủ và phù hợp với giọng điệu như người cha trong ngữ cảnh.
- source_word: παραμυθούμενοι
  choice: an ủi
  rationale: Từ này chỉ lời nói đem lại sự nâng đỡ, an ủi; cách dịch này ngắn gọn và giữ được sắc thái riêng bên cạnh παρακαλοῦντες.
- source_word: μαρτυρόμενοι
  choice: tha thiết thúc giục
  rationale: Trong ngữ cảnh, động từ mang ý khẩn khoản xác nhận, nhấn mạnh hoặc thúc giục một cách nghiêm túc. “Tha thiết thúc giục” truyền đạt sức nặng của lời kêu gọi mà không khiến người đọc hiểu đây chỉ là việc làm chứng về một sự kiện.
- source_word: εἰς τὸ περιπατεῖν
  choice: sống
  rationale: Cấu trúc εἰς + mạo từ + động từ nguyên mẫu diễn tả mục đích hoặc kết quả. “Sống” chuyển đạt tự nhiên ẩn dụ “bước đi”, tức cách ăn ở và hành xử; ẩn dụ nguyên văn được ghi ở chú thích.
- source_word: ἀξίως τοῦ θεοῦ
  choice: sao cho xứng đáng với Đức Chúa Trời
  rationale: ἀξίως đi với sở hữu cách mang nghĩa sống theo cách tương xứng với Đức Chúa Trời. Cụm “sao cho xứng đáng với” tự nhiên hơn tiếng Việt mà không thêm ý Đức Chúa Trời ban công trạng hay con người tự đạt được tư cách cứu rỗi.
- source_word: τοῦ καλοῦντος
  choice: Đấng kêu gọi
  rationale: Phân từ hiện tại được giữ bằng cách diễn đạt không giới hạn vào một biến cố quá khứ, tránh áp đặt quan điểm thần học về thời điểm hoặc cơ chế của sự kêu gọi.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: vào vương quốc và vinh quang của chính Ngài
  rationale: “Vào” thể hiện εἰς; “của chính Ngài” giữ sắc thái nhấn mạnh của đại từ phản thân ἑαυτοῦ. Hai danh từ vẫn được đặt song song dưới cùng một giới từ như trong tiếng Hy Lạp.
theological_decisions:
- issue: Giữ nguyên ẩn dụ περιπατεῖν hay diễn đạt ý nghĩa về cách sống
  choice: Dùng “sống” trong chính văn và ghi nghĩa đen trong chú thích
  alternative: “bước đi” hoặc “ăn ở”
  rationale: “Bước đi” bảo toàn hình ảnh Kinh Thánh nhưng trong tiếng Việt hiện đại có thể bị hiểu theo nghĩa di chuyển nếu đứng trong câu này; “sống” truyền đạt rõ ý về toàn bộ cách sống mà không giải nghĩa xa hơn văn bản.
- issue: Thời tính và thần học của τοῦ καλοῦντος ὑμᾶς
  choice: “Đấng kêu gọi anh chị em”
  alternative: “Đấng đang kêu gọi anh chị em” hoặc “Đấng đã kêu gọi anh chị em”
  rationale: Cách dịch hiện tại không đánh dấu này tự nhiên trong tiếng Việt và giữ được phân từ hiện tại Hy Lạp, đồng thời không buộc sự kêu gọi chỉ thuộc quá khứ hay chỉ là một tiến trình đang tiếp diễn.
- issue: Ý nghĩa của “xứng đáng với Đức Chúa Trời”
  choice: Giữ quan hệ “xứng đáng với” mà không diễn giải thần học
  alternative: “xứng với ơn gọi của Đức Chúa Trời” hoặc “đẹp lòng Đức Chúa Trời”
  rationale: Văn bản gắn ἀξίως trực tiếp với τοῦ θεοῦ, không nói “ơn gọi” hay “đẹp lòng”. Giữ cấu trúc này bảo toàn sức căng của lời khuyên đạo đức và không biến nó thành tuyên bố về công trạng cứu rỗi.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm diễn đạt cộng đồng tín hữu một cách tự nhiên và bao quát. “Đức Chúa Trời” và đại từ tôn kính “Ngài” phù hợp văn phong Kinh Thánh Tin Lành tiếng Việt mà không đưa thêm nét giáo phái vào nội dung.
