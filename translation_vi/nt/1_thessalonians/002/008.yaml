  to: Vì thế, với lòng tha thiết thương nhớ anh chị em,[a] chúng tôi đã sẵn lòng chia sẻ với anh chị em không chỉ Phúc Âm của Đức Chúa Trời mà cả mạng sống của chính mình,[b] vì anh chị em đã trở nên thân yêu đối với chúng tôi.
