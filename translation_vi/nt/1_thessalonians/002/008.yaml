id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: vi
  text: Vì thế, với lòng tha thiết thương nhớ anh chị em,[a] chúng tôi đã sẵn lòng chia sẻ với anh chị em không chỉ Phúc Âm của Đức Chúa Trời mà cả mạng sống của chính mình,[b] vì anh chị em đã trở nên thân yêu đối với chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì thế, tha thiết mong nhớ anh chị em” hoặc “vì thế, hết lòng thương nhớ anh chị em.” Phân từ Hy Lạp hiếm gặp ở đây diễn tả lòng trìu mến và nỗi khát khao sâu xa.'
    reason: lexical_alternative
  - marker: b
    text: Hay “chính bản thân mình” hoặc, sát chữ hơn, “linh hồn mình”; ở đây từ Hy Lạp nói đến việc họ hiến dâng chính mình, kể cả mạng sống mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ὁμειρόμενοι ὑμῶν
  choice: Tha thiết yêu mến anh chị em như vậy
  rationale: Giữ sắc thái mạnh mẽ về tình cảm và nỗi khát khao của động từ hiếm ὁμείρομαι, đồng thời bảo toàn οὕτως (“như vậy”), vốn liên hệ với hình ảnh chăm sóc ở câu trước. Cấu trúc phân từ được để mở thay vì buộc thành quan hệ nguyên nhân.
- source_word: εὐδοκοῦμεν
  choice: chúng tôi vui lòng
  rationale: Diễn đạt sự tự nguyện đi kèm niềm vui, mạnh hơn sự đồng ý đơn thuần và tự nhiên trong tiếng Việt hiện đại.
- source_word: μεταδοῦναι
  choice: chia sẻ với
  rationale: Động từ chỉ việc cho người khác cùng nhận điều thuộc về mình; cách dịch này dùng tự nhiên cho cả Phúc Âm lẫn sự hiến dâng mạng sống.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Phúc Âm của Đức Chúa Trời
  rationale: Dùng thuật ngữ Cơ Đốc quen thuộc “Phúc Âm” và giữ trực tiếp quan hệ sở hữu/xuất xứ của cụm τοῦ θεοῦ.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: cả chính mạng sống mình
  rationale: Trong ngữ cảnh này ψυχή nói đến mạng sống hoặc chính con người được hiến dâng, không nhằm xác lập sự phân chia thân thể và linh hồn. “Chính” bảo toàn sắc thái nhấn mạnh của ἑαυτῶν.
- source_word: διότι
  choice: bởi
  rationale: Nêu lý do cho sự chia sẻ và hiến dâng; “bởi” trang trọng vừa phải và rõ nghĩa trong câu.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: anh chị em đã trở nên thân yêu đối với chúng tôi
  rationale: Giữ ý về một tình trạng tình cảm đã hình thành, đồng thời diễn đạt sự trìu mến mang tính quan hệ mà không thêm hàm ý thần học chuyên biệt.
theological_decisions:
- issue: Ý nghĩa của ψυχάς trong lời mô tả sự tự hiến của các sứ đồ
  choice: mạng sống
  alternative: linh hồn; chính bản thân
  rationale: Mạch văn nói về sự chăm sóc và tự hiến cụ thể, không bàn về cấu tạo con người. “Mạng sống” truyền đạt rõ giá phải trả và tránh gợi ra một khẳng định nhị nguyên không có trong câu.
- issue: Quan hệ cú pháp của phân từ ὁμειρόμενοι với động từ chính
  choice: Giữ bằng cụm phân từ trạng thái “Tha thiết yêu mến… như vậy”
  alternative: Vì chúng tôi tha thiết yêu mến…; Khi tha thiết yêu mến…
  rationale: Nguyên văn không đánh dấu rõ một quan hệ nhân quả hay thời gian riêng biệt. Cách dịch không thêm liên từ bảo tồn độ mở của cấu trúc Hy Lạp.
- issue: Sắc thái của ἀγαπητοί
  choice: thân yêu đối với chúng tôi
  alternative: được chúng tôi yêu mến; người yêu dấu của chúng tôi
  rationale: Cách dịch nhấn mạnh tình cảm cá nhân của Phao-lô và các bạn đồng hành mà không biến từ này thành một danh xưng thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng gần gũi. Dùng “anh chị em” để diễn đạt số nhiều ὑμεῖς theo lối xưng hô cộng đồng tự nhiên; dùng “chúng tôi” nhất quán cho nhóm người nói. Cấu trúc mở đầu giữ sức nặng tình cảm và không áp đặt quan hệ nhân quả vốn không được đánh dấu minh nhiên trong tiếng Hy Lạp.
