reference: 1 Thessalonians 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: vi
  text: 'Anh chị em là những người làm chứng, và Đức Chúa Trời cũng vậy, về cách chúng tôi đã cư xử đối với anh chị em là những người tin[b]: thánh khiết[a], công chính và không chỗ trách được.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kính thành.” Từ Hy Lạp nhấn mạnh cách sống kính thành trước mặt Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “giữa anh chị em là những người tin” thay cho “đối với anh chị em là những người tin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Chính anh chị em là những người làm chứng, và Đức Chúa Trời cũng vậy
  rationale: 'Giữ thứ tự nhấn mạnh của nguyên văn: trước hết trực tiếp gọi người Tê-sa-lô-ni-ca làm chứng, rồi viện đến Đức Chúa Trời; thêm động từ và từ ngữ cần thiết để câu tiếng Việt tự nhiên.'
- source_word: ὡς
  choice: rằng ... một cách
  rationale: Trong lời viện dẫn nhân chứng này, ὡς giới thiệu cách thức họ đã sống. Cấu trúc tiếng Việt với “rằng” và “một cách” truyền đạt tự nhiên cả nội dung được chứng thực lẫn sắc thái chỉ cách thức.
- source_word: ὁσίως
  choice: tận tâm với Chúa
  rationale: Diễn đạt phương diện kính thành, hướng về Đức Chúa Trời của từ này bằng tiếng Việt hiện đại; tránh “thánh thiện” vì có thể bị hiểu rộng hơn như một phẩm chất tuyệt đối.
- source_word: δικαίως
  choice: công chính
  rationale: Chỉ cách cư xử đúng đắn về đạo đức; “công chính” trang trọng, quen thuộc trong văn phong Kinh Thánh và không thu hẹp ý nghĩa vào sự công bằng pháp lý.
- source_word: ἀμέμπτως
  choice: không chỗ trách được
  rationale: Diễn tả cách sống không tạo cơ sở chính đáng cho lời cáo buộc, nhưng không tự động hàm ý hoàn toàn vô tội hay tuyệt đối không phạm tội.
- source_word: ὑμῖν
  choice: giữa anh chị em
  rationale: Dữ cách có thể chỉ mối quan hệ “đối với” hoặc bối cảnh “giữa.” Ở đây, “giữa anh chị em” tự nhiên và phù hợp với việc các sứ giả đã sống trong cộng đồng; khả năng “đối với” được ghi ở chú thích.
- source_word: τοῖς πιστεύουσιν
  choice: anh chị em là những người tin
  rationale: Giữ lực động từ của phân từ hiện tại và xác định chính cộng đồng được nói trực tiếp là những người tin.
- source_word: ἐγενήθημεν
  choice: chúng tôi đã sống
  rationale: Với ba trạng từ chỉ cách thức, γίνομαι mô tả họ đã thể hiện mình hay cư xử ra sao. “Đã sống” ngắn gọn, tự nhiên và bao quát nếp cư xử thực tế.
theological_decisions:
- issue: Ba mô tả đạo đức về cách sống của các sứ giả
  choice: Trình bày đây là cách sống thực tế của họ trước mặt Đức Chúa Trời và giữa các tín hữu, với “không chỗ trách được” mang nghĩa không có cơ sở chính đáng để khiển trách.
  alternative: Hiểu lời này chỉ là thủ pháp biện hộ, hoặc hiểu nó là lời tuyên bố về sự hoàn hảo tuyệt đối không hề phạm tội.
  rationale: Câu văn long trọng viện dẫn cả nhân chứng con người lẫn Đức Chúa Trời về sự liêm chính thực tế, nhưng bản thân các trạng từ không buộc phải mang nghĩa hoàn hảo siêu hình hay vô tội tuyệt đối.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để trực tiếp gọi cộng đồng tín hữu; giữ nhịp ba vế đạo đức và đặt đầy đủ các dấu chú thích [a], [b] trong chính văn.
