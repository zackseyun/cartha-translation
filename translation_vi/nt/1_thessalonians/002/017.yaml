reference: 1 Thessalonians 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: vi
  text: Còn chúng tôi, thưa anh em[a], phải xa cách anh em[b] trong một thời gian ngắn—chỉ cách mặt chứ không cách lòng—thì lại càng tha thiết mong được thấy mặt anh em, với niềm khao khát mãnh liệt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” là cách Phao-lô xưng hô; trong ngữ cảnh, từ này nhiều khả năng chỉ toàn thể cộng đồng tín hữu, gồm cả phụ nữ.
    reason: cultural_note
  - marker: b
    text: Theo nghĩa sát, động từ được dịch là “phải xa cách” gợi hình ảnh trở nên côi cút hoặc mất người thân, nhấn mạnh nỗi đau của sự chia lìa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Còn chúng tôi
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ, còn đại từ Ἡμεῖς được nhấn mạnh; “Còn chúng tôi” diễn đạt tự nhiên cả hai nét này.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức xưng hô số nhiều giống đực của nguyên văn; trong cách dùng của Phao-lô, lời gọi này có thể hướng đến toàn thể cộng đồng tín hữu, điều được làm rõ trong chú thích.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: phải xa cách anh em
  rationale: Động từ gợi hình ảnh bị mất người thân hay trở nên côi cút. “Phải xa cách” truyền đạt sự chia lìa ngoài ý muốn bằng tiếng Việt tự nhiên, trong khi chú thích bảo tồn hình ảnh mạnh của nguyên ngữ.
- source_word: πρὸς καιρὸν ὥρας
  choice: trong một thời gian ngắn
  rationale: Cụm thành ngữ chỉ một khoảng thời gian ngắn, không nhất thiết là một giờ theo nghĩa đen.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: chỉ cách mặt chứ không cách lòng
  rationale: Cách diễn đạt đối xứng, tự nhiên trong tiếng Việt, giữ nguyên sự tương phản giữa xa cách về thân thể và không xa cách trong tình cảm.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: lại càng hết sức mong mỏi
  rationale: περισσοτέρως tăng cường mức độ, còn σπουδάζω có thể nhấn vào sự sốt sắng hoặc nỗ lực. Cụm này truyền đạt cường độ mạnh mà không loại bỏ sắc thái khao khát trong văn cảnh.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: được thấy mặt anh em
  rationale: Giữ hình ảnh “thấy mặt” của nguyên văn và nối kết với vế “cách mặt” ngay trước đó.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: hết sức mong mỏi
  rationale: ἐπιθυμία ở đây chỉ niềm khao khát mãnh liệt, không mang nghĩa tiêu cực; sắc thái này được kết hợp tự nhiên với động từ trong tiếng Việt.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφοί
  choice: anh em trong chính văn, kèm chú thích về phạm vi cộng đồng
  alternative: anh chị em; các anh chị em
  rationale: Nguyên văn dùng danh từ số nhiều giống đực, nên chính văn giữ “anh em”; tuy nhiên, trong ngữ cảnh thư tín của Phao-lô, từ này nhiều khả năng bao gồm cả nam lẫn nữ trong hội chúng, vì vậy chú thích làm rõ phạm vi mà không thay đổi hình thức của nguồn.
- issue: Hình ảnh tang chế trong ἀπορφανισθέντες
  choice: diễn đạt tự nhiên là “phải xa cách” và ghi nhận hình ảnh nguyên ngữ trong chú thích
  alternative: bị mồ côi khỏi anh em; bị lìa khỏi anh em
  rationale: Cách dịch sát từng chữ “bị mồ côi khỏi” không tự nhiên và có thể gây hiểu sai quan hệ giữa Phao-lô với hội chúng. Chú thích bảo tồn sức gợi của hình ảnh mất mát mà không áp đặt một quan hệ gia đình cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp thành ngữ “cách mặt… cách lòng” giữ sự đối xứng của nguyên văn, còn “thấy mặt” bảo tồn hình ảnh cụ thể. Chỉ dùng một chú thích [a] để giải thích cả cách xưng hô và hình ảnh chia lìa; dấu chú thích xuất hiện đầy đủ trong chính văn.
