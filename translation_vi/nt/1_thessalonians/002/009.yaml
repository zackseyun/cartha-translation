id: 1TH.2.9
reference: 1 Thessalonians 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: vi
  text: 'Vì, thưa anh em[a], anh em nhớ sự lao nhọc và vất vả của chúng tôi: trong khi làm việc đêm ngày để không trở thành gánh nặng cho bất cứ ai trong anh em, chúng tôi đã rao truyền cho anh em Tin Mừng của Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thưa anh chị em”; từ Hy Lạp có nghĩa đen là “anh em” nhưng có thể dùng để gọi toàn thể hội chúng, gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: anh em nhớ
  rationale: Động từ hiện tại, ngôi thứ hai số nhiều, được hiểu là lời xác nhận “anh em nhớ”, không phải mệnh lệnh “hãy nhớ”; cách này phù hợp với việc Phao-lô viện đến ký ức của người Tê-sa-lô-ni-ca.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức xưng hô giống đực số nhiều của nguyên văn; trong ngữ cảnh, cách gọi này có thể bao gồm cả hội chúng, vì vậy có chú thích.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: công lao và nỗi nhọc nhằn của chúng tôi
  rationale: “Công lao” diễn tả nỗ lực vất vả, còn “nỗi nhọc nhằn” nhấn mạnh sự gian truân đi kèm; hai cách diễn đạt phân biệt nhưng vẫn giữ sức nặng của cặp từ Hy Lạp.
- source_word: νυκτὸς καὶ ἡμέρας ἐργαζόμενοι
  choice: chúng tôi đã làm việc đêm ngày
  rationale: “Đêm ngày” là thành ngữ tiếng Việt tự nhiên chỉ sự làm việc bền bỉ; chuyển phân từ thành mệnh đề giúp câu rõ ràng mà vẫn giữ quan hệ hoàn cảnh với việc rao truyền.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: để không trở thành gánh nặng cho bất cứ ai trong anh em
  rationale: Cấu trúc chỉ mục đích; cách dịch này chuyển tải ý không áp đặt gánh nặng vật chất hoặc thực tế lên bất kỳ người nào trong cộng đoàn.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: rao truyền cho anh em
  rationale: “Rao truyền” giữ sắc thái công bố công khai của κηρύσσω; “cho anh em” phản ánh hướng của εἰς mà không đổi thành nghĩa “ở giữa”.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: Tin Mừng của Đức Chúa Trời
  rationale: “Tin Mừng” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt; giữ kết cấu “của Đức Chúa Trời” để không quyết định quá mức quan hệ sở hữu, nguồn gốc hay nội dung của sở hữu cách.
theological_decisions:
- issue: Phạm vi bao gồm của ἀδελφοί
  choice: Giữ “anh em” trong chính văn
  alternative: “anh chị em”
  rationale: Danh từ Hy Lạp có hình thức giống đực số nhiều, nhưng trong ngữ cảnh có thể được dùng để gọi toàn thể hội chúng. Chính văn giữ hình thức nguồn, còn chú thích nêu rõ khả năng bao gồm cả nam lẫn nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp “anh em” để giữ cả lời xưng hô lẫn các đại từ số nhiều trong nguyên văn. Dùng “trong khi” để làm rõ rằng việc làm lụng đêm ngày diễn ra trong hoàn cảnh họ rao truyền Tin Mừng, mà không biến nó thành một hành động tách rời.
