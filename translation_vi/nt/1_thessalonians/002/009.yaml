- from: 'Vì thưa anh em[a], anh em nhớ công lao và nỗi nhọc nhằn của chúng tôi: chúng tôi đã làm việc đêm ngày để không trở thành gánh nặng cho bất cứ ai trong anh em, trong khi rao truyền cho anh em Tin Mừng của Đức Chúa Trời.'
  to: 'Vì, thưa anh em[a], anh em nhớ sự lao nhọc và vất vả của chúng tôi: trong khi làm việc đêm ngày để không trở thành gánh nặng cho bất cứ ai trong anh em, chúng tôi đã rao truyền cho anh em Tin Mừng của Đức Chúa Trời.'
  rationale: Thay “công lao” bằng “sự lao nhọc” để phản ánh κόπος là lao lực vất vả, rồi giữ “vất vả” cho μόχθος. Chuyển “trong khi làm việc đêm ngày” lên trước động từ chính để biểu đạt tự nhiên phân từ ἐργαζόμενοι như hoàn cảnh của việc rao truyền, không thay đổi nghĩa hay thêm diễn giải thần học.
