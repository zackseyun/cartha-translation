  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: καθάπερ ("Như"), οἴδατε với nghĩa hiện tại ("anh chị em biết"), lực phân phối nhấn mạnh của ἕνα ἕκαστον ὑμῶν ("từng người trong anh chị em"), và hình ảnh so sánh cha–con với ἑαυτοῦ được nhấn bằng "chính". Việc bổ sung "chúng tôi đã đối đãi" xử lý hợp lý mệnh đề tỉnh lược, theo đúng ý rộng của bản tiếng Anh audit trail, không thu hẹp vào một hành động mục vụ riêng biệt.'
