  terminology: '"Người cha", "con cái", và "chính con cái mình" truyền đạt đúng hình ảnh gia đình và sắc thái phản thân/emphatic của nguyên văn. Không có thuật ngữ thần học hoặc tên riêng cần điều chỉnh. Chú thích giải thích chính xác tính tỉnh lược của mệnh đề và được neo đúng tại "biết[a]".'
