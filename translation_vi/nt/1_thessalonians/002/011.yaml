  text: καθάπερ οἴδατε ὡς ἕνα ἕκαστον ὑμῶν ὡς πατὴρ τέκνα ἑαυτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/011.yaml
  text: just as you know[a], we dealt with each one of you as a father with his own children
translation:
  language: vi
  text: Như anh chị em biết[a], chúng tôi đã đối đãi với từng người trong anh chị em như một người cha đối với chính con cái mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nguyên văn hơn: “Như anh chị em biết, từng người trong anh chị em, như một người cha đối với chính con cái mình…” Mệnh đề Hy Lạp được tỉnh lược và phải dựa vào câu xung quanh để có đầy đủ ý nghĩa về hành động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: Như
  rationale: Mở đầu phép so sánh và viện đến điều người Tê-sa-lô-ni-ca đã biết; “Như” tự nhiên trong tiếng Việt và giữ được lực so sánh.
- source_word: οἴδατε
  choice: anh chị em biết
  rationale: Dù về hình thức là thì hoàn thành, οἶδα thường mang nghĩa hiện tại là “biết”. “Anh chị em” diễn đạt số nhiều và bao gồm cộng đồng người nhận.
- source_word: ὡς (thứ nhất)
  choice: được thể hiện qua toàn cấu trúc “biết… đã đối đãi”
  rationale: ὡς thứ nhất dẫn vào nội dung họ biết. Tiếng Việt tự nhiên không cần thêm một từ riêng tương ứng nếu đã dùng cấu trúc này.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: từng người trong anh chị em
  rationale: Giữ sắc thái phân phối được nhấn mạnh, cho thấy sự quan tâm đến từng cá nhân.
- source_word: ὡς (thứ hai)
  choice: như
  rationale: Đánh dấu phép so sánh với cách một người cha đối xử với con mình.
- source_word: πατὴρ
  choice: một người cha
  rationale: Danh từ không có mạo từ được dùng theo nghĩa so sánh/phẩm chất; “một người cha” là cách diễn đạt tự nhiên.
- source_word: τέκνα
  choice: con cái
  rationale: Là từ chỉ con nói chung, không giới hạn giới tính; “con cái” giữ trọn hình ảnh gia đình.
- source_word: ἑαυτοῦ
  choice: chính… mình
  rationale: 'Giữ lực nhấn mạnh của đại từ phản thân: đó là chính con cái của người cha ấy.'
- source_word: '[ý động từ tỉnh lược, được suy ra từ văn cảnh]'
  choice: chúng tôi đã đối đãi
  rationale: Mệnh đề Hy Lạp tỉnh lược và dựa vào câu xung quanh. “Đã đối đãi” đủ rộng để nối phép so sánh mà không thu hẹp thành riêng một hành động khuyên bảo, khích lệ hay thúc giục.
theological_decisions:
- issue: Bổ sung hành động được ngầm hiểu trong mệnh đề tỉnh lược
  choice: 'Dùng động từ rộng: “chúng tôi đã đối đãi với từng người…”'
  alternative: Giữ câu gần như dang dở, hoặc bổ sung một động từ hẹp hơn như “khuyên bảo”.
  rationale: Nguyên văn Hy Lạp của câu này không tự tạo thành một câu trọn nghĩa mà phụ thuộc vào văn cảnh chung quanh. Cách dịch rộng làm câu tiếng Việt sáng rõ nhưng không đồng nhất toàn bộ sự chăm sóc mục vụ với chỉ một trong các hành động được nêu trong mạch văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng tín hữu; giữ hình ảnh người cha và con cái, đồng thời đánh dấu rõ phần động từ được bổ sung do cấu trúc tỉnh lược.
