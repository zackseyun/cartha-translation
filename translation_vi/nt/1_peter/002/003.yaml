reference: 1 Peter 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀εἰ ἐγεύσασθε ὅτι χρηστὸς ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/003.yaml
  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: vi
  text: nếu quả thật anh chị em đã nếm biết Chúa là tốt lành[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì anh chị em đã nếm biết.” Tiếng Hy Lạp dùng hình thức điều kiện nhưng có thể ngầm cho rằng điều kiện ấy là đúng.'
    reason: alternative_reading
  - marker: b
    text: “Tốt lành” cũng có thể dịch là “nhân từ” hoặc “ân hậu.” Cách diễn đạt này vọng lại Thi Thiên 34:8.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: nếu quả thật
  rationale: Giữ nguyên hình thức điều kiện của tiếng Hy Lạp, đồng thời “quả thật” cho thấy điều kiện này có thể ngầm được xem là đúng trong lối lập luận tu từ.
- source_word: ἐγεύσασθε
  choice: đã nếm biết
  rationale: Giữ hình ảnh cụ thể “nếm” trong mạch văn về sự nuôi dưỡng ở 2:2–3 và trong âm hưởng Thi Thiên 34:8; “biết” giúp cách nói ẩn dụ tự nhiên, dễ hiểu trong tiếng Việt.
- source_word: ὅτι
  choice: là
  rationale: 'Diễn đạt tự nhiên nội dung được nếm biết trong tiếng Việt: “nếm biết Chúa là tốt lành,” tương ứng với mệnh đề nội dung do ὅτι dẫn vào.'
- source_word: χρηστὸς
  choice: tốt lành
  rationale: Truyền đạt nghĩa rộng về sự tốt lành và nhân hậu, đồng thời giữ âm hưởng Thi Thiên 34:8; các cách “nhân từ” hoặc “ân hậu” có thể thu hẹp sắc thái.
- source_word: κύριος
  choice: Chúa
  rationale: Cách dịch thông dụng và trang trọng của κύριος trong tiếng Việt, vừa phù hợp với ngữ cảnh hướng về Đấng Christ vừa giữ được âm hưởng về Chúa trong Thi Thiên.
theological_decisions:
- issue: Sắc thái của mệnh đề điều kiện εἰ
  choice: 'Giữ điều kiện thực sự: “nếu quả thật anh chị em đã nếm biết”'
  alternative: “vì anh chị em đã nếm biết” hoặc “bởi anh chị em đã nếm biết”
  rationale: Mệnh đề có lẽ giả định kinh nghiệm ấy là có thật nơi độc giả, nhưng nguyên văn vẫn dùng εἰ. Bản dịch giữ cấu trúc điều kiện và dùng “quả thật” để biểu đạt sắc thái tu từ mà không biến nó thành lời khẳng định hoàn toàn.
- issue: Đối tượng được gọi là “Chúa”
  choice: Chỉ dịch là “Chúa,” không thêm “Đấng Christ”
  alternative: “Chúa là Đấng Christ” hoặc “Chúa (Đấng Christ)”
  rationale: Trong ngữ cảnh 1 Phi-e-rơ 2, danh xưng này gắn chặt với Chúa Giê-su, nhưng câu chữ cũng vọng lại Thi Thiên 34:8. Không thêm lời giải thích vào chính văn giúp giữ cả hai chiều kích ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” thể hiện số nhiều của động từ mà không mặc định giới tính. Cụm “nếm biết” giữ hình ảnh nguyên văn nhưng vẫn tự nhiên trong tiếng Việt Kinh Thánh; “tốt lành” trang trọng hơn “tốt” và phù hợp với âm hưởng Thi Thiên.
