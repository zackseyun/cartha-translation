- from: thì chính anh em cũng, như những viên đá sống[a], đang được xây dựng nên một ngôi nhà thuộc linh, để trở thành một đoàn tư tế thánh[b], hầu dâng những sinh tế thuộc linh được Đức Chúa Trời vui nhận nhờ Đức Giê-su, Đấng Mê-si-a[c].
  to: thì chính anh em cũng, như những viên đá sống[a], đang được xây dựng thành một ngôi nhà thuộc linh, thành một đoàn tư tế thánh[b], hầu dâng những sinh tế thuộc linh được Đức Chúa Trời vui nhận nhờ Đức Giê-su, Đấng Mê-si-a[c].
  rationale: Thay “xây dựng nên một ngôi nhà” bằng “xây dựng thành một ngôi nhà” để phản ánh chính xác hơn quan hệ bổ ngữ/kết quả trong hình ảnh οἰκοδομεῖσθε οἶκος πνευματικός và để câu tiếng Việt không mơ hồ. Đổi cách trình bày chú thích b cho tự nhiên hơn, nhưng vẫn bảo lưu tính không hoàn toàn quyết định của εἰς và khả năng liên kết cú pháp được nêu trong bản tiếng Anh.
  reviewer_model: gpt-5.6-terra
