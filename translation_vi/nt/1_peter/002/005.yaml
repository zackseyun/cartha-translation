id: 1PE.2.5
reference: 1 Peter 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: vi
  text: thì chính anh em cũng, như những viên đá sống[a], đang được xây dựng thành một ngôi nhà thuộc linh, thành một đoàn tư tế thánh[b], hầu dâng những sinh tế thuộc linh được Đức Chúa Trời vui nhận nhờ Đức Giê-su, Đấng Mê-si-a[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giống như những viên đá sống.”'
    reason: lexical_alternative
  - marker: b
    text: 'Giới từ Hy Lạp ở đây có thể diễn tả mục tiêu hoặc kết quả: “để trở thành một đoàn tư tế thánh.” Cũng có thể liên kết với cụm trước: “được xây dựng thành một ngôi nhà thuộc linh, thành một đoàn tư tế thánh.”'
    reason: alternative_reading
  - marker: c
    text: 'Tiếng Hy Lạp: “Giê-su Christ”; Χριστός là tước hiệu có nghĩa là “Đấng Mê-si-a,” tức Đấng được xức dầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: thì chính anh em cũng
  rationale: “Chính anh em” giữ sắc thái nhấn mạnh của αὐτοὶ; “cũng” thể hiện lực bổ sung của καί, liên kết người đọc với hình ảnh “viên đá sống” nói về Chúa Giê-su ở câu trước.
- source_word: ὡς λίθοι ζῶντες
  choice: như những viên đá sống
  rationale: Giữ nguyên phép so sánh và tiếng vọng với hình ảnh “đá sống” trong văn mạch trước.
- source_word: οἰκοδομεῖσθε
  choice: đang được xây dựng nên
  rationale: Giữ thể bị động và sắc thái tiến triển của động từ hiện tại, đồng thời không nêu rõ tác nhân vì nguyên văn không nêu.
- source_word: οἶκος πνευματικὸς
  choice: một ngôi nhà thuộc linh
  rationale: Giữ hình ảnh kiến trúc và tính từ πνευματικός mà không xác định quá mức bản chất của “thuộc linh”.
- source_word: ἱεράτευμα ἅγιον
  choice: một đoàn tư tế thánh
  rationale: ἱεράτευμα chỉ một tập thể tư tế/chức tư tế, không đơn thuần là nhiều cá nhân riêng lẻ. “Đoàn tư tế” diễn đạt rõ ý nghĩa tập thể trong tiếng Việt hiện đại.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: hầu dâng những sinh tế thuộc linh
  rationale: ἀναφέρω trong ngữ cảnh tế lễ mang nghĩa dâng lễ vật; “sinh tế” giữ hình ảnh tế tự của θυσία, còn “thuộc linh” không diễn giải thêm bản chất các sinh tế.
- source_word: εὐπροσδέκτους θεῷ
  choice: được Đức Chúa Trời vui nhận
  rationale: Diễn đạt tự nhiên ngôn ngữ chấp nhận tế lễ và giữ Đức Chúa Trời là Đấng tiếp nhận.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nhờ Đức Giê-su, Đấng Mê-si-a
  rationale: διά với sở hữu cách chỉ phương tiện hoặc sự trung gian; “nhờ” tự nhiên trong tiếng Việt. Χριστός được hiểu là tước hiệu nên dịch là “Đấng Mê-si-a”.
theological_decisions:
- issue: Thể và tác nhân của οἰκοδομεῖσθε
  choice: “đang được xây dựng nên,” không nêu tác nhân
  alternative: “hãy tự xây dựng mình” hoặc thêm rõ “được Đức Chúa Trời xây dựng”
  rationale: Hình thái và văn mạch nâng đỡ cách hiểu bị động. Bản dịch giữ tác nhân ngầm, không bổ sung điều nguyên văn không nói rõ.
- issue: Quan hệ do εἰς biểu thị trong εἰς ἱεράτευμα ἅγιον
  choice: “để trở thành một đoàn tư tế thánh”
  alternative: “cho một đoàn tư tế thánh” hoặc “thành một đoàn tư tế thánh”
  rationale: εἰς có thể chỉ mục tiêu hoặc kết quả. Cách dịch chính diễn đạt tự nhiên cả hướng đi lẫn kết quả, còn chú thích bảo lưu các khả năng cú pháp.
- issue: Ý nghĩa của Χριστοῦ
  choice: “Đấng Mê-si-a”
  alternative: “Đấng Christ” hoặc xem “Christ” như một phần của tên riêng
  rationale: Trong cụm này, Χριστός hoạt động như tước hiệu gắn với Giê-su. Dịch tước hiệu làm rõ nghĩa Mê-si-a mà không thêm một lập trường hệ phái.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng đại từ số nhiều “anh em” theo cách xưng hô trực tiếp của thư tín. “Đoàn tư tế” được chọn thay vì “chức tư tế” để làm nổi bật cộng đồng người được xây dựng nên, còn “thuộc linh” được giữ nhất quán cho πνευματικός mà không thu hẹp thành “do Thánh Linh” hay chỉ đơn thuần “thiêng liêng.”
