review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ tốt phép so sánh “như những viên đá sống,” thể bị động tiếp diễn của οἰκοδομεῖσθε, tính tập thể của ἱεράτευμα, và quan hệ trung gian của διά. Tuy nhiên, “đang được xây dựng nên một ngôi nhà” thiếu từ đánh dấu kết quả/bổ ngữ sau động từ bị động, nên trong tiếng Việt có thể bị hiểu là anh em đang xây dựng một ngôi nhà. Cần đổi thành “được xây dựng thành một ngôi nhà...”.
  naturalness: Văn phong nhìn chung trang trọng, hiện đại và phù hợp thư tín. Cấu trúc “được xây dựng nên một ngôi nhà” không tự nhiên bằng “được xây dựng thành một ngôi nhà”; sửa đổi này cũng làm rõ hình ảnh cộng đồng được xây dựng thành nhà thiêng liêng.
  terminology: “Đoàn tư tế thánh,” “sinh tế thuộc linh,” “Đức Chúa Trời,” và “Đấng Mê-si-a” nhất quán với ý nghĩa nguyên ngữ và thanh ghi Kinh Thánh. “Đấng Mê-si-a” chuyển tải Χριστός như một tước hiệu, không áp đặt diễn giải hệ phái.
  issues:
  - severity: medium
    issue: Cấu trúc “đang được xây dựng nên một ngôi nhà thuộc linh” thiếu dấu hiệu chỉ kết quả/bổ ngữ.
    rationale: οἰκοδομεῖσθε đi với οἶκος πνευματικός diễn tả người đọc đang được xây dựng thành/một nhà thuộc linh. Trong tiếng Việt, không có “thành” thì câu dễ chuyển nghĩa sang việc xây dựng một ngôi nhà, thay vì chính anh em được tạo nên nhà ấy.
  - severity: low
    issue: Chú thích b dùng phương án “cho một đoàn tư tế thánh,” vốn không tự nhiên trong tiếng Việt hiện đại.
    rationale: Có thể bảo lưu độ mở mục tiêu/kết quả của εἰς bằng những cách nói tự nhiên hơn như “thành” hoặc “để trở thành,” đồng thời giữ khả năng liên kết cú pháp với cụm “một ngôi nhà thuộc linh”.
