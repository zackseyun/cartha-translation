id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: vi
  text: Khi anh chị em đến với Ngài[a], là hòn đá sống, bị loài người[b] loại bỏ nhưng đối với Đức Chúa Trời lại được chọn và quý giá,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc hơn: “Đến với Đấng ấy” hoặc “Trong khi đến với Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: Hay “người ta”; nguyên văn chỉ con người nói chung, đối lập với Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: đến với Ngài
  rationale: Cụm từ theo sát nghĩa là “đến với Đấng ấy”; với động từ chỉ sự tiến đến, “đến với Ngài” tự nhiên trong tiếng Việt và giữ nguyên đại từ của bản Hy Lạp, không chèn tên riêng.
- source_word: προσερχόμενοι
  choice: Khi anh chị em đến
  rationale: Phân từ hiện tại diễn tả hành động đang diễn tiến của các độc giả. Mệnh đề “khi… đến” diễn đạt rõ quan hệ với mạch văn; “anh chị em” làm sáng tỏ chủ ngữ số nhiều vốn hàm ẩn trong hình thái Hy Lạp.
- source_word: λίθον ζῶντα
  choice: hòn đá sống
  rationale: “Hòn đá” giữ hình ảnh vật liệu xây dựng được triển khai trong ngữ cảnh, còn “sống” bảo toàn phép ẩn dụ nghịch lý của nguyên văn.
- source_word: ὑπὸ ἀνθρώπων
  choice: bị loài người
  rationale: “Loài người” bao quát ý nghĩa của danh từ số nhiều ἄνθρωποι và làm nổi bật sự tương phản giữa đánh giá của con người với đánh giá của Đức Chúa Trời.
- source_word: ἀποδεδοκιμασμένον
  choice: loại bỏ
  rationale: Phân từ hoàn thành bị động hàm ý đã bị xem xét rồi khước từ. “Loại bỏ” rõ nghĩa, tự nhiên và phù hợp với hình ảnh hòn đá bị người xây dựng gạt đi.
- source_word: παρὰ δὲ θεῷ
  choice: nhưng đối với Đức Chúa Trời lại
  rationale: παρά với tặng cách ở đây diễn tả địa vị hoặc giá trị theo sự đánh giá của Đức Chúa Trời. “Đối với Đức Chúa Trời” giữ sắc thái ấy và tạo tương phản rõ với “loài người”.
- source_word: ἐκλεκτὸν
  choice: được chọn
  rationale: Cách dịch này giữ ý được tuyển chọn mà không dùng thuật ngữ thần học khó hiểu.
- source_word: ἔντιμον
  choice: quý giá
  rationale: Từ này có thể chỉ điều được tôn trọng hoặc có giá trị cao. “Quý giá” tự nhiên, đồng thời phù hợp với hình ảnh hòn đá.
theological_decisions:
- issue: Đối tượng của đại từ và hình ảnh hòn đá
  choice: Giữ đại từ “Ngài” và trình bày Ngài là “hòn đá sống.”
  alternative: Chèn rõ “Chúa Giê-xu” hoặc “Đấng Christ.”
  rationale: Ngữ cảnh 2:3–8 cho thấy đối tượng là Chúa Giê-xu, nhưng câu Hy Lạp tại đây chỉ dùng đại từ. Bản dịch không nói rõ hơn nguyên văn.
- issue: Quan hệ của παρὰ θεῷ với ἐκλεκτὸν ἔντιμον
  choice: “đối với Đức Chúa Trời lại được chọn và quý giá”
  alternative: “được Đức Chúa Trời chọn và quý trọng”
  rationale: Cách chọn giữ góc nhìn đánh giá của cụm παρὰ θεῷ và để cả “được chọn” lẫn “quý giá” nằm trong quan hệ ấy, thay vì biến cả hai thành hai động từ bị động do Đức Chúa Trời thực hiện.
- issue: Phạm vi nghĩa của ἀνθρώπων
  choice: “loài người”
  alternative: “người ta” hoặc “con người”
  rationale: Danh từ Hy Lạp ở số nhiều chỉ con người nói chung trong sự đối lập với Đức Chúa Trời; tiếng Việt không cần thu hẹp thành riêng nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. “Anh chị em” diễn đạt tự nhiên đối tượng số nhiều trong cộng đồng đức tin. Dấu gạch ngang cho thấy phần mô tả “hòn đá sống” là thành phần chen giải thích và câu còn tiếp tục sang câu 5.
