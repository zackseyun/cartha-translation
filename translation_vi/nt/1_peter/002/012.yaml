id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: vi
  text: Hãy giữ nếp sống của anh em giữa các dân ngoại thật đáng kính, để trong chính những điều họ vu khống anh em là kẻ làm ác, khi tận mắt thấy những việc lành của anh em, họ sẽ tôn vinh Đức Chúa Trời trong ngày Ngài viếng thăm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngày Ngài viếng thăm” cũng có thể được hiểu là ngày Đức Chúa Trời đến để cứu giúp hoặc để xét xử; nguyên văn không nói rõ tại đây.
    reason: Giải thích sự mơ hồ thần học thực sự của ἐπισκοπή mà không giải quyết thay cho độc giả.
lexical_decisions:
- source_word: ἀναστροφή
  choice: nếp sống
  rationale: Chỉ toàn bộ cách sống và hành vi, tự nhiên hơn lối dịch sát chữ nhưng vẫn giữ phạm vi nghĩa của từ Hy Lạp.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Giữ nghĩa chỉ những người ngoài cộng đồng giao ước/tín hữu trong ngữ cảnh thư, không thu hẹp thành một dân tộc cụ thể.
- source_word: καλήν
  choice: thật đáng kính
  rationale: Trong ngữ cảnh nói về nếp sống được người ngoài quan sát, từ này mang sắc thái tốt đẹp, cao quý và đáng trọng.
- source_word: ἐν ᾧ
  choice: trong chính những điều
  rationale: Bảo tồn cấu trúc và độ mở của nguyên văn thay vì diễn giải đơn giản thành một mệnh đề nhượng bộ như “dù họ”.
- source_word: καταλαλοῦσιν
  choice: vu khống
  rationale: Diễn đạt lời nói chống lại và cáo buộc mang tính phỉ báng.
- source_word: ἐποπτεύοντες
  choice: khi tận mắt thấy
  rationale: Thể hiện sắc thái quan sát trực tiếp, chăm chú của động từ.
- source_word: ἐν ἡμέρᾳ ἐπισκοπῆς
  choice: trong ngày Ngài viếng thăm
  rationale: Giữ thành ngữ thần học và sự mơ hồ của ἐπισκοπή về cuộc viếng thăm của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của “ngày viếng thăm”
  choice: Không xác định đó là ngày cứu độ, phán xét hay một hành động can thiệp cụ thể của Đức Chúa Trời.
  alternative: Diễn giải thành “ngày Đức Chúa Trời xét xử” hoặc “ngày Đức Chúa Trời cứu họ”.
  rationale: Nguyên văn không tự giải quyết hướng tích cực hay phán xét của ἐπισκοπή; bản dịch cần giữ sự căng thẳng này.
- issue: Quan hệ logic của ἐν ᾧ
  choice: Dịch “trong chính những điều” để giữ quan hệ gắn với nội dung bị vu khống.
  alternative: Dịch nhượng bộ “dù họ vu khống anh em”.
  rationale: Cách nhượng bộ dễ đọc nhưng giải thích rõ hơn mức nguyên văn; lựa chọn hiện tại theo sát cấu trúc SBLGNT và lớp tham khảo POB.
- issue: Chủ thể ngầm trong hành động viếng thăm
  choice: Thêm “Ngài” để tiếng Việt tự nhiên, với đại từ quy chiếu về Đức Chúa Trời.
  alternative: Dịch danh từ trừu tượng “trong ngày viếng thăm”.
  rationale: Cụm thuần danh từ khó tự nhiên trong tiếng Việt; “Ngài viếng thăm” làm rõ ngữ pháp nhưng không xác định tính chất của cuộc viếng thăm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng trong thư tín; “Đức Chúa Trời” là cách gọi phổ thông, trang nghiêm. Câu giữ phần nào cấu trúc dày của nguyên văn nhằm bảo tồn quan hệ “trong chính những điều”, nhưng được ngắt bằng dấu phẩy để đọc tự nhiên.
