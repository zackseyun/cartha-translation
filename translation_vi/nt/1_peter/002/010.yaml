  terminology: “Dân của Đức Chúa Trời” diễn đạt chính xác λαὸς θεοῦ trong văn phong Kinh Thánh Việt ngữ. “Thương xót” là thuật ngữ phù hợp cho ἐλεέω. Tên sách và tên riêng trong chú thích được phiên âm nhất quán theo lối dùng của bản dịch.
