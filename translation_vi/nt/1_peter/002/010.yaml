id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: vi
  text: Trước kia, anh chị em không phải là một dân[a], nhưng nay là dân của Đức Chúa Trời; trước kia, anh chị em không được thương xót[b], nhưng nay đã được thương xót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Phi-e-rơ gợi nhắc Ô-sê 1:9–10; 2:23 và áp dụng ngôn ngữ về sự phục hồi dân Y-sơ-ra-ên cho căn tính hiện nay của độc giả trong dân Đức Chúa Trời.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “trước kia chưa nhận được lòng thương xót, nhưng nay đã nhận được lòng thương xót.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: anh chị em
  rationale: Đại từ quan hệ số nhiều chỉ về những người đang được Phi-e-rơ trực tiếp nói với ở câu trước. Dùng “anh chị em” diễn đạt tự nhiên mối liên hệ ấy trong tiếng Việt mà không biến họ thành một nhóm ở ngôi thứ ba.
- source_word: ποτε
  choice: trước kia
  rationale: Diễn tả tình trạng trong quá khứ, đối lập rõ với νῦν (“nay”).
- source_word: λαὸς
  choice: một dân / dân của Đức Chúa Trời
  rationale: λαός chỉ một cộng đồng hay một dân, đặc biệt mang sắc thái giao ước. “Một dân” giữ nguyên nét tập thể của vế đầu, còn “dân của Đức Chúa Trời” diễn đạt tự nhiên λαὸς θεοῦ.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: Sở hữu cách cho biết dân ấy thuộc về Đức Chúa Trời; cách diễn đạt này trang trọng, rõ nghĩa và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: οὐκ ἠλεημένοι
  choice: không được thương xót
  rationale: Phân từ hoàn thành bị động mô tả tình trạng trước kia của những người chưa phải là đối tượng nhận lòng thương xót. Cách dịch bị động giữ rõ hành động hướng đến họ mà không buộc phải nêu tác nhân.
- source_word: ἐλεηθέντες
  choice: đã được thương xót
  rationale: Phân từ bất định bị động đối lập với tình trạng trước đó. “Đã được thương xót” vừa giữ thể bị động vừa cho thấy sự thay đổi đã xảy ra và xác lập tình trạng hiện nay.
- source_word: δὲ
  choice: nhưng
  rationale: Từ nối đánh dấu sự tương phản trong cả hai cặp mệnh đề.
- source_word: νῦν
  choice: nay
  rationale: Đánh dấu thân phận hiện tại, đối lập với tình trạng “trước kia”; “nay” phù hợp với văn phong trang trọng nhưng vẫn dễ hiểu.
theological_decisions:
- issue: Sự gợi nhắc sách Ô-sê và ngôn ngữ về căn tính giao ước
  choice: Giữ nguyên sự chuyển đổi mang tính cộng đồng từ “không phải là một dân” sang “dân của Đức Chúa Trời”.
  alternative: Diễn giải vế đầu thành “không phải là dân của Đức Chúa Trời”, hoặc dịch sát từng chữ thành “không dân”.
  rationale: Bản Hy Lạp ở vế đầu nói “không phải là một dân”, chứ không nói rõ “không phải là dân của Đức Chúa Trời”; vế sau mới nói “dân của Đức Chúa Trời”. Giữ sự khác biệt này bảo toàn lời văn và dư âm từ Ô-sê, đồng thời không áp đặt một cách hiểu sắc tộc hay hệ phái hẹp hơn văn bản.
- issue: Tác nhân của lòng thương xót
  choice: Dùng cấu trúc bị động “được thương xót” mà không thêm chủ thể.
  alternative: Thêm rõ “được Đức Chúa Trời thương xót”.
  rationale: Ngữ cảnh thần học cho thấy Đức Chúa Trời là nguồn của lòng thương xót, nhưng hai phân từ Hy Lạp là bị động và không nêu tác nhân. Bản dịch không thêm điều văn bản chỉ hàm ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc song hành “trước kia… nhưng nay…” được giữ để làm nổi bật hai sự đảo ngược. “Anh chị em” diễn đạt trực tiếp số nhiều hỗn hợp một cách tự nhiên; “một dân” bảo toàn ý nghĩa cộng đồng của λαός.
