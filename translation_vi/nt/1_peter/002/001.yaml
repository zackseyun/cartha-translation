id: 1PE.2.1
reference: 1 Peter 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: vi
  text: Vậy, sau khi đã dứt bỏ[a] mọi ác ý, mọi sự gian dối, mọi thói giả hình, mọi sự đố kỵ, cùng mọi lời nói xấu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sau khi đã cởi bỏ” hoặc “dứt bỏ.” Nguyên văn là một phân từ Hy Lạp, chỉ hành động có tính chuẩn bị cho lời thúc giục ở câu 2.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mọi lời gièm pha.” Từ Hy Lạp nói rộng về lời nói chống lại hoặc làm tổn hại thanh danh người khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: hãy dứt bỏ
  rationale: Động từ gợi hình ảnh cởi bỏ hoặc đặt sang một bên. Dịch thành lời thúc giục giúp câu tiếng Việt tự nhiên; chú thích giữ lại cấu trúc phân từ và quan hệ chuẩn bị cho mệnh lệnh ở câu 2.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận hoặc hệ quả từ 1:22–25 bằng một từ nối tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: πᾶσαν κακίαν
  choice: mọi ác ý
  rationale: Trong danh sách các thói xấu liên quan đến cách đối xử với người khác, κακία phù hợp với ý xấu hay ác ý hơn là khái niệm quá rộng như mọi điều gian ác.
- source_word: πάντα δόλον
  choice: mọi sự gian dối
  rationale: δόλος chỉ sự lừa dối, mưu mẹo nhằm đánh lừa; cách dịch này rõ nghĩa và thông dụng.
- source_word: ὑποκρίσεις
  choice: những thói giả hình
  rationale: Giữ sắc thái số nhiều của nguyên văn, chỉ nhiều biểu hiện hoặc hành vi giả hình, đồng thời tránh cách nói gượng như “những sự giả hình”.
- source_word: φθόνους
  choice: những lòng đố kỵ
  rationale: Phản ánh số nhiều của nguyên văn và diễn đạt tự nhiên các thái độ ganh ghét, đố kỵ.
- source_word: πάσας καταλαλιάς
  choice: mọi lời nói xấu
  rationale: καταλαλιά chỉ lời nói chống lại hoặc làm tổn hại thanh danh người khác; “nói xấu” giữ được phạm vi rộng hơn thuật ngữ pháp lý “vu khống”.
theological_decisions:
- issue: Phân từ Ἀποθέμενοι liên hệ với mệnh lệnh ở câu 2
  choice: Dịch theo chức năng khuyên bảo là “hãy dứt bỏ,” đồng thời ghi chú cấu trúc sát chữ.
  alternative: “sau khi đã dứt bỏ” hoặc “đang dứt bỏ”
  rationale: Nguyên văn dùng phân từ aorist làm hành động chuẩn bị cho mệnh lệnh ở 2:2. Bản dịch chính ưu tiên câu khuyên bảo tự nhiên trong tiếng Việt nhưng không biến quan hệ ngữ pháp thành một kết luận thần học; chú thích bảo tồn cấu trúc và sắc thái khả dĩ.
- issue: Phạm vi đạo đức của danh sách thói xấu
  choice: Dịch từng thói xấu bằng những cách gọi cụ thể, không diễn giải thành một hệ thống giáo lý.
  alternative: Mở rộng κακία thành “mọi điều gian ác” hoặc thu hẹp καταλαλιάς thành “mọi lời vu khống”
  rationale: Câu này là lời khuyên đạo đức. Cách dịch giữ tính cụ thể của danh sách và không thu hẹp hay mở rộng quá mức phạm vi của các từ Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Dứt bỏ” truyền đạt cả hình ảnh gạt bỏ và tính quyết liệt của lời khuyên; các danh từ số nhiều được diễn đạt bằng “những thói” và “những lòng” để vừa tự nhiên vừa phản ánh hình thái nguyên văn. Dấu phẩy cuối câu được giữ vì cú pháp tiếp tục sang 2:2.
