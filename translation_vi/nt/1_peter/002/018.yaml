  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: vi
  text: Hỡi những người tôi tớ trong nhà[a], hãy phục tùng chủ mình với tất cả lòng kính sợ[b], không chỉ những người chủ tốt và ôn hòa mà cả những người chủ bất công[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người nô lệ trong nhà.” Từ Hy Lạp οἰκέται chỉ cụ thể những người lệ thuộc phục vụ trong một hộ gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “trong mọi sự kính sợ.” Trong ngữ cảnh này, cụm từ nói đến thái độ kính trọng và thuận phục.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “khắc nghiệt.” Từ Hy Lạp có nghĩa đen là “cong” hay “cong vẹo” và có thể chỉ người lệch lạc hoặc bất công.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: những người tôi tớ trong nhà
  rationale: Chỉ những người lệ thuộc làm việc trong phạm vi gia đình. Cách dịch này giữ rõ bối cảnh trong nhà; chú thích nêu phương án “nô lệ trong nhà” để không che khuất thân phận lệ thuộc trong xã hội cổ đại.
- source_word: ὑποτασσόμενοι
  choice: hãy phục tùng
  rationale: Phân từ ở đây mang chức năng mệnh lệnh trong mạch khuyên bảo. “Hãy phục tùng” tự nhiên trong tiếng Việt hiện đại và diễn đạt rõ lực khuyên truyền.
- source_word: ἐν παντὶ φόβῳ
  choice: với lòng kính trọng trọn vẹn
  rationale: φόβος có thể chỉ sự sợ hãi, kính sợ hoặc kính trọng. Trong quan hệ được nói đến ở đây, cách dịch này diễn đạt thái độ tôn kính và dè dặt mà không mặc nhiên biến câu thành mệnh lệnh phải khiếp sợ; nghĩa sát chữ được giữ trong chú thích.
- source_word: δεσπόταις
  choice: chủ mình
  rationale: δεσπότης chỉ người nắm quyền trên tôi tớ hoặc nô lệ trong gia đình. “Chủ” diễn đạt đúng quan hệ xã hội ấy và tránh sắc thái thần học dễ có ở “Chúa”.
- source_word: ἀγαθοῖς
  choice: tốt
  rationale: Giữ nghĩa đạo đức rộng và trực tiếp của ἀγαθός.
- source_word: ἐπιεικέσιν
  choice: ôn hòa
  rationale: Diễn đạt sự hiền hòa, khoan dung và biết điều của ἐπιεικής, đồng thời tạo đối lập tự nhiên với “ngang ngược”.
- source_word: σκολιοῖς
  choice: ngang ngược
  rationale: σκολιός theo nghĩa đen là cong vẹo, và theo nghĩa bóng chỉ người lệch lạc, bất công hoặc khó chịu. “Ngang ngược” giữ được sắc thái lệch khỏi điều ngay thẳng mà vẫn tự nhiên khi mô tả con người.
theological_decisions:
- issue: Cách gọi thân phận οἰκέται mà không giảm nhẹ cũng không khái quát quá mức địa vị xã hội
  choice: Dùng “những người tôi tớ trong nhà” và kèm chú thích “nô lệ trong nhà”
  alternative: Dịch trực tiếp “những người nô lệ trong nhà”
  rationale: Từ Hy Lạp xác định những người lệ thuộc thuộc hộ gia đình. Bản chính giữ cách nói dễ hiểu, có phẩm giá trong tiếng Việt, còn chú thích bảo toàn thực trạng rằng họ cũng có thể là nô lệ chứ không phải người làm thuê tự do.
- issue: φόβος nên được diễn đạt là sợ hãi hay kính trọng
  choice: Dịch “với lòng kính trọng trọn vẹn”
  alternative: Dịch “với mọi sự kính sợ” hoặc “với tất cả sự sợ hãi”
  rationale: Ngữ cảnh đòi hỏi thái độ thuận phục đầy tôn trọng, nhưng từ gốc vẫn có phạm vi nghĩa bao gồm sợ hãi. Bản chính dùng tương đương theo ngữ cảnh và chú thích giữ nghĩa sát chữ, không loại bỏ sự căng thẳng của nguyên văn.
- issue: Giữ ẩn dụ “cong vẹo” của σκολιός hay chuyển sang một đặc tính cụ thể
  choice: Dùng “ngang ngược”
  alternative: Dùng “khắc nghiệt”, “bất công” hoặc “cong vẹo”
  rationale: “Ngang ngược” giữ ý lệch khỏi sự ngay thẳng mà không thu hẹp nghĩa chỉ còn khắc nghiệt hay bất công; chú thích nêu cả nghĩa đen lẫn các khả năng theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hỡi” đánh dấu lời trực tiếp khuyên bảo; “hãy phục tùng” chuyển phân từ mang chức năng mệnh lệnh thành câu tiếng Việt tự nhiên. Các chú thích bảo toàn những điểm có thể gây tranh luận về thân phận xã hội, sắc thái của φόβος và ẩn dụ trong σκολιός.
