id: 1PE.2.15
reference: 1 Peter 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: vi
  text: 'Vì đây là ý muốn của Đức Chúa Trời: qua việc làm điều thiện, anh chị em làm cho sự thiếu hiểu biết của những người ngu dại im tiếng[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bịt miệng sự thiếu hiểu biết của những người ngu dại.” Động từ Hy Lạp có nghĩa đen là “đeo rọ mõm,” nhưng ở đây được dùng theo nghĩa bóng về việc chặn đứng lời nói chống đối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ nêu lý do cho lời khuyên ở câu trước; “Vì” diễn đạt tự nhiên quan hệ nguyên nhân trong tiếng Việt.
- source_word: οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ
  choice: ý muốn của Đức Chúa Trời là thế này
  rationale: Cách diễn đạt này giữ ý chỉ dẫn về cách thức của οὕτως, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἀγαθοποιοῦντας
  choice: bằng việc làm điều thiện
  rationale: 'Phân từ hiện tại có sắc thái phương tiện: chính qua việc làm điều thiện mà người tin Chúa khiến lời thiếu hiểu biết phải im đi.'
- source_word: φιμοῦν
  choice: khiến ... phải câm lặng
  rationale: Động từ có nghĩa đen là “rọ mõm” nhưng được dùng ẩn dụ để nói đến việc chặn đứng lời nói chống đối; lựa chọn này giữ được sức mạnh của hình ảnh mà vẫn tự nhiên.
- source_word: ἀγνωσίαν
  choice: sự thiếu hiểu biết
  rationale: Diễn đạt trực tiếp tình trạng không biết hoặc không hiểu, không tự ý tăng nghĩa thành một lời kết án đạo đức riêng biệt.
- source_word: ἀφρόνων ἀνθρώπων
  choice: những người ngu dại
  rationale: ἄφρων mang nghĩa ngu dại, thiếu suy xét; ἄνθρωποι chỉ người nói chung chứ không riêng nam giới.
theological_decisions:
- issue: Chủ thể ngầm của cấu trúc nguyên mẫu φιμοῦν
  choice: anh chị em phải khiến
  alternative: người ta phải khiến / hãy khiến
  rationale: Chủ thể được hiểu theo những người nhận lời khuyên trong văn cảnh. “Anh chị em” biểu đạt số nhiều bao quát giới tính; “phải” cho thấy điều này thuộc ý muốn của Đức Chúa Trời mà không biến câu thành một mệnh lệnh độc lập mạnh hơn nguyên văn.
- issue: Cách gọi θεός
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: Dùng cách gọi phổ thông trong truyền thống Kinh Thánh Tin Lành tiếng Việt, không thêm một nét nghĩa thần học không có trong θεός; phương án khác vẫn tương đương về nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm điều thiện” giữ sắc thái đạo đức rõ ràng; “khiến ... phải câm lặng” mạnh nhưng không thô, phù hợp với ẩn dụ của nguyên văn. Đại từ “anh chị em” làm rõ đối tượng số nhiều và không giới hạn giới tính.
