revisions:
- from: 'Vì ý muốn của Đức Chúa Trời là thế này: bằng việc làm điều thiện, anh chị em phải khiến sự thiếu hiểu biết của những người ngu dại phải câm lặng[a].'
  to: 'Vì đây là ý muốn của Đức Chúa Trời: qua việc làm điều thiện, anh chị em làm cho sự thiếu hiểu biết của những người ngu dại im tiếng[a].'
  rationale: Bản sửa giữ quan hệ nhân quả (“Vì”), ý chỉ cách thức của “đây là ý muốn của Đức Chúa Trời,” và phương tiện “qua việc làm điều thiện.” Cụm “làm cho ... im tiếng” chuyển tải φιμοῦν tự nhiên hơn, không thêm mệnh lệnh “phải” và không làm yếu hình ảnh ẩn dụ. Chú thích duy trì phương án sát nghĩa “bịt miệng” cùng nghĩa đen “đeo rọ mõm.”
  reviewer_model: gpt-5.6-terra
