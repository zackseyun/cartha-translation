    rationale: ποιμήν là danh từ “người chăn chiên/shepherd”, không phải trước hết là hành động “chăn dắt”. “Đấng Chăn Chiên” bảo toàn hình ảnh và chức năng danh xưng rõ hơn trong tiếng Việt hiện đại.
