id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: vi
  text: Vì anh chị em vốn như những con chiên đi lạc[a], nhưng nay đã quay về[b] với Đấng Chăn Chiên và Đấng Trông Nom linh hồn anh chị em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lang thang” hoặc “bị dẫn đi lạc”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã trở lại”; hình thức Hy Lạp cũng có thể mang sắc thái bị động: “đã được đưa trở về”.'
    reason: alternative_reading
  - marker: c
    text: “Đấng Trông Nom” cũng có thể dịch là “Đấng Gìn Giữ”; theo truyền thống là “Giám mục”. “Linh hồn” ở đây cũng có thể chỉ sự sống hoặc chính con người anh chị em.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Vì trước đây anh chị em
  rationale: γάρ nối câu này với lời trước bằng ý giải thích nguyên do; ἦτε ở thì chưa hoàn thành diễn tả tình trạng trước kia. “Trước đây” làm rõ sự tương phản với νῦν.
- source_word: ὡς πρόβατα πλανώμενοι
  choice: như chiên đi lạc
  rationale: ὡς biểu thị sự so sánh; πλανώμενοι có thể là “đi lạc/lang thang” hoặc mang sắc thái bị động “bị dẫn lạc”. “Đi lạc” giữ tự nhiên hình ảnh chiên và không xác định quá mức tác nhân.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: nhưng nay đã quay về
  rationale: ἀλλά tạo tương phản mạnh; ἐπεστράφητε tuy có hình thức bị động nhưng có thể được hiểu theo nghĩa trung gian/nội động từ. “Đã quay về” diễn tả biến chuyển đã xảy ra mà không loại trừ sắc thái bị động, được ghi trong chú thích.
- source_word: ἐπὶ τὸν ποιμένα
  choice: với Đấng Chăn Dắt
  rationale: ποιμήν là người chăn chiên. Trong tiếng Việt, “Đấng Chăn Dắt” vừa giữ hình ảnh mục tử vừa tự nhiên như tước hiệu chỉ về Đấng Christ.
- source_word: καὶ ἐπίσκοπον
  choice: và Đấng Trông Nom
  rationale: ἐπίσκοπος chỉ người quan sát, chăm sóc và coi sóc. “Đấng Trông Nom” truyền đạt chức năng trong ngữ cảnh này mà không nhập vào câu một chức danh giáo hội phát triển về sau.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: linh hồn anh chị em
  rationale: ψυχή có thể chỉ linh hồn, sự sống hoặc chính con người. “Linh hồn” giữ nghĩa trực tiếp và truyền thống trong ngữ cảnh được chăm nom thuộc linh, còn chú thích nêu phạm vi nghĩa rộng hơn.
theological_decisions:
- issue: ἐπίσκοπος được dùng như tước hiệu chỉ về Đấng Christ
  choice: Đấng Trông Nom
  alternative: Đấng Gìn Giữ; Giám mục
  rationale: Cách dịch này giữ ý nghĩa người trông coi/chăm sóc, đồng thời tránh áp đặt chức danh “Giám mục” với những liên tưởng về cơ cấu giáo hội về sau. “Đấng Gìn Giữ” khả dĩ nhưng diễn giải hơn.
- issue: Sắc thái thể của ἐπεστράφητε
  choice: đã quay về
  alternative: đã được đưa trở về; đã trở lại
  rationale: Hình thức bị động có thể gợi tác nhân đưa họ trở về, nhưng động từ cũng thường mang nghĩa trung gian/nội động từ. Bản chính dùng cách nói tự nhiên và chú thích bảo tồn khả năng bị động, không giải quyết thay văn bản mối căng thẳng giữa hành động của Đức Chúa Trời và sự đáp ứng của con người.
- issue: Phạm vi nghĩa của ψυχή
  choice: linh hồn
  alternative: sự sống; chính con người anh chị em
  rationale: “Linh hồn” phù hợp ngữ cảnh chăm sóc thuộc linh và giữ cách diễn đạt quen thuộc, nhưng không nên hiểu ψυχή như một phần tách biệt hoàn toàn khỏi con người; chú thích bảo tồn nghĩa rộng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμῶν; viết hoa các tước hiệu chỉ về Đấng Christ. Tránh thuật ngữ giáo phái và giữ các khả năng nghĩa thực sự của thể bị động, ἐπίσκοπος và ψυχή trong chú thích.
