  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: vi
  text: hay các quan cai trị[a], như những người được người ấy sai phái để trừng phạt kẻ làm điều ác và khen ngợi người làm điều thiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “được người ấy sai phái.” “Người ấy” nhiều khả năng chỉ vua hoặc hoàng đế được nhắc ở câu trước; một số người hiểu là chỉ Đức Chúa Trời theo nghĩa rộng hơn, là Đấng sắp đặt thẩm quyền.'
    reason: Bảo lưu sự không minh định của đại từ αὐτοῦ và cách hiểu thay thế.
lexical_decisions:
- source_word: εἴτε
  choice: hay
  rationale: Tiếp nối cấu trúc lựa chọn ở câu trước; “hay” tự nhiên trong tiếng Việt khi câu được đọc như phần tiếp theo.
- source_word: ἡγεμόσιν
  choice: các quan tổng đốc
  rationale: Chỉ những viên chức cai trị dưới quyền vua/hoàng đế; cách dịch này cụ thể, phù hợp bối cảnh hành chính nhưng không xác định quá mức cơ cấu La Mã.
- source_word: ὡς
  choice: như
  rationale: Giữ chức năng mô tả tư cách của các quan tổng đốc trong mối liên hệ với người sai phái.
- source_word: δι’ αὐτοῦ πεμπομένοις
  choice: những người được vua sai đến
  rationale: διά với sở hữu cách diễn tả tác nhân hoặc trung gian; “được ... sai đến” là cách nói tự nhiên. Đại từ được làm rõ là “vua” theo tiền ngữ gần nhất ở câu 13, còn khả năng quy chiếu rộng hơn được ghi ở chú thích.
- source_word: εἰς ἐκδίκησιν
  choice: để trừng phạt
  rationale: Trong bối cảnh chính quyền và tư pháp, cụm này nói đến việc thi hành hình phạt hơn là sự báo thù mang tính cá nhân.
- source_word: κακοποιῶν
  choice: kẻ làm điều ác
  rationale: Giữ ý chỉ những người có hành vi xấu ác, đồng thời tạo thế đối xứng với “người làm điều thiện”.
- source_word: ἔπαινον
  choice: khen ngợi
  rationale: Diễn đạt chức năng công nhận hoặc biểu dương của nhà cầm quyền; giữ nghĩa cơ bản của danh từ Hy Lạp trong cách nói tự nhiên tiếng Việt.
- source_word: ἀγαθοποιῶν
  choice: người làm điều thiện
  rationale: Giữ sắc thái hành động của từ Hy Lạp và tạo cặp tương phản rõ với “kẻ làm điều ác”.
theological_decisions:
- issue: Từ αὐτοῦ trong δι’ αὐτοῦ quy chiếu đến ai
  choice: “vua” được nhắc ở câu trước
  alternative: Đức Chúa Trời, theo nghĩa rộng rằng thẩm quyền được sắp đặt qua Ngài
  rationale: Tiền ngữ gần nhất và mạch cú pháp tự nhiên nhất là vua/hoàng đế trong câu 13. Tuy nhiên, vì hình thức đại từ Hy Lạp tự nó không nêu danh tính, chú thích bảo lưu cách hiểu rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quan tổng đốc” để diễn tả viên chức cai trị dưới quyền trung ương; dùng “vua” trong câu chính cho rõ nghĩa, đồng thời ghi nguyên văn đại từ ở chú thích để không che khuất tính mơ hồ của nguồn Hy Lạp.
