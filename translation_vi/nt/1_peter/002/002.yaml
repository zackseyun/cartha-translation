id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: vi
  text: Như trẻ sơ sinh, anh chị em hãy khao khát sữa tinh thần thuần khiết[a], để nhờ đó anh chị em lớn lên hướng tới sự cứu rỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sữa thuần khiết thuộc lý trí” hoặc “sữa thuần khiết hợp lý”. Tính từ Hy Lạp này có thể mang nghĩa liên quan đến lý trí, điều hợp lý, hoặc đời sống nội tâm; trong ngữ cảnh này, nó có thể chỉ sự nuôi dưỡng theo nghĩa không phải thể chất.
    reason: Bảo tồn các nghĩa khả dĩ và có ý nghĩa giải kinh của λογικός.
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: Như trẻ sơ sinh
  rationale: Giữ nguyên phép so sánh và hình ảnh những em bé vừa mới chào đời, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸ λογικὸν
  choice: tinh thần
  rationale: Trong ẩn dụ về sữa, từ này chỉ sự nuôi dưỡng không phải theo nghĩa thể chất. “Tinh thần” truyền đạt ý nghĩa nội tâm, phi vật chất mà không biến “sữa” thành lời nói hay một khái niệm cụ thể hơn nguyên văn; sắc thái “thuộc lý trí/hợp lý” được giữ trong chú thích.
- source_word: ἄδολον
  choice: thuần khiết
  rationale: Diễn đạt thứ sữa không bị pha trộn hoặc làm giả; từ ngữ tự nhiên, trang trọng và phù hợp với ẩn dụ.
- source_word: γάλα
  choice: sữa
  rationale: Giữ nguyên hình ảnh trung tâm về nguồn dinh dưỡng dành cho trẻ sơ sinh.
- source_word: ἐπιποθήσατε
  choice: hãy khao khát
  rationale: Thể hiện mệnh lệnh và cường độ mong muốn mạnh mẽ của động từ Hy Lạp.
- source_word: ἐν αὐτῷ
  choice: nhờ sữa ấy
  rationale: Làm rõ đại từ chỉ về “sữa” và diễn đạt phương tiện của sự tăng trưởng một cách tự nhiên trong tiếng Việt.
- source_word: αὐξηθῆτε
  choice: anh chị em được lớn lên
  rationale: Giữ được sắc thái bị động của động từ, nhưng vẫn rõ ràng và tự nhiên.
- source_word: εἰς σωτηρίαν
  choice: hướng đến sự cứu rỗi
  rationale: Giữ lực hướng đích của εἰς, đồng thời tránh hàm ý rằng sự cứu rỗi được kiếm công bằng quá trình tăng trưởng.
theological_decisions:
- issue: Ý nghĩa của λογικός trong ẩn dụ về “sữa”
  choice: Dịch là “tinh thần” trong chính văn và ghi các khả năng sát chữ hơn trong chú thích.
  alternative: thuộc lý trí; hợp lý
  rationale: Ngữ cảnh nói về sữa theo nghĩa ẩn dụ dành cho những người đã được sinh lại. “Tinh thần” là cách diễn đạt dễ hiểu cho sự nuôi dưỡng nội tâm, nhưng vì λογικός cũng có thể mang nghĩa liên quan đến lý trí hoặc điều hợp lý, chú thích bảo tồn sự đa nghĩa thay vì loại bỏ nó.
- issue: Lực hướng đích của εἰς σωτηρίαν
  choice: hướng đến sự cứu rỗi
  alternative: để được cứu rỗi; trong sự cứu rỗi
  rationale: Cách dịch giữ chuyển động hướng đến sự cứu rỗi mà không quyết định thay nguyên văn mối quan hệ thần học chính xác giữa tăng trưởng hiện tại và sự cứu rỗi trong sự viên mãn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh chị em” được thêm để làm rõ chủ thể số nhiều hàm ẩn trong động từ. Cấu trúc “được lớn lên hướng đến” cố ý giữ cả sắc thái bị động của αὐξηθῆτε lẫn hướng đích của εἰς σωτηρίαν.
