id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: vi
  text: Chính ngài đã gánh tội lỗi của chúng ta trong thân thể mình trên cây gỗ[a], để chúng ta, đã chết đối với tội lỗi, sống cho sự công chính. Nhờ vết thương của ngài[b], anh em đã được chữa lành[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên thập tự giá”; nguyên văn là “trên cây gỗ”, có lẽ gợi lại Phục Truyền Luật Lệ Ký 21:23.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “vết roi” hoặc “vết bầm”; danh từ số ít gợi lại Ê-sai 53:5.'
    reason: lexical_alternative
  - marker: c
    text: Sự chữa lành ở đây được diễn tả theo nghĩa rộng. Trong văn cảnh, nó gắn với tội lỗi và sự công chính, nhưng câu chữ không giới hạn ý nghĩa chỉ vào sự chữa lành thể chất hoặc chỉ vào sự chữa lành thuộc linh.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς
  choice: Chính ngài
  rationale: Đại từ nhấn mạnh được đưa lên đầu câu để giữ sắc thái chính ngài là Đấng thực hiện hành động.
- source_word: ἀνήνεγκεν
  choice: đã gánh
  rationale: Trong ngữ cảnh này, từ có thể mang nghĩa đem lên, dâng hoặc mang/gánh. “Gánh” giữ được ý mang lấy tội lỗi và âm vang của Ê-sai 53 mà không biến câu thành một thuật ngữ tế lễ quá chuyên biệt.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: trong thân thể mình
  rationale: Cách dịch trực tiếp, tự nhiên, nhấn mạnh tính thể xác cụ thể của sự chịu khổ; “mình” quy chiếu rõ về chủ thể đã được nhấn mạnh ở đầu câu.
- source_word: ἐπὶ τὸ ξύλον
  choice: trên cây gỗ
  rationale: ξύλον có nghĩa là gỗ hoặc cây. “Cây gỗ” giữ cách diễn đạt của nguyên văn và âm vang có thể có từ Phục Truyền Luật Lệ Ký 21:23, thay vì diễn giải thẳng thành “thập tự giá”.
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: một khi đã chết đối với tội lỗi
  rationale: ἀπογίνομαι diễn tả sự lìa bỏ hay đoạn tuyệt dứt khoát; cách nói “chết đối với tội lỗi” giữ được sức mạnh của hình ảnh và số nhiều của ἁμαρτίαις.
- source_word: τῇ δικαιοσύνῃ
  choice: cho sự công chính
  rationale: Giữ thế đối xứng “chết đối với tội lỗi—sống cho sự công chính” và diễn tả một đời sống hướng về điều công chính.
- source_word: μώλωπι
  choice: vết thương
  rationale: Danh từ số ít chỉ vết thương hoặc vết bầm do đòn đánh. “Vết thương” rõ nghĩa trong tiếng Việt hiện đại và vẫn giữ số ít tập hợp cùng âm vang Ê-sai 53:5.
- source_word: ἰάθητε
  choice: anh em đã được chữa lành
  rationale: Giữ thể bị động và ý nghĩa rộng của động từ, không thu hẹp việc chữa lành chỉ vào bệnh thể chất hoặc chỉ vào một công thức thần học.
theological_decisions:
- issue: Phạm vi của sự chữa lành trong mệnh đề cuối
  choice: Giữ cách nói rộng “đã được chữa lành”.
  alternative: Chỉ rõ là chữa lành thể chất; hoặc chỉ rõ là chữa lành thuộc linh khỏi tội lỗi.
  rationale: Ngữ cảnh trực tiếp nói về tội lỗi, sự công chính và sự chịu khổ của Đấng Christ, nên chắc chắn bao hàm sự phục hồi khỏi tội lỗi; tuy nhiên, bản dịch không nên thu hẹp hình ảnh rộng và âm vang Ê-sai 53 thành một cách giải thích duy nhất.
- issue: Cách dịch ξύλον
  choice: Dùng “cây gỗ” trong chính văn.
  alternative: Dùng “thập tự giá”.
  rationale: Câu này nói đến việc Chúa Giê-su bị đóng đinh, nhưng nguyên văn dùng ξύλον chứ không dùng σταυρός. “Cây gỗ” bảo toàn từ ngữ và liên hệ Kinh Thánh có thể có; chú thích nêu cách hiểu “thập tự giá”.
- issue: Quan hệ giữa sự chết đối với tội lỗi và đời sống công chính
  choice: 'Giữ cấu trúc mục đích: “để… chết đối với tội lỗi… sống cho sự công chính”.'
  alternative: Diễn giải thành sự xưng công chính, sự thánh hóa, hoặc một hệ thống cứu rỗi cụ thể.
  rationale: Nguyên văn trình bày mục đích đạo đức-cứu chuộc nhưng không tự phân loại bằng các thuật ngữ hệ thống; bản dịch giữ nguyên sức căng đó.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu ngắn và cấu trúc đối xứng dễ hiểu. “Chính ngài” bảo toàn sự nhấn mạnh; “cây gỗ” hơi khác lối nói thông thường nhưng cần thiết để phản ánh ξύλον và được giải thích bằng chú thích. “Anh em” là cách xưng hô thư tín quen thuộc, chỉ toàn thể người nhận.
