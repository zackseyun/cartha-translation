language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: vi
  text: 'Vì trong Kinh Thánh có chép[a]: “Này, Ta đặt tại Si-ôn một viên đá góc được chọn và tôn quý[b]; người tin nơi Ngài[c] chắc chắn sẽ không bị hổ thẹn[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát thành ngữ Hy Lạp: “điều ấy có trong Kinh Thánh”; cũng có thể dịch: “Kinh Thánh chép rằng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quý giá.” Từ Hy Lạp có thể chỉ cả giá trị cao lẫn sự tôn kính.'
    reason: lexical_alternative
  - marker: c
    text: 'Theo hình ảnh viên đá, cũng có thể dịch: “tin nơi viên đá ấy.” “Ngài” phản ánh cách Phi-e-rơ áp dụng lời này cho Chúa Cứu Thế trong văn cảnh.'
    reason: alternative_reading
  - marker: d
    text: 'Cũng có thể dịch: “sẽ không bao giờ bị hổ thẹn.” Cấu trúc Hy Lạp phủ định đặc biệt mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Vì
  rationale: Mở đầu lý do dựa trên Kinh Thánh để xác nhận lời vừa nói ở câu trước.
- source_word: περιέχει ἐν γραφῇ
  choice: trong Kinh Thánh có chép
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý của thành ngữ Hy Lạp, theo đó lời trích dẫn hiện có trong Kinh Thánh, mà không tạo một chủ ngữ giả gượng ép.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ lời kêu gọi chú ý trang trọng của lời tiên tri, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: τίθημι ἐν Σιὼν
  choice: Ta đặt tại Si-ôn
  rationale: “Đặt” phù hợp với hành động đặt đá xây dựng; “tại” giữ ý nghĩa địa điểm của ἐν.
- source_word: λίθον ἀκρογωνιαῖον
  choice: một viên đá góc
  rationale: Chỉ viên đá định hướng và liên kết tại góc công trình; cách nói ngắn gọn, dễ hiểu và không thêm ý “chủ yếu” vốn không được nói rõ trong từ Hy Lạp.
- source_word: ἐκλεκτὸν
  choice: được chọn
  rationale: Giữ rõ ý viên đá đã được lựa chọn, đồng thời tránh dùng thuật ngữ thần học chuyên biệt.
- source_word: ἔντιμον
  choice: quý trọng
  rationale: Thể hiện phương diện danh dự của từ Hy Lạp và phù hợp với chủ đề về sự tôn trọng ở văn cảnh kế tiếp; chú thích ghi nhận nghĩa “quý giá” cũng có thể có.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: người tin nơi Ngài
  rationale: Giữ ngôn ngữ “tin” và thể hiện cách Phi-e-rơ áp dụng hình ảnh viên đá cho một Đấng có ngôi vị trong văn cảnh 2:4–8.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: chắc chắn sẽ không bị hổ thẹn
  rationale: “Chắc chắn sẽ không” truyền đạt cấu trúc phủ định đặc biệt nhấn mạnh οὐ μή; “bị hổ thẹn” phản ánh trực tiếp động từ καταισχύνω.
theological_decisions:
- issue: Đối tượng của αὐτῷ trong lời trích dẫn Ê-sai khi được Phi-e-rơ sử dụng
  choice: Dịch theo ngôi vị là “Ngài”
  alternative: “viên đá ấy” hoặc “nó” để bám sát hình ảnh vật thể
  rationale: Dù tiền ngữ trực tiếp là viên đá, văn cảnh 1 Phi-e-rơ 2:4–8 áp dụng viên đá cho Chúa Cứu Thế. “Ngài” giữ cách áp dụng theo ngôi vị ấy, còn chú thích bảo tồn khả năng diễn đạt theo hình ảnh viên đá.
- issue: Sắc thái của ἔντιμον
  choice: quý trọng
  alternative: quý giá
  rationale: Từ này có thể nói đến cả danh dự lẫn giá trị. “Quý trọng” làm nổi bật chủ đề danh dự trong văn cảnh, nhưng không loại bỏ sắc thái giá trị nên phương án kia được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Lời trích dẫn giữ sắc thái tiên tri qua “Này” và đại từ “Ta”; tránh từ ngữ giáo phái. “Đá góc” được dùng thay cho cách diễn giải dài hơn để giữ hình ảnh xây dựng súc tích của nguyên văn.
