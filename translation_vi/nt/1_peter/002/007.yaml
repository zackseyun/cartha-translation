id: 1PE.2.7
reference: 1 Peter 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: vi
  text: 'Vậy, vinh dự thuộc về anh em là những người tin; còn đối với những người không tin thì: “Hòn đá mà thợ xây đã loại bỏ, chính hòn đá ấy đã trở thành hòn đá đầu góc[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Theo cách dịch quen thuộc: “đá góc nhà” hoặc “đá góc chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: vinh dự
  rationale: Danh từ này có thể chỉ sự tôn trọng, giá trị hoặc sự quý báu. “Vinh dự” giữ được cấu trúc cô đọng của tiếng Hy Lạp và phù hợp với ý tương phản ngầm giữa được vinh dự và bị hổ thẹn; khả năng hiểu là sự quý báu của hòn đá được giữ trong chú thích.
- source_word: τοῖς πιστεύουσιν
  choice: đối với anh em là những người tin
  rationale: Cách dịch này giữ lời trực tiếp hướng đến độc giả qua ὑμῖν, đồng thời thể hiện rõ phân từ chỉ những người tin.
- source_word: ἀπιστοῦσιν
  choice: những người không tin
  rationale: Trong thế đối xứng trực tiếp với “những người tin”, đây là nghĩa tự nhiên nhất. Sắc thái không vâng phục được ghi ở chú thích để không thu hẹp nghĩa trong chính văn.
- source_word: λίθος
  choice: hòn đá
  rationale: Phù hợp tự nhiên với hình ảnh xây dựng và với lời trích dẫn Thi Thiên.
- source_word: ἀπεδοκίμασαν
  choice: loại bỏ
  rationale: Động từ diễn tả việc bác bỏ sau khi xem xét; “loại bỏ” tự nhiên trong ngữ cảnh thợ xây đánh giá một hòn đá.
- source_word: οἰκοδομοῦντες
  choice: thợ xây
  rationale: Phân từ được dùng như danh từ trong ẩn dụ xây dựng; “thợ xây” là cách nói hiện đại, rõ ràng.
- source_word: κεφαλὴν γωνίας
  choice: đầu góc nhà
  rationale: Giữ hình ảnh gần với nghĩa đen “đầu của góc” nhưng thêm “nhà” để cụm từ tự nhiên và dễ hiểu trong tiếng Việt, không quyết định dứt khoát chức năng kiến trúc cụ thể của hòn đá.
theological_decisions:
- issue: Quan hệ của ἡ τιμή với các tín hữu và Đấng Christ là hòn đá
  choice: Mệnh đề nói vinh dự thuộc về những người tin.
  alternative: “Sự quý báu ấy dành cho anh em là những người tin,” tức hòn đá là quý báu đối với họ.
  rationale: Cấu trúc ὑμῖν ... ἡ τιμή trực tiếp nhất cho thấy vinh dự dành cho người tin và phù hợp với chủ đề không bị hổ thẹn ở văn cảnh gần. Cách hiểu quy về sự quý báu của hòn đá vẫn khả hữu nên được bảo tồn trong chú thích.
- issue: Ý nghĩa kiến trúc của κεφαλὴ γωνίας
  choice: Giữ ẩn dụ tương đối trong suốt là “đầu góc nhà”.
  alternative: “đá góc nhà” hoặc “đá góc chính”.
  rationale: Cụm Hy Lạp có nghĩa sát là “đầu của góc”; bản dịch chính không nên mặc nhiên chọn một chức năng kiến trúc duy nhất cho hình ảnh mang ý nghĩa Kitô học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để giữ lời trực tiếp số nhiều của thư; dùng “ấy là vinh dự” nhằm bảo tồn sự cô đọng và một phần tính mơ hồ của nguyên văn. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
