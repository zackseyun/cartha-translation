revisions:
- from: 'Vậy, đối với anh em là những người tin, ấy là vinh dự[a]; nhưng đối với những người không tin[b]: “Hòn đá mà thợ xây loại bỏ, chính hòn đá ấy đã trở thành đầu góc nhà[c].”'
  to: 'Vậy, vinh dự thuộc về anh em là những người tin; còn đối với những người không tin thì: “Hòn đá mà thợ xây đã loại bỏ, chính hòn đá ấy đã trở thành hòn đá đầu góc[c].”'
  rationale: Chỉnh cấu trúc đầu câu để biểu đạt rõ “vinh dự thuộc về” người tin, điều vốn phù hợp với cách đọc chính của τιμή trong ngữ cảnh. Chỉnh phần trích dẫn thành “hòn đá đầu góc” để sát cụm κεφαλὴν γωνίας hơn, tự nhiên trong tiếng Việt, và không thêm “nhà.” Các chú thích được giữ nguyên nội dung để bảo tồn những khả năng từ vựng và diễn giải thay thế. Chú thích [a] và [b] vẫn là thông tin hợp lệ dù không được neo trong chính văn, vì chúng giải thích các lựa chọn dịch của mệnh đề tương ứng; [c] được neo tại cụm kiến trúc cần chú giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:32Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng thế đối lập giữa người tin (τοῖς πιστεύουσιν) và người không tin (ἀπιστοῦσιν), cũng như lời trích dẫn về hòn đá bị thợ xây bác bỏ. Tuy nhiên, “ấy là vinh dự” chưa cho thấy rõ quan hệ cú pháp ὑμῖν ... ἡ τιμή (“vinh dự thuộc về anh em”), và “đầu góc nhà” thêm “nhà” không có trong cụm κεφαλὴν γωνίας.
  naturalness: 'Cần chỉnh nhẹ để văn xuôi tiếng Việt hiện đại rõ và tự nhiên hơn: “vinh dự thuộc về...” diễn đạt mạch lạc hơn; “còn đối với những người không tin thì:” dẫn lời trích dẫn tự nhiên; “hòn đá đầu góc” tránh cụm “đầu góc nhà” hơi gượng và tránh thêm chi tiết không có trong nguyên văn.'
  terminology: Giữ “vinh dự” cho τιμή theo cách hiểu chính của bản dịch đối chiếu, đồng thời bảo lưu cách hiểu “sự quý báu” trong chú thích. Giữ “những người không tin,” “hòn đá,” và “thợ xây.” “Hòn đá đầu góc” giữ hình ảnh Hy Lạp mà không quyết định trước là “đá góc nhà” hay “đá góc chính.”
  issues:
  - severity: medium
    issue: Cụm “ấy là vinh dự” không diễn đạt rõ quan hệ của ὑμῖν ... ἡ τιμή.
    rationale: Trong tiếng Việt, “ấy” dễ được hiểu là chỉ hòn đá, còn “vinh dự” không được liên kết rõ với người tin. “Vinh dự thuộc về anh em...” phản ánh trực tiếp hơn cấu trúc dative của nguyên văn mà không loại bỏ cách hiểu thay thế trong chú thích.
  - severity: low
    issue: “đầu góc nhà” thêm từ “nhà” và chưa thật tự nhiên.
    rationale: κεφαλὴν γωνίας chỉ nói “đầu góc”; ngữ cảnh xây dựng đã đủ rõ. “Hòn đá đầu góc” tự nhiên hơn trong văn phong Kinh Thánh hiện đại và tránh thêm một thành tố không hiện diện trong cụm từ Hy Lạp.
  revised_text: 'Vậy, vinh dự thuộc về anh em là những người tin; còn đối với những người không tin thì: “Hòn đá mà thợ xây đã loại bỏ, chính hòn đá ấy đã trở thành hòn đá đầu góc[c].”'
