id: 1PE.2.13
reference: 1 Peter 2:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: vi
  text: Vì Chúa, hãy thuận phục mọi thể chế của loài người[a], dù là vua, là người ở địa vị cao nhất[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn là “mọi sự sáng tạo của loài người”; theo cách dịch truyền thống: “mọi quy định của con người”. Trong ngữ cảnh này, cụm từ chỉ các thể chế hoặc thẩm quyền dân sự của con người, như những lời nhắc đến vua và các quan ở phần tiếp theo cho thấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “như người đứng trên” hay “như người có thẩm quyền cao nhất”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: hãy thuận phục
  rationale: Mệnh lệnh diễn tả việc tự đặt mình dưới thẩm quyền; “hãy thuận phục” tự nhiên, trang trọng và giữ được lực khuyên truyền của nguyên văn.
- source_word: πάσῃ
  choice: mọi
  rationale: 'Đi với danh từ số ít, từ này có nghĩa phân phối: mọi thể chế thuộc loại đang được nói đến.'
- source_word: ἀνθρωπίνῃ κτίσει
  choice: mọi thể chế của loài người
  rationale: Dù κτίσις thường có nghĩa là “sự sáng tạo” hoặc “tạo vật”, ngữ cảnh kế tiếp nêu vua và các quan, cho thấy cụm từ ở đây chỉ những cơ cấu hoặc thiết chế dân sự trong xã hội loài người. Cách dịch này không biến cụm từ thành mệnh lệnh thuận phục mọi cá nhân.
- source_word: διὰ τὸν κύριον
  choice: Vì Chúa
  rationale: διά với đối cách diễn tả lý do hoặc động cơ; cách dịch ngắn gọn này cho thấy sự thuận phục được thực hiện vì mối liên hệ với Chúa.
- source_word: κύριον
  choice: Chúa
  rationale: Giữ nguyên tước hiệu của bản Hy Lạp, không xác định thêm là Đức Chúa Trời hay Chúa Giê-su khi câu này không nói rõ.
- source_word: εἴτε βασιλεῖ
  choice: dù là vua
  rationale: εἴτε mở đầu cấu trúc lựa chọn được tiếp tục ở câu sau; βασιλεύς được dịch theo nghĩa rộng là “vua”, thay vì thu hẹp theo bối cảnh lịch sử thành “hoàng đế”.
- source_word: ὡς ὑπερέχοντι
  choice: vì vua là người có địa vị cao hơn
  rationale: Phân từ chỉ người đứng trên hoặc có thẩm quyền cao hơn. Cách dịch này diễn đạt quan hệ chức vị mà không hàm ý nhà vua có quyền tối thượng tuyệt đối.
theological_decisions:
- issue: Bản chất của thẩm quyền dân sự trong ἀνθρωπίνῃ κτίσει
  choice: thể chế của loài người
  alternative: sự sáng tạo của loài người; tạo vật loài người; quy định của con người
  rationale: Các ví dụ về vua và quan ở phần tiếp theo xác định phạm vi dân sự. “Thể chế của loài người” giữ sắc thái xã hội của cụm từ mà không khẳng định quá mức nguồn gốc thần học của các thể chế ấy.
- issue: Đối tượng được gọi là κύριον
  choice: Chúa
  alternative: Chúa Giê-su; Đức Chúa Trời
  rationale: Nguyên văn chỉ dùng tước hiệu “Chúa”; bản dịch giữ sự không xác định này thay vì giải quyết thay cho người đọc.
- issue: Phạm vi địa vị của nhà vua trong ὑπερέχοντι
  choice: người có địa vị cao hơn
  alternative: đấng tối cao; người nắm quyền
  rationale: Cách dịch bảo toàn ý nghĩa về địa vị cao trong trật tự dân sự mà không gán cho vua quyền tối thượng theo nghĩa tuyệt đối hoặc thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đưa “Vì Chúa” lên đầu câu để diễn đạt tự nhiên động cơ của mệnh lệnh. Giữ dấu phẩy cuối câu vì cấu trúc εἴτε còn tiếp tục sang câu 14.
