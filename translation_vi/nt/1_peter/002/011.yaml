reference: 1 Peter 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: vi
  text: Anh chị em yêu dấu, tôi khuyên anh chị em, như những người xa xứ và khách tạm trú[a], hãy tránh những ham muốn xác thịt[b]; chúng chiến đấu chống lại linh hồn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người xa quê và người tạm trú.” Hai từ đi đôi nhấn mạnh thân phận sống ở nơi không phải quê hương và không thuộc trọn vẹn về đó.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những ham muốn thuộc về xác thịt.” Trong ngữ cảnh này, cụm từ không chỉ giới hạn ở ham muốn tình dục; có thể dịch diễn ý là “những ham muốn tội lỗi.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp cũng có thể chỉ “sự sống” hoặc “bản thân con người”; “linh hồn” ở đây không nhất thiết hàm ý một định nghĩa kỹ thuật về cấu tạo con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Cách xưng hô số nhiều vừa thể hiện tình cảm trìu mến, vừa giữ được liên hệ với ý niệm yêu thương; cách nói này tự nhiên trong văn phong Cơ Đốc tiếng Việt.
- source_word: παρακαλῶ
  choice: tôi khuyên
  rationale: Trong ngữ cảnh này, động từ diễn tả lời khuyên nhủ tha thiết. “Tôi khuyên” rõ ràng, tự nhiên và không quá chuyên biệt như “tôi khuyến cáo” hay quá trang trọng như “tôi khuyên giục”.
- source_word: ὡς
  choice: như
  rationale: Giữ trực tiếp cách tác giả nhìn nhận và kêu gọi độc giả hành động trong tư cách ấy, không thêm sắc thái nguyên nhân như “vì anh chị em là”.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: những ngoại kiều và người tạm trú
  rationale: Hai từ được giữ thành một cặp, nhấn mạnh thân phận không thuộc trọn vẹn về nơi đang sống. “Ngoại kiều” diễn tả người cư trú ngoài quê hương, còn “người tạm trú” làm nổi bật tính tạm thời.
- source_word: ἀπέχεσθαι
  choice: hãy tránh xa
  rationale: Diễn tả lời kêu gọi tiếp tục tự giữ mình khỏi những ham muốn ấy; tự nhiên và dễ hiểu hơn cách nói mang tính hành chính “kiêng cữ”.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: những ham muốn xác thịt
  rationale: Giữ hình ảnh “xác thịt” của nguyên ngữ và nghĩa tiêu cực của các ham muốn trong ngữ cảnh, nhưng không thu hẹp chúng vào dục vọng tình dục hoặc diễn giải thẳng thành “ham muốn tội lỗi”.
- source_word: αἵτινες
  choice: chúng
  rationale: Đại từ nối lại rõ ràng với “những ham muốn xác thịt” và dẫn vào lời mô tả về đặc tính thù nghịch của chúng.
- source_word: στρατεύονται
  choice: giao chiến
  rationale: Giữ nguyên hình ảnh quân sự mạnh mẽ của động từ, diễn tả hoạt động thù nghịch liên tục.
- source_word: κατὰ τῆς ψυχῆς
  choice: chống lại linh hồn
  rationale: “Linh hồn” bảo tồn sức nặng nhân học và thần học của ψυχή mà không tự ý thêm đại từ sở hữu “của anh chị em” vốn không có trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của σαρκικῶν trong ngữ cảnh đạo đức
  choice: xác thịt
  alternative: thuộc xác thịt; tội lỗi
  rationale: “Xác thịt” giữ mối liên hệ từ vựng với σάρξ và sự căng thẳng thần học của hình ảnh nguồn, thay vì giải nghĩa hoàn toàn thành “tội lỗi” hoặc thành một “bản tính” được xác định theo hệ phái.
- issue: Ý nghĩa của ψυχή
  choice: linh hồn
  alternative: sự sống; bản thân con người
  rationale: “Linh hồn” giữ cách diễn đạt truyền thống và chiều sâu của nguyên ngữ, nhưng bản dịch không khẳng định một mô hình phân chia thân thể–linh hồn vượt quá điều câu văn nói.
- issue: Thân phận được diễn tả bởi παροίκους καὶ παρεπιδήμους
  choice: ngoại kiều và người tạm trú
  alternative: người xa quê và khách tạm trú; khách lạ và kiều dân
  rationale: Giữ cả hai danh xưng và ý niệm độc giả không hoàn toàn thuộc về môi trường hiện tại, nhưng không xác định dứt khoát rằng các từ này chỉ nói về địa vị xã hội hoặc chỉ nói về địa vị thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. “Anh chị em” làm rõ số nhiều trong lời xưng hô và lời khuyên. Bản dịch giữ hình ảnh quân sự “giao chiến,” phép ẩn dụ “xác thịt,” cùng sự mơ hồ có chủ ý của ψυχή; các khả năng dịch đáng kể được nêu trong chú thích.
