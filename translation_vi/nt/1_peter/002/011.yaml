  to: Anh chị em yêu dấu, tôi khuyên anh chị em, như những người xa xứ và khách tạm trú[a], hãy tránh những ham muốn xác thịt[b]; chúng chiến đấu chống lại linh hồn[c].
  rationale: 'Bản sửa chỉ điều chỉnh các điểm về tính tự nhiên và độ chính xác sắc thái: dùng “người xa xứ” thay cho thuật ngữ hành chính “ngoại kiều,” dùng “tránh” cho ý kiêng tránh của ἀπέχεσθαι, và dùng “chiến đấu chống lại” để diễn đạt tự nhiên hình ảnh στρατεύονται. Các đại từ, số nhiều, hình ảnh “xác thịt,” và sự mở nghĩa của ψυχή đều được giữ nguyên.'
