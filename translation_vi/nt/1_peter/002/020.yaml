    rationale: τοῦτο χάρις παρὰ θεῷ trong câu này nói rằng sự chịu đựng khi làm điều tốt và chịu khổ là điều được Đức Chúa Trời chấp nhận/đoái nhận. Dịch chính là “điều đó đẹp lòng Đức Chúa Trời” chuyển tải nghĩa này tự nhiên; chú thích có thể bảo lưu cách dịch sát từ “ân huệ nơi Đức Chúa Trời.”
