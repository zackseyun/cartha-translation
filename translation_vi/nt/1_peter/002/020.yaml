revisions:
- from: Vì nếu anh chị em phạm tội và bị đánh mà vẫn chịu đựng, thì có gì đáng khen? Nhưng nếu anh chị em làm điều lành và chịu khổ mà vẫn chịu đựng, thì đó là ân huệ trước mặt Đức Chúa Trời.[a]
  to: Vì nếu anh chị em phạm tội và bị đánh mà vẫn chịu đựng, thì có gì đáng khen? Nhưng nếu anh chị em làm điều lành và chịu khổ mà vẫn chịu đựng, thì điều đó đẹp lòng Đức Chúa Trời.[a]
  rationale: Sửa mệnh đề kết để phản ánh nghĩa ngữ cảnh của χάρις παρὰ θεῷ một cách tự nhiên trong tiếng Việt, không biến câu thành khẳng định rằng sự chịu khổ tự nó là một ân huệ ban cho người chịu khổ. Chú thích bảo lưu lựa chọn sát từ “ân huệ” và các cách diễn đạt về sự chấp nhận của Đức Chúa Trời, nhờ đó không áp đặt một cách giải thích thần học hẹp. Các phần còn lại được giữ nguyên vì trung thành với nguyên văn và có văn phong phù hợp.
