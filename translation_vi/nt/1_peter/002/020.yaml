id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: vi
  text: Vì nếu anh chị em phạm tội và bị đánh mà vẫn chịu đựng, thì có gì đáng khen? Nhưng nếu anh chị em làm điều lành và chịu khổ mà vẫn chịu đựng, thì điều đó đẹp lòng Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đó là ân huệ nơi Đức Chúa Trời”; cũng có thể dịch: “điều ấy được Đức Chúa Trời đoái nhận” hoặc “điều ấy đáng khen trước mặt Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: đáng khen
  rationale: Trong câu hỏi tu từ này, từ này chỉ điều đáng được khen hay được ghi nhận, chứ không phải danh tiếng hoặc vinh quang nói chung.
- source_word: ἁμαρτάνοντες
  choice: phạm tội
  rationale: Giữ rõ sức nặng luân lý và thần học của động từ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: κολαφιζόμενοι
  choice: bị đánh
  rationale: Truyền đạt rõ sự hành hung thể xác mà động từ này chỉ đến, không dùng lối nói cổ.
- source_word: ὑπομενεῖτε
  choice: vẫn chịu đựng
  rationale: Diễn tả sự bền lòng dưới gian khổ; lặp lại cùng một cách dịch ở hai vế để giữ cấu trúc nhấn mạnh của nguyên văn.
- source_word: ἀγαθοποιοῦντες
  choice: làm điều lành
  rationale: Cách nói tự nhiên, trang trọng vừa phải, chỉ hành động đúng đắn và tốt lành.
- source_word: πάσχοντες
  choice: chịu khổ
  rationale: Giữ nghĩa rộng của động từ thay vì thu hẹp thành một loại ngược đãi cụ thể.
- source_word: χάρις
  choice: ân huệ
  rationale: Giữ mối liên hệ với trường nghĩa ân sủng/ân huệ nhưng trong ngữ cảnh vẫn có thể chỉ sự chấp thuận hay điều đẹp lòng Đức Chúa Trời.
- source_word: παρὰ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt sự đánh giá trong hiện diện và theo quan điểm của Đức Chúa Trời, đồng thời bám sát quan hệ từ của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của χάρις trong mệnh đề kết
  choice: Dịch là “ân huệ trước mặt Đức Chúa Trời” và chú thích nghĩa theo ngữ cảnh.
  alternative: “điều ấy được Đức Chúa Trời đoái nhận” hoặc “điều ấy đáng khen trước mặt Đức Chúa Trời”
  rationale: χάρις có thể gợi nghĩa ân huệ/ân sủng, nhưng trong ngữ cảnh cũng có thể nói đến sự chấp thuận của Đức Chúa Trời. Bản chính giữ độ mở từ vựng, còn chú thích nêu các cách hiểu tự nhiên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng độc giả; giữ phép đối xứng giữa hai vế và tránh giải quyết dứt khoát sắc thái đa nghĩa của χάρις.
