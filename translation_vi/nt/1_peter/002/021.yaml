revisions:
- from: Vì anh em đã được kêu gọi vào chính điều đó, bởi Đấng Mê-si-a cũng đã chịu khổ vì anh em, để lại cho anh em một khuôn mẫu[a], hầu anh em noi theo dấu chân Ngài.
  to: Vì anh em đã được kêu gọi cho điều này, bởi lẽ Đấng Mê-si-a cũng đã chịu khổ vì anh em, để lại cho anh em một khuôn mẫu[a] để anh em noi theo dấu chân Ngài.
  rationale: Bản sửa chỉ điều chỉnh cách diễn đạt tiếng Việt và độ rõ của chú thích. Các quan hệ ngữ pháp và ý nghĩa của nguyên văn—đặc biệt mục đích của lời kêu gọi, nghĩa rộng của «vì anh em», và ẩn dụ về mẫu chữ/dấu chân—được giữ nguyên.
