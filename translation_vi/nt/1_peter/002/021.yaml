id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: vi
  text: Vì anh em đã được kêu gọi cho điều này, bởi lẽ Đấng Mê-si-a cũng đã chịu khổ vì anh em, để lại cho anh em một khuôn mẫu[a] để anh em noi theo dấu chân Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mẫu để noi theo” hoặc “nét chữ mẫu”; từ Hy Lạp chỉ một mẫu chữ đặt trước người học để họ đồ theo.
    reason: Giữ sắc thái sư phạm cụ thể của ὑπογραμμός mà “khuôn mẫu” trong chính văn chưa truyền đạt đầy đủ.
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: vào chính điều đó
  rationale: Giữ hướng quy chiếu về việc chịu khổ bất công ở câu trước mà không diễn giải cụ thể hơn nguyên văn; “chính” làm nổi bật τοῦτο.
- source_word: ἐκλήθητε
  choice: anh em đã được kêu gọi
  rationale: Dạng bị động được giữ lại, vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa không xác định quá mức tác nhân hay một hệ thống thần học về sự kêu gọi.
- source_word: ὅτι
  choice: bởi
  rationale: Diễn đạt quan hệ giải thích hoặc nguyên nhân một cách gọn và trang trọng.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Dịch tước hiệu chỉ Đấng được xức dầu, thay vì dùng một dạng dễ bị hiểu như tên riêng.
- source_word: ἔπαθεν
  choice: đã chịu khổ
  rationale: Phản ánh trực tiếp động từ πάσχω, không tự ý thêm sự chết hay cách thức chịu khổ.
- source_word: ὑπὲρ ὑμῶν
  choice: vì anh em
  rationale: Giữ phạm vi nghĩa vì lợi ích hoặc thay mặt, đồng thời không buộc câu này vào một cách giải thích chuộc tội hẹp hơn.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: để lại cho anh em
  rationale: Giữ quan hệ của phân từ với Đấng Mê-si-a và vai trò tân ngữ gián tiếp của ὑμῖν.
- source_word: ὑπογραμμὸν
  choice: một khuôn mẫu
  rationale: “Khuôn mẫu” vừa diễn đạt một mẫu để noi theo vừa giữ được phần nào hình ảnh sư phạm về nét mẫu cho người học đồ lại.
- source_word: ἵνα
  choice: hầu
  rationale: Đánh dấu mục đích; cách dùng trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐπακολουθήσητε
  choice: anh em noi theo
  rationale: Diễn đạt hành động đi theo sát và làm theo, phù hợp với hình ảnh dấu chân tiếp theo.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: dấu chân Ngài
  rationale: Giữ nguyên ẩn dụ về việc bước theo lối đi và cách sống của Đấng Mê-si-a.
theological_decisions:
- issue: Sắc thái của ὑπὲρ ὑμῶν trong sự chịu khổ của Đấng Mê-si-a
  choice: Dịch là “vì anh em”, giữ nghĩa rộng về lợi ích và đại diện
  alternative: “thay cho anh em” hoặc “vì lợi ích của anh em”
  rationale: Ngữ cảnh nhấn mạnh cả sự chịu khổ vì người đọc lẫn gương chịu khổ để họ noi theo. “Vì anh em” bảo toàn chiều sâu thần học có thể có mà không thu hẹp câu này thành một công thức thay thế không được nói rõ tại đây.
- issue: Tính chất của sự kêu gọi trong ἐκλήθητε
  choice: Giữ dạng “đã được kêu gọi” mà không nêu tác nhân
  alternative: “Đức Chúa Trời đã kêu gọi anh em”
  rationale: Dạng bị động trong nguyên văn có thể ngầm chỉ Đức Chúa Trời, nhưng câu không nêu tác nhân; bản dịch không bổ sung điều nguyên văn để ngỏ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho số nhiều, “Đấng Mê-si-a” cho tước hiệu Χριστός, và viết “Ngài” theo lối tôn kính quen thuộc. Cấu trúc câu bám sát lập luận nguyên văn nhưng tránh lối dịch quá cứng.
