  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: vi
  text: 'Vì đây là điều đáng khen[a]: nếu một người vì ý thức về Đức Chúa Trời[b] mà chịu đựng những nỗi đau khi phải chịu khổ một cách bất công.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được dịch là “ân huệ”, “điều đáng khen” hoặc “điều được chấp nhận”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì luôn nghĩ đến Đức Chúa Trời” hoặc “vì lương tâm hướng về Đức Chúa Trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: điều đáng quý
  rationale: 'Trong câu này, χάρις mang sắc thái đánh giá: một điều đáng trân trọng, đáng ghi nhận hoặc được quý chuộng. “Điều đáng quý” diễn đạt tự nhiên trong tiếng Việt mà không tự ý thêm “trước mặt Đức Chúa Trời”; chú thích giữ lại liên hệ với nghĩa “ân huệ/ân điển” của từ Hy Lạp.'
- source_word: διὰ συνείδησιν θεοῦ
  choice: vì ý thức về Đức Chúa Trời
  rationale: Cụm từ cô đọng này có thể chỉ sự nhận biết, luôn nghĩ đến Đức Chúa Trời, hoặc lương tâm hướng về Ngài. Cách dịch chính giữ sắc thái nhận thức và quan hệ hướng đến Đức Chúa Trời mà không thu hẹp nghĩa chỉ còn lương tâm đạo đức.
- source_word: ὑποφέρει
  choice: chịu đựng
  rationale: Động từ diễn tả việc kiên trì gánh chịu hoàn cảnh đau đớn; “chịu đựng” là cách nói hiện đại, rõ nghĩa và phù hợp với lời khuyên trong ngữ cảnh.
- source_word: λύπας
  choice: những nỗi đau
  rationale: Danh từ số nhiều bao quát đau buồn, khổ sở và phiền muộn. “Những nỗi đau” tự nhiên hơn “những nỗi buồn” trong ngữ cảnh bị đối xử bất công.
- source_word: πάσχων ἀδίκως
  choice: khi phải chịu khổ một cách bất công
  rationale: 'Giữ rõ sắc thái hoàn cảnh/cách thức của phân từ: người ấy đang chịu khổ mà không đáng phải chịu như vậy.'
- source_word: τις
  choice: một người
  rationale: Đại từ bất định số ít được dịch theo nghĩa bao quát, không thêm giới tính cho đối tượng.
- source_word: τοῦτο γὰρ
  choice: Vì đây
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “đây” hướng tới tình huống được nêu trong mệnh đề điều kiện tiếp theo.
theological_decisions:
- issue: Ý nghĩa của χάρις trong văn cảnh
  choice: Dịch theo nghĩa đánh giá là “điều đáng quý”, đồng thời chú thích nghĩa sát chữ.
  alternative: ân huệ; điều đáng khen; điều được đẹp lòng
  rationale: Dịch thẳng là “ân điển” trong tiếng Việt hiện đại dễ khiến người đọc hiểu riêng theo nghĩa ân điển cứu rỗi, trong khi văn cảnh nhấn mạnh tính đáng quý/đáng ghi nhận của việc chịu đựng bất công. Không thêm “trước mặt Đức Chúa Trời” vì cụm ấy không được nói rõ trong câu này.
- issue: Ý nghĩa của συνείδησις θεοῦ
  choice: ý thức về Đức Chúa Trời
  alternative: luôn nghĩ đến Đức Chúa Trời; vì lương tâm hướng về Đức Chúa Trời
  rationale: Cách dịch chính bảo tồn độ mở giữa ý thức nhận biết Đức Chúa Trời và lương tâm hướng về Ngài; chú thích nêu các cách hiểu tự nhiên khác mà không quyết định thay cho nguyên văn.
- issue: Quan hệ của cụm chỉ nguyên nhân
  choice: Dùng cấu trúc “vì… mà chịu đựng” để nối động cơ hướng về Đức Chúa Trời với hành động chịu đựng.
  alternative: Đặt “vì ý thức về Đức Chúa Trời” ở cuối câu
  rationale: Trật tự này phản ánh quan hệ trong tiếng Hy Lạp và tránh khiến người đọc hiểu rằng ý thức về Đức Chúa Trời là nguyên nhân khiến người ấy bị chịu khổ bất công.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “vì… mà…” làm rõ động cơ của sự chịu đựng. Câu giữ lại sự lặp ý giữa “chịu đựng” và “chịu khổ” vì nguyên văn phân biệt hành động bền lòng gánh chịu với hoàn cảnh đang phải chịu bất công.
