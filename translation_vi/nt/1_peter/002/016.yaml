source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: vi
  text: Hãy sống như người tự do, không lấy sự tự do làm vỏ bọc cho điều ác, nhưng như những nô lệ của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những tôi tớ của Đức Chúa Trời.” Từ Hy Lạp δοῦλοι chỉ những người thuộc quyền một chủ; “nô lệ” giữ rõ hơn sự tương phản mạnh với “người tự do.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: những người tự do
  rationale: Diễn đạt tự nhiên tính từ số nhiều chỉ toàn thể người nghe, giữ ý nghĩa về địa vị tự do mà không giới hạn giới tính.
- source_word: ἐπικάλυμμα
  choice: bình phong che đậy
  rationale: Giữ hình ảnh một vật che phủ, đồng thời truyền đạt rõ ý dùng tự do để giấu hoặc biện hộ cho hành vi xấu.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: dùng sự tự do làm
  rationale: Chuyển kết cấu phân từ theo cách tự nhiên trong tiếng Việt, thể hiện công dụng của sự tự do như một phương tiện che đậy.
- source_word: κακίας
  choice: điều ác
  rationale: κακία ở đây chỉ cái xấu về đạo đức theo nghĩa rộng; “điều ác” rõ ràng hơn và không thu hẹp thành riêng lòng hiểm độc.
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Giữ lực mạnh của từ Hy Lạp và nghịch lý có chủ ý giữa địa vị “tự do” với việc hoàn toàn thuộc về Đức Chúa Trời.
- source_word: θεοῦ δοῦλοι
  choice: những nô lệ của Đức Chúa Trời
  rationale: Diễn đạt quan hệ thuộc về trong sở hữu cách và bảo toàn sự đối lập tu từ với “những người tự do”.
theological_decisions:
- issue: Cách gọi căn tính của tín hữu bằng δοῦλοι
  choice: những nô lệ của Đức Chúa Trời
  alternative: những tôi tớ của Đức Chúa Trời
  rationale: '“Nô lệ” không làm nhẹ đi nghịch lý thần học của câu: người tin được tự do nhưng đồng thời hoàn toàn thuộc về Đức Chúa Trời. Chú thích ghi nhận cách dịch “tôi tớ” tự nhiên và ít gay gắt hơn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bổ sung “Hãy sống” để làm rõ lực khuyên bảo của cụm ὡς trong mạch văn, đồng thời lặp lại ở vế cuối để câu tiếng Việt cân đối. “Bình phong che đậy” vừa tự nhiên vừa giữ ẩn dụ của nguyên văn.
