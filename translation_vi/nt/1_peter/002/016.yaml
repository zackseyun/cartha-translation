  to: Hãy sống như người tự do, không lấy sự tự do làm vỏ bọc cho điều ác, nhưng như những nô lệ của Đức Chúa Trời.[a]
  rationale: Thay “bình phong che đậy” bằng “vỏ bọc cho” để diễn đạt tự nhiên hơn hình ảnh ἐπικάλυμμα mà vẫn giữ ý không được dùng tự do để dung túng hoặc che giấu điều ác. Bỏ sự lặp lại không cần thiết của “hãy sống” ở vế cuối. Các thuật ngữ then chốt và chú thích được giữ nguyên về nội dung.
