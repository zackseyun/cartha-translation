  terminology: “Phạm tội” là tương đương thành ngữ chính xác của ἁμαρτίαν ... ἐποίησεν. “Sự dối trá” là cách dịch trung tính, hiện đại cho δόλος; không áp đặt sắc thái hẹp như “mưu mô” hoặc “lời dối trá”. “Ngài” phù hợp văn cảnh chỉ Đấng Christ.
