  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: vi
  text: Ngài không hề phạm tội,[a] trong miệng Ngài cũng không tìm thấy sự dối trá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách diễn đạt này gợi lại Ê-sai 53:9.
    reason: cross_reference
  - marker: b
    text: Cũng có thể dịch là “sự gian dối”, “sự lừa lọc” hoặc “mưu mô”. Từ Hy Lạp chỉ sự dối trá, lừa đảo hay phản trắc.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ngài
  rationale: Đại từ quan hệ chỉ về Đấng Christ ở câu trước. Tiếng Việt cần một chủ ngữ rõ ràng; “Ngài” tự nhiên, trang trọng và không thêm ý nhấn mạnh.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: không hề phạm tội
  rationale: Với ἁμαρτίαν, ποιέω mang nghĩa thành ngữ là “phạm tội”. “Không hề” diễn đạt rõ phủ định tuyệt đối, còn “tội” giữ dạng số ít như một phạm trù.
- source_word: οὐδὲ
  choice: cũng không
  rationale: Nối mệnh đề phủ định thứ hai một cách tự nhiên trong tiếng Việt và giữ quan hệ phối hợp của nguyên văn.
- source_word: εὑρέθη
  choice: không tìm thấy
  rationale: Giữ ý nghĩa bị động/không xác định tác nhân của động từ Hy Lạp, đồng thời phù hợp cú pháp tiếng Việt tự nhiên.
- source_word: δόλος
  choice: lời dối trá
  rationale: δόλος chỉ sự gian dối, lừa lọc hoặc xảo trá. Thêm “lời” do cụm “trong miệng” làm rõ biểu hiện bằng lời nói mà không đổi trọng tâm của câu.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: trong miệng Ngài
  rationale: Bám sát hình ảnh thân thể của nguyên văn và duy trì âm hưởng Ê-sai 53:9; tự nhiên hơn cách chuyển thành một lời giải thích như “Ngài không nói dối”.
theological_decisions:
- issue: Âm hưởng liên văn bản với Ê-sai 53:9 về sự vô tội và không gian dối của Đấng Christ
  choice: 'Giữ cách diễn đạt gần nguyên văn: “không hề phạm tội” và “trong miệng Ngài cũng không tìm thấy lời dối trá”.'
  alternative: 'Diễn ý: “Ngài chưa bao giờ phạm tội hay nói lời dối trá.”'
  rationale: Cách chọn giữ được sức nặng thần học và hình ảnh của lời trích dẫn/ám chỉ Ê-sai, nhưng không mở rộng hoặc giải thích quá điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đấng Christ; giữ hình ảnh “trong miệng” nhằm bảo toàn âm hưởng Kinh Thánh Hê-bơ-rơ. Các dấu chú thích đều xuất hiện trong chính văn.
