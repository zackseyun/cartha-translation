  terminology: «Kính sợ Đức Chúa Trời» phù hợp với φοβεῖσθε và giữ được sắc thái mạnh hơn τιμάω. «Tôn trọng» được lặp lại nhất quán cho cả hai lần τιμάω. «Đức Chúa Trời» là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
