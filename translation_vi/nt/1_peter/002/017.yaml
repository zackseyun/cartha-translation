id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: vi
  text: Hãy tôn trọng mọi người; yêu thương cộng đồng anh chị em trong đức tin[a]; kính sợ Đức Chúa Trời; tôn trọng vua[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cộng đồng anh chị em trong đức tin” chỉ toàn thể những người tin cùng một đức tin.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có nghĩa đen là “vua”; trong bối cảnh La Mã thời Phi-e-rơ, từ này rất có thể chỉ hoàng đế.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: mọi người
  rationale: Đại từ hóa số nhiều, chỉ toàn thể mọi người; cách dịch này tự nhiên và giữ nguyên phạm vi phổ quát.
- source_word: τιμήσατε / τιμᾶτε
  choice: tôn trọng
  rationale: Giữ cùng một cách dịch cho động từ τιμάω ở đầu và cuối câu, qua đó bảo toàn phép lặp có chủ ý trong tiếng Hy Lạp. “Tôn trọng” là cách nói hiện đại, tự nhiên, phù hợp cả với mọi người lẫn nhà vua.
- source_word: ἀδελφότητα
  choice: cộng đồng anh chị em cùng đức tin
  rationale: Danh từ này chỉ cộng đồng những người cùng đức tin được nhìn như một gia đình. Cách dịch diễn đạt rõ ý bao gồm cả nam lẫn nữ mà không làm mất sắc thái thân thuộc.
- source_word: ἀγαπᾶτε
  choice: yêu thương
  rationale: Diễn đạt tự nhiên mệnh lệnh ἀγαπάω và phù hợp với ngữ cảnh yêu thương trong cộng đồng.
- source_word: θεὸν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: φοβεῖσθε
  choice: kính sợ
  rationale: Giữ được cả ý sợ và lòng tôn kính hướng về Đức Chúa Trời, không làm nhẹ động từ thành chỉ “kính trọng”.
- source_word: βασιλέα
  choice: vua
  rationale: Đây là nghĩa trực tiếp của βασιλεύς; trong bối cảnh La Mã, đối tượng lịch sử có thể là hoàng đế, nên thông tin ấy được giữ trong chú thích.
theological_decisions:
- issue: Sự phân biệt giữa thái độ phải có đối với Đức Chúa Trời và đối với nhà cầm quyền
  choice: Dịch φοβεῖσθε là “kính sợ” và τιμάω là “tôn trọng”.
  alternative: Dịch φοβεῖσθε là “tôn kính” và τιμάω là “kính trọng”.
  rationale: 'Bản dịch giữ sự phân cấp trong câu: tôn trọng mọi người, yêu thương cộng đồng cùng đức tin, kính sợ Đức Chúa Trời và tôn trọng vua. Như vậy, thái độ dành cho Đức Chúa Trời không bị đồng nhất với thái độ dành cho nhà vua.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng bốn vế song song, ngăn bằng dấu chấm phẩy để phản ánh nhịp mệnh lệnh cô đọng của nguyên văn; lặp lại “tôn trọng” nhằm giữ liên kết từ vựng của τιμάω.
