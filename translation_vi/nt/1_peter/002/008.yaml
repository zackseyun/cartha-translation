  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: vi
  text: 'và: “một hòn đá làm người ta vấp ngã,

    một tảng đá gây vấp ngã.”


    Họ vấp ngã vì không vâng phục lời ấy; họ cũng đã được định cho điều này.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: một hòn đá làm người ta vấp ngã
  rationale: Diễn đạt tự nhiên hình ảnh một hòn đá gây vấp, đồng thời giữ sự tương ứng với lời trích dẫn trong Ê-sai 8:14.
- source_word: πέτρα σκανδάλου
  choice: một tảng đá khiến người ta sa ngã
  rationale: Phân biệt πέτρα với λίθος bằng “tảng đá”; “sa ngã” truyền đạt ý gây sập bẫy hoặc dẫn đến sự sụp đổ mà không thu hẹp thành cảm giác bị xúc phạm.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: vì không vâng phục lời ấy
  rationale: ἀπειθέω mang ý không chịu tin và không vâng phục; “không vâng phục” giữ sắc thái chống nghịch, còn τῷ λόγῳ được hiểu là đối tượng của sự bất phục.
- source_word: εἰς ὃ
  choice: cho điều này
  rationale: Giữ đại từ quan hệ trung tính và sự mơ hồ thật của câu về điều mà họ đã được định đến.
- source_word: ἐτέθησαν
  choice: đã được định
  rationale: Thể bị động của τίθημι ở đây có nghĩa được đặt hoặc được chỉ định cho một kết quả; “được định” tự nhiên trong tiếng Việt mà không tự ý xác định chủ thể ngầm.
theological_decisions:
- issue: Đối tượng của sự tiền định trong εἰς ὃ καὶ ἐτέθησαν
  choice: họ cũng đã được định cho điều này
  alternative: họ đã được định để không vâng phục / để vấp ngã
  rationale: '“Điều này” bảo tồn phạm vi quy chiếu không hoàn toàn xác định của ὃ: có thể chỉ sự vấp ngã vừa nói hoặc toàn bộ tình trạng không vâng phục dẫn đến vấp ngã. Bản dịch không tự ý giải quyết căng thẳng thần học.'
- issue: Quan hệ giữa không vâng phục và vấp ngã
  choice: Họ vấp ngã vì không vâng phục lời ấy
  alternative: Họ vấp ngã nơi lời ấy, vì không tin
  rationale: Cấu trúc Hy Lạp đặt τῷ λόγῳ với ἀπειθοῦντες một cách tự nhiên, nên bản dịch thể hiện việc không vâng phục lời là nguyên nhân của sự vấp ngã, đồng thời thừa nhận rằng cách gắn cú pháp khác vẫn có thể được bàn luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp “hòn đá/tảng đá” và “vấp ngã/sa ngã” để giữ phép song song thi ca nhưng tránh lặp cứng. Không thêm chủ thể thần học cho thể bị động “được định” và không giải thích quá mức “điều này”.
