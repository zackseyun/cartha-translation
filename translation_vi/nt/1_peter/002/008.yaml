  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc cơ bản: hai hình ảnh trích dẫn, việc họ vấp ngã do không vâng phục lời, và mệnh đề bị động mơ hồ về việc họ được định cho «điều này». Tuy nhiên, «sa ngã» có thể gợi một sự sa sút luân lý hơn là σκάνδαλον, vốn ở đây song hành với πρόσκομμα như một nguyên nhân/cớ gây vấp ngã.'
  naturalness: Câu nhìn chung dễ hiểu và có register trang trọng. Cụm «một tảng đá khiến người ta sa ngã» hơi diễn giải và không giữ được phép song hành trực tiếp giữa hai hình ảnh đá gây vấp. Thay bằng «một tảng đá gây vấp ngã» tự nhiên, sát nghĩa và không áp đặt một sắc thái luân lý.
  terminology: Giữ «hòn đá/tảng đá» là một cách phân biệt hợp lý giữa λίθος và πέτρα. «Không vâng phục lời ấy» diễn đạt tốt ἀπειθοῦντες τῷ λόγῳ. «Được định cho điều này» giữ thể bị động và sự quy chiếu còn mở của εἰς ὃ mà không xác định chủ thể hay hệ thống thần học.
  issues:
  - severity: medium
    issue: «khiến người ta sa ngã» cho πέτρα σκανδάλου
    rationale: σκάνδαλον trong ngữ cảnh này chỉ điều gây vấp ngã/vấp phạm. «Sa ngã» trong tiếng Việt hiện đại thường nghiêng về thất bại hoặc sa sút luân lý; sắc thái đó không được câu Hy Lạp xác định. Dùng «gây vấp ngã» bảo toàn nghĩa rộng và phép song hành của nguyên ngữ.
