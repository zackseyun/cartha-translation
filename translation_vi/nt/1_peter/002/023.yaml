    rationale: παρεδίδου không có tân ngữ được nêu rõ. Ngữ cảnh có thể hàm ý chính mình, hoàn cảnh, hay vụ việc, nhưng bản dịch tối ưu-tương-đương nên không quyết định điều đó trong chính văn.
  - severity: low
