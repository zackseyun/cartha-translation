  source_fidelity: 'Bản nháp truyền đạt đúng các đối ý chính: bị lăng mạ nhưng không lăng mạ đáp lại, chịu khổ nhưng không đe dọa, và συνεχ tục phó thác cho Đấng xét xử công minh. Tuy nhiên, «phó mình» xác định tân ngữ phản thân mà tiếng Hy Lạp không nêu; dù cách hiểu này có thể hợp ngữ cảnh, chính văn nên giữ tân ngữ hàm ẩn.'
