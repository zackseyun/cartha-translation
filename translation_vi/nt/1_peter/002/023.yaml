revisions:
- from: Ngài[a] bị lăng mạ mà không lăng mạ lại; chịu khổ mà không đe dọa, nhưng cứ phó mình cho Đấng xét xử công minh.[b]
  to: Khi bị lăng mạ, Ngài[a] không lăng mạ lại; khi chịu khổ, Ngài không đe dọa, nhưng cứ phó thác cho Đấng xét xử công minh.[b]
  rationale: Bản sửa giữ các động từ và thế đối lập của nguyên văn, dùng «cứ» để biểu đạt hợp lý sắc thái chưa hoàn thành của παρεδίδου, nhưng không thêm «mình» vào phần chính văn. Hai mệnh đề mở đầu được chuyển thành cấu trúc «Khi…, Ngài…» để phản ánh rõ các phân từ hiện tại và duy trì tính song song. Chú thích b bảo lưu tính mơ hồ về tân ngữ của παρεδίδου mà không áp đặt một cách hiểu thần học hay diễn giải cụ thể.
