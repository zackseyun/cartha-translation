  terminology: «Lăng mạ», «đe dọa», và «Đấng xét xử công minh» đều phù hợp với λοιδορέω, ἀπειλέω, và κρίνειν δικαίως. Giữ «Đấng» là văn phong trang trọng thông dụng và không xác định quá mức danh tính của Đấng xét xử.
