source:
  edition: SBLGNT
  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: vi
  text: Khi bị lăng mạ, Ngài[a] không lăng mạ lại; khi chịu khổ, Ngài không đe dọa, nhưng cứ phó thác cho Đấng xét xử công minh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng đại từ quan hệ “Đấng ấy/người ấy”, nối với Đấng Christ ở câu trước.
    reason: discourse_clarity
  - marker: b
    text: Nguyên văn không nêu rõ điều được phó thác; có thể hiểu là chính Ngài, hoàn cảnh của Ngài, hoặc vụ việc cho Đấng xét xử công minh.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ὃς
  choice: Ngài
  rationale: Đại từ quan hệ nối về Đấng Christ ở câu trước. Tiếng Việt tự nhiên cần nêu lại chủ thể; “Ngài” giữ văn phong trang trọng mà không thêm một danh hiệu không có trong nguyên văn.
- source_word: λοιδορούμενος
  choice: bị lăng mạ
  rationale: Diễn đạt sự xúc phạm bằng lời nói; “lăng mạ” vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh hiện đại.
- source_word: οὐκ ἀντελοιδόρει
  choice: không lăng mạ lại
  rationale: Giữ rõ tính đáp trả của tiền tố ἀντι- và sắc thái hành động liên tục/đặc trưng của thì chưa hoàn thành.
- source_word: πάσχων
  choice: chịu khổ
  rationale: Phân từ hiện tại được đặt song song với mệnh đề trước, mô tả hoàn cảnh Ngài đang chịu đau khổ.
- source_word: οὐκ ἠπείλει
  choice: không đe dọa
  rationale: Chuyển đúng hành vi nói lời đe dọa, không thêm đối tượng hay nội dung lời đe dọa.
- source_word: παρεδίδου
  choice: cứ phó mình
  rationale: “Cứ” thể hiện sắc thái tiếp diễn của thì chưa hoàn thành; “phó mình” truyền đạt việc giao chính mình/sự việc của mình cho Đấng xét xử, đồng thời ghi chú bảo tồn khả năng nguyên văn không có tân ngữ được viết ra.
- source_word: τῷ κρίνοντι δικαίως
  choice: cho Đấng xét xử công minh
  rationale: Giữ cấu trúc mô tả bằng phân từ và trạng từ, không thay bằng một tước hiệu; “công minh” diễn đạt cách xét xử đúng đắn, công chính.
- source_word: δὲ
  choice: nhưng
  rationale: Nêu bật sự tương phản giữa việc không trả đũa và việc tích cực phó mình cho Đấng xét xử.
theological_decisions:
- issue: Đấng được gọi là “Đấng xét xử công minh”
  choice: Giữ cách gọi mô tả, không ghi rõ là Đức Chúa Trời hay Đức Chúa Cha trong chính văn.
  alternative: Dịch rõ thành “Đức Chúa Trời, Đấng xét xử công minh” hoặc hiểu cụ thể là Đức Chúa Cha.
  rationale: Ngữ cảnh hàm ý Đức Chúa Trời, nhưng nguyên văn chỉ dùng cụm “Đấng xét xử công minh”; bản dịch không nên xác định cụ thể hơn điều văn bản nói.
- issue: Tân ngữ của παρεδίδου
  choice: Dùng “phó mình” trong chính văn và chú thích rằng nguyên văn không nêu rõ điều được phó giao.
  alternative: “Phó mọi sự” hoặc “phó vụ việc của mình” cho Đấng xét xử.
  rationale: Động từ Hy Lạp không có tân ngữ được viết ra, nên có thể hiểu Ngài phó chính mình, hoàn cảnh hoặc việc xét xử cho Đức Chúa Trời. “Phó mình” phù hợp ngữ cảnh nhưng cần ghi nhận tính hàm ẩn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế song song được giữ để làm nổi bật việc Đấng Christ không trả đũa. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
