id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: vi
  text: Nhưng anh chị em là dòng giống được tuyển chọn[a], hàng tư tế vương giả, dân tộc thánh, một dân thuộc riêng về Ngài, để anh chị em rao truyền những phẩm chất tuyệt hảo[b] của Đấng đã gọi anh chị em ra khỏi bóng tối, vào ánh sáng kỳ diệu của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giống nòi được tuyển chọn.” Từ Hy Lạp có thể chỉ dòng dõi, giống nòi hoặc một cộng đồng có chung nguồn gốc.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những điều đáng ca ngợi” hoặc “những việc quyền năng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Nhưng anh chị em
  rationale: δὲ tạo thế tương phản với những người không tin ở phần trước, còn đại từ Ὑμεῖς nhấn mạnh đối tượng được nói trực tiếp. “Nhưng anh chị em” tự nhiên trong tiếng Việt và thể hiện cả sự tương phản lẫn lời xưng hô số nhiều.
- source_word: γένος ἐκλεκτόν
  choice: dòng giống được tuyển chọn
  rationale: γένος có thể chỉ dòng dõi, giống nòi hoặc một cộng đồng có chung nguồn gốc. “Dòng giống” giữ được hình ảnh huyết thống tập thể và sự vang vọng của ngôn ngữ giao ước, nhưng không buộc câu vào quan niệm chủng tộc hiện đại.
- source_word: βασίλειον ἱεράτευμα
  choice: hàng tư tế vương giả
  rationale: βασίλειον có sắc thái thuộc về vua hoặc mang địa vị vương giả, còn ἱεράτευμα là tập thể tư tế. Cách dịch này giữ cấu trúc danh ngữ cô đọng của tiếng Hy Lạp và cả hai chiều kích vương quyền cùng chức vụ tư tế.
- source_word: ἔθνος ἅγιον
  choice: dân tộc thánh
  rationale: Cách dịch trực tiếp này giữ nghĩa một cộng đồng được biệt riêng cho Đức Chúa Trời của ἅγιον và ngôn ngữ giao ước của cụm từ.
- source_word: λαὸς εἰς περιποίησιν
  choice: một dân thuộc riêng về Ngài
  rationale: περιποίησις ở đây diễn tả sự sở hữu hay thu nhận đặc biệt. Tiếng Hy Lạp không nêu đại từ sở hữu ngay trong cụm này, nhưng văn cảnh chỉ rõ Đức Chúa Trời là Đấng sở hữu; “thuộc riêng về Ngài” diễn đạt tự nhiên quan hệ ấy mà không thêm ý ‘quý báu’ vốn không minh nhiên.
- source_word: ὅπως
  choice: để
  rationale: ὅπως mở đầu mệnh đề chỉ mục đích. “Để” là cách diễn đạt ngắn gọn, tự nhiên và đúng chức năng trong tiếng Việt.
- source_word: τὰς ἀρετὰς
  choice: những phẩm chất tuyệt hảo
  rationale: ἀρετή có thể chỉ sự ưu việt, đức hạnh hoặc điều đáng ca ngợi. Cụm này giữ trọng tâm vào những điều tuyệt hảo thuộc về Đức Chúa Trời mà không giới hạn từ ngữ chỉ vào việc làm hoặc lời ca ngợi.
- source_word: ἐξαγγείλητε
  choice: anh chị em rao truyền
  rationale: Động từ diễn tả việc công bố rộng rãi; “rao truyền” giữ sắc thái công khai và mạnh hơn “nói ra”.
- source_word: τοῦ ... καλέσαντος
  choice: của Đấng đã gọi
  rationale: Phân từ sở hữu cách nhận diện Đức Chúa Trời qua hành động kêu gọi. “Đấng” là lối quy chiếu trang trọng, tự nhiên, không cần chèn danh xưng không có trong nguyên văn.
- source_word: ἐκ σκότους
  choice: ra khỏi bóng tối
  rationale: ἐκ diễn tả sự chuyển ra khỏi một cõi hay tình trạng; cách dịch giữ nguyên hình ảnh giải thoát khỏi bóng tối.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: vào ánh sáng kỳ diệu của Ngài
  rationale: εἰς đối ứng với ἐκ để diễn tả chuyển động vào một cõi mới, còn θαυμαστός là kỳ diệu, đáng kinh ngạc. Cách diễn đạt trang trọng nhưng thông dụng trong tiếng Việt.
theological_decisions:
- issue: Các danh hiệu căn tính tập thể lấy từ ngôn ngữ giao ước của Cựu Ước
  choice: 'Giữ trực tiếp các danh xưng tập thể: “dòng giống được tuyển chọn”, “hàng tư tế vương giả”, “dân tộc thánh”.'
  alternative: Diễn giải chúng như những hình ảnh trừu tượng để tránh hàm ý về quan hệ giữa hội thánh và Israel.
  rationale: Câu Hy Lạp chủ ý áp dụng ngôn ngữ căn tính giao ước cho cộng đồng độc giả. Bản dịch cần giữ sức nặng liên văn bản này mà không tự quyết định một hệ thống thần học rộng hơn.
- issue: Chủ thể sở hữu được hàm ý trong λαὸς εἰς περιποίησιν
  choice: Diễn đạt rõ bằng “thuộc riêng về Ngài”.
  alternative: Dịch sát hình thức là “một dân để làm sở hữu”.
  rationale: Dù cụm Hy Lạp không có đại từ sở hữu, văn cảnh xác định Đấng gọi họ chính là Đấng họ thuộc về. Việc làm rõ này cần thiết để câu tiếng Việt tự nhiên và không thêm một khẳng định giáo lý ngoài văn bản.
- issue: Phạm vi nghĩa của τὰς ἀρετὰς
  choice: Dùng “những phẩm chất tuyệt hảo” trong chính văn và ghi các khả năng “những điều đáng ca ngợi” hoặc “những việc quyền năng” ở chú thích.
  alternative: Chọn riêng “những lời ca ngợi” hoặc “những việc quyền năng”.
  rationale: Từ Hy Lạp có thể quy chiếu đến phẩm chất đáng ca ngợi và, theo ngữ cảnh, những sự thể hiện quyền năng của Đức Chúa Trời. Chính văn giữ độ rộng, còn chú thích bảo tồn các cách hiểu có cơ sở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều trực tiếp mà không mặc định giới tính; dùng “Ngài” cho quy chiếu thần linh. Nhịp câu giữ chuỗi danh xưng trang trọng của nguyên văn và sự chuyển động đối lập từ bóng tối vào ánh sáng.
