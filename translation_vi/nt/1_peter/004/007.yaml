    issue: “sự cuối cùng của mọi sự” là cách diễn đạt không tự nhiên và chưa rõ nghĩa cho τὸ τέλος.
    rationale: Trong tiếng Việt, “sự cuối cùng” thường chỉ tính từ/danh từ hóa về thứ tự, không rõ nghĩa là sự chấm dứt hay sự hoàn tất. “Sự kết thúc của mọi sự” truyền đạt trực tiếp và chính xác hơn ý cánh chung của nguyên văn.
