id: 1PE.4.7
reference: 1 Peter 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: vi
  text: Nhưng sự kết thúc của mọi sự đã đến gần.[a] Vì vậy, hãy sáng suốt và tỉnh thức để cầu nguyện.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang gần kề.” Động từ Hy Lạp ở thì hoàn thành vừa nói đến việc đã tiến đến gần, vừa nhấn mạnh tình trạng hiện đang gần.'
    reason: lexical_alternative
  - marker: b
    text: “Sáng suốt” nhấn mạnh sự phán đoán lành mạnh và tự chủ; “tỉnh thức” nhấn mạnh sự cảnh giác, minh mẫn. Cả hai cùng hướng đến việc cầu nguyện.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: của mọi sự
  rationale: Dạng sở hữu số nhiều đi với τὸ τέλος tạo thành ý 'sự cuối cùng của mọi sự'; cách dịch này giữ phạm vi bao quát mà không thêm đối tượng cụ thể.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sự chuyển ý nhẹ từ văn cảnh trước, đồng thời giữ sắc thái cấp bách của lời khuyên.
- source_word: τὸ τέλος
  choice: sự cuối cùng
  rationale: Trong văn cảnh cánh chung, từ này chỉ sự kết thúc hơn là kết quả hay mục đích. 'Sự cuối cùng' tự nhiên hơn 'cái kết' trong văn phong Kinh Thánh trang trọng.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thì hoàn thành Hy Lạp diễn tả một chuyển động đã xảy ra và tình trạng gần hiện tại; 'đã đến gần' giữ được cả hai nét nghĩa.
- source_word: σωφρονήσατε
  choice: hãy tỉnh trí
  rationale: Diễn đạt khả năng phán đoán sáng suốt và làm chủ tâm trí; tránh thu hẹp từ này chỉ vào sự kiềm chế hành vi.
- source_word: οὖν
  choice: Vì vậy
  rationale: Nêu rõ lời khuyên sau là hệ quả của việc sự cuối cùng đã đến gần.
- source_word: νήψατε
  choice: tỉnh thức
  rationale: Trong Tân Ước, động từ được dùng theo nghĩa bóng về sự cảnh giác, sáng suốt. Đi cùng 'tỉnh trí', 'tỉnh thức' giữ nét cảnh giác thuộc linh mà không biến câu thành lời cấm rượu.
- source_word: εἰς προσευχάς
  choice: để cầu nguyện
  rationale: εἰς biểu thị mục đích. Tiếng Việt thường diễn đạt tự nhiên bằng động từ 'cầu nguyện'; hình thức số nhiều của danh từ Hy Lạp có thể hàm ý các lần cầu nguyện nhưng không cần gượng ép thể hiện bằng 'những lời cầu nguyện'.
theological_decisions:
- issue: Ý nghĩa cánh chung của 'sự cuối cùng của mọi sự'
  choice: Giữ nguyên như một lời tuyên bố trực tiếp rằng sự cuối cùng đã đến gần, không xác định lịch trình hay hệ thống cánh chung cụ thể.
  alternative: Hiểu τέλος chủ yếu là 'mục đích' của mọi sự, hoặc giảm nhẹ yếu tố cánh chung tương lai.
  rationale: Văn cảnh nối sự gần kề của sự cuối cùng với lời kêu gọi tỉnh trí, tỉnh thức và cầu nguyện. Bản dịch giữ tính cấp bách nhưng không áp đặt quan điểm hệ phái.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ kết cấu suy luận của nguyên văn; dùng 'tỉnh trí và tỉnh thức' để phân biệt hai mệnh lệnh gần nghĩa mà không đưa vào hàm ý kiêng rượu.
