- from: Nhưng sự cuối cùng của mọi sự đã đến gần.[a] Vì vậy, hãy tỉnh trí và tỉnh thức để cầu nguyện.[b]
  to: Nhưng sự kết thúc của mọi sự đã đến gần.[a] Vì vậy, hãy sáng suốt và tỉnh thức để cầu nguyện.[b]
  rationale: Sửa “sự cuối cùng” thành “sự kết thúc” để diễn đạt τὸ τέλος chính xác và tự nhiên hơn. Sửa “tỉnh trí” thành “sáng suốt” cho tiếng Việt hiện đại, đồng thời giữ “tỉnh thức” để bảo toàn nét cảnh giác của νήψατε. Các dấu chú thích vẫn được giữ đúng vị trí và nội dung chú thích được cập nhật theo từ ngữ đã sửa.
