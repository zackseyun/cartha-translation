id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: vi
  text: Vì trước đây anh chị em đã có đủ thời gian để làm theo ý muốn của dân ngoại, mà sống trong những việc phóng túng[a], những dục vọng, những cơn say sưa[b], những cuộc chè chén, những tiệc rượu và những việc thờ thần tượng bị cấm[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những việc buông thả trơ trẽn”; từ Hy Lạp nhấn mạnh sự quá độ không biết xấu hổ.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn dùng dạng số nhiều, có thể hàm ý những lần hoặc những cơn say rượu.
    reason: lexical_form
  - marker: c
    text: 'Cũng có thể dịch: “những việc thờ thần tượng trái với lẽ phải”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Vì thời gian đã qua đủ
  rationale: Giữ ý nghĩa “đủ” của ἀρκετός và chức năng giải thích của γάρ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: ý muốn của dân ngoại
  rationale: βούλημα chỉ ý muốn hoặc chủ ý; trong ngữ cảnh này ἔθνη nói đến những người ngoài dân Do Thái, nên “dân ngoại” phù hợp hơn “các dân tộc”.
- source_word: κατειργάσθαι
  choice: để ... làm theo
  rationale: Động từ chỉ việc thực hiện hoặc hoàn tất điều được nêu; cấu trúc với “thời gian ... đủ để” chuyển tải quan hệ cú pháp rõ ràng và tự nhiên.
- source_word: πεπορευμένους
  choice: khi sống
  rationale: πορεύομαι được dùng theo nghĩa đạo đức là sống hay cư xử; “khi sống” tự nhiên hơn lối dịch sát “khi bước đi” mà vẫn giữ quan hệ với đời sống trước đây.
- source_word: ἐν ἀσελγείαις
  choice: trong những việc phóng túng
  rationale: ἀσέλγεια chỉ sự buông thả trơ trẽn, thường gồm cả quá độ tình dục; “những việc” phản ánh dạng số nhiều mà không làm câu gượng.
- source_word: ἐπιθυμίαις
  choice: những dục vọng
  rationale: Trong danh sách thói xấu, từ này mang nghĩa tiêu cực là những ham muốn lệch lạc.
- source_word: οἰνοφλυγίαις
  choice: những cơn say sưa
  rationale: Danh từ số nhiều hiếm gặp chỉ tình trạng uống rượu quá độ hoặc những lần say sưa; “những cơn” bảo toàn sắc thái lặp lại.
- source_word: κώμοις
  choice: những cuộc chè chén
  rationale: κῶμος chỉ những cuộc vui náo loạn thường đi kèm rượu chè và sự quá độ.
- source_word: πότοις
  choice: những tiệc rượu
  rationale: πότος chỉ dịp tụ họp để uống rượu; cách dịch này phân biệt tương đối rõ với κώμοις.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: những việc thờ thần tượng trái phép
  rationale: ἀθέμιτος nhấn mạnh điều không được phép, trái với chuẩn mực thiêng liêng; “trái phép” giữ lực đạo đức-pháp lý mà không thêm sắc thái cảm xúc như “ghê tởm”.
theological_decisions:
- issue: Cách dịch ἐθνῶν
  choice: dân ngoại
  alternative: các dân tộc; người ngoại giáo
  rationale: Trong ngữ cảnh, Phi-e-rơ nói đến lối sống trước kia gắn với xã hội ngoài Do Thái. “Dân ngoại” giữ thuật ngữ Kinh Thánh quen thuộc mà không diễn giải mạnh thành “người ngoại giáo”.
- issue: Sắc thái của ἀθεμίτοις εἰδωλολατρίαις
  choice: những việc thờ thần tượng trái phép
  alternative: những việc thờ thần tượng ghê tởm; những hình thức thờ thần tượng vô luật
  rationale: Cụm từ lên án các thực hành ấy là điều không được phép, chứ không chỉ mô tả cảm xúc ghê tởm. Bản dịch giữ sự phán xét khách quan của nguyên văn.
- issue: Chủ thể hàm ẩn của πεπορευμένους
  choice: anh chị em ... khi sống
  alternative: người ta ... khi sống
  rationale: Phân từ đối cách số nhiều quy chiếu đến các độc giả được ngầm hiểu trong cấu trúc; thêm “anh chị em” giúp câu tiếng Việt rõ nghĩa mà không đổi đối tượng được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để làm rõ chủ thể hàm ẩn; giữ các danh từ số nhiều bằng “những việc/những cơn/những cuộc”. Các mục trong danh sách được phân biệt bằng từ ngữ Việt tự nhiên, tránh cách dịch cổ hoặc quá chuyên biệt.
