revisions:
- from: Mỗi người đã nhận được ân tứ nào thì hãy dùng ân tứ ấy để phục vụ lẫn nhau, như những người quản gia tốt khéo quản lý ân điển đa dạng của Đức Chúa Trời.
  to: Mỗi người, tùy theo ân tứ mình đã nhận, hãy dùng ân tứ ấy để phục vụ lẫn nhau[a], như những người quản gia tốt của ân điển muôn dạng của Đức Chúa Trời.
  rationale: Đổi kết cấu “đã nhận được ân tứ nào thì” thành “tùy theo ân tứ mình đã nhận” để phản ánh tự nhiên quan hệ καθὼς giữa điều đã nhận và việc phục vụ. Bỏ “khéo quản lý” vì đó là diễn giải dư; phục hồi cấu trúc người quản gia “của ân điển muôn dạng của Đức Chúa Trời.” Thêm chú thích tại “lẫn nhau” để không loại bỏ hoàn toàn các sắc thái dịch khác của εἰς ἑαυτούς.
