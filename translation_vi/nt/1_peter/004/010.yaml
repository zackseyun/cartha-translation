source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: vi
  text: Mỗi người, tùy theo ân tứ mình đã nhận, hãy dùng ân tứ ấy để phục vụ lẫn nhau[a], như những người quản gia tốt của ân điển muôn dạng của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ sắc thái phân phối, nhấn mạnh từng thành viên trong cộng đồng.
- source_word: καθὼς ἔλαβεν χάρισμα
  choice: đã nhận được ân tứ nào thì
  rationale: Kết cấu “nào thì” diễn đạt tự nhiên trong tiếng Việt sự tương ứng giữa điều mỗi người đã nhận và trách nhiệm phục vụ; “ân tứ” giữ mối liên hệ với ân điển mà không thu hẹp thành một loại quà tặng riêng biệt.
- source_word: εἰς ἑαυτοὺς αὐτὸ διακονοῦντες
  choice: hãy dùng ân tứ ấy để phục vụ lẫn nhau
  rationale: Phân từ mang lực khuyên bảo trong ngữ cảnh; cách diễn đạt này tự nhiên, nêu rõ ân tứ là phương tiện phục vụ và giữ đối tượng thụ hưởng là cộng đồng.
- source_word: καλοὶ οἰκονόμοι
  choice: những người quản gia tốt khéo quản lý
  rationale: “Quản gia” giữ hình ảnh người được chủ giao tài sản để quản trị; thêm động từ “quản lý” làm rõ chức năng trong tiếng Việt mà không đổi ý.
- source_word: ποικίλης χάριτος θεοῦ
  choice: ân điển đa dạng của Đức Chúa Trời
  rationale: “Đa dạng” truyền đạt nhiều hình thức biểu hiện của ân điển; kết cấu sở hữu bám sát nguyên văn.
theological_decisions:
- issue: Phạm vi nghĩa của χάρισμα
  choice: ân tứ
  alternative: quà tặng thuộc linh; món quà bởi ân điển
  rationale: “Ân tứ” là cách gọi ngắn gọn, dễ hiểu trong văn cảnh cộng đồng đức tin và giữ yếu tố ân sủng, nhưng không thêm tính từ “thuộc linh” vốn không có trong câu Hy Lạp.
- issue: Lực cộng đồng của εἰς ἑαυτούς
  choice: lẫn nhau
  alternative: giữa anh chị em; cho nhau
  rationale: Đại từ phản thân số nhiều trong ngữ cảnh có lực quy chiếu qua lại trong cộng đồng. “Lẫn nhau” tự nhiên và xác định những người trong cộng đồng là bên thụ hưởng, đồng thời không áp đặt một cơ chế phục vụ cụ thể.
- issue: Sắc thái của οἰκονόμοι
  choice: người quản gia
  alternative: người quản lý; người quản trị nhà
  rationale: Giữ hình ảnh về người được giao quản lý tài sản thuộc về chủ, qua đó bảo toàn hàm ý trách nhiệm mà không thêm phẩm chất “trung tín” vốn không được nói rõ ở đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “Đức Chúa Trời” cho θεός. Câu khuyên bảo được diễn đạt rõ bằng “hãy”; tránh thuật ngữ giáo hội không có trong nguyên văn.
