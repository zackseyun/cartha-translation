  source_fidelity: Bản thảo truyền đạt đúng ý chính của câu. Tuy nhiên, cụm “những người quản gia tốt khéo quản lý” thêm một động từ diễn giải không có trong nguyên văn và làm mờ cấu trúc “như những người quản gia tốt của ân điển...”. Bản sửa giữ hình ảnh người quản gia và gắn trực tiếp họ với ân điển của Đức Chúa Trời.
  naturalness: Câu sửa dùng trật tự tiếng Việt tự nhiên, rõ mối tương ứng giữa ân tứ đã nhận và việc phục vụ. “Ân điển muôn dạng” diễn đạt tự nhiên sắc thái ποικίλης (‘nhiều dạng, đa dạng’) trong văn phong Kinh Thánh hiện đại.
  terminology: “Ân tứ,” “ân điển,” “Đức Chúa Trời,” và “người quản gia” phù hợp với văn phong Cơ Đốc tiếng Việt thông dụng và không thu hẹp χάρισμα thành chỉ một loại ân tứ ‘thuộc linh’. Chú thích giữ các khả năng khác của εἰς ἑαυτούς.
  issues:
  - severity: medium
    issue: “khéo quản lý” là phần diễn giải thêm và làm lệch cấu trúc cú pháp.
    rationale: οἰκονόμοι vốn đã chỉ những người được giao quản trị; nguyên văn không thêm một động từ tương đương “quản lý.” Hơn nữa, genitive “của ân điển ... của Đức Chúa Trời” bổ nghĩa cho “người quản gia,” không phải là đối tượng của một động từ được thêm vào.
  - severity: low
