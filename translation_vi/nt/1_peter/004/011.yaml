id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: vi
  text: Nếu ai nói, hãy nói như truyền đạt những lời phán của Đức Chúa Trời[a]; nếu ai phục vụ, hãy phục vụ bằng sức lực mà Đức Chúa Trời ban cho[b], để trong mọi sự Đức Chúa Trời được tôn vinh qua Giê-su, Đấng Mê-si. Vinh quang và quyền thống trị thuộc về Ngài[c] đời đời vô cùng[d]. A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như những sấm ngôn của Đức Chúa Trời.” Từ Hy Lạp λόγια chỉ những lời phán có tính thần linh.'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “như từ sức lực mà Đức Chúa Trời cung ứng.”'
    reason: previous_rendering
  - marker: c
    text: “Ngài” theo ngữ pháp tự nhiên nhất chỉ Giê-su, Đấng Mê-si; tuy nhiên, một số người hiểu lời chúc tụng này là hướng về Đức Chúa Trời, dựa vào mệnh đề ngay trước đó.
    reason: alternative_reading
  - marker: d
    text: 'Dịch sát: “cho đến các đời của các đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: nói
  rationale: Động từ hiện tại trong câu điều kiện khái quát; “nói” tự nhiên, rộng nghĩa và không thu hẹp vào việc giảng dạy.
- source_word: λόγια θεοῦ
  choice: lời phán của Đức Chúa Trời
  rationale: λόγια chỉ những lời có nguồn gốc hay thẩm quyền thần linh; “lời phán” giữ sắc thái trang trọng rõ hơn “lời nói” mà vẫn dễ hiểu.
- source_word: διακονεῖ
  choice: phục vụ
  rationale: Diễn đạt việc phục vụ nói chung, không giới hạn vào một chức vụ chính thức trong Hội Thánh.
- source_word: ἐξ ἰσχύος ἧς χορηγεῖ ὁ θεός
  choice: bằng sức lực Đức Chúa Trời ban cho
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời cho thấy sức lực bắt nguồn từ sự cung ứng của Đức Chúa Trời.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Giữ phạm vi bao quát của cụm Hy Lạp với văn phong Kinh Thánh trang trọng nhưng quen thuộc.
- source_word: δοξάζηται
  choice: được tôn vinh
  rationale: Giữ thể bị động và mục đích do ἵνα dẫn vào.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qua Chúa Giê-su, Đấng Mê-si
  rationale: “Qua” thể hiện vai trò trung gian của διά; Χριστός được dịch như tước hiệu “Đấng Mê-si”, còn “Chúa” là cách gọi tiếng Việt tự nhiên và tôn kính đối với Giê-su trong văn cảnh Cơ Đốc.
- source_word: κράτος
  choice: quyền thống trị
  rationale: Trong lời chúc tụng, từ này nói đến quyền năng cai trị; “quyền thống trị” rõ nghĩa và giữ sắc thái vương quyền.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Thành ngữ tiếng Việt tự nhiên diễn đạt thời gian vô tận của thành ngữ Hy Lạp.
theological_decisions:
- issue: Đối tượng của đại từ ᾧ trong lời chúc tụng cuối câu
  choice: Dùng “Ngài” và đặt ngay sau “Chúa Giê-su, Đấng Mê-si”, vì tiền ngữ gần nhất về mặt ngữ pháp là Chúa Giê-su, Đấng Mê-si.
  alternative: Đại từ có thể được hiểu là chỉ Đức Chúa Trời trong mệnh đề ngay trước đó, hoặc lời chúc tụng có thể cô đọng sự tôn vinh Đức Chúa Trời qua Chúa Giê-su, Đấng Mê-si.
  rationale: Cú pháp nghiêng về tiền ngữ gần nhất, nhưng mạch ý vẫn tập trung vào việc Đức Chúa Trời được tôn vinh; chú thích bảo tồn sự mơ hồ thực sự thay vì quyết đoán giáo lý.
- issue: Lực của ὡς trong hai vế
  choice: Bổ sung “hãy nói” và “hãy phục vụ” để biểu đạt lực khuyên bảo hàm ẩn.
  alternative: 'Dịch sát cấu trúc tỉnh lược: “Nếu ai nói, như lời phán của Đức Chúa Trời; nếu ai phục vụ, như từ sức lực...”'
  rationale: Tiếng Hy Lạp có thể tỉnh lược động từ, nhưng tiếng Việt cần lặp động từ để câu sáng rõ; cách này không thêm nội dung ngoài ý khuyên bảo của văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời”, “Chúa Giê-su” và “Đấng Mê-si” theo lối gọi quen thuộc trong tiếng Việt; giữ nhịp song song “nếu ai... hãy...” và tránh thuật ngữ chức sắc.
