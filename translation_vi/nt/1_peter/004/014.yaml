id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: vi
  text: Nếu anh em bị sỉ nhục vì danh Đấng Mê-si[a], thì anh em thật có phước, vì Thần Khí của vinh quang và của Đức Chúa Trời[b] ngự trên anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp là Christos, nghĩa là “Đấng Mê-si” hay “Đấng được xức dầu”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “Thần Khí vinh hiển của Đức Chúa Trời”, hoặc “Thần Khí của vinh quang, tức là Thần Khí của Đức Chúa Trời”.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: bị sỉ nhục
  rationale: Động từ hiện tại thể bị động nói đến việc phải chịu lời lăng mạ, chê trách và sự hạ nhục công khai. “Bị sỉ nhục” tự nhiên trong tiếng Việt hiện đại và giữ được chiều kích danh dự–hổ thẹn.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: vì danh Đấng Mê-si
  rationale: Trong ngữ cảnh này, cụm từ chỉ việc chịu sỉ nhục do gắn bó với danh và căn tính của Chúa Giê-su. “Vì danh” vừa tự nhiên vừa giữ từ “danh” của nguyên văn; “Đấng Mê-si” thể hiện chức danh của Χριστός.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang giá trị chức danh, tương ứng với “Đấng được xức dầu”, chứ không chỉ là một tên riêng đã hóa cố định.
- source_word: μακάριοι
  choice: thật có phước
  rationale: “Có phước” giữ sắc thái tuyên bố phước lành mang tính thần học, thay vì chỉ diễn tả cảm giác vui vẻ hay hoàn cảnh may mắn. Từ “thật” giúp câu tiếng Việt tự nhiên mà không thay đổi nội dung.
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Thần Khí của vinh quang và của Đức Chúa Trời
  rationale: Cách dịch giữ hai cụm sở hữu song song của tiếng Hy Lạp và không quyết định thay người đọc liệu chúng là hai mô tả phối hợp hay cụm thứ hai giải thích cụm thứ nhất.
- source_word: δόξης
  choice: vinh quang
  rationale: “Vinh quang” là cách diễn đạt Kinh Thánh tự nhiên, thích hợp với sự hiện diện uy nghi của Đức Chúa Trời.
- source_word: ἀναπαύεται
  choice: ngự trên
  rationale: Động từ diễn tả việc nghỉ, đậu hoặc ở lại trên ai đó. “Ngự trên” là lối nói trang trọng, dễ hiểu về sự hiện diện của Thần Khí và gợi lại ngôn ngữ tiên tri mà không dùng cách diễn đạt cổ khó hiểu.
theological_decisions:
- issue: Cách hiểu τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Giữ cấu trúc “Thần Khí của vinh quang và của Đức Chúa Trời”.
  alternative: “Thần Khí vinh hiển của Đức Chúa Trời” hoặc “Thần Khí của vinh quang, tức là Thần Khí của Đức Chúa Trời”.
  rationale: Cú pháp Hy Lạp cô đọng, có thể được hiểu là hai thuộc ngữ cùng bổ nghĩa cho “Thần Khí”, hoặc thuộc ngữ sau giải thích thuộc ngữ trước. Bản chính giữ sự mơ hồ có thật thay vì âm thầm chọn một cách giải thích.
- issue: Giá trị của Χριστός trong câu
  choice: Dịch bằng chức danh “Đấng Mê-si”.
  alternative: “Đấng Christ” hoặc “Christ”.
  rationale: Trong cụm nói về việc chịu sỉ nhục vì danh, chức danh và căn tính được nhấn mạnh; “Đấng Mê-si” truyền đạt rõ nghĩa chức danh mà không biến nó thành một tên riêng thuần túy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς theo lối xưng hô cộng đồng; giữ “danh”, “có phước”, “vinh quang” và “ngự trên” để bảo toàn âm hưởng Kinh Thánh mà không dùng cấu trúc quá cổ.
