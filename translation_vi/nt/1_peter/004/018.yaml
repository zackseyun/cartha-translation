id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: vi
  text: Và nếu người công chính còn khó được cứu[a], thì kẻ không tin kính và người có tội sẽ xuất hiện ở đâu[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chỉ vừa đủ mới được cứu” hoặc “phải trải qua nhiều gian nan mới được cứu.” Ý chính trong ngữ cảnh là người công chính được cứu qua thử thách nghiêm trọng; câu này không nhất thiết nói rằng chính sự cứu rỗi là điều không chắc chắn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thì kẻ không tin kính và người có tội sẽ được tìm thấy ở đâu?”'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: người công chính
  rationale: Tính từ có mạo từ được dùng như danh từ, số ít giống đực, mang nghĩa đại diện. “Người công chính” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: μόλις
  choice: còn khó khăn mới
  rationale: Diễn đạt sự khó khăn, gian nan của việc đi đến sự cứu rỗi trong ngữ cảnh chịu thử thách, đồng thời giữ được sức căng của nguyên văn mà không khẳng định rằng kết cuộc cứu rỗi là bất định.
- source_word: σῴζεται
  choice: được cứu
  rationale: Động từ hiện tại thể thụ động/trung gian; “được cứu” là cách diễn đạt tự nhiên, phù hợp với mệnh đề mang tính châm ngôn, không buộc phải làm rõ sắc thái tiến trình.
- source_word: ἀσεβής
  choice: kẻ không tin kính
  rationale: Giữ sắc thái đạo đức–tôn giáo của người không có lòng kính sợ hoặc tôn kính Đức Chúa Trời.
- source_word: ἁμαρτωλός
  choice: người có tội
  rationale: Giữ riêng biệt với ἀσεβής như hai danh xưng phối hợp trong nguyên văn; cách nói này rõ ràng, tự nhiên và trang trọng.
- source_word: ποῦ
  choice: ở đâu
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nguyên sức mạnh của câu hỏi tu từ.
- source_word: φανεῖται
  choice: sẽ xuất hiện
  rationale: Giữ nghĩa trực tiếp của động từ tương lai “xuất hiện/được thấy”, đồng thời bảo tồn lối nói gợi lại Châm Ngôn 11:31 LXX.
theological_decisions:
- issue: Hàm ý của μόλις σῴζεται
  choice: Câu này nói đến sự khó khăn, gian nan đi kèm việc người công chính được cứu trong bối cảnh chịu khổ và phán xét.
  alternative: Người công chính chỉ vừa đủ hoặc có kết cuộc cứu rỗi không chắc chắn.
  rationale: Ngữ cảnh gần nói về sự chịu khổ, sự phán xét bắt đầu từ nhà Đức Chúa Trời và sự bền lòng. Bản dịch giữ sức căng của nguyên văn nhưng không tự ý biến nó thành lời khẳng định về tính bất định của sự cứu rỗi.
- issue: Số ít giống đực mang tính đại diện
  choice: Dùng “người công chính” ở số ít với nghĩa đại diện.
  alternative: “những người công chính” hoặc một cách diễn giải số nhiều.
  rationale: Cách này phản ánh hình thái số ít của tiếng Hy Lạp và giữ lối văn cô đọng, mang tính châm ngôn.
- issue: Ý nghĩa của φανεῖται
  choice: Dịch sát là “sẽ xuất hiện ở đâu”.
  alternative: “sẽ được tìm thấy ở đâu” hoặc hàm ý trực tiếp về chỗ đứng trong cuộc phán xét.
  rationale: Động từ cho phép sắc thái “xuất hiện/được thấy”; giữ cách nói trực tiếp bảo tồn tính mơ hồ và sức mạnh tu từ của câu hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc câu hỏi tu từ, số ít đại diện và hai danh xưng riêng biệt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
