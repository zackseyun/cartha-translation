source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: vi
  text: Trên hết, hãy duy trì tình yêu thương tha thiết dành cho nhau, vì tình yêu thương che phủ nhiều tội lỗi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách nói này gợi lại Châm Ngôn 10:12. “Che phủ” cũng có thể được hiểu theo nghĩa không khơi lại hoặc không làm lan rộng những lỗi phạm; nguyên văn vẫn để ngỏ phạm vi chính xác của ẩn dụ.
    reason: cross_reference_and_lexical_ambiguity
lexical_decisions:
- source_word: πρὸ πάντων
  choice: Trên hết
  rationale: Diễn đạt tự nhiên ý ưu tiên cao nhất trong lời khuyên, thay vì hiểu theo trình tự thời gian là “trước mọi sự”.
- source_word: εἰς ἑαυτοὺς
  choice: nhau
  rationale: Trong cộng đồng người tin, đại từ phản thân mang ý nghĩa tương hỗ; “nhau” diễn đạt rõ và tự nhiên trong tiếng Việt.
- source_word: ἀγάπην
  choice: lòng yêu thương / tình yêu thương
  rationale: “Lòng yêu thương” tự nhiên khi nói về điều cần gìn giữ giữa họ; “tình yêu thương” ở mệnh đề sau giữ danh từ khái quát làm chủ ngữ.
- source_word: ἐκτενῆ
  choice: thật tha thiết
  rationale: Truyền đạt cường độ và sự bền bỉ của từ chỉ điều được căng ra, chuyên tâm và nhiệt thành, bằng cách nói hiện đại, trang trọng vừa phải.
- source_word: ἔχοντες
  choice: hãy giữ
  rationale: Phân từ hiện tại tiếp nối mạch khuyên nhủ từ câu trước. Dùng mệnh lệnh “hãy giữ” tạo câu tiếng Việt hoàn chỉnh và thể hiện tính duy trì, không chỉ sở hữu.
- source_word: ὅτι
  choice: vì
  rationale: Giữ quan hệ nguyên nhân, đồng thời phù hợp nhịp văn khuyên nhủ trong tiếng Việt.
- source_word: καλύπτει
  choice: che phủ
  rationale: Giữ nguyên ẩn dụ của động từ Hy Lạp và âm vang Châm Ngôn 10:12, không tự ý giới hạn nghĩa thành bỏ qua, che giấu hay đem lại sự tha thứ.
- source_word: πλῆθος ἁμαρτιῶν
  choice: vô số tội lỗi
  rationale: Diễn đạt tự nhiên số lượng rất lớn và giữ sức nặng tu từ của cụm từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của câu “tình yêu thương che phủ vô số tội lỗi”
  choice: Giữ ẩn dụ “che phủ” và không xác định tội lỗi thuộc về ai hay cơ chế che phủ là gì.
  alternative: “Tình yêu thương bỏ qua nhiều lỗi phạm” hoặc “tình yêu thương đem lại sự tha thứ cho nhiều tội lỗi”.
  rationale: Câu Hy Lạp có tính châm ngôn và gợi lại Châm Ngôn 10:12 nhưng không buộc một cách giải thích thần học duy nhất. Giữ ẩn dụ tránh du nhập quan niệm rằng tình yêu tự nó lập công chuộc tội, đồng thời cũng không thu hẹp câu chỉ còn nghĩa tâm lý hay xã hội.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Trên hết” và “hãy giữ lòng yêu thương nhau thật tha thiết” tạo lời khuyên trực tiếp, tự nhiên; “che phủ” được giữ để bảo toàn ẩn dụ và sự căng thẳng thần học của nguyên văn.
