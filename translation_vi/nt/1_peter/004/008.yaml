  to: Trên hết, hãy duy trì tình yêu thương tha thiết dành cho nhau, vì tình yêu thương che phủ nhiều tội lỗi.[a]
  rationale: Chỉnh nhẹ để câu tiếng Việt tự nhiên hơn, làm rõ tình yêu hướng đến nhau, và tránh cường điệu hóa πλῆθος. Vẫn giữ nguyên ẩn dụ “che phủ,” tính mơ hồ có chủ ý về các tội lỗi, và sắc thái khuyên nhủ duy trì của phân từ hiện tại.
