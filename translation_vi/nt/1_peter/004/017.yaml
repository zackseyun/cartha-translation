id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: vi
  text: Vì đã đến lúc sự phán xét bắt đầu từ gia đình của Đức Chúa Trời[a]; và nếu sự phán xét bắt đầu trước hết từ chúng ta, thì kết cục[b] của những người không vâng phục[c] Tin Mừng của Đức Chúa Trời sẽ ra sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nhà của Đức Chúa Trời”. Từ Hy Lạp οἶκος có thể chỉ “nhà” hoặc “gia đình”; tại đây, từ này có lẽ chỉ dân Đức Chúa Trời như gia đình của Ngài.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự kết thúc” hoặc “kết quả”. Từ Hy Lạp τέλος có thể mang nghĩa “điểm cuối”, “kết quả” hay “kết cục”.
    reason: lexical_alternative
  - marker: c
    text: “Những người không vâng phục” cũng có thể dịch là “những người không chịu tin”, vì động từ Hy Lạp có thể diễn tả cả sự bất tuân lẫn sự không tin khi người ta đáp lại Tin Mừng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu lý do cho lời khuyên trong mạch văn trước đó; “Vì” diễn đạt tự nhiên quan hệ nguyên nhân trong tiếng Việt.
- source_word: ὁ καιρός
  choice: đã đến lúc
  rationale: καιρός chỉ thời điểm thích hợp hoặc đã được định; “đã đến lúc” diễn đạt rõ sắc thái ấy mà không biến nó thành một mốc thời gian thuần túy.
- source_word: τοῦ ἄρξασθαι
  choice: bắt đầu
  rationale: Động từ nguyên mẫu có mạo từ bổ nghĩa cho καιρός. Cấu trúc “đã đến lúc… bắt đầu” tự nhiên trong tiếng Việt và giữ đúng quan hệ cú pháp.
- source_word: τὸ κρίμα
  choice: sự phán xét
  rationale: Cách dịch này giữ nghĩa rộng về hành động xét đoán của Đức Chúa Trời, không thu hẹp thành “kết án” hay làm nhẹ thành “sửa dạy”.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: từ gia đình của Đức Chúa Trời
  rationale: οἶκος có thể là nhà hoặc gia đình; ở đây “từ chúng ta” cho thấy đối tượng là cộng đồng dân Đức Chúa Trời. “Gia đình” truyền đạt nghĩa tập thể rõ hơn cho độc giả hiện đại.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: và nếu sự phán xét bắt đầu trước hết từ chúng ta
  rationale: Lặp lại chủ ngữ và động từ được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ nghĩa; “từ chúng ta” giữ nguyên giới từ ἀπό được lặp lại.
- source_word: τέλος
  choice: kết cục
  rationale: τέλος có thể chỉ sự kết thúc, kết quả hoặc kết cục. “Kết cục” phù hợp với câu hỏi tu từ về điều cuối cùng sẽ xảy đến mà không chỉ nói đến sự chấm dứt theo thời gian.
- source_word: ἀπειθούντων
  choice: những người không vâng theo
  rationale: Phân từ này có thể bao hàm cả không vâng phục lẫn không tin khi đáp lại Tin Mừng. “Không vâng theo” giữ rõ sắc thái hành động và quan hệ với bổ ngữ ở cách dữ cách.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: Tin Mừng của Đức Chúa Trời
  rationale: Cụm sở hữu diễn tả Tin Mừng thuộc về hoặc đến từ Đức Chúa Trời; cách dịch này trang trọng, tự nhiên và không giải quyết quá mức quan hệ sở hữu/nguồn gốc.
theological_decisions:
- issue: Bản chất của κρίμα đối với dân Đức Chúa Trời
  choice: Dịch là “sự phán xét” mà không xác định đó là sự kết án.
  alternative: “sự kết án” hoặc “sự sửa dạy”
  rationale: “Sự kết án” sẽ quá mạnh đối với cộng đồng tín hữu, còn “sự sửa dạy” sẽ làm nhẹ tính chất xét xử. “Sự phán xét” giữ nguyên sức nặng và sự căng thẳng thần học của câu.
- issue: Đối tượng được gọi là οἶκος τοῦ θεοῦ
  choice: Hiểu là cộng đồng dân Đức Chúa Trời và dịch “gia đình của Đức Chúa Trời”.
  alternative: “nhà/đền thờ của Đức Chúa Trời” theo nghĩa một công trình thờ phượng
  rationale: Cụm tiếp theo “từ chúng ta” xác nhận đối tượng là con người trong cộng đồng; cách dùng hình ảnh về dân Chúa như một ngôi nhà cũng phù hợp với 1 Phi-e-rơ 2:5.
- issue: Sắc thái của ἀπειθούντων
  choice: Giữ nghĩa chính là “không vâng theo”, đồng thời ghi chú khả năng bao hàm việc không chịu tin.
  alternative: Chỉ dịch là “không tin”
  rationale: Động từ Hy Lạp có thể nối kết bất tín với bất tuân. Bản chính giữ sắc thái vâng phục, còn chú thích bảo tồn chiều kích không tin mà không buộc câu chỉ còn một nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ cùng sự đối xứng “từ gia đình của Đức Chúa Trời / từ chúng ta” được giữ lại. Việc lặp “sự phán xét bắt đầu” ở vế sau làm rõ thành phần được tỉnh lược trong nguyên văn mà không thêm một ý mới.
