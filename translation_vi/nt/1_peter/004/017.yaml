  to: Vì đã đến lúc sự phán xét bắt đầu từ gia đình của Đức Chúa Trời[a]; và nếu sự phán xét bắt đầu trước hết từ chúng ta, thì kết cục[b] của những người không vâng phục[c] Tin Mừng của Đức Chúa Trời sẽ ra sao?
