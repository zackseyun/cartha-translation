reference: 1 Peter 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: vi
  text: Về điều này, họ lấy làm lạ[a] khi anh chị em không cùng họ lao vào cùng một dòng thác của sự phóng túng[b], và họ nói xấu anh chị em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ ngạc nhiên” hoặc “họ thấy kỳ lạ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “vào cùng một sự tuôn tràn của lối sống phóng túng”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nói lời xúc phạm anh chị em” hoặc “phỉ báng anh chị em”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Về điều này
  rationale: Cụm từ nối phản ứng của những người ấy với sự thay đổi lối sống vừa nêu ở câu trước, đồng thời tránh diễn giải mạnh hơn thành quan hệ nguyên nhân.
- source_word: ξενίζονται
  choice: họ lấy làm lạ
  rationale: Diễn đạt tự nhiên sắc thái coi hành vi của các tín hữu là lạ lùng; chú thích giữ phương án gần nghĩa là “ngạc nhiên”.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: vì anh chị em không cùng họ lao vào
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối thành mệnh đề tự nhiên trong tiếng Việt, đồng thời giữ hình ảnh cùng chạy/lao vào và ý tham gia chung.
- source_word: εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν
  choice: vào dòng thác phóng túng ấy
  rationale: “Dòng thác” giữ hình ảnh tuôn tràn của ἀνάχυσις; “phóng túng” diễn tả lối sống buông thả, thiếu kiềm chế của ἀσωτία. “Ấy” quy chiếu về nếp sống trước kia trong ngữ cảnh.
- source_word: βλασφημοῦντες
  choice: nên họ phỉ báng anh chị em
  rationale: Trong ngữ cảnh, động từ chỉ lời lẽ xúc phạm hoặc vu khống nhắm vào các tín hữu, không nhất thiết là phạm thượng chống lại Đức Chúa Trời. “Nên” thể hiện quan hệ hoàn cảnh/hệ quả tự nhiên mà không tách quá xa phân từ khỏi động từ chính.
theological_decisions:
- issue: Đối tượng và tính chất của βλασφημοῦντες
  choice: phỉ báng anh chị em
  alternative: nói lời xúc phạm; nói xấu; phạm thượng
  rationale: Ngữ cảnh nói về phản ứng thù nghịch đối với các tín hữu đã đổi lối sống. Dịch là “phạm thượng” dễ khiến độc giả hiểu đối tượng là Đức Chúa Trời, trong khi ở đây đối tượng được ngữ cảnh hàm ý là các tín hữu.
- issue: Quan hệ của ἐν ᾧ với ngữ cảnh trước
  choice: Về điều này
  alternative: Vì thế; trong việc ấy
  rationale: “Về điều này” bảo toàn sự liên kết tương đối rộng của nguyên văn mà không quyết định dứt khoát rằng cụm từ hoàn toàn mang nghĩa nguyên nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν để biểu đạt cộng đồng tín hữu mà không mặc định giới tính. Hình ảnh “dòng thác” giữ sức gợi của nguyên văn nhưng vẫn tự nhiên trong tiếng Việt.
