id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: vi
  text: Vì vậy, cả những người chịu khổ theo ý muốn của Đức Chúa Trời cũng hãy phó thác linh hồn mình[a] cho Đấng Tạo Hóa thành tín, trong khi làm điều lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mạng sống mình” hoặc “chính mình”; từ Hy Lạp có thể chỉ linh hồn, mạng sống hoặc bản thân.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vì vậy
  rationale: Diễn đạt kết luận suy ra từ lập luận trước đó, tự nhiên và rõ ràng trong tiếng Việt hiện đại.
- source_word: οἱ πάσχοντες
  choice: những người chịu khổ
  rationale: Giữ sắc thái khái quát của phân từ hiện tại dùng như danh từ, chỉ những người đang ở trong hoàn cảnh chịu khổ.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: theo ý muốn của Đức Chúa Trời
  rationale: Phản ánh trực tiếp ý nghĩa phù hợp với hoặc theo ý muốn của Đức Chúa Trời, nhưng không giải thích thêm đau khổ ấy do Ngài cho phép hay định trước.
- source_word: πιστῷ κτίστῃ
  choice: cho Đấng Tạo Hóa thành tín
  rationale: Dịch πιστός bằng “thành tín” để giữ ý nghĩa đáng tin cậy và trung tín; “Đấng Tạo Hóa” là cách gọi tự nhiên, tôn nghiêm dành cho Đức Chúa Trời.
- source_word: παρατιθέσθωσαν
  choice: hãy phó thác
  rationale: Thể trung gian mệnh lệnh diễn tả việc giao mình hoặc điều quý giá cho người khác gìn giữ; “phó thác” vừa tự nhiên vừa giữ sắc thái tin cậy.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: linh hồn mình
  rationale: Giữ nghĩa gần hình thức và âm hưởng thần học của ψυχή; đại từ “mình” quy chiếu tự nhiên về những người chịu khổ. Các nghĩa rộng hơn được ghi trong chú thích.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: trong khi làm điều lành
  rationale: Diễn đạt hành động làm điều lành như hoàn cảnh đi kèm với việc phó thác, tránh biến cụm từ thành một quan hệ phương tiện quá cứng.
theological_decisions:
- issue: Quan hệ giữa sự chịu khổ và ý muốn của Đức Chúa Trời
  choice: theo ý muốn của Đức Chúa Trời
  alternative: bởi ý muốn của Đức Chúa Trời
  rationale: κατά nói đến sự phù hợp với ý muốn của Đức Chúa Trời nhưng không xác định cơ chế thần học là cho phép, định trước hay trực tiếp gây nên; bản dịch giữ nguyên độ căng và tính mở của câu.
- issue: Phạm vi nghĩa của ψυχή
  choice: linh hồn
  alternative: mạng sống; chính mình
  rationale: “Linh hồn” giữ sự tương ứng từ vựng và âm hưởng thần học, còn chú thích bảo tồn khả năng từ này chỉ toàn bộ mạng sống hoặc chính con người.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “cả… cũng” bảo tồn καί nhấn mạnh rằng những người chịu khổ cũng nằm trong kết luận này; “Đấng Tạo Hóa thành tín” giữ giọng tôn nghiêm và ý nghĩa đáng tin cậy của πιστός.
