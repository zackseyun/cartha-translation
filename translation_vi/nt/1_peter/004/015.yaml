source:
  edition: SBLGNT
  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: vi
  text: Vì đừng ai trong anh em phải chịu khổ như kẻ giết người, kẻ trộm, kẻ làm điều ác, hay như kẻ xen vào chuyện của người khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kẻ hay lo chuyện bao đồng”; sát hơn theo cấu tạo từ: “người giám sát việc của người khác,” tức là người xen vào việc không thuộc phận mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν πασχέτω
  choice: Vì đừng ai trong anh em phải chịu khổ
  rationale: Giữ liên từ giải thích γάρ bằng “Vì”, diễn đạt mệnh lệnh phủ định μὴ ... πασχέτω tự nhiên trong tiếng Việt, đồng thời bảo toàn sắc thái cá thể của τις ὑμῶν.
- source_word: φονεύς
  choice: kẻ giết người
  rationale: Diễn đạt người phạm hành vi sát nhân một cách rõ ràng, trang trọng và dễ hiểu; trong danh sách tội lỗi này, cụm từ mang nghĩa “kẻ sát nhân”, không chỉ bất kỳ người nào gây chết người.
- source_word: κλέπτης
  choice: kẻ trộm cắp
  rationale: Phản ánh nghĩa thông thường của κλέπτης là người lấy trộm tài sản, không thêm sắc thái cướp đoạt bằng bạo lực.
- source_word: κακοποιός
  choice: kẻ làm điều ác
  rationale: Giữ nghĩa đạo đức rộng của từ, không thu hẹp thành thuật ngữ pháp lý như “tội phạm”.
- source_word: ἀλλοτριεπίσκοπος
  choice: kẻ xen vào chuyện của người khác
  rationale: Từ ghép hiếm này chỉ người can thiệp trái lẽ vào những việc thuộc người khác. Cách dịch truyền đạt nghĩa tiêu cực rõ ràng mà không gợi sai đến chức vụ giám mục.
theological_decisions:
- issue: Ý nghĩa của ἀλλοτριεπίσκοπος
  choice: kẻ xen vào chuyện của người khác
  alternative: kẻ hay lo chuyện bao đồng; kẻ can thiệp vào việc không thuộc phận mình
  rationale: Ngữ cảnh liệt kê những hành vi sai trái khiến việc chịu khổ trở nên đáng trách. Bản dịch giữ ý can thiệp không thích đáng, nhưng chú thích thừa nhận tính hiếm và sắc thái theo sát cấu tạo từ.
- issue: Bản chất của việc “chịu khổ”
  choice: phải chịu khổ
  alternative: bị trừng phạt
  rationale: πάσχω chỉ nói đến chịu khổ, không trực tiếp xác định đó là hình phạt; vì vậy không thêm một kết luận thần học hoặc pháp lý mà nguyên văn không nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng phổ thông. Dùng cấu trúc lặp “kẻ...” để giữ nhịp của danh sách; tránh thuật ngữ giáo hội ở từ cuối và không thu hẹp “chịu khổ” thành “chịu hình phạt”.
