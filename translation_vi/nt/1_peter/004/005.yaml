  terminology: Giữ “Đấng” để không định danh vị thẩm phán là Đức Chúa Trời hay Đấng Christ, phù hợp với tính không xác định của nguyên văn. “Phán xét”, “người sống và người chết” là các thuật ngữ chuẩn xác và thích hợp với văn phong Kinh Thánh.
  issues:
  - severity: low
    issue: Giới từ “với” trong “khai trình với Đấng” chưa diễn đạt rõ sắc thái chịu trách nhiệm trước vị thẩm phán.
    rationale: Thành ngữ ἀποδώσουσιν λόγον có sắc thái trình bày/trả lẽ trước một thẩm quyền. “Trước Đấng” tự nhiên hơn trong tiếng Việt và làm rõ bối cảnh xét xử mà không thêm ý.
  - severity: low
    issue: “Đang sẵn sàng” hơi gượng trong cụm mô tả Đấng phán xét.
    rationale: ἑτοίμως ἔχοντι diễn tả tình trạng sẵn sàng; “sẵn sàng phán xét” đã truyền đạt đầy đủ mà tự nhiên hơn.
  revised_text: Họ sẽ phải khai trình trước Đấng sẵn sàng phán xét người sống và người chết.[a]
