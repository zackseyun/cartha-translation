base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: vi
  text: Họ sẽ phải khai trình trước Đấng sẵn sàng phán xét người sống và người chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng đang sẵn sàng phán xét.” Cụm từ Hy Lạp theo nghĩa đen diễn tả một đấng “có sự sẵn sàng để phán xét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: Họ
  rationale: Đại từ quan hệ chỉ những người vừa được nói đến ở câu trước. Mở đầu bằng “Họ” tự nhiên trong tiếng Việt và làm rõ chủ thể.
- source_word: ἀποδώσουσιν λόγον
  choice: sẽ phải khai trình
  rationale: Thành ngữ mang nghĩa phải trình bày hoặc chịu trách nhiệm về hành vi của mình. “Khai trình” giữ được sắc thái pháp lý, còn “phải” diễn đạt nghĩa vụ hàm chứa trong ngữ cảnh phán xét.
- source_word: τῷ
  choice: với Đấng
  rationale: Mạo từ đi với phân từ được dùng như danh từ, chỉ một vị nhưng không nêu danh tính. “Đấng” phù hợp với văn phong trang trọng và không tự ý xác định đó là Đức Chúa Trời hay Đấng Christ.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: đang sẵn sàng phán xét
  rationale: Cụm từ diễn tả vị ấy ở trong trạng thái sẵn sàng phán xét. Cách dịch này tự nhiên, giữ sắc thái hiện tại của phân từ và không thêm hình ảnh không có trong nguyên văn.
- source_word: ζῶντας καὶ νεκρούς
  choice: người sống và người chết
  rationale: Cách diễn đạt ngắn gọn, quen thuộc và bao quát đúng hai đối tượng trực tiếp của động từ “phán xét”.
theological_decisions:
- issue: Danh tính của vị sẵn sàng phán xét người sống và người chết
  choice: Giữ cách gọi “Đấng” mà không nêu rõ danh tính trong chính văn.
  alternative: Đức Chúa Trời; Đấng Christ
  rationale: Nguyên văn Hy Lạp không nêu đích danh vị thẩm phán tại đây. Tân Ước có những chỗ nói Đức Chúa Trời phán xét và những chỗ nói Đấng Christ phán xét; vì vậy bản dịch không giải quyết sự căng thẳng thần học vượt quá câu chữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Khai trình” giữ sắc thái chịu trách nhiệm trước sự phán xét; “Đấng” tôn kính nhưng không định danh vị thẩm phán.
