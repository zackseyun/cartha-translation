revisions:
- from: Họ sẽ phải khai trình với Đấng đang sẵn sàng phán xét người sống và người chết.[a]
  to: Họ sẽ phải khai trình trước Đấng sẵn sàng phán xét người sống và người chết.[a]
  rationale: Sửa giới từ để phản ánh rõ hơn thành ngữ pháp lý “trình tường/trả lời trước” một thẩm quyền. Rút “đang sẵn sàng” thành “sẵn sàng” trong chính văn nhằm tăng tính tự nhiên, đồng thời giữ phương án sát hình thức hơn ở chú thích. Không thay đổi danh tính còn để ngỏ của vị thẩm phán.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng cấu trúc và ý chính: những người đã nói ở câu trước sẽ phải trả lời trước vị sẵn sàng xét xử người sống và người chết. Tuy nhiên, trong ngữ cảnh trả lời trước tòa/phán xét, giới từ “trước” sát với sắc thái quy trách nhiệm hơn “với”. Cụm “đang sẵn sàng” có thể rút thành “sẵn sàng” mà vẫn biểu đạt phân từ hiện tại ἔχοντι một cách tự nhiên.'
