source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: vi
  text: Nhưng nếu ai chịu khổ vì là một Cơ Đốc nhân, người ấy đừng hổ thẹn, nhưng hãy tôn vinh Đức Chúa Trời trong danh ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong việc này” hoặc “vì danh ấy.” Tiếng Hy Lạp sát nghĩa hơn là “trong danh ấy,” có lẽ chỉ danh xưng “Cơ Đốc nhân.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ ὡς Χριστιανός
  choice: Nhưng nếu ai chịu khổ vì là một Cơ Đốc nhân
  rationale: Cụm điều kiện nối với động từ 'chịu khổ' được hiểu từ câu trước; bổ sung rõ trong tiếng Việt để câu tự nhiên và đầy đủ. 'Cơ Đốc nhân' là danh xưng đã được từ vựng hóa tương ứng với Χριστιανός.
- source_word: μὴ αἰσχυνέσθω
  choice: người ấy đừng hổ thẹn
  rationale: Giữ lực khuyên bảo của mệnh lệnh ngôi thứ ba và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: nhưng hãy tôn vinh Đức Chúa Trời
  rationale: Giữ sự tương phản với việc hổ thẹn; 'tôn vinh' truyền đạt nghĩa hướng về Đức Chúa Trời của δοξάζω.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: trong danh ấy
  rationale: Bám sát cấu trúc Hy Lạp và giữ liên hệ với danh xưng 'Cơ Đốc nhân', đồng thời để chú thích nêu các cách hiểu khả dĩ khác.
theological_decisions:
- issue: Sở chỉ của ἐν τῷ ὀνόματι τούτῳ
  choice: Giữ cách dịch 'trong danh ấy', nhiều khả năng chỉ danh xưng 'Cơ Đốc nhân'.
  alternative: Có thể hiểu là 'trong việc này' hoặc 'vì danh ấy'.
  rationale: Χριστιανός là tiền ngữ trực tiếp, còn ὄνομα thường có nghĩa là tên hay danh xưng. Bản dịch chính giữ nguyên hình ảnh 'danh' thay vì giải quyết hoàn toàn sự mơ hồ.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. Dùng 'ai... người ấy' để chuyển mệnh lệnh ngôi thứ ba sang tiếng Việt tự nhiên; khôi phục ý 'chịu khổ' từ ngữ cảnh trực tiếp của câu 15.
