id: 1PE.4.1
reference: 1 Peter 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: vi
  text: Vậy, vì Đấng Mê-si-a đã chịu khổ trong xác thịt[a], anh chị em cũng hãy trang bị cho mình tâm thế như vậy, bởi người đã chịu khổ trong xác thịt thì đã dứt khỏi tội lỗi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trong xác thịt” dịch sát từ Hy Lạp sarx, ở đây nói đến sự hiện hữu trong thân thể con người, không nhất thiết có nghĩa là “bản tính tội lỗi”.
    reason: lexical_alternative
  - marker: b
    text: Mệnh đề “người đã chịu khổ trong xác thịt thì đã dứt khỏi tội lỗi” có nhiều cách hiểu. Mệnh đề này có thể nói riêng về Đấng Mê-si-a, về các tín hữu cùng đi theo khuôn mẫu của Ngài, hoặc nêu một nguyên tắc chung rằng chịu khổ đánh dấu sự đoạn tuyệt dứt khoát với tội lỗi.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Giữ nghĩa tước hiệu của Χριστός bằng cách diễn đạt quen thuộc và dễ hiểu trong tiếng Việt hiện đại.
- source_word: οὖν
  choice: Vậy
  rationale: Biểu thị kết luận suy ra từ mạch văn trước một cách tự nhiên hơn trong tiếng Việt.
- source_word: παθόντος
  choice: đã chịu khổ
  rationale: 'Chuyển phân từ bất định quá khứ thành mệnh đề có quan hệ nguyên nhân: “vì ... đã chịu khổ”.'
- source_word: σαρκὶ
  choice: trong xác thịt
  rationale: Giữ cách nói cụ thể của σάρξ và sự lặp lại trong câu; ở đây chỉ sự hiện hữu thân xác của con người, không nhất thiết là “bản tính tội lỗi”.
- source_word: ἔννοιαν
  choice: tâm thế
  rationale: Diễn đạt tư tưởng, thái độ và ý hướng nội tâm trong một từ tự nhiên, trang trọng.
- source_word: ὁπλίσασθε
  choice: hãy trang bị cho mình
  rationale: Giữ sắc thái mệnh lệnh và hình ảnh quân sự, đồng thời tự nhiên hơn “hãy tự vũ trang” trong văn cảnh nói về tâm thế.
- source_word: ὅτι
  choice: bởi
  rationale: Nêu lý do cho lời khuyên, phù hợp với giọng văn trang trọng.
- source_word: ὁ παθὼν
  choice: người đã chịu khổ
  rationale: Giữ cách nói khái quát của phân từ có mạo từ, không tự ý xác định đối tượng là riêng Đấng Mê-si hay các tín hữu.
- source_word: πέπαυται
  choice: đã dứt
  rationale: 'Phản ánh trạng thái kết quả của thì hoàn thành: đã đi đến chỗ chấm dứt và hiện ở trong tình trạng ấy.'
- source_word: ἁμαρτίας
  choice: khỏi tội lỗi
  rationale: Giữ số ít mang nghĩa tội lỗi như một lĩnh vực, quyền lực hoặc lối sống; “dứt khỏi” diễn đạt quan hệ phân cách.
theological_decisions:
- issue: Đối tượng và ý nghĩa của mệnh đề “người đã chịu khổ trong xác thịt thì đã dứt khỏi tội lỗi”
  choice: Giữ nguyên cách phát biểu khái quát, cô đọng, không xác định đối tượng cụ thể.
  alternative: Có thể hiểu là nói riêng về Đấng Mê-si, về các tín hữu đi theo khuôn mẫu chịu khổ của Ngài, hoặc như một nguyên tắc chung về sự đoạn tuyệt dứt khoát với tội lỗi.
  rationale: Cú pháp Hy Lạp không giải quyết dứt điểm đối tượng quy chiếu. Bản dịch vì thế bảo toàn sự căng thẳng thần học thay vì thêm lời diễn giải.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để diễn đạt đại từ số nhiều ὑμεῖς theo lối bao quát; giữ hình ảnh trang bị và sự lặp lại của “trong xác thịt” để bảo toàn kết cấu tu từ của nguyên văn.
