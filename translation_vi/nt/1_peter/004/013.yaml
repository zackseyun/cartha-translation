id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: vi
  text: Nhưng anh em dự phần vào những đau khổ của Đấng Mê-si[a] bao nhiêu thì hãy vui mừng bấy nhiêu, để khi vinh quang của ngài được bày tỏ[b], anh em cũng vui mừng hớn hở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si,” tức Đấng Được Xức Dầu.'
    reason: Nêu cách gọi truyền thống quen thuộc và làm rõ ý nghĩa của tước hiệu Hy Lạp.
  - marker: b
    text: 'Cũng có thể dịch: “khi vinh quang của ngài được mặc khải.”'
    reason: Bảo tồn cách diễn đạt bằng danh từ gần với ἀποκάλυψις và cho thấy sắc thái “vén mở, làm lộ ra” của từ này.
lexical_decisions:
- source_word: καθὸ
  choice: bao nhiêu thì ... bấy nhiêu
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt diễn đạt lực tỷ lệ của καθὸ rõ hơn một từ đơn như “khi” hoặc “vì”.
- source_word: κοινωνεῖτε
  choice: anh em được dự phần vào
  rationale: “Dự phần vào” giữ được ý tham dự thực sự của κοινωνέω, chứ không chỉ đồng cảm với những đau khổ ấy.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: những đau khổ của Đấng Mê-si
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu trong tiếng Hy Lạp mà không giải thích quá mức bản chất thần học của sự dự phần.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός mang nghĩa tước hiệu tại đây; “Đấng Mê-si” bảo tồn nội dung của tước hiệu và bối cảnh Do Thái.
- source_word: χαίρετε
  choice: hãy vui mừng
  rationale: Giữ rõ sắc thái mệnh lệnh và tạo liên kết từ vựng với χαρῆτε ở cuối câu.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt gọn và tự nhiên quan hệ mục đích hoặc kết quả của mệnh đề Hy Lạp.
- source_word: ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ
  choice: khi vinh quang của ngài được bày tỏ
  rationale: Chuyển danh từ ἀποκάλυψις thành cấu trúc động từ tự nhiên trong tiếng Việt, vẫn giữ ý vinh quang vốn kín giấu được công khai hiển lộ.
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: anh em cũng được vui mừng hớn hở
  rationale: “Vui mừng” nối lại χαίρω, còn “hớn hở” chuyển tải sức nhấn mạnh và niềm vui dạt dào của ἀγαλλιάω mà không tạo câu gượng.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Dịch tước hiệu theo nghĩa của nó thay vì xử lý như một tên riêng, đồng thời cung cấp cách gọi quen thuộc hơn trong chú thích.
- issue: Bản chất của việc dự phần vào những đau khổ của Đấng Mê-si
  choice: dự phần vào những đau khổ của Đấng Mê-si
  alternative: chịu đau khổ vì Đấng Mê-si
  rationale: Bản dịch giữ nguyên quan hệ tham dự của câu Hy Lạp và không tự giới hạn nó thành nguyên nhân chịu khổ, cũng không hàm ý rằng tín hữu lặp lại công việc chuộc tội của Đấng Mê-si.
- issue: Quan hệ giữa niềm vui hiện tại và tương lai
  choice: hãy vui mừng ... để ... cũng được vui mừng hớn hở
  alternative: hãy vui mừng ... rồi ... sẽ vui mừng hớn hở
  rationale: Giữ ἵνα như quan hệ mục đích/kết quả và bảo tồn sự căng thẳng thần học giữa mệnh lệnh vui mừng hiện tại với niềm vui khi vinh quang được bày tỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp lời khuyên gửi cộng đồng; “ngài” tránh tự ý viết hoa đại từ nhưng vẫn giữ sắc thái tôn kính. Cấu trúc “bao nhiêu ... bấy nhiêu” làm rõ lực tỷ lệ của câu Hy Lạp; “vui mừng hớn hở” tự nhiên trong tiếng Việt và bảo tồn cả động từ chỉ vui mừng lẫn yếu tố tăng cường ở cuối câu.
