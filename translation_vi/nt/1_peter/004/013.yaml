- from: Nhưng anh em được dự phần vào những đau khổ của Đấng Mê-si[a] bao nhiêu thì hãy vui mừng bấy nhiêu, để khi vinh quang của ngài được bày tỏ[b], anh em cũng được vui mừng hớn hở.
  to: Nhưng anh em dự phần vào những đau khổ của Đấng Mê-si[a] bao nhiêu thì hãy vui mừng bấy nhiêu, để khi vinh quang của ngài được bày tỏ[b], anh em cũng vui mừng hớn hở.
  rationale: Chỉ chỉnh hai từ “được” để phản ánh rõ hơn cú pháp chủ động của nguyên ngữ và tạo tiếng Việt tự nhiên hơn. Cấu trúc tỷ lệ, quan hệ “để,” tước hiệu Đấng Mê-si, cùng sự phân biệt giữa niềm vui hiện tại và niềm vui tương lai đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
