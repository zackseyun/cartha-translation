id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: vi
  text: Anh chị em yêu dấu, đừng ngạc nhiên trước cơn thử luyện như lửa[a] đang diễn ra giữa anh chị em nhằm thử thách anh chị em, như thể có chuyện gì xa lạ đang xảy đến với anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cơn hoạn nạn như lửa giữa anh chị em… để thử nghiệm.” Từ Hy Lạp πυρώσει gợi nghĩa đen là sự nung đốt hoặc lửa; πειρασμός có thể có nghĩa là sự thử nghiệm, thử thách, hoặc trong những văn cảnh khác là sự cám dỗ.'
    reason: Nêu các khả năng từ vựng của hình ảnh lửa và thuật ngữ chỉ sự thử thách mà không làm mất nghĩa chính trong văn cảnh.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Anh chị em yêu dấu
  rationale: Lối xưng hô số nhiều này giữ được giọng mục vụ trìu mến và mối liên hệ từ vựng với tình yêu; “anh chị em” diễn đạt tự nhiên cộng đồng người nhận trong tiếng Việt hiện đại.
- source_word: ξενίζεσθε
  choice: đừng ngạc nhiên
  rationale: Động từ có thể chỉ sự ngạc nhiên hoặc coi điều gì là xa lạ. Cách dịch này tự nhiên, đồng thời vế sau với ξένου làm rõ ý ‘như thể xa lạ’.
- source_word: πυρώσει
  choice: cơn thử luyện như lửa
  rationale: Danh từ gợi trực tiếp sự nung đốt hoặc lửa. Cách dịch giữ hình ảnh lửa và truyền đạt tự nhiên ý một cảnh khổ đau có tính thử luyện, nhưng không xác định cụ thể nguồn hay hình thức của nó.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Trong lời nói với cả cộng đồng, cụm từ thích hợp nhất là ‘giữa anh chị em’; cách nói này vẫn bao gồm trải nghiệm của từng người.
- source_word: πρὸς πειρασμόν
  choice: để thử thách anh chị em
  rationale: Trong văn cảnh chịu khổ, πειρασμός nói đến việc thử nghiệm hay thử thách hơn là sự cám dỗ phạm tội. Chuyển thành mệnh đề mục đích giúp câu tiếng Việt rõ và tự nhiên.
- source_word: γινομένῃ
  choice: đang diễn ra
  rationale: Phân từ hiện tại bổ nghĩa cho πυρώσει, diễn tả điều đang xảy ra; ‘đang diễn ra’ giữ sắc thái tiếp diễn.
- source_word: ὡς ξένου
  choice: như thể có chuyện gì xa lạ
  rationale: ξένος có thể mang nghĩa xa lạ, khác thường hoặc không quen thuộc. ‘Xa lạ’ giữ được sự liên hệ ý nghĩa với ξενίζεσθε ở đầu câu.
- source_word: συμβαίνοντος
  choice: đang xảy đến
  rationale: Từ này chỉ một sự việc xảy ra hoặc xảy đến với ai; ‘xảy đến’ thể hiện rõ đối tượng chịu tác động mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của πειρασμός trong văn cảnh
  choice: sự thử thách/thử nghiệm
  alternative: sự cám dỗ
  rationale: Văn cảnh trực tiếp nói về đau khổ đang xảy ra giữa cộng đồng và tác dụng kiểm nghiệm của nó, nên ‘thử thách’ phù hợp hơn ‘cám dỗ’. Chú thích vẫn ghi nhận phạm vi nghĩa rộng hơn của từ Hy Lạp.
- issue: Hình ảnh của πυρώσει
  choice: giữ hình ảnh lửa mà không giải thích lửa là một biến cố cụ thể
  alternative: dịch diễn giải thành ‘sự bắt bớ dữ dội’ hoặc ‘lửa luyện lọc’
  rationale: Nguyên văn dùng hình ảnh nung đốt nhưng không xác định đây là một cuộc bắt bớ cụ thể, cũng không nói rõ tác nhân luyện lọc. Bản dịch giữ hình ảnh và sự căng thẳng thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có sắc thái mục vụ. Dùng “anh chị em” để nói với cộng đồng hỗn hợp; giữ sự lặp lại nhằm phản ánh trọng tâm hướng đến người nhận. Cụm “cơn thử luyện như lửa” vừa dễ hiểu vừa bảo tồn hình ảnh mạnh của nguyên văn.
