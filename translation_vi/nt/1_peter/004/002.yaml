id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: vi
  text: để người ấy không còn sống quãng đời còn lại trong thân xác[a] theo những ham muốn của con người, nhưng theo ý muốn của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong thân thể”. Cụm từ Hy Lạp được dịch là “trong thân xác” ở đây chỉ đời sống trần thế trong thân thể, không nhất thiết có nghĩa là “bản tính tội lỗi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: để
  rationale: Giới từ đi với động từ nguyên mẫu có mạo từ diễn tả mục đích hoặc kết quả liên hệ với câu trước; “để” tự nhiên và giữ được lực mục đích trong tiếng Việt.
- source_word: μηκέτι
  choice: không còn
  rationale: Diễn tả việc chấm dứt một nếp sống trước đây.
- source_word: ἀνθρώπων
  choice: của loài người
  rationale: Dạng sở hữu số nhiều mang nghĩa khái quát về con người, không chỉ riêng nam giới.
- source_word: ἐπιθυμίαις
  choice: những ham muốn
  rationale: Từ này có nghĩa rộng là các dục vọng hoặc ham muốn; “ham muốn” không thu hẹp nghĩa vào dục vọng tình dục như một số cách dịch khác.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Giữ sự tương phản mạnh giữa những ham muốn của con người và ý muốn của Đức Chúa Trời.
- source_word: θελήματι θεοῦ
  choice: theo ý muốn của Đức Chúa Trời
  rationale: Trong thế đối ứng với ἐπιθυμίαις, cụm từ chỉ chuẩn mực hoặc định hướng chi phối đời sống; “theo” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: trong quãng đời còn lại
  rationale: Kết hợp tự nhiên với βιῶσαι trong tiếng Việt và diễn đạt thời gian còn lại của đời sống nhân vật số ít được tiếp nối từ ngữ cảnh trước.
- source_word: ἐν σαρκὶ
  choice: nơi thân xác
  rationale: Ở đây σάρξ chỉ sự sống trần thế có thân xác, không nhất thiết mang nghĩa đạo đức là “bản tính tội lỗi.” Cách dịch giữ hình ảnh thân xác mà vẫn tự nhiên trong tiếng Việt.
- source_word: βιῶσαι
  choice: sống
  rationale: Động từ nói đến việc sống hoặc trải qua quãng đời; “sống” rõ ràng và phù hợp nhất trong cấu trúc tiếng Việt.
theological_decisions:
- issue: Nghĩa của σάρξ trong ἐν σαρκὶ
  choice: đời sống trần thế trong thân xác
  alternative: bản tính tội lỗi
  rationale: Ngữ cảnh nói về quãng đời còn lại của tín hữu trong tình trạng hữu thể có thân xác. Tuy câu văn đối lập nếp sống cũ với sự vâng theo ý Đức Chúa Trời, chính cụm ἐν σαρκὶ không nhất thiết chỉ một nguyên lý tội lỗi bên trong.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chủ ngữ “người ấy” được nêu rõ theo nhân vật số ít ngầm hiểu từ ngữ cảnh trước; cấu trúc “không còn... nhưng...” bảo toàn phép đối lập của nguyên văn.
