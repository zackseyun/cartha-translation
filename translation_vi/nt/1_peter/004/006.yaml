id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: vi
  text: 'Vì lý do này mà tin mừng cũng đã được rao truyền cho những người chết: để họ, tuy bị xét xử theo loài người[a] trong xác thịt, có thể sống theo Đức Chúa Trời trong tâm linh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “theo loài người”; cũng có thể hiểu là “theo chuẩn mực loài người” hoặc “theo cách người ta đánh giá.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong linh.” Cụm từ có thể chỉ bình diện của sự sống thuộc linh, đối lập với “trong xác thịt”; một số người hiểu cụ thể hơn là sự sống nhờ Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: chính bởi mục đích này
  rationale: Giữ sắc thái hướng đến mục đích của cụm từ Hy Lạp và nối câu này với lập luận đi trước, thay vì chỉ diễn đạt một nguyên nhân chung chung.
- source_word: νεκροῖς
  choice: cho những người chết
  rationale: Tính từ số nhiều được dùng như danh từ. Cách dịch này tự nhiên trong tiếng Việt và không xác định họ chết về thể chất hay theo một nghĩa khác.
- source_word: εὐηγγελίσθη
  choice: tin mừng cũng đã được rao truyền
  rationale: Dạng bị động của εὐαγγελίζω; cách diễn đạt làm rõ nội dung tin mừng vốn được hàm ý trong động từ mà không thêm một đối tượng thần học cụ thể.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt quan hệ mục đích hoặc kết quả dự kiến của mệnh đề.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: tuy bị xét xử ... họ vẫn sống
  rationale: Diễn đạt tự nhiên thế đối lập μὲν…δὲ trong tiếng Việt, đồng thời giữ thể bị động của ‘bị xét xử’ và thể chủ động của ‘sống’.
- source_word: κατὰ ἀνθρώπους
  choice: theo chuẩn mực loài người
  rationale: κατά với đối cách chỉ chuẩn mực hoặc góc nhìn. ‘Loài người’ mang nghĩa đại diện, bao gồm mọi người, và đối lập rõ với ‘Đức Chúa Trời’.
- source_word: σαρκὶ
  choice: trong xác thịt
  rationale: Giữ hình ảnh và sự song song với πνεύματι; tại đây ‘xác thịt’ chỉ bình diện tồn tại hữu hình, thân xác, chứ không nhất thiết có nghĩa ‘bản tính tội lỗi’.
- source_word: κατὰ θεὸν
  choice: theo Đức Chúa Trời
  rationale: Giữ nguyên sự song song có chủ ý với κατὰ ἀνθρώπους và không thu hẹp nghĩa thành ‘theo ý muốn’ hay ‘trước mặt’ Đức Chúa Trời.
- source_word: πνεύματι
  choice: trong tâm linh
  rationale: Hiểu cách ba là chỉ bình diện hoặc lĩnh vực sống, song vẫn ghi nhận khả năng liên hệ cụ thể đến Thánh Linh trong chú thích.
theological_decisions:
- issue: Danh tính của ‘những người chết’
  choice: Dịch trung tính là ‘những người chết’, không xác định họ ở trong tình trạng nào khi nghe tin mừng.
  alternative: Những người hiện đã chết nhưng nghe tin mừng khi còn sống; những người chết về mặt thuộc linh; hoặc những người chết có liên hệ với lời công bố trong 3:19.
  rationale: Câu Hy Lạp không tự giải quyết cuộc tranh luận này; bản dịch giữ sự mơ hồ thực sự của nguyên văn.
- issue: Ý nghĩa của thế đối lập giữa bị xét xử và sống
  choice: Giữ cấu trúc ‘theo chuẩn mực loài người trong xác thịt’ đối lập với ‘theo Đức Chúa Trời trong tâm linh’.
  alternative: Bị con người lên án trong đời sống thể xác; chịu cái chết thể chất như mọi người; hoặc bị Đức Chúa Trời xét xử trong xác thịt nhưng sống về tâm linh.
  rationale: Nguyên văn cho phép nhiều cách hiểu gần nhau về chủ thể và bản chất của sự xét xử; không nên đưa một cách giải thích riêng vào chính văn.
- issue: πνεύματι chỉ tâm linh hay Thánh Linh
  choice: Dùng ‘trong tâm linh’ trong chính văn.
  alternative: ‘Trong linh’ hoặc ‘nhờ Thánh Linh’.
  rationale: Cách ba song song với σαρκὶ có thể chỉ lĩnh vực sống thuộc linh; nguyên văn không minh nhiên nêu ‘Thánh Linh’, nên khả năng ấy được giữ trong chú thích thay vì quyết định trong chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘tin mừng’ theo nghĩa thông thường của εὐαγγέλιον/εὐαγγελίζω; giữ ‘xác thịt’ và ‘tâm linh’ để bảo toàn thế đối lập của nguyên văn. Dấu chú thích được đặt ngay sau cụm từ mà mỗi chú thích giải thích.
