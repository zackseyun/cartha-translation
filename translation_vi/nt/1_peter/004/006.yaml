    issue: “chính bởi mục đích này” dịch sai lực của εἰς τοῦτο.
    rationale: Trong ngữ cảnh, εἰς τοῦτο γάρ giới thiệu lý do/giải thích cho điều vừa nói (“vì lý do này”), không nêu một mục tiêu theo nghĩa “bởi mục đích này.”
  - severity: medium
    issue: “để tuy bị xét xử …, họ vẫn sống” làm yếu sắc thái giả định của ζῶσι dưới ἵνα.
    rationale: ζῶσι là hiện tại giả định trong mệnh đề ἵνα. “có thể sống” phản ánh tự nhiên hơn mục đích/kết quả được nêu, trong khi vẫn giữ thế đối lập với “bị xét xử.”
