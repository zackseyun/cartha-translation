  terminology: “Hiếu khách” là lựa chọn chính xác, thông dụng cho φιλόξενοι. “Than phiền” diễn đạt tốt γογγυσμός là sự phàn nàn bất mãn; chú thích giữ phương án “phàn nàn” như một lựa chọn từ vựng gần nghĩa.
