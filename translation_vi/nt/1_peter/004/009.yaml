  text: Be hospitable to one another without grumbling[a].
translation:
  language: vi
  text: Hãy hiếu khách với nhau, không than phiền.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Hãy tiếp đãi nhau mà không phàn nàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλόξενοι
  choice: Hãy hiếu khách
  rationale: Tính từ φιλόξενοι được dùng với lực mệnh lệnh trong mạch văn. “Hãy hiếu khách” vừa giữ được dạng phẩm chất của nguyên ngữ, vừa diễn đạt tự nhiên như một lời khuyên dạy trong tiếng Việt hiện đại.
- source_word: εἰς ἀλλήλους
  choice: với nhau
  rationale: Cụm từ chỉ hướng tương hỗ giữa các thành viên trong cộng đồng. “Với nhau” tự nhiên và giữ rõ ý qua lại.
- source_word: ἄνευ
  choice: không chút
  rationale: ἄνευ biểu thị sự vắng mặt. Trong câu khuyên dạy này, “không chút” diễn đạt mạnh và tự nhiên yêu cầu không kèm theo thái độ càu nhàu.
- source_word: γογγυσμοῦ
  choice: càu nhàu
  rationale: Từ này chỉ sự than phiền, lẩm bẩm vì bất mãn. “Càu nhàu” là cách nói hiện đại, dễ hiểu và phù hợp với bối cảnh phục vụ nhau; “phàn nàn” là phương án rộng nghĩa hơn.
theological_decisions: []
translation_notes:
  register: Lối văn khuyên dạy trực tiếp, trang trọng vừa phải và dễ hiểu. “Hiếu khách” giữ sát phẩm chất được nêu bằng tính từ trong nguyên ngữ; chú thích cung cấp cách diễn đạt thiên về hành động và phương án từ vựng khác cho γογγυσμοῦ.
