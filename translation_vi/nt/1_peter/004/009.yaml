    rationale: γογγυσμός chỉ sự than phiền, lẩm bẩm bất mãn trong cộng đồng. “Càu nhàu” có thể gợi sự cằn nhằn vụn vặt và kém phù hợp hơn với văn phong thư tín hiện đại.
