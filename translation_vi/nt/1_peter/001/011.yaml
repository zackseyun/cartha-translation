id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: vi
  text: họ tìm hiểu xem Thần Khí của Đấng Mê-si ở trong họ đang cho biết về người nào hoặc thời kỳ nào, khi Ngài làm chứng từ trước về những đau khổ dành cho Đấng Mê-si[a] và những vinh quang tiếp theo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những đau khổ của Đấng Mê-si.”'
    reason: Bảo lưu cách hiểu khả hữu của cụm τὰ εἰς Χριστὸν παθήματα.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: họ tìm hiểu
  rationale: Phân từ tiếp nối hoạt động của các nhà tiên tri ở câu trước; “tìm hiểu” tự nhiên trong tiếng Việt và vẫn giữ sắc thái tra xét.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: xem ... người nào hay thời kỳ nào
  rationale: 'Giữ nguyên hai hướng tìm hiểu của câu Hy Lạp: một đối tượng mang tính nhân thân và một thời kỳ, thay vì quy cả cụm thành câu hỏi thuần túy về thời gian.'
- source_word: ἐδήλου
  choice: đang chỉ về
  rationale: Thì chưa hoàn thành diễn tả hành động chỉ dẫn đang tiếp diễn; cách nói này phù hợp tự nhiên với cả “người nào” và “thời kỳ nào”.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: Thần Khí của Đấng Mê-si ở trong họ
  rationale: Giữ trực tiếp mối liên hệ giữa Thần Khí và Đấng Mê-si, đồng thời bảo toàn ý Thần Khí hiện diện trong các nhà tiên tri.
- source_word: προμαρτυρόμενον
  choice: khi Ngài làm chứng trước
  rationale: Giữ cả nghĩa làm chứng và tiền tố chỉ thời gian “trước”; đại từ “Ngài” thích hợp với cách nói tôn kính về Thần Khí trong tiếng Việt.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: những đau khổ dành cho Đấng Mê-si
  rationale: Phản ánh giới từ εἰς mà không thêm ý “đã được định sẵn”; cách hiểu quen thuộc “những đau khổ của Đấng Mê-si” được giữ trong chú thích vì cấu trúc có thể được hiểu theo cách ấy.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: những vinh quang sau đó
  rationale: Giữ số nhiều của δόξας và trình tự thời gian sau những đau khổ, đồng thời diễn đạt gọn, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa “Thần Khí của Đấng Mê-si” và các nhà tiên tri
  choice: Giữ cách nói trực tiếp “Thần Khí của Đấng Mê-si ở trong họ”.
  alternative: Thần Khí tiên tri nói về Đấng Mê-si; Thần Khí do Đấng Mê-si ban.
  rationale: Nguyên văn trình bày Thần Khí gắn với Đấng Mê-si đang hoạt động trong các nhà tiên tri; bản dịch không giản lược hay giải quyết thêm bản chất của mối liên hệ ấy.
- issue: Ý nghĩa của εἰς trong τὰ εἰς Χριστὸν παθήματα
  choice: Dịch “những đau khổ dành cho Đấng Mê-si” trong chính văn.
  alternative: “những đau khổ của Đấng Mê-si”; “những đau khổ liên quan đến Đấng Mê-si”.
  rationale: Cách dịch chính giữ dấu vết của giới từ εἰς, còn chú thích bảo lưu cách hiểu sở hữu vốn phù hợp mạnh với văn cảnh và rất quen thuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” cho Χριστός khi là tước hiệu; “Thần Khí” giúp phân biệt πνεῦμα mang nghĩa thần linh với “tinh thần” thông thường. Cấu trúc câu giữ liên hệ với câu trước vì nguyên văn là một phân từ tiếp diễn.
