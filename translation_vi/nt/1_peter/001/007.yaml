revisions:
- from: để sự chân thật đã được thử nghiệm của đức tin anh chị em—quý hơn vàng là thứ sẽ tiêu tan, dù được thử bằng lửa—được nhận thấy là dẫn đến sự ngợi khen, vinh quang và tôn trọng khi Đức Giê-su, Đấng Mê-si-a, được mặc khải.[a][b][c]
  to: để tính xác thực của đức tin anh chị em, đã được chứng thực qua thử nghiệm—quý hơn vàng, dù vàng sẽ hư mất nhưng vẫn được thử luyện bằng lửa—có thể được thấy là đem lại sự ngợi khen, vinh quang và vinh dự khi Đức Giê-su, Đấng Mê-si-a, được mặc khải.[a][b][c]
  rationale: Các sửa đổi cải thiện tính tự nhiên và độ chính xác ngữ nghĩa mà không thêm cách giải thích thần học. Bản sửa giữ phép so sánh, vai trò của lửa trong việc thử vàng, tính thời gian của ἐν ἀποκαλύψει, và sự mơ hồ có chủ ý của bộ ba “ngợi khen, vinh quang và vinh dự”.
