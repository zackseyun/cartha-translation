id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: vi
  text: để tính xác thực của đức tin anh chị em, đã được chứng thực qua thử nghiệm—quý hơn vàng, dù vàng sẽ hư mất nhưng vẫn được thử luyện bằng lửa—có thể được thấy là đem lại sự ngợi khen, vinh quang và vinh dự khi Đức Giê-su, Đấng Mê-si-a, được mặc khải.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “việc thử nghiệm đức tin của anh chị em”; từ Hy Lạp có thể nhấn mạnh quá trình thử nghiệm hoặc tính xác thực được chứng thực qua thử nghiệm.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “Đức Giê-su Christ.” Ở đây, “Đấng Mê-si-a” dịch tước hiệu Χριστός theo ý nghĩa của từ này.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch sát hơn: “có thể được thấy là để đem lại”.'
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: sự chân thật đã được thử nghiệm
  rationale: Danh từ này trong ngữ cảnh nhấn mạnh phẩm chất chân thật được chứng minh qua thử thách, nhưng cũng có thể chỉ chính quá trình thử nghiệm; bản chính ưu tiên sắc thái kết quả.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong ngữ cảnh, điều được thử nghiệm là đức tin của các tín hữu; đây là cách dịch tự nhiên và không thu hẹp nghĩa thành sự trung tín.
- source_word: πολυτιμότερον
  choice: quý hơn
  rationale: Giữ trực tiếp phép so sánh về giá trị với vàng bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: χρυσίου
  choice: vàng
  rationale: Cách dịch trực tiếp danh từ trong cấu trúc so sánh.
- source_word: ἀπολλυμένου
  choice: sẽ tiêu tan
  rationale: Giữ sức động của phân từ và nêu bật tính không bền vững của vàng, đối lập với giá trị của đức tin được thử nghiệm.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: được thử bằng lửa
  rationale: Diễn đạt phương tiện thử nghiệm một cách gọn và tự nhiên, đồng thời giữ liên hệ từ vựng với δοκίμιον.
- source_word: εὑρεθῇ εἰς
  choice: được nhận thấy là dẫn đến
  rationale: Giữ hình thức bị động của εὑρεθῇ và diễn đạt εἰς như kết quả, không xác định thêm ai ban hay nhận bộ ba tiếp theo.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: sự ngợi khen, vinh quang và tôn trọng
  rationale: Giữ nguyên bộ ba và sự mơ hồ của nguyên văn về đối tượng hoặc nguồn của những điều này.
- source_word: ἐν ἀποκαλύψει
  choice: khi ... được mặc khải
  rationale: Chuyển cấu trúc danh từ thành mệnh đề thời gian tự nhiên trong tiếng Việt, phù hợp nghĩa thời điểm của giới từ trong ngữ cảnh.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Dịch Χριστός theo nghĩa tước hiệu 'Đấng Mê-si-a', đồng thời dùng hình thức kính trọng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: “sự chân thật đã được thử nghiệm của đức tin” chỉ phẩm chất chân thật được bày tỏ qua thử thách
  alternative: “việc thử nghiệm đức tin” nhấn mạnh quá trình thử nghiệm
  rationale: Trong phép so sánh với vàng được thử bằng lửa, δοκίμιον có khả năng thiên về phẩm chất đã được chứng minh; chú thích giữ lại khả năng chỉ quá trình.
- issue: Đối tượng hoặc nguồn của “sự ngợi khen, vinh quang và tôn trọng”
  choice: Giữ không xác định như nguyên văn
  alternative: Danh dự được ban cho tín hữu; lời ngợi khen hướng về Đức Chúa Trời hoặc Đấng Mê-si-a; hay sự minh chứng cánh chung kết hợp cả hai
  rationale: Câu Hy Lạp không nói rõ ai nhận hoặc ban bộ ba này, nên bản dịch không áp đặt một cách hiểu thần học.
- issue: Cách hiểu ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ
  choice: “khi Đức Giê-su, Đấng Mê-si-a, được mặc khải”
  alternative: “trong sự mặc khải của Đức Giê-su, Đấng Mê-si-a”
  rationale: Cách dịch theo thời gian tự nhiên hơn trong tiếng Việt và không giải thích thêm bản chất của biến cố mặc khải.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ὑμῶν mà không giả định giới tính; dùng “Đức Giê-su” và “Đấng Mê-si-a” theo lối gọi kính trọng, phổ thông. Các dấu gạch ngang giữ phần so sánh chen giữa và giúp người đọc theo dõi cấu trúc câu dài.
