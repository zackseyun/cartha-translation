    rationale: καταβολή κόσμου nói cụ thể về việc đặt nền/móng của thế giới, không chỉ khái quát về sự sáng tạo.
  - severity: low
    issue: “vì anh chị em” có thể bị đọc theo nghĩa nguyên nhân.
    rationale: δι’ ὑμᾶς ở đây diễn tả lợi ích hay mục đích dành cho người nhận; “vì lợi ích của anh chị em” làm rõ nghĩa này mà không thêm diễn giải thần học.
