  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: vi
  text: Ngài đã được biết trước trước khi thế giới được đặt nền[a], nhưng đã được bày tỏ vào thời kỳ cuối cùng vì lợi ích của anh chị em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “đã được chọn trước”; tiếng Hy Lạp nói “đã được biết trước”, có thể hàm ý ý định của Đức Chúa Trời nhưng không buộc phải diễn giải đầy đủ như vậy trong chính văn.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong những thời kỳ cuối cùng này.”'
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: đã được biết trước
  rationale: Giữ nghĩa trực tiếp của động từ προγινώσκω và dạng bị động của phân từ, đồng thời không tự ý chuyển thành ý mạnh hơn là “được chọn trước”.
- source_word: πρὸ καταβολῆς κόσμου
  choice: từ trước khi sáng thế
  rationale: Diễn đạt tự nhiên thành ngữ chỉ thời điểm trước khi thế giới được dựng nên, đồng thời giữ sắc thái tiền sáng thế.
- source_word: φανερωθέντος
  choice: đã được bày tỏ
  rationale: Phản ánh dạng bị động và ý nghĩa được làm cho hiển hiện, được công khai tỏ ra; cách nói trang trọng nhưng vẫn dễ hiểu.
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: vào thời kỳ cuối cùng
  rationale: Giữ sắc thái cánh chung và ý “ở phần cuối của các thời kỳ” mà không thêm từ chỉ định “này” vốn không có minh nhiên trong tiếng Hy Lạp.
- source_word: δι’ ὑμᾶς
  choice: vì anh chị em
  rationale: διά với đối cách ở đây chỉ điều được thực hiện vì lợi ích của người nhận; “vì anh chị em” tự nhiên và thể hiện sắc thái ấy.
theological_decisions:
- issue: Ý nghĩa của προεγνωσμένου khi nói về Đấng Christ trước sáng thế
  choice: Dịch “đã được biết trước” trong chính văn.
  alternative: đã được chọn trước; đã được định trước
  rationale: Cách dịch này bảo toàn từ ngữ và sự căng thẳng thần học của nguyên văn, không đồng nhất sự biết trước với tuyển chọn hay tiền định.
- issue: Sắc thái thời gian của ἐπ’ ἐσχάτου τῶν χρόνων
  choice: Dịch “vào thời kỳ cuối cùng”.
  alternative: trong những thời kỳ cuối cùng này
  rationale: Nguyên văn mang ý nghĩa cánh chung nhưng không nói rõ “này”; bản dịch chính tránh thêm sắc thái chỉ định, còn cách hiểu quen thuộc hơn được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” nối với đối tượng được nói đến ở câu 19; “anh chị em” diễn đạt đại từ số nhiều ὑμᾶς theo lối bao hàm giới tính. Cấu trúc đối lập “nhưng” phản ánh μέν…δέ.
