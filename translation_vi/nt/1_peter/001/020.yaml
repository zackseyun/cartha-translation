revisions:
- from: Ngài đã được biết trước từ trước khi sáng thế[a], nhưng đã được bày tỏ vào thời kỳ cuối cùng vì anh chị em[b].
  to: Ngài đã được biết trước trước khi thế giới được đặt nền[a], nhưng đã được bày tỏ vào thời kỳ cuối cùng vì lợi ích của anh chị em[b].
  rationale: Sửa nhẹ để phản ánh rõ hơn πρὸ καταβολῆς κόσμου (“trước khi thế giới được đặt nền”) và làm sáng tỏ sắc thái ích lợi của δι’ ὑμᾶς. Các lựa chọn còn lại và cả hai chú thích giữ nguyên vì trung thành với nguyên văn và không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
