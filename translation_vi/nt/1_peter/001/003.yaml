id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: vi
  text: Đáng chúc tụng thay Đức Chúa Trời, Cha của Chúa chúng ta là Đức Chúa Giê-su, Đấng Mê-si[a]! Theo lòng thương xót lớn lao của Ngài, Ngài đã khiến chúng ta được sinh lại[b] để có một niềm hy vọng sống động, nhờ sự sống lại của Đức Chúa Giê-su, Đấng Mê-si, từ cõi chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đức Chúa Giê-su Christ.” Từ Hy Lạp Χριστός là một tước hiệu.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đã ban cho chúng ta sự tái sinh.” Động từ Hy Lạp giữ hình ảnh về việc được sinh ra lần nữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Đáng chúc tụng thay
  rationale: Diễn đạt tự nhiên sắc thái tôn vinh của tính từ vị ngữ trong lời chúc tụng, thay vì chỉ mô tả là “được ban phước”.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Đức Chúa Trời, là Đức Chúa Trời và Cha
  rationale: Giữ cả hai danh từ và quan hệ thần học của công thức Hy Lạp; việc lặp “Đức Chúa Trời” làm rõ trong tiếng Việt rằng Ngài vừa là Đức Chúa Trời vừa là Cha của Chúa Jêsus.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ κύριος như một tước hiệu có nội dung thần học, không hạ xuống thành cách xưng hô lịch sự.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Giữ Jêsus là tên riêng quen thuộc trong văn phong Kinh Thánh Việt ngữ và dịch Χριστός theo nghĩa tước hiệu “Đấng Mê-si”, tránh coi đó chỉ như một họ tên.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: Theo lòng thương xót lớn lao của Ngài
  rationale: “Theo” bảo toàn sắc thái chuẩn mực hoặc mức độ của κατά; “lớn lao” chuyển đạt πολὺ tự nhiên.
- source_word: ἀναγεννήσας
  choice: đã khiến chúng ta được sinh lại
  rationale: Giữ hình ảnh sinh ra lần nữa cùng vai trò chủ động của Đức Chúa Trời; cấu trúc này không hàm ý con người tự làm mình tái sinh.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: để có một niềm hy vọng sống động
  rationale: Diễn đạt đích đến hoặc kết quả của εἰς bằng tiếng Việt tự nhiên, đồng thời giữ hình ảnh “sống động” của ζῶσαν.
- source_word: δι’ ἀναστάσεως
  choice: nhờ sự sống lại
  rationale: “Nhờ” biểu thị phương tiện hay căn nguyên trung gian của διά với sở hữu cách.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói Việt ngữ gọn, tự nhiên trong ngữ cảnh phục sinh, biểu đạt việc sống lại khỏi tình trạng và phạm vi của sự chết.
theological_decisions:
- issue: Cách dịch Χριστός như tước hiệu Cơ Đốc học
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: “Đấng Mê-si” làm rõ đây là tước hiệu chỉ Đấng được xức dầu, đồng thời chú thích hình thức truyền thống Việt ngữ để người đọc nhận biết phương án quen thuộc.
- issue: Vai trò chủ động của Đức Chúa Trời trong ἀναγεννήσας
  choice: Ngài đã khiến chúng ta được sinh lại
  alternative: Ngài đã ban cho chúng ta sự tái sinh
  rationale: Bản dịch giữ Đức Chúa Trời là chủ thể hành động và bảo toàn ẩn dụ sinh nở, nhưng không suy diễn thành một hệ thống giáo lý rộng hơn điều câu văn khẳng định.
- issue: Quan hệ của εἰς ἐλπίδα ζῶσαν với sự sinh lại
  choice: để có một niềm hy vọng sống động
  alternative: vào trong một niềm hy vọng sống động
  rationale: Chọn cách diễn đạt mục đích/kết quả tự nhiên trong tiếng Việt; không quyết định quá mức liệu εἰς nhấn mạnh đích đến hay kết quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời”, “Chúa”, “Ngài” và “Đức Chúa Jêsus” theo lối Kinh Thánh Việt ngữ trang nghiêm; tách lời chúc tụng thành câu cảm thán để tránh một câu quá dài, nhưng vẫn giữ các quan hệ cú pháp và thần học của nguyên văn.
