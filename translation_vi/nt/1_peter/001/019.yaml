  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: vi
  text: nhưng bằng huyết quý báu của Đấng Mê-si-a, như huyết của một chiên con không khuyết tật và không vết nhơ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Đánh dấu sự tương phản mạnh với ý phủ định ở câu trước; “nhưng” tự nhiên và giữ được liên kết cú pháp.
- source_word: τιμίῳ
  choice: quý báu
  rationale: Diễn tả cả giá trị cao và sự đáng quý, đồng thời phù hợp với văn phong trang trọng khi nói về huyết.
- source_word: αἵματι
  choice: huyết
  rationale: Giữ danh từ cụ thể của nguyên văn và sắc thái trang trọng, Kinh Thánh; hàm ý về cái chết hiến tế không được dùng để thay thế chính danh từ này.
- source_word: ὡς
  choice: như huyết của
  rationale: Làm rõ một cách tự nhiên trong tiếng Việt rằng phép so sánh liên hệ đến huyết, đồng thời không xóa bỏ hình ảnh Đấng Mê-si như chiên con.
- source_word: ἀμνοῦ
  choice: một chiên con
  rationale: Cách dịch trực tiếp, dễ hiểu; hình ảnh lễ tế và Lễ Vượt Qua vẫn được để hàm ẩn như trong nguyên văn.
- source_word: ἀμώμου
  choice: không khuyết tật
  rationale: Phù hợp với từ vựng về con vật dâng tế đạt chuẩn hơn cách diễn đạt thuần túy đạo đức như “không chỗ trách được”.
- source_word: καὶ
  choice: và
  rationale: Giữ quan hệ phối hợp đơn giản giữa hai tính chất.
- source_word: ἀσπίλου
  choice: không vết nhơ
  rationale: Giữ nét nghĩa riêng so với ἀμώμου và tái hiện cặp mô tả song song mà vẫn tự nhiên trong tiếng Việt.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Ở đây Χριστός mang chức năng tước hiệu; “Đấng Mê-si” làm sáng rõ ý nghĩa của tước hiệu, còn cách gọi truyền thống “Đấng Ki-tô” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Ngữ cảnh dùng Χριστός như một tước hiệu chỉ Đấng được xức dầu. Bản chính giữ nghĩa của tước hiệu, còn chú thích bảo lưu cách phiên âm truyền thống quen thuộc.
- issue: Quan hệ giữa Đấng Mê-si và hình ảnh chiên con
  choice: “huyết của Đấng Mê-si, như huyết của một chiên con”
  alternative: “huyết quý báu, như huyết của một chiên con… tức là huyết của Đấng Mê-si”
  rationale: Cách chọn diễn đạt tự nhiên quan hệ so sánh trong tiếng Việt mà không biến phép ví sánh thành một lời đồng nhất hóa giải thích quá mức; hình ảnh hiến tế vẫn được giữ nguyên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “huyết” thay vì “máu” để phù hợp ngữ vực Kinh Thánh và cụm từ nói về sự hiến tế; cấu trúc vẫn là một mệnh đề tiếp nối câu 18.
