source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: vi
  text: 'vì mọi xác thịt đều như cỏ[a],

    và mọi vinh quang của xác thịt[b] đều như hoa cỏ;

    cỏ khô héo,

    và hoa rụng xuống.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “toàn thể loài người.” Tiếng Hy Lạp nói “mọi xác thịt,” vọng lại Ê-sai 40:6 và nhấn mạnh thân phận hữu hạn, phải chết của con người.
    reason: lexical_alternative
  - marker: b
    text: Hay “mọi vẻ huy hoàng của xác thịt.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: vì
  rationale: Giữ rõ quan hệ nguyên nhân với lời khẳng định ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: πᾶσα σὰρξ
  choice: mọi xác thịt
  rationale: Giữ hình ảnh nguyên văn và âm hưởng của Ê-sai 40:6; ở đây cụm từ chỉ toàn thể loài người trong thân phận hữu hạn, không chỉ bản tính tội lỗi.
- source_word: ὡς χόρτος
  choice: đều như cỏ
  rationale: Diễn đạt tự nhiên phép so sánh về sự chóng qua; thêm “đều” để tương ứng với πᾶσα và làm câu Việt trôi chảy.
- source_word: πᾶσα δόξα αὐτῆς
  choice: mọi vinh quang của xác thịt
  rationale: “Vinh quang” giữ chiều rộng ngữ nghĩa của δόξα. Lặp lại “xác thịt” thay cho đại từ “nó” để tránh cách gọi con người thiếu tự nhiên trong tiếng Việt, đồng thời vẫn giữ đúng sở thuộc của αὐτῆς.
- source_word: ὡς ἄνθος χόρτου
  choice: đều như hoa cỏ
  rationale: “Hoa cỏ” là hình ảnh gọn, tự nhiên và vẫn phản ánh kết cấu “hoa của cỏ/thảm cỏ” trong nguyên văn.
- source_word: ἐξηράνθη
  choice: khô héo
  rationale: Bao hàm ý cỏ mất nước và héo tàn, phù hợp với hình ảnh thơ của lời trích dẫn.
- source_word: ἐξέπεσεν
  choice: rụng xuống
  rationale: Diễn đạt tự nhiên việc hoa lìa khỏi cây rồi rơi, giữ sắc thái của động từ ἐκπίπτω.
theological_decisions:
- issue: Cách dịch σάρξ trong lời trích dẫn nói về sự hữu hạn của con người
  choice: mọi xác thịt
  alternative: toàn thể loài người
  rationale: Ngữ cảnh nhấn mạnh tính mong manh và chóng qua của đời người chứ không nói trực tiếp về sự bại hoại đạo đức. Giữ “xác thịt” bảo tồn hình ảnh và liên hệ với Ê-sai 40:6; chú thích cung cấp cách hiểu tự nhiên hơn.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu, giữ nhịp thơ song song của lời trích dẫn. Dùng “xác thịt” có chủ ý để bảo tồn hình ảnh Kinh Thánh, kèm chú thích giải nghĩa. Dấu chấm phẩy duy trì dòng lập luận của một câu thống nhất.
