  terminology: “Đức Thánh Linh,” “tin mừng,” và “thiên sứ” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích a nên dùng thuật ngữ ngữ pháp hiện đại “cách cho,” thay vì “cách dữ.”
  issues:
