id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: vi
  text: Các nhà tiên tri ấy đã được mặc khải rằng họ phục vụ không phải cho chính mình nhưng cho anh chị em qua những điều ấy[a]. Nay, những điều ấy đã được công bố cho anh chị em qua những người đã rao truyền tin mừng cho anh chị em[b], nhờ Đức Thánh Linh được sai từ trời—những điều mà các thiên sứ hằng khao khát cúi xuống để nhìn vào[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ phục vụ không phải cho chính mình, nhưng cho anh chị em”; cách cho trong tiếng Hy Lạp chỉ người hưởng lợi từ sự phục vụ của các nhà tiên tri.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “qua những người công bố Tin Mừng cho anh chị em.” Tiếng Hy Lạp dùng động từ có nghĩa là “rao báo tin mừng.”'
    reason: lexical_alternative
  - marker: c
    text: “Cúi xuống để nhìn vào” cũng có thể dịch là “chăm chú nhìn vào”; động từ Hy Lạp gợi hình ảnh cúi xuống để nhìn kỹ, diễn tả sự quan sát tha thiết.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: Các nhà tiên tri ấy đã được mặc khải
  rationale: Đại từ quan hệ số nhiều chỉ lại các nhà tiên tri ở câu trước. Cách dịch nêu rõ đối tượng để câu tiếng Việt tự nhiên, đồng thời giữ thể bị động và sắc thái mặc khải.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν
  choice: họ không phục vụ chính mình, nhưng phục vụ anh chị em
  rationale: Giữ sự tương phản rõ nét giữa hai bổ ngữ cách dữ và diễn đạt διακονέω bằng từ phổ thông “phục vụ”; thì chưa hoàn thành được thể hiện tự nhiên qua văn cảnh quá khứ.
- source_word: αὐτά
  choice: trong những điều đó
  rationale: Chỉ các thực tại tiên tri vừa được nói đến; “những điều đó” rõ hơn một đại từ đơn thuần.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Nay những điều ấy đã được công bố cho anh chị em
  rationale: Giữ νῦν là “nay,” thể bị động của động từ, và mối liên hệ giữa việc công bố đã diễn ra với người nghe hiện tại.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: qua những người rao truyền tin mừng cho anh chị em
  rationale: Chuyển tải nghĩa động từ εὐαγγελίζω bằng lối nói dễ hiểu, không biến nó thành một thuật ngữ giáo hội chuyên biệt.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: bởi Đức Thánh Linh được sai từ trời xuống
  rationale: Hiểu cách dữ theo nghĩa phương tiện/tác nhân trong việc rao truyền và giữ nguyên phân từ bị động nói về việc được sai từ trời.
- source_word: εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: là những điều mà các thiên sứ hằng khao khát cúi nhìn vào
  rationale: Giữ giới từ εἰς bằng “vào,” sắc thái ao ước liên tục của hiện tại, và hình ảnh παρακύπτω là cúi xuống để chăm chú nhìn.
theological_decisions:
- issue: Đối tượng của πνεύματι ἁγίῳ
  choice: Đức Thánh Linh là tác nhân thần linh trong việc rao truyền tin mừng
  alternative: một linh thiêng liêng hoặc năng lực thiêng liêng nói chung
  rationale: Văn cảnh lịch sử cứu chuộc và cụm “được sai từ trời xuống” phù hợp tự nhiên với Đức Thánh Linh; cách viết hoa và danh xưng không thêm nội dung ngoài câu.
- issue: Quan hệ giữa sự phục vụ của các nhà tiên tri và lời công bố cho độc giả
  choice: các nhà tiên tri phục vụ những người tin về sau qua những điều họ đã nói trước
  alternative: các nhà tiên tri chỉ phục vụ người cùng thời với mình
  rationale: Cấu trúc Hy Lạp trực tiếp đối lập “không cho chính mình, nhưng cho anh chị em” và nối lời tiên tri với tin mừng nay được công bố.
- issue: Phạm vi gắn kết của πνεύματι ἁγίῳ
  choice: Đức Thánh Linh là phương tiện hoặc tác nhân của những người rao truyền
  alternative: 'cụm từ diễn tả phạm vi: họ rao truyền trong Đức Thánh Linh'
  rationale: Cách hiểu công cụ phù hợp nhất trong mạch câu, nhưng bản dịch tránh giải thích thêm về cơ chế tác động.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” để chỉ cộng đồng độc giả số nhiều. “Đức Thánh Linh” là cách gọi quen thuộc và tôn kính trong tiếng Việt. Dấu gạch ngang giữ nhịp nhấn mạnh ở mệnh đề cuối; các chú thích bảo tồn những phương án từ vựng có ý nghĩa.
