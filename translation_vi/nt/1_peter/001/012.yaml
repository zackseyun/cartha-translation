    rationale: Các đại từ ἑαυτοῖς và ὑμῖν ở cách cho, nêu người hưởng lợi. Thêm “cho” trong câu chính giữ rõ quan hệ này, không chỉ để ở chú thích.
  - severity: low
    issue: “Từ trời xuống” thêm nét nghĩa hướng xuống.
    rationale: ἀπ’ οὐρανοῦ chỉ nguồn gốc “từ trời”; bỏ “xuống” bám sát nguồn hơn.
  - severity: low
    issue: Chú thích a dùng “cách dữ.”
    rationale: “Cách cho” là thuật ngữ ngữ pháp tiếng Việt hiện đại, rõ ràng hơn cho độc giả phổ thông.
