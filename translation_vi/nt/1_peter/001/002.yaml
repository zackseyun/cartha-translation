id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: vi
  text: 'theo sự biết trước[a] của Đức Chúa Trời là Cha, trong sự thánh hóa của Thánh Linh[b], để vâng phục và được rảy bằng huyết[c] của Chúa Giê-su, Đấng Mê-si-a: Nguyện ân điển và bình an gia tăng trên anh chị em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sự biết trước” dịch từ πρόγνωσις. Có cách hiểu nhấn mạnh việc Đức Chúa Trời biết từ trước, sự chọn lựa từ trước của Ngài, hoặc cả hai.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hy Lạp cũng có thể được hiểu là “bởi công việc thánh hóa của Thánh Linh.”
    reason: grammatical_alternative
  - marker: c
    text: Hình ảnh “rảy bằng huyết” có lẽ gợi lại nghi thức giao ước và thanh tẩy trong Cựu Ước, đặc biệt là Xuất Ai Cập 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: theo sự biết trước
  rationale: κατά với đối cách chỉ chuẩn mực hay sự phù hợp; cách dịch này giữ nghĩa trực tiếp của πρόγνωσις mà không quyết định đó chỉ là biết trước hay còn bao hàm chọn trước.
- source_word: θεοῦ πατρός
  choice: của Đức Chúa Trời là Cha
  rationale: Diễn đạt tự nhiên quan hệ đồng vị trong tiếng Hy Lạp và xác định Đấng có sự biết trước.
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: trong sự thánh hóa của Thánh Linh
  rationale: Giữ danh từ ἁγιασμός và sự mơ hồ ngữ pháp của sở hữu cách πνεύματος; cấu trúc tam vị cho thấy Thánh Linh là đối tượng được nói đến.
- source_word: εἰς ὑπακοὴν
  choice: để vâng phục
  rationale: εἰς biểu thị mục đích hoặc kết quả; 'để' chuyển tải sắc thái hướng đích tự nhiên trong tiếng Việt.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: và được rảy huyết
  rationale: Cách nói này tự nhiên hơn trong tiếng Việt, giữ hình ảnh rảy huyết liên quan đến giao ước và thanh tẩy, đồng thời không thêm tác nhân.
- source_word: Ἰησοῦ Χριστοῦ
  choice: của Chúa Giê-su, Đấng Mê-si-a
  rationale: Χριστός được chuyển tải như tước hiệu 'Đấng Mê-si-a'; 'Chúa Giê-su' là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Nguyện ân điển và bình an gia tăng trên anh chị em
  rationale: Dùng 'nguyện' để thể hiện chính xác thức mong ước của πληθυνθείη; 'anh chị em' diễn đạt số nhiều ὑμῖν một cách bao quát và tự nhiên.
theological_decisions:
- issue: Ý nghĩa của πρόγνωσις trong quan hệ với sự tuyển chọn
  choice: sự biết trước
  alternative: sự định trước; tình yêu chọn trước
  rationale: Bản dịch giữ nguyên sức căng thần học của từ Hy Lạp, không thu hẹp thành sự thấy trước đơn thuần cũng không mở rộng thành một hệ thống tiền định.
- issue: Đối tượng được πνεύματος chỉ đến
  choice: Thánh Linh
  alternative: tinh thần hoặc tâm linh con người
  rationale: Cấu trúc ba vế—Đức Chúa Trời là Cha, Thánh Linh, và Chúa Giê-su là Đấng Mê-si-a—ủng hộ cách hiểu đây là Thánh Linh.
- issue: Chức năng của Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn mang sức nặng của một tước hiệu; 'Đấng Mê-si-a' giúp người đọc nhận ra chức danh thay vì xem đó chỉ là một phần của tên riêng.
- issue: Quan hệ giữa vâng phục và rảy huyết
  choice: giữ cả hai cùng phụ thuộc vào εἰς
  alternative: hiểu 'vâng phục' là sự vâng phục của Chúa Giê-su hoặc gắn riêng với việc rảy huyết
  rationale: Cú pháp tự nhiên nhất xem cả ὑπακοή và ῥαντισμός là mục đích hoặc kết quả, nhưng bản dịch không xác định quá mức nội dung hay chủ thể của sự vâng phục.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các thuật ngữ thần học quen thuộc như “ân điển”, “thánh hóa”, “Thánh Linh” và “Đấng Mê-si-a”, nhưng dùng cú pháp tiếng Việt tự nhiên. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
