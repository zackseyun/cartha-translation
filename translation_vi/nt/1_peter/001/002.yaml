  terminology: “Đức Chúa Trời là Cha,” “Thánh Linh,” “thánh hóa,” “ân điển,” và “Đấng Mê-si-a” phù hợp với thuật ngữ và tước hiệu trong nguyên ngữ. Không nên đổi Χριστοῦ thành “Christ”/“Đấng Christ” trong bản này.
