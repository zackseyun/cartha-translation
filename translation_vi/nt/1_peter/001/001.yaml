revisions:
- from: Phi-e-rơ, một sứ đồ của Chúa Giê-su, Đấng Mê-si-a, gửi đến những người được chọn đang sống tha hương[a] giữa cộng đồng tản cư[b] tại Pôn-tơ, Ga-la-ti, Cáp-pa-đô-xi-a, A-si-a[c] và Bi-thi-ni-a.
  to: Phi-e-rơ, một sứ đồ của Giê-su, Đấng Mê-si-a, gửi đến những người được chọn, là những người tạm trú thuộc cộng đồng lưu tán[b] tại Pôn-tơ, Ga-la-ti, Cáp-pa-đô-xi-a, A-si-a[c] và Bi-thi-ni-a[a].
  rationale: Loại bỏ danh xưng “Chúa” không có trong nguyên văn; thay “giữa cộng đồng tản cư” bằng “thuộc cộng đồng lưu tán” để bảo toàn quan hệ ngữ pháp và tiếng vọng Diaspora, mà không quyết định người nhận chỉ là người Do Thái lưu tán hay chỉ là những người lưu ngụ theo nghĩa thuộc linh. Di chuyển ký hiệu chú thích a đến “những người tạm trú”, là từ mà chú thích giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:14Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các thành tố chính của câu, gồm tư cách sứ đồ, những người được chọn, thân phận tạm cư/lưu ngụ, sự lưu tán và danh sách địa danh. Tuy nhiên, “Chúa” không có trong Ἰησοῦ Χριστοῦ và vì vậy thêm một danh xưng không được nguyên văn nêu. Cụm “giữa cộng đồng tản cư” cũng chuyển quan hệ sở hữu trong παρεπιδήμοις διασπορᾶς thành quan hệ vị trí ‘ở giữa cộng đồng’, đồng thời “tản cư” dễ gợi việc sơ tán hơn là Diaspora/lưu tán.
  naturalness: “Gửi đến những người được chọn, là những người tạm trú thuộc cộng đồng lưu tán tại...” là văn phong thư tín trang trọng, hiện đại và phản ánh rõ hơn cấu trúc câu. “Lưu tán” tự nhiên, chính xác hơn “cộng đồng tản cư” trong ngữ cảnh này.
  terminology: Giữ “sứ đồ”, “Giê-su, Đấng Mê-si-a”, “được chọn”, “tạm trú”, và “lưu tán”. “Đấng Mê-si-a” bảo toàn lực danh hiệu của Χριστός mà không thêm danh xưng “Chúa”.
  issues:
  - severity: high
    issue: Thêm “Chúa” vào “Chúa Giê-su, Đấng Mê-si-a”.
    rationale: Nguyên văn chỉ có Ἰησοῦ Χριστοῦ (‘Giê-su, Đấng Mê-si-a’). Danh xưng “Chúa” không xuất hiện trong câu này, nên không nên được bổ sung vào bản dịch chính.
  - severity: medium
    issue: “giữa cộng đồng tản cư” không phản ánh sát quan hệ của διασπορᾶς.
    rationale: Cách này khiến người nhận trở thành những người sống ‘giữa’ một cộng đồng, trong khi cụm Hy Lạp gọi họ là những người tạm trú ‘thuộc cộng đồng/sự lưu tán’. “Tản cư” cũng có sắc thái sơ tán không thích hợp bằng “lưu tán”.
