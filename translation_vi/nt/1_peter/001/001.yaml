id: 1PE.1.1
reference: 1 Peter 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: vi
  text: Phi-e-rơ, một sứ đồ của Giê-su, Đấng Mê-si-a, gửi đến những người được chọn, là những người tạm trú thuộc cộng đồng lưu tán[b] tại Pôn-tơ, Ga-la-ti, Cáp-pa-đô-xi-a, A-si-a[c] và Bi-thi-ni-a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “những khách lạ” hoặc “những ngoại kiều”.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này có thể gợi đến cả cộng đồng Do Thái sống tản mác ngoài quê hương lẫn ý rộng hơn về dân Chúa sống xa quê hương đích thực của mình.
    reason: cultural_note
  - marker: c
    text: “A-si-a” ở đây là tỉnh A-si-a của Đế quốc La Mã tại miền tây Tiểu Á, không phải toàn bộ châu Á ngày nay.
    reason: historical_geographical_note
lexical_decisions:
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại, thay vì dịch nghĩa tên là “đá”.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Trong lời mở đầu thư, từ này chỉ vai trò được sai phái có thẩm quyền, không chỉ một sứ giả nói chung.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: “Đấng Mê-si-a” giữ rõ chức danh của Χριστός; thêm “Chúa” theo cách gọi tự nhiên và trang trọng trong tiếng Việt, không làm thay đổi quan hệ sở hữu của cụm “sứ đồ của…”.
- source_word: ἐκλεκτοῖς
  choice: những người được chọn
  rationale: Diễn đạt trực tiếp ý được tuyển chọn mà không biến từ này thành một nhãn thần học hệ phái.
- source_word: παρεπιδήμοις
  choice: đang sống tha hương
  rationale: Diễn tả tình trạng cư trú tạm thời, xa quê và không hoàn toàn thuộc về nơi đang sống; tự nhiên hơn các cách diễn đạt mang sắc thái hành chính.
- source_word: διασπορᾶς
  choice: giữa cộng đồng tản cư
  rationale: Giữ âm hưởng về một dân bị phân tán mà vẫn để ngỏ cả chiều kích Do Thái lịch sử lẫn chiều kích thần học rộng hơn.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: tại Pôn-tơ, Ga-la-ti, Cáp-pa-đô-xi-a, A-si-a và Bi-thi-ni-a
  rationale: Phiên âm các địa danh sang tiếng Việt; thêm “tại” để biểu thị tự nhiên quan hệ địa điểm vốn được hàm ý trong tiếng Hy Lạp.
theological_decisions:
- issue: Mối quan hệ giữa ἐκλεκτοῖς và παρεπιδήμοις
  choice: “những người được chọn đang sống tha hương”
  alternative: “những khách lạ được chọn”
  rationale: Cách chọn giữ cả việc họ được chọn lẫn thân phận không thuộc trọn về nơi cư trú, nhưng không quyết định đó chỉ là hoàn cảnh xã hội hay hoàn toàn là ẩn dụ thuộc linh.
- issue: Ý nghĩa của παρεπιδήμοις διασπορᾶς
  choice: Giữ đồng thời sắc thái địa lý-xã hội và tiếng vọng thần học
  alternative: Chỉ người Do Thái thuộc cộng đồng lưu tán; hoặc chỉ Cơ Đốc nhân như những người lưu đày thuộc linh
  rationale: Cấu trúc Hy Lạp có thể gợi cả cộng đồng Do Thái tản cư lẫn dân Chúa sống xa quê hương đích thực; bản dịch không thu hẹp vào một cách hiểu.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Ki-tô
  rationale: Giữ chức danh mang nghĩa “Đấng được xức dầu”, thay vì để từ này chỉ được nghe như một phần tên riêng.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu mở đầu thư tự nhiên trong tiếng Việt. Các thuật ngữ “sứ đồ”, “Đấng Mê-si-a” và địa danh phiên âm duy trì sắc thái Kinh Thánh quen thuộc; các chú thích bảo tồn những điểm mơ hồ thực sự của nguyên văn.
