id: 1PE.1.9
reference: 1 Peter 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κομιζόμενοι τὸ τέλος τῆς πίστεως ⸀ὑμῶν σωτηρίαν ψυχῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: vi
  text: khi anh chị em nhận được kết quả của đức tin mình[a], tức là sự cứu rỗi linh hồn mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đích đến”, “kết cuộc” hoặc “thành quả” của đức tin mình.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự cứu rỗi mạng sống mình” hoặc “sự cứu rỗi chính mình”. Từ Hy Lạp có thể chỉ linh hồn, mạng sống hoặc toàn thể con người, tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: khi ... nhận được
  rationale: Diễn đạt phân từ hiện tại gắn với những người được nói đến trong văn cảnh, nhấn mạnh việc họ đang nhận lấy điều đức tin dẫn tới mà không cường điệu sắc thái trung động/thụ động.
- source_word: τέλος
  choice: kết quả
  rationale: Trong văn cảnh, từ này chỉ kết cuộc đạt được của đức tin. “Kết quả” tự nhiên hơn “điểm cuối” và không nhấn quá mức ý định như “mục tiêu”.
- source_word: πίστεως ὑμῶν
  choice: đức tin mình
  rationale: Chỉ đức tin của chính các độc giả. “Mình” tự nhiên trong tiếng Việt khi chủ thể đã là “anh chị em”, đồng thời giữ quan hệ sở hữu của nguyên văn.
- source_word: σωτηρίαν
  choice: sự cứu rỗi
  rationale: Cách dịch quen thuộc và thích hợp với văn cảnh thư tín, giữ được nội dung cứu độ mà không thu hẹp thành một sự giải cứu nhất thời.
- source_word: ψυχῶν
  choice: linh hồn
  rationale: Là cách dịch trực tiếp và truyền thống, nhưng chú thích bảo lưu khả năng từ Hy Lạp chỉ “mạng sống” hoặc toàn thể “con người”, tránh áp đặt thuyết nhị nguyên thân xác–linh hồn.
theological_decisions:
- issue: Sắc thái của πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong cụm “đức tin của anh chị em”, nghĩa tự nhiên nhất là sự tin cậy của các tín hữu. Không có lý do đủ mạnh để chuyển sang nghĩa “sự trung tín” trong câu này.
- issue: Phạm vi nghĩa của ψυχαί trong cụm nói về sự cứu rỗi
  choice: linh hồn
  alternative: mạng sống; bản thân/con người
  rationale: Giữ cách diễn đạt sát nguyên văn trong chính văn nhưng chú thích nêu rõ phạm vi nghĩa rộng hơn, không suy diễn rằng câu này phủ nhận sự cứu rỗi thân thể hay xác lập một nhân học nhị nguyên nghiêm ngặt.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để thể hiện số nhiều và tính cộng đồng của đối tượng; dùng “mình” làm đại từ sở hữu phản thân tự nhiên. Cấu trúc “tức là” làm rõ quan hệ đồng vị giữa “kết quả” và “sự cứu rỗi” vốn được đặt cạnh nhau trong tiếng Hy Lạp.
