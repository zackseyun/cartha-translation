  source_fidelity: 'Bản nháp phản ánh đúng các yếu tố chính của câu Hy Lạp: phân từ hoàn thành bị động “đã được sinh lại,” sự đối lập giữa hạt giống hư nát và không hư nát, cùng phương tiện “qua lời.” Tuy nhiên, “bởi hạt giống” dễ lẫn với tác nhân của thể bị động; ἐκ diễn tả nguồn gốc/xuất xứ, nên “từ hạt giống” chính xác hơn. Việc lặp lại “hạt giống” ở vế thứ hai là sự bổ sung minh bạch và tự nhiên trong tiếng Việt cho danh từ được lược trong tiếng Hy Lạp.'
