source:
  edition: SBLGNT
  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: vi
  text: Vì anh em đã được sinh lại, không phải từ hạt giống hư nát, nhưng từ hạt giống không hư nát, qua lời hằng sống và còn mãi của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua lời của Đức Chúa Trời hằng sống và còn mãi.” Trong tiếng Hy Lạp, các từ “hằng sống” và “còn mãi” có thể bổ nghĩa cho “lời” hoặc cho “Đức Chúa Trời,” dù ngữ cảnh nghiêng về cách hiểu chúng bổ nghĩa cho “lời.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: đã được sinh lại
  rationale: Phân từ hoàn thành bị động diễn tả một hành động đã xảy ra với kết quả còn tiếp diễn. Cách dịch này giữ nghĩa bị động và nối tự nhiên với mạch câu trong tiếng Việt.
- source_word: σπορᾶς
  choice: hạt giống
  rationale: Trong sự tương phản giữa điều hay hư nát và điều không hư nát, “hạt giống” vừa tự nhiên vừa duy trì hình ảnh sinh ra.
- source_word: φθαρτῆς
  choice: hay hư nát
  rationale: Diễn đạt rõ tính có thể suy tàn, tiêu hoại, đồng thời tạo thế đối xứng tự nhiên với “không hư nát”.
- source_word: ἀφθάρτου
  choice: không hư nát
  rationale: Giữ trực tiếp sự đối lập về từ vựng với φθαρτῆς và dùng cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: διὰ
  choice: qua
  rationale: Với sở hữu cách, διά chỉ phương tiện; “qua” ngắn gọn và tự nhiên.
- source_word: λόγου
  choice: lời
  rationale: Giữ nghĩa trực tiếp và quen thuộc của λόγος trong ngữ cảnh này; “sứ điệp” là khả dĩ nhưng diễn giải hơn.
- source_word: ζῶντος
  choice: hằng sống
  rationale: Diễn đạt đặc tính đang sống bằng lối văn trang trọng, quen thuộc trong văn phong Kinh Thánh mà vẫn dễ hiểu.
- source_word: θεοῦ
  choice: của Đức Chúa Trời
  rationale: 'Phản ánh sở hữu cách phụ thuộc tự nhiên vào λόγου: “lời ... của Đức Chúa Trời,” thay vì diễn giải thành nguồn gốc.'
- source_word: μένοντος
  choice: còn mãi
  rationale: Truyền đạt sắc thái kéo dài, bền vững của phân từ hiện tại bằng tiếng Việt tự nhiên hơn “lưu lại” trong cấu trúc này.
theological_decisions:
- issue: ζῶντος và μένοντος bổ nghĩa cho “lời” hay cho “Đức Chúa Trời”
  choice: 'Hiểu cả hai phân từ bổ nghĩa cho “lời”: “lời hằng sống và còn mãi của Đức Chúa Trời”'
  alternative: “lời của Đức Chúa Trời hằng sống và còn mãi”
  rationale: Các phân từ sở hữu cách giống đực số ít có thể gắn với λόγου hoặc θεοῦ. Mạch văn, nhất là câu 25 nhấn mạnh lời còn mãi, nghiêng về việc chúng bổ nghĩa cho “lời”; tuy nhiên, cách gắn với “Đức Chúa Trời” vẫn có thể có về ngữ pháp nên được bảo tồn trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Được sinh lại” giữ thể bị động; “hằng sống” duy trì sắc thái Kinh Thánh quen thuộc, còn “còn mãi” bảo đảm tính tự nhiên. Dấu chú thích được đặt ngay sau câu.
