id: 1PE.1.21
reference: 1 Peter 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: vi
  text: là những người nhờ Ngài mà tin Đức Chúa Trời[a], Đấng đã khiến Ngài sống lại từ cõi chết và ban vinh quang cho Ngài, để đức tin và niềm hy vọng của anh chị em đều hướng về Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “là những người trung tín với Đức Chúa Trời”; tuy nhiên, cụm từ ở đây rất có thể chỉ những người nhờ Đấng Christ mà tin Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “kết quả là đức tin và niềm hy vọng của anh chị em đều hướng về Đức Chúa Trời.”
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: nhờ Ngài
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc sự trung gian. “Nhờ Ngài” tự nhiên trong tiếng Việt và cho thấy người đọc tin Đức Chúa Trời qua Đấng Christ mà không nói quá mức về tác nhân trực tiếp.
- source_word: πιστοὺς εἰς θεόν
  choice: tin Đức Chúa Trời
  rationale: Dù πιστός cũng có thể mang nghĩa “trung tín”, cấu trúc với εἰς θεόν ở đây phù hợp nhất với nghĩa tin cậy Đức Chúa Trời. Dịch bằng động từ giúp câu tiếng Việt tự nhiên.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: Đấng đã khiến Ngài sống lại từ cõi chết
  rationale: Diễn đạt thành ngữ phục sinh rõ ràng, đồng thời giữ Đức Chúa Trời là chủ thể khiến Đấng Christ sống lại.
- source_word: δόξαν αὐτῷ δόντα
  choice: ban vinh quang cho Ngài
  rationale: Giữ trực tiếp ý Đức Chúa Trời ban vinh quang cho Đấng Christ; “ban” phù hợp với văn phong trang trọng và tự nhiên.
- source_word: ὥστε
  choice: để
  rationale: “Để” có thể diễn tả hệ quả hoặc mục đích trong tiếng Việt, nhờ đó không ép cấu trúc Hy Lạp vào chỉ một sắc thái.
- source_word: πίστιν
  choice: đức tin
  rationale: Ở đây chỉ sự tin cậy của độc giả nơi Đức Chúa Trời; “đức tin” là thuật ngữ chuẩn, rõ ràng.
- source_word: ἐλπίδα
  choice: niềm hy vọng
  rationale: “Niềm hy vọng” là cách diễn đạt tự nhiên, đầy đủ cho ἐλπίς trong văn cảnh này.
- source_word: εἶναι εἰς θεόν
  choice: đều hướng về Đức Chúa Trời
  rationale: εἰς biểu thị đối tượng hoặc hướng quy chiếu của đức tin và hy vọng. “Hướng về” giữ được sắc thái định hướng tốt hơn “ở trong” vốn kém tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của πιστούς
  choice: những người tin Đức Chúa Trời nhờ Đấng Christ
  alternative: những người trung tín đối với Đức Chúa Trời
  rationale: Cụm εἰς θεόν ngay sau πιστούς nghiêng mạnh về hành vi tin cậy Đức Chúa Trời, nhưng chú thích vẫn bảo tồn khả năng từ vựng “trung tín”.
- issue: Vai trò của Đấng Christ trong việc đến với Đức Chúa Trời
  choice: “nhờ Ngài” diễn tả sự trung gian của Đấng Christ
  alternative: “bởi Ngài” hoặc “vì Ngài”
  rationale: διά với sở hữu cách phù hợp với phương tiện/sự trung gian. Cách dịch không thêm một hệ thống thần học vượt quá điều câu văn nói.
- issue: Sắc thái của mệnh đề ὥστε
  choice: “để” bảo tồn độ mở giữa mục đích và hệ quả
  alternative: “kết quả là” chỉ rõ hệ quả
  rationale: ὥστε với động từ nguyên mẫu thường nêu hệ quả, nhưng trong văn cảnh cũng có thể nghe sắc thái mục đích. Bản chính không nên âm thầm giải quyết hoàn toàn sự căng thẳng này.
- issue: Đối tượng của đức tin và hy vọng
  choice: đều hướng về Đức Chúa Trời
  alternative: ở trong Đức Chúa Trời
  rationale: Cách dịch giữ Đức Chúa Trời là đối tượng quy hướng của cả đức tin lẫn hy vọng, phù hợp với εἰς mà không tạo ấn tượng không tự nhiên về vị trí.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm diễn đạt cộng đồng độc giả một cách tự nhiên và bao quát. Viết hoa “Ngài” theo quy ước phổ biến; trong ngữ cảnh, đại từ này chỉ Đấng Christ, còn “Đấng” chỉ Đức Chúa Trời.
