id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: vi
  text: Dù chưa từng thấy Ngài, anh chị em vẫn yêu Ngài. Dù hiện nay không thấy Ngài, anh chị em vẫn tin Ngài và vui mừng với niềm vui khôn tả và vinh hiển.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “niềm vui đã được tôn vinh” hoặc “niềm vui đầy vinh quang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: Ngài
  rationale: Đại từ quan hệ chỉ về Chúa Giê-su Christ trong văn cảnh trước. Tiếng Việt cần một đại từ nhân xưng tự nhiên; “Ngài” vừa trang trọng vừa rõ đối tượng.
- source_word: οὐκ ἰδόντες
  choice: chưa từng thấy
  rationale: Diễn đạt phân từ bất định chỉ việc họ chưa có kinh nghiệm nhìn thấy Ngài, với hệ quả vẫn còn ở hiện tại.
- source_word: ἀγαπᾶτε
  choice: anh chị em vẫn yêu
  rationale: Thì hiện tại được chuyển thành “yêu”; “vẫn” làm rõ sự tương phản hàm ý giữa không thấy và yêu mà không thay đổi nội dung.
- source_word: εἰς ὃν … πιστεύοντες
  choice: vì tin Ngài
  rationale: πιστεύω với εἰς diễn tả việc đặt lòng tin nơi một đối tượng. “Tin Ngài” tự nhiên trong tiếng Việt; “vì” nối phân từ này với động từ chính và thể hiện hoàn cảnh/căn cứ của niềm vui.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: hiện nay không thấy Ngài
  rationale: Giữ sự nhấn mạnh về tình trạng không nhìn thấy đang tiếp diễn ở hiện tại.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện nét tương phản nhẹ giữa không thấy và vẫn tin, vui mừng.
- source_word: ἀγαλλιᾶσθε
  choice: anh chị em vui mừng
  rationale: Diễn đạt niềm vui mạnh mẽ bằng lối nói thông dụng; cường độ còn được thể hiện qua cụm mô tả niềm vui theo sau.
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: với niềm vui khôn tả
  rationale: χαρᾷ là cách thức đi với động từ vui mừng; “khôn tả” tự nhiên, trang trọng và diễn đạt điều vượt quá khả năng nói thành lời.
- source_word: δεδοξασμένῃ
  choice: được phủ đầy vinh quang
  rationale: Giữ nét thụ động và trạng thái kết quả của phân từ hoàn thành, đồng thời tạo một cách diễn đạt có thể hiểu được trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của πιστεύοντες với εἰς ὃν
  choice: tin Ngài
  alternative: đặt lòng tin nơi Ngài
  rationale: “Tin Ngài” ngắn gọn, tự nhiên và bao hàm việc hướng đức tin vào chính Chúa Christ; phương án dài hơn có thể làm nổi bật sắc thái tín thác nhưng không cần thiết trong câu chính.
- issue: Cách hiểu δεδοξασμένῃ χαρᾷ
  choice: niềm vui … được phủ đầy vinh quang
  alternative: niềm vui đầy vinh quang; niềm vui vinh hiển
  rationale: Bản chính bảo tồn nét thụ động và trạng thái đã được ban cho của δεδοξασμένῃ, nhưng chú thích giữ các cách hiểu tính từ tự nhiên hơn để không khép lại sự đa nghĩa của cụm từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ngôi thứ hai số nhiều và “Ngài” để chỉ Chúa Giê-su Christ. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
