id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: vi
  text: Vì vậy, hãy thắt gọn lưng áo của tâm trí anh chị em[a], giữ đầu óc tỉnh táo, và hãy đặt trọn niềm hy vọng vào ân điển đang đến với anh chị em khi Đức Giê-su, Đấng Mê-si-a, được bày tỏ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói đến việc “thắt gọn lưng áo của tâm trí anh chị em”, một hình ảnh chỉ việc chuẩn bị tâm trí để hành động.
    reason: lexical_alternative
  - marker: b
    text: 'Trạng từ Hy Lạp được dịch là “trọn” cũng có thể được hiểu là bổ nghĩa cho “giữ đầu óc tỉnh táo”: “giữ đầu óc hoàn toàn tỉnh táo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Vì vậy
  rationale: Diễn tả tự nhiên quan hệ suy luận từ phần lập luận ngay trước đó.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: hãy thắt lưng cho tâm trí mình
  rationale: Giữ hình ảnh sinh động của nguyên văn về việc thu gọn áo quần để sẵn sàng hành động; chú thích giải nghĩa cho độc giả hiện đại.
- source_word: νήφοντες
  choice: giữ đầu óc ... tỉnh táo
  rationale: Trong ngữ cảnh nói trực tiếp về tâm trí, động từ mang nghĩa bóng về sự sáng suốt và tự chủ, không nhất thiết nói đến việc kiêng rượu.
- source_word: τελείως
  choice: hoàn toàn / trọn
  rationale: Nguyên văn cho phép trạng từ liên hệ với việc tỉnh táo hoặc mệnh lệnh đặt hy vọng; bản dịch và chú thích giữ lại độ mở cú pháp này.
- source_word: ἐλπίσατε
  choice: đặt ... niềm hy vọng
  rationale: Thể hiện lực của mệnh lệnh và sự định hướng có chủ ý rõ hơn cách nói đơn thuần 'hãy hy vọng'.
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: vào ân điển đang được đem đến cho anh chị em
  rationale: Giữ sắc thái hiện tại bị động của phân từ φερομένην, đồng thời không xóa chiều hướng cánh chung của ân điển ấy.
- source_word: ἐν ἀποκαλύψει
  choice: khi ... được mặc khải
  rationale: Diễn đạt tự nhiên trong tiếng Việt mối liên hệ thời gian gắn với sự hiển lộ của Đức Giê-su.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Χριστός vẫn có chức năng tước hiệu trong ngữ cảnh này; cách diễn đạt tiếng Việt nêu rõ đây là tước hiệu chứ không phải họ riêng.
theological_decisions:
- issue: Giữ nguyên ẩn dụ hay chuyển hoàn toàn sang ý nghĩa diễn giải
  choice: Giữ ẩn dụ 'thắt lưng cho tâm trí' trong chính văn và giải thích trong chú thích.
  alternative: chuẩn bị tâm trí để hành động
  rationale: Ẩn dụ thân thể về tư thế sẵn sàng là nét nổi bật của nguyên văn; chú thích giúp câu dễ hiểu mà không thay hình ảnh bằng lời diễn giải.
- issue: Phạm vi bổ nghĩa của τελείως
  choice: Chính văn để sắc thái trọn vẹn vang lên ở cả sự tỉnh táo và việc đặt hy vọng, kèm chú thích về cấu trúc.
  alternative: Chỉ gắn 'hoàn toàn' với 'tỉnh táo', hoặc chỉ gắn 'trọn' với 'đặt hy vọng'.
  rationale: Vị trí trạng từ trong tiếng Hy Lạp tạo ra độ mơ hồ thực sự; không nên khẳng định độc quyền một cách phân tích.
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Ki-tô
  rationale: Ngữ cảnh cánh chung vẫn làm nổi bật chức năng tước hiệu của Χριστός; 'Đấng Mê-si-a' là cách nói rõ và không mang tính hệ phái.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμῖν; giữ ẩn dụ nguồn trong câu chính nhưng hỗ trợ bằng chú thích. Cấu trúc mệnh lệnh được làm rõ cho tự nhiên trong tiếng Việt.
