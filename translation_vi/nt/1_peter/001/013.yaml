revisions:
- from: Vì vậy, hãy thắt lưng cho tâm trí mình[a], giữ đầu óc hoàn toàn tỉnh táo[b], và đặt trọn niềm hy vọng vào ân điển đang được đem đến cho anh chị em khi Đức Giê-su, Đấng Mê-si-a, được mặc khải.
  to: Vì vậy, hãy thắt gọn lưng áo của tâm trí anh chị em[a], giữ đầu óc tỉnh táo, và hãy đặt trọn niềm hy vọng vào ân điển đang đến với anh chị em khi Đức Giê-su, Đấng Mê-si-a, được bày tỏ[b].
  rationale: Bản sửa giữ hình ảnh chuẩn bị của ἀναζωσάμενοι nhưng diễn đạt nó dễ hiểu hơn trong tiếng Việt. Trạng từ τελείως chỉ được thể hiện một lần trong chính văn, gắn với mệnh lệnh ἐλπίσατε, là cách đọc rất tự nhiên; chú thích bảo tồn khả năng nó đi với νήφοντες. Các điều chỉnh “đang đến với” và “được bày tỏ” cải thiện tiếng Việt mà vẫn giữ sắc thái hiện tại-hướng-cánh-chung và ý nghĩa của ἀποκάλυψις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:28Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch suy luận, lời kêu gọi tỉnh thức về tâm trí, đặt hy vọng nơi ân điển, và thời điểm Đức Giê-su được bày tỏ. Tuy nhiên, việc đồng thời dịch τελείως thành cả “hoàn toàn” lẫn “trọn” trong chính văn làm cho một trạng từ Hy Lạp bị áp dụng dứt khoát cho cả hai vế, thay vì giữ độ mơ hồ cú pháp. Cụm “đang được đem đến” bám hình thức bị động nhưng không tự nhiên trong tiếng Việt; “đang đến với” vẫn giữ sắc thái hiện tại và hướng cánh chung. “Được bày tỏ” tự nhiên hơn “được mặc khải” khi chủ ngữ là một con người.
  naturalness: “Thắt lưng cho tâm trí” có thể hiểu được nhờ chú thích, nhưng “thắt gọn lưng áo của tâm trí” diễn đạt rõ hơn hình ảnh chuẩn bị hành động mà không biến nó thành một mệnh lệnh về chiếc thắt lưng theo nghĩa đen. Cấu trúc “hãy ... và ...” được điều chỉnh để sự đầy đủ được đặt một lần ở mệnh lệnh chính, trong khi chú thích nêu khả năng liên kết với phân từ “giữ đầu óc tỉnh táo.”
  terminology: Giữ “ân điển” cho χάρις và “Đức Giê-su, Đấng Mê-si-a” cho Ἰησοῦ Χριστοῦ là phù hợp với thuật ngữ và chức năng tước hiệu trong ngữ cảnh. “Đầu óc tỉnh táo” diễn đạt thích đáng nghĩa bóng của νήφοντες trong ngữ cảnh tâm trí, không gợi ý sai rằng trọng tâm là kiêng rượu.
  issues:
  - severity: medium
    issue: τελείως được thể hiện hai lần trong chính văn.
    rationale: “hoàn toàn tỉnh táo” và “đặt trọn niềm hy vọng” cùng gán ý nghĩa toàn diện của một trạng từ cho hai thành phần. Cú pháp Hy Lạp cho phép tranh luận về phạm vi bổ nghĩa; chính văn nên chọn một cách đọc tự nhiên, còn chú thích bảo lưu cách đọc kia.
  - severity: low
    issue: “Ân điển đang được đem đến” không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cách nói này là bản sao sát cấu trúc bị động tiếng Hy Lạp/Anh. “Ân điển đang đến với” tự nhiên hơn và vẫn phản ánh phân từ hiện tại φερομένην cùng chiều hướng hướng tới thời điểm bày tỏ.
  - severity: low
    issue: “Được mặc khải” kém tự nhiên với Đức Giê-su là chủ ngữ được bày tỏ.
    rationale: Trong tiếng Việt hiện đại, “được bày tỏ” diễn đạt trực tiếp việc một nhân vật được hiển lộ; không thay đổi nghĩa của ἐν ἀποκαλύψει.
