  terminology: “Được chuộc,” “lối sống,” và “những thứ dễ hư hoại” phù hợp với trường nghĩa của ἐλυτρώθητε, ἀναστροφῆς, và φθαρτοῖς. “Cha ông” bảo lưu từ ngữ giới tính cụ thể của nguyên ngữ mà vẫn là cách nói Việt tự nhiên.
