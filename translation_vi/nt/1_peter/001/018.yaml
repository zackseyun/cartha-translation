id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: vi
  text: vì anh em biết rằng anh em đã được chuộc khỏi lối sống vô ích do cha ông truyền lại[a], không phải bằng những thứ dễ hư hoại như bạc hay vàng[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “do tổ tiên truyền lại.” Sát nghĩa: “được truyền lại từ các cha.”'
    reason: lexical_alternative
  - marker: b
    text: Bạc và vàng được nêu như những ví dụ về “những thứ dễ hư hoại.”
    reason: clarification
lexical_decisions:
- source_word: εἰδότες
  choice: vì anh em biết rằng
  rationale: Phân từ hoàn thành của οἶδα có chức năng trạng ngữ. Cách dịch này diễn đạt tự nhiên quan hệ lý do với lời khuyên ở văn cảnh trước, đồng thời giữ ý biết chắc đang có.
- source_word: ἐλυτρώθητε
  choice: mình đã được chuộc
  rationale: Động từ chỉ việc được giải thoát nhờ giá chuộc. “Được chuộc” giữ hình ảnh trả giá mà không xác định quá mức cơ chế thần học trong riêng mệnh đề này.
- source_word: φθαρτοῖς
  choice: những thứ dễ hư hoại
  rationale: Tính từ được dùng như danh từ số nhiều, chỉ những vật chịu sự hư hoại; cách diễn đạt này rõ ràng và tạo sự tương phản với giá trị không hư hoại trong câu kế tiếp.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: như bạc hay vàng
  rationale: Hai danh từ ở cách cho biết những ví dụ cụ thể về “những thứ dễ hư hoại”; “như” làm rõ quan hệ giải thích một cách tự nhiên trong tiếng Việt.
- source_word: ἐκ
  choice: khỏi
  rationale: Diễn tả sự tách ra và giải thoát khỏi một lối sống trước kia.
- source_word: ματαίας
  choice: hư không
  rationale: Diễn đạt tính trống rỗng, vô ích và không đạt mục đích của lối sống ấy; từ ngữ trang trọng nhưng vẫn quen thuộc trong tiếng Việt hiện đại.
- source_word: ἀναστροφῆς
  choice: lối sống
  rationale: Bao quát cả cách cư xử lẫn nếp sống, phù hợp với cách dùng của từ này trong 1 Phi-e-rơ.
- source_word: πατροπαραδότου
  choice: do tổ tiên truyền lại
  rationale: Tính từ có nghĩa là được truyền lại từ các bậc cha ông. “Tổ tiên” diễn đạt tự nhiên phạm vi thế hệ đi trước trong tiếng Việt, còn chú thích bảo lưu nghĩa sát chữ.
theological_decisions:
- issue: Cách diễn đạt truyền thống được thừa hưởng
  choice: do tổ tiên truyền lại
  alternative: do cha ông truyền lại
  rationale: “Tổ tiên” là cách nói tự nhiên, không hàm ý rằng mọi truyền thống đều bị kết án; trong câu này, điều bị đánh giá là “hư không” chính là lối sống cụ thể được truyền lại. Chú thích ghi nghĩa sát chữ.
- issue: Thuật ngữ cứu chuộc
  choice: được chuộc
  alternative: được giải phóng bằng giá chuộc
  rationale: “Được chuộc” giữ được trường nghĩa trả giá và âm hưởng Kinh Thánh, trong khi sự đối chiếu với bạc và vàng làm rõ hình ảnh mà không áp đặt thêm một mô hình thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô thư tín cộng đồng; “mình” tránh lặp đại từ mà vẫn rõ chủ thể. Câu kết bằng dấu phẩy vì cú pháp và ý tưởng tiếp tục sang câu 19.
