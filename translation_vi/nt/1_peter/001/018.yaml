  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính: sự được chuộc khỏi một lối sống trước kia, không bằng những vật dễ hư hoại như bạc hoặc vàng. Tuy nhiên, “tổ tiên” làm trung tính hóa πατροπαράδοτος, vốn nêu rõ truyền từ các “cha/cha ông”; nên giữ cách nói này trong bản văn chính. “Vô ích” diễn đạt μάταιος tự nhiên và chính xác hơn “hư không” trong ngữ cảnh lối sống.'
