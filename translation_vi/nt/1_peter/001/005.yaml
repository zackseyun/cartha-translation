source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: vi
  text: là những người đang được gìn giữ bởi quyền năng của Đức Chúa Trời qua đức tin, hướng đến sự cứu rỗi sẵn sàng được bày tỏ vào thời cuối cùng[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch “qua lòng tin cậy”; trong ngữ cảnh này, ít có khả năng hơn: “qua sự trung tín”.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “trong thời cuối cùng”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: là những người
  rationale: Mạo từ đối cách nối tiếp những người nhận thư từ câu trước. Cách dịch này giữ rõ quan hệ cú pháp trong một câu chưa trọn vẹn khi đứng riêng.
- source_word: φρουρουμένους
  choice: đang được ... gìn giữ
  rationale: Phân từ hiện tại bị động diễn tả hành động liên tục mà những người nhận thư đang chịu tác động. “Gìn giữ” tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái bảo vệ/canh giữ của φρουρέω.
- source_word: ἐν δυνάμει θεοῦ
  choice: được quyền năng của Đức Chúa Trời
  rationale: ἐν ở đây biểu thị phương tiện trong cấu trúc bị động. Cấu trúc “được quyền năng ... gìn giữ” truyền đạt rõ chính quyền năng của Đức Chúa Trời thực hiện sự gìn giữ.
- source_word: διὰ πίστεως
  choice: qua đức tin
  rationale: διά với sở hữu cách chỉ phương tiện trung gian. “Đức tin” là cách dịch quen thuộc và phù hợp nhất của πίστις tại đây; “lòng tin cậy” vẫn là một khả năng được ghi ở chú thích.
- source_word: εἰς σωτηρίαν
  choice: để nhận sự cứu rỗi
  rationale: εἰς chỉ mục tiêu hoặc kết quả hướng tới. Thêm “nhận” giúp câu tiếng Việt tự nhiên và làm rõ hướng đến sự cứu rỗi, nhưng không xác định thêm cơ chế thần học.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: sẵn sàng được bày tỏ
  rationale: Giữ sát cấu trúc tính từ cộng động từ nguyên mẫu bị động, cùng sắc thái rằng sự cứu rỗi đã sẵn sàng cho việc được tỏ lộ.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: trong thời kỳ cuối cùng
  rationale: καιρός nói đến một thời điểm hay thời kỳ có tính quyết định. “Thời kỳ cuối cùng” tự nhiên, giữ định hướng cánh chung mà không áp đặt một hệ thống thời kỳ cụ thể.
theological_decisions:
- issue: Quan hệ giữa sự gìn giữ của Đức Chúa Trời và đáp ứng của con người trong διὰ πίστεως
  choice: Đức Chúa Trời gìn giữ bằng quyền năng Ngài, và đức tin là phương tiện trung gian được câu văn nêu ra.
  alternative: Xem đức tin chỉ là một mô tả phụ không liên quan đến sự gìn giữ, hoặc hiểu πίστις chủ yếu là “sự trung tín”.
  rationale: Cú pháp nêu quyền năng Đức Chúa Trời là phương tiện thực hiện việc gìn giữ và đức tin là phương tiện trung gian. Bản dịch giữ cả hai mà không giải quyết thay cho văn bản cuộc tranh luận về sự kiên trì hay khả năng sa ngã.
- issue: Thời điểm cánh chung của sự cứu rỗi
  choice: Sự cứu rỗi ở đây hướng đến việc được bày tỏ trọn vẹn trong tương lai.
  alternative: Chỉ hiểu là sự quy đạo hiện tại, hoặc khẳng định từ câu này rằng sự cứu rỗi hoàn toàn không có phương diện hiện tại.
  rationale: Cụm “sẵn sàng được bày tỏ trong thời kỳ cuối cùng” rõ ràng có hướng tương lai, nhưng câu này không phủ nhận những cách dùng khác của “sự cứu rỗi” trong Tân Ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “đức tin”, “sự cứu rỗi” theo thuật ngữ Kinh Thánh tiếng Việt phổ thông; tránh thuật ngữ hệ phái. Dấu phẩy quanh “qua đức tin” giúp người đọc nhận ra hai thành tố phương tiện mà không tách chúng về mặt thần học.
