  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: vi
  text: Trong điều ấy, anh chị em vui mừng, dù hiện nay, nếu cần, anh chị em phải chịu buồn phiền ít lâu trong nhiều loại thử thách[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể dịch là “những thử luyện”; trong những văn cảnh khác, từ này còn có thể mang nghĩa “những cám dỗ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Trong điều ấy
  rationale: Giữ được sắc thái chỉ phạm vi hoặc cơ sở của niềm vui, đồng thời quy chiếu tự nhiên về toàn bộ niềm hy vọng cứu rỗi và cơ nghiệp ở phần trước mà không diễn giải mạnh thành quan hệ nguyên nhân.
- source_word: ἀγαλλιᾶσθε
  choice: anh chị em vui mừng
  rationale: Diễn đạt tự nhiên, trang trọng và dễ hiểu; động từ mang sắc thái vui mừng mạnh, nhưng văn cảnh đã đủ làm nổi bật cường độ nên không cần thêm từ giải thích.
- source_word: ὀλίγον ἄρτι
  choice: hiện nay ... ít lâu
  rationale: Bảo toàn cả ý hiện tại của ἄρτι lẫn khoảng thời gian ngắn của ὀλίγον theo trật tự tự nhiên trong tiếng Việt.
- source_word: εἰ δέον
  choice: nếu cần
  rationale: Giữ nguyên sắc thái điều kiện và sự cần thiết, không giải thích nguồn gốc hay mục đích thần học của sự cần thiết ấy.
- source_word: λυπηθέντες
  choice: anh chị em phải buồn phiền
  rationale: Truyền đạt trải nghiệm chịu buồn đau của phân từ thụ động trong tiếng Việt tự nhiên. Từ “phải” ở đây phối hợp với “nếu cần”, không nhằm khẳng định một tác nhân cụ thể gây buồn phiền.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: vì nhiều thử thách
  rationale: “Thử thách” phù hợp với bối cảnh gian khổ và đức tin được thử nghiệm ở câu kế tiếp; “vì” diễn đạt tự nhiên hoàn cảnh/nguyên do gây buồn phiền. “Nhiều” ở đây mang ý đa dạng, nhiều loại.
theological_decisions:
- issue: Ý nghĩa của πειρασμοῖς trong bối cảnh chịu khổ
  choice: thử thách
  alternative: sự thử nghiệm; cám dỗ
  rationale: Văn cảnh nói đến buồn phiền và việc đức tin được thử nghiệm, nên “thử thách” bao quát các gian nan bên ngoài mà không thu hẹp thành sự dụ dỗ phạm tội. Chú thích vẫn bảo tồn phạm vi nghĩa rộng của từ Hy Lạp.
- issue: Tính điều kiện của εἰ δέον
  choice: nếu cần
  alternative: vì điều đó là cần thiết
  rationale: Bản dịch giữ sự dè dặt của cấu trúc Hy Lạp, không biến nó thành một lời khẳng định tuyệt đối hoặc tự ý xác định ai khiến sự chịu khổ trở nên cần thiết.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ số nhiều một cách tự nhiên và bao quát. Giữ câu mở để nối tiếp sang câu 7, phù hợp cấu trúc của nguyên văn.
