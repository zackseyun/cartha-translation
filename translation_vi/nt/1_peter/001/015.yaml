  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: vi
  text: Nhưng Đấng đã kêu gọi anh em là thánh thể nào, thì chính anh em cũng hãy nên thánh thể ấy trong mọi cách ăn ở[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong toàn bộ nếp sống của anh em.” Từ Hy Lạp có thể chỉ toàn thể cách sống hoặc cách cư xử của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Đánh dấu sự tương phản với những ham muốn trước kia trong câu trước; “nhưng” tự nhiên và đúng chức năng liên kết.
- source_word: κατὰ
  choice: như
  rationale: 'Diễn tả sự tương ứng với phẩm tính của Đấng kêu gọi: đời sống của người được gọi phải phù hợp với sự thánh khiết của Ngài.'
- source_word: τὸν καλέσαντα ὑμᾶς
  choice: Đấng đã kêu gọi anh em
  rationale: Phân từ có mạo từ được dùng như danh từ; “Đấng” giữ sắc thái tôn kính và mệnh đề “đã kêu gọi” phản ánh phân từ aorist.
- source_word: ἅγιον
  choice: là thánh
  rationale: Giữ tính từ vị ngữ chỉ phẩm tính của Đấng kêu gọi, đồng thời tạo sự lặp lại có chủ ý với “nên thánh” ở vế sau.
- source_word: καὶ αὐτοὶ
  choice: chính anh em cũng
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của αὐτοὶ, còn “cũng” phản ánh καί.
- source_word: ἅγιοι
  choice: thánh
  rationale: Giữ nguyên sự lặp từ với ἅγιον và lời kêu gọi tương ứng với sự thánh khiết của Đức Chúa Trời.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: trong mọi cách ăn ở
  rationale: ἀναστροφή chỉ toàn bộ cách sống hay cách cư xử. “Cách ăn ở” là lối nói tiếng Việt tự nhiên, trang trọng vừa phải và bao quát nếp sống.
- source_word: γενήθητε
  choice: hãy nên
  rationale: “Hãy nên thánh” là lời khuyên truyền tự nhiên trong tiếng Việt và vẫn giữ được sắc thái đi vào hay biểu lộ trạng thái của γίνομαι, rõ hơn cách dịch đơn thuần “hãy là”.
theological_decisions:
- issue: Mối tương ứng giữa sự thánh khiết của Đức Chúa Trời và lời kêu gọi dành cho tín hữu
  choice: Đấng đã kêu gọi anh em là thánh ... chính anh em cũng hãy nên thánh
  alternative: Đấng Thánh đã kêu gọi anh em ... anh em cũng hãy nên thánh
  rationale: 'Cách chọn giữ ἅγιον như tính từ vị ngữ và làm rõ nền tảng của lời khuyên: Đấng kêu gọi vốn là thánh. Nó cũng bảo toàn sự lặp lại của từ “thánh” mà không biến tính từ thành một danh hiệu riêng.'
- issue: Sắc thái của mệnh lệnh γενήθητε
  choice: hãy nên thánh
  alternative: hãy thánh khiết; hãy trở nên thánh
  rationale: “Hãy nên thánh” vừa là tiếng Việt tự nhiên trong văn phong Kinh Thánh, vừa không áp đặt một mô hình giáo lý cụ thể về tiến trình thánh hóa. “Trở nên” có thể nhấn quá mạnh vào quá trình, còn “hãy thánh khiết” kém tự nhiên hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo số nhiều của ὑμᾶς và theo văn cảnh thư tín; “Đấng” biểu thị sự tôn kính mà không thêm danh xưng không có trong nguyên văn.
