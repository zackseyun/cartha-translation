reference: 1 Peter 1:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: vi
  text: Anh chị em đã thanh tẩy tâm hồn mình nhờ vâng phục chân lý để có tình yêu thương giữa anh chị em chân thành[a]; hãy tha thiết yêu thương nhau từ lòng mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tình yêu thương dành cho những người cùng đức tin.” Từ Hy Lạp chỉ tình thân trong gia đình giữa những người cùng đức tin, bao gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: “từ một tấm lòng thanh sạch.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: đã thanh tẩy
  rationale: Thì hoàn thành của phân từ diễn tả hành động đã xảy ra nhưng vẫn có hiệu lực đối với mệnh lệnh theo sau. Cách dịch này giữ được ý nghĩa ấy mà không ấn định quan hệ nhân quả quá mức.
- source_word: ψυχὰς
  choice: tâm hồn
  rationale: ψυχή ở đây chỉ chính con người xét trong đời sống bên trong. “Tâm hồn” tự nhiên hơn “linh hồn” trong tiếng Việt hiện đại và không thu hẹp từ này vào một bộ phận tách rời khỏi con người.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: nhờ vâng phục chân lý
  rationale: ἐν với cách dữ có thể chỉ phương tiện hoặc phạm vi. “Nhờ vâng phục” diễn đạt tự nhiên sắc thái phương tiện, đồng thời giữ mối liên hệ giữa sự thanh tẩy và việc đáp ứng chân lý bằng sự vâng phục.
- source_word: ἀληθείας
  choice: chân lý
  rationale: Danh từ có mạo từ và trong ngữ cảnh nhiều khả năng chỉ chân lý của sứ điệp Tin Mừng, chứ không chỉ tính chân thật nói chung. Tiếng Việt không có mạo từ tương ứng bắt buộc.
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: để có tình yêu thương anh em chân thành
  rationale: εἰς diễn tả mục đích hoặc kết quả; “để có” giữ được độ mở ấy khá tự nhiên. “Chân thành” là cách diễn đạt hiện đại của ý “không giả hình”.
- source_word: φιλαδελφίαν
  choice: tình yêu thương anh em
  rationale: Cụm này giữ hình ảnh tình thân giữa anh chị em trong gia đình đức tin và giúp phân biệt danh từ φιλαδελφία với động từ ἀγαπάω theo sau. Chú thích làm rõ rằng nghĩa này bao gồm cả nam lẫn nữ tín hữu.
- source_word: ἀγαπήσατε
  choice: hãy yêu thương
  rationale: Mệnh lệnh cách bất định kêu gọi một sự đáp ứng dứt khoát. “Hãy yêu thương” là cách diễn đạt trực tiếp, tự nhiên và không thêm sắc thái tiếp diễn vốn không được nêu rõ.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đây là cách diễn đạt tương hỗ tự nhiên nhất trong tiếng Việt.
- source_word: ἐκτενῶς
  choice: tha thiết
  rationale: Trạng từ diễn tả cường độ và sự bền bỉ. “Tha thiết” rõ nghĩa, trang trọng vừa phải và không giới hạn ý vào cảm xúc nồng nhiệt nhất thời.
- source_word: ἐκ καρδίας
  choice: từ trong lòng
  rationale: Bản SBLGNT không có tính từ “thanh sạch.” “Từ trong lòng” là cách dịch trực tiếp và tự nhiên; dị bản được ghi trong chú thích.
theological_decisions:
- issue: Sự phân biệt giữa φιλαδελφία và ἀγαπάω trong cùng một câu
  choice: Dịch φιλαδελφία là “tình yêu thương anh em” và ἀγαπήσατε là “hãy yêu thương.”
  alternative: Dùng cùng một cách diễn đạt “yêu thương” cho cả hai từ.
  rationale: Cách dịch đã chọn bảo tồn bước chuyển tu từ từ tình thân trong cộng đồng đức tin sang mệnh lệnh yêu thương nhau, nhưng không áp đặt một khác biệt thần học tuyệt đối giữa hai từ.
- issue: Phạm vi giới tính của φιλαδελφία
  choice: Giữ “tình yêu thương anh em” trong chính văn và giải thích trong chú thích rằng cụm từ bao gồm cả anh em lẫn chị em cùng đức tin.
  alternative: Dịch thẳng là “tình yêu thương đối với anh chị em cùng đức tin.”
  rationale: Cách chọn giữ được hình thức và sắc thái gia đình của từ Hy Lạp, đồng thời chú thích ngăn người đọc hiểu sai rằng câu chỉ nói đến nam giới.
- issue: Dị bản sau ἐκ καρδίας
  choice: Dịch bản SBLGNT là “từ trong lòng,” không thêm “thanh sạch.”
  alternative: Dịch “từ một tấm lòng thanh sạch.”
  rationale: Chính văn được cung cấp chỉ có ἐκ καρδίας. Dị bản có thêm καθαρᾶς đáng được ghi nhận nhưng không nên đưa vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” dùng để gọi toàn thể độc giả; “tâm hồn,” “chân lý,” và “tha thiết” duy trì sắc thái khuyên bảo trang nghiêm mà không cổ hóa. Trật tự câu được điều chỉnh nhẹ bằng “vậy” để mệnh lệnh chính rõ ràng trong tiếng Việt.
