source:
  edition: SBLGNT
  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: vi
  text: 'vì có lời chép rằng: “Anh em sẽ nên thánh[a], vì Ta là thánh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch trực tiếp theo nghĩa mệnh lệnh: “Anh em hãy nên thánh.” Bản Hy Lạp theo cách diễn đạt của câu Kinh Thánh được trích dẫn, dùng hình thức vị lai: “Anh em sẽ nên thánh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: vì
  rationale: 'Giữ rõ quan hệ nguyên nhân: lời Kinh Thánh làm cơ sở cho lời khuyên ở câu trước.'
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Công thức dẫn Kinh Thánh tự nhiên và trang trọng trong tiếng Việt, đồng thời phản ánh giá trị còn hiệu lực của thể hoàn thành bị động.
- source_word: ὅτι (thứ nhất)
  choice: rằng / dấu hai chấm và ngoặc kép
  rationale: Dẫn lời trích trực tiếp; cấu trúc “có lời chép rằng” kết hợp dấu câu thể hiện chức năng của liên từ Hy Lạp.
- source_word: Ἅγιοι
  choice: nên thánh
  rationale: “Thánh” giữ thuật ngữ thần học và đạo đức của ἅγιος; đi với “sẽ nên” tạo câu tiếng Việt tự nhiên mà vẫn giữ hình thức vị lai.
- source_word: ἔσεσθε
  choice: sẽ nên
  rationale: Giữ hình thức vị lai của bản Hy Lạp và sắc thái như mệnh lệnh trong lời trích Luật pháp, tránh biến hẳn thành lời dự báo đơn thuần.
- source_word: ὅτι (thứ hai)
  choice: vì
  rationale: 'Diễn đạt quan hệ nguyên nhân: sự thánh khiết của Đức Chúa Trời là nền tảng cho lời đòi hỏi này.'
- source_word: ἐγὼ
  choice: Ta
  rationale: Giữ đại từ được nêu rõ và có tính nhấn mạnh trong lời phán của Đức Chúa Trời; “Ta” phù hợp văn phong lời trích dẫn thần thượng.
- source_word: ἅγιος
  choice: thánh
  rationale: Nhất quán với Ἅγιοι, qua đó giữ mối liên hệ giữa sự nên thánh của người nghe và chính bản tính thánh của Đức Chúa Trời.
theological_decisions:
- issue: Sức nặng của thể vị lai ἔσεσθε trong lời trích về sự thánh khiết
  choice: “Anh em sẽ nên thánh”
  alternative: “Anh em hãy nên thánh” hoặc “Anh em sẽ là thánh”
  rationale: Bản dịch chính giữ hình thức vị lai của câu Hy Lạp và đồng thời cho phép sắc thái mệnh lệnh của lối văn Kinh Thánh. Chú thích nêu cách dịch mệnh lệnh trực tiếp để không xóa bỏ độ căng giữa hình thức ngữ pháp và chức năng khuyên truyền.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều được hàm ý trong động từ, và “Ta” trong lời phán của Đức Chúa Trời. Cấu trúc vị lai được giữ trong câu chính; chú thích giải thích sắc thái mệnh lệnh.
