id: 1PE.1.10
reference: 1 Peter 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: vi
  text: Về sự cứu rỗi này, các nhà tiên tri—những người đã nói tiên tri về ân điển dành cho anh chị em[a]—đã chuyên tâm tìm kiếm và tra xét kỹ lưỡng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “ân điển sẽ đến với anh chị em.” Ý hướng về tương lai thường được suy ra từ văn cảnh, dù câu này không trực tiếp nói rõ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Về sự cứu rỗi này
  rationale: περί với sở hữu cách nêu chủ đề; đại từ quan hệ ἧς quy chiếu về sự cứu rỗi vừa được nói đến. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ liên kết hồi chỉ.
- source_word: σωτηρίας
  choice: sự cứu rỗi
  rationale: Trong văn cảnh của 1 Phi-e-rơ, từ này mang ý nghĩa thần học về sự cứu rỗi, dù về mặt từ vựng cũng có thể chỉ sự giải cứu.
- source_word: ἐξεζήτησαν
  choice: chuyên tâm tìm kiếm
  rationale: Động từ diễn tả việc tìm kiếm cách thiết tha, chuyên cần; thêm 'chuyên tâm' truyền đạt sắc thái tăng cường của tiền tố ἐκ- mà vẫn tự nhiên.
- source_word: ἐξηραύνησαν
  choice: tra xét kỹ lưỡng
  rationale: Động từ chỉ việc dò xét, khảo cứu cặn kẽ. Dịch khác với động từ đứng trước để giữ phép tăng tiến tu từ của hai động từ song hành.
- source_word: προφῆται
  choice: các nhà tiên tri
  rationale: Cụm phân từ có mạo từ theo sau xác định rõ nhóm người được nói đến; 'các nhà tiên tri' là cách gọi tự nhiên, trang trọng trong tiếng Việt.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: những người đã nói tiên tri về ân điển dành cho anh chị em
  rationale: Cụm phân từ có chức năng định ngữ cho 'các nhà tiên tri'; περί chỉ nội dung lời tiên tri, còn εἰς ὑμᾶς mang sắc thái hướng đến hoặc vì lợi ích của độc giả.
- source_word: χάριτος
  choice: ân điển
  rationale: Giữ thuật ngữ thần học quen thuộc chỉ ân huệ nhưng không của Đức Chúa Trời trong văn cảnh cứu rỗi.
- source_word: εἰς ὑμᾶς
  choice: dành cho anh chị em
  rationale: '''Dành cho'' diễn đạt tự nhiên sắc thái hướng đến và đem lợi ích cho người nhận; ''anh chị em'' phù hợp với lời xưng hô số nhiều của một thư tín gửi cộng đồng.'
theological_decisions:
- issue: Có nên nói rõ yếu tố tương lai trong cụm 'ân điển dành cho anh chị em' hay không
  choice: Không thêm ý tương lai vào chính văn
  alternative: ân điển sẽ đến với anh chị em
  rationale: Vai trò hướng về tương lai của lời tiên tri có thể được suy ra từ văn cảnh, nhưng câu Hy Lạp này không có động từ hay phân từ trực tiếp biểu thị tương lai. Chính văn vì thế không thêm điều nguồn văn không nói rõ; cách hiểu tương lai được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giúp cụm định ngữ dài không làm đứt mạch giữa chủ đề và hai động từ chính. Giữ cả hai động từ với sắc thái tăng tiến, đồng thời không biến hàm ý tương lai thành lời khẳng định trong chính văn.
