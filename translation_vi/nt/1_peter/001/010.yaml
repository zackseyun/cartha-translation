  source_fidelity: 'Bản dịch giữ đầy đủ cấu trúc và nội dung của câu Hy Lạp: chủ đề hồi chỉ “sự cứu rỗi này”; các nhà tiên tri là chủ ngữ được xác định bởi mệnh đề phân từ; hai động từ tìm kiếm và tra xét được phân biệt; và nội dung lời tiên tri là ân điển hướng đến độc giả. “Đã” phù hợp với hai động từ aorist và không thêm một yếu tố thời gian không có trong nguyên văn.'
