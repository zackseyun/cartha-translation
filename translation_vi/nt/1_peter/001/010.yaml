  terminology: “Sự cứu rỗi” và “ân điển” là các thuật ngữ nhất quán, thích hợp trong văn cảnh thư tín và bảo toàn trọng lượng thần học của σωτηρία và χάρις. “Anh chị em” là cách xưng hô số nhiều tự nhiên với cộng đồng độc giả; “dành cho” truyền đạt phù hợp hướng/sự ích lợi trong εἰς ὑμᾶς.
