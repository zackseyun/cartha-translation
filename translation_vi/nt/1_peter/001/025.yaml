id: 1PE.1.25
reference: 1 Peter 1:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: vi
  text: Nhưng lời Chúa còn mãi đời đời.” Và đây chính là lời đã được loan báo như tin mừng cho anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời đã được rao giảng cho anh chị em như phúc âm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: lời
  rationale: “Lời” vừa tự nhiên trong tiếng Việt, vừa giữ được sự lặp lại và mối liên hệ trực tiếp với lời trích dẫn Ê-sai 40:8; trong vế sau, từ này cũng có thể chỉ sứ điệp được loan báo.
- source_word: κυρίου
  choice: Chúa
  rationale: “Chúa” là cách dịch thông dụng, trang trọng của κύριος. Cách viết này không ép người đọc phải chọn riêng giữa bối cảnh danh Đức Chúa Trời trong Ê-sai và cách dùng κύριος trong Tân Ước.
- source_word: μένει
  choice: còn lại
  rationale: Diễn đạt sự tồn tại bền vững, liên tục của μένω bằng tiếng Việt hiện đại, đồng thời tránh sắc thái cổ của những cách nói như “còn đến đời đời”.
- source_word: εἰς τὸν αἰῶνα
  choice: đời đời
  rationale: Đây là thành ngữ tự nhiên và trang trọng trong tiếng Việt để diễn tả thời gian không chấm dứt.
- source_word: τοῦτο δέ ἐστιν
  choice: Và đây chính là
  rationale: “Và” thể hiện bước chuyển nhẹ của δέ; “chính” làm rõ quan hệ nhận diện giữa lời trong câu trích dẫn và lời được loan báo mà không thêm một đối tượng mới.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: lời đã được loan báo ... như tin mừng
  rationale: Giữ “lời” nhất quán với vế trước, còn “được loan báo ... như tin mừng” thể hiện rõ lực động từ thụ động của εὐαγγελίζω và nội dung tin mừng.
- source_word: εἰς ὑμᾶς
  choice: cho anh chị em
  rationale: “Cho” diễn đạt tự nhiên hướng của việc loan báo đến những người nghe. “Anh chị em” truyền đạt số nhiều ὑμᾶς và cách xưng hô cộng đồng một cách rõ ràng, hiện đại.
theological_decisions:
- issue: Quan hệ giữa “lời Chúa” trong lời trích Ê-sai 40:8 và tin mừng được loan báo
  choice: Giữ “lời Chúa” trong câu trích dẫn, rồi nhận diện lời ấy với lời đã được loan báo như tin mừng cho độc giả.
  alternative: Diễn giải xuyên suốt là “sứ điệp từ Chúa”.
  rationale: Cách dịch này bảo toàn tiếng vọng Kinh Thánh và sự chuyển từ lời trích dẫn sang việc áp dụng cho lời rao giảng, thay vì giải quyết quan hệ ấy bằng một lối diễn giải hẹp hơn.
- issue: Cách chuyển εὐαγγελισθέν
  choice: Dùng cụm động từ “được loan báo ... như tin mừng”.
  alternative: “được giảng cho anh chị em như phúc âm” hoặc chỉ “được rao giảng cho anh chị em”.
  rationale: Cách chọn giữ rõ ý “tin mừng” vốn có trong động từ Hy Lạp mà không biến nó thành thuật ngữ giáo phái hoặc làm mất sắc thái loan báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc trích dẫn rồi giải thích của nguyên văn; dùng “anh chị em” để biểu đạt đại từ số nhiều mà không mang sắc thái suồng sã.
