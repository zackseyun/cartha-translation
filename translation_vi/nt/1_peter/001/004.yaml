id: 1PE.1.4
reference: 1 Peter 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: vi
  text: để nhận lãnh một cơ nghiệp không hư nát, không ô uế và không tàn phai, được gìn giữ trên trời cho anh chị em,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς κληρονομίαν
  choice: để nhận lãnh một cơ nghiệp
  rationale: Trong mạch cú pháp nối với câu trước, εἰς chỉ mục tiêu/kết quả; thêm “nhận lãnh” làm rõ ý thừa hưởng vốn hàm chứa trong κληρονομία mà vẫn giữ câu tự nhiên trong tiếng Việt.
- source_word: ἄφθαρτον
  choice: không hư nát
  rationale: Diễn đạt tính không bị suy hoại hay tiêu mất của cơ nghiệp.
- source_word: ἀμίαντον
  choice: không ô uế
  rationale: Giữ sắc thái đạo đức và nghi lễ rộng của từ Hy Lạp, không thu hẹp nghĩa.
- source_word: ἀμάραντον
  choice: không tàn phai
  rationale: Bảo tồn hình ảnh về điều không héo tàn hay mất vẻ huy hoàng.
- source_word: τετηρημένην
  choice: được gìn giữ
  rationale: Thể hoàn thành bị động cho thấy cơ nghiệp đã và đang được bảo toàn.
- source_word: ἐν οὐρανοῖς
  choice: trên trời
  rationale: Cách nói tự nhiên trong tiếng Việt cho số nhiều Hy Lạp “các tầng trời”, không nhất thiết nhấn mạnh nhiều tầng.
- source_word: εἰς ὑμᾶς
  choice: cho anh chị em
  rationale: Ở đây εἰς mang nghĩa hướng đến/dành cho người nhận; “anh chị em” truyền đạt số nhiều và phù hợp lời gửi cộng đồng.
theological_decisions:
- issue: Cơ nghiệp là hiện thực hiện tại được bảo toàn hay phần thưởng tương lai
  choice: “được gìn giữ trên trời cho anh chị em” giữ nguyên cả sự bảo toàn hiện tại lẫn hướng đến người nhận
  alternative: “đang chờ anh chị em trên trời”
  rationale: Bản thay thế biến ý ‘được gìn giữ’ thành ‘đang chờ’ và có thể thu hẹp sức căng thời-thể của τετηρημένην.
- issue: Tác nhân gìn giữ không được nêu rõ
  choice: Dùng thể bị động “được gìn giữ”
  alternative: “Đức Chúa Trời gìn giữ”
  rationale: Nguyên văn dùng thể bị động và không nêu tác nhân; không nên bổ sung rõ điều văn bản chỉ hàm ý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng chuỗi ba tính chất song song để giữ nhịp và sức nhấn của nguyên văn. Câu kết bằng dấu phẩy vì đây là một phần của câu dài bắt đầu ở câu 3.
