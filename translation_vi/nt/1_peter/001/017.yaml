id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: vi
  text: Và nếu anh chị em gọi Đấng xét xử không thiên vị, tùy theo việc làm của mỗi người, là Cha[a], thì hãy sống trong sự kính sợ[b] suốt thời gian anh chị em cư ngụ như người ngoại kiều[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cầu khẩn Đấng ấy với tư cách là Cha.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong sự sợ hãi” hoặc “với lòng kính sợ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “suốt thời gian sống tha hương” hoặc “suốt thời gian tạm trú.” Từ Hy Lạp chỉ tình trạng sống như người ngoại kiều hoặc cư dân tạm thời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: gọi ... là
  rationale: Động từ ở đây chỉ việc xưng gọi hoặc cầu khẩn Đức Chúa Trời; kết cấu “gọi ... là Cha” chuyển tải tự nhiên quan hệ với bổ ngữ πατέρα.
- source_word: πατέρα
  choice: Cha
  rationale: 'Danh từ giữ chức năng vị ngữ: các tín hữu xưng gọi Đức Chúa Trời là Cha. Viết hoa vì chỉ về Đức Chúa Trời.'
- source_word: ἀπροσωπολήμπτως
  choice: không thiên vị
  rationale: Diễn đạt rõ việc xét xử không dựa vào địa vị hay bề ngoài của con người.
- source_word: κρίνοντα
  choice: Đấng xét xử
  rationale: Phân từ hiện tại được dùng như danh từ để mô tả Đức Chúa Trời là Đấng đang thực hiện việc xét xử.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: tùy theo việc làm của mỗi người
  rationale: κατά với đối cách nêu chuẩn mực xét xử; ἔργον số ít có thể mang nghĩa tổng hợp về việc làm của từng người.
- source_word: ἐν φόβῳ
  choice: trong sự kính sợ
  rationale: Cụm từ vẫn giữ yếu tố sợ hãi trước Đấng phán xét, đồng thời trong tiếng Việt “kính sợ” tự nhiên diễn tả nỗi sợ gắn với lòng tôn kính, không giản lược thành sự cung kính thuần túy.
- source_word: παροικίας
  choice: cư ngụ như người ngoại kiều
  rationale: Danh từ nói đến tình trạng sống tại một nơi với tư cách người ngoại cư hoặc cư dân tạm thời; cách diễn đạt này rõ nghĩa hơn từ Hán-Việt khó hiểu và không giới hạn vào cảnh lưu đày chính trị.
- source_word: ἀναστράφητε
  choice: hãy sống
  rationale: Mệnh lệnh này nói về cách ứng xử trong toàn bộ đời sống; “hãy sống” tự nhiên, hiện đại và giữ được sức nặng đạo đức trong ngữ cảnh.
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: suốt thời gian mình cư ngụ như người ngoại kiều
  rationale: Đối cách χρόνον diễn tả khoảng thời gian kéo dài; “suốt thời gian” truyền đạt rõ ý này.
theological_decisions:
- issue: Ý nghĩa của φόβος khi Đức Chúa Trời vừa là Cha vừa là Đấng xét xử
  choice: sự kính sợ
  alternative: sự sợ hãi; lòng tôn kính
  rationale: “Kính sợ” bảo tồn cả sự nghiêm trọng của việc Đức Chúa Trời xét xử lẫn sắc thái tôn kính, không biến câu này thành nỗi kinh hãi đơn thuần hoặc làm nhẹ thành lòng cung kính בלבד.
- issue: Phạm vi của sự xét xử theo việc làm
  choice: dịch trực tiếp là “tùy theo việc làm của mỗi người”
  alternative: giải thích thành sự phán xét chung thẩm đối với việc làm của tín hữu, hoặc thành một nguyên tắc đánh giá tổng quát
  rationale: Bản Hy Lạp khẳng định sự xét xử công minh theo việc làm nhưng không trình bày tại đây một hệ thống về công đức, sự bảo đảm cứu rỗi hay thời điểm phán xét; bản dịch không nên bổ sung lập trường hệ phái.
- issue: Thân phận παροικία
  choice: cư ngụ như người ngoại kiều
  alternative: lưu đày; tạm trú; lữ hành
  rationale: Cách dịch giữ hình ảnh sống như người ngoại cư hoặc cư dân tạm thời, nhưng không quyết định rằng câu này nhất thiết nói đến lưu đày chính trị hay chỉ là ẩn dụ tâm linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; trong mệnh đề sau dùng “mình” để tránh lặp nặng nhưng vẫn quy chiếu về cộng đồng độc giả. Cấu trúc câu giữ sự căng thẳng giữa việc gọi Đức Chúa Trời là Cha và việc Người xét xử công minh.
