  source_fidelity: 'Bản dịch truyền đạt chính xác cấu trúc điều kiện và mệnh lệnh của câu Hy Lạp: gọi Đức Chúa Trời là Cha, đồng thời là Đấng xét xử không thiên vị theo việc làm từng người; vì thế phải sống trong φόβος trong thời gian παροικία. “Không thiên vị,” “tùy theo việc làm của mỗi người,” và hình ảnh cư ngụ như người ngoại kiều đều phù hợp với nguyên ngữ. Tuy nhiên, chú thích a hiện dùng cách nói lửng và chưa diễn đạt tự nhiên phương án nghĩa của ἐπικαλεῖσθε.'
  naturalness: Câu chính trang trọng, hiện đại và dễ hiểu. Việc thay “mình” bằng “anh chị em” ở vế sau làm quy chiếu số nhiều nhất quán, rõ ràng hơn. Chú thích a cần được viết lại thành một câu hoàn chỉnh, tự nhiên trong tiếng Việt.
  terminology: “Cha” viết hoa phù hợp khi quy chiếu Đức Chúa Trời. “Kính sợ” bảo lưu cách thích hợp sức căng của φόβος, không thu hẹp thành lòng tôn kính đơn thuần. “Ngoại kiều” và “cư dân tạm thời” là các cách diễn đạt rõ ràng, không áp đặt nghĩa lưu đày chính trị.
  issues:
