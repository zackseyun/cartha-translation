id: 1PE.1.14
reference: 1 Peter 1:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: vi
  text: Như những người con của sự vâng phục[a], anh em đừng rập khuôn theo những ham muốn trước kia, khi anh em còn thiếu hiểu biết,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người con biết vâng phục.” Tiếng Hy Lạp sát nghĩa là “những người con của sự vâng phục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Như
  rationale: Diễn tả tư cách và cách sống được đòi hỏi trong lời khuyên; “Như” tự nhiên trong tiếng Việt và không buộc phải phân biệt giữa cách thức với căn tính.
- source_word: τέκνα ὑπακοῆς
  choice: những người con của sự vâng phục
  rationale: Giữ cấu trúc sở hữu đặc trưng của nguyên văn và sắc thái căn tính được định hình bởi sự vâng phục; bản dịch tự nhiên hơn được nêu trong chú thích.
- source_word: μὴ συσχηματιζόμενοι
  choice: đừng rập khuôn theo
  rationale: Phân từ hiện tại mang lực khuyên cấm trong ngữ cảnh; “đừng rập khuôn theo” diễn đạt hành vi tự điều chỉnh theo một khuôn mẫu mà không xác quyết quá mức sắc thái trung động hay bị động.
- source_word: ταῖς ... ἐπιθυμίαις
  choice: những ham muốn
  rationale: Trong ngữ cảnh, từ này chỉ những khao khát có tính lệch lạc về đạo đức; “ham muốn” rõ ràng, hiện đại và không thu hẹp nghĩa vào dục vọng tình dục.
- source_word: πρότερον
  choice: trước kia
  rationale: Bổ nghĩa cho những ham muốn thuộc đời sống trước đây của độc giả, đồng thời bám sát chức năng trạng từ của nguyên văn.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: khi mình còn ở trong sự thiếu hiểu biết
  rationale: Diễn đạt trạng thái trước đây một cách tự nhiên, đồng thời giữ danh từ “sự thiếu hiểu biết” và không thêm đối tượng mà nguyên văn không nêu.
theological_decisions:
- issue: Có nên chuyển τέκνα ὑπακοῆς thành một cụm tính từ tự nhiên hơn hay giữ hình ảnh căn tính của cấu trúc sở hữu
  choice: những người con của sự vâng phục
  alternative: những người con biết vâng phục
  rationale: Giữ cấu trúc và lực căn tính của nguyên văn, tương ứng với các thành ngữ Hy Lạp Kinh Thánh như “con của sự bất phục”; chú thích cung cấp cách hiểu tự nhiên mà không áp đặt thêm nội dung giáo phái.
- issue: Sắc thái của μὴ συσχηματιζόμενοι là phản thân hay bị động
  choice: đừng rập khuôn theo
  alternative: đừng để mình bị uốn theo khuôn
  rationale: Hình thức có thể mang sắc thái trung động hoặc bị động. Cách chọn tránh phân giải dứt khoát sự mơ hồ ấy, nhưng vẫn truyền đạt rõ trách nhiệm đạo đức trong lời khuyên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời trực tiếp gửi cộng đồng, còn “mình” trong mệnh đề phụ giúp câu tự nhiên và tránh lặp đại từ. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 15.
