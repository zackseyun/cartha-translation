  - severity: low
    issue: “Có tâm trí khiêm nhường” không tự nhiên trong tiếng Việt hiện đại.
    rationale: ταπεινόφρονες nói về sự khiêm nhường trong thái độ/tư duy; “khiêm nhường” giữ nghĩa này mà đọc tự nhiên hơn.
