  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: vi
  text: Sau cùng, tất cả anh chị em hãy đồng lòng, biết cảm thông, yêu thương nhau như anh chị em[a], đầy lòng trắc ẩn và khiêm nhường[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng ngôn ngữ tình thân giữa anh chị em để nói về tình yêu trong cộng đồng tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “nhã nhặn” hoặc “thân thiện” thay cho “khiêm nhường”.
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: Sau cùng
  rationale: Cụm từ này làm dấu hiệu chuyển sang phần tổng kết các lời khuyên. “Sau cùng” tự nhiên trong tiếng Việt và không hàm ý rằng bức thư sắp kết thúc ngay.
- source_word: πάντες
  choice: tất cả anh chị em
  rationale: Dạng danh cách ở đây có chức năng trực tiếp hướng lời đến toàn thể cộng đồng. “Tất cả anh chị em” diễn đạt rõ đối tượng được khuyên bảo và phù hợp với cộng đồng gồm cả nam lẫn nữ.
- source_word: ὁμόφρονες
  choice: đồng lòng
  rationale: Từ Hy Lạp chỉ việc cùng chung cách nghĩ hoặc định hướng tinh thần. “Đồng lòng” là cách nói tự nhiên, dễ hiểu, vừa giữ ý hiệp nhất vừa tránh lối diễn đạt nặng nề.
- source_word: συμπαθεῖς
  choice: biết cảm thông
  rationale: Từ này nói đến việc cùng chia sẻ và thấu cảm những gì người khác trải qua. “Biết cảm thông” diễn đạt rõ phẩm chất được kêu gọi.
- source_word: φιλάδελφοι
  choice: yêu thương nhau như anh chị em
  rationale: Từ ghép dùng hình ảnh tình yêu giữa những người cùng gia đình. Cách dịch này giữ hình ảnh anh chị em và diễn đạt minh nhiên ý nghĩa bao quát của từ trong cộng đồng tín hữu.
- source_word: εὔσπλαγχνοι
  choice: có lòng thương xót
  rationale: Từ này chỉ lòng trắc ẩn sâu xa và sự nhân hậu phát xuất từ bên trong. “Có lòng thương xót” là cách nói trang trọng nhưng vẫn thông dụng.
- source_word: ταπεινόφρονες
  choice: có tâm trí khiêm nhường
  rationale: Bản văn SBLGNT dùng từ chỉ sự khiêm nhường trong cách nghĩ hoặc thái độ nội tâm. Cách dịch này giữ thành tố liên quan đến tâm trí của từ ghép Hy Lạp.
theological_decisions:
- issue: Ngôn ngữ gia đình trong φιλάδελφοι
  choice: yêu thương nhau như anh chị em
  alternative: yêu thương anh em; đầy tình huynh đệ
  rationale: Từ Hy Lạp dùng hình ảnh tình yêu giữa anh chị em trong gia đình để nói về toàn thể cộng đồng tín hữu. Bản dịch giữ hình ảnh gia đình và diễn đạt rõ phạm vi bao gồm cả nam lẫn nữ, thay vì trung tính hóa hình ảnh này.
- issue: Dạng văn bản của tính từ cuối câu
  choice: ταπεινόφρονες = có tâm trí khiêm nhường
  alternative: φιλόφρονες = nhã nhặn hoặc thân thiện
  rationale: SBLGNT đọc ταπεινόφρονες, nên bản chính theo nghĩa “khiêm nhường trong tâm trí”. Dị bản φιλόφρονες có ý nghĩa khác và được ghi lại trong chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu được bổ sung “hãy” cùng các động từ hoặc cấu trúc sở hữu cần thiết để chuỗi tính từ Hy Lạp trở thành lời khuyên tự nhiên trong tiếng Việt; không thêm nội dung giáo phái.
