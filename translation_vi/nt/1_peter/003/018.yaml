revisions:
- from: Vì Đấng Mê-si cũng đã chịu khổ một lần vì tội lỗi[a], là Đấng công chính thay cho những người bất chính, để đưa anh em đến với Đức Chúa Trời[b]. Ngài đã bị giết về phần xác, nhưng được làm cho sống về phần linh.
  to: Vì Đấng Mê-si cũng đã chịu khổ một lần vì tội lỗi[a], Đấng công chính vì những người bất chính, để đưa anh em đến với Đức Chúa Trời, Ngài đã bị giết về phần xác nhưng được làm cho sống về phần linh[b].
  rationale: Sửa ‘thay cho’ thành ‘vì’ để không quyết định quá mức sắc thái của ὑπέρ. Gộp mệnh đề cuối vào cùng câu để phản ánh quan hệ phân từ trong tiếng Hy Lạp. Chú thích b được rút gọn để nêu trực tiếp phương án tác nhân mà vẫn giải thích sự mơ hồ của πνεύματι.
  reviewer_model: gpt-5.6-terra
