id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: vi
  text: Vì Đấng Mê-si cũng đã chịu khổ một lần vì tội lỗi[a], Đấng công chính vì những người bất chính, để đưa anh em đến với Đức Chúa Trời, Ngài đã bị giết về phần xác nhưng được làm cho sống về phần linh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “đã chết” thay vì “đã chịu khổ”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “được làm cho sống bởi Thánh Linh.” Tiếng Hy Lạp có thể nói đến phương diện/lĩnh vực linh hoặc đến tác động của Thánh Linh.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Dịch tước hiệu theo nghĩa Mê-si-a, thay vì dùng dạng gần như tên riêng, để giữ rõ ý nghĩa của Χριστός.
- source_word: ἅπαξ
  choice: một lần
  rationale: Diễn đạt trực tiếp nghĩa của trạng từ, không thêm sắc thái “một lần đủ cả” dù ý đó có thể được suy ra về thần học.
- source_word: περὶ ἁμαρτιῶν
  choice: vì tội lỗi
  rationale: Trong ngữ cảnh cứu chuộc, cụm từ nói đến việc chịu khổ liên quan đến và vì tội lỗi; cách dịch này tự nhiên trong tiếng Việt mà không xác định quá mức một mô hình chuộc tội.
- source_word: ἔπαθεν
  choice: đã chịu khổ
  rationale: Theo dị bản được SBLGNT chọn; dị bản “đã chết” được ghi ở chú thích.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: Đấng công chính thay cho những người bất chính
  rationale: Giữ sự đối lập giữa Đấng công chính và người bất chính, đồng thời thể hiện lực đại diện/thay thế của ὑπέρ mà không khai triển thành một lý thuyết chuộc tội đầy đủ.
- source_word: προσαγάγῃ
  choice: đưa anh em đến với
  rationale: Diễn đạt tự nhiên ý đưa vào sự hiện diện của Đức Chúa Trời hoặc ban lối đến với Ngài.
- source_word: θανατωθεὶς
  choice: đã bị giết
  rationale: Giữ thể bị động và diễn đạt rõ sự chết; cách này tự nhiên hơn cấu trúc danh hóa dài trong tiếng Việt.
- source_word: σαρκὶ
  choice: về phần xác
  rationale: Giữ sự song song với πνεύματι và chỉ phương diện/lĩnh vực của đời sống thân xác hữu tử, không diễn giải thành “bản tính tội lỗi”.
- source_word: ζῳοποιηθεὶς
  choice: được làm cho sống
  rationale: Giữ thể bị động của động từ và nghĩa được ban sự sống.
- source_word: πνεύματι
  choice: về phần linh
  rationale: 'Giữ cách hiểu theo phương diện/lĩnh vực trong bản văn chính, đồng thời chú thích khả năng hiểu là tác nhân: “bởi Thánh Linh”.'
theological_decisions:
- issue: Sự tương phản giữa σαρκὶ và πνεύματι
  choice: “về phần xác ... về phần linh”
  alternative: “về thân thể ... về tâm linh” hoặc “bởi Thánh Linh”
  rationale: Hai danh từ cách cho trong tiếng Hy Lạp ngắn gọn và có thể chỉ phương diện/lĩnh vực hoặc, riêng với πνεύματι, tác nhân. Bản chính giữ cấu trúc song song và sự mơ hồ; chú thích nêu cách hiểu về tác nhân của Thánh Linh.
- issue: Lực thay thế/đại diện của δίκαιος ὑπὲρ ἀδίκων
  choice: “Đấng công chính thay cho những người bất chính”
  alternative: “Đấng công chính vì những người bất chính”
  rationale: “Thay cho” thể hiện lực đại diện/thay thế của ὑπέρ trong ngữ cảnh này, nhưng không thêm một công thức thần học vượt quá câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đấng Mê-si” giữ nghĩa tước hiệu; “Đức Chúa Trời” dùng cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt. Đại từ “anh em” phù hợp với số nhiều ὑμᾶς và giọng thư tín.
