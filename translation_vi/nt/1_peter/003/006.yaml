id: 1PE.3.6
reference: 1 Peter 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: vi
  text: như Sa-ra đã vâng lời Áp-ra-ham và gọi ông là chủ. Chị em đã trở nên con cái của bà nếu làm điều lành và không sợ bất cứ sự đe dọa nào.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bất cứ nỗi kinh hãi nào”; hoặc: “bất cứ điều gì đáng sợ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: như
  rationale: Mở đầu việc nêu Sa-ra làm gương tương ứng với lời khuyên ở phần trước; “như” tự nhiên và giữ được quan hệ so sánh.
- source_word: ὑπήκουσεν
  choice: đã vâng lời
  rationale: Diễn đạt trực tiếp nghĩa thông thường của ὑπακούω là nghe theo hoặc vâng lời, không làm nhẹ động từ vì lý do văn hóa hay thần học.
- source_word: κύριον
  choice: chủ
  rationale: Đây là cách Sa-ra tôn xưng Áp-ra-ham, không phải danh hiệu dành cho Đức Chúa Trời. “chủ” giữ nghĩa của κύριος và tránh khiến người đọc hiểu lầm là danh hiệu thần linh.
- source_word: καλοῦσα
  choice: gọi ông là
  rationale: Giữ chức năng của phân từ, cho biết cách thức hoặc biểu hiện của việc Sa-ra vâng lời; kết hợp bằng “và” tạo câu tiếng Việt tự nhiên.
- source_word: ἧς ... τέκνα
  choice: con cái của bà
  rationale: Đại từ quan hệ giống cái chỉ về Sa-ra; cách diễn đạt này giữ nguyên hình ảnh quan hệ mẹ-con theo nghĩa biểu tượng.
- source_word: ἐγενήθητε
  choice: đã trở nên
  rationale: Thể hiện việc bước vào một địa vị có kết quả còn liên quan ở hiện tại, thay vì làm phẳng thành “là”.
- source_word: ἀγαθοποιοῦσαι
  choice: nếu làm điều lành
  rationale: Trong quan hệ với mệnh đề chính và phân từ tiếp theo, phân từ mang sắc thái điều kiện thực hành; “nếu” làm rõ quan hệ này trong tiếng Việt.
- source_word: μὴ φοβούμεναι
  choice: không sợ
  rationale: Dùng động từ hữu hạn tự nhiên trong tiếng Việt, đồng thời giữ ý về thái độ không sống trong sợ hãi.
- source_word: μηδεμίαν πτόησιν
  choice: bất cứ sự đe dọa nào
  rationale: πτόησις có thể chỉ nỗi kinh hãi, cơn hoảng sợ hoặc điều gây sợ hãi. “sự đe dọa” phù hợp với bối cảnh khuyên nhủ, còn các khả năng sát chữ hơn được giữ trong chú thích.
theological_decisions:
- issue: Sự vâng lời của Sa-ra như gương cho các nữ tín hữu
  choice: Giữ cách dịch trực tiếp “đã vâng lời” nhưng không mở rộng câu này thành một giáo thuyết toàn diện về hôn nhân.
  alternative: Dịch nhẹ hơn là “đã thuận phục” hoặc “đã nghe theo”.
  rationale: ὑπήκουσεν có nghĩa rõ là vâng lời/nghe theo. Bản dịch không nên làm yếu nghĩa vì quan điểm văn hóa, cũng không nên thêm những khẳng định thần học vượt quá câu văn.
- issue: Quan hệ của hai phân từ ἀγαθοποιοῦσαι và μὴ φοβούμεναι với mệnh đề chính
  choice: 'Diễn đạt theo sắc thái điều kiện: “nếu làm điều lành và không sợ...”'
  alternative: 'Diễn đạt theo sắc thái mô tả: “khi làm điều lành và không sợ...”'
  rationale: Hai phân từ mô tả cách người đọc thể hiện mình là con cái của Sa-ra và trong văn cảnh có sắc thái điều kiện thực hành. “nếu” giữ sức nặng khuyên nhủ mà không biến nó thành một hệ thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chị em” vì văn cảnh và các phân từ giống cái cho thấy lời này hướng đến phụ nữ. Tên riêng theo dạng quen dùng trong tiếng Việt. “chủ” viết thường để phân biệt với danh hiệu thần linh. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
