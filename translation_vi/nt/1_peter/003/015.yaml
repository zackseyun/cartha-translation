source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: vi
  text: Nhưng trong lòng anh chị em, hãy tôn Đấng Mê-si-a là Chúa, là Đấng thánh,[a] luôn sẵn sàng đưa ra lời biện giải cho bất cứ ai yêu cầu anh chị em giải thích về niềm hy vọng ở trong anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “hãy thánh hóa Đấng Mê-si-a là Chúa trong lòng anh chị em.” Động từ này có nghĩa là coi hoặc biệt riêng Ngài là thánh.'
    reason: lexical_alternative
  - marker: b
    text: “Lời biện giải” cũng có thể dịch là “lời bênh vực” hoặc “lời giải trình.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον δὲ τὸν Χριστὸν
  choice: Nhưng ... hãy tôn Đấng Mê-si-a là Chúa thánh khiết
  rationale: Giữ Χριστός theo nghĩa tước hiệu là “Đấng Mê-si-a” và κύριος là “Chúa”; cách sắp xếp tiếng Việt gắn cả cụm với mệnh lệnh ἁγιάσατε và giữ sắc thái thừa nhận Ngài là Chúa thánh khiết.
- source_word: ἁγιάσατε
  choice: hãy tôn ... thánh khiết
  rationale: Động từ có nghĩa “thánh hóa, coi là thánh, biệt riêng là thánh.” Với Đấng Mê-si-a làm tân ngữ, “tôn ... thánh khiết” truyền đạt hành động nhìn nhận và tôn kính, không hàm ý con người làm cho Ngài trở nên thánh.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng anh chị em
  rationale: Diễn đạt tự nhiên nơi chốn nội tâm của καρδία; “anh chị em” truyền tải số nhiều và giọng mục vụ.
- source_word: ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν
  choice: luôn sẵn sàng biện giải
  rationale: ἀπολογία chỉ lời bênh vực, giải trình hay biện giải. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái lý lẽ của từ mà không giới hạn vào thủ tục pháp lý.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: với bất cứ ai yêu cầu anh chị em trình bày lý do
  rationale: Giữ tính bao quát của παντί và hiểu λόγον theo ngữ cảnh là lý do hay lời giải trình; thêm “trình bày” để câu tiếng Việt hoàn chỉnh và rõ nghĩa.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: về niềm hy vọng ở trong anh chị em
  rationale: Bám sát giới từ περὶ và cụm ἐν ὑμῖν, đồng thời giữ khả năng chỉ niềm hy vọng hiện hữu trong cộng đồng hoặc nơi mỗi tín hữu.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ; Chúa Cứu Thế
  rationale: Ở đây Χριστός mang tính tước hiệu và đi cùng κύριος, nên “Đấng Mê-si-a” giữ rõ ý nghĩa chức danh mà không biến thành tên riêng hay diễn giải rộng hơn nguồn.
- issue: Ý nghĩa của ἁγιάσατε khi Đấng Mê-si-a là tân ngữ
  choice: tôn Đấng Mê-si-a là Chúa thánh khiết
  alternative: thánh hóa Đấng Mê-si-a là Chúa; biệt riêng Đấng Mê-si-a làm Chúa
  rationale: Lựa chọn này không hàm ý tín hữu khiến Đấng Mê-si-a trở nên thánh, nhưng vẫn giữ mệnh lệnh nhìn nhận và tôn kính Ngài là Chúa thánh khiết. Chú thích bảo tồn cách dịch sát chữ hơn.
- issue: Quan hệ cú pháp giữa κύριον và Χριστόν
  choice: Đấng Mê-si-a là Chúa thánh khiết
  alternative: Chúa, tức là Đấng Mê-si-a; Chúa Mê-si-a
  rationale: Cách dịch chính hiểu κύριον theo quan hệ vị ngữ với τὸν Χριστόν trong mệnh lệnh, đồng thời không che khuất sự gắn kết chặt chẽ giữa hai tước hiệu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng “anh chị em” cho đại từ số nhiều và giọng mục vụ. “Đấng Mê-si-a” bảo tồn tước hiệu; “biện giải” giữ sắc thái trình bày lý lẽ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
