id: 1PE.3.5
reference: 1 Peter 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: vi
  text: Vì xưa kia, các phụ nữ thánh trông cậy nơi Đức Chúa Trời[a] cũng trang sức mình theo cách ấy, thuận phục chồng mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đặt hy vọng nơi Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: theo cách ấy
  rationale: Chỉ trở lại cách trang sức vừa được mô tả trong văn cảnh trước, đồng thời giữ sắc thái chỉ định của trạng từ Hy Lạp.
- source_word: γάρ
  choice: Vì
  rationale: Giới thiệu lý do hoặc lời giải thích cho lời khuyên ở câu trước.
- source_word: ποτε
  choice: xưa kia
  rationale: Chỉ thời trước và phù hợp tự nhiên với việc nêu gương các phụ nữ thuộc những thế hệ trước.
- source_word: ἅγιαι γυναῖκες
  choice: các phụ nữ thánh
  rationale: Giữ nguyên ý nghĩa trực tiếp của ἅγιαι, không làm nhẹ thành chỉ ‘đạo đức’.
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: trông cậy nơi Đức Chúa Trời
  rationale: Diễn đạt tự nhiên đặc điểm thường xuyên của các phụ nữ này và giữ Đức Chúa Trời là đối tượng của niềm hy vọng.
- source_word: ἐκόσμουν ἑαυτάς
  choice: trang sức mình
  rationale: Giữ liên hệ từ vựng với chủ đề về sự trang sức và vẻ đẹp trong văn cảnh gần.
- source_word: ὑποτασσόμεναι
  choice: thuận phục
  rationale: Giữ quan hệ phân từ chỉ cách thức họ trang sức mình; ‘thuận phục’ truyền đạt sự đặt mình dưới trật tự có thẩm quyền mà không đồng nhất từ này với động từ ‘vâng lời’.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: chồng mình
  rationale: Trong văn cảnh gia đình, ἀνδράσιν có nghĩa là ‘chồng’; đại từ ‘mình’ giữ giới hạn rõ ràng của ἰδίοις đối với chính chồng của họ.
theological_decisions:
- issue: Phạm vi của sự thuận phục trong hôn nhân
  choice: thuận phục chồng mình
  alternative: ở dưới quyền chồng mình
  rationale: Bản dịch giữ lời mô tả về các phụ nữ thánh trong quan hệ với chính chồng họ, không mở rộng thành một mệnh đề về quan hệ giữa mọi phụ nữ và mọi nam giới. Cách dịch cũng duy trì dạng phân từ chỉ cách thức thay vì biến nó thành một mệnh lệnh độc lập.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. ‘Xưa kia’ tự nhiên hơn lối nói nặng tính cổ văn; ‘phụ nữ thánh’ giữ thuật ngữ thần học của nguyên văn; ‘thuận phục’ được chọn để phân biệt với ý ‘vâng lời’. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải nghĩa.
