    rationale: ἐκκλινάτω, ποιησάτω, ζητησάτω và διωξάτω là các mệnh lệnh chủ động ngôi thứ ba số ít; bản thân chúng không đánh dấu giống đực. Chú thích cần mô tả chính xác ngôi và số, đồng thời chỉ nói ý chủ thể đại diện được hiểu theo ngữ cảnh.
  - severity: low
    issue: Đại từ “nó” sau “sự bình an” hơi gượng trong văn phong tiếng Việt trang trọng.
    rationale: Lặp lại “sự bình an ấy” rõ nghĩa và tự nhiên hơn, không thay đổi ý nghĩa hay cường độ của διωξάτω αὐτήν.
