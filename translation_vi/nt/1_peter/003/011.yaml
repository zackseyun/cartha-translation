source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: vi
  text: Nhưng người ấy phải lìa xa điều ác và làm điều thiện;[a] phải tìm kiếm sự bình an và theo đuổi sự bình an ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mỗi người phải lìa xa điều ác và làm điều thiện; phải tìm kiếm sự bình an và theo đuổi sự bình an ấy.” Bản văn Hy Lạp dùng các mệnh lệnh ngôi thứ ba số ít; chủ thể số ít có ý nghĩa đại diện theo ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: phải lìa xa
  rationale: Mệnh lệnh cách chủ động aorist, ngôi thứ ba số ít, kêu gọi một hành động dứt khoát. “Lìa xa” giữ được nét chuyển hướng khỏi điều ác.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ nối tiếp với sắc thái tương phản nhẹ so với lời trước; “nhưng” phù hợp với mạch khuyên bảo.
- source_word: ἀπὸ κακοῦ
  choice: khỏi điều ác
  rationale: κακόν ở đây mang nghĩa luân lý, đối lập với ἀγαθόν; “điều ác” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ποιησάτω ἀγαθόν
  choice: làm điều thiện
  rationale: Cụm từ diễn tả hành động đạo đức tích cực; “làm điều thiện” vừa trang trọng vừa thông dụng.
- source_word: ζητησάτω
  choice: phải tìm kiếm
  rationale: Giữ nghĩa cơ bản của ζητέω và duy trì bước tiến tu từ từ tìm kiếm đến tích cực theo đuổi.
- source_word: εἰρήνην
  choice: sự bình an
  rationale: “Sự bình an” giữ được phạm vi nghĩa rộng của εἰρήνη, gồm hòa thuận và trạng thái an lành, mà không thu hẹp vào một khía cạnh riêng.
- source_word: διωξάτω αὐτήν
  choice: và theo đuổi nó
  rationale: διώκω diễn tả sự theo đuổi tích cực, bền bỉ; “nó” quy chiếu rõ về “sự bình an” và bảo toàn đại từ của nguyên văn.
- source_word: 3rd person singular imperatives
  choice: người ấy phải ...; phải ...
  rationale: Tiếng Việt không có cấu trúc tương đương tự nhiên với “let him”; dùng “người ấy phải” bảo toàn ngôi thứ ba số ít và lực mệnh lệnh, trong khi chú thích nêu rõ ý nghĩa đại diện.
theological_decisions:
- issue: Dạng giống đực số ít mang nghĩa đại diện trong chuỗi mệnh lệnh
  choice: Dùng “người ấy” trong chính văn
  alternative: Dùng “mỗi người”, “người ta” hoặc chuyển thành ngôi thứ hai
  rationale: Các động từ Hy Lạp ở ngôi thứ ba số ít, còn chủ thể được hiểu từ ngữ cảnh trích dẫn Thi Thiên và có lực đại diện. “Người ấy” giữ hình thức số ít mà không khiến tiếng Việt phải gán giới tính không được biểu thị trên đại từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “điều ác/điều thiện” để thể hiện đối lập đạo đức; “tìm kiếm/theo đuổi” giữ nhịp tăng tiến của hai động từ Hy Lạp. Dấu chú thích [a] được đặt sau mệnh đề đầu, tương ứng với vấn đề chủ thể đại diện áp dụng cho toàn câu.
