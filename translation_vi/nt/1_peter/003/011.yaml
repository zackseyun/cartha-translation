  verdict: revise
  source_fidelity: 'Chính văn truyền đạt đúng chuỗi mệnh lệnh: quay khỏi điều ác, làm điều thiện, tìm kiếm bình an và tích cực theo đuổi bình an. Tuy nhiên, chú thích hiện nói tiếng Hy Lạp dùng “dạng số ít giống đực”; các động từ mệnh lệnh ngôi thứ ba số ít trong câu này không tự mang giống ngữ pháp. Ý chủ thể số ít được hiểu từ ngữ cảnh trích dẫn liền trước, chứ không phải từ hình thức giống đực của các động từ.'
  naturalness: “Người ấy phải …” là lối diễn đạt trang trọng, có thể chấp nhận trong văn phong Kinh Thánh hiện đại. Việc thay đại từ “nó” bằng việc lặp lại “sự bình an ấy” tự nhiên hơn trong tiếng Việt khi quy chiếu một khái niệm trừu tượng.
  terminology: “Điều ác/điều thiện” giữ rõ tương phản đạo đức của κακόν/ἀγαθόν. “Sự bình an” và cặp “tìm kiếm/theo đuổi” bảo toàn trường nghĩa cùng sự tăng tiến của ζητέω/διώκω.
  issues:
