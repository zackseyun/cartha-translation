id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: vi
  text: Tương ứng với điều ấy[a], phép báp-têm hiện nay cũng cứu anh em—không phải là sự loại bỏ chất bẩn khỏi thân thể, nhưng là lời cầu xin hướng đến Đức Chúa Trời về một lương tâm tốt lành—nhờ sự sống lại của Giê-su, Đấng Mê-si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng là lời cam kết với Đức Chúa Trời của một lương tâm tốt lành.” Từ Hy Lạp được dịch là “lời cầu xin” cũng có thể được hiểu là “lời cam kết” hoặc “lời đáp.”'
    reason: Giữ lại các cách hiểu có cơ sở của ἐπερώτημα và sự mơ hồ của cụm sở hữu cách συνειδήσεως ἀγαθῆς.
lexical_decisions:
- source_word: ἀντίτυπον
  choice: Tương ứng với điều ấy
  rationale: Cụm này nối phép báp-têm với nước trong biến cố vừa nêu ở câu trước, đồng thời tránh thuật ngữ thần học chuyên môn khó hiểu.
- source_word: σῴζει
  choice: cứu
  rationale: Giữ nguyên phát biểu trực tiếp của động từ hiện tại, không làm nhẹ ý nghĩa.
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Cách gọi quen thuộc và chính xác; ngữ cảnh phân biệt phép báp-têm với việc tẩy rửa thân thể đơn thuần.
- source_word: σαρκὸς
  choice: thân thể
  rationale: Trong ngữ cảnh chất bẩn vật chất, từ này chỉ thân thể theo nghĩa cụ thể; cách diễn đạt này tự nhiên hơn 'xác thịt' trong tiếng Việt hiện đại.
- source_word: ἀπόθεσις ῥύπου
  choice: loại bỏ chất bẩn
  rationale: Diễn đạt rõ hành động làm sạch bên ngoài mà tác giả phủ định.
- source_word: συνειδήσεως ἀγαθῆς
  choice: một lương tâm trong sạch
  rationale: Thể hiện phẩm chất tốt lành, ngay thẳng của lương tâm bằng cách nói tự nhiên trong tiếng Việt.
- source_word: ἐπερώτημα εἰς θεόν
  choice: lời cầu xin Đức Chúa Trời ban
  rationale: Hiểu danh từ gây tranh luận này là lời thỉnh cầu hướng đến Đức Chúa Trời; chữ 'ban' làm rõ quan hệ 'cho một lương tâm trong sạch' mà không bổ sung hệ thống thần học riêng.
- source_word: δι’ ἀναστάσεως
  choice: nhờ sự sống lại
  rationale: Diễn đạt phương tiện hoặc nền tảng hiệu lực của sự cứu rỗi một cách tự nhiên.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Giữ Χριστός như tước hiệu và dùng dạng tên gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa phép báp-têm và sự cứu rỗi
  choice: Giữ lời khẳng định trực tiếp rằng phép báp-têm cứu, rồi để chính mệnh đề phủ định và đối chiếu của câu giải thích ý nghĩa.
  alternative: Diễn giải thành phép báp-têm chỉ tượng trưng cho sự cứu rỗi, hoặc thêm một học thuyết bí tích cụ thể.
  rationale: Bản Hy Lạp trực tiếp nói βάπτισμα ... σῴζει nhưng lập tức bác bỏ cách hiểu như sự tẩy rửa thân thể đơn thuần; bản dịch cần giữ nguyên sức căng này.
- issue: Ý nghĩa của ἐπερώτημα
  choice: Dịch là 'lời cầu xin' trong chính văn.
  alternative: Lời cam kết hoặc lời đáp của một lương tâm trong sạch đối với Đức Chúa Trời.
  rationale: Nghĩa 'lời cầu xin' phù hợp với hướng εἰς θεόν, nhưng nghĩa 'lời cam kết/lời đáp' có cơ sở đáng kể nên được giữ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'phép báp-têm' theo cách gọi phổ biến; tránh 'xác thịt' vì ở đây σάρξ chỉ thân thể vật chất. Dấu gạch ngang giữ cấu trúc giải thích và đối chiếu của câu Hy Lạp.
