  text: ἐποπτεύσαντες τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/002.yaml
  text: when they observe your pure conduct in fear.
translation:
  language: vi
  text: khi họ tận mắt thấy nếp sống trong sạch của anh chị em trong sự kính sợ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: khi họ tận mắt thấy
  rationale: Động từ ἐποπτεύω diễn tả việc trực tiếp quan sát, chứng kiến; “tận mắt thấy” truyền đạt sắc thái này tự nhiên trong tiếng Việt.
- source_word: ἁγνὴν
  choice: trong sạch
  rationale: ἁγνός ở đây chỉ sự thanh sạch về đạo đức; “trong sạch” vừa rõ nghĩa vừa phù hợp văn phong trang trọng.
- source_word: ἀναστροφὴν
  choice: nếp sống
  rationale: ἀναστροφή nói về cách cư xử hay toàn bộ lối sống; “nếp sống” tự nhiên hơn “hành vi” và giữ được phạm vi rộng.
- source_word: ἐν φόβῳ
  choice: trong sự kính sợ
  rationale: Giữ cấu trúc ἐν và sự mở nghĩa của φόβος, đồng thời “kính sợ” phù hợp ngữ cảnh đạo đức và thần học hơn nghĩa thuần túy là hoảng sợ.
theological_decisions:
- issue: Đối tượng của sự kính sợ trong cụm ἐν φόβῳ không được nêu trực tiếp
  choice: trong sự kính sợ
  alternative: với lòng kính sợ Đức Chúa Trời
  rationale: Không thêm “Đức Chúa Trời” vào chính văn vì nguyên ngữ không nêu đối tượng; cách dịch được chọn bảo tồn sự hàm súc và mối liên hệ có thể có với cả 2:17 lẫn ngữ cảnh hôn nhân.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Anh chị em” dùng để chuyển đại từ số nhiều ὑμῶν theo lối bao hàm; câu là một mệnh đề phụ nối tiếp 1 Phi-e-rơ 3:1.
