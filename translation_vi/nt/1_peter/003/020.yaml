reference: 1 Peter 3:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: vi
  text: là những kẻ trước kia không vâng phục, khi sự kiên nhẫn của Đức Chúa Trời đang chờ đợi vào thời Nô-ê, trong lúc con tàu đang được đóng. Vào trong đó, chỉ có ít người, tức là tám người[a], đã được đưa an toàn qua nước[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “tám linh hồn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã được cứu qua nước” hoặc “đã được cứu nhờ nước.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: đã không vâng phục
  rationale: Diễn đạt hành vi khước từ vâng phục, không thu hẹp nghĩa thành sự không tin về mặt nhận thức.
- source_word: ποτε
  choice: trước kia
  rationale: Chỉ một thời điểm trong quá khứ so với mạch văn hiện tại.
- source_word: ἀπεξεδέχετο
  choice: vẫn chờ đợi
  rationale: Thể chưa hoàn thành diễn tả sự chờ đợi kéo dài; từ “vẫn” làm rõ sắc thái tiếp diễn.
- source_word: ἡ τοῦ θεοῦ μακροθυμία
  choice: sự nhẫn nại của Đức Chúa Trời
  rationale: Giữ cấu trúc trong đó sự nhẫn nại của Đức Chúa Trời là chủ thể chờ đợi, đồng thời dùng cách nói tự nhiên và trang trọng.
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: lúc chiếc tàu đang được đóng
  rationale: Trong bối cảnh Nô-ê, động từ chỉ việc chuẩn bị hoặc kiến tạo chiếc tàu; “đang được đóng” tự nhiên và giữ sắc thái tiến hành của phân từ.
- source_word: εἰς ἣν
  choice: đi vào tàu
  rationale: Giữ ý chuyển động vào bên trong của εἰς, dù chuyển đại từ quan hệ thành danh từ để câu tiếng Việt rõ ràng.
- source_word: ὀλίγοι
  choice: chỉ một số ít người
  rationale: Nêu bật số lượng nhỏ và liên kết tự nhiên với lời giải thích tiếp theo.
- source_word: τοῦτ’ ἔστιν ὀκτὼ ψυχαί
  choice: tức là tám người
  rationale: ψυχαί ở đây dùng để đếm con người, không nhất thiết đưa ra một khẳng định kỹ thuật về bản thể linh hồn.
- source_word: διεσώθησαν
  choice: đã được đưa ... an toàn
  rationale: Giữ sắc thái được bảo toàn và đưa qua hiểm nguy của διασῴζω, đồng thời tránh làm mất nghĩa cụ thể của biến cố lụt.
- source_word: δι’ ὕδατος
  choice: qua nước
  rationale: Giữ sự mơ hồ thực sự của διά với sở hữu cách giữa phương tiện và việc đi xuyên qua; cách dịch chính phù hợp với hình ảnh được đưa an toàn qua trận nước lụt.
theological_decisions:
- issue: Sắc thái cứu rỗi tiềm ẩn trong διεσώθησαν
  choice: đã được đưa qua nước an toàn
  alternative: đã được cứu qua nước
  rationale: Bản chính nhấn mạnh việc tám người được bảo toàn qua hiểm họa cụ thể, nhưng chú thích giữ cách dịch “được cứu” vì động từ có thể mang nghĩa ấy và có ý nghĩa đối với liên hệ với phép báp-têm ở câu sau.
- issue: Cách hiểu ψυχαί
  choice: người
  alternative: linh hồn
  rationale: Trong ngữ cảnh, từ này đếm những con người ở trên tàu. Cách dịch “người” tránh áp đặt một quan niệm nhân học, còn nghĩa sát chữ được giữ trong chú thích.
- issue: Quan hệ của nước với sự giải cứu trong δι’ ὕδατος
  choice: qua nước
  alternative: nhờ nước
  rationale: Giới từ διά với sở hữu cách có thể chỉ phương tiện, nhưng nước cũng chính là hiểm họa họ được đưa qua. Không chọn “nhờ nước” trong bản chính để khỏi giải quyết dứt khoát sự căng thẳng này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được tách nhẹ để tránh chuỗi mệnh đề nặng nề, nhưng vẫn giữ quan hệ cú pháp và sự mơ hồ thần học quan trọng của nguyên văn.
