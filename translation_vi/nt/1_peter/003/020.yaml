  to: là những kẻ trước kia không vâng phục, khi sự kiên nhẫn của Đức Chúa Trời đang chờ đợi vào thời Nô-ê, trong lúc con tàu đang được đóng. Vào trong đó, chỉ có ít người, tức là tám người[a], đã được đưa an toàn qua nước[b].
