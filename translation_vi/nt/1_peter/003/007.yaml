id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: vi
  text: Cũng vậy, những người chồng, hãy chung sống với vợ mình theo sự hiểu biết; hãy dành sự tôn trọng cho người nữ như cho một chiếc bình yếu hơn[a], như cũng là những người đồng thừa hưởng ân điển của sự sống[b], để những lời cầu nguyện của anh em không bị ngăn trở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chiếc bình yếu hơn” là một phép ẩn dụ, có thể nói đến sự yếu hơn tương đối về thể chất hoặc tình trạng dễ bị tổn thương trong xã hội, chứ không nói người vợ kém giá trị; ngay sau đó, câu này khẳng định người vợ cũng đồng thừa hưởng ân điển của sự sống.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “những người cùng thừa kế ân điển của sự sống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: những người làm chồng
  rationale: Trong mạch văn về đời sống gia đình tiếp sau lời dạy dành cho người vợ, từ này chỉ những người chồng, không phải nam giới nói chung.
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Giữ mối liên kết so sánh với những lời khuyên trước đó.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: hãy chung sống với vợ mình theo sự hiểu biết
  rationale: 'Diễn đạt tự nhiên đời sống chung trong hôn nhân, đồng thời giữ độ rộng của cụm ''theo sự hiểu biết'': cách cư xử được định hướng bởi nhận thức đúng đắn.'
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: người nữ như một chiếc bình yếu hơn
  rationale: Giữ nguyên phép ẩn dụ 'chiếc bình' và sắc thái so sánh của 'yếu hơn', không tự ý giới hạn ý nghĩa vào thể chất hay địa vị xã hội.
- source_word: ἀπονέμοντες τιμήν
  choice: dành sự tôn trọng
  rationale: Chuyển tải hành động trao hoặc dành cho người vợ sự tôn quý thích đáng bằng tiếng Việt tự nhiên.
- source_word: συγκληρονόμοις
  choice: những người đồng thừa hưởng
  rationale: Nêu rõ sự cùng chia sẻ quyền thừa hưởng; số nhiều phù hợp với lời nói chung về các người vợ.
- source_word: χάριτος ζωῆς
  choice: ân điển của sự sống
  rationale: 'Giữ cấu trúc sở hữu và sự mơ hồ chân thực: có thể là ân điển bao gồm sự sống hoặc ân điển ban sự sống.'
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: để lời cầu nguyện của anh em không bị ngăn trở
  rationale: Giữ quan hệ mục đích/kết quả và thể bị động; 'anh em' thể hiện đại từ số nhiều hướng đến những người chồng.
theological_decisions:
- issue: Ý nghĩa của hình ảnh 'chiếc bình yếu hơn'
  choice: Giữ cách nói so sánh và phép ẩn dụ, đồng thời chú thích rằng câu không khẳng định người vợ kém giá trị hay địa vị thuộc linh.
  alternative: Diễn giải trực tiếp là yếu hơn về thể chất hoặc dễ bị tổn thương hơn trong xã hội.
  rationale: Nguyên văn không xác định loại yếu đuối nào; ngay sau đó, người vợ được khẳng định là đồng thừa hưởng ân điển của sự sống.
- issue: Quan hệ của ὡς καὶ συγκληρονόμοις với mệnh lệnh dành sự tôn trọng
  choice: Dịch tự nhiên bằng 'vì họ cũng là những người đồng thừa hưởng'.
  alternative: 'Dịch sát hình thức hơn: ''như những người cũng đồng thừa hưởng''.'
  rationale: ὡς có thể giới thiệu tư cách hoặc căn cứ nhìn nhận; tiếng Việt dùng 'vì' làm rõ lý do hàm ẩn nhưng không thay đổi nội dung rằng người vợ cùng được thừa hưởng.
- issue: Nội dung của 'ân điển của sự sống'
  choice: Giữ nguyên cụm từ rộng nghĩa.
  alternative: Diễn giải là sự sống đời đời hoặc món quà sự sống do ân sủng ban cho.
  rationale: Cấu trúc nguyên văn không buộc phải chọn duy nhất một cách giải thích; bản dịch tránh thu hẹp nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'người làm chồng' và 'vợ mình' để làm rõ bối cảnh hôn nhân; giữ hình ảnh 'chiếc bình' vì đây là ẩn dụ có chủ ý trong nguyên văn. Cụm 'theo sự hiểu biết' được giữ tương đối sát để không thu hẹp thành sự cảm thông đơn thuần.
