  terminology: “Sự nhu hòa,” “lòng kính sợ,” “nếp sống,” và “Đấng Mê-si” đều phù hợp. Chú thích về φόβου và ἐν Χριστῷ bảo lưu hợp lý các cách hiểu thay thế. Cần chỉnh chú thích b để dùng cách diễn đạt hiện đại, nhất quán với chính văn.
