  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung sát nguyên văn: giữ được hai thái độ πραΰτης và φόβος, lời nói vu chống lại độc giả, nếp sống tốt trong Đấng Mê-si, và kết quả hổ thẹn dành cho những người công kích. Tuy nhiên, “đồng thời giữ lương tâm tốt” chuyển ἔχοντες (“có/đang có”) thành ý duy trì hoặc gìn giữ. “Trong chính điều” thêm sắc thái nhấn mạnh không có trong ἐν ᾧ.'
