id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: vi
  text: nhưng với sự nhu hòa và lòng kính sợ[a], có một lương tâm tốt, để trong điều anh chị em bị nói xấu[b], những kẻ lăng mạ nếp sống tốt đẹp của anh chị em trong Đấng Mê-si[c] phải xấu hổ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lòng tôn kính” hoặc “sự tôn trọng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “trong vấn đề mà anh chị em bị nói xấu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Tiếng Hy Lạp: “trong Đấng Mê-si”; theo cách gọi truyền thống: “trong Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: sự nhu hòa
  rationale: Diễn tả thái độ khiêm nhường, ôn tồn, không gay gắt; đây là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: φόβου
  choice: lòng kính sợ
  rationale: Giữ sắc thái sợ và tôn kính mà không nêu rõ đối tượng; chú thích bảo lưu các khả năng 'lòng tôn kính' và 'sự tôn trọng'.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: đồng thời giữ lương tâm tốt
  rationale: Diễn đạt tự nhiên giá trị hoàn cảnh đi kèm của phân từ, đồng thời giữ nghĩa đạo đức đơn giản của ἀγαθήν.
- source_word: ἐν ᾧ
  choice: trong chính điều
  rationale: Giữ cách quy chiếu cô đọng và tương đối mở của tiếng Hy Lạp, không tự ý xác định cụ thể vấn đề mà độc giả bị nói xấu.
- source_word: καταλαλεῖσθε
  choice: anh chị em bị nói xấu
  rationale: Thể hiện lời nói thù nghịch chống lại một người, đồng thời tự nhiên hơn 'bị vu khống' nếu lời ấy không nhất thiết là lời tố cáo pháp lý.
- source_word: καταισχυνθῶσιν
  choice: phải hổ thẹn
  rationale: Trong mệnh đề chỉ mục đích hoặc kết quả với ἵνα, cách dịch này diễn đạt sự đảo ngược khiến những người công kích rơi vào hổ thẹn.
- source_word: ἐπηρεάζοντες
  choice: những kẻ lăng mạ
  rationale: Truyền đạt hành vi xúc phạm, công kích đầy ác ý và phân biệt với động từ 'nói xấu' đứng trước.
- source_word: ἀναστροφήν
  choice: nếp sống
  rationale: Bao quát cách cư xử và toàn bộ lối sống, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Χριστός tại đây vẫn mang giá trị tước hiệu; 'Đấng Mê-si' truyền đạt nghĩa của tước hiệu, còn cách gọi truyền thống được ghi ở chú thích.
- source_word: ἀγαθὴν
  choice: tốt đẹp
  rationale: Giữ ý nghĩa đạo đức tích cực của ἀγαθός và tạo cụm tiếng Việt tự nhiên với 'nếp sống'.
theological_decisions:
- issue: Ý nghĩa của φόβου trong cụm 'với sự nhu hòa và lòng kính sợ'
  choice: Giữ 'lòng kính sợ' trong chính văn mà không xác định đối tượng.
  alternative: lòng tôn kính; sự tôn trọng; lòng kính sợ Đức Chúa Trời
  rationale: Ngữ cảnh trực tiếp không nói rõ đối tượng của φόβος. Không thêm 'Đức Chúa Trời' và không thu hẹp thành thái độ đối với con người, nhằm bảo lưu độ mở thần học của nguyên văn.
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Cụm ἐν Χριστῷ ở đây vẫn có thể nghe như một tước hiệu; dịch nghĩa là 'Đấng Mê-si' trong chính văn, đồng thời ghi cách gọi truyền thống ở chú thích.
- issue: Quan hệ của ἐν Χριστῷ với ἀναστροφήν
  choice: Giữ cụm 'nếp sống ... trong Đấng Mê-si' mà không diễn giải thêm.
  alternative: nếp sống tốt đẹp nhờ thuộc về Đấng Mê-si
  rationale: Nguyên văn diễn tả nếp sống trong phạm vi hoặc sự hiệp nhất với Đấng Mê-si nhưng không giải thích cụ thể quan hệ ấy; bản dịch không nên tự ý mở rộng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; “nếp sống” diễn đạt toàn diện ἀναστροφή; các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
