id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: vi
  text: 'Vì mắt Chúa hướng về những người công chính,

    và tai Ngài lắng nghe lời cầu xin của họ;

    nhưng mặt Chúa chống lại những kẻ làm điều ác.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu lý do hoặc nền tảng Kinh Thánh cho lời khuyên ở trước; “Vì” tự nhiên trong tiếng Việt và giữ rõ sắc thái nguyên nhân.
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: mắt Chúa hướng về những người công chính
  rationale: Giữ hình ảnh nhân cách hóa “mắt Chúa”; “hướng về” diễn đạt tự nhiên chiều hướng và sự lưu tâm của ἐπί với đối cách, còn δικαίους được hiểu theo nghĩa danh từ số nhiều.
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: tai Ngài lắng nghe lời cầu xin của họ
  rationale: Nguyên văn có cấu trúc tỉnh lược, sát nghĩa là “tai Ngài hướng đến lời cầu xin của họ.” Bổ sung “lắng nghe” làm rõ ý chăm chú nghe trong tiếng Việt mà vẫn giữ hình ảnh đôi tai; δέησις được dịch là “lời cầu xin” để phản ánh sắc thái khẩn nguyện.
- source_word: πρόσωπον δὲ κυρίου
  choice: nhưng mặt Chúa
  rationale: Giữ trực tiếp hình ảnh “mặt Chúa” từ câu trích dẫn; δέ mang tính tương phản nên dịch là “nhưng”.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: chống lại những kẻ làm điều ác
  rationale: Trong vế phủ định này, ἐπί chỉ sự đối nghịch; “chống lại” truyền đạt ý ấy tự nhiên. Cụm phân từ ποιοῦντας κακά được giữ với sắc thái hành động là “những kẻ làm điều ác.”
theological_decisions:
- issue: Ngôn ngữ nhân cách hóa về mắt, tai và mặt của Chúa
  choice: Giữ trực tiếp cả ba hình ảnh trong bản dịch
  alternative: Diễn giải thành “Chúa chăm nom, nghe và chống lại”
  rationale: Các hình ảnh thân thể là dụng ý văn chương của câu trích dẫn Thi Thiên, diễn tả sự đoái nhìn và đối nghịch của Đức Chúa Trời. Việc giữ hình ảnh bảo toàn sức nặng văn chương và thần học mà không buộc phải hiểu theo nghĩa thân thể vật chất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Chúa” cho κύριος và “Ngài” làm đại từ quy chiếu nhằm tránh lặp từ. Bố cục ba dòng giữ thế song song của mắt, tai và mặt; không cần chú thích vì các lựa chọn diễn đạt không che khuất một dị nghĩa đáng kể trong câu.
