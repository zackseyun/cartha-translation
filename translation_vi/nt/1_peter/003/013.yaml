- from: Vậy, ai sẽ làm hại anh chị em nếu anh chị em trở nên sốt sắng làm điều thiện?[a]
  to: Và ai sẽ làm hại anh chị em nếu anh chị em trở nên nhiệt thành vì điều thiện?[a]
  rationale: Sửa liên từ đầu câu để tránh diễn giải quan hệ logic quá mức, và sửa cụm chỉ sự nhiệt thành để phản ánh trực tiếp hơn cấu trúc ζηλωταὶ τοῦ ἀγαθοῦ. Câu hỏi tu từ cùng thì tương lai của “sẽ làm hại” được giữ nguyên, không biến thành lời hứa tuyệt đối về việc không chịu khổ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa hai điểm để sát tiếng Hy Lạp hơn: Καὶ là liên từ nối trung tính, nên “Và” phù hợp hơn “Vậy”, vốn dễ thêm quan hệ suy luận; và ζηλωταὶ τοῦ ἀγαθοῦ chỉ sự nhiệt thành đối với/cho điều thiện, không trực tiếp nói hành động “làm điều thiện”. Dạng “trở nên” vẫn giữ được sắc thái của γένησθε.'
  naturalness: Bản sửa dùng tiếng Việt hiện đại, trang trọng và tự nhiên trong văn mạch thư tín. “Nhiệt thành vì điều thiện” diễn đạt rõ sự dấn thân hướng về điều thiện mà không biến cụm danh từ Hy Lạp thành một hành động riêng lẻ.
  terminology: Giữ “làm hại” cho κακώσων, phù hợp phạm vi rộng của động từ; “điều thiện” cho τοῦ ἀγαθοῦ; và “nhiệt thành” cho ζηλωταί. “Anh chị em” vẫn là cách xưng hô cộng đồng phù hợp với số nhiều ὑμᾶς.
  issues:
  - severity: medium
    issue: “Vậy” có thể thêm sắc thái kết luận cho Καὶ.
    rationale: Καὶ ở đây trước hết là liên từ nối tiếp; “Và” bảo toàn sắc thái trung tính hơn, không buộc một quan hệ suy luận mạnh.
  - severity: medium
    issue: “Sốt sắng làm điều thiện” thu hẹp ζηλωταὶ τοῦ ἀγαθοῦ thành hành vi làm điều thiện.
    rationale: Cụm Hy Lạp mô tả người nhiệt thành đối với điều thiện; tuy ngữ cảnh có liên hệ đạo đức thực hành, bản dịch nên không chuyển ý này thành một động từ hành động cụ thể.
  revised_text: Và ai sẽ làm hại anh chị em nếu anh chị em trở nên nhiệt thành vì điều thiện?[a]
