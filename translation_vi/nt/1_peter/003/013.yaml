source:
  edition: SBLGNT
  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: vi
  text: Và ai sẽ làm hại anh chị em nếu anh chị em trở nên nhiệt thành vì điều thiện?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sốt sắng vì điều thiện.”'
    reason: ζηλωταί có thể diễn tả người sốt sắng, nhiệt thành đối với điều gì; phương án này giữ tính chất của từ gốc mà không biến nó thành hành động riêng lẻ.
lexical_decisions:
- source_word: Καὶ
  choice: Vậy
  rationale: Liên từ nối câu này với lời khuyên ở phần trước; “Vậy” diễn đạt tự nhiên mạch suy luận trong tiếng Việt mà không tạo sắc thái đối lập.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: ai sẽ làm hại anh chị em
  rationale: Kết cấu mạo từ với phân từ tương lai được chuyển thành câu hỏi tu từ tự nhiên, đồng thời giữ ý tương lai và phạm vi rộng của hành động gây hại.
- source_word: ἐὰν
  choice: nếu
  rationale: Diễn đạt trực tiếp mệnh đề điều kiện đi với thể giả định.
- source_word: τοῦ ἀγαθοῦ
  choice: làm điều thiện
  rationale: Tính từ trung tính được dùng như danh từ chỉ điều tốt lành; trong kết hợp với ζηλωταί, “làm điều thiện” tự nhiên và phù hợp ngữ cảnh nói về cách cư xử.
- source_word: ζηλωταὶ
  choice: sốt sắng
  rationale: Giữ cường độ của danh từ ζηλωτής, chỉ người nhiệt thành, tận tâm theo đuổi điều gì; “sốt sắng” trang trọng nhưng vẫn thông dụng.
- source_word: γένησθε
  choice: anh chị em trở nên
  rationale: Giữ sắc thái chuyển thành hoặc trở thành của γίνομαι thay vì giản lược thành “là”.
theological_decisions:
- issue: Sức nặng của câu hỏi tu từ khi đặt bên cạnh thực tế chịu khổ vì điều công chính
  choice: 'Giữ nguyên dạng bảo đảm mang tính tu từ: “ai sẽ làm hại...?”'
  alternative: Diễn đạt như một lời hứa tuyệt đối rằng không ai có thể thật sự làm hại tín hữu
  rationale: Ngữ cảnh kế tiếp thừa nhận khả năng họ vẫn phải chịu khổ vì làm điều công chính. Vì vậy, bản dịch không biến câu hỏi tu từ thành lời bảo đảm tuyệt đối rằng họ sẽ không gặp tổn hại hay ngược đãi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều ὑμᾶς và phù hợp lối xưng hô cộng đồng; giữ câu hỏi tu từ và dấu chân chú thích [a] trong chính văn.
