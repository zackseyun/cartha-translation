id: 1PE.3.10
reference: 1 Peter 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: vi
  text: Vì ai muốn yêu mến sự sống và thấy những ngày tốt đẹp thì phải giữ lưỡi mình khỏi điều ác và môi mình khỏi nói lời gian dối[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời xảo trá.” Từ Hy Lạp có thể chỉ sự gian dối, lừa lọc hoặc xảo trá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: ai muốn
  rationale: Cụm mạo từ với phân từ hiện tại được dùng như danh từ và chỉ chung bất cứ người nào; “ai muốn” tự nhiên trong tiếng Việt, giữ được ý khái quát mà không thêm giới tính.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này đưa ra căn cứ Kinh Thánh hoặc lời giải thích cho lời khuyên trước đó; “Vì” thể hiện rõ quan hệ lập luận.
- source_word: ζωὴν ἀγαπᾶν
  choice: yêu mến sự sống
  rationale: Giữ sát ý của động từ ἀγαπάω và danh từ ζωή; “yêu mến sự sống” trang trọng, dễ hiểu, không thêm sắc thái sở hữu vốn không có trong Hy Lạp.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: thấy những ngày tốt đẹp
  rationale: Giữ hình ảnh cụ thể của động từ “thấy”, đồng thời diễn đạt thành ngữ về việc trải nghiệm những ngày thuận lành; không thu hẹp thành sự thịnh vượng vật chất.
- source_word: παυσάτω
  choice: phải giữ ... khỏi
  rationale: Dù về hình thức là mệnh lệnh aorist với nghĩa “hãy làm cho ngừng”, kết cấu “phải giữ ... khỏi” truyền đạt tự nhiên sức mạnh của lời răn cùng các bổ ngữ theo sau.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: giữ lưỡi mình khỏi điều ác
  rationale: Tiếng Việt tự nhiên dùng “mình” với bộ phận cơ thể trong lời nói khái quát. “Điều ác” giữ phạm vi nghĩa rộng của κακόν trong văn cảnh lời nói.
- source_word: χείλη
  choice: môi mình
  rationale: Giữ hình ảnh cụ thể số nhiều theo nghĩa tập hợp tự nhiên trong tiếng Việt và nối kết nhất quán với chủ thể khái quát.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: khỏi lời gian dối
  rationale: Diễn đạt chức năng ngăn ngừa của kết cấu động từ nguyên mẫu có mạo từ với μή. “Lời gian dối” tự nhiên hơn “nói sự gian dối” trong tiếng Việt, đồng thời giữ trọng tâm vào phát ngôn lừa dối.
theological_decisions:
- issue: Chủ thể số ít mang nghĩa khái quát và cách biểu đạt giới tính
  choice: Dùng “ai muốn” và đại từ phản thân “mình”
  alternative: Dùng cách diễn đạt chỉ nam giới như “người đàn ông muốn ... lưỡi người ấy”
  rationale: Bản Hy Lạp nói về một cá nhân đại diện theo nghĩa khái quát, không nhằm giới hạn ở nam giới. “Ai ... mình” vừa tự nhiên trong tiếng Việt vừa bảo toàn tính khái quát và sự nhất quán của chủ thể.
- issue: Phạm vi nghĩa của δόλος
  choice: “gian dối” trong chính văn, kèm chú thích “xảo trá”
  alternative: Dịch chính văn là “xảo trá” hoặc “mưu mô”
  rationale: δόλος có thể chỉ sự lừa dối, thủ đoạn hoặc xảo trá. “Gian dối” dễ hiểu và phù hợp trực tiếp với hành vi nói năng, còn chú thích bảo tồn sắc thái rộng hơn mà không áp đặt một cách hiểu duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng phổ thông. Câu giữ phép song hành “lưỡi ... môi” của nguồn Hy Lạp và nhịp điệu của lời trích dẫn Kinh Thánh; không dùng từ cổ khó hiểu.
