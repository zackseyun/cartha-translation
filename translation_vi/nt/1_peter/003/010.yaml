revisions:
- from: Vì ai muốn yêu mến sự sống và thấy những ngày tốt đẹp, thì phải giữ lưỡi mình khỏi điều ác và môi mình khỏi lời gian dối[a].
  to: Vì ai muốn yêu mến sự sống và thấy những ngày tốt đẹp thì phải giữ lưỡi mình khỏi điều ác và môi mình khỏi nói lời gian dối[a].
  rationale: Sửa tối thiểu bằng cách thêm “nói” để phản ánh động từ nguyên mẫu λαλῆσαι và làm hoàn chỉnh, tự nhiên cấu trúc “giữ ... khỏi ...” trong tiếng Việt. Bỏ dấu phẩy trước “thì” để câu văn trôi chảy hơn; không thay đổi ý nghĩa hay mức độ khái quát của bản văn.
