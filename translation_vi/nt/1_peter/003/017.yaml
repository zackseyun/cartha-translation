id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: vi
  text: Vì nếu ý muốn của Đức Chúa Trời là như vậy[b], thì chịu khổ khi làm điều lành[a] tốt hơn chịu khổ khi làm điều ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “chịu khổ vì làm điều lành ... hơn là vì làm điều ác.” Các phân từ Hy Lạp có thể chỉ nguyên nhân (“vì”) hoặc chỉ hoàn cảnh nói chung (“khi”).
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp nói sát nghĩa: “nếu ý muốn của Đức Chúa Trời muốn như vậy,” một cách nói nhấn mạnh. Câu chính diễn đạt ý này theo lối tự nhiên trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: vẫn tốt hơn
  rationale: Diễn đạt tự nhiên cấu trúc so sánh vô nhân xưng “thì tốt hơn”; từ “vẫn” làm rõ sự tương phản nghịch lý giữa hai trường hợp chịu khổ mà không thêm một khẳng định thần học mới.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích hoặc nêu lý do với lời khuyên ở câu trước.
- source_word: ἀγαθοποιοῦντας
  choice: khi làm điều lành
  rationale: Phân từ hiện tại mô tả người chịu khổ trong lúc làm điều lành. “Khi” giữ được nghĩa hoàn cảnh mà không buộc phải hiểu là nguyên nhân; nghĩa “vì làm điều lành” vẫn có thể có.
- source_word: εἰ θέλοι
  choice: nếu ... là như vậy
  rationale: “Nếu” giữ tính điều kiện và tiềm khả của εἰ với thức mong ước; cách nói này tự nhiên trong tiếng Việt khi kết hợp với “ý muốn”.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: ý muốn của Đức Chúa Trời
  rationale: Phản ánh trực tiếp kết cấu sở hữu và giữ văn phong trang trọng, dễ hiểu.
- source_word: πάσχειν
  choice: chịu khổ
  rationale: Tương đương trực tiếp và tự nhiên của động từ nguyên mẫu, chỉ việc trải qua đau khổ.
- source_word: ἢ
  choice: hơn
  rationale: Liên từ so sánh đi với κρεῖττον; tiếng Việt diễn đạt tự nhiên bằng kết cấu “tốt hơn ...”.
- source_word: κακοποιοῦντας
  choice: khi làm điều ác
  rationale: Giữ cấu trúc song song với ἀγαθοποιοῦντας và không quyết định rằng việc làm ác nhất thiết là nguyên nhân trực tiếp của sự chịu khổ.
theological_decisions:
- issue: Mối liên hệ giữa sự chịu khổ và ý muốn của Đức Chúa Trời
  choice: Câu dịch nói rằng việc chịu khổ khi làm điều lành có thể xảy ra nếu ý muốn của Đức Chúa Trời là như vậy.
  alternative: Hiểu câu này như một tuyên bố rằng Đức Chúa Trời trực tiếp định trước mọi trường hợp chịu khổ, hoặc ngược lại, Ngài chỉ thụ động cho phép mà hoàn toàn không can dự.
  rationale: Cụm εἰ θέλοι τὸ θέλημα τοῦ θεοῦ quy chiếu có điều kiện đến ý muốn của Đức Chúa Trời nhưng không giải quyết cuộc tranh luận rộng hơn về sự định đoạt và sự cho phép. Bản dịch giữ nguyên sự căng thẳng thần học ấy.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc so sánh được làm rõ bằng cách lặp “chịu khổ” ở vế sau; sự lặp này là bổ sung cú pháp tự nhiên trong tiếng Việt, không thay đổi nội dung. Hai dấu chú thích [a], [b] đều xuất hiện đúng vị trí trong câu chính.
