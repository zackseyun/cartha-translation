translation:
  language: vi
  text: trong đó[a], Ngài cũng đã đi và công bố[b] cho các linh trong ngục[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Đấng ấy” hoặc “nhờ đó”. Cụm từ Hy Lạp có thể được hiểu theo nhiều cách về mối liên hệ với mệnh đề trước.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “rao giảng”. Động từ này chỉ việc truyền rao hoặc công bố, nhưng tại đây câu không nói rõ nội dung của sứ điệp.'
    reason: lexical_alternative
  - marker: c
    text: Danh tính của “các linh trong ngục” còn được tranh luận; các khả năng gồm những người đã chết hoặc các hữu thể thiên thần sa ngã.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: trong đó
  rationale: Giữ dạng quan hệ số ít giống trung và mối liên hệ với mệnh đề trước, đồng thời không buộc cụm từ phải mang nghĩa công cụ hay chỉ trực tiếp về một thân vị.
- source_word: καὶ
  choice: cũng
  rationale: Diễn đạt tự nhiên sắc thái bổ sung của καί, nối hành động này với điều vừa nói trước đó.
- source_word: τοῖς ... πνεύμασιν
  choice: cho các linh
  rationale: πνεύμασιν trực tiếp có nghĩa là “các linh”; cách dịch này không tự ý xác định họ là người đã chết hay các hữu thể thiên thần sa ngã.
- source_word: ἐν φυλακῇ
  choice: đang ở trong ngục
  rationale: φυλακή có thể chỉ nơi giam giữ hoặc tình trạng bị canh giữ; “trong ngục” là cách nói rõ ràng, tự nhiên mà vẫn giữ hình ảnh của nguyên văn.
- source_word: πορευθεὶς
  choice: đã đi
  rationale: Chuyển phân từ bất định quá khứ thành động từ hữu hạn để câu tiếng Việt tự nhiên, nhưng vẫn giữ ý chuyển động mà không nhấn mạnh quá mức trình tự thời gian.
- source_word: ἐκήρυξεν
  choice: công bố
  rationale: Động từ chỉ việc truyền rao hay tuyên bố như một sứ giả; “công bố” không mặc nhiên xác định nội dung là Tin Lành, sự phán xét hay chiến thắng.
theological_decisions:
- issue: Sở chỉ của ἐν ᾧ
  choice: Dịch trung tính là “trong đó”, có thể nối với phương diện hoặc trạng thái “trong thần linh” ở câu trước.
  alternative: “trong Đấng ấy/Người ấy”, chỉ trực tiếp về Đấng Christ; hoặc “nhờ đó”, hiểu theo nghĩa phương tiện.
  rationale: Cú pháp và ý nghĩa thần học của cụm từ này còn được tranh luận. Bản dịch giữ tính trung của đại từ Hy Lạp và không quyết định thay cho độc giả cách thức Đấng Christ thực hiện lời công bố.
- issue: Danh tính của “các linh đang ở trong ngục”
  choice: Không xác định thêm trong chính văn.
  alternative: Những người đã chết thuộc thế hệ Nô-ê; các hữu thể thiên thần sa ngã; hoặc một nhóm linh bị giam giữ rộng hơn.
  rationale: Cụm từ Hy Lạp không xác định đủ rõ để thu hẹp đối tượng trong bản dịch; những cách hiểu lâu đời khác nhau cần được giữ mở.
- issue: Bản chất của lời trong ἐκήρυξεν
  choice: Dùng “công bố”.
  alternative: “rao giảng”, có thể bị hiểu là rao giảng Tin Lành; “tuyên cáo”, có thể gợi mạnh nội dung xét xử hoặc chiến thắng.
  rationale: Động từ xác nhận hành vi truyền rao nhưng không nêu nội dung sứ điệp trong câu này, nên không nên đưa một nội dung thần học cụ thể vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để thể hiện chủ ngữ được ngầm hiểu từ văn cảnh là Đấng Christ; dùng “các linh” thay vì diễn giải thành “linh hồn” hay “các hữu thể thuộc linh” nhằm bảo toàn sự mơ hồ của nguyên văn.
