  source_fidelity: 'Bản dịch giữ đúng các yếu tố cốt lõi: ἐν ᾧ được để mở là “trong đó,” καί là “cũng,” πορευθείς là “đã đi,” và ἐκήρυξεν là “công bố.” Tuy nhiên, “đang ở trong ngục” thêm sắc thái tiến trình/trạng thái hiện tại do “đang” mà cụm ἐν φυλακῇ không biểu thị. “Trong ngục” chuyển đạt sát và vẫn tự nhiên hơn.'
