  terminology: “Ngài,” “công bố,” “các linh,” và “ngục” duy trì văn phong Kinh Thánh hiện đại và không áp đặt cách hiểu về nội dung lời công bố hay căn tính các linh. Các chú thích bảo toàn hợp lý những khả năng tranh luận của ἐν ᾧ, κηρύσσω, và πνεύματα.
