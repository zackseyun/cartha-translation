id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: vi
  text: Đừng lấy điều ác báo điều ác, hay lấy lời lăng mạ đáp lại lời lăng mạ[a]; nhưng trái lại[b], hãy chúc phước, vì anh chị em đã được kêu gọi đến điều này[c], để anh chị em được thừa hưởng phước lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lấy lời chửi rủa đáp lại lời chửi rủa.” Từ Hy Lạp này chỉ lời nói lăng mạ hoặc xúc phạm.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng thay vào đó.” Cụm từ Hy Lạp nhấn mạnh sự đảo ngược hoàn toàn: “trái lại.”'
    reason: lexical_alternative
  - marker: c
    text: Tức là được Đức Chúa Trời kêu gọi để đáp lại sự ngược đãi bằng lời chúc phước thay vì trả đũa. “Điều này” cũng có thể bao quát rộng hơn đời sống chịu khổ mà không trả đũa.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: lấy… báo / đáp lại
  rationale: Diễn đạt tự nhiên ý hoàn trả để đáp lại cách mình đã bị đối xử, đồng thời giữ cấu trúc song song của lời khuyên răn.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: lấy điều ác báo điều ác
  rationale: Giữ nguyên sức nặng đạo đức của κακόν và ý trả đũa của ἀντί; đây cũng là cách nói rõ ràng, trang trọng trong tiếng Việt.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: lấy lời lăng mạ đáp lại lời lăng mạ
  rationale: λοιδορία chỉ lời nói sỉ nhục hoặc xúc phạm. “Lăng mạ” truyền đạt sắc thái ngôn từ mạnh hơn “xúc phạm” và vẫn dễ hiểu.
- source_word: τοὐναντίον δὲ
  choice: nhưng trái lại
  rationale: Giữ sự đảo ngược mạnh mẽ giữa hành vi trả đũa và việc chúc phước.
- source_word: εὐλογοῦντες
  choice: hãy chúc phước
  rationale: Trong mạch khuyên bảo, phân từ mang lực mệnh lệnh. “Chúc phước” giữ được cả ý nói điều lành và cầu xin ân huệ của Đức Chúa Trời, mà không thêm một tân ngữ không có trong tiếng Hy Lạp.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu căn cứ cho lời khuyên; “vì” tự nhiên và giữ rõ quan hệ nguyên nhân.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: anh chị em đã được kêu gọi đến điều này
  rationale: Thể bị động được giữ nguyên, không đưa chủ thể hàm ẩn vào chính văn; “điều này” duy trì độ rộng tham chiếu của τοῦτο.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên sắc thái mục đích hoặc kết quả dự định mà không buộc phải phân xử giữa hai sắc thái.
- source_word: εὐλογίαν
  choice: phước lành
  rationale: Trong vế nhận lãnh, danh từ chỉ phước lành được hưởng; không thêm mạo từ vì tiếng Việt không đòi hỏi.
- source_word: κληρονομήσητε
  choice: được thừa hưởng
  rationale: Giữ sắc thái nhận phần dành cho người thừa kế, mạnh hơn cách dịch chung chung là “nhận được”.
theological_decisions:
- issue: Chủ thể hàm ẩn của ἐκλήθητε
  choice: Giữ thể bị động “đã được kêu gọi” trong chính văn; chú thích cho biết lời kêu gọi đến từ Đức Chúa Trời.
  alternative: Dịch minh nhiên “Đức Chúa Trời đã kêu gọi anh chị em”.
  rationale: Ngữ cảnh thần học cho thấy Đức Chúa Trời là Đấng kêu gọi, nhưng nguyên văn không nêu chủ thể trong câu này; giữ thể bị động tránh thêm vào chính văn.
- issue: Phạm vi quy chiếu của εἰς τοῦτο (“đến điều này”)
  choice: Giữ cách nói mở, trước hết hướng về việc chúc phước thay vì trả đũa.
  alternative: Hiểu rộng là toàn bộ đời sống chịu khổ và không trả đũa của người tin Chúa.
  rationale: Ngữ cảnh trực tiếp nghiêng về hành động chúc phước vừa nêu, nhưng đại từ τοῦτο có thể bao quát mẫu sống rộng hơn; bản dịch không thu hẹp sự căng thẳng này.
- issue: Quan hệ do ἵνα biểu thị
  choice: Dùng “để”, cho phép hiểu là mục đích hoặc kết quả dự định của sự kêu gọi.
  alternative: Diễn giải dứt khoát là “với mục đích chắc chắn rằng”.
  rationale: ἵνα với động từ giả định có lực hướng đích, nhưng câu không đòi bản dịch phải giải quyết toàn bộ quan hệ giữa sự kêu gọi, cách ứng xử và phước lành được thừa hưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ ngôi thứ hai số nhiều của ἐκλήθητε và κληρονομήσητε. Cấu trúc “lấy… báo/đáp lại…” tạo nhịp song song tự nhiên; “nhưng trái lại” giữ độ nhấn của τοὐναντίον δὲ.
