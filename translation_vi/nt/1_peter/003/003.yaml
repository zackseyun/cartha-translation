revisions:
- from: Sự trang sức của anh chị em đừng là vẻ bề ngoài—tết tóc[a], đeo đồ trang sức bằng vàng, hay mặc quần áo—
  to: Sự trang sức của chị em đừng là sự tô điểm bề ngoài—tết tóc[a], đeo đồ trang sức bằng vàng, hay mặc quần áo—
  rationale: Bản sửa quy chiếu đúng đến các phụ nữ/người vợ đang được ngỏ lời, làm câu tiếng Việt rõ và tự nhiên hơn, và loại bỏ ý “đẹp” không có trong nguyên ngữ. Câu chính vẫn giữ mệnh lệnh phủ định; cách hiểu nhấn mạnh tính so sánh/ưu tiên được đặt trong chú thích, không áp đặt vào nguyên văn.
