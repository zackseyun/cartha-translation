review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng ba hình thức trang sức bên ngoài được liệt kê trong tiếng Hy Lạp. Tuy nhiên, “anh chị em” không phù hợp với tiền ngữ cảnh trực tiếp là các người vợ/phụ nữ (2:18–3:6); ὧν ở đây quy chiếu đến họ. Chú thích cũng thêm “quần áo đẹp,” trong khi ἱματίων chỉ nói đến quần áo/y phục, không hàm ý “đẹp.”
  naturalness: Câu chính nhìn chung dễ hiểu, nhưng “Sự trang sức của anh chị em đừng là vẻ bề ngoài” hơi gượng và phạm vi của “vẻ bề ngoài” chưa rõ. “Sự trang sức của chị em đừng là sự tô điểm bề ngoài” giữ được cấu trúc phủ định của nguyên ngữ và tự nhiên hơn trong văn phong hiện đại.
  terminology: “Sự trang sức/tô điểm,” “tết tóc,” “đeo đồ trang sức bằng vàng,” và “mặc quần áo” chuyển tải thích đáng κόσμος, ἐμπλοκή, περίθεσις χρυσίων, và ἔνδυσις ἱματίων. Dùng “chị em” theo ngữ cảnh trực tiếp, không phải “anh chị em.”
  issues:
  - severity: medium
    issue: Đại từ xưng hô “anh chị em” mở rộng sai đối tượng trực tiếp.
    rationale: Đại từ ὧν số nhiều sở hữu quy chiếu đến các người vợ/phụ nữ ở câu trước. Cách dịch bao quát cả nam giới làm mờ đối tượng mà bản văn trực tiếp nói đến.
  - severity: medium
    issue: Chú thích thêm ý “quần áo đẹp.”
    rationale: Nguyên ngữ chỉ có “mặc quần áo/y phục”; không có từ nào tương đương “đẹp” hay “sang trọng.” Cần bỏ phần thêm nghĩa này.
  - severity: low
    issue: Cách diễn đạt “là vẻ bề ngoài” thiếu danh từ chỉ loại trang sức/tô điểm.
    rationale: Thêm “sự tô điểm” sau “vẻ bề ngoài” làm rõ rằng ba mục sau là những biểu hiện của sự tô điểm bề ngoài, không thay đổi ý nghĩa.
  revised_text: Sự trang sức của chị em đừng là sự tô điểm bề ngoài—tết tóc[a], đeo đồ trang sức bằng vàng, hay mặc quần áo—
