  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: vi
  text: Sự trang sức của chị em đừng là sự tô điểm bề ngoài—tết tóc[a], đeo đồ trang sức bằng vàng, hay mặc quần áo—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Sự trang sức của chị em không nên chỉ là sự tô điểm bề ngoài: tóc tết, đồ trang sức bằng vàng, hay quần áo.” Theo văn cảnh, trọng tâm là ưu tiên phẩm chất bên trong hơn sự phô bày bên ngoài, chứ không nhất thiết là lệnh cấm tuyệt đối việc chải chuốt hay ăn mặc.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: của anh chị em
  rationale: Đại từ quan hệ sở hữu số nhiều chỉ về những người vợ/phụ nữ được nói đến ở câu trước. Cách diễn đạt này chuyển tự nhiên sang tiếng Việt mà không thu hẹp số lượng.
- source_word: ἔστω οὐχ
  choice: đừng là
  rationale: Giữ lực khuyên bảo của mệnh lệnh ngôi thứ ba cùng sự phủ định, đồng thời tự nhiên trong tiếng Việt.
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: sự trang sức ... vẻ bề ngoài
  rationale: κόσμος ở đây mang nghĩa trang sức hoặc sự tô điểm, không phải thế gian; ἔξωθεν nhấn mạnh phương diện bên ngoài, chuẩn bị cho sự tương phản với con người bên trong ở câu 4.
- source_word: ἐμπλοκῆς τριχῶν
  choice: tết tóc
  rationale: Diễn đạt gọn, tự nhiên hành động đan hoặc tết tóc được nêu như một hình thức trang sức bên ngoài.
- source_word: περιθέσεως χρυσίων
  choice: đeo đồ trang sức bằng vàng
  rationale: περίθεσις chỉ việc đặt hoặc đeo quanh người, còn χρυσίων chỉ các vật bằng vàng, trong ngữ cảnh này là đồ trang sức.
- source_word: ἢ
  choice: hay
  rationale: Liên từ phân cách đơn giản trong một chuỗi liệt kê.
- source_word: ἐνδύσεως ἱματίων
  choice: mặc quần áo
  rationale: Phản ánh hành động mặc y phục bằng lối nói hiện đại, thông dụng; giữ cấu trúc liệt kê song song.
theological_decisions:
- issue: Phi-e-rơ có tuyệt đối cấm việc chăm chút vẻ ngoài, đeo vàng và mặc quần áo hay đặt chúng dưới ưu tiên của phẩm chất bên trong
  choice: Giữ nguyên câu phủ định và thêm chú thích nêu khả năng hiểu theo nghĩa so sánh, nhấn mạnh ưu tiên
  alternative: Hiểu như lệnh cấm tuyệt đối mọi kiểu tết tóc, đồ vàng và quần áo
  rationale: Cú pháp Hy Lạp dùng mệnh lệnh phủ định, nhưng câu 4 lập sự tương phản với con người ẩn giấu trong lòng; hơn nữa, cách hiểu tuyệt đối sẽ bao gồm cả việc mặc quần áo. Bản dịch không âm thầm làm yếu câu phủ định, còn chú thích bảo tồn khả năng so sánh theo văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chuyển đại từ sở hữu số nhiều theo lối bao quát, dù đối tượng trực tiếp trong văn cảnh là các bà vợ/phụ nữ. Dấu gạch ngang cuối câu được giữ vì ý và cú pháp tiếp tục sang câu 4.
