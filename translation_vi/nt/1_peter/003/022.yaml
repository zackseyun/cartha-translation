language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: vi
  text: Đấng ấy ở bên phải Đức Chúa Trời, sau khi đã lên trời[a]; các thiên sứ, các bậc cầm quyền và các quyền năng đều đã được đặt dưới quyền Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát chữ: “đã đi vào trời.” Tiếng Hy Lạp dùng giới từ chỉ hướng “vào,” trong khi “lên trời” là cách nói tự nhiên hơn trong tiếng Việt.'
    reason: Bảo lưu sắc thái hướng chuyển động của εἰς mà không thay thế cách diễn đạt tiếng Việt tự nhiên trong bản văn chính.
lexical_decisions:
- source_word: ὅς
  choice: Đấng ấy
  rationale: Chỉ về Chúa Giê-su ở câu trước và giữ sự liên kết của đại từ quan hệ Hy Lạp, đồng thời giúp câu tiếng Việt đứng tự nhiên.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: ở bên phải Đức Chúa Trời
  rationale: Giữ nguyên hình ảnh Kinh Thánh về địa vị bên phải Đức Chúa Trời mà không diễn giải thành một ý niệm trừu tượng về danh dự.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: sau khi đã lên trời[a]
  rationale: Diễn đạt tự nhiên trong tiếng Việt và thể hiện hành động xảy ra trước tình trạng hiện nay; chú thích bảo lưu sắc thái chuyển động 'vào' của εἰς.
- source_word: ἀγγέλων
  choice: các thiên sứ
  rationale: Trong ngữ cảnh các thực thể và quyền lực trên trời, từ này chỉ các thiên sứ chứ không phải sứ giả loài người.
- source_word: ἐξουσιῶν
  choice: các bậc cầm quyền
  rationale: Phân biệt ἐξουσίαι với δυνάμεις kế tiếp và giữ khả năng từ này chỉ một hạng quyền lực trong trật tự thuộc linh hoặc vũ trụ.
- source_word: δυνάμεων
  choice: các quyền năng
  rationale: Cách dịch quen thuộc, súc tích, đồng thời giữ được ba nhóm riêng trong danh sách.
- source_word: ὑποταγέντων αὐτῷ
  choice: đều đã được đặt dưới quyền Ngài
  rationale: Giữ thể bị động và ý nghĩa sự quy phục đã được thực hiện; 'dưới quyền Ngài' diễn đạt tự nhiên quan hệ lệ thuộc mà động từ và đại từ tặng cách biểu thị.
theological_decisions:
- issue: Sự tôn cao của Đấng Christ bên phải Đức Chúa Trời
  choice: Giữ nguyên thành ngữ không gian–quan hệ 'ở bên phải Đức Chúa Trời'.
  alternative: Diễn giải là 'ở địa vị cao quý nhất bên cạnh Đức Chúa Trời'.
  rationale: Nguyên ngữ bảo lưu hình ảnh Kinh Thánh giàu ý nghĩa thần học; diễn giải hoàn toàn theo nghĩa danh dự sẽ thu hẹp nội dung của câu.
- issue: Căn tính và tính chất đạo đức của 'các thiên sứ, các bậc cầm quyền và các quyền năng'
  choice: Giữ ba nhóm rộng nghĩa mà không xác định họ là thiện, ác hay hỗn hợp.
  alternative: Xác định đây chỉ là các thiên sứ thánh hoặc chỉ là các thế lực thù nghịch.
  rationale: Bản văn Hy Lạp không phân loại các nhóm này về mặt đạo đức, nên bản dịch không áp đặt một hệ thống giải thích hẹp hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'bên phải' thay cho từ cổ 'bên hữu'; dùng 'Ngài' để chỉ Đấng Christ theo văn phong Kinh Thánh phổ thông. Dấu chấm phẩy làm rõ hai vế mà vẫn giữ chúng trong cùng một câu.
