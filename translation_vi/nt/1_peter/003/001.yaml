language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: vi
  text: Cũng vậy, những người làm vợ, hãy thuận phục chồng mình, để dù có người không vâng theo lời[a], họ sẽ được cảm hóa nhờ nếp sống của vợ mình, không cần lời nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không tin sứ điệp” hoặc “không vâng theo sứ điệp”; tức là họ khước từ sứ điệp Tin Mừng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοίως
  choice: Cũng vậy
  rationale: Giữ chức năng liên kết lời khuyên này với những chỉ dẫn ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: γυναῖκες
  choice: những người làm vợ
  rationale: Cụm τοῖς ἰδίοις ἀνδράσιν xác định nghĩa quan hệ hôn nhân, không phải nghĩa chung là ‘phụ nữ’.
- source_word: ὑποτασσόμεναι
  choice: hãy thuận phục
  rationale: Chuyển phân từ thành lời khuyên trực tiếp cho tự nhiên trong tiếng Việt; ‘thuận phục’ diễn đạt trật tự quan hệ mà không thêm ý tuyệt đối vâng lời hay thấp kém.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: chồng mình
  rationale: Ngữ cảnh gia đình đòi hỏi nghĩa ‘chồng’; ‘mình’ giữ sắc thái chỉ người phối ngẫu của chính họ.
- source_word: ἵνα καὶ εἴ τινες
  choice: để ngay cả khi có người
  rationale: Giữ cả sắc thái mục đích của ἵνα và sắc thái nhượng bộ của καὶ εἴ.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: không vâng theo lời
  rationale: Giữ sự đan xen giữa không tin và không vâng phục trong ἀπειθέω, cũng như cách gọi sứ điệp Tin Mừng là ‘lời’.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: nhờ cách ăn ở của vợ mình
  rationale: ἀναστροφή chỉ cách sống hay hạnh kiểm; ‘cách ăn ở’ là lối diễn đạt tự nhiên, trang trọng vừa phải và bao quát trong tiếng Việt.
- source_word: ἄνευ λόγου
  choice: mà không cần một lời nói nào
  rationale: Phân biệt tự nhiên trong tiếng Việt giữa ‘lời’ là sứ điệp ở vế trước và lời nói của người vợ ở đây, đồng thời giữ sự chơi chữ của nguyên văn ở mức có thể.
- source_word: κερδηθήσονται
  choice: họ cũng có thể được thu phục
  rationale: ‘Thu phục’ giữ hình ảnh ‘giành được’ của κερδαίνω trong bối cảnh đưa một người đến với đức tin; ‘có thể’ phù hợp với sắc thái mục đích kỳ vọng của câu.
theological_decisions:
- issue: Tính chất của ὑποτασσόμεναι trong lời dạy về gia đình
  choice: Dịch là ‘hãy thuận phục’ mà không thêm ý phải tuyệt đối vâng lời hoặc kém giá trị.
  alternative: ‘hãy vâng phục’ hoặc ‘hãy phục tùng’
  rationale: Động từ nói đến việc đặt mình trong một trật tự quan hệ nhưng câu không dùng động từ mạnh hơn mang nghĩa ‘vâng lời’, cũng không khẳng định sự thấp kém về bản thể.
- issue: Ý nghĩa của ἀπειθοῦσιν τῷ λόγῳ
  choice: Dịch là ‘không vâng theo lời’ và ghi chú sắc thái không tin hoặc khước từ sứ điệp Tin Mừng.
  alternative: ‘không tin lời’ hoặc ‘không vâng theo sứ điệp’
  rationale: Động từ Hy Lạp có thể bao hàm cả không tin lẫn không vâng phục; bản dịch chính giữ nguyên sự căng thẳng ngữ nghĩa thay vì thu hẹp vào một phía.
- issue: Ý nghĩa của việc ‘được thu phục mà không cần một lời nói nào’
  choice: Hiểu là không cần lời nói từ người vợ trong tình huống được mô tả, chứ không phủ nhận vai trò của sứ điệp Tin Mừng.
  alternative: Hiểu tuyệt đối rằng người chồng được đưa đến đức tin mà không cần nghe sứ điệp
  rationale: Sự đối chiếu giữa τῷ λόγῳ và ἄνευ λόγου cùng câu nói về cách ăn ở của người vợ cho thấy trọng tâm là ảnh hưởng của đời sống không cần tranh luận bằng lời; không nên thêm một kết luận thần học rộng hơn câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Hỡi những người làm vợ’ làm rõ đối tượng trực tiếp; ‘cách ăn ở’ diễn đạt toàn bộ nếp sống chứ không chỉ một hành vi riêng lẻ. Dấu [a] được đặt ngay tại cụm từ mà chú thích giải thích.
