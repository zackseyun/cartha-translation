id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: vi
  text: Nhưng dẫu anh em có chịu khổ vì sự công chính, anh em vẫn có phước. Đừng sợ nỗi sợ của họ[a], cũng đừng bất an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng sợ họ” hoặc “đừng sợ điều họ sợ.” Cụm từ Hy Lạp “nỗi sợ của họ” vọng lại Ê-sai 8:12 và có thể được hiểu theo nhiều cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Nhưng dẫu anh em có chịu khổ
  rationale: “Dẫu… có” diễn đạt tự nhiên điều kiện nhượng bộ và khả năng có thật của thức mong muốn trong tiếng Hy Lạp, đồng thời giữ quan hệ tương phản với câu trước.
- source_word: διὰ δικαιοσύνην
  choice: vì sự công chính
  rationale: διά với đối cách chỉ nguyên nhân. “Sự công chính” giữ thuật ngữ thần học–đạo đức δικαιοσύνη mà không thu hẹp thành riêng công lý xã hội hay diễn giải thành hành vi cụ thể.
- source_word: μακάριοι
  choice: anh em vẫn có phước
  rationale: Tính từ vị ngữ hướng đến các độc giả; thêm “anh em” và “vẫn” giúp câu tiếng Việt rõ, tự nhiên trong kết cấu nhượng bộ. “Có phước” giữ âm hưởng Kinh Thánh và không biến ý thành cảm xúc vui vẻ chủ quan.
- source_word: τὸν ... φόβον αὐτῶν
  choice: nỗi sợ của họ
  rationale: 'Cách dịch sát này giữ tiếng vọng của Ê-sai 8:12 theo Bản Bảy Mươi và duy trì phần nào sự mơ hồ: có thể là nỗi sợ do họ gây ra hoặc điều chính họ sợ. Các cách hiểu được ghi ở chú thích.'
- source_word: μὴ φοβηθῆτε
  choice: Đừng sợ
  rationale: Giữ trực tiếp mệnh lệnh cấm và sự lặp từ giữa φόβον với φοβηθῆτε qua “sợ… sợ”.
- source_word: μηδὲ ταραχθῆτε
  choice: cũng đừng bất an
  rationale: Diễn đạt trạng thái bị khuấy động, lo sợ trong lòng theo ταράσσω bằng tiếng Việt hiện đại, tự nhiên, không thêm ý rằng họ chắc chắn sẽ bị đánh bại hay lung lay đức tin.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: Trong tiếng Việt, chuyển thẳng sang mệnh lệnh “Đừng…” nối ý tự nhiên hơn; sắc thái chuyển tiếp nhẹ của δέ vẫn được thể hiện qua việc bắt đầu câu mới.
theological_decisions:
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: lẽ phải; việc làm điều đúng
  rationale: Trong ngữ cảnh này, từ chỉ đời sống ngay thẳng trước mặt Đức Chúa Trời và người khác. “Sự công chính” bảo tồn chiều kích đạo đức–thần học mà không giới hạn nghĩa vào công bằng xã hội hoặc chỉ một số hành vi.
- issue: Sự mơ hồ của τὸν φόβον αὐτῶν
  choice: nỗi sợ của họ
  alternative: sợ họ; điều họ sợ
  rationale: Cụm sở hữu Hy Lạp có thể chỉ nỗi sợ họ gây ra hoặc điều họ sợ. Bản chính giữ cấu trúc sở hữu để không âm thầm quyết định một cách hiểu; chú thích cung cấp hai khả năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ số nhiều “anh em” phù hợp lời trực tiếp gửi cộng đồng tín hữu. Cụm “nỗi sợ của họ” hơi khác khẩu ngữ nhưng được chủ ý giữ lại để bảo tồn tiếng vọng Kinh Thánh và sự mơ hồ của nguyên bản; chú thích hỗ trợ người đọc.
