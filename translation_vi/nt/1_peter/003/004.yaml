reference: 1 Peter 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: vi
  text: nhưng là con người ẩn giấu trong lòng[a], trong vẻ đẹp không hư nát[b] của một tinh thần dịu dàng và điềm tĩnh[c]; điều ấy rất quý giá trước mặt Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát hơn là “con người ẩn giấu của tấm lòng”. Từ Hy Lạp ἄνθρωπος có thể chỉ một người nói chung; tại đây, cụm từ nói về con người nội tâm.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn sát nghĩa là “trong điều không hư nát của một tinh thần dịu dàng và điềm tĩnh”. Từ “vẻ đẹp” được bổ sung theo sự tương phản với việc trang sức bên ngoài trong câu trước.
    reason: lexical_alternative
  - marker: c
    text: “Điềm tĩnh” chỉ một tâm thế bình hòa, không gây xáo động, chứ không nhất thiết là im lặng.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: con người ẩn giấu trong lòng
  rationale: ἄνθρωπος ở đây chỉ con người bên trong, không nhấn mạnh giới tính nam. Cách dịch này giữ ý ‘ẩn giấu’ của κρυπτός và diễn đạt tự nhiên trong tiếng Việt hơn lối dịch sát chữ ‘con người ẩn giấu của tấm lòng’.
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: với vẻ đẹp không hư nát
  rationale: Cụm Hy Lạp tỉnh lược danh từ. ‘Vẻ đẹp’ được bổ sung theo sự đối lập với việc trang sức bên ngoài ở câu trước; ‘không hư nát’ giữ nghĩa cốt lõi của ἄφθαρτος.
- source_word: πραέως
  choice: dịu dàng
  rationale: Diễn đạt tự nhiên đức tính πραΰς trong tiếng Việt hiện đại, không gợi sự yếu đuối hay thụ động.
- source_word: ἡσυχίου
  choice: an tĩnh
  rationale: Chỉ trạng thái điềm tĩnh, bình hòa, không gây xáo động; không nhất thiết có nghĩa là không nói.
- source_word: πνεύματος
  choice: tinh thần
  rationale: Giữ được ngôn ngữ về nội tâm của πνεῦμα, đồng thời trong ngữ cảnh này có thể được hiểu tự nhiên là tinh thần hay khí chất bên trong.
- source_word: ὅ ἐστιν
  choice: điều ấy
  rationale: Đại từ quan hệ giống trung trong tiếng Hy Lạp quy chiếu tự nhiên đến toàn bộ phẩm chất vừa nêu; ‘điều ấy’ giữ phạm vi quy chiếu này trong tiếng Việt.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Cách diễn đạt trang trọng, tự nhiên, thể hiện sự đánh giá của Đức Chúa Trời.
- source_word: πολυτελές
  choice: rất quý giá
  rationale: πολυτελής chỉ giá trị rất lớn hoặc sự quý báu; cách dịch này phù hợp với sự tương phản cùng đồ trang sức đắt giá ở văn cảnh gần.
theological_decisions:
- issue: Cách hiểu biểu thức nhân học trong ngữ cảnh nói với phụ nữ
  choice: Dịch ἄνθρωπος là ‘con người’ trong cụm ‘con người ẩn giấu trong lòng’.
  alternative: ‘người đàn ông ẩn giấu trong lòng’ hoặc ‘con người bên trong’
  rationale: Từ này ở đây chỉ bản ngã nội tâm chứ không xác định giới tính nam. ‘Con người’ tránh đưa vào một đối tượng nam giới không có trong ý của câu, còn ‘ẩn giấu’ bảo toàn hình ảnh của nguyên văn.
- issue: Bổ sung danh từ bị tỉnh lược sau ἀφθάρτῳ
  choice: 'Bổ sung ‘vẻ đẹp’: ‘với vẻ đẹp không hư nát’.'
  alternative: ‘với phẩm chất không hư nát’ hoặc ‘trong điều không hư nát’
  rationale: Nguyên văn Hy Lạp cô đọng và không nêu danh từ. Văn cảnh câu 3 đối lập việc tô điểm bên ngoài với phẩm chất bên trong, nên ‘vẻ đẹp’ làm rõ mối tương phản mà không quyết đoán quá mức; chú thích vẫn ghi rõ đây là từ được bổ sung.
- issue: Phạm vi quy chiếu của ὅ
  choice: Dùng ‘điều ấy’ để chỉ toàn bộ vẻ đẹp của một tinh thần dịu dàng và an tĩnh.
  alternative: Hiểu đại từ chỉ riêng ‘tinh thần’.
  rationale: Hình thức giống trung của ὅ có thể quy chiếu đến toàn bộ ý niệm vừa nêu, thay vì chỉ danh từ πνεῦμα. Tiếng Việt ‘điều ấy’ giữ được độ rộng của quy chiếu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hình ảnh ‘con người ẩn giấu’ và thuật ngữ ‘tinh thần’, đồng thời dùng ‘an tĩnh’ để tránh khiến người đọc hiểu câu này như một mệnh lệnh phải im tiếng. Dấu chấm phẩy giúp nối mệnh đề đánh giá cuối câu với toàn bộ phẩm chất nội tâm vừa nêu.
