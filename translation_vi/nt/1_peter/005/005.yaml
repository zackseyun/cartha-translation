id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: vi
  text: Cũng vậy, những người nam trẻ tuổi[a], hãy thuận phục các trưởng lão. Tất cả anh chị em hãy khoác lấy lòng khiêm nhường đối với nhau[b], vì “Đức Chúa Trời chống lại kẻ kiêu ngạo, nhưng ban ân huệ cho người khiêm nhường.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người trẻ tuổi.” Tiếng Hy Lạp dùng hình thức số nhiều giống đực, dù một số người hiểu từ này theo nghĩa rộng hơn, chỉ những thành viên trẻ tuổi trong hội chúng.'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp gợi hình ảnh mặc hoặc buộc chặt một trang phục; cũng có thể dịch sát hình ảnh hơn là “hãy buộc lấy lòng khiêm nhường.”
    reason: lexical_alternative
  - marker: c
    text: Trích dẫn hoặc gợi nhắc Châm Ngôn 3:34 theo bản Hy Lạp Bảy Mươi.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Dấu nối diễn ngôn liên kết lời khuyên này với phần chỉ dạy ngay trước đó; cách diễn đạt ngắn gọn và tự nhiên.
- source_word: νεώτεροι
  choice: những người nam trẻ tuổi
  rationale: Hình thức hô cách số nhiều giống đực được giữ rõ, đồng thời tránh đồng nhất từ này với chức vụ hay một nhóm tuổi được xác định quá cứng nhắc.
- source_word: ὑποτάγητε
  choice: hãy thuận phục
  rationale: Truyền đạt mệnh lệnh tự đặt mình dưới thẩm quyền hoặc sự hướng dẫn của người khác, bằng lối nói trang trọng nhưng vẫn hiện đại.
- source_word: πρεσβυτέροις
  choice: các trưởng lão
  rationale: Ngữ cảnh trực tiếp 5:1–4 nói về các trưởng lão trong hội chúng, nên nghĩa chỉ nhóm lãnh đạo này có khả năng cao hơn nghĩa đơn thuần là người lớn tuổi.
- source_word: πάντες
  choice: Tất cả anh chị em
  rationale: Mở rộng lời khuyên sang toàn thể cộng đồng; đại từ xưng hô này tự nhiên trong tiếng Việt và không thu hẹp đối tượng theo giới.
- source_word: ἀλλήλοις
  choice: đối với nhau
  rationale: Diễn tả chiều hướng tương hỗ trong các mối quan hệ cộng đồng.
- source_word: ταπεινοφροσύνην
  choice: lòng khiêm nhường
  rationale: Cách tương đương tự nhiên, rõ nghĩa cho thái độ khiêm hạ trong tâm trí và cách cư xử.
- source_word: ἐγκομβώσασθε
  choice: hãy khoác lấy
  rationale: Giữ hình ảnh chủ ý mặc hoặc buộc một trang phục, nhưng diễn đạt trôi chảy trong tiếng Việt.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu cơ sở Kinh Thánh cho lời khuyên.
- source_word: ὑπερηφάνοις
  choice: kẻ kiêu ngạo
  rationale: Tính từ được dùng như danh từ; cách dịch cô đọng và mạnh, không thêm sắc thái ngoài văn bản.
- source_word: ἀντιτάσσεται
  choice: chống lại
  rationale: Phản ánh nghĩa tự đặt mình đối nghịch với ai đó, mạnh và rõ hơn cách nói nhẹ như 'không ưa'.
- source_word: χάριν
  choice: ân huệ
  rationale: Giữ phạm vi nghĩa là sự ưu ái hay ơn được ban, phù hợp với lời trích Châm Ngôn mà không áp đặt một hệ thống thần học riêng.
theological_decisions:
- issue: Đối tượng của πρεσβυτέροις
  choice: các trưởng lão trong hội chúng
  alternative: những người lớn tuổi nói chung
  rationale: Mạch văn ngay trước đó (5:1–4) trực tiếp nói với các trưởng lão và mô tả nhiệm vụ chăn dắt của họ; tuy vậy, nghĩa tuổi tác vốn có của từ vẫn khiến cách hiểu kia có thể được cân nhắc.
- issue: Giới tính trong νεώτεροι
  choice: những người nam trẻ tuổi
  alternative: những người trẻ tuổi
  rationale: Bản Hy Lạp dùng hình thức số nhiều giống đực. Bản dịch giữ đặc điểm này trong câu đầu, còn πάντες sau đó rõ ràng mở rộng mệnh lệnh về sự khiêm nhường đến toàn thể cộng đồng.
- issue: Sắc thái của χάρις
  choice: ân huệ
  alternative: ân điển
  rationale: Trong lời trích Châm Ngôn 3:34 bản Bảy Mươi, từ này có thể chỉ sự ưu ái hoặc ơn ban của Đức Chúa Trời. 'Ân huệ' giữ nghĩa rộng hơn và tránh tự động chuyên biệt hóa thành thuật ngữ tín lý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành quen thuộc; giữ hình ảnh trang phục trong ἐγκομβώσασθε và phân biệt lời dành cho nam giới trẻ tuổi với lời dành cho toàn thể cộng đồng.
