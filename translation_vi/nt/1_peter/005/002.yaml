revisions:
- from: Hãy chăn dắt bầy chiên của Đức Chúa Trời ở giữa anh em, trông nom họ không phải vì bị ép buộc nhưng cách tự nguyện, theo Đức Chúa Trời[a]; cũng không vì trục lợi bất chính nhưng cách sốt sắng.
  to: Hãy chăn dắt bầy chiên của Đức Chúa Trời ở giữa anh em, trông nom bầy chiên ấy không phải vì bị ép buộc, nhưng tự nguyện theo ý Đức Chúa Trời[a]; cũng không vì lợi lộc đáng hổ thẹn, nhưng với lòng sốt sắng.
  rationale: Bản sửa làm cho tiếng Việt tự nhiên hơn, đồng thời sửa hai chỗ có nguy cơ thu hẹp hoặc làm mờ nghĩa nguồn. “Theo ý Đức Chúa Trời” diễn đạt được chức năng của κατὰ θεόν trong câu; chú thích ghi nhận cả cách dịch sát chữ lẫn cách hiểu thay thế. “Lợi lộc đáng hổ thẹn” giữ tính khinh miệt đạo đức của αἰσχροκερδῶς mà không thêm ý bất hợp pháp.
  reviewer_model: gpt-5.6-terra
