id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: vi
  text: Hãy chăn dắt bầy chiên của Đức Chúa Trời ở giữa anh em, trông nom bầy chiên ấy không phải vì bị ép buộc, nhưng tự nguyện theo ý Đức Chúa Trời[a]; cũng không vì lợi lộc đáng hổ thẹn, nhưng với lòng sốt sắng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “như Đức Chúa Trời muốn”; nghĩa đen: “theo Đức Chúa Trời.”'
    reason: Cụm κατὰ θεόν có cách diễn đạt cô đọng; trong ngữ cảnh, cụm này có thể chỉ điều phù hợp với ý muốn, chuẩn mực, hoặc cách thức của Đức Chúa Trời.
lexical_decisions:
- source_word: ποιμάνατε
  choice: Hãy chăn dắt
  rationale: Giữ nguyên hình ảnh người chăn và bầy chiên trong động từ mệnh lệnh, đồng thời tránh biến động từ này thành một chức danh giáo hội.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: bầy chiên của Đức Chúa Trời ở giữa anh em
  rationale: “Bầy chiên” giữ hình ảnh ποιμνίον; “của Đức Chúa Trời” nhấn mạnh quyền sở hữu thuộc về Ngài, còn “ở giữa anh em” giữ sắc thái địa phương/quan hệ của ἐν ὑμῖν thay vì nói bầy chiên thuộc sở hữu của các trưởng lão.
- source_word: ἐπισκοποῦντες
  choice: trông nom họ
  rationale: Diễn tả hoạt động chăm sóc và giám sát bằng ngôn ngữ tự nhiên, không biến phân từ thành một chức danh kỹ thuật như “giám mục”.
- source_word: μὴ ἀναγκαστῶς
  choice: không phải vì bị ép buộc
  rationale: Thể hiện việc hành động do áp lực hay cưỡng ép, giữ rõ sự tương phản với tinh thần tự nguyện.
- source_word: ἀλλὰ ἑκουσίως
  choice: nhưng cách tự nguyện
  rationale: Diễn đạt trực tiếp ý tự mình sẵn lòng làm, đối lập với việc bị ép buộc.
- source_word: κατὰ θεόν
  choice: theo Đức Chúa Trời
  rationale: Giữ cách nói cô đọng và phần nào mở nghĩa của nguyên văn, không tự động giới hạn nó vào riêng “ý muốn” hay “tiêu chuẩn” của Đức Chúa Trời; chú thích cung cấp cách hiểu tự nhiên hơn.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: cũng không vì trục lợi bất chính
  rationale: Truyền đạt động cơ tìm kiếm lợi lộc thấp hèn hoặc đáng hổ thẹn bằng cách nói hiện đại, rõ nghĩa.
- source_word: ἀλλὰ προθύμως
  choice: nhưng cách sốt sắng
  rationale: “Sốt sắng” thể hiện sự sẵn sàng và nhiệt thành, đồng thời phân biệt với ἑκουσίως đã được dịch là “tự nguyện”.
theological_decisions:
- issue: Có nên dịch ἐπισκοποῦντες bằng một chức danh giáo hội mang tính kỹ thuật hay không
  choice: Dịch theo chức năng là “trông nom họ”.
  alternative: phục vụ như những giám mục; thực hiện chức vụ giám sát
  rationale: Trong câu này, phân từ mô tả việc các trưởng lão phải làm khi chăn dắt bầy chiên, chứ không nhất thiết ấn định một chức danh theo cơ cấu giáo hội về sau. Cách dịch theo chức năng tránh đưa quan điểm hệ phái vào bản văn.
- issue: Mức độ diễn giải κατὰ θεόν
  choice: Giữ cách nói “theo Đức Chúa Trời” trong chính văn và giải thích các khả năng trong chú thích.
  alternative: theo ý muốn của Đức Chúa Trời; như Đức Chúa Trời muốn
  rationale: Cụm từ Hy Lạp ngắn gọn và có thể chỉ ý muốn, chuẩn mực hoặc cách thức phù hợp với Đức Chúa Trời. Không nên âm thầm thu hẹp nó thành một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để xưng hô với nhóm các trưởng lão trong ngữ cảnh; dùng “Đức Chúa Trời” theo lối gọi Tin Lành phổ biến nhưng không đưa thêm thuật ngữ cơ cấu giáo hội. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
