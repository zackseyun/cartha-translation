review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mệnh lệnh ποιμάνατε, hình ảnh “bầy chiên,” quyền sở hữu của Đức Chúa Trời, và không biến ἐπισκοποῦντες thành chức danh. Tuy nhiên, “theo Đức Chúa Trời” không phải cách diễn đạt tự nhiên hay rõ nghĩa trong tiếng Việt hiện đại; nó dễ bị hiểu là “theo/đi theo Đức Chúa Trời,” thay vì bổ nghĩa cho sự tự nguyện theo chuẩn mực hay ý muốn của Ngài. “Trục lợi bất chính” cũng thu hẹp αἰσχροκερδῶς vào tính không hợp pháp/không trung thực, trong khi từ Hy Lạp nhấn mạnh lợi lộc thấp hèn, đáng hổ thẹn.
  naturalness: Cần bỏ cách dùng trạng ngữ “nhưng cách tự nguyện/cách sốt sắng,” vốn kém tự nhiên trong văn xuôi Việt hiện đại. “Tự nguyện” và “với lòng sốt sắng” mạch lạc hơn. Lặp lại “bầy chiên ấy” sau “trông nom” làm rõ đối tượng của phân từ mà không đổi nghĩa.
  terminology: “Chăn dắt,” “bầy chiên,” “trông nom,” và “Đức Chúa Trời” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Lợi lộc đáng hổ thẹn” bảo toàn sắc thái đạo đức của αἰσχροκερδῶς tốt hơn “trục lợi bất chính.”
  issues:
  - severity: medium
    issue: “theo Đức Chúa Trời” không tự nhiên và dễ lệch nghĩa.
    rationale: Cụm κατὰ θεόν cô đọng, nhưng tiếng Việt “theo Đức Chúa Trời” thường gợi ý đi theo Đức Chúa Trời, không diễn đạt rõ cách hành động phù hợp với ý muốn/chuẩn mực của Ngài. “theo ý Đức Chúa Trời” là cách hiểu tự nhiên; chú thích vẫn cần nêu các khả năng diễn đạt khác để không làm như thể nguyên văn không có độ cô đọng.
  - severity: medium
    issue: “trục lợi bất chính” thu hẹp nghĩa của αἰσχροκερδῶς.
    rationale: Từ này chỉ việc tìm lợi lộc một cách đê tiện, thấp hèn hoặc đáng hổ thẹn, không nhất thiết là lợi lộc bất hợp pháp hay gian dối. “Vì lợi lộc đáng hổ thẹn” giữ phạm vi nghĩa tốt hơn.
  - severity: low
    issue: “nhưng cách tự nguyện ... nhưng cách sốt sắng” chưa tự nhiên.
    rationale: Tiếng Việt hiện đại ưu tiên “nhưng tự nguyện” và “nhưng với lòng sốt sắng”; các cách này vẫn phân biệt rõ ἑκουσίως với προθύμως.
