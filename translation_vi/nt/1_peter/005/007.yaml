  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: vi
  text: Hãy trao mọi nỗi lo lắng của anh chị em cho Ngài,[a][b] vì Ngài quan tâm đến anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ném/quẳng mọi nỗi lo lắng của anh chị em lên Ngài”; phân từ cũng có thể dịch là “sau khi đã trao” hoặc “bằng cách trao.”'
    reason: lexical_alternative
  - marker: b
    text: “Ngài” chỉ Đức Chúa Trời trong văn cảnh gần nhất (câu 6).
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: mọi điều lo lắng của anh chị em
  rationale: Diễn đạt tự nhiên tổng thể số ít trong tiếng Hy Lạp, đồng thời giữ sức bao quát của πᾶσαν và sắc thái lo âu của μέριμνα.
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: Hãy trao ... cho Ngài
  rationale: Phân từ bất định liên kết với lời khuyên ở câu 6 và mang lực mệnh lệnh trong ngữ cảnh. “Trao ... cho” giữ ý chuyển gánh nặng sang Ngài, nhưng tự nhiên và trang trọng hơn cách dịch sát chữ “ném lên Ngài”.
- source_word: ὅτι
  choice: vì
  rationale: Nêu lý do cho lời khuyên, ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: Ngài quan tâm đến anh chị em
  rationale: Giữ ý về sự lưu tâm chủ động; “quan tâm đến” phản ánh trực tiếp thành ngữ Hy Lạp mà không thu hẹp thành sự chu cấp.
theological_decisions:
- issue: Đối tượng của αὐτόν/αὐτῷ
  choice: Ngài, tức Đức Chúa Trời theo văn cảnh câu 6
  alternative: Chúa theo nghĩa chung hơn
  rationale: “Đức Chúa Trời” ở câu 6 là đối tượng gần nhất; dùng đại từ “Ngài” vẫn giữ hình thức đại từ và không đưa tên gọi vào chính câu.
- issue: Quan hệ cú pháp của ἐπιρίψαντες
  choice: Diễn đạt như lời khuyên tiếp nối mệnh lệnh ở câu 6
  alternative: “sau khi đã trao” hoặc “trong khi trao”
  rationale: Phân từ bất định có thể mang sắc thái phương tiện/đi kèm với việc hạ mình ở câu trước; câu mệnh lệnh tiếng Việt chuyển tải lực khuyên bảo rõ ràng nhưng chú thích bảo tồn hình thức nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và mục vụ. Dùng “anh chị em” để biểu đạt đại từ số nhiều ὑμῶν; viết hoa “Ngài” theo quy ước tiếng Việt khi đại từ chỉ Đức Chúa Trời. Các dấu chú thích đều xuất hiện trong chính văn.
