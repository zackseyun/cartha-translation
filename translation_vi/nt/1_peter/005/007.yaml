  verdict: revise
  source_fidelity: Bản dịch chuyển đạt đúng sức bao quát của πᾶσαν, sắc thái lo âu của μέριμνα, hình ảnh chuyển gánh sang Đức Chúa Trời trong ἐπιρίψαντες ἐπ’ αὐτόν, và mệnh đề lý do ὅτι αὐτῷ μέλει περὶ ὑμῶν. Cách dùng mệnh lệnh tiếng Việt phù hợp với phân từ gắn với lời khuyên ở câu 6.
  naturalness: “Mọi điều lo lắng” không tự nhiên trong tiếng Việt hiện đại, vì “lo lắng” ở đây là trạng thái/nỗi lo chứ không phải các “điều” riêng lẻ. “Mọi nỗi lo lắng” tự nhiên hơn và vẫn phản ánh số ít tập hợp với tính bao quát của nguyên ngữ.
  terminology: “Ngài” được dùng nhất quán và chú thích xác định đúng quy chiếu gần nhất là Đức Chúa Trời. “Quan tâm đến anh chị em” là cách diễn đạt trung tính, tự nhiên cho μέλει περὶ ὑμῶν và không thêm nghĩa giáo phái.
