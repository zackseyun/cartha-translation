  rationale: Chỉ thay “mọi điều lo lắng” bằng “mọi nỗi lo lắng” để bản văn tự nhiên hơn trong tiếng Việt mà không thay đổi nghĩa. Chú thích từ vựng được điều chỉnh nhẹ để giải thích chính xác hơn hình ảnh của động từ ἐπιρίπτω.
