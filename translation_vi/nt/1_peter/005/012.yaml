id: 1PE.5.12
reference: 1 Peter 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: vi
  text: Qua Si-lu-a-nu[a], người anh em trung tín, theo nhận định của tôi, tôi đã viết vắn tắt cho anh chị em để khuyên nhủ và làm chứng rằng đây là ân điển thật của Đức Chúa Trời. Hãy đứng vững trong ân điển ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tôi đã viết cho anh chị em bằng ít lời.”'
    reason: Cách diễn đạt sát hơn của thành ngữ δι’ ὀλίγων, nghĩa là viết vắn tắt.
  - marker: b
    text: 'Một số thủ bản chép: “Anh chị em đang đứng vững trong ân điển ấy” thay vì “Hãy đứng vững trong ân điển ấy.”'
    reason: Ghi nhận dị bản chỉ định thay cho dạng mệnh lệnh của bản văn chính.
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Nhờ Si-lu-a-nu
  rationale: διά với sở hữu cách diễn tả phương tiện hoặc tác nhân. “Nhờ” giữ được khả năng Si-lu-a-nu chuyển thư hoặc hỗ trợ việc soạn thư mà không xác định quá mức vai trò của ông.
- source_word: Σιλουανοῦ
  choice: Si-lu-a-nu
  rationale: Phiên âm trực tiếp dạng tên Hy Lạp Silouanos; không thay bằng dạng rút gọn Si-la vốn xuất hiện ở những chỗ khác.
- source_word: τοῦ πιστοῦ ἀδελφοῦ
  choice: người anh em trung tín
  rationale: πιστός có thể là “trung tín” hoặc “đáng tin cậy”; “trung tín” tự nhiên trong lời giới thiệu một cộng sự cụ thể và giữ sắc thái tín nghĩa.
- source_word: ὡς λογίζομαι
  choice: tôi xem ông là như vậy
  rationale: Giữ sắc thái nhận định cá nhân của tác giả về Si-lu-a-nu và làm rõ đối tượng của đại từ trong tiếng Việt.
- source_word: δι’ ὀλίγων
  choice: vắn tắt
  rationale: Diễn đạt tự nhiên thành ngữ chỉ việc viết bằng ít lời, không làm câu văn nặng nề.
- source_word: ἔγραψα
  choice: tôi đã viết
  rationale: Aorist trong văn thư được diễn đạt tự nhiên bằng “đã viết” trong tiếng Việt, từ góc nhìn người nhận khi đọc thư.
- source_word: παρακαλῶν
  choice: để khuyên nhủ
  rationale: “Khuyên nhủ” bao quát sắc thái khích lệ và thúc giục trong ngữ cảnh giáo huấn, đồng thời giữ sự nghiêm trang.
- source_word: ἐπιμαρτυρῶν
  choice: làm chứng
  rationale: Giữ sức nặng xác nhận và chứng thực của động từ, mạnh hơn cách dịch đơn thuần là “khẳng định”.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: rằng đây là ân điển thật của Đức Chúa Trời
  rationale: Giữ cấu trúc xác định “đây” là ân điển chân thật đến từ Đức Chúa Trời, nhưng không thu hẹp phạm vi chỉ định của “đây”.
- source_word: εἰς ἣν στῆτε
  choice: Hãy đứng vững trong ân điển ấy
  rationale: Dạng mệnh lệnh kêu gọi sự kiên định; lặp lại “ân điển” giúp câu tiếng Việt rõ tham chiếu hơn đại từ “đó” mà không thêm nội dung.
theological_decisions:
- issue: Sở chỉ của ταύτην (“đây”)
  choice: Giữ đại từ “đây” với phạm vi mở, tự nhiên liên hệ đến nội dung thư và lời chứng vừa nêu.
  alternative: Hiểu hẹp là kinh nghiệm ân điển hiện tại của độc giả hoặc riêng sứ điệp do Si-lu-a-nu truyền đạt.
  rationale: Ngữ cảnh viết, khuyên nhủ và làm chứng ủng hộ sự liên hệ rộng đến nội dung tác giả trình bày, nhưng nguyên văn không buộc phải xác định phạm vi chính xác.
- issue: Thể của στῆτε ở mệnh đề cuối
  choice: 'Dịch theo mệnh lệnh: “Hãy đứng vững”.'
  alternative: 'Theo dị bản chỉ định: “anh chị em đang đứng vững”.'
  rationale: Bản SBLGNT được cung cấp đọc στῆτε như mệnh lệnh; dị bản được ghi ở chú thích để bảo tồn chứng cứ văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμῖν, còn “người anh em” cho Si-lu-a-nu là một người nam cụ thể. Dấu gạch ngang làm rõ thành phần chen “tôi xem ông là như vậy”. Mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
