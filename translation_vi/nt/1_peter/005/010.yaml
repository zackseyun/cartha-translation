id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: vi
  text: Còn Đức Chúa Trời của mọi ân điển, Đấng đã gọi anh chị em đến sự vinh hiển đời đời của Ngài trong Đấng Mê-si, sau khi anh chị em chịu khổ ít lâu, chính Ngài sẽ phục hồi[a], làm cho vững vàng, thêm sức và đặt anh chị em trên nền móng vững chắc.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “làm cho hoàn thiện” hoặc “làm cho toàn vẹn.” Động từ này có thể chỉ việc đưa trở lại tình trạng thích hợp.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “lập anh chị em trên nền móng vững chắc.” Động từ Hy Lạp dùng hình ảnh nền móng; cũng có thể dịch là “đặt nền cho anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: của mọi ân điển
  rationale: Giữ cấu trúc sở hữu và ý nghĩa bao quát của cụm Hy Lạp bằng cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt.
- source_word: καλέσας
  choice: Đấng đã gọi
  rationale: Phân từ bất định được diễn đạt bằng mệnh đề quan hệ ở thì quá khứ, nêu hành động kêu gọi của Đức Chúa Trời mà không thêm sắc thái ngoài văn bản.
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: đến sự vinh hiển đời đời của Ngài
  rationale: “Đến” diễn đạt tự nhiên hướng đích của εἰς trong tiếng Việt, đồng thời không xác định quá mức cách người được gọi dự phần vào vinh hiển ấy.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ giới từ ἐν là “trong” và dịch Χριστός theo chức năng tước hiệu là “Đấng Mê-si,” thay vì coi như một tên riêng không mang nghĩa.
- source_word: ὀλίγον παθόντας
  choice: sau khi anh chị em chịu khổ ít lâu
  rationale: Hiểu ὀλίγον theo nghĩa thời gian và thể hiện quan hệ thời gian tự nhiên giữa sự chịu khổ có giới hạn với các hành động tiếp theo của Đức Chúa Trời.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: Bảo tồn sắc thái nhấn mạnh rằng Đức Chúa Trời đích thân thực hiện các hành động được nêu.
- source_word: καταρτίσει
  choice: sẽ phục hồi
  rationale: “Phục hồi” truyền đạt ý đưa về tình trạng thích hợp sau khi chịu khổ; chú thích lưu lại khả năng “làm cho hoàn thiện/toàn vẹn.”
- source_word: στηρίξει
  choice: làm cho vững vàng
  rationale: Diễn đạt trực tiếp ý củng cố sự ổn định và phân biệt tương đối với động từ chỉ thêm sức ngay sau đó.
- source_word: σθενώσει
  choice: thêm sức
  rationale: Cách nói tiếng Việt tự nhiên, truyền đạt trực tiếp ý làm cho mạnh mẽ.
- source_word: θεμελιώσει
  choice: đặt anh chị em trên nền vững chắc
  rationale: Làm rõ hình ảnh nền móng vốn có trong động từ Hy Lạp, tránh dịch trùng với στηρίξει.
theological_decisions:
- issue: Cách dịch Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός ở đây mang chức năng tước hiệu; “Đấng Mê-si” chuyển tải ý nghĩa của tước hiệu và vẫn giữ cụm thần học “trong Đấng Mê-si.”
- issue: Quan hệ giữa sự chịu khổ và hành động của Đức Chúa Trời
  choice: sau khi anh chị em chịu khổ ít lâu
  alternative: khi anh chị em đã chịu khổ ít lâu
  rationale: Cách dịch chính thể hiện trình tự thời gian rõ nhất trong ngữ cảnh nhưng không đưa vào một hệ thống giáo lý về mục đích hay cơ chế của đau khổ.
- issue: Hướng đích của εἰς τὴν ... δόξαν
  choice: đến sự vinh hiển đời đời của Ngài
  alternative: vào trong sự vinh hiển đời đời của Ngài
  rationale: “Đến” là cách dùng tự nhiên trong tiếng Việt cho lời kêu gọi hướng tới vinh hiển; phương án “vào trong” có thể nhấn mạnh sự bước vào hay dự phần nhưng dễ nặng lời hơn nguyên văn trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; dùng “Đức Chúa Trời” và “Ngài” theo lối gọi kính trọng phổ thông. Chuỗi bốn động từ được giữ để bảo tồn nhịp điệu và sự phân biệt trong nguyên văn.
