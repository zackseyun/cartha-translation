  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: vi
  text: đừng thống trị những người được giao cho anh em chăm sóc[a], nhưng hãy trở nên gương mẫu cho bầy chiên.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không làm chủ trên những phần được chia cho anh em.” Tiếng Hy Lạp nói sát nghĩa là “các phần được chia”; trong ngữ cảnh này, có lẽ chỉ những phần trong bầy của Đức Chúa Trời được giao cho mỗi trưởng lão chăm sóc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: không
  rationale: Tiếp nối chuỗi phủ định từ câu trước và nêu cách thức chăn dắt bị cấm; cách diễn đạt ngắn gọn này tự nhiên trong tiếng Việt.
- source_word: κατακυριεύοντες
  choice: lấy quyền mà cai trị
  rationale: Diễn tả việc dùng địa vị làm chủ theo lối áp chế, chứ không phủ nhận mọi vai trò lãnh đạo. Cụm này rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: τῶν κλήρων
  choice: những người đã được giao cho anh em chăm sóc
  rationale: Danh từ có nghĩa đen là các phần được chia hoặc được chỉ định; trong ngữ cảnh chăn bầy, nó chỉ những phần trong dân Chúa được giao cho các trưởng lão chăm sóc, không phải tài sản thuộc quyền sở hữu của họ.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Đánh dấu sự tương phản trực tiếp giữa cách lãnh đạo bị cấm và cách hành xử được đòi hỏi.
- source_word: τύποι
  choice: gương mẫu
  rationale: Chỉ mẫu mực để người khác noi theo; “gương mẫu” tự nhiên và dễ hiểu.
- source_word: γινόμενοι
  choice: hãy trở nên
  rationale: Giữ sắc thái tiến triển và thể hiện trong thực hành của phân từ γινόμενοι, thay vì diễn đạt trạng thái tĩnh.
- source_word: τοῦ ποιμνίου
  choice: bầy chiên
  rationale: Giữ nguyên ẩn dụ mục vụ quen thuộc về cộng đồng tín hữu được chăm sóc.
theological_decisions:
- issue: Ý nghĩa của κλήρων trong quan hệ với sự lãnh đạo hội thánh
  choice: chỉ những người thuộc các phần của bầy được giao cho các trưởng lão chăm sóc, chứ không phải tài sản của họ
  alternative: dịch sát là “các phần được chia” hoặc hiểu là các địa hạt thuộc quyền các trưởng lão
  rationale: Ngữ cảnh nói về việc các trưởng lão chăn bầy của Đức Chúa Trời. Bản dịch nhấn mạnh trách nhiệm quản gia nhưng chú thích vẫn bảo tồn hình ảnh “các phần được chia” của nguyên văn.
- issue: Sắc thái của κατακυριεύοντες
  choice: cấm dùng quyền theo lối áp chế, không cấm mọi việc thực thi vai trò lãnh đạo
  alternative: hiểu là cấm các trưởng lão có bất kỳ quyền lãnh đạo nào
  rationale: Động từ nhắm đến việc làm chủ hoặc thống trị người khác; sự tương phản với việc làm gương cho thấy câu lên án sự lạm quyền, không phủ nhận chức năng lãnh đạo.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Lấy quyền mà cai trị” truyền đạt sắc thái áp chế mà không hàm ý mọi sự lãnh đạo đều sai; “bầy chiên” giữ ẩn dụ mục vụ của nguyên văn.
