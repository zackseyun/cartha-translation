id: 1PE.5.6
reference: 1 Peter 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: vi
  text: Vậy, hãy hạ mình[a] dưới bàn tay quyền năng của Đức Chúa Trời, để Ngài nâng anh chị em lên vào đúng thời điểm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy chịu hạ xuống ... để Ngài nâng anh chị em lên vào đúng thời điểm.” Mệnh lệnh Hy Lạp có hình thức thụ động, dù tại đây thường được hiểu theo nghĩa phản thân: “hãy hạ mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: hãy hạ mình
  rationale: Động từ ở thể mệnh lệnh thụ động về hình thức, nhưng trong lời khuyên này có thể mang nghĩa phản thân/trung gian. “Hãy hạ mình” tự nhiên trong tiếng Việt và giữ nguyên sức mạnh của mệnh lệnh; chú thích bảo lưu khả năng dịch thụ động.
- source_word: οὖν
  choice: Vậy
  rationale: Biểu thị kết luận rút ra từ lời trước đó về việc Đức Chúa Trời chống lại kẻ kiêu ngạo và ban ân sủng cho người khiêm nhường.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: dưới bàn tay quyền năng
  rationale: Giữ hình ảnh Kinh Thánh quen thuộc về quyền năng và sự hành động tối thượng của Đức Chúa Trời; “quyền năng” tự nhiên và trang trọng trong tiếng Việt.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Sở hữu cách xác định bàn tay được nói đến là của Đức Chúa Trời.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích/kết quả mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: ὑμᾶς ὑψώσῃ
  choice: Ngài nâng anh chị em lên
  rationale: Chủ ngữ được hiểu là Đức Chúa Trời. “Nâng ... lên” giữ được hình ảnh đối lập với “hạ mình” và có thể chỉ sự tôn cao hoặc minh oan, không chỉ sự nâng lên về thể chất.
- source_word: ἐν καιρῷ
  choice: vào đúng thời điểm
  rationale: καιρός chỉ thời điểm thích hợp, thuận hợp, chứ không đơn thuần là thời gian theo trình tự; cách dịch này rõ ràng trong tiếng Việt hiện đại mà không khẳng định quá mức rằng đó là một thời điểm đã được ấn định.
theological_decisions:
- issue: Thể và tác nhân trong Ταπεινώθητε
  choice: Dịch theo nghĩa phản thân là “hãy hạ mình”, đồng thời giữ cụm “dưới bàn tay quyền năng của Đức Chúa Trời” để cho thấy đây là sự thuận phục quyền năng Ngài.
  alternative: “hãy chịu hạ xuống” hoặc “hãy để mình được hạ xuống”
  rationale: 'Cách dịch chính tránh lối thụ động gượng gạo trong tiếng Việt nhưng không biến sự hạ mình thành hành vi tự hạ độc lập với Đức Chúa Trời. Chú thích bảo lưu hình thức thụ động và sự căng thẳng về tác nhân: con người đáp ứng bằng sự thuận phục, còn Đức Chúa Trời là Đấng nâng họ lên.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để biểu đạt đại từ số nhiều ὑμᾶς một cách bao quát; giữ hình ảnh “bàn tay quyền năng” và thế đối lập “hạ mình/nâng ... lên” của nguyên văn.
