id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: vi
  text: Người nữ ở Ba-by-lôn[a][b], được chọn cùng với anh em, gửi lời chào anh em; Mác, con trai tôi[c], cũng gửi lời chào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối giải thích: “Hội Thánh ở Ba-by-lôn, được chọn cùng với anh em.” Tiếng Hy Lạp dùng một cách diễn đạt giống cái số ít nhưng lược bỏ danh từ.'
    reason: alternative_reading
  - marker: b
    text: Trong cách dùng của Cơ Đốc nhân thời kỳ đầu, “Ba-by-lôn” có thể là tên gọi mang tính biểu tượng chỉ Rô-ma; tuy nhiên, chính văn ghi “Ba-by-lôn”.
    reason: cultural_note
  - marker: c
    text: “Con trai tôi” có lẽ diễn tả mối quan hệ thuộc linh chứ không phải quan hệ huyết thống.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: gửi lời chào
  rationale: Động từ này thường chỉ việc chào hỏi hoặc gửi lời chào trong thư từ. “Gửi lời chào” tự nhiên trong tiếng Việt và phù hợp với văn cảnh cuối thư.
- source_word: ἡ ... συνεκλεκτὴ
  choice: Người nữ ... được chọn cùng với anh em
  rationale: Mạo từ và tính từ giống cái số ít được dùng mà không có danh từ đi kèm. “Người nữ” giữ được dấu hiệu giống cái và để ngỏ danh tính của đối tượng, thay vì tự ý thêm “Hội Thánh” vào chính văn.
- source_word: ἐν Βαβυλῶνι
  choice: ở Ba-by-lôn
  rationale: Nguyên văn nêu trực tiếp địa danh Ba-by-lôn. Bản dịch giữ nguyên địa danh, không thay bằng “Rô-ma”, còn cách hiểu biểu tượng được ghi trong chú thích.
- source_word: συνεκλεκτὴ
  choice: được chọn cùng với anh em
  rationale: Cách diễn đạt này truyền đạt ý cùng được chọn với những người nhận thư, đồng thời tự nhiên hơn một từ ghép sát chữ trong tiếng Việt.
- source_word: Μᾶρκος
  choice: Mác
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: ὁ υἱός μου
  choice: con trai tôi
  rationale: υἱός có nghĩa thông thường là “con trai”. Chính văn giữ nguyên ngôn ngữ thân thuộc của câu Hy Lạp; khả năng đây là quan hệ thuộc linh được nêu trong chú thích.
theological_decisions:
- issue: Danh tính của ἡ ... συνεκλεκτὴ
  choice: 'Giữ một đối tượng giống cái không được nêu tên: “Người nữ ... được chọn cùng với anh em”.'
  alternative: “Hội Thánh ở Ba-by-lôn, được chọn cùng với anh em” hoặc một phụ nữ cụ thể như vợ của Phi-e-rơ.
  rationale: Tiếng Hy Lạp có mạo từ và tính từ giống cái số ít nhưng không nêu danh từ. Việc hiểu danh từ ngầm là “Hội Thánh” khá phổ biến, song không phải là điều được nói rõ; vì vậy chính văn giữ sự mơ hồ và chú thích nêu cách hiểu ấy.
- issue: Ba-by-lôn chỉ nơi nào
  choice: Giữ “Ba-by-lôn” trong chính văn.
  alternative: Hiểu đây là tên gọi biểu tượng chỉ Rô-ma, hoặc hiểu là Ba-by-lôn theo nghĩa địa lý.
  rationale: Nguyên văn ghi Ba-by-lôn, còn địa điểm thực sự được chỉ đến vẫn là vấn đề được bàn luận. Bản dịch không quyết định thay cho độc giả.
- issue: Quan hệ giữa Mác và tác giả trong cụm “con trai tôi”
  choice: Giữ cách gọi “con trai tôi”.
  alternative: “Con thuộc linh của tôi”.
  rationale: Quan hệ thuộc linh có thể là cách hiểu hợp lý, nhưng từ “thuộc linh” không có trong nguyên văn, nên chỉ được trình bày ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người nữ” hơi khác lối nói thông thường nhưng cần thiết để giữ dấu hiệu giống cái và sự mơ hồ thật sự của nguyên văn. Dùng “anh em” theo lối xưng hô cộng đồng, có thể bao gồm toàn thể người nhận thư.
