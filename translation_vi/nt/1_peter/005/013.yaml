  terminology: “Ba-by-lôn,” “Rô-ma,” “Hội Thánh,” “Mác,” và “con trai tôi” nhất quán với lối dùng Kinh Thánh tiếng Việt. “Được chọn cùng với anh em” truyền đạt đầy đủ lực liên đới của συνεκλεκτή mà không dùng từ ghép thiếu tự nhiên. Các chú thích phân biệt thích đáng giữa chính văn và các cách giải thích lịch sử/thần học.
