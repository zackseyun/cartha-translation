id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: vi
  text: 'Vậy, tôi khuyên nhủ các trưởng lão ở giữa anh em—tôi là một trưởng lão cùng với anh em, là chứng nhân về những đau khổ của Đấng Mê-si[a], và cũng là người cùng dự phần vào vinh quang sắp được bày tỏ[b]—rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ”. Tước hiệu Hy Lạp Χριστός có thể được dịch là “Đấng Mê-si” hoặc, theo cách truyền thống, là “Đấng Christ”.
    reason: alternative_reading
  - marker: b
    text: Hay “người tham dự vào vinh quang sẽ được bày tỏ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: các trưởng lão
  rationale: Trong bối cảnh hội thánh, từ này chỉ những người lãnh đạo cộng đồng, không đơn thuần là những người đàn ông lớn tuổi. “Trưởng lão” là cách gọi tự nhiên và quen thuộc trong tiếng Việt, không áp đặt cơ cấu giáo phái về sau.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả sự chuyển tiếp có tính suy luận từ phần trước; “Vậy” tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ liên kết lập luận.
- source_word: ἐν ὑμῖν
  choice: ở giữa anh em
  rationale: Giữ nghĩa quan hệ của giới từ ἐν khi đi với người, đồng thời phù hợp với lời tác giả ngỏ cùng cộng đồng tín hữu.
- source_word: παρακαλῶ
  choice: tôi khuyên nhủ
  rationale: Diễn đạt lời thúc giục mục vụ tha thiết, trang trọng hơn một lời đề nghị thông thường nhưng không mang sắc thái ra lệnh.
- source_word: συμπρεσβύτερος
  choice: tôi cũng là một trưởng lão
  rationale: Chuyển đạt rõ địa vị chung mà tác giả chia sẻ với những trưởng lão được nhắn nhủ; tự nhiên hơn dạng ghép cứng như “đồng trưởng lão”.
- source_word: μάρτυς
  choice: chứng nhân
  rationale: Chỉ người làm chứng về những sự chịu khổ của Đấng Mê-si, không nhất thiết mang nghĩa người tử đạo.
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: về những sự chịu khổ của Đấng Mê-si
  rationale: Giữ quan hệ sở hữu/nghĩa liên hệ của kết cấu sở hữu cách. Giới từ “về” phù hợp tự nhiên với “chứng nhân” trong tiếng Việt và không quyết định quá mức bản chất chính xác của việc làm chứng.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός vẫn có sức nặng của một tước hiệu ở đây; “Đấng Mê-si” truyền đạt nghĩa “Đấng được xức dầu”, còn cách gọi truyền thống được ghi trong chú thích.
- source_word: κοινωνός
  choice: người cùng dự phần
  rationale: Diễn tả sự tham dự/chia sẻ vào một thực tại, tránh sắc thái thương mại có thể có ở một số từ tương đương.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: vào vinh quang sắp được bày tỏ
  rationale: Giữ thể bị động của ἀποκαλύπτεσθαι và sắc thái mong đợi/cận kề của μέλλω mà không giải quyết tranh luận về thời điểm cánh chung.
theological_decisions:
- issue: Cách dịch Χριστοῦ như một tước hiệu Cơ Đốc học
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: “Đấng Mê-si” làm rõ nghĩa tước hiệu của Χριστός trong nguyên ngữ; cách gọi truyền thống “Đấng Christ” vẫn được bảo lưu trong chú thích.
- issue: Sắc thái của μελλούσης ἀποκαλύπτεσθαι
  choice: sắp được bày tỏ
  alternative: sẽ được bày tỏ
  rationale: “Sắp” giữ sắc thái trông đợi gần của μέλλω, nhưng không nhằm xác định một lịch trình cánh chung cụ thể.
- issue: Ý nghĩa của μάρτυς đối với những sự chịu khổ
  choice: chứng nhân về những sự chịu khổ
  alternative: người làm chứng cho những sự chịu khổ
  rationale: Bản dịch giữ độ rộng của μάρτυς, không tự ý xác định liệu tác giả nhấn mạnh việc tận mắt chứng kiến hay việc làm chứng công khai về các sự kiện ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc dẫn nhập chưa khép lại của nguyên văn vì lời khuyên cụ thể tiếp tục ở câu 2; dấu gạch ngang giúp người đọc theo dõi ba tư cách tác giả nêu về mình.
