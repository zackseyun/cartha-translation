id: 1PE.5.9
reference: 1 Peter 5:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: vi
  text: Hãy chống cự nó, hãy đứng vững trong đức tin, vì biết rằng cộng đồng anh chị em của anh em trong thế gian cũng đang chịu những đau khổ cùng loại ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những đau khổ cùng loại ấy cũng đang được hoàn tất trong cộng đồng anh chị em của anh em trong thế gian.”'
    reason: Giữ một cách dịch sát chữ hơn cho ἐπιτελεῖσθαι, vốn có thể hàm ý các đau khổ đang được hoàn tất/hoàn thành, đồng thời bảo tồn cụm định vị ἐν τῷ κόσμῳ.
lexical_decisions:
- source_word: ᾧ
  choice: nó
  rationale: Đại từ quan hệ ở cách cho chỉ ngược về ma quỷ trong câu 8; tiếng Việt tự nhiên dùng đại từ tân ngữ “nó”.
- source_word: ἀντίστητε
  choice: Hãy chống lại
  rationale: Mệnh lệnh kêu gọi sự đối kháng dứt khoát; “chống lại” rõ nghĩa và tự nhiên.
- source_word: στερεοὶ τῇ πίστει
  choice: đứng vững trong đức tin
  rationale: Diễn đạt tự nhiên vai trò vị ngữ của στερεοὶ và giữ được khả năng τῇ πίστει nói đến đức tin Cơ Đốc cũng như lòng tin kiên định.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ có thể nêu cơ sở cho mệnh lệnh; “vì biết rằng” làm rõ quan hệ này mà không thêm ý xa nguồn.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: những nỗi khổ đau như thế
  rationale: Cấu trúc chỉ những đau khổ cùng loại, không nhất thiết là các biến cố hoàn toàn giống nhau.
- source_word: ἀδελφότητι
  choice: cộng đồng anh chị em
  rationale: Danh từ tập hợp chỉ toàn thể cộng đồng đồng đạo; cách dịch giữ hình ảnh gia đình và biểu đạt rõ rằng gồm cả nam lẫn nữ.
- source_word: ἐν τῷ κόσμῳ
  choice: trên khắp thế gian
  rationale: Trong ngữ cảnh cộng đồng tín hữu phân tán, cách diễn đạt này truyền đạt tự nhiên phạm vi toàn thế giới của cụm từ.
- source_word: ἐπιτελεῖσθαι
  choice: đang chịu
  rationale: Thể bị động trong kết cấu này được diễn đạt tự nhiên là cộng đồng tín hữu đang trải qua đau khổ; chú thích giữ nghĩa sát chữ hơn là “được hoàn tất”.
theological_decisions:
- issue: Ý nghĩa của τῇ πίστει
  choice: trong đức tin
  alternative: bởi lòng tin
  rationale: Mạo từ và văn cảnh khuyên bảo nghiêng về sự đứng vững trong đức tin đã tiếp nhận, nhưng bản dịch không xác định quá mức ranh giới giữa nội dung đức tin và hành động tin cậy.
- issue: Ý nghĩa của ἐπιτελεῖσθαι
  choice: đang chịu
  alternative: đang được hoàn tất
  rationale: “Đang chịu” phù hợp cú pháp và tự nhiên trong tiếng Việt; chú thích bảo tồn khả năng động từ nhấn mạnh việc những đau khổ ấy đang được hoàn tất.
- issue: Phạm vi của ἀδελφότητι
  choice: cộng đồng anh chị em
  alternative: đoàn thể anh em
  rationale: Danh từ Hy Lạp chỉ toàn thể cộng đồng tín hữu chứ không chỉ nam giới; cách dịch hiện đại giữ sắc thái thân thuộc mà không thu hẹp đối tượng.
translation_notes:
  register: Văn phong trang trọng vừa phải, rõ ràng với độc giả hiện đại. Dùng “anh em” để trực tiếp xưng hô với cộng đồng theo lối Kinh Thánh quen thuộc, còn “cộng đồng anh chị em” để làm rõ danh từ tập hợp bao gồm mọi tín hữu.
