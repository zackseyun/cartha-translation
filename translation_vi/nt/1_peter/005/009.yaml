revisions:
- from: Hãy chống lại nó, đứng vững trong đức tin, vì biết rằng cộng đồng anh chị em của anh em trên khắp thế gian cũng đang chịu những nỗi khổ đau như thế.[a]
  to: Hãy chống cự nó, hãy đứng vững trong đức tin, vì biết rằng cộng đồng anh chị em của anh em trong thế gian cũng đang chịu những đau khổ cùng loại ấy.[a]
  rationale: Sửa “trên khắp thế gian” thành “trong thế gian” để không thêm ý về phạm vi phân bố. Điều chỉnh nhẹ cách diễn đạt về “những đau khổ cùng loại” và chú thích nhằm phản ánh rõ hơn cấu trúc và nghĩa khả dĩ của nguyên văn, trong khi giữ bản văn chính tự nhiên và dễ hiểu.
