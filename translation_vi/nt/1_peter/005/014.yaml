  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: vi
  text: Hãy chào nhau bằng nụ hôn yêu thương. Nguyện bình an cho tất cả những người ở trong Đấng Mê-si.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo cách dịch quen thuộc hơn: “Đấng Christ.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Hãy chào
  rationale: Động từ mệnh lệnh số nhiều kêu gọi cộng đồng thực hiện hành động chào hỏi; “hãy chào” tự nhiên và phù hợp với lời kết thư.
- source_word: ἀλλήλους
  choice: nhau
  rationale: Đại từ tương hỗ, diễn tả hành động qua lại giữa các thành viên trong cộng đồng.
- source_word: ἐν φιλήματι ἀγάπης
  choice: bằng nụ hôn yêu thương
  rationale: “Bằng” diễn đạt phương cách chào hỏi; “nụ hôn yêu thương” vừa tự nhiên trong tiếng Việt vừa giữ rõ mối liên hệ của ἀγάπη với tình yêu thương.
- source_word: εἰρήνη ὑμῖν πᾶσιν
  choice: Nguyện bình an đến với tất cả anh chị em
  rationale: Cụm danh từ Hy Lạp có sức nặng của một lời chúc phước. “Nguyện” làm rõ chức năng này trong tiếng Việt mà không biến câu thành một lời khẳng định; “tất cả anh chị em” truyền đạt phạm vi bao quát và ngôi thứ hai số nhiều.
- source_word: τοῖς ἐν Χριστῷ
  choice: là những người ở trong Đấng Mê-si
  rationale: Mạo từ cùng cụm giới từ có chức năng danh từ hóa, chỉ “những người ở trong”; “Đấng Mê-si” chuyển tải Χριστός như một tước hiệu, nghĩa là Đấng Được Xức Dầu.
theological_decisions:
- issue: Cách dịch Χριστῷ trong cụm ἐν Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός chỉ Đấng được xức dầu và cụm “ở trong” diễn tả mối liên hệ hiệp nhất với Ngài. Bản chính dùng tước hiệu có nghĩa rõ ràng; cách gọi quen thuộc theo truyền thống được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” phù hợp với lời gửi đến toàn thể cộng đồng, không giới hạn ở nam giới. Dấu chú thích được đặt ngay sau thuật ngữ mà chú thích giải thích.
