- from: Hãy chào nhau bằng nụ hôn yêu thương. Nguyện bình an đến với tất cả anh chị em là những người ở trong Đấng Mê-si.[a]
  to: Hãy chào nhau bằng nụ hôn yêu thương. Nguyện bình an cho tất cả những người ở trong Đấng Mê-si.[a]
  rationale: Sửa nhẹ lời chúc cuối để phản ánh sát hơn công thức εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν Χριστῷ, giữ văn phong hiện đại và bảo toàn cách dịch Χριστός là “Đấng Mê-si.” Chú thích được giữ nguyên và đúng vị trí neo.
