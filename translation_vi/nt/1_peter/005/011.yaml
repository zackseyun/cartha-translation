  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: vi
  text: Nguyện quyền thống trị thuộc về Ngài đời đời vô cùng[a]. A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “cho đến các thời đại của các thời đại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῷ
  choice: thuộc về Ngài
  rationale: Đại từ ở cách tặng dữ, quy chiếu về Đức Chúa Trời trong văn cảnh trước. Cách diễn đạt này tự nhiên trong tiếng Việt và phù hợp với câu tán tụng không có động từ trong tiếng Hy Lạp.
- source_word: κράτος
  choice: quyền thống trị
  rationale: Trong lời tán tụng, từ này chỉ quyền năng có tính cai trị, không chỉ sức mạnh nói chung; “quyền thống trị” truyền đạt rõ sắc thái chủ quyền.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Đây là thành ngữ tán tụng nhấn mạnh thời gian không bao giờ chấm dứt. “Đời đời vô cùng” vừa trang trọng, dễ hiểu, vừa giữ được lực nhấn mạnh của nguyên văn.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ cách phiên âm quen thuộc trong tiếng Việt và sắc thái xác nhận phụng vụ của từ này.
theological_decisions:
- issue: Vị ngữ được hàm ý trong câu tán tụng không có động từ
  choice: Nguyện quyền thống trị thuộc về Ngài
  alternative: Quyền thống trị thuộc về Ngài; Ngài có quyền thống trị
  rationale: Nguyên văn Hy Lạp không có động từ. Thêm “Nguyện… thuộc về” giữ giọng tán tụng và tránh biến câu thành một lời giải thích thuần túy, đồng thời không xác định quá mức điều nguyên văn chỉ hàm ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; giữ cấu trúc tán tụng, đồng thời dùng chú thích để phản ánh sát thành ngữ Hy Lạp.
