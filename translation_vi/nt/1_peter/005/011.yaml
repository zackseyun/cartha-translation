  terminology: “Quyền thống trị” phản ánh thích đáng κράτος trong một lời quy vinh, nhấn mạnh quyền năng mang tính chủ quyền hơn là sức mạnh trừu tượng. “Ngài” phù hợp với đối tượng quy chiếu là Đức Chúa Trời trong văn mạch trước đó. Chú thích phản ánh hợp lệ cách dịch sát của thành ngữ thời lượng Hy Lạp.
