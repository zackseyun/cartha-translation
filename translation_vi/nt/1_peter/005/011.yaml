  source_fidelity: 'Bản dịch truyền đạt đúng câu tán tụng không có động từ của nguyên văn: αὐτῷ được diễn đạt là “thuộc về Ngài,” κράτος là “quyền thống trị,” và công thức εἰς τοὺς αἰῶνας τῶν αἰώνων được chuyển tự nhiên là “đời đời vô cùng.” “Nguyện” là cách bổ sung vị ngữ/tình thái tán tụng hợp lý trong tiếng Việt, không làm thay đổi nội dung thần học.'
