id: 1PE.5.8
reference: 1 Peter 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: vi
  text: Hãy giữ đầu óc tỉnh táo[a] và luôn cảnh giác. Kẻ thù của anh chị em là ma quỷ đi quanh như sư tử gầm rống[b], tìm người để nuốt chửng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy tỉnh thức trong tâm trí” hoặc theo lối dịch truyền thống: “Hãy tiết độ.” Động từ Hy Lạp νήψατε vốn có nghĩa đen là “tỉnh rượu,” nhưng mọi lần xuất hiện trong Tân Ước đều mang nghĩa bóng; ở đây nhấn mạnh sự sáng suốt và tự chủ về tinh thần, không phải việc kiêng rượu.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “rình mò như sư tử gầm rống.” Động từ Hy Lạp có nghĩa sát hơn là “đi quanh” hoặc “đi đây đó,” còn hình ảnh sư tử tự gợi ý hành động rình mồi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Hãy giữ đầu óc tỉnh táo
  rationale: 'Động từ νήφω vốn có nghĩa đen là tỉnh rượu, nhưng ở đây được dùng theo nghĩa bóng: giữ tâm trí sáng suốt và tự chủ trước mối đe dọa thuộc linh. Cách dịch này cũng phân biệt tự nhiên với γρηγορήσατε.'
- source_word: γρηγορήσατε
  choice: luôn cảnh giác
  rationale: Mệnh lệnh này diễn tả sự tỉnh thức và đề phòng liên tục; “luôn cảnh giác” tự nhiên trong tiếng Việt hiện đại và bổ sung cho ý giữ đầu óc tỉnh táo.
- source_word: ἀντίδικος
  choice: kẻ thù
  rationale: Từ này có thể chỉ đối thủ trong pháp đình, nhưng trong ngữ cảnh này chỉ kẻ chống nghịch nói chung. “Kẻ thù” truyền đạt rõ tính đối địch mà không thu hẹp vào bối cảnh pháp lý.
- source_word: διάβολος
  choice: ma quỷ
  rationale: Ở đây từ này được dùng làm danh xưng quen thuộc của hữu thể ác chống nghịch các tín hữu, chứ không chỉ một người vu khống nói chung.
- source_word: ὡς λέων ὠρυόμενος
  choice: như sư tử gầm rống
  rationale: Giữ nguyên phép so sánh rõ ràng và hình ảnh đe dọa mạnh mẽ của nguyên文.
- source_word: περιπατεῖ
  choice: đi quanh
  rationale: Giữ sát nghĩa cơ bản “đi quanh/đi đây đó”, để chính hình ảnh sư tử truyền tải sắc thái rình mồi; phương án diễn giải mạnh hơn được ghi ở chú thích.
- source_word: ζητῶν
  choice: tìm
  rationale: Phân từ diễn tả hành động tìm kiếm tích cực, hướng đến mục tiêu nuốt chửng.
- source_word: τινα
  choice: người
  rationale: Đại từ bất định số ít chỉ một mục tiêu không xác định; tiếng Việt có thể diễn đạt tự nhiên là “tìm người để…”.
- source_word: καταπιεῖν
  choice: nuốt chửng
  rationale: Từ này có nghĩa là nuốt hoàn toàn; trong hình ảnh sư tử, “nuốt chửng” vừa tự nhiên vừa giữ được sức mạnh bạo liệt của nguyên ngữ.
theological_decisions:
- issue: Nên dịch διάβολος như danh từ chung “kẻ vu khống” hay như danh xưng của Sa-tan
  choice: ma quỷ
  alternative: kẻ vu khống
  rationale: Trong câu này, từ đó chỉ hữu thể ác có tính cá vị đang chống nghịch các tín hữu. “Ma quỷ” phản ánh cách dùng thông thường trong Tân Ước mà không thêm nội dung giáo lý ngoài bản văn.
- issue: Mức độ diễn giải sắc thái của περιπατεῖ trong hình ảnh sư tử
  choice: đi quanh
  alternative: rình mò
  rationale: “Đi quanh” giữ nghĩa thông thường của động từ Hy Lạp và để phép so sánh với sư tử tự truyền tải sự đe dọa. “Rình mò” hợp ngữ cảnh nhưng diễn giải mạnh hơn nên được giữ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν nhằm biểu đạt rõ cộng đồng độc giả gồm cả nam và nữ. Nhịp hai mệnh lệnh đầu được nối bằng “và” để câu tự nhiên, trong khi vẫn giữ hai ý riêng biệt.
