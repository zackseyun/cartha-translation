- from: Và khi Đấng Chăn Chiên Tối Cao được bày tỏ[a], anh em sẽ nhận được vòng hoa vinh quang không bao giờ tàn[b].
  to: Và khi Đấng Chăn Chiên Tối Cao được bày tỏ[a], anh em sẽ nhận được vòng hoa[b] vinh quang không hề tàn.
  rationale: Bản sửa chỉ điều chỉnh vị trí neo của chú thích từ vựng để nó gắn với “vòng hoa” (στέφανος), và tinh gọn cách diễn đạt của ἀμαράντινον. Ý nghĩa, giọng văn, tước hiệu và các chú thích còn lại được giữ nguyên.
