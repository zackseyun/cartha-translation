  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: vi
  text: Và khi Đấng Chăn Chiên Tối Cao được bày tỏ[a], anh em sẽ nhận được vòng hoa[b] vinh quang không hề tàn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xuất hiện.”
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp được dịch là “vòng hoa” có thể chỉ vòng kết được trao cho người chiến thắng như một phần thưởng danh dự, chứ không nhất thiết là vương miện của vua.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: khi ... được bày tỏ
  rationale: Phân từ thụ động bất định trong kết cấu sở hữu tuyệt đối mang ý nghĩa thời gian. “Khi ... được bày tỏ” giữ sắc thái thụ động và ý niệm hiển lộ; “khi ... xuất hiện” cũng có thể hiểu được nhưng làm nhẹ sắc thái ấy.
- source_word: ἀρχιποίμενος
  choice: Đấng Chăn Chiên Tối Cao
  rationale: Danh từ ghép chỉ người chăn chiên đứng đầu hay tối cao. Cách dịch này tự nhiên, trang trọng và thể hiện đây là tước hiệu chỉ về Chúa Giê-su trong văn cảnh.
- source_word: κομιεῖσθε
  choice: anh em sẽ nhận được
  rationale: Động từ tương lai trung thái ở đây nói đến việc nhận phần thưởng. “Sẽ nhận được” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἀμαράντινον
  choice: không bao giờ tàn
  rationale: Tính từ diễn tả điều không phai hay héo tàn. Cụm từ này dễ hiểu, giữ đúng hình ảnh của vòng hoa và không nâng nghĩa thành “không thể hư mất”.
- source_word: τῆς δόξης
  choice: vinh quang
  rationale: Được giữ trong kết cấu “vòng hoa vinh quang,” vừa gọn tự nhiên trong tiếng Việt vừa bảo toàn liên hệ sở hữu/định tính cô đọng của nguyên văn.
- source_word: στέφανον
  choice: vòng hoa
  rationale: στέφανος thường chỉ vòng kết bằng lá hoặc hoa được trao để tôn vinh người chiến thắng, không nhất thiết là vương miện hoàng gia. “Vòng hoa” bảo toàn hình ảnh lịch sử rõ hơn “mão triều thiên” hay “vương miện”.
theological_decisions:
- issue: Danh tính của “Đấng Chăn Chiên Tối Cao”
  choice: Viết hoa như một tước hiệu chỉ về Chúa Giê-su
  alternative: Viết thường như một danh xưng mô tả
  rationale: Hình ảnh người chăn chiên trong văn cảnh và sự bày tỏ trong tương lai cho thấy danh xưng này chỉ về Chúa Giê-su; bản dịch không thêm tên Ngài vào câu để tránh diễn giải quá mức.
- issue: Ngôn ngữ về sự hiển lộ trong thời cuối cùng
  choice: được bày tỏ
  alternative: xuất hiện
  rationale: Cách dịch thụ động giữ được mô-típ hiển lộ của φανερωθέντος và không thu hẹp cách mô tả biến cố hơn nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để tiếp nối đối tượng số nhiều trong văn cảnh. Hai dấu chú thích đều xuất hiện trong chính văn và đặt sát cụm từ liên quan.
