id: JAS.3.14
reference: James 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: vi
  text: Nhưng nếu trong lòng anh chị em có sự đố kỵ cay đắng[a] và tham vọng ích kỷ[b], thì đừng khoe khoang và đừng nói dối nghịch với sự thật.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng sốt sắng cay đắng” hoặc “sự ghen tị cay đắng”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự tranh cạnh” hoặc “tinh thần bè phái”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “nói dối đi ngược lại sự thật”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Diễn đạt tự nhiên sự tương phản mà δέ tạo ra với phần mô tả sự khôn ngoan ở trước.
- source_word: ζῆλον πικρὸν
  choice: sự ganh ghét cay đắng
  rationale: ζῆλος có thể chỉ lòng sốt sắng, ghen ghét hoặc đố kỵ; trong ngữ cảnh tiêu cực và khi đi cùng ἐριθεία, “ganh ghét” diễn đạt rõ sắc thái thù nghịch, còn “cay đắng” giữ trực tiếp ý của πικρόν.
- source_word: ἐριθείαν
  choice: tham vọng ích kỷ
  rationale: Cụm từ tự nhiên, dễ hiểu, thể hiện động cơ vụ lợi và tự tôn của ἐριθεία, đồng thời không loại bỏ hệ quả tranh cạnh, chia rẽ.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: trong lòng anh chị em
  rationale: Tiếng Hy Lạp dùng danh từ số ít với đại từ số nhiều theo lối phân phối. Tiếng Việt không bắt buộc đánh dấu số ở “lòng”, nên cách dịch này tự nhiên và có thể áp dụng cho từng người trong cộng đồng.
- source_word: μὴ κατακαυχᾶσθε
  choice: đừng khoe khoang
  rationale: Giữ mệnh lệnh phủ định và ý tự đề cao của động từ; sắc thái đối nghịch được câu tiếp theo làm rõ.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: nói dối chống lại sự thật
  rationale: “Nói dối” giữ lực của ψεύδεσθε, còn “chống lại” phản ánh κατά với sở hữu cách, dù tiếng Việt cũng có thể diễn đạt tự nhiên hơn là “đi ngược lại sự thật”.
theological_decisions:
- issue: Phạm vi ý nghĩa của “sự thật”
  choice: Giữ cách gọi rộng là “sự thật”
  alternative: Chân lý Phúc Âm; con đường khôn ngoan chân thật; sự thành thật trong lời nói
  rationale: ἀλήθεια không được câu này giới hạn vào riêng một hệ thống giáo lý, một nếp sống khôn ngoan hay tính trung thực chủ quan. Cách dịch rộng bảo toàn sức nặng thần học và sự căng thẳng của nguyên văn.
- issue: Mối liên hệ giữa khoe khoang và nói dối
  choice: 'Giữ hai động từ song song: “đừng khoe khoang và nói dối”'
  alternative: Đừng khoe khoang mà chối bỏ sự thật
  rationale: Nguyên văn phối hợp hai động từ bằng καί. Không diễn giải rằng việc khoe khoang chỉ là phương tiện, nguyên nhân hay một tên gọi khác của việc nói dối.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để xưng hô với cộng đồng độc giả; đặt cụm “trong lòng anh chị em” lên đầu để câu tiếng Việt trôi chảy mà vẫn giữ đúng phạm vi của hai thói xấu. Không thu hẹp “sự thật” vào một cách giải thích giáo phái.
