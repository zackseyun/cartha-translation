  to: Nhưng nếu trong lòng anh chị em có sự đố kỵ cay đắng[a] và tham vọng ích kỷ[b], thì đừng khoe khoang và đừng nói dối nghịch với sự thật.[c]
  rationale: Sửa “ganh ghét” thành “đố kỵ” để thể hiện chính xác hơn ý tiêu cực của ζῆλος trong ngữ cảnh; sửa cách diễn đạt về việc nói dối để tiếng Việt tự nhiên mà vẫn giữ ý chống nghịch với sự thật; đồng thời chỉnh các phương án chú thích cho rõ và tự nhiên hơn. Các neo chú thích vẫn gắn đúng với những cụm từ được chú thích.
