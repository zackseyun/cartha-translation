id: JAS.3.2
reference: James 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: vi
  text: Vì tất cả chúng ta đều vấp phạm nhiều điều. Nếu ai không vấp phạm trong lời nói,[a] thì người ấy là người trưởng thành,[b] cũng có thể kiềm chế cả thân thể.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “trong lời”; nghĩa là trong lời nói hoặc trong điều mình nói.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp τέλειος cũng có thể dịch là “hoàn hảo” hoặc “trọn vẹn”; ở đây có lẽ chỉ sự trưởng thành về đạo đức, chứ không phải tuyệt đối không phạm lỗi. Động từ được dịch là “kiềm chế” gợi hình ảnh điều khiển bằng hàm thiếc hoặc dây cương.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: nhiều cách
  rationale: Dạng trung tính số nhiều đối cách được dùng theo chức năng trạng từ, diễn tả việc vấp phạm trong nhiều phương diện; cách dịch này giữ độ rộng của nguyên văn.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nêu căn cứ cho lời cảnh báo ngay trước đó về người dạy dỗ.
- source_word: πταίομεν / πταίει
  choice: vấp phạm
  rationale: Vừa giữ hình ảnh vấp ngã của động từ Hy Lạp, vừa truyền đạt rõ sắc thái sai phạm về đạo đức trong tiếng Việt.
- source_word: ἅπαντες
  choice: tất cả chúng ta
  rationale: Giữ sắc thái bao quát và việc tác giả tự kể mình vào trong nhóm.
- source_word: εἴ τις
  choice: Nếu ai
  rationale: Cách diễn đạt tự nhiên cho điều kiện bất định mang tính khái quát.
- source_word: ἐν λόγῳ
  choice: trong lời nói
  rationale: λόγος ở đây chỉ lời nói hay điều được nói; cách dịch gọn, rõ và không thu hẹp vào một phát ngôn riêng lẻ.
- source_word: οὗτος
  choice: người ấy
  rationale: Giữ lực chỉ định, trỏ lại người vừa được nêu trong mệnh đề điều kiện, đồng thời tự nhiên trong tiếng Việt.
- source_word: τέλειος
  choice: trưởng thành
  rationale: Trong văn mạch đạo đức của Gia-cơ, từ này thiên về sự chín chắn, trọn vẹn trong nhân cách hơn là tuyệt đối không phạm lỗi.
- source_word: ἀνήρ
  choice: một người
  rationale: ἀνήρ có hình thức giống đực, nhưng trong mệnh đề khái quát mở đầu bằng εἴ τις, nó mang lực đại diện; tiếng Việt dùng “người” tự nhiên và không làm mất phạm vi áp dụng chung.
- source_word: δυνατὸς
  choice: có khả năng
  rationale: Diễn đạt trực tiếp năng lực tự chủ được nói đến.
- source_word: χαλιναγωγῆσαι
  choice: tra hàm thiếc vào
  rationale: Giữ cụ thể hình ảnh điều khiển ngựa bằng hàm thiếc, chuẩn bị cho phép so sánh ở các câu tiếp theo; tránh làm phẳng thành “kiểm soát”.
- source_word: καὶ
  choice: cũng
  rationale: 'Giữ ý bổ sung: người kiểm soát được lời nói cũng có khả năng chế ngự toàn thân.'
theological_decisions:
- issue: Ý nghĩa của τέλειος trong văn mạch đạo đức
  choice: trưởng thành
  alternative: hoàn hảo; trọn vẹn
  rationale: Cách dịch “trưởng thành” phù hợp với tiến trình hình thành nhân cách trong thư Gia-cơ và tránh hàm ý vô tội tuyệt đối, nhất là khi ngay trước đó câu này khẳng định mọi người đều vấp phạm. Chú thích vẫn bảo lưu các nghĩa khả hữu của từ Hy Lạp.
- issue: Lực đại diện của danh từ giống đực ἀνήρ
  choice: một người
  alternative: một người nam
  rationale: Điều kiện εἴ τις (“nếu ai”) cho thấy phát biểu có phạm vi tổng quát. Trong tiếng Việt, “một người” truyền đạt tự nhiên lực đại diện ấy mà không thêm giới hạn chỉ dành cho nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vấp phạm” để vừa giữ ẩn dụ vừa làm rõ ý đạo đức; dùng “tra hàm thiếc vào” nhằm duy trì hình ảnh xuyên suốt sang các câu kế tiếp.
