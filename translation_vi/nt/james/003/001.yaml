  to: Anh em của tôi, không nên có nhiều người trong anh em trở thành người dạy dỗ[a], vì biết rằng chúng ta sẽ chịu sự phán xét nghiêm khắc hơn.
  rationale: 'Sửa riêng cấu trúc lời khuyên cho tự nhiên và rõ nghĩa hơn trong tiếng Việt, đồng thời giữ nguyên nội dung: số nhiều người nghe, ý trở thành người dạy dỗ, lý do nêu bằng “vì biết rằng,” và lời cảnh báo ngôi thứ nhất số nhiều. Giữ chú thích để phản ánh phạm vi có thể bao hàm của ἀδελφοί mà không thay thế từ ngữ chính văn.'
