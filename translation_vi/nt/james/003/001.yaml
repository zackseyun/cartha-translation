  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: vi
  text: Anh em của tôi, không nên có nhiều người trong anh em trở thành người dạy dỗ[a], vì biết rằng chúng ta sẽ chịu sự phán xét nghiêm khắc hơn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây có lẽ chỉ toàn thể cộng đồng, bao gồm cả chị em.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ ... γίνεσθε
  choice: đừng có nhiều người trong anh em trở thành
  rationale: Diễn đạt tự nhiên lực ngăn cấm của μή với mệnh lệnh hiện tại γίνεσθε, đồng thời giữ ý bước vào vai trò này.
- source_word: διδάσκαλοι
  choice: người dạy dỗ
  rationale: Chỉ những người đảm nhiệm việc giảng dạy trong cộng đồng, nhưng không áp đặt rằng đây nhất thiết là một chức vụ chính thức.
- source_word: ἀδελφοί μου
  choice: anh em của tôi
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp; chú thích nêu rõ cách xưng hô này có lẽ bao gồm cả chị em trong cộng đồng.
- source_word: εἰδότες
  choice: vì biết rằng
  rationale: Phân từ nêu cơ sở cho lời khuyên. Cách dịch này tự nhiên trong tiếng Việt mà không thêm nội dung ngoài văn cảnh.
- source_word: μεῖζον κρίμα
  choice: sự phán xét nghiêm khắc hơn
  rationale: μεῖζον biểu thị mức độ lớn hơn; khi đi với κρίμα, tiếng Việt tự nhiên diễn đạt là sự phán xét nghiêm khắc hơn, tức mức trách nhiệm nặng hơn.
- source_word: λημψόμεθα
  choice: chúng ta sẽ chịu
  rationale: Trong tiếng Việt, 'chịu sự phán xét' tự nhiên hơn lối dịch sát 'nhận sự phán xét', đồng thời giữ ngôi thứ nhất số nhiều, trong đó tác giả kể cả mình.
theological_decisions:
- issue: Phạm vi của ἀδελφοί μου khi nói với cộng đồng có cả nam và nữ
  choice: Dịch 'anh em của tôi' trong chính văn và giải thích nghĩa bao hàm trong chú thích.
  alternative: anh chị em của tôi
  rationale: Giữ hình thức từ ngữ của bản Hy Lạp, nhưng không che khuất khả năng rất cao rằng lời gọi hướng đến toàn thể cộng đồng, kể cả phụ nữ.
- issue: Sắc thái của κρίμα đối với người dạy dỗ
  choice: sự phán xét
  alternative: sự kết án
  rationale: κρίμα không nhất thiết chỉ sự kết án chung cuộc. 'Sự phán xét' giữ nguyên lời cảnh báo về trách nhiệm cao hơn mà không xác định quá mức hệ quả thần học.
- issue: Ý nghĩa so sánh của μεῖζον
  choice: nghiêm khắc hơn
  alternative: lớn hơn
  rationale: '''Lớn hơn'' gần hình thức từ vựng, nhưng ''phán xét nghiêm khắc hơn'' truyền đạt tự nhiên ý nghĩa của cụm từ trong tiếng Việt mà vẫn giữ sắc thái so sánh.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc mở đầu bằng lời xưng hô giúp câu ngăn cấm rõ ràng; dùng 'người dạy dỗ' để tránh mặc nhiên biến từ này thành tên một chức vụ giáo hội.
