base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: vi
  text: Từ cùng một miệng phát ra lời chúc phước và lời nguyền rủa. Anh em tôi ơi[a], những điều ấy không nên xảy ra như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh chị em tôi ơi”; tiếng Hy Lạp viết là “anh em”, nhưng trong ngữ cảnh, Gia-cơ có lẽ đang nói với toàn thể cộng đồng tín hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: Từ cùng một miệng
  rationale: Giữ nguyên hình ảnh một nguồn phát ra lời nói, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐξέρχεται
  choice: phát ra
  rationale: Phù hợp với lời nói đi ra từ miệng và kết hợp tự nhiên với hai danh ngữ song song theo sau.
- source_word: εὐλογία
  choice: lời chúc phước
  rationale: Trong ngữ cảnh về miệng và lưỡi, từ này chỉ lời nói mang hành vi chúc phước; thêm “lời” làm rõ tính chất phát ngôn mà không làm mất nghĩa trực tiếp.
- source_word: κατάρα
  choice: lời nguyền rủa
  rationale: Diễn đạt hành vi nguyền rủa bằng lời và tạo thế đối xứng tự nhiên với “lời chúc phước”.
- source_word: οὐ χρή
  choice: không nên
  rationale: Truyền đạt sự không thích đáng về mặt đạo đức mà χρή biểu thị, bằng lối nói trang trọng nhưng tự nhiên.
- source_word: ἀδελφοί μου
  choice: anh em của tôi
  rationale: Giữ dạng hô gọi giống đực số nhiều của nguyên văn; chú thích bảo lưu khả năng từ này chỉ toàn thể cộng đồng tin Chúa, gồm cả nam lẫn nữ.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: những điều ấy không nên xảy ra như vậy
  rationale: Giữ số nhiều của ταῦτα và ý nghĩa “như vậy/theo cách ấy” của οὕτως, đồng thời dùng cú pháp tiếng Việt tự nhiên.
theological_decisions:
- issue: Phạm vi giới tính của cách xưng hô ἀδελφοί μου
  choice: anh em của tôi
  alternative: anh chị em của tôi
  rationale: Nguyên văn dùng danh từ giống đực số nhiều, nhưng trong ngữ cảnh Gia-cơ có lẽ đang nói với toàn thể cộng đồng tín hữu. Bản chính giữ hình thức sát nguồn, còn chú thích nêu rõ nghĩa bao gồm có thể có.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Cấu trúc song song “lời chúc phước và lời nguyền rủa” làm nổi bật sự tương phản; cách gọi “Thưa anh em của tôi” giữ sắc thái trực tiếp, tha thiết của lời khuyên răn.
