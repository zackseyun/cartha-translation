  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: cùng một miệng là nguồn của cả lời chúc phước lẫn lời nguyền rủa, và Gia-cơ khẳng định tình trạng ấy là không thích đáng. Tuy nhiên, cách đặt lời xưng hô cần chỉnh để phản ánh trực tiếp và tự nhiên hơn chức năng hô cách của ἀδελφοί μου.'
