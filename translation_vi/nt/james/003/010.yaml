  terminology: “Lời chúc phước” và “lời nguyền rủa” diễn đạt phù hợp εὐλογία và κατάρα trong ngữ cảnh lời nói. Chú thích về khả năng bao hàm cả cộng đồng nam nữ là thích hợp, đồng thời bản chính vẫn bảo lưu hình thức giống đực số nhiều của tiếng Hy Lạp.
  issues:
