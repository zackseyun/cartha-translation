    issue: Cụm “một điều ác không yên” chưa tự nhiên.
    rationale: Dù sát nghĩa theo từng thành tố, “điều ác không yên” không phải kết hợp từ thông dụng trong tiếng Việt hiện đại. “Một điều ác không chịu yên” vẫn giữ tính mô tả và độ mở nghĩa của ἀκατάστατον, nhưng tự nhiên hơn.
  revised_text: Nhưng không ai trong loài người có thể thuần phục cái lưỡi[a]; nó là một điều ác không chịu yên, đầy chất độc chết người.
