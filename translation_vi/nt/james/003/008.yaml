id: JAS.3.8
reference: James 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: vi
  text: Nhưng không ai trong loài người có thể thuần phục cái lưỡi[a]; nó là một điều ác không chịu yên, đầy chất độc chết người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “không ai trong loài người có thể thuần phục cái lưỡi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσαν
  choice: cái lưỡi
  rationale: Giữ hình ảnh bộ phận cơ thể mà Gia-cơ dùng xuyên suốt phân đoạn để chỉ lời nói của con người.
- source_word: οὐδεὶς … ἀνθρώπων
  choice: không một người nào
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý nghĩa phân cách 'không ai trong loài người', không giới hạn vào nam giới.
- source_word: δαμάσαι δύναται
  choice: có thể thuần phục
  rationale: Giữ liên hệ từ vựng với việc thuần phục các loài vật ở câu trước và phản ánh cấu trúc chỉ khả năng.
- source_word: ἀκατάστατον
  choice: không yên
  rationale: Phản ánh sắc thái bất định, không ổn định hoặc không chịu ở yên mà không thu hẹp hẳn về một nghĩa duy nhất như 'ngỗ nghịch'.
- source_word: κακόν
  choice: một điều ác
  rationale: Giữ sức nặng đạo đức của κακόν, đồng thời phù hợp với giống trung của danh từ hóa trong câu Hy Lạp.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: đầy chất độc chết người
  rationale: Cách nói rõ ràng, tự nhiên, giữ nguyên hình ảnh về chất độc có khả năng gây chết.
theological_decisions:
- issue: Phạm vi của οὐδεὶς với ἀνθρώπων
  choice: không một người nào
  alternative: không ai trong loài người
  rationale: Cụm Hy Lạp chỉ không một thành viên nào thuộc nhân loại, chứ không nêu riêng nam giới; bản dịch chính dùng lối nói tự nhiên và chú thích bảo lưu cấu trúc sát chữ.
- issue: Sắc thái của ἀκατάστατον
  choice: không yên
  alternative: bất ổn; ngỗ nghịch
  rationale: Từ này có thể gợi sự bất ổn, không yên hoặc khó kiểm soát. 'Không yên' bảo tồn độ mở ngữ nghĩa và phù hợp với hình ảnh cái lưỡi không thể thuần phục.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thuần phục” để nối trực tiếp với hình ảnh thuần phục loài vật trong ngữ cảnh; dùng “cái lưỡi” thay vì diễn giải thành “lời nói” nhằm giữ nguyên ẩn dụ.
