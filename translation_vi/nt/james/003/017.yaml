id: JAS.3.17
reference: James 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: vi
  text: Nhưng sự khôn ngoan từ trên thì trước hết thanh sạch, rồi yêu chuộng hòa bình, ôn hòa, biết lắng nghe, đầy lòng thương xót và những bông trái tốt lành, không thiên vị[a], không giả hình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “không phân rẽ” hoặc “không do dự, nghi ngờ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: từ trên xuống
  rationale: Giữ hình ảnh không gian của nguyên ngữ và sự tương phản với sự khôn ngoan thuộc đất ở câu 15, không diễn giải cụ thể thành “từ trời”.
- source_word: σοφία
  choice: sự khôn ngoan
  rationale: Cách dịch thông dụng, tự nhiên, chỉ phẩm chất hoặc loại khôn ngoan đang được mô tả.
- source_word: πρῶτον μὲν
  choice: trước hết
  rationale: Thể hiện thứ tự và vị trí ưu tiên của phẩm chất đầu tiên trong danh sách.
- source_word: ἁγνή
  choice: thanh sạch
  rationale: Diễn đạt sự trong sạch về đạo đức và tính không pha tạp; trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἔπειτα
  choice: sau đó
  rationale: Giữ rõ trình tự giữa phẩm chất đầu tiên và các phẩm chất tiếp theo.
- source_word: εἰρηνική
  choice: hòa thuận
  rationale: Diễn tả khuynh hướng tạo dựng và duy trì hòa bình, chứ không chỉ một trạng thái yên tĩnh.
- source_word: ἐπιεικής
  choice: ôn hòa
  rationale: Truyền đạt nét dịu dàng, khoan dung và không khăng khăng đòi quyền lợi; phù hợp tự nhiên với danh sách phẩm chất.
- source_word: εὐπειθής
  choice: sẵn lòng lắng nghe
  rationale: Từ hiếm này chỉ thái độ dễ tiếp nhận lời phải, biết nghe và không cố chấp; cách dịch tránh hàm ý nhẹ dạ hoặc phục tùng mù quáng.
- source_word: μεστὴ ἐλέους
  choice: đầy lòng thương xót
  rationale: Giữ ý phong phú, tràn đầy của μεστή và diễn đạt tự nhiên đối tượng của phẩm chất này trong tiếng Việt.
- source_word: καρπῶν ἀγαθῶν
  choice: những trái tốt lành
  rationale: Giữ số nhiều và hình ảnh “trái” của nguyên ngữ thay vì diễn giải thành việc làm hay kết quả.
- source_word: ἀδιάκριτος
  choice: không thiên vị
  rationale: Phù hợp với mạch đạo đức-xã hội và mối quan tâm của thư Gia-cơ về sự thiên vị; các nghĩa khả dĩ khác được giữ trong chú thích.
- source_word: ἀνυπόκριτος
  choice: không giả hình
  rationale: Dịch trực tiếp ý không đạo đức giả, không đóng kịch; rõ ràng và tự nhiên hơn việc chỉ dùng một từ có thể mơ hồ như “chân thành”.
theological_decisions:
- issue: Cách hiểu ἀδιάκριτος
  choice: không thiên vị
  alternative: không phân rẽ; không do dự hoặc nghi ngờ
  rationale: Từ này có thể liên quan đến việc không phân biệt đối xử, nhưng cũng có thể chỉ sự không phân rẽ hoặc không dao động. Vì thư Gia-cơ đề cập cả thiên vị lẫn lòng phân hai, bản văn chính chọn nghĩa phù hợp nhất với danh sách đạo đức-xã hội, đồng thời chú thích bảo tồn các khả năng khác.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc liệt kê của câu Hy Lạp được giữ lại; dấu phẩy giúp từng phẩm chất rõ ràng. “Sẵn lòng lắng nghe” ưu tiên tính tự nhiên và chiều nghĩa tiếp nhận điều phải hơn một cách dịch máy móc như “dễ thuyết phục.” Dấu chú thích được đặt ngay sau “không thiên vị,” là từ tương ứng với ἀδιάκριτος.
