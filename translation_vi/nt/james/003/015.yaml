revisions:
- from: Sự khôn ngoan ấy không phải từ trên cao mà xuống, nhưng thuộc về đất, thuộc về con người tự nhiên[a], thuộc về ma quỷ.
  to: Sự khôn ngoan ấy không phải là sự khôn ngoan từ trên cao mà xuống, nhưng thuộc trần thế, không thuộc linh[a], thuộc về ma quỷ.
  rationale: Bản sửa hoàn chỉnh cấu trúc cú pháp cho cụm «từ trên cao mà xuống», thay cách diễn đạt không tự nhiên của ἐπίγειος, và dùng «không thuộc linh» cho ψυχική để tránh thêm nghĩa «con người». Chú thích giữ phương án nghĩa tự nhiên và sự đối lập ngữ nghĩa có liên quan. Không thay đổi ý nghĩa hay giải quyết quá mức sắc thái thần học của bản văn.
  reviewer_model: gpt-5.6-terra
