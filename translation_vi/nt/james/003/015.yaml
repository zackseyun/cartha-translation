  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: vi
  text: Sự khôn ngoan ấy không phải là sự khôn ngoan từ trên cao mà xuống, nhưng thuộc trần thế, không thuộc linh[a], thuộc về ma quỷ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thuộc về sự sống tự nhiên.” Tính từ Hy Lạp có thể chỉ điều chỉ thuộc về sự sống tự nhiên, tương phản với điều thuộc linh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Sự khôn ngoan ấy
  rationale: Đại từ chỉ định cùng danh từ xác định hướng về thứ “khôn ngoan” vừa được mô tả trong ngữ cảnh; “ấy” tự nhiên trong tiếng Việt và vẫn giữ được tính quy chiếu trực tiếp.
- source_word: ἄνωθεν
  choice: từ trên cao
  rationale: Giữ nghĩa không gian “từ trên” cùng hàm ý nguồn gốc thần thượng trong thư Gia-cơ, mà không diễn giải thẳng thành “từ trời”.
- source_word: κατερχομένη
  choice: mà xuống
  rationale: Diễn đạt tự nhiên hành động đi xuống của phân từ hiện tại, đồng thời kết hợp trôi chảy với cụm “từ trên cao”.
- source_word: ἐπίγειος
  choice: thuộc về đất
  rationale: Giữ sự đối lập trực tiếp với “từ trên cao”; tránh “thuộc thế gian,” vốn có thể thêm sắc thái đạo đức không nằm ngay trong từ Hy Lạp.
- source_word: ψυχική
  choice: thuộc về con người tự nhiên[a]
  rationale: Diễn tả điều chỉ thuộc bình diện sự sống tự nhiên của con người, đối lập với điều thuộc linh. Chú thích giữ lại phương án dịch ngắn gọn và sắc thái thần học khác có thể có.
- source_word: δαιμονιώδης
  choice: thuộc về ma quỷ
  rationale: Chuyển tải ý điều thuộc về hoặc mang đặc tính của các quỷ; cách nói này rõ ràng, trang trọng và không thu hẹp từ này thành chỉ một nhân vật là Ma Quỷ.
theological_decisions:
- issue: Sắc thái của ψυχική trong thế đối lập giữa tự nhiên và thuộc linh
  choice: thuộc về con người tự nhiên
  alternative: không thuộc linh
  rationale: Cách dịch chính giữ mối liên hệ của từ với sự sống tự nhiên của con người, còn chú thích nêu rõ thế đối lập với điều thuộc Thánh Linh. Như vậy không đồng nhất “tự nhiên” với một hệ thống giáo lý cụ thể, cũng không làm mất sắc thái tiêu cực do chuỗi ba tính từ tạo nên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Ba cụm “thuộc về…” được lặp lại để bảo toàn nhịp liệt kê mạnh của ba tính từ Hy Lạp và sự tăng tiến về mặt đánh giá.
