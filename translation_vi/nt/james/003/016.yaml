id: JAS.3.16
reference: James 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: vi
  text: Vì ở đâu có lòng ghen ghét[a] và tham vọng ích kỷ, ở đó có sự hỗn loạn và mọi việc xấu xa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng đố kỵ”. Từ Hy Lạp này cũng có thể có nghĩa là “lòng nhiệt thành”, nhưng trong ngữ cảnh này rõ ràng mang nghĩa tiêu cực.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch là “mọi hành vi xấu xa” hoặc “mọi điều xấu xa”. Sát nghĩa: “mọi việc xấu xa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ở đâu
  rationale: 'Mở đầu một mệnh đề chỉ nơi chốn mang tính khái quát và phối hợp tự nhiên với ἐκεῖ: “ở đâu… ở đó…”.'
- source_word: γὰρ
  choice: vì
  rationale: Giữ quan hệ giải thích với câu trước.
- source_word: ζῆλος
  choice: lòng ghen ghét
  rationale: Trong mạch văn 3:14–15, từ này mang nghĩa tiêu cực. “Lòng ghen ghét” tự nhiên trong tiếng Việt và diễn đạt thái độ đố kỵ, ganh ghét; chú thích bảo lưu khả năng dịch là “lòng đố kỵ” và nghĩa từ vựng rộng hơn là “lòng nhiệt thành”.
- source_word: ἐριθεία
  choice: tham vọng ích kỷ
  rationale: Diễn đạt sự mưu cầu lợi ích hay địa vị cho bản thân, thường gây tranh giành và bè phái.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Tương ứng trực tiếp với ὅπου, giữ cấu trúc châm ngôn “ở đâu… ở đó…”.
- source_word: ἀκαταστασία
  choice: sự hỗn loạn
  rationale: Chỉ tình trạng rối ren, bất ổn trong cộng đồng, không chỉ là sự bối rối trong tâm trí.
- source_word: πᾶν
  choice: mọi
  rationale: Kết hợp tự nhiên với danh ngữ số ít mang nghĩa khái quát trong tiếng Việt.
- source_word: φαῦλον
  choice: xấu xa
  rationale: Giữ sắc thái đánh giá đạo đức tiêu cực mà không cường điệu quá mức; từ này cũng có thể mang nghĩa hèn hạ hoặc vô giá trị.
- source_word: πρᾶγμα
  choice: việc
  rationale: Từ khái quát chỉ sự việc hoặc hành vi; “mọi việc xấu xa” vừa gần nguyên văn vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái đạo đức của ζῆλος trong ngữ cảnh
  choice: Hiểu theo nghĩa tiêu cực và dịch là “lòng ghen ghét”
  alternative: “lòng đố kỵ”; về mặt từ vựng cũng có thể là “lòng nhiệt thành”
  rationale: Ngữ cảnh trực tiếp ở 3:14–15 mô tả ζῆλος là cay đắng và gắn với tham vọng ích kỷ, nên nghĩa tích cực không phù hợp ở đây. Chú thích vẫn bảo lưu phạm vi nghĩa của từ.
- issue: Mức độ cụ thể của πᾶν φαῦλον πρᾶγμα
  choice: “mọi việc xấu xa”
  alternative: “mọi hành vi xấu xa” hoặc “mọi điều xấu xa”
  rationale: “Việc” giữ được tính rộng của πρᾶγμα, không thu hẹp câu chỉ vào hành vi hay tập quán, đồng thời vẫn truyền đạt sức nặng đạo đức của φαῦλον.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc cân xứng “ở đâu… ở đó…” của nguyên văn và đặt dấu chú thích ngay sau các cụm từ liên quan.
