  terminology: “Cây vả,” “quả ô-liu,” “cây nho,” “quả vả,” “nước mặn,” và “nước ngọt” đều phù hợp với cách dùng tiếng Việt hiện đại. Ghi chú về khả năng bao hàm cả nam lẫn nữ và về mệnh đề tỉnh lược là thích đáng.
