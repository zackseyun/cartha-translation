  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tu từ phủ định của μὴ δύναται, phân biệt đúng cây vả/cây nho và quả ô-liu/quả vả, đồng thời giữ cách hiểu thận trọng của mệnh đề tỉnh lược οὔτε ἁλυκὸν … ὕδωρ. “Nước mặn ... nước ngọt” là cách giải nghĩa hợp lý và không áp đặt cách hiểu “nguồn nước” vào bản văn chính.
