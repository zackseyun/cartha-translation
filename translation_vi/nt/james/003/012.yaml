  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: vi
  text: Anh em tôi[a], cây vả có thể cho ra quả ô-liu, hay cây nho cho ra quả vả sao? Nước mặn cũng không thể tạo ra nước ngọt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh chị em tôi.” Tiếng Hy Lạp dùng hình thức số nhiều giống đực “anh em”, nhưng hình thức này có thể dùng để gọi một nhóm gồm cả nam lẫn nữ.'
    reason: lexical_alternative
  - marker: b
    text: 'Mệnh đề cuối được diễn đạt tỉnh lược trong tiếng Hy Lạp. Theo hình ảnh nguồn nước ở câu trước, cũng có thể hiểu: “Một nguồn nước mặn cũng không thể tạo ra nước ngọt.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: anh em của tôi
  rationale: Giữ hình thức hô cách số nhiều giống đực của nguyên văn; trong ngữ cảnh, cách gọi này có thể hướng đến toàn thể cộng đồng, nên ghi chú phương án bao hàm giới.
- source_word: μὴ δύναται
  choice: có thể ... được sao?
  rationale: μή mở đầu câu hỏi tu từ, hàm ý câu trả lời phủ định; cấu trúc tiếng Việt này diễn đạt tự nhiên sự bất khả.
- source_word: συκῆ
  choice: cây vả
  rationale: Danh từ chỉ cây, không phải quả; “cây vả” là cách gọi rõ và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: ἐλαίας ποιῆσαι
  choice: sinh ra quả ô-liu
  rationale: ποιέω ở đây mang nghĩa sinh hoặc cho ra trái; “sinh ra” tự nhiên đối với cây và tránh nghĩa máy móc của “làm ra”.
- source_word: ἄμπελος
  choice: cây nho
  rationale: Chỉ dây/cây nho; “cây nho” là cách nói thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: σῦκα
  choice: quả vả
  rationale: Dịch trực tiếp danh từ số nhiều chỉ trái của cây vả; tiếng Việt không bắt buộc biểu thị số nhiều tại đây.
- source_word: οὔτε ἁλυκὸν
  choice: Nước mặn cũng không thể
  rationale: Cụm Hy Lạp tỉnh lược, với tính từ ἁλυκόν được dùng như danh từ. “Nước mặn” bổ sung danh từ theo ὕδωρ và thế đối lập, nhưng không xác định quá mức là một nguồn nước.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: tạo ra nước ngọt
  rationale: γλυκύς theo nghĩa đen là “ngọt”, và khi nói về nước thì đối lập với nước mặn; “nước ngọt” là thuật ngữ tự nhiên, chính xác trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Thưa” để thể hiện hô cách; giữ câu hỏi tu từ của nguyên văn. Chọn “quả ô-liu” và “nước ngọt” theo cách dùng phổ thông của tiếng Việt.
