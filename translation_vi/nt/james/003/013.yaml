source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: vi
  text: Ai là người khôn ngoan và hiểu biết giữa anh em? Người ấy hãy bày tỏ những việc làm của mình qua nếp sống tốt đẹp, với sự nhu mì của sự khôn ngoan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với sự nhu mì đến từ sự khôn ngoan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Ai là người khôn ngoan và hiểu biết giữa anh em?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ; “khôn ngoan” và “hiểu biết” giữ hai phẩm chất phân biệt, còn “giữa anh em” phù hợp cộng đồng độc giả được Gia-cơ trực tiếp xưng hô.
- source_word: δειξάτω
  choice: Người ấy hãy bày tỏ
  rationale: Giữ lực mệnh lệnh ngôi thứ ba số ít mà không buộc tiếng Việt phải dùng đại từ mang giới tính; “người ấy” quy chiếu bất cứ người nào tự nhận có các phẩm chất vừa nêu.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: qua cách ăn ở tốt đẹp
  rationale: ἀναστροφή chỉ nếp sống hay cách cư xử; “cách ăn ở” là lối nói tự nhiên, có sắc thái đạo đức và rộng hơn một hành vi đơn lẻ. “Qua” truyền đạt phương tiện hay nền tảng biểu lộ.
- source_word: τὰ ἔργα αὐτοῦ
  choice: những việc mình làm
  rationale: Truyền đạt rõ nghĩa các công việc hay hành động thuộc về chính người ấy; tự nhiên hơn “các công việc của mình” trong câu tiếng Việt hiện đại.
- source_word: ἐν πραΰτητι σοφίας
  choice: với sự nhu mì của sự khôn ngoan
  rationale: 'Giữ kết cấu cô đọng và độ mở của sở hữu cách σοφίας: sự nhu mì có đặc tính, thuộc về, hoặc phát xuất từ sự khôn ngoan. Chú thích nêu cách hiểu nguồn gốc bằng lời tự nhiên hơn.'
theological_decisions:
- issue: Mệnh lệnh số ít giống đực và phạm vi đại diện
  choice: Người ấy hãy bày tỏ
  alternative: Người đó phải bày tỏ / Người nam ấy hãy bày tỏ
  rationale: Hình thái Hy Lạp là số ít giống đực nhưng trong ngữ cảnh có lực đại diện cho bất cứ thành viên nào đáp ứng mô tả. Tiếng Việt “người ấy” giữ số ít và không thêm giới tính mà ngôn ngữ đích không đòi hỏi.
- issue: Quan hệ của σοφίας với πραΰτητι
  choice: sự nhu mì của sự khôn ngoan
  alternative: sự nhu mì đến từ sự khôn ngoan
  rationale: Nguyên văn cho phép hiểu là phẩm chất được sự khôn ngoan đặc trưng hoặc phát sinh từ sự khôn ngoan. Bản chính giữ sự cô đọng và chú thích cung cấp cách hiểu theo nguồn gốc, tránh quyết định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Cách ăn ở” diễn tả toàn bộ nếp sống đạo đức; “nhu mì” giữ sắc thái đức hạnh là sức mạnh được kiềm chế, không chỉ là mềm mỏng.
