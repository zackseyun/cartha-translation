revisions:
- from: Ai là người khôn ngoan và hiểu biết giữa anh em? Người ấy hãy bày tỏ những việc mình làm qua cách ăn ở tốt đẹp, với sự nhu mì của sự khôn ngoan.[a]
  to: Ai là người khôn ngoan và hiểu biết giữa anh em? Người ấy hãy bày tỏ những việc làm của mình qua nếp sống tốt đẹp, với sự nhu mì của sự khôn ngoan.[a]
  rationale: 'Chỉnh nhẹ hai cụm từ để tiếng Việt hiện đại tự nhiên và rõ nghĩa hơn: “nếp sống” diễn tả tốt ἀναστροφή; “những việc làm của mình” giữ rõ danh từ ἔργα và sở hữu cách αὐτοῦ. Giữ nguyên “sự nhu mì của sự khôn ngoan” trong bản chính để bảo toàn độ mở của sở hữu cách σοφίας; chú thích nêu cách hiểu theo quan hệ nguồn gốc.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:47Z'
