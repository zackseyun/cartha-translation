  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: vi
  text: Nếu chúng ta đặt hàm thiếc vào miệng ngựa để chúng vâng lời chúng ta[a], thì chúng ta cũng điều khiển cả thân thể chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dây cương”, nhưng ở đây từ này chỉ chính xác hơn hàm thiếc được đặt trong miệng ngựa.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nếu ... thì
  rationale: Giữ lực điều kiện của εἰ; sắc thái nối tiếp nhẹ của δέ được diễn đạt tự nhiên qua cấu trúc điều kiện tiếng Việt, không thêm từ chỉ thời gian.
- source_word: χαλινοὺς
  choice: hàm thiếc
  rationale: Trong ngữ cảnh vật được đặt vào miệng ngựa, từ này chỉ chính xác bộ phận kim loại nằm trong miệng để điều khiển ngựa, hơn là toàn bộ dây cương.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: chúng ta đặt ... vào miệng
  rationale: Diễn đạt tự nhiên chuyển động vào trong do εἰς kết hợp với βάλλομεν; tiếng Việt dùng danh từ tập hợp số ít 'miệng ngựa'.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: để chúng vâng theo mình
  rationale: Giữ ý mục đích của cấu trúc εἰς với động từ nguyên mẫu có mạo từ và nghĩa 'vâng theo' của πείθεσθαι với tặng cách; 'mình' quy chiếu tự nhiên về chủ thể 'chúng ta'.
- source_word: καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: thì chúng ta cũng điều khiển được cả thân thể chúng
  rationale: μετάγομεν nói đến việc hướng hoặc chuyển toàn thân con vật; 'điều khiển được' phù hợp hình ảnh cưỡi ngựa, còn 'cả thân thể chúng' giữ sức nhấn của ὅλον.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hàm thiếc” là thuật ngữ tiếng Việt chính xác cho bit của ngựa; chú thích cung cấp cách dịch rộng hơn “dây cương”. Cấu trúc “Nếu ... thì ... cũng” làm rõ quan hệ điều kiện và kết quả mà không làm mất sắc thái của nguyên văn.
