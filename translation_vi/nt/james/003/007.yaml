id: JAS.3.7
reference: James 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: vi
  text: Vì mọi loài thú hoang, chim trời, loài bò sát và sinh vật biển đều đang được loài người thuần phục và đã được thuần phục[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi bản tính con người” hoặc “bởi giới con người.” Cụm từ Hy Lạp τῇ φύσει τῇ ἀνθρωπίνῃ có thể chỉ chung loài người hoặc, theo nghĩa trừu tượng hơn, bản tính hay phạm vi con người; chính văn hiểu theo nghĩa tập thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: mọi loài
  rationale: Trong danh sách các nhóm động vật, φύσις mang nghĩa thành ngữ là “loài” hay “chủng loại”; “mọi loài” diễn đạt tự nhiên sức phân phối của πᾶσα.
- source_word: γὰρ
  choice: Vì
  rationale: Từ này nối câu với lời giải thích ở trước và giữ rõ quan hệ lập luận.
- source_word: θηρίων
  choice: thú hoang
  rationale: θηρίον thường chỉ thú vật, nhất là thú hoang; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: πετεινῶν
  choice: chim trời
  rationale: Từ này chỉ chim hay sinh vật bay; “chim trời” là cách gọi tự nhiên, trang trọng vừa phải trong một danh sách các loài.
- source_word: ἑρπετῶν
  choice: loài bò sát
  rationale: Từ này có thể chỉ rộng các vật bò sát hoặc bò trườn; “loài bò sát” là thuật ngữ hiện đại dễ hiểu và phù hợp văn cảnh.
- source_word: ἐναλίων
  choice: sinh vật biển
  rationale: Dạng danh từ hóa này chỉ những sinh vật sống trong biển; lựa chọn này đủ rộng để giữ phạm vi của tiếng Hy Lạp.
- source_word: δαμάζεται
  choice: đều đang được ... thuần phục
  rationale: Thì hiện tại bị động diễn tả tiến trình đang diễn ra hoặc chân lý khái quát; “đang được” giữ nét thể này.
- source_word: δεδάμασται
  choice: đã được thuần phục
  rationale: Thì hoàn thành bị động nhấn mạnh hành động đã xảy ra cùng trạng thái kết quả; dịch riêng biệt để giữ phép nhấn đôi của Gia-cơ.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: được loài người thuần phục
  rationale: Cụm từ có thể được hiểu theo nghĩa tập thể là nhân loại, đồng thời cũng có khả năng mang nghĩa trừu tượng hơn là bản tính hoặc giới con người; chính văn chọn nghĩa tập thể tự nhiên trong ngữ cảnh tác nhân thuần phục.
theological_decisions:
- issue: Cách hiểu τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: loài người, hiểu theo nghĩa tập thể
  alternative: bản tính con người hoặc giới con người
  rationale: Ngữ cảnh và thể bị động thuận với cách hiểu nhân loại là tác nhân, nhưng tiếng Hy Lạp vẫn cho phép sắc thái trừu tượng hơn nên được ghi nhận trong chú thích thay vì xóa bỏ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ hai dạng động từ “đang được… và đã được…” để phản ánh sự tương phản giữa hiện tại bị động và hoàn thành bị động trong nguyên văn; đặt dấu chú thích ngay sau toàn bộ mệnh đề mà chú thích liên quan.
