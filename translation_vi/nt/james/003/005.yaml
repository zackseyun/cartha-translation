  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. “Bộ phận” được ưu tiên hơn “chi thể” để người đọc phổ thông dễ hiểu; cấu trúc cảm thán “lớn biết bao” bảo tồn sức gợi của câu Hy Lạp.
