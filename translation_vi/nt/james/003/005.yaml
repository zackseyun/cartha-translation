base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: vi
  text: Cũng vậy, lưỡi là một bộ phận nhỏ, nhưng lại khoe khoang những điều lớn lao. Hãy xem, một ngọn lửa nhỏ đốt cháy một khu rừng lớn dường nào![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy xem, ngọn lửa lớn dường nào đốt cháy một khu rừng lớn dường nào!” Cách diễn đạt Hy Lạp có thể được hiểu theo nghĩa cảm thán; bản dịch chính theo ý một nguyên nhân nhỏ gây nên hậu quả lớn, phù hợp với hình ảnh cái lưỡi là một bộ phận nhỏ. Từ được dịch là “khu rừng” cũng có thể chỉ gỗ hoặc vật liệu dễ cháy.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: lưỡi
  rationale: Giữ nguyên hình ảnh cụ thể về bộ phận cơ thể và mối liên hệ với μέλος; dịch là “lời nói” sẽ giải thích ẩn dụ thay vì chuyển dịch nó.
- source_word: μικρὸν μέλος
  choice: một bộ phận nhỏ
  rationale: Tự nhiên và rõ ràng trong tiếng Việt hiện đại, đồng thời vẫn giữ hình ảnh thân thể; “chi thể nhỏ” trang trọng nhưng kém thông dụng.
- source_word: μεγάλα αὐχεῖ
  choice: khoe khoang những điều lớn lao
  rationale: Diễn đạt ý nói lời kiêu hãnh hoặc tự phụ về những chuyện lớn, đồng thời không thu hẹp nghĩa thành chỉ “nói những lời lớn lối”.
- source_word: Ἰδοὺ
  choice: Hãy xem
  rationale: Giữ chức năng thu hút sự chú ý đến hình ảnh minh họa bằng lối nói tự nhiên, trang trọng vừa phải.
- source_word: ἡλίκον πῦρ
  choice: một ngọn lửa nhỏ
  rationale: Theo mạch so sánh, một nguyên nhân nhỏ gây hậu quả lớn tương ứng với cái lưỡi là bộ phận nhỏ; tuy nhiên, dạng từ Hy Lạp cũng cho phép cách hiểu cảm thán “ngọn lửa lớn biết bao”.
- source_word: ἡλίκην ὕλην
  choice: cả một khu rừng lớn biết bao
  rationale: ὕλη có thể chỉ rừng, gỗ hoặc vật liệu dễ cháy; “khu rừng” truyền đạt hình ảnh tự nhiên nhất trong tiếng Việt, còn “lớn biết bao” giữ sắc thái cảm thán của ἡλίκην.
- source_word: ἀνάπτει
  choice: đốt cháy
  rationale: Cách nói hiện đại, rõ và sống động cho hành động làm bùng cháy một khu rừng.
theological_decisions: []
