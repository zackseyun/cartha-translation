  - severity: low
    issue: Cụm “cả một khu rừng lớn biết bao” hơi nặng
    rationale: “Cả một” làm tăng cường thêm ngoài cấu trúc nguồn; “một khu rừng lớn dường nào” bảo tồn rõ hơn sắc thái cảm thán của ἡλίκην và đọc mạch lạc hơn.
