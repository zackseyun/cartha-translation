  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: vi
  text: Chẳng lẽ một mạch suối lại phun ra cả nước ngọt lẫn nước đắng từ cùng một cửa sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “Chẳng lẽ mạch suối phun ra từ cùng một cửa cả điều ngọt lẫn điều đắng sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτι
  choice: Có phải ... không?
  rationale: Cấu trúc nghi vấn này tự nhiên trong tiếng Việt và vẫn truyền đạt câu hỏi tu từ mong đợi câu trả lời phủ định.
- source_word: ἡ πηγή
  choice: mạch suối
  rationale: Chỉ nguồn nước tự nhiên; “mạch suối” hợp với hình ảnh nước phun ra từ một cửa và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: từ cùng một cửa
  rationale: ὀπή là lỗ hoặc chỗ mở; “cửa” diễn đạt tự nhiên cửa thoát nước của mạch suối mà không thêm ẩn dụ “miệng”.
- source_word: βρύει
  choice: phun ra
  rationale: Diễn tả nước tuôn hoặc trào mạnh từ nguồn, gần với sắc thái của βρύω.
- source_word: τὸ γλυκύ
  choice: nước ngọt
  rationale: Tính từ được dùng như danh từ; thêm “nước” làm rõ đối tượng được ngầm hiểu, còn “ngọt” giữ nguyên sự đối lập trực tiếp với “đắng”.
- source_word: τὸ πικρόν
  choice: nước đắng
  rationale: Tính từ được dùng như danh từ; thêm “nước” cho câu rõ và cân xứng với “nước ngọt”.
theological_decisions: []
