  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ giữ kỳ vọng về câu trả lời phủ định; “cả… lẫn…” bảo toàn sự đặt song song hai phẩm chất đối nghịch.
