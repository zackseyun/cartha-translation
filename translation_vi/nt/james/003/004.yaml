base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: vi
  text: 'Hãy xem cả những con tàu: dù chúng rất lớn và bị gió mạnh[a] đẩy đi, chúng vẫn được điều khiển bằng một bánh lái rất nhỏ, đến bất cứ nơi nào ý hướng của người cầm lái muốn hướng đến.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “gió khắc nghiệt” hoặc “gió dữ dội.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Hãy xem cả những con tàu
  rationale: Dùng lời kêu gọi chú ý tự nhiên trong tiếng Việt và giữ chức năng nối tiếp ví dụ ở câu trước.
- source_word: τηλικαῦτα ὄντα
  choice: dù chúng rất lớn
  rationale: Diễn đạt kích thước đáng kể cùng sắc thái nhượng bộ do sự tương phản với bánh lái rất nhỏ.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: bị gió mạnh đẩy đi
  rationale: Giữ thể bị động; “gió mạnh” là cách kết hợp tự nhiên cho ἀνέμων σκληρῶν trong tiếng Việt.
- source_word: μετάγεται
  choice: được điều khiển
  rationale: Trong ngữ cảnh hàng hải, từ này chỉ việc con tàu được đổi hướng hoặc dẫn hướng; cách dịch này rõ nghĩa và phù hợp với bánh lái.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: bằng một bánh lái rất nhỏ
  rationale: “Rất nhỏ” truyền đạt giá trị nhấn mạnh của dạng so sánh cao nhất mà không hàm ý đó là bánh lái nhỏ nhất tuyệt đối.
- source_word: ὅπου
  choice: đến bất cứ nơi nào
  rationale: Làm rõ ý nghĩa chỉ đích đến mang tính khái quát trong mệnh đề.
- source_word: ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: ý muốn của người cầm lái hướng tới
  rationale: Giữ cả yếu tố khuynh hướng/chủ ý và ý chí trong câu Hy Lạp, đồng thời tránh lối nói gượng như “xung lực ... muốn”; “người cầm lái” diễn đạt tự nhiên phân từ chỉ người điều khiển hướng đi.
theological_decisions:
- issue: Mức độ sát chữ trong mệnh đề về ý hướng của người cầm lái
  choice: ý muốn của người cầm lái hướng tới
  alternative: nơi người cầm lái muốn đi
  rationale: Cách chọn giữ được cấu trúc danh từ ὁρμή và sắc thái chủ ý của βούλεται mà vẫn tự nhiên trong tiếng Việt; không áp đặt một cách giải thích thần học lên hình ảnh minh họa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “con tàu”, “bánh lái”, “người cầm lái” để duy trì nhất quán hình ảnh hàng hải; giữ sự tương phản giữa tàu rất lớn và bánh lái rất nhỏ.
