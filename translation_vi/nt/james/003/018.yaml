  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: vi
  text: Và hoa trái của sự công chính được những người đem lại hòa bình gieo trong hòa bình[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hoa trái của công lý”. Từ Hy Lạp có thể bao hàm cả sự ngay thẳng về đạo đức lẫn lẽ công bằng trong các mối quan hệ và pháp lý.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cho những người đem lại hòa bình”. Cụm từ ở cách dữ trong tiếng Hy Lạp có thể được hiểu theo nhiều cách, dù cách hiểu “bởi những người đem lại hòa bình” phù hợp hơn với động từ bị động ở đây.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: hoa trái
  rationale: Giữ nguyên hình ảnh ẩn dụ của danh từ số ít; “hoa trái” tự nhiên và trang trọng trong tiếng Việt hơn “vụ mùa” ở đây.
- source_word: δὲ
  choice: Và
  rationale: Diễn tả liên kết nhẹ với câu trước, không biến δέ thành một nét tương phản mạnh.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Giữ phạm vi nghĩa về phẩm chất và hành vi đúng đắn; sắc thái công lý vẫn có thể hiện diện và được nêu trong chú thích.
- source_word: ἐν εἰρήνῃ
  choice: trong bình an
  rationale: Bám sát cấu trúc Hy Lạp và giữ mở khả năng chỉ cách thức hoặc môi trường của việc gieo.
- source_word: σπείρεται
  choice: được gieo
  rationale: Phản ánh thể bị động hiện tại một cách tự nhiên trong tiếng Việt.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: bởi những người kiến tạo hòa bình
  rationale: Hiểu cách dữ cách như tác nhân của động từ bị động; “kiến tạo hòa bình” diễn đạt tự nhiên hành động chủ động làm nên hòa bình mà không thu hẹp thành một danh hiệu.
theological_decisions:
- issue: Ý nghĩa của “hoa trái của sự công chính”
  choice: Giữ nguyên kết cấu sở hữu để chỉ hoa trái mang đặc tính công chính hoặc chính là sự công chính.
  alternative: Hoa trái sinh ra sự công chính.
  rationale: Cách dùng sở hữu cách δικαιοσύνης có thể được hiểu theo hơn một quan hệ; bản dịch không quyết định quá mức bản chất chính xác của quan hệ ấy.
- issue: Vai trò của τοῖς ποιοῦσιν εἰρήνην
  choice: Những người kiến tạo hòa bình là tác nhân gieo hoa trái.
  alternative: Hoa trái được gieo cho những người kiến tạo hòa bình.
  rationale: Với động từ bị động σπείρεται, cách hiểu tác nhân phù hợp hơn trong ngữ cảnh, nhưng cách hiểu chỉ người tiếp nhận vẫn khả hữu nên được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hoa trái”, “sự công chính”, “bình an” để duy trì sắc thái Kinh Thánh quen thuộc; dùng “kiến tạo hòa bình” để diễn đạt hành động chủ động và tránh lối nói gượng “làm hòa bình”.
