revisions:
- from: Và hoa trái của sự công chính được gieo trong bình an bởi những người kiến tạo hòa bình[a][b].
  to: Và hoa trái của sự công chính được những người đem lại hòa bình gieo trong hòa bình[a][b].
  rationale: Bản sửa thay “bình an” bằng “hòa bình” để phản ánh rõ hơn ý nghĩa quan hệ của εἰρήνη trong ngữ cảnh, điều chỉnh trật tự từ cho tiếng Việt tự nhiên, và thay cụm có sắc thái hành chính “kiến tạo hòa bình” bằng “đem lại hòa bình”. Câu vẫn giữ hình ảnh gieo trồng, thể bị động, và sự mơ hồ có thật của cách dữ được nêu ở chú thích.
  reviewer_model: gpt-5.6-terra
