id: JAS.3.9
reference: James 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: vi
  text: Bằng lưỡi ấy, chúng ta chúc tụng Chúa và Cha[a]; cũng bằng lưỡi ấy, chúng ta nguyền rủa những con người được tạo nên theo sự giống Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “Chúa và Cha”; cụm từ này có thể được hiểu theo nghĩa đồng vị là “Chúa, tức là Cha” hoặc là hai danh xưng phối hợp dành cho Đức Chúa Trời.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: bằng lưỡi ấy
  rationale: Đại từ giống cái chỉ lại “cái lưỡi” trong ngữ cảnh trước; nêu rõ danh từ giúp câu tiếng Việt tự nhiên, còn “bằng” diễn đạt phương tiện.
- source_word: εὐλογοῦμεν
  choice: chúng ta chúc tụng
  rationale: “Chúc tụng” giữ sắc thái của εὐλογέω khi đối tượng là Đức Chúa Trời và tạo thế đối lập rõ với “nguyền rủa”.
- source_word: τὸν κύριον καὶ πατέρα
  choice: Chúa là Cha
  rationale: 'Diễn đạt tự nhiên cách hiểu đồng vị có khả năng cao: cùng một Đấng vừa là Chúa vừa là Cha; chú thích bảo lưu khả năng dịch sát cấu trúc liên từ.'
- source_word: καταρώμεθα
  choice: chúng ta nguyền rủa
  rationale: Tương đương trực tiếp, tự nhiên và giữ nguyên sức nặng đạo đức trong thế đối lập với “chúc tụng”.
- source_word: τοὺς ἀνθρώπους
  choice: những con người
  rationale: Chỉ loài người nói chung, không giới hạn ở nam giới; “con người” cũng liên kết tự nhiên với ý niệm mang hình giống Đức Chúa Trời.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: giống như Đức Chúa Trời
  rationale: Cách nói tiếng Việt rõ và tự nhiên, chuyển tải quan hệ tương đồng mà không hàm ý con người đồng nhất với Đức Chúa Trời.
- source_word: γεγονότας
  choice: được dựng nên
  rationale: Trong tiếng Việt, cụm này diễn đạt trạng thái có được do hành động sáng tạo ngầm hiểu của Đức Chúa Trời và làm rõ tiếng vọng của trình thuật sáng tạo.
theological_decisions:
- issue: Quan hệ giữa κύριον và πατέρα
  choice: Chúa là Cha
  alternative: Chúa và Cha
  rationale: Cách dịch chính đọc hai danh xưng theo quan hệ đồng vị, phù hợp với một mạo từ chung; tuy nhiên, nguyên văn có καί nên chú thích giữ lại cách dịch hình thức hơn, tránh xóa bỏ sự mơ hồ cú pháp.
- issue: Phạm vi của ἀνθρώπους
  choice: những con người
  alternative: người ta; loài người
  rationale: Danh từ Hy Lạp ở đây nói chung về nhân loại, những người mang hình giống Đức Chúa Trời, chứ không riêng nam giới.
- issue: Ý nghĩa của γεγονότας trong liên hệ sáng tạo
  choice: được dựng nên
  alternative: đã trở nên
  rationale: Ngữ cảnh “giống như Đức Chúa Trời” gợi rõ ngôn ngữ sáng tạo; cách dịch này biểu đạt tác nhân thần linh ngầm hiểu nhưng không thêm chi tiết ngoài văn bản.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại “bằng lưỡi ấy” để tái hiện phép đối xứng của nguyên văn và nhấn mạnh nghịch lý: cùng một công cụ vừa chúc tụng Đức Chúa Trời vừa nguyền rủa con người.'
