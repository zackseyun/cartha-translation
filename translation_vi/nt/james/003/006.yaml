  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: vi
  text: Và lưỡi là một ngọn lửa. Lưỡi, một thế giới của sự bất chính, được đặt giữa các chi thể của chúng ta; nó làm ô uế[a] cả thân thể, đốt cháy bánh xe của sự sinh thành[b], và chính nó bị Ghê-hen-na[c] đốt cháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm hoen ố cả thân thể.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hy Lạp này sát nghĩa là “bánh xe của sự sinh thành”; cũng có thể hiểu là “vòng đời” hoặc “tiến trình cuộc đời.”
    reason: lexical_alternative
  - marker: c
    text: Ghê-hen-na là thuật ngữ Hy Lạp trong bản văn; theo truyền thống thường được dịch là “hỏa ngục” hoặc “địa ngục.”
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: cái lưỡi
  rationale: Giữ hình ảnh bộ phận cơ thể xuyên suốt ngữ cảnh, đồng thời để nghĩa hoán dụ về lời nói tự nhiên được hàm ý.
- source_word: πῦρ
  choice: một ngọn lửa
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ nguyên ẩn dụ về sức tàn phá.
- source_word: ὁ κόσμος τῆς ἀδικίας
  choice: một thế giới của sự bất chính
  rationale: Giữ hình ảnh mạnh và lạ của nguyên văn, không giản lược thành “đầy điều ác”; “sự bất chính” bao quát phương diện đạo đức của ἀδικία.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: được đặt giữa các chi thể của chúng ta
  rationale: Giữ sắc thái bị động và vị trí của cái lưỡi trong số các bộ phận của thân thể.
- source_word: σπιλοῦσα
  choice: làm ô uế
  rationale: Truyền đạt sự làm bẩn cả theo hình ảnh lẫn nghĩa đạo đức; chú thích lưu lại cách dịch cụ thể hơn là “làm hoen ố”.
- source_word: ὅλον τὸ σῶμα
  choice: cả thân thể
  rationale: Giữ trọn lực nhấn mạnh của ὅλον bằng cách diễn đạt tự nhiên.
- source_word: φλογίζουσα
  choice: đốt cháy
  rationale: Duy trì chuỗi hình ảnh về lửa và hành động gây cháy.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: bánh xe của đời người
  rationale: Giữ ẩn dụ “bánh xe” của τροχός nhưng diễn đạt γένεσις theo nghĩa đời sống phát sinh và tiếp diễn; chú thích bảo tồn các khả năng “bánh xe của sự sinh thành” và “vòng đời”.
- source_word: φλογιζομένη
  choice: chính nó bị ... đốt cháy
  rationale: Giữ thể bị động và làm rõ rằng cái lưỡi gây cháy nhưng bản thân nó cũng được một nguồn khác châm lửa.
- source_word: ὑπὸ τῆς γεέννης
  choice: bị Ghê-hen-na đốt cháy
  rationale: Phiên âm thuật ngữ cụ thể của nguyên văn thay vì đồng nhất ngay với một thuật ngữ thần học rộng hơn; cách dịch truyền thống được nêu trong chú thích.
theological_decisions:
- issue: Cách dịch γέεννα
  choice: Ghê-hen-na
  alternative: hỏa ngục / địa ngục
  rationale: Giữ danh xưng lịch sử-cụ thể của tiếng Hy Lạp và tránh đưa thêm các liên tưởng hệ thống về đời sau mà câu không giải thích; chú thích cung cấp cách gọi truyền thống.
- issue: Ý nghĩa của τὸν τροχὸν τῆς γενέσεως
  choice: bánh xe của đời người
  alternative: vòng đời / tiến trình cuộc đời / bánh xe của sự sinh thành
  rationale: Giữ sự căng thẳng và nét lạ của ẩn dụ “bánh xe”, đồng thời dùng “đời người” để câu tiếng Việt có thể hiểu được mà không quyết định quá hẹp ý nghĩa của γένεσις.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc dùng dấu chấm phẩy để làm rõ quan hệ giữa mệnh đề chính và ba phân từ mà không xóa đi mật độ tu từ của nguyên văn. Các thuật ngữ “chi thể”, “bất chính” và “Ghê-hen-na” được chọn vì độ chính xác; chú thích hỗ trợ những chỗ có thể khó với độc giả phổ thông.
