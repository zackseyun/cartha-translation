id: JAS.1.25
reference: James 1:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: vi
  text: Nhưng người chăm chú nhìn vào luật pháp trọn vẹn, tức luật pháp của sự tự do,[a] và kiên trì trong đó—không trở thành người nghe mà quên[b] nhưng là người thực hành[c]—thì người ấy sẽ có phước trong việc mình làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “luật pháp trọn vẹn của sự tự do.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “người nghe của sự quên lãng”; cũng có thể dịch: “người nghe hay quên.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “người làm việc/hành động”; theo lối diễn đạt tự nhiên hơn: “người thực hành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: chăm chú nhìn vào
  rationale: Động từ gợi hình ảnh cúi xuống để nhìn kỹ, chứ không chỉ liếc qua. Cách dịch này giữ ý xem xét cẩn thận mà vẫn tự nhiên trong tiếng Việt.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: luật pháp trọn vẹn, tức luật pháp của sự tự do
  rationale: Cấu trúc đồng vị được thể hiện bằng “tức”, còn “của sự tự do” giữ nguyên quan hệ sở hữu rộng nghĩa mà không diễn giải thành “ban sự tự do”.
- source_word: παραμείνας
  choice: kiên trì trong đó
  rationale: Diễn tả việc tiếp tục gắn bó bền bỉ với luật pháp vừa được nhắc đến, thay vì chỉ nhìn vào trong chốc lát.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: không trở thành người nghe mà quên
  rationale: Chuyển ngữ tự nhiên cấu trúc sở hữu “người nghe của sự quên lãng”, đồng thời giữ động từ γενόμενος là “trở thành”.
- source_word: ποιητὴς ἔργου
  choice: người thực hiện việc làm
  rationale: Giữ rõ danh từ ἔργον (“việc làm, hành động”) và sự đối lập giữa người nghe với người thực hiện. Cụm từ hơi khác thường trong tiếng Việt, tương ứng với cách diễn đạt khác thường của tiếng Hy Lạp.
- source_word: μακάριος
  choice: có phước
  rationale: Cách nói quen thuộc, trang trọng trong văn phong Kinh Thánh, diễn đạt tình trạng được Đức Chúa Trời ban ơn hơn là chỉ có cảm xúc vui vẻ.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: trong việc mình làm
  rationale: Giữ mối liên hệ từ vựng với “người thực hiện” và nhấn mạnh sự vâng phục được thể hiện bằng hành động.
- source_word: ὁ ... οὗτος
  choice: người ... thì người ấy
  rationale: Giữ cấu trúc số ít mang tính đại diện nhưng không giới hạn đối tượng vào nam giới.
theological_decisions:
- issue: Ý nghĩa của “luật pháp của sự tự do”
  choice: Giữ nguyên “luật pháp của sự tự do” mà không xác định cụm từ chỉ Tin Lành, luật đạo đức hay toàn bộ sự chỉ dạy mặc khải của Đức Chúa Trời.
  alternative: luật pháp đem lại sự tự do
  rationale: Nguyên văn không buộc phải giải thích sự tự do là kết quả do luật pháp ban cho; cách dịch được chọn bảo toàn độ mở và sức căng thần học của cụm từ.
- issue: Phạm vi giới tính của dạng giống đực số ít
  choice: Dùng “người ... người ấy” theo nghĩa đại diện, bao gồm mọi người.
  alternative: người đàn ông ấy
  rationale: Giống đực trong ngữ cảnh này có chức năng khái quát, không nhằm giới hạn lời dạy vào nam giới.
- issue: Mối liên hệ giữa nghe và làm
  choice: Giữ đối lập trực tiếp giữa “người nghe mà quên” và “người thực hiện việc làm”.
  alternative: người nghe lời nhưng quên và người làm theo lời
  rationale: Nguyên văn câu này dùng ἔργον (“việc làm”), không dùng “lời”; vì vậy không bổ sung đối tượng “lời” từ văn cảnh để tránh làm mất nét nhấn riêng của câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc đối chiếu và nhịp lập luận của nguyên văn. “Luật pháp” và “có phước” duy trì sắc thái Kinh Thánh quen thuộc; các chú thích ghi nhận những cách diễn đạt sát chữ hoặc tự nhiên hơn mà không áp đặt cách giải thích thần học.
