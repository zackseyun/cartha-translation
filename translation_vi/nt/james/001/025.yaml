  to: Nhưng người chăm chú nhìn vào luật pháp trọn vẹn, tức luật pháp của sự tự do,[a] và kiên trì trong đó—không trở thành người nghe mà quên[b] nhưng là người thực hành[c]—thì người ấy sẽ có phước trong việc mình làm.
  rationale: Chỉ sửa cụm “người thực hiện việc làm” thành “người thực hành” để tiếng Việt tự nhiên và mạch đối chiếu nghe–làm rõ hơn. Chú thích c được điều chỉnh để vẫn phản ánh rõ ἔργου (“việc, hành động”), không thêm đối tượng “lời” và không thay đổi ý nghĩa câu.
