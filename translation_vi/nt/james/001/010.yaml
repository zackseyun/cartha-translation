  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: vi
  text: Còn người giàu thì hãy tự hào[a] trong cảnh bị hạ thấp của mình, vì người ấy sẽ qua đi như hoa cỏ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn lược động từ, và động từ “hãy tự hào” được hiểu từ câu trước: “Còn người giàu thì hãy tự hào trong cảnh bị hạ thấp của mình.”'
    reason: alternative_reading
  - marker: b
    text: Nguyên văn là “hoa của cỏ,” một hình ảnh nhấn mạnh rằng người giàu chóng qua như cây cỏ đang nở hoa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: còn người giàu thì
  rationale: δέ nối câu này với lời khuyên ở câu trước đồng thời tạo thế đối chiếu giữa người anh em có địa vị thấp và người giàu. “Người giàu” diễn đạt tự nhiên danh từ hóa πλούσιος mà không biến nó thành một khái niệm trừu tượng.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: trong cảnh mình bị hạ xuống
  rationale: ταπείνωσις ở đây chỉ tình trạng bị hạ thấp hoặc mất địa vị, chứ không chủ yếu nói đến đức tính khiêm nhường. Cách dịch này giữ sắc thái bị đưa xuống thấp và liên hệ với sự chóng qua của người giàu.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι đưa ra lý do cho lời khuyên ngầm được tiếp nối từ câu trước; “vì” giữ rõ quan hệ nguyên nhân trong tiếng Việt hiện đại.
- source_word: ὡς ἄνθος χόρτου
  choice: như hoa cỏ
  rationale: “Hoa cỏ” là hình ảnh tự nhiên trong tiếng Việt, vẫn giữ mối liên hệ trực tiếp giữa hoa và cỏ trong nguyên văn, đồng thời diễn tả vẻ đẹp chóng tàn của cây cỏ.
- source_word: παρελεύσεται
  choice: sẽ qua đi
  rationale: Trong hình ảnh này, παρέρχομαι nói đến sự chóng qua và biến mất. “Sẽ qua đi” giữ được tính khái quát về cả đời sống lẫn địa vị của người giàu mà không thu hẹp nghĩa chỉ vào cái chết.
theological_decisions:
- issue: Động từ được lược bỏ và phải hiểu từ câu 9
  choice: Giữ phép lược trong chính văn, không thêm lại mệnh lệnh “hãy tự hào”.
  alternative: 'Dịch rõ: “còn người giàu hãy tự hào trong cảnh mình bị hạ xuống”.'
  rationale: Nguyên văn câu 10 không lặp lại động từ, nhưng về cú pháp tiếp nối mệnh lệnh ở câu 9. Giữ phép lược bảo toàn cấu trúc Hy Lạp và dấu [a] giúp độc giả nhận ra cách hiểu đầy đủ.
- issue: Ý nghĩa của sự hạ xuống nơi người giàu
  choice: Hiểu là tình trạng người giàu bị hạ thấp, được soi sáng bởi sự chóng qua của đời sống và địa vị.
  alternative: Hiểu là đức khiêm nhường tự nguyện hoặc chỉ là địa vị xã hội thấp nói chung.
  rationale: Mệnh đề tiếp theo—người giàu sẽ qua đi như hoa cỏ—hướng trọng tâm đến sự đảo ngược và tính tạm bợ, nhưng bản dịch không xác định quá mức phương thức hay thời điểm người ấy bị hạ xuống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hơi bỏ lửng ở đầu câu là có chủ ý để giữ phép lược của nguyên văn; “hoa cỏ” bảo toàn hình ảnh Kinh Thánh mà vẫn tự nhiên trong tiếng Việt.
