    rationale: “còn người giàu thì trong cảnh mình bị hạ xuống” không có vị ngữ chính. Trong khi tiếng Hy Lạp có thể dựa cú pháp vào mệnh lệnh προηγούμενο ở câu 9, tiếng Việt cần nêu động từ được hàm ý để văn bản tự nhiên và rõ nghĩa.
