id: JAS.1.18
reference: James 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: vi
  text: Theo ý muốn của Ngài, Ngài đã sinh chúng ta ra qua lời chân lý, để chúng ta trở nên một loại hoa quả đầu mùa trong số các tạo vật của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hoa quả đầu mùa” là phần đầu tiên của mùa gặt được biệt riêng để dâng cho Đức Chúa Trời; ở đây, hình ảnh này mô tả các tín hữu như một phần ban đầu được biệt riêng trong số những gì Ngài đã tạo dựng.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Theo ý muốn của mình
  rationale: Phân từ bất định của βούλομαι diễn tả ý muốn của Đức Chúa Trời làm nền cho hành động chính. Cách dịch này tự nhiên trong tiếng Việt, nhấn mạnh sáng kiến thuộc về Ngài nhưng không đưa thêm một hệ thống thần học vào câu.
- source_word: ἀπεκύησεν
  choice: đã sinh chúng ta ra
  rationale: Giữ nguyên hình ảnh sinh nở của ἀποκυέω và sự liên hệ với Gia-cơ 1:15, nơi ham muốn cũng được nói là sinh ra tội lỗi.
- source_word: λόγῳ ἀληθείας
  choice: bởi lời chân lý
  rationale: 'Cách dùng tặng cách mang nghĩa phương tiện: Đức Chúa Trời sinh chúng ta ra bằng lời chân lý. Cụm từ vẫn để ngỏ sắc thái đầy đủ, dù trong ngữ cảnh rất có thể chỉ sứ điệp chân thật của Tin Lành.'
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: để chúng ta trở nên
  rationale: Diễn đạt mục đích hoặc kết quả của cấu trúc εἰς với động từ nguyên mẫu có mạo từ, mà không quyết định quá mức quan hệ giữa hai sắc thái ấy.
- source_word: ἀπαρχήν
  choice: hoa quả đầu mùa
  rationale: Giữ hình ảnh nông nghiệp và dâng hiến của ἀπαρχή, tức phần đầu tiên của mùa màng được biệt riêng dâng cho Đức Chúa Trời.
- source_word: τινα
  choice: như một thứ
  rationale: 'Phản ánh sắc thái định tính hoặc giảm nhẹ của τινα: các tín hữu được ví như hoa quả đầu mùa theo một ý nghĩa nào đó.'
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: giữa các tạo vật của Ngài
  rationale: κτίσματα là các vật hoặc hữu thể được tạo dựng. Giới từ “giữa” diễn đạt tự nhiên quan hệ thuộc một tập hợp của cấu trúc sở hữu cách mà không thu hẹp phạm vi vào loài người.
theological_decisions:
- issue: Sáng kiến của Đức Chúa Trời trong sự sinh mới
  choice: Theo ý muốn của mình, Ngài đã sinh chúng ta ra
  alternative: Vì Ngài đã muốn như vậy, Ngài sinh chúng ta ra
  rationale: Bản Hy Lạp đặt ý muốn của Đức Chúa Trời trước hành động sinh ra, nhưng không trình bày trọn một hệ thống về tiền định hay sự tái sinh. Bản dịch giữ sự chủ động của Ngài mà không giải quyết quá mức căng thẳng thần học.
- issue: Phạm vi của κτισμάτων
  choice: các tạo vật của Ngài
  alternative: toàn thể công trình sáng tạo của Ngài; những người Ngài đã tạo dựng
  rationale: Giữ số nhiều và phạm vi rộng của nguyên văn, không tự ý giới hạn vào nhân loại hay biến thành một danh từ tập hợp trừu tượng.
- issue: Ẩn dụ ἀπαρχή
  choice: hoa quả đầu mùa
  alternative: phần đầu tiên; lễ vật đầu mùa
  rationale: Giữ đồng thời ý niệm về phần đầu của mùa gặt và phần được biệt riêng dâng lên, thay vì chọn riêng một nét nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” giữ cách quy chiếu tôn kính quen thuộc dành cho Đức Chúa Trời. Hình ảnh “sinh ra” và “hoa quả đầu mùa” được bảo toàn để duy trì mối liên hệ nội văn và nền tảng văn hóa của nguyên bản.
