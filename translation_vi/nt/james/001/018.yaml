revisions:
- from: Theo ý muốn của mình, Ngài đã sinh chúng ta ra bởi lời chân lý, để chúng ta trở nên như một thứ hoa quả đầu mùa giữa các tạo vật của Ngài.[a]
  to: Theo ý muốn của Ngài, Ngài đã sinh chúng ta ra qua lời chân lý, để chúng ta trở nên một loại hoa quả đầu mùa trong số các tạo vật của Ngài.[a]
  rationale: Bản sửa làm rõ quy chiếu của ý muốn thần linh, diễn đạt tự nhiên hơn phương tiện của “lời chân lý,” và thay “giữa” bằng “trong số” để phản ánh chính xác quan hệ bộ phận với toàn thể các tạo vật. “Một loại” bảo lưu sắc thái không tuyệt đối của τινα; không áp đặt giải thích thần học nào vượt quá nguyên văn.
  reviewer_model: gpt-5.6-terra
