    rationale: Trong tiếng Việt hiện đại, «Vì» thích hợp để giải thích cho mệnh đề trước; «Bởi» ở vị trí này có sắc thái gượng và dễ tạo cảm giác câu chưa hoàn chỉnh.
  - severity: low
