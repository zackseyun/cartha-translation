language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: vi
  text: Vì mặt trời mọc lên với sức nóng thiêu đốt[a] và làm cỏ khô héo; hoa của nó rụng xuống, và vẻ đẹp bên ngoài của nó tiêu tan. Cũng vậy, người giàu sẽ tàn héo giữa những việc mình theo đuổi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với luồng gió nóng.” Từ Hy Lạp καύσων có thể chỉ sức nóng thiêu đốt và, trong một số ngữ cảnh, luồng gió nóng đi kèm sức nóng ấy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “trong những chuyến đi của mình.” Từ Hy Lạp πορεία có thể chỉ những hành trình theo nghĩa đen hoặc, theo nghĩa rộng hơn, đường hướng hoạt động và những việc một người theo đuổi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: mọc lên
  rationale: Động từ chỉ mặt trời mọc; tiếng Việt không cần đánh dấu thì quá khứ trong hình ảnh minh họa này, nhờ đó câu tự nhiên mà vẫn giữ được chuỗi hành động của nguyên văn.
- source_word: σὺν τῷ καύσωνι
  choice: cùng hơi nóng thiêu đốt
  rationale: καύσων có thể chỉ sức nóng gay gắt hoặc luồng gió nóng. Cách dịch chính gắn tự nhiên với chủ ngữ là mặt trời, còn nghĩa ‘gió nóng’ được giữ trong chú thích.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: làm cỏ khô héo
  rationale: Diễn tả tác động cụ thể của nắng nóng lên cỏ và tiếp nối tự nhiên hình ảnh thực vật.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: hoa rụng xuống
  rationale: Giữ hình ảnh vật lý của ἐκπίπτω là rơi hoặc rụng; đại từ sở hữu được lược theo lối diễn đạt tự nhiên của tiếng Việt vì quan hệ với cỏ đã rõ trong ngữ cảnh.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: vẻ đẹp bên ngoài
  rationale: εὐπρέπεια là vẻ đẹp, còn πρόσωπον ở đây nói đến diện mạo hay dáng vẻ của hoa/cỏ, không nhất thiết là ‘khuôn mặt’ theo nghĩa đen.
- source_word: ἀπώλετο
  choice: tiêu tan
  rationale: Diễn đạt sự biến mất và mất đi của vẻ đẹp, phù hợp với hình ảnh chóng tàn mà không hàm ý một tác nhân hủy diệt cụ thể.
- source_word: ὁ πλούσιος
  choice: người giàu
  rationale: Danh từ hóa chỉ một người giàu như hình tượng đại diện. Tiếng Việt ‘người giàu’ tự nhiên, sát nghĩa và không thêm giới tính mà ngôn ngữ đích không buộc phải biểu thị.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: giữa những việc mình theo đuổi
  rationale: πορεία có thể chỉ các chuyến đi theo nghĩa đen hoặc rộng hơn là đường hướng hoạt động và những công việc đang tiến hành. Cách dịch chính giữ nghĩa rộng phù hợp ngữ cảnh; nghĩa đen được nêu trong chú thích.
- source_word: μαρανθήσεται
  choice: sẽ tàn héo
  rationale: Giữ thì tương lai và tiếp tục phép so sánh người giàu với cỏ hoa bị nắng làm héo tàn.
theological_decisions:
- issue: Phạm vi chỉ người của ὁ πλούσιος
  choice: người giàu
  alternative: người đàn ông giàu có; kẻ giàu
  rationale: Dạng giống đực số ít trong tiếng Hy Lạp trình bày một cá nhân đại diện. ‘Người giàu’ giữ số ít và phạm vi khái quát của lời cảnh báo mà không đưa thêm sắc thái miệt thị hay giới hạn lời ấy chỉ cho nam giới.
- issue: Phạm vi nghĩa của πορείαις trong lời cảnh báo
  choice: những việc mình theo đuổi
  alternative: những chuyến đi của mình; những nẻo đường của mình
  rationale: Từ này có thể nói về hành trình theo nghĩa đen hoặc toàn bộ tiến trình hoạt động. Bản chính dùng nghĩa rộng nhưng không thu hẹp thành riêng hoạt động kinh doanh; khả năng nghĩa đen vẫn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Nhịp câu giữ chuỗi hình ảnh mặt trời—cỏ—hoa—vẻ đẹp, rồi chuyển sang lời áp dụng về người giàu. Dùng ‘tàn héo’ để bảo toàn phép ẩn dụ thực vật; tránh từ ngữ mang sắc thái giáo phái hoặc thu hẹp lời cảnh báo vào một loại hoạt động cụ thể.
