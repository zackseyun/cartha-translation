revisions:
- from: Bởi mặt trời mọc lên cùng hơi nóng thiêu đốt[a], làm cỏ khô héo; hoa rụng xuống, vẻ đẹp bên ngoài cũng tiêu tan. Cũng vậy, người giàu sẽ tàn héo giữa những việc mình theo đuổi[b].
  to: Vì mặt trời mọc lên với sức nóng thiêu đốt[a] và làm cỏ khô héo; hoa của nó rụng xuống, và vẻ đẹp bên ngoài của nó tiêu tan. Cũng vậy, người giàu sẽ tàn héo giữa những việc mình theo đuổi[b].
  rationale: Sửa liên từ mở đầu để câu tiếng Việt tự nhiên và phản ánh chức năng giải thích của γάρ. Khôi phục các sở hữu cách cần thiết để duy trì mạch hình ảnh của nguyên văn. Giữ cách hiểu rộng, không chuyên biệt, của πορείαις cùng chú thích về nghĩa «chuyến đi».
  reviewer_model: gpt-5.6-terra
