  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: vi
  text: Nhưng mỗi người bị cám dỗ bởi chính ham muốn của mình, bị lôi kéo và dụ dỗ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dục vọng” hoặc “khao khát.” Từ Hy Lạp này có thể chỉ ham muốn mạnh nói chung, không chỉ ham muốn tình dục.
    reason: lexical_alternative
  - marker: b
    text: Hai từ “lôi kéo” và “dụ dỗ” gợi hình ảnh con mồi hoặc cá bị mồi nhử lôi dụ vào bẫy hay mắc câu.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ ý phân phối và sắc thái cá thể hóa của số ít Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu sự tương phản nhẹ với câu trước: Đức Chúa Trời không cám dỗ ai; trái lại, nguồn gần của sự cám dỗ nằm trong chính mỗi người.'
- source_word: πειράζεται
  choice: bị cám dỗ
  rationale: Trong ngữ cảnh câu 13–15, động từ chỉ sự thúc đẩy phạm tội hơn là sự thử nghiệm nói chung.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: bị chính ham muốn của mình
  rationale: Diễn đạt nguồn tác động của sự cám dỗ; “chính ... của mình” giữ sự nhấn mạnh vào điều thuộc riêng người ấy và trách nhiệm cá nhân.
- source_word: ἐπιθυμίας
  choice: ham muốn
  rationale: Thuật ngữ Hy Lạp có thể chỉ khao khát mạnh nói chung; “ham muốn” phù hợp ngữ cảnh đạo đức mà không thu hẹp vào dục vọng tình dục.
- source_word: ἐξελκόμενος
  choice: lôi kéo
  rationale: Giữ hình ảnh bị kéo ra khỏi chỗ an toàn hoặc bị dẫn lệch đi, với cách nói gọn và tự nhiên trong tiếng Việt.
- source_word: δελεαζόμενος
  choice: dụ dỗ
  rationale: Truyền đạt hành động dùng mồi nhử để dẫn vào bẫy; hình ảnh cụ thể được giải thích thêm trong chú thích.
theological_decisions:
- issue: Nguồn của sự cám dỗ trong tương quan với Đức Chúa Trời
  choice: Quy sự cám dỗ cho ham muốn của chính mỗi người, không phải cho Đức Chúa Trời.
  alternative: Hiểu động từ đơn thuần là bị thử thách bởi hoàn cảnh bên ngoài.
  rationale: Ngữ cảnh trực tiếp ở câu 13 phủ nhận việc Đức Chúa Trời cám dỗ con người, còn câu 15 nối ham muốn với tội lỗi; bản dịch giữ nguyên sự tương phản này mà không mở rộng thành một học thuyết nhân quả vượt quá câu văn.
- issue: Đại từ sở hữu của chủ thể đại diện số ít
  choice: Dùng “của mình” để quy chiếu tự nhiên về “mỗi người”.
  alternative: Dùng “của người ấy” hoặc một đại từ giống đực.
  rationale: Tiếng Việt không đánh dấu giống ngữ pháp ở đại từ phản thân như tiếng Hy Lạp. “Của mình” vừa giữ số ít theo nghĩa phân phối, vừa nhấn mạnh rằng ham muốn thuộc chính người đang bị cám dỗ, không làm thay đổi lực đại diện của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “khi bị ... lôi kéo và dụ dỗ” làm rõ quan hệ hoàn cảnh của hai phân từ Hy Lạp mà không biến chúng thành nguyên nhân tách biệt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
