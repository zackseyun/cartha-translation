- from: Nhưng mỗi người bị cám dỗ khi bị chính ham muốn của mình lôi kéo và dụ dỗ.[a][b]
  to: Nhưng mỗi người bị cám dỗ bởi chính ham muốn của mình, bị lôi kéo và dụ dỗ.[a][b]
  rationale: Chỉnh nhẹ cấu trúc để các phân từ bị động được thể hiện như những nét mô tả đi kèm với việc bị cám dỗ, thay vì trước hết mang nghĩa thời điểm. Đồng thời chỉnh chú thích văn hóa cho tự nhiên và chính xác hơn, không thay đổi nghĩa của câu.
