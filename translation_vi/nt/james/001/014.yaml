review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng tương phản với câu trước, tính phân phối của ἕκαστος, và quy nguồn trực tiếp của sự cám dỗ cho ham muốn riêng của mỗi người. Tuy nhiên, “khi bị” dễ làm hai phân từ hiện tại mang nghĩa thời điểm hơn là diễn tả hoàn cảnh/cách thức đi kèm của người bị cám dỗ. Cách chỉnh sửa giữ sát cấu trúc bị động và hình ảnh của nguyên văn hơn.
  naturalness: Câu chỉnh sửa vẫn tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại. Việc lặp “bị” phản ánh hai phân từ bị động và tránh gán nhầm hành động lôi kéo/dụ dỗ cho người đó.
  terminology: “Cám dỗ,” “ham muốn,” “lôi kéo,” và “dụ dỗ” phù hợp ngữ cảnh Gia-cơ 1:13–15. “Ham muốn” giữ phạm vi rộng của ἐπιθυμία, không giới hạn vào ham muốn tình dục. Chú thích hình ảnh được chỉnh để tránh cách diễn đạt thiếu tự nhiên về cá và mồi câu.
  issues:
  - severity: low
    issue: Liên kết “khi bị ... lôi kéo và dụ dỗ”
    rationale: Hai phân từ ἐξελκόμενος và δελεαζόμενος mô tả người đang bị cám dỗ như bị lôi kéo và bị mồi nhử/dụ dỗ. “Khi” có thể được hiểu chủ yếu theo thời điểm; đặt hai cụm bị động nối tiếp giữ quan hệ mô tả gần hơn mà không giải thích quá mức.
