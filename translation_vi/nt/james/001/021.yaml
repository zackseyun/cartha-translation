id: JAS.1.21
reference: James 1:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: vi
  text: Vì vậy, hãy từ bỏ mọi điều ô uế và sự dư tràn của điều ác[a], rồi với lòng nhu mì[b] tiếp nhận lời được gieo trồng[c], là lời có thể cứu linh hồn anh chị em[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự dư dật của điều ác” hoặc “sự gian ác quá mức.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “với sự hiền hòa” hoặc “trong sự khiêm nhường.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “lời vốn có sẵn”; theo cách dịch truyền thống: “lời được tháp vào.”'
    reason: lexical_alternative
  - marker: d
    text: 'Hay: “mạng sống của anh chị em” hoặc “chính anh chị em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì vậy
  rationale: Giữ rõ quan hệ suy luận với lời khuyên ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀποθέμενοι
  choice: hãy loại bỏ ... rồi
  rationale: Diễn đạt phân từ bất định quá khứ như hành động đi kèm và có tính chuẩn bị cho mệnh lệnh chính; cấu trúc này tự nhiên hơn lối dịch sát hình thức “sau khi đã loại bỏ”.
- source_word: πᾶσαν ῥυπαρίαν
  choice: mọi điều ô uế
  rationale: Giữ ý nhơ bẩn về phương diện đạo đức mà không thu hẹp thành một loại tội cụ thể.
- source_word: περισσείαν κακίας
  choice: sự xấu xa tràn lan
  rationale: περισσεία nói đến tình trạng dư dật, quá mức; κακία có nghĩa rộng là sự xấu xa hoặc điều ác. Cách dịch này giữ sắc thái lan tràn mà vẫn tự nhiên.
- source_word: ἐν πραΰτητι
  choice: khiêm nhu
  rationale: Kết hợp sắc thái hiền hòa, không chống đối và sẵn lòng tiếp nhận của πραΰτης; trang trọng nhưng vẫn dễ hiểu.
- source_word: δέξασθε
  choice: tiếp nhận
  rationale: Giữ lực mệnh lệnh và hàm ý chủ động đón nhận, không thêm cơ chế thần học.
- source_word: τὸν ἔμφυτον λόγον
  choice: lời đã được gieo vào lòng
  rationale: Diễn đạt tự nhiên hình ảnh điều đã được đặt hoặc gieo ở bên trong; “vào lòng” làm rõ nội tại tính trong tiếng Việt nhưng không xác định ai gieo hay bằng cách nào.
- source_word: τὸν δυνάμενον σῶσαι
  choice: là lời có thể cứu
  rationale: Cho thấy mệnh đề phân từ bổ nghĩa cho “lời” và giữ nguyên khẳng định về khả năng cứu.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: linh hồn anh chị em
  rationale: Giữ thuật ngữ truyền thống và sức nặng cứu rỗi của ψυχή, đồng thời dùng đại từ số nhiều bao gồm cả nam lẫn nữ.
theological_decisions:
- issue: Nghĩa của ψυχὰς ὑμῶν trong ngữ cảnh cứu rỗi
  choice: linh hồn anh chị em
  alternative: mạng sống của anh chị em; chính anh chị em
  rationale: “Linh hồn” bảo tồn sắc thái thần học và cách hiểu truyền thống, còn chú thích ghi nhận ψυχή cũng có thể chỉ mạng sống hoặc toàn thể con người.
- issue: Ý nghĩa của ἔμφυτον λόγον
  choice: lời đã được gieo vào lòng
  alternative: lời vốn ở bên trong; lời được ghép vào
  rationale: Cách dịch giữ hình ảnh lời hiện diện ở bên trong người nghe mà không quyết định dứt khoát lời ấy là bẩm sinh, được gieo hay được ghép theo một cơ chế thần học cụ thể.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chuyển đại từ số nhiều ὑμῶν theo lối bao hàm; giữ hình ảnh đạo đức và nông nghiệp của nguyên văn, đồng thời đặt tất cả dấu chú thích ngay sau cụm từ liên quan.
