translation:
  language: vi
  text: Một người hai lòng, không vững vàng trong mọi đường lối của mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ
  choice: một người
  rationale: Trong ngữ cảnh, danh từ giống đực số ít chỉ người cầu xin được nói đến ở câu trước và có ý nghĩa đại diện. “Một người” là cách diễn đạt tự nhiên trong tiếng Việt, không giới hạn ý nghĩa vào nam giới.
- source_word: δίψυχος
  choice: hai lòng
  rationale: Tính từ hiếm này gợi nghĩa đen là “hai linh hồn”, chỉ sự phân tâm và lòng trung thành bị chia rẽ. “Hai lòng” vừa tự nhiên, trang trọng, vừa giữ được hình ảnh nội tâm phân đôi.
- source_word: ἀκατάστατος
  choice: không vững vàng
  rationale: Từ này diễn tả trạng thái thiếu ổn định, không nhất quán. “Không vững vàng” phù hợp với việc người ấy dao động trong đức tin và cách sống mà không hàm ý quá mức về tình trạng hỗn loạn xã hội.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: trong mọi đường lối mình
  rationale: “Đường lối” giữ hình ảnh ẩn dụ của ὁδοῖς và chỉ toàn bộ nếp sống, hành vi của người ấy. Đại từ phản thân “mình” tự nhiên trong tiếng Việt và quy chiếu rõ về “một người”.
theological_decisions:
- issue: Ngôn ngữ giống đực mang ý nghĩa đại diện
  choice: Dùng “một người” trong chính văn
  alternative: “một người đàn ông”
  rationale: Dù ἀνὴρ có hình thức giống đực số ít, trong ngữ cảnh nó quy chiếu đến bất cứ người cầu xin nào ở câu trước. Tiếng Việt không buộc phải đánh dấu giống ngữ pháp; “một người” bảo toàn số ít và ý nghĩa đại diện mà không thu hẹp câu này chỉ vào nam giới.
- issue: Sắc thái của δίψυχος
  choice: Dịch “hai lòng”
  alternative: “lòng dạ phân đôi” hoặc “hai tâm hồn”
  rationale: “Hai lòng” giữ sự căng thẳng giữa dao động trong việc cầu xin và sự chia rẽ sâu xa về lòng trung thành, thay vì chỉ giải thích từ này là thiếu quyết đoán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc ngắn gọn giữ tính chất của một mệnh đề tiếp nối câu 7; “đường lối” duy trì hình ảnh Kinh Thánh quen thuộc mà vẫn tự nhiên trong tiếng Việt.
