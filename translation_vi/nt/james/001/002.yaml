  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: vi
  text: Hỡi anh em của tôi[a], mỗi khi anh em gặp đủ loại thử thách[b], hãy xem đó là niềm vui trọn vẹn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em của tôi”; từ “anh em” trong lời gọi này rất có thể chỉ toàn thể cộng đồng tín hữu.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp có thể có nghĩa là “thử thách”, “thử nghiệm”, hoặc trong một số ngữ cảnh là “cám dỗ”. Ở đây, ngữ cảnh nghiêng về những nghịch cảnh thử luyện đức tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: niềm vui trọn vẹn
  rationale: Cụm đối cách làm bổ ngữ vị ngữ cho ἡγήσασθε. “Niềm vui trọn vẹn” diễn đạt tự nhiên ý xem toàn bộ hoàn cảnh ấy là niềm vui, mà không hàm ý bản thân đau khổ là điều dễ chịu.
- source_word: ἡγήσασθε
  choice: hãy xem ... là
  rationale: Động từ mệnh lệnh số nhiều chỉ một sự đánh giá hay nhìn nhận có chủ ý; cấu trúc “xem ... là” vừa tự nhiên trong tiếng Việt vừa giữ lực mệnh lệnh.
- source_word: ἀδελφοί μου
  choice: hỡi anh em của tôi
  rationale: Giữ hình thức hô cách giống đực của nguyên văn. Trong lối xưng hô cộng đồng, “anh em” có thể mang nghĩa tập thể; chú thích nêu rõ khả năng bao gồm cả nam lẫn nữ.
- source_word: ὅταν
  choice: khi
  rationale: Kết hợp với động từ giả định, từ này chỉ thời điểm không xác định hoặc mỗi khi sự việc xảy ra. Trong câu mệnh lệnh khái quát này, “khi” là tự nhiên và vẫn giữ được ý không xác định.
- source_word: πειρασμοῖς
  choice: thử thách
  rationale: Ngữ cảnh câu 3 nói đến sự thử nghiệm đức tin, nên ở đây từ này chủ yếu chỉ những nghịch cảnh thử luyện hơn là sự cám dỗ phạm tội.
- source_word: περιπέσητε
  choice: mình gặp
  rationale: Động từ có hình ảnh gốc là “rơi vào” hay “gặp phải.” “Gặp” tự nhiên trong tiếng Việt; đại từ phản thân “mình” làm rõ chủ thể của mệnh đề phụ mà không thêm nội dung mới.
- source_word: ποικίλοις
  choice: đủ loại
  rationale: Diễn đạt ngắn gọn sự đa dạng của các thử thách; tự nhiên hơn “đa dạng” trong cấu trúc này.
theological_decisions:
- issue: Phạm vi bao hàm của ἀδελφοί trong lời gọi cộng đồng
  choice: Giữ “anh em” trong chính văn và giải thích phạm vi bao hàm trong chú thích.
  alternative: anh chị em của tôi
  rationale: Nguyên văn dùng danh từ số nhiều giống đực nhưng lời gọi rất có thể hướng đến toàn thể cộng đồng tín hữu. Cách trình bày này giữ hình thức nguồn đồng thời không che khuất phạm vi ngữ dụng.
- issue: Nghĩa của πειρασμοῖς trong ngữ cảnh
  choice: thử thách
  alternative: thử nghiệm; cám dỗ
  rationale: Câu kế tiếp nói đến việc đức tin được thử luyện, còn câu 13 phân biệt sự cám dỗ theo nghĩa đạo đức. Vì vậy “thử thách” phù hợp nhất ở đây, nhưng chú thích giữ lại bề rộng nghĩa của từ Hy Lạp.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được sắp xếp lại theo cú pháp tiếng Việt để tránh câu gượng; vẫn giữ lời gọi trực tiếp, lực mệnh lệnh và hai điểm mơ hồ đáng chú ý của nguyên văn.
