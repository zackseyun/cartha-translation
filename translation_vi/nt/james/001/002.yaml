revisions:
- from: Hỡi anh em của tôi[a], hãy xem việc mình gặp đủ loại thử thách[b] là niềm vui trọn vẹn,
  to: Hỡi anh em của tôi[a], mỗi khi anh em gặp đủ loại thử thách[b], hãy xem đó là niềm vui trọn vẹn.
  rationale: Sửa “khi” thành “mỗi khi” để phản ánh ὅταν với sắc thái bất định/khái quát, và thay “việc mình gặp” bằng mệnh đề có chủ ngữ rõ ràng “mỗi khi anh em gặp”. “Đó” liên kết tự nhiên với hoàn cảnh vừa nêu; “niềm vui trọn vẹn” giữ cách hiểu sát nghĩa và thành ngữ của Πᾶσαν χαράν. Các chú thích vẫn neo đúng tại ἀδελφοί và πειρασμοῖς.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh ἡγήσασθε, ý nghĩa “niềm vui trọn vẹn” của Πᾶσαν χαράν, và ý nghĩa thử luyện của πειρασμοῖς trong ngữ cảnh. Tuy nhiên, “khi” làm yếu phần nào sắc thái thời gian bất định/lặp lại của ὅταν, còn “mình gặp” không rõ chủ ngữ và kém phù hợp với lời hô gọi số nhiều.
  naturalness: Cấu trúc hiện tại nhìn chung tự nhiên, nhưng “việc mình gặp” có thể được hiểu là lời tự nói hoặc quy chiếu phản thân không xác định. Đặt rõ “anh em” trong mệnh đề thời gian và dùng “mỗi khi” tạo câu tiếng Việt chuẩn, sáng nghĩa hơn.
  terminology: “Anh em,” “thử thách,” và “niềm vui trọn vẹn” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về phạm vi bao hàm của ἀδελφοί và trường nghĩa của πειρασμοῖς được giữ lại, không áp đặt diễn giải giáo phái.
  issues:
