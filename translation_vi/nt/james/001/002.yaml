    issue: “mình gặp” có chủ thể mơ hồ
    rationale: περιπέσητε là động từ ngôi thứ hai số nhiều, quy chiếu trực tiếp đến những người được gọi là ἀδελφοί μου. “Mình” trong tiếng Việt hiện đại có thể mang nghĩa phản thân hoặc ngôi thứ nhất thân mật, nên không biểu đạt rõ số nhiều và làm giảm độ sáng nghĩa.
  - severity: low
