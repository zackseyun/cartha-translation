id: JAS.1.26
reference: James 1:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: vi
  text: Nếu ai cho rằng[a] mình là người có đạo, nhưng không kiềm chế lưỡi mình[b] mà lại tự lừa dối lòng mình, thì đạo của người ấy là vô ích[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có vẻ.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp dùng hình ảnh tra cương để chế ngự một con vật; ở đây là kiềm chế lưỡi.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vô giá trị,” “hư không” hoặc “không đem lại kết quả.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: cho rằng mình là
  rationale: Diễn đạt sự tự đánh giá của người ấy; đồng thời giữ khả năng hiểu là ‘có vẻ’ trong chú thích.
- source_word: θρησκὸς ... θρησκεία
  choice: người giữ đạo ... việc giữ đạo
  rationale: Giữ mối liên hệ từ vựng giữa tính chất và thực hành tôn giáo, đồng thời nhấn mạnh việc thực hành đạo hơn là chỉ căn tính thuộc một tôn giáo.
- source_word: μὴ χαλιναγωγῶν γλῶσσαν αὐτοῦ
  choice: không ghìm cương lưỡi mình
  rationale: Giữ nguyên hình ảnh cái cương dùng để chế ngự con vật, một hình ảnh được Gia-cơ khai triển lại ở 3:2–3.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: tự lừa dối lòng mình
  rationale: ‘Lòng’ giữ hình ảnh về con người nội tâm; từ ‘tự’ làm rõ rằng sự lừa dối quay lại chính người ấy mà không xóa bỏ cách nói cụ thể của nguyên văn.
- source_word: τούτου
  choice: của người ấy
  rationale: Diễn đạt tự nhiên lực chỉ định, quy về người vừa được mô tả.
- source_word: μάταιος
  choice: vô ích
  rationale: Truyền đạt ý vô hiệu, không đem lại kết quả hay giá trị; các sắc thái ‘hư không’ và ‘vô giá trị’ được ghi nhận trong chú thích.
theological_decisions:
- issue: Phạm vi chỉ người nói chung và giống ngữ pháp
  choice: ai ... mình ... người ấy
  alternative: ai ... người đó
  rationale: Tiếng Hy Lạp dùng số ít giống đực với nghĩa khái quát. Tiếng Việt tự nhiên không bắt buộc đánh dấu giống trong cấu trúc này; cách dịch vẫn giữ số ít đại diện và không thu hẹp phạm vi vào nam giới.
- issue: Ý nghĩa của θρησκός/θρησκεία
  choice: người giữ đạo / việc giữ đạo
  alternative: người sùng đạo / sự sùng đạo; người có đạo / tôn giáo
  rationale: Cách chọn này giữ trọng tâm vào sự thực hành và tuân giữ tôn giáo bên ngoài mà câu đang đánh giá, không biến lời phê phán thành sự phủ nhận tôn giáo nói chung hay chỉ nói về lòng thành kính bên trong.
- issue: Tính vô hiệu của việc giữ đạo
  choice: vô ích
  alternative: vô giá trị; hư không
  rationale: Không xác định thêm một hệ quả cứu rỗi hay giáo phái nào ngoài nhận định trực tiếp của câu rằng việc giữ đạo ấy không có giá trị hay hiệu quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Ghìm cương lưỡi’ cố ý giữ ẩn dụ sống động của nguyên văn; ‘người giữ đạo/việc giữ đạo’ tạo liên kết rõ ràng và tự nhiên trong tiếng Việt giữa lời tự nhận và thực hành tôn giáo.
