revisions:
- from: Nếu ai cho rằng mình là người giữ đạo[a], nhưng không ghìm cương lưỡi mình[b] mà lại tự lừa dối lòng mình, thì việc giữ đạo của người ấy là vô ích[c].
  to: Nếu ai cho rằng[a] mình là người có đạo, nhưng không kiềm chế lưỡi mình[b] mà lại tự lừa dối lòng mình, thì đạo của người ấy là vô ích[c].
  rationale: Sửa cụm ẩn dụ không tự nhiên thành cách nói Việt hiện đại rõ ràng, đồng thời bảo lưu hình ảnh cái cương trong chú thích. Thay “người giữ đạo/việc giữ đạo” bằng cặp trung tính hơn, vẫn liên kết hai thuật ngữ Hy Lạp. Điều chỉnh vị trí chú thích a để nó gắn chính xác với δοκεῖ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc điều kiện–đối lập–kết luận của câu, ý tự đánh giá (δοκεῖ), sự tự lừa dối lòng mình, và phán quyết μάταιος. Tuy nhiên, “ghìm cương lưỡi mình” không phải một cách kết hợp tự nhiên trong tiếng Việt; nó dễ làm mờ ý trực tiếp là kiềm chế lời nói, dù nguyên ngữ dùng ẩn dụ cái cương.
  naturalness: “Người giữ đạo/việc giữ đạo” có thể hiểu được, nhưng hơi gợi cách dùng nội bộ của một số cộng đồng tôn giáo và ít trung tính hơn “người có đạo/đạo của người ấy”. “Không kiềm chế lưỡi mình” là tự nhiên, rõ nghĩa, và vẫn giữ danh từ cụ thể “lưỡi”; chú thích có thể bảo lưu hình ảnh cái cương của tiếng Hy Lạp.
  terminology: Dùng “người có đạo” và “đạo của người ấy” giữ liên hệ θρησκός/θρησκεία trong tiếng Việt, đồng thời không đồng nhất thuật ngữ này với một giáo phái hoặc chỉ một hành vi tuân giữ. “Vô ích” diễn đạt phù hợp μάταιος.
  issues:
  - severity: medium
    issue: Cụm “ghìm cương lưỡi mình” thiếu tự nhiên.
    rationale: Tiếng Hy Lạp χαλιναγωγῶν γλῶσσαν αὐτοῦ là hình ảnh “dùng cương để chế ngự lưỡi”, nhưng tiếng Việt không thường dùng “ghìm cương” với “lưỡi”. “Không kiềm chế lưỡi mình” truyền đạt rõ nội dung; hình ảnh cái cương được giữ trong chú thích.
  - severity: low
    issue: “Người giữ đạo/việc giữ đạo” có sắc thái hẹp và mang tính cộng đồng/giáo phái hơn cần thiết.
    rationale: θρησκὸς/θρησκεία nói đến người tự xem mình là có thực hành tôn giáo và thực hành tôn giáo của người ấy. “Người có đạo/đạo của người ấy” tự nhiên và trung tính hơn, không thêm ý tuân giữ một hệ thống cụ thể.
  - severity: low
    issue: Chú thích a nên neo vào từ diễn đạt δοκεῖ.
    rationale: Khả năng “có vẻ” là lựa chọn cho δοκεῖ, nên dấu chú thích nên đặt ngay sau “cho rằng” thay vì sau toàn bộ vị ngữ.
