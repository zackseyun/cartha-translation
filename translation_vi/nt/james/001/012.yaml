    rationale: στέφανος trong bối cảnh này có thể là vòng hoa trao cho người chiến thắng, đối lập với vương miện hoàng gia. “Vòng hoa” vừa hiện đại vừa phản ánh trực tiếp hơn, còn chú thích bảo lưu sắc thái văn hóa.
  - severity: low
    issue: “được chứng nghiệm” không tự nhiên khi áp dụng cho người.
    rationale: Cụm này thường nói về điều được xác minh hơn là người đã trải qua thử luyện và được công nhận. Cần diễn đạt rõ ý δόκιμος γενόμενος mà không suy diễn phẩm chất cụ thể.
