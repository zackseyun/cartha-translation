id: JAS.1.12
reference: James 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: vi
  text: Phước cho người bền lòng chịu đựng thử thách[a], vì sau khi đã được chứng tỏ là người đã chịu qua thử thách, người ấy sẽ nhận vòng hoa của sự sống[b] mà ngài đã hứa cho những người yêu mến ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cám dỗ” hoặc “sự thử nghiệm”; từ Hy Lạp có thể bao gồm cả thử thách lẫn cám dỗ, nhưng ở đây ngữ cảnh nhấn mạnh việc bền lòng trong sự thử luyện.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “vòng hoa” có thể chỉ vòng hoa trao cho người chiến thắng, không nhất thiết là vương miện của vua.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Phước cho
  rationale: Cách diễn đạt tự nhiên, trang trọng trong lời chúc phước, giữ được sắc thái hơn là chỉ nói về cảm giác vui vẻ.
- source_word: ἀνὴρ
  choice: người nào
  rationale: Danh từ giống đực số ít ở đây mang tính đại diện; “người nào” diễn đạt tự nhiên trong tiếng Việt và không thu hẹp lời hứa chỉ cho nam giới.
- source_word: ὑπομένει
  choice: kiên trì chịu đựng
  rationale: Diễn đạt cả sự bền lòng lẫn việc đứng vững dưới áp lực, phù hợp ngữ cảnh thử luyện.
- source_word: πειρασμόν
  choice: thử thách
  rationale: Từ Hy Lạp có thể chỉ thử thách, sự thử nghiệm hoặc cám dỗ; trong câu này, sự chịu đựng và được chứng nghiệm làm nổi bật nghĩa thử thách, nhưng chú thích vẫn bảo tồn độ rộng ngữ nghĩa.
- source_word: δόκιμος γενόμενος
  choice: sau khi đã được chứng nghiệm
  rationale: Giữ cả sắc thái thời gian của phân từ và ý nghĩa được thử luyện rồi chứng tỏ là đạt chuẩn, mà không diễn giải quá mức.
- source_word: λήμψεται
  choice: sẽ nhận
  rationale: Phản ánh trực tiếp thì tương lai và ý tưởng tiếp nhận điều đã được hứa.
- source_word: στέφανον
  choice: mão triều thiên
  rationale: Là cách gọi trang trọng và quen thuộc cho phần thưởng danh dự; chú thích làm rõ đây có thể là vòng hoa chiến thắng chứ không nhất thiết là vương miện hoàng gia.
- source_word: τῆς ζωῆς
  choice: của sự sống
  rationale: Giữ nguyên cấu trúc sở hữu giàu hàm ý của nguyên văn, không quyết định đó là mão đem lại sự sống hay chính sự sống là phần thưởng.
- source_word: ἐπηγγείλατο
  choice: đã hứa ban
  rationale: “Đã hứa” phản ánh thể aorist; thêm “ban” làm rõ quan hệ tự nhiên giữa lời hứa và phần thưởng trong tiếng Việt mà không đổi nội dung.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: cho những người yêu mến Ngài
  rationale: Diễn đạt tự nhiên đối tượng nhận lời hứa; “yêu mến” có sắc thái trang trọng phù hợp văn cảnh.
theological_decisions:
- issue: Ý nghĩa của πειρασμός trong Gia-cơ 1:12
  choice: thử thách
  alternative: cám dỗ; sự thử nghiệm
  rationale: Ngữ cảnh trực tiếp nhấn mạnh sự kiên trì, được chứng nghiệm và nhận phần thưởng, nên “thử thách” là nghĩa nổi bật; chú thích giữ lại khả năng ngữ nghĩa rộng hơn.
- issue: Ý nghĩa của “mão triều thiên của sự sống”
  choice: giữ nguyên cấu trúc “của sự sống”
  alternative: mão triều thiên là sự sống; mão triều thiên đem lại sự sống
  rationale: Cấu trúc sở hữu trong tiếng Hy Lạp có thể được hiểu theo nhiều cách; bản dịch không nên âm thầm quyết định quan hệ chính xác.
- issue: Chủ thể của ἐπηγγείλατο
  choice: Ngài
  alternative: Đức Chúa Trời
  rationale: Nguyên văn không nêu danh xưng trong câu này. Đại từ kính trọng giữ được sự hàm ẩn của chủ thể thay vì bổ sung rõ “Đức Chúa Trời” vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Phước cho” theo hình thức lời chúc phước; viết hoa “Ngài” để chỉ chủ thể thần linh được hàm ý, nhưng không thêm danh xưng không có trong câu Hy Lạp.
