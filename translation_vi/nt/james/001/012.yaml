revisions:
- from: Phước cho người nào kiên trì chịu đựng thử thách[a], vì sau khi đã được chứng nghiệm, người ấy sẽ nhận mão triều thiên của sự sống[b] mà Ngài đã hứa ban cho những người yêu mến Ngài.
  to: Phước cho người bền lòng chịu đựng thử thách[a], vì sau khi đã được chứng tỏ là người đã chịu qua thử thách, người ấy sẽ nhận vòng hoa của sự sống[b] mà ngài đã hứa cho những người yêu mến ngài.
  rationale: Bản sửa thay các cách diễn đạt kém hiện đại hoặc chưa tự nhiên bằng tiếng Việt thông dụng hơn, đặc biệt đối với στέφανος và δόκιμος γενόμενος. Đại từ “ngài” được viết thường để không đưa vào chính văn một quy ước thần học/biên tập vượt quá hình thức câu Hy Lạp, trong khi ngữ cảnh vẫn cho phép người đọc nhận diện chủ thể.
  reviewer_model: gpt-5.6-terra
