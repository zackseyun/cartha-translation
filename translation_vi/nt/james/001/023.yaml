    rationale: «Khuôn mặt tự nhiên» là cách chuyển ngữ Việt ngữ thông dụng cho nghĩa thành ngữ của «khuôn mặt của sự sinh ra của mình». Chú thích nên nêu sát chữ mà không tạo cấu trúc Việt ngữ gượng ép.
