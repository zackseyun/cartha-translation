revisions:
- from: Vì nếu ai chỉ là người nghe lời ấy mà không phải là người thực hành, thì người đó giống như một người đàn ông chăm chú nhìn khuôn mặt bẩm sinh của mình[a] trong gương;
  to: Vì nếu ai là người nghe lời mà không phải là người thực hành, thì người ấy giống như một người đàn ông chăm chú nhìn khuôn mặt tự nhiên của mình[a] trong gương;
  rationale: Bản sửa loại bỏ hai yếu tố bổ sung không được diễn đạt trực tiếp trong tiếng Hy Lạp («chỉ là», «ấy»), đồng thời dùng «khuôn mặt tự nhiên» để diễn đạt tự nhiên τὸ πρόσωπον τῆς γενέσεως αὐτοῦ. Chú thích vẫn bảo tồn cách nói sát chữ và giữ dấu neo đúng tại cụm được chú thích. Dấu chấm phẩy được giữ vì câu tiếp diễn ở câu 24.
