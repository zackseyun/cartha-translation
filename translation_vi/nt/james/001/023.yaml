source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: vi
  text: Vì nếu ai là người nghe lời mà không phải là người thực hành, thì người ấy giống như một người đàn ông chăm chú nhìn khuôn mặt tự nhiên của mình[a] trong gương;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “khuôn mặt của sự sinh ra của mình”, tức khuôn mặt tự nhiên mà người ấy vốn có từ khi sinh ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: người nghe lời ấy
  rationale: Giữ hình thức danh từ và sự đối xứng nghe–làm trong câu; “lời ấy” tự nhiên trong tiếng Việt và nối với λόγος ở văn cảnh trước.
- source_word: ποιητής
  choice: người thực hành
  rationale: Diễn đạt người thực hiện điều mình nghe, đồng thời giữ hình thức danh từ tương ứng với “người nghe”; tự nhiên hơn “người làm” khi đứng riêng.
- source_word: ἔοικεν
  choice: giống như
  rationale: Diễn đạt tự nhiên giá trị hiện tại của động từ hoàn thành trong phép so sánh.
- source_word: ἀνδρὶ
  choice: một người đàn ông
  rationale: Giữ nét giống đực cụ thể của ἀνήρ thay vì trung hòa thành “một người”.
- source_word: κατανοοῦντι
  choice: chăm chú nhìn
  rationale: Thể hiện sự quan sát có chú ý của κατανοέω, mạnh hơn một cái nhìn thoáng qua.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: khuôn mặt bẩm sinh của mình
  rationale: Chuyển thành tiếng Việt tự nhiên ý nghĩa của thành ngữ Hy Lạp, đồng thời chú thích cách nói sát chữ để bảo tồn đặc điểm của nguyên văn.
- source_word: ἐν ἐσόπτρῳ
  choice: trong gương
  rationale: Cách diễn đạt chuẩn, rõ ràng và hiện đại cho hình ảnh soi gương.
theological_decisions:
- issue: Ngôn ngữ đại diện mang giống đực trong ἀνδρὶ
  choice: một người đàn ông
  alternative: một người
  rationale: Nguyên văn dùng danh từ ἀνήρ có nghĩa cụ thể là người đàn ông; bản dịch giữ nét này mà không hạn chế phạm vi áp dụng chung của phép so sánh.
- issue: Ý nghĩa của λόγου
  choice: lời ấy
  alternative: sứ điệp
  rationale: “Lời” bám sát λόγος và duy trì liên hệ với văn cảnh, nhưng không thêm cụm “của Đức Chúa Trời” vốn không xuất hiện trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người thực hành” để giữ cặp danh từ người nghe–người làm theo; “chăm chú nhìn” bảo tồn sắc thái quan sát kỹ. Dấu chấm phẩy cuối câu phản ánh việc câu Hy Lạp tiếp tục sang câu 24.
