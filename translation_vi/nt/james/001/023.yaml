  - severity: low
    issue: «lời ấy» thêm chỉ định từ «ấy».
    rationale: λόγου không có mạo từ hay chỉ định từ trong câu này. «Lời» vừa sát nguồn vừa vẫn liên kết tự nhiên với ngữ cảnh.
  - severity: low
