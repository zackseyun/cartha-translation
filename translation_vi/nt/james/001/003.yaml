  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: vi
  text: vì anh chị em biết rằng sự thử luyện đức tin của mình sinh ra lòng kiên trì[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tính chân thật đã được chứng minh của đức tin anh chị em.” Từ Hy Lạp có thể chỉ quá trình thử nghiệm hoặc phẩm chất được bộc lộ và xác nhận qua thử nghiệm.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự bền vững” hoặc “lòng bền chí.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: vì anh chị em biết
  rationale: Phân từ hiện tại liên kết với mệnh lệnh ở câu 2 và mang sắc thái nguyên nhân; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy cơ sở để coi thử thách là niềm vui.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung điều độc giả biết; sắc thái nguyên nhân đã được thể hiện bằng “vì”.
- source_word: τὸ δοκίμιον
  choice: sự thử luyện
  rationale: Từ Hy Lạp có thể chỉ quá trình thử nghiệm hoặc phẩm chất chân thật được chứng minh qua thử nghiệm. “Sự thử luyện” phù hợp mạch văn về những thử thách, đồng thời giữ sắc thái kiểm nghiệm và rèn luyện.
- source_word: ὑμῶν τῆς πίστεως
  choice: đức tin của mình
  rationale: Chỉ đức tin của các độc giả đang được thử luyện. “Đức tin” là cách dịch rõ ràng, quen thuộc của πίστις trong ngữ cảnh này; đại từ phản thân “mình” quy chiếu tự nhiên về “anh chị em”.
- source_word: κατεργάζεται
  choice: sinh ra
  rationale: 'Diễn đạt tự nhiên quan hệ tạo nên kết quả: việc thử luyện đem lại lòng kiên trì.'
- source_word: ὑπομονήν
  choice: lòng kiên trì
  rationale: Chỉ khả năng bền vững và tiếp tục đứng vững dưới nghịch cảnh. “Lòng kiên trì” tự nhiên, dễ hiểu và giữ được chiều kích bền chí.
theological_decisions:
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong Gia-cơ 1:3, từ này nói về đức tin của các tín hữu chịu thử luyện. “Đức tin” là cách dịch chuẩn và rõ nhất; ngữ cảnh không đòi hỏi chọn nghĩa “sự trung tín”.
- issue: Tính mơ hồ của δοκίμιον
  choice: sự thử luyện
  alternative: tính chân thật đã được chứng minh
  rationale: Mạch văn trước mắt nhấn mạnh quá trình trải qua thử thách, nhưng danh từ Hy Lạp cũng có thể chỉ phẩm chất được chứng thực. Bản chính chọn nghĩa quá trình và giữ nghĩa kết quả trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để xưng hô số nhiều theo văn phong thư tín; “sự thử luyện” và “lòng kiên trì” vừa tự nhiên vừa giữ các sắc thái chính của nguyên văn.
