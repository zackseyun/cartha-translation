source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: vi
  text: Anh chị em yêu dấu của tôi, đừng bị lừa dối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng lầm lạc” hoặc “đừng bị dẫn lạc đường.”'
    reason: 'πλανᾶσθε có thể mang sắc thái bị động hoặc trung động: bị lừa dối, bị dẫn sai lạc, hoặc lầm lạc.'
lexical_decisions:
- source_word: μὴ
  choice: đừng
  rationale: Kết hợp với mệnh lệnh hiện tại, μή diễn đạt lời cấm. “Đừng” là cách nói tự nhiên, trực tiếp trong tiếng Việt mà không áp đặt sắc thái thể chưa chắc chắn.
- source_word: πλανᾶσθε
  choice: để mình bị lừa dối
  rationale: Dạng này có thể mang sắc thái bị động hoặc trung động; trong ngữ cảnh, nó cảnh báo người đọc chớ tiếp nhận một nhận định sai lầm. “Đừng để mình bị lừa dối” tự nhiên trong tiếng Việt, giữ được ý bị dẫn đến chỗ hiểu sai mà không xác định tác nhân.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Dù danh từ Hy Lạp ở dạng giống đực số nhiều và có nghĩa đen là “anh em”, trong lối xưng hô cộng đồng, từ này có thể bao gồm cả nam lẫn nữ. “Anh chị em” truyền đạt tự nhiên phạm vi người được nói đến trong tiếng Việt.
- source_word: μου
  choice: của tôi
  rationale: Đại từ sở hữu bày tỏ mối liên hệ gần gũi của người viết với người nghe; tiếng Việt đặt “của tôi” sau cả cụm xưng hô.
- source_word: ἀγαπητοί
  choice: yêu dấu
  rationale: “Yêu dấu” giữ được sắc thái trìu mến và trang trọng của ἀγαπητοί, phù hợp văn phong Kinh Thánh hiện đại.
theological_decisions:
- issue: Lời xưng hô có giống ngữ pháp đối với cộng đồng tín hữu
  choice: Dịch ἀδελφοί là “anh chị em” trong chính văn.
  alternative: Dịch sát hình thức giống đực là “anh em”, rồi chú thích rằng từ này có thể bao gồm cả phụ nữ.
  rationale: Trong ngữ cảnh thư gửi cộng đồng, số nhiều giống đực Hy Lạp có chức năng đại diện và nhiều khả năng chỉ cả cộng đồng gồm nam lẫn nữ. Tiếng Việt hiện đại dùng “anh chị em” để biểu đạt đúng phạm vi quy chiếu, chứ không xóa bỏ một phân biệt giới tính có chủ ý.
- issue: Sắc thái của πλανᾶσθε
  choice: Giữ lời cảnh báo về việc bị lừa dối, không xác định ai là tác nhân.
  alternative: “Đừng lầm lạc” có thể nhấn mạnh việc tự đi sai đường; “đừng bị lừa dối” thuần bị động hơn.
  rationale: Hình thái Hy Lạp cho phép sắc thái bị động/trung động. Cách diễn đạt “đừng để mình bị lừa dối” giữ độ mở ấy và phù hợp với lời cảnh báo chớ tin điều sai về nguồn gốc của sự cám dỗ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự đưa lời xưng hô lên đầu câu tự nhiên trong tiếng Việt và vẫn giữ lực nhấn của mệnh lệnh. Dùng “anh chị em” theo phạm vi quy chiếu của lối xưng hô cộng đồng Hy Lạp.
