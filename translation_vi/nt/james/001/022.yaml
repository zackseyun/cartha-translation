id: JAS.1.22
reference: James 1:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: vi
  text: Nhưng hãy làm theo lời ấy, chứ đừng chỉ nghe mà tự lừa dối mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự làm mình lầm tưởng” hoặc “tự suy luận sai mà đánh lừa mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: hãy
  rationale: Truyền đạt mệnh lệnh ở ngôi thứ hai số nhiều; kết hợp với “làm theo” diễn tả lời kêu gọi thực hành như một nếp sống liên tục.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý có tính tương phản với việc tiếp nhận lời ở câu trước.
- source_word: ποιηταὶ λόγου
  choice: làm theo lời ấy
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt người thực hiện điều lời đã truyền dạy; “lời ấy” nối trực tiếp với “lời đã được gieo” trong ngữ cảnh gần.
- source_word: ἀκροαταὶ μόνον
  choice: chỉ nghe
  rationale: Giữ rõ sự tương phản giữa thực hành và chỉ nghe, đồng thời tránh danh từ hóa gượng gạo trong tiếng Việt.
- source_word: παραλογιζόμενοι
  choice: tự lừa dối
  rationale: Diễn đạt rõ hành động tự đánh lừa mình; sắc thái suy luận sai dẫn đến ngộ nhận được ghi trong chú thích.
- source_word: ἑαυτούς
  choice: mình
  rationale: Đại từ phản thân tự nhiên trong lời khuyên hướng đến số nhiều trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của λόγος trong Gia-cơ 1:22
  choice: “lời ấy”, chỉ lời của Đức Chúa Trời đã được tiếp nhận trong ngữ cảnh
  alternative: “sứ điệp” hoặc “lời dạy”
  rationale: Giữ sự liên kết với “lời đã được gieo” ở 1:21 và chiều sâu Kinh Thánh của λόγος, nhưng không thu hẹp thành một định nghĩa giáo lý riêng.
- issue: Lực của mệnh lệnh Γίνεσθε
  choice: Lời kêu gọi liên tục làm theo lời
  alternative: “hãy trở nên người thực hành” với sắc thái bắt đầu trở thành
  rationale: Thì hiện tại của mệnh lệnh phù hợp với một nếp sống tiếp diễn; lối dịch tiếng Việt ưu tiên diễn đạt trực tiếp hành động được đòi hỏi.
- issue: Sắc thái của παραλογιζόμενοι
  choice: “tự lừa dối mình” trong chính việc chỉ nghe mà không làm
  alternative: “tự suy luận sai mà đánh lừa mình”
  rationale: Bản văn cho phép nhận ra yếu tố lý luận sai lạc nhưng không cần đưa toàn bộ nét nghĩa ấy vào câu chính; chú thích bảo tồn sắc thái này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cấu trúc động từ “làm theo… chỉ nghe” để giữ thế đối lập của nguyên văn mà không tạo lối danh từ hóa thiếu tự nhiên.
