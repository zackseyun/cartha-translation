id: JAS.1.24
reference: James 1:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: vi
  text: Vì người ấy đã nhìn kỹ chính mình rồi bỏ đi, và lập tức quên mất mình vốn như thế nào.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mình là người thế nào.” Cụm từ Hy Lạp nói đến tính chất, dáng vẻ hoặc loại người của người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: đã nhìn kỹ
  rationale: Động từ κατανοέω diễn tả việc chú ý quan sát hoặc xem xét. Trong hình ảnh soi gương, “nhìn kỹ” vừa tự nhiên vừa giữ được sắc thái chăm chú hơn động từ “nhìn” đơn thuần.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nối câu này với lời so sánh ở câu trước bằng quan hệ giải thích; “Vì” diễn đạt rõ chức năng ấy trong tiếng Việt.
- source_word: ἑαυτὸν
  choice: chính mình
  rationale: Đại từ phản thân chỉ trực tiếp bản thân người ấy. Bản văn câu này không lặp lại “khuôn mặt”, nên không thêm ý đó vào bản dịch.
- source_word: ἀπελήλυθεν
  choice: bỏ đi
  rationale: Dạng hoàn thành của ἀπέρχομαι có thể gợi kết quả của việc đã rời đi, nhưng trong chuỗi hành động kể lại, “bỏ đi” là cách diễn đạt tự nhiên và chính xác.
- source_word: εὐθέως
  choice: lập tức
  rationale: εὐθέως nhấn mạnh hành động xảy ra ngay sau đó; “lập tức” giữ nguyên sức nặng của trạng từ.
- source_word: ἐπελάθετο
  choice: quên mất
  rationale: ἐπιλανθάνομαι có nghĩa là quên hoặc không còn nhớ. “Quên mất” là cách nói trực tiếp, tự nhiên trong tiếng Việt.
- source_word: ὁποῖος ἦν
  choice: mình vốn như thế nào
  rationale: ὁποῖος chỉ phẩm chất, dáng vẻ hoặc loại, chứ không chỉ căn tính. “Mình vốn như thế nào” giữ được nét mơ hồ thực sự giữa diện mạo trong hình ảnh chiếc gương và tình trạng con người trong phép so sánh.
theological_decisions:
- issue: Phạm vi ý nghĩa của ὁποῖος ἦν trong phép ví von về chiếc gương
  choice: mình vốn như thế nào
  alternative: mình là hạng người nào
  rationale: Nguyên ngữ hỏi về tính chất hoặc dáng vẻ của người ấy và không buộc phải giới hạn vào phẩm chất đạo đức. Bản dịch chọn cách diễn đạt rộng, không áp đặt một cách giải nghĩa thần học riêng lên phép ví von.
- issue: Giống đực số ít được dùng theo nghĩa đại diện
  choice: người ấy… mình
  alternative: người đàn ông ấy… ông ta
  rationale: Trong ngữ cảnh, nhân vật là ví dụ đại diện cho bất cứ người nghe lời mà không làm theo. Tiếng Việt không cần đánh dấu giống, vì vậy cách dịch trung tính phản ánh đúng chức năng khái quát của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ấy” duy trì liên hệ với nhân vật đại diện ở câu trước; “mình” tránh lặp nặng nề và là đại từ phản thân tự nhiên. Dấu chú thích [a] được đặt sau cụm từ mà chú thích giải thích.
