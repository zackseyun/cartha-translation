revisions:
- from: Mọi sự ban cho tốt lành[a] và mọi tặng phẩm trọn vẹn đều từ trên cao, từ Cha của muôn ánh sáng mà xuống; nơi Ngài không có sự đổi thay hay bóng do chuyển dịch[b].
  to: Mọi sự ban cho tốt lành[a] và mọi tặng phẩm trọn vẹn đều từ trên cao mà xuống, từ Cha của muôn ánh sáng; nơi Ngài không có sự đổi thay hay bóng do sự xoay chuyển[b].
  rationale: Bản sửa chỉ điều chỉnh trật tự cú pháp và từ ngữ để tiếng Việt tự nhiên hơn, đồng thời làm rõ hình ảnh ‘xoay chuyển’ của từ nguồn. Các ẩn dụ, sự song song từ vựng và tính không xác quyết của cụm khó ở cuối câu đều được giữ nguyên.
