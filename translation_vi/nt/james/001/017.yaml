  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: vi
  text: Mọi sự ban cho tốt lành[a] và mọi tặng phẩm trọn vẹn đều từ trên cao mà xuống, từ Cha của muôn ánh sáng; nơi Ngài không có sự đổi thay hay bóng do sự xoay chuyển[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi món quà tốt lành.” Danh từ thứ nhất có thể nhấn mạnh hành động ban cho hoặc vật được ban, còn danh từ thứ hai nhấn mạnh tặng phẩm.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bóng của sự xoay chuyển” hoặc “bóng chuyển đổi.” Cụm từ này có lẽ gợi đến những bóng thay đổi theo chuyển động của các thiên thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Mọi sự ban cho tốt lành
  rationale: δόσις có thể chỉ hành động ban cho hoặc vật được ban. “Sự ban cho” giữ được sắc thái hành động và phân biệt với δώρημα trong vế song song.
- source_word: πᾶν δώρημα τέλειον
  choice: mọi tặng phẩm trọn vẹn
  rationale: δώρημα nhấn mạnh vật được ban; “tặng phẩm” tự nhiên và giúp duy trì sự phân biệt với δόσις. τέλειον ở đây mang nghĩa trọn vẹn, đầy đủ về phẩm chất.
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: đều từ trên cao ... mà xuống
  rationale: Giữ cả ý nguồn gốc “từ trên cao” lẫn hình ảnh chuyển động xuống của phân từ καταβαῖνον, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: từ Cha của muôn ánh sáng
  rationale: Giữ nguyên ẩn dụ về Đức Chúa Trời là Cha của các ánh sáng, có khả năng ám chỉ các thiên thể, nhưng không giải nghĩa trực tiếp ngay trong câu.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: nơi Ngài không có sự đổi thay
  rationale: “Nơi Ngài” thể hiện quan hệ của παρ’ ᾧ; “không có sự đổi thay” giữ cấu trúc hiện hữu của οὐκ ἔνι và ý nghĩa của παραλλαγή.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: hay bóng do chuyển dịch
  rationale: Giữ hình ảnh “bóng” và biểu thị mối liên hệ giữa bóng với sự xoay chuyển hoặc chuyển dịch, có thể gợi đến những bóng thay đổi do chuyển động của các thiên thể.
theological_decisions:
- issue: Hình ảnh “Cha của muôn ánh sáng” và sự không thay đổi của Đức Chúa Trời
  choice: Giữ ẩn dụ về ánh sáng cùng lời khẳng định rằng nơi Ngài không có sự đổi thay, không diễn giải thành một công thức tín lý.
  alternative: Giải thích “ánh sáng” ngay trong chính văn là các thiên thể và rút gọn mệnh đề cuối thành “Ngài không bao giờ thay đổi”.
  rationale: Bản văn đối chiếu Cha, nguồn của mọi điều tốt lành, với sự chuyển dịch và bóng thay đổi gắn với các nguồn sáng thụ tạo. Giữ hình ảnh nguyên vẹn bảo toàn cả chiều kích thi ca lẫn hàm ý thần học của câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Tặng phẩm” phân biệt tự nhiên hai danh từ gần nghĩa; “muôn ánh sáng” giữ sắc thái thi ca của ẩn dụ mà không buộc người đọc vào một cách giải thích duy nhất.
