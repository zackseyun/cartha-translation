id: JAS.1.9
reference: James 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: vi
  text: Nhưng người anh em có địa vị thấp kém hãy tự hào về sự cao trọng của mình[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người anh em có thân phận thấp kém.” Từ Hy Lạp ở dạng giống đực số ít, nhưng có thể dùng theo nghĩa đại diện để chỉ một người cùng đức tin, nam hoặc nữ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “địa vị cao của mình.” Cụm từ này có thể nói đến địa vị được tôn trọng của người có thân phận thấp kém trước mặt Đức Chúa Trời, đồng thời gợi đến sự đảo ngược thân phận trong hiện tại hoặc tương lai.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: hãy tự hào
  rationale: Thể mệnh lệnh hiện tại mang sắc thái khuyên bảo. “Tự hào” giữ được ý nghĩa của καυχάομαι, còn đối tượng của sự tự hào không phải thành tích bản thân mà là địa vị cao trọng được ban cho.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có tính tương phản nhẹ, đồng thời mở đầu cặp đối lập giữa người thấp kém và người giàu trong câu 9–10.
- source_word: ὁ ἀδελφὸς
  choice: người anh em
  rationale: Giữ hình thức giống đực số ít của nguyên văn; trong văn cảnh, từ này có thể đại diện cho một người cùng đức tin.
- source_word: ὁ ταπεινὸς
  choice: có địa vị thấp kém
  rationale: Cách dịch này diễn đạt địa vị thấp trong xã hội hoặc kinh tế, phù hợp với sự đối lập với người giàu ở câu 10, nhưng không thu hẹp từ này thành chỉ “nghèo” hoặc chỉ phẩm chất “khiêm nhường”.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: về sự cao trọng của mình
  rationale: ὕψος chỉ sự cao, địa vị cao hoặc sự tôn cao. “Sự cao trọng” giữ được ý đảo ngược thân phận và không quyết định đó chỉ là địa vị hiện tại hay sự tôn cao trong tương lai.
theological_decisions:
- issue: Ý nghĩa của “sự cao trọng” nơi người có địa vị thấp kém
  choice: Giữ nghĩa rộng về địa vị hoặc vinh dự cao trọng của người ấy trước mặt Đức Chúa Trời, có thể bao gồm sự đảo ngược cả hiện tại lẫn tương lai.
  alternative: Sự thăng tiến xã hội hiện tại; địa vị thuộc linh trước mặt Đức Chúa Trời; hoặc sự tôn cao trong thời kỳ cuối cùng.
  rationale: Sự đối lập trong câu 9–10 gợi lên việc đảo ngược thân phận, nhưng nguyên văn không giới hạn ý nghĩa vào duy nhất một thời điểm hay một phương diện.
- issue: Cách thể hiện giống của ἀδελφός
  choice: Dịch là “người anh em” trong chính văn.
  alternative: “Anh chị em” hoặc “người cùng đức tin.”
  rationale: Nguyên văn dùng danh từ giống đực số ít; chú thích cho biết từ này có thể được dùng theo nghĩa đại diện trong cộng đồng đức tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Địa vị thấp kém” làm rõ sắc thái xã hội của ταπεινός trong sự đối lập với người giàu; “sự cao trọng” giữ được độ mở thần học của ὕψος. Các dấu chú thích [a], [b] đều có mặt trong chính văn.
