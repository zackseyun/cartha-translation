  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: vi
  text: Vì cơn giận của con người không tạo nên sự công chính của Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ
  choice: cơn giận
  rationale: Diễn đạt tự nhiên trạng thái giận dữ trong ngữ cảnh lời khuyên phải chậm giận.
- source_word: ἀνδρὸς
  choice: của con người
  rationale: Ở đây ἀνήρ được dùng theo nghĩa khái quát về con người, không nhằm giới hạn ở nam giới.
- source_word: δικαιοσύνην θεοῦ
  choice: sự công chính của Đức Chúa Trời
  rationale: 'Giữ nguyên cấu trúc sở hữu và độ mở nghĩa của cụm Hy Lạp: có thể chỉ sự công chính thuộc về Đức Chúa Trời hoặc sự công chính Ngài đòi hỏi và thực hiện.'
- source_word: οὐκ ἐργάζεται
  choice: không tạo nên
  rationale: Thể hiện ý cơn giận của con người không làm ra hay đem lại kết quả là sự công chính của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνην θεοῦ
  choice: sự công chính của Đức Chúa Trời
  alternative: điều công chính Đức Chúa Trời muốn
  rationale: Bản dịch chính giữ cấu trúc và sự mơ hồ chân thực của nguyên văn, không thu hẹp cụm từ thành riêng chuẩn mực đạo đức mà Đức Chúa Trời yêu cầu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; câu ngắn gọn, giữ quan hệ nguyên nhân được đánh dấu bằng γὰρ.
