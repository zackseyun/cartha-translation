  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của câu Hy Lạp: mệnh lệnh phủ định hướng đến người đang bị cám dỗ; lời quy nguồn cám dỗ cho Đức Chúa Trời bị bác bỏ; ἀπείραστός ἐστιν κακῶν được diễn đạt theo nghĩa Đức Chúa Trời không thể bị điều ác cám dỗ; và αὐτὸς ... οὐδένα giữ được sắc thái nhấn mạnh rằng chính Ngài không cám dỗ bất cứ ai. Cách dùng nhất quán “cám dỗ” phù hợp mạch văn trực tiếp (1:14–15).'
  naturalness: “Khi bị cám dỗ, đừng ai nói” là tiếng Việt hiện đại, tự nhiên, đồng thời diễn đạt tốt giá trị mệnh lệnh của μηδεὶς ... λεγέτω. Câu văn trang trọng, rõ ràng và không nặng tính dịch từng chữ. “Điều ác” số ít tập thể trong thân bài là cách diễn đạt tự nhiên; chú thích bảo lưu dạng số nhiều của nguyên ngữ.
  terminology: “Đức Chúa Trời,” “Ngài,” và “cám dỗ” được dùng nhất quán, phù hợp đăng ký Kinh Thánh tiếng Việt hiện đại. Không có thuật ngữ thần học nào bị áp đặt vượt quá điều câu văn nói.
