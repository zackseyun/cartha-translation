id: JAS.1.13
reference: James 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: vi
  text: 'Khi bị cám dỗ, đừng ai nói: “Tôi bị Đức Chúa Trời cám dỗ,” vì Đức Chúa Trời không thể bị điều ác cám dỗ[a], và chính Ngài cũng không cám dỗ ai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát hơn: “Đức Chúa Trời là Đấng không thể bị cám dỗ bởi những điều ác.” Cụm từ Hy Lạp ở đây cô đọng và hiếm gặp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: đừng ai nói
  rationale: Diễn đạt tự nhiên mệnh lệnh cấm ở ngôi thứ ba trong tiếng Việt, đồng thời giữ chủ thể bất định “không một ai”.
- source_word: πειραζόμενος
  choice: khi bị cám dỗ
  rationale: Phân từ hiện tại bị động chỉ hoàn cảnh đang diễn ra; ngữ cảnh về dục vọng và tội lỗi trong câu kế tiếp cho thấy nghĩa “bị cám dỗ” phù hợp hơn nghĩa rộng “bị thử thách”.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Tôi bị Đức Chúa Trời cám dỗ
  rationale: ἀπό ở đây biểu thị nguồn/tác nhân; cấu trúc bị động tiếng Việt truyền đạt rõ lời quy trách nhiệm cho Đức Chúa Trời mà câu này bác bỏ.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: Đức Chúa Trời không thể bị điều ác cám dỗ
  rationale: Diễn đạt tự nhiên tính từ hiếm ἀπείραστος theo nghĩa Đức Chúa Trời không thể bị sự ác lôi kéo; “điều ác” chuyển tải κακῶν tự nhiên trong tiếng Việt mà không giới hạn vào một hành vi riêng lẻ.
- source_word: πειράζει
  choice: cám dỗ
  rationale: Trong văn cảnh này, động từ nói đến sự lôi kéo về mặt đạo đức dẫn đến tội lỗi, không phải việc thử luyện nói chung.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: Giữ sắc thái nhấn mạnh của đại từ Hy Lạp.
- source_word: οὐδένα
  choice: không ... ai
  rationale: Cách phủ định đối tượng tự nhiên và rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Nghĩa của nhóm từ πειράζω trong câu này
  choice: Dùng nhất quán “cám dỗ/bị cám dỗ”.
  alternative: Dùng “thử thách/bị thử thách” ở một hay nhiều vị trí.
  rationale: Mạch văn hướng đến sự lôi kéo phạm tội phát sinh từ dục vọng, nên “cám dỗ” bảo toàn điểm thần học của câu mà không phủ nhận chủ đề Kinh Thánh khác rằng Đức Chúa Trời có thể thử luyện con người.
- issue: Nghĩa của ἀπείραστός ἐστιν κακῶν
  choice: “Đức Chúa Trời không thể bị điều ác cám dỗ.”
  alternative: “Đức Chúa Trời không bị cám dỗ bởi những điều ác”; hoặc “Đức Chúa Trời không từng trải điều ác.”
  rationale: Cách dịch đã chọn phù hợp nhất với vế tiếp theo và nói rõ rằng điều ác không thể lôi kéo Đức Chúa Trời, nhưng chú thích vẫn ghi nhận tính cô đọng và khó xác định của cụm từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; cấu trúc “Khi bị cám dỗ, đừng ai nói” tự nhiên hơn lối dịch sát chữ nhưng vẫn giữ lực cấm đoán của nguyên văn.
