id: JAS.1.6
reference: James 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: vi
  text: Nhưng người ấy phải cầu xin với đức tin[a], không chút nghi ngờ, vì người nghi ngờ giống như sóng biển bị gió cuốn và xô dạt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với lòng tin cậy.” Trong ngữ cảnh này, từ Hy Lạp chỉ “đức tin” cũng mang sắc thái tin cậy và nương dựa nơi Đức Chúa Trời.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: phải cầu xin
  rationale: Thể mệnh lệnh ngôi thứ ba, thì hiện tại, mang sức khuyên truyền rõ ràng. Trong tiếng Việt, “phải cầu xin” tự nhiên hơn lối dịch sát hình thức “hãy để người ấy cầu xin” và nối trực tiếp với việc xin sự khôn ngoan ở câu trước.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Đánh dấu sự chuyển ý có tính đối chiếu nhẹ: Đức Chúa Trời ban rộng rãi, nhưng người xin cần cầu xin với đức tin.'
- source_word: ἐν πίστει
  choice: với đức tin
  rationale: “Với đức tin” là cách diễn đạt tự nhiên trong tiếng Việt, vừa giữ thuật ngữ πίστις vừa truyền đạt thái độ tin cậy khi cầu xin.
- source_word: μηδὲν διακρινόμενος
  choice: không chút nghi ngờ
  rationale: Trong ngữ cảnh này, διακρίνομαι chỉ sự phân vân, dao động nội tâm. Cách dịch này chuyển tải đầy đủ μηδέν và tự nhiên hơn “không nghi ngờ điều gì”.
- source_word: ὁ γὰρ διακρινόμενος
  choice: vì người nghi ngờ
  rationale: Danh hóa phân từ theo nghĩa khái quát, không áp đặt giới tính; đồng thời lặp lại “nghi ngờ” để duy trì liên kết từ vựng của nguyên bản.
- source_word: ἔοικεν κλύδωνι θαλάσσης
  choice: giống như sóng biển
  rationale: Diễn đạt hình ảnh so sánh rõ ràng, gọn và tự nhiên; κλύδων là sóng lớn hay sự cuộn trào của biển.
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: bị gió cuốn và xô dạt
  rationale: Giữ hai phân từ bị động riêng biệt và hình ảnh một ngọn sóng chịu ngoại lực chi phối. “Cuốn” và “xô dạt” truyền đạt sự bất ổn mà không thêm hướng chuyển động không có trong nguyên bản.
theological_decisions:
- issue: Cách dịch πίστις trong lời khuyên về cầu nguyện
  choice: đức tin
  alternative: lòng tin cậy
  rationale: “Đức tin” duy trì thuật ngữ thần học quen thuộc và sự liên tục từ vựng của πίστις. Tuy nhiên, trong ngữ cảnh này từ ấy đặc biệt nhấn mạnh sự tin cậy nơi Đức Chúa Trời, nên sắc thái đó được nêu trong chú thích.
- issue: Ý nghĩa của διακρίνομαι
  choice: nghi ngờ
  alternative: dao động
  rationale: Ngữ cảnh đối lập với cầu xin trong đức tin và hình ảnh sóng biển cho thấy sự nghi ngờ, phân vân nội tâm. “Dao động” là một sắc thái khả dĩ nhưng không cần thay thế cách dịch chính.
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Người ấy” nối với người đang xin sự khôn ngoan ở câu trước; “người nghi ngờ” vẫn mang nghĩa khái quát, không xác định giới tính. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
