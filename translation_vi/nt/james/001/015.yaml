id: JAS.1.15
reference: James 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: vi
  text: Rồi dục vọng, khi đã thụ thai[a], sinh ra tội lỗi; còn tội lỗi, khi đã phát triển trọn vẹn[b], sinh ra sự chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã thụ thai.” Phân từ Hy Lạp gắn chặt hình ảnh thụ thai với dục vọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “khi đã hoàn tất” hoặc “khi đã trưởng thành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Rồi
  rationale: Đánh dấu bước tiếp theo trong tiến trình từ cám dỗ đến sự chết, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐπιθυμία
  choice: dục vọng
  rationale: Chỉ ham muốn sai trái nói chung trong ngữ cảnh này, không thu hẹp vào ham muốn tình dục như một số cách hiểu của từ này trong tiếng Việt.
- source_word: συλλαβοῦσα
  choice: khi đã thụ thai
  rationale: Giữ nguyên hình ảnh thai nghén và thể hiện hành động này xảy ra trước động từ chính ‘sinh ra’.
- source_word: τίκτει
  choice: sinh ra
  rationale: 'Diễn đạt rõ ràng, tự nhiên hình ảnh sinh nở: dục vọng đã thụ thai rồi sinh ra tội lỗi.'
- source_word: ἁμαρτίαν
  choice: tội lỗi
  rationale: Cách dịch thông dụng và chính xác cho điều ác về phương diện đạo đức trong câu.
- source_word: δὲ
  choice: còn
  rationale: Nối sang giai đoạn tiếp theo và chuyển chủ thể từ dục vọng sang tội lỗi, không tạo một sự đối lập quá mạnh.
- source_word: ἀποτελεσθεῖσα
  choice: khi đã phát triển trọn vẹn
  rationale: Giữ cả ý đạt đến mức hoàn tất và sắc thái trưởng thành trong chuỗi hình ảnh hữu cơ của câu.
- source_word: ἀποκύει
  choice: sinh ra
  rationale: Tiếp tục hình ảnh sinh nở của nguyên văn; sự lặp lại trong tiếng Việt làm rõ tiến trình dục vọng–tội lỗi–sự chết.
- source_word: θάνατον
  choice: sự chết
  rationale: Dịch trực tiếp và không tự ý giới hạn thành sự chết thể xác, thuộc linh hay đời đời.
theological_decisions:
- issue: Hình ảnh liên kết dục vọng, tội lỗi và sự chết
  choice: Giữ nguyên hình ảnh nhân cách hóa về thụ thai và sinh nở.
  alternative: Dục vọng dẫn đến tội lỗi, và tội lỗi dẫn đến sự chết.
  rationale: Cách diễn đạt thuần túy về quan hệ nhân quả sẽ làm phẳng ẩn dụ mạnh mẽ của nguyên văn và đánh mất tiến trình hữu cơ mà Gia-cơ mô tả.
- issue: Phạm vi ý nghĩa của θάνατος
  choice: Dịch đơn giản là ‘sự chết’.
  alternative: sự chết thuộc linh; sự chết đời đời; cái chết thể xác
  rationale: Nguyên văn không định rõ loại sự chết nào; bản dịch cần giữ nguyên độ rộng và sức nặng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘dục vọng’ cho ham muốn sai trái nói chung; duy trì nhất quán hình ảnh thụ thai và sinh nở, đồng thời không giải thích quá mức ý nghĩa của ‘sự chết’.
