  rationale: Chỉ bổ sung “bất cứ” để chuyển rõ τι trong phạm vi phủ định, tương ứng với “anything” của bản tiếng Anh và không thay đổi ý nghĩa. Giữ nguyên cách gọi “Chúa”, chủ ngữ số ít hồi chỉ, và chú thích về hình thức giống đực của tiếng Hy Lạp.
