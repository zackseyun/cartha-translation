  source_fidelity: Bản dịch giữ đúng quan hệ giải thích của γάρ (“Vì”), lời ngăn cấm của μὴ ... οἰέσθω (“đừng tưởng”), chủ ngữ hồi chỉ ὁ ἄνθρωπος ἐκεῖνος (“người ấy”), mệnh đề nội dung, thì tương lai của λήμψεταί, và nguồn gốc παρὰ τοῦ κυρίου (“từ Chúa”). Cần làm rõ hơn lực bao quát của τι trong phạm vi phủ định.
  naturalness: Câu nhìn chung tự nhiên và có văn phong trang trọng vừa phải. Thêm “bất cứ” trước “điều gì” khiến ý phủ định bao quát rõ ràng hơn trong tiếng Việt hiện đại mà không làm câu nặng nề.
  terminology: “Chúa” là cách dịch nhất quán và không diễn giải quá mức τοῦ κυρίου. “Người ấy” là cách chuyển tự nhiên của cụm chỉ người số ít trong tiếng Việt; chú thích có thể ghi nhận dạng giống đực số ít của nguyên văn mà không hàm ý giới tính sinh học là trọng tâm.
  issues:
