  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: vi
  text: Vì người ấy đừng tưởng rằng mình sẽ nhận được bất cứ điều gì từ Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “người đó.” Nguyên văn Hy Lạp dùng danh từ giống đực số ít, chỉ cá nhân đang nghi ngờ được mô tả ở câu trước.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: Vì ... đừng
  rationale: γάρ nối câu này với lời mô tả người nghi ngờ ở câu trước; “Vì” giữ quan hệ giải thích ấy. μή cùng động từ mệnh lệnh diễn đạt lời ngăn cấm, được chuyển tự nhiên là “đừng”.
- source_word: οἰέσθω
  choice: tưởng
  rationale: οἴομαι có nghĩa là nghĩ, cho rằng hoặc tưởng. “Tưởng” tự nhiên trong lời cảnh báo và không biến hành vi suy nghĩ thành ý niệm mong đợi.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: người ấy
  rationale: Cụm Hy Lạp ở số ít và chỉ cá nhân đang nghi ngờ được nói đến ở câu trước. Tiếng Việt không bắt buộc đánh dấu giống ngữ pháp tại đây; “người ấy” vừa chính xác vừa tự nhiên, và giữ sắc thái chỉ định của ἐκεῖνος.
- source_word: ὅτι
  choice: rằng
  rationale: ὅτι mở đầu nội dung của điều người ấy không nên tưởng; “rằng” thể hiện rõ cấu trúc này trong tiếng Việt.
- source_word: λήμψεταί
  choice: mình sẽ nhận được
  rationale: Thì tương lai của λαμβάνω được diễn đạt bằng “sẽ nhận được”. Đại từ “mình” quy chiếu tự nhiên về chủ ngữ “người ấy” trong câu tiếng Việt.
- source_word: τι
  choice: điều gì
  rationale: Trong phạm vi phủ định, τι mang nghĩa bất định bao quát; “điều gì” sau “đừng tưởng” truyền đạt tự nhiên ý không nhận được bất cứ điều nào.
- source_word: παρὰ τοῦ κυρίου
  choice: từ Chúa
  rationale: παρά với sở hữu cách chỉ nguồn, nên dịch là “từ”. κύριος được giữ là “Chúa”, không xác định rõ hơn danh tính mà nguyên văn không nêu.
theological_decisions:
- issue: Đối tượng được gọi là τοῦ κυρίου
  choice: Chúa
  alternative: Đức Chúa Trời; Chúa là Đức Chúa Trời
  rationale: Nguyên văn chỉ dùng κύριος, không kèm danh xưng xác định thêm. “Chúa” giữ nguyên mức độ xác định và tránh đưa vào câu một cách diễn giải thần học cụ thể hơn.
- issue: Cách chuyển ὁ ἄνθρωπος ἐκεῖνος
  choice: người ấy
  alternative: người đàn ông ấy
  rationale: Dù ἄνθρωπος ở dạng giống đực số ít, trong ngữ cảnh nó chỉ một cá nhân đại diện đang nghi ngờ. Tiếng Việt hiện đại không có giống ngữ pháp tương ứng; “người ấy” giữ số ít và quan hệ hồi chỉ mà không thêm nghĩa giới tính sinh học vốn không phải trọng tâm của ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Vì ... đừng tưởng rằng...” giữ mối liên kết lập luận với câu trước; “người ấy” phù hợp cách hồi chỉ tự nhiên trong tiếng Việt.
