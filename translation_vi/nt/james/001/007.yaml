    rationale: Trong cấu trúc bị chi phối bởi μὴ, τι có ý “bất cứ điều gì/anything”. “Điều gì” có thể hiểu đúng theo ngữ cảnh, nhưng “bất cứ điều gì” phản ánh rõ hơn lực phủ định bao quát của nguyên văn.
