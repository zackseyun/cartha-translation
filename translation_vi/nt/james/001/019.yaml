source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: vi
  text: 'Hãy biết điều này,[a] anh em yêu dấu của tôi: mỗi người hãy mau nghe, chậm nói, chậm giận.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em yêu dấu của tôi, anh em biết điều này.” Từ mở đầu trong tiếng Hy Lạp có thể được hiểu là câu trần thuật thay vì mệnh lệnh. “Anh em” ở đây cũng có thể chỉ cả anh chị em trong cộng đồng.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: Hãy biết điều này
  rationale: Dạng từ có thể được hiểu là mệnh lệnh “hãy biết” hoặc trần thuật “anh em biết.” Mạch khuyên bảo tiếp theo ủng hộ cách hiểu mệnh lệnh; “điều này” được thêm vào để diễn đạt tự nhiên chức năng chỉ xuất của câu.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: anh em yêu dấu của tôi
  rationale: “Anh em” giữ hình thức giống đực số nhiều của tiếng Hy Lạp nhưng trong lời xưng hô cộng đồng có thể bao gồm cả nam lẫn nữ; “yêu dấu” chuyển tải trực tiếp ἀγαπητοί với sắc thái trang trọng, trìu mến.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: mỗi người phải
  rationale: Mệnh lệnh ngôi thứ ba được diễn đạt tự nhiên trong tiếng Việt bằng “phải.” “Mỗi người” giữ ý nghĩa phân phối của πᾶς ἄνθρωπος mà không gây hiểu lầm rằng lời dạy chỉ dành cho nam giới. δέ là liên từ nhẹ nên không cần dịch bằng một từ đối lập mạnh.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: mau nghe
  rationale: Cách nói ngắn gọn, tự nhiên, giữ sát hình ảnh “nhanh trong việc nghe”; ở đây “nghe” hàm ý sẵn lòng lắng nghe.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: chậm nói
  rationale: Chuyển tải trực tiếp và tự nhiên cấu trúc tính từ cộng động từ nguyên mẫu.
- source_word: βραδὺς εἰς ὀργήν
  choice: chậm giận
  rationale: Diễn đạt thành ngữ Hy Lạp bằng cụm từ Việt ngắn gọn, thông dụng, không thu hẹp ὀργή thành riêng cơn thịnh nộ dữ dội.
theological_decisions:
- issue: Phạm vi giới tính của lời xưng hô và lời khuyên
  choice: Giữ “anh em” trong lời xưng hô, nhưng dịch πᾶς ἄνθρωπος là “mỗi người.”
  alternative: “Anh chị em yêu dấu của tôi”; hoặc “mỗi một người nam.”
  rationale: ἀδελφοί mang hình thức giống đực nhưng có thể chỉ toàn thể cộng đồng tín hữu, nên chú thích nêu rõ khả năng bao gồm cả chị em. ἄνθρωπος ở đây có lực khái quát chỉ con người nói chung; “mỗi người” là tiếng Việt chính xác và tự nhiên hơn, tránh áp đặt giới hạn chỉ nam giới.
- issue: Thức của Ἴστε
  choice: 'Hiểu là mệnh lệnh: “Hãy biết điều này.”'
  alternative: 'Hiểu là trần thuật: “Anh em biết điều này.”'
  rationale: Hình thái cho phép cả hai cách phân tích. Cách mệnh lệnh phù hợp với chuỗi khuyên bảo, nhưng sự mơ hồ thật của nguyên văn được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Nhịp ba vế “mau nghe, chậm nói, chậm giận” được giữ cô đọng để phản ánh cấu trúc song hành của nguyên văn.
