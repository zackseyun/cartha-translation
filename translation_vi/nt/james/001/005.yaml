id: JAS.1.5
reference: James 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: vi
  text: Nhưng nếu ai trong anh em thiếu sự khôn ngoan, người ấy hãy cầu xin Đức Chúa Trời, Đấng rộng rãi ban cho mọi người mà không trách móc, thì sự khôn ngoan sẽ được ban cho người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δέ
  choice: Nhưng nếu
  rationale: δέ nối với ý trước bằng một bước chuyển nhẹ; “Nhưng nếu” tự nhiên trong tiếng Việt và không làm sắc thái tương phản mạnh quá mức.
- source_word: τις ὑμῶν
  choice: ai trong anh em
  rationale: Giữ lối xưng hô trực tiếp với cộng đồng và diễn đạt tự nhiên cấu trúc bất định kèm sở hữu cách chỉ bộ phận.
- source_word: λείπεται σοφίας
  choice: thiếu sự khôn ngoan
  rationale: Diễn đạt sát nghĩa tình trạng cần có điều gì đó; không thu hẹp “sự khôn ngoan” chỉ vào một dạng hiểu biết cụ thể.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: người ấy hãy cầu xin Đức Chúa Trời
  rationale: Mệnh lệnh ngôi thứ ba được chuyển thành lời khuyên truyền lệnh tự nhiên; trong tiếng Việt, “cầu xin Đức Chúa Trời” đã hàm ý xin từ Ngài, nên không cần thêm giới từ.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Đức Chúa Trời, Đấng ... ban cho mọi người
  rationale: Giữ phân từ mô tả Đức Chúa Trời là Đấng ban cho, đồng thời bảo toàn phạm vi rộng của πᾶσιν.
- source_word: ἁπλῶς
  choice: rộng rãi
  rationale: Trong ngữ cảnh ban cho, từ này nhấn mạnh sự rộng lượng, không dè sẻn; “rộng rãi” là cách diễn đạt tự nhiên và trang trọng vừa phải.
- source_word: μὴ ὀνειδίζοντος
  choice: mà không trách móc
  rationale: Giữ ý Đức Chúa Trời không quở trách, làm nhục hay chì chiết người cầu xin; “trách móc” rõ nghĩa với độc giả hiện đại.
- source_word: δοθήσεται αὐτῷ
  choice: thì sự khôn ngoan sẽ được ban cho người ấy
  rationale: Làm rõ chủ thể ngầm của thể bị động là “sự khôn ngoan”, tránh đại từ “điều đó” thiếu tự nhiên trong tiếng Việt, và giữ lời hứa ở thể tương lai.
theological_decisions:
- issue: Các hình thức số ít mang nghĩa đại diện
  choice: ai ... người ấy ... người ấy
  alternative: người đó ... họ
  rationale: Tiếng Việt không bắt buộc đánh dấu giống; “người ấy” vừa giữ số ít đại diện của nguyên văn vừa bao gồm bất kỳ người nào trong cộng đồng.
- issue: Ý nghĩa cách ban cho của Đức Chúa Trời trong ἁπλῶς
  choice: rộng rãi
  alternative: đơn thành; không dè sẻn
  rationale: “Rộng rãi” truyền đạt đúng trọng tâm về sự ban cho không hạn hẹp, nhưng không đưa vào lời hứa vật chất hay một kết luận thần học vượt quá câu văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho lời xưng hô cộng đồng theo ngữ cảnh thư tín; dùng “người ấy” để giữ số ít đại diện mà không áp đặt giới tính. Không cần chú thích vì tiếng Việt tự nhiên đã bảo toàn các điểm chính và không phát sinh phương án từ vựng thiết yếu cần ghi chú.
