  source_fidelity: 'Bản dịch chuyển đạt đầy đủ mạch câu Hy Lạp: điều kiện “Nhưng nếu”, chủ ngữ bất định có tính đại diện “ai trong anh em”, tình trạng thiếu khôn ngoan, mệnh lệnh “hãy cầu xin”, đặc tính của Đức Chúa Trời là Đấng ban cho mọi người cách rộng rãi và không trách móc, cùng lời hứa tương lai ở thể bị động. Việc nêu rõ “sự khôn ngoan” ở vế cuối là làm sáng tỏ quy chiếu của δοθήσεται mà không thêm nghĩa.'
