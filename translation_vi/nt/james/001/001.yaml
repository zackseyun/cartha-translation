id: JAS.1.1
reference: James 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: vi
  text: Gia-cơ[a], nô lệ[b] của Đức Chúa Trời và của Chúa Giê-su, Đấng Mê-si-a[c], gửi đến mười hai chi phái ở trong cảnh lưu tán[d] lời chào thăm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hy Lạp này cũng có thể được thể hiện là “Gia-cốp”; “Gia-cơ” là tên gọi đã quen thuộc dành cho tác giả thư này trong tiếng Việt.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “tôi tớ” hoặc “đầy tớ”. Từ Hy Lạp chỉ một người thuộc về và ở dưới quyền của chủ; “nô lệ” giữ lại sắc thái mạnh ấy.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể gọi là “Đấng Christ”. Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng Mê-si-a”, tức Đấng Được Xức Dầu.
    reason: alternative_reading
  - marker: d
    text: Chỉ người Do Thái sống bên ngoài đất Ít-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Gia-cơ
  rationale: Dùng tên gọi đã quen thuộc trong Tân Ước tiếng Việt; hình thức Hy Lạp này về lịch sử tương ứng với tên Gia-cốp.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu trực tiếp với δοῦλος, không diễn giải thêm.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ tước hiệu chỉ thẩm quyền của Chúa Giê-su và cách dùng Tân Ước đã quen thuộc.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si
  rationale: Dịch Χριστός theo nghĩa tước hiệu là Đấng Mê-si, đồng thời diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc đồng vị.
- source_word: δοῦλος
  choice: nô lệ
  rationale: 'Giữ nghĩa mạnh của từ Hy Lạp: một người thuộc quyền sở hữu và thẩm quyền của chủ; ở đây từ này diễn tả sự hoàn toàn thuộc về Đức Chúa Trời và Chúa Giê-su.'
- source_word: ταῖς δώδεκα φυλαῖς
  choice: kính gửi mười hai chi phái
  rationale: Giữ nguyên ngôn ngữ giao ước gắn với mười hai chi phái Ít-ra-ên, đồng thời thể hiện tự nhiên người nhận thư trong tiếng Việt.
- source_word: διασπορᾷ
  choice: đang sống tản lạc
  rationale: Truyền đạt rõ ý những người thuộc dân Do Thái sống phân tán bên ngoài quê hương, thay vì dùng một danh từ kỹ thuật khó hiểu.
- source_word: χαίρειν
  choice: Kính chào!
  rationale: Đây là công thức chào mở đầu thư trong tiếng Hy Lạp, không phải một mệnh lệnh theo nghĩa đen là hãy vui mừng.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong lời tự giới thiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Giữ rõ chức danh của Chúa Giê-su thay vì để từ này chỉ được hiểu như một thành tố của tên riêng; chú thích bảo lưu cách gọi quen thuộc khác.
- issue: Cách dịch δοῦλος trong lời tự giới thiệu của Gia-cơ
  choice: nô lệ
  alternative: tôi tớ; đầy tớ
  rationale: Chọn từ mạnh hơn để giữ ý thuộc trọn quyền của một chủ trong nguyên ngữ, dù các từ nhẹ hơn có thể tự nhiên hơn trong văn phong tôn giáo tiếng Việt.
- issue: Đối tượng được gọi là mười hai chi phái
  choice: giữ nguyên cách gọi “mười hai chi phái”
  alternative: diễn giải thành toàn thể dân Chúa hoặc các tín hữu
  rationale: Không giải quyết thay cho độc giả câu hỏi thần học về phạm vi người nhận; giữ nguyên hình ảnh Ít-ra-ên trong câu Hy Lạp.
translation_notes:
  register: Văn phong trang trọng nhưng trực tiếp, phù hợp phần mở đầu một bức thư. “Kính gửi” và “Kính chào” là những công thức thư tín hiện đại, dễ hiểu; “nô lệ” được giữ vì độ mạnh của nguyên ngữ dù gây cảm giác gay gắt hơn “tôi tớ”. Tên riêng được viết theo lối phiên âm tiếng Việt phổ biến.
