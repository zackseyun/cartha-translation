  to: Gia-cơ[a], nô lệ[b] của Đức Chúa Trời và của Chúa Giê-su, Đấng Mê-si-a[c], gửi đến mười hai chi phái ở trong cảnh lưu tán[d] lời chào thăm.
  rationale: Bản sửa giữ lựa chọn “nô lệ” và dịch tước hiệu Χριστός là “Đấng Mê-si-a”, đồng thời phục hồi sắc thái danh ngữ của διασπορά và dùng công thức mở thư tiếng Việt không thêm kính ngữ. Không thay đổi phạm vi mơ hồ của “mười hai chi phái”.
