  source_fidelity: 'Bản nháp truyền đạt đúng hướng chính: ὑπομονή là sự bền chí dưới thử thách, và τέλειοι/ὁλόκληροι được phân biệt hợp lý là “trưởng thành và toàn vẹn”. Tuy nhiên, “hoàn tất công việc của mình” khiến sự kiên trì có vẻ tự nó hoàn thành một công việc, trong khi mệnh lệnh ἔργον τέλειον ἐχέτω yêu cầu để sự kiên trì phát huy/đạt được kết quả trọn vẹn của nó. “Không thiếu sót điều gì” cũng dễ gợi ý không phạm sai sót, thay vì không thiếu hụt về bất cứ phương diện nào.'
  naturalness: 'Câu sửa dùng cách nói hiện đại, rõ nghĩa: “phát huy trọn vẹn tác dụng” diễn đạt tự nhiên thành ngữ Hy Lạp mà không quá văn chương; “không thiếu thốn điều gì” tránh nghĩa lệch của “thiếu sót”. “Anh chị em” duy trì lối xưng hô cộng đồng phù hợp với số nhiều ἦτε.'
  terminology: “Sự kiên trì”, “trưởng thành”, và “toàn vẹn” phù hợp ngữ cảnh và không áp đặt cách hiểu giáo phái. Chú thích được chỉnh để giải thích cụm ἔργον τέλειον và sự liên hệ giữa τέλειον với ὁλόκληροι, thay vì đưa ra một phương án Việt ngữ không tự nhiên.
  issues:
