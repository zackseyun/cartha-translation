id: JAS.1.4
reference: James 1:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: vi
  text: Hãy để sự kiên trì phát huy trọn vẹn tác dụng của nó[a], để anh chị em trở nên trưởng thành và toàn vẹn, không thiếu thốn điều gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát hơn: “có một công việc trọn vẹn.” Cụm Hy Lạp diễn tả việc sự kiên trì đạt được kết quả trọn vẹn của nó; các từ liên hệ trong câu nói đến sự đạt tới mục đích và sự nguyên vẹn trong mọi phương diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: sự kiên trì
  rationale: Chỉ sự bền lòng đứng vững dưới thử thách trong ngữ cảnh Gia-cơ 1:3–4; “kiên trì” tự nhiên và chủ động hơn “kiên nhẫn” trong tiếng Việt hiện đại.
- source_word: ἔργον τέλειον ἐχέτω
  choice: hãy để ... hoàn tất công việc của mình
  rationale: Giữ lực mệnh lệnh của ἐχέτω, hình ảnh “công việc” của ἔργον và ý đạt đến mục tiêu/trọn vẹn của τέλειον, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἵνα ἦτε
  choice: để ... được
  rationale: Diễn đạt rõ quan hệ mục đích hoặc kết quả mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: τέλειοι
  choice: trưởng thành
  rationale: Khi nói về con người, từ này có thể chỉ sự đạt đến mức trưởng thành theo mục đích, không nhất thiết khẳng định sự hoàn hảo tuyệt đối hay vô tội.
- source_word: ὁλόκληροι
  choice: toàn vẹn
  rationale: Nhấn mạnh tình trạng nguyên vẹn, đầy đủ trong mọi phần và giữ được sự phân biệt với τέλειοι.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: không thiếu sót điều gì
  rationale: Giữ sức khái quát của ἐν μηδενί và diễn đạt tự nhiên ý không bị thiếu hụt ở bất cứ phương diện nào.
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: δέ nối tiếp lập luận hơn là tạo tương phản mạnh; trong tiếng Việt, mở đầu trực tiếp bằng mệnh lệnh tự nhiên hơn và quan hệ nối tiếp vẫn rõ từ ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của τέλειοι trong bối cảnh trưởng thành thuộc linh
  choice: trưởng thành
  alternative: hoàn hảo
  rationale: “Trưởng thành” chuyển tải ý đạt đến mục tiêu mà không tự động biến câu này thành khẳng định về sự hoàn hảo vô tội; chú thích vẫn bảo lưu khả năng dịch sát hơn là “hoàn thiện”.
- issue: Quan hệ giữa sự kiên trì và kết quả được mô tả
  choice: hoàn tất công việc của mình
  alternative: có công việc hoàn hảo
  rationale: Cách chọn này giữ sự kiên trì làm chủ thể hoạt động và nêu tiến trình đi đến kết quả, nhưng không xác định quá mức cơ chế thần học của sự trưởng thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng độc giả số nhiều; tránh cách diễn đạt cổ hoặc thuật ngữ giáo phái.
