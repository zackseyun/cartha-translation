    rationale: Cấu trúc này có nghĩa đen là “hãy để sự kiên trì có một công việc/kết quả trọn vẹn”; trong ngữ cảnh, ý là để sự kiên trì hoàn tất tác dụng hoặc kết quả của nó, không phải rằng nó “hoàn tất công việc” như một đối tượng độc lập.
