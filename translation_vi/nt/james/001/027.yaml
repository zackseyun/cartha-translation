id: JAS.1.27
reference: James 1:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: vi
  text: 'Sự sùng kính thanh sạch và không ô uế trước mặt Đức Chúa Trời là Cha là thế này: chăm sóc trẻ mồ côi và các góa phụ trong cảnh hoạn nạn của họ[a], và giữ mình không bị thế gian làm hoen ố[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thăm viếng trẻ mồ côi và các góa phụ trong cảnh hoạn nạn của họ”; động từ Hy Lạp có thể bao hàm cả việc đến thăm lẫn tích cực chăm nom, trợ giúp.
    reason: lexical_alternative
  - marker: b
    text: “Thế gian” ở đây nói đến trật tự đạo đức hư hoại chống nghịch Đức Chúa Trời, chứ không phải chính công trình sáng tạo.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: sự thờ phượng
  rationale: Từ này chỉ sự sùng kính được thể hiện ra bằng việc thực hành tôn giáo. “Sự thờ phượng” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt và phù hợp với trọng tâm của Gia-cơ về lòng tin được bày tỏ bằng hành động.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: thanh sạch và không ô uế
  rationale: Giữ lại hai tính từ song song, vừa diễn tả sự tinh sạch vừa nhấn mạnh không bị làm ô nhiễm về phương diện đạo đức và tôn giáo.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: trước mặt Đức Chúa Trời, là Cha
  rationale: παρά với cách ba diễn tả sự đánh giá trong cái nhìn hoặc trước sự hiện diện của Đức Chúa Trời. Cách dịch này hiểu “Cha” là danh xưng đồng vị với “Đức Chúa Trời” mà không thêm “chúng ta”, vốn không có trong câu Hy Lạp.
- source_word: ἐπισκέπτεσθαι
  choice: chăm sóc
  rationale: Trong ngữ cảnh này, động từ không chỉ nói đến việc đến thăm mà còn bao hàm sự quan tâm và trợ giúp thiết thực; sắc thái “thăm viếng” được giữ trong chú thích.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: trẻ mồ côi và các góa phụ
  rationale: Các từ tương đương trực tiếp, tự nhiên trong tiếng Việt, chỉ hai nhóm người đặc biệt dễ bị tổn thương trong xã hội.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: trong cảnh hoạn nạn của họ
  rationale: θλῖψις chỉ cảnh khốn khó, đau khổ hoặc áp bức. “Cảnh hoạn nạn” giữ được mức độ nghiêm trọng và sắc thái trang trọng mà vẫn dễ hiểu.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: giữ mình không bị ... làm hoen ố
  rationale: Diễn đạt tự nhiên hình ảnh một người chủ động gìn giữ bản thân khỏi sự ô nhiễm về đạo đức; “mình” mang ý nghĩa khái quát, không giới hạn ở nam giới.
- source_word: ἀπὸ τοῦ κόσμου
  choice: bị thế gian làm
  rationale: Giữ danh từ “thế gian” trong chính văn, đồng thời cấu trúc tiếng Việt làm rõ nguồn gây hoen ố mà không giải nghĩa quá mức ngay trong câu.
theological_decisions:
- issue: Ý nghĩa của κόσμος trong ngữ cảnh đạo đức
  choice: Giữ “thế gian” trong chính văn và giải thích bằng chú thích rằng ở đây từ này nói đến trật tự đạo đức hư hoại chống nghịch Đức Chúa Trời.
  alternative: sự hư hoại của thế gian; xã hội thế tục
  rationale: Cách dịch sát danh từ Hy Lạp bảo toàn sức căng thần học và không khiến người đọc hiểu rằng chính công trình sáng tạo hay toàn bộ xã hội tự thân là ô uế.
- issue: Quan hệ giữa θεῷ và πατρὶ
  choice: 'Đọc “Cha” như danh xưng đồng vị: “Đức Chúa Trời, là Cha”.'
  alternative: Đức Chúa Trời và Cha; Đức Chúa Trời, Cha chúng ta
  rationale: Một mạo từ chung với hai danh từ ủng hộ cách hiểu cùng một Đấng; không thêm đại từ sở hữu không có trong nguyên văn.
- issue: Ý nghĩa khái quát của ἑαυτόν
  choice: Dịch là “mình”.
  alternative: chính mình; bản thân người ấy
  rationale: Dạng giống đực số ít trong tiếng Hy Lạp nêu một nguyên tắc áp dụng chung; “mình” truyền đạt tự nhiên tính khái quát ấy trong tiếng Việt.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc định nghĩa của nguyên văn và nhịp song song giữa việc chăm sóc người dễ bị tổn thương với việc gìn giữ sự trong sạch về đạo đức.
