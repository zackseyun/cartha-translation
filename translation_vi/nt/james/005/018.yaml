  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: vi
  text: Ông lại cầu nguyện, bầu trời cho mưa xuống[a], và đất sinh ra hoa lợi của nó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trời cho mưa” hoặc “bầu trời ban mưa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đất làm nảy sinh sản vật của nó” hoặc “đất sinh ra mùa màng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả hành động được lặp lại, tự nhiên và gọn trong tiếng Việt; liên kết với lần cầu nguyện trước của Ê-li trong câu 17.
- source_word: προσηύξατο
  choice: ông cầu nguyện
  rationale: Động từ chỉ đơn giản hành động cầu nguyện. Không thêm ý “tha thiết”, vì sắc thái ấy thuộc cách diễn đạt ở câu 17 chứ không có trong động từ tại đây.
- source_word: ὁ οὐρανὸς
  choice: trời
  rationale: Trong ngữ cảnh thời tiết, từ này chỉ bầu trời; “trời” là cách nói tự nhiên trong tiếng Việt và vẫn giữ được độ mở từ vựng của οὐρανός.
- source_word: ὑετὸν ἔδωκεν
  choice: ban mưa
  rationale: Giữ hình ảnh sát với nghĩa đen “cho mưa” nhưng dùng cách kết hợp từ trang trọng, tự nhiên hơn trong tiếng Việt. Không đổi thành “Đức Chúa Trời ban mưa”, vì chủ ngữ trong câu Hy Lạp là “trời”.
- source_word: ἡ γῆ
  choice: đất
  rationale: Phù hợp với γῆ trong ngữ cảnh nông nghiệp, đồng thời tạo thế song song với “trời”.
- source_word: ἐβλάστησεν
  choice: sinh ra
  rationale: Chuyển tải ý đất làm nảy sinh hoặc sản sinh hoa lợi, vừa tự nhiên vừa giữ hình ảnh hữu cơ của động từ βλαστάνω.
- source_word: τὸν καρπὸν αὐτῆς
  choice: hoa lợi của mình
  rationale: καρπός ở đây chỉ sản vật hoặc mùa màng do đất sinh ra. “Hoa lợi” rộng hơn “mùa màng” và tự nhiên hơn cách dịch máy móc “trái của nó”.
theological_decisions:
- issue: Mối liên hệ giữa lời cầu nguyện của Ê-li và sự đáp lời của Đức Chúa Trời
  choice: 'Giữ cách diễn đạt của nguyên văn: trời ban mưa và đất sinh hoa lợi, không nói rõ thêm chủ thể thần linh.'
  alternative: Dịch giải thích rằng Đức Chúa Trời ban mưa để đáp lời Ê-li.
  rationale: Ngữ cảnh hàm ý hành động của Đức Chúa Trời, nhưng chính câu này mô tả kết quả bằng cách lấy “trời” và “đất” làm chủ thể. Bản dịch không nên thêm điều nguyên văn không nói trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để nối tự nhiên với Ê-li trong ngữ cảnh trước; “trời ban mưa” giữ cấu trúc giàu hình ảnh của nguyên văn mà không thêm lời giải thích thần học.
