  to: Ông lại cầu nguyện, bầu trời cho mưa xuống[a], và đất sinh ra hoa lợi của nó[b].
  rationale: Đổi “trời ban mưa” thành “bầu trời cho mưa xuống” để phân biệt rõ chủ ngữ thời tiết với cách gọi thần linh có thể có của “Trời,” đồng thời bảo toàn cách diễn đạt ‘cho mưa’ của ὑετὸν ἔδωκεν. Các phần còn lại chỉ được chỉnh nhẹ cho sát nghĩa sở hữu và mạch văn tiếng Việt.
