revisions:
- from: Ê-li là một người có cùng bản tính như chúng ta[a]. Ông đã tha thiết cầu nguyện cho trời đừng mưa, và trời đã không mưa xuống đất trong ba năm sáu tháng.
  to: Ê-li cũng là một người như chúng ta[a]. Ông đã cầu nguyện tha thiết để trời không mưa, và trời đã không mưa trên đất suốt ba năm sáu tháng.
  rationale: Sửa cách diễn đạt về nhân tính chung của Ê-li cho tự nhiên hơn và tránh sắc thái bản thể học không cần thiết; sửa “xuống đất” thành “trên đất” để phản ánh đúng chức năng chỉ phạm vi của ἐπὶ τῆς γῆς. Các thành tố khác của bản nháp được giữ nguyên ý nghĩa.
  reviewer_model: gpt-5.6-terra
