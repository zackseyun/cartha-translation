  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: vi
  text: Ê-li cũng là một người như chúng ta[a]. Ông đã cầu nguyện tha thiết để trời không mưa, và trời đã không mưa trên đất suốt ba năm sáu tháng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có cùng thân phận như chúng ta,” hoặc “có những cảm xúc, dục vọng giống như chúng ta.”'
    reason: Nêu các sắc thái có thể có của ὁμοιοπαθὴς mà bản văn chính không thể hiện hết.
lexical_decisions:
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, chỉ nhà tiên tri Elijah.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Diễn đạt tự nhiên trong tiếng Việt và nhấn mạnh Ê-li là một con người, không cần lặp lại giới tính vốn đã rõ từ nhân vật.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: có cùng bản tính như chúng ta
  rationale: Giữ nghĩa rộng về việc cùng chia sẻ bản tính và thân phận con người, không thu hẹp từ này chỉ vào cảm xúc hay dục vọng.
- source_word: προσευχῇ προσηύξατο
  choice: đã tha thiết cầu nguyện
  rationale: Cấu trúc đồng căn trong tiếng Hy Lạp nhấn mạnh hành động cầu nguyện; “tha thiết cầu nguyện” vừa tự nhiên vừa chuyển tải được sắc thái nhấn mạnh.
- source_word: τοῦ μὴ βρέξαι
  choice: cho trời đừng mưa
  rationale: Diễn đạt nội dung điều Ê-li cầu xin bằng cấu trúc tiếng Việt tự nhiên.
- source_word: οὐκ ἔβρεξεν
  choice: trời đã không mưa
  rationale: Cách nói vô nhân xưng tự nhiên trong tiếng Việt, tương ứng với động từ chỉ mưa trong ngữ cảnh.
- source_word: ἐπὶ τῆς γῆς
  choice: xuống đất
  rationale: γῆ có thể chỉ đất, xứ hoặc trái đất; “xuống đất” hợp với cách nói về mưa và tránh áp đặt phạm vi toàn cầu.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: trong ba năm sáu tháng
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài của hạn hán.
theological_decisions:
- issue: Ý nghĩa của ὁμοιοπαθὴς khi nói về nhân tính của Ê-li
  choice: Ê-li có cùng bản tính và thân phận con người như độc giả
  alternative: Ê-li có cùng cảm xúc hoặc đam mê như chúng ta
  rationale: Ngữ cảnh dùng sự tương đồng giữa Ê-li và độc giả để khích lệ việc cầu nguyện. Bản dịch giữ nghĩa rộng của từ, không giới hạn nó vào đời sống cảm xúc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ê-li” là dạng tên quen thuộc; câu văn giữ sự nhấn mạnh vào lời cầu nguyện và nhân tính chung của nhà tiên tri.
