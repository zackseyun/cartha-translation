reference: James 5:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: vi
  text: Vàng bạc của anh em đã bị ăn mòn,[a] và sự ăn mòn của chúng sẽ làm chứng chống lại anh em và sẽ ăn thịt anh em như lửa.[b] Anh em đã tích trữ của cải trong những ngày cuối cùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Vàng bạc của anh em đã bị gỉ.” Động từ Hy Lạp có thể chỉ sự gỉ sét hoặc ăn mòn nói chung; “ăn mòn” phù hợp hơn khi nói về cả vàng lẫn bạc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu “như lửa” đi với mệnh đề sau: “Anh em đã tích trữ như lửa trong những ngày cuối cùng.” Cách hiểu này có thể có nghĩa việc tích trữ ấy dẫn đến sự phán xét như lửa; tuy nhiên, cách liên kết “như lửa” với “sẽ ăn thịt anh em” tự nhiên hơn trong ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: đã bị ăn mòn
  rationale: Thì hoàn thành diễn tả tình trạng hiện tại do một tiến trình trước đó gây nên. “Bị ăn mòn” phù hợp với cả vàng lẫn bạc hơn “bị gỉ,” đồng thời giữ hình ảnh của cải đang hư hoại.
- source_word: ὁ ἰὸς αὐτῶν
  choice: lớp gỉ của chúng
  rationale: Trong ngữ cảnh kim loại, ἰός chỉ sản phẩm hoặc dấu vết ăn mòn. “Lớp gỉ” cụ thể, dễ hiểu và vẫn giữ sự liên hệ từ vựng với động từ κατίωται, dù cách nói này không nhằm mô tả khoa học chính xác riêng cho vàng.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: sẽ làm chứng chống lại anh em
  rationale: Giữ hình ảnh pháp lý và danh từ μαρτύριον gần với nguyên văn; “chống lại” thể hiện rõ tác dụng bất lợi trong ngữ cảnh phán xét.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: sẽ ăn thịt anh em
  rationale: Giữ nguyên hình ảnh dữ dội, cụ thể của động từ “ăn” và danh từ số nhiều “các phần thịt,” nhưng diễn đạt tự nhiên trong tiếng Việt bằng “thịt anh em.”
- source_word: ὡς πῦρ
  choice: như lửa
  rationale: Cách hiểu tự nhiên nhất là cụm này bổ nghĩa cho mệnh đề ngay trước, mô tả lớp gỉ ăn thịt họ như lửa; khả năng gắn với mệnh đề sau được ghi ở chú thích.
- source_word: ἐθησαυρίσατε
  choice: đã tích trữ của cải
  rationale: Động từ mang ý tích chứa kho báu hoặc của cải. “Tích trữ của cải” truyền đạt nội dung từ vựng mà không thêm sắc thái mạnh như “tham lam vơ vét.”
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: trong những ngày cuối cùng
  rationale: Đây là cách diễn đạt trực tiếp, quen thuộc cho thành ngữ cánh chung, không thêm đại từ chỉ định không có trong tiếng Hy Lạp.
theological_decisions:
- issue: Quan hệ cú pháp của ὡς πῦρ
  choice: 'Gắn với mệnh đề trước: lớp gỉ sẽ ăn thịt họ “như lửa.”'
  alternative: 'Gắn với mệnh đề sau: “Anh em đã tích trữ [của cải/lửa] trong những ngày cuối cùng.”'
  rationale: Vị trí gần và ý nghĩa mạch lạc nghiêng về việc gắn với φάγεται. Tuy nhiên, dấu câu không thuộc bản văn nguyên thủy và cách gắn với mệnh đề sau có lịch sử giải thích đáng kể, nên được bảo lưu trong chú thích.
- issue: Tính chất của sự “làm chứng”
  choice: Diễn đạt theo nghĩa pháp lý là “làm chứng chống lại anh em.”
  alternative: “Sẽ là bằng chứng buộc tội anh em.”
  rationale: Cả hai đều phù hợp với bối cảnh phán xét; bản dịch chính giữ gần hình ảnh nhân cách hóa của μαρτύριον mà không xác định thêm cơ chế hay thời điểm phán xét.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực diện. Dùng “anh em” theo cách xưng hô cộng đồng quen thuộc trong thư tín Tân Ước. Hình ảnh “ăn thịt” được giữ vì tính chất tiên tri mạnh của nguyên văn; không làm nhẹ thành “hủy hoại thân thể.”
