    rationale: 'ἐκ πλάνης ὁδοῦ αὐτοῦ bổ nghĩa cho đối tượng ἁμαρτωλόν được quay lại: người có tội được đưa quay lại khỏi sự lầm lạc trong đường lối của mình.'
  - severity: low
    issue: “Vô số tội lỗi” có thể cường điệu hóa πλῆθος.
    rationale: πλῆθος nghĩa là số đông, số lượng lớn; “rất nhiều” truyền đạt phạm vi này mà không nhất thiết hàm ý không đếm được.
  - severity: low
