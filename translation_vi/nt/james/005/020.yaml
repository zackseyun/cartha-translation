id: JAS.5.20
reference: James 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: vi
  text: Người ấy hãy biết rằng ai đưa một người có tội quay lại từ con đường lầm lạc của người ấy thì sẽ cứu linh hồn người ấy khỏi sự chết[a][b] và che phủ rất nhiều tội lỗi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sẽ cứu mạng sống người ấy khỏi cái chết.” Từ Hy Lạp được dịch là “linh hồn” cũng có thể có nghĩa là “mạng sống.”
    reason: lexical_alternative
  - marker: b
    text: “Người ấy” ở đây có thể chỉ người có tội được đưa quay lại; cũng có thể được hiểu là chỉ người đưa người có tội ấy quay lại.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: Người ấy hãy biết
  rationale: Động từ mệnh lệnh ngôi ba số ít được diễn đạt bằng cấu trúc khuyên bảo tự nhiên trong tiếng Việt, tiếp nối người được nói đến ở câu trước.
- source_word: ὁ ἐπιστρέψας
  choice: ai đưa ... trở lại
  rationale: Phân từ có mạo từ mang nghĩa khái quát. “Đưa ... trở lại” diễn tả sự phục hồi một người đã lạc đường mà không biến từ này thành một thuật ngữ giáo phái.
- source_word: ἁμαρτωλὸν
  choice: một người có tội
  rationale: Cách nói hiện đại, dễ hiểu, giữ ý chỉ một người thuộc phạm trù những người phạm tội; tự nhiên hơn “một tội nhân” trong văn phong phổ thông hiện nay.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: lìa khỏi con đường lầm lạc của người đó
  rationale: Giữ hình ảnh ẩn dụ về con đường sống và sắc thái sai lạc của πλάνη. “Lìa khỏi” làm rõ hướng quay trở lại được cấu trúc Hy Lạp diễn tả.
- source_word: σώσει
  choice: sẽ cứu
  rationale: Giữ nguyên sức nặng và phạm vi nghĩa của động từ σῴζω.
- source_word: ψυχὴν αὐτοῦ
  choice: linh hồn người đó
  rationale: “Linh hồn” bảo toàn nghĩa từ vựng quen thuộc của ψυχή; đại từ được diễn đạt tự nhiên theo cách hiểu gần nhất về mặt ngữ cảnh, còn khả năng quy chiếu khác và nghĩa “mạng sống” được ghi chú.
- source_word: ἐκ θανάτου
  choice: khỏi sự chết
  rationale: Giữ cách nói rộng của nguyên văn, không tự giới hạn vào cái chết thể xác hay thuộc linh.
- source_word: καλύψει
  choice: che phủ
  rationale: Bảo toàn hình ảnh Kinh Thánh của καλύπτω thay vì giải nghĩa thành “tha thứ” hoặc “xóa bỏ”.
- source_word: πλῆθος ἁμαρτιῶν
  choice: vô số tội lỗi
  rationale: Diễn đạt tự nhiên ý một số lượng rất lớn, đồng thời giữ giọng văn trang trọng.
theological_decisions:
- issue: Đối tượng mà αὐτοῦ trong ψυχὴν αὐτοῦ quy chiếu đến
  choice: Trong chính văn, “người đó” được hiểu tự nhiên nhất là người có tội được đưa trở lại
  alternative: Đại từ có thể chỉ người đưa người có tội trở lại
  rationale: Tiếng Việt không có đại từ sở hữu tương ứng vừa tự nhiên vừa giữ trọn độ mơ hồ của tiếng Hy Lạp. Chính văn dùng cách quy chiếu gần và hợp ngữ cảnh hơn; chú thích công khai bảo tồn cách hiểu còn lại.
- issue: Ý nghĩa của ψυχή và θάνατος
  choice: “linh hồn ... khỏi sự chết” được giữ theo nghĩa rộng
  alternative: “mạng sống ... khỏi cái chết”
  rationale: Nguyên văn có thể liên quan đến sự bảo toàn mạng sống, sự cứu rỗi khỏi cái chết thuộc linh, hoặc cả hai; bản dịch không thu hẹp câu vào một hệ thống giáo lý.
- issue: Ý nghĩa của καλύψει πλῆθος ἁμαρτιῶν
  choice: giữ thành ngữ “che phủ vô số tội lỗi”
  alternative: diễn giải là “khiến vô số tội lỗi được tha”
  rationale: Nguyên văn không xác định tường minh cơ chế, chủ thể cuối cùng hay những tội lỗi thuộc về ai; giữ hình ảnh “che phủ” tránh giải quyết thay cho văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Bản dịch giữ hình ảnh “con đường,” “sự chết” và “che phủ” của nguyên văn; tránh thuật ngữ giáo phái và không xác định quá mức những điểm thần học mà câu Hy Lạp để ngỏ.
