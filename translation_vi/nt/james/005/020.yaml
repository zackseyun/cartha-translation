revisions:
- from: Người ấy hãy biết rằng ai đưa một người có tội trở lại, lìa khỏi con đường lầm lạc của người đó, thì sẽ cứu linh hồn người đó khỏi sự chết[a][b] và che phủ vô số tội lỗi.
  to: Người ấy hãy biết rằng ai đưa một người có tội quay lại từ con đường lầm lạc của người ấy thì sẽ cứu linh hồn người ấy khỏi sự chết[a][b] và che phủ rất nhiều tội lỗi.
