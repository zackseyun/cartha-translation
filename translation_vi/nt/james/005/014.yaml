  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt chính xác các thành phần chính của câu Hy Lạp: câu hỏi về người đau ốm trong cộng đồng; mệnh lệnh người ấy mời các trưởng lão của Hội Thánh; các trưởng lão cầu nguyện trên người ấy; và hành động xức dầu nhân danh Chúa. “Đau ốm” phù hợp nhất với ngữ cảnh trước mắt, đồng thời chú thích a bảo lưu cách hiểu rộng hơn của ἀσθενεῖ. “Cầu nguyện trên người ấy” giữ được sắc thái không gian của ἐπ’ αὐτόν mà không diễn giải quá mức. Cụm “nhân danh Chúa” được giữ trung tính về phạm vi bổ nghĩa và thần học.'
