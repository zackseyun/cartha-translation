id: JAS.5.14
reference: James 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: vi
  text: Trong anh em có ai đau ốm[a] không? Người ấy hãy mời các trưởng lão của Hội Thánh đến; họ hãy cầu nguyện trên người ấy và xức dầu cho người ấy[b] nhân danh Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “yếu đuối”. Động từ Hy Lạp có thể chỉ sự yếu đuối theo nghĩa rộng hơn, nhưng ở đây có lẽ nói đến bệnh tật vì ngữ cảnh đề cập việc cầu nguyện, xức dầu và chữa lành trong câu kế tiếp.
    reason: lexical_alternative
  - marker: b
    text: Việc xức dầu có thể được hiểu là có tính chữa trị, tượng trưng, hoặc cả hai; chính câu này không nói rõ cơ chế hay ý nghĩa cụ thể của hành động ấy.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: đau ốm
  rationale: Trong ngữ cảnh cầu nguyện, xức dầu và việc người bệnh được chữa lành ở câu kế tiếp, động từ này chủ yếu chỉ bệnh tật thể chất; chú thích vẫn giữ nghĩa rộng hơn là “yếu đuối”.
- source_word: τις
  choice: có ai
  rationale: Giữ sắc thái phiếm chỉ, bao gồm bất cứ người nào trong cộng đồng, đồng thời tự nhiên trong câu hỏi tiếng Việt.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Diễn đạt tự nhiên tư cách thuộc cộng đồng đang được tác giả ngỏ lời.
- source_word: προσκαλεσάσθω
  choice: hãy mời … đến
  rationale: Truyền đạt rõ mệnh lệnh ngôi thứ ba và ý gọi các trưởng lão đến với người bệnh.
- source_word: τοὺς πρεσβυτέρους
  choice: các trưởng lão
  rationale: Cụm từ đi với “Hội Thánh” chỉ những người lãnh đạo được công nhận trong cộng đồng, không chỉ những người lớn tuổi.
- source_word: τῆς ἐκκλησίας
  choice: của Hội Thánh
  rationale: “Hội Thánh” là cách gọi rõ ràng, trang trọng và quen thuộc đối với cộng đồng tín hữu trong ngữ cảnh này.
- source_word: προσευξάσθωσαν
  choice: họ hãy cầu nguyện
  rationale: Giữ trực tiếp lực mệnh lệnh của động từ Hy Lạp và chủ thể số nhiều là các trưởng lão.
- source_word: ἐπ’ αὐτόν
  choice: trên người ấy
  rationale: Giữ hình ảnh không gian của ἐπί trong ngữ cảnh cầu nguyện cho người bệnh, thay vì giản lược thành “cho người ấy”.
- source_word: ἀλείψαντες
  choice: xức dầu cho
  rationale: Diễn đạt hành động thoa dầu mà không xác định đó là phương thuốc, biểu tượng hay nghi thức mang cơ chế đặc biệt.
- source_word: ἐλαίῳ
  choice: dầu
  rationale: Bản Hy Lạp nói chung là dầu; không thêm “ô-liu” dù đó thường là loại dầu được dùng trong thế giới Địa Trung Hải cổ đại.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: nhân danh Chúa
  rationale: Cách nói tự nhiên và trang trọng trong tiếng Việt, giữ mối liên hệ với danh, thẩm quyền và thân vị của Chúa.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ tước hiệu κύριος theo cách dùng Kitô giáo quen thuộc mà không diễn giải thêm căn tính ngay trong câu.
theological_decisions:
- issue: Nghĩa của ἀσθενεῖ trong ngữ cảnh
  choice: Đau ốm về thể chất là nghĩa chính trong câu
  alternative: Yếu đuối nói chung hoặc yếu đuối thuộc linh
  rationale: Việc mời các trưởng lão, cầu nguyện, xức dầu và ngôn ngữ chữa lành ở câu kế tiếp nghiêng về bệnh tật thể chất, nhưng chú thích vẫn bảo lưu phạm vi nghĩa rộng của từ.
- issue: Chức năng của việc xức dầu
  choice: Dịch trung tính là “xức dầu” mà không xác định cơ chế
  alternative: Ứng dụng y dược, hành động biểu tượng, hoặc nghi thức bí tích
  rationale: Bản Hy Lạp nêu hành động nhưng không giải thích chức năng hay cơ chế thần học của hành động ấy; bản dịch không áp đặt một cách hiểu hệ phái.
- issue: Cách diễn đạt giống của các hình thức số ít
  choice: Dùng “có ai” và lặp lại “người ấy”
  alternative: Dùng đại từ mang giới tính nam hoặc diễn đạt hoàn toàn số nhiều
  rationale: Tiếng Việt không buộc phải đánh dấu giống ở đây. “Người ấy” giữ mạch quy chiếu số ít của bản Hy Lạp mà không thêm giới tính vốn không cần thiết để truyền đạt ý câu.
- issue: Phạm vi bổ nghĩa của “nhân danh Chúa”
  choice: Giữ cụm từ ở cuối câu, gần hành động xức dầu như trật tự Hy Lạp
  alternative: Gắn rõ cụm từ với cả cầu nguyện lẫn xức dầu
  rationale: Vị trí trong tiếng Hy Lạp gần hành động xức dầu, nhưng cụm cuối câu cũng có thể được người đọc hiểu trong toàn bộ hành động của các trưởng lão; bản dịch không cưỡng ép giải quyết phạm vi bổ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” giữ lối xưng hô cộng đồng quen thuộc; “người ấy” tránh lặp đại từ có giới tính không cần thiết trong tiếng Việt. Dấu chấm phẩy phân tách mệnh lệnh dành cho người bệnh với mệnh lệnh dành cho các trưởng lão.
