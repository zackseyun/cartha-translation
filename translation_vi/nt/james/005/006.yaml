  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: vi
  text: Các người đã kết án, đã sát hại người công chính.[a] Người ấy không chống lại các người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp có nghĩa là “người công chính”. Một số nhà giải nghĩa cho rằng đây có thể là tiếng vọng nhắc đến Chúa Giê-su, “Đấng Công Chính”; tuy nhiên, ngữ cảnh trực tiếp cũng phù hợp với cách hiểu rằng đây là một người công chính tiêu biểu bị những kẻ giàu áp bức.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch theo hình thức câu hỏi trong bản Hy Lạp: “Người ấy chẳng chống lại các người sao?” Mệnh đề này có thể là một câu hỏi tu từ mang ý nghĩa như trong bản văn chính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: đã kết án
  rationale: Động từ aorist chủ động, ngôi thứ hai số nhiều, mang sắc thái pháp lý rõ ràng. “Đã kết án” vừa trực tiếp vừa tự nhiên trong tiếng Việt.
- source_word: ἐφονεύσατε
  choice: đã sát hại
  rationale: φονεύω chỉ việc giết người với sức nặng luân lý của hành vi bất chính. “Sát hại” mạnh hơn “giết” và phù hợp với lời tố cáo trong ngữ cảnh.
- source_word: τὸν δίκαιον
  choice: người công chính
  rationale: Tính từ giống đực số ít có mạo từ được dùng như danh từ. “Người công chính” giữ nguyên số ít và không xác quyết đây là một danh hiệu riêng, nên vẫn có thể chỉ một người tiêu biểu bị áp bức.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Người ấy không chống lại các người
  rationale: ἀντιτάσσομαι có nghĩa là tự đặt mình đối nghịch, chống lại hoặc kháng cự. Cách diễn đạt này giữ chủ thể số ít và truyền đạt tự nhiên cách hiểu mệnh đề như một câu hỏi tu từ có ý phủ định.
- source_word: ὑμεῖς / ὑμῖν
  choice: các người / các người
  rationale: Đại từ ngôi thứ hai số nhiều hướng thẳng đến những kẻ giàu áp bức. “Các người” duy trì giọng quở trách và tránh hàm ý thân tình không có trong lời tố cáo này.
theological_decisions:
- issue: Đối tượng được gọi là “người công chính”
  choice: Một người công chính tiêu biểu bị những kẻ giàu áp bức; bản văn chính không xác định đây là danh hiệu của Chúa Giê-su.
  alternative: Một sự ám chỉ kín đáo đến Chúa Giê-su là “Đấng Công Chính”.
  rationale: Số ít có thể mang tính đại diện trong lời tố cáo chung đối với những người giàu. Ngữ cảnh trực tiếp không buộc phải đồng nhất người này với Chúa Giê-su, nhưng khả năng vang vọng một danh hiệu dành cho Ngài được giữ lại trong chú thích.
- issue: Lực ngôn trung của mệnh đề cuối
  choice: 'Diễn đạt như một câu trần thuật: “Người ấy không chống lại các người.”'
  alternative: 'Giữ hình thức nghi vấn: “Người ấy chẳng chống lại các người sao?”'
  rationale: SBLGNT đặt dấu hỏi, nhưng dấu câu không thuộc bản thảo Hy Lạp ban đầu và mệnh đề có thể được hiểu như câu hỏi tu từ truyền đạt ý rằng người công chính không chống cự. Câu trần thuật rõ nghĩa hơn trong tiếng Việt, còn cách đọc nghi vấn được ghi chú để bảo toàn sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. “Các người” được chọn thay vì “anh em” vì câu này là lời quở trách những kẻ áp bức; “người ấy” giúp nối rõ với “người công chính” mà không thêm một định danh thần học.
