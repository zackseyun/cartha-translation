  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các động từ aorist ngôi hai số nhiều: κατεδικάσατε là “đã kết án” và ἐφονεύσατε là “đã sát hại”; “người công chính” bảo toàn τὸν δίκαιον ở số ít mà không buộc nó thành danh hiệu Ki-tô học. Mệnh đề cuối được hiểu hợp lý như lời trần thuật diễn đạt ý của câu hỏi tu từ Hy Lạp. Tuy nhiên, nên lặp lại “đã” trước động từ thứ hai để phản ánh rõ hai lời buộc tội nối tiếp, không qua liên từ, trong nguyên văn.'
