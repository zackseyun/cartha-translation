  terminology: “Kết án,” “sát hại,” và “người công chính” đều chính xác và có sắc thái phù hợp. Không viết hoa “người công chính” trong bản văn chính là đúng, vì bản văn không bắt buộc hiểu đây là danh hiệu “Đấng Công Chính.” Chú thích giữ khả năng ám chỉ Chúa Giê-su mà không quyết định thay bản văn.
  issues:
