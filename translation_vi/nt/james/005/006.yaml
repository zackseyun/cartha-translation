- from: Các người đã kết án và sát hại người công chính.[a] Người ấy không chống lại các người.[b]
  to: Các người đã kết án, đã sát hại người công chính.[a] Người ấy không chống lại các người.[b]
  rationale: Chỉ điều chỉnh cấu trúc câu để phản ánh sát hơn phép đặt cạnh hai động từ trong tiếng Hy Lạp và nhịp tố cáo của câu. Không thay đổi cách hiểu về người công chính, sắc thái “sát hại”, hay tính mơ hồ có chủ ý của mệnh đề cuối; cả hai chú thích được giữ nguyên và các neo chú thích vẫn đặt đúng tại những chỗ liên quan.
