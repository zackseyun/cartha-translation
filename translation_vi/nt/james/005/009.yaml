  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: vi
  text: Anh chị em, đừng than trách nhau, để anh chị em không bị xét xử. Kìa, Đấng Phán Xét đang đứng trước cửa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενάζετε
  choice: than phiền
  rationale: Trong kết cấu với κατ’ ἀλλήλων, động từ nói đến lời than trách hoặc bất bình hướng vào nhau, chứ không chỉ là tiếng rên rỉ nội tâm. “Than phiền” diễn đạt tự nhiên lực đạo đức và quan hệ của lời cảnh báo.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Dạng Hy Lạp là số nhiều giống đực nhưng trong ngữ cảnh có thể gọi chung cộng đồng tín hữu gồm cả nam lẫn nữ. “Anh chị em” là cách xưng hô tự nhiên, trang trọng và chính xác về đối tượng trong tiếng Việt.
- source_word: κατ’ ἀλλήλων
  choice: về nhau
  rationale: κατά với sở hữu cách biểu thị lời bất bình nhắm đến người khác. Trong tiếng Việt, “than phiền về nhau” tự nhiên hơn “chống lại nhau” mà vẫn giữ phương hướng liên cá nhân của cụm từ.
- source_word: κριθῆτε
  choice: bị xét xử
  rationale: Giữ nghĩa rộng của κρίνω là chịu sự phán xét, không đẩy nghĩa đến “bị kết án”, vốn sẽ xác định trước kết quả.
- source_word: κριτὴς
  choice: Đấng Phán Xét
  rationale: Cách gọi này giữ tính danh xưng trang trọng và hàm ý vị thẩm phán thần linh, nhưng không xác định rõ là Đức Chúa Trời hay Chúa Cứu Thế ngoài điều bản văn nói.
- source_word: πρὸ τῶν θυρῶν
  choice: trước cửa
  rationale: Cụm Hy Lạp dùng số nhiều, nhưng tiếng Việt tự nhiên dùng thành ngữ số ít “trước cửa” để diễn tả sự ở rất gần và sắp đến; dịch máy móc “trước các cửa” sẽ thiếu tự nhiên.
- source_word: ἕστηκεν
  choice: đang đứng
  rationale: Diễn đạt trạng thái hiện tại do thể hoàn thành tạo nên, đồng thời giữ hình ảnh sống động về tư thế sẵn sàng.
theological_decisions:
- issue: Đấng được gọi là “Đấng Phán Xét”
  choice: Giữ nguyên danh xưng, không nêu đích danh; trong ngữ cảnh đây là Đấng Phán Xét cánh chung, rất có thể là Chúa được nhắc đến trong mạch văn.
  alternative: Xác định trực tiếp là Đức Chúa Trời hoặc Chúa Cứu Thế.
  rationale: Bản văn chỉ nói ὁ κριτής. Việc giữ danh xưng bảo toàn sức nặng cánh chung và sự mơ hồ có thật về quy chiếu, không áp đặt cách giải thích vượt quá tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thưa anh chị em” cho lời gọi trực tiếp; “Kìa” giữ sắc thái gây chú ý của ἰδού. Không đặt chú thích vì bản dịch “anh chị em” đã thể hiện trực tiếp phạm vi cộng đồng mà ἀδελφοί có thể chỉ đến trong ngữ cảnh.
