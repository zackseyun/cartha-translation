  to: Anh chị em, đừng than trách nhau, để anh chị em không bị xét xử. Kìa, Đấng Phán Xét đang đứng trước cửa.
  rationale: Sửa động từ/cụm quan hệ thành “đừng than trách nhau” để phản ánh rõ lời than phiền hay bất bình hướng lẫn vào nhau, thay vì chỉ than phiền về người khác. Bỏ “Thưa” vì không có đối ứng trong tiếng Hy Lạp. Giữ “trước cửa” như một thành ngữ tiếng Việt tự nhiên cho πρὸ τῶν θυρῶν, vốn nhấn mạnh sự cận kề; giữ nguyên sự không xác định của “Đấng Phán Xét.”
