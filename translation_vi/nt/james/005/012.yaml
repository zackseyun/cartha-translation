revisions:
- from: Nhưng trên hết, thưa anh em của tôi[a], đừng thề, dù chỉ trời, chỉ đất hay bất cứ lời thề nào khác. Trái lại, lời “có” của anh em phải là “có”, lời “không” phải là “không”, để anh em không sa vào sự phán xét.[b]
  to: Nhưng trên hết, thưa anh em của tôi[a], đừng thề, lấy trời, lấy đất hay bất cứ điều gì khác mà thề. Trái lại, lời “có” của anh em phải là “có”, lời “không” phải là “không”, để anh em không rơi vào sự phán xét[b].
  rationale: Bản sửa làm rõ rằng trời, đất và mọi điều khác là những gì người ta có thể viện dẫn khi thề, phù hợp với cấu trúc và nghĩa của nguyên văn Hy Lạp. “Sự phán xét” vẫn được giữ để không thu hẹp κρίσις thành sự kết án chung cuộc; chú thích bảo lưu cách dịch mạnh hơn. Các yếu tố còn lại giữ nguyên ý nghĩa và giọng văn của bản nháp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch khuyên răn, đối tượng trời/đất, lời nói chân thật, và hậu quả là rơi vào sự phán xét. Tuy nhiên, cụm “dù chỉ trời, chỉ đất” không tự nhiên và có thể bị hiểu là một nhượng bộ (“dù chỉ...”), thay vì nêu rõ hành vi thề lấy trời hay đất làm chứng như nguyên văn.
  naturalness: 'Cần thay “dù chỉ trời, chỉ đất” bằng cách nói hiện đại, rõ nghĩa hơn: “lấy trời, lấy đất ... mà thề.” Cũng chuyển dấu chú thích b đứng trước dấu chấm theo trình bày tiếng Việt thông dụng.'
  terminology: “Anh em” phù hợp với hình thức ἀδελφοί và chú thích a nêu đúng khả năng bao hàm toàn cộng đồng. “Sự phán xét” giữ nghĩa rộng của κρίσις; chú thích “sự kết án” được duy trì như một cách dịch mạnh hơn, không áp đặt vào bản văn chính.
  issues:
