    rationale: μήτε τὸν οὐρανὸν μήτε τὴν γῆν tiếp tục đối tượng được viện dẫn khi thề (“by heaven ... by earth”), chứ không là cấu trúc nhượng bộ. “Dù chỉ” cũng có thể khiến câu mang sắc thái ‘ngay cả chỉ trời, chỉ đất’, không phải ý liệt kê phủ định của nguyên văn.
