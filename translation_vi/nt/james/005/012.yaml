id: JAS.5.12
reference: James 5:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: vi
  text: Nhưng trên hết, thưa anh em của tôi[a], đừng thề, lấy trời, lấy đất hay bất cứ điều gì khác mà thề. Trái lại, lời “có” của anh em phải là “có”, lời “không” phải là “không”, để anh em không rơi vào sự phán xét[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em của tôi”; tiếng Hy Lạp dùng từ “anh em” và có lẽ hướng đến toàn thể cộng đồng tín hữu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “để anh em không rơi vào sự kết án.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: trên hết
  rationale: Diễn đạt tự nhiên ý ưu tiên và sức nhấn mạnh của cụm từ Hy Lạp, thay vì dịch sát chữ là “trước mọi sự”.
- source_word: ἀδελφοί μου
  choice: thưa anh em của tôi
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn; trong văn cảnh, cách xưng hô này có lẽ đại diện cho toàn thể cộng đồng tín hữu, điều được nói rõ trong chú thích.
- source_word: μὴ ὀμνύετε
  choice: đừng thề
  rationale: Thể hiện mệnh lệnh cấm tổng quát. Các vế sau cho thấy đây là việc thề thốt hoặc viện dẫn điều gì để bảo chứng, chứ không phải nói tục.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: dù chỉ trời, chỉ đất
  rationale: “Chỉ trời, chỉ đất” là lối nói tiếng Việt tự nhiên về việc lấy trời hoặc đất làm chứng, đồng thời giữ hai đối tượng song song trong nguyên văn.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: hay bất cứ lời thề nào khác
  rationale: Giữ phạm vi cấm bao quát của τινά và ý về mọi dạng lời thề khác.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Trái lại, lời “có” của anh em phải là “có”, lời “không” phải là “không”
  rationale: Giữ cấu trúc ngắn gọn, có tính châm ngôn của câu Hy Lạp, đồng thời diễn đạt rõ sự tương phản do δέ đánh dấu.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: để anh em không sa vào sự phán xét
  rationale: “Sự phán xét” giữ nghĩa rộng của κρίσις, còn “sa vào” bảo tồn hình ảnh của πέσητε mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Nên dịch κρίσις là “sự phán xét” hay nghĩa mạnh hơn là “sự kết án”
  choice: sự phán xét
  alternative: sự kết án
  rationale: κρίσις có thể chỉ sự xét xử hoặc phán xét theo nghĩa rộng và tự nó không bắt buộc nghĩa kết án chung cuộc. Bản chính vì vậy tránh thu hẹp ý thần học của câu.
- issue: Cách chuyển ἀδελφοί khi lời xưng hô có thể hướng đến cộng đồng gồm cả nam lẫn nữ
  choice: anh em
  alternative: anh chị em
  rationale: “Anh em” giữ hình thức giống đực của nguyên văn, còn chú thích làm rõ rằng từ này có lẽ được dùng theo nghĩa đại diện cho toàn thể cộng đồng tín hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chỉ trời, chỉ đất” để diễn đạt tự nhiên hành vi lấy trời đất làm chứng; giữ nhịp châm ngôn của cặp “có… có / không… không”. Các dấu chú thích [a], [b] đều xuất hiện trong bản văn chính.
