  to: Anh em đã sống xa hoa trên đất và buông mình hưởng lạc; anh em đã vỗ béo lòng mình trong ngày giết thịt.[a]
  rationale: Bản sửa chỉ loại bỏ sắc thái bị động không có trong nguyên ngữ và làm câu tiếng Việt gọn, tự nhiên hơn. Cách dịch chính vẫn giữ «trong» để phản ánh ἐν; chú thích ghi nhận cách hiểu «cho ngày giết thịt» mà không giải quyết dứt khoát sự mơ hồ cú pháp hay diễn giải hình ảnh thành phán xét trong thân bài.
