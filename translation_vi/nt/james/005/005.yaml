  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: vi
  text: Anh em đã sống xa hoa trên đất và buông mình hưởng lạc; anh em đã vỗ béo lòng mình trong ngày giết thịt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cho ngày giết thịt.” Hình ảnh gợi đến con vật được vỗ béo trước khi bị giết, có lẽ ám chỉ sự phán xét sắp đến.'
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: đã sống xa hoa
  rationale: Động từ chỉ lối sống sung túc, ham hưởng thụ; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ sắc thái quở trách.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Giữ nghĩa rộng của γῆ và đối chiếu ngầm giữa đời sống trần thế với sự phán xét sắp đến, mà không diễn giải quá mức.
- source_word: ἐσπαταλήσατε
  choice: buông mình hưởng lạc
  rationale: Diễn đạt lối sống phóng túng, tự nuông chiều; mạnh hơn việc chỉ vui hưởng và phù hợp với sự tăng cấp sau 'sống xa hoa'.
- source_word: ἐθρέψατε τὰς καρδίας ὑμῶν
  choice: đã làm cho lòng mình béo tốt
  rationale: Giữ hình ảnh cụ thể về việc vỗ béo và cụm 'lòng mình', thay vì làm phẳng ẩn dụ thành một lời diễn giải.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: trong ngày bị giết thịt
  rationale: Bám sát giới từ ἐν và duy trì hình ảnh súc vật được vỗ béo ngay trong ngày giết thịt; không đổi thành 'cho ngày' dù đó là cách hiểu hợp lý.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của 'ngày bị giết thịt'
  choice: Giữ nguyên hình ảnh về ngày giết thịt, chỉ giải thích hàm ý phán xét trong chú thích.
  alternative: Dịch rõ thành 'ngày phán xét' hoặc hiểu là việc sát hại người vô tội.
  rationale: Bản Hy Lạp gợi mạnh đến sự phán xét sắp xảy ra nhưng không trực tiếp gọi đó là 'ngày phán xét'; giữ hình ảnh bảo toàn sức căng và sự mơ hồ của câu.
- issue: Quan hệ của ἐν với việc vỗ béo
  choice: Dịch 'trong ngày bị giết thịt'.
  alternative: 'Dịch theo mục đích: ''cho ngày bị giết thịt''.'
  rationale: Cách dịch chính phản ánh trực tiếp ἐν, đồng thời chú thích ghi nhận cách hiểu mục đích vốn làm rõ hình ảnh con vật được vỗ béo để chịu giết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. Đại từ 'anh em' theo lối xưng hô thư tín, dù đối tượng tại đây đang bị quở trách. 'Buông mình hưởng lạc' tránh từ cổ nhưng vẫn giữ lực đạo đức của lời tố cáo; 'bị giết thịt' duy trì hình ảnh súc vật cụ thể hơn từ khái quát 'tàn sát'.
