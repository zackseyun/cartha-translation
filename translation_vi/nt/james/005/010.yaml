id: JAS.5.10
reference: James 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: vi
  text: Thưa anh em[a], hãy lấy các nhà tiên tri, là những người đã nói nhân danh Chúa, làm gương về sự chịu khổ và lòng kiên nhẫn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch danh từ số nhiều giống đực ἀδελφοί; trong ngữ cảnh, Gia-cơ có lẽ đang nói với toàn thể cộng đồng tín hữu, gồm cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: làm gương
  rationale: Danh từ chỉ một gương mẫu để noi theo; kết cấu “lấy… làm gương” vừa tự nhiên trong tiếng Việt vừa giữ sức khuyên nhủ của câu.
- source_word: λάβετέ
  choice: hãy lấy
  rationale: Động từ mệnh lệnh aorist của λαμβάνω; đi với ὑπόδειγμα và đối tượng τοὺς προφήτας tạo thành ý “hãy lấy… làm gương”.
- source_word: ἀδελφοί
  choice: thưa anh em[a]
  rationale: Giữ hình thức hô cách số nhiều giống đực của nguyên văn. “Thưa” làm lời gọi tự nhiên và trang trọng; chú thích nêu khả năng lời gọi bao gồm cả cộng đồng tín hữu nam và nữ.
- source_word: κακοπαθίας
  choice: sự chịu khổ
  rationale: Diễn đạt việc trải qua đau khổ hoặc gian khó; “chịu khổ” phù hợp với phương diện mà các nhà tiên tri được nêu làm gương.
- source_word: μακροθυμίας
  choice: lòng kiên nhẫn
  rationale: Chỉ sự nhẫn nại bền lâu trước nghịch cảnh hoặc con người; cách nói này rõ nghĩa, hiện đại và giữ sắc thái phẩm chất nội tâm.
- source_word: τοὺς προφήτας
  choice: các nhà tiên tri
  rationale: Đối tượng trực tiếp của mệnh lệnh, tức những người được nêu làm gương.
- source_word: ἐλάλησαν
  choice: đã nói
  rationale: Giữ nghĩa thông thường của λαλέω, không thêm sắc thái “rao giảng” hay “công bố” vốn không được động từ tự nó bắt buộc.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: Thành ngữ tiếng Việt tự nhiên tương ứng với cách nói Kinh Thánh về việc nói với tư cách đại diện và theo thẩm quyền của Chúa.
- source_word: κυρίου
  choice: Chúa
  rationale: Danh xưng κύριος được dịch nhất quán là “Chúa”; tiếng Việt không cần mạo từ.
theological_decisions:
- issue: Hô cách mang giống đực ἀδελφοί trong lời gửi đến cộng đồng
  choice: “anh em” trong chính văn, với chú thích về phạm vi có thể bao gồm cả nữ giới
  alternative: “anh chị em”
  rationale: Nguyên văn dùng danh từ số nhiều giống đực, nhưng trong thư tín cách xưng hô này có thể chỉ toàn thể cộng đồng tín hữu. Chính văn giữ hình thức của nguồn, còn chú thích làm rõ phạm vi dụng học có khả năng rộng hơn.
- issue: Quan hệ giữa các nhà tiên tri và ὑπόδειγμα
  choice: “lấy các nhà tiên tri… làm gương về sự chịu khổ và lòng kiên nhẫn”
  alternative: “hãy noi gương các nhà tiên tri trong sự chịu khổ và lòng kiên nhẫn”
  rationale: Cách chọn giữ cấu trúc trong đó “các nhà tiên tri” là đối tượng được lấy làm gương, còn hai sở hữu cách nêu những phương diện họ làm gương, mà không thu hẹp hoặc giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các nhà tiên tri” theo cách gọi phổ thông; giữ thành ngữ Kinh Thánh “nhân danh Chúa”. Cấu trúc câu bám sát nguyên văn nhưng đặt mệnh đề mô tả cạnh danh từ để tiếng Việt trôi chảy.
