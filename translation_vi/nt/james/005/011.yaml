source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: vi
  text: 'Này, chúng ta xem những người đã kiên trì chịu đựng là có phước. Anh chị em đã nghe về sự kiên trì của Gióp và đã thấy kết cuộc của Chúa[a]: Chúa đầy lòng trắc ẩn và thương xót.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “mục đích của Chúa.” Cụm từ Hy Lạp có thể nói đến kết cuộc Chúa dành cho Gióp hoặc mục đích của Chúa.'
    reason: Bảo tồn độ mở của τὸ τέλος κυρίου mà không thêm tác nhân minh nhiên vào bản văn chính.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Giữ lời kêu gọi chú ý của nguyên văn bằng một cách nói ngắn gọn, trang trọng và tự nhiên.
- source_word: μακαρίζομεν
  choice: chúng ta xem … là có phước
  rationale: Diễn đạt hành động nhìn nhận hoặc tuyên bố một người là có phước, không biến động từ này thành lời ban phước trực tiếp.
- source_word: ὑπομείναντας / ὑπομονὴν
  choice: đã kiên trì chịu đựng / sự kiên trì
  rationale: Giữ mối liên hệ từ vựng giữa hai dạng cùng gốc, đồng thời thể hiện sắc thái bền lòng dưới thử thách.
- source_word: τὸ τέλος κυρίου
  choice: kết cuộc Chúa đem lại
  rationale: τέλος ở đây chỉ kết quả hoặc kết cuộc; cách dịch này tránh lối hiểu sai rằng đó là sự kết thúc của chính Chúa, nhưng không đồng nhất nó hoàn toàn với 'mục đích'.
- source_word: πολύσπλαγχνός … καὶ οἰκτίρμων
  choice: đầy lòng trắc ẩn và thương xót
  rationale: Dùng hai cách diễn đạt gần nghĩa nhưng phân biệt được, tương ứng với hai phẩm tính giàu cảm xúc thương cảm và lòng thương xót trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của τὸ τέλος κυρίου
  choice: kết cuộc Chúa đem lại
  alternative: mục đích của Chúa
  rationale: Ngữ cảnh về Gióp thuận với kết cuộc Chúa làm nên, trong khi τέλος cũng có thể mang sắc thái mục đích. Bản dịch chính không âm thầm quyết định theo cách hiểu 'mục đích'; chú thích giữ lại khả năng đó.
- issue: Quan hệ của mệnh đề ὅτι
  choice: Dùng dấu hai chấm trước lời khẳng định về Chúa
  alternative: dịch ὅτι là 'vì'
  rationale: ὅτι có thể giới thiệu nội dung được nhận biết hoặc nêu lý do. Dấu hai chấm giữ quan hệ giải thích mà không ép mệnh đề theo riêng một hướng nhân quả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ đối tượng số nhiều theo lối diễn đạt bao quát trong tiếng Việt hiện nay; các thuật ngữ “có phước,” “Gióp,” “Chúa” giữ tính quen thuộc của văn phong Kinh Thánh.
