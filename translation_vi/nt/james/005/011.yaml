revisions:
- from: 'Này, chúng ta xem những người đã kiên trì chịu đựng là có phước. Anh chị em đã nghe về sự kiên trì của Gióp và đã thấy kết cuộc Chúa đem lại[a]: Chúa đầy lòng trắc ẩn và thương xót.'
  to: 'Này, chúng ta xem những người đã kiên trì chịu đựng là có phước. Anh chị em đã nghe về sự kiên trì của Gióp và đã thấy kết cuộc của Chúa[a]: Chúa đầy lòng trắc ẩn và thương xót.'
