    rationale: Bản đối chiếu tiếng Anh lưu khả năng hiểu là lòng tin cậy, và ít có khả năng hơn là sự trung tín. Việc thêm chú thích bảo toàn độ mở ngữ nghĩa mà không làm nặng chính văn.
