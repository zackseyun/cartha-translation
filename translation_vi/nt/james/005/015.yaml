id: JAS.5.15
reference: James 5:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: vi
  text: Và lời cầu nguyện của đức tin[b] sẽ cứu người bệnh[a], và Chúa sẽ nâng người ấy dậy. Nếu người ấy đã phạm tội[c], người ấy sẽ được tha tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ chữa lành” hoặc “sẽ làm cho khỏe lại”; tiếng Hy Lạp là “sẽ cứu”.'
    reason: lexical_alternative
  - marker: b
    text: “Lời cầu nguyện của đức tin” cũng có thể hiểu là lời cầu nguyện được đặc trưng bởi lòng tin cậy; ít có khả năng hơn trong ngữ cảnh này là sự trung tín.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Ngay cả nếu người ấy đã phạm tội”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: lời cầu nguyện
  rationale: Trong ngữ cảnh các trưởng lão cầu nguyện cho người bệnh ở câu 14, từ này chỉ lời cầu nguyện chứ không phải lời khấn nguyện.
- source_word: πίστεως
  choice: bởi đức tin
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy lời cầu nguyện phát xuất từ, hay được đặc trưng bởi, lòng tin cậy nơi Đức Chúa Trời; không buộc cụm sở hữu cách Hy Lạp vào một nghĩa quá hẹp.
- source_word: σώσει
  choice: sẽ cứu
  rationale: Giữ nghĩa cơ bản và độ rộng của động từ Hy Lạp, trong khi ngữ cảnh người bệnh cho phép hiểu sự cứu này bao gồm việc chữa lành hoặc làm cho khỏe lại.
- source_word: τὸν κάμνοντα
  choice: người bệnh
  rationale: Dù động từ có thể chỉ sự mệt mỏi hay kiệt sức, ngữ cảnh bệnh tật, xức dầu và được nâng dậy khiến “người bệnh” là nghĩa thích hợp nhất.
- source_word: ἐγερεῖ
  choice: sẽ nâng ... dậy
  rationale: Giữ hình ảnh của động từ Hy Lạp và phù hợp với việc Chúa phục hồi người bệnh khỏi giường bệnh, đồng thời không loại bỏ âm hưởng rộng hơn của sự phục hồi bởi Đức Chúa Trời.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Đây là cách gọi tự nhiên, trang trọng và quen thuộc trong tiếng Việt đối với κύριος khi chỉ Đấng có quyền hành động.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: Nếu người ấy đã phạm tội
  rationale: Diễn đạt rõ điều kiện liên quan đến tội lỗi mà không ngụ ý mọi bệnh tật đều do tội cá nhân gây ra; sắc thái nhượng bộ “ngay cả nếu” được ghi ở chú thích.
- source_word: ἀφεθήσεται αὐτῷ
  choice: người ấy sẽ được tha thứ
  rationale: Thể bị động tương lai nói đến sự tha tội do Đức Chúa Trời ban; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên tác nhân thần linh không được nêu trực tiếp.
theological_decisions:
- issue: Nên hiểu σώσει theo nghĩa hẹp là chữa lành thân thể hay theo nghĩa rộng là cứu và phục hồi
  choice: Dùng “sẽ cứu” trong chính văn, để ngữ cảnh bệnh tật làm rõ chiều kích chữa lành.
  alternative: “sẽ chữa lành” hoặc “sẽ làm cho khỏe lại”
  rationale: Gia-cơ dùng σῴζω, không phải một động từ y khoa hẹp. “Sẽ cứu” giữ lựa chọn từ vựng và độ rộng thần học của nguyên văn mà không phủ nhận trọng tâm phục hồi thân thể trong ngữ cảnh.
- issue: Câu này có bảo đảm việc chữa lành tự động qua lời cầu nguyện hay không
  choice: Giữ nguyên các động từ tương lai khẳng định, không thêm điều kiện làm yếu câu cũng không thêm từ ngữ tuyệt đối hóa.
  alternative: Diễn giải thành “có thể chữa lành” hoặc “chắc chắn chữa lành mọi trường hợp”
  rationale: Bản dịch cần giữ lời khẳng định trực tiếp của nguyên văn nhưng không nhập vào đó một giáo thuyết hệ phái về chữa lành được bảo đảm trong mọi hoàn cảnh.
- issue: Sự tha thứ có hàm ý mọi bệnh tật đều do tội cá nhân gây nên hay không
  choice: 'Giữ mệnh đề điều kiện: “Nếu người ấy đã phạm tội, người ấy sẽ được tha thứ.”'
  alternative: Ngụ ý bệnh tật luôn do tội cá nhân, hoặc tách sự tha thứ khỏi cấu trúc điều kiện
  rationale: Nguyên văn nêu việc phạm tội như một khả năng trong trường hợp này, chứ không xác lập quan hệ nhân quả phổ quát giữa bệnh tật và tội cá nhân.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Người ấy” được dùng nhất quán để tránh lặp đại từ mang dấu giới không cần thiết. Cấu trúc câu giữ nhịp và các lời hứa trực tiếp của nguyên văn; dấu phẩy sau mệnh đề đầu nối hai hành động cứu và nâng dậy.
