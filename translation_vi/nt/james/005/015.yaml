  source_fidelity: Bản nháp truyền đạt đúng các động từ tương lai và điều kiện về việc phạm tội. Tuy nhiên, “bởi đức tin” diễn giải quan hệ sở hữu cách περισσότερο than necessary and thiếu chú thích về cách hiểu thay thế của πίστεως. Dấu phẩy nối hai mệnh đề độc lập cũng nên được thay bằng liên từ như nguyên văn.
  naturalness: “Lời cầu nguyện của đức tin” là cách diễn đạt Kinh Thánh trang trọng, rõ nghĩa và phù hợp hơn “lời cầu nguyện bởi đức tin” trong tiếng Việt tiêu chuẩn. “Sẽ được tha tội” tự nhiên hơn “sẽ được tha thứ” trong ngữ cảnh tội lỗi.
  terminology: Giữ “cứu,” “Chúa,” và “nâng người ấy dậy” để phản ánh độ rộng của σώσει, κύριος, và ἐγερεῖ. Bổ sung chú thích cho “đức tin” để không khóa πίστις vào một cách hiểu duy nhất.
