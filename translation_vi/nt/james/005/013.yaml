revisions:
- from: Trong anh em có ai đang chịu khổ không? Người ấy hãy cầu nguyện. Có ai phấn chấn không? Người ấy hãy hát ngợi ca[a].
  to: Trong anh em có ai đang chịu khổ không? Người ấy hãy cầu nguyện. Có ai phấn chấn không? Người ấy hãy hát lời ngợi ca[a].
  rationale: Chỉnh sửa chỉ nhằm sửa độ chính xác của chú thích từ vựng và làm cụm động từ tiếng Việt tự nhiên hơn. Bản văn vẫn giữ tính khái quát số ít, sự tương phản giữa đau khổ và tinh thần vui vẻ, cùng sự mơ hồ có chủ ý về phạm vi chính xác của ψαλλέτω.
