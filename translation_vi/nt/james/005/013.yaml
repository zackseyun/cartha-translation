source:
  edition: SBLGNT
  text: Κακοπαθεῖ τις ἐν ὑμῖν; προσευχέσθω· εὐθυμεῖ τις; ψαλλέτω.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: vi
  text: Trong anh em có ai đang chịu khổ không? Người ấy hãy cầu nguyện. Có ai phấn chấn không? Người ấy hãy hát lời ngợi ca[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hãy hát thánh vịnh”; động từ Hy Lạp có thể chỉ cụ thể việc hát thánh vịnh, hoặc rộng hơn là hát lời ngợi ca.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: đang chịu khổ
  rationale: Động từ κακοπαθέω chỉ việc trải qua gian khổ hoặc đau khổ nói chung. “Đang chịu khổ” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa vào bệnh tật hay sự bắt bớ.
- source_word: τις
  choice: có ai
  rationale: Đại từ bất định số ít được diễn đạt tự nhiên bằng “có ai” trong câu hỏi tiếng Việt, vẫn giữ nghĩa khái quát về bất cứ người nào.
- source_word: ἐν ὑμῖν
  choice: trong anh em
  rationale: Cụm từ xác định người được nói đến thuộc cộng đồng nhận thư. “Trong anh em” trực tiếp, trang trọng vừa phải và phù hợp văn cảnh.
- source_word: προσευχέσθω
  choice: người ấy hãy cầu nguyện
  rationale: Mệnh lệnh ngôi thứ ba số ít được giữ bằng cấu trúc “người ấy hãy…”, vừa rõ tính khuyên bảo vừa tránh thêm giới tính mà tiếng Hy Lạp không nhấn mạnh.
- source_word: εὐθυμεῖ
  choice: phấn chấn
  rationale: Động từ εὐθυμέω diễn tả trạng thái có tinh thần tốt, vững lòng hoặc vui vẻ. “Phấn chấn” ngắn gọn, tự nhiên và giữ được sự tương phản với việc chịu khổ.
- source_word: ψαλλέτω
  choice: người ấy hãy hát ngợi ca
  rationale: Trong văn cảnh này, ψάλλω nói đến việc cất tiếng hát ca ngợi Đức Chúa Trời. “Hát ngợi ca” truyền đạt rõ hành động thờ phượng, đồng thời chú thích giữ lại khả năng hiểu hẹp hơn là hát thánh thi.
theological_decisions:
- issue: Lời khuyên số ít mang nghĩa khái quát
  choice: Dùng “có ai… người ấy hãy…”
  alternative: Dùng số nhiều hoặc thêm đại từ chỉ giới tính
  rationale: Bản Hy Lạp dùng đại từ bất định và động từ mệnh lệnh số ít. Tiếng Việt có thể giữ nguyên nét số ít đại diện bằng “người ấy” mà không gán giới tính không cần thiết.
- issue: Ý nghĩa của ψαλλέτω
  choice: hát ngợi ca
  alternative: hát thánh thi
  rationale: Động từ có thể gợi việc hát thánh thi, nhưng trong văn cảnh lời khuyên này, nghĩa rộng là hát lời ca ngợi Đức Chúa Trời phù hợp và dễ hiểu hơn. Chú thích bảo tồn nghĩa hẹp có thể có mà không biến câu thành một quy định phụng vụ cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai câu hỏi song song cùng hai lời khuyên giữ nhịp điệu của nguyên bản. “Anh em” chỉ toàn thể cộng đồng được gửi thư, không nhằm giới hạn ở nam giới.
