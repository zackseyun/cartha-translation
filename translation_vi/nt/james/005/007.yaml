reference: James 5:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: vi
  text: Vậy, anh em[a] hãy kiên nhẫn cho đến khi Chúa đến[b]. Hãy xem, người nông dân kiên nhẫn chờ đợi hoa lợi quý giá của đất, cho đến khi nó nhận được mưa đầu mùa và mưa cuối mùa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “anh em” thường được dùng để gọi toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp cũng có thể có nghĩa là “sự hiện diện”; trong ngữ cảnh này, từ ấy nói đến việc Chúa sẽ đến.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn không nêu rõ chủ thể của động từ “nhận được”. Cách dịch này hiểu là hoa lợi nhận mưa; cũng có thể hiểu là người nông dân nhận được mưa. Các từ “đầu mùa” và “cuối mùa” hàm ý mưa trong ngữ cảnh nông nghiệp.
    reason: source_ambiguity
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: hãy kiên nhẫn / kiên nhẫn trông chờ
  rationale: Giữ sự lặp lại của cùng một gốc từ Hy Lạp, diễn tả lòng nhẫn nại bền bỉ trong lúc chờ đợi; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lời cảnh báo ở phần trước mà không làm câu văn nặng nề.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Phản ánh danh từ hô cách số nhiều giống đực trong nguyên văn; trong lối xưng hô cộng đồng, từ này có thể bao gồm cả nam lẫn nữ.
- source_word: παρουσίας τοῦ κυρίου
  choice: khi Chúa quang lâm
  rationale: Trong ngữ cảnh cánh chung, παρουσία chỉ sự Chúa hiện đến; “quang lâm” là cách diễn đạt trang trọng, dễ nhận biết trong tiếng Việt và không ấn định thêm một hệ thống thời kỳ.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý để dẫn vào hình ảnh minh họa, đồng thời phù hợp với văn phong trang trọng hiện đại.
- source_word: γεωργὸς
  choice: người nông dân
  rationale: Tương đương tự nhiên và tổng quát cho người canh tác.
- source_word: ἐκδέχεται
  choice: chờ đợi
  rationale: Diễn tả sự mong đợi kéo dài, phù hợp với chủ đề kiên nhẫn.
- source_word: τίμιον καρπὸν τῆς γῆς
  choice: hoa lợi quý báu của đất
  rationale: “Hoa lợi” tự nhiên hơn “trái của đất” trong ngữ cảnh nông nghiệp, còn “quý báu” giữ ý về giá trị và điều đáng mong đợi.
- source_word: ἐπ’ αὐτῷ
  choice: trông chờ
  rationale: Diễn đạt tự nhiên thái độ kiên nhẫn hướng về hoa lợi, tránh lối dịch cứng “trên nó” hoặc “về nó”.
- source_word: πρόϊμον καὶ ὄψιμον
  choice: mưa đầu mùa và mưa cuối mùa
  rationale: Danh từ “mưa” được hàm ý trong tiếng Hy Lạp; bổ sung trong bản dịch để câu tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Phạm vi của cách xưng hô ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Giữ hình thức giống đực của nguyên văn trong chính văn, đồng thời chú thích rằng cách gọi này thường hướng đến toàn thể cộng đồng tín hữu.
- issue: Ý nghĩa của παρουσία τοῦ κυρίου
  choice: khi Chúa quang lâm
  alternative: cho đến sự hiện diện của Chúa
  rationale: Ngữ cảnh khuyên kiên nhẫn chờ một biến cố tương lai ủng hộ nghĩa “Chúa đến/quang lâm”; chú thích vẫn bảo lưu nghĩa từ nguyên rộng hơn là “sự hiện diện”.
- issue: Chủ thể nhận mưa trong ἕως λάβῃ
  choice: hoa lợi, được biểu thị bằng “nó”
  alternative: người nông dân hoặc đất
  rationale: Động từ không nêu chủ thể tường minh. Đại từ gần nhất là hoa lợi, và cách hiểu hoa lợi nhận mưa phù hợp với hình ảnh canh tác; chú thích bảo lưu sự không tường minh của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quang lâm” để chuyển tải παρουσία trong ngữ cảnh cánh chung, kèm chú thích nhằm giữ độ rộng nghĩa. Cấu trúc lặp “kiên nhẫn” bảo tồn liên kết từ vựng trong nguyên văn.
