    rationale: αὐτῷ là đại từ giống đực/trung, nên không trực tiếp chỉ γῆ (“đất,” giống cái). Động từ λάβῃ không có chủ thể minh thị; trong ngữ cảnh, cách hiểu khả dĩ là người nông dân hoặc hoa lợi.
