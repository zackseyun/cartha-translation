  yaml_path: translation/nt/james/005/002.yaml
  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: vi
  text: Của cải anh em đã mục nát, và quần áo anh em đã bị sâu bướm ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: của cải
  rationale: “Của cải” là cách nói tự nhiên, hiện đại về tài sản vật chất tích lũy và phù hợp với lời lên án những người giàu trong ngữ cảnh.
- source_word: σέσηπεν
  choice: đã mục nát
  rationale: Thì hoàn thành diễn tả tình trạng hiện tại do quá trình hư mục gây nên; “đã mục nát” giữ được hình ảnh cụ thể cùng sắc thái kết quả.
- source_word: ἱμάτια
  choice: quần áo
  rationale: Từ này chỉ chung các thứ dùng để mặc; “quần áo” rõ ràng, thông dụng và tự nhiên trong tiếng Việt hiện đại.
- source_word: σητόβρωτα
  choice: bị mối mọt ăn
  rationale: Tính từ ghép diễn tả đồ vật bị loài mọt phá hủy; cách dịch này cụ thể, dễ hiểu và giữ hình ảnh nguyên ngữ.
- source_word: γέγονεν
  choice: đã bị
  rationale: Kết hợp với “mối mọt ăn,” cách diễn đạt này trình bày tự nhiên tình trạng đã phát sinh và hiện còn đó, dù không dịch tách biệt bằng “đã trở nên.”
