source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: vi
  text: Anh chị em cũng hãy kiên nhẫn; hãy làm vững lòng mình, vì sự đến của Chúa đã gần kề[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “sự đến” cũng có thể có nghĩa là “sự hiện diện”. Trong văn cảnh này, từ ấy chỉ sự Chúa đến vào thời kỳ cuối cùng.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: hãy kiên nhẫn
  rationale: Động từ mệnh lệnh diễn tả sự nhẫn nại bền lâu khi gặp gian khổ hoặc bị khiêu khích. “Hãy kiên nhẫn” rõ ràng, tự nhiên và phù hợp với hình ảnh người nông dân trong văn cảnh.
- source_word: καὶ ὑμεῖς
  choice: Anh chị em cũng
  rationale: “Cũng” nối người đọc với tấm gương vừa nêu ở câu trước; “anh chị em” diễn đạt đại từ số nhiều theo lối xưng hô tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: στηρίξατε τὰς καρδίας ὑμῶν
  choice: hãy làm vững lòng mình
  rationale: Giữ hình ảnh Kinh Thánh về “lòng” là trung tâm của ý chí và lòng can đảm, đồng thời diễn đạt στηρίζω theo nghĩa làm cho vững vàng, kiên định.
- source_word: ὅτι
  choice: vì
  rationale: Nêu lý do cho hai mệnh lệnh phía trước bằng một liên từ nhân quả tự nhiên trong tiếng Việt.
- source_word: ἡ παρουσία τοῦ κυρίου
  choice: Chúa sắp đến
  rationale: Trong văn cảnh cánh chung của Gia-cơ 5:7–8, παρουσία chỉ sự Chúa đến. Cách diễn đạt bằng mệnh đề tự nhiên hơn danh ngữ “sự đến của Chúa” trong tiếng Việt, còn chú thích bảo lưu nghĩa từ vựng “sự hiện diện”.
- source_word: ἤγγικεν
  choice: sắp
  rationale: Dạng hoàn thành diễn tả việc đã ở trong tình trạng gần kề. “Sắp đến” truyền đạt tự nhiên tính cận kề hiện tại của biến cố, dù không tái tạo hình thức hoàn thành theo từng từ.
theological_decisions:
- issue: Nghĩa của παρουσία trong lời nói về Chúa ở thời kỳ cuối cùng
  choice: Chúa sắp đến
  alternative: sự hiện diện của Chúa đã đến gần
  rationale: Mạch văn 5:7–8 hướng tới cuộc Chúa đến trong tương lai; tuy vậy, vì παρουσία cũng có thể mang nghĩa “sự hiện diện”, chú thích giữ lại khả năng từ vựng này thay vì xóa bỏ hoàn toàn độ rộng nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt tự nhiên đại từ số nhiều; dùng “làm vững lòng mình” nhằm giữ ẩn dụ về lòng mà không tạo câu tối nghĩa. Cấu trúc “Chúa sắp đến” ưu tiên tiếng Việt tự nhiên nhưng vẫn giữ ý về sự gần kề.
