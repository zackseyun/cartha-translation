id: JAS.5.16
reference: James 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: vi
  text: Vậy, hãy xưng tội với nhau và cầu nguyện cho nhau, để anh chị em được chữa lành. Lời cầu xin của người công chính có hiệu lực rất lớn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lời cầu xin của người công chính có sức mạnh lớn lao khi phát huy tác dụng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: hãy xưng tội
  rationale: Động từ mệnh lệnh diễn tả việc công khai thừa nhận; khi đi với ἁμαρτίας, “xưng tội” là cách nói tự nhiên, trực tiếp, nhưng không tự nó hàm ý một nghi thức bí tích.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với phần trước về cầu nguyện, tội lỗi và sự phục hồi; “Vậy” tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: ἀλλήλοις / ὑπὲρ ἀλλήλων
  choice: với nhau / cho nhau
  rationale: Thể hiện rõ tính tương hỗ của cả việc xưng tội lẫn cầu thay.
- source_word: τὰς ἁμαρτίας
  choice: tội
  rationale: “Tội” là tương đương trực tiếp, tự nhiên trong cụm “xưng tội”; không thu hẹp thành một loại vi phạm cụ thể.
- source_word: ἰαθῆτε
  choice: được chữa lành
  rationale: Giữ nghĩa rộng của động từ, không giới hạn sự chữa lành vào thể chất hoặc tâm linh.
- source_word: δέησις
  choice: lời cầu xin
  rationale: Diễn đạt sắc thái khẩn cầu cụ thể hơn từ γενικό “cầu nguyện”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: δικαίου
  choice: người công chính
  rationale: Tính từ số ít được dùng như danh từ theo nghĩa khái quát; “người” không áp đặt giới tính nam.
- source_word: πολὺ ἰσχύει
  choice: có sức mạnh lớn lao
  rationale: Bảo toàn ý về sức lực hoặc hiệu lực lớn, tránh diễn giải quá cụ thể thành kết quả chắc chắn.
- source_word: ἐνεργουμένη
  choice: khi đang tác động
  rationale: Giữ sắc thái tiến hành của phân từ hiện tại và sự mơ hồ giữa nghĩa chủ động “hoạt động” với nghĩa hiệu nghiệm, không chuyển hẳn sang cách hiểu bị động “được làm cho hữu hiệu”.
theological_decisions:
- issue: Việc xưng tội là tương hỗ hay bắt buộc phải qua hàng giáo phẩm
  choice: xưng tội với nhau
  alternative: xưng tội qua người được phong chức
  rationale: Đại từ tương hỗ ἀλλήλοις trực tiếp chỉ sự xưng nhận lẫn nhau trong cộng đồng; bản dịch không đưa vào một cơ cấu bí tích mà câu Hy Lạp không nêu rõ.
- issue: Phạm vi của sự chữa lành
  choice: được chữa lành
  alternative: chỉ được chữa lành về thể chất; hoặc chỉ được chữa lành về tâm linh
  rationale: Ngữ cảnh đề cập bệnh tật nhưng cũng đề cập tội lỗi; cách dịch rộng bảo tồn sự căng thẳng thần học của nguyên văn.
- issue: Giới tính trong δικαίου
  choice: người công chính
  alternative: người đàn ông công chính
  rationale: Dạng giống đực số ít có chức năng khái quát; “người” truyền đạt đúng phạm vi mà không thêm giới tính sinh học.
- issue: Cách hiểu ἐνεργουμένη
  choice: khi đang tác động
  alternative: khi có hiệu nghiệm; khi được tác động
  rationale: Phân từ trung động/bị động có thể được hiểu theo nhiều sắc thái; bản dịch chính tránh quyết định dứt khoát một cách không cần thiết, còn chú thích nêu cách dịch tự nhiên khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để biểu đạt chủ ngữ số nhiều ngầm trong ἰαθῆτε mà không giới hạn giới tính; tránh thuật ngữ giáo phái. Dấu chú thích [a] được đặt sau mệnh đề khó về cú pháp để chỉ phương án dịch thay thế.
