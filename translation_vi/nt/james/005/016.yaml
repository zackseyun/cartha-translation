  source_fidelity: Câu đầu truyền đạt đúng các mệnh lệnh số nhiều, tính tương hỗ của ἀλλήλοις, mục đích ὅπως ἰαθῆτε, và nghĩa rộng của “được chữa lành”. “Xưng tội với nhau” không tự áp đặt một bối cảnh bí tích. Ở câu cuối, bản thảo giữ được ý chính nhưng “khi đang tác động” chưa là cách diễn đạt tiếng Việt tự nhiên cho phân từ ἐνεργουμένη.
