  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: vi
  text: Thưa anh em tôi[a], nếu có ai trong anh em lạc khỏi chân lý[b], và có người đưa người ấy trở lại[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” là hình thức xưng hô giống đực số nhiều trong tiếng Hy Lạp, nhưng có thể bao gồm cả anh chị em trong toàn thể cộng đồng.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đi lạc khỏi chân lý”, “bị dẫn lạc khỏi chân lý” hoặc “bị lừa mà lìa khỏi chân lý”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “làm cho người ấy quay lại”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Thưa anh em của tôi
  rationale: Giữ hình thức xưng hô trực tiếp và sắc thái sở hữu của μου; “anh em” là cách gọi trang trọng, tự nhiên trong cộng đồng và có thể bao gồm cả cộng đồng.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: nếu có ai trong anh em
  rationale: Diễn đạt tự nhiên điều kiện bất định, đồng thời giữ số ít của τις.
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: lạc khỏi chân lý
  rationale: πλανηθῇ có thể mang sắc thái đi lạc hoặc bị dẫn lạc; tiếng Việt “lạc khỏi” giữ được ý rời xa mà không ấn định tác nhân, còn “chân lý” không giải thích quá mức nội dung của ἀλήθεια.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: và có người đưa người ấy trở lại
  rationale: “Đưa ... trở lại” diễn đạt tự nhiên tác động chuyển hồi của ἐπιστρέφω; “người ấy” giữ đối tượng số ít mà không buộc tiếng Việt dùng đại từ mang giới tính.
theological_decisions:
- issue: Phạm vi của cách gọi Ἀδελφοί
  choice: Giữ “anh em” trong chính văn và chú thích khả năng bao gồm cả nam lẫn nữ
  alternative: anh chị em
  rationale: Hình thức Hy Lạp là giống đực số nhiều nhưng trong lối xưng hô có thể chỉ toàn thể cộng đồng; chú thích bảo tồn cả hình thức lẫn phạm vi khả dĩ.
- issue: Sắc thái chủ động hay bị động của πλανηθῇ
  choice: Dùng “lạc khỏi” và nêu các khả năng trong chú thích
  alternative: bị dẫn lạc khỏi; bị lừa mà lìa khỏi
  rationale: Dạng bị động Hy Lạp cho phép sắc thái bị dẫn sai hoặc bị lừa, nhưng trong ngữ cảnh cũng có thể được hiểu là đi lạc. Chính văn không nên giải quyết dứt khoát sự mơ hồ này.
- issue: Đại từ αὐτόν
  choice: người ấy
  alternative: anh ấy; người đó
  rationale: αὐτόν là giống đực số ít theo ngữ pháp, nhưng tiếng Việt tự nhiên có thể dùng “người ấy” để giữ số ít và quan hệ hồi chỉ mà không tạo một sự nhấn mạnh giới tính không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thưa” để đánh dấu lời gọi trực tiếp; tránh giải thích “chân lý” thành một nội dung thần học cụ thể. Dấu phẩy cuối câu được giữ vì câu cú pháp tiếp tục sang câu 20.
