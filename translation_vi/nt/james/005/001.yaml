review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng lời gọi trực tiếp, mệnh lệnh than khóc, và giọng cảnh cáo. Tuy nhiên, “sắp ập xuống” thêm sắc thái cận kề và đột ngột/bạo liệt hơn phân từ hiện tại ἐπερχομέναις (“đang đến/đang kéo đến”) đòi hỏi. “Anh em” cũng dễ hàm ý quan hệ cộng đồng đức tin mà câu này không xác định.
  naturalness: “Nào” là lời mở đầu sắc bén, tự nhiên cho Ἄγε νῦν. “Khóc lóc và than gào” rõ nghĩa, trang trọng, và diễn tả hợp lý mệnh lệnh κλαύσατε được tăng cường bởi ὀλολύζοντες. “Đang kéo đến với các người” tự nhiên trong ngữ cảnh lời cảnh cáo.
  terminology: Đổi “tai họa” thành “khốn khổ” để gần hơn với ταλαιπωρίαις, vốn chỉ những cảnh khổ cực/hoạn nạn nặng nề, không nhất thiết chỉ các biến cố tai họa. Dùng “các người” làm đại từ trực tiếp trung tính về địa vị đức tin, thay vì “anh em”.
  issues:
  - severity: medium
    issue: “sắp ập xuống” diễn giải quá mạnh ταῖς ἐπερχομέναις.
    rationale: Phân từ hiện tại diễn tả những khốn khổ đang tiến đến; nó không tự xác định mức độ cận kề (“sắp”) hay hình ảnh đột ngột, dữ dội (“ập xuống”).
  - severity: medium
    issue: “anh em” có thể tạo hàm ý cộng đồng tín hữu không có trong câu.
    rationale: ὑμῶν chỉ là đại từ ngôi thứ hai số nhiều. Trong một lời quở trách tiên tri hướng đến “những người giàu có,” “các người” giữ được lời gọi trực tiếp mà không xác định căn tính tôn giáo của người nghe.
