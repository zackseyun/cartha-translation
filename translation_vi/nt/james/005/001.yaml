id: JAS.5.1
reference: James 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: vi
  text: Nào, những người giàu có, hãy khóc lóc và than gào[a] vì những khốn khổ[b] đang kéo đến với các người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kêu gào” hoặc “tru lên.” Từ Hy Lạp diễn tả tiếng than lớn, công khai.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những hoạn nạn” hoặc “những tai họa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Này
  rationale: Cụm này là lời gọi trực tiếp, sắc bén, mở đầu một lời quở trách. “Này” tự nhiên trong tiếng Việt hiện đại và giữ được sức nặng của lời triệu gọi.
- source_word: οἱ πλούσιοι
  choice: những người giàu có
  rationale: Danh cách được dùng như hô cách để trực tiếp gọi những người giàu; cách dịch này rõ nghĩa mà không xác định thêm họ là tín hữu hay người ngoài.
- source_word: κλαύσατε
  choice: hãy khóc lóc
  rationale: Mệnh lệnh aorist kêu gọi sự than khóc bộc lộ ra ngoài; “hãy khóc lóc” có sắc thái mạnh và trang trọng hơn “hãy khóc” trong ngữ cảnh này.
- source_word: ὀλολύζοντες
  choice: than gào
  rationale: Phân từ hiện tại tăng cường mệnh lệnh, diễn tả tiếng than lớn và công khai. “Than gào” truyền đạt cả nỗi than và âm lượng mà không nghiêng hẳn sang sắc thái thú vật của “tru lên”.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: vì những tai họa
  rationale: ἐπί với tặng cách ở đây chỉ nguyên do hoặc đối tượng của sự than khóc; “vì” tự nhiên trong tiếng Việt. ταλαιπωρίαις chỉ những khốn cảnh, hoạn nạn nghiêm trọng; “tai họa” phù hợp với giọng phán xét.
- source_word: ὑμῶν ταῖς ἐπερχομέναις
  choice: sắp ập xuống trên anh em
  rationale: Phân từ ἐπερχομέναις bổ nghĩa cho “những tai họa” và diễn tả chúng đang tiến đến. “Sắp ập xuống trên” chuyển đạt sinh động ý tai họa đến trên người nghe mà không biến ὑμῶν thành sở hữu đơn thuần.
theological_decisions:
- issue: Giọng điệu và đối tượng của lời nói với người giàu
  choice: Giữ đây là lời quở trách mang tính tiên tri nhắm trực tiếp đến những người giàu đang đối diện tai họa/phán xét sắp đến, nhưng không xác định địa vị đức tin của họ.
  alternative: Hiểu riêng là lời nói với các địa chủ không tin Chúa áp bức người khác, hoặc riêng với những thành viên giàu có trong cộng đồng Cơ Đốc.
  rationale: Câu này chỉ trực tiếp gọi “những người giàu có” và báo trước tai họa; nó không tự xác định họ là tín hữu hay người không tin. Bản dịch không thu hẹp đối tượng vượt quá văn bản.
- issue: Cách xưng hô với đối tượng bị quở trách
  choice: Dùng “anh em” trong vế “ập xuống trên anh em” như đại từ số nhiều trực tiếp, không hàm ý quyết định rằng họ là tín hữu.
  alternative: Dùng “các ngươi” để tăng sắc thái phán xét hoặc “các ông” để tránh liên tưởng cộng đồng đức tin.
  rationale: “Anh em” là cách xưng hô số nhiều trang trọng, phổ biến trong văn bản Kinh Thánh tiếng Việt; ở đây nó chuyển tải ὑμῶν mà không tự nó giải quyết căn tính thần học của người nghe.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, giữ nhịp điệu gấp gáp của lời quở trách tiên tri. Hai dấu chú thích [a], [b] đều xuất hiện ngay trong chính văn và nêu các khả năng từ vựng thực sự của nguyên ngữ.
