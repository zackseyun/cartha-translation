  rationale: Bản sửa giữ lời triệu gọi và lời cảnh cáo gay gắt của nguyên văn, nhưng tránh tăng cường thời điểm hay cách thức những khốn khổ đến. Nó cũng thay đại từ “anh em” bằng “các người” để không áp đặt một kết luận thần học về đối tượng được gọi.
