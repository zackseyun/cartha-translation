id: JAS.5.4
reference: James 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: vi
  text: Kìa, tiền công của những người làm công đã gặt ruộng đồng của các ông, mà các ông đã giữ lại, đang kêu lên; và tiếng kêu của những người gặt đã thấu đến tai Chúa Vạn Quân[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Chúa Sa-ba-ốt.” Tiếng Hy Lạp giữ dạng phiên âm của tước hiệu Hê-bơ-rơ Sabaoth, nghĩa là “Vạn Quân” hoặc “các đạo quân.”
    reason: Ghi lại cách phiên âm truyền thống và giải thích tước hiệu thần linh trong nguyên văn.
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Từ gọi sự chú ý có tính nhấn mạnh; “Kìa” tự nhiên, trang trọng và giữ được sức trực tiếp của lời tố cáo.
- source_word: μισθὸς
  choice: tiền công
  rationale: Chỉ khoản thù lao phải trả cho người lao động; “tiền công” rõ nghĩa trong bối cảnh thuê người gặt.
- source_word: ἐργατῶν
  choice: những người
  rationale: Ý nghĩa “người lao động” được thể hiện đầy đủ trong cụm “những người đã gặt”; cách này tránh lặp nặng nề mà không làm mất đối tượng.
- source_word: ἀμησάντων τὰς χώρας ὑμῶν
  choice: đã gặt ruộng đồng các ông
  rationale: Diễn đạt hoạt động thu hoạch trên đất canh tác của những địa chủ đang bị quở trách; “ruộng đồng” tự nhiên hơn cách dịch quá khái quát là “đất đai”.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: bị các ông giữ lại
  rationale: Giữ thể bị động và lời cáo buộc trực tiếp, đồng thời không diễn giải mạnh hơn thành “lừa đoạt” dù ngữ cảnh hàm ý sự bất công.
- source_word: κράζει
  choice: đang kêu lên
  rationale: 'Giữ phép nhân hóa sống động: chính tiền công bị giữ lại cất tiếng đòi công lý.'
- source_word: βοαὶ
  choice: tiếng kêu
  rationale: Chỉ lời kêu cứu hoặc kêu đòi công lý khẩn thiết; cách dịch trực tiếp và dễ hiểu.
- source_word: θερισάντων
  choice: những người gặt
  rationale: Danh hóa phân từ theo cách tự nhiên trong tiếng Việt, xác định những người làm công trong mùa gặt.
- source_word: εἰς τὰ ὦτα
  choice: đã lọt vào tai
  rationale: Bảo tồn hình ảnh Kinh Thánh “vào tai” trong một cấu trúc tiếng Việt tự nhiên.
- source_word: Κυρίου Σαβαὼθ
  choice: Chúa các đạo quân
  rationale: Dịch tước hiệu gốc Hê-bơ-rơ được tiếng Hy Lạp phiên âm; “các đạo quân” truyền đạt nghĩa của צבאות/Sabaoth thay vì để một từ khó hiểu trong chính văn.
- source_word: εἰσεληλύθασιν
  choice: đã lọt vào
  rationale: Thể hoàn thành diễn tả tiếng kêu đã đi vào tai Chúa và kết quả ấy vẫn còn hiệu lực; “đã lọt vào” giữ hình ảnh chuyển động lẫn sắc thái hiện tại của kết quả.
theological_decisions:
- issue: Cách dịch tước hiệu thần linh Κυρίου Σαβαὼθ
  choice: Chúa các đạo quân
  alternative: Chúa Sa-ba-ốt
  rationale: Chính văn chuyển tải ý nghĩa của tước hiệu để độc giả hiện đại hiểu được, còn dạng phiên âm truyền thống được ghi ở chú thích. Không thu hẹp “các đạo quân” chỉ vào quân đội loài người hay chỉ vào thiên binh, nhờ đó giữ độ rộng nghĩa của tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dấu gạch ngang làm rõ rằng chính “tiền công” là thứ bị giữ lại, đồng thời bảo toàn phép nhân hóa và sức nặng tố cáo của câu. Đại từ “các ông” phù hợp với nhóm địa chủ giàu có được ngỏ lời trong ngữ cảnh.
