revisions:
- from: Kìa, tiền công của những người đã gặt ruộng đồng các ông—tiền công bị các ông giữ lại—đang kêu lên; và tiếng kêu của những người gặt đã lọt vào tai Chúa các đạo quân[a].
  to: Kìa, tiền công của những người làm công đã gặt ruộng đồng của các ông, mà các ông đã giữ lại, đang kêu lên; và tiếng kêu của những người gặt đã thấu đến tai Chúa Vạn Quân[a].
  rationale: Bản sửa loại bỏ sự lặp không cần thiết của “tiền công”, phục hồi rõ danh từ “người làm công” trong nguyên văn, và dùng các cách diễn đạt tiếng Việt tự nhiên hơn cho việc tiếng kêu đã đến tai Chúa. Không thay đổi ý nghĩa, phép nhân hóa, lời cáo buộc trực tiếp, hay sắc thái hoàn thành của nguyên văn.
  reviewer_model: gpt-5.6-terra
