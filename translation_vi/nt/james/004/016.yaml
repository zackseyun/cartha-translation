  terminology: “Khoe khoang” nhất quán cho καυχᾶσθε/καύχησις. “Lời tự phụ” là cách diễn đạt phù hợp cho ἀλαζονείαις trong ngữ cảnh những lời quả quyết tự tin về dự định, mà không biến danh từ này thành “kế hoạch” hay “mưu tính.” “Xấu xa” truyền đạt sức nặng luân lý của πονηρά.
  issues:
