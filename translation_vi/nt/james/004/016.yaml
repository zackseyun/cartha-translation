base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: vi
  text: Nhưng bây giờ, anh em khoe khoang về những lời tự phụ của mình.[a] Mọi sự khoe khoang như thế đều là xấu xa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “về sự tự phụ của mình”, “về những điều mình khoác lác”, hoặc “về những lời quả quyết đầy kiêu ngạo của mình”. Từ Hy Lạp có thể chỉ sự tự phụ nói chung; trong ngữ cảnh này, có lẽ nó đặc biệt nói đến những kế hoạch đầy tự tin được nêu ở các câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Nhưng hiện nay
  rationale: Diễn đạt trực tiếp sự tương phản giữa thái độ lệ thuộc vào Chúa ở câu trước và thực trạng hiện tại của người nghe.
- source_word: καυχᾶσθε
  choice: anh em lại khoe khoang
  rationale: “Khoe khoang” truyền đạt tự nhiên ý của động từ καυχάομαι; từ “lại” làm rõ sắc thái tương phản của δέ trong tiếng Việt.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: về những lời tự phụ của mình
  rationale: ἀλαζονεία có thể chỉ sự tự phụ, những lời khoác lác hoặc những tuyên bố đầy tự tin kiêu ngạo. Cách dịch số nhiều này giữ liên hệ với những lời quả quyết về kế hoạch ở các câu trước mà không thêm hẳn ý “mưu tính” vốn không có trực tiếp trong từ Hy Lạp.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Mọi sự khoe khoang như thế
  rationale: Giữ mối liên hệ từ vựng với καυχᾶσθε và diễn đạt tự nhiên ý khái quát của πᾶσα cùng τοιαύτη.
- source_word: πονηρά
  choice: xấu xa
  rationale: Thể hiện sự phán xét về đạo đức, mạnh hơn nghĩa đơn thuần là “không tốt”, đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của sự khoe khoang bị lên án
  choice: Câu này lên án việc tự phụ khoe khoang qua những lời quả quyết đầy tự tin về kế hoạch của con người, như thể không lệ thuộc vào Chúa.
  alternative: Có thể hiểu là lời lên án chung đối với mọi hình thức tự tin, hoặc chỉ giới hạn ở việc lập kế hoạch buôn bán.
  rationale: Ngữ cảnh Gia-cơ 4:13–15 hướng đến các kế hoạch tự phụ, nhưng câu kết luận dùng ngôn ngữ khái quát. Bản dịch giữ cả nét cụ thể theo ngữ cảnh lẫn phạm vi nguyên tắc rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” theo lối xưng hô cộng đồng trong thư Gia-cơ. Tránh dịch ἀλαζονείαις thành “những mưu tính kiêu ngạo” vì cách đó làm rõ ngữ cảnh nhưng thêm một ý không nằm trực tiếp trong danh từ Hy Lạp.
