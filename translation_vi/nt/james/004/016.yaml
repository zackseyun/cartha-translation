  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính: sự khoe khoang xuất phát từ/nhắm vào sự tự phụ, và mọi kiểu khoe khoang ấy bị đánh giá là có tính đạo đức xấu. Tuy nhiên, “hiện nay” thiên về thời gian đương thời hơn là dấu hiệu chuyển ý νῦν δέ; “lại” thêm sắc thái lặp lại không được nêu rõ trong nguyên ngữ. “Nhưng bây giờ” giữ tương phản diễn ngôn sát hơn.'
