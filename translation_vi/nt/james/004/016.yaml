revisions:
- from: Nhưng hiện nay, anh em lại khoe khoang về những lời tự phụ của mình.[a] Mọi sự khoe khoang như thế đều là xấu xa.
  to: Nhưng bây giờ, anh em khoe khoang về những lời tự phụ của mình.[a] Mọi sự khoe khoang như thế đều là xấu xa.
  rationale: Thay “Nhưng hiện nay ... lại” bằng “Nhưng bây giờ” để phản ánh νῦν δέ như một chuyển ý tương phản mà không thêm ý lặp lại. Giữ “những lời tự phụ” và chú thích để bảo tồn biên độ nghĩa của ἀλαζονεία cũng như liên hệ ngữ cảnh với các kế hoạch ở câu 13–15, nhưng không đưa “kế hoạch” vào bản văn chính.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:00Z'
