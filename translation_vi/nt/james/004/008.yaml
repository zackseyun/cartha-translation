id: JAS.4.8
reference: James 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: vi
  text: Hãy đến gần Đức Chúa Trời, và Ngài sẽ đến gần anh em. Hãy làm sạch tay mình, hỡi những người tội lỗi; hãy thanh tẩy lòng mình, hỡi những người hai lòng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “những người có hai tâm hồn.” Từ này chỉ người bị phân chia trong lòng trung thành hoặc sự cam kết nội tâm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Hãy đến gần
  rationale: Mệnh lệnh aorist số nhiều; cách dịch tự nhiên, giữ ý chủ động đến gần Đức Chúa Trời và tạo phép đối xứng với mệnh đề kế tiếp.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Bổ ngữ gián tiếp của ἐγγίζω; được chuyển ngữ trực tiếp, không thêm nội dung diễn giải.
- source_word: ἐγγιεῖ
  choice: Ngài sẽ đến gần
  rationale: Động từ tương lai ngôi thứ ba số ít, với Đức Chúa Trời là chủ thể được hiểu ngầm; lặp lại “đến gần” để giữ phép song hành của nguyên văn.
- source_word: καθαρίσατε
  choice: hãy làm sạch
  rationale: Mệnh lệnh aorist; “làm sạch” giữ được hình ảnh cụ thể và sắc thái thanh tẩy đạo đức mà không diễn giải thành hành vi bên ngoài.
- source_word: χεῖρας
  choice: tay mình
  rationale: Giữ nguyên hình ảnh “tay”; “mình” được thêm theo cách nói tự nhiên trong tiếng Việt để chỉ tay của những người đang được trực tiếp kêu gọi.
- source_word: ἁμαρτωλοί
  choice: hỡi những người tội lỗi
  rationale: Hô cách số nhiều; giữ lời quở trách trực tiếp nhưng dùng cách diễn đạt rõ ràng, trang trọng và tự nhiên.
- source_word: ἁγνίσατε
  choice: hãy thanh tẩy
  rationale: Giữ sự khác biệt từ vựng với καθαρίσατε và sắc thái làm cho trong sạch ở bình diện nội tâm.
- source_word: καρδίας
  choice: lòng mình
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt cho con người nội tâm, bao gồm động cơ và lòng trung thành, đồng thời giữ hình ảnh của nguyên văn.
- source_word: δίψυχοι
  choice: những người hai lòng
  rationale: Diễn đạt tự nhiên ý về sự phân chia trong lòng trung thành hoặc cam kết nội tâm; chú thích giữ lại hình ảnh sát chữ của từ Hy Lạp.
theological_decisions:
- issue: Hình ảnh thân thể trong lời kêu gọi thanh tẩy về đạo đức
  choice: Giữ các hình ảnh “tay” và “lòng” mà không giải nghĩa ngay trong chính văn.
  alternative: Diễn ý thành hành vi bên ngoài và động cơ bên trong.
  rationale: Lời của Gia-cơ có thể mang cả âm hưởng nghi lễ lẫn sức nặng đạo đức. Giữ nguyên hình ảnh giúp bảo toàn chiều rộng và sự căng thẳng của nguyên văn.
- issue: Cách chuyển ngữ δίψυχοι
  choice: Dùng “những người hai lòng” trong chính văn.
  alternative: Dịch sát hình ảnh cấu tạo từ là “những người có hai tâm hồn”.
  rationale: “Hai lòng” dễ hiểu trong tiếng Việt hiện đại và truyền đạt sự chia rẽ trong lòng trung thành; chú thích bảo tồn hình ảnh Hy Lạp đặc sắc mà không làm chính văn trở nên tối nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Hai mệnh lệnh “làm sạch” và “thanh tẩy” giữ sự biến đổi từ ngữ của tiếng Hy Lạp; “tay” và “lòng” bảo toàn phép đối xứng giữa đời sống bên ngoài và con người bên trong mà không biến điều đó thành lời diễn giải trong chính văn.
