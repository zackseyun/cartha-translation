id: JAS.4.1
reference: James 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: vi
  text: Các cuộc chiến giữa anh chị em từ đâu mà ra, và các cuộc giao tranh từ đâu mà có?[a][b] Chẳng phải chúng đến từ đây sao—từ những lạc thú đang giao chiến trong các chi thể của anh chị em?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “xung đột ... cãi vã”. Tiếng Hy Lạp dùng các từ ngữ quân sự, theo nghĩa đen là “các cuộc chiến” và “các cuộc giao tranh”, để nói về những bất hòa trong cộng đồng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “trong anh chị em”. Cụm từ Hy Lạp có thể chỉ xung đột giữa các độc giả hoặc xung đột bên trong họ. Toàn câu liên kết sự tranh chấp bên ngoài với các lạc thú bên trong.
    reason: alternative_reading
  - marker: c
    text: “Các chi thể” là cách dịch sát nghĩa; cụm từ này có thể chỉ các bộ phận thân thể hoặc, theo nghĩa rộng hơn, những năng lực hoạt động bên trong một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... πόθεν
  choice: từ đâu mà ra ... từ đâu mà có
  rationale: Giữ lại sự lặp lại của trạng từ nghi vấn chỉ nguồn gốc, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: πόλεμοι
  choice: các cuộc chiến
  rationale: Giữ hình ảnh quân sự mạnh của nguyên ngữ; trong ngữ cảnh, từ này được dùng theo nghĩa ẩn dụ về những xung đột nghiêm trọng trong cộng đồng.
- source_word: μάχαι
  choice: các cuộc tranh đấu
  rationale: Phân biệt với πόλεμοι nhưng vẫn giữ sắc thái đối đầu; cách dịch này tự nhiên hơn “trận đánh” khi nói về bất hòa trong cộng đồng.
- source_word: ἐν ὑμῖν
  choice: giữa anh chị em
  rationale: Ưu tiên nghĩa cộng đồng trong mệnh đề mở đầu, nơi Gia-cơ nói đến xung đột giữa các độc giả; “anh chị em” chuyển tải số nhiều và bao gồm cả cộng đồng.
- source_word: οὐκ ἐντεῦθεν
  choice: Chẳng phải chúng đến từ đây sao
  rationale: Giữ câu hỏi tu từ chờ đợi câu trả lời khẳng định và để “đây” hướng tới nguồn được nêu ngay sau đó.
- source_word: ἡδονῶν
  choice: những lạc thú
  rationale: Diễn đạt trực tiếp ý nghĩa về khoái lạc, sự hưởng thụ, mà không thu hẹp thành dục vọng tình dục hoặc diễn giải quá sớm thành mọi loại ham muốn.
- source_word: στρατευομένων
  choice: đang giao chiến
  rationale: Giữ hình ảnh quân sự và sắc thái hoạt động đang tiếp diễn, đồng thời liên kết với “các cuộc chiến” ở đầu câu.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: trong các chi thể của anh chị em
  rationale: Giữ ẩn dụ thân thể của μέλη và không quyết định thay độc giả rằng từ này chỉ các bộ phận thân thể hay rộng hơn là những năng lực bên trong con người.
theological_decisions:
- issue: Xung đột ở đầu câu là giữa các thành viên trong cộng đồng hay ở bên trong mỗi người
  choice: Dịch ἐν ὑμῖν là “giữa anh chị em”, còn cụm cuối là “trong các chi thể của anh chị em”.
  alternative: Dịch ἐν ὑμῖν là “trong anh chị em” và cụm cuối là “bên trong anh chị em”.
  rationale: 'Cách dịch chính giữ cả hai chiều kích trong lập luận của Gia-cơ: sự tranh chấp biểu hiện trong cộng đồng bắt nguồn từ cuộc giao chiến của các lạc thú bên trong con người, thay vì quy toàn bộ câu chỉ về xã hội hoặc chỉ về nội tâm.'
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ phép lặp tu từ “từ đâu”, hình ảnh quân sự xuyên suốt và ẩn dụ “các chi thể”. Dùng “anh chị em” để chỉ toàn thể cộng đồng độc giả, tránh khiến số nhiều ὑμῖν bị hiểu là chỉ nam giới.
