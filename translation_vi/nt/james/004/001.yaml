    issue: “Các cuộc tranh đấu” chưa phản ánh nhất quán sắc thái của μάχαι và mâu thuẫn nhẹ với chú thích a.
    rationale: μάχαι là “các trận đánh/cuộc giao tranh/fights,” được đặt song song với πόλεμοι trong hình ảnh quân sự. “Giao tranh” bảo toàn hình ảnh này tốt hơn; chú thích a hiện cũng đã dùng từ đó.
