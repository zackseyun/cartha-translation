revisions:
- from: Các cuộc chiến giữa anh chị em từ đâu mà ra, và các cuộc tranh đấu từ đâu mà có?[a][b] Chẳng phải chúng đến từ đây sao—từ những lạc thú đang giao chiến trong các chi thể của anh chị em?[c]
  to: Các cuộc chiến giữa anh chị em từ đâu mà ra, và các cuộc giao tranh từ đâu mà có?[a][b] Chẳng phải chúng đến từ đây sao—từ những lạc thú đang giao chiến trong các chi thể của anh chị em?[c]
  rationale: Đổi duy nhất “các cuộc tranh đấu” thành “các cuộc giao tranh” để phản ánh sát hơn μάχαι, duy trì cặp từ ngữ quân sự πόλεμοι/μάχαι, và làm cho bản văn nhất quán với chú thích a. Không thay đổi cách xử lý các chỗ có thể mơ hồ hoặc các neo chú thích.
  reviewer_model: gpt-5.6-terra
