source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: vi
  text: 'Thay vào đó, anh em nên nói[a]: “Nếu Chúa muốn, chúng ta sẽ sống và làm việc này hay việc kia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “thay vì anh em nói”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Thay vào đó, anh em nên nói
  rationale: Cấu trúc ἀντὶ τοῦ + động từ nguyên mẫu có nghĩa sát là “thay vì anh em nói”. Trong mạch văn, cách dịch này diễn đạt tự nhiên sắc thái sửa bảo hàm ẩn mà không biến nó thành một mệnh lệnh tuyệt đối.
- source_word: Ἐὰν
  choice: Nếu
  rationale: Dẫn vào mệnh đề điều kiện với động từ ở thể giả định; “nếu” là cách tương đương tự nhiên và chính xác trong tiếng Việt.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ danh xưng κύριος và không xác định thêm là Đức Chúa Trời hay Chúa Giê-su, đúng với mức độ xác định của nguyên văn.
- source_word: θελήσῃ
  choice: muốn
  rationale: θέλω chỉ ý muốn hay sự định ý. “Chúa muốn” là cách nói tiếng Việt tự nhiên, trang trọng vừa đủ và giữ ý mọi sự tùy thuộc vào ý Chúa.
- source_word: καὶ ζήσομεν
  choice: chúng ta sẽ sống
  rationale: Thì tương lai cho thấy ngay cả việc tiếp tục sống cũng tùy thuộc vào ý Chúa.
- source_word: καὶ ποιήσομεν
  choice: và làm
  rationale: ποιέω có nghĩa rộng là “làm, thực hiện”. “Và làm” truyền đạt trực tiếp liên từ καί mà không tạo thêm sự nhấn mạnh không cần thiết.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: việc này hay việc kia
  rationale: Cặp chỉ định bất định nói chung về các hoạt động dự tính; thêm “việc” là tự nhiên trong tiếng Việt và không thu hẹp phạm vi nghĩa.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος và quyền tể trị của Ngài đối với sự sống cùng các kế hoạch
  choice: Dịch là “Chúa” mà không xác định thêm đối tượng
  alternative: “Đức Chúa Trời” hoặc “Chúa Giê-su”
  rationale: Nguyên văn chỉ dùng ὁ κύριος. Bản dịch giữ nguyên sự rộng mở về đối tượng quy chiếu, đồng thời bảo toàn ý rằng cả sự sống lẫn hành động của con người đều tùy thuộc vào ý Chúa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” phù hợp với lời trực tiếp gửi đến cộng đồng độc giả; “nên nói” giữ sắc thái khuyên sửa của cấu trúc Hy Lạp, còn “việc này hay việc kia” là lối nói tự nhiên cho các kế hoạch nói chung.
