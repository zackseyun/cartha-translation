  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: vi
  text: Hãy đau khổ, hãy than khóc và hãy khóc.[a] Hãy để tiếng cười của anh em biến thành sự than khóc, và niềm vui thành nỗi u sầu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy chịu cảnh khốn khổ.” Động từ Hy Lạp có thể chỉ tình trạng khốn khổ hoặc đau đớn.'
    reason: lexical_alternative
  - marker: b
    text: “Nỗi u sầu” cũng có thể dịch là “sự ủ rũ”; từ Hy Lạp chỉ một trạng thái buồn bã, cúi mặt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Hãy đau khổ
  rationale: Động từ mệnh lệnh diễn tả việc lâm vào hoặc cảm nhận cảnh khốn khổ, đau đớn. “Hãy đau khổ” giữ được sức nặng của lời truyền và không trùng nghĩa hoàn toàn với hai động từ chỉ than khóc theo sau.
- source_word: πενθήσατε
  choice: than khóc
  rationale: Diễn tả sự tang tóc, buồn đau sâu sắc; trong ngữ cảnh là lời kêu gọi ăn năn đầy đau buồn.
- source_word: κλαύσατε
  choice: khóc lóc
  rationale: Chỉ hành động khóc thành tiếng; cách dịch này phân biệt với nỗi buồn tang chế của πενθήσατε và phù hợp giọng văn nghiêm trọng.
- source_word: ὁ γέλως ὑμῶν
  choice: tiếng cười của anh em
  rationale: Giữ danh từ cụ thể “tiếng cười” và thể hiện rõ sở hữu cách số nhiều.
- source_word: εἰς πένθος
  choice: thành tiếng than khóc
  rationale: Giữ trường nghĩa tang tóc, sầu thảm và tạo liên hệ với πενθήσατε, đồng thời tự nhiên trong cấu trúc chuyển biến của tiếng Việt.
- source_word: μετατραπήτω
  choice: Hãy để ... biến thành
  rationale: Phản ánh mệnh lệnh aorist bị động ngôi thứ ba và diễn tả một sự thay đổi trạng thái mà không xác định tác nhân.
- source_word: ἡ χαρὰ
  choice: niềm vui
  rationale: Giữ danh từ đối xứng với “tiếng cười”; sở hữu cách từ vế trước được hiểu là tiếp tục chi phối theo phép song hành.
- source_word: εἰς κατήφειαν
  choice: thành nỗi u sầu
  rationale: κατήφεια chỉ trạng thái buồn bã, cúi mặt, ủ rũ. “Nỗi u sầu” trang trọng, dễ hiểu và không mang sắc thái lâm sàng.
theological_decisions:
- issue: Ngôn ngữ ăn năn và sức nặng cảm xúc
  choice: Dịch thành lời kêu gọi mạnh mẽ hướng đến sự đau buồn của lòng ăn năn, không làm nhẹ các mệnh lệnh.
  alternative: Hiểu như một lời khuyên nhẹ nhàng rằng nên nghiêm túc hoặc tiết chế hơn.
  rationale: Trong Gia-cơ 4:6–10, chuỗi mệnh lệnh kêu gọi người nghe hạ mình và quay về với Đức Chúa Trời. Bản dịch giữ nguyên mức độ gay gắt của câu mà không thêm một hệ thống thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Ba mệnh lệnh đầu được giữ riêng để bảo toàn nhịp dồn dập của nguyên văn; “anh em” là cách xưng hô số nhiều quen thuộc trong văn bản Kinh Thánh tiếng Việt.
