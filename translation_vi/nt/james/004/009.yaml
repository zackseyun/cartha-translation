    rationale: Từ này thường gợi việc khóc dai dẳng hoặc than vãn, dễ chồng nghĩa với “than khóc” cho πενθήσατε. “Khóc” vừa trực tiếp vừa giữ được phân biệt từ vựng của nguyên văn.
  - severity: low
    issue: “Tiếng than khóc” cho πένθος
    rationale: πένθος chỉ tình trạng than sầu/mourning, không chủ yếu chỉ âm thanh. “Sự than khóc” phản ánh danh từ trừu tượng này chính xác hơn.
