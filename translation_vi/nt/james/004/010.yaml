id: JAS.4.10
reference: James 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: vi
  text: Hãy hạ mình xuống trước mặt Chúa[a], rồi Ngài sẽ nâng anh chị em lên[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong sự hiện diện của Chúa.”
    reason: lexical_alternative
  - marker: b
    text: Hay “Ngài sẽ tôn anh chị em lên.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Hãy hạ mình xuống
  rationale: Động từ mệnh lệnh aorist thể thụ động có thể mang sắc thái phản thân trong lời khuyên bảo. “Hãy hạ mình xuống” tự nhiên trong tiếng Việt và diễn đạt hành động tự nguyện khiêm nhường trước Chúa.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: Diễn đạt tự nhiên cả ý nghĩa tương quan lẫn ý đứng trong sự hiện diện của một người; chú thích giữ phương án “trong sự hiện diện của”.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ nguyên danh xưng κύριος và không xác định thêm là Đức Chúa Trời hay Chúa Giê-su, vì câu Hy Lạp không buộc phải giải quyết đối tượng quy chiếu.
- source_word: ὑψώσει
  choice: sẽ nâng ... lên
  rationale: Giữ hình ảnh đối lập trực tiếp với việc hạ mình, đồng thời có thể chỉ sự nâng cao về địa vị hoặc danh dự chứ không chỉ sự an ủi cảm xúc.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được thể hiện rõ bằng cách xưng hô cộng đồng tự nhiên, phù hợp văn phong thư tín Cơ Đốc trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ là “Chúa” mà không xác định thêm
  alternative: Đức Chúa Trời; Chúa Giê-su
  rationale: Trong thư Gia-cơ, κύριος có thể chỉ Đức Chúa Trời hoặc Chúa Giê-su. Ngữ cảnh trực tiếp không đòi hỏi thu hẹp đối tượng, nên bản dịch bảo tồn sự hàm hồ thật sự của nguyên văn.
- issue: Ý nghĩa của việc Chúa “nâng lên”
  choice: Giữ hình ảnh “nâng ... lên”
  alternative: tôn cao; ban địa vị cao trọng
  rationale: Cách dịch này giữ thế đối xứng hạ xuống–nâng lên và không xác định quá mức việc nâng lên là danh dự hiện tại, phục hồi thuộc linh hay sự tôn cao trong tương lai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ số nhiều của ὑμᾶς; “Ngài” chỉ về Chúa. Hai chú thích được đặt ngay sau các cụm từ tương ứng trong câu chính.
