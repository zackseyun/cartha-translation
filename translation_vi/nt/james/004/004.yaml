  verdict: revise
  source_fidelity: 'Bản dịch giữ tốt các đối ứng chính: μοιχαλίδες được giữ ở giống cái số nhiều; φιλία/φίλος được phản ánh nhất quán bằng “tình bạn/làm bạn”; κόσμος được dịch gọn là “thế gian”; và thế đối lập với “kẻ thù của Đức Chúa Trời” được duy trì. Tuy nhiên, “tự đặt mình vào hàng” diễn giải καθίσταται theo hướng phản thân và chủ động mạnh hơn động từ Hy Lạp đòi hỏi. Trong ngữ cảnh này, “trở thành” phản ánh an toàn hơn việc đi vào địa vị kẻ thù của Đức Chúa Trời, mà không phủ nhận trách nhiệm hàm ý từ βουληθῇ (“muốn”).'
  naturalness: Văn phong nhìn chung rõ, trang trọng, và phù hợp tiếng Việt hiện đại. “Hỡi những người đàn bà ngoại tình” giữ được hô cách giống cái và tính gay gắt của nguyên văn; chú thích giúp người đọc nhận ra khả năng ẩn dụ. Câu sau tự nhiên hơn với “trở thành” thay cho thành ngữ “tự đặt mình vào hàng”.
  terminology: “Đức Chúa Trời,” “thế gian,” “tình bạn,” “sự thù nghịch,” “làm bạn,” và “kẻ thù” đều nhất quán và thích hợp. “Sự thù nghịch với Đức Chúa Trời” bảo lưu được độ mở hợp lý của sở hữu cách τοῦ θεοῦ; chú thích nêu phương án hướng trực tiếp đến Đức Chúa Trời mà không áp đặt nó vào chính văn.
