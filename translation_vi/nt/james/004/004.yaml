id: JAS.4.4
reference: James 4:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: vi
  text: Hỡi những người đàn bà ngoại tình[a], các người không biết rằng tình bạn với thế gian[b] là sự thù nghịch với Đức Chúa Trời[c] sao? Vì vậy, ai muốn làm bạn với thế gian thì trở thành kẻ thù của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng danh từ giống cái số nhiều, nghĩa đen là “những người đàn bà ngoại tình”. Ở đây rất có thể đó là hình ảnh về sự bất trung thuộc linh đối với Đức Chúa Trời, tương tự ngôn ngữ giao ước trong các sách tiên tri.
    reason: lexical_alternative
  - marker: b
    text: “Thế gian” ở đây chỉ trật tự và hệ giá trị của nhân loại trong sự chống nghịch Đức Chúa Trời, chứ không phải chính công trình sáng tạo.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “là sự thù địch đối với Đức Chúa Trời”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: những người đàn bà ngoại tình
  rationale: Giữ nghĩa trực tiếp của danh từ giống cái số nhiều ở hô cách, không làm nhẹ hình ảnh sắc bén trong nguyên văn. Trong ngữ cảnh, cách gọi này rất có thể mang nghĩa ẩn dụ về sự bất trung với Đức Chúa Trời.
- source_word: οὐκ οἴδατε
  choice: các người không biết ... sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ phủ định, đồng thời giữ giọng quở trách trực tiếp của nguyên văn.
- source_word: φιλία
  choice: tình bạn
  rationale: Tương ứng trực tiếp với danh từ chỉ quan hệ bạn bè và duy trì liên hệ từ vựng với φίλος ở vế sau.
- source_word: κόσμου
  choice: thế gian
  rationale: “Thế gian” là cách diễn đạt quen thuộc trong tiếng Việt cho κόσμος khi chỉ trật tự nhân loại đối nghịch với Đức Chúa Trời; không mở rộng thành một lời giải nghĩa ngay trong chính văn.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: sự thù nghịch với Đức Chúa Trời
  rationale: Giữ sức nặng quan hệ của ἔχθρα và không quyết định quá mức sắc thái của sở hữu cách τοῦ θεοῦ; “với” có thể bao quát tình trạng đối nghịch, trong khi chú thích nêu cách hiểu hướng về Đức Chúa Trời.
- source_word: ὃς ἐὰν οὖν
  choice: Vì vậy, ai
  rationale: “Vì vậy” thể hiện suy luận của οὖν, còn “ai” diễn đạt mệnh đề quan hệ phiếm chỉ.
- source_word: βουληθῇ
  choice: muốn
  rationale: Diễn đạt tự nhiên ý chí hay chủ tâm, không tăng nghĩa thành một quyết định chính thức.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: làm bạn với thế gian
  rationale: Giữ hình ảnh quan hệ bạn bè và mối liên hệ với “tình bạn” ở vế trước; tránh diễn giải thành “sống theo thế gian”.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: kẻ thù của Đức Chúa Trời
  rationale: Phản ánh trực tiếp danh từ hóa của ἐχθρός và duy trì thế đối lập mạnh giữa “bạn” và “kẻ thù”.
- source_word: καθίσταται
  choice: tự đặt mình vào hàng
  rationale: Diễn đạt việc một người đi vào hoặc tự đặt mình trong địa vị ấy, phù hợp với sự chủ tâm ở βουληθῇ, nhưng chú thích vẫn bảo lưu cách dịch ít nhấn mạnh tác nhân hơn là “trở thành”.
theological_decisions:
- issue: Sức mạnh ẩn dụ của μοιχαλίδες
  choice: Giữ cách gọi trực tiếp “những người đàn bà ngoại tình” trong chính văn.
  alternative: những người bất trung; những kẻ ngoại tình
  rationale: Lối gọi này nhiều khả năng vang vọng ngôn ngữ giao ước của các tiên tri, trong đó ngoại tình là hình ảnh về sự bất trung thuộc linh. Tuy nhiên, nguyên văn dùng danh từ giống cái cụ thể, nên không thay bằng một lời diễn giải trung tính.
- issue: Ý nghĩa của κόσμος
  choice: Dịch là “thế gian” và giải thích phạm vi nghĩa trong chú thích.
  alternative: trật tự thế gian chống nghịch Đức Chúa Trời
  rationale: Trong câu này, κόσμος không lên án công trình sáng tạo, nhưng chỉ trật tự và hệ giá trị của nhân loại đối nghịch với Đức Chúa Trời. Chính văn vẫn giữ độ hàm súc của nguyên ngữ.
- issue: Quan hệ trong ἔχθρα τοῦ θεοῦ
  choice: Dùng “sự thù nghịch với Đức Chúa Trời”.
  alternative: sự thù địch đối với Đức Chúa Trời; tình trạng làm kẻ thù của Đức Chúa Trời
  rationale: Sở hữu cách có thể được hiểu theo hướng khách thể, tức sự thù nghịch nhắm vào Đức Chúa Trời, nhưng cấu trúc cũng nhấn mạnh rộng hơn tình trạng đối nghịch với Ngài. Bản dịch không thu hẹp hơn mức cần thiết.
- issue: Tác nhân tính của καθίσταται
  choice: Dịch “tự đặt mình vào hàng kẻ thù” để liên kết với ý muốn có chủ tâm ở vế trước.
  alternative: trở thành kẻ thù của Đức Chúa Trời
  rationale: Động từ chỉ việc đi vào hay được đặt vào một địa vị. Ngữ cảnh hỗ trợ trách nhiệm của chủ thể, song cách “trở thành” vẫn khả hữu và được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. “Hỡi” giữ sắc thái hô gọi nghiêm khắc; “các người” phản ánh lời quở trách mạnh mà không thêm một cách xưng hô thân mật không có trong nguyên văn. Cặp “tình bạn/làm bạn” và “thù nghịch/kẻ thù” giữ cấu trúc đối lập của câu Hy Lạp.
