review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng hai mệnh lệnh số nhiều và kết quả tương lai: quy phục Đức Chúa Trời, chống cự διάβολος, và kẻ ấy sẽ chạy trốn khỏi người đọc. Tuy nhiên, “Nhưng” có thể làm sắc thái đối nghịch của δέ mạnh hơn cần thiết; δέ ở đây phù hợp hơn với một chuyển ý có tương phản nhẹ.'
  naturalness: “Vậy, hãy” có dấu phẩy hơi ngắt quãng không cần thiết trong văn xuôi tiếng Việt hiện đại. “Còn hãy” nối hai mệnh lệnh tự nhiên, rõ quan hệ chuyển ý, và tránh lối diễn đạt quá đối kháng. “Ma quỷ sẽ chạy trốn” rõ chủ ngữ theo ngữ cảnh, nên không cần đại từ “nó.”
  terminology: “Quy phục Đức Chúa Trời,” “chống lại,” và “ma quỷ” đều là các cách dùng quen thuộc, trang trọng, và phù hợp với ngữ cảnh. Chú thích đưa ra phương án “đặt mình dưới quyền” phản ánh hợp lý lực phản thân/thụ động của ὑποτάγητε.
  issues:
  - severity: low
    issue: Liên từ “Nhưng” diễn đạt δέ hơi mạnh.
    rationale: δέ thường đánh dấu sự tiếp nối hoặc tương phản nhẹ. “Còn” bảo toàn sự đối chiếu giữa thái độ đối với Đức Chúa Trời và đối với ma quỷ mà không nhấn mạnh một đối nghịch mạnh hơn nguyên văn.
  - severity: low
    issue: Dấu phẩy sau “Vậy” không cần thiết.
    rationale: Trong câu mệnh lệnh ngắn này, “Vậy hãy” trôi chảy và tự nhiên hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: Đại từ “nó” sau “ma quỷ” không cần thiết.
    rationale: Chủ ngữ của “sẽ chạy trốn” đã được xác định rõ từ mệnh đề trước; lược đại từ giúp câu gọn và trang trọng hơn, không làm mất nghĩa.
