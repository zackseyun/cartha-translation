reference: James 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: vi
  text: Vậy hãy quy phục Đức Chúa Trời[a]. Còn hãy chống lại ma quỷ, thì ma quỷ sẽ chạy trốn khỏi anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy đặt mình dưới quyền Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: hãy quy phục
  rationale: Mệnh lệnh aorist thụ động số nhiều của ὑποτάσσω được dùng với ý nghĩa phản thân trong lời khuyên bảo. “Hãy quy phục” diễn đạt tự nhiên việc tự đặt mình dưới thẩm quyền của Đức Chúa Trời, đồng thời tránh sắc thái thuần túy cưỡng ép.
- source_word: οὖν
  choice: Vậy
  rationale: Giữ quan hệ suy luận với lập luận ngay trước đó bằng một liên từ ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Bổ ngữ gián tiếp của ὑποτάγητε; “quy phục Đức Chúa Trời” là cấu trúc tự nhiên trong tiếng Việt.
- source_word: ἀντίστητε
  choice: hãy chống lại
  rationale: Mệnh lệnh aorist chủ động, chỉ việc đứng lên chống lại hoặc kháng cự; “chống lại” rõ nghĩa và phù hợp với lời khuyên luân lý.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái tương phản giữa quy phục Đức Chúa Trời và chống lại ma quỷ.
- source_word: τῷ διαβόλῳ
  choice: ma quỷ
  rationale: Trong ngữ cảnh này, διάβολος có mạo từ và chỉ kẻ đối nghịch mang tính cá vị; “ma quỷ” là cách gọi thông dụng, dễ hiểu trong tiếng Việt.
- source_word: καὶ
  choice: thì
  rationale: Trong kết cấu mệnh lệnh–kết quả của tiếng Việt, “thì” diễn đạt tự nhiên kết quả được hứa sau hành động chống lại, dù liên từ Hy Lạp theo nghĩa đen là “và”.
- source_word: φεύξεται
  choice: nó sẽ chạy trốn
  rationale: Động từ tương lai diễn tả kết quả của sự chống lại. Đại từ “nó” làm rõ chủ thể là ma quỷ; “chạy trốn” giữ được sức mạnh cụ thể của φεύγω.
- source_word: ἀφ’ ὑμῶν
  choice: khỏi anh em
  rationale: ἀπό với sở hữu cách diễn tả chuyển động ra xa. “Khỏi anh em” truyền đạt trực tiếp ý rời xa cộng đồng người đọc; “anh em” phản ánh ngôi thứ hai số nhiều và cách xưng hô trong thư.
theological_decisions:
- issue: Cách hiểu διάβολος
  choice: “ma quỷ” như một kẻ đối nghịch mang tính cá vị
  alternative: “kẻ vu khống” hoặc một nguyên lý xấu xa phi cá vị
  rationale: Danh từ có mạo từ và là đối tượng trực tiếp của hành động chống lại, rồi làm chủ thể của hành động chạy trốn. Ngữ pháp và ngữ cảnh vì thế ủng hộ cách hiểu cá vị, nhưng bản dịch không thêm tên gọi hay mô tả ngoài nguyên văn.
- issue: Quan hệ giữa hai mệnh lệnh
  choice: 'Giữ sự tương phản: quy phục Đức Chúa Trời nhưng chống lại ma quỷ'
  alternative: Nối hai mệnh lệnh đơn thuần bằng “và”
  rationale: δέ có thể chỉ sự chuyển ý nhẹ, nhưng ở đây sự đối lập về tư thế đối với Đức Chúa Trời và đối với ma quỷ được “Nhưng” diễn đạt rõ mà không thêm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Quy phục” đủ quen thuộc trong ngôn ngữ phổ thông có sắc thái tôn giáo; chú thích làm rõ hình ảnh đặt mình dưới thẩm quyền. Đại từ “anh em” phù hợp với lối xưng hô xuyên suốt thư Gia-cơ và số nhiều của nguyên văn.
