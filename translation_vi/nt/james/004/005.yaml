id: JAS.4.5
reference: James 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: vi
  text: Hay anh em tưởng Kinh Thánh nói vô ích sao? Thần Khí mà Đức Chúa Trời đã cho ngự trong chúng ta khát khao một cách ghen tuông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tinh thần mà Ngài đã cho ở trong chúng ta khát khao đến mức đố kỵ.” Tiếng Hy Lạp có thể chỉ Thánh Linh hoặc tinh thần con người; cụm “một cách ghen tuông” cũng có thể được hiểu là “đến mức đố kỵ” hoặc “với lòng đố kỵ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: vô ích
  rationale: Bổ nghĩa cho λέγει, diễn tả việc nói không có tác dụng hay mục đích; “nói vô ích” tự nhiên, trang trọng và giữ được sức nặng của câu hỏi tu từ.
- source_word: ἡ γραφὴ
  choice: Kinh Thánh
  rationale: Cụm số ít có mạo từ chỉ phần Kinh Thánh được viện dẫn với thẩm quyền; tiếng Việt thường dùng tự nhiên là “Kinh Thánh” mà không cần mạo từ.
- source_word: Πρὸς φθόνον
  choice: với lòng ghen tuông
  rationale: Cụm từ khó và có thể mang nghĩa ghen hoặc đố kỵ. Trong cách hiểu chủ ngữ là Thần Khí, “lòng ghen tuông” có thể diễn tả sự đòi hỏi độc quyền chính đáng, đồng thời chú thích giữ lại khả năng tiêu cực “đố kỵ”.
- source_word: ἐπιποθεῖ
  choice: khát khao
  rationale: Diễn tả lòng mong muốn mãnh liệt; “khát khao” là cách nói hiện đại, mạnh và phù hợp văn phong trang trọng.
- source_word: τὸ πνεῦμα
  choice: Thần Khí
  rationale: Bản chính hiểu là Thần Khí của Đức Chúa Trời, nhưng ngữ pháp cũng cho phép hiểu là tâm linh con người; sự mơ hồ thật sự này được nêu trong chú thích.
- source_word: κατῴκισεν
  choice: đã cho ngự
  rationale: Giữ sắc thái tác động khiến cho cư ngụ của động từ causative và thì aorist; “cho ngự” tự nhiên khi nói về Thần Khí.
- source_word: ἐν ἡμῖν
  choice: trong chúng ta
  rationale: Giữ nghĩa nội tại của ἐν và phù hợp với ý niệm ngự trong; không chuyển thành nghĩa tập thể “giữa chúng ta”.
theological_decisions:
- issue: Đối tượng được τὸ πνεῦμα chỉ đến
  choice: “Thần Khí” chỉ Thánh Linh ngự trong người tin
  alternative: “tâm linh” con người mà Đức Chúa Trời đã đặt trong chúng ta
  rationale: Cả hai cách hiểu đều có thể có về mặt ngữ pháp. Bản chính chọn Thánh Linh vì ngôn ngữ “Đức Chúa Trời đã cho ngự trong chúng ta” phù hợp với sự ngự trị của Thánh Linh, nhưng chú thích bảo toàn cách hiểu còn lại.
- issue: Sắc thái đạo đức của Πρὸς φθόνον
  choice: “với lòng ghen tuông” theo nghĩa lòng ghen chính đáng, đòi hỏi sự trung thành trọn vẹn
  alternative: “với lòng đố kỵ” hoặc “đến mức đố kỵ”
  rationale: Nếu chủ ngữ là Thánh Linh, “ghen tuông” có thể nói đến quyền đòi hỏi chính đáng của Đức Chúa Trời đối với dân Ngài. Tuy nhiên, φθόνος thường có sắc thái “đố kỵ”, nên khả năng ấy được ghi rõ trong chú thích.
- issue: Tính chất của lời sau dấu hỏi
  choice: Trình bày như lời Kinh Thánh được dẫn trực tiếp
  alternative: Hiểu như lời tóm lược một chủ đề Kinh Thánh hơn là trích dẫn nguyên văn một câu đã biết
  rationale: Cú pháp giới thiệu một phát biểu của Kinh Thánh, nhưng không tìm thấy câu Cựu Ước nào trùng khít; dấu ngoặc kép giữ cấu trúc dẫn lời mà không khẳng định nguồn cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để diễn đạt chủ ngữ số nhiều hàm ẩn trong δοκεῖτε. Viết hoa “Thần Khí” theo cách hiểu chính là Thánh Linh và nêu rõ cách hiểu “tâm linh” trong chú thích. Bổ sung “Đức Chúa Trời” làm chủ thể hàm ẩn của κατῴκισεν để câu tiếng Việt rõ nghĩa mà không gán chủ thể ngoài ngữ cảnh thần học của mệnh đề.
