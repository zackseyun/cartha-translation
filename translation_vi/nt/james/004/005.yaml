- from: Hay anh em tưởng Kinh Thánh nói vô ích sao? “Thần Khí mà Đức Chúa Trời đã cho ngự trong chúng ta khát khao với lòng ghen tuông.”[a]
  to: Hay anh em tưởng Kinh Thánh nói vô ích sao? Thần Khí mà Đức Chúa Trời đã cho ngự trong chúng ta khát khao một cách ghen tuông.[a]
  rationale: 'Chỉnh sửa chỉ nhằm tăng tính tự nhiên và độ chính xác thuật ngữ: bỏ ngoặc kép không cần thiết, thay trạng ngữ bằng cách nói Việt ngữ tự nhiên hơn, và sửa thuật ngữ chú thích cho khả năng πνεῦμα là tinh thần con người. Ý nghĩa và các khả năng giải thích của câu khó này đều được giữ nguyên.'
