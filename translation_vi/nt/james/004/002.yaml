id: JAS.4.2
reference: James 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: vi
  text: Anh em ham muốn nhưng không có; anh em giết người[b] và ganh ghét[c] nhưng không thể đạt được; anh em đánh nhau và giao chiến. Anh em không có, vì anh em không cầu xin[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Nguyên ngữ dùng một động từ mạnh, thường có nghĩa là “giết người”. Một số người hiểu cách nói này theo nghĩa tu từ, nhưng bản dịch giữ nguyên sức nặng của từ ngữ.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “đố kỵ”.
    reason: lexical_alternative
  - marker: d
    text: Theo văn cảnh, đối tượng được cầu xin là Đức Chúa Trời, dù câu Hy Lạp này không nêu rõ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: ham muốn
  rationale: Diễn đạt một ước muốn mạnh; trong ngữ cảnh này, sắc thái sai trái được làm rõ bởi toàn câu mà không thu hẹp nghĩa vào dục vọng tình dục hay lòng tham tài sản.
- source_word: οὐκ ἔχετε
  choice: không có được
  rationale: Giữ nghĩa trực tiếp của ἔχω, đồng thời “có được” tự nhiên trong tiếng Việt khi nói về điều người ta ham muốn nhưng không đạt tới.
- source_word: φονεύετε
  choice: giết người
  rationale: Giữ nguyên sức nặng đạo đức của φονεύω, vốn thường chỉ hành vi giết người, thay vì làm nhẹ thành một cách nói ẩn dụ.
- source_word: ζηλοῦτε
  choice: ganh ghét
  rationale: Trong mạch văn thù nghịch, ζηλόω mang nghĩa tiêu cực là đố kỵ hoặc ganh ghét; cách chọn này tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: vẫn không thể đạt được
  rationale: Diễn tả rõ sự bất lực trong việc đạt tới điều mong muốn; “vẫn” làm nổi bật kết quả bất thành nhưng không thêm nội dung mới.
- source_word: μάχεσθε
  choice: đánh nhau
  rationale: Bảo toàn sắc thái xung đột mạnh của μάχομαι và phân biệt tương đối với động từ chỉ chiến tranh theo sau.
- source_word: πολεμεῖτε
  choice: giao chiến
  rationale: Giữ sắc thái mạnh hơn, mang hình ảnh chiến tranh của πολεμέω, qua đó bảo toàn sự gia tăng cường độ trong cặp động từ.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: vì anh em không cầu xin
  rationale: Kết cấu với διά nêu nguyên nhân. “Cầu xin” phù hợp ngữ cảnh hướng về Đức Chúa Trời, nhưng không nêu đích danh đối tượng vì bản Hy Lạp không nói rõ trong câu này.
theological_decisions:
- issue: Có nên làm nhẹ φονεύετε thành cách nói ẩn dụ hoặc ít nghiêm trọng hơn hay không
  choice: Giữ “anh em giết người” trong chính văn
  alternative: “anh em giết” hoặc “anh em phạm tội giết người trong lòng”
  rationale: Động từ Hy Lạp có sức nặng rõ rệt; cách hiểu tu từ, cường điệu hay ẩn dụ thuộc phần giải nghĩa, không nên được đưa ngầm vào bản dịch.
- issue: Có nên nêu Đức Chúa Trời là đối tượng của αἰτεῖσθαι hay không
  choice: 'Để đối tượng hàm ẩn: “anh em không cầu xin”'
  alternative: “anh em không cầu xin Đức Chúa Trời”
  rationale: Văn cảnh cho thấy Đức Chúa Trời là Đấng được cầu xin, nhưng câu Hy Lạp không nêu đối tượng; bản dịch giữ nguyên mức độ hàm ẩn đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “anh em” để diễn đạt ngôi thứ hai số nhiều trong lời khuyên bảo cộng đồng. Các vế được nối bằng dấu chấm phẩy để phản ánh nhịp dồn dập của câu Hy Lạp mà vẫn rõ ràng trong tiếng Việt.
