revisions:
- from: Anh em ham muốn mà không có được[a]; anh em giết người[b] và ganh ghét[c] mà vẫn không thể đạt được; anh em đánh nhau và giao chiến. Anh em không có, vì anh em không cầu xin[d].
  to: Anh em ham muốn nhưng không có; anh em giết người[b] và ganh ghét[c] nhưng không thể đạt được; anh em đánh nhau và giao chiến. Anh em không có, vì anh em không cầu xin[d].
  rationale: Sửa “không có được” thành “không có” để phản ánh trực tiếp ἔχετε và duy trì phép lặp với mệnh đề cuối. Sửa “mà vẫn không thể” thành “nhưng không thể” để tránh thêm sắc thái không có trong nguyên văn. Chú thích [a] được bỏ vì “ham muốn” đã là cách dịch chính và chú thích chỉ lặp lại một khả năng mà chính văn đang dùng; các chú thích còn lại được giữ nguyên nội dung và neo đúng vị trí.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng trình tự ba vế và sức mạnh của φονεύετε là “giết người”; cũng giữ đối tượng của αἰτεῖσθαι ở dạng hàm ẩn. Tuy nhiên, “không có được” ở vế đầu dễ chuyển ἔχετε (“có”) thành ý “không thể có/kiếm được”, đồng thời làm mờ sự lặp lại có chủ ý với “Anh em không có” ở cuối câu. Từ “vẫn” không có đối ứng trực tiếp trong nguyên văn.
  naturalness: Câu văn nhìn chung rõ ràng, hiện đại và phù hợp lối xưng hô cộng đồng “anh em”. Bỏ “vẫn” và dùng “nhưng” ở hai chỗ đối lập giúp tiếng Việt trôi chảy hơn mà vẫn phản ánh sự thất bại được diễn tả trong câu Hy Lạp.
  terminology: “Ham muốn,” “giết người,” “ganh ghét,” “đánh nhau,” “giao chiến,” và “cầu xin” đều phù hợp ngữ cảnh. Chú thích về “Đức Chúa Trời” chỉ nêu hàm ý văn cảnh, không đưa đối tượng ấy vào chính văn.
  issues:
  - severity: medium
    issue: “không có được” ở vế đầu
    rationale: οὐκ ἔχετε nghĩa cơ bản là “không có,” không phải động từ “đạt được/có được.” Cách dịch hiện tại cũng làm suy yếu liên kết lặp lại giữa vế đầu và “οὐκ ἔχετε” ở câu cuối.
  - severity: low
    issue: Thêm từ “vẫn” trong “vẫn không thể đạt được”
    rationale: “Vẫn” thêm sắc thái kéo dài hoặc bất chấp một tình trạng trước đó, không được đánh dấu trong οὐ δύνασθε ἐπιτυχεῖν. Không cần thiết để câu tiếng Việt tự nhiên.
