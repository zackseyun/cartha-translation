id: JAS.4.11
reference: James 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: vi
  text: Thưa anh em[b], đừng nói xấu nhau[a]. Người nói xấu một người anh em hoặc xét đoán người anh em mình là nói xấu luật pháp và xét đoán luật pháp. Nhưng nếu anh em xét đoán luật pháp, thì anh em không phải là người thi hành luật pháp, mà là người xét đoán.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng nói chống lại nhau”; động từ Hy Lạp có thể chỉ việc nói chống lại ai theo cách thù nghịch hoặc làm tổn hại thanh danh của người ấy.'
    reason: lexical_alternative
  - marker: b
    text: “Anh em” dịch một từ Hy Lạp ở dạng giống đực số nhiều; ở đây từ này rất có thể chỉ toàn thể cộng đồng, gồm cả anh em và chị em.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: nói xấu
  rationale: “Nói xấu” diễn đạt tự nhiên hành vi nói chống lại người khác theo cách thù nghịch hoặc làm tổn hại thanh danh, đồng thời giữ được sự lặp lại của động từ trong lập luận.
- source_word: ἀλλήλων
  choice: nhau
  rationale: Đại từ tương hỗ tự nhiên trong tiếng Việt, phù hợp với lời khuyên dành cho cộng đồng.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình ảnh gia đình và hình thức xưng gọi của nguyên văn; trong ngữ cảnh, cách gọi này có thể bao gồm toàn thể cộng đồng.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: một người anh em / người anh em mình
  rationale: Giữ nhất quán ẩn dụ gia đình của thư Gia-cơ, không diễn giải rộng thành “người cùng đức tin” trong chính văn.
- source_word: ἢ
  choice: hoặc
  rationale: Thể hiện nghĩa phân tuyển của liên từ, trình bày việc nói xấu và xét đoán như hai hành động song song.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: xét đoán
  rationale: Giữ sự lặp lại từ vựng khi đối tượng là người anh em và luật pháp, đồng thời không thu hẹp nghĩa thành kết án.
- source_word: νόμου / νόμον
  choice: luật pháp
  rationale: Cách gọi xác định được thể hiện tự nhiên trong tiếng Việt mà không chỉ rõ đây là luật Môi-se, luật hoàng gia hay một phạm vi hẹp hơn.
- source_word: ποιητὴς
  choice: người thi hành
  rationale: Diễn đạt tự nhiên người thực hiện điều luật đòi hỏi, đồng thời duy trì sự đối lập với người xét đoán.
- source_word: κριτής
  choice: kẻ xét đoán
  rationale: Giữ liên hệ từ vựng với động từ “xét đoán” và làm nổi bật sự đối lập với “người thi hành”.
theological_decisions:
- issue: Phạm vi của ἀδελφοί trong lời xưng hô với hội chúng
  choice: Dịch “anh em” trong chính văn và ghi chú rằng từ này có thể chỉ toàn thể cộng đồng.
  alternative: anh chị em; các anh chị em trong đức tin
  rationale: Danh từ Hy Lạp ở dạng giống đực số nhiều, nhưng trong ngữ cảnh rất có thể đại diện cho cả nam lẫn nữ. Cách dịch giữ hình thức của nguồn đồng thời giúp độc giả hiểu phạm vi bao quát.
- issue: Đối tượng quy chiếu của νόμος
  choice: Dịch chung là “luật pháp”, không xác định thêm trong chính văn.
  alternative: luật pháp Môi-se; luật hoàng gia; luật pháp của Đức Chúa Trời
  rationale: Mạch thư gợi đến luật pháp của Đức Chúa Trời và bổn phận yêu người lân cận, nhưng câu này không thu hẹp rõ đối tượng quy chiếu; vì vậy bản dịch giữ nguyên độ rộng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thưa anh em” tạo lời xưng hô tự nhiên; “nói xấu” và “xét đoán” được lặp lại có chủ ý để bảo toàn chuỗi lập luận của nguyên văn. Đại từ “bạn” ở mệnh đề điều kiện chuyển tự nhiên từ lời nói chung sang lời trực tiếp ở ngôi thứ hai số ít.
