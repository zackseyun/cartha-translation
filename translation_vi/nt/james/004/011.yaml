revisions:
- from: Thưa anh em[b], đừng nói xấu nhau.[a] Người nói xấu một người anh em hoặc xét đoán người anh em mình là nói xấu luật pháp và xét đoán luật pháp. Nhưng nếu bạn xét đoán luật pháp, thì bạn không phải là người thi hành luật pháp, mà là kẻ xét đoán.
  to: Thưa anh em[b], đừng nói xấu nhau[a]. Người nói xấu một người anh em hoặc xét đoán người anh em mình là nói xấu luật pháp và xét đoán luật pháp. Nhưng nếu anh em xét đoán luật pháp, thì anh em không phải là người thi hành luật pháp, mà là người xét đoán.
  rationale: Chỉnh nhẹ cách xưng hô ở mệnh đề điều kiện để nhất quán với lời gọi cộng đồng, thay “kẻ xét đoán” bằng cách gọi trung tính hơn, và đưa dấu neo chú thích a vào trước dấu câu. Các chỉnh sửa không thay đổi nghĩa, phạm vi quy chiếu của “luật pháp,” hay sự mơ hồ hợp lý của nguyên văn.
  reviewer_model: gpt-5.6-terra
