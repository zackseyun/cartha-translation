source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: vi
  text: Anh chị em không biết ngày mai sẽ ra sao. Đời sống của anh chị em như thế nào? Anh chị em là làn hơi nước[a], hiện ra trong chốc lát rồi tan biến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làn sương”.
    reason: Bảo lưu phạm vi nghĩa của ἀτμίς, vốn có thể gợi hơi nước hoặc sương mỏng.
lexical_decisions:
- source_word: ἐπίστασθε
  choice: không biết
  rationale: Trong ngữ cảnh nói về sự bất định của tương lai, động từ này được diễn đạt tự nhiên và trực tiếp nhất là “không biết”.
- source_word: τὸ τῆς αὔριον
  choice: ngày mai sẽ ra sao
  rationale: Cụm Hy Lạp mang tính tỉnh lược, chỉ những gì thuộc về ngày mai. Cách dịch này tự nhiên trong tiếng Việt và không xác định cụ thể điều bản văn để ngỏ.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Sự sống của anh chị em là gì?
  rationale: Giữ nguyên câu hỏi tu từ về bản chất của đời sống, đồng thời dùng “sự sống” để nối tự nhiên với hình ảnh theo sau.
- source_word: ἀτμὶς
  choice: làn hơi nước
  rationale: Từ này có thể chỉ hơi nước hoặc sương mỏng; “làn hơi nước” diễn tả rõ tính mong manh, thoáng hiện rồi biến mất và phù hợp với các phân từ theo sau.
- source_word: πρὸς ὀλίγον
  choice: trong chốc lát
  rationale: Diễn đạt gọn và tự nhiên khoảng thời gian rất ngắn.
- source_word: φαινομένη
  choice: hiện ra
  rationale: Bảo toàn hình ảnh một thứ tạm thời trở nên hữu hình.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: rồi tan biến
  rationale: Thể hiện đúng trình tự sau đó và sự biến mất, đồng thời kết hợp tự nhiên với hình ảnh “làn hơi nước”.
theological_decisions:
- issue: Hình ảnh ẩn dụ về tính ngắn ngủi và bất định của đời người
  choice: Giữ hình ảnh “làn hơi nước” cùng động tác hiện ra rồi tan biến.
  alternative: Diễn giải thành “đời anh chị em rất ngắn ngủi”.
  rationale: Ẩn dụ của nguyên bản nhấn mạnh giới hạn của con người trước tương lai mà không tự thêm các khẳng định giáo lý về sự chết hay phán xét.
- issue: Đối tượng của đại từ ngôi thứ hai số nhiều
  choice: Dùng “anh chị em” để thể hiện số nhiều và giọng khuyên bảo trực tiếp.
  alternative: Dùng “các bạn” hoặc lược bỏ chủ thể ở một số vị trí.
  rationale: “Anh chị em” trang trọng, dễ hiểu trong văn cảnh thư tín và không hàm ý giới tính chỉ nam.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng gần gũi. Nhịp câu ngắn giữ sức nặng tu từ của câu hỏi và hình ảnh kết thúc; tránh lối diễn giải giáo lý vượt quá bản văn.
