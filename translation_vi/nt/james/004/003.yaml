revisions:
- from: Anh chị em cầu xin mà không nhận được, vì anh chị em cầu xin sai cách, để tiêu phí vào những thú vui của mình.[a]
  to: Anh chị em cầu xin mà không nhận được, vì anh chị em cầu xin không đúng, để tiêu dùng vào những thú vui của mình.[a]
  rationale: Bản sửa chỉ điều chỉnh hai chỗ để tiếng Việt tự nhiên hơn và tránh tăng sắc thái đánh giá hoặc thu hẹp phạm vi nghĩa. Cấu trúc “cầu xin—không nhận được—vì—để” tiếp tục phản ánh αἰτεῖτε καὶ οὐ λαμβάνετε, διότι..., ἵνα..., và đối tượng của việc cầu xin/chi dùng vẫn được để hàm ẩn theo nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng quan hệ nhân quả và mục đích của câu Hy Lạp, không thêm tân ngữ “Đức Chúa Trời”, và chuyển tải được số nhiều của ngôi thứ hai. Tuy nhiên, “tiêu phí vào” thiếu đối tượng rõ ràng trong tiếng Việt và “tiêu phí” nghiêng về “phung phí” hơn δαπανήσητε cần thiết. “Tiêu dùng vào” diễn đạt tự nhiên việc dùng điều đã xin/nhận được mà vẫn để đối tượng hàm ẩn như nguyên văn.
  naturalness: “Anh chị em” phù hợp văn phong thư tín hiện đại. “Cầu xin sai cách” có thể giữ, nhưng “cầu xin không đúng” tự nhiên hơn và tránh gợi riêng phương pháp cầu xin; mệnh đề sau vẫn cho thấy mục đích sai trái. Cụm “tiêu dùng vào những thú vui của mình” trôi chảy hơn “tiêu phí vào...”.
  terminology: “Cầu xin,” “nhận được,” “thú vui,” và “anh chị em” phù hợp. “Những thú vui” bảo toàn nghĩa cơ bản của ἡδοναί mà không thu hẹp thành dục vọng tình dục hay chỉ động cơ. Chú thích nêu đúng lựa chọn từ vựng thay thế.
  issues:
  - severity: low
    issue: “Tiêu phí vào” kém tự nhiên và làm mạnh sắc thái của δαπανήσητε.
    rationale: δαπανήσητε nghĩa là chi dùng/tiêu dùng; ngữ cảnh mang đánh giá tiêu cực nhưng bản thân động từ không nhất thiết là “phung phí.” “Tiêu dùng vào” tự nhiên hơn, vẫn cho phép đối tượng được chi dùng được hiểu ngầm.
  - severity: low
    issue: “Cầu xin sai cách” có thể bị hiểu hẹp là sai phương thức.
    rationale: κακῶς có phạm vi rộng hơn, chỉ sự sai trái/không đúng trong việc xin; mục đích ích kỷ được giải thích ở mệnh đề ἵνα. “Cầu xin không đúng” giữ phạm vi này mà không diễn giải thành chỉ động cơ.
  revised_text: Anh chị em cầu xin mà không nhận được, vì anh chị em cầu xin không đúng, để tiêu dùng vào những thú vui của mình.[a]
