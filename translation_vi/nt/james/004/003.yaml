id: JAS.4.3
reference: James 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: vi
  text: Anh chị em cầu xin mà không nhận được, vì anh chị em cầu xin không đúng, để tiêu dùng vào những thú vui của mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những thú vui” cũng có thể mang nghĩa những ham muốn hưởng lạc hoặc dục vọng buông thả.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε / αἰτεῖσθε
  choice: cầu xin
  rationale: Trong ngữ cảnh này, động từ chỉ việc xin điều gì đó, nhiều khả năng là cầu xin Đức Chúa Trời; “cầu xin” tự nhiên trong tiếng Việt và vẫn không thêm tân ngữ vốn không được nói rõ trong câu Hy Lạp.
- source_word: οὐ λαμβάνετε
  choice: không nhận được
  rationale: Diễn đạt trực tiếp mối liên hệ giữa cầu xin và nhận, đồng thời giữ sắc thái trang trọng, tự nhiên.
- source_word: διότι
  choice: vì
  rationale: Nêu nguyên nhân họ không nhận được một cách rõ ràng và gọn tự nhiên trong tiếng Việt.
- source_word: κακῶς
  choice: sai cách
  rationale: Giữ nghĩa rộng “một cách sai trái/tồi tệ” mà không thu hẹp ngay thành riêng động cơ sai; mệnh đề tiếp theo cho biết mục đích khiến lời cầu xin ấy sai.
- source_word: ἵνα
  choice: để
  rationale: Giữ lực chỉ mục đích của liên từ Hy Lạp và tạo câu tiếng Việt tự nhiên.
- source_word: δαπανήσητε
  choice: tiêu phí
  rationale: Truyền đạt việc dùng hết hay chi dùng những gì được xin; “tiêu phí” phù hợp với sắc thái tiêu cực của ngữ cảnh mà không mạnh đến mức “phung phí”.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: vào những thú vui của mình
  rationale: “Thú vui” chuyển tải ἡδονή là khoái lạc hoặc ham muốn đem lại khoái lạc; giới từ “vào” kết hợp tự nhiên với “tiêu phí” trong tiếng Việt.
theological_decisions:
- issue: Có nói rõ lời cầu xin hướng đến Đức Chúa Trời hay không
  choice: 'Giữ tân ngữ hàm ẩn: “cầu xin mà không nhận được”'
  alternative: “cầu xin Đức Chúa Trời mà không nhận được”
  rationale: Ngữ cảnh cho thấy đây là lời cầu xin trong sự cầu nguyện, nhưng câu Hy Lạp không nêu rõ Đức Chúa Trời; bản dịch không thêm điều nguồn văn chỉ hàm ý.
- issue: Có diễn giải κακῶς thành động cơ sai hay không
  choice: Dịch “sai cách” trong chính văn
  alternative: “với động cơ sai trái”
  rationale: κακῶς rộng hơn riêng động cơ; mệnh đề mục đích theo sau giải thích cụ thể sự sai trái nên không cần thu hẹp nghĩa trước.
- issue: Sắc thái của ἡδοναῖς
  choice: Dịch “những thú vui” và chú thích khả năng chỉ ham muốn hưởng lạc
  alternative: “những dục vọng”
  rationale: “Thú vui” gần nghĩa căn bản hơn, còn ngữ cảnh tạo sắc thái tự buông thả; “dục vọng” có thể quá hẹp hoặc dễ bị hiểu riêng về tình dục.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để biểu đạt ngôi thứ hai số nhiều một cách bao quát; giữ cấu trúc nhân quả và mục đích của câu Hy Lạp, không nói rõ Đức Chúa Trời khi nguyên văn để hàm ẩn.
