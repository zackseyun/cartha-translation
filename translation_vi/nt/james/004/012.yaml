  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: vi
  text: Chỉ có một Đấng ban luật và xét xử, là Đấng có thể cứu và hủy diệt. Còn bạn là ai mà xét đoán người lân cận?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Đấng lập luật
  rationale: Diễn đạt tự nhiên chức năng của người ban hành luật, đồng thời dùng “Đấng” để phù hợp với quy chiếu duy nhất về Đức Chúa Trời trong câu.
- source_word: κριτής
  choice: xét xử
  rationale: Phối hợp với “Đấng lập luật” thành cụm vị ngữ tự nhiên trong tiếng Việt, giữ ý về thẩm quyền phán xét chính thức.
- source_word: ὁ δυνάμενος
  choice: Đấng có quyền
  rationale: Trong ngữ cảnh này, δύναμαι không chỉ nói đến khả năng mà còn hàm ý quyền năng và thẩm quyền tối hậu.
- source_word: σῶσαι
  choice: cứu
  rationale: Giữ nghĩa rộng của động từ Hy Lạp, không thêm đối tượng hay xác định riêng là cứu rỗi đời đời.
- source_word: ἀπολέσαι
  choice: hủy diệt
  rationale: Phản ánh sức mạnh của động từ ἀπόλλυμι và giữ thế đối lập trực tiếp với “cứu”.
- source_word: ὁ κρίνων
  choice: mà xét đoán
  rationale: Thể hiện phân từ hiện tại chỉ hành động của người bị chất vấn; “xét đoán” phân biệt hành vi phán xét người khác với chức năng xét xử tối hậu vừa nói đến.
- source_word: τὸν πλησίον
  choice: người lân cận
  rationale: Giữ sắc thái Kinh Thánh của πλησίον là người khác trong quan hệ đạo đức gần gũi, thay vì thu hẹp thành hàng xóm theo địa lý.
theological_decisions:
- issue: Chủ thể duy nhất có quyền lập luật, xét xử, cứu và hủy diệt
  choice: Dùng “một Đấng” và lặp “Đấng” để cho thấy các chức năng cùng quy về một chủ thể.
  alternative: 'Dịch thuần chức danh: “Chỉ có một nhà lập luật và thẩm phán”.'
  rationale: Cách chọn giữ lời khẳng định độc thần và thẩm quyền tối hậu hàm chứa trong văn cảnh mà không chèn danh xưng “Đức Chúa Trời”, vốn không xuất hiện trực tiếp trong câu.
- issue: Sắc thái câu hỏi σὺ δὲ τίς εἶ, ὁ κρίνων
  choice: “Còn bạn là ai mà xét đoán…”
  alternative: “Nhưng bạn là ai, người đang xét đoán…”
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt vẫn giữ lực chất vấn về tư cách của người xét đoán, không biến câu thành lệnh cấm tuyệt đối đối với mọi hình thức nhận định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bạn” theo số ít của σὺ, tạo lời chất vấn trực tiếp; không thêm chú thích vì câu không có biến thể hay điểm mơ hồ cần giải thích trong bản văn chính.
