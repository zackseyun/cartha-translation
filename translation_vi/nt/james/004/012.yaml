revisions:
- from: Chỉ có một Đấng lập luật và xét xử, là Đấng có quyền cứu và hủy diệt. Còn bạn là ai mà xét đoán người lân cận?
  to: Chỉ có một Đấng ban luật và xét xử, là Đấng có thể cứu và hủy diệt. Còn bạn là ai mà xét đoán người lân cận?
  rationale: Điều chỉnh tối thiểu để phản ánh trực tiếp ὁ δυνάμενος bằng “có thể” và giữ κριτής trong cụm chỉ chức năng xét xử, không thêm danh xưng thần học hoặc giải thích giáo phái. Câu hỏi tu từ cuối câu được giữ nguyên vì vừa tự nhiên vừa trung thành với phân từ ὁ κρίνων.
  reviewer_model: gpt-5.6-terra
