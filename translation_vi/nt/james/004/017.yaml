source:
  edition: SBLGNT
  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: vi
  text: Vậy[a], ai biết làm điều tốt mà không làm thì người ấy phạm tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Vì thế, ai biết điều tốt mình phải làm mà không làm thì người ấy phạm tội.”'
    reason: Phương án này diễn đạt οὖν là “Vì thế” và hiểu cụm καλὸν ποιεῖν theo cách “điều tốt mình phải làm”. Từ “phải” làm rõ hàm ý của ngữ cảnh nhưng không được nêu trực tiếp trong nguyên văn.
lexical_decisions:
- source_word: εἰδότι
  choice: người nào biết
  rationale: Phân từ hoàn thành chủ động cách ba số ít được dùng như danh từ, chỉ một người theo nghĩa khái quát. “Người nào biết” giữ sắc thái số ít và áp dụng chung, đồng thời tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Biểu thị kết luận suy ra từ phần bàn luận trước. “Vậy” ngắn gọn, tự nhiên và giữ rõ mối liên hệ logic.
- source_word: καλὸν
  choice: điều tốt
  rationale: Ở đây καλόν chỉ điều tốt hoặc đúng về mặt đạo đức. “Điều tốt” giữ phạm vi nghĩa rộng, không thu hẹp vào một hành động cụ thể.
- source_word: ποιεῖν
  choice: làm
  rationale: Động từ nguyên mẫu đi với καλόν tạo ý “làm điều tốt”. “Làm” là cách chuyển trực tiếp và tự nhiên.
- source_word: μὴ ποιοῦντι
  choice: mà không làm
  rationale: Phân từ hiện tại với μή đối lập sự nhận biết với việc không hành động. Cách diễn đạt này giữ lực khái quát của mệnh đề và tránh thêm một tân ngữ không có trong nguyên văn.
- source_word: ἁμαρτία
  choice: tội
  rationale: 'Danh từ vị ngữ không có mạo từ có thể mang sắc thái định tính: sự không làm điều tốt đã biết là tội. Tiếng Việt không cần thêm từ tương đương với mạo từ bất định.'
- source_word: αὐτῷ
  choice: đối với người ấy
  rationale: 'Cách ba chỉ phương diện hoặc quy chiếu: đối với chính người biết mà không làm, việc ấy là tội. Cách dịch này giữ nét nghĩa cá nhân của đại từ số ít.'
- source_word: ἐστιν
  choice: đó là
  rationale: Chuyển động từ nối thành cấu trúc tiếng Việt tự nhiên, trong đó “đó” quy chiếu về việc biết điều tốt mà không làm.
theological_decisions:
- issue: Bản chất của lời khẳng định về việc không làm điều tốt
  choice: Câu này khẳng định rằng biết điều tốt mà không làm là tội, với lời văn đủ khái quát để áp dụng như một nguyên tắc đạo đức.
  alternative: Chỉ giới hạn câu này vào việc lập kế hoạch khoe khoang trong văn cảnh ngay trước đó.
  rationale: οὖν nối câu với văn cảnh về những kế hoạch tự phụ, nhưng cách diễn đạt của câu mang tính khái quát. Bản dịch giữ cả mối liên hệ văn cảnh lẫn phạm vi rộng, không áp đặt một hệ thống giáo lý riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Vậy” để nối với văn cảnh, “điều tốt” để giữ nghĩa đạo đức rộng, và “đối với người ấy” để bảo toàn cách ba αὐτῷ cùng nét số ít của câu Hy Lạp.
