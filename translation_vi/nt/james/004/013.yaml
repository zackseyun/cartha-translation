  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: vi
  text: 'Nào, những người nói rằng: “Hôm nay hoặc ngày mai, chúng ta sẽ đi đến thành phố này, dành một năm ở đó, buôn bán và kiếm lời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Nào, bây giờ
  rationale: Cụm từ thu hút sự chú ý và mở đầu lời quở trách trực tiếp; cách dịch này giữ cả sắc thái thúc giục của ἄγε lẫn yếu tố thời điểm của νῦν.
- source_word: οἱ λέγοντες
  choice: hỡi những người nói rằng
  rationale: Phân từ có mạo từ được dùng như lời gọi trực tiếp. “Hỡi những người” giữ giọng trang trọng, đối diện trực tiếp mà không biến thành lời mô tả gián tiếp.
- source_word: Σήμερον ἢ αὔριον
  choice: Hôm nay hoặc ngày mai
  rationale: ἤ là liên từ phân cách, vì vậy “hoặc” thể hiện đúng hai phương án thời gian trong kế hoạch.
- source_word: πορευσόμεθα
  choice: chúng ta sẽ đi
  rationale: Động từ chỉ việc đi đến một nơi; “sẽ đi” là cách diễn đạt tự nhiên và giữ rõ hình thái tương lai.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: đến thành phố này
  rationale: εἰς chỉ hướng đến, còn τήνδε là đại từ chỉ định nói về một thành phố cụ thể trong kế hoạch của người nói. “Đến thành phố này” tự nhiên hơn “vào thành phố này” trong tiếng Việt mà vẫn giữ tính xác định.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: ở đó một năm
  rationale: ποιέω với khoảng thời gian ở đối cách là thành ngữ chỉ việc trải qua một thời gian. “Ở đó một năm” diễn đạt tự nhiên trong ngữ cảnh lưu lại để kinh doanh.
- source_word: ἐμπορευσόμεθα
  choice: buôn bán
  rationale: Động từ chỉ hoạt động thương mại; “buôn bán” ngắn gọn, thông dụng và phù hợp với bối cảnh.
- source_word: κερδήσομεν
  choice: kiếm lời
  rationale: Trong ngữ cảnh thương mại, động từ chỉ việc thu được lợi nhuận. “Kiếm lời” tự nhiên và cụ thể hơn nghĩa rộng “thu được”.
theological_decisions:
- issue: Giọng điệu quở trách trực tiếp
  choice: Dùng lời gọi trực tiếp “hỡi những người nói rằng”
  alternative: “những người nói rằng” như một lời mô tả gián tiếp
  rationale: Cấu trúc Hy Lạp hướng thẳng đến những người đang tự tin hoạch định tương lai; lời gọi trực tiếp bảo toàn sức nặng tu từ mà không thêm một phán đoán thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu nói được giữ như một chuỗi kế hoạch tự tin ở thì tương lai; không thêm từ ngữ kết án vì sự phê phán được triển khai trong ngữ cảnh kế tiếp.
