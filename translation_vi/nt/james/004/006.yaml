id: JAS.4.6
reference: James 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: vi
  text: 'Nhưng Ngài ban ân điển lớn hơn. Vì thế, có lời chép rằng[a]: “Đức Chúa Trời chống lại kẻ kiêu ngạo, nhưng ban ân điển cho người khiêm nhường.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì thế, Ngài phán rằng” hoặc “Vì thế, Kinh Thánh chép rằng.” Tiếng Hy Lạp không nêu rõ chủ ngữ của động từ “nói.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: lớn hơn
  rationale: Giữ nguyên sức so sánh của tính từ μείζονα và kết hợp tự nhiên với “ân điển” trong tiếng Việt.
- source_word: δίδωσιν χάριν
  choice: ban ân điển
  rationale: “Ban” phù hợp với hành động của Đức Chúa Trời; lặp lại cùng một cách diễn đạt ở cả hai vế để giữ hiệu quả tu từ của nguyên văn.
- source_word: διὸ
  choice: Vì thế
  rationale: Diễn đạt ngắn gọn quan hệ suy luận với mệnh đề trước.
- source_word: λέγει
  choice: có lời chép rằng
  rationale: Đây là công thức dẫn Kinh Thánh tự nhiên trong tiếng Việt, đồng thời không xác định chủ ngữ vốn bị lược trong tiếng Hy Lạp; chú thích ghi nhận các cách hiểu sát hình thức hơn.
- source_word: ὑπερηφάνοις
  choice: kẻ kiêu ngạo
  rationale: Diễn đạt tính từ được dùng như danh từ và tạo thế đối xứng rõ với “người khiêm nhường”.
- source_word: ἀντιτάσσεται
  choice: chống lại
  rationale: Thể hiện rõ sự đối nghịch chủ động mà động từ Hy Lạp hàm ý.
- source_word: ταπεινοῖς
  choice: người khiêm nhường
  rationale: Phù hợp với ý nghĩa đạo đức trong ngữ cảnh mà không thu hẹp thành địa vị xã hội thấp.
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ lực tương phản ở đầu câu và trong lời trích dẫn.
theological_decisions:
- issue: Chủ ngữ ngầm của λέγει trong công thức trích dẫn
  choice: có lời chép rằng
  alternative: “Ngài phán rằng” hoặc “Kinh Thánh chép rằng”
  rationale: Nguyên văn Hy Lạp không nêu chủ ngữ. Cách dịch vô nhân xưng không quyết định đó là Đức Chúa Trời hay Kinh Thánh đang “nói”, nhưng vẫn báo hiệu rõ một lời trích dẫn Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ân điển” để giữ thuật ngữ thần học χάρις và sự lặp lại trong câu; “Ngài” nối với chủ thể hàm ẩn trong ngữ cảnh trước, còn chú thích bảo tồn sự mơ hồ của chủ ngữ trong λέγει.
