- from: Chẳng phải Áp-ra-ham, tổ phụ chúng ta, đã được xưng công chính bởi việc làm khi ông dâng con mình là I-sác trên bàn thờ sao?[a]
  to: Chẳng phải Áp-ra-ham, tổ phụ chúng ta, đã được xưng công chính bởi việc làm khi ông dâng con mình là I-sác trên bàn thờ sao?[a]
  rationale: Giữ nguyên chính văn vì bản dịch phản ánh tốt nguyên ngữ và bảo toàn sự mơ hồ có chủ ý của δικαιόω. Chỉ chỉnh chú thích để cách diễn đạt tiếng Việt tự nhiên hơn, đồng thời vẫn nêu rõ hai hướng nghĩa tuyên bố và chứng tỏ/xác nhận.
  reviewer_model: gpt-5.6-terra
