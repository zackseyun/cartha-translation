  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: vi
  text: Chẳng phải Áp-ra-ham, tổ phụ chúng ta, đã được xưng công chính bởi việc làm khi ông dâng con mình là I-sác trên bàn thờ sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được chứng tỏ là công chính” hoặc “được xác nhận là công chính.” Động từ Hy Lạp có thể mang nghĩa tuyên bố một người là công chính hoặc chứng tỏ người ấy là công chính, tùy ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: tổ phụ chúng ta
  rationale: Giữ sắc thái thân tộc và căn tính giao ước của nguyên văn, đồng thời tự nhiên hơn “cha chúng ta” khi nói về Áp-ra-ham trong tiếng Việt hiện đại.
- source_word: ἐξ ἔργων
  choice: bởi việc làm
  rationale: Diễn đạt căn cứ hay phương diện gắn với ἐξ, đồng thời giữ thuật ngữ thần học quen thuộc và mối liên hệ với lập luận trong phân đoạn.
- source_word: ἐδικαιώθη
  choice: được xưng công chính
  rationale: Giữ liên hệ từ vựng với chủ đề xưng công chính mà không âm thầm thu hẹp động từ thành riêng nghĩa tuyên bố hay chứng tỏ; các khả năng khác được ghi ở chú thích.
- source_word: ἀνενέγκας
  choice: khi ông dâng
  rationale: Diễn đạt tự nhiên giá trị thời gian của phân từ bất định, đồng thời giữ sắc thái dâng lễ của động từ trong ngữ cảnh.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: con mình là I-sác
  rationale: Truyền đạt rõ I-sác là con của Áp-ra-ham và tránh lối diễn đạt nặng nề “I-sác, con trai của ông”.
- source_word: θυσιαστήριον
  choice: bàn thờ
  rationale: Cách dịch chuẩn, rõ ràng cho bàn thờ dùng trong việc dâng tế lễ.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Chẳng phải ... đã được xưng công chính ... sao?
  rationale: Giữ câu hỏi tu từ của tiếng Hy Lạp, vốn chờ đợi câu trả lời khẳng định, bằng cấu trúc tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của δικαιόω trong Gia-cơ 2:21 liên quan đến việc làm
  choice: Dịch là “được xưng công chính” trong chính văn để giữ mối liên hệ với cuộc bàn luận rộng hơn về sự xưng công chính và bảo toàn sức căng thần học của câu.
  alternative: “được chứng tỏ là công chính” hoặc “được minh chứng là công chính”
  rationale: Trong ngữ cảnh, δικαιόω có thể được hiểu theo lực tuyên bố hoặc chứng minh/minh oan. Chính văn không nên âm thầm quyết định tranh luận này; các cách hiểu thiên về ý nghĩa chứng minh được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tổ phụ” bảo toàn sắc thái thân tộc–giao ước; “xưng công chính” giữ thuật ngữ thần học và sự mơ hồ có thật của nguyên văn. Câu hỏi tu từ được giữ nguyên.
