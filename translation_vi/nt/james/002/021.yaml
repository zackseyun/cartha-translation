review_pass:
  verdict: revise
  source_fidelity: 'Chính văn truyền đạt đầy đủ và chính xác câu hỏi tu từ οὐκ ... ἐδικαιώθη;: Áp-ra-ham là tổ phụ của cộng đồng người nói, được xưng công chính «bởi việc làm», trong dịp ông dâng I-sác, con mình, trên bàn thờ. Cấu trúc «khi ông dâng» phản ánh phù hợp phân từ ἀνενέγκας mà không ép một quan hệ thời gian chặt hơn nguyên văn.'
  naturalness: Câu văn hiện đại, trang trọng và tự nhiên. Tuy nhiên, trong chú thích, «được minh chứng là công chính» kém tự nhiên và dễ gây mơ hồ về chủ thể thực hiện việc minh chứng. «Được xác nhận là công chính» diễn đạt trôi chảy hơn ý nghĩa chứng tỏ/vindicate trong lựa chọn thay thế.
  terminology: «Tổ phụ», «xưng công chính», «việc làm», và «bàn thờ» phù hợp văn phong Kinh Thánh tiếng Việt hiện đại và bảo toàn liên kết thuật ngữ của phân đoạn. Cách phiên âm Áp-ra-ham và I-sác được giữ nhất quán theo bản thảo.
  issues:
  - severity: low
    issue: Cách diễn đạt thứ hai trong chú thích «được minh chứng là công chính» chưa thật tự nhiên.
    rationale: Cụm này có thể gợi câu hỏi ai là chủ thể minh chứng. Thay bằng «được xác nhận là công chính» vẫn bảo lưu khả năng nghĩa demonstrative/vindicative của δικαιόω, không quyết định trước tranh luận thần học.
  revised_text: Chẳng phải Áp-ra-ham, tổ phụ chúng ta, đã được xưng công chính bởi việc làm khi ông dâng con mình là I-sác trên bàn thờ sao?[a]
