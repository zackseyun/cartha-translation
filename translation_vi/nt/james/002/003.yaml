id: JAS.2.3
reference: James 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: vi
  text: 'và anh em chú ý đến người mặc y phục lộng lẫy mà nói: “Mời ngồi đây, chỗ tốt,” và nói với người nghèo: “Hãy đứng đó, hoặc ngồi đằng kia[a], dưới bệ kê chân của tôi,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có cụm “hoặc ngồi đằng kia”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: chú ý đến
  rationale: Diễn đạt sự lưu tâm đặc biệt dành cho người ăn mặc sang trọng, nhưng không đưa thẳng ý niệm “thiên vị” vào động từ này.
- source_word: φοροῦντα
  choice: mặc
  rationale: Cách diễn đạt trực tiếp, tự nhiên đối với việc mang y phục.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: y phục lộng lẫy
  rationale: λαμπρός có thể chỉ sự sáng chói, đẹp đẽ hoặc sang trọng; “lộng lẫy” giữ được tính nổi bật và đáng nể của bộ y phục trong ngữ cảnh.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Xin ông ngồi chỗ tốt này
  rationale: “Chỗ tốt” thể hiện vị trí ưu đãi; đại từ và từ “xin” phản ánh cách tiếp đãi đầy kính trọng, trái với mệnh lệnh dành cho người nghèo.
- source_word: τῷ πτωχῷ
  choice: người nghèo
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở danh ngữ này; “người nghèo” tự nhiên và vẫn chỉ cá nhân cụ thể trong cảnh được kể.
- source_word: στῆθι
  choice: hãy đứng
  rationale: Giữ nguyên mệnh lệnh trực tiếp của động từ ἵστημι.
- source_word: ἢ κάθου ἐκεῖ
  choice: hoặc ngồi đằng kia
  rationale: “Đằng kia” giữ sắc thái cách xa của ἐκεῖ và phản ánh cụm từ có mặt trong bản văn in SBLGNT.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: dưới bệ kê chân của tôi
  rationale: Giữ nghĩa trực tiếp của ὑπό với đối cách và sức nặng hạ nhục trong hình ảnh, thay vì làm nhẹ thành “bên cạnh”.
theological_decisions:
- issue: Ngôn ngữ về sự thiên vị xã hội
  choice: Giữ cách kể cụ thể về sự đối xử trọng người ăn mặc lộng lẫy và khinh người nghèo.
  alternative: Dịch ἐπιβλέψητε theo hướng giải thích là “ưu ái” hoặc “thiên vị”.
  rationale: Câu này mô tả hành vi và lời nói khác biệt; sự lên án thiên vị hiện ra từ ngữ cảnh mà không cần đưa thuật ngữ thần học vào động từ.
- issue: Cách xưng hô thể hiện chênh lệch địa vị
  choice: Dùng “ông” và lời mời “xin” với người được trọng vọng, nhưng dùng “anh” cùng mệnh lệnh trực tiếp với người nghèo.
  alternative: Dùng cùng một đại từ và cùng mức độ lịch sự cho cả hai người.
  rationale: Tiếng Hy Lạp dùng cùng Σὺ nhưng sự tương phản nằm trong chỗ ngồi và cách đối xử. Tiếng Việt cần lựa chọn xưng hô; cách dịch này tái hiện rõ sự trọng vọng bất công mà không thêm một nhãn giải thích.
- issue: Giới tính của τῷ πτωχῷ
  choice: Dịch là “người nghèo”.
  alternative: Dịch rõ giống đực là “người đàn ông nghèo”.
  rationale: Dù hình thức Hy Lạp là giống đực số ít, tiếng Việt tự nhiên dùng “người nghèo” cho một cá nhân mà không phủ nhận giới tính; thêm “đàn ông” sẽ nặng và không cần thiết trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Y phục” tạo sắc thái phẩm giá phù hợp bản văn; “lộng lẫy” tự nhiên hơn “sáng chói” khi nói về quần áo sang trọng. Cách xưng hô “ông/anh” làm rõ sự phân biệt đối xử vốn phải được biểu đạt qua hệ thống đại từ tiếng Việt.
