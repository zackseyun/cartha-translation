revisions:
- from: 'và anh em chú ý đến người mặc y phục lộng lẫy mà nói: “Xin ông ngồi chỗ tốt này,” nhưng lại nói với người nghèo: “Anh hãy đứng đó, hoặc ngồi đằng kia[a], dưới bệ kê chân của tôi,”'
  to: 'và anh em chú ý đến người mặc y phục lộng lẫy mà nói: “Mời ngồi đây, chỗ tốt,” và nói với người nghèo: “Hãy đứng đó, hoặc ngồi đằng kia[a], dưới bệ kê chân của tôi,”'
  rationale: Bản sửa giữ sát cấu trúc song hành của tiếng Hy Lạp, loại bỏ liên từ đối nghịch được thêm vào, và tránh gán tuổi tác hoặc hệ thống xưng hô bất cân xứng cho hai nhân vật. Lời mời “Mời ngồi” và mệnh lệnh “Hãy đứng” vẫn diễn tả rõ sự đối xử trái ngược trong ngữ cảnh. Dấu chú thích được neo đúng tại cụm có biến thể ἢ κάθου ἐκεῖ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp chuyển đạt đúng các thành tố chính: sự chú ý đặc biệt, y phục lộng lẫy, chỗ ngồi ưu đãi, và mệnh lệnh hạ thấp dành cho người nghèo. Tuy nhiên, “nhưng lại” thêm liên từ đối nghịch không có trong câu Hy Lạp, nơi cấu trúc là hai mệnh đề song hành “và nói ... và nói ...”. Cách xưng hô “ông/anh” cũng áp đặt tuổi tác và quan hệ xưng hô không được nêu trong nguyên ngữ; sự chênh lệch đối xử đã hiện rõ qua lời mời lịch sự đối lập với mệnh lệnh trực tiếp.'
  naturalness: Cần dùng một lời mời tự nhiên, trang trọng cho người mặc y phục lộng lẫy mà không gán đại từ nhân xưng. “Mời ngồi đây, chỗ tốt” tự nhiên trong tiếng Việt hiện đại; “Hãy đứng đó” giữ giọng mệnh lệnh trực tiếp. “Dưới bệ kê chân của tôi” giữ hình ảnh cố ý hạ nhục của nguyên văn.
  terminology: “Y phục lộng lẫy” là lựa chọn phù hợp cho ἐσθῆτα τὴν λαμπράν. “Bệ kê chân” chuyển đạt ὑποπόδιον chính xác. “Người nghèo” tự nhiên trong tiếng Việt và không cần thêm “đàn ông”, vì tiếng Việt không buộc đánh dấu giống ở đây.
  issues:
  - severity: medium
    issue: Thêm “nhưng lại” giữa hai lời nói.
    rationale: Nguyên văn dùng καί ... καί (“và ... và”), không có liên từ tương phản. Tương phản ngữ nghĩa cần được để cho nội dung hai lời nói tự biểu lộ.
  - severity: low
    issue: Dùng “ông” cho người giàu và “anh” cho người nghèo.
    rationale: Cả hai lời trực tiếp trong tiếng Hy Lạp đều dùng cùng đại từ số ít σύ; nguyên văn không cho biết tuổi, quan hệ hay đại từ xưng hô. Bỏ các đại từ này tránh thêm chi tiết mà vẫn giữ tương phản xã hội qua lời mời và mệnh lệnh.
  revised_text: 'và anh em chú ý đến người mặc y phục lộng lẫy mà nói: “Mời ngồi đây, chỗ tốt,” và nói với người nghèo: “Hãy đứng đó, hoặc ngồi đằng kia[a], dưới bệ kê chân của tôi,”'
