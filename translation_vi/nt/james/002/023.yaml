  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: vi
  text: 'Và lời Kinh Thánh sau đây đã được ứng nghiệm: “Áp-ra-ham tin Đức Chúa Trời, và điều đó được kể[a] cho ông là sự công chính,” và ông được gọi là bạn của Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được ghi nhận” hoặc “được quy tính.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: đã được ứng nghiệm
  rationale: Cách diễn đạt tự nhiên trong công thức trích dẫn Kinh Thánh, đồng thời giữ ý rằng lời Kinh Thánh đạt đến sự ứng nghiệm trong hành động vâng phục của Áp-ra-ham.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: lời Kinh Thánh sau đây
  rationale: Diễn đạt rõ và tự nhiên trong tiếng Việt hiện đại; γραφή chỉ Kinh Thánh, còn phân từ λέγουσα giới thiệu trực tiếp nội dung được trích dẫn.
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: Áp-ra-ham tin Đức Chúa Trời
  rationale: Giữ sát cấu trúc với tặng cách, nhấn mạnh Áp-ra-ham tin lời Đức Chúa Trời hơn là chỉ nói chung rằng ông tin vào sự hiện hữu của Ngài.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: Giữ sắc thái quy tính hay ghi nhận của λογίζομαι mà không dùng thuật ngữ quá chuyên môn.
- source_word: εἰς δικαιοσύνην
  choice: là sự công chính
  rationale: Phù hợp với thành ngữ trong lời trích Sáng Thế Ký và bối cảnh về địa vị công chính; không chuyển thành khái niệm công lý.
- source_word: φίλος θεοῦ
  choice: bạn của Đức Chúa Trời
  rationale: Giữ nguyên ý nghĩa quan hệ của cụm danh từ và không diễn giải thêm bản chất của danh hiệu này.
- source_word: ἐκλήθη
  choice: được gọi
  rationale: Phản ánh trực tiếp thể bị động và giữ mở sắc thái được xưng gọi hay được nhìn nhận như vậy.
theological_decisions:
- issue: Mối liên hệ giữa đức tin và việc làm của Áp-ra-ham trong lập luận của Gia-cơ
  choice: Giữ nguyên lời tuyên bố rằng Kinh Thánh “đã được ứng nghiệm” và lời trích nói đức tin được kể là sự công chính.
  alternative: Giải thích câu theo hướng tách sự công chính hoàn toàn khỏi việc làm, hoặc biến việc làm thành sự thay thế cho đức tin.
  rationale: Câu văn nối Sáng Thế Ký 15:6 với hành động vâng phục được nói đến trong ngữ cảnh trước đó. Bản dịch giữ sự căng thẳng thần học này mà không áp đặt cách giải quyết của một truyền thống giáo phái.
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý; tình trạng được kể là đúng
  rationale: “Sự công chính” phù hợp với lời trích về Áp-ra-ham và giữ thuật ngữ thần học quen thuộc mà không diễn giải quá mức.
translation_notes:
  register: Văn phong trang trọng, rõ ràng và hiện đại. “Đức Chúa Trời” được dùng nhất quán cho θεός; “Áp-ra-ham” theo dạng tên riêng quen thuộc trong tiếng Việt. Từ “Như vậy” thể hiện καί trong mạch kết luận tự nhiên hơn một chữ “Và” đứng đầu câu.
