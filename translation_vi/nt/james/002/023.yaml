revisions:
- from: 'Như vậy, lời Kinh Thánh sau đây đã được ứng nghiệm: “Áp-ra-ham tin Đức Chúa Trời, và điều đó được kể là sự công chính cho ông,”[a] và ông được gọi là bạn của Đức Chúa Trời.'
  to: 'Và lời Kinh Thánh sau đây đã được ứng nghiệm: “Áp-ra-ham tin Đức Chúa Trời, và điều đó được kể[a] cho ông là sự công chính,” và ông được gọi là bạn của Đức Chúa Trời.'
