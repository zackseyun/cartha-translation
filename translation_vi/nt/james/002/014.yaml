id: JAS.2.14
reference: James 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: vi
  text: Thưa anh em tôi[a], nếu ai nói mình có đức tin[c] mà không có việc làm, thì có ích gì? Đức tin ấy có thể cứu người đó không?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch từ dạng giống đực số nhiều trong tiếng Hy Lạp. Trong ngữ cảnh này, đây là cách xưng hô với cộng đồng tín hữu và bao gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Một đức tin như thế có thể cứu người đó không?” Tiếng Hy Lạp có “đức tin” với mạo từ, hồi chỉ loại đức tin vừa được nói đến—đức tin được xưng nhận nhưng không có việc làm.'
    reason: alternative_reading
  - marker: c
    text: Từ Hy Lạp πίστις cũng có thể mang nghĩa “lòng tin” hoặc, trong một số ngữ cảnh, “sự trung tín”; ở đây “đức tin” phù hợp nhất với điều một người nói mình có.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί ὄφελος
  choice: có ích gì
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nguyên sắc thái câu hỏi tu từ về lợi ích thực tế.
- source_word: ἀδελφοί μου
  choice: hỡi anh em tôi
  rationale: Giữ hình thức xưng hô số nhiều giống đực của nguyên văn; trong ngữ cảnh, cách gọi này đại diện cho cộng đồng tín hữu.
- source_word: πίστιν / ἡ πίστις
  choice: đức tin / đức tin ấy
  rationale: “Đức tin” là thuật ngữ tự nhiên và quen thuộc nhất ở đây; “ấy” thể hiện lực hồi chỉ của mạo từ, trỏ về loại đức tin vừa được nói đến.
- source_word: λέγῃ τις ἔχειν
  choice: nếu ai nói mình có
  rationale: Bám sát cấu trúc nguyên văn hơn “tự nhận là có”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἔργα
  choice: việc làm
  rationale: Giữ liên hệ từ vựng với lập luận về đức tin và việc làm trong Gia-cơ 2, không thu hẹp thành một loại hành động cụ thể.
- source_word: μὴ δύναται
  choice: có thể ... không?
  rationale: Thể hiện câu hỏi tu từ vốn chờ đợi câu trả lời phủ định mà không diễn giải quá mức thành một mệnh đề khẳng định.
- source_word: σῶσαι αὐτόν
  choice: cứu người đó
  rationale: “Cứu” giữ được sức nặng thần học của σῴζω; “người đó” làm rõ đối tượng mà không áp đặt giới tính trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ giữa đức tin và việc làm
  choice: “Đức tin ấy” trỏ về đức tin mà một người nói mình có nhưng không có việc làm.
  alternative: “Đức tin” nói chung hoặc “một đức tin như thế”.
  rationale: Cách dịch này giữ lực hồi chỉ của ἡ πίστις và sự căng thẳng thần học trong lời Gia-cơ, không biến câu hỏi thành lời phủ nhận mọi đức tin cũng không giải quyết trước lập luận của đoạn văn.
- issue: Phạm vi của lời xưng hô ἀδελφοί
  choice: Giữ “anh em” trong chính văn và giải thích phạm vi đại diện trong chú thích.
  alternative: Dịch trực tiếp là “anh chị em”.
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn, đồng thời ghi nhận rằng trong ngữ cảnh nó có thể chỉ toàn thể cộng đồng tín hữu.
- issue: Sắc thái của câu hỏi với μή
  choice: 'Giữ dạng câu hỏi: “có thể ... không?”'
  alternative: Diễn giải thành “chắc chắn không thể cứu”.
  rationale: Nguyên văn đặt câu hỏi tu từ với câu trả lời phủ định được hàm ý; bản dịch không chuyển hàm ý ấy thành lời giải thích mạnh hơn văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hỡi” duy trì sắc thái trực tiếp của lời xưng hô Kinh Thánh mà không quá cổ; “có ích gì” và “nếu ai nói mình có” là cách diễn đạt tự nhiên. Các dấu chú thích đều xuất hiện trong chính văn.
