  naturalness: Câu văn rõ và tự nhiên. Đổi “Hỡi” thành “Thưa” phù hợp hơn với văn phong hiện đại trang trọng; đưa mệnh đề điều kiện lên đầu câu giúp nhịp tiếng Việt mạch lạc hơn mà không đổi nghĩa.
  terminology: “Đức tin,” “việc làm,” và “cứu” là các lựa chọn nhất quán, tự nhiên, và giữ được trọng lượng thuật ngữ của đoạn văn. “Đức tin ấy” bảo toàn sự quy chiếu đến thứ đức tin vừa được nêu mà không áp đặt một kết luận giáo phái.
