revisions:
- from: Hỡi anh em tôi[a], có ích gì nếu ai nói mình có đức tin mà không có việc làm? Đức tin ấy có thể cứu người đó không?[b][c]
  to: Thưa anh em tôi[a], nếu ai nói mình có đức tin[c] mà không có việc làm, thì có ích gì? Đức tin ấy có thể cứu người đó không?[b]
  rationale: Chỉnh nhẹ văn phong xưng hô cho hiện đại hơn, sắp xếp lại câu điều kiện theo nhịp tiếng Việt, đặt các ký hiệu chú thích sát từ/cụm từ liên quan, và sửa chú thích b để phân biệt rõ nghĩa hồi chỉ theo ngữ cảnh với bản dịch sát từng chữ. Không thay đổi ý nghĩa hay giải quyết trước căng thẳng thần học của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:37Z'
review_pass:
