revisions:
- from: Vì như thân thể không có thần linh[a] thì chết, đức tin không có việc làm cũng chết như vậy.[b]
  to: Vì như thân thể không có linh hồn[a] thì chết, cũng vậy, đức tin[b] không có việc làm thì chết.
  rationale: 'Bản sửa thay thuật ngữ dễ gây hiểu sai “thần linh” bằng “linh hồn”, một cách diễn đạt tự nhiên trong hình ảnh thân thể đã chết, đồng thời không loại bỏ khả năng “hơi thở” qua chú thích. Cấu trúc so sánh và liên từ giải thích của nguyên văn được giữ: “Vì như ... cũng vậy ...”. Chú thích về đức tin được chuyển đến đúng từ neo.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:42Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được cấu trúc so sánh, liên từ giải thích và sự lặp lại của “chết”. Tuy nhiên, “thần linh” trong tiếng Việt thường chỉ một hữu thể thần thánh/linh thể, không phải nguyên lý sự sống của thân thể trong ngữ cảnh này, nên làm sai hoặc gây lệch nghĩa của πνεύματος.
  naturalness: “Vì như ... cũng ... như vậy” có thể hiểu được, nhưng cần đặt dấu câu và trật tự mệnh đề tự nhiên hơn. “Linh hồn” là cách nói thông dụng, dễ hiểu trong tiếng Việt Kinh Thánh cho hình ảnh một thân thể không còn sự sống.
  terminology: Giữ “thân thể”, “đức tin” và “việc làm” là phù hợp, nhất quán với lập luận của Gia-cơ. Thay “thần linh” bằng “linh hồn”; chú thích vẫn bảo tồn khả năng từ Hy Lạp πνεῦμα được hiểu là “hơi thở”.
  issues:
  - severity: high
    issue: “thần linh” dịch πνεύματος
    rationale: Trong tiếng Việt hiện đại, “thần linh” thường chỉ các thần hoặc hữu thể siêu nhiên, không tự nhiên để chỉ điều làm một thân thể sống. Cách dùng này có nguy cơ khiến câu nói về một vị thần/linh thể vắng mặt khỏi thân thể.
  - severity: medium
    issue: Vị trí chú thích b không neo tại “đức tin”
    rationale: Chú thích về πίστις cần được đặt ngay sau “đức tin”, thay vì ở cuối câu sau toàn bộ mệnh đề, để neo rõ từ được chú giải.
  - severity: low
    issue: Dấu câu và nhịp câu
    rationale: Dùng dấu chấm phẩy trước vế tương ứng và đặt “cũng vậy” đầu vế hai phản ánh rõ hơn phép so sánh ὥσπερ ... οὕτως καί.
