id: JAS.2.26
reference: James 2:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: vi
  text: Vì như thân thể không có linh hồn[a] thì chết, cũng vậy, đức tin[b] không có việc làm thì chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “hơi thở.” Từ Hy Lạp này cũng có thể chỉ hơi thở.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể hiểu là “lòng tin” hoặc “sự trung tín.” Bản văn chính dùng cách dịch thông dụng là “đức tin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: Giữ liên từ giải thích γὰρ nối với lập luận trước, đồng thời mở đầu phép so sánh bằng ὥσπερ; cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: Tương đương trực tiếp với danh từ chỉ thân thể vật chất và thích hợp với hình ảnh về sự chết.
- source_word: χωρὶς πνεύματος
  choice: không có thần linh
  rationale: χωρίς diễn tả sự thiếu vắng; πνεῦμα ở đây chỉ nguyên lý làm cho thân thể sống. “Thần linh” giữ nghĩa spirit, còn khả năng hiểu là “hơi thở” được ghi ở chú thích.
- source_word: νεκρόν ἐστιν
  choice: thì chết
  rationale: Diễn đạt tự nhiên cấu trúc vị ngữ và giữ nguyên sức mạnh của tính từ “chết” thay vì làm nhẹ thành “không có sự sống”.
- source_word: οὕτως καὶ
  choice: cũng chết như vậy
  rationale: Đặt ở cuối mệnh đề theo cú pháp tiếng Việt để làm rõ sự tương ứng giữa hai vế và vẫn giữ ý “cũng vậy”.
- source_word: ἡ πίστις
  choice: đức tin
  rationale: “Đức tin” là cách dịch Kinh Thánh thông dụng, rõ nghĩa và phù hợp ngữ cảnh lập luận của Gia-cơ; các nghĩa “lòng tin” và “sự trung tín” được bảo tồn trong chú thích.
- source_word: χωρὶς ἔργων
  choice: không có việc làm
  rationale: “Việc làm” giữ liên hệ từ vựng với toàn bộ lập luận về ἔργα trong Gia-cơ 2, đồng thời tự nhiên hơn lối diễn đạt quá trừu tượng.
- source_word: νεκρά ἐστιν
  choice: cũng chết
  rationale: Lặp lại “chết” để bảo tồn phép song song và sức nhấn tu từ của nguyên văn.
theological_decisions:
- issue: Nghĩa của πνεύματος trong phép so sánh
  choice: thần linh
  alternative: hơi thở
  rationale: “Thần linh” bảo tồn nghĩa spirit và hình ảnh thân thể thiếu nguyên lý ban sự sống, nhưng πνεῦμα cũng có thể chỉ “hơi thở”; chú thích giữ lại sự đa nghĩa thay vì giải quyết dứt khoát.
- issue: Cách hiểu πίστις trong Gia-cơ 2:26
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: “Đức tin” là tương đương mặc định và phù hợp với chủ đề trực tiếp của đoạn văn. Vì πίστις có thể mang sắc thái tin cậy hoặc trung tín, các khả năng ấy được nêu trong chú thích mà không đưa một lập trường thần học riêng vào câu dịch.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Vì như... cũng... như vậy” giữ quan hệ giải thích và phép so sánh của nguyên văn. Các thuật ngữ “thân thể,” “thần linh,” “đức tin” và “việc làm” duy trì liên hệ với từ vựng Kinh Thánh quen thuộc mà không thêm nét nghĩa hệ phái.
