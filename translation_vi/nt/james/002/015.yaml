  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: vi
  text: Nếu một người anh em hay một người chị em không đủ áo quần để mặc[a] và thiếu thức ăn hằng ngày,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trần truồng”; từ Hy Lạp này có thể chỉ tình trạng hoàn toàn không mặc gì, nhưng trong ngữ cảnh này nhiều khả năng nói đến việc không có đủ áo quần.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Nếu
  rationale: Mở đầu một mệnh đề điều kiện giả định; “Nếu” tự nhiên và giữ đúng lực điều kiện của nguyên văn.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: một anh em hoặc chị em
  rationale: Giữ rõ cặp danh từ giống đực và giống cái trong tiếng Hy Lạp, đồng thời dùng ngôn ngữ thân thuộc chỉ người cùng cộng đồng đức tin.
- source_word: γυμνοὶ
  choice: không đủ áo mặc
  rationale: Trong ngữ cảnh cảnh túng thiếu đi kèm thiếu thức ăn, từ này nhiều khả năng nói đến việc thiếu quần áo thích hợp hơn là hoàn toàn trần truồng; cách dịch vẫn giữ chú thích về nghĩa đen.
- source_word: ὑπάρχωσιν
  choice: không đủ
  rationale: Động từ λειτουργ như hệ từ với tính từ γυμνοί; tiếng Việt diễn đạt tự nhiên bằng cụm vị ngữ “không đủ áo mặc” mà không cần dịch riêng động từ.
- source_word: λειπόμενοι
  choice: thiếu
  rationale: Diễn tả tình trạng đang không có đủ điều cần thiết; “thiếu” ngắn gọn, tự nhiên và chính xác.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: thức ăn hằng ngày
  rationale: τροφῆς là thức ăn hoặc sự nuôi dưỡng, còn ἐφημέρου chỉ điều cần cho mỗi ngày; cách dịch này diễn đạt rõ nhu cầu sinh tồn thường nhật.
theological_decisions:
- issue: Phạm vi của ἀδελφὸς ἢ ἀδελφή trong cộng đồng Cơ Đốc
  choice: Giữ cách gọi “một anh em hoặc chị em”, nhiều khả năng chỉ người cùng đức tin trong ngữ cảnh.
  alternative: Hiểu rộng là bất kỳ người nào đang thiếu thốn.
  rationale: Gia-cơ dùng ngôn ngữ gia đình thuộc linh trong ngữ cảnh gần; bản dịch giữ nguyên cách gọi ấy mà không mở rộng hay thu hẹp thêm ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Không đủ áo mặc” tự nhiên hơn lối dịch sát chữ “trần truồng” trong ngữ cảnh nghèo túng, còn dấu phẩy cuối câu được giữ vì đây là mệnh đề điều kiện tiếp nối sang câu 16.
