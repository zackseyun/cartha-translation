- from: Vì nếu có một người đàn ông đeo nhẫn vàng, mặc y phục lộng lẫy, bước vào nơi hội họp của anh em[a], đồng thời cũng có một người nghèo mặc y phục bẩn thỉu bước vào,
  to: Vì nếu có một người đàn ông đeo nhẫn vàng, mặc y phục lộng lẫy, bước vào nơi hội họp của anh em[a], và cũng có một người nghèo mặc y phục bẩn thỉu bước vào,
  rationale: Chỉ sửa liên từ chỉ thời gian không có trong nguyên văn thành cách nối song song phù hợp với δὲ καὶ. Các yếu tố khác của bản dịch và chú thích đều có thể giữ nguyên.
