id: JAS.2.2
reference: James 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: vi
  text: Vì nếu có một người đàn ông đeo nhẫn vàng, mặc y phục lộng lẫy, bước vào nơi hội họp của anh em[a], và cũng có một người nghèo mặc y phục bẩn thỉu bước vào,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hội đường.” Từ Hy Lạp synagōgē có nghĩa đen là “hội đường” hoặc “nơi hội họp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: nơi hội họp
  rationale: Trong ngữ cảnh này, từ này chỉ nơi cộng đồng tín hữu tụ họp. “Nơi hội họp” tự nhiên trong tiếng Việt và không mặc nhiên khiến độc giả nghĩ đến một cơ sở Do Thái giáo; nghĩa sát chữ được giữ trong chú thích.
- source_word: ἀνὴρ
  choice: một người đàn ông
  rationale: Danh từ Hy Lạp ở giống đực số ít, chỉ rõ một người nam trong ví dụ.
- source_word: χρυσοδακτύλιος
  choice: đeo nhẫn vàng
  rationale: Tính từ này mô tả người có vàng trên ngón tay; cách diễn đạt tiếng Việt tự nhiên là “đeo nhẫn vàng”, không xác định số lượng nhẫn khi nguyên ngữ không buộc phải làm vậy.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: mặc y phục lộng lẫy
  rationale: λαμπρός có thể mang nghĩa sáng chói, huy hoàng hoặc sang trọng; “lộng lẫy” giữ cả ấn tượng thị giác lẫn địa vị xã hội của y phục.
- source_word: πτωχὸς
  choice: một người nghèo
  rationale: Tính từ được dùng như danh từ, ở giống đực số ít và tạo thế tương phản với người đàn ông giàu có.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: mặc y phục bẩn thỉu
  rationale: ῥυπαρός là từ mạnh, chỉ sự dơ bẩn hoặc nhếch nhác; “bẩn thỉu” giữ nguyên sắc thái tiêu cực thay vì làm nhẹ thành “cũ kỹ”.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: bước vào ... bước vào
  rationale: Lặp lại cùng động từ để giữ cấu trúc song song của giả định trong nguyên văn.
- source_word: γὰρ
  choice: Vì
  rationale: Từ nối này giới thiệu ví dụ giải thích cho lời cảnh báo về sự thiên vị ở câu trước.
theological_decisions:
- issue: Cách dịch συναγωγή trong bối cảnh cộng đồng tín hữu
  choice: nơi hội họp
  alternative: hội đường
  rationale: Nguyên văn có thể chỉ “hội đường” hoặc rộng hơn là nơi/cuộc hội họp. Bản chính dùng cách hiểu theo ngữ cảnh mà không xác định thể chế hay giáo chế; nghĩa sát chữ được ghi ở chú thích để bảo toàn tính mơ hồ lịch sử.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “của anh em” diễn đạt đại từ số nhiều ὑμῶν theo lối xưng hô cộng đồng tự nhiên trong thư tín; câu được để mở bằng dấu phẩy vì đây là mệnh đề điều kiện tiếp nối sang câu sau.
