base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: vi
  text: Hãy nói năng và hành động như những người sẽ bị phán xét qua luật của sự tự do.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: Hãy nói và làm như
  rationale: Giữ hai mệnh lệnh song song và sắc thái khuyên nhủ trực tiếp; trong tiếng Việt, một từ “như” ở cuối cụm dẫn tự nhiên vào tư cách được nêu tiếp theo.
- source_word: μέλλοντες κρίνεσθαι
  choice: những người sắp chịu phán xét
  rationale: Diễn đạt phân từ μέλλοντες cùng động từ nguyên mẫu bị động κρίνεσθαι, giữ ý cuộc phán xét đang ở phía trước.
- source_word: διὰ νόμου ἐλευθερίας
  choice: qua luật của sự tự do
  rationale: “Qua” phản ánh giới từ διά với sở hữu cách và không thu hẹp quan hệ thành tác nhân trực tiếp như “bởi”; “luật của sự tự do” giữ cấu trúc sở hữu và sự căng thẳng thần học của nguyên văn.
theological_decisions:
- issue: Quan hệ giữa luật của sự tự do và việc phán xét
  choice: qua luật của sự tự do
  alternative: bởi luật của sự tự do / theo luật của sự tự do
  rationale: Nguyên văn dùng διά với sở hữu cách, có thể chỉ phương tiện hoặc sự trung gian. “Qua” bảo toàn độ mở ấy, thay vì xác định luật là tác nhân (“bởi”) hay tiêu chuẩn (“theo”).
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Cấu trúc ngắn gọn giữ nhịp mệnh lệnh của câu Hy Lạp; không thêm chú thích vì bản dịch có thể bảo toàn trực tiếp điểm mơ hồ chính của διά.
