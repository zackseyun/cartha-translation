review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh kép, tư cách của người đang hướng đến sự phán xét, và quan hệ bằng/phương tiện được để mở của διά. Tuy nhiên, «làm» không phản ánh tự nhiên ποιεῖτε trong cặp diễn đạt đạo đức này, và «chịu phán xét» ít trực tiếp hơn thể bị động κρίνεσθαι.
  naturalness: «Nói năng và hành động» là một cặp từ hiện đại, trang trọng, tự nhiên hơn «nói và làm». «Bị phán xét» cũng gọn và rõ hơn trong tiếng Việt.
  terminology: Giữ «qua luật của sự tự do» để phản ánh διά và không diễn giải quan hệ này thành tiêu chuẩn pháp lý («theo») hoặc tác nhân trực tiếp («bởi»). Giữ «luật của sự tự do» theo cấu trúc danh từ của nguyên văn.
  issues:
  - severity: low
    issue: Cặp động từ «nói và làm» hơi thiếu tự nhiên và kém tương ứng với đối ngữ của câu.
    rationale: λαλεῖτε và ποιεῖτε, trong ngữ cảnh khuyên bảo về lời nói và cách sống, được tiếng Việt hiện đại diễn đạt tự nhiên là «nói năng và hành động».
  - severity: low
    issue: «Chịu phán xét» là cách nói gián tiếp hơn cấu trúc bị động của nguyên văn.
    rationale: κρίνεσθαι nghĩa là «bị phán xét/xét xử»; cách dịch bị động trực tiếp bảo toàn rõ nét hơn quan hệ ngữ pháp.
  revised_text: Hãy nói năng và hành động như những người sẽ bị phán xét qua luật của sự tự do.
  revised_footnotes: []
