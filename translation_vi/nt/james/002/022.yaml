  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc lập luận của câu Hy Lạp: đức tin phối hợp với việc làm của Áp-ra-ham, và đức tin được đưa đến chỗ trọn vẹn qua việc làm. Tuy nhiên, “cùng hành động với những việc ông làm” hơi gượng và làm mờ quan hệ συνεργέω với τοῖς ἔργοις αὐτοῦ. “Các việc làm của ông ấy” phản ánh trực tiếp hơn cụm danh từ nguồn.'
