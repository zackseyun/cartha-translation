  terminology: “Đức tin,” “việc làm,” và “được làm cho trọn vẹn” là các lựa chọn phù hợp, nhất quán, và không áp đặt một cách giải thích thần học. Chú thích về các nghĩa thay thế của πίστις và τελειόω được giữ lại.
  issues:
