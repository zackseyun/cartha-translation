  rationale: Sửa duy nhất cách diễn đạt về sự phối hợp giữa đức tin và việc làm để câu văn tự nhiên hơn và bám sát quan hệ giữa συνεργέω với τοῖς ἔργοις αὐτοῦ. Bản sửa vẫn giữ quá khứ của mệnh đề, tính bị động của ἐτελειώθη, và sự mở ngỏ thần học của nguyên văn.
