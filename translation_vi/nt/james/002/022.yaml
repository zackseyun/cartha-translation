id: JAS.2.22
reference: James 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: vi
  text: Bạn thấy rằng đức tin[a] đã cùng hoạt động với các việc làm của ông ấy, và nhờ các việc làm ấy, đức tin được làm cho trọn vẹn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự thành tín” hoặc “lòng tin cậy”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “được hoàn thiện”; động từ Hy Lạp có thể nói đến việc đạt tới mục tiêu hoặc sự trưởng thành trọn vẹn.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Bạn thấy
  rationale: Giữ ngôi thứ hai số ít và lối nói trực tiếp mang tính lập luận của Gia-cơ; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: πίστις
  choice: đức tin
  rationale: Đây là nghĩa phù hợp nhất trong mạch lập luận về Áp-ra-ham, đồng thời không thu hẹp từ này thành một cách giải thích giáo phái; các sắc thái khác được nêu trong chú thích.
- source_word: συνήργει
  choice: đã cùng hành động với
  rationale: Diễn đạt ý phối hợp của συνεργέω và cho thấy đức tin không tách rời những việc làm; từ “đã” đặt hành động trong quá khứ mà không cố giải quyết sâu hơn sắc thái thể chưa hoàn thành.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: với những việc ông làm
  rationale: Cách nói tự nhiên hơn “với các công việc của ông”, vẫn giữ quan hệ trực tiếp giữa đức tin và các hành động của Áp-ra-ham.
- source_word: ἐκ τῶν ἔργων
  choice: nhờ những việc ấy
  rationale: Trong ngữ cảnh, ἐκ có thể chỉ nguồn hoặc phương tiện; “nhờ” chuyển tải vai trò của những việc làm trong việc đưa đức tin đến chỗ trọn vẹn mà không thêm một hệ thống thần học.
- source_word: ἐτελειώθη
  choice: được làm cho trọn vẹn
  rationale: Giữ thể bị động và ý đạt tới mục tiêu hay sự đầy đủ; tránh để “hoàn hảo” bị hiểu là đức tin trước đó có khuyết điểm đạo đức.
theological_decisions:
- issue: Mối quan hệ giữa đức tin và việc làm trong lập luận của Gia-cơ
  choice: 'Giữ nguyên cả hai ý: đức tin cùng hành động với việc làm, và nhờ việc làm mà đức tin được làm cho trọn vẹn.'
  alternative: Có thể giải thích rằng việc làm chỉ chứng minh đức tin trước con người, hoặc rằng việc làm khiến đức tin trưởng thành, hoặc là biểu hiện tất yếu phối hợp với đức tin.
  rationale: Câu Hy Lạp khẳng định sự cùng hành động và sự nên trọn vẹn nhưng không trình bày trọn vẹn một hệ thống thần học về sự xưng công chính. Bản dịch không tự ý giải quyết sự căng thẳng thần học ấy.
- issue: Sắc thái của πίστις
  choice: đức tin
  alternative: sự thành tín; lòng tin cậy
  rationale: “Đức tin” phù hợp với mạch văn và thuật ngữ quen thuộc, trong khi chú thích bảo tồn các khả năng từ vựng khác mà không áp đặt chúng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bạn” giữ lời xưng hô trực tiếp số ít của nguyên văn; “những việc ông làm” giúp câu tự nhiên mà vẫn duy trì thuật ngữ và lập luận về đức tin cùng việc làm.
