  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: vi
  text: 'nhưng nếu có người trong anh em nói với họ: “Hãy đi bình an, giữ ấm và ăn no,”[a] mà anh em lại không cho họ những thứ cần thiết cho thân thể, thì có ích gì?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “được sưởi ấm và được no đủ.” Các hình thức Hy Lạp có thể được hiểu theo nghĩa bị động hoặc trung động.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: nhưng nếu có người trong anh em nói với họ
  rationale: Câu giả định được diễn đạt tự nhiên bằng “nếu có người”; ἐξ ὑμῶν mang nghĩa phân chia, “trong anh em”. δέ được dịch là “nhưng” để nối với tình cảnh ở câu trước và làm nổi bật sự tương phản giữa lời nói với việc không giúp đỡ.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Hãy đi bình an
  rationale: Giữ công thức chào tiễn/chúc lành quen thuộc và sắc thái mỉa mai trong văn cảnh.
- source_word: θερμαίνεσθε
  choice: giữ cho ấm
  rationale: Cách nói tiếng Việt tự nhiên, không buộc động từ hình thái trung động/bị động phải mang nghĩa hoàn toàn phản thân hay hoàn toàn bị động.
- source_word: χορτάζεσθε
  choice: ăn cho no
  rationale: Trong bối cảnh thiếu thức ăn, cách dịch này truyền đạt rõ nghĩa được no đủ, đồng thời tự nhiên hơn “được làm cho no” trong tiếng Việt.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: mà anh em lại không cho họ
  rationale: “mà... lại” thể hiện rõ sự tương phản giữa lời chúc và việc không cung cấp sự trợ giúp thực tế; chủ ngữ số nhiều được nêu để câu tiếng Việt rõ ràng.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: những thứ thân thể cần
  rationale: Diễn đạt trực tiếp, dễ hiểu, vẫn giữ trọng tâm cụ thể vào các nhu cầu của thân thể.
- source_word: τί ὄφελος;
  choice: thì có ích gì?
  rationale: Câu hỏi tu từ tự nhiên trong tiếng Việt, giữ sát ý về lợi ích hay giá trị thực tế.
theological_decisions:
- issue: Sắc thái trung động hoặc bị động của θερμαίνεσθε và χορτάζεσθε
  choice: giữ cho ấm và ăn cho no
  alternative: được sưởi ấm và được no đủ; hoặc tự làm ấm và tự ăn cho no
  rationale: Bản văn Hy Lạp cho phép hiểu các hình thức này theo nghĩa trung động hoặc bị động. Bản dịch chính dùng lối nói tự nhiên mà không biến lời này thành một lời dạy về tự lực hay thụ động tiếp nhận; chú thích bảo lưu sự mơ hồ ngữ pháp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để xưng hô với cộng đồng độc giả theo văn cảnh thư tín. Dấu chú thích [a] đặt ngay sau cụm từ mà chú thích giải thích.
