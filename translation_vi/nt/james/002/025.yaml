revisions:
- from: Cũng vậy, chẳng phải kỹ nữ Ra-háp cũng được xưng công chính[a] bởi việc làm, khi bà tiếp đón các sứ giả[b] và đưa họ ra đi bằng một con đường khác sao?
  to: Cũng vậy, chẳng phải Ra-háp, người mại dâm, cũng được xưng công chính[a] bởi việc làm, khi bà tiếp đón các sứ giả[b] và đưa họ ra đi bằng một con đường khác sao?
  rationale: Thay «kỹ nữ» bằng «người mại dâm» để phản ánh trực tiếp πόρνη trong tiếng Việt tiêu chuẩn hiện đại. Những yếu tố khác của bản dịch và hai chú thích đều phù hợp với nguyên ngữ và giữ nguyên sự mơ hồ thần học cần thiết.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:42Z'
review_pass:
  verdict: revise
  source_fidelity: Cấu trúc câu hỏi tu từ, sự so sánh với Áp-ra-ham, thể bị động của δικαιόω, cơ sở «bởi việc làm», và hai hành động của Ra-háp đều được giữ đúng. Tuy nhiên, «kỹ nữ» trong tiếng Việt hiện đại thường gợi một người hầu ca/đãi tiệc hoặc là lối nói uyển ngữ, không chuyển tải trực tiếp πόρνη («người mại dâm»).
  naturalness: Câu văn nhìn chung tự nhiên và giữ được văn phong trang trọng. Đưa tên riêng lên trước và dùng cụm đồng vị «người mại dâm» khiến câu rõ ràng, tự nhiên hơn mà không làm nhẹ nghĩa của nguyên ngữ.
  terminology: Giữ «được xưng công chính» để bảo toàn thuật ngữ δικαιόω và không quyết định trước tranh luận về sắc thái của từ này. «Sứ giả» phù hợp với ἄγγελοι trong ngữ cảnh Giô-suê 2; chú thích giải thích đúng rằng đây không phải thiên sứ.
  issues:
  - severity: medium
    issue: «kỹ nữ» không phải tương đương trực tiếp, ổn định của πόρνη.
    rationale: Trong cách dùng hiện đại, «kỹ nữ» thường chỉ người phụ nữ làm nghề ca múa/tiếp khách hoặc là uyển ngữ; có thể làm mờ hoặc chuyển nghĩa «prostitute» của πόρνη. «Người mại dâm» trực tiếp, hiện đại và không thêm phán đoán.
