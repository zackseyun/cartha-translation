id: JAS.2.25
reference: James 2:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: vi
  text: Cũng vậy, chẳng phải Ra-háp, người mại dâm, cũng được xưng công chính[a] bởi việc làm, khi bà tiếp đón các sứ giả[b] và đưa họ ra đi bằng một con đường khác sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được chứng tỏ là công chính” hoặc “được tuyên bố là công chính.” Từ Hy Lạp ở đây là động từ thường được dịch là “xưng công chính”; chính văn giữ cách nói này mà không phân xử sắc thái thần học đang được tranh luận.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “các sứ giả.” Theo câu chuyện về Ra-háp (Giô-suê 2), đây là những người được sai đi, không phải các thiên sứ.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: Cũng vậy ... cũng
  rationale: Diễn đạt tự nhiên sự nối kết, so sánh với Áp-ra-ham ở câu trước, đồng thời giữ sắc thái bổ sung của καί.
- source_word: Ῥαὰβ
  choice: Ra-háp
  rationale: Phiên âm tên riêng theo lối quen dùng trong tiếng Việt.
- source_word: ἡ πόρνη
  choice: kỹ nữ
  rationale: Diễn đạt trực tiếp nghề nghiệp và địa vị xã hội do πόρνη chỉ đến; cách nói hiện đại, trang trọng hơn một số từ thuần khẩu ngữ.
- source_word: οὐκ ... ἐδικαιώθη
  choice: chẳng phải ... được xưng công chính
  rationale: Giữ thuật ngữ thần học quen thuộc cho thể bị động của δικαιόω, không thu hẹp nghĩa thành riêng 'được chứng tỏ là công chính' hay 'được tuyên bố là công chính'.
- source_word: ἐξ ἔργων
  choice: bởi việc làm
  rationale: ἐκ với sở hữu cách chỉ cơ sở hoặc phương diện trong lập luận của Gia-cơ; cách dịch này ngắn gọn và duy trì liên hệ từ vựng với văn mạch.
- source_word: ὑποδεξαμένη
  choice: khi bà tiếp đón
  rationale: Thể hiện sự đón nhận và tiếp đãi, đồng thời chuyển quan hệ phân từ sang tiếng Việt tự nhiên bằng 'khi'.
- source_word: τοὺς ἀγγέλους
  choice: các sứ giả
  rationale: ἄγγελος có thể chỉ thiên sứ hoặc sứ giả; trong câu chuyện Ra-háp, đây là những người được sai đi, nên 'sứ giả' đúng với ngữ cảnh mà không đưa từ 'do thám' vào chính văn.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: và đưa họ ra đi bằng một con đường khác
  rationale: Trong ngữ cảnh này ἐκβάλλω mang nghĩa đưa hoặc cho đi ra, không hàm ý cưỡng ép; ἑτέρᾳ ὁδῷ được giữ rõ là một con đường khác.
theological_decisions:
- issue: Nghĩa của δικαιόω trong Gia-cơ 2:25 liên quan đến đức tin và việc làm
  choice: Giữ cách dịch “được xưng công chính” trong chính văn mà không giới hạn vào một cách giải thích thần học duy nhất.
  alternative: “được chứng tỏ là công chính” hoặc “được tuyên bố là công chính”
  rationale: Cách dịch giữ nguyên sức căng trong lập luận của Gia-cơ và mối liên hệ với thuật ngữ Hy Lạp, thay vì âm thầm quyết định đây chỉ là sự tuyên bố pháp lý ban đầu hay sự chứng thực về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu hỏi tu từ được giữ. “Bà” giúp theo dõi chủ thể tự nhiên; “kỹ nữ” giữ sức nặng xã hội và đạo đức của danh từ Hy Lạp mà tránh lối nói cổ.
