revisions:
- from: 'Tuy nhiên, nếu anh em thực hiện luật pháp hoàng gia[a] theo lời Kinh Thánh: “Ngươi phải yêu người lân cận như chính mình,” thì anh em làm điều tốt.'
  to: 'Nếu anh em thi hành luật vương giả[a] theo lời Kinh Thánh: “Ngươi phải yêu người lân cận như chính mình,” thì anh em làm điều phải.'
  rationale: Bản sửa tăng tính tự nhiên của tiếng Việt và làm rõ lời xác nhận cuối câu, đồng thời giữ nguyên tính mơ hồ có chủ ý của βασιλικός. Không thay đổi nội dung, ngôi số nhiều của người nhận, hay lực mệnh lệnh của lời trích.
