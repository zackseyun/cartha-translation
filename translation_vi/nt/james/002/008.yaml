id: JAS.2.8
reference: James 2:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: vi
  text: 'Nếu anh em thi hành luật vương giả[a] theo lời Kinh Thánh: “Ngươi phải yêu người lân cận như chính mình,” thì anh em làm điều phải.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “luật của Vua” hoặc “luật của vương quốc”. Tiếng Hy Lạp nói “luật vương giả”, có thể nhấn mạnh luật ấy thuộc về Vua, có đặc tính vương quyền, hoặc có địa vị cao cả.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Tuy nhiên, nếu
  rationale: Giữ cả ý điều kiện của εἰ lẫn sắc thái chuyển ý hoặc tương phản nhẹ của μέντοι, đồng thời phù hợp cú pháp tiếng Việt hiện đại.
- source_word: νόμον ... βασιλικὸν
  choice: luật pháp hoàng gia
  rationale: Dịch sát tính từ βασιλικός là “thuộc về vua/hoàng gia”, không tự giới hạn ý nghĩa vào nguồn gốc, địa vị tối cao hay mối liên hệ với vương quốc.
- source_word: τελεῖτε
  choice: thực hiện
  rationale: Diễn đạt việc thi hành hay làm trọn điều luật; “thực hiện” tự nhiên trong tiếng Việt và không hàm ý rằng điều luật đã được hoàn tất một lần cho xong.
- source_word: κατὰ τὴν γραφήν
  choice: theo lời Kinh Thánh
  rationale: Thể hiện ý làm phù hợp với điều bản văn Kinh Thánh nói, đồng thời câu văn tự nhiên hơn “theo Kinh Thánh” khi dẫn ngay một lời trích.
- source_word: Ἀγαπήσεις
  choice: Ngươi phải yêu
  rationale: Dạng tương lai trong câu trích dẫn mang chức năng mệnh lệnh; “phải yêu” truyền đạt rõ sức mạnh của điều răn, còn “ngươi” giữ giọng văn trang trọng của lời Kinh Thánh được trích.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: Đây là thuật ngữ Kinh Thánh quen thuộc cho người khác mà một người có bổn phận yêu thương, không chỉ người ở gần về địa lý.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Giữ cách so sánh ngắn gọn của nguyên văn, không thêm động từ không có trong tiếng Hy Lạp.
- source_word: καλῶς ποιεῖτε
  choice: anh em làm điều tốt
  rationale: Truyền đạt lời xác nhận rằng hành động ấy là đúng và tốt; cách nói hiện tại phù hợp với ngữ cảnh điều kiện.
theological_decisions:
- issue: Ý nghĩa của “luật pháp hoàng gia”
  choice: Giữ cách gọi rộng “luật pháp hoàng gia”, có thể gợi luật thuộc về Vua, mang đặc tính vương quyền hoặc có địa vị nổi trội.
  alternative: “luật pháp của Vua”, “luật pháp tối cao” hoặc “luật pháp của vương quốc”
  rationale: βασιλικός không tự quyết định một cách giải thích duy nhất. Bản dịch chính không nên ấn định nguồn gốc, thứ bậc hay liên hệ với vương quốc khi nguyên văn vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để chỉ cộng đồng độc giả; trong lời trích Kinh Thánh dùng “ngươi” nhằm phân biệt ngôi số ít của điều răn và giữ sắc thái trang trọng.
