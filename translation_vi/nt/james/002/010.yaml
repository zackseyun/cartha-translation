id: JAS.2.10
reference: James 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: vi
  text: Vì ai tuân giữ toàn bộ luật pháp nhưng vấp phạm một điều thì đã trở thành người có tội đối với toàn bộ luật pháp[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sai phạm trong một việc” hoặc “vi phạm một phần.” Tiếng Hy Lạp nói “vấp trong một điều,” dùng hình ảnh vấp ngã để chỉ sự sai phạm về đạo đức.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phải chịu trách nhiệm về tất cả.” Cụm từ này nói rằng việc vi phạm một phần khiến người ta phải chịu trách nhiệm đối với toàn thể luật pháp.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: ai
  rationale: Đại từ quan hệ bất định nêu một nguyên tắc áp dụng chung; cấu trúc “ai... thì” tự nhiên trong tiếng Việt và giữ được tính phổ quát.
- source_word: γὰρ
  choice: Vì
  rationale: Nối câu này với lập luận trước đó bằng cách nêu căn cứ hoặc lời giải thích.
- source_word: ὅλον τὸν νόμον
  choice: toàn bộ luật pháp
  rationale: Diễn đạt rõ tính toàn thể do ὅλον nhấn mạnh; “luật pháp” phù hợp với văn phong Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: τηρήσῃ
  choice: tuân giữ
  rationale: Trong ngữ cảnh điều răn và luật pháp, τηρέω mang nghĩa giữ, tuân theo; “tuân giữ” vừa sát nghĩa vừa tự nhiên.
- source_word: πταίσῃ
  choice: vấp phạm
  rationale: Giữ hình ảnh “vấp” của πταίω đồng thời làm rõ đây là sự vi phạm về đạo đức hoặc luật pháp.
- source_word: ἐν ἑνί
  choice: chỉ một điều
  rationale: Chỉ một điểm hay một điều thuộc luật pháp; thêm “chỉ” làm nổi bật sự tương phản với “toàn bộ” mà không thay đổi ý nghĩa.
- source_word: γέγονεν
  choice: đã mắc
  rationale: Thể hoàn thành diễn tả tình trạng trách nhiệm phát sinh và còn hiệu lực; “đã mắc” thể hiện kết quả hiện tại một cách tự nhiên.
- source_word: πάντων
  choice: đối với tất cả
  rationale: Số nhiều sở hữu cách đi với ἔνοχος chỉ trách nhiệm liên quan đến toàn thể các điều luật, không nhất thiết nói người ấy đã đích thân vi phạm từng điều.
- source_word: ἔνοχος
  choice: mắc tội
  rationale: Truyền đạt sắc thái pháp lý và luân lý của tình trạng có tội hoặc phải chịu trách nhiệm.
theological_decisions:
- issue: Phạm vi trách nhiệm đối với luật pháp
  choice: Vi phạm một điều khiến người ấy mắc tội đối với toàn thể luật pháp.
  alternative: Vi phạm một điều đồng nghĩa với việc đã vi phạm từng điều riêng lẻ và mọi vi phạm đều ngang nhau về mức độ.
  rationale: Cụm πάντων ἔνοχος nói đến trách nhiệm đối với toàn thể, nhưng không buộc phải hiểu rằng người ấy đã thực hiện từng hành vi vi phạm riêng lẻ hoặc rằng mọi tội đều ngang nhau về mức độ. Bản dịch giữ nguyên sức nặng và sự căng thẳng thần học của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “ai... thì” giữ sắc thái nguyên tắc chung; “vấp phạm” bảo tồn ẩn dụ Hy Lạp mà vẫn rõ nghĩa trong ngữ cảnh đạo đức-pháp lý. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
