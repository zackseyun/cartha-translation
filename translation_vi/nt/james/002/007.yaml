  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: vi
  text: Chẳng phải chính họ phỉ báng danh cao quý đã được xưng trên anh chị em sao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «danh đáng kính» hoặc «danh tốt đẹp».'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: «đã được gọi trên anh chị em». Cách nói này có thể chỉ danh mà nhờ đó các tín hữu được nhận diện, và có thể gợi đến ngôn ngữ giao ước hoặc báp-têm.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Chẳng phải chính họ ... sao?
  rationale: Cấu trúc câu hỏi tu từ với οὐκ mong đợi câu trả lời khẳng định; «chính họ» giữ được sắc thái nhấn mạnh của αὐτοὶ và liên kết với những người vừa được nói đến.
- source_word: βλασφημοῦσιν
  choice: xúc phạm
  rationale: Động từ có thể chỉ việc phỉ báng, nói lời lăng mạ hoặc báng bổ. Trong tiếng Việt, «xúc phạm danh» vừa tự nhiên, vừa giữ được ý làm ô danh và sắc thái tôn giáo mà không buộc đối tượng phải được xác định rõ là Thiên Chúa.
- source_word: τὸ καλὸν ὄνομα
  choice: danh cao quý
  rationale: καλός trong ngữ cảnh này mang nghĩa đáng kính, cao quý. «Danh cao quý» tự nhiên hơn «danh tốt đẹp» và tránh khiến người đọc chỉ hiểu theo nghĩa tiếng tốt hay danh tiếng.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: đã được gọi trên anh chị em
  rationale: Giữ hình ảnh thụ động và thành ngữ một danh được gọi trên một người, thay vì diễn giải thành «danh mà anh chị em mang»; cách dịch hơi khác lời nói thông thường nhưng bảo tồn khả năng gợi đến sự thuộc về giao ước hoặc nghi thức nhận danh.
theological_decisions:
- issue: Đối tượng của «danh cao quý»
  choice: Giữ cách gọi rộng và không nêu đích danh; theo ngữ cảnh, nhiều khả năng đó là danh Chúa Giê-su/Chúa mà cộng đồng tín hữu mang.
  alternative: Dịch rõ là «danh Đấng Christ», «danh Chúa» hoặc hiểu rộng là căn tính Cơ Đốc của cộng đồng.
  rationale: Bản Hy Lạp không nêu trực tiếp Giê-su trong câu này, dù Gia-cơ 2:1 tạo nền tảng Kitô học rõ rệt. Vì vậy, bản chính giữ nguyên độ mở của nguồn.
- issue: Sắc thái của công thức «được gọi trên»
  choice: Giữ nguyên hình ảnh danh được gọi trên cộng đồng.
  alternative: Diễn giải là «danh mà anh chị em được gọi theo» hoặc xác định đây là công thức báp-têm.
  rationale: Cụm từ có thể vang vọng ngôn ngữ giao ước, sự sở hữu hoặc báp-têm, nhưng văn bản không xác quyết riêng một bối cảnh nghi lễ nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng «anh chị em» cho đại từ số nhiều ὑμᾶς. Cụm «được gọi trên» được giữ có chủ ý để bảo tồn thành ngữ và độ mở thần học của nguyên văn; hai dấu chú thích [a], [b] đều xuất hiện trong bản chính.
