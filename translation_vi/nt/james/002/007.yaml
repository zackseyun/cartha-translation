review_pass:
  verdict: revise
  source_fidelity: Câu hỏi tu từ phủ định và sự nhấn mạnh của οὐκ αὐτοὶ được chuyển đạt đúng qua «Chẳng phải chính họ ... sao?». Tuy nhiên, «xúc phạm» làm nhẹ βλασφημοῦσιν, vốn ở đây mang ý phỉ báng/lăng mạ nghiêm trọng đối với danh đáng tôn kính. «Phỉ báng» chuyển tải trung thực hơn mà không xác định quá mức danh ấy là danh của ai. Cụm bị động τὸ ἐπικληθὲν ἐφ’ ὑμᾶς nên giữ hình ảnh một danh được xưng/gọi trên cộng đồng; «được xưng trên» là cách diễn đạt tiếng Việt Kinh Thánh tự nhiên và rõ hơn «được gọi trên».
  naturalness: «Danh cao quý» và «phỉ báng danh» có sắc thái trang trọng, hiện đại và phù hợp văn mạch. «Được xưng trên anh chị em» giữ tính thành ngữ của nguyên văn nhưng trôi chảy hơn «được gọi trên anh chị em».
  terminology: Dùng «phỉ báng» cho βλασφημέω để bảo toàn cường độ bất kính. Giữ «danh cao quý» cho τὸ καλὸν ὄνομα và không thêm «Đấng Christ» hoặc «Chúa», vì nguyên văn không nêu trực tiếp. «Anh chị em» phù hợp với ὑμᾶς trong thư tín gửi cộng đồng.
  issues:
  - severity: medium
    issue: «xúc phạm» làm giảm sắc thái của βλασφημοῦσιν.
    rationale: Động từ Hy Lạp biểu thị sự phỉ báng, lăng mạ hay nói phạm, mạnh hơn hành vi «xúc phạm» nói chung; ngữ cảnh là một «danh cao quý» khiến «phỉ báng» phù hợp hơn.
  - severity: low
    issue: «được gọi trên» hơi gượng trong tiếng Việt hiện đại.
    rationale: «Được xưng trên» vẫn bảo toàn cấu trúc bị động và hình ảnh danh được gọi trên người, đồng thời là lối diễn đạt tiếng Việt tự nhiên hơn trong văn phong Kinh Thánh.
