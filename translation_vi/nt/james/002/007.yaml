- from: Chẳng phải chính họ xúc phạm danh cao quý đã được gọi trên anh chị em sao?[a][b]
  to: Chẳng phải chính họ phỉ báng danh cao quý đã được xưng trên anh chị em sao?[a][b]
  rationale: Thay «xúc phạm» bằng «phỉ báng» để phản ánh đầy đủ hơn βλασφημοῦσιν. Thay «được gọi trên» bằng «được xưng trên» để câu tiếng Việt tự nhiên hơn, nhưng vẫn giữ hình ảnh bị động và độ mở diễn giải của τὸ ἐπικληθὲν ἐφ’ ὑμᾶς. Chú thích b lưu phương án sát chữ «được gọi trên» và không khẳng định một diễn giải nghi lễ cụ thể.
