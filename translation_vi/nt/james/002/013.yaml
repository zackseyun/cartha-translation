revisions:
- from: Vì sự phán xét sẽ không có lòng thương xót đối với người không thực hành lòng thương xót; lòng thương xót đắc thắng sự phán xét.[a]
  to: Vì sự phán xét không có lòng thương xót đối với người đã không bày tỏ lòng thương xót; lòng thương xót đắc thắng sự phán xét.[a]
  rationale: Bản sửa loại bỏ thì tương lai không có trong nguyên văn và dùng “đã không bày tỏ lòng thương xót” để diễn đạt tự nhiên thành ngữ ποιεῖν ἔλεος, đồng thời vẫn giữ tính cách ngôn của câu. Mệnh đề cuối và chú thích tiếp tục bảo lưu hình ảnh “khoe mình/thắng thế hơn” của κατακαυχᾶται mà không áp đặt cách giải thích thần học về chủ thể của lòng thương xót.
  reviewer_model: gpt-5.6-terra
