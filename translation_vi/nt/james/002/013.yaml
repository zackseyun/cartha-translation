source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: vi
  text: Vì sự phán xét không có lòng thương xót đối với người đã không bày tỏ lòng thương xót; lòng thương xót đắc thắng sự phán xét.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Lòng thương xót khoe mình hơn sự phán xét.” Động từ Hy Lạp có thể mang nghĩa khoe mình hoặc hân hoan thắng thế hơn/chống lại một điều khác; ở đây được dịch tự nhiên là “đắc thắng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: sự phán xét
  rationale: Diễn đạt sự xét xử hay đánh giá mang tính tư pháp, phù hợp với ngữ cảnh về sự phán xét của Đức Chúa Trời, nhưng không thu hẹp nghĩa thành sự kết án.
- source_word: ἀνέλεος
  choice: không có lòng thương xót
  rationale: Giữ rõ mối liên hệ từ vựng với ἔλεος được lặp lại trong câu và tự nhiên trong tiếng Việt hiện đại.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: đối với người không thực hành lòng thương xót
  rationale: Cụm ποιέω với ἔλεος có nghĩa thực thi hay bày tỏ lòng thương xót; “thực hành” giữ được sắc thái hành động đạo đức liên tục mà không thêm ý công đức.
- source_word: κατακαυχᾶται
  choice: đắc thắng
  rationale: Truyền đạt tự nhiên sức mạnh tu từ của động từ mang nghĩa khoe mình, hãnh diện hay thắng thế trước một điều khác; ghi chú bảo lưu hình ảnh sát chữ.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Là cách dịch thông dụng, trang trọng và giữ nguyên sự lặp từ làm nền cho sự tương phản trong câu.
theological_decisions:
- issue: Ý nghĩa của mệnh đề κατακαυχᾶται ἔλεος κρίσεως
  choice: “lòng thương xót đắc thắng sự phán xét” như một nguyên tắc khái quát
  alternative: “lòng thương xót tự hào trước sự phán xét” hoặc lòng thương xót mà người tin kính đã thực hành thắng thế trong bối cảnh phán xét
  rationale: Mệnh đề Hy Lạp ngắn gọn và để ngỏ chủ thể quy chiếu. Bản dịch không xác định đây chỉ là lòng thương xót của Đức Chúa Trời hay chỉ là lòng thương xót con người thực hành, nhờ đó bảo toàn sức căng giữa lời cảnh báo và niềm hy vọng mà không hàm ý một cơ chế lập công.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “sự phán xét” để giữ sắc thái tư pháp; lặp “lòng thương xót” nhằm bảo toàn liên kết từ vựng của nguyên văn. Dấu chú thích [a] được đặt sau mệnh đề mà chú thích giải thích.
