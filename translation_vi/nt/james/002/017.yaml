  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc so sánh «Cũng vậy», điều kiện «nếu không có», và sự đối lập mạnh của νεκρά («chết»). «Đức tin» và «việc làm» giữ được các thuật ngữ chủ đạo của lập luận trong Gia-cơ 2. Cụm «tự nó» chuyển đạt καθ’ ἑαυτήν, tức đức tin được xét riêng, không có việc làm đi kèm.
  naturalness: Câu nháp nhìn chung rõ ràng, nhưng vị ngữ «tự nó là chết» không tự nhiên trong tiếng Việt chuẩn hiện đại. «Tự nó đã chết» là cách nói thành ngữ hơn để diễn tả một thực tại ở trạng thái chết; không nhằm thêm một mốc thời gian vào nguyên văn.
