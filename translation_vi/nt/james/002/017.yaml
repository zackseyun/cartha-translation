id: JAS.2.17
reference: James 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: vi
  text: Cũng vậy, đức tin[a], nếu không có việc làm, thì tự nó đã chết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng tin”; ít có khả năng hơn trong câu này là “sự trung tín”. Từ Hy Lạp pistis có thể mang các nghĩa ấy, nhưng “đức tin” phù hợp nhất với lập luận của Gia-cơ tại đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối liên hệ so sánh và suy luận với minh họa ngay trước đó, đồng thời giữ sắc thái tương ứng của καί.
- source_word: ἡ πίστις
  choice: đức tin
  rationale: Trong lập luận của Gia-cơ, từ này chỉ đức tin được xưng nhận; “đức tin” giữ được thuật ngữ quen thuộc và không thu hẹp nghĩa theo một cách giải thích hệ phái.
- source_word: ἐὰν μὴ ἔχῃ
  choice: nếu không có
  rationale: Phản ánh trực tiếp cấu trúc điều kiện ἐὰν μή và dùng lối diễn đạt tiếng Việt hiện đại, rõ ràng.
- source_word: ἔργα
  choice: việc làm
  rationale: Chỉ những hành động bên ngoài đi cùng và biểu lộ đức tin; “việc làm” giữ liên hệ từ vựng với toàn bộ lập luận trong Gia-cơ 2 mà không diễn giải quá mức.
- source_word: νεκρά
  choice: là chết
  rationale: Giữ nguyên hình ảnh mạnh và dứt khoát của tính từ vị ngữ νεκρά.
- source_word: καθ’ ἑαυτήν
  choice: tự nó
  rationale: Diễn tả đức tin được xét riêng lẻ, tách khỏi việc làm, mà không thêm kết luận thần học ngoài câu chữ.
theological_decisions:
- issue: Cách dịch πίστις trong ngữ cảnh tranh luận về đức tin và việc làm
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: '“Đức tin” phù hợp nhất với lập luận tại đây và bảo tồn sự căng thẳng thần học của câu: Gia-cơ khẳng định đức tin không có việc làm là chết nhưng không giải thích thêm cơ chế xưng công chính trong chính câu này.'
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Cũng vậy ... thì ...” giữ mạch lập luận và nhịp nhấn của nguyên văn; “tự nó là chết” bảo tồn sắc thái cô lập của καθ’ ἑαυτήν.
