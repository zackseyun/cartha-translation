source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: vi
  text: 'Vì Đấng đã phán: “Chớ ngoại tình,” cũng phán: “Chớ giết người.” Nhưng nếu bạn không ngoại tình mà lại giết người, thì bạn đã trở thành người vi phạm luật.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: Đấng đã phán
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ chính Đấng ban các điều răn. “Đấng đã phán” tự nhiên, trang trọng và giữ nguyên việc câu Hy Lạp không trực tiếp thêm danh xưng “Đức Chúa Trời”.
- source_word: Μὴ μοιχεύσῃς
  choice: Ngươi chớ ngoại tình
  rationale: μή với động từ aorist subjunctive diễn đạt lệnh cấm và vang lại lời điều răn. “Chớ ngoại tình” vừa rõ nghĩa vừa thích hợp với văn phong trích dẫn Mười Điều Răn.
- source_word: καί
  choice: cũng
  rationale: Nhấn mạnh rằng cùng một Đấng đã ban cả hai điều răn, qua đó bảo toàn mạch lập luận của Gia-cơ.
- source_word: Μὴ φονεύσῃς
  choice: Ngươi chớ giết người
  rationale: φονεύω chỉ việc giết người trái phép, đặc biệt là sát nhân, chứ không phải mọi hành vi làm chết nói chung. Trong tiếng Việt, “chớ giết người” là cách diễn đạt tự nhiên và quen thuộc của điều răn, không mở rộng thành “chớ giết”.
- source_word: εἰ δὲ
  choice: Vậy, nếu
  rationale: δέ chuyển sang trường hợp giả định áp dụng lập luận; “Vậy, nếu” tạo liên kết tự nhiên với câu trước mà không làm mất sắc thái tương phản tiếp theo.
- source_word: οὐ μοιχεύεις φονεύεις δέ
  choice: ngươi không ngoại tình nhưng lại giết người
  rationale: Các động từ hiện tại được hiểu như trường hợp tổng quát. “Nhưng lại” thể hiện rõ sự tương phản do δέ đánh dấu.
- source_word: γέγονας
  choice: đã trở thành
  rationale: Thì hoàn thành của γίνομαι diễn tả việc đã đi vào một tình trạng và hiện đang ở trong tình trạng ấy; “đã trở thành” giữ được sắc thái kết quả này.
- source_word: παραβάτης νόμου
  choice: kẻ phạm luật
  rationale: παραβάτης là người vượt qua hoặc vi phạm điều luật. “Kẻ phạm luật” tự nhiên trong tiếng Việt hiện đại, vẫn giữ sắc thái pháp lý–đạo đức và không thu hẹp về riêng một điều răn.
- source_word: νόμου
  choice: luật
  rationale: Trong tiếng Việt, “phạm luật” đã xác định tự nhiên bộ luật đang được bàn đến; thêm “pháp luật” dễ bị hiểu là luật dân sự hiện đại, còn “Luật Pháp” có thể áp đặt một quy ước thần học hoặc biên tập không có trong chữ Hy Lạp.
theological_decisions:
- issue: Danh tính của Đấng phán các điều răn
  choice: Dùng “Đấng đã phán” mà không thêm trực tiếp “Đức Chúa Trời”.
  alternative: Vì Đức Chúa Trời, Đấng đã phán…
  rationale: Ngữ cảnh rõ ràng chỉ Đức Chúa Trời, nhưng nguyên văn dùng phân từ có mạo từ, không nêu danh xưng. Bản dịch giữ sự quy chiếu mang tính ngôi vị mà không bổ sung chủ thể vào chính văn.
- issue: Phạm vi của việc phạm luật trong lập luận của Gia-cơ
  choice: Dùng “kẻ phạm luật”.
  alternative: kẻ phạm điều răn ấy
  rationale: Nguyên văn nói đến νόμου, tức luật, chứ không chỉ điều răn riêng lẻ bị vi phạm. Cách dịch giữ nguyên luận điểm rằng vi phạm một điều khiến người ấy đứng trong tình trạng phạm luật.
- issue: Sắc thái của điều răn cấm φονεύω
  choice: Dùng “chớ giết người”.
  alternative: chớ sát nhân
  rationale: “Giết người” trong cấu trúc điều răn diễn đạt hành vi sát nhân rõ ràng và tự nhiên hơn đối với độc giả phổ thông; “sát nhân” chính xác nhưng mang sắc thái Hán–Việt nặng hơn. Không dịch rộng thành “chớ giết” để tránh bao gồm mọi sự giết chết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được giữ trong lời trích dẫn điều răn và phần áp dụng trực tiếp để duy trì tính nhất quán cùng sắc thái Kinh Thánh; “Đấng” viết hoa biểu thị sự quy chiếu rõ ràng đến Đức Chúa Trời mà không thêm danh xưng không có trong nguyên văn.
