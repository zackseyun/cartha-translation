revisions:
- from: 'Vì Đấng đã phán: “Ngươi chớ ngoại tình,” cũng phán: “Ngươi chớ giết người.” Vậy, nếu ngươi không ngoại tình nhưng lại giết người, thì ngươi đã trở thành kẻ phạm luật.'
  to: 'Vì Đấng đã phán: “Chớ ngoại tình,” cũng phán: “Chớ giết người.” Nhưng nếu bạn không ngoại tình mà lại giết người, thì bạn đã trở thành người vi phạm luật.'
  rationale: Bản sửa hiện đại hóa lối xưng hô mà vẫn giữ số ít trong ví dụ giả định, giữ nguyên nội dung và mạch lập luận của nguyên văn, làm rõ nét εἰ δέ bằng “Nhưng nếu”, và dùng cách gọi trung tính, tự nhiên hơn cho παραβάτης νόμου. Không cần chú thích vì không có điểm nào trong câu đòi hỏi giải thích thêm để bảo toàn nghĩa.
