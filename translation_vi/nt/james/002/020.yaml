base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: vi
  text: Nhưng, hỡi người rỗng tuếch[a], có muốn biết rằng đức tin không có việc làm là vô ích[b] không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người ngu dại” hoặc “người nông cạn.” Từ Hy Lạp theo nghĩa đen là “trống rỗng.”
    reason: lexical_alternative
  - marker: b
    text: Hay “không hoạt động” hoặc “không hiệu quả.” Từ Hy Lạp chỉ điều nhàn rỗi, không hoạt động hoặc không sinh kết quả.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Nhưng ... có muốn biết ... không?
  rationale: θέλω với động từ nguyên mẫu diễn tả ý muốn; δέ được chuyển là “nhưng” để nối với lập luận đối nghịch trước đó. Cấu trúc nghi vấn tiếng Việt giữ nguyên sức chất vấn của câu Hy Lạp.
- source_word: ὦ ἄνθρωπε κενέ
  choice: hỡi người rỗng tuếch
  rationale: ὦ đánh dấu lời gọi trực tiếp; ἄνθρωπε là danh từ số ít ở hô cách. κενέ theo nghĩa đen là “trống rỗng,” ở đây chỉ một người thiếu chiều sâu hoặc nhận thức. “Rỗng tuếch” giữ được hình ảnh gốc và giọng quở trách, còn các cách hiểu diễn giải hơn được ghi ở chú thích.
- source_word: ὅτι
  choice: rằng
  rationale: ὅτι giới thiệu nội dung điều người nghe cần biết, nên “rằng” là cách chuyển trực tiếp và tự nhiên.
- source_word: ἡ πίστις
  choice: đức tin
  rationale: “Đức tin” là cách gọi thông dụng, chính xác trong văn cảnh Gia-cơ đang bàn về mối liên hệ giữa tin và việc làm; không tự ý đổi thành “lòng trung tín.”
- source_word: χωρὶς τῶν ἔργων
  choice: không có việc làm
  rationale: χωρίς với sở hữu cách có nghĩa là “không có, tách khỏi.” Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ sự thiếu vắng các việc làm mà Gia-cơ nhấn mạnh.
- source_word: ἀργή ἐστιν
  choice: là vô ích
  rationale: ἀργός chỉ tình trạng không hoạt động, không tạo ra kết quả. “Vô ích” truyền đạt rõ sức nặng thực tiễn của từ trong văn cảnh, còn các sắc thái “nhàn rỗi/không hiệu quả” được bảo lưu trong chú thích.
theological_decisions:
- issue: Mối liên hệ giữa đức tin và việc làm trong lập luận của Gia-cơ
  choice: Nói thẳng rằng đức tin không có việc làm là “vô ích.”
  alternative: Dịch nhẹ hơn là “không hoạt động,” hoặc mạnh hơn là “chết.”
  rationale: Bản văn ở câu này dùng ἀργή chứ không dùng νεκρά. Vì vậy, bản dịch không đồng nhất câu này với cách nói “chết” ở các câu lân cận, cũng không làm nhẹ lời khẳng định để phù hợp với một hệ thống thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có sức chất vấn. “Hỡi” giữ lời gọi trực tiếp của ὦ mà vẫn quen thuộc trong văn chương Kinh Thánh; câu lược đại từ nhân xưng để tránh áp đặt quan hệ xưng hô không có trong nguyên văn. Hai dấu chú thích được đặt ngay sau các từ ngữ mà chúng giải thích.
