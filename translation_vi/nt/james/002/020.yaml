  source_fidelity: Bản dịch chuyển đạt đúng cấu trúc chất vấn của θέλεις δὲ γνῶναι, lời gọi trực tiếp ὦ ἄνθρωπε κενέ, mệnh đề nội dung do ὅτι giới thiệu, và đối lập giữa đức tin với việc làm. “Rỗng tuếch” bảo lưu hình ảnh của κενέ; “vô ích” là cách chuyển phù hợp theo ngữ cảnh của ἀργή, không đồng nhất từ này với “chết” ở các câu lân cận.
