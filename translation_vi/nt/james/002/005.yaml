id: JAS.2.5
reference: James 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: vi
  text: 'Hãy lắng nghe, anh em yêu dấu của tôi[a]: Chẳng phải Đức Chúa Trời đã chọn những người nghèo theo tiêu chuẩn thế gian[b] là những người giàu có trong đức tin[c] và là những người thừa kế vương quốc mà Ngài đã hứa cho những ai yêu mến Ngài sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em yêu dấu của tôi”; từ Hy Lạp có nghĩa đen là “anh em” nhưng có thể dùng để gọi chung toàn thể cộng đồng tín hữu.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “nghèo trong mắt thế gian” hoặc “nghèo xét theo thế gian.”
    reason: lexical_alternative
  - marker: c
    text: “Đức tin” cũng có thể dịch là “lòng tin”; nghĩa “sự trung tín” ít có khả năng hơn trong câu này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Hãy lắng nghe
  rationale: Động từ mệnh lệnh số nhiều kêu gọi người nghe chú ý; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được sức thúc giục trực tiếp.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: anh em yêu dấu của tôi
  rationale: Giữ hình thức số nhiều giống đực của ἀδελφοί và sắc thái trìu mến của ἀγαπητοί; khả năng bao gồm cả cộng đồng tín hữu được ghi ở chú thích.
- source_word: ἐξελέξατο
  choice: đã chọn
  rationale: Chuyển tải trực tiếp hành động lựa chọn của Đức Chúa Trời mà không đưa thêm một hệ thống thần học về sự tuyển chọn vào câu.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: những người nghèo theo tiêu chuẩn thế gian
  rationale: 'Hiểu τῷ κόσμῳ là chỉ phương diện hay chuẩn đánh giá: nghèo xét theo thế gian. Cách dịch này rõ nghĩa và tránh khiến người đọc hiểu đơn thuần là người nghèo đang sống trong thế giới.'
- source_word: πλουσίους ἐν πίστει
  choice: giàu có trong đức tin
  rationale: Giữ sự đối lập giữa nghèo theo tiêu chuẩn thế gian và giàu về đức tin; πίστις ở đây tự nhiên nhất là “đức tin,” dù “lòng tin” cũng có thể diễn đạt ý này.
- source_word: κληρονόμους τῆς βασιλείας
  choice: người thừa kế vương quốc
  rationale: “Người thừa kế” giữ hình ảnh pháp lý-gia đình của κληρονόμος, còn “vương quốc” chuyển tải trực tiếp βασιλεία trong ngữ cảnh này.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: mà Ngài đã hứa cho những ai yêu mến Ngài
  rationale: Giữ quan hệ trực tiếp giữa lời hứa về vương quốc và những người có đặc điểm là yêu mến Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa thần học của việc Đức Chúa Trời chọn người nghèo
  choice: Dịch ἐξελέξατο đơn giản là “đã chọn.”
  alternative: Diễn giải theo một học thuyết cụ thể về tiền định hoặc sự tuyển chọn cứu rỗi.
  rationale: Lập luận trực tiếp của Gia-cơ đối chiếu sự đánh giá của Đức Chúa Trời với thói thiên vị theo địa vị xã hội; bản dịch không nên giải quyết các tranh luận thần học rộng hơn mà câu này không trình bày rõ.
- issue: Phạm vi của ἀδελφοί
  choice: Dùng “anh em” trong chính văn và ghi khả năng bao gồm cả nam lẫn nữ ở chú thích.
  alternative: Dịch ngay trong chính văn là “anh chị em.”
  rationale: Danh từ Hy Lạp mang hình thức giống đực số nhiều nhưng trong lời xưng hô cộng đồng có thể bao gồm toàn thể tín hữu; cách trình bày này giữ cả hình thức lẫn khả năng bao hàm.
- issue: Ý nghĩa của πίστις
  choice: Dùng “đức tin.”
  alternative: “Lòng tin” hoặc, ít có khả năng hơn trong ngữ cảnh này, “sự trung tín.”
  rationale: Trong cụm “giàu có trong πίστις,” nghĩa chỉ đức tin/lòng tin phù hợp nhất với ngữ cảnh; vẫn ghi nhận phạm vi nghĩa của từ trong chú thích.
- issue: Quan hệ vị ngữ sau “đã chọn”
  choice: Diễn đạt “để trở nên giàu có… và làm người thừa kế.”
  alternative: 'Dịch sát cấu trúc hơn: “đã chọn những người nghèo… là những người giàu… và những người thừa kế.”'
  rationale: Tiếng Hy Lạp đặt “giàu” và “người thừa kế” làm phần bổ nghĩa vị ngữ cho đối tượng được chọn. Cách dùng “để” là tiếng Việt tự nhiên, biểu thị địa vị/mục đích gắn với sự lựa chọn mà không xác định quá mức trình tự thời gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Hãy lắng nghe” giữ lực của mệnh lệnh; câu hỏi phủ định “Chẳng phải… sao?” bảo toàn tính chất tu từ, chờ đợi câu trả lời khẳng định. Đại từ “Ngài” được dùng nhất quán để chỉ Đức Chúa Trời.
