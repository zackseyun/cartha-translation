  to: 'Hãy lắng nghe, anh em yêu dấu của tôi[a]: Chẳng phải Đức Chúa Trời đã chọn những người nghèo theo tiêu chuẩn thế gian[b] là những người giàu có trong đức tin[c] và là những người thừa kế vương quốc mà Ngài đã hứa cho những ai yêu mến Ngài sao?'
