id: JAS.2.6
reference: James 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: vi
  text: Nhưng anh chị em lại khinh rẻ người nghèo[a]. Chẳng phải những người giàu áp bức anh chị em và chính họ lôi anh chị em ra tòa[b] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nghèo khó”; dạng số ít trong tiếng Hy Lạp có lẽ nhắc lại người nghèo cụ thể ở các câu trước, đồng thời đại diện cho người nghèo nói chung.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đến các tòa án” hoặc “đến nơi xét xử.” Từ Hy Lạp chỉ các cơ quan tư pháp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: khinh rẻ
  rationale: Diễn đạt hành vi tước bỏ danh dự và đối xử với sự khinh miệt; tự nhiên trong tiếng Việt và giữ được chiều kích danh dự–hổ thẹn của động từ.
- source_word: τὸν πτωχόν
  choice: người nghèo
  rationale: Giữ dạng số ít của tiếng Hy Lạp, nối với người nghèo cụ thể trong ví dụ ở các câu trước, đồng thời vẫn có thể mang tính đại diện.
- source_word: οἱ πλούσιοι
  choice: những người giàu
  rationale: Chuyển tính từ dùng như danh từ thành cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: καταδυναστεύουσιν
  choice: áp bức
  rationale: Thể hiện việc dùng quyền lực hà khắc chống lại người khác mà không thu hẹp vào một hình thức bóc lột cụ thể.
- source_word: ἕλκουσιν
  choice: lôi
  rationale: Giữ hình ảnh kéo đi bằng sức mạnh và sắc thái cưỡng ép trong bối cảnh kiện tụng.
- source_word: κριτήρια
  choice: ra tòa
  rationale: Cách nói tiếng Việt tự nhiên cho việc đưa người khác đến cơ quan xét xử; chú thích nêu khả năng dịch sát hơn là 'các tòa án'.
- source_word: καὶ αὐτοὶ
  choice: và chính họ
  rationale: 'Bảo toàn sự nhấn mạnh: chính những người giàu ấy là người thực hiện hành động.'
- source_word: οὐχ ... ;
  choice: Chẳng phải ... sao?
  rationale: Cấu trúc nghi vấn tu từ tự nhiên trong tiếng Việt, hàm ý câu trả lời khẳng định.
theological_decisions:
- issue: Sở chỉ của danh từ số ít τὸν πτωχόν
  choice: Một người nghèo mang tính đại diện trong tình huống hội họp vừa nêu
  alternative: Người nghèo nói chung như một tập thể
  rationale: Dạng số ít tiếp nối nhân vật cụ thể trong Gia-cơ 2:2–3, nhưng không loại trừ việc người ấy đại diện cho người nghèo nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς; chọn “khinh rẻ” và “lôi ... ra tòa” để giữ sức nặng và tính sống động của nguyên văn.
