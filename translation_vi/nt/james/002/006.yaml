  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của nguyên văn: sự đối lập với “nhưng,” động từ ἠτιμάσατε với sắc thái khinh miệt/làm mất danh dự, danh từ số ít τὸν πτωχόν, câu hỏi tu từ οὐχ ... sao, sự áp bức của người giàu, nét nhấn mạnh của καὶ αὐτοὶ, và hình ảnh cưỡng ép ἕλκουσιν ... εἰς κριτήρια.'
  naturalness: “Nhưng anh chị em lại khinh rẻ người nghèo” và “Chẳng phải những người giàu áp bức anh chị em và chính họ lôi anh chị em ra tòa sao?” là tiếng Việt hiện đại, rõ ràng, trang trọng vừa phải, và phù hợp văn mạch thư tín. “Lôi ... ra tòa” diễn đạt tự nhiên lực cưỡng ép của động từ Hy Lạp.
  terminology: “Khinh rẻ,” “người nghèo,” “áp bức,” và “ra tòa” đều thích hợp. “Người nghèo” duy trì được số ít không đánh dấu trong tiếng Việt và vẫn cho phép nghĩa đại diện/generic theo văn mạch. Các chú thích giải thích đúng những lựa chọn thay thế có liên quan.
