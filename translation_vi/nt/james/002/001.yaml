id: JAS.2.1
reference: James 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: vi
  text: Anh em của tôi[a], đừng giữ đức tin nơi[b] Chúa Giê-su, Đấng Mê-si vinh hiển của chúng ta[c], mà lại thiên vị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “anh chị em của tôi”; tiếng Hy Lạp dùng từ “anh em”, nhưng lời gọi này hướng đến cộng đồng tín hữu nói chung.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn có cấu trúc cũng có thể dịch là “đức tin của Chúa Giê-su, Đấng Mê-si”.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “Chúa Giê-su, Đấng Mê-si, Chúa của vinh quang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Anh em của tôi
  rationale: Giữ hình thức hô gọi giống đực số nhiều của tiếng Hy Lạp; trong văn cảnh, cách gọi này hướng đến toàn thể cộng đồng tín hữu, nên ý bao gồm cả nam lẫn nữ được nêu ở chú thích.
- source_word: μὴ ... ἔχετε
  choice: đừng giữ
  rationale: μή với mệnh lệnh hiện tại diễn đạt lời cấm; “giữ đức tin” tự nhiên trong tiếng Việt và chuyển tải ý duy trì hay thực hành đức tin.
- source_word: ἐν προσωπολημψίαις
  choice: mà lại thiên vị
  rationale: προσωπολημψία chỉ sự đối xử thiên vị dựa trên địa vị hay bề ngoài. Cấu trúc “đừng ... mà lại ...” diễn đạt tự nhiên sự bất tương hợp giữa đức tin và hành vi thiên vị; số nhiều Hy Lạp được chuyển theo lối thành ngữ.
- source_word: τὴν πίστιν
  choice: đức tin
  rationale: “Đức tin” là cách diễn đạt chuẩn, dễ hiểu và phù hợp với văn cảnh cộng đồng tín hữu.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nơi Chúa Jêsus, Đấng Mê-si, Chúa ... của chúng ta
  rationale: “Nơi” thể hiện cách hiểu khách thể tự nhiên nhất của bổ ngữ sau πίστις, trong khi chú thích bảo lưu khả năng hiểu cấu trúc sở hữu/định nghĩa. Χριστός được dịch như tước hiệu “Đấng Mê-si”.
- source_word: τῆς δόξης
  choice: Chúa vinh quang
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và gắn “vinh quang” với Chúa Jêsus; cách dịch sát hơn “Chúa của vinh quang” được bảo lưu trong chú thích.
theological_decisions:
- issue: Quan hệ sở hữu cách trong τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: đức tin nơi Chúa Jêsus, Đấng Mê-si
  alternative: đức tin của Chúa Jêsus, Đấng Mê-si
  rationale: Cách hiểu khách thể (“tin nơi”) tạo câu tiếng Việt tự nhiên, nhưng ngữ pháp Hy Lạp có thể được hiểu theo hơn một cách; chú thích tránh xóa bỏ sự mơ hồ thật sự của nguyên văn.
- issue: Cách hiểu τῆς δόξης
  choice: Chúa vinh quang của chúng ta
  alternative: Chúa Jêsus, Đấng Mê-si, Chúa của vinh quang
  rationale: Cụm sở hữu cách có thể mang nghĩa thuộc tính (“vinh quang”) hoặc danh xưng theo lối Kinh Thánh (“Chúa của vinh quang”); bản chính chọn cách tự nhiên hơn và chú thích giữ cách kia.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong chuỗi tước hiệu trang trọng này, Χριστός vẫn mang nội dung chức danh, nên dịch là “Đấng Mê-si” thay vì coi như một phần tên riêng.
- issue: Phạm vi của Ἀδελφοί
  choice: Anh em
  alternative: Anh chị em
  rationale: Bản chính giữ giống ngữ pháp của từ Hy Lạp, còn chú thích cho biết lời gọi trong văn cảnh hướng đến cộng đồng tín hữu nói chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu dùng “mà lại” để làm rõ sự xung khắc giữa việc giữ đức tin và thái độ thiên vị, không thêm nội dung giáo phái. Danh xưng “Chúa Jêsus, Đấng Mê-si” giữ sắc thái tôn kính và chức danh của nguyên văn.
