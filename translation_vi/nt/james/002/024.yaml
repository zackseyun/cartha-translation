id: JAS.2.24
reference: James 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: vi
  text: Anh chị em thấy rằng một người được xưng công chính bởi việc làm, chứ không chỉ bởi đức tin.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được chứng tỏ là công chính” hoặc “được minh oan.” Cách diễn đạt của Gia-cơ được giữ nguyên, không giải quyết thay cuộc tranh luận về mối liên hệ giữa cách ông và Phao-lô dùng từ “xưng công chính.”'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp ở đây chỉ “một người” theo nghĩa đại diện, tức là con người nói chung.
    reason: cultural_note
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Anh chị em thấy
  rationale: Động từ hiện tại chủ động, ngôi thứ hai số nhiều, trực tiếp hướng đến toàn thể độc giả. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái trần thuật hơn là biến thành mệnh lệnh.
- source_word: ἐξ ἔργων
  choice: bởi việc làm
  rationale: ἐξ với sở hữu cách chỉ cơ sở hoặc căn cứ trong lập luận; “bởi việc làm” diễn đạt gọn và tự nhiên.
- source_word: δικαιοῦται
  choice: được xưng công chính
  rationale: Giữ thuật ngữ thần học quen thuộc và mối liên hệ từ vựng với δικαιόω, đồng thời không quyết định thay độc giả rằng ở đây từ này nhất thiết chỉ mang nghĩa tuyên bố pháp lý hay chứng minh là công chính.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Trong ngữ cảnh, danh từ giống đực số ít được dùng theo nghĩa đại diện, chỉ con người nói chung. Tiếng Việt không buộc phải dùng một danh từ mang giới tính để bảo toàn nghĩa này.
- source_word: πίστεως
  choice: đức tin
  rationale: “Đức tin” là cách dịch mặc định, tự nhiên và đã định hình trong văn phong Kinh Thánh tiếng Việt; những khả năng như “lòng tin” hay “sự trung tín” kém phù hợp hơn trong thế đối lập của câu này.
- source_word: μόνον
  choice: chỉ ... mà thôi
  rationale: Cấu trúc bao quanh “bởi đức tin” diễn đạt rõ sắc thái loại trừ của μόνον bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Nghĩa của δικαιοῦται và quan hệ với thần học về sự xưng công chính
  choice: Giữ “được xưng công chính” trong chính văn và chú thích khả năng “được chứng tỏ là công chính/được minh chứng là đúng.”
  alternative: được chứng tỏ là công chính; được minh chứng là đúng
  rationale: Cách dịch này bảo toàn sức nặng từ vựng và sự căng thẳng thần học trong lời của Gia-cơ, không âm thầm dung hòa với cách dùng của Phao-lô.
- issue: Phạm vi chỉ người của ἄνθρωπος
  choice: Dịch “một người” theo nghĩa khái quát.
  alternative: một con người; người ta
  rationale: Ở đây ἄνθρωπος nói về con người nói chung, không giới hạn ở nam giới; “một người” vừa chính xác vừa tự nhiên trong tiếng Việt.
- issue: Phạm vi của μόνον
  choice: 'Gắn ý loại trừ với “đức tin”: “chứ không chỉ bởi đức tin mà thôi.”'
  alternative: chứ không bởi đức tin đơn độc
  rationale: Giữ nguyên mệnh đề gây tranh luận của Gia-cơ mà không thêm khái niệm như “đức tin thật” hay “đức tin sống,” vốn không xuất hiện trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện ngôi thứ hai số nhiều mà không cổ hóa; giữ thuật ngữ “xưng công chính” vì tính liên tục thần học. Không thêm chú thích riêng cho πίστις vì trong ngữ cảnh này “đức tin” là nghĩa nổi trội, còn “sự trung tín” có thể gây nhiễu hơn là bảo tồn một khả năng thực sự đáng kể.
