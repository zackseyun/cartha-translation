revisions:
- from: Anh chị em thấy rằng một người được xưng công chính bởi việc làm, chứ không chỉ bởi đức tin mà thôi.[a][b]
  to: Anh chị em thấy rằng một người được xưng công chính bởi việc làm, chứ không chỉ bởi đức tin.[a][b]
  rationale: Chỉ sửa cách diễn đạt để loại bỏ sự lặp nghĩa của μόνον và làm trau chuốt chú thích từ vựng. Bản sửa vẫn giữ sự căng thẳng của câu về “xưng công chính,” không thêm điều kiện thần học nào cho “đức tin” hoặc “việc làm,” và không thay đổi phạm vi khái quát của ἄνθρωπος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính của câu Hy Lạp: lời hướng đến số nhiều, mệnh đề ὅτι, sự đối lập giữa ἐξ ἔργων và οὐκ ἐκ πίστεως μόνον, cùng thuật ngữ trung tâm δικαιοῦται. “Một người” truyền đạt đúng giá trị khái quát của ἄνθρωπος.'
  naturalness: 'Cụm “chứ không chỉ bởi đức tin mà thôi” bị trùng ý loại trừ: “chỉ” và “mà thôi” cùng diễn đạt μόνον. Bỏ “mà thôi” tạo câu hiện đại, gọn và chính xác hơn.'
  terminology: “Được xưng công chính,” “việc làm,” và “đức tin” là các thuật ngữ phù hợp, nhất quán và không áp đặt cách giải thích thần học. Chú thích về δικαιόω nên dùng cách diễn đạt Việt ngữ tự nhiên hơn cho khả năng “vindicated.”
  issues:
  - severity: low
    issue: Trùng lặp dấu hiệu loại trừ trong “không chỉ ... mà thôi.”
    rationale: μόνον chỉ cần được biểu đạt một lần. “Chứ không chỉ bởi đức tin” truyền đạt đầy đủ nghĩa “and not by faith alone” mà không làm câu nặng hoặc thừa.
  - severity: low
    issue: “Được minh chứng là đúng” trong chú thích chưa tự nhiên bằng cách nói về sự xác nhận/minh oan.
    rationale: Đây là một khả năng nghĩa của δικαιόω cần được nêu như phương án diễn giải từ vựng, nhưng nên diễn đạt tự nhiên, đồng thời không thay thế thuật ngữ chính văn.
