source:
  edition: SBLGNT
  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: vi
  text: Nhưng nếu anh chị em thiên vị[a], thì anh chị em phạm tội và bị luật pháp kết tội là những kẻ vi phạm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đối xử thiên lệch”. Động từ Hy Lạp chỉ việc đánh giá hoặc đối xử với người khác dựa trên địa vị hay vẻ bề ngoài.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị luật pháp vạch rõ là những kẻ phạm luật”. Từ Hy Lạp được dịch là “kết tội” mang ý nghĩa phơi bày điều sai trái và chứng minh là có tội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Giữ cả sắc thái điều kiện của εἰ và sự tương phản nhẹ của δέ với lập luận ngay trước đó.
- source_word: προσωπολημπτεῖτε
  choice: anh chị em thiên vị
  rationale: “Thiên vị” là cách nói tự nhiên, hiện đại, diễn đạt việc đối xử với người khác dựa trên địa vị hoặc vẻ bề ngoài.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: anh chị em phạm tội
  rationale: Cụm này có nghĩa thành ngữ là làm hay phạm tội; cách dịch này rõ ràng và giữ giá trị hiện tại trong mệnh đề điều kiện.
- source_word: ἐλεγχόμενοι
  choice: bị ... kết tội
  rationale: Trong văn cảnh pháp lý, phân từ bị động diễn tả việc luật pháp phơi bày hành vi sai trái và xác định người vi phạm có tội.
- source_word: ὑπὸ τοῦ νόμου
  choice: bị luật pháp
  rationale: Giữ luật pháp làm tác nhân của động từ bị động, đồng thời không thu hẹp νόμος thành một hệ thống luật cụ thể hơn điều nguyên văn xác định.
- source_word: ὡς παραβάται
  choice: là những kẻ vi phạm
  rationale: Diễn đạt người vượt qua ranh giới mà luật đặt ra; “vi phạm” giữ sắc thái pháp lý mà vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất của luật pháp trong lập luận đạo đức của Gia-cơ
  choice: Dịch νόμος là “luật pháp” mà không thêm “Môi-se” hoặc “của Đức Chúa Trời”.
  alternative: luật pháp Môi-se; luật pháp của Đức Chúa Trời
  rationale: Câu này trình bày luật pháp như chuẩn mực vạch rõ sự thiên vị là tội lỗi, nhưng nguyên văn không buộc phải xác định hẹp hơn về mặt giao ước hay hệ phái.
- issue: Quan hệ cú pháp của ἐλεγχόμενοι với mệnh đề chính
  choice: 'Dùng liên từ “và” để diễn đạt tự nhiên: “phạm tội và bị luật pháp kết tội”.'
  alternative: “phạm tội, trong khi bị luật pháp kết tội” hoặc “phạm tội, bị luật pháp kết tội”
  rationale: Phân từ bị động có thể được chuyển thành động từ hữu hạn phối hợp trong tiếng Việt để câu tự nhiên hơn, nhưng vẫn giữ hành động kết tội gắn với việc phạm tội.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên và dễ hiểu trong tiếng Việt hiện đại. Dùng “anh chị em” cho ngôi thứ hai số nhiều nhằm phù hợp văn cảnh cộng đồng; tránh cách dịch quá cổ như “tư vị” hoặc quá chuyên môn như “kẻ vượt luật”.
