id: JAS.2.19
reference: James 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: vi
  text: Bạn tin rằng Đức Chúa Trời là một[a]; bạn làm đúng. Ngay cả các quỷ cũng tin và run sợ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chỉ có một Đức Chúa Trời.” Tiếng Hy Lạp cho phép cả hai cách hiểu; “Đức Chúa Trời là một” theo sát cách diễn đạt Hy Lạp hơn và có thể gợi lại lời tuyên xưng độc thần của người Do Thái.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “rùng mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: Bạn
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo sắc thái nhấn mạnh; tiếng Việt giữ lời xưng hô trực tiếp ở ngôi thứ hai số ít, phù hợp với mạch tranh luận.
- source_word: πιστεύεις / πιστεύουσιν
  choice: tin / tin
  rationale: Giữ nguyên sự lặp từ có chủ ý của bản Hy Lạp, qua đó làm nổi bật rằng sự xác tín về một mệnh đề tự nó chưa phân biệt người nghe với các quỷ.
- source_word: εἷς ἐστιν ὁ θεός
  choice: Đức Chúa Trời là một
  rationale: Theo sát cấu trúc Hy Lạp và giữ khả năng đây là tiếng vọng của lời tuyên xưng độc thần của người Do Thái. Cách hiểu hiện sinh “chỉ có một Đức Chúa Trời” vẫn được ghi ở chú thích.
- source_word: καλῶς ποιεῖς
  choice: bạn làm đúng
  rationale: Diễn đạt tự nhiên lời thừa nhận ngắn gọn của Gia-cơ, đồng thời không làm mất sắc thái mỉa mai hoặc khiển trách nảy sinh từ câu kế tiếp.
- source_word: καὶ τὰ δαιμόνια
  choice: Ngay cả các quỷ
  rationale: Dịch καί theo nghĩa tăng tiến là “ngay cả”, làm rõ sức nặng tu từ của phép đối chiếu.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Là cách tương ứng trực tiếp, quen thuộc và ít diễn giải hơn “các tà linh”.
- source_word: φρίσσουσιν
  choice: run sợ
  rationale: Truyền đạt phản ứng sợ hãi mạnh mẽ kèm biểu hiện thân thể; chú thích nêu cách dịch sát hình ảnh hơn là “rùng mình”.
theological_decisions:
- issue: Cách diễn đạt lời tuyên xưng độc thần εἷς ἐστιν ὁ θεός
  choice: Đức Chúa Trời là một
  alternative: chỉ có một Đức Chúa Trời
  rationale: Bản chính giữ gần cú pháp Hy Lạp và tiếng vọng có thể có của lời tuyên xưng độc thần, nhưng không loại trừ cách hiểu nhấn mạnh rằng chỉ có một Đức Chúa Trời.
- issue: Sự đối chiếu giữa niềm tin của người nghe và niềm tin của các quỷ
  choice: Ngay cả các quỷ cũng tin và run sợ
  alternative: Các quỷ cũng tin và run sợ
  rationale: '“Ngay cả” thể hiện lực tăng tiến của καί, giữ nguyên căng thẳng thần học trong câu: sự tin nhận đúng về mặt mệnh đề cũng hiện diện nơi các quỷ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Giữ lời xưng hô số ít “bạn”, phép lặp “tin”, cùng nhịp chuyển mạnh sang “ngay cả các quỷ” để bảo toàn sức nặng tu từ của nguyên văn.
