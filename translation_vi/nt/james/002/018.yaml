revisions:
- from: 'Nhưng sẽ có người nói[a]: “Bạn có đức tin, còn tôi có việc làm.” Hãy cho tôi thấy đức tin của bạn tách biệt với việc làm[b], còn tôi sẽ cho bạn thấy đức tin của tôi qua những việc làm của mình[c].'
  to: 'Nhưng có người sẽ nói[a]: “Bạn có đức tin, còn tôi có việc làm.” Hãy cho tôi thấy đức tin của bạn không có việc làm[b], còn tôi sẽ cho bạn thấy đức tin của tôi qua những việc làm của tôi[c].'
  rationale: Thay “tách biệt với việc làm” bằng “không có việc làm” để phản ánh trực tiếp hơn χωρὶς mà vẫn giữ tính thách thức và không thêm diễn giải. Điều chỉnh trật tự mở đầu cho tự nhiên hơn, đồng thời đổi “của mình” thành “của tôi” để duy trì phép đối xứng rõ ràng với “đức tin của tôi” và với đại từ ngôi thứ nhất trong nguyên ngữ. Chú thích về ranh giới lời trích dẫn được giữ lại để bảo toàn sự không chắc chắn của dấu câu/giọng nói trong bản văn cổ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:27:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc đối đáp, thì tương lai của ἐρεῖ, mệnh lệnh δεῖξόν, và thế đối chiếu giữa χωρὶς τῶν ἔργων với ἐκ τῶν ἔργων μου. Tuy nhiên, “tách biệt với việc làm” dễ chuyển nghĩa từ “không có/không dựa vào việc làm” sang ý “tách riêng, phân biệt với,” nên chưa sát bằng cách diễn đạt trực tiếp hơn.
  naturalness: “Có người sẽ nói” tự nhiên hơn trật tự “sẽ có người nói.” Trong ngữ cảnh lập luận này, “không có việc làm” không có nguy cơ thực tế bị hiểu là thất nghiệp; nó rõ ràng và tự nhiên hơn “tách biệt với việc làm.”
  terminology: “Đức tin” và “việc làm” là các thuật ngữ phù hợp, nhất quán, và không áp đặt một cách giải thích thần học lên πίστις hay ἔργα. “Qua những việc làm của tôi” diễn đạt tự nhiên chức năng chứng tỏ của ἐκ mà vẫn để chú thích nêu lựa chọn sát chữ “từ.”
  issues:
  - severity: medium
    issue: “tách biệt với việc làm” không diễn đạt trực tiếp nhất cho χωρὶς τῶν ἔργων.
    rationale: χωρίς có nghĩa “không có, không kèm, apart from.” “Tách biệt với” trong tiếng Việt thường gợi sự phân cách hay phân biệt giữa hai thực thể, làm yếu lời thách thức rằng đức tin phải được chỉ ra khi không có việc làm.
  - severity: low
    issue: Trật tự “sẽ có người nói” hơi kém tự nhiên.
    rationale: “Có người sẽ nói” vẫn giữ thì tương lai và lối đối thoại giả định của ἐρεῖ τις, nhưng thuận tiếng Việt hiện đại hơn.
