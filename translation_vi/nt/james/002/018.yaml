source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: vi
  text: 'Nhưng có người sẽ nói[a]: “Bạn có đức tin, còn tôi có việc làm.” Hãy cho tôi thấy đức tin của bạn không có việc làm[b], còn tôi sẽ cho bạn thấy đức tin của tôi qua những việc làm của tôi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hy Lạp cổ không có dấu ngoặc kép hiện đại. Cũng có thể hiểu lời của “người nói” kéo dài sang một phần hoặc toàn bộ câu tiếp theo.
    reason: quotation_boundary
  - marker: b
    text: 'Cũng có thể dịch: “tách rời việc làm” hoặc “không kèm việc làm.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch sát hơn: “từ những việc làm của tôi.” Giới từ Hy Lạp có thể chỉ nguồn hoặc phương tiện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’ ἐρεῖ τις
  choice: Nhưng sẽ có người nói
  rationale: Giữ liên từ tương phản và thì tương lai của lối lập luận với một người đối thoại giả định.
- source_word: πίστιν / πίστιν
  choice: đức tin
  rationale: Đây là cách dịch quen thuộc và phù hợp trong lập luận của Gia-cơ; không tự ý giải quyết căng thẳng giữa đức tin được tuyên xưng và việc làm biểu lộ đức tin ấy.
- source_word: ἔργα / ἔργων
  choice: việc làm / những việc làm
  rationale: Giữ nhất quán thuật ngữ then chốt trong đoạn văn. Số nhiều được thể hiện rõ ở vế nói về các việc làm của người đáp lời.
- source_word: δεῖξόν μοι
  choice: Hãy cho tôi thấy
  rationale: Diễn đạt tự nhiên mệnh lệnh trực tiếp yêu cầu một sự chứng minh có thể nhận thấy.
- source_word: χωρὶς τῶν ἔργων
  choice: tách biệt với việc làm
  rationale: Truyền đạt nghĩa ‘ngoài, không có’ mà tránh cách nói ‘không có việc làm’, vốn dễ bị hiểu trong tiếng Việt hiện đại là thất nghiệp.
- source_word: κἀγώ σοι δείξω
  choice: còn tôi sẽ cho bạn thấy
  rationale: ‘Còn tôi’ thể hiện sự nhấn mạnh và đối chiếu của κἀγώ một cách tự nhiên.
- source_word: ἐκ τῶν ἔργων μου
  choice: qua những việc làm của mình
  rationale: ἐκ có thể chỉ nguồn hoặc phương tiện; ‘qua’ diễn đạt rằng việc làm khiến đức tin trở nên có thể nhận thấy mà không biến việc làm thành chính đức tin.
theological_decisions:
- issue: Nghĩa của πίστις trong cuộc bàn luận về đức tin và việc làm
  choice: đức tin
  alternative: sự tin cậy; lòng trung tín
  rationale: ‘Đức tin’ bảo toàn thuật ngữ trung tâm và căng thẳng thần học của bản văn; ‘lòng trung tín’ sẽ nghiêng quá sớm về một cách giải thích.
- issue: Phạm vi lời của người đối thoại giả định
  choice: Chỉ đặt “Bạn có đức tin, còn tôi có việc làm” trong ngoặc kép
  alternative: Xem cả lời thách thức tiếp theo là lời của người đối thoại giả định
  rationale: Bản Hy Lạp cổ không có dấu ngoặc kép hiện đại, nên ranh giới lời trích dẫn phải được suy ra. Cách chọn này tạo mạch đối đáp tự nhiên, nhưng phương án rộng hơn vẫn có thể được cân nhắc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và trực tiếp. Dùng “bạn/tôi” để giữ hình thức đối thoại số ít; dùng “việc làm” nhất quán với thuật ngữ thần học quen thuộc, đồng thời chọn “tách biệt với” để tránh nghĩa đời thường ‘không có việc làm’.
