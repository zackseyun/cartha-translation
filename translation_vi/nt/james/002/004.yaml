translation:
  language: vi
  text: Chẳng phải anh chị em đã phân biệt đối xử trong cộng đồng anh chị em và trở thành những người xét đoán có những suy tính xấu xa sao?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã phân biệt giữa anh chị em.” Động từ này còn có thể mang nghĩa “bị chia rẽ” hoặc, trong những ngữ cảnh khác, “nghi ngờ”; nhưng ở đây, ngữ cảnh nghiêng về việc phân biệt đối xử.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “những người xét đoán của những suy tính (hoặc: lý lẽ) xấu xa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: đã phân biệt đối xử
  rationale: Trong ngữ cảnh Gia-cơ 2:1–3, động từ chỉ việc phân biệt giàu nghèo và thiên vị trong cộng đồng. Cách dịch này phù hợp hơn nghĩa “nghi ngờ” thường gặp ở những ngữ cảnh khác, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν ἑαυτοῖς
  choice: với nhau
  rationale: Cụm từ có thể chỉ điều diễn ra “trong lòng” hoặc “giữa anh chị em”; bối cảnh hành xử trong buổi nhóm họp nghiêng về quan hệ giữa các thành viên.
- source_word: ἐγένεσθε
  choice: trở thành
  rationale: 'Động từ γίνομαι nêu kết quả: qua việc phân biệt đối xử, họ trở thành một loại người xét đoán đáng trách.'
- source_word: κριταὶ
  choice: những người xét đoán
  rationale: Cách diễn đạt này giữ sắc thái phán xét mang tính đạo đức của κριταί, đồng thời tự nhiên hơn “các thẩm phán” trong ngữ cảnh cộng đồng.
- source_word: διαλογισμῶν πονηρῶν
  choice: theo các ý tưởng xấu xa
  rationale: Giữ được nội dung từ vựng “ý tưởng/suy tính” và biểu thị rằng sự xét đoán bị chi phối bởi những suy tính xấu; chú thích bảo lưu cấu trúc sở hữu sát chữ.
- source_word: οὐ
  choice: Chẳng phải ... sao?
  rationale: Cấu trúc câu hỏi tu từ tiếng Việt tự nhiên này bảo toàn sắc thái quở trách và chờ đợi câu trả lời khẳng định.
theological_decisions:
- issue: Nghĩa của διακρίνω trong mối liên hệ với sự thiên vị
  choice: Câu này quở trách việc phân biệt đối xử trong cộng đồng tín hữu.
  alternative: Câu này nói đến sự phân tâm, chia rẽ trong lòng hoặc nghi ngờ.
  rationale: Ngữ cảnh trực tiếp ở 2:1–3 là việc đối xử thiên vị với người giàu và người nghèo, vì vậy nghĩa xã hội của động từ phù hợp hơn nghĩa “nghi ngờ”; chú thích vẫn ghi nhận tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để diễn đạt số nhiều ngôi thứ hai trong cộng đồng tín hữu; “phân biệt đối xử” làm rõ hành vi thiên vị trong ngữ cảnh, còn các khả năng khác của nguyên ngữ được bảo lưu trong chú thích.
