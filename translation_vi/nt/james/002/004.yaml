revisions:
- from: Chẳng phải anh chị em đã phân biệt đối xử với nhau và trở thành những người xét đoán theo các ý tưởng xấu xa sao?[a][b]
  to: Chẳng phải anh chị em đã phân biệt đối xử trong cộng đồng anh chị em và trở thành những người xét đoán có những suy tính xấu xa sao?[a][b]
  rationale: Bản sửa giữ nguyên câu hỏi tu từ, ý nghĩa phân biệt đối xử trong cộng đồng, và sắc thái kết quả của “trở thành”. Cụm cuối được đổi để phản ánh tự nhiên hơn việc các người xét đoán bị đặc trưng bởi những suy tính xấu xa, đồng thời chú thích bảo lưu cấu trúc genitive sát chữ.
  reviewer_model: gpt-5.6-terra
