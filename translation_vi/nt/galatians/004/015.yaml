id: GAL.4.15
reference: Galatians 4:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: vi
  text: Vậy, phước hạnh của anh em nay ở đâu?[a] Vì tôi làm chứng với anh em rằng, nếu có thể,[b] anh em hẳn đã móc mắt mình ra mà trao cho tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phước hạnh” cũng có thể dịch là “sự được phước” hoặc “cảm nhận mình được phước.” Từ Hy Lạp này có thể chỉ tình trạng hoặc lời tuyên xưng một người là có phước.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đã móc mắt mình ra.” Đây có lẽ là cách nói cường điệu về lòng tận tụy trước kia của anh em; một số người cho rằng câu này ám chỉ tình trạng thân thể của Phao-lô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποῦ οὖν
  choice: Vậy... nay ở đâu?
  rationale: Diễn đạt câu hỏi tu từ về điều đã xảy ra với thái độ trước đây của người Ga-la-ti; “vậy” giữ sắc thái suy luận của οὖν, còn “nay” làm rõ sự tương phản theo ngữ cảnh mà không thay đổi ý.
- source_word: ὁ μακαρισμὸς ὑμῶν
  choice: niềm hạnh phúc anh em từng có
  rationale: μακαρισμός có thể chỉ tình trạng được phước hoặc việc tự xem mình là có phước. Cách dịch này tự nhiên trong tiếng Việt và gợi lại thái độ vui mừng, thấy mình có phước khi tiếp nhận Phao-lô, nhưng chú thích vẫn bảo lưu phạm vi nghĩa.
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: Vì tôi làm chứng cho anh em
  rationale: Giữ giọng trang trọng, xác quyết của μαρτυρέω và hiểu ὑμῖν là đối tượng được nói với.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn nội dung lời chứng của Phao-lô, thay vì được hiểu theo nghĩa nguyên nhân.
- source_word: εἰ δυνατὸν
  choice: nếu có thể
  rationale: Giữ sự cô đọng và hình thức điều kiện của tiếng Hy Lạp; ngữ cảnh cho thấy việc ấy thực tế không thể thực hiện.
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: anh em đã móc mắt mình
  rationale: “Móc mắt” giữ nguyên hình ảnh cụ thể, mạnh của ἐξορύσσω và tự nhiên hơn trong tiếng Việt hiện đại so với cách diễn đạt quá sát cấu trúc phân từ.
- source_word: ἐδώκατέ μοι
  choice: mà trao cho tôi
  rationale: Diễn đạt hành động chính ở quá khứ; “mà” liên kết tự nhiên với hành động móc mắt, còn tân ngữ được hiểu rõ là mắt.
theological_decisions:
- issue: Hình ảnh móc mắt là lời nói cường điệu về lòng tận tụy hay ám chỉ bệnh trạng của Phao-lô
  choice: Giữ nguyên hình ảnh cụ thể “móc mắt mình mà trao cho tôi” và không xác định nguyên nhân.
  alternative: Khái quát hóa thành “anh em sẵn lòng cho tôi bất cứ điều gì” hoặc giải thích đó là bằng chứng Phao-lô mắc bệnh về mắt.
  rationale: Bản Hy Lạp nói rõ đến mắt bằng một động từ mạnh. Có thể đây là phép cường điệu về lòng tận tụy trước kia, nhưng văn bản không buộc phải kết luận rằng Phao-lô có bệnh về mắt; bản dịch cần bảo lưu độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được sắp xếp theo trật tự tiếng Việt tự nhiên; hình ảnh mạnh của nguyên văn được giữ lại, còn chú thích nêu các khả năng từ vựng và diễn giải mà không quyết định thay văn bản.
