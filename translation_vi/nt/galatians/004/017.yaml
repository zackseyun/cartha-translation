id: GAL.4.17
reference: Galatians 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: vi
  text: Họ tha thiết lôi kéo anh chị em, nhưng không với ý tốt. Trái lại, họ muốn gạt anh chị em ra[b], để anh chị em tha thiết theo họ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể mang nghĩa “săn đón” hoặc “tha thiết tìm kiếm.” Cùng một động từ được dùng ở đầu và cuối câu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “loại trừ anh chị em.” Có lẽ họ muốn tách anh chị em khỏi Phao-lô và các cộng sự của ông để anh chị em hướng lòng theo họ.
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε (ζηλόω)
  choice: nhiệt thành với … cũng nhiệt thành với
  rationale: Giữ phép lặp đối xứng của cùng một động từ Hy Lạp ở đầu và cuối câu. Cách diễn đạt này truyền đạt sự quan tâm, theo đuổi hoặc mong được gắn bó, nhưng không tự giới hạn nghĩa vào sự ve vãn tình cảm.
- source_word: οὐ καλῶς
  choice: không phải với ý tốt
  rationale: Diễn đạt tự nhiên sự đánh giá tiêu cực của Phao-lô về cách thức hoặc động cơ của họ, đồng thời chú thích ghi nhận sắc thái rộng hơn của nguyên ngữ.
- source_word: ἀλλὰ
  choice: Trái lại
  rationale: Nêu rõ sự tương phản mạnh và đưa ra mục đích thật sự đằng sau vẻ nhiệt thành của những người ấy.
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: gạt anh chị em ra
  rationale: Giữ hình ảnh loại trừ hay ngăn cách mà không bổ sung đối tượng ngầm định—Phao-lô, cộng sự của ông, hội thánh hay phước lành—vào chính bản văn.
- source_word: θέλουσιν
  choice: họ muốn
  rationale: Cách diễn đạt thông dụng, trực tiếp cho động từ chỉ ý muốn.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mệnh đề chỉ mục đích trong tiếng Việt.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Thể hiện đại từ ngôi thứ hai số nhiều theo lối xưng hô cộng đồng, trang trọng và tự nhiên trong thư tín.
theological_decisions:
- issue: Những người ấy muốn gạt người Ga-la-ti ra khỏi ai hoặc điều gì
  choice: Không nêu rõ đối tượng trong chính câu; dùng “gạt anh chị em ra”.
  alternative: Nói rõ rằng họ muốn tách người Ga-la-ti khỏi Phao-lô và các cộng sự của ông, hoặc loại họ khỏi phước lành của Đức Chúa Trời hay khỏi hội thánh.
  rationale: Nguyên văn không nêu bổ ngữ cho ἐκκλεῖσαι. Văn cảnh nghiêng về việc đối thủ muốn phá vỡ quan hệ giữa người Ga-la-ti với Phao-lô để chuyển lòng trung thành về phía họ, nhưng bản dịch chính không nên biến suy luận hợp lý ấy thành điều được nói minh nhiên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh chị em” biểu thị số nhiều và phù hợp giọng thư tín. Phép lặp “nhiệt thành với” bảo toàn cấu trúc tu từ của nguyên văn; các chú thích ghi nhận độ rộng ngữ nghĩa và không áp đặt một cách hiểu giáo phái.
