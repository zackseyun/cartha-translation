revisions:
- from: Ha-ga là núi Si-nai ở miền Ả Rập[a], và tương ứng với Giê-ru-sa-lem hiện nay, vì thành ấy cùng các con mình đang làm nô lệ.
  to: Ha-ga là núi Si-nai ở miền Ả Rập[a], và tương ứng với Giê-ru-sa-lem hiện nay, vì bà cùng các con mình đang ở trong thân phận nô lệ.
  rationale: Bản sửa không thay đổi lời khẳng định ẩn dụ trực tiếp hay các thuật ngữ chính. Nó bỏ việc gọi Giê-ru-sa-lem là «thành ấy», vốn giải quyết quá mức một quy chiếu đại từ trong văn bản Hy Lạp, và dùng cách nói tiếng Việt tự nhiên hơn cho tình trạng nô lệ. Chú thích được chỉnh cho chính xác và sáng rõ hơn.
