id: GAL.4.25
reference: Galatians 4:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ ⸀δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει ⸀γὰρ μετὰ τῶν τέκνων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: vi
  text: Ha-ga là núi Si-nai ở miền Ả Rập[a], và tương ứng với Giê-ru-sa-lem hiện nay, vì bà cùng các con mình đang ở trong thân phận nô lệ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn Ha-ga này là núi Si-nai ở miền Ả Rập.” Tiếng Hy Lạp có mạo từ đứng trước tên “Ha-ga”, tạo nên một mệnh đề có cấu trúc khó diễn đạt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: Ha-ga
  rationale: Dịch tên riêng trực tiếp; δέ là từ nối nhẹ có thể để ngữ cảnh thể hiện. Mạo từ τὸ trước tên Ha-ga tạo một cấu trúc Hy Lạp khó, nên phương án khác được ghi ở chú thích.
- source_word: Σινᾶ ὄρος
  choice: núi Si-nai
  rationale: Trật tự tự nhiên trong tiếng Việt, giữ nguyên phép đồng nhất trực tiếp trong lập luận ẩn dụ của Phao-lô.
- source_word: ἐν τῇ Ἀραβίᾳ
  choice: ở miền Ả Rập
  rationale: Diễn đạt địa danh tự nhiên mà không xác định quá mức ranh giới chính trị của vùng Ả Rập thời ấy.
- source_word: συστοιχεῖ
  choice: tương ứng với
  rationale: Diễn tả việc đứng cùng một hàng hay thuộc cùng một phía trong phép đối chiếu của Phao-lô, đồng thời rõ ràng trong tiếng Việt hiện đại.
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: Giê-ru-sa-lem hiện nay
  rationale: Giữ ý nghĩa thời gian của νῦν và sự phân biệt với ‘Giê-ru-sa-lem ở trên’ trong câu kế tiếp.
- source_word: δουλεύει
  choice: đang làm nô lệ
  rationale: Giữ rõ trường nghĩa nô lệ, thay vì làm nhẹ thành ‘phục vụ’, và phù hợp với sự đối lập giữa nô lệ và tự do trong đoạn văn.
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: cùng các con mình
  rationale: μετά với sở hữu cách chỉ sự cùng chung tình trạng; ‘các con’ giữ hình ảnh gia đình trong phép ẩn dụ.
theological_decisions:
- issue: Sự đồng nhất mang tính ẩn dụ giữa Ha-ga với núi Si-nai và sự tương ứng với Giê-ru-sa-lem hiện nay
  choice: 'Dịch trực tiếp: ‘Ha-ga là núi Si-nai… và tương ứng với Giê-ru-sa-lem hiện nay.’'
  alternative: ‘Ha-ga tượng trưng cho núi Si-nai…’
  rationale: Bản Hy Lạp dùng cấu trúc đồng nhất trực tiếp rồi mới dùng động từ chỉ sự tương ứng. Bản dịch giữ sức mạnh tu từ và độ căng của lời văn, không giải thích thêm phép ẩn dụ.
- issue: Chủ thể ngữ pháp của mệnh đề δουλεύει
  choice: Dùng ‘thành ấy’ để chỉ Giê-ru-sa-lem hiện nay
  alternative: Hiểu chủ thể ngầm là Ha-ga và dịch ‘vì bà cùng các con mình đang làm nô lệ’
  rationale: Chủ thể gần nhất là Giê-ru-sa-lem, một danh từ giống cái; cách dịch này làm rõ mạch cú pháp, trong khi hình ảnh Ha-ga vẫn chi phối phép ẩn dụ. Không thêm một cách hiểu giáo lý ngoài văn bản.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt: Ha-ga, Si-nai, Giê-ru-sa-lem. ‘Đang làm nô lệ’ giữ sắc thái mạnh của trường từ vựng δουλ- và sự đối lập nô lệ–tự do trong ngữ cảnh.'
