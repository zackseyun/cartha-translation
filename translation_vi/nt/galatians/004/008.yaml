base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: vi
  text: Nhưng trước kia, khi anh chị em chưa biết Đức Chúa Trời, anh chị em đã làm nô lệ cho những hữu thể vốn không phải là thần.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với lập luận trước đó một cách tự nhiên và rõ ràng.
- source_word: τότε μὲν
  choice: trước kia
  rationale: Chỉ giai đoạn quá khứ của người Ga-la-ti và chuẩn bị cho sự tương phản ở câu kế tiếp; cách diễn đạt này tự nhiên hơn lối dịch sát chữ “lúc ấy” trong tiếng Việt.
- source_word: οὐκ εἰδότες θεὸν
  choice: khi anh chị em chưa biết Đức Chúa Trời
  rationale: Diễn đạt phân từ theo nghĩa thời gian, đồng thời giữ nghĩa nhận biết mang tính quan hệ của εἰδότες.
- source_word: θεὸν
  choice: Đức Chúa Trời
  rationale: Danh từ số ít không có mạo từ chỉ Đức Chúa Trời chân thật, tương phản với “các thần” ở cuối câu.
- source_word: ἐδουλεύσατε
  choice: anh chị em đã làm nô lệ
  rationale: Giữ sắc thái lệ thuộc và chủ đề nô lệ–tự do xuyên suốt thư Ga-la-ti, mạnh hơn cách dịch “phục vụ”.
- source_word: τοῖς ... οὖσι θεοῖς
  choice: cho những kẻ ... không phải là các thần
  rationale: Giữ đối tượng quy chiếu không xác định, không tự ý giải thích là tượng thần hay các quyền lực ma quỷ; “những kẻ” đủ rộng để bảo toàn khả năng quy chiếu đến các hữu thể được thờ phụng.
- source_word: φύσει μὴ
  choice: vốn không phải
  rationale: “Vốn” truyền đạt ý nghĩa về bản chất hoặc thực tại của φύσει trong tiếng Việt tự nhiên, tránh cấu trúc cứng “theo bản chất không phải”.
- source_word: θεοῖς
  choice: các thần
  rationale: Giữ danh từ số nhiều và sự tương phản với Đức Chúa Trời chân thật, không thay bằng cách giải thích như “thần giả” hay “thần tượng”.
theological_decisions:
- issue: Bản chất của những đối tượng từng được thờ phụng
  choice: Dịch là “những kẻ vốn không phải là các thần”, bảo toàn lời phủ nhận về thực tại hay bản chất của chúng.
  alternative: “những thứ thực ra không phải là thần” hoặc “những hữu thể bị gọi sai là thần”
  rationale: Cụm φύσει μὴ οὖσι θεοῖς phủ nhận rằng các đối tượng ấy thật sự là thần, nhưng không xác định chúng là tượng thần hay quyền lực ma quỷ. Bản dịch không giải quyết thay cho nguyên văn sự căng thẳng thần học này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để nói với cộng đồng tín hữu; “làm nô lệ cho” giữ hình ảnh mạnh của nguyên văn. Không cần chú thích vì phương án “trước kia” và “vốn không phải là các thần” chuyển tải đầy đủ các nét nghĩa chính mà không tạo ra một dị bản cần thiết.
