  source_fidelity: Bản dịch truyền đạt đúng tương phản χρονική của τότε μὲν qua “trước kia,” ý nghĩa quan hệ của “chưa biết Đức Chúa Trời,” và sắc thái bị lệ thuộc của ἐδουλεύσατε qua “đã làm nô lệ.” Tuy nhiên, “những kẻ” trong tiếng Việt thường quy chiếu người và vì vậy thu hẹp không cần thiết đối tượng không được nguyên văn xác định. Cần dùng một danh từ bao quát hơn để không quyết định các đối tượng ấy là người, tượng, hay quyền lực linh giới.
