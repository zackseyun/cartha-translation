id: GAL.4.13
reference: Galatians 4:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: vi
  text: Nhưng anh chị em biết rằng chính vì thân thể đau yếu mà lần đầu tôi đã rao truyền Tin Mừng cho anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì sự yếu đuối của thân xác.” Cụm từ Hy Lạp sát nghĩa là “vì sự yếu đuối/bệnh tật của xác thịt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: anh chị em biết
  rationale: οἶδα ở dạng hoàn thành nhưng mang nghĩa hiện tại; cách dịch này tự nhiên và giữ lời Phao-lô nhắc đến điều người Ga-la-ti đã biết.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một chuyển ý có sắc thái tương phản nhẹ với lập luận trước.
- source_word: ὅτι
  choice: rằng
  rationale: Từ này giới thiệu nội dung điều người Ga-la-ti biết.
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: chính vì thân thể đau yếu
  rationale: διά với đối cách chỉ nguyên nhân; ἀσθένεια có thể là sự yếu đuối hoặc bệnh tật, còn τῆς σαρκὸς xác định tình trạng thuộc thân thể. Cách diễn đạt này tự nhiên trong tiếng Việt nhưng vẫn để chú thích ghi nhận độ rộng nghĩa.
- source_word: εὐηγγελισάμην
  choice: tôi đã rao truyền Tin Mừng
  rationale: Động từ chỉ việc công bố tin mừng; cách dịch trang trọng, rõ nghĩa và quen thuộc mà vẫn giữ lực của động từ.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Dữ cách biểu thị những người tiếp nhận lời công bố. Đại từ bao gồm cả nam lẫn nữ và phù hợp lời nói với cộng đồng.
- source_word: τὸ πρότερον
  choice: lần đầu
  rationale: Trong ngữ cảnh, cụm này nhiều khả năng chỉ dịp đầu tiên Phao-lô rao giảng cho họ; đặt trước mệnh đề động từ tạo câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Nghĩa của σάρξ trong cụm ἀσθένειαν τῆς σαρκὸς
  choice: thân thể, theo nghĩa thể chất
  alternative: sự yếu đuối theo nghĩa ẩn dụ; bản tính tội lỗi
  rationale: Ngữ cảnh kể lại hoàn cảnh Phao-lô đến rao giảng trước kia và câu kế tiếp nói đến thử thách trong thân thể ông. Vì vậy σάρξ ở đây chỉ thân thể, không phải sự bại hoại đạo đức. Tuy nhiên, bản dịch không xác định một căn bệnh cụ thể mà văn bản không nêu.
- issue: Sắc thái của ἀσθένεια
  choice: đau yếu
  alternative: bệnh tật; yếu đuối
  rationale: Từ Hy Lạp có thể chỉ bệnh hoặc tình trạng suy yếu. “Đau yếu” diễn đạt khả năng thể chất rõ ràng mà không khẳng định quá mức bản chất cụ thể của tình trạng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng người nhận thư; “Tin Mừng” viết hoa theo cách dùng phổ biến trong tiếng Việt. “Thân thể đau yếu” tránh nghĩa luân lý thường có thể bị gán nhầm cho “xác thịt”, đồng thời chú thích bảo tồn hình thức và độ mơ hồ của nguyên ngữ.
