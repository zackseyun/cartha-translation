  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của nguyên văn: người nhận đã biết, nguyên nhân là tình trạng đau yếu thuộc thân thể, Phao-lô đã rao truyền Tin Mừng cho họ trong dịp đầu tiên. “Thân thể đau yếu” diễn đạt phù hợp cụm δι’ ἀσθένειαν τῆς σαρκὸς trong ngữ cảnh thể chất, không áp đặt một chẩn đoán cụ thể. “Lần đầu” phản ánh tự nhiên τὸ πρότερον trong ngữ cảnh chuyến/ dịp rao giảng ban đầu.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có register trang trọng vừa phải. Cách gọi “anh chị em” thích hợp khi hướng đến một cộng đồng; “rao truyền Tin Mừng” là cách dùng tự nhiên trong văn cảnh Kinh Thánh tiếng Việt.
  terminology: “Tin Mừng” phản ánh εὐαγγέλιον/εὐαγγελίζομαι theo cách dùng phổ biến. Việc dùng “thân thể” trong câu chính tránh liên tưởng đạo đức không phù hợp của “xác thịt”, còn chú thích vẫn ghi nhận sát nghĩa và các khả năng từ vựng của nguyên ngữ.
