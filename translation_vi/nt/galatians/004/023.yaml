id: GAL.4.23
reference: Galatians 4:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας ⸀δι’ ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/023.yaml
  text: But the son by the servant woman was born according to the flesh[b][a], while the son by the free woman was born through promise.
translation:
  language: vi
  text: Nhưng con của nữ nô lệ đã được sinh ra theo xác thịt[a], còn con của người phụ nữ tự do thì được sinh ra nhờ lời hứa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “theo cách sinh sản tự nhiên của con người” hoặc “theo phương cách của con người.” Tiếng Hy Lạp: “theo xác thịt.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “qua lời hứa” hoặc “bởi lời hứa.” Cụm từ này chỉ sự sinh ra là kết quả của lời hứa, chứ không chỉ của sự sinh sản tự nhiên của con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίσκη
  choice: nữ nô lệ
  rationale: Giữ rõ thân phận lệ thuộc vốn thiết yếu trong sự đối lập với người phụ nữ tự do; tự nhiên và chính xác hơn các cách nói giảm nhẹ như “đầy tớ gái” trong ngữ cảnh này.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Bảo lưu thuật ngữ then chốt σάρξ của Phao-lô và sự căng thẳng thần học, đồng thời chú thích rằng ở đây cụm từ chỉ cách sinh sản tự nhiên của con người chứ không hàm ý sự sinh ra về thể chất là tội lỗi.
- source_word: γεγέννηται
  choice: được sinh ra
  rationale: Diễn đạt tự nhiên thể bị động của động từ trong tiếng Việt, phù hợp với lời khẳng định mang tính đối chiếu.
- source_word: ἐλευθέρα
  choice: người phụ nữ tự do
  rationale: Chuyển tính từ dùng như danh từ và giữ nguyên sự đối lập về địa vị xã hội với nữ nô lệ.
- source_word: δι’ ἐπαγγελίας
  choice: bởi lời hứa
  rationale: “Bởi” diễn đạt phương tiện hoặc căn cứ dẫn đến sự ra đời; “lời hứa” tự nhiên trong tiếng Việt và theo ngữ cảnh chỉ lời Đức Chúa Trời đã hứa.
- source_word: ὁ μὲν ... ὁ δὲ
  choice: người con ... còn người con
  rationale: Bổ sung danh từ được hàm ý để câu tiếng Việt rõ ràng, đồng thời giữ cấu trúc tương phản của nguyên văn.
theological_decisions:
- issue: Sự đối lập giữa κατὰ σάρκα và δι’ ἐπαγγελίας
  choice: Giữ “theo xác thịt” đối lập với “bởi lời hứa”, và giải thích nghĩa theo ngữ cảnh trong chú thích.
  alternative: Diễn ý thành “theo cách sinh sản tự nhiên của con người” đối lập với “do lời Đức Chúa Trời hứa”.
  rationale: Cách dịch chính giữ thuật ngữ của Phao-lô và không giải quyết thay cho độc giả sự căng thẳng trong lập luận; chú thích ngăn cách hiểu sai rằng sự sinh ra về thể chất tự nó là tội lỗi.
- issue: Tác nhân hàm ẩn phía sau “lời hứa”
  choice: Không thêm “của Đức Chúa Trời” vào chính văn.
  alternative: “bởi lời hứa của Đức Chúa Trời” hoặc “do Đức Chúa Trời hứa”.
  rationale: Ngữ cảnh xác định lời hứa đến từ Đức Chúa Trời, nhưng nguyên văn chỉ có ἐπαγγελίας; không thêm tác nhân vào chính văn giúp bảo toàn độ hàm súc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Nữ nô lệ” giữ rõ địa vị xã hội; “theo xác thịt” bảo lưu ngôn ngữ đặc trưng của Phao-lô nhưng được giải thích bằng chú thích. Hai vế dùng “thì… còn…” để thể hiện rõ cấu trúc đối chiếu.
