revisions:
- from: Nhưng người con do nữ nô lệ sinh ra thì được sinh theo xác thịt[a], còn người con do người phụ nữ tự do sinh ra thì được sinh bởi lời hứa[b].
  to: Nhưng con của nữ nô lệ đã được sinh ra theo xác thịt[a], còn con của người phụ nữ tự do thì được sinh ra nhờ lời hứa[b].
  rationale: 'Sửa câu để loại bỏ sự lặp “sinh ra ... được sinh ra,” đồng thời bảo toàn đối lập của nguyên văn: người con của nữ nô lệ được sinh ra “theo xác thịt,” còn người con của người phụ nữ tự do được sinh ra “nhờ lời hứa.” Chú thích duy trì thuật ngữ Phao-lô và giải thích ngữ cảnh mà không áp đặt một cách hiểu giáo phái.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc đối chiếu μὲν...δὲ, sự đối lập giữa παιδίσκη và ἐλευθέρα, cũng như giữa κατὰ σάρκα và δι’ ἐπαγγελίας. Tuy nhiên, cách lặp “do ... sinh ra thì được sinh” làm mờ cấu trúc và không tự nhiên.
  naturalness: “Người con do nữ nô lệ sinh ra thì được sinh ra” là lặp từ không cần thiết và nặng nề trong tiếng Việt. Dùng “con của...” cùng với “được sinh ra” diễn đạt rõ ràng, tự nhiên hơn mà không đổi nghĩa.
  terminology: “Nữ nô lệ,” “người phụ nữ tự do,” và “theo xác thịt” là các lựa chọn chính xác. “Nhờ lời hứa” là cách diễn đạt phương tiện/kết quả tự nhiên hơn “bởi lời hứa,” đồng thời vẫn giữ tính cô đọng của δι’ ἐπαγγελίας.
  issues:
  - severity: medium
    issue: Lặp cấu trúc “do ... sinh ra” và “được sinh ra” trong cả hai vế.
    rationale: 'Cách viết hiện tại: “người con do nữ nô lệ sinh ra thì được sinh ra” lặp cùng một nội dung, gây gượng và kém sáng rõ. Nguyên văn chỉ nêu một động từ “đã/được sinh ra” cho mỗi đối tượng.'
  - severity: low
    issue: “Bởi lời hứa” kém tự nhiên khi diễn tả phương tiện hoặc nguyên nhân dẫn đến sự sinh ra.
    rationale: “Nhờ lời hứa” phù hợp hơn trong tiếng Việt hiện đại cho διὰ + sở hữu cách, nhưng không thêm tác nhân hay giải thích thần học vào chính văn.
