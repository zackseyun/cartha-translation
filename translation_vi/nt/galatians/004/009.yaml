id: GAL.4.9
reference: Galatians 4:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: vi
  text: Nhưng bây giờ, khi anh chị em đã biết Đức Chúa Trời—hay đúng hơn, khi đã được Đức Chúa Trời biết đến—làm sao anh chị em lại quay trở lại với những yếu tố sơ đẳng, yếu ớt và nghèo nàn[a], là những thứ mà anh chị em lại muốn một lần nữa làm nô lệ cho chúng?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Yếu tố sơ đẳng” cũng có thể được hiểu là “các linh lực nguyên tố,” “các nguyên lý căn bản” hoặc “những điều sơ đẳng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες θεόν
  choice: khi đã biết Đức Chúa Trời
  rationale: Phân từ bất định quá khứ diễn tả việc người Ga-la-ti đã bước vào mối nhận biết Đức Chúa Trời; “khi đã biết” giữ quan hệ với mệnh đề chính và tự nhiên trong tiếng Việt.
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: hay đúng hơn, được Đức Chúa Trời biết đến
  rationale: “Hay đúng hơn” thể hiện sự điều chỉnh của μᾶλλον δέ; thể bị động được giữ rõ để bảo toàn trọng tâm rằng chính Đức Chúa Trời biết đến họ.
- source_word: πῶς ἐπιστρέφετε πάλιν
  choice: sao anh chị em lại quay trở về
  rationale: “Sao… lại” truyền đạt sắc thái kinh ngạc, quở trách của câu hỏi tu từ; “quay trở về” diễn tả sự đảo chiều được nhấn mạnh bởi πάλιν.
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: những yếu tố sơ đẳng yếu ớt và nghèo nàn
  rationale: “Yếu tố sơ đẳng” đủ rộng để không quyết định στοιχεῖα chỉ là các nguyên lý căn bản hay các quyền lực nguyên tố; hai tính từ được dịch trực tiếp, bằng ngôn ngữ hiện đại.
- source_word: δουλεύειν θέλετε
  choice: muốn làm nô lệ
  rationale: Cách dịch này giữ sức nặng của hình ảnh cảnh nô lệ trong thư Ga-la-ti, thay vì làm nhẹ thành “phục vụ”.
- source_word: πάλιν ἄνωθεν
  choice: lại… từ đầu một lần nữa
  rationale: Giữ cả ý lặp lại của πάλιν lẫn sắc thái bắt đầu lại từ đầu của ἄνωθεν, dù sự lặp từ có chủ ý để phản ánh sức nhấn mạnh của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của στοιχεῖα trong Ga-la-ti 4:9
  choice: yếu tố sơ đẳng
  alternative: các linh lực nguyên tố; các nguyên lý căn bản; những điều sơ đẳng
  rationale: Từ Hy Lạp có thể chỉ các thành tố hoặc nguyên lý căn bản, và trong bối cảnh này cũng có thể hàm ý các quyền lực vũ trụ. Bản văn chính giữ cách nói tương đối mở; chú thích nêu các khả năng chính.
- issue: Sức nhấn của “được Đức Chúa Trời biết đến”
  choice: giữ nguyên thể bị động cùng lời tự sửa “hay đúng hơn”
  alternative: diễn đạt thuần túy như sự tương giao, không gợi đến sáng kiến từ phía Đức Chúa Trời
  rationale: μᾶλλον δέ thực sự điều chỉnh mệnh đề trước và đặt hành động biết của Đức Chúa Trời ở vị trí nổi bật, nhưng bản dịch không suy diễn thành một hệ thống thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho số nhiều trực tiếp; giữ câu hỏi tu từ và sự lặp có chủ ý của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ có nhiều cách hiểu.
