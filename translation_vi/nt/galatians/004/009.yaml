  source_fidelity: 'Bản dịch giữ đúng các quan hệ chính của nguyên văn: phân từ quá khứ về việc biết Đức Chúa Trời, sự tự điều chỉnh μᾶλλον δέ với thể bị động, câu hỏi tu từ πῶς, và hình ảnh bị nô dịch của δουλεύειν. Cụm πάλιν ἄνωθεν được chuyển thành “một lần nữa” trong bản sửa để diễn đạt tự nhiên ý tái lệ thuộc, không khẳng định quá mức nghĩa không chắc chắn “từ đầu”.'
  naturalness: Câu dự thảo nhìn chung hiện đại, nhưng “những yếu tố sơ đẳng yếu ớt và nghèo nàn” đặt chuỗi bổ nghĩa hơi nặng, còn “và lại muốn làm nô lệ cho chúng từ đầu một lần nữa” chưa tự nhiên. Bản sửa ngăn các tính từ bằng dấu phẩy và sắp xếp lại mệnh đề cuối cho rõ quan hệ với “những yếu tố”.
