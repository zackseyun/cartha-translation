revisions:
- from: Nhưng bây giờ, khi đã biết Đức Chúa Trời—hay đúng hơn, được Đức Chúa Trời biết đến—sao anh chị em lại quay trở về với những yếu tố sơ đẳng yếu ớt và nghèo nàn[a], và lại muốn làm nô lệ cho chúng từ đầu một lần nữa?
  to: Nhưng bây giờ, khi anh chị em đã biết Đức Chúa Trời—hay đúng hơn, khi đã được Đức Chúa Trời biết đến—làm sao anh chị em lại quay trở lại với những yếu tố sơ đẳng, yếu ớt và nghèo nàn[a], là những thứ mà anh chị em lại muốn một lần nữa làm nô lệ cho chúng?
  rationale: Bản sửa chỉ điều chỉnh cú pháp và độ tự nhiên. Cấu trúc “làm sao ... lại” bảo toàn sức quở trách của πῶς; “hay đúng hơn” và “được Đức Chúa Trời biết đến” giữ sự điều chỉnh và thể bị động; “một lần nữa” diễn đạt sự tái diễn được nhấn mạnh bởi πάλιν ἄνωθεν mà không ép ἄνωθεν phải có nghĩa không tranh cãi là “từ đầu”.
