    rationale: Việc thêm dấu phẩy giữa các tính từ và chuyển “một lần nữa” lên trước động từ làm rõ rằng sự tái nô lệ hướng đến chính các στοιχεῖα, đồng thời vẫn phản ánh sự nhấn mạnh lặp lại của πάλιν ... πάλιν ἄνωθεν.
