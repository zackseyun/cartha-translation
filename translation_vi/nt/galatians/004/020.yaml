  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: vi
  text: Nhưng ước gì tôi có thể ở với anh chị em ngay lúc này và thay đổi giọng điệu của mình[a], vì tôi bối rối về anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thay đổi giọng nói của mình”; tiếng Hy Lạp nói sát nghĩa là “thay đổi giọng nói của tôi”, nhưng trong ngữ cảnh này có lẽ chỉ việc Phao-lô thay đổi cách nói với họ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: tôi ước gì mình có thể
  rationale: Thể chưa hoàn thành của θέλω ở đây diễn tả một ước muốn hiện tại chưa thực hiện được; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái mong mỏi.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lời kêu gọi và trách cứ trước đó.
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: ở với anh chị em
  rationale: Diễn đạt tự nhiên ý hiện diện trực tiếp bên những người nhận thư.
- source_word: ἄρτι
  choice: ngay lúc này
  rationale: Giữ được sắc thái tức thời và khẩn thiết của ἄρτι.
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: thay đổi giọng nói
  rationale: Giữ hình ảnh cụ thể của φωνή, đồng thời trong tiếng Việt cụm này cũng có thể chỉ cách thức hay giọng điệu nói năng; chú thích nêu rõ khả năng nghĩa theo ngữ cảnh.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho ước muốn vừa nêu một cách rõ ràng, tự nhiên.
- source_word: ἀποροῦμαι
  choice: tôi thật bối rối
  rationale: Diễn tả tình trạng không biết phải nghĩ hay xử trí thế nào; 'thật' truyền đạt mức độ cảm xúc mà không giải quyết thay sự mơ hồ của động từ.
- source_word: ἐν ὑμῖν
  choice: về anh chị em
  rationale: Trong kết cấu với ἀποροῦμαι, cụm giới từ chỉ đối tượng hoặc phạm vi khiến Phao-lô bối rối; cách dịch này tự nhiên hơn lối dịch sát 'trong anh chị em'.
theological_decisions:
- issue: Ý nghĩa của φωνή trong ngữ cảnh
  choice: Giữ cách dịch 'giọng nói', có chú thích rằng ngữ cảnh có thể chỉ giọng điệu hoặc cách nói.
  alternative: Dịch trực tiếp là 'giọng điệu' và hiểu hoàn toàn theo nghĩa cách thức nói năng.
  rationale: φωνή theo nghĩa đen là 'tiếng/giọng nói', nhưng ngữ cảnh mục vụ gợi đến cách Phao-lô sẽ nói với họ nếu có mặt. Bản dịch chính giữ hình ảnh Hy Lạp và chú thích bảo tồn sắc thái ngữ cảnh mà không thu hẹp quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς nhằm diễn đạt cộng đồng người nhận thư theo lối tiếng Việt tự nhiên; giữ cảm xúc mục vụ qua “ước gì” và “thật bối rối”.
