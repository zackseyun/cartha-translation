  text: You are carefully observing days and months and seasons and years.
translation:
  language: vi
  text: Anh em đang cẩn thận tuân giữ các ngày, các tháng, các kỳ và các năm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh em giữ các ngày, các tháng, các thời điểm ấn định và các năm.” Danh sách này nói đến việc tuân giữ theo lịch; “các thời điểm ấn định” là một cách dịch có thể có của “các kỳ” (καιρούς).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας
  choice: các ngày
  rationale: Dịch trực tiếp danh từ số nhiều; ngữ cảnh cho thấy đây là những ngày được tuân giữ theo lịch, nhưng không thêm ý “đặc biệt” vào chính câu.
- source_word: παρατηρεῖσθε
  choice: đang cẩn thận giữ
  rationale: Thì hiện tại diễn tả hành động đang tiếp diễn; động từ mang sắc thái chăm chú, kỹ lưỡng tuân giữ. “Giữ” tự nhiên trong tiếng Việt khi nói về việc tuân thủ các ngày theo lịch tôn giáo.
- source_word: μῆνας
  choice: các tháng
  rationale: Cách dịch trực tiếp, giữ nguyên chuỗi các đơn vị thời gian.
- source_word: καιρούς
  choice: các kỳ
  rationale: “Kỳ” có thể chỉ những khoảng hoặc thời điểm xác định, phù hợp ngữ cảnh lịch biểu mà không tự ý xác định đó là các lễ hội.
- source_word: ἐνιαυτούς
  choice: các năm
  rationale: Dịch trực tiếp và giữ phần kết của chuỗi thời gian tăng dần.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ kết nối trong chuỗi; tiếng Việt không cần lặp lại mọi lần để câu tự nhiên mà vẫn bảo toàn cấu trúc liệt kê.
theological_decisions:
- issue: Có nên nói rõ đây là các kỳ tuân giữ theo lịch Do Thái hoặc lịch tôn giáo hay không
  choice: Giữ nguyên các đơn vị thời gian trong chính văn, không thêm “tôn giáo”, “thánh” hay “lễ”.
  alternative: Anh em đang cẩn thận giữ các ngày lễ, các tháng, các kỳ lễ và các năm.
  rationale: Bản Hy Lạp chỉ liệt kê các đơn vị hoặc kỳ thời gian. Ngữ cảnh hàm ý việc tuân giữ lịch tôn giáo, nhưng không nên đưa mức độ cụ thể ấy vào chính văn.
- issue: Sắc thái của παρατηρεῖσθε
  choice: đang cẩn thận giữ
  alternative: đang giữ
  rationale: Động từ có thể mang sắc thái theo dõi hoặc tuân giữ kỹ lưỡng. Cách chọn này bảo toàn sắc thái ấy mà không thêm đánh giá như “câu nệ” hoặc “khắt khe”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều theo văn mạch thư tín; “giữ” phù hợp lối nói tự nhiên về việc tuân giữ ngày hoặc kỳ. Dấu chú thích [a] xuất hiện ngay sau câu.
