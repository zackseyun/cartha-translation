  source_fidelity: Bản dịch giữ đúng thì hiện tại, ngôi thứ hai số nhiều, và chuỗi bốn hạng mục thời gian của Hy Lạp. “Giữ” có thể diễn đạt παρατηρεῖσθε trong ngữ cảnh tuân giữ lịch, nhưng thêm “tuân” làm rõ giá trị động từ mà không thêm tính từ như “lễ” hay “thánh”. “Các kỳ” vẫn để mở nghĩa của καιρούς, không đồng nhất hóa với lễ hội.
  naturalness: “Đang cẩn thận giữ” hơi gượng trong tiếng Việt hiện đại, vì “cẩn thận” thường không kết hợp tự nhiên với “giữ” theo nghĩa tuân giữ quy định. “Đang cẩn thận tuân giữ” tự nhiên và trang trọng hơn, đồng thời duy trì sắc thái kỹ lưỡng của động từ.
