  rationale: Sửa động từ mở đầu để không thêm ý ngoài nguyên ngữ; thay cách gọi về tuổi tác bằng một cách diễn đạt tự nhiên hơn trong tiếng Việt hiện đại. Giữ nguyên phép đối chiếu giữa người thừa kế và nô lệ, cũng như sắc thái nhượng bộ của phân từ “là chủ của tất cả.”
