id: GAL.4.1
reference: Galatians 4:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: vi
  text: 'Tôi nói rằng: bao lâu người thừa kế còn là người chưa thành niên[a], người ấy chẳng khác gì một nô lệ, dù người ấy là chủ của tất cả.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trẻ nhỏ.” Từ Hy Lạp νήπιος có thể chỉ một đứa trẻ còn non nớt; trong bối cảnh phép so sánh về thừa kế này, từ ấy có thể hàm ý người chưa đến tuổi trưởng thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: Tôi muốn nói rằng
  rationale: Cách nói tự nhiên để mở đầu phần giải thích; δέ mang sắc thái chuyển ý nhẹ, không nhất thiết phải dịch thành một từ đối lập riêng.
- source_word: ἐφ’ ὅσον χρόνον
  choice: bao lâu... còn
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài cho đến một giới hạn.
- source_word: ὁ κληρονόμος
  choice: người thừa kế
  rationale: Thuật ngữ tiếng Việt thông dụng và chính xác cho người sẽ nhận gia tài.
- source_word: νήπιος
  choice: trẻ vị thành niên
  rationale: Trong ví dụ pháp lý về quyền thừa kế, từ này nhấn mạnh người chưa đến tuổi tự quản hơn là một độ tuổi thơ ấu cụ thể.
- source_word: οὐδὲν διαφέρει δούλου
  choice: chẳng khác gì một nô lệ
  rationale: 'Giữ nguyên sức nặng của phép so sánh: trên thực tế, người thừa kế chưa thành niên không có địa vị tự do khác với người bị lệ thuộc.'
- source_word: κύριος πάντων ὤν
  choice: dù là chủ của tất cả
  rationale: Dịch phân từ theo nghĩa nhượng bộ tự nhiên trong tiếng Việt và giữ nghịch lý giữa quyền sở hữu pháp lý với tình trạng hiện tại.
theological_decisions:
- issue: Cách dịch δοῦλος trong phép ví von của Phao-lô
  choice: nô lệ
  alternative: đầy tớ
  rationale: δοῦλος ở đây chỉ người ở trong tình trạng lệ thuộc; “nô lệ” bảo toàn sức mạnh của sự đối chiếu mà không làm nhẹ ý.
- issue: Sắc thái của νήπιος trong bối cảnh thừa kế
  choice: trẻ vị thành niên
  alternative: trẻ nhỏ
  rationale: Bối cảnh tập trung vào việc chưa đến tuổi được tự quản. Cách dịch này không xác định một độ tuổi cụ thể nhưng làm rõ chiều kích pháp lý của phép ví von.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh lặp đại từ mang giới tính không cần thiết; giữ “nô lệ” vì tình trạng lệ thuộc là trọng tâm của phép so sánh.
source_grounding:
  english_pob_role: consult_only
