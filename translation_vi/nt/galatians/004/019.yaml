  - severity: low
    issue: “Được thành hình” kém thông dụng hơn “được hình thành”.
    rationale: “Được hình thành” là cách nói hiện đại, tự nhiên hơn cho μορφωθῇ, vẫn giữ thể bị động và không diễn giải thần học.
