  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: vi
  text: Các con của tôi[a], vì các con mà tôi lại đang chịu đau đớn như trong cơn chuyển dạ[b], cho đến khi Đấng Mê-si-a[c] được hình thành trong các con[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Các con bé nhỏ của tôi”; tuy nhiên, từ Hy Lạp ở đây không nhất thiết nhấn mạnh sự bé nhỏ.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “tôi lại đang chuyển dạ vì các con.”'
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể gọi là “Đấng Christ”; Χριστός là tước hiệu nghĩa là “Đấng được xức dầu”.
    reason: alternative_rendering
  - marker: d
    text: “Trong các con” cũng có thể được hiểu là “giữa các con”, nhấn mạnh sắc thái cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: Các con của tôi
  rationale: Giữ cách xưng hô thân tình của Phao-lô mà không thêm sắc thái “bé nhỏ” vốn không được nói rõ trong τέκνα.
- source_word: οὓς
  choice: vì các con
  rationale: Đưa đại từ quan hệ đối cách vào thành ngữ sinh nở tự nhiên trong tiếng Việt, diễn tả những người mà Phao-lô đang chịu đau đớn vì họ.
- source_word: πάλιν ὠδίνω
  choice: tôi lại đang chịu cơn đau sinh nở
  rationale: Giữ cả ý lặp lại của πάλιν, thể đang diễn ra của động từ hiện tại và hình ảnh mẫu tử mạnh mẽ của ὠδίνω.
- source_word: μέχρις οὗ
  choice: cho đến khi
  rationale: Diễn đạt trực tiếp giới hạn hay mục tiêu theo thời gian của hình ảnh chuyển dạ.
- source_word: μορφωθῇ
  choice: được thành hình
  rationale: Giữ thể bị động và ý một hình thể đang được tạo nên, thay vì giải nghĩa thành một cơ chế thần học cụ thể.
- source_word: Χριστὸς
  choice: Đấng Mê-si-a
  rationale: Dịch tước hiệu Χριστός bằng cách gọi quen thuộc có nghĩa là Đấng được xức dầu; chú thích bảo lưu “Đấng Christ” như cách gọi truyền thống.
- source_word: ἐν ὑμῖν
  choice: trong các con
  rationale: Giữ nghĩa gần nhất của ἐν và số nhiều của ὑμῖν, đồng thời không loại trừ sắc thái cộng đồng “giữa các con”.
theological_decisions:
- issue: Ý nghĩa của việc Đấng Mê-si-a được thành hình trong các tín hữu
  choice: Giữ nguyên ẩn dụ “được thành hình trong các con” mà không diễn giải thành một tiến trình tín lý cụ thể.
  alternative: Hiểu là phẩm chất và sự sống của Đấng Mê-si-a hình thành trong từng người, hoặc Ngài được thành hình giữa họ với tư cách một cộng đồng.
  rationale: Câu Hy Lạp cho phép cả sắc thái nội tại lẫn cộng đồng; bản dịch giữ độ mở ấy.
- issue: Hình ảnh Phao-lô chịu đau sinh nở
  choice: Giữ nguyên hình ảnh mẫu tử táo bạo của động từ ὠδίνω.
  alternative: Diễn giải nhẹ hơn là Phao-lô đau khổ hoặc lo lắng cho họ.
  rationale: Cách diễn giải nhẹ hơn sẽ làm mất sức gợi và mối liên hệ giữa cơn chuyển dạ với việc Đấng Mê-si-a được thành hình.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nguyên lời xưng hô thân tình, ẩn dụ sinh nở, thể bị động của “được thành hình” và sự mơ hồ có chủ ý giữa nghĩa nội tại với nghĩa cộng đồng.
