language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: vi
  text: 'Vì có lời chép rằng: “Hãy vui mừng, hỡi người phụ nữ son sẻ, là người không sinh con! Hãy bật lên tiếng reo hò và kêu lớn, hỡi người không trong cơn chuyển dạ! Vì con cái của người phụ nữ cô quạnh[a] đông hơn con cái của người phụ nữ có chồng.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này cũng có thể dịch là “người phụ nữ bị bỏ rơi” hoặc “người phụ nữ bị ruồng bỏ”.
    reason: lexical_alternative
  - marker: b
    text: Trích Ê-sai 54:1.
    reason: cross_reference
lexical_decisions:
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Cách nói quen thuộc khi dẫn Kinh Thánh, diễn đạt thể hoàn thành bị động và hiệu lực còn tiếp diễn của điều đã được chép.
- source_word: Εὐφράνθητι
  choice: Hãy vui mừng
  rationale: Mệnh lệnh kêu gọi vui mừng; tự nhiên trong tiếng Việt hiện đại mà vẫn giữ giọng trang trọng của lời tiên tri.
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: hỡi người phụ nữ son sẻ, là người không sinh con
  rationale: στεῖρα được dùng như danh từ để gọi người được nói đến; cụm phân từ tiếp theo được giữ riêng nhằm bảo toàn phép song hành và sự nhấn mạnh của nguyên văn.
- source_word: ῥῆξον καὶ βόησον
  choice: Hãy cất tiếng reo hò và kêu lớn
  rationale: ῥῆξον trong thành ngữ này chỉ việc đột ngột bật lên tiếng reo, còn βόησον chỉ tiếng kêu lớn; bản dịch giữ cả hai động từ.
- source_word: ἡ οὐκ ὠδίνουσα
  choice: hỡi người không đau đẻ
  rationale: ὠδίνω nói cụ thể đến cơn đau chuyển dạ; cách dịch này rõ nghĩa và giữ nguyên hình ảnh sinh nở.
- source_word: πολλὰ τὰ τέκνα ... μᾶλλον ἢ
  choice: con cái ... đông hơn con cái
  rationale: Chuyển cấu trúc so sánh sang trật tự tiếng Việt tự nhiên, đồng thời giữ rõ đối tượng được so sánh là con cái.
- source_word: τῆς ἐρήμου
  choice: của người phụ nữ bị bỏ vắng
  rationale: ἔρημος trong ngữ cảnh nhân cách hóa có thể mang nghĩa cô quạnh, bị bỏ hoặc bị bỏ hoang; “bị bỏ vắng” giữ sắc thái hoang vắng mà không đồng nhất với tình trạng son sẻ.
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: của người phụ nữ có chồng
  rationale: Dịch sát cấu trúc và nghĩa của ἀνήρ trong quan hệ hôn nhân, đồng thời bảo toàn sự đối lập với người phụ nữ bị bỏ vắng.
theological_decisions:
- issue: Lời trích Cựu Ước trong bối cảnh lập luận biểu tượng của Ga-la-ti 4
  choice: Dịch thẳng hình ảnh của Ê-sai 54:1, không đưa sự đồng nhất biểu tượng ở văn cảnh lân cận vào chính lời trích.
  alternative: Diễn đạt rõ người phụ nữ là Sa-ra hoặc Giê-ru-sa-lem ở trên.
  rationale: Nguyên văn đánh dấu đây là lời Kinh Thánh được trích dẫn; cách giải thích biểu tượng thuộc về lập luận trong văn cảnh chứ không nằm trong từ ngữ của câu trích này.
- issue: Sắc thái của τῆς ἐρήμου
  choice: Giữ hình ảnh một người phụ nữ “bị bỏ vắng”.
  alternative: Dịch là “người phụ nữ bị ruồng bỏ”, “người phụ nữ cô quạnh” hoặc hiểu là một lần nữa nói “người son sẻ”.
  rationale: Từ Hy Lạp có phạm vi nghĩa gồm hoang vắng, bị bỏ và cô quạnh. Bản dịch tránh quyết định quá mức nguyên nhân hay tình trạng pháp lý của người phụ nữ.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng lối xưng gọi “hỡi” để giữ sắc thái thi ca-tiên tri; tránh từ cổ như “hiếm muộn” theo nghĩa quá kỹ thuật hoặc “quằn quại sinh nở” quá nặng. Các dấu chú thích [a], [b] đều hiện diện trong chính văn.
