id: GAL.4.12
reference: Galatians 4:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: vi
  text: Hãy trở nên như tôi[a], vì tôi cũng đã trở nên như anh chị em[c], thưa anh chị em[b]. Tôi nài xin anh chị em. Anh chị em chẳng làm điều gì sai trái với tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “hãy giống như tôi.”'
    reason: lexical_alternative
  - marker: b
    text: “Anh chị em” là lời gọi toàn thể cộng đồng tín hữu, gồm cả nam lẫn nữ.
    reason: cultural_note
  - marker: c
    text: 'Nguyên văn tỉnh lược động từ; cũng có thể dịch: “vì tôi cũng như anh chị em.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Γίνεσθε
  choice: Hãy trở nên
  rationale: Động từ mệnh lệnh hiện tại của γίνομαι diễn tả lời kêu gọi bước vào hoặc tiếp tục một tình trạng, nên “hãy trở nên” sát hơn “hãy là”.
- source_word: ὡς ἐγώ
  choice: như tôi
  rationale: Giữ phép so sánh ngắn gọn và tự nhiên trong tiếng Việt; tiếng Hy Lạp không nêu rõ phương diện so sánh.
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh, ὅτι tự nhiên nhất là nêu lý do cho lời kêu gọi.
- source_word: κἀγὼ ὡς ὑμεῖς
  choice: tôi cũng đã trở nên như anh chị em
  rationale: Mệnh đề Hy Lạp tỉnh lược động từ. Bổ sung “đã trở nên” từ ý của Γίνεσθε làm rõ việc Phao-lô đã đồng hóa mình với người Ga-la-ti, đồng thời ghi chú phương án “tôi cũng như anh chị em” để bảo toàn tính mơ hồ.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Đây là lời xưng hô với toàn thể cộng đồng tín hữu; “anh chị em” diễn đạt tự nhiên trong tiếng Việt cả hình thức thân tộc lẫn phạm vi bao gồm nam và nữ.
- source_word: δέομαι ὑμῶν
  choice: tôi nài xin anh chị em
  rationale: δέομαι với sở hữu cách diễn tả lời khẩn khoản; “nài xin” giữ được sức nặng tình cảm mà vẫn trang trọng, hiện đại.
- source_word: οὐδέν με ἠδικήσατε
  choice: Anh chị em chẳng làm điều gì sai trái với tôi
  rationale: Diễn đạt đầy đủ οὐδέν và tân ngữ με, giữ ý rằng họ không gây bất công hay tổn hại cho Phao-lô.
theological_decisions:
- issue: Ý nghĩa tỉnh lược của κἀγὼ ὡς ὑμεῖς
  choice: Bổ sung “đã trở nên” trong chính văn.
  alternative: “tôi cũng như anh chị em” hoặc “tôi cũng là như anh chị em”.
  rationale: Ngữ cảnh có thể gợi việc Phao-lô từng trở nên giống dân ngoại, nhưng tiếng Hy Lạp không lặp lại một động từ hữu hạn. Ghi chú phương án sát hình thức hơn để không che khuất tính tỉnh lược.
- issue: Phạm vi của ἀδελφοί
  choice: “anh chị em” trong chính văn.
  alternative: “các anh em”.
  rationale: Trong lời gửi các hội thánh, danh từ số nhiều giống đực này nhiều khả năng gọi toàn thể cộng đồng. Tiếng Việt dùng “anh chị em” tự nhiên để chỉ cộng đồng gồm cả nam lẫn nữ mà vẫn giữ hình ảnh gia đình.
- issue: Quan hệ của câu οὐδέν με ἠδικήσατε với lời khẩn khoản
  choice: Đặt thành câu riêng sau lời khẩn khoản.
  alternative: Nối bằng dấu chấm phẩy hoặc hiểu là phần tiếp theo của lời cầu xin.
  rationale: Bản Hy Lạp chuyển từ lời khẩn khoản sang câu trần thuật ở thì aorist. Cách ngắt câu này rõ ràng trong tiếng Việt nhưng không thêm một đối tượng cầu xin vốn không được phát biểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đưa lời xưng hô cùng lời khẩn khoản lên đầu để câu tiếng Việt tự nhiên, nhưng vẫn giữ đủ mọi thành tố và trình tự lập luận cơ bản. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
