  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: vi
  text: Còn Giê-ru-sa-lem ở trên cao thì tự do; thành ấy là mẹ chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc quan hệ hơn: “Còn Giê-ru-sa-lem ở trên cao thì tự do, là mẹ chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Còn
  rationale: Diễn tả sự tương phản với Giê-ru-sa-lem hiện tại ở câu trước một cách tự nhiên trong tiếng Việt.
- source_word: ἄνω
  choice: ở trên cao
  rationale: Giữ hình ảnh không gian của nguyên ngữ và sự đối lập với Giê-ru-sa-lem thuộc trần thế, không diễn giải hẹp thành chỉ 'trên trời'.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: ἐλευθέρα
  choice: tự do
  rationale: Giữ nguyên tính từ vị ngữ và mối tương phản giữa tự do với nô lệ trong văn cảnh, không thêm danh từ 'người phụ nữ' vốn không được nêu rõ tại đây.
- source_word: ἥτις
  choice: và thành ấy
  rationale: Truyền đạt quan hệ tiếp nối và làm rõ đối tượng được nhân cách hóa trong tiếng Việt; 'thành ấy' tự nhiên hơn đại từ giống cái vì tiếng Việt không có giống ngữ pháp tương ứng.
- source_word: μήτηρ
  choice: mẹ
  rationale: Giữ nguyên ẩn dụ về người mẹ, vốn là trọng tâm trong lập luận về Sa-ra, A-ga và hai Giê-ru-sa-lem.
- source_word: ἡμῶν
  choice: chúng ta
  rationale: Đại từ bao gồm người nói và cộng đồng được nói đến, phù hợp với lời Phao-lô gửi cho độc giả.
theological_decisions:
- issue: Sự nhân cách hóa của 'Giê-ru-sa-lem ở trên cao'
  choice: Dịch 'và thành ấy là mẹ chúng ta' để thể hiện rõ thành Giê-ru-sa-lem được nhân cách hóa như một người mẹ.
  alternative: 'Dịch sát cấu trúc quan hệ hơn: ''là thành vốn là mẹ chúng ta''.'
  rationale: Lập luận ẩn dụ của Phao-lô đặt Giê-ru-sa-lem ở trên cao tương ứng với người phụ nữ tự do và người mẹ. Cách dịch này làm rõ phép nhân cách hóa mà không bổ sung một cách hiểu giáo phái về danh tính của thành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Còn... thì...” làm nổi bật sự tương phản; “ở trên cao” giữ nguyên hình ảnh của nguyên ngữ; “thành ấy” tránh gán đại từ giống cái không tự nhiên trong tiếng Việt nhưng vẫn bảo toàn phép nhân cách hóa qua danh xưng “mẹ”.
