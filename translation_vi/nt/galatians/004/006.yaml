id: GAL.4.6
reference: Galatians 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: vi
  text: 'Và vì anh chị em là con[a], Đức Chúa Trời đã sai Thần Khí của Con Ngài vào lòng chúng ta[b]; Thần Khí ấy kêu lên: “A-ba, Cha!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp theo nghĩa đen là “các con trai”, chỉ địa vị của người con có quyền thừa kế; ở đây bao gồm mọi tín hữu, không chỉ nam giới.
    reason: cultural_note
  - marker: b
    text: Một số thủ bản chép “lòng anh chị em” thay vì “lòng chúng ta”.
    reason: textual_variant
  - marker: c
    text: A-ba là cách xưng hô bằng tiếng A-ram, nghĩa là “Cha”; từ này được giữ lại trong nguyên văn Hy Lạp.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: Và vì
  rationale: ὅτι nêu lý do hoặc cơ sở, còn δέ có lực nối nhẹ; “Và vì” giữ được cả hai nét nghĩa trong tiếng Việt tự nhiên.
- source_word: ἐστε
  choice: anh chị em là
  rationale: Thì hiện tại của εἰμί diễn tả địa vị hiện có của những người nhận thư. “Anh chị em” là cách xưng hô số nhiều bao gồm cả nam lẫn nữ.
- source_word: υἱοί
  choice: con
  rationale: υἱοί theo nghĩa đen là “các con trai” và trong mạch văn gắn với địa vị nhận làm con cùng quyền thừa kế. Tuy nhiên, tiếng Việt “con trai” dễ bị hiểu là chỉ nam giới; “con” trong chính văn bao gồm mọi tín hữu, còn sắc thái pháp lý của từ Hy Lạp được giữ trong chú thích.
- source_word: ἐξαπέστειλεν
  choice: đã sai
  rationale: Động từ aorist chỉ hành động Đức Chúa Trời đã thực hiện. “Đã sai” vừa tự nhiên vừa giữ được ý chủ động sai phái.
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: Thần Khí của Con Ngài
  rationale: Giữ nguyên quan hệ sở thuộc của cụm Hy Lạp và tránh diễn giải xa hơn bản văn. Viết hoa “Thần Khí” vì ngữ cảnh chỉ Thần Khí do Đức Chúa Trời sai đến.
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: vào lòng chúng ta
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt về trung tâm nội tâm của con người; “chúng ta” theo ἡμῶν của SBLGNT.
- source_word: κρᾶζον
  choice: Thần Khí ấy kêu lên
  rationale: Phân từ trung tính số ít hòa hợp với πνεῦμα, nên Thần Khí là chủ thể ngữ pháp của tiếng kêu. Lặp lại chủ thể giúp câu tiếng Việt rõ ràng mà không đổi nghĩa.
- source_word: Αββα
  choice: A-ba
  rationale: Giữ lại và phiên âm hình thức xưng hô tiếng A-ram được đặt nguyên trong câu Hy Lạp.
- source_word: ὁ πατήρ
  choice: Cha ơi
  rationale: Dù có hình thức mạo từ, cụm này mang chức năng xưng hô sau Αββα. “Cha ơi” thể hiện trực tiếp lời gọi trong tiếng Việt.
theological_decisions:
- issue: Cách dịch υἱοί trong mạch văn về nhận làm con và thừa kế
  choice: con, kèm chú thích về nghĩa đen “các con trai”
  alternative: con trai
  rationale: Phao-lô dùng ngôn ngữ địa vị con trai gắn với quyền thừa kế, nhưng đối tượng bao gồm cả tín hữu nam lẫn nữ. Bản dịch chính tránh tạo ấn tượng chỉ nói đến nam giới, đồng thời chú thích bảo tồn nét pháp lý và hình ảnh nguyên ngữ.
- issue: Dị bản đại từ sở hữu đi với “lòng”
  choice: lòng chúng ta
  alternative: lòng anh chị em
  rationale: SBLGNT được cung cấp đọc ἡμῶν, “của chúng ta”. Dị bản “của anh chị em” được ghi chú để minh bạch về chứng cứ bản văn.
- issue: Chủ thể của hành động “kêu lên”
  choice: Thần Khí là chủ thể trực tiếp
  alternative: các tín hữu kêu lên nhờ Thần Khí
  rationale: Về ngữ pháp, κρᾶζον hòa hợp với τὸ πνεῦμα. Bản dịch không loại trừ việc tín hữu dự phần trong lời xưng hô ấy, nhưng không thay chủ thể được nêu trực tiếp trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều nhằm nói rõ toàn thể cộng đồng; dùng “Con Ngài” để chỉ Con của Đức Chúa Trời. Dấu chấm phẩy làm rõ rằng “Thần Khí ấy” là chủ thể của “kêu lên”. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại từ hoặc cụm từ liên quan trong chính văn.
