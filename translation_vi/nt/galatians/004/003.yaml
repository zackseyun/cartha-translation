revisions:
- from: Cũng vậy, khi còn là con trẻ, chúng ta bị làm nô lệ dưới các nguyên lý sơ đẳng của thế gian.[a]
  to: Cũng vậy, khi còn là con trẻ, chúng ta bị nô dịch dưới quyền các nguyên lý sơ đẳng của thế gian.[a]
  rationale: Sửa nhẹ để chính văn tự nhiên hơn trong tiếng Việt mà vẫn giữ hình ảnh bị đặt dưới sự chi phối và bị nô dịch. Chú thích được điều chỉnh để trình bày cách hiểu thuộc linh đang được tranh luận mà không dùng cách gọi dễ gây ngộ nhận hoặc áp đặt một diễn giải thần học.
  reviewer_model: gpt-5.6-terra
