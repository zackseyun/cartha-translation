review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc so sánh của οὕτως καὶ, đại từ nhấn mạnh ἡμεῖς, ý tình trạng chưa trưởng thành của νήπιοι, và hình ảnh bị nô dịch của ἤμεθα δεδουλωμένοι. Cách dịch chính văn «các nguyên lý sơ đẳng của thế gian» là một lựa chọn khả dĩ cho τὰ στοιχεῖα τοῦ κόσμου và chú thích duy trì cách hiểu thay thế về các quyền lực thuộc linh.
  naturalness: «Bị làm nô lệ dưới các nguyên lý» hơi nặng tính sao phỏng và không thật trôi chảy trong tiếng Việt hiện đại. «Bị nô dịch dưới quyền các nguyên lý» diễn đạt tự nhiên hơn quan hệ lệ thuộc/chi phối của ὑπό mà vẫn giữ sức nặng của δεδουλωμένοι.
  terminology: «Con trẻ», «nô dịch», và «nguyên lý sơ đẳng» phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Trong chú thích, «các thần linh sơ đẳng» dễ gợi những thần cấp thấp hơn là nghĩa đang tranh luận của στοιχεῖα; «các quyền lực thuộc linh của thế gian» rõ hơn và không quyết định rằng đây là các hữu thể cá vị.
  issues:
  - severity: low
    issue: Cụm «bị làm nô lệ dưới các nguyên lý» chưa tự nhiên.
    rationale: Tiếng Việt thường dùng «bị nô dịch dưới quyền...» hoặc «bị bắt làm nô lệ cho...». Cách sửa vẫn phản ánh ὑπὸ ... δεδουλωμένοι.
  - severity: low
    issue: Chú thích dùng «các thần linh sơ đẳng» có thể gây hiểu sai.
    rationale: Cách nói này không phải cách diễn đạt quen thuộc cho khả năng «elemental/cosmic spiritual powers» và có thể ngụ ý một hệ cấp thần linh không có trong nguyên ngữ.
  revised_text: Cũng vậy, khi còn là con trẻ, chúng ta bị nô dịch dưới quyền các nguyên lý sơ đẳng của thế gian.[a]
