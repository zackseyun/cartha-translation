  text: οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ⸀ἤμεθα δεδουλωμένοι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/003.yaml
  text: So also we[a], when we were children, were enslaved under the elemental principles of the world.
translation:
  language: vi
  text: Cũng vậy, khi còn là con trẻ, chúng ta bị nô dịch dưới quyền các nguyên lý sơ đẳng của thế gian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các quyền lực thuộc linh của thế gian.” Từ Hy Lạp này có thể chỉ các nguyên lý hoặc yếu tố căn bản, hoặc các quyền lực thuộc linh trong vũ trụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên mối tương ứng với hình ảnh người thừa kế còn ở dưới quyền người giám hộ trong câu trước.
- source_word: ἡμεῖς
  choice: chúng ta
  rationale: Giữ đại từ ngôi thứ nhất số nhiều được nêu rõ và có tính nhấn mạnh trong tiếng Hy Lạp.
- source_word: ὅτε ἦμεν νήπιοι
  choice: khi còn là con trẻ
  rationale: Giữ ý chỉ thời gian và tình trạng chưa trưởng thành trong phép ví sánh; “con trẻ” tự nhiên hơn thuật ngữ pháp lý “vị thành niên” và không thu hẹp nghĩa thành trẻ sơ sinh.
- source_word: ὑπὸ
  choice: dưới
  rationale: Giữ hình ảnh ở dưới quyền chi phối, đồng thời phù hợp với cách dùng lặp lại của Phao-lô trong văn cảnh.
- source_word: τὰ στοιχεῖα τοῦ κόσμου
  choice: các nguyên lý sơ đẳng của thế gian
  rationale: στοιχεῖα có thể chỉ những nguyên lý hoặc yếu tố căn bản, nhưng cũng có thể gợi đến các quyền lực thần linh thuộc vũ trụ. Bản dịch chính chọn cách hiểu phi nhân cách mà không làm mất sắc thái căn bản/sơ đẳng; cách hiểu còn lại được ghi ở chú thích.
- source_word: ἤμεθα δεδουλωμένοι
  choice: bị làm nô lệ
  rationale: Truyền đạt rõ thể bị động và sức nặng của hình ảnh nô lệ, thay vì làm nhẹ thành “bị lệ thuộc”.
theological_decisions:
- issue: Ý nghĩa của τὰ στοιχεῖα τοῦ κόσμου
  choice: Dịch trong chính văn là “các nguyên lý sơ đẳng của thế gian”
  alternative: “các thần linh sơ đẳng của thế gian” hoặc “các yếu tố căn bản của vũ trụ”
  rationale: Cụm từ này còn gây tranh luận trong Ga-la-ti và Cô-lô-se. Văn cảnh về người thừa kế chưa trưởng thành dưới sự quản thúc phù hợp với cách hiểu phi nhân cách, nhưng từ ngữ cũng có thể chỉ các quyền lực thuộc thế giới thần linh. Chú thích bảo tồn sự mơ hồ và căng thẳng thần học ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Con trẻ” duy trì phép ví sánh gia đình; “bị làm nô lệ” giữ nguyên sức mạnh của ẩn dụ; chú thích trình bày nghĩa khác của στοιχεῖα mà không áp đặt một cách giải thích giáo phái.
