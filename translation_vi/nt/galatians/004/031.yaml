id: GAL.4.31
reference: Galatians 4:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: vi
  text: Vì vậy, thưa anh em[a], chúng ta không phải là con cái của người nữ nô lệ[b], nhưng là con cái của người nữ tự do.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thưa anh chị em”; từ Hy Lạp có nghĩa đen là “anh em” nhưng có thể được dùng để gọi chung một nhóm gồm cả nam và nữ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “nữ tỳ” hoặc “cô gái nô lệ”; từ Hy Lạp chỉ một người nữ ở thân phận nô lệ hoặc tôi tớ, tại đây nói về Ha-ga trong sự đối lập với Sa-ra (Ga-la-ti 4:21–31).
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Vì vậy
  rationale: Diễn tả kết luận suy ra từ lập luận mang tính ẩn dụ ở phần trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀδελφοί
  choice: thưa anh em
  rationale: Giữ hình thức thân tộc giống đực của nguyên văn trong lời xưng hô; trong ngữ cảnh, cách gọi này có thể đại diện cho cả cộng đồng gồm nam và nữ, được giải thích ở chú thích.
- source_word: οὐκ ἐσμὲν
  choice: chúng ta không phải là
  rationale: Phản ánh đúng động từ hiện tại cùng sự phủ định, không thêm ý thời gian như “không còn”.
- source_word: παιδίσκης
  choice: người nữ nô lệ
  rationale: Làm rõ giới tính và thân phận nô lệ, vốn là yếu tố thiết yếu trong sự đối lập của Phao-lô giữa Ha-ga và Sa-ra.
- source_word: τέκνα
  choice: con cái
  rationale: Thuật ngữ bao gồm cả hai giới và chỉ con cái hoặc dòng dõi, không riêng con trai.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Diễn đạt trực tiếp quan hệ tương phản giữa hai căn tính.
- source_word: τῆς ἐλευθέρας
  choice: người nữ tự do
  rationale: Tính từ giống cái được dùng như danh từ và quy chiếu về Sa-ra; cách dịch này giữ rõ sự đối lập với người nữ nô lệ.
theological_decisions:
- issue: Mức độ thể hiện rõ sự đối lập mang tính ẩn dụ giữa Ha-ga và Sa-ra
  choice: Dịch là “người nữ nô lệ” và “người nữ tự do” trong chính văn.
  alternative: “nữ tỳ ... người nữ tự do” hoặc “cô gái nô lệ ... người nữ tự do”
  rationale: Lập luận trong Ga-la-ti 4:21–31 nhấn mạnh sự đối lập giữa nô lệ và tự do; bản dịch giữ nguyên sức nặng ấy mà không thêm kết luận giáo lý ngoài văn bản.
- issue: Cách dịch ἀδελφοί khi cộng đồng được nói đến có thể gồm cả nam lẫn nữ
  choice: Giữ “anh em” trong chính văn và giải thích phạm vi đại diện trong chú thích.
  alternative: “anh chị em” hoặc “các anh chị em”
  rationale: Cách này bảo toàn hình thức giống đực của từ Hy Lạp, đồng thời chú thích cho biết lời gọi có thể hướng đến một nhóm gồm cả nam và nữ.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. “Thưa anh em” thể hiện lời gọi trực tiếp; “người nữ nô lệ” và “người nữ tự do” duy trì sự đối xứng cùng nét tương phản trọng tâm của nguyên văn.
