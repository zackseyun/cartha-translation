id: GAL.4.24
reference: Galatians 4:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: vi
  text: 'Những điều ấy được giải thích theo lối ẩn dụ[a], vì hai người phụ nữ này là hai giao ước: một giao ước từ núi Si-na, sinh con vào thân phận nô lệ[b]; giao ước ấy là Ha-ga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều được trình bày theo lối ẩn dụ” hoặc “những điều ấy là một ẩn dụ.” Cụm từ Hy Lạp cho thấy Phao-lô đang dùng câu chuyện vừa kể theo lối ẩn dụ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sinh con vào cảnh nô lệ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Những điều ấy
  rationale: Đại từ quan hệ trung tính số nhiều chỉ về câu chuyện vừa nêu; cách diễn đạt này tự nhiên trong tiếng Việt và giữ được lực hồi chỉ.
- source_word: ἀλληγορούμενα
  choice: đang được giải thích theo nghĩa ẩn dụ
  rationale: Phân từ hiện tại bị động kết hợp với ἐστιν diễn tả việc câu chuyện được dùng hoặc giải thích theo lối ẩn dụ, không mặc nhiên phủ nhận tính lịch sử của các nhân vật.
- source_word: αὗται
  choice: hai người phụ nữ này
  rationale: Đại từ chỉ định giống cái số nhiều quy chiếu đến hai người phụ nữ vừa được nhắc đến; thêm danh từ giúp tiếng Việt rõ và tự nhiên.
- source_word: διαθῆκαι
  choice: giao ước
  rationale: Trong bối cảnh Phao-lô và núi Si-na, thuật ngữ này chỉ giao ước hơn là di chúc hay thỏa thuận thông thường.
- source_word: μία μὲν
  choice: một giao ước
  rationale: μέν mở đầu vế thứ nhất của sự tương phản được tiếp tục ở câu sau; tiếng Việt không cần dịch riêng từ này.
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: đến từ núi Si-na
  rationale: Diễn đạt nguồn gốc của giao ước bằng tiếng Việt tự nhiên.
- source_word: γεννῶσα
  choice: sinh con ra
  rationale: Giữ hình ảnh người mẹ của phân từ giống cái số ít và phù hợp với phép ẩn dụ về Ha-ga.
- source_word: εἰς δουλείαν
  choice: để làm nô lệ
  rationale: Thể hiện kết quả hoặc hướng đến tình trạng nô lệ do εἰς biểu thị, đồng thời rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: người ấy là Ha-ga
  rationale: Giữ sự đồng nhất hóa mang tính ẩn dụ với Ha-ga và quy chiếu tự nhiên đến người phụ nữ đại diện cho giao ước.
theological_decisions:
- issue: Bản chất cách Phao-lô sử dụng câu chuyện Sa-ra và Ha-ga
  choice: Câu chuyện đang được giải thích theo nghĩa ẩn dụ
  alternative: Những điều ấy là một ẩn dụ
  rationale: Cách dịch phản ánh dạng bị động của ἀλληγορούμενα và phương thức giải thích của Phao-lô, nhưng không kết luận rằng các nhân vật lịch sử là không có thật.
- issue: Sắc thái của δουλεία
  choice: tình trạng nô lệ
  alternative: cảnh tôi mọi; sự lệ thuộc
  rationale: “Nô lệ” giữ được sức nặng của sự lệ thuộc bị cưỡng buộc trong sự tương phản giữa hai giao ước.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng dễ hiểu. Dùng “giao ước,” “nô lệ,” và các tên riêng theo lối phiên âm Kinh Thánh quen thuộc; giữ hình ảnh sinh con và sự căng thẳng thần học của câu.
