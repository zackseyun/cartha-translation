id: GAL.4.7
reference: Galatians 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος ⸂διὰ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: vi
  text: Vậy, bạn không còn là nô lệ, nhưng là con trai[a]; và nếu là con trai, thì cũng là người thừa kế nhờ Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “con.” Từ Hy Lạp là “con trai,” duy trì mạch lập luận về việc được nhận làm con và hưởng gia tài; địa vị này áp dụng cho mọi người tin, cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “người thừa kế của Đức Chúa Trời nhờ Đấng Christ” (hoặc “nhờ Đấng Mê-si-a”) thay vì “người thừa kế nhờ Đức Chúa Trời.”
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Đánh dấu kết luận suy ra từ lập luận ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐκέτι εἶ
  choice: bạn không còn là
  rationale: Giữ ngôi thứ hai số ít và diễn tả rõ sự thay đổi địa vị.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Từ này chỉ địa vị bị lệ thuộc; “nô lệ” giữ được sức nặng của sự tương phản với địa vị làm con và thừa kế.
- source_word: ἀλλὰ υἱός
  choice: nhưng là con trai
  rationale: Giữ nghĩa giống đực của υἱός và mạch pháp lý về quyền làm con, quyền thừa kế; chú thích làm rõ rằng địa vị này áp dụng cho mọi tín hữu.
- source_word: εἰ δὲ υἱός
  choice: và nếu là con
  rationale: Tiếp nối bước kế trong lập luận. Ở lần nhắc lại, “con” tránh cách diễn đạt nặng nề mà vẫn quy chiếu rõ về “con trai” phía trước.
- source_word: καὶ κληρονόμος
  choice: thì cũng là người thừa kế
  rationale: Diễn đạt tự nhiên quan hệ hệ quả và giữ chủ đề thừa kế của đoạn văn.
- source_word: διὰ θεοῦ
  choice: nhờ Đức Chúa Trời
  rationale: Với sở hữu cách, διά có thể diễn tả trung gian hoặc tác nhân. “Nhờ Đức Chúa Trời” tự nhiên trong tiếng Việt và không thêm “Đấng Christ,” vốn chỉ xuất hiện trong các dị bản.
theological_decisions:
- issue: Ngôn ngữ chỉ địa vị làm con trong υἱός
  choice: con trai
  alternative: con cái
  rationale: “Con trai” bảo tồn hình ảnh pháp lý về người con có quyền thừa kế trong thế giới của Phao-lô. Chú thích ngăn cách hiểu sai rằng lời này chỉ dành cho nam giới.
- issue: Cách đọc ở cuối câu
  choice: nhờ Đức Chúa Trời
  alternative: người thừa kế của Đức Chúa Trời nhờ Đấng Christ/Đấng Mê-si-a
  rationale: Bản văn SBLGNT được cung cấp đọc διὰ θεοῦ. Bản dịch chính theo cách đọc này, còn dị bản đáng chú ý được ghi ở chú thích.
- issue: Sắc thái của διά với sở hữu cách
  choice: nhờ Đức Chúa Trời
  alternative: qua Đức Chúa Trời
  rationale: “Nhờ” diễn đạt tự nhiên phương tiện hoặc tác nhân trong tiếng Việt mà không quyết định quá mức sắc thái thần học của cụm từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bạn” để giữ ngôi thứ hai số ít của εἶ; dùng “Đức Chúa Trời” theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt. Cấu trúc đối lập “không còn… nhưng…” và chuỗi hệ quả “nếu… thì cũng…” được giữ rõ.
