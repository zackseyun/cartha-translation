  source_fidelity: Bản dịch theo đúng mạch suy luận của ὥστε, sự đối lập δοῦλος/υἱός, và cách đọc SBLGNT διὰ θεοῦ. “Nô lệ,” “con trai,” “người thừa kế,” và “nhờ Đức Chúa Trời” đều chuyển tải trung thành các thuật ngữ chính. Tuy nhiên, lần lặp lại của υἱός nên được dịch nhất quán là “con trai,” thay vì chuyển thành “con,” để không làm mờ thuật ngữ mà chú thích a đang giải thích.
