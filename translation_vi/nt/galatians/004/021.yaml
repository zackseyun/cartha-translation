base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: vi
  text: 'Hãy nói cho tôi biết, hỡi những người muốn ở dưới luật pháp: anh chị em không nghe luật pháp sao?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh chị em không lắng nghe luật pháp sao?” Động từ Hy Lạp có thể mang nghĩa “nghe” hoặc “lắng nghe, chú ý đến.” Ở đây, “luật pháp” có lẽ chỉ luật Môi-se, đặc biệt là trình thuật Kinh Thánh mà Phao-lô viện dẫn ngay sau đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: Hãy nói cho tôi biết
  rationale: Mệnh lệnh hiện tại số nhiều mở đầu một lời chất vấn trực tiếp. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được lực kêu gọi người nghe trả lời.
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: những người muốn ở dưới luật pháp
  rationale: Giữ hình ảnh pháp lý–giao ước của ὑπὸ νόμον, đồng thời diễn đạt cấu trúc phân từ có mạo từ bằng một cụm chỉ nhóm người tự nhiên trong tiếng Việt.
- source_word: νόμον / τὸν νόμον
  choice: luật pháp
  rationale: Dùng cùng một thuật ngữ ở cả hai lần để giữ phép chơi ý của Phao-lô giữa việc ở dưới luật pháp và nghe chính luật pháp; ngữ cảnh cho phép hiểu là luật Môi-se và phần Kinh Thánh chứa luật ấy mà không buộc bản dịch phải giải nghĩa quá sớm.
- source_word: οὐκ ἀκούετε
  choice: không nghe ... sao?
  rationale: ἀκούω có thể chỉ nghe hoặc nghe theo/chú ý. 'Nghe' giữ được sự mơ hồ chân thực của nguyên ngữ và phù hợp với việc Phao-lô sắp viện dẫn lời Kinh Thánh.
theological_decisions:
- issue: Ý nghĩa của 'luật pháp'
  choice: Giữ 'luật pháp' ở cả hai lần, không thêm 'Môi-se' hay 'Kinh Thánh' vào chính văn.
  alternative: Dịch lần thứ hai là 'Luật Môi-se' hoặc 'sách Luật pháp'.
  rationale: 'Lập luận dựa trên sự căng nghĩa của νόμος: vừa là thẩm quyền hay phạm vi người Ga-la-ti muốn ở dưới, vừa là bản văn Kinh Thánh họ cần nghe. Việc giải thích cụ thể hơn được dành cho chú thích.'
- issue: Sắc thái của ἀκούετε
  choice: Dịch là 'nghe' để giữ cả nghĩa tiếp nhận lời nói lẫn chú tâm đến lời ấy.
  alternative: Dịch là 'nghe theo' hoặc 'lắng nghe'.
  rationale: '''Nghe theo'' có thể khẳng định quá rõ ý vâng phục, còn nguyên ngữ vẫn cho phép nghĩa đơn giản là nghe điều luật pháp nói.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ 'anh chị em' làm rõ rằng lời chất vấn hướng đến cộng đồng độc giả; cấu trúc 'ở dưới luật pháp' được giữ vì là hình ảnh then chốt trong lập luận của thư Ga-la-ti.
