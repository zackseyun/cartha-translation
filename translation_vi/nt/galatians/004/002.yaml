id: GAL.4.2
reference: Galatians 4:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: vi
  text: nhưng ở dưới quyền những người giám hộ và những người quản lý gia sản[a] cho đến thời điểm cha mình đã ấn định[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người quản gia”; từ Hy Lạp chỉ những người quản lý một gia đình hoặc gia sản.
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát hơn: “cho đến thời điểm của người cha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Liên từ nghịch ý nối với câu trước, làm nổi bật sự tương phản giữa địa vị người thừa kế và tình trạng thực tế khi còn thơ ấu.
- source_word: ὑπὸ
  choice: ở dưới quyền
  rationale: Diễn đạt tự nhiên ý chịu sự quản lý và giám sát của những người được nêu tiếp theo.
- source_word: ἐπιτρόπους
  choice: những người giám hộ
  rationale: Chỉ những người được giao trách nhiệm trông nom một người chưa trưởng thành.
- source_word: οἰκονόμους
  choice: những người quản lý gia sản
  rationale: Chỉ những người quản lý công việc trong nhà hoặc tài sản; cách dịch này phân biệt vai trò ấy với người giám hộ.
- source_word: ἄχρι τῆς προθεσμίας
  choice: cho đến thời điểm ... đã ấn định
  rationale: Truyền đạt giới hạn thời gian và ý về một thời điểm được xác định từ trước.
- source_word: τοῦ πατρός
  choice: cha mình
  rationale: Trong hình ảnh về người thừa kế, sở hữu từ hồi chỉ người cha của chủ thể; cấu trúc cả câu cho thấy cha là người ấn định thời điểm.
theological_decisions:
- issue: Cách hiểu sở hữu cách τοῦ πατρός
  choice: 'Hiểu người cha là người ấn định thời điểm: “thời điểm cha mình đã ấn định.”'
  alternative: 'Dịch sát hình thức hơn: “thời điểm của người cha.”'
  rationale: Ngữ cảnh pháp lý-gia đình về người thừa kế chưa trưởng thành ủng hộ cách hiểu người cha xác định thời hạn, nhưng chú thích vẫn ghi nhận cấu trúc Hy Lạp có thể được thể hiện sát hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Gia sản” phù hợp với ngữ cảnh người thừa kế, còn “ở dưới quyền” giữ được sắc thái lệ thuộc vào thẩm quyền. Đại từ “mình” nối tự nhiên người cha với người thừa kế được nhắc ở câu trước.
