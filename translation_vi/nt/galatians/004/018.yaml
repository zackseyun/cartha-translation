  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của câu Hy Lạp: δὲ được giữ bằng “Nhưng”; ζηλοῦσθαι được hiểu theo thể bị động, phù hợp sát ngữ cảnh câu 17; ἐν καλῷ được diễn đạt là “vì mục đích tốt”; πάντοτε và mệnh đề thời gian cuối câu đều được chuyển tải đầy đủ. Việc thêm “người khác” làm rõ chủ thể hàm ẩn của thể bị động mà không thêm ý nghĩa đáng kể.'
