id: GAL.4.18
reference: Galatians 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: vi
  text: Nhưng được người khác nhiệt thành quan tâm vì mục đích tốt thì lúc nào cũng là điều tốt[b][a], chứ không phải chỉ khi tôi có mặt bên anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhiệt thành” hoặc “bày tỏ lòng nhiệt thành.” Động từ nguyên mẫu Hy Lạp ζηλοῦσθαι có thể được hiểu theo nhiều cách, nhưng nghĩa bị động phù hợp với sự tương phản ngay trước đó, nơi những người kia nhiệt tình theo đuổi tín hữu Ga-la-ti.'
    reason: alternative_reading
  - marker: b
    text: 'Sát nghĩa: “trong một điều tốt.” Cụm từ này có lẽ nói đến động cơ tốt hoặc mục đích tốt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: là điều tốt
  rationale: Tính từ vị ngữ đi với động từ nguyên mẫu; tiếng Việt tự nhiên cần diễn đạt thành “là điều tốt”.
- source_word: δὲ
  choice: Nhưng
  rationale: Giữ nét tương phản với động cơ không tốt của những người được nói đến ở câu trước.
- source_word: ζηλοῦσθαι
  choice: được người khác nhiệt thành quan tâm
  rationale: Giữ nghĩa bị động của động từ và nét nghĩa nhiệt thành, phù hợp với sự tương phản trực tiếp với việc những người kia nhiệt tình theo đuổi tín hữu Ga-la-ti trong câu 17.
- source_word: ἐν καλῷ
  choice: vì mục đích tốt
  rationale: Diễn đạt tự nhiên ý nghĩa đạo đức của điều hoặc động cơ tốt, đồng thời có chú thích về nghĩa đen rộng hơn.
- source_word: πάντοτε
  choice: lúc nào cũng
  rationale: Tự nhiên trong tiếng Việt hiện đại và làm rõ sự đối lập với “chỉ khi” ở vế sau.
- source_word: καὶ μὴ μόνον
  choice: chứ không phải chỉ
  rationale: Diễn đạt tự nhiên quan hệ bổ sung nhưng có tính giới hạn trong câu.
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: khi tôi có mặt bên anh chị em
  rationale: Cấu trúc nguyên mẫu có mạo từ với ἐν mang ý nghĩa thời gian; bản dịch giữ sự tương phản giữa lúc Phao-lô hiện diện và vắng mặt.
theological_decisions:
- issue: Thể và chủ thể ngầm của ζηλοῦσθαι
  choice: 'Hiểu theo thể bị động: các tín hữu Ga-la-ti được người khác nhiệt thành quan tâm hoặc theo đuổi'
  alternative: 'Hiểu theo nghĩa trung gian/chủ động: nhiệt thành hoặc bày tỏ lòng nhiệt thành'
  rationale: 'Ngữ cảnh gần ở câu 17 dùng cùng nhóm từ để nói về việc những người khác nhiệt tình theo đuổi tín hữu Ga-la-ti. Cách hiểu bị động khiến câu 18 trở thành đối ứng tích cực: được theo đuổi nhiệt thành là tốt nếu nhằm mục đích tốt. Tuy nhiên, vì hình thức Hy Lạp có thể được hiểu khác, phương án kia được giữ trong chú thích.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” diễn đạt số nhiều ὑμᾶς theo lối bao quát, phù hợp lời Phao-lô nói với cả cộng đồng. Thứ tự dấu chú thích [b][a] đặt ngay sau cụm mà cả hai chú thích cùng giải thích, theo lớp tham khảo đã được thẩm định.
