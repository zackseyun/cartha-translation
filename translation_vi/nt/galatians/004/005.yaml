  text: ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/005.yaml
  text: so that he might redeem those under the law[a], so that we might receive adoption as sons.
translation:
  language: vi
  text: để chuộc những người ở dưới luật pháp, để chúng ta nhận được địa vị làm con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự nhận làm con.” Từ Hy Lạp theo nghĩa đen là “sự đặt làm con trai,” nhấn mạnh địa vị trọn vẹn của người con và quyền thừa kế; ở đây bao gồm mọi người tin, cả nữ lẫn nam.'
    reason: Làm rõ sắc thái “con trai” và thừa kế của υἱοθεσία trong bối cảnh cổ đại mà không tạo hàm ý rằng chỉ nam giới được bao gồm.
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ rõ ý chỉ mục đích trong cả hai mệnh đề, đồng thời tự nhiên và gọn trong tiếng Việt hiện đại.
- source_word: τοὺς ὑπὸ νόμον
  choice: những người ở dưới luật pháp
  rationale: Diễn đạt cụm danh từ chỉ những người thuộc quyền chi phối của luật pháp; ngữ cảnh Ga-la-ti hướng trước hết đến Luật Môi-se.
- source_word: ἐξαγοράσῃ
  choice: chuộc
  rationale: Giữ được sắc thái giải thoát bằng việc trả giá của động từ, đồng thời phù hợp với ngôn ngữ Kinh Thánh quen thuộc mà vẫn dễ hiểu.
- source_word: τὴν υἱοθεσίαν
  choice: địa vị làm con
  rationale: Truyền đạt việc được lập làm con cùng địa vị và quyền thừa kế, tránh khiến độc giả hiểu đơn thuần là thủ tục nhận con nuôi theo nghĩa hiện đại.
- source_word: ἀπολάβωμεν
  choice: chúng ta nhận được
  rationale: Diễn đạt tự nhiên ý tiếp nhận điều được ban; ngữ cảnh không đòi hỏi sắc thái 'nhận lại' của tiền tố.
theological_decisions:
- issue: Sắc thái giới tính và quyền thừa kế trong υἱοθεσία
  choice: địa vị làm con
  alternative: được nhận làm con trai; sự nhận làm con nuôi
  rationale: Cách dịch chính văn bao gồm cả nam lẫn nữ, nhưng vẫn nhấn mạnh địa vị trong gia đình; chú thích bảo tồn sắc thái pháp lý-văn hóa về địa vị người con trai và quyền thừa kế.
- issue: Đối tượng của cụm 'những người ở dưới luật pháp'
  choice: Giữ nguyên cách nói 'ở dưới luật pháp' mà không giải nghĩa ngay trong chính văn
  alternative: những người phải phục dưới Luật Môi-se
  rationale: Ngữ cảnh chủ yếu hướng đến những người ở dưới Luật Môi-se, nhưng cách dịch sát hơn bảo tồn cách diễn đạt và độ mở trong lập luận của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “luật pháp” theo cách gọi quen thuộc đối với Luật Môi-se; “địa vị làm con” tránh sắc thái có thể quá hẹp của “con nuôi” trong tiếng Việt hiện nay.
