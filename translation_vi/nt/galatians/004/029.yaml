id: GAL.4.29
reference: Galatians 4:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: vi
  text: Nhưng như lúc bấy giờ, người được sinh ra theo xác thịt[a] đã bắt bớ người được sinh ra theo Thánh Linh[b], thì bây giờ cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người được sinh ra theo phương cách tự nhiên của con người”; nguyên văn là “người được sinh ra theo xác thịt.”
    reason: lexical_alternative
  - marker: b
    text: Dịch sát là “người theo Thánh Linh”; cụm từ “được sinh ra” được bổ sung từ vế trước để làm rõ sự song song.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản với phần giải thích ngay trước đó một cách ngắn gọn và tự nhiên.
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: như lúc bấy giờ ... thì bây giờ cũng vậy
  rationale: Giữ cấu trúc so sánh tương ứng và sự đối chiếu về thời gian trong nguyên văn, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ὁ ... γεννηθεὶς
  choice: người được sinh ra
  rationale: Chuyển phân từ thụ động dùng như danh từ thành một cụm danh từ rõ ràng trong tiếng Việt.
- source_word: κατὰ σάρκα
  choice: theo xác thịt
  rationale: Giữ hình ảnh và sự đối xứng trong lập luận của Phao-lô; ở đây cụm từ nói đến sự sinh ra theo phương cách tự nhiên của con người, chứ không nhất thiết hàm ý bản tính tội lỗi.
- source_word: ἐδίωκε
  choice: đã bắt bớ
  rationale: Diễn đạt hành động thù nghịch trong bối cảnh quá khứ; “bắt bớ” vừa chính xác vừa quen thuộc trong văn cảnh Kinh Thánh.
- source_word: τὸν κατὰ πνεῦμα
  choice: người được sinh ra theo Thánh Linh
  rationale: Bổ sung “được sinh ra” từ vế đầu để làm rõ cấu trúc song song trong tiếng Việt, đồng thời dùng chú thích để ghi nhận lối diễn đạt rút gọn của nguyên văn.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Trong văn cảnh Ga-la-ti và sự tương phản với xác thịt, từ này chỉ Thánh Linh của Đức Chúa Trời; viết hoa thể hiện nhận định theo văn cảnh.
- source_word: νῦν
  choice: bây giờ
  rationale: Giữ nguyên sự nối kết giữa khuôn mẫu trong quá khứ và tình trạng ở thời Phao-lô.
theological_decisions:
- issue: Ý nghĩa của κατὰ σάρκα trong sự đối chiếu giữa Ích-ma-ên và Y-sác
  choice: Chỉ sự sinh ra theo phương cách tự nhiên của con người
  alternative: Sinh ra theo bản tính tội lỗi hoặc theo lối thế tục
  rationale: Văn cảnh Ga-la-ti 4:23, 29 đối chiếu sự sinh ra tự nhiên với sự sinh ra gắn liền với lời hứa và Thánh Linh. Bản dịch giữ “xác thịt” để bảo toàn từ ngữ và mối liên hệ trong lập luận, còn chú thích giúp tránh cách hiểu thuần túy đạo đức.
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: tinh thần con người hoặc một nguyên lý thuộc linh
  rationale: Trong lập luận giao ước và lời hứa ở Ga-la-ti, sự đối chiếu với xác thịt hướng đến Thánh Linh của Đức Chúa Trời, dù cấu trúc “theo Thánh Linh” vẫn được giữ để không thu hẹp κατά thành ý nghĩa công cụ đơn thuần.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Bản dịch giữ các cụm từ then chốt “theo xác thịt” và “theo Thánh Linh” nhằm bảo toàn cấu trúc đối chiếu của nguyên văn, đồng thời dùng chú thích để giải thích nghĩa và phần tỉnh lược.
