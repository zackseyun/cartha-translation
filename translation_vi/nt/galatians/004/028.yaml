  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: vi
  text: Còn anh chị em[a], cũng như Y-sác, là con cái của lời hứa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng từ “anh em” ở dạng giống đực số nhiều để gọi đại diện cả hội chúng, có lẽ bao gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều được thể hiện tự nhiên qua cách xưng hô với cả hội chúng; chủ ngữ được nêu rõ nhằm giữ sắc thái nhấn mạnh.
- source_word: δέ
  choice: còn
  rationale: Diễn tả sự chuyển ý và đối chiếu nhẹ với phần lập luận ngay trước đó, tự nhiên hơn trong văn cảnh tiếng Việt.
- source_word: ἀδελφοί
  choice: anh chị em
  rationale: Danh từ hô cách giống đực số nhiều có chức năng đại diện khi Phao-lô nói với hội chúng; tiếng Việt hiện đại dùng “anh chị em” để truyền đạt rõ phạm vi bao gồm cả nam lẫn nữ.
- source_word: κατὰ Ἰσαὰκ
  choice: cũng như Y-sác
  rationale: κατά ở đây chỉ sự tương ứng theo kiểu mẫu; “cũng như Y-sác” diễn đạt tự nhiên việc các tín hữu được ví với Y-sác.
- source_word: ἐπαγγελίας
  choice: của lời hứa
  rationale: Giữ cấu trúc thuộc cách và cách diễn đạt thần học đặc trưng “con cái của lời hứa”, thay vì diễn giải thành “những người con đã được hứa”.
- source_word: τέκνα
  choice: con cái
  rationale: Danh từ số nhiều không nhấn mạnh giới tính, nói đến địa vị và mối quan hệ thuộc gia đình; “con cái” vừa chính xác vừa tự nhiên.
- source_word: ἐστέ
  choice: là
  rationale: Động từ ‘là’ ở ngôi thứ hai số nhiều liên kết người nghe với vị ngữ “con cái của lời hứa”.
theological_decisions:
- issue: Sự đồng nhất các tín hữu với Y-sác trong lập luận ẩn dụ của Phao-lô
  choice: “cũng như Y-sác, là con cái của lời hứa”
  alternative: “là những người con được hứa như Y-sác”
  rationale: Bản dịch giữ Y-sác làm kiểu mẫu so sánh và “con cái của lời hứa” làm vị ngữ, qua đó bảo toàn sự tương ứng thần học mà không biến “lời hứa” thành một mô tả thụ động kém rõ nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” trong chính văn để diễn đạt tự nhiên phạm vi của lời xưng hô trong tiếng Việt; chú thích cho biết hình thức giống đực của nguyên văn. Tên Y-sác theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
