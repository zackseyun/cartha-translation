id: GAL.4.16
reference: Galatians 4:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: vi
  text: Vậy thì, có phải tôi đã trở thành kẻ thù của anh chị em vì nói thật với anh chị em[a] không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì nói một cách chân thật với anh chị em”. Phân từ Hy Lạp có thể mang nghĩa “nói thật” hoặc “nói một cách chân thật”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Vậy
  rationale: Liên từ nêu hệ quả hoặc kết luận từ mạch lập luận trước; “Vậy” tự nhiên trong câu hỏi tu từ tiếng Việt.
- source_word: ἐχθρὸς ὑμῶν
  choice: kẻ thù của anh chị em
  rationale: Diễn đạt rõ cách dùng danh từ hóa của ἐχθρός cùng đại từ sở hữu số nhiều, không làm nhẹ sắc thái đối nghịch.
- source_word: γέγονα
  choice: tôi đã trở thành
  rationale: Thì hoàn thành của γίνομαι chỉ một sự chuyển biến dẫn đến tình trạng hiện tại; “đã trở thành” giữ được cả biến cố lẫn kết quả.
- source_word: ἀληθεύων ὑμῖν
  choice: vì nói sự thật với anh chị em
  rationale: Phân từ có thể chỉ phương tiện hoặc nguyên do trong câu hỏi tu từ; cách dịch này tự nhiên và giữ ý Phao-lô nói điều chân thật trực tiếp với họ.
theological_decisions:
- issue: Ý nghĩa của ἀληθεύων trong lời chất vấn của Phao-lô
  choice: Phao-lô hỏi liệu việc ông nói sự thật với người Ga-la-ti có khiến ông trở thành kẻ thù của họ hay không.
  alternative: Phao-lô hỏi liệu việc ông cư xử chân thật với họ nói chung có khiến ông trở thành kẻ thù hay không.
  rationale: Ngữ cảnh gần nói đến lời khuyên trách và kêu gọi trực tiếp. Tuy vậy, chú thích bảo lưu nghĩa rộng hơn của động từ là “nói cách chân thật”.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν/ὑμῖν, phù hợp lời trực tiếp gửi cộng đồng tín hữu; giữ hình thức câu hỏi tu từ và không giải quyết thay người đọc sắc thái nguyên nhân/phương tiện của phân từ.
