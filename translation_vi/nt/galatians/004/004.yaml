source:
  edition: SBLGNT
  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: vi
  text: Nhưng khi thời kỳ đã trọn[a], Đức Chúa Trời sai phái Con Ngài[b], sinh ra từ một người nữ[c], sinh ra dưới luật pháp[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thời gian đã trọn” hoặc “thời kỳ đã hoàn tất.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch đơn giản: “sai”; động từ Hy Lạp có sắc thái sai phái đi từ nơi mình.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sinh bởi một người nữ.” Cụm từ này nhấn mạnh sự sinh ra làm người thực sự của Con.'
    reason: lexical_alternative
  - marker: d
    text: Tức là ở dưới quyền chi phối của luật pháp Môi-se.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: Diễn đạt liên từ thời gian ὅτε cùng sắc thái chuyển ý nhẹ của δέ, phù hợp với mạch văn trước.
- source_word: ἦλθεν τὸ πλήρωμα τοῦ χρόνου
  choice: thời kỳ đã viên mãn
  rationale: Diễn đạt thời điểm đã đạt đến mức trọn vẹn hay hoàn tất; “đã” làm rõ sự kiện này xảy ra trước hành động chính.
- source_word: ἐξαπέστειλεν
  choice: sai ... đến
  rationale: Động từ ghép ἐξαποστέλλω mang ý sai phái từ nơi mình đến một nơi hay sứ mạng; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái phái đi.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Con Ngài
  rationale: Cách diễn đạt tự nhiên của sở hữu cách; viết hoa “Con” vì danh từ chỉ chính Con của Đức Chúa Trời trong ngữ cảnh.
- source_word: γενόμενον ἐκ γυναικός
  choice: sinh bởi một người nữ
  rationale: Trong kết cấu này, γενόμενον nói đến sự sinh ra thực sự, còn ἐκ chỉ nguồn gốc; “một người nữ” phản ánh danh từ số ít không có mạo từ mà không khiến câu quá cổ.
- source_word: γενόμενον ὑπὸ νόμον
  choice: sinh ra dưới luật pháp
  rationale: Lặp lại ý “sinh ra” để giữ cấu trúc song song của hai phân từ; “dưới luật pháp” giữ cách nói cô đọng của Phao-lô.
theological_decisions:
- issue: Nhân tính thật của Con trong γενόμενον ἐκ γυναικός
  choice: Dịch “sinh bởi một người nữ,” khẳng định sự sinh ra làm người thực sự.
  alternative: “đến từ một người nữ” hoặc dịch sát là “trở thành từ một người nữ”
  rationale: Trong thành ngữ này, “sinh” là cách hiểu tự nhiên của γενόμενον, đồng thời không xóa bỏ hàm ý Con đã hiện hữu trước đó trong mệnh đề “Đức Chúa Trời sai Con Ngài đến.”
- issue: Phạm vi của νόμος trong ὑπὸ νόμον
  choice: Giữ “dưới luật pháp” trong chính văn và giải thích đó là quyền chi phối của luật pháp Môi-se.
  alternative: Hiểu là ở dưới luật lệ nói chung.
  rationale: Mạch lập luận của thư Ga-la-ti đặc biệt hướng đến luật pháp Môi-se, nhưng chính văn nên giữ cách diễn đạt ngắn gọn và sức căng trong lời của Phao-lô.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “Ngài” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; tránh từ quá cổ. Giữ cấu trúc song song “sinh bởi... sinh ra dưới...” của nguyên văn, đồng thời đặt các dấu chú thích ngay sau cụm từ liên quan.
