id: GAL.4.30
reference: Galatians 4:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: vi
  text: Nhưng Kinh Thánh nói gì? “Hãy đuổi nữ nô lệ[a] và con trai nàng đi, vì con trai của nữ nô lệ chắc chắn sẽ không[c] cùng hưởng gia tài với con trai của người phụ nữ tự do.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ tỳ.” Từ Hy Lạp chỉ một người nữ có thân phận nô lệ hoặc tôi tớ; ở đây dịch là “nữ nô lệ” vì sự tương phản giữa nô lệ và tự do là trọng tâm của đoạn văn.
    reason: lexical_alternative
  - marker: b
    text: Lời trích dẫn này gợi lại Sáng Thế Ký 21:10.
    reason: cross_reference
  - marker: c
    text: 'Tiếng Hy Lạp dùng lối phủ định nhấn mạnh: “chắc chắn sẽ không”; cũng có thể dịch là “tuyệt đối sẽ không.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý tương phản với lập luận trước đó một cách tự nhiên và gọn rõ trong tiếng Việt.
- source_word: τί λέγει ἡ γραφή
  choice: Kinh Thánh nói gì?
  rationale: Giữ thì hiện tại và cách nhân cách hóa Kinh Thánh trong công thức trích dẫn; “Kinh Thánh” là cách gọi tự nhiên, có thẩm quyền trong tiếng Việt.
- source_word: Ἔκβαλε
  choice: Hãy đuổi ... đi
  rationale: Truyền đạt mệnh lệnh mạnh về việc trục xuất; mạnh hơn cách nói nhẹ như “hãy cho ... đi”.
- source_word: παιδίσκην
  choice: nữ nô lệ
  rationale: Chỉ rõ thân phận bị nô lệ hóa, vốn là yếu tố trọng tâm trong sự tương phản giữa nô lệ và tự do của đoạn văn.
- source_word: υἱὸν αὐτῆς
  choice: con trai nàng
  rationale: Phản ánh trực tiếp cấu trúc sở hữu, đồng thời tránh lặp từ nặng nề trong tiếng Việt.
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: vì ... chắc chắn sẽ không ... hưởng gia tài
  rationale: “Chắc chắn sẽ không” truyền đạt sức nhấn mạnh của phủ định οὐ μή với động từ tương lai mà không thêm nội dung diễn giải.
- source_word: κληρονομήσει
  choice: hưởng gia tài
  rationale: Là cách diễn đạt tự nhiên trong bối cảnh gia đình và quyền thừa kế; ý niệm nhận phần với tư cách người thừa kế được giữ nguyên.
- source_word: μετὰ τοῦ υἱοῦ
  choice: cùng ... với con trai
  rationale: Thể hiện sự cùng tham dự vào gia tài, đúng với μετά đi với sở hữu cách trong câu này.
- source_word: τῆς ἐλευθέρας
  choice: người phụ nữ tự do
  rationale: Bổ sung danh từ được hàm ý trong tính từ danh hóa và làm rõ sự tương phản trực tiếp với “nữ nô lệ”.
theological_decisions:
- issue: Cách dịch παιδίσκη trong lập luận về Hagar và Sara
  choice: nữ nô lệ
  alternative: nữ tỳ; người nữ làm tôi tớ
  rationale: Sự tương phản thần học trong ngữ cảnh xoay quanh thân phận nô lệ và tự do. “Nữ nô lệ” nêu rõ địa vị ấy mà không làm nhẹ nghĩa.
- issue: Mức độ dứt khoát của οὐ γὰρ μὴ κληρονομήσει
  choice: chắc chắn sẽ không ... hưởng gia tài
  alternative: tuyệt đối sẽ không ... hưởng gia tài; không đời nào được hưởng gia tài
  rationale: Giữ tính phủ định категорical của lời trích dẫn, đồng thời dùng cách nói trang trọng, tự nhiên trong tiếng Việt và không mở rộng sang một kết luận thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hưởng gia tài” được chọn thay cho lối nói chuyên biệt hoặc cổ hơn như “hưởng cơ nghiệp,” nhằm giữ rõ bối cảnh gia đình và thừa kế. Cấu trúc câu vẫn bảo toàn sự gay gắt của mệnh lệnh và sự dứt khoát của lời phủ định.
