  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: vi
  text: 'Vì có lời chép rằng Áp-ra-ham có hai con trai: một người do nữ nô lệ sinh ra, một người do người phụ nữ tự do sinh ra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt để giới thiệu điều đã được ghi trong Kinh Thánh, đồng thời giữ sắc thái thẩm quyền của công thức hoàn thành bị động.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng liên kết và nêu căn cứ cho lập luận trước đó của Phao-lô.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dạng tên riêng quen dùng trong tiếng Việt.
- source_word: δύο υἱοὺς
  choice: hai con trai
  rationale: υἱούς chỉ rõ các con là nam, nên không dịch khái quát thành 'hai người con'.
- source_word: ἔσχεν
  choice: có
  rationale: Diễn đạt tự nhiên quan hệ cha con mà không thêm sắc thái giải thích như 'sinh' hay 'làm cha'.
- source_word: ἕνα ... καὶ ἕνα
  choice: một người ... còn người kia
  rationale: Giữ cấu trúc đối xứng của nguyên văn nhưng dùng cách đối chiếu tự nhiên trong tiếng Việt.
- source_word: ἐκ
  choice: do ... sinh ra
  rationale: Trong ngữ cảnh gia phả, diễn đạt rõ nguồn gốc theo người mẹ và tự nhiên hơn cách dịch máy móc là 'từ'.
- source_word: παιδίσκης
  choice: người nữ nô lệ
  rationale: Từ này chỉ một nữ nô lệ hoặc nữ đầy tớ; 'người nữ nô lệ' làm rõ địa vị bị lệ thuộc, vốn thiết yếu cho sự tương phản nô lệ–tự do trong lập luận của Phao-lô.
- source_word: ἐλευθέρας
  choice: người nữ tự do
  rationale: Tính từ được dùng như danh từ, chỉ người phụ nữ có địa vị tự do; cách dịch này tạo thế song song rõ ràng với 'người nữ nô lệ'.
theological_decisions:
- issue: Sự tương phản về địa vị xã hội làm nền cho phép ẩn dụ của Phao-lô
  choice: Dịch παιδίσκη/ἐλευθέρα là 'người nữ nô lệ'/'người nữ tự do'.
  alternative: '''nữ đầy tớ''/''người nữ tự do'''
  rationale: Văn cảnh kế tiếp dựa trực tiếp vào sự đối lập giữa cảnh nô lệ và sự tự do. Cách dịch đã chọn giữ rõ sự đối lập ấy mà không thêm một kết luận thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu hai chấm để giới thiệu hai vế song song. Cụm 'do ... sinh ra' được lặp lại nhằm tránh mơ hồ và làm câu tiếng Việt tự nhiên; không cần chú thích vì bản dịch chính đã thể hiện đúng phạm vi nghĩa phù hợp ngữ cảnh.
