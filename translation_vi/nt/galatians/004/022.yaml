revisions:
- from: 'Vì có lời chép rằng Áp-ra-ham có hai con trai: một người do người nữ nô lệ sinh ra, còn người kia do người nữ tự do sinh ra.'
  to: 'Vì có lời chép rằng Áp-ra-ham có hai con trai: một người do nữ nô lệ sinh ra, một người do người phụ nữ tự do sinh ra.'
  rationale: 'Chỉ điều chỉnh lối diễn đạt để câu tự nhiên hơn trong tiếng Việt hiện đại. Bản sửa vẫn bảo toàn mọi thành tố ngữ nghĩa của tiếng Hy Lạp: công thức «đã chép», hai con trai, và cấu trúc song song một người từ người nữ nô lệ, một người từ người phụ nữ tự do. Không cần chú thích vì nghĩa chính trong văn cảnh đã được thể hiện rõ và không có điểm văn bản học cần đánh dấu.'
  reviewer_model: gpt-5.6-terra
