  text: φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: vi
  text: Tôi lo cho anh chị em[a], e rằng công khó tôi đã bỏ ra cho anh chị em trở nên vô ích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tôi lo về anh chị em, e rằng công khó tôi đã bỏ ra cho anh chị em trở nên vô ích.”'
    reason: Phản ánh khả năng hiểu ὑμᾶς là đối tượng trực tiếp của φοβοῦμαι; bản văn chính dùng “lo cho” để diễn đạt tự nhiên hơn nỗi lo về tình trạng của họ.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: Tôi lo
  rationale: Động từ hiện tại diễn tả nỗi lo ngại đang có của Phao-lô; “lo” tự nhiên trong tiếng Việt và không gợi rằng ông sợ chính người Ga-la-ti.
- source_word: ὑμᾶς
  choice: cho anh chị em
  rationale: Đối cách chỉ đối tượng mà Phao-lô quan tâm. Kết hợp “lo cho” truyền đạt nỗi lo về tình trạng của họ.
- source_word: μή πως
  choice: e rằng bằng cách nào đó
  rationale: Giữ sắc thái e ngại và tính bất định của mệnh đề Hy Lạp, dù cách diễn đạt hơi trang trọng.
- source_word: εἰκῇ
  choice: một cách vô ích
  rationale: Diễn đạt ý công sức có thể không đem lại kết quả; “vô ích” rõ ràng và trang trọng.
- source_word: κεκοπίακα
  choice: tôi đã nhọc công
  rationale: Thì hoàn thành chủ động nhấn mạnh công sức đã bỏ ra và hệ quả hiện tại; “nhọc công” bảo toàn sắc thái lao nhọc của κοπιάω.
- source_word: εἰς ὑμᾶς
  choice: vì anh chị em
  rationale: εἰς với người sau κοπιάω chỉ hướng hoặc đối tượng của công sức. “Vì anh chị em” tự nhiên, cho thấy công sức được bỏ ra vì lợi ích của họ mà không biến thành một mô tả thuần không gian.
theological_decisions:
- issue: Bản chất nỗi lo của Phao-lô
  choice: Câu này diễn tả nỗi lo mang tính mục vụ rằng công khó của Phao-lô dành cho người Ga-la-ti có thể hóa ra không đạt kết quả.
  alternative: Có thể hiểu yếu hơn như sự lo âu cá nhân nói chung, không nhấn mạnh nguy cơ công cuộc gây dựng họ trở nên vô ích.
  rationale: 'Cấu trúc φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα nêu cụ thể nội dung nỗi lo: công sức đã bỏ ra có nguy cơ không sinh kết quả. Bản dịch không giải thích thêm nguyên nhân thần học ngoài điều câu văn trực tiếp nói.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu số nhiều. “E rằng” giữ sắc thái lo ngại của μή πως; “nhọc công” truyền đạt cường độ của κοπιάω.
