  terminology: “Thiên sứ của Đức Chúa Trời” phù hợp với ἄγγελον θεοῦ trong phép so sánh nâng cao. “Đấng Mê-si-a Giê-su” bảo toàn chức năng tước hiệu của Χριστός và không biến câu thành lời đồng nhất Phao-lô với Đức Chúa Giê-su. “Thể xác” ở đây được hiểu đúng là tình trạng thân thể, không phải nghĩa đạo đức của σάρξ.
