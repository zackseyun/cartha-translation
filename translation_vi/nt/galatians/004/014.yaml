id: GAL.4.14
reference: Galatians 4:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: vi
  text: Dù tình trạng thể xác của tôi là một thử thách cho anh chị em[a], anh chị em đã không khinh thường hay ghê tởm tôi[b]; trái lại, anh chị em đã đón tiếp tôi như một thiên sứ của Đức Chúa Trời, như Đấng Mê-si-a Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự thử thách của anh chị em trong thân thể tôi”; cụm từ Hy Lạp có khó khăn về văn bản và cú pháp.'
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “không nhổ ra”; đây là cách diễn tả sự ghê tởm hoặc ruồng bỏ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: một thử thách
  rationale: Trong ngữ cảnh, từ này chỉ hoàn cảnh gây khó khăn do tình trạng thể xác của Phao-lô, không phải sự cám dỗ phạm tội.
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: tình trạng thể xác của tôi là một thử thách cho anh chị em
  rationale: Cách diễn đạt tự nhiên này giữ quan hệ giữa sự thử thách của người Ga-la-ti và tình trạng thể chất của Phao-lô, đồng thời chú thích bảo lưu khó khăn văn bản và cú pháp.
- source_word: ἐξουθενήσατε
  choice: khinh thường
  rationale: Diễn đạt thái độ coi rẻ hoặc xem người khác là không đáng kể.
- source_word: ἐξεπτύσατε
  choice: ghê tởm
  rationale: Truyền đạt sức biểu cảm của động từ vốn có nghĩa đen là nhổ ra hoặc nhổ vào để tỏ sự ghê tởm, ruồng bỏ.
- source_word: ἐδέξασθέ
  choice: đón tiếp
  rationale: Thể hiện sự tiếp nhận cá nhân và nồng hậu rõ hơn từ trung tính 'tiếp nhận'.
- source_word: ἄγγελον θεοῦ
  choice: một thiên sứ của Đức Chúa Trời
  rationale: Ngữ cảnh so sánh được nâng cao và song song với Đấng Mê-si-a Giê-su, nên nghĩa 'thiên sứ' thích hợp hơn nghĩa 'sứ giả' thuần túy.
- source_word: Χριστὸν Ἰησοῦν
  choice: Đấng Mê-si-a Giê-su
  rationale: Χριστός ở đây mang chức năng tước hiệu; 'Đấng Mê-si-a' truyền đạt ý nghĩa ấy thay vì phiên âm thành một tên riêng.
theological_decisions:
- issue: Ý nghĩa của hai phép so sánh 'như một thiên sứ của Đức Chúa Trời, như Đấng Mê-si-a Giê-su'
  choice: Mô tả cách người Ga-la-ti hết sức trân trọng đón tiếp Phao-lô.
  alternative: Xem lời này như đồng nhất Phao-lô với Đấng Mê-si-a.
  rationale: Hai cụm với ὡς chỉ cách thức họ đón tiếp ông, không nói Phao-lô có cùng bản thể hay chính là Chúa Giê-su.
- issue: Nghĩa của σάρξ
  choice: Tình trạng thể xác
  alternative: Bản tính tội lỗi
  rationale: Mạch văn nói đến sự yếu đuối, bệnh tật hoặc tình trạng thân thể của Phao-lô; cách hiểu theo nghĩa đạo đức không được ngữ cảnh hỗ trợ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῶν; “tình trạng thể xác” tránh khiến σάρξ bị hiểu sai là bản tính tội lỗi. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
