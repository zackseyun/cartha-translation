  source_fidelity: 'Bản dịch phản ánh đúng ý chính của câu Hy Lạp: tình trạng thể xác của Phao-lô là thử thách đối với người Ga-la-ti; họ không khinh thường hoặc ghê tởm/ruồng bỏ ông, nhưng đón tiếp ông với sự tôn trọng đặc biệt. Cách hiểu “tình trạng thể xác của tôi là một thử thách cho anh chị em” là một cách diễn đạt Việt ngữ tự nhiên cho cụm có cú pháp khó τὸν πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου, và chú thích [a] bảo lưu phương án sát chữ cùng tính khó của cụm này.'
