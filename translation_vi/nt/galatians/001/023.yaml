source:
  edition: SBLGNT
  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: vi
  text: 'Họ chỉ nghe nói rằng: “Người trước kia bắt bớ chúng ta nay rao truyền đức tin[a] mà trước kia chính người ấy từng tìm cách hủy diệt.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “Tin Mừng”; nguyên văn Hy Lạp là “đức tin”, ở đây có lẽ chỉ sứ điệp hoặc nội dung đức tin Cơ Đốc mà trước kia Phao-lô chống phá.
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνον
  choice: chỉ
  rationale: 'Diễn tả sự giới hạn: các hội thánh ấy chỉ biết Phao-lô qua lời tường thuật này.'
- source_word: ἀκούοντες ἦσαν
  choice: vẫn nghe người ta nói
  rationale: Kết cấu quanh imperfect diễn tả việc tiếp tục hoặc nhiều lần nghe tin; thêm “người ta nói” làm rõ lối dẫn lời tự nhiên trong tiếng Việt mà không xác định nguồn tin.
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: kẻ trước kia bắt bớ chúng ta
  rationale: Giữ cấu trúc phân từ danh từ hóa và sự đối lập thời gian do ποτέ nêu lên; “kẻ” phù hợp với cách cộng đồng nhận diện người từng bách hại họ.
- source_word: νῦν εὐαγγελίζεται
  choice: nay đang rao truyền
  rationale: “Rao truyền” chuyển tải hành động công bố tin mừng, còn “đang” giữ sắc thái hiện tại đối lập với hoạt động trước kia.
- source_word: τὴν πίστιν
  choice: đức tin
  rationale: Giữ từ tương ứng trực tiếp với πίστις và để ngữ cảnh cho thấy đây là đức tin theo nghĩa sứ điệp/nội dung được tin nhận, thay vì âm thầm đổi thành “Tin Mừng”.
- source_word: ἣν ποτε ἐπόρθει
  choice: mà trước kia người ấy tìm cách tiêu diệt
  rationale: πορθέω chỉ hành động tàn phá hoặc tiêu diệt; “tìm cách tiêu diệt” diễn đạt tự nhiên chiến dịch thù nghịch mà không ngụ ý ông đã thực sự tiêu diệt được đức tin ấy.
theological_decisions:
- issue: Ý nghĩa của τὴν πίστιν
  choice: “đức tin” chỉ đức tin Cơ Đốc theo nghĩa sứ điệp hoặc nội dung được tin nhận mà Phao-lô nay rao truyền
  alternative: “Tin Mừng”; hoặc hành vi chủ quan tin cậy
  rationale: 'Mạo từ và sự tương phản giữa việc trước kia tàn phá với nay rao truyền nghiêng về nghĩa khách quan: nội dung đức tin. Bản dịch vẫn giữ “đức tin” để bảo toàn phạm vi nghĩa và ghi phương án theo ngữ cảnh trong chú thích.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “trước kia… nay” để làm nổi bật sự đảo ngược trong đời Phao-lô; giữ lời dẫn trực tiếp và không giải quyết quá mức tính đa nghĩa của πίστις.
