  text: ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/020.yaml
  text: What I am writing to you—behold[a], before God[b], I am not lying.
translation:
  language: vi
  text: Còn những điều tôi viết cho anh chị em—này, trước mặt Đức Chúa Trời, tôi không nói dối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ
  choice: những điều
  rationale: Đại từ quan hệ số nhiều giống trung được dùng theo nghĩa nội dung; “những điều” tự nhiên trong tiếng Việt và giữ được sắc thái số nhiều.
- source_word: δὲ
  choice: còn
  rationale: Đánh dấu một bước chuyển nhẹ trong diễn ngôn, không nhất thiết là tương phản mạnh; “còn” phù hợp với mạch lập luận.
- source_word: γράφω ὑμῖν
  choice: tôi viết cho anh chị em
  rationale: Giữ thì hiện tại và xác định người nhận; tiếng Việt không cần hình thái tiếp diễn riêng. “Anh chị em” là cách xưng hô cộng đồng tự nhiên, bao gồm cả nam lẫn nữ.
- source_word: ἰδοὺ
  choice: này
  rationale: Biểu đạt tiểu từ gây chú ý và nhấn mạnh trang trọng, đồng thời tự nhiên hơn từ cổ “hãy xem” trong ngữ cảnh này.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ hình ảnh đứng trong sự hiện diện và chịu trách nhiệm trước Đức Chúa Trời, cùng sức nặng gần với lời xác quyết long trọng.
- source_word: ὅτι οὐ ψεύδομαι
  choice: tôi không nói dối
  rationale: ὅτι giới thiệu nội dung lời xác quyết và không cần dịch riêng trong cú pháp tiếng Việt; “tôi không nói dối” trực tiếp, tự nhiên và giữ nguyên sự phủ định mạnh.
theological_decisions:
- issue: Sức nặng của lời viện dẫn Đức Chúa Trời
  choice: Giữ cách nói “trước mặt Đức Chúa Trời” như một lời xác quyết long trọng về tính chân thật.
  alternative: Diễn đạt lỏng hơn như một từ ngữ chỉ dùng để nhấn mạnh, hoặc tăng thành một lời thề chính thức.
  rationale: Cụm Hy Lạp hàm ý Phao-lô ý thức mình ở trong sự hiện diện và dưới sự phán xét của Đức Chúa Trời, nhưng bản văn không dùng một công thức thề minh thị; vì vậy không nên làm nhẹ cũng không nên cường điệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ nhịp chuyển sang lời xác quyết mạnh; “này” tái hiện ἰδοὺ mà không dùng lối nói quá cổ. Không cần chú thích vì các sắc thái chính được thể hiện ngay trong bản dịch.
