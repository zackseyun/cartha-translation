  to: Còn những điều tôi viết cho anh chị em—này, trước mặt Đức Chúa Trời, tôi không nói dối.
  rationale: Bỏ “đây” là chỉnh sửa an toàn về độ sát nguồn và sự trôi chảy. Giữ “còn” cho δέ, “những điều” cho ἃ, “này” cho ἰδού, và cấu trúc “trước mặt Đức Chúa Trời, tôi không nói dối” để duy trì lời xác quyết long trọng mà không thêm ý thề minh thị.
