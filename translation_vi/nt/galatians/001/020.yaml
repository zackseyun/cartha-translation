  source_fidelity: 'Bản nháp chuyển đạt đúng các thành tố chính: δέ là chuyển ý nhẹ, ἃ là nội dung số nhiều, γράφω ở thì hiện tại, lời kêu gọi solemn “trước mặt Đức Chúa Trời,” và lời phủ nhận “tôi không nói dối.” Tuy nhiên, “đây” không có đối ứng rõ trong nguyên ngữ và làm lẫn với chức năng nhấn mạnh của ἰδού, vốn đã được dịch là “này.”'
