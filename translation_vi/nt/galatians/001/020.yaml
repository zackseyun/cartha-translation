  terminology: “Đức Chúa Trời” là thuật ngữ trang trọng, thông dụng trong bản dịch Kinh Thánh tiếng Việt và tương ứng với τοῦ θεοῦ. “Trước mặt” bảo tồn sắc thái chịu trách nhiệm trước Đức Chúa Trời; không biến câu này thành một công thức thề được phát biểu rõ ràng.
