source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: vi
  text: Vì tôi không nhận điều ấy từ một người nào, cũng không được dạy điều ấy, nhưng qua một sự mặc khải của Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua một sự mặc khải về Giê-su, Đấng Mê-si-a.”'
    reason: 'Bảo tồn cách hiểu sở hữu cách khách thể: Giê-su, Đấng Mê-si-a, có thể là nội dung của sự mặc khải.'
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: từ bất cứ người nào
  rationale: Danh từ số ít mang nghĩa khái quát, phủ nhận nguồn gốc hoặc sự trung gian từ con người; cách diễn đạt này tự nhiên trong tiếng Việt và không ám chỉ một cá nhân cụ thể.
- source_word: παρέλαβον
  choice: nhận
  rationale: Động từ chỉ việc tiếp nhận điều được truyền lại; “nhận” giữ được ý nghĩa trực tiếp và phù hợp với sự tương phản giữa truyền đạt bởi con người và mặc khải.
- source_word: ἐδιδάχθην
  choice: được ai dạy
  rationale: Thể bị động được diễn đạt tự nhiên trong tiếng Việt, đồng thời đại từ “ai” làm rõ tác nhân con người vốn được hàm ý trong mạch văn.
- source_word: δι’ ἀποκαλύψεως
  choice: qua sự mặc khải
  rationale: “Qua” thể hiện phương tiện; “sự mặc khải” giữ sắc thái một hành động hay biến cố bày tỏ điều vốn bị che giấu.
- source_word: Ἰησοῦ Χριστοῦ
  choice: của Giê-su, Đấng Mê-si-a
  rationale: “Đấng Mê-si-a” thể hiện Χριστός như một tước hiệu. Giới từ sở hữu “của” bám sát kết cấu sở hữu cách và không giải quyết quá mức quan hệ ngữ nghĩa; cách hiểu “về” được ghi ở chú thích.
- source_word: αὐτό
  choice: điều ấy
  rationale: Đại từ trung tính hồi chỉ Tin Mừng trong câu trước; “điều ấy” giữ liên kết hồi chỉ mà không lặp thêm danh từ không có trong câu Hy Lạp.
theological_decisions:
- issue: Quan hệ sở hữu cách trong ἀποκαλύψεως Ἰησοῦ Χριστοῦ
  choice: “sự mặc khải của Giê-su, Đấng Mê-si-a,” giữ cách diễn đạt tương đối mở nhưng thiên về nguồn/chủ thể của mặc khải
  alternative: “sự mặc khải về Giê-su, Đấng Mê-si-a,” nghĩa là Ngài là nội dung hay đối tượng được mặc khải
  rationale: Văn cảnh nhấn mạnh Tin Mừng của Phao-lô không đến từ con người, nên cách hiểu nguồn/chủ thể phù hợp với lập luận. Tuy nhiên, sở hữu cách Hy Lạp thực sự có thể chỉ đối tượng; chú thích bảo tồn khả năng này thay vì loại bỏ nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cấu trúc đối lập “không… cũng không… nhưng…” để phản ánh οὐδὲ… οὔτε… ἀλλά. Không thêm danh xưng “Chúa” vì nguyên văn tại đây không có κύριος.
