  to: Vì tôi không nhận điều ấy từ một người nào, cũng không được dạy điều ấy, nhưng qua một sự mặc khải của Giê-su, Đấng Mê-si-a.[a]
  rationale: Bản sửa biểu thị rõ αὐτό ở cả hai vế phủ định, giữ số ít khái quát của παρὰ ἀνθρώπου, và phản ánh δι’ ἀποκαλύψεως như phương tiện của việc nhận mà không thêm một động từ thứ hai. Chú thích tiếp tục bảo tồn tính mơ hồ thực sự của Ἰησοῦ Χριστοῦ.
