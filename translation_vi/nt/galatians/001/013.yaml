  rationale: Sửa nhẹ để câu văn tự nhiên hơn, làm rõ quan hệ giữa điều người đọc đã nghe và nội dung được thuật lại, diễn đạt trôi chảy mức độ nhấn mạnh của nguyên ngữ, và đặt lại neo chú thích đúng tại «tàn phá». Nghĩa và sự mơ hồ liên quan đến ἐπόρθουν được giữ nguyên.
