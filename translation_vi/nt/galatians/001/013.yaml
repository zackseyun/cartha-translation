  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: cách sống trước kia của Phao-lô trong Do Thái giáo, việc ông bắt bớ Hội Thánh của Đức Chúa Trời ở mức đặc biệt dữ dội, và hành vi tàn phá Hội Thánh. Tuy nhiên, «đã nghe nói về» tự nhiên hơn «đã nghe về», và vị trí chú thích cần gắn trực tiếp với «tàn phá», từ tương ứng ἐπόρθουν.'
