  terminology: Giữ «Do Thái giáo», «Hội Thánh của Đức Chúa Trời», và «bắt bớ» là phù hợp với ngữ cảnh và cách dùng Kinh Thánh tiếng Việt phổ thông. «Tàn phá» giữ lực nghĩa của ἐπόρθουν; chú thích bảo lưu khả năng hiểu là cố hủy diệt.
  issues:
