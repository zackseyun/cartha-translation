id: GAL.1.13
reference: Galatians 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθ’ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/013.yaml
  text: For you have heard of my former way of life in Judaism[d][c][b][a], that I was persecuting the church of God beyond measure and was ravaging it.
translation:
  language: vi
  text: Vì anh chị em đã nghe nói về cách sống trước kia của tôi trong Do Thái giáo, rằng tôi đã hết sức bắt bớ Hội Thánh của Đức Chúa Trời và tàn phá Hội Thánh ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và cố hủy diệt Hội Thánh ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: lối sống trước kia
  rationale: ἀναστροφή chỉ cách sống hoặc cách cư xử nói chung; ποτε đặt cách sống ấy vào thời kỳ trước đây của Phao-lô. Cụm tiếng Việt này tự nhiên và giữ được cả ý nghĩa lẫn sắc thái thời gian.
- source_word: Ἰουδαϊσμῷ
  choice: Do Thái giáo
  rationale: Danh từ chỉ đời sống và hệ thống tôn giáo Do Thái mà Phao-lô từng gắn bó; “Do Thái giáo” là cách gọi hiện đại, rõ ràng và trực tiếp.
- source_word: καθ’ ὑπερβολὴν
  choice: quá mức
  rationale: Cụm từ nhấn mạnh mức độ đặc biệt dữ dội của việc bắt bớ; “quá mức” ngắn gọn, tự nhiên và giữ sức nhấn mạnh.
- source_word: ἐδίωκον
  choice: đã bắt bớ
  rationale: Thì vị hoàn diễn tả hành động kéo dài hoặc lặp lại trong quá khứ. Trong tiếng Việt, ngữ cảnh cùng “đã” truyền đạt thời quá khứ tự nhiên mà không cần thêm từ gây nặng câu.
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: Hội Thánh của Đức Chúa Trời
  rationale: Trong ngữ cảnh, cụm từ chỉ cộng đồng những người thuộc về Đức Chúa Trời mà Phao-lô chống đối. “Hội Thánh” là cách diễn đạt quen thuộc và trang trọng trong tiếng Việt.
- source_word: ἐπόρθουν
  choice: tàn phá
  rationale: Động từ diễn tả sự phá hoại dữ dội và có thể bao hàm nỗ lực hủy diệt. “Tàn phá” giữ được sức mạnh của nguyên ngữ mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Dịch ἐκκλησία là “Hội Thánh” hay “cộng đồng”
  choice: Hội Thánh của Đức Chúa Trời
  alternative: cộng đồng của Đức Chúa Trời
  rationale: “Hội Thánh” nhận diện rõ cộng đồng các tín hữu mà Phao-lô bắt bớ, phù hợp cách dùng trong ngữ cảnh Tân Ước và không thêm một định nghĩa giáo phái.
- issue: Mức độ thành công hàm ý trong ἐπόρθουν
  choice: tàn phá
  alternative: cố hủy diệt
  rationale: Nguyên ngữ có thể được hiểu là đang phá hoại hoặc tìm cách tiêu diệt. Bản chính giữ hình ảnh mạnh “tàn phá”, còn chú thích nêu khả năng nhấn vào ý định để không khép lại sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμεῖς, “lối sống trước kia” cho cách diễn đạt tự nhiên, và lặp lại “Hội Thánh ấy” thay cho đại từ đơn thuần để câu tiếng Việt rõ nghĩa. Viết hoa “Hội Thánh” và dùng danh xưng “Đức Chúa Trời” theo văn phong Kinh Thánh tiếng Việt phổ thông.
