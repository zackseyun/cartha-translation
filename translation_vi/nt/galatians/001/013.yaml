  - severity: low
    issue: Dấu chú thích [a] hiện đặt ở cuối cả câu thay vì ngay sau từ được chú giải.
    rationale: Chú thích giải thích ἐπόρθουν/từ «tàn phá», nên cần gắn ngay sau từ hoặc cụm từ này để neo chú thích chính xác.
  - severity: low
