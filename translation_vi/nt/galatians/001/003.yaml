id: GAL.1.3
reference: Galatians 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸂καὶ κυρίου ἡμῶν⸃ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: vi
  text: Nguyện ân điển và bình an đến với anh chị em từ Đức Chúa Trời là Cha và từ Chúa của chúng ta là Đức Giê-su, Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đức Giê-su Ki-tô.”'
    reason: Ghi lại cách chuyển âm truyền thống của Χριστός bên cạnh cách dịch tước hiệu “Đấng Mê-si-a” trong bản chính.
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Thuật ngữ quen thuộc trong lời chúc phước thư tín, vừa diễn đạt ân huệ nhưng không do công trạng, vừa giữ chiều sâu thần học của Phao-lô.
- source_word: ὑμῖν
  choice: đến với anh chị em
  rationale: Diễn đạt tự nhiên đối tượng nhận lời chúc trong tiếng Việt; đại từ số nhiều bao quát cộng đồng tín hữu.
- source_word: εἰρήνη
  choice: bình an
  rationale: Giữ được cả sắc thái lời chào có nền tảng Do Thái lẫn ý nghĩa về sự an lành và hòa thuận do Đức Chúa Trời ban.
- source_word: ἀπό
  choice: từ
  rationale: Chỉ rõ nguồn của ân điển và bình an; việc lặp lại “từ” trước thành phần phối hợp thứ hai giúp câu tiếng Việt sáng nghĩa.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Phản ánh trật tự của văn bản Hy Lạp được cung cấp, trong đó ἡμῶν đứng với κυρίου chứ không đứng ngay sau πατρός; tránh tự ý chuyển thành “Đức Chúa Trời, Cha chúng ta”.
- source_word: κυρίου ἡμῶν
  choice: Chúa của chúng ta
  rationale: Giữ tước hiệu κύριος và liên kết đại từ sở hữu ἡμῶν với κυρίου theo vị trí cú pháp trong nguồn SBLGNT được cung cấp.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Dịch Χριστός theo lực của một tước hiệu cứu thế, đồng thời dùng cách diễn đạt tự nhiên và trang trọng trong tiếng Việt; cách gọi truyền thống “Đức Giê-su Ki-tô” được giữ ở chú thích.
theological_decisions:
- issue: Nên dịch Χριστοῦ như một tước hiệu hay giữ dạng tên gọi truyền thống
  choice: Đức Giê-su, Đấng Mê-si-a
  alternative: Đức Giê-su Ki-tô
  rationale: Trong lời chào này, Χριστός vẫn mang nội dung của tước hiệu chỉ Đấng được xức dầu. Bản chính làm rõ tước hiệu ấy, còn chú thích bảo tồn cách gọi truyền thống.
- issue: Đại từ ἡμῶν bổ nghĩa cho “Cha” hay cho “Chúa”
  choice: Chúa của chúng ta
  alternative: Đức Chúa Trời, Cha chúng ta, và Chúa Đức Giê-su
  rationale: Văn bản nguồn được cung cấp đặt ἡμῶν ngay sau κυρίου trong cụm καὶ κυρίου ἡμῶν, nên bản dịch theo liên kết cú pháp trực tiếp này thay vì theo cách sắp xếp quen thuộc của một số bản Hy Lạp hoặc bản dịch.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Nguyện … đến với” thể hiện đây là lời chúc phước chứ không chỉ một mệnh đề trần thuật. “Anh chị em” truyền đạt số nhiều ὑμῖν một cách tự nhiên và bao quát; các danh xưng thần học được viết theo quy ước Kinh Thánh tiếng Việt.
