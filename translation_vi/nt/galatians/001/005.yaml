  text: to whom be the glory forever and ever. Amen.
translation:
  language: vi
  text: Nguyện vinh quang thuộc về Ngài đời đời vô cùng. A-men.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: thuộc về Ngài
  rationale: Đại từ quan hệ ở cách dữ liệu nối lời tôn vinh với “Đức Chúa Trời, Cha chúng ta” trong câu trước; cách diễn đạt này tự nhiên trong tiếng Việt và vẫn giữ đúng quan hệ quy hướng của nguyên văn.
- source_word: δόξα
  choice: vinh quang
  rationale: “Vinh quang” là cách dịch quen thuộc và phù hợp với văn cảnh tôn vinh, không thu hẹp nghĩa thành riêng lời ca ngợi hay sự tôn kính.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Đây là thành ngữ nhấn mạnh thời gian vô tận; “đời đời vô cùng” trang trọng, dễ hiểu và quen thuộc trong lời tôn vinh bằng tiếng Việt.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ cách phiên âm quen dùng trong tiếng Việt như lời long trọng xác nhận và kết thúc lời tôn vinh.
theological_decisions:
- issue: Động từ được hiểu ngầm trong lời tôn vinh
  choice: Nguyện vinh quang thuộc về Ngài
  alternative: Vinh quang thuộc về Ngài
  rationale: Nguyên văn không có động từ hữu hạn. Thêm “Nguyện” thể hiện tự nhiên sắc thái cầu chúc, tôn vinh của công thức Hy Lạp mà không biến câu thành một khẳng định thần học chi tiết hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và có tính phụng nguyện. “Ngài” viết hoa vì chỉ Đức Chúa Trời; “A-men” dùng dạng phiên âm thông dụng.
