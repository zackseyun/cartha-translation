id: GAL.1.10
reference: Galatians 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: vi
  text: Vì giờ đây tôi đang thuyết phục người ta hay Đức Chúa Trời?[a] Hay tôi đang tìm cách làm đẹp lòng người ta? Nếu tôi vẫn còn làm đẹp lòng người ta, thì tôi đã không phải là nô lệ của Đấng Mê-si.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giờ đây tôi đang tìm sự chấp thuận của người ta hay của Đức Chúa Trời?”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đầy tớ của Đấng Ki-tô.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: giờ đây
  rationale: Diễn tả hoàn cảnh và lập luận hiện tại của Phao-lô, đồng thời gợi sự tương phản với lối sống trước kia.
- source_word: πείθω
  choice: đang thuyết phục
  rationale: 'Giữ nghĩa trực tiếp và sự mơ hồ thật của động từ: thuyết phục, tranh thủ hoặc tìm sự chấp thuận; phương án khác được ghi trong chú thích.'
- source_word: ἀνθρώπους
  choice: người ta
  rationale: Chỉ con người nói chung, không riêng nam giới, và tạo đối ứng tự nhiên với Đức Chúa Trời.
- source_word: θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt.
- source_word: ζητῶ
  choice: đang tìm cách
  rationale: Thể hiện hành động đang được xem xét trong câu hỏi tu từ và kết hợp tự nhiên với 'làm đẹp lòng'.
- source_word: ἀρέσκειν / ἤρεσκον
  choice: làm đẹp lòng
  rationale: Diễn đạt trực tiếp ý làm hài lòng hoặc chiều theo để được chấp thuận, đồng thời giữ sự lặp lại của nguyên văn.
- source_word: εἰ ἔτι
  choice: Nếu tôi vẫn còn
  rationale: Giữ điều kiện phản thực trong ngữ cảnh và hàm ý rằng đây từng là một khuynh hướng trước kia.
- source_word: Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Giữ sắc thái tước hiệu của Χριστός trong mệnh đề nhấn mạnh sự thuộc về và trung thành.
- source_word: δοῦλος
  choice: nô lệ
  rationale: Bảo toàn sức nặng của từ Hy Lạp về quyền sở hữu và sự lệ thuộc hoàn toàn, mạnh hơn 'đầy tớ'.
theological_decisions:
- issue: Ý nghĩa của πείθω với đối tượng là người ta hoặc Đức Chúa Trời
  choice: thuyết phục
  alternative: tìm sự chấp thuận của
  rationale: Bản chính giữ nghĩa từ vựng trực tiếp và nét căng thẳng của câu hỏi tu từ; chú thích cung cấp nghĩa dụng học khả dĩ mà không âm thầm quyết định thay người đọc.
- issue: Cách dịch Χριστοῦ δοῦλος
  choice: nô lệ của Đấng Mê-si
  alternative: đầy tớ của Đấng Ki-tô
  rationale: Ngữ cảnh đối lập việc làm đẹp lòng con người với sự hoàn toàn thuộc về Đấng Mê-si; 'nô lệ' giữ lực nghĩa của δοῦλος, còn 'Đấng Mê-si' làm rõ tước hiệu Χριστός.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hai câu hỏi tu từ, sự lặp lại của 'làm đẹp lòng người ta', cùng sức nặng xã hội-thần học của 'nô lệ'; không làm phẳng sự mơ hồ của πείθω.
