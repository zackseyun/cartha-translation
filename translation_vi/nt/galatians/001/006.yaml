id: GAL.1.6
reference: Galatians 1:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: vi
  text: Tôi kinh ngạc vì anh chị em nhanh chóng đến thế mà lìa bỏ Đấng đã gọi anh chị em trong ân điển của Đấng Mê-si-a[a], quay sang một tin lành khác[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi ân điển của Đấng Mê-si-a.” Giới từ Hy Lạp có thể chỉ phạm vi hoặc phương tiện.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sang một tin lành khác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: Tôi kinh ngạc
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và giữ được giọng sửng sốt, không tán thưởng, của Phao-lô.
- source_word: οὕτως ταχέως
  choice: lại nhanh chóng
  rationale: Giữ trọng tâm vào tốc độ đáng kinh ngạc của sự đổi hướng; “lại” giúp câu tiếng Việt tự nhiên và chuyển tải sắc thái trách cứ trong ngữ cảnh.
- source_word: μετατίθεσθε
  choice: lìa bỏ
  rationale: Động từ ở đây chỉ sự chuyển lòng, rời bỏ một Đấng đã gọi họ, chứ không chỉ thay đổi quan điểm; “lìa bỏ” giữ sức nặng quan hệ mà không quá khẩu ngữ.
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: Đấng đã gọi anh chị em
  rationale: Giữ chủ thể không được nêu rõ trong nguyên văn, đồng thời dùng “Đấng” vì đối tượng được hiểu là một chủ thể thần linh; thì đã hoàn thành phản ánh phân từ aorist chỉ lời gọi trước đó.
- source_word: ἐν χάριτι Χριστοῦ
  choice: trong ân điển của Đấng Mê-si
  rationale: Dịch tương đối sát cấu trúc ἐν với tặng cách và quan hệ sở hữu, đồng thời không quyết định dứt khoát liệu giới từ chỉ phạm vi hay phương tiện.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Chuyển tải nội dung tước hiệu Χριστός thay vì chỉ phiên chuyển thành một danh xưng quen dùng.
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: để theo một tin lành khác
  rationale: “Để theo” diễn đạt tự nhiên hướng chuyển sang của εἰς sau “lìa bỏ”; “khác” phản ánh ἕτερον và chuẩn bị cho sự phân biệt ở câu kế tiếp.
theological_decisions:
- issue: Danh tính của Đấng gọi trong τοῦ καλέσαντος ὑμᾶς
  choice: Không thêm “Đức Chúa Trời” hoặc “Đấng Christ” vào chính văn.
  alternative: “Đức Chúa Trời, Đấng đã gọi anh chị em” hoặc “Đấng Christ, Đấng đã gọi anh chị em”.
  rationale: Nguyên văn trực tiếp không nêu danh tính chủ thể; giữ cách diễn đạt mở tránh giải quyết thay cho văn bản một điểm có hàm ý thần học.
- issue: Sắc thái của ἐν trong ἐν χάριτι Χριστοῦ
  choice: “trong ân điển của Đấng Mê-si”
  alternative: “bởi ân điển của Đấng Mê-si”
  rationale: Giới từ có thể chỉ phạm vi hoặc phương tiện; chính văn giữ cách nói gần cấu trúc nguồn và chú thích nêu phương án còn lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho số nhiều ὑμᾶς nhằm bao quát cộng đồng; viết thường “tin lành” vì ở đây chỉ sứ điệp, còn “Đấng Mê-si” giữ rõ giá trị tước hiệu.
