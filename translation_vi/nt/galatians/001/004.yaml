  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: vi
  text: Đấng đã phó chính mình vì tội lỗi chúng ta, để giải cứu chúng ta khỏi thời đại gian ác hiện nay[a], theo ý muốn của Đức Chúa Trời là Cha chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thế gian gian ác hiện nay.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτὸν
  choice: đã phó chính mình
  rationale: Diễn đạt hành động tự nguyện hiến chính mình; “phó” giữ sắc thái trang trọng và hiến tế mà không buộc phải hiểu là có một tác nhân khác trao nộp Ngài.
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: vì tội lỗi chúng ta
  rationale: “Vì” tự nhiên trong tiếng Việt và giữ được chiều kích cứu chuộc của ὑπέρ mà không xác định quá mức cơ chế chuộc tội.
- source_word: ἐξέληται
  choice: giải cứu
  rationale: Động từ chỉ việc đưa ra khỏi hiểm nguy hoặc khỏi một hoàn cảnh đang chi phối; “giải cứu” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: thời đại gian ác hiện tại
  rationale: αἰών chủ yếu mang nghĩa thời đại hoặc kỷ nguyên; cách dịch này giữ bình diện thời gian–vũ trụ thay vì biến nó thành thế giới vật chất.
- source_word: κατὰ τὸ θέλημα
  choice: theo ý muốn
  rationale: Diễn tả sự phù hợp với ý định và mục đích của Đức Chúa Trời bằng lối nói tiếng Việt gọn, chính xác.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: của Đức Chúa Trời, là Cha chúng ta
  rationale: Làm rõ hai danh xưng cùng chỉ một Đấng, đồng thời giữ cả “Đức Chúa Trời” và “Cha chúng ta” mà không tạo cảm giác nói đến hai đối tượng.
theological_decisions:
- issue: Ý nghĩa cứu chuộc của ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: vì tội lỗi chúng ta
  alternative: thay cho chúng ta vì tội lỗi; bởi tội lỗi chúng ta
  rationale: Bản Hy Lạp mang sức nặng cứu chuộc nhưng không trình bày đầy đủ một mô hình chuộc tội cụ thể; “vì tội lỗi chúng ta” bảo toàn sức nặng ấy mà không thêm một học thuyết riêng.
- issue: Cách hiểu αἰών
  choice: thời đại gian ác hiện tại
  alternative: thế gian gian ác hiện tại
  rationale: “Thời đại” phản ánh sát nghĩa thời gian–vũ trụ của αἰών; “thế gian” là cách dịch truyền thống có thể hiểu được nhưng dễ gợi chủ yếu đến không gian hoặc thế giới vật chất.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “phó chính mình” để giữ sắc thái tự nguyện, hiến dâng; dùng “thời đại” để phản ánh αἰών chính xác hơn. Câu kết thúc bằng dấu phẩy vì đây là phần tiếp nối cú pháp từ câu trước và sang câu sau.
