id: GAL.1.15
reference: Galatians 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε δὲ ⸀εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: vi
  text: Nhưng khi Đấng đã biệt riêng tôi từ trong lòng mẹ và kêu gọi tôi nhờ ân sủng của Ngài vui lòng[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “từ khi chào đời”; so sánh ngôn ngữ về sự kêu gọi tiên tri trong Giê-rê-mi 1:5 và Ê-sai 49:1.'
    reason: Nêu cách hiểu khác của thành ngữ và chỉ ra âm hưởng liên văn bản mà không thay thế cách dịch sát hình ảnh trong chính văn.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: Giữ cả ý thời gian của ὅτε lẫn sắc thái chuyển ý nhẹ của δέ, đồng thời nối tự nhiên với mạch câu chưa kết thúc.
- source_word: εὐδόκησεν
  choice: vui lòng
  rationale: Diễn đạt ý sự hài lòng và ý muốn tốt lành của Đức Chúa Trời, không thu hẹp thành đơn thuần “quyết định”.
- source_word: ὁ ἀφορίσας με
  choice: Đấng đã biệt riêng tôi
  rationale: Giữ cấu trúc phân từ có mạo từ như một danh xưng và truyền đạt hành động dành riêng cho một mục đích, không đưa thêm khái niệm thần học như “tiền định” hay “tuyển chọn”.
- source_word: ἐκ κοιλίας μητρός μου
  choice: từ trong lòng mẹ
  rationale: Bảo tồn hình ảnh cụ thể và âm hưởng ngôn ngữ kêu gọi tiên tri của nguyên văn; tiếng Việt có thể lược đại từ sở hữu mà ý “mẹ tôi” vẫn rõ theo ngữ cảnh.
- source_word: καλέσας
  choice: kêu gọi tôi
  rationale: Phản ánh trực tiếp hành động kêu gọi của Đức Chúa Trời và không buộc câu này chỉ mang nghĩa triệu tập hay chỉ định chức vụ.
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: nhờ ân sủng của Ngài
  rationale: “Nhờ” diễn đạt phương tiện theo διά với sở hữu cách; “ân sủng” giữ nội dung thần học của χάρις trong lối nói trang trọng, dễ hiểu.
theological_decisions:
- issue: Có nên dịch ἀφορίσας bằng thuật ngữ hàm ý một học thuyết cụ thể về sự tuyển chọn hoặc tiền định hay không
  choice: biệt riêng tôi
  alternative: chọn tôi; chỉ định tôi; phân rẽ tôi
  rationale: Nguyên văn nói đến việc Đức Chúa Trời dành Phao-lô riêng ra, có âm hưởng sự kêu gọi tiên tri, nhưng không tự nó đòi hỏi một cách diễn đạt mang tính hệ thống thần học mạnh hơn.
- issue: Cách hiểu mốc thời gian trong ἐκ κοιλίας μητρός μου
  choice: từ trong lòng mẹ
  alternative: từ khi chào đời; trước khi tôi ra đời
  rationale: Giữ nguyên hình ảnh và sự mơ hồ tự nhiên của thành ngữ thay vì quyết định dứt khoát hành động xảy ra lúc sinh ra hay trước khi sinh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đấng” và “Ngài” biểu thị chủ thể thần linh một cách tự nhiên. Dấu gạch ngang cuối câu cho biết cú pháp còn tiếp sang câu 16, vì câu 15 trong tiếng Hy Lạp chưa hoàn tất.
