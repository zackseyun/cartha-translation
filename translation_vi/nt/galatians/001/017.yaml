  source_fidelity: 'Bản dịch giữ đúng trình tự và các chuyển động chính của câu: không lên Giê-ru-sa-lem đến với các sứ đồ có trước, nhưng đi tới Ả Rập rồi quay về Đa-mách. Tuy nhiên, “đã làm sứ đồ trước tôi” có thể gợi hành vi/phục vụ trong chức vụ hơn là tình trạng “là sứ đồ” có trước về thời gian. Đổi thành “đã là sứ đồ trước tôi” phản ánh trực tiếp hơn τοὺς πρὸ ἐμοῦ ἀποστόλους và vẫn không hàm ý cấp bậc.'
