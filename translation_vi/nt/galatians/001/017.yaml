source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: vi
  text: Tôi cũng không lên Giê-ru-sa-lem để gặp những người đã là sứ đồ trước tôi, nhưng tôi đi đến miền Ả-rập, rồi lại trở về Đa-mách.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Tôi cũng không
  rationale: Nối tiếp ý phủ định trong văn cảnh trước; “cũng không” tự nhiên trong tiếng Việt và giữ được lực liên kết của οὐδέ.
- source_word: ἀνῆλθον
  choice: lên
  rationale: Giữ cách nói quy ước về hành trình lên Giê-ru-sa-lem, đồng thời tự nhiên và ngắn gọn.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: để gặp những người đã làm sứ đồ trước tôi
  rationale: Trong ngữ cảnh di chuyển đến với người, πρός được diễn đạt tự nhiên là “để gặp”; “đã làm sứ đồ trước tôi” giữ rõ ý ưu tiên về thời gian, không hàm ý cao hơn về phẩm trật.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Thể hiện trực tiếp sự tương phản giữa việc không lên Giê-ru-sa-lem và việc đi đến miền Ả-rập.
- source_word: ἀπῆλθον
  choice: đi đến
  rationale: Diễn đạt tự nhiên chuyển động rời nơi đang ở để đến một vùng khác; tiếng Việt không cần gượng ép thể hiện tiền tố ἀπ- bằng “đi khỏi” khi đích đến đã được nêu.
- source_word: Ἀραβίαν
  choice: miền Ả-rập
  rationale: Chỉ một khu vực địa lý chứ không nhất thiết tương ứng với một quốc gia hiện đại; “miền” giúp giữ nét nghĩa vùng lãnh thổ.
- source_word: πάλιν
  choice: lại
  rationale: Phối hợp tự nhiên với “trở về” để diễn đạt hành động quay lại.
- source_word: ὑπέστρεψα
  choice: trở về
  rationale: Tương đương rõ ràng, tự nhiên cho động từ chỉ quay lại trong bối cảnh hành trình.
- source_word: Δαμασκόν
  choice: Đa-mách
  rationale: Dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “trước tôi” khi nói về các sứ đồ
  choice: Những người đã làm sứ đồ trước khi Phao-lô trở thành sứ đồ hoặc được kêu gọi
  alternative: Những sứ đồ có địa vị cao hơn Phao-lô
  rationale: πρὸ ἐμοῦ tự nhiên nhất chỉ sự có trước về thời gian. Bản dịch không biến thứ tự thời gian thành một tuyên bố về phẩm trật hay thẩm quyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sứ đồ” để giữ thuật ngữ chức vụ quen thuộc; dùng “để gặp” thay cho cấu trúc sát chữ “đến với” nhằm tạo câu tiếng Việt tự nhiên mà không bổ sung một mục đích thần học ngoài ý hướng của hành trình.
