  terminology: Giữ “sứ đồ” cho ἀπόστολοι là phù hợp với thuật ngữ Kinh Thánh tiếng Việt. “Giê-ru-sa-lem” và “Đa-mách” nhất quán với hệ phiên âm Kinh Thánh của bản thảo. “Miền Ả-rập” thích hợp vì Ἀραβία chỉ một vùng địa lý trong bối cảnh cổ đại, không xác định biên giới một quốc gia hiện đại.
