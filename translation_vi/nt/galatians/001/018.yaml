  terminology: “Sê-pha” bảo tồn dạng tên A-ram/Hy Lạp hóa trong nguyên văn, thay vì hài hòa hóa trong chính văn thành “Phi-e-rơ.” Chú thích nhận diện tên đồng thời ghi nhận sắc thái từ vựng của ἱστορῆσαι.
