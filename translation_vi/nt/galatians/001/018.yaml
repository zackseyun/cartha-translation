id: GAL.1.18
reference: Galatians 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔπειτα μετὰ ⸂ἔτη τρία⸃ ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι ⸀Κηφᾶν, καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/018.yaml
  text: Then after three years I went up to Jerusalem to visit Cephas[b][a], and I stayed with him fifteen days.
translation:
  language: vi
  text: Rồi, sau ba năm, tôi lên Giê-ru-sa-lem để thăm Sê-pha[a], và tôi ở lại với ông mười lăm ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sê-pha là tên A-ram của Phi-e-rơ. Động từ được dịch là “thăm” cũng có thể hàm ý gặp trực tiếp để làm quen hoặc biết người ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔπειτα
  choice: Rồi
  rationale: Đánh dấu sự kiện tiếp theo trong trình tự tự thuật của Phao-lô; cách diễn đạt tự nhiên và gọn trong tiếng Việt.
- source_word: μετὰ ἔτη τρία
  choice: sau ba năm
  rationale: Bám sát cụm thời gian Hy Lạp và giữ nguyên khả năng tính thời gian theo mạch văn, không tự ý xác định điểm khởi đầu.
- source_word: ἀνῆλθον
  choice: tôi lên
  rationale: Giữ sắc thái đi lên của động từ, phù hợp với cách nói về hành trình đến Giê-ru-sa-lem.
- source_word: εἰς Ἱεροσόλυμα
  choice: lên Giê-ru-sa-lem
  rationale: Dùng dạng tên địa danh quen thuộc trong tiếng Việt; giới từ chỉ đích đến được thể hiện tự nhiên qua cấu trúc với động từ 'lên'.
- source_word: ἱστορῆσαι
  choice: để gặp và làm quen với
  rationale: Động từ hiếm này không chỉ nhất thiết nói về một cuộc thăm viếng xã giao, mà có thể hàm ý gặp trực tiếp để biết người ấy. Cách dịch này truyền đạt sắc thái làm quen qua cuộc gặp mà không thêm ý hỏi han hay điều tra.
- source_word: Κηφᾶν
  choice: Sê-pha
  rationale: Giữ đúng tên dạng A-ram mà Phao-lô dùng, thay vì đồng nhất hóa ngay trong chính văn thành Phi-e-rơ.
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: tôi ở lại với ông
  rationale: Diễn đạt tự nhiên sự lưu lại bên Sê-pha trong khoảng thời gian được nêu.
- source_word: ἡμέρας δεκαπέντε
  choice: mười lăm ngày
  rationale: Đối cách chỉ khoảng thời gian được chuyển trực tiếp, với ý kéo dài đã rõ nhờ 'ở lại'.
theological_decisions:
- issue: Mục đích chuyến đi được diễn tả bởi ἱστορῆσαι
  choice: để gặp và làm quen với
  alternative: để thăm; để hỏi chuyện
  rationale: Giữ sắc thái tiếp xúc cá nhân và trở nên quen biết, nhưng không diễn giải chuyến đi như việc xin thẩm quyền, học giáo lý hay tiến hành điều tra.
- issue: Danh xưng Κηφᾶς
  choice: Sê-pha trong chính văn, có chú thích nhận diện
  alternative: Phi-e-rơ
  rationale: Tôn trọng lựa chọn tên gọi của nguyên văn và tránh hài hòa hóa; chú thích giúp độc giả nhận biết đây là Phi-e-rơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. 'Gặp và làm quen với' tự nhiên hơn lối dịch quá sát chữ, đồng thời giữ được sắc thái đặc thù của ἱστορῆσαι. Dùng 'ông' làm đại từ chỉ Sê-pha để tránh lặp tên và giữ giọng kể lịch sự.
