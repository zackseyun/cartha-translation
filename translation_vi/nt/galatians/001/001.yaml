id: GAL.1.1
reference: Galatians 1:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: vi
  text: Phao-lô, một sứ đồ—không do loài người mà đến, cũng không qua một người, nhưng qua Giê-su, Đấng Mê-si, và Đức Chúa Trời là Cha, Đấng đã làm cho Ngài sống lại từ cõi chết—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng tên riêng đã quen thuộc trong tiếng Việt Kinh Thánh, rõ ràng và trang trọng.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Thuật ngữ này chỉ chức vụ được sai phái và là cách Phao-lô tự xác định thẩm quyền; “sứ đồ” bảo toàn sắc thái chức danh hơn “sứ giả” hay “đại diện”.
- source_word: οὐκ ἀπ’ ἀνθρώπων
  choice: không do loài người mà đến
  rationale: ἀπό với sở hữu cách diễn tả nguồn gốc; cách dịch này tự nhiên trong tiếng Việt và giữ sự tương phản giữa nguồn gốc từ con người với tác nhân thần thượng.
- source_word: οὐδὲ δι’ ἀνθρώπου
  choice: cũng không qua một người nào
  rationale: διά với sở hữu cách diễn tả trung gian hoặc tác nhân; “một người nào” giữ số ít và sự phủ định, đồng thời tránh cách nói cứng “qua người”.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: qua Chúa Giê-su, Đấng Mê-si
  rationale: Lặp lại “qua” để giữ đối xứng tu từ với δι’ ἀνθρώπου; Χριστός được thể hiện như tước hiệu “Đấng Mê-si”, còn “Chúa” giúp cách gọi tự nhiên, tôn kính trong tiếng Việt.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Diễn đạt tự nhiên cấu trúc danh hiệu, đồng thời giữ “Đức Chúa Trời” và “Cha” cùng quy về một Đấng.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: Đấng đã khiến Ngài sống lại từ cõi chết
  rationale: Phân từ có mạo từ bổ nghĩa cho Đức Chúa Trời là Cha; cách dịch nêu rõ Đức Chúa Trời là tác nhân và giữ nguyên lời khẳng định về sự phục sinh.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong lời mở đầu này, Χριστός vẫn có sức nặng của một tước hiệu; “Đấng Mê-si” thể hiện nghĩa ấy rõ hơn là dùng như một phần tên riêng.
- issue: Mối quan hệ giữa Chúa Giê-su và Đức Chúa Trời là Cha trong việc sai phái Phao-lô
  choice: giữ cả hai sau một giới từ “qua”
  alternative: lặp lại “qua” trước Đức Chúa Trời là Cha
  rationale: Tiếng Hy Lạp phối hợp cả Chúa Giê-su, Đấng Mê-si, và Đức Chúa Trời là Cha dưới cùng giới từ διά; bản dịch không phân chia hay giải thích thêm vai trò của hai Đấng.
- issue: Đại từ αὐτόν trong mệnh đề phục sinh
  choice: Ngài
  alternative: Chúa Giê-su
  rationale: Giữ quan hệ đại từ của nguyên văn nhưng dùng đại từ tôn kính; ngữ cảnh xác định đối tượng được khiến sống lại là Chúa Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc tương phản “không… cũng không… nhưng…” của nguyên văn và dấu gạch ngang mở vì câu còn tiếp sang câu 2. Thuật ngữ “sứ đồ” và danh xưng “Đức Chúa Trời” được dùng theo truyền thống tiếng Việt rộng rãi; không thêm diễn giải giáo phái.
