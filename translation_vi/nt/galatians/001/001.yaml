revisions:
- from: Phao-lô, một sứ đồ—không do loài người mà đến, cũng không qua một người nào, nhưng qua Chúa Giê-su, Đấng Mê-si[a], và Đức Chúa Trời là Cha, Đấng đã khiến Ngài sống lại từ cõi chết—
  to: Phao-lô, một sứ đồ—không do loài người mà đến, cũng không qua một người, nhưng qua Giê-su, Đấng Mê-si, và Đức Chúa Trời là Cha, Đấng đã làm cho Ngài sống lại từ cõi chết—
  rationale: Loại bỏ “Chúa” trước “Giê-su” để không thêm κύριος vào văn bản; điều chỉnh chú thích cùng nguyên tắc. Đổi “một người nào” thành “một người” để bám sát số ít và thế đối chiếu của tiếng Hy Lạp. Các phần còn lại được giữ vì phản ánh trung thành cú pháp, ý nghĩa và văn phong của câu nguồn.
  reviewer_model: gpt-5.6-terra
