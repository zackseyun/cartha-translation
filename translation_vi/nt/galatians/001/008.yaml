id: GAL.1.8
reference: Galatians 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ ⸀εὐαγγελίζηται ⸀ὑμῖν παρ’ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: vi
  text: Nhưng ngay cả nếu chúng tôi hoặc một thiên sứ từ trời loan báo cho anh chị em một tin mừng trái với điều chúng tôi đã loan báo cho anh chị em[a], thì người ấy phải bị nguyền rủa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khác với điều” hoặc “vượt quá điều.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “người ấy hãy bị nguyền rủa” hay “người ấy là anathema.” Từ Hy Lạp diễn tả một người bị đặt dưới lời nguyền.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: Nhưng ngay cả nếu
  rationale: Giữ được sắc thái tương phản mạnh của ἀλλά, sự nhấn mạnh của καί và tính điều kiện của ἐάν bằng tiếng Việt tự nhiên.
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: chúng tôi hoặc một thiên sứ từ trời
  rationale: Giữ sự tự bao gồm đầy nhấn mạnh của Phao-lô và sự tương phản tăng cấp với một sứ giả từ trời.
- source_word: εὐαγγελίζηται
  choice: loan báo ... một tin mừng
  rationale: Diễn đạt động từ Hy Lạp theo nghĩa trực tiếp, đồng thời dùng cách nói tự nhiên, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: παρ’ ὃ
  choice: trái với điều
  rationale: Trong ngữ cảnh tranh luận này, παρά chỉ sự lệch khỏi sứ điệp đã được loan báo; cách dịch này giữ được sức mạnh đối lập nhưng chú thích vẫn bảo lưu các sắc thái khả dĩ khác.
- source_word: εὐηγγελισάμεθα
  choice: đã loan báo
  rationale: Duy trì mối liên hệ từ vựng với εὐαγγελίζηται mà tránh lặp lại nặng nề cụm 'loan báo một tin mừng'.
- source_word: ἀνάθεμα ἔστω
  choice: thì kẻ ấy phải chịu nguyền rủa
  rationale: Truyền đạt lời tuyên án nguyền rủa nghiêm trọng bằng tiếng Việt hiện đại, rõ nghĩa, không đưa vào một nghĩa kỹ thuật giáo hội về sau.
theological_decisions:
- issue: Ý nghĩa của công thức nguyền rủa ἀνάθεμα ἔστω
  choice: thì kẻ ấy phải chịu nguyền rủa
  alternative: hãy để kẻ ấy bị nguyền rủa; kẻ ấy phải bị dứt bỏ
  rationale: Bản văn tuyên bố một phán quyết nguyền rủa thực sự đối với bất cứ ai loan báo sứ điệp trái với tin mừng của các sứ đồ. Cách dịch được chọn giữ sức nặng tư pháp và thần học mà không đồng nhất nó với một thủ tục khai trừ chính thức.
- issue: Phạm vi nghĩa của παρ’ ὃ
  choice: trái với điều
  alternative: khác với điều; vượt quá điều
  rationale: Ngữ cảnh ưu tiên ý nghĩa đối nghịch hoặc lệch khỏi sứ điệp đã nhận, nhưng chú thích bảo lưu sự rộng nghĩa vốn có của giới từ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để chỉ cộng đồng tín hữu số nhiều; “thiên sứ” giữ thuật ngữ Kinh Thánh quen thuộc. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn và được đặt sau mệnh đề liên quan.
