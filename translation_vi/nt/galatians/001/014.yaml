source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: vi
  text: Và tôi đã tiến xa trong Do Thái giáo[a] hơn nhiều người cùng tuổi trong dân mình, vốn nhiệt thành hơn hẳn đối với các truyền thống của cha ông tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Do Thái giáo” cũng có thể dịch là “tôn giáo của người Do Thái” hoặc, theo nghĩa rộng hơn, “nếp sống Do Thái.”
    reason: lexical_alternative
  - marker: b
    text: Hay “các truyền thống của tổ tiên tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: đã tiến xa
  rationale: Thì chưa hoàn thành diễn tả sự tiến triển đang tiếp diễn trong quá khứ; “đã tiến xa” tự nhiên trong tiếng Việt và phù hợp với phép so sánh theo sau.
- source_word: Ἰουδαϊσμῷ
  choice: trong Do Thái giáo
  rationale: Đây là cách gọi ngắn gọn, quen thuộc cho Ἰουδαϊσμός, đồng thời chú thích giữ lại khả năng hiểu rộng hơn là nếp sống Do Thái.
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: hơn nhiều người đồng trang lứa
  rationale: ὑπέρ mang nghĩa so sánh, còn συνηλικιώτας chỉ những người cùng độ tuổi; cách dịch này truyền đạt rõ cả hai nét nghĩa.
- source_word: ἐν τῷ γένει μου
  choice: trong dân tộc mình
  rationale: γένος ở đây chỉ cộng đồng dân tộc hay đồng bào của Phao-lô; “dân tộc mình” rõ nghĩa và tránh sắc thái sinh học dễ gây hiểu lầm của “chủng tộc”.
- source_word: περισσοτέρως
  choice: hơn hẳn
  rationale: Cụm từ này giữ sức nhấn mạnh và tính so sánh của περισσοτέρως bằng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: ζηλωτὴς ὑπάρχων
  choice: tôi nhiệt thành
  rationale: Diễn đạt tự nhiên trạng thái được nêu bằng phân từ, không biến ζηλωτής thành một danh xưng chính trị hoặc tên gọi phe phái.
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: đối với các truyền thống của tổ tiên tôi
  rationale: πατρικός nói đến điều thuộc về các bậc cha ông, còn παραδόσεις là những truyền thống được lưu truyền; cách dịch này sát nghĩa mà vẫn trang trọng, dễ hiểu.
theological_decisions:
- issue: Mối quan hệ của phân từ ζηλωτὴς ὑπάρχων với việc Phao-lô tiến xa trong Do Thái giáo
  choice: dùng “vì tôi nhiệt thành hơn hẳn” để thể hiện nhiệt tâm là hoàn cảnh hoặc cơ sở giải thích cho sự tiến xa
  alternative: “trong khi tôi nhiệt thành hơn hẳn” hoặc “tôi vốn nhiệt thành hơn hẳn”
  rationale: Phân từ có thể mang sắc thái hoàn cảnh hoặc nguyên nhân. “Vì” phù hợp với mạch lập luận nhưng không thêm một nhận định giáo lý về giá trị của các truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “Và” để phản ánh καί và sự tiếp nối với câu trước; dùng “đồng trang lứa” thay cho cách diễn đạt học thuật hơn như “người cùng thời cùng tuổi”.
