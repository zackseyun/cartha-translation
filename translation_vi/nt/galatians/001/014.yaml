revisions:
- from: Và tôi đã tiến xa trong Do Thái giáo[a] hơn nhiều người đồng trang lứa trong dân tộc mình, vì tôi nhiệt thành hơn hẳn đối với các truyền thống của tổ tiên tôi.[b]
  to: Và tôi đã tiến xa trong Do Thái giáo[a] hơn nhiều người cùng tuổi trong dân mình, vốn nhiệt thành hơn hẳn đối với các truyền thống của cha ông tôi.[b]
  rationale: Bản sửa thay liên từ nhân quả bằng «vốn» để không áp đặt quan hệ cú pháp vượt quá nguyên văn; dùng «trong dân mình» cho γένος; và đưa «cha ông» vào văn bản chính để phản ánh trực tiếp sắc thái truyền thừa từ các bậc cha ông của πατρικός. Các chú thích vẫn giữ các phương án từ vựng thích hợp và đúng vị trí neo.
