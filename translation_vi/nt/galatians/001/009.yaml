id: GAL.1.9
reference: Galatians 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: vi
  text: 'Như chúng tôi đã nói trước đây, nay tôi lại nói: Nếu có ai rao truyền cho anh chị em một tin lành trái với điều anh chị em đã tiếp nhận[a], người ấy hãy bị nguyền rủa[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vượt ra ngoài điều anh chị em đã tiếp nhận”; cụm từ này có thể chỉ sự sai lệch khỏi sứ điệp đã được tiếp nhận.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “người ấy phải ở dưới lời nguyền”; tiếng Hy Lạp: anathema estō.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: Như chúng tôi đã nói trước đây
  rationale: Diễn đạt tự nhiên hành động đã nói từ trước và vẫn có hiệu lực trong lời cảnh báo hiện tại; giữ nguyên số nhiều của động từ Hy Lạp.
- source_word: ἄρτι πάλιν λέγω
  choice: nay tôi lại nói
  rationale: “Nay” thể hiện thời điểm hiện tại của ἄρτι, còn “lại nói” giữ ý lặp lại của πάλιν.
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: Nếu có ai rao cho anh chị em một tin lành
  rationale: “Rao” giữ lực động từ công bố; “một tin lành” làm rõ sự đối chiếu mang tính luận chiến với sứ điệp đã được tiếp nhận.
- source_word: παρ’ ὃ
  choice: khác với điều
  rationale: Trong ngữ cảnh, παρά chỉ sự sai lệch khỏi sứ điệp đã tiếp nhận. “Khác với” tự nhiên và vẫn giữ được khả năng bao hàm ý trái ngược hoặc vượt ra ngoài.
- source_word: παρελάβετε
  choice: anh chị em đã tiếp nhận
  rationale: “Tiếp nhận” phù hợp với việc nhận lãnh một sứ điệp hay truyền thống, đồng thời trang trọng và dễ hiểu.
- source_word: ἀνάθεμα ἔστω
  choice: người ấy phải chịu nguyền rủa
  rationale: Giữ sức nặng của công thức phán quyết và lời nguyền trong tiếng Hy Lạp mà không thêm chủ thể ban lời nguyền vốn không được nêu rõ.
theological_decisions:
- issue: Mức độ và tác nhân của lời kết án trong ἀνάθεμα ἔστω
  choice: người ấy phải chịu nguyền rủa
  alternative: người ấy đáng bị Đức Chúa Trời nguyền rủa
  rationale: Bản dịch giữ nguyên tính nghiêm khắc của lời cảnh báo nhưng không bổ sung rõ tác nhân là Đức Chúa Trời khi nguyên văn không nêu.
- issue: Ý nghĩa của παρ’ ὃ đối với sứ điệp đã tiếp nhận
  choice: khác với điều anh chị em đã tiếp nhận
  alternative: vượt quá điều anh chị em đã tiếp nhận
  rationale: “Khác với” chuyển tải sự sai lệch trong ngữ cảnh mà không thu hẹp hoàn toàn cụm từ thành chỉ sự đối nghịch; chú thích bảo lưu cách hiểu “vượt ra ngoài”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς nhằm nói trực tiếp với toàn thể cộng đồng; giữ sự chuyển đổi từ “chúng tôi” sang “tôi” của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
