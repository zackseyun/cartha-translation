  text: 'và tất cả các anh em đang ở với tôi,[a] gửi đến các hội thánh tại Ga-la-ti:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các anh chị em.” Tiếng Hy Lạp viết “các anh em,” nhưng từ này có thể bao gồm các tín hữu thuộc cả hai giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: và tất cả các anh em đang ở với tôi
  rationale: Giữ liên từ nối tiếp câu 1; “các anh em” phản ánh danh từ giống đực số nhiều ἀδελφοί, còn “đang ở với tôi” diễn đạt tự nhiên cụm σὺν ἐμοὶ.
- source_word: ἐκκλησίαις
  choice: các hội thánh
  rationale: “Hội thánh” là cách gọi thông dụng, trang trọng cho các cộng đồng tín hữu trong công thức mở đầu thư của Phao-lô.
- source_word: τῆς Γαλατίας
  choice: tại Ga-la-ti
  rationale: Trong tiếng Việt, “các hội thánh tại Ga-la-ti” diễn đạt tự nhiên quan hệ địa lý của sở hữu cách Hy Lạp mà không làm thay đổi ý nghĩa.
- source_word: καὶ
  choice: và
  rationale: Giữ sự nối tiếp về ngữ pháp và nội dung với lời tự giới thiệu của Phao-lô trong câu trước.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί
  choice: các anh em
  alternative: các anh chị em
  rationale: Bản chính giữ hình thức giống đực số nhiều của tiếng Hy Lạp, đồng thời chú thích khả năng từ này chỉ chung các tín hữu nam và nữ, tránh quyết định thay cho sự rộng nghĩa có thể có của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chữ đầu viết thường để nối tiếp cấu trúc câu mở đầu từ câu 1; giữ dấu hai chấm của công thức đề gửi.
