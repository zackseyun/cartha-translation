id: GAL.1.11
reference: Galatians 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: vi
  text: Vì, thưa anh em[a], tôi muốn anh em biết rằng Tin Lành mà tôi đã rao giảng không bắt nguồn từ con người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây có thể bao gồm cả anh chị em trong cộng đồng tín hữu.
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “không theo con người”; cụm từ này cũng có thể mang nghĩa “không theo tiêu chuẩn của con người”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω ὑμῖν
  choice: tôi muốn anh em biết
  rationale: Trong ngữ cảnh này, động từ mang chức năng giới thiệu một điều quan trọng mà Phao-lô muốn độc giả nhận biết; cách diễn đạt này tự nhiên trong tiếng Việt mà không thêm nội dung.
- source_word: γὰρ
  choice: Thật vậy
  rationale: Liên từ nối câu này với lập luận trước và đưa ra lời giải thích; “Thật vậy” giữ được chức năng liên kết ấy tự nhiên hơn “Vì” khi đứng đầu câu tiếng Việt này.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Danh từ Hy Lạp ở giống đực số nhiều; trong cách dùng của Phao-lô, từ này thường hướng đến toàn thể cộng đồng tín hữu. Bản chính giữ hình thức “anh em”, còn nghĩa bao gồm cả nam lẫn nữ được nêu trong chú thích.
- source_word: εὐαγγέλιον
  choice: Tin Lành
  rationale: Đây là thuật ngữ quen thuộc, ngắn gọn và phù hợp với nghĩa chuyên biệt trong các thư của Phao-lô.
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: mà tôi đã rao giảng
  rationale: Cách dịch này thể hiện rõ Phao-lô là người công bố Tin Lành và chuyển tải tự nhiên dạng phân từ bị động của nguyên văn.
- source_word: κατὰ ἄνθρωπον
  choice: không bắt nguồn từ con người
  rationale: Trong mạch văn, câu kế tiếp phủ nhận việc Phao-lô nhận hoặc học Tin Lành từ một con người; vì vậy, cách hiểu về nguồn gốc phù hợp nhất, đồng thời cách hiểu theo tiêu chuẩn con người được giữ trong chú thích.
theological_decisions:
- issue: κατὰ ἄνθρωπον nói về nguồn gốc hay tiêu chuẩn của Tin Lành
  choice: không bắt nguồn từ con người
  alternative: 'không theo tiêu chuẩn của con người; sát chữ: không theo con người'
  rationale: Ga-la-ti 1:12 triển khai trực tiếp ý rằng Phao-lô không nhận và cũng không được con người dạy Tin Lành, nên nghĩa chỉ nguồn gốc được ưu tiên. Tuy nhiên, cấu trúc Hy Lạp vẫn có thể gợi đến chuẩn mực hoặc tính chất của con người, vì vậy phương án ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thật vậy” giữ quan hệ giải thích của γάρ; “thưa anh em” truyền đạt sắc thái trực tiếp của lời xưng hô mà không làm câu nặng nề.
