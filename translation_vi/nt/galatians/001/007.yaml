  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: vi
  text: Thật ra không phải là một Tin Mừng khác. Chẳng qua có một số người đang gây rối cho anh chị em và muốn xuyên tạc[b] Tin Mừng của Đấng Mê-si[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “làm sai lệch.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ οὐκ ἔστιν ἄλλο
  choice: thật ra không phải là một Tin Mừng khác
  rationale: Đại từ ὃ nối với “tin mừng” ở câu trước; danh từ được nhắc lại trong tiếng Việt để câu rõ nghĩa. Cách diễn đạt này giữ lời phủ định mạnh của Phao-lô rằng điều vừa nói không thật sự là một Tin Mừng khác.
- source_word: εἰ μή
  choice: Chẳng qua
  rationale: Trong ngữ cảnh này, εἰ μή đưa ra lời đính chính/giải thích chứ không nêu một điều kiện theo nghĩa thông thường. “Chẳng qua” tự nhiên trong tiếng Việt và giữ mạch lập luận.
- source_word: ταράσσοντες
  choice: đang gây rối
  rationale: Diễn đạt hành động khiến các tín hữu bất an và xáo trộn, đồng thời giữ sắc thái hiện tại của phân từ.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ số nhiều chỉ toàn thể cộng đồng tín hữu. “Anh chị em” là cách xưng hô bao quát, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: θέλοντες
  choice: muốn
  rationale: Giữ trực tiếp ý định của những người gây rối mà không cường điệu mức độ chủ ý.
- source_word: μεταστρέψαι
  choice: xuyên tạc
  rationale: Động từ chỉ việc biến đổi một điều thành dạng sai lệch hoặc trái ngược. “Xuyên tạc” rõ, mạnh và phù hợp với sự lên án trong câu.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Mừng
  rationale: “Tin Mừng” là cách dịch quen thuộc, dễ hiểu của εὐαγγέλιον trong tiếng Việt và giữ được nghĩa vừa là sứ điệp vừa là tin tốt lành.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây vẫn mang giá trị tước hiệu. “Đấng Mê-si” giữ nền tảng Do Thái và chức vụ được xức dầu của Chúa Giê-su; quan hệ sở hữu trong τοῦ Χριστοῦ được giữ nguyên, không quyết định thay người đọc rằng đây chỉ là Tin Mừng “về” hay “thuộc về” Ngài.
theological_decisions:
- issue: Χριστοῦ nên được diễn đạt như tước hiệu hay dạng gần với tên riêng
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Cụm này có thể chỉ Tin Mừng thuộc về hoặc liên quan đến Chúa Giê-su trong tư cách Đấng được xức dầu. Bản chính giữ tước hiệu “Đấng Mê-si”; chú thích cung cấp cách gọi truyền thống mà không làm mất khả năng hiểu theo tước hiệu.
- issue: Sắc thái của μεταστρέψαι
  choice: xuyên tạc
  alternative: làm sai lệch
  rationale: “Xuyên tạc” giữ sức nặng của lời cảnh báo rằng sứ điệp đang bị biến đổi theo hướng trái ngược, còn chú thích ghi nhận cách dịch ít mạnh hơn nhưng vẫn khả hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” biểu đạt tự nhiên đại từ số nhiều của cộng đồng. Câu đầu giữ liên hệ với câu 6 nhưng vẫn đủ rõ khi đọc riêng; “Chẳng qua” tái hiện lời đính chính của Phao-lô. Viết hoa “Tin Mừng” theo cách dùng phổ biến trong văn bản Cơ Đốc tiếng Việt.
