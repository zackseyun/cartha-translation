  rationale: Sửa câu để chủ thể “tôi” và thể bị động phản ánh trực tiếp ἤμην ... ἀγνοούμενος, đồng thời làm gọn phần bổ nghĩa cho các hội thánh. Không thêm ý “vẫn,” “chưa hề,” hoặc bất cứ giới hạn thời gian nào không có trong nguyên ngữ.
