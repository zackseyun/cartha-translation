  text: ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/022.yaml
  text: But I was personally unknown by face to the churches of Judea that are in Messiah[b][a],
translation:
  language: vi
  text: Nhưng tôi không được các hội thánh tại miền Giu-đê, tức là các hội thánh ở trong Đấng Mê-si[b], biết mặt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “không được nhận biết trực tiếp” hoặc “không quen biết trực tiếp.”
    reason: lexical_alternative
  - marker: b
    text: Hay “Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sự chuyển ý và tương phản nhẹ với câu trước một cách tự nhiên trong tiếng Việt.
- source_word: ἤμην … ἀγνοούμενος
  choice: chưa biết … tôi
  rationale: Kết cấu quá khứ tiếp diễn diễn tả tình trạng Phao-lô không được các hội thánh ấy nhận biết; “chưa biết” truyền đạt trạng thái này tự nhiên mà không thêm ý tuyệt đối.
- source_word: τῷ προσώπῳ
  choice: mặt
  rationale: Cụm này nói đến việc nhận biết qua diện mạo hoặc quen biết trực tiếp; “chưa biết mặt tôi” là thành ngữ tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: ἐκκλησίαις
  choice: các hội thánh
  rationale: Trong văn cảnh Phao-lô, từ này chỉ các cộng đồng tín hữu; “hội thánh” là cách gọi rõ ràng và quen thuộc.
- source_word: Ἰουδαίας
  choice: miền Giu-đê
  rationale: Dùng địa danh quen thuộc trong tiếng Việt và thêm “miền” để làm rõ đây là khu vực địa lý.
- source_word: ἐν Χριστῷ
  choice: ở trong Đấng Mê-si
  rationale: Giữ thành ngữ thần học về mối liên hệ và sự hiệp nhất của các hội thánh với Đấng được xức dầu, đồng thời làm rõ sắc thái tước hiệu của Χριστός.
theological_decisions:
- issue: Cách dịch Χριστῷ trong cụm ἐν Χριστῷ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός vẫn mang sắc thái tước hiệu “Đấng được xức dầu”; “Đấng Mê-si” bảo tồn sắc thái ấy, còn cách dịch truyền thống được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được chuyển sang chủ thể “các hội thánh” cho tự nhiên trong tiếng Việt; cụm giải thích “là những hội thánh” giúp bổ nghĩa ἐν Χριστῷ rõ ràng, không để người đọc hiểu nhầm rằng địa danh Giu-đê “ở trong” Đấng Mê-si.
