  text: καὶ ἐδόξαζον ἐν ἐμοὶ τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: vi
  text: Và họ tôn vinh Đức Chúa Trời vì tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “trong tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Liên từ thông thường tiếp nối lời thuật của Phao-lô; cách dịch phối hợp đơn giản giữ đúng mạch văn.
- source_word: ἐδόξαζον
  choice: tôn vinh
  rationale: Động từ δοξάζω có nghĩa là dâng vinh quang hoặc sự tôn kính. Thì chưa hoàn thành có thể gợi hành động đang tiếp diễn hoặc lặp lại; tiếng Việt tự nhiên có thể để sắc thái ấy hàm ẩn trong ngữ cảnh.
- source_word: ἐν ἐμοὶ
  choice: vì cớ tôi
  rationale: 'Dù ἐν theo nghĩa sát chữ là “trong”, ở đây cụm từ có thể mang nghĩa nguyên nhân hoặc liên hệ: họ tôn vinh Đức Chúa Trời vì điều đã xảy ra liên quan đến Phao-lô. Bản dịch sát chữ hơn được giữ trong chú thích.'
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Đây là tân ngữ trực tiếp của ἐδόξαζον; “Đức Chúa Trời” là cách gọi trang trọng và quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἐν ἐμοὶ
  choice: 'nguyên nhân/liên hệ: “vì cớ tôi”'
  alternative: 'định vị hoặc phạm vi: “trong tôi”'
  rationale: Ngữ cảnh nói đến phản ứng của các hội thánh trước tin tức về sự biến đổi và chức vụ của Phao-lô. “Vì cớ tôi” diễn đạt tự nhiên việc họ tôn vinh Đức Chúa Trời do điều xảy ra liên quan đến ông, còn cách hiểu “trong tôi” được bảo tồn trong chú thích để không xóa bỏ sự đa nghĩa của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôn vinh” để diễn đạt δοξάζω và “vì cớ tôi” để giữ sắc thái trang nghiêm, đồng thời chú thích cách dịch sát chữ.
