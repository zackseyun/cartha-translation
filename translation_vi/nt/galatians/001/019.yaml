base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: vi
  text: Nhưng tôi không gặp một sứ đồ nào khác, ngoại trừ Gia-cơ[a], anh/em trai của Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Tôi không gặp sứ đồ nào khác—chỉ gặp Gia-cơ, anh/em trai của Chúa.” Một số người hiểu cách diễn đạt này không xếp Gia-cơ vào hàng sứ đồ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕτερον
  choice: nào khác
  rationale: Trong cấu trúc chỉ một người thuộc nhóm các sứ đồ, cụm này diễn đạt tự nhiên ý “một người nào khác trong số đó”.
- source_word: δέ
  choice: Nhưng
  rationale: Liên từ này đánh dấu sự tương phản nhẹ với lời kể ngay trước đó; “Nhưng” phù hợp và tự nhiên trong tiếng Việt.
- source_word: ἀποστόλων
  choice: sứ đồ
  rationale: Đây là thuật ngữ quen thuộc và rõ nghĩa trong ngữ cảnh Phao-lô, chỉ những người được nhìn nhận là sứ đồ.
- source_word: οὐκ εἶδον
  choice: tôi không gặp
  rationale: Động từ mang nghĩa đen là “thấy”, nhưng trong lời kể về việc Phao-lô đến Giê-ru-sa-lem và tiếp xúc với các nhân vật, “gặp” diễn đạt tự nhiên ý trực tiếp diện kiến mà không thay đổi nội dung.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Ở đây cụm từ giới thiệu một ngoại lệ, không phải một điều kiện; “ngoại trừ” giữ rõ quan hệ cú pháp ấy.
- source_word: Ἰάκωβον
  choice: Gia-cơ
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἀδελφὸν
  choice: em trai
  rationale: Từ Hy Lạp có nghĩa trực tiếp là “anh/em trai”; theo cách nhận diện Gia-cơ quen thuộc trong ngữ cảnh này, “em trai” là cách nói tự nhiên, dù nguyên văn không tự nó xác định lớn hay nhỏ tuổi.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ danh hiệu κύριος là “Chúa” và diễn đạt quan hệ sở hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cấu trúc này có kể Gia-cơ vào số các sứ đồ hay không
  choice: Bản văn chính giữ cách hiểu cú pháp tự nhiên rằng Gia-cơ là ngoại lệ trong nhóm “các sứ đồ khác”, qua đó ngụ ý ông được kể là sứ đồ.
  alternative: Có người hiểu rằng Phao-lô không gặp sứ đồ nào khác ngoài Phi-e-rơ, nhưng có gặp thêm Gia-cơ mà không nhất thiết xếp Gia-cơ vào hàng sứ đồ.
  rationale: Cụm εἰ μὴ thường giới thiệu ngoại lệ cho mệnh đề đứng trước. Chú thích bảo tồn cách hiểu khác vì cấu trúc có thể được phân tích theo hướng không phân loại Gia-cơ là sứ đồ.
- issue: Quan hệ gia đình được diễn đạt bởi ἀδελφός
  choice: Dịch theo nghĩa trực tiếp là “em trai”.
  alternative: “anh em” hoặc “người bà con”
  rationale: Nguyên văn dùng thuật ngữ thông thường chỉ anh/em trai và không có dấu hiệu trong câu buộc phải làm yếu quan hệ gia đình thành “người bà con”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “gặp” thay cho cách dịch sát chữ “thấy” vì tự nhiên hơn trong ngữ cảnh gặp gỡ con người; giữ “sứ đồ” và các tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
