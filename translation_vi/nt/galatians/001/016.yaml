source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: vi
  text: để bày tỏ Con Ngài trong tôi[a], để tôi rao truyền Ngài giữa các dân ngoại, tôi không lập tức hỏi ý kiến thịt và máu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho tôi” hoặc “qua tôi.”'
    reason: alternative_reading
  - marker: b
    text: “Thịt và máu” là thành ngữ chỉ một hay nhiều con người.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: bày tỏ
  rationale: Diễn đạt hành động mặc khải của Đức Chúa Trời bằng cách nói tự nhiên, trang trọng trong tiếng Việt, đồng thời nối tiếp cấu trúc từ câu trước.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: Con Ngài
  rationale: Giữ nguyên tước hiệu chỉ quan hệ Cha–Con và sắc thái Kitô học, không diễn giải thêm.
- source_word: ἐν ἐμοὶ
  choice: trong tôi
  rationale: Bám sát giới từ ἐν và giữ sự hàm nghĩa mở giữa sự bày tỏ ở nội tâm Phao-lô, cho Phao-lô, hoặc qua Phao-lô; các khả năng kia được ghi ở chú thích.
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: hầu cho tôi rao truyền chính Con ấy
  rationale: 'Giữ αὐτόν là tân ngữ trực tiếp: điều Phao-lô rao truyền là chính người Con, thay vì diễn giải thành thông tin hay sứ điệp về Ngài.'
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Trong văn cảnh thư Phao-lô, cụm này chủ yếu chỉ những dân không thuộc Do Thái; “các dân ngoại” rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Tương đương tự nhiên với trạng từ chỉ tính tức thời và giữ liên hệ của nó với mệnh đề theo sau.
- source_word: οὐ προσανεθέμην
  choice: tôi đã không bàn hỏi
  rationale: Động từ trung cách mang nghĩa đem vấn đề ra trao đổi hoặc xin ý kiến; “bàn hỏi” vừa tự nhiên vừa phù hợp với thành ngữ theo sau.
- source_word: σαρκὶ καὶ αἵματι
  choice: với thịt và máu
  rationale: Giữ hình ảnh thành ngữ đặc sắc của nguyên văn; ý chỉ con người được giải thích trong chú thích.
theological_decisions:
- issue: Ý nghĩa của ἐν ἐμοὶ trong việc Đức Chúa Trời bày tỏ Con Ngài
  choice: Giữ cách dịch sát và đa nghĩa “trong tôi” ở chính văn
  alternative: “cho tôi” hoặc “qua tôi”
  rationale: Cụm từ có thể nhấn mạnh sự mặc khải bên trong Phao-lô, sự mặc khải dành cho ông, hoặc việc Đức Chúa Trời dùng ông làm phạm vi/phương tiện bày tỏ. Chính văn không khép lại căng thẳng diễn giải này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu được giữ như một phần tiếp nối của câu 15 nên mở đầu bằng “để” và kết thúc bằng dấu phẩy. Dùng “Ngài” cho đại từ chỉ Đức Chúa Trời theo văn phong Kinh Thánh tiếng Việt; không thêm cách giải nghĩa mang tính hệ phái.
