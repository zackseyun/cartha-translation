  text: Then I went into the regions of Syria and Cilicia[a][b].
translation:
  language: vi
  text: Sau đó, tôi đi đến các vùng Syria và Cilicia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi vào các vùng Syria và Cilicia.”'
