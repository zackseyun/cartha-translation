lexical_decisions:
- source_word: ἔπειτα
  choice: Sau đó
  rationale: Diễn tả trình tự thời gian trong lời thuật của Phao-lô một cách tự nhiên và rõ ràng.
- source_word: ἦλθον
  choice: tôi đi
  rationale: Dù động từ có thể dịch sát là “tôi đến”, ngữ cảnh kể lại hành trình từ địa điểm trước đó khiến “tôi đi” tự nhiên hơn trong tiếng Việt.
- source_word: εἰς
  choice: đến
  rationale: Diễn đạt hướng chuyển động tới địa bàn được nêu; tiếng Việt dùng “đi đến” tự nhiên hơn “đi vào” khi nói về các miền rộng.
- source_word: κλίματα
  choice: các miền
  rationale: Chỉ những khu vực hoặc địa bàn địa lý; “các miền” vừa dễ hiểu vừa giữ dạng số nhiều của nguyên văn.
- source_word: Συρίας
  choice: Sy-ri
  rationale: Tên địa danh theo cách phiên âm quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Κιλικίας
  choice: Si-li-si
  rationale: Tên địa danh được phiên âm rõ ràng, phù hợp với cách gọi quen thuộc trong Kinh Thánh tiếng Việt.
theological_decisions: []
