source:
  edition: SBLGNT
  text: Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: vi
  text: Rồi mười bốn năm sau, tôi lại lên Giê-ru-sa-lem cùng với Ba-na-ba, và cũng đem Tít theo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: Sau đó
  rationale: Dùng từ nối tự nhiên để tiếp tục trình tự tự thuật của Phao-lô.
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: mười bốn năm sau
  rationale: Trong cấu trúc chỉ thời gian này, διά với sở hữu cách nói đến khoảng thời gian đã trôi qua trước sự kiện kế tiếp; cách diễn đạt này tự nhiên trong tiếng Việt và không xác định mốc tính vốn không được nêu rõ trong câu.
- source_word: πάλιν
  choice: lại
  rationale: Biểu thị chuyến đi được lặp lại, ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἀνέβην
  choice: tôi ... lên
  rationale: Giữ hình ảnh đi lên Giê-ru-sa-lem của nguyên văn, phù hợp cả với địa thế lẫn lối nói quen thuộc.
- source_word: εἰς Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Chuyển tên địa danh theo dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt; hướng đến được thể hiện bởi động từ 'lên'.
- source_word: μετὰ Βαρναβᾶ
  choice: cùng với Ba-na-ba
  rationale: Diễn đạt trực tiếp ý đồng hành.
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: và cũng đưa Tít đi theo
  rationale: Phân từ diễn tả hành động đi kèm với động từ chính; 'cũng' giữ sắc thái bổ sung của καί, cho thấy Tít được đưa theo bên cạnh Ba-na-ba.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nguyên sự mơ hồ của câu về mốc bắt đầu của khoảng mười bốn năm; không thêm cách đồng nhất chuyến đi này với một sự kiện khác trong Công vụ.
