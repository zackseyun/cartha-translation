  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: μόνον nêu điều kiện/yêu cầu duy nhất, τῶν πτωχῶν là «những người nghèo», và αὐτὸ τοῦτο nhấn mạnh chính điều vừa nói. Tuy nhiên, «chúng tôi phải» làm mạnh sắc thái bắt buộc hơn điều nguyên văn trực tiếp diễn đạt; ἵνα μνημονεύωμεν ở đây nêu nội dung lời thỉnh cầu/đề nghị được ngầm hiểu từ văn mạch.'
