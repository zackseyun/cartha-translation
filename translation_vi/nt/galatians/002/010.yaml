  yaml_path: translation/nt/galatians/002/010.yaml
  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: vi
  text: Chỉ xin chúng tôi nhớ đến những người nghèo—đó cũng chính là điều tôi đã sốt sắng làm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: Chỉ có điều là
  rationale: Đánh dấu yêu cầu duy nhất đi kèm thỏa thuận, đồng thời nối tự nhiên với văn cảnh trước.
- source_word: τῶν πτωχῶν
  choice: những người nghèo
  rationale: Diễn đạt nghĩa thông thường của πτωχός là những người thiếu thốn về vật chất, bằng cách nói rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἵνα μνημονεύωμεν
  choice: chúng tôi phải nhớ đến
  rationale: ἵνα nêu nội dung của yêu cầu; “phải” thể hiện sắc thái trách nhiệm trong lời đề nghị, còn “nhớ đến” giữ hình ảnh nguyên ngữ và hàm ý quan tâm thực tế mà không diễn giải quá mức.
- source_word: ὃ
  choice: đó
  rationale: Đại từ quan hệ giống trung ὃ quy chiếu về toàn bộ yêu cầu vừa nêu; tách thành mệnh đề với “đó” tự nhiên hơn trong tiếng Việt.
- source_word: ἐσπούδασα
  choice: đã sốt sắng
  rationale: Thể hiện cả sự nhiệt thành lẫn nỗ lực nghiêm túc của σπουδάζω, đồng thời giữ sắc thái trang trọng vừa phải.
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: chính là điều tôi đã sốt sắng làm
  rationale: “chính” bảo tồn sức nhấn mạnh của αὐτὸ τοῦτο; cấu trúc tiếng Việt tự nhiên và vẫn đặt trọng tâm vào việc thực hiện điều ấy.
theological_decisions:
- issue: Phạm vi của “những người nghèo”
  choice: Không xác định thêm nhóm người nghèo nào trong chính câu dịch
  alternative: “những người nghèo tại Giê-ru-sa-lem” hoặc “những tín hữu nghèo”
  rationale: Nguyên văn chỉ nói τῶν πτωχῶν; dù văn cảnh lịch sử có thể gợi một nhóm cụ thể, việc thêm địa điểm hay căn tính sẽ thu hẹp điều bản văn để ngỏ.
- issue: Sắc thái của “nhớ đến”
  choice: Giữ động từ “nhớ đến” thay vì dịch thẳng thành cứu trợ
  alternative: “giúp đỡ những người nghèo” hoặc “chăm lo cho những người nghèo”
  rationale: Trong văn cảnh, việc nhớ đến rõ ràng hàm ý quan tâm bằng hành động, nhưng nguyên ngữ vẫn dùng μνημονεύω; bản dịch giữ nguyên sự căng giữa sự ghi nhớ và hành động thực tế.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dấu gạch ngang làm rõ rằng mệnh đề sau nhận xét về toàn bộ yêu cầu trước đó. Không cần chú thích vì không có dị bản hoặc điểm mơ hồ nào buộc phải giải thích ngoài bản dịch.
