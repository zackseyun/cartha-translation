  text: Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/015.yaml
  text: We are Jews by birth and not sinners from among the Gentiles[b][a],
translation:
  language: vi
  text: Chúng tôi là người Do Thái từ khi sinh ra, chứ không phải là những người tội lỗi xuất thân từ các dân ngoại[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “những kẻ tội lỗi dân ngoại.”'
    reason: lexical_alternative
  - marker: b
    text: Cụm “từ khi sinh ra” dịch một từ có nghĩa đen là “theo bản tính”; tại đây, từ ấy chỉ nguồn gốc dân tộc tự nhiên.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς
  choice: Chúng ta
  rationale: Giữ đại từ được nêu rõ trong tiếng Hy Lạp, vừa tự nhiên trong tiếng Việt vừa bảo toàn sắc thái nhấn nhẹ và tính bao hàm trong lời Phao-lô.
- source_word: φύσει
  choice: vốn là ... từ khi sinh ra
  rationale: Trong ngữ cảnh này, từ này chỉ nguồn gốc dân tộc tự nhiên chứ không nói đến bản tính đạo đức; cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἰουδαῖοι
  choice: người Do Thái
  rationale: Cách gọi thông dụng, trang trọng, bảo toàn sự đối lập về căn tính dân tộc trong câu.
- source_word: ἐξ ἐθνῶν
  choice: thuộc các dân ngoại
  rationale: Giữ ý xuất thân hay thuộc về các dân không phải Do Thái, đồng thời phản ánh giới từ ἐξ mà không khiến câu tiếng Việt nặng nề.
- source_word: ἁμαρτωλοί
  choice: những người tội lỗi
  rationale: Giữ nguyên cách gọi trực tiếp và căng thẳng trong nguyên văn, thay vì diễn giải thành một phán quyết thần học rộng hơn.
theological_decisions:
- issue: Câu này có nên được diễn đạt như lời khẳng định rằng người Do Thái vốn ưu việt hơn dân ngoại về đạo đức hay không
  choice: Giữ nguyên sự đối lập dân tộc được phát biểu ngắn gọn, nhưng không thêm ý rằng người Do Thái tự bản chất là công chính.
  alternative: Diễn giải thành “không bị kể là người tội lỗi như dân ngoại.”
  rationale: Nguyên văn phát biểu trực tiếp theo lối phân biệt đương thời; văn mạch kế tiếp sẽ điều chỉnh và làm rõ điều đó. Không nên đưa lời giải thích của văn mạch sau vào riêng câu này.
- issue: Phạm vi kết hợp của ἐξ ἐθνῶν với ἁμαρτωλοί
  choice: “những người tội lỗi thuộc các dân ngoại”
  alternative: “những kẻ tội lỗi dân ngoại” hoặc “người ngoại tội lỗi”
  rationale: Cấu trúc Hy Lạp có thể được hiểu là những người tội lỗi xuất thân từ các dân ngoại hoặc gọn hơn là “những kẻ tội lỗi dân ngoại”; bản dịch chính giữ cấu trúc rõ nghĩa, còn chú thích bảo toàn cách đọc cô đọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ sắc thái đối lập gay gắt của nguyên văn mà không tự ý làm nhẹ hoặc biến nó thành một khẳng định về sự ưu việt đạo đức. Dấu phẩy cuối câu được giữ vì Ga-la-ti 2:15 nối về mặt cú pháp và lập luận với câu kế tiếp.
