revisions:
- from: 'Nhưng khi tôi thấy họ không bước ngay thẳng theo chân lý của Tin Mừng[a], tôi đã nói với Kê-pha trước mặt mọi người: “Nếu ông là người Do Thái mà lại sống như người ngoại chứ không như người Do Thái, thì sao ông ép những người ngoại phải sống theo lối người Do Thái[b]?”'
  to: 'Nhưng khi tôi thấy họ không bước đi ngay thẳng theo chân lý của Tin Mừng[a], tôi đã nói với Kê-pha trước mặt mọi người: “Nếu ông là người Do Thái mà lại sống như Dân ngoại chứ không như người Do Thái, thì sao ông ép Dân ngoại phải sống theo lối người Do Thái[b]?”'
  rationale: Bản sửa làm rõ τὰ ἔθνη bằng thuật ngữ “Dân ngoại”, trau chuốt nhẹ cụm động từ “bước đi ngay thẳng”, và giản lược chú thích b để bảo toàn tính trung tính của phương án từ vựng. Không thay đổi ý nghĩa hay giải quyết hộ hàm ý thần học của bản văn.
