id: GAL.2.14
reference: Galatians 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ ⸀Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς ⸂καὶ ⸀οὐκ Ἰουδαϊκῶς ζῇς⸃, ⸀πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: vi
  text: 'Nhưng khi tôi thấy họ không bước đi ngay thẳng theo chân lý của Tin Mừng[a], tôi đã nói với Kê-pha trước mặt mọi người: “Nếu ông là người Do Thái mà lại sống như Dân ngoại chứ không như người Do Thái, thì sao ông ép Dân ngoại phải sống theo lối người Do Thái[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “không bước đi thẳng theo chân lý của Tin Mừng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cách dịch truyền thống: “phải Do Thái hóa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: không bước ngay thẳng
  rationale: Giữ hình ảnh bước đi của động từ Hy Lạp và diễn đạt tự nhiên về cách cư xử không phù hợp với chuẩn mực.
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: theo chân lý của Tin Mừng
  rationale: Trong kết hợp với ὀρθοποδοῦσιν, πρός chỉ sự phù hợp với một chuẩn mực; “theo” chuyển tải quan hệ ấy gọn và tự nhiên.
- source_word: Κηφᾷ
  choice: Kê-pha
  rationale: Phiên âm đúng tên mà Phao-lô dùng tại đây, thay vì đổi thành Phi-e-rơ.
- source_word: ἐθνικῶς
  choice: sống như người ngoại
  rationale: Diễn tả phương cách sống và giữ sự tương phản xã hội-dân tộc trong ngữ cảnh.
- source_word: Ἰουδαϊκῶς
  choice: như người Do Thái
  rationale: Giữ cấu trúc song song đối lập với ἐθνικῶς bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀναγκάζεις
  choice: ép
  rationale: Giữ sắc thái cưỡng ép hoặc gây áp lực của động từ mà không thêm ý về khả năng.
- source_word: Ἰουδαΐζειν
  choice: sống theo lối người Do Thái
  rationale: Truyền đạt việc tiếp nhận nếp sống đặc trưng Do Thái một cách dễ hiểu, đồng thời tránh biến từ này thành thuật ngữ thần học hậu kỳ.
theological_decisions:
- issue: Cách dịch Ἰουδαΐζειν mà không đưa tranh luận giáo lý hậu kỳ vào câu
  choice: sống theo lối người Do Thái
  alternative: Do Thái hóa; tuân theo các tập tục Do Thái
  rationale: Ngữ cảnh trực tiếp liên quan đến cách sống, việc dùng bữa chung và các ranh giới cộng đồng. Cách dịch này giữ phạm vi xã hội-tôn giáo của lời quở trách mà không giải quyết quá mức hàm ý thần học.
- issue: Sắc thái của πῶς trong câu hỏi
  choice: thì sao ông ép
  alternative: làm sao ông có thể ép
  rationale: Dịch trực tiếp “thế nào/sao” để nhấn mạnh sự bất nhất trong hành động, không thêm sắc thái về khả năng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Tin Mừng” cho εὐαγγέλιον; giữ tên Kê-pha theo nguyên văn. Cặp “người Do Thái/người ngoại” bảo tồn thế đối lập dân tộc-xã hội. Đại từ “ông” phù hợp với lời đối chất công khai giữa hai người trưởng thành mà không tạo sắc thái miệt thị.
