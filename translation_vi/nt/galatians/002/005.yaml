id: GAL.2.5
reference: Galatians 2:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: vi
  text: Chúng tôi không hề nhượng bộ họ bằng cách chịu phục tùng, dù chỉ trong chốc lát[a], để chân lý của Tin Mừng vẫn còn cho anh chị em.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “dù chỉ một giờ,” một thành ngữ có nghĩa là “dù chỉ trong chốc lát.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vẫn còn ở với anh chị em.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: họ
  rationale: Đại từ quan hệ số nhiều ở cách tặng chỉ về những người vừa được nhắc đến; tiếng Việt tự nhiên dùng “họ” trong cụm “phục tùng họ”.
- source_word: οὐδὲ πρὸς ὥραν
  choice: dù chỉ trong chốc lát
  rationale: Thành ngữ này nhấn mạnh rằng họ không nhượng bộ dù trong một khoảng thời gian rất ngắn; cách dịch này tự nhiên hơn nghĩa đen “dù chỉ một giờ”.
- source_word: εἴξαμεν
  choice: không hề nhượng bộ
  rationale: Động từ diễn tả việc nhường bước hay chịu thua. “Không hề nhượng bộ” giữ được sắc thái chủ động khước từ và sự nhấn mạnh của οὐδὲ.
- source_word: τῇ ὑποταγῇ
  choice: mà chịu phục tùng
  rationale: Cụm này diễn tả cách thức hoặc phạm vi của sự nhượng bộ. Cách dịch giữ ý phục tùng mà không đồng nhất hoàn toàn nó với động từ “nhượng bộ”.
- source_word: ἵνα
  choice: để
  rationale: Liên từ mở đầu mệnh đề chỉ mục đích; “để” diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: chân lý của Tin Mừng
  rationale: Giữ nguyên cấu trúc sở hữu và thuật ngữ quen thuộc của Phao-lô; “chân lý” trang trọng nhưng vẫn dễ hiểu, còn “Tin Mừng” là cách gọi thông dụng của εὐαγγέλιον.
- source_word: διαμείνῃ
  choice: được duy trì
  rationale: Động từ nói đến việc tiếp tục tồn tại hay được bảo toàn. Dạng “được duy trì” phù hợp với mục đích bảo toàn chân lý của Tin Mừng.
- source_word: πρὸς ὑμᾶς
  choice: cho anh chị em
  rationale: πρός với đối cách ở đây có thể chỉ hướng đến hoặc lợi ích dành cho người Ga-la-ti. “Cho anh chị em” tự nhiên và giữ ý chân lý được bảo toàn vì lợi ích của họ, trong khi chú thích ghi nhận khả năng “ở với”.
theological_decisions:
- issue: Phạm vi lời khước từ của Phao-lô đối với những người chống đối
  choice: Phao-lô nói rằng ông và các cộng sự hoàn toàn không nhượng bộ để phục tùng họ, nhằm bảo toàn chân lý của Tin Mừng.
  alternative: Có thể thu hẹp lời này thành việc Phao-lô khước từ sự phục tùng cá nhân hoặc khước từ một nhượng bộ mang tính thể chế.
  rationale: Bản Hy Lạp nói chung về việc không nhượng bộ trong sự phục tùng, không xác định đó chỉ là hành động cá nhân hay thể chế. Bản dịch không thêm một phạm vi giáo lý cụ thể.
- issue: Quan hệ của chân lý Tin Mừng với người Ga-la-ti trong πρὸς ὑμᾶς
  choice: “được duy trì cho anh chị em,” nhấn mạnh lợi ích dành cho họ
  alternative: “được duy trì ở với anh chị em,” nhấn mạnh sự hiện diện giữa họ
  rationale: Cả sắc thái hướng đến/lợi ích và sắc thái hiện diện đều có thể phù hợp với giới từ. Bản chính chọn cách nói tự nhiên hơn trong ngữ cảnh, đồng thời giữ phương án kia trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh chị em” diễn đạt số nhiều ὑμᾶς theo lối xưng hô cộng đồng tự nhiên trong tiếng Việt. Cấu trúc “không hề nhượng bộ mà chịu phục tùng” cố giữ sự phân biệt giữa εἴξαμεν và ὑποταγή mà không trở nên quá sát chữ.
