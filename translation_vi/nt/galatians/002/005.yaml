revisions:
- from: Chúng tôi không hề nhượng bộ mà chịu phục tùng họ, dù chỉ trong chốc lát[a], để chân lý của Tin Mừng được duy trì cho anh chị em.[b]
  to: Chúng tôi không hề nhượng bộ họ bằng cách chịu phục tùng, dù chỉ trong chốc lát[a], để chân lý của Tin Mừng vẫn còn cho anh chị em.[b]
  rationale: Bản sửa làm rõ rằng sự phục tùng là phương diện/cách thức của hành động nhượng bộ, không phải một mệnh đề phối hợp mơ hồ. Đồng thời, “vẫn còn” tránh thêm sắc thái bị động vào διαμείνῃ. Cách dịch chính “cho anh chị em” giữ cách hiểu πρὸς ὑμᾶς theo hướng ích lợi/hướng đến họ; chú thích bảo lưu cách hiểu không gian-quan hệ “ở với anh chị em.”
