  terminology: Giữ «ân điển», «sự công chính», «luật pháp» và «Đấng Mê-si». Các thuật ngữ này phù hợp văn mạch Phao-lô; «Đấng Mê-si» bảo toàn giá trị chức danh của Χριστός.
