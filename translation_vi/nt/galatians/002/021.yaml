id: GAL.2.21
reference: Galatians 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: vi
  text: Tôi không phế bỏ ân điển của Đức Chúa Trời; vì nếu sự công chính có được nhờ luật pháp, thì Đấng Mê-si đã chết vô ích.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã chết không vì lý do gì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: làm cho… thành vô hiệu
  rationale: Diễn đạt việc làm mất hiệu lực, phù hợp với sức nặng trong lập luận của Phao-lô hơn cách dịch nhẹ hơn như “gạt bỏ”.
- source_word: χάριν
  choice: ân điển
  rationale: Là cách diễn đạt quen thuộc, trang trọng cho ân huệ nhưng không của Đức Chúa Trời trong văn mạch Phao-lô.
- source_word: διὰ νόμου
  choice: đến qua luật pháp
  rationale: Bổ sung động từ được hàm ý trong tiếng Hy Lạp, đồng thời giữ ý nghĩa phương tiện của διά với sở hữu cách.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Giữ thuật ngữ chủ đạo của Phao-lô về tình trạng hay sự ngay thẳng trước Đức Chúa Trời mà không diễn giải rộng thêm.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Phản ánh chức danh “Đấng Được Xức Dầu” trong lập luận, thay vì xử lý Χριστός đơn thuần như tên riêng.
- source_word: δωρεὰν
  choice: vô ích
  rationale: Trong mệnh đề kết luận này, từ ngữ nói đến sự vô hiệu và không cần thiết của cái chết ấy nếu điều kiện trước là đúng.
theological_decisions:
- issue: Mối liên hệ giữa sự công chính và luật pháp
  choice: 'Giữ nguyên mệnh đề điều kiện: nếu sự công chính đến qua luật pháp, cái chết của Đấng Mê-si là vô ích.'
  alternative: Có thể hiểu δικαιοσύνη với sắc thái “công lý”, nhấn mạnh hành động sửa ngay của Đức Chúa Trời trong giao ước.
  rationale: Văn mạch trực tiếp ủng hộ ý về sự công chính không đến qua luật pháp, nhưng bản dịch không thêm những công thức thần học ngoài điều câu Hy Lạp phát biểu.
- issue: Giá trị ngữ cảnh của δωρεὰν
  choice: “vô ích”, nhấn mạnh sự không cần thiết hoặc không đạt mục đích trong lập luận phản chứng.
  alternative: “không vì lý do gì”, nhấn mạnh cái chết không có căn cứ hay nguyên cớ.
  rationale: Cả hai sắc thái đều có cơ sở từ vựng; văn mạch ưu tiên ý “vô ích”, còn khả năng kia được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” để thể hiện Χριστός như một chức danh; dùng “luật pháp” theo lối diễn đạt Kinh Thánh quen thuộc nhưng không thêm “Môi-se”, vì nguyên văn chỉ có νόμος.
