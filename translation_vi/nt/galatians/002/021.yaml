  source_fidelity: 'Bản dịch truyền đạt đúng lập luận phản chứng của câu: không vô hiệu hóa ân điển Đức Chúa Trời; nếu sự công chính có được qua luật pháp thì cái chết của Đấng Mê-si là vô ích. Tuy nhiên, cách diễn đạt «làm cho … thành vô hiệu» dài và có sắc thái gây tác động hơn động từ ἀθετῶ, vốn trực tiếp nói việc phế bỏ/đặt sang một bên.'
