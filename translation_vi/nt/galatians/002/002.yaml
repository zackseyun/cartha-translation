  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng các yếu tố chính của câu: việc đi lên do mặc khải, trình bày Tin Lành giữa dân ngoại, cuộc gặp riêng với những người được trọng vọng, và mối lo công khó trở nên vô ích. Tuy nhiên, “đó” trong “lên đó” thêm một quy chiếu địa điểm không có trong câu Hy Lạp; chú thích c lại đảo trật tự của hai động từ (“đang chạy” rồi “đã chạy”).'
  naturalness: “Tôi đã lên do một sự mặc khải” tự nhiên và trực tiếp hơn “tôi lên đó theo một sự mặc khải”. Cấu trúc gạch ngang vẫn giữ được sự chuyển ý của δέ và tính riêng tư của κατ’ ἰδίαν. “Uổng công” là cách nói hiện đại, phù hợp với εἰς κενόν.
  terminology: “Tin Lành”, “các dân ngoại”, “trình bày”, và “những người có uy tín” phù hợp văn mạch Phao-lô và không áp đặt cách hiểu về thẩm quyền. “Những người có uy tín” giữ được ý địa vị được thừa nhận của τοῖς δοκοῦσιν mà không xác định họ là một chức danh chính thức.
