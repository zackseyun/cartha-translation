id: GAL.2.2
reference: Galatians 2:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: vi
  text: Nhưng tôi đã lên do một sự mặc khải[a], và trình bày với họ Tin Lành mà tôi rao giảng giữa các dân ngoại—nhưng riêng với những người có uy tín[b]—vì e rằng bằng cách nào đó tôi đang chạy, hoặc đã chạy, uổng công[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo một sự mặc khải” hoặc “đáp lại một sự mặc khải”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những người được coi là quan trọng”.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “vì e rằng bằng cách nào đó tôi đang chạy hoặc đã chạy uổng công”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: tôi lên đó
  rationale: Động từ có nghĩa cơ bản là “đi lên”. “Đó” giúp câu tự nhiên trong tiếng Việt và quy chiếu đến địa điểm đã có trong ngữ cảnh, nhưng không thêm “Giê-ru-sa-lem” vào chính câu này.
- source_word: κατὰ ἀποκάλυψιν
  choice: theo một sự mặc khải
  rationale: 'Giữ được quan hệ rộng của κατά: chuyến đi diễn ra theo, do, hoặc đáp lại một sự mặc khải; chú thích nêu cách hiểu nguyên nhân trực tiếp.'
- source_word: ἀνεθέμην
  choice: trình bày với họ
  rationale: Diễn đạt việc đặt vấn đề trước người khác để họ xem xét, mà không hàm ý Phao-lô phải phục tùng họ để Tin Lành của ông được chuẩn nhận.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Lành
  rationale: Đây là cách gọi quen thuộc, trang trọng và súc tích trong tiếng Việt cho εὐαγγέλιον trong văn mạch thư Phao-lô.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: giữa các dân ngoại
  rationale: Trong văn mạch này, ἔθνη chỉ những người không thuộc dân Do Thái, chứ không chủ yếu nói đến các quốc gia theo nghĩa địa chính trị.
- source_word: κατ’ ἰδίαν
  choice: riêng
  rationale: Diễn đạt rõ việc trình bày trong phạm vi riêng tư, tương phản với việc nói trước một nhóm rộng hơn.
- source_word: τοῖς δοκοῦσιν
  choice: những người có uy tín
  rationale: Giữ ý họ là những người được nhìn nhận là quan trọng, nhưng không xác định quá mức chức vị hay loại bỏ sắc thái dè dặt có thể có của δοκέω.
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: vì e rằng bằng cách nào đó tôi đang chạy, hoặc đã chạy, uổng công
  rationale: Giữ hình ảnh “chạy”, sự lo ngại trong μή πως, và sự phân biệt giữa công việc đang diễn ra với công việc đã thực hiện.
theological_decisions:
- issue: Việc Phao-lô trình bày Tin Lành riêng với các nhân vật có uy tín có hàm ý ông xin họ phê chuẩn hay sửa chữa Tin Lành của mình không
  choice: Dùng “trình bày với họ”, giữ trung lập về thẩm quyền và mục đích đánh giá.
  alternative: “đệ trình cho họ” hoặc “chỉ báo cho họ biết”
  rationale: ἀνατίθημι cho biết Phao-lô đặt nội dung trước họ để xem xét, nhưng tự nó không đòi hỏi ý nghĩa ông ở địa vị giáo lý thấp hơn, cũng không loại trừ hoàn toàn yếu tố cân nhắc.
- issue: Cách hiểu τοῖς δοκοῦσιν
  choice: “những người có uy tín”, phản ánh địa vị được công nhận nhưng vẫn giữ phần nào sắc thái gián tiếp.
  alternative: “những người dường như có ảnh hưởng” hoặc “các lãnh đạo được công nhận”
  rationale: Cụm từ có thể mang sắc thái trung tính, kính trọng, hoặc hơi dè dặt; không nên quyết định thay văn bản rằng Phao-lô hoàn toàn xác nhận hay ngầm hạ thấp địa vị của họ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc chen giữa bằng gạch ngang giữ sự tương phản của δὲ và làm rõ rằng việc trình bày với các nhân vật có uy tín diễn ra riêng. Hình ảnh chạy đua được giữ nguyên vì là ẩn dụ quan trọng của Phao-lô.
