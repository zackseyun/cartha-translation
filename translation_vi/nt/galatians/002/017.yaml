revisions:
- from: Nhưng nếu trong khi tìm cách được tuyên là công chính trong Đấng Mê-si[a], chính chúng ta cũng bị nhận thấy là những người tội lỗi, vậy thì Đấng Mê-si là kẻ phục vụ tội lỗi sao? Tuyệt đối không!
  to: Nhưng nếu, trong khi tìm cách được tuyên là công chính trong Đấng Mê-si[a], chính chúng ta cũng bị nhận thấy là những người tội lỗi, vậy thì Đấng Mê-si là người phục vụ tội lỗi sao? Tuyệt đối không!
  rationale: Chỉ thay “kẻ phục vụ” bằng “người phục vụ” để tránh thêm sắc thái miệt thị không có trong διάκονος, đồng thời vẫn giữ nguyên lực chất vấn của câu và ý nghĩa toàn đoạn.
