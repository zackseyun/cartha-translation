id: GAL.2.17
reference: Galatians 2:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: vi
  text: Nhưng nếu, trong khi tìm cách được tuyên là công chính trong Đấng Mê-si[a], chính chúng ta cũng bị nhận thấy là những người tội lỗi, vậy thì Đấng Mê-si là người phục vụ tội lỗi sao? Tuyệt đối không!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô”; từ Hy Lạp có nghĩa là “Đấng được xức dầu.”'
    reason: Cung cấp cách gọi truyền thống quen thuộc cho Χριστός và giải thích ý nghĩa danh hiệu.
lexical_decisions:
- source_word: ζητοῦντες
  choice: trong khi tìm cách
  rationale: Diễn đạt phân từ hiện tại như hoàn cảnh xảy ra đồng thời với động từ chính, đồng thời giữ sắc thái chủ động theo đuổi mục tiêu.
- source_word: δικαιωθῆναι
  choice: được tuyên là công chính
  rationale: Giữ thể bị động và sắc thái pháp lý của động từ, nhưng dùng cách nói rõ nghĩa hơn cho độc giả Việt ngữ hiện đại.
- source_word: ἐν Χριστῷ
  choice: trong Đấng Mê-si
  rationale: Giữ giới từ ἐν và chiều kích liên hệ với Đấng Mê-si, không thu hẹp thành nghĩa phương tiện như “nhờ”.
- source_word: εὑρέθημεν
  choice: bị nhận thấy
  rationale: Giữ thể bị động và ý nghĩa được phát hiện hay chứng tỏ là như vậy, không xác định thêm ai là người nhận thấy.
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: chính chúng ta cũng ... là những người tội lỗi
  rationale: “Chính chúng ta” thể hiện sự nhấn mạnh của αὐτοὶ, còn “cũng” thể hiện καί.
- source_word: ἁμαρτίας διάκονος
  choice: kẻ phục vụ tội lỗi
  rationale: Diễn đạt quan hệ phục vụ hay thúc đẩy tội lỗi mà không gợi đến một chức vụ tôn giáo chính thức.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Một lời bác bỏ mạnh, tự nhiên trong tiếng Việt hiện đại, tương ứng với sức nặng của thành ngữ Hy Lạp.
theological_decisions:
- issue: Câu hỏi có hàm ý Đấng Mê-si gây ra hoặc phục vụ tội lỗi hay không
  choice: vậy thì Đấng Mê-si là kẻ phục vụ tội lỗi sao?
  alternative: vậy thì Đấng Mê-si trở thành kẻ phục vụ tội lỗi sao?
  rationale: Giữ nguyên lời suy luận mang tính chất vấn mà Phao-lô lập tức bác bỏ; không biến nó thành một lời khẳng định giáo lý, cũng không thêm lời giải thích về cách Đấng Mê-si có thể bị cáo buộc liên hệ với tội lỗi.
- issue: Quan hệ được biểu thị bởi ἐν Χριστῷ
  choice: trong Đấng Mê-si
  alternative: nhờ Đấng Mê-si
  rationale: “Trong” bảo tồn độ mở của ἐν, gồm khả năng chỉ sự liên hiệp, phạm vi hay căn cứ nơi Đấng Mê-si; “nhờ” sẽ nghiêng rõ hơn về phương tiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được tuyên là công chính” được chọn thay cho thuật ngữ cô đọng hơn “được xưng công chính” để làm rõ nghĩa pháp lý; “Đấng Mê-si” giữ chức năng danh hiệu của Χριστός. Câu hỏi tu từ và lời bác bỏ cuối câu được giữ mạnh, ngắn gọn.
