id: GAL.2.11
reference: Galatians 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: vi
  text: Nhưng khi Kê-pha đến An-ti-ốt[a], tôi đã phản đối ông ngay trước mặt ông, vì ông đáng bị khiển trách.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kê-pha là tên A-ram của Phi-e-rơ.
    reason: cross_reference
  - marker: b
    text: 'Hoặc: “vì rõ ràng ông đã sai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Nhưng khi
  rationale: Giữ cả ý chuyển thời gian của ὅτε và sắc thái tương phản nhẹ của δέ bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Κηφᾶς
  choice: Kê-pha
  rationale: Phiên âm tên xuất hiện trong bản Hy Lạp thay vì thay bằng tên quen thuộc hơn là Phi-e-rơ; chú thích nêu rõ hai tên chỉ cùng một người.
- source_word: ἦλθεν
  choice: đến
  rationale: Tương đương thông dụng, tự nhiên của động từ ἔρχομαι trong ngữ cảnh chuyển động đến một thành phố.
- source_word: εἰς Ἀντιόχειαν
  choice: đến An-ti-ốt
  rationale: Cách nói tự nhiên trong tiếng Việt về chuyển động hướng đến một thành phố.
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: công khai
  rationale: Truyền đạt ý đối diện trực tiếp, không né tránh hay hành động sau lưng. Cách dịch sát chữ hơn là “ngay trước mặt ông” có thể bị hiểu đơn thuần theo vị trí; ý trực diện được ghi nhận trong chú thích từ vựng.
- source_word: ἀντέστην
  choice: tôi đã ... chống lại ông
  rationale: Diễn đạt hành động phản đối trực tiếp của Phao-lô một cách rõ ràng và tự nhiên.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do Phao-lô chống lại Kê-pha.
- source_word: κατεγνωσμένος ἦν
  choice: ông đáng bị lên án
  rationale: Giữ sức nặng phán xét của καταγινώσκω và trạng thái kết quả của kết cấu phân từ hoàn thành với ἦν, đồng thời tránh hàm ý không có trong câu rằng một phiên tòa hay một người cụ thể đã chính thức kết án ông.
theological_decisions:
- issue: Danh tính và cách ghi Κηφᾶς
  choice: Giữ tên “Kê-pha” trong chính văn
  alternative: Dịch là “Phi-e-rơ” để người đọc dễ nhận ra
  rationale: Bản Hy Lạp dùng Κηφᾶς, nên chính văn giữ dạng tên này; chú thích cung cấp tên Phi-e-rơ quen thuộc hơn mà không thay thế hình thức của bản nguồn.
- issue: Sắc thái của κατεγνωσμένος ἦν
  choice: “ông đáng bị lên án”
  alternative: “ông rõ ràng đã sai” hoặc “ông đã bị kết án”
  rationale: Cách chọn giữ được sức nặng của ngôn ngữ lên án nhưng không xác định quá mức ai là người kết án. Phương án “rõ ràng đã sai” thiên về giải nghĩa; phương án “đã bị kết án” có thể gợi một phán quyết chính thức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Công khai chống lại” chuyển tải tính trực diện của cuộc đối chất; tên riêng được phiên âm nhất quán. Mọi chú thích đều có dấu tương ứng trong chính văn.
