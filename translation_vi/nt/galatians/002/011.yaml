review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng diễn tiến chính và giữ tên Κηφᾶς dưới dạng phiên âm. Tuy nhiên, “công khai” không tương đương đầy đủ với κατὰ πρόσωπον αὐτῷ, vốn nêu rõ sự đối mặt trực tiếp với người ấy, không chỉ là tính công khai. “Đáng bị lên án” có thể hiểu là đáng chịu một án phạt; “đáng bị khiển trách” phù hợp hơn với sắc thái bị quy trách/đáng trách của κατεγνωσμένος ἦν mà không hàm ý một thủ tục kết án chính thức.
  naturalness: “Tôi đã phản đối ông ngay trước mặt ông” là lối nói hiện đại, rõ ràng và tự nhiên; đồng thời giữ được hình ảnh trực diện của nguyên ngữ. “Đáng bị khiển trách” trang trọng vừa phải và dễ hiểu trong văn cảnh thư tín.
  terminology: Giữ “Kê-pha” theo hình thức tên trong tiếng Hy Lạp và chú thích nhận diện với Phi-e-rơ là phù hợp. “An-ti-ốt” và “A-ram” nhất quán với cách phiên âm của bản nháp. Không cần áp đặt diễn giải thần học về bản chất hay tác nhân của sự khiển trách.
  issues:
  - severity: medium
    issue: “công khai chống lại ông” thay cho κατὰ πρόσωπον αὐτῷ
    rationale: “Công khai” nói đến việc hành động trước công chúng, trong khi thành ngữ Hy Lạp nhấn mạnh Paul đối đầu trực tiếp, ‘mặt đối mặt’/‘ngay trước mặt’ Kê-pha. Hai ý có thể cùng xảy ra trong bối cảnh, nhưng tính công khai không được câu này khẳng định.
  - severity: low
    issue: “đáng bị lên án” có sắc thái pháp lý hoặc trừng phạt mạnh hơn cần thiết
    rationale: κατεγνωσμένος ἦν diễn tả tình trạng bị quy trách/đáng trách. “Đáng bị khiển trách” giữ sắc thái phê phán mà không gợi một bản án chính thức hoặc hình phạt.
  revised_text: Nhưng khi Kê-pha đến An-ti-ốt[a], tôi đã phản đối ông ngay trước mặt ông, vì ông đáng bị khiển trách.[b]
