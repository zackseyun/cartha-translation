revisions:
- from: Nhưng khi Kê-pha đến An-ti-ốt[a], tôi đã công khai chống lại ông, vì ông đáng bị lên án.[b]
  to: Nhưng khi Kê-pha đến An-ti-ốt[a], tôi đã phản đối ông ngay trước mặt ông, vì ông đáng bị khiển trách.[b]
  rationale: Bản sửa thay “công khai” bằng cách diễn đạt trực tiếp ý ‘ngay trước mặt ông’, bảo toàn thành ngữ κατὰ πρόσωπον αὐτῷ. Đồng thời, “đáng bị khiển trách” truyền đạt κατεγνωσμένος ἦν tự nhiên hơn trong tiếng Việt và tránh xác định quá mức về một phán quyết hay hình phạt. Chú thích b chỉ nêu phương án diễn giải từ vựng phổ biến, còn chính văn vẫn giữ ý quy trách gần với nguyên ngữ.
