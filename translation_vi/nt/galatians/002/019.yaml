base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: vi
  text: Vì nhờ luật pháp, tôi đã chết đối với luật pháp để sống cho Đức Chúa Trời. Tôi đã cùng bị đóng đinh vào thập tự giá với Đấng Mê-si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích và nối lập luận với câu trước một cách tự nhiên trong tiếng Việt.
- source_word: διὰ νόμου
  choice: nhờ luật pháp
  rationale: Diễn đạt διά với sở hữu cách theo nghĩa phương tiện; không thêm nội dung giải thích về cách luật pháp thực hiện điều này.
- source_word: νόμῳ
  choice: đối với luật pháp
  rationale: Thể hiện quan hệ được diễn tả bằng tặng cách trong thành ngữ 'chết đối với', tức mối liên hệ trước kia đã bị cắt đứt.
- source_word: ἀπέθανον
  choice: tôi đã chết
  rationale: Diễn tả động từ aorist như một biến cố dứt khoát trong quá khứ.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt mục đích ngắn gọn và tự nhiên.
- source_word: θεῷ ζήσω
  choice: sống cho Đức Chúa Trời
  rationale: Trong tiếng Việt, 'sống cho Đức Chúa Trời' truyền đạt tự nhiên hướng quy chiếu và quan hệ của tặng cách θεῷ; cách dịch máy móc 'sống đối với' khó hiểu.
- source_word: Χριστῷ
  choice: Đấng Mê-si
  rationale: Giữ nghĩa tước hiệu của Χριστός trong ngữ cảnh này thay vì chỉ phiên chuyển thành một tên riêng.
- source_word: συνεσταύρωμαι
  choice: tôi đã bị đóng đinh vào thập tự giá cùng
  rationale: 'Thể hiện thể bị động và thì hoàn thành: một biến cố đã xảy ra với kết quả còn hiệu lực; ''đã bị'' là cách diễn đạt tự nhiên, còn ngữ cảnh tiếp theo cho thấy hệ quả vẫn tồn tại.'
theological_decisions:
- issue: Có nên giải thích thêm nghịch lý 'nhờ luật pháp... chết đối với luật pháp' hay không
  choice: Giữ nguyên cách nói cô đọng và căng thẳng thần học của nguyên văn.
  alternative: Mở rộng thành 'nhờ sự kết án của luật pháp, tôi đã chết đối với luật pháp' hoặc 'tôi không còn phải tuân giữ luật pháp để được xưng công chính'.
  rationale: Nguyên văn không nói rõ cơ chế hay giới hạn ý nghĩa theo những cách ấy; thêm vào sẽ biến một cách giải nghĩa thành nội dung bản dịch.
- issue: Sắc thái của θεῷ ζήσω
  choice: Dịch là 'sống cho Đức Chúa Trời'.
  alternative: Dịch sát hình thức là 'sống đối với Đức Chúa Trời'.
  rationale: Cách đã chọn là tiếng Việt tự nhiên và vẫn bảo toàn hướng quy chiếu về Đức Chúa Trời, không thu hẹp câu thành chỉ phục vụ hay làm việc hữu ích cho Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'luật pháp' để phù hợp ngữ cảnh Phao-lô; dùng 'Đấng Mê-si' cho tước hiệu Χριστός. Không thêm chú thích vì bản văn ngắn và không có dị bản cần nêu.
