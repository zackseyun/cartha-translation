id: GAL.2.9
reference: Galatians 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: vi
  text: Khi nhận biết ân điển đã được ban cho tôi, Gia-cơ, Sê-pha[a] và Giăng—những người được coi là các trụ cột—đã bắt tay với tôi và Ba-na-ba để bày tỏ sự hiệp thông[b], để chúng tôi đến với các dân ngoại[c], còn họ đến với những người chịu cắt bì[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sê-pha là dạng tên A-ram của Phi-e-rơ.
    reason: name_clarification
  - marker: b
    text: 'Sát chữ: “đã trao cho tôi và Ba-na-ba những tay phải của sự hiệp thông”; đây là cử chỉ công nhận và đồng thuận.'
    reason: idiom_and_grammatical_form
  - marker: c
    text: 'Cũng có thể dịch: “các dân” hoặc “các nước”; trong ngữ cảnh này, từ ấy chỉ những người không phải Do Thái.'
    reason: lexical_alternative
  - marker: d
    text: 'Sát chữ: “sự cắt bì”, một cách gọi hoán dụ chỉ người Do Thái.'
    reason: metonymy_clarification
lexical_decisions:
- source_word: γνόντες
  choice: sau khi nhận biết
  rationale: Phân từ bất định quá khứ nêu cơ sở có trước cho hành động bắt tay; “nhận biết” bao hàm cả nhận ra và công nhận.
- source_word: χάριν
  choice: ân điển
  rationale: Giữ phạm vi nghĩa rộng về ân huệ của Đức Chúa Trời trong sự kêu gọi và chức vụ của Phao-lô, không thu hẹp thành một nhiệm vụ riêng.
- source_word: Κηφᾶς
  choice: Sê-pha
  rationale: Phiên âm đúng tên được dùng trong bản Hy Lạp, thay vì âm thầm thay bằng tên quen thuộc hơn là Phi-e-rơ.
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: những người được coi là các trụ cột
  rationale: Diễn đạt địa vị được nhìn nhận công khai, đồng thời tránh gán cho lời của Phao-lô sắc thái xem thường không tất yếu.
- source_word: δεξιὰς ... κοινωνίας
  choice: bắt tay ... để xác nhận sự hiệp thông
  rationale: Chuyển thành ngữ chỉ việc trao tay phải sang cách nói tự nhiên trong tiếng Việt, đồng thời giữ κοινωνία là sự hiệp thông và cộng tác được chính thức công nhận.
- source_word: ἔθνη
  choice: các dân ngoại
  rationale: Trong mạch văn Ga-la-ti, từ này chủ yếu chỉ những người không thuộc dân Do Thái, dù nghĩa sát chữ là “các dân/các nước”.
- source_word: περιτομήν
  choice: những người chịu cắt bì
  rationale: Danh từ được dùng hoán dụ để chỉ người Do Thái; cách dịch này giữ hình ảnh cắt bì và làm rõ rằng từ ấy chỉ một nhóm người.
theological_decisions:
- issue: Ý nghĩa của κοινωνία trong cử chỉ trao tay phải
  choice: sự hiệp thông
  alternative: sự hợp tác
  rationale: “Sự hiệp thông” giữ được chiều rộng của κοινωνία—mối liên kết, sự nhìn nhận và việc cùng dự phần trong sứ mạng—thay vì chỉ giới hạn vào một thỏa thuận công tác.
- issue: Mức độ phân công sứ mạng trong ἵνα ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν
  choice: theo đó chúng tôi sẽ đến với các dân ngoại, còn họ sẽ đến với những người chịu cắt bì
  alternative: để chúng tôi chỉ đến với dân ngoại, còn họ chỉ đến với người chịu cắt bì
  rationale: Nguyên văn nêu hai hướng sứ mạng nhưng không có từ “chỉ”; bản dịch không biến sự phân công thành một giới hạn tuyệt đối.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ “ân điển” để giữ chiều sâu thần học của χάρις; các hình ảnh “trụ cột” và “cắt bì” được bảo tồn. Thành ngữ trao tay phải được diễn đạt tự nhiên là “bắt tay ... để xác nhận sự hiệp thông”, với dạng sát chữ được ghi ở chú thích.
