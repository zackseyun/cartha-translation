  terminology: Giữ 'Tin Mừng', 'Phi-e-rơ', và cặp định danh theo cắt bì, không diễn giải thành 'dân ngoại/người Do Thái'. Chú thích sát nghĩa vẫn hữu ích để cho thấy hai cụm genitive trong tiếng Hy Lạp.
