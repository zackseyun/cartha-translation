id: GAL.2.7
reference: Galatians 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/007.yaml
  text: But on the contrary[a], when they saw that I had been entrusted with the gospel for the uncircumcised, just as Peter had been for the circumcised,
translation:
  language: vi
  text: Trái lại, khi họ thấy rằng tôi đã được giao phó Tin Mừng cho những người không cắt bì, cũng như Phi-e-rơ được giao phó Tin Mừng cho những người đã chịu cắt bì,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Tin Mừng của sự không cắt bì … của sự cắt bì,” tức là Tin Mừng được giao phó để rao truyền cho hai nhóm ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: Trái lại
  rationale: Hai từ cùng tạo một sự tương phản mạnh với ý trước; “Trái lại” diễn đạt tự nhiên mà không lặp ý.
- source_word: ἰδόντες
  choice: khi họ thấy rằng
  rationale: Phân từ bất định nêu hoàn cảnh dẫn đến sự nhìn nhận; mệnh đề thời gian rõ và tự nhiên trong tiếng Việt.
- source_word: πεπίστευμαι
  choice: tôi đã được giao phó
  rationale: Thể hoàn thành bị động của πιστεύω ở đây chỉ việc được trao một trọng trách; cách dịch này giữ cả ý thụ động lẫn kết quả còn hiệu lực.
- source_word: τὸ εὐαγγέλιον
  choice: Tin Mừng
  rationale: Thuật ngữ quen thuộc, trang trọng và dễ hiểu trong tiếng Việt hiện đại cho εὐαγγέλιον.
- source_word: τῆς ἀκροβυστίας
  choice: cho những người không chịu cắt bì
  rationale: Diễn đạt đối tượng của sứ mạng một cách rõ ràng, đồng thời giữ nguyên dấu chỉ giao ước-dân tộc mà bản Hy Lạp sử dụng.
- source_word: καθὼς
  choice: cũng như
  rationale: Thể hiện trực tiếp sự song song giữa sứ mạng của Phao-lô và của Phi-e-rơ.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τῆς περιτομῆς
  choice: cho những người chịu cắt bì
  rationale: Tạo thế cân xứng với “những người không chịu cắt bì” và không diễn giải rộng thành “người Do Thái”.
- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: được giao phó Tin Mừng
  rationale: Bổ sung thành phần được ngầm lặp lại từ vế đầu để câu tiếng Việt đầy đủ, không thêm một ý mới.
theological_decisions:
- issue: Có nên chuyển ἀκροβυστία / περιτομή thành các danh xưng dân tộc “dân ngoại” / “người Do Thái” hay giữ cách định danh theo việc cắt bì.
  choice: những người không chịu cắt bì / những người chịu cắt bì
  alternative: dân ngoại / người Do Thái; sự không cắt bì / sự cắt bì
  rationale: Bản Hy Lạp định danh hai nhóm bằng dấu chỉ cắt bì. Giữ cách diễn đạt ấy bảo toàn khung tư tưởng của Phao-lô và tránh đồng nhất hoàn toàn các thuật ngữ với những phạm trù dân tộc rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Trái lại” để tránh cấu trúc tương phản rườm rà; giữ cặp diễn đạt cân xứng “không chịu cắt bì / chịu cắt bì.”
