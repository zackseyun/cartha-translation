id: GAL.2.16
reference: Galatians 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: vi
  text: Nhưng vì biết rằng một người không được xưng công chính bởi các việc làm của luật pháp, mà chỉ nhờ đức tin nơi Đức Giê-su, Đấng Mê-si[a], nên chính chúng ta cũng đã tin nơi Đấng Mê-si Giê-su, để được xưng công chính bởi đức tin nơi Đấng Mê-si[b], chứ không bởi các việc làm của luật pháp, vì bởi các việc làm của luật pháp, không một người phàm nào[c] sẽ được xưng công chính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhờ sự thành tín của Đức Giê-su, Đấng Mê-si.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “bởi sự thành tín của Đấng Mê-si.”'
    reason: alternative_reading
  - marker: c
    text: 'Sát nghĩa: “không một xác thịt nào.” Đây là thành ngữ chỉ không một người phàm nào.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: được xưng công chính
  rationale: Giữ nhất quán sắc thái pháp đình của động từ trong cả ba lần xuất hiện, đồng thời dùng cách diễn đạt thần học quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Diễn đạt tự nhiên giá trị khái quát của danh từ số ít; tiếng Việt không cần đánh dấu giống ngữ pháp như tiếng Hy Lạp.
- source_word: ἐξ ἔργων νόμου
  choice: bởi các việc làm của luật pháp
  rationale: Bảo toàn cụm từ đặc trưng của Phao-lô, không mở rộng thành 'việc lành' hay thu hẹp thành một cách hiểu giáo phái.
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: nhờ đức tin nơi Đức Giê-su, Đấng Mê-si
  rationale: Chọn cách hiểu sở hữu cách khách thể trong chính văn; 'nhờ' thể hiện phương tiện của διά, còn cách hiểu 'sự thành tín của' được giữ trong chú thích.
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: chúng ta cũng đã tin nơi Đấng Mê-si Giê-su
  rationale: Diễn đạt πιστεύω εἰς bằng tiếng Việt tự nhiên và giữ thì quá khứ của hành động; trật tự danh xưng phản ánh Χριστὸν Ἰησοῦν.
- source_word: ἐκ πίστεως Χριστοῦ
  choice: bởi đức tin nơi Đấng Mê-si
  rationale: Nhất quán với cụm πίστεως Ἰησοῦ Χριστοῦ trước đó, đồng thời ghi nhận cách hiểu sở hữu cách chủ thể trong chú thích.
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Dịch ý tước hiệu Χριστός thay vì chỉ phiên âm; cách viết hoa và danh xưng phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: πᾶσα σάρξ
  choice: không một người phàm nào
  rationale: Chuyển thành ngữ phủ định theo cách tự nhiên trong tiếng Việt và truyền đạt σάρξ ở đây là loài người trong thân phận phàm nhân; nghĩa sát chữ được ghi chú.
- source_word: εἰδότες δὲ
  choice: Nhưng vì biết rằng
  rationale: Giữ lực chuyển ý nhẹ của δέ và thể hiện quan hệ hoàn cảnh/nguyên nhân của phân từ εἰδότες trong một câu tiếng Việt trôi chảy.
- source_word: ἐὰν μὴ
  choice: mà chỉ nhờ
  rationale: Trong cấu trúc phủ định này, cách diễn đạt nêu rõ sự tương phản và phương tiện duy nhất mà không làm câu tiếng Việt gượng gạo.
theological_decisions:
- issue: Ý nghĩa của πίστεως Ἰησοῦ Χριστοῦ / πίστεως Χριστοῦ
  choice: đức tin nơi Đức Giê-su, Đấng Mê-si / đức tin nơi Đấng Mê-si
  alternative: sự thành tín của Đức Giê-su, Đấng Mê-si / sự thành tín của Đấng Mê-si
  rationale: Sở hữu cách Hy Lạp có thể được hiểu theo khách thể hoặc chủ thể. Chính văn chọn cách hiểu khách thể phổ biến, nhưng chú thích bảo toàn cách hiểu chủ thể có căn cứ.
- issue: Sắc thái của δικαιόω
  choice: được xưng công chính
  alternative: được kể là công chính / được tuyên bố là công chính
  rationale: Cách dịch đã chọn giữ sắc thái pháp đình và sự nhất quán trong câu mà không giải quyết quá mức toàn bộ nội hàm thần học của thuật ngữ.
- issue: Quan hệ giữa việc làm của luật pháp và đức tin trong ἐὰν μὴ
  choice: không... mà chỉ nhờ đức tin
  alternative: không... ngoại trừ nhờ đức tin
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt thể hiện sự đối lập của câu. Nó không hàm ý rằng đức tin là một loại 'việc làm của luật pháp'.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “Đấng Mê-si” cho văn phong tôn kính; giữ cụm “các việc làm của luật pháp” và thuật ngữ “được xưng công chính” để bảo toàn ngôn ngữ lập luận của Phao-lô. Các dấu chú thích [a], [b], [c] đều xuất hiện ngay sau cụm từ liên quan.
