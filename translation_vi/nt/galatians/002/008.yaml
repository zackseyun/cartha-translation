source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: vi
  text: Vì Đấng đã hành động qua Phi-e-rơ cho chức vụ sứ đồ dành cho những người chịu cắt bì[a] cũng đã hành động qua tôi cho các dân ngoại.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “cho chức vụ sứ đồ của sự cắt bì.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “cho các dân tộc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: đã hành động / cũng hành động
  rationale: Giữ sự lặp lại có chủ ý của cùng một động từ Hy Lạp và thế song song giữa chức vụ của Phi-e-rơ với chức vụ của Phao-lô; cách diễn đạt không xác định quá mức phương thức tác động của Đức Chúa Trời.
- source_word: Πέτρῳ / ἐμοὶ
  choice: qua Phi-e-rơ / qua tôi
  rationale: 'Hiểu các cách dữ cách theo nghĩa công cụ trong văn cảnh: Đấng ấy hành động qua Phi-e-rơ và qua Phao-lô trong chức vụ của họ.'
- source_word: εἰς ἀποστολὴν
  choice: để ông/tôi làm sứ đồ
  rationale: Diễn đạt tự nhiên bằng tiếng Việt ý hướng đến chức vụ sứ đồ, đồng thời bổ sung ở vế thứ hai theo cấu trúc tỉnh lược của nguyên văn để làm rõ sự song song.
- source_word: τῆς περιτομῆς
  choice: cho những người chịu cắt bì
  rationale: Thể sở hữu trong nguyên văn dùng phép hoán dụ chỉ cộng đồng người Do Thái đã chịu cắt bì; bản dịch giữ hình ảnh cắt bì thay vì thay hoàn toàn bằng 'người Do Thái'.
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong thế đối lập với những người chịu cắt bì, cụm từ chỉ các dân không thuộc dân Do Thái; 'các dân ngoại' vừa rõ nghĩa vừa còn phản ánh số nhiều của nguyên văn.
theological_decisions:
- issue: Có nên nêu rõ chủ thể là Đức Chúa Trời hay không
  choice: Đấng đã hành động
  alternative: Đức Chúa Trời, Đấng đã hành động
  rationale: Nguyên văn dùng phân từ có mạo từ, nghĩa sát là 'Đấng/người đã hành động', chứ không nêu danh từ 'Đức Chúa Trời'. Dùng 'Đấng' giữ chủ thể thần linh được hàm ý trong văn cảnh mà không thêm một danh xưng không có trong câu.
- issue: Mức độ đối xứng giữa sứ vụ của Phi-e-rơ và Phao-lô
  choice: cũng hành động qua tôi để tôi làm sứ đồ
  alternative: cũng hành động qua tôi cho các dân ngoại
  rationale: Nguyên văn tỉnh lược 'chức vụ sứ đồ' ở vế thứ hai nhưng cấu trúc song song cho thấy cụm này được hiểu ngầm. Khôi phục bằng tiếng Việt giúp câu tự nhiên mà không tạo khác biệt về bản chất giữa hai sứ vụ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Phi-e-rơ” theo lối phiên âm Kinh Thánh quen thuộc; giữ “chịu cắt bì” và “các dân ngoại” để bảo toàn thế đối lập đặc trưng trong lập luận của Phao-lô.
