id: GAL.2.3
reference: Galatians 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: vi
  text: Nhưng ngay cả Tít, người đi cùng tôi, dù là người Hy Lạp[a], cũng không bị ép phải chịu cắt bì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người Hy Lạp” ở đây hàm ý Tít là người ngoại chưa cắt bì; tuy nhiên, nguyên văn nói cụ thể là “người Hy Lạp,” chứ không chỉ nói chung là “người ngoại.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Diễn tả sự tương phản với mạch văn trước đó bằng liên từ đối lập tự nhiên và ngắn gọn trong tiếng Việt.
- source_word: οὐδὲ
  choice: ngay cả ... cũng không
  rationale: Cấu trúc này bảo toàn sắc thái phủ định nhấn mạnh, tập trung vào trường hợp của Tít.
- source_word: Τίτος
  choice: Tít
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ὁ σὺν ἐμοί
  choice: người đi cùng tôi
  rationale: Diễn đạt rõ chức năng định danh của mạo từ kèm cụm giới từ mà không thêm ý như 'người bạn đồng hành'.
- source_word: Ἕλλην ὤν
  choice: dù là người Hy Lạp
  rationale: Trong ngữ cảnh, phân từ mang sắc thái nhượng bộ; 'dù là' chuyển tải tự nhiên sắc thái ấy nhưng vẫn giữ nguyên chỉ định dân tộc-văn hóa.
- source_word: Ἕλλην
  choice: người Hy Lạp
  rationale: Giữ nghĩa cụ thể của từ Hy Lạp thay vì khái quát hóa thành 'dân ngoại'.
- source_word: ἠναγκάσθη
  choice: bị ép
  rationale: Thể bị động chỉ áp lực hoặc cưỡng ép từ bên ngoài; cách nói này tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: περιτμηθῆναι
  choice: phải chịu cắt bì
  rationale: Diễn đạt minh bạch hành động cắt bì; 'chịu' phù hợp với việc Tít là người tiếp nhận hành động, còn 'phải' gắn tự nhiên với ý bị ép.
theological_decisions:
- issue: Dịch Ἕλλην theo căn tính dân tộc-văn hóa hay theo lối gọi tắt mang tính diễn giải tôn giáo
  choice: người Hy Lạp
  alternative: người ngoại / dân ngoại
  rationale: Nguyên văn gọi Tít là người Hy Lạp. Trong ngữ cảnh, điều này hàm ý ông là người ngoại chưa cắt bì, nhưng bản dịch chính nên giữ cách gọi cụ thể của nguồn thay vì thay bằng phạm trù rộng hơn.
- issue: Sắc thái của cụm phân từ Ἕλλην ὤν
  choice: dù là người Hy Lạp
  alternative: vốn là người Hy Lạp / là người Hy Lạp
  rationale: 'Mạch lập luận hỗ trợ sắc thái nhượng bộ: dù Tít là người Hy Lạp, ông vẫn không bị ép cắt bì. Cách dịch này nêu rõ quan hệ ngầm mà không giải quyết thêm bất kỳ vấn đề thần học nào.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc 'ngay cả ... cũng không' giữ được trọng âm của οὐδὲ; câu tránh thuật ngữ giáo phái và không diễn giải vượt quá nguyên văn.
