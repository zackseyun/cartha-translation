id: GAL.2.4
reference: Galatians 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: vi
  text: Nhưng vì những anh em giả hiệu[a] đã được bí mật đưa vào, là những kẻ lẻn vào để do thám sự tự do mà chúng ta có trong Đấng Mê-si-a Giê-su[b], nhằm bắt chúng ta làm nô lệ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em giả hiệu” giữ cách gọi mang tính gia đình của Phao-lô; cụm từ chỉ những người tự nhận hoặc tỏ ra là anh em cùng đức tin.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “Đấng Christ Giê-su.”
    reason: alternative_rendering
lexical_decisions:
- source_word: παρεισάκτους
  choice: đã được bí mật đưa vào
  rationale: Diễn đạt sắc thái những người từ bên ngoài được đưa vào một cách kín đáo, đồng thời phân biệt với động từ παρεισῆλθον theo sau.
- source_word: ψευδαδέλφους
  choice: những anh em giả hiệu
  rationale: Giữ hình ảnh gia đình và sức công kích trong cách gọi của Phao-lô, thay vì diễn giải thành một thuật ngữ giáo lý rộng hơn.
- source_word: παρεισῆλθον
  choice: lẻn vào
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, thể hiện rõ hành động thâm nhập kín đáo.
- source_word: κατασκοπῆσαι
  choice: để do thám
  rationale: Giữ sắc thái dò xét bí mật với ý đồ thù nghịch, mạnh hơn cách dịch trung tính như “quan sát”.
- source_word: ἐλευθερίαν
  choice: sự tự do
  rationale: Tương đương thông dụng, rõ nghĩa, giữ được sức nặng thần học và xã hội của từ Hy Lạp.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός theo nghĩa tước hiệu và phiên âm tên Ἰησοῦ, giúp người đọc vẫn nhận ra lời tuyên xưng Giê-su là Đấng Mê-si-a.
- source_word: καταδουλώσουσιν
  choice: bắt chúng ta làm nô lệ
  rationale: Diễn đạt trực tiếp hành động cưỡng ép người khác vào thân phận nô lệ, tự nhiên hơn động từ Hán-Việt ít thông dụng.
- source_word: ἵνα ... καταδουλώσουσιν
  choice: nhằm bắt chúng ta làm nô lệ
  rationale: Thể hiện quan hệ mục đích của ἵνα, nhưng không nhấn quá mức sự thành công của ý đồ; giữ câu dang dở nối sang mạch văn kế tiếp.
theological_decisions:
- issue: Dịch Χριστῷ như một tước hiệu hay dạng gần với tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Ngữ cảnh vẫn cho phép nghe rõ nghĩa tước hiệu của Χριστός. “Đấng Mê-si-a” truyền đạt chức danh thay vì biến từ này thành một thành phần giống họ tên.
- issue: Cách gọi ψευδαδέλφους
  choice: những anh em giả hiệu
  alternative: những tín hữu giả
  rationale: 'Giữ nguyên ẩn dụ gia đình và sự căng thẳng trong lời Phao-lô: họ mang danh nghĩa anh em, nhưng ông phủ nhận tính chân thật của danh nghĩa ấy, không định nghĩa chi tiết tình trạng thuộc linh của họ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc câu chưa hoàn tất bằng dấu gạch ngang vì câu Hy Lạp tiếp tục lập luận từ ngữ cảnh lân cận. Dùng “lẻn vào”, “do thám” và “làm nô lệ” để bảo toàn chuỗi hình ảnh thâm nhập, dò xét và áp bức.
