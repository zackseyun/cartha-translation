  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: lý do đối nghịch (διὰ δὲ), “những anh em giả hiệu” được đưa vào kín đáo, hành động lẻn vào để do thám, sự tự do trong Đấng Mê-si-a Giê-su, và mục đích áp đặt thân phận nô lệ. Dấu gạch ngang cũng bảo tồn đúng tính dang dở của mệnh đề trong văn mạch.'
  naturalness: 'Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Tuy nhiên, trong quan hệ bổ nghĩa cho “sự tự do”, cần có từ nối “mà”: “sự tự do mà chúng ta có”. Nếu không, cụm này hơi gượng trong văn viết chuẩn.'
