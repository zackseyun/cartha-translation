  - severity: low
    issue: “Bị lôi cuốn theo” ít tự nhiên hơn “bị cuốn theo.”
    rationale: Cả hai đều có thể diễn đạt συναπήχθη, nhưng “bị cuốn theo” là lối nói thông dụng, vẫn giữ thể bị động và sắc thái bị tác động bởi người khác.
