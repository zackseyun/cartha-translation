  text: καὶ συνυπεκρίθησαν αὐτῷ ⸀καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/013.yaml
  text: And the rest of the Jews also joined him in hypocrisy[b][a], so that even Barnabas was carried away by their hypocrisy.
translation:
  language: vi
  text: Những người Do Thái còn lại cũng đã cùng ông giả hình, đến nỗi ngay cả Ba-na-ba cũng bị cuốn theo sự giả hình của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị sự giả hình của họ cuốn đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: cũng cùng ông hành xử giả hình
  rationale: Cách dịch này giữ được ý cùng tham gia trong tiền tố σύν-, đồng thời diễn đạt hành vi giả hình chứ không chỉ một thái độ không thành thật ở bên trong.
- source_word: αὐτῷ
  choice: cùng ông
  rationale: Đại từ ở cách dữ cách biểu thị sự liên kết với hành động của Phi-e-rơ; tiếng Việt diễn đạt tự nhiên bằng “cùng ông”.
- source_word: οἱ λοιποὶ Ἰουδαῖοι
  choice: những người Do Thái còn lại
  rationale: “Còn lại” nêu rõ đây là những thành viên khác của nhóm đang được nói đến, trong sự phân biệt với Phi-e-rơ.
- source_word: συναπήχθη
  choice: bị lôi cuốn theo
  rationale: Giữ thể bị động và sắc thái bị ảnh hưởng, cuốn theo bởi hành vi tập thể của những người khác.
- source_word: ὑποκρίσει
  choice: sự giả hình
  rationale: Đây là cách gọi rõ ràng, quen thuộc cho hành vi che giấu hoặc làm ra vẻ trái với điều thực sự được thừa nhận; việc lặp lại ý “giả hình” phản ánh sự nhấn mạnh của câu Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hành xử giả hình” để tránh cách kết hợp kém tự nhiên “tham gia vào sự giả hình”; dùng “bị lôi cuốn theo” để giữ cả thể bị động lẫn áp lực xã hội hàm ý trong động từ Hy Lạp.
