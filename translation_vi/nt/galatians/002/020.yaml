id: GAL.2.20
reference: Galatians 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: vi
  text: Tôi sống, nhưng không còn chính tôi sống nữa; Đấng Mê-si sống trong tôi. Sự sống mà nay tôi sống trong xác thịt, tôi sống bởi đức tin nơi Con Đức Chúa Trời[a], là Đấng đã yêu tôi và trao chính mình vì tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi sự thành tín của Con Đức Chúa Trời.”'
    reason: Cụm sở hữu cách Hy Lạp có thể chỉ đối tượng của đức tin hoặc chủ thể thể hiện sự thành tín.
lexical_decisions:
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Dịch Χριστός như một tước hiệu chỉ Đấng được xức dầu, thay vì dùng dạng phiên âm “Christ”; cách diễn đạt này tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ζῶ δὲ οὐκέτι ἐγώ
  choice: Tôi sống, nhưng không còn là tôi nữa
  rationale: 'Giữ trật tự và sự nhấn mạnh của câu Hy Lạp: Phao-lô vẫn sống, nhưng chủ thể định hướng đời sống ấy không còn là cái tôi trước kia. Cách dịch này cũng nối tự nhiên với mệnh đề tương phản tiếp theo.'
- source_word: ὃ δὲ νῦν ζῶ
  choice: Sự sống mà nay tôi sống
  rationale: Cấu trúc đại từ quan hệ trung tính trong tiếng Hy Lạp mang tính tỉnh lược; thêm “sự sống” để câu tiếng Việt rõ và tự nhiên mà không bổ sung ý giải thích ngoài văn bản.
- source_word: ἐν σαρκί
  choice: trong xác thịt
  rationale: Giữ thuật ngữ quan trọng σάρξ và nghĩa về đời sống hiện tại trong thân phận thể xác; không diễn giải thành “bản tính tội lỗi,” điều mà ngữ cảnh này không nói rõ.
- source_word: ἐν πίστει
  choice: bởi đức tin
  rationale: Dùng nghĩa thông thường của πίστις là “đức tin”; sự mơ hồ do cụm sở hữu cách theo sau được bảo lưu bằng chú thích.
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: nơi Con Đức Chúa Trời
  rationale: 'Bản văn chính hiểu sở hữu cách theo nghĩa đối tượng: đức tin hướng đến Con Đức Chúa Trời. Đây là cách diễn đạt rõ, tự nhiên trong tiếng Việt, trong khi cách hiểu chủ thể được ghi ở chú thích.'
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: trao chính mình vì tôi
  rationale: Diễn đạt tự nhiên hành động tự nguyện hiến mình của παραδιδόναι ἑαυτόν, đồng thời giữ trực tiếp cụm ὑπὲρ ἐμοῦ là “vì tôi.”
theological_decisions:
- issue: Ý nghĩa của πίστις với sở hữu cách trong τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: bởi đức tin nơi Con Đức Chúa Trời
  alternative: bởi sự thành tín của Con Đức Chúa Trời
  rationale: Cấu trúc Hy Lạp có thể được hiểu theo nghĩa đối tượng—đức tin của Phao-lô đặt nơi Con Đức Chúa Trời—hoặc theo nghĩa chủ thể—sự thành tín của Con Đức Chúa Trời. Bản chính dùng cách hiểu phổ biến, dễ hiểu hơn nhưng chú thích bảo lưu cách hiểu còn lại, không tuyệt đối hóa vấn đề.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đấng Mê-si” như tước hiệu; giữ “xác thịt” để bảo toàn thuật ngữ thần học của Phao-lô nhưng không diễn giải quá mức. Dấu chấm phẩy làm rõ thế tương phản giữa cái tôi và Đấng Mê-si.
