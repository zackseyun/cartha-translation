  to: Vì trước khi một số người từ Gia-cơ[a] đến, ông vẫn thường ăn chung với những người ngoại; nhưng khi họ đến, ông bắt đầu lui lại và tự tách mình ra, vì sợ những người thuộc giới cắt bì[b].
  rationale: Chỉ thay «từ chỗ Gia-cơ» bằng «từ Gia-cơ» để tiếng Việt tự nhiên và sát chức năng quan hệ/nguồn gốc của ἀπό hơn, không hàm ý sự ủy nhiệm chính thức. Chú thích được điều chỉnh nhẹ để nêu phương án thay thế tự nhiên hơn và duy trì đúng sự mơ hồ của nguyên văn.
