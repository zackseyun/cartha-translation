    rationale: «Chỗ» thường chỉ địa điểm trong tiếng Việt, nên có thể làm lệch trọng tâm quan hệ/nguồn gốc của cụm Hy Lạp. «Từ Gia-cơ» là cách nói tự nhiên hơn; chú thích tiếp tục bảo vệ sự mơ hồ về việc có phải Gia-cơ chính thức sai phái họ hay không.
