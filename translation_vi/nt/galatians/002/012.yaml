  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của câu Hy Lạp: thời điểm «trước khi», tính không xác định của τινας, thói quen quá khứ của συνήσθιεν, sự rút lui/tự tách mình, và động cơ sợ hãi. Tuy nhiên, «từ chỗ Gia-cơ» dễ gợi một địa điểm vật lý và không phải cách diễn đạt tự nhiên cho ἀπὸ Ἰακώβου trong ngữ cảnh này.'
