  terminology: «Người ngoại», «ăn chung», và «giới cắt bì» phù hợp với ngữ cảnh Phao-lô và giữ được tính không áp đặt của nguyên văn. «Những người thuộc giới cắt bì» là cách diễn đạt chấp nhận được cho τοὺς ἐκ περιτομῆς.
  issues:
