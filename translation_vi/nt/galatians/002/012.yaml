id: GAL.2.12
reference: Galatians 2:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ⸀ἦλθον, ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: vi
  text: Vì trước khi một số người từ Gia-cơ[a] đến, ông vẫn thường ăn chung với những người ngoại; nhưng khi họ đến, ông bắt đầu lui lại và tự tách mình ra, vì sợ những người thuộc giới cắt bì[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ nhóm của Gia-cơ”. Tiếng Hy Lạp tự nó không cho biết Gia-cơ có chính thức sai họ đến hay không.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “phe cắt bì”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν
  choice: Vì trước khi ... đến
  rationale: Diễn đạt tự nhiên cấu trúc thời gian với πρό và động từ nguyên mẫu có mạo từ, đồng thời giữ liên từ giải thích γάρ.
- source_word: τινας
  choice: một số người
  rationale: Giữ tính không xác định của đại từ số nhiều chỉ người; đây là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπὸ Ἰακώβου
  choice: từ chỗ Gia-cơ
  rationale: Giữ ý nguồn gốc hoặc mối liên hệ mà không khẳng định Gia-cơ chính thức sai phái hay tán thành họ.
- source_word: μετὰ τῶν ἐθνῶν
  choice: với những người ngoại
  rationale: Trong ngữ cảnh Phao-lô, ἔθνη chỉ những người không thuộc dân Do Thái; không thêm từ 'tín hữu' vì nguyên văn không nói rõ.
- source_word: συνήσθιεν
  choice: vẫn thường ăn chung
  rationale: Thể chưa hoàn thành diễn tả hành động đã diễn ra theo thói quen; 'ăn chung' làm rõ chiều kích giao tiếp bàn ăn của σύν.
- source_word: ὑπέστελλεν
  choice: bắt đầu lui lại
  rationale: Truyền đạt hành động rút lui đang khởi diễn trong thể chưa hoàn thành mà không thêm động cơ ngoài văn bản.
- source_word: ἀφώριζεν ἑαυτόν
  choice: tự tách mình ra
  rationale: Giữ lực phản thân và ý nghĩa phân cách về mặt giao tiếp xã hội.
- source_word: φοβούμενος
  choice: vì sợ
  rationale: Diễn đạt rõ sắc thái nguyên nhân của phân từ trong tiếng Việt tự nhiên.
- source_word: τοὺς ἐκ περιτομῆς
  choice: những người thuộc giới cắt bì
  rationale: Giữ cách nhận diện nhóm theo phép cắt bì mà không áp đặt nhãn 'phe phái' mạnh hơn nguyên văn.
theological_decisions:
- issue: ἀπὸ Ἰακώβου có hàm ý Gia-cơ chính thức sai phái hoặc tán thành nhóm người này hay không
  choice: từ chỗ Gia-cơ
  alternative: do Gia-cơ sai đến; thuộc nhóm của Gia-cơ
  rationale: Giới từ ἀπό với tên người có thể chỉ nguồn gốc hoặc sự liên hệ, nhưng tự nó không xác nhận sự ủy nhiệm chính thức. Bản dịch và chú thích giữ nguyên sự mơ hồ này.
- issue: τοὺς ἐκ περιτομῆς có nên được gọi là một 'phe' hay không
  choice: những người thuộc giới cắt bì
  alternative: phe cắt bì
  rationale: Nguyên văn nhận diện họ bằng phép cắt bì nhưng không trực tiếp dùng danh từ chỉ đảng phái; cách dịch chính tránh xác định quá mức cấu trúc của nhóm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Gia-cơ” theo cách phiên âm quen thuộc trong Kinh Thánh tiếng Việt; “người ngoại” và “giới cắt bì” giữ sắc thái lịch sử-thần học nhưng không thêm nhãn hệ phái.
