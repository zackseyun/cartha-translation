id: GAL.2.6
reference: Galatians 2:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: vi
  text: Còn về những người được xem là có uy tín—trước kia họ là người thế nào cũng chẳng quan trọng đối với tôi; Đức Chúa Trời không thiên vị ai[a]—thật vậy, những người có uy tín ấy không bổ sung gì cho tôi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “Đức Chúa Trời không nhận mặt người,” một thành ngữ có nghĩa là Đức Chúa Trời không thiên vị.'
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “không đặt thêm yêu cầu nào cho tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: những người được xem là có uy tín / những người có uy tín ấy
  rationale: Diễn đạt địa vị được người khác nhìn nhận, đồng thời giữ được sắc thái dè dặt của Phao-lô mà không biến lời ông thành sự khinh miệt.
- source_word: ὁποῖοί ποτε ἦσαν
  choice: trước kia họ là người thế nào
  rationale: Giữ yếu tố thời gian của ποτε và nhấn mạnh rằng địa vị trước đây của họ không liên quan đến lập luận của Phao-lô.
- source_word: οὐδέν μοι διαφέρει
  choice: cũng chẳng quan trọng đối với tôi
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn tả rằng thân thế hay địa vị của họ không ảnh hưởng đến sự đánh giá của Phao-lô.
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: Đức Chúa Trời không thiên vị ai
  rationale: Chuyển đúng nghĩa thành ngữ Hy Lạp về việc không đối xử thiên vị, thay vì dịch sát chữ một cách khó hiểu.
- source_word: ἐμοὶ γὰρ
  choice: thật vậy ... cho tôi
  rationale: “Thật vậy” thể hiện chức năng giải thích/xác nhận của γάρ, còn “cho tôi” giữ rõ đại từ ở cách cho ἐμοί.
- source_word: οὐδὲν προσανέθεντο
  choice: không bổ sung gì cho tôi
  rationale: Giữ nghĩa rộng của động từ là không thêm hay đóng góp điều gì, đồng thời chú thích khả năng hiểu là không đặt thêm yêu cầu.
theological_decisions:
- issue: Câu nói của Phao-lô có hàm ý khinh miệt các lãnh đạo tại Giê-ru-sa-lem hay khẳng định sự độc lập trước địa vị của họ
  choice: Giữ sắc thái có khoảng cách qua “được xem là có uy tín”, nhưng không phủ nhận vai trò lãnh đạo của họ.
  alternative: Có thể dịch gay gắt hơn là “những người tưởng mình quan trọng”, hoặc mềm hơn là “các vị lãnh đạo được công nhận”.
  rationale: Trọng tâm của Phao-lô là địa vị con người không quyết định chân lý của Tin Lành; nguyên văn vẫn có sắc thái tu từ mà bản dịch không nên làm mất hoặc phóng đại.
- issue: οὐδὲν προσανέθεντο nói đến việc không thêm vào sứ điệp hay không áp đặt thêm yêu cầu
  choice: Dùng “không bổ sung gì cho tôi” trong chính văn để giữ độ mở của nguyên văn.
  alternative: “Không đặt thêm yêu cầu nào cho tôi.”
  rationale: Ngữ cảnh cho phép hiểu động từ theo hướng thêm/đóng góp hoặc đặt thêm điều gì; chú thích bảo tồn cách hiểu thứ hai mà không quyết định thay nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ cấu trúc xen lời của câu Hy Lạp; “có uy tín” tự nhiên hơn lối dịch sát “là một điều gì đó” nhưng vẫn bảo tồn khoảng cách tu từ của Phao-lô.
