id: GAL.2.18
reference: Galatians 2:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: vi
  text: Vì nếu tôi xây lại những gì mình đã phá đổ[a], thì tôi chứng tỏ mình là kẻ vi phạm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã phá hủy” hoặc “đã tháo dỡ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thì tôi cho thấy mình là kẻ vi phạm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả ý giải thích của γάρ, nối với lập luận trước đó, lẫn ý điều kiện của εἰ; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἃ ... ταῦτα
  choice: những gì
  rationale: Chuyển cấu trúc tương liên số nhiều sang cách nói tiếng Việt gọn và tự nhiên mà không xác định cụ thể đối tượng.
- source_word: κατέλυσα
  choice: đã phá đổ
  rationale: Giữ hình ảnh công trình tương ứng với οἰκοδομῶ; ít mang tính diễn giải hơn các cách như “bãi bỏ”.
- source_word: πάλιν οἰκοδομῶ
  choice: xây lại
  rationale: Diễn đạt tự nhiên cả πάλιν và οἰκοδομῶ, đồng thời duy trì phép ẩn dụ xây dựng và sắc thái hiện tại trong mệnh đề điều kiện.
- source_word: παραβάτην
  choice: kẻ vi phạm
  rationale: Giữ sắc thái đạo đức-pháp lý của danh từ mà không thu hẹp rõ rệt thành “kẻ vi phạm luật pháp,” điều văn cảnh có thể gợi đến nhưng từ Hy Lạp ở đây không nêu trực tiếp.
- source_word: ἐμαυτὸν συνιστάνω
  choice: tôi chứng tỏ mình là
  rationale: Thể hiện nghĩa tự quy kết của đại từ phản thân và ý cho thấy hoặc xác lập bản thân thuộc loại người ấy.
theological_decisions:
- issue: Đối tượng của hành động “phá đổ” và “xây lại”
  choice: 'Giữ ở dạng không xác định: “những gì”'
  alternative: Diễn giải thành “luật pháp,” “hệ thống luật pháp,” hoặc một thực hành cụ thể
  rationale: Câu Hy Lạp không gọi tên trực tiếp đối tượng; giữ nguyên sự hàm ẩn tránh áp đặt một cách giải nghĩa thần học lên bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cặp “phá đổ / xây lại” bảo toàn hình ảnh kiến trúc của nguyên văn. Đại từ “tôi” phù hợp với lời lập luận trực tiếp của Phao-lô; “mình” trong cấu trúc phản thân giúp câu tự nhiên mà vẫn giữ lực tự quy kết.
