id: GAL.3.11
reference: Galatians 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/011.yaml
  text: It is evident that no one is justified before God by the law[b][a], because "The righteous will live by faith."
translation:
  language: vi
  text: 'Rõ ràng là không một ai được xưng công chính trước mặt Đức Chúa Trời nhờ luật pháp, vì: “Người công chính sẽ sống bởi đức tin.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người công chính sẽ sống bởi sự thành tín.” Cụm từ này cũng có thể được hiểu là: “Người nhờ đức tin mà được công chính sẽ sống.”'
    reason: lexical_alternative
  - marker: b
    text: Phao-lô trích dẫn Ha-ba-cúc 2:4.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι δὲ
  choice: Rõ ràng
  rationale: δὲ đánh dấu sự chuyển ý nhẹ; trong tiếng Việt không cần thêm một liên từ cứng nhắc. Mệnh đề với δῆλον được đưa lên đầu để diễn đạt tự nhiên lập luận của Phao-lô.
- source_word: ἐν νόμῳ
  choice: nhờ luật pháp
  rationale: ἐν ở đây diễn tả phương tiện hoặc phạm vi trong lập luận pháp lý; “nhờ luật pháp” tự nhiên và không biến cụm từ thành tình trạng “ở dưới luật pháp”.
- source_word: οὐδεὶς
  choice: không một ai
  rationale: Giữ nguyên sắc thái phủ định phổ quát và có giọng trang trọng, rõ ràng.
- source_word: δικαιοῦται
  choice: được xưng công chính
  rationale: 'Bảo toàn sắc thái pháp đình của động từ δικαιόω: được công nhận hoặc tuyên bố là công chính, chứ không mặc nhiên diễn giải là được biến đổi về đạo đức.'
- source_word: παρὰ τῷ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn tả địa vị của con người trong sự phán xét của Đức Chúa Trời và giữ sắc thái pháp đình.
- source_word: δῆλον
  choice: Rõ ràng
  rationale: Cách diễn đạt gọn, tự nhiên trong tiếng Việt hiện đại, phù hợp với giọng lập luận.
- source_word: Ὁ δίκαιος
  choice: Người công chính
  rationale: Diễn đạt danh từ hóa của tính từ δίκαιος một cách tự nhiên và trang trọng.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: Giữ cách hiểu trực tiếp và truyền thống của πίστις trong câu trích dẫn; khả năng hiểu là “sự thành tín” được ghi ở chú thích để bảo toàn tính đa nghĩa.
- source_word: ζήσεται
  choice: sẽ sống
  rationale: Phản ánh trực tiếp thì tương lai và dùng lối nói tiếng Việt hiện đại.
theological_decisions:
- issue: Cách hiểu câu trích dẫn Ὁ δίκαιος ἐκ πίστεως ζήσεται
  choice: “Người công chính sẽ sống bởi đức tin.”
  alternative: “Người công chính sẽ sống bởi sự thành tín”; hoặc “Người nhờ đức tin mà được công chính sẽ sống.”
  rationale: Bản chính giữ cách gắn ἐκ πίστεως với động từ “sẽ sống” là cách đọc cú pháp trực tiếp, đồng thời không giải quyết dứt điểm sự đa nghĩa của πίστις. Chú thích nêu cách hiểu “sự thành tín”, còn khả năng gắn cụm từ với “người công chính” được ghi nhận trong chú thích để không áp đặt một cách diễn giải thần học.
- issue: Sắc thái của δικαιοῦται
  choice: được xưng công chính
  alternative: được kể là công chính; được tuyên là công chính
  rationale: “Được xưng công chính” giữ sắc thái pháp đình trong văn mạch Phao-lô mà không thêm một hệ thống giáo lý riêng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời”, “luật pháp”, “đức tin” và “được xưng công chính” để duy trì văn phong Kinh Thánh quen thuộc mà vẫn rõ nghĩa. Các dấu chú thích được đặt ngay sau câu trích dẫn mà chúng giải thích.
