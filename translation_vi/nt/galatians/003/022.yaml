id: GAL.3.22
reference: Galatians 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: vi
  text: Nhưng Kinh Thánh đã giam giữ mọi sự dưới tội lỗi[b], để lời hứa bởi đức tin nơi Giê-su, Đấng Mê-si-a,[a] được ban cho những người tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bởi sự thành tín của Giê-su, Đấng Mê-si-a.”'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đã giam giữ tất cả dưới tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέκλεισεν
  choice: đã giam giữ
  rationale: Diễn đạt hình ảnh bị khép kín và đặt dưới sự kiềm giữ; tự nhiên hơn lối dịch sát chữ “đóng kín” trong tiếng Việt hiện đại.
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: Giữ cách nhân cách hóa ở số ít của Phao-lô, trong đó Kinh Thánh hành động như một chứng nhân thống nhất.
- source_word: τὰ πάντα
  choice: mọi sự
  rationale: Giữ phạm vi rộng của dạng trung tính số nhiều, không thu hẹp đối tượng chỉ còn con người.
- source_word: ὑπὸ ἁμαρτίαν
  choice: dưới tội lỗi
  rationale: Giữ nguyên ẩn dụ về sự lệ thuộc mà không thêm cách giải nghĩa như “dưới quyền lực của tội lỗi” vào chính văn.
- source_word: ἡ ἐπαγγελία
  choice: lời hứa
  rationale: Phản ánh trực tiếp danh từ Hy Lạp và phù hợp với mạch lập luận.
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: bởi đức tin nơi Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Chính văn hiểu sở hữu cách theo nghĩa khách thể, tức là đức tin đặt nơi Đức Chúa Jêsus; cách hiểu chủ thể về sự thành tín của ngài được bảo lưu trong chú thích.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Thể hiện Χριστός như một tước hiệu gắn với Jêsus thay vì chỉ phiên âm là “Christ”.
- source_word: δοθῇ
  choice: được ban
  rationale: Dạng bị động sau ἵνα được diễn đạt tự nhiên trong mệnh đề chỉ mục đích “để… được ban”.
- source_word: τοῖς πιστεύουσιν
  choice: cho những người tin
  rationale: Giữ sắc thái chủ động của phân từ, mô tả những người thực hiện hành động tin thay vì chỉ dùng một nhãn gọi.
theological_decisions:
- issue: Cấu trúc sở hữu cách πίστεως Ἰησοῦ Χριστοῦ
  choice: đức tin nơi Đức Chúa Jêsus, Đấng Mê-si-a
  alternative: sự thành tín của Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Cụm từ có thể được hiểu theo sở hữu cách khách thể hoặc chủ thể. Chính văn chọn cách hiểu phổ biến là đức tin đặt nơi Jêsus, còn cách hiểu về sự thành tín của Jêsus được nêu rõ trong chú thích để giữ nguyên tính đa nghĩa thực sự.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Giam giữ” duy trì hình ảnh nhà tù trong động từ Hy Lạp; “mọi sự” giữ phạm vi bao quát. Dùng “Đức Chúa Jêsus, Đấng Mê-si-a” để nhận diện rõ danh xưng và tước hiệu. Các dấu chú thích đều xuất hiện trong chính văn.
