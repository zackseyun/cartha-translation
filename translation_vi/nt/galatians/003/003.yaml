id: GAL.3.3
reference: Galatians 3:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: vi
  text: Anh em thiếu suy xét đến thế sao? Đã bắt đầu nhờ Thánh Linh[a], nay anh em nhờ xác thịt[b] mà được làm cho trọn vẹn[c] sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Thánh Linh.”'
    reason: lexical_alternative
  - marker: b
    text: “Xác thịt” ở đây cũng có thể được hiểu là “nỗ lực của con người”; hoặc có thể là “bản tính tội lỗi.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “được hoàn tất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: đến thế
  rationale: 'Trong câu hỏi tu từ, từ này nhấn mạnh mức độ: “thiếu suy xét đến thế,” tự nhiên hơn cách dịch theo nghĩa phương thức.'
- source_word: ἀνόητοί
  choice: thiếu suy xét
  rationale: Diễn tả sự thiếu hiểu biết và phân định, giữ lời quở trách mạnh nhưng không dùng từ miệt thị quá mức như “ngu xuẩn”.
- source_word: ἐναρξάμενοι
  choice: đã bắt đầu
  rationale: Phản ánh hành động có trước của phân từ aorist, đối lập với tình trạng “nay” trong mệnh đề chính.
- source_word: πνεύματι
  choice: nhờ Thánh Linh
  rationale: Ngữ cảnh Ga-la-ti 3 chỉ về Thánh Linh; “nhờ” diễn đạt khả năng công cụ cách và tạo thế đối xứng với “nhờ xác thịt.”
- source_word: νῦν
  choice: nay
  rationale: Giữ rõ nét tương phản thời gian và phù hợp với văn phong trang trọng, tự nhiên.
- source_word: σαρκὶ
  choice: nhờ xác thịt
  rationale: Giữ nguyên hình ảnh thần học nhiều tầng của Phao-lô, không thu hẹp nghĩa chỉ còn “nỗ lực con người” hay “bản tính tội lỗi.”
- source_word: ἐπιτελεῖσθε
  choice: được làm cho trọn vẹn
  rationale: Thể hiện sắc thái trung động/bị động của tiến trình được đưa đến chỗ hoàn tất, đồng thời tránh hàm ý sự hoàn hảo tuyệt đối ngoài văn cảnh.
theological_decisions:
- issue: Đối tượng được nói đến bởi πνεύματι
  choice: Thánh Linh
  alternative: tâm linh con người hoặc một nguyên lý thuộc linh
  rationale: Văn cảnh gần nói đến việc nhận lãnh Thánh Linh, nên cách hiểu chỉ Đức Thánh Linh có cơ sở vững nhất.
- issue: Ý nghĩa của σάρξ khi tương phản với Thánh Linh
  choice: xác thịt
  alternative: nỗ lực con người hoặc bản tính tội lỗi
  rationale: “Xác thịt” bảo toàn cách nói và sự căng thẳng thần học của Phao-lô; chú thích nêu các cách hiểu diễn giải mà không quyết định thay cho người đọc.
- issue: Sắc thái của ἐπιτελεῖσθε
  choice: được làm cho trọn vẹn
  alternative: được hoàn tất hoặc tự mình hoàn tất
  rationale: Hình thái động từ có thể được hiểu theo sắc thái trung động hoặc bị động; bản dịch chính giữ ý tiến đến sự hoàn tất mà không khẳng định quá mức chủ thể tác động.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để thể hiện số nhiều trong lời chất vấn trực tiếp; giữ thuật ngữ “xác thịt” nhằm bảo toàn ngôn ngữ Phao-lô và để chú thích giải thích các nghĩa khả dĩ.
