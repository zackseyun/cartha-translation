id: GAL.3.25
reference: Galatians 3:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: vi
  text: Nhưng nay, khi đức tin đã đến[a], chúng ta không còn ở dưới quyền người giám hộ[b] nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi đức tin ấy đã đến.”'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp παιδαγωγός chỉ người trông nom và giám sát trẻ vị thành niên trong một gia đình, chứ chủ yếu không phải thầy giáo đứng lớp.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθούσης
  choice: nay, khi ... đã đến
  rationale: Phân từ bất định trong kết cấu sở hữu cách tuyệt đối được diễn đạt tự nhiên bằng mệnh đề thời gian; cách dịch này giữ ý một sự xuất hiện đã xảy ra và có hệ quả hiện tại.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với thời kỳ chịu sự giám hộ được nói đến ở câu trước.
- source_word: πίστεως
  choice: đức tin
  rationale: Giữ nghĩa thông thường của πίστις là “đức tin”, đồng thời không loại trừ sắc thái chỉ thực tại hay thời kỳ của đức tin trong văn mạch.
- source_word: οὐκέτι
  choice: không còn ... nữa
  rationale: Diễn đạt rõ sự chấm dứt của tình trạng trước đây.
- source_word: ὑπὸ
  choice: ở dưới quyền
  rationale: Giữ hình ảnh chịu sự quản thúc hay giám sát, đồng thời tự nhiên trong tiếng Việt.
- source_word: παιδαγωγόν
  choice: người giám hộ
  rationale: παιδαγωγός chỉ người trong gia đình có nhiệm vụ trông nom, giám sát một trẻ vị thành niên, chứ chủ yếu không phải giáo viên đứng lớp.
- source_word: ἐσμεν
  choice: chúng ta ... ở
  rationale: Diễn đạt tự nhiên động từ εἰμί trong kết cấu chỉ tình trạng “ở dưới quyền”.
theological_decisions:
- issue: Ý nghĩa của việc “đức tin đã đến” trong văn mạch
  choice: “đức tin đã đến”
  alternative: “thời đại đức tin đã đến” hoặc “đạo đức tin đã đến”
  rationale: 'Bản dịch chính giữ cách nói cô đọng và sự căng nghĩa của nguyên văn: vừa có thể nói đến đức tin, vừa gợi một bước chuyển trong lịch sử cứu rỗi. Không diễn giải thêm “thời đại” vào chính văn.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người giám hộ” truyền đạt vai trò cổ đại rõ hơn “thầy dạy”; cụm “ở dưới quyền” duy trì ẩn dụ về sự quản thúc. Các dấu chú thích đều xuất hiện trong chính văn.
