  terminology: “Báp-têm,” “Đấng Christ,” “vào Đấng Christ,” và “mặc lấy” đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại, giữ được danh hiệu Χριστός và không áp đặt quan điểm về phương thức hay hiệu lực của báp-têm.
