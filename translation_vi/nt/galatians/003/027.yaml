  rationale: Đổi cấu trúc mở đầu thành “những ai trong anh chị em ... đều” để phản ánh trung thành hơn ὅσοι và làm câu tiếng Việt gọn, tự nhiên. Những lựa chọn thuật ngữ và hình ảnh chính được giữ nguyên.
