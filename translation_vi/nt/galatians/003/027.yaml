base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/027.yaml
  text: For as many of you as were baptized into Messiah have put on Messiah[a][b].
translation:
  language: vi
  text: Vì những ai trong anh chị em đã được báp-têm vào Đấng Christ đều đã mặc lấy Đấng Christ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “đã khoác Đấng Christ lên mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: tất cả anh chị em là những người… đều
  rationale: Giữ sắc thái bao quát và tương liên của ὅσοι, đồng thời diễn đạt tự nhiên lời trực tiếp nói với cộng đồng Ga-la-ti.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ mối liên hệ giải thích với câu trước.
- source_word: εἰς
  choice: vào
  rationale: Bám sát hướng nghĩa của giới từ và giữ ý niệm kết hợp hay được đưa vào trong Đấng Christ mà không giải thích thêm theo một hệ phái.
- source_word: Χριστόν
  choice: Đấng Christ
  rationale: Đây là danh xưng chỉ Đấng được xức dầu; “Đấng Christ” là cách gọi quen thuộc, trang trọng trong tiếng Việt và vẫn giữ tính danh hiệu.
- source_word: ἐβαπτίσθητε
  choice: đã được báp-têm
  rationale: Giữ thể bị động của động từ Hy Lạp và dùng thuật ngữ phổ thông, không quy định phương thức thực hiện phép báp-têm.
- source_word: ἐνεδύσασθε
  choice: đã mặc lấy
  rationale: Giữ trực tiếp hình ảnh mặc áo của động từ Hy Lạp; “mặc lấy” tự nhiên trong văn phong Kinh Thánh tiếng Việt và không làm mất ẩn dụ.
theological_decisions:
- issue: Cụm từ về báp-têm có hàm ý một quan điểm bí tích hay một phương thức báp-têm cụ thể hay không.
  choice: đã được báp-têm vào Đấng Christ
  alternative: đã được dìm vào Đấng Christ; đã chịu báp-têm liên hệ với Đấng Christ
  rationale: Bản Hy Lạp nói đến việc được báp-têm “vào” Đấng Christ nhưng không tự nó phân xử các tranh luận thần học về hiệu lực bí tích hoặc cách thức báp-têm. Bản dịch giữ nguyên sự căng thẳng đó.
- issue: Cách chuyển danh xưng Χριστός.
  choice: Đấng Christ
  alternative: Đấng Mê-si-a
  rationale: “Đấng Christ” vừa là danh xưng quen thuộc trong tiếng Việt hiện đại vừa biểu đạt tước hiệu của Đấng được xức dầu; không biến tước hiệu thành tên riêng thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để thể hiện đối tượng số nhiều gồm cả cộng đồng, tránh đại từ chỉ riêng nam giới. Giữ “báp-têm” và “Đấng Christ” vì đây là các thuật ngữ quen thuộc rộng rãi; câu văn bảo toàn hình ảnh mặc áo và quan hệ giải thích với câu trước.
