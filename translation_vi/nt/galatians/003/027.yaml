  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính: γάρ (“Vì”), thể bị động của ἐβαπτίσθητε (“đã được báp-têm”), εἰς (“vào”), và ẩn dụ ἐνεδύσασθε (“đã mặc lấy”). Tuy nhiên, “tất cả anh chị em là những người … đều” làm yếu sắc thái tương liên/phân loại của ὅσοι (“những ai/trong số những người...”) và có thể bị hiểu là một khẳng định không điều kiện rằng toàn thể người nghe đều đã chịu báp-têm.'
