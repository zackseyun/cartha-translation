id: GAL.3.14
reference: Galatians 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: vi
  text: để phước lành của Áp-ra-ham đến với dân ngoại[a] trong Đấng Mê-si-a Giê-su[b], và để chúng ta nhờ đức tin mà nhận được lời hứa về Thánh Linh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các dân tộc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách gọi truyền thống: “trong Đấng Christ Giê-su.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể hiểu: “nhận được Thánh Linh đã được hứa ban.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα ... ἵνα
  choice: để ... và để
  rationale: Giữ cấu trúc mục đích kép của câu Hy Lạp, đồng thời thêm “và” để câu tiếng Việt liền mạch, tự nhiên.
- source_word: εἰς τὰ ἔθνη
  choice: đến với dân ngoại
  rationale: Trong lập luận của Phao-lô, cụm này chủ yếu chỉ những người không thuộc dân Do Thái; “đến với” diễn đạt tự nhiên hướng tiếp nhận phước lành.
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: phước lành của Áp-ra-ham
  rationale: Diễn đạt trực tiếp phước lành gắn với Áp-ra-ham trong mạch lập luận về lời hứa.
- source_word: γένηται
  choice: đến với
  rationale: Trong kết cấu này, γίνομαι được diễn đạt theo nghĩa phước lành được mở rộng đến dân ngoại, tránh cách dịch cứng là “trở thành”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong” và chuyển dịch Χριστός theo nghĩa danh hiệu “Đấng Mê-si-a”, phù hợp bối cảnh lời hứa và phước lành giao ước.
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: lời hứa về Thánh Linh
  rationale: Giữ danh từ “lời hứa” và không đưa cách hiểu diễn giải “Thánh Linh đã được hứa ban” vào chính văn.
- source_word: λάβωμεν
  choice: chúng ta ... nhận được
  rationale: Diễn đạt thể giả định phụ thuộc ἵνα như mục đích, tự nhiên trong tiếng Việt.
- source_word: διὰ τῆς πίστεως
  choice: nhờ đức tin
  rationale: “Nhờ” diễn đạt phương tiện; “đức tin” là cách gọi quen thuộc và trang trọng của πίστις trong văn cảnh này.
theological_decisions:
- issue: Χριστός là danh hiệu hay dạng gần như tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong lập luận về phước lành Áp-ra-ham, danh hiệu vẫn có sức nặng cứu thế; dịch nghĩa làm rõ chức danh mà không biến nó thành tên riêng thuần túy.
- issue: Ý nghĩa của τοῦ πνεύματος
  choice: lời hứa về Thánh Linh
  alternative: Thánh Linh đã được hứa ban
  rationale: Chính văn giữ kết cấu danh từ của tiếng Hy Lạp và phần nào duy trì độ mở của sở hữu cách; chú thích ghi cách hiểu có khả năng cao trong văn cảnh mà không áp đặt nó lên chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ hai mệnh đề mục đích song song; tên riêng dùng dạng phiên âm quen thuộc, còn Χριστός được dịch như một danh hiệu.
