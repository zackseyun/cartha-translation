id: GAL.3.21
reference: Galatians 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: vi
  text: Vậy, luật pháp có chống lại các lời hứa của Đức Chúa Trời không? Tuyệt đối không! Vì nếu một luật pháp đã được ban mà có thể ban sự sống, thì quả thật sự công chính[a] hẳn có nguồn từ luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “công lý.”
    reason: Bảo lưu nghĩa từ vựng khả hữu của δικαιοσύνη trong lập luận của Phao-lô.
lexical_decisions:
- source_word: νόμος
  choice: luật pháp
  rationale: Giữ nghĩa khái quát của luật như một phạm trù trong lập luận giả định, đồng thời vẫn để người đọc nhận ra âm hưởng của Luật Môi-se trong văn cảnh.
- source_word: κατὰ
  choice: chống lại
  rationale: Với sở hữu cách, κατά diễn tả sự đối nghịch; “chống lại” rõ ràng và tự nhiên trong câu hỏi tu từ.
- source_word: ἐπαγγελιῶν
  choice: các lời hứa
  rationale: Giữ nguyên số nhiều rõ ràng trong tiếng Hy Lạp và liên hệ với những lời hứa của Đức Chúa Trời đã được bàn đến.
- source_word: μὴ γένοιτο
  choice: Tuyệt đối không!
  rationale: Diễn đạt tự nhiên và mạnh mẽ công thức bác bỏ dứt khoát của Phao-lô.
- source_word: ἐδόθη
  choice: đã có một luật pháp được ban xuống
  rationale: Thể bị động của động từ được giữ lại; cách diễn đạt này phù hợp với cấu trúc điều kiện giả định và hàm ý nguồn ban từ Đức Chúa Trời mà không thêm chủ thể vào câu.
- source_word: δυνάμενος
  choice: có khả năng
  rationale: Diễn tả năng lực của luật pháp một cách rõ ràng, hiện đại.
- source_word: ζῳοποιῆσαι
  choice: ban sự sống
  rationale: Truyền đạt nghĩa làm cho sống hoặc đem lại sự sống bằng cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὄντως
  choice: quả thật
  rationale: Giữ sức nhấn mạnh của trạng từ trong kết luận.
- source_word: ἐκ νόμου
  choice: đến từ luật pháp
  rationale: Giữ rõ ý nguồn gốc của giới từ ἐκ thay vì chuyển thành phương tiện “nhờ luật pháp”.
- source_word: δικαιοσύνη
  choice: sự công chính
  rationale: Đây là cách dịch quen thuộc và phù hợp với lập luận của Phao-lô về địa vị đúng đắn trước Đức Chúa Trời; nghĩa “công lý” vẫn được bảo lưu trong chú thích.
theological_decisions:
- issue: Ý nghĩa của δικαιοσύνη trong lập luận của Phao-lô
  choice: sự công chính
  alternative: công lý
  rationale: “Sự công chính” phù hợp nhất với lập luận về luật pháp, lời hứa và địa vị đúng đắn trước Đức Chúa Trời, nhưng không loại bỏ sắc thái công lý vốn có của thuật ngữ; vì vậy phương án ấy được ghi ở chú thích.
- issue: Quan hệ giữa luật pháp và các lời hứa của Đức Chúa Trời
  choice: giữ nguyên câu hỏi và lời bác bỏ mạnh, không giải thích rằng luật pháp tự thân đối nghịch hay bổ trợ lời hứa
  alternative: diễn giải rõ vai trò thần học của Luật Môi-se
  rationale: Câu Hy Lạp nêu và bác bỏ khả năng đối nghịch, rồi đưa ra điều kiện giả định. Bản dịch giữ nguyên sức căng ấy và không nhập thêm một hệ thống giải thích giáo phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo lối Kinh Thánh Tin Lành phổ biến; “luật pháp” không viết hoa để bảo lưu tính khái quát của νόμος trong câu giả định. Dấu chú thích được đặt ngay sau thuật ngữ δικαιοσύνη mà chú thích giải thích.
