id: GAL.3.8
reference: Galatians 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: vi
  text: 'Kinh Thánh thấy trước rằng Đức Chúa Trời xưng công chính cho các dân tộc[a] bởi đức tin, nên đã loan báo tin mừng từ trước[b] cho Áp-ra-ham: “Trong ngươi, mọi dân tộc sẽ được ban phước.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “dân ngoại”; từ Hy Lạp ἔθνη có thể chỉ “các dân tộc” hoặc “dân ngoại.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã rao giảng phúc âm từ trước cho Áp-ra-ham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: thấy trước
  rationale: Diễn đạt rõ hành động nhận biết trước của phân từ bất định, đồng thời kết hợp tự nhiên với hình ảnh Kinh Thánh được nhân cách hóa.
- source_word: ἡ γραφή
  choice: Kinh Thánh
  rationale: Trong cách dùng của Phao-lô, cụm từ này chỉ Kinh Thánh có thẩm quyền, không phải một văn bản bất kỳ.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: Giữ cách diễn đạt ngắn gọn, quen thuộc và để mở sắc thái phương tiện hoặc cơ sở của giới từ ἐκ trong ngữ cảnh.
- source_word: δικαιοῖ
  choice: xưng công chính cho
  rationale: Phản ánh cách dùng thần học của δικαιόω mà không chuyển thành một lối diễn giải dài hoặc xác định quá mức cơ chế của hành động.
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: các dân tộc ... mọi dân tộc
  rationale: Giữ sự lặp lại từ ngữ trong tiếng Hy Lạp và làm rõ mối liên hệ giữa lời khẳng định của Phao-lô với lời hứa dành cho Áp-ra-ham.
- source_word: προευηγγελίσατο
  choice: đã loan báo tin mừng từ trước
  rationale: Giữ cả ý niệm tin mừng trong gốc εὐαγγελ- lẫn yếu tố báo trước của tiền tố προ- bằng lối nói tự nhiên trong tiếng Việt.
- source_word: τῷ Ἀβραὰμ
  choice: cho Áp-ra-ham
  rationale: Diễn đạt trực tiếp tân ngữ gián tiếp ở cách dữ liệu và dùng dạng tên quen thuộc trong tiếng Việt.
- source_word: Ἐνευλογηθήσονται
  choice: sẽ được ban phước
  rationale: Giữ thì tương lai và thể bị động của động từ, đồng thời dùng cách nói trang trọng, dễ hiểu.
- source_word: ἐν σοὶ
  choice: Trong ngươi
  rationale: Theo sát giới từ ἐν và hình thức của lời trích dẫn Sáng Thế Ký, không giải thích quá mức mối liên hệ đại diện hay giao ước.
theological_decisions:
- issue: Nên dịch ἔθνη là “các dân tộc” hay “dân ngoại”
  choice: “các dân tộc” ở cả hai lần xuất hiện
  alternative: “dân ngoại” ở lần đầu và “mọi dân tộc” trong lời trích dẫn
  rationale: “Các dân tộc” giữ được sự lặp lại trong nguyên văn và làm nổi bật mối liên hệ giữa việc được xưng công chính bởi đức tin với lời hứa cho các dân tộc; chú thích bảo lưu nghĩa khả dĩ là “dân ngoại”.
- issue: Sắc thái của δικαιόω
  choice: “xưng công chính cho”
  alternative: “tuyên bố là công chính” hoặc “làm cho nên công chính”
  rationale: Cách dịch này giữ thuật ngữ cô đọng và tránh âm thầm giải quyết toàn bộ căng thẳng giữa sắc thái tuyên nhận và sắc thái làm nên công chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc nhân cách hóa “Kinh Thánh thấy trước ... nên đã loan báo” được giữ lại; đại từ “ngươi” chỉ xuất hiện trong lời trích dẫn cổ kính để duy trì sắc thái long trọng của lời hứa.
