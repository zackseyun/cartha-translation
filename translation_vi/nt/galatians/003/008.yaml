  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa Hy Lạp: Kinh Thánh được nhân cách hóa là chủ ngữ của cả “thấy trước” và “đã loan báo”; mệnh đề “Đức Chúa Trời xưng công chính cho các dân tộc bởi đức tin” phản ánh đúng ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεός. “Các dân tộc ... mọi dân tộc” bảo toàn sự lặp lại của ἔθνη, và lời trích giữ tương lai bị động “sẽ được ban phước” cùng giới từ “trong”.'
