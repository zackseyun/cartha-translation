id: GAL.3.13
reference: Galatians 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: vi
  text: Đấng Mê-si[a] đã chuộc chúng ta khỏi lời nguyền rủa của luật pháp bằng cách trở thành lời nguyền rủa vì chúng ta[b], vì có lời chép rằng:[c] “Đáng nguyền rủa thay mọi người bị treo trên cây.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì lợi ích của chúng ta”; có thể mang nghĩa “thay cho chúng ta.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “bởi có lời chép rằng.”'
    reason: alternative_reading
  - marker: d
    text: Từ Hy Lạp ξύλον có nghĩa đen là “gỗ” hoặc “cây”; “cây” giữ cách diễn đạt của câu Kinh Thánh được trích dẫn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: Đấng Mê-si
  rationale: Dịch tước hiệu Hy Lạp bằng danh xưng tương ứng trong tiếng Việt, thay vì chỉ phiên âm; cách này giữ rõ ý nghĩa Đấng được xức dầu trong ngữ cảnh.
- source_word: ἐξηγόρασεν
  choice: đã chuộc
  rationale: “Chuộc” diễn đạt sự giải thoát bằng việc trả giá, đồng thời giữ được sắc thái thương mại và cứu chuộc trong cách dùng của Phao-lô.
- source_word: κατάρας
  choice: lời nguyền rủa
  rationale: Giữ nguyên sức nặng pháp lý và giao ước của danh từ Hy Lạp, không diễn giải thành một trạng thái trừu tượng.
- source_word: νόμου
  choice: luật pháp
  rationale: Cụm từ tự nhiên trong tiếng Việt và không dùng cách viết hoa để áp đặt một phân biệt mà chữ Hy Lạp không biểu thị, dù theo ngữ cảnh luật Môi-se đang được nói đến.
- source_word: γενόμενος
  choice: bằng cách trở thành
  rationale: Diễn đạt phân từ như phương cách sự cứu chuộc được thực hiện, đồng thời giữ quan hệ ngữ pháp và ý nghĩa mạnh của câu.
- source_word: ὑπὲρ ἡμῶν
  choice: vì chúng ta
  rationale: 'Giữ độ rộng nghĩa của ὑπέρ: vì lợi ích, thay mặt, hoặc có thể mang sắc thái thế chỗ; bản dịch chính không thu hẹp vào một mô hình thần học riêng.'
- source_word: κατάρα
  choice: lời nguyền rủa
  rationale: Giữ danh từ gây ấn tượng mạnh trong lời của Phao-lô, thay vì làm nhẹ thành “bị nguyền rủa” hay thêm chủ thể không có trong nguyên văn.
- source_word: ὅτι γέγραπται
  choice: vì có lời chép rằng
  rationale: Thể hiện quan hệ giải thích hoặc nêu căn cứ của lời trích dẫn; “bởi có lời chép rằng” cũng là một cách hiểu tự nhiên.
- source_word: Ἐπικατάρατος
  choice: Đáng nguyền rủa thay
  rationale: Cách nói trang trọng, tự nhiên trong lời trích Kinh Thánh và giữ nguyên sức mạnh của tính từ Hy Lạp.
- source_word: κρεμάμενος
  choice: bị treo
  rationale: Dạng bị động phù hợp với hành động treo một người lên và tự nhiên hơn trong tiếng Việt ở lời trích dẫn này.
- source_word: ξύλου
  choice: cây
  rationale: “Cây” giữ mối liên hệ với lời trích từ Phục Truyền Luật Lệ Ký; từ Hy Lạp cũng có thể chỉ gỗ hoặc một vật làm bằng gỗ.
theological_decisions:
- issue: Phạm vi ý nghĩa của ὑπὲρ ἡμῶν trong ngôn ngữ về sự chuộc tội
  choice: vì chúng ta
  alternative: thay cho chúng ta; vì lợi ích của chúng ta
  rationale: Câu này khẳng định hành động của Đấng Mê-si hướng đến lợi ích và có tính đại diện cho chúng ta, nhưng riêng giới từ ὑπέρ không buộc bản dịch phải xác định một mô hình chuộc tội hẹp hơn.
- issue: Cách diễn đạt γενόμενος ... κατάρα
  choice: trở thành lời nguyền rủa
  alternative: trở thành kẻ bị nguyền rủa
  rationale: Giữ nguyên phép diễn đạt táo bạo bằng danh từ của nguyên văn, không âm thầm chuyển nó thành việc chỉ chịu một lời nguyền.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cụm “trở thành lời nguyền rủa” được chủ ý giữ hơi mạnh và khác thường để phản ánh chính xác phép diễn đạt thần học gây ấn tượng trong nguyên văn. Dùng “mọi người” thay cho cách nói cổ “mọi kẻ” nhằm giữ giọng hiện đại.
