id: GAL.3.15
reference: Galatians 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: vi
  text: 'Thưa anh em[a], tôi nói theo cách nói của loài người: ngay cả một giao ước[b] của một người, một khi đã được xác nhận, cũng không ai hủy bỏ hoặc thêm điều khoản vào đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” dịch danh từ số nhiều giống đực ἀδελφοί; Phao-lô đang nói với các tín hữu đồng đạo, có lẽ gồm cả nam lẫn nữ.
    reason: cultural_note
  - marker: b
    text: Từ được dịch là “giao ước” cũng có thể có nghĩa là “di chúc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Thưa anh em
  rationale: Giữ hình thức hô cách số nhiều giống đực của ἀδελφοί; cách nói này tự nhiên, trang trọng trong tiếng Việt và chú thích làm rõ rằng nhóm tín hữu được nói đến có thể gồm cả phụ nữ.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: tôi nói theo cách loài người
  rationale: Diễn đạt thành ngữ chỉ việc dùng một ví dụ hay cách lập luận thuộc đời sống con người, đồng thời vẫn giữ gần hình ảnh nguyên ngữ.
- source_word: ὅμως
  choice: ngay cả
  rationale: Trong mạch lập luận, từ này nhấn mạnh rằng nguyên tắc ấy đúng ngay trong trường hợp thông thường giữa con người.
- source_word: ἀνθρώπου
  choice: một người
  rationale: Giữ số ít cụ thể của danh từ Hy Lạp mà không mặc nhiên nhấn mạnh giới tính trong tiếng Việt.
- source_word: κεκυρωμένην
  choice: đã được ... phê chuẩn
  rationale: Thể hoàn thành bị động chỉ một văn kiện đã được xác nhận chính thức và đang có hiệu lực.
- source_word: διαθήκην
  choice: giao ước
  rationale: Phù hợp nhất với mạch văn về lời hứa và giao ước với Áp-ra-ham, dù từ này cũng có thể mang nghĩa pháp lý là di chúc.
- source_word: ἀθετεῖ
  choice: hủy bỏ
  rationale: Truyền đạt rõ hành động làm mất hiệu lực hay gạt bỏ một văn kiện đã được xác lập.
- source_word: ἐπιδιατάσσεται
  choice: thêm điều gì vào đó
  rationale: Nêu đúng ý thêm những quy định hoặc điều khoản sau khi văn kiện đã được phê chuẩn.
theological_decisions:
- issue: Nên dịch διαθήκη là “giao ước” hay “di chúc”
  choice: giao ước
  alternative: di chúc
  rationale: “Giao ước” duy trì sự liên tục với lập luận ngay trong Ga-la-ti 3 về lời hứa của Đức Chúa Trời cho Áp-ra-ham; tuy vậy, sắc thái pháp lý “di chúc” là một khả năng từ vựng có thật nên được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc pháp lý được diễn đạt rõ mà không quá chuyên môn; giữ sự phân biệt giữa ví dụ thuộc đời sống con người và giao ước trong mạch thần học.
