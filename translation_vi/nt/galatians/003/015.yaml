revisions:
- from: 'Thưa anh em[a], tôi nói theo cách loài người: ngay cả một giao ước đã được một người phê chuẩn[b] thì cũng không ai hủy bỏ hay thêm điều gì vào đó.'
  to: 'Thưa anh em[a], tôi nói theo cách nói của loài người: ngay cả một giao ước[b] của một người, một khi đã được xác nhận, cũng không ai hủy bỏ hoặc thêm điều khoản vào đó.'
  rationale: Sửa cách diễn đạt để tiếng Việt hiện đại tự nhiên hơn, làm rõ hình thức ví dụ pháp lý, và tránh hiểu ἀνθρώπου là tác nhân được nêu rõ của động từ “xác nhận”. Giữ “giao ước” theo mạch văn, bảo toàn khả năng từ vựng “di chúc” trong chú thích, đồng thời sửa vị trí neo chú thích b.
  reviewer_model: gpt-5.6-terra
