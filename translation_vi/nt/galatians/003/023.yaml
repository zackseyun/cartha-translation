review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh tốt cấu trúc thời gian của Πρὸ τοῦ ... ἐλθεῖν, hai động từ bị động συνεχ diễn tả tình trạng kéo dài, và sự đối lập giữa luật pháp với đức tin sắp được mặc khải. Tuy nhiên, cụm “cho đến khi đức tin sắp được bày tỏ” không tự nhiên về quan hệ thời gian trong tiếng Việt: một mốc “cho đến khi” không thường đi với “sắp”. Đổi thành “để chờ” diễn đạt hợp lý hướng quy chiếu của εἰς προς đức tin sẽ/sắp được bày tỏ, mà không thêm diễn giải thần học.'
  naturalness: “Bị canh giữ” và “bị giam giữ” giữ được sự căng thẳng có chủ ý giữa φρουρέω và συγκλείω. Câu được sửa tránh tổ hợp thời gian gượng và vẫn giữ văn phong Kinh Thánh hiện đại, trang trọng.
  terminology: “Đức tin” và “luật pháp” là các thuật ngữ phù hợp. Cần bổ sung chú thích từ vựng cho πίστις về các khả năng “sự thành tín” hoặc “lòng tin/cậy”, tương ứng với hồ sơ kiểm tra tiếng Anh, nhưng bản văn chính vẫn nên là “đức tin”.
  issues:
  - severity: medium
    issue: Quan hệ “cho đến khi ... sắp được bày tỏ” thiếu tự nhiên trong tiếng Việt.
    rationale: μέλλουσαν nêu tính hướng tới/tương lai của sự mặc khải, nhưng khi ghép với “cho đến khi”, “sắp” tạo cảm giác mốc kết thúc là lúc sự việc chỉ còn sắp xảy ra, thay vì lúc nó được bày tỏ. “Để chờ” truyền đạt tự nhiên hơn hướng quy chiếu của εἰς.
  - severity: low
    issue: Thiếu chú thích về các nghĩa từ vựng khác của πίστις trong hồ sơ tiếng Anh.
    rationale: Dù “đức tin” là lựa chọn đúng trong văn cảnh, chú thích giúp bảo lưu các khả năng từ vựng mà không áp đặt cách hiểu thần học.
