id: GAL.3.23
reference: Galatians 3:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: vi
  text: Nhưng trước khi đức tin[a][d] đến, chúng ta bị canh giữ dưới luật pháp[b], bị giam giữ[c] để chờ đức tin sắp được bày tỏ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trước khi đức tin ấy đến”; mạo từ Hy Lạp có thể hướng đến thực tại hoặc thời kỳ đức tin được khai mở khi Đấng Christ đến.'
    reason: alternative_reading
  - marker: b
    text: “Bị canh giữ” cũng có thể hiểu là “bị giữ dưới sự giám sát”.
    reason: lexical_alternative
  - marker: c
    text: “Bị giam giữ” cũng có thể dịch là “bị khép lại” hoặc “bị cầm giữ”.
    reason: lexical_alternative
  - marker: d
    text: Từ Hy Lạp pistis cũng có thể mang nghĩa “sự thành tín” hoặc “lòng tin/cậy”, dù trong văn cảnh này “đức tin” phù hợp nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: trước khi ... đến
  rationale: Kết cấu πρό với động từ nguyên mẫu có mạo từ chỉ thời gian; cách dịch này tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ với lập luận ngay trước đó.
- source_word: τὴν πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh Ga-la-ti 3, πίστις phù hợp nhất với “đức tin”; cách dịch không giải quyết dứt khoát liệu từ này chỉ hành vi tin hay thực tại cứu độ gắn với thời kỳ Đấng Christ.
- source_word: ὑπὸ νόμον
  choice: dưới luật pháp
  rationale: Diễn đạt địa vị ở dưới quyền hoặc chế độ của luật pháp; “luật pháp” phù hợp với ngữ cảnh nói về Luật Môi-se.
- source_word: ἐφρουρούμεθα
  choice: bị canh giữ
  rationale: Thể chưa hoàn thành bị động diễn tả tình trạng kéo dài trong quá khứ; “canh giữ” bảo toàn sắc thái bảo vệ hoặc canh phòng mà không vội quy nó hoàn toàn thành tiêu cực.
- source_word: συγκλειόμενοι
  choice: bị giam giữ
  rationale: Phân từ bị động bổ sung ý bị khép kín, giới hạn hay giam hãm; “bị giam giữ” truyền đạt rõ sức hạn chế của từ Hy Lạp.
- source_word: εἰς
  choice: cho đến khi
  rationale: Trong kết cấu này, εἰς hướng tới mốc đức tin được bày tỏ; cách dịch theo thời gian phù hợp với sự đối lập trước–sau của đoạn văn.
- source_word: τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι
  choice: đức tin sắp được bày tỏ
  rationale: Giữ sắc thái tương lai gần của μέλλουσαν và thể bị động của ἀποκαλυφθῆναι bằng một cách diễn đạt gọn, tự nhiên.
theological_decisions:
- issue: πίστις chỉ việc tin của cá nhân hay một thực tại/thời kỳ cứu độ được khai mở khi Đấng Christ đến
  choice: Dịch là “đức tin” và giữ nguyên khả năng mang ý nghĩa lịch sử cứu độ trong văn cảnh.
  alternative: “niềm tin”, “sự thành tín”, hoặc diễn giải thành “thời kỳ đức tin”
  rationale: Việc lặp lại danh từ có mạo từ và động từ “đến/được bày tỏ” gợi ý một thực tại lịch sử cứu độ, nhưng bản văn không buộc phải biến nó thành thuật ngữ “thời kỳ đức tin”. “Đức tin” giữ được sự căng thẳng này.
- issue: Sắc thái của luật pháp trong các động từ φρουρέω và συγκλείω
  choice: Giữ cả ý canh giữ lẫn giam giữ bằng hai cụm từ riêng.
  alternative: Chỉ dịch chung là “bị cầm tù” hoặc chỉ là “được bảo vệ”
  rationale: Hai từ đặt cạnh nhau tạo nên sự căng thẳng giữa chức năng trông giữ và hạn chế của luật pháp; không nên làm mất một trong hai sắc thái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “đức tin” và “luật pháp” theo lối diễn đạt Kinh Thánh quen thuộc; hai thể bị động liên tiếp phản ánh cấu trúc và sự căng thẳng của nguyên văn.
