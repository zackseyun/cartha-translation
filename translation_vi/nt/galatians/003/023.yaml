revisions:
- from: Nhưng trước khi đức tin đến[a], chúng ta bị canh giữ dưới luật pháp[b], bị giam giữ[c] cho đến khi đức tin sắp được bày tỏ.
  to: Nhưng trước khi đức tin[a][d] đến, chúng ta bị canh giữ dưới luật pháp[b], bị giam giữ[c] để chờ đức tin sắp được bày tỏ.
  rationale: Sửa quan hệ cú pháp để tiếng Việt tự nhiên hơn mà vẫn phản ánh εἰς ως sự hướng tới đức tin được mặc khải trong tương lai. Thêm chú thích d để hoàn chỉnh dấu vết kiểm tra từ vựng của πίστις. Không thay đổi ý nghĩa, mức độ mơ hồ của πίστις, hay sắc thái kép của hai động từ nói về luật pháp.
  reviewer_model: gpt-5.6-terra
