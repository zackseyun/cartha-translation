id: GAL.3.1
reference: Galatians 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: vi
  text: Hỡi người Ga-la-ti ngu muội! Ai đã mê hoặc anh em? Giê-su, Đấng Mê-si-a, đã được trình bày công khai trước mắt anh em là Đấng đã chịu đóng đinh trên thập tự giá.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai đã lừa dối anh em?” Động từ Hy Lạp gợi hình ảnh mê hoặc hoặc bỏ bùa.'
    reason: lexical_alternative
  - marker: b
    text: Cụm Hy Lạp là “Giê-su Christ”; trong cách dịch truyền thống tiếng Việt thường là “Giê-su Christ”. Ở đây Χριστός được dịch là “Đấng Mê-si-a” để giữ rõ ý nghĩa tước hiệu.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đã được nêu ra rõ ràng” hoặc “đã được công bố công khai là Đấng đã chịu đóng đinh trên thập tự giá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητοι
  choice: ngu muội
  rationale: Diễn đạt lời quở trách về sự thiếu hiểu biết và suy xét, nhưng không đẩy thành sự kết án đạo đức nặng hơn nguyên ngữ.
- source_word: Γαλάται
  choice: những người Ga-la-ti
  rationale: Cách gọi tự nhiên trong tiếng Việt đối với cộng đồng thuộc vùng Ga-la-ti.
- source_word: ἐβάσκανεν
  choice: đã mê hoặc
  rationale: Giữ hình ảnh mạnh của động từ Hy Lạp về việc dùng tà lực hoặc ảnh hưởng nguy hại; không làm phẳng nghĩa thành chỉ ‘lừa dối’.
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: những người mà ngay trước mắt mình
  rationale: Giữ liên hệ của đại từ quan hệ với người Ga-la-ti và nhấn mạnh tính trực diện, rõ ràng của điều đã được trình bày.
- source_word: Ἰησοῦς Χριστός
  choice: Đức Giê-su, Đấng Mê-si-a
  rationale: Chuyển Χριστός theo ý nghĩa tước hiệu là Đấng Mê-si-a, đồng thời dùng cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: προεγράφη
  choice: đã được trình bày công khai
  rationale: Chuyển tải ý một điều được đặt ra rõ ràng, công khai trước mắt người nghe; tránh giới hạn nghĩa vào một phương tiện cụ thể như tấm áp-phích.
- source_word: ἐσταυρωμένος
  choice: như Đấng chịu đóng đinh trên thập tự giá
  rationale: Phản ánh phân từ ở thể hoàn thành, mô tả Đức Giê-su trong tình trạng là Đấng đã chịu đóng đinh, gắn với động từ ‘được trình bày’.
theological_decisions:
- issue: Cách chuyển Χριστός trong cụm Ἰησοῦς Χριστός
  choice: Đức Giê-su, Đấng Mê-si-a
  alternative: Đức Giê-su Christ / Chúa Giê-su Christ
  rationale: Giữ cho Χριστός được nghe như một tước hiệu có nội dung thay vì như một phần tên riêng, nhưng chú thích cách dịch truyền thống để người đọc nhận ra thuật ngữ quen thuộc.
- issue: Sắc thái của ἐσταυρωμένος
  choice: như Đấng chịu đóng đinh trên thập tự giá
  alternative: đã bị đóng đinh trên thập tự giá
  rationale: 'Giữ quan hệ vị ngữ với προεγράφη: điều được công khai trình bày là Đức Giê-su trong tư cách hoặc tình trạng của Đấng chịu đóng đinh, thay vì biến cụm này thành một hành động kể chuyện độc lập.'
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Hỡi” giữ sức nặng của lời gọi trực tiếp; “anh em” phù hợp lối xưng hô cộng đồng trong thư tín. Dấu gạch ngang giúp giữ cấu trúc câu hỏi duy nhất và mệnh đề quan hệ của nguyên ngữ mà vẫn dễ theo dõi trong tiếng Việt.
