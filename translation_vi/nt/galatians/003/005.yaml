id: GAL.3.5
reference: Galatians 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: vi
  text: Vậy, Đấng ban Thánh Linh cho anh em và thực hiện các phép lạ giữa anh em[a] làm những điều ấy nhờ các việc làm theo luật pháp, hay nhờ nghe với đức tin[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “trong anh em.”
    reason: lexical_alternative
  - marker: b
    text: Hoặc “nhờ sự nghe của đức tin,” hay “nhờ sứ điệp được nghe với đức tin.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: ban
  rationale: “Ban” diễn đạt tự nhiên hành động cung ứng hay ban cho; dạng hiện tại của Hy Lạp cũng cho phép hiểu đây là hành động đang tiếp diễn.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong lập luận của Phao-lô, danh từ có mạo từ chỉ rõ Thánh Linh. Tiếng Việt thường cần gọi rõ “Thánh Linh” để tránh hiểu là tinh thần hay linh nói chung.
- source_word: ἐνεργῶν δυνάμεις
  choice: thực hiện các phép lạ
  rationale: Cụm động từ–danh từ này chỉ việc làm nên những biểu hiện quyền năng; “thực hiện các phép lạ” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ὑμῖν
  choice: giữa anh em
  rationale: Trong bối cảnh các cộng đồng Ga-la-ti chứng kiến những việc quyền năng, “giữa anh em” là cách hiểu tự nhiên; nghĩa “trong anh em” vẫn được giữ ở chú thích.
- source_word: ἐξ ἔργων νόμου
  choice: nhờ các việc làm theo luật pháp
  rationale: “Nhờ” thể hiện vai trò phương tiện hay căn cứ trong câu hỏi; “các việc làm theo luật pháp” truyền đạt thành ngữ của Phao-lô tự nhiên hơn cách dịch sát chữ “các việc làm của luật pháp”.
- source_word: νόμου
  choice: luật pháp
  rationale: Dù tiếng Hy Lạp không có mạo từ ở đây, trong mạch lập luận cụm từ này quy chiếu đến luật pháp Môi-se; tiếng Việt không cần thêm từ hạn định.
- source_word: ἀκοῆς πίστεως
  choice: nghe với đức tin
  rationale: Cách dịch này giữ sự tương phản giữa việc làm theo luật pháp và sự nghe đi kèm đức tin, đồng thời không biến “nghe” thành “sứ điệp” ngay trong chính văn.
- source_word: πίστεως
  choice: đức tin
  rationale: “Đức tin” phù hợp với sự tương phản trong câu và là cách diễn đạt quen thuộc, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cụm ἀκοῆς πίστεως có quan hệ sở hữu cách cô đọng và có thể được hiểu theo vài cách gần nhau.
  choice: nhờ nghe với đức tin
  alternative: nhờ sự nghe của đức tin; hoặc nhờ sứ điệp được nghe với đức tin
  rationale: Chính văn diễn đạt cách hiểu tự nhiên rằng sự nghe đi cùng đức tin, nhưng chú thích giữ lại cả cấu trúc sát chữ lẫn khả năng ἀκοή chỉ điều hay sứ điệp được nghe.
- issue: ἐν ὑμῖν có thể chỉ phạm vi cộng đồng hoặc hoạt động bên trong các tín hữu.
  choice: giữa anh em
  alternative: trong anh em
  rationale: “Giữa anh em” hợp với các phép lạ có thể quan sát trong cộng đồng, nhưng không loại bỏ khả năng nói đến hoạt động bên trong họ; khả năng ấy được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ hình thức câu hỏi tu từ của nguyên bản. “Đấng” viết hoa vì chủ thể được ngầm hiểu là Đức Chúa Trời, nhưng không thêm danh xưng không có trong câu Hy Lạp. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
