  source_fidelity: Bản dịch giữ đúng cấu trúc so sánh của καθὼς, động từ ἐπίστευσεν là “đã tin,” bổ ngữ τῷ θεῷ là “Đức Chúa Trời,” và bị động ἐλογίσθη với đối tượng được quy kể là αὐτῷ. “Điều đó được kể cho ông” diễn đạt rõ chủ thể hàm ẩn của bị động—đức tin của Áp-ra-ham—mà không thêm nội dung. Dấu phẩy cuối câu thích hợp vì câu Hy Lạp tiếp tục về mặt cú pháp sang câu kế tiếp.
