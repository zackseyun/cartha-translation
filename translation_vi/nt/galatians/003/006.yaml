reference: Galatians 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/006.yaml
  text: Just as Abraham believed God[a], and it was counted to him as righteousness,
translation:
  language: vi
  text: Cũng như Áp-ra-ham đã tin Đức Chúa Trời, và điều đó được kể cho ông là sự công chính[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự chính trực” hoặc “công lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Cũng như
  rationale: Giữ lực so sánh, nối trường hợp Áp-ra-ham với lập luận của Phao-lô một cách tự nhiên trong tiếng Việt.
- source_word: Ἀβραὰμ
  choice: Áp-ra-ham
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἐπίστευσεν
  choice: đã tin
  rationale: Diễn đạt trực tiếp động từ ở thì aorist mà không thêm sắc thái giải nghĩa như “đặt lòng tin” hay “tin cậy”.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Cách nói “tin Đức Chúa Trời” giữ cấu trúc bổ ngữ gián tiếp của Hy Lạp và nhấn mạnh việc Áp-ra-ham tin lời Ngài, thay vì diễn giải thành “tin vào Đức Chúa Trời”.
- source_word: ἐλογίσθη
  choice: được kể
  rationale: Giữ hình ảnh quy tính/hạch toán của λογίζομαι và phù hợp với lối diễn đạt Kinh Thánh quen thuộc, đồng thời vẫn dễ hiểu.
- source_word: αὐτῷ
  choice: cho ông
  rationale: Thể hiện người được quy kể sự công chính.
- source_word: εἰς δικαιοσύνην
  choice: là sự công chính
  rationale: “Sự công chính” là cách dịch phù hợp với địa vị được quy kể trong lập luận của Phao-lô; “là” diễn đạt chức năng kết quả/tư cách của εἰς trong câu trích dẫn.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong câu trích dẫn của Phao-lô
  choice: sự công chính
  alternative: sự chính trực; công lý
  rationale: “Sự công chính” giữ thuật ngữ thần học và pháp lý rộng của δικαιοσύνη trong mạch lập luận về điều được quy kể cho Áp-ra-ham, nhưng chú thích bảo lưu những nét nghĩa khác có thể có của từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu phẩy cuối câu vì cú pháp và lập luận tiếp tục sang câu 7; dùng “Đức Chúa Trời” và tên “Áp-ra-ham” theo cách gọi quen thuộc trong Kinh Thánh tiếng Việt.
