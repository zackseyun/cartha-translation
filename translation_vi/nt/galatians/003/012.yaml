id: GAL.3.12
reference: Galatians 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλ’· Ὁ ποιήσας ⸀αὐτὰ ζήσεται ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: vi
  text: 'Nhưng luật pháp không xuất phát từ đức tin; nhưng: “Ai làm những điều ấy thì sẽ sống nhờ chúng.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sống trong những điều ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Trích Lê-vi Ký 18:5.
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: luật pháp
  rationale: Cách dịch quen thuộc, trang trọng và đủ rộng để giữ nguyên cách diễn đạt của Phao-lô, trong khi ngữ cảnh vẫn hướng đến luật Môi-se.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: “Bởi” diễn đạt tự nhiên quan hệ nguồn gốc hoặc nguyên tắc của ἐκ mà không thu hẹp thành một lối giải thích như “dựa trên”; “đức tin” là cách dịch chuẩn của πίστις trong ngữ cảnh này.
- source_word: ἀλλά
  choice: trái lại
  rationale: Đánh dấu rõ sự tương phản mạnh và dẫn vào lời trích Kinh Thánh một cách tự nhiên.
- source_word: ὁ ποιήσας αὐτά
  choice: người nào làm theo những điều ấy
  rationale: Giữ ý nghĩa khái quát của phân từ có mạo từ; “làm theo” tự nhiên trong tiếng Việt khi nói đến các điều luật, còn “những điều ấy” giữ đại từ quy chiếu mà không giải thích quá mức.
- source_word: ζήσεται ἐν αὐτοῖς
  choice: sẽ nhờ những điều ấy mà sống
  rationale: Diễn đạt ἐν theo nghĩa phương tiện hoặc cơ sở phù hợp với văn cảnh lời trích; cách sát chữ hơn được ghi ở chú thích.
theological_decisions:
- issue: Sự tương phản giữa luật pháp và đức tin
  choice: “luật pháp không bởi đức tin”
  alternative: “luật pháp không dựa trên đức tin” hoặc “luật pháp không vận hành theo nguyên tắc đức tin”
  rationale: Giữ cấu trúc cô đọng và sự căng thẳng thần học của nguyên văn, không diễn giải thêm bản chất mối quan hệ giữa luật pháp và đức tin.
- issue: Ý nghĩa của ἐν αὐτοῖς trong lời trích
  choice: “nhờ những điều ấy mà sống”
  alternative: “sống trong những điều ấy”
  rationale: Bản chính thể hiện cách hiểu theo phương tiện/cơ sở, nhưng chú thích bảo tồn khả năng dịch sát hình thức và nét mơ hồ của giới từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ nét cô đọng trong lập luận của Phao-lô và tránh thuật ngữ giải nghĩa mang tính hệ phái.
