  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc chính của câu: sự đối lập giữa luật pháp và đức tin, rồi lời trích về người thực hành các điều ấy. Tuy nhiên, “làm theo” diễn giải nhẹ động từ ποιήσας (“làm”), và “nhờ những điều ấy mà sống” có thể được diễn đạt gọn, sát liên kết của ἐν αὐτοῖς hơn.'
