  terminology: Giữ “luật pháp” và “đức tin,” là các thuật ngữ quen thuộc, trang trọng, và không áp đặt một cách giải thích hệ phái. Giữ “Lê-vi Ký” theo dạng tên sách hiện có của bản dịch.
