  rationale: Bản sửa giữ sát sự đối lập của nguyên văn (“luật pháp không xuất phát từ đức tin”) và không thêm sắc thái “làm theo” vào động từ “làm.” “Sống nhờ chúng” bảo lưu cách hiểu ἐν αὐτοῖς theo phương tiện/cơ sở; chú thích giữ phương án sát hình thức “trong những điều ấy.”
  reviewer_model: gpt-5.6-terra
