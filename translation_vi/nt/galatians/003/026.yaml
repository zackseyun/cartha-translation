source:
  edition: SBLGNT
  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: vi
  text: Vì anh chị em hết thảy đều là con trai[a] của Đức Chúa Trời nhờ đức tin trong Đấng Mê-si-a[b] Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “con cái của Đức Chúa Trời.” Tiếng Hy Lạp dùng “con trai”, giữ sắc thái địa vị làm con và thừa kế.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng Christ.” “Mê-si-a” và “Christ” đều mang nghĩa “Đấng được xức dầu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: tất cả anh chị em đều
  rationale: Đi với động từ ngôi thứ hai số nhiều ἐστε, từ này nhấn mạnh toàn thể những người được خطاب; cách diễn đạt này tự nhiên trong tiếng Việt và cho thấy cả cộng đồng đều được bao gồm.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu căn cứ cho lời khẳng định ngay trước đó.
- source_word: υἱοὶ θεοῦ
  choice: con trai của Đức Chúa Trời
  rationale: Giữ danh từ giống đực υἱοί và sắc thái địa vị làm con cùng quyền thừa kế trong lập luận của Phao-lô; cụm 'anh chị em' cho thấy lời này hướng đến toàn thể cộng đồng.
- source_word: διὰ τῆς πίστεως
  choice: nhờ đức tin
  rationale: Diễn đạt διά với sở hữu cách như phương tiện, đồng thời giữ thuật ngữ quen thuộc 'đức tin' cho πίστις.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ ἐν để bảo toàn ngôn ngữ về sự ở trong/hiệp nhất với Đấng Mê-si-a; dịch Χριστός như một tước hiệu và phiên âm tên Ἰησοῦ.
theological_decisions:
- issue: Ngôn ngữ chỉ địa vị làm con có giống đực
  choice: con trai của Đức Chúa Trời
  alternative: con cái của Đức Chúa Trời
  rationale: Bản Hy Lạp dùng υἱοί, không dùng một danh từ trung tính. Giữ 'con trai' bảo toàn hình thức và sắc thái địa vị thừa kế, còn chú thích nêu cách dịch bao quát hơn.
- issue: Cách chuyển dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Χριστός là tước hiệu mang nghĩa 'Đấng được xức dầu'; 'Đấng Mê-si-a' truyền đạt nội dung của tước hiệu thay vì chỉ dùng dạng phiên âm truyền thống.
- issue: Phạm vi của ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  alternative: đặt nơi Đấng Mê-si-a Giê-su
  rationale: 'Giữ cấu trúc có chủ ý mơ hồ của tiếng Hy Lạp: cụm này có thể gắn với đức tin hoặc với địa vị làm con, đồng thời gợi ngôn ngữ hiệp nhất với Đấng Mê-si-a.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh chị em' để làm rõ đại từ số nhiều chỉ toàn thể hội chúng, nhưng vẫn giữ 'con trai' nhằm bảo toàn sắc thái nguyên ngữ về địa vị và quyền thừa kế. Trật tự 'nhờ đức tin trong...' được giữ để không thu hẹp quan hệ cú pháp vốn có thể hiểu theo hơn một cách.
