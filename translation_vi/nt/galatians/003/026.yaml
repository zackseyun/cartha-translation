- from: Vì tất cả anh chị em đều là con trai của Đức Chúa Trời nhờ đức tin trong Đấng Mê-si-a[a] Giê-su.
  to: Vì anh chị em hết thảy đều là con trai[a] của Đức Chúa Trời nhờ đức tin trong Đấng Mê-si-a[b] Giê-su.
