  terminology: Giữ “con trai của Đức Chúa Trời” để phản ánh υἱοί và sắc thái địa vị/thừa kế; thêm chú thích về “con cái” để người đọc thấy phương án bao quát hơn. Giữ “Đấng Mê-si-a” như bản dịch tước hiệu Χριστός; chú thích “Đấng Christ” là phương án truyền thống.
