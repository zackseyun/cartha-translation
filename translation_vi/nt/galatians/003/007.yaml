    rationale: Cụm này có thể hiểu được, nhưng «những người thuộc về đức tin» diễn đạt tự nhiên hơn sắc thái ἐκ πίστεως mà không xác định thêm nội dung của đức tin.
  revised_text: Vậy, hãy biết rằng những người thuộc về đức tin—chính họ là con cái của Áp-ra-ham.
