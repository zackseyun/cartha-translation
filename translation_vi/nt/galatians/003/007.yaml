  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng quan hệ suy luận của ἄρα, mệnh lệnh số nhiều Γινώσκετε, nhóm οἱ ἐκ πίστεως, và sự nhấn mạnh đối chiếu của οὗτοι. Tuy nhiên, «con cháu» làm mở rộng υἱοί («các con/các con trai») thành hậu duệ nói chung, giảm hình ảnh tư cách con cái/gia đình mà Phao-lô dùng và không phản ánh sát số nhiều «sons» của bản tiếng Anh audit.
  naturalness: «Vậy, hãy biết rằng...» là tiếng Việt hiện đại, rõ ràng và phù hợp văn cảnh. «Những người bởi đức tin» hơi sát cấu trúc Hy Lạp nhưng vẫn hiểu được; «những người thuộc về đức tin» tự nhiên hơn mà vẫn không thêm đối tượng cho đức tin.
  terminology: 'Nên dùng «con cái của Áp-ra-ham» cho υἱοί Ἀβραάμ: cách này tự nhiên, không giới hạn nam giới trong tiếng Việt hiện đại, và giữ được phép ẩn dụ về tư cách con cái tốt hơn «con cháu». Giữ «Áp-ra-ham» nhất quán với quy ước phiên âm hiện có.'
