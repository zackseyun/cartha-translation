  text: Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι ⸂υἱοί εἰσιν⸃ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: vi
  text: Vậy, hãy biết rằng những người thuộc về đức tin—chính họ là con cái của Áp-ra-ham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: hãy biết
  rationale: Giữ lực mệnh lệnh của hình thức Hy Lạp; trong ngữ cảnh, Phao-lô kêu gọi độc giả nhận rõ một kết luận.
- source_word: ἄρα
  choice: vậy
  rationale: Diễn đạt quan hệ suy luận với lập luận ngay trước đó.
- source_word: οἱ ἐκ πίστεως
  choice: những người bởi đức tin
  rationale: Giữ cấu trúc ἐκ πίστεως và không tự ý bổ sung đối tượng của đức tin; cách nói có phần cô đọng nhưng bảo tồn sắc thái thần học của nguyên văn.
- source_word: οὗτοι
  choice: chính họ
  rationale: Thể hiện đại từ chỉ định có tính nhấn mạnh, xác định nhóm vừa nêu là con cháu Áp-ra-ham.
- source_word: υἱοί ... Ἀβραάμ
  choice: con cháu của Áp-ra-ham
  rationale: Trong tiếng Việt, “con cháu” truyền đạt tự nhiên tư cách hậu duệ/gia đình rộng hơn, thay vì dễ bị hiểu là các con trai trực hệ hoặc chỉ giới nam.
theological_decisions:
- issue: Tư cách thuộc về gia đình Áp-ra-ham
  choice: chính những người bởi đức tin là con cháu của Áp-ra-ham
  alternative: những người có đức tin là con trai của Áp-ra-ham
  rationale: Bảo tồn khẳng định nhấn mạnh của câu rằng tư cách thuộc dòng dõi Áp-ra-ham gắn với đức tin, đồng thời tránh khiến υἱοί bị hiểu theo nghĩa sinh học hoặc chỉ nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang giữ nhịp nhấn của οὗτοι. Không thêm chú thích vì bản dịch có thể chuyển tải các điểm chính trực tiếp trong câu.
