id: GAL.3.18
reference: Galatians 3:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: vi
  text: Vì nếu phần thừa kế đến từ luật pháp thì không còn đến từ lời hứa nữa; nhưng Đức Chúa Trời đã ân ban phần ấy cho Áp-ra-ham qua một lời hứa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng Đức Chúa Trời đã ban phần ấy cho Áp-ra-ham bằng lời hứa.”'
    reason: Nêu cách diễn đạt sát hơn giá trị phương tiện của δι’ ἐπαγγελίας và cách dịch ít nhấn mạnh sắc thái ân huệ của κεχάρισται.
lexical_decisions:
- source_word: κληρονομία
  choice: phần thừa kế
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại điều người thừa kế nhận được, đồng thời giữ đúng vai trò của khái niệm này trong lập luận của Phao-lô.
- source_word: ἐκ νόμου
  choice: đến từ luật pháp
  rationale: Giữ sắc thái nguồn gốc/cơ sở của ἐκ và sự đối ứng trực tiếp với ἐξ ἐπαγγελίας; “luật pháp” trong văn cảnh chỉ Luật Môi-se.
- source_word: ἐξ ἐπαγγελίας
  choice: đến từ lời hứa
  rationale: Bảo toàn phép đối xứng với “đến từ luật pháp” mà không giải thích thêm nội dung của lời hứa.
- source_word: δι’ ἐπαγγελίας
  choice: qua một lời hứa
  rationale: Thể hiện giá trị phương tiện của διά và giữ dạng không có mạo từ của danh từ theo cách tự nhiên trong tiếng Việt.
- source_word: κεχάρισται
  choice: đã rộng lòng ban
  rationale: “Ban” phù hợp với hành động của Đức Chúa Trời, còn “rộng lòng” giữ sắc thái ân huệ của χαρίζομαι; “đã” chuyển tải kết quả hiện còn hiệu lực của thì hoàn thành mà không làm câu nặng nề.
- source_word: τῷ Ἀβραὰμ
  choice: cho Áp-ra-ham
  rationale: Thể hiện rõ Áp-ra-ham là người nhận hành động ban cho.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc và không gắn riêng với một lập trường hệ phái trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Có nên biểu đạt rõ sắc thái ân huệ của κεχάρισται hay không
  choice: Dịch là “đã rộng lòng ban”.
  alternative: “đã ban” hoặc “đã ban cho không”
  rationale: Cách chọn giữ được sắc thái ban ơn vốn có của động từ mà không thêm một hệ thống thần học vào câu.
- issue: Quan hệ giữa luật pháp và lời hứa
  choice: Giữ hai cụm song song “đến từ luật pháp” và “đến từ lời hứa”.
  alternative: Diễn giải là “dựa vào việc tuân giữ luật pháp” và “dựa vào đức tin nơi lời hứa”.
  rationale: Bản Hy Lạp chỉ nêu nguồn/cơ sở là luật pháp hay lời hứa; không nên đưa “tuân giữ” hoặc “đức tin” vào câu dù các ý ấy có thể xuất hiện trong lập luận rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phần thừa kế” rõ nghĩa hơn “cơ nghiệp” đối với độc giả phổ thông; cấu trúc đối xứng được duy trì để làm nổi bật lập luận chặt chẽ của câu.
