  to: Vì nếu phần thừa kế đến từ luật pháp thì không còn đến từ lời hứa nữa; nhưng Đức Chúa Trời đã ân ban phần ấy cho Áp-ra-ham qua một lời hứa.[a]
  rationale: Chỉ thay «rộng lòng ban» bằng «ân ban». Bản sửa giữ nguyên đối ứng «đến từ», người nhận, phương tiện «qua một lời hứa», và tham chiếu của «phần ấy» đến «phần thừa kế»; đồng thời làm cách diễn đạt tiếng Việt tự nhiên và chính xác hơn về sắc thái ân huệ.
