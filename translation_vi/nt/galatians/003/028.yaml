id: GAL.3.28
reference: Galatians 3:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: vi
  text: Không có người Do Thái hay người Hy Lạp, không có người nô lệ hay người tự do, không có nam và nữ[a]; vì tất cả anh chị em đều là một trong Đấng Mê-si-a Giê-su.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “nam và nữ”, có lẽ vọng lại Sáng Thế Ký 1:27; cũng có thể diễn đạt theo ý đối xứng là “nam hay nữ”.
    reason: Bảo tồn cách dùng καὶ khác với οὐδὲ trong hai cặp trước và nêu cách diễn đạt thay thế tự nhiên hơn.
  - marker: b
    text: 'Nguyên văn Hy Lạp: “ἐν Χριστῷ Ἰησοῦ” (“trong Christ Giê-su”). Χριστός là tước hiệu có nghĩa là “Đấng được xức dầu”, tương ứng với “Đấng Mê-si-a”.'
    reason: Sửa dạng từ Hy Lạp cho chính xác và giải thích lựa chọn dịch Χριστός theo giá trị tước hiệu.
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: không có
  rationale: Diễn đạt tự nhiên sắc thái phủ định hiện hữu và giữ nguyên cấu trúc lặp lại đầy nhấn mạnh của câu Hy Lạp.
- source_word: Ἰουδαῖος / Ἕλλην
  choice: người Do Thái / người Hy Lạp
  rationale: Giữ cặp sắc tộc–tôn giáo cụ thể của nguyên văn, không mở rộng Ἕλλην thành toàn thể dân ngoại.
- source_word: δοῦλος / ἐλεύθερος
  choice: người nô lệ / người tự do
  rationale: Phản ánh trực tiếp sự đối lập về địa vị xã hội; δοῦλος chỉ thân phận nô lệ rõ hơn là người phục vụ.
- source_word: ἄρσεν καὶ θῆλυ
  choice: nam và nữ
  rationale: Giữ từ nối καὶ là “và”, khác với οὐδὲ trong hai cặp trước, đồng thời bảo tồn khả năng câu này vọng lại Sáng Thế Ký 1:27.
- source_word: πάντες γὰρ ὑμεῖς
  choice: vì tất cả anh chị em
  rationale: Chuyển tải đại từ số nhiều ngôi thứ hai cùng sự nhấn mạnh bao quát của πάντες bằng cách xưng hô tự nhiên, trang trọng và bao gồm cả cộng đồng.
- source_word: εἷς ἐστε
  choice: đều là một
  rationale: Giữ cách nói cô đọng về sự hiệp một tập thể, không diễn giải thêm thành “một người” hay chỉ nói chung là “hiệp nhất”.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Thể hiện Χριστός như một tước hiệu, “Đấng Mê-si-a”, thay vì coi đây chỉ là một phần của tên riêng; đồng thời giữ giới từ “trong” diễn tả mối liên hệ hiệp nhất.
theological_decisions:
- issue: Cách dịch ἄρσεν καὶ θῆλυ sau hai cặp dùng οὐδὲ
  choice: nam và nữ
  alternative: nam hay nữ
  rationale: Nguyên văn cố ý đổi sang καὶ (“và”), có khả năng vọng lại Sáng Thế Ký 1:27. Giữ sự khác biệt này bảo tồn nét căng và liên tưởng của câu thay vì làm cho cả ba cặp hoàn toàn đồng dạng.
- issue: Mức độ diễn giải εἷς ἐστε
  choice: tất cả anh chị em đều là một
  alternative: tất cả anh chị em đều hiệp nhất / đều là một người
  rationale: Bản dịch tối thiểu này khẳng định sự hiệp một trong Đấng Mê-si-a nhưng không tự ý xác định rằng mọi khác biệt thụ tạo đều bị xóa bỏ, cũng không thêm hình ảnh “một người” vốn không được nói rõ.
- issue: Giá trị tước hiệu của Χριστός
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su / Chúa Cứu Thế Giê-su
  rationale: “Đấng Mê-si-a” biểu đạt rõ tước hiệu của Χριστός và tránh biến tước hiệu thành họ hay phần tên riêng; chú thích giữ lại thông tin về từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc ba vế phủ định được giữ để bảo toàn nhịp điệu và sức nhấn mạnh. “Anh chị em” được dùng cho đại từ số nhiều ngôi thứ hai nhằm nói trực tiếp với toàn thể cộng đồng mà không thêm một khẳng định thần học ngoài câu.
