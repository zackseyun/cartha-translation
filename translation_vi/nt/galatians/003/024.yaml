id: GAL.3.24
reference: Galatians 3:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/024.yaml
  text: So then[a], the law has become our guardian until Messiah[b], so that we might be justified by faith.
translation:
  language: vi
  text: Vậy thì, luật pháp đã trở thành người giám hộ của chúng ta[a] cho đến khi Đấng Mê-si đến[b], để chúng ta được tuyên là công chính nhờ đức tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người trông nom”; cách dịch truyền thống “thầy giáo” dễ gây hiểu lầm. Từ Hy Lạp παιδαγωγός chỉ người trong gia đình chịu trách nhiệm trông nom và giám sát một đứa trẻ, chứ không chủ yếu là giáo viên đứng lớp.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “hướng đến Đấng Mê-si”; cụm từ này cũng có thể được hiểu là luật pháp “dẫn chúng ta đến với Đấng Mê-si.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Vậy thì
  rationale: Trong ngữ cảnh, từ này dẫn ra kết luận từ lập luận phía trước; “Vậy thì” diễn đạt quan hệ suy luận một cách tự nhiên.
- source_word: ὁ νόμος
  choice: luật pháp
  rationale: Cụm từ xác định chỉ Luật pháp Môi-se như một phạm trù đã được nhận biết trong thư Ga-la-ti.
- source_word: παιδαγωγὸς
  choice: người giám hộ
  rationale: Trong xã hội Hy-La, παιδαγωγός là người trông nom, giám sát một trẻ vị thành niên trong gia đình, chứ không chủ yếu là giáo viên đứng lớp.
- source_word: ἡμῶν
  choice: của chúng ta
  rationale: Đại từ sở hữu bổ nghĩa cho “người giám hộ” và được chuyển sang tiếng Việt theo cách tự nhiên.
- source_word: γέγονεν
  choice: đã trở thành
  rationale: Thì hoàn thành Hy Lạp diễn tả một sự việc đã xảy ra với kết quả còn hiệu lực; “đã trở thành” giữ được nét nghĩa này.
- source_word: εἰς Χριστόν
  choice: cho đến khi Đấng Mê-si đến
  rationale: Trong mạch văn, εἰς hướng đến Đấng Mê-si như đích điểm hoặc giới hạn của vai trò giám hộ của luật pháp. Cách diễn đạt này rõ nghĩa trong tiếng Việt, còn sắc thái “hướng đến/dẫn đến” được giữ trong chú thích.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Χριστός mang lực của tước hiệu; “Đấng Mê-si” truyền đạt ý nghĩa ấy thay vì dùng dạng tên riêng “Christ”.
- source_word: ἵνα
  choice: để
  rationale: ἵνα giới thiệu mục đích; “để” là cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt.
- source_word: ἐκ πίστεως
  choice: nhờ đức tin
  rationale: Cụm giới từ chỉ phương tiện hoặc cơ sở; “nhờ đức tin” vừa tự nhiên vừa giữ được ý nghĩa của nguyên văn.
- source_word: δικαιωθῶμεν
  choice: chúng ta được tuyên là công chính
  rationale: Động từ bị động giữ hình ảnh pháp lý của δικαιόω, đồng thời “được tuyên là công chính” dễ hiểu hơn thuật ngữ truyền thống “được xưng công chính” đối với độc giả phổ thông.
theological_decisions:
- issue: Cách hiểu εἰς Χριστόν trong mối liên hệ với vai trò của luật pháp
  choice: “cho đến khi Đấng Mê-si đến,” nhấn mạnh Đấng Mê-si là giới hạn thời gian và đích điểm của vai trò giám hộ
  alternative: “hướng đến Đấng Mê-si” hoặc “dẫn chúng ta đến với Đấng Mê-si”
  rationale: Mạch văn Ga-la-ti 3 nhấn mạnh vai trò tạm thời của luật pháp trước khi đức tin được bày tỏ, nhưng giới từ εἰς cũng có thể gợi hướng đi hay mục tiêu. Bản dịch chính diễn đạt cách hiểu phù hợp nhất với ngữ cảnh, còn chú thích giữ lại khả năng kia.
- issue: Cách diễn đạt δικαιωθῶμεν
  choice: “được tuyên là công chính”
  alternative: “được xưng công chính”
  rationale: Cách chọn giữ thể bị động và sắc thái phán quyết của động từ, nhưng không quyết định thêm những vấn đề thần học nằm ngoài câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “luật pháp” và “đức tin” là những thuật ngữ Kinh Thánh quen thuộc; giải nghĩa thuật ngữ pháp lý bằng “được tuyên là công chính.” Các chú thích giữ lại nét nghĩa xã hội-lịch sử của παιδαγωγός và sự đa nghĩa của εἰς Χριστόν.
