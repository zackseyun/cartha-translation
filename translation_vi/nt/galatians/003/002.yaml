id: GAL.3.2
reference: Galatians 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: vi
  text: 'Tôi chỉ muốn hỏi anh chị em điều này: Anh chị em đã nhận Thánh Linh nhờ những việc làm theo luật pháp, hay nhờ việc nghe với đức tin[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp rất cô đọng, cũng có thể dịch là “nhờ sự nghe của đức tin” hoặc hiểu là “nhờ nghe sứ điệp trong đức tin.” “Sự thành tín” là một sắc thái ít có khả năng hơn của từ được dịch là “đức tin” ở đây.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: chỉ ... điều này
  rationale: Giữ sự nhấn mạnh ở đầu câu của Phao-lô, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: Tôi muốn biết ... từ anh chị em
  rationale: “Muốn biết từ anh chị em” chuyển tải trực tiếp ý hỏi để nhận câu trả lời; “anh chị em” biểu thị đại từ số nhiều và phù hợp văn phong thư tín.
- source_word: ἐξ ἔργων νόμου
  choice: nhờ làm những việc luật pháp đòi hỏi
  rationale: Diễn đạt thành ngữ Hy Lạp cô đọng bằng tiếng Việt tự nhiên, chỉ những việc được thực hiện theo đòi hỏi của luật pháp, không thêm ý công trạng.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong ngữ cảnh Ga-la-ti 3, từ này chỉ Thánh Linh của Đức Chúa Trời; cách gọi “Thánh Linh” làm rõ đối tượng mà không chuyển thành một kinh nghiệm tinh thần chung chung.
- source_word: ἐλάβετε
  choice: đã nhận lãnh
  rationale: Thì aorist hướng đến việc họ đã nhận Thánh Linh; “nhận lãnh” là cách nói trang trọng nhưng vẫn quen thuộc.
- source_word: ἐξ ἀκοῆς πίστεως
  choice: nhờ nghe và tin
  rationale: 'Cách dịch này phản ánh khả năng chính của cấu trúc cô đọng: nghe sứ điệp và đáp lại bằng đức tin, đồng thời giữ sự đối lập về phương cách với các việc luật pháp đòi hỏi.'
- source_word: πίστεως
  choice: tin
  rationale: Trong cụm này, động từ “tin” tạo câu tiếng Việt tự nhiên và chuyển tải πίστις như sự đáp ứng bằng đức tin; độ cô đọng và các cách hiểu khác của nguyên ngữ được ghi ở chú thích.
theological_decisions:
- issue: Đối tượng của τὸ πνεῦμα
  choice: Thánh Linh
  alternative: thần linh; một kinh nghiệm hay quyền năng thuộc linh nói chung
  rationale: Mạch văn Ga-la-ti 3 nói về Thánh Linh Đức Chúa Trời mà các tín hữu đã nhận; tuy Hy Lạp không có tính từ “thánh”, đối tượng thần linh cụ thể được ngữ cảnh xác định.
- issue: Quan hệ trong cụm ἀκοῆς πίστεως
  choice: nghe và tin
  alternative: nghe về đức tin; nghe bởi đức tin; nghe về sự thành tín
  rationale: Cấu trúc sở hữu cách Hy Lạp rất cô đọng. “Nghe và tin” truyền đạt cách hiểu phù hợp nhất trong thế đối lập với việc làm theo luật pháp, nhưng chú thích vẫn bảo lưu tính mơ hồ thật sự.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều; câu hỏi trực tiếp giữ sức mạnh tu từ của nguyên văn. Chú thích gộp các khả năng ngữ pháp và sắc thái từ vựng có thật mà không áp đặt cách giải thích hệ phái.
