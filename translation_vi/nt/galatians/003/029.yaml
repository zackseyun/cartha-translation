source:
  edition: SBLGNT
  text: εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, ⸀κατ’ ἐπαγγελίαν κληρονόμοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/029.yaml
  text: And if you are Messiah’s[a], then you are Abraham’s seed[b], heirs according to promise.
translation:
  language: vi
  text: Nếu anh chị em thuộc về Đấng Mê-si-a[a], thì anh chị em là dòng dõi[b] của Áp-ra-ham, là những người thừa kế theo lời hứa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “hạt giống”; từ Hy Lạp ở dạng số ít và nhắc lại cách dùng từ của Phao-lô trước đó trong chương này. Cũng có thể dịch: “con cháu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: thuộc về Đấng Mê-si
  rationale: Dạng sở hữu trong tiếng Hy Lạp diễn tả sự thuộc về; cách nói này tự nhiên trong tiếng Việt. Χριστός được dịch theo nghĩa tước hiệu là “Đấng Mê-si”.
- source_word: σπέρμα
  choice: dòng dõi
  rationale: “Dòng dõi” là cách diễn đạt tự nhiên cho danh từ tập hợp chỉ hậu duệ, đồng thời phù hợp với mạch lập luận về dòng dõi Áp-ra-ham. Chú thích ghi nhận hình ảnh nguyên văn “hạt giống” và dạng số ít.
- source_word: κληρονόμοι
  choice: những người thừa kế
  rationale: Cách dịch tự nhiên, rõ nghĩa trong bối cảnh gia đình và lời hứa giao ước, đồng thời thể hiện số nhiều của danh từ Hy Lạp.
- source_word: κατ’ ἐπαγγελίαν
  choice: theo lời hứa
  rationale: Giữ cách diễn đạt ngắn gọn và không quyết định quá mức rằng lời hứa là nền tảng, tiêu chuẩn hay phương thức của quyền thừa kế.
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: Nếu anh chị em ... thì
  rationale: Thể hiện rõ cấu trúc điều kiện–kết luận; δέ chỉ là từ nối nhẹ nên không cần dịch riêng trong tiếng Việt.
theological_decisions:
- issue: Nên dịch σπέρμα bằng hình ảnh sát chữ hay bằng danh từ tập hợp tự nhiên chỉ hậu duệ.
  choice: dòng dõi
  alternative: hạt giống; con cháu
  rationale: “Dòng dõi” dễ hiểu đối với độc giả hiện đại và vẫn duy trì được mối liên hệ với lập luận xuyên suốt Ga-la-ti 3. Chú thích bảo tồn hình ảnh “hạt giống” và ý nghĩa của dạng số ít trong nguyên văn.
- issue: Nên dịch Χριστός như một tước hiệu hay theo dạng tên gọi truyền thống.
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này Χριστός mang chức năng tước hiệu. Chú thích giữ cách gọi truyền thống như một phương án dịch hợp lệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” diễn đạt đại từ số nhiều ὑμεῖς theo cách bao hàm tự nhiên; “thuộc về” tránh lối sở hữu gượng trong tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện ngay sau từ ngữ liên quan.
