    rationale: Nguyên văn có cụm số nhiều τοῖς σπέρμασιν, và chính sự đối lập số nhiều/số ít là trọng tâm lập luận của Phao-lô. Chú thích hiện có chỉ giải thích phương án “hạt giống” và tước hiệu Mê-si-a, nên chưa giúp độc giả nhận ra hình thức số nhiều cố ý khác thường.
  - severity: low
    issue: “tức là Đấng Mê-si-a” có tính diễn giải nhẹ hơn cấu trúc ὅς ἐστιν.
    rationale: “là Đấng Mê-si-a” phản ánh trực tiếp hơn lời xác định trong nguyên văn, không cần thêm từ nối giải thích.
