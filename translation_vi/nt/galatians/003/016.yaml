id: GAL.3.16
reference: Galatians 3:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: vi
  text: 'Những lời hứa đã được phán với Áp-ra-ham và với dòng dõi ông[a]. Kinh Thánh không nói: “Và với các dòng dõi,”[b] như nói về nhiều người, nhưng như nói về một người: “Và với dòng dõi của con,” là Đấng Mê-si-a.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hạt giống” trong cả câu này. Từ Hy Lạp là một danh từ số ít có tính tập hợp; hình thức số ít ấy là trọng tâm trong lập luận của Phao-lô.
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: “Và với các hạt giống.” Phao-lô nhấn mạnh hình thức số nhiều của cách diễn đạt này.'
    reason: lexical_alternative
  - marker: c
    text: “Đấng Mê-si-a” cũng thường được gọi là “Đấng Christ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: đã được phán
  rationale: Giữ thể bị động và sắc thái lời phán có thẩm quyền, đồng thời tự nhiên trong văn cảnh nói về lời hứa của Đức Chúa Trời.
- source_word: ἐπαγγελίαι
  choice: những lời hứa
  rationale: Cách dịch chuẩn, rõ ràng cho số nhiều và phù hợp với cách dùng của Phao-lô.
- source_word: σπέρμα / σπέρματι
  choice: dòng dõi
  rationale: “Dòng dõi” là danh từ tập hợp tự nhiên trong tiếng Việt, có thể chỉ một hậu duệ hoặc toàn thể hậu duệ, nhờ đó giữ được điểm then chốt và độ căng trong lập luận của Phao-lô.
- source_word: τοῖς σπέρμασιν
  choice: các dòng dõi
  rationale: Dùng hình thức số nhiều có phần cố ý khác thường để làm nổi bật sự đối lập ngữ pháp giữa số nhiều và danh từ tập hợp số ít trong nguyên văn.
- source_word: ὡς ἐπὶ πολλῶν
  choice: như nói về nhiều người
  rationale: Diễn đạt tự nhiên ý quy chiếu đến nhiều đối tượng.
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: nhưng như nói về một người
  rationale: Giữ sự đối xứng với vế trước và nhấn mạnh số một mà không giải thích quá mức.
- source_word: Χριστός
  choice: Đấng Mê-si-a
  rationale: Trong công thức nhận diện này, từ ngữ mang chức năng tước hiệu; cách dịch này làm rõ nghĩa “Đấng được xức dầu” theo lối dùng hiện đại.
theological_decisions:
- issue: Cách dịch Χριστός trong lời xác định hậu tự được hứa
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Văn cảnh nhận diện “dòng dõi” với nhân vật mang tước hiệu cứu thế, nên “Đấng Mê-si-a” bảo toàn chức năng tước hiệu mà không thêm diễn giải giáo phái.
- issue: Lập luận từ σπέρμα ở số ít
  choice: Giữ “dòng dõi” là danh từ tập hợp và làm rõ đối lập với “các dòng dõi”
  alternative: Dịch “hậu duệ” và “các hậu duệ”
  rationale: “Dòng dõi” gần với phép chơi ngữ pháp của nguyên văn hơn, nhưng vẫn để nguyên sự căng thẳng rằng danh từ số ít có thể mang nghĩa tập hợp; không âm thầm giải quyết khó khăn trong lập luận của Phao-lô.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Dòng dõi” được chọn vì quen thuộc, súc tích và giữ được tính tập hợp; “các dòng dõi” cố ý hơi khác thường để phản ánh sự đối lập số nhiều trong tiếng Hy Lạp. Chủ ngữ “Kinh Thánh” ở câu thứ hai được bổ sung theo nghĩa hàm ẩn của công thức trích dẫn nhằm tránh câu tiếng Việt mơ hồ, không thay đổi nội dung lập luận.
