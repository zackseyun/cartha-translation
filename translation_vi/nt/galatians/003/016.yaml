  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt chính xác các yếu tố chính của câu: các lời hứa được phán với Áp-ra-ham và dòng dõi ông; lập luận đối chiếu số nhiều với số ít; và sự đồng nhất dòng dõi ấy với Đấng Mê-si-a. Tuy nhiên, đối lập hình thức số nhiều của τοῖς σπέρμασιν cần có chú thích riêng và mỏ chú thích đặt ngay sau “các dòng dõi” để người đọc thấy rõ cơ sở ngôn ngữ của lập luận.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và hiện đại. “Dòng dõi”/“các dòng dõi” giữ được tính tập hợp và sự cố ý khác thường của cách nói số nhiều. Đổi “tức là” thành “là” phản ánh trực tiếp hơn ὅς ἐστιν mà vẫn tự nhiên.
  terminology: “Những lời hứa,” “dòng dõi,” và “Đấng Mê-si-a” phù hợp. “Đấng Mê-si-a” giữ chức năng tước hiệu của Χριστός; chú thích nêu “Đấng Christ” là phương án quen dùng. “Kinh Thánh không nói” là cách làm rõ chủ ngữ hàm ẩn trong công thức trích dẫn và không làm thay đổi lập luận.
  issues:
