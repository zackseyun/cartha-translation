revisions:
- from: 'Những lời hứa đã được phán với Áp-ra-ham và với dòng dõi ông[a]. Kinh Thánh không nói: “Và với các dòng dõi,” như nói về nhiều người, nhưng như nói về một người: “Và với dòng dõi của con,” tức là Đấng Mê-si-a.[b]'
  to: 'Những lời hứa đã được phán với Áp-ra-ham và với dòng dõi ông[a]. Kinh Thánh không nói: “Và với các dòng dõi,”[b] như nói về nhiều người, nhưng như nói về một người: “Và với dòng dõi của con,” là Đấng Mê-si-a.[c]'
  rationale: Bổ sung chú thích và mỏ chú thích cho cụm số nhiều “các dòng dõi” để bảo toàn minh bạch điểm lập luận ngữ pháp của nguyên văn. Điều chỉnh “tức là” thành “là” để bám sát hơn công thức nhận diện ὅς ἐστιν, mà không thay đổi ý nghĩa hay sắc thái tước hiệu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:18Z'
