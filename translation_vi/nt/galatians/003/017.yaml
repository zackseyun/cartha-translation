id: GAL.3.17
reference: Galatians 3:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: vi
  text: 'Điều tôi muốn nói là thế này: Luật pháp, xuất hiện bốn trăm ba mươi năm sau, không hủy bỏ[a] giao ước đã được Đức Chúa Trời phê chuẩn từ trước, để làm cho lời hứa mất hiệu lực.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “vô hiệu hóa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “để làm cho lời hứa vô hiệu” hoặc “để gạt bỏ lời hứa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: Điều tôi muốn nói là thế này
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt để dẫn vào lời giải thích của Phao-lô; không thêm một từ chỉ thời gian như “bây giờ” vì nguyên văn không có từ tương ứng.
- source_word: διαθήκην
  choice: giao ước
  rationale: Trong văn cảnh Ga-la-ti 3, từ này chỉ giao ước gắn với lời hứa của Đức Chúa Trời dành cho Áp-ra-ham; “giao ước” chính xác hơn “di chúc” hay “thỏa thuận”.
- source_word: προκεκυρωμένην
  choice: đã được ... phê chuẩn từ trước
  rationale: Giữ sắc thái pháp lý của động từ và ý nghĩa một hành động đã được xác lập trước đó, thể hiện qua tiền tố προ- và phân từ hoàn thành.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: được Đức Chúa Trời
  rationale: Diễn đạt rõ Đức Chúa Trời là tác nhân mà không thêm sắc thái nhấn mạnh không có trong nguyên văn.
- source_word: ὁ ... γεγονὼς νόμος
  choice: Luật pháp, xuất hiện
  rationale: Diễn tả Luật pháp đến trong lịch sử sau giao ước mà không thêm tác nhân cho việc ban Luật pháp.
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: bốn trăm ba mươi năm sau
  rationale: Truyền đạt rõ khoảng cách thời gian và quan hệ đến sau trong lập luận.
- source_word: οὐκ ἀκυροῖ
  choice: không hủy bỏ
  rationale: Diễn tả việc không làm cho giao ước mất giá trị pháp lý; chú thích giữ phương án “vô hiệu hóa” gần với sắc thái pháp lý hơn.
- source_word: εἰς τὸ καταργῆσαι
  choice: để làm cho ... mất hiệu lực
  rationale: Giữ cấu trúc chỉ mục đích hoặc kết quả của εἰς τό với động từ nguyên mẫu, đồng thời diễn đạt sức mạnh của καταργέω là khiến điều gì không còn hiệu lực.
- source_word: τὴν ἐπαγγελίαν
  choice: lời hứa
  rationale: Thuật ngữ tự nhiên và nhất quán với lập luận của Phao-lô về lời Đức Chúa Trời hứa với Áp-ra-ham.
theological_decisions:
- issue: Ý nghĩa của διαθήκη trong lập luận của Phao-lô
  choice: giao ước
  alternative: di chúc; văn kiện định đoạt pháp lý
  rationale: Văn cảnh tập trung vào lời hứa có trước của Đức Chúa Trời với Áp-ra-ham. “Giao ước” bảo toàn lập luận lịch sử cứu chuộc mà không buộc từ này vào nghĩa “di chúc”.
- issue: Quan hệ được diễn tả bởi εἰς τὸ καταργῆσαι
  choice: để làm cho lời hứa mất hiệu lực
  alternative: đến mức làm cho lời hứa mất hiệu lực
  rationale: Cấu trúc Hy Lạp có thể mang sắc thái mục đích hoặc kết quả. Bản dịch dùng “để” giữ cách diễn đạt gọn và không xác định quá mức chủ ý riêng biệt nào ngoài lập luận rằng Luật pháp không thể dẫn tới việc lời hứa mất hiệu lực.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời”, “Luật pháp”, “giao ước” và “lời hứa” theo lối dùng Kinh Thánh tiếng Việt phổ thông; giữ câu lập luận pháp lý của Phao-lô nhưng tránh lối diễn đạt quá cổ.
