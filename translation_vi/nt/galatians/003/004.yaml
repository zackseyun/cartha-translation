  text: τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/004.yaml
  text: Did you suffer so many things in vain?—if indeed it really was in vain[a].
translation:
  language: vi
  text: Anh chị em đã chịu khổ[a] nhiều đến thế mà vô ích sao?—nếu quả thật là vô ích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Anh chị em đã trải qua nhiều điều đến thế mà vô ích sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: biết bao điều
  rationale: Diễn đạt tự nhiên sắc thái số nhiều và mức độ của đại từ trung tính, chỉ chung nhiều điều người Ga-la-ti đã trải qua.
- source_word: ἐπάθετε
  choice: đã chịu khổ
  rationale: Động từ có thể chỉ việc chịu đau khổ hoặc rộng hơn là trải nghiệm; trong câu chính, “chịu khổ” giữ được sắc thái có khả năng là tiêu cực, còn nghĩa rộng hơn được ghi ở chú thích.
- source_word: εἰκῇ
  choice: uổng công
  rationale: Truyền đạt ý vô ích, không đạt kết quả; đồng thời được lặp lại để giữ hiệu quả tu từ của nguyên văn.
- source_word: εἴ γε
  choice: nếu quả thật
  rationale: Giữ sắc thái điều kiện có dè dặt trong lời Phao-lô, không biến nhận định thành kết luận chắc chắn.
- source_word: καὶ
  choice: thật
  rationale: Trong cụm điều kiện, từ này tăng cường ý rằng kết quả có thực sự là uổng công hay không; tiếng Việt diễn đạt tự nhiên qua “quả thật”.
theological_decisions:
- issue: Tính dè dặt của mệnh đề cuối
  choice: “nếu quả thật là uổng công”
  alternative: “nếu đúng là uổng công”
  rationale: 'Cách chọn giữ nguyên căng thẳng tu từ: Phao-lô nêu khả năng những gì họ chịu có thể thành vô ích nhưng chưa khẳng định điều đó đã xảy ra.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” làm chủ ngữ ngầm của động từ ngôi thứ hai số nhiều trong nguyên văn; “biết bao điều” tự nhiên hơn lối dịch sát chữ “nhiều điều như thế”.
