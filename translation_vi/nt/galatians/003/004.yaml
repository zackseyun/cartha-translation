- from: Anh chị em đã chịu khổ biết bao điều mà lại uổng công sao?—nếu quả thật là uổng công[a].
  to: Anh chị em đã chịu khổ[a] nhiều đến thế mà vô ích sao?—nếu quả thật là vô ích.
  rationale: Chỉnh cách kết hợp từ để tiếng Việt hiện đại tự nhiên hơn, thay “uổng công” bằng “vô ích” để phản ánh εἰκῇ bao quát hơn, và neo chú thích tại “chịu khổ”, từ có phương án nghĩa rộng được nêu. Bản sửa vẫn giữ câu hỏi tu từ, sự lặp lại của εἰκῇ, và tính dè dặt của εἴ γε καὶ.
