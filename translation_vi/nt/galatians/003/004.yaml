review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc tu từ và sự lặp lại của εἰκῇ, đồng thời diễn đạt tốt sắc thái dè dặt của εἴ γε. Tuy nhiên, “chịu khổ biết bao điều” không phải kết hợp từ tự nhiên trong tiếng Việt; τοσαῦτα bổ nghĩa cho toàn bộ điều họ đã chịu/trải qua, không phải trực tiếp là tân ngữ của “chịu khổ”. “Uổng công” thường nói về công sức hoặc hành động lao động, trong khi εἰκῇ ở đây nói rộng về sự vô ích/vô hiệu của những điều đã chịu.
  naturalness: “Anh chị em đã chịu khổ nhiều đến thế mà vô ích sao?” tự nhiên, trang trọng vừa phải, và vẫn giữ được câu hỏi tu từ. Việc đặt chú thích ngay sau “chịu khổ” xác định rõ từ được chú thích là ἐπάθετε.
  terminology: “Chịu khổ” là lựa chọn phù hợp cho cách hiểu theo ngữ cảnh của ἐπάθετε; chú thích giữ phương án nghĩa rộng “trải qua”. “Vô ích” chuyển đạt εἰκῇ chính xác và tự nhiên hơn “uổng công” trong ngữ cảnh này. Không có vấn đề về thuật ngữ thần học hay tên riêng.
  issues:
  - severity: medium
    issue: Cụm “chịu khổ biết bao điều” không tự nhiên và làm mờ quan hệ cú pháp của τοσαῦτα.
    rationale: Tiếng Việt thường nói “chịu khổ nhiều đến thế” hoặc “trải qua biết bao điều”, chứ không thường nói “chịu khổ biết bao điều”.
  - severity: low
    issue: “Uổng công” hẹp nghĩa hơn εἰκῇ trong câu này.
    rationale: “Uổng công” chủ yếu chỉ công sức bị phí; “vô ích” có thể nói trực tiếp về những điều đau khổ/trải nghiệm đã qua và giữ ý “in vain”.
  - severity: low
    issue: Ký hiệu chú thích hiện neo ở mệnh đề cuối thay vì tại từ “chịu khổ” mà chú thích giải thích.
    rationale: Đặt ký hiệu sau “chịu khổ” giúp người đọc nhận ra ngay chú thích là phương án dịch cho ἐπάθετε.
  revised_text: Anh chị em đã chịu khổ[a] nhiều đến thế mà vô ích sao?—nếu quả thật là vô ích.
