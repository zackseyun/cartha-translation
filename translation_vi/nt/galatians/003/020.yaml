  yaml_path: translation/nt/galatians/003/020.yaml
  text: A mediator is not of one[b][a], but God is one.
translation:
  language: vi
  text: Người trung gian không phải chỉ của một bên[a], nhưng Đức Chúa Trời là một[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “người trung gian không phải là của một”; cũng có thể hiểu là “không hành động chỉ cho một người” hoặc “không dành riêng cho một bên.”'
    reason: alternative_reading
  - marker: b
    text: “Đức Chúa Trời là một” có lẽ vọng lại lời tuyên xưng của Israel; xem Phục Truyền Luật Lệ Ký 6:4.
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: người trung gian
  rationale: Cách gọi tự nhiên và chính xác trong tiếng Việt về người đứng giữa các bên; phù hợp với sắc thái giao ước/pháp lý của ngữ cảnh.
- source_word: ἑνὸς
  choice: một bên mà thôi
  rationale: Nguyên văn cô đọng là “của một”; cách dịch này làm rõ vừa đủ ý nghĩa quan hệ do danh từ “người trung gian” gợi ra, nhưng chú thích vẫn bảo lưu tính mơ hồ của tiếng Hy Lạp.
- source_word: οὐκ ἔστιν
  choice: không thuộc về
  rationale: Phản ánh cấu trúc “không phải/không thuộc về” trong câu Hy Lạp và kết hợp tự nhiên với phần bổ nghĩa “một bên mà thôi”.
- source_word: δὲ
  choice: nhưng
  rationale: Ở vế thứ hai, từ này biểu thị sự tương phản rõ ràng. Từ δέ đầu câu không cần dịch thành một từ chuyển ý riêng trong tiếng Việt.
- source_word: θεὸς εἷς ἐστιν
  choice: Đức Chúa Trời là một
  rationale: Bản dịch trực tiếp, trang trọng, giữ nguyên lời khẳng định ngắn gọn và tiếng vọng có thể có từ lời tuyên xưng độc thần của Israel.
theological_decisions:
- issue: Lập luận cô đọng và khó hiểu trong vế đầu
  choice: Diễn đạt là người trung gian không thuộc về một bên mà thôi, không xác định thêm các bên hay toàn bộ lập luận thần học.
  alternative: 'Dịch sát từng chữ: “người trung gian không phải là của một”; hoặc diễn giải: “người trung gian không hành động chỉ cho một bên.”'
  rationale: Câu Hy Lạp nổi tiếng là hàm súc và đa nghĩa. Bản dịch làm rõ tối thiểu quan hệ giữa người trung gian và các bên, nhưng không áp đặt cách giải thích riêng về luật pháp, Môi-se, Đấng Christ hay giao ước.
- issue: Lời khẳng định Đức Chúa Trời là một
  choice: Giữ nguyên “Đức Chúa Trời là một.”
  alternative: “Chỉ có một Đức Chúa Trời.”
  rationale: Cách đã chọn gần cấu trúc Hy Lạp hơn và giữ được khả năng câu này vọng lại lời tuyên xưng của Israel, thay vì biến nó thành một lời diễn giải hoàn toàn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc ngắn gọn bảo lưu sự căng thẳng và tính hàm súc của nguyên văn; các dấu chú thích đều được đặt ngay trong chính văn.
