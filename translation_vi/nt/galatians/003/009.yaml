  revision_rationale: Sửa cách diễn đạt nhóm “οἱ ἐκ πίστεως” cho tự nhiên hơn trong tiếng Việt hiện đại và thay “người có đức tin” bằng “người tin” để phản ánh gọn, trực tiếp πιστός. Chú thích được chỉnh để bảo lưu tính đa nghĩa của πιστός mà không thêm “Chúa,” vốn không xuất hiện trong câu Hy Lạp.
