id: GAL.3.9
reference: Galatians 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/009.yaml
  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: vi
  text: Vì vậy, những người có đức tin được ban phước cùng với Áp-ra-ham, người tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Áp-ra-ham, người trung tín” hoặc “Áp-ra-ham trung tín.”'
    reason: Bảo lưu sắc thái có thể có của πιστός, vốn có thể được hiểu là “người tin” hoặc “trung tín,” mà không thêm đối tượng không có trong nguyên văn.
lexical_decisions:
- source_word: ὥστε
  choice: Vậy nên
  rationale: Diễn đạt quan hệ suy luận từ lập luận trước đó một cách tự nhiên trong tiếng Việt.
- source_word: οἱ ἐκ πίστεως
  choice: những người thuộc về đức tin
  rationale: Giữ được sắc thái chỉ căn tính của cấu trúc Hy Lạp, thay vì chỉ diễn đạt hành động tin.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong văn cảnh này, πίστις nói về đức tin là đặc điểm của nhóm người đang được nhắc đến.
- source_word: εὐλογοῦνται
  choice: được ban phước
  rationale: Giữ thể bị động và ý nghĩa phước lành được nhận lãnh, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: σὺν
  choice: cùng với
  rationale: Thể hiện rõ việc cùng chung hưởng phước lành với Áp-ra-ham.
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: Áp-ra-ham, người có đức tin
  rationale: Trong mạch văn nhấn mạnh việc Áp-ra-ham tin, cách dịch này làm rõ nghĩa 'tin' của πιστός nhưng vẫn giữ khả năng hiểu theo nghĩa 'trung tín' trong chú thích.
theological_decisions:
- issue: Cách hiểu πιστός khi mô tả Áp-ra-ham trong văn cảnh tập trung vào đức tin
  choice: người có đức tin
  alternative: người trung tín; Áp-ra-ham tin Chúa
  rationale: πιστός có thể chỉ người tin hoặc người trung tín. Mạch lập luận trực tiếp về việc Áp-ra-ham tin nghiêng về nghĩa 'người có đức tin', nhưng chú thích bảo lưu sắc thái 'trung tín' để không xóa bỏ tính đa nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Thuộc về đức tin” được giữ để phản ánh cấu trúc chỉ căn tính οἱ ἐκ πίστεως; “được ban phước” tự nhiên hơn lối dịch sát chữ “được chúc phước” trong văn cảnh này.
