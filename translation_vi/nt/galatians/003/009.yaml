revisions:
- from: Vậy nên, những người thuộc về đức tin được ban phước cùng với Áp-ra-ham, người có đức tin.[a]
  to: Vì vậy, những người có đức tin được ban phước cùng với Áp-ra-ham, người tin.[a]
  rationale: Sửa cách diễn đạt nhóm “οἱ ἐκ πίστεως” cho tự nhiên hơn trong tiếng Việt hiện đại và thay “người có đức tin” bằng “người tin” để phản ánh gọn, trực tiếp πιστός. Chú thích được chỉnh để bảo lưu tính đa nghĩa của πιστός mà không thêm “Chúa,” vốn không xuất hiện trong câu Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:29:13Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng quan hệ suy luận của ὥστε, nhóm người được đặc trưng bởi πίστις, thể bị động hiện tại của εὐλογοῦνται, và sự cùng chia sẻ phước lành qua σὺν. Tuy nhiên, chú thích hiện có thêm từ “Chúa” không được nêu trong συγκεκριμένη cụm từ Hy Lạp; nên tránh thêm định ngữ này. “Người tin” là cách tương ứng trực tiếp, tự nhiên với πιστός trong ngữ cảnh này, đồng thời chú thích giữ khả năng hiểu là “trung tín.”
  naturalness: “Những người thuộc về đức tin” khá sát cấu trúc nhưng gượng trong tiếng Việt hiện đại. “Những người có đức tin” tự nhiên, rõ nghĩa, và vẫn diễn đạt nhóm người được nhận diện bởi đức tin. “Được ban phước cùng với” là lối dùng trang trọng, tự nhiên trong văn phong Kinh Thánh hiện đại.
  terminology: Giữ “đức tin” cho πίστις và “ban phước” cho εὐλογοῦνται là nhất quán. Không nên diễn giải πιστός thành “tin Chúa” trong chú thích, vì động từ hay đối tượng của sự tin không có mặt trong câu này. Tên riêng “Áp-ra-ham” được giữ nhất quán.
  issues:
  - severity: medium
    issue: Chú thích thêm “tin Chúa.”
    rationale: πιστός ở đây có thể mang nghĩa “người tin” hoặc “trung tín,” nhưng nguyên văn không nói “tin Chúa.” Việc thêm đối tượng này vượt quá câu văn và làm chú thích diễn giải hơn là bảo lưu khả năng dịch.
  - severity: low
    issue: “Những người thuộc về đức tin” không tự nhiên.
    rationale: Cách nói này mô phỏng cấu trúc οἱ ἐκ πίστεως nhưng ít thông dụng trong tiếng Việt hiện đại. “Những người có đức tin” truyền đạt rõ ràng chức năng chỉ nhóm người trong ngữ cảnh.
  revised_text: Vì vậy, những người có đức tin được ban phước cùng với Áp-ra-ham, người tin.[a]
  revised_footnotes:
