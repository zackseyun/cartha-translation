id: GAL.3.19
reference: Galatians 3:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: vi
  text: Vậy thì luật pháp để làm gì? Luật pháp được thêm vào vì các sự vi phạm[a], cho đến khi dòng dõi[b], người mà lời hứa đã được ban cho, đến. Luật pháp ấy được truyền ban[c] qua các thiên sứ, qua tay một người trung gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “vì các sự vi phạm” có thể nói đến việc xử lý, phơi bày hoặc kiềm chế các vi phạm; tiếng Hy Lạp không xác định nghĩa hẹp hơn.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “con cháu” hoặc “hậu duệ.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “được thiết lập” hoặc “được sắp đặt.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: Vậy thì luật pháp để làm gì?
  rationale: Câu hỏi tỉnh lược trong tiếng Hy Lạp hỏi về mục đích của luật pháp trong mạch lập luận, nên diễn đạt đầy đủ và tự nhiên trong tiếng Việt.
- source_word: τῶν παραβάσεων χάριν
  choice: vì những sự vi phạm
  rationale: Giữ phạm vi nghĩa rộng của χάριν với sở hữu cách, không tự ý xác định luật pháp nhằm ngăn chặn, phơi bày hay xử lý các vi phạm.
- source_word: προσετέθη
  choice: được thêm vào
  rationale: Phản ánh trực tiếp động từ thụ động, đồng thời giữ ý luật pháp được bổ sung trong tiến trình lập luận.
- source_word: ἄχρις οὗ ἔλθῃ
  choice: cho đến khi ... đến
  rationale: Diễn đạt tự nhiên giới hạn thời gian hướng đến một biến cố còn ở tương lai xét từ thời điểm luật pháp được thêm vào.
- source_word: τὸ σπέρμα
  choice: dòng dõi
  rationale: Trong ngữ cảnh lời hứa dành cho Áp-ra-ham, 'dòng dõi' là cách diễn đạt tự nhiên và có khả năng chỉ một hậu duệ, đồng thời duy trì liên hệ từ vựng với lập luận trước đó.
- source_word: ᾧ ἐπήγγελται
  choice: mà lời hứa đã được ban cho
  rationale: Làm rõ đối tượng nhận lời hứa và thể hiện kết quả còn hiệu lực của thì hoàn thành, nhưng không nêu chủ thể vốn không được nói rõ trong cụm từ Hy Lạp.
- source_word: διαταγεὶς
  choice: được ban bố
  rationale: Diễn tả việc luật pháp được chính thức thiết lập hoặc truyền ban; cách nói trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại.
- source_word: δι’ ἀγγέλων
  choice: qua các thiên sứ
  rationale: Giữ rõ vai trò trung gian hoặc phương tiện của các thiên sứ.
- source_word: ἐν χειρὶ μεσίτου
  choice: nhờ tay một người trung gian
  rationale: Bảo tồn hình ảnh cụ thể 'trong/bởi tay' của thành ngữ Hy Lạp mà vẫn tương đối tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của τῶν παραβάσεων χάριν
  choice: Dịch rộng là 'vì những sự vi phạm'.
  alternative: nhằm ngăn chặn các vi phạm; nhằm phơi bày các vi phạm; liên quan đến các vi phạm
  rationale: Cụm từ Hy Lạp ngắn gọn và không nói rõ luật pháp xử lý, phơi bày, kiềm chế hay có quan hệ nhân quả nào khác với các vi phạm; bản dịch không giải quyết thay sự căng thẳng này.
- issue: Cách dịch σπέρμα trong lập luận về lời hứa
  choice: dòng dõi
  alternative: con cháu; hậu duệ
  rationale: '''Dòng dõi'' vừa nối với ngôn ngữ lời hứa dành cho Áp-ra-ham vừa không buộc từ này phải mang nghĩa tập thể hay cá thể ngoài điều văn mạch cho phép.'
- issue: Các tầng trung gian trong việc ban luật pháp
  choice: Giữ cả 'qua các thiên sứ' và 'nhờ tay một người trung gian'.
  alternative: Diễn giải gộp các thiên sứ với người trung gian
  rationale: Nguyên văn nêu cả hai thành phần; không đồng nhất hay xác định danh tính của 'người trung gian'.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ đọc. Dùng 'luật pháp' theo nghĩa Luật Môi-se trong văn mạch; không viết hoa 'dòng dõi' để tránh đưa cách giải thích thần học vào hình thức chữ. Cấu trúc câu được tách nhẹ để làm rõ chủ thể của phân từ Hy Lạp mà không thêm nội dung.
