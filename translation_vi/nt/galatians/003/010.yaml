revisions:
- from: 'Vì tất cả những ai thuộc về các việc làm của luật pháp đều ở dưới lời nguyền[a], bởi có lời chép rằng: “Đáng nguyền rủa thay mọi người không tiếp tục làm theo mọi điều đã được chép trong sách luật pháp[b].”'
  to: 'Vì tất cả những ai lấy các việc làm của luật pháp làm cơ sở đều ở dưới lời nguyền[a], bởi có lời chép rằng: “Đáng nguyền rủa thay mọi người không tiếp tục làm theo mọi điều đã được chép trong sách luật pháp[b].”'
  rationale: Sửa riêng thành ngữ mở đầu để bản dịch Việt ngữ tự nhiên và sáng nghĩa hơn, trong khi vẫn giữ tính dè dặt diễn giải của nguyên văn. Giữ nguyên các mốc chú thích và nội dung chú thích b, vì chúng tiếp tục neo các khả năng dịch sát chữ và diễn giải thay thế. Không có thay đổi nào đối với phạm vi phổ quát, lời nguyền, hay đòi hỏi phải thực hành mọi điều đã chép.
