id: GAL.3.10
reference: Galatians 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: vi
  text: 'Vì tất cả những ai lấy các việc làm của luật pháp làm cơ sở đều ở dưới lời nguyền[a], bởi có lời chép rằng: “Đáng nguyền rủa thay mọi người không tiếp tục làm theo mọi điều đã được chép trong sách luật pháp[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cậy vào các việc làm của luật pháp.”'
    reason: alternative_reading
  - marker: b
    text: 'Sát nghĩa: “không tiếp tục ở trong mọi điều đã được chép trong sách luật pháp, để làm những điều ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: Vì tất cả những ai
  rationale: Giữ phạm vi số nhiều, tính khái quát của ὅσοι và chức năng giải thích của γάρ.
- source_word: ἐξ ἔργων νόμου
  choice: thuộc về các việc làm của luật pháp
  rationale: Diễn đạt tương đối sát cấu trúc Hy Lạp và giữ lại độ căng trong cách nói của Phao-lô, thay vì đưa cách hiểu “cậy vào” thẳng vào chính văn.
- source_word: ὑπὸ κατάραν
  choice: ở dưới lời nguyền
  rationale: Giữ hình ảnh về tình trạng bị đặt dưới quyền hoặc hiệu lực của lời nguyền mà không xác định quá mức.
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Công thức dẫn Kinh Thánh tự nhiên, trang trọng trong tiếng Việt, đồng thời phản ánh sắc thái thẩm quyền của bản văn đã chép.
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: Đáng nguyền rủa thay mọi người
  rationale: Truyền đạt lực phổ quát và sắc thái tuyên cáo của câu trích dẫn.
- source_word: οὐκ ἐμμένει πᾶσιν τοῖς γεγραμμένοις
  choice: không tiếp tục làm theo mọi điều đã được chép
  rationale: “Tiếp tục” giữ sắc thái bền đỗ của ἐμμένει; “làm theo” tạo câu tiếng Việt tự nhiên và gắn sự tuân giữ với nội dung đã chép.
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: trong sách luật pháp
  rationale: “Sách luật pháp” là cách gọi tự nhiên và trang trọng; không cần ép thành “cuộn sách” dù hình thức lịch sử có thể là cuộn.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: làm theo
  rationale: Lồng ý thực hành vào cụm “tiếp tục làm theo” để tránh câu tiếng Việt gượng như “để làm chúng”, nhưng vẫn bảo toàn đòi hỏi phải thực hiện mọi điều.
theological_decisions:
- issue: Ý nghĩa của ἐξ ἔργων νόμου
  choice: thuộc về các việc làm của luật pháp
  alternative: cậy vào các việc làm của luật pháp
  rationale: Chính văn giữ cách diễn đạt tương đối sát để không âm thầm quyết định rằng cụm này chỉ nói về sự cậy dựa; cách hiểu ấy được ghi ở chú thích.
- issue: Phạm vi đòi hỏi của lời trích dẫn
  choice: mọi điều đã được chép
  alternative: những điều đã được chép
  rationale: Giữ rõ tính toàn diện của πᾶσιν và sức căng thần học trong lập luận của Phao-lô.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Chính văn ưu tiên sự tự nhiên nhưng giữ cấu trúc lập luận, tính phổ quát và độ căng thần học của nguyên văn; các cách dịch sát chữ hoặc mang tính diễn giải hơn được đặt trong chú thích.
