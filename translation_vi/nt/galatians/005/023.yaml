id: GAL.5.23
reference: Galatians 5:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/023.yaml
  text: gentleness[a], self-control[b]; against such things there is no law.
translation:
  language: vi
  text: hiền hòa, tự chủ; không có luật pháp[a] nào chống lại những điều như thế.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong ngữ cảnh thư Ga-la-ti, từ này cũng có thể được hiểu cụ thể là Luật pháp Môi-se; tuy nhiên, câu Hy Lạp không buộc phải giới hạn nghĩa như vậy.
    reason: theological_ambiguity
  - marker: b
    text: 'Cũng có thể dịch: “không có luật pháp nào chống lại những người như thế,” dù trong ngữ cảnh này, cụm từ nhiều khả năng chỉ các phẩm chất vừa được liệt kê hơn là những người bày tỏ các phẩm chất ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτης
  choice: hiền hòa
  rationale: Trong danh sách các phẩm chất này, từ này chỉ thái độ mềm mại, khiêm nhường, không khắc nghiệt. “Hiền hòa” là cách nói tự nhiên, trang trọng trong tiếng Việt hiện đại và tránh sắc thái thụ động mà “nhu mì” đôi khi gợi lên.
- source_word: ἐγκράτεια
  choice: tự chủ
  rationale: Từ này nói đến khả năng làm chủ ham muốn và thôi thúc của bản thân. “Tự chủ” diễn đạt rõ và gọn ý nghĩa đạo đức ấy trong tiếng Việt hiện đại.
- source_word: κατὰ τῶν τοιούτων
  choice: chống lại những điều như thế
  rationale: Đại từ số nhiều τοιούτων có thể chỉ người hoặc sự vật, nhưng trong ngữ cảnh gần nhất, nó nhiều khả năng quy chiếu về các phẩm chất vừa được kể là trái của Thánh Linh. Cách dịch này tự nhiên mà vẫn ghi nhận khả năng chỉ người trong chú thích.
- source_word: νόμος
  choice: luật pháp
  rationale: Danh từ không có mạo từ trong tiếng Hy Lạp, nên bản dịch không thu hẹp nó thành một quy chiếu dứt khoát chỉ về Luật pháp Môi-se. “Luật pháp” giữ được sắc thái khái quát của lời tuyên bố, đồng thời ngữ cảnh thư Ga-la-ti vẫn cho phép người đọc nhận ra bối cảnh Luật pháp Môi-se.
theological_decisions:
- issue: Phạm vi nghĩa của νόμος trong lời khẳng định của Phao-lô
  choice: Dịch khái quát là “luật pháp”, không xác định dứt khoát chỉ riêng Luật pháp Môi-se.
  alternative: Hiểu là “Luật pháp”, cụ thể là Luật pháp Môi-se.
  rationale: Toàn thư Ga-la-ti bàn nhiều về Luật pháp Môi-se, nhưng ở đây νόμος không có mạo từ và câu mang dáng dấp một nguyên tắc khái quát. Cách dịch này giữ nguyên sức căng thần học thay vì giải quyết nó ngay trong chính văn.
- issue: Đối tượng mà luật pháp không chống lại
  choice: Hiểu “những điều như thế” là các phẩm chất vừa được liệt kê.
  alternative: Hiểu là “những người như thế”, tức những người bày tỏ các phẩm chất ấy.
  rationale: Hình thức Hy Lạp có thể chỉ sự vật hoặc con người. Mạch văn gần nhất ưu tiên các phẩm chất của trái Thánh Linh, nhưng khả năng chỉ người vẫn được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc cô đọng của danh sách phẩm chất và lời kết mang tính châm ngôn; dùng “hiền hòa” và “tự chủ” thay cho những cách nói cổ hoặc dễ gây hiểu lầm.
