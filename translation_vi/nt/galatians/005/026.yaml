id: GAL.5.26
reference: Galatians 5:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/026.yaml
  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: vi
  text: 'Chúng ta đừng trở nên tự phụ[a], khiêu khích nhau, ganh tị nhau.


    [a] Cũng có thể dịch là “ham hư danh”. Từ Hy Lạp chỉ thái độ chạy theo vinh quang rỗng tuếch hoặc tự coi mình là quan trọng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ham hư danh”. Từ Hy Lạp chỉ thái độ chạy theo vinh quang rỗng tuếch hoặc tự coi mình là quan trọng.
    reason: Giữ lại sắc thái từ nguyên và cung cấp phương án dịch sát hơn cho κενόδοξοι.
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: Chúng ta đừng trở nên
  rationale: μή với động từ giả định thức ngôi thứ nhất số nhiều tạo lời khuyên ngăn mang tính cùng nhau. “Đừng trở nên” giữ được cả sắc thái khích lệ và ý chuyển sang một tình trạng của γίνομαι.
- source_word: κενόδοξοι
  choice: tự phụ
  rationale: κενόδοξος nói đến sự tự tôn dựa trên vinh quang rỗng tuếch hay cảm thức vô căn cứ về tầm quan trọng của mình. “Tự phụ” tự nhiên trong tiếng Việt hiện đại; chú thích giữ lại hình ảnh “hư danh” của nguyên ngữ.
- source_word: ἀλλήλους / ἀλλήλοις
  choice: nhau
  rationale: Cách diễn đạt tương hỗ tự nhiên, gọn rõ trong tiếng Việt và phù hợp ở cả hai vế song song.
- source_word: προκαλούμενοι
  choice: khiêu khích
  rationale: Động từ có thể chỉ việc thách thức hoặc khơi lên sự đối đầu. “Khiêu khích” giữ được sắc thái gây cạnh tranh mà không thu hẹp thành chỉ làm người khác khó chịu.
- source_word: φθονοῦντες
  choice: ganh tị
  rationale: φθονέω chỉ lòng đố kỵ trước điều người khác có. “Ganh tị” là cách nói hiện đại, dễ hiểu và cân xứng với “khiêu khích”.
theological_decisions:
- issue: Quan hệ giữa các phân từ và lời khuyên chính
  choice: 'Dịch hai phân từ như những hành vi đi kèm hoặc phát sinh từ sự tự phụ: “khiêu khích nhau, ganh tị nhau”.'
  alternative: Có thể hiểu chúng gần như phần mở rộng mang sức mệnh lệnh, hoặc như chỉ phương cách trở nên tự phụ.
  rationale: Cấu trúc Hy Lạp tự nhiên nhất xem κενόδοξοι là vị ngữ chính sau γινώμεθα, còn hai phân từ mô tả hành vi đi kèm. Cách dịch giữ nguyên sự nối tiếp cú pháp mà không ấn định quá mức quan hệ lô-gích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chúng ta đừng” thể hiện lời khuyên bao gồm cả người nói; hai cụm “khiêu khích nhau, ganh tị nhau” giữ nhịp song song của nguyên văn.
