id: GAL.5.18
reference: Galatians 5:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: vi
  text: Nhưng nếu anh chị em được Thánh Linh dẫn dắt[a], thì anh chị em không ở dưới luật pháp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang được Thánh Linh dẫn dắt.”'
    reason: lexical_alternative
  - marker: b
    text: “Ở dưới luật pháp” nghĩa là ở dưới thẩm quyền hoặc phạm vi chi phối của luật pháp; so sánh Ga-la-ti 5:23.
    reason: cross_reference
lexical_decisions:
- source_word: εἰ
  choice: nếu
  rationale: Diễn đạt trực tiếp mệnh đề điều kiện trong nguyên văn.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện sắc thái tương phản nhẹ với đời sống theo xác thịt trong mạch văn trước đó.
- source_word: πνεύματι
  choice: Thánh Linh
  rationale: Trong Ga-la-ti 5:16–25, πνεῦμα đối lập với xác thịt và chỉ về Thánh Linh; cách dịch này rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἄγεσθε
  choice: được ... dẫn dắt
  rationale: Giữ thể bị động của động từ hiện tại ἄγω và diễn đạt tự nhiên bằng tiếng Việt; không ép khía cạnh tiếp diễn vào câu chính.
- source_word: οὐκ ἐστὲ
  choice: không còn ở
  rationale: Diễn đạt trạng thái không thuộc quyền chi phối được nêu trong vế sau; “còn” làm rõ sự tương phản theo văn cảnh mà không thay đổi điều kiện của câu.
- source_word: ὑπὸ νόμον
  choice: dưới luật pháp
  rationale: Giữ hình ảnh và thành ngữ của Phao-lô về việc ở dưới thẩm quyền hay phạm vi chi phối của luật pháp.
theological_decisions:
- issue: Đối tượng được πνεύματι chỉ đến
  choice: Thánh Linh
  alternative: tinh thần
  rationale: Mạch văn Ga-la-ti 5 liên tục đối lập xác thịt với Thánh Linh như tác nhân dẫn dắt các tín hữu.
- issue: Ý nghĩa của ὑπὸ νόμον
  choice: ở dưới luật pháp
  alternative: chịu luật pháp cai quản
  rationale: Giữ cách nói súc tích và độ mở thần học của nguyên văn; chú thích giải thích ý niệm thẩm quyền mà không đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ngôi thứ hai; “Thánh Linh” và “luật pháp” phù hợp ngữ cảnh thư Ga-la-ti. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
