- from: Nhưng nếu anh chị em được Thánh Linh dẫn dắt[a], thì anh chị em không còn ở dưới luật pháp[b].
  to: Nhưng nếu anh chị em được Thánh Linh dẫn dắt[a], thì anh chị em không ở dưới luật pháp[b].
  rationale: Bỏ “còn” để không thêm hàm ý thời gian vào lời khẳng định phủ định của nguyên văn. Giữ nguyên các lựa chọn còn lại vì chúng trung thành với tiếng Hy Lạp, tự nhiên trong tiếng Việt hiện đại, và các chú thích đã được neo đúng chỗ.
  reviewer_model: gpt-5.6-terra
