revisions:
- from: Vì xác thịt[a] ham muốn điều chống lại Thánh Linh[b], còn Thánh Linh ham muốn điều chống lại xác thịt. Hai bên chống nghịch nhau, khiến anh chị em không làm những điều mình muốn.[c]
  to: Vì xác thịt[a] ham muốn điều chống lại Thánh Linh[b], còn Thánh Linh ham muốn điều chống lại xác thịt; hai bên chống nghịch nhau, khiến anh chị em không làm những điều anh chị em muốn.[c]
  rationale: Sửa chú thích về πνεῦμα để phương án thay thế thực sự tương ứng với danh từ Hy Lạp và cách dùng tiếng Việt hiện đại. Làm rõ chủ thể số nhiều ở mệnh đề cuối. Các lựa chọn còn lại được giữ vì trung thành với nguyên văn, tự nhiên, và không áp đặt cách giải nghĩa thần học vào chính văn.
  reviewer_model: gpt-5.6-terra
