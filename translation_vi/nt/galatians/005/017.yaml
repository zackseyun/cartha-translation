id: GAL.5.17
reference: Galatians 5:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: vi
  text: Vì xác thịt[a] ham muốn điều chống lại Thánh Linh[b], còn Thánh Linh ham muốn điều chống lại xác thịt; hai bên chống nghịch nhau, khiến anh chị em không làm những điều anh chị em muốn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “bản tính tội lỗi”. Từ Hy Lạp σάρξ (sarx), nghĩa đen là “xác thịt”, ở đây được Phao-lô dùng với ý nghĩa đạo đức rộng hơn thân thể vật chất.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là πνεῦμα (pneuma), có thể dịch là “Thánh Linh” hoặc, nếu hiểu là linh/tinh thần con người, là “linh” hay “tinh thần”. Ngữ cảnh gần nghiêng về Thánh Linh.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “để anh chị em không làm những điều anh chị em muốn”, nếu hiểu mệnh đề Hy Lạp theo sắc thái mục đích thay vì kết quả.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: σὰρξ
  choice: xác thịt
  rationale: Giữ lại hình ảnh và thuật ngữ đặc trưng của Phao-lô, thay vì diễn giải ngay thành “bản tính tội lỗi”. Trong ngữ cảnh này, từ ngữ mang ý nghĩa đạo đức rộng hơn thân thể vật chất.
- source_word: ἐπιθυμεῖ
  choice: ham muốn
  rationale: Diễn đạt sức hướng muốn mạnh mẽ của động từ Hy Lạp mà không thu hẹp nó vào dục vọng tình dục. Ở vế thứ hai, động từ được lặp lại trong tiếng Việt để làm rõ cấu trúc tỉnh lược của nguyên văn.
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: điều chống lại Thánh Linh / điều chống lại xác thịt
  rationale: Cụm “điều chống lại” tự nhiên trong tiếng Việt và giữ được sức đối nghịch của κατά với sở hữu cách.
- source_word: πνεῦμα
  choice: Thánh Linh
  rationale: Ngữ cảnh Ga-la-ti 5 nói đến đời sống được Thánh Linh dẫn dắt, nên cách hiểu chỉ Thánh Linh là phù hợp nhất; khả năng hiểu là tâm linh con người được ghi nhận trong chú thích.
- source_word: ἀλλήλοις ἀντίκειται
  choice: hai bên chống nghịch nhau
  rationale: Diễn đạt rõ sự đối kháng qua lại giữa xác thịt và Thánh Linh, đồng thời tránh cách nói cứng “chống lại lẫn nhau” đối với hai chủ thể.
- source_word: ἵνα μὴ
  choice: khiến ... không
  rationale: “Khiến” diễn đạt tự nhiên hệ quả thực tiễn của sự đối nghịch, nhưng nguyên văn có thể mang sắc thái mục đích hoặc kết quả; sự mở rộng này được ghi trong chú thích.
- source_word: ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: anh chị em không làm những điều mình muốn
  rationale: Giữ ý của cấu trúc quan hệ bất định và động từ ποιέω đơn giản, không thêm sắc thái “thực hành thường xuyên” vốn không nhất thiết có trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa của σάρξ trong ngữ cảnh đạo đức của Phao-lô
  choice: Giữ “xác thịt” trong chính văn
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo tồn ẩn dụ và sức căng thần học trong lời Phao-lô; “bản tính tội lỗi” là một cách giải nghĩa khả dĩ nhưng hẹp hơn từ Hy Lạp.
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: tâm linh
  rationale: Mạch văn Ga-la-ti 5 nghiêng mạnh về Thánh Linh của Đức Chúa Trời, nhưng nguyên bản không có lối viết hoa để tự nó giải quyết hoàn toàn vấn đề, nên phương án kia được giữ trong chú thích.
- issue: Sắc thái của ἵνα μὴ
  choice: Diễn đạt bằng “khiến ... không”
  alternative: để ... không
  rationale: Trong câu này, mệnh đề có thể được hiểu theo sắc thái kết quả hoặc mục đích. Chính văn dùng lối diễn đạt tự nhiên theo kết quả, còn chú thích bảo tồn khả năng mục đích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” để nói với cộng đồng tín hữu số nhiều; giữ “xác thịt” như thuật ngữ giàu hình ảnh của Phao-lô, đồng thời giải thích trong chú thích. Cấu trúc hai vế được làm rõ bằng cách lặp “ham muốn”, vốn được tỉnh lược trong nguyên văn.
