id: GAL.5.21
reference: Galatians 5:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀φθόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν ⸀καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: vi
  text: 'ganh ghét, say sưa, chè chén[a], cùng những điều tương tự. Tôi cảnh báo anh chị em về những điều ấy, như tôi đã cảnh báo trước đây: những người quen làm những việc như thế sẽ không thừa hưởng vương quốc của Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vui chơi quá độ” hoặc “tiệc tùng trác táng”. Từ Hy Lạp chỉ những cuộc vui ồn ào, buông thả, thường đi kèm việc uống rượu quá mức.
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: ganh ghét
  rationale: Danh từ số nhiều chỉ lòng bực tức, thèm muốn trước điều tốt người khác có; “ganh ghét” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: μέθαι
  choice: say sưa
  rationale: Chỉ tình trạng hoặc những cuộc uống rượu đến mức say; “say sưa” diễn đạt trực tiếp thói say rượu trong danh sách các việc xấu.
- source_word: κῶμοι
  choice: chè chén[a]
  rationale: Chỉ những cuộc vui quá độ, ồn ào, thường gắn với uống rượu. “Chè chén” tự nhiên trong tiếng Việt và không thu hẹp nghĩa thành hành vi tình dục.
- source_word: τὰ ὅμοια τούτοις
  choice: cùng những điều tương tự
  rationale: Giữ tính mở của danh sách, cho thấy các điều vừa kể không phải là toàn bộ.
- source_word: ἃ προλέγω ὑμῖν
  choice: Tôi cảnh báo anh chị em về những điều ấy
  rationale: Trong ngữ cảnh khuyên răn, προλέγω mang lực cảnh báo trước; cách diễn đạt này tự nhiên và trang trọng vừa phải.
- source_word: καθὼς προεῖπον
  choice: như tôi đã cảnh báo trước đây
  rationale: Diễn đạt lời cảnh báo đã được đưa ra trước đó và duy trì sự lặp lại có chủ ý của cùng động từ.
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: những người quen làm những việc như thế
  rationale: Phân từ hiện tại πράσσοντες trong lời cảnh báo về các thói xấu gợi cách hành xử có tính đặc trưng hoặc tiếp diễn; “quen làm” thể hiện điều đó mà không biến thành khẳng định tuyệt đối về từng lần sa ngã riêng lẻ.
- source_word: βασιλείαν θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch rõ ràng, trang trọng và nhất quán cho thành ngữ thần học “vương quốc của Đức Chúa Trời”.
- source_word: οὐ κληρονομήσουσιν
  choice: sẽ không được thừa hưởng
  rationale: Giữ hình ảnh thừa kế và lực hướng tới tương lai của động từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Lời cảnh báo nói đến hành vi riêng lẻ hay nếp sống có tính lặp lại
  choice: Dịch πράσσοντες là “những người quen làm những việc như thế”.
  alternative: “những người làm những việc như thế” hoặc “những người cứ làm những việc như thế”.
  rationale: Dạng phân từ hiện tại trong danh sách thói xấu tự nhiên chỉ lối thực hành có tính đặc trưng; bản dịch giữ sự nghiêm trọng của lời cảnh báo nhưng không tự ý kết luận giáo lý về một lần phạm lỗi riêng lẻ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh chị em” cho ὑμῖν nhằm diễn đạt số nhiều bao gồm cả cộng đồng; dùng “Đức Chúa Trời” theo văn phong Kinh Thánh Tin Lành quen thuộc, không thêm nét giáo phái vào nội dung câu.
