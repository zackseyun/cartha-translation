language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: vi
  text: Và tôi lại long trọng khẳng định với mỗi người chịu cắt bì[a] rằng người ấy có nghĩa vụ[b] tuân giữ toàn bộ luật pháp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được cắt bì” hoặc “để mình chịu cắt bì”. Phân từ Hy Lạp có thể được diễn đạt theo các cách gần nghĩa này; trong ngữ cảnh, câu nói đến người chấp nhận chịu cắt bì.'
    reason: alternative_reading
  - marker: b
    text: 'Theo nghĩa đen: “là người mắc nợ”, tức là người bị ràng buộc bởi một nghĩa vụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: long trọng xác nhận
  rationale: Động từ ở đây diễn tả lời quả quyết có tính chứng thực và nghiêm trọng. “Long trọng xác nhận” giữ được sắc thái ấy mà vẫn tự nhiên trong tiếng Việt; “cảnh báo” sẽ diễn giải ý theo ngữ cảnh quá mức.
- source_word: δὲ
  choice: Và
  rationale: Liên từ nối lời này với câu trước theo hướng tiếp nối nhẹ, không nhất thiết biểu thị tương phản mạnh.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp ý lặp lại hoặc nhấn mạnh thêm.
- source_word: παντὶ ἀνθρώπῳ
  choice: với mỗi người
  rationale: Danh ngữ Hy Lạp ở số ít và có nghĩa phân phối, chỉ từng người một. Tiếng Việt “mỗi người” truyền đạt tự nhiên ý bao quát này mà không cần gán giới tính không phải là trọng tâm của phát biểu.
- source_word: περιτεμνομένῳ
  choice: chịu phép cắt bì
  rationale: Phân từ hiện tại nói đến người đang tiếp nhận hoặc chấp nhận việc cắt bì trong cuộc tranh luận này. Cách dịch không giới hạn câu vào những người đã được cắt bì từ thuở nhỏ, đồng thời không thêm động cơ mà nguyên văn không nêu.
- source_word: ὀφειλέτης
  choice: có nghĩa vụ
  rationale: Danh từ theo nghĩa đen là “người mắc nợ”, nhưng trong cấu trúc này chỉ người bị ràng buộc phải thực hiện điều gì. “Có nghĩa vụ” rõ ràng và tự nhiên hơn trong tiếng Việt hiện đại; nghĩa đen được ghi ở chú thích.
- source_word: ὅλον τὸν νόμον
  choice: toàn bộ luật pháp
  rationale: 'Giữ sự nhấn mạnh vào tính toàn thể: nghĩa vụ không chỉ liên quan đến phép cắt bì mà đến cả luật pháp.'
- source_word: ποιῆσαι
  choice: tuân giữ
  rationale: Nghĩa cơ bản là “làm”, nhưng khi đi với luật pháp, “tuân giữ” diễn đạt tự nhiên yêu cầu thi hành và vâng theo.
theological_decisions:
- issue: Phạm vi của lời tuyên bố về phép cắt bì và nghĩa vụ đối với luật pháp
  choice: Câu này nói đến từng người chấp nhận chịu phép cắt bì trong cuộc tranh luận tại Ga-la-ti, và vì thế tự đặt mình dưới nghĩa vụ tuân giữ toàn bộ luật pháp.
  alternative: Câu này có thể được hiểu rộng là nói về bất cứ người nam nào đã được cắt bì, kể cả người Do Thái được cắt bì từ thuở nhỏ.
  rationale: Ngữ cảnh ngay trước đó và phân từ περιτεμνομένῳ hướng đến những người đang tính chuyện tiếp nhận phép cắt bì như một đòi hỏi tôn giáo. Bản dịch “chịu phép cắt bì” giữ trọng tâm ngữ cảnh nhưng không đưa động cơ ấy vào chính câu Kinh Thánh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Long trọng xác nhận” giữ sức nặng của lời chứng thực; “luật pháp” duy trì thuật ngữ Kinh Thánh quen thuộc; cấu trúc số ít “mỗi người… người ấy” phản ánh sắc thái phân phối của nguyên văn.
