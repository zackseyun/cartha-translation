  - severity: low
    issue: “Long trọng xác nhận” ít tự nhiên hơn “long trọng khẳng định.”
    rationale: Cả hai đều có thể chuyển tải lực quả quyết của μαρτύρομαι, nhưng “long trọng khẳng định” là cách nói hiện đại thông dụng hơn trong một lời tuyên bố trang trọng.
