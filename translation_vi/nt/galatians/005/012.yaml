  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: vi
  text: Ước gì những kẻ đang gây rối cho anh chị em tự cắt bỏ luôn![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “tự cắt bỏ.” Trong ngữ cảnh tranh luận về phép cắt bì, Phao-lô rất có thể muốn nói rằng họ hãy đi xa hơn nữa mà tự làm tổn hại bộ phận sinh dục hoặc tự thiến.'
    reason: lexical_alternative
  - marker: b
    text: “Gây rối” cũng có thể dịch là “làm anh chị em xáo trộn” hoặc “quấy nhiễu anh chị em.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: Ước gì
  rationale: Diễn đạt tự nhiên sắc thái ước mong mạnh của tiểu từ, đồng thời giữ giọng tu từ của Phao-lô.
- source_word: καὶ
  choice: luôn
  rationale: 'Trong ngữ cảnh, καί có tác dụng tăng cấp: không chỉ cắt bì mà còn đi xa hơn; “luôn” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt.'
- source_word: ἀποκόψονται
  choice: tự cắt bỏ
  rationale: Giữ hình ảnh cắt và sắc thái phản thân của dạng trung, đồng thời không khóa nghĩa hoàn toàn vào một cách giải thích; trong tranh luận về phép cắt bì, câu này rất có thể ám chỉ tự hủy hoại bộ phận sinh dục hoặc tự thiến.
- source_word: οἱ ἀναστατοῦντες
  choice: những kẻ đang gây rối
  rationale: Diễn đạt những người đang khuấy động, làm xáo trộn cộng đồng; “những kẻ” phù hợp với giọng lên án gay gắt ở đây.
- source_word: ὑμᾶς
  choice: anh chị em
  rationale: Đại từ ngôi thứ hai số nhiều chỉ tập thể tín hữu Ga-la-ti; “anh chị em” rõ số nhiều và tự nhiên trong văn phong thư tín Cơ Đốc.
theological_decisions:
- issue: Lời ước gay gắt của Phao-lô liên quan đến phép cắt bì
  choice: Giữ lối chơi chữ về hành động cắt, với nghĩa theo ngữ cảnh rất có thể là những người cổ xúy phép cắt bì hãy đi xa đến mức tự hủy hoại bộ phận sinh dục hoặc tự thiến.
  alternative: Phao-lô chỉ mong họ tự tách khỏi cộng đồng.
  rationale: Ngữ cảnh trực tiếp bàn về phép cắt bì, nên nghĩa cụ thể liên quan đến việc cắt thân thể có cơ sở mạnh hơn. Tuy vậy, bản văn chính dùng “tự cắt bỏ” để bảo tồn phần nào khả năng chơi chữ và sự căng thẳng của nguyên ngữ, còn chú thích nêu rõ nghĩa có khả năng nhất.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng trực tiếp. Câu giữ giọng mỉa mai, gay gắt của nguyên văn mà không dùng thuật ngữ y khoa trong chính văn; các khả năng nghĩa được trình bày trong chú thích.
