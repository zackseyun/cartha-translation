    rationale: Sau “Ước gì,” “đi” dễ tạo cảm giác câu sai khiến trực tiếp. Nguyên văn là một lời ước gay gắt; bỏ “đi” giữ đúng lực ngữ dụng và giúp câu tự nhiên hơn.
  - severity: low
    issue: Cách diễn đạt chú thích “tự cắt đứt mình”
    rationale: Cụm này gượng và không phải cách diễn đạt sát nghĩa tự nhiên. “Tự cắt bỏ” hoặc “tự cắt mình” phản ánh tốt hơn động từ ἀποκόπτω mà không quyết định trước toàn bộ hàm ý.
