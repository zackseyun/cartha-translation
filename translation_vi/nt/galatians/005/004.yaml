id: GAL.5.4
reference: Galatians 5:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατηργήθητε ⸀ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/004.yaml
  text: You who are seeking to be justified by law have been severed from the Messiah; you have fallen away from grace.
translation:
  language: vi
  text: Anh em, những người tìm cách được xưng công chính nhờ luật pháp[a], đã bị tách khỏi[b] Đấng Mê-si[c]; anh em đã sa khỏi ân điển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch sát hình thức động từ Hy Lạp là “đang được xưng công chính nhờ luật pháp.” Trong văn cảnh, câu chính được dịch là “tìm cách được xưng công chính” để phản ánh điều họ đang mưu cầu hoặc chủ trương.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã bị xa cách khỏi” hoặc “đã bị cắt lìa khỏi.”
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “Đấng Ki-tô.” Từ Hy Lạp Christos có nghĩa là “Đấng được xức dầu” và có thể được chuyển dịch là “Đấng Mê-si” hoặc “Đấng Ki-tô.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοῦσθε
  choice: tìm cách được xưng công chính
  rationale: Dạng hiện tại bị động theo nghĩa đen có thể dịch là “đang được xưng công chính,” nhưng trong lập luận ở đây, Phao-lô nói với những người tìm kiếm sự xưng công chính trên cơ sở tuân giữ luật pháp. Cách dịch này làm rõ lực dụng học của câu mà vẫn giữ ý bị động.
- source_word: ἐν νόμῳ
  choice: nhờ luật pháp
  rationale: Giới từ ἐν ở đây diễn tả cơ sở hoặc phương tiện. “Nhờ luật pháp” tự nhiên trong tiếng Việt và không tự ý giới hạn νόμος thành một bộ luật cụ thể.
- source_word: κατηργήθητε ἀπὸ Χριστοῦ
  choice: đã bị tách khỏi Đấng Mê-si
  rationale: Khi đi với ἀπό, động từ καταργέω ở thể bị động diễn tả sự phân cách hoặc mất hiệu lực trong mối liên hệ với Đấng Mê-si. “Bị tách khỏi” giữ được sức nặng của lời cảnh báo nhưng không tự quyết định vấn đề thần học về tính chung cuộc.
- source_word: Χριστοῦ
  choice: Đấng Mê-si
  rationale: Χριστός ở đây mang chức năng tước hiệu, chỉ Đấng được xức dầu. “Đấng Mê-si” làm rõ ý nghĩa tước hiệu; “Đấng Ki-tô” vẫn là một cách dịch quen thuộc và được ghi ở chú thích.
- source_word: ἐξεπέσατε τῆς χάριτος
  choice: đã sa khỏi ân điển
  rationale: ἐκπίπτω với sở hữu cách diễn tả việc rơi hoặc sa khỏi một vị thế. “Sa khỏi ân điển” giữ hình ảnh và tính quyết liệt của nguyên văn, không diễn giải thêm ân điển chỉ như một nguyên tắc hay xác quyết một hệ thống giáo lý.
theological_decisions:
- issue: Câu này có nên được dịch theo cách giải quyết tranh luận về việc mất sự cứu rỗi hay chỉ rời bỏ nguyên tắc ân điển hay không
  choice: 'Giữ nguyên sức nặng trực tiếp của lời cảnh báo: “đã bị tách khỏi Đấng Mê-si; ... đã sa khỏi ân điển.”'
  alternative: Làm nhẹ thành “trở nên xa lạ với Đấng Ki-tô,” hoặc diễn giải thành “đã từ bỏ con đường ân điển.”
  rationale: Nguyên văn dùng hai cách diễn đạt mạnh về sự phân cách và sa khỏi. Bản dịch duy trì sự căng thẳng thần học ấy nhưng không thêm kết luận của bất kỳ truyền thống giáo phái nào.
translation_notes:
  register: Dùng tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Xưng công chính” được giữ như thuật ngữ thần học quen thuộc; “nhờ luật pháp” tự nhiên hơn lối dịch sát “trong luật pháp.” “Sa khỏi ân điển” có sắc thái trang trọng và giữ được ẩn dụ rơi khỏi của nguyên văn.
