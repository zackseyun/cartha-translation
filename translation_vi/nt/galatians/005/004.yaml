  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của câu Hy Lạp: số nhiều ngôi thứ hai, sự tìm kiếm được xưng công chính «nhờ luật pháp», tình trạng bị tách khỏi Đấng Mê-si, và việc sa khỏi ân điển. Cách hiểu hiện tại bị động theo nghĩa «tìm cách được xưng công chính» có cơ sở trong văn mạch tranh luận của Phao-lô và được chú thích minh bạch. Không cần làm yếu hay hệ thống hóa lời cảnh báo thần học.'
