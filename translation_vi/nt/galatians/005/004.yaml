  terminology: «Xưng công chính», «luật pháp», «ân điển», và «Đấng Mê-si» nhất quán với register thần học trang trọng. «Sa khỏi ân điển» diễn đạt sát và tự nhiên ἐξεπέσατε τῆς χάριτος. Các chú thích nêu những phương án từ vựng hợp lệ và không áp đặt kết luận giáo phái.
  issues:
