  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: vi
  text: Vì nhờ Thánh Linh[a], từ đức tin[b], chúng ta tha thiết trông đợi niềm hy vọng về sự công chính[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Thánh Linh”. Dạng tặng cách trong tiếng Hy Lạp có thể chỉ phương tiện (“nhờ”) hoặc phạm vi (“trong”).'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bởi đức tin” hoặc “trên cơ sở đức tin”. Cụm Hy Lạp có thể nhấn mạnh đức tin là nguồn hoặc nền tảng.'
    reason: lexical_alternative
  - marker: c
    text: Cụm này cũng có thể hiểu là “sự công chính mà chúng ta hy vọng nhận được”. Tiếng Hy Lạp không nói rõ hoàn toàn mối quan hệ giữa “hy vọng” và “sự công chính”.
    reason: ambiguity
  - marker: d
    text: Từ Hy Lạp cũng có thể mang nghĩa “công lý”; trong ngữ cảnh này, “sự công chính” là cách dịch phù hợp hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: chúng ta
  rationale: Đại từ ngôi thứ nhất số nhiều được nêu rõ và có phần nhấn mạnh trong tiếng Hy Lạp. “Chúng ta” tự nhiên trong tiếng Việt; trật tự câu vẫn làm nổi bật cộng đồng được đối chiếu với những người tìm sự công chính bởi luật pháp ở câu trước.
- source_word: γὰρ
  choice: Vì
  rationale: Diễn tả lý do hoặc cơ sở giải thích cho lời khẳng định ngay trước đó và giữ được mạch lập luận của Phao-lô.
- source_word: πνεύματι
  choice: nhờ Thánh Linh
  rationale: Dạng tặng cách có thể chỉ phương tiện hoặc phạm vi. Trong ngữ cảnh Ga-la-ti 5, từ này rất có thể chỉ Thánh Linh; “nhờ” diễn đạt cách hiểu phương tiện mà không thêm ý ngoài văn bản.
- source_word: ἐκ πίστεως
  choice: bởi đức tin
  rationale: ἐκ chỉ nguồn hoặc nền tảng. “Bởi đức tin” là cách nói tự nhiên, trang trọng trong tiếng Việt và diễn đạt nền tảng của sự trông đợi; sắc thái sát chữ “từ đức tin” được ghi ở chú thích.
- source_word: ἐλπίδα
  choice: niềm hy vọng
  rationale: Là bổ ngữ trực tiếp của động từ “trông đợi”. Cụm danh từ này giữ lại hình ảnh hy vọng thay vì chuyển hoàn toàn thành điều được hy vọng.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Đây là nghĩa phù hợp nhất trong lập luận của Phao-lô về luật pháp, đức tin và việc được kể là công chính. Khả năng dịch là “công lý” được bảo lưu trong chú thích.
- source_word: ἀπεκδεχόμεθα
  choice: tha thiết trông đợi
  rationale: Động từ diễn tả sự chờ đợi với lòng mong mỏi mạnh mẽ; “tha thiết trông đợi” vừa tự nhiên vừa giữ được sắc thái háo hức của từ Hy Lạp.
theological_decisions:
- issue: Chủ thể được πνεύματι chỉ đến
  choice: Thánh Linh
  alternative: tinh thần của con người
  rationale: Ngữ cảnh gần nói đến Thánh Linh đối lập với xác thịt và luật pháp, nên cách hiểu chỉ Thánh Linh có cơ sở vững hơn.
- issue: Chức năng của dạng tặng cách πνεύματι
  choice: 'phương tiện: “nhờ Thánh Linh”'
  alternative: 'phạm vi: “trong Thánh Linh”'
  rationale: Cả hai cách phân tích ngữ pháp đều có thể có. Bản chính chọn nghĩa phương tiện phù hợp với ngữ cảnh, còn chú thích giữ lại cách hiểu theo phạm vi.
- issue: Quan hệ trong cụm ἐλπίδα δικαιοσύνης
  choice: “niềm hy vọng về sự công chính”
  alternative: “sự công chính mà chúng ta hy vọng nhận được” hoặc “niềm hy vọng do sự công chính sinh ra”
  rationale: Cụm sở hữu cách Hy Lạp không tự xác định hoàn toàn quan hệ giữa “hy vọng” và “công chính”. Bản dịch chính giữ cấu trúc tương đối mở, không quyết định rằng sự công chính là đối tượng hay nguồn sinh ra hy vọng.
- issue: Nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: Trong lập luận thần học của thư Ga-la-ti, “sự công chính” là cách hiểu ưu tiên; tuy vậy, nghĩa “công lý” thuộc phạm vi ngữ nghĩa thực của từ nên được nêu ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ liên từ lập luận “Vì”, dùng thuật ngữ quen thuộc “Thánh Linh”, “đức tin”, “sự công chính”, đồng thời tránh diễn giải quá mức nội dung cánh chung hàm chứa trong “niềm hy vọng về sự công chính”.
