id: GAL.5.10
reference: Galatians 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: vi
  text: Tôi tin chắc trong Chúa rằng anh chị em sẽ không nghĩ gì khác[a]. Còn kẻ đang gây rối cho anh chị em sẽ mang lấy sự phán xét, bất kể người ấy là ai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “anh chị em sẽ không theo một quan điểm nào khác.” Động từ Hy Lạp có thể chỉ việc suy nghĩ nói chung, nhưng cũng có thể nói đến quan điểm hoặc tâm thế mà người ta giữ.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “dù người ấy là ai.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πέποιθα
  choice: tôi tin chắc
  rationale: Thể hoàn thành được dùng theo nghĩa chỉ trạng thái tin tưởng vững vàng đang tiếp diễn; “tin chắc” tự nhiên trong tiếng Việt và giữ được sắc thái xác tín.
- source_word: εἰς ὑμᾶς
  choice: về anh chị em
  rationale: Cụm giới từ hướng sự tin tưởng của Phao-lô đến điều ông kỳ vọng nơi người Ga-la-ti; “về anh chị em” rõ nghĩa hơn “trong anh chị em” trong tiếng Việt.
- source_word: ἐν κυρίῳ
  choice: Trong Chúa
  rationale: Giữ cách nói đặc trưng của Phao-lô, diễn tả phạm vi hoặc nền tảng của lòng tin chắc mà không thu hẹp thành chỉ một nghĩa công cụ.
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: anh chị em sẽ không nghĩ khác đi
  rationale: φρονέω có thể nói đến suy nghĩ, quan điểm hoặc tâm thế. Cách dịch này tự nhiên, trực tiếp, nhưng vẫn để chú thích nêu nghĩa rộng hơn.
- source_word: ὁ ταράσσων ὑμᾶς
  choice: kẻ đang gây rối cho anh chị em
  rationale: Phân từ hiện tại chỉ người hiện đang làm cộng đồng xáo trộn; “gây rối” truyền đạt sức nặng của hành động trong ngữ cảnh.
- source_word: βαστάσει τὸ κρίμα
  choice: sẽ phải mang lấy sự phán xét
  rationale: “Mang lấy” giữ hình ảnh của βαστάζω, còn “sự phán xét” bảo toàn độ rộng nghĩa của κρίμα giữa phán quyết và hình phạt phát sinh từ đó.
- source_word: ὅστις ἐὰν ᾖ
  choice: bất kể người ấy là ai
  rationale: 'Diễn đạt tự nhiên lực bất định/nhượng bộ của cấu trúc Hy Lạp: danh tính hay địa vị của kẻ gây rối không làm thay đổi lời cảnh báo.'
theological_decisions:
- issue: Nền tảng và mức độ tin chắc của Phao-lô
  choice: Phao-lô bày tỏ lòng tin chắc về phản ứng tương lai của người Ga-la-ti, và lòng tin ấy đặt trong Chúa.
  alternative: Một sự bảo đảm vô điều kiện rằng mọi người Ga-la-ti chắc chắn sẽ kiên trì, hoặc chỉ là sự lạc quan cá nhân của Phao-lô.
  rationale: Câu văn vừa có lời xác tín cá nhân vừa nêu rõ “trong Chúa”; bản dịch giữ cả hai phương diện mà không biến lời này thành một khẳng định giáo lý vượt quá câu chữ.
- issue: Bản chất của τὸ κρίμα
  choice: Sự phán xét mà kẻ gây rối phải gánh chịu, không xác định cụ thể đó là án phạt đời đời hay một hình thức kỷ luật nào.
  alternative: Án diệt vong đời đời, hoặc chỉ là hậu quả xã hội hay kỷ luật hội thánh.
  rationale: κρίμα có thể chỉ sự phán xét, phán quyết hoặc hậu quả hình phạt; câu này không xác định chính xác phạm vi nên cần giữ nguyên độ mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; dùng “kẻ” ở vế sau để phản ánh sắc thái cảnh cáo đối với người gây rối. Đảo “Trong Chúa” lên đầu nhằm giữ nền tảng thần học nổi bật mà vẫn tự nhiên trong tiếng Việt.
