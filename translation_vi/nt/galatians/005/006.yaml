id: GAL.5.6
reference: Galatians 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: vi
  text: Vì trong Đấng Mê-si-a Giê-su[a], chịu cắt bì hay không chịu cắt bì đều chẳng có giá trị gì, nhưng đức tin[b] hoạt động qua tình yêu thương[c] mới có giá trị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong Đấng Christ Giê-su”. Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu”.
    reason: alternative_reading
  - marker: b
    text: Từ πίστις cũng có thể được dịch là “lòng tin” hoặc “sự trung tín”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “đức tin đang có tác dụng qua tình yêu thương”, “đức tin biểu lộ qua tình yêu thương” hoặc “đức tin được làm cho hữu hiệu qua tình yêu thương”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Giữ giới từ “trong” để bảo toàn cách Phao-lô nói về sự hiệp nhất với Đấng Mê-si-a; Χριστός được dịch theo nghĩa tước hiệu, còn Ἰησοῦ được phiên âm theo cách dùng tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ này đưa ra cơ sở giải thích cho lập luận ngay trước đó; “Vì” tự nhiên và sát chức năng của từ trong mạch văn.
- source_word: περιτομή … ἀκροβυστία
  choice: chịu cắt bì … không chịu cắt bì
  rationale: Cách diễn đạt bằng động từ tự nhiên trong tiếng Việt, đồng thời giữ nguyên thế đối xứng giữa hai tình trạng mang ý nghĩa thể lý và căn tính giao ước.
- source_word: τι ἰσχύει
  choice: có giá trị gì
  rationale: Trong ngữ cảnh, cụm từ chỉ giá trị hoặc hiệu lực chứ không đơn thuần là sức mạnh. Câu tiếng Việt lặp lại “mới có giá trị” ở vế sau để diễn đạt rõ động từ được tỉnh lược trong nguyên văn.
- source_word: πίστις
  choice: đức tin
  rationale: “Đức tin” là cách dịch chuẩn, dễ hiểu của πίστις trong ngữ cảnh này; các sắc thái “lòng tin” và “sự trung tín” được ghi ở chú thích.
- source_word: δι’ ἀγάπης
  choice: qua tình yêu thương
  rationale: διά với sở hữu cách chỉ phương tiện hoặc môi giới; “qua” giữ được quan hệ ấy mà không xác định quá mức cách thức tác động.
- source_word: ἐνεργουμένη
  choice: hoạt động
  rationale: Phân từ hiện tại có thể mang sắc thái trung hoặc bị động. “Hoạt động” giữ ý đức tin đang có tác dụng mà không buộc câu theo nghĩa “tự biểu lộ” hay “được làm cho hữu hiệu”.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Ở đây Χριστός mang chức năng tước hiệu; dịch là “Đấng Mê-si-a” làm rõ ý nghĩa ấy, trong khi chú thích bảo lưu cách gọi quen thuộc “Đấng Christ”.
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: “Đức tin” phù hợp nhất với cách dùng thông thường trong câu này, nhưng trường nghĩa của πίστις rộng hơn; chú thích giữ lại những khả năng từ vựng khác mà không áp đặt một cách giải nghĩa thần học duy nhất.
- issue: Dạng trung/bị động của ἐνεργουμένη
  choice: hoạt động
  alternative: đang được làm cho hữu hiệu; biểu lộ tác dụng
  rationale: Hình thái Hy Lạp cho phép nhiều sắc thái. Bản chính dùng cách diễn đạt tương đối trung tính để không giải quyết thay người đọc câu hỏi đức tin tự biểu lộ hay được làm cho hữu hiệu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cặp “chịu cắt bì/không chịu cắt bì” tự nhiên hơn hai danh từ trừu tượng tương ứng trong tiếng Việt. Cấu trúc “nhưng … mới có giá trị” làm rõ phép tỉnh lược của vế Hy Lạp mà vẫn giữ trọng tâm đối lập của câu.
