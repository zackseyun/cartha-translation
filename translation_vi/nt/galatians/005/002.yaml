id: GAL.5.2
reference: Galatians 5:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/002.yaml
  text: 'Look: I[a], Paul, say to you that if you receive circumcision[b], Messiah will benefit you nothing.'
translation:
  language: vi
  text: 'Này, tôi, Phao-lô, nói với anh em rằng: nếu anh em chịu cắt bì[a], thì Đấng Mê-si[b] sẽ chẳng có ích gì cho anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nếu anh em được cắt bì” hoặc “nếu anh em để cho người ta cắt bì mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Tiếng Hy Lạp: Christos, nghĩa là “Đấng được xức dầu”; ở đây được dịch là “Đấng Mê-si” vì từ này mang chức năng tước hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: Này
  rationale: Dùng như một lời gọi chú ý đầy nhấn mạnh; “Này” ngắn gọn, trang trọng và giữ được sức cảnh báo trực tiếp của Phao-lô.
- source_word: ἐγὼ Παῦλος
  choice: tôi, Phao-lô
  rationale: Giữ cả đại từ được nêu rõ và tên riêng ở thế đồng vị, qua đó bảo tồn sự tự xác nhận và nét nhấn mạnh trong nguyên văn.
- source_word: λέγω ὑμῖν
  choice: nói với anh em
  rationale: Diễn đạt trực tiếp động từ λέγω cùng đại từ số nhiều; “anh em” phù hợp với cách xưng hô cộng đồng trong thư mà không thêm ý giải thích.
- source_word: ἐὰν περιτέμνησθε
  choice: nếu anh em chịu cắt bì
  rationale: “Chịu cắt bì” diễn đạt tự nhiên thể bị động của động từ và việc tiếp nhận nghi thức, nhưng không tự ý xác định động cơ hay mở rộng thành sự lên án mọi trường hợp cắt bì.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός mang ý nghĩa tước hiệu, chỉ Đấng được xức dầu; “Đấng Mê-si” làm rõ chức vị ấy thay vì xử lý từ này đơn thuần như tên riêng.
- source_word: οὐδὲν ὠφελήσει
  choice: sẽ chẳng có ích gì cho anh em
  rationale: Giữ thì tương lai và ý phủ định hoàn toàn của οὐδὲν, đồng thời dùng cách nói tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ; Đức Kitô
  rationale: Ngữ cảnh vẫn làm nổi bật vai trò cứu độ của Đấng được xức dầu, nên giữ nghĩa tước hiệu mà không biến nó thành một tên riêng thuần túy.
- issue: Phạm vi lời cảnh báo về phép cắt bì
  choice: Giữ nguyên mệnh đề điều kiện “nếu anh em chịu cắt bì”, không thêm lời giải thích vào chính văn.
  alternative: Diễn giải rõ là chịu cắt bì nhằm được xưng công chính hoặc như một nghĩa vụ giao ước.
  rationale: Bối cảnh thư cho thấy tranh luận liên quan đến việc áp đặt cắt bì và tuân giữ luật pháp, nhưng câu này không tự nêu động cơ ấy. Bản dịch vì thế không mở rộng thành sự lên án mọi hình thức cắt bì, cũng không chèn phần diễn giải thần học vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dấu hai chấm làm nổi bật lời cảnh báo tiếp theo; cấu trúc “tôi, Phao-lô” được giữ để phản ánh sự nhấn mạnh khác thường của nguyên văn.
