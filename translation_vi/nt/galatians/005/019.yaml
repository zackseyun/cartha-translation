  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: vi
  text: 'Còn những việc làm của xác thịt[a] thì rõ ràng, đó là: vô luân tình dục, ô uế, phóng đãng,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “bản tính tội lỗi”. Từ Hy Lạp là “xác thịt” (σάρξ); tại đây Phao-lô dùng từ này theo nghĩa ẩn dụ để nói đến những ham muốn và khuynh hướng sa ngã của con người.'
    reason: alternative_reading
lexical_decisions:
- source_word: φανερὰ
  choice: rõ ràng
  rationale: Diễn đạt điều hiển nhiên, dễ nhận thấy bằng tiếng Việt hiện đại và tự nhiên.
- source_word: δέ
  choice: Còn
  rationale: Đánh dấu sự chuyển ý và tương phản nhẹ với phần trước mà không nhấn mạnh quá mức như “nhưng”.
- source_word: τὰ ἔργα
  choice: những việc làm
  rationale: Giữ ý các hành động phát sinh từ “xác thịt” và duy trì sự đối chiếu của Phao-lô giữa các việc làm ấy với “trái của Thánh Linh” ở câu 22.
- source_word: τῆς σαρκός
  choice: của xác thịt
  rationale: Giữ nguyên ẩn dụ thần học của Phao-lô thay vì thu hẹp nó thành một cách giải thích duy nhất.
- source_word: ἅτινά ἐστιν
  choice: 'đó là:'
  rationale: Giới thiệu danh sách một cách rõ ràng, tự nhiên, đồng thời phản ánh cấu trúc giải thích của nguyên văn.
- source_word: πορνεία
  choice: sự vô luân về tình dục
  rationale: Chỉ rộng các hành vi tình dục trái luân lý; tránh “gian dâm”, từ có thể bị hiểu hẹp là ngoại tình.
- source_word: ἀκαθαρσία
  choice: ô uế
  rationale: Giữ sắc thái ô uế về đạo đức trong một cách diễn đạt quen thuộc, trang trọng.
- source_word: ἀσέλγεια
  choice: phóng đãng
  rationale: Diễn tả lối buông thả trơ trẽn, đặc biệt trong hành vi tình dục, bằng từ ngữ dễ hiểu và đủ rộng.
theological_decisions:
- issue: Cách dịch σάρξ trong văn cảnh đạo đức của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo tồn ẩn dụ và sự căng thẳng thần học trong thế đối lập giữa xác thịt và Thánh Linh; “bản tính tội lỗi” là một cách giải thích khả dĩ nhưng có thể khiến nghĩa bị thu hẹp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Còn… thì…” thể hiện chuyển ý nhẹ. Dấu phẩy cuối câu được giữ vì câu 19 tiếp tục sang danh sách ở các câu kế tiếp.
