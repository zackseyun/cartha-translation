  source_fidelity: 'Bản dịch phản ánh sát cấu trúc và lập luận của nguyên văn: ἐγὼ δέ được chuyển là “Còn tôi”; lời gọi ἀδελφοί được giữ là “thưa anh em”; hai lần ἔτι được diễn đạt bằng “vẫn/vẫn còn”; thể bị động của διώκομαι được giữ trong “bị bắt bớ”. “Nếu vậy” diễn đạt hợp lý tính suy luận của ἄρα, và “đã bị loại bỏ” truyền đạt được thể hoàn thành bị động của κατήργηται trong ngữ cảnh giả định tu từ.'
