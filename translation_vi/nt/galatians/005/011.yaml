id: GAL.5.11
reference: Galatians 5:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: vi
  text: Còn tôi, thưa anh em[a], nếu tôi vẫn rao giảng phép cắt bì, thì tại sao tôi vẫn còn bị bắt bớ? Nếu vậy, điều gây vấp phạm của thập tự giá đã bị loại bỏ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh chị em”; từ Hy Lạp được dịch là “anh em” có thể dùng để gọi một nhóm gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Hay “sự xúc phạm của thập tự giá đã bị loại bỏ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: anh em
  rationale: Cách xưng hô số nhiều tự nhiên, trang trọng trong thư tín; giữ hình thức giống đực của tiếng Hy Lạp, đồng thời chú thích rằng từ này có thể chỉ cả cộng đồng gồm nam và nữ.
- source_word: περιτομήν
  choice: phép cắt bì
  rationale: Tương đương trực tiếp và quen thuộc; trong Ga-la-ti, cụm từ cũng gợi đến việc đòi hỏi thực hành này như dấu hiệu tuân giữ Luật Pháp.
- source_word: ἔτι
  choice: vẫn / vẫn còn
  rationale: Giữ sắc thái tiếp diễn trong cả hai lần xuất hiện và làm rõ lập luận của Phao-lô.
- source_word: κηρύσσω
  choice: rao giảng
  rationale: Diễn đạt tự nhiên hành động công khai công bố một sứ điệp.
- source_word: διώκομαι
  choice: bị bắt bớ
  rationale: Giữ thể bị động và sắc thái chịu sự chống đối vì sứ điệp được rao giảng.
- source_word: ἄρα
  choice: Nếu vậy
  rationale: Chuyển tải kết luận suy ra từ giả định đứng trước một cách rõ ràng và tự nhiên trong tiếng Việt.
- source_word: κατήργηται
  choice: đã bị loại bỏ
  rationale: 'Giữ thể hoàn thành bị động và trạng thái kết quả: sức gây vấp phạm của thập tự giá khi ấy không còn tác động.'
- source_word: σκάνδαλον
  choice: điều gây vấp phạm
  rationale: Giữ được hình ảnh nguồn về nguyên nhân khiến người ta vấp ngã, đồng thời bao hàm sắc thái gây xúc phạm và chống đối.
- source_word: σταυροῦ
  choice: thập tự giá
  rationale: Cách gọi chuẩn, trang trọng và quen thuộc trong ngữ cảnh Tân Ước.
theological_decisions:
- issue: Phạm vi người được gọi bằng ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Bản văn giữ hình thức giống đực của nguyên ngữ, còn chú thích nêu rõ từ Hy Lạp có thể dùng để gọi một nhóm gồm cả nam lẫn nữ.
- issue: Ý nghĩa của σκάνδαλον τοῦ σταυροῦ
  choice: điều gây vấp phạm của thập tự giá
  alternative: sự xúc phạm của thập tự giá
  rationale: Cách dịch chính bảo tồn ẩn dụ 'vấp' của σκάνδαλον mà không loại trừ sắc thái thập tự giá gây phản cảm và chống đối; phương án kia được ghi ở chú thích.
- issue: Tính giả định của kết luận với ἄρα
  choice: Nếu vậy... đã bị loại bỏ
  alternative: Thế thì... đã bị loại bỏ
  rationale: 'Diễn đạt kết quả phi thực tế hàm ý trong câu hỏi tu từ: nếu Phao-lô còn rao giảng cắt bì, sự bắt bớ và sức gây vấp phạm của thập tự giá sẽ không còn.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và phù hợp văn phong thư tín. Cấu trúc câu hỏi tu từ được giữ rõ; 'Còn tôi, thưa anh em' thể hiện sự chuyển ý và lời gọi trực tiếp. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
