id: GAL.5.20
reference: Galatians 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰδωλολατρία, φαρμακεία, ἔχθραι, ⸂ἔρις, ζῆλος⸃, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: vi
  text: thờ thần tượng, phù phép[a], thù nghịch, tranh chấp, ghen ghét, những cơn nóng giận, tham vọng ích kỷ, chia rẽ, bè phái[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tà thuật”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phe nhóm” hoặc, theo cách dùng về sau trong hội thánh, “dị giáo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: thờ thần tượng
  rationale: Diễn đạt trực tiếp hành vi thờ cúng thần tượng, tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: φαρμακεία
  choice: phù phép
  rationale: Trong danh sách thói xấu này, từ chỉ các thực hành ma thuật hoặc huyền thuật, không phải việc dùng thuốc nói chung.
- source_word: ἔχθραι
  choice: thù nghịch
  rationale: Giữ được sắc thái đối địch và thù địch giữa người với người; dạng danh từ phù hợp với cấu trúc liệt kê.
- source_word: ἔρις
  choice: tranh chấp
  rationale: Chỉ sự xung đột và cãi cọ mang tính đối kháng; cách nói gọn và thông dụng.
- source_word: ζῆλος
  choice: ghen ghét
  rationale: Trong ngữ cảnh tiêu cực này, từ mang nghĩa ganh ghen có tính đối địch chứ không phải lòng nhiệt thành tích cực.
- source_word: θυμοί
  choice: những cơn nóng giận
  rationale: Dạng số nhiều gợi những lần giận dữ bộc phát; cách dịch này giữ được tính lặp lại và bùng nổ.
- source_word: ἐριθεῖαι
  choice: tham vọng ích kỷ
  rationale: Thể hiện việc mưu cầu lợi thế và địa vị cho bản thân bằng tinh thần tranh giành phe phái.
- source_word: διχοστασίαι
  choice: chia rẽ
  rationale: Chỉ tình trạng các thành viên đứng về những phía đối lập nhau trong cộng đồng.
- source_word: αἱρέσεις
  choice: bè phái
  rationale: Trong mạch các tội gây đổ vỡ quan hệ, từ chủ yếu chỉ những nhóm hoặc phe gây chia rẽ, chưa nhất thiết mang nghĩa kỹ thuật về dị giáo.
theological_decisions:
- issue: Cách dịch αἱρέσεις
  choice: bè phái
  alternative: giáo phái; dị giáo
  rationale: Ngữ cảnh trực tiếp nhấn mạnh các tội gây chia rẽ cộng đồng. “Bè phái” bảo tồn nghĩa xã hội của từ mà không áp đặt nghĩa thần học chuyên biệt xuất hiện rõ hơn trong cách dùng về sau.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu; duy trì nhịp ngắn gọn của một danh sách thói xấu. Dấu phẩy cuối câu được giữ vì đây là một phần của danh sách tiếp tục sang câu kế tiếp.
