  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: vi
  text: Một chút men làm dậy cả khối bột.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Một ít men làm lên men cả mẻ bột.”'
    reason: Nêu cách diễn đạt sát cấu trúc từ vựng hơn đối với ζυμοῖ và một cách hiểu tự nhiên khác của φύραμα.
lexical_decisions:
- source_word: μικρὰ
  choice: một chút
  rationale: Diễn tả một lượng nhỏ, tự nhiên trong câu tục ngữ tiếng Việt và giữ sự tương phản với tác động trên toàn thể.
- source_word: ζύμη
  choice: men
  rationale: Chỉ chất gây lên men trong bột; “men” là từ thông dụng, phù hợp với hình ảnh cổ và sắc thái ẩn dụ trong Kinh Thánh.
- source_word: ὅλον
  choice: cả
  rationale: Biểu thị tính toàn thể và kết hợp tự nhiên với “khối bột” trong tiếng Việt.
- source_word: φύραμα
  choice: khối bột
  rationale: Chỉ phần bột đã được nhào trộn như một khối; cách dịch này giữ hình ảnh cụ thể mà vẫn rõ nghĩa với độc giả hiện đại.
- source_word: ζυμοῖ
  choice: làm dậy
  rationale: Diễn đạt tác động của men khiến bột dậy, tự nhiên hơn động từ chuyên biệt “lên men” trong cấu trúc này và vẫn giữ hình ảnh nguyên văn.
theological_decisions:
- issue: Sức gợi ẩn dụ của câu tục ngữ
  choice: Giữ nguyên hình ảnh cụ thể về men và khối bột, không nêu thẳng điều được ám chỉ.
  alternative: Một chút ảnh hưởng xấu lan ra cả cộng đồng.
  rationale: Câu Hy Lạp chỉ phát biểu câu tục ngữ; việc giải nghĩa ngay trong chính văn sẽ thu hẹp dụng ý và đưa nội dung từ văn cảnh vào câu.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng vừa phải và mang tính tục ngữ. “Một chút men” và “cả khối bột” tạo thế đối xứng rõ; “làm dậy” dễ hiểu trong tiếng Việt hiện đại.
