id: GAL.5.25
reference: Galatians 5:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: vi
  text: Nếu chúng ta sống nhờ Thánh Linh[a], thì cũng hãy bước theo Thánh Linh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu chúng ta sống trong Thánh Linh, thì cũng hãy bước đều theo Thánh Linh.”'
    reason: Giữ lại khả năng hiểu πνεύματι theo nghĩa “trong Thánh Linh” và sắc thái cụ thể của στοιχῶμεν là bước đúng nhịp, đúng hàng hoặc phù hợp với một chuẩn mực.
lexical_decisions:
- source_word: εἰ
  choice: Nếu
  rationale: Giữ nguyên hình thức điều kiện của câu Hy Lạp và mạch khích lệ của Phao-lô; không đổi thành “Vì” hay “Bởi” dù ngữ cảnh có thể hàm ý điều đã được thừa nhận.
- source_word: ζῶμεν
  choice: chúng ta sống
  rationale: Diễn đạt tự nhiên động từ hiện tại ζάω; trong ngữ cảnh, sự sống này bắt nguồn từ Thánh Linh chứ không chỉ là sự sống thể chất.
- source_word: πνεύματι
  choice: nhờ Thánh Linh / theo Thánh Linh
  rationale: Ở vế đầu, “nhờ” làm rõ sắc thái nguồn hoặc phương tiện của sự sống. Ở vế sau, “theo” kết hợp tự nhiên với động từ chỉ cách sống và diễn tả sự sống phù hợp với Thánh Linh. Ngữ cảnh đối lập xác thịt với Thánh Linh cho thấy đây là Thánh Linh, dù cách hiểu “trong Thánh Linh” vẫn được ghi ở chú thích.
- source_word: καὶ
  choice: cũng
  rationale: 'Thể hiện ý tương ứng: nếu sự sống nhờ Thánh Linh là thực tại, cách sống cũng phải phù hợp với Thánh Linh.'
- source_word: στοιχῶμεν
  choice: hãy bước theo
  rationale: Đây là lối khuyên nhủ ở ngôi thứ nhất số nhiều. “Bước theo” vừa tự nhiên trong tiếng Việt vừa giữ hình ảnh bước đi, đồng thời gợi ý sống theo một đường hướng hoặc chuẩn mực; sắc thái cụ thể hơn là “bước đều theo” được giữ trong chú thích.
theological_decisions:
- issue: Đối tượng được πνεύματι chỉ đến
  choice: Thánh Linh
  alternative: tinh thần của con người
  rationale: Trong Ga-la-ti 5, sự đối lập liên tục giữa xác thịt và Thánh Linh cho thấy từ này chỉ Thánh Linh của Đức Chúa Trời, không phải tinh thần con người.
- issue: Quan hệ của người tin với Thánh Linh trong hai vế
  choice: Sự sống bắt nguồn từ Thánh Linh và cách sống phải phù hợp với Thánh Linh
  alternative: Cả hai vế đều được hiểu theo nghĩa vị trí là “trong Thánh Linh”
  rationale: Cách dịch phân biệt “nhờ” và “theo” phản ánh chức năng tự nhiên của từng vế trong tiếng Việt mà không biến hai lần dùng πνεύματι thành hai ý thần học tách biệt; khả năng dịch theo nghĩa “trong” được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chúng ta” phù hợp với lời khuyên bao gồm cả tác giả lẫn độc giả; “thì cũng hãy” tái hiện rõ cấu trúc điều kiện–khích lệ. Viết hoa “Thánh Linh” để biểu thị đối tượng trong ngữ cảnh là Thánh Linh của Đức Chúa Trời.
