  - severity: low
    issue: Lặp lời xưng hô và đại từ “anh chị em” ngay liền nhau.
    rationale: “Thưa anh chị em, anh chị em...” có thể hiểu được nhưng nặng trong tiếng Việt hiện đại. Cấu trúc sửa vẫn giữ cả lời xưng hô ἀδελφοί lẫn đại từ nhấn mạnh ὑμεῖς.
  - severity: low
    issue: “Để sống trong tự do” diễn giải rộng hơn cách diễn đạt của nguyên văn.
    rationale: Cụm này không sai nghĩa, nhưng “được kêu gọi đến sự tự do” gần với quan hệ của ἐπὶ với tặng cách hơn và không thêm nét diễn giải về ‘lối sống’.
