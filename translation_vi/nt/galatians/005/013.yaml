  to: Thưa anh chị em, vì anh chị em đã được kêu gọi đến sự tự do; chỉ đừng lấy sự tự do ấy làm cơ hội cho xác thịt[a], nhưng hãy qua tình yêu thương mà phục vụ lẫn nhau[b].
