id: GAL.5.13
reference: Galatians 5:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: vi
  text: Thưa anh chị em, vì anh chị em đã được kêu gọi đến sự tự do; chỉ đừng lấy sự tự do ấy làm cơ hội cho xác thịt[a], nhưng hãy qua tình yêu thương mà phục vụ lẫn nhau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Xác thịt” ở đây không chỉ thân thể vật chất, nhưng chỉ những khuynh hướng của con người sa ngã chống lại ý muốn của Đức Chúa Trời; cũng có thể diễn ý là “bản tính tội lỗi.”
    reason: alternative_reading
  - marker: b
    text: Động từ dịch là “phục vụ” có liên hệ với từ chỉ nô lệ và mang sắc thái tự đặt mình vào việc phục dịch người khác.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: anh chị em
  rationale: Đại từ số nhiều được nêu rõ để nhấn mạnh; trong tiếng Việt, lặp lại “anh chị em” sau lời xưng hô vừa tự nhiên vừa giữ được sắc thái nhấn mạnh.
- source_word: γὰρ
  choice: không dịch thành từ riêng
  rationale: Liên từ nối câu này với lập luận trước theo hướng giải thích. Trong tiếng Việt hiện đại, quan hệ ấy đã rõ theo mạch văn; thêm “vì” ngay sau lời xưng hô khiến câu nặng và kém tự nhiên.
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: để sống trong tự do
  rationale: Cụm ἐπί với tặng cách có thể chỉ mục đích hoặc trạng thái hướng tới. Cách dịch này diễn đạt tự nhiên việc được gọi vào một đời sống tự do mà không thu hẹp nghĩa chỉ còn mục đích.
- source_word: ἐκλήθητε
  choice: đã được kêu gọi
  rationale: Giữ thể bị động và ngôn ngữ về sự kêu gọi quen thuộc trong Phao-lô, nhưng không xác định rõ tác nhân khi nguyên văn không nêu.
- source_word: ἀδελφοί
  choice: Thưa anh chị em
  rationale: Trong lời xưng hô thư tín, danh từ giống đực số nhiều này hướng đến toàn thể cộng đồng tín hữu. “Anh chị em” truyền đạt đúng phạm vi chỉ người trong tiếng Việt tự nhiên.
- source_word: μόνον
  choice: Chỉ
  rationale: Giữ lực giới hạn, chuyển từ lời khẳng định về tự do sang điều cảnh báo thiết yếu.
- source_word: μὴ...εἰς ἀφορμὴν
  choice: đừng lấy ... làm cơ hội
  rationale: ἀφορμή là điểm xuất phát, dịp hay cơ hội. Cách nói này rõ, tự nhiên và giữ hình ảnh biến tự do thành cơ hội cho điều khác hoạt động.
- source_word: σάρξ
  choice: xác thịt
  rationale: Giữ thuật ngữ thần học giàu sắc thái của Phao-lô thay vì diễn giải thẳng thành “bản tính tội lỗi”; chú thích làm rõ rằng nghĩa ở đây không chỉ là thân thể vật chất.
- source_word: διὰ τῆς ἀγάπης
  choice: lấy tình yêu thương mà
  rationale: Diễn đạt sắc thái phương tiện của διά với sở hữu cách bằng một cấu trúc tiếng Việt trang trọng, tự nhiên.
- source_word: δουλεύετε
  choice: phục vụ
  rationale: Động từ mang hình ảnh phục dịch như nô lệ, nhưng “phục vụ” phù hợp hơn trong lời khuyên có đối tượng hỗ tương; chú thích bảo lưu sắc thái mạnh của nguyên ngữ.
- source_word: ἀλλήλοις
  choice: lẫn nhau
  rationale: Đại từ hỗ tương được diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί trong lời xưng hô
  choice: anh chị em
  alternative: anh em
  rationale: Tuy hình thức Hy Lạp là giống đực số nhiều, lời xưng hô trong thư này bao gồm cả cộng đồng nam và nữ. Tiếng Việt dùng “anh chị em” để thể hiện trực tiếp phạm vi ấy mà vẫn giữ hình ảnh gia đình.
- issue: Ý nghĩa của σάρξ trong lời cảnh báo đạo đức
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” bảo tồn thuật ngữ và sự căng thẳng thần học của Phao-lô; diễn giải thành “bản tính tội lỗi” có thể thu hẹp trường nghĩa. Chú thích nêu rõ đây không đơn thuần là thân thể.
- issue: Sắc thái nô lệ trong δουλεύετε
  choice: phục vụ lẫn nhau
  alternative: làm nô lệ cho nhau
  rationale: Nguyên ngữ có sắc thái phục dịch như nô lệ, tạo nghịch lý giữa tự do và tự nguyện phục vụ. Bản văn chính dùng lối nói Việt tự nhiên, còn chú thích bảo lưu sức nặng của hình ảnh.
- issue: Quan hệ của ἐπ’ ἐλευθερίᾳ với sự kêu gọi
  choice: được kêu gọi để sống trong tự do
  alternative: được kêu gọi đến sự tự do
  rationale: Giới từ có thể nhấn mạnh mục đích hoặc trạng thái mà người tin được gọi vào. “Để sống trong tự do” giữ cả hướng đích lẫn thực tại sống động, không áp đặt một hệ thống thần học riêng.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thưa anh chị em” như lời xưng hô thư tín tự nhiên; giữ “xác thịt” để bảo tồn thuật ngữ Phao-lô, đồng thời giải thích bằng chú thích. Cấu trúc câu làm nổi bật nghịch lý: được gọi vào tự do nhưng dùng tình yêu thương để phục vụ nhau.'
