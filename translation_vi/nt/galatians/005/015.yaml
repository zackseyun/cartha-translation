review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc điều kiện–cảnh báo, tính hỗ tương của ἀλλήλους, và chuỗi hình ảnh mạnh «cắn / ăn nuốt / bị tiêu diệt». Tuy nhiên, «bị nhau hủy diệt» là cách đặt tác nhân bị động không tự nhiên trong tiếng Việt. Chuyển mệnh đề cuối sang cấu trúc hỗ tương chủ động diễn đạt rõ kết cục tự hủy diệt mà vẫn bảo toàn ý của ὑπ’ ἀλλήλων ἀναλωθῆτε.
  naturalness: «Cắn xé và ăn nuốt lẫn nhau» là một cặp từ tự nhiên, giàu hình ảnh. «Hãy coi chừng, kẻo anh em tiêu diệt lẫn nhau» tự nhiên và trực tiếp hơn «kẻo anh em bị nhau hủy diệt».
  terminology: «Anh em» phù hợp với lối xưng hô cộng đồng trong thư tín Phao-lô. Giữ «cắn xé» và «ăn nuốt» để không làm dịu hình ảnh ẩn dụ. «Tiêu diệt lẫn nhau» truyền đạt kết quả bị tiêu hao đến hủy hoại mà không buộc một sắc thái kỹ thuật hoặc giáo phái.
  issues:
  - severity: medium
    issue: Cụm «anh em bị nhau hủy diệt» không tự nhiên trong tiếng Việt hiện đại.
    rationale: Tác nhân «nhau» sau bị động tạo cấu trúc gượng. Tiếng Việt diễn đạt cùng ý tương hỗ tự nhiên hơn bằng «anh em tiêu diệt lẫn nhau» trong phạm vi lời cảnh báo.
  - severity: low
    issue: Chú thích thay thế dùng «bị nhau tiêu hao hoàn toàn», lặp lại cấu trúc bị động gượng tương tự.
    rationale: Nên sửa thành một phương án tiếng Việt tự nhiên hơn, đồng thời giữ được sắc thái «bị tiêu hao/cạn kiệt» của ἀναλίσκω.
  revised_text: Nhưng nếu anh em cắn xé và ăn nuốt lẫn nhau, hãy coi chừng, kẻo anh em tiêu diệt lẫn nhau.[a]
