  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: vi
  text: Nhưng nếu anh em cắn xé và ăn nuốt lẫn nhau, hãy coi chừng, kẻo anh em tiêu diệt lẫn nhau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy coi chừng, kẻo anh em bị tiêu hao hoàn toàn bởi nhau.”'
    reason: Phương án này làm nổi bật sắc thái «tiêu dùng hết, làm cạn kiệt» của ἀναλίσκω và duy trì cấu trúc cảnh báo về hậu quả có thể xảy ra.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: Diễn đạt tự nhiên mệnh đề điều kiện do εἰ dẫn nhập và giữ sắc thái chuyển ý, tương phản nhẹ của δέ.
- source_word: ἀλλήλους
  choice: lẫn nhau / nhau
  rationale: Giữ rõ tính tương hỗ của hành động giữa các thành viên trong cộng đồng.
- source_word: δάκνετε
  choice: cắn xé
  rationale: Giữ hình ảnh thú vật đầy bạo lực của động từ ‘cắn’; ‘cắn xé’ là cách nói tự nhiên, mạnh và dễ hiểu trong tiếng Việt hiện đại.
- source_word: κατεσθίετε
  choice: ăn nuốt
  rationale: Diễn tả hành động ăn ngấu nghiến, nuốt chửng và tiếp nối hình ảnh bạo lực của ‘cắn xé’.
- source_word: βλέπετε
  choice: hãy coi chừng
  rationale: Thể hiện mệnh lệnh phải cảnh giác với giọng cảnh báo cấp bách, tự nhiên trong tiếng Việt.
- source_word: μὴ
  choice: kẻo
  rationale: Trong cấu trúc cảnh báo với động từ giả định, ‘kẻo’ diễn đạt tự nhiên một kết quả tiêu cực có thể xảy ra mà không khẳng định kết quả ấy chắc chắn.
- source_word: ὑπ’ ἀλλήλων
  choice: bị nhau
  rationale: Giữ tác nhân của cấu trúc bị động và nghịch lý rằng chính các tín hữu gây ra sự hủy hoại cho nhau.
- source_word: ἀναλωθῆτε
  choice: bị ... hủy diệt
  rationale: Động từ ở đây chỉ việc bị tiêu hao đến chỗ diệt vong; ‘hủy diệt’ truyền đạt rõ cao trào về sự tự phá hủy của cộng đồng, đồng thời không đồng nhất nó với κατεσθίετε.
theological_decisions:
- issue: Hình ảnh bạo lực trong cộng đồng tín hữu
  choice: Giữ hình ảnh cụ thể ‘cắn xé’ và ‘ăn nuốt’, rồi kết bằng ‘hủy diệt’.
  alternative: Diễn giải nhẹ hơn thành ‘làm tổn thương và phá hoại lẫn nhau’.
  rationale: Lời của Phao-lô cố ý dùng hình ảnh dữ dội để cảnh báo về sự tự hủy hoại của cộng đồng. Làm nhẹ thành ngôn ngữ xung đột chung chung sẽ làm giảm sức nặng tu từ và thêm phần diễn giải không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng trực tiếp. ‘Anh em’ phù hợp với lời Phao-lô nói với cả cộng đồng; trong ngữ cảnh này từ này có tính bao quát. Câu giữ nhịp tăng tiến từ cắn xé, ăn nuốt đến hủy diệt.
