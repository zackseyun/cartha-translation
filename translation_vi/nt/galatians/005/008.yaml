  text: ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/008.yaml
  text: This persuasion is not from the one who calls you[a].
translation:
  language: vi
  text: Sự thuyết phục này không đến từ Đấng kêu gọi anh chị em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ảnh hưởng này không đến từ Đấng kêu gọi anh chị em.”'
    reason: πεισμονή là một danh từ hiếm, có thể chỉ sự thuyết phục hoặc ảnh hưởng khiến người ta bị thuyết phục.
lexical_decisions:
- source_word: πεισμονὴ
  choice: sự thuyết phục ấy
  rationale: Danh từ hiếm này có thể chỉ sự thuyết phục hoặc tình trạng/kết quả bị thuyết phục. “Sự thuyết phục ấy” giữ được tính trừu tượng và liên hệ tới ảnh hưởng sai lệch đang được nói đến trong ngữ cảnh mà không diễn giải quá mức.
- source_word: ἐκ
  choice: đến từ
  rationale: ἐκ biểu thị nguồn gốc; “đến từ” là cách nói tự nhiên trong tiếng Việt và làm rõ rằng sự thuyết phục này không bắt nguồn từ Đấng kêu gọi họ.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: Đấng đang kêu gọi anh chị em
  rationale: Phân từ hiện tại được dùng như danh từ. “Đấng đang kêu gọi” giữ sắc thái hành động đang tiếp diễn và không tự ý thêm danh xưng “Đức Chúa Trời”; “anh chị em” diễn đạt số nhiều ὑμᾶς tự nhiên, bao quát cộng đồng.
- source_word: οὐκ
  choice: không
  rationale: Giữ trực tiếp sức phủ định của câu Hy Lạp.
theological_decisions:
- issue: Danh tính của “Đấng đang kêu gọi anh chị em”
  choice: Giữ cách gọi gián tiếp “Đấng đang kêu gọi anh chị em”, không thêm “Đức Chúa Trời”.
  alternative: “Đức Chúa Trời, Đấng kêu gọi anh chị em” như một cách diễn giải rõ chủ thể.
  rationale: Ngữ cảnh thư Ga-la-ti cho thấy chủ thể rất có thể là Đức Chúa Trời, nhưng nguyên văn chỉ dùng một phân từ có chức năng danh từ. Bản dịch giữ nguyên cách diễn đạt và để người đọc suy ra danh tính từ ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đấng” để phù hợp với chủ thể thần linh được ngụ ý nhưng không nêu đích danh; dùng “anh chị em” để thể hiện đại từ số nhiều, bao quát cộng đồng.
