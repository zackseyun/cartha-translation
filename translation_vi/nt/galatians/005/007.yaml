  text: Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν ⸀τῇ ἀληθείᾳ μὴ πείθεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: vi
  text: Anh em đã chạy tốt. Ai đã ngăn trở anh em, khiến anh em không vâng theo chân lý?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ai đã ngăn trở anh em, khiến anh em không được chân lý thuyết phục?” Động từ Hy Lạp có thể mang nghĩa “vâng theo” hoặc “được thuyết phục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: Anh em đã chạy
  rationale: Giữ nguyên ẩn dụ chạy đua của Phao-lô, không thêm “cuộc đua” vì nguyên văn không nói rõ. Thì chưa hoàn thành diễn tả tiến trình đã từng tiếp diễn; tiếng Việt tự nhiên dùng “đã chạy” trong ngữ cảnh này.
- source_word: καλῶς
  choice: tốt
  rationale: Trạng từ bổ nghĩa cho “chạy”, diễn tả việc họ đã tiến bước đúng đắn; “chạy tốt” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τίς
  choice: Ai
  rationale: Đại từ nghi vấn chỉ tác nhân là người.
- source_word: ἐνέκοψεν
  choice: đã ngăn trở
  rationale: Diễn đạt rõ hành động cản trở, đồng thời phù hợp với hình ảnh người đang chạy bị chặn lại; tránh thêm nét nghĩa cụ thể quá mức như “chen ngang”.
- source_word: τῇ ἀληθείᾳ
  choice: chân lý
  rationale: Chỉ chân lý mà người Ga-la-ti đã tiếp nhận, trong ngữ cảnh là chân lý của Tin Mừng. “Chân lý” có sắc thái trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: μὴ πείθεσθαι
  choice: khiến anh em không vâng theo
  rationale: πείθομαι ở đây có thể mang nghĩa “vâng theo”, nhấn mạnh sự đáp ứng đối với chân lý. Cấu trúc “khiến… không” diễn đạt tự nhiên kết quả của việc bị ngăn trở; nghĩa “được chân lý thuyết phục” được giữ trong chú thích.
theological_decisions:
- issue: Nghĩa của πείθεσθαι đi với τῇ ἀληθείᾳ
  choice: vâng theo chân lý
  alternative: được chân lý thuyết phục
  rationale: Ngữ cảnh nói đến việc người Ga-la-ti không còn đáp ứng đúng với Tin Mừng, nên “vâng theo” truyền đạt rõ chiều kích thực hành. Tuy vậy, động từ cũng có thể chỉ sự được thuyết phục; chú thích bảo tồn khả năng này mà không âm thầm loại bỏ sự mơ hồ của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς theo lối xưng hô thư tín; giữ ẩn dụ “chạy” và không thêm “cuộc đua” vốn chỉ hàm ý trong nguyên văn.
