source:
  edition: SBLGNT
  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: vi
  text: Nhưng những người thuộc về Đấng Mê-si đã đóng đinh xác thịt cùng với các đam mê và ham muốn của nó.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những người thuộc về Đấng Christ.”'
    reason: alternative_reading
  - marker: b
    text: “Xác thịt” ở đây chỉ bản tính con người sa ngã, đối nghịch với Thánh Linh; một số bản dịch diễn đạt là “bản tính tội lỗi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... τοῦ Χριστοῦ
  choice: những người thuộc về Đấng Mê-si
  rationale: Kết cấu mạo từ với sở hữu cách chỉ những người thuộc về Đấng Christ/Mê-si. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý nghĩa quan hệ thuộc về.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ với phần mô tả ngay trước đó. “Nhưng” thể hiện liên kết này mà không thêm ý thời gian vốn không có trong nguyên văn.
- source_word: σάρκα
  choice: xác thịt
  rationale: Trong ngữ cảnh này, σάρξ chỉ phương diện sa ngã của con người đối nghịch với Thánh Linh. Giữ “xác thịt” để bảo tồn thuật ngữ và sức căng thần học của Phao-lô, thay vì giải nghĩa ngay trong chính văn.
- source_word: ἐσταύρωσαν
  choice: đã đóng đinh
  rationale: Động từ aorist diễn tả một hành động quyết liệt; “đóng đinh” giữ nguyên hình ảnh thập tự giá rõ ràng của động từ Hy Lạp.
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: cùng với các đam mê và ham muốn của nó
  rationale: σύν diễn tả sự đi kèm; trong ngữ cảnh đạo đức này, παθήματα là các xung lực mãnh liệt còn ἐπιθυμίαι là những ham muốn. Đại từ “của nó” làm rõ rằng cả hai gắn với “xác thịt”.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός có thể được hiểu như tước hiệu chỉ Đấng được xức dầu. Chính văn dùng “Đấng Mê-si”; cách gọi quen thuộc “Đấng Christ” được giữ trong chú thích để phản ánh khả năng dùng gần như danh xưng.
- issue: Cách dịch σάρξ trong sự đối nghịch đạo đức của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: “Xác thịt” giữ thuật ngữ và tính đa nghĩa của Phao-lô; “bản tính tội lỗi” là một lối giải thích hợp ngữ cảnh nhưng thu hẹp nghĩa, nên được đưa vào chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh “đóng đinh” cùng thuật ngữ thần học “xác thịt”; dùng “Đấng Mê-si” trong chính văn và ghi nhận “Đấng Christ” ở chú thích.
