id: GAL.5.1
reference: Galatians 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: vi
  text: Đấng Mê-si đã giải phóng chúng ta để chúng ta được tự do[a]. Vậy, hãy đứng vững, đừng để mình lại bị đặt dưới ách nô lệ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong sự tự do, Đấng Mê-si đã giải phóng chúng ta.” Cụm mở đầu trong tiếng Hy Lạp rất cô đọng và có thể được hiểu theo vài cách gần nghĩa nhau.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đừng lại mắc vào ách nô lệ” hoặc “đừng lại chịu lệ thuộc vào ách nô lệ.” Động từ Hy Lạp có thể mang ý bị cầm giữ, mắc vào hoặc trở nên lệ thuộc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: để chúng ta được tự do
  rationale: Cụm ở cách dữ liệu được hiểu theo nghĩa mục đích hoặc kết quả. Cách diễn đạt này tự nhiên trong tiếng Việt, vẫn giữ trọng tâm về sự tự do và không loại trừ hoàn toàn sắc thái ‘trong sự tự do’.
- source_word: Χριστὸς
  choice: Đấng Mê-si
  rationale: Χριστός mang ý nghĩa tước hiệu ‘Đấng được xức dầu’. ‘Đấng Mê-si’ chuyển tải nội dung tước hiệu và bối cảnh Do Thái rõ hơn cách phiên âm ‘Christ’.
- source_word: ἠλευθέρωσεν
  choice: đã giải phóng chúng ta
  rationale: Động từ có nghĩa làm cho được tự do. ‘Giải phóng’ là cách nói hiện đại, mạnh và tự nhiên; kết hợp với ‘tự do’ để giữ phép lặp cùng gốc của ἐλευθερίᾳ và ἠλευθέρωσεν.
- source_word: στήκετε
  choice: hãy đứng vững
  rationale: Mệnh lệnh hiện tại kêu gọi tiếp tục kiên định. ‘Hãy đứng vững’ giữ nguyên hình ảnh và sức thúc giục.
- source_word: οὖν
  choice: Vậy
  rationale: Từ này đánh dấu kết luận suy ra từ lời tuyên bố trước đó; ‘Vậy’ ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ζυγῷ δουλείας
  choice: dưới ách nô lệ
  rationale: ‘Ách’ giữ nguyên ẩn dụ ζυγός, còn ‘nô lệ’ diễn đạt trực tiếp sức nặng của δουλεία. Thêm ‘dưới’ phù hợp với hình ảnh bị đặt dưới ách.
- source_word: ἐνέχεσθε
  choice: để mình ... bị đặt dưới
  rationale: Dạng mệnh lệnh trung động/thụ động có thể nói đến việc bị cầm giữ, mắc vào hoặc trở nên lệ thuộc. Cách dịch này tự nhiên với ẩn dụ cái ách và không thu hẹp nghĩa chỉ còn ‘vướng mắc’.
- source_word: πάλιν
  choice: lại
  rationale: Diễn đạt trực tiếp ý quay trở về một tình trạng trước kia.
theological_decisions:
- issue: Χριστός nên được dịch như tước hiệu hay dùng dạng tên gọi truyền thống
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này, từ Hy Lạp nêu vai trò của Đấng được xức dầu là Đấng đem lại tự do. Dịch ý nghĩa tước hiệu giúp độc giả hiện đại nhận ra nội dung ấy mà không thêm lập trường hệ phái.
- issue: Mức độ mạnh của δουλεία
  choice: nô lệ
  alternative: cảnh tôi mọi; sự trói buộc
  rationale: ‘Nô lệ’ bảo tồn sự đối lập mạnh giữa tự do và tình trạng bị làm nô lệ, thay vì làm nhẹ thành một sự ràng buộc chung chung.
- issue: Quan hệ của τῇ ἐλευθερίᾳ với mệnh đề chính
  choice: 'mục đích/kết quả: ‘để chúng ta được tự do’'
  alternative: 'phạm vi/trạng thái: ‘trong sự tự do’'
  rationale: Cấu trúc Hy Lạp cô đọng và có thể được hiểu theo hai hướng gần nhau. Bản chính chọn cách đọc mục đích/kết quả vì tự nhiên và có sức tu từ trong tiếng Việt, đồng thời ghi nhận phương án kia ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ hình ảnh ‘đứng vững’ và ‘ách nô lệ’, đồng thời dùng cấu trúc chủ động-tự nhiên ‘đừng để mình’ để thể hiện sắc thái trung động/thụ động của động từ Hy Lạp.
