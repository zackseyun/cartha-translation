  terminology: «Đấng Mê-si» chuyển dịch Χριστός như một tước hiệu, phù hợp định hướng đã nêu. «Giải phóng», «tự do», «ách nô lệ» duy trì trường nghĩa và sức đối lập của nguyên văn mà không áp đặt diễn giải hệ phái.
