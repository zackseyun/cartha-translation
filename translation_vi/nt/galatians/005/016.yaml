  naturalness: Câu văn tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại. Cấu trúc «Hãy ... thì ... chắc chắn sẽ không ...» diễn đạt phù hợp hệ quả được nêu trong câu Hy Lạp.
