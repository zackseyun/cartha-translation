id: GAL.5.16
reference: Galatians 5:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: vi
  text: 'Nhưng tôi nói: Hãy bước đi nhờ Thánh Linh, thì anh chị em chắc chắn sẽ không làm theo ham muốn của xác thịt[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bản tính tội lỗi”. Từ Hy Lạp là “xác thịt”; trong các thư của Phao-lô, từ này có thể chỉ bản tính con người sa ngã trong sự đối nghịch với Thánh Linh.
    reason: Cung cấp cách hiểu diễn giải phổ biến của σάρξ trong ngữ cảnh này, đồng thời giữ từ ngữ nguyên bản trong chính văn.
lexical_decisions:
- source_word: Λέγω δέ
  choice: Nhưng tôi nói
  rationale: δέ đánh dấu một bước chuyển có sắc thái đối lập nhẹ; “Nhưng tôi nói” giữ được lối chuyển ý của Phao-lô mà không làm sự tương phản quá mạnh.
- source_word: πνεύματι
  choice: nhờ Thánh Linh
  rationale: Cách ở đây có thể chỉ phương tiện hoặc phạm vi. Trong ngữ cảnh Ga-la-ti 5, từ này chỉ Thánh Linh; “nhờ” diễn đạt tự nhiên sự dẫn dắt và năng lực của Ngài.
- source_word: περιπατεῖτε
  choice: hãy bước đi
  rationale: Giữ hình ảnh ẩn dụ quen thuộc của Phao-lô về cách sống, đồng thời vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐπιθυμίαν
  choice: ham muốn
  rationale: ἐπιθυμία là sự khao khát hoặc ham muốn; trong ngữ cảnh này mang nghĩa tiêu cực do được bổ nghĩa bởi “của xác thịt”. “Ham muốn” tự nhiên và không thu hẹp nghĩa thành dục vọng.
- source_word: σαρκὸς
  choice: của xác thịt
  rationale: Giữ thuật ngữ và sự căng thẳng trong cách Phao-lô đối lập xác thịt với Thánh Linh, thay vì giải nghĩa ngay thành “bản tính tội lỗi”.
- source_word: οὐ μὴ τελέσητε
  choice: chắc chắn sẽ không làm theo
  rationale: οὐ μή với động từ giả định aorist là lối phủ định nhấn mạnh. “Chắc chắn sẽ không” giữ sức mạnh ấy; “làm theo” diễn đạt việc đưa ham muốn vào hành động.
theological_decisions:
- issue: Đối tượng được πνεύματι chỉ đến
  choice: Thánh Linh
  alternative: tinh thần con người hoặc một nguyên lý thiêng liêng nói chung
  rationale: Mạch văn Ga-la-ti 5 đối lập Thánh Linh với xác thịt và nói đến hoạt động của Thánh Linh trong đời sống người tin. Viết “Thánh Linh” phản ánh chỉ dấu ngữ cảnh mà không thêm một ý tưởng ngoài bản văn.
- issue: Cách dịch σάρξ
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Dù từ này tại đây mang nghĩa luân lý tiêu cực, giữ “xác thịt” bảo tồn phạm trù và sự căng thẳng thần học của Phao-lô; nghĩa diễn giải được nêu trong chú thích.
- issue: Quan hệ giữa mệnh lệnh và lời phủ định mạnh
  choice: “Hãy bước đi … thì … chắc chắn sẽ không”
  alternative: “Hãy bước đi … và đừng làm theo”
  rationale: οὐ μὴ τελέσητε có hình thức phủ định nhấn mạnh chứ không phải một mệnh lệnh phủ định thứ hai. Cấu trúc “thì … chắc chắn sẽ không” thể hiện kết quả hoặc hệ quả mà không giải quyết quá mức sắc thái cú pháp.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ ẩn dụ “bước đi” và thuật ngữ “xác thịt”; dùng “anh chị em” để diễn đạt đại từ số nhiều ngầm trong động từ Hy Lạp theo cách bao quát, tự nhiên.
