id: GAL.5.22
reference: Galatians 5:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: vi
  text: Nhưng trái của Thánh Linh là tình yêu thương, niềm vui, sự bình an, lòng nhẫn nại, lòng nhân từ, sự tốt lành, đức tin[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự trung tín.” Từ Hy Lạp pistis có thể chỉ đức tin, sự tin cậy hoặc tính trung tín.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tương phản với danh sách “các việc của xác thịt” ở 5:19–21 một cách tự nhiên trong tiếng Việt.
- source_word: καρπὸς
  choice: trái
  rationale: Giữ hình ảnh ẩn dụ quen thuộc và dạng số ít của nguyên văn, trình bày các phẩm chất như kết quả hợp nhất do Thánh Linh sinh ra.
- source_word: τοῦ πνεύματός
  choice: của Thánh Linh
  rationale: Trong mạch văn Ga-la-ti 5, πνεῦμα đối lập với xác thịt và chỉ Thánh Linh; cách gọi “Thánh Linh” rõ nghĩa, trang trọng và thông dụng.
- source_word: ἀγάπη
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt Kinh Thánh, chỉ tình yêu thể hiện qua sự quan tâm và hành động, không thu hẹp thành tình cảm lãng mạn.
- source_word: χαρά
  choice: niềm vui
  rationale: Tương đương ngắn gọn, tự nhiên, phù hợp với danh sách các phẩm chất.
- source_word: εἰρήνη
  choice: sự bình an
  rationale: Giữ được phạm vi nghĩa về trạng thái an hòa mà không giới hạn vào bình yên nội tâm hay quan hệ giữa người với người.
- source_word: μακροθυμία
  choice: lòng nhẫn nại
  rationale: Diễn đạt phẩm chất chịu đựng lâu dài và không dễ nổi giận bằng ngôn ngữ hiện đại, dễ hiểu.
- source_word: χρηστότης
  choice: lòng nhân từ
  rationale: Chuyển tải thái độ tử tế, nhân hậu đối với người khác và phân biệt tương đối rõ với ἀγαθωσύνη đứng sau.
- source_word: ἀγαθωσύνη
  choice: sự tốt lành
  rationale: Phản ánh phẩm chất đạo đức rộng của ἀγαθωσύνη mà không thu hẹp vào sự rộng rãi hay chính trực.
- source_word: πίστις
  choice: đức tin
  rationale: Giữ nghĩa căn bản và cách dịch truyền thống của πίστις; vì “sự trung tín” cũng phù hợp trong danh sách phẩm chất, phương án ấy được bảo lưu trong chú thích.
theological_decisions:
- issue: Chủ thể được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: tinh thần của con người
  rationale: Sự đối lập trực tiếp giữa xác thịt và Thánh Linh trong mạch văn Ga-la-ti 5, cùng cách lập luận rộng hơn của Phao-lô, ủng hộ việc hiểu đây là công việc của Thánh Linh nơi người tin.
- issue: Nghĩa của πίστις trong danh sách phẩm chất
  choice: đức tin
  alternative: sự trung tín
  rationale: Cả hai nghĩa đều có cơ sở từ vựng. Bản chính giữ “đức tin” mà không loại bỏ khả năng đây là phẩm chất đáng tin cậy; phương án “sự trung tín” được nêu ở chú thích để bảo toàn sự mơ hồ thật của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ danh từ số ít “trái” và nhịp liệt kê của nguyên văn; dùng “Thánh Linh” theo ngữ cảnh Phao-lô. Câu kết bằng dấu phẩy vì câu Hy Lạp và danh sách tiếp tục ở câu 23.
