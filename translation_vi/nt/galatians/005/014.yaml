id: GAL.5.14
reference: Galatians 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ ⸀πεπλήρωται, ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς ⸀σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: vi
  text: 'Vì toàn bộ luật pháp được làm trọn trong một lời này[a]: “Ngươi phải yêu người lân cận như chính mình.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong một lời phán” hoặc “trong một mệnh lệnh.” Tiếng Hy Lạp nói theo nghĩa đen là “trong một lời,” tức một lời nói hay mệnh lệnh duy nhất.'
    reason: lexical_alternative
  - marker: b
    text: '“Được làm trọn” cũng có thể diễn đạt là “đã được làm trọn”; theo lối giải nghĩa: “được tóm gọn.” Động từ Hy Lạp theo nghĩa sát hơn là “được làm trọn,” hàm ý mục đích của luật pháp đạt đến sự trọn vẹn trong mệnh lệnh này.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: Vì
  rationale: γάρ đưa ra căn cứ giải thích cho lời khuyên trước đó; “Vì” là từ nối tự nhiên và súc tích trong tiếng Việt.
- source_word: πᾶς νόμος
  choice: toàn bộ luật pháp
  rationale: Cụm danh từ số ít có mạo từ chỉ luật pháp xét như một toàn thể; “toàn bộ luật pháp” giữ được phạm vi bao quát của πᾶς.
- source_word: ἐν ἑνὶ λόγῳ
  choice: trong một lời này
  rationale: λόγος tại đây chỉ một lời phán hay mệnh lệnh được trích dẫn, không nhất thiết là một từ đơn lẻ. “Một lời này” tự nhiên trong tiếng Việt và dẫn vào nội dung trích dẫn.
- source_word: πεπλήρωται
  choice: được làm trọn
  rationale: Thể hoàn thành bị động diễn tả trạng thái hiện tại phát sinh từ sự hoàn tất. “Được làm trọn” bảo toàn sắc thái bị động và ý niệm luật pháp đạt đến sự trọn vẹn trong mệnh lệnh này, thay vì thu hẹp thành việc chỉ được tóm tắt.
- source_word: ἐν τῷ
  choice: dấu hai chấm dẫn vào lời trích
  rationale: Cấu trúc này giới thiệu nội dung nơi sự làm trọn diễn ra; trong tiếng Việt, dấu hai chấm diễn đạt quan hệ ấy tự nhiên hơn việc lặp lại giới từ.
- source_word: Ἀγαπήσεις
  choice: Ngươi phải yêu
  rationale: Động từ tương lai trong lời trích Lê-vi Ký 19:18 mang lực của mệnh lệnh. “Phải yêu” truyền đạt rõ tính bắt buộc; “ngươi” giữ giọng trang trọng của lời luật pháp được trích dẫn.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: πλησίον trong ngữ cảnh đạo đức chỉ người lân cận. Cách dịch này chính xác, quen thuộc và không tự ý thu hẹp đối tượng.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Diễn đạt chính xác phép so sánh, đồng thời “chính” làm câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Ý nghĩa lời khẳng định của Phao-lô về quan hệ giữa luật pháp và mệnh lệnh yêu thương
  choice: Luật pháp xét như một toàn thể được làm trọn trong mệnh lệnh yêu người lân cận.
  alternative: Luật pháp chỉ được tóm tắt trong mệnh lệnh này; hoặc chỉ các phần đạo đức của luật pháp được nói đến.
  rationale: πληρόω tự nhiên mang nghĩa làm trọn hơn là chỉ tóm tắt, còn πᾶς νόμος không nêu giới hạn vào một phần luật pháp. Bản dịch giữ lời mạnh của Phao-lô nhưng không suy diễn thêm về việc bãi bỏ luật pháp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “luật pháp” theo cách gọi Kinh Thánh quen thuộc; giữ “ngươi” bên trong lời luật pháp được trích để phân biệt giọng văn trích dẫn, còn cấu trúc câu chính vẫn tự nhiên. Các chú thích bảo tồn độ rộng nghĩa của λόγος và sắc thái thể hoàn thành của πεπλήρωται.
