    issue: Cụm “tưởng mình là gì đó” chưa tự nhiên trong tiếng Việt khi nói về sự tự coi mình là người có giá trị hay đáng kể.
    rationale: τι εἶναι là một lối nói về một người tự cho mình là “somebody.” “Tưởng mình là một người nào đó” truyền đạt lối nói này tự nhiên hơn, không thu hẹp nó thành một địa vị cụ thể như “quan trọng.”
