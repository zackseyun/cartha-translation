  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, ⸂φρεναπατᾷ ἑαυτόν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: vi
  text: Vì nếu ai tưởng mình là một người nào đó, dù thực ra chẳng là gì, thì người ấy tự lừa dối chính mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tự mê hoặc mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: Giữ cả sắc thái giải thích của γάρ và ý điều kiện của εἰ, đồng thời nối tự nhiên với lời khuyên trước đó.
- source_word: δοκεῖ
  choice: tưởng
  rationale: Ở đây động từ nói về sự tự đánh giá của một người. “Tưởng” diễn đạt rõ nhận định chủ quan có thể sai, tự nhiên hơn cách hiểu “có vẻ”.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định có ý khái quát; “ai” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: εἶναί τι
  choice: mình là gì đó
  rationale: Giữ hình ảnh súc tích “là một điều gì đó” và sự đối lập trực tiếp với “chẳng là gì”, thay vì diễn giải thành “quan trọng”.
- source_word: μηδὲν ὤν
  choice: trong khi mình chẳng là gì
  rationale: Diễn đạt tự nhiên quan hệ của phân từ mà không nhấn quá mức sắc thái nhượng bộ; vẫn giữ nguyên nghịch lý đối lập trong câu.
- source_word: φρεναπατᾷ
  choice: tự lừa dối
  rationale: Động từ chỉ việc đánh lừa hay làm lạc hướng tâm trí. “Tự lừa dối” rõ nghĩa và phù hợp với tân ngữ phản thân.
- source_word: ἑαυτόν
  choice: mình
  rationale: Đại từ phản thân quy chiếu về chủ thể số ít khái quát; tiếng Việt dùng “mình” tự nhiên, không cần áp đặt giới tính ngữ pháp của tiếng Hy Lạp.
theological_decisions:
- issue: Chủ thể số ít mang nghĩa khái quát
  choice: ai / người ấy / mình
  alternative: người nào / người đó / chính mình
  rationale: Tiếng Hy Lạp dùng dạng số ít giống đực theo nghĩa đại diện. Tiếng Việt không cần đánh dấu giống; cách dịch này giữ số ít và tính khái quát mà không thêm hàm ý chỉ riêng nam giới.
- issue: Ý nghĩa của “là gì đó” đối lập với “chẳng là gì”
  choice: Giữ nguyên lối nói nghịch lý, không diễn giải thành địa vị hay tầm quan trọng
  alternative: tưởng mình quan trọng, dù mình không đáng kể
  rationale: Bản Hy Lạp cố ý dùng τι và μηδέν đối lập súc tích. Giữ hình thức này bảo toàn sức căng thần học và tu từ, tránh xác định quá hẹp tiêu chuẩn khiến một người là “gì đó”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chẳng là gì” giữ sức mạnh của nguyên văn nhưng vẫn tự nhiên; cấu trúc “ai… người ấy” giúp câu khái quát rõ ràng.
