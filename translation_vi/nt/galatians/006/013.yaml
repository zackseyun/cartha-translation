revisions:
- from: Vì ngay cả chính những người chịu cắt bì[a] cũng không tuân giữ luật pháp; nhưng họ muốn anh em chịu cắt bì để có thể khoe mình về thân thể anh em.
  to: Vì ngay cả chính những người chịu cắt bì[a] cũng không tuân giữ luật pháp; nhưng họ muốn anh em chịu cắt bì để lấy thân thể anh em làm điều khoe khoang.
  rationale: Chỉ sửa cụm diễn tả hành động khoe khoang để phản ánh rõ hơn καυχᾶσθαι ἐν và tạo tiếng Việt tự nhiên. Các phần còn lại của bản nháp giữ được nghĩa nguyên ngữ, sắc thái nhấn mạnh, và thanh ghi phù hợp.
