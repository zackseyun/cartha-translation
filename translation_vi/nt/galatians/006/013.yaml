id: GAL.6.13
reference: Galatians 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: vi
  text: Vì ngay cả chính những người chịu cắt bì[a] cũng không tuân giữ luật pháp; nhưng họ muốn anh em chịu cắt bì để lấy thân thể anh em làm điều khoe khoang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người đang chịu cắt bì.” Tiếng Hy Lạp dùng một phân từ như danh từ, theo nghĩa đen là “những người đang được cắt bì / những người chịu cắt bì.”
    reason: Giữ lại sắc thái có thể hiểu theo tiến trình hoặc dùng như tên gọi mô tả nhóm người trong phân từ hiện tại Hy Lạp.
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: Vì ngay cả ... cũng không
  rationale: “Vì” giữ quan hệ giải thích với câu trước, còn “ngay cả ... cũng không” chuyển tải sự phủ định nhấn mạnh của οὐδέ một cách tự nhiên trong tiếng Việt.
- source_word: οἱ περιτεμνόμενοι
  choice: những người chịu cắt bì
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ để chỉ nhóm người được nhận diện bởi việc cắt bì. Cách dịch này sát nguồn hơn lối diễn giải thành “những người cổ xúy việc cắt bì.”
- source_word: αὐτοὶ
  choice: chính
  rationale: '“Chính” thể hiện sức nhấn mạnh đặt trên chủ thể: ngay cả bản thân nhóm người ấy cũng không giữ luật pháp.'
- source_word: νόμον φυλάσσουσιν
  choice: tuân giữ luật pháp
  rationale: “Tuân giữ” diễn đạt việc vâng theo các đòi hỏi của luật pháp, đồng thời giữ được sắc thái trang trọng và quen thuộc trong văn cảnh Kinh Thánh.
- source_word: ἀλλὰ θέλουσιν
  choice: nhưng họ muốn
  rationale: Cách diễn đạt trực tiếp, tự nhiên, giữ nguyên ý muốn có chủ đích của động từ.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: anh em chịu cắt bì
  rationale: Giữ sắc thái bị động của động từ và dùng đại từ số nhiều phù hợp với lời Phao-lô nói với cộng đồng tín hữu.
- source_word: ἵνα
  choice: để có thể
  rationale: Diễn đạt rõ quan hệ mục đích mà không làm câu tiếng Việt nặng nề.
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: về thân thể anh em
  rationale: Trong văn cảnh cắt bì, σάρξ chỉ thân thể hữu hình, nơi có dấu cắt bì. “Thân thể” truyền đạt nghĩa đen tự nhiên hơn “xác thịt” trong tiếng Việt hiện đại và không gợi sai sang bản tính tội lỗi.
- source_word: καυχήσωνται
  choice: khoe mình
  rationale: Giữ sắc thái tiêu cực của việc lấy thành quả hữu hình nơi người khác làm lý do tự hào.
theological_decisions:
- issue: Nghĩa của σάρξ trong văn cảnh này
  choice: thân thể theo nghĩa đen, liên quan đến dấu cắt bì
  alternative: “xác thịt” theo nghĩa bản tính tội lỗi
  rationale: Việc cắt bì trong mệnh đề ngay trước xác định rằng Phao-lô đang nói đến thân thể hữu hình của người Ga-la-ti. Hiểu là bản tính tội lỗi sẽ đưa vào câu một nghĩa thần học không được văn cảnh hỗ trợ.
- issue: Giá trị của phân từ περιτεμνόμενοι
  choice: nhóm người được gọi là “những người chịu cắt bì”
  alternative: “những người cổ xúy việc cắt bì”
  rationale: Văn cảnh cho thấy họ muốn người khác chịu cắt bì, nhưng chính từ ngữ Hy Lạp nhận diện họ bằng việc cắt bì chứ không trực tiếp gọi họ là những người cổ xúy. Bản dịch không nên giải quyết thay cho nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để nói với cộng đồng tín hữu số nhiều; dùng “cắt bì” và “luật pháp” là các thuật ngữ Kinh Thánh quen thuộc, nhưng cấu trúc câu vẫn tự nhiên trong tiếng Việt hiện nay.
