id: GAL.6.10
reference: Galatians 6:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: vi
  text: Vậy, khi có cơ hội[a], chúng ta hãy làm điều tốt cho mọi người, nhất là cho những người trong gia đình đức tin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bao lâu còn có thời giờ.” Từ Hy Lạp καιρός nhấn mạnh thời điểm hay dịp thích hợp, chứ không chỉ thời gian nói chung.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những người trong nhà đức tin” hoặc “những người thuộc cộng đồng đức tin.” Cụm từ Hy Lạp dùng hình ảnh gia đình để nói về những người thuộc cộng đồng những người tin; “đức tin” cũng có thể được hiểu là niềm tin chung mà cộng đồng ấy tuyên xưng.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Vậy
  rationale: Cặp tiểu từ suy luận nối lời khuyên này với lập luận trước đó; “Vậy” tự nhiên trong tiếng Việt và giữ rõ ý kết luận.
- source_word: ὡς καιρὸν ἔχομεν
  choice: đang khi còn có cơ hội
  rationale: καιρός chỉ thời điểm hoặc dịp thuận tiện để hành động, không chỉ thời gian nói chung. Cách dịch này đồng thời gợi tính hữu hạn của dịp ấy.
- source_word: ἐργαζώμεθα
  choice: chúng ta hãy làm
  rationale: Thể giả định mang nghĩa khích lệ cộng đồng cùng tiếp tục hành động; “chúng ta hãy làm” kết hợp tự nhiên với “điều tốt”.
- source_word: τὸ ἀγαθὸν
  choice: điều tốt
  rationale: Tính từ trung tính có mạo từ được dùng như danh từ, chỉ điều tốt lành cần được thực hiện.
- source_word: πρὸς πάντας
  choice: cho mọi người
  rationale: πρός ở đây hướng hành động đến mọi người. “Cho mọi người” là cách diễn đạt tự nhiên trong tiếng Việt và không thu hẹp phạm vi phổ quát.
- source_word: μάλιστα δὲ
  choice: nhất là
  rationale: Cụm từ nêu một ưu tiên đặc biệt trong mệnh lệnh dành cho tất cả, chứ không loại trừ những người khác.
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: những người thuộc gia đình đức tin
  rationale: οἰκεῖοι là những người thuộc một nhà hay gia đình. Cách dịch giữ hình ảnh gia đình và để “đức tin” xác định cộng đồng ấy mà không biến nó thành một định chế cụ thể.
- source_word: πίστεως
  choice: đức tin
  rationale: Trong ngữ cảnh này, πίστις chỉ đức tin hoặc căn tính chung của cộng đồng tin. “Đức tin” giữ được độ rộng của nguyên ngữ.
theological_decisions:
- issue: Phạm vi và thứ tự ưu tiên của việc làm điều tốt
  choice: Mệnh lệnh hướng đến mọi người, đồng thời dành sự ưu tiên đặc biệt cho những người cùng thuộc cộng đồng đức tin.
  alternative: Chỉ làm điều tốt cho các tín hữu; hoặc không có trách nhiệm đặc biệt nào đối với cộng đồng đức tin.
  rationale: πρὸς πάντας xác lập phạm vi phổ quát, còn μάλιστα nêu sự ưu tiên trong phạm vi ấy. Bản dịch giữ cả hai vế mà không để vế này xóa bỏ vế kia.
- issue: Ý nghĩa của τῆς πίστεως
  choice: Giữ “đức tin” làm đặc điểm xác định gia đình này.
  alternative: Hiểu là “đạo” hay “niềm tin được tuyên xưng chung”; hoặc là “sự trung tín”.
  rationale: Nguyên ngữ cho phép nghe sắc thái cộng đồng được hình thành bởi đức tin, nhưng không buộc phải thu hẹp thành một công thức tín điều hay phẩm chất trung tín.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Gia đình đức tin” giữ hình ảnh οἰκεῖοι nhưng vẫn tự nhiên hơn lối dịch sát chữ “người nhà của đức tin”. Dấu chú thích được đặt ngay sau các cụm từ có phương án dịch đáng lưu ý.
