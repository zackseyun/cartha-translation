revisions:
- from: Vậy, đang khi còn có cơ hội[a], chúng ta hãy làm điều tốt cho mọi người, nhất là cho những người thuộc gia đình đức tin[b].
  to: Vậy, khi có cơ hội[a], chúng ta hãy làm điều tốt cho mọi người, nhất là cho những người trong gia đình đức tin[b].
  rationale: Điều chỉnh tối thiểu để tránh thêm sắc thái “còn” vào καιρός, cải thiện độ tự nhiên của cụm chỉ các thành viên trong “gia đình đức tin,” và làm rõ cách diễn đạt trong chú thích. Phạm vi phổ quát của việc làm điều tốt và ưu tiên dành cho cộng đồng đức tin đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
