id: GAL.6.9
reference: Galatians 6:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: vi
  text: Chúng ta đừng nản lòng khi làm điều tốt[a], vì đến đúng kỳ[b], chúng ta sẽ gặt, nếu chúng ta không kiệt sức[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi làm việc lành” hoặc “khi làm điều cao đẹp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “vào thời điểm thích hợp” hoặc “vào thời điểm riêng của nó.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “không trở nên kiệt sức” hoặc “không lả đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: khi làm điều tốt
  rationale: Cụm tính từ trung tính có mạo từ đi với ποιέω là cách nói chỉ việc làm điều tốt hoặc cao đẹp; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái đạo đức.
- source_word: μὴ ἐγκακῶμεν
  choice: chúng ta đừng nản lòng
  rationale: Động từ nói đến việc mất tinh thần hoặc chùn bước. “Đừng nản lòng” diễn đạt tự nhiên lời khuyên nhủ ở ngôi thứ nhất số nhiều.
- source_word: καιρῷ ... ἰδίῳ
  choice: đến thời điểm thích hợp
  rationale: καιρός chỉ thời điểm hay mùa thích hợp, còn ἴδιος nhấn mạnh tính riêng hoặc đúng của thời điểm ấy; cách dịch không xác định rõ tác nhân ấn định thời gian hơn mức nguyên văn.
- source_word: θερίσομεν
  choice: chúng ta sẽ gặt hái
  rationale: Giữ nguyên hình ảnh nông nghiệp của động từ θερίζω trong ngữ cảnh gieo và gặt.
- source_word: μὴ ἐκλυόμενοι
  choice: nếu không kiệt sức mà bỏ cuộc
  rationale: Phân từ có thể diễn tả sự rã rời, suy kiệt hoặc chùn bước; tiếng Việt cần diễn đạt rõ lực điều kiện trong ngữ cảnh. Cụm này phân biệt với “nản lòng” ở vế đầu nhưng vẫn giữ mối liên hệ giữa kiệt sức và bỏ cuộc.
theological_decisions:
- issue: 'Mối quan hệ giữa hai lời diễn tả sự bền chí: ἐγκακῶμεν và ἐκλυόμενοι'
  choice: Phân biệt bằng “đừng nản lòng” và “không kiệt sức mà bỏ cuộc”.
  alternative: “đừng mệt mỏi” và “không nản chí”; hoặc “đừng mất tinh thần” và “không kiệt sức”.
  rationale: Phao-lô dùng hai động từ gần nghĩa nhưng không đồng nhất. Cách dịch phân biệt chúng, đồng thời không biến lời khuyên bền chí thành một khẳng định giáo lý vượt quá nội dung câu.
- issue: Sắc thái của καιρῷ ἰδίῳ
  choice: “đến thời điểm thích hợp”
  alternative: “đúng kỳ”; hoặc “vào thời điểm riêng của nó”.
  rationale: Nguyên văn nhấn mạnh thời điểm phù hợp hay đúng kỳ nhưng không nói rõ ở đây đó là thời điểm của ai; vì vậy bản dịch tránh bổ sung trực tiếp “của Đức Chúa Trời”, dù ý ấy có thể được suy ra theo thần học rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chúng ta” để thể hiện lời khuyên nhủ bao gồm cả người nói lẫn người nghe; giữ hình ảnh “gặt hái” và đặt đủ các dấu chú thích ngay trong câu.
