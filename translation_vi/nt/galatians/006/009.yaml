- from: Chúng ta đừng nản lòng khi làm điều tốt[a], vì đến thời điểm thích hợp[b], chúng ta sẽ gặt hái, nếu không kiệt sức mà bỏ cuộc[c].
  to: Chúng ta đừng nản lòng khi làm điều tốt[a], vì đến đúng kỳ[b], chúng ta sẽ gặt, nếu chúng ta không kiệt sức[c].
  rationale: 'Sửa riêng vế điều kiện để loại bỏ quan hệ đối lập không có trong nguyên văn. Bản sửa giữ sự phân biệt tu từ: ἐγκακῶμεν là “đừng nản lòng”, còn ἐκλυόμενοι là “không kiệt sức”; đồng thời duy trì hình ảnh gieo–gặt và tính không xác định về tác nhân của thời điểm thích hợp.'
