review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp nhìn chung phản ánh đúng cấu trúc và hình ảnh của nguyên văn: lời khuyên ở ngôi thứ nhất số nhiều, việc làm điều tốt, thời điểm đúng kỳ, và hình ảnh gặt. Tuy nhiên, “nếu không kiệt sức mà bỏ cuộc” đặt “kiệt sức” và “bỏ cuộc” trong quan hệ đối lập bằng “mà”, khiến nghĩa tiếng Việt thành ‘không kiệt sức nhưng lại bỏ cuộc’, trái với ý điều kiện của μὴ ἐκλυόμενοι. Cần sửa để diễn đạt trực tiếp điều kiện ‘nếu chúng ta không kiệt sức/lả đi’.'
  naturalness: “Đến đúng kỳ” tự nhiên, gọn và giữ sắc thái thời điểm thích hợp. “Sẽ gặt” giữ ẩn dụ nông nghiệp trực tiếp hơn “gặt hái”. Câu sửa có nhịp văn hiện đại, rõ ràng và trang trọng vừa phải.
  terminology: “Điều tốt” phù hợp với τὸ καλόν trong ngữ cảnh đạo đức mà không thu hẹp thành thuật ngữ tôn giáo. “Đừng nản lòng” và “không kiệt sức” phân biệt hợp lý hai động từ liên hệ ἐγκακέω và ἐκλύω. Không bổ sung tác nhân ấn định ‘đúng kỳ’.
  issues:
  - severity: medium
    issue: Cụm điều kiện cuối câu dùng liên từ “mà” sai quan hệ nghĩa.
    rationale: “Nếu không kiệt sức mà bỏ cuộc” trong tiếng Việt thường hiểu là không kiệt sức nhưng vẫn bỏ cuộc. Nguyên văn μὴ ἐκλυόμενοι là điều kiện phủ định, chỉ việc không trở nên kiệt sức/lả đi, không phải sự tương phản với hành động bỏ cuộc.
