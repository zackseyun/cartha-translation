id: GAL.6.14
reference: Galatians 6:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: vi
  text: Còn tôi, tôi quyết chẳng khoe khoang về điều gì, ngoại trừ thập tự giá của Chúa Giê-su, Đấng Mê-si-a, là Chúa chúng ta[a]. Nhờ thập tự giá ấy[b], thế gian đã bị đóng đinh đối với tôi, và tôi đối với thế gian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: “Giê-su Christos”; Christos là tước hiệu tương ứng với “Đấng Mê-si-a”, nghĩa là “Đấng được xức dầu”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “nhờ Ngài”, nếu đại từ quan hệ chỉ về Chúa Giê-su, Đấng Mê-si-a, thay vì về “thập tự giá”.'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: tôi quyết không
  rationale: Diễn đạt tự nhiên trong tiếng Việt sự bác bỏ mạnh mẽ của thức cầu khiến, đồng thời giữ sắc thái đích thân của ἐμοί.
- source_word: καυχᾶσθαι
  choice: khoe mình
  rationale: Giữ động từ chủ chốt của Phao-lô và phù hợp với sự tương phản trong văn cảnh về điều con người lấy làm lý do để tự hào.
- source_word: εἰ μὴ ἐν
  choice: ngoại trừ khoe về
  rationale: Nêu rõ thập tự giá là nền tảng duy nhất cho sự khoe mình; việc lặp lại 'khoe' giúp câu tiếng Việt sáng nghĩa.
- source_word: σταυρῷ
  choice: thập tự giá
  rationale: Cách gọi quen thuộc, trang trọng và chính xác trong tiếng Việt đối với σταυρός trong văn cảnh sự đóng đinh.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch tiêu chuẩn của κύριος trong danh xưng Tân Ước.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Chuyển Χριστός theo nghĩa tước hiệu 'Đấng Mê-si', còn Jêsus là tên riêng; cách đặt đồng vị làm rõ tước hiệu trong tiếng Việt.
- source_word: δι’ οὗ
  choice: nhờ thập tự giá ấy
  rationale: Đại từ quan hệ giống đực số ít có thể quy chiếu gần nhất về σταυρῷ; 'nhờ' giữ ý nghĩa phương tiện, còn danh từ được nhắc lại để tránh đại từ vô sinh khó hiểu trong tiếng Việt.
- source_word: κόσμος
  choice: thế gian
  rationale: Từ tương đương quen thuộc, đủ rộng để giữ sắc thái thế giới và trật tự thế gian đang đối nghịch với Đức Chúa Trời mà không diễn giải quá mức.
- source_word: ἐσταύρωται
  choice: đã bị đóng đinh
  rationale: Giữ hình ảnh đóng đinh và thể bị động; 'đã' diễn đạt hành động hoàn tất với kết quả còn hiệu lực.
- source_word: κἀγὼ κόσμῳ
  choice: và tôi đối với thế gian
  rationale: Giữ phép tỉnh lược động từ và cấu trúc song song cô đọng của nguyên văn, nhưng vẫn dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός vẫn mang nội dung tước hiệu trong danh xưng này; dịch nghĩa giúp người đọc nhận ra ý niệm về Đấng được xức dầu mà không thêm lập trường hệ phái.
- issue: Tiền ngữ của δι’ οὗ
  choice: 'thập tự giá: ''nhờ thập tự giá ấy'''
  alternative: 'Chúa Jêsus, Đấng Mê-si: ''nhờ Ngài'''
  rationale: σταυρῷ là tiền ngữ gần nhất và phù hợp về ngữ pháp, nên được ưu tiên trong chính văn; tuy vậy, vì các danh từ liên quan đều giống đực số ít trong tiếng Hy Lạp, khả năng quy chiếu về Chúa Jêsus, Đấng Mê-si được bảo lưu trong chú thích.
- issue: Mối quan hệ đôi bên với thế gian
  choice: giữ phép ẩn dụ đóng đinh và phép tỉnh lược
  alternative: diễn giải rằng thế gian không còn quyền lực đối với Phao-lô và ông cũng đã chết đối với thế gian
  rationale: Nguyên văn cố ý dùng hình ảnh nghịch lý, cô đọng; diễn giải ý nghĩa thần học ngay trong câu sẽ làm mất sức căng và độ mở của lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cụm 'về phần tôi, tôi quyết không' tái hiện lời bác bỏ mạnh mẽ mà không dùng lối cổ khó hiểu. Chính văn giữ hình ảnh 'đóng đinh đối với' để bảo toàn phép ẩn dụ và thế song song của câu Hy Lạp.
