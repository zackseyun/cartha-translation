source:
  edition: SBLGNT
  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: vi
  text: Nhưng mỗi người hãy xem xét công việc của mình; rồi người ấy sẽ có lý do để tự hào về chính mình mà thôi, chứ không về người khác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργον
  choice: việc mình làm
  rationale: Cách diễn đạt rộng và tự nhiên, chỉ công việc hay hành vi của mỗi người trong ngữ cảnh tự xem xét.
- source_word: δοκιμαζέτω
  choice: hãy tự xem xét
  rationale: Diễn đạt mệnh lệnh kiểm tra, đánh giá phẩm chất việc làm của chính mình mà không mặc nhiên cho rằng kết quả là tốt.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: 'Giữ rõ ý phân phối: từng cá nhân phải xem xét chính mình.'
- source_word: εἰς ἑαυτὸν μόνον
  choice: về chính mình mà thôi
  rationale: Giữ trọng tâm phản thân và sức hạn định của μόνον, đồng thời phù hợp tự nhiên với ý đối lập việc so sánh người khác.
- source_word: καύχημα
  choice: lý do để tự hào
  rationale: Truyền đạt khả năng từ này chỉ cơ sở hay lý do của sự tự hào, chứ không chỉ hành vi khoe mình.
- source_word: τὸν ἕτερον
  choice: người khác
  rationale: Làm rõ ἕτερον nói đến một người khác được đem ra đối chiếu với chính mình.
- source_word: δέ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với câu trước.
theological_decisions:
- issue: Ý nghĩa của καύχημα trong văn mạch Phao-lô
  choice: Dịch là “lý do để tự hào,” giữ ý về cơ sở của sự tự hào.
  alternative: “điều để khoe mình” hoặc “niềm tự hào”
  rationale: Không áp đặt rằng sự tự hào này nhất thiết đáng khen hay đáng trách; trọng tâm câu là tự xem xét thay vì dựa trên sự so sánh.
- issue: Quan hệ của εἰς với τὸν ἕτερον
  choice: Diễn đạt “khi so với người khác.”
  alternative: “về người khác”
  rationale: Trong thế đối xứng εἰς ἑαυτόν ... οὐκ εἰς τὸν ἕτερον, ý tự đánh giá đối lập với việc lấy người khác làm điểm quy chiếu; cách dịch này nêu rõ quan hệ ấy mà không thêm một phán quyết thần học.
- issue: Chủ thể số ít có ý khái quát
  choice: Dùng “mỗi người” và “người ấy.”
  alternative: Dùng đại từ mang giới tính như “người nam ấy/anh ta.”
  rationale: Giống đực trong tiếng Hy Lạp có lực khái quát ở đây; tiếng Việt tự nhiên không cần gán giới tính cho đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tự xem xét” để nhấn mạnh đối tượng là việc làm của chính mình; dùng “người ấy” nhằm giữ số ít mà không tạo sắc thái giới tính không có ý nghĩa trong ngữ cảnh.
