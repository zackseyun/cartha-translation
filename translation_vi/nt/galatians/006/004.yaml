revisions:
- from: Nhưng mỗi người hãy tự xem xét việc mình làm; rồi người ấy sẽ có lý do để tự hào về chính mình mà thôi, chứ không phải khi so với người khác.
  to: Nhưng mỗi người hãy xem xét công việc của mình; rồi người ấy sẽ có lý do để tự hào về chính mình mà thôi, chứ không về người khác.
  rationale: Điều chỉnh tối thiểu để giữ rõ cấu trúc đối xứng của εἰς ἑαυτὸν μόνον ... οὐκ εἰς τὸν ἕτερον, không biến vế sau thành một mệnh đề diễn giải về hành vi so sánh. Thay “việc mình làm” bằng “công việc của mình” nhằm phản ánh trực tiếp và tự nhiên τὸ ἔργον ἑαυτοῦ.
  reviewer_model: gpt-5.6-terra
