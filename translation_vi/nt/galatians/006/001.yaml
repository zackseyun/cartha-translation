    rationale: 'Nguyên văn nối σκοπῶν σεαυτόν trực tiếp với mệnh lệnh καταρτίζετε: người phục hồi phải đồng thời tự cảnh giác. Không có δέ hay liên từ tương phản tương đương “nhưng”; số ít có thể được diễn đạt phân phối trong tiếng Việt bằng “tự coi chừng mình”.'
