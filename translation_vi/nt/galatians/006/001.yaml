id: GAL.6.1
reference: Galatians 6:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: vi
  text: Thưa anh chị em[a], ngay cả khi một người nào bị vướng vào một lỗi phạm[b], thì anh chị em là những người thuộc linh hãy phục hồi người ấy với tinh thần dịu dàng[c], đồng thời tự coi chừng mình, kẻo chính mình cũng bị cám dỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng danh từ số nhiều giống đực, có thể dùng để gọi một nhóm tín hữu gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị bắt gặp trong một lỗi phạm”, “bị một lỗi phạm lấn át” hoặc “bất ngờ bị vướng vào một lỗi phạm”.'
    reason: alternative_reading
  - marker: c
    text: “Tinh thần” ở đây có thể chỉ thái độ dịu dàng của con người; trong văn mạch, cụm từ cũng có thể gợi đến sự dịu dàng do Thánh Linh tạo nên.
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Thưa anh chị em
  rationale: Trong cách dùng thư tín của Phao-lô, danh từ số nhiều giống đực này thường gọi toàn thể cộng đồng tín hữu. Tiếng Việt tự nhiên cần nêu cả nam lẫn nữ; “anh chị em” diễn đạt đúng đối tượng quy chiếu mà không làm câu nặng nề.
- source_word: ἐὰν καὶ
  choice: ngay cả khi
  rationale: Giữ sắc thái điều kiện có tính nhượng bộ của tổ hợp từ.
- source_word: προλημφθῇ
  choice: bị vướng vào
  rationale: Động từ có thể gợi ý một người bị lỗi lầm lấn át hoặc bất ngờ chụp lấy, chứ không chỉ bị người khác bắt quả tang. Cách dịch này tự nhiên và duy trì sắc thái bị động; chú thích bảo lưu các khả năng khác.
- source_word: ἄνθρωπος
  choice: có người
  rationale: ἄνθρωπος ở đây là danh từ chỉ người theo nghĩa khái quát, không nhất thiết xác định giới tính; “có người” là cách diễn đạt tự nhiên, chính xác trong tiếng Việt.
- source_word: ἔν τινι παραπτώματι
  choice: vào một sự vi phạm
  rationale: παράπτωμα chỉ một bước sai, lỗi phạm hay sự vi phạm đạo đức. “Sự vi phạm” giữ mức độ nghiêm túc và τινι được thể hiện bằng “một”.
- source_word: οἱ πνευματικοὶ
  choice: anh chị em là những người thuộc linh
  rationale: 'Giữ cách diễn đạt rộng của tính từ danh từ hóa: những người được đặc trưng bởi đời sống thuộc linh, có thể liên hệ với Thánh Linh trong văn mạch mà không đồng nhất rõ ràng với một cách giải thích duy nhất.'
- source_word: καταρτίζετε
  choice: hãy phục hồi
  rationale: Mệnh lệnh hiện tại kêu gọi đưa người phạm lỗi trở lại tình trạng đúng đắn; “phục hồi” bao hàm việc sửa lại và gây dựng, không mang sắc thái trừng phạt.
- source_word: τὸν τοιοῦτον
  choice: người ấy
  rationale: Quy chiếu tự nhiên trong tiếng Việt đến người vừa được nhắc tới, đồng thời giữ trọng tâm số ít.
- source_word: ἐν πνεύματι πραΰτητος
  choice: bằng tinh thần dịu dàng
  rationale: “Tinh thần” có thể chỉ thái độ nội tâm, đồng thời vẫn để ngỏ âm hưởng về công việc của Thánh Linh; “dịu dàng” diễn đạt πραΰτης bằng ngôn ngữ hiện đại, trang trọng.
- source_word: σκοπῶν σεαυτόν
  choice: Nhưng mỗi người phải coi chừng chính mình
  rationale: Phân từ số ít chuyển lời cảnh báo từ cộng đồng sang từng cá nhân. Tách thành câu ngắn và thêm “mỗi người” làm rõ sự chuyển số trong tiếng Việt; “nhưng” nêu sự tương phản hàm ý giữa phục hồi người khác và tự canh giữ.
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: kẻo chính mình cũng bị cám dỗ
  rationale: Giữ cấu trúc cảnh báo, sắc thái “cũng” và sự nhấn mạnh vào chính người đang phục hồi. Trong văn mạch đạo đức, “bị cám dỗ” phù hợp hơn “bị thử thách”.
theological_decisions:
- issue: Đối tượng của Ἀδελφοί và giới tính của ἄνθρωπος
  choice: Dịch “anh chị em” và “có người”.
  alternative: “anh em” và “một người nam”.
  rationale: Giống ngữ pháp Hy Lạp không buộc ἄνθρωπος khái quát phải chỉ nam giới, còn ἀδελφοί có thể gọi một cộng đồng gồm cả nam lẫn nữ. Bản dịch tiếng Việt nêu đúng đối tượng quy chiếu, với chú thích cho biết hình thức nguyên ngữ.
- issue: Sắc thái của προλημφθῇ
  choice: Dịch “bị vướng vào”, kèm chú thích về các nghĩa có thể có.
  alternative: “bị bắt gặp” hoặc “bị lỗi lầm lấn át/bất ngờ chụp lấy”.
  rationale: Nguyên ngữ có thể nói đến việc bị phát hiện trong lỗi phạm hoặc bị lỗi phạm lấn át. Không nên âm thầm quyết định chỉ một khả năng.
- issue: Ý nghĩa của πνεῦμα trong ἐν πνεύματι πραΰτητος
  choice: Dịch “bằng tinh thần dịu dàng”.
  alternative: “trong sự dịu dàng do Thánh Linh ban”.
  rationale: Cụm từ có thể nhấn mạnh tâm thế con người, nhưng trong văn mạch Ga-la-ti cũng có âm hưởng của bông trái Thánh Linh. Cách dịch chính giữ được độ mở này.
- issue: πειρασθῇς là cám dỗ hay thử thách
  choice: Dịch “bị cám dỗ”.
  alternative: “bị thử thách”.
  rationale: Lời cảnh báo người sửa trị có thể sa vào lỗi phạm tương tự khiến nghĩa đạo đức “cám dỗ” nổi trội, dù động từ tự thân có thể mang cả hai nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời gọi “Thưa anh chị em” phù hợp thư tín và cộng đồng hội thánh. Cấu trúc được chia thành hai câu để thể hiện tự nhiên sự chuyển từ mệnh lệnh số nhiều sang lời cảnh báo số ít trong nguyên ngữ.
