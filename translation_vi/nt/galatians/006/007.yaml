language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: vi
  text: 'Đừng bị lừa dối: Đức Chúa Trời không bị khinh nhạo; vì bất cứ điều gì một người[a] gieo, người ấy cũng sẽ gặt điều đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Một người” ở đây chỉ một con người bất kỳ, đại diện cho mọi người nói chung.
    reason: Làm rõ nghĩa đại diện, phổ quát của danh từ số ít ἄνθρωπος.
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: Anh em đừng để mình bị lừa dối
  rationale: Động từ ở thể mệnh lệnh hiện tại, bị động, ngôi thứ hai số nhiều. Cách dịch này giữ sắc thái bị động và làm rõ đối tượng số nhiều bằng “anh em”, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi quen thuộc, trang trọng trong tiếng Việt dành cho θεός khi chỉ Đức Chúa Trời duy nhất.
- source_word: οὐ μυκτηρίζεται
  choice: không phải là Đấng để người ta khinh nhạo
  rationale: μυκτηρίζω diễn tả hành động chế nhạo với thái độ khinh miệt. Cấu trúc tiếng Việt này truyền đạt tự nhiên sức nặng của lời khẳng định bị động mà không thêm ý rằng con người chưa từng tìm cách nhạo báng Đức Chúa Trời.
- source_word: ὃ γὰρ ἐὰν
  choice: Vì ... điều gì
  rationale: Cấu trúc đại từ quan hệ bất định nêu một nguyên tắc phổ quát; “điều gì” kết hợp với mệnh đề sau diễn đạt rõ ý “bất cứ điều gì” trong tiếng Việt.
- source_word: σπείρῃ
  choice: gieo
  rationale: Giữ nguyên hình ảnh nông nghiệp và sự tương ứng trực tiếp với “gặt” ở cuối câu.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Danh từ số ít mang nghĩa đại diện cho con người nói chung. “Một người” giữ số ít và tính phổ quát mà không giới hạn nguyên tắc này vào nam giới.
- source_word: τοῦτο καὶ θερίσει
  choice: thì cũng sẽ gặt điều ấy
  rationale: “Điều ấy” giữ lực chỉ định của τοῦτο, còn “cũng” thể hiện καί và nhấn mạnh sự tương ứng chính xác giữa điều được gieo với điều sẽ gặt.
theological_decisions:
- issue: Ý nghĩa của οὐ μυκτηρίζεται
  choice: Đức Chúa Trời không phải là Đấng để người ta khinh nhạo
  alternative: Đức Chúa Trời không bị khinh nhạo
  rationale: Cách chọn giữ lời cảnh báo rằng sự khinh nhạo của con người không thể làm Đức Chúa Trời trở thành đối tượng bị coi thường hay thoát khỏi hậu quả, nhưng không biến câu này thành một khẳng định rằng không ai từng nhạo báng Ngài.
- issue: Giống và phạm vi của ἄνθρωπος
  choice: một người
  alternative: một người nam
  rationale: Trong ngữ cảnh, ἄνθρωπος là danh từ số ít đại diện, nêu nguyên tắc áp dụng cho mọi người. Tiếng Việt không bắt buộc đánh dấu giống ở “người”, nên “một người” vừa sát nghĩa vừa tránh thu hẹp phạm vi của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Cặp từ “gieo—gặt” được giữ nguyên để bảo toàn hình ảnh và nhịp điệu châm ngôn. Đại từ “anh em” biểu thị ngôi thứ hai số nhiều trong lời khuyên gửi cộng đồng, không nhằm giới hạn người nghe theo giới tính.
