  yaml_path: translation/nt/galatians/006/006.yaml
  text: Let the one who is taught the word share in all good things with the one who teaches.
translation:
  language: vi
  text: Người được dạy về lời Chúa hãy chia sẻ mọi điều tốt lành với người dạy mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy cho người dạy mình được cùng hưởng mọi điều tốt lành”; điều này có lẽ bao gồm cả sự hỗ trợ vật chất.'
    reason: Giữ lại sắc thái khác của κοινωνέω và ἐν πᾶσιν ἀγαθοῖς, đồng thời cho biết ý nghĩa thực tiễn có khả năng được hàm chứa.
lexical_decisions:
- source_word: Κοινωνείτω
  choice: hãy chia sẻ
  rationale: Động từ mệnh lệnh hiện tại diễn tả một việc cần được thực hành liên tục. “Chia sẻ” giữ được nghĩa rộng của κοινωνέω, bao gồm sự hỗ trợ thiết thực mà không giới hạn vào tiền bạc.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: δέ chỉ đánh dấu sự chuyển ý nhẹ. Trong tiếng Việt, bỏ từ nối ở đây tự nhiên hơn và không làm mất nội dung.
- source_word: ὁ κατηχούμενος τὸν λόγον
  choice: người được dạy lời Chúa
  rationale: Cách dịch này thể hiện phân từ bị động chỉ người đang nhận sự giáo huấn. “Lời Chúa” diễn đạt tự nhiên trong tiếng Việt rằng λόγος ở đây là sứ điệp được giảng dạy, chứ không chỉ là một từ đơn lẻ.
- source_word: τῷ κατηχοῦντι
  choice: với người dạy mình
  rationale: Phân từ chủ động chỉ người thực hiện việc dạy. “Mình” làm rõ quan hệ giữa người học và người dạy mà tiếng Hy Lạp đã thể hiện qua hai phân từ tương ứng.
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: mọi điều tốt lành
  rationale: Cụm từ có phạm vi rộng, có thể bao gồm của cải vật chất và những hình thức hỗ trợ thiết thực khác. Cấu trúc tiếng Việt với “chia sẻ” không cần dịch máy móc giới từ ἐν.
theological_decisions:
- issue: Bản chất của việc chia sẻ được truyền dạy
  choice: Lời truyền dạy yêu cầu người học chia sẻ mọi điều tốt lành với người dạy, có thể bao gồm sự hỗ trợ vật chất.
  alternative: Chỉ sự thông công thuộc linh nói chung, không bao gồm hỗ trợ vật chất.
  rationale: κοινωνέω đi với người nhận ở cách dữ cách và cụm “mọi điều tốt lành” nghiêng về sự chia sẻ thiết thực, nhưng lời văn vẫn đủ rộng để không thu hẹp mệnh lệnh chỉ còn việc chu cấp tiền bạc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu mệnh lệnh dùng “hãy”; tránh thuật ngữ giáo hội chuyên biệt và không thu hẹp “mọi điều tốt lành” thành riêng tiền bạc.
