id: GAL.6.12
reference: Galatians 6:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: vi
  text: Những ai muốn tỏ ra tốt đẹp về phương diện xác thịt[a], chính những người ấy đang ép anh chị em phải chịu cắt bì, chỉ để họ khỏi bị bắt bớ vì thập tự giá[b] của Đấng Mê-si[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tạo ấn tượng tốt về bề ngoài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “bị bắt bớ liên quan đến thập tự giá của Đấng Mê-si.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cách dịch truyền thống: “Đấng Christ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: Những kẻ
  rationale: Chỉ toàn bộ một hạng người; trong ngữ cảnh quở trách, “những kẻ” tự nhiên và giữ được sắc thái phê phán.
- source_word: θέλουσιν
  choice: muốn
  rationale: Diễn đạt trực tiếp ý muốn, phù hợp tiếng Việt hiện đại.
- source_word: εὐπροσωπῆσαι
  choice: phô bày vẻ tốt đẹp
  rationale: Diễn tả việc cố tạo một diện mạo hay ấn tượng đáng khen trước người khác, đồng thời giữ sắc thái phô trương bề ngoài.
- source_word: ἐν σαρκί
  choice: theo xác thịt
  rationale: Giữ thuật ngữ thần học giàu nghĩa của Phao-lô, nhưng dùng “theo” để cụm từ tự nhiên hơn trong tiếng Việt; chú thích nêu rõ nét nghĩa bề ngoài.
- source_word: οὗτοι
  choice: chính là những kẻ
  rationale: 'Giữ sự nhấn mạnh của đại từ chỉ định: chính những người ấy đang gây sức ép.'
- source_word: ἀναγκάζουσιν
  choice: đang ép
  rationale: Truyền đạt rõ sự cưỡng ép và sắc thái hành động đang tiếp diễn của thì hiện tại.
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: anh chị em phải chịu cắt bì
  rationale: Giữ nghĩa bị động và hành động cụ thể; “anh chị em” diễn đạt số nhiều cộng đồng một cách tự nhiên, bao quát.
- source_word: μόνον ἵνα
  choice: chỉ để
  rationale: Diễn đạt ngắn gọn mục đích duy nhất mà Phao-lô quy cho họ.
- source_word: τῷ σταυρῷ
  choice: vì thập tự giá
  rationale: Cách hiểu nguyên nhân hoặc căn cứ của sự bắt bớ phù hợp với cách dùng cách dữ liệu ở đây và tự nhiên trong tiếng Việt.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  rationale: Χριστός ở đây vẫn có lực của tước hiệu; “Đấng Mê-si” truyền đạt nghĩa được xức dầu thay vì chỉ phiên âm.
- source_word: μὴ διώκωνται
  choice: họ khỏi bị bắt bớ
  rationale: Giữ thể bị động và ý tránh né trong mệnh đề mục đích.
theological_decisions:
- issue: Nghĩa của ἐν σαρκί
  choice: theo xác thịt
  alternative: về bề ngoài
  rationale: Bản chính giữ cụm từ mang sức nặng thần học và sự nhập nhằng trong cách dùng của Phao-lô; chú thích giúp độc giả nhận ra rằng ở đây trọng tâm có thể là diện mạo và dấu hiệu thân thể bên ngoài.
- issue: Cách dịch Χριστοῦ trong τῷ σταυρῷ τοῦ Χριστοῦ
  choice: của Đấng Mê-si
  alternative: của Đấng Christ
  rationale: Trong cụm sở hữu này, ý nghĩa tước hiệu vẫn nổi bật; chọn “Đấng Mê-si” để chuyển tải nghĩa, đồng thời ghi cách gọi truyền thống trong chú thích.
- issue: Quan hệ của τῷ σταυρῷ với διώκωνται
  choice: bị bắt bớ vì thập tự giá
  alternative: bị bắt bớ liên quan đến thập tự giá
  rationale: Cách dữ liệu có thể chỉ nguyên nhân hoặc phạm vi liên hệ. “Vì” là cách diễn đạt tự nhiên nhất nhưng vẫn không xác định thêm thập tự giá gây ra sự bắt bớ theo cơ chế nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμᾶς; giữ “xác thịt” để bảo toàn thuật ngữ của Phao-lô, kèm chú thích làm sáng tỏ nghĩa theo ngữ cảnh.
