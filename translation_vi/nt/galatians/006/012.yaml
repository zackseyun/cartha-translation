revisions:
- from: Những kẻ muốn phô bày vẻ tốt đẹp theo xác thịt[a] chính là những kẻ đang ép anh chị em phải chịu cắt bì, chỉ để họ khỏi bị bắt bớ vì thập tự giá của Đấng Mê-si[b].
  to: Những ai muốn tỏ ra tốt đẹp về phương diện xác thịt[a], chính những người ấy đang ép anh chị em phải chịu cắt bì, chỉ để họ khỏi bị bắt bớ vì thập tự giá[b] của Đấng Mê-si[c].
  rationale: Bản sửa thay cụm từ không tự nhiên bằng cách diễn đạt rõ và tự nhiên hơn, đồng thời vẫn giữ “xác thịt” trong bản văn chính. Cấu trúc “Những ai …, chính những người ấy …” phản ánh cả ὅσοι lẫn οὗτοι. Chú thích về “thập tự giá” bảo toàn khả năng hiểu cách dữ liệu là quan hệ/liên hệ, thay vì chỉ xác định nó là nguyên nhân.
  reviewer_model: gpt-5.6-terra
