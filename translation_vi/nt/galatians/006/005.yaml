    rationale: Cụm này nghe như thuật ngữ kỹ thuật về vận tải và không phù hợp với hình ảnh mang/vác của φορτίον. Yếu tố “phần” cũng có thể gợi một phần chia định lượng, vượt quá điều câu Hy Lạp trực tiếp nói.
  - severity: low
    issue: Chú thích hiện tại nêu “sẽ mang gánh của riêng mình” như một phương án thay thế, trong khi đây nên là bản dịch chính tự nhiên hơn.
    rationale: Khi sửa bản văn chính thành “gánh,” chú thích cần chuyển thành ghi chú từ vựng để vẫn làm rõ sự khác biệt với βάρη ở câu 2.
