  text: ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/005.yaml
  text: For each one will carry his own load[a].
translation:
  language: vi
  text: Vì mỗi người sẽ mang gánh của riêng mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp φορτίον (“gánh”) ở đây khác với βάρη (“những gánh nặng”) trong câu 2.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Đại từ phân phối số ít, nhấn mạnh từng cá nhân; “mỗi người” tự nhiên và giữ rõ sắc thái ấy trong tiếng Việt.
- source_word: γὰρ
  choice: vì
  rationale: Liên từ giải thích nối mệnh đề này với văn cảnh trước; “vì” giữ quan hệ lập luận mà không diễn giải quá mức.
- source_word: τὸ ἴδιον
  choice: của riêng mình
  rationale: ἴδιος nhấn mạnh điều thuộc về chính từng người. Tiếng Việt không cần đánh dấu giống và “của riêng mình” giữ được tính phản thân, cá nhân.
- source_word: φορτίον
  choice: phần tải
  rationale: φορτίον chỉ vật hoặc phần phải mang. “Phần tải” phân biệt từ này với βάρη (“gánh nặng”) ở câu 2, đồng thời gợi phần mà mỗi người phải tự mang; cách nói hơi cụ thể nhưng vẫn dễ hiểu.
- source_word: βαστάσει
  choice: sẽ mang
  rationale: Động từ chỉ hành động mang/vác ở thì tương lai. “Sẽ mang” tự nhiên, cụ thể và kết hợp phù hợp với “phần tải”.
theological_decisions:
- issue: Mối liên hệ giữa Ga-la-ti 6:5 và 6:2
  choice: Giữ sự phân biệt từ vựng giữa “gánh nặng” ở câu 2 và “phần tải” tại đây, không hóa giải căng thẳng trong bản dịch.
  alternative: Dùng “gánh nặng” ở cả hai câu, hoặc diễn giải câu 5 rõ thành trách nhiệm cá nhân hay sự khai trình trong ngày phán xét.
  rationale: Phao-lô dùng hai danh từ khác nhau trong cùng văn cảnh. Bản dịch nên giữ ý vừa giúp mang gánh nặng cho nhau vừa để mỗi người mang phần thuộc về mình, nhưng không áp đặt một cách dung hòa thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Phần tải” được chọn để bảo tồn sự phân biệt từ vựng trong nguyên văn; chú thích cung cấp cách dịch quen thuộc hơn là “gánh”.
