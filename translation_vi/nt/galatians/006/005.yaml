  terminology: Dùng “gánh” cho φορτίον và giữ “gánh nặng” cho βάρη trong chú thích bảo toàn sự khác biệt từ vựng có ý nghĩa trong văn mạch, nhưng không buộc người đọc vào một cách giải thích thần học cụ thể.
