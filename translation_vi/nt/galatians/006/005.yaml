  source_fidelity: 'Bản nháp giữ đúng cấu trúc cơ bản của câu Hy Lạp: γάρ là lời giải thích, ἕκαστος mang sắc thái phân phối, và βαστάσει là tương lai. Tuy nhiên, “phần tải” không phải là cách gọi tự nhiên cho φορτίον trong tiếng Việt và thêm sắc thái “phần” không được nêu minh nhiên trong câu.'
