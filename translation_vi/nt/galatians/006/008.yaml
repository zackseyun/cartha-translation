id: GAL.6.8
reference: Galatians 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: vi
  text: Vì ai gieo cho xác thịt mình[a] sẽ gặt sự hư hoại[b] từ xác thịt; còn ai gieo cho Thánh Linh[c] sẽ gặt sự sống đời đời từ Thánh Linh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “bản tính tội lỗi của chính mình”. Từ Hy Lạp sarx có thể chỉ xác thịt theo nghĩa đen hoặc, trong những tương phản luân lý của Phao-lô, khuynh hướng sa ngã của con người chống nghịch Thánh Linh.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự hủy hoại” hoặc “sự suy tàn”. Từ này có thể chỉ sự hư hoại, đổ nát hoặc suy tàn.
    reason: lexical_alternative
  - marker: c
    text: Tức là Thánh Linh của Đức Chúa Trời. Từ Hy Lạp này cũng có thể được dịch là “thần linh” (viết thường), nhưng trong thư Ga-la-ti, sự tương phản này thường nói đến Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này giải thích và làm nền tảng cho lời khuyên ở câu trước; “Vì” truyền đạt tự nhiên quan hệ ấy trong tiếng Việt.
- source_word: ὁ σπείρων
  choice: người gieo
  rationale: Phân từ hiện tại có mạo từ mang nghĩa khái quát; cách dịch này giữ hình ảnh gieo gặt và sắc thái như một nguyên tắc phổ quát.
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: cho xác thịt của chính mình
  rationale: “Cho” diễn đạt hướng hoặc đối tượng của việc gieo; “xác thịt” giữ thuật ngữ giàu sức gợi của Phao-lô, còn “của chính mình” bảo toàn sự nhấn mạnh phản thân của ἑαυτοῦ.
- source_word: ἐκ τῆς σαρκὸς
  choice: từ xác thịt
  rationale: ἐκ chỉ nguồn phát sinh; “từ” vừa tự nhiên vừa giữ thế song song với “từ Thánh Linh”.
- source_word: θερίσει
  choice: sẽ ... gặt lấy
  rationale: Giữ nguyên ẩn dụ nông nghiệp tương ứng với “gieo”; “lấy” làm câu tiếng Việt tự nhiên mà không thêm ý nghĩa mới.
- source_word: φθοράν
  choice: sự hư nát
  rationale: Từ này có thể chỉ sự hư hoại, suy tàn hoặc diệt vong. “Sự hư nát” giữ được phạm vi nghĩa rộng và không thu hẹp câu vào sự phân rã thể chất hay sự tiêu diệt.
- source_word: ὁ δὲ σπείρων
  choice: còn người gieo
  rationale: “Còn” thể hiện sự tương phản của δέ và duy trì kết cấu cân xứng giữa hai vế.
- source_word: εἰς τὸ πνεῦμα
  choice: cho Thánh Linh
  rationale: Trong mạch đối lập giữa σάρξ và πνεῦμα của thư Ga-la-ti, πνεῦμα rất có khả năng chỉ Thánh Linh của Đức Chúa Trời.
- source_word: ἐκ τοῦ πνεύματος
  choice: từ Thánh Linh
  rationale: “Từ” biểu thị nguồn và giữ sự đối xứng chính xác với “từ xác thịt”.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Đây là cách diễn đạt quen thuộc, tự nhiên và chính xác trong tiếng Việt cho sự sống thuộc thời đại sắp đến và không cùng tận.
theological_decisions:
- issue: Nghĩa của σάρξ trong sự đối lập luân lý của Phao-lô
  choice: xác thịt
  alternative: bản tính tội lỗi
  rationale: Ngữ cảnh có sắc thái luân lý, nhưng “xác thịt” bảo tồn từ ngữ và sự căng thẳng thần học của Phao-lô, thay vì giải thích sẵn nó thành một khái niệm hẹp hơn.
- issue: Đối tượng được πνεῦμα chỉ đến
  choice: Thánh Linh
  alternative: tâm linh
  rationale: Trong thư Ga-la-ti, đặc biệt khi đối lập với xác thịt, πνεῦμα thường chỉ Thánh Linh của Đức Chúa Trời. Tuy vậy, chữ Hy Lạp tự nó không viết hoa, nên ghi chú nêu cách hiểu khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc đối xứng “gieo… từ… gặt” cùng thuật ngữ “xác thịt” để bảo toàn hình ảnh và chiều sâu thần học của nguyên bản. Các dấu chú thích đều xuất hiện trong chính văn.
