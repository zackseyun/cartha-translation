- from: Hãy xem tôi đã tự tay viết cho anh chị em bằng những chữ lớn thế nào.[a]
  to: Hãy xem những chữ tôi đã viết cho anh chị em bằng chính tay mình lớn biết bao.[a]
  rationale: Sửa trật tự từ để “lớn biết bao” bổ nghĩa minh bạch cho “những chữ,” phù hợp với cách hiểu chính của πηλίκοις γράμμασιν. Đồng thời thay “tự tay” bằng “bằng chính tay mình” để thể hiện rõ hơn công cụ và tính nhấn mạnh của τῇ ἐμῇ χειρί. Chú thích được chỉnh câu chữ để giữ đầy đủ cùng trật tự các thành phần của nguyên văn trong cách hiểu thay thế.
