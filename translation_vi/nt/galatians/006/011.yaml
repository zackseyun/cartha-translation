  yaml_path: translation/nt/galatians/006/011.yaml
  text: See with what large letters I have written to you with my own hand[a].
translation:
  language: vi
  text: Hãy xem những chữ tôi đã viết cho anh chị em bằng chính tay mình lớn biết bao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy xem bức thư tôi đã viết cho anh chị em bằng chính tay mình dài biết bao.”'
    reason: Giữ lại cách hiểu khác có cơ sở của cụm πηλίκοις γράμμασιν, theo đó lời nhấn mạnh nói đến độ dài của bức thư thay vì kích thước chữ viết.
lexical_decisions:
- source_word: Ἴδετε
  choice: Hãy xem
  rationale: Mệnh lệnh số nhiều dùng để thu hút sự chú ý; “Hãy xem” trực tiếp, tự nhiên và giữ được sắc thái kêu gọi của nguyên ngữ.
- source_word: πηλίκοις
  choice: lớn thế nào
  rationale: Từ này chỉ kích thước hoặc mức độ. Đi với γράμμασιν, cách hiểu tự nhiên nhất là kích thước lớn của các chữ viết.
- source_word: γράμμασιν
  choice: những chữ
  rationale: Ở đây từ này hợp lý nhất là các ký tự hay nét chữ, không nhất thiết là toàn bộ bức thư; “những chữ” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὑμῖν
  choice: cho anh chị em
  rationale: Đại từ cách gián tiếp chỉ những người nhận thư. “Anh chị em” diễn đạt số nhiều tự nhiên, trang trọng và không mặc định giới tính nam.
- source_word: ἔγραψα
  choice: đã viết
  rationale: Thì aorist được diễn đạt tự nhiên bằng “đã viết”, chỉ hành động viết đang hiện diện trước mắt người đọc.
- source_word: τῇ ἐμῇ χειρί
  choice: tự tay
  rationale: Cụm cách công cụ nhấn mạnh chính tay Phao-lô viết; “tự tay” là cách nói gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách hiểu πηλίκοις γράμμασιν
  choice: kích thước lớn của các chữ viết
  alternative: bức thư dài đến mức nào
  rationale: γράμμασιν thường chỉ các chữ hoặc ký tự, và lời nhấn mạnh “tự tay” hỗ trợ cách hiểu về nét chữ lớn. Tuy vậy, πηλίκοις có thể chỉ độ lớn theo nghĩa độ dài, nên cách hiểu “bức thư dài” được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh chị em” cho đại từ số nhiều ὑμῖν; cấu trúc “bằng những chữ lớn thế nào” giữ trọng tâm vào hình thức chữ viết mà không giải thích thêm nguyên nhân.
