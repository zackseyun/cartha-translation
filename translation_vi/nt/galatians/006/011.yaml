  terminology: “Anh chị em” phù hợp với người nhận số nhiều và văn cảnh thư tín. “Chữ” là tương đương tự nhiên của γράμμασιν trong cách hiểu chính. Chú thích giữ đúng tính chất của cách hiểu thay thế, không biến nó thành nghĩa chính.
