  source_fidelity: Bản dịch nhận đúng cách hiểu có xác suất cao của πηλίκοις γράμμασιν là các chữ viết có kích thước lớn, đồng thời giữ cách hiểu thay thế về độ dài bức thư trong chú thích. Tuy nhiên, trật tự hiện tại “tôi đã tự tay viết ... bằng những chữ lớn thế nào” có thể khiến trọng tâm của “thế nào” gắn với toàn hành động viết hơn là nhấn trực tiếp độ lớn của chữ. Đưa “những chữ lớn biết bao” lên gần đầu câu phản ánh sát hơn trọng tâm của nguyên ngữ.
