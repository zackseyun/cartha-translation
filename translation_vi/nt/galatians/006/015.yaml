source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: vi
  text: Vì cắt bì hay không cắt bì đều chẳng có giá trị gì, nhưng điều đáng kể là một sự sáng tạo mới.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thọ tạo mới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: Vì... hay... đều chẳng
  rationale: “Vì” giữ chức năng giải thích của γάρ và nối câu này với lập luận trước; cấu trúc “hay... đều chẳng” diễn đạt tự nhiên cặp οὔτε... οὔτε trong tiếng Việt.
- source_word: περιτομή
  choice: chịu cắt bì
  rationale: Giữ nghĩa cụ thể của nghi thức, đồng thời phù hợp với cách nói tự nhiên khi chỉ tình trạng đã nhận phép cắt bì.
- source_word: τί ἐστιν
  choice: có giá trị gì
  rationale: Thành ngữ ở đây nói rằng tình trạng ấy không có ý nghĩa hay giá trị quyết định; cách dịch này tự nhiên hơn “là gì” trong tiếng Việt.
- source_word: οὔτε ἀκροβυστία
  choice: hay không chịu cắt bì đều chẳng có giá trị gì
  rationale: ἀκροβυστία ở đây chỉ tình trạng không cắt bì, đối ứng với περιτομή; tránh nghĩa đen về bộ phận cơ thể vốn dễ gây hiểu sai.
- source_word: ἀλλὰ
  choice: điều quan trọng là
  rationale: Diễn đạt rõ sự tương phản mạnh trong câu tỉnh lược động từ mà không biến “sự sáng tạo mới” thành một mệnh lệnh.
- source_word: καινὴ κτίσις
  choice: một sự sáng tạo mới
  rationale: κτίσις có thể là “sự sáng tạo” hoặc “thọ tạo”; trong văn cảnh Phao-lô, nghĩa rộng “sự sáng tạo mới” phù hợp hơn nhưng sự mơ hồ được ghi nhận ở chú thích.
theological_decisions:
- issue: Sự tương phản giữa cắt bì/không cắt bì và sự sáng tạo mới
  choice: Cả hai tình trạng đều không có giá trị quyết định; thực tại được nhấn mạnh là sự sáng tạo mới.
  alternative: Chỉ phủ nhận vai trò của các dấu hiệu căn tính xã hội, hoặc coi hai tình trạng là hai con đường có giá trị ngang nhau.
  rationale: Câu Hy Lạp phủ định cả hai tình trạng rồi đặt καινὴ κτίσις trong thế tương phản, nhưng không tự giải thích chi tiết bản chất hay phạm vi của sự sáng tạo mới.
- issue: Cụm “trong Đấng Ki-tô Giê-su”
  choice: Đưa vào bản văn và đánh dấu chú thích vì đây là biến thể văn bản.
  alternative: Không đưa cụm này vào vì SBLGNT được cung cấp không có cụm ἐν Χριστῷ Ἰησοῦ.
  rationale: Một số truyền thống bản văn có cụm này, nhưng nguồn SBLGNT được yêu cầu không in nó; do đó, để bám sát nguồn chính, cụm này không nên hiện diện không chú giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tuy nhiên, để nhất quán tuyệt đối với SBLGNT, cụm có chú thích [a] là một biến thể nên lý tưởng nhất phải được chuyển hoàn toàn xuống chú thích thay vì để trong chính văn.
