revisions:
- from: Từ nay, đừng ai gây phiền toái cho tôi nữa, vì tôi mang trên thân thể mình những dấu tích của Chúa Giê-su.[a]
  to: Từ nay, đừng ai gây phiền toái cho tôi, vì tôi mang những dấu của Giê-su trên thân thể mình.[a]
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, thay «dấu tích» bằng cách dịch trung tính và trực tiếp hơn là «những dấu», đồng thời giữ trong chú thích sắc thái các dấu đóng nhận diện sự thuộc về hay trung thành. Không xác định các dấu ấy là sẹo do bắt bớ, dấu đóng theo nghĩa đen, hay ẩn dụ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:06Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc và ý chính của nguyên văn: mệnh lệnh cấm gây phiền toái, lý do được giới thiệu bằng γάρ, và các “dấu” được mang trên thân thể. Tuy nhiên, nguyên văn chỉ có «Giê-su» (τοῦ Ἰησοῦ), không có tước hiệu «Chúa»; việc thêm tước hiệu này vượt quá văn bản nguồn. «Dấu tích» có thể hiểu là tàn tích/dấu vết còn lại và kém trực tiếp hơn στίγματα, vốn nói về các dấu được ghi hay in trên thân thể.'
  naturalness: Câu sửa giữ giọng văn hiện đại, trang trọng và tự nhiên. «Đừng ai gây phiền toái cho tôi» diễn đạt thành ngữ κόπους παρέχειν rõ ràng. «Những dấu của Giê-su» tuy để mở quan hệ sở hữu như nguyên văn, vẫn tự nhiên khi được giải thích bằng chú thích.
  terminology: Dùng «Giê-su» thay vì «Chúa Giê-su» để không thêm thành tố không hiện diện trong câu Hy Lạp. Dùng «những dấu» cho στίγματα, với chú thích nêu lựa chọn «dấu đóng», nhằm giữ mở khả năng là dấu thể chất, dấu đóng biểu thị sự thuộc về, hay cả hai.
  issues:
  - severity: medium
    issue: Thêm danh xưng «Chúa» trước «Giê-su».
    rationale: SBLGNT đọc τοῦ Ἰησοῦ, không có κύριος. Dù «Chúa Giê-su» là lối gọi quen thuộc trong tiếng Việt Cơ Đốc, ở đây đó là một sự bổ sung không cần thiết vào bản dịch tối ưu-tương-đương.
  - severity: low
    issue: «Dấu tích» không phải lựa chọn rõ nhất cho στίγματα.
    rationale: «Dấu tích» trong tiếng Việt hiện đại thường gợi tàn tích hoặc dấu vết lưu lại; στίγματα nhấn vào các dấu được ghi/in trên thân thể. «Những dấu» giữ nghĩa rộng và minh bạch hơn, còn sắc thái «dấu đóng» được chuyển vào chú thích.
  revised_text: Từ nay, đừng ai gây phiền toái cho tôi, vì tôi mang những dấu của Giê-su trên thân thể mình.[a]
