id: GAL.6.17
reference: Galatians 6:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: vi
  text: Từ nay, đừng ai gây phiền toái cho tôi, vì tôi mang những dấu của Giê-su trên thân thể mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những dấu đóng”; từ này có thể chỉ những dấu trên thân thể cho biết một người thuộc về ai hoặc trung thành với ai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: Từ nay
  rationale: Cụm từ chỉ thời gian, mang nghĩa “từ bây giờ trở đi”; “Từ nay” tự nhiên và phù hợp với lời kết thúc thư.
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: đừng ai gây phiền toái cho tôi nữa
  rationale: Trong thành ngữ κόπους παρέχειν, κόπους không chỉ công việc nặng nhọc mà là sự phiền hà hay rắc rối gây ra cho người khác. Mệnh lệnh ngôi thứ ba với μηδείς được diễn đạt tự nhiên bằng “đừng ai”; “nữa” làm rõ ý chấm dứt từ nay.
- source_word: στίγματα
  choice: những dấu tích
  rationale: Từ này chỉ các dấu trên thân thể, có thể là dấu đóng để biểu thị quyền sở hữu hoặc những vết do chịu khổ. “Dấu tích” giữ được tính khái quát và sắc thái trang trọng mà không thu hẹp thành “sẹo”.
- source_word: τοῦ Ἰησοῦ
  choice: của Chúa Giê-su
  rationale: Giữ quan hệ sở hữu rộng của sở hữu cách Hy Lạp, không quyết định thay người đọc rằng đây là dấu do Chúa Giê-su gây ra, dấu vì Ngài, hay dấu biểu thị thuộc về Ngài. Danh xưng “Chúa” được dùng theo cách gọi tự nhiên, tôn kính trong tiếng Việt Cơ Đốc; từ Hy Lạp tại đây chỉ ghi “Giê-su”.
- source_word: ἐν τῷ σώματί μου
  choice: trên thân thể mình
  rationale: Với dấu vết hữu hình trên cơ thể, “trên thân thể” là cách nói tự nhiên trong tiếng Việt. “Mình” quy chiếu rõ về chủ ngữ “tôi” và tránh lặp nặng.
- source_word: βαστάζω
  choice: tôi mang
  rationale: βαστάζω có nghĩa mang hoặc mang lấy. “Mang” tự nhiên trong tiếng Việt khi nói đến dấu vết trên thân thể và vẫn giữ sắc thái Paul luôn mang chúng.
theological_decisions:
- issue: Bản chất của στίγματα mà Phao-lô mang
  choice: Dịch trung tính là “những dấu tích của Chúa Giê-su” và chú thích khả năng là dấu đóng trên thân thể.
  alternative: Dịch cụ thể là “những vết sẹo vì Chúa Giê-su” hoặc “dấu đóng cho thấy tôi thuộc về Chúa Giê-su”.
  rationale: Câu có thể gợi đến những dấu vết thể chất do sự bắt bớ, đồng thời biểu thị lòng trung thành hoặc sự thuộc về Chúa Giê-su. Nguyên văn không buộc phải chọn riêng một nghĩa, nên bản dịch giữ nguyên sức căng giải thích ấy.
- issue: Việc thêm danh xưng “Chúa” trước Giê-su
  choice: Dùng “Chúa Giê-su” theo lối gọi tôn kính và tự nhiên trong tiếng Việt.
  alternative: Dùng sát hình thức Hy Lạp là “Giê-su”.
  rationale: τοῦ Ἰησοῦ không có κύριος, nên “Chúa” không phải thành phần từ vựng trực tiếp; tuy nhiên “Chúa Giê-su” là cách định danh chuẩn, tự nhiên trong văn phong Kinh Thánh tiếng Việt và không làm thay đổi quan hệ sở hữu đang được giữ bằng “của”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Gây phiền toái” diễn đạt đúng thành ngữ Hy Lạp mà không quá khẩu ngữ; “dấu tích” giữ được sự mơ hồ có chủ ý giữa dấu vết thể chất và dấu hiệu thuộc về hay trung thành.
