    rationale: Từ này thường biểu thị tương phản hoặc chuyển hướng trong tiếng Việt. Liên từ καὶ đầu câu không tự nó mang nghĩa đối lập; ‘Và’ phản ánh trung tính và sát nguồn hơn.
  - severity: low
    issue: ‘đến trên họ’
    rationale: Cụm này không sai về mặt hiểu nghĩa nhưng kém tự nhiên trong tiếng Việt hiện đại. ‘đến với họ’ diễn đạt lời chúc phước tự nhiên hơn mà không thay đổi ý nghĩa.
