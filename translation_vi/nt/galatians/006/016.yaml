id: GAL.6.16
reference: Galatians 6:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: vi
  text: Và tất cả những ai bước theo chuẩn mực này[a], nguyện bình an và lòng thương xót đến với họ, và[c] với Israel của Đức Chúa Trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những ai làm theo tiêu chuẩn này.” Động từ mang ý bước ngay hàng hoặc giữ đúng nhịp theo một chuẩn mực.'
    reason: lexical_alternative
  - marker: b
    text: 'Cụm từ “Israel của Đức Chúa Trời” có nhiều cách hiểu: có thể chỉ các tín hữu Do Thái, toàn thể hội thánh, hoặc dân Đức Chúa Trời theo nghĩa rộng hơn. Bản dịch giữ nguyên cách diễn đạt Hy Lạp mà không quyết định cách hiểu.'
    reason: alternative_reading
  - marker: c
    text: Từ “và” trước cụm “với Israel của Đức Chúa Trời” có thể được hiểu là thêm một nhóm nữa, hoặc giải thích lại chính nhóm vừa nói đến (“tức là Israel của Đức Chúa Trời”).
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: tất cả những ai
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ ý nghĩa bao quát, không xác định của đại từ quan hệ.
- source_word: κανόνι
  choice: chuẩn mực
  rationale: Chỉ tiêu chuẩn hay khuôn phép định hướng cách sống; “chuẩn mực” tự nhiên hơn “quy tắc” trong ngữ cảnh này và không diễn giải quá mức.
- source_word: στοιχήσουσιν
  choice: bước theo
  rationale: Giữ được hình ảnh bước đi ngay hàng, theo đúng một chuẩn mực, đồng thời vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: εἰρήνη
  choice: bình an
  rationale: Cách dịch thông dụng, phù hợp với lời chúc phước.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Chuyển tải ý nghĩa của ἔλεος rõ ràng và tự nhiên trong cụm chúc phước.
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: đến trên họ ... và trên
  rationale: Giữ sắc thái lời cầu chúc và phản ánh việc giới từ ἐπί được lặp lại, nhưng tránh lối diễn đạt quá cứng.
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: Israel của Đức Chúa Trời
  rationale: Bám sát cấu trúc sở hữu trong tiếng Hy Lạp và không xác định thay tác giả phạm vi quy chiếu của cụm từ đang được tranh luận.
theological_decisions:
- issue: Đối tượng được gọi là “Israel của Đức Chúa Trời”
  choice: Giữ nguyên cách nói “Israel của Đức Chúa Trời”, không xác định đó là riêng các tín hữu Do Thái, toàn thể hội thánh hay dân Đức Chúa Trời theo nghĩa rộng hơn.
  alternative: Diễn giải là “những người Do Thái tin Chúa”, “hội thánh” hoặc “toàn thể dân Đức Chúa Trời”.
  rationale: Câu Hy Lạp không buộc bản dịch phải chọn một trong các cách hiểu thần học này; cách dịch trực tiếp bảo tồn sự mơ hồ thực sự của bản văn.
- issue: Chức năng của καί cuối câu
  choice: Dịch đơn giản là “và”, để ngỏ khả năng thêm một nhóm khác hoặc giải thích lại chính nhóm vừa nói đến.
  alternative: Dịch là “tức là/ngay cả” theo nghĩa đồng vị, hoặc diễn đạt rõ đây là một nhóm thứ hai.
  rationale: Cả cách hiểu bổ sung lẫn cách hiểu giải thích đồng vị đều đã được đề xuất; bản dịch không nên âm thầm quyết định vấn đề cú pháp và thần học này.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Bước theo chuẩn mực” giữ hình ảnh của nguyên ngữ mà vẫn rõ nghĩa; cấu trúc lời chúc “nguyện … đến trên” bảo tồn sắc thái chúc phước. Tên “Israel” được giữ ở dạng quốc tế quen thuộc, không thêm từ “dân” để tránh thu hẹp phạm vi quy chiếu.
