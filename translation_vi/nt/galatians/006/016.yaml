revisions:
- from: Còn tất cả những ai bước theo chuẩn mực này[a], nguyện bình an và lòng thương xót đến trên họ, và[c] trên Israel của Đức Chúa Trời[b].
  to: Và tất cả những ai bước theo chuẩn mực này[a], nguyện bình an và lòng thương xót đến với họ, và[c] với Israel của Đức Chúa Trời[b].
  rationale: Thay ‘Còn’ bằng ‘Và’ để không thêm sắc thái tương phản không có trong καὶ. Điều chỉnh ‘đến trên họ’ thành ‘đến với họ’ vì tự nhiên hơn trong tiếng Việt hiện đại. Vẫn giữ ‘và ... với Israel’ để bảo tồn sự mơ hồ cú pháp và thần học của καί cuối câu, và giữ toàn bộ hệ thống chú thích với đúng điểm neo.
  reviewer_model: gpt-5.6-terra
