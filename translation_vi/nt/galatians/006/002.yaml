source:
  edition: SBLGNT
  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: vi
  text: Hãy mang gánh nặng của nhau, và như vậy, anh chị em sẽ làm trọn luật của Đấng Mê-si-a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “luật của Đấng Christ.”'
    reason: Cách dịch truyền thống khác của tước hiệu Χριστός.
lexical_decisions:
- source_word: ἀλλήλων
  choice: cho nhau
  rationale: Đại từ tương hỗ diễn tả sự nâng đỡ lẫn nhau trong cộng đồng; kết hợp “mang gánh nặng cho nhau” tự nhiên hơn “gánh nặng của nhau” trong tiếng Việt hiện đại.
- source_word: τὰ βάρη
  choice: gánh nặng
  rationale: Giữ hình ảnh sức nặng phải mang, đồng thời diễn tả tự nhiên những khó khăn và áp lực mà người khác đang chịu.
- source_word: βαστάζετε
  choice: Hãy mang
  rationale: Động từ mệnh lệnh hiện tại số nhiều kêu gọi một hành động liên tục; “hãy mang” rõ ràng, tự nhiên và bảo toàn hình ảnh của câu.
- source_word: οὕτως
  choice: như vậy
  rationale: Liên kết việc mang gánh nặng cho nhau với kết quả theo sau, không diễn giải quá mức quan hệ giữa hai vế.
- source_word: ἀναπληρώσετε
  choice: anh chị em sẽ làm trọn
  rationale: Giữ dạng tương lai chỉ kết quả của việc vâng theo mệnh lệnh; “làm trọn luật” là cách kết hợp tự nhiên trong tiếng Việt và phù hợp với nghĩa hoàn tất hay thực hiện đầy đủ.
- source_word: τὸν νόμον
  choice: luật
  rationale: Giữ nghĩa thông thường của νόμος và sức căng thần học trong cách Phao-lô nói về luật, thay vì thu hẹp thành “nguyên tắc”.
- source_word: τοῦ Χριστοῦ
  choice: của Đấng Mê-si-a
  rationale: Χριστός ở đây là tước hiệu trong cụm sở hữu, nên dịch ý nghĩa của tước hiệu để giữ bối cảnh Do Thái về Đấng được xức dầu; cách gọi truyền thống được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch Χριστοῦ
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Bản chính thể hiện Χριστός như một tước hiệu có nghĩa là Đấng được xức dầu, còn chú thích giữ cách gọi đã quen thuộc trong truyền thống Cơ Đốc tiếng Việt.
- issue: Quan hệ giữa mệnh lệnh và việc làm trọn luật
  choice: “như vậy… sẽ làm trọn”
  alternative: “và như thế… hãy làm trọn”
  rationale: Theo văn bản SBLGNT được cung cấp, ἀναπληρώσετε là tương lai chỉ định, vì vậy bản dịch giữ sắc thái kết quả thay vì biến nó thành mệnh lệnh thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh chị em” làm rõ chủ thể số nhiều hàm ẩn trong động từ Hy Lạp và phù hợp với lời khuyên dành cho toàn cộng đồng; câu tránh dùng đại từ phân biệt giới tính độc quyền.
