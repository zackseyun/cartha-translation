base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: vi
  text: Nguyện ân điển của Chúa chúng ta là Giê-su, Đấng Mê-si-a, ở cùng tâm linh của anh em, hỡi anh em.[a] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây gọi cộng đồng tín hữu và có thể bao gồm cả nam lẫn nữ; cũng có thể diễn đạt là “anh chị em.” Theo cách gọi truyền thống, cụm “Giê-su, Đấng Mê-si-a” có thể dịch là “Chúa Giê-su Christ.” Từ Hy Lạp Χριστός là một tước hiệu, nghĩa là “Đấng Mê-si-a” hay “Đấng được xức dầu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: ân điển
  rationale: Giữ thuật ngữ quen thuộc trong các lời chúc phước của Phao-lô, đồng thời truyền đạt ân huệ nhưng không của Chúa.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách dịch tự nhiên và quen thuộc của κύριος trong lời tuyên xưng Cơ Đốc giáo sơ khai.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  rationale: Giê-su được phiên âm như tên riêng; Χριστός được dịch theo ý nghĩa tước hiệu là Đấng Mê-si-a thay vì bị coi đơn thuần như phần thứ hai của tên.
- source_word: μετὰ
  choice: ở cùng
  rationale: Nguyên văn Hy Lạp lược động từ trong công thức chúc phước; thêm “nguyện” và dùng “ở cùng” tạo câu tiếng Việt tự nhiên mà vẫn giữ ý nghĩa lời cầu chúc.
- source_word: πνεύματος ὑμῶν
  choice: tâm linh anh em
  rationale: Giữ danh từ số ít πνεῦμα và đối tượng được nói với ở số nhiều, thay vì làm phẳng thành đại từ “anh em”.
- source_word: ἀδελφοί
  choice: anh em
  rationale: Giữ hình thức hô cách giống đực số nhiều; trong ngữ cảnh, từ này có thể đại diện cho toàn thể cộng đồng tín hữu.
- source_word: ἀμήν
  choice: A-men
  rationale: Dùng lối phiên âm phụng vụ quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός trong lời chúc phước kết thư
  choice: Đấng Mê-si-a
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Χριστός vẫn mang giá trị tước hiệu ở đây. “Đấng Mê-si-a” bảo tồn liên hệ với tước hiệu được xức dầu mà không áp đặt cách diễn giải hệ phái.
- issue: Phạm vi chỉ người của ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: Nguyên ngữ dùng danh từ giống đực số nhiều, nhưng nhiều khả năng gọi toàn thể hội chúng. Bản chính giữ hình thức nguồn, còn chú thích nêu rõ phạm vi có thể bao gồm cả nam lẫn nữ.
- issue: Số ít của πνεῦμα với đại từ sở hữu số nhiều
  choice: tâm linh anh em
  alternative: tâm linh của mỗi người trong anh em / chính anh em
  rationale: Giữ sự căng giữa danh từ số ít và đối tượng số nhiều trong tiếng Hy Lạp, không quyết định thay rằng đây là tâm linh chung của cộng đồng hay tâm linh của từng người.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Cấu trúc “Nguyện … ở cùng …” làm rõ tính chất chúc phước của câu Hy Lạp không có động từ. Dấu phẩy quanh tước hiệu giúp câu dễ đọc; “thưa anh em” thể hiện hô cách ἀδελφοί.
