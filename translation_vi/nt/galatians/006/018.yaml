revisions:
- from: Nguyện ân điển của Chúa chúng ta là Chúa Giê-su, Đấng Mê-si-a,[a] ở cùng tâm linh anh em, thưa anh em.[b] A-men.
  to: Nguyện ân điển của Chúa chúng ta là Giê-su, Đấng Mê-si-a, ở cùng tâm linh của anh em, hỡi anh em.[a] A-men.
  rationale: Sửa cụm danh xưng để chỉ giữ một lần tương ứng với κύριος và diễn đạt quan hệ đồng vị bằng “Chúa chúng ta là Giê-su, Đấng Mê-si-a.” Thêm “của” để câu tiếng Việt tự nhiên, đổi hô cách thành “hỡi anh em,” và gộp chú thích vào một mốc tại “anh em” nhằm tránh mốc chú thích gắn không rõ với ranh giới của cụm danh xưng. Bản sửa không giải quyết thay sự mơ hồ về “tâm linh” số ít của cộng đồng hay của từng người.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:30:11Z'
