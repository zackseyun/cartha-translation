source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: vi
  text: Vì một người được lợi gì nếu có được cả thế gian, nhưng lại đánh mất chính mình[a] hoặc phải chịu thiệt hại về chính mình?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “mạng sống mình” hoặc “linh hồn mình”; tiếng Hy Lạp dùng đại từ phản thân, nghĩa đen là “chính mình”, chứ không dùng từ thông thường chỉ “linh hồn” hay “mạng sống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: Vì ... được lợi gì
  rationale: Diễn đạt tự nhiên câu hỏi tu từ về ích lợi, đồng thời giữ lực giải thích của γὰρ nối với lời phán trước đó.
- source_word: ἄνθρωπος
  choice: một người
  rationale: ἄνθρωπος ở đây chỉ một con người nói chung; “một người” là cách diễn đạt tự nhiên, chính xác trong tiếng Việt hiện đại.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: nếu chiếm được cả thế gian
  rationale: Chuyển phân từ giả định thành mệnh đề “nếu”; “chiếm được” thể hiện sự đạt được hay sở hữu toàn bộ lợi thế của thế gian mà không lặp từ “được lợi”.
- source_word: ἑαυτόν
  choice: chính mình
  rationale: Giữ đúng đại từ phản thân của bản Hy Lạp, không thu hẹp nghĩa thành riêng “linh hồn” hay “mạng sống”.
- source_word: ἀπολέσας
  choice: đánh mất
  rationale: Thể hiện trực tiếp ý mất đi, tương phản với việc chiếm được cả thế gian.
- source_word: ἢ ζημιωθείς
  choice: hoặc bị tổn hại
  rationale: Giữ quan hệ lựa chọn của ἢ và sắc thái bị động của phân từ, đồng thời phân biệt với ἀπολέσας mà không cường điệu thành “bị hủy diệt”.
theological_decisions:
- issue: Ý nghĩa của ἑαυτόν đối với số phận con người
  choice: chính mình
  alternative: mạng sống mình; linh hồn mình
  rationale: Nguyên văn dùng đại từ phản thân chứ không dùng ψυχή. “Chính mình” giữ phạm vi nhân học rộng và không áp đặt cách hiểu chỉ nói về phần phi vật chất của con người.
- issue: Mối quan hệ giữa ἀπολέσας và ζημιωθείς
  choice: đánh mất ... hoặc bị tổn hại
  alternative: đánh mất hoặc bị hư mất
  rationale: Bản dịch giữ hai cách diễn đạt khác nhau và liên từ “hoặc”, thay vì đồng nhất chúng hoặc giải quyết sự căng thẳng về sắc thái giữa mất đi và chịu thiệt hại.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng câu hỏi tu từ tự nhiên. “Thế gian” giữ sắc thái Kinh Thánh quen thuộc mà vẫn dễ hiểu; “chính mình” bảo toàn tính rộng và sự mơ hồ có chủ ý của nguyên văn.
