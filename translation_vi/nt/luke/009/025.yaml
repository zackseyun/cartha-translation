revisions:
- from: Vì một người được lợi gì nếu chiếm được cả thế gian, nhưng lại đánh mất chính mình[a] hoặc bị tổn hại?
  to: Vì một người được lợi gì nếu có được cả thế gian, nhưng lại đánh mất chính mình[a] hoặc phải chịu thiệt hại về chính mình?
  rationale: Đổi “chiếm được” thành “có được” để diễn đạt trung tính hơn ý κερδήσας (“đạt được, có được”), và thay “bị tổn hại” bằng “phải chịu thiệt hại về chính mình” để phản ánh rõ hơn sắc thái bị động của ζημιωθείς cùng mối liên hệ của nó với ἑαυτόν. Bản sửa vẫn giữ liên từ “hoặc” và không đồng nhất hai phân từ “đánh mất” và “chịu thiệt hại”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:44Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch nhìn chung bám sát câu hỏi tu từ, mệnh đề điều kiện, sự tương phản, và đại từ phản thân ἑαυτόν. Tuy nhiên, “bị tổn hại” không cho thấy rõ ζημιωθείς liên hệ với “chính mình” và trong tiếng Việt dễ chỉ tổn thương thân thể. Cần diễn đạt rõ ý chịu thiệt hại/mất mát về chính mình, đồng thời vẫn phân biệt với ἀπολέσας (“đánh mất”).
  naturalness: “Vì một người được lợi gì...” là tự nhiên trong văn phong Kinh Thánh hiện đại. “Bị tổn hại” ở cuối câu bị cụt về bổ ngữ và không song song rõ nghĩa với “đánh mất chính mình”; “phải chịu thiệt hại về chính mình” rõ nghĩa hơn trong một câu văn trang trọng.
  terminology: “Thế gian” phù hợp cho κόσμος trong ngữ cảnh này; “chính mình” bảo toàn đúng phạm vi rộng của ἑαυτόν, không thu hẹp thành “linh hồn” hay “mạng sống”. Chú thích từ vựng là phù hợp và cần được giữ lại.
  issues:
  - severity: medium
    issue: Cụm “hoặc bị tổn hại” không biểu đạt rõ đối tượng/nghĩa của ζημιωθείς.
    rationale: ζημιωθείς là phân từ bị động, trong cấu trúc này nói đến việc chịu thiệt hại hay mất mát liên quan đến chính bản thân người ấy. Cụm hiện tại dễ được hiểu là người ấy bị thương hoặc bị làm hại nói chung, đồng thời làm mất liên hệ với ἑαυτόν.
