- from: Nhưng Đức Giê-su biết điều họ đang suy tính trong lòng[a], nên đưa một em nhỏ đến và đặt em đứng bên cạnh mình[b].
  to: Nhưng Đức Giê-su, biết điều họ đang suy tính trong lòng[a], đã nắm lấy một em nhỏ và đặt em đứng bên cạnh mình[b].
  rationale: Bản sửa thay liên từ nhân quả bằng cấu trúc thuật chuyện trung tính và phục hồi ý cụ thể của ἐπιλαβόμενος bằng “nắm lấy.” Cụm “đặt em đứng” giữ sắc thái gây khiến đứng của ἔστησεν; các chú thích vẫn được neo đúng vị trí và không thay đổi nghĩa câu.
