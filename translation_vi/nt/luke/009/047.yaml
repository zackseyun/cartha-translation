source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: vi
  text: Nhưng Đức Giê-su, biết điều họ đang suy tính trong lòng[a], đã nắm lấy một em nhỏ và đặt em đứng bên cạnh mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sự suy tính của lòng họ”; “lòng” ở số ít, còn “họ” ở số nhiều.'
    reason: Giải thích cấu trúc số ít mang nghĩa tập thể trong nguyên văn.
  - marker: b
    text: 'Cũng có thể dịch: “đặt em bên mình.”'
    reason: Nêu cách diễn đạt khác cho cụm từ chỉ vị trí gần Đức Giê-su.
lexical_decisions:
- source_word: εἰδὼς
  choice: biết
  rationale: Phân từ này trong ngữ cảnh chỉ sự nhận biết về điều đang diễn ra bên trong; “biết” tự nhiên và không giải thích cơ chế Đức Giê-su biết.
- source_word: διαλογισμὸν
  choice: điều họ đang suy tính
  rationale: Cách dịch này giữ sắc thái suy xét, tính toán hoặc tranh luận trong tâm trí, rõ hơn từ “ý nghĩ” đơn thuần.
- source_word: τῆς καρδίας αὐτῶν
  choice: trong lòng
  rationale: “Trong lòng họ” là cách diễn đạt tự nhiên trong tiếng Việt về hoạt động nội tâm, đồng thời “lòng” có thể mang nghĩa tập thể như danh từ số ít trong tiếng Hy Lạp.
- source_word: ἐπιλαβόμενος
  choice: đưa ... đến
  rationale: Động từ hàm ý Đức Giê-su chủ động nắm lấy hoặc đưa em nhỏ lại; “đưa ... đến” diễn đạt tự nhiên hành động trong bối cảnh mà không gợi cảm giác thô bạo.
- source_word: παιδίον
  choice: một em nhỏ
  rationale: “Em nhỏ” là cách gọi tự nhiên, dễ hiểu và giữ ý về một đứa trẻ mà không thêm mức tuổi cụ thể.
- source_word: ἔστησεν
  choice: đặt em đứng
  rationale: Giữ hình ảnh gây khiến đứng của động từ Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: παρ’ ἑαυτῷ
  choice: bên cạnh mình
  rationale: Chỉ vị trí em nhỏ ở sát bên Đức Giê-su; đại từ phản thân “mình” quy chiếu tự nhiên về chủ thể Đức Giê-su.
theological_decisions:
- issue: Đức Giê-su biết sự suy tính bên trong của các môn đồ
  choice: Khẳng định Đức Giê-su biết điều họ suy tính nhưng không nêu cơ chế của sự biết ấy.
  alternative: Giải thích rõ đây là sự toàn tri siêu nhiên hoặc khả năng quan sát tinh tế của con người.
  rationale: Bản văn chỉ khẳng định sự nhận biết của Đức Giê-su, vì vậy bản dịch giữ nguyên sức căng thần học và không thêm lời giải thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được điều chỉnh cho tự nhiên; hình ảnh “đặt em đứng” được giữ để phản ánh động từ Hy Lạp, còn cách biết của Đức Giê-su không bị diễn giải thêm.
