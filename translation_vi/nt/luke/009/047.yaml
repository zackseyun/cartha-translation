  - severity: medium
    issue: “đưa một em nhỏ đến” làm mờ ἐπιλαβόμενος
    rationale: Động từ trung động này chỉ hành động nắm lấy hoặc lấy một em nhỏ; “đưa ... đến” thêm hướng chuyển động và không nêu rõ hành động tiếp lấy em.
