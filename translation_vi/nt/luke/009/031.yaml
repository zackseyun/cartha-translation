  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: hai nhân vật, sự hiện ra trong vinh quang, nội dung về «cuộc ra đi» của Chúa Giê-su, và địa điểm Giê-ru-sa-lem. Tuy nhiên, ἔλεγον là thì chưa hoàn thành, phù hợp hơn với «đang nói»/«đàm đạo», không chỉ «nói».'
  naturalness: Câu hiện tại rõ và trang trọng. Thêm «đang» vừa phản ánh thể của động từ Hy Lạp vừa tự nhiên trong mạch thuật chuyện tiếng Việt.
  terminology: «Cuộc ra đi» bảo tồn cách dùng có chủ ý rộng và giàu liên tưởng của ἔξοδος, không thu hẹp vào cái chết. «Hoàn tất» là lựa chọn có thể chấp nhận cho πληροῦν trong ngữ cảnh này. «Ngài» và «Giê-ru-sa-lem» nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng.
  issues:
