  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: vi
  text: Hai người hiện ra trong vinh quang và đang nói về cuộc ra đi của Ngài, là điều Ngài sắp hoàn tất tại Giê-ru-sa-lem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ
  choice: Hai người
  rationale: Đại từ quan hệ số nhiều chỉ Môi-se và Ê-li trong câu trước; diễn đạt rõ chủ thể bằng tiếng Việt mà không thêm ý ngoài văn cảnh.
- source_word: ὀφθέντες ἐν δόξῃ
  choice: hiện ra trong vinh quang
  rationale: Giữ sát cấu trúc và ý nghĩa của phân từ thụ động ὀφθέντες cùng cụm ἐν δόξῃ.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: cuộc ra đi của Ngài
  rationale: ἔξοδος theo nghĩa trực tiếp là sự ra đi; cách dịch này giữ được chiều sâu liên tưởng đến cuộc xuất hành mà không giải nghĩa quá mức thành riêng cái chết.
- source_word: ἤμελλεν
  choice: sắp
  rationale: Diễn đạt hành động sắp xảy ra theo văn cảnh.
- source_word: πληροῦν
  choice: hoàn tất
  rationale: Giữ sắc thái làm cho trọn hoặc đưa đến chỗ hoàn thành, thay vì thu hẹp thành 'thực hiện' hay 'chịu chết'.
- source_word: ἐν Ἰερουσαλήμ
  choice: tại Giê-ru-sa-lem
  rationale: Cách nói địa điểm tự nhiên trong tiếng Việt, giữ nguyên địa danh theo lối phiên âm quen thuộc.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἔξοδος
  choice: cuộc ra đi
  alternative: cái chết; sự qua đời; cuộc xuất hành
  rationale: '“Cuộc ra đi” bảo tồn sự mơ hồ có chủ ý: từ này có thể bao hàm cái chết, sự phục sinh và thăng thiên của Chúa Giê-su, đồng thời gợi lại mô-típ Xuất Hành.'
- issue: Sắc thái của πληροῦν
  choice: hoàn tất
  alternative: thực hiện; hoàn thành; ứng nghiệm
  rationale: “Hoàn tất” giữ được nghịch lý thần học rằng cuộc ra đi tại Giê-ru-sa-lem là điều Chúa Giê-su chủ động đưa đến chỗ trọn vẹn, nhưng không buộc từ này chỉ mang nghĩa ứng nghiệm lời tiên tri.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo lối tôn kính phổ biến; không thêm chú thích vì bản dịch chính đã giữ được sự đa nghĩa quan trọng của ἔξοδος.
