    rationale: “Đến một nơi riêng biệt” dễ được hiểu là thay thế cho đích đến, trong khi κατ’ ἰδίαν bổ nghĩa cho cách thức/rút lui tách riêng. Nên nêu các tương đương như “tách riêng” hoặc “riêng tư”.
