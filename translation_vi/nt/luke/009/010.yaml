id: LUK.9.10
reference: Luke 9:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: vi
  text: Khi các sứ đồ trở về, họ thuật lại cho Đức Giê-su mọi việc mình đã làm. Ngài đưa họ đi riêng[a] đến một thành gọi là Bết-sai-đa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tách riêng” hoặc “riêng tư”. Cụm từ này chỉ việc rời khỏi đám đông, không hàm ý Đức Giê-su ở hoàn toàn một mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Khi ... trở về
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cấu trúc thời gian này tự nhiên trong tiếng Việt và giữ đúng trình tự.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: Trong văn cảnh Lu-ca, đây là danh xưng đã được xác lập cho Nhóm Mười Hai khi thi hành sứ mạng; “sứ đồ” là cách gọi quen thuộc và chính xác.
- source_word: διηγήσαντο
  choice: thuật lại
  rationale: Động từ chỉ việc kể lại hay trình bày những gì đã xảy ra; “thuật lại” phù hợp với việc họ trở về báo cáo mà không làm câu mang sắc thái hành chính quá mức.
- source_word: ὅσα ἐποίησαν
  choice: mọi việc mình đã làm
  rationale: ὅσα bao quát những điều họ đã làm; “mình” quy chiếu tự nhiên về chủ ngữ “họ”, còn “đã” thể hiện hành động có trước việc thuật lại.
- source_word: παραλαβὼν αὐτούς
  choice: Ngài đưa họ theo
  rationale: παραλαμβάνω ở đây có nghĩa đem hoặc dẫn những người khác đi cùng; cách diễn đạt này rõ ràng và tự nhiên.
- source_word: ὑπεχώρησεν
  choice: lui
  rationale: Động từ diễn tả việc rút khỏi đám đông hoặc hoạt động công khai; “lui” giữ sắc thái ấy mà vẫn trang trọng, gọn.
- source_word: κατ’ ἰδίαν
  choice: riêng
  rationale: Cụm từ mang nghĩa riêng tư hoặc tách riêng khỏi người khác. Vì các sứ đồ đi cùng Đức Giê-su, “riêng” tránh hàm ý Ngài hoàn toàn một mình.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: đến một thành gọi là Bết-sai-đa
  rationale: πόλις chỉ một khu dân cư có thể được gọi là thành hoặc thị trấn; “thành” là cách dùng Kinh Thánh tự nhiên trong tiếng Việt, còn καλουμένην được chuyển là “gọi là”.
- source_word: Βηθσαϊδά
  choice: Bết-sai-đa
  rationale: Phiên âm địa danh theo lối quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của κατ’ ἰδίαν khi các sứ đồ đi cùng Đức Giê-su
  choice: Dịch là “lui riêng”, nghĩa là tách khỏi đám đông để ở nơi riêng tư.
  alternative: “lui một mình” hoặc “đi riêng”
  rationale: Văn bản nói rõ Đức Giê-su đưa các sứ đồ theo, nên không thể hiểu Ngài hoàn toàn đơn độc. Bản dịch giữ sự phân cách khỏi công chúng mà không xóa bỏ sự hiện diện của các sứ đồ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Ngài” để chỉ Chúa Giê-su; giữ câu văn kể chuyện gọn, đồng thời chú thích sự linh hoạt của κατ’ ἰδίαν.
