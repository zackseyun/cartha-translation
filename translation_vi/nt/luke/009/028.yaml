reference: Luke 9:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: vi
  text: Khoảng tám ngày sau những lời ấy[a][b], Đức Chúa Giê-su đem Phi-e-rơ, Giăng và Gia-cơ theo, rồi lên núi để cầu nguyện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sau những lời phán ấy.” Từ Hy Lạp λόγους ở đây có thể chỉ “những lời” hoặc “những điều đã nói.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “khoảng tám ngày”; từ ὡσεὶ cho biết đây là khoảng thời gian xấp xỉ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: không dịch thành một từ riêng
  rationale: Cụm này chủ yếu làm nhiệm vụ chuyển tiếp trong lời kể. Tiếng Việt diễn đạt tự nhiên bằng cách bắt đầu trực tiếp với trạng ngữ thời gian, không cần thêm “bấy giờ” hay “xảy ra rằng” khi nguyên văn không có một từ chỉ “bây giờ” rõ ràng.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: sau những lời ấy
  rationale: λόγους chỉ những điều Đức Chúa Jêsus vừa nói ở phần trước. “Những lời ấy” vừa gần nguyên văn vừa tự nhiên; cũng có thể hiểu là “những lời phán ấy” hoặc “những điều ấy được nói ra.”
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: khoảng tám ngày
  rationale: ὡσεὶ biểu thị sự ước lượng, vì vậy “khoảng” giữ được tính xấp xỉ trong lời của Lu-ca và không hòa đồng cách tính với các sách Tin Lành song song.
- source_word: παραλαβὼν
  choice: đưa ... đi cùng
  rationale: Phân từ này diễn tả việc đem hoặc dẫn những người được nêu tên theo cùng. Cách diễn đạt hữu hạn này tự nhiên trong tiếng Việt và làm rõ ý đồng hành mà không thêm nội dung.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Phi-e-rơ, Giăng và Gia-cơ
  rationale: Dùng các dạng tên riêng quen thuộc trong tiếng Việt hiện đại; dấu phẩy tạo một danh sách tự nhiên mà vẫn giữ nguyên thứ tự tên trong tiếng Hy Lạp.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: lên núi
  rationale: ἀνέβη diễn tả chuyển động đi lên. Mạo từ Hy Lạp không nhất thiết cho thấy đây là một ngọn núi đã được xác định trước, nên tiếng Việt tự nhiên không cần thêm “ngọn núi ấy.”
- source_word: προσεύξασθαι
  choice: để cầu nguyện
  rationale: Động từ nguyên mẫu diễn tả mục đích của việc lên núi; “để cầu nguyện” truyền đạt trực tiếp quan hệ mục đích này.
theological_decisions:
- issue: Tính xấp xỉ của mốc thời gian so với các trình thuật song song
  choice: khoảng tám ngày
  alternative: tám ngày; chừng tám ngày
  rationale: ὡσεὶ minh nhiên đánh dấu con số là xấp xỉ. Bản dịch giữ nguyên cách trình bày của Lu-ca, không làm con số thành tuyệt đối và không âm thầm điều hòa với các sách Tin Lành khác.
- issue: Chủ ngữ hàm ẩn của các động từ
  choice: Đức Chúa Jêsus
  alternative: Ngài; người
  rationale: Tiếng Hy Lạp chỉ hàm ẩn chủ ngữ qua động từ và ngữ cảnh xác định đó là Đức Chúa Jêsus. Nêu tên trong tiếng Việt giúp câu đứng riêng rõ nghĩa mà không thay đổi nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thứ tự diễn tiến của nguyên văn nhưng dùng cú pháp tiếng Việt tự nhiên. “Đức Chúa Jêsus” được dùng để làm rõ chủ ngữ hàm ẩn khi câu được đọc độc lập; “Phi-e-rơ, Giăng và Gia-cơ” theo các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
