    rationale: παραλαβών có nghĩa là đem/dẫn những người này theo cùng; “đem ... theo” là cách nói Việt tự nhiên, không thêm nghĩa.
  - severity: low
    issue: Chính tả “Jêsus” không phải dạng hiện hành trong tiếng Việt chuẩn hiện đại.
    rationale: “Giê-su” là dạng chính tả hiện đại phổ biến; việc cập nhật này không thay đổi tên riêng hay ý nghĩa.
