  source_fidelity: Bản dịch giữ đúng mốc thời gian xấp xỉ của ὡσεὶ ἡμέραι ὀκτώ, thứ tự ba môn đồ, hành động đi lên núi, và mục đích cầu nguyện. Tuy nhiên, “đưa ... đi cùng” tuy hiểu được nhưng chưa diễn đạt gọn và sát chức năng ‘đem theo/dẫn theo’ của παραλαβών trong văn phong Việt hiện đại.
  naturalness: Câu nhìn chung rõ ràng và tự nhiên. Đổi “đưa Phi-e-rơ, Giăng và Gia-cơ đi cùng” thành “đem ... theo” làm câu trôi chảy hơn và tránh sắc thái ‘đưa ai đi’ có thể gợi một đích đến tách biệt với người nói.
  terminology: Cần nhất quán với dạng chính tả hiện đại “Giê-su”. Cách gọi “Đức Chúa Giê-su” vẫn giữ sắc thái trang trọng của bản dịch mà dùng chính tả Việt hiện hành. Các tên Phi-e-rơ, Giăng và Gia-cơ có thể giữ nguyên theo quy ước tên riêng của bản thảo.
  issues:
