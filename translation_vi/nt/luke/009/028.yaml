  to: Khoảng tám ngày sau những lời ấy[a][b], Đức Chúa Giê-su đem Phi-e-rơ, Giăng và Gia-cơ theo, rồi lên núi để cầu nguyện.
  rationale: Chỉnh nhẹ để dùng chính tả tên Giê-su theo tiếng Việt hiện đại và thay cách diễn đạt của παραλαβών bằng “đem ... theo,” tự nhiên hơn mà vẫn bảo toàn ý đem các môn đồ đi cùng. Giữ “khoảng tám ngày,” “những lời ấy,” “lên núi,” và “để cầu nguyện” vì chúng truyền đạt trung thành văn bản Hy Lạp. Giữ nguyên các ký hiệu và nội dung chú thích vì chúng vẫn tương ứng đúng với các lựa chọn từ vựng.
