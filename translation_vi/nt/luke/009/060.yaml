language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: vi
  text: 'Nhưng ngài nói với ông ấy[a]: “Hãy để người chết chôn người chết của họ; còn anh, hãy đi rao truyền vương quốc của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người chết” ở lần thứ nhất có lẽ được dùng theo nghĩa bóng, còn ở lần thứ hai chỉ những người đã chết về thể xác. Tiếng Hy Lạp dùng cùng một từ ở cả hai chỗ, và bản dịch giữ lại sự lặp lại ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Hãy để
  rationale: Mệnh lệnh aorist của ἀφίημι ở đây truyền lệnh dứt khoát rằng người ấy phải để việc đó lại; “hãy để” vừa tự nhiên trong tiếng Việt vừa giữ được cấu trúc nghịch lý của câu.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: người chết ... người chết của họ
  rationale: Giữ nguyên sự lặp lại của νεκρούς để bảo tồn nghịch lý nổi bật trong nguyên văn, không diễn giải lần thứ nhất thành “người chết về tâm linh” ngay trong chính văn.
- source_word: θάψαι
  choice: chôn
  rationale: Động từ nguyên mẫu bổ nghĩa cho Ἄφες, diễn tả việc được để cho họ làm; “chôn” là cách nói rõ ràng và tự nhiên trong tiếng Việt.
- source_word: ἑαυτῶν
  choice: của họ
  rationale: Trong ngữ cảnh này, “người chết của họ” truyền đạt quan hệ phản thân mà không dùng cách diễn đạt nặng nề “người chết của chính họ”; sắc thái nhấn mạnh được cân bằng với tính tự nhiên của tiếng Việt.
- source_word: ἀπελθὼν
  choice: hãy đi
  rationale: Phân từ aorist đi trước mệnh lệnh chính; tiếng Việt tự nhiên diễn đạt chuỗi hành động này bằng “hãy đi rao truyền”, không cần một cấu trúc cứng như “sau khi đi”.
- source_word: διάγγελλε
  choice: rao truyền
  rationale: Mệnh lệnh hiện tại mang ý công bố rộng rãi và tiếp diễn; “rao truyền” phù hợp với ngữ cảnh công bố vương quốc.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: “Vương quốc” giữ hình ảnh βασιλεία và là cách diễn đạt Kinh Thánh trang trọng, dễ hiểu; cụm từ cũng hàm ý quyền cai trị của Đức Chúa Trời mà không thu hẹp thành một lãnh thổ.
- source_word: αὐτῷ
  choice: với người ấy
  rationale: Đại từ chỉ người nam số ít được chuyển thành “người ấy” để tự nhiên và rõ đối tượng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “người chết” trong hai lần xuất hiện
  choice: Giữ “người chết” ở cả hai chỗ, không giải thích ngay trong chính văn.
  alternative: “Hãy để những người chết về tâm linh chôn người chết của họ.”
  rationale: Lần thứ nhất có lẽ mang nghĩa ẩn dụ về những người không đáp ứng về mặt tâm linh, còn lần thứ hai chỉ người chết về thể xác. Tuy nhiên, tiếng Hy Lạp dùng cùng một từ ở cả hai chỗ; giữ nguyên cách lặp bảo tồn nghịch lý và sức căng thần học của lời phán.
- issue: Cách diễn đạt βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: quyền trị vì của Đức Chúa Trời
  rationale: “Vương quốc” bảo tồn cách nói và hình ảnh của nguyên văn, trong khi “quyền trị vì” làm rõ một phương diện nhưng có thể thu hẹp trường nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để xác định chủ thể vốn được ngữ cảnh Hy Lạp biểu thị bằng đại từ ngầm trong εἶπεν; dùng “anh” cho σὺ nhằm giữ lời nói trực tiếp ở số ít. Cấu trúc “hãy đi rao truyền” chuyển phân từ ἀπελθών và mệnh lệnh διάγγελλε thành chuỗi hành động tự nhiên trong tiếng Việt.
