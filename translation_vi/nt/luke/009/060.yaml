  - severity: low
    issue: Chú thích diễn đạt cách hiểu ẩn dụ hơi khẳng định và không thật tự nhiên.
    rationale: “Chỉ những người không đáp ứng về mặt tâm linh” vừa gượng vừa có thể làm cách hiểu truyền thống có vẻ dứt khoát. Nên nói rằng lần đầu “có lẽ được dùng theo nghĩa bóng”, đồng thời xác nhận sự lặp từ trong tiếng Hy Lạp.
