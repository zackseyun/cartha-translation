revisions:
- from: 'Nhưng Đức Chúa Jêsus phán với người ấy[a]: “Hãy để người chết chôn người chết của họ; còn anh, hãy đi rao truyền vương quốc Đức Chúa Trời.”'
  to: 'Nhưng ngài nói với ông ấy[a]: “Hãy để người chết chôn người chết của họ; còn anh, hãy đi rao truyền vương quốc của Đức Chúa Trời.”'
  rationale: Bản sửa loại bỏ tên và tước hiệu được thêm vào ngoài câu Hy Lạp, đồng thời vẫn nhận diện chủ thể bằng đại từ phù hợp văn cảnh. Câu giữ nguyên lặp từ νεκρούς, sắc thái mệnh lệnh của Ἄφες, sự tương phản nhấn mạnh σὺ δέ, và chuỗi hành động tự nhiên cho ἀπελθών + διάγγελλε. Chú thích được chỉnh để ghi nhận, thay vì áp đặt, cách hiểu nghĩa bóng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:59Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc nghịch lý với cùng một cách gọi “người chết” ở cả hai lần, diễn đạt được mệnh lệnh đối lập giữa việc chôn cất và công bố vương quốc của Đức Chúa Trời. Tuy nhiên, nguyên văn chỉ có “ngài/người ấy nói với ông ấy”, không nêu tên Đức Chúa Jêsus; việc thêm tên và tước hiệu vào chính văn vượt quá câu nguồn. Bản sửa tránh sự bổ sung này.
  naturalness: “Người chết chôn người chết của họ” rõ nghĩa và giữ được sự lặp lại, nhưng cần diễn đạt chủ ngữ và đối tượng xưng hô tự nhiên hơn trong văn phong Việt hiện đại. “Ngài nói với ông ấy” và “Còn anh” tạo lời đối thoại mạch lạc, trang trọng mà không cổ kính quá mức.
  terminology: Giữ “vương quốc của Đức Chúa Trời” cho βασιλείαν τοῦ θεοῦ và “rao truyền” cho διάγγελλε. Không đưa cách hiểu “chết về tâm linh” vào chính văn; chú thích nêu đây là cách hiểu có khả năng, không phải sự giải nghĩa bắt buộc.
  issues:
  - severity: medium
