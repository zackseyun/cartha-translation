  text: καὶ ἔφαγον καὶ ἐχορτάσθησαν πάντες, καὶ ἤρθη τὸ περισσεῦσαν αὐτοῖς κλασμάτων κόφινοι δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: vi
  text: Tất cả đều ăn no nê, và người ta thu lại được mười hai giỏ những miếng vụn còn thừa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những mảnh đã bẻ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: ăn
  rationale: Thì aorist thuật lại sự việc đơn giản; “ăn” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐχορτάσθησαν
  choice: ăn no nê
  rationale: Diễn đạt tự nhiên ý mọi người được ăn đến no; tránh lối dịch máy móc “được làm cho no”.
- source_word: πάντες
  choice: tất cả đều
  rationale: Giữ sự nhấn mạnh rằng mọi người hiện diện đều đã ăn và no.
- source_word: ἤρθη
  choice: người ta thu lại
  rationale: Dạng bị động có nghĩa là phần còn thừa được nhặt hoặc gom lại; tiếng Việt thường dùng chủ thể phiếm chỉ “người ta” tự nhiên hơn dạng bị động cứng.
- source_word: τὸ περισσεῦσαν
  choice: còn thừa
  rationale: Phản ánh phân từ có mạo từ chỉ phần còn lại sau khi mọi người ăn.
- source_word: αὐτοῖς
  choice: hàm ẩn theo ngữ cảnh
  rationale: Dative αὐτοῖς khó xác định chính xác là “cho họ”, “bởi họ” hay chỉ quan hệ với những người vừa ăn. Dịch thành một đại từ riêng trong tiếng Việt dễ gượng hoặc giải quyết quá mức; ý liên hệ được giữ qua mạch văn.
- source_word: κλασμάτων
  choice: những miếng vụn
  rationale: Chỉ các phần bánh đã được bẻ ra và còn lại; “miếng vụn” cụ thể, dễ hiểu, đồng thời không nhất thiết hàm ý các mẩu cực nhỏ.
- source_word: κόφινοι δώδεκα
  choice: mười hai giỏ
  rationale: Cách dịch rõ ràng, thông dụng; không cần thêm chất liệu đan vì nguyên văn chỉ nêu loại vật chứa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “ăn no nê” để truyền đạt trọn ý ἐχορτάσθησαν; chuyển bị động Hy Lạp thành chủ thể phiếm chỉ tự nhiên trong tiếng Việt. Cấu trúc câu giữ nhịp kể chuyện và kết quả nổi bật là mười hai giỏ.
