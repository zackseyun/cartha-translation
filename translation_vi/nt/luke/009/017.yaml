  to: Tất cả đều ăn no nê, và người ta thu lại được mười hai giỏ những miếng vụn còn thừa[a].
  rationale: Sắp xếp lại thành “thu lại được mười hai giỏ những miếng vụn” để “mười hai giỏ” rõ ràng là lượng phần còn thừa được gom lại. Giữ cách diễn đạt phiếm chỉ tự nhiên trong tiếng Việt cho bị động ἤρθη, và giữ chú thích thay thế cho κλασμάτων.
