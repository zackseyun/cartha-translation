id: LUK.9.23
reference: Luke 9:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: vi
  text: 'Ngài nói với tất cả mọi người: “Nếu ai muốn đi sau Ta, người ấy[a] hãy từ bỏ chính mình, hằng ngày vác thập tự giá của mình và theo Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng dạng số ít mang nghĩa khái quát: “nếu ai… người ấy… chính mình”. Câu này áp dụng cho bất cứ người nào, không chỉ riêng nam giới.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ πρὸς πάντας
  choice: Ngài nói với tất cả mọi người
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ phạm vi bao quát của πάντας. Thì chưa hoàn thành của ἔλεγεν cho thấy lời nói đang diễn ra trong bối cảnh, nhưng tiếng Việt không cần bắt buộc thêm dấu hiệu thể khi mạch văn đã xác định hành động nói.
- source_word: Εἴ τις θέλει
  choice: Nếu ai muốn
  rationale: Giữ nguyên tính bất định và khái quát của τις cùng sắc thái ý muốn của θέλει bằng cách nói hiện đại, tự nhiên.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: đi sau Ta
  rationale: Giữ hình ảnh vị trí ‘sau Ta’ và chưa đồng nhất hoàn toàn cụm này với động từ ἀκολουθέω xuất hiện ở cuối câu.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: người ấy hãy từ bỏ chính mình
  rationale: ‘Hãy’ thể hiện mệnh lệnh ngôi thứ ba theo cách tự nhiên; ‘từ bỏ chính mình’ truyền đạt hành động khước từ quyền tự định đoạt của bản thân mà không thêm lời giải thích thần học.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: vác thập tự giá của mình
  rationale: ‘Vác’ là cách nói tự nhiên đối với thập tự giá trong tiếng Việt; giữ nguyên hình ảnh cụ thể của σταυρός và đại từ sở hữu.
- source_word: καθ’ ἡμέραν
  choice: hằng ngày
  rationale: Diễn đạt ngắn gọn, chính xác ý ‘mỗi ngày’, giữ nét nhấn mạnh riêng của Lu-ca về tính liên tục.
- source_word: ἀκολουθείτω μοι
  choice: và theo Ta
  rationale: Mệnh lệnh ‘hãy’ ở trước chi phối chuỗi hành động, nên cách nối này vừa tự nhiên vừa duy trì lực mệnh lệnh của động từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của hình ảnh ‘thập tự giá’ trong việc làm môn đồ
  choice: Giữ danh từ cụ thể ‘thập tự giá’.
  alternative: Diễn giải thành ‘gánh nặng’, ‘đau khổ’ hoặc ‘sự hy sinh’.
  rationale: σταυρός chỉ thập tự giá theo nghĩa cụ thể, đồng thời mang sức gợi biểu tượng trong ngữ cảnh. Bản dịch không thu hẹp hình ảnh này vào một cách giải thích duy nhất.
- issue: Số ít mang nghĩa khái quát trong chuỗi mệnh lệnh
  choice: Dùng ‘ai … người ấy … chính mình … của mình’.
  alternative: Chuyển sang số nhiều hoặc lược bỏ hoàn toàn chủ thể đại diện.
  rationale: Cách dịch giữ cấu trúc số ít khái quát của tiếng Hy Lạp nhưng không biến giống ngữ pháp giống đực thành giới tính nam trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ trong lời kể và ‘Ta’ trong lời trực tiếp của Chúa Giê-su; giữ ‘thập tự giá’ là thuật ngữ quen thuộc, không diễn giải biểu tượng ngay trong chính văn.
