  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành tố chính của câu Hy Lạp: lời nói hướng đến mọi người, điều kiện tổng quát “nếu ai muốn”, hình ảnh “đi sau Ta”, ba mệnh lệnh liên kết, “thập tự giá của mình”, và nét nhấn mạnh “hằng ngày”. “Ngài nói” là cách chuyển tự nhiên trong tiếng Việt cho ἔλεγεν; dù không biểu thị riêng thể chưa hoàn thành, không làm sai nghĩa trong một câu tường thuật ngắn.'
  naturalness: Văn câu rõ, trang trọng và tự nhiên theo tiếng Việt hiện đại. Cấu trúc “Nếu ai muốn …, người ấy hãy …” giữ được tính khái quát số ít mà không gán giới tính. Chuỗi “từ bỏ …, hằng ngày vác … và theo Ta” mạch lạc; “vác thập tự giá” là cách kết hợp từ quen thuộc và phù hợp ngữ cảnh.
  terminology: “Thập tự giá” bảo toàn thuật ngữ cụ thể σταυρός, không diễn giải thành gánh nặng hay đau khổ. “Từ bỏ chính mình” chuyển đạt thích đáng ἀρνησάσθω ἑαυτόν. Việc dùng “Ta” trong lời trực tiếp và “Ngài” trong lời kể nhất quán với thanh giọng trang trọng đã chọn.
