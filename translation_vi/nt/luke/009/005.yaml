  - severity: low
    issue: Đại từ trong mệnh lệnh chuyển từ số nhiều “anh em” sang “mình”.
    rationale: ὑμῶν là số nhiều, cùng đối tượng với ὑμᾶς. “Chân anh em” giữ nhất quán ngôi nói trực tiếp với các môn đồ.
  - severity: low
