source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: vi
  text: Còn tất cả những ai không tiếp nhận anh em[a], thì khi rời khỏi thành ấy[b], hãy giũ bụi khỏi chân anh em để làm chứng chống lại họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không đón tiếp anh em.” Động từ Hy Lạp có thể bao hàm cả việc tiếp đón lẫn chấp nhận các sứ giả.
    reason: lexical_alternative
  - marker: b
    text: Hay “thị trấn ấy.” Từ Hy Lạp πόλις có thể chỉ một thị trấn hoặc một thành phố, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: những ai không tiếp nhận anh em
  rationale: ὅσοι với ἄν mang nghĩa khái quát, chỉ bất cứ người nào; δέχομαι bao hàm việc đón tiếp và chấp nhận các sứ giả. “Tiếp nhận” giữ được phạm vi nghĩa rộng ấy. “Anh em” diễn đạt đại từ số nhiều ὑμᾶς một cách tự nhiên trong lời Chúa Giê-su nói với các môn đồ.
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: khi rời khỏi thành ấy
  rationale: Phân từ ἐξερχόμενοι diễn tả hành động xảy ra đồng thời với mệnh lệnh chính. “Rời khỏi” tự nhiên trong tiếng Việt; “thành” không buộc người đọc hiểu đây là một đô thị lớn.
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ἀποτινάσσετε
  choice: hãy giũ bụi khỏi chân mình
  rationale: ἀποτινάσσετε là mệnh lệnh về việc giũ bỏ bụi bằng một động tác rõ ràng. “Giũ bụi khỏi chân mình” vừa tự nhiên vừa giữ nguyên hình ảnh biểu tượng.
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: để làm chứng chống lại họ
  rationale: εἰς diễn tả mục đích hoặc kết quả, còn μαρτύριον ἐπ’ αὐτούς trong ngữ cảnh này có sắc thái chứng cứ bất lợi. Cách dịch này giữ sức nặng cảnh báo mà không diễn giải thành lời tuyên án cuối cùng.
theological_decisions:
- issue: Ý nghĩa của hành động giũ bụi
  choice: Một hành động làm chứng chống lại những người khước từ các sứ giả
  alternative: Một dấu hiệu trung tính cho họ, hoặc một lời tuyên bố rõ ràng về sự kết án cuối cùng
  rationale: Cụm εἰς μαρτύριον ἐπ’ αὐτούς có sức nặng cảnh báo và phán xét hơn một dấu hiệu trung tính, nhưng câu này không nói rõ toàn bộ mức độ của sự phán xét. Bản dịch giữ nguyên sự căng thẳng ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để biểu đạt ngôi thứ hai số nhiều trong lời nói trực tiếp với các môn đồ; dùng “thành” theo nghĩa rộng, không mặc nhiên hàm ý một đô thị lớn.
