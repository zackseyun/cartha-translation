review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh giũ bụi và ý nghĩa làm chứng bất lợi của εἰς μαρτύριον ἐπ’ αὐτούς. Tuy nhiên, “tất cả những ai” phản ánh rõ hơn lực khái quát của ὅσοι ἄν; đồng thời đại từ số nhiều của mệnh lệnh nên được giữ nhất quán là “anh em” thay vì “mình”.
  naturalness: Câu sửa vẫn là tiếng Việt hiện đại, trang trọng và tự nhiên. “Giũ bụi khỏi chân anh em” rõ chủ thể số nhiều hơn “khỏi chân mình”.
  terminology: “Tiếp nhận,” “thành ấy,” “giũ bụi,” và “làm chứng chống lại họ” đều phù hợp ngữ cảnh và không diễn giải quá mức hàm ý phán xét của hành động biểu tượng.
