translation:
  language: vi
  text: Và họ đi đến một làng khác.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một ngôi làng khác.” Tính từ Hy Lạp có thể nhấn mạnh rằng đó là một làng khác, chứ không chỉ nói đến thêm một làng nữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Trong mạch kể chuyện, liên từ này nối hành động kế tiếp; “Rồi” diễn đạt tự nhiên sự tiếp diễn mà không nhấn mạnh quá mức quan hệ thời gian.
- source_word: ἐπορεύθησαν
  choice: họ đi
  rationale: Động từ πορεύομαι chỉ việc đi, lên đường hoặc di chuyển; “họ đi” gọn, tự nhiên và giữ nguyên nghĩa chuyển động cơ bản.
- source_word: εἰς
  choice: sang
  rationale: Giới từ εἰς với động từ chuyển động đánh dấu đích đến; “sang” phù hợp khi nói việc rời một làng để đến làng khác.
- source_word: ἑτέραν
  choice: khác
  rationale: ἕτερος có thể mang nghĩa “khác” hoặc “một ... khác”; cách dịch này vừa tự nhiên vừa giữ sắc thái phân biệt với ngôi làng trước.
- source_word: κώμην
  choice: một làng
  rationale: κώμη chỉ một làng hay khu dân cư nhỏ, không phải thành phố; “làng” là từ tương ứng chính xác và phổ thông.
