id: LUK.9.16
reference: Luke 9:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: vi
  text: Rồi Ngài cầm năm chiếc bánh và hai con cá, ngước mắt lên trời, chúc phước cho chúng[a], bẻ ra và cứ trao cho các môn đồ để họ đặt trước mặt đám đông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu theo nghĩa: “dâng lời tạ ơn về những thức ăn ấy.” Tuy nhiên, động từ Hy Lạp ở đây là “chúc phước”; một số trình thuật song song dùng “tạ ơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: Rồi Ngài cầm
  rationale: Phân từ bất định cùng liên từ δὲ dẫn sang hành động kế tiếp trong câu chuyện; “Rồi… cầm” tự nhiên trong tiếng Việt và giữ đúng trình tự.
- source_word: τοὺς πέντε ἄρτους
  choice: năm chiếc bánh
  rationale: ἄρτος ở đây chỉ các ổ hoặc phần bánh riêng; “chiếc bánh” rõ nghĩa và tự nhiên hơn danh từ khối “bánh” đơn thuần.
- source_word: τοὺς δύο ἰχθύας
  choice: hai con cá
  rationale: Cách diễn đạt thông dụng, cụ thể trong tiếng Việt.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ngước mắt lên trời
  rationale: Diễn đạt tự nhiên tư thế nhìn lên, đồng thời “trời” trong ngữ cảnh cầu nguyện giữ được chiều kích hướng về nơi Đức Chúa Trời ngự.
- source_word: εὐλόγησεν αὐτοὺς
  choice: chúc phước cho chúng
  rationale: Giữ động từ “chúc phước” và đại từ số nhiều giống đực αὐτούς, vốn quy chiếu tự nhiên đến bánh và cá, thay vì đồng nhất với động từ “tạ ơn” ở các trình thuật song song.
- source_word: κατέκλασεν
  choice: bẻ ra
  rationale: Chỉ hành động bẻ thức ăn thành phần để phân phát; tiếng Việt có thể lược đại từ mà vẫn rõ đối tượng.
- source_word: ἐδίδου
  choice: cứ trao
  rationale: '“Cứ” thể hiện sắc thái tiếp diễn hoặc lặp lại của thì chưa hoàn thành: Ngài liên tục trao thức ăn trong lúc phân phát.'
- source_word: τοῖς μαθηταῖς
  choice: cho các môn đồ
  rationale: Giữ danh từ có mạo từ mà không thêm ý sở hữu không được nói rõ trong nguyên văn.
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: để họ dọn ra trước đám đông
  rationale: Động từ nguyên mẫu diễn tả mục đích; “dọn ra trước” giữ ý cụ thể là đặt thức ăn trước mặt người ta, không thu hẹp thành nghĩa diễn giải “phục vụ”.
theological_decisions:
- issue: Ý nghĩa của οὐρανός trong bối cảnh cầu nguyện
  choice: trời
  alternative: bầu trời
  rationale: “Trời” vừa tự nhiên trong cụm “ngước mắt lên trời” vừa giữ chiều kích tôn giáo của hành động, còn “bầu trời” dễ chỉ gợi không gian vật lý.
- issue: Cách dịch εὐλόγησεν
  choice: chúc phước cho chúng
  alternative: tạ ơn về những thức ăn ấy
  rationale: Nguyên văn dùng εὐλογέω, “chúc phước,” chứ không dùng εὐχαριστέω, “tạ ơn.” Giữ cách nói của Lu-ca tránh hòa đồng với các trình thuật song song và bảo tồn sự căng nghĩa rằng đối tượng trực tiếp là bánh cùng cá.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo lối kính trọng phổ biến; “môn đồ” giữ thuật ngữ Kinh Thánh quen thuộc. Cấu trúc câu bảo tồn chuỗi hành động của nguyên văn và sắc thái tiếp diễn của ἐδίδου.
