  terminology: “Ngài,” “môn đồ,” “chúc phước,” và “đám đông” phù hợp với văn phong trang trọng vừa phải. “Trời” là cách nói tự nhiên ở đây và vẫn bảo toàn ngữ cảnh hướng lên thiên thượng.
  issues:
