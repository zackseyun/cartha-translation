id: LUK.9.22
reference: Luke 9:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: vi
  text: 'Ngài phán: “Con Người phải chịu nhiều điều đau khổ, bị các trưởng lão, các thượng tế và các kinh sư bác bỏ, bị giết, và vào ngày thứ ba được sống lại.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπὼν
  choice: Ngài phán
  rationale: Phân từ bất định quá khứ của λέγω nối lời này với mạch kể trước đó. Trong tiếng Việt, dùng động từ hữu hạn là tự nhiên hơn mà vẫn thể hiện đây là lời Đức Giê-su nói.
- source_word: Δεῖ
  choice: phải
  rationale: Diễn đạt sự cần thiết mạnh mẽ, trong ngữ cảnh hàm ý điều nằm trong chương trình của Đức Chúa Trời, nhưng không thêm tác nhân hay giải thích cơ chế mà bản văn không nêu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng quen thuộc và các liên hệ liên văn bản của cụm từ, thay vì diễn giải thành một cách gọi chung về con người.
- source_word: πολλὰ παθεῖν
  choice: chịu nhiều đau khổ
  rationale: Diễn đạt tự nhiên nội dung ‘chịu nhiều điều’ trong tiếng Việt, đồng thời giữ phạm vi rộng của những đau khổ được nói đến.
- source_word: ἀποδοκιμασθῆναι
  choice: bị … loại bỏ
  rationale: Động từ chỉ việc bị bác bỏ sau khi xem xét; ‘loại bỏ’ vừa rõ nghĩa vừa phù hợp với hành động chính thức của giới lãnh đạo.
- source_word: πρεσβυτέρων
  choice: các trưởng lão
  rationale: Giữ thuật ngữ chỉ nhóm lãnh đạo được công nhận trong cộng đồng Do Thái.
- source_word: ἀρχιερέων
  choice: các thượng tế
  rationale: Chỉ giới tư tế cấp cao trong bối cảnh Đền Thờ, không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm duy nhất.
- source_word: γραμματέων
  choice: các kinh sư
  rationale: Thuật ngữ tiếng Việt hiện đại, dễ hiểu, chỉ những người chuyên thông thạo và giảng giải Kinh Luật.
- source_word: ἀποκτανθῆναι
  choice: bị giết
  rationale: Giữ thể bị động và cách diễn đạt trực tiếp của nguyên văn.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: đến ngày thứ ba
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, tương ứng với định ngữ cách chỉ thời điểm trong tiếng Hy Lạp.
- source_word: ἐγερθῆναι
  choice: được làm cho sống lại
  rationale: Giữ sắc thái bị động của động từ Hy Lạp và ngụ ý một tác nhân làm cho sống lại, nhưng không nêu đích danh tác nhân vì câu gốc cũng không nêu.
theological_decisions:
- issue: Thể bị động của động từ phục sinh
  choice: được làm cho sống lại
  alternative: sống lại
  rationale: Nguyên văn dùng động từ nguyên mẫu bị động ἐγερθῆναι. Bản dịch giữ hành động được tác động trên Con Người, thay vì chuyển thành chủ động và qua đó làm mất sắc thái thần học về tác nhân không được nói rõ.
- issue: Sắc thái của Δεῖ
  choice: Con Người phải
  alternative: Điều cần thiết là Con Người phải
  rationale: ‘Phải’ giữ đầy đủ ý nghĩa về sự cần thiết trong chương trình cứu chuộc mà không khiến câu tiếng Việt nặng nề; bản dịch không giải thích thêm nguồn gốc của sự cần thiết ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Câu giữ chuỗi các động từ bị động của nguyên văn, đồng thời dùng cấu trúc tiếng Việt tự nhiên. ‘Ngài phán’ phù hợp với ngữ cảnh lời Đức Giê-su và tránh lối dịch phân từ quá cứng.
