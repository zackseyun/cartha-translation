revisions:
- from: 'Ngài phán: “Con Người phải chịu nhiều đau khổ, bị các trưởng lão, các thượng tế và các kinh sư loại bỏ, bị giết, rồi đến ngày thứ ba được làm cho sống lại.”'
  to: 'Ngài phán: “Con Người phải chịu nhiều điều đau khổ, bị các trưởng lão, các thượng tế và các kinh sư bác bỏ, bị giết, và vào ngày thứ ba được sống lại.”'
  rationale: Bản sửa giữ các động từ bị động, đặc biệt «được sống lại» cho ἐγερθῆναι, không nêu thêm tác nhân. «Nhiều điều đau khổ» bảo toàn πολλὰ, «bác bỏ» phản ánh chính xác hơn ἀποδοκιμασθῆναι, và «vào ngày thứ ba» bám sát trạng ngữ thời gian của nguyên văn.
  reviewer_model: gpt-5.6-terra
