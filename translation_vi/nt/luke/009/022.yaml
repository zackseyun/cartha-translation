review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: sự tất yếu, danh xưng «Con Người», chuỗi chịu khổ—bị bác bỏ—bị giết—được phục sinh vào ngày thứ ba. Tuy nhiên, «chịu nhiều đau khổ» phần nào thu hẹp πολλὰ («nhiều điều») thành mức độ đau khổ; «loại bỏ» kém chính xác hơn đối với sự bác bỏ chính thức; và «rồi đến ngày thứ ba» thêm sắc thái trình tự không cần thiết.'
  naturalness: Câu nhìn chung trang trọng, rõ ràng và hiện đại. «Được làm cho sống lại» hiểu được nhưng hơi nặng; «được sống lại» gọn hơn trong văn phong Kinh Thánh tiếng Việt, đồng thời vẫn biểu đạt thể bị động.
  terminology: «Con Người», «trưởng lão», «thượng tế», và «kinh sư» đều phù hợp với cách dùng hiện đại và bối cảnh Do Thái thế kỷ thứ nhất. «Bác bỏ» phù hợp hơn «loại bỏ» cho ἀποδοκιμασθῆναι.
  issues:
  - severity: low
    issue: «chịu nhiều đau khổ» không biểu đạt rõ số nhiều «nhiều điều» của πολλὰ.
    rationale: Cụm Hy Lạp πολλὰ παθεῖν nói đến việc chịu «nhiều điều»; thêm «điều» giữ được bề rộng biểu đạt mà vẫn tự nhiên.
  - severity: medium
    issue: «bị ... loại bỏ» chưa phản ánh sát sắc thái ἀποδοκιμασθῆναι.
    rationale: Động từ này chỉ việc bị bác bỏ/khước từ sau sự đánh giá; «bị ... bác bỏ» tự nhiên hơn trong tiếng Việt và sát bối cảnh sự phủ nhận của các nhóm lãnh đạo.
  - severity: low
    issue: «rồi đến ngày thứ ba» có thể gợi một bước chuyển thời gian mạnh hơn nguyên văn.
    rationale: Liên từ καί chỉ nối tiếp chuỗi các biến cố; «và vào ngày thứ ba» diễn đạt thời điểm trực tiếp hơn.
  revised_text: 'Ngài phán: “Con Người phải chịu nhiều điều đau khổ, bị các trưởng lão, các thượng tế và các kinh sư bác bỏ, bị giết, và vào ngày thứ ba được sống lại.”'
