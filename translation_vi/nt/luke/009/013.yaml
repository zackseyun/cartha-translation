source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Chính anh em hãy cho họ ăn.” Họ đáp: “Chúng ta chẳng có gì ngoài năm cái bánh và hai con cá, trừ khi chính chúng ta đi mua thức ăn cho toàn thể số người này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δότε ... ὑμεῖς φαγεῖν
  choice: Chính anh em hãy cho họ ăn
  rationale: Mệnh lệnh Δότε kết hợp với động từ nguyên mẫu φαγεῖν có nghĩa tự nhiên là cho người khác ăn; đại từ ὑμεῖς được nêu rõ để nhấn mạnh chủ thể, nên dịch bằng “chính anh em”.
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: Chúng ta không có gì hơn ngoài
  rationale: Cụm phủ định diễn tả sự giới hạn về những gì họ đang có; cách nói này giữ được nghĩa “không hơn” mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἄρτοι πέντε
  choice: năm cái bánh
  rationale: ἄρτοι ở đây chỉ những ổ hoặc chiếc bánh riêng lẻ. “Năm cái bánh” là cách nói phổ thông, không áp đặt hình dạng hay kích thước hiện đại lên loại bánh cổ.
- source_word: ἰχθύες δύο
  choice: hai con cá
  rationale: Cách dịch trực tiếp và tự nhiên của danh từ số nhiều ἰχθύες trong ngữ cảnh thực phẩm.
- source_word: εἰ μήτι
  choice: trừ khi
  rationale: Cụm này đưa ra một ngoại lệ có sắc thái dè dặt hoặc phản vấn; “trừ khi” bảo toàn quan hệ logic mà không cường điệu cảm xúc.
- source_word: πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: chính chúng ta đi mua
  rationale: Phân từ πορευθέντες phụ thuộc vào ἀγοράσωμεν, được diễn đạt tự nhiên bằng hai động tác nối tiếp “đi mua”; ἡμεῖς được nêu rõ nên “chính chúng ta” giữ lại sắc thái nhấn mạnh.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: cả đoàn dân này
  rationale: λαός chỉ tập thể dân chúng hiện diện. “Đoàn dân” giữ sắc thái tập thể và từ chỉ định “này”, đồng thời tránh cách nói thiếu tự nhiên “tất cả dân này”.
- source_word: βρώματα
  choice: thức ăn
  rationale: Danh từ số nhiều chỉ đồ ăn; tiếng Việt tự nhiên dùng danh từ khối “thức ăn” trong ngữ cảnh này.
theological_decisions:
- issue: Sắc thái mệnh lệnh của Chúa Giê-su và lời đáp của các môn đồ
  choice: Diễn đạt mệnh lệnh trực tiếp, giữ sự nhấn mạnh của ὑμεῖς nhưng không thêm giọng trách móc; lời đáp nêu khó khăn thực tế.
  alternative: Có thể lược “chính” để câu nhẹ hơn, hoặc dùng dấu câu và từ ngữ khiến lời đáp mang vẻ bực bội hơn.
  rationale: Bản Hy Lạp nhấn mạnh các môn đồ bằng đại từ ὑμεῖς, nhưng không minh thị sự mỉa mai, quở trách hay bực tức. Bản dịch giữ sự căng thẳng của cuộc đối thoại mà không giải nghĩa quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo ngữ cảnh gần; “anh em” trong lời Ngài nói với nhóm môn đồ và “chúng ta” trong lời các môn đồ nhằm giữ quan hệ ngôi xưng tự nhiên. Không cần chú thích vì các sắc thái quan trọng của hai đại từ nhấn mạnh đã được thể hiện ngay trong câu.
