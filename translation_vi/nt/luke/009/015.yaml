  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οὕτως καὶ ⸀κατέκλιναν ἅπαντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/015.yaml
  text: And they did so[a], and had them all sit down.
translation:
  language: vi
  text: Họ làm như vậy[a] và cho mọi người ngồi xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “xếp mọi người vào chỗ” hoặc “cho mọi người nằm tựa xuống.” Động từ Hy Lạp nói đến việc sắp xếp người ta vào tư thế dùng bữa, thường là tư thế nằm tựa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Họ
  rationale: Liên từ mở đầu nối hành động này với mệnh lệnh ở câu trước; trong tiếng Việt, không nhất thiết dịch thành “và” khi mở câu để lời kể tự nhiên, còn chủ ngữ “họ” được nêu rõ từ ngữ cảnh.
- source_word: ἐποίησαν οὕτως
  choice: làm như vậy
  rationale: Cụm này hồi chỉ cách thức Chúa Giê-su vừa truyền ở câu trước; “làm như vậy” vừa tự nhiên vừa giữ nghĩa của cả động từ và trạng từ.
- source_word: καὶ
  choice: và
  rationale: Giữ quan hệ phối hợp và trình tự kể chuyện đơn giản giữa hai hành động.
- source_word: κατέκλιναν
  choice: cho … ngồi xuống
  rationale: Động từ mang sắc thái khiến người khác vào tư thế dùng bữa, thường là nằm tựa theo tập quán cổ. “Cho … ngồi xuống” giữ sắc thái tác động mà vẫn rõ ràng, tự nhiên với độc giả hiện đại.
- source_word: ἅπαντας
  choice: mọi người
  rationale: Diễn đạt đầy đủ ý toàn thể của đại từ số nhiều, chỉ toàn bộ đám đông trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch ưu tiên cách nói tự nhiên “cho mọi người ngồi xuống,” còn chú thích bảo lưu nét văn hóa và sắc thái khiến khiến của động từ Hy Lạp.
