source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: vi
  text: Khi những ngày Ngài được cất lên đang dần trọn[a], chính Ngài kiên quyết hướng mặt về Giê-ru-sa-lem để đi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự thăng thiên của Ngài.” Tiếng Hy Lạp nói sát nghĩa là “việc Ngài được cất lên.”'
    reason: alternative_reading
  - marker: b
    text: “Kiên quyết hướng mặt” là một thành ngữ diễn tả quyết tâm vững vàng.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Khi …
  rationale: Đây là công thức chuyển tiếp tự sự, gắn với mệnh đề thời gian theo sau. Trong tiếng Việt, cấu trúc “Khi …” truyền đạt tự nhiên việc câu chuyện bước sang biến cố này, tránh lối dịch cứng và cổ như “việc xảy ra là.”
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: Khi những ngày … sắp trọn
  rationale: Giữ hình ảnh “những ngày” và diễn đạt tiến trình một thời kỳ đang đi đến chỗ hoàn tất. “Sắp trọn” tự nhiên hơn “đang được làm cho trọn” trong tiếng Việt mà vẫn giữ sắc thái chưa hoàn tất hẳn.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: Ngài được cất lên
  rationale: “Được cất lên” phản ánh nghĩa thụ động và nghĩa đen của ἀνάλημψις, đồng thời không thu hẹp ngay phạm vi chỉ còn sự thăng thiên.
- source_word: καὶ αὐτὸς
  choice: chính Ngài
  rationale: Giữ sắc thái nhấn mạnh của αὐτός mà tiếng Việt có thể diễn đạt tự nhiên bằng “chính Ngài.”
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: kiên quyết hướng mặt
  rationale: Giữ hình ảnh “mặt” của nguyên văn nhưng thêm “kiên quyết” để ý nghĩa thành ngữ về quyết tâm được rõ ràng đối với độc giả hiện đại.
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: về Giê-ru-sa-lem mà đi
  rationale: Diễn đạt hướng đi và mục đích của hành trình bằng trật tự từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἀνάλημψις αὐτοῦ
  choice: Ngài được cất lên
  alternative: sự thăng thiên của Ngài; sự ra đi của Ngài
  rationale: Cách dịch chính bám sát nghĩa của danh từ Hy Lạp và giữ khả năng câu này nhìn toàn bộ hành trình qua sự chết, phục sinh và được tôn cao, thay vì mặc nhiên giới hạn vào riêng biến cố thăng thiên.
- issue: Sắc thái thành ngữ τὸ πρόσωπον ἐστήρισεν
  choice: kiên quyết hướng mặt
  alternative: quyết tâm; nhất quyết
  rationale: Giữ được hình ảnh văn chương và âm hưởng ngôn ngữ tiên tri, đồng thời làm rõ rằng câu nói diễn tả quyết tâm vững vàng chứ không chỉ một động tác quay mặt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo lối xưng hô Kinh Thánh phổ thông; giữ địa danh “Giê-ru-sa-lem.” Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
