- from: Khi những ngày Ngài được cất lên sắp trọn[a], chính Ngài kiên quyết hướng mặt về Giê-ru-sa-lem mà đi[b].
  to: Khi những ngày Ngài được cất lên đang dần trọn[a], chính Ngài kiên quyết hướng mặt về Giê-ru-sa-lem để đi[b].
  rationale: Bản sửa giữ nguyên cách hiểu rộng về ἀνάλημψις và hình ảnh thành ngữ của τὸ πρόσωπον ἐστήρισεν, đồng thời sửa sắc thái tiến trình của συμπληροῦσθαι và làm câu tiếng Việt trôi chảy hơn. Các vị trí chú thích vẫn gắn với đúng cụm từ được giải thích.
