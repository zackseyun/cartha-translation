id: LUK.9.18
reference: Luke 9:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: vi
  text: 'Có lần, khi Ngài đang cầu nguyện một mình[a], các môn đồ ở cùng Ngài. Ngài hỏi họ: “Dân chúng nói Ta là ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở nơi riêng tư”. Cụm từ Hy Lạp κατὰ μόνας có thể chỉ sự tách biệt, không nhất thiết là hoàn toàn không có ai ở gần.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Có lần
  rationale: Diễn đạt tự nhiên công thức tường thuật thường gặp của Lu-ca, đánh dấu một sự việc trong mạch truyện mà không dùng lối cổ.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: khi Ngài đang cầu nguyện
  rationale: Cấu trúc nguyên mẫu có mạo từ với ἐν chỉ hoàn cảnh đồng thời; “khi… đang” truyền đạt rõ tiến trình đang diễn ra.
- source_word: κατὰ μόνας
  choice: một mình
  rationale: Giữ nghĩa trực tiếp là cầu nguyện riêng một mình, đồng thời có chú thích nêu khả năng hiểu là ở nơi riêng tư.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: các môn đồ ở cùng Ngài
  rationale: Bảo toàn cách diễn đạt quan hệ đơn giản của Hy Lạp và không tự ý giải thích rằng họ vừa đến hay chỉ đứng gần đó.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Ngài hỏi họ
  rationale: Tiếng Việt tự nhiên không cần giữ phân từ “nói rằng” sau động từ hỏi; nội dung phát ngôn trực tiếp vẫn đầy đủ.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Dân chúng nói Ta là ai?
  rationale: Đảo thành trật tự câu hỏi tự nhiên trong tiếng Việt; “dân chúng” diễn đạt tập thể quần chúng mà không dùng từ cổ “đám đông” trong ngữ cảnh hỏi về dư luận.
theological_decisions:
- issue: Sự căng thẳng bề mặt giữa việc Chúa Giê-su cầu nguyện “một mình” và các môn đồ “ở cùng Ngài”
  choice: 'Giữ nguyên cả hai ý: Ngài cầu nguyện một mình, còn các môn đồ ở cùng Ngài.'
  alternative: Dịch κατὰ μόνας là “ở nơi riêng tư” hoặc thêm rằng các môn đồ ở gần đó để làm rõ hoàn cảnh.
  rationale: Nguyên văn cho phép hiểu sự đơn độc theo nghĩa cầu nguyện riêng hoặc tách biệt tương đối. Bản dịch không tự ý dung hòa hai mệnh đề; chú thích bảo tồn khả năng nghĩa kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài”, “Ta” và “môn đồ” theo văn phong Kinh Thánh tiếng Việt thông dụng; tránh cấu trúc cổ “xảy ra rằng”. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
