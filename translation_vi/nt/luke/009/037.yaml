  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: vi
  text: Ngày hôm sau[a], khi họ từ trên núi xuống, một đám đông lớn đến gặp Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Ngày kế tiếp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: không dịch thành một cụm riêng
  rationale: Cụm này chủ yếu làm chức năng chuyển tiếp trong lời kể. Câu tiếng Việt chuyển cảnh tự nhiên bằng cụm thời gian ở đầu câu, nên không cần thêm “Bấy giờ” hay “Và xảy ra rằng”.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: Ngày hôm sau
  rationale: Diễn đạt tự nhiên, rõ nghĩa và sát với thành ngữ chỉ thời gian vào ngày kế tiếp.
- source_word: κατελθόντων αὐτῶν
  choice: khi họ từ trên núi xuống
  rationale: Giữ chức năng nêu hoàn cảnh của kết cấu sở hữu cách tuyệt đối; cách diễn đạt này tự nhiên trong tiếng Việt mà không áp đặt trình tự chi tiết hơn nguyên văn.
- source_word: ἀπὸ τοῦ ὄρους
  choice: từ trên núi
  rationale: ὄρος trong ngữ cảnh này phù hợp nhất với “núi”; thêm “trên” tạo kết hợp tự nhiên với động từ “xuống” trong tiếng Việt.
- source_word: συνήντησεν αὐτῷ
  choice: đến gặp Đức Chúa Jêsus
  rationale: Động từ có thể chỉ việc gặp hoặc đi ra gặp. “Đến gặp” tự nhiên và thể hiện hướng về đối tượng; thay đại từ bằng danh xưng để tránh sự mơ hồ hoặc gượng gạo của “gặp Ngài” sau chủ ngữ số nhiều gần đó.
- source_word: ὄχλος πολύς
  choice: một đám đông lớn
  rationale: Diễn đạt trực tiếp quy mô của đám đông bằng tiếng Việt hiện đại, trang trọng vừa phải.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, sáng rõ và trang nghiêm; cấu trúc câu kể tự nhiên. Dùng “Đức Chúa Jêsus” để xác định rõ đối tượng của đại từ αὐτῷ theo văn cảnh.
