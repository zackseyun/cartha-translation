base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: vi
  text: 'Ngài phán với họ: “Đừng mang theo gì cho cuộc hành trình—không gậy, không túi đi đường, không bánh, không tiền bạc; cũng không được mỗi người có hai chiếc áo trong.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Đừng mang theo gì cho cuộc hành trình
  rationale: Diễn đạt tự nhiên mệnh lệnh chuẩn bị lên đường, đồng thời giữ nghĩa phủ định bao quát của Μηδέν.
- source_word: ῥάβδον
  choice: gậy
  rationale: Trong bối cảnh đi đường, từ này chỉ cây gậy dùng khi di chuyển; “gậy” ngắn gọn và dễ hiểu.
- source_word: πήραν
  choice: túi đi đường
  rationale: πήρα là túi dùng để mang vật dụng hoặc lương thực khi đi đường; cách dịch này cụ thể hơn “túi” mà vẫn tự nhiên.
- source_word: ἄρτον
  choice: bánh
  rationale: Giữ vật phẩm cụ thể trong nguyên văn; trong bối cảnh Kinh Thánh, “bánh” là cách gọi quen thuộc cho bánh mì làm lương thực.
- source_word: ἀργύριον
  choice: tiền bạc
  rationale: Nghĩa đen liên quan đến bạc, nhưng ở đây chỉ tiền dùng để chi tiêu; “tiền bạc” chuyển tải đúng chức năng trong ngữ cảnh.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: đừng có mỗi người hai chiếc áo trong
  rationale: Nêu rõ lực phân phối của ἀνά (“mỗi người”) và giữ chi tiết hai chiếc áo.
- source_word: χιτῶνας
  choice: áo trong
  rationale: χιτών là loại áo mặc sát người bên dưới áo choàng; “áo trong” dễ hiểu hơn thuật ngữ vay mượn và giữ được đặc điểm lịch sử cơ bản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “Ngài” làm đại từ kể chuyện chỉ Chúa Giê-su; cấu trúc liệt kê giữ nhịp mệnh lệnh dứt khoát của nguyên văn. Không thêm chú thích vì các nét nghĩa cần thiết có thể thể hiện rõ ngay trong câu.
