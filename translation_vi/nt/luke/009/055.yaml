review_pass:
  verdict: revise
  source_fidelity: 'Chính văn phản ánh đúng bản đọc ngắn của SBLGNT: στραφεὶς δὲ ἐπετίμησεν αὐτοῖς. Tuy nhiên, việc thêm danh xưng “Đức Chúa” vào chủ ngữ không được biểu thị trong câu Hy Lạp này; “Người” theo mạch văn giữ sát hơn chủ ngữ hàm ẩn. Chú thích cần diễn đạt πνεύματος là “thần/tinh thần” chứ không phải “thần linh” như một loại hữu thể siêu nhiên.'
  naturalness: “Quay lại và quở trách họ” tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại. “Người” là cách quy chiếu tự nhiên đến Chúa Giê-su trong văn mạch Kinh Thánh mà không lặp tên hay thêm tước hiệu. Trong chú thích, “mình thuộc về loại thần nào” không tự nhiên và dễ hiểu sai; “tinh thần nào” bảo toàn tốt hơn cách nói về ‘spirit’ trong dị bản.
  terminology: Giữ “quở trách” cho ἐπετίμησεν và “Con Người” cho ὁ υἱὸς τοῦ ἀνθρώπου. Đổi cách viết tên và tước hiệu ra khỏi chính văn không phải là phủ nhận danh xưng, mà là tránh đưa một tước hiệu không có trong câu nguồn. Trong dị bản, “tinh thần” phù hợp hơn “thần linh”, vốn thường chỉ các hữu thể thần linh.
  issues:
  - severity: medium
    issue: Chính văn thêm danh xưng “Đức Chúa”
    rationale: Bản Hy Lạp chỉ dùng chủ ngữ hàm ẩn qua phân từ và động từ; danh xưng này không có trong câu. “Người” xác định chủ ngữ theo ngữ cảnh mà không thêm tước hiệu.
  - severity: medium
    issue: Chú thích dịch πνεύματος là “loại thần linh nào”
    rationale: “Thần linh” trong tiếng Việt thường gợi một hữu thể siêu nhiên; πνεύματος trong câu dị bản có thể chỉ đặc tính/tinh thần và không nên bị thu hẹp như vậy. Cách diễn đạt hiện tại cũng không tự nhiên.
  - severity: low
    issue: Dạng chính tả “Jêsus” không phải chuẩn chính tả Việt ngữ hiện đại phổ thông
    rationale: Nếu cần nêu tên trong phần văn bản này, “Giê-su” là dạng hiện hành phổ biến hơn; tuy nhiên bản sửa dùng “Người” trong chính văn nên tránh áp đặt quy ước tên riêng.
  revised_text: Nhưng Người quay lại và quở trách họ.[a]
