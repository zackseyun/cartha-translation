  text: But he turned and rebuked them[a].
translation:
  language: vi
  text: Nhưng Người quay lại và quở trách họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản muộn thêm: “và nói: ‘Các con không biết mình có tinh thần nào; vì Con Người đến không phải để hủy diệt mạng sống của người ta, nhưng để cứu.’”'
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: quay lại
  rationale: Phân từ bất định của στρέφω diễn tả việc Đức Chúa Jêsus xoay người hướng về các môn đồ trước khi quở trách; “quay lại” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự tương phản nhẹ với lời đề nghị ngay trước đó của các môn đồ; “Nhưng” phù hợp với mạch văn.
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: ἐπιτιμάω ở đây chỉ sự khiển trách bằng lời một cách nghiêm khắc; “quở trách” trang trọng, tự nhiên và không diễn giải quá mức.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều cách gián tiếp chỉ những môn đồ vừa lên tiếng, trong ngữ cảnh trực tiếp là Gia-cơ và Giăng; cấu trúc tiếng Việt tự nhiên là “quở trách họ”.
theological_decisions:
- issue: Phần văn bản dài hơn xuất hiện trong một số thủ bản muộn
  choice: 'Chỉ dịch bản văn SBLGNT ngắn: “Nhưng Đức Chúa Jêsus quay lại và quở trách họ.”'
  alternative: '“Nhưng Đức Chúa Jêsus quay lại, quở trách họ và phán: ‘Các con không biết mình thuộc loại thần linh nào; vì Con Người đến không phải để hủy diệt mạng sống người ta, nhưng để cứu.’”'
  rationale: Nguồn Hy Lạp được cung cấp chỉ có bản đọc ngắn. Không đưa phần bổ sung quen thuộc trong truyền thống thủ bản Byzantine/Textus Receptus vào chính văn, nhưng ghi nhận trong chú thích vì đây là một dị bản đáng kể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để làm rõ chủ thể vốn được hàm ẩn trong động từ Hy Lạp theo mạch văn; “quở trách” giữ sắc thái nghiêm khắc của ἐπιτιμάω. Dấu chú thích [a] xuất hiện trong chính văn.
