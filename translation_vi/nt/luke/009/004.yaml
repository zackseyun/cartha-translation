  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: vi
  text: Bất cứ nhà nào anh em vào, hãy ở lại đó và từ đó ra đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκίαν
  choice: nhà
  rationale: Chỉ một ngôi nhà hoặc hộ gia đình nơi các môn đồ được đón tiếp; “nhà” giữ được nghĩa rộng tự nhiên trong tiếng Việt.
- source_word: μένετε
  choice: hãy ở lại
  rationale: Diễn đạt mệnh lệnh tiếp tục lưu lại tại chính ngôi nhà đã vào, không thêm ý giải thích ngoài câu Hy Lạp.
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: rồi từ đó ra đi
  rationale: Giữ điểm xuất phát được nhấn mạnh bởi ἐκεῖθεν và sắc thái ra đi của ἐξέρχεσθε; “rồi” làm quan hệ trình tự tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Lời văn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Đức Chúa Jêsus nói với các môn đồ, tránh thêm sắc thái phụ tử không có trong hình thái Hy Lạp. Giữ sự lặp lại “đó/từ đó” vì cấu trúc này nhấn mạnh việc ở nguyên tại nơi đã được tiếp đón rồi khởi hành từ chính nơi ấy.
