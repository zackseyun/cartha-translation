id: LUK.9.26
reference: Luke 9:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: vi
  text: Vì ai hổ thẹn về tôi và những lời của tôi, thì Con Người sẽ hổ thẹn về người ấy[a] khi ngài đến trong vinh quang của mình, của Cha và của các thiên sứ thánh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Con Người sẽ hổ thẹn về người này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cấu trúc Hy Lạp cũng có thể được diễn đạt: “khi ngài đến trong vinh quang của mình, và trong vinh quang của Cha và của các thiên sứ thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: Vì ai
  rationale: “Vì” thể hiện sắc thái giải thích của γάρ, còn “ai” diễn đạt tự nhiên cấu trúc quan hệ bất định mang nghĩa khái quát.
- source_word: ἐπαισχυνθῇ ... ἐπαισχυνθήσεται
  choice: hổ thẹn về ... sẽ hổ thẹn về
  rationale: Giữ cùng một cách dịch ở cả hai vế để bảo toàn tính đối ứng có chủ ý; “hổ thẹn về” trang trọng, tự nhiên và không diễn giải quá mức thành “chối bỏ” hay “khước từ”.
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: tôi và những lời của tôi
  rationale: Giữ trực tiếp cả đại từ με và danh từ λόγους; “những lời của tôi” rõ nghĩa hơn nhưng ít diễn giải hơn “điều tôi dạy”.
- source_word: τοῦτον
  choice: người ấy
  rationale: Đại từ hồi chỉ này quay lại “ai”; “người ấy” tự nhiên trong tiếng Việt, không buộc giới tính và vẫn giữ số ít cá thể.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh hiệu quen thuộc, bảo toàn hình thức Hy Lạp và âm hưởng liên văn bản, đặc biệt nền tảng Đa-ni-ên.
- source_word: ὅταν ἔλθῃ
  choice: khi ngài đến
  rationale: Diễn đạt giá trị thời gian tương lai của ὅταν với động từ giả định; “ngài” giúp xác định chủ thể là Con Người trong tiếng Việt.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: trong vinh quang của mình, của Cha và của các thiên sứ thánh
  rationale: Giữ một danh từ “vinh quang” chi phối chuỗi sở hữu cách, đồng thời bảo tồn khả năng hiểu đây là vinh quang gắn với Con Người, Cha và các thiên sứ thánh.
- source_word: ἅγιοι ἄγγελοι
  choice: các thiên sứ thánh
  rationale: Cách dịch trực tiếp và trang trọng, giữ đặc tính “thánh” của các thiên sứ.
theological_decisions:
- issue: Đại từ hồi chỉ sau cấu trúc số ít mang nghĩa khái quát
  choice: Con Người cũng sẽ hổ thẹn về người ấy
  alternative: Con Người cũng sẽ hổ thẹn về kẻ đó
  rationale: “Người ấy” bảo toàn số ít của τοῦτον, áp dụng cho bất cứ người nào mà không thêm sắc thái miệt thị hoặc giới hạn cảnh báo vào nam giới.
- issue: Mối liên hệ giữa vinh quang của Con Người, Cha và các thiên sứ thánh
  choice: trong vinh quang của mình, của Cha và của các thiên sứ thánh
  alternative: trong vinh quang của mình, và trong vinh quang của Cha cùng các thiên sứ thánh
  rationale: Bản chính giữ cấu trúc một giới từ và một danh từ “vinh quang” với ba thành phần sở hữu, không tự ý phân tách hay đồng nhất bản thể các chủ thể; chú thích nêu cách biểu đạt thay thế hợp ngữ pháp.
- issue: Sự đối ứng của động từ ἐπαισχύνομαι
  choice: hổ thẹn về ... cũng sẽ hổ thẹn về
  alternative: xấu hổ vì ... sẽ không nhìn nhận
  rationale: Lặp lại cùng động từ giữ nguyên sức nặng tu từ và sự căng thẳng thần học của lời cảnh báo, thay vì biến hệ quả thành một hành động cụ thể hơn điều nguyên văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” trong lời trực tiếp của Chúa Giê-su theo lối Việt ngữ tự nhiên; viết hoa “Con Người” như danh hiệu và “Cha” như cách gọi quy chiếu đến Đức Chúa Trời. Cấu trúc câu giữ sự đối ứng của nguyên văn mà không thêm ý “chối bỏ” hoặc “khước từ”.
