revisions:
- from: 'Nhưng Đức Chúa Jêsus đáp: “Ôi, thế hệ không tin và lệch lạc! Tôi còn phải ở với các người và chịu đựng các người cho đến bao giờ? Hãy đưa con trai của ông lại đây.”'
  to: 'Nhưng Đức Giê-su đáp: “Ôi, thế hệ không tin và sai lạc! Tôi còn phải ở với các người và chịu đựng các người cho đến bao giờ? Hãy đưa con trai của ông lại đây.”'
  rationale: Sửa tên riêng theo tiếng Việt chuẩn và loại bỏ tước hiệu không hiện diện trong nguyên văn câu này. Điều chỉnh “lệch lạc” thành “sai lạc” để phản ánh sát hơn lời quở trách của διεστραμμένη. Giữ “các người” để bảo toàn ngôi thứ hai số nhiều không xác định, và giữ “ông” ở mệnh lệnh cuối vì lời nói chuyển sang người cha.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc và nội dung chính: lời đáp của Đức Giê-su, lời quở trách tập thể, hai câu hỏi tu từ, và mệnh lệnh đem người con trai đến. Tuy nhiên, “Đức Chúa Jêsus” vừa dùng chính tả tên riêng không phải dạng hiện hành phổ biến trong tiếng Việt chuẩn, vừa thêm tước hiệu “Đức Chúa” không có trong ὁ Ἰησοῦς của câu này.'
  naturalness: Câu văn nhìn chung dễ hiểu. “thế hệ ... lệch lạc” hơi nhẹ và không diễn đạt rõ sắc thái bị làm cho sai vạy/lệch lạc về đạo đức của διεστραμμένη. “sai lạc” tự nhiên hơn trong lời quở trách trang trọng hiện đại.
  terminology: Dùng “Đức Giê-su” làm tên gọi trang trọng, hiện hành trong tiếng Việt chuẩn mà không thêm tước hiệu tương ứng với “Chúa/Lord” khi nguyên văn chỉ ghi Jesus. “không tin” và “con trai” là những lựa chọn chính xác.
  issues:
  - severity: medium
    issue: Tên gọi “Đức Chúa Jêsus” thêm tước hiệu và dùng dạng chính tả không trung tính/hiện hành trong tiếng Việt chuẩn.
    rationale: Nguyên văn γράφει ὁ Ἰησοῦς, nghĩa là “Đức Giê-su/Chúa Giê-su” tùy quy ước, nhưng không có κύριος (“Chúa”). Để không thêm sắc thái tước hiệu và tránh quy ước hệ phái, dùng “Đức Giê-su”.
  - severity: low
    issue: “lệch lạc” làm nhẹ διεστραμμένη.
    rationale: διεστραμμένη chỉ điều bị bẻ cong, sai vạy hoặc hư hỏng; “sai lạc” giữ lời quở trách rõ và tự nhiên hơn mà không ép nghĩa thành một cách giải thích cụ thể.
