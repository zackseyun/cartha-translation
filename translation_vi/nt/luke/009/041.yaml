  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp: “Ôi, thế hệ không tin và sai lạc! Tôi còn phải ở với các người và chịu đựng các người cho đến bao giờ? Hãy đưa con trai của ông lại đây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: thế hệ
  rationale: Diễn đạt tự nhiên danh từ chỉ lớp người cùng thời, đồng thời giữ phạm vi tập thể của lời quở trách.
- source_word: ἄπιστος
  choice: không tin
  rationale: Giữ nghĩa trực tiếp là thiếu đức tin hoặc không chịu tin, không thu hẹp thành một cách hiểu giáo phái.
- source_word: διεστραμμένη
  choice: lệch lạc
  rationale: Phản ánh ý nghĩa bị bẻ cong, sai lệch về đạo đức và tâm linh; tự nhiên hơn lối dịch quá sát là “cong vẹo” trong ngữ cảnh nói về một thế hệ.
- source_word: ἀνέξομαι
  choice: chịu đựng
  rationale: Giữ sức nặng của động từ chỉ việc nhẫn chịu, dung chịu một tình trạng khó chịu.
- source_word: προσάγαγε ὧδε
  choice: Hãy đưa ... lại đây
  rationale: Mệnh lệnh rõ ràng, tự nhiên, giữ ý dẫn hoặc đem người con đến chỗ Đức Chúa Jêsus.
- source_word: υἱόν
  choice: con trai
  rationale: Nguồn Hy Lạp chỉ rõ người con là nam; giữ thông tin giới tính thay vì dịch chung là “con”.
theological_decisions:
- issue: Đối tượng của lời quở trách “thế hệ không tin và lệch lạc”
  choice: Giữ đại từ số nhiều “các người” và không xác định hẹp đối tượng
  alternative: Giải thích lời quở trách chỉ dành cho các môn đồ, người cha, hoặc đám đông
  rationale: Văn bản dùng ὑμᾶς/ὑμῶν số nhiều nhưng không tự nó phân định chính xác mọi thành phần bị quở trách; bản dịch giữ độ mở ấy.
- issue: Sắc thái của câu hỏi “cho đến bao giờ?”
  choice: Giữ nguyên dạng câu hỏi tu từ
  alternative: Diễn giải thành lời tuyên bố về sự thiếu kiên nhẫn hoặc thời gian Đức Chúa Jêsus còn ở trần gian
  rationale: Câu Hy Lạp chứa cả sự quở trách lẫn căng thẳng về thời gian; không nên giải quyết hàm ý thần học bằng diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo quy ước tên gọi phổ biến trong Kinh Thánh Tin Lành tiếng Việt; lời quở trách giữ độ mạnh nhưng tránh từ cổ hoặc khó hiểu. Đại từ “Tôi/các người/ông” phản ánh chuyển đổi từ lời nói với tập thể sang mệnh lệnh dành cho người cha.
