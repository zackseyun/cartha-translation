  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: vi
  text: 'Lại có một người khác nói: “Thưa Chúa[a], tôi sẽ theo Ngài, nhưng trước hết xin cho tôi nói lời từ biệt với những người ở nhà tôi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được hiểu như một lời xưng hô kính trọng, tương đương “thưa ngài”; bản dịch giữ “Chúa” để không làm mất sức nặng thần học có thể có trong lời xưng hô này.
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: Cụm từ Hy Lạp dùng giới từ thường có nghĩa là “vào nhà tôi”; trong ngữ cảnh này, cụm từ chỉ những người đang ở nhà hoặc những người thuộc về nhà, gia hộ của người nói.
    reason: referential_ambiguity
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: Lại có một người khác nói
  rationale: “Lại” diễn đạt tự nhiên cả tính nối tiếp lẫn ý bổ sung của δὲ καὶ; “một người khác” giữ rõ nghĩa của ἕτερος.
- source_word: Ἀκολουθήσω σοι
  choice: tôi sẽ theo Ngài
  rationale: Thì tương lai diễn tả ý định đã tuyên bố của người nói; “sẽ theo” là cách nói tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: κύριε
  choice: Thưa Chúa
  rationale: “Chúa” giữ được cả sắc thái xưng hô tôn kính lẫn sức nặng thần học có thể có của κύριε; “thưa” làm cho lời trực tiếp tự nhiên trong tiếng Việt.
- source_word: πρῶτον δὲ ἐπίτρεψόν μοι
  choice: nhưng trước hết xin cho tôi
  rationale: “Nhưng trước hết” giữ thứ tự ưu tiên và sự đối lập; “xin cho tôi” diễn đạt tự nhiên lời cầu xin sự cho phép của mệnh lệnh ἐπίτρεψόν.
- source_word: ἀποτάξασθαι
  choice: nói lời từ biệt với
  rationale: Động từ trung gian ở đây có nghĩa xin cáo từ hoặc nói lời chia tay; cách dịch này rõ nghĩa mà không thêm ý người ấy phải trở về nhà.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: những người ở nhà tôi
  rationale: Cụm từ chỉ những người ở tại hoặc thuộc về nhà của người nói. Cách dịch này giữ hình ảnh “nhà” và không thu hẹp dứt khoát thành gia đình hay gia nhân.
theological_decisions:
- issue: Cách dịch κύριε khi người ấy trực tiếp thưa với Đức Giê-su
  choice: Chúa
  alternative: ngài; Thầy
  rationale: Trong văn cảnh này, κύριε có thể vừa là lời xưng hô kính trọng vừa hàm chứa sự nhìn nhận sâu hơn về căn tính của Đức Giê-su. “Chúa” bảo toàn sức căng ấy thay vì hạ nghĩa xuống chỉ còn một danh xưng xã giao hoặc chức năng dạy dỗ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi” cho người nói và “Ngài” để quy chiếu đến Đức Giê-su, tránh áp đặt quan hệ thân tộc qua đại từ “con”. “Nói lời từ biệt” trang nhã và chính xác hơn “chào tạm biệt” trong văn cảnh nghiêm trang này.
