  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: vi
  text: 'Nhưng Hê-rốt nói: “Giăng thì chính ta đã chém đầu rồi; vậy người này là ai mà ta nghe những chuyện như thế về người ấy?” Và vua vẫn tìm cách gặp người ấy.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vẫn tìm cách thấy người ấy” hoặc “đang tìm cách gặp người ấy.” Thì chưa hoàn thành trong tiếng Hy Lạp có thể chỉ hành động đang tiếp diễn hoặc lặp lại.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tiếp nối có nét tương phản với những lời đồn và các ý kiến vừa được kể ở câu trước.
- source_word: Ἡρῴδης
  choice: Hê-rốt
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: Giăng, chính ta đã chém đầu
  rationale: Giữ vị trí nổi bật của “Giăng” và sắc thái nhấn mạnh của đại từ ἐγώ; ἀποκεφαλίζω chỉ rõ hành động chém đầu.
- source_word: τίς δέ ἐστιν οὗτος
  choice: vậy người này là ai
  rationale: Diễn đạt tự nhiên câu hỏi trực tiếp, đồng thời giữ sắc thái xa cách của đại từ chỉ định οὗτος.
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: mà ta nghe những chuyện như thế về ông ấy
  rationale: Giữ nội dung khái quát của τοιαῦτα, không diễn giải thành các “báo cáo” cụ thể.
- source_word: ἐζήτει
  choice: vẫn tìm cách
  rationale: Thì chưa hoàn thành có thể gợi hành động đang tiếp diễn hoặc lặp lại; “vẫn tìm cách” truyền đạt sắc thái kéo dài mà không hàm ý chắc chắn đã thành công.
- source_word: ἰδεῖν αὐτόν
  choice: gặp ông
  rationale: Trong ngữ cảnh một vua muốn tiếp cận một người cụ thể, “gặp” là cách nói tự nhiên; nghĩa sát hơn “thấy ông” được ghi ở chú thích để bảo toàn khả năng từ vựng.
theological_decisions:
- issue: Lời Hê-rốt nói về Giăng và sự tò mò của vua đối với Đức Chúa Jêsus
  choice: Trình bày như một lời xác nhận lịch sử và một câu hỏi về căn tính, không thêm suy đoán rằng Hê-rốt nghĩ Giăng đã sống lại.
  alternative: Diễn giải rõ rằng Hê-rốt sợ người này là Giăng sống lại.
  rationale: Bản thân câu này chỉ nói Hê-rốt đã chém đầu Giăng, hỏi người đang được đồn đại là ai, rồi tìm cách gặp người ấy; bản dịch giữ nguyên sự dè dặt của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ta” trong lời vua tự nói và thêm “vua” ở mệnh đề cuối để tránh đại từ mơ hồ giữa Hê-rốt và Đức Chúa Jêsus. Tên “Giăng” và “Hê-rốt” theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
