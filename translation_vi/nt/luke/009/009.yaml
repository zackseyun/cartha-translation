revisions:
- from: 'Nhưng Hê-rốt nói: “Giăng, chính ta đã chém đầu; vậy người này là ai mà ta nghe những chuyện như thế về ông ấy?” Và vua vẫn tìm cách gặp ông.[a]'
  to: 'Nhưng Hê-rốt nói: “Giăng thì chính ta đã chém đầu rồi; vậy người này là ai mà ta nghe những chuyện như thế về người ấy?” Và vua vẫn tìm cách gặp người ấy.[a]'
  rationale: Sửa cụm đầu để tiếng Việt hoàn chỉnh và tự nhiên, đồng thời duy trì sự nhấn mạnh của “Giăng” và “chính ta” trong nguyên văn. Giữ “gặp” ở bản chính như một cách diễn đạt tự nhiên theo ngữ cảnh, nhưng điều chỉnh chú thích để nêu “thấy” là phương án sát từ vựng và bảo lưu sắc thái chưa hoàn thành của động từ Hy Lạp.
  reviewer_model: gpt-5.6-terra
