id: LUK.9.12
reference: Luke 9:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: vi
  text: 'Ngày bắt đầu ngả về chiều. Nhóm Mười Hai đến thưa với Ngài: “Xin hãy cho đoàn dân ra về, để họ đi vào các làng mạc và vùng quê chung quanh mà tìm chỗ trọ và kiếm lương thực[a], vì chúng ta đang ở đây, trong một nơi hoang vắng[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “kiếm thức ăn”. Từ Hy Lạp ἐπισιτισμός chỉ lương thực hoặc nguồn thực phẩm.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “một nơi vắng vẻ”. Từ Hy Lạp ἔρημος có thể chỉ một khu vực không có người ở hoặc thưa dân.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Ngày đã bắt đầu xế chiều
  rationale: κλίνειν với ἡμέρα diễn tả ngày ngả dần về chiều. “Bắt đầu xế chiều” truyền đạt tự nhiên cả ý khởi đầu lẫn thời điểm trong tiếng Việt, dù không giữ nguyên ẩn dụ “ngả xuống” một cách cứng nhắc.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: Mười Hai Sứ Đồ đến
  rationale: προσέρχομαι là đến gần hoặc tiến đến. “Đến” tự nhiên trong mạch kể; “Mười Hai Sứ Đồ” làm rõ danh xưng οἱ δώδεκα cho độc giả phổ thông mà không đồng nhất với đoàn dân.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Xin cho đoàn dân ra về
  rationale: ἀπολύω ở đây có nghĩa cho giải tán hoặc cho đi. Lời thưa “xin cho… ra về” vừa tự nhiên vừa phù hợp với cách các môn đồ nói với Chúa Giê-su.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: vào các làng mạc và vùng quê chung quanh
  rationale: κώμαι là làng mạc; ἀγροί trong ngữ cảnh có thể chỉ đồng ruộng, nông trại hoặc vùng thôn quê. “Vùng quê” giữ được nghĩa rộng và kết hợp tự nhiên với “làng mạc”.
- source_word: καταλύσωσιν
  choice: tìm chỗ trọ
  rationale: καταλύω ở đây nói đến việc nghỉ lại hoặc có nơi lưu trú. “Tìm chỗ trọ” diễn đạt rõ hàm ý trong tiếng Việt.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: kiếm lương thực
  rationale: ἐπισιτισμός chỉ thực phẩm hoặc đồ tiếp tế để ăn. “Lương thực” giữ sắc thái nguồn thực phẩm cần thiết, rộng hơn một bữa ăn cụ thể.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: vì ở đây chúng ta đang ở một nơi hoang vắng
  rationale: Giữ ὧδε bằng “ở đây” và đại từ số nhiều ἐσμέν bằng “chúng ta”. “Nơi hoang vắng” diễn tả khu vực ít hoặc không có dân cư mà không gán thêm ý nghĩa thần học.
theological_decisions:
- issue: Danh xưng οἱ δώδεκα
  choice: Mười Hai Sứ Đồ
  alternative: mười hai người
  rationale: Trong Lu-ca, “Nhóm Mười Hai” là danh xưng của các sứ đồ đã được Chúa Giê-su chọn. Bản dịch làm rõ danh xưng cho độc giả Việt nhưng không thêm tên riêng hay vai trò ngoài ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su trong câu dẫn và “xin” trong lời trực tiếp để thể hiện sự kính trọng. Tránh lối dịch quá sát như “ngày bắt đầu ngả xuống”, đồng thời giữ các chi tiết về chỗ trọ, lương thực và nơi hoang vắng.
