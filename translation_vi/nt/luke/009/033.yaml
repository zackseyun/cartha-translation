id: LUK.9.33
reference: Luke 9:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: vi
  text: 'Khi hai vị ấy đang rời khỏi Giê-su, Phi-e-rơ thưa với Ngài: “Thưa Thầy, chúng ta ở đây thì thật tốt. Chúng ta hãy dựng ba cái lều[a]: một cho Thầy, một cho Môi-se và một cho Ê-li.” Ông không biết mình đang nói gì.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chòi” hoặc “lều tạm”; theo truyền thống, có khi dịch là “nhà tạm.” Từ Hy Lạp skēnē chỉ nơi che trú tạm thời và có thể gợi đến hình ảnh Lễ Lều Tạm trong Kinh Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Khi hai vị ấy đang rời khỏi Đức Chúa Jêsus
  rationale: Cấu trúc kể chuyện ἐγένετο ἐν τῷ + động từ nguyên mẫu diễn tả hành động đồng thời. Đại từ số nhiều chỉ Môi-se và Ê-li đang tách khỏi Đức Chúa Jêsus; “hai vị ấy” làm rõ sở chỉ theo văn cảnh mà không biến họ thành chủ thể mơ hồ.
- source_word: Ἐπιστάτα
  choice: Thưa Thầy
  rationale: Đây là lối xưng hô kính trọng, thừa nhận thẩm quyền của Đức Chúa Jêsus. “Thưa Thầy” tự nhiên trong tiếng Việt, đồng thời không thu hẹp từ này chỉ vào chức năng giảng dạy như διδάσκαλε.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: chúng ta ở đây thật tốt
  rationale: Giữ nghĩa đánh giá trực tiếp của καλόν và diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ποιήσωμεν
  choice: Xin cho chúng con dựng
  rationale: Thể giả định ngôi thứ nhất số nhiều có lực đề nghị. Cách nói này tự nhiên khi Phi-e-rơ thưa với Đức Chúa Jêsus, đồng thời phản ánh nhóm môn đồ là những người dự định thực hiện việc dựng lều.
- source_word: σκηνὰς
  choice: cái lều
  rationale: σκηνή chỉ một nơi che trú tạm thời, thường là lều. “Lều” ngắn gọn, thông dụng và vẫn để ngỏ khả năng gợi nhắc hình ảnh Lễ Lều Tạm.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Ông không biết mình đang nói gì
  rationale: Phân từ diễn tả tình trạng thiếu nhận thức của Phi-e-rơ ngay lúc ông nói; thể hiện tại của λέγει được chuyển thành hành động đang diễn ra.
theological_decisions:
- issue: Ý nghĩa của σκηνάς trong bối cảnh hóa hình và khả năng liên hệ với Lễ Lều Tạm
  choice: lều
  alternative: chòi; lều tạm; đền tạm
  rationale: Câu này không nói rõ Phi-e-rơ đang chủ ý liên hệ đến Lễ Lều Tạm hay Đền Tạm. “Lều” giữ được nghĩa cơ bản và khả năng liên tưởng Kinh Thánh mà không áp đặt một cách giải thích thần học cụ thể.
- issue: Đối tượng đang rời khỏi Đức Chúa Jêsus
  choice: hai vị ấy, tức Môi-se và Ê-li theo văn cảnh
  alternative: họ
  rationale: Dạng αὐτούς có thể được dịch sát là “họ”, nhưng mạch văn cho thấy Môi-se và Ê-li là những người đang rời đi. Cách diễn đạt này tránh khiến độc giả hiểu rằng cả ba môn đồ đều rời khỏi Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thưa” để thể hiện lời xưng hô kính trọng; dùng “hai vị ấy” cho Môi-se và Ê-li. Giữ tên gọi “Đức Chúa Jêsus” và các dạng phiên âm quen thuộc “Phi-e-rơ,” “Môi-se,” “Ê-li.”
