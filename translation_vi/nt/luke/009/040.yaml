  terminology: “Môn đồ” là thuật ngữ Tin Mừng đã được sử dụng rộng rãi và phù hợp với μαθηταί. “Nó” duy trì được tính không xác định về đối tượng trong tiếng Việt; chú thích nêu rõ hai khả năng quy chiếu mà không quyết định thay cho nguyên văn.
