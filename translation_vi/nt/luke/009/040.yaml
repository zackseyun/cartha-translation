reference: Luke 9:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: vi
  text: Tôi đã van xin các môn đồ của Thầy đuổi nó ra[a], nhưng họ không làm được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đại từ này có thể chỉ thần linh ô uế, hoặc chỉ cậu bé.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: Tôi đã van xin
  rationale: Động từ diễn tả một lời cầu xin khẩn thiết; “van xin” giữ được sự cấp bách của người cha mà vẫn tự nhiên trong tiếng Việt.
- source_word: τῶν μαθητῶν σου
  choice: các môn đồ của Thầy
  rationale: “Môn đồ” bảo toàn mối quan hệ thầy–trò đặc trưng trong các sách Tin Mừng; “của Thầy” là cách xưng hô tự nhiên trong lời người cha nói trực tiếp với Chúa Giê-su.
- source_word: ἵνα ἐκβάλωσιν
  choice: đuổi nó ra
  rationale: Cấu trúc ἵνα với động từ giả định chỉ nội dung/mục đích của lời cầu xin. “Đuổi … ra” là thành ngữ tự nhiên trong ngữ cảnh trừ quỷ và phản ánh rõ ý của ἐκβάλλω.
- source_word: αὐτό
  choice: nó
  rationale: Đại từ giống trung nhiều khả năng quy chiếu về thần linh ô uế; “nó” giữ được cách quy chiếu bằng đại từ mà không thêm danh từ giải nghĩa.
- source_word: οὐκ ἠδυνήθησαν
  choice: họ không làm được
  rationale: Cách diễn đạt này truyền đạt trực tiếp sự bất lực hay không có khả năng thực hiện hành động, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτό trong bối cảnh trừ quỷ
  choice: Hiểu đại từ là chỉ thần linh/quỷ và dịch là “nó”.
  alternative: Có thể hiểu đại từ là chỉ cậu bé, cũng vẫn dịch tự nhiên là “nó” trong tiếng Việt.
  rationale: Trong ngữ cảnh trừ quỷ, ἐκβάλλω thường nhận quỷ hoặc thần linh làm tân ngữ, và giống trung phù hợp với πνεῦμα trong văn cảnh. Tuy nhiên, vì đại từ tiếng Việt “nó” có thể chỉ cả thần linh lẫn cậu bé, bản dịch chính tự nhiên giữ được phần nào sự mơ hồ của nguyên văn mà không buộc phải phân giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Thầy” trong lời thưa trực tiếp với Chúa Giê-su và “môn đồ” để giữ sắc thái thuật ngữ Tin Mừng. Đại từ “nó” tự nhiên trong tiếng Việt và đồng thời bảo toàn khả năng quy chiếu kép của nguyên văn.
