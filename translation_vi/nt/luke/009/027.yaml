  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: vi
  text: 'Nhưng tôi nói thật với anh em: trong số những người đang đứng đây, có vài người chắc chắn sẽ không nếm sự chết[a] cho đến khi họ thấy vương quốc của Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nếm sự chết” là một thành ngữ có nghĩa là chết.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Nhưng tôi nói thật với anh em
  rationale: “Nhưng” thể hiện δέ như một từ nối chuyển ý; “nói thật” diễn đạt tự nhiên trạng từ ἀληθῶς. “Anh em” giữ số nhiều của ὑμῖν và phù hợp với lời nói trực tiếp trang trọng nhưng dễ hiểu.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: có vài người trong số những người đang đứng đây
  rationale: Giữ rõ cấu trúc chỉ một bộ phận trong toàn thể của τινες τῶν ...; “đang đứng đây” diễn đạt trạng thái hiện tại của phân từ hoàn thành ἑστηκότων cùng ý nghĩa chỉ nơi chốn của αὐτοῦ trong ngữ cảnh.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: chắc chắn sẽ không nếm sự chết
  rationale: “Chắc chắn sẽ không” chuyển tải sắc thái phủ định mạnh của οὐ μή; “nếm sự chết” giữ nguyên hình ảnh ẩn dụ của γεύομαι thay vì diễn giải thẳng thành “chết”.
- source_word: ἕως ἂν ἴδωσιν
  choice: cho đến khi họ thấy
  rationale: Diễn đạt tự nhiên mệnh đề hướng đến tương lai với ἕως ἄν và động từ ở thể giả định, không thêm cách giải thích về thời điểm hoặc biến cố được nói đến.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: “Vương quốc” giữ được phạm vi nghĩa rộng của βασιλεία và là cách diễn đạt rõ ràng trong tiếng Việt; cấu trúc “của Đức Chúa Trời” phản ánh trực tiếp sở hữu cách τοῦ θεοῦ.
theological_decisions:
- issue: Ý nghĩa của việc “thấy vương quốc của Đức Chúa Trời”
  choice: Giữ nguyên cách nói, không giải thích biến cố mà câu này ám chỉ.
  alternative: Có thể hiểu là sự biến hình, sự phục sinh và thăng thiên, sự hủy diệt Giê-ru-sa-lem, hoặc sự lan rộng của hội thánh.
  rationale: Bản văn không xác định tường minh biến cố nào. Giữ nguyên cách nói bảo toàn tính đa nghĩa và căng thẳng cánh chung thay vì áp đặt một hệ giải thích cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi—anh em” tránh lối cổ, đồng thời giữ lời phát biểu trực tiếp và số nhiều của đối tượng nghe. Thành ngữ giàu hình ảnh “nếm sự chết” được giữ trong chính văn và giải thích ngắn ở chú thích.
