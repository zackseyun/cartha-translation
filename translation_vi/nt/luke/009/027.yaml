  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành phần chính của câu Hy Lạp: lời khẳng định chân thật, nhóm không xác định trong những người hiện diện, phủ định nhấn mạnh οὐ μή, thành ngữ “nếm sự chết,” và mệnh đề thời gian hướng đến tương lai. “Đây” diễn đạt hợp lý tính chỉ định theo ngữ cảnh của τῶν αὐτοῦ ἑστηκότων, dù không cần hiểu như một từ tương ứng từng chữ với αὐτοῦ.'
  naturalness: Câu hiện tại dễ hiểu, nhưng cụm “có vài người trong số những người đang đứng đây” lặp “người” và nặng cấu trúc. Đưa cụm chỉ nhóm lên đầu câu tạo thành ngữ tự nhiên hơn mà vẫn giữ ý nghĩa bộ phận. Chú thích cũng nên giải thích thành ngữ trực tiếp, tránh cách nói ít tự nhiên “trải qua sự chết.”
  terminology: “Anh em,” “nếm sự chết,” và “vương quốc của Đức Chúa Trời” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. Giữ “vương quốc của Đức Chúa Trời” phản ánh nguyên văn mà không thu hẹp βασιλεία thành chỉ “sự cai trị” hoặc diễn giải “thấy” theo một biến cố thần học cụ thể.
  issues:
