source:
  edition: SBLGNT
  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: vi
  text: 'Họ đáp: “Giăng Báp-tít; người khác nói là Ê-li; lại có người nói rằng một vị tiên tri thời xưa đã trỗi dậy[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “một vị tiên tri từ thời xa xưa đã sống lại.”'
    reason: Nêu một cách hiểu thành ngữ hơn của cụm προφήτης τις τῶν ἀρχαίων ἀνέστη, trong đó ἀνέστη được hiểu theo nghĩa sống lại, nhưng không áp đặt cách hiểu ấy vào chính văn.
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Họ đáp
  rationale: Cụm phân từ đi với động từ hữu hạn là một lối diễn đạt chịu ảnh hưởng Sê-mít; “Họ đáp” truyền đạt tự nhiên đầy đủ ý mà không lặp thừa.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Giăng, người làm phép báp-têm
  rationale: Giữ tên riêng quen thuộc “Giăng” và diễn đạt chức danh βαπτιστής theo chức năng để độc giả hiện đại dễ hiểu.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: những người khác ... còn những người khác nữa
  rationale: Giữ cấu trúc liệt kê tương phản được lặp lại trong tiếng Hy Lạp, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: Ἠλίαν
  choice: Ê-li
  rationale: Dạng phiên âm tiếng Việt quen thuộc của tên vị tiên tri Elijah.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: một nhà tiên tri thời xưa
  rationale: Diễn đạt tự nhiên ý bất định của τις và quan hệ với những người thời xưa, không biến cụm từ thành một tước hiệu chuyên biệt.
- source_word: ἀνέστη
  choice: đã trỗi dậy
  rationale: “Trỗi dậy” giữ được trường nghĩa đứng dậy/xuất hiện và âm hưởng có thể liên quan đến sự sống lại, nhưng không buộc câu phải mang một cách hiểu duy nhất.
theological_decisions:
- issue: Có nên dịch ἀνέστη thành từ ngữ khẳng định rõ sự sống lại hay không
  choice: đã trỗi dậy
  alternative: đã sống lại; đã xuất hiện trở lại
  rationale: Động từ có thể gợi đến sự sống lại, nhưng trong ngữ cảnh cũng nói đến việc một vị tiên tri xưa xuất hiện. “Đã trỗi dậy” bảo toàn sự căng thẳng và độ mở của nguyên văn; chú thích nêu cách hiểu rõ hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp liệt kê của nguyên văn; “còn ... nữa” làm rõ nhóm ý kiến thứ ba. Chức danh của Giăng được diễn đạt theo chức năng thay vì chỉ dùng một danh xưng có thể ít rõ nghĩa đối với độc giả phổ thông.
