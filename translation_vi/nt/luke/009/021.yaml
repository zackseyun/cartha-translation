  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: vi
  text: Nhưng Đức Giê-su nghiêm khắc cảnh cáo các môn đồ và truyền cho họ không được nói điều này với ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng Đức Giê-su quở trách các môn đồ và truyền cho họ không được nói điều này với ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: nghiêm khắc cảnh cáo
  rationale: Động từ có thể chỉ sự quở trách hoặc lời cảnh cáo nghiêm khắc. Trong ngữ cảnh này, đối tượng là các môn đồ và lời ấy đi cùng một mệnh lệnh cấm tiết lộ, nên “nghiêm khắc cảnh cáo” vừa giữ được sắc thái mạnh vừa tự nhiên trong tiếng Việt.
- source_word: παρήγγειλεν
  choice: truyền
  rationale: παραγγέλλω diễn tả một chỉ thị có thẩm quyền. “Truyền” là cách nói trang trọng, rõ nghĩa và phù hợp với lời Đức Giê-su dành cho các môn đồ.
- source_word: μηδενὶ
  choice: không ... với ai
  rationale: Đại từ phủ định ở cách dữ liệu chỉ người tiếp nhận lời nói. Cấu trúc tiếng Việt “không được nói ... với ai” chuyển đạt trực tiếp ý “không nói với bất cứ người nào”.
- source_word: λέγειν
  choice: nói
  rationale: Trong kết cấu với μηδενὶ và τοῦτο, “nói điều này với ai” là cách diễn đạt tự nhiên, đồng thời vẫn gần với nghĩa cơ bản của λέγω.
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định quy chiếu về lời tuyên xưng của Phi-e-rơ trong văn cảnh trước đó. “Điều này” giữ nguyên tính quy chiếu mà không giải thích quá mức ngay trong câu.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ tạo sự chuyển ý có sắc thái tương phản giữa lời tuyên xưng vừa được nói ra và lệnh không được tiết lộ; “Nhưng” thể hiện điều đó tự nhiên trong tiếng Việt.
- source_word: αὐτοῖς
  choice: các môn đồ ... họ
  rationale: Đại từ số nhiều quy chiếu đến nhóm môn đồ trong văn cảnh. Nêu “các môn đồ” trước rồi dùng “họ” giúp câu tiếng Việt rõ chủ thể tiếp nhận mà không thêm một cách giải thích thần học.
theological_decisions:
- issue: Mức độ mạnh của lệnh cấm sau lời tuyên xưng của Phi-e-rơ
  choice: Một lời cảnh cáo nghiêm khắc kèm mệnh lệnh không được tiết lộ vào thời điểm này
  alternative: Một lời khuyên hoặc lời nhắc nhẹ rằng không nên đề cập đến điều ấy
  rationale: Sự kết hợp giữa ἐπιτιμήσας và παρήγγειλεν cho thấy đây không phải lời yêu cầu tùy ý. Bản dịch giữ sức nặng của lệnh cấm và sự căng thẳng trong trình thuật nhưng không đưa vào câu một lý thuyết giải thích lý do.
- issue: Cách hiểu sắc thái của ἐπιτιμήσας đối với các môn đồ
  choice: “nghiêm khắc cảnh cáo” trong chính văn
  alternative: “quở trách”
  rationale: Cả sắc thái quở trách lẫn cảnh cáo đều có cơ sở từ vựng. Ngữ cảnh nhấn mạnh việc ngăn họ tiết lộ, nên “cảnh cáo” phù hợp hơn về chức năng; chú thích bảo tồn khả năng dịch “quở trách”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “các môn đồ” làm rõ đối tượng của đại từ αὐτοῖς từ văn cảnh. Cấu trúc “không được” thể hiện rõ lực cấm của mệnh lệnh.
