id: LUK.9.11
reference: Luke 9:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: vi
  text: Nhưng khi biết được việc ấy, dân chúng đi theo Ngài. Ngài đón tiếp họ, đang nói với họ về vương quốc Đức Chúa Trời và đang chữa lành những người cần được chữa lành.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người cần được chữa trị” hoặc “những người cần được chăm sóc.” Từ Hy Lạp θεραπεία có thể chỉ sự chữa lành, chữa trị hoặc chăm sóc.
    reason: Bảo lưu phạm vi nghĩa của θεραπεία, vốn có thể nói đến sự chữa lành, việc chữa trị hoặc sự chăm sóc.
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Nhưng ... dân chúng
  rationale: “Nhưng” diễn đạt sắc thái chuyển ý nhẹ của δέ trong bối cảnh; “dân chúng” là cách nói tự nhiên trong tiếng Việt để chỉ các đoàn người đông đảo, dù danh từ Hy Lạp ở số nhiều.
- source_word: γνόντες
  choice: khi biết được việc ấy
  rationale: Phân từ bất định quá khứ mang ý nghĩa hoàn cảnh-thời gian; cách dịch này tự nhiên và vẫn để “việc ấy” chỉ chung việc Chúa Giê-su đã rút đi hoặc nơi Ngài đến, không xác định quá mức.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo Ngài
  rationale: Diễn đạt trực tiếp hành động đi theo Chúa Giê-su, đồng thời không loại bỏ âm hưởng rộng hơn của động từ “theo” trong các sách Phúc Âm.
- source_word: ἀποδεξάμενος αὐτούς
  choice: đón tiếp họ
  rationale: ἀποδέχομαι ở đây mang sắc thái tiếp nhận cách niềm nở; “đón tiếp” tự nhiên và rõ hơn “tiếp nhận.”
- source_word: ἐλάλει αὐτοῖς
  choice: nói với họ
  rationale: Giữ nghĩa thông thường của λαλέω mà không nâng thành “giảng dạy”; ngữ cảnh và chuỗi động từ cho thấy hoạt động đang diễn ra.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: về vương quốc Đức Chúa Trời
  rationale: “Vương quốc Đức Chúa Trời” là cách dịch rõ ràng, nhất quán của cụm từ trọng yếu này, có thể bao hàm cả quyền trị vì lẫn phạm vi cai trị.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: những người cần được chữa lành
  rationale: Cách diễn đạt tự nhiên trong ngữ cảnh và phù hợp với hành động ἰᾶτο; chú thích bảo lưu khả năng θεραπεία chỉ việc chữa trị hoặc chăm sóc.
- source_word: ἰᾶτο
  choice: chữa lành
  rationale: Diễn đạt hành động chữa lành đang tiếp diễn; tiếng Việt không cần thêm dấu hiệu hình thái để thể hiện thì chưa hoàn thành.
theological_decisions:
- issue: Cách dịch βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: quyền trị vì của Đức Chúa Trời
  rationale: “Vương quốc” bảo toàn thuật ngữ quen thuộc xuyên suốt các sách Phúc Âm mà không buộc βασιλεία chỉ mang nghĩa lãnh thổ; phương án “quyền trị vì” nêu rõ khía cạnh năng động nhưng thu hẹp cách hiểu trong câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “Đức Chúa Trời” cho θεός. Tránh cách nói cổ hoặc nặng tính giáo phái; cấu trúc câu giữ mạch kể tự nhiên và sự song hành giữa việc nói cùng việc chữa lành.
