revisions:
- from: Khi tiếng phán vừa dứt[a], người ta thấy chỉ còn một mình Đức Chúa Jêsus. Các môn đồ giữ im lặng và trong những ngày ấy không kể cho ai bất cứ điều gì mình đã thấy.
  to: Khi tiếng phán vang lên[a], thì chỉ còn thấy một mình Giê-su. Họ im lặng và trong những ngày ấy không kể với ai bất cứ điều gì họ đã thấy.
  rationale: Sửa cụm thời gian để không thêm ý tiếng phán vừa kết thúc; bỏ tước hiệu không có trong nguyên văn; và điều chỉnh chú thích cho nhất quán với tiếng Hy Lạp. Câu vẫn bảo toàn lối kể dè dặt của εὑρέθη (“chỉ còn thấy”) và nội dung rằng họ không thuật lại điều đã chứng kiến cho bất cứ ai trong những ngày ấy.
