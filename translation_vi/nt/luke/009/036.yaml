  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: vi
  text: Khi tiếng phán vang lên[a], thì chỉ còn thấy một mình Giê-su. Họ im lặng và trong những ngày ấy không kể với ai bất cứ điều gì họ đã thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi tiếng phán xảy ra.” Nguyên văn Hy Lạp nói theo nghĩa đen: “Khi tiếng nói xảy ra”; cấu trúc này chỉ thời điểm và không tự nó xác định tiếng phán đã dứt.'
    reason: Giữ sự rộng nghĩa của cụm ἐν τῷ γενέσθαι τὴν φωνήν và giải thích lựa chọn dịch “vang lên.”
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: Khi tiếng phán vừa dứt
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả thời gian. Trong ngữ cảnh, φωνή là lời phán từ trời; cách dịch này tự nhiên trong tiếng Việt và chỉ thời điểm ngay sau khi lời phán kết thúc, dù nghĩa sát hơn là “khi tiếng phán vang lên/xảy ra”.
- source_word: φωνή
  choice: tiếng phán
  rationale: Trong cảnh hóa hình, từ này chỉ lời phát ra từ trời. “Tiếng phán” vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh, thay vì từ chung chung “âm thanh”.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: người ta thấy chỉ còn một mình Đức Chúa Jêsus
  rationale: εὑρέθη theo hình thức là “được tìm thấy/được thấy”, còn μόνος mô tả việc Chúa Jêsus ở một mình. Cách dịch tiếng Việt này giữ kết quả của cảnh tượng mà không khẳng định quá mức cơ chế Môi-se và Ê-li biến mất.
- source_word: ἐσίγησαν
  choice: giữ im lặng
  rationale: Diễn đạt trực tiếp trạng thái chủ động không nói về điều họ vừa chứng kiến.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: không kể cho ai
  rationale: ἀπαγγέλλω ở đây có nghĩa kể lại hoặc báo lại; “kể cho ai” là tự nhiên trong văn thuật chuyện hiện đại.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Giữ sát cụm từ chỉ thời gian và không suy diễn thời hạn chính xác.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: bất cứ điều gì mình đã thấy
  rationale: Trong phạm vi phủ định, “bất cứ điều gì” chuyển đạt tự nhiên quan hệ giữa οὐδέν và mệnh đề quan hệ ὧν ἑώρακαν.
theological_decisions:
- issue: Hàm ý của việc Chúa Jêsus ở một mình sau tiếng phán từ trời
  choice: Trình bày thuần thuật sự rằng người ta thấy chỉ còn một mình Đức Chúa Jêsus.
  alternative: “Đức Chúa Jêsus được thấy ở một mình” hoặc “chỉ Đức Chúa Jêsus còn lại.”
  rationale: Bản văn kể lại kết quả có thể quan sát được, không giải thích ý nghĩa thần học của việc Môi-se và Ê-li không còn hiện diện; bản dịch tránh thêm lời giải nghĩa giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành quen thuộc; “các môn đồ” làm rõ chủ thể của đại từ αὐτοί từ ngữ cảnh. Dấu chú thích [a] xuất hiện ngay trong chính văn.
