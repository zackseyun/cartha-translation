source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Còn anh em thì nói Ta là ai?” Phi-e-rơ đáp: “Đấng Mê-si của Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng Christ của Đức Chúa Trời.”'
    reason: Biến thể từ vựng truyền thống cho Χριστός.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: anh em
  rationale: Đại từ số nhiều được nêu rõ và mang sắc thái nhấn mạnh; cách lặp “Còn anh em, anh em...” thể hiện sự tương phản với ý kiến của những người khác trong văn cảnh.
- source_word: τίνα με λέγετε εἶναι
  choice: anh em nói Ta là ai
  rationale: Diễn đạt tự nhiên cấu trúc λέγετε với mệnh đề nguyên mẫu, đồng thời giữ nguyên câu hỏi về căn tính của Chúa Giê-su.
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp
  rationale: Phân từ kết hợp với động từ hữu hạn tạo thành một diễn đạt trả lời; tiếng Việt có thể chuyển gọn thành “đáp” mà không mất nghĩa.
- source_word: τὸν χριστὸν
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là tước hiệu chỉ vị vua được Đức Chúa Trời xức dầu, không phải tên riêng; “Đấng Mê-si” chuyển tải chức năng tước hiệu trong lời tuyên xưng của Phi-e-rơ.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ quan hệ sở thuộc của sở hữu cách Hy Lạp một cách trực tiếp và trang trọng.
- source_word: δέ
  choice: Còn
  rationale: Trong câu hỏi, δέ đánh dấu sự tương phản giữa các môn đồ và những ý kiến vừa được nhắc đến; “Còn” là liên từ tự nhiên trong tiếng Việt. δέ đầu câu được thể hiện bằng mạch văn liền lạc thay vì dịch máy móc.
theological_decisions:
- issue: Cách dịch χριστός trong lời tuyên xưng của Phi-e-rơ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này hoạt động như một tước hiệu trong khung kỳ vọng về vị được xức dầu của Y-sơ-ra-ên. Bản chính dịch ý nghĩa tước hiệu, còn cách gọi truyền thống được giữ trong chú thích.
- issue: Quan hệ trong cụm τοῦ θεοῦ
  choice: của Đức Chúa Trời
  alternative: Đấng Mê-si do Đức Chúa Trời sai đến
  rationale: Giữ nguyên sự súc tích và độ mở của sở hữu cách Hy Lạp, không diễn giải cụ thể quan hệ là sai phái, tuyển chọn hay sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta” trong lời trực tiếp của Chúa Giê-su; “anh em” biểu thị số nhiều và phù hợp quan hệ giữa thầy với các môn đồ. Dấu chú thích [a] được đặt ngay sau cụm mà chú thích giải thích.
