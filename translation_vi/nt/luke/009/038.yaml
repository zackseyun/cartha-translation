    rationale: Cụm này có thể hiểu là lưu tâm, nhưng “nhìn đến” tự nhiên hơn và vẫn giữ sự mở nghĩa của ἐπιβλέψαι ἐπί, không diễn giải thành hành động chữa lành.
  - severity: low
