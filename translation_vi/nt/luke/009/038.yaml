  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: vi
  text: 'Kìa, một người đàn ông từ trong đám đông kêu lớn: “Thưa Thầy, tôi khẩn xin Thầy nhìn đến con trai tôi, vì nó là đứa con duy nhất của tôi.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì nó là con trai duy nhất của tôi.” Theo nghĩa đen, tiếng Hy Lạp nói người ấy là “người duy nhất đối với tôi”; vì đứa trẻ đã được gọi là con trai, cả hai cách dịch đều có thể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái kể chuyện của Lu-ca, đồng thời tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch dài dòng.
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: một người trong đám đông
  rationale: Diễn đạt tự nhiên việc người ấy là một người nam thuộc đám đông; ngữ cảnh và lời nói tiếp theo không đòi hỏi lặp rõ từ “đàn ông”.
- source_word: ἐβόησεν λέγων
  choice: kêu lớn
  rationale: Truyền đạt tiếng gọi lớn và khẩn thiết; trong tiếng Việt không cần dịch riêng phân từ “nói rằng” trước lời trực tiếp.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: “Thầy” là cách xưng hô tự nhiên dành cho người dạy, còn “thưa” thể hiện trực tiếp hô cách và thái độ kính trọng.
- source_word: δέομαί σου
  choice: tôi van Thầy
  rationale: Giữ mức độ khẩn khoản mạnh hơn một lời xin thông thường và phù hợp với nỗi tuyệt vọng của người cha.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: đoái đến
  rationale: Diễn tả sự lưu tâm và quan tâm giúp đỡ, không thu hẹp thành hành động nhìn bằng mắt; cách nói trang trọng nhưng vẫn dễ hiểu.
- source_word: τὸν υἱόν μου
  choice: con trai tôi
  rationale: Dịch trực tiếp và giữ rõ giới tính được nêu trong nguyên văn.
- source_word: μονογενής μοί ἐστιν
  choice: nó là đứa con duy nhất của tôi
  rationale: μονογενής ở đây nhấn mạnh người con là con độc nhất; cách dịch này tự nhiên và không lặp “con trai duy nhất”, trong khi vẫn bảo toàn khả năng hiểu là con duy nhất nói chung.
theological_decisions:
- issue: Phạm vi nghĩa của μονογενής
  choice: đứa con duy nhất
  alternative: con trai duy nhất
  rationale: Vì đứa trẻ đã được xác định là con trai, μονογενής có thể nhấn mạnh rằng đó là người con độc nhất của ông. Bản dịch chính giữ sắc thái này, còn chú thích bảo lưu cách hiểu hẹp hơn là “con trai duy nhất”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. “Kìa” giữ nhịp kể chuyện của nguyên văn; “đoái đến” truyền tải sự lưu tâm đầy quan tâm mà không diễn giải thêm rằng Đức Giê-su sẽ chữa lành.
