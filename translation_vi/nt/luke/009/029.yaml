source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: vi
  text: Trong khi Ngài cầu nguyện, vẻ mặt Ngài trở nên khác[a], và y phục Ngài trở nên trắng và lóe sáng như chớp[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vẻ mặt Ngài đã thay đổi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “y phục Ngài trắng và sáng chói”; phân từ Hy Lạp gợi hình ảnh lóe sáng như chớp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Trong khi Ngài cầu nguyện
  rationale: Cấu trúc đặc trưng của Lu-ca diễn tả một sự việc xảy ra trong lúc một hành động đang tiếp diễn. Cách dịch này giữ rõ quan hệ thời gian mà vẫn tự nhiên trong tiếng Việt.
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: diện mạo Ngài
  rationale: εἶδος chỉ vẻ bề ngoài có thể nhìn thấy, còn πρόσωπον là khuôn mặt. “Diện mạo” diễn đạt gọn và trang trọng toàn bộ cụm từ mà không hàm ý thay đổi bản thể.
- source_word: ἕτερον
  choice: trở nên khác
  rationale: ἕτερον có nghĩa là “khác” hoặc “một dạng khác”. Cách dịch này giữ lối diễn đạt dè dặt riêng của Lu-ca, không thêm ý “tỏa sáng” từ sách Phúc Âm song song.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: y phục Ngài
  rationale: ἱματισμός chỉ quần áo hoặc y phục nói chung. “Y phục” tự nhiên, trang trọng và phù hợp văn phong tường thuật.
- source_word: λευκὸς
  choice: trắng
  rationale: λευκός trực tiếp chỉ màu trắng; sắc thái rực sáng được diễn đạt riêng qua phân từ theo sau.
- source_word: ἐξαστράπτων
  choice: lóe sáng như chớp
  rationale: Phân từ này gợi hình ảnh ánh chớp, nên cách dịch giữ được hình ảnh sống động thay vì chỉ dùng từ khái quát như “sáng chói”.
theological_decisions:
- issue: Cách mô tả sự biến đổi của Chúa Giê-su
  choice: diện mạo Ngài trở nên khác
  alternative: khuôn mặt Ngài biến đổi; mặt Ngài tỏa sáng
  rationale: Bản văn mô tả một thay đổi hữu hình có thật, nhưng cách nói của Lu-ca dè dặt hơn các trình thuật song song. Bản dịch không đồng nhất hóa câu này với cách diễn đạt của Ma-thi-ơ và cũng không giải quyết vượt quá sự mơ hồ của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh tường thuật về Chúa Giê-su; “diện mạo” và “y phục” tạo sắc thái dignified mà không cổ hóa. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
