  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: vi
  text: Vậy, họ lên đường, đi qua các làng[a], rao truyền tin mừng[b] và chữa bệnh khắp nơi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đi từ làng này sang làng khác.” Cách diễn đạt Hy Lạp có thể nhấn mạnh sự di chuyển lần lượt giữa các làng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “rao giảng Phúc Âm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: họ ra đi
  rationale: Phân từ bất định mở đầu hành động tiếp theo sau khi được sai phái; “ra đi” tự nhiên và giữ ý họ rời nơi đang ở để lên đường.
- source_word: δὲ
  choice: Vậy
  rationale: δέ nối tiếp câu chuyện với sắc thái chuyển tiến nhẹ và, trong ngữ cảnh, cho thấy họ thực hiện điều vừa được truyền.
- source_word: διήρχοντο
  choice: đi khắp
  rationale: Thì chưa hoàn thành diễn tả sự di chuyển liên tục qua nhiều địa điểm; “đi khắp” vừa tự nhiên vừa chuyển tải phạm vi hành trình.
- source_word: κατὰ τὰς κώμας
  choice: các làng
  rationale: κατά với đối cách có sắc thái phân bố/không gian, chỉ việc đi qua các làng; kết hợp với “đi khắp” diễn đạt gọn và rõ.
- source_word: εὐαγγελιζόμενοι
  choice: rao truyền tin mừng
  rationale: Diễn tả việc công bố tin mừng; cách nói này dễ hiểu trong tiếng Việt hiện đại và tránh thu hẹp từ ngữ thành một thuật ngữ giáo hội về sau.
- source_word: θεραπεύοντες
  choice: chữa bệnh
  rationale: Trong ngữ cảnh sứ vụ này, động từ chỉ việc chữa lành thể chất; “chữa bệnh” tự nhiên và xác định rõ đối tượng ngầm hiểu.
- source_word: πανταχοῦ
  choice: ở khắp nơi
  rationale: Trạng từ nhấn mạnh phạm vi rộng khắp của cả hoạt động rao truyền và chữa bệnh.
theological_decisions:
- issue: Ý nghĩa của εὐαγγελιζόμενοι trong sứ vụ các môn đồ
  choice: rao truyền tin mừng
  alternative: rao giảng Phúc Âm
  rationale: Bản dịch giữ nội dung công bố tin mừng nhưng không mặc nhiên áp đặt lên câu này toàn bộ sắc thái thuật ngữ thần học được định hình về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Vậy” nối câu với mệnh lệnh sai phái trước đó; hai phân từ hiện tại được diễn đạt bằng các động từ song song. Các dấu chú thích [a], [b] đều xuất hiện ngay sau cụm từ liên quan.
