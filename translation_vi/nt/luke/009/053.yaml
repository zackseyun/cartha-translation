  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: vi
  text: Và họ không tiếp đón Ngài[a], vì mặt Ngài đang hướng về Giê-ru-sa-lem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ không tiếp nhận Ngài.” Động từ này có thể chỉ việc tiếp nhận, chấp nhận hoặc đón tiếp; tại đây có lẽ nói đến việc từ chối tiếp rước hay cho ở nhờ.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “mặt Ngài đang đi đến Giê-ru-sa-lem.” Đây là lối nói diễn tả hướng đi đã định, và cũng có thể hàm ý quyết tâm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: không tiếp đón
  rationale: Động từ δέχομαι có thể mang nghĩa tiếp nhận, chấp nhận hoặc đón tiếp. Trong bối cảnh hành trình và việc tìm nơi dừng chân, “không tiếp đón” diễn đạt tự nhiên ý từ chối tiếp rước hay cho ở nhờ.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: mặt Ngài
  rationale: πρόσωπον có nghĩa đen là “mặt”. Giữ hình ảnh này bảo tồn lối diễn đạt đậm sắc thái Kinh Thánh thay vì giản lược thành đại từ.
- source_word: ἦν πορευόμενον
  choice: đang hướng về
  rationale: Cấu trúc περιφραστική với πορευόμενον diễn tả sự đi tới. Khi chủ ngữ ngữ pháp là “mặt Ngài”, “đang hướng về” vừa tự nhiên trong tiếng Việt vừa giữ được phương hướng và hàm ý quyết tâm mà không biến câu thành lời giải thích.
- source_word: εἰς Ἰερουσαλήμ
  choice: về Giê-ru-sa-lem
  rationale: εἰς chỉ đích đến hoặc hướng chuyển động. Với “hướng”, giới từ “về” là cách diễn đạt tiếng Việt tự nhiên và vẫn giữ rõ đích đến là Giê-ru-sa-lem.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu nguyên nhân khiến họ không tiếp đón Ngài; “vì” là liên từ nhân quả rõ ràng, tự nhiên.
theological_decisions:
- issue: Sức nặng thành ngữ của câu “mặt Ngài đang hướng về Giê-ru-sa-lem”
  choice: Giữ hình ảnh “mặt Ngài” và diễn đạt phương hướng bằng “đang hướng về”, để câu vừa cho thấy đích đến vừa có thể gợi quyết tâm.
  alternative: Diễn ý hoàn toàn là “vì Ngài quyết tâm đi Giê-ru-sa-lem” hoặc dịch sát hơn “vì mặt Ngài đang đi đến Giê-ru-sa-lem”.
  rationale: Bản dịch giữ hình ảnh và sự căng thẳng của nguyên ngữ, nhưng không đưa trực tiếp một cách giải nghĩa thần học vào chính văn. Chú thích cho biết cả nghĩa đen lẫn lực thành ngữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Tiếp đón” phù hợp bối cảnh hiếu khách; “mặt Ngài đang hướng về” giữ hình ảnh nguyên ngữ mà vẫn đọc tự nhiên. Dùng “Ngài” làm đại từ tôn kính quen thuộc khi nói về Đức Giê-su.
