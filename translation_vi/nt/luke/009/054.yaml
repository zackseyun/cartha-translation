  naturalness: “Khi thấy vậy,”, “Lạy Chúa,” và “thiêu hủy họ” đều tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Cần thay “truyền cho lửa từ trời xuống” bằng một cấu trúc tiếng Việt mạch lạc hơn. “Giáng xuống” cũng hợp với hình ảnh từ trời hơn “xuống” đơn lẻ.
  terminology: Giữ “môn đồ,” “Gia-cơ,” “Giăng,” và “Lạy Chúa” là nhất quán với đăng ký trang trọng của bản dịch. “Thiêu hủy” bảo toàn cả hình ảnh lửa lẫn kết quả của ἀναλῶσαι.
  issues:
