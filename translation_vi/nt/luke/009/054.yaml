id: LUK.9.54
reference: Luke 9:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: vi
  text: 'Khi thấy vậy, hai môn đồ Gia-cơ và Giăng nói: “Lạy Chúa, Chúa có muốn chúng con ra lệnh cho lửa từ trời giáng xuống và thiêu hủy họ không?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “bảo lửa từ trời xuống và thiêu hủy họ.” Cũng có thể dịch: “gọi lửa từ trời xuống để hủy diệt họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi thấy vậy
  rationale: Phân từ bất định được diễn đạt như một mệnh đề chỉ thời gian tự nhiên trong tiếng Việt; “vậy” nối với việc người Sa-ma-ri từ chối tiếp đón ở câu trước mà không thêm nội dung mới.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: hai môn đồ Gia-cơ và Giăng
  rationale: Giữ quan hệ đồng vị, xác định rõ hai môn đồ đang được nói đến; thêm “hai” là cách diễn đạt tự nhiên dựa trên hai tên được nêu.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Cách xưng hô trực tiếp trang trọng và tự nhiên với Chúa Giê-su trong tiếng Việt.
- source_word: θέλεις
  choice: Chúa có muốn
  rationale: Diễn đạt trực tiếp ý muốn hoặc ý định trong câu hỏi xin phép.
- source_word: εἴπωμεν
  choice: chúng con truyền cho
  rationale: Trong cấu trúc với động từ nguyên mẫu theo sau, λέγω mang lực khiến khiến; “truyền cho” vừa tự nhiên hơn cách dịch máy móc “nói với lửa,” vừa không dùng một động từ quá mạnh như thể nguyên văn có từ riêng nghĩa là “ra lệnh.”
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: lửa từ trời xuống
  rationale: Giữ nguyên hình ảnh lửa từ trời giáng xuống và trật tự câu tự nhiên trong tiếng Việt.
- source_word: ἀναλῶσαι
  choice: thiêu hủy
  rationale: Giữ đồng thời sắc thái lửa thiêu và hậu quả hủy diệt của ἀναλίσκω trong ngữ cảnh.
- source_word: αὐτούς
  choice: họ
  rationale: Đại từ số nhiều chỉ những người thuộc làng Sa-ma-ri đã từ chối tiếp đón Chúa Giê-su.
theological_decisions:
- issue: Tân ngữ hàm ẩn của “thấy”
  choice: Dùng “thấy vậy,” quy chiếu về sự từ chối trong câu trước.
  alternative: “Khi Gia-cơ và Giăng thấy” hoặc “Thấy thế”
  rationale: Nguyên văn không nêu tân ngữ, nên bản dịch giữ tính hàm ẩn nhưng dùng “vậy” để liên kết câu chuyện một cách tự nhiên, không xác quyết thêm chi tiết.
- issue: Lực ngôn trung trong đề nghị của hai môn đồ
  choice: “truyền cho lửa… xuống”
  alternative: “ra lệnh cho lửa… xuống” hoặc “gọi lửa từ trời xuống”
  rationale: Nguyên văn dùng λέγω, nghĩa đen là “nói/bảo,” nhưng cấu trúc này mang ý khiến lửa giáng xuống. “Truyền cho” bảo toàn lực ấy mà không âm thầm thay bằng một động từ mệnh lệnh mạnh hơn.
- issue: Sắc thái của ἀναλῶσαι
  choice: “thiêu hủy”
  alternative: “thiêu đốt,” “nuốt chửng” hoặc “hủy diệt”
  rationale: Từ này có thể nhấn mạnh sự tiêu hủy hoặc hủy diệt. “Thiêu hủy” giữ cả hình ảnh lửa lẫn kết quả, không giải quyết quá mức sự chồng lấn nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Lạy Chúa” phù hợp lời thưa trực tiếp; “chúng con” thể hiện quan hệ kính trọng của các môn đồ với Chúa Giê-su. Dấu chú thích được đặt sau toàn bộ câu hỏi vì chú thích giải thích cách diễn đạt của cả đề nghị.
