source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: vi
  text: Khi ông còn đang nói những điều ấy, một đám mây xuất hiện và bắt đầu che phủ họ[a]. Họ sợ hãi khi đi vào trong đám mây[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một đám mây xuất hiện và che phủ họ.” Thì của động từ có thể được diễn đạt trực tiếp mà không nêu rõ sắc thái bắt đầu.'
    reason: lexical_alternative
  - marker: b
    text: Đám mây có thể gợi lại những cảnh trong Cựu Ước khi Đức Chúa Trời bày tỏ sự hiện diện của Ngài, nhưng chính câu này không nói rõ như vậy.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ λέγοντος
  choice: Khi ông còn đang nói những điều ấy
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang tiếp diễn đồng thời; “những điều ấy” giữ số nhiều của ταῦτα và chỉ lời Phi-e-rơ vừa nói.
- source_word: ἐγένετο νεφέλη
  choice: một đám mây xuất hiện
  rationale: ἐγένετο với chủ ngữ ở chủ cách giới thiệu sự xuất hiện hoặc hình thành của đám mây; cách dịch này tự nhiên và không suy đoán nguồn gốc của nó.
- source_word: ἐπεσκίαζεν
  choice: bắt đầu bao phủ
  rationale: Thì chưa hoàn thành có thể mang sắc thái khởi phát hoặc diễn tiến. “Bao phủ” tự nhiên trong tiếng Việt đối với tác động của đám mây, còn “bắt đầu” thể hiện sắc thái khởi phát mà không biến hình ảnh thành một lời giải thích thần học.
- source_word: ἐφοβήθησαν
  choice: Họ sợ hãi
  rationale: Diễn đạt tự nhiên sự phát sinh nỗi sợ trong trình thuật.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς εἰς τὴν νεφέλην
  choice: khi đi vào trong đám mây
  rationale: Động từ nguyên mẫu có mạo từ với ἐν diễn tả thời gian đồng thời; εἰς giữ rõ ý chuyển động vào bên trong đám mây. Chủ ngữ “họ” được hiểu tiếp từ mệnh đề chính.
theological_decisions:
- issue: Bản chất của đám mây và hành động của nó
  choice: Mô tả đơn thuần rằng đám mây xuất hiện và bao phủ họ, không trực tiếp gọi đó là sự hiện diện của Đức Chúa Trời.
  alternative: Diễn giải đám mây là đám mây vinh quang hoặc sự hiện diện hữu hình của Đức Chúa Trời.
  rationale: Bối cảnh có thể gợi lại những cảnh Đức Chúa Trời hiện diện trong Cựu Ước, nhưng chính câu này không xác định điều đó; bản dịch giữ nguyên hình ảnh và sự căng thẳng thần học.
- issue: Đối tượng đi vào đám mây trong αὐτούς
  choice: Giữ đại từ “họ” như nguyên văn, không xác định thêm.
  alternative: Diễn giải rõ là các môn đồ hoặc tất cả những người hiện diện.
  rationale: Đại từ Hy Lạp có thể gây tranh luận về phạm vi quy chiếu trong văn cảnh; thêm danh từ cụ thể sẽ âm thầm giải quyết điều nguyên văn để ngỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để tiếp nối chủ thể Phi-e-rơ trong câu trước; tránh từ chuyên biệt như “áng mây” hay thuật ngữ thần học không có trong nguyên văn. Dấu chú thích được đặt ngay sau các cụm từ liên quan.
