reference: Luke 9:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: vi
  text: Phi-e-rơ và những người ở với ông đều bị cơn buồn ngủ đè nặng; nhưng khi đã tỉnh hẳn[a], họ thấy vinh quang của Ngài và hai người đang đứng cùng Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «sau khi thức dậy» hoặc «khi đã hoàn toàn tỉnh táo». Động từ Hy Lạp này hiếm gặp và có thể nhấn mạnh việc họ trở nên hoàn toàn tỉnh táo hơn là việc họ vẫn thức suốt thời gian ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: bị cơn buồn ngủ đè nặng
  rationale: Giữ hình ảnh về trạng thái bị giấc ngủ đè nặng, mạnh hơn cách nói đơn giản «buồn ngủ», đồng thời tự nhiên trong tiếng Việt.
- source_word: διαγρηγορήσαντες
  choice: khi hoàn toàn tỉnh lại
  rationale: Động từ hiếm này trong ngữ cảnh có vẻ chỉ việc đạt đến trạng thái hoàn toàn tỉnh táo sau khi bị cơn buồn ngủ đè nặng; cách dịch vẫn ghi chú khả năng hiểu khác.
- source_word: δόξαν
  choice: vinh quang
  rationale: «Vinh quang» là cách dịch quen thuộc và chính xác của δόξα, giữ được chiều kích Kinh Thánh và thần học trong biến cố hóa hình.
- source_word: τοὺς δύο ἄνδρας
  choice: hai người
  rationale: Trong ngữ cảnh, ἀνήρ chỉ hai người đàn ông là Môi-se và Ê-li; tiếng Việt có thể dùng tự nhiên «hai người» mà không cần nhấn mạnh giới tính.
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: đang đứng cùng Ngài
  rationale: Diễn đạt tư thế và sự hiện diện của hai người bên Chúa Giê-su, giữ sắc thái thị giác của phân từ Hy Lạp.
- source_word: δὲ
  choice: và / nhưng
  rationale: δὲ thứ nhất chuyển trọng tâm câu chuyện, được diễn đạt tự nhiên bằng «và»; δὲ thứ hai mang sắc thái tương phản giữa cơn buồn ngủ và việc tỉnh lại để nhìn thấy cảnh tượng, nên dịch «nhưng».
theological_decisions:
- issue: Cách dịch δόξα trong bối cảnh Chúa Giê-su hóa hình
  choice: vinh quang của Ngài
  alternative: vẻ huy hoàng của Ngài; vẻ uy nghi của Ngài
  rationale: «Vinh quang» duy trì mối liên hệ thần học rộng hơn trong Kinh Thánh mà không giải thích quá mức bản chất của điều họ nhìn thấy.
- issue: Cách hiểu διαγρηγορήσαντες
  choice: khi hoàn toàn tỉnh lại
  alternative: sau khi thức dậy; sau khi đã tỉnh hẳn; trong khi vẫn thức
  rationale: Cách chọn này phù hợp với sự tương phản sau mệnh đề nói họ bị cơn buồn ngủ đè nặng, nhưng ghi chú vẫn bảo lưu tính hiếm và sự mơ hồ thực sự của động từ.
- issue: Đại từ chỉ Chúa Giê-su
  choice: Ngài
  alternative: người
  rationale: Dùng «Ngài» là lối xưng hô kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt; việc viết hoa không nhằm giải quyết thêm bất kỳ vấn đề Kitô học nào ngoài ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh «cơn buồn ngủ đè nặng», dùng «hoàn toàn tỉnh lại» để diễn đạt sự chuyển sang trạng thái tỉnh táo, và bảo lưu phương án khác trong chú thích.
