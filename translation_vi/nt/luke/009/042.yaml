  terminology: “Quỷ” cho δαιμόνιον và “tà linh ô uế” cho πνεῦμα τὸ ἀκάθαρτον bảo toàn cách gọi khác nhau của nguyên văn, đồng thời không giải thích giảm nhẹ tác nhân thuộc linh thành bệnh trạng. “Quở trách,” “chữa lành,” và “Đức Giê-su” phù hợp đăng ký trang trọng, hiện đại. Chú thích [a] được neo đúng sau “cha” và nêu một cách diễn đạt thay thế chính đáng cho ἀπέδωκεν.
