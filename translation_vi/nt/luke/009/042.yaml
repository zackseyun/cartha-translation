id: LUK.9.42
reference: Luke 9:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: vi
  text: Khi cậu bé còn đang đến gần, quỷ vật cậu xuống và làm cậu co giật dữ dội. Nhưng Đức Giê-su quở trách tà linh ô uế, chữa lành cậu bé rồi trao cậu lại cho cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đưa cậu trở về với cha.”'
    reason: ἀποδίδωμι có thể được diễn đạt là “trao lại” hoặc “đưa trở về”; chú thích bảo lưu sắc thái phục hồi/trao trả.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Khi cậu bé còn đang đến gần
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; “còn đang” thể hiện ἔτι. Trong tiếng Việt, nêu rõ “cậu bé” giúp tránh đại từ mơ hồ mà không thêm ý ngoài văn cảnh.
- source_word: ἔρρηξεν αὐτὸν τὸ δαιμόνιον
  choice: quỷ vật cậu xuống
  rationale: ῥήγνυμι trong văn cảnh này chỉ hành động quật ngã dữ dội; “vật… xuống” tự nhiên, mạnh và không gợi nghĩa đen không phù hợp là “xé”.
- source_word: τὸ δαιμόνιον
  choice: quỷ
  rationale: Chuyển trực tiếp thuật ngữ chỉ một tác nhân thuộc linh có ngôi vị; đồng thời phân biệt cách diễn đạt này với πνεῦμα ἀκάθαρτον ở vế sau.
- source_word: συνεσπάραξεν
  choice: làm cậu co giật dữ dội
  rationale: Động từ diễn tả việc gây co giật mạnh. Cách nói này rõ nghĩa và tự nhiên hơn một lối dịch sát chữ khó hiểu.
- source_word: ἐπετίμησεν
  choice: quở trách
  rationale: Giữ sắc thái lời phán đầy thẩm quyền thường gặp trong các trình thuật trừ quỷ của sách Phúc Âm.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: tà linh ô uế
  rationale: “Tà linh” là cách gọi tự nhiên trong tiếng Việt đối với một linh xấu; “ô uế” bảo toàn sắc thái của ἀκάθαρτος thay vì giản lược thành “xấu” hay đồng nhất với bệnh trạng.
- source_word: ἰάσατο τὸν παῖδα
  choice: chữa lành cậu bé
  rationale: ἰάομαι diễn tả chữa lành; παῖς trong văn cảnh là một trẻ nam, nên “cậu bé” vừa rõ vừa không thêm quan hệ “con trai” vào chính danh từ này.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: trao cậu lại cho cha
  rationale: ἀποδίδωμι ở đây mang ý trao trả hoặc phục hồi về với người cha. “Trao… lại” tự nhiên và giữ hình ảnh Đức Giê-su giao cậu bé đã được chữa lành lại cho cha.
theological_decisions:
- issue: Ngôn ngữ về sự hành hạ của quỷ
  choice: 'Dịch δαιμόνιον và πνεῦμα ἀκάθαρτον bằng thuật ngữ chỉ tác nhân thuộc linh có ngôi vị: “quỷ” và “tà linh ô uế”.'
  alternative: Diễn giải thành một “thế lực xấu”, bệnh tâm thần hoặc tình trạng hoàn toàn phi nhân vị.
  rationale: Bản Hy Lạp trình bày quỷ như tác nhân hành động và gọi nó là một linh ô uế. Bản dịch không tự ý tự nhiên hóa trình thuật; đồng thời vẫn giữ lời khẳng định rằng Đức Giê-su “chữa lành” cậu bé, qua đó bảo toàn cả chiều kích giải cứu lẫn chữa lành.
- issue: Quan hệ giữa hành động chữa lành và trao trả
  choice: 'Giữ hai hành động nối tiếp: Đức Giê-su chữa lành cậu bé rồi trao cậu lại cho cha.'
  alternative: Gộp thành ý khái quát rằng Đức Giê-su phục hồi cậu bé cho cha.
  rationale: Cách dịch giữ nguyên các động từ riêng biệt ἰάσατο và ἀπέδωκεν, không làm mất sự căng thẳng giàu ý nghĩa giữa chữa lành và phục hồi mối quan hệ gia đình.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” theo lối viết tiếng Việt phổ thông; các động từ “vật xuống”, “co giật dữ dội”, “quở trách” tái hiện sức mạnh của trình thuật mà không cường điệu. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
