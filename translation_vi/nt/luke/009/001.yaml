revisions:
- from: Ngài gọi mười hai người lại, rồi ban cho họ năng lực và thẩm quyền trên mọi quỷ, cùng năng lực chữa lành bệnh tật.
  to: Ngài gọi mười hai người lại, rồi ban cho họ quyền năng và thẩm quyền để chế ngự mọi quỷ và chữa lành bệnh tật.
  rationale: Bản sửa loại bỏ sự lặp thêm “năng lực”, giữ trình tự hành động của phân từ mở đầu bằng một liên kết tự nhiên trong tiếng Việt, và diễn đạt quan hệ giữa quyền năng/thẩm quyền được ban với hai nhiệm vụ kế tiếp. “Chế ngự mọi quỷ” chuyển tải thành ngữ “có quyền trên mọi quỷ” một cách tự nhiên mà không thêm chi tiết.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ được việc quy tụ Mười Hai, sự phân biệt giữa δύναμις và ἐξουσία, quyền trên các quỷ, và việc chữa bệnh. Tuy nhiên, cụm “cùng năng lực chữa lành bệnh tật” lặp lại “năng lực” không có trong nguyên ngữ và làm lệch cấu trúc: δύναμιν καὶ ἐξουσίαν là hai điều được ban, còn θεραπεύειν là hành động được thực hiện nhờ sự ban cho ấy.'
  naturalness: “Ngài gọi mười hai người lại, rồi ban...” tự nhiên trong tiếng Việt hiện đại. Nhưng “cùng năng lực chữa lành bệnh tật” nặng và không tự nhiên; nên phối hợp hai mục đích/hành động bằng “để ... và ...”.
  terminology: “Quyền năng và thẩm quyền” diễn đạt rõ và tự nhiên hơn “năng lực và thẩm quyền” cho cặp δύναμις καὶ ἐξουσία, vẫn bảo toàn sự phân biệt giữa khả năng/quyền lực và quyền được thi hành. “Mọi quỷ” và “chữa lành bệnh tật” phù hợp với δαιμόνια và νόσους θεραπεύειν.
  issues:
  - severity: medium
    issue: Cụm “cùng năng lực chữa lành bệnh tật” thêm và lặp từ “năng lực”.
    rationale: Nguyên ngữ chỉ có một danh từ δύναμιν trong cặp “δύναμιν καὶ ἐξουσίαν”; θεραπεύειν là động từ nguyên mẫu “chữa lành”, không phải một “năng lực” thứ hai được nêu riêng.
  - severity: low
    issue: “Năng lực” hơi thiên về khả năng chung, chưa truyền đạt tốt sắc thái quyền lực của δύναμις trong ngữ cảnh ủy nhiệm.
    rationale: “Quyền năng” là cách dùng hiện đại, trang trọng và phù hợp hơn, đồng thời vẫn phân biệt được với “thẩm quyền” cho ἐξουσία.
  revised_text: Ngài gọi mười hai người lại, rồi ban cho họ quyền năng và thẩm quyền để chế ngự mọi quỷ và chữa lành bệnh tật.
