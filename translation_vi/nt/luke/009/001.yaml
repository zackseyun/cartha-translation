source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: vi
  text: Ngài gọi mười hai người lại, rồi ban cho họ quyền năng và thẩm quyền để chế ngự mọi quỷ và chữa lành bệnh tật.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: gọi ... lại
  rationale: Diễn đạt tự nhiên hành động quy tụ mười hai người trước hành động chính; “lại” chuyển tải sắc thái cùng nhau của tiền tố συν- mà không thêm ý triệu tập mang tính hành chính.
- source_word: δὲ
  choice: rồi
  rationale: Đây là liên từ chuyển tiếp nhẹ trong mạch kể. “Rồi” nối hai hành động tự nhiên và không tạo sắc thái tương phản.
- source_word: τοὺς δώδεκα
  choice: mười hai người
  rationale: Giữ nguyên cách gọi vắn tắt của bản Hy Lạp, không thêm “môn đồ” hay “sứ đồ” vốn không xuất hiện trong câu.
- source_word: δύναμιν καὶ ἐξουσίαν
  choice: năng lực và thẩm quyền
  rationale: 'Giữ riêng hai nét nghĩa: khả năng thực hiện và quyền được trao để hành động.'
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: trên mọi quỷ
  rationale: “Trên” bảo tồn trực tiếp ý quyền cai quản hoặc chế ngự của ἐπί, còn “mọi quỷ” phản ánh πάντα với danh từ số nhiều.
- source_word: νόσους θεραπεύειν
  choice: chữa lành bệnh tật
  rationale: Cách nói hiện đại, dễ hiểu, diễn đạt đúng hành động chữa trị các chứng bệnh mà không thu hẹp phạm vi.
theological_decisions:
- issue: Sự phân biệt giữa δύναμις và ἐξουσία
  choice: năng lực và thẩm quyền
  alternative: quyền năng và quyền phép
  rationale: Bản dịch giữ cả khả năng lẫn quyền được ủy trao, tránh nhập hai khái niệm thành một hoặc dùng hai từ gần như đồng nghĩa.
- issue: Danh xưng τοὺς δώδεκα
  choice: mười hai người
  alternative: mười hai môn đồ
  rationale: Không thêm căn tính “môn đồ” hay “sứ đồ” dù văn cảnh có thể xác định họ, vì câu Hy Lạp chỉ nói “mười hai”.
- issue: Quan hệ cú pháp của νόσους θεραπεύειν
  choice: cùng năng lực chữa lành bệnh tật
  alternative: và để chữa lành bệnh tật
  rationale: Cách dịch nối việc chữa bệnh với năng lực được ban, đồng thời không khẳng định quá mức rằng cụm “thẩm quyền trên” trực tiếp chi phối “bệnh tật”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo chủ ngữ đã rõ trong văn cảnh; không thêm danh xưng vào “mười hai người”. Giữ cấu trúc tương đối sát nguyên bản nhưng điều chỉnh nhẹ để câu tiếng Việt trôi chảy.
