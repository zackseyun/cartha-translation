id: LUK.9.39
reference: Luke 9:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: vi
  text: Kìa, một thần linh[a] chộp lấy nó, rồi thình lình nó kêu la; thần linh ấy làm nó co giật, sùi bọt mép, và rất khó mới rời khỏi nó, trong khi vẫn tàn phá nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một ác linh” hoặc “một con quỷ”; tiếng Hy Lạp ở đây chỉ nói “một linh”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ sắc thái chỉ dẫn đầy sống động trong lời người cha, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: πνεῦμα
  choice: một linh
  rationale: Giữ đúng mức độ khái quát của từ Hy Lạp, vốn không có tính từ 'ô uế' hay danh từ 'quỷ' trong câu này.
- source_word: λαμβάνει
  choice: bắt lấy
  rationale: Diễn tả hành động khống chế mạnh mẽ của linh mà không thêm ý đột ngột, vì ý ấy được ἐξαίφνης nêu riêng.
- source_word: ἐξαίφνης
  choice: thình lình
  rationale: Truyền đạt sự khởi phát bất ngờ, phù hợp với giọng kể sống động.
- source_word: κράζει
  choice: nó kêu la
  rationale: Giữ cậu bé làm chủ ngữ ngầm của động từ chủ động, thay vì diễn giải thành 'linh khiến nó kêu la'.
- source_word: σπαράσσει
  choice: làm nó co giật
  rationale: Diễn đạt rõ tác động dữ dội lên thân thể trong ngữ cảnh này; chủ ngữ được nêu là 'linh ấy' để tránh nhập nhằng đại từ.
- source_word: μετὰ ἀφροῦ
  choice: sùi bọt mép
  rationale: Cách nói tự nhiên, dễ hiểu trong tiếng Việt về hiện tượng bọt xuất hiện cùng cơn co giật.
- source_word: μόγις
  choice: chỉ miễn cưỡng mới
  rationale: Trong ngữ cảnh một linh là chủ thể rời đi, cách dịch này truyền đạt việc nó rất khó hoặc không muốn buông tha; vẫn thừa nhận sắc thái 'hầu như không' là khả dĩ.
- source_word: ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: rời khỏi nó
  rationale: Diễn đạt trực tiếp việc linh lìa khỏi cậu bé, không thêm ý trừ tà.
- source_word: συντρῖβον αὐτόν
  choice: sau khi hành hạ nó tàn tệ
  rationale: Truyền đạt hậu quả gây tổn hại nghiêm trọng mà không hiểu theo nghĩa đen quá mức như 'nghiền nát'; cấu trúc phân từ có thể chỉ hành động gắn với lúc rời đi.
theological_decisions:
- issue: Có nên gọi πνεῦμα rõ ràng là quỷ hay ác linh trong chính văn hay không
  choice: một linh
  alternative: một ác linh; một con quỷ
  rationale: Ngữ cảnh cho thấy đây là một hữu thể thù nghịch, nhưng câu Hy Lạp chỉ nói πνεῦμα. Chính văn giữ sự không chuyên biệt ấy, còn chú thích nêu các cách hiểu theo ngữ cảnh.
- issue: Sắc thái của μόγις
  choice: chỉ miễn cưỡng mới
  alternative: hầu như không; rất khó khăn mới
  rationale: Với linh làm chủ ngữ, 'miễn cưỡng' phù hợp với ý nó khó chịu rời đi, nhưng từ Hy Lạp cũng có thể nhấn mạnh mức độ hiếm hoi hoặc khó khăn; không nên biến lựa chọn này thành một khẳng định giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nó” theo mạch nói của người cha về con trai mình; lặp “linh ấy” để làm rõ chủ thể của hành động gây co giật. “Sùi bọt mép” là thành ngữ tự nhiên hơn cách dịch sát chữ “với bọt”.
