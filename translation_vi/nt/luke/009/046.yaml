id: LUK.9.46
reference: Luke 9:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: vi
  text: Bấy giờ, giữa các môn đồ nảy sinh một cuộc tranh luận xem ai trong họ là người lớn hơn hết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giữa họ nảy sinh một sự suy tính” hoặc “Giữa họ nảy sinh một cuộc bàn luận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: nảy sinh
  rationale: Động từ có nghĩa đen là “đi vào”, nhưng khi đi với διαλογισμός, tiếng Việt tự nhiên diễn đạt là một ý nghĩ hay cuộc tranh luận “nảy sinh”.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Liên từ nhẹ nối tiếp diễn tiến câu chuyện; “Bấy giờ” giữ được chức năng chuyển tiếp mà không nhấn quá mạnh quan hệ thời gian.
- source_word: διαλογισμὸς
  choice: một cuộc tranh luận
  rationale: Danh từ có thể chỉ sự suy tính trong lòng hoặc sự bàn luận, tranh luận. Nội dung ganh đua về địa vị trong ngữ cảnh nghiêng về một cuộc tranh luận, nhưng chú thích giữ lại khả năng khác.
- source_word: ἐν αὐτοῖς
  choice: giữa các môn đồ
  rationale: Nghĩa sát là “trong họ”; ở đây cách nói tự nhiên chỉ điều xảy ra trong nhóm môn đồ. Danh từ “các môn đồ” làm rõ đại từ theo ngữ cảnh gần.
- source_word: τὸ τίς ἂν εἴη
  choice: xem ai ... là
  rationale: Cấu trúc này giới thiệu nội dung của cuộc tranh luận. “Xem ai ... là” tự nhiên trong tiếng Việt; sắc thái khả hữu của ἄν với lối mong ước được hàm chứa trong câu hỏi gián tiếp, tránh cách dịch gượng “có thể là”.
- source_word: μείζων
  choice: người lớn hơn hết
  rationale: Dù hình thức Hy Lạp là so sánh hơn, trong phép so sánh giữa cả nhóm nó mang ý nghĩa người đứng cao nhất. “Lớn hơn hết” giữ được hình thái so sánh và sắc thái địa vị, không giới hạn vào tuổi tác hay kích thước.
- source_word: αὐτῶν
  choice: trong họ
  rationale: Sở hữu cách xác định nhóm mà trong đó sự so sánh diễn ra; “ai trong họ” là cách diễn đạt trực tiếp, tự nhiên.
theological_decisions:
- issue: Tính chất sự việc giữa các môn đồ
  choice: một cuộc tranh luận
  alternative: một sự suy tính hoặc bàn luận
  rationale: Nội dung về việc ai lớn hơn hết gợi sắc thái cạnh tranh giữa các môn đồ, nên “tranh luận” phù hợp; tuy nhiên tiếng Hy Lạp cũng có thể chỉ sự suy tính, vì vậy không loại bỏ khả năng ấy mà ghi trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Môn đồ” duy trì thuật ngữ Kinh Thánh quen thuộc; “người lớn hơn hết” diễn tả thứ bậc trong nhóm mà không diễn giải thêm bản chất của sự cao trọng.
