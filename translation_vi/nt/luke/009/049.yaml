source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: vi
  text: 'Giăng đáp: “Thưa Thầy, chúng con thấy có người nhân danh Thầy mà đuổi quỷ, nên chúng con đã cố ngăn người ấy, vì người ấy không cùng đi theo với chúng con.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Giăng đáp
  rationale: Cấu trúc này là một chuyển tiếp trần thuật thông dụng. “Giăng đáp” tự nhiên trong tiếng Việt và giữ được sắc thái lời nói nảy sinh để đáp lại diễn ngôn trước đó; δέ không nhất thiết cần dịch thành một liên từ riêng.
- source_word: Ἐπιστάτα
  choice: Thưa Thầy
  rationale: Trong Lu-ca, ἐπιστάτης là cách các môn đồ xưng hô với Chúa Giê-xu, nhấn mạnh thẩm quyền và vai trò lãnh đạo. “Thưa Thầy” là cách gọi tự nhiên, trang trọng trong tiếng Việt hiện đại.
- source_word: εἴδομέν τινα
  choice: chúng con thấy có người
  rationale: τινα chỉ một người không xác định. “Có người” diễn đạt đúng tính bất định và phù hợp văn phong tiếng Việt.
- source_word: ἐν τῷ ὀνόματί σου
  choice: nhân danh Thầy
  rationale: Thành ngữ này nói đến việc hành động dựa trên danh và thẩm quyền của Chúa Giê-xu. “Nhân danh Thầy” vừa tự nhiên vừa giữ được sức nặng thần học.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: đuổi quỷ
  rationale: ἐκβάλλω trong ngữ cảnh trừ quỷ có nghĩa là đuổi hoặc trục xuất. “Đuổi quỷ” rõ ràng, quen thuộc và không cổ kính quá mức.
- source_word: ἐκωλύομεν αὐτόν
  choice: chúng con đã cố ngăn người ấy
  rationale: Thì chưa hoàn thành có thể diễn tả hành động đang diễn ra hoặc được cố thực hiện. “Đã cố ngăn” bảo toàn sắc thái nỗ lực mà không khẳng định rằng họ đã ngăn thành công.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: vì người ấy không cùng theo Thầy với chúng con
  rationale: μεθ’ ἡμῶν có nghĩa đen là “với chúng con”. Bổ sung đối tượng “Thầy” theo nghĩa hàm ẩn của ἀκολουθεῖ giúp câu tiếng Việt tự nhiên, đồng thời “cùng… với chúng con” giữ trọng tâm rằng người ấy không thuộc nhóm đồng hành của các môn đồ.
theological_decisions:
- issue: Sự mơ hồ về đối tượng được đi theo và tư cách thuộc nhóm môn đồ
  choice: không cùng theo Thầy với chúng con
  alternative: không theo chúng con
  rationale: Bản Hy Lạp nói “không theo với chúng con”, nhấn mạnh việc người ấy không đồng hành trong nhóm các môn đồ hơn là cho rằng người ấy chống lại Chúa Giê-xu. Cách dịch đã chọn giữ “với chúng con” và làm rõ đối tượng hàm ẩn là “Thầy” mà không biến các môn đồ thành đối tượng tối hậu của việc đi theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Thầy/chúng con” để phản ánh quan hệ môn đồ với Chúa Giê-xu. Tên Ἰωάννης được viết là “Giăng”, theo lối gọi Kinh Thánh tiếng Việt quen thuộc.
