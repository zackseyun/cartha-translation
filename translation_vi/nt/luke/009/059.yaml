    rationale: Chú thích giải thích trật tự của πρῶτον; vì vậy ký hiệu nên được đặt ngay sau «trước đã», thay vì sau toàn bộ câu trích dẫn. Việc này làm rõ phạm vi chú thích mà không đổi nghĩa.
