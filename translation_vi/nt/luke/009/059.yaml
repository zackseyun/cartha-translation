  terminology: «Ngài», «Ta», «Lạy Chúa», và «cha tôi» nhất quán với văn phong trang trọng và với các thuật ngữ then chốt. Không có diễn giải giáo phái hoặc suy đoán về việc người cha đã qua đời hay chưa.
