source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: vi
  text: 'Ngài phán với một người khác: “Hãy theo Ta.” Nhưng người ấy thưa: “Lạy Chúa, xin cho phép tôi đi chôn cha tôi trước đã[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin cho phép tôi trước hết đi chôn cha tôi.”'
    reason: Cách đặt πρῶτον cho phép diễn đạt thứ tự bằng hơn một cấu trúc tự nhiên trong tiếng Việt mà không làm thay đổi ý chính.
lexical_decisions:
- source_word: ἕτερον
  choice: một người khác
  rationale: Diễn đạt tự nhiên ý ‘một người khác’ trong mạch kể chuyện, đồng thời giữ nét phân biệt của ἕτερος mà không xác định thêm danh tính.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo Ta
  rationale: Mệnh lệnh hiện tại được chuyển thành lời kêu gọi trực tiếp, tự nhiên trong tiếng Việt; không thêm ý ‘tiếp tục’ vì ngữ cảnh không đòi hỏi phải làm rõ thể chưa hoàn thành.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ được cả sắc thái xưng hô kính trọng lẫn sức nặng thần học có thể có khi nhân vật nói với Đức Giê-su.
- source_word: ἐπίτρεψόν μοι
  choice: xin cho phép tôi
  rationale: Diễn đạt rõ lời xin được chấp thuận, đồng thời giữ giọng kính trọng của câu nguyên văn.
- source_word: ἀπελθόντι πρῶτον θάψαι
  choice: đi chôn … trước đã
  rationale: Cách nói Việt tự nhiên, thể hiện việc người ấy xin thực hiện việc chôn cất trước khi đáp lại lời kêu gọi; không suy diễn cha ông đã chết từ bao lâu.
- source_word: τὸν πατέρα μου
  choice: cha tôi
  rationale: Bản dịch trực tiếp, rõ nghĩa của cụm danh từ có đại từ sở hữu.
theological_decisions:
- issue: Cách dịch κύριος khi thưa với Đức Giê-su
  choice: Chúa
  alternative: Thầy; ngài
  rationale: ‘Chúa’ bảo toàn sự căng mở giữa một lời xưng hô kính trọng và hàm ý thần học trong trình thuật Lu-ca, thay vì thu hẹp từ này thành một danh xưng xã giao đơn thuần.
- issue: Tình trạng của người cha và thời điểm chôn cất
  choice: Không giải thích thêm
  alternative: Hiểu rằng người cha vừa qua đời; hoặc hiểu là người cha còn sống và người ấy xin trì hoãn cho đến sau này
  rationale: Câu Hy Lạp chỉ ghi lời xin đi chôn cha, không xác định người cha đã chết hay đây là một cách nói về nghĩa vụ gia đình lâu dài; bản dịch không tự ý giải quyết sự mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Đức Giê-su trong lời kể, “Ta” trong lời Ngài phán, và “tôi” cho người đáp lời nhằm tránh đưa thêm quan hệ thân thuộc không có trong nguyên văn. “Trước đã” là thành ngữ Việt tự nhiên để biểu thị hành động được xin làm trước.
