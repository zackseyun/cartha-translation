  verdict: revise
  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố chính của câu Hy Lạp: Đức Giê-su nói với «một người khác», mệnh lệnh «Hãy theo Ta», và lời xin được đi chôn cha trước. «Lạy Chúa» giữ được cách xưng hô Κύριε mà không giải quyết quá mức sắc thái của danh xưng. Cụm «đi chôn cha tôi trước đã» là cách Việt tự nhiên, diễn tả việc xin làm công việc này trước khi đáp lại lời gọi, dù tiếng Việt gộp hành động «đi» với «chôn» chặt hơn nguyên văn.'
