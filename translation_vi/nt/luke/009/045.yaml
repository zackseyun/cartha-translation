  source_fidelity: 'Bản nháp giữ đúng các yếu tố chính: các môn đồ không hiểu phát ngôn ấy; phát ngôn bị che giấu khỏi họ; họ không dám hỏi Đức Giê-su về điều đó. Tuy nhiên, ἵνα μὴ αἴσθωνται αὐτό biểu thị mục đích rõ ràng hơn “khiến” (một từ dễ nghiêng về hệ quả). Nên dịch “để họ không nhận biết được nó” để bảo toàn quan hệ cú pháp của nguyên văn, mà vẫn không nêu tác nhân của thể bị động.'
  naturalness: “Bị che khuất khỏi họ” có thể hiểu được nhưng hơi gượng trong tiếng Việt hiện đại. “Bị che giấu khỏi họ” tự nhiên hơn trong ngữ cảnh một ý nghĩa bị ẩn khỏi nhận thức của họ. Cấu trúc “sợ không dám hỏi” tự nhiên và phù hợp.
  terminology: “Lời ấy” là tương đương phù hợp cho ῥῆμα trong ngữ cảnh này; việc lặp lại cụm từ phản ánh nguyên văn. “Nhận biết” giúp tránh lặp ngay “hiểu” cho hai động từ Hy Lạp khác nhau. “Ngài” là lối xưng hô kính trọng thông dụng khi chỉ Đức Giê-su trong văn phong Kinh Thánh tiếng Việt.
