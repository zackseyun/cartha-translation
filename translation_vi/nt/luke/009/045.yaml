  to: Nhưng các môn đồ không hiểu lời ấy[a]. Lời ấy bị che giấu khỏi họ, để họ không nhận biết được nó[b]; và họ sợ không dám hỏi Ngài về lời ấy.
  rationale: Bản sửa thay “khiến” bằng “để” để phản ánh chức năng mục đích của ἵνα, và thay “che khuất” bằng “che giấu” cho tiếng Việt tự nhiên hơn. Không có tác nhân nào được thêm vào cho hành động che giấu; vì vậy sự mơ hồ có chủ ý của nguyên văn vẫn được giữ nguyên.
