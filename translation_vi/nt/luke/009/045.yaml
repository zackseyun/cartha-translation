id: LUK.9.45
reference: Luke 9:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: vi
  text: Nhưng các môn đồ không hiểu lời ấy[a]. Lời ấy bị che giấu khỏi họ, để họ không nhận biết được nó[b]; và họ sợ không dám hỏi Ngài về lời ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lời” (ῥῆμα) ở đây cũng có thể hiểu là “lời nói”, “điều đã nói” hoặc “việc ấy”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn dùng thể bị động: “lời ấy bị che giấu khỏi họ”, nhưng không nêu ai đã che giấu. Mệnh đề tiếp theo theo sát nguyên văn có thể dịch là “để họ không nhận biết được nó”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: không hiểu
  rationale: Trong ngữ cảnh, động từ chỉ việc các môn đồ không nắm được ý nghĩa lời Đức Giê-su vừa nói; “không hiểu” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: ῥῆμα
  choice: lời ấy
  rationale: Ở đây ῥῆμα chỉ phát ngôn cụ thể vừa được nói. “Lời ấy” trang trọng, tự nhiên và giữ trọng tâm vào lời nói; chú thích nêu khả năng dịch khác.
- source_word: παρακεκαλυμμένον
  choice: bị che khuất
  rationale: Cấu trúc bị động diễn tả tình trạng lời ấy bị che giấu mà không nêu tác nhân. “Bị che khuất” bảo toàn thể bị động và không giải thích quá mức.
- source_word: ἀπ’ αὐτῶν
  choice: khỏi họ
  rationale: Giữ nghĩa cơ bản của ἀπό, cho biết nội dung ấy bị che khuất khỏi nhận thức của các môn đồ.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: khiến họ không nhận biết được
  rationale: “Nhận biết” giữ sự phân biệt với ἠγνόουν (“không hiểu”). “Khiến” diễn đạt quan hệ kết quả hoặc mục đích mà không ép câu tiếng Việt theo một cách hiểu thần học cụ thể.
- source_word: ἐφοβοῦντο ἐρωτῆσαι
  choice: họ sợ không dám hỏi
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt nỗi sợ đã ngăn họ hỏi Đức Giê-su để được giải thích.
theological_decisions:
- issue: Tác nhân che khuất lời ấy
  choice: Giữ cấu trúc bị động “bị che khuất khỏi họ”, không nêu tác nhân.
  alternative: Nói rõ Đức Chúa Trời đã che khuất lời ấy, hoặc diễn đạt đơn thuần rằng lời ấy vẫn tối nghĩa đối với họ.
  rationale: Nguyên văn không xác định ai hoặc điều gì đã che khuất lời ấy. Giữ thể bị động bảo toàn sự mơ hồ và căng thẳng thần học của câu.
- issue: Sắc thái của ἵνα
  choice: Dịch là “khiến”, cho phép sắc thái hệ quả trong tiếng Việt mà vẫn không loại trừ ý mục đích.
  alternative: “để họ không nhận biết được”, nhấn mạnh rõ hơn ý mục đích.
  rationale: ἵνα thường chỉ mục đích nhưng trong ngữ cảnh cũng có thể được hiểu theo hệ quả. “Khiến” tránh gán ý định cho một tác nhân không được nêu, còn chú thích giúp độc giả thấy cấu trúc nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các môn đồ” để làm rõ chủ thể theo ngữ cảnh, và “Ngài” làm đại từ kính trọng chỉ Đức Giê-su. Việc lặp “lời ấy” phản ánh sự lặp lại của τὸ ῥῆμα τοῦτο trong nguyên văn.
