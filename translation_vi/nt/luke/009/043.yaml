  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: vi
  text: 'Tất cả đều kinh ngạc trước sự vĩ đại của Đức Chúa Trời[a]. Nhưng trong khi mọi người đang thán phục mọi việc Chúa Giê-su đang làm, Ngài nói với các môn đồ của Ngài:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sự uy nghi” hay “sự huy hoàng của Đức Chúa Trời”. Từ Hy Lạp μεγαλειότης có thể chỉ sự vĩ đại, cao cả, huy hoàng hoặc uy nghi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: đều kinh ngạc
  rationale: Diễn tả trạng thái kinh ngạc mạnh và đang tiếp diễn; “kinh ngạc” tự nhiên, trang trọng và mạnh hơn “thán phục” ở mệnh đề sau.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: trước sự uy nghi của Đức Chúa Trời
  rationale: ἐπί với cách ba nêu đối tượng hoặc căn nguyên của sự kinh ngạc; “sự uy nghi” truyền đạt μεγαλειότης là sự vĩ đại, huy hoàng hay oai nghiêm của Đức Chúa Trời.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Nhưng trong khi mọi người còn thán phục
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề thời gian; “còn” giữ sắc thái đang tiếp diễn và “thán phục” phân biệt θαυμάζω với động từ mạnh hơn ở câu trước.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: tất cả những việc Đức Chúa Jêsus đang làm
  rationale: Giữ phạm vi toàn thể của πᾶσιν và thể chưa hoàn thành của ἐποίει; gọi rõ Đức Chúa Jêsus để tránh đại từ tiếng Việt có thể mơ hồ hoặc bị hiểu nhầm là Đức Chúa Trời.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: Ngài phán với các môn đồ mình
  rationale: “Phán” phù hợp với lời trang trọng của Đức Chúa Jêsus trong văn phong Kinh Thánh; “các môn đồ mình” là cách diễn đạt tiếng Việt tự nhiên cho đối tượng và quan hệ sở hữu.
theological_decisions:
- issue: Chủ thể của οἷς ἐποίει và εἶπεν
  choice: Đức Chúa Jêsus là người đang làm các việc ấy và phán với môn đồ
  alternative: Có thể để đại từ “Ngài” theo sát nguyên văn, nhưng trong tiếng Việt đại từ này dễ bị quy chiếu về “Đức Chúa Trời” ở mệnh đề trước
  rationale: Ngữ cảnh kể chuyện xác định Đức Chúa Jêsus là tác nhân và người nói, trong khi quyền năng được biểu lộ vẫn được gọi là sự uy nghi của Đức Chúa Trời. Cách dịch giữ sự phân biệt này mà không giải quyết thêm mối quan hệ thần học giữa hai cách diễn đạt.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời”, “Đức Chúa Jêsus”, “môn đồ” và “phán” theo văn phong Kinh Thánh Tin Lành quen thuộc; câu văn giữ sự tương phản giữa mức độ “kinh ngạc” và “thán phục”. Không cần chú thích vì “sự uy nghi” bao quát nghĩa từ vựng chính và việc nêu rõ Đức Chúa Jêsus chỉ làm sáng tỏ chủ thể do ngữ pháp tiếng Việt đòi hỏi.
