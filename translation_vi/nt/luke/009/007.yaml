id: LUK.9.7
reference: Luke 9:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: vi
  text: Tiểu vương Hê-rốt nghe biết mọi việc đang xảy ra và rất bối rối, vì có một số người nói rằng Giăng đã được làm cho sống lại từ cõi chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giăng đã sống lại từ cõi chết.” Động từ Hy Lạp ở thể bị động, sát nghĩa là “đã được làm cho sống lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσεν
  choice: nghe biết
  rationale: Diễn đạt tự nhiên việc Hê-rốt nhận được tin về các biến cố, phù hợp với tân ngữ chỉ mọi việc đang xảy ra.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ nhẹ để tiếp nối mạch kể; tiếng Việt không cần thêm “bấy giờ” hay “nhưng” trong câu này.
- source_word: ὁ τετραάρχης
  choice: tiểu vương
  rationale: Thuật ngữ tiếng Việt quen dùng cho chức tetrarch, phân biệt với vua nhưng vẫn biểu thị địa vị cai trị.
- source_word: τὰ γινόμενα πάντα
  choice: mọi việc đang xảy ra
  rationale: Giữ ý bao quát và khía cạnh diễn tiến của phân từ hiện tại.
- source_word: διηπόρει
  choice: rất bối rối
  rationale: Diễn đạt trạng thái hoang mang, không biết phải hiểu thế nào; sắc thái tăng cường của động từ được thể hiện bằng “rất”.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: vì có một số người nói rằng
  rationale: Chuyển cấu trúc bị động Hy Lạp sang cách nói chủ động tự nhiên trong tiếng Việt, đồng thời giữ nguyên nguyên nhân và chủ thể bất định “một số người”.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Giữ hình thái bị động của động từ ἐγείρω và nghĩa phục sinh, không đổi thành cách nói chủ động “đã sống lại”.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói tự nhiên, trang trọng trong tiếng Việt để chỉ sự trở về từ tình trạng của người chết.
theological_decisions:
- issue: Cách diễn đạt lời đồn về sự sống lại của Giăng
  choice: đã được làm cho sống lại từ cõi chết
  alternative: đã sống lại từ cõi chết
  rationale: Bản văn Hy Lạp dùng thể bị động ἠγέρθη; bản dịch chính giữ thể này mà không xác định rõ tác nhân, qua đó tránh âm thầm giải quyết sắc thái thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Hê-rốt” và “Giăng” theo lối phiên âm Kinh Thánh quen thuộc; “tiểu vương” bảo toàn chức danh lịch sử mà không gọi Hê-rốt là vua.
