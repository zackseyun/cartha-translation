  naturalness: Câu văn tự nhiên, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Nghe biết” diễn đạt hợp lý việc nhận được tin tức; “rất bối rối” phản ánh thích đáng trạng thái hoang mang của διηπόρει. Dấu câu kết câu là chấp nhận được trong bản dịch theo câu, dù nguyên văn tiếp tục sang câu sau.
