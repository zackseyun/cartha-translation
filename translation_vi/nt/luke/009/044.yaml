  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: mệnh lệnh số nhiều, danh hiệu “Con Người”, ý sắp xảy ra của μέλλει, và ý bị trao vào quyền lực con người của παραδίδοσθαι εἰς χεῖρας ἀνθρώπων. Tuy nhiên, “ghi những lời này vào tai mình” không phải là cách kết hợp từ tự nhiên trong tiếng Việt hiện đại và đại từ phản thân “mình” có thể làm mờ đối tượng số nhiều. Chuyển thành “ghi nhớ kỹ” diễn đạt đúng lực dụng của thành ngữ Hy Lạp—hãy đặc biệt tiếp nhận và lưu tâm đến lời sắp nói—mà không thêm diễn giải giáo lý.'
