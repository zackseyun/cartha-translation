  terminology: “Con Người” là cách dịch chuẩn, thích hợp cho danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου. “Bị nộp” giữ được phạm vi rộng của παραδίδοσθαι hơn “bị phản bội”. “Người ta” truyền đạt tự nhiên ἀνθρώπων trong cụm thành ngữ, không hạn hẹp thành chỉ nam giới.
