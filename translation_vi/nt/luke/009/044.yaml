reference: Luke 9:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: vi
  text: Các con hãy ghi nhớ kỹ những lời này, vì Con Người sắp bị nộp[a] vào tay người ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị phản bội”. Động từ Hy Lạp có thể mang nghĩa “nộp”, “trao” hoặc, trong một số ngữ cảnh, “phản bội”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vào tay những con người”. Cụm từ này chỉ việc bị đặt dưới quyền lực của con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Các con hãy ghi ... vào tai mình
  rationale: Giữ hình ảnh sống động của nguyên văn về việc chủ ý tiếp nhận và ghi nhớ lời Chúa, đồng thời dùng cách diễn đạt có thể hiểu tự nhiên trong tiếng Việt. Chủ ngữ “các con” được nêu rõ để phản ánh sắc thái nhấn mạnh của ὑμεῖς.
- source_word: τοὺς λόγους τούτους
  choice: những lời này
  rationale: Chỉ trực tiếp lời Đức Giê-su sắp nói; “những lời này” vừa sát nghĩa vừa tự nhiên.
- source_word: ὁ γὰρ
  choice: vì
  rationale: 'Thể hiện quan hệ giải thích: điều sắp xảy đến với Con Người là lý do các môn đồ phải đặc biệt chú ý.'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh hiệu đã quen thuộc trong tiếng Việt, duy trì tính hàm súc và âm hưởng Đa-ni-ên mà không diễn giải thêm.
- source_word: μέλλει
  choice: sắp
  rationale: Diễn tả hành động sắp xảy ra, không thêm ý nghĩa mạnh hơn về tiền định.
- source_word: παραδίδοσθαι
  choice: bị nộp
  rationale: Bao quát ý bị trao vào quyền lực của người khác và không thu hẹp trước thành riêng hành vi phản bội của Giu-đa.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: vào tay người ta
  rationale: Giữ thành ngữ chỉ việc rơi vào quyền lực của con người; “người ta” ở đây tự nhiên hơn “những người đàn ông” và phù hợp phạm vi nghĩa rộng của ἀνθρώπων.
theological_decisions:
- issue: Cách dịch danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng thuộc về loài người
  rationale: “Con Người” bảo tồn danh hiệu truyền thống, tính đa nghĩa và liên hệ có thể có với Đa-ni-ên 7, thay vì giải nghĩa ngay trong bản văn.
- issue: Phạm vi nghĩa của παραδίδοσθαι
  choice: bị nộp
  alternative: bị phản bội
  rationale: Nguyên văn có thể bao gồm sự phản bội nhưng nhấn mạnh rộng hơn việc Đức Giê-su bị trao vào quyền lực của người khác; bản dịch chính không nên thu hẹp sự căng thẳng tự sự.
- issue: Phạm vi của ἀνθρώπων
  choice: người ta
  alternative: loài người
  rationale: Trong ngữ cảnh, danh từ số nhiều có thể chỉ con người nói chung. “Người ta” giữ nét chỉ các tác nhân con người mà không khẳng định họ chỉ là nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các con” phù hợp lời Đức Giê-su trực tiếp nói với các môn đồ trong ngữ cảnh. Hình ảnh “ghi ... vào tai” được giữ có chủ ý thay vì diễn giải hoàn toàn thành “hãy chú ý”, nhằm bảo tồn sức gợi của nguyên văn.
