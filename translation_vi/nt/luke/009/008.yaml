source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: vi
  text: còn một số người nói rằng Ê-li đã hiện ra, và những người khác nói rằng một vị tiên tri nào đó thời xưa đã sống lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có từ “nào đó”.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: một số người nói ... những người khác nói
  rationale: Hy Lạp dùng kết cấu bị lược, theo mạch câu trước để nêu nguồn của các lời đồn. Tiếng Việt cần bổ sung “nói” để câu tự nhiên và rõ nghĩa.
- source_word: δὲ ... δὲ
  choice: còn ... và
  rationale: Các tiểu từ nối tiếp những ý kiến khác nhau trong danh sách; cách dịch này thể hiện sự chuyển ý nhẹ mà không nhấn mạnh đối lập.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: ἐφάνη
  choice: đã hiện ra
  rationale: Động từ chỉ việc xuất hiện hoặc trở nên thấy được; cách dịch này phân biệt nó với ngôn ngữ sống lại ở vế sau.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: một nhà tiên tri thời xưa nào đó
  rationale: τις mang sắc thái bất định “nào đó”, còn τῶν ἀρχαίων xác định nhà tiên tri ấy thuộc thời xa xưa. Trật tự tiếng Việt này tự nhiên mà không xác định đó là vị nào.
- source_word: ἀνέστη
  choice: đã sống lại
  rationale: Trong ngữ cảnh lời đồn về một nhà tiên tri thời xưa trở lại, động từ mang nghĩa đứng dậy từ cõi chết. “Sống lại” truyền đạt rõ sắc thái phục sinh mà không chuyển thành thể bị động.
theological_decisions:
- issue: Bản chất lời đồn về nhà tiên tri thời xưa
  choice: đã sống lại
  alternative: đã xuất hiện trở lại; đã được làm cho sống lại
  rationale: ἀνέστη tự nhiên gợi ý việc sống lại trong ngữ cảnh này. Bản dịch giữ nguyên nội dung lời đồn, không xác nhận lời ấy là đúng và cũng không xác định nhà tiên tri nào.
- issue: Mối liên hệ giữa “nhà tiên tri” và “thời xưa”
  choice: một nhà tiên tri thời xưa nào đó
  alternative: một người trong các nhà tiên tri thời xưa
  rationale: Cách chọn giữ sắc thái bất định của τις và quan hệ thuộc về thời xưa của cụm sở hữu, đồng thời tránh diễn giải quá mức cấu trúc Hy Lạp thành một nhóm được xác định rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Vì câu Hy Lạp tiếp nối cấu trúc lược từ câu trước, bản dịch bổ sung “nói rằng” ở cả hai vế để tiếng Việt đứng câu tự nhiên; “còn” duy trì cảm giác đây là một phần của danh sách các lời đồn.
