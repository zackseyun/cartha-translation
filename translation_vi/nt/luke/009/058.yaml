id: LUK.9.58
reference: Luke 9:58
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: vi
  text: 'Đức Giê-su nói với người ấy: “Cáo có hang, chim trời có tổ, nhưng Con Người[a] không có chỗ gối đầu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con Người” là cách Đức Giê-su tự xưng và có thể gợi nhắc Đa-ni-ên 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: cáo
  rationale: Tên gọi trực tiếp và tự nhiên của loài vật này trong tiếng Việt.
- source_word: φωλεοὺς
  choice: hang
  rationale: Chỉ nơi trú ẩn của thú vật; “hang” đi với “cáo” tự nhiên trong tiếng Việt và giữ hình ảnh cụ thể của nguyên văn.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Cách nói tiếng Việt gọn, trang trọng và tự nhiên, tương ứng với nghĩa đen “chim của trời/bầu trời”.
- source_word: κατασκηνώσεις
  choice: tổ
  rationale: Danh từ chỉ nơi đậu hoặc cư ngụ; trong ngữ cảnh loài chim, “tổ” là cách diễn đạt tự nhiên nhất.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ cách gọi tự thân quen thuộc của Đức Giê-su và khả năng gợi nhắc Đa-ni-ên 7:13–14, không diễn giải thành một danh xưng khác.
- source_word: οὐκ ἔχει ποῦ
  choice: không có chỗ
  rationale: Diễn đạt tự nhiên cấu trúc phủ định mang nghĩa “không có nơi nào” trong tiếng Hy Lạp.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: gối đầu
  rationale: Thành ngữ tiếng Việt tự nhiên, giữ hình ảnh cụ thể về việc có một nơi để ngả đầu nghỉ.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện rõ sự tương phản giữa chỗ trú của các loài vật và tình trạng không có chỗ gối đầu của Con Người.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Đức Giê-su nói với người ấy
  rationale: Theo sát trật tự ý nghĩa của nguyên văn, đồng thời dùng lối kể tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh xưng υἱὸς τοῦ ἀνθρώπου của Đức Giê-su
  choice: Con Người
  alternative: con người; Đấng Con Người
  rationale: “Con Người” là danh xưng đã được nhận biết rộng rãi trong Kinh Thánh tiếng Việt, vừa giữ hình thức nguyên ngữ vừa bảo toàn khả năng liên hệ đến Đa-ni-ên 7 mà không giải quyết dứt khoát sắc thái thần học ngay trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; “chim trời” và “gối đầu” tạo nhịp câu tự nhiên mà vẫn gần với hình ảnh Hy Lạp.
