language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Ai tiếp nhận đứa trẻ này nhân danh tôi[a] là tiếp nhận tôi; còn ai tiếp nhận tôi là tiếp nhận Đấng đã sai tôi. Vì người nhỏ nhất trong tất cả anh em, chính người ấy là người lớn lao.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tiếp nhận” cũng có thể dịch là “đón tiếp” trong suốt câu này; động từ Hy Lạp có thể bao hàm cả sự chấp nhận lẫn lòng hiếu khách.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: tiếp nhận
  rationale: Giữ nguyên sự lặp lại có chủ ý của động từ Hy Lạp, đồng thời bao hàm cả ý đón tiếp và chấp nhận; chú thích nêu phương án tự nhiên khác.
- source_word: παιδίον
  choice: đứa trẻ
  rationale: Diễn đạt nghĩa thông thường của danh từ, không nhấn quá mức sắc thái nhỏ tuổi vốn không bắt buộc ở đây.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: nhân danh tôi
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ được mối liên hệ với danh, thẩm quyền và tư cách đại diện của Chúa Giê-su mà không thu hẹp nghĩa.
- source_word: τὸν ἀποστείλαντά με
  choice: Đấng đã sai tôi
  rationale: Chuyển phân từ có mạo từ thành cụm danh từ trang trọng, tự nhiên; không tự ý xác định rõ là Đức Chúa Cha hay Đức Chúa Trời khi nguyên văn không nêu danh xưng.
- source_word: μικρότερος
  choice: người nhỏ nhất
  rationale: Trong ngữ cảnh tranh luận về địa vị, từ này chỉ người thấp kém hoặc ít quan trọng nhất hơn là người nhỏ tuổi nhất; cách dịch vẫn giữ hình ảnh đối lập nhỏ–lớn.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: trong tất cả anh em
  rationale: Diễn đạt vị trí của một người ở giữa toàn thể nhóm môn đồ bằng tiếng Việt tự nhiên.
- source_word: ὑπάρχων
  choice: người ... trong
  rationale: Ý vị ngữ của phân từ được hòa vào cụm danh từ tiếng Việt, tránh lối dịch cứng là ‘đang hiện hữu như’.
- source_word: οὗτός ἐστιν μέγας
  choice: chính người ấy là người lớn
  rationale: ‘Chính người ấy’ bảo tồn sự nhấn mạnh của đại từ chỉ định; ‘người lớn’ duy trì trực tiếp nghịch lý nhỏ–lớn của nguyên văn.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Ai ... còn ai
  rationale: Diễn đạt điều kiện khái quát bất định một cách gọn và tự nhiên, đồng thời nối rõ hai vế.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Ngài phán với họ
  rationale: Đại từ ‘Ngài’ và động từ ‘phán’ phù hợp văn phong Kinh Thánh trang trọng hiện đại; không buộc dịch καί thành quan hệ thời gian không có trong nguyên văn.
theological_decisions:
- issue: Đấng được nói đến trong cụm ‘Đấng đã sai tôi’
  choice: Giữ cách gọi hàm ẩn ‘Đấng đã sai tôi’.
  alternative: ‘Đức Chúa Cha đã sai tôi’ hoặc ‘Đức Chúa Trời đã sai tôi’.
  rationale: Nguyên văn dùng một phân từ có mạo từ chứ không trực tiếp nêu Đức Chúa Cha hay Đức Chúa Trời; bản dịch giữ nguyên quan hệ sai phái mà không mở rộng câu.
- issue: Ý nghĩa của việc tiếp nhận đứa trẻ ‘nhân danh tôi’
  choice: Giữ phạm vi nghĩa liên quan đến danh, thẩm quyền và tư cách đại diện của Chúa Giê-su.
  alternative: ‘Vì đứa trẻ thuộc về tôi’ hoặc ‘vì cớ tôi’.
  rationale: ‘Nhân danh tôi’ bảo tồn chiều rộng thần học của cụm từ và không biến lời dạy thành lòng hiếu khách chung chung.
- issue: Nghịch lý về sự lớn lao
  choice: Giữ đối lập trực tiếp giữa ‘người nhỏ nhất’ và ‘người lớn’.
  alternative: ‘Người trẻ tuổi nhất trong anh em là người lớn’.
  rationale: Ngữ cảnh hướng đến địa vị khiêm hạ trong cộng đồng, không chỉ tuổi tác; cách dịch không làm dịu sự đảo ngược giá trị trong lời Chúa Giê-su.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘anh em’ để chỉ nhóm môn đồ trong lời nói trực tiếp. Giữ chuỗi lặp ‘tiếp nhận’ và nghịch lý ‘nhỏ nhất—lớn’; chỉ đặt một chú thích đúng tại nội dung cần giải thích.
