  rationale: Bản sửa thay hai cách kết hợp từ chưa tự nhiên bằng cách diễn đạt Việt ngữ rõ hơn, đồng thời duy trì hình ảnh cày ruộng, tương quan thể của các phân từ Hy Lạp, và tính không xác định về mặt thần học của εὔθετος τῇ βασιλείᾳ τοῦ θεοῦ.
