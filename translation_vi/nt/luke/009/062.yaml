source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói: “Không ai đã tra tay vào cày mà còn ngoái nhìn phía sau thì thích hợp cho vương quốc Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thích hợp” cũng có thể dịch là “hữu dụng” hoặc “phù hợp.”
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái chuyển ý có phần tương phản của δέ trong lời Đức Giê-su đáp lại người vừa nói trước đó.
- source_word: Οὐδεὶς
  choice: Không ai
  rationale: Giữ nguyên ý phủ định phổ quát, tự nhiên trong tiếng Việt hiện đại và không thêm yếu tố giới tính.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: đã đặt tay vào cày
  rationale: Giữ hình ảnh nông nghiệp và thể hiện hành động khởi đầu đã xảy ra trước hành động đang tiếp diễn ở mệnh đề sau.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: còn ngoái nhìn phía sau
  rationale: Thể hiện hành động đang tiếp diễn hoặc có tính đặc trưng; “ngoái nhìn” gợi rõ việc đang tiến tới nhưng quay sự chú ý về phía sau mà không biến nghĩa thành “quay trở lại.”
- source_word: εὔθετός
  choice: thích hợp
  rationale: Diễn đạt sự phù hợp hoặc hữu dụng cho một mục đích, tránh tự ý chuyển thành “xứng đáng” hay xác quyết trực tiếp về sự cứu rỗi.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: với vương quốc Đức Chúa Trời
  rationale: Dịch cách ngữ chỉ điều mà một người được xem là phù hợp; “vương quốc Đức Chúa Trời” giữ cách diễn đạt quen thuộc và không thu hẹp βασιλεία chỉ còn hoạt động cai trị.
theological_decisions:
- issue: Hàm ý của εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: Dịch là “thích hợp với vương quốc Đức Chúa Trời,” giữ trọng tâm ở sự phù hợp trước đòi hỏi của vương quốc.
  alternative: “xứng đáng vào vương quốc” hoặc “hữu dụng trong công việc của vương quốc”
  rationale: Nguyên văn nói đến sự thích hợp nhưng không giải thích cụ thể đây là tư cách được vào vương quốc hay tính hữu dụng trong việc phục vụ vương quốc. Bản dịch giữ nguyên sức cảnh báo và sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” và “Đức Chúa Trời” phù hợp với lối gọi tôn kính phổ biến. Cấu trúc câu giữ hình ảnh cày ruộng sống động mà không biến lời nói thành một thành ngữ xa lạ với độc giả Việt.
