  - severity: low
    issue: “thích hợp với vương quốc”
    rationale: Với nghĩa εὔθετος ở đây, “thích hợp cho vương quốc” tự nhiên hơn và vẫn giữ tính mở của nguyên văn về phạm vi sự phù hợp.
