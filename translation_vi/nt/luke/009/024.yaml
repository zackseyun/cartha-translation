  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: vi
  text: Vì ai muốn cứu mạng sống mình thì sẽ mất nó[a]; còn ai vì tôi mà mất mạng sống mình thì người ấy sẽ cứu nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “linh hồn mình” hoặc “chính mình”; từ Hy Lạp này có thể có nghĩa là mạng sống, linh hồn hoặc bản thân, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: Vì ai muốn
  rationale: ὃς ... ἂν với động từ ở thể giả định diễn tả một điều kiện khái quát, được chuyển tự nhiên là “ai”; γάρ giữ mối liên hệ giải thích bằng “Vì”; θέλῃ là “muốn”.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: mạng sống mình
  rationale: Trong nghịch lý về cứu và mất, ψυχή trước hết chỉ sự sống hay chính bản thân con người. “Mạng sống” phù hợp ngữ cảnh, còn “mình” diễn đạt tự nhiên sở hữu phản thân trong tiếng Việt.
- source_word: σῶσαι / σώσει
  choice: cứu / sẽ cứu được
  rationale: Giữ sự lặp lại của cùng động từ σῴζω và nghịch lý trong câu. “Cứu được” ở vế cuối là cách nói tự nhiên, thể hiện kết quả mà không thêm một tác nhân hay giáo lý ngoài văn bản.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: sẽ mất / mất
  rationale: ἀπόλλυμι ở đây mang nghĩa mất sự sống; dùng cùng một từ “mất” ở cả hai vế để bảo toàn cấu trúc đối xứng.
- source_word: ἕνεκεν ἐμοῦ
  choice: vì tôi
  rationale: Cụm giới từ chỉ nguyên nhân hoặc động cơ. “Vì tôi” ngắn gọn, tự nhiên và giữ trọng tâm cá nhân của lời Đức Giê-su.
- source_word: οὗτος
  choice: người ấy
  rationale: Đại từ chỉ định có tính nhấn mạnh, quy chiếu rõ đến người vừa được mô tả. “Người ấy” tự nhiên hơn “người này” trong câu khái quát tiếng Việt mà vẫn giữ được sự nhấn mạnh.
theological_decisions:
- issue: Nghĩa của ψυχή trong nghịch lý của Đức Giê-su
  choice: mạng sống
  alternative: linh hồn; bản thân
  rationale: Ngữ cảnh nói về việc theo Đức Giê-su, từ bỏ mình và nghịch lý giữa giữ với mất sự sống. “Mạng sống” truyền đạt nghĩa trực tiếp mà không thu hẹp ψυχή vào phần phi vật chất của con người; chú thích giữ lại phạm vi nghĩa rộng.
- issue: Cấu trúc quy chiếu giống đực số ít mang nghĩa khái quát
  choice: ai … mình … người ấy
  alternative: người nào … người đó; bất cứ ai … họ
  rationale: Tiếng Việt không cần đánh dấu giống ngữ pháp. Cấu trúc số ít “ai … mình … người ấy” vừa bao quát mọi người vừa giữ mạch quy chiếu số ít của Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ giải thích “Vì”, thế đối xứng “cứu—mất / mất—cứu”, cùng đại từ nhấn mạnh οὗτος bằng “người ấy”. Dấu [a] đặt ngay sau lần xuất hiện đầu tiên của ý niệm ψυχή cần chú thích.
