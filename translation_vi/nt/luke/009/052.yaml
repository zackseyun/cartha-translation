    rationale: πρὸ προσώπου αὐτοῦ nghĩa là “trước mặt/người ấy,” theo văn mạch chỉ Chúa Giê-su. Trong tiếng Việt hiện đại, “mình” ở đây có sắc thái khẩu ngữ và kém rõ khi chủ ngữ đã được gọi là “Ngài”; “đi trước Ngài” trực tiếp, tự nhiên và chính xác hơn.
