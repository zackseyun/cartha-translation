  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: vi
  text: Ngài sai các sứ giả đi trước Ngài. Họ lên đường, vào một làng của người Sa-ma-ri[a] để chuẩn bị cho Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một làng của dân Sa-ma-ri” hoặc “một làng Sa-ma-ri.” Tiếng Hy Lạp sát nghĩa là “một làng của những người Sa-ma-ri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai
  rationale: Động từ này chỉ việc phái người đi làm một nhiệm vụ; “sai” tự nhiên, trang trọng và phù hợp văn mạch.
- source_word: ἀγγέλους
  choice: các sứ giả
  rationale: Trong văn mạch, đây là những người được sai đi trước, không phải thiên sứ; “sứ giả” giữ được ý nghĩa người mang nhiệm vụ.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: đi trước mình
  rationale: Cụm từ có nghĩa đen là “trước mặt Ngài,” nhưng ở đây diễn tả việc đi trước trên hành trình. Đại từ phản thân “mình” làm rõ chủ thể của hành động sai đi mà không gây nhầm lẫn.
- source_word: πορευθέντες
  choice: Họ lên đường
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính. Tách thành mệnh đề “Họ lên đường” vừa giữ trình tự vừa tự nhiên trong tiếng Việt.
- source_word: εἰσῆλθον
  choice: vào
  rationale: Cách dịch ngắn gọn, tự nhiên của động từ “đi vào” trong chuỗi hành động kể chuyện.
- source_word: κώμην
  choice: một làng
  rationale: κώμη thường chỉ một làng hoặc khu định cư nhỏ, nên “làng” chính xác hơn “thành” hay “thị trấn.”
- source_word: Σαμαριτῶν
  choice: của người Sa-ma-ri
  rationale: Giữ hình thức sở hữu của danh từ số nhiều trong tiếng Hy Lạp, có thể hàm ý một làng thuộc về hoặc có cư dân là người Sa-ma-ri.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: để chuẩn bị cho Ngài
  rationale: ὡς với động từ nguyên mẫu diễn tả mục đích. Bản dịch giữ nguyên đối tượng được chuẩn bị không nói rõ như trong tiếng Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang trọng vừa phải. Dùng “Ngài” để chỉ Đức Chúa Jêsus; dùng “Sa-ma-ri” theo cách phiên âm quen thuộc trong tiếng Việt. Không thêm tân ngữ cho việc “chuẩn bị,” vì nguyên văn cũng để ngỏ chuẩn bị điều gì.
