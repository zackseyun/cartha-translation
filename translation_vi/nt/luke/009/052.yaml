  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của nguyên văn: Chúa Giê-su sai những người đi trước; họ đi vào một làng có người Sa-ma-ri; mục đích là chuẩn bị cho Ngài. Tuy nhiên, “đi trước mình” không truyền đạt tự nhiên và rõ ràng đại từ αὐτοῦ trong văn phong Kinh Thánh tiếng Việt.'
  naturalness: Câu văn nhìn chung rõ và hiện đại. Đổi “mình” thành “Ngài” làm tham chiếu nhất quán với chủ ngữ tôn kính, tránh sắc thái khẩu ngữ và khả năng đọc không tự nhiên.
  terminology: “Sứ giả,” “làng,” “người Sa-ma-ri,” và “chuẩn bị cho Ngài” đều phù hợp. “Sứ giả” trong ngữ cảnh này được hiểu là người phái đi, không phải thiên sứ. Cách viết “Sa-ma-ri” nhất quán với bản thảo.
