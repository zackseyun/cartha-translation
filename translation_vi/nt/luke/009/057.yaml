source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: vi
  text: 'Khi họ đang đi dọc đường, có người nói với Ngài: “Tôi sẽ theo Ngài bất cứ nơi nào Ngài đi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “bất cứ nơi nào Ngài có thể đi” hoặc “bất cứ nơi nào Ngài rời đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: khi họ đang đi
  rationale: Kết cấu sở hữu tuyệt đối với phân từ hiện tại diễn tả hành động đang tiếp diễn đồng thời với lời nói; cách dịch này tự nhiên và giữ rõ quan hệ thời gian.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Giữ bối cảnh di chuyển cụ thể của ὁδός, đồng thời phù hợp với cách diễn đạt tự nhiên trong tiếng Việt và không loại bỏ âm hưởng về hành trình trong Lu-ca.
- source_word: εἶπέν τις
  choice: có người nói
  rationale: τις là đại từ bất định; bản dịch không thêm giới tính hay xác định danh tính của người nói.
- source_word: πρὸς αὐτόν
  choice: nói với Ngài
  rationale: πρός đi với động từ nói được chuyển sang cách diễn đạt tiếng Việt tự nhiên; “Ngài” là đại từ tôn kính, trang trọng dành cho Chúa Giê-xu.
- source_word: Ἀκολουθήσω σοι
  choice: Tôi sẽ theo Ngài
  rationale: Thì tương lai diễn tả lời tuyên bố về ý định hoặc cam kết. “Theo” giữ được cả nghĩa di chuyển theo sau lẫn âm hưởng môn đồ mà không diễn giải thêm.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: bất cứ nơi nào Ngài đi
  rationale: ὅπου với ἐάν và thể giả định tạo ý nghĩa bất định “bất cứ nơi nào.” ἀπέρχομαι có thể sát nghĩa hơn là “rời đi,” nhưng trong ngữ cảnh này “đi” là tự nhiên và vẫn giữ trọn phạm vi vô điều kiện của lời cam kết.
theological_decisions:
- issue: Ý nghĩa môn đồ hàm chứa trong ἀκολουθέω
  choice: Dịch là “theo,” không mở rộng thành “trở nên môn đồ”
  alternative: “Tôi sẽ làm môn đồ Ngài bất cứ nơi nào Ngài đi”
  rationale: Trong Lu-ca, động từ này có ý nghĩa môn đồ rõ rệt, nhưng “theo” bảo tồn đồng thời nghĩa chuyển động cụ thể và chiều kích thần học, không áp đặt lời diễn giải vượt quá câu Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu văn giữ nhịp kể chuyện tự nhiên; dùng “Ngài” để chỉ Chúa Giê-xu, còn “có người” bảo tồn tính bất định và không thêm giới tính không được nêu trong nguyên văn.
