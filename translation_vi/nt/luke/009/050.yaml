id: LUK.9.50
reference: Luke 9:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: vi
  text: 'Nhưng Giê-su nói với ông ấy: “Đừng ngăn cản người ấy[a], vì ai không chống lại anh em thì đứng về phía anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đừng cản trở người ấy” hoặc “Đừng cấm người ấy.”'
    reason: κωλύετε có thể được dịch là ngăn cản, cản trở, hoặc cấm.
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Nhưng ... nói
  rationale: δέ nối lời đáp với sự phản đối vừa nêu ở câu trước và có sắc thái tương phản nhẹ; “Nhưng” tự nhiên trong tiếng Việt mà không làm tương phản quá mạnh.
- source_word: πρὸς αὐτόν
  choice: với ông
  rationale: Đại từ chỉ người vừa lên tiếng ở câu trước. “Với ông” giữ cách diễn đạt bằng đại từ của bản Hy Lạp, không thay bằng tên riêng.
- source_word: ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt Cơ Đốc, dùng dạng phiên âm tên riêng thay vì dịch nghĩa.
- source_word: Μὴ κωλύετε
  choice: Đừng ngăn cản người ấy
  rationale: κωλύω có thể mang nghĩa ngăn cản, cản trở hoặc cấm. “Đừng ngăn cản” diễn đạt rõ hành động các môn đồ đang cố ngăn người kia thực hiện; “người ấy” làm rõ đối tượng vốn được hiểu từ ngữ cảnh. Mệnh lệnh số nhiều được thể hiện tự nhiên qua ngữ cảnh và đại từ “anh em” ở vế sau.
- source_word: ὃς γὰρ
  choice: vì ai
  rationale: ὃς ở đây vừa liên hệ đến trường hợp cụ thể vừa nêu một nguyên tắc khái quát. “Ai” giữ được sức khái quát ấy; “vì” chuyển tải γάρ tự nhiên.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: không chống lại anh em
  rationale: κατά với sở hữu cách diễn tả sự đối nghịch. “Chống lại” là cách nói rõ, tự nhiên; “anh em” thể hiện đại từ ngôi hai số nhiều ὑμῶν.
- source_word: ὑπὲρ ὑμῶν
  choice: ủng hộ anh em
  rationale: ὑπέρ ở đây chỉ sự đứng về phía hoặc có lợi cho ai. “Ủng hộ” rõ nghĩa trong tiếng Việt và giữ thế đối lập với “chống lại”.
theological_decisions:
- issue: Phạm vi lời phán của Đức Chúa Jêsus
  choice: 'Dịch như một nguyên tắc khái quát: “ai không chống lại anh em...”'
  alternative: 'Dịch hẹp hơn: “người không chống lại anh em...” để nhấn mạnh người trừ quỷ đang được nói đến'
  rationale: Đại từ quan hệ có thể quy chiếu đến trường hợp ngay trước mắt đồng thời mang sức khái quát. “Ai” bảo tồn cả chiều rộng ấy mà không áp đặt một kết luận giáo lý vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để biểu thị rõ ngôi hai số nhiều; giữ cấu trúc đối xứng “chống lại ... ủng hộ”. Không thêm chú thích vì các khả năng nghĩa của κωλύω đều được bao quát đầy đủ bằng “ngăn cản”, và không có dấu chú thích cần thiết trong chính văn.
