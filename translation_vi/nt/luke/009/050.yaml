revisions:
- from: 'Nhưng Đức Chúa Jêsus nói với ông: “Đừng ngăn cản người ấy, vì ai không chống lại anh em là ủng hộ anh em.”'
  to: 'Nhưng Giê-su nói với ông ấy: “Đừng ngăn cản người ấy[a], vì ai không chống lại anh em thì đứng về phía anh em.”'
  rationale: Bản sửa loại bỏ tước hiệu không có trong tiếng Hy Lạp, dùng cách phiên tên hiện hành “Giê-su”, và làm rõ đối ứng ngữ nghĩa giữa “chống lại” và “đứng về phía”. Chú thích bảo tồn các khả năng từ vựng chính đáng của κωλύετε mà không thay đổi ý nghĩa bản văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa danh xưng “Đức Chúa Jêsus”: nguyên văn chỉ có ὁ Ἰησοῦς (“Giê-su”), không có κύριος (“Chúa”) hay tước hiệu tương đương. “Đứng về phía anh em” diễn đạt sát hơn thế đối ứng καθ’ ὑμῶν / ὑπὲρ ὑμῶν (“chống lại / về phía”).'
  naturalness: Bản sửa giữ văn phong hiện đại, trang trọng và tự nhiên. “Ông ấy” duy trì đại từ của nguyên văn mà vẫn rõ quy chiếu trong ngữ cảnh; “anh em” biểu đạt ngôi thứ hai số nhiều phù hợp.
  terminology: Dùng “Giê-su” là dạng tên riêng hiện hành trong tiếng Việt và không thêm tước hiệu không có trong câu nguồn. “Ngăn cản” là lựa chọn tự nhiên cho κωλύετε; chú thích ghi nhận các phương án gần nghĩa.
  issues:
  - severity: high
    issue: Thêm tước hiệu trong “Đức Chúa Jêsus”.
    rationale: SBLGNT viết ὁ Ἰησοῦς, chỉ nêu tên Giê-su. “Đức Chúa” tương ứng với một tước hiệu không hiện diện trong nguyên văn, nên làm thay đổi mức độ minh thị của câu.
  - severity: low
    issue: “Ủng hộ anh em” ít giữ được hình ảnh liên minh/đứng về một phía của ὑπὲρ ὑμῶν.
    rationale: “Đứng về phía anh em” tự nhiên trong tiếng Việt và phản ánh trực tiếp hơn cặp đối lập “chống lại anh em / về phía anh em” của nguyên văn.
  revised_text: 'Nhưng Giê-su nói với ông ấy: “Đừng ngăn cản người ấy[a], vì ai không chống lại anh em thì đứng về phía anh em.”'
