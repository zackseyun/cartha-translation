  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: vi
  text: 'Có tiếng từ đám mây phán rằng: “Đây là Con Ta, Đấng được chọn; hãy nghe lời Người.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: có một tiếng phán ra
  rationale: Diễn đạt tự nhiên sự xuất hiện của tiếng nói; “phán” phù hợp với lời từ trời trong văn cảnh mà không làm thay đổi nội dung phát ngôn.
- source_word: ἐκ τῆς νεφέλης
  choice: từ đám mây
  rationale: Giữ rõ ý nguồn gốc của tiếng phán theo giới từ ἐκ.
- source_word: Οὗτός ἐστιν ὁ υἱός μου
  choice: Đây là Con Ta
  rationale: Cách nói nhận diện tự nhiên, trang trọng; “Con” viết hoa vì trong văn cảnh đây là danh xưng chỉ về Chúa Giê-su.
- source_word: ὁ ἐκλελεγμένος
  choice: Đấng được chọn
  rationale: Phản ánh phân từ hoàn thành bị động của ἐκλέγομαι và không thêm đại từ sở hữu thứ hai vốn không có trong cụm từ Hy Lạp.
- source_word: αὐτοῦ ἀκούετε
  choice: hãy nghe lời Người
  rationale: Trong mệnh lệnh này, ἀκούω mang ý nghe và vâng theo. “Hãy nghe lời Người” tự nhiên trong tiếng Việt và giữ lực của lời truyền.
theological_decisions:
- issue: Danh xưng Kitô học trong tiếng phán từ đám mây
  choice: Đấng được chọn
  alternative: Con yêu dấu
  rationale: Bản văn SBLGNT dùng ἐκλελεγμένος, nên bản dịch giữ nét riêng của Lu-ca thay vì hòa đồng với cách đọc quen thuộc ở các sách Tin Mừng Nhất Lãm khác. Dị bản ἀγαπητός được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta/Người” trong lời phán từ trời để giữ sắc thái tôn nghiêm; không diễn giải quá mức mối quan hệ giữa “Con Ta” và “Đấng được chọn”.
