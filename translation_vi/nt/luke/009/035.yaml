revisions:
- from: 'Bấy giờ, có một tiếng phán ra từ đám mây[a]: “Đây là Con Ta, Đấng được chọn; hãy nghe lời Người.”'
  to: 'Có tiếng từ đám mây phán rằng: “Đây là Con Ta, Đấng được chọn; hãy nghe lời Người.”'
  rationale: Bỏ yếu tố thời gian không có trong bản nguồn và chỉnh lại cách đặt cụm “từ đám mây” để câu tiếng Việt tự nhiên hơn, không thay đổi nội dung hay sắc thái Kitô học của bản văn. Giữ “Đấng được chọn” theo ἐκλελεγμένος và giữ chú thích về dị bản ἀγαπητός.
