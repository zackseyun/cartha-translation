id: LUK.9.30
reference: Luke 9:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: vi
  text: Kìa, có hai người đang trò chuyện với Ngài; họ là Môi-se và Ê-li.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và tạo nét sống động trong lời kể của Lu-ca; “Kìa” trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἄνδρες δύο
  choice: hai người
  rationale: Trong ngữ cảnh, cụm từ chỉ hai người nam cụ thể là Môi-se và Ê-li. Tiếng Việt tự nhiên thường dùng “hai người”; giới tính đã rõ qua việc nêu danh tính.
- source_word: συνελάλουν
  choice: đang trò chuyện
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; “đang trò chuyện” cũng thể hiện tính tương tác của động từ.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Dữ cách đi với συλλαλέω chỉ người cùng tham gia cuộc trò chuyện. “Với” diễn đạt đúng tính tương hỗ; “Ngài” quy chiếu về Đức Chúa Jêsus theo văn phong Kinh Thánh trang trọng.
- source_word: οἵτινες
  choice: họ là
  rationale: Diễn đạt tự nhiên trong tiếng Việt việc xác định danh tính của hai người, không thêm sắc thái nhấn mạnh vốn không nổi bật trong ngữ cảnh.
- source_word: Μωϋσῆς
  choice: Môi-se
  rationale: Dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dạng tên quen thuộc của vị tiên tri trong Kinh Thánh tiếng Việt, tương ứng với Ἠλίας.
theological_decisions:
- issue: Danh tính của hai nhân vật trong sự kiện hóa hình
  choice: Bản văn trực tiếp xác định hai người là Môi-se và Ê-li.
  alternative: Thêm lời giải thích về ý nghĩa biểu tượng hoặc cánh chung của hai nhân vật.
  rationale: Nguyên văn chỉ nêu danh tính, không giải thích ý nghĩa thần học của sự hiện diện ấy; bản dịch không thêm cách diễn giải giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” bảo tồn dấu hiệu diễn ngôn ἰδοὺ; “đang trò chuyện” giữ sắc thái tiếp diễn của động từ ở thì chưa hoàn thành. Không cần chú thích.
