  source_fidelity: Bản dịch giữ đúng số lượng ước chừng và nghĩa chuyên biệt của ἄνδρες là nam giới trưởng thành. Tuy nhiên, “Hãy cho họ ngồi” làm giảm sắc thái riêng của Κατακλίνατε, động từ chỉ việc sắp/xếp cho ngả mình dùng bữa. Đại từ sở hữu trong πρὸς τοὺς μαθητὰς αὐτοῦ cũng nên được thể hiện rõ.
  naturalness: “Hãy bảo họ ngả mình theo từng nhóm” vừa tự nhiên trong văn cảnh bữa ăn vừa giữ được sắc thái của nguyên ngữ. “Các môn đồ của Ngài” là cách diễn đạt trang trọng, rõ ràng và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
  terminology: “Đức Giê-su,” “môn đồ,” “người đàn ông,” và “khoảng năm ngàn” đều phù hợp. Chú thích được đảo thành phương án “ngồi” để chú thích thực sự nêu lựa chọn dịch dễ hiểu hơn, thay vì làm yếu bản văn chính.
