base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: vi
  text: 'Vì có khoảng năm ngàn người đàn ông[a]. Đức Giê-su bảo các môn đồ của Ngài: “Hãy bảo họ ngả mình theo từng nhóm, mỗi nhóm khoảng năm mươi người.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây có nghĩa là “những người đàn ông”, chỉ nam giới trưởng thành chứ không phải toàn thể đám đông; con số này không tính phụ nữ và trẻ em.
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Hãy bảo họ ngồi thành từng nhóm, mỗi nhóm khoảng năm mươi người.” Động từ Hy Lạp gợi đến tư thế ngả mình hoặc nằm tựa khi dùng bữa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: khoảng
  rationale: Diễn tả con số ước lượng trong cả hai lần xuất hiện, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἄνδρες
  choice: người đàn ông
  rationale: Giữ đúng nghĩa chỉ nam giới trưởng thành, không chuyển thành từ khái quát như “người”.
- source_word: πεντακισχίλιοι
  choice: năm ngàn
  rationale: Cách diễn đạt số đếm rõ ràng và thông dụng.
- source_word: Κατακλίνατε
  choice: Hãy cho họ ngồi
  rationale: Trong bối cảnh dùng bữa, động từ nói đến việc cho người ta nằm tựa/ngả mình vào chỗ; “cho họ ngồi” là cách nói tự nhiên trong tiếng Việt, còn sắc thái dùng bữa được ghi ở chú thích.
- source_word: κλισίας
  choice: thành từng nhóm
  rationale: Truyền đạt rõ việc sắp xếp đám đông thành các nhóm riêng.
- source_word: ἀνὰ πεντήκοντα
  choice: mỗi nhóm khoảng năm mươi người
  rationale: Làm rõ ý phân phối của ἀνά kết hợp với số đếm, đồng thời giữ tính xấp xỉ của ὡσεὶ.
- source_word: γὰρ ... δὲ
  choice: Vì ... [không dịch riêng δὲ]
  rationale: “Vì” giữ chức năng giải thích của γάρ; δέ chỉ chuyển tiếp nhẹ trong lời kể nên không cần một liên từ riêng trong tiếng Việt.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: bảo các môn đồ
  rationale: Động từ “bảo” kết hợp tự nhiên với lời truyền khiến; đại từ sở hữu được hiểu rõ từ chủ thể Đức Giê-su trong ngữ cảnh, tránh cách nói nặng nề “các môn đồ của mình”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “môn đồ” giữ sắc thái thuật ngữ Kinh Thánh. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt mà vẫn bảo toàn quan hệ giải thích và mệnh lệnh của nguyên văn.
