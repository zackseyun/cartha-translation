- from: 'Vì có khoảng năm ngàn người đàn ông[a]. Đức Giê-su bảo các môn đồ: “Hãy cho họ ngồi thành từng nhóm, mỗi nhóm khoảng năm mươi người.”[b]'
  to: 'Vì có khoảng năm ngàn người đàn ông[a]. Đức Giê-su bảo các môn đồ của Ngài: “Hãy bảo họ ngả mình theo từng nhóm, mỗi nhóm khoảng năm mươi người.”[b]'
  rationale: Sửa bản văn chính để phản ánh sắc thái dùng bữa của Κατακλίνατε và thể hiện rõ αὐτοῦ. Vẫn giữ tính ước lượng của cả hai lần ὡσεὶ, tính phân nhóm của κλισίας, và ý phân phối “mỗi nhóm ... năm mươi” của ἀνὰ πεντήκοντα. Chú thích b được điều chỉnh để cung cấp “ngồi” như một lựa chọn dịch tự nhiên hơn, không thay đổi nghĩa đoạn văn.
