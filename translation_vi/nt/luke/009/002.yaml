  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: vi
  text: Ngài sai họ đi công bố vương quốc Đức Chúa Trời[a] và chữa lành những người đau yếu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự trị vì của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai họ đi
  rationale: Động từ ἀποστέλλω mang nghĩa sai phái; “sai họ đi” tự nhiên trong tiếng Việt và thể hiện sắc thái được giao sứ mạng trong ngữ cảnh.
- source_word: κηρύσσειν
  choice: rao truyền
  rationale: κηρύσσω chỉ việc công bố công khai. “Rao truyền” giữ được sắc thái của lời tuyên cáo mà không giới hạn vào hoạt động giảng dạy trong nhà thờ.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch này giữ được bề rộng ý nghĩa của βασιλεία, có thể nói đến cả quyền trị vì lẫn lãnh vực cai trị, đồng thời phù hợp với lối diễn đạt Kinh Thánh trang trọng và dễ hiểu.
- source_word: ἰᾶσθαι
  choice: chữa lành
  rationale: ἰάομαι trong ngữ cảnh này chỉ việc phục hồi sức khỏe; “chữa lành” là cách diễn đạt tự nhiên và quen thuộc.
- source_word: τοὺς ἀσθενεῖς
  choice: những người đau yếu
  rationale: Dù ἀσθενής cũng có thể mang nghĩa rộng là yếu đuối, sự kết hợp với ἰᾶσθαι cho thấy ở đây chỉ những người mắc bệnh; “những người đau yếu” diễn đạt rõ mà vẫn giữ sắc thái nhân vị.
theological_decisions:
- issue: Ý nghĩa của βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: sự trị vì của Đức Chúa Trời
  rationale: Cụm từ Hy Lạp có thể nhấn mạnh quyền trị vì hoặc vương quốc thuộc quyền cai trị. Bản dịch chính giữ cách nói rộng hơn, còn chú thích nêu cách hiểu nhấn mạnh hoạt động trị vì để không âm thầm thu hẹp sự đa nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để nối tự nhiên với chủ thể trong văn cảnh; dùng “Đức Chúa Trời” nhất quán cho θεός. Cấu trúc hai mục đích “rao truyền… và chữa lành…” bám sát nguyên văn.
