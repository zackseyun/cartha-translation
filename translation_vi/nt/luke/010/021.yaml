id: LUK.10.21
reference: Luke 10:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: vi
  text: 'Ngay lúc ấy, Đức Chúa Jêsus vui mừng trong Đức Thánh Linh và nói: “Lạy Cha, Chúa Tể trời đất, con ca ngợi Cha[a], vì Cha đã giấu những điều này khỏi những người khôn ngoan và thông sáng, nhưng lại bày tỏ cho trẻ thơ[b]. Vâng, lạy Cha, vì Cha đã vui lòng như vậy[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con cảm tạ Cha.” Động từ Hy Lạp có thể diễn tả cả sự cảm tạ lẫn ca ngợi trong lời cầu nguyện.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn cũng có thể dịch là “trẻ sơ sinh.” Ở đây, hình ảnh này có lẽ chỉ những người bé mọn, khiêm nhường hoặc không được xã hội coi trọng, chứ không chỉ nói về trẻ nhỏ theo nghĩa đen.
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “vì đó là ý muốn tốt lành của Cha” hoặc “vì điều này đẹp lòng Cha.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Ngay giờ ấy
  rationale: Giữ sắc thái thời gian được nhấn mạnh của cụm Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἠγαλλιάσατο
  choice: vui mừng
  rationale: Diễn đạt niềm vui mạnh mẽ mà không dùng một từ quá văn chương hoặc cường điệu.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: Cấu trúc có mạo từ chỉ rõ Đức Thánh Linh; giới từ “trong” giữ được sắc thái phạm vi hoặc tác động của cách dữ cách mà không quyết định quá mức.
- source_word: Ἐξομολογοῦμαί σοι
  choice: con ca ngợi Cha
  rationale: Trong lời cầu nguyện này, động từ mang nghĩa ca ngợi hoặc cảm tạ. Đại từ “con—Cha” là cách xưng hô tự nhiên trong tiếng Việt, còn chú thích bảo lưu nghĩa “cảm tạ”.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Lạy Cha, Chúa của trời và đất
  rationale: Giữ hai hô cách đặt cạnh nhau và dịch κύριος là “Chúa”; thêm “lạy” để lời thưa trực tiếp tự nhiên, trang trọng.
- source_word: ἀπέκρυψας ... ἀπεκάλυψας
  choice: đã giấu ... lại bày tỏ
  rationale: Giữ sự tương phản trực tiếp giữa hành động che giấu và mặc khải; “bày tỏ” là cách nói rõ ràng, tự nhiên.
- source_word: σοφῶν καὶ συνετῶν
  choice: những người khôn ngoan và thông sáng
  rationale: Phản ánh hai tính từ Hy Lạp mà không thu hẹp thành địa vị học vấn.
- source_word: νηπίοις
  choice: những trẻ thơ
  rationale: Giữ hình ảnh nguyên văn, có thể mang nghĩa ẩn dụ về những người bé mọn hoặc lệ thuộc; chú thích nêu nghĩa đen gần hơn.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: vì điều ấy đẹp lòng Cha
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt ý điều đó được Cha ưng thuận; chú thích bảo lưu khả năng hiểu theo ý muốn tốt lành của Cha.
theological_decisions:
- issue: Chủ thể được nhắc đến trong τῷ πνεύματι τῷ ἁγίῳ
  choice: Đức Thánh Linh
  alternative: tâm linh của Ngài / trong tâm thần
  rationale: Cấu trúc Hy Lạp với mạo từ trước danh từ và tính từ ủng hộ cách hiểu là Đức Thánh Linh, thay vì chỉ trạng thái nội tâm của Đức Chúa Jêsus.
- issue: Ý nghĩa của việc Cha giấu và bày tỏ
  choice: Giữ nguyên Cha là chủ thể của cả hai động từ
  alternative: Diễn giải sự che giấu chỉ như hậu quả từ phản ứng của con người
  rationale: Nguyên văn đặt cả ἀπέκρυψας và ἀπεκάλυψας ở ngôi thứ hai số ít với Cha là chủ thể; bản dịch không làm nhẹ hoặc giải quyết căng thẳng thần học này.
- issue: Sắc thái của εὐδοκία
  choice: đẹp lòng Cha
  alternative: ý muốn nhân từ của Cha / ý tốt lành của Cha
  rationale: “Đẹp lòng Cha” giữ ý ưng thuận và niềm vui thích của Đức Chúa Trời mà không xác định quá mức quan hệ giữa sự hài lòng và ý chí thần thượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng lối xưng hô “con—Cha” phù hợp với lời cầu nguyện của người Con trong tiếng Việt. Danh xưng “Đức Chúa Jêsus” làm rõ chủ ngữ ẩn trong tiếng Hy Lạp dựa trên ngữ cảnh, tránh đại từ mở câu thiếu tự nhiên; “Đức Thánh Linh” và “Chúa” giữ văn phong Kinh Thánh quen thuộc mà không thêm diễn giải hệ phái.
