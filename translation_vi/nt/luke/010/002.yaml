source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Mùa gặt thì nhiều, nhưng người làm việc thì ít. Vậy hãy cầu xin Chúa của mùa gặt sai những người làm việc[a] vào mùa gặt của Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sai ra mạnh mẽ” hoặc “đẩy ra”; động từ Hy Lạp có thể mang sắc thái mạnh hơn “sai” thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ngài nói
  rationale: Thể chưa hoàn thành có thể diễn đạt là “Ngài đang nói”, nhưng trong lời dẫn truyện, quá khứ đơn “Ngài nói” tự nhiên hơn mà không làm mất ý nghĩa đáng kể.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Đây là liên từ nhẹ dùng để tiếp nối lời kể; tiếng Việt không cần một từ nối riêng trong câu này.
- source_word: θερισμός
  choice: mùa gặt
  rationale: Giữ nguyên hình ảnh nông nghiệp và cũng phù hợp với nghĩa ẩn dụ trong ngữ cảnh.
- source_word: πολύς
  choice: thật dồi dào
  rationale: Diễn đạt tự nhiên ý mùa gặt nhiều, phong phú, thay vì dùng “lớn” theo lối quá sát chữ.
- source_word: ἐργάται
  choice: thợ gặt
  rationale: “Thợ gặt” là cách nói tự nhiên về những người lao động trong mùa gặt; ngữ cảnh xác định loại công việc dù danh từ Hy Lạp tự nó chỉ có nghĩa là “người làm việc”.
- source_word: ὀλίγοι
  choice: lại ít
  rationale: Giữ sự tương phản rõ ràng với mùa gặt dồi dào; “lại” thể hiện tự nhiên cấu trúc đối chiếu μὲν...δὲ.
- source_word: δεήθητε
  choice: hãy cầu xin
  rationale: Mệnh lệnh này chỉ lời khẩn cầu tha thiết; “cầu xin” vừa giữ bối cảnh cầu nguyện vừa mạnh hơn “xin” đơn thuần.
- source_word: οὖν
  choice: Vậy
  rationale: Thể hiện kết luận được rút ra từ tình trạng mùa gặt nhiều mà thợ gặt ít.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ sắc thái thẩm quyền và âm hưởng thần học của danh xưng, đồng thời phù hợp với cách diễn đạt quen thuộc “Chúa của mùa gặt”.
- source_word: ὅπως
  choice: cầu xin... sai
  rationale: Trong tiếng Việt, nội dung lời cầu xin được nối trực tiếp bằng động từ “sai”, không cần thêm một liên từ tương đương “rằng”.
- source_word: ἐκβάλῃ
  choice: sai... đi
  rationale: Truyền đạt hành động phái người ra làm việc một cách tự nhiên. Động từ Hy Lạp có thể mạnh hơn “sai đi”, nên sắc thái ấy được ghi ở chú thích.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: vào mùa gặt của Ngài
  rationale: Bám sát giới từ chỉ hướng và giữ cả hình ảnh mùa gặt lẫn ý sở hữu, không tự ý thêm “cánh đồng” vốn không có trong nguyên văn.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa của mùa gặt” và ý nghĩa của danh xưng này
  choice: Giữ nguyên danh xưng “Chúa của mùa gặt” mà không giải thích đối tượng ngay trong câu.
  alternative: Diễn giải rõ là Đức Chúa Trời, Đấng sở hữu và điều hành sứ mạng; hoặc hiểu lời này hàm ý thẩm quyền thần thượng của Chúa Giê-xu.
  rationale: Bản văn trình bày một Đấng có thẩm quyền trên mùa gặt và sai phái thợ, nhưng tại đây không giải thích tường tận căn tính hay hàm ý Cơ Đốc học. Giữ nguyên danh xưng bảo toàn sự hàm súc và căng thẳng thần học của câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ phép ẩn dụ “mùa gặt”, sự lặp lại có chủ ý của hình ảnh này, cùng lời cầu xin mang tính mệnh lệnh. Đại từ “Ngài” phù hợp với văn phong tôn kính khi nói về Chúa Giê-xu; không thêm lời giải nghĩa giáo phái.
