revisions:
- from: 'Ngài nói với họ: “Mùa gặt thật dồi dào, nhưng thợ gặt lại ít. Vậy, hãy cầu xin Chúa của mùa gặt sai thợ gặt đi[a] vào mùa gặt của Ngài.”'
  to: 'Ngài nói với họ: “Mùa gặt thì nhiều, nhưng người làm việc thì ít. Vậy hãy cầu xin Chúa của mùa gặt sai những người làm việc[a] vào mùa gặt của Ngài.”'
  rationale: Đổi “thợ gặt” thành “người làm việc” để không thu hẹp danh từ ἐργάται, trong khi ngữ cảnh “mùa gặt” vẫn duy trì rõ hình ảnh những người được sai vào công việc thu hoạch. Chỉnh chú thích để nêu đúng hơn lực từ vựng của ἐκβάλλω mà không áp đặt một sắc thái mạnh vào thân câu.
