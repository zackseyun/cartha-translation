source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Có một người từ Giê-ru-sa-lem đi xuống Giê-ri-cô và rơi vào tay bọn cướp. Chúng lột quần áo người ấy, đánh người ấy bị thương rồi bỏ đi, để người ấy lại trong tình trạng nửa sống nửa chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: đáp
  rationale: Trong ngữ cảnh đối thoại, cụm này giới thiệu lời Đức Giê-su trả lời; “đáp” tự nhiên và sát chức năng diễn ngôn.
- source_word: Ἄνθρωπός τις
  choice: Có một người
  rationale: Giữ tính không xác định của nhân vật và mở đầu câu chuyện tự nhiên trong tiếng Việt.
- source_word: κατέβαινεν
  choice: đi xuống
  rationale: Giữ nét địa hình và cách diễn đạt của nguyên văn về hành trình từ Giê-ru-sa-lem xuống Giê-ri-cô.
- source_word: λῃσταῖς περιέπεσεν
  choice: rơi vào tay bọn cướp
  rationale: Thành ngữ tiếng Việt tự nhiên, truyền đạt việc bất ngờ gặp và trở thành nạn nhân của bọn cướp.
- source_word: ἐκδύσαντες αὐτὸν
  choice: lột sạch đồ của người ấy
  rationale: Diễn đạt rõ việc bọn cướp tước quần áo và tài sản mang trên người; “lột sạch” giữ mức độ mạnh của hành động.
- source_word: πληγὰς ἐπιθέντες
  choice: đánh đập
  rationale: Cách nói tự nhiên cho hành động gây thương tích bằng những cú đánh.
- source_word: ἡμιθανῆ
  choice: trong tình trạng dở sống dở chết
  rationale: Thành ngữ phổ thông diễn đạt sát tình trạng “nửa chết”, không khẳng định người ấy đã chết.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; tên địa danh được phiên âm nhất quán. Câu kể giữ nhịp rõ ràng và mức độ bạo lực của nguyên văn.
