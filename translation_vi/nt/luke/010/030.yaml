- from: 'Đức Giê-su đáp: “Có một người từ Giê-ru-sa-lem đi xuống Giê-ri-cô và rơi vào tay bọn cướp. Chúng lột sạch đồ của người ấy, đánh đập rồi bỏ đi, để người ấy lại trong tình trạng dở sống dở chết.”'
  to: 'Đức Giê-su đáp: “Có một người từ Giê-ru-sa-lem đi xuống Giê-ri-cô và rơi vào tay bọn cướp. Chúng lột quần áo người ấy, đánh người ấy bị thương rồi bỏ đi, để người ấy lại trong tình trạng nửa sống nửa chết.”'
  rationale: 'Sửa riêng hai chỗ để bám sát nghĩa từ vựng của nguyên văn: thay cách nói có thể hàm ý tước đoạt tài sản bằng việc lột quần áo, và nêu rõ những cú đánh đã gây thương tích. Đồng thời dùng “nửa sống nửa chết” để phản ánh trực tiếp ἡμιθανῆ mà vẫn tự nhiên trong tiếng Việt.'
  reviewer_model: gpt-5.6-terra
