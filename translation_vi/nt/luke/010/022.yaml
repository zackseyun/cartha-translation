    rationale: Nguyên văn có đại từ quan hệ ở cách gián tiếp (ᾧ), chỉ người mà Cha được bày tỏ cho. “Bất cứ ai mà Con muốn bày tỏ Cha cho” bảo toàn quan hệ này và tự nhiên hơn.
  - severity: medium
    issue: Chú thích b dùng “Con chọn để bày tỏ Cha cho.”
    rationale: Cấu trúc “chọn để” có thể gợi ý rằng Con chọn một người nhằm bày tỏ, thay vì diễn đạt trực tiếp ý chí/chọn lựa của Con trong việc bày tỏ Cha cho người ấy. Cần dùng một cấu trúc quan hệ rõ ràng hơn.
