id: LUK.10.22
reference: Luke 10:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: vi
  text: Mọi sự đã được Cha tôi giao cho tôi[a], và không ai biết Con là ai, ngoại trừ Cha; cũng không ai biết Cha là ai, ngoại trừ Con và bất cứ ai mà Con muốn bày tỏ Cha cho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tất cả mọi điều đã được Cha tôi giao cho tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và bất cứ ai mà Con chọn bày tỏ Cha cho.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: Mọi sự
  rationale: Dạng trung tính số nhiều có phạm vi bao quát. “Mọi sự” giữ được sắc thái trang trọng và toàn diện; “tất cả mọi điều” dài hơn nhưng không bổ sung ý nghĩa.
- source_word: παρεδόθη
  choice: đã được ... giao cho
  rationale: Động từ aorist bị động của παραδίδωμι diễn tả việc trao giao. Cách dịch này giữ đúng thể bị động, không tự thêm sắc thái hẹp hơn như “ủy thác”.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: được Cha tôi giao
  rationale: ὑπό với sở hữu cách chỉ tác nhân trong cấu trúc bị động. Trật tự tiếng Việt tự nhiên thể hiện tác nhân bằng chủ thể sau “được”.
- source_word: γινώσκει
  choice: biết
  rationale: “Biết” dịch trực tiếp động từ này và không diễn giải quá mức thành “biết trọn vẹn” dù ngữ cảnh hàm chứa sự hiểu biết độc nhất.
- source_word: τίς ἐστιν ὁ υἱός / τίς ἐστιν ὁ πατήρ
  choice: Con là ai / Cha là ai
  rationale: Giữ cấu trúc nhận biết căn tính mang tính cá vị và quan hệ, đồng thời là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὁ υἱός / ὁ πατήρ
  choice: Con / Cha
  rationale: Đây là các danh xưng mang tính quan hệ trong ngữ cảnh Kitô học. Viết hoa giúp nhận diện đối tượng mà không thêm nội dung giải thích.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: người nào mà Con muốn bày tỏ Cha cho
  rationale: Cấu trúc diễn tả người nhận không xác định, tùy thuộc ý muốn của Con. Bổ sung “Cha” làm tân ngữ được hàm ý từ mệnh đề trước, tránh đại từ tiếng Việt có thể mơ hồ về đối tượng được bày tỏ.
- source_word: βούληται
  choice: muốn
  rationale: “Muốn” tự nhiên, hiện đại và vẫn giữ ý chí chủ động của Con; “chọn” nhấn mạnh hành vi lựa chọn hơn mức từ Hy Lạp nhất thiết đòi hỏi.
- source_word: ἀποκαλύψαι
  choice: bày tỏ
  rationale: “Bày tỏ” truyền đạt hành động làm cho được biết và có giọng văn trang trọng, dễ hiểu. “Mặc khải” mang tính thuật ngữ hơn và kém tự nhiên với tân ngữ chỉ ngôi trong câu này.
theological_decisions:
- issue: Sự hiểu biết độc nhất và hỗ tương giữa Cha và Con
  choice: Giữ nguyên lời khẳng định rằng không ai biết Con ngoài Cha và không ai biết Cha ngoài Con.
  alternative: Thêm các từ diễn giải như “biết trọn vẹn” hoặc “thật sự biết”.
  rationale: γινώσκει chỉ nói “biết”; sức nặng thần học đã nằm trong cấu trúc loại trừ và hỗ tương, nên không cần tăng cường bằng từ không có trong nguyên văn.
- issue: Ý muốn và vai trò bày tỏ của Con
  choice: Dịch βούληται là “muốn”, giữ Con làm chủ thể chủ động bày tỏ Cha.
  alternative: Dịch là “chọn”, “quyết định”, hoặc diễn giải theo hướng làm nhẹ quyền chủ động của Con.
  rationale: Nguyên văn đặt việc bày tỏ Cha tùy thuộc ý muốn của Con. “Muốn” bảo toàn mệnh đề ấy mà không hệ thống hóa thêm về phạm vi hay cơ chế của ý muốn này.
- issue: Tân ngữ được hàm ý của ἀποκαλύψαι
  choice: Nêu rõ “Cha” là Đấng được Con bày tỏ.
  alternative: Dùng đại từ “Ngài” hoặc để trống tân ngữ.
  rationale: Ngữ pháp lấy Cha trong mệnh đề ngay trước làm tân ngữ hàm ý. Nêu lại “Cha” trong tiếng Việt tránh sự mơ hồ về quy chiếu mà không thay đổi nội dung.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Cha” và “Con” viết hoa như các danh xưng quan hệ. Dấu chấm phẩy làm rõ hai vế song song về sự nhận biết hỗ tương; mọi ký hiệu chú thích [a], [b] đều xuất hiện trong chính văn.
