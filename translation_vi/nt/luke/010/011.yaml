source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: vi
  text: 'Ngay cả bụi từ thành các người đã bám vào chân chúng tôi, chúng tôi cũng phủi sạch nghịch lại các người.[a] Tuy vậy, hãy biết điều này: vương quốc Đức Chúa Trời đã đến gần.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo một cách sắp xếp gần với cấu trúc Hy Lạp: “Ngay cả bụi từ thành các người đã bám vào chúng tôi, nơi chân chúng tôi, chúng tôi cũng phủi sạch nghịch lại các người.” Cụm từ Hy Lạp có cấu trúc hơi khác thường; động từ ở đây có nghĩa là “lau/phủi sạch” hơn là chỉ “giũ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã đến sát bên.” Thể hoàn thành trong tiếng Hy Lạp cho thấy vương quốc đã đến gần và sự kiện ấy vẫn có ý nghĩa hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: bụi
  rationale: Chỉ bụi cụ thể, đồng thời giữ được ý nghĩa biểu tượng của hành động trong bối cảnh sai phái.
- source_word: κολληθέντα
  choice: đã bám
  rationale: Diễn đạt tự nhiên việc bụi dính chặt vào chân các sứ giả.
- source_word: εἰς τοὺς πόδας
  choice: vào chân chúng tôi
  rationale: Cụm Hy Lạp hơi khác thường; trong thành ngữ này, nó mô tả bụi bám vào chân. Cách dịch này giữ được hướng nghĩa của εἰς mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀπομασσόμεθα
  choice: chúng tôi cũng phủi sạch
  rationale: Động từ có nghĩa cụ thể là lau hoặc phủi cho sạch, không đơn thuần là giũ. “Phủi sạch” tự nhiên khi nói về bụi trên chân.
- source_word: ὑμῖν
  choice: để làm chứng nghịch lại các người
  rationale: Trong văn cảnh, tặng cách mang sắc thái đối nghịch và chứng cáo. Cách diễn đạt này làm rõ chức năng biểu tượng của hành động mà không coi đó chỉ là hành vi vệ sinh.
- source_word: πλήν
  choice: Tuy vậy
  rationale: 'Đánh dấu sự chuyển ý mạnh: dù thành bị cảnh cáo, chân lý về vương quốc vẫn phải được nhìn nhận.'
- source_word: γινώσκετε
  choice: hãy biết
  rationale: Giữ trực tiếp sắc thái mệnh lệnh của động từ hiện tại.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thể hoàn thành diễn tả sự đến gần đã xảy ra và vẫn còn hiệu lực, không đồng nhất với sự hoàn tất trọn vẹn.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch quen thuộc, rõ ràng, giữ cả chiều kích vương quyền mà không thu hẹp nghĩa chỉ còn một lãnh thổ.
theological_decisions:
- issue: Ý nghĩa của hành động phủi bụi
  choice: Một hành động tượng trưng làm chứng và cảnh cáo nghịch lại thành đã khước từ sứ điệp
  alternative: Một hành động thuần túy liên quan đến vệ sinh hoặc hành trình
  rationale: ὑμῖν trong diễn ngôn sai phái cho thấy hành động hướng đến người khước từ như một lời chứng nghịch lại họ. Bản dịch nêu chức năng này nhưng không thêm một phán quyết vượt quá câu văn.
- issue: Ý nghĩa việc vương quốc đến gần
  choice: Vương quốc Đức Chúa Trời đã đến gần và sự gần gũi ấy vẫn có hiệu lực, ngay cả khi sứ điệp bị khước từ
  alternative: Vương quốc chỉ sắp đến trong tương lai; hoặc vương quốc đã được hoàn tất trọn vẹn
  rationale: ἤγγικεν ở thể hoàn thành biểu thị sự gần gũi đã xảy đến với hiệu lực tiếp diễn, đồng thời vẫn giữ nguyên căng thẳng cánh chung của câu.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “các người” để giữ lời nói trực tiếp có sắc thái cảnh cáo; dùng “phủi sạch” vì tự nhiên hơn “lau sạch” đối với bụi bám trên chân. Các chú thích bảo tồn sự khác thường của εἰς τοὺς πόδας và sắc thái thể hoàn thành của ἤγγικεν.
