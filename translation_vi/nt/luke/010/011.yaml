  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: bụi từ thành, bám vào chân các sứ giả, hành động phủi sạch có hướng nghịch lại người nghe, và lời khẳng định ở thể hoàn thành rằng vương quốc Đức Chúa Trời đã đến gần. Tuy nhiên, cụm “để làm chứng” thêm rõ một mục đích pháp lý/tượng trưng vốn phù hợp văn mạch nhưng không được nói trực tiếp trong câu Hy Lạp; nên giữ lực đối nghịch của ὑμῖν mà không thêm diễn giải này vào thân bài.'
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và phù hợp lời cảnh cáo trực tiếp. “Phủi sạch nghịch lại các người” hơi mang sắc thái Kinh Thánh/trang trọng, nhưng phù hợp ngữ cảnh và diễn đạt được hướng đối nghịch của tặng cách.
  terminology: “Bụi,” “đã bám,” “phủi sạch,” “đã đến gần,” và “vương quốc Đức Chúa Trời” đều nhất quán với tiếng Hy Lạp và cách dùng tiếng Việt Cơ Đốc trang trọng. Không cần thay “vương quốc” bằng một cách diễn giải thần học khác.
  issues:
