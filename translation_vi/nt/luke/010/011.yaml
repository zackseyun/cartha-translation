- from: 'Ngay cả bụi từ thành của các người đã bám vào chân chúng tôi, chúng tôi cũng phủi sạch để làm chứng nghịch lại các người.[a] Tuy vậy, hãy biết điều này: vương quốc Đức Chúa Trời đã đến gần.[b]'
  to: 'Ngay cả bụi từ thành các người đã bám vào chân chúng tôi, chúng tôi cũng phủi sạch nghịch lại các người.[a] Tuy vậy, hãy biết điều này: vương quốc Đức Chúa Trời đã đến gần.[b]'
