    rationale: Nên mô tả đây là một cách sắp xếp khác để phản ánh cấu trúc Hy Lạp hơi khác thường, đồng thời giải thích nghĩa của động từ mà không tạo cảm giác bản dịch chính yếu kém chính xác.
