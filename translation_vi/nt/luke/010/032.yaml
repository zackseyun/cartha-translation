  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: vi
  text: Cũng vậy, một người Lê-vi, khi đến chỗ ấy và thấy người ấy, cũng đi qua ở phía bên kia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch ngắn hơn: “ông đi qua.” Động từ ghép trong nguyên văn cũng có thể gợi ý việc ông đi qua ở phía đối diện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Diễn tả sự tương ứng giữa hành động của người Lê-vi và hành động của thầy tế lễ ở câu trước, đồng thời tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: δὲ καὶ
  choice: một người Lê-vi
  rationale: δέ là từ nối nhẹ nên không cần dịch riêng; καί mang ý bổ sung một nhân vật tương tự, đã được truyền đạt tự nhiên qua “Cũng vậy” và việc giới thiệu người Lê-vi.
- source_word: Λευίτης
  choice: một người Lê-vi
  rationale: Giữ tên gọi lịch sử của nhóm người Do Thái này, thay vì diễn giải thành một chức vụ rộng hơn không có ngay trong nguyên văn.
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: đến chỗ ấy
  rationale: Diễn đạt gọn và tự nhiên việc người Lê-vi đi đến địa điểm nơi nạn nhân đang nằm, không xác định chi tiết hơn nguyên văn.
- source_word: ἰδὼν
  choice: Khi thấy người ấy
  rationale: Thể hiện hành động nhìn thấy xảy ra trước hành động chính; “người ấy” là bổ ngữ được hiểu theo ngữ cảnh nhưng không thêm cách mô tả mang tính giải thích.
- source_word: ἀντιπαρῆλθεν
  choice: ông tránh sang phía bên kia mà đi qua
  rationale: Động từ ghép không chỉ nói đến việc đi ngang qua mà còn gợi ý đi qua ở phía đối diện để tránh người bị nạn; cách dịch này giữ sắc thái chủ ý ấy.
theological_decisions:
- issue: Căn tính xã hội và tôn giáo của Λευίτης
  choice: Giữ cách gọi “người Lê-vi”
  alternative: người phục vụ đền thờ; thành viên chi phái Lê-vi
  rationale: Nguyên văn nêu một nhân vật thuộc nhóm lịch sử cụ thể, song song với thầy tế lễ ở câu trước. Giữ tên gọi này tránh thu hẹp thành một chức vụ hoặc thêm lời giải thích ngoài câu.
- issue: Mức độ chủ ý trong hành động ἀντιπαρῆλθεν
  choice: “tránh sang phía bên kia mà đi qua”
  alternative: “đi qua”
  rationale: Giữ sắc thái tránh né do hình thái động từ ghép gợi ra, nhưng không thêm động cơ tâm lý hay phán đoán đạo đức vượt quá lời kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu dài của tiếng Hy Lạp được chia thành hai câu tiếng Việt để trình tự hành động rõ ràng, trong khi vẫn giữ mối liên hệ với câu trước.
