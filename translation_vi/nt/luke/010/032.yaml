  to: Cũng vậy, một người Lê-vi, khi đến chỗ ấy và thấy người ấy, cũng đi qua ở phía bên kia.[a]
  rationale: Bản sửa giữ đầy đủ quan hệ so sánh và bổ sung của ὁμοίως ... καὶ, trình tự của hai phân từ “đến” và “thấy,” cùng nét nghĩa không gian của ἀντιπαρῆλθεν. Đồng thời, bản sửa loại bỏ lời khẳng định trực tiếp về hành vi “sang” và mục đích “để tránh,” những điều không được nói rõ trong câu.
