id: LUK.10.1
reference: Luke 10:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: vi
  text: Sau những việc ấy, Chúa chỉ định thêm bảy mươi hai người khác[a] và sai họ từng đôi một đi trước Ngài đến mọi thành và mọi nơi mà chính Ngài sắp đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “bảy mươi” thay vì “bảy mươi hai”.
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ sắc thái chuyển tiếp theo thời gian và số nhiều của đại từ chỉ định, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἀνέδειξεν
  choice: chỉ định
  rationale: Diễn đạt việc chọn và giao một nhiệm vụ cụ thể, không hiểu theo nghĩa đơn thuần là bày tỏ hay cho thấy.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Cách gọi trang trọng, quen thuộc dành cho κύριος; trong ngữ cảnh này chỉ về Chúa Giê-su.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: thêm bảy mươi hai người khác
  rationale: Thể hiện cả ý bổ sung của καί và ἑτέρους. Theo bản SBLGNT, câu chính dùng số bảy mươi hai; dị bản bảy mươi được ghi ở chú thích.
- source_word: ἀπέστειλεν
  choice: sai
  rationale: Từ ngữ tự nhiên trong văn phong Kinh Thánh tiếng Việt, diễn đạt rõ hành động phái họ đi mà không thêm hàm ý chức vụ.
- source_word: ἀνὰ δύο δύο
  choice: từng đôi một
  rationale: Diễn đạt tự nhiên ý phân phối theo từng nhóm hai người và giữ được nhịp lặp của tiếng Hy Lạp.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: đi trước Ngài
  rationale: Chuyển tải ý họ được sai đi trước để chuẩn bị cho việc Ngài đến, thay vì dịch cứng là 'trước mặt Ngài'.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: đến mọi thành và mọi nơi
  rationale: Giữ cả hai danh từ của nguyên văn và dùng 'thành' theo nghĩa khu dân cư, không nhất thiết chỉ thành phố lớn.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: mà chính Ngài sắp đến
  rationale: Giữ sự nhấn mạnh của αὐτός bằng 'chính Ngài' và sắc thái tương lai gần của μέλλω; 'đến' phù hợp với điểm nhìn tại các địa điểm được nhắc tới.
theological_decisions:
- issue: Dị bản về số người được chỉ định
  choice: bảy mươi hai
  alternative: bảy mươi
  rationale: Bản SBLGNT được cung cấp đọc ἑβδομήκοντα δύο, nghĩa là 'bảy mươi hai'. Dị bản 'bảy mươi' có ý nghĩa văn bản đáng kể nên được giữ trong chú thích, không bị bỏ qua hay dùng để giải quyết một liên hệ biểu tượng theo hướng giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'Ngài' để tránh lặp và giữ sự tôn kính dành cho Chúa Giê-su; cấu trúc câu bám sát nguyên văn nhưng được điều chỉnh để đọc tự nhiên.
