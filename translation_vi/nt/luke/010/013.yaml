reference: Luke 10:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: vi
  text: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã xảy ra giữa các ngươi mà đã xảy ra tại Ty-rơ và Si-đôn, thì từ lâu dân các thành ấy đã ăn năn[b], mặc áo vải thô và ngồi trong tro.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các phép lạ”; tiếng Hy Lạp chỉ những việc biểu lộ quyền năng.
    reason: lexical_alternative
  - marker: b
    text: “Ăn năn” cũng có thể được diễn đạt là “thay đổi tâm trí và hướng đi.”
    reason: lexical_clarification
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Khốn cho ngươi
  rationale: Giữ sắc thái vừa than tiếc vừa tuyên cáo phán xét của lời tiên tri; cách xưng hô số ít phù hợp vì mỗi thành được gọi trực tiếp như một đối tượng tập thể.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Cô-ra-xin / Bết-sai-đa / Ty-rơ / Si-đôn
  rationale: Phiên âm theo cách gọi quen thuộc trong tiếng Việt, giúp độc giả nhận biết các địa danh Kinh Thánh.
- source_word: δυνάμεις
  choice: những việc quyền năng
  rationale: Diễn đạt cả khía cạnh hành động lẫn quyền năng được bày tỏ, ít mang tính diễn giải hơn từ “phép lạ”.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: được thực hiện ... đã diễn ra
  rationale: Hai cách diễn đạt tự nhiên trong tiếng Việt phản ánh việc các hành động xảy ra, đồng thời tránh lặp từ nặng nề; thể bị động ở mệnh đề giả định không xác định thêm tác nhân.
- source_word: ἐν ὑμῖν
  choice: giữa các ngươi
  rationale: Chỉ phạm vi nơi những việc quyền năng xảy ra, tức giữa dân chúng của hai thành đang được gọi trực tiếp.
- source_word: πάλαι
  choice: từ lâu
  rationale: Truyền đạt rõ thời điểm sớm hơn nhiều trong mệnh đề điều kiện trái với thực tế.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: trong vải thô và tro
  rationale: Giữ nguyên hình ảnh cụ thể về tang chế, hạ mình và ăn năn trong thế giới Kinh Thánh.
- source_word: καθήμενοι
  choice: đã ngồi
  rationale: Bảo tồn tư thế cụ thể của phân từ Hy Lạp thay vì làm hình ảnh trở nên trừu tượng.
- source_word: μετενόησαν
  choice: mà ăn năn
  rationale: “Ăn năn” là cách diễn đạt tự nhiên, quen thuộc cho sự thay đổi tâm trí và hướng đi về mặt đạo đức, tâm linh trong văn cảnh Lu-ca.
theological_decisions:
- issue: Bản chất của δυνάμεις trong chức vụ của Chúa Giê-su
  choice: Dịch là “những việc quyền năng”
  alternative: “các phép lạ” hoặc “những việc đầy quyền năng”
  rationale: Nguyên ngữ nhấn mạnh những hành động biểu lộ quyền năng. “Những việc quyền năng” giữ được nội hàm ấy mà không thu hẹp từ này thành một thuật ngữ kỹ thuật.
- issue: Chủ thể ăn năn trong mệnh đề giả định
  choice: Nêu rõ là “dân các thành ấy”
  alternative: Dịch sát đại từ hàm ẩn là “họ”
  rationale: Động từ số nhiều hàm chỉ cư dân Ty-rơ và Si-đôn. Việc nêu rõ chủ thể giúp câu tiếng Việt tự nhiên mà không thay đổi đối tượng của lời nói.
- issue: Hình ảnh của sự ăn năn
  choice: Giữ hình ảnh “đã ngồi trong vải thô và tro mà ăn năn”
  alternative: Khái quát thành “đã tỏ lòng ăn năn sâu sắc”
  rationale: Nguyên văn chứa một phân từ chỉ tư thế cùng các vật biểu trưng cụ thể; bảo tồn hình ảnh duy trì sắc thái lịch sử và tiên tri.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngươi/các ngươi” để giữ lời gọi trực tiếp mạnh mẽ đối với các thành được nhân cách hóa; dùng “dân các thành ấy” để làm rõ chủ thể số nhiều hàm ẩn trong tiếng Hy Lạp.
