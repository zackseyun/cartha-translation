revisions:
- from: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã diễn ra giữa các ngươi được thực hiện tại Ty-rơ và Si-đôn, thì từ lâu dân các thành ấy đã ngồi trong vải thô và tro mà ăn năn[b].”
  to: “Khốn cho ngươi, hỡi Cô-ra-xin! Khốn cho ngươi, hỡi Bết-sai-đa! Vì nếu những việc quyền năng[a] đã xảy ra giữa các ngươi mà đã xảy ra tại Ty-rơ và Si-đôn, thì từ lâu dân các thành ấy đã ăn năn[b], mặc áo vải thô và ngồi trong tro.”
  rationale: 'Sửa «được thực hiện» thành «đã xảy ra» để tương ứng với sự lặp lại của γίνομαι trong nguyên văn và tránh thêm sắc thái về tác nhân. Sửa cụm than khóc để tiếng Việt tự nhiên, minh bạch hơn, song vẫn giữ áo vải thô, tro và tư thế ngồi. Đưa phân từ lên sau «đã ăn năn» là trật tự Việt ngữ thông dụng, không làm thay đổi nghĩa: họ ăn năn trong khi mặc áo vải thô và ngồi trong tro.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:02Z'
review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh nhẹ để phản ánh nhất quán hai lần γίνομαι là «xảy ra/diễn ra», thay vì dùng «được thực hiện» ở mệnh đề giả định, vốn dễ gợi một tác nhân được nêu rõ hơn nguyên văn. Hình ảnh σάκκῳ καὶ σποδῷ cũng nên nói rõ «áo vải thô» để tiếng Việt không hiểu «vải thô» như vật liệu đơn thuần.
  naturalness: Câu chỉnh sửa vẫn trang trọng, hiện đại và giữ được lối gọi trực tiếp mạnh mẽ. «Mặc áo vải thô và ngồi trong tro» tự nhiên, rõ nghĩa hơn «ngồi trong vải thô và tro», đồng thời bảo tồn hình ảnh than khóc của nguyên văn.
  terminology: «Khốn cho ngươi», «những việc quyền năng», «ăn năn», và các địa danh phiên âm đều phù hợp. «Áo vải thô» là cách gọi Việt ngữ rõ ràng cho σάκκος trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: «được thực hiện tại Ty-rơ và Si-đôn» không phản ánh nhất quán γίνομαι.
    rationale: Cả hai động từ ἐγενήθησαν và γενόμεναι đều là các hình thức của γίνομαι, nhấn mạnh việc xảy ra, không nêu tác nhân thực hiện. Dùng «đã xảy ra» ở cả hai vế giữ sát nguyên văn hơn.
  - severity: low
    issue: «ngồi trong vải thô và tro» thiếu rõ ràng trong tiếng Việt.
    rationale: σάκκος ở đây là trang phục than khóc. «Mặc áo vải thô và ngồi trong tro» diễn đạt rõ tập tục mà vẫn giữ hình ảnh cụ thể và tư thế của καθήμενοι.
