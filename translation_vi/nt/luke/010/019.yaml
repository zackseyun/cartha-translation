id: LUK.10.19
reference: Luke 10:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: vi
  text: Kìa, tôi đã ban cho anh em thẩm quyền giẫm lên rắn và bọ cạp[a], và thẩm quyền trên mọi quyền lực của kẻ thù; tuyệt nhiên không gì sẽ làm hại anh em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rắn và bọ cạp” cũng có thể gợi hình ảnh các thế lực thuộc linh thù nghịch trong ngữ cảnh này.
    reason: interpretive_ambiguity
  - marker: b
    text: 'Cũng có thể dịch: “chắc chắn không gì làm hại anh em.” Tiếng Hy Lạp dùng cấu trúc phủ định đặc biệt mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái nhấn mạnh, đồng thời vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: δέδωκα
  choice: tôi đã ban
  rationale: Thể hoàn thành diễn tả hành động đã được thực hiện và còn hiệu lực trong hiện tại; “đã ban” giữ được sắc thái ấy.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: Diễn tả quyền được trao, đồng thời phân biệt với δύναμις (“quyền lực”) ở phần sau của câu.
- source_word: τοῦ πατεῖν
  choice: giẫm lên
  rationale: Giữ hình ảnh cụ thể của động từ mà không tăng cường quá mức thành “giày đạp” hay “nghiền nát”.
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: lên rắn và bọ cạp
  rationale: Cách nói tự nhiên, trực tiếp, giữ nguyên hình ảnh trong nguyên văn.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: cùng chế ngự mọi quyền lực
  rationale: “Chế ngự” diễn đạt quan hệ vượt trên và có quyền đối với sức mạnh của kẻ thù trong tiếng Việt tự nhiên; “mọi quyền lực” phản ánh πᾶσαν τὴν δύναμιν.
- source_word: δύναμιν
  choice: quyền lực
  rationale: Giữ sự phân biệt từ vựng với ἐξουσία là “thẩm quyền”; ở đây nói đến sức mạnh hay năng lực của kẻ thù.
- source_word: τοῦ ἐχθροῦ
  choice: của kẻ thù
  rationale: Giữ cách gọi ở số ít và không xác định rõ hơn nguyên văn là Sa-tan hay ma quỷ.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: tuyệt nhiên không gì có thể làm hại anh em
  rationale: “Tuyệt nhiên không” chuyển tải phủ định nhấn mạnh οὐ μή; “làm hại” phù hợp ngữ cảnh và tự nhiên hơn cách dịch sát là “gây bất công”.
theological_decisions:
- issue: Danh tính của “kẻ thù”
  choice: Giữ cách gọi chung “kẻ thù”.
  alternative: Sa-tan; ma quỷ
  rationale: Ngữ cảnh gợi đến thế lực Sa-tan, nhưng nguyên văn chỉ nói “kẻ thù”; bản dịch không xác định điều văn bản để ngỏ.
- issue: Nghĩa đen hay biểu tượng của “rắn và bọ cạp”
  choice: Giữ hình ảnh cụ thể trong chính văn.
  alternative: Diễn giải là các thế lực thuộc linh thù nghịch
  rationale: Các danh từ có nghĩa từ vựng cụ thể, trong khi ngữ cảnh có thể gợi ý tầng nghĩa biểu tượng. Giữ hình ảnh giúp bảo toàn sự rộng mở trong cách hiểu.
- issue: Phạm vi của lời hứa không bị làm hại
  choice: Giữ lời khẳng định mạnh của câu mà không thêm điều kiện giải thích.
  alternative: Giới hạn rõ vào tổn hại thuộc linh hoặc vào sứ mạng cụ thể
  rationale: Nguyên văn dùng phủ định rất mạnh nhưng không nêu rõ loại tổn hại; không nên âm thầm thu hẹp hay tuyệt đối hóa theo một hệ thống thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν/ὑμᾶς; chọn “Kìa” để giữ lực dẫn nhập. “Thẩm quyền” và “quyền lực” được phân biệt có chủ ý nhằm phản ánh ἐξουσία và δύναμις.
