base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: vi
  text: Khi họ đang đi đường, chính Ngài đi vào một làng nào đó, và một người phụ nữ tên là Ma-thê đón tiếp Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đón nhận Ngài.” Động từ Hy Lạp mang ý tiếp nhận một người cách hiếu khách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Khi họ đang đi đường
  rationale: Kết cấu ἐν với động từ nguyên mẫu có mạo từ diễn tả hành động đồng thời; đại từ số nhiều αὐτούς chỉ cả đoàn đang đi. δέ chỉ nhẹ nhàng nối tiếp câu chuyện nên không cần dịch thành một từ riêng.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: Đại từ nhấn mạnh làm nổi bật chủ thể số ít so với nhóm người số nhiều vừa được nhắc đến; “chính Ngài” giữ được sắc thái ấy mà không tự ý thay đại từ bằng tên Giê-su.
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: vào một làng kia
  rationale: κώμη là làng; τινά diễn tả một địa điểm không nêu tên nhưng có tính xác định nhẹ. “Một làng kia” tự nhiên và giữ sắc thái kể chuyện.
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: có một người phụ nữ tên là Ma-thê
  rationale: Cách diễn đạt này giới thiệu tự nhiên một nhân vật mới; ὀνόματι Μάρθα được dịch theo thành ngữ tiếng Việt hiện đại là “tên là Ma-thê”.
- source_word: ὑπεδέξατο αὐτόν
  choice: đón tiếp Ngài
  rationale: ὑποδέχομαι mang nghĩa tiếp nhận một người với tư cách khách và hàm ý hiếu khách. “Đón tiếp” truyền đạt sắc thái này mà không thêm địa điểm “vào nhà mình,” vốn không được nói rõ trong câu Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng với độc giả Việt Nam hiện đại. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su theo văn phong Kinh Thánh phổ thông; giữ điểm nhấn của αὐτός bằng “chính Ngài.” Dấu chấm phẩy giúp phân tách việc Ngài vào làng và việc Ma-thê được giới thiệu.
