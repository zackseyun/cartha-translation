revisions:
- from: Khi họ đang đi đường, chính Ngài vào một làng kia; có một người phụ nữ tên là Ma-thê đón tiếp Ngài.[a]
  to: Khi họ đang đi đường, chính Ngài đi vào một làng nào đó, và một người phụ nữ tên là Ma-thê đón tiếp Ngài[a].
  rationale: Bản sửa giữ sự đối lập giữa “họ” số nhiều và “chính Ngài” số ít, diễn đạt κώμην τινά bằng tiếng Việt tự nhiên hơn, không thêm địa điểm không có trong nguyên văn, và chuyển neo chú thích đến đúng từ được giải thích.
