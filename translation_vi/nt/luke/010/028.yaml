revisions:
- from: 'Ngài nói với ông: “Ông đã trả lời đúng. Hãy làm điều này, thì ông sẽ sống.”[a]'
  to: 'Ngài nói với ông: “Ông đã trả lời đúng. Hãy làm điều này, và ông sẽ sống.”[a]'
  rationale: Chỉ điều chỉnh liên từ và nhịp câu để bản dịch tiếng Việt tự nhiên hơn và phản ánh trực tiếp καί. Nội dung, mức độ hàm ý thần học, cách xưng hô, và chú thích đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
