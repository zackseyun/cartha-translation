  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: vi
  text: 'Ngài nói với ông: “Ông đã trả lời đúng. Hãy làm điều này, và ông sẽ sống.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bối cảnh rộng hơn nói về sự sống đời đời (xem Lu-ca 10:25), nhưng tiếng Hy Lạp ở đây chỉ nói: “ông sẽ sống.”'
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Ngài nói với ông
  rationale: Động từ εἶπεν diễn tả hành động nói; αὐτῷ là đối tượng gián tiếp, ‘với ông’. Tiểu từ δέ chỉ nối nhẹ trong mạch kể nên không nhất thiết phải dịch thành một liên từ riêng trong tiếng Việt.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Ông đã trả lời đúng
  rationale: Ὀρθῶς nghĩa là ‘đúng, chính xác’; ἀπεκρίθης là động từ aorist ngôi hai số ít. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên lời đánh giá của Chúa Giê-su.
- source_word: τοῦτο ποίει
  choice: Hãy làm điều này
  rationale: τοῦτο chỉ về điều vừa được nêu; ποίει là mệnh lệnh hiện tại, có thể hàm ý tiếp tục thực hành. Bản dịch ngắn gọn giữ được mệnh lệnh mà không diễn giải quá mức.
- source_word: καὶ ζήσῃ
  choice: thì ông sẽ sống
  rationale: ζήσῃ có nghĩa trực tiếp là ‘ông sẽ sống’. Dịch καί bằng ‘thì’ phù hợp tự nhiên với cấu trúc mệnh lệnh–kết quả trong tiếng Việt.
theological_decisions:
- issue: Phạm vi ý nghĩa của ‘sống’ trong bối cảnh sự sống đời đời
  choice: Giữ cách nói đơn giản ‘ông sẽ sống’.
  alternative: ‘ông sẽ được hưởng sự sống đời đời’ hoặc ‘ông sẽ có sự sống’.
  rationale: Câu Hy Lạp chỉ nói ζήσῃ, ‘ông sẽ sống’. Bối cảnh ở Lu-ca 10:25 liên quan đến sự sống đời đời, nhưng không nên đưa thêm ‘đời đời’ hay ‘được hưởng’ vào chính văn; chú thích nêu rõ mối liên hệ này và giữ nguyên độ căng thần học của lời nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ cho Chúa Giê-su và ‘ông’ cho người thông luật; lược dịch δέ để mạch kể tự nhiên. Dấu chú thích [a] được đặt ngay sau câu có từ ‘sống’.
