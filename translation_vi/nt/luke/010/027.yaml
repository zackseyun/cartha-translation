id: LUK.10.27
reference: Luke 10:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: vi
  text: 'Ông đáp: “Ngươi phải yêu Chúa, Đức Chúa Trời của ngươi, hết lòng, hết linh hồn, hết sức lực và hết tâm trí; và yêu người lân cận như chính mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ông đáp
  rationale: Cách diễn đạt tự nhiên trong văn kể chuyện tiếng Việt, gói gọn cấu trúc phân từ cộng động từ hữu hạn mà không làm mất ý nghĩa.
- source_word: Ἀγαπήσεις
  choice: Ngươi phải yêu
  rationale: Thì tương lai Hy Lạp ở đây có chức năng truyền lệnh trong lời Kinh Thánh được trích dẫn. “Phải yêu” truyền đạt rõ sức bắt buộc; “sẽ yêu” trong tiếng Việt dễ bị hiểu đơn thuần là dự báo.
- source_word: κύριον τὸν θεόν σου
  choice: Chúa là Đức Chúa Trời của ngươi
  rationale: Giữ cả danh hiệu κύριος và danh từ θεός, đồng thời diễn đạt tự nhiên quan hệ đồng vị trong tiếng Việt.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: từ trọn tấm lòng mình
  rationale: “Từ” phản ánh ἐξ, khác với ἐν trong ba cụm kế tiếp; “tấm lòng” là cách nói tự nhiên, trang trọng cho καρδία trong ngữ cảnh tình yêu và sự tận hiến.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: bằng trọn linh hồn mình
  rationale: “Bằng” diễn đạt phương diện hay toàn bộ năng lực được dùng để yêu; “linh hồn” giữ thuật ngữ ψυχή mà không giải thích nó theo một hệ nhân học cứng nhắc.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: bằng trọn sức lực mình
  rationale: ἰσχύς chỉ sức mạnh hay năng lực; “sức lực” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: bằng trọn tâm trí mình
  rationale: “Tâm trí” diễn đạt διάνοια là năng lực suy nghĩ và hiểu biết, đồng thời phân biệt với “tấm lòng”.
- source_word: τὸν πλησίον σου
  choice: người lân cận
  rationale: Cách dịch quen thuộc và chính xác trong ngữ cảnh đạo đức, chỉ người ở trong quan hệ gần gũi với một người.
- source_word: ὡς σεαυτόν
  choice: như chính mình
  rationale: Giữ nguyên sức so sánh của ὡς và cách nhấn mạnh phản thân của σεαυτόν.
theological_decisions:
- issue: Danh hiệu thần linh κύριος trong lời trích dẫn điều răn
  choice: Chúa
  alternative: Chủ
  rationale: Trong lời trích dẫn nói về Đức Chúa Trời của Israel, “Chúa” giữ được ý nghĩa thần linh và âm hưởng Kinh Thánh; “Chủ” dễ bị hiểu chủ yếu theo quan hệ xã hội.
- issue: Bốn thuật ngữ καρδία, ψυχή, ἰσχύς và διάνοια
  choice: 'Giữ riêng bốn cụm: tấm lòng, linh hồn, sức lực và tâm trí'
  alternative: Gộp lại thành “toàn thể con người”
  rationale: Việc giữ bốn thuật ngữ bảo toàn nhịp điệu nhấn mạnh sự tận hiến trọn vẹn, nhưng không áp đặt rằng câu này đang xác lập bốn thành phần tách biệt của con người.
- issue: Sắc thái mệnh lệnh của Ἀγαπήσεις
  choice: phải yêu
  alternative: sẽ yêu; hãy yêu
  rationale: “Phải yêu” thể hiện chức năng mệnh lệnh của hình thức tương lai trong câu trích dẫn mà không biến nó thành lời dự báo; đồng thời không cường điệu hơn mức nghĩa bắt buộc vốn có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và phù hợp với một lời trích dẫn Kinh Thánh. Đại từ “ngươi” giữ ngôi thứ hai số ít và sắc thái điều răn; “mình” tránh lặp lại “ngươi” trong các cụm sở hữu. Dấu chấm phẩy giúp người đọc nhận ra hai điều răn được nối với nhau.
