    rationale: ἐξ trong cụm trích dẫn này góp phần diễn tả sự tận hiến toàn diện; tiếng Việt tự nhiên dùng “hết lòng.” Cố duy trì đối lập ἐξ/ἐν bằng “từ/bằng” tạo các cụm không tự nhiên và không cần thiết để bảo toàn nghĩa.
