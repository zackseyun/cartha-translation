    issue: Lối xưng hô “Ta nói với các con”
    rationale: λέγω ὑμῖν chỉ có ngôi thứ nhất số ít và đối tượng số nhiều; nguyên văn không xác định quan hệ cha–con. “Tôi nói với anh em” là lối xưng hô hiện đại, trang trọng và ít thêm diễn giải hơn.
  - severity: medium
    issue: “Được khoan dung hơn” làm lệch sắc thái của ἀνεκτότερον
    rationale: Từ này có nghĩa cơ bản là dễ chịu đựng/dễ kham chịu hơn. Trong ngữ cảnh phán xét, diễn đạt bằng hình phạt nhẹ hơn là rõ nghĩa; “khoan dung” dễ gợi lòng tha thứ hoặc thái độ của chủ thể phán xét.
  - severity: low
