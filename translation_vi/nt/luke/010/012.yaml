  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: vi
  text: 'Tôi nói với anh em rằng: Vào ngày ấy,[a] hình phạt dành cho Sô-đôm sẽ nhẹ hơn hình phạt dành cho thành ấy.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ngày ấy” chỉ ngày Đức Chúa Trời phán xét; một số đoạn song song nói điều này cách rõ ràng.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “đối với Sô-đôm sẽ dễ chịu đựng hơn đối với thành ấy.” Từ Hy Lạp ἀνεκτότερον có nghĩa là “dễ chịu đựng hơn” hoặc “dễ kham chịu hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Giữ lời khẳng định trực tiếp, trang trọng của Chúa Giê-su; “các con” diễn đạt đại từ số nhiều ὑμῖν tự nhiên trong quan hệ thầy–trò ở văn cảnh này.
- source_word: Σοδόμοις
  choice: Sô-đôm
  rationale: Giữ địa danh như một cách hoán dụ chỉ dân thành Sô-đôm, không diễn giải quá mức thành “dân Sô-đôm”.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Trong ngày ấy
  rationale: Bám sát thành ngữ thời gian của nguyên văn và không thêm cụm “phán xét” vốn không xuất hiện trực tiếp trong câu.
- source_word: ἀνεκτότερον ἔσται
  choice: sẽ được khoan dung hơn
  rationale: Trong ngữ cảnh phán xét, cách nói này tự nhiên trong tiếng Việt và chuyển tải ý so sánh rằng Sô-đôm sẽ chịu sự phán xét nhẹ hơn.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: hơn thành kia
  rationale: Giữ phép so sánh và đại từ chỉ định, đồng thời dùng “thành” phù hợp với πόλις và văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “ngày ấy”
  choice: Giữ nguyên “trong ngày ấy” trong chính văn
  alternative: trong ngày phán xét
  rationale: Văn cảnh hàm ý ngày phán xét của Đức Chúa Trời, nhưng câu Hy Lạp chỉ nói “ngày ấy”; chú thích nêu hàm ý mà không đưa phần diễn giải vào chính văn.
- issue: Sắc thái của ἀνεκτότερον
  choice: sẽ được khoan dung hơn
  alternative: sẽ dễ chịu đựng hơn
  rationale: Nguyên ngữ có thể diễn tả điều dễ chịu đựng hoặc dễ dung thứ hơn. Trong ngữ cảnh xét xử, “được khoan dung hơn” sáng nghĩa nhưng chú thích vẫn bảo lưu khả năng dịch sát theo hướng chịu đựng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc cô đọng, lời khẳng định nghiêm nghị và sự hàm ẩn về ngày phán xét; không thêm thuật ngữ thần học vào chính văn.
