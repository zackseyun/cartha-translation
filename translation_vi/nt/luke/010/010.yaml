  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: vi
  text: 'Nhưng khi anh em vào bất cứ thành nào mà người ta không tiếp đón anh em, hãy đi ra các đường phố[a] của thành ấy và nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các quảng trường công cộng” hoặc “các đường phố rộng”. Từ Hy Lạp πλατείας chỉ những lối đi rộng, công khai hoặc những khoảng không gian công cộng.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Nhưng khi anh em vào bất cứ thành nào
  rationale: Cấu trúc quan hệ bất định với ἄν chỉ bất cứ trường hợp nào có thể xảy ra. “Bất cứ thành nào” diễn đạt tự nhiên tính khái quát, còn “nhưng khi” nối mệnh đề này với lời chỉ dẫn tương phản trước đó.
- source_word: εἰσέλθητε
  choice: vào
  rationale: Động từ chỉ việc đi vào thành; “vào” ngắn gọn, tự nhiên và giữ đúng hướng chuyển động.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: người ta không tiếp đón anh em
  rationale: δέχομαι trong bối cảnh sai phái mang nghĩa tiếp nhận hoặc chào đón các sứ giả. “Tiếp đón” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái tiếp nhận con người, không thu hẹp thành việc đồng ý với thông điệp.
- source_word: ἐξελθόντες
  choice: hãy đi ra
  rationale: 'Phân từ này diễn tả hành động xảy ra trước mệnh lệnh “nói”; chuyển thành mệnh lệnh phối hợp giúp câu tiếng Việt rõ và tự nhiên: đi ra rồi nói.'
- source_word: τὰς πλατείας αὐτῆς
  choice: các đường phố của thành ấy
  rationale: πλατεῖα có thể chỉ đường phố rộng hoặc không gian công cộng rộng mở. “Các đường phố” phù hợp ngữ cảnh công bố công khai; chú thích giữ lại các khả năng từ vựng cụ thể hơn.
- source_word: εἴπατε
  choice: và nói
  rationale: Mệnh lệnh của λέγω trực tiếp dẫn vào lời trích dẫn ở câu kế tiếp; “nói” là cách dịch chính xác và tự nhiên.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” thể hiện lời Chúa Giê-su nói trực tiếp với nhóm môn đồ mà không thêm sắc thái hệ phái. Dấu hai chấm được giữ vì câu này dẫn vào lời công bố ở câu kế tiếp.
