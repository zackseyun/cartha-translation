id: LUK.10.20
reference: Luke 10:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: vi
  text: Tuy nhiên, đừng vui mừng vì các thần linh vâng phục anh em[a], nhưng hãy vui mừng vì tên anh em đã được ghi trong các tầng trời[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngữ cảnh cho thấy đây là những hữu thể thần linh thù nghịch; cũng có thể diễn đạt là “các tà linh” hoặc “quỷ”, nhưng tiếng Hy Lạp ở đây chỉ nói “các thần linh”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch theo cách quen thuộc hơn là “trên trời”. Tiếng Hy Lạp dùng dạng số nhiều: “trong các tầng trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Tuy nhiên
  rationale: Diễn đạt sức chuyển ý mang tính điều chỉnh mạnh đối với niềm vui vừa được nói đến, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐν τούτῳ
  choice: vì
  rationale: Trong kết cấu với χαίρετε, tiếng Việt tự nhiên dùng “vui mừng vì”; ý chỉ nguyên do hay đối tượng của niềm vui vẫn được giữ nguyên.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: đừng vui mừng ... nhưng hãy vui mừng
  rationale: Lặp lại cùng một động từ để bảo toàn phép đối lập và sự lặp từ trong nguyên văn.
- source_word: τὰ πνεύματα
  choice: các linh
  rationale: Giữ phạm vi nghĩa của πνεύματα, không đưa “quỷ” hay “ác” vào chính văn dù ngữ cảnh cho thấy đây là các hữu thể thần linh thù nghịch.
- source_word: ὑμῖν ὑποτάσσεται
  choice: phải phục các con
  rationale: Diễn đạt rõ việc các linh ở dưới thẩm quyền của các môn đồ; “phải phục” tự nhiên và trang trọng hơn lối dịch sát cứng “bị đặt dưới các con”.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: tên các con
  rationale: Cách diễn đạt sở hữu tự nhiên trong tiếng Việt; “các con” phù hợp lời Đức Giê-su nói trực tiếp với các môn đồ.
- source_word: ἐγγέγραπται
  choice: đã được ghi
  rationale: Giữ thể bị động và diễn đạt hành động đã hoàn tất với kết quả còn hiệu lực của thì hoàn thành Hy Lạp.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: trên các tầng trời
  rationale: Giữ hình thức số nhiều của οὐρανοῖς bằng một cách diễn đạt tiếng Việt rõ nghĩa và có phẩm cách.
theological_decisions:
- issue: Bản chất của τὰ πνεύματα
  choice: các linh
  alternative: quỷ; các tà linh
  rationale: Ngữ cảnh hàm ý các hữu thể thần linh thù nghịch, nhưng chính câu này chỉ nói “các linh”; bản dịch không thu hẹp nghĩa trong chính văn.
- issue: Nơi tên được ghi
  choice: trên các tầng trời
  alternative: trên trời; ở thiên đàng
  rationale: Giữ số nhiều của nguyên văn mà không đồng nhất cách diễn đạt này với một thuật ngữ hệ phái cụ thể.
- issue: Lực của thể hoàn thành bị động ἐγγέγραπται
  choice: đã được ghi
  alternative: được ghi; có ghi
  rationale: Thể hiện hành động đã xảy ra và tình trạng kết quả vẫn còn, đồng thời không suy đoán ai là tác nhân ghi tên.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ phép đối “đừng vui mừng ... nhưng hãy vui mừng”, dùng “các con” cho lời Đức Giê-su nói với các môn đồ, và bảo toàn sự rộng nghĩa của “các linh” cùng số nhiều “các tầng trời”.
