revisions:
- from: Tuy nhiên, đừng vui mừng vì các linh phải phục các con[a], nhưng hãy vui mừng vì tên các con đã được ghi trên các tầng trời[b].
  to: Tuy nhiên, đừng vui mừng vì các thần linh vâng phục anh em[a], nhưng hãy vui mừng vì tên anh em đã được ghi trong các tầng trời[b].
  rationale: 'Bản sửa thay các cụm có thể gây lệch nghĩa hoặc kém tự nhiên bằng những cách diễn đạt tiếng Việt hiện đại hơn: “vâng phục” mô tả đúng quan hệ phục tùng; “trong” phản ánh ἐν; “các thần linh” giữ độ rộng từ vựng của πνεύματα; và “anh em” không thêm sắc thái quan hệ vốn không có trong nguyên văn. Cấu trúc đối ứng “đừng vui mừng ... nhưng hãy vui mừng,” thể bị động hoàn thành “đã được ghi,” và số nhiều “các tầng trời” được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp bảo toàn tốt thế đối lập của πλὴν ... δέ, không thu hẹp τὰ πνεύματα thành “quỷ,” và diễn đạt được thể hoàn thành bị động của ἐγγέγραπται. Tuy nhiên, “phải phục” dễ chuyển sắc thái mô tả hiện thực “đang quy phục/phục tùng” thành nghĩa bắt buộc hoặc mệnh lệnh; “trên các tầng trời” cũng không phản ánh trực tiếp giới từ ἐν (“trong”).
  naturalness: “Các linh” có thể hiểu được trong văn cảnh tôn giáo nhưng kém tự nhiên và dễ gợi “linh hồn” trong tiếng Việt hiện đại. “Các thần linh” diễn đạt tự nhiên hơn phạm vi các hữu thể linh giới mà vẫn không xác định đó là quỷ. “Anh em” là lối xưng hô tự nhiên với một nhóm môn đồ trưởng thành và không thêm quan hệ phụ tử không được nêu trong bản văn.
  terminology: Giữ “các thần linh” trong chính văn để không áp đặt “quỷ/tà linh”; chú thích vẫn nêu rõ ngữ cảnh thù nghịch và các lựa chọn hẹp hơn. Giữ “các tầng trời” để phản ánh số nhiều οὐρανοῖς, nhưng dùng “trong” theo ἐν.
  issues:
  - severity: medium
    issue: “phải phục”
    rationale: Cụm này có thể hàm ý nghĩa bắt buộc (“must submit”) hơn là lời xác nhận rằng các thần linh hiện đang phục tùng các môn đồ (ὑποτάσσεται). “vâng phục” giữ nghĩa tốt hơn.
  - severity: medium
    issue: “trên các tầng trời”
    rationale: Nguyên ngữ dùng ἐν, nên “trong các tầng trời” sát hơn. Cách này đồng thời duy trì số nhiều mà không chuyển sang cách nói quen thuộc nhưng số ít “trên trời.”
  - severity: low
    issue: “các con” và “các linh”
    rationale: “Các con” thêm sắc thái phụ tử không được đánh dấu trong câu Hy Lạp, còn “các linh” kém tự nhiên trong văn xuôi tiếng Việt hiện đại. “anh em” và “các thần linh” tự nhiên hơn mà không thay đổi nghĩa.
