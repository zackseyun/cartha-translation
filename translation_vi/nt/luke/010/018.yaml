source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ἐθεώρουν τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Ta đang thấy Sa-tan từ trời sa xuống như chớp.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đã thấy Sa-tan từ trời sa xuống như chớp.” Động từ Hy Lạp ở thì chưa hoàn thành có thể được diễn đạt đơn giản là “đã thấy”, nhưng “đang thấy” giữ rõ hơn khía cạnh đang diễn tiến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Ngài nói với họ
  rationale: Động từ aorist εἶπεν được diễn đạt bằng quá khứ kể chuyện tự nhiên trong tiếng Việt; δέ là từ nối nhẹ nên không nhất thiết phải dịch riêng, tránh câu mở đầu gượng gạo.
- source_word: Ἐθεώρουν
  choice: Ta đang thấy
  rationale: Thì chưa hoàn thành nhấn mạnh góc nhìn đang diễn tiến. “Đang thấy” tự nhiên hơn “đang quan sát” trong lời kể về một cảnh tượng, đồng thời giữ được thể chưa hoàn thành.
- source_word: τὸν Σατανᾶν
  choice: Sa-tan
  rationale: Danh xưng riêng được phiên âm theo cách quen thuộc trong tiếng Việt, không diễn giải thành “Kẻ Đối Địch”.
- source_word: ὡς ἀστραπὴν
  choice: như chớp
  rationale: Giữ nguyên phép so sánh do ὡς dẫn nhập bằng cách diễn đạt ngắn gọn, tự nhiên.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Trong ngữ cảnh này, οὐρανός mang nghĩa cõi trời hơn là bầu trời khí tượng; “từ trời” vừa tự nhiên vừa không thêm diễn giải.
- source_word: πεσόντα
  choice: sa xuống
  rationale: Phân từ aorist bổ nghĩa cho Sa-tan được chuyển thành vị ngữ bổ sung tự nhiên trong tiếng Việt. “Sa xuống” giữ sắc thái rơi khỏi một vị trí cao mà không xác định thời điểm hay ý nghĩa thần học của biến cố.
theological_decisions:
- issue: Thời điểm và ý nghĩa của việc Sa-tan sa khỏi trời
  choice: 'Giữ lời phán như một cảnh tượng đang được thấy: “Ta đang thấy Sa-tan từ trời sa xuống như chớp.”'
  alternative: “Ta đã thấy Sa-tan từ trời sa xuống như chớp.”
  rationale: Thì chưa hoàn thành của Ἐθεώρουν hỗ trợ cách diễn đạt đang diễn tiến, nhưng câu Hy Lạp không xác định đây là biến cố nguyên thủy, hệ quả đương thời từ sứ vụ của các môn đồ, hay khải tượng tiên báo sự thất bại của Sa-tan. Bản dịch không áp đặt một dòng thời gian thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn và “Ta” trong lời trực tiếp của Chúa Giê-su. Cấu trúc “từ trời sa xuống” ưu tiên nhịp câu tiếng Việt tự nhiên, đồng thời giữ đủ nguồn xuất phát, chuyển động và hình ảnh so sánh của nguyên văn.
