id: LUK.10.14
reference: Luke 10:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: vi
  text: Nhưng trong cuộc phán xét, Ty-rơ và Si-đôn sẽ được xét xử khoan dung hơn các ngươi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sẽ dễ chịu đựng hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với lời quở trách trước đó, tự nhiên trong tiếng Việt hiện đại.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: thành Ty-rơ và thành Si-đôn
  rationale: Các danh từ ở cách dữ cho biết những đối tượng được so sánh; thêm “thành” giúp người đọc nhận ra đây là địa danh mà không làm thay đổi ý nghĩa.
- source_word: ἀνεκτότερον
  choice: được khoan dung hơn
  rationale: Trong ngữ cảnh phán xét, cách diễn đạt này chuyển tải ý nghĩa ‘dễ chịu đựng hơn/ít nghiêm khắc hơn’ một cách tự nhiên; chú thích giữ lại phương án sát hình ảnh chịu đựng.
- source_word: ἔσται
  choice: sẽ được
  rationale: Giữ rõ ý tương lai của động từ, đồng thời kết hợp tự nhiên với cụm “khoan dung hơn” trong tiếng Việt.
- source_word: ἐν τῇ κρίσει
  choice: trong ngày phán xét
  rationale: Mạo từ xác định và văn cảnh chỉ đến cuộc phán xét cánh chung; “ngày phán xét” là cách nói tiếng Việt rõ ràng, quen thuộc mà không diễn giải thêm bản chất của sự phán xét.
- source_word: ἢ ὑμῖν
  choice: hơn các ngươi
  rationale: Hoàn tất phép so sánh. “Các ngươi” giữ sắc thái quở trách trực tiếp đối với các thành được nhân cách hóa trong văn cảnh.
theological_decisions:
- issue: Bản chất của κρίσις trong văn cảnh
  choice: “ngày phán xét” chỉ cuộc phán xét cuối cùng
  alternative: sự xét xử hoặc hình phạt theo nghĩa khái quát
  rationale: Việc Chúa Giê-su so sánh số phận của các thành không ăn năn với Ty-rơ và Si-đôn hướng mạnh đến cuộc phán xét chung cuộc. Bản dịch nêu thời điểm nhưng không mở rộng về bản chất hay mức độ hình phạt.
- issue: Ý nghĩa so sánh của ἀνεκτότερον
  choice: “được khoan dung hơn”
  alternative: “dễ chịu đựng hơn”
  rationale: Câu khẳng định sự khác biệt trong mức độ nghiêm khắc của phán xét nhưng không giải thích nền tảng thần học của sự khác biệt ấy; chú thích bảo tồn sắc thái từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phù hợp với lời quở trách trực tiếp trong văn cảnh; dùng dạng địa danh quen thuộc “Ty-rơ” và “Si-đôn”.
