  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: vi
  text: 'Ngài nói với ông: “Trong Luật pháp có chép điều gì? Ông đọc thế nào?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Ông giải thích thế nào?” Tiếng Hy Lạp sát nghĩa là “Ông đọc thế nào?”, nhưng câu này có thể bao hàm ý hỏi ông hiểu hoặc giải thích Luật pháp ra sao.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ngài
  rationale: δέ là từ nối nhẹ; trong tiếng Việt không cần dịch riêng để câu kể tự nhiên. Mạo từ ὁ được dùng như đại từ chỉ Chúa Giê-su; “Ngài” giữ văn phong trang trọng và làm rõ chủ thể theo ngữ cảnh.
- source_word: εἶπεν πρὸς αὐτόν
  choice: nói với ông
  rationale: Diễn đạt trực tiếp hành động nói và người được nói với, không thêm sắc thái trả lời vốn không được biểu thị rõ trong cụm Hy Lạp.
- source_word: Ἐν τῷ νόμῳ
  choice: Trong Luật pháp
  rationale: νόμος ở đây chỉ bộ Luật Kinh Thánh được giới thông luật Do Thái thừa nhận. Viết hoa “Luật pháp” phân biệt với luật lệ nói chung mà không buộc dùng từ phiên âm “Torah”.
- source_word: τί γέγραπται
  choice: có chép điều gì
  rationale: 'Cách nói tự nhiên trong tiếng Việt khi dẫn Kinh Thánh, đồng thời phản ánh thể hoàn thành bị động: điều đã được chép và hiện vẫn thành văn.'
- source_word: πῶς ἀναγινώσκεις
  choice: Ông đọc thế nào?
  rationale: Giữ nghĩa từ vựng cơ bản của ἀναγινώσκω là “đọc” và duy trì tính mở của câu hỏi; trong ngữ cảnh, câu này cũng có thể hỏi cách hiểu hay giải thích.
theological_decisions:
- issue: Nghĩa của νόμος trong câu hỏi của Chúa Giê-su
  choice: Luật pháp, tức bộ luật Kinh Thánh của Israel
  alternative: Torah; luật theo nghĩa chung
  rationale: Ngữ cảnh là cuộc đối thoại với một chuyên gia Luật pháp Do Thái. “Luật pháp” vừa dễ hiểu trong tiếng Việt vừa giữ đúng quy chiếu Kinh Thánh mà không thu hẹp hay khái quát hóa quá mức.
- issue: Sắc thái giải thích của πῶς ἀναγινώσκεις
  choice: Giữ cách nói “Ông đọc thế nào?”
  alternative: Ông hiểu điều ấy thế nào?; Ông giải thích thế nào?
  rationale: Động từ Hy Lạp trực tiếp có nghĩa là “đọc”, nhưng trong ngữ cảnh có thể bao hàm việc hiểu hoặc giải thích. Bản chính giữ nguyên độ mở về tu từ và thần học; chú thích nêu sắc thái khả hữu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “ông” cho người thông luật theo ngữ cảnh. Cấu trúc hỏi ngắn gọn giữ nhịp đối thoại và sự hàm súc của nguyên văn.
