  terminology: “Luật pháp” viết hoa phù hợp để chỉ νόμος như bộ Luật/Kinh Thánh được thừa nhận trong ngữ cảnh Do Thái. Chú thích nêu khả năng sắc thái “giải thích” mà vẫn xác định đúng nghĩa sát chữ là “đọc”; điều này bảo toàn độ mở của nguyên văn.
