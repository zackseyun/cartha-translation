id: LUK.10.9
reference: Luke 10:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: vi
  text: 'Hãy chữa lành những người đau ốm trong thành ấy, và nói với họ: “Vương quốc Đức Chúa Trời đã đến gần các anh chị em[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã tiến gần đến các anh chị em.”'
    reason: Ghi nhận cách diễn đạt khác nhấn mạnh sắc thái chuyển động của động từ ἤγγικεν; bản dịch chính tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: θεραπεύετε
  choice: hãy chữa lành
  rationale: Động từ mệnh lệnh hiện tại số nhiều chỉ việc các môn đồ phải thực hiện trong sứ mạng. “Chữa lành” tự nhiên trong ngữ cảnh người đau ốm và không mở rộng nghĩa thành việc chăm sóc nói chung.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: những người đau ốm trong thành ấy
  rationale: ἀσθενεῖς có thể chỉ người yếu hoặc người bệnh; khi đi với θεραπεύετε, nghĩa bệnh tật là nghĩa nổi bật. Đại từ αὐτῇ quy chiếu về thành được nhắc ở câu trước, nên dịch rõ là “trong thành ấy” thay vì dùng một đại từ dễ mơ hồ trong tiếng Việt.
- source_word: λέγετε αὐτοῖς
  choice: nói với họ
  rationale: Giữ cách diễn đạt trực tiếp, đơn giản của nguyên văn và nối tự nhiên với lời công bố theo sau.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thì hoàn thành diễn tả sự đến gần đã xảy ra và còn có ý nghĩa trong hiện tại. “Đã đến gần” vừa tự nhiên trong tiếng Việt vừa không giản lược thành trạng thái “đang ở gần”.
- source_word: ἐφ’ ὑμᾶς
  choice: anh em
  rationale: Trong cấu trúc với ἐγγίζω, ἐπί + đối cách diễn tả sự tiến đến trong tương quan với người nghe. Tiếng Việt không cần dịch máy móc giới từ; “đến gần anh em” truyền đạt tự nhiên ý này.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Vương quốc Đức Chúa Trời
  rationale: “Vương quốc” giữ được hình ảnh vương quyền và phạm vi cai trị của βασιλεία, đồng thời là cách nói trang trọng, dễ hiểu. Cách dịch này không thu hẹp nghĩa chỉ còn hành động cai trị.
theological_decisions:
- issue: Ý nghĩa của lời công bố về Vương quốc
  choice: Giữ lời công bố rằng Vương quốc Đức Chúa Trời “đã đến gần”, nhấn mạnh sự đến gần có ý nghĩa hiện tại nhưng không xác định Vương quốc đã được thực hiện trọn vẹn.
  alternative: Dịch thành “đã hiện diện trọn vẹn” hoặc “sắp đến” theo nghĩa hoàn toàn tương lai.
  rationale: ἤγγικεν cho thấy sự đến gần với hệ quả hiện tại, nhưng bản thân câu này không giải quyết trọn vẹn mối liên hệ giữa phương diện hiện tại và tương lai của Vương quốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Thành ấy” làm rõ sở chỉ của đại từ Hy Lạp mà không phụ thuộc câu trước trong bản trích riêng. “Anh em” là cách xưng hô số nhiều quen thuộc trong văn phong Kinh Thánh tiếng Việt; không hàm ý giới hạn người nghe chỉ là nam giới.
