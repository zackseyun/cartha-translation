    rationale: Người nghe là những người trong thành, không nhất thiết là một nhóm tín hữu hay chỉ nam giới. «Các anh chị em» giữ số nhiều và phù hợp hơn với cách xưng hô bao quát hiện đại.
  - severity: low
    issue: Cụm chú thích «đã tiến đến gần» không tự nhiên bằng một phương án diễn đạt chuyển động khác.
    rationale: Chú thích cần phản ánh lựa chọn «has drawn near» mà vẫn là tiếng Việt tự nhiên; «đã tiến gần đến» làm được điều này.
