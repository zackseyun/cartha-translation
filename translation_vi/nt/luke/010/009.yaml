  source_fidelity: Bản dịch phản ánh đúng các mệnh lệnh số nhiều θεραπεύετε và λέγετε, đối tượng «những người đau ốm», và lời loan báo với thì hoàn thành «đã đến gần». Tuy nhiên, «anh em» có thể gợi một nhóm tín hữu hoặc nam giới, trong khi ὑμᾶς ở đây hướng đến dân chúng tại thành và không mang giới hạn ấy.
  naturalness: Câu văn nhìn chung tự nhiên, rõ ràng và giữ được giọng văn trang trọng hiện đại. «Các anh chị em» là cách xưng hô bao quát hơn trong tiếng Việt hiện đại; phương án thay thế trong chú thích được chỉnh cho tự nhiên hơn.
  terminology: «Chữa lành», «người đau ốm», và «Vương quốc Đức Chúa Trời» phù hợp ngữ cảnh và truyền đạt các thuật ngữ then chốt. Giữ «Vương quốc» để không thu hẹp βασιλεία chỉ còn nghĩa hành động cai trị.
  issues:
