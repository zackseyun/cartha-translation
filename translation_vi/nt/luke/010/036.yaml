revisions:
- from: Trong ba người này, theo ông, ai đã trở thành người thân cận của người bị rơi vào tay bọn cướp?[a]
  to: Theo ông, trong ba người này, ai đã trở thành người thân cận của người đã rơi vào tay những kẻ cướp?[a]
  rationale: Chỉnh cách diễn đạt nạn nhân để phản ánh phân từ chủ động ἐμπεσόντος và dùng từ ngữ trang trọng, tự nhiên hơn. Các thành tố then chốt—"theo ông", "đã trở thành", và "người thân cận"—được giữ nguyên về ý nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:03Z'
review_pass:
  verdict: revise
  source_fidelity: Câu dịch giữ đúng câu hỏi chọn lựa trong ba người, ý "đã trở thành" của γεγονέναι, và thuật ngữ πλησίον là "người thân cận". Tuy nhiên, "người bị rơi vào tay" dùng bị động không có trong phân từ chủ động ἐμπεσόντος; tuy ngữ cảnh hàm ý nạn nhân, tiếng Việt có thể giữ sát và tự nhiên hơn bằng "người đã rơi vào tay...".
  naturalness: '"Theo ông" là cách diễn đạt tự nhiên, phù hợp ngữ cảnh đối thoại trang trọng. "Người đã rơi vào tay những kẻ cướp" tự nhiên hơn "người bị rơi vào tay bọn cướp"; "những kẻ cướp" cũng có sắc thái văn chương Kinh Thánh trung tính hơn "bọn cướp".'
  terminology: '"Người thân cận" là thuật ngữ nhất quán và phù hợp cho πλησίον trong mạch Lu-ca 10. "Đã trở thành" bảo toàn sắc thái hoàn thành của γεγονέναι mà không áp đặt diễn giải thần học.'
  issues:
  - severity: low
    issue: '"bị rơi vào tay" chuyển phân từ chủ động thành bị động.'
    rationale: τοῦ ἐμπεσόντος nghĩa là "người đã rơi/ngã vào"; dù "bị" không đảo ngược ý chính trong ngữ cảnh, nó không cần thiết và làm câu kém sát nguyên văn.
  - severity: low
    issue: '"bọn cướp" hơi khẩu ngữ.'
    rationale: '"Những kẻ cướp" vẫn truyền đạt λῃστάς chính xác, đồng thời hợp văn phong Kinh Thánh hiện đại, trang trọng vừa phải hơn.'
