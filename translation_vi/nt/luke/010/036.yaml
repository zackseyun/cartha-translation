base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: vi
  text: Theo ông, trong ba người này, ai đã trở thành người thân cận của người đã rơi vào tay những kẻ cướp?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong ba người này, ông nghĩ ai là người thân cận của người đã rơi vào tay những kẻ cướp?” Nguyên văn Hy Lạp sát hơn là: “theo ông, ai đã trở thành người thân cận”, nhấn mạnh hành động trở thành người thân cận.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: Trong ba người này... ai
  rationale: Diễn đạt tự nhiên trong tiếng Việt câu hỏi chọn một người từ một nhóm xác định, đồng thời không thêm thông tin ngoài nguyên văn.
- source_word: δοκεῖ σοι
  choice: theo ông
  rationale: Chuyển tải ý đánh giá chủ quan ‘đối với ông/dường như với ông’ bằng lối hỏi tự nhiên, trang trọng trong tiếng Việt; ‘ông’ phù hợp với người đối thoại là thầy dạy luật.
- source_word: πλησίον
  choice: người thân cận
  rationale: Giữ danh từ chỉ người và mối quan hệ gần gũi, phù hợp mạch văn về điều răn yêu người thân cận.
- source_word: γεγονέναι
  choice: đã trở thành
  rationale: Giữ ý trở nên/có hành động khiến mình thành người thân cận, thay vì làm phẳng thành trạng thái ‘là’.
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: của người bị rơi vào tay bọn cướp
  rationale: Thành ngữ ‘rơi vào tay’ truyền đạt tự nhiên việc nạn nhân sa vào quyền lực của bọn cướp; thể bị động làm rõ nghĩa theo ngữ cảnh mà không đổi vai tham dự.
theological_decisions:
- issue: Trọng tâm đạo đức của câu hỏi trong dụ ngôn người Sa-ma-ri nhân lành
  choice: Dịch γεγονέναι là ‘đã trở thành’ để giữ sự chuyển hướng từ việc xác định ai là người thân cận sang việc chính mình trở thành người thân cận qua hành động.
  alternative: ‘đã là người thân cận’ hoặc ‘là người thân cận’
  rationale: Dạng hoàn thành của γίνομαι mang ý trở nên, không chỉ trạng thái tĩnh. Cách dịch này bảo toàn sức căng thần học và đạo đức của nguyên văn mà không thêm lời giải thích vào chính câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘theo ông’ thay cho cấu trúc cứng ‘dường như đối với ông’; giữ ‘đã trở thành’ để phản ánh sát nguyên văn. Dấu chân chú [a] xuất hiện trong chính văn.
