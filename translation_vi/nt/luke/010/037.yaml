  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: vi
  text: 'Người ấy đáp: “Người đã tỏ lòng thương xót đối với người ấy.” Giê-su bảo người ấy: “Hãy đi, còn anh cũng hãy làm như vậy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: Chính là người đã thương xót ông ta
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là “người đã làm lòng thương xót với ông ấy”; tiếng Việt tự nhiên diễn đạt là “người đã thương xót ông ta”. “Chính là” làm rõ câu trả lời xác định người mà không thêm nội dung thần học.
- source_word: Πορεύου
  choice: Hãy đi
  rationale: Giữ nguyên mệnh lệnh trực tiếp của động từ Hy Lạp.
- source_word: καὶ σὺ ποίει ὁμοίως
  choice: và chính anh cũng hãy làm như vậy
  rationale: Giữ sự nhấn mạnh của đại từ σὺ được nêu rõ trong tiếng Hy Lạp, đồng thời chuyển thể hiện tại mệnh lệnh ποίει bằng lời kêu gọi hành động có tính tiếp diễn hoặc làm theo gương ấy.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Cách gọi trang trọng, tự nhiên và phổ biến trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái nhấn mạnh nơi καὶ σὺ
  choice: chính anh cũng
  alternative: anh cũng
  rationale: Đại từ chủ ngữ σὺ xuất hiện minh nhiên sau καὶ nên có sắc thái nhấn mạnh; bản dịch giữ sắc thái này mà không diễn giải thêm.
- issue: Khía cạnh của ποίει
  choice: hãy làm như vậy
  alternative: hãy tiếp tục làm như vậy
  rationale: Thể hiện tại mệnh lệnh có thể gợi hành động thường xuyên, nhưng bản văn không buộc phải diễn đạt công khai là “tiếp tục”; cách dịch ngắn gọn giữ được độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để nối với nhân vật trong ngữ cảnh, “ông ta” cho người được nhận lòng thương xót, và “anh” trong lời Đức Giê-su nói trực tiếp với người thông luật.
