revisions:
- from: 'Người ấy đáp: “Chính là người đã thương xót ông ta.” Đức Giê-su bảo người ấy: “Hãy đi, và chính anh cũng hãy làm như vậy.”'
  to: 'Người ấy đáp: “Người đã tỏ lòng thương xót đối với người ấy.” Giê-su bảo người ấy: “Hãy đi, còn anh cũng hãy làm như vậy.”'
  rationale: Bản sửa loại bỏ tước hiệu không hiện diện trong nguyên văn, tránh tăng cường câu trả lời bằng “chính là”, và dùng thành ngữ tiếng Việt tự nhiên cho “làm lòng thương xót với người ấy.” “Còn anh cũng” bảo toàn sự đối chiếu/nhấn mạnh của καὶ σὺ mà không diễn giải khía cạnh của mệnh lệnh hiện tại ποίει.
  reviewer_model: gpt-5.6-terra
