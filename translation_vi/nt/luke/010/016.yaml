id: LUK.10.16
reference: Luke 10:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: vi
  text: Ai nghe các con là nghe thầy; ai khước từ các con là khước từ thầy; còn ai khước từ thầy là khước từ Đấng đã sai thầy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Khước từ” cũng có thể dịch là “coi thường” hoặc “gạt bỏ” (Hy Lạp: ἀθετέω).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Ai nghe
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và mang ý nghĩa khái quát. “Ai nghe” tự nhiên trong tiếng Việt, đồng thời giữ được tính phổ quát của câu.
- source_word: ὑμῶν / ὑμᾶς
  choice: các con
  rationale: Các đại từ chỉ chính những môn đồ được sai đi, không chỉ sứ điệp của họ. “Các con” phù hợp với lời Đức Giê-su trực tiếp nói cùng nhóm môn đồ và giữ sắc thái quan hệ thầy–trò tự nhiên trong tiếng Việt.
- source_word: ἐμοῦ / ἐμέ / με
  choice: thầy
  rationale: Trong ngữ cảnh Đức Giê-su nói với các môn đồ, “thầy” là cách tự xưng tự nhiên, trang trọng vừa phải, và duy trì sự đối xứng cá nhân giữa các môn đồ với Đức Giê-su.
- source_word: ἀκούει
  choice: nghe
  rationale: Giữ nguyên sự lặp lại của động từ ἀκούω và không thêm sắc thái chú tâm hay vâng lời vốn có thể được gợi ra nhưng không được nói rõ.
- source_word: ἀθετέω
  choice: khước từ
  rationale: Động từ có thể mang nghĩa bác bỏ, gạt bỏ hoặc coi thường. “Khước từ” diễn đạt rõ sự không tiếp nhận một người và thích hợp với chuỗi quan hệ đại diện trong câu.
- source_word: δὲ
  choice: còn
  rationale: “Còn” đánh dấu bước chuyển và nhấn mạnh mệnh đề cuối một cách tự nhiên, không làm độ tương phản mạnh hơn mức cần thiết.
- source_word: τὸν ἀποστείλαντά με
  choice: Đấng đã sai thầy
  rationale: Giữ cấu trúc phân từ chỉ một nhân vật và không tự ý thêm danh xưng “Cha”. Viết hoa “Đấng” giúp cách gọi tự nhiên khi chỉ về Đức Chúa Trời mà vẫn để nguyên lối quy chiếu gián tiếp của bản Hy Lạp.
theological_decisions:
- issue: Sự đồng nhất mang tính đại diện giữa Đức Giê-su và các sứ giả của ngài
  choice: 'Giữ chuỗi trực tiếp: nghe hoặc khước từ các môn đồ là nghe hoặc khước từ Đức Giê-su.'
  alternative: Diễn giải thành nghe hoặc khước từ riêng “sứ điệp” của các môn đồ.
  rationale: Bản Hy Lạp dùng các đại từ chỉ người, không dùng danh từ “sứ điệp” hay “lời dạy”; vì thế bản dịch giữ nguyên lực cá nhân và thẩm quyền đại diện.
- issue: Danh tính của “Đấng đã sai thầy”
  choice: Giữ cách nói gián tiếp “Đấng đã sai thầy”.
  alternative: Nói rõ “Đức Chúa Cha đã sai thầy”.
  rationale: Ngữ cảnh cho thấy Đấng ấy là Đức Chúa Trời, nhưng câu Hy Lạp không dùng từ “Cha”; bản dịch không thêm phần giải thích vào chính văn.
- issue: Phạm vi nghĩa của ἀθετέω
  choice: Dùng nhất quán “khước từ” trong cả ba lần xuất hiện.
  alternative: Dùng “coi thường”, “gạt bỏ” hoặc thay đổi từ giữa các vế.
  rationale: Việc lặp cùng một từ bảo toàn nhịp điệu và chuỗi lập luận của nguyên văn, trong khi chú thích ghi nhận các khả năng từ vựng khác.
translation_notes:
  register: Văn phong hiện đại, cô đọng và trang nghiêm. Cách xưng hô “thầy–các con” làm rõ đây là lời Đức Giê-su nói với các môn đồ, tránh đại từ tiếng Việt mơ hồ về số và quan hệ. Dấu chấm phẩy giữ nhịp ba vế song song của câu Hy Lạp.
