id: LUK.10.24
reference: Luke 10:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: vi
  text: Vì tôi nói với anh em rằng nhiều nhà tiên tri và vua đã ao ước được thấy những điều anh em đang thấy, nhưng đã không thấy; và được nghe những điều anh em đang nghe, nhưng đã không nghe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với anh em
  rationale: Giữ γάρ là “vì” để nối câu này với lời chúc phước trước đó; λέγω với ὑμῖν được diễn đạt tự nhiên là “tôi nói với anh em”.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: nhiều nhà tiên tri và vua
  rationale: Dịch trực tiếp hai danh xưng lịch sử, không mở rộng “vua” thành “nhà cai trị” hay thêm “thời xưa” vốn không có trong nguyên văn.
- source_word: ἠθέλησαν
  choice: đã ao ước
  rationale: Trong ngữ cảnh này, θέλω diễn tả một ước muốn tha thiết; “ao ước” trang trọng, tự nhiên và không cường điệu quá mức.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: được thấy những điều anh em đang thấy
  rationale: “Được thấy” diễn đạt tự nhiên bổ ngữ của “ao ước”; thì hiện tại ở βλέπετε được thể hiện bằng “đang thấy”.
- source_word: καὶ οὐκ εἶδαν
  choice: mà không được thấy
  rationale: Cấu trúc này giữ sự tương phản giữa điều họ ao ước và điều họ không có cơ hội trải nghiệm, đồng thời tránh đại từ “điều đó” nặng nề trong tiếng Việt.
- source_word: καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: và được nghe những điều anh em đang nghe mà không được nghe
  rationale: Giữ cấu trúc song song thấy/nghe của tiếng Hy Lạp và phản ánh thì hiện tại của ἀκούετε bằng “đang nghe”.
theological_decisions:
- issue: Danh tính của “các nhà tiên tri và các vua”
  choice: Giữ nguyên các phạm trù lịch sử “nhà tiên tri và vua” mà không giải thích thêm.
  alternative: “các nhà tiên tri và nhà cai trị” hoặc “các nhà tiên tri và vua thời xưa”
  rationale: Nguyên văn đối chiếu các môn đồ với những nhân vật có địa vị trong quá khứ từng mong thấy và nghe sự mặc khải họ đang nhận được; bản dịch không xác định thêm danh tính hay thời kỳ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμεῖς trong lời Chúa Giê-su nói với các môn đồ. Không cần chú thích vì “ao ước” đã thể hiện phù hợp nghĩa theo ngữ cảnh, còn các phương án “muốn” hoặc “mong” không tạo ra khác biệt nội dung đáng kể.
source_grounding:
  english_pob_role: consult_only
