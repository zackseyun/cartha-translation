translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tách thành hai câu để tránh một câu ghép nặng nề và làm nổi bật phản ứng có chủ ý của thầy tế lễ. Dấu chú thích được đặt ngay sau mệnh đề chứa động từ cần giải thích.
