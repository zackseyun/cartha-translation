    rationale: “Tình cờ, một thầy tế lễ đang đi xuống trên con đường ấy.” không có vị ngữ chính hoàn chỉnh theo cách viết văn xuôi chuẩn. Thêm “có” và nối với vế tiếp theo phục hồi cấu trúc câu mà không thay đổi nghĩa.
  - severity: low
    issue: Cụm “tránh sang phía đối diện mà đi qua” kém tự nhiên và hơi diễn giải.
    rationale: Động từ ἀντιπαρῆλθεν quả có sắc thái đi qua ở phía đối diện, nhưng “đi qua phía bên kia” diễn đạt trực tiếp, tự nhiên; hàm ý né tránh có thể được giải thích ở chú thích.
