revisions:
- from: Tình cờ, một thầy tế lễ đang đi xuống trên con đường ấy. Khi thấy người bị nạn, ông tránh sang phía đối diện mà đi qua.[a]
  to: Tình cờ, có một thầy tế lễ đang đi xuống con đường ấy; khi thấy người bị nạn, ông đi qua phía bên kia.[a]
  rationale: Bản sửa tạo một câu tiếng Việt hoàn chỉnh, tự nhiên hơn, đồng thời bảo toàn trật tự diễn tiến và mọi nét nghĩa thiết yếu của bản Hy Lạp. Cụm từ về phía bên kia được làm gọn trong thân văn; sắc thái tránh né vẫn được nêu rõ nhưng thích hợp trong chú thích từ vựng.
