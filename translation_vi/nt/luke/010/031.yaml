  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: vi
  text: Tình cờ, có một thầy tế lễ đang đi xuống con đường ấy; khi thấy người bị nạn, ông đi qua phía bên kia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch ngắn là “ông đi qua”; tuy nhiên, động từ Hy Lạp gợi ý rằng ông đi qua ở phía đối diện, hàm ý cố ý tránh người bị nạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: Tình cờ
  rationale: Diễn đạt tự nhiên ý sự việc xảy ra do trùng hợp, đồng thời không đưa ra một khẳng định triết học quá mức về tính ngẫu nhiên.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ nhẹ để tiếp diễn câu chuyện; trong tiếng Việt, sự chuyển tiếp đã tự nhiên theo mạch văn nên không cần thêm “bấy giờ” hay “nhưng”.
- source_word: ἱερεύς τις
  choice: một thầy tế lễ
  rationale: “Một” thể hiện nhân vật không xác định do τις; “thầy tế lễ” là cách gọi trang trọng, dễ hiểu trong văn cảnh Do Thái.
- source_word: κατέβαινεν
  choice: đang đi xuống
  rationale: Giữ thể chưa hoàn thành, mô tả hành động đang diễn tiến; “xuống” cũng bảo tồn hướng chuyển động của động từ.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: trên con đường ấy
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt và giữ đại từ chỉ định ἐκείνῃ.
- source_word: ἰδὼν αὐτὸν
  choice: Khi thấy người bị nạn
  rationale: Chuyển phân từ aorist thành mệnh đề thời gian tự nhiên. Dùng “người bị nạn” để làm rõ sở chỉ của αὐτόν từ ngữ cảnh mà không lặp một đại từ tiếng Việt dễ mơ hồ.
- source_word: ἀντιπαρῆλθεν
  choice: ông tránh sang phía đối diện mà đi qua
  rationale: Giữ cả ý đi qua lẫn sắc thái sang phía đối diện để tránh người ấy, vốn được hàm ý bởi động từ ghép.
