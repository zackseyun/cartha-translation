review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng cấu trúc khái quát/bất định của εἰς ἣν ἂν πόλιν, ý tiếp đón của δέχωνται, mệnh lệnh của ἐσθίετε, và thức ăn được dọn trước người nghe của τὰ παρατιθέμενα ὑμῖν. Tuy nhiên, “các con” thêm sắc thái quan hệ cha-con không được biểu thị trong câu Hy Lạp; đại từ này cũng kém trung tính hơn khi nói với nhóm môn đồ.
  naturalness: Câu hiện tại dễ hiểu, nhưng “Khi ... và ...” có thể làm quan hệ điều kiện giữa việc vào thành và được tiếp đón chưa rõ bằng cấu trúc “..., nếu ..., thì ...”. “Anh em” là cách xưng hô hiện đại, tự nhiên và phù hợp hơn cho lời dạy hướng đến các môn đồ.
  terminology: Giữ “thành” cho πόλις và “tiếp đón” cho δέχωνται là phù hợp. “Những gì được dọn ra trước mặt anh em” diễn đạt chính xác, tự nhiên ý các món/thức ăn được đặt trước họ.
  issues:
  - severity: medium
    issue: Đại từ “các con”
    rationale: Nguyên văn chỉ có đại từ số nhiều “các anh/chị em, các bạn” và không đánh dấu quan hệ cha-con. “Các con” đưa vào một sắc thái quan hệ không cần thiết; “anh em” trung tính hơn trong ngữ cảnh Đức Giê-su sai phái các môn đồ.
  - severity: low
    issue: Liên kết điều kiện “Khi ... và ...”
    rationale: Dù có thể hiểu đúng, cách đặt “nếu ... thì ...” làm rõ hơn giá trị điều kiện/khái quát của mệnh đề với ἄν và δέχωνται, đồng thời tự nhiên trong tiếng Việt hiện đại.
  revised_text: Anh em vào bất cứ thành nào, nếu người ta tiếp đón anh em, thì hãy ăn những gì được dọn ra trước mặt anh em.
