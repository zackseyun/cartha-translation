  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: vi
  text: Anh em vào bất cứ thành nào, nếu người ta tiếp đón anh em, thì hãy ăn những gì được dọn ra trước mặt anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: bất cứ thành nào
  rationale: Đại từ quan hệ đi với ἄν diễn tả ý nghĩa bất định, khái quát. Cụm “bất cứ thành nào” tự nhiên trong tiếng Việt và giữ được phạm vi rộng của nguyên văn.
- source_word: εἰσέρχησθε
  choice: các con vào
  rationale: Động từ ở thể giả định hiện tại nằm trong kết cấu khái quát; “vào” truyền đạt rõ sự đi vào thành mà không nặng nề.
- source_word: δέχωνται ὑμᾶς
  choice: người ta tiếp đón các con
  rationale: δέχομαι trong ngữ cảnh này có thể là tiếp nhận hoặc chào đón. “Tiếp đón” vừa diễn tả việc đón nhận các môn đồ vừa tự nhiên trong bối cảnh khách được mời dùng bữa.
- source_word: ἐσθίετε
  choice: hãy ăn
  rationale: Thể mệnh lệnh hiện tại đưa ra chỉ thị; “hãy ăn” là cách diễn đạt trực tiếp, trang trọng vừa phải trong tiếng Việt.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: những gì được dọn ra trước mặt các con
  rationale: Phân từ bị động của παρατίθημι chỉ thức ăn được đặt hoặc dọn trước mặt người dùng. Cách dịch này giữ hình ảnh của nguyên văn mà vẫn tự nhiên.
theological_decisions:
- issue: Ý nghĩa của δέχωνται
  choice: tiếp đón
  alternative: tiếp nhận; đón tiếp
  rationale: Chọn nghĩa phù hợp với bối cảnh hiếu khách nhưng không suy diễn thêm về sự chấp nhận sứ điệp hay niềm tin.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng “các con” cho đại từ số nhiều ὑμᾶς trong lời Đức Giê-su nói với các môn đồ, đồng thời dùng “người ta” để thể hiện chủ ngữ ngôi thứ ba số nhiều không xác định.
