- from: Khi các con vào bất cứ thành nào và người ta tiếp đón các con, hãy ăn những gì được dọn ra trước mặt các con.
  to: Anh em vào bất cứ thành nào, nếu người ta tiếp đón anh em, thì hãy ăn những gì được dọn ra trước mặt anh em.
  rationale: Sửa đại từ để tránh thêm sắc thái quan hệ không có trong nguyên văn, và điều chỉnh liên kết câu để biểu đạt rõ, tự nhiên điều kiện khái quát. Không cần chú thích vì không có biến thể hay hàm nghĩa từ vựng thiết yếu nào chưa được thể hiện trong bản dịch.
