  to: 'Ngày hôm sau, ông lấy ra hai đơ-na-ri[a], trao cho chủ quán trọ và nói: “Hãy chăm sóc người này; anh có chi thêm bao nhiêu, khi tôi trở lại, tôi sẽ hoàn trả cho anh.”'
  rationale: 'Chỉ điều chỉnh hai cách diễn đạt để tiếng Việt hiện đại tự nhiên và minh bạch hơn: thay “tốn thêm” bằng “chi thêm,” và nêu rõ chủ ngữ của hành động trở lại. Nội dung, mức độ bất định của khoản chi, thuật ngữ tiền tệ, và vị trí chú thích đều được giữ nguyên.'
  reviewer_model: gpt-5.6-terra
