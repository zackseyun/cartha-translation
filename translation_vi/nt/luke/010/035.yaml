source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: vi
  text: 'Ngày hôm sau, ông lấy ra hai đơ-na-ri[a], trao cho chủ quán trọ và nói: “Hãy chăm sóc người này; anh có chi thêm bao nhiêu, khi tôi trở lại, tôi sẽ hoàn trả cho anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một đơ-na-ri là đồng bạc La Mã thông dụng, tương đương khoảng tiền công một ngày của một người lao động.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: Ngày hôm sau
  rationale: Diễn đạt tự nhiên thành ngữ chỉ thời gian, nghĩa là ngày kế tiếp.
- source_word: ἐκβαλών
  choice: lấy ra
  rationale: Trong ngữ cảnh, phân từ này chỉ việc lấy tiền từ chỗ đang cất giữ, không mang nghĩa mạnh theo mặt chữ là ném ra.
- source_word: δύο δηνάρια
  choice: hai đơ-na-ri
  rationale: Giữ nguyên tên đồng tiền cổ thay vì diễn giải thành số ngày công, đồng thời dùng dạng phiên âm dễ đọc trong tiếng Việt.
- source_word: πανδοχεῖ
  choice: chủ quán trọ
  rationale: Chỉ người trông coi nơi lưu trú, không phải chính quán trọ.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Hãy chăm sóc người này
  rationale: Truyền đạt rõ mệnh lệnh phải tận tình chăm nom; “người này” tự nhiên hơn đại từ đơn độc trong lời thoại tiếng Việt.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: anh có tốn thêm bao nhiêu
  rationale: Giữ tính bất định của khoản chi và ý nghĩa chi thêm hàm chứa trong tiền tố προσ-.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: khi trở lại
  rationale: Diễn đạt tự nhiên cấu trúc nguyên mẫu có quán từ mang nghĩa thời gian; chủ thể “tôi” được hiểu rõ từ mệnh đề chính.
- source_word: ἀποδώσω σοι
  choice: tôi sẽ hoàn trả cho anh
  rationale: Phản ánh đúng nghĩa thanh toán lại khoản chi phí, với văn phong trang trọng nhưng thông dụng.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, tự nhiên và trang trọng vừa phải. Đại từ “ông” chỉ người Sa-ma-ri trong lời kể; “anh” dùng trong lời ông nói với chủ quán, tránh xác định tuổi tác hay địa vị quá cụ thể. Dấu [a] được đặt ngay sau đơn vị tiền tệ mà chú thích giải thích.
