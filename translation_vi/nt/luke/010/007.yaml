  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: vi
  text: Hãy ở lại trong chính ngôi nhà ấy, ăn và uống những gì họ cung cấp, vì người làm công xứng đáng với tiền công của mình.[a] Đừng chuyển từ nhà này sang nhà khác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì người làm công xứng đáng được trả công.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε
  choice: Hãy ở lại trong chính nhà ấy
  rationale: “Chính nhà ấy” diễn đạt sức nhấn của αὐτῇ và quy chiếu về ngôi nhà đã tiếp đón họ; “ở lại” tự nhiên và giữ ý tiếp tục lưu trú của mệnh lệnh hiện tại μένετε.
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: ăn và uống những gì họ cung cấp
  rationale: Hai phân từ chỉ hoạt động đồng thời với việc ở lại. “Những gì họ cung cấp” diễn đạt tự nhiên thành ngữ τὰ παρ’ αὐτῶν mà không thêm chi tiết không có trong câu.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: vì người làm công xứng đáng được trả công
  rationale: ἐργάτης là người lao động/làm công; μισθός trong ngữ cảnh là tiền công. Cách diễn đạt tiếng Việt này tự nhiên, nêu rõ quan hệ xứng đáng nhận thù lao và không cần dùng đại từ giống đực vốn không bắt buộc trong tiếng Việt.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Đừng chuyển từ nhà này sang nhà khác
  rationale: “Chuyển” thể hiện việc đổi nơi lưu trú, còn cấu trúc “từ nhà này sang nhà khác” giữ sát thành ngữ Hy Lạp và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Quan hệ của τοῦ μισθοῦ αὐτοῦ với người làm công
  choice: xứng đáng được trả công
  alternative: xứng đáng với tiền công của mình
  rationale: Bản dịch chính giữ ý người làm công có quyền nhận thù lao, đồng thời dùng cách nói tự nhiên của tiếng Việt. Đại từ αὐτοῦ có hình thức giống đực số ít nhưng tiếng Việt không cần biểu thị giống ở đây; lược đại từ không làm mất quy chiếu số ít hay ý nghĩa tổng quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hãy/đừng” cho hai mệnh lệnh; “chính nhà ấy” giữ sắc thái nhấn mạnh và liên kết hồi chỉ của nguyên văn.
