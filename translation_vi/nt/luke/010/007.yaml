  source_fidelity: Bản thảo truyền đạt đúng các mệnh lệnh ở lại, nhận sự tiếp đãi và không đổi chỗ ở. Tuy nhiên, “xứng đáng được trả công” diễn giải ý nhận tiền công và làm mờ cấu trúc sát hơn của ἄξιος ... τοῦ μισθοῦ αὐτοῦ (“xứng đáng với tiền công của mình”).
  naturalness: Câu văn nhìn chung hiện đại, rõ ràng và có giọng điệu phù hợp. “Trong chính nhà ấy” chấp nhận được, nhưng “trong chính ngôi nhà ấy” tự nhiên hơn và tránh cảm giác “chính” bổ nghĩa mơ hồ.
  terminology: “Người làm công” và “tiền công” phù hợp với ἐργάτης và μισθός trong ngữ cảnh. Dùng “tiền công của mình” giữ quan hệ sở hữu/quy chiếu của αὐτοῦ mà vẫn tự nhiên trong tiếng Việt.
