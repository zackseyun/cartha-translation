source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: vi
  text: 'Nhưng Chúa trả lời bà: “Ma-thê, Ma-thê, bà lo lắng và bối rối về nhiều việc,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Nhưng Chúa đáp lời bà
  rationale: Cụm phân từ ἀποκριθεὶς đi với εἶπεν là lối nói tường thuật, được chuyển tự nhiên sang tiếng Việt bằng một động từ hữu hạn. δὲ diễn tả sự chuyển ý có nét tương phản nhẹ với lời than phiền của Ma-thê, nên dùng “Nhưng”.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ danh hiệu tường thuật và sắc thái Cơ Đốc học quen thuộc của κύριος trong Lu-ca; “Chúa” tự nhiên hơn “vị Chúa” trong tiếng Việt.
- source_word: Μάρθα Μάρθα
  choice: Ma-thê, Ma-thê
  rationale: Giữ nguyên cách gọi tên hai lần để bảo tồn sắc thái trìu mến nhưng nhấn mạnh của lời trực tiếp.
- source_word: μεριμνᾷς
  choice: con lo lắng
  rationale: Diễn đạt trạng thái lo âu trong lòng. Đại từ “con” phù hợp với lời Chúa gọi trực tiếp Ma-thê trong văn phong Kinh Thánh tiếng Việt, mà không thêm ý nghĩa thần học vào nguyên văn.
- source_word: θορυβάζῃ
  choice: bối rối
  rationale: Động từ chỉ tình trạng bị xao động, rối trí hay náo động trong lòng; “bối rối” phân biệt được với “lo lắng” và tự nhiên trong tiếng Việt hiện đại.
- source_word: περὶ πολλά
  choice: về nhiều việc
  rationale: “Nhiều việc” tự nhiên trong ngữ cảnh Ma-thê bận phục vụ, đồng thời vẫn giữ phạm vi khái quát của πολλά.
theological_decisions:
- issue: Cách dịch κύριος như danh hiệu của Đức Giê-su
  choice: Chúa
  alternative: chủ; thầy
  rationale: Trong lời tường thuật của Lu-ca, κύριος vừa là danh hiệu tôn kính vừa có âm hưởng Cơ Đốc học. “Chúa” bảo tồn được cả hai sắc thái tốt hơn các phương án thuần xã hội như “chủ” hay “thầy”.
- issue: Đại từ Đức Giê-su dùng để gọi Ma-thê
  choice: con
  alternative: bà; chị; cô; không nêu đại từ
  rationale: Tiếng Hy Lạp chỉ có động từ ngôi thứ hai số ít, không quy định đại từ xưng hô. “Con” tạo lời nói tự nhiên, dịu dàng và trang nghiêm trong truyền thống tiếng Việt, nhưng không nhằm xác quyết một quan hệ thần học riêng biệt.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Giữ phép lặp tên cùng sự phân biệt giữa nỗi lo bên trong và trạng thái xao động. Không thêm chú thích vì câu dịch không cần đánh dấu phương án từ vựng để hiểu đúng.
