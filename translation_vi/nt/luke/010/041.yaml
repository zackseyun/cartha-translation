  source_fidelity: Bản dịch phản ánh đúng cấu trúc tường thuật ἀποκριθεὶς ... εἶπεν, danh hiệu ὁ κύριος, sự lặp tên gọi, và hai động từ μεριμνᾷς / θορυβάζῃ. Tuy nhiên, đại từ “con” không có trong tiếng Hy Lạp; nó thêm quan hệ xưng hô một chiều mà nguyên văn không xác định.
  naturalness: “Chúa đáp lời bà” có thể hiểu được nhưng “Chúa trả lời bà” tự nhiên hơn trong tiếng Việt hiện đại. Việc người kể gọi Ma-thê là “bà” rồi lời Chúa gọi là “con” cũng tạo chuyển đổi xưng hô không cần thiết.
  terminology: “Chúa,” “Ma-thê,” “lo lắng,” “bối rối,” và “nhiều việc” đều phù hợp với văn phong Kinh Thánh tiếng Việt và ý nghĩa của nguyên ngữ. Giữ “Ma-thê” nhất quán với bản thảo và truyền thống tên riêng Việt ngữ.
  issues:
  - severity: medium
    issue: Thêm đại từ “con” trong lời trực tiếp.
    rationale: Nguyên ngữ chỉ đánh dấu ngôi thứ hai số ít qua động từ μεριμνᾷς và không xác định quan hệ xưng hô. “Con” diễn giải sắc thái quan hệ và không cần thiết để câu tiếng Việt tự nhiên.
  - severity: low
    issue: “đáp lời bà” kém tự nhiên hơn “trả lời bà.”
    rationale: Cả hai đều có thể dịch cụm thành ngữ ἀποκριθεὶς ... εἶπεν, nhưng “trả lời bà” là cách dùng hiện đại, trực tiếp và trôi chảy hơn.
