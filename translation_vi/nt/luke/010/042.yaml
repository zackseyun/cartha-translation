source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: vi
  text: Nhưng chỉ cần ít thứ—hoặc một thứ thôi[a]. Vì Ma-ri đã chọn phần tốt[b], phần ấy sẽ không bị lấy đi khỏi Ma-ri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chỉ một điều là cần thiết.” Trong bối cảnh bữa ăn, câu Hy Lạp còn có thể được hiểu cụ thể hơn là: “chỉ cần ít món—hoặc chỉ một món.”'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “phần lành.” Từ “phần” có thể vừa gợi đến phần ăn, vừa chỉ phần được hưởng nơi điều thực sự quý giá.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων
  choice: ít
  rationale: Dạng sở hữu cách số nhiều đi với χρεία diễn tả một số lượng nhỏ những điều cần thiết. Cách nói “chỉ cần ít thôi” tự nhiên trong tiếng Việt và vẫn để ngỏ khả năng chỉ vài món ăn trong bối cảnh tiếp đãi.
- source_word: χρεία
  choice: cần
  rationale: Cấu trúc ἐστιν χρεία là thành ngữ chỉ sự cần thiết; “cần” là cách diễn đạt hiện đại, gọn và rõ.
- source_word: ἢ ἑνός
  choice: hoặc một điều
  rationale: Cụm từ đối chiếu “ít” với “một”. Thêm “điều” để câu tiếng Việt tự nhiên, còn chú thích giữ lại khả năng hiểu cụ thể là một món ăn.
- source_word: Μαριὰμ
  choice: Ma-ri
  rationale: Dạng phiên âm tên riêng quen thuộc và dễ đọc trong tiếng Việt.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: phần tốt
  rationale: μερίς có nghĩa là phần, phần chia hoặc phần được hưởng. “Phần tốt” phản ánh trực tiếp ἀγαθή, không đổi thành sắc thái so sánh “phần tốt hơn”, đồng thời có thể gợi cả phần ăn lẫn phần thuộc về điều thực sự quý giá.
- source_word: ἐξελέξατο
  choice: đã chọn
  rationale: Động từ aorist trung thể cho thấy sự lựa chọn có chủ ý của chính Ma-ri; “đã chọn” diễn đạt tự nhiên hành động đã xảy ra.
- source_word: ἥτις
  choice: là phần
  rationale: Đại từ quan hệ quy về “phần tốt” và nêu đặc tính của phần ấy. Lặp lại “phần” giúp tiếng Việt rõ chủ thể của mệnh đề quan hệ.
- source_word: οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: sẽ không bị lấy khỏi cô
  rationale: Giữ nghĩa tương lai bị động của ἀφαιρέω và ý rằng phần ấy sẽ không bị tước khỏi Ma-ri.
theological_decisions:
- issue: Cách hiểu “chỉ cần ít thôi—hoặc một điều” trong mối liên hệ giữa việc phục vụ của Ma-thê và lựa chọn của Ma-ri
  choice: Giữ lời tuyên bố về điều cần thiết mà không xác định đó là ít món ăn, một món ăn hay một điều thiết yếu.
  alternative: Dịch dứt khoát là “chỉ một điều là cần thiết” hoặc “chỉ cần vài món, thậm chí một món”.
  rationale: Câu Hy Lạp có thể vừa liên hệ thực tế đến việc chuẩn bị bữa ăn, vừa hướng đến một sự tương phản sâu hơn về điều thật sự cần thiết. Bản dịch và chú thích bảo tồn sự căng mở này thay vì quyết định thay cho người đọc.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Câu văn giữ nhịp ngắn của nguyên bản; “cô” dùng để quy chiếu tự nhiên đến Ma-ri mà không thêm tước hiệu hay sắc thái giáo phái.
