  rationale: Bản sửa chỉ làm rõ cấu trúc song hành của câu khó trong tiếng Hy Lạp và cải thiện cách diễn đạt tiếng Việt. Không quyết định liệu ‘ít thứ—hoặc một thứ’ là số món ăn hay một điều thiết yếu; chú thích bảo lưu cả hai khả năng. Các ý nghĩa then chốt khác được giữ nguyên.
