  to: Hãy đi! Này, Ta sai anh em đi như chiên con giữa bầy sói.
  rationale: 'Đổi “các con” thành “anh em” để không thêm quan hệ cha-con vào đại từ số nhiều của bản Hy Lạp. Các yếu tố còn lại đều chuyển đạt trung thành và tự nhiên: “Này” cho ἰδοὺ, “sai ... đi” cho ἀποστέλλω, “chiên con” cho ἄρνας, và “giữa bầy sói” cho ἐν μέσῳ λύκων. Không cần chú thích vì không có dị bản hoặc mơ hồ văn bản cần neo chú thích trong câu này.'
