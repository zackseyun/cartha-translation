  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: vi
  text: Hãy đi! Này, Ta sai anh em đi như chiên con giữa bầy sói.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: Hãy đi
  rationale: Mệnh lệnh ngôi thứ hai số nhiều; “Hãy đi” ngắn gọn, tự nhiên và giữ nguyên sức mạnh của lời sai phái.
- source_word: ἰδοὺ
  choice: Này
  rationale: Tiểu từ thu hút sự chú ý đến lời theo sau; “Này” trang trọng vừa phải và tự nhiên hơn cách diễn đạt cổ kính.
- source_word: ἀποστέλλω ὑμᾶς
  choice: Ta sai các con đi
  rationale: Động từ hiện tại diễn tả hành động sai phái đang được tuyên bố. “Sai … đi” giữ sắc thái sứ vụ mà không thêm ý niệm mang tính kỹ thuật.
- source_word: ὡς
  choice: như
  rationale: Đánh dấu phép so sánh, không phải sự đồng nhất.
- source_word: ἄρνας
  choice: những chiên con
  rationale: Danh từ chỉ chiên con, nhấn mạnh sự non yếu và dễ bị tổn thương; không khái quát thành “chiên”.
- source_word: ἐν μέσῳ λύκων
  choice: ở giữa bầy sói
  rationale: Giữ khá sát hình ảnh bị bao quanh giữa những con sói, đồng thời “bầy sói” là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Hình ảnh ẩn dụ về tình thế của các môn đồ khi được sai đi
  choice: Giữ nguyên phép so sánh “như những chiên con ở giữa bầy sói”
  alternative: như chiên ở giữa bầy sói
  rationale: Bản Hy Lạp dùng ἄρνας, nghĩa cụ thể là “chiên con”, chứ không phải từ chung chỉ chiên. Cách dịch này bảo toàn sắc thái dễ bị tổn thương và không hòa đồng câu này với các lời tương tự ở nơi khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” để thể hiện lời Đức Giê-su nói với nhóm môn đồ; số nhiều của ὑμᾶς được làm rõ bằng “các con”. Không dùng từ quá cổ như “kìa” hoặc thuật ngữ giáo hội mang tính diễn giải.
