  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của câu Hy Lạp: sắc thái đối lập của δέ (“Nhưng”), nhân vật bất định “một người Sa-ma-ri,” hành trình đang diễn ra, việc ông đến chỗ nạn nhân, trình tự thấy rồi xúc động, và ý nghĩa mạnh của ἐσπλαγχνίσθη.'
