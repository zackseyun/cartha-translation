  terminology: “Người Sa-ma-ri” là thuật ngữ Kinh Thánh quen dùng và chính xác cho Σαμαρίτης. “Động lòng thương xót” diễn đạt tốt lòng trắc ẩn sâu xa của ἐσπλαγχνίσθη mà không thêm diễn giải thần học.
