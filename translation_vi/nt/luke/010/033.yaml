  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: vi
  text: Nhưng có một người Sa-ma-ri đang đi đường, đến chỗ người ấy; khi thấy người ấy, ông động lòng thương xót.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαμαρίτης
  choice: một người Sa-ma-ri
  rationale: Cách gọi quen thuộc trong tiếng Việt, giữ rõ căn tính dân tộc-tôn giáo và sức tương phản trong câu chuyện.
- source_word: δέ
  choice: Nhưng
  rationale: Làm nổi bật sự tương phản giữa người Sa-ma-ri với thầy tế lễ và người Lê-vi ở các câu trước.
- source_word: τις
  choice: một
  rationale: Diễn đạt tự nhiên tính bất định của đại từ Hy Lạp, không cần dùng cách nói nặng nề như “một người nọ”.
- source_word: ὁδεύων
  choice: đang đi đường
  rationale: Giữ sắc thái hành động đang diễn ra của phân từ hiện tại và phù hợp văn kể chuyện tiếng Việt.
- source_word: ἦλθεν κατ’ αὐτόν
  choice: đến chỗ người ấy
  rationale: Diễn đạt tự nhiên ý chuyển động đến nơi nạn nhân đang nằm, tránh nghĩa dễ gây hiểu lầm của lối dịch quá sát như “đến trên người ấy”.
- source_word: ἰδών
  choice: khi thấy người ấy
  rationale: Thể hiện tự nhiên quan hệ thời gian của phân từ bất định trước động từ chính.
- source_word: ἐσπλαγχνίσθη
  choice: ông động lòng thương xót
  rationale: Truyền đạt lòng trắc ẩn sâu xa, mãnh liệt của động từ Hy Lạp bằng một cách nói trang trọng nhưng quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Diễn đạt phản ứng đầy lòng trắc ẩn của người Sa-ma-ri mà không thêm cách giải thích thần học về sau
  choice: ông động lòng thương xót
  alternative: ông thương xót người ấy
  rationale: Cách dịch giữ sức nặng cảm xúc nội tại của động từ Hy Lạp nhưng không mở rộng thành lời bình giải về ân điển, lòng nhân từ hay tình yêu người lân cận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” cho nạn nhân và “ông” cho người Sa-ma-ri để hạn chế sự mơ hồ về đại từ trong tiếng Việt; dấu chấm phẩy giúp tách việc ông đến nơi khỏi phản ứng khi nhìn thấy nạn nhân.
