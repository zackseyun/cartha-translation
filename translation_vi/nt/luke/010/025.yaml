  terminology: Đổi νομικός thành “người thông luật” là cách gọi tiếng Việt Kinh Thánh tự nhiên, trung tính về chức danh, và phù hợp với nghĩa một chuyên gia về Luật Mô-se. Giữ “Thưa Thầy,” “sự sống đời đời,” và “thừa hưởng” là phù hợp.
  issues:
