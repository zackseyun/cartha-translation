  to: 'Kìa, có một người thông luật[a] đứng dậy để thử Ngài và nói: “Thưa Thầy, tôi phải làm gì để thừa hưởng sự sống đời đời?”'
  rationale: Chỉ thay cách gọi “chuyên gia Luật pháp” bằng “người thông luật” để câu tự nhiên hơn trong tiếng Việt chuẩn hiện đại. Những thành phần khác của bản nháp giữ đúng nghĩa và sắc thái của nguyên văn Hy Lạp, nên được bảo lưu.
  reviewer_model: gpt-5.6-terra
