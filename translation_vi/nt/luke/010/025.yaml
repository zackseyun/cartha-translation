id: LUK.10.25
reference: Luke 10:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: vi
  text: 'Kìa, có một người thông luật[a] đứng dậy để thử Ngài và nói: “Thưa Thầy, tôi phải làm gì để thừa hưởng sự sống đời đời?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là một người thông thạo Luật Mô-se.
    reason: Làm rõ rằng “người thông luật” là chuyên gia về luật tôn giáo Do Thái, không phải luật sư dân sự theo nghĩa hiện đại.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sinh động của ἰδού; liên từ καί được diễn đạt tự nhiên trong mạch kể thay vì dịch máy móc thành “và”.
- source_word: νομικός τις
  choice: có một chuyên gia Luật pháp
  rationale: νομικός ở đây chỉ người am hiểu Luật Mô-se, không phải luật sư dân sự theo nghĩa hiện đại. “Chuyên gia Luật pháp” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀνέστη
  choice: đứng dậy
  rationale: Diễn đạt trực tiếp hành động trong bối cảnh tường thuật.
- source_word: ἐκπειράζων αὐτὸν
  choice: để thử Ngài
  rationale: Giữ ý người ấy đặt Chúa Giê-su vào một cuộc thử nghiệm hay thăm dò; tránh “cám dỗ”, vốn dễ bị hiểu quá hẹp là dụ phạm tội.
- source_word: λέγων
  choice: và nói
  rationale: Chuyển cấu trúc phân từ Hy Lạp sang một động từ phối hợp tự nhiên trong tiếng Việt.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: “Thầy” là cách xưng hô tự nhiên với một người dạy dỗ; “thưa” thể hiện hô cách và sắc thái kính trọng.
- source_word: τί ποιήσας
  choice: tôi phải làm gì
  rationale: Diễn đạt tự nhiên quan hệ phương tiện hoặc điều kiện hàm chứa trong phân từ đi cùng động từ tương lai, nhưng không giải thích thêm quan niệm thần học của người hỏi.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Cách diễn đạt chuẩn, rõ ràng và giữ cả ý nghĩa sự sống lẫn tính vĩnh cửu.
- source_word: κληρονομήσω
  choice: thừa hưởng
  rationale: Giữ nguyên hình ảnh thừa kế trong động từ Hy Lạp thay vì làm phẳng thành “nhận được” hay “có được”.
theological_decisions:
- issue: Nghĩa của νομικός trong bối cảnh Do Thái thời Đền Thờ thứ hai
  choice: chuyên gia Luật pháp, tức người chuyên về Luật Mô-se
  alternative: luật sư; thầy thông luật
  rationale: Lựa chọn này tránh khiến độc giả nghĩ đến luật sư thế tục hiện đại, đồng thời không gán cho nhân vật một chức danh giáo phái cụ thể.
- issue: Sắc thái của τί ποιήσας ... κληρονομήσω
  choice: tôi phải làm gì để thừa hưởng sự sống đời đời?
  alternative: tôi làm gì thì sẽ thừa hưởng sự sống đời đời?
  rationale: Bản dịch giữ cách đặt vấn đề của người hỏi xoay quanh điều mình phải làm, nhưng không tự giải quyết sự căng thẳng thần học giữa hành động và hình ảnh thừa hưởng.
- issue: Sắc thái của ἐκπειράζων
  choice: để thử Ngài
  alternative: để thử thách Ngài; để cám dỗ Ngài
  rationale: “Thử” giữ được khả năng về ý định thăm dò hoặc đối đầu mà không khẳng định quá mức rằng người ấy đang dụ Chúa Giê-su phạm tội.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Kìa” được giữ để bảo toàn dấu hiệu thu hút sự chú ý của nguyên văn; “Thưa Thầy” tạo lời thoại tự nhiên và kính trọng. Đại từ “Ngài” phù hợp với văn phong Kinh Thánh trang trọng trong câu độc lập này.
