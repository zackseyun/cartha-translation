source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: vi
  text: 'Rồi Ngài quay sang các môn đồ và nói riêng với họ[a]: “Phước cho những mắt đang thấy điều anh em đang thấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cách riêng” hoặc “riêng tư.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: quay sang
  rationale: Diễn đạt tự nhiên hành động Đức Chúa Jêsus hướng về phía các môn đồ trước khi nói, đồng thời giữ sự liên kết của phân từ với động từ chính.
- source_word: μαθητάς
  choice: các môn đồ
  rationale: Cách gọi quen thuộc trong tiếng Việt Kinh Thánh, giữ được quan hệ học hỏi và đi theo thầy.
- source_word: κατ’ ἰδίαν
  choice: nói riêng với họ
  rationale: Thành ngữ Hy Lạp chỉ việc nói cách riêng, không nhằm cho đám đông cùng nghe; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Giữ sắc thái của lời tuyên bố phước lành, mạnh hơn ý niệm chủ quan đơn thuần là vui hay hạnh phúc.
- source_word: οἱ ὀφθαλμοὶ οἱ βλέποντες
  choice: những đôi mắt thấy
  rationale: Giữ hình ảnh hoán dụ cụ thể của nguyên văn thay vì giải nghĩa thành những người nhìn thấy.
- source_word: ἃ βλέπετε
  choice: điều các con đang thấy
  rationale: Truyền đạt trực tiếp đại từ quan hệ và thể hiện sắc thái hiện tại của βλέπετε bằng “đang thấy”.
theological_decisions:
- issue: Sức nặng của lời tuyên phước
  choice: “Phước cho” diễn tả lời tuyên bố rằng các môn đồ được ưu ái vì thấy điều đang được bày tỏ trước họ.
  alternative: Hiểu đây chỉ là lời nói rằng họ cảm thấy vui hoặc may mắn.
  rationale: μακάριοι trong cấu trúc này mang sắc thái tuyên phước; bản dịch giữ sức nặng ấy nhưng không thêm lời giải thích về chính xác những điều họ thấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” và “các con” phù hợp lời kể và lời Đức Chúa Jêsus nói với môn đồ; giữ hình ảnh “những đôi mắt” của nguyên văn.
