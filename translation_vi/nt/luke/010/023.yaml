revisions:
- from: 'Rồi Ngài quay sang các môn đồ và nói riêng với họ[a]: “Phước cho những đôi mắt thấy điều các con đang thấy.”'
  to: 'Rồi Ngài quay sang các môn đồ và nói riêng với họ[a]: “Phước cho những mắt đang thấy điều anh em đang thấy.”'
  rationale: Sửa đại từ xưng hô để không thêm sắc thái cha–con ngoài nguyên văn, điều chỉnh cách diễn đạt của cụm chỉ việc nói riêng cho tự nhiên, và giữ hình ảnh hoán dụ “mắt” cùng sắc thái hiện tại của βλέποντες/βλέπετε bằng “đang thấy.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: hành động quay sang, việc nói cách riêng với các môn đồ, lời tuyên phước, và hình ảnh “mắt” đang thấy điều các môn đồ thấy. Tuy nhiên, “các con” là một lựa chọn xưng hô diễn giải hơn cần thiết cho ngôi thứ hai số nhiều của nguyên văn; “anh em” là cách xưng hô hiện đại và trung tính hơn trong ngữ cảnh này.'
  naturalness: “Nói riêng với họ” tự nhiên hơn khi đặt sau động từ nói, nhưng chú thích hiện có “trong chỗ riêng tư” không tự nhiên trong tiếng Việt hiện đại. Cấu trúc “Phước cho những đôi mắt thấy...” có thể hiểu được, song “Phước cho những mắt đang thấy...” giữ hoán dụ của nguyên văn mà mạch lạc hơn.
  terminology: Giữ “môn đồ,” “Ngài,” và “phước” là chấp nhận được trong văn phong Kinh Thánh trang trọng. Không cần thêm diễn giải về đối tượng của điều các môn đồ thấy.
  issues:
  - severity: low
    issue: Đại từ “các con”
    rationale: Nguyên văn chỉ dùng ngôi thứ hai số nhiều (βλέπετε), không xác định cách xưng hô mang sắc thái cha–con. “Anh em” tránh thêm sắc thái quan hệ không được nêu rõ và phù hợp tiếng Việt hiện đại.
  - severity: low
    issue: Cách diễn đạt của chú thích
    rationale: “Nói với họ trong chỗ riêng tư” gượng và thêm ý địa điểm. κατ’ ἰδίαν có thể dịch tự nhiên là “cách riêng” hoặc “riêng tư.”
  revised_text: 'Rồi Ngài quay sang các môn đồ và nói riêng với họ[a]: “Phước cho những mắt đang thấy điều anh em đang thấy.”'
  revised_footnotes:
