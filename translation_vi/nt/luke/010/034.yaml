id: LUK.10.34
reference: Luke 10:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: vi
  text: Ông đến gần, băng bó các vết thương của người ấy[a], đổ dầu và rượu lên đó. Rồi ông đặt người ấy lên con vật của mình[b], đưa đến một quán trọ và chăm sóc người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “buộc kín các vết thương”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “con vật” chỉ một con vật dùng để cưỡi hoặc chở đồ.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Diễn đạt tự nhiên hành động tiến đến gần người bị nạn, đồng thời giữ quan hệ thời gian của phân từ bất định với động từ chính.
- source_word: κατέδησεν
  choice: băng bó
  rationale: Động từ chỉ việc buộc hoặc băng kín vết thương; “băng bó” là cách nói hiện đại, rõ nghĩa và phù hợp ngữ cảnh cứu chữa.
- source_word: τραύματα
  choice: các vết thương
  rationale: Tương đương trực tiếp, phù hợp với thương tích do vụ hành hung bên đường.
- source_word: ἐπιχέων
  choice: đổ ... lên đó
  rationale: Giữ hình ảnh cụ thể của việc đổ chất lỏng lên các vết thương và diễn đạt phân từ chỉ cách thức đi kèm hành động băng bó.
- source_word: ἔλαιον
  choice: dầu
  rationale: Giữ tương ứng từ vựng sát với nguyên văn; trong bối cảnh cổ đại rất có thể là dầu ô-liu, nhưng không cần xác định thêm trong câu chính.
- source_word: οἶνον
  choice: rượu
  rationale: Tương đương trực tiếp; không đưa công dụng y học được suy đoán vào bản văn.
- source_word: ἐπιβιβάσας
  choice: đặt người ấy lên
  rationale: Diễn đạt tự nhiên hành động nâng hoặc đặt người bị thương lên con vật.
- source_word: τὸ ἴδιον κτῆνος
  choice: con vật của mình
  rationale: “Của mình” giữ sắc thái nhấn mạnh quyền sở hữu của ἴδιον; “con vật” không xác định quá mức loại gia súc dùng để cưỡi hoặc chở đồ.
- source_word: πανδοχεῖον
  choice: quán trọ
  rationale: Cách gọi thông dụng cho nơi đón khách đi đường nghỉ lại.
- source_word: ἐπεμελήθη
  choice: chăm sóc
  rationale: Truyền đạt sự quan tâm và chăm nom trực tiếp, cá nhân của người Sa-ma-ri.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Các hành động được trình bày theo đúng trình tự của nguyên văn. Dấu chú thích [a] được đặt sau cụm tương ứng với κατέδησεν, và [b] sau κτῆνος, để mỗi chú thích gắn đúng với từ ngữ mà nó giải thích.
