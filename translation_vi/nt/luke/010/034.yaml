  source_fidelity: 'Bản dịch truyền đạt đầy đủ chuỗi hành động của nguyên văn: đến gần, băng bó các vết thương trong khi đổ dầu và rượu lên chúng, đặt người bị thương lên con vật của mình, đưa đến quán trọ, rồi chăm sóc. “Con vật của mình” bảo toàn sắc thái sở hữu được nhấn mạnh trong τὸ ἴδιον κτῆνος mà không xác định quá mức loài vật.'
