revisions:
- from: 'Nhưng Ma-thê bị phân tâm vì phải lo nhiều việc phục vụ. Bà đến gần và thưa: “Lạy Chúa, Ngài không bận tâm sao[a] khi em gái con để con một mình phục vụ? Vậy xin Ngài bảo em ấy cùng giúp con.”'
  to: 'Nhưng Ma-thê bị cuốn vào nhiều việc phục vụ. Bà đến gần và thưa: “Lạy Chúa, Ngài không bận tâm sao[a] khi chị/em gái con để con một mình phục vụ? Vậy xin Ngài bảo chị/em ấy cùng giúp con.”'
  rationale: Sửa bản dịch để không ấn định thứ bậc tuổi tác giữa Ma-thê và Ma-ri, vốn không có trong tiếng Hy Lạp. Đồng thời thay cách diễn đạt đầu câu để phản ánh rõ hơn tình trạng Ma-thê bị nhiều việc phục vụ cuốn sự chú ý đi. Các yếu tố còn lại, gồm tước hiệu “Lạy Chúa,” lời than phiền, sức suy luận của “Vậy,” và ý cùng gánh vác trong “cùng giúp con,” được giữ lại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung phản ánh đúng diễn tiến và sắc thái của nguyên văn: Ma-thê đang bị nhiều việc phục vụ cuốn đi, đến gần, than phiền với Chúa, rồi xin Ngài bảo chị/em mình giúp. Tuy nhiên, “em gái con” xác định Ma-ri là em của Ma-thê, trong khi ἀδελφή chỉ cho biết là chị/em gái, không cho biết thứ bậc tuổi tác.'
  naturalness: Văn phong hiện đại, trang trọng và lời xưng “Lạy Chúa ... con” nhất quán. “Bị cuốn vào nhiều việc phục vụ” tự nhiên hơn “bị phân tâm vì phải lo nhiều việc phục vụ” và sát hơn với ý bị những việc ấy kéo sự chú ý đi.
  terminology: “Lạy Chúa” là cách chuyển ngữ phù hợp cho Κύριε. “Việc phục vụ” diễn tả διακονία trong bối cảnh gia đình mà không áp đặt nghĩa chức vụ tôn giáo. “Chị/em gái” giữ đúng sự không xác định của ἀδελφή.
  issues:
  - severity: medium
    issue: “em gái con” thêm thông tin về thứ bậc giữa Ma-thê và Ma-ri.
    rationale: Nguyên văn ἡ ἀδελφή μου chỉ nói “chị/em gái của con tôi”; không có dữ liệu để xác định Ma-ri là em hay chị. Bản dịch cần giữ sự mơ hồ này.
  - severity: low
    issue: “vì phải lo nhiều việc phục vụ” thêm nhẹ ý bắt buộc và diễn đạt nguyên nhân kém trực tiếp.
    rationale: περιεσπᾶτο περὶ πολλὴν διακονίαν nói Ma-thê bị cuốn/distracted bởi nhiều việc phục vụ. “Bị cuốn vào nhiều việc phục vụ” sát cấu trúc và tự nhiên hơn.
  revised_text: 'Nhưng Ma-thê bị cuốn vào nhiều việc phục vụ. Bà đến gần và thưa: “Lạy Chúa, Ngài không bận tâm sao[a] khi chị/em gái con để con một mình phục vụ? Vậy xin Ngài bảo chị/em ấy cùng giúp con.”'
