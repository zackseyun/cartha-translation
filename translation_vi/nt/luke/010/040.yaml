language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: vi
  text: 'Nhưng Ma-thê bị cuốn vào nhiều việc phục vụ. Bà đến gần và thưa: “Lạy Chúa, Ngài không bận tâm sao[a] khi chị/em gái con để con một mình phục vụ? Vậy xin Ngài bảo chị/em ấy cùng giúp con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ngài không quan tâm sao”.'
    reason: Giữ một cách diễn đạt tự nhiên khác của thành ngữ οὐ μέλει σοι; “quan tâm” trực tiếp hơn, còn “bận tâm” phù hợp với giọng trách nhẹ trong câu chính.
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: bị phân tâm
  rationale: Dạng vị hoàn trung động/thụ động diễn tả tình trạng đang tiếp diễn, như bị nhiều việc kéo sự chú ý đi. “Bị phân tâm” tự nhiên và giữ được sự tương phản với việc Ma-ri chú tâm lắng nghe.
- source_word: περὶ πολλὴν διακονίαν
  choice: vì phải lo nhiều việc phục vụ
  rationale: Trong bối cảnh gia đình, διακονία chỉ sự phục vụ thực tế, không nhất thiết là chức vụ hay công tác tôn giáo. Cách dịch này rõ nghĩa nhưng không thu hẹp thành riêng việc chuẩn bị thức ăn.
- source_word: ἐπιστᾶσα
  choice: đến gần
  rationale: Phân từ này diễn tả việc Ma-thê tiến đến hoặc đứng lại bên Chúa Giê-su trước khi lên tiếng.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy Chúa” là cách xưng hô trực tiếp trang trọng, tự nhiên trong tiếng Việt và giữ được tước hiệu κύριος dành cho Chúa Giê-su.
- source_word: οὐ μέλει σοι
  choice: Ngài không bận tâm sao
  rationale: Thành ngữ này hỏi một việc có đáng để người nghe quan tâm hay không. “Không bận tâm sao” giữ giọng than phiền trực tiếp của Ma-thê mà không làm sắc thái nặng hơn nguyên văn.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: để con một mình phục vụ
  rationale: Cách dịch giữ cả ý “một mình” và động từ nguyên mẫu “phục vụ”; tránh “bỏ mặc,” vốn có thể làm lời trách mạnh hơn từ Hy Lạp trong ngữ cảnh này.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Vậy xin Ngài bảo em ấy
  rationale: “Vậy” giữ sức suy luận của οὖν. “Xin Ngài bảo” truyền đạt mệnh lệnh Ma-thê nói với Chúa Giê-su nhưng phù hợp lối xưng hô tiếng Việt.
- source_word: συναντιλάβηται
  choice: cùng giúp con
  rationale: Động từ diễn tả việc tham gia gánh vác và giúp đỡ với một người khác. “Cùng giúp con” giữ sắc thái cộng tác rõ hơn chỉ nói “giúp con.”
theological_decisions:
- issue: Cách dịch κύριος khi Ma-thê xưng hô với Chúa Giê-su
  choice: Lạy Chúa
  alternative: Thưa Thầy
  rationale: “Lạy Chúa” giữ cách gọi κύριος và phù hợp với cách Lu-ca dùng tước hiệu này cho Chúa Giê-su, trong khi nguyên văn không buộc phải thu hẹp nghĩa thành “Thầy.”
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Ma-thê tự xưng “con” và gọi Chúa Giê-su là “Ngài,” phù hợp lời thưa trực tiếp “Lạy Chúa.” Câu dịch giữ sự căng thẳng trong lời phàn nàn của Ma-thê mà không thêm phán xét về động cơ của bà.
