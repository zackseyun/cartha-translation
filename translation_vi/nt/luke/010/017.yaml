revisions:
- from: 'Bảy mươi hai người trở về, vui mừng[a] nói: “Lạy Chúa, ngay cả các quỷ cũng khuất phục chúng con nhân danh Ngài.”'
  to: 'Bảy mươi hai người[a] trở về trong niềm vui, nói: “Lạy Chúa, ngay cả các quỷ cũng phục tùng chúng con nhân danh Ngài.”'
  rationale: Chỉnh sửa chỉ nhằm làm rõ hướng nghĩa của động từ “phục tùng”, cải thiện liên kết cú pháp của “trong niềm vui”, và đặt lại neo chú thích cho đúng đơn vị có dị bản. Không thay đổi ý nghĩa hoặc thêm diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo đúng bản văn SBLGNT: số người là bảy mươi hai, việc họ trở về với niềm vui, lời hô cách với Chúa, sắc thái tăng tiến của καί, các quỷ phục tùng họ, và cụm thành ngữ “nhân danh Ngài” đều được giữ lại. Tuy nhiên, “các quỷ cũng khuất phục chúng con” có thể được hiểu theo chiều ngược là các quỷ khuất phục/đánh bại các môn đồ, trong khi ὑποτάσσεται ἡμῖν nghĩa là các quỷ phục tùng họ.'
  naturalness: Cần đặt chú thích ngay sau “bảy mươi hai”, là từ ngữ mà chú thích giải thích, thay vì sau “vui mừng”. “Trở về trong niềm vui, nói” phân định rõ trạng ngữ của việc trở về và phân từ dẫn lời nói. “Phục tùng chúng con” tự nhiên và không mơ hồ hơn “khuất phục chúng con”.
  terminology: “Lạy Chúa”, “các quỷ”, “chúng con”, và “nhân danh Ngài” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại, trang trọng. “Nhân danh Ngài” bảo toàn thành ngữ ἐν τῷ ὀνόματί σου mà không thu hẹp ý nghĩa của nó.
  issues:
  - severity: medium
    issue: Cụm “các quỷ cũng khuất phục chúng con” có quan hệ chủ-thể/đối-thể dễ bị hiểu ngược.
    rationale: Trong tiếng Việt hiện đại, “A khuất phục B” thường nghĩa là A chinh phục hoặc chế ngự B. Nguyên văn nói các quỷ ở trong tình trạng phục tùng các môn đồ. “Các quỷ cũng phục tùng chúng con” diễn đạt rõ quan hệ này.
  - severity: low
    issue: Ký hiệu chú thích [a] hiện đặt sau “vui mừng” thay vì sau “Bảy mươi hai”.
    rationale: Nội dung chú thích là dị bản của αριθμός “bảy mươi hai/bảy mươi”; neo chú thích cần gắn với chính cụm này để người đọc không hiểu nhầm chú thích liên quan đến niềm vui.
  revised_text: 'Bảy mươi hai người[a] trở về trong niềm vui, nói: “Lạy Chúa, ngay cả các quỷ cũng phục tùng chúng con nhân danh Ngài.”'
