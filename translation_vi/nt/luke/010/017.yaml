language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: vi
  text: 'Bảy mươi hai người[a] trở về trong niềm vui, nói: “Lạy Chúa, ngay cả các quỷ cũng phục tùng chúng con nhân danh Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “bảy mươi người” thay vì “bảy mươi hai người.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν δὲ
  choice: trở về
  rationale: Động từ aorist diễn tả việc họ trở lại sau sứ mạng; δέ đánh dấu bước tiếp theo của câu chuyện và không cần dịch thành một từ riêng trong tiếng Việt.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: Bảy mươi hai người
  rationale: Theo bản văn SBLGNT là “bảy mươi hai”; thêm “người” để câu tiếng Việt tự nhiên.
- source_word: μετὰ χαρᾶς
  choice: vui mừng
  rationale: Diễn đạt tự nhiên trạng thái đầy vui mừng khi họ trở về, không thêm nguyên nhân.
- source_word: λέγοντες
  choice: nói
  rationale: Phân từ hiện tại nối việc trở về với lời họ thưa; “nói” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Dạng hô cách trực tiếp thưa với Chúa Giê-su; “Lạy” thể hiện đúng chức năng xưng hô trang trọng.
- source_word: καὶ
  choice: ngay cả
  rationale: Trong lời cảm thán này, καί có nghĩa tăng tiến, nhấn mạnh sự kinh ngạc rằng đến cả các quỷ cũng phục tùng.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Chỉ các hữu thể thuộc linh thù nghịch; cách dịch trực tiếp, quen thuộc và không diễn giải thành “tà linh”.
- source_word: ὑποτάσσεται ἡμῖν
  choice: khuất phục chúng con
  rationale: Diễn tả sự phục tùng quyền hành của những người được sai đi; “chúng con” phù hợp khi họ thưa trực tiếp với Chúa.
- source_word: ἐν τῷ ὀνόματί σου
  choice: nhân danh Ngài
  rationale: Thành ngữ nói đến việc hành động dựa trên danh và thẩm quyền của Chúa Giê-su; “nhân danh” là cách nói tự nhiên, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Dị bản về số người được sai đi
  choice: bảy mươi hai
  alternative: bảy mươi
  rationale: Bản văn SBLGNT được cung cấp đọc là “bảy mươi hai”, còn dị bản quan trọng “bảy mươi” được giữ trong chú thích để không che khuất chứng cứ thủ bản.
- issue: Ý nghĩa của “nhân danh Ngài”
  choice: Giữ cách diễn đạt về danh và thẩm quyền mà không giải thích thêm trong chính văn
  alternative: bởi quyền năng của Ngài
  rationale: Nguyên văn có ἐν τῷ ὀνόματί σου; dịch sát thành ngữ giúp bảo toàn chiều rộng thần học thay vì thu hẹp nó chỉ còn quyền năng hay một cơ chế cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Lạy Chúa” cho lời thưa trực tiếp, “chúng con” theo quan hệ người môn đồ thưa với Chúa, và “Ngài” làm đại từ kính trọng. Dấu chú thích [a] được đặt sau cụm nói về sự trở về vui mừng, theo vị trí tham chiếu đã cung cấp, dù nội dung chú thích liên quan đến con số ở đầu câu.
