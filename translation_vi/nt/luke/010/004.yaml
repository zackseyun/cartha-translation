id: LUK.10.4
reference: Luke 10:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: vi
  text: Đừng mang theo túi tiền, túi đi đường[a] hay dép; cũng đừng chào hỏi bất cứ ai dọc đường.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Túi đi đường” cũng có thể dịch là “túi hành trang” hoặc đơn giản là “túi.”
    reason: lexical_alternative
  - marker: b
    text: 'Mệnh lệnh này có lẽ không cấm phép lịch sự thông thường, nhưng nhấn mạnh tính khẩn cấp của sứ mạng: họ không được dừng lại vì những nghi thức chào hỏi có thể kéo dài theo phong tục thời ấy.'
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: mang theo
  rationale: Trong lời chỉ dẫn dành cho người lên đường, βαστάζω chỉ việc mang hoặc đem theo vật dụng; “mang theo” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: βαλλάντιον
  choice: túi tiền
  rationale: Từ này chỉ một chiếc túi dùng để đựng tiền; “túi tiền” vừa sát nghĩa vừa dễ hiểu.
- source_word: πήραν
  choice: túi đi đường
  rationale: πήρα là túi đựng lương thực hoặc vật dụng khi đi đường. “Túi đi đường” diễn đạt chức năng ấy mà không áp đặt một kiểu túi hiện đại cụ thể.
- source_word: ὑποδήματα
  choice: dép
  rationale: ὑπόδημα chỉ vật mang ở chân, trong bối cảnh Địa Trung Hải cổ thường là dép; “dép” phù hợp với bối cảnh lịch sử và cách dùng quen thuộc trong các sách Phúc Âm.
- source_word: μηδένα
  choice: bất cứ ai
  rationale: Trong câu phủ định, μηδένα có nghĩa là không một ai; cấu trúc “đừng… bất cứ ai” tự nhiên trong tiếng Việt và giữ trọn phạm vi phủ định.
- source_word: κατὰ τὴν ὁδόν
  choice: dọc đường
  rationale: Cụm từ nói đến quãng đường đang đi; “dọc đường” giữ hình ảnh cụ thể và tự nhiên hơn một lối diễn đạt trừu tượng.
- source_word: ἀσπάσησθε
  choice: chào hỏi
  rationale: ἀσπάζομαι ở đây chỉ việc chào đón hoặc trao lời chào. “Chào hỏi” phù hợp với bối cảnh giao tiếp xã hội và không giới hạn hành động vào một cử chỉ như ôm.
theological_decisions:
- issue: Mức độ trực tiếp của lệnh không chào hỏi người khác khi đi đường
  choice: 'Giữ nguyên mệnh lệnh trực tiếp: “đừng chào hỏi bất cứ ai dọc đường.”'
  alternative: Diễn giải thành “đừng để những cuộc chào hỏi dọc đường làm chậm trễ.”
  rationale: Bản Hy Lạp dùng một mệnh lệnh phủ định trực tiếp. Bản dịch không làm nhẹ lời ấy trong chính văn; khả năng câu này nhấn mạnh tính khẩn cấp và tránh những nghi thức chào hỏi kéo dài được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song song “đừng…; cũng đừng…” giữ nhịp của các mệnh lệnh Hy Lạp. Dấu chú thích được đặt ngay sau cụm từ mà mỗi chú thích giải thích.
