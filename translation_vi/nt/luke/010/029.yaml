  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: vi
  text: 'Nhưng người ấy, muốn tự biện minh, nói với Giê-su: “Vậy ai là người lân cận của tôi?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ai được kể là người lân cận của tôi?”'
    reason: Biến thể này làm rõ hàm ý về phạm vi những người được xem là “người lân cận”, trong khi chính văn giữ nguyên hình thức trực tiếp và hàm súc của câu hỏi Hy Lạp.
lexical_decisions:
- source_word: θέλων
  choice: vì muốn
  rationale: Phân từ hiện tại diễn tả động cơ của người ấy; “vì muốn” thể hiện rõ quan hệ động cơ trong tiếng Việt mà không làm thay đổi ý câu.
- source_word: δικαιῶσαι ἑαυτὸν
  choice: tự biện minh
  rationale: Trong văn cảnh tranh luận về luật pháp và đạo đức, cụm từ chỉ việc người ấy tìm cách chứng tỏ mình có lý, chứ không nhất thiết mang nghĩa chuyên môn về sự xưng công chính.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: nói với Giê-su
  rationale: Cách diễn đạt trực tiếp, tự nhiên, bám sát công thức dẫn lời trong nguyên văn và không thêm một tước hiệu không có tại đây.
- source_word: Καὶ
  choice: Vậy
  rationale: Trong câu hỏi tiếp nối, “Vậy” truyền đạt tự nhiên chức năng liên kết và suy luận của καί trong hội thoại tiếng Việt.
- source_word: τίς ἐστίν μου πλησίον
  choice: ai là người lân cận của tôi
  rationale: “Người lân cận” giữ mối liên hệ với lời trích dẫn luật Torah trong văn cảnh và bảo toàn dạng trực tiếp của câu hỏi; cách hiểu “ai được kể là” được ghi ở chú thích như một khả năng diễn đạt rõ hàm ý.
theological_decisions:
- issue: Ý nghĩa của δικαιῶσαι ἑαυτόν
  choice: Diễn tả nỗ lực tự biện minh, tức chứng tỏ mình có lý.
  alternative: Chứng tỏ mình là người công chính, hoặc tự bênh vực mình trước những người hiện diện.
  rationale: Văn cảnh trực tiếp là một cuộc trao đổi về luật pháp và đạo đức. “Tự biện minh” giữ được sắc thái tự bênh vực và sự mỉa mai trong trình thuật, đồng thời tránh áp đặt nghĩa thần học chuyên môn về sự xưng công chính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ấy” để chỉ người hỏi theo văn cảnh; dùng tên “Giê-su” mà không thêm tước hiệu vì nguyên văn tại đây chỉ có tên riêng.
