revisions:
- from: 'Nhưng vì muốn tự biện minh, ông ấy nói với Giê-su: “Vậy ai là người lân cận của tôi?”[a]'
  to: 'Nhưng người ấy, muốn tự biện minh, nói với Giê-su: “Vậy ai là người lân cận của tôi?”[a]'
  rationale: Chỉ điều chỉnh cấu trúc mở đầu để phản ánh riêng δέ (‘Nhưng’) và phân từ θέλων (‘muốn’) một cách sát nghĩa, tự nhiên. Các thuật ngữ chính và chú thích được giữ vì phù hợp với nguyên văn và văn cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:01Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng động cơ tự biện minh (θέλων δικαιῶσαι ἑαυτόν), hành động nói với Giê-su, và câu hỏi trực tiếp về ‘người lân cận’ (πλησίον). Tuy nhiên, ‘Nhưng vì muốn’ gộp sắc thái đối lập/chuyển tiếp của δέ với quan hệ nguyên nhân một cách hơi nặng; cấu trúc ‘người ấy, muốn...’ phản ánh phân từ Hy Lạp sát hơn và tự nhiên hơn.
  naturalness: ‘Tự biện minh’ và ‘người lân cận’ là tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Đặt phân từ bằng cụm chen giữa (‘người ấy, muốn...’) giúp câu mạch lạc hơn và tránh mở đầu bằng ‘Nhưng vì’.
  terminology: Giữ ‘Giê-su’, không thêm tước hiệu. ‘Tự biện minh’ thích hợp ở đây theo nghĩa chứng tỏ mình có lý, không áp đặt nghĩa thuật ngữ về xưng công chính. ‘Người lân cận’ duy trì liên hệ từ vựng với văn cảnh luật yêu người lân cận.
  issues:
  - severity: low
    issue: ‘Nhưng vì muốn’ diễn giải quan hệ cú pháp và làm yếu chức năng chuyển tiếp/đối lập của δέ.
    rationale: δέ thường là ‘nhưng’ hoặc yếu hơn là một chuyển ý; θέλων là phân từ chỉ ý định/động cơ. ‘Nhưng người ấy, muốn tự biện minh, ...’ giữ riêng cả hai yếu tố mà không biến động cơ thành một mệnh đề nguyên nhân quá rõ.
