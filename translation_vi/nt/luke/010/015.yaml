id: LUK.10.15
reference: Luke 10:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: vi
  text: Còn ngươi, hỡi Ca-bê-na-um, ngươi sẽ được nâng lên tận trời sao? Ngươi sẽ bị hạ xuống tận Ha-đét[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đến cõi người chết.” Từ Hy Lạp là Ha-đét, không phải Ghê-hen-na (“địa ngục”).
    reason: Làm rõ nghĩa của ᾅδης và tránh đồng nhất từ này với thuật ngữ chỉ nơi hình phạt cuối cùng.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Ca-phác-na-um
  rationale: Phiên âm địa danh Hy Lạp theo cách đọc dễ nhận biết trong tiếng Việt, không dịch nghĩa tên riêng.
- source_word: μὴ ... ὑψωθήσῃ
  choice: ngươi sẽ được nâng lên ... sao?
  rationale: Giữ hình thức câu hỏi tu từ, vốn chờ đợi câu trả lời phủ định, đồng thời bảo toàn thể bị động và hình ảnh được nâng cao.
- source_word: ἕως οὐρανοῦ
  choice: tận trời
  rationale: Diễn đạt tự nhiên ý chỉ mức độ hoặc đích điểm cao nhất, đồng thời giữ thế đối xứng theo chiều dọc với việc bị hạ xuống âm phủ.
- source_word: ἕως τοῦ ᾅδου
  choice: tận âm phủ
  rationale: “Âm phủ” diễn đạt cõi người chết trong ngữ cảnh này và không đồng nhất ᾅδης với Ghê-hen-na, nơi hình phạt cuối cùng.
- source_word: καταβιβασθήσῃ
  choice: ngươi sẽ bị hạ xuống
  rationale: Giữ thì tương lai, thể bị động và sắc thái bị làm cho hạ xuống trong sự phán xét.
theological_decisions:
- issue: Cách dịch ᾅδης
  choice: âm phủ
  alternative: Ha-đét; địa hạt của người chết; địa ngục
  rationale: “Âm phủ” truyền đạt cõi người chết và giữ sự phân biệt từ vựng với Ghê-hen-na. Không dùng “địa ngục” vì từ ấy dễ đưa vào câu một ý niệm cụ thể hơn điều ᾅδης tự nó biểu thị.
- issue: Cách hiểu μὴ ... ὑψωθήσῃ
  choice: 'câu hỏi tu từ: “ngươi sẽ được nâng lên ... sao?”'
  alternative: 'lời phủ định trực tiếp: “ngươi sẽ không được nâng lên”'
  rationale: Tiểu từ μὴ phù hợp với câu hỏi chờ đợi câu trả lời phủ định; giữ dạng câu hỏi bảo toàn lực tu từ và sự căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Đại từ “ngươi” phù hợp với lời quở trách trực tiếp dành cho một thành phố được nhân cách hóa. Cặp “nâng lên tận trời / hạ xuống tận âm phủ” giữ nhịp đối xứng và hình ảnh tương phản của câu Hy Lạp.
