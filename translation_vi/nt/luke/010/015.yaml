revisions:
- from: Còn ngươi, Ca-phác-na-um, ngươi sẽ được nâng lên tận trời sao? Ngươi sẽ bị hạ xuống tận âm phủ[a].
  to: Còn ngươi, hỡi Ca-bê-na-um, ngươi sẽ được nâng lên tận trời sao? Ngươi sẽ bị hạ xuống tận Ha-đét[a].
  rationale: Bản sửa giữ nguyên lực của câu hỏi tu từ, thể bị động và hình ảnh đối xứng của tiếng Hy Lạp. “Ha-đét” thay cho “âm phủ” nhằm bảo toàn thuật ngữ nguồn và tránh thêm liên tưởng văn hóa không cần thiết; chú thích vẫn cung cấp cách diễn giải tự nhiên. Tên địa danh được chuẩn hóa theo dạng Việt ngữ Kinh Thánh quen dùng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:02Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng câu hỏi tu từ phủ định của μὴ ... ὑψωθήσῃ, thì tương lai và thể bị động của καταβιβασθήσῃ, cũng như tương phản theo trục dọc giữa trời và ᾅδης. Tuy nhiên, dùng “âm phủ” ở bản văn chính có thể gợi một khái niệm dân gian Việt Nam cụ thể hơn và không bảo tồn rõ thuật ngữ Ha-đét vốn được nguyên văn phân biệt với Ghê-hen-na.
  naturalness: Cấu trúc câu nhìn chung tự nhiên và trang trọng. Thêm “hỡi” làm lời gọi trực tiếp một thành được nhân cách hóa rõ và tự nhiên hơn; “lên tận trời / xuống tận Ha-đét” giữ nhịp đối xứng gọn hơn.
  terminology: Nên dùng “Ha-đét” trong bản văn chính để phiên âm trực tiếp ᾅδης và bảo toàn phân biệt từ vựng với Ghê-hen-na. “Cõi người chết” phù hợp làm phương án diễn giải trong chú thích. Dạng địa danh “Ca-bê-na-um” là dạng phiên âm Kinh Thánh Việt ngữ thông dụng hơn.
  issues:
  - severity: medium
    issue: “Âm phủ” được dùng để dịch ᾅδης trong bản văn chính.
    rationale: Từ này có thể hàm chứa các liên tưởng văn hóa-dân gian Việt Nam và làm mờ việc nguyên văn dùng Ha-đét, chứ không phải Ghê-hen-na. Phiên âm “Ha-đét” trong thân văn, với chú thích giải nghĩa, trung thành và minh bạch hơn.
  - severity: low
    issue: Phiên âm “Ca-phác-na-um” không phải dạng Kinh Thánh Việt ngữ phổ biến.
    rationale: “Ca-bê-na-um” dễ nhận diện hơn trong tiếng Việt hiện đại và vẫn là phiên âm, không thay đổi tên riêng.
