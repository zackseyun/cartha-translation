source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: vi
  text: Bà có một người chị/em gái tên là Ma-ri. Cô ngồi bên chân Đức Giê-su[a] và đang lắng nghe lời Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay ghi “Chúa” thay cho “Đức Giê-su.”
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: Bà
  rationale: Đại từ chỉ định giống cái quy chiếu về Mác-ta ở câu trước; “bà” là cách quy chiếu tự nhiên trong tiếng Việt mà không cần lặp tên.
- source_word: ἀδελφὴ
  choice: một người chị hoặc em gái
  rationale: Tiếng Hy Lạp không cho biết Ma-ri lớn hay nhỏ tuổi hơn Mác-ta. Cách dịch này tránh tự ý xác định là “chị” hay “em,” dù dài hơn lối nói thông thường.
- source_word: καλουμένη Μαριάμ
  choice: tên là Ma-ri
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại khi giới thiệu tên một người.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: ngồi xuống bên chân
  rationale: Thể phân từ aorist diễn tả Ma-ri vào tư thế ngồi; “bên chân” bám sát giới từ πρὸς và vẫn gợi tư thế của người học trò mà không diễn giải thêm.
- source_word: τοῦ Ἰησοῦ
  choice: Đức Giê-su
  rationale: Bản văn SBLGNT được cung cấp đọc Ἰησοῦ, nên bản chính dịch theo tên riêng “Đức Giê-su”; dị bản κύριος được ghi ở chú thích.
- source_word: ἤκουεν
  choice: lắng nghe
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; trong mạch câu tiếng Việt, “lắng nghe” truyền đạt tự nhiên sự chú tâm và tính kéo dài.
- source_word: τὸν λόγον αὐτοῦ
  choice: lời Người
  rationale: Giữ nghĩa rộng của λόγος là lời được Đức Giê-su nói ra, không thu hẹp thành “bài giảng” hay “giáo huấn.”
theological_decisions:
- issue: Dị bản giữa tên riêng Ἰησοῦ và tước hiệu κύριος trong cụm từ chỉ người mà Ma-ri ngồi bên chân
  choice: Đức Giê-su
  alternative: Chúa
  rationale: Bản văn nguồn SBLGNT được cung cấp có Ἰησοῦ trong dòng chính. Vì dị bản “Chúa” có ý nghĩa đối với cách gọi nhân vật, phương án ấy được bảo tồn trong chú thích thay vì hòa lẫn vào bản chính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “chị hoặc em gái” được dùng có chủ ý để bảo tồn sự không xác định về tuổi tác trong ἀδελφή. Đại từ “Người” tránh lặp tên nhưng vẫn giữ sắc thái tôn kính vừa phải.
