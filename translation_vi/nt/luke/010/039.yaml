- from: Bà có một người chị hoặc em gái tên là Ma-ri. Ma-ri ngồi xuống bên chân Đức Giê-su[a] và lắng nghe lời Người.
  to: Bà có một người chị/em gái tên là Ma-ri. Cô ngồi bên chân Đức Giê-su[a] và đang lắng nghe lời Người.
  rationale: Chỉnh nhẹ để câu văn tự nhiên hơn và thể hiện rõ hơn tính tiếp diễn của động từ Hy Lạp, đồng thời vẫn giữ nguyên dị bản, tên riêng trong bản văn SBLGNT, và sự không xác định về Ma-ri là chị hay em của Mác-ta.
