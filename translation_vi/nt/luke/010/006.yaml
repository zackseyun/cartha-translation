  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc điều kiện, đối tượng số ít, hình ảnh sự bình an “ở/rest trên” người tiếp nhận, và sự bình an quay trở lại với các môn đồ. Tuy nhiên, “một người thuộc về sự bình an” không phải là cách diễn đạt Việt ngữ tự nhiên và không làm sáng rõ giá trị thành ngữ của υἱὸς εἰρήνης trong ngữ cảnh. “Một người đón nhận sự bình an” truyền đạt an toàn ý người tiếp nhận lời chúc/sự bình an, còn chú thích bảo lưu cách nói nguyên văn và phạm vi nghĩa rộng hơn.
  naturalness: “Người thuộc về sự bình an” có tính dịch từng chữ và gượng trong tiếng Việt hiện đại. “Đậu trên người ấy” có thể dùng với ân phước nhưng dễ gợi hình ảnh chim đậu; “ở lại trên người ấy” tự nhiên hơn, đồng thời phản ánh đúng ý nghỉ/lưu lại của ἐπαναπαήσεται.
  terminology: Giữ “sự bình an”, “anh em”, và “người ấy” là phù hợp với văn phong Kinh Thánh hiện đại. Không nên đổi sự bình an thành chỉ “lời chào” hoặc “phước lành” trong chính văn, vì nguyên ngữ vẫn để ngỏ chiều kích của lời chúc và sự bình an được ban.
