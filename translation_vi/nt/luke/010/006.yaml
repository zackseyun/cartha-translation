  rationale: Bản sửa thay cách diễn đạt gượng bằng một cách nói Việt ngữ rõ ràng trong văn cảnh, nhưng chú thích vẫn nêu thành ngữ “con trai của sự bình an” và không giới hạn nó chỉ vào một nét tính cách. “Ở lại trên” thay cho “đậu trên” phản ánh tự nhiên hơn ý sự bình an đến nghỉ/lưu lại trên người ấy. Các yếu tố sở hữu, số ít, điều kiện phủ định, và hướng quay trở lại đều được giữ nguyên.
