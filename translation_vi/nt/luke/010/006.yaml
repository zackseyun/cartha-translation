reference: Luke 10:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: vi
  text: Nếu ở đó có một người đón nhận sự bình an[a], sự bình an của anh em sẽ ở lại trên người ấy; nếu không, sự bình an ấy sẽ trở về với anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “một con trai của sự bình an”, một thành ngữ chỉ người được đặc trưng bởi sự bình an hoặc người sẵn lòng đón nhận sự bình an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: một người thuộc về sự bình an
  rationale: Đây là thành ngữ kiểu Sê-mít, nguyên văn là “con trai của sự bình an”, chỉ người được đặc trưng bởi sự bình an hoặc sẵn lòng đón nhận lời chúc bình an. Cách dịch này giữ sắc thái thuộc về/được đặc trưng bởi mà vẫn tự nhiên và dễ hiểu trong tiếng Việt hiện đại; chú thích bảo lưu hình thức nguyên văn.
- source_word: ἐπαναπαήσεται ἐπ’ αὐτόν
  choice: sẽ đậu trên người ấy
  rationale: Động từ diễn tả việc đến nghỉ hoặc lưu lại trên ai. “Đậu trên” giữ hình ảnh cụ thể của nguyên ngữ và phù hợp với chủ thể trừu tượng “sự bình an”.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: sự bình an của anh em
  rationale: Giữ cấu trúc sở hữu trực tiếp, không thu hẹp ý nghĩa thành riêng lời chào hay lời chúc, dù văn cảnh bao hàm lời chúc bình an của các môn đồ.
- source_word: εἰ δὲ μήγε
  choice: nếu không
  rationale: Diễn đạt tự nhiên điều kiện phủ định có phần nhấn mạnh trong tiếng Việt, không thêm sắc thái không cần thiết.
- source_word: ἀνακάμψει ἐφ’ ὑμᾶς
  choice: sẽ trở về với anh em
  rationale: Động từ có nghĩa quay lại hoặc trở về. Với động từ “trở về”, “với anh em” là cách kết hợp tự nhiên trong tiếng Việt và truyền đạt đúng hướng quay lại phía những người sai đi.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Nếu ở đó có
  rationale: Cấu trúc điều kiện và yếu tố chỉ nơi chốn được giữ rõ ràng. Không nhất thiết dịch καί thành “và” ở đầu câu vì trong tiếng Việt, liên kết với câu trước đã được văn mạch thể hiện tự nhiên.
theological_decisions:
- issue: Cách thể hiện thành ngữ giống đực υἱὸς εἰρήνης
  choice: Dùng “một người thuộc về sự bình an” trong chính văn và ghi nguyên văn ở chú thích
  alternative: “một con trai của sự bình an” hoặc “một người yêu chuộng hòa bình”
  rationale: Dịch sát từng chữ là “con trai của sự bình an” dễ gây hiểu lầm trong tiếng Việt hiện đại, còn “người yêu chuộng hòa bình” có thể thu hẹp ý nghĩa vào tính khí hiền hòa. Cách chọn giữ độ rộng của thành ngữ—người thích hợp hoặc sẵn lòng đón nhận sự bình an—mà không áp đặt cách giải thích giáo phái.
- issue: Bản chất của “sự bình an của anh em”
  choice: Giữ cách nói “sự bình an của anh em”
  alternative: “lời chúc bình an của anh em” hoặc “phước lành bình an của anh em”
  rationale: Nguyên ngữ không xác định rõ đây chỉ là công thức chào hỏi hay một phước lành có hiệu lực. Bản dịch giữ sự căng mở đó thay vì giải nghĩa ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν/ὑμᾶς theo lối xưng hô quen thuộc trong văn Kinh Thánh; “người ấy” tránh lặp và vẫn phản ánh số ít của αὐτόν. Đại từ “sự bình an ấy” ở vế cuối làm rõ chủ thể ngầm của động từ mà không thêm nội dung diễn giải.
