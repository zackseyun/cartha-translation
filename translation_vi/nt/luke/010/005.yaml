id: LUK.10.5
reference: Luke 10:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: vi
  text: 'Khi anh em vào bất cứ nhà nào, trước hết hãy nói: “Bình an cho nhà này.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nguyện bình an đến với nhà này” hoặc “Bình an trên nhà này.” Tiếng Hy Lạp dùng một công thức chúc phước cô đọng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃
  choice: Khi anh em vào bất cứ nhà nào
  rationale: Cụm đại từ quan hệ với ἄν tạo mệnh đề bất định, mang nghĩa khái quát hướng đến những lần vào nhà về sau. “Vào bất cứ nhà nào” giữ ý chuyển động của εἰς và diễn đạt tự nhiên trong tiếng Việt; “anh em” thể hiện ngôi thứ hai số nhiều của εἰσέλθητε.
- source_word: πρῶτον
  choice: trước hết
  rationale: 'Diễn tả thứ tự ưu tiên: đây là điều đầu tiên họ phải làm khi vào nhà.'
- source_word: λέγετε
  choice: hãy nói
  rationale: Thể mệnh lệnh hiện tại quy định lời họ phải nói; “hãy nói” rõ ràng và tự nhiên.
- source_word: Εἰρήνη
  choice: Bình an
  rationale: Giữ sự cô đọng của công thức chào hỏi/chúc phước, đồng thời bảo tồn sắc thái Kinh Thánh và nền tảng Do Thái của lời này.
- source_word: τῷ οἴκῳ τούτῳ
  choice: cho nhà này
  rationale: Tặng cách chỉ đối tượng nhận lời chúc phước. “Nhà” vừa có nghĩa cụ thể là nơi ở vừa không loại trừ những người thuộc nhà ấy.
theological_decisions:
- issue: Bản chất của công thức bình an
  choice: 'Dịch như một lời chúc phước được công bố: “Bình an cho nhà này.”'
  alternative: “Nguyện bình an đến với nhà này” hoặc “Bình an trên nhà này”
  rationale: Câu Hy Lạp truyền lệnh công bố bình an trên ngôi nhà, phù hợp với cách chào hỏi và chúc phước của người Do Thái. Bản dịch giữ tính thực hiện của lời chúc mà không thêm một động từ hay sắc thái nghi lễ không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” phù hợp với lời Chúa Giê-su nói với nhiều môn đồ; công thức “Bình an cho nhà này” được giữ ngắn gọn để phản ánh nguyên văn.
