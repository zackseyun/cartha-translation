source:
  edition: SBLGNT
  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: vi
  text: 'Chính người này là người mà có chép rằng: “Này, Ta sai sứ giả[a] của Ta đi trước mặt ngươi; người ấy sẽ dọn đường ngươi đi trước ngươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được dịch là “thiên sứ,” nhưng trong ngữ cảnh này chỉ một sứ giả loài người, tức Giăng.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Chính người này
  rationale: Giữ sắc thái chỉ định và nhấn mạnh, quy chiếu trực tiếp đến Giăng, đồng thời tự nhiên trong tiếng Việt.
- source_word: περὶ οὗ γέγραπται
  choice: là người mà lời đã chép rằng
  rationale: Diễn đạt công thức trích dẫn Kinh Thánh một cách trang trọng, dễ hiểu; thì hoàn thành bị động được chuyển theo lối nói tự nhiên của tiếng Việt.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của lời tiên tri mà không dùng từ quá cổ.
- source_word: ἀποστέλλω
  choice: Ta sai
  rationale: Thể hiện hiện tại giàu tính trực tiếp của lời trích dẫn bằng cách nói gọn, tự nhiên trong tiếng Việt.
- source_word: ἄγγελόν
  choice: sứ giả
  rationale: Ở đây từ này chỉ Giăng là người được sai đi, nên “sứ giả” chính xác hơn “thiên sứ” trong văn cảnh.
- source_word: πρὸ προσώπου σου
  choice: đi trước mặt Con
  rationale: Giữ hình ảnh cụ thể “trước mặt” của nguyên văn và vẫn là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: κατασκευάσει
  choice: sẽ chuẩn bị
  rationale: Diễn đạt rõ hành động trong tương lai là làm cho sẵn sàng.
- source_word: τὴν ὁδόν σου
  choice: con đường của Con
  rationale: Giữ cả nghĩa cụ thể lẫn khả năng ẩn dụ của “con đường” trong lời tiên tri.
- source_word: ἔμπροσθέν σου
  choice: trước Con
  rationale: Phân biệt với cụm “trước mặt Con” ở trước, đồng thời giữ sự lặp lại có chủ ý của đại từ ngôi thứ hai.
theological_decisions:
- issue: Lời trích dẫn được áp dụng cho Giăng trong mối liên hệ với Chúa Giê-su
  choice: Giữ nguyên các đại từ ngôi thứ hai trong toàn bộ lời trích dẫn, không thêm danh xưng “Chúa” hay “Đấng Mê-si”
  alternative: Diễn giải thành “dọn đường cho Chúa/Đấng Mê-si”
  rationale: Nguyên văn trực tiếp nói “mặt của ngươi,” “đường của ngươi,” và “trước ngươi.” Không mở rộng danh tính trong bản văn giúp bảo toàn sức nặng thần học của việc Chúa Giê-su áp dụng lời này mà không biến phần dịch thành lời chú giải.
- issue: Cách xưng hô cho đại từ σου trong lời Đức Chúa Trời phán với người được nói đến
  choice: Dùng “Con” và giải thích trong chú thích rằng tiếng Hy Lạp chỉ có đại từ ngôi thứ hai số ít
  alternative: Dùng “Ngài,” “ngươi,” hoặc lặp danh xưng giải nghĩa
  rationale: “Con” tạo lời văn tiếng Việt tự nhiên và trang trọng trong ngữ cảnh, nhưng chú thích bảo lưu sự kiện rằng bản Hy Lạp không tự nó mã hóa quan hệ hay mức độ kính trọng như hệ thống đại từ tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nhịp của lời trích dẫn tiên tri; tránh từ ngữ giáo phái và không giải nghĩa danh tính của người được xưng hô ngay trong câu.
