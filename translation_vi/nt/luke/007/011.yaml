id: LUK.7.11
reference: Luke 7:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: vi
  text: Ngày hôm sau, Đức Giê-su đi vào một thị trấn tên là Na-in[a]. Các môn đồ của ngài và một đám đông lớn cùng đi với ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “không lâu sau đó” thay cho “ngày hôm sau”.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: 'lược dịch trong mạch kể: “Ngày hôm sau...”'
  rationale: Đây là công thức dẫn nhập sự kiện thường gặp trong Lu-ca. Tiếng Việt tự nhiên không cần dịch máy móc là “và việc xảy ra là”; trình tự kể vẫn được bảo toàn.
- source_word: ἐν τῷ ἑξῆς
  choice: Ngày hôm sau
  rationale: Cụm từ chỉ thời điểm kế tiếp và, theo bản văn SBLGNT trong ngữ cảnh này, được hiểu tự nhiên là ngày kế tiếp; dị bản được ghi chú.
- source_word: ἐπορεύθη
  choice: đi đến
  rationale: Diễn đạt tự nhiên hành động đi tới địa điểm được nêu, đồng thời phản ánh hướng đích của εἰς.
- source_word: εἰς πόλιν
  choice: đến một thành
  rationale: πόλις có thể chỉ thành phố hoặc thị trấn. “Một thành” là cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt mà không khẳng định quy mô lớn.
- source_word: καλουμένην Ναΐν
  choice: gọi là Na-in
  rationale: Dịch trực tiếp, tự nhiên cho phân từ καλουμένην và phiên âm địa danh thành “Na-in” để người Việt dễ đọc.
- source_word: συνεπορεύοντο
  choice: cùng đi với ngài
  rationale: Giữ ý chuyển động đồng hành và sắc thái đang tiếp diễn của thì chưa hoàn thành.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của ngài
  rationale: “Môn đồ” là thuật ngữ tiếng Việt quen thuộc cho μαθητής; “của ngài” giữ quan hệ sở hữu được nêu rõ trong tiếng Hy Lạp.
- source_word: ὄχλος πολύς
  choice: một đoàn dân đông
  rationale: Diễn đạt tự nhiên một đám đông cùng di chuyển; “đông” phản ánh πολύς.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “ngài” theo lối tôn kính phổ thông; không thêm cách giải thích thần học. Tách câu dài của tiếng Hy Lạp thành hai câu tiếng Việt để rõ nghĩa, nhưng giữ nguyên quan hệ trình tự và đồng hành.
