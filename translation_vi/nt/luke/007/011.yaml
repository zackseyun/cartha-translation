revisions:
- from: Ngày hôm sau, Đức Giê-su đi đến một thành gọi là Na-in[a]. Các môn đồ của ngài và một đoàn dân đông cùng đi với ngài.
  to: Ngày hôm sau, Đức Giê-su đi vào một thị trấn tên là Na-in[a]. Các môn đồ của ngài và một đám đông lớn cùng đi với ngài.
  rationale: Bản sửa chỉ thay “thành” bằng “thị trấn” và “đoàn dân đông” bằng “đám đông lớn” để phản ánh chính xác hơn πόλις và ὄχλος πολύς trong tiếng Việt hiện đại. Trình tự thời gian, động tác đi vào, sự đồng hành liên tục, tên riêng, và chú thích dị bản đều được giữ nguyên.
