  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: vi
  text: Tin này về Ngài lan truyền khắp miền Giu-đê và toàn vùng lân cận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lời tường thuật này về Ngài” hoặc “Lời này về Ngài.”'
    reason: Giữ lại phạm vi nghĩa của λόγος, vốn có thể chỉ tin tức, lời tường thuật hoặc lời nói.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: lan truyền
  rationale: Trong ngữ cảnh tin tức được phổ biến, động từ này mang nghĩa thành ngữ là “lan truyền”; cách dịch này tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ὁ λόγος οὗτος
  choice: tin này
  rationale: λόγος ở đây chỉ tin tức hay lời tường thuật về việc Chúa Giê-su vừa làm, chứ không phải một từ đơn lẻ. “Tin này” phù hợp với văn cảnh và lời Việt tự nhiên.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: khắp miền Giu-đê
  rationale: Diễn đạt phạm vi phổ biến rộng khắp trong toàn xứ Giu-đê; “miền” giúp tên địa lý tự nhiên trong tiếng Việt mà không áp đặt một đơn vị hành chính hiện đại.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: περί với sở hữu cách có nghĩa là “về, liên quan đến.” Đại từ tôn kính “Ngài” phù hợp với văn phong Kinh Thánh tiếng Việt khi nói về Chúa Giê-su.
- source_word: πάσῃ τῇ περιχώρῳ
  choice: toàn vùng lân cận
  rationale: περίχωρος chỉ khu vực bao quanh. “Toàn vùng lân cận” rõ ràng, tự nhiên và giữ được phạm vi bao quát của πάσῃ.
- source_word: καὶ ... καὶ
  choice: và
  rationale: Liên từ nối hai phạm vi địa lý theo cách cộng dồn; “và” bảo toàn cấu trúc mà vẫn tự nhiên.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lan truyền” để thể hiện thành ngữ phổ biến tin tức; dùng “Ngài” theo quy ước tôn kính dành cho Chúa Giê-su.
