- from: Sau khi nói xong mọi lời ấy cho dân chúng nghe, Đức Giê-su đi vào thành Ca-phác-na-um.
  to: Sau khi nói xong mọi lời của mình cho dân chúng nghe, Đức Giê-su đi vào Ca-phác-na-um.
  rationale: Bản sửa loại bỏ thông tin phân loại địa danh không có trong tiếng Hy Lạp và phục hồi sở hữu cách αὐτοῦ bằng «của mình». Các yếu tố khác của bản dịch được giữ nguyên vì trung thành với câu nguồn và phù hợp văn phong tiếng Việt hiện đại.
