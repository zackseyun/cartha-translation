source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: vi
  text: Sau khi nói xong mọi lời của mình cho dân chúng nghe, Đức Giê-su đi vào Ca-phác-na-um.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Sau khi
  rationale: Trong mạch kể chuyện, liên từ mở đầu một mệnh đề thời gian và cho biết hành động nói đã hoàn tất trước khi Đức Giê-su vào Ca-phác-na-um.
- source_word: ἐπλήρωσεν
  choice: nói xong
  rationale: Khi đi với ῥήματα, động từ mang nghĩa hoàn tất việc nói; cách dịch này tự nhiên trong tiếng Việt và tránh nghĩa máy móc là “làm đầy” hay “ứng nghiệm”.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: mọi lời ấy
  rationale: Giữ danh từ “lời” của nguyên văn, đồng thời dùng “ấy” để chỉ lại phần giảng dạy ngay trước đó; đại từ sở hữu αὐτοῦ được diễn đạt theo ngữ cảnh thay vì dịch cứng là “mọi lời của mình”.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: cho dân chúng nghe
  rationale: Diễn đạt tự nhiên thành ngữ nguyên văn, theo sát ý những lời ấy được nói ra trong tầm nghe của dân chúng.
- source_word: λαοῦ
  choice: dân chúng
  rationale: Thể hiện nghĩa tập thể của λαός mà không thu hẹp thành một đám đông cụ thể.
- source_word: εἰσῆλθεν
  choice: đi vào
  rationale: Cách diễn đạt tự nhiên cho hành động tiến vào một địa điểm; nguyên ngữ không đòi hỏi sắc thái trang trọng của “tiến vào”.
- source_word: Καφαρναούμ
  choice: Ca-phác-na-um
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của địa danh Capernaum.
theological_decisions:
- issue: Chủ ngữ ngầm của các động từ
  choice: Đức Giê-su
  alternative: Ngài / Người
  rationale: Nguyên văn chỉ dùng chủ ngữ hàm ẩn qua động từ ngôi thứ ba số ít. Nêu tên Đức Giê-su giúp câu tiếng Việt đứng độc lập rõ nghĩa mà không thêm một cách hiểu thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “cho dân chúng nghe” ưu tiên tiếng Việt tự nhiên nhưng vẫn giữ sắc thái công khai của εἰς τὰς ἀκοὰς τοῦ λαοῦ.
