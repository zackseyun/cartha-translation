  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: toàn thể dân chúng, bao gồm người thu thuế, nhìn nhận Đức Chúa Trời là công chính sau/bởi việc đã chịu phép báp-têm của Giăng. Cách dịch “nhìn nhận Đức Chúa Trời là công chính” diễn đạt đúng nghĩa ngữ cảnh của ἐδικαίωσαν τὸν θεόν, không hàm ý con người làm cho Đức Chúa Trời trở nên công chính. Tuy nhiên, “vốn đã” thêm một sắc thái hồi cố/đã từ trước không được phân từ βαπτισθέντες tự nó yêu cầu; chỉ “đã” đủ diễn đạt hành động xảy ra trước việc nhìn nhận mà vẫn không quyết định quan hệ là thời gian hay nguyên nhân.'
