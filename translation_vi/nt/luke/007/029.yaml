  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: vi
  text: Khi nghe điều ấy, toàn thể dân chúng, kể cả những người thu thuế, đều nhìn nhận Đức Chúa Trời là công chính[a]—họ đã chịu phép báp-têm của Giăng.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “xưng Đức Chúa Trời là công chính.” Ý nói họ thừa nhận Đức Chúa Trời là đúng.'
    reason: lexical_alternative
  - marker: b
    text: 'Phân từ này cũng có thể được hiểu theo nghĩa nguyên nhân: “vì họ đã chịu phép báp-têm của Giăng.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: toàn thể dân chúng
  rationale: Diễn đạt tự nhiên danh từ tập hợp số ít và giữ phạm vi rộng của πᾶς.
- source_word: ἀκούσας
  choice: khi nghe điều ấy
  rationale: Phân từ aorist được hiểu theo nghĩa thời gian; “điều ấy” là bổ ngữ được ngữ cảnh hàm ý.
- source_word: οἱ τελῶναι
  choice: những người thu thuế
  rationale: Cách gọi hiện đại, rõ nghĩa và không thêm sắc thái nhấn mạnh ngoài nguyên văn.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: nhìn nhận Đức Chúa Trời là công chính
  rationale: δικαιόω ở đây nói đến việc thừa nhận Đức Chúa Trời là đúng và công chính, chứ không phải con người làm cho Ngài trở nên công chính.
- source_word: βαπτισθέντες
  choice: họ vốn đã chịu phép báp-têm
  rationale: “Vốn đã” trình bày việc chịu báp-têm như hoàn cảnh nền trước đó mà không buộc phân từ phải mang nghĩa nguyên nhân hay thuần túy thời gian.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: phép báp-têm của Giăng
  rationale: Giữ phép lặp cùng gốc giữa βαπτισθέντες và βάπτισμα theo cách diễn đạt quen thuộc, rõ ràng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἐδικαίωσαν τὸν θεόν
  choice: Họ nhìn nhận Đức Chúa Trời là công chính và đúng.
  alternative: Có thể dịch sát hình thức hơn là “xưng Đức Chúa Trời là công chính” hoặc “kể Đức Chúa Trời là công chính”.
  rationale: Cách dịch chính tránh gợi ý rằng con người làm thay đổi địa vị đạo đức của Đức Chúa Trời, nhưng vẫn giữ sắc thái phán định của δικαιόω.
- issue: Chức năng của phân từ βαπτισθέντες
  choice: Trình bày việc đã chịu báp-têm như hoàn cảnh nền, không xác định rõ quan hệ nguyên nhân.
  alternative: 'Có thể hiểu theo nghĩa nguyên nhân: “vì họ đã chịu phép báp-têm của Giăng”.'
  rationale: Hình thức phân từ cho phép cách hiểu nguyên nhân trong ngữ cảnh nhưng không bắt buộc; bản chính giữ sự mở về cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kể cả” thể hiện nhóm người thu thuế nằm trong toàn thể dân chúng mà không thêm sắc thái ngạc nhiên như “ngay cả”. Dấu gạch ngang giúp mệnh đề hoàn cảnh ở cuối câu gắn với toàn bộ chủ thể phía trước.
