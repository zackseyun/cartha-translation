revisions:
- from: 'Con Người đã đến, ăn và uống, còn các ngươi nói: “Kìa, một kẻ ham ăn, nghiện rượu, bạn bè với những người thu thuế và những kẻ tội lỗi!”[a]'
  to: 'Con Người đã đến, ăn và uống, còn các ngươi nói: “Kìa, một kẻ ham ăn, say rượu, bạn của những người thu thuế và những kẻ tội lỗi!”[a]'
  rationale: Chỉnh «bạn bè với» thành «bạn của» để giữ φίλος số ít và quan hệ sở hữu với hai nhóm người. Đổi «nghiện rượu» thành «say rượu» để phản ánh lời sỉ nhục οἰνοπότης mà không thêm hàm ý lệ thuộc hiện đại. Cập nhật chú thích cho nhất quán với cách dịch sát.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:37:12Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng danh xưng «Con Người», thì hoàn thành «đã đến», và tính chất vu khống, miệt thị của các lời tố cáo. Tuy nhiên, «bạn bè với» không tương ứng chính xác với φίλος số ít đi với các bổ ngữ sở hữu số nhiều; cần dịch là «bạn của ...». «Nghiện rượu» có thể hàm ý lệ thuộc/y khoa hiện đại mạnh hơn οἰνοπότης, nên «say rượu» phù hợp hơn với lời mạt sát trong ngữ cảnh.
  naturalness: Câu văn nhìn chung hiện đại và rõ ràng. «Bạn của những người thu thuế và những kẻ tội lỗi» tự nhiên hơn «bạn bè với ...» và đồng thời giữ cấu trúc gốc.
  terminology: «Con Người», «người thu thuế», và «kẻ tội lỗi» phù hợp với thuật ngữ Kinh Thánh tiếng Việt. «Kẻ ham ăn, say rượu» giữ được sắc thái công kích mà không diễn giải οἰνοπότης thành chứng nghiện.
  issues:
  - severity: medium
    issue: «bạn bè với» thay cho φίλος
    rationale: 'φίλος là danh từ số ít: «một người bạn của» các nhóm được nêu. «Bạn bè với» chuyển thành quan hệ có tính tập thể/đối ứng và làm mờ cấu trúc danh từ của nguyên ngữ.'
  - severity: low
    issue: «nghiện rượu» diễn giải mạnh hơn οἰνοπότης
    rationale: οἰνοπότης là lời buộc tội «kẻ uống rượu/kẻ say rượu»; từ «nghiện» trong tiếng Việt hiện đại thường gợi tình trạng lệ thuộc. «Say rượu» giữ sức nặng của lời miệt thị mà không thêm một chẩn đoán.
  - severity: low
    issue: Chú thích chưa phản ánh đầy đủ cách dịch sát của cụm danh từ
    rationale: Chú thích nên nêu rõ «một người ... kẻ uống rượu», vừa phản ánh ἄνθρωπος vừa tránh đồng nhất «nghiện rượu» với cách dịch sát của οἰνοπότης.
