id: LUK.7.34
reference: Luke 7:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: vi
  text: 'Con Người đã đến, ăn và uống, còn các ngươi nói: “Kìa, một kẻ ham ăn, say rượu, bạn của những người thu thuế và những kẻ tội lỗi!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Kìa, một người ham ăn và một kẻ uống rượu.”'
    reason: Nêu cách dịch sát hơn của ἄνθρωπος và οἰνοπότης; bản chính dùng lời cáo buộc tự nhiên, có sắc thái miệt thị trong tiếng Việt.
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: đã đến
  rationale: Thì hoàn thành diễn tả việc Con Người đã đến và hiện diện; tiếng Việt tự nhiên dùng “đã đến” mà không cần biểu đạt riêng kết quả còn tiếp diễn.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh xưng đã quen thuộc, giữ được tính chất tước hiệu và khả năng liên hệ với Đa-ni-ên mà không diễn giải thêm.
- source_word: ἐσθίων καὶ πίνων
  choice: ăn và uống
  rationale: Giữ cấu trúc song hành và diễn tả cách thức đi kèm với việc đến, đồng thời tự nhiên trong tiếng Việt.
- source_word: λέγετε
  choice: các ngươi nói
  rationale: Hiện tại chỉ lời nhận định thường xuyên của những người bị Đức Giê-su chất vấn; “các ngươi” giữ sắc thái trực tiếp, nghiêm nghị của ngữ cảnh.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Thán từ hiện đại, tự nhiên, giữ lực chỉ trỏ và chế giễu trong lời buộc tội.
- source_word: ἄνθρωπος
  choice: một kẻ
  rationale: Trong chuỗi lời miệt thị, “một kẻ” diễn đạt tự nhiên ý “một người” và dẫn vào các danh từ mang tính buộc tội.
- source_word: φάγος
  choice: ham ăn
  rationale: Diễn đạt rõ lời cáo buộc về thói tham ăn; tự nhiên hơn danh từ Hán-Việt hoặc cách nói cổ.
- source_word: οἰνοπότης
  choice: nghiện rượu
  rationale: Giữ sắc thái miệt thị mạnh của lời cáo buộc; nghĩa sát chữ “kẻ uống rượu” được ghi trong chú thích.
- source_word: φίλος
  choice: bạn bè với
  rationale: Cách nói tự nhiên trong tiếng Việt cho quan hệ thân giao bị đối phương dùng để công kích.
- source_word: τελωνῶν
  choice: những người thu thuế
  rationale: Cách gọi hiện đại, rõ nghĩa cho nhóm người làm nghề thu thuế.
- source_word: ἁμαρτωλῶν
  choice: những kẻ tội lỗi
  rationale: Giữ nhãn gọi mang tính xã hội-tôn giáo và sắc thái khinh miệt trong lời của đối phương.
theological_decisions:
- issue: Cách dịch danh xưng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Người Con của loài người
  rationale: “Con Người” vừa dễ nhận biết là danh xưng của Đức Giê-su, vừa giữ hàm ý liên văn bản và sự căng thẳng thần học mà không giải nghĩa quá mức.
- issue: Mức độ gay gắt của các lời cáo buộc
  choice: một kẻ ham ăn, nghiện rượu
  alternative: một người tham ăn và uống rượu
  rationale: Đây là lời vu cáo thù nghịch được trích dẫn, nên bản dịch giữ tính xúc phạm của φάγος và οἰνοπότης thay vì làm nhẹ lời buộc tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các ngươi” để giữ lời đối chất trực tiếp, nghiêm khắc; dấu ngoặc kép cho thấy các từ miệt thị là lời của đối phương, không phải nhận định của người thuật chuyện. Mọi dấu chú thích đều xuất hiện trong câu chính.
