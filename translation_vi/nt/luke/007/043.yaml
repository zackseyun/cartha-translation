  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: vi
  text: 'Si-môn đáp: “Tôi nghĩ là người được ông ấy tha nhiều hơn[a].” Ngài nói với ông: “Ông đã nhận định đúng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người được ông ấy xóa khoản nợ lớn hơn.” Động từ Hy Lạp có thể mang nghĩa rộng lòng miễn nợ hoặc xóa nợ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp
  rationale: Cụm phân từ kèm động từ nói được diễn đạt tự nhiên bằng một động từ hữu hạn trong tiếng Việt, vẫn giữ đầy đủ ý là Si-môn trả lời.
- source_word: Ὑπολαμβάνω
  choice: Tôi nghĩ là
  rationale: Cách nói này thể hiện một suy luận dè dặt, chưa hoàn toàn quả quyết; tự nhiên hơn trong tiếng Việt hiện đại so với cách dịch cứng là “tôi giả định”.
- source_word: ᾧ τὸ πλεῖον ἐχαρίσατο
  choice: người được ông ấy tha nhiều hơn
  rationale: Giữ ý so sánh về khoản nợ được miễn và sắc thái tha thứ của χαρίζομαι trong ngữ cảnh dụ ngôn; cấu trúc bị động tự nhiên giúp biểu đạt rõ người nhận sự miễn tha.
- source_word: Ὀρθῶς ἔκρινας
  choice: Ông đã nhận định đúng
  rationale: “Nhận định” truyền đạt hành động đánh giá và đưa ra kết luận trong κρίνω, còn “đúng” giữ lực xác nhận của ὀρθῶς mà không gợi sắc thái xét xử không cần thiết.
theological_decisions:
- issue: Ý nghĩa của ἐχαρίσατο trong hình ảnh món nợ
  choice: tha nhiều hơn
  alternative: xóa khoản nợ lớn hơn
  rationale: “Tha” duy trì mối liên hệ giữa việc miễn nợ trong dụ ngôn và chủ đề tha tội của văn cảnh, trong khi chú thích bảo tồn nghĩa cụ thể là xóa nợ và sắc thái ban ơn của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “ông” cho Si-môn; “ông ấy” trong lời đáp chỉ chủ nợ trong dụ ngôn. Dấu chú thích được đặt ngay sau mệnh đề liên quan.
