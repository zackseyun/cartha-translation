  source_fidelity: 'Bản dịch chuyển tải đúng trình tự và ý nghĩa chính của Hy Lạp: Si-môn trả lời dè dặt (Ὑπολαμβάνω), xác định người được tha/miễn nhiều hơn (ᾧ τὸ πλεῖον ἐχαρίσατο), và được xác nhận là nhận định đúng (Ὀρθῶς ἔκρινας). “Tha” là lựa chọn phù hợp trong ngữ cảnh dụ ngôn nợ nần, đồng thời bảo toàn liên hệ với chủ đề tha thứ của đoạn văn.'
