  terminology: “Si-môn,” “Ngài,” “ông,” “tha,” và “nhận định đúng” đều nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích nên dùng cách diễn đạt tự nhiên hơn là “rộng lòng miễn hoặc xóa nợ.”
  issues:
