  terminology: Cách xưng hô “ông/tôi” giữ được tính trực tiếp mà không thêm đánh giá về địa vị. “Người phụ nữ này” phản ánh αὕτη một cách minh bạch. Chú thích a giải thích phong tục mà không đưa diễn giải vào chính văn; chú thích b phản ánh đúng sắc thái khả dĩ của καταφιλέω. Các neo chú thích đặt sau đơn vị nội dung liên quan và không có lỗi cấu trúc.
