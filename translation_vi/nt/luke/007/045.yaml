id: LUK.7.45
reference: Luke 7:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: vi
  text: Ông không trao cho tôi một nụ hôn[a]; còn người phụ nữ này, từ khi tôi bước vào, vẫn không ngừng hôn chân tôi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một nụ hôn chào đón”; hôn là một cử chỉ tiếp khách theo phong tục thời ấy.'
    reason: cultural_note
  - marker: b
    text: 'Động từ Hy Lạp có thể hàm ý hôn âu yếm hoặc hôn liên tiếp: “không ngừng phủ chân tôi bằng những nụ hôn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά μοι οὐκ ἔδωκας
  choice: Ông không trao cho tôi một nụ hôn
  rationale: Giữ hình ảnh và cấu trúc ‘trao một nụ hôn’ của nguyên văn, đồng thời dùng đại từ xưng hô tự nhiên trong lời Đức Giê-su nói trực tiếp với Si-môn. Ý nghĩa đây là nụ hôn chào đón được giải thích ở chú thích thay vì đưa thẳng vào chính văn.
- source_word: αὕτη δὲ
  choice: còn người phụ nữ này
  rationale: Diễn đạt rõ sắc thái chỉ định của αὕτη và sự tương phản với Si-môn; cách gọi này cũng tự nhiên hơn một đại từ có thể hàm ý tuổi tác hoặc địa vị.
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: từ khi tôi bước vào
  rationale: 'Hiểu cụm giới từ với đại từ quan hệ theo nghĩa thời gian, với danh từ chỉ thời điểm được lược bỏ: ‘từ lúc tôi bước vào’. Cách dịch này rõ ràng và tự nhiên trong bối cảnh tiếp khách.'
- source_word: οὐ διέλιπεν
  choice: vẫn không ngừng
  rationale: Thể hiện hành động bắt đầu trước đó và còn tiếp diễn đến lúc Đức Giê-su đang nói; ‘vẫn’ làm nổi bật tính liên tục mà không thêm một kết luận thần học.
- source_word: καταφιλοῦσά μου τοὺς πόδας
  choice: hôn chân tôi
  rationale: Giữ đối tượng số nhiều theo nghĩa tập hợp tự nhiên trong tiếng Việt. Động từ καταφιλέω có thể hàm ý hôn âu yếm hoặc liên tiếp; sắc thái mạnh hơn được bảo tồn trong chú thích.
theological_decisions:
- issue: Ý nghĩa văn hóa của nụ hôn trong việc tiếp khách
  choice: Giữ hành động ‘trao cho tôi một nụ hôn’ trong chính văn và giải thích tập tục ở chú thích.
  alternative: Ông không hôn chào đón tôi.
  rationale: Nguyên văn nêu hành động chứ không trực tiếp giải thích tập tục. Cách chọn này giữ lời văn gọn, không biến hàm ý văn hóa thành nội dung được nói minh nhiên, nhưng vẫn giúp độc giả hiểu qua chú thích.
- issue: Sắc thái của καταφιλέω
  choice: Dịch gọn là ‘hôn’ trong chính văn, kèm chú thích về sắc thái âu yếm hoặc lặp lại.
  alternative: không ngừng phủ đầy chân tôi bằng những nụ hôn
  rationale: Động từ có thể mang sắc thái tăng cường hoặc lặp lại, nhưng mức độ chính xác của cách diễn đạt mạnh hơn không hoàn toàn chắc chắn. Chú thích bảo tồn khả năng này mà không khóa chính văn vào một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘ông’ cho người được Đức Giê-su nói với và ‘người phụ nữ này’ để giữ sắc thái chỉ định, tương phản của nguyên văn mà không áp đặt tuổi tác hay địa vị qua đại từ.
