  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: vi
  text: Vì ông yêu dân tộc chúng ta, và chính ông đã xây[a] hội đường cho chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chính ông đã cho xây hội đường cho chúng ta.” Tiếng Hy Lạp chỉ nói “đã xây”, có thể chỉ việc trực tiếp tham gia hoặc việc bảo trợ, tài trợ xây dựng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: yêu
  rationale: Diễn đạt trực tiếp sức mạnh của động từ ἀγαπάω, không làm nhẹ thành chỉ có thiện cảm hay quan tâm.
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do các trưởng lão Do Thái đưa ra để hỗ trợ lời thỉnh cầu ở câu trước.
- source_word: τὸ ἔθνος ἡμῶν
  choice: dân tộc chúng ta
  rationale: Trong lời của các trưởng lão Do Thái, cụm này chỉ cộng đồng dân tộc của họ; “dân tộc” giữ được sắc thái tập thể và căn tính sắc tộc của ἔθνος.
- source_word: τὴν συναγωγήν
  choice: nhà hội
  rationale: “Nhà hội” là cách gọi tiếng Việt quen thuộc cho nơi hội họp và thờ phượng của cộng đồng Do Thái, đồng thời giữ mạo từ xác định của tiếng Hy Lạp mà không thêm sở hữu từ không có trong nguyên văn.
- source_word: αὐτός
  choice: chính ông
  rationale: 'Giữ sắc thái nhấn mạnh của đại từ αὐτός: người sĩ quan này chính là người đứng ra thực hiện hoặc bảo trợ việc xây dựng.'
- source_word: ᾠκοδόμησεν
  choice: đã xây
  rationale: Phản ánh tự nhiên thì aorist và giữ cách nói đơn giản của nguyên văn, không buộc phải hiểu rằng ông trực tiếp lao động xây dựng.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: 'Dative chỉ lợi ích: nhà hội được xây vì lợi ích của cộng đồng người nói.'
theological_decisions:
- issue: Mức độ trực tiếp của viên sĩ quan trong việc xây nhà hội
  choice: chính ông đã xây
  alternative: chính ông đã cho xây
  rationale: Nguyên văn dùng động từ “xây” cùng đại từ nhấn mạnh nhưng không xác định ông tự tay xây hay bảo trợ/tài trợ. Bản chính giữ cách nói trực tiếp; chú thích bảo tồn khả năng hiểu theo nghĩa bảo trợ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Dân tộc chúng ta” phản ánh cách các trưởng lão Do Thái nói về cộng đồng mình; “nhà hội” giữ thuật ngữ Do Thái quen thuộc. Đại từ “ông” phù hợp khi họ nói kính trọng về viên sĩ quan.
