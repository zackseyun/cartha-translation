  rationale: Bản sửa chỉ thay thuật ngữ chỉ συναγωγή bằng «hội đường», cách gọi hiện đại và đặc hiệu hơn, đồng thời chuyển neo chú thích đến động từ được chú giải. Cấu trúc, mức độ nhấn mạnh, và sự mơ hồ về việc viên sĩ quan trực tiếp xây hay bảo trợ việc xây vẫn được bảo toàn.
