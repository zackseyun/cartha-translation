revisions:
- from: 'Rồi quay về phía người phụ nữ, Đức Giê-su nói với Si-môn: “Ông có thấy người phụ nữ này không? Tôi vào nhà ông, ông đã không cho tôi nước để rửa chân[a]; còn cô ấy đã lấy nước mắt làm ướt chân tôi và lấy tóc mình mà lau.”'
  to: 'Rồi quay về phía người phụ nữ, Đức Giê-su nói với Si-môn: “Ông có thấy người phụ nữ này không? Tôi vào nhà ông, ông đã không cho tôi nước để rửa chân[a]; còn người này đã làm ướt chân tôi bằng nước mắt mình và lấy tóc mình mà lau.”'
  rationale: Bản sửa giữ nguyên ý nghĩa và phong cách chung, nhưng phục hồi sắc thái chỉ định của αὕτη bằng “người này” và làm cho cách diễn đạt về nước mắt tự nhiên hơn trong tiếng Việt. Chú thích được giữ vì nó giải thích hợp lý phần diễn đạt thành ngữ về nước cho chân.
