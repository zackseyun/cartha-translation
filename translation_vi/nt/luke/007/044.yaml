  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: vi
  text: 'Rồi quay về phía người phụ nữ, Đức Giê-su nói với Si-môn: “Ông có thấy người phụ nữ này không? Tôi vào nhà ông, ông đã không cho tôi nước để rửa chân[a]; còn người này đã làm ướt chân tôi bằng nước mắt mình và lấy tóc mình mà lau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “ông đã không cho tôi nước trên chân.” Ý nói đến việc chủ nhà cung cấp nước để khách rửa chân theo phong tục.'
    reason: Giải thích cách chuyển cấu trúc ὕδωρ μοι ἐπὶ πόδας sang tiếng Việt tự nhiên mà không biến việc chủ nhà cung cấp nước thành chính chủ nhà rửa chân cho khách.
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: quay về phía người phụ nữ
  rationale: Diễn đạt tự nhiên hành động Đức Giê-su xoay người hướng về phía người phụ nữ trước khi nói với Si-môn.
- source_word: τῷ Σίμωνι ἔφη
  choice: Đức Giê-su nói với Si-môn
  rationale: Chủ ngữ được nêu rõ theo ngữ cảnh để câu tiếng Việt tự nhiên; thì vị hoàn thành được chuyển bằng quá khứ kể chuyện.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Ông có thấy người phụ nữ này không?
  rationale: Giữ nguyên câu hỏi trực tiếp và sắc thái chỉ định của ταύτην.
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Tôi vào nhà ông
  rationale: Cách nói gọn, tự nhiên, tương ứng trực tiếp với hành động đi vào οἰκία.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: ông đã không cho tôi nước để rửa chân
  rationale: Tiếng Việt cần làm rõ công dụng của nước trong phong tục tiếp khách; nội dung bổ sung được ghi chú với cách dịch sát cấu trúc Hy Lạp.
- source_word: αὕτη δὲ
  choice: còn cô ấy
  rationale: Thể hiện rõ sự tương phản giữa cách Si-môn và người phụ nữ đối đãi với Đức Giê-su.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: đã lấy nước mắt làm ướt chân tôi
  rationale: Giữ nghĩa cụ thể của βρέχω và biểu thị phương tiện bằng cụm 'lấy nước mắt'.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: lấy tóc mình mà lau
  rationale: Cách diễn đạt tự nhiên, giữ tóc là phương tiện và chân là đối tượng được hiểu từ vế trước.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “ông” dành cho Si-môn và “cô ấy” cho người phụ nữ để lời đối thoại tự nhiên, đồng thời vẫn giữ sự tương phản của nguyên văn.
