id: LUK.7.28
reference: Luke 7:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: vi
  text: 'Tôi nói với anh em: trong số những người do phụ nữ sinh ra[a], không ai lớn hơn Gioan; thế nhưng, người nhỏ nhất trong vương quốc của Đức Chúa Trời[b] lại lớn hơn ông.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “những người do phụ nữ sinh ra” là một thành ngữ chỉ loài người nói chung.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch rõ hơn: “người là nhỏ nhất trong vương quốc của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Tôi nói với anh em
  rationale: Giữ tính trực tiếp của công thức diễn ngôn Hy Lạp và thể hiện ὑμῖν là số nhiều bằng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ nguyên lực so sánh mà không tự xác định sự lớn hơn này là về địa vị, đạo đức hay đặc quyền.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: trong số những người do phụ nữ sinh ra
  rationale: Diễn đạt khá sát thành ngữ gốc, đồng thời vẫn rõ nghĩa trong tiếng Việt; chú thích nêu nghĩa khái quát của thành ngữ.
- source_word: Ἰωάννου
  choice: Gioan
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và gần với tên Hy Lạp Ἰωάννης.
- source_word: οὐδείς ἐστιν
  choice: không ai
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho mệnh đề phủ định tồn tại khi đi với phép so sánh.
- source_word: ὁ δὲ μικρότερος
  choice: thế nhưng, người nhỏ nhất
  rationale: Thể hiện δέ theo nghĩa tương phản và dùng cụm danh hóa cho dạng so sánh μικρότερος; không thêm tiêu chí về sự nhỏ hay thấp kém.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: trong vương quốc của Đức Chúa Trời
  rationale: Giữ ý nghĩa không gian/thuộc phạm vi của ἐν và cách gọi quen thuộc cho βασιλεία τοῦ θεοῦ.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: lại lớn hơn ông
  rationale: Đại từ “ông” chỉ về Gioan một cách tự nhiên và kính trọng; “lại” làm rõ nét nghịch lý của phép tương phản mà không giải thích nguyên nhân.
theological_decisions:
- issue: Cơ sở của sự so sánh giữa Gioan và người nhỏ nhất trong vương quốc Đức Chúa Trời
  choice: Giữ nguyên lời khẳng định nghịch lý rằng người nhỏ nhất trong vương quốc lớn hơn Gioan, không xác định phương diện của sự lớn hơn.
  alternative: Giải thích đó là đặc quyền giao ước, vị trí trong lịch sử cứu chuộc, phẩm chất đạo đức hoặc địa vị thuộc linh.
  rationale: Bản Hy Lạp không nói rõ tiêu chí của μείζων; việc thêm một cách giải thích sẽ giải quyết sự căng thẳng thần học vượt quá điều câu văn khẳng định.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Gioan” cho Ἰωάννης và “Đức Chúa Trời” cho θεός. Cấu trúc so sánh được giữ cô đọng, không diễn giải nền tảng thần học của từ “lớn hơn”.
