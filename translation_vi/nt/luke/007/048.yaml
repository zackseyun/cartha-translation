  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: vi
  text: 'Rồi Ngài nói với bà: “Tội lỗi của bà đã được tha.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tội lỗi của bà được tha rồi.” Thể hoàn thành bị động trong tiếng Hy Lạp có thể nhấn mạnh hành động đã hoàn tất cùng với kết quả vẫn còn hiệu lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Động từ aorist của λέγω được chuyển tự nhiên bằng “nói”; chủ ngữ được hiểu từ ngữ cảnh là Chúa Giê-su, và “Ngài” giữ văn phong trang trọng.
- source_word: δὲ
  choice: Rồi
  rationale: δέ là liên từ nhẹ, tiếp nối diễn tiến câu chuyện hơn là biểu thị sự tương phản rõ rệt.
- source_word: αὐτῇ
  choice: với bà
  rationale: Đại từ tặng cách số ít giống cái chỉ người phụ nữ; “nói với bà” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἀφέωνταί
  choice: đã được tha
  rationale: Thể hoàn thành bị động của ἀφίημι diễn tả hành động tha thứ đã hoàn tất và kết quả còn hiệu lực; tiếng Việt dùng “đã được tha” vừa tự nhiên vừa thể hiện rõ phương diện hoàn thành.
- source_word: σου
  choice: của bà
  rationale: Đại từ sở hữu ngôi thứ hai số ít được diễn đạt theo quan hệ xưng hô phù hợp với người phụ nữ trong ngữ cảnh.
- source_word: αἱ ἁμαρτίαι
  choice: Tội lỗi
  rationale: ἁμαρτίαι ở số nhiều chỉ các tội của bà trước Đức Chúa Trời; “tội lỗi của bà” là cách nói tiếng Việt tự nhiên, không cần dịch riêng mạo từ.
theological_decisions:
- issue: Sắc thái của thể hoàn thành bị động Ἀφέωνταί trong lời tuyên bố tha tội
  choice: “Tội lỗi của bà đã được tha.”
  alternative: “Tội lỗi của bà được tha rồi.”
  rationale: “Đã được tha” thể hiện hành động hoàn tất mà không xác định thêm tác nhân hay thời điểm, đồng thời ngữ cảnh vẫn cho thấy kết quả tha thứ đang có hiệu lực. Cách dịch không giải quyết quá mức sự căng thẳng giữa hành động đã hoàn thành và trạng thái hiện tại.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “bà” cho người phụ nữ để giữ sự kính trọng, không thêm danh xưng hay giải thích thần học ngoài nguyên văn.
