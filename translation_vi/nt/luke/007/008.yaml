id: LUK.7.8
reference: Luke 7:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: vi
  text: 'Vì chính tôi cũng là người được đặt dưới quyền, và có binh lính dưới quyền mình. Tôi bảo người này: ‘Đi đi!’ thì người ấy đi; bảo người khác: ‘Đến đây!’ thì người ấy đến; và bảo nô lệ[a] của tôi: ‘Hãy làm việc này!’ thì người ấy làm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp doulos chỉ một người ở địa vị lệ thuộc hoặc thuộc quyền sở hữu, dù trong một số ngữ cảnh có thể được dịch rộng hơn là “đầy tớ”.
    reason: Bảo lưu phương án dịch hợp lệ của δοῦλος và làm rõ thực trạng xã hội mà từ này diễn tả.
lexical_decisions:
- source_word: καὶ γὰρ ἐγὼ
  choice: Vì chính tôi cũng
  rationale: “Vì” giữ chức năng giải thích của γάρ; “chính tôi cũng” thể hiện đại từ ἐγώ được nhấn mạnh cùng sắc thái so sánh của καί.
- source_word: ἄνθρωπός εἰμι
  choice: tôi ... là người
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, vẫn giữ ý người nói là một con người ở trong cơ cấu thẩm quyền.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: được đặt dưới quyền
  rationale: Giữ sắc thái bị động của τασσόμενος và hình ảnh một người được xếp vào hệ thống cấp bậc, thay vì chỉ nói chung chung là “ở dưới quyền”.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: có binh lính dưới quyền mình
  rationale: Diễn đạt rõ quan hệ chỉ huy nhưng không thêm ý vượt quá giới từ ὑπό.
- source_word: λέγω τούτῳ
  choice: Tôi bảo người này
  rationale: “Bảo” tự nhiên hơn “nói với” trong ngữ cảnh ban lệnh; “người này” giữ lực chỉ định của τούτῳ.
- source_word: Πορεύθητι
  choice: Đi đi!
  rationale: Mệnh lệnh trực tiếp, tự nhiên; từ “đi” lặp lại tạo sắc thái khẩu lệnh rõ ràng.
- source_word: ἄλλῳ· Ἔρχου
  choice: 'bảo người khác: ‘Đến đây!’'
  rationale: Giữ thế song song giữa người này và người khác. “Đến đây” là cách ra lệnh tự nhiên trong tiếng Việt và thể hiện hướng về phía người nói vốn có trong ἔρχου.
- source_word: τῷ δούλῳ μου
  choice: nô lệ của tôi
  rationale: δοῦλος chỉ người ở địa vị lệ thuộc hoặc thuộc quyền sở hữu; trong ví dụ về chuỗi quyền hành này, “nô lệ” giữ rõ thực trạng xã hội ấy hơn “đầy tớ”.
- source_word: Ποίησον τοῦτο
  choice: Hãy làm việc này!
  rationale: Giữ mệnh lệnh và đại từ chỉ định τοῦτο bằng một câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch δοῦλος trong ví dụ của viên đại đội trưởng
  choice: nô lệ
  alternative: đầy tớ
  rationale: Trọng tâm của phép so sánh là quyền sai khiến trong một trật tự lệ thuộc, nên “nô lệ” phản ánh rõ hơn địa vị ràng buộc của δοῦλος. Tuy nhiên, vì từ Hy Lạp trong một số ngữ cảnh có thể được diễn đạt rộng hơn là “đầy tớ”, phương án ấy được ghi ở chú thích thay vì bị loại bỏ hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Các vế mệnh lệnh–đáp ứng được giữ song song để tái hiện nhịp lập luận của nguyên văn. Dấu chú thích được đặt ngay sau “nô lệ”, là từ mà chú thích thực sự giải thích.
