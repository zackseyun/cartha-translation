  source_fidelity: Bản dịch truyền đạt chính xác cấu trúc giải thích của καὶ γάρ, sắc thái so sánh/nhấn mạnh của ἐγώ ... καί, tình trạng ‘được đặt dưới quyền’, và chuỗi mệnh lệnh–đáp ứng song song. ‘Nô lệ’ phản ánh trực tiếp δοῦλος trong ngữ cảnh hệ thống quyền hành; chú thích bảo lưu hợp lý phương án ‘đầy tớ’.
  naturalness: Tiếng Việt hiện đại, rõ ràng và có nhịp điệu tự nhiên. Các cách nói ‘bảo người này’, ‘Đi đi’, ‘Đến đây’, và ‘Hãy làm việc này’ phù hợp với ngữ cảnh ra lệnh. Việc lược ‘tôi’ ở các vế sau vẫn sáng nghĩa và giữ được tính song hành.
  terminology: ‘Binh lính’, ‘dưới quyền mình’, và ‘nô lệ’ nhất quán với bối cảnh quân sự–gia hộ của câu. Chú thích dùng thuật ngữ thận trọng, không áp đặt diễn giải thần học hay hiện đại hóa sai lệch thân phận mà δοῦλος chỉ đến.
