  to: Vì thế, tôi cũng không cho mình là xứng đáng để đến gặp ngài. Nhưng xin ngài phán một lời, và xin cho đầy tớ tôi được chữa lành.[a]
  rationale: Bản sửa bỏ yếu tố “chỉ” để không thêm giới hạn vào nguyên văn, diễn đạt ἰαθήτω như một lời thỉnh cầu mệnh lệnh bị động rõ ràng, và điều chỉnh chú thích để bảo toàn độ rộng nghĩa của παῖς mà không suy ra quan hệ cha con.
