source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: vi
  text: Vì thế, tôi cũng không cho mình là xứng đáng để đến gặp ngài. Nhưng xin ngài phán một lời, và xin cho đầy tớ tôi được chữa lành.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cậu bé của tôi” hoặc “đứa trẻ của tôi”; từ Hy Lạp có thể chỉ một đứa trẻ, một người trẻ tuổi hoặc một đầy tớ, tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Vì thế
  rationale: Diễn tả kết luận rút ra từ lời trước, đồng thời giữ mạch liên kết tự nhiên trong tiếng Việt.
- source_word: οὐδὲ
  choice: cũng không
  rationale: Trong ngữ cảnh, cụm này nhấn mạnh rằng người nói thậm chí không tự xem mình xứng đáng đích thân đến gặp Chúa Giê-xu.
- source_word: ἐμαυτὸν ἠξίωσα
  choice: tôi ... không cho mình là xứng đáng
  rationale: Giữ ý tự đánh giá của động từ ἀξιόω và đại từ phản thân, bằng một cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: để đến gặp ngài
  rationale: Diễn đạt việc đích thân đến với Chúa Giê-xu; “gặp” làm rõ đích hướng cá nhân mà không thêm nội dung.
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Giữ rõ sự tương phản giữa việc không dám đến và lời thỉnh cầu tiếp theo.
- source_word: εἰπὲ λόγῳ
  choice: xin ngài chỉ phán một lời
  rationale: Cách nói này truyền đạt lời cầu xin cùng niềm tin vào thẩm quyền của lời Chúa Giê-xu. “Phán” phù hợp với văn phong Kinh Thánh trang trọng, còn “một lời” phản ánh danh từ không có mạo từ.
- source_word: ἰαθήτω
  choice: thì ... được chữa lành
  rationale: Thể mệnh lệnh bị động ngôi thứ ba được diễn đạt tự nhiên như kết quả được khẩn cầu; tránh biến câu thành một lời khẳng định tương lai thuần túy.
- source_word: ὁ παῖς μου
  choice: đầy tớ tôi
  rationale: παῖς có thể chỉ trẻ nhỏ, thiếu niên hoặc đầy tớ. Trong câu chuyện viên đại đội trưởng và người thuộc quyền ông, “đầy tớ” phù hợp nhất với ngữ cảnh; các nghĩa khác được giữ trong chú thích.
theological_decisions:
- issue: Cách dịch παῖς trong câu chuyện viên đại đội trưởng
  choice: đầy tớ tôi
  alternative: con trai tôi; đứa trẻ của tôi
  rationale: Ngữ cảnh về người thuộc quyền viên đại đội trưởng nghiêng về nghĩa “đầy tớ”, nhưng từ Hy Lạp vẫn có thể mang nghĩa chỉ một đứa trẻ hoặc người con. Chú thích giữ lại độ rộng nghĩa thay vì quyết định quá mức.
- issue: Lực ngữ pháp của ἰαθήτω
  choice: thì ... được chữa lành
  alternative: sẽ được chữa lành
  rationale: Nguyên văn dùng mệnh lệnh bị động ngôi thứ ba, nên bản dịch giữ sắc thái cầu xin một kết quả xảy ra, thay vì chuyển hẳn thành câu trần thuật tương lai.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ “tôi—ngài” phù hợp với lời viên đại đội trưởng nói cách kính trọng với Chúa Giê-xu. Cụm “xin ngài chỉ phán một lời” vừa tự nhiên vừa giữ trọng lượng của lời nói có thẩm quyền.
