  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: vi
  text: 'Có hai người mắc nợ một người cho vay tiền: một người nợ năm trăm đê-na-ri[a], còn người kia nợ năm mươi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một đê-na-ri là đồng bạc La Mã thông dụng, thường tương đương khoảng tiền công một ngày của một người lao động.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: người mắc nợ
  rationale: Diễn đạt trực tiếp những người đang mang một khoản nợ; tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δανιστῇ τινι
  choice: một người cho vay tiền
  rationale: δανιστής chỉ người cho vay tiền; τινι giới thiệu một nhân vật không xác định trong câu chuyện.
- source_word: ὤφειλεν
  choice: nợ
  rationale: Thì chưa hoàn thành mô tả tình trạng mắc nợ; tiếng Việt diễn đạt tự nhiên bằng động từ đơn “nợ”.
- source_word: δηνάρια
  choice: đê-na-ri
  rationale: Giữ tên đơn vị tiền tệ lịch sử thay vì đổi thành một giá trị hiện đại; chú thích cung cấp bối cảnh văn hóa.
- source_word: πεντακόσια
  choice: năm trăm
  rationale: Chuyển dịch trực tiếp số từ.
- source_word: ἕτερος
  choice: người kia
  rationale: Thể hiện tự nhiên cặp đối ứng ὁ εἷς… ὁ δὲ ἕτερος, “một người… còn người kia”.
- source_word: πεντήκοντα
  choice: năm mươi
  rationale: Chuyển dịch trực tiếp số từ; đơn vị đê-na-ri được hiểu từ vế trước nên không cần lặp lại.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, tự nhiên và dễ hiểu. Cấu trúc “một người… còn người kia” giữ rõ thế đối chiếu của nguyên văn; tên đơn vị tiền tệ cổ được phiên âm và giải thích trong chú thích.
