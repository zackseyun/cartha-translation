  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc và ý nghĩa của nguyên văn: hai người cùng mắc nợ một người cho vay; khoản nợ lần lượt là năm trăm và năm mươi đê-na-ri. Cặp đối chiếu “một người… còn người kia” phản ánh rõ ὁ εἷς… ὁ δὲ ἕτερος. Việc không lặp lại “đê-na-ri” ở vế sau là tự nhiên và không làm mất nghĩa.'
