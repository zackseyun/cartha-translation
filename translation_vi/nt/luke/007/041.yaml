  terminology: “Người mắc nợ,” “người cho vay tiền,” và “đê-na-ri” là các lựa chọn chính xác. Chú thích giải thích hợp lý đơn vị tiền tệ cổ, không đồng nhất nó một cách tuyệt đối với tiền công một ngày.
