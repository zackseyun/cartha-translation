id: LUK.7.12
reference: Luke 7:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: vi
  text: Khi Ngài đến gần cổng thành thì kìa, một người chết đang được khiêng ra—người con trai duy nhất[a] của mẹ mình; bà là một góa phụ. Một đám đông khá lớn gồm người trong thành đi cùng bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “người con trai độc nhất của bà.”'
    reason: Nêu một cách diễn đạt tương đương cho μονογενὴς υἱός, nhấn mạnh rằng bà không có người con nào khác.
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Khi Ngài đến gần
  rationale: Diễn đạt tự nhiên mệnh đề thời gian và động tác tiến đến; sắc thái nối tiếp nhẹ của δέ được hòa vào mạch kể tiếng Việt.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: cổng thành
  rationale: Cách nói gọn, tự nhiên trong tiếng Việt, chỉ cổng ra vào của thành phố mà không làm mất ý nghĩa của cấu trúc Hy Lạp.
- source_word: καὶ ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng của ἰδού là hướng sự chú ý đến một cảnh tượng bất ngờ trong diễn tiến câu chuyện.
- source_word: ἐξεκομίζετο
  choice: người ta đang khiêng ra
  rationale: Thể chưa hoàn thành bị động mô tả hành động đang diễn ra. Cấu trúc chủ động phiếm chỉ bằng “người ta” tự nhiên trong tiếng Việt và vẫn giữ trọng tâm nơi người chết được đưa ra khỏi thành.
- source_word: τεθνηκώς
  choice: một người đã chết
  rationale: Phân từ hoàn thành chỉ người đang ở trong tình trạng đã chết; cách dịch này rõ ràng và trang trọng vừa phải.
- source_word: μονογενὴς υἱός
  choice: người con trai duy nhất
  rationale: Trong ngữ cảnh gia đình này, μονογενής cho biết bà mẹ không còn người con nào khác, còn υἱός xác định đó là con trai.
- source_word: τῇ μητρὶ αὐτοῦ
  choice: của mẹ mình
  rationale: 'Dữ cách biểu thị quan hệ: người đã chết là con trai duy nhất của mẹ ông. “Mình” quy chiếu tự nhiên về người con trong tiếng Việt.'
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: bà lại là một góa phụ
  rationale: Giữ sự nhấn mạnh vào chính người mẹ và bổ sung hoàn cảnh đau thương của bà; “lại” chuyển tải lực nối tiếp của καί một cách tự nhiên.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: khá đông người trong thành
  rationale: ἱκανός ở đây chỉ số lượng đáng kể. Cách diễn đạt này tự nhiên hơn lối dịch danh từ cứng “một đám đông đáng kể” và không cường điệu thành một đoàn cực lớn.
- source_word: ἦν σὺν αὐτῇ
  choice: đi cùng bà
  rationale: Sύν với dữ cách diễn tả sự tháp tùng; trong bối cảnh tang lễ, “đi cùng bà” rõ và tự nhiên hơn “ở với bà”.
theological_decisions:
- issue: Ý nghĩa của μονογενής trong ngữ cảnh không trực tiếp nói về Đấng Christ
  choice: người con trai duy nhất
  alternative: người con trai độc nhất của bà
  rationale: Ở đây từ này mô tả quan hệ gia đình của người góa phụ và có nghĩa thông thường là người con duy nhất. Bản dịch không đưa vào câu này các sắc thái thần học phát sinh từ cách dùng từ ấy ở những ngữ cảnh khác.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho chủ thể đã được xác định trong văn cảnh. Dấu gạch ngang làm rõ phần đồng vị mô tả người đã chết; dấu chấm phẩy phân tách hoàn cảnh của người mẹ. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
