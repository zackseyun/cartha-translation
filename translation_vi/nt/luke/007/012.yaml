revisions:
- from: Khi Ngài đến gần cổng thành, kìa, người ta đang khiêng ra một người đã chết—người con trai duy nhất[a] của mẹ mình; bà lại là một góa phụ. Có khá đông người trong thành đi cùng bà.
  to: Khi Ngài đến gần cổng thành thì kìa, một người chết đang được khiêng ra—người con trai duy nhất[a] của mẹ mình; bà là một góa phụ. Một đám đông khá lớn gồm người trong thành đi cùng bà.
  rationale: Bản sửa giữ nguyên nghĩa và trình tự thông tin của nguyên văn, nhưng dùng cấu trúc bị động tiếng Việt trôi chảy hơn, bỏ sắc thái không cần thiết của “lại,” và phục hồi rõ ý ‘đám đông’ của ὄχλος. Đại từ “mình” trong “mẹ mình” quy chiếu về người con đã chết và giữ quan hệ sở thuộc của τῇ μητρὶ αὐτοῦ một cách tự nhiên.
  reviewer_model: gpt-5.6-terra
