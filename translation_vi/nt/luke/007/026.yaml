  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: vi
  text: Nhưng anh em đã đi ra để xem gì? Một nhà tiên tri chăng? Phải, tôi nói với anh em, và còn hơn cả một nhà tiên tri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một điều gì đó hơn cả một nhà tiên tri.” Dạng so sánh trung tính trong tiếng Hy Lạp cho phép cách hiểu này, nhưng “hơn cả một nhà tiên tri” tự nhiên hơn trong tiếng Việt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ đối lập, chuyển sang câu hỏi tu từ tiếp theo và giữ mối tương phản với câu trước.
- source_word: τί
  choice: gì
  rationale: Đại từ nghi vấn làm bổ ngữ cho ý 'xem'; ở đây có nghĩa là 'gì', không phải 'tại sao'.
- source_word: ἐξήλθατε
  choice: anh em đã đi ra
  rationale: Động từ aorist, ngôi thứ hai số nhiều; cách dịch này diễn đạt hành động trong quá khứ và giữ lời nói trực tiếp với đám đông.
- source_word: ἰδεῖν
  choice: để xem
  rationale: Động từ nguyên mẫu chỉ mục đích sau 'đi ra'; 'để xem' tự nhiên và chính xác trong tiếng Việt.
- source_word: προφήτην
  choice: một nhà tiên tri
  rationale: Danh từ số ít dùng trong câu hỏi tỉnh lược; đây là danh từ chung, không phải một tước hiệu riêng.
- source_word: ναί
  choice: Phải
  rationale: Lời khẳng định trực tiếp, mạnh, đáp lại câu hỏi tu từ; 'Phải' phù hợp với văn phong trang trọng mà vẫn dễ hiểu.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ sát công thức diễn ngôn quen thuộc trong các sách Phúc Âm và lời xưng hô số nhiều.
- source_word: καὶ
  choice: và
  rationale: Giữ chức năng liên kết của liên từ, nối lời xác nhận với nhận định cao hơn tiếp theo.
- source_word: περισσότερον προφήτου
  choice: còn hơn cả một nhà tiên tri
  rationale: Diễn đạt tự nhiên phép so sánh với sở hữu cách trong tiếng Hy Lạp, đồng thời không giải thích thêm bản chất sự vượt trội ấy.
theological_decisions:
- issue: Địa vị của Giăng Báp-tít trong lời mô tả của Đức Giê-su
  choice: Giữ lời khẳng định rằng ông là nhà tiên tri và còn hơn cả một nhà tiên tri, nhưng không xác định trong câu này ông vượt trội theo nghĩa nào.
  alternative: Diễn giải ông là nhà tiên tri lớn nhất hoặc xác định rõ ông là sứ giả thời cuối cùng.
  rationale: Bản văn chỉ nêu phép so sánh ngắn gọn; ngữ cảnh kế tiếp sẽ giải thích thêm. Bản dịch không nên đưa phần giải nghĩa thần học đó vào chính câu này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để thể hiện ngôi thứ hai số nhiều mà tránh đại từ cổ; giữ chuỗi câu hỏi tu từ và cách nói cô đọng của nguyên văn.
