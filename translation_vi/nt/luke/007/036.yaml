revisions:
- from: Một người trong nhóm Pha-ri-si mời Ngài dùng bữa cùng mình.[a] Ngài vào nhà người Pha-ri-si ấy và ngả mình dự tiệc.[b]
  to: Một người trong số những người Pha-ri-si mời Ngài dùng bữa với ông ấy.[a] Ngài vào nhà người Pha-ri-si ấy và ngả mình dùng bữa.[b]
  rationale: Sửa “trong nhóm” thành cấu trúc phân bộ trực tiếp “trong số những người”, làm rõ đại từ trong chú thích a, và thay “dự tiệc” bằng “dùng bữa” để không thêm mức độ trang trọng/bản chất yến tiệc không được xác định trong câu. Trình tự vào nhà rồi ngả mình vẫn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:37:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng ý chính: một thành viên nhóm Pha-ri-si mời Đức Giê-su dùng bữa; Ngài vào nhà ông và nhận tư thế dùng bữa theo tập tục. Tuy nhiên, “ngả mình dự tiệc” thêm nhẹ ý ‘tiệc’ (không được nêu rõ trong nguyên ngữ), và chú thích a hiện dùng “mình” có thể mơ hồ về người quy chiếu. Bản sửa giữ cách diễn đạt tự nhiên đồng thời tránh các thêm thắt này.'
  naturalness: Câu văn hiện đại và trang trọng vừa phải. “Một người trong số những người Pha-ri-si” là cách diễn đạt phân bộ trực tiếp, tự nhiên hơn “trong nhóm Pha-ri-si”. “Ngả mình dùng bữa” dễ hiểu khi đi cùng chú thích văn hóa.
  terminology: Giữ “Pha-ri-si” và “Ngài”, phù hợp với lối dùng quen thuộc trong bản văn Kinh Thánh tiếng Việt. “Dùng bữa” phản ánh φάγῃ mà không nâng thành một bữa tiệc. Chú thích b giải thích đúng nghĩa văn hóa của κατεκλίθη.
  issues:
  - severity: low
    issue: “dự tiệc” có thể gợi một yến tiệc trang trọng hơn điều bản Hy Lạp trực tiếp nói.
    rationale: κατεκλίθη mô tả việc ngả mình để dùng bữa; câu này không tự nó xác định bữa ấy là ‘tiệc’.
  - severity: low
    issue: Chú thích a dùng “cùng mình” có tham chiếu đại từ chưa thật rõ trong văn bản độc lập.
    rationale: Đổi thành “cùng ông ấy” xác định người Pha-ri-si là người chủ lời mời, phản ánh μετ’ αὐτοῦ.
