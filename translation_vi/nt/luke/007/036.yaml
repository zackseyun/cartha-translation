base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: vi
  text: Một người trong số những người Pha-ri-si mời Ngài dùng bữa với ông ấy.[a] Ngài vào nhà người Pha-ri-si ấy và ngả mình dùng bữa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, dịch sát hơn: “xin Ngài dùng bữa cùng ông ấy.”'
    reason: lexical_alternative
  - marker: b
    text: Theo tập tục trong những bữa ăn trang trọng thời ấy, người ta thường nằm nghiêng hoặc ngả mình bên bàn ăn thay vì ngồi thẳng trên ghế.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: mời
  rationale: Động từ ở thì chưa hoàn thành có nghĩa đen là “đang xin/đề nghị”; trong ngữ cảnh dùng bữa, “mời” diễn đạt tự nhiên chức năng của lời đề nghị mà không thêm sắc thái ép buộc hay nài nỉ.
- source_word: δέ
  choice: không biểu hiện bằng một từ riêng
  rationale: Đây là liên từ nhẹ nối tiếp câu chuyện. Trong tiếng Việt, mở câu trực tiếp bằng “Một người...” giữ mạch kể tự nhiên hơn và tránh thêm sắc thái thời gian hoặc tương phản không có trong nguồn.
- source_word: τις ... τῶν Φαρισαίων
  choice: một người trong nhóm Pha-ri-si
  rationale: Cụm sở hữu phân bộ chỉ một thành viên trong số những người Pha-ri-si. Cách dịch này rõ ràng, tự nhiên và giữ tên gọi quen thuộc của nhóm.
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: dùng bữa cùng mình
  rationale: Cấu trúc ἵνα với động từ giả định diễn tả nội dung/mục đích của lời mời. “Dùng bữa” trang trọng vừa phải; “cùng mình” làm rõ người Pha-ri-si mời Ngài ăn với chính ông.
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: Ngài vào nhà người Pha-ri-si ấy
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính. Trật tự tiếng Việt đã tự nhiên thể hiện chuỗi hành động nên không cần cấu trúc nặng như “sau khi đã vào”.
- source_word: κατεκλίθη
  choice: ngả mình dự tiệc
  rationale: Động từ chỉ tư thế nằm nghiêng/ngả mình theo tập tục dùng bữa trang trọng thời ấy. Cách dịch tránh hình ảnh hiện đại là ngồi vào bàn nhưng vẫn cho thấy đây là tư thế trong bữa ăn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Đức Giê-su dù câu Hy Lạp dùng đại từ, đồng thời tránh lặp danh xưng. “Pha-ri-si” là dạng phiên âm quen thuộc. Các câu được tách để tiếng Việt sáng rõ mà vẫn giữ nguyên trình tự hành động.
