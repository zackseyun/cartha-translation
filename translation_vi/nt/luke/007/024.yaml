  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: vi
  text: 'Sau khi các sứ giả của Giăng đã đi khỏi, Đức Giê-su bắt đầu nói với đám đông về Giăng: “Anh em đã đi vào hoang mạc để xem gì? Một cây sậy bị gió lay động sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Sau khi ... đã đi khỏi
  rationale: Phân từ bất định trong kết cấu sở hữu cách tuyệt đối diễn tả thời gian và hành động xảy ra trước lúc Đức Giê-su bắt đầu nói.
- source_word: ἀγγέλων
  choice: các sứ giả
  rationale: Trong ngữ cảnh, đây là những người được Giăng sai đến, không phải các thiên sứ.
- source_word: Ἰωάννου
  choice: của Giăng / về Giăng
  rationale: Sở hữu cách trước hết chỉ quan hệ sở hữu với các sứ giả, rồi đi với περί để chỉ chủ đề Đức Giê-su nói đến.
- source_word: ἤρξατο λέγειν
  choice: bắt đầu nói
  rationale: Giữ nguyên sắc thái khởi đầu của kết cấu và diễn đạt tự nhiên trong tiếng Việt.
- source_word: πρὸς τοὺς ὄχλους
  choice: với đám đông
  rationale: πρός với động từ nói chỉ đối tượng được nói với; danh từ Hy Lạp ở số nhiều, nhưng tiếng Việt tự nhiên dùng danh từ tập hợp “đám đông”.
- source_word: περὶ Ἰωάννου
  choice: về Giăng
  rationale: Diễn đạt trực tiếp chủ đề của lời nói.
- source_word: Τί ἐξήλθατε
  choice: Anh em đã đi ... để xem gì?
  rationale: τί hỏi về đối tượng họ đi xem, không chủ yếu hỏi lý do; chuyển vị trí “gì” theo cú pháp tự nhiên của tiếng Việt.
- source_word: εἰς τὴν ἔρημον
  choice: vào hoang mạc
  rationale: Chỉ vùng hoang vắng gắn với chức vụ của Giăng; “hoang mạc” tự nhiên và không nhất thiết hàm ý một sa mạc toàn cát.
- source_word: θεάσασθαι
  choice: để xem
  rationale: Diễn đạt mục đích và ý nhìn thấy hoặc quan sát; “xem” là từ hiện đại, tự nhiên trong câu hỏi tu từ.
- source_word: κάλαμον
  choice: một cây sậy
  rationale: Giữ hình ảnh thực vật cụ thể, qua đó gợi tính dễ lay động.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: bị gió lay động
  rationale: Giữ cấu trúc bị động và hình ảnh cây sậy chuyển động dưới tác động của gió.
theological_decisions:
- issue: Sức gợi ẩn dụ của câu hỏi tu từ về Giăng
  choice: Giữ nguyên hình ảnh “Một cây sậy bị gió lay động sao?”
  alternative: Diễn giải thành “Một người yếu đuối hay dao động sao?”
  rationale: Nguyên văn để người nghe tự suy ra hàm ý về sự thiếu kiên định; bản dịch không nên giải quyết ẩn dụ ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để nêu rõ chủ thể vốn được hàm ẩn trong động từ Hy Lạp và đã hiện diện trong ngữ cảnh; dùng “anh em” làm đại từ số nhiều bao quát khi Đức Giê-su nói với đám đông. Không thêm chú thích vì biến thể nghĩa của θεάσασθαι có thể được thể hiện đầy đủ bằng từ “xem” trong tiếng Việt.
