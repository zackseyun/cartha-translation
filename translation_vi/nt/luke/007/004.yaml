  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: vi
  text: 'Khi đến gặp Giê-su, họ tha thiết nài xin Ngài: “Ông ấy xứng đáng để Ngài làm điều này cho ông ấy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: đến gặp
  rationale: Phân từ chỉ việc họ đến nơi và hiện diện trước Đức Chúa Jêsus; “đến gặp” tự nhiên trong tiếng Việt và thể hiện rõ hướng đến một người.
- source_word: παρεκάλουν
  choice: khẩn cầu
  rationale: Động từ diễn tả một lời thỉnh cầu vừa kính trọng vừa cấp thiết; “khẩn cầu” giữ được cả sắc thái nài xin lẫn mức độ trang trọng.
- source_word: σπουδαίως
  choice: tha thiết
  rationale: Trạng từ nhấn mạnh sự sốt sắng và nghiêm túc của lời cầu xin; “tha thiết” là cách kết hợp tự nhiên với “khẩn cầu” trong tiếng Việt.
- source_word: Ἄξιός
  choice: xứng đáng
  rationale: Giữ nguyên lời đánh giá của những người nói rằng viên đại đội trưởng đáng được nhận sự giúp đỡ.
- source_word: ᾧ
  choice: cho ông ấy
  rationale: Đại từ quan hệ cách dữ chỉ viên đại đội trưởng; trong tiếng Việt, quan hệ này được diễn đạt tự nhiên bằng “cho ông ấy” với động từ “làm”.
- source_word: παρέξῃ
  choice: Ngài làm
  rationale: παρέχω ở đây nói đến việc thực hiện hoặc ban điều đang được thỉnh cầu. “Làm điều này cho ông ấy” vừa sát nghĩa vừa tự nhiên, không buộc phải hiểu theo nghĩa ban tặng một vật.
- source_word: τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định quy chiếu đến việc chữa lành đã được xin trong ngữ cảnh; bản dịch giữ cách nói khái quát của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng hô kính trọng; dùng “ông ấy” cho viên đại đội trưởng để tránh sắc thái miệt thị hoặc quá thân mật. Cấu trúc giữ nguyên sức nặng trong lời xác nhận rằng ông ấy “xứng đáng” mà không giải thích thêm về bản chất của sự xứng đáng.
