source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: vi
  text: 'Ngài tiến lại gần, chạm vào chiếc cáng; những người khiêng cáng dừng lại. Ngài nói: “Này chàng trai, Ta bảo cậu: Hãy trỗi dậy!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: đến gần
  rationale: Phân từ bất định quá khứ của προσέρχομαι diễn tả việc Đức Giê-su tiến đến trước khi chạm vào cáng; “đến gần” tự nhiên và giữ được trình tự hành động.
- source_word: ἥψατο
  choice: chạm vào
  rationale: Trong cấu trúc này, ἅπτω có nghĩa là chạm vào hoặc nắm lấy. “Chạm vào” phù hợp với cảnh huống mà không cường điệu thành một hành động nắm giữ kéo dài.
- source_word: σοροῦ
  choice: cáng tang
  rationale: σορός ở đây chỉ cáng hoặc khung dùng để khiêng người chết trong đoàn đưa tang, không nhất thiết là quan tài đóng kín theo nghĩa hiện đại. “Cáng tang” vừa tương đối chính xác vừa dễ hiểu.
- source_word: οἱ δὲ βαστάζοντες
  choice: những người đang khiêng cáng
  rationale: Cụm này chỉ những người khiêng vật đã được nhắc đến. Lặp lại “cáng” giúp câu tiếng Việt rõ nghĩa và tự nhiên.
- source_word: ἔστησαν
  choice: liền dừng lại
  rationale: Động từ ἵστημι trong ngữ cảnh này diễn tả việc những người khiêng ngừng bước và đứng yên. “Dừng lại” truyền đạt rõ kết quả của hành động, còn “liền” làm nổi bật phản ứng trực tiếp trong mạch kể.
- source_word: Νεανίσκε
  choice: Này chàng trai
  rationale: Dạng hô cách số ít của νεανίσκος là lời gọi trực tiếp một người nam trẻ tuổi. “Chàng trai” tự nhiên trong tiếng Việt và vẫn giữ sắc thái trang trọng vừa phải.
- source_word: σοὶ λέγω
  choice: Ta bảo anh
  rationale: Đại từ dữ cách σοὶ được nêu rõ tạo sự trực tiếp và nhấn mạnh người được truyền lệnh. “Ta bảo anh” giữ được trọng tâm ấy và phù hợp với giọng phán trang nghiêm trong trình thuật.
- source_word: ἐγέρθητι
  choice: Hãy trỗi dậy
  rationale: Mệnh lệnh cách bất định quá khứ của ἐγείρω có thể mang hình thức thụ động nhưng trong lời truyền trực tiếp ở đây có nghĩa hãy đứng dậy hoặc trỗi dậy. “Hãy trỗi dậy” giữ được sức nặng trang nghiêm và thích hợp với việc người chết được gọi sống lại, mà không giải thích thêm vào bản văn.
theological_decisions:
- issue: Sắc thái mệnh lệnh của Đức Giê-su đối với người đã chết
  choice: Dịch ἐγέρθητι là “Hãy trỗi dậy”
  alternative: “Hãy đứng dậy” hoặc “Hãy được khiến sống dậy”
  rationale: “Hãy trỗi dậy” giữ giọng trang nghiêm và thẩm quyền của lời truyền, đồng thời không biến hình thức Hy Lạp thành một câu bị động gượng gạo trong tiếng Việt. Bản dịch không thêm lời giải thích thần học về cơ chế của phép lạ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta” trong lời trực tiếp để giữ sắc thái tôn kính; câu nói ngắn, mạnh, phù hợp với nhịp của nguyên văn.
