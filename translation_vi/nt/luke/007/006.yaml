source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: vi
  text: 'Vậy, Giê-su đi cùng họ. Khi Ngài còn cách nhà không xa, viên đại đội trưởng sai những người bạn đến nói với Ngài: “Lạy Chúa[a], xin đừng nhọc công, vì tôi không xứng đáng[b] để Ngài vào dưới mái nhà tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa ngài.” Từ Hy Lạp κύριε là lời xưng hô kính trọng và cũng có thể hàm ý nhìn nhận thẩm quyền của Giê-su.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “không đủ tư cách” hoặc “không thích hợp.” Từ Hy Lạp có thể nói đến sự đầy đủ, thích hợp hoặc xứng đáng; ở đây lời này bày tỏ sự khiêm nhường của viên đại đội trưởng trước Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: đi
  rationale: Động từ ở thì chưa hoàn thành thuật lại việc Đức Chúa Jêsus đang trên đường; “đi” tự nhiên trong mạch kể tiếng Việt.
- source_word: σὺν αὐτοῖς
  choice: cùng họ
  rationale: Diễn đạt trực tiếp ý đồng hành.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: khi Ngài đã đến cách nhà không xa
  rationale: Giữ cấu trúc thời gian và cách nói phủ định “không xa,” đồng thời diễn đạt tự nhiên sự tiến gần đến nhà.
- source_word: ἔπεμψεν φίλους
  choice: sai mấy người bạn đến
  rationale: “Sai ... đến” phù hợp văn cảnh cử người mang lời; “mấy” diễn đạt số nhiều không xác định một cách tự nhiên, không ấn định con số.
- source_word: ὁ ἑκατοντάρχης
  choice: viên đại đội trưởng
  rationale: Chỉ sĩ quan chỉ huy khoảng một trăm quân trong quân đội La Mã; cách gọi này rõ nghĩa với độc giả Việt hiện đại.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ danh xưng “Chúa” và sắc thái kính cẩn của lời thưa trực tiếp; vẫn để ngỏ khả năng đây là cách xưng hô tôn kính hoặc sự nhìn nhận thẩm quyền sâu hơn.
- source_word: μὴ σκύλλου
  choice: xin đừng nhọc công
  rationale: Thành ngữ tự nhiên, kính trọng trong tiếng Việt, truyền đạt ý xin người kia đừng tự làm phiền hoặc vất vả.
- source_word: ἱκανός εἰμι
  choice: tôi không xứng đáng
  rationale: Trong ngữ cảnh này, ἱκανός diễn tả sự không đủ tư cách hoặc không xứng; lựa chọn này truyền đạt sự khiêm nhường của viên sĩ quan.
- source_word: ἵνα ... εἰσέλθῃς
  choice: để Ngài bước vào
  rationale: Diễn đạt tự nhiên nội dung điều mà người nói tự nhận mình không xứng đáng được nhận.
- source_word: ὑπὸ τὴν στέγην μου
  choice: dưới mái nhà tôi
  rationale: Giữ hình ảnh cụ thể và thành ngữ của nguyên văn thay vì diễn giải đơn thuần là “vào nhà tôi.”
theological_decisions:
- issue: Cách dịch κύριος khi viên đại đội trưởng thưa trực tiếp với Đức Chúa Jêsus
  choice: Lạy Chúa
  alternative: Thưa ngài
  rationale: “Lạy Chúa” bảo tồn danh xưng κύριος và khả năng hàm ý nhìn nhận thẩm quyền của Đức Chúa Jêsus, nhưng chú thích cho biết từ này cũng có thể chỉ là lời xưng hô kính trọng trong văn cảnh.
- issue: Sắc thái của ἱκανός trong lời tự nhận của viên đại đội trưởng
  choice: không xứng đáng
  alternative: không đủ tư cách
  rationale: “Không xứng đáng” phù hợp sắc thái khiêm nhường và quan hệ xã hội trong câu, nhưng không loại bỏ nghĩa căn bản về sự thích hợp hay đủ tư cách.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ “Ngài” theo lối Kinh Thánh Tin Lành Việt ngữ quen thuộc; lời “Lạy Chúa” giữ sự kính cẩn. Cụm “dưới mái nhà tôi” bảo tồn hình ảnh của nguyên văn.
