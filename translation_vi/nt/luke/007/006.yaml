revisions:
- from: 'Vậy, Đức Chúa Jêsus đi cùng họ. Nhưng khi Ngài đã đến cách nhà không xa, viên đại đội trưởng sai mấy người bạn đến thưa với Ngài: “Lạy Chúa[a], xin đừng nhọc công, vì tôi không xứng đáng[b] để Ngài bước vào dưới mái nhà tôi.”'
  to: 'Vậy, Giê-su đi cùng họ. Khi Ngài còn cách nhà không xa, viên đại đội trưởng sai những người bạn đến nói với Ngài: “Lạy Chúa[a], xin đừng nhọc công, vì tôi không xứng đáng[b] để Ngài vào dưới mái nhà tôi.”'
  rationale: Bản sửa bảo toàn tình trạng Giê-su còn ở gần, chứ chưa đến nhà; tránh đưa thêm tước hiệu vào phần trần thuật không có trong tiếng Hy Lạp; đồng thời giữ nguyên sắc thái kính cẩn và các khả năng ngữ nghĩa được nêu trong chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:22Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mạch chính và giữ được cách xưng hô kính trọng. Tuy nhiên, «Ngài đã đến cách nhà không xa» dễ hiểu là Ngài đã tới nơi nào đó, trong khi mệnh đề tuyệt đối γενική cho biết Ngài vẫn còn cách nhà một quãng không xa. Ngoài ra, «Đức Chúa Jêsus» thêm danh xưng «Chúa» vào chỗ nguyên văn chỉ có tên Ἰησοῦς; không nên thêm danh xưng này vào lời người kể.
  naturalness: '«Khi Ngài còn cách nhà không xa» tự nhiên và chính xác hơn. «Sai những người bạn đến nói với Ngài» rõ quan hệ cú pháp: viên đại đội trưởng sai bạn mình đi chuyển lời cho Giê-su. «Vào dưới mái nhà tôi» giữ hình ảnh nguyên ngữ mà vẫn tự nhiên hơn «bước vào dưới mái nhà tôi».'
  terminology: Dùng «Giê-su» là dạng chính tả hiện đại phổ thông và không thêm tước hiệu ngoài nguyên văn. «Viên đại đội trưởng», «Lạy Chúa», «không xứng đáng», và «dưới mái nhà tôi» đều phù hợp; chú thích về κύριε và ἱκανός cần được giữ tại đúng các neo tương ứng.
  issues:
  - severity: medium
    issue: «Ngài đã đến cách nhà không xa» không phản ánh chính xác trạng thái đang ở gần nhà.
    rationale: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας nghĩa là khi Ngài đã/đang còn cách nhà không xa, không phải đã đến.
  - severity: medium
    issue: «Đức Chúa Jêsus» trong câu trần thuật thêm «Chúa» không có trong ὁ ... Ἰησοῦς.
    rationale: Nguyên văn tại đây chỉ nêu tên Giê-su; danh xưng κύριε xuất hiện sau đó trong lời viên đại đội trưởng và nên được dịch ở đó.
  - severity: low
    issue: «mấy người bạn» thêm sắc thái số lượng không cần thiết.
    rationale: φίλους là số nhiều không xác định; «những người bạn» chuyển tải số nhiều mà không gợi một số ít cụ thể.
