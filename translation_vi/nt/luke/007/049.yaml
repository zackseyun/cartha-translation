  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: vi
  text: 'Những người cùng dự tiệc với Ngài bắt đầu nói với nhau[a]: “Người này là ai mà lại còn tha tội nữa?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nói trong lòng mình.” Cách diễn đạt Hy Lạp có thể chỉ sự tự nhủ trong lòng hoặc sự trao đổi giữa những người dự tiệc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: bắt đầu
  rationale: Giữ nguyên sắc thái khởi đầu hành động của ἤρξαντο đi với động từ nguyên mẫu.
- source_word: οἱ συνανακείμενοι
  choice: những người cùng dự tiệc với Ngài
  rationale: Trong bối cảnh cổ đại, từ này chỉ những người cùng ngả mình dùng bữa; tiếng Việt tự nhiên diễn đạt là “cùng dự tiệc”, vừa giữ bối cảnh bữa ăn vừa tránh hình ảnh sai là ngồi bàn theo lối hiện đại.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: nói với nhau
  rationale: Với chủ ngữ số nhiều, cách dịch này tự nhiên và phù hợp khả năng họ trao đổi trong nhóm; chú thích giữ lại khả năng câu Hy Lạp nói đến lời tự nhủ hay suy nghĩ trong lòng.
- source_word: Τίς οὗτός ἐστιν
  choice: Người này là ai
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà không thêm một danh xưng giải thích hay xác định căn tính của nhân vật.
- source_word: καὶ
  choice: lại còn
  rationale: Thể hiện sắc thái tăng tiến và kinh ngạc của καί trong câu hỏi.
- source_word: ἁμαρτίας ἀφίησιν
  choice: tha tội
  rationale: Đây là cách diễn đạt tiếng Việt rõ ràng, quen thuộc và đúng với nghĩa tha thứ tội lỗi của ἀφίημι trong ngữ cảnh.
theological_decisions:
- issue: Hàm ý về thẩm quyền tha tội của Chúa Giê-su
  choice: 'Giữ nguyên câu hỏi kinh ngạc: “Người này là ai mà lại còn tha tội nữa?”'
  alternative: Diễn giải rõ người này có thẩm quyền thuộc về Đức Chúa Trời
  rationale: Câu này gợi lên vấn đề về căn tính và thẩm quyền của Chúa Giê-su nhưng không tự đưa ra lời giải thích; bản dịch giữ nguyên sức căng thần học thay vì thêm kết luận giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cùng dự tiệc” truyền đạt tự nhiên bối cảnh dùng bữa thay vì dịch sát tư thế cổ đại là ngả mình bên bàn. Đại từ “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt mà không giải thích thêm nội dung thần học.
