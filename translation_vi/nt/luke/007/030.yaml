  source_fidelity: Bản dịch phản ánh đúng tương phản của δέ, nhóm người Pha-ri-si và các chuyên gia Luật pháp, cùng ý chính họ bác bỏ ý định của Đức Chúa Trời liên hệ đến họ. Tuy nhiên, “vì họ không chịu nhận phép báp-têm” biến phân từ bị động μὴ βαπτισθέντες thành một mệnh đề nguyên nhân rõ rệt và thêm sắc thái chủ động “không chịu” không được phát biểu trong câu Hy Lạp.
  naturalness: “Các chuyên gia Luật pháp,” “khước từ,” và “ý định của Đức Chúa Trời” là tự nhiên trong tiếng Việt tiêu chuẩn hiện đại. Cấu trúc “họ không được ông làm phép báp-têm” tự nhiên, giữ được thể bị động, và không buộc phải xác định quan hệ cú pháp của phân từ là nguyên nhân.
