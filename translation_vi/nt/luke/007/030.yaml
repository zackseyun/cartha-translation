reference: Luke 7:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: vi
  text: Nhưng những người Pha-ri-si và các chuyên gia Luật pháp đã khước từ ý định của Đức Chúa Trời dành cho họ[a], vì họ không được ông làm phép báp-têm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ý định của Đức Chúa Trời chống lại họ” hoặc “kế hoạch của Đức Chúa Trời liên quan đến họ.”'
    reason: alternative_reading
  - marker: b
    text: Tức là Giăng Báp-tít.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: các chuyên gia Luật pháp
  rationale: Chỉ những người am hiểu Luật pháp Môi-se. Cách dịch này rõ nghĩa hơn “luật sư” trong tiếng Việt hiện đại, vì “luật sư” thường gợi đến nghề pháp lý đương đại; đồng thời không đồng nhất họ với một nhóm khác là các thầy thông giáo.
- source_word: βουλὴν
  choice: ý định
  rationale: βούλη có thể chỉ ý định, kế hoạch hoặc chủ ý. “Ý định” tự nhiên, trang trọng vừa phải và không hàm ý đây chỉ là lời khuyên.
- source_word: ἠθέτησαν
  choice: khước từ
  rationale: ἀθετέω ở đây diễn tả việc bác bỏ hoặc gạt đi. “Khước từ” nêu rõ sự từ chối của họ mà vẫn giữ văn phong trang trọng.
- source_word: εἰς ἑαυτούς
  choice: dành cho chính mình
  rationale: Cụm từ cho biết ý định của Đức Chúa Trời liên hệ trực tiếp đến chính họ. Cách dịch này giữ cách hiểu chính nhưng chú thích ghi nhận khả năng “chống lại chính mình” hoặc “liên quan đến chính mình”.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: vì họ không chịu nhận phép báp-têm của ông
  rationale: Phân từ bất định quá khứ bị động diễn tả hoàn cảnh gắn với sự khước từ. “Không chịu nhận” phản ánh cả việc họ không được làm báp-têm lẫn sự từ chối chủ động trong ngữ cảnh, còn “vì” diễn đạt quan hệ hợp lý trong tiếng Việt; chú thích không cần quyết định sâu hơn về sắc thái cú pháp.
- source_word: αὐτοῦ
  choice: ông
  rationale: Đại từ quy chiếu về Giăng trong ngữ cảnh trước. Giữ đại từ trong câu chính để theo sát tiếng Hy Lạp, đồng thời chú thích xác định đối tượng.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ tạo thế tương phản với những người ở câu trước đã nhìn nhận Đức Chúa Trời là công chính sau khi nhận phép báp-têm của Giăng.
theological_decisions:
- issue: Ý nghĩa của βουλή của Đức Chúa Trời đối với người Pha-ri-si và các chuyên gia Luật pháp
  choice: ý định của Đức Chúa Trời dành cho chính mình
  alternative: ý định của Đức Chúa Trời chống lại chính mình; kế hoạch của Đức Chúa Trời liên quan đến chính mình
  rationale: Cách dịch chính diễn tả điều Đức Chúa Trời định cho họ mà không đưa ra kết luận rộng hơn về việc ý chỉ tuyệt đối của Ngài có thể bị cản trở hay không. Chú thích bảo tồn độ mơ hồ của εἰς ἑαυτούς.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “các chuyên gia Luật pháp” thay cho “các luật sư” để tránh nghĩa nghề nghiệp hiện đại; dùng “phép báp-têm” theo thuật ngữ Kinh Thánh quen thuộc. Mọi dấu chú thích đều xuất hiện trong câu chính.
