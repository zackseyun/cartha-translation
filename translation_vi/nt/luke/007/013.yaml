  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: vi
  text: 'Khi Chúa thấy bà, Ngài động lòng thương xót bà và nói với bà: “Đừng khóc.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng than khóc” hoặc “Thôi đừng khóc nữa.” Câu Hy Lạp có thể được hiểu là lời ngăn cấm nói chung hoặc lời bảo bà chấm dứt việc đang khóc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: khi ... thấy
  rationale: Phân từ bất định quá khứ của ὁράω diễn tả hành động xảy ra trước động từ chính; mệnh đề thời gian “khi ... thấy” tự nhiên trong tiếng Việt và vẫn giữ đúng quan hệ thời gian.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: κύριος ở đây là danh hiệu người kể chuyện dùng cho Đức Giê-su; “Chúa” giữ được sắc thái tôn kính và ý nghĩa Kitô học trong trình thuật Lu-ca mà không diễn giải quá mức.
- source_word: ἐσπλαγχνίσθη
  choice: động lòng thương xót
  rationale: Động từ diễn tả lòng thương xót sâu xa phát xuất từ nội tâm; cách nói này vừa tự nhiên, trang trọng, vừa giữ được cường độ cảm xúc của từ Hy Lạp.
- source_word: ἐπ’ αὐτῇ
  choice: bà
  rationale: Với σπλαγχνίζομαι, ἐπί kèm tặng cách chỉ người được hướng đến bởi lòng thương xót. Trong cụm “thương xót bà”, tiếng Việt không cần thêm giới từ.
- source_word: εἶπεν αὐτῇ
  choice: nói với bà
  rationale: Giữ sát nghĩa thông dụng của λέγω và thể hiện rõ người được nói với.
- source_word: Μὴ κλαῖε
  choice: Đừng khóc
  rationale: Cách dịch này giữ nghĩa của κλαίω và không quyết định dứt khoát liệu mệnh lệnh hiện tại với μή là lời cấm nói chung hay lời yêu cầu chấm dứt hành động đang diễn ra.
theological_decisions:
- issue: Cách dịch κύριος như danh hiệu dành cho Đức Giê-su
  choice: Chúa
  alternative: chủ; thầy
  rationale: Trong Lu-ca 7:13, đây là lời trần thuật mang sắc thái Kitô học của tác giả. “Chúa” bảo tồn danh hiệu cao trọng mà không thêm nội dung thần học ngoài câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” tránh lặp lại “Chúa” nhưng vẫn duy trì sự tôn kính; “bà” phù hợp với người phụ nữ góa chồng trong ngữ cảnh. Dấu chú thích được đặt ngay sau lời phán mà chú thích giải thích.
