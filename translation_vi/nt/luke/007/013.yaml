  terminology: “Chúa” là cách chuyển ngữ phù hợp cho ὁ κύριος theo quyết định thuật ngữ của dự án. “Động lòng thương xót” truyền đạt tốt sắc thái cảm thương sâu xa của ἐσπλαγχνίσθη mà không diễn giải thần học thêm. “Đừng khóc” giữ được sự mở về sắc thái thể của mệnh lệnh hiện tại với μή.
