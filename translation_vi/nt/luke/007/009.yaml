id: LUK.7.9
reference: Luke 7:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: vi
  text: 'Khi nghe những lời ấy, Đức Giê-su kinh ngạc về ông. Ngài quay lại nói với đám đông đang theo Ngài: “Tôi nói với mọi người: ngay cả trong dân Ít-ra-ên, tôi cũng chưa từng thấy một đức tin lớn đến thế[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một lòng tin lớn đến thế.” Từ Hy Lạp này cũng thường được dịch là “đức tin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Khi nghe những lời ấy
  rationale: Phân từ bất định ἀκούσας nêu hoàn cảnh xảy ra trước động từ chính; “khi nghe” diễn đạt tự nhiên quan hệ thời gian. δέ là chuyển tiếp nhẹ nên không cần dịch riêng, còn ταῦτα được giữ ở số nhiều bằng “những lời ấy,” chỉ những lời vừa được thuật lại.
- source_word: ἐθαύμασεν αὐτόν
  choice: kinh ngạc về ông
  rationale: θαυμάζω diễn tả sự kinh ngạc hoặc thán phục. Cách dịch này giữ phản ứng mạnh và chân thực của Đức Giê-su mà không giải thích thêm nguyên nhân; αὐτόν chỉ viên đại đội trưởng.
- source_word: στραφεὶς
  choice: quay lại
  rationale: Phân từ bất định mang nghĩa chủ động trong văn kể chuyện; “quay lại” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: với đám đông đang đi theo mình
  rationale: Phân từ hiện tại ἀκολουθοῦντι diễn tả hành động đang tiếp diễn. “Mình” quy chiếu tự nhiên về chủ ngữ Đức Giê-su.
- source_word: Λέγω ὑμῖν
  choice: Tôi nói với anh chị em
  rationale: Giữ công thức nhấn mạnh và lời nói trực tiếp. “Anh chị em” là cách xưng hô số nhiều hiện đại, trang trọng vừa phải, không dùng đại từ cổ.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: ngay cả trong dân Ít-ra-ên ... cũng chưa
  rationale: οὐδέ có nghĩa “ngay cả ... cũng không.” Thêm “dân” làm rõ Ít-ra-ên ở đây là cộng đồng dân chúng chứ không đơn thuần là địa điểm.
- source_word: τοσαύτην πίστιν
  choice: một đức tin lớn đến thế
  rationale: τοσαύτην nhấn mạnh mức độ lớn lao; “lớn đến thế” thể hiện rõ hơn sắc thái này. πίστις được dịch là “đức tin,” đồng thời ghi nhận “lòng tin” trong chú thích.
- source_word: εὗρον
  choice: tôi cũng chưa từng thấy
  rationale: Động từ bất định mang nghĩa “tìm thấy/nhận thấy.” Trong lời tuyên bố về kinh nghiệm cho đến thời điểm hiện tại, “chưa từng thấy” tự nhiên trong tiếng Việt và không làm đổi trọng tâm.
theological_decisions:
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin
  rationale: Trong ngữ cảnh này, πίστις nói đến sự tin cậy của viên đại đội trưởng nơi thẩm quyền của Đức Giê-su. “Đức tin” giữ thuật ngữ thần học quen thuộc, còn “lòng tin” là khả năng dịch hợp nghĩa và được bảo lưu trong chú thích.
- issue: Phản ứng của Đức Giê-su trong ἐθαύμασεν
  choice: kinh ngạc
  alternative: thán phục
  rationale: Bản dịch giữ nguyên sự kinh ngạc được văn bản trực tiếp khẳng định, không làm nhẹ đi vì một kết luận thần học về tri thức của Đức Giê-su; “thán phục” có thể hàm thêm sắc thái đánh giá tích cực.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “Ít-ra-ên” theo lối phiên âm quen thuộc; tránh các đại từ cổ như “ta/các ngươi.”
