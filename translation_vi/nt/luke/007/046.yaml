  to: Ông đã không xức dầu trên đầu tôi, nhưng người phụ nữ này đã xức dầu thơm lên chân tôi.[a]
  rationale: Bản sửa giữ nguyên nghĩa và sự đối chiếu của câu Hy Lạp, nhưng thay các đại từ mang sắc thái quan hệ hiện đại bằng cách diễn đạt trung tính, trang trọng hơn. “Người phụ nữ này” bảo toàn lực chỉ định của αὕτη, còn chú thích được điều chỉnh để phản ánh phạm vi nghĩa của μύρον mà không gợi sai chất liệu hay cách sử dụng.
