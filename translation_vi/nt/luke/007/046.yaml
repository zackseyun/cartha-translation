  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: vi
  text: Ông đã không xức dầu trên đầu tôi, nhưng người phụ nữ này đã xức dầu thơm lên chân tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thuốc thơm”; cũng có thể hiểu là “dầu có hương thơm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαίῳ
  choice: dầu
  rationale: Dạng tặng cách chỉ phương tiện của ἔλαιον. “Dầu” là cách dịch tự nhiên và không cụ thể hóa quá mức thành dầu ô-liu.
- source_word: ἤλειψας / ἤλειψεν
  choice: xức
  rationale: ἀλείφω chỉ việc thoa hoặc xức dầu hay thuốc thơm. “Xức” phù hợp với phong tục tiếp khách và giữ được sự song song giữa hai vế.
- source_word: κεφαλήν μου
  choice: đầu tôi
  rationale: Cách dịch trực tiếp, tự nhiên của danh từ làm tân ngữ cùng đại từ sở hữu.
- source_word: αὕτη δὲ
  choice: nhưng chị ấy
  rationale: αὕτη chỉ người phụ nữ đang hiện diện và tạo thế tương phản rõ với “anh”; “chị ấy” tự nhiên trong tiếng Việt và không thêm sắc thái miệt thị.
- source_word: μύρῳ
  choice: dầu thơm
  rationale: μύρον là dầu hoặc thuốc mỡ có hương thơm. “Dầu thơm” vừa chính xác hơn “nước hoa” đối với chất dùng để xức, vừa giữ sự tương phản với dầu thông thường.
- source_word: τοὺς πόδας μου
  choice: chân tôi
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; danh từ “chân” không cần đánh dấu số nhiều dù nguyên văn dùng số nhiều.
theological_decisions:
- issue: Sự tương phản về lòng hiếu khách và sự tôn kính trong lời quở trách của Chúa Giê-su
  choice: Diễn đạt thẳng sự tương phản giữa việc người chủ không xức dầu trên đầu và việc người phụ nữ xức dầu thơm lên chân Chúa Giê-su.
  alternative: Dùng từ ngữ mang tính nghi lễ mạnh hơn, gợi đến sự phong chức hoặc thánh hiến chính thức.
  rationale: Ngữ cảnh trực tiếp nhấn mạnh sự thiếu sót trong cách tiếp khách của Si-môn đối lập với lòng tôn kính đặc biệt của người phụ nữ; bản dịch không nên tự ý áp đặt ý nghĩa nghi lễ hoặc tín lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” cho người nam được Chúa Giê-su trực tiếp nói với và “chị ấy” cho người phụ nữ hiện diện, giữ sự tương phản của nguyên văn mà không dùng cách gọi cổ hoặc mang sắc thái hạ thấp.
