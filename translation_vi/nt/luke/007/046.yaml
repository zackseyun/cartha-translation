review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc tương phản và các từ chính: dầu thường trên đầu đối lập với μύρον trên chân. Tuy nhiên, αὕτη có sắc thái chỉ định rõ hơn đại từ hồi chỉ “chị ấy”; “người phụ nữ này” phản ánh tốt hơn người phụ nữ đang hiện diện trong ngữ cảnh.'
  naturalness: “Anh ... chị ấy” tạo quan hệ tuổi tác/thân mật không có trong nguyên văn và không phù hợp với văn phong Kinh Thánh hiện đại trang trọng mà bản nháp nêu. “Ông ... người phụ nữ này” tự nhiên hơn trong lời trực tiếp của Chúa Giê-su với Si-môn, đồng thời giữ thế đối lập.
  terminology: “Xức dầu” và “dầu thơm” là những lựa chọn phù hợp cho ἀλείφω và μύρον. Chú thích nên ưu tiên các lựa chọn chỉ dầu/thuốc mỡ có hương thơm; “nước hoa” trong tiếng Việt hiện đại thường gợi một sản phẩm lỏng để xịt và kém sát với chất được xức trong ngữ cảnh này.
  issues:
  - severity: medium
    issue: Đại từ “Anh” và “chị ấy” thêm sắc thái quan hệ xã hội không được nguyên văn xác định.
    rationale: Nguyên văn chỉ dùng ngôi thứ hai số ít và đại từ chỉ định giống cái αὕτη. Cách xưng hô trong bản nháp nghe thân mật, lệch register, và “chị ấy” làm yếu nét chỉ định của αὕτη.
  - severity: low
    issue: Chú thích nêu “nước hoa” như lựa chọn thay thế trực tiếp cho “dầu thơm.”
    rationale: μύρον có thể chỉ dầu/thuốc mỡ thơm; trong tiếng Việt hiện đại, “nước hoa” dễ gợi sản phẩm xịt hơn là chất xức lên chân. Nên dùng các phương án sát ngữ cảnh hơn.
