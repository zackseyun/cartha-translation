source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: vi
  text: 'Ngài trả lời họ: “Hãy đi thuật lại cho Giăng những điều các ông đã thấy và nghe: người mù được sáng mắt[a], người què bước đi, người mắc bệnh phong được thanh sạch, người điếc nghe được, người chết được sống lại, Tin Mừng được loan báo cho người nghèo[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người mù nhìn thấy.” Động từ Hy Lạp có thể chỉ việc nhìn lên hoặc nhận lại thị lực; trong ngữ cảnh này, nó nói đến việc được sáng mắt.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Tin Mừng được rao giảng cho người nghèo.” Trong tiếng Hy Lạp, câu này ở thể bị động: người nghèo là những người được Tin Mừng loan báo cho.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp lời
  rationale: Diễn đạt tự nhiên phân từ chỉ sự đáp lại trong tiếng Việt, không cần giữ cấu trúc phân từ cứng nhắc.
- source_word: Πορευθέντες
  choice: Hãy đi
  rationale: Phân từ đi kèm mệnh lệnh được diễn đạt tự nhiên như một mệnh lệnh nối tiếp.
- source_word: ἀπαγγείλατε
  choice: thuật lại
  rationale: Nêu rõ việc các sứ giả trở về kể lại cho Giăng những điều chính họ quan sát được.
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: những gì các anh đã thấy và nghe
  rationale: Giữ đầy đủ nội dung của mệnh đề quan hệ và dùng lối xưng hô tự nhiên với nhóm người được sai đến.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: người mù được thấy
  rationale: Diễn tả việc nhận lại hoặc nhận được thị lực mà không khẳng định mọi người trước đó từng nhìn thấy.
- source_word: χωλοὶ περιπατοῦσιν
  choice: người què bước đi
  rationale: Bản dịch trực tiếp, rõ nghĩa và trang trọng.
- source_word: λεπροὶ καθαρίζονται
  choice: người mắc bệnh phong được thanh sạch
  rationale: Tránh dùng danh từ gán nhãn con người, đồng thời giữ sắc thái thanh sạch của καθαρίζονται thay vì chỉ nói được chữa lành.
- source_word: κωφοὶ ἀκούουσιν
  choice: người điếc nghe được
  rationale: Với động từ ‘nghe’, κωφοί rõ ràng chỉ người điếc; ‘nghe được’ tự nhiên trong tiếng Việt.
- source_word: νεκροὶ ἐγείρονται
  choice: người chết được sống lại
  rationale: Giữ thể bị động và không nêu thêm tác nhân; ‘được sống lại’ là cách nói tự nhiên cho việc người chết được dựng dậy.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: người nghèo được loan báo Tin Mừng
  rationale: Giữ cấu trúc bị động và nội dung được công bố, tránh thuật ngữ giáo hội khó hiểu như ‘được phúc âm hóa’.
theological_decisions:
- issue: Danh sách phép lạ như bằng chứng về căn tính và sứ mạng của Chúa Giê-su
  choice: Trình bày trực tiếp các hành động phục hồi có thể quan sát được, không thêm lời giải thích rằng đây là sự ứng nghiệm lời tiên tri hay bằng chứng Đấng Mê-si-a.
  alternative: Nêu rõ trong câu rằng các việc này ứng nghiệm Ê-sai hoặc chứng minh căn tính Mê-si-a.
  rationale: Câu Hy Lạp để chính các việc đã thấy và nghe làm câu trả lời; bản dịch duy trì những âm hưởng tiên tri nhưng không biến hàm ý thành lời khẳng định minh nhiên.
- issue: Tác nhân của các động từ bị động
  choice: 'Giữ cách diễn đạt bị động: ‘được thanh sạch’, ‘được sống lại’, ‘được loan báo’.'
  alternative: Thêm tác nhân như ‘Đức Chúa Trời làm cho người chết sống lại’ hoặc đổi sang câu chủ động.
  rationale: Nguyên văn không nêu tác nhân; giữ thể bị động bảo toàn sự dè dặt thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘các anh’ cho nhóm sứ giả nam trong văn cảnh; ‘Giăng’ theo lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Viết hoa ‘Tin Mừng’ để chỉ thông điệp cứu độ, không thêm nội dung giáo phái.
