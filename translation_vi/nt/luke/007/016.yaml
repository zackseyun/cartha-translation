reference: Luke 7:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: vi
  text: 'Nỗi sợ hãi bao trùm mọi người, và họ tôn vinh Đức Chúa Trời, nói rằng: “Một nhà tiên tri vĩ đại đã được dấy lên giữa chúng ta,[a] và Đức Chúa Trời đã thăm viếng[b] dân Ngài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đã xuất hiện giữa chúng ta.” Động từ Hy Lạp ở thể bị động, có thể hàm ý rằng Đức Chúa Trời đã dấy lên nhà tiên tri này.'
    reason: lexical_alternative
  - marker: b
    text: “Thăm viếng” là cách nói trong Kinh Thánh về việc Đức Chúa Trời đoái đến dân Ngài với sự quan tâm và hành động cứu giúp.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν δὲ φόβος πάντας
  choice: Bấy giờ, mọi người đều bị nỗi sợ hãi bao trùm
  rationale: Giữ nghĩa mạnh của φόβος là “sợ hãi” thay vì giải thích thành “kính sợ”; cách diễn đạt “bị ... bao trùm” truyền đạt sắc thái bất ngờ và chế ngự của thành ngữ Hy Lạp.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: họ không ngừng tôn vinh Đức Chúa Trời
  rationale: “Tôn vinh” giữ liên hệ từ vựng với δοξάζω; “không ngừng” thể hiện phương diện tiếp diễn của thì chưa hoàn thành trong ngữ cảnh.
- source_word: Προφήτης μέγας
  choice: Một nhà tiên tri vĩ đại
  rationale: Cách dịch tự nhiên, trực tiếp, giữ nguyên sự đánh giá của μέγας.
- source_word: ἠγέρθη ἐν ἡμῖν
  choice: đã xuất hiện giữa chúng ta
  rationale: “Đã xuất hiện” là cách nói tự nhiên về một nhà tiên tri được dấy lên giữa cộng đồng, đồng thời không ép động từ thụ động thành một cách hiểu duy nhất; cách dịch sát hơn được ghi ở chú thích.
- source_word: Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ
  choice: Đức Chúa Trời đã thăm viếng dân Ngài
  rationale: “Thăm viếng” giữ nguyên thành ngữ Kinh Thánh về việc Đức Chúa Trời đoái đến và hành động vì dân Ngài, không thu hẹp ý nghĩa thành riêng “giúp đỡ” hay “giải cứu”.
theological_decisions:
- issue: Ý nghĩa của φόβος sau phép lạ
  choice: nỗi sợ hãi
  alternative: sự kính sợ
  rationale: Bản văn dùng φόβος; “sợ hãi” giữ lại sức nặng và sự căng thẳng thần học, còn ngữ cảnh cho phép độc giả nhận ra yếu tố kính sợ.
- issue: Sắc thái thụ động của ἠγέρθη đối với nhà tiên tri
  choice: đã xuất hiện
  alternative: đã được dấy lên
  rationale: Cách dịch chính tự nhiên trong tiếng Việt và không xác định quá mức tác nhân, trong khi chú thích bảo lưu khả năng lời văn ám chỉ Đức Chúa Trời dấy nhà tiên tri lên.
- issue: Ý nghĩa của sự Đức Chúa Trời “thăm viếng”
  choice: đã thăm viếng dân Ngài
  alternative: đã đến giúp dân Ngài
  rationale: Giữ hình ảnh và âm hưởng thần học của ἐπισκέπτομαι thay vì giải nghĩa nó thành một hành động cứu giúp cụ thể.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và “dân Ngài” theo văn phong Kinh Thánh phổ thông; bảo lưu “sợ hãi” và “thăm viếng” để tránh diễn giải quá mức.
