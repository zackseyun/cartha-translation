language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: vi
  text: Vào lúc ấy[a], Đức Chúa Jêsus chữa lành nhiều người khỏi bệnh tật, những khổ đau[b] và các tà linh; và ban cho nhiều người mù được thấy[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngay trong giờ ấy.” Cách nói Hy Lạp xác định rõ thời điểm của sự việc và, tùy ngữ cảnh, có thể gợi tính tức thời.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp theo nghĩa đen là “những roi đánh”; theo nghĩa mở rộng, từ này có thể chỉ những tai họa, bệnh chứng hoặc khổ đau nghiêm trọng.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “ban cho được thấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: Ngay giờ ấy
  rationale: Giữ nét thời gian cụ thể của nguyên văn, đồng thời từ “ngay” diễn đạt tự nhiên sắc thái tức thời mà ngữ cảnh có thể nhấn mạnh.
- source_word: ἐθεράπευσεν πολλοὺς ἀπὸ νόσων
  choice: chữa lành nhiều người khỏi bệnh tật
  rationale: “Chữa lành” phù hợp ngữ cảnh các phép chữa bệnh; “khỏi” phản ánh ý phân cách của ἀπό và tự nhiên trong tiếng Việt.
- source_word: μαστίγων
  choice: những đau đớn khủng khiếp
  rationale: Danh từ này vốn có nghĩa là roi đánh nhưng được dùng mở rộng về những tai họa hoặc đau đớn nghiêm trọng; cách dịch này truyền đạt nghĩa trong ngữ cảnh chữa lành mà không biến ẩn dụ thành roi theo nghĩa đen.
- source_word: πνευμάτων πονηρῶν
  choice: các tà linh
  rationale: Diễn đạt trực tiếp πονηρός là xấu ác và πνεῦμα là linh; không đồng nhất cụm từ này với bệnh tật.
- source_word: τυφλοῖς πολλοῖς
  choice: nhiều người mù
  rationale: Dạng tặng cách chỉ những người nhận ân huệ; “người mù” không giới hạn giới tính và tự nhiên trong tiếng Việt.
- source_word: ἐχαρίσατο βλέπειν
  choice: ban cho ... được thấy
  rationale: “Ban cho” giữ sắc thái trao ban rộng lượng của χαρίζομαι, còn “được thấy” bám sát động từ nguyên mẫu βλέπειν hơn cách danh từ hóa thành “thị lực”.
theological_decisions:
- issue: Bản chất của πνεύματα πονηρά
  choice: Dịch là “các tà linh,” giữ nghĩa về những hữu thể thuộc linh xấu ác.
  alternative: Hiểu cụm từ chỉ như một ẩn dụ phi nhân cách cho bệnh tâm thần hoặc thể chất.
  rationale: Cách nói Hy Lạp trực tiếp chỉ các linh xấu ác; bản dịch không giản lược chúng thành bệnh tật và cũng không thêm chi tiết ngoài câu.
- issue: Chủ thể được hàm ẩn trong các động từ số ít
  choice: Nêu “Đức Chúa Jêsus” để câu đứng độc lập rõ nghĩa.
  alternative: Chỉ dùng đại từ “Ngài” hoặc “ông” theo đúng chủ thể hàm ẩn trong tiếng Hy Lạp.
  rationale: Nguyên văn dựa vào ngữ cảnh trước để xác định chủ thể là Đức Chúa Jêsus. Việc nêu danh xưng làm câu tham chiếu độc lập dễ hiểu mà không thay đổi căn tính của chủ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối Kinh Thánh Tin Lành Việt ngữ quen thuộc; cấu trúc câu giữ ba nhóm nguyên nhân được chữa khỏi và phân biệt mệnh đề ban khả năng thấy cho người mù.
