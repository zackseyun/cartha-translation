  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: vi
  text: Và phước cho ai không vấp ngã vì tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không bị xúc phạm vì tôi” hoặc “không lìa bỏ vì tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: phước cho
  rationale: Cách diễn đạt quen thuộc trong các lời chúc phước của Chúa Giê-su, giữ được sắc thái tôn giáo của từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὃς ἐὰν μὴ
  choice: người nào không
  rationale: Diễn đạt tự nhiên một đại từ quan hệ có điều kiện tổng quát, không giới hạn về giới tính.
- source_word: σκανδαλισθῇ
  choice: vấp ngã
  rationale: Giữ hình ảnh vấp ngã của động từ Hy Lạp và đủ rộng để bao hàm việc bị xúc phạm, mất lòng tin hoặc lìa bỏ, thay vì chỉ nói đến cảm xúc bị xúc phạm.
- source_word: ἐν ἐμοί
  choice: vì tôi mà
  rationale: Trong thành ngữ này, giới từ chỉ căn nguyên hoặc cớ gây vấp ngã liên quan đến Chúa Giê-su; cách diễn đạt này tự nhiên hơn bản dịch máy móc 'trong tôi'.
theological_decisions:
- issue: Sắc thái bị vấp phạm vì Chúa Giê-su
  choice: Giữ hình ảnh 'vấp ngã' và quan hệ nguyên nhân bằng 'vì tôi mà'
  alternative: không bị xúc phạm vì tôi; không lìa bỏ vì tôi
  rationale: 'Bản dịch duy trì sự căng thẳng của lời cảnh báo: chính Chúa Giê-su có thể trở thành cớ khiến người ta vấp phạm, nhưng không thu hẹp ý nghĩa vào cảm xúc bị xúc phạm hoặc xác định hẳn là bội đạo.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự 'không vì tôi mà vấp ngã' nhấn rõ căn nguyên và tránh hiểu rằng Chúa Giê-su chủ động làm người ấy ngã.
