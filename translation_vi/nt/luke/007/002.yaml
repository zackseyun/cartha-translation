  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: vi
  text: Một viên đại đội trưởng có một người nô lệ[a] đang đau nặng và sắp chết; người nô lệ ấy được ông quý trọng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ”. Từ Hy Lạp doulos có thể chỉ “nô lệ” hoặc, tùy ngữ cảnh, “đầy tớ”; ở đây “người nô lệ” làm rõ quan hệ lệ thuộc hàm ý trong từ này.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: một viên đại đội trưởng kia có
  rationale: Diễn đạt tự nhiên quan hệ sở hữu của sở hữu cách, đồng thời giữ sắc thái bất định của τινος.
- source_word: δέ
  choice: không dịch riêng
  rationale: δέ chỉ đánh dấu sự chuyển tiếp nhẹ trong mạch kể; tiếng Việt không cần thêm từ nối ở đây.
- source_word: δοῦλος
  choice: người nô lệ
  rationale: Giữ rõ địa vị lệ thuộc và quan hệ sở hữu trong bối cảnh xã hội thế kỷ thứ nhất; “đầy tớ” có thể làm nhẹ nghĩa này.
- source_word: κακῶς ἔχων
  choice: đang đau nặng
  rationale: Thành ngữ chỉ tình trạng bệnh tật nghiêm trọng; cách dịch này tự nhiên và phù hợp với việc người ấy gần chết.
- source_word: ἤμελλεν τελευτᾶν
  choice: gần chết
  rationale: Truyền đạt tính cận kề của μέλλω với động từ nguyên mẫu một cách gọn và tự nhiên.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: người này được ông quý trọng
  rationale: ἔντιμος ở đây nói đến giá trị và sự coi trọng đối với người nô lệ, không nhất thiết chỉ tình cảm thân thiết.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh nô lệ gia đình
  choice: người nô lệ
  alternative: đầy tớ
  rationale: Bản dịch chính giữ quan hệ lệ thuộc hàm chứa trong từ Hy Lạp và bối cảnh thế kỷ thứ nhất. Chú thích nêu “đầy tớ” vì từ này đôi khi có thể được dùng theo chức năng phục vụ, nhưng dễ che mờ địa vị pháp lý-xã hội.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “đại đội trưởng” cho ἑκατοντάρχης theo chức danh quân sự quen thuộc trong văn phong Kinh Thánh; câu được sắp xếp lại tự nhiên nhưng vẫn giữ quan hệ quy chiếu giữa người nô lệ và viên sĩ quan.
