id: LUK.7.3
reference: Luke 7:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: vi
  text: Khi nghe nói về Đức Giê-su, ông sai các trưởng lão Do Thái đến gặp Ngài, xin Ngài đến cứu người nô lệ[a] của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người đầy tớ.” Từ Hy Lạp doulos có thể chỉ người phục vụ hoặc người nô lệ tùy ngữ cảnh; tại đây, “nô lệ” làm rõ địa vị lệ thuộc của người này.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: Khi nghe nói về Đức Giê-su
  rationale: Phân từ bất định ἀκούσας nêu hoàn cảnh xảy ra trước động từ chính; “khi nghe nói” tự nhiên trong tiếng Việt. δέ là từ nối nhẹ nên không cần dịch riêng.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: ông sai ... đến gặp Ngài
  rationale: “Sai ... đến” diễn đạt tự nhiên hành động cử người đi; “đến gặp Ngài” thể hiện hướng đến Chúa Giê-su mà không thêm ý họ chỉ mang lời nhắn.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: các trưởng lão Do Thái
  rationale: πρεσβύτεροι chỉ những người lãnh đạo được cộng đồng nhìn nhận, không chỉ đơn thuần là người cao tuổi.
- source_word: ἐρωτῶν αὐτὸν ὅπως ἐλθὼν
  choice: xin Ngài đến
  rationale: ἐρωτῶν trong ngữ cảnh này là lời thỉnh cầu lịch sự; cấu trúc ὅπως cùng ἐλθών được chuyển tự nhiên thành nội dung lời xin.
- source_word: διασώσῃ
  choice: cứu
  rationale: διασῴζω có thể mang nghĩa cứu, giải cứu, bảo toàn hoặc cứu chữa. “Cứu” giữ được độ rộng của từ Hy Lạp trong bối cảnh người nô lệ đang lâm bệnh nặng.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: người nô lệ của ông
  rationale: δοῦλος trong bối cảnh gia hộ của một viên đại đội trưởng nói đến một người ở địa vị lệ thuộc và thuộc quyền chủ; “nô lệ” giữ rõ thực trạng xã hội-pháp lý ấy.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh gia hộ
  choice: người nô lệ
  alternative: người đầy tớ
  rationale: “Nô lệ” phản ánh rõ địa vị lệ thuộc hàm chứa trong δοῦλος, còn “đầy tớ” là cách dịch truyền thống và có thể nhấn mạnh chức năng phục vụ. Bản dịch chính không làm mờ thân phận lệ thuộc; phương án kia được giữ trong chú thích.
- issue: Sắc thái của διασώσῃ trong bối cảnh bệnh nặng
  choice: cứu
  alternative: cứu chữa
  rationale: “Cứu” bảo toàn phạm vi nghĩa rộng của động từ, không âm thầm giới hạn nó vào việc chữa bệnh, dù ngữ cảnh cho thấy sự cứu giúp được mong đợi liên quan đến căn bệnh nguy kịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tên quen thuộc trong tiếng Việt; đại từ “Ngài” giúp tránh lặp tên và giữ sự tôn kính. Chủ ngữ “ông” được tiếp nối từ câu trước, như trong nguyên văn.
