review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng người phụ nữ được gọi là “người có tội” mà không suy diễn tội cụ thể, và nhận diện đúng bối cảnh bữa ăn tại nhà người Pha-ri-si. Tuy nhiên, “vốn là” thêm một sắc thái không được nêu rõ trong ἦν (“là”), và bản chính cần phản ánh rõ hơn κατάκειται, tức tư thế ngả/nằm nghiêng khi dùng bữa.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng. “Ngả mình dùng bữa” vừa tự nhiên trong văn kể vừa chính xác hơn “đang dùng bữa”; đồng thời cho phép đặt chú thích văn hóa đúng tại cụm từ được chú giải. “Bình a-la-bát” là cách phiên âm minh bạch của tên loại bình, tránh đồng nhất quá chắc chắn với “đá thạch cao.”
  terminology: Giữ “người có tội” là thích hợp và không gán bà là gái mại dâm. “Người Pha-ri-si” là danh xưng chuẩn. ἀλάβαστρον chỉ một loại bình/đồ chứa được gọi là alabaster; diễn đạt “bình bằng đá thạch cao” quá hẹp về vật liệu, nên dùng “bình a-la-bát” và giải thích trong chú thích.
  issues:
  - severity: medium
    issue: “vốn là người có tội” thêm sắc thái thời gian/đặc tính có sẵn.
    rationale: ἦν chỉ nói bà “là” một người có tội; “vốn” có thể gợi một tình trạng từ trước hay bản chất cố hữu không cần thiết.
  - severity: medium
    issue: “đang dùng bữa” làm mờ tư thế được nêu bởi κατάκειται; chú thích [b] lại đặt sau “Pha-ri-si” thay vì cụm chỉ việc ngả mình dùng bữa.
    rationale: Động từ trong bối cảnh bữa ăn nói đến việc ngả/nằm nghiêng bên bàn. Bản chính có thể diễn đạt điều này tự nhiên, và điểm neo chú thích phải gắn với nội dung văn hóa mà chú thích giải thích.
  - severity: medium
    issue: “bình bằng đá thạch cao” xác định vật liệu của ἀλάβαστρον quá cụ thể.
    rationale: Thuật ngữ chỉ loại bình alabaster; việc đồng nhất nó tuyệt đối với thạch cao không đủ an toàn. Phiên âm tên loại bình bảo toàn thuật ngữ và tránh khẳng định vật liệu quá mức.
