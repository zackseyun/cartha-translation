reference: Luke 7:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: vi
  text: Và kìa, một người phụ nữ trong thành, là người có tội.[a] Biết Ngài đang ngả mình dùng bữa[b] trong nhà người Pha-ri-si, bà mang đến một bình a-la-bát đựng dầu thơm.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “người có tội”, không cho biết cụ thể bà đã phạm tội gì.
    reason: lexical_alternative
  - marker: b
    text: Theo tập quán trong các bữa ăn trang trọng thời ấy, thực khách nằm nghiêng bên bàn ăn.
    reason: cultural_note
  - marker: c
    text: '“Bình a-la-bát” là loại bình được gọi theo tên alabaster; cũng có thể dịch: “một bình a-la-bát đựng thuốc thơm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng đánh dấu diễn ngôn, làm nổi bật sự xuất hiện bất ngờ của người phụ nữ, đồng thời vẫn tự nhiên trong văn kể trang trọng.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: trong thành
  rationale: Bám sát cách diễn đạt chỉ vị trí của tiếng Hy Lạp, không diễn giải quá mức thành 'quê ở' hay 'nổi tiếng trong' thành.
- source_word: ἁμαρτωλός
  choice: vốn là người có tội
  rationale: Giữ tính chất danh từ của từ Hy Lạp và không xác định bà đã phạm loại tội nào.
- source_word: ἐπιγνοῦσα
  choice: khi biết
  rationale: Diễn đạt tự nhiên hành động biết tin xảy ra trước hành động chính là mang bình dầu thơm đến.
- source_word: κατάκειται
  choice: đang dùng bữa
  rationale: Trong bối cảnh này, động từ chỉ tư thế nằm nghiêng khi dự bữa ăn; bản dịch chính truyền đạt chức năng của hành động, còn chú thích giữ chi tiết văn hóa.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: nhà người Pha-ri-si
  rationale: Cách nói sở hữu tự nhiên trong tiếng Việt và giữ nguyên danh xưng của nhóm tôn giáo.
- source_word: κομίσασα
  choice: mang đến
  rationale: Truyền đạt rõ việc bà đem vật ấy đến nơi Chúa Giê-su đang dùng bữa.
- source_word: ἀλάβαστρον μύρου
  choice: một bình bằng đá thạch cao đựng dầu thơm
  rationale: Thể hiện cả loại bình và chất thơm bên trong bằng ngôn ngữ hiện đại, dễ hiểu.
theological_decisions:
- issue: Đặc điểm đạo đức của người phụ nữ
  choice: vốn là người có tội
  alternative: một phụ nữ sống vô luân; một gái mại dâm
  rationale: Nguyên văn chỉ gọi bà là ἁμαρτωλός, không cho biết tội cụ thể; vì vậy không đồng nhất bà với gái mại dâm hay gán một loại tội không được nêu.
- issue: Chủ thể của κατάκειται
  choice: Ngài
  alternative: Chúa Giê-su
  rationale: Nguyên văn dùng chủ ngữ ngầm được xác định từ văn cảnh. 'Ngài' duy trì mạch quy chiếu và sắc thái tôn kính tự nhiên trong tiếng Việt mà không thêm danh xưng vào câu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “kìa” để giữ điểm nhấn của ἰδοὺ; tránh cách gọi cổ hoặc suy diễn người phụ nữ là gái mại dâm. Các dấu chú thích [a], [b], [c] đều được đặt ngay tại nội dung tương ứng.
