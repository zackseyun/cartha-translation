revisions:
- from: Và kìa, có một người phụ nữ trong thành vốn là người có tội.[a] Khi biết Ngài đang dùng bữa trong nhà người Pha-ri-si,[b] bà mang đến một bình bằng đá thạch cao đựng dầu thơm.[c]
  to: Và kìa, một người phụ nữ trong thành, là người có tội.[a] Biết Ngài đang ngả mình dùng bữa[b] trong nhà người Pha-ri-si, bà mang đến một bình a-la-bát đựng dầu thơm.[c]
  rationale: Bỏ “vốn” để không thêm sắc thái ngoài nguyên văn; dịch κατάκειται là “đang ngả mình dùng bữa” và chuyển điểm neo [b] đến đúng cụm từ; thay cách khẳng định vật liệu “đá thạch cao” bằng tên loại bình được phiên âm, có chú thích giải thích. Ý nghĩa câu và sự không xác định về tội của người phụ nữ được giữ nguyên.
