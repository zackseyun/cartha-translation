    rationale: Cụm εἰς τὸν οἶκον nói đến một căn nhà xác định trong bối cảnh, không xác định đó là nhà của nhóm người trở về. “Trở lại ngôi nhà ấy” bảo toàn tính xác định và tránh suy diễn về chủ sở hữu.
  revised_text: Khi những người được sai đi trở lại ngôi nhà ấy, họ thấy người nô lệ[a] khỏe mạnh.
