  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: vi
  text: Khi những người được sai đi trở lại ngôi nhà ấy, họ thấy người nô lệ[a] khỏe mạnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ.” Từ Hy Lạp doulos có thể chỉ “nô lệ” hoặc “đầy tớ,” tùy ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Khi ... trở về
  rationale: Phân từ bất định thì của ὑποστρέφω mang ý nghĩa thời gian, diễn tả hành động xảy ra trước động từ chính; cấu trúc “Khi ... trở về” tự nhiên trong tiếng Việt và giữ rõ trình tự.
- source_word: εἰς τὸν οἶκον
  choice: về nhà
  rationale: εἰς với đối cách chỉ sự chuyển động đến một nơi. Trong ngữ cảnh trở lại địa điểm đã rời đi, “về nhà” tự nhiên hơn “đến nhà” mà không nhất thiết xác định đó là nhà riêng của những người được sai đi.
- source_word: οἱ πεμφθέντες
  choice: những người được sai đi
  rationale: Giữ thể bị động của phân từ bất định thì πέμπω và không thêm danh từ diễn giải như “các sứ giả”.
- source_word: εὗρον
  choice: họ thấy
  rationale: Trong văn kể chuyện, εὑρίσκω ở đây nói đến điều họ nhận thấy khi trở về; “thấy” là cách diễn đạt tự nhiên, không hàm ý một cuộc tìm kiếm.
- source_word: τὸν δοῦλον
  choice: người nô lệ
  rationale: δοῦλος có thể được dịch là “nô lệ” hoặc “đầy tớ” tùy ngữ cảnh. Ở đây, quan hệ thuộc quyền của viên đại đội trưởng khiến “người nô lệ” bảo toàn rõ hơn địa vị xã hội của người này.
- source_word: ὑγιαίνοντα
  choice: khỏe mạnh
  rationale: Phân từ hiện tại của ὑγιαίνω có nghĩa là ở trong tình trạng khỏe mạnh. Cách dịch này tránh thêm ý “đã được chữa lành,” dù ngữ cảnh cho thấy người ấy đã hồi phục.
theological_decisions:
- issue: Cách dịch δοῦλος trong trình thuật chữa lành
  choice: người nô lệ
  alternative: đầy tớ
  rationale: “Nô lệ” giữ được địa vị lệ thuộc được từ Hy Lạp biểu thị, trong khi “đầy tớ” là một khả năng dịch truyền thống nhưng có thể làm nhẹ sắc thái xã hội. Ghi chú giữ lại phương án hợp lệ này mà không áp đặt một cách hiểu hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dấu chú thích được đặt ngay sau “người nô lệ,” là từ mà chú thích giải thích.
