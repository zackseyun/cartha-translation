  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian của phân từ ὑποστρέψαντες, giữ thể bị động trong “những người được sai đi,” dịch τὸν δοῦλον là “người nô lệ,” và diễn đạt đúng tình trạng ὑγιαίνοντα là “khỏe mạnh.” Tuy nhiên, “về nhà” trong tiếng Việt hiện đại thường hàm ý trở về nhà riêng của chính người trở về, trong khi εἰς τὸν οἶκον chỉ căn nhà cụ thể trong câu chuyện. Nên dùng “trở lại ngôi nhà ấy” để giữ địa điểm xác định mà không thêm diễn giải.
  naturalness: Câu sửa vẫn tự nhiên, rõ ràng và phù hợp văn phong tường thuật hiện đại. “Ngôi nhà ấy” tránh mơ hồ về chủ sở hữu của căn nhà.
  terminology: “Người nô lệ” phản ánh phù hợp δοῦλος trong bối cảnh xã hội này. Chú thích “đầy tớ” nêu một phương án dịch truyền thống hợp lệ mà không làm giảm nghĩa chính. “Khỏe mạnh” dịch chính xác ὑγιαίνοντα và không thêm ý “được chữa lành.”
