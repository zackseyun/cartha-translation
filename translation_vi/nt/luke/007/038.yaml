  terminology: “Ngài,” “xức,” và “dầu thơm” phù hợp với văn cảnh Kinh Thánh tiếng Việt hiện đại. “Dầu thơm” là cách dịch tự nhiên của μύρον; chú thích b thích đáng khi nêu lựa chọn “thuốc mỡ thơm.” Các ký hiệu chú thích được đặt đúng tại “hôn chân Ngài” và “xức dầu thơm,” tương ứng với nội dung chú thích.
