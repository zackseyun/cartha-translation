source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: vi
  text: Bà đứng phía sau, bên chân Ngài mà khóc. Bà bắt đầu lấy nước mắt làm ướt chân Ngài, rồi lấy tóc mình mà lau. Bà hôn chân Ngài[a] và xức dầu thơm lên chân Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cứ hôn chân Ngài”; động từ Hy Lạp có sắc thái nhấn mạnh, và thì chưa hoàn thành có thể gợi hành động lặp đi lặp lại.'
    reason: lexical_alternative
  - marker: b
    text: “Dầu thơm” cũng có thể hiểu là thuốc mỡ thơm; từ Hy Lạp chỉ loại dầu hoặc thuốc mỡ có hương thơm.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: đứng
  rationale: Phân từ bất định của ἵστημι dùng để dựng bối cảnh; “đứng” tự nhiên trong tiếng Việt và không diễn giải quá mức trình tự hành động.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: phía sau, bên chân Ngài
  rationale: Giữ cả ý “phía sau” của ὀπίσω và vị trí gần chân do παρά với đối cách biểu thị; cách nói này cũng phù hợp với tư thế nằm nghiêng dự tiệc trong bối cảnh.
- source_word: κλαίουσα
  choice: mà khóc
  rationale: Diễn tả hành động khóc đang tiếp diễn, đồng thời kết nối tự nhiên với việc bà đứng phía sau bên chân Chúa Giê-xu.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: bắt đầu lấy nước mắt làm ướt
  rationale: Giữ rõ ý khởi đầu của ἤρξατο và nghĩa cụ thể “làm ướt” của βρέχειν mà không cường điệu thành “đẫm”.
- source_word: ἐξέμασσεν
  choice: lấy ... mà lau
  rationale: Động từ chỉ hành động lau hoặc lau khô; “lau” giữ trọng tâm ở hành động và tránh áp đặt kết quả đã khô hoàn toàn.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: lấy tóc mình
  rationale: Tiếng Hy Lạp nói rõ tóc trên đầu bà; trong tiếng Việt, “tóc mình” đã tự nhiên và đầy đủ, còn dịch sát “tóc trên đầu mình” sẽ nặng nề không cần thiết.
- source_word: κατεφίλει
  choice: hôn
  rationale: Dịch chính gọn và tự nhiên; sắc thái nhấn mạnh hoặc lặp lại của động từ ghép cùng thể chưa hoàn thành được nêu ở chú thích để tránh diễn giải quá mức trong chính văn.
- source_word: ἤλειφεν
  choice: xức
  rationale: “Xức” là động từ tự nhiên cho việc thoa dầu thơm lên thân thể và giữ được sắc thái văn hóa của hành động.
- source_word: τῷ μύρῳ
  choice: dầu thơm
  rationale: μύρον chỉ dầu hoặc thuốc mỡ có hương thơm; “dầu thơm” rõ nghĩa, thông dụng và phù hợp với vật được xức trong câu chuyện.
theological_decisions:
- issue: Cách trình bày những hành động của người phụ nữ đối với chân Chúa Giê-xu
  choice: 'Giữ nguyên các hành động cụ thể và giàu cảm xúc: khóc, làm ướt chân bằng nước mắt, lấy tóc lau, hôn và xức dầu thơm.'
  alternative: Làm nhẹ sắc thái thân thể hoặc diễn giải thành một hành động “bày tỏ lòng sùng kính”.
  rationale: Bản Hy Lạp kể trực tiếp các hành động khiêm nhường và xúc động nhưng không tự gắn cho chúng một lời giải thích thần học; bản dịch vì thế không thêm động cơ hay ý nghĩa giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-xu theo mạch văn, không thêm tước hiệu vốn không có trong câu. Các câu ngắn giúp cảnh tượng rõ ràng mà vẫn giữ chuỗi hành động liên tiếp của nguyên văn.
