  source_fidelity: 'Bản dịch chuyển tải đầy đủ chuỗi hành động trong câu Hy Lạp: người phụ nữ đứng phía sau, ở gần chân Ngài, khóc, bắt đầu làm ướt chân Ngài bằng nước mắt, lấy tóc lau, hôn chân Ngài và xức μύρον lên đó. “Bắt đầu” phản ánh rõ ἤρξατο; “làm ướt” không cường điệu βρέχειν; “xức dầu thơm” phù hợp với ἤλειφεν τῷ μύρῳ. Chú thích a bảo tồn cách hiểu hợp lý về sắc thái nhấn mạnh/lặp lại của κατεφίλει mà không thêm diễn giải vào chính văn.'
