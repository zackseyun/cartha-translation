    issue: “những người ấy” không biểu thị rõ giới tính nam của οἱ ἄνδρες.
    rationale: Danh từ ἀνήρ trong câu này nói đến các người nam; có thể giữ chi tiết này bằng “những người đàn ông ấy”.
  - severity: low
    issue: Viết hoa “Đấng Phải Đến” không theo quy ước viết hoa thông thường của tiếng Việt.
    rationale: 'Danh xưng có thể được nhận biết bằng “Đấng”; các thành tố còn lại nên viết thường: “Đấng phải đến”.'
  - severity: low
    issue: “đến thưa với ngài” làm mờ quan hệ giữa việc được sai đến với nội dung lời nhắn được giới thiệu bởi λέγων.
    rationale: “đến gặp ngài, với lời nhắn rằng” vừa tự nhiên vừa bảo toàn ý Giăng sai họ đến với một thông điệp.
