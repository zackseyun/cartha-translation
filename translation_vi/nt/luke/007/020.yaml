review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhìn chung chuyển tải đúng trình tự và nội dung câu Hy Lạp. Tuy nhiên, οἱ ἄνδρες chỉ rõ các sứ giả là nam, trong khi “những người ấy” trung tính về giới. Cụm “đến thưa với ngài” cũng khiến cấu trúc ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων kém trực tiếp hơn; bản sửa giữ rõ ý “sai chúng tôi đến gặp ngài” và lời nhắn kèm theo. “Đấng phải đến” duy trì được chức năng danh xưng của ὁ ἐρχόμενος mà không diễn giải nhân vật này.
  naturalness: “Những người đàn ông ấy” là cách nói hiện đại, rõ nghĩa trong ngữ cảnh tường thuật. “với lời nhắn rằng” nối tự nhiên việc Giăng sai phái với nội dung lời nói. Theo chính tả tiếng Việt thông dụng, chỉ viết hoa từ đầu của danh xưng (“Đấng phải đến”), không viết hoa từng từ theo lối tiếng Anh.
  terminology: “Giăng, người làm phép báp-têm” phản ánh danh xưng ὁ βαπτιστής mà không biến nó thành họ. “Đấng phải đến” là cách dịch danh xưng đã quen dùng, vẫn để ngỏ sắc thái Mê-si-a/cánh chung của nguyên văn. Chú thích cung cấp phương án “Đấng sẽ đến” mà không áp đặt cách giải nghĩa.
  issues:
