id: LUK.7.20
reference: Luke 7:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: vi
  text: 'Khi những người đàn ông ấy đến gặp Đức Giê-su, họ nói: “Giăng, người làm phép báp-têm, đã sai chúng tôi đến gặp ngài, với lời nhắn rằng: ‘Ngài có phải là Đấng phải đến[a] không, hay chúng tôi nên trông đợi một người khác?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đấng sẽ đến.”'
    reason: Biến thể dịch hợp lệ của phân từ danh hóa ὁ ἐρχόμενος; cách dịch này diễn rõ nét tương lai nhưng có thể làm giảm sắc thái danh xưng trong ngữ cảnh.
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Khi những người ấy đến gặp Đức Giê-su
  rationale: Diễn đạt tự nhiên hoàn cảnh đi trước của phân từ aorist và hướng đến của πρὸς. Dùng tên Đức Giê-su theo ngữ cảnh để tránh đại từ tiếng Việt thiếu tự nhiên hoặc dễ gây mơ hồ.
- source_word: οἱ ἄνδρες
  choice: những người ấy
  rationale: Chỉ nhóm sứ giả nam đã được nhắc đến trong ngữ cảnh; không thêm con số vì câu Hy Lạp này không nêu rõ số lượng.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Giăng, người làm phép báp-têm
  rationale: Giữ tên quen thuộc Giăng và diễn rõ chức danh βαπτιστής bằng tiếng Việt hiện đại, thay vì coi “Báp-tít” như một họ hoặc tên riêng.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: đã sai chúng tôi đến thưa với ngài
  rationale: Giữ ý sai phái và nội dung sứ điệp, đồng thời dùng cấu trúc lời nói tự nhiên trong tiếng Việt.
- source_word: ὁ ἐρχόμενος
  choice: Đấng Phải Đến
  rationale: Giữ sắc thái danh xưng chỉ nhân vật được mong đợi mà không giải thích trực tiếp đó là ai; “phải đến” thể hiện điều được định trước hoặc trông đợi trong ngữ cảnh.
- source_word: ἄλλον προσδοκῶμεν
  choice: chúng tôi nên trông đợi một người khác
  rationale: “Trông đợi” chuyển tải cả sự mong chờ lẫn chờ đợi của προσδοκάω; “một người khác” làm rõ đối tượng chỉ người của ἄλλον.
theological_decisions:
- issue: Sắc thái Mê-si-a của ὁ ἐρχόμενος
  choice: Đấng Phải Đến
  alternative: Đấng sẽ đến
  rationale: Cách dịch chính giữ lực của một danh xưng cánh chung và sự căng thẳng trong câu hỏi, nhưng không chèn trực tiếp từ “Mê-si-a” vốn không có trong câu Hy Lạp.
- issue: Cách gọi Đức Giê-su trong lời trực tiếp
  choice: ngài
  alternative: thầy
  rationale: Tiếng Hy Lạp chỉ dùng đại từ σύ, không có tước hiệu. “Ngài” là đại từ kính trọng, tự nhiên trong tiếng Việt và không thêm vai trò thần học như một danh xưng cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Đấng Phải Đến” để biểu thị chức năng danh xưng trong ngữ cảnh, không nhằm xác quyết thêm một cách giải nghĩa giáo phái. Tất cả dấu chú thích đều được đặt ngay sau cụm từ liên quan.
