  terminology: “Sự khôn ngoan” là tương đương chuẩn của σοφία. “Xác nhận là đúng” phù hợp với δικαιόω trong ngữ cảnh công khai chứng tỏ là đúng, không áp đặt nghĩa xưng công chính pháp đình. Chú thích vẫn nêu các phương án từ vựng và giữ đối chiếu với Ma-thi-ơ.
