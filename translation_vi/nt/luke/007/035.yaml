  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: vi
  text: Nhưng sự khôn ngoan đã được tất cả con cái của mình xác nhận là đúng.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được biện minh” hoặc “đã được chứng tỏ là đúng.”'
    reason: lexical_alternative
  - marker: b
    text: “Con cái” là hình ảnh ẩn dụ chỉ những người cho thấy sự khôn ngoan là đúng qua cách họ đáp ứng hoặc sống.
    reason: lexical_alternative
  - marker: c
    text: 'Ma-thi-ơ 11:19 chép: “sự khôn ngoan được chứng tỏ là đúng bởi những việc làm của mình.”'
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: Trong ngữ cảnh, καί mang sắc thái tương phản nhẹ sau lời phê phán thế hệ không chịu đáp ứng; “Nhưng” diễn đạt tự nhiên mà không làm tương phản mạnh quá mức.
- source_word: ἐδικαιώθη
  choice: đã được … chứng minh là đúng
  rationale: Động từ ở thể bị động, thì aorist; tại đây nói đến việc sự khôn ngoan được xác nhận hoặc tỏ ra là đúng, không phải sự xưng công chính theo nghĩa pháp đình.
- source_word: ἡ σοφία
  choice: sự khôn ngoan
  rationale: Cách dịch thông dụng và tự nhiên của σοφία, đồng thời giữ nguyên hình ảnh nhân cách hóa trong câu.
- source_word: ἀπὸ πάντων
  choice: được tất cả … chứng minh
  rationale: Với động từ bị động, ἀπό có thể chỉ tác nhân hoặc nguồn của sự xác nhận. Cấu trúc tiếng Việt này truyền đạt rằng toàn thể “con cái” là những người chứng thực sự khôn ngoan.
- source_word: τῶν τέκνων αὐτῆς
  choice: con cái mình
  rationale: Giữ nghĩa trực tiếp “con cái” và phép ẩn dụ của bản Hy Lạp. “Mình” quy chiếu tự nhiên về “sự khôn ngoan” đã được nhân cách hóa, tránh cách diễn đạt gượng ép.
theological_decisions:
- issue: Ý nghĩa của “con cái” của sự khôn ngoan
  choice: Giữ nguyên ẩn dụ “con cái” trong chính văn, chỉ những người gắn bó với hoặc thể hiện sự khôn ngoan của Đức Chúa Trời.
  alternative: Hiểu là kết quả, hoa trái hay công việc do sự khôn ngoan sinh ra; hoặc điều chỉnh theo “công việc” trong Ma-thi-ơ 11:19.
  rationale: Bản Hy Lạp Lu-ca đọc τέκνων, nghĩa là “con cái”. Giữ hình ảnh này bảo toàn sự hàm súc và căng thẳng thần học, thay vì giải nghĩa ngay trong chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ thể bị động và phép nhân cách hóa của nguyên bản; “chứng minh là đúng” tự nhiên hơn “minh oan” trong ngữ cảnh này và tránh gợi ý rằng sự khôn ngoan bị buộc tội theo nghĩa pháp lý.
