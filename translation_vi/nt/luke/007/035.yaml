  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của SBLGNT: sắc thái đối lập nhẹ của καί, chủ ngữ được nhân cách hóa “sự khôn ngoan,” thể bị động của ἐδικαιώθη, tác nhân bao quát ἀπὸ πάντων, và hình ảnh τέκνων αὐτῆς là “con cái của mình.” Không thay “con cái” bằng “công việc.”'
