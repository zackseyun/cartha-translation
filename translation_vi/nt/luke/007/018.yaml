lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: thuật lại
  rationale: Diễn đạt tự nhiên hành động báo lại hoặc kể lại những điều đã xảy ra, phù hợp văn phong tường thuật và không làm tăng mức độ trang trọng.
- source_word: Ἰωάννῃ / ὁ Ἰωάννης
  choice: cho Giăng / Giăng
  rationale: Dùng tên gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt; cách đặt câu thể hiện rõ Giăng vừa là người nhận tin vừa là chủ thể của hành động tiếp theo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Giăng
  rationale: Nêu rõ sở hữu ở lần đầu để tránh đại từ 'ông' có thể bị hiểu nhầm theo văn cảnh; 'môn đồ' giữ được quan hệ thầy–trò và người đi theo.
- source_word: περὶ πάντων τούτων
  choice: mọi việc ấy
  rationale: Bao quát πάντων và giữ sắc thái hồi chỉ của τούτων; 'việc' tự nhiên hơn 'điều' khi nói về chuỗi sự kiện vừa được kể.
- source_word: προσκαλεσάμενος
  choice: gọi
  rationale: Giữ nghĩa Giăng chủ động gọi các môn đồ, nhưng không thêm hướng 'đến với mình' vốn không được nói rõ trong nguyên văn.
- source_word: δύο τινὰς τῶν μαθητῶν αὐτοῦ
  choice: hai người trong số các môn đồ của mình
  rationale: Thể hiện cấu trúc bộ phận của cụm sở hữu và sắc thái chọn hai người không được nêu danh của τινάς, mà không dùng lối nói gượng như 'hai người nào đó'.
