reference: Luke 7:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: vi
  text: Nhưng các ông đi ra để xem gì? Một người mặc y phục mềm mại[a] sao? Kìa, những người mặc y phục sang trọng và sống xa hoa thì ở trong các cung điện hoàng gia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này chỉ loại y phục mềm, tinh tế gắn với sự xa hoa, không hàm ý người mặc yếu đuối về đạo đức.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong các triều đình của vua.” Từ Hy Lạp chỉ nơi ở hoàng gia hoặc bối cảnh cung đình.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý tương phản trong chuỗi câu hỏi tu từ của Đức Giê-su.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: các ông đi ra để xem gì
  rationale: Giữ cấu trúc câu hỏi và ý mục đích của động từ nguyên mẫu ἰδεῖν, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἄνθρωπον
  choice: một người
  rationale: Chỉ một cá nhân trong câu hỏi tu từ; tiếng Việt không cần nhấn mạnh giới tính bằng từ 'đàn ông' ở đây.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: mặc áo mềm mại
  rationale: Giữ hình ảnh cụ thể về loại áo mềm, tinh tế gắn với đời sống sung túc, không đưa hàm ý yếu đuối về đạo đức vào bản dịch.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Tiểu từ hướng sự chú ý của người nghe; 'Kìa' trang trọng, ngắn gọn và tự nhiên trong văn Kinh Thánh hiện đại.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: mặc y phục sang trọng
  rationale: ἐνδόξῳ trong ngữ cảnh chỉ vẻ lộng lẫy, quý phái của y phục; 'sang trọng' truyền đạt rõ sự tương phản xã hội.
- source_word: τρυφῇ ὑπάρχοντες
  choice: sống xa hoa
  rationale: Diễn đạt tự nhiên trạng thái sống trong sự xa xỉ, hưởng thụ mà danh từ τρυφή biểu thị.
- source_word: ἐν τοῖς βασιλείοις
  choice: ở trong các cung điện hoàng gia
  rationale: Giữ số nhiều và làm rõ βασίλεια là nơi ở thuộc hoàng gia hoặc bối cảnh triều đình.
theological_decisions:
- issue: Nghĩa của μαλακοῖς trong ngữ cảnh
  choice: Áo mềm mại, tức loại áo tinh tế gắn với sự sung túc
  alternative: Áo của người yếu đuối hoặc ẻo lả
  rationale: Vế tiếp theo nói đến y phục sang trọng, đời sống xa hoa và cung điện hoàng gia, cho thấy đây là sự tương phản về hoàn cảnh sống chứ không phải lời phán xét về tính cách hay giới.
- issue: Phạm vi nghĩa của βασιλείοις
  choice: các cung điện hoàng gia
  alternative: các triều đình của vua
  rationale: Từ Hy Lạp có thể chỉ nơi ở hoàng gia hoặc môi trường cung đình; bản chính dùng cách diễn đạt chỉ địa điểm cụ thể, còn chú thích bảo lưu khả năng 'triều đình'.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phản ánh đối tượng số nhiều được Đức Giê-su trực tiếp chất vấn; giữ chuỗi câu hỏi tu từ và từ chỉ thị “Kìa”.
