  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: vi
  text: Người chết ngồi dậy và bắt đầu nói. Rồi Đức Giê-su trao anh cho mẹ anh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo ý hàm chứa trong ngữ cảnh: “trao anh lại cho mẹ anh” hoặc “trả anh về với mẹ.” Tiếng Hy Lạp chỉ nói: “trao anh cho mẹ anh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: ngồi dậy
  rationale: Động từ chỉ việc chuyển từ tư thế nằm sang tư thế ngồi; “ngồi dậy” tự nhiên trong tiếng Việt và không nói quá điều bản văn nêu.
- source_word: ὁ νεκρός
  choice: người chết
  rationale: Cách dịch này bám sát danh từ hóa trong tiếng Hy Lạp, đồng thời tự nhiên và trang trọng hơn “thi thể” trong ngữ cảnh người thanh niên vừa được làm cho sống lại.
- source_word: ἤρξατο λαλεῖν
  choice: bắt đầu nói
  rationale: Diễn đạt đúng cấu trúc khởi phát ἄρχομαι với động từ nguyên mẫu và phù hợp văn phong tường thuật hiện đại.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Đức Giê-su trao anh cho mẹ anh
  rationale: “Trao” chuyển tải δίδωμι tự nhiên trong quan hệ giữa người với người. Chủ thể được nêu rõ là Đức Giê-su để tránh đại từ “ngài” thiếu tự nhiên hoặc mơ hồ trong tiếng Việt; không thêm “lại” vào chính văn vì tiếng Hy Lạp chỉ nói “trao/cho”.
theological_decisions:
- issue: Có nên nói rõ Đức Giê-su trao người con “lại” cho mẹ hay “trả” anh về với mẹ không
  choice: Giữ cách diễn đạt đơn giản “trao anh cho mẹ anh” trong chính văn
  alternative: “trao anh lại cho mẹ anh” hoặc “trả anh về với mẹ”
  rationale: Ngữ cảnh hàm ý sự phục hồi người con cho người mẹ, nhưng δίδωμι không có thành tố minh nhiên mang nghĩa “lại” hay “trả về”. Giữ câu chính sát bản văn và nêu sắc thái phục hồi trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đức Giê-su” xác định rõ chủ thể theo mạch văn; “anh” phù hợp với người con trai trưởng thành hoặc thanh niên được nhắc đến trong ngữ cảnh. Dấu chú thích đặt sau câu có cụm từ cần giải thích.
