  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các yếu tố của câu Hy Lạp: καὶ ἀνεκάθισεν ὁ νεκρός (“Người chết ngồi dậy”), καὶ ἤρξατο λαλεῖν (“và bắt đầu nói”), và καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ (“[Đức Giê-su] trao anh cho mẹ anh”). Việc nêu rõ chủ thể “Đức Giê-su” dựa trên ngữ cảnh trước đó và cần thiết cho tiếng Việt tự nhiên, không thêm nội dung thần học. “Trao” giữ được động từ δίδωμι mà không đưa ý “trả lại” vào chính văn.'
  naturalness: Câu văn là tiếng Việt tiêu chuẩn hiện đại, rõ ràng và có nhịp kể phù hợp. “Người chết ngồi dậy” và “bắt đầu nói” tự nhiên trong ngữ cảnh tường thuật. “Rồi” diễn đạt liên kết καί theo lối kể chuyện tiếng Việt mà không làm thay đổi trình tự hay ý nghĩa.
