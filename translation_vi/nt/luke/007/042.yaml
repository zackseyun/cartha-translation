source:
  edition: SBLGNT
  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: vi
  text: Vì họ không có gì để trả, chủ nợ đã rộng lòng tha nợ cho cả hai.[a] Vậy ai trong hai người sẽ yêu chủ nợ hơn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã xóa nợ cho cả hai.” Động từ Hy Lạp có thể chỉ việc rộng lòng ban cho hoặc xóa, miễn khoản nợ họ phải trả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Vì họ không có gì để trả
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh và nguyên do; trong ngữ cảnh món nợ, cách diễn đạt này tự nhiên và cho thấy họ không có khả năng trả nợ.
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: chủ nợ đã rộng lòng tha nợ cho cả hai
  rationale: χαρίζομαι chỉ hành động ban cho cách nhưng không hoặc miễn điều đang mắc nợ. “Rộng lòng tha nợ” vừa giữ sắc thái ân huệ vừa diễn đạt rõ ý xóa khoản nợ trong dụ ngôn. Chủ ngữ “chủ nợ” được nêu lại cho rõ trong tiếng Việt.
- source_word: τίς οὖν αὐτῶν
  choice: Vậy ai trong hai người
  rationale: οὖν đánh dấu kết luận từ tình huống vừa nêu; “vậy” tự nhiên trong tiếng Việt, còn “trong hai người” xác định hai con nợ.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: sẽ yêu chủ nợ hơn
  rationale: Giữ nghĩa tương lai và so sánh của nguyên văn. Đại từ αὐτόν được diễn đạt bằng “chủ nợ” để tránh sự mơ hồ không tự nhiên về đối tượng được yêu trong tiếng Việt.
theological_decisions:
- issue: Cách dịch χαρίζομαι trong dụ ngôn về món nợ
  choice: rộng lòng tha nợ
  alternative: xóa nợ; miễn nợ
  rationale: Ngữ cảnh trực tiếp là tài chính, nhưng động từ còn mang sắc thái ban ơn cách nhưng không. “Rộng lòng tha nợ” giữ được cả ý miễn khoản nợ lẫn sắc thái ân huệ mà không áp đặt một kết luận giáo lý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “chủ nợ” để làm rõ các đại từ theo ngữ cảnh ngay trước đó; tránh từ ngữ giáo phái.
