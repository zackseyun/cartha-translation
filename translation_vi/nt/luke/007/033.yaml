  terminology: “Giăng Báp-tít” là tên gọi quen dùng trong truyền thống Kinh Thánh tiếng Việt và nhận diện rõ nhân vật. “Quỷ” tương ứng đúng với δαιμόνιον; không thay bằng “uế linh,” vốn không phải từ được dùng trong câu này. Chú thích cung cấp cách diễn đạt thành ngữ “bị quỷ ám” mà không thay thế cách dịch sát trong bản văn.
