id: LUK.7.33
reference: Luke 7:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: vi
  text: 'Vì Giăng Báp-tít đã đến, không ăn bánh cũng không uống rượu, mà các người lại nói: “Ông ấy có quỷ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói tự nhiên hơn: “Ông ấy bị quỷ ám.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: đã đến
  rationale: Dùng “đã đến” để thể hiện thì hoàn thành của động từ, vừa chỉ việc Giăng đã xuất hiện vừa giữ sự liên hệ của việc ấy với lời nhận xét hiện tại.
- source_word: γὰρ
  choice: Vì
  rationale: Từ này giới thiệu lời giải thích cho phát biểu ngay trước đó; “Vì” tự nhiên và giữ rõ quan hệ lập luận.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Giăng Báp-tít
  rationale: Đây là tên gọi quen thuộc, dễ nhận biết trong tiếng Việt dành cho nhân vật lịch sử được mệnh danh theo hoạt động làm phép báp-têm.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: không ăn bánh cũng không uống rượu
  rationale: Giữ nguyên hai hình ảnh cụ thể “bánh” và “rượu”, đồng thời diễn đạt tự nhiên cấu trúc phủ định song hành mô tả lối sống khổ hạnh của Giăng.
- source_word: λέγετε
  choice: các người lại nói
  rationale: “Các người” thể hiện ngôi thứ hai số nhiều bằng ngôn ngữ hiện đại; “lại” làm rõ phản ứng trái chiều trong thế đối chiếu của ngữ cảnh mà không thay đổi nội dung lời buộc tội.
- source_word: Δαιμόνιον ἔχει
  choice: Ông ấy có quỷ
  rationale: Dịch sát cấu trúc “có một quỷ”, giữ nguyên hình thức trực tiếp và sắc thái của lời buộc tội; cách nói tự nhiên hơn được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch δαιμόνιον trong lời buộc tội Giăng
  choice: quỷ
  alternative: tà linh; uế linh
  rationale: “Quỷ” tương ứng trực tiếp với δαιμόνιον trong ngữ cảnh này. Không dùng “uế linh” vì đó là một cách diễn đạt có liên hệ nhưng khác với từ ngữ Hy Lạp thực sự xuất hiện ở đây.
- issue: Mức độ diễn giải của Δαιμόνιον ἔχει
  choice: có quỷ
  alternative: bị quỷ ám
  rationale: Bản chính giữ cấu trúc cụ thể của nguyên văn thay vì tự động giải nghĩa thành tình trạng bị ám; cách diễn đạt thành ngữ được cung cấp trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “các người” thay cho “các ngươi” để tránh sắc thái cổ; lời nói vẫn giữ tính chất đối chất. Dấu chú thích được đặt ngay sau mệnh đề mà nó giải thích.
