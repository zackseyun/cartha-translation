  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: vi
  text: 'Giê-su đáp lời ông: “Si-môn, tôi có điều muốn nói với ông.” Ông thưa: “Thưa Thầy, xin nói đi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát: “Thưa Thầy, hãy nói.” Từ Hy Lạp Διδάσκαλε có nghĩa là “Thầy” (nghĩa cơ bản: người dạy), còn εἰπέ là “hãy nói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp lời
  rationale: Cụm phân từ đi với động từ nói là một công thức kể chuyện. “Đáp lời” giữ ý hồi đáp mà tránh lối dịch cứng “đáp và nói” trong tiếng Việt.
- source_word: εἶπεν πρὸς αὐτόν
  choice: đáp lời ông
  rationale: Đại từ αὐτόν chỉ người Pha-ri-si tên Si-môn trong ngữ cảnh; “ông” là cách xưng gọi tự nhiên và tôn trọng trong tiếng Việt.
- source_word: Σίμων
  choice: Si-môn
  rationale: Phiên âm tên riêng theo cách quen thuộc trong tiếng Việt.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: tôi có điều muốn nói với ông
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp, đồng thời thể hiện rõ σοί, “với ông”.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: διδάσκαλος có nghĩa trực tiếp là người dạy; “Thầy” vừa tự nhiên trong lời xưng hô vừa không thêm sắc thái quyền chủ của “Chủ”.
- source_word: εἰπέ
  choice: xin nói đi
  rationale: Mệnh lệnh số ít mời Giê-su tiếp tục nói. Từ “xin” thể hiện phép lịch sự hàm chứa trong cách thưa gửi tiếng Việt, còn “đi” làm câu mời tự nhiên.
- source_word: φησίν
  choice: ông thưa
  rationale: Thì hiện tại lịch sử được chuyển sang lối kể tiếng Việt không đánh dấu thì; “thưa” phù hợp với lời của Si-môn dành cho người ông gọi là Thầy.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi—ông” trong lời Giê-su nói với Si-môn để tránh tự ý áp đặt một hệ thống đại từ mang sắc thái thần học hoặc thứ bậc mạnh hơn nguyên văn; Si-môn đáp bằng “thưa” để lời thoại tự nhiên và kính trọng.
