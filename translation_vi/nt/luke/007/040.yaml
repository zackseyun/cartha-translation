  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu Hy Lạp: công thức tự sự ἀποκριθεὶς ... εἶπεν được diễn đạt tự nhiên là “đáp lời”; σοί được giữ bằng “với ông”; và lời đáp xưng hô Διδάσκαλε, εἰπέ được chuyển đạt đúng. “Ông thưa” là cách kể tự nhiên trong tiếng Việt, phù hợp với lời xưng “Thưa Thầy”, không làm thay đổi nghĩa.'
  naturalness: Văn bản tự nhiên, sáng rõ, và có mức độ trang trọng thích hợp. Cặp xưng hô “tôi—ông” nhất quán trong lời Giê-su nói với Si-môn; “Thưa Thầy, xin nói đi” là lời mời lịch sự, tự nhiên trong tiếng Việt hiện đại.
  terminology: '“Giê-su”, “Si-môn” và “Thầy” đều phù hợp. Cần chỉnh nhẹ chú thích: cách nêu “Thầy” hoặc “người dạy” như hai lựa chọn dịch trực tiếp chưa thật chính xác về mặt chức năng xưng hô; đồng thời nên nêu rõ “hãy nói” là cách dịch sát của εἰπέ, đối chiếu với cách diễn đạt tự nhiên “xin nói đi” trong thân bài.'
