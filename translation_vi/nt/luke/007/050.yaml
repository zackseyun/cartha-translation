  source_fidelity: 'Bản chính chuyển tải đúng các thành tố của câu Hy Lạp: lời nói hướng đến người phụ nữ, πίστις là “đức tin,” thì hoàn thành σέσωκέν σε là “đã cứu,” và thành ngữ mệnh lệnh πορεύου εἰς εἰρήνην là “hãy đi bình an.” “Rồi” diễn đạt δέ như một nối tiếp tự sự cách tự nhiên. Tuy nhiên, bản thảo chưa giữ chú thích về lựa chọn từ vựng của πίστις và vì vậy không phản ánh đầy đủ các khả năng được lưu trong audit trail tiếng Anh.'
