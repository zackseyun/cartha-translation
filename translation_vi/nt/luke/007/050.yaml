  terminology: “Đức tin,” “đã cứu,” và “bình an” là các thuật ngữ phù hợp với ngữ cảnh tha tội của Lu-ca 7:36–50 mà không thu hẹp σῴζω vào chữa lành thể chất. Chú thích cần nêu “lòng tin” và, ít có khả năng hơn, “sự trung tín” cho πίστις; chú thích về σῴζω nên giữ khả năng “chữa lành/làm cho được lành.”
