base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: vi
  text: 'Rồi Ngài nói với người phụ nữ: “Đức tin của chị[a] đã cứu chị[b]; hãy đi bình an.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng tin của chị”; ít có khả năng hơn ở đây là “sự trung tín của chị.”
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp cũng có thể được dịch là “đã chữa lành chị” hoặc “đã làm cho chị được lành”; tuy nhiên, ở đây ngữ cảnh nhấn mạnh sự tha tội và cứu rỗi.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Rồi Ngài nói
  rationale: δέ nối tiếp diễn biến câu chuyện; “rồi” tự nhiên trong tiếng Việt và không hàm ý tương phản quá mức. εἶπεν được dịch trực tiếp là “nói”.
- source_word: πρὸς τὴν γυναῖκα
  choice: với người phụ nữ
  rationale: Trong ngữ cảnh, γυνή chỉ người phụ nữ đang hiện diện, không mang nghĩa “vợ”. Cấu trúc “nói với” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἡ πίστις σου
  choice: Đức tin của chị
  rationale: πίστις ở đây nói đến sự tin cậy của người phụ nữ nơi Chúa Giê-xu. “Đức tin” giữ thuật ngữ thần học quen thuộc, còn “của chị” diễn đạt đại từ sở hữu và cách xưng hô phù hợp với một phụ nữ trưởng thành.
- source_word: σέσωκέν σε
  choice: đã cứu chị
  rationale: Thì hoàn thành Hy Lạp trình bày hành động đã hoàn tất với kết quả còn hiệu lực. Trong bối cảnh nói về sự tha tội, “đã cứu” phù hợp hơn nghĩa chữa lành thể chất, dù động từ cũng có thể mang nghĩa ấy ở nơi khác.
- source_word: πορεύου εἰς εἰρήνην
  choice: hãy đi bình an
  rationale: Đây là cách diễn đạt tự nhiên và trang trọng cho thành ngữ Hy Lạp, truyền đạt việc ra đi trong tình trạng bình an thay vì dịch cứng là “đi vào sự bình an”.
theological_decisions:
- issue: Ý nghĩa của σῴζω trong mối liên hệ với sự tha thứ và cứu rỗi
  choice: “đã cứu chị”
  alternative: “đã chữa lành chị” hoặc “đã làm cho chị được lành”
  rationale: Mạch văn Lu-ca 7:36–50 tập trung vào tội lỗi được tha và sự đáp ứng bằng đức tin. “Đã cứu” giữ được trọng lượng cứu rỗi của câu mà không khẳng định nhiều hơn điều bản văn nói.
- issue: Sắc thái của πίστις
  choice: “đức tin”
  alternative: “lòng tin” hoặc, ít có khả năng hơn ở đây, “sự trung tín”
  rationale: Trong ngữ cảnh này, từ ngữ chủ yếu chỉ sự tin cậy của người phụ nữ nơi Chúa Giê-xu. “Đức tin” là cách dịch chuẩn và tự nhiên, đồng thời không biến nó thành công trạng; sắc thái “sự trung tín” kém phù hợp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo quy chiếu gần trong ngữ cảnh đến Chúa Giê-xu; dùng “chị” để diễn đạt tự nhiên lời nói trực tiếp với một phụ nữ trưởng thành. Giữ cụm quen thuộc “hãy đi bình an” thay vì lối dịch sát chữ nhưng thiếu tự nhiên.
