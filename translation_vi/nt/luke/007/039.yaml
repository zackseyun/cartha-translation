  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng bối cảnh người Pha-ri-si thấy hành động đang diễn ra, lời tự nhủ, câu điều kiện mang sắc thái hoài nghi/phản thực, sự nhấn mạnh về căn tính lẫn phẩm hạnh/tiếng tăm của người phụ nữ, và mệnh đề ὅτι với cách hiểu nhân quả được chú thích cách hiểu nội dung. Tuy nhiên, “đang chạm vào mình” có thể được hiểu phản thân, tức người phụ nữ chạm vào chính cô ấy, thay vì chạm vào Đức Giê-su.
  naturalness: Văn phong hiện đại, rõ và có register phù hợp. Thay “mình” bằng “ông ta” trong lời nghĩ loại bỏ một mơ hồ không có trong nguyên văn, đồng thời giữ được giọng xa cách của người Pha-ri-si.
  terminology: “Pha-ri-si,” “Đức Giê-su,” “nhà tiên tri,” và “người tội lỗi” đều phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. “Thuộc hạng người nào” chuyển tải hợp lý ποταπή và sắc thái đánh giá của nhân vật.
