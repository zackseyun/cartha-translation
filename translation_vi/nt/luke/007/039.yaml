id: LUK.7.39
reference: Luke 7:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: vi
  text: 'Khi người Pha-ri-si đã mời Đức Giê-su thấy vậy, ông thầm nghĩ: “Nếu người này là một nhà tiên tri, hẳn ông ta đã biết người phụ nữ đang chạm vào ông ta là ai, thuộc hạng người nào[a], vì cô ấy là người tội lỗi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nhấn mạnh cả người phụ nữ ấy là ai lẫn cô thuộc loại người nào, tức tư cách hoặc tiếng tăm của cô.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “rằng cô ấy là người tội lỗi.” Cụm này có thể được hiểu là điều ông nghĩ một nhà tiên tri phải biết, hoặc là lý do ông xếp cô vào hạng người ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Khi ... thấy vậy
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh thời gian của động từ chính; “thấy vậy” tự nhiên trong tiếng Việt và quy chiếu đến hành động ngay trước đó. δέ chỉ sự tiếp diễn nhẹ trong trình thuật nên không cần dịch thành một từ nối riêng.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: người Pha-ri-si đã mời Đức Giê-su
  rationale: Trong bối cảnh bữa ăn, καλέω có nghĩa là mời; “đã mời” cho thấy hành động xảy ra trước. Dùng “Đức Giê-su” thay đại từ để câu tiếng Việt rõ chủ thể.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: ông thầm nghĩ
  rationale: Thành ngữ chỉ lời nói nội tâm; “thầm nghĩ” là cách diễn đạt tự nhiên, gọn và giữ đúng ý.
- source_word: Οὗτος
  choice: người này
  rationale: Giữ sắc thái xa cách, có phần coi thường của đại từ chỉ định mà không cường điệu.
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: Nếu người này là một nhà tiên tri, hẳn ông ta đã biết
  rationale: Kết cấu εἰ với thì chưa hoàn thành và mệnh đề chính có ἄν diễn tả giả định trái với điều người Pha-ri-si tin; “hẳn ... đã biết” truyền đạt sắc thái phản thực tự nhiên trong tiếng Việt.
- source_word: τίς καὶ ποταπὴ
  choice: là ai, thuộc hạng người nào
  rationale: 'Giữ cả hai phương diện: căn tính và loại người/tư cách hay tiếng tăm. “Thuộc hạng người nào” cũng phản ánh thái độ phán xét của người Pha-ri-si.'
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: người phụ nữ đang chạm vào mình
  rationale: “Đang chạm” giữ sắc thái tiếp diễn của thì hiện tại; “mình” quy chiếu tự nhiên đến người được chạm trong lời nghĩ gián tiếp.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: vì cô ấy là người tội lỗi
  rationale: ὅτι có thể mang nghĩa nguyên nhân hoặc nội dung; bản chính dùng “vì” theo mạch phán xét, còn chú thích bảo tồn khả năng đọc là “rằng”.
theological_decisions:
- issue: Sắc thái của câu điều kiện về việc Đức Giê-su có phải là nhà tiên tri
  choice: 'Dịch như giả định trái với niềm tin của người Pha-ri-si: “Nếu ... hẳn ... đã biết”.'
  alternative: 'Cách trung tính hơn: “Nếu người này là nhà tiên tri thì ông ta sẽ biết ...”.'
  rationale: εἰ ἦν ... ἐγίνωσκεν ἂν tự nhiên biểu thị điều kiện phản thực và sự hoài nghi của người Pha-ri-si, nhưng lời dịch không xác nhận phán đoán của ông.
- issue: Quan hệ của ὅτι ἁμαρτωλός ἐστιν với phần trước
  choice: 'Bản chính hiểu theo nguyên nhân: “vì cô ấy là người tội lỗi”.'
  alternative: 'Hiểu như nội dung điều Đức Giê-su hẳn phải biết: “rằng cô ấy là người tội lỗi”.'
  rationale: Cả hai cách liên kết đều có thể nghe được trong tiếng Hy Lạp; giữ cách đọc chính tự nhiên trong câu và ghi cách khác ở chú thích để không loại bỏ sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Pha-ri-si” là cách phiên âm quen thuộc; “nhà tiên tri” tự nhiên trong tiếng Việt phổ thông. Đại từ trong lời nghĩ (“người này”, “ông ta”, “cô ấy”) duy trì khoảng cách và thái độ của nhân vật mà không thêm lời miệt thị ngoài nguyên văn.
