  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: vi
  text: 'Vì vậy, tôi nói với ông: nhiều tội của chị ấy đã được tha, bởi vì chị ấy yêu mến nhiều.[a] Còn người được tha ít thì yêu mến ít.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vì vậy chị ấy yêu mến nhiều.” Liên từ Hy Lạp có thể được hiểu theo cách nhấn mạnh rằng tình yêu mến của chị là bằng chứng cho thấy chị đã được tha thứ, chứ không phải là nguyên nhân khiến chị được tha thứ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên sức liên kết nhân quả/suy luận của thành ngữ Hy Lạp, đồng thời nối câu này với dụ ngôn ngay trước đó.
- source_word: ἀφέωνται
  choice: đã được tha
  rationale: Thì hoàn thành bị động chỉ hành động tha thứ đã hoàn tất và kết quả vẫn còn hiệu lực; cách nói này tự nhiên trong tiếng Việt.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: nhiều tội lỗi của chị ấy
  rationale: Giữ đầy đủ ý số lượng của αἱ πολλαί và diễn đạt theo trật tự tự nhiên của tiếng Việt.
- source_word: ὅτι
  choice: bởi vì
  rationale: Giữ nghĩa nhân quả bề mặt của liên từ Hy Lạp và không âm thầm giải quyết sự căng thẳng với dụ ngôn trước đó.
- source_word: ἠγάπησεν πολύ
  choice: chị ấy yêu nhiều
  rationale: Giữ động từ 'yêu' và trạng từ chỉ mức độ, đồng thời bảo toàn sự song hành với 'yêu ít' ở cuối câu.
- source_word: ᾧ δὲ
  choice: Còn người
  rationale: Diễn đạt tự nhiên một chủ thể khái quát, không áp đặt giới tính mà tiếng Hy Lạp không đòi hỏi trong cách dùng này.
- source_word: ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ
  choice: được tha ít thì yêu ít
  rationale: Giữ cấu trúc cân đối, ngắn gọn và sắc thái như một lời kết luận có tính cách ngôn.
theological_decisions:
- issue: ὅτι có trình bày tình yêu của người phụ nữ như nguyên nhân khiến chị được tha thứ hay như bằng chứng cho tình trạng đã được tha hay không
  choice: Dịch sát là 'bởi vì chị ấy yêu nhiều', đồng thời thêm chú thích về cách hiểu tình yêu như bằng chứng của sự tha thứ.
  alternative: Diễn ý là 'cho nên chị ấy yêu nhiều' để trình bày sự tha thứ như nguyên nhân trực tiếp của tình yêu.
  rationale: Bản văn Hy Lạp dùng ὅτι, thường có nghĩa 'bởi vì', trong khi dụ ngôn ngay trước đó và câu 50 có thể khiến độc giả hiểu tình yêu là kết quả hoặc dấu hiệu của sự tha thứ. Bản dịch giữ nguyên sự căng thẳng này thay vì giải quyết bằng lối diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “tôi” khi Đức Chúa Jêsus nói với người đối thoại theo lối tự nhiên của tiếng Việt; dùng “ông” cho người nam được nói trực tiếp đến và “chị ấy” cho người phụ nữ, tránh sắc thái miệt thị hoặc quá cổ. Dấu chú thích [a] đặt ngay sau mệnh đề mà chú thích giải thích.
