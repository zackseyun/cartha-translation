    issue: Liên kết chủ ngữ mơ hồ trong “và thưa rằng”
    rationale: Sau “Ông sai họ,” liên từ “và” có thể được đọc là nối hành động “thưa” với chủ ngữ “Ông.” Cụm “để thưa rằng” minh định rằng đây là lời nhắn do những người được sai chuyển đạt, đồng thời phù hợp với λειτουργ năng của λέγων trong câu Hy Lạp.
