base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: vi
  text: 'Ông sai họ đến với Chúa để thưa rằng: “Ngài có phải là Đấng Phải Đến[a] không, hay chúng tôi nên trông đợi một người khác?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đấng đang đến” hoặc “người sẽ đến.” Cụm từ Hy Lạp có thể được hiểu theo nghĩa miêu tả, nhưng trong ngữ cảnh này có lẽ được dùng như một danh hiệu chỉ Đấng được mong đợi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: Ông sai họ đến
  rationale: Động từ aorist diễn tả hành động kể chuyện đã xảy ra. Đại từ “họ” làm rõ đối tượng được sai vốn có từ ngữ cảnh ngay trước đó, giúp câu tiếng Việt tự nhiên.
- source_word: πρὸς τὸν κύριον
  choice: đến với Chúa
  rationale: πρός với đối cách chỉ hướng đến một người. “Chúa” giữ được sắc thái tôn kính và sức nặng Kitô học của κύριος trong trình thuật Lu-ca.
- source_word: λέγων
  choice: và thưa rằng
  rationale: Phân từ hiện tại dẫn vào nội dung lời nhắn. “Thưa rằng” là cách nói tự nhiên, trang trọng trong tiếng Việt khi môn đồ ngỏ lời với Chúa.
- source_word: Σὺ εἶ
  choice: Ngài có phải là ... không
  rationale: Chuyển cấu trúc Hy Lạp thành dạng nghi vấn tự nhiên trong tiếng Việt; “Ngài” phù hợp với lời thưa trực tiếp, tôn kính.
- source_word: ὁ ἐρχόμενος
  choice: Đấng Phải Đến
  rationale: Cụm phân từ có mạo từ hoạt động như một danh xưng chỉ nhân vật được mong đợi. Cách dịch này tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ sắc thái danh hiệu, trong khi chú thích bảo lưu nghĩa miêu tả sát chữ.
- source_word: ἄλλον
  choice: một người khác
  rationale: Tính từ giống đực được dùng như danh từ. “Một người khác” tự nhiên và không áp đặt rằng nhân vật thay thế cũng phải được gọi bằng một danh hiệu.
- source_word: προσδοκῶμεν
  choice: chúng tôi nên trông đợi
  rationale: Giữ sắc thái cân nhắc trong câu hỏi và ý nghĩa mong chờ của động từ; “chúng tôi” phản ánh ngôi thứ nhất số nhiều.
theological_decisions:
- issue: Cách dịch κύριος như danh hiệu dành cho Đức Giê-su
  choice: Chúa
  alternative: chủ; thầy
  rationale: “Chúa” vừa phù hợp với cách dùng tôn kính trong Lu-ca vừa không làm nhẹ sức nặng Kitô học có thể có của danh hiệu.
- issue: ὁ ἐρχόμενος là danh hiệu hay lời miêu tả
  choice: Đấng Phải Đến
  alternative: đấng đang đến; người sẽ đến
  rationale: Trong ngữ cảnh, cụm từ chỉ nhân vật cứu thế được mong đợi, nên bản chính dùng hình thức danh hiệu. Chú thích nêu nghĩa miêu tả sát hơn để không che khuất tính linh hoạt của tiếng Hy Lạp.
- issue: Sắc thái của προσδοκῶμεν trong câu hỏi lựa chọn
  choice: nên trông đợi
  alternative: đang trông đợi; phải chờ đợi
  rationale: Hình thức Hy Lạp có thể được hiểu theo sắc thái chỉ định hoặc cân nhắc; “nên” diễn đạt tự nhiên câu hỏi về điều họ phải làm mà không biến nó thành một mệnh lệnh thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời thưa trực tiếp và “Chúa” cho κύριος. Viết hoa “Đấng Phải Đến” để biểu thị chức năng danh hiệu, đồng thời dùng chú thích để bảo lưu cách hiểu miêu tả.
