id: LUK.7.31
reference: Luke 7:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: vi
  text: Vậy, tôi sẽ ví những người thuộc thế hệ này với ai? Họ giống ai?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: tôi sẽ ví ... với ai?
  rationale: Giữ hình thức câu hỏi tu từ và ý nghĩa của động từ ὁμοιόω là so sánh, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  choice: những người thuộc thế hệ này
  rationale: ἄνθρωποι ở đây chỉ con người nói chung trong thế hệ đương thời, không nhất thiết riêng nam giới; “thuộc thế hệ này” truyền đạt rõ quan hệ sở thuộc của cụm sở hữu cách.
- source_word: καὶ τίνι εἰσὶν ὅμοιοι
  choice: Họ giống ai?
  rationale: Giữ câu hỏi thứ hai song song nhưng tránh lối diễn đạt nặng nề; đại từ “họ” quy chiếu rõ về những người thuộc thế hệ này.
theological_decisions:
- issue: Phạm vi của ἀνθρώπους
  choice: những người
  alternative: những người đàn ông
  rationale: Danh từ số nhiều ἄνθρωποι thường mang nghĩa bao quát “người ta/con người”; văn cảnh không đòi hỏi giới hạn đối tượng vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “Vậy” cho οὖν nhằm nối lập luận với lời trước đó; tách thành hai câu hỏi để phản ánh cấu trúc Hy Lạp và tạo nhịp tự nhiên trong tiếng Việt.
