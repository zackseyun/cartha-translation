id: LUK.7.32
reference: Luke 7:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: vi
  text: 'Họ giống như những đứa trẻ ngồi ngoài chợ, lớn tiếng gọi nhau và nói rằng: “Chúng tôi đã thổi sáo[a] cho các bạn, các bạn không nhảy múa; chúng tôi đã than khóc[b], các bạn không khóc.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chơi sáo” hoặc, theo lối truyền thống hơn, “thổi ống sáo”. Động từ Hy Lạp chỉ cụ thể việc chơi một loại sáo hay ống sáo.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hát khúc than”, “hát khúc bi ca” hoặc “cất tiếng than khóc”. Từ Hy Lạp có thể chỉ việc than khóc, kể cả một lời ca than trong tang lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Họ giống như
  rationale: Diễn đạt trực tiếp phép so sánh bằng lối nói tự nhiên trong tiếng Việt hiện đại.
- source_word: παιδίοις
  choice: những đứa trẻ
  rationale: Danh từ chỉ trẻ em nói chung, không xác định giới tính hay thu hẹp độ tuổi quá mức.
- source_word: ἐν ἀγορᾷ
  choice: ở chợ
  rationale: ἀγορά chỉ khu chợ hay quảng trường công cộng; “ở chợ” ngắn gọn, tự nhiên và phù hợp với khung cảnh sinh hoạt cộng đồng.
- source_word: καθημένοις
  choice: ngồi
  rationale: Giữ rõ tư thế của những đứa trẻ bằng cách diễn đạt đơn giản, hiện hành.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: gọi nhau mà nói
  rationale: Giữ cả ý gọi lớn hoặc lên tiếng nói với nhau và sắc thái tương hỗ của ἀλλήλοις.
- source_word: ἃ λέγει
  choice: mà nói
  rationale: Chuyển cấu trúc đại từ quan hệ và động từ số ít mang nghĩa tập thể sang một kết cấu tiếng Việt tự nhiên, không làm thay đổi chủ thể là những đứa trẻ.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Chúng tôi đã thổi sáo cho các bạn
  rationale: αὐλέω nói cụ thể đến việc thổi một loại sáo hoặc ống; “thổi sáo” vừa rõ nghĩa vừa giữ hình ảnh cụ thể.
- source_word: οὐκ ὠρχήσασθε
  choice: các bạn không nhảy múa
  rationale: Diễn đạt hành động đáp lại tiếng sáo một cách trực tiếp, không thêm ý giải thích như vui mừng hay ăn mừng.
- source_word: ἐθρηνήσαμεν
  choice: chúng tôi đã hát khúc ai ca
  rationale: θρηνέω có thể chỉ việc than khóc hoặc cất một bài ca tang; trong trò chơi đối lập với thổi sáo, “hát khúc ai ca” giữ rõ tính trình diễn của hành động.
- source_word: οὐκ ἐκλαύσατε
  choice: các bạn không khóc
  rationale: κλαίω có nghĩa là khóc hoặc than khóc; “không khóc” tự nhiên, rõ ràng và không đồng nhất hành động này với chính việc hát ai ca.
theological_decisions:
- issue: Giữ nguyên sức gợi của hai hoạt động tương phản trong phép ví sánh mà không giải thích trước ý nghĩa áp dụng của Chúa Giê-su
  choice: 'Dùng các hành động cụ thể: “thổi sáo”, “nhảy múa”, “hát khúc ai ca”, “khóc”'
  alternative: Diễn giải thành “vui mừng”, “ăn mừng” và “đau buồn”
  rationale: Câu này trình bày hình ảnh ví sánh chứ chưa trực tiếp giải nghĩa nó. Ngôn ngữ cụ thể giữ được hình ảnh và sự căng thẳng thần học mà không áp đặt một cách hiểu hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Chúng tôi/các bạn” thể hiện lời đối đáp giữa các nhóm trẻ mà không dùng đại từ quá khẩu ngữ; các hình ảnh cụ thể của nguyên văn được giữ nguyên.
