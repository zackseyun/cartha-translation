translation:
  language: vi
  text: 'nói rằng: “Người này đã khởi công xây dựng mà không thể hoàn tất[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “không đủ sức để hoàn tất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'nói rằng:'
  rationale: Phân từ hiện tại nối với chủ thể ngầm ở câu trước; ὅτι dẫn vào nội dung lời nói. Cách dùng dấu hai chấm và ngoặc kép tự nhiên trong tiếng Việt mà vẫn giữ quan hệ cú pháp.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Người này
  rationale: Giữ sắc thái chỉ trỏ, công khai của cụm từ Hy Lạp mà không thêm sắc thái khinh miệt quá mức như “tên này”.
- source_word: ἤρξατο οἰκοδομεῖν
  choice: đã khởi công xây dựng
  rationale: Diễn đạt tự nhiên hành động bắt đầu xây trong đúng ngữ cảnh công trình; “khởi công” làm rõ nét nghĩa bắt đầu mà không thêm một tân ngữ không có trong nguyên văn.
- source_word: οὐκ ἴσχυσεν
  choice: không thể
  rationale: Trong ngữ cảnh này, ἰσχύω chỉ khả năng đủ để làm xong, không nhất thiết riêng sức lực thể chất. “Không thể” là cách diễn đạt tự nhiên, đồng thời chú thích giữ phương án sát nghĩa sức lực hơn.
- source_word: ἐκτελέσαι
  choice: hoàn tất
  rationale: Chỉ việc đưa công trình đến chỗ hoàn thành; “hoàn tất” trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
