  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý nghĩa của λέγοντες ὅτι: những người chứng kiến nói về người ấy, rằng ông ta đã bắt đầu xây nhưng không có khả năng hoàn tất. “Người này” giữ được sắc thái chỉ trỏ của Οὗτος ὁ ἄνθρωπος mà không thêm tính miệt thị. “Đã khởi công xây dựng” phản ánh ἤρξατο οἰκοδομεῖν; “không thể hoàn tất” chuyển đạt đúng οὐκ ἴσχυσεν ἐκτελέσαι.'
