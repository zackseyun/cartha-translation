- from: 'Nhưng tất cả đều đồng loạt bắt đầu xin cáo lỗi[a]. Người thứ nhất nói với ông: “Tôi đã mua một thửa ruộng và cần phải đi xem. Xin ông cho tôi được cáo lỗi.”'
  to: 'Nhưng tất cả đều nhất loạt bắt đầu xin cáo lỗi[a]. Người thứ nhất nói với ông: “Tôi đã mua một thửa đất và cần phải đi ra xem nó. Xin ông cho tôi được cáo lỗi.”'
  rationale: Chỉnh nhẹ để giữ phạm vi nghĩa rộng của ἀγρός, phản ánh rõ hơn ἐξελθών, và diễn đạt thành ngữ ἀπὸ μιᾶς tự nhiên, sát nghĩa hơn. Chú thích hiện có vẫn đúng nội dung và neo tại cụm “bắt đầu xin cáo lỗi”.
