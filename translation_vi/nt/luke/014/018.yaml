base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: vi
  text: 'Nhưng tất cả đều nhất loạt bắt đầu xin cáo lỗi[a]. Người thứ nhất nói với ông: “Tôi đã mua một thửa đất và cần phải đi ra xem nó. Xin ông cho tôi được cáo lỗi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bắt đầu viện cớ để từ chối.” Động từ Hy Lạp có thể chỉ việc từ chối một lời mời bằng cách đưa ra lý do.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: Trong mạch văn, liên từ này mở ra sự tương phản giữa lời mời trước đó và phản ứng từ chối của khách.
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: tất cả ... bắt đầu xin cáo lỗi
  rationale: Diễn đạt việc mọi người bắt đầu từ chối lời mời bằng cách viện lý do; “xin cáo lỗi” giữ sắc thái lịch sự và phù hợp với lời nói tiếp theo.
- source_word: ἀπὸ μιᾶς
  choice: đồng loạt
  rationale: Thành ngữ mang nghĩa cùng nhau hoặc như một; “đồng loạt” tự nhiên trong tiếng Việt mà không nhất thiết hàm ý họ đã bàn bạc trước.
- source_word: Ἀγρὸν
  choice: một thửa ruộng
  rationale: Diễn đạt trực tiếp một mảnh đất hoặc cánh đồng; “thửa ruộng” là cách nói tự nhiên, cụ thể, không thêm ý về cả một trang trại.
- source_word: ἠγόρασα
  choice: đã mua
  rationale: Thể aorist chỉ hành động mua đã hoàn tất; “đã mua” tự nhiên trong tiếng Việt và giữ sự liên hệ hiện tại của việc mua.
- source_word: ἔχω ἀνάγκην
  choice: cần phải
  rationale: Truyền đạt rõ ý bắt buộc hoặc cần thiết của thành ngữ Hy Lạp.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: đi xem
  rationale: Diễn đạt tự nhiên hành động đi ra để xem mảnh ruộng; không dùng “kiểm tra” vì từ Hy Lạp không nhất thiết mang sắc thái khảo sát kỹ.
- source_word: ἐρωτῶ σε
  choice: Xin ông
  rationale: Chuyển công thức yêu cầu trực tiếp thành lối thỉnh cầu lịch sự, tự nhiên trong lời thoại tiếng Việt.
- source_word: ἔχε με παρῃτημένον
  choice: cho tôi được cáo lỗi
  rationale: Thành ngữ yêu cầu chủ tiệc chấp nhận sự vắng mặt hoặc lời từ chối; cách dịch này giữ cả ý thỉnh cầu lẫn trạng thái được miễn thứ.
- source_word: ὁ πρῶτος
  choice: Người thứ nhất
  rationale: Giữ trực tiếp thứ tự của những người lần lượt nêu lý do.
