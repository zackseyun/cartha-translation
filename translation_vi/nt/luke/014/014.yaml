  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: vi
  text: Và bạn sẽ có phước, vì họ không thể báo đáp bạn; vì bạn sẽ được báo đáp vào lúc sự sống lại của những người công chính.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “trong sự sống lại của những người công chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος ἔσῃ
  choice: bạn sẽ được phước
  rationale: Diễn đạt tự nhiên lời tuyên bố về phước lành trong tương lai, đồng thời giữ sắc thái thần học và cánh chung của μακάριος; “hạnh phúc” dễ bị hiểu chủ yếu là cảm xúc chủ quan.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu nguyên nhân của việc được phước một cách rõ ràng và tự nhiên trong tiếng Việt.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: họ không có khả năng đền đáp bạn
  rationale: Giữ hình thức gần với nghĩa đen “họ không có [để] đền đáp”, đồng thời làm rõ đây là sự thiếu khả năng hoặc phương tiện, không phải không có nghĩa vụ.
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: bởi bạn sẽ được đền đáp
  rationale: Giữ thể bị động tương lai và sự tương ứng từ vựng với ἀνταποδοῦναί; “bởi” truyền đạt chức năng giải thích của γάρ.
- source_word: ἐν τῇ ἀναστάσει
  choice: trong sự sống lại
  rationale: Giữ sát giới từ ἐν và bảo tồn cách diễn đạt có thể được hiểu là trong biến cố hoặc vào thời điểm sống lại.
- source_word: τῶν δικαίων
  choice: của những người công chính
  rationale: Nêu rõ nhóm người được bổ nghĩa bởi sở hữu cách, bằng cách diễn đạt hiện đại và có trọng lượng đạo đức-thần học.
theological_decisions:
- issue: Ý nghĩa của “sự sống lại của những người công chính”
  choice: Giữ nguyên như một sự sống lại trong tương lai gắn với những người công chính.
  alternative: Hiểu là cuộc sống lại chung nhưng nhấn mạnh người công chính, hoặc một cuộc sống lại riêng của người công chính.
  rationale: Câu này khẳng định sự báo đáp của Đức Chúa Trời trong tương lai nhưng không tự nó xác định toàn bộ trình tự các biến cố cánh chung; bản dịch không giải quyết thay văn bản cuộc tranh luận đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bạn” theo lối xưng hô trực tiếp phổ thông; “được phước” giữ sắc thái Kinh Thánh quen thuộc. Dấu chấm đặt sau ký hiệu chú thích để bảo đảm [a] xuất hiện trong chính văn.
