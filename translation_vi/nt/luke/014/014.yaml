  to: Và bạn sẽ có phước, vì họ không thể báo đáp bạn; vì bạn sẽ được báo đáp vào lúc sự sống lại của những người công chính.[a]
  rationale: 'Chỉnh sửa nhằm làm tiếng Việt tự nhiên hơn mà không thay đổi ý nghĩa: “có phước” phù hợp với μακάριος ἔσῃ; “không thể báo đáp” diễn đạt sự bất lực ngụ ý trong οὐκ ἔχουσιν ἀνταποδοῦναί; và “vào lúc” làm rõ giá trị thời gian của ἐν. Chú thích được điều chỉnh để nêu lựa chọn sát chữ hơn cho giới từ ἐν.'
  reviewer_model: gpt-5.6-terra
