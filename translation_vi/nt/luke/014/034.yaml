- from: Muối quả là tốt; nhưng nếu ngay cả muối cũng trở nên nhạt[a], thì lấy gì làm cho nó mặn lại?
  to: Vậy, muối thì tốt; nhưng nếu ngay cả muối cũng trở nên nhạt[a], thì sẽ lấy gì để nêm cho nó?
