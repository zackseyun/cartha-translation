source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: vi
  text: Vậy, muối thì tốt; nhưng nếu ngay cả muối cũng trở nên nhạt[a], thì sẽ lấy gì để nêm cho nó?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp này theo nghĩa đen có thể là “trở nên ngu dại”; khi nói về muối, nó chỉ việc trở nên vô vị hoặc mất vị mặn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: tốt
  rationale: Diễn đạt sự đánh giá tích cực chung về muối, tự nhiên trong một câu mang tính châm ngôn mà không thu hẹp nghĩa thành chỉ “hữu ích”.
- source_word: οὖν
  choice: quả là
  rationale: Trong ngữ cảnh, tiểu từ nối kết câu này với lời dạy đi trước. Cách diễn đạt “quả là” tạo sự chuyển tiếp và khẳng định tự nhiên trong tiếng Việt, thay vì dùng “vì vậy” vốn có thể khiến quan hệ suy luận nghe cứng hơn.
- source_word: ἅλας
  choice: muối
  rationale: Giữ nguyên hình ảnh cụ thể và tính châm ngôn của nguyên văn.
- source_word: ἐὰν δὲ καὶ
  choice: nhưng nếu ngay cả ... cũng
  rationale: '“Nhưng” giữ sắc thái tương phản của δέ, còn cấu trúc “ngay cả ... cũng” thể hiện sự nhấn mạnh của καί: đến chính muối cũng có thể trở nên nhạt.'
- source_word: μωρανθῇ
  choice: trở nên nhạt
  rationale: Động từ có nghĩa cơ bản liên quan đến sự ngu dại, nhưng khi dùng với muối thì chỉ việc trở nên vô vị hoặc mất vị mặn. “Trở nên nhạt” vừa tự nhiên vừa giữ sắc thái biến đổi của dạng động từ.
- source_word: ἐν τίνι
  choice: lấy gì
  rationale: Diễn đạt tự nhiên trong tiếng Việt phương tiện được hỏi đến trong câu hỏi tu từ.
- source_word: ἀρτυθήσεται
  choice: làm cho nó mặn lại
  rationale: Động từ có nghĩa nêm hoặc làm cho có vị. Với chủ thể là muối đã nhạt, “làm cho nó mặn lại” truyền đạt rõ nghịch lý của hình ảnh mà không chuyển thành ý trừu tượng như “phục hồi”.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của lời nói về muối
  choice: Giữ nguyên hình ảnh muối trong câu châm ngôn, không giải thích trực tiếp rằng muối tượng trưng cho người môn đồ.
  alternative: Diễn giải trong chính câu rằng nếu người môn đồ đánh mất phẩm chất hoặc bản sắc của mình.
  rationale: Nguyên văn để bối cảnh rộng hơn gợi ra cách áp dụng. Giữ hình ảnh không giải nghĩa thay bảo toàn sức căng và tính mở của lời dạy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “ngay cả ... cũng” bảo toàn điểm nhấn của nguyên văn; câu hỏi cuối giữ dạng tu từ và hình ảnh nêm muối.
