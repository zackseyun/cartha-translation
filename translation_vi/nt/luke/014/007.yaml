translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp lối kể về Chúa Giê-su. Dấu chú thích được đặt sau “những chỗ danh dự,” đúng với từ mà chú thích giải nghĩa; vị trí sau “những người được mời” trong lớp tham khảo tiếng Anh có vẻ là lỗi gắn dấu.
