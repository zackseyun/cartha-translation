  rationale: Chỉ thay “ẩn dụ” bằng “dụ ngôn” để dịch đúng παραβολή và điều chỉnh nhẹ trật tự từ cho tự nhiên. Giữ nguyên ý nghĩa, thể đang diễn tiến của hành động chọn chỗ, và vị trí neo chú thích tại thuật ngữ được giải thích.
