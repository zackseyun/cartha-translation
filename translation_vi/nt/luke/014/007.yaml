review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa thuật ngữ chính: παραβολή trong văn cảnh Phúc Âm là “dụ ngôn”, không phải “ẩn dụ”. “Ẩn dụ” trong tiếng Việt thường chỉ phép tu từ metaphor, do đó làm thu hẹp và sai lệch thể loại mà bản văn gọi tên. Các yếu tố còn lại nhìn chung phản ánh đúng: thì chưa hoàn thành được diễn đạt tự nhiên, người “được mời”, sự quan sát việc họ chọn chỗ danh dự, và lời dẫn vào phát ngôn trực tiếp.'
  naturalness: Câu văn trang trọng, hiện đại và dễ hiểu. Việc tách “Ngài nói với họ” thành một câu riêng là tự nhiên trong tiếng Việt, dù bản Hy Lạp liên kết bằng phân từ. Sau khi đổi “ẩn dụ” thành “dụ ngôn”, câu sẽ phù hợp hơn với cách dùng Kinh Thánh tiếng Việt hiện đại.
  terminology: Dùng “dụ ngôn” cho παραβολή. “Chỗ danh dự” truyền đạt tốt πρωτοκλισίας; chú thích “những chỗ ngồi hàng đầu” nêu phương án sát hơn với hình ảnh chỗ ngồi nổi bật trong bữa tiệc.
  issues:
  - severity: medium
    issue: “ẩn dụ” được dùng để dịch παραβολήν
    rationale: Trong tiếng Việt hiện đại, “ẩn dụ” chủ yếu là thuật ngữ chỉ biện pháp tu từ, trong khi παραβολή ở đây là “dụ ngôn” theo cách phân loại của tác giả Tin Mừng. “Dụ ngôn” vừa chính xác hơn vừa là thuật ngữ Kinh Thánh quen thuộc.
  revised_text: 'Ngài kể một dụ ngôn cho những người được mời, khi nhận thấy họ đang chọn những chỗ danh dự[a]. Ngài nói với họ:'
