base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: vi
  text: 'Ngài kể một dụ ngôn cho những người được mời, khi nhận thấy họ đang chọn những chỗ danh dự[a]. Ngài nói với họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những chỗ ngồi hàng đầu.” Từ Hy Lạp chỉ những vị trí được coi trọng nhất tại một bữa tiệc.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ngài kể
  rationale: Động từ ở thì chưa hoàn thành tạo bối cảnh cho lời dạy tiếp theo; tiếng Việt không mã hóa thể tiếp diễn bằng hình thái động từ, và “kể” đi tự nhiên với “ẩn dụ”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ. Mạch văn tiếng Việt đã chuyển ý tự nhiên, nên thêm “bấy giờ” hoặc “nhưng” có thể tạo sắc thái thời gian hay tương phản quá mức.
- source_word: τοὺς κεκλημένους
  choice: những người được mời
  rationale: Giữ trọng tâm của phân từ hoàn thành ở tình trạng đã được mời, thay vì bổ sung danh từ “khách” vốn chỉ được hàm ý.
- source_word: παραβολήν
  choice: một ẩn dụ
  rationale: Đây là thuật ngữ quen thuộc trong các sách Phúc Âm cho παραβολή, đồng thời phù hợp với lời dạy minh họa tiếp theo.
- source_word: ἐπέχων
  choice: khi nhận thấy
  rationale: Diễn đạt hoàn cảnh dẫn đến lời dạy và hàm ý sự quan sát chú tâm mà không nặng nề.
- source_word: πῶς
  choice: họ đang
  rationale: Ý chỉ cách thức biểu hiện qua hành động đang diễn ra được chuyển tự nhiên vào toàn mệnh đề tiếng Việt, thay vì dịch máy móc bằng “thế nào”.
- source_word: τὰς πρωτοκλισίας
  choice: những chỗ danh dự
  rationale: Truyền đạt địa vị xã hội của các vị trí nổi bật nhất tại bàn tiệc rõ hơn cách dịch sát chữ “những chỗ nằm đầu tiên”.
- source_word: ἐξελέγοντο
  choice: đang chọn
  rationale: “Đang” thể hiện hành động đang diễn ra của thì chưa hoàn thành; ngữ cảnh đã cho thấy họ chọn các chỗ ấy cho mình nên không cần thêm “cho chính mình”.
- source_word: λέγων πρὸς αὐτούς
  choice: Ngài nói với họ
  rationale: Tách thành câu dẫn trực tiếp giúp tiếng Việt sáng rõ và tự nhiên, trong khi vẫn giữ chức năng giới thiệu lời nói tiếp theo.
