  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: vi
  text: Nó chẳng thích hợp cho đất, cũng chẳng thích hợp cho đống phân[a]; người ta ném nó ra ngoài. Ai có tai để nghe[b], hãy nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đống phân bón.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Người nào có tai để nghe, người ấy hãy nghe.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: đất
  rationale: Trong hình ảnh nông nghiệp này, γῆ chỉ đất trồng, không phải trái đất theo nghĩa vũ trụ. “Đất” tự nhiên, rõ nghĩa và đi đôi phù hợp với “đống phân”.
- source_word: κοπρίαν
  choice: đống phân
  rationale: κοπρία chỉ phân hoặc nơi chứa phân dùng trong nông nghiệp. “Đống phân” giữ được tính cụ thể, mộc mạc của hình ảnh và là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: εὔθετόν
  choice: thích hợp
  rationale: εὔθετος có nghĩa là phù hợp hoặc dùng được cho một mục đích. “Thích hợp” giữ sắc thái đánh giá mà không thu hẹp nghĩa thành chỉ “hữu ích”.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: người ta ném nó ra ngoài
  rationale: Động từ Hy Lạp ở thể chủ động số nhiều với chủ thể không xác định. “Người ta” bảo toàn cấu trúc chủ động và “ra ngoài” diễn đạt trực tiếp ἔξω.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Ai có tai để nghe, hãy nghe
  rationale: “Ai” diễn đạt tự nhiên phân từ có mạo từ với ý nghĩa khái quát; “hãy nghe” giữ nguyên lực mệnh lệnh của ἀκουέτω. Cụm “tai để nghe” bảo toàn công thức nhấn mạnh khả năng tiếp nhận và đáp ứng.
theological_decisions:
- issue: Dạng giống đực đại diện trong lời kêu gọi kết thúc
  choice: Ai có tai để nghe, hãy nghe
  alternative: Người nào có tai để nghe, người ấy hãy nghe
  rationale: Tiếng Hy Lạp dùng giống đực số ít nhưng mang chức năng khái quát. Tiếng Việt không đánh dấu giống trong đại từ “ai”, nên cách dịch này bao gồm mọi người mà không làm mất số ít đại diện hay lực mệnh lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu đầu giữ phép song hành phủ định οὔτε...οὔτε bằng “chẳng... cũng chẳng...”; “người ta” thể hiện chủ thể số nhiều không xác định; lời kết dùng công thức ngắn gọn, có sức kêu gọi.
