id: LUK.14.12
reference: Luke 14:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: vi
  text: 'Ngài cũng nói với người đã mời Ngài: “Khi ông dọn bữa trưa[a] hay bữa tối, đừng mời bạn bè, anh em, bà con hoặc những người láng giềng giàu có, kẻo họ cũng mời lại ông[b], và như thế ông được đáp lễ[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bữa ăn ban ngày”. Từ Hy Lạp ἄριστον chỉ bữa ăn sớm hơn, thường vào khoảng giữa ngày, chứ không nhất thiết là bữa sáng theo cách hiểu hiện đại.
    reason: lexical_alternative
  - marker: b
    text: Hay “mời ông để đáp lại”. Động từ Hy Lạp có nghĩa là mời lại để đáp lại lời mời trước đó.
    reason: lexical_alternative
  - marker: c
    text: 'Dịch sát hơn: “và điều đó trở thành sự hoàn trả cho ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Ngài cũng nói
  rationale: Thì chưa hoàn thành đặt lời nói trong diễn tiến của trình thuật; tiếng Việt tự nhiên không cần diễn đạt bằng cấu trúc tiếp diễn nặng nề. “Cũng” thể hiện καὶ, còn δὲ là liên từ nhẹ được chuyển qua mạch văn.
- source_word: τῷ κεκληκότι αὐτόν
  choice: với người đã mời Ngài
  rationale: 'Giữ rõ ý của phân từ hoàn thành: người ấy trước đó đã mời Chúa Giê-su; cách diễn đạt này minh bạch hơn từ “chủ tiệc” vốn có phần diễn giải.'
- source_word: Ὅταν ποιῇς
  choice: Khi ông dọn
  rationale: Trong ngữ cảnh bữa ăn, ποιέω mang nghĩa chuẩn bị hoặc khoản đãi một bữa; “dọn” là cách nói tự nhiên trong tiếng Việt và không nhất thiết hàm ý một đại tiệc.
- source_word: ἄριστον
  choice: bữa trưa
  rationale: Từ này chỉ bữa ăn sớm hơn trong ngày, thường vào khoảng giữa ngày; “bữa trưa” phân biệt rõ với δεῖπνον và dễ hiểu đối với độc giả hiện đại.
- source_word: δεῖπνον
  choice: bữa tối
  rationale: Chỉ bữa ăn chính vào lúc muộn hơn trong ngày; “bữa tối” giữ sự tương phản với ἄριστον.
- source_word: μὴ φώνει
  choice: đừng mời
  rationale: Dù nghĩa gốc là “gọi”, trong bối cảnh khoản đãi, hành động được nói đến là mời người khác đến dùng bữa.
- source_word: τοὺς φίλους σου
  choice: bạn bè
  rationale: Cách diễn đạt phổ thông, tự nhiên cho những người có quan hệ bằng hữu.
- source_word: τοὺς ἀδελφούς σου
  choice: anh em
  rationale: Giữ hình thức chỉ nam giới của nguyên văn mà vẫn dùng lối nói gia đình tự nhiên trong tiếng Việt; không tự ý mở rộng thành “anh chị em”.
- source_word: τοὺς συγγενεῖς σου
  choice: bà con
  rationale: Cách nói hiện đại và phổ thông cho họ hàng, thân tộc.
- source_word: γείτονας πλουσίους
  choice: những người láng giềng giàu có
  rationale: 'Giữ quan hệ bổ nghĩa trực tiếp: πλουσίους mô tả những người láng giềng.'
- source_word: μήποτε
  choice: kẻo
  rationale: Diễn đạt tự nhiên sắc thái cảnh báo về một kết quả có thể xảy ra.
- source_word: ἀντικαλέσωσίν σε
  choice: họ cũng mời lại ông
  rationale: “Mời lại” thể hiện rõ tính tương hỗ nằm trong động từ ghép ἀντικαλέω.
- source_word: ἀνταπόδομά σοι
  choice: ông được đáp lễ
  rationale: Trong ngữ cảnh lời mời dự tiệc, “đáp lễ” truyền đạt sự hoàn trả mang tính xã hội mà không biến câu thành một tuyên bố khái quát về phần thưởng.
theological_decisions:
- issue: Tính chất của sự hoàn trả trong ἀνταπόδομά σοι
  choice: ông được đáp lễ
  alternative: ông được báo đáp
  rationale: “Đáp lễ” giữ trọng tâm trước mắt là sự mời lại trong quan hệ xã hội. “Báo đáp” có thể gợi nghĩa đạo đức hoặc thần học rộng hơn mức câu này trực tiếp nói, trong khi sự tương phản với phần thưởng khi người công chính sống lại được triển khai ở câu 14.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “Ngài” cho Chúa Giê-su trong lời kể và “ông” cho người chủ tiệc, phù hợp với đối tượng nam số ít trong ngữ cảnh. Câu giữ nhịp liệt kê của nguyên văn nhưng dùng các từ thông dụng như “bạn bè”, “bà con”, “láng giềng” và “kẻo”.
