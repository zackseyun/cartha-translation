  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: vi
  text: kẻo, sau khi đã đặt móng mà không đủ sức hoàn tất, mọi người trông thấy sẽ bắt đầu chế nhạo người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: kẻo
  rationale: Trong lời cảnh báo của dụ ngôn, cụm này dẫn vào hậu quả không mong muốn cần tránh; “kẻo” tự nhiên, cô đọng và giữ được sắc thái cảnh báo.
- source_word: θέντος αὐτοῦ
  choice: sau khi đã đặt
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hành động xảy ra trước hành động chính; cách dịch này thể hiện rõ trình tự thời gian.
- source_word: θεμέλιον
  choice: nền
  rationale: Trong ngữ cảnh xây tháp, “đặt nền” là cách nói tiếng Việt tự nhiên và đủ rõ, không cần thêm mạo từ vốn không có hình thức tương ứng trong tiếng Việt.
- source_word: μὴ ἰσχύοντος
  choice: không đủ sức
  rationale: ἰσχύω ở đây chỉ khả năng thực hiện, nhưng vẫn hàm nét nghĩa về năng lực; “không đủ sức” vừa tự nhiên vừa giữ được sắc thái ấy.
- source_word: ἐκτελέσαι
  choice: hoàn tất
  rationale: Động từ diễn tả việc đưa công trình đến chỗ hoàn thành; “hoàn tất” phù hợp với ngữ cảnh xây dựng và văn phong trang trọng, hiện đại.
- source_word: πάντες οἱ θεωροῦντες
  choice: tất cả những người trông thấy
  rationale: θεωρέω chỉ việc nhìn thấy hoặc quan sát. Không thêm một tân ngữ minh thị vì bản Hy Lạp cũng để đối tượng được hiểu theo ngữ cảnh.
- source_word: ἄρξωνται
  choice: đều bắt đầu
  rationale: Thể giả định nằm trong mệnh đề hậu quả đáng lo ngại do “kẻo” dẫn vào; tiếng Việt không cần thêm “có thể”, và “bắt đầu” giữ đúng ý khởi sự hành động.
- source_word: αὐτῷ ἐμπαίζειν
  choice: chế nhạo người ấy
  rationale: ἐμπαίζω mang nghĩa nhạo báng, chế giễu. “Chế nhạo” rõ nghĩa, trang nhã và thích hợp với giọng văn Kinh Thánh hiện đại.
