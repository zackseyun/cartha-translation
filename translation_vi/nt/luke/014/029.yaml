    issue: “đặt nền” hơi kém tự nhiên trong tiếng Việt hiện đại về ngữ cảnh xây dựng.
    rationale: θεμέλιον là nền móng/foundation; thành ngữ xây dựng thông dụng là “đặt móng.”
  - severity: low
    issue: Từ “lại” thêm nhẹ một sắc thái tương phản.
    rationale: Bản Hy Lạp chỉ liên kết việc đã đặt móng với tình trạng không thể hoàn tất, không nhấn mạnh ý “ngược lại” bằng một từ tương đương “lại.”
