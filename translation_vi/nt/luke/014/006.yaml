  text: And they were not able to reply to these things[a].
translation:
  language: vi
  text: Họ không thể đáp lại những điều ấy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đáp lại điều này” hoặc “trả lời về những điều ấy.” Tiếng Hy Lạp dùng một cách diễn đạt số nhiều, sát nghĩa là “đối với những điều ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp mạch kể; trong tiếng Việt, lược bỏ ở đây tự nhiên hơn mà vẫn giữ nguyên quan hệ với câu trước, không thêm sắc thái thời gian hay kết quả.
- source_word: οὐκ ἴσχυσαν
  choice: không thể
  rationale: Trong ngữ cảnh này, ἰσχύω diễn tả khả năng chứ không phải sức mạnh thể chất; “không thể” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἀνταποκριθῆναι
  choice: đáp lại
  rationale: Giữ được ý đưa ra lời đáp trước điều vừa được nói, nhưng không hàm ý hỗn xược hoặc đối đầu như một số cách diễn đạt mạnh hơn.
- source_word: πρὸς ταῦτα
  choice: những điều ấy
  rationale: Giữ dạng số nhiều của ταῦτα và diễn đạt tự nhiên đối tượng của hành động đáp lại trong tiếng Việt.
theological_decisions: []
