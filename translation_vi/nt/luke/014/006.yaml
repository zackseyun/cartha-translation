  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Họ không thể đáp lại” diễn đạt tự nhiên sự bất lực trong việc đưa ra câu trả lời; chú thích bảo tồn sắc thái số nhiều của nguyên văn.
