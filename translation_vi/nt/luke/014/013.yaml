source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: vi
  text: Nhưng mỗi khi bạn mở tiệc[a], hãy mời những người nghèo, người khuyết tật[b], người què và người mù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tổ chức tiệc” hoặc “mở một buổi tiếp đãi.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp chỉ những người có khiếm khuyết thân thể nói chung; từ kế tiếp, được dịch là “người què,” nói cụ thể hơn về người gặp khó khăn trong việc đi lại.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀλλ’
  choice: Nhưng
  rationale: Liên từ mang ý tương phản với lời dạy ngay trước đó; “Nhưng” tự nhiên và sát mạch văn.
- source_word: ὅταν
  choice: mỗi khi
  rationale: Diễn đạt mệnh đề thời gian bất định đi với thức giả định, hàm ý bất cứ khi nào việc này xảy ra.
- source_word: δοχὴν ποιῇς
  choice: anh chị em mở tiệc
  rationale: Thành ngữ có nghĩa tổ chức một buổi tiếp đãi hay tiệc; “mở tiệc” tự nhiên, gọn và không giới hạn vào một bữa ăn cụ thể.
- source_word: κάλει
  choice: hãy mời
  rationale: Trong bối cảnh tiếp đãi, καλέω có nghĩa rõ ràng là mời dự tiệc; thể mệnh lệnh được giữ bằng “hãy”.
- source_word: πτωχούς
  choice: những người nghèo
  rationale: Diễn đạt tính từ được danh từ hóa bằng cách gọi người tự nhiên trong tiếng Việt.
- source_word: ἀναπείρους
  choice: người khuyết tật
  rationale: Chỉ những người có khiếm khuyết thân thể nói chung. Cách dịch hiện đại, tôn trọng và vẫn phân biệt với χωλούς, vốn cụ thể hơn về khả năng đi lại.
- source_word: χωλούς
  choice: người què
  rationale: Chỉ cụ thể người bị suy giảm khả năng đi lại; “người què” giữ được sự phân biệt với thuật ngữ rộng hơn ἀναπείρους.
- source_word: τυφλούς
  choice: người mù
  rationale: Cách gọi ngắn gọn, thông dụng và trực tiếp tương ứng với từ Hy Lạp.
theological_decisions:
- issue: Cách diễn đạt các nhóm người có khuyết tật mà không làm mất cấu trúc liệt kê của nguyên văn
  choice: Dùng “những người nghèo, người khuyết tật, người què và người mù,” giữ riêng ἀναπείρους và χωλούς.
  alternative: Gộp các nhóm dưới cách gọi chung “người khuyết tật,” hoặc dùng cách nói truyền thống mang sắc thái nặng hơn như “tàn tật.”
  rationale: Mệnh lệnh nhấn mạnh việc tiếp đãi những người dễ bị gạt ra ngoài xã hội. Bản dịch giữ đủ bốn nhóm của nguyên văn, dùng ngôn ngữ hiện đại và không gán thêm một kết luận thần học về căn tính của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh chị em” làm rõ chủ thể ngôi thứ hai số ít mang tính đại diện trong lời dạy, còn danh sách dùng cách gọi người tự nhiên trong tiếng Việt. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
