  rationale: Chỉnh câu để tiếng Việt hiện đại, gọn và tự nhiên hơn, đồng thời duy trì quan hệ gia chủ–đầy tớ, sắc thái mệnh lệnh đã được hoàn tất, và ý còn chỗ trong bữa tiệc. Bỏ chú thích không cần thiết; không có vấn đề biến thể văn bản cần chú thích trong câu này.
