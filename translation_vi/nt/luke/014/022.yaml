  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: vi
  text: 'Người đầy tớ nói: “Thưa chủ, điều chủ truyền đã được thực hiện, và vẫn còn chỗ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: người đầy tớ
  rationale: Trong bối cảnh dụ ngôn về một gia chủ, “người đầy tớ” là cách diễn đạt tự nhiên, trang trọng và vẫn giữ quan hệ phục vụ dưới quyền; từ Hy Lạp cũng có thể chỉ nô lệ.
- source_word: Κύριε
  choice: thưa chủ
  rationale: Đây là hô cách dùng để người đầy tớ xưng hô với gia chủ. “Thưa chủ” tự nhiên trong tiếng Việt và thể hiện đúng quan hệ quyền uy trong câu chuyện, không mặc nhiên biến lời xưng hô này thành một tước hiệu thần học.
- source_word: γέγονεν
  choice: đã được làm xong
  rationale: Thì hoàn thành nhấn mạnh rằng mệnh lệnh đã được thực hiện và kết quả hiện vẫn có hiệu lực; “đã được làm xong” diễn đạt rõ sắc thái hoàn tất.
- source_word: ὃ ἐπέταξας
  choice: điều chủ truyền
  rationale: Cụm này chỉ nội dung mệnh lệnh trước đó. “Điều chủ truyền” gọn, tự nhiên và giữ được sức nặng quyền uy của ἐπιτάσσω.
- source_word: ἔτι
  choice: vẫn còn
  rationale: Diễn tả rằng sau khi thi hành mệnh lệnh, chỗ trống tiếp tục còn lại.
- source_word: τόπος
  choice: chỗ
  rationale: Trong bối cảnh tiệc, “chỗ” tự nhiên hơn “không gian” và có thể chỉ chỗ còn dành cho thêm khách.
theological_decisions:
- issue: Cách hiểu Κύριε trong lời xưng hô
  choice: thưa chủ
  alternative: lạy Chúa
  rationale: Người nói đang thưa với gia chủ trong dụ ngôn; bản dịch giữ nghĩa trong thế giới câu chuyện, đồng thời không loại bỏ những liên hệ rộng hơn mà độc giả có thể nhận thấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người đầy tớ” thay vì “tôi tớ” để tự nhiên hơn trong lời kể hiện đại; dùng cấu trúc “điều chủ truyền đã được làm xong” nhằm giữ sắc thái hoàn thành của nguyên văn.
