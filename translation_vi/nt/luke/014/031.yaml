id: LUK.14.31
reference: Luke 14:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: vi
  text: Hay có vua nào đi giao chiến với một vua khác mà trước hết không ngồi xuống cân nhắc xem mình có thể dùng mười ngàn quân để chống lại người đang đem hai mươi ngàn quân tiến đánh mình không?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chống lại” cũng có thể dịch sát hơn là “đi ra gặp”; trong ngữ cảnh này, động từ Hy Lạp nói đến việc ra nghênh chiến với một đạo quân đang tiến đến.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Nối ví dụ thứ hai với mạch lập luận trước đó và mở đầu tự nhiên cho một câu hỏi tu từ trong tiếng Việt.
- source_word: τίς βασιλεὺς
  choice: có vua nào
  rationale: Diễn đạt tự nhiên lực khái quát của τίς trong câu hỏi tu từ, vốn chờ đợi câu trả lời phủ định.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: đi giao chiến với một vua khác
  rationale: Tái hiện việc tiến vào xung đột quân sự bằng cách diễn đạt rõ ràng, trang trọng và tự nhiên; không xác định quá mức vua nào là bên chủ động ban đầu.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: mà trước hết không ngồi xuống cân nhắc
  rationale: Giữ hình ảnh cụ thể 'ngồi xuống' và trình tự cân nhắc trước khi hành động; cấu trúc câu hỏi tu từ phù hợp tiếng Việt.
- source_word: εἰ δυνατός ἐστιν
  choice: xem mình có thể
  rationale: Thể hiện sự đánh giá về năng lực thực tế, không phải sự cho phép.
- source_word: ἐν δέκα χιλιάσιν
  choice: dùng mười ngàn quân
  rationale: Trong ngữ cảnh quân sự, con số chỉ lực lượng dưới quyền; thêm 'quân' làm rõ ý hàm ẩn mà không thay đổi nội dung.
- source_word: ὑπαντῆσαι
  choice: chống lại
  rationale: Động từ có nghĩa cơ bản là 'đi ra gặp', nhưng trong bối cảnh hai đạo quân giao chiến, 'chống lại' truyền đạt đúng chức năng đối đầu; nghĩa sát chữ được ghi ở chú thích.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: người đang đem hai mươi ngàn quân tiến đánh mình
  rationale: Thể hiện rõ cuộc tiến quân mang tính thù địch của đối phương và lực lượng hai mươi ngàn, đồng thời dùng 'người' để tránh lặp nặng từ 'vua'.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ câu hỏi tu từ, hình ảnh nhà vua ngồi xuống tính toán và thế tương phản mười ngàn với hai mươi ngàn quân. Dùng “giao chiến” và “tiến đánh” để làm rõ bối cảnh quân sự mà không diễn giải thêm ý nghĩa thần học của dụ ngôn.
