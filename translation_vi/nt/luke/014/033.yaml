revisions:
- from: Vậy cũng thế, bất cứ ai trong anh em không từ bỏ mọi tài sản của mình[a] thì không thể làm môn đồ của tôi.
  to: Vậy thì, mỗi người trong anh em không từ bỏ mọi tài sản của mình[a] thì không thể là môn đồ của tôi.
  rationale: Bản sửa làm rõ tính áp dụng cho từng người của πᾶς ἐξ ὑμῶν, dùng liên từ kết luận tự nhiên hơn cho οὕτως οὖν, và dịch sát εἶναι là ‘là’. Chú thích được chỉnh nhẹ để diễn đạt tự nhiên hơn ý nghĩa ngữ cảnh của ἀποτάσσομαι, đồng thời vẫn bảo toàn sự không xác định về hình thức thực hiện việc từ bỏ.
  reviewer_model: gpt-5.6-terra
