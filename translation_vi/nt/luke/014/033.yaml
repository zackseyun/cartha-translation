source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: vi
  text: Vậy thì, mỗi người trong anh em không từ bỏ mọi tài sản của mình[a] thì không thể là môn đồ của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không giã từ mọi thứ mình có.” Động từ Hy Lạp có nghĩa là “từ biệt, giã từ”; trong ngữ cảnh này, từ ấy diễn tả việc từ bỏ quyền giữ tài sản làm của riêng, nhưng không tự nó xác định hình thức cụ thể của sự từ bỏ ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Vậy cũng thế
  rationale: Diễn đạt cả ý suy luận của οὖν lẫn sự liên hệ so sánh của οὕτως với hai minh họa ngay trước đó.
- source_word: πᾶς ἐξ ὑμῶν
  choice: bất cứ ai trong anh em
  rationale: Giữ sắc thái phân phối, nhấn mạnh đòi hỏi này áp dụng riêng cho từng người nghe; “anh em” là cách xưng hô số nhiều tự nhiên trong văn cảnh.
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: không từ bỏ
  rationale: ἀποτάσσομαι có thể mang nghĩa đen là “từ biệt, giã từ”; trong văn cảnh này, “từ bỏ” giữ được ý dứt khoát mà không tự ý quyết định rằng câu chỉ nói đến việc bán hoặc chuyển nhượng tài sản.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: mọi tài sản của mình
  rationale: Dạng danh từ hóa của ὑπάρχω ở đây chỉ những gì thuộc sở hữu của một người. “Của mình” phản ánh đại từ phản thân số ít và dùng tự nhiên cho bất cứ người nào trong tiếng Việt.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: không thể làm môn đồ của tôi
  rationale: Giữ nguyên sức nặng của lời tuyên bố về sự không thể, thay vì làm nhẹ thành một lời khuyên; “môn đồ” diễn đạt mối quan hệ học hỏi và đi theo Chúa Giê-su.
theological_decisions:
- issue: Bản chất của đòi hỏi liên quan đến tài sản
  choice: Dùng “từ bỏ mọi tài sản của mình”, để lời dịch giữ nguyên đòi hỏi triệt để nhưng không ấn định cách thực hiện.
  alternative: “Cho đi hết mọi tài sản của mình” hoặc “từ bỏ quyền sở hữu đối với mọi tài sản của mình”.
  rationale: Động từ ἀποτάσσομαι có thể gợi việc giã từ và dứt bỏ quyền đòi hỏi hoặc sự gắn bó, nhưng chính câu này không giải thích cụ thể việc từ bỏ phải mang hình thức nào. Lời dịch vì thế bảo toàn sức căng thần học thay vì thu hẹp thành một chương trình kinh tế cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc số ít với “ai… của mình” bao quát từng người mà không cần dùng đại từ mang giới tính. Dấu [a] được đặt ngay sau cụm từ cần chú giải.
