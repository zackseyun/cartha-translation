  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: vi
  text: Nếu ai đến với tôi mà không ghét cha, mẹ, vợ, con cái, anh em trai và chị em gái của mình, và ngay cả mạng sống của chính mình, thì người ấy không thể là môn đồ của tôi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không yêu ... ít hơn [yêu tôi].” Động từ theo nghĩa đen là “ghét”, nhưng trong ngữ cảnh này, lời ấy đòi hỏi lòng trung thành với Chúa Giê-su phải được đặt cao hơn cả những mối quan hệ gia đình gần gũi nhất; xem Ma-thi-ơ 10:37.'
    reason: lexical_alternative
  - marker: b
    text: Hay “linh hồn của chính mình.” Ở đây, “mạng sống” phản ánh nghĩa thích hợp của ψυχή trong bối cảnh nói về cái giá của việc làm môn đồ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: ghét
  rationale: Giữ nghĩa trực tiếp và sắc thái gây sửng sốt của động từ Hy Lạp, không âm thầm làm nhẹ thành “yêu ít hơn”; ý nghĩa so sánh về lòng trung thành được nêu trong chú thích.
- source_word: ἔρχεται πρός με
  choice: đến với tôi
  rationale: Diễn đạt trực tiếp chuyển động hướng về Chúa Giê-su, không đổi thành thành ngữ “theo tôi” vốn không phải cấu trúc được dùng tại đây.
- source_word: πατέρα ἑαυτοῦ
  choice: cha ... của chính mình
  rationale: Cụm “của chính mình” thể hiện đại từ phản thân ἑαυτοῦ và áp dụng tự nhiên cho toàn bộ danh sách thân thuộc trong tiếng Việt.
- source_word: γυναῖκα
  choice: vợ
  rationale: Trong danh sách các quan hệ gia đình, γυνή mang nghĩa tự nhiên là “vợ”, không phải nghĩa chung “người phụ nữ”.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: anh em trai, chị em gái
  rationale: Bản nguồn nêu riêng cả danh từ giống đực lẫn giống cái; cách dịch này giữ rõ cả anh/em trai và chị/em gái.
- source_word: ἔτι τε καὶ
  choice: và ngay cả ... nữa
  rationale: Thể hiện sự tăng tiến và nhấn mạnh ở mục cuối của danh sách bằng lối nói tự nhiên trong tiếng Việt.
- source_word: ψυχὴν ἑαυτοῦ
  choice: mạng sống mình
  rationale: Trong bối cảnh cái giá của việc làm môn đồ, ψυχή chủ yếu chỉ chính sự sống của một người; “mạng sống” rõ nghĩa hơn “linh hồn” và vẫn giữ sắc thái có thể phải từ bỏ sự sống.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: không thể làm môn đồ tôi
  rationale: Giữ nguyên sức nặng của sự bất khả hay không tương hợp, thay vì chỉ diễn đạt như một lệnh cấm.
theological_decisions:
- issue: Có nên làm nhẹ yêu cầu của Chúa Giê-su bằng cách dịch μισεῖ theo nghĩa so sánh ngay trong chính văn hay không
  choice: Giữ “ghét” trong chính văn và giải thích cách hiểu “yêu ít hơn” trong chú thích.
  alternative: Dịch “không yêu ... ít hơn” hoặc “không đặt ... sau” ngay trong chính văn.
  rationale: Câu Hy Lạp cố ý dùng lời lẽ mạnh. Giữ “ghét” bảo toàn sức căng thần học, còn chú thích giúp độc giả nhận ra yêu cầu đặt lòng trung thành với Chúa Giê-su lên trên các quan hệ gần gũi nhất.
- issue: Nghĩa của ψυχή trong câu này
  choice: Dịch là “mạng sống”.
  alternative: “linh hồn” hoặc “bản thân”.
  rationale: Ngữ cảnh nói về cái giá của việc làm môn đồ và quyền ưu tiên tuyệt đối đối với chính sự sống, không nhằm xác định riêng một thành phần phi vật chất của con người.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự danh sách được điều chỉnh tự nhiên thành “cha mẹ, vợ con…” mà vẫn giữ đủ mọi quan hệ trong bản Hy Lạp. “Môn đồ” được giữ vì là thuật ngữ Kinh Thánh quen thuộc; câu kết dùng “làm môn đồ tôi” gọn và có sức nặng.
