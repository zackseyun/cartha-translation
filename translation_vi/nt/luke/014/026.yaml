revisions:
- from: Nếu ai đến với tôi mà không ghét cha mẹ, vợ con, anh em trai, chị em gái của chính mình, và ngay cả mạng sống mình nữa, thì người ấy không thể làm môn đồ tôi.[a][b]
  to: Nếu ai đến với tôi mà không ghét cha, mẹ, vợ, con cái, anh em trai và chị em gái của mình, và ngay cả mạng sống của chính mình, thì người ấy không thể là môn đồ của tôi.[a][b]
  rationale: Bản sửa thay “làm môn đồ tôi” bằng “là môn đồ của tôi” để phản ánh trực tiếp οὐ δύναται εἶναί μου μαθητής và dùng tiếng Việt tự nhiên. Danh sách gia đình được tách rõ theo bản Hy Lạp. Các chú thích vẫn giữ nghĩa đen “ghét” trong chính văn, đồng thời nêu cách hiểu so sánh mà không làm nhẹ lời văn nguồn.
  reviewer_model: gpt-5.6-terra
