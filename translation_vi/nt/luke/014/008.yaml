  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: vi
  text: Khi bạn được ai mời dự tiệc cưới[a], đừng nằm nghiêng[c] dùng bữa ở chỗ danh dự[b], kẻo người ấy đã mời một người được trọng vọng hơn bạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dự một đám cưới.” Dạng số nhiều trong tiếng Hy Lạp có thể chỉ các lễ hội cưới, đặc biệt là tiệc cưới.'
    reason: lexical_alternative
  - marker: b
    text: Tức là vị trí được tôn trọng nhất tại bàn tiệc.
    reason: cultural_note
  - marker: c
    text: Trong các bữa ăn trang trọng thời cổ, người ta thường nằm nghiêng thay vì ngồi thẳng.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Khi được ai mời
  rationale: Diễn đạt tự nhiên một tình huống có tính khái quát; trong bối cảnh yến tiệc, καλέω có nghĩa là mời, còn τινος giữ tác nhân ở dạng bất định.
- source_word: εἰς γάμους
  choice: dự tiệc cưới
  rationale: Dạng số nhiều γάμους có thể chỉ các lễ hội cưới, đặc biệt là tiệc cưới; ngữ cảnh về vị trí tại bàn ăn ủng hộ cách dịch này.
- source_word: μὴ κατακλιθῇς
  choice: đừng nằm dùng bữa
  rationale: κατακλίνω chỉ tư thế nằm nghiêng tại bàn ăn theo phong tục cổ; thêm 'dùng bữa' giúp độc giả hiện đại hiểu hành động mà không biến nó thành 'ngồi'.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: ở chỗ danh dự
  rationale: πρωτοκλισία là vị trí được coi trọng nhất trong bữa tiệc; 'chỗ danh dự' tự nhiên và truyền đạt đúng ý nghĩa xã hội.
- source_word: μήποτε
  choice: vì có thể
  rationale: Nêu khả năng đáng ngại làm lý do cho mệnh lệnh; cách nói này tự nhiên trong tiếng Việt và giữ sắc thái cảnh báo.
- source_word: ἐντιμότερός σου
  choice: một người đáng kính hơn anh
  rationale: Dạng so sánh diễn tả người được dành mức độ kính trọng hoặc địa vị cao hơn; 'đáng kính hơn' giữ trọng tâm về danh dự.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: người ấy đã mời
  rationale: Thể hoàn thành ngoại vi nói đến lời mời đã được đưa ra và còn liên quan đến hiện tại; 'người ấy' quy chiếu rõ về người chủ tiệc đã mời khách.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nét văn hóa nằm nghiêng dùng bữa thay vì thay bằng 'ngồi', đồng thời giải thích ngay trong câu. Dùng 'anh' để thể hiện đại từ ngôi hai số ít σου; chú thích tránh gây hiểu lầm rằng lời dạy chỉ hướng đến nam giới.
