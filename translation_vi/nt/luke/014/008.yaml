revisions:
- from: Khi được ai mời dự tiệc cưới[a], đừng nằm dùng bữa ở chỗ danh dự[b], vì có thể người ấy đã mời một người đáng kính hơn anh[c].
  to: Khi bạn được ai mời dự tiệc cưới[a], đừng nằm nghiêng[c] dùng bữa ở chỗ danh dự[b], kẻo người ấy đã mời một người được trọng vọng hơn bạn.
  rationale: Bản sửa giữ nguyên ý nghĩa của câu, nhưng dùng «bạn» để tránh chú thích không cần thiết về giới tính; phục hồi và neo đúng chú thích văn hóa cho hành động nằm nghiêng khi ăn; đồng thời dùng «được trọng vọng hơn» để diễn đạt chính xác hơn sắc thái danh dự/địa vị của tiếng Hy Lạp. «Kẻo» bảo tồn lực cảnh báo của μήποτε mà không khẳng định quá mức về tình huống giả định.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng bối cảnh tiệc cưới, mệnh lệnh không chiếm chỗ cao và nguy cơ có người được tôn trọng hơn đã được chủ tiệc mời. Tuy nhiên, «đáng kính hơn anh» dễ nghiêng sang phẩm chất cá nhân hơn là địa vị/danh dự (ἐντιμότερος), và cách gắn chú thích hiện tại bỏ mất chú thích văn hóa cần thiết cho κατακλιθῇς.
  naturalness: «Nằm dùng bữa» hiểu được nhưng hơi gượng nếu không nêu rõ tư thế cổ. «Nằm nghiêng dùng bữa» vừa tự nhiên, vừa minh thị thực hành dùng bữa thời cổ. Đại từ «bạn» là cách xưng hô hiện đại, trung tính giới tính và phù hợp với lời dạy khái quát.
  terminology: Dùng «được trọng vọng hơn bạn» để phản ánh phạm vi danh dự/địa vị của ἐντιμότερος. «Kẻo» diễn đạt ngắn gọn và tự nhiên chức năng cảnh báo của μήποτε. «Người ấy» ở mệnh đề cuối quy chiếu về người đã mời, mà không thêm diễn giải «chủ tiệc» vào bản văn.
  issues:
  - severity: medium
    issue: Chú thích c đang giải thích đại từ «anh» thay vì tư thế nằm nghiêng khi ăn.
    rationale: Ghi chú văn hóa của bản tiếng Anh và nghĩa cụ thể của κατακλίνω đều liên quan đến việc nằm/ngả khi dùng bữa. Bản nháp không có chú thích này, trong khi chú thích về «anh» không cần thiết nếu dùng một đại từ trung tính.
  - severity: medium
    issue: «Một người đáng kính hơn anh» có thể chuyển nghĩa từ mức độ được tôn trọng sang đức tính đáng kính.
    rationale: ἐντιμότερος là so sánh về sự được tôn trọng, danh dự hoặc địa vị trong bối cảnh chỗ ngồi tại tiệc.
  revised_text: Khi bạn được ai mời dự tiệc cưới[a], đừng nằm nghiêng[c] dùng bữa ở chỗ danh dự[b], kẻo người ấy đã mời một người được trọng vọng hơn bạn.
