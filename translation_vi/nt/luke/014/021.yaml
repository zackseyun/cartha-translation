id: LUK.14.21
reference: Luke 14:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: vi
  text: 'Người đầy tớ trở về, thuật lại những việc ấy cho chủ mình[a]. Bấy giờ, chủ nhà nổi giận, bảo đầy tớ mình: “Hãy mau đi ra các đường lớn và ngõ hẻm trong thành, đưa vào đây những người nghèo khó, người khuyết tật[b], người mù và người què.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chủ” dịch từ κύριος; tại đây từ này chỉ người chủ của đầy tớ, không trực tiếp chỉ Đức Chúa Trời.
    reason: lexical_clarification
  - marker: b
    text: Cũng có thể dịch là “người tàn tật” hoặc, theo nghĩa hẹp hơn, “người bị cụt chi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: trở về
  rationale: Trong mạch truyện, người đầy tớ quay lại sau khi đi truyền lời mời; “trở về” diễn đạt tự nhiên ý trở lại vốn được ngữ cảnh hàm ý.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Từ này có thể chỉ nô lệ hoặc người phục dịch. Trong dụ ngôn này, vai trò phục vụ trong gia đình được nhấn mạnh; “đầy tớ” tự nhiên và không che khuất quan hệ lệ thuộc.
- source_word: ἀπήγγειλεν
  choice: thuật lại
  rationale: Diễn tả việc người đầy tớ báo lại cho chủ những điều vừa xảy ra.
- source_word: κύριος
  choice: chủ
  rationale: Ở đây từ này chỉ người chủ của đầy tớ trong câu chuyện, không phải một tước hiệu chỉ Đức Chúa Trời.
- source_word: ὀργισθεὶς
  choice: nổi giận
  rationale: Diễn đạt phản ứng phát sinh của chủ nhà trước khi ông ra lệnh, phù hợp sắc thái của phân từ.
- source_word: οἰκοδεσπότης
  choice: chủ nhà
  rationale: Chỉ người đứng đầu hay người làm chủ gia đình; “chủ nhà” ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ταχέως
  choice: mau
  rationale: Giữ được tính khẩn cấp của mệnh lệnh bằng cách diễn đạt tự nhiên, trang trọng vừa phải.
- source_word: πλατείας καὶ ῥύμας
  choice: các đường lớn và ngõ hẻm
  rationale: Giữ sự tương phản giữa những đường phố rộng, công khai và những lối phố nhỏ, hẹp.
- source_word: πτωχούς
  choice: những người nghèo khó
  rationale: Cách gọi tự nhiên, tôn trọng, diễn đạt tính từ được dùng như danh từ số nhiều.
- source_word: ἀναπείρους
  choice: khuyết tật
  rationale: Từ Hy Lạp chỉ người có thân thể bị suy tổn hoặc mất khả năng vận động; “khuyết tật” là cách nói hiện đại và tôn trọng, đồng thời giữ nghĩa tương đối rộng.
- source_word: τυφλούς καὶ χωλούς
  choice: mù lòa và què quặt
  rationale: Giữ nguyên hai nhóm được liệt kê riêng trong nguyên văn, dù về nghĩa có phần giao thoa với nhóm người khuyết tật.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh gia đình của dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: Nguyên ngữ có thể nhấn mạnh địa vị lệ thuộc, nhưng ở đây chức năng nhận lệnh và báo cáo trong gia đình nổi bật hơn. “Đầy tớ” phù hợp văn cảnh mà không biến từ này thành một chức danh tôn giáo.
- issue: Cách dịch κύριος khi đối tượng là con người
  choice: chủ
  alternative: chúa
  rationale: Đối tượng ở đây là người chủ của đầy tớ trong dụ ngôn. Dịch “chủ” tránh tạo ấn tượng rằng danh từ này trực tiếp gọi Đức Chúa Trời, đồng thời bảo toàn quan hệ chủ–tớ.
- issue: Sự giao thoa giữa ἀναπείρους, τυφλούς và χωλούς
  choice: giữ nguyên bốn nhóm được liệt kê
  alternative: gộp các dạng khuyết tật thành một nhóm
  rationale: Nguyên văn cố ý kể riêng người nghèo, người khuyết tật, người mù và người què. Bản dịch giữ cấu trúc ấy thay vì hợp lý hóa sự giao thoa về phạm vi nghĩa.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “khuyết tật” theo cách nói tôn trọng hiện nay; giữ nhịp liệt kê và tính khẩn cấp của lời truyền. Dấu ngoặc kép thể hiện lời nói trực tiếp.
