- from: 'Người đầy tớ trở về, thuật lại những việc ấy cho chủ mình[a]. Bấy giờ, chủ nhà nổi giận, bảo đầy tớ mình: “Hãy mau đi ra các đường lớn và ngõ hẻm trong thành, đưa vào đây những người nghèo khó, khuyết tật[b], mù lòa và què quặt.”'
  to: 'Người đầy tớ trở về, thuật lại những việc ấy cho chủ mình[a]. Bấy giờ, chủ nhà nổi giận, bảo đầy tớ mình: “Hãy mau đi ra các đường lớn và ngõ hẻm trong thành, đưa vào đây những người nghèo khó, người khuyết tật[b], người mù và người què.”'
