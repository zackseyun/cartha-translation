    issue: “Què quặt” là cách nói dễ mang sắc thái cũ hoặc miệt thị trong tiếng Việt hiện đại.
    rationale: χωλούς chỉ người què/lame; “người què” vừa sát nghĩa vừa trung tính hơn khi đặt trong danh sách có “người khuyết tật” và “người mù.”
  - severity: low
    issue: Chú thích b quá cụ thể khi nói “bị cụt tay chân.”
    rationale: ἀναπείρους có thể chỉ người tàn tật hoặc bị cụt chi, nhưng không giới hạn vào cả tay lẫn chân.
