    rationale: κατέχειν nghĩa là chiếm/giữ một chỗ; trong ngữ cảnh, chỗ ấy là chỗ cuối cùng hoặc thấp nhất, nhưng động từ không nêu hành động ‘đi xuống’. Bỏ “xuống” giúp tránh diễn giải thêm.
