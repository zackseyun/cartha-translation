  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: vi
  text: 'thì người đã mời cả anh lẫn người ấy sẽ đến nói với anh: “Hãy nhường chỗ cho người này.” Bấy giờ, anh sẽ hổ thẹn mà bắt đầu ngồi vào chỗ cuối cùng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỗ thấp nhất.” Cụm từ Hy Lạp τὸν ἔσχατον τόπον có thể chỉ vị trí cuối cùng theo thứ tự; trong bối cảnh bàn tiệc, đó là chỗ có địa vị thấp nhất.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: người đã mời cả anh lẫn người ấy
  rationale: Cấu trúc phân từ có mạo từ chỉ người mời, đồng thời giữ rõ sự tương phản giữa hai khách được mời.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: sẽ đến nói với anh
  rationale: Phân từ bất định đi với động từ tương lai diễn tả hành động xảy ra trước hoặc liền với lời nói; cách diễn đạt này tự nhiên trong tiếng Việt và giữ trình tự hành động.
- source_word: Δὸς τούτῳ τόπον
  choice: Hãy nhường chỗ cho người này
  rationale: Trong bối cảnh chỗ ngồi tại tiệc, câu này yêu cầu người nghe trao lại vị trí của mình; “nhường chỗ” truyền đạt đúng ý hơn cách dịch máy móc “cho một chỗ”.
- source_word: μετὰ αἰσχύνης
  choice: hổ thẹn
  rationale: Diễn tả sự xấu hổ, mất thể diện công khai; “hổ thẹn” giữ được sắc thái mạnh và trang trọng của αἰσχύνη.
- source_word: ἄρξῃ ... κατέχειν
  choice: bắt đầu xuống ngồi
  rationale: Giữ nghĩa của ἄρξῃ là “bắt đầu”; trong bối cảnh phân hạng chỗ ngồi, thêm “xuống ngồi” diễn đạt tự nhiên việc phải chuyển đến vị trí thấp hơn mà không biến hàm ý thành sự cưỡng ép minh nhiên.
- source_word: τὸν ἔσχατον τόπον
  choice: chỗ cuối cùng
  rationale: Giữ nghĩa trực tiếp “chỗ cuối cùng,” đồng thời để chú thích nêu nghĩa ngữ cảnh là chỗ thấp nhất về danh dự.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” phù hợp lời Chúa Giê-su nói trực tiếp với một người trong ví dụ; tránh từ ngữ mang sắc thái giáo phái.
