  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: vi
  text: 'Một người khác nói: “Tôi đã mua năm đôi bò và đang đi thử chúng. Xin ông cho tôi cáo từ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “xin ông coi tôi là đã được miễn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: một người khác
  rationale: Trong chuỗi những người được mời lần lượt đưa ra lý do, cụm này tự nhiên chỉ một người khác tiếp theo.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: năm đôi bò
  rationale: ζεῦγος chỉ một đôi súc vật dùng chung ách; “năm đôi bò” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại, đồng thời giữ hình ảnh canh tác.
- source_word: ἠγόρασα
  choice: đã mua
  rationale: Thì aorist trình bày việc mua đã xảy ra; “đã mua” diễn đạt tự nhiên sự việc vừa được nêu làm lý do.
- source_word: πορεύομαι δοκιμάσαι αὐτά
  choice: đang đi thử chúng
  rationale: πορεύομαι diễn tả việc đi hoặc ý định hiện thời, còn δοκιμάσαι là thử để đánh giá; cách dịch này giữ cả chuyển động lẫn mục đích.
- source_word: ἐρωτῶ σε
  choice: xin ông
  rationale: Trong lời thỉnh cầu trực tiếp, “xin ông” truyền đạt sắc thái lịch sự của động từ ἐρωτάω và đại từ ngôi hai, phù hợp ngữ cảnh người được mời nói với chủ tiệc.
- source_word: ἔχε με παρῃτημένον
  choice: cho tôi cáo từ
  rationale: Thành ngữ này yêu cầu người nghe coi người nói là đã được miễn khỏi lời mời. “Cho tôi cáo từ” tự nhiên, trang trọng vừa phải và phù hợp ngữ cảnh từ chối dự tiệc.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, sáng rõ và trang trọng vừa phải. “Đôi bò” dễ hiểu hơn cách nói kỹ thuật “ách bò”; “cáo từ” giữ phép lịch sự của lời xin vắng mặt. Đại từ “ông” phù hợp với lời một người đàn ông nói với chủ tiệc trong bối cảnh này.
