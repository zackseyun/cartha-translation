  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: vi
  text: 'Vì tôi nói với các ngươi rằng: Không một người đàn ông nào trong số những người đã được mời kia sẽ được nếm bữa tiệc của tôi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bữa ăn của tôi” hoặc, theo cách dịch truyền thống, là “bữa tối của tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với các anh rằng
  rationale: Giữ sắc thái giải thích của γάρ và lời nói trực tiếp hướng đến nhóm người nghe; “các anh” phản ánh đại từ số nhiều trong bối cảnh mà không làm câu quá trang trọng.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: Không một ai trong số những người đàn ông ... kia
  rationale: “Không một ai” truyền đạt sự phủ định dứt khoát của οὐδείς; “những người đàn ông ... kia” giữ nghĩa giống đực của ἀνδρῶν và sắc thái chỉ định của ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: đã được mời
  rationale: Trong bối cảnh bữa tiệc, καλέω chỉ việc mời dự tiệc; thể hoàn thành bị động cho thấy họ đã nhận được lời mời.
- source_word: γεύσεταί
  choice: sẽ nếm
  rationale: Giữ hình ảnh trực tiếp của γεύομαι, đồng thời trong ngữ cảnh có thể bao hàm ý được ăn hoặc dự phần.
- source_word: μου τοῦ δείπνου
  choice: bữa tiệc của tôi
  rationale: δεῖπνον có thể là bữa ăn chính, thường vào buổi tối, và trong dụ ngôn này mang tính chất một đại tiệc; “bữa tiệc” tự nhiên hơn “bữa tối” khi nói về nhiều khách được mời, nhưng các khả năng từ vựng khác được ghi ở chú thích.
theological_decisions:
- issue: Quan hệ giữa lời của chủ tiệc và ý nghĩa thần học của dụ ngôn
  choice: Giữ nguyên ngôi thứ nhất “bữa tiệc của tôi” trong lời nhân vật, không diễn giải thành một thực tại thần học cụ thể.
  alternative: Diễn giải rõ đây là tiệc trong vương quốc Đức Chúa Trời.
  rationale: Bản văn Hy Lạp duy trì tiếng nói của chủ tiệc trong dụ ngôn. Việc không giải nghĩa biểu tượng ngay trong câu giúp bảo toàn tính căng thẳng và phạm vi ám chỉ của dụ ngôn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Không một ai...” nhấn mạnh lời tuyên bố dứt khoát; từ “nếm” được giữ để bảo tồn hình ảnh nguyên ngữ.
