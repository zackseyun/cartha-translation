review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các yếu tố chính của câu Hy Lạp: γάρ mang sắc thái giải thích, phủ định tuyệt đối οὐδείς, nhóm nam giới được chỉ định (τῶν ἀνδρῶν ἐκείνων), lời mời đã được ban trước đó của phân từ hoàn thành bị động κεκλημένων, và hình ảnh «nếm» (γεύσεται). Tuy nhiên, «các anh» gán giới tính cho ὑμῖν, trong khi đại từ Hy Lạp ở đây không tự nó xác định giới tính của người được nói với. Cụm «nếm bữa tiệc» cũng chưa tự nhiên trong tiếng Việt.'
  naturalness: «Không một ai trong số những người đàn ông...» nặng và lặp ý, còn «nếm bữa tiệc» không phải kết hợp từ thông dụng. «Không một người đàn ông nào trong số những người đã được mời kia» rõ ràng, tự nhiên hơn và vẫn giữ giới tính của ἀνήρ. «Sẽ được nếm bữa tiệc» là cách diễn đạt tiếng Việt tự nhiên cho sự bị loại trừ mà không đổi ý nghĩa.
  terminology: «Bữa tiệc» là lựa chọn phù hợp cho δεῖπνον trong khung cảnh dụ ngôn có nhiều khách; chú thích nêu «bữa ăn» và «bữa tối» như các khả năng từ vựng khác. Dùng «các ngươi» tránh thêm giới tính vào đại từ số nhiều và vẫn hợp với giọng nói nghiêm trang, cảnh báo của lời chủ tiệc.
  issues:
  - severity: medium
    issue: «các anh» thêm giới tính cho người nghe
    rationale: ὑμῖν là đại từ số nhiều không đánh dấu giới tính. «Các anh» có thể khiến người đọc hiểu nhóm người nghe chỉ gồm nam giới, một chi tiết không được câu này xác nhận.
  - severity: medium
    issue: Cụm «nếm bữa tiệc» chưa tự nhiên
    rationale: Trong tiếng Việt, «nếm» thường đi với món ăn, thức ăn, hoặc được dùng trong kết cấu «được nếm [một bữa tiệc/bữa ăn]». Thêm «được» tạo câu trôi chảy và diễn tả đúng hệ quả bị loại trừ trong lời tuyên bố.
  - severity: low
    issue: Cấu trúc phủ định bị dài và dư ý
    rationale: «Không một ai trong số những người đàn ông» có thể rút thành «Không một người đàn ông nào trong số những người...» mà vẫn truyền đạt đầy đủ οὐδείς và τῶν ἀνδρῶν.
  revised_text: 'Vì tôi nói với các ngươi rằng: Không một người đàn ông nào trong số những người đã được mời kia sẽ được nếm bữa tiệc của tôi.[a]'
