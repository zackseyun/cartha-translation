  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: vi
  text: Nhưng họ im lặng[a]. Đức Giê-su nắm lấy người ấy, chữa lành cho ông rồi cho ông ra về[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ đã im lặng” hoặc “họ không nói gì.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thả ông ra” hoặc “cho ông đi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng họ
  rationale: Đại từ hàm ẩn trong οἱ chỉ những người vừa được Đức Giê-su hỏi; δέ tạo sắc thái tương phản nhẹ với câu hỏi trước đó.
- source_word: ἡσύχασαν
  choice: vẫn im lặng
  rationale: Trong ngữ cảnh này, động từ diễn tả việc họ không đáp lại. “Vẫn im lặng” tự nhiên và làm rõ sự im lặng trước câu hỏi mà không thêm lý do.
- source_word: ἐπιλαβόμενος
  choice: nắm lấy người ấy
  rationale: Giữ được nét nghĩa tiếp xúc thể chất của ἐπιλαμβάνομαι, nhưng không xác định quá mức cách thức hay mức độ mạnh nhẹ.
- source_word: ἰάσατο αὐτόν
  choice: chữa lành cho ông
  rationale: ἰάομαι chỉ hành động chữa lành; “ông” là cách quy chiếu tự nhiên và tôn trọng đối với người đàn ông được nhắc đến.
- source_word: ἀπέλυσεν
  choice: cho ông ra về
  rationale: ἀπολύω có thể mang nghĩa thả, cho đi hoặc cho ra về. Trong mạch kể sau khi chữa lành, “cho ông ra về” tự nhiên và tránh hàm ý người ấy từng bị giam giữ.
theological_decisions: []
