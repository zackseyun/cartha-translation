  source_fidelity: 'Bản dịch truyền đạt đúng các hành động chính: họ không đáp lời; Đức Giê-su nắm lấy người đàn ông, chữa lành ông, rồi cho ông ra về. Tuy nhiên, “vẫn im lặng” có thể gợi ý sự tiếp diễn được đánh dấu rõ hơn nguyên văn aorist ἡσύχασαν; “họ im lặng” giữ sát hơn sắc thái họ không đáp lại.'
