id: LUK.14.11
reference: Luke 14:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: vi
  text: Vì ai tự tôn mình lên sẽ bị hạ xuống, còn ai tự hạ mình xuống sẽ được tôn lên.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong ngữ cảnh, từ này nêu lý do cho lời dạy ngay trước đó; “Vì” giữ nguyên chức năng giải thích.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: ai tự tôn mình lên
  rationale: Cụm phân từ có mạo từ mang nghĩa khái quát. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được tính phổ quát của câu châm ngôn.
- source_word: ὑψῶν
  choice: tôn ... lên
  rationale: Ở đây động từ mang nghĩa ẩn dụ về việc tự đề cao, không phải nâng lên theo nghĩa vật lý; lựa chọn này tạo thế đối xứng với “hạ ... xuống” và “được tôn lên”.
- source_word: ἑαυτὸν
  choice: mình
  rationale: Đại từ phản thân tiếng Việt “mình” phù hợp với chủ ngữ khái quát “ai”, không cần biểu thị giống ngữ pháp như tiếng Hy Lạp.
- source_word: ταπεινωθήσεται
  choice: sẽ bị hạ xuống
  rationale: Giữ thể bị động và ý nghĩa bị đưa xuống vị trí thấp, đồng thời tạo sự tương phản rõ với “được tôn lên”.
- source_word: καὶ
  choice: còn
  rationale: Tiếng Hy Lạp dùng liên từ nối hai vế, nhưng hai vế mang tính đối lập. “Còn” diễn đạt tự nhiên sự đối chiếu ấy trong tiếng Việt mà không biến nó thành một quan hệ nghịch lý mạnh hơn nguyên văn.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: ai tự hạ mình xuống
  rationale: Giữ nghĩa khái quát của phân từ có mạo từ và diễn đạt hành động tự nguyện hạ mình một cách tự nhiên, cân xứng với vế đầu.
- source_word: ὑψωθήσεται
  choice: sẽ được tôn lên
  rationale: Giữ thể bị động và sự đối xứng từ vựng với hành động “tự tôn mình lên”, nhưng không nói rõ tác nhân.
theological_decisions:
- issue: Tác nhân ngầm trong hai động từ tương lai bị động
  choice: Giữ thể bị động, không thêm “bởi Đức Chúa Trời”
  alternative: sẽ bị Đức Chúa Trời hạ xuống / sẽ được Đức Chúa Trời tôn lên
  rationale: Nguyên văn không nêu tác nhân. Dù ngữ cảnh Kinh Thánh có thể hàm ý hành động của Đức Chúa Trời, bản dịch không nên biến hàm ý đó thành lời khẳng định minh nhiên.
- issue: Dạng giống đực số ít dùng theo nghĩa khái quát
  choice: Dịch bằng cấu trúc khái quát tự nhiên “ai ... mình”
  alternative: người nào tự tôn chính mình lên
  rationale: Tiếng Việt không có đối lập giống ngữ pháp tương ứng trong đại từ phản thân. “Ai ... mình” truyền đạt đầy đủ số ít khái quát mà không thêm giới tính vốn không thể hiện tự nhiên trong ngôn ngữ đích.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Hai vế được giữ cân xứng: “tự tôn mình lên / bị hạ xuống” và “tự hạ mình xuống / được tôn lên”. Không cần chú thích vì các khác biệt ngữ pháp về giống trong tiếng Hy Lạp không tạo ra một phương án tiếng Việt tự nhiên cần ghi nhận.'
