  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: vi
  text: 'Đến giờ dùng bữa, ông sai đầy tớ mình đi nói với những người đã được mời: “Xin hãy đến, vì mọi thứ đã sẵn sàng rồi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai ... đi
  rationale: Diễn đạt tự nhiên hành động chủ nhà phái đầy tớ đi làm nhiệm vụ, không thêm sắc thái mạnh hơn nguyên văn.
- source_word: δοῦλον
  choice: đầy tớ
  rationale: Trong bối cảnh gia đình của dụ ngôn, từ này chỉ người phục vụ kiêm truyền tin; “đầy tớ” vừa trang trọng vừa tự nhiên, dù nguyên ngữ cũng có thể mang nghĩa “nô lệ”.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: đến giờ dùng bữa
  rationale: Giữ ý thời điểm đã định của bữa ăn, đồng thời tự nhiên hơn cách dịch sát chữ “vào giờ của bữa tối” trong tiếng Việt hiện đại.
- source_word: εἰπεῖν τοῖς κεκλημένοις
  choice: đi nói với những người đã được mời
  rationale: Động từ nguyên mẫu nêu mục đích của việc sai đi; phân từ hoàn thành bị động cho thấy họ đã được mời từ trước.
- source_word: Ἔρχεσθε
  choice: Xin hãy đến
  rationale: Chuyển lời triệu mời bằng cách nói lịch sự, tự nhiên trong tiếng Việt mà vẫn giữ lực mệnh lệnh của nguyên ngữ.
- source_word: ὅτι ἤδη ἕτοιμά ἐστιν
  choice: vì mọi thứ đã sẵn sàng rồi
  rationale: Cụm tính từ trung tính số nhiều với động từ số ít có nghĩa tập hợp; tiếng Việt tự nhiên cần nêu chủ thể hàm ẩn là toàn bộ sự chuẩn bị.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt chuẩn hiện đại, sáng rõ và trang trọng vừa phải. “Dùng bữa” tránh giới hạn δείπνον thành một khung giờ văn hóa quá cụ thể; “mọi thứ” thể hiện tự nhiên chủ thể tập hợp vốn để hàm ẩn trong tiếng Hy Lạp.
