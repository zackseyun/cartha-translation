  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: vi
  text: 'Còn một người khác nói: “Tôi đã cưới vợ, vì thế tôi không thể đến.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: một người khác
  rationale: Trong chuỗi lời thoái thác, ἕτερος giới thiệu thêm một người đáp lời; “một người khác” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: Γυναῖκα
  choice: vợ
  rationale: γυνή có thể là “người phụ nữ” hoặc “vợ”, nhưng khi làm bổ ngữ của γαμέω thì nghĩa hôn nhân được xác định là “vợ”.
- source_word: ἔγημα
  choice: mới cưới
  rationale: Động từ aorist diễn tả việc cưới đã xảy ra; “mới cưới” chuyển đạt tự nhiên tính hoàn tất và sự liên quan hiện tại vốn nằm trong lời viện cớ, dù yếu tố “mới” được suy ra từ ngữ cảnh chứ không được nêu riêng bằng một từ Hy Lạp.
- source_word: διὰ τοῦτο
  choice: nên
  rationale: Cụm từ nêu lý do dẫn đến lời từ chối; “nên” diễn đạt gọn và tự nhiên quan hệ nhân quả trong tiếng Việt.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: không thể đến được
  rationale: δύναμαι với động từ nguyên mẫu diễn tả khả năng; cách nói này tự nhiên, đồng thời giữ nguyên lời khẳng định về sự bất khả của người nói.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mới cưới vợ” thay cho lối dịch sát nhưng kém tự nhiên “đã cưới một người vợ”; không thêm chú thích vì khác biệt này có thể được trình bày đầy đủ trong quyết định từ vựng và không tạo ra vấn đề giải nghĩa đáng kể.
