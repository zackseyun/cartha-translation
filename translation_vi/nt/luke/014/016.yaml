  terminology: “Đức Chúa Jêsus,” “bữa tiệc lớn,” và “mời nhiều người” phù hợp ngữ cảnh. Chú thích giải thích δεῖπνον hữu ích; cách diễn đạt được chỉnh nhẹ để tự nhiên hơn.
  issues:
