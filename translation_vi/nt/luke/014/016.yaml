  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Jêsus nói với người ấy: “Có một người kia đang chuẩn bị một bữa tiệc lớn[a] và mời nhiều người.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một bữa ăn thịnh soạn” hoặc “một bữa tối lớn”. Từ Hy Lạp δεῖπνον chỉ bữa ăn chính; trong ngữ cảnh này, đó là bữa ăn trang trọng do chủ nhà khoản đãi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Nhưng Đức Chúa Jêsus nói với người ấy
  rationale: δέ đánh dấu sự chuyển lời có sắc thái đáp lại, nên dịch là “Nhưng”. Chủ ngữ ὁ được xác định từ ngữ cảnh là Đức Chúa Jêsus; nêu rõ chủ thể giúp câu tiếng Việt tự nhiên mà không thay đổi ý.
- source_word: Ἄνθρωπός τις
  choice: Có một người kia
  rationale: Cách nói này diễn đạt tự nhiên thành ngữ kể chuyện với τις, đồng thời giữ tính bất định của nhân vật.
- source_word: ἐποίει
  choice: chuẩn bị
  rationale: Thì chưa hoàn thành mô tả hành động đang diễn tiến trong quá khứ. Trong ngữ cảnh đãi tiệc, “chuẩn bị” tự nhiên hơn cách dịch sát chữ “làm” mà không hàm ý bữa tiệc đã bắt đầu.
- source_word: δεῖπνον μέγα
  choice: một bữa tiệc lớn
  rationale: δεῖπνον chỉ bữa ăn chính, thường vào chiều tối; trong ngữ cảnh một chủ nhà chính thức mời đông khách, “bữa tiệc lớn” truyền đạt tự nhiên cả tính chất bữa ăn và μέγα.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: và mời nhiều người
  rationale: Trong ngữ cảnh bữa tiệc, καλέω có nghĩa là mời. Thêm “người” để diễn đạt rõ đối tượng số nhiều trong tiếng Việt.
theological_decisions: []
