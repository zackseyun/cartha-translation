  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt; lời kể giữ nhịp ngắn gọn của dụ ngôn.
