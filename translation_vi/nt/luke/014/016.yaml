    rationale: Động từ “chuẩn bị” không có dấu hiệu thì–thể rõ ràng trong tiếng Việt. Thêm “đang” là một điều chỉnh an toàn, vừa giữ hành động đang diễn tiến vừa không thêm ý thần học hay lịch sử.
