source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: vi
  text: 'Rồi Ngài phán với họ[a]: “Ai trong các ông có con trai hoặc con bò rơi xuống giếng mà lại không lập tức kéo lên vào ngày Sa-bát?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “con lừa” thay cho “con trai”.
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Ai trong các ông
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ sắc thái câu hỏi tu từ hướng trực tiếp đến những người đang nghe.
- source_word: υἱὸς
  choice: con trai
  rationale: Giữ đúng nghĩa cụ thể, giống đực số ít của từ Hy Lạp, thay vì khái quát hóa thành “con” hay “đứa trẻ”.
- source_word: βοῦς
  choice: con bò
  rationale: “Con bò” rõ ràng và thông dụng hơn “bò đực thiến” trong tiếng Việt hiện đại, đồng thời vẫn chỉ đúng loài gia súc trong ví dụ.
- source_word: φρέαρ
  choice: giếng
  rationale: Phản ánh nghĩa tự nhiên nhất của φρέαρ và không đồng hóa câu này với các đoạn song song dùng hình ảnh “hố”.
- source_word: πεσεῖται
  choice: rơi xuống
  rationale: Thì tương lai trong kết cấu giả định-tu từ được diễn đạt tự nhiên bằng “nếu… rơi xuống” trong tiếng Việt.
- source_word: εὐθέως
  choice: lập tức
  rationale: Giữ nguyên sắc thái khẩn cấp về thời gian của nguyên văn.
- source_word: ἀνασπάσει
  choice: kéo ... lên
  rationale: Diễn tả chính xác hành động kéo một người hoặc con vật từ dưới giếng lên.
- source_word: αὐτὸν
  choice: nó
  rationale: Đại từ Hy Lạp số ít có thể quy chiếu đến cả “con trai” lẫn “con bò”; “nó” trong tiếng Việt giữ được sự quy chiếu chung, dù khi chỉ người có thể mang sắc thái kém trang trọng. Tránh thêm hai đại từ hoặc giải nghĩa quá mức.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: trong ngày Sa-bát
  rationale: Phản ánh cả ἡμέρᾳ (“ngày”) và σαββάτου, đồng thời phù hợp với cách nói trang trọng trong tiếng Việt Kinh Thánh.
theological_decisions:
- issue: Dị bản về đối tượng thứ nhất trong ví dụ
  choice: con trai hay con bò
  alternative: con lừa hay con bò
  rationale: Bản SBLGNT được cung cấp đọc υἱὸς (“con trai”), nên bản dịch giữ cách đọc này. Dị bản “con lừa” được ghi ở chú thích thay vì đưa vào chính văn hay hòa hợp với truyền thống bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su và “các ông” cho nhóm người được Ngài trực tiếp chất vấn. Giữ cấu trúc câu hỏi tu từ và sức ép đạo lý của câu mà không giải thích thêm.
