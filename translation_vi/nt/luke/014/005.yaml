  rationale: Sửa cấu trúc điều kiện để diễn đạt rõ và tự nhiên quan hệ sở hữu trong câu hỏi tu từ; lược đại từ tân ngữ theo cách dùng tiếng Việt để tránh sắc thái bất kính đối với “con trai”; thay “trong” bằng “vào” để chỉ thời điểm ngày Sa-bát. Không thay đổi cách đọc SBLGNT hoặc ý nghĩa câu.
  reviewer_model: gpt-5.6-terra
