revisions:
- from: 'Nhưng khi anh được mời, hãy đi ngồi vào chỗ thấp nhất[a], để khi người đã mời anh đến, người ấy sẽ nói với anh: ‘Bạn ơi, xin lên chỗ cao hơn[b].’ Bấy giờ, anh sẽ được vinh dự trước mặt tất cả những người cùng dự tiệc với anh.'
  to: 'Nhưng khi bạn được mời, hãy đi ngồi vào chỗ thấp nhất[a], để khi người đã mời bạn đến, người ấy sẽ nói với bạn: ‘Bạn ơi, hãy lên chỗ cao hơn[b].’ Bấy giờ, bạn sẽ được vinh dự trước mặt tất cả những người cùng dự tiệc với bạn.'
  rationale: Chỉnh chú thích a để phản ánh chính xác phong tục ngả mình khi dùng bữa trong thế giới cổ đại, đồng thời sửa nhẹ cách diễn đạt về người mời và lời mời chuyển chỗ cho tự nhiên hơn. Ý nghĩa, tính mở của lời dạy, và các điểm ngữ nghĩa chính của nguyên văn đều được giữ nguyên.
