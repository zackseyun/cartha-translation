id: LUK.14.10
reference: Luke 14:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: vi
  text: 'Nhưng khi bạn được mời, hãy đi ngồi vào chỗ thấp nhất[a], để khi người đã mời bạn đến, người ấy sẽ nói với bạn: ‘Bạn ơi, hãy lên chỗ cao hơn[b].’ Bấy giờ, bạn sẽ được vinh dự trước mặt tất cả những người cùng dự tiệc với bạn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp chỉ tư thế ngả mình tại bàn ăn theo phong tục thời ấy; bản dịch cũng có thể diễn đạt là “hãy vào chỗ thấp nhất để ngả mình dùng bữa.”
    reason: Bảo lưu hình ảnh văn hóa và nghĩa cụ thể của động từ ἀνάπεσε mà không gợi tư thế “nằm” theo nghĩa thông thường.
  - marker: b
    text: 'Sát nghĩa: “Hãy lên cao hơn.”'
    reason: Cho thấy nguyên văn diễn tả việc chuyển lên vị trí danh dự hơn bằng hình ảnh không gian.
lexical_decisions:
- source_word: κληθῇς
  choice: được mời
  rationale: Trong bối cảnh tiệc cưới, καλέω có nghĩa là mời dự tiệc, không chỉ đơn thuần là gọi.
- source_word: πορευθεὶς ἀνάπεσε
  choice: hãy đi ngồi vào
  rationale: Phân từ πορευθείς đi kèm mệnh lệnh chính nên được diễn đạt tự nhiên như một chuỗi hành động. ἀνάπεσε chỉ tư thế ngả mình tại bàn ăn thời cổ; bản văn chính dùng “ngồi vào” để người đọc hiện đại dễ hiểu, còn chú thích bảo lưu nét văn hóa ấy.
- source_word: τὸν ἔσχατον τόπον
  choice: chỗ thấp nhất
  rationale: Cụm từ chỉ vị trí thấp nhất về thứ bậc trong chỗ ngồi dự tiệc; cách dịch này giữ rõ ý nghĩa xã hội của hình ảnh.
- source_word: ὁ κεκληκώς σε
  choice: người đã mời anh
  rationale: Giữ sát phân từ hoàn thành, xác định người chủ động mời, thay vì diễn giải trực tiếp thành “chủ tiệc”.
- source_word: Φίλε
  choice: Bạn ơi
  rationale: Lối xưng hô trực tiếp, thân thiện và lịch sự trong tiếng Việt, không thêm sắc thái sở hữu không có trong nguyên văn.
- source_word: προσανάβηθι ἀνώτερον
  choice: xin lên chỗ cao hơn
  rationale: Diễn đạt việc chuyển lên một vị trí danh dự hơn, đồng thời giữ hình ảnh không gian “lên cao hơn” của tiếng Hy Lạp.
- source_word: δόξα
  choice: vinh dự
  rationale: Trong bối cảnh xã hội này, δόξα nói đến danh dự được công khai nhìn nhận, chứ không nhất thiết là vinh quang theo nghĩa thần học.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: trước mặt tất cả những người cùng dự tiệc với anh
  rationale: Giữ yếu tố công khai của ἐνώπιον πάντων và diễn đạt tự nhiên hình ảnh những người cùng nằm/ngồi ăn tại bàn.
theological_decisions:
- issue: Tính chất của lời dạy
  choice: Dịch như lời chỉ dẫn thực tế trong một lời dạy bằng hình ảnh về sự khiêm nhường và danh dự, không ấn định phần thưởng chỉ mang nghĩa xã hội hay chỉ mang nghĩa cánh chung.
  alternative: Hiểu thuần túy như phép lịch sự tại bàn tiệc, hoặc diễn giải hoàn toàn thành phần thưởng cánh chung.
  rationale: Bản văn dùng khung cảnh bàn tiệc và sự đảo ngược địa vị, nhưng câu này tự nó không giải quyết dứt khoát phạm vi ứng dụng; bản dịch cần giữ độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” được dùng theo mạch lời nói trực tiếp với một người dự tiệc; “Bạn ơi” truyền đạt lời xưng hô Φίλε tự nhiên mà không thêm ý “bạn của tôi”.
