id: LUK.14.32
reference: Luke 14:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: vi
  text: Nhưng nếu không, khi vua kia còn ở xa, vua này sai một phái đoàn[a] đến xin các điều kiện hòa bình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một đoàn sứ giả” hoặc “các sứ giả”.
    reason: lexical_alternative
  - marker: b
    text: Sát nghĩa là “những điều hướng đến hòa bình”, tức những điều kiện để đạt được hòa bình.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Nhưng nếu không
  rationale: Giữ cấu trúc điều kiện–tương phản của tiếng Hy Lạp và nối tự nhiên với câu trước, nơi nhà vua cân nhắc mình có đủ sức giao chiến hay không.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: khi vua kia còn ở xa
  rationale: Diễn đạt mệnh đề tuyệt đối thuộc cách sở hữu như một hoàn cảnh đồng thời. “Vua kia” làm rõ αὐτοῦ chỉ vị vua đối địch, nhưng không thêm thông tin ngoài ngữ cảnh dụ ngôn.
- source_word: πρεσβείαν
  choice: một phái đoàn
  rationale: πρεσβείαν có thể chỉ một đoàn đại diện hay các sứ giả. “Phái đoàn” là cách nói hiện đại, tự nhiên và phù hợp với bối cảnh ngoại giao.
- source_word: ἀποστείλας
  choice: sai ... đến
  rationale: Chuyển phân từ bất định quá khứ thành động từ nối với hành động chính, vừa tự nhiên trong tiếng Việt vừa giữ trình tự sai phái rồi cầu xin.
- source_word: ἐρωτᾷ
  choice: xin
  rationale: Trong ngữ cảnh này, ἐρωτᾷ mang nghĩa yêu cầu hay thỉnh cầu, không chỉ là hỏi thông tin. “Xin” kết hợp tự nhiên với điều kiện hòa bình.
- source_word: τὰ πρὸς εἰρήνην
  choice: các điều kiện hòa bình
  rationale: Đây là thành ngữ chỉ những điều cần thiết để đạt được hòa bình. Cách dịch này rõ nghĩa trong bối cảnh hai vua chuẩn bị giao chiến, đồng thời chú thích giữ lại dạng diễn đạt sát chữ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp “vua kia/vua này” để phân biệt rõ vị vua đang tiến đến với vị vua sai phái đoàn, tránh sự mơ hồ của đại từ tiếng Việt.
