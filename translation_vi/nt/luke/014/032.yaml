  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: mệnh đề điều kiện tương phản (εἰ δὲ μήγε), hoàn cảnh đồng thời khi vị vua đối địch còn ở xa (ἔτι αὐτοῦ πόρρω ὄντος), việc sai một phái đoàn (πρεσβείαν ἀποστείλας), và xin/đề nghị những điều nhằm đạt hòa bình (ἐρωτᾷ τὰ πρὸς εἰρήνην). Cặp “vua kia/vua này” diễn giải đúng quy chiếu trong ngữ cảnh dụ ngôn mà không thêm nội dung.'
