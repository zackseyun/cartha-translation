  terminology: “Phái đoàn” là tương đương tốt cho πρεσβείαν; chú thích nêu hợp lý các khả năng “đoàn sứ giả/các sứ giả”. “Các điều kiện hòa bình” chuyển tải đúng thành ngữ τὰ πρὸς εἰρήνην trong ngữ cảnh này; chú thích sát nghĩa giúp giữ sắc thái rộng hơn của nguyên ngữ.
