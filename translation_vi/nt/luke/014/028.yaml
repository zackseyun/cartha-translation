  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: vi
  text: Vì ai trong các bạn muốn xây một tháp mà không trước hết ngồi xuống tính phí tổn, xem mình có đủ để hoàn thành hay không?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: Vì ai trong các con
  rationale: Giữ liên từ γάρ để nối với lời dạy trước đó và thể hiện câu hỏi tu từ hướng trực tiếp đến người nghe.
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: muốn xây một ngọn tháp
  rationale: Diễn đạt tự nhiên ý định của θέλων, đồng thời giữ nguyên hình ảnh cụ thể πύργος là ngọn tháp.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: mà lại không ngồi xuống trước
  rationale: οὐχί tạo câu hỏi tu từ chờ đợi câu trả lời khẳng định; cách diễn đạt này tự nhiên trong tiếng Việt và giữ hành động ngồi xuống xảy ra trước.
- source_word: ψηφίζει τὴν δαπάνην
  choice: tính phí tổn
  rationale: ψηφίζω ở đây chỉ việc tính toán, ước lượng; δαπάνη là khoản chi phí cần thiết cho công trình.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: xem mình có đủ để hoàn thành hay không
  rationale: Giữ cấu trúc kiểm xét của εἰ và diễn đạt hàm ý có đủ nguồn lực; ἀπαρτισμός chỉ sự hoàn tất công trình.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” phù hợp ngữ cảnh Đức Giê-su trực tiếp dạy đám đông/môn đồ; câu hỏi tu từ và hình ảnh xây tháp được giữ nguyên.
