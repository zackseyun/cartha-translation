translation:
  language: vi
  text: Kìa, có một người mắc chứng phù thũng[a] ở trước mặt Đức Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Phù thũng” chỉ tình trạng sưng phù do tích dịch bất thường trong cơ thể; cũng được gọi theo cách cổ là “chứng thủy thũng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: lược dịch
  rationale: Liên từ nối tiếp mạch kể; trong tiếng Việt, mở câu bằng “Kìa” đã tạo sự chuyển tiếp tự nhiên, nên không cần thêm “và”.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sống động của lời kể bằng một từ trang trọng nhưng vẫn dễ hiểu.
- source_word: ἄνθρωπός τις
  choice: một người
  rationale: Diễn đạt tự nhiên một nhân vật cụ thể nhưng không được nêu tên; “một người nọ” cũng có thể, nhưng kém tự nhiên hơn trong câu này.
- source_word: ἦν
  choice: đang ở
  rationale: Thì vị hoàn thành chưa hoàn tất trong ngữ cảnh mô tả trạng thái hiện diện; “đang ở” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ὑδρωπικὸς
  choice: mắc chứng phù thũng
  rationale: Chỉ người bị tình trạng tích tụ dịch gây sưng phù. “Phù thũng” là thuật ngữ tiếng Việt hiện hành, rõ nghĩa hơn cách gọi cổ.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: ở trước mặt Đức Giê-su
  rationale: Giữ được ý vị trí ở phía trước đồng thời có thể hàm ý hiện diện trước Ngài. Nêu “Đức Giê-su” thay đại từ để tránh mơ hồ tự nhiên trong tiếng Việt.
