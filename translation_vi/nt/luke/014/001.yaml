revisions:
- from: Một ngày Sa-bát, Đức Giê-su vào nhà một người thuộc hàng lãnh đạo của phái Pha-ri-si để dùng bữa[a], và họ chăm chú theo dõi Ngài[b].
  to: Có lần, vào một ngày Sa-bát, khi Đức Giê-su vào nhà của một trong những người lãnh đạo thuộc phái Pha-ri-si để dùng bữa[a], thì họ đang chăm chú theo dõi Ngài[b].
  rationale: Bản sửa khôi phục chức năng dẫn chuyện của ἐγένετο bằng “Có lần” và ý thời gian của ἐν τῷ ἐλθεῖν bằng “khi ... vào”. “đang chăm chú theo dõi” phản ánh cấu trúc ἦσαν + phân từ hiện tại, nhưng không làm mạnh thêm hàm ý thù nghịch. Các chú thích giữ đúng neo và tiếp tục phân biệt nghĩa thành ngữ của “ăn bánh” với sắc thái có thể có của παρατηρούμενοι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:54Z'
