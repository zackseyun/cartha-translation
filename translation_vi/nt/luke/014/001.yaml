  source_fidelity: Bản dịch truyền đạt đúng bối cảnh bữa ăn ngày Sa-bát, địa điểm, nhân vật lãnh đạo Pha-ri-si và sự theo dõi chăm chú. Tuy nhiên, công thức dẫn chuyện ἐγένετο và quan hệ thời gian của ἐν τῷ ἐλθεῖν (“khi ... vào”) đã bị giản lược quá mức; câu hiện tại chỉ thuật lại một hành động đã xảy ra vào ngày Sa-bát.
  naturalness: Câu hiện tại tự nhiên, nhưng việc dùng “Có lần, vào một ngày Sa-bát, khi ...” vừa tự nhiên trong tiếng Việt hiện đại vừa phản ánh đầy đủ hơn cấu trúc kể chuyện của Lu-ca. “thì họ đang chăm chú theo dõi Ngài” cũng biểu đạt rõ nét trạng thái đang diễn ra của ἦσαν παρατηρούμενοι.
