id: LUK.14.1
reference: Luke 14:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: vi
  text: Có lần, vào một ngày Sa-bát, khi Đức Giê-su vào nhà của một trong những người lãnh đạo thuộc phái Pha-ri-si để dùng bữa[a], thì họ đang chăm chú theo dõi Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “ăn bánh,” một thành ngữ chỉ việc dùng bữa.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “họ cẩn thận quan sát Ngài”; từ Hy Lạp có thể hàm ý theo dõi với thái độ nghi ngờ hoặc thù nghịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Một ngày
  rationale: Công thức tường thuật của Lu-ca được chuyển tự nhiên sang tiếng Việt; ý dẫn nhập sự việc được thể hiện qua trạng ngữ thời gian và diễn tiến câu, tránh lối dịch cổ hoặc nặng nề như “xảy ra rằng”.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: Đức Giê-su vào
  rationale: Cấu trúc động từ nguyên mẫu có mạo từ với ἐν mang nghĩa thời gian. Tiếng Việt tự nhiên có thể diễn đạt trực tiếp bằng hành động trong bối cảnh “Một ngày Sa-bát”.
- source_word: οἶκόν
  choice: nhà
  rationale: Tương đương trực tiếp, tự nhiên, phù hợp với bối cảnh một bữa ăn được khoản đãi.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: một người thuộc hàng lãnh đạo của phái Pha-ri-si
  rationale: Giữ được ý người này là một trong các nhân vật lãnh đạo giữa những người Pha-ri-si, đồng thời tránh cách nói khó hiểu “một người cai trị của người Pha-ri-si”.
- source_word: σαββάτῳ
  choice: Một ngày Sa-bát
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt và phù hợp với danh từ Hy Lạp không có mạo từ; không nhất thiết xác định đây là “ngày Sa-bát ấy”.
- source_word: φαγεῖν ἄρτον
  choice: để dùng bữa
  rationale: Thành ngữ nghĩa đen là “ăn bánh” nhưng trong ngữ cảnh chỉ việc dùng một bữa ăn. Bản văn chính truyền đạt nghĩa thành ngữ; nghĩa đen được ghi ở chú thích.
- source_word: παρατηρούμενοι
  choice: chăm chú theo dõi
  rationale: Diễn tả sự quan sát kỹ lưỡng và giữ được sắc thái căng thẳng tiềm ẩn, nhưng không khẳng định rõ động cơ thù nghịch.
- source_word: αὐτοὶ
  choice: họ
  rationale: Đại từ Hy Lạp có phần nhấn mạnh; “họ” là chủ ngữ tự nhiên trong tiếng Việt, còn quan hệ tương phản với Đức Giê-su đã rõ qua cấu trúc câu.
theological_decisions:
- issue: Hàm ý thù nghịch trong việc những người Pha-ri-si quan sát Đức Giê-su
  choice: họ chăm chú theo dõi Ngài
  alternative: họ rình xem Ngài
  rationale: παρατηρούμενοι có thể gợi ý sự giám sát đầy nghi ngờ hoặc thù nghịch, nhưng câu này không nói thẳng động cơ xấu. “Chăm chú theo dõi” giữ được sự căng thẳng mà không áp đặt kết luận mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su,” “phái Pha-ri-si” và đại từ tôn kính “Ngài.” Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt; các chú thích được đặt ngay sau cụm từ tương ứng.
