  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời và nói với các chuyên gia về luật pháp[a] cùng những người Pha-ri-si: “Trong ngày Sa-bát, có được phép chữa lành hay không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các luật gia”. Từ Hy Lạp này chỉ những người chuyên thông hiểu luật pháp Do Thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp lời và nói
  rationale: Giữ lại lối diễn đạt kép của câu chuyện Hy Lạp, đồng thời dùng cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: νομικοὺς
  choice: các chuyên gia Luật pháp
  rationale: Chỉ những người chuyên thông hiểu Luật pháp Do Thái, không phải luật sư dân sự theo nghĩa hiện đại. Viết hoa “Luật pháp” để làm rõ đối tượng chuyên môn của họ.
- source_word: Φαρισαίους
  choice: những người Pha-ri-si
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt cho nhóm tôn giáo này.
- source_word: Ἔξεστιν
  choice: có được phép
  rationale: Diễn đạt rõ ý điều được Luật pháp cho phép trong cuộc tranh luận về ngày sa-bát, nhưng không thêm kết luận vào câu hỏi.
- source_word: τῷ σαββάτῳ
  choice: trong ngày sa-bát
  rationale: Diễn đạt giá trị thời gian của cách ba và nêu rõ ngày đang được nói đến.
- source_word: θεραπεῦσαι
  choice: chữa bệnh
  rationale: Phù hợp với ngữ cảnh chữa lành thân thể trong các sách Phúc Âm và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἢ οὔ
  choice: hay không
  rationale: Giữ nguyên dạng câu hỏi lựa chọn trực tiếp và súc tích.
theological_decisions:
- issue: Câu hỏi về tính hợp luật của việc chữa bệnh trong ngày sa-bát
  choice: “Trong ngày sa-bát, có được phép chữa bệnh hay không?”
  alternative: “Có hợp Luật pháp khi chữa bệnh trong ngày sa-bát hay không?”
  rationale: Bản dịch giữ nguyên sức căng pháp lý-thần học của câu hỏi, không thêm lời giải thích về lòng thương xót, sự cần thiết hay thẩm quyền của Đức Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” và “ngày sa-bát” theo cách gọi quen thuộc; cấu trúc “đáp lời và nói” chủ ý giữ nét lặp của nguyên văn Hy Lạp.
