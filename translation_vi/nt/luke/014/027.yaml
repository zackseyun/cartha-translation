id: LUK.14.27
reference: Luke 14:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: vi
  text: Ai không vác[a] thập tự giá của mình và đi theo sau tôi[b] thì không thể là môn đồ của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mang” hoặc “gánh”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đến/đi phía sau tôi”; so sánh cách nói quen thuộc về việc “theo tôi” để làm môn đồ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Ai
  rationale: Đại từ quan hệ bất định mở đầu một điều kiện có tính khái quát. “Ai” tự nhiên, súc tích và giữ được phạm vi bao quát của câu Hy Lạp.
- source_word: βαστάζει
  choice: vác
  rationale: Động từ có nghĩa là mang hoặc gánh một vật. “Vác” phù hợp với hình ảnh cụ thể về việc mang thập tự giá, đồng thời vẫn giữ được sức nặng ẩn dụ về cái giá của việc làm môn đồ.
- source_word: τὸν σταυρόν
  choice: thập tự giá
  rationale: Đây là cách gọi quen thuộc trong tiếng Việt đối với dụng cụ hành hình được nói đến. Cụm từ giữ cả nghĩa lịch sử lẫn ý nghĩa ẩn dụ trong lời kêu gọi làm môn đồ.
- source_word: ἑαυτοῦ
  choice: của mình
  rationale: Đại từ phản thân số ít nhấn mạnh thập tự giá thuộc về chính người đang được nói đến. “Của mình” giữ được tính phản thân và không buộc tiếng Việt phải nêu giới tính khi nguyên ngữ dùng giống đực theo nghĩa đại diện.
- source_word: ἔρχεται ὀπίσω μου
  choice: theo sau tôi
  rationale: Cụm này theo sát nghĩa đen “đến/đi phía sau tôi” và đồng thời gợi cách nói quen thuộc về việc theo một người làm môn đồ, nhưng không thay hẳn hình ảnh vị trí và chuyển động bằng một lời diễn giải.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: không thể làm môn đồ của tôi
  rationale: Cấu trúc Hy Lạp diễn tả sự không thể, chứ không chỉ là một lệnh cấm. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên sức mạnh của mệnh đề.
- source_word: μαθητής
  choice: môn đồ
  rationale: “Môn đồ” là từ quen thuộc trong văn cảnh các sách Phúc Âm, chỉ người gắn bó đi theo và học nơi một bậc thầy, chứ không chỉ là người học trong lớp.
theological_decisions:
- issue: Giống đực số ít của đại từ phản thân được dùng theo nghĩa đại diện
  choice: Dịch là “của mình” để giữ ngôi số ít và ý phản thân mà không thêm dấu hiệu giới tính không cần thiết trong tiếng Việt.
  alternative: “của người ấy” hoặc “thập tự giá riêng của mình”
  rationale: Tiếng Việt không bắt buộc đánh dấu giống ở đại từ phản thân. “Của mình” truyền đạt tự nhiên lực số ít và sự nhấn mạnh vào chính người ấy, không biến chủ thể thành số nhiều cũng không thu hẹp lời nói chỉ cho nam giới.
- issue: Sức mạnh của οὐ δύναται trong điều kiện làm môn đồ
  choice: Giữ cách nói “không thể làm môn đồ của tôi”.
  alternative: “không được làm môn đồ của tôi” hoặc “không xứng đáng làm môn đồ của tôi”
  rationale: Nguyên ngữ nói đến sự không thể hay không tương hợp, không đơn thuần là cấm đoán hoặc phán xét về mức độ xứng đáng. Bản dịch không làm nhẹ hay giải thích thêm sự căng thẳng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vác thập tự giá” giữ hình ảnh cụ thể, còn “theo sau tôi” vừa tự nhiên vừa bảo toàn nét nghĩa không gian của nguyên ngữ. Cấu trúc “Ai… thì…” làm rõ quan hệ điều kiện vốn có trong câu mà không thêm nội dung thần học.
