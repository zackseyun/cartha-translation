- from: Ai không vác[a] thập tự giá của mình và theo sau tôi[b] thì không thể làm môn đồ của tôi.
  to: Ai không vác[a] thập tự giá của mình và đi theo sau tôi[b] thì không thể là môn đồ của tôi.
  rationale: Chỉnh “làm môn đồ” thành “là môn đồ” để phản ánh trực tiếp động từ εἶναι, và thêm “đi” trong “đi theo sau tôi” để biểu đạt rõ hơn ἔρχεται mà vẫn giữ hình ảnh không gian của ὀπίσω. Chú thích b được chỉnh cho tự nhiên và chính xác hơn. Không thay đổi nghĩa hay thêm diễn giải thần học.
