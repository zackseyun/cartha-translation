review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính của câu: người chủ sai người nô lệ đi ra, mệnh lệnh mạnh ἀνάγκασον, mục đích để nhà được đầy, và đại từ sở hữu μου. “Chủ nhà” phù hợp với κύριος trong bối cảnh dụ ngôn; “người nô lệ” phản ánh rõ δοῦλος. Tuy nhiên, “những nơi ven hàng rào” thêm danh từ khái quát “nơi” không có trong φραγμούς và làm cụm từ kém trực tiếp hơn nguyên ngữ.'
  naturalness: “Hãy đi ra các con đường và những nơi ven hàng rào” hơi gượng trong tiếng Việt hiện đại. “Hãy đi ra các nẻo đường và dọc các hàng rào” diễn đạt tự nhiên hơn hình ảnh những con đường và ranh giới/bờ giậu ở ngoài khu dân cư, mà không thêm một địa điểm khái quát.
  terminology: '“Thúc ép” là lựa chọn khả dĩ cho ἀνάγκασον: vẫn mạnh hơn “thúc giục” nhưng không tự động xác định cách thức là bạo lực. Chú thích cần giữ rõ rằng đây là khả năng diễn giải ngữ cảnh, không phải sự làm nhẹ nghĩa của động từ. “Nhà ta” giữ được μου và hợp với lời của chủ nhà trong văn phong trang trọng.'
  issues:
  - severity: low
    issue: Cụm “những nơi ven hàng rào” có tính diễn giải và chưa tự nhiên.
    rationale: φραγμούς là “hàng rào/bờ giậu”, không phải danh từ “những nơi”. Cách đặt “dọc các hàng rào” vừa tự nhiên vừa giữ hình ảnh không gian của nguyên ngữ.
  revised_text: 'Chủ nhà nói với người nô lệ: “Hãy đi ra các nẻo đường và dọc các hàng rào, rồi thúc ép người ta vào, để nhà ta được đầy.”'
