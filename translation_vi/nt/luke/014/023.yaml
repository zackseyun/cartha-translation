id: LUK.14.23
reference: Luke 14:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: vi
  text: 'Chủ nhà nói với người nô lệ: “Hãy đi ra các nẻo đường và dọc các hàng rào, rồi thúc ép người ta vào, để nhà ta được đầy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: chủ nhà
  rationale: Trong thế giới của dụ ngôn, từ này chỉ người chủ của ngôi nhà và bữa tiệc; “chủ nhà” tự nhiên hơn và tránh biến từ này thành một tước hiệu thần học trực tiếp.
- source_word: δοῦλον
  choice: người nô lệ
  rationale: Giữ rõ địa vị lệ thuộc được hàm ý bởi δοῦλος, thay vì làm nhẹ thành “đầy tớ” hay “người phục vụ”.
- source_word: Ἔξελθε
  choice: Hãy đi ra
  rationale: Giữ sắc thái chuyển động ra ngoài của động từ ἐξέρχομαι và lực mệnh lệnh.
- source_word: ὁδοὺς καὶ φραγμοὺς
  choice: các con đường và những nơi ven hàng rào
  rationale: ὁδοί là các lối đi hay đường sá; φραγμοί là hàng rào hoặc bờ giậu. Cách diễn đạt này tự nhiên trong tiếng Việt và gợi các địa điểm bên ngoài, dọc ranh giới, nơi người ta có thể được tìm thấy.
- source_word: ἀνάγκασον
  choice: thúc ép
  rationale: Giữ lực mạnh của động từ, vốn có thể mang nghĩa ép buộc hoặc gây sức ép mạnh, nhưng không mặc nhiên gợi hành vi cưỡng bức bằng bạo lực như “cưỡng ép” trong tiếng Việt hiện đại.
- source_word: εἰσελθεῖν
  choice: vào
  rationale: Sau “thúc ép người ta”, “vào” diễn đạt tự nhiên hành động đi vào ngôi nhà đã được xác định bởi ngữ cảnh.
- source_word: ἵνα γεμισθῇ μου ὁ οἶκος
  choice: để nhà ta được đầy
  rationale: Giữ kết cấu chỉ mục đích/kết quả, thể bị động của γεμισθῇ, và nghĩa trực tiếp của οἶκος là ngôi nhà nơi mở tiệc.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn
  choice: chủ nhà
  alternative: Chúa; ông chủ
  rationale: Ở cấp độ câu chuyện, κύριος là người chủ ngôi nhà đang sai nô lệ đi. “Chủ nhà” giữ đúng vai trò trong dụ ngôn mà không phủ nhận ý nghĩa thần học rộng hơn của dụ ngôn.
- issue: Sức nặng của ἀνάγκασον
  choice: thúc ép người ta vào
  alternative: ép buộc người ta vào; khẩn khoản thúc giục người ta vào
  rationale: “Thúc ép” bảo toàn sức mạnh và sự căng thẳng của nguyên ngữ, trong khi chú thích nêu rõ rằng trong bối cảnh dụ ngôn, từ này không nhất thiết chỉ sự cưỡng bức thân thể.
- issue: Đại từ sở hữu trong lời chủ nhà
  choice: nhà ta
  alternative: nhà tôi
  rationale: “Ta” là lối tự xưng trang trọng, tự nhiên của người chủ khi nói với người nô lệ trong văn kể chuyện, không phải là một tuyên bố trực tiếp về thần tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu trực tiếp giữ lực mệnh lệnh. “Người nô lệ” bảo toàn thực trạng xã hội của δοῦλος; “những nơi ven hàng rào” tránh cách ghép thiếu tự nhiên “đường và hàng rào” trong tiếng Việt.
