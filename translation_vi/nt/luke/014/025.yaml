  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: vi
  text: 'Có nhiều đoàn người cùng đi với Chúa Giê-su[a]; Ngài quay lại và nói với họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhiều đám đông đang đi cùng Ngài.” Động từ Hy Lạp diễn tả hành động đang tiếp diễn: các đám đông đang đồng hành với Chúa Giê-su trên đường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: cùng đi với
  rationale: 'Động từ ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn: các đoàn dân đang đồng hành với Ngài trên đường. “Cùng đi với” tự nhiên trong tiếng Việt và giữ được ý đồng hành.'
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ trong mạch kể, không nhất thiết mang nghĩa đối lập. Việc chuyển sang câu mới thể hiện tự nhiên chức năng diễn ngôn này mà không thêm “bấy giờ” hay “nhưng” quá mức cần thiết.
- source_word: αὐτῷ
  choice: với Đức Chúa Jêsus
  rationale: Đại từ chỉ Chúa Jêsus trong văn cảnh. Dùng danh xưng giúp câu tiếng Việt rõ chủ thể, đồng thời đại từ “Ngài” ở câu sau tránh lặp lại.
- source_word: ὄχλοι πολλοί
  choice: nhiều đoàn dân đông
  rationale: Cách dịch này giữ cả số nhiều của ὄχλοι và ý số lượng lớn của πολλοί, dù hơi kém gọn hơn “đám đông” trong tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ đơn giản nối hoàn cảnh đồng hành với hành động tiếp theo của Chúa Jêsus.
- source_word: στραφεὶς
  choice: quay lại
  rationale: Phân từ bất định diễn tả hành động xảy ra trước hoặc gắn liền với việc nói. “Quay lại” tự nhiên và không xác định quá cụ thể hướng quay.
- source_word: εἶπεν
  choice: nói
  rationale: Tương đương tự nhiên và chính xác của động từ λέγω trong lời kể.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: πρός với đối cách sau động từ nói chỉ người nghe. “Với họ” là cách diễn đạt tự nhiên trong tiếng Việt và giữ đại từ của nguyên văn.
