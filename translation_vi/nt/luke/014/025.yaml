translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hình ảnh nhiều đoàn dân đồng hành, dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi tôn kính phổ biến trong bản dịch Kinh Thánh tiếng Việt. Dấu [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
