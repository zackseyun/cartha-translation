reference: Luke 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: vi
  text: 'Nghe những điều ấy, một người trong số những người cùng dùng bữa với Đức Giê-su nói với Người: “Phước cho người nào sẽ ăn bánh trong vương quốc Đức Chúa Trời!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ăn bánh” là một cách nói tự nhiên trong tiếng Hy Lạp, có thể chỉ việc cùng dùng một bữa ăn; bản dịch giữ lại hình ảnh nguyên văn.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: khi nghe
  rationale: Chuyển phân từ bất định thì thành mệnh đề thời gian tự nhiên trong tiếng Việt, giữ được trình tự của câu.
- source_word: δέ
  choice: Bấy giờ
  rationale: Diễn đạt sự chuyển tiếp nhẹ trong mạch kể; tự nhiên hơn việc dùng một từ chỉ đối lập mạnh.
- source_word: τις τῶν συνανακειμένων
  choice: một người trong số những người đang dùng bữa với Đức Giê-su
  rationale: Nêu rõ đây là một vị khách cùng bàn. “Dùng bữa” truyền đạt đúng tình huống mà không buộc tiếng Việt phải mô tả tư thế nằm tựa khi ăn của thời cổ.
- source_word: ταῦτα
  choice: những lời ấy
  rationale: Trong ngữ cảnh, đại từ chỉ những điều Đức Giê-su vừa nói; cách diễn đạt này rõ và tự nhiên hơn “những điều ấy”.
- source_word: εἶπεν αὐτῷ
  choice: liền nói với Người
  rationale: Giữ rõ đối tượng được nói với; “liền” nối phản ứng của người dự tiệc với điều vừa nghe mà không làm thay đổi nội dung.
- source_word: Μακάριος
  choice: Phước cho
  rationale: Giữ sắc thái tuyên bố về ân phước trong lời nói mang chiều kích cánh chung, thay vì thu hẹp thành cảm xúc vui vẻ.
- source_word: ὅστις
  choice: người
  rationale: Cấu trúc “Phước cho người...” tự nhiên trong tiếng Việt và vẫn mang nghĩa khái quát của đại từ quan hệ bất định.
- source_word: φάγεται ἄρτον
  choice: sẽ được ăn bánh
  rationale: Giữ hình ảnh cụ thể “ăn bánh”; “được” diễn đạt tự nhiên đặc ân tham dự bữa ăn nhưng không khẳng định thêm tác nhân ngoài văn bản.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: trong vương quốc Đức Chúa Trời
  rationale: Dịch trực tiếp cụm giới từ, không đưa thêm hình ảnh yến tiệc vốn chỉ được gợi ra bởi ngữ cảnh.
theological_decisions:
- issue: Sắc thái của Μακάριος trong lời nói về bữa ăn cánh chung
  choice: Phước cho người sẽ được ăn bánh trong vương quốc Đức Chúa Trời
  alternative: Hạnh phúc thay người sẽ ăn bánh trong vương quốc Đức Chúa Trời
  rationale: “Phước cho” giữ được ý về tình trạng được hưởng ân phước gắn với việc dự phần trong vương quốc Đức Chúa Trời, đồng thời không biến câu này chỉ thành lời diễn tả cảm xúc chủ quan.
- issue: Quan hệ giữa động từ tương lai φάγεται và việc tham dự vương quốc
  choice: sẽ được ăn
  alternative: sẽ ăn
  rationale: Tiếng Hy Lạp xác định hành động trong tương lai nhưng không nêu rõ tác nhân ban cho. “Được ăn” là cách nói Việt ngữ tự nhiên về đặc ân dự phần, song không giải thích người ấy được vào vương quốc bằng cách nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Người” để nhận diện rõ đối tượng của αὐτῷ. Tránh lối diễn đạt cổ “đồng bàn” và tránh thêm từ “yến tiệc” vào chính văn.
