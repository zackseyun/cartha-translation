  to: Sau khi nhận được vương quyền, ông trở về và ra lệnh gọi đến với mình những đầy tớ mà ông đã giao tiền cho họ, để biết họ đã kiếm được gì nhờ kinh doanh.[a]
  rationale: Bản sửa làm rõ việc các đầy tớ được triệu đến với người chủ và chuyển cách diễn đạt kết quả kinh doanh từ sắc thái cách thức sang điều đạt được, phù hợp hơn với cú pháp và nghĩa của tiếng Hy Lạp. Các lựa chọn «vương quyền», «đầy tớ» và «tiền» được giữ nguyên.
  reviewer_model: gpt-5.6-terra
