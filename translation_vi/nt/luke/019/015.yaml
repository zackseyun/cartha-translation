source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: vi
  text: Sau khi nhận được vương quyền, ông trở về và ra lệnh gọi đến với mình những đầy tớ mà ông đã giao tiền cho họ, để biết họ đã kiếm được gì nhờ kinh doanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: «để biết họ đã làm ăn được gì» hoặc «đã thu được bao nhiêu nhờ kinh doanh». Động từ Hy Lạp vừa nói đến việc kinh doanh vừa hướng đến kết quả của việc ấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: ông trở về
  rationale: Cấu trúc ἐγένετο kết hợp với động từ nguyên mẫu có mạo từ là công thức tường thuật mang ý thời gian; tiếng Việt tự nhiên không cần dịch riêng «xảy ra».
- source_word: λαβόντα τὴν βασιλείαν
  choice: sau khi nhận được vương quyền
  rationale: Phân từ chỉ hành động xảy ra trước lúc trở về. Trong bối cảnh chính trị của dụ ngôn, βασιλεία nhấn mạnh địa vị và quyền cai trị được ban, nên «vương quyền» chính xác hơn nghĩa lãnh thổ của «vương quốc».
- source_word: φωνηθῆναι αὐτῷ
  choice: truyền gọi đến
  rationale: Dạng bị động của φωνέω ở đây diễn tả việc ra lệnh triệu những người ấy đến gặp ông.
- source_word: δούλους
  choice: đầy tớ
  rationale: δοῦλος chỉ người lệ thuộc dưới quyền chủ; «đầy tớ» vừa giữ được quan hệ chủ–tớ trong dụ ngôn vừa tự nhiên và trang trọng trong tiếng Việt. «Nô lệ» có thể nhấn mạnh hơn địa vị pháp lý mà câu này không trực tiếp trình bày.
- source_word: δεδώκει τὸ ἀργύριον
  choice: đã giao tiền
  rationale: Thì quá khứ hoàn thành chỉ việc xảy ra trước đó; «giao» truyền đạt tự nhiên việc trao tiền cho họ sử dụng, còn ἀργύριον ở đây mang nghĩa tiền bạc nói chung.
- source_word: ἵνα γνοῖ
  choice: để biết
  rationale: Giữ rõ mục đích của mệnh đề ἵνα mà không làm câu tiếng Việt nặng nề.
- source_word: τί διεπραγματεύσαντο
  choice: họ đã kinh doanh sinh lợi thế nào
  rationale: Động từ διαπραγματεύομαι nói đến hoạt động kinh doanh và, trong ngữ cảnh kiểm tra số tiền, kết quả thu được. Cách dịch giữ cả hoạt động lẫn ý sinh lợi nhưng không ấn định một con số.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh kinh tế của dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: Quan hệ lệ thuộc và quyền của chủ vẫn được thể hiện qua «đầy tớ» và toàn bộ ngữ cảnh. «Nô lệ» là một khả năng từ vựng có thật, nhưng có thể khiến độc giả hiện đại hiểu câu này như một khẳng định cụ thể về địa vị pháp lý mà bản văn không khai triển.
- issue: Nghĩa của βασιλεία trong việc người quý tộc đi xa rồi trở về
  choice: vương quyền
  alternative: vương quốc
  rationale: Ở đây điều người ấy nhận là quyền làm vua/cai trị, không nhất thiết là một lãnh thổ. «Vương quyền» bảo toàn sắc thái chính trị của dụ ngôn mà không đồng nhất nó trực tiếp với một kết luận thần học ngoài câu.
- issue: Mức độ xác định kết quả của διεπραγματεύσαντο
  choice: kinh doanh sinh lợi thế nào
  alternative: đã làm ăn được gì
  rationale: Ngữ cảnh cho thấy chủ muốn biết kết quả của việc dùng tiền để kinh doanh. Bản dịch nêu sắc thái sinh lợi nhưng dùng «thế nào» để không thu hẹp τί thành riêng số tiền lời.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Lược dịch riêng công thức ἐγένετο để tránh câu Việt gượng; dùng «vương quyền» theo ngữ cảnh chính trị và «đầy tớ» cho quan hệ lệ thuộc trong dụ ngôn.
