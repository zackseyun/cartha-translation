language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: vi
  text: Khi họ đang nghe những điều ấy, Đức Giê-su kể thêm một dụ ngôn, vì ngài đang ở gần Giê-ru-sa-lem và vì họ tưởng rằng vương quốc Đức Chúa Trời sắp xuất hiện ngay lập tức.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sắp được bày tỏ ngay lập tức.” Động từ này có thể chỉ việc trở nên hữu hình hoặc được biểu lộ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Khi họ đang nghe những điều ấy
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; cách dịch này giữ được sắc thái tiếp diễn và tự nhiên trong tiếng Việt.
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: Đức Giê-su kể thêm một dụ ngôn
  rationale: προσθεὶς εἶπεν là lối nói chỉ việc tiếp tục hoặc bổ sung lời nói; “kể thêm” tự nhiên trong ngữ cảnh và παραβολή được dịch theo thuật ngữ Tin Mừng quen thuộc là “dụ ngôn”.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: vì ngài đã ở gần Giê-ru-sa-lem
  rationale: διά cùng động từ nguyên mẫu có mạo từ mang nghĩa nguyên nhân; chủ thể ở gần Giê-ru-sa-lem là Đức Giê-su. “Đã ở gần” diễn đạt trạng thái tại thời điểm kể chuyện mà không hàm ý ngài vừa mới đến đó.
- source_word: δοκεῖν αὐτοὺς
  choice: vì họ tưởng rằng
  rationale: Động từ diễn tả nhận định hoặc kỳ vọng của họ nhưng không xác nhận nhận định ấy là đúng; “tưởng rằng” phù hợp với sắc thái trong ngữ cảnh.
- source_word: παραχρῆμα
  choice: ngay lập tức
  rationale: Trạng từ nhấn mạnh tính tức thời; cách dịch này rõ nghĩa và trang trọng vừa phải.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: sắp xuất hiện
  rationale: μέλλω với động từ nguyên mẫu diễn tả điều được cho là sắp xảy ra, còn ἀναφαίνεσθαι có thể chỉ việc trở nên hữu hình hoặc hiển lộ; “sắp xuất hiện” giữ được cả tính cận kề lẫn sắc thái biểu hiện.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch rõ ràng, tự nhiên và duy trì thuật ngữ thần học nhất quán, không thu hẹp βασιλεία chỉ vào lãnh thổ hay chỉ vào một khái niệm nội tâm.
theological_decisions:
- issue: Bản chất của sự xuất hiện được mong đợi của vương quốc Đức Chúa Trời
  choice: Diễn đạt rằng họ tưởng vương quốc Đức Chúa Trời “sắp xuất hiện ngay lập tức”.
  alternative: Diễn giải rằng vương quốc sắp được thiết lập về chính trị hoặc sắp được bày tỏ trọn vẹn vào thời cuối cùng.
  rationale: Câu này chỉ thuật lại kỳ vọng về sự biểu hiện cận kề của vương quốc, không xác định hình thức chính trị, khải huyền hay thuộc linh; bản dịch giữ nguyên độ mở thần học ấy.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su”, “Giê-ru-sa-lem” và “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông; câu văn giữ hai nguyên nhân song song của việc kể dụ ngôn.
