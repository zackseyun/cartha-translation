source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: vi
  text: 'Đức Giê-su đáp: “Tôi nói với các ông, nếu những người này im tiếng[a], thì đá sẽ kêu lên.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nín lặng” hoặc “ngừng lên tiếng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Đức Giê-su đáp
  rationale: Cụm phân từ đi với động từ hữu hạn có nghĩa đen gần với ‘đáp lại, Ngài nói’. Tiếng Việt tự nhiên gói cả hai yếu tố vào động từ ‘đáp’; thêm ‘Đức Giê-su’ để xác định chủ thể vốn được ngữ cảnh và hình thái động từ Hy Lạp ngầm chỉ.
- source_word: Λέγω ὑμῖν
  choice: Tôi nói với các ông
  rationale: Giữ sắc thái trực tiếp và nhấn mạnh của công thức phát ngôn, đồng thời dùng cách xưng hô tự nhiên trong ngữ cảnh Đức Giê-su nói với những người Pha-ri-si.
- source_word: οὗτοι
  choice: những người này
  rationale: Đại từ chỉ định số nhiều nói về những người đang tung hô trong ngữ cảnh. ‘Những người này’ tự nhiên và rõ hơn dạng ‘những người đây’ trong tiếng Việt.
- source_word: σιωπήσουσιν
  choice: im tiếng
  rationale: Động từ chỉ việc không nói hoặc ngừng lên tiếng. Trong điều kiện này, ‘im tiếng’ diễn đạt tự nhiên khả năng những người đang tung hô sẽ ngừng tiếng, mà không nhấn quá mức một sắc thái thể cụ thể.
- source_word: οἱ λίθοι
  choice: đá
  rationale: λίθοι là ‘đá, những hòn đá’. Tiếng Việt thường dùng danh từ khối ‘đá’ không cần từ chỉ số lượng; cách dịch này vẫn giữ nguyên hình ảnh cụ thể.
- source_word: κράξουσιν
  choice: sẽ kêu lên
  rationale: κράζω chỉ tiếng kêu lớn hoặc tiếng hô vang. ‘Sẽ kêu lên’ giữ được sức mạnh và hình ảnh sống động của câu nói.
theological_decisions:
- issue: Có nên giải thích hình ảnh đá kêu lên là ẩn dụ hay phép lạ ngay trong chính văn hay không
  choice: Giữ nguyên hình ảnh trực tiếp ‘đá sẽ kêu lên’, không thêm lời giải thích.
  alternative: Diễn giải rằng đá làm chứng theo nghĩa bóng, hoặc toàn thể tạo vật sẽ ca ngợi Đức Chúa Trời.
  rationale: Bản Hy Lạp đưa ra hình ảnh mạnh mẽ mà không giải thích. Giữ nguyên lời văn bảo toàn sức nặng thần học và tu từ, không quyết định thay độc giả rằng đây là phép phóng đại, hình ảnh tiên tri hay một khả năng kỳ diệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. ‘Đức Giê-su đáp’ tự nhiên hơn cấu trúc sát chữ ‘đáp lại, Ngài nói’; lời trực tiếp vẫn giữ nhịp ngắn, dứt khoát và hình ảnh gây ấn tượng của nguyên bản.
