  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: vi
  text: 'Ông cũng nói với người này: “Còn ngươi, hãy cai quản năm thành.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: Ông cũng nói với người này
  rationale: Diễn đạt tự nhiên mạch kể tiếp nối của δέ, đồng thời giữ καί ('cũng') và sắc thái chỉ định của τούτῳ ('người này').
- source_word: Καὶ σὺ
  choice: Còn ngươi
  rationale: Giữ lời xưng hô trực tiếp và nhấn mạnh sự phân giao tương ứng cho người đầy tớ này; 'còn' thể hiện tự nhiên tính song song trong tiếng Việt.
- source_word: ἐπάνω γίνου
  choice: hãy cai quản
  rationale: Mệnh lệnh γίνου kết hợp với ἐπάνω chỉ việc được đặt vào vị trí có quyền trên một phạm vi; 'hãy cai quản' vừa tự nhiên vừa giữ ý thẩm quyền mà không xác định quá mức cơ chế bổ nhiệm.
- source_word: πέντε πόλεων
  choice: năm thành
  rationale: πόλις chỉ thành phố hoặc thành; 'thành' phù hợp văn cảnh cổ đại và làm rõ phạm vi cai quản.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo chủ thể trong mạch dụ ngôn và “ngươi” để giữ sắc thái lời của một nhân vật có thẩm quyền nói với đầy tớ; câu dịch tránh lối sát chữ thiếu tự nhiên “hãy ở trên năm thành”.
