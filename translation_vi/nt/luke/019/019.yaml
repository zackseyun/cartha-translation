  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc và ý nghĩa của εἶπεν δὲ καὶ τούτῳ, Καὶ σὺ, ἐπάνω γίνου và πέντε πόλεων: người chủ cũng nói với người đầy tớ này và giao cho người ấy quyền cai quản năm thành. “Còn ngươi” diễn đạt tự nhiên tính phân phối/nhấn mạnh của Καὶ σὺ mà không thêm ý nghĩa đáng kể.'
