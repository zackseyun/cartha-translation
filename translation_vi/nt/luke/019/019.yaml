  terminology: “Cai quản” diễn đạt thích hợp thẩm quyền hàm ý trong ἐπάνω γίνου. “Năm thành” là cách dùng trang trọng, quen thuộc trong văn phong Kinh Thánh để chỉ các πόλεις; không cần chú thích.
