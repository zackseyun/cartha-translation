    issue: Thêm ý ‘đã ... rồi’
    rationale: ἔχει là thì hiện tại ‘người ấy có’; nguyên văn không có trạng từ hay tiểu từ tương ứng với ‘đã/already’ hoặc ‘rồi’. Dù ý phản đối có thể được suy ra từ ngữ cảnh rộng hơn, bản dịch tối ưu tương đương không nên đưa ý này vào câu.
  - severity: low
    issue: Cách ghi phương án trong chú thích a
    rationale: “Lạy Chúa” và “thưa ngài” là các khả năng theo ngữ cảnh/đăng ký khác nhau; nên ghi với viết hoa và dấu câu nhất quán, đồng thời giữ bản văn chính theo ngữ cảnh dụ ngôn.
