- from: 'Họ nói với ông: “Thưa chủ[a], người ấy đã có mười mi-na[b] rồi—”'
  to: 'Họ nói với ông: “Thưa chủ[a], người ấy có mười mi-na[b]—”'
  rationale: Bỏ “đã ... rồi” để không thêm sắc thái thời/thể không có trong ἔχει. Giữ “Thưa chủ” và “mi-na” vì chúng vừa tự nhiên trong tiếng Việt hiện đại vừa phản ánh bối cảnh và từ ngữ Hy Lạp. Chú thích được chuẩn hóa nhẹ về cách trình bày, không thay đổi ý nghĩa.
