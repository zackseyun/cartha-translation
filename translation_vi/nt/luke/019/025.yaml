  yaml_path: translation/nt/luke/019/025.yaml
  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: vi
  text: 'Họ nói với ông: “Thưa chủ[a], người ấy có mười mi-na[b]—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lạy Chúa” hoặc “Thưa ngài.”'
    reason: lexical_alternative
  - marker: b
    text: Mi-na là một đơn vị tiền tệ thời cổ, tương đương khoảng một trăm ngày công.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Họ nói
  rationale: Trong tiếng Việt, không cần dịch máy móc liên từ καί ở đầu câu; mạch kể vẫn được nối tự nhiên nhờ ngữ cảnh.
- source_word: εἶπαν αὐτῷ
  choice: Họ nói với ông
  rationale: Diễn đạt tự nhiên hành động nói và giữ đại từ nam số ít chỉ nhân vật có thẩm quyền trong dụ ngôn.
- source_word: Κύριε
  choice: Thưa chủ
  rationale: Dạng hô cách κύριε ở đây là lời xưng hô kính trọng với vị chủ trong dụ ngôn. “Thưa chủ” giữ sắc thái quyền uy mà không biến lời này thành một tuyên xưng thần học rõ ràng hơn nguyên văn.
- source_word: ἔχει
  choice: đã có ... rồi
  rationale: Động từ hiện tại chỉ sự sở hữu; trong lời phản đối, cấu trúc “đã có ... rồi” là cách nói tự nhiên trong tiếng Việt và làm rõ tình trạng đang có sẵn, phù hợp ngữ cảnh.
- source_word: δέκα μνᾶς
  choice: mười mi-na
  rationale: Giữ đơn vị tiền cổ bằng lối phiên âm thay vì thay bằng một đơn vị tiền hiện đại dễ gây hiểu lầm.
theological_decisions:
- issue: Cách dịch κύριε trong lời xưng hô thuộc dụ ngôn
  choice: Thưa chủ
  alternative: Lạy Chúa; thưa ngài
  rationale: Ngữ cảnh trực tiếp là những người hầu thưa với nhân vật chủ/vua trong dụ ngôn. “Thưa chủ” giữ quan hệ quyền uy và sự kính trọng, đồng thời không buộc câu này thành lời trực tiếp gọi Đức Chúa Jesus là “Chúa”; ghi chú bảo tồn các khả năng dịch khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang cuối câu được giữ để cho thấy lời xen vào hoặc câu nói chưa khép lại trước khi mạch dụ ngôn tiếp tục.
