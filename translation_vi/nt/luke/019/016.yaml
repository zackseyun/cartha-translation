  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: vi
  text: 'Người thứ nhất đến và thưa: “Thưa ngài[a], mina của ngài đã sinh lời thêm mười mina.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Lạy Chúa” hoặc “Thưa chủ.” Từ Hy Lạp κύριε có thể là tước hiệu “Chúa” hoặc lời xưng hô kính trọng với chủ hay người bề trên.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο δὲ ὁ πρῶτος
  choice: Người thứ nhất đến
  rationale: Diễn đạt tự nhiên bước tiến tiếp theo của câu chuyện; δέ được thể hiện qua trật tự kể chuyện thay vì thêm một liên từ không cần thiết.
- source_word: λέγων
  choice: và thưa
  rationale: Chuyển phân từ đồng thời thành động từ phối hợp, phù hợp văn kể chuyện tiếng Việt; “thưa” thể hiện lời nói kính trọng với người bề trên.
- source_word: Κύριε
  choice: Thưa ngài
  rationale: Trong bối cảnh dụ ngôn, đây là cách xưng hô kính trọng với người có quyền. Cách dịch này tự nhiên trong tiếng Việt mà không mặc nhiên biến lời xưng hô thành một tuyên xưng thần học.
- source_word: ἡ μνᾶ σου
  choice: mina của ngài
  rationale: Giữ tên đơn vị tiền tệ cổ bằng lối phiên âm để không đồng nhất μνᾶ với một đơn vị khác như ta-lâng; sở hữu cách σου cho biết số tiền thuộc về người chủ.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: đã làm ra thêm mười mina
  rationale: προσεργάζομαι chỉ khoản thu được thêm nhờ hoạt động. “Làm ra thêm” giữ rõ ý mười mina là phần gia tăng ngoài số vốn ban đầu.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô thuộc một dụ ngôn
  choice: Thưa ngài
  alternative: Lạy Chúa; Thưa chủ
  rationale: κύριε có thể là tước hiệu “Chúa” nhưng cũng có thể chỉ là lời xưng hô kính trọng với chủ hoặc người bề trên. Ngữ cảnh trực tiếp nghiêng về lời xưng hô trong quan hệ chủ–đầy tớ, nên bản chính dùng “Thưa ngài” và ghi nhận các khả năng khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “mina” làm thuật ngữ tiền tệ lịch sử; lời đáp dùng “thưa” để thể hiện quan hệ kính trọng trong dụ ngôn.
