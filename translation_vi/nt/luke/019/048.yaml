  text: καὶ οὐχ ⸀εὕρισκον τὸ τί ποιήσωσιν, ὁ λαὸς γὰρ ἅπας ἐξεκρέματο αὐτοῦ ἀκούων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: vi
  text: Họ không tìm ra điều mình có thể làm[a], vì toàn dân đều say mê lắng nghe Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ không biết phải làm gì.”'
    reason: Cụm τὸ τί ποιήσωσιν diễn tả điều hay hướng hành động họ đang cân nhắc; cách dịch thay thế này diễn đạt sắc thái cân nhắc ấy tự nhiên trong tiếng Việt.
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: không tìm ra
  rationale: Thì chưa hoàn thành cùng với phủ định diễn tả việc họ liên tục không tìm được một hướng hành động; “không tìm ra” tự nhiên trong tiếng Việt và giữ được ý thất bại thực tế.
- source_word: τὸ τί ποιήσωσιν
  choice: cách phải làm gì
  rationale: Cụm τί với động từ giả định mang sắc thái cân nhắc về hướng hành động. Cách dịch này giữ ý họ không tìm ra mình có thể hoặc nên làm gì, mà không xác định quá mức.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: vì toàn dân
  rationale: γάρ nêu lý do nên dịch là “vì”; ὁ λαὸς ἅπας nhấn mạnh toàn thể dân chúng, được diễn đạt gọn và trang trọng bằng “toàn dân”.
- source_word: ἐξεκρέματο αὐτοῦ ἀκούων
  choice: đều chăm chú nghe lời Đức Chúa Jêsus
  rationale: Nghĩa đen là “bám lấy Ngài mà nghe”, một thành ngữ chỉ sự chú tâm mãnh liệt. “Chăm chú nghe lời” truyền đạt tự nhiên hành động nghe đầy say mê; tên được nêu để tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chăm chú nghe lời” ưu tiên sự tự nhiên trong tiếng Việt nhưng vẫn phản ánh thành ngữ Hy Lạp về việc dân chúng hoàn toàn bị cuốn hút khi nghe Đức Chúa Jêsus.
