- from: 'Đức Giê-su nói với ông: “Hôm nay sự cứu rỗi đã đến với nhà này[a], vì người này cũng là con cháu Áp-ra-ham.”'
  to: 'Đức Giê-su nói với ông: “Hôm nay sự cứu rỗi đã đến cho nhà này[a], vì ông ấy cũng là con cháu Áp-ra-ham.”'
  rationale: Chỉ điều chỉnh cách dùng giới từ và đại từ cho tự nhiên hơn trong tiếng Việt hiện đại, đồng thời làm chú thích phản ánh phạm vi của οἶκος chính xác hơn. Không thay đổi ý nghĩa, không thêm tên Xa-chê, và không giải quyết theo hướng giáo phái sự mơ hồ của “con cháu Áp-ra-ham.”
