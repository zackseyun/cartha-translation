  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: vi
  text: 'Đức Giê-su nói với ông: “Hôm nay sự cứu rỗi đã đến cho nhà này[a], vì ông ấy cũng là con cháu Áp-ra-ham.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “hộ gia đình này.” Từ Hy Lạp có thể chỉ ngôi nhà hoặc những người thuộc hộ gia đình ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: Đức Giê-su nói với ông
  rationale: δέ là từ nối nhẹ; tiếng Việt không cần dịch riêng trong mạch kể này. Đại từ αὐτόν được giữ là “ông”, không thêm tên Xa-chê vốn không có trong câu.
- source_word: Σήμερον
  choice: Hôm nay
  rationale: Cách diễn đạt tự nhiên, hiện đại, đồng thời giữ vị trí nhấn mạnh về thời gian ở đầu lời tuyên bố.
- source_word: σωτηρία
  choice: sự cứu rỗi
  rationale: Giữ nội dung thần học rộng của σωτηρία trong Lu-ca, thay vì thu hẹp thành một cuộc giải cứu nhất thời.
- source_word: τῷ οἴκῳ τούτῳ
  choice: với nhà này
  rationale: οἶκος có thể chỉ ngôi nhà hoặc những người thuộc gia đình ấy. “Nhà này” giữ hình ảnh nguyên ngữ và vẫn có khả năng mang nghĩa tập thể trong tiếng Việt; chú thích nêu rõ sự đa nghĩa.
- source_word: ἐγένετο
  choice: đã đến
  rationale: Trong kết hợp với σωτηρία, “đã đến” diễn đạt tự nhiên ý sự cứu rỗi đã trở thành hiện thực hoặc hiện diện tại đây.
- source_word: καθότι
  choice: vì
  rationale: Diễn đạt rõ quan hệ lý do mà không làm câu nặng nề.
- source_word: καὶ αὐτὸς
  choice: người này cũng
  rationale: Giữ sắc thái bao gồm và nhấn mạnh của καὶ αὐτός; “người này” giúp tránh nhầm đại từ với Đức Giê-su trong tiếng Việt.
- source_word: υἱὸς Ἀβραάμ
  choice: con cháu Áp-ra-ham
  rationale: Trong tiếng Việt hiện đại, “con cháu” là thành ngữ tự nhiên cho quan hệ thuộc dòng dõi và vẫn có thể mang âm hưởng căn tính giao ước; dịch sát “một người con trai của Áp-ra-ham” dễ bị hiểu là con ruột trực tiếp.
theological_decisions:
- issue: Ý nghĩa của υἱὸς Ἀβραάμ
  choice: Giữ như một cách nói về việc thuộc về dòng dõi hoặc cộng đồng căn tính của Áp-ra-ham, không xác định hẹp nghĩa.
  alternative: Chỉ dòng dõi huyết thống; hoặc chỉ người thật sự thuộc gia đình đức tin của Áp-ra-ham.
  rationale: Bản thân câu này không buộc phải chọn riêng nghĩa dân tộc hay nghĩa thuộc linh. “Con cháu Áp-ra-ham” duy trì độ mở để văn mạch Lu-ca định hướng cách hiểu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; tránh từ cổ và không áp đặt cách giải thích giáo phái.
