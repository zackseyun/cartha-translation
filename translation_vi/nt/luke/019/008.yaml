source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: vi
  text: 'Nhưng Xa-chê đứng lên và thưa với Chúa: “Này, thưa Chúa, tôi cho người nghèo một nửa tài sản của tôi; và nếu tôi đã cưỡng đoạt điều gì của ai[a], tôi đền lại gấp bốn lần.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “lừa lấy điều gì của ai.” Động từ Hy Lạp có thể chỉ sự cưỡng đoạt, bóc lột hoặc lừa đảo, đôi khi bằng cách cáo buộc sai.'
    reason: lexical_alternative
  - marker: b
    text: Các động từ ở thì hiện tại trong tiếng Hy Lạp cũng có thể được hiểu là “tôi sẽ cho” và “tôi sẽ đền lại,” diễn tả một quyết tâm thực hiện ngay.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: đứng lên
  rationale: Phân từ aorist của ἵστημι được dùng theo nghĩa nội động; “đứng lên” là cách kể tự nhiên trong tiếng Việt, diễn tả hành động của Xa-chê mà không thêm động cơ.
- source_word: κύριον / κύριε
  choice: Chúa / Thưa Chúa
  rationale: Giữ tước hiệu κύριος đối với Đức Giê-su; ở lời xưng hô, thêm “Thưa” để câu nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: Ἰδοὺ
  choice: này
  rationale: Từ gọi sự chú ý và nhấn mạnh lời sắp nói; “này” ngắn gọn, hiện đại và phù hợp với lời nói trực tiếp.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: một nửa tài sản của tôi
  rationale: Diễn đạt tự nhiên cấu trúc phân lượng, trong đó ὑπάρχοντα chỉ của cải hoặc tài sản thuộc sở hữu.
- source_word: τοῖς πτωχοῖς
  choice: người nghèo
  rationale: Chuyển danh từ hóa số nhiều của πτωχός thành cách gọi thông dụng, rõ nghĩa trong tiếng Việt.
- source_word: δίδωμι
  choice: tôi cho
  rationale: Giữ thì hiện tại chỉ định của nguyên văn, không quyết định trong chính văn rằng đây là thói quen hiện có hay một cam kết sẽ thực hiện ngay.
- source_word: εἴ τινός τι
  choice: nếu tôi đã ... bất cứ thứ gì của ai
  rationale: Giữ cả hai yếu tố bất định “của ai” và “bất cứ thứ gì” bằng trật tự tự nhiên trong tiếng Việt.
- source_word: ἐσυκοφάντησα
  choice: đã cưỡng đoạt
  rationale: Động từ có thể chỉ việc tống tiền, bóc lột hoặc gian lận, đôi khi bằng cáo buộc sai; “cưỡng đoạt” phù hợp với bối cảnh quyền lực của người thu thuế, còn nghĩa rộng hơn được nêu trong chú thích.
- source_word: ἀποδίδωμι
  choice: tôi đền lại
  rationale: Diễn tả việc hoàn trả nhằm bồi thường, phù hợp với ngữ cảnh phục hồi thiệt hại và giữ hình thức hiện tại của nguyên văn.
- source_word: τετραπλοῦν
  choice: gấp bốn lần
  rationale: Cách nói hiện đại, chính xác và dễ hiểu về mức hoàn trả bằng bốn lần.
theological_decisions:
- issue: Sắc thái của các động từ hiện tại δίδωμι và ἀποδίδωμι
  choice: 'Dịch bằng hiện tại: “tôi cho ... tôi đền lại”'
  alternative: 'Có thể hiểu theo nghĩa quyết định tức thời: “tôi sẽ cho ... tôi sẽ đền lại”'
  rationale: Nguyên văn dùng hiện tại chỉ định. Giữ hiện tại bảo tồn sự mở nghĩa giữa việc mô tả thực hành đang có và việc tuyên bố quyết tâm tức thời, tránh dùng bản dịch để kết luận trước về tình trạng đạo đức hoặc thời điểm ăn năn của Xa-chê.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời xưng hô “Thưa Chúa” tự nhiên trong tiếng Việt; cấu trúc chính văn giữ sự cô đọng và sự nhập nhằng có thật của các động từ hiện tại.
