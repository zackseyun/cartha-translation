    rationale: Cụm εἴ τινός τι bao gồm cả người bị hại lẫn vật/điều bị lấy. “Nếu tôi đã cưỡng đoạt điều gì của ai” là cách nói Việt tự nhiên hơn và vẫn giữ tính bất định của nguyên văn.
