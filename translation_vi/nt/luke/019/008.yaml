  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của Hy Lạp: Xa-chê đứng, xưng hô với Chúa, cho người nghèo một nửa tài sản, và hoàn trả gấp bốn. Thì hiện tại của δίδωμι và ἀποδίδωμι được bảo toàn bằng “tôi cho” và “tôi đền lại”; chú thích cũng nêu đúng khả năng hiểu là quyết tâm tức thời. “Cưỡng đoạt” là một cách dịch có cơ sở cho ἐσυκοφάντησα, miễn là chú thích giữ các nghĩa thay thế rộng hơn.'
  naturalness: Cần chỉnh nhẹ trật tự của Ἰδού và cụm bất định. “Thưa Chúa, này” nghe gượng trong tiếng Việt hiện đại; “Này, thưa Chúa” tự nhiên hơn. “Bất cứ thứ gì của ai” có thể gây lúng túng về quan hệ sở hữu; “điều gì của ai” tự nhiên và vẫn truyền đạt đầy đủ “bất cứ điều gì từ bất cứ ai” trong cấu trúc phủ định/điều kiện này.
  terminology: “Chúa” cho κύριος và “Thưa Chúa” ở lời xưng hô là nhất quán với ngữ cảnh. “Tài sản,” “người nghèo,” và “đền lại gấp bốn lần” đều là các lựa chọn hiện đại, rõ nghĩa, và phù hợp với văn bản. Không cần áp đặt cách hiểu thần học về việc Xa-chê đang mô tả thói quen hay cam kết mới.
  issues:
