  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: vi
  text: Khi Ngài đi qua, người ta trải áo choàng[a] của mình trên đường.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “y phục” hoặc “áo ngoài” của mình.'
    reason: ἱμάτια có thể chỉ y phục nói chung hoặc đặc biệt là áo ngoài; “áo choàng” là lựa chọn phù hợp ngữ cảnh.
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Khi Ngài đi tới
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động xảy ra đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái đang tiến bước.
- source_word: δέ
  choice: không dịch riêng
  rationale: Ở đây δέ là liên từ nhẹ nối tiếp trình thuật; quan hệ nối tiếp đã được diễn đạt tự nhiên bằng mệnh đề mở đầu “Khi…”, nên thêm “và” sẽ nặng câu.
- source_word: ὑπεστρώννυον
  choice: trải
  rationale: Động từ ở thì chưa hoàn thành gợi hành động đang diễn ra hoặc lặp lại. Trong ngữ cảnh đoàn người lần lượt trải áo khi Ngài đi qua, “trải” diễn đạt tự nhiên mà không cần thêm dấu hiệu tiếp diễn.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: áo choàng của mình
  rationale: ἱμάτια chỉ y phục, thường là áo ngoài; “áo choàng” cụ thể, dễ hiểu và phù hợp với vật được trải xuống đường. Đại từ phản thân ἑαυτῶν được thể hiện bằng “của mình”.
- source_word: ἐν τῇ ὁδῷ
  choice: trên đường
  rationale: Cụm giới từ chỉ vị trí nơi áo được trải; “trên đường” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
