  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: vi
  text: Ông tìm cách nhìn xem Đức Giê-su là ai, nhưng không thể thấy được vì đám đông, bởi ông có vóc người thấp bé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông thấp người.” Theo nghĩa đen, cụm Hy Lạp nói ông nhỏ về tầm vóc; trong ngữ cảnh này, cụm từ nói đến chiều cao cơ thể, không phải tuổi tác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: cố tìm
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang tiếp diễn; “cố tìm” truyền đạt cả ý tìm kiếm lẫn cố gắng.
- source_word: ἰδεῖν
  choice: xem
  rationale: Động từ nguyên mẫu chỉ mục tiêu của nỗ lực; trong ngữ cảnh muốn nhìn thấy một người giữa đám đông, “xem” tự nhiên trong tiếng Việt.
- source_word: τὸν Ἰησοῦν τίς ἐστιν
  choice: xem Đức Giê-su là ai
  rationale: Giữ cấu trúc và sự rộng nghĩa của câu Hy Lạp, có thể liên quan đến căn tính hoặc muốn biết Ngài là người thế nào, mà không giải thích quá mức.
- source_word: οὐκ ἠδύνατο
  choice: không thể thấy được
  rationale: Diễn đạt tự nhiên sự bất lực do đám đông cản trở; bổ sung “thấy được” từ mục tiêu đã nêu để câu tiếng Việt rõ nghĩa.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: vì đám đông
  rationale: ἀπό ở đây nêu nguyên nhân gây cản trở; “vì đám đông” ngắn gọn và tự nhiên.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: có vóc người thấp bé
  rationale: Trong ngữ cảnh bị đám đông che khuất, ἡλικία nói đến tầm vóc hay chiều cao chứ không phải tuổi tác; cách dịch này chính xác và trang nhã.
