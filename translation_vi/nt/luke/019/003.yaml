  to: Ông tìm cách nhìn xem Đức Giê-su là ai, nhưng không thể thấy được vì đám đông, bởi ông có vóc người thấp bé.[a]
  rationale: Điều chỉnh cách diễn đạt nỗ lực nhìn thấy cho tự nhiên hơn trong tiếng Việt, đồng thời duy trì đầy đủ sắc thái của thì chưa hoàn thành và mục tiêu của hành động trong nguyên ngữ. Chú thích được biên tập để tự nhiên, rõ ràng và vẫn giữ đối lập chiều cao với tuổi tác.
