  text: Καὶ εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς ⸀πωλοῦντας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: vi
  text: Vào khuôn viên đền thờ[a], Đức Giê-su bắt đầu đuổi những người đang buôn bán ra ngoài,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đền thờ” hoặc “các sân đền thờ”; từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: khi vào
  rationale: Phân từ bất định diễn tả hành động đi vào gắn liền và xảy ra trước hành động chính; “khi vào” tự nhiên trong tiếng Việt và không nhấn mạnh quá mức khoảng cách thời gian.
- source_word: ἱερὸν
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu vực đền thờ, không riêng nơi thánh bên trong; cách dịch này thể hiện rõ phạm vi không gian trong tiếng Việt.
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Giữ nguyên sắc thái khởi đầu của động từ ἄρχομαι đi với động từ nguyên mẫu.
- source_word: ἐκβάλλειν
  choice: đuổi ... ra ngoài
  rationale: Diễn đạt sức mạnh và tính dứt khoát của ἐκβάλλω bằng lối nói tự nhiên, hiện đại.
- source_word: πωλοῦντας
  choice: những người đang buôn bán
  rationale: Phân từ hiện tại chỉ những người đang thực hiện hoạt động bán hàng; “buôn bán” tự nhiên trong bối cảnh thương mại tại khuôn viên đền thờ mà không thêm mặt hàng cụ thể.
theological_decisions:
- issue: Phạm vi của ἱερόν trong hành động của Đức Giê-su tại đền thờ
  choice: khuôn viên đền thờ
  alternative: đền thờ; sân đền thờ; nơi thánh
  rationale: Bản dịch xác định đúng đây là khu phức hợp đền thờ chứ không phải riêng nội điện, nhưng không suy đoán sân cụ thể nào.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” để chỉ chủ ngữ hàm ẩn theo ngữ cảnh; dùng “khuôn viên đền thờ” nhằm truyền đạt chính xác phạm vi của ἱερόν. Dấu phẩy cuối câu được giữ vì câu Hy Lạp và câu tham chiếu còn tiếp nối.
