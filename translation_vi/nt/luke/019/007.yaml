  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: vi
  text: 'Thấy vậy, mọi người đều bắt đầu lẩm bẩm phàn nàn: “Ông ấy đã vào ở với một người tội lỗi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông ấy đã vào làm khách của một người tội lỗi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Thấy vậy
  rationale: Phân từ bất định được diễn đạt như một hoàn cảnh dẫn đến phản ứng của đám đông; “vậy” quy chiếu tự nhiên đến việc Đức Giê-su đi cùng Xa-chê mà không thêm một tân ngữ quá cụ thể.
- source_word: πάντες
  choice: tất cả mọi người đều
  rationale: Giữ phạm vi bao quát của πάντες và nhấn mạnh phản ứng chung của những người chứng kiến.
- source_word: διεγόγγυζον
  choice: bắt đầu xầm xì
  rationale: Thể chưa hoàn thành có thể gợi hành động đang diễn ra hoặc khởi phát; “bắt đầu xầm xì” truyền đạt sắc thái bất bình, lẩm bẩm trong đám đông bằng tiếng Việt tự nhiên.
- source_word: λέγοντες
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Nội dung của phân từ “nói rằng” được chuyển tự nhiên sang lời dẫn trực tiếp trong tiếng Việt.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: một người tội lỗi
  rationale: Giữ cả danh từ ἀνήρ và tính từ ἁμαρτωλός, thể hiện lời đánh giá miệt thị của đám đông mà không nén thành một thuật ngữ thần học riêng.
- source_word: εἰσῆλθεν
  choice: đã vào nhà
  rationale: Động từ chỉ việc đi vào; “nhà” được bổ sung theo ngữ cảnh của việc vào ở với Xa-chê, giúp câu tiếng Việt rõ và tự nhiên.
- source_word: καταλῦσαι
  choice: để ở lại
  rationale: Diễn đạt ý lưu lại hoặc trú tại nhà ai đó; giữ cách nói rộng của nguyên văn thay vì buộc phải hiểu là qua đêm.
theological_decisions:
- issue: Cách diễn đạt lời đám đông mô tả Xa-chê
  choice: một người tội lỗi
  alternative: một kẻ có tội
  rationale: “Một người tội lỗi” bảo toàn cấu trúc tính từ + danh từ của ἁμαρτωλῷ ἀνδρί và sắc thái phán xét, nhưng tránh làm lời dịch gay gắt hơn nguyên văn.
- issue: Ý nghĩa của καταλῦσαι trong bối cảnh tiếp khách
  choice: ở lại
  alternative: làm khách
  rationale: “Ở lại” giữ được độ rộng từ vựng của động từ; “làm khách” nêu rõ quan hệ tiếp đãi nhưng mang tính diễn giải hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Xầm xì” diễn tả lời bất bình lan trong đám đông; đại từ “ông ấy” tái hiện lời đám đông nói về Đức Giê-su mà không tự thêm một tước hiệu vào nguyên văn.
