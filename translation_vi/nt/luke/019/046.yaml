source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: vi
  text: 'Ngài phán với họ: “Có lời chép rằng: ‘Và nhà Ta sẽ là nhà cầu nguyện,’ nhưng các ngươi đã biến nơi ấy thành hang ổ của bọn cướp.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: Ngài phán với họ
  rationale: Chuyển phân từ hiện tại sang động từ hữu hạn để câu tiếng Việt tự nhiên, đồng thời vẫn nối tiếp hành động ở câu trước; “phán” phù hợp với lời tuyên bố có thẩm quyền của Chúa Giê-su.
- source_word: Γέγραπται
  choice: Có lời chép rằng
  rationale: Công thức tiếng Việt quen thuộc để dẫn Kinh Thánh, diễn đạt trạng thái có thẩm quyền của điều đã được chép.
- source_word: Καὶ ἔσται
  choice: sẽ là
  rationale: Giữ ý tương lai của ἔσται; không dịch καί ở đầu lời trích vì “và” tại đây thiếu tự nhiên khi câu trích được tách khỏi văn cảnh Ê-sai.
- source_word: ὁ οἶκός μου
  choice: Nhà Ta
  rationale: Dịch sát οἶκος là “nhà,” thay vì giải nghĩa thành “đền thờ,” để bảo toàn cách diễn đạt của lời trích Ê-sai 56:7.
- source_word: οἶκος προσευχῆς
  choice: nhà cầu nguyện
  rationale: Cách nói tự nhiên, trang trọng và quen thuộc trong tiếng Việt, giữ quan hệ định ngữ của nguyên văn.
- source_word: ὑμεῖς δὲ
  choice: nhưng các ngươi
  rationale: “Nhưng” thể hiện sự tương phản mạnh; “các ngươi” làm nổi bật đại từ chủ ngữ và phù hợp với lời quở trách trực tiếp, trang trọng.
- source_word: ἐποιήσατε
  choice: đã biến
  rationale: Trong tiếng Việt, “đã biến ... thành” diễn đạt tự nhiên hành động tạo nên tình trạng hiện tại; bổ ngữ “nơi ấy” quy chiếu về ngôi nhà vừa nói đến.
- source_word: σπήλαιον
  choice: hang ổ
  rationale: “Hang ổ” thể hiện nghĩa nơi ẩn náu của kẻ phạm tội trong thành ngữ tiên tri, thích hợp hơn nghĩa địa chất đơn thuần “hang.”
- source_word: λῃστῶν
  choice: bọn cướp
  rationale: λῃστής có thể chỉ kẻ cướp hoặc kẻ cướp có vũ trang; “bọn cướp” tự nhiên trong tiếng Việt và không thu hẹp quá mức sang sắc thái chính trị của “thổ phỉ.”
theological_decisions:
- issue: Dịch hình ảnh về đền thờ bằng “nhà” hay giải nghĩa thành “đền thờ”
  choice: Nhà Ta ... nhà cầu nguyện
  alternative: Đền thờ của Ta ... nơi cầu nguyện
  rationale: Nguyên văn dùng οἶκος, “nhà,” trong lời trích Ê-sai 56:7. Giữ “nhà” bảo toàn liên kết liên văn bản và hình ảnh nhà của Đức Chúa Trời, trong khi văn cảnh vẫn cho thấy nơi được nói đến là đền thờ.
- issue: Sắc thái của λῃστῶν
  choice: bọn cướp
  alternative: bọn cướp đường / bọn thổ phỉ
  rationale: Từ Hy Lạp có phạm vi nghĩa gồm kẻ cướp và kẻ cướp có tổ chức. “Bọn cướp” giữ được độ rộng ngữ nghĩa, tránh áp đặt sắc thái nổi dậy chính trị không được câu này xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Ta” theo quy ước tiếng Việt khi lời trích dẫn quy về Đức Chúa Trời. Dùng “các ngươi” để giữ sức nặng của đại từ nhấn mạnh ὑμεῖς trong lời quở trách; không thêm chú thích vì các phương án quan trọng đã được thể hiện minh bạch trong bản dịch và hồ sơ quyết định.
