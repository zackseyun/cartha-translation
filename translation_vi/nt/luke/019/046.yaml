  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính: lời dẫn Kinh Thánh, “nhà Ta,” “nhà cầu nguyện,” sự tương phản nhấn mạnh với “các ngươi,” và hình ảnh “hang ổ của bọn cướp.” Tuy nhiên, καὶ đứng đầu lời trích trong bản văn SBLGNT (dù được đặt trong ngoặc chỉ mức độ bất định văn bản) bị lược đi không có dấu hiệu nào. Có thể giữ từ này bằng “Và” mà vẫn không làm đổi nghĩa.'
