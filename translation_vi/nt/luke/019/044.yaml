revisions:
- from: Chúng sẽ san bằng ngươi cùng con cái ở trong ngươi, và sẽ không để lại trong ngươi hòn đá nào chồng trên hòn đá nào, vì ngươi đã không nhận biết thời điểm ngươi được viếng thăm.[a]
  to: Chúng sẽ san phẳng ngươi và con cái ngươi ở trong ngươi, và sẽ không để lại trong ngươi hòn đá nào chồng lên hòn đá nào, vì ngươi đã không nhận biết thời điểm ngươi được viếng thăm.[a]
  rationale: Bản sửa chỉ điều chỉnh cách nối từ và kết hợp từ cho tiếng Việt hiện đại. Nó giữ nguyên cấu trúc tu từ, đối tượng được nhân cách hóa, hình ảnh “con cái” ở trong thành, mức độ hủy diệt, và tính mơ hồ có chủ ý của ἐπισκοπή.
  reviewer_model: gpt-5.6-terra
