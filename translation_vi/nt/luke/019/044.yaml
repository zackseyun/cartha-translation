language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: vi
  text: Chúng sẽ san phẳng ngươi và con cái ngươi ở trong ngươi, và sẽ không để lại trong ngươi hòn đá nào chồng lên hòn đá nào, vì ngươi đã không nhận biết thời điểm ngươi được viếng thăm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thời điểm ngươi được xem xét.” Từ Hy Lạp có thể chỉ sự viếng thăm hoặc sự xem xét, đặc biệt là sự viếng thăm của Đức Chúa Trời có thể đem đến lòng thương xót hoặc sự phán xét.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: sẽ san bằng
  rationale: Động từ diễn tả việc phá hủy, làm cho đổ xuống sát mặt đất. “San bằng” tự nhiên trong tiếng Việt và giữ được sức mạnh của hình ảnh.
- source_word: σε
  choice: ngươi
  rationale: Giữ đại từ số ít trực tiếp, vì Chúa Giê-su đang nói với thành Giê-ru-sa-lem được nhân cách hóa; không diễn giải thành “thành của ngươi”.
- source_word: τὰ τέκνα σου ἐν σοί
  choice: con cái ở trong ngươi
  rationale: Giữ nghĩa đen “con cái” và hình ảnh thành phố như người mẹ, thay vì làm phẳng thành “cư dân”; ἐν σοί được thể hiện rõ.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: sẽ không để lại trong ngươi hòn đá nào chồng trên hòn đá nào
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, truyền đạt thành ngữ về sự phá hủy hoàn toàn và vẫn giữ rõ cụm “trong ngươi”.
- source_word: ἀνθ’ ὧν
  choice: vì
  rationale: Trong ngữ cảnh này, cụm từ nêu nguyên nhân của sự phán xét; “vì” rõ ràng và gọn.
- source_word: ἔγνως
  choice: đã không nhận biết
  rationale: “Nhận biết” thể hiện sự thất bại trong việc nhận ra hành động quyết định của Đức Chúa Trời, phù hợp hơn nghĩa đơn thuần “biết”.
- source_word: καιρὸν
  choice: thời điểm
  rationale: καιρός chỉ một thời điểm có ý nghĩa hoặc được định; “thời điểm” tự nhiên và hàm ý tính quyết định hơn “thời gian” chung chung.
- source_word: τῆς ἐπισκοπῆς σου
  choice: ngươi được viếng thăm
  rationale: Diễn đạt tự nhiên quan hệ sở hữu của σου và giữ sắc thái về một cuộc viếng thăm hướng đến Giê-ru-sa-lem, mà không nói rõ chủ thể trong câu chính.
theological_decisions:
- issue: Ý nghĩa của ἐπισκοπή trong bối cảnh phán xét
  choice: “được viếng thăm”, để sắc thái cuộc viếng thăm của Đức Chúa Trời được hàm ẩn
  alternative: “được xem xét” hoặc “lúc Đức Chúa Trời viếng thăm ngươi”
  rationale: Danh từ có thể chỉ sự viếng thăm hoặc xem xét, đặc biệt là sự viếng thăm của Đức Chúa Trời đem theo ân huệ hay phán xét. Bản dịch không xác định quá mức chủ thể hoặc kết quả, nhờ đó giữ được độ căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được dùng vì lời nói trực tiếp nhân cách hóa Giê-ru-sa-lem; cấu trúc “con cái ở trong ngươi” cố ý giữ hình ảnh thành phố như một người mẹ.
