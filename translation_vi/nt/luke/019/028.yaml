  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: vi
  text: Sau khi nói những điều ấy, Đức Giê-su đi phía trước, tiến lên Giê-ru-sa-lem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Sau khi
  rationale: Liên từ Καὶ nối tiếp diễn biến; trong tiếng Việt, quan hệ thời gian với phân từ εἰπών được diễn đạt tự nhiên bằng cả cụm “Sau khi”, không cần dịch Καὶ thành một từ riêng như “Và”.
- source_word: εἰπὼν ταῦτα
  choice: nói những điều ấy
  rationale: Phân từ bất định εἰπών chỉ hành động xảy ra trước động từ chính; “sau khi nói” thể hiện rõ trình tự ấy. Số nhiều ταῦτα được giữ bằng “những điều ấy”, không thu hẹp phạm vi chỉ còn “những lời này”.
- source_word: ἐπορεύετο
  choice: đi
  rationale: Động từ ở thì chưa hoàn thành mô tả hành trình đang tiếp diễn. Trong mạch kể tiếng Việt, “đi” là tự nhiên; sắc thái tiếp diễn được hỗ trợ bởi ngữ cảnh và cụm “tiến lên” đi kèm.
- source_word: ἔμπροσθεν
  choice: phía trước
  rationale: Giữ nghĩa vị trí “ở đằng trước/đi đầu” mà không bổ sung một tân ngữ không được nêu rõ trong câu Hy Lạp.
- source_word: ἀναβαίνων
  choice: tiến lên
  rationale: Phân từ hiện tại diễn tả hành động đồng thời với ἐπορεύετο. “Tiến lên” vừa tự nhiên trong tiếng Việt vừa giữ ý đi lên, thay vì giản lược thành “đi đến”.
- source_word: εἰς Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Giới từ εἰς nêu đích đến; kết hợp với “tiến lên”, tên địa danh này được hiểu tự nhiên là nơi Đức Giê-su đang hướng tới, không hàm ý Ngài đã vào thành.
theological_decisions:
- issue: Có giữ ngôn ngữ chỉ sự đi lên Giê-ru-sa-lem hay không
  choice: “tiến lên Giê-ru-sa-lem”
  alternative: “đi đến Giê-ru-sa-lem” hoặc “trên đường đến Giê-ru-sa-lem”
  rationale: Cách dịch giữ hình ảnh ἀναβαίνων về sự đi lên, vốn phù hợp cả với địa thế và kết cấu hành trình trong Lu-ca, nhưng không diễn giải thêm ý nghĩa thần học.
- issue: Chủ ngữ hàm ẩn của động từ
  choice: Nêu rõ “Đức Giê-su”
  alternative: “Ngài”
  rationale: Tiếng Hy Lạp cho phép lược chủ ngữ vì đã rõ từ ngữ cảnh. Tiếng Việt nêu lại “Đức Giê-su” để câu đứng riêng vẫn rõ nghĩa, không thay đổi đối tượng được nói đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể liên tục, tránh lối dịch quá sát chữ như “và sau khi đã nói những điều này, Ngài đang đi”. Không thêm “trước các môn đồ” hay “trước mọi người”, vì đối tượng đứng sau không được nêu trực tiếp trong câu nguồn.
