revisions:
- from: 'Họ nói: “Đáng chúc tụng Đức Vua, Đấng nhân danh Chúa mà đến![a] Bình an trên trời[b] và vinh quang nơi chí cao!”'
  to: 'Họ nói: “Phước cho Vua, Đấng đến nhân danh Chúa![a] Bình an trên trời[b] và vinh quang nơi chí cao!”'
  rationale: Thay “Đáng chúc tụng Đức Vua” bằng “Phước cho Vua” để diễn đạt không mơ hồ lời chúc phước/công bố của Εὐλογημένος. Đưa “đến” lên trước “nhân danh Chúa” tạo thành mệnh đề quan hệ tiếng Việt rõ ràng mà không thay đổi nghĩa. Các phần còn lại và các điểm neo chú thích được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:32:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các thành tố trọng yếu của bản Hy Lạp: danh xưng βασιλεὺς được nêu rõ; “nhân danh Chúa” phản ánh ἐν ὀνόματι κυρίου; và “bình an trên trời” không bị hòa hợp thành “dưới đất.” Tuy nhiên, “Đáng chúc tụng Đức Vua” thiếu cấu trúc vị ngữ rõ ràng trong tiếng Việt và có thể được hiểu là lời kêu gọi/chỉ định đối tượng để chúc tụng, thay vì lời tuyên xưng “Phước cho/Được phước là Vua.”'
  naturalness: Cụm “Phước cho Vua, Đấng đến nhân danh Chúa” là một lời tung hô tự nhiên, trang trọng trong tiếng Việt Kinh Thánh hiện đại, đồng thời làm rõ quan hệ của “Đấng đến” với “Vua.” “Bình an trên trời và vinh quang nơi chí cao” có nhịp điệu cô đọng, phù hợp với nguyên văn cảm thán.
  terminology: Giữ “Vua” để phản ánh βασιλεὺς; viết hoa trong ngữ cảnh lời tung hô mang tính tước hiệu là chấp nhận được. “Chúa,” “bình an,” và “vinh quang” phù hợp cách dùng Kinh Thánh tiếng Việt. “Nơi chí cao” bảo lưu lối diễn đạt trang trọng và không diễn giải quá mức ἐν ὑψίστοις.
  issues:
  - severity: medium
    issue: “Đáng chúc tụng Đức Vua” không diễn đạt minh bạch lời chúc phước/ca tụng ở dạng tuyên xưng.
    rationale: 'Εὐλογημένος là vị ngữ trong lời tung hô: “Phước cho/Được chúc phước là...” Câu Việt hiện tại không có “là” và có thể bị đọc như “hãy chúc tụng Đức Vua” hoặc “Đức Vua đáng được chúc tụng.” Dùng “Phước cho Vua” tái hiện rõ hơn chức năng câu cảm thán mà vẫn tự nhiên.'
  revised_text: 'Họ nói: “Phước cho Vua, Đấng đến nhân danh Chúa![a] Bình an trên trời[b] và vinh quang nơi chí cao!”'
