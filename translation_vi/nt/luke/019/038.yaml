  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: vi
  text: 'Họ nói: “Phước cho Vua, Đấng đến nhân danh Chúa![a] Bình an trên trời[b] và vinh quang nơi chí cao!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số bản dịch dùng công thức quen thuộc hơn: “Phước cho Đấng đến nhân danh Chúa,” nhưng bản văn Lu-ca ở đây nói rõ “Vua.”'
    reason: alternative_reading
  - marker: b
    text: 'Câu này gợi lại Lu-ca 2:14 nhưng đổi địa điểm: ở đó là “bình an dưới đất,” còn ở đây là “bình an trên trời.”'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: Họ nói
  rationale: Phân từ hiện tại nối lời tung hô này với hành động của đoàn môn đồ ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt mà không thêm sắc thái như “kêu lớn” vốn không có trực tiếp trong từ nguồn.
- source_word: Εὐλογημένος
  choice: Đáng chúc tụng
  rationale: Giữ sắc thái của một lời chúc tụng trang trọng, phù hợp với bối cảnh tung hô và âm hưởng Thi Thiên, đồng thời tránh biến câu thành mệnh lệnh trực tiếp.
- source_word: ὁ ἐρχόμενος βασιλεὺς
  choice: Đức Vua, Đấng … mà đến
  rationale: Giữ rõ danh từ βασιλεὺς (“Vua”) có trong bản văn Lu-ca và diễn đạt phân từ ὁ ἐρχόμενος bằng một mệnh đề quan hệ tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐν ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: Đây là thành ngữ tiếng Việt tự nhiên, giữ được cả nền tảng Kinh Thánh và ý nghĩa đến dưới danh nghĩa, thẩm quyền của Chúa.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Bình an trên trời
  rationale: Giữ nguyên mệnh đề cảm thán không có động từ và địa điểm “trên trời,” không đồng hóa với “bình an dưới đất” ở Lu-ca 2:14.
- source_word: δόξα ἐν ὑψίστοις
  choice: vinh quang nơi chí cao
  rationale: Giữ cấu trúc cô đọng, thi vị và sự không xác định hoàn toàn của ἐν ὑψίστοις, thay vì giải thích rõ thành một tầng trời cụ thể.
theological_decisions:
- issue: Lời tung hô Đức Vua mang ý nghĩa hoàng gia và Mê-si-a
  choice: Dịch rõ βασιλεὺς là “Đức Vua.”
  alternative: “Đáng chúc tụng Đấng nhân danh Chúa mà đến,” không có “Đức Vua.”
  rationale: Bản văn Lu-ca được cung cấp có từ βασιλεὺς. Giữ từ này bảo toàn điểm nhấn vương quyền của tác giả mà không thêm một lời giải thích giáo lý vào chính câu.
- issue: Mối liên hệ với Lu-ca 2:14
  choice: Giữ “Bình an trên trời.”
  alternative: “Bình an dưới đất.”
  rationale: Nguồn Hy Lạp ghi rõ ἐν οὐρανῷ, “trên trời.” Bản dịch không nên hòa hợp câu này với lời ca ở Lu-ca 2:14, nhưng cần giữ sự tương ứng và căng thẳng liên văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đức Vua” thể hiện sự tôn kính trong lời tung hô; “Đấng … mà đến” giữ âm hưởng Kinh Thánh nhưng vẫn tự nhiên. Hai mệnh đề cuối được giữ cô đọng như nguyên văn Hy Lạp.
