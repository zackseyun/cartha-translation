source:
  edition: SBLGNT
  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: vi
  text: 'vì tôi sợ ngài, bởi ngài là người hà khắc[a]: ngài lấy những gì ngài không đặt xuống[b], và gặt những gì ngài không gieo.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nghiêm khắc” hoặc “khắt khe”.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ngài lấy những gì ngài không đặt xuống.” Một số bản dịch diễn giải là “ngài lấy lên những gì ngài không đặt xuống” hoặc “ngài thu những gì ngài không gửi vào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: tôi sợ
  rationale: Thì vị hoàn diễn tả trạng thái sợ hãi kéo dài trong quá khứ; tiếng Việt tự nhiên không cần đánh dấu riêng nét kéo dài ở đây.
- source_word: γάρ
  choice: vì
  rationale: Nối lời này với câu trước như lý do người đầy tớ đưa ra.
- source_word: αὐστηρός
  choice: hà khắc
  rationale: Giữ sắc thái nghiêm khắc, đòi hỏi và tiêu cực trong lời buộc tội của người đầy tớ, nhưng không khẳng định lời đánh giá ấy là khách quan.
- source_word: αἴρεις
  choice: ngài lấy
  rationale: Diễn đạt nghĩa khái quát của αἴρω và giữ sự song hành với mệnh đề theo sau.
- source_word: ὃ οὐκ ἔθηκας
  choice: những gì mình không đặt xuống
  rationale: Giữ hình ảnh cụ thể và tính không xác định của τίθημι, không tự ý chuyên biệt hóa thành hành động gửi tiền.
- source_word: θερίζεις
  choice: ngài gặt
  rationale: Giữ nguyên hình ảnh nông nghiệp và cặp từ quen thuộc gieo–gặt.
- source_word: ὃ οὐκ ἔσπειρας
  choice: những gì mình không gieo
  rationale: Truyền đạt trực tiếp σπείρω và bảo toàn phép đối ứng với 'gặt'.
- source_word: ἄνθρωπος
  choice: người
  rationale: Chỉ nhân vật nam cụ thể; trong tiếng Việt, 'người' sau 'là' là cách diễn đạt tự nhiên, không làm mất quy chiếu đến nhân vật ấy.
theological_decisions:
- issue: Có nên làm nhẹ lời người đầy tớ mô tả ông chủ để bảo vệ hình ảnh nhân vật hay không
  choice: Giữ nguyên sắc thái buộc tội bằng từ 'hà khắc'
  alternative: Dùng từ nhẹ hơn như 'nghiêm khắc' hoặc 'khắt khe'
  rationale: Đây là lời giải thích và cáo buộc của người đầy tớ. Bản dịch cần giữ sức nặng tu từ mà không phán quyết lời ấy có phản ánh khách quan bản tính của ông chủ hay không.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng đại từ 'ngài' để phản ánh lời một đầy tớ thưa với người có địa vị cao hơn, trong khi vẫn giữ giọng cáo buộc. Dấu nháy đóng cho thấy đây là phần tiếp nối của lời thoại từ câu trước.
