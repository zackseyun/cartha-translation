source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: vi
  text: 'Ông nói với người ấy: “Tốt lắm, hỡi đầy tớ tốt[a]! Vì anh đã trung tín trong một việc rất nhỏ, hãy có thẩm quyền trên mười thành.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nô lệ.” Từ Hy Lạp doulos có thể mang nghĩa “đầy tớ” hoặc “nô lệ,” tùy theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: Tốt lắm
  rationale: Lời cảm thán khen ngợi tự nhiên trong tiếng Việt hiện đại, tương ứng với sắc thái tán thưởng của nguyên ngữ.
- source_word: ἀγαθὲ
  choice: tốt
  rationale: Giữ nghĩa trực tiếp của tính từ trong lời gọi, đồng thời kết hợp tự nhiên với “đầy tớ”.
- source_word: δοῦλε
  choice: đầy tớ
  rationale: Trong bối cảnh dụ ngôn về chủ và người dưới quyền, “đầy tớ” vừa tự nhiên vừa giữ quan hệ lệ thuộc; nghĩa mạnh hơn là “nô lệ” được nêu ở chú thích.
- source_word: ἐν ἐλαχίστῳ
  choice: trong một việc rất nhỏ
  rationale: Diễn đạt rõ thành ngữ chỉ phạm vi trách nhiệm hết sức nhỏ mà không thêm nội dung ngoài nguyên bản.
- source_word: πιστὸς ἐγένου
  choice: anh đã trung tín
  rationale: Phản ánh trực tiếp trạng thái được đánh giá trong nguyên ngữ; “trung tín” phù hợp với sự đáng tin cậy trong việc thi hành trách nhiệm.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: hãy cai quản
  rationale: Cụm mệnh lệnh diễn tả việc được trao quyền trên các thành; “hãy cai quản” tự nhiên trong tiếng Việt và làm rõ loại thẩm quyền theo ngữ cảnh.
- source_word: ἐπάνω δέκα πόλεων
  choice: mười thành
  rationale: Đi với động từ “cai quản” để truyền đạt đầy đủ ý có thẩm quyền trên mười πόλεις; “thành” giữ sắc thái đơn vị đô thị trong bối cảnh cổ đại.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh chủ–đầy tớ của dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: “Đầy tớ” cân bằng độ chính xác và tính tự nhiên trong văn cảnh này, còn chú thích bảo lưu thực tế rằng từ Hy Lạp cũng có thể chỉ một người nô lệ.
- issue: Sắc thái của πιστὸς ἐγένου
  choice: anh đã trung tín
  alternative: anh đã chứng tỏ mình trung tín
  rationale: Bản dịch chính không thêm rõ ý “chứng tỏ” vốn chỉ được suy ra từ hoàn cảnh đánh giá, nhờ đó bám sát nguyên ngữ và không giải quyết quá mức sắc thái của ἐγένου.
- issue: Ý nghĩa của ἴσθι ἐξουσίαν ἔχων
  choice: hãy cai quản
  alternative: hãy có thẩm quyền trên
  rationale: Trong bối cảnh được giao mười thành, quyền được trao là quyền quản trị. Cách dịch động từ tự nhiên hơn trong tiếng Việt nhưng vẫn giữ ý trao quyền, không hàm ý quyền sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho chủ trong dụ ngôn và “anh” khi ông trực tiếp nói với người đầy tớ; giữ lời khen ngắn gọn, có sức nặng.
