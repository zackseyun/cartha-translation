  source_fidelity: Bản dịch truyền đạt đúng lời khen, sự trung tín trong điều rất nhỏ, và phần thưởng liên quan đến mười thành. Tuy nhiên, “hãy cai quản mười thành” chuyển từ việc được ban/được có thẩm quyền (ἴσθι ἐξουσίαν ἔχων ἐπάνω) sang hành vi quản trị, làm yếu nét nghĩa trọng tâm là quyền hạn được trao.
  naturalness: Văn câu tự nhiên, rõ ràng và có sắc thái trang trọng vừa phải trong tiếng Việt hiện đại. Cặp xưng hô “ông/anh” vận hành mạch lạc trong khung cảnh dụ ngôn.
  terminology: “Đầy tớ” là lựa chọn chấp nhận được cho δοῦλε trong dụ ngôn; chú thích “nô lệ” bảo lưu nghĩa từ vựng thay thế. “Trung tín,” “thành,” và “Tốt lắm” đều phù hợp. Nên dịch ἐξουσίαν bằng “thẩm quyền” để giữ rõ thuật ngữ quyền hạn.
  issues:
