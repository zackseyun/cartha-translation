id: LUK.19.30
reference: Luke 19:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: vi
  text: 'Ngài phán: “Hãy đi vào làng đối diện. Khi vào đó, các con sẽ thấy một con vật non đang bị buộc; chưa từng có ai ngồi trên nó. Hãy tháo nó ra và dắt nó lại đây.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμη
  choice: ngôi làng
  rationale: Chuyển tải tự nhiên danh từ chỉ một làng nhỏ hay khu dân cư, không thêm sắc thái không có trong nguyên văn.
- source_word: πῶλον
  choice: con lừa con
  rationale: πῶλος tự thân có thể chỉ con non của loài vật, nhưng trong ngữ cảnh gần (Lu-ca 19:35; đối chiếu truyền thống vào Giê-ru-sa-lem) rõ ràng là lừa con; cách dịch này tự nhiên và xác định đúng loài theo văn cảnh.
- source_word: δεδεμένον
  choice: đang bị buộc
  rationale: 'Giữ trạng thái kết quả của phân từ hoàn thành bị động: con vật ở trong tình trạng đã được buộc lại.'
- source_word: λύσαντες
  choice: tháo dây
  rationale: Trong ngữ cảnh con vật bị buộc, cách nói này tự nhiên hơn dịch sát là “cởi nó”, đồng thời không thêm hành động vượt quá hàm ý của động từ.
- source_word: ἀγάγετε
  choice: dắt nó về đây
  rationale: Diễn đạt mệnh lệnh đưa con vật đến chỗ người nói; “dắt” phù hợp tự nhiên với con lừa, còn “về đây” làm rõ đích đến vốn được ngữ cảnh hàm chứa.
theological_decisions:
- issue: Tính chưa từng được cưỡi của con vật
  choice: chưa từng có ai ngồi trên nó
  alternative: chưa từng có người nào cưỡi nó
  rationale: Giữ gần động từ ἐκάθισεν (“ngồi”) và lời khẳng định tuyệt đối của nguyên văn, không diễn giải thêm ý nghĩa nghi lễ hoặc biểu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể Chúa Giê-su được tiếp nối từ câu trước, và “các con” cho lời Ngài nói với hai môn đồ; không thêm chú thích vì câu không có dị bản hay điểm mơ hồ cần thiết phải ghi chú trong bản đọc phổ thông.
