review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung sát nghĩa: mệnh lệnh đi vào làng, con vật bị buộc, tình trạng chưa từng có người ngồi trên nó, và các mệnh lệnh tháo rồi đem đến đều được truyền đạt. Tuy nhiên, πῶλον tự nó chỉ một con vật non (một «colt») và không nêu rõ loài; dịch «con lừa con» xác định loài vật vượt quá điều câu này trực tiếp nói. Đích đến hàm ý trong ἀγάγετε có thể diễn đạt tự nhiên là «lại đây».'
  naturalness: Câu văn đã rõ và trang trọng vừa phải. Bản sửa đổi thay «tháo dây» bằng «tháo nó ra», sát hơn với tân ngữ trực tiếp của λύσαντες mà vẫn tự nhiên; «dắt nó lại đây» là lối nói tiếng Việt tự nhiên cho việc đem con vật đến chỗ người nói.
  terminology: Giữ «Ngài», «làng», «bị buộc», và «ngồi trên nó» phù hợp văn phong Kinh Thánh hiện đại. «Con vật non» bảo toàn tính không xác định về loài của πῶλον; không cần áp đặt cách đồng nhất nó là lừa chỉ từ các liên hệ văn mạch hoặc truyền thống song song.
  issues:
  - severity: medium
    issue: «con lừa con» xác định loài vật mà πῶλον không xác định trong câu này.
    rationale: πῶλος có thể dùng cho con non, đặc biệt là ngựa hoặc lừa; bản văn Lu-ca 19:30 chỉ gọi nó là πῶλον. Vì vậy cần giữ tính khái quát thay vì chọn riêng «lừa».
  - severity: low
    issue: «tháo dây» chuyển tân ngữ từ con vật sang sợi dây.
    rationale: Trong ngữ cảnh, cách dịch này dễ hiểu, nhưng λύσαντες αὐτόν là «tháo/cởi nó ra». Dịch trực tiếp hơn tránh thêm một chi tiết vật thể không được nêu.
  revised_text: 'Ngài phán: “Hãy đi vào làng đối diện. Khi vào đó, các con sẽ thấy một con vật non đang bị buộc; chưa từng có ai ngồi trên nó. Hãy tháo nó ra và dắt nó lại đây.”'
