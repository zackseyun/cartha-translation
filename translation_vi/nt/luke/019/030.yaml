- from: 'Ngài phán: “Hãy đi vào ngôi làng đối diện. Khi vào đó, các con sẽ thấy một con lừa con đang bị buộc, chưa từng có ai ngồi trên nó. Hãy tháo dây và dắt nó về đây.”'
  to: 'Ngài phán: “Hãy đi vào làng đối diện. Khi vào đó, các con sẽ thấy một con vật non đang bị buộc; chưa từng có ai ngồi trên nó. Hãy tháo nó ra và dắt nó lại đây.”'
  rationale: Sửa hai chỗ để bám sát nghĩa từ vựng và mức độ xác định của nguyên văn Hy Lạp, đồng thời giữ văn phong tiếng Việt hiện đại và nội dung của bản dịch hiện có.
