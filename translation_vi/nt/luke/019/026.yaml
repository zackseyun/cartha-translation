id: LUK.19.26
reference: Luke 19:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: vi
  text: 'Tôi nói với anh em rằng: Ai có thì sẽ được ban thêm[a]; còn ai không có thì ngay cả điều mình có cũng sẽ bị lấy đi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch đơn giản là “sẽ được ban”. Tiếng Hy Lạp không có từ tương ứng trực tiếp với “thêm”, dù ý gia tăng thường được hiểu từ ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Tôi nói với anh em
  rationale: Diễn đạt trực tiếp, tự nhiên trong tiếng Việt hiện đại; giữ động từ hiện tại và đại từ số nhiều của nguyên văn mà không làm câu quá cổ kính.
- source_word: παντὶ τῷ ἔχοντι
  choice: Ai có
  rationale: Phân từ có mạo từ cùng với παντί chỉ bất cứ người nào có; “ai có” ngắn gọn, mang tính khái quát và không thêm đối tượng mà nguyên văn không nêu.
- source_word: δοθήσεται
  choice: sẽ được ban thêm
  rationale: Động từ tương lai bị động có nghĩa đen là “sẽ được ban/cho”. Từ “thêm” làm rõ ý gia tăng được hàm ý bởi cấu trúc châm ngôn và sự tương phản trong ngữ cảnh; chú thích ghi rõ rằng từ này không xuất hiện minh nhiên trong tiếng Hy Lạp.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: còn ai không có
  rationale: Giữ nét tương phản của δέ và diễn đạt tự nhiên người được nói đến theo nghĩa khái quát.
- source_word: καὶ ὃ ἔχει
  choice: ngay cả điều mình có
  rationale: Dịch καί theo nghĩa nhấn mạnh là “ngay cả”; “mình” quy chiếu tự nhiên về chủ thể khái quát “ai” mà không áp đặt giới tính.
- source_word: ἀρθήσεται
  choice: sẽ bị lấy đi
  rationale: Giữ thể tương lai bị động và nghĩa bị tước mất hay loại khỏi quyền sở hữu.
theological_decisions:
- issue: Phạm vi và ý nghĩa thần học của nguyên tắc được nêu
  choice: Giữ lời phán như một nguyên tắc ngắn gọn về việc được thêm và bị lấy đi, không xác định cơ chế thần học.
  alternative: Giải thích rõ đây chỉ là nguyên tắc về sự quản trị trong dụ ngôn, hoặc là nguyên tắc rộng hơn về vương quốc, sự cứu rỗi, công trạng hay tiền định.
  rationale: Câu Hy Lạp không tự nêu một hệ thống thần học hay phạm vi áp dụng cụ thể; bản dịch vì thế bảo toàn sức căng và để ngữ cảnh hướng dẫn việc giải thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tôi nói với anh em” tránh lối xưng hô quá cổ như “Ta… các ngươi”; cấu trúc “ai… mình” giữ tính khái quát tự nhiên trong tiếng Việt.
