id: LUK.19.31
reference: Luke 19:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: vi
  text: 'Nếu có ai hỏi anh em: “Tại sao các anh cởi nó ra?” thì hãy nói thế này: “Chúa[a] cần đến nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Chủ cần đến nó.”'
    reason: Từ Hy Lạp κύριος có thể mang nghĩa “Chúa” hoặc “chủ” trong ngữ cảnh này.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: hỏi
  rationale: Đây là động từ thông dụng chỉ việc đặt câu hỏi; “hỏi” tự nhiên và đúng với lời thoại trực tiếp.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách diễn đạt nghi vấn tự nhiên trong tiếng Việt, tương ứng trực tiếp với ý hỏi lý do.
- source_word: λύετε
  choice: cởi nó ra
  rationale: Trong ngữ cảnh con lừa con đang bị buộc, động từ chỉ việc tháo dây buộc. Đại từ “nó” làm rõ tân ngữ vốn được lược trong tiếng Hy Lạp.
- source_word: οὕτως ἐρεῖτε
  choice: thì hãy nói thế này
  rationale: Thì tương lai mang sắc thái chỉ thị; “hãy nói” truyền đạt lực mệnh lệnh tự nhiên hơn trong tiếng Việt, còn “thế này” dẫn vào nội dung câu trả lời.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ danh xưng thường dùng cho κύριος và sắc thái thần học có thể có khi từ này chỉ về Đức Giê-su, đồng thời ghi chú nghĩa khả dĩ là “chủ”.
- source_word: αὐτοῦ
  choice: nó
  rationale: Đại từ sở hữu cách giống đực/trung trong cấu trúc này tự nhiên nhất là chỉ con lừa con đang được cởi; tiếng Việt diễn đạt thành tân ngữ của “cần đến”.
- source_word: χρείαν ἔχει
  choice: cần đến
  rationale: Diễn đạt tự nhiên thành ngữ “có nhu cầu về/cần” trong tiếng Hy Lạp, đồng thời giữ giọng trang trọng vừa phải.
theological_decisions:
- issue: Nghĩa và đối tượng quy chiếu của Ὁ κύριος
  choice: “Chúa,” được hiểu là Đức Giê-su nhưng không thêm tên Ngài vào câu
  alternative: “chủ,” theo nghĩa người chủ hoặc người có quyền
  rationale: Trong văn mạch Lu-ca, κύριος thường được dùng cho Đức Giê-su và có thể mang âm hưởng thần học. Tuy vậy, nghĩa thông thường “chủ” vẫn khả dĩ trong tình huống này, nên được bảo lưu trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” trong lời Đức Giê-su nói với các môn đồ và “các anh” trong câu hỏi giả định của người ngoài; cách xưng hô này tự nhiên trong bối cảnh có nhiều người nghe mà không làm câu quá khẩu ngữ.
