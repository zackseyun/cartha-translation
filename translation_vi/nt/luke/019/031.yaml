  terminology: “Chúa” bảo lưu cách dùng κύριος như danh xưng dành cho Đức Giê-su trong Lu-ca, không ép buộc một diễn giải loại trừ. Chú thích “Chủ” bảo tồn cách hiểu thay thế thực tế của κύριος và được đặt đúng neo sau “Chúa.”
