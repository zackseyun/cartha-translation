  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc và nội dung Hy Lạp: điều kiện “nếu có ai hỏi”, câu hỏi về việc tháo/cởi con vật, chỉ thị về câu đáp, và mệnh đề “Chúa cần đến nó.” Đại từ “nó” diễn giải phù hợp αὐτοῦ theo con lừa con trong văn mạch.'
