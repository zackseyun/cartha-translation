  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: vi
  text: 'Khi Đức Giê-su đến chỗ ấy, Ngài nhìn lên và nói với ông: “Xa-chê, hãy mau xuống đi, vì hôm nay tôi phải ở lại nhà ông.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “phải” có thể hàm ý một sự tất yếu gắn với sứ mạng của Đức Giê-su hoặc mục đích của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: khi
  rationale: Trong mạch kể chuyện, từ này mở đầu một mệnh đề chỉ thời gian; “khi” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἐπὶ τὸν τόπον
  choice: đến chỗ ấy
  rationale: Diễn đạt địa điểm cụ thể nơi Xa-chê đang ở, đồng thời giữ lời văn tiếng Việt tự nhiên.
- source_word: ἀναβλέψας
  choice: Ngài nhìn lên
  rationale: Hướng nhìn lên phía Xa-chê ở trên cây được thể hiện rõ, không cần diễn giải thêm.
- source_word: Ζακχαῖε
  choice: Xa-chê
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: σπεύσας κατάβηθι
  choice: hãy mau xuống đi
  rationale: Kết cấu phân từ kèm mệnh lệnh mang ý khẩn trương; cách diễn đạt này tự nhiên trong tiếng Việt và giữ lực của mệnh lệnh.
- source_word: σήμερον γὰρ
  choice: vì hôm nay
  rationale: “Vì” giữ quan hệ nguyên nhân do γάρ biểu thị, còn “hôm nay” được đặt ở vị trí tự nhiên.
- source_word: ἐν τῷ οἴκῳ σου
  choice: ở lại nhà ông
  rationale: οἶκος ở đây chỉ nơi cư ngụ của Xa-chê; “nhà ông” phù hợp với ngữ cảnh ghé thăm và lưu lại.
- source_word: δεῖ με μεῖναι
  choice: tôi phải ở lại
  rationale: “Phải” giữ sắc thái tất yếu mạnh của δεῖ, còn “ở lại” diễn đạt tự nhiên động từ μένω mà không giới hạn là chỉ dùng bữa hay ngủ trọ.
theological_decisions:
- issue: Sắc thái của δεῖ trong thần học tường thuật Lu-ca
  choice: tôi phải ở lại
  alternative: tôi cần ở lại; nhất thiết tôi phải ở lại
  rationale: Cách dịch giữ nguyên ý tất yếu, có thể liên quan đến sứ mạng hoặc mục đích của Đức Chúa Trời, nhưng không giải quyết dứt khoát sắc thái ấy ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính; đại từ “Ngài” dành cho Đức Giê-su và “ông” dành cho Xa-chê. Giữ câu nói trực tiếp súc tích và khẩn trương.
