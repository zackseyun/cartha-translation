  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và nội dung Hy Lạp: mệnh đề thời gian, việc Đức Giê-su nhìn lên, lời gọi trực tiếp Xa-chê, mệnh lệnh khẩn trương, lý do “vì hôm nay”, và sắc thái tất yếu của δεῖ trong “tôi phải”. “Ở lại nhà ông” diễn đạt tự nhiên ἐν τῷ οἴκῳ σου ... μεῖναι mà không thu hẹp nghĩa thành chỉ dùng bữa hoặc ngủ trọ.'
  naturalness: Câu văn hiện đại, mạch lạc và phù hợp văn cảnh tường thuật. Cặp xưng hô “Ngài/ông” trong lời kể và “tôi/ông” trong lời trực tiếp rõ ràng, tôn trọng, không gượng ép. “Hãy mau xuống đi” giữ được tính cấp bách của σπεύσας κατάβηθι.
  terminology: “Đức Giê-su” và “Xa-chê” nhất quán với lối phiên âm Kinh Thánh tiếng Việt quen dùng. “Phải” là lựa chọn tốt cho δεῖ, không áp đặt một cách giải thích thần học cụ thể. Chú thích diễn đạt thận trọng khả năng sắc thái sứ mạng hay mục đích của Đức Chúa Trời.
