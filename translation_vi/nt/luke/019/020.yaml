  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: vi
  text: 'Một người khác đến và nói: “Thưa chủ, đây là mina của ngài; tôi vẫn cất giữ nó trong một chiếc khăn[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “khăn tay.” Từ Hy Lạp σουδάριον chỉ một mảnh khăn, thường dùng để lau mặt hoặc lau mồ hôi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: một người khác
  rationale: Trong mạch truyện, cụm từ chỉ một đầy tớ khác sau những người đã được nhắc đến; cách dịch này tự nhiên trong tiếng Việt và không thêm ý rằng đây nhất thiết là người cuối cùng.
- source_word: ἦλθεν λέγων
  choice: đến và nói
  rationale: Chuyển cấu trúc động từ kèm phân từ sang cách kể tự nhiên trong tiếng Việt, đồng thời giữ nguyên trình tự người ấy đến rồi lên tiếng.
- source_word: Κύριε
  choice: Thưa chủ
  rationale: Đây là lời một đầy tớ thưa với chủ trong dụ ngôn. “Thưa chủ” giữ quan hệ chủ–tớ của ngữ cảnh và sắc thái kính trọng, mà không biến lời xưng hô thành một tuyên xưng thần học rõ hơn nguyên văn.
- source_word: ἰδοὺ
  choice: xem này, … đây
  rationale: Hai yếu tố “xem này” và “đây” cùng truyền đạt chức năng thu hút sự chú ý và đưa đồng mina ra trình trước mặt chủ.
- source_word: ἡ μνᾶ σου
  choice: mina của ngài
  rationale: Giữ tên đơn vị tiền cổ bằng phiên âm “mina”, tránh thay bằng một đơn vị tiền hiện đại dễ gây hiểu lầm; “của ngài” thể hiện sở hữu và giữ giọng kính trọng.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: tôi đã cất nó
  rationale: Diễn đạt tự nhiên trạng thái đồng tiền được giữ riêng, cất đi. “Đã cất” gọn nhưng vẫn phù hợp với ý kéo dài của εἶχον kết hợp với phân từ ἀποκειμένην trong ngữ cảnh.
- source_word: ἐν σουδαρίῳ
  choice: trong một chiếc khăn
  rationale: σουδάριον chỉ một mảnh khăn, thường dùng để lau mặt hoặc lau mồ hôi. “Chiếc khăn” giữ mức độ khái quát của từ trong ngữ cảnh; nghĩa cụ thể hơn được nêu ở chú thích.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô bên trong dụ ngôn
  choice: Thưa chủ
  alternative: Lạy Chúa; thưa ngài
  rationale: Nhân vật đang thưa với người chủ đã giao tiền cho mình. “Thưa chủ” phản ánh trực tiếp quan hệ trong câu chuyện và vẫn giữ sự tôn kính; “Lạy Chúa” dễ khiến độc giả tiếng Việt hiểu đây là lời trực tiếp gọi Đức Chúa Trời hoặc Chúa Giê-su, còn “thưa ngài” không thể hiện rõ quan hệ chủ–tớ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Lời thoại dùng “thưa chủ” và “ngài” để giữ quan hệ chủ–tớ cùng sắc thái kính trọng. Dấu chấm được đặt trong ngoặc kép, còn ký hiệu chú thích gắn ngay sau từ được chú giải.
