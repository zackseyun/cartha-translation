- from: 'Một người khác đến và nói: “Thưa chủ, xem này, mina của ngài đây; tôi đã cất nó trong một chiếc khăn[a].”'
  to: 'Một người khác đến và nói: “Thưa chủ, đây là mina của ngài; tôi vẫn cất giữ nó trong một chiếc khăn[a].”'
