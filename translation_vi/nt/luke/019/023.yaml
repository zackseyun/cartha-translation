id: LUK.19.23
reference: Luke 19:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: vi
  text: Vậy tại sao anh không gửi tiền của ta vào ngân hàng[a]? Khi trở về, ta đã có thể thu lại số tiền ấy cùng với tiền lãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “gửi tiền của ta cho người làm nghề ngân hàng”; sát nguyên văn là “đặt tiền của ta trên một chiếc bàn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: tại sao
  rationale: Cách hỏi lý do tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái quở trách của lời nói.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: gửi ... vào ngân hàng
  rationale: Cụm từ nguyên văn nói đến việc đặt hoặc giao tiền tại một chiếc bàn; trong bối cảnh tài chính, τράπεζα chỉ bàn giao dịch của người làm nghề ngân hàng và theo nghĩa mở rộng là nơi nhận tiền gửi. Cách dịch này truyền đạt rõ hành động kinh tế được nói đến.
- source_word: μου τὸ ἀργύριον
  choice: tiền của ta
  rationale: ἀργύριον có nghĩa gốc là bạc nhưng trong văn cảnh này chỉ tiền; dịch là “tiền” tự nhiên và tránh khiến độc giả tưởng rằng chất liệu bạc là điểm nhấn.
- source_word: κἀγὼ ἐλθὼν
  choice: Khi trở về, ta
  rationale: Chuyển phân từ chỉ thời gian thành mệnh đề tự nhiên trong tiếng Việt. “Trở về” phù hợp với tình huống nhân vật quay lại sau thời gian vắng mặt.
- source_word: σὺν τόκῳ
  choice: cùng với tiền lãi
  rationale: τόκος ở đây là khoản lãi phát sinh từ tiền gửi; “tiền lãi” là thuật ngữ tài chính rõ ràng, hiện đại và trung tính.
- source_word: αὐτὸ ἔπραξα
  choice: đã có thể thu lại số tiền ấy
  rationale: πράσσω tại đây mang nghĩa thương mại là thu hoặc đòi lại một khoản tiền. Cấu trúc “đã có thể” thể hiện tình huống phản thực được biểu đạt bởi ἄν với động từ quá khứ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ta—anh” giữ quan hệ quyền bính giữa người chủ và đầy tớ mà không dùng cách nói quá cổ. Dấu chân chú thích được đặt ngay sau “ngân hàng,” là từ ngữ cần giải thích.
