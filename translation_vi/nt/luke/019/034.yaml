  text: And they said[a], “The Lord has need of it.”
translation:
  language: vi
  text: 'Họ nói: “Chúa[a] cần nó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chủ cần nó,” nếu κύριος được hiểu là chủ của con lừa con thay vì là tước hiệu chỉ Đức Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ
  rationale: Mạo từ được dùng như danh từ, chỉ những người vừa được nhắc đến. Trong mạch kể tiếng Việt, không cần dịch riêng liên từ nhẹ δέ; thêm “và” hoặc “nhưng” sẽ khiến quan hệ nối kết hay tương phản nổi bật hơn nguyên văn.
- source_word: εἶπαν
  choice: nói
  rationale: Động từ aorist của λέγω đơn giản có nghĩa là “nói”; ngữ cảnh cho thấy đây là lời đáp, nhưng dịch “trả lời” sẽ diễn giải rõ hơn từ ngữ Hy Lạp.
- source_word: ὅτι
  choice: thể hiện bằng dấu hai chấm và dấu ngoặc kép
  rationale: ὅτι dẫn lời nói trực tiếp; quy ước dấu câu tiếng Việt truyền đạt chức năng này tự nhiên hơn việc dịch thành một từ riêng.
- source_word: Ὁ κύριος
  choice: Chúa
  rationale: κύριος có thể là tước hiệu “Chúa” chỉ Đức Giê-su, hoặc có nghĩa “chủ”. Văn cảnh Lu-ca nghiêng về Đức Giê-su, nên bản văn chính dùng “Chúa”, còn nghĩa khả dĩ kia được giữ trong chú thích.
- source_word: αὐτοῦ
  choice: nó
  rationale: Đại từ sở hữu cách chỉ con lừa con vừa được nhắc đến. Cấu trúc tiếng Việt “cần nó” truyền đạt tự nhiên ý của cụm Hy Lạp mà không gọi đích danh con vật quá mức nguyên văn.
- source_word: χρείαν ἔχει
  choice: cần
  rationale: Thành ngữ Hy Lạp theo sát mặt chữ là “có nhu cầu”; tiếng Việt tự nhiên diễn đạt bằng động từ “cần”, vẫn giữ trọn nội dung.
theological_decisions:
- issue: Đối tượng được κύριος chỉ đến trong lời đáp của các môn đồ
  choice: Dịch là “Chúa”, theo văn cảnh chỉ Đức Giê-su.
  alternative: “Chủ”, có thể hiểu là chủ của con lừa con.
  rationale: Lu-ca thường dùng κύριος cho Đức Giê-su, và đây là câu giải thích Đức Giê-su đã dặn trước. Tuy vậy, danh từ này thực sự cũng có nghĩa “chủ”, nên không loại bỏ khả năng ấy mà ghi trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Câu trực tiếp ngắn gọn tương ứng với cấu trúc nguyên văn; dấu chú thích đặt ngay sau động từ dẫn lời để báo hiệu phương án dịch liên quan đến nội dung lời nói.
