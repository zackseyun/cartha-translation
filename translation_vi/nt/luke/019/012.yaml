  - severity: low
    issue: Cụm “thuộc dòng dõi quý tộc” hơi nặng
    rationale: “Thuộc dòng quý tộc” là cách nói gọn và tự nhiên hơn, vẫn giữ ý xuất thân cao quý của εὐγενής.
