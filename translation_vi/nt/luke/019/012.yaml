  to: 'Vậy nên, Đức Chúa Giê-su nói: “Có một người thuộc dòng quý tộc đi đến một xứ xa để nhận vương quyền[a] cho mình và trở về.”'
  rationale: Bản sửa giữ nguyên ý nghĩa và tính đa nghĩa của βασιλείαν, đồng thời loại bỏ “rồi”, vốn thêm một dấu hiệu trình tự không được nêu rõ trong nguyên văn. Điều chỉnh liên từ mở đầu và cụm chỉ địa vị xã hội giúp bản dịch tự nhiên hơn trong tiếng Việt hiện đại mà vẫn trung thành với tiếng Hy Lạp.
