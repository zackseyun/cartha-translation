  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: vi
  text: 'Vậy nên, Đức Chúa Giê-su nói: “Có một người thuộc dòng quý tộc đi đến một xứ xa để nhận vương quyền[a] cho mình và trở về.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một vương quốc.” Từ Hy Lạp βασιλεία có thể chỉ vương quốc, quyền làm vua, hoặc quyền cai trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vì vậy
  rationale: Diễn tả sự tiếp nối có tính suy luận từ câu trước; cách nói này trang trọng, tự nhiên và không biến liên từ thành một dấu mốc thời gian đơn thuần.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: Có một người thuộc dòng dõi quý tộc
  rationale: Ἄνθρωπός τις giới thiệu một nhân vật không xác định trong dụ ngôn, còn εὐγενής chỉ người có xuất thân hoặc địa vị cao. Cụm này rõ nghĩa hơn từ “quý tộc” đứng riêng trong tiếng Việt hiện đại.
- source_word: ἐπορεύθη εἰς χώραν μακρὰν
  choice: đi đến một xứ xa
  rationale: Chuyển tải trực tiếp hành động đi tới một vùng đất xa; “xứ” phù hợp với bối cảnh chính trị cổ mà vẫn dễ hiểu.
- source_word: λαβεῖν ἑαυτῷ βασιλείαν
  choice: để nhận vương quyền cho mình
  rationale: Trong bối cảnh một người quý tộc đi xa rồi trở về, βασιλείαν nhiều khả năng nói đến địa vị hoặc quyền cai trị được trao. “Nhận vương quyền” tự nhiên trong tiếng Việt và giữ được sắc thái chính trị của câu.
- source_word: καὶ ὑποστρέψαι
  choice: rồi trở về
  rationale: Hai động từ nguyên mẫu phối hợp diễn tả mục đích gồm việc nhận quyền cai trị và trở về; “rồi” biểu đạt trình tự vốn hàm chứa trong sự việc mà không thêm một mệnh đề mới.
theological_decisions:
- issue: Sắc thái của βασιλείαν trong dụ ngôn mang hình ảnh chính trị
  choice: vương quyền
  alternative: một vương quốc
  rationale: βασιλεία có thể chỉ lãnh thổ của vương quốc hoặc quyền làm vua. Bối cảnh người quý tộc đi xa để được ban quyền rồi trở về nghiêng về “vương quyền”; chú thích giữ lại nghĩa khả dĩ “vương quốc” để không xóa bỏ tính đa nghĩa của nguyên văn.
- issue: Chủ thể ngầm của εἶπεν
  choice: Đức Chúa Giê-su nói
  alternative: Ngài nói
  rationale: Tiếng Hy Lạp chỉ có động từ ngôi thứ ba số ít với chủ thể được hiểu từ văn cảnh. Nêu rõ Đức Chúa Giê-su giúp câu đứng riêng dễ hiểu mà không thay đổi người nói trong mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thuộc dòng dõi quý tộc” để làm rõ địa vị xã hội; dùng “vương quyền” trong câu chính để phù hợp bối cảnh được trao quyền cai trị, đồng thời bảo tồn nghĩa “vương quốc” trong chú thích.
