  to: 'Rồi ông nói với những người đang đứng gần đó: “Hãy lấy mina khỏi người ấy và trao cho người có mười mina.”'
  rationale: Sửa “đồng mina” thành “mina” để không áp đặt nghĩa ‘đồng xu’ lên đơn vị μνᾶ, và đổi “người này” thành “người ấy” để bám sát đại từ αὐτοῦ hơn. Các yếu tố còn lại của bản dịch giữ đúng nghĩa, trật tự mệnh lệnh và văn phong hiện đại.
