  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: vi
  text: 'Rồi ông nói với những người đang đứng gần đó: “Hãy lấy mina khỏi người ấy và trao cho người có mười mina.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: những người đang đứng gần đó
  rationale: Phân từ hoàn thành chủ động được dùng như danh từ, chỉ những người đang hiện diện bên cạnh; cách dịch này giữ được hình ảnh cụ thể của bối cảnh và tự nhiên trong tiếng Việt.
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: Hãy lấy ... khỏi người này
  rationale: αἴρω trong mệnh lệnh này mang nghĩa lấy đi, còn ἀπό diễn tả sự tách khỏi. “Người này” làm rõ đối tượng đang được chỉ đến mà không thêm thông tin ngoài văn bản.
- source_word: τὴν μνᾶν
  choice: đồng mina
  rationale: μνᾶ là một đơn vị tiền tệ cổ. Giữ tên đơn vị là “mina” bảo toàn bối cảnh lịch sử; danh từ loại “đồng” giúp cách nói tự nhiên và dễ hiểu hơn trong tiếng Việt.
- source_word: δότε
  choice: trao
  rationale: Mệnh lệnh của δίδωμι chỉ việc chuyển vật cho người khác. “Trao” phù hợp với hành động giao đồng tiền trong ngữ cảnh.
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: cho người có mười đồng mina
  rationale: Phân từ có mạo từ được dùng như danh từ số ít. “Người” không xác định giới tính ngoài điều văn bản nói, còn “mười đồng mina” nhận diện số tiền đã được nhắc đến.
theological_decisions:
- issue: Cách dịch đơn vị tiền tệ μνᾶ
  choice: mina
  alternative: nén bạc
  rationale: “Mina” giữ nguyên đơn vị tiền tệ cổ của văn bản Hy Lạp và tránh khiến độc giả hiểu “nén bạc” là một khối lượng bạc không xác định hoặc một giá trị hiện đại. Chú thích vẫn nêu cách dịch truyền thống.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Mệnh lệnh dùng “hãy”; “đứng gần đó” giữ nét cụ thể của παρεστῶσιν. Dùng nhất quán “đồng mina” để độc giả nhận ra đây là đơn vị tiền tệ.
