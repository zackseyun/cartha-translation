  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: vi
  text: Ông vội vàng đi xuống và vui mừng đón tiếp Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đón tiếp” cũng có thể dịch là “tiếp nhận”, với hàm ý tiếp đãi một vị khách.
    reason: Nêu phương án từ vựng cho ὑπεδέξατο, vốn có thể mang nghĩa tiếp nhận/chào đón với sắc thái hiếu khách.
lexical_decisions:
- source_word: σπεύσας
  choice: vội vàng
  rationale: Phân từ bất định diễn tả hành động mau chóng, khẩn trương; “vội vàng” là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: κατέβη
  choice: trèo xuống
  rationale: Trong ngữ cảnh Xa-chê đang ở trên cây (c. 4–5), động từ chỉ việc đi xuống được diễn đạt tự nhiên là “trèo xuống”; ý hướng xuống vẫn được giữ rõ.
- source_word: ὑπεδέξατο
  choice: đón tiếp
  rationale: Động từ ở thể trung gian mang nghĩa tiếp nhận hoặc chào đón, thường hàm ý hiếu khách; “đón tiếp” phù hợp với việc tiếp Chúa Giê-su vào nhà.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su. Viết “Ngài” theo lối văn kính trọng phổ biến trong tiếng Việt, nhưng không thêm danh xưng không có trong nguyên văn.
- source_word: χαίρων
  choice: vui mừng
  rationale: Phân từ hiện tại diễn tả trạng thái vui mừng đi kèm hành động đón tiếp; cách diễn đạt này giữ được sắc thái của χαίρω mà vẫn tự nhiên.
- source_word: καὶ ... καὶ
  choice: và ... và
  rationale: Giữ quan hệ nối tiếp đơn giản giữa các hành động trong lối kể chuyện của Lu-ca.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Trèo xuống” dựa vào ngữ cảnh gần, còn chú thích cung cấp cách dịch sát hình thức hơn. Đại từ “Ông” chỉ Xa-chê và “Ngài” chỉ Chúa Giê-su giúp câu rõ nghĩa trong tiếng Việt.
