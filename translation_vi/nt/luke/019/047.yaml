  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu Hy Lạp: hoạt động giảng dạy thường xuyên hằng ngày, phạm vi ἱερόν là toàn khu đền thờ, và ý định đang được theo đuổi của các thượng tế, kinh sư cùng giới nhân vật nổi bật trong dân. “Tìm cách tiêu diệt Ngài” bảo toàn mức độ rộng của ἀπολέσαι mà không áp đặt một cách diễn giải hẹp hơn.'
  naturalness: Câu văn tự nhiên, hiện đại và có sắc thái trang trọng phù hợp. “Khuôn viên đền thờ,” “các kinh sư,” và “những nhân vật hàng đầu trong dân” đều rõ nghĩa trong tiếng Việt hiện đại. “Hằng ngày” trong kết cấu trần thuật tiếng Việt diễn đạt thỏa đáng tính lặp lại của thì chưa hoàn thành.
  terminology: “Thượng tế” phù hợp cho οἱ ἀρχιερεῖς; “kinh sư” là cách gọi trực tiếp, dễ hiểu cho οἱ γραμματεῖς. Cách dùng “Ngài” nhất quán với thanh điệu tôn kính của bản dịch. Chú thích a giải thích đúng giá trị thành ngữ-xã hội của οἱ πρῶτοι τοῦ λαοῦ và không biến cụm từ này thành một chức danh cố định.
