  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: vi
  text: Hằng ngày, Ngài giảng dạy trong khuôn viên đền thờ. Nhưng các thượng tế, các kinh sư và những nhân vật hàng đầu trong dân[a] tìm cách tiêu diệt Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “những người đứng đầu trong dân”, tức những người nổi bật hoặc có thế lực trong dân chúng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: Ngài giảng dạy
  rationale: Kết cấu quá khứ tiếp diễn diễn tả hoạt động được duy trì hoặc lặp lại; kết hợp với “Hằng ngày” trong tiếng Việt đã truyền đạt rõ sắc thái này mà không cần một kết cấu nặng nề.
- source_word: τὸ καθ’ ἡμέραν
  choice: Hằng ngày
  rationale: Diễn đạt tự nhiên ý nghĩa phân bố theo từng ngày và phù hợp với văn phong tiếng Việt hiện đại.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “khuôn viên đền thờ” làm rõ phạm vi mà vẫn ngắn gọn.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Cách gọi quen thuộc và chính xác cho giới lãnh đạo tư tế, thay vì hiểu là nhiều người cùng giữ chức thầy tế lễ thượng phẩm.
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: Thuật ngữ tiếng Việt thông dụng cho những người chuyên chép, nghiên cứu và giải thích Kinh Luật; ít gây liên tưởng đến người thư ký hơn “các thầy thông giáo” trong tiếng Việt hiện đại.
- source_word: ἐζήτουν
  choice: tìm cách
  rationale: Thì chưa hoàn thành diễn tả nỗ lực đang tiếp diễn; “tìm cách” tự nhiên trong ngữ cảnh mưu toan thực hiện hành động.
- source_word: ἀπολέσαι
  choice: tiêu diệt
  rationale: Giữ được phạm vi nghĩa của ἀπόλλυμι là hủy diệt hoặc làm cho chết, không thu hẹp hoàn toàn thành “giết” dù ý định sát hại được ngữ cảnh hàm chứa.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: những nhân vật hàng đầu trong dân
  rationale: πρῶτοι theo nghĩa đen là “những người đứng đầu”, ở đây chỉ các nhân vật nổi bật hoặc có thế lực trong dân chúng. “Những nhân vật hàng đầu” tự nhiên và không tự ý xác định một chức vụ chính thức.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἀπολέσαι
  choice: tiêu diệt Ngài
  alternative: giết Ngài
  rationale: Ngữ cảnh cho thấy ý định gây chết người, nhưng từ Hy Lạp có nghĩa rộng hơn “giết”. Bản dịch giữ sự căng thẳng ấy thay vì thu hẹp cách diễn đạt.
- issue: Giới tính trong οἱ πρῶτοι τοῦ λαοῦ
  choice: những nhân vật hàng đầu trong dân
  alternative: những người đàn ông đứng đầu trong dân
  rationale: Hình thái giống đực số nhiều phù hợp với nhóm nhân vật có thế lực trong bối cảnh lịch sử, nhưng bản thân cụm từ nhấn mạnh địa vị nổi bật chứ không dùng danh từ ἀνήρ (“người đàn ông”). Tiếng Việt không bắt buộc đánh dấu giống, nên không thêm chi tiết vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo lối xưng hô tôn kính quen thuộc; câu đầu lược chủ danh riêng vì văn mạch đã xác định nhân vật. “Khuôn viên đền thờ” phân biệt ἱερόν với nơi thánh bên trong.
