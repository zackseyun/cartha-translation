  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: vi
  text: 'Nhưng dân trong xứ của ông ghét ông và sai một phái đoàn đi theo sau ông, nói rằng: “Chúng tôi không muốn người này làm vua cai trị chúng tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολῖται
  choice: dân trong xứ của ông
  rationale: Giữ ý những người thuộc cộng đồng chính trị của nhân vật mà không gọi họ là “thần dân”, vì cách gọi ấy sẽ mặc nhiên thừa nhận vương quyền mà họ đang bác bỏ. Trong tiếng Việt, “công dân của ông” thiếu tự nhiên.
- source_word: ἐμίσουν
  choice: ghét
  rationale: Diễn đạt tự nhiên trạng thái thù ghét kéo dài hoặc có tính đặc trưng của thì chưa hoàn thành, không cường điệu thành “căm ghét”.
- source_word: ἀπέστειλαν
  choice: sai
  rationale: Động từ trần thuật chỉ việc cử người đi; “sai một phái đoàn” tự nhiên và phù hợp với bối cảnh có thẩm quyền đại diện.
- source_word: πρεσβείαν
  choice: một phái đoàn
  rationale: Chỉ một nhóm đại diện được cử đi làm nhiệm vụ chính thức; “phái đoàn” là cách nói hiện đại, rõ nghĩa.
- source_word: ὀπίσω αὐτοῦ
  choice: đi theo sau ông
  rationale: Giữ hình ảnh không gian của nguyên văn và trong ngữ cảnh cho biết phái đoàn được cử đi sau khi ông đã lên đường.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Giới thiệu trực tiếp nội dung thông điệp của phái đoàn, sát cấu trúc nguyên văn và tự nhiên trong tiếng Việt.
- source_word: Οὐ θέλομεν
  choice: Chúng tôi không muốn
  rationale: Truyền đạt trực tiếp ý chí khước từ bằng cách nói hiện đại, phổ thông.
- source_word: τοῦτον
  choice: người này
  rationale: Bảo toàn sắc thái xa cách, hơi coi thường của đại từ chỉ định mà không thêm mức độ miệt thị không có trong nguyên văn.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: làm vua cai trị chúng tôi
  rationale: Giữ rõ nét nghĩa vương quyền của βασιλεύω. “Cai trị” diễn đạt quan hệ ἐφ’ ἡμᾶς, còn “làm vua” tránh làm phẳng thành quyền cai quản nói chung.
theological_decisions:
- issue: Sắc thái chính trị và vương quyền trong dụ ngôn
  choice: làm vua cai trị chúng tôi
  alternative: cai trị chúng tôi
  rationale: Nguyên văn dùng động từ βασιλεύω, nên cần giữ ý làm vua thay vì chuyển thành thẩm quyền chung chung. Cách dịch không áp đặt kết luận biểu tượng hoặc thần học vượt quá lời của dụ ngôn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo mạch kể về nhân vật nam; lời nói trực tiếp giữ sắc thái dứt khoát và xa cách của “người này”.
