id: LUK.19.27
reference: Luke 19:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: vi
  text: Nhưng còn những kẻ thù này của ta—những kẻ không muốn ta cai trị chúng[a]—hãy đem chúng đến đây và tàn sát chúng[b] trước mặt ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không muốn ta làm vua cai trị chúng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “giết chết chúng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng còn
  rationale: Cụm này vừa đánh dấu sự chuyển ý mạnh, vừa đưa nhóm người cuối cùng ra làm chủ đề trong lời của nhà quý tộc.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: những kẻ thù này của ta
  rationale: Giữ được nghĩa thông dụng của ἐχθρούς, đồng thời bảo toàn sắc thái xác định và nhấn mạnh của τούτους.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: những kẻ không muốn ta cai trị chúng
  rationale: Chuyển cụm phân từ có mạo từ thành mệnh đề quan hệ tự nhiên trong tiếng Việt; “cai trị” giữ được ý nghĩa hành động làm vua của βασιλεῦσαι mà không biến nó thành một danh xưng.
- source_word: ἀγάγετε ὧδε
  choice: hãy đem chúng đến đây
  rationale: “Đem ... đến đây” là cách diễn đạt tự nhiên cho mệnh lệnh đưa người đến chỗ người nói; tránh thêm sắc thái tù nhân vốn không được nói rõ trong động từ.
- source_word: κατασφάξατε
  choice: tàn sát
  rationale: Động từ này mạnh và dữ dội hơn từ chung chỉ việc giết; “tàn sát” bảo toàn sức nặng gây sốc của nguyên văn mà không thêm ý nghĩa xét xử pháp lý.
- source_word: ἔμπροσθέν μου
  choice: ngay trước mặt ta
  rationale: Diễn đạt rõ sự hiện diện và vị trí trước người nói; “ngay” làm nổi bật tính trực diện phù hợp với ngữ cảnh.
theological_decisions:
- issue: Quan hệ giữa lời của nhân vật nhà quý tộc trong dụ ngôn và lời dạy của Chúa Giê-su
  choice: Dịch trực tiếp mệnh lệnh của nhà quý tộc, không giảm nhẹ bạo lực và cũng không thêm lời đồng nhất mệnh lệnh ấy với một mệnh lệnh trực tiếp của Chúa Giê-su ngoài dụ ngôn.
  alternative: Thêm cách diễn đạt nhằm tách xa lời này như chỉ là hình ảnh dụ ngôn, hoặc chú giải ngay trong câu rằng đây là phán quyết của Chúa Giê-su.
  rationale: Nguyên văn trình bày đây là lời của nhà quý tộc trong mạch kể của dụ ngôn. Bản dịch cần giữ nguyên sức căng thần học và không giải quyết thay người đọc bằng phần diễn giải được thêm vào.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ta/chúng” phù hợp lời của một nhà vua hoặc nhà quý tộc trong bối cảnh dụ ngôn. Dấu gạch ngang làm rõ cụm giải thích cho “những kẻ thù này” mà không làm yếu nhịp mệnh lệnh.
