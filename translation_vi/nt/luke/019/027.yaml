  terminology: “Cai trị” là cách dịch phù hợp cho βασιλεῦσαι trong ngữ cảnh này; chú thích “làm vua cai trị” cung cấp phương án hợp lệ. “Tàn sát” bảo toàn tính mạnh, bạo liệt của κατασφάξατε mà không áp đặt sắc thái pháp lý như “hành quyết.”
