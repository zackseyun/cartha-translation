  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: vi
  text: Khi Đức Giê-su đến gần Bết-pha-giê và Bê-tha-ni, về phía ngọn núi được gọi là Ô-liu[a], Ngài sai hai trong số các môn đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách gọi quen thuộc hơn: “núi Ô-liu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Khi
  rationale: Công thức tường thuật của Lu-ca được chuyển sang cấu trúc thời gian tự nhiên trong tiếng Việt; ý diễn tiến của ὡς được giữ mà không dùng lối dịch cổ hoặc nặng nề như “và xảy ra rằng”.
- source_word: ἤγγισεν
  choice: đến gần
  rationale: Diễn đạt trực tiếp hành động tiến đến gần một địa điểm, tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: đến gần Bết-pha-giê và Bê-tha-ni
  rationale: Dù εἰς thường chỉ hướng đến, với động từ ἐγγίζω, tiếng Việt tự nhiên dùng “đến gần” trước các địa danh; cách dịch không khẳng định rằng Ngài đã vào cả hai nơi.
- source_word: πρὸς τὸ ὄρος
  choice: về phía ngọn núi
  rationale: Giữ sắc thái phương hướng của πρός và dùng “ngọn núi” là cách nói hiện đại, dễ hiểu.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: gọi là Ô-liu
  rationale: Giữ cách gọi cô đọng của tiếng Hy Lạp, trong đó Ἐλαιῶν là dạng số nhiều sở hữu của “ô-liu”; chú thích cung cấp cách gọi quen thuộc và rõ nghĩa hơn.
- source_word: ἀπέστειλεν
  choice: Ngài sai ... đi
  rationale: “Sai ... đi” là cách diễn đạt tự nhiên cho hành động phái người thực hiện một nhiệm vụ; đại từ tôn kính phù hợp văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: δύο τῶν μαθητῶν
  choice: hai môn đồ
  rationale: Tiếng Việt không cần biểu thị cấu trúc bộ phận bằng “hai trong số các môn đồ” khi ngữ cảnh đã rõ; không thêm từ sở hữu “của Ngài” vốn không có trong câu Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Lược chuyển công thức kể chuyện Καὶ ἐγένετο sang mệnh đề thời gian tự nhiên, đồng thời giữ địa danh, hướng chuyển động và cách gọi cô đọng của nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
