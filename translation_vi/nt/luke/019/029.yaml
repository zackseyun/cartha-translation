revisions:
- from: Khi Đức Giê-su đến gần Bết-pha-giê và Bê-tha-ni, về phía ngọn núi gọi là Ô-liu[a], Ngài sai hai môn đồ đi.
  to: Khi Đức Giê-su đến gần Bết-pha-giê và Bê-tha-ni, về phía ngọn núi được gọi là Ô-liu[a], Ngài sai hai trong số các môn đồ.
  rationale: Bản sửa giữ cấu trúc thời gian tự nhiên của tiếng Việt cho công thức Lu-ca, bảo toàn quan hệ phương hướng của πρὸς, diễn đạt tự nhiên hơn mệnh đề “được gọi là”, và phản ánh rõ cấu trúc “hai trong số các môn đồ”. Từ “đi” được lược để không bổ sung nội dung bề mặt ngoài mệnh đề nguồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:32:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến chính: Đức Giê-su đến gần Bết-pha-giê và Bê-tha-ni, về phía ngọn núi mang tên Ô-liu, rồi sai hai môn đồ. Tuy nhiên, “sai ... đi” thêm động từ “đi” không hiện diện rõ trong mệnh đề Hy Lạp này; và “hai môn đồ” không phản ánh minh bạch sắc thái bộ phận của δύο τῶν μαθητῶν (“hai trong số các môn đồ”).'
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Đổi “gọi là” thành “được gọi là” làm cấu trúc quan hệ với “ngọn núi” tự nhiên hơn. “Khi” là cách chuyển an toàn, tự nhiên cho công thức trần thuật Καὶ ἐγένετο ὡς mà không tạo lối văn cổ.
  terminology: Các địa danh Bết-pha-giê, Bê-tha-ni và Ô-liu nhất quán, dễ nhận biết. “Môn đồ” và đại từ “Ngài” phù hợp văn phong Kinh Thánh trang trọng. Chú thích giữ đúng chức năng nêu cách gọi quen thuộc hơn của τὸ ὄρος ... Ἐλαιῶν và được neo đúng chỗ.
  issues:
  - severity: low
    issue: Cụm “sai hai môn đồ đi” có thêm “đi”.
    rationale: ἀπέστειλεν có nghĩa là “sai/phái đi”, nhưng câu nguồn tại đây chỉ nói “Ngài sai hai trong số các môn đồ”; bỏ “đi” tránh thêm một thành tố bề mặt không cần thiết, trong khi ý sai phái vẫn được giữ.
  - severity: low
    issue: “hai môn đồ” làm mờ cấu trúc δύο τῶν μαθητῶν.
    rationale: Cấu trúc genitive bộ phận có nghĩa “hai trong số các môn đồ”. Cách diễn đạt này phản ánh nguồn rõ hơn và không thêm sở hữu từ “của Ngài.”
  - severity: low
    issue: “ngọn núi gọi là” hơi thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: Dạng bị động “ngọn núi được gọi là” diễn đạt tự nhiên hơn động tính từ καλούμενον, không đổi nghĩa.
  revised_text: Khi Đức Giê-su đến gần Bết-pha-giê và Bê-tha-ni, về phía ngọn núi được gọi là Ô-liu[a], Ngài sai hai trong số các môn đồ.
