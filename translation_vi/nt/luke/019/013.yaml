id: LUK.19.13
reference: Luke 19:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: vi
  text: 'Rồi ông gọi mười nô lệ[a] của mình đến, trao cho họ mười mi-na[b] và bảo họ: “Hãy kinh doanh[c] cho đến khi ta trở về.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp doulos có thể được dịch là “nô lệ”, “đầy tớ” hoặc “tôi tớ”, tùy ngữ cảnh.
    reason: alternative_reading
  - marker: b
    text: Mi-na là một đơn vị tiền tệ thời cổ đại.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “Hãy buôn bán” hoặc “Hãy làm ăn”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: gọi ... đến
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng trình tự sự việc.
- source_word: δούλους
  choice: nô lệ
  rationale: Trong bối cảnh dụ ngôn về một chủ sở hữu những người thuộc quyền mình, từ này phản ánh rõ quan hệ sở hữu và thân phận xã hội hơn “đầy tớ”.
- source_word: ἑαυτοῦ
  choice: của mình
  rationale: Đại từ phản thân nhấn mạnh rằng họ là những nô lệ thuộc chính ông; “của mình” chuyển tải tự nhiên sắc thái ấy.
- source_word: μνᾶς
  choice: mi-na
  rationale: Phiên âm tên đơn vị tiền cổ, tránh đồng nhất sai với một đơn vị tiền tệ hiện đại.
- source_word: Πραγματεύσασθε
  choice: Hãy kinh doanh
  rationale: Mệnh lệnh chỉ việc dùng số tiền được giao vào hoạt động thương mại; “kinh doanh” đủ rộng để không giới hạn vào một phương thức cụ thể.
- source_word: ἐν ᾧ ἔρχομαι
  choice: cho đến khi ta trở về
  rationale: Đây là cách diễn đạt thời gian mang nghĩa làm việc cho đến lúc người nói đến lại; “trở về” tự nhiên trong ngữ cảnh người ấy sắp đi xa.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh dụ ngôn chủ–nô lệ
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Bối cảnh mô tả những người thuộc về một chủ và được giao tài sản của chủ. “Nô lệ” giữ được thực tại xã hội của quan hệ này mà không thêm một ý nghĩa thần học ngoài văn bản.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Đại từ “ông/họ” dùng trong lời kể, còn “ta” trong lời của nhân vật giữ sắc thái quyền uy phù hợp với quan hệ chủ–nô lệ.
