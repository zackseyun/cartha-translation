  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: vi
  text: 'Trong khi họ đang tháo dây cho con lừa con, các chủ của nó[a] nói với họ: “Tại sao các anh tháo dây cho con lừa con?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người sở hữu nó.” Từ Hy Lạp là dạng số nhiều của từ có nghĩa “chủ” (κύριος); ở đây chỉ những người có quyền đối với con lừa con.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων / λύετε
  choice: đang tháo dây / tháo dây
  rationale: Trong ngữ cảnh con vật đang bị buộc, “tháo dây” diễn đạt tự nhiên hành động cởi buộc và giữ được sự lặp lại của cùng một động từ Hy Lạp.
- source_word: δὲ
  choice: Trong khi
  rationale: δέ là từ nối nhẹ trong diễn tiến câu chuyện; cấu trúc “Trong khi... đang...” đồng thời chuyển tải quan hệ đồng thời của cụm phân từ sở hữu cách tuyệt đối.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ chỉ hai môn đồ trong văn cảnh trước; không cần giải thích thêm ngay trong câu.
- source_word: πῶλον
  choice: con lừa con
  rationale: πῶλος nói chung là con vật non, nhưng văn cảnh liền trước xác định đây là lừa; “con lừa con” rõ nghĩa và dễ hiểu trong tiếng Việt hiện đại.
- source_word: εἶπαν
  choice: nói
  rationale: Giữ nghĩa trực tiếp của λέγω; lời được nói mang hình thức câu hỏi.
- source_word: οἱ κύριοι αὐτοῦ
  choice: các chủ của nó
  rationale: κύριοι ở đây chỉ những người có quyền sở hữu hoặc quyền quản lý con vật, không phải tước hiệu thần học. “Các chủ của nó” cũng giữ được dạng số nhiều và phần nào bảo tồn độ rộng nghĩa của từ gốc.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt sau động từ “nói”.
- source_word: Τί
  choice: Tại sao
  rationale: Trong câu hỏi này, τί hỏi lý do hoặc mục đích của hành động; “Tại sao” truyền đạt đúng chức năng ngữ dụng.
theological_decisions:
- issue: Cách dịch κύριοι trong ngữ cảnh quyền sở hữu của con người
  choice: các chủ của nó
  alternative: những người sở hữu nó; các ông chủ của nó
  rationale: Không dùng “Chúa” vì ở đây không có tước hiệu thần học. “Các chủ của nó” vừa tự nhiên vừa giữ số nhiều và tránh xác định quá mức rằng đây chỉ là quyền sở hữu pháp lý.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các anh” trong lời hỏi để thể hiện ngôi thứ hai số nhiều mà không quá suồng sã. Dấu chân chú [a] được đặt ngay sau cụm từ liên quan.
