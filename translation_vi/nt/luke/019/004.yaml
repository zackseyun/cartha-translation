  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: vi
  text: Ông chạy lên phía trước, trèo lên một cây sung dâu[a] để thấy Ngài, vì Ngài sắp đi qua lối ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cây sung Ai Cập” (Ficus sycomorus).'
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν
  choice: chạy lên phía trước
  rationale: Diễn đạt cả hành động chạy lẫn ý vượt lên đằng trước; gộp cụm trạng hướng vào động từ để câu tiếng Việt tự nhiên.
- source_word: ἀνέβη ἐπὶ
  choice: trèo lên
  rationale: Trong ngữ cảnh một cái cây, cách nói này tự nhiên và thể hiện rõ chuyển động đi lên.
- source_word: συκομορέαν
  choice: một cây sung dâu
  rationale: Từ Hy Lạp chỉ Ficus sycomorus, một loài sung; “cây sung dâu” vừa dễ hiểu vừa phân biệt với cây sung thông thường, còn tên gọi khác được giữ trong chú thích.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: để có thể nhìn thấy Ngài
  rationale: Giữ rõ ý mục đích của ἵνα với động từ ở thức giả định; “có thể” phù hợp với trở ngại về tầm nhìn trong văn cảnh.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do ông trèo cây bằng liên từ thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐκείνης
  choice: lối ấy
  rationale: Đại từ giống cái số ít ở sở hữu cách có thể ngầm chỉ đường hoặc lối đi; “lối ấy” bảo toàn tính hàm ẩn mà không xác định quá mức là đường hay phố.
- source_word: ἤμελλεν διέρχεσθαι
  choice: sắp đi qua
  rationale: “Sắp” chuyển tải sắc thái tương lai gần của μέλλω, còn “đi qua” phản ánh διέρχομαι một cách tự nhiên.
theological_decisions:
- issue: Đại từ chỉ Chúa Giê-su (αὐτόν và chủ ngữ ngầm của ἤμελλεν)
  choice: viết hoa “Ngài”
  alternative: viết thường “ông ấy/người”
  rationale: Viết hoa giúp người đọc nhận rõ đối tượng là Chúa Giê-su theo quy ước kính ngữ tiếng Việt, nhưng không bổ sung danh xưng hay giải quyết một điểm thần học đang tranh luận.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho Xa-chê theo mạch văn, “Ngài” cho Chúa Giê-su, tránh lối dịch sát chữ thiếu tự nhiên. Dấu chú thích [a] được đặt ngay sau tên cây.
