  rationale: Sửa liên từ đầu câu để không gán quan hệ suy luận cho καί; rút gọn mệnh đề mục đích cho sát ἵνα ἴδῃ; và thay chú thích bằng lựa chọn tên gọi thực vật chính xác, gọn, không thêm thông tin gây nhiễu. Các yếu tố còn lại giữ nguyên nghĩa và mạch kể của nguyên văn.
