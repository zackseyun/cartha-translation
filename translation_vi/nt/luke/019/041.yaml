  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: vi
  text: Khi đến gần, Đức Chúa Jêsus nhìn thấy thành và khóc thương thành ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: Khi đến gần
  rationale: Động từ ἐγγίζω chỉ việc đến gần hoặc tiến lại gần. Cách dịch này tự nhiên trong tiếng Việt và không thêm đối tượng vốn được ngữ cảnh xác định.
- source_word: ἰδὼν
  choice: nhìn thấy
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra đồng thời hoặc ngay trước động từ chính; cách diễn đạt nối trực tiếp việc thấy thành với phản ứng khóc thương.
- source_word: τὴν πόλιν
  choice: thành
  rationale: πόλις có nghĩa là thành hoặc thành phố. Ngữ cảnh đã cho biết đây là Giê-ru-sa-lem, nên không cần bổ sung tên riêng.
- source_word: ἔκλαυσεν
  choice: khóc
  rationale: κλαίω chỉ việc khóc hoặc than khóc. Từ “khóc” giữ được sức nặng cảm xúc mà không thêm mức độ không được nêu rõ.
- source_word: ἐπ’ αὐτήν
  choice: thương thành ấy
  rationale: Sau κλαίω, ἐπί với đối cách biểu thị đối tượng mà người ta khóc vì hoặc khóc thương. Tiếng Việt tự nhiên dùng “khóc thương”; lặp lại “thành ấy” giúp quy chiếu rõ ràng và trang trọng.
theological_decisions:
- issue: Có nên thể hiện giống cái ngữ pháp của πόλις và αὐτήν như một sự nhân cách hóa Giê-ru-sa-lem hay không
  choice: Dùng “thành ấy”, không gán đại từ mang giới tính
  alternative: Dịch theo hướng nhân cách hóa là “khóc thương nàng”
  rationale: Giống cái của đại từ trước hết là sự hòa hợp ngữ pháp với πόλις. Tiếng Việt không có giống ngữ pháp tương ứng, còn “nàng” sẽ làm nổi bật sự nhân cách hóa hơn mức câu Hy Lạp nhất thiết đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Thêm chủ ngữ “Đức Chúa Jêsus” để câu tiếng Việt đứng độc lập rõ nghĩa; danh tính này được xác định chắc chắn từ ngữ cảnh. Dùng “thành” thay cho “thành phố” để giữ sắc thái Kinh Thánh tự nhiên.
