source:
  edition: SBLGNT
  text: Καὶ εἰσελθὼν διήρχετο τὴν Ἰεριχώ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/001.yaml
  text: And he entered and was passing through Jericho[a].
translation:
  language: vi
  text: Sau khi vào Giê-ri-cô, Đức Giê-su đang đi qua đó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Và sau khi vào Giê-ri-cô, Ngài đang đi qua đó.”'
    reason: Nêu cấu trúc sát nguyên văn, gồm liên từ Καὶ và phân từ εἰσελθών, đồng thời giữ sắc thái đang diễn tiến của διήρχετο.
lexical_decisions:
- source_word: Καὶ
  choice: Sau khi
  rationale: Liên từ Καὶ nối tiếp mạch kể; khi đi cùng phân từ εἰσελθών, tiếng Việt tự nhiên có thể biểu đạt quan hệ trước–sau bằng cụm “Sau khi” mà không cần dịch máy móc là “Và”.
- source_word: εἰσελθὼν
  choice: vào
  rationale: Phân từ chủ động bất định của εἰσέρχομαι diễn tả hành động xảy ra trước động từ chính; “Sau khi vào” giữ đúng trình tự và tự nhiên trong tiếng Việt.
- source_word: διήρχετο
  choice: đang đi qua
  rationale: Thể chưa hoàn thành diễn tả hành động đang diễn tiến; “đang đi qua” bảo toàn sắc thái này thay vì dùng dạng hoàn tất “đi qua”.
- source_word: τὴν Ἰεριχώ
  choice: thành Giê-ri-cô … thành ấy
  rationale: Ἰεριχώ là địa danh Giê-ri-cô. Thêm danh từ loại “thành” phù hợp cách dùng tiếng Việt và đại từ hồi chỉ “thành ấy” làm rõ nơi Đức Giê-su đang đi qua mà không đổi nghĩa.
theological_decisions:
- issue: Chủ ngữ ngầm của εἰσελθὼν và διήρχετο
  choice: Đức Giê-su
  alternative: Người / ông
  rationale: Tiếng Hy Lạp lược chủ ngữ vì đã rõ từ văn mạch trước; tiếng Việt cần nêu chủ ngữ. Dùng “Đức Giê-su” xác định đúng nhân vật và giữ văn phong tôn kính, không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Sau khi…” chuyển tải tự nhiên quan hệ thời gian của phân từ Hy Lạp; “đang đi qua” giữ thể chưa hoàn thành. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
