id: LUK.19.37
reference: Luke 19:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: vi
  text: Khi Ngài đã đến gần chỗ dốc xuống của Núi Ô-liu, toàn thể đoàn đông đảo các môn đồ bắt đầu vui mừng và lớn tiếng ca ngợi Đức Chúa Trời vì mọi việc quyền năng[a] mà họ đã thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phép lạ” hoặc “việc đầy quyền năng”; từ Hy Lạp nhấn mạnh những hành động bày tỏ quyền năng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Khi Ngài đã đến gần
  rationale: Diễn đạt mệnh đề phân từ sở hữu cách dùng làm bối cảnh thời gian, đồng thời giữ ý Ngài lúc ấy đã tiến đến gần địa điểm được nói tới.
- source_word: πρὸς τῇ καταβάσει
  choice: chỗ đường dốc xuống
  rationale: Chỉ khu vực nơi con đường bắt đầu hoặc đang đi xuống; cách dịch này tự nhiên trong tiếng Việt mà không xác định địa hình quá mức.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: núi Ô-liu
  rationale: Dùng tên địa danh quen thuộc trong tiếng Việt hiện đại.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: cả đoàn đông môn đồ
  rationale: Giữ ý toàn thể một nhóm rất đông, đồng thời xác định họ là các môn đồ chứ không phải đám đông dân chúng nói chung.
- source_word: ἤρξαντο ... χαίροντες αἰνεῖν τὸν θεὸν
  choice: bắt đầu vui mừng, ... ca ngợi Đức Chúa Trời
  rationale: Giữ ý khởi đầu của ἤρξαντο và sức động từ của phân từ χαίροντες; dấu phẩy cho thấy sự vui mừng đi kèm hành động ca ngợi.
- source_word: φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ Hy Lạp 'bằng tiếng lớn'.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: vì mọi việc quyền năng họ đã thấy
  rationale: δύναμις ở đây chỉ những hành động biểu lộ quyền năng. 'Việc quyền năng' giữ trường nghĩa rộng hơn 'phép lạ', còn 'đã thấy' thể hiện các việc ấy xảy ra trước lời ca ngợi.
theological_decisions:
- issue: Cách dịch δύναμις trong ngữ cảnh các việc phi thường của Chúa Giê-su
  choice: việc quyền năng
  alternative: phép lạ; việc đầy quyền năng
  rationale: Từ Hy Lạp có thể nói đến quyền năng, việc quyền năng hoặc phép lạ. 'Việc quyền năng' giữ trọng tâm nơi quyền năng được bày tỏ qua hành động mà không thu hẹp từ này thành một thuật ngữ kỹ thuật.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. Dùng “Ngài” cho Chúa Giê-su và “Đức Chúa Trời” cho θεός; câu được sắp xếp tự nhiên, tránh lối mô phỏng cú pháp Hy Lạp quá cứng.
