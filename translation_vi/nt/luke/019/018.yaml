  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: vi
  text: 'Người thứ hai đến và nói: “Thưa chủ, mi-na của chủ đã sinh lợi được năm mi-na.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: người thứ hai
  rationale: Giữ đúng thứ tự của các đầy tớ trong dụ ngôn.
- source_word: μνᾶ
  choice: mi-na
  rationale: Phiên âm đơn vị tiền tệ Hy Lạp để tránh quy đổi thiếu chính xác sang tiền hiện đại.
- source_word: κύριε
  choice: thưa chủ
  rationale: Trong ngữ cảnh đầy tớ thưa với người chủ, cách xưng hô này tự nhiên và giữ đúng quan hệ giữa hai nhân vật.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: đã sinh lợi thành năm mi-na
  rationale: Diễn đạt tự nhiên ý số vốn tạo ra kết quả là năm mi-na, đồng thời không thêm tác nhân ngoài cách nói nhân hóa của nguyên văn.
theological_decisions:
- issue: Cách hiểu κύριε trong lời nói thuộc dụ ngôn
  choice: thưa chủ
  alternative: lạy Chúa
  rationale: Ngữ cảnh trực tiếp là lời một đầy tớ nói với chủ mình; không viết hoa hay dùng tước hiệu thần học để tránh áp đặt sự đồng nhất ngoài điều câu văn tự nó nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc kể chuyện ngắn gọn; dùng “sinh lợi thành” thay vì dịch máy móc “làm ra” để câu tiếng Việt rõ nghĩa trong bối cảnh tiền vốn.
