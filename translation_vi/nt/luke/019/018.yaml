    rationale: Nguyên văn ἐποίησεν πέντε μνᾶς diễn tả mi-na đã làm ra/đem lại năm mi-na. «Sinh lợi được năm mi-na» phản ánh trực tiếp hơn kết quả được tạo ra mà không xác định tổng vốn cuối cùng.
