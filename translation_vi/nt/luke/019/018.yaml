  source_fidelity: Cần chỉnh nhẹ cụm kết. ἐποίησεν πέντε μνᾶς nói theo lối nhân hóa rằng mi-na ấy «làm ra/đem lại năm mi-na»; bản nháp «sinh lợi thành năm mi-na» dễ được hiểu là vốn một mi-na tăng thành tổng cộng năm mi-na, thay vì tạo ra năm mi-na như câu Hy Lạp và bản tiếng Anh nêu.
