  verdict: revise
  source_fidelity: Cần sửa vì “Đức Chúa Jêsus” thay cho αὐτόν vừa nêu lại danh xưng không có trong câu, vừa thêm tước hiệu thần học “Đức Chúa”. “Từ trong đám đông” phản ánh rõ hơn ἀπὸ τοῦ ὄχλου. Mệnh lệnh ἐπιτίμησον được giữ trực tiếp bằng “hãy quở trách”.
  naturalness: “Một số người ... từ trong đám đông” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại. “Thưa Thầy” phù hợp lời xưng hô kính trọng. “Môn đệ” là cách gọi hiện hành, trang trọng nhưng dễ hiểu trong văn mạch Phúc Âm.
  terminology: Giữ “Pha-ri-si” và “Thầy” cho các thuật ngữ ổn định. Dùng “môn đệ” cho μαθηταί. Không đưa tước hiệu “Đức Chúa” vào chỗ nguyên văn chỉ dùng đại từ; “Ngài” là cách quy chiếu tự nhiên trong tiếng Việt theo ngữ cảnh trước đó.
