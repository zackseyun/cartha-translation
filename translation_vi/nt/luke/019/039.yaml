    rationale: ἀπὸ τοῦ ὄχλου chỉ những người Pha-ri-si phát biểu từ/ra từ đám đông. “Từ trong đám đông” giữ được sắc thái này mà vẫn tự nhiên.
  - severity: low
    issue: “xin quở trách” làm dịu mệnh lệnh
    rationale: ἐπιτίμησον là mệnh lệnh aorist trực tiếp. “Hãy quở trách” bảo toàn lực yêu cầu mà không diễn giải thành bảo im lặng.
