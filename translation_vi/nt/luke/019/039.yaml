  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: vi
  text: 'Một số người Pha-ri-si từ trong đám đông nói với Ngài: “Thưa Thầy, hãy quở trách các môn đệ của Thầy.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: mấy người Pha-ri-si
  rationale: τινες kết hợp với sở hữu cách bộ phận τῶν Φαρισαίων chỉ một số người không xác định trong nhóm Pha-ri-si; “mấy người Pha-ri-si” tự nhiên và giữ đúng ý bộ phận.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: ở trong đám đông
  rationale: Trong ngữ cảnh, ἀπό cho biết những người Pha-ri-si này phát lời từ giữa đám đông. “Ở trong đám đông” diễn đạt vị trí tự nhiên bằng tiếng Việt mà không hàm ý họ vừa tách khỏi đám đông.
- source_word: εἶπαν πρὸς αὐτόν
  choice: nói với Đức Chúa Jêsus
  rationale: Đây là công thức dẫn lời thông thường. Đại từ αὐτόν quy chiếu về Đức Chúa Jêsus trong ngữ cảnh; nêu danh xưng giúp câu tiếng Việt rõ chủ thể tiếp nhận lời nói.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: διδάσκαλος là người dạy; trong lời xưng hô, “Thưa Thầy” vừa tự nhiên, kính trọng, vừa không đưa thêm hàm ý thần học mạnh hơn nguyên văn.
- source_word: ἐπιτίμησον
  choice: xin quở trách
  rationale: Mệnh lệnh aorist yêu cầu một hành động khiển trách trực tiếp. “Quở trách” giữ được sức mạnh của động từ mà không diễn giải thành “bắt im đi”; “xin” thể hiện tự nhiên sắc thái lời yêu cầu trong tiếng Việt, không làm mất lực mệnh lệnh.
- source_word: τοῖς μαθηταῖς σου
  choice: các môn đồ của Thầy
  rationale: μαθητής chỉ người học theo một thầy; “môn đồ” bảo tồn mối quan hệ thầy–trò trong ngữ cảnh Phúc Âm. Đại từ sở hữu được điều chỉnh thành “của Thầy” theo cách xưng hô tiếng Việt.
theological_decisions:
- issue: Cách dịch danh xưng Διδάσκαλε dành cho Đức Chúa Jêsus
  choice: Thưa Thầy
  alternative: Thưa Chủ
  rationale: Danh xưng tại đây nhấn mạnh vai trò giảng dạy, không tự thân biểu đạt một tuyên xưng Kitô học về quyền làm Chủ. “Thưa Thầy” giữ đúng phạm vi nghĩa và phù hợp lời xưng hô hiện đại.
- issue: Có diễn giải ἐπιτίμησον là ra lệnh cho các môn đồ im lặng hay không
  choice: quở trách
  alternative: bảo các môn đồ im đi
  rationale: Ngữ cảnh cho thấy mục đích có thể là chấm dứt lời tung hô, nhưng chính động từ chỉ hành vi quở trách. Bản dịch không biến hàm ý ngữ cảnh thành nội dung minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Pha-ri-si,” “Đức Chúa Jêsus” và “môn đồ” theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt; lời thoại giữ phép xưng hô tự nhiên “Thưa Thầy… của Thầy.”
