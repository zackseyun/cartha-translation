  verdict: revise
  source_fidelity: Bản nháp giữ đúng mạch lời than, sự nhấn mạnh hướng về Giê-ru-sa-lem («ngay cả ngươi»), số nhiều của «những điều», thể bị động, và hình ảnh «khỏi mắt ngươi». Tuy nhiên, «Nếu ... nhận biết» chưa biểu lộ rõ thì quá khứ/điều không thành của ἔγνως như «Nếu ... đã nhận biết». Từ «ngay» đứng trước «trong ngày này» thêm một mức nhấn mạnh không cần thiết, bên cạnh «ngay cả» đã chuyển tải καὶ σὺ.
  naturalness: Cấu trúc câu điều kiện bỏ lửng với dấu gạch ngang là tự nhiên và thích hợp cho lời than. «Nếu trong ngày này, ngay cả ngươi cũng đã nhận biết...» mạch lạc hơn «Nếu ngay trong ngày này...», đồng thời vẫn giữ văn phong trang trọng hiện đại. «Đã bị che khuất khỏi mắt ngươi» bảo tồn thành ngữ Kinh Thánh và vẫn dễ hiểu.
  terminology: «Bình an» là lựa chọn phù hợp cho εἰρήνην trong văn cảnh này. «Những điều dẫn đến bình an» diễn đạt được τὰ πρὸς εἰρήνην; chú thích giải thích nghĩa rộng hơn là những gì liên quan đến hoặc đưa tới bình an. Đại từ «ngươi» nhất quán với lời trực tiếp nhân cách hóa Giê-ru-sa-lem.
