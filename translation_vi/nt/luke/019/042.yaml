  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: vi
  text: 'nói rằng: “Nếu[a] trong ngày này, ngay cả ngươi cũng đã nhận biết những điều dẫn đến bình an[b]—nhưng giờ đây, những điều ấy đã bị che khuất khỏi mắt ngươi.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo sắc thái than tiếc: “Phải chi trong ngày này, ngay cả ngươi cũng nhận biết…”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp sát nghĩa là “những điều hướng đến bình an”, tức những gì liên quan đến hoặc dẫn tới bình an.
    reason: lexical_alternative
  - marker: c
    text: 'Động từ Hy Lạp ở số ít, dù cụm từ đứng trước là trung tính số nhiều. Vì thế, cũng có thể diễn đạt theo ý niệm số ít: “điều đó đã bị che khuất khỏi mắt ngươi”.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: nói rằng
  rationale: Giữ dạng phân từ hiện tại nối tiếp mạch tường thuật của câu trước, thay vì biến thành một động từ hữu hạn độc lập.
- source_word: Εἰ ἔγνως
  choice: Nếu ... nhận biết
  rationale: Giữ nguyên cấu trúc điều kiện bỏ lửng của lời than, không tự thêm từ tương đương với “phải chi” vào chính văn, dù sắc thái tiếc nuối ấy hiện diện trong ngữ cảnh.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: ngay trong ngày này
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; “ngay” làm rõ trọng tâm thời gian vốn được tăng cường bởi vị trí của cụm từ trong lời than mà không đổi nghĩa cơ bản.
- source_word: καὶ σὺ
  choice: ngay cả ngươi
  rationale: Truyền đạt sắc thái nhấn mạnh của lời trực tiếp nói với Giê-ru-sa-lem; “ngươi” phù hợp với cách nhân cách hóa thành phố và giọng văn trang trọng.
- source_word: τὰ πρὸς εἰρήνην
  choice: những điều dẫn đến bình an
  rationale: 'Giữ ý nghĩa số nhiều của τὰ và diễn đạt tự nhiên quan hệ πρὸς: những gì liên quan đến hoặc đưa tới bình an.'
- source_word: εἰρήνην
  choice: bình an
  rationale: Là từ ngữ Kinh Thánh quen thuộc và vẫn dễ hiểu, bao hàm cả hòa bình lẫn tình trạng an lành.
- source_word: νῦν δὲ
  choice: nhưng giờ đây
  rationale: Thể hiện sự tương phản mạnh giữa điều đáng lẽ được nhận biết và tình trạng che khuất hiện tại.
- source_word: ἐκρύβη
  choice: đã bị che khuất
  rationale: Giữ thể bị động và diễn tả hành động đã xảy ra với kết quả còn hiệu lực; chủ thể hàm ẩn được nêu là “những điều ấy” để liên kết rõ với cụm từ đứng trước.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: khỏi mắt ngươi
  rationale: Giữ hình ảnh cụ thể của nguyên văn về sự nhìn thấy và nhận biết, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Chủ thể hàm ẩn của ἐκρύβη
  choice: Hiểu đối tượng bị che khuất là “những điều dẫn đến bình an” và diễn đạt lại bằng “những điều ấy”.
  alternative: 'Hiểu theo nghĩa khái niệm số ít hoặc vô nhân xưng: “điều đó đã bị che khuất khỏi mắt ngươi”.'
  rationale: Dù ἐκρύβη ở số ít, cụm trung tính số nhiều τὰ πρὸς εἰρήνην có thể đi với động từ số ít trong tiếng Hy Lạp. Cách dịch “những điều ấy” giữ mối liên hệ rõ ràng mà không thêm một đối tượng thần học mới.
- issue: Sắc thái của điều kiện trong lời than
  choice: Giữ “Nếu ...” và cấu trúc bỏ lửng bằng dấu gạch ngang.
  alternative: 'Dịch rõ sắc thái ước ao: “Phải chi ...”.'
  rationale: Ngữ cảnh thực sự mang sắc thái than tiếc, nhưng nguyên văn không có tiểu từ tương đương trực tiếp với “phải chi”. Chính văn giữ sự bỏ lửng và chú thích nêu cách diễn đạt giàu cảm xúc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” được dùng vì lời nói trực tiếp hướng đến Giê-ru-sa-lem đã được nhân cách hóa; cấu trúc điều kiện bỏ lửng được giữ để bảo tồn sức nặng cảm xúc và sự căng thẳng của nguyên văn.
