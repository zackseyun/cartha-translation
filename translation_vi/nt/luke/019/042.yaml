  - severity: low
    issue: «Ngay trong ngày này» tăng cường nhấn mạnh thời gian không cần thiết.
    rationale: ἐν τῇ ἡμέρᾳ ταύτῃ chỉ nêu «trong/ngày này»; trọng tâm nhấn mạnh rõ rệt hơn nằm ở καὶ σὺ, đã được chuyển tải bằng «ngay cả ngươi».
