  text: καὶ ἤγαγον αὐτὸν πρὸς τὸν Ἰησοῦν, καὶ ἐπιρίψαντες ⸀αὐτῶν τὰ ἱμάτια ἐπὶ τὸν πῶλον ἐπεβίβασαν τὸν Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: vi
  text: Họ đem nó đến với Giê-su[a]. Sau khi trải áo choàng của họ lên lưng con lừa non[b], họ đặt Giê-su lên lưng nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đại từ trong tiếng Hy Lạp là giống đực và chỉ con lừa non.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “con non”; văn cảnh cho thấy đây là con lừa non.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἤγαγον
  choice: dắt ... đến
  rationale: Động từ ἄγω trong ngữ cảnh đưa một con vật đến chỗ Đức Chúa Jêsus được diễn đạt tự nhiên và cụ thể bằng “dắt ... đến”.
- source_word: αὐτὸν
  choice: nó
  rationale: Đại từ giống đực trong tiếng Hy Lạp chỉ lại con lừa con; tiếng Việt tự nhiên dùng “nó” cho con vật.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: đến với Đức Chúa Jêsus
  rationale: πρός với đối cách diễn tả sự chuyển động hướng đến một người; “đến với” phù hợp văn cảnh.
- source_word: ἐπιρίψαντες
  choice: rồi lấy ... trải
  rationale: Phân từ bất định quá khứ chỉ hành động xảy ra trước động từ chính; “rồi” thể hiện rõ trình tự, còn “trải” tự nhiên hơn “ném” khi áo được đặt lên lưng con vật để làm chỗ ngồi.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: áo choàng của mình
  rationale: ἱμάτια là các áo ngoài; “áo choàng” cụ thể, dễ hiểu. “Của mình” quy chiếu tự nhiên về chủ ngữ số nhiều “họ”.
- source_word: ἐπὶ τὸν πῶλον
  choice: lên lưng lừa con
  rationale: ἐπί với đối cách chỉ sự đặt lên con vật. Thêm “lưng” là hàm ý trực tiếp của hành động trong ngữ cảnh và tạo câu tiếng Việt tự nhiên.
- source_word: πῶλον
  choice: lừa con
  rationale: πῶλος tự nó chỉ thú non, nhưng văn cảnh gần xác định đây là con non của lừa; “lừa con” rõ nghĩa đối với độc giả hiện đại.
- source_word: ἐπεβίβασαν
  choice: đỡ ... ngồi lên
  rationale: Động từ mang nghĩa khiến một người lên hoặc cưỡi con vật. “Đỡ ... ngồi lên” giữ sắc thái tác động của chủ thể và tránh cách nói thiếu tự nhiên “đặt Jêsus lên”.
- source_word: τὸν Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Dùng hình thức tên gọi trang trọng, quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
