revisions:
- from: Họ dắt nó đến với Đức Chúa Jêsus[a], rồi lấy áo choàng của mình trải lên lưng lừa con[b] và đỡ Đức Chúa Jêsus ngồi lên.
  to: Họ đem nó đến với Giê-su[a]. Sau khi trải áo choàng của họ lên lưng con lừa non[b], họ đặt Giê-su lên lưng nó.
  rationale: Loại bỏ tước hiệu không có trong nguyên văn và dùng dạng tên hiện hành “Giê-su”. Thay “đỡ ... ngồi lên” bằng “đặt ... lên lưng nó” để phản ánh chính xác động từ gây khiến ἐπεβίβασαν, không thêm sắc thái trợ giúp. Giữ việc xác định con vật là lừa non theo văn cảnh, đồng thời bảo toàn tính khái quát của πῶλος qua chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:32:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng chuỗi hành động và quy chiếu của đại từ προς con vật. Tuy nhiên, nguyên văn chỉ nêu tên Ἰησοῦς (“Giê-su”), không có tước hiệu “Đức Chúa”; việc thêm tước hiệu này vượt quá câu nguồn. “Đỡ ... ngồi lên” cũng thêm sắc thái trợ giúp không được nêu rõ, trong khi ἐπεβίβασαν diễn tả việc khiến/đặt Giê-su lên con vật.
  naturalness: Câu sửa vẫn tự nhiên, trang trọng và hiện đại. “Đặt ... lên lưng nó” diễn đạt rõ hành động khiến một người lên con vật mà không thêm ý. “Đem nó đến với Giê-su” là cách nói tự nhiên, trung tính hơn “dắt nó đến với”.
  terminology: Dùng “Giê-su” là dạng tên hiện hành trong tiếng Việt chuẩn. Không thêm “Đức Chúa” vì câu Hy Lạp không có κύριος hay tước hiệu tương đương. “Áo choàng” phù hợp với ἱμάτια; “con lừa non” phản ánh rõ văn cảnh, còn chú thích lưu ý từ Hy Lạp tự nó chỉ “con non”.
  issues:
  - severity: high
    issue: Thêm tước hiệu “Đức Chúa” trước tên Giê-su.
    rationale: τὸν Ἰησοῦν chỉ là “Giê-su”. Tước hiệu không có trong bản văn này, nên không nên thêm vào bản dịch tối ưu tương đương.
  - severity: medium
    issue: “Đỡ Đức Chúa Jêsus ngồi lên” thêm sắc thái trợ giúp.
    rationale: ἐπεβίβασαν có nghĩa là khiến/đặt ai lên con vật; bản văn không nói họ phải đỡ ngài. “Đặt Giê-su lên lưng nó” giữ được tính tác động mà không thêm chi tiết.
  - severity: low
    issue: Chú thích a được giữ nhưng cần diễn đạt rõ lý do có chú thích trong tiếng Việt.
    rationale: Tiếng Việt không biểu thị giống ngữ pháp ở “nó”; chú thích nên nói rõ đại từ giống đực Hy Lạp quy chiếu về con lừa non, không hàm ý một nhân vật nam.
  revised_text: Họ đem nó đến với Giê-su[a]. Sau khi trải áo choàng của họ lên lưng con lừa non[b], họ đặt Giê-su lên lưng nó.
