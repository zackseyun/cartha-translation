  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: vi
  text: Vậy, những người được sai đi ra đi và thấy đúng như Ngài đã nói với họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “thấy/tìm thấy” mà không nêu tân ngữ; theo văn cảnh, tân ngữ được hiểu là con lừa con mà Chúa Giê-su đã mô tả.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: lên đường
  rationale: Phân từ bất định của ἀπέρχομαι diễn tả việc rời chỗ để đi; “lên đường” tự nhiên trong tiếng Việt và giữ được ý họ thực hiện việc đi theo lời chỉ dẫn.
- source_word: δὲ
  choice: Vậy
  rationale: Ở đây δέ nối tiếp diễn biến câu chuyện và gợi quan hệ với mệnh lệnh trước đó; “Vậy” diễn đạt mạch kể tự nhiên mà không nhấn quá mạnh quan hệ kết quả.
- source_word: οἱ ἀπεσταλμένοι
  choice: những người được sai đi
  rationale: Giữ cấu trúc phân từ hoàn thành bị động dùng như danh từ, đồng thời không thêm cách hiểu như “các sứ giả” vốn không có trong câu.
- source_word: εὗρον
  choice: thấy sự việc
  rationale: Động từ có nghĩa là “tìm thấy/thấy”. Nguyên văn không nêu tân ngữ; “sự việc” giúp câu tiếng Việt tự nhiên nhưng vẫn để chú thích ghi nhận cách dịch sát hơn với tân ngữ được hiểu theo văn cảnh.
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn tả sự tương ứng giữa điều họ gặp và lời Chúa Giê-su đã nói; “đúng như” tự nhiên và giữ sắc thái chính xác của καθώς.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài đã nói với họ
  rationale: Dịch trực tiếp λέγω là “nói”, và “đã” thể hiện hành động xảy ra trước lúc họ thấy sự việc. Đại từ “Ngài” phù hợp văn phong Kinh Thánh trang trọng, với người nói là Chúa Giê-su được xác định rõ trong văn cảnh.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Bản dịch ưu tiên tương đương tối ưu, giữ thể bị động của “những người được sai đi” và ghi nhận qua chú thích rằng εὗρον không có tân ngữ được viết ra trong nguyên văn.
