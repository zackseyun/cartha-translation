revisions:
- from: Vì những ngày sẽ đến trên ngươi, khi kẻ thù của ngươi sẽ dựng chiến lũy[a] chống lại ngươi, bao vây ngươi và dồn ép ngươi từ mọi phía.
  to: Vì sẽ có những ngày giáng xuống trên ngươi, khi kẻ thù của ngươi sẽ dựng lũy vây thành[a] chống lại ngươi, bao vây ngươi và siết chặt ngươi từ mọi phía.
  rationale: Bản sửa thay các cách nói bám sát cấu trúc nhưng chưa tự nhiên bằng tiếng Việt hiện đại, đồng thời làm rõ chức năng vây hãm của χάραξ. Bản sửa vẫn giữ liên từ nhân quả “Vì,” đại từ số ít nhân cách hóa, trình tự ba hành động của quân địch, và ý bao vây hoàn toàn của πάντοθεν.
  reviewer_model: gpt-5.6-terra
