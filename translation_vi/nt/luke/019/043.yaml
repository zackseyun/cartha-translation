  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: vi
  text: Vì sẽ có những ngày giáng xuống trên ngươi, khi kẻ thù của ngươi sẽ dựng lũy vây thành[a] chống lại ngươi, bao vây ngươi và siết chặt ngươi từ mọi phía.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dựng một bờ lũy vây thành chống lại ngươi.”'
    reason: χάραξ chỉ công sự dùng trong việc vây hãm; có thể hiểu cụ thể là một bờ lũy vây thành.
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Nối lời tiên báo này với lời than trước đó và giữ sắc thái nguyên nhân của liên từ.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: những ngày sẽ đến trên ngươi
  rationale: Giữ thành ngữ tiên tri về những biến cố sắp ập đến, đồng thời duy trì giọng trang trọng của câu Hy Lạp.
- source_word: παρεμβαλοῦσιν
  choice: sẽ dựng
  rationale: Trong kết hợp với χάρακα, động từ chỉ việc thiết lập hoặc xây dựng công sự vây thành; “dựng” tự nhiên và rõ trong tiếng Việt.
- source_word: οἱ ἐχθροί σου
  choice: kẻ thù của ngươi
  rationale: Chuyển đạt trực tiếp cụm sở hữu chỉ các lực lượng thù địch của thành Giê-ru-sa-lem.
- source_word: χάρακά σοι
  choice: chiến lũy chống lại ngươi
  rationale: χάραξ trong ngữ cảnh này chỉ một công sự dùng để vây hãm; cách dịch giữ nghĩa quân sự mà không ấn định quá cụ thể vật liệu hay cấu trúc.
- source_word: περικυκλώσουσίν σε
  choice: bao vây ngươi
  rationale: Diễn đạt trực tiếp hành động quân sự bao quanh mục tiêu.
- source_word: συνέξουσίν σε πάντοθεν
  choice: dồn ép ngươi từ mọi phía
  rationale: Thể hiện cả ý siết chặt, gây áp lực của συνέχω lẫn sự bao kín hoàn toàn của πάντοθεν.
theological_decisions:
- issue: Đối tượng của các đại từ ngôi thứ hai số ít trong lời than về Giê-ru-sa-lem
  choice: Giữ “ngươi” ở số ít, chỉ thành Giê-ru-sa-lem được nhân cách hóa.
  alternative: Diễn giải thành “dân trong thành” hoặc dùng đại từ số nhiều.
  rationale: Các đại từ Hy Lạp ở số ít và văn cảnh trực tiếp nhân cách hóa Giê-ru-sa-lem; giữ số ít bảo tồn sức nặng tiên tri mà không thu hẹp hay mở rộng đối tượng một cách diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mang sắc thái tiên tri. Dùng “ngươi” vì lời nói trực tiếp hướng đến Giê-ru-sa-lem được nhân cách hóa; thuật ngữ “chiến lũy” dễ hiểu hơn lối nói cổ nhưng vẫn giữ bối cảnh quân sự.
