id: LUK.19.10
reference: Luke 19:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: vi
  text: Vì Con Người đã đến để tìm kiếm và cứu người bị hư mất[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều đã mất.” Cụm từ Hy Lạp ở dạng trung tính số ít và có thể được hiểu theo nghĩa khái quát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: đã đến
  rationale: Động từ aorist chỉ sự kiện đến trong lời tóm lược sứ mạng; “đã đến” là cách diễn đạt quá khứ tự nhiên trong tiếng Việt và không thêm sắc thái ngoài văn bản.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do, giải thích cho lời ngay trước đó; “Vì” giữ rõ mối liên hệ lập luận.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng tự chỉ của Đức Giê-su cùng âm hưởng Đa-ni-ên, thay vì diễn giải hoặc thu hẹp ý nghĩa.
- source_word: ζητῆσαι
  choice: để tìm kiếm
  rationale: Động từ nguyên mẫu aorist diễn tả mục đích của việc đến; “tìm kiếm” thể hiện sự chủ động theo đuổi và phù hợp với văn phong trang trọng, dễ hiểu.
- source_word: σῶσαι
  choice: cứu
  rationale: Trong Lu-ca, từ này mang nội hàm cứu thoát rộng, kể cả ý nghĩa cứu rỗi; “cứu” giữ được độ rộng ấy mà không giải thích thêm.
- source_word: τὸ ἀπολωλός
  choice: người bị hư mất
  rationale: Phân từ hoàn thành có mạo từ diễn tả tình trạng bị mất/hư mất. Trong ngữ cảnh Xa-chê, cách dịch chỉ con người là tự nhiên, còn chú thích giữ lại khả năng hiểu trung tính, khái quát của nguyên ngữ.
theological_decisions:
- issue: Phạm vi và sắc thái của τὸ ἀπολωλός
  choice: người bị hư mất
  alternative: điều đã mất
  rationale: Ngữ cảnh trực tiếp nói về Xa-chê và phát biểu rộng hơn về sứ mạng của Con Người. Bản dịch chính tự nhiên trong tiếng Việt khi nói về người được cứu, nhưng chú thích bảo lưu dạng trung tính số ít và khả năng hiểu khái quát của tiếng Hy Lạp, không âm thầm giải quyết sự mơ hồ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Con Người” được giữ như một danh xưng quen thuộc; “tìm kiếm và cứu” bảo toàn cấu trúc mục đích song hành của nguyên văn. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
