  rationale: Bỏ “rất” để không thêm mức độ giàu có ngoài nguyên văn, và thay thuật ngữ chức vụ bằng cách diễn đạt hiện đại, rõ nghĩa hơn. Các yếu tố còn lại, gồm “Kìa,” tên riêng và cấu trúc giới thiệu rồi mô tả, được giữ nguyên.
