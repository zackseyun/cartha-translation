base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: vi
  text: Kìa, có một người tên là Xa-chê; ông là trưởng nhóm thu thuế và giàu có.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng hướng sự chú ý và nét sinh động trong lời kể của Lu-ca; “Kìa” tự nhiên và trang trọng hơn việc lược bỏ dấu hiệu diễn ngôn này.
- source_word: ἀνὴρ
  choice: một người
  rationale: Trong ngữ cảnh, danh từ chỉ một người đàn ông cụ thể; đại từ “ông” ở vế sau thể hiện giới tính tự nhiên trong tiếng Việt mà không cần dùng cụm nặng nề “một người đàn ông”.
- source_word: ὀνόματι καλούμενος
  choice: tên là
  rationale: Thành ngữ Hy Lạp có nghĩa là được gọi hoặc mang tên; “tên là” là cách diễn đạt tiếng Việt tự nhiên, đầy đủ ý nghĩa.
- source_word: Ζακχαῖος
  choice: Xa-chê
  rationale: Dùng dạng phiên âm Kinh Thánh tiếng Việt quen thuộc cho tên riêng này.
- source_word: αὐτὸς ἦν
  choice: ông là
  rationale: Đại từ nối lại và nhấn nhẹ chủ thể; “ông là” tự nhiên trong tiếng Việt và tránh cường điệu thành “chính ông”.
- source_word: ἀρχιτελώνης
  choice: trưởng ngành thu thuế
  rationale: Diễn đạt vai trò đứng đầu hoặc cấp cao trong hệ thống thu thuế, đồng thời tránh cách hiểu ông chỉ là người trực tiếp thu thuế trưởng.
- source_word: αὐτὸς πλούσιος
  choice: rất giàu
  rationale: πλούσιος chỉ tình trạng giàu có. Từ “rất” truyền đạt nét nhấn nhẹ của αὐτός lặp lại trong một cấu trúc tiếng Việt tự nhiên.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy giữ nhịp cấu trúc Hy Lạp: trước hết giới thiệu Xa-chê, rồi nêu địa vị và sự giàu có của ông.'
