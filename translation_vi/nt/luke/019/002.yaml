    rationale: Cụm này dễ được hiểu là người lãnh đạo cả một ngành. ἀρχιτελώνης chỉ một người đứng đầu trong những người thu thuế; “trưởng nhóm thu thuế” diễn đạt rõ hơn trong tiếng Việt hiện đại.
