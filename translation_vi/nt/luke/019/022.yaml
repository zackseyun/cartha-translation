reference: Luke 19:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: vi
  text: 'Ông nói với người ấy: “Ta sẽ dựa vào chính lời ngươi mà xét xử ngươi, hỡi đầy tớ gian ác! Ngươi đã biết ta là người hà khắc, lấy những gì ta không đặt xuống và gặt những gì ta không gieo, phải không?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu này cũng có thể được chấm như một lời khẳng định: “Ngươi đã biết ta là người hà khắc, lấy những gì ta không đặt xuống và gặt những gì ta không gieo.”'
    reason: punctuation_ambiguity
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: dựa vào chính lời ngươi
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp, cho thấy lời của chính người đầy tớ là căn cứ xét xử, thay vì dịch máy móc là “từ miệng ngươi”.
- source_word: κρίνω
  choice: sẽ ... xét xử
  rationale: Giữ giá trị tương lai của động từ và nghĩa rộng là phán xét, không thu hẹp thành “kết án”.
- source_word: πονηρὲ δοῦλε
  choice: hỡi tên đầy tớ gian ác
  rationale: “Gian ác” truyền đạt lời khiển trách về đạo đức; “đầy tớ” là cách gọi tự nhiên, trang trọng trong bối cảnh dụ ngôn, đồng thời vẫn biểu thị địa vị lệ thuộc vào chủ.
- source_word: αὐστηρός
  choice: hà khắc
  rationale: Thể hiện sắc thái nghiêm khắc đến mức khắc nghiệt trong lời người đầy tớ mô tả chủ.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: lấy những gì ta không gửi
  rationale: Trong ngữ cảnh tiền bạc, τίθημι có thể chỉ việc gửi hoặc đặt tiền; “gửi” làm rõ hình ảnh kinh tế, còn “lấy” giữ độ rộng của αἴρω.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: gặt những gì ta không gieo
  rationale: Giữ nguyên ẩn dụ nông nghiệp và cấu trúc đối xứng; đại từ quan hệ chỉ vật nên dịch “những gì,” không phải “nơi”.
theological_decisions:
- issue: Lời mô tả ông chủ là “hà khắc” có được người kể chuyện xác nhận hay không
  choice: Giữ nguyên lời nói trực tiếp mang tính chất nhắc lại lập luận của người đầy tớ, không thêm lời giải thích rằng ông chủ thực sự hà khắc.
  alternative: “Ngươi cho rằng ta là người hà khắc” hoặc “Nếu ngươi biết ta là người hà khắc”
  rationale: Câu Hy Lạp trực tiếp nói “ngươi đã biết rằng ta là...”, nhưng trong mạch dụ ngôn đây có thể là cách ông chủ dùng chính lời người đầy tớ để đáp lại. Bản dịch không tự giải quyết căng thẳng ấy.
- issue: Cách thể hiện δοῦλος trong quan hệ chủ–tớ
  choice: đầy tớ
  alternative: nô lệ
  rationale: “Đầy tớ” phù hợp văn phong tiếng Việt hiện đại trong dụ ngôn và vẫn cho thấy quan hệ lệ thuộc. “Nô lệ” có thể nhấn mạnh địa vị pháp lý-xã hội mạnh hơn mức cần thiết trong câu này.
- issue: Sắc thái câu cuối là khẳng định hay câu hỏi tu từ
  choice: Dùng “phải không?” và chú thích dị bản diễn đạt.
  alternative: Kết thúc bằng dấu chấm như một lời khẳng định
  rationale: Văn bản SBLGNT được cung cấp có dấu hỏi và lời nói có thể được hiểu là câu hỏi tu từ dựa trên lời người đầy tớ. Tuy nhiên, dấu câu không thuộc bản thảo cổ sớm và cú pháp cũng có thể được chấm như lời khẳng định.
translation_notes:
  register: Văn phong trực tiếp, trang trọng nhưng dễ hiểu. Đại từ “ta—ngươi” phản ánh quan hệ quyền lực trong bối cảnh dụ ngôn. Cụm “dựa vào chính lời ngươi” ưu tiên tiếng Việt tự nhiên mà vẫn bảo toàn hình ảnh xét xử căn cứ trên lời của người đầy tớ.
