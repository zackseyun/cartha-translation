- from: 'Ông nói với người ấy: “Ta sẽ dựa vào chính lời ngươi mà xét xử ngươi, hỡi tên đầy tớ gian ác! Ngươi đã biết ta là người hà khắc, lấy những gì ta không gửi và gặt những gì ta không gieo, phải không?”[a]'
  to: 'Ông nói với người ấy: “Ta sẽ dựa vào chính lời ngươi mà xét xử ngươi, hỡi đầy tớ gian ác! Ngươi đã biết ta là người hà khắc, lấy những gì ta không đặt xuống và gặt những gì ta không gieo, phải không?”[a]'
  rationale: Sửa “gửi” thành “đặt xuống” để phản ánh τίθημι mà không áp đặt cách hiểu tài chính chuyên biệt. Sửa lời gọi để không thêm sắc thái miệt thị. Giữ câu hỏi tu từ theo dấu câu của SBLGNT và giữ chú thích ngắn để bảo toàn khả năng chấm câu như lời khẳng định.
