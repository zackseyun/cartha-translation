id: LUK.12.53
reference: Luke 12:53
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: vi
  text: 'Họ sẽ bị chia rẽ[a]: cha chống lại con trai, con trai chống lại cha; mẹ chống lại con gái, con gái chống lại mẹ; mẹ chồng chống lại con dâu[b] của mình, và con dâu chống lại mẹ chồng của mình.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị phân rẽ.” Động từ Hy Lạp nhấn mạnh sự chia rẽ ngay trong một nhóm người hay một gia đình.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp này trong những văn cảnh khác cũng có thể có nghĩa là “cô dâu”; nhưng ở đây, vì được đặt đối ứng với “mẹ chồng”, nghĩa phù hợp là “con dâu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: sẽ bị chia rẽ
  rationale: Giữ dạng tương lai bị động và diễn tả tình trạng phân rẽ trong gia đình, không thêm tác nhân gây ra sự chia rẽ.
- source_word: ἐπὶ
  choice: chống lại
  rationale: Trong cấu trúc lặp lại chỉ quan hệ giữa các thành viên gia đình, giới từ này mang nghĩa đối nghịch; “chống lại” truyền đạt rõ sắc thái ấy.
- source_word: πατήρ / υἱός
  choice: cha / con trai
  rationale: Giữ nguyên các quan hệ thân tộc có giới tính cụ thể và cấu trúc đối ứng của nguyên văn.
- source_word: μήτηρ / θυγάτηρ
  choice: mẹ / con gái
  rationale: Giữ nguyên các quan hệ thân tộc có giới tính cụ thể và cấu trúc đối ứng của nguyên văn.
- source_word: πενθερά
  choice: mẹ chồng
  rationale: Trong cặp đối ứng với νύμφη mang nghĩa “con dâu”, “mẹ chồng” là cách gọi thân tộc tự nhiên và chính xác trong tiếng Việt.
- source_word: νύμφη
  choice: con dâu
  rationale: Từ này có thể chỉ cô dâu trong ngữ cảnh khác, nhưng ở đây cặp quan hệ với πενθερά xác định nghĩa là con dâu.
- source_word: αὐτῆς
  choice: của mình
  rationale: Diễn đạt quan hệ sở hữu/phản thân tự nhiên trong tiếng Việt ở cụm “con dâu của mình”; cụm tương ứng cuối câu cũng được diễn đạt rõ để câu cân xứng và tự nhiên.
theological_decisions:
- issue: Bản chất của sự chia rẽ được mô tả
  choice: Giữ nguyên lời mô tả mạnh về sự đối nghịch giữa các thành viên gia đình do sứ mạng của Chúa Giê-su dẫn đến trong văn cảnh.
  alternative: Hiểu như một câu nói chung về căng thẳng gia đình hoặc làm nhẹ thành sự bất đồng đơn thuần.
  rationale: Nguyên văn liệt kê các cặp đối nghịch qua lại như hệ quả của sự chia rẽ trong văn cảnh trước đó. Bản dịch không biến lời mô tả này thành sự tán thành thái độ thù nghịch, nhưng cũng không làm nhẹ sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu chấm phẩy làm rõ ba cặp quan hệ đối ứng. “Chống lại” được lặp lại để bảo toàn nhịp điệu và sức nặng của nguyên văn.
