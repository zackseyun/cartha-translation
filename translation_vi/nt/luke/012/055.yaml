  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: vi
  text: 'Và khi gió nam thổi, các ngươi nói: “Sẽ có nắng nóng gay gắt,” và điều đó xảy ra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νότον
  choice: gió nam
  rationale: Danh từ có thể chỉ “phương nam” hoặc “gió nam”; đi với phân từ πνέοντα (“thổi”), ngữ cảnh khí tượng đòi hỏi nghĩa “gió nam”.
- source_word: πνέοντα
  choice: thổi
  rationale: Phân từ hiện tại diễn tả gió đang thổi; cách nói này tự nhiên trong tiếng Việt và giữ được sắc thái quan sát thời tiết.
- source_word: λέγετε
  choice: các ngươi nói
  rationale: Thì hiện tại mang ý nghĩa khái quát về thói quen lặp lại. “Các ngươi” giữ giọng xưng hô trực tiếp và trang trọng trong lời quở trách của ngữ cảnh.
- source_word: Καύσων
  choice: trời sẽ nóng như thiêu
  rationale: Danh từ chỉ cái nóng gay gắt, thiêu đốt. Cách diễn đạt này tự nhiên, dễ hiểu và truyền đạt cường độ mạnh hơn từ “nóng” đơn thuần.
- source_word: ἔσται
  choice: sẽ
  rationale: Động từ tương lai được thể hiện trực tiếp bằng “sẽ” trong lời dự báo.
- source_word: γίνεται
  choice: quả nhiên xảy ra như vậy
  rationale: Diễn tả lời dự báo trở thành hiện thực; “quả nhiên” làm rõ sự ứng nghiệm mà không thêm nội dung ngoài ý của động từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để phù hợp lời Chúa Giê-su trực tiếp nói với đám đông trong ngữ cảnh, đồng thời tránh lối nói quá khẩu ngữ. Không cần chú thích vì các nghĩa khí tượng được truyền đạt rõ trong câu.
