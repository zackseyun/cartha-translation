- from: 'Bấy giờ, có một người trong đám đông thưa với Đức Chúa Jêsus: “Thưa Thầy, xin bảo anh em của tôi chia gia tài với tôi.”'
  to: 'Bấy giờ, có một người từ trong đám đông thưa với Đức Chúa Jêsus: “Thưa Thầy, xin bảo người anh em của tôi chia gia tài với tôi.”'
  rationale: Sửa tối thiểu để biểu đạt số ít của ἀδελφῷ và làm rõ ἐκ τοῦ ὄχλου. Cụm “người anh em của tôi” không quyết định người này là anh hay em, còn “chia gia tài với tôi” giữ được cả ý chia tài sản và sự cùng tham dự của μετ’ ἐμοῦ.
