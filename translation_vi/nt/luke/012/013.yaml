  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: vi
  text: 'Bấy giờ, có một người từ trong đám đông thưa với Đức Chúa Jêsus: “Thưa Thầy, xin bảo người anh em của tôi chia gia tài với tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Bấy giờ ... thưa
  rationale: δέ là từ nối nhẹ; “Bấy giờ” tạo bước chuyển tự nhiên trong lời kể. “Thưa” phù hợp với lời một người kính cẩn nói trực tiếp với một vị thầy.
- source_word: τις
  choice: một người
  rationale: Đại từ bất định chỉ một cá nhân không được nêu danh; “một người” tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκ τοῦ ὄχλου
  choice: trong đám đông
  rationale: Diễn tả người ấy thuộc số những người đang tụ họp; cách nói này tự nhiên và giữ đúng ý nguồn gốc từ giữa đám đông.
- source_word: αὐτῷ
  choice: với Đức Chúa Jêsus
  rationale: Đại từ chỉ về Đức Chúa Jêsus trong ngữ cảnh. Nêu rõ đối tượng giúp câu tiếng Việt đứng độc lập và dễ hiểu.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Danh từ hô cách chỉ người dạy; “Thưa Thầy” vừa tự nhiên vừa thể hiện sắc thái kính trọng mà không thêm ý quyền uy quá mức.
- source_word: εἰπὲ
  choice: xin bảo
  rationale: Mệnh lệnh cách được dùng như một lời thỉnh cầu yêu cầu Đức Chúa Jêsus nói với người anh em; “xin bảo” truyền đạt đúng chức năng và sắc thái giao tiếp.
- source_word: τῷ ἀδελφῷ μου
  choice: anh em của tôi
  rationale: ἀδελφός không tự nó xác định người anh hay người em; “anh em của tôi” giữ sự không xác định của nguyên văn, dù hơi trang trọng hơn khẩu ngữ.
- source_word: μερίσασθαι
  choice: chia
  rationale: Động từ chỉ việc phân chia hoặc phân phối thành các phần; “chia” là cách diễn đạt tự nhiên trong ngữ cảnh gia tài.
- source_word: μετ’ ἐμοῦ
  choice: với tôi
  rationale: μετά với sở hữu cách diễn tả sự cùng tham dự; “với tôi” giữ sát cấu trúc và không mặc nhiên giới hạn việc chia chỉ giữa hai người.
- source_word: τὴν κληρονομίαν
  choice: gia tài
  rationale: Chỉ tài sản được thừa hưởng. “Gia tài” là từ hiện đại, dễ hiểu và thích hợp với tranh chấp phân chia tài sản trong gia đình.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Bản dịch giữ nguyên sự không xác định giới tính thứ bậc trong ἀδελφός bằng “anh em của tôi”, thay vì tự quyết là “anh tôi” hay “em tôi”. Không thêm chú thích vì các khả năng “chia với tôi/chia phần cho tôi” có thể được bao quát tự nhiên bởi câu chính.
