  verdict: revise
  source_fidelity: 'Cần sửa hai điểm để phản ánh sát hơn nguyên văn: δοῦλος chỉ quan hệ lệ thuộc/bị sở hữu, nên “người nô lệ ấy” phù hợp hơn “đầy tớ”; và Χρονίζει ... ἔρχεσθαι nói chủ đang/chậm đến, không nhất thiết nhấn mạnh “còn lâu mới” về. Cặp παῖδας/παιδίσκας được giữ rõ bằng “các nô lệ nam và nữ”.'
  naturalness: Bản sửa vẫn là tiếng Việt hiện đại, rõ và trang trọng. “Tự nhủ” tự nhiên cho thành ngữ “nói trong lòng”; “Chủ ta chậm về” gọn, tự nhiên trong bối cảnh một chủ nhà trở lại. Dấu phẩy cuối câu được giữ vì câu tiếp tục ở câu 46.
  terminology: “Chủ” thích hợp cho κύριος là chủ nhà trong dụ ngôn, không gợi tước hiệu thần linh. “Nô lệ” nhất quán hơn với δοῦλος và với quyết định từ vựng trong hồ sơ tiếng Anh; “nô lệ nam và nữ” bảo toàn sự phân biệt giới tính của παῖδας và παιδίσκας mà không áp đặt cách hiểu tuổi tác không chắc chắn.
  issues:
  - severity: medium
    issue: “Đầy tớ” làm giảm sắc thái lệ thuộc của δοῦλος.
    rationale: Trong ngữ cảnh dụ ngôn, δοῦλος là người nô lệ dưới quyền chủ; hồ sơ đối chiếu tiếng Anh cũng chọn “slave” vì quan hệ lệ thuộc này nổi bật. “Đầy tớ” có thể chỉ người giúp việc/tôi tớ không nhất thiết là nô lệ.
  - severity: low
    issue: “Còn lâu mới về” mạnh hơn Χρονίζει ἔρχεσθαι.
    rationale: Cụm Hy Lạp diễn tả rằng chủ chậm đến/đang trì hoãn việc đến. “Còn lâu mới về” có thể hàm ý một quãng thời gian còn rất dài; “chậm về” giữ mức độ không xác định của nguyên văn.
