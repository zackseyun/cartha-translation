  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: vi
  text: 'Nhưng nếu người nô lệ ấy tự nhủ: ‘Chủ ta chậm về,’ rồi bắt đầu đánh đập các nô lệ nam và nữ, ăn, uống và say sưa,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Trong tiếng Việt hiện đại, “đầy tớ” diễn đạt tự nhiên người ở dưới quyền chủ nhà trong dụ ngôn; từ này vẫn giữ quan hệ lệ thuộc mà không gây liên tưởng chủ yếu đến chế độ nô lệ chủng tộc hiện đại.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: tự nhủ
  rationale: Đây là cách diễn đạt tự nhiên của thành ngữ chỉ lời nói thầm trong lòng, giữ rõ tính riêng tư của ý nghĩ.
- source_word: Χρονίζει ... ἔρχεσθαι
  choice: còn lâu mới về
  rationale: Diễn đạt tự nhiên lời người đầy tớ cho rằng chủ chậm trở về; “về” phù hợp bối cảnh chủ nhà quay lại.
- source_word: κύριός μου
  choice: chủ ta
  rationale: κύριος ở đây là người chủ trong gia đình của câu chuyện, không trực tiếp là tước hiệu thần linh; “chủ” giữ đúng quan hệ quyền uy.
- source_word: ἄρξηται τύπτειν
  choice: bắt đầu đánh đập
  rationale: “Bắt đầu” phản ánh ἄρξηται, còn “đánh đập” truyền đạt hành vi bạo hành có tính tiếp diễn của τύπτειν.
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: các tôi trai tớ gái
  rationale: Cặp từ Việt tự nhiên, gọn và giữ sự phân biệt nam–nữ được nêu rõ trong nguyên văn.
- source_word: ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι
  choice: ăn uống và say sưa
  rationale: Cách nói lưu loát, truyền đạt chuỗi ăn, uống và trở nên say; “say sưa” phù hợp hành vi buông thả trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn
  choice: chủ
  alternative: Chúa
  rationale: Trong thế giới của câu chuyện, từ này chỉ người đứng đầu gia đình và là chủ của đầy tớ. Dịch “chủ” tránh biến lời nói trong dụ ngôn thành một tước hiệu thần linh, dù dụ ngôn có hàm ý thần học.
- issue: Cách dịch δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: Nguyên ngữ chỉ người lệ thuộc dưới quyền chủ. “Đầy tớ” là cách gọi tự nhiên và trang trọng trong văn cảnh dụ ngôn tiếng Việt, trong khi “nô lệ” nhấn mạnh địa vị sở hữu mạnh hơn; quan hệ quyền lực vẫn được thể hiện rõ qua “chủ ta” và toàn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tự nhủ” thay cho lối dịch sát chữ “nói trong lòng”; dùng cặp quen thuộc “tôi trai tớ gái” để giữ đối ứng giới tính. Câu kết bằng dấu phẩy vì câu 45 tiếp tục sang câu kế tiếp.
