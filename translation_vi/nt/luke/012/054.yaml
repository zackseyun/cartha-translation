id: LUK.12.54
reference: Luke 12:54
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: vi
  text: 'Ngài cũng nói với các đám đông: “Khi thấy một đám mây nổi lên ở phía tây, các ông lập tức nói: ‘Một trận mưa sắp đến,’[a] và quả đúng như vậy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trời sắp mưa.” Từ Hy Lạp ὄμβρος có thể chỉ mưa nói chung hoặc cụ thể hơn là một trận mưa lớn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ngài cũng nói
  rationale: Thì chưa hoàn thành đặt lời nói trong diễn tiến của trình thuật; tiếng Việt không bắt buộc đánh dấu thể này bằng một cấu trúc riêng, và “nói” tự nhiên hơn “đang nói” trong ngữ cảnh.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Giữ sắc thái bổ sung của καὶ, còn δέ được thể hiện tự nhiên qua sự tiếp nối câu chuyện mà không cần dịch riêng.
- source_word: τοῖς ὄχλοις
  choice: với các đám đông
  rationale: Giữ rõ hình thức số nhiều của danh từ Hy Lạp và dùng cách nói hiện đại.
- source_word: Ὅταν ἴδητε
  choice: Khi thấy
  rationale: Ὅταν với lối giả định diễn tả tình huống thường xảy ra; “khi” tự nhiên trong tiếng Việt, còn chủ ngữ được hiểu từ lời xưng hô tiếp theo.
- source_word: νεφέλην
  choice: một đám mây
  rationale: Dịch đúng nghĩa cơ bản “mây”, không thêm ý “mây mưa” vốn chỉ do ngữ cảnh gợi ra.
- source_word: ἀνατέλλουσαν
  choice: nổi lên
  rationale: Diễn đạt tự nhiên hình ảnh đám mây xuất hiện và dâng lên ở chân trời.
- source_word: ἐπὶ δυσμῶν
  choice: ở phía tây
  rationale: Phù hợp với phạm vi nghĩa “ở/từ phía tây” và giữ sự mơ hồ định hướng nhẹ của nguyên văn.
- source_word: εὐθέως
  choice: lập tức
  rationale: Giữ đầy đủ sắc thái tức thời của trạng từ.
- source_word: λέγετε
  choice: các ông ... nói
  rationale: Thì hiện tại mang nghĩa thói quen; “các ông” phù hợp lời trực tiếp nói với đám đông và phân biệt với lối xưng hô thiếu trang trọng.
- source_word: Ὄμβρος
  choice: một trận mưa
  rationale: ὄμβρος có thể chỉ mưa nói chung hoặc một trận mưa lớn; “một trận mưa” tự nhiên, cụ thể nhưng không nhất thiết nâng mức độ thành mưa bão.
- source_word: ἔρχεται
  choice: sắp đến
  rationale: Diễn đạt rõ sắc thái hiện tại chỉ điều sắp xảy ra trong lời dự báo thời tiết.
- source_word: καὶ γίνεται οὕτως
  choice: và quả đúng như vậy
  rationale: Truyền đạt tự nhiên việc lời dự đoán thực sự ứng nghiệm, đồng thời giữ lực xác nhận của οὕτως.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su và “các ông” trong lời Ngài nói với đám đông. Dấu chú thích [a] được đặt ngay sau lời dự báo mà chú thích giải nghĩa.
