source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: vi
  text: 'Nhưng Đức Chúa Trời phán với ông: “Đồ dại! Chính đêm nay, mạng sống của ngươi sẽ bị đòi lại[a]. Còn những gì ngươi đã chuẩn bị sẽ thuộc về ai?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “linh hồn của ngươi sẽ bị đòi lại.” Từ Hy Lạp có thể có nghĩa là “mạng sống” hoặc “linh hồn,” tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Đồ dại!
  rationale: Tính từ ở hô cách dùng để quở trách trực tiếp. “Đồ dại!” tự nhiên, mạnh và trang trọng vừa đủ trong tiếng Việt, không thêm ý ngoài nguyên văn.
- source_word: ταύτῃ τῇ νυκτί
  choice: Chính đêm nay
  rationale: Cụm chỉ thời gian với đại từ chỉ định nhấn mạnh tính tức thời; “chính đêm nay” diễn đạt tự nhiên sự nhấn mạnh ấy.
- source_word: ψυχήν
  choice: mạng sống
  rationale: Trong bối cảnh người này sắp chết, ψυχή chủ yếu chỉ sự sống của ông. “Mạng sống” phù hợp ngữ cảnh, còn nghĩa “linh hồn” được giữ trong chú thích để không xóa bỏ phạm vi nghĩa của từ Hy Lạp.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: sẽ bị đòi lại
  rationale: Động từ số nhiều không nêu chủ thể được chuyển thành cấu trúc bị động vô nhân xưng tự nhiên trong tiếng Việt, tránh tự ý xác định tác nhân. “Đòi lại” giữ sắc thái thu hồi của ἀπαιτέω; thì tương lai trong tiếng Việt diễn đạt sự việc sắp xảy ra ngay trong đêm ấy.
- source_word: ἃ δὲ ἡτοίμασας
  choice: những gì ngươi đã chuẩn bị
  rationale: Bám sát đại từ quan hệ trung tính số nhiều và động từ hoàn thành trong mạch kể, đồng thời tự nhiên trong tiếng Việt.
- source_word: τίνι ἔσται
  choice: sẽ thuộc về ai?
  rationale: Dữ cách nghi vấn ở đây biểu thị sự sở hữu; cách dịch này rõ nghĩa và giữ nguyên sức nặng tu từ của câu hỏi.
theological_decisions:
- issue: Cách dịch ψυχή trong bối cảnh cái chết
  choice: mạng sống
  alternative: linh hồn
  rationale: Mạch văn nói đến cái chết sắp xảy ra và việc người giàu mất sự sống trần thế. “Mạng sống” không áp đặt một quan niệm nhân học hẹp hơn ngữ cảnh; “linh hồn” vẫn được nêu ở chú thích vì ψυχή có thể mang nghĩa đó.
- issue: Chủ thể của động từ ἀπαιτοῦσιν số nhiều
  choice: 'cấu trúc bị động vô nhân xưng: “sẽ bị đòi lại”'
  alternative: “họ sẽ đòi lại” hoặc xác định Đức Chúa Trời/thiên sứ là tác nhân
  rationale: Nguyên văn không nói rõ chủ thể của động từ số nhiều. Cấu trúc bị động bảo toàn sự không xác định này và tránh nhập thêm tác nhân thần học.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “ngươi” phù hợp lời phán trực tiếp mang tính quở trách trong văn cảnh Kinh Thánh. Dấu gạch tách ý của bản tiếng Anh được chuyển thành hai câu để lời Việt tự nhiên và câu hỏi kết thúc có sức nặng.
