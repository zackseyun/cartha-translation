source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: vi
  text: Nhưng ngay cả tóc trên đầu anh em cũng đều đã được đếm. Đừng sợ; anh em quý giá hơn nhiều chim sẻ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Nhưng ngay cả
  rationale: Giữ sắc thái tương phản của ἀλλά và ý nhấn mạnh của καί, nối với lời bảo đảm ở câu trước.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: tóc trên đầu các con ... hết
  rationale: Diễn đạt tự nhiên bằng tiếng Việt, đồng thời giữ hình ảnh cụ thể và ý toàn bộ của πᾶσαι.
- source_word: ἠρίθμηνται
  choice: đã được đếm
  rationale: Thể hoàn thành bị động chỉ hành động đã hoàn tất với kết quả còn hiệu lực; cách dịch này rõ ràng và không cần nêu tác nhân vốn được hàm ý là Đức Chúa Trời.
- source_word: μὴ φοβεῖσθε
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định trực tiếp, ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: πολλῶν στρουθίων
  choice: nhiều chim sẻ
  rationale: Giữ đúng loài chim và sự liên tục với ngữ cảnh gần.
- source_word: διαφέρετε
  choice: các con quý giá hơn
  rationale: Trong ngữ cảnh lập luận từ vật kém giá trị hơn đến người môn đồ, động từ diễn tả giá trị vượt trội; “quý giá hơn” tự nhiên và nhấn mạnh giá trị trong mắt Đức Chúa Trời.
theological_decisions:
- issue: Lời so sánh giá trị của các môn đồ với chim sẻ
  choice: các con quý giá hơn nhiều chim sẻ
  alternative: các con có giá trị hơn nhiều chim sẻ
  rationale: “Quý giá hơn” truyền đạt phép so sánh theo ngữ cảnh về sự chăm sóc chu đáo của Đức Chúa Trời, nhưng không mở rộng thành một khẳng định triết học vượt quá câu văn.
- issue: Tác nhân của hành động đếm
  choice: Giữ cấu trúc bị động, không thêm “Đức Chúa Trời”
  alternative: Đức Chúa Trời đã đếm hết tóc trên đầu các con
  rationale: Nguyên văn dùng thể bị động và không nêu tác nhân. Bản dịch giữ điều đó, dù ngữ cảnh cho thấy tác nhân thần linh được hàm ý.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các con” để phản ánh ngôi thứ hai số nhiều trong lời Đức Chúa Jêsus nói với các môn đồ và giữ giọng thân mật, có thẩm quyền. Không thêm chú thích vì các phương án từ vựng không tạo ra khác biệt đáng kể cần thiết cho người đọc.
