review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc phủ định kép và hai mệnh đề quan hệ song song của nguyên ngữ. Tuy nhiên, “phơi bày” thường gợi sắc thái vạch trần tiêu cực mạnh hơn ἀποκαλυφθήσεται; “được bày tỏ” trung tính hơn và sát với sự đối lập che phủ/mặc khải. Cụm “kín giấu” không tự nhiên trong tiếng Việt hiện đại.
  naturalness: 'Câu sửa dùng các cụm quen thuộc, rõ nghĩa và song hành: “bị che đậy/được bày tỏ” và “bị giấu kín/được biết đến.”'
  terminology: “Được bày tỏ” truyền đạt ἀποκαλύπτω mà không áp đặt ý nghĩa đạo đức như “phơi bày.” “Bị giấu kín” là cách diễn đạt hiện đại, tự nhiên cho κρυπτός.
  issues:
  - severity: medium
    issue: “Kín giấu” không phải là một kết hợp từ tự nhiên trong tiếng Việt hiện đại.
    rationale: κρυπτός diễn tả điều bị ẩn/giấu; “bị giấu kín” vừa tự nhiên vừa bảo toàn tính từ/phẩm chất bị che giấu.
  - severity: low
    issue: “Phơi bày” có thể thu hẹp hoặc tăng sắc thái của ἀποκαλυφθήσεται.
    rationale: Động từ Hy Lạp nói đến việc được vén mở, bộc lộ; không nhất thiết là việc vạch trần đáng xấu hổ. “Được bày tỏ” phù hợp hơn trong câu nguyên tắc tổng quát này.
  - severity: low
    issue: Chú thích c dùng cụm “sự phơi bày cuối cùng, dù xảy ra trong hiện tại,” có tính tự mâu thuẫn về diễn đạt.
    rationale: Nguyên ngữ chỉ xác định sự bộc lộ trong tương lai, không xác định thời điểm. Chú thích nên phân biệt khả năng hiện tại với phán xét cuối cùng.
