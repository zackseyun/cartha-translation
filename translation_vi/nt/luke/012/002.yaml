  rationale: Bản sửa thay các cách diễn đạt kém tự nhiên hoặc mang sắc thái mạnh hơn nguyên ngữ bằng từ ngữ hiện đại, trung tính và song hành, đồng thời làm rõ chú thích về thời điểm bộc lộ mà không quyết định một cách hiểu thần học cụ thể.
