source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: vi
  text: Nhưng không có gì bị che đậy[a] mà sẽ không được bày tỏ,[c] cũng không có gì bị giấu kín mà sẽ không được biết đến.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “bị giấu kín” thay cho “bị che đậy”; tiếng Hy Lạp dùng hình ảnh một vật bị phủ che rồi được bày tỏ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch “điều bí mật” thay cho “gì bị giấu kín”.
    reason: lexical_alternative
  - marker: c
    text: Lời này có thể nói rộng về sự bộc lộ về sau, có thể trong hiện tại hoặc tại cuộc phán xét cuối cùng.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: không có gì
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ nguyên phạm vi tuyệt đối của đại từ phủ định.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự tiếp nối có sắc thái tương phản nhẹ trong mạch cảnh báo trước đó.
- source_word: συγκεκαλυμμένον
  choice: bị che đậy
  rationale: Giữ hình ảnh một điều đã bị phủ che và hiện đang ở trong trạng thái bị che giấu; thể bị động cũng phản ánh phân từ hoàn thành bị động Hy Lạp.
- source_word: ἀποκαλυφθήσεται
  choice: sẽ không bị phơi bày
  rationale: Giữ thể tương lai bị động và tạo thế đối lập rõ với 'bị che đậy'; 'phơi bày' tự nhiên khi nói về điều bị giấu được đưa ra ánh sáng.
- source_word: κρυπτὸν
  choice: kín giấu
  rationale: Diễn đạt phẩm chất ẩn kín mà không mặc nhiên biến từ này thành danh từ 'bí mật'.
- source_word: γνωσθήσεται
  choice: sẽ không được biết đến
  rationale: Giữ sắc thái tương lai và bị động/kết quả của động từ Hy Lạp trong tiếng Việt tự nhiên.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: mà sẽ không
  rationale: Tái hiện hai mệnh đề quan hệ phủ định song song bằng cấu trúc tiếng Việt rõ ràng.
theological_decisions:
- issue: Phạm vi và thời điểm của sự phơi bày
  choice: 'Trình bày như một nguyên tắc tổng quát: điều hiện đang bị che giấu cuối cùng sẽ bị phơi bày hoặc được biết đến.'
  alternative: Chỉ sự phơi bày trong hiện tại, hoặc riêng sự phơi bày tại cuộc phán xét cuối cùng.
  rationale: Các động từ tương lai bị động xác nhận sự bộc lộ về sau nhưng không xác định thời điểm; bản dịch không thu hẹp câu nói vào riêng hiện tại hay thời kỳ cuối cùng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Hai vế được giữ song song; cách dùng 'bị che đậy/phơi bày' duy trì hình ảnh của nguyên ngữ, còn 'kín giấu/được biết đến' giữ sự chuyển đổi từ hình ảnh sang nhận biết.
