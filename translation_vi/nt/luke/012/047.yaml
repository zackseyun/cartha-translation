revisions:
- from: Nhưng đầy tớ ấy, người đã biết ý chủ mình mà không chuẩn bị hoặc không làm theo ý chủ, sẽ bị đánh nhiều roi.[a]
  to: Nhưng người nô lệ ấy, người đã biết ý của chủ mình mà không chuẩn bị hoặc không làm theo ý chủ mình, sẽ bị đánh nhiều đòn.[a]
  rationale: Thay «đầy tớ» bằng «người nô lệ» để phản ánh δοῦλος sát hơn, và thay «nhiều roi» bằng «nhiều đòn» để biểu đạt đúng tính từ πολλάς với danh từ hàm ẩn. Các yếu tố còn lại được giữ nguyên về nghĩa, gồm liên từ «hoặc», đối tượng không nêu rõ của «chuẩn bị», và «chủ mình» trong bối cảnh dụ ngôn.
  reviewer_model: gpt-5.6-terra
