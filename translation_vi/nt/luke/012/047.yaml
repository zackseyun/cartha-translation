language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: vi
  text: Nhưng người nô lệ ấy, người đã biết ý của chủ mình mà không chuẩn bị hoặc không làm theo ý chủ mình, sẽ bị đánh nhiều đòn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “sẽ bị đánh nhiều lần” hoặc “sẽ nhận nhiều đòn.” Trong tiếng Hy Lạp, danh từ được bổ nghĩa bởi từ “nhiều” được để hàm ẩn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Trong tiếng Việt hiện đại, “đầy tớ” diễn đạt tự nhiên người thuộc quyền chủ trong bối cảnh dụ ngôn. “Nô lệ” làm nổi bật hơn thân phận lệ thuộc nhưng dễ khiến câu mang sắc thái lịch sử-xã hội nặng hơn dụng ý trực tiếp của văn cảnh.
- source_word: γνοὺς
  choice: đã biết
  rationale: Phân từ bất định chỉ sự biết có trước những điều người ấy không làm; “đã biết” chuyển tải rõ quan hệ này.
- source_word: θέλημα
  choice: ý
  rationale: “Ý chủ mình” là cách nói tự nhiên, trang trọng vừa phải, bao gồm điều chủ mong muốn hay định liệu mà không diễn giải thành một mệnh lệnh cụ thể.
- source_word: κυρίου αὐτοῦ
  choice: chủ mình
  rationale: κύριος ở đây chỉ người chủ trong quan hệ gia hộ của dụ ngôn, nên “chủ” phù hợp hơn danh hiệu thần học “Chúa”; “mình” chỉ về người đầy tớ.
- source_word: ἑτοιμάσας
  choice: chuẩn bị
  rationale: Giữ nguyên sự không xác định của bổ ngữ trong tiếng Hy Lạp; câu không nói rõ người ấy phải chuẩn bị điều gì.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: hoặc không làm theo ý chủ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt và giữ liên từ ἢ (“hoặc”), không tự ý hóa thành một quan hệ khác.
- source_word: δαρήσεται πολλάς
  choice: sẽ bị đánh nhiều roi
  rationale: Động từ tương lai bị động diễn tả việc bị đánh; πολλάς là tính từ giống cái số nhiều dùng tỉnh lược một danh từ như “đòn/roi”. “Nhiều roi” giữ hình ảnh cụ thể và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh dụ ngôn gia hộ
  choice: chủ
  alternative: Chúa
  rationale: Trong câu này, từ ngữ trực tiếp mô tả quan hệ giữa đầy tớ và chủ. “Chủ” giữ đúng tầng nghĩa của câu chuyện mà không xóa bỏ khả năng quy chiếu rộng hơn của dụ ngôn.
- issue: Cụm tỉnh lược πολλάς
  choice: bị đánh nhiều roi
  alternative: bị đánh đòn nhiều lần; bị đánh nặng
  rationale: Tiếng Hy Lạp để danh từ được bổ nghĩa ở dạng hàm ẩn. Bổ sung “roi” giúp câu tiếng Việt rõ nghĩa nhưng không biến số lượng “nhiều” thành nhận định diễn giải “nặng”.
- issue: Quan hệ giữa hai điều không làm
  choice: không chuẩn bị hoặc không làm theo ý chủ
  alternative: không chuẩn bị cũng không làm theo ý chủ
  rationale: Giữ ἢ là “hoặc”, bảo tồn khả năng hai thiếu sót được nêu như những phương án phân biệt thay vì khẳng định nhất thiết cả hai cùng xảy ra.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm vừa phải. Cấu trúc giữ sự đối lập mở đầu bằng “Nhưng”, quan hệ sở hữu trong “chủ mình”, và sự tỉnh lược về đối tượng của “chuẩn bị”. Dấu chú thích [a] đặt ngay sau cụm cần giải thích.
