language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: vi
  text: thì chủ của người nô lệ ấy sẽ đến vào ngày người ấy không ngờ và vào giờ người ấy không biết, rồi chém người ấy làm đôi[a] và ấn định phần của người ấy cùng với những kẻ bất trung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số người hiểu cách nói này theo nghĩa bóng là: “trừng phạt người ấy nghiêm khắc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những kẻ không tin.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: chủ
  rationale: Trong cụm “chủ của đầy tớ ấy”, từ này chỉ người chủ trong quan hệ gia chủ–đầy tớ của dụ ngôn; “chủ” tự nhiên và không biến cách nói trong câu chuyện thành một tước hiệu trực tiếp.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: “Đầy tớ” là cách gọi tự nhiên, trang trọng trong tiếng Việt cho người thuộc quyền chủ trong bối cảnh gia đình cổ; quan hệ lệ thuộc vẫn được làm rõ bởi cụm “chủ của đầy tớ”.
- source_word: ἥξει
  choice: sẽ đến
  rationale: Diễn đạt trực tiếp thì tương lai và sự xuất hiện của người chủ trong bối cảnh cảnh báo.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: vào ngày anh ta không ngờ
  rationale: προσδοκάω nói đến sự trông đợi; “không ngờ” tự nhiên trong tiếng Việt và hàm ý anh ta không chờ chủ đến mà không cần thêm một tân ngữ không có trong nguyên văn.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: vào giờ anh ta không biết
  rationale: Giữ đúng nghĩa “biết” của γινώσκω và duy trì sự phân biệt với ý “không ngờ” ở vế trước.
- source_word: διχοτομήσει
  choice: chém anh ta làm đôi
  rationale: Động từ có nghĩa đen là cắt/chia làm hai. “Chém… làm đôi” giữ được hình ảnh dữ dội và tự nhiên hơn “cắt… làm hai” khi đối tượng là một người.
- source_word: τὸ μέρος αὐτοῦ
  choice: phần của anh ta
  rationale: μέρος có nghĩa là phần, phần được chia hoặc số phận được phân định. Cách dịch sát “phần” bảo toàn hình ảnh và sự mơ hồ của nguyên ngữ.
- source_word: ἀπίστων
  choice: những kẻ bất trung
  rationale: Trong mạch dụ ngôn về một đầy tớ không trung tín, “bất trung” phù hợp với quan hệ trách nhiệm; nghĩa “không tin” vẫn được ghi ở chú thích.
- source_word: θήσει
  choice: định
  rationale: τίθημι ở đây mang ý đặt hoặc ấn định phần của một người; “định phần” diễn đạt ngắn gọn sắc thái phán quyết.
theological_decisions:
- issue: Nên giữ nghĩa đen của hình phạt hay diễn giải như một thành ngữ chỉ sự trừng phạt nặng nề
  choice: Giữ hình ảnh “chém anh ta làm đôi” trong chính văn
  alternative: “trừng phạt anh ta nghiêm khắc”
  rationale: Nguyên văn dùng một động từ cụ thể và dữ dội; làm nhẹ thành ý trừng phạt chung sẽ giải quyết trước một vấn đề diễn giải. Chú thích ghi nhận cách hiểu thành ngữ.
- issue: ἀπίστων nói đến sự bất trung hay không tin
  choice: Dịch “những kẻ bất trung” trong chính văn
  alternative: “những kẻ không tin”
  rationale: Bối cảnh gần nhấn mạnh lòng trung tín của đầy tớ, nhưng từ Hy Lạp cũng có thể chỉ người không tin. Chú thích bảo tồn cả sức nặng thần học của nghĩa thứ hai.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh ta” để quy chiếu rõ đến đầy tớ, “chủ” cho quan hệ trong dụ ngôn, và giữ cấu trúc song hành “vào ngày… vào giờ…”. Mọi dấu chú thích đều xuất hiện trong chính văn.
