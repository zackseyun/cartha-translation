id: LUK.12.26
reference: Luke 12:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: vi
  text: Vậy, nếu anh em không làm nổi ngay cả việc nhỏ nhất, tại sao lại lo lắng về những việc còn lại?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Vậy, nếu
  rationale: Giữ cả sắc thái điều kiện của εἰ và mối liên kết suy luận của οὖν với lập luận ngay trước đó; trật tự này tự nhiên trong tiếng Việt hiện đại.
- source_word: οὐδὲ ἐλάχιστον
  choice: không làm nổi ngay cả việc nhỏ nhất
  rationale: ἐλάχιστον là tính từ trung tính được dùng như danh từ, chỉ việc nhỏ nhất; thêm “việc” làm rõ cấu trúc tỉnh lược mà không giải thích quá mức.
- source_word: δύνασθε
  choice: làm nổi
  rationale: Diễn đạt tự nhiên ý về khả năng của δύναμαι trong câu phủ định, đồng thời kết hợp gọn với “việc nhỏ nhất”.
- source_word: τί
  choice: tại sao
  rationale: Trong câu hỏi tu từ này, τί mang nghĩa hỏi nguyên do hơn là nghĩa đen “điều gì”.
- source_word: περὶ τῶν λοιπῶν
  choice: về những việc còn lại
  rationale: Giữ rõ sự đối chiếu giữa “việc nhỏ nhất” và các vấn đề còn lại; cụ thể hơn “phần còn lại” trong tiếng Việt.
- source_word: μεριμνᾶτε
  choice: lo lắng
  rationale: “Lo lắng” diễn đạt đúng trạng thái bất an trong văn mạch, trang trọng và thông dụng, nhưng không hàm ý cấm mọi sự quan tâm thận trọng.
theological_decisions:
- issue: Sắc thái của μεριμνάω trong lời dạy về sự nương cậy Đức Chúa Trời
  choice: lo lắng
  alternative: lo; bận tâm
  rationale: “Lo lắng” phù hợp với mạch văn nói về sự bất an, nhưng không tự động biến lời dạy thành sự phủ nhận mọi quan tâm hoặc dự liệu chính đáng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều theo văn mạch diễn từ; câu hỏi tu từ và sự căng thẳng giữa giới hạn của con người với thói lo lắng được giữ nguyên.
