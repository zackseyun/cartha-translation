id: LUK.12.8
reference: Luke 12:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: vi
  text: 'Ta nói với anh em: Bất cứ ai xưng nhận Ta[a] trước mặt người đời, thì Con Người cũng sẽ xưng nhận người ấy trước mặt các thiên sứ của Đức Chúa Trời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể dịch sát là “xưng nhận trong Ta”; tương ứng, vế sau là “xưng nhận trong người ấy”. Trong cấu trúc này, ý chính là công khai nhìn nhận Chúa Giê-su và được Con Người nhìn nhận.
    reason: Bảo tồn hình thức ἐν + tặng cách khác thường và sự mơ hồ có thật, trong khi bản văn chính dùng cách diễn đạt tự nhiên bằng tiếng Việt.
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Ta nói với anh em
  rationale: Diễn đạt tự nhiên một lời khẳng định trực tiếp và trang trọng. δέ chỉ liên kết nhẹ với mạch văn nên không cần nhấn mạnh sự tương phản bằng “nhưng”; “anh em” thể hiện đại từ số nhiều trong văn cảnh Chúa Giê-su nói với các môn đồ.
- source_word: πᾶς ὃς ἂν
  choice: bất cứ ai
  rationale: Truyền đạt điều kiện khái quát, không xác định và phạm vi bao quát của cấu trúc Hy Lạp.
- source_word: ὁμολογήσῃ … ὁμολογήσει
  choice: xưng nhận … sẽ xưng nhận
  rationale: “Xưng nhận” diễn tả việc công khai nhìn nhận một người và giữ nguyên sự lặp lại có chủ ý của cùng một động từ trong hai vế.
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: Ta … người ấy
  rationale: Khi đi với ὁμολογέω, ἐν + tặng cách được hiểu theo lối thành ngữ là xưng nhận một người. Cách dịch này tự nhiên trong tiếng Việt và vẫn giữ quan hệ tương ứng giữa hai vế; dạng sát chữ được ghi ở chú thích.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: trước mặt người đời
  rationale: “Trước mặt” giữ ý công khai, còn “người đời” chỉ loài người nói chung, phù hợp với lực đại diện của danh từ số nhiều ἀνθρώπων mà không giới hạn vào nam giới.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng đặc trưng Chúa Giê-su dùng về chính mình và âm hưởng thần học của danh xưng ấy.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: trước mặt các thiên sứ của Đức Chúa Trời
  rationale: Chuyển tải trực tiếp khung cảnh lời chứng công khai trước các thiên sứ thuộc về Đức Chúa Trời.
theological_decisions:
- issue: Cách hiểu công thức ὁμολογέω với ἐν + tặng cách
  choice: Dịch theo thành ngữ là “xưng nhận Ta … xưng nhận người ấy”.
  alternative: Dịch sát hình thức là “xưng nhận trong Ta … xưng nhận trong người ấy”.
  rationale: Bản dịch chính cần truyền đạt rõ hành động công khai nhìn nhận Chúa Giê-su và sự nhìn nhận tương ứng của Con Người, nhưng chú thích bảo tồn hình thức khác thường và khả năng diễn giải của nguyên văn.
- issue: Phạm vi của ἀνθρώπων
  choice: “người đời”, hiểu là con người nói chung.
  alternative: “những người nam” hoặc “mọi người”.
  rationale: Trong câu này, dạng giống đực số nhiều có lực đại diện cho con người nói chung. “Người đời” vừa tự nhiên vừa giữ sự đối chiếu giữa diễn đàn trần thế và các thiên sứ trên trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời Chúa Giê-su và “anh em” cho đại từ số nhiều; tránh các đại từ cổ như “các ngươi”. “Xưng nhận” được chọn vì giữ sắc thái tuyên xưng công khai và sự lặp từ giữa hai vế.
