id: LUK.12.51
reference: Luke 12:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: vi
  text: 'Anh em tưởng rằng tôi đến để ban hòa bình trên đất sao? Không, tôi nói với anh em: trái lại, là sự chia rẽ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trên đất” cũng có thể dịch là “trong xứ”, nhưng ngữ cảnh ở đây có lẽ mang nghĩa rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: Anh em tưởng rằng
  rationale: Diễn đạt tự nhiên câu hỏi tu từ hướng đến nhiều người nghe, đồng thời giữ sắc thái trực tiếp thách thức điều họ đang nghĩ.
- source_word: εἰρήνην
  choice: hòa bình
  rationale: Giữ nghĩa rộng của εἰρήνη, ở đây đặc biệt liên quan đến sự hòa thuận giữa người với người chứ không chỉ sự bình an nội tâm.
- source_word: παρεγενόμην
  choice: tôi đến
  rationale: Động từ aorist παραγίνομαι trong cấu trúc này nói về việc Đức Giê-su đến với một mục đích; cách dịch ngắn gọn và tự nhiên.
- source_word: δοῦναι
  choice: để ban
  rationale: Theo sát nghĩa căn bản là “cho”; “ban” phù hợp văn phong trang trọng và kết hợp tự nhiên với “hòa bình”, mà không chuyển sang cách diễn giải “đem lại”.
- source_word: ἐν τῇ γῇ
  choice: trên đất
  rationale: γῆ có thể là “đất” hoặc “xứ”; ngữ cảnh nghiêng về phạm vi rộng. “Trên đất” giữ được độ rộng mà không buộc phải hiểu là toàn thể hành tinh theo nghĩa hiện đại.
- source_word: οὐχί
  choice: Không
  rationale: Câu phủ định dứt khoát đáp lại câu hỏi tu từ; “Không” ngắn gọn và mạnh.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ sát công thức diễn ngôn quen thuộc và làm rõ lời khẳng định trực tiếp với số nhiều người nghe.
- source_word: ἀλλ’ ἢ
  choice: nhưng đúng hơn là
  rationale: 'Thể hiện sự tương phản mạnh sau lời phủ định: không phải hòa bình, mà trái lại là điều được nêu sau đó.'
- source_word: διαμερισμόν
  choice: sự chia rẽ
  rationale: Từ này chỉ sự phân chia hoặc bất hòa, được các câu kế tiếp minh họa bằng sự chia rẽ trong gia đình; “sự chia rẽ” trực tiếp và đủ rộng.
theological_decisions:
- issue: Có nên làm nhẹ sự căng thẳng giữa lời này và những đoạn Kinh Thánh nói về hòa bình hay không
  choice: Giữ nguyên sự tương phản sắc bén giữa “hòa bình” và “sự chia rẽ”.
  alternative: Diễn giải thành “xung đột”, hoặc thêm ý rằng chia rẽ chỉ là hậu quả ngẫu nhiên.
  rationale: Bản Hy Lạp cố ý diễn đạt mạnh. Ngữ cảnh nói đến tác động gây phân rẽ của sứ mạng Đức Giê-su giữa con người, nhất là trong gia đình; bản dịch không nên tự ý hòa giải hoặc làm nhẹ sự căng thẳng thần học này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho ὑμῖν số nhiều trong lời Đức Giê-su nói với các môn đồ và đám đông; giữ “ban hòa bình” để phản ánh động từ δοῦναι, đồng thời tránh văn phong quá cổ.
