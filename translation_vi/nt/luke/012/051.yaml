  naturalness: Câu văn nhìn chung hiện đại, trang trọng và dễ hiểu. Thay “nhưng đúng hơn là” bằng “trái lại, là” giúp đoạn kết tự nhiên hơn trong tiếng Việt và giữ nhịp đối đáp nhấn mạnh của nguyên ngữ.
  terminology: “Anh em,” “ban hòa bình,” “trên đất,” và “sự chia rẽ” đều phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Sự chia rẽ” giữ được nghĩa rộng của διαμερισμόν mà không diễn giải thành một dạng xung đột cụ thể.
