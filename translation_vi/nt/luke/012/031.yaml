  source_fidelity: 'Bản dịch bám sát SBLGNT: πλὴν được chuyển là “Nhưng”; mệnh lệnh hiện tại ζητεῖτε là “hãy tìm kiếm”; τὴν βασιλείαν αὐτοῦ là “vương quốc của Ngài”; và mệnh đề tương lai bị động καὶ ταῦτα προστεθήσεται ὑμῖν được diễn đạt đúng là “thì những điều ấy cũng sẽ được ban thêm cho anh em.” Bản dịch không thêm “tất cả,” phù hợp với ταῦτα trong bản văn được cung cấp. “Ban thêm” diễn đạt tự nhiên thể bị động và ý thêm vào, mà không nêu minh thị tác nhân vốn không có trong mệnh đề Hy Lạp.'
  naturalness: Câu văn hiện đại, trang trọng, dễ đọc. “Hãy tìm kiếm,” “vương quốc,” và “anh em” phù hợp ngữ cảnh Chúa Giê-su nói với các môn đồ. Liên từ “thì” làm rõ quan hệ hệ quả vốn được ngữ cảnh hàm ý; “cũng” tự nhiên với ý “ban thêm” và không làm thay đổi nghĩa.
