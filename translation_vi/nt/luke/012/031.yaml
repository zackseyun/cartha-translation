id: LUK.12.31
reference: Luke 12:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: vi
  text: Nhưng hãy tìm kiếm vương quốc của Ngài[b][a], thì những điều ấy cũng sẽ được ban thêm cho anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vương quốc Đức Chúa Trời”; tiếng Hy Lạp chép “vương quốc của Ngài,” và ngữ cảnh cho biết “Ngài” chỉ về Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “vương quốc Đức Chúa Trời” thay cho “vương quốc của Ngài.”
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn tả sự tương phản với việc lo lắng tìm kiếm các nhu cầu vật chất ở phần trước, đồng thời tự nhiên và súc tích trong tiếng Việt.
- source_word: ζητεῖτε
  choice: hãy tìm kiếm
  rationale: Giữ sắc thái mệnh lệnh và có thể tự nhiên bao hàm sự theo đuổi liên tục mà không cần diễn giải thêm thành “hãy không ngừng tìm kiếm”.
- source_word: βασιλείαν
  choice: vương quốc
  rationale: Là cách dịch quen thuộc, có thể bao quát cả quyền cai trị lẫn lãnh vực cai trị; tránh thu hẹp nghĩa chỉ còn “sự trị vì” hay “quyền cai trị”.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Giữ đại từ của bản Hy Lạp; trong ngữ cảnh, từ này quy chiếu về Đức Chúa Trời. Viết hoa “Ngài” giúp câu tự nhiên theo quy ước tiếng Việt nhưng không thay đại từ bằng danh xưng.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Quy chiếu về các nhu cầu vừa được nói đến. Không thêm “tất cả” vì bản văn Hy Lạp được cung cấp không có πάντα, nhờ đó tránh hòa đồng với câu song song trong Ma-thi-ơ.
- source_word: προστεθήσεται
  choice: cũng sẽ được ban thêm
  rationale: Giữ hình ảnh “thêm vào” của động từ và thể bị động, đồng thời “ban” diễn đạt tự nhiên rằng những nhu cầu ấy đến từ sự chăm sóc của Đức Chúa Trời. “Cũng” thể hiện ý bổ sung vốn có trong động từ.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Diễn đạt tự nhiên túc từ gián tiếp số nhiều trong tiếng Việt. “Anh em” phù hợp lời Chúa Giê-su nói với các môn đồ trong ngữ cảnh.
theological_decisions:
- issue: Đối tượng quy chiếu của αὐτοῦ
  choice: Giữ đại từ là “của Ngài,” với Đức Chúa Trời là đối tượng được xác định từ ngữ cảnh.
  alternative: Dịch tường minh là “vương quốc Đức Chúa Trời.”
  rationale: Ngữ cảnh nói về Đức Chúa Trời và Cha của người nghe nên đối tượng quy chiếu khá rõ; giữ đại từ bảo toàn hình thức của bản văn được cung cấp và không làm mất biến thể thủ bản.
- issue: Ý nghĩa của βασιλεία
  choice: Dịch là “vương quốc,” không quyết định riêng là quyền trị vì hay lãnh vực cai trị.
  alternative: “sự trị vì” hoặc “quyền cai trị.”
  rationale: Từ Hy Lạp có thể bao hàm nhiều chiều kích; “vương quốc” giữ được độ rộng và sự căng thẳng thần học của thuật ngữ trong Lu-ca.
- issue: Thể bị động của προστεθήσεται
  choice: 'Giữ thể bị động: “sẽ được ban thêm,” để tác nhân được hiểu từ ngữ cảnh.'
  alternative: Dịch chủ động là “Đức Chúa Trời sẽ ban thêm.”
  rationale: Bản văn không nêu tác nhân trong mệnh đề này. Không thêm chủ ngữ minh nhiên giúp giữ cấu trúc và sự hàm ẩn của nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hãy tìm kiếm” cho mệnh lệnh, “vương quốc” để giữ phạm vi nghĩa rộng, và “anh em” cho đại từ số nhiều trong lời nói với các môn đồ. Thứ tự dấu chú thích [b][a] theo lớp tham khảo đã kiểm định và cả hai dấu đều xuất hiện ngay sau cụm từ liên quan.
