  source_fidelity: 'Bản nháp giữ đúng các thành tố chính: γάρ (“vì”), chủ ngữ “Đức Thánh Linh,” động từ tương lai “sẽ dạy,” đối tượng số nhiều “anh em,” và nội dung “những điều phải nói.” Tuy nhiên, từ “chính” trong chính văn hiện đứng trước “Đức Thánh Linh,” trong khi αὐτῇ nhấn mạnh “giờ ấy,” không nhấn mạnh chủ ngữ. Đây là sự chuyển sai trọng tâm cú pháp cần sửa.'
