  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: vi
  text: vì Đức Thánh Linh sẽ dạy anh em ngay trong giờ ấy những điều phải nói.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay vào giờ ấy” hoặc “trong chính giờ ấy.” Cụm từ Hy Lạp nhấn mạnh đúng thời điểm cần thiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: vì
  rationale: Giữ chức năng giải thích và nối lời bảo đảm này với câu trước.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Đức Thánh Linh
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt hiện đại, chỉ Thần Linh thánh của Đức Chúa Trời đang hành động như một chủ thể.
- source_word: διδάξει ὑμᾶς
  choice: sẽ dạy anh em
  rationale: Diễn đạt trực tiếp thì tương lai của διδάσκω; “anh em” cho thấy đại từ ὑμᾶς ở số nhiều.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ngay trong giờ ấy
  rationale: “Ngay” chuyển tải sắc thái nhấn mạnh của αὐτῇ, còn “trong giờ ấy” giữ hình thức thời gian của nguyên văn.
- source_word: ἃ δεῖ εἰπεῖν
  choice: những điều phải nói
  rationale: Giữ ý nội dung số nhiều của ἃ và sắc thái cần thiết của δεῖ bằng lối diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Vai trò của Đức Thánh Linh
  choice: Đức Thánh Linh là chủ thể đích thân dạy các môn đồ điều cần nói
  alternative: Một ảnh hưởng hoặc sự soi dẫn thần thượng mang tính phi ngôi vị
  rationale: Nguyên văn đặt τὸ ἅγιον πνεῦμα làm chủ ngữ của động từ chủ động “sẽ dạy”; bản dịch giữ cách trình bày này mà không thêm các định thức tín lý ngoài câu.
- issue: Sắc thái của δεῖ
  choice: phải nói
  alternative: nên nói; cần nói
  rationale: “Phải” bảo tồn sắc thái cần thiết/nghĩa vụ mạnh của δεῖ, đồng thời không xác định thêm nguồn hay bản chất của sự cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để biểu thị ngôi thứ hai số nhiều; dùng “ngay” nhằm tái hiện sự nhấn mạnh của αὐτῇ. Dấu chú thích [a] xuất hiện trong chính văn.
