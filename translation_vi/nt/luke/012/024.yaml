id: LUK.12.24
reference: Luke 12:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: vi
  text: 'Hãy suy ngẫm về loài quạ: chúng không gieo cũng không gặt; chúng không có kho chứa cũng chẳng có vựa, và Đức Chúa Trời nuôi chúng. Anh em còn quý giá hơn loài chim biết bao!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσατε
  choice: Hãy suy ngẫm về
  rationale: Diễn đạt mệnh lệnh phải chăm chú quan sát và suy xét, mạnh hơn một cái nhìn thoáng qua, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τοὺς κόρακας
  choice: loài quạ
  rationale: κόραξ chỉ cụ thể quạ; cách dịch này giữ nguyên hình ảnh cụ thể của bản Hy Lạp.
- source_word: οὐ σπείρουσιν οὐδὲ θερίζουσιν
  choice: chúng không gieo cũng không gặt
  rationale: Giữ cấu trúc sóng đôi ngắn gọn của hai động từ nông nghiệp.
- source_word: ταμεῖον
  choice: kho chứa
  rationale: Chỉ nơi hoặc phòng dùng để cất giữ; được phân biệt với ἀποθήκη trong cùng câu.
- source_word: ἀποθήκη
  choice: vựa lúa
  rationale: Chỉ nơi chứa nông sản; 'vựa lúa' phù hợp ngữ cảnh gieo gặt và giữ hai danh từ lưu trữ khác nhau.
- source_word: τρέφει
  choice: nuôi
  rationale: Diễn đạt tự nhiên hành động Đức Chúa Trời liên tục cung cấp thức ăn và duy trì sự sống cho chim.
- source_word: πόσῳ μᾶλλον
  choice: biết bao
  rationale: Kết hợp với cấu trúc so sánh 'còn... hơn' để truyền đạt tự nhiên lập luận từ điều nhỏ đến điều lớn.
- source_word: διαφέρετε
  choice: còn quý giá hơn
  rationale: Trong ngữ cảnh, động từ nói đến sự vượt hơn về giá trị chứ không chỉ khác biệt; cách dịch giữ rõ ý so sánh.
- source_word: τῶν πετεινῶν
  choice: loài chim
  rationale: πετεινόν là từ khái quát chỉ chim, mở rộng phép so sánh từ loài quạ vừa được nhắc đến.
theological_decisions:
- issue: Sự quan phòng của Đức Chúa Trời trong phép so sánh
  choice: thế mà Đức Chúa Trời vẫn nuôi chúng
  alternative: và Đức Chúa Trời nuôi chúng
  rationale: '''Thế mà... vẫn'' làm rõ sự tương phản vốn có giữa việc chim không gieo gặt, không có nơi tích trữ, với sự chăm sóc chủ động của Đức Chúa Trời, nhưng không mở rộng thành một tuyên bố giáo lý vượt quá câu văn.'
- issue: Giá trị của người nghe so với loài chim
  choice: Anh em còn quý giá hơn loài chim biết bao!
  alternative: Anh em khác loài chim biết bao!
  rationale: διαφέρω có thể mang nghĩa 'khác' hoặc 'vượt hơn'; trong lập luận từ nhỏ đến lớn ở đây, nghĩa vượt hơn về giá trị phù hợp ngữ cảnh, nhưng không xác định cơ sở thần học của giá trị ấy ngoài điều câu nói khẳng định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'anh em' cho đại từ số nhiều ὑμεῖς nhằm giữ lời nói trực tiếp với cả nhóm người nghe. Dấu chấm than thể hiện sức nặng tu từ của câu kết. Hai thuật ngữ ταμεῖον và ἀποθήκη được phân biệt bằng 'kho chứa' và 'vựa lúa'.
