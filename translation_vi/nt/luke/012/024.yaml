revisions:
- from: 'Hãy suy ngẫm về loài quạ: chúng không gieo cũng không gặt; chúng không có kho chứa cũng chẳng có vựa lúa, thế mà Đức Chúa Trời vẫn nuôi chúng. Anh em còn quý giá hơn loài chim biết bao!'
  to: 'Hãy suy ngẫm về loài quạ: chúng không gieo cũng không gặt; chúng không có kho chứa cũng chẳng có vựa, và Đức Chúa Trời nuôi chúng. Anh em còn quý giá hơn loài chim biết bao!'
  rationale: Loại bỏ sắc thái nhượng bộ được thêm vào và thay “vựa lúa” bằng “vựa” để bám sát hơn hai thuật ngữ nơi tích trữ trong tiếng Hy Lạp, đồng thời giữ nguyên ý nghĩa, cấp độ trang trọng và sức mạnh tu từ của câu.
