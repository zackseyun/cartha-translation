id: LUK.12.52
reference: Luke 12:52
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: vi
  text: 'Vì từ nay, năm người trong một nhà sẽ bị chia rẽ[a]: ba chống lại hai và hai chống lại ba.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “trong một gia đình.” Từ Hy Lạp có thể chỉ chính căn nhà hoặc đơn vị gia đình sống trong đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: sẽ
  rationale: Diễn đạt tự nhiên thì tương lai của εἰμί khi kết hợp với phân từ διαμεμερισμένοι, không cần thêm một động từ tồn tại riêng trong tiếng Việt.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối câu này với lời nói trước đó về sự chia rẽ.
- source_word: ἀπὸ τοῦ νῦν
  choice: từ nay
  rationale: Cách nói hiện đại, gọn và giữ đúng ý nghĩa thời gian kéo dài từ thời điểm hiện tại trở đi.
- source_word: πέντε
  choice: năm người
  rationale: Thêm danh từ chỉ người do ngữ cảnh nói đến năm thành viên trong nhà; tiếng Việt cần làm rõ để câu tự nhiên.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: trong một nhà
  rationale: Giữ hình thức cụ thể của οἶκος, đồng thời trong ngữ cảnh vẫn tự nhiên gợi đến những người thuộc cùng một gia đình; nghĩa “gia đình” được ghi ở chú thích.
- source_word: διαμεμερισμένοι
  choice: bị chia rẽ
  rationale: Giữ sắc thái bị động và trạng thái phân rẽ do phân từ hoàn thành bị động diễn tả trong ngữ cảnh xung đột quan hệ.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: ba chống lại hai
  rationale: ἐπί với cách dữ liệu ở đây diễn tả sự đối nghịch; “chống lại” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: và hai chống lại ba
  rationale: Giữ cấu trúc song song và thế đối nghịch cân xứng của nguyên văn.
theological_decisions:
- issue: Nên dịch οἶκος theo nghĩa cụ thể là “nhà” hay theo đơn vị xã hội là “gia đình” trong bối cảnh chia rẽ giữa các thành viên
  choice: nhà
  alternative: gia đình
  rationale: Câu kế tiếp cho thấy rõ các quan hệ gia đình, nhưng οἶκος vẫn có thể chỉ căn nhà hoặc những người trong nhà. Bản chính giữ “nhà” gần hình thức Hy Lạp, còn chú thích bảo lưu nghĩa xã hội khả dĩ để không giải quyết quá mức sắc thái này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “năm người trong một nhà” giữ hình ảnh của nguyên văn; dấu hai chấm làm rõ hai nhóm đối nghịch mà không thêm nội dung diễn giải.
