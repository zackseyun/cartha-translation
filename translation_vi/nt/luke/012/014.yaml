  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của SBLGNT: lời đáp hướng đến người vừa thưa, cách gọi trực tiếp Ἄνθρωπε, động từ κατέστησεν (“đã lập/bổ nhiệm”), hai vai trò κριτὴν và μεριστὴν, cùng phạm vi số nhiều ἐφ’ ὑμᾶς. “Người chia gia tài” diễn đạt phù hợp μεριστής trong ngữ cảnh tranh chấp thừa kế ở câu trước mà không thêm một khẳng định thần học nào.'
  naturalness: '“Nhưng Ngài nói với người ấy: ‘Này anh, ai đã lập tôi làm thẩm phán hay người chia gia tài cho các anh?’” là tiếng Việt hiện đại, rõ nghĩa và có sắc thái trang trọng vừa phải. “Này anh” là một cách xưng hô trực tiếp tự nhiên; không cần thay bằng lối cổ hơn.'
  terminology: “Thẩm phán” phù hợp κριτής trong sắc thái pháp lý; “người chia gia tài” chuyển tải chức năng của μεριστής cách rõ ràng trong văn cảnh. Việc dùng “Ngài” ở lời dẫn và “tôi” trong lời thoại nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại.
