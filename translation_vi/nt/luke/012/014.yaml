  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: vi
  text: 'Nhưng Ngài nói với người ấy: “Này anh, ai đã lập tôi làm thẩm phán hay người chia gia tài cho các anh?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Này anh
  rationale: Lời xưng hô trực tiếp với một người nam; cách dịch này tự nhiên trong tiếng Việt hiện đại và vẫn giữ sắc thái có phần xa cách của nguyên văn.
- source_word: κατέστησεν
  choice: đã lập
  rationale: Diễn đạt hành động bổ nhiệm hay đặt vào một vai trò.
- source_word: κριτὴν
  choice: thẩm phán
  rationale: Giữ nghĩa pháp lý của người có thẩm quyền phân xử.
- source_word: μεριστὴν
  choice: người chia gia tài
  rationale: Trong ngữ cảnh tranh chấp thừa kế ở câu trước, đây là người thực hiện việc phân chia tài sản; cách dịch cụ thể và tự nhiên hơn 'người phân chia'.
- source_word: ἐφ’ ὑμᾶς
  choice: cho các anh
  rationale: Chuyển đạt phạm vi thẩm quyền đối với những người đang tranh chấp; số nhiều của đại từ được giữ bằng 'các anh'.
theological_decisions:
- issue: Phạm vi lời từ chối của Đức Chúa Jêsus
  choice: Giữ dưới dạng câu hỏi về việc ai đã bổ nhiệm Ngài vào vai trò phân xử vụ việc này.
  alternative: Diễn giải thành sự phủ nhận mọi thẩm quyền xét xử của Ngài.
  rationale: Nguyên văn chỉ đặt vấn đề về sự bổ nhiệm làm thẩm phán hoặc người chia tài sản đối với những người này, nên không mở rộng thành một khẳng định thần học tổng quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” trong lời dẫn để chỉ Đức Chúa Jêsus; trong lời thoại dùng “tôi” theo cách nói trực tiếp tự nhiên. “Này anh” tránh sắc thái thô hoặc cổ của “Hỡi người”.
