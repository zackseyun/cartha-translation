source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: vi
  text: Nhưng ai chối Ta trước mặt người ta thì sẽ bị chối trước mặt các thiên sứ của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị khước từ”; động từ Hy Lạp ở đây là một từ cùng gốc nhưng có thể mạnh hơn từ “chối” ở vế trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός με
  choice: Nhưng ai chối Ta
  rationale: Mạo từ đi với phân từ tạo thành cách nói chỉ người nói chung; “ai chối” tự nhiên trong tiếng Việt và diễn đạt nguyên tắc khái quát. “Chối” giữ được sự liên hệ từ vựng với thể bị động ở vế sau.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: trước mặt người ta
  rationale: “Trước mặt” diễn đạt sự hiện diện và tính công khai; “người ta” chỉ loài người nói chung, đối lập với các thiên sứ, không giới hạn ở nam giới.
- source_word: ἀπαρνηθήσεται
  choice: sẽ bị chối
  rationale: Giữ nguyên thể bị động và sự đối ứng trang trọng “chối… bị chối”, không tự ý thêm chủ thể hành động. Động từ có tiền tố có thể mang sắc thái mạnh hơn, vì vậy ghi nhận phương án khác trong chú thích.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: trước mặt các thiên sứ của Đức Chúa Trời
  rationale: Cách dịch trực tiếp, tự nhiên, bảo toàn bối cảnh chứng kiến nơi thiên giới và quan hệ sở hữu trong nguyên văn.
theological_decisions:
- issue: Chủ thể ngầm thực hiện hành động “sẽ bị chối”
  choice: Giữ nguyên thể bị động, không thêm “Con Người”, “Ta” hay “Đức Chúa Trời” làm tác nhân.
  alternative: Dịch rõ là “Con Người sẽ chối người ấy” hoặc hiểu đây là thể bị động thần học, tức Đức Chúa Trời là tác nhân.
  rationale: Nguyên văn không nêu tác nhân. Dù câu trước có thể khiến người đọc liên hệ đến Con Người, câu này vẫn để ngỏ; bản dịch cần bảo toàn sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta” cho lời tự xưng của Chúa Giê-su; “người ta” mang nghĩa bao quát mọi người. Cấu trúc cân xứng “chối… bị chối” giữ nhịp và tính đối ứng của nguyên văn.
