id: LUK.12.36
reference: Luke 12:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: vi
  text: Còn anh em, hãy giống như những người đang chờ chủ mình từ tiệc cưới trở về, để khi chủ đến và gõ cửa, họ lập tức mở cửa cho chủ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριον ἑαυτῶν
  choice: chủ mình
  rationale: Trong hình ảnh các đầy tớ chờ người đứng đầu nhà trở về, “chủ mình” là cách diễn đạt tự nhiên, giữ được nghĩa quan hệ chủ–tớ của κύριος mà không áp đặt một tước hiệu thần học vào câu ví dụ.
- source_word: ἀναλύσῃ ἐκ τῶν γάμων
  choice: từ tiệc cưới trở về
  rationale: ἀναλύω trong ngữ cảnh này chỉ việc rời nơi dự tiệc để trở về; γάμοι ở số nhiều theo cách dùng Hy Lạp có thể chỉ lễ hoặc tiệc cưới. Cách dịch này truyền đạt đúng tình huống bằng tiếng Việt tự nhiên.
- source_word: εὐθέως
  choice: lập tức
  rationale: Diễn đạt trực tiếp ý mở cửa ngay, không trì hoãn.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn
  choice: chủ
  alternative: Chúa
  rationale: Ngữ cảnh trực tiếp nói về những người phục vụ và chủ của họ. “Chủ” bảo toàn hình ảnh dụ ngôn và vẫn để ngỏ sự quy chiếu thần học, thay vì biến nghĩa hàm ẩn thành tước hiệu minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại “chủ” ở cuối câu giúp đại từ quy chiếu rõ ràng; cấu trúc “Còn anh em, hãy…” giữ lực khuyên bảo trực tiếp của καὶ ὑμεῖς.
