  to: 'Rồi tôi sẽ nói với linh hồn mình[a]: ‘Hỡi linh hồn, ngươi có nhiều của cải đã tích trữ sẵn cho nhiều năm. Hãy nghỉ ngơi, ăn, uống và vui chơi.’'
