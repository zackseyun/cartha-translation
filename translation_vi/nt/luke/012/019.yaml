id: LUK.12.19
reference: Luke 12:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: vi
  text: 'Rồi tôi sẽ nói với linh hồn mình[a]: ‘Hỡi linh hồn, ngươi có nhiều của cải đã tích trữ sẵn cho nhiều năm. Hãy nghỉ ngơi, ăn, uống và vui chơi.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ψυχή cũng có thể có nghĩa là “bản thân” hoặc “mạng sống”, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: tôi sẽ nói
  rationale: Diễn đạt trực tiếp thì tương lai chủ động của λέγω, tự nhiên trong lời độc thoại.
- source_word: ψυχῇ / Ψυχή
  choice: linh hồn mình / Hỡi linh hồn
  rationale: Giữ hình ảnh nhân vật nói với ψυχή của chính mình và sắc thái tu từ của lối tự xưng hô; chú thích nêu các nghĩa theo ngữ cảnh.
- source_word: ἀγαθὰ
  choice: của cải
  rationale: Trong ngữ cảnh mùa màng được chứa vào kho, từ này chỉ những thứ có giá trị vật chất; “của cải” tự nhiên hơn “những thứ tốt lành” trong tiếng Việt.
- source_word: κείμενα
  choice: đã tích trữ
  rationale: Truyền đạt trạng thái của cải được để dành sẵn, phù hợp bối cảnh kho chứa.
- source_word: εἰς ἔτη πολλά
  choice: đủ dùng trong nhiều năm
  rationale: Làm rõ giá trị sử dụng kéo dài về tương lai mà cụm từ Hy Lạp biểu đạt trong ngữ cảnh, không thay đổi ý chính.
- source_word: ἀναπαύου
  choice: hãy nghỉ ngơi
  rationale: Mệnh lệnh chỉ việc thảnh thơi, nghỉ ngơi; cách nói hiện đại và trang trọng vừa phải.
- source_word: φάγε, πίε
  choice: ăn uống
  rationale: Hai mệnh lệnh “ăn” và “uống” được kết hợp tự nhiên trong tiếng Việt mà vẫn giữ đủ nội dung.
- source_word: εὐφραίνου
  choice: vui hưởng
  rationale: Diễn tả việc tận hưởng vui vẻ trong chuỗi lời thúc giục hưởng thụ; tránh sắc thái tích cực mang tính đạo đức mà “vui mừng” có thể gợi ra.
theological_decisions:
- issue: Cách dịch ψυχή trong lời nhân vật tự nói với mình
  choice: linh hồn
  alternative: bản thân; mạng sống
  rationale: Câu này không nhất thiết xác lập một học thuyết nhân học chuyên biệt. “Linh hồn” bảo tồn hình thức tự xưng hô và độ vang thần học của từ Hy Lạp, còn chú thích giữ các khả năng nghĩa khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ngươi” được dùng trong lời tự xưng hô để giữ sự phân biệt giữa người nói và “linh hồn” được gọi; “hỡi” bảo tồn lực hô cách. Không giữ chú thích [b] của lớp tham khảo tiếng Anh vì chú thích ấy không khớp vị trí đánh dấu và không nêu một phương án dịch thực sự cho πίε.
