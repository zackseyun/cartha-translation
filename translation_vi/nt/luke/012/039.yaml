    rationale: ᾔδει là dạng quá khứ hoàn thành của οἶδα trong mệnh đề εἰ, kết hợp với οὐκ ἂν ἀφῆκεν để diễn tả giả định trái với thực tế trong quá khứ. “Nếu chủ nhà biết” có thể được hiểu như điều kiện mở; “nếu chủ nhà đã biết” phản ánh chính xác hơn cấu trúc nguồn.
