  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh “hãy biết điều này”, hình ảnh chủ nhà/kẻ trộm, thời điểm “vào giờ nào”, và hành động đào/khoét xuyên vào nhà. Tuy nhiên, εἰ ᾔδει ... οὐκ ἂν ἀφῆκεν là điều kiện phản thực trong quá khứ; vế điều kiện tiếng Việt nên có “đã biết” để biểu đạt rõ rằng chủ nhà thực tế không biết.
  naturalness: 'Câu văn rõ ràng, hiện đại và có nhịp điệu tự nhiên. Việc thêm “đã” ở vế điều kiện làm quan hệ phản thực nhất quán và tự nhiên hơn: “nếu ... đã biết ..., thì ... đã không ...”.'
  terminology: “Chủ nhà” là cách dịch tự nhiên cho οἰκοδεσπότης trong dụ ngôn này. “Bị đào thủng” giữ được hình ảnh cụ thể của διορυχθῆναι; chú thích văn hóa giải thích phù hợp mà không áp đặt diễn giải thần học.
