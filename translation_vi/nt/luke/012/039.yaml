source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: vi
  text: 'Nhưng hãy biết điều này: nếu chủ nhà đã biết kẻ trộm sẽ đến vào giờ nào, thì ông đã không để cho nhà mình bị đào thủng[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “bị đào xuyên qua”, phản ánh cách kẻ trộm khoét thủng tường nhà để đột nhập.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Nhưng hãy biết điều này
  rationale: Mệnh lệnh hiện tại số nhiều γινώσκετε được diễn đạt trực tiếp bằng “hãy biết”; δέ được giữ bằng “Nhưng” để đánh dấu sự chuyển ý.
- source_word: οἰκοδεσπότης
  choice: chủ nhà
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, chỉ người đứng đầu và có trách nhiệm đối với ngôi nhà trong hình ảnh ví dụ.
- source_word: ποίᾳ ὥρᾳ
  choice: vào giờ nào
  rationale: Giữ sắc thái cụ thể của ὥρα và phù hợp với chủ đề tỉnh thức trong văn cảnh.
- source_word: ὁ κλέπτης ἔρχεται
  choice: kẻ trộm sẽ đến
  rationale: Dù ἔρχεται ở thì hiện tại, trong mệnh đề điều kiện phản thực, tiếng Việt tự nhiên dùng “sẽ đến” để chỉ sự việc được dự liệu từ góc nhìn của chủ nhà.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: thì ông đã không để cho
  rationale: Diễn đạt rõ kết quả phản thực trong quá khứ mà tổ hợp οὐκ ἂν với động từ chỉ ra.
- source_word: διορυχθῆναι
  choice: bị đào thủng
  rationale: Giữ hình ảnh cụ thể của động từ Hy Lạp về việc đào hoặc khoét xuyên qua tường nhà, thay vì làm phẳng thành ý khái quát “đột nhập”.
- source_word: τὸν οἶκον αὐτοῦ
  choice: nhà mình
  rationale: “Nhà” tương ứng trực tiếp với οἶκος; “mình” quy chiếu tự nhiên về chủ ngữ “ông” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ cấu trúc điều kiện phản thực cùng hình ảnh văn hóa cụ thể của động từ διορύσσω; đại từ “ông” tránh lặp “chủ nhà” mà vẫn rõ chủ thể.
