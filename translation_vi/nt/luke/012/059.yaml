base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: vi
  text: 'Tôi nói với anh: anh nhất định sẽ không ra khỏi đó cho đến khi anh trả cho xong cả đồng xu nhỏ cuối cùng.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “lépton”; đây là tên một đồng tiền rất nhỏ thời ấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Ta nói với con
  rationale: Giữ công thức trực tiếp ở ngôi số ít; “Ta… con” tự nhiên, trang trọng trong lời Đức Giê-su nói với người nghe.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: con chắc chắn sẽ không ra
  rationale: “Chắc chắn… không” thể hiện lối phủ định mạnh οὐ μή với động từ ở thức giả định, hướng đến một sự việc tương lai.
- source_word: ἐκεῖθεν
  choice: khỏi đó
  rationale: Diễn đạt tự nhiên ý rời khỏi nơi đang bị giam giữ.
- source_word: ἕως
  choice: cho đến khi
  rationale: Giữ quan hệ thời gian, chỉ giới hạn mà tình trạng không được ra khỏi kéo dài tới đó.
- source_word: καὶ τὸ ἔσχατον
  choice: hết… cuối cùng
  rationale: “Hết” cùng với “cuối cùng” truyền đạt sự nhấn mạnh của καί và ý trọn vẹn đến đơn vị cuối.
- source_word: λεπτόν
  choice: đồng xu nhỏ
  rationale: λεπτόν là một đồng tiền có giá trị rất nhỏ; cách dịch theo nghĩa giúp độc giả hiện đại hiểu ngay, còn chú thích giữ tên lịch sử.
- source_word: ἀποδῷς
  choice: trả hết
  rationale: “Trả” phù hợp bối cảnh nợ nần/pháp lý; “hết” làm rõ việc thanh toán phải hoàn tất trước khi được ra.
theological_decisions:
- issue: Ý nghĩa quy chiếu của hình ảnh mắc nợ và bị giam
  choice: Giữ nguyên hình ảnh bị giữ lại cho đến khi trả đủ, không xác định nó là hậu quả pháp lý đời này, sự phán xét của Đức Chúa Trời hay hình phạt luyện tội.
  alternative: 'Diễn giải rõ theo một trong các cách hiểu: cảnh báo pháp lý ở đời này, ẩn dụ về sự phán xét, hoặc bằng chứng cho quan niệm luyện tội về sau.'
  rationale: Bản thân câu này không xác định rõ hình ảnh quy chiếu đến điều nào; bản dịch vì thế duy trì sự căng thẳng thần học và tránh đưa giáo lý về sau vào văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta—con” phản ánh lời nói trực tiếp, số ít, của Đức Giê-su trong văn mạch. Không thêm cách giải thích thần học vào chính văn.
