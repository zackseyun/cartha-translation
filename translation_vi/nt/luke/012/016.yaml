revisions:
- from: 'Rồi Ngài kể cho họ một ẩn dụ: “Ruộng đất của một người giàu kia sinh hoa lợi dồi dào.[a]”'
  to: 'Rồi Ngài kể cho họ một dụ ngôn: “Đất của một người giàu nọ sinh hoa lợi dồi dào.[a]”'
  rationale: 'Chỉ thay thuật ngữ thể loại “ẩn dụ” bằng “dụ ngôn” và làm gọn cách gọi phần đất sở hữu để tiếng Việt tự nhiên hơn. Nội dung vẫn giữ: Ngài kể cho họ, một người giàu không nêu tên, đất thuộc về người ấy, và đất cho sản lượng phong phú. Chú thích giữ các khả năng diễn đạt của εὐφόρησεν.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:29Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng mạch kể chuyện, đối tượng được nói với, quan hệ sở hữu của χώρα, và ý đất đai cho sản lượng phong phú. Tuy nhiên, “ẩn dụ” trong tiếng Việt hiện đại chủ yếu chỉ phép tu từ metaphor, không phải thể loại παραβολή trong Phúc Âm; vì vậy đây không phải là tương đương thể loại chính xác.
  naturalness: Câu văn nhìn chung tự nhiên. “Dụ ngôn” là thuật ngữ rõ ràng và phù hợp hơn “ẩn dụ” trong ngữ cảnh một câu chuyện Chúa Giê-su kể. “Đất của một người giàu nọ” tự nhiên hơn “ruộng đất của một người giàu kia” mà vẫn giữ sắc thái kể chuyện bất định của τις.
  terminology: Cần đổi “ẩn dụ” thành “dụ ngôn” để phân biệt câu chuyện ngắn có ý nghĩa minh họa với biện pháp tu từ ẩn dụ. “Hoa lợi dồi dào” phù hợp với εὐφόρησεν và χώρα trong ngữ cảnh nông nghiệp.
  issues:
  - severity: medium
    issue: “ẩn dụ” không tương đương chính xác với παραβολή.
    rationale: Trong cách dùng tiếng Việt hiện đại, “ẩn dụ” thường là một biện pháp tu từ, không phải một dụ ngôn/câu chuyện minh họa. παραβολή tại đây giới thiệu thể loại lời kể tiếp theo, nên “dụ ngôn” bảo toàn thể loại và tránh hiểu sai.
  revised_text: 'Rồi Ngài kể cho họ một dụ ngôn: “Đất của một người giàu nọ sinh hoa lợi dồi dào.[a]”'
