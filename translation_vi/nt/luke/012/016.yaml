  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: vi
  text: 'Rồi Ngài kể cho họ một dụ ngôn: “Đất của một người giàu nọ sinh hoa lợi dồi dào.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “cho nhiều hoa lợi” hoặc “rất phì nhiêu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Rồi Ngài kể
  rationale: δέ là từ nối nhẹ, được diễn đạt tự nhiên bằng “Rồi”; vì παραβολή là tân ngữ, “kể” phù hợp với tiếng Việt hơn cách dịch sát là “nói một ẩn dụ.” Đại từ “Ngài” nối với chủ thể là Đức Chúa Jêsus trong ngữ cảnh.
- source_word: παραβολὴν
  choice: một ẩn dụ
  rationale: “Ẩn dụ” là thuật ngữ quen thuộc trong văn phong Kinh Thánh tiếng Việt cho câu chuyện dùng hình ảnh đời thường để truyền đạt chân lý, đồng thời giữ được thể loại của παραβολή.
- source_word: πρὸς αὐτοὺς
  choice: cho họ
  rationale: Diễn đạt tự nhiên đối tượng được nghe lời kể, tương ứng với ý hướng đến họ trong cụm giới từ Hy Lạp.
- source_word: λέγων
  choice: ':'
  rationale: Phân từ này dẫn vào nội dung trực tiếp; dấu hai chấm chuyển chức năng ấy sang tiếng Việt tự nhiên mà không cần lặp lại “rằng” hay “nói rằng.”
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: của một người giàu kia
  rationale: Giữ quan hệ sở hữu với ruộng đất, giới tính nam của nhân vật và sắc thái bất định nhưng có tính kể chuyện của τινός qua từ “kia.”
- source_word: εὐφόρησεν
  choice: sinh hoa lợi dồi dào
  rationale: Động từ chỉ đất đai cho sản lượng tốt hoặc phong phú; cách diễn đạt này rõ nghĩa nông nghiệp và vẫn giữ ruộng đất làm chủ thể như trong tiếng Hy Lạp.
- source_word: ἡ χώρα
  choice: ruộng đất
  rationale: Trong ngữ cảnh canh tác và sở hữu của người giàu, χώρα chỉ phần đất nông nghiệp chứ không phải một quốc gia; “ruộng đất” rõ và tự nhiên hơn “xứ” hoặc “vùng.”
