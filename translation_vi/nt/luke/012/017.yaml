  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: vi
  text: 'Ông suy tính trong lòng: “Ta sẽ làm gì đây? Vì ta không có chỗ để thu gom hoa lợi của mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: suy tính
  rationale: Thì chưa hoàn thành diễn tả một quá trình cân nhắc đang diễn ra; “suy tính” tự nhiên trong tiếng Việt và giữ được sắc thái tính toán, deliberative hơn “nghĩ”.
- source_word: ἐν ἑαυτῷ
  choice: trong lòng
  rationale: Diễn tả sự tự suy xét nội tâm. “Trong lòng” là cách nói tự nhiên, trang trọng vừa phải và không gợi rằng ông nói thành tiếng.
- source_word: λέγων
  choice: ':'
  rationale: Dấu hai chấm tự nhiên dẫn vào nội dung lời tự nhủ trong tiếng Việt, tránh lối dịch cứng “mà rằng” nhưng vẫn thể hiện chức năng của phân từ.
- source_word: Τί ποιήσω
  choice: Ta sẽ làm gì đây?
  rationale: Câu hỏi có thức giả định mang tính cân nhắc. “Sẽ làm gì đây?” truyền đạt sự phân vân về hành động phải chọn bằng tiếng Việt hiện đại.
- source_word: ὅτι
  choice: Vì
  rationale: Ở đây liên từ nêu lý do cho câu hỏi trước đó; “vì” rõ ràng và tự nhiên.
- source_word: οὐκ ἔχω ποῦ
  choice: ta không có chỗ để
  rationale: Chuyển đúng thành ngữ Hy Lạp “không có nơi đâu để” sang cấu trúc tiếng Việt tự nhiên.
- source_word: συνάξω
  choice: chứa
  rationale: Động từ cơ bản là gom lại, nhưng trong ngữ cảnh hoa lợi và các kho ở câu kế tiếp, hành động nhắm đến việc thu gom vào một nơi cất chứa. “Chứa” diễn đạt tự nhiên vấn đề thiếu không gian mà không thêm chi tiết ngoài ngữ cảnh.
- source_word: τοὺς καρπούς μου
  choice: hoa lợi của mình
  rationale: καρποί ở đây chỉ sản lượng nông nghiệp. “Hoa lợi” bao quát hơn “trái cây” và phù hợp với bối cảnh mùa màng; “của mình” quy chiếu tự nhiên về chủ thể.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông/ta” phù hợp lời kể dụ ngôn và lời độc thoại của một người đàn ông, không đưa thêm sắc thái giáo phái. Không dùng chú thích vì các khả năng từ vựng chính được diễn đạt đầy đủ mà không có dị bản hay điểm mơ hồ thiết yếu cần đánh dấu.
