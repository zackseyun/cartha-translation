  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: vi
  text: Vậy, tại sao các anh không tự mình xét điều đúng đắn?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều công chính” hoặc “điều phải làm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Vậy, tại sao
  rationale: Cụm tiểu từ nối câu hỏi này với lời quở trách trước đó và đẩy lập luận đi xa hơn. “Vậy, tại sao” tự nhiên trong tiếng Việt, đồng thời giữ lực liên kết và chất vấn.
- source_word: ἀφ’ ἑαυτῶν
  choice: chính các anh không tự
  rationale: Cụm này chỉ việc hành động từ chính mình, dựa vào khả năng phán đoán của mình. Kết hợp “chính các anh” với “tự xét” diễn đạt rõ sự chủ động và tự mình suy xét mà không dịch cứng là “từ chính mình”.
- source_word: οὐ κρίνετε
  choice: không tự xét
  rationale: κρίνω ở đây mang nghĩa xem xét để đưa ra nhận định hoặc quyết định. “Xét” giữ được sắc thái đánh giá/phán đoán và tự nhiên hơn “phán xét” trong lời nói thông thường.
- source_word: τὸ δίκαιον
  choice: điều gì là phải
  rationale: Tính từ giống trung số ít được dùng như danh từ, nghĩa là điều đúng, phải hoặc công chính. “Điều gì là phải” giữ phạm vi đạo đức và thực tiễn rộng, đồng thời phù hợp với câu hỏi về sự nhận định.
theological_decisions:
- issue: Sắc thái của τὸ δίκαιον
  choice: điều gì là phải
  alternative: điều gì là công chính; điều phải làm
  rationale: Ngữ cảnh nói đến khả năng tự nhận định điều đúng đắn, không nhất thiết giới hạn vào công lý theo nghĩa pháp lý hay biến câu thành một mệnh lệnh cụ thể về hành động. Bản dịch giữ độ rộng nghĩa của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các anh” phù hợp với lời Chúa Giê-su trực tiếp chất vấn đám đông trong mạch văn; “xét” tránh sắc thái kết án quá mạnh của “phán xét”. Dấu [a] được đặt ngay sau phần từ ngữ có phương án dịch khác.
