  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: vi
  text: 'Nhưng tôi nói với các bạn, là bạn hữu của tôi: đừng sợ những kẻ giết thân thể, rồi sau đó không thể làm gì hơn nữa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Nhưng Ta nói
  rationale: δέ nối tiếp lời phán với sắc thái chuyển ý hoặc đối lập nhẹ; “Nhưng” tự nhiên trong ngữ cảnh và không nhấn quá mạnh sự tương phản.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: với các con, là những người bạn của Ta
  rationale: 'Cụm tặng cách mang tính đồng vị/giải thích: Chúa Giê-su vừa trực tiếp nói với người nghe vừa gọi họ là bạn của Ngài. Cách dịch này giữ cả đại từ lẫn danh xưng thân tình.'
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: đừng sợ những kẻ giết
  rationale: Cấu trúc μή với động từ ở dạng giả định aorist tạo lời cấm; ἀπό sau φοβέομαι chỉ đối tượng gây sợ. Phân từ hiện tại được hiểu theo nghĩa khái quát là “những kẻ giết”.
- source_word: τὸ σῶμα
  choice: thân thể
  rationale: σῶμα ở đây chỉ thân thể vật lý. “Thân thể” là cách diễn đạt rõ ràng, trang trọng và thông dụng trong tiếng Việt.
- source_word: καὶ μετὰ ταῦτα
  choice: rồi sau đó
  rationale: Cụm từ mang nghĩa thời gian, nói đến điều xảy ra sau khi thân thể bị giết. “Rồi sau đó” thể hiện tự nhiên trình tự ấy.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: không thể làm gì hơn nữa
  rationale: Theo ngữ cảnh, cấu trúc theo sát chữ là “không có điều gì hơn để làm” diễn tả giới hạn năng lực của những kẻ giết người. Cách dịch đã chọn tự nhiên trong tiếng Việt và giữ trọng tâm rằng họ không thể vượt quá việc giết thân thể.
theological_decisions:
- issue: Phạm vi quyền lực của con người sau khi giết thân thể
  choice: Chỉ khẳng định rằng những kẻ bách hại có thể giết thân thể nhưng sau đó không thể làm gì hơn nữa.
  alternative: Diễn giải thêm rằng họ không thể giết linh hồn.
  rationale: Câu này không trực tiếp nhắc đến linh hồn, dù câu kế tiếp làm nổi bật quyền năng lớn hơn của Đức Chúa Trời. Bản dịch không đưa nội dung của câu kế tiếp vào đây, nhờ đó giữ nguyên giới hạn và sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” để thể hiện lời Chúa Giê-su nói thân tình với các môn đồ; “những người bạn của Ta” giữ rõ nét trìu mến của φίλοις μου. Không thêm chú thích vì bản dịch chính đã diễn đạt tự nhiên phương án nghĩa phù hợp của cụm cuối câu.
