  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: vi
  text: “Ta đã đến để ném lửa xuống đất, và Ta ước gì lửa ấy đã được nhóm lên rồi![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát chữ hơn: “Ta muốn gì nếu lửa đã được nhóm lên rồi?” Mệnh đề Hy Lạp này khó hiểu; câu chính phản ánh cách hiểu có khả năng cao rằng đây là lời bày tỏ ước muốn mãnh liệt.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: lửa
  rationale: Giữ nguyên hình ảnh ẩn dụ không có mạo từ, không diễn giải thành sự phán xét, thanh tẩy, Đức Thánh Linh hay chia rẽ.
- source_word: ἦλθον
  choice: Ta đã đến
  rationale: Diễn đạt tự nhiên một tuyên bố về sứ mạng, đồng thời phản ánh thì aorist của động từ Hy Lạp.
- source_word: βαλεῖν
  choice: để ném
  rationale: Giữ nét mạnh và sống động của βάλλω (‘ném’), thay vì làm nhẹ thành ‘đem’.
- source_word: ἐπὶ τὴν γῆν
  choice: xuống đất
  rationale: Trong tiếng Việt, ‘ném lửa xuống đất’ tự nhiên và giàu hình ảnh; ‘đất’ ở đây có phạm vi rộng, không giới hạn vào một vùng đất cụ thể.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: và Ta ước gì lửa ấy đã được đốt lên rồi!
  rationale: Mệnh đề Hy Lạp khó hiểu nếu dịch sát từng chữ; bản dịch thể hiện cách hiểu thành ngữ có khả năng cao là lời cảm thán bày tỏ ước muốn mãnh liệt, còn cách dịch sát được ghi ở chú thích.
- source_word: ἤδη
  choice: đã ... rồi
  rationale: Cặp từ ‘đã ... rồi’ chuyển tải tự nhiên ý ‘already’ trong tiếng Việt.
- source_word: ἀνήφθη
  choice: đã được đốt lên
  rationale: Phản ánh thể bị động của ἀνάπτω và duy trì trường hình ảnh của lửa; cách nói này dễ hiểu hơn ‘được nhóm lên’ trong câu hiện tại.
theological_decisions:
- issue: Ý nghĩa của ‘lửa’ trong lời phán của Chúa Giê-su
  choice: Giữ nguyên ẩn dụ ‘lửa’ mà không xác định ý nghĩa.
  alternative: Diễn giải là sự phán xét, sự thanh tẩy, Đức Thánh Linh hoặc cuộc khủng hoảng và chia rẽ do sứ mạng của Chúa Giê-su gây nên.
  rationale: Chính câu này không định nghĩa hình ảnh; giữ nguyên ‘lửa’ bảo tồn tính đa nghĩa và căng thẳng thần học của nguyên văn.
- issue: Sắc thái của mệnh đề khó τί θέλω εἰ ἤδη ἀνήφθη
  choice: 'Dịch như một lời cảm thán bày tỏ ước muốn: ‘Ta ước gì lửa ấy đã được đốt lên rồi!’'
  alternative: 'Dịch sát thành câu hỏi: ‘Ta còn muốn gì nếu lửa ấy đã được đốt lên rồi?’'
  rationale: Cách hiểu cảm thán phù hợp với ngữ cảnh và tạo câu tiếng Việt tự nhiên, nhưng chú thích vẫn bảo tồn cấu trúc sát chữ và sự khó hiểu thực sự của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ ‘Ta’ phù hợp với lời trực tiếp của Chúa Giê-su trong lối văn Kinh Thánh tiếng Việt. ‘Ném lửa xuống đất’ giữ sức mạnh của hình ảnh nguyên văn; chú thích công khai sự khó hiểu của mệnh đề cuối.
