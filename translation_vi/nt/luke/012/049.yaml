- from: “Ta đã đến để ném lửa xuống đất, và Ta ước gì lửa ấy đã được đốt lên rồi![a]”
  to: “Ta đã đến để ném lửa xuống đất, và Ta ước gì lửa ấy đã được nhóm lên rồi![a]”
  rationale: Chỉ sửa cách diễn đạt động từ liên quan đến lửa để phản ánh tự nhiên hơn ἀνήφθη (‘được nhóm lên’), và chỉnh chú thích sát chữ để không thêm sắc thái «còn». Bản chính vẫn theo cách hiểu cảm thán có cơ sở rộng rãi, trong khi chú thích bảo tồn tính khó và phương án đọc sát của nguyên văn.
