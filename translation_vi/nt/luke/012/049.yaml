review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng hình ảnh «lửa», động từ sứ mạng «đã đến», và không diễn giải ẩn dụ. Tuy nhiên, «lửa ... được đốt lên» không phải là cách kết hợp tự nhiên và chính xác nhất trong tiếng Việt: lửa được «nhóm lên» (được khơi cho cháy), còn «đốt» thường cần một đối tượng bị đốt. «Nhóm lên» truyền đạt phù hợp ἀνήφθη, ‘được/đã được thắp, nhóm lên’.'
  naturalness: Câu văn trang trọng, rõ và phù hợp lối lời trực tiếp của Chúa Giê-su. Thay «được đốt lên» bằng «được nhóm lên» làm hình ảnh lửa tự nhiên, thành ngữ hơn trong tiếng Việt hiện đại. Giữ «ném lửa xuống đất» được chấp nhận là cách diễn đạt sống động cho βάλλω ἐπὶ τὴν γῆν.
  terminology: «Ta» phù hợp với đăng ký Kinh Thánh trang trọng; «lửa» bảo toàn tính mở của ẩn dụ và không áp đặt nghĩa phán xét, thanh tẩy, Thánh Linh, hay chia rẽ. Chú thích cần giữ tính chất khó và cách đọc sát của mệnh đề cuối, nhưng không nên thêm «còn» vào bản sát chữ vì từ này không hiện diện trong tiếng Hy Lạp.
  issues:
  - severity: medium
    issue: Cụm «lửa ấy đã được đốt lên rồi» không tự nhiên và dễ gợi nghĩa lửa là vật bị đốt.
    rationale: ἀνήφθη là bị động của ἀνάπτω, nghĩa là ‘được thắp/nhóm lên, được làm bùng cháy’. Trong tiếng Việt, «nhóm lửa lên» là kết hợp từ thông dụng và sát hình ảnh hơn «đốt lửa lên».
  - severity: low
    issue: Chú thích dịch sát thêm từ «còn» trong «Ta còn muốn gì».
    rationale: τί θέλω chỉ là ‘Ta muốn gì?’; «còn» có thể là cách làm trôi chảy theo cách hiểu, nhưng không phù hợp khi chú thích tự nhận là dịch sát hơn. Bỏ từ này để chú thích minh bạch hơn về cấu trúc khó của nguyên văn.
  revised_text: “Ta đã đến để ném lửa xuống đất, và Ta ước gì lửa ấy đã được nhóm lên rồi![a]”
  revised_footnotes:
  - marker: a
    text: 'Hay, sát chữ hơn: “Ta muốn gì nếu lửa đã được nhóm lên rồi?” Mệnh đề Hy Lạp này khó hiểu; câu chính phản ánh cách hiểu có khả năng cao rằng đây là lời bày tỏ ước muốn mãnh liệt.'
    reason: alternative_reading
  revision_rationale: Chỉ sửa cách diễn đạt động từ liên quan đến lửa để phản ánh tự nhiên hơn ἀνήφθη (‘được nhóm lên’), và chỉnh chú thích sát chữ để không thêm sắc thái «còn». Bản chính vẫn theo cách hiểu cảm thán có cơ sở rộng rãi, trong khi chú thích bảo tồn tính khó và phương án đọc sát của nguyên văn.
