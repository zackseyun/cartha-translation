id: LUK.12.33
reference: Luke 12:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: vi
  text: Hãy bán tài sản của anh em và cho người nghèo[a]. Hãy sắm cho mình những túi tiền không hư mòn, một kho báu không bao giờ cạn trên trời[b], nơi kẻ trộm không đến gần và mối mọt không phá hoại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ Hy Lạp chỉ việc cho người thiếu thốn như một hành động thương xót.
    reason: lexical_clarification
  - marker: b
    text: Cũng có thể dịch là “trong các trời.” Tiếng Hy Lạp dùng dạng số nhiều, một thành ngữ thường được dịch tự nhiên là “trên trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Hãy bán
  rationale: Mệnh lệnh cách aorist số nhiều kêu gọi hành động dứt khoát; “hãy bán” rõ ràng mà không tự ý thêm ý bán sạch toàn bộ.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: tài sản của các con
  rationale: Cụm này chỉ những gì thuộc quyền sở hữu; “tài sản” tự nhiên và bao quát trong tiếng Việt hiện đại. Đại từ “các con” phù hợp lời Đức Giê-su trực tiếp dạy các môn đồ trong ngữ cảnh.
- source_word: δότε ἐλεημοσύνην
  choice: bố thí
  rationale: ἐλεημοσύνη chỉ hành động thương xót được thể hiện bằng việc cho người thiếu thốn. “Bố thí” giữ được danh từ chuyên biệt và sắc thái trang trọng của nguyên văn.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Hãy sắm cho mình
  rationale: “Sắm cho mình” chuyển tải hành động vì lợi ích của chính mình và kết hợp tự nhiên với hình ảnh túi tiền.
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: những túi tiền không hư mòn
  rationale: βαλλάντια là các túi đựng tiền; μὴ παλαιούμενα diễn tả chúng không cũ đi hoặc mòn hỏng. Cách dịch giữ nguyên ẩn dụ cụ thể.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: một kho báu không bao giờ cạn
  rationale: ἀνέκλειπτος có nghĩa không thất bại, không cạn kiệt; cách diễn đạt này tự nhiên và phân biệt với đặc tính không hư mòn của túi tiền.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ở trên các tầng trời
  rationale: Giữ dạng số nhiều của οὐρανοῖς bằng một cách diễn đạt tiếng Việt dễ hiểu, đồng thời không áp đặt một mô hình vũ trụ học chi tiết.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: nơi kẻ trộm không đến gần
  rationale: Bám sát hình ảnh không gian của ἐγγίζει và dùng lối nói tự nhiên.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: và mối mọt không phá hoại
  rationale: σής chỉ loài côn trùng ăn hỏng vải vóc; “mối mọt” là cách gọi thông dụng trong tiếng Việt cho hình ảnh hủy hoại tài sản, còn “phá hoại” thể hiện διαφθείρει.
theological_decisions:
- issue: Ý nghĩa của ἐλεημοσύνην trong lời dạy về tài sản
  choice: bố thí
  alternative: cho người nghèo; làm việc từ thiện
  rationale: “Bố thí” giữ hành động thương xót cụ thể đối với người thiếu thốn mà không mở rộng thành khái niệm từ thiện nói chung; chú thích làm rõ nghĩa cho độc giả hiện đại.
- issue: Dạng số nhiều của ἐν τοῖς οὐρανοῖς
  choice: ở trên các tầng trời
  alternative: ở trên trời; ở thiên đàng
  rationale: Cách dịch giữ dạng số nhiều và chất liệu ngôn ngữ của nguyên văn, nhưng không diễn giải nó thành một học thuyết về nhiều tầng trời.
- issue: Mối liên hệ giữa việc cho đi và kho báu trên trời
  choice: giữ nguyên hai mệnh lệnh và ẩn dụ, không giải thích cơ chế thần học
  alternative: diễn giải rằng việc bố thí trực tiếp lập công hoặc bảo đảm phần thưởng
  rationale: Nguyên văn đặt hai ý cạnh nhau nhưng không trình bày một hệ thống công trạng; bản dịch bảo tồn sức căng ấy thay vì giải quyết theo một lập trường giáo phái.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. Dùng “các con” theo ngữ cảnh Đức Giê-su nói với các môn đồ; giữ các hình ảnh “túi tiền,” “kho báu,” “kẻ trộm” và “mối mọt.” Mọi ký hiệu chú thích đều đã xuất hiện trong câu chính.
