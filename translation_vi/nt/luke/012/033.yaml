revisions:
- from: Hãy bán tài sản của các con và bố thí[a]. Hãy sắm cho mình những túi tiền không hư mòn, một kho báu không bao giờ cạn ở trên các tầng trời[b], nơi kẻ trộm không đến gần và mối mọt không phá hoại.
  to: Hãy bán tài sản của anh em và cho người nghèo[a]. Hãy sắm cho mình những túi tiền không hư mòn, một kho báu không bao giờ cạn trên trời[b], nơi kẻ trộm không đến gần và mối mọt không phá hoại.
  rationale: Sửa cách xưng hô để không thêm ý vào đại từ số nhiều của nguyên văn; thay “bố thí” bằng cách diễn đạt hiện đại, trực tiếp về việc cho người nghèo; và thay “các tầng trời” bằng “trên trời,” đồng thời giữ thông tin về số nhiều của tiếng Hy Lạp trong chú thích. Các mệnh lệnh, phép ẩn dụ và tính không diễn giải thần học của câu đều được bảo toàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:38Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các mệnh lệnh chính và các hình ảnh về túi tiền, kho báu, kẻ trộm và mối mọt. Tuy nhiên, “các con” thêm một quan hệ xưng hô không có trong đại từ số nhiều ὑμῶν, còn “các tầng trời” diễn giải dạng số nhiều của οὐρανοῖς thành một mô hình nhiều tầng. “Cho người nghèo” diễn đạt tự nhiên và rõ nghĩa hành vi bố thí hướng đến người thiếu thốn.
  naturalness: “Tài sản của anh em,” “cho người nghèo,” và “trên trời” là lối dùng hiện đại, trang trọng, dễ hiểu. “Bố thí” có thể mang sắc thái ban ơn hoặc hạ thấp người nhận trong tiếng Việt hiện nay; “các tầng trời” không tự nhiên trong văn xuôi Kinh Thánh hiện đại.
  terminology: Dùng “anh em” làm cách xưng hô số nhiều thông dụng trong ngữ cảnh lời dạy cho các môn đồ, không thêm quan hệ cha-con. Giữ “túi tiền,” “kho báu,” và thành ngữ Kinh Thánh quen thuộc “mối mọt.” Dạng số nhiều Hy Lạp của “các trời” được ghi ở chú thích thay vì chuyển thành “các tầng trời.”
  issues:
  - severity: medium
    issue: “các con” thêm sắc thái xưng hô không được biểu thị trong nguyên văn.
    rationale: ὑμῶν chỉ là “của các anh em/các bạn”; lời gọi “các con” đưa vào quan hệ cha-con và giọng xưng hô không cần thiết cho câu này.
  - severity: medium
    issue: “ở trên các tầng trời” diễn giải số nhiều của οὐρανοῖς.
    rationale: Dạng số nhiều “các trời” là thành ngữ Do Thái–Hy Lạp; “tầng” thêm ý về cấu trúc vũ trụ học mà bản văn không xác định. “Trên trời” là cách dịch Việt tự nhiên, với chú thích nêu dạng số nhiều.
  - severity: low
    issue: “bố thí” dễ có sắc thái ban ơn trong tiếng Việt hiện đại.
    rationale: ἐλεημοσύνη chỉ hành động ban cho người thiếu thốn như việc thương xót. “Cho người nghèo” nói rõ đối tượng ngữ nghĩa và tránh sắc thái xã hội không mong muốn.
