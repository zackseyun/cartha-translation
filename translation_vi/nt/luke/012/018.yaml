source:
  edition: SBLGNT
  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: vi
  text: 'Rồi ông ta nói: ‘Ta sẽ làm thế này: Ta sẽ phá các kho lẫm[a] của mình, xây những kho lớn hơn, rồi gom tất cả ngũ cốc[b] và của cải[c] của ta vào đó.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các kho chứa” (ἀποθήκας).
    reason: lexical_alternative
  - marker: b
    text: “Ngũ cốc” (σῖτος) trong một số ngữ cảnh có thể chỉ cụ thể “lúa mì”.
    reason: lexical_alternative
  - marker: c
    text: Hay “tài sản” thay cho “của cải” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Ta sẽ làm thế này
  rationale: Cách nói tự nhiên trong tiếng Việt, đồng thời giữ sắc thái nhấn mạnh và hướng tới kế hoạch sắp được trình bày.
- source_word: καθελῶ
  choice: Ta sẽ phá
  rationale: Diễn tả cụ thể việc dỡ bỏ các công trình hiện có; ngắn gọn và phù hợp với văn cảnh.
- source_word: ἀποθήκας
  choice: các kho lẫm
  rationale: Phù hợp với bối cảnh tích trữ nông sản, nhưng vẫn kèm chú thích về nghĩa rộng hơn là nơi chứa hàng.
- source_word: μείζονας οἰκοδομήσω
  choice: xây những kho lớn hơn
  rationale: Bổ sung danh từ được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ ràng, đồng thời giữ nghĩa so sánh của μείζονας.
- source_word: συνάξω ἐκεῖ
  choice: gom ... vào đó
  rationale: Diễn đạt tự nhiên hướng chuyển động và mục đích cất chứa trong tiếng Việt, không thêm ý tích lũy vượt quá văn bản.
- source_word: πάντα τὸν σῖτον
  choice: tất cả ngũ cốc
  rationale: Giữ nghĩa rộng của σῖτος; trong một số ngữ cảnh từ này có thể chỉ cụ thể lúa mì.
- source_word: τὰ ἀγαθά μου
  choice: của cải của ta
  rationale: Chỉ chung tài sản vật chất của người nói mà không thu hẹp thành tiền bạc.
theological_decisions: []
