    issue: Cấu trúc «mọi điều ấy là điều các dân ... tìm kiếm»
    rationale: Nguyên văn có «ταῦτα γὰρ πάντα» làm tân ngữ được đưa lên đầu, không có động từ liên kết tương đương «là». Cụm «là điều» vừa dư nghĩa vừa tạo câu tiếng Việt gượng; bỏ cụm này phục hồi quan hệ cú pháp trực tiếp.
