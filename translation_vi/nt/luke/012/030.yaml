id: LUK.12.30
reference: Luke 12:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: vi
  text: Vì mọi điều ấy, các dân trên thế gian tìm kiếm[a]; còn Cha của anh em biết rằng anh em cần những điều ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân ngoại trên thế gian”. Từ Hy Lạp này có thể chỉ “các dân” hoặc “các dân ngoại”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: mọi điều ấy
  rationale: Cụm chỉ các nhu cầu vật chất vừa được nhắc đến trong ngữ cảnh; cách diễn đạt này tự nhiên và giữ rõ đối tượng.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: các dân trên thế gian
  rationale: Giữ nghĩa rộng của ἔθνη là các dân/các dân ngoại và sắc thái của τοῦ κόσμου mà không thu hẹp quá mức.
- source_word: ἐπιζητοῦσιν
  choice: tìm kiếm
  rationale: Diễn tả sự chủ động theo đuổi trong tiếng Việt hiện đại; ngữ cảnh truyền đạt đủ cường độ của động từ ghép.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: Cha của anh em
  rationale: Bám sát quan hệ sở hữu trong nguyên văn và không thêm 'trên trời', vốn không có trong câu Hy Lạp này.
- source_word: οἶδεν
  choice: biết
  rationale: οἶδα tuy có hình thái hoàn thành nhưng mang nghĩa hiện tại.
- source_word: χρῄζετε
  choice: anh em cần
  rationale: Cách nói rõ ràng, tự nhiên cho nghĩa 'có nhu cầu'.
- source_word: τούτων
  choice: những điều ấy
  rationale: Lặp lại đại từ chỉ định như nguyên văn để duy trì sự nhấn mạnh và làm rõ đối tượng.
theological_decisions:
- issue: Sự tương phản giữa việc thế gian theo đuổi các nhu cầu và lòng tin của con cái đối với Cha
  choice: Giữ 'các dân trên thế gian' và 'Cha của anh em' mà không diễn giải thêm.
  alternative: Dịch ἔθνη là 'các dân ngoại' hoặc thêm 'trên trời' trước 'Cha'.
  rationale: Nguyên văn tạo sự tương phản giữa các dân trên thế gian và môn đồ có Đức Chúa Trời là Cha, nhưng không thêm từ 'trên trời' và vẫn để ἔθνη mang độ rộng vốn có.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng 'anh em' để chỉ số nhiều và giữ giọng dạy dỗ trực tiếp; cấu trúc đối chiếu 'còn' làm rõ δέ.
