source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: vi
  text: Và bất cứ ai nói một lời chống lại Con Người[a] thì sẽ được tha cho người ấy[b]; nhưng ai phạm thượng chống lại Đức Thánh Linh thì sẽ không được tha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ai nói một lời chống lại Con Người.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp nói sát nghĩa là “sẽ được tha cho người ấy”; điều được tha, tức lỗi phạm vừa nêu, được hàm ẩn.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: bất cứ ai
  rationale: Diễn đạt tự nhiên cấu trúc phân phối, khái quát của tiếng Hy Lạp và giữ nguyên phạm vi bao quát.
- source_word: ἐρεῖ λόγον
  choice: nói lời
  rationale: Giữ danh từ λόγον trong một cách diễn đạt tiếng Việt tự nhiên, thay vì giản lược thành chỉ ‘nói’.
- source_word: εἰς τὸν υἱὸν τοῦ ἀνθρώπου
  choice: chống lại Con Người
  rationale: Trong ngữ cảnh lời nói mang tính đối nghịch, εἰς có nghĩa ‘chống lại’; ‘Con Người’ là cách gọi tước hiệu quen thuộc và sát cấu trúc Hy Lạp.
- source_word: ἀφεθήσεται αὐτῷ
  choice: điều ấy sẽ được tha cho người đó
  rationale: Giữ thể bị động và bổ ngữ gián tiếp của nguyên văn; ‘điều ấy’ làm rõ rằng lỗi phạm qua lời nói là điều được tha.
- source_word: τῷ ... βλασφημήσαντι
  choice: ai phạm thượng
  rationale: Chuyển phân từ danh từ hóa thành mệnh đề khái quát tự nhiên trong tiếng Việt, không áp đặt sắc thái về thời điểm hay cơ chế của hành vi.
- source_word: εἰς τὸ ἅγιον πνεῦμα
  choice: đến Đức Thánh Linh
  rationale: ‘Phạm thượng đến’ là cách kết hợp trang trọng, dễ hiểu, thể hiện đối tượng của hành vi; ‘Đức Thánh Linh’ là danh xưng hiện đại phổ biến.
- source_word: οὐκ ἀφεθήσεται
  choice: sẽ không được tha
  rationale: Phản ánh trực tiếp thể tương lai bị động phủ định và giữ nguyên tính nghiêm trọng của lời tuyên bố.
theological_decisions:
- issue: Sự tương phản giữa nói lời chống lại Con Người và phạm thượng đến Đức Thánh Linh
  choice: Giữ nguyên sự phân biệt về khả năng được tha mà không giải thích bản chất hay cơ chế của tội không được tha.
  alternative: Diễn giải vế đầu là hành động do thiếu hiểu biết và vế sau là sự không ăn năn chung cuộc, hoặc mở rộng theo các phân đoạn song song.
  rationale: Câu Hy Lạp nêu rõ sự tương phản nhưng không tự giải thích cơ chế thần học; bản dịch không nên giải quyết một vấn đề còn gây tranh luận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng ‘Còn ... nhưng ...’ để thể hiện καὶ mở câu cùng sự tương phản τῷ δὲ; giữ ‘nói lời’ và cấu trúc bị động nhằm gần nguyên văn mà không gây tối nghĩa.
