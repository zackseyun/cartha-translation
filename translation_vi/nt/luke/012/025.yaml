  terminology: Dùng “một thước” cho πῆχυν là cách dùng Kinh Thánh Việt ngữ quen thuộc hơn “một gang tay”; chú thích giải thích đơn vị và bảo lưu nghĩa thay thế của ἡλικίαν.
