  source_fidelity: 'Bản dịch nhận đúng nghĩa chính theo mạch văn: không ai có thể, bằng sự lo lắng, thêm vào tuổi thọ của mình. Tuy nhiên, “gang tay” không tương ứng chính xác với πῆχυς, là đơn vị cubit (độ dài từ khuỷu tay đến đầu ngón tay), không phải gang/span. “Các con” cũng thêm sắc thái quan hệ cha-con không có trong đại từ số nhiều ὑμῶν.'
