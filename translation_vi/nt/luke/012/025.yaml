source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: vi
  text: Ai trong anh em, nhờ lo lắng, có thể thêm một thước vào tuổi thọ của mình?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Một thước” dịch πῆχυς, một đơn vị đo độ dài từ khuỷu tay đến đầu ngón tay. ἡλικία cũng có thể chỉ tầm vóc: “Ai trong anh em, nhờ lo lắng, có thể làm cho tầm vóc mình cao thêm một thước?”'
    reason: Giải thích đơn vị πῆχυς chính xác hơn và bảo lưu sự mơ hồ ngữ nghĩa của ἡλικία.
lexical_decisions:
- source_word: μεριμνῶν
  choice: nhờ lo lắng
  rationale: Diễn đạt tự nhiên phương tiện được phân từ Hy Lạp nêu ra, đồng thời giữ sắc thái lo âu.
- source_word: ἡλικίαν
  choice: đời mình
  rationale: ἡλικία có thể chỉ tuổi tác, quãng đời hoặc tầm vóc; trong ngữ cảnh lo lắng về sự sống, 'đời mình' là cách hiểu phù hợp hơn, nhưng sự mơ hồ được ghi nhận trong chú thích.
- source_word: πῆχυν
  choice: một gang tay
  rationale: πῆχυς là đơn vị chiều dài từ khuỷu tay đến đầu ngón tay; 'gang tay' là cách nói dễ hiểu trong tiếng Việt và vẫn giữ hình ảnh đo chiều dài của nguyên văn.
- source_word: προσθεῖναι
  choice: kéo dài ... thêm
  rationale: Khi đi với 'đời mình' và một đơn vị chiều dài, cách diễn đạt này truyền đạt tự nhiên ý 'thêm vào' mà không làm mất ẩn dụ.
- source_word: δύναται
  choice: có thể
  rationale: Phản ánh trực tiếp khả năng được hỏi trong câu hỏi tu từ.
theological_decisions:
- issue: ἡλικίαν có thể được hiểu là quãng đời/tuổi tác hoặc tầm vóc
  choice: đời mình
  alternative: tầm vóc của mình
  rationale: Mạch văn Lu-ca 12:22–26 tập trung vào sự sống và sự lo lắng; tuy nhiên, vì danh từ và đơn vị 'một πῆχυς' tạo nên sự mơ hồ thật sự, phương án kia được bảo tồn trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các con” theo lời Đức Giê-su nói với các môn đồ trong ngữ cảnh; câu hỏi tu từ được giữ nguyên.
