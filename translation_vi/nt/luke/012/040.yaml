  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: vi
  text: Anh em cũng hãy sẵn sàng, vì Con Người[a] sẽ đến vào giờ anh em không ngờ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: “Con của loài người”; đây là danh xưng Chúa Giê-su dùng cho chính mình, có thể gợi đến Đa-ni-ên 7:13–14.'
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “vào giờ anh em không nghĩ tới” hoặc “khi anh em không chờ đợi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Anh em cũng
  rationale: 'Diễn đạt tự nhiên ý bao gồm và nhấn mạnh: những người đang nghe cũng phải ở trong tư thế như các đầy tớ trong minh họa trước đó.'
- source_word: γίνεσθε ἕτοιμοι
  choice: hãy sẵn sàng
  rationale: Mệnh lệnh hiện tại kêu gọi một tư thế sẵn sàng liên tục. “Hãy sẵn sàng” vừa tự nhiên trong tiếng Việt vừa giữ rõ lực mệnh lệnh, không buộc động từ γίνεσθε phải mang nghĩa khởi sự “trở nên”.
- source_word: ὅτι
  choice: vì
  rationale: Liên từ này nêu lý do cho mệnh lệnh; “vì” rõ ràng và tự nhiên trong văn cảnh.
- source_word: ᾗ ὥρᾳ
  choice: vào giờ
  rationale: Cụm quan hệ ở cách dữ liệu có chức năng chỉ thời điểm. “Vào giờ” giữ hình ảnh về một thời khắc cụ thể nhưng chưa được người nghe biết.
- source_word: οὐ δοκεῖτε
  choice: anh em không ngờ
  rationale: δοκέω có thể là “nghĩ, cho rằng”; trong lời cảnh báo về thời điểm bất ngờ, “không ngờ” truyền đạt đúng ý thực tiễn mà vẫn giữ chú thích về nghĩa sát chữ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ cách dịch danh xưng đã quen thuộc, bảo toàn hình thức và âm vang khải huyền của cụm từ Hy Lạp mà không diễn giải thêm vào chính văn.
- source_word: ἔρχεται
  choice: sẽ đến
  rationale: Hiện tại Hy Lạp ở đây có giá trị tương lai. Tiếng Việt thường dùng “sẽ đến” để diễn đạt rõ một biến cố sắp xảy ra; ngữ cảnh vẫn giữ nguyên tính cấp bách của lời cảnh báo.
theological_decisions:
- issue: Cách dịch danh xưng ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Người Con của loài người
  rationale: “Con Người” là danh xưng quen thuộc của Chúa Giê-su và bảo toàn liên hệ khả dĩ với Đa-ni-ên 7:13–14, nhưng không đưa thêm một hệ thống giải nghĩa Kitô học vào câu.
- issue: Giá trị thời gian của ἔρχεται trong lời nói về thời sau cùng
  choice: sẽ đến
  alternative: đang đến
  rationale: Hiện tại Hy Lạp có thể được dùng với nghĩa tương lai. “Sẽ đến” là cách nói tự nhiên và rõ trong tiếng Việt; lựa chọn này không ấn định một hệ thống cánh chung cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” để xưng hô với số nhiều, “hãy” để thể hiện mệnh lệnh, và giữ danh xưng truyền thống “Con Người”. Hai chú thích bảo toàn sắc thái nguyên ngữ và liên hệ liên văn bản mà không làm nặng chính văn.
