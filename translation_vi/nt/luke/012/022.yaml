reference: Luke 12:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: vi
  text: 'Rồi ngài nói với các môn đệ của mình: “Vì thế, tôi bảo anh em: đừng lo lắng[a] về sự sống[b] của mình, sẽ ăn gì; cũng đừng lo về thân thể mình, sẽ mặc gì.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng bận lòng” hoặc “đừng lo âu.”'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “linh hồn”; tại đây, từ Hy Lạp thường mang nghĩa “sự sống”, tức đời sống hiện tại của một người.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Rồi ngài nói
  rationale: δέ là từ nối nhẹ; “rồi” tạo diễn tiến tự nhiên trong lời kể mà không biến nó thành một sự tương phản mạnh.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: với các môn đệ của mình
  rationale: Giữ rõ đại từ sở hữu αὐτοῦ và dùng “môn đệ” là cách gọi tự nhiên, quen thuộc cho μαθηταί trong ngữ cảnh này.
- source_word: Διὰ τοῦτο
  choice: Vì thế
  rationale: Cụm từ nêu kết luận dựa trên lời dạy ngay trước đó; “vì thế” vừa gọn vừa giữ được quan hệ nguyên nhân–suy luận.
- source_word: λέγω ὑμῖν
  choice: tôi bảo anh em
  rationale: Diễn đạt trực tiếp cả ngôi thứ nhất và đối tượng số nhiều; “bảo” tự nhiên hơn “nói với” trong công thức mở đầu một lời chỉ dạy.
- source_word: μὴ μεριμνᾶτε
  choice: đừng lo lắng
  rationale: μεριμνάω ở đây chỉ sự lo âu, bận lòng về nhu cầu đời sống; “đừng lo lắng” là tiếng Việt hiện đại, rõ nghĩa.
- source_word: τῇ ψυχῇ
  choice: cho sự sống của mình
  rationale: Trong ngữ cảnh thức ăn và áo mặc, ψυχή chỉ đời sống hay sự tồn tại trên đất, không nhất thiết là phần phi vật chất của con người.
- source_word: τί φάγητε
  choice: rằng sẽ ăn gì
  rationale: Thể giả định aorist mang sắc thái cân nhắc hướng tới tương lai; “sẽ ăn gì” truyền đạt tự nhiên ý ấy.
- source_word: μηδὲ τῷ σώματι
  choice: cũng đừng lo cho thân thể mình
  rationale: Giữ cấu trúc song song của μηδέ với mệnh đề cấm ở trước và diễn đạt rõ đối tượng của sự lo lắng.
- source_word: τί ἐνδύσησθε
  choice: rằng sẽ mặc gì
  rationale: ἐνδύω ở thể trung gian thường có nghĩa mặc hay khoác quần áo; cách dịch này tự nhiên và song song với “sẽ ăn gì”.
theological_decisions:
- issue: Nghĩa của ψυχή trong câu này
  choice: sự sống
  alternative: linh hồn
  rationale: Sự song song giữa thức ăn cho ψυχή và áo mặc cho σώμα cho thấy trọng tâm là đời sống hiện tại cùng các nhu cầu vật chất. Dịch “sự sống” tránh áp đặt một cách hiểu nhị nguyên mà chính câu này không đòi hỏi, đồng thời chú thích vẫn bảo tồn khả năng từ vựng “linh hồn”.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngài” trong lời kể và “tôi… anh em” trong lời trực tiếp để tránh lối xưng hô cổ; câu vẫn giữ cấu trúc song song giữa sự sống/thức ăn và thân thể/áo mặc.
