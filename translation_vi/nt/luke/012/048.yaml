revisions:
- from: Nhưng người không biết mà lại làm những việc đáng bị đòn thì sẽ bị đánh ít đòn. Ai đã được ban cho nhiều thì sẽ bị đòi hỏi nhiều; và người nào đã được giao phó nhiều thì người ta sẽ đòi hỏi người ấy nhiều hơn nữa.
  to: Nhưng người không biết mà đã làm những điều đáng chịu đòn thì sẽ bị đánh ít đòn. Ai được ban cho nhiều thì người ta sẽ đòi hỏi nhiều ở người ấy; và người nào được người ta giao phó nhiều thì người ta sẽ đòi hỏi ở người ấy nhiều hơn nữa.
