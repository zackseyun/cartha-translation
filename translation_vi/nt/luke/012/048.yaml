id: LUK.12.48
reference: Luke 12:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: vi
  text: Nhưng người không biết mà đã làm những điều đáng chịu đòn thì sẽ bị đánh ít đòn. Ai được ban cho nhiều thì người ta sẽ đòi hỏi nhiều ở người ấy; và người nào được người ta giao phó nhiều thì người ta sẽ đòi hỏi ở người ấy nhiều hơn nữa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: người không biết
  rationale: Diễn đạt tự nhiên phân từ được danh từ hóa, giữ đúng ý thiếu sự hiểu biết mà không tự thêm mức độ đáng trách.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: làm những việc đáng bị đòn
  rationale: Giữ quan hệ giữa hành vi và hình phạt, đồng thời bảo tồn hình ảnh cụ thể của nguyên văn.
- source_word: πληγῶν
  choice: đòn
  rationale: Trong ngữ cảnh hình phạt, từ này chỉ những cú đánh; “đòn” là cách nói rõ ràng, tự nhiên và không quy định một dụng cụ cụ thể.
- source_word: δαρήσεται ὀλίγας
  choice: sẽ bị đánh ít đòn
  rationale: Thể hiện rõ nghĩa bị động của δέρω và bổ sung danh từ được hiểu theo giống cái số nhiều ὀλίγας, tránh lối nói thiếu tự nhiên “nhận ít” trong tiếng Việt.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: Ai đã được ban cho nhiều
  rationale: Chuyển cấu trúc quan hệ sang một mệnh đề châm ngôn tự nhiên trong tiếng Việt, vẫn giữ thể bị động và ý về trách nhiệm.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: sẽ bị đòi hỏi nhiều
  rationale: ζητέω ở thể bị động trong ngữ cảnh này mang nghĩa yêu cầu hoặc đòi hỏi trách nhiệm; cách dịch giữ sắc thái mạnh hơn việc chỉ “tìm kiếm”.
- source_word: παρέθεντο
  choice: đã được giao phó
  rationale: Thể hiện nghĩa trao cho ai quản lý hoặc chịu trách nhiệm. Dùng thể bị động trong tiếng Việt để giữ chủ thể số nhiều không xác định của tiếng Hy Lạp mà không gượng ép.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: người ta sẽ đòi hỏi người ấy nhiều hơn nữa
  rationale: “Người ta” bảo tồn tác nhân số nhiều không xác định; “đòi hỏi” phù hợp với bối cảnh trách nhiệm, còn “nhiều hơn nữa” diễn đạt περισσότερον.
theological_decisions:
- issue: Bản chất của hình ảnh hình phạt
  choice: Giữ hình ảnh cụ thể “đòn” và “bị đánh ít đòn”.
  alternative: Khái quát thành “hình phạt”, hoặc cụ thể hóa thành “roi” hay “đánh bằng roi”.
  rationale: Câu dùng hình ảnh dụ ngôn về mức hình phạt tương ứng với sự hiểu biết và trách nhiệm. Bản dịch không làm nhẹ hình ảnh nhưng cũng không xác định cơ chế xét phạt vượt quá điều văn bản nói.
- issue: Tác nhân trong mệnh đề cuối
  choice: Dùng “đã được giao phó” và chủ thể không xác định “người ta”.
  alternative: Nêu rõ Đức Chúa Trời hoặc con người là chủ thể giao phó và đòi hỏi.
  rationale: Nguyên văn dùng động từ ngôi thứ ba số nhiều mà không nêu chủ thể. Cách dịch giữ tính khái quát và không tự giải quyết điều nguyên văn để ngỏ.
- issue: Sự khác biệt giữa ζητηθήσεται và αἰτήσουσιν
  choice: Dịch cả hai theo trường nghĩa “đòi hỏi”, nhưng mệnh đề sau thêm đối tượng rõ và mức độ “nhiều hơn nữa”.
  alternative: Phân biệt máy móc thành “sẽ bị yêu cầu” và “người ta sẽ xin”.
  rationale: Trong văn cảnh quản gia và trách nhiệm, cả hai đều mang lực yêu cầu hơn là lời xin đơn thuần. Tiếng Việt tự nhiên ưu tiên sự rõ nghĩa, trong khi cấu trúc và mức độ vẫn phân biệt hai vế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc châm ngôn song song; tránh từ cổ như “chịu đòn vọt” và tránh nêu rõ tác nhân mà tiếng Hy Lạp không xác định.
