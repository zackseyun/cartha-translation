  - severity: low
    issue: Vế “sẽ bị đòi hỏi nhiều” bỏ mất quan hệ ‘từ/ở người ấy’.
    rationale: παρ’ αὐτοῦ nêu rõ điều nhiều ấy được đòi hỏi nơi người đã nhận nhiều. Thêm “ở người ấy” làm rõ mà không thêm nghĩa.
