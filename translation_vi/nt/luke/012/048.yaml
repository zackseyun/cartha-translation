review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng mạch chính của câu: người không biết nhưng làm điều đáng chịu đòn thì bị đánh ít đòn; người được ban/giao nhiều thì bị đòi hỏi tương ứng nhiều hơn. Hình ảnh cụ thể của πληγαί/δέρω được bảo tồn, và tác nhân bất định ở mệnh đề cuối không bị đồng nhất với một chủ thể thần học cụ thể. Tuy nhiên, “đáng bị đòn” kém sát và kém tự nhiên hơn cách nói “đáng chịu đòn”; đồng thời vế “sẽ bị đòi hỏi nhiều” nên nêu rõ quan hệ “ở người ấy”, vốn được παρά αὐτοῦ diễn đạt.'
  naturalness: Văn phong nhìn chung hiện đại và rõ. Cần thay “làm những việc đáng bị đòn” bằng “làm những điều đáng chịu đòn”, cách kết hợp từ tự nhiên hơn trong tiếng Việt. Việc lặp “người ta” ở vế sau là cách tự nhiên để diễn đạt ngôi thứ ba số nhiều bất định của tiếng Hy Lạp.
  terminology: “Đòn” thích hợp cho πληγαί, không tự ý xác định là roi hay hình thức trừng phạt chuyên biệt. “Được ban cho” và “được giao phó” giữ được ý về điều được trao và trách nhiệm. “Đòi hỏi” phù hợp với ζητέω và αἰτέω trong văn cảnh này.
