  terminology: “Chim sẻ,” “át-sa-ri,” và “Đức Chúa Trời” nhất quán với văn phong Kinh Thánh tiếng Việt. “Bị quên lãng trước mặt Đức Chúa Trời” giữ sát ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ mà không diễn giải thành một khẳng định rộng hơn về sự quan phòng.
