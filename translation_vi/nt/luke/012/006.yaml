id: LUK.12.6
reference: Luke 12:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: vi
  text: Chẳng phải năm con chim sẻ được bán với giá hai át-sa-ri sao? Thế mà không một con nào trong số đó bị quên lãng trước mặt Đức Chúa Trời.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “với giá hai đồng xu”; tiếng Hy Lạp gọi các đồng tiền này là át-sa-ri, những đồng tiền nhỏ bằng đồng của La Mã.
    reason: cultural_note
  - marker: b
    text: Hoặc “bị bỏ sót trong mắt Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: chim sẻ
  rationale: Trong ngữ cảnh này, từ này thường chỉ chim sẻ; cách dịch này cụ thể, tự nhiên và phù hợp với loài chim nhỏ, ít giá trị trên thị trường.
- source_word: πωλοῦνται
  choice: được bán
  rationale: Giữ thể bị động của động từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀσσαρίων δύο
  choice: với giá hai át-sa-ri
  rationale: Giữ tên gọi cụ thể của đồng tiền đồng La Mã cổ thay vì thay bằng một đơn vị tiền hiện đại không tương đương; chú thích giải thích giá trị văn hóa.
- source_word: ἐπιλελησμένον
  choice: bị quên lãng
  rationale: Diễn đạt trạng thái bị quên của phân từ hoàn thành; “quên lãng” tự nhiên, trang trọng và không mở rộng ý sang một học thuyết về sự quan phòng.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Phản ánh trực tiếp ý nghĩa ở trước sự hiện diện hay trong tầm nhìn của Đức Chúa Trời, đồng thời giữ cách diễn đạt Kinh Thánh trang trọng và dễ hiểu.
- source_word: οὐχὶ ... ;
  choice: Chẳng phải ... sao?
  rationale: Thể hiện câu hỏi tu từ mong đợi câu trả lời khẳng định bằng cấu trúc tiếng Việt tự nhiên.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: Thế mà không một con nào trong số đó
  rationale: Nêu bật sự tương phản giữa giá trị thương mại thấp của những con chim và việc không con nào bị quên trước mặt Đức Chúa Trời.
theological_decisions:
- issue: Ngôn ngữ về sự ghi nhớ và chăm sóc của Đức Chúa Trời
  choice: không một con nào trong số đó bị quên lãng trước mặt Đức Chúa Trời
  alternative: không một con nào trong số đó bị bỏ sót trong mắt Đức Chúa Trời
  rationale: “Bị quên lãng” bám sát nghĩa từ vựng và giữ nguyên sức căng của lời khẳng định về sự lưu tâm của Đức Chúa Trời, không diễn giải quá mức thành một tuyên bố đầy đủ hơn về sự quan phòng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Chẳng phải ... sao?” giữ lực của câu hỏi tu từ; “Thế mà” làm rõ sự tương phản vốn hàm chứa trong mạch câu. Tên tiền cổ được phiên âm và giải thích trong chú thích.
