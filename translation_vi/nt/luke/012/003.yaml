source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: vi
  text: Vì vậy, mọi điều anh em nói trong bóng tối sẽ được nghe trong ánh sáng; và điều anh em nói nhỏ vào tai trong các phòng kín sẽ được công bố trên các mái nhà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ trên các mái nhà.” Hình ảnh là việc loan báo công khai từ những mái nhà phẳng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: Vì vậy
  rationale: Cụm thành ngữ này có chức năng suy luận, nối câu với lời trước đó về những điều kín giấu sẽ bị phơi bày.
- source_word: ὅσα
  choice: bất cứ điều gì
  rationale: Diễn đạt tự nhiên ý quan hệ bất định và bao quát của tiếng Hy Lạp.
- source_word: ἐν τῇ σκοτίᾳ ... ἐν τῷ φωτί
  choice: trong bóng tối ... ngoài ánh sáng
  rationale: Giữ sự tương phản giàu hình ảnh giữa kín giấu và công khai; “ngoài ánh sáng” tự nhiên trong tiếng Việt mà vẫn bảo toàn hình tượng.
- source_word: ἀκουσθήσεται
  choice: sẽ được nghe
  rationale: Giữ dạng bị động tương lai và không xác định ai là người làm cho điều ấy bị nghe thấy.
- source_word: πρὸς τὸ οὖς
  choice: vào tai người khác
  rationale: Giữ hình ảnh cụ thể của thành ngữ chỉ lời nói riêng tư, đồng thời bổ sung đối tượng hàm ẩn để câu tiếng Việt rõ nghĩa.
- source_word: ἐν τοῖς ταμείοις
  choice: trong các phòng kín
  rationale: ταμεῖον có thể là phòng trong, phòng riêng hoặc kho; trong ngữ cảnh này, “phòng kín” nhấn mạnh tính riêng tư mà không giới hạn thành kho chứa đồ.
- source_word: κηρυχθήσεται
  choice: sẽ được công bố
  rationale: Diễn đạt hành động loan báo công khai của κηρύσσω mà không thu hẹp thành hoạt động giảng đạo.
- source_word: ἐπὶ τῶν δωμάτων
  choice: trên các mái nhà
  rationale: Theo sát giới từ và danh từ Hy Lạp, gợi cảnh loan báo công khai từ những mái nhà phẳng thời cổ.
theological_decisions:
- issue: Bản chất và thời điểm của việc phơi bày điều kín giấu
  choice: Diễn đạt như lời cảnh báo rộng rằng điều bí mật sẽ trở nên công khai, không xác định thời điểm hay tác nhân.
  alternative: Hiểu riêng là sự phơi bày trong ngày phán xét cuối cùng, hoặc chỉ là sự vạch trần thói đạo đức giả trong lịch sử hiện tại.
  rationale: Ngữ cảnh gần nói về điều kín giấu bị bày tỏ, nhưng chính câu này không giới hạn việc ấy vào một thời điểm hoặc cơ chế cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để chỉ nhóm người nghe ở số nhiều; giữ phép đối “bóng tối/ánh sáng” và hình ảnh “mái nhà” thay vì giải nghĩa trực tiếp thành kín đáo/công khai.
