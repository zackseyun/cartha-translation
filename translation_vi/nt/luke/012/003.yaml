revisions:
- from: Vì vậy, bất cứ điều gì anh em nói trong bóng tối sẽ được nghe ngoài ánh sáng; và điều anh em nói vào tai người khác trong các phòng kín sẽ được công bố trên các mái nhà.[a]
  to: Vì vậy, mọi điều anh em nói trong bóng tối sẽ được nghe trong ánh sáng; và điều anh em nói nhỏ vào tai trong các phòng kín sẽ được công bố trên các mái nhà.[a]
  rationale: Sửa “ngoài ánh sáng” thành “trong ánh sáng” để phản ánh trực tiếp ἐν τῷ φωτί và bảo toàn phép đối với “trong bóng tối.” Đổi “bất cứ điều gì” thành “mọi điều” cho văn xuôi gọn tự nhiên, vẫn giữ ý bao quát của ὅσα. Đổi “nói vào tai người khác” thành “nói nhỏ vào tai” để tránh thêm đối tượng không nêu rõ và để thành ngữ tiếng Việt tự nhiên hơn trong ngữ cảnh lời nói kín đáo. Chú thích được giữ nguyên vì phản ánh hợp lý lựa chọn dịch ἐπὶ τῶν δωμάτων.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:23Z'
