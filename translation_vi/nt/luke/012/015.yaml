revisions:
- from: 'Rồi Ngài nói với họ: “Hãy coi chừng và giữ mình khỏi mọi thứ tham lam,[a] vì dù một người có dư dật, sự sống của người ấy cũng không đến từ những gì mình sở hữu.”'
  to: 'Rồi Ngài nói với họ: “Hãy coi chừng và giữ mình khỏi mọi hình thức tham lam,[a] vì sự sống của một người không nằm ở chỗ người ấy có dư dật của cải.”'
  rationale: 'Sửa câu cuối để phản ánh sát hơn cấu trúc Hy Lạp: sự sống không hệ tại ở sự dư dật có từ của cải, thay vì đơn thuần không có nguồn từ tài sản. Đồng thời thay cụm từ chưa tự nhiên “mọi thứ tham lam” bằng cách nói hiện đại, rõ nghĩa hơn. Chú thích được điều chỉnh nhẹ để phù hợp với bản chính và giữ lựa chọn từ vựng thay thế.'
