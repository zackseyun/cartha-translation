source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: vi
  text: 'Rồi Ngài nói với họ: “Hãy coi chừng và giữ mình khỏi mọi hình thức tham lam,[a] vì sự sống của một người không nằm ở chỗ người ấy có dư dật của cải.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi mọi sự tham muốn chiếm hữu.” Từ Hy Lạp πλεονεξία có thể chỉ lòng tham, sự ham muốn có thêm hoặc khuynh hướng chiếm hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Hãy coi chừng
  rationale: Mệnh lệnh số nhiều mang sắc thái cảnh báo; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được lời kêu gọi phải tỉnh thức.
- source_word: φυλάσσεσθε
  choice: giữ mình
  rationale: Mệnh lệnh trung động nhấn mạnh việc tự bảo vệ; “giữ mình” vừa gọn vừa giữ được sắc thái phản thân, đồng thời không lặp lại “coi chừng”.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: khỏi mọi thứ tham lam
  rationale: πάσης diễn tả phạm vi toàn diện, còn πλεονεξία chỉ lòng tham muốn có thêm hoặc chiếm hữu; cách dịch này bao quát các biểu hiện khác nhau của lòng tham.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: dù một người có dư dật, sự sống của người ấy cũng không đến từ
  rationale: Cấu trúc Hy Lạp phủ nhận việc sự sống bắt nguồn từ tình trạng dư dật. Lối diễn đạt nhượng bộ–phủ định này tự nhiên trong tiếng Việt và giữ quan hệ ý nghĩa của câu.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: những gì mình sở hữu
  rationale: Danh từ hóa τὰ ὑπάρχοντα chỉ những thứ thuộc về một người, tức tài sản hay của cải; cách dịch này rõ nghĩa mà không thu hẹp vào một loại tài sản cụ thể.
theological_decisions:
- issue: Phạm vi của πλεονεξία
  choice: mọi thứ tham lam
  alternative: mọi lòng tham muốn của cải
  rationale: Lời cảnh báo nhắm đến ham muốn chiếm hữu nói chung, không chỉ việc thèm muốn tài sản của người khác; bản dịch giữ phạm vi rộng mà không thêm một nội dung giáo lý riêng.
- issue: Nguồn hay bản chất của sự sống
  choice: sự sống ... không đến từ những gì mình sở hữu
  alternative: sự sống ... không cốt tại của cải mình dư dật
  rationale: ἐκ nhấn mạnh rằng của cải không phải nguồn đem lại sự sống, trong khi toàn cấu trúc cũng có thể được hiểu là sự sống không hệ tại của cải. Bản chính giữ sắc thái nguồn gốc; phương án còn lại được ghi nhận như một cách diễn đạt khả dĩ.
- issue: Cách diễn đạt đại từ giống đực mang nghĩa khái quát
  choice: một người ... người ấy ... mình
  alternative: người ta ... họ
  rationale: τινί và αὐτοῦ/αὐτῷ nói về bất kỳ người nào chứ không riêng nam giới. Cách dịch số ít này bảo toàn tính khái quát và mạch quy chiếu tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su trong mạch kể; hai mệnh lệnh “coi chừng” và “giữ mình” bảo toàn nhịp cảnh báo kép của nguyên văn.
