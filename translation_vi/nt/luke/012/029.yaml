- from: Còn anh em, đừng mải tìm kiếm xem mình sẽ ăn gì và uống gì; cũng đừng bất an.[a]
  to: Còn anh em, đừng tìm kiếm xem mình sẽ ăn gì và uống gì; cũng đừng bất an.[a]
  rationale: Chỉ bỏ “mải” để không đưa vào bản dịch một mức độ theo đuổi mà nguyên văn không nói minh thị. Giữ “Còn anh em,” cấu trúc “ăn gì và uống gì,” và “bất an” vì chúng phản ánh tốt câu Hy Lạp và phù hợp tiếng Việt hiện đại. Chú thích được chỉnh nhẹ để diễn đạt hình ảnh từ nguyên rõ ràng, tự nhiên hơn.
