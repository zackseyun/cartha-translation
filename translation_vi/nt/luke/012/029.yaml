reference: Luke 12:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: vi
  text: Còn anh em, đừng tìm kiếm xem mình sẽ ăn gì và uống gì; cũng đừng bất an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đừng lo lắng” hoặc “đừng bồn chồn”; theo hình ảnh gốc của từ Hy Lạp, nghĩa là đừng ở trong tình trạng thấp thỏm, như bị treo lơ lửng.'
    reason: Nêu các sắc thái có thể có của μετεωρίζεσθε, một động từ hiếm chỉ sự bất ổn, lo âu hoặc thấp thỏm.
lexical_decisions:
- source_word: ὑμεῖς
  choice: anh em
  rationale: Đại từ Hy Lạp được nêu rõ để nhấn mạnh. Cụm “Còn anh em” vừa thể hiện sự đối chiếu trong ngữ cảnh vừa tự nhiên trong tiếng Việt; “anh em” phù hợp với cách Đức Giê-su trực tiếp nói với các môn đồ.
- source_word: ζητεῖτε
  choice: mải tìm kiếm
  rationale: ζητέω có nghĩa là tìm kiếm hoặc theo đuổi. Từ “mải” diễn đạt sự theo đuổi dai dẳng, bận lòng được hàm ý bởi mệnh lệnh phủ định ở thì hiện tại và ngữ cảnh, nhưng không biến câu này thành lời cấm mọi sự chuẩn bị thông thường.
- source_word: τί φάγητε καὶ τί πίητε
  choice: xem mình sẽ ăn gì và uống gì
  rationale: Cách diễn đạt này giữ hai mệnh đề nghi vấn gián tiếp và liên từ καί, đồng thời tự nhiên trong tiếng Việt. “Sẽ” ở đây diễn tả điều chưa xác định đang được nghĩ đến, không khẳng định tiền định.
- source_word: μετεωρίζεσθε
  choice: bất an
  rationale: Động từ hiếm này gợi trạng thái lơ lửng, thấp thỏm hoặc dao động tinh thần. “Bất an” giữ được nét không yên, không ổn định mà không thu hẹp nghĩa hoàn toàn thành sự lo âu; các khả năng khác được nêu trong chú thích.
- source_word: καὶ ... καὶ ... καὶ
  choice: và ... và ... cũng
  rationale: Giữ quan hệ cộng dồn của các liên từ Hy Lạp. Dùng “cũng” ở mệnh lệnh thứ hai giúp câu tiếng Việt rõ và tự nhiên, còn dấu chấm phẩy phân biệt hai lệnh cấm.
theological_decisions:
- issue: Phạm vi của lời cấm liên quan đến thức ăn và thức uống
  choice: Lời cấm nhắm vào việc mải miết tìm kiếm và bất an về nhu cầu vật chất
  alternative: Lời cấm mọi sự dự liệu bình thường về đồ ăn thức uống, hoặc lời kêu gọi thờ ơ hoàn toàn với nhu cầu thân thể
  rationale: Ngữ cảnh bàn về nỗi lo đối với nhu cầu hằng ngày. Bản dịch giữ nguyên sức nặng của mệnh lệnh nhưng không biến lời ấy thành chủ nghĩa khổ hạnh hay phủ nhận việc chuẩn bị chính đáng.
- issue: Sắc thái của μετεωρίζεσθε
  choice: Giữ nét nghĩa rộng là “bất an” và ghi các khả năng trong chú thích
  alternative: Chỉ dịch là “lo lắng” hoặc dịch sát hình ảnh là “bị treo lơ lửng”
  rationale: “Lo lắng” phù hợp ngữ cảnh nhưng có thể thu hẹp một động từ vốn gợi sự chao đảo và thấp thỏm; còn cách dịch theo hình ảnh nguyên thủy sẽ khó hiểu trong tiếng Việt. “Bất an” bảo tồn phần nào sự mơ hồ chân thực.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Còn anh em” thể hiện sự nhấn mạnh và đối chiếu; “mải tìm kiếm” tránh cách hiểu rằng câu này cấm mọi việc chuẩn bị thông thường. Chú thích bảo tồn trường nghĩa không hoàn toàn chắc chắn của động từ cuối câu.
