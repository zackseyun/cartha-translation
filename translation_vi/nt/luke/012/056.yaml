source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: vi
  text: Hỡi những kẻ đạo đức giả! Các ngươi biết phân biệt bộ mặt của đất và trời, thế mà tại sao không biết phân biệt thời kỳ này?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “thời điểm này” hay “thời cơ quyết định này.” Từ Hy Lạp καιρός có thể chỉ một thời điểm quan trọng hoặc thích hợp, chứ không chỉ thời gian nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hỡi những kẻ đạo đức giả!
  rationale: Lời gọi trực tiếp mang tính quở trách. Cách dịch này diễn đạt sự giả hình về đạo đức, không gợi nghĩa diễn viên sân khấu.
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: diện mạo của đất và trời
  rationale: πρόσωπον theo nghĩa đen là “mặt”, nhưng trong kết cấu này chỉ trạng thái hay vẻ bề ngoài có thể quan sát của đất và bầu trời. “Diện mạo” vừa giữ hình ảnh nguồn vừa tự nhiên, trang trọng trong tiếng Việt.
- source_word: οἴδατε δοκιμάζειν
  choice: biết nhận định
  rationale: οἴδατε với động từ nguyên mẫu diễn tả biết cách hoặc có khả năng; δοκιμάζειν ở đây là xem xét để phân định ý nghĩa của các dấu hiệu. “Biết nhận định” giữ được cả sự đánh giá và phân định.
- source_word: τὸν καιρὸν τοῦτον
  choice: thời điểm này
  rationale: καιρός có thể chỉ một thời điểm, thời kỳ hoặc cơ hội mang ý nghĩa đặc biệt, chứ không chỉ thời gian nói chung. “Thời điểm này” dịch trực tiếp yếu tố chỉ định mà không giải thích quá mức.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: vậy sao lại không biết nhận định
  rationale: Câu hỏi tu từ mang giọng trách cứ; “vậy sao lại” tự nhiên trong tiếng Việt và giữ sự tương phản với khả năng nhận định vừa nêu.
theological_decisions:
- issue: Ý nghĩa của καιρός trong lời quở trách của Chúa Giê-su
  choice: thời điểm này
  alternative: thời kỳ này; thời cơ quyết định này
  rationale: Ngữ cảnh gợi một thời điểm có ý nghĩa trong chức vụ của Chúa Giê-su và hành động của Đức Chúa Trời, nhưng bản dịch chính không nói rõ hơn điều từ Hy Lạp. Chú thích bảo tồn chiều nghĩa định tính của καιρός.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lời quở trách trực diện, sự lặp lại của “biết nhận định,” cùng nét nghĩa mở của καιρός. Dùng “các ngươi” để phản ánh lời gọi số nhiều và giọng trách cứ mạnh trong ngữ cảnh.
