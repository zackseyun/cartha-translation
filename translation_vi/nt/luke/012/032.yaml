id: LUK.12.32
reference: Luke 12:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: vi
  text: '“Đừng sợ[a], hỡi bầy chiên bé nhỏ[b], vì Cha của anh em đã vui lòng ban vương quốc[c] cho anh em.”


    [a] Cũng có thể dịch: “Đừng lo sợ.”


    [b] Cũng có thể dịch: “bầy chiên nhỏ.”


    [c] “Vương quốc” cũng có thể được hiểu là “quyền trị vì,” nhấn mạnh sự cai trị của Đức Chúa Trời cũng như phương diện vương quốc được ban cho dân Ngài.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng lo sợ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bầy chiên nhỏ.”'
    reason: lexical_alternative
  - marker: c
    text: “Vương quốc” cũng có thể được hiểu là “quyền trị vì,” nhấn mạnh sự cai trị của Đức Chúa Trời cũng như phương diện vương quốc được ban cho dân Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ
  rationale: Mệnh lệnh hiện tại đi với μή tạo lời ngăn cấm trực tiếp. “Đừng sợ” ngắn gọn, tự nhiên và giữ nguyên sức trực tiếp của câu Hy Lạp; “đừng lo sợ” là một cách diễn đạt tương đương.
- source_word: τὸ μικρὸν ποίμνιον
  choice: hỡi bầy chiên bé nhỏ
  rationale: ποίμνιον chỉ một bầy, đặc biệt là bầy chiên; thêm “chiên” làm rõ hình ảnh mục tử vốn hàm chứa trong từ Hy Lạp. “Bé nhỏ” vừa diễn tả quy mô nhỏ vừa giữ sắc thái trìu mến.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu lý do cho lời khuyên đừng sợ. “Vì” diễn đạt quan hệ nguyên nhân rõ ràng và tự nhiên trong tiếng Việt.
- source_word: εὐδόκησεν
  choice: đã vui lòng
  rationale: Động từ aorist diễn tả ý muốn tốt lành và sự hài lòng của Cha. “Đã vui lòng” truyền đạt sáng kiến đầy thiện ý mà không biến câu thành một phát biểu kỹ thuật về tiền định.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Cha của anh em
  rationale: Bản Hy Lạp chỉ nói “Cha của anh em,” không có tính từ “trên trời.” Cách dịch này giữ nguyên nội dung và quan hệ thân thuộc.
- source_word: δοῦναι ὑμῖν
  choice: ban ... cho anh em
  rationale: δίδωμι có nghĩa cơ bản là “cho.” Trong văn cảnh nói về Cha ban vương quốc, “ban” tự nhiên và trang trọng vừa phải, không thêm ý nghĩa ngoài nguyên văn.
- source_word: τὴν βασιλείαν
  choice: vương quốc
  rationale: βασιλεία có thể chỉ vương quốc hoặc quyền trị vì. “Vương quốc” là cách diễn đạt rõ ràng, quen thuộc, đồng thời chú thích bảo lưu sắc thái về sự cai trị.
theological_decisions:
- issue: Sắc thái của βασιλεία
  choice: vương quốc
  alternative: quyền trị vì
  rationale: “Vương quốc” bảo toàn hình ảnh rộng, có thể bao gồm cả lãnh vực lẫn dân thuộc quyền vua; chú thích ghi nhận nghĩa về hành động cai trị để không thu hẹp thuật ngữ Hy Lạp.
- issue: Ý nghĩa của εὐδόκησεν đối với ý muốn của Đức Chúa Trời
  choice: đã vui lòng
  alternative: đã quyết định cách nhân từ
  rationale: Cách dịch được chọn nhấn mạnh thiện ý của Cha nhưng không áp đặt một cách diễn giải giáo lý kỹ thuật về sắc lệnh hay tiền định.
- issue: Chủ thể ban vương quốc
  choice: Cha của anh em
  alternative: Cha trên trời của anh em
  rationale: Không thêm “trên trời,” vì tính từ này không có trong câu Hy Lạp, dù danh xưng “Cha” trong văn cảnh chỉ về Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ lời xưng hô tập thể “anh em” phù hợp văn phong Kinh Thánh và số nhiều của đại từ Hy Lạp. Trật tự câu bám gần nguyên văn, còn “hỡi” đánh dấu rõ lời gọi trực tiếp và giữ sắc thái trìu mến của hình ảnh mục tử.
