revisions:
- from: Vì khi anh đang cùng người kiện mình đi đến trước nhà chức trách, hãy cố gắng dọc đường để thoát khỏi người ấy[a], kẻo người ấy lôi anh đến quan tòa; rồi quan tòa giao anh cho viên chấp pháp, và viên chấp pháp tống anh vào tù.
  to: Vì khi anh cùng người kiện anh đang trên đường đến gặp một nhà chức trách, hãy cố gắng dọc đường để thoát khỏi người ấy[a], kẻo người ấy lôi anh đến quan tòa; rồi quan tòa giao anh cho viên chấp pháp, và viên chấp pháp tống anh vào tù.
  rationale: Chỉnh nhẹ để phản ánh số ít của ἄρχοντα và làm câu tiếng Việt tự nhiên, nhất quán về đại từ hơn. Không thay đổi hình ảnh pháp lý, sắc thái cưỡng ép của “lôi” và “tống,” hay độ mở diễn giải của cụm “thoát khỏi người ấy.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:43Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự của hình ảnh pháp lý: đang đi cùng bên kiện đến một cấp có thẩm quyền, nỗ lực giải quyết trước khi bị lôi đến quan tòa, bị giao cho viên chấp pháp, rồi bị tống giam. Tuy nhiên, “nhà chức trách” thường là danh từ tập hợp và không phản ánh rõ số ít của ἄρχοντα; thêm “một” và dùng cấu trúc ‘đến gặp’ làm rõ nghĩa hơn.'
  naturalness: Câu hiện có thể hiểu được, nhưng “đang cùng người kiện mình đi đến trước nhà chức trách” hơi nặng và không nhất quán với đại từ trực tiếp “anh”. “Khi anh cùng người kiện anh đang trên đường đến gặp một nhà chức trách” tự nhiên, mạch lạc hơn trong tiếng Việt chuẩn hiện đại.
  terminology: “Người kiện anh,” “quan tòa,” và “viên chấp pháp” phù hợp bối cảnh pháp lý cổ mà không đồng nhất các vai trò với cơ cấu tố tụng hiện đại. “Thoát khỏi người ấy” bảo lưu cách diễn đạt tương đối sát của ἀπηλλάχθαι ἀπ’ αὐτοῦ; chú thích nêu khả năng dàn xếp theo ngữ cảnh.
