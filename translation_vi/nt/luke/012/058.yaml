id: LUK.12.58
reference: Luke 12:58
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: vi
  text: Vì khi anh cùng người kiện anh đang trên đường đến gặp một nhà chức trách, hãy cố gắng dọc đường để thoát khỏi người ấy[a], kẻo người ấy lôi anh đến quan tòa; rồi quan tòa giao anh cho viên chấp pháp, và viên chấp pháp tống anh vào tù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dàn xếp với người ấy.” Nguyên văn Hy Lạp là “được giải thoát khỏi người ấy,” nhưng trong ngữ cảnh, cụm từ này có lẽ nói đến việc giải quyết vụ kiện trước khi đến gặp quan tòa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: Vì khi
  rationale: Giữ chức năng giải thích của γάρ và đưa vào tình huống minh họa một cách tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀντιδίκου
  choice: người kiện mình
  rationale: Trong bối cảnh pháp lý, từ này chỉ bên đối tụng đang đưa vụ việc ra xét xử; cách diễn đạt này rõ nghĩa hơn từ chung chung như “đối thủ”.
- source_word: ἄρχοντα
  choice: nhà chức trách
  rationale: Diễn đạt một người có thẩm quyền hành chính hoặc tư pháp mà không đồng nhất người ấy với quan tòa được nhắc ngay sau đó.
- source_word: δὸς ἐργασίαν
  choice: hãy cố gắng
  rationale: Chuyển tải thành ngữ thúc giục người nghe chủ động nỗ lực, bằng lối nói tự nhiên và trang trọng vừa phải.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: để thoát khỏi người ấy
  rationale: Giữ gần hình thức “được giải thoát khỏi người ấy” của tiếng Hy Lạp nhưng tránh lối diễn đạt quá cứng; ý dàn xếp vụ kiện được ghi ở chú thích vì mang tính giải thích theo ngữ cảnh.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Vừa giữ hình ảnh đang trên đường, vừa thể hiện tính khẩn cấp phải hành động trước khi đến nơi xét xử.
- source_word: κατασύρῃ
  choice: lôi
  rationale: Giữ sắc thái mạnh và cưỡng ép của động từ Hy Lạp.
- source_word: κριτήν / κριτής
  choice: quan tòa
  rationale: Là cách gọi rõ ràng, tự nhiên trong tiếng Việt đối với người thực hiện việc xét xử.
- source_word: παραδώσει
  choice: giao anh cho
  rationale: Diễn đạt tự nhiên việc chuyển giao người bị xét xử cho viên chức thi hành phán quyết.
- source_word: πράκτορι / πράκτωρ
  choice: viên chấp pháp
  rationale: Chỉ viên chức thi hành lệnh của quan tòa, có thể đảm trách việc thu nợ hoặc giam giữ; tránh gắn với một chức danh pháp lý hiện đại quá đặc thù.
- source_word: βαλεῖ εἰς φυλακήν
  choice: tống anh vào tù
  rationale: Giữ sức mạnh và tính sinh động của βάλλω hơn cách nói trung tính “đưa vào tù”.
theological_decisions:
- issue: Mức độ diễn giải lời khuyên trong hình ảnh pháp lý
  choice: Giữ nguyên cảnh kiện tụng và không xác định các nhân vật là những thực thể thần học cụ thể.
  alternative: Diễn giải trực tiếp đây là lời kêu gọi hòa giải với Đức Chúa Trời trước sự phán xét cuối cùng.
  rationale: Câu này trình bày một tình huống pháp lý. Bối cảnh rộng hơn có thể gợi ý tính cấp bách trước sự phán xét, nhưng chính câu không xác định người kiện, quan tòa hay nhà tù theo nghĩa thần học.
- issue: Ý nghĩa của ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: Giữ cách nói tương đối sát là “thoát khỏi người ấy”, đồng thời nêu nghĩa dàn xếp trong chú thích.
  alternative: Dịch thẳng trong chính văn là “dàn xếp với người ấy”.
  rationale: Cách chọn giữ được độ mở của lời Hy Lạp, trong khi chú thích giúp người đọc nhận ra ý nghĩa pháp lý có khả năng nhất trong ngữ cảnh.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, sáng rõ và trang nghiêm vừa phải. Đại từ “anh” phản ánh lời nói trực tiếp với một người ở ngôi thứ hai số ít. Các thuật ngữ pháp lý được chọn để dễ hiểu mà không áp đặt cơ cấu tòa án hiện đại lên bối cảnh cổ đại.
