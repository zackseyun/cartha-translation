  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: vi
  text: Nhưng Ta có một phép báp-têm phải chịu[a][b], và Ta bị dồn ép biết bao[c] cho đến khi việc ấy được hoàn tất!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Ta có một phép báp-têm để được báp-têm.” Tiếng Hy Lạp lặp lại từ ngữ để làm nổi bật hình ảnh báp-têm.'
    reason: lexical_alternative
  - marker: b
    text: “Phép báp-têm” ở đây là một hình ảnh ẩn dụ, nói đến sự đau khổ dữ dội và cái chết mà Đức Giê-su sắp phải chịu.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “Ta bị ràng buộc biết bao,” “Ta chịu áp lực biết bao,” hoặc “Ta đau khổ biết bao.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: một phép báp-têm
  rationale: Giữ nguyên hình ảnh báp-têm có chủ ý trong tiếng Hy Lạp, thay vì diễn giải ngay thành sự đau khổ hay cái chết. Trong ngữ cảnh, từ này được dùng theo nghĩa ẩn dụ về biến cố sắp bao phủ Đức Giê-su.
- source_word: ἔχω βαπτισθῆναι
  choice: còn phải chịu
  rationale: Cấu trúc ἔχω với động từ nguyên mẫu diễn tả điều đang chờ đợi và mang tính tất yếu. “Phải chịu” tự nhiên trong tiếng Việt, đồng thời giữ sắc thái thụ động của βαπτισθῆναι; “còn” làm rõ biến cố ấy chưa xảy ra.
- source_word: πῶς συνέχομαι
  choice: lòng Ta khắc khoải biết bao
  rationale: πῶς có tính cảm thán, còn συνέχομαι diễn tả trạng thái bị ép chặt, dồn nén hoặc đau buồn sâu sắc. Cách dịch này tự nhiên, trang trọng và truyền đạt áp lực nội tâm mà không xác định quá mức đó là sợ hãi hay nóng lòng.
- source_word: ἕως ὅτου
  choice: cho đến khi
  rationale: Diễn đạt rõ điểm kết thúc về thời gian bằng một kết cấu tiếng Việt tự nhiên.
- source_word: τελεσθῇ
  choice: phép ấy hoàn tất
  rationale: Động từ ở thể thụ động chỉ việc được đưa đến chỗ trọn vẹn. “Hoàn tất” giữ ý hoàn thành mà không cố ý vay mượn cách nói trong Giăng 19:30.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “phép báp-têm”
  choice: Giữ hình ảnh phép báp-têm trong chính văn, đồng thời chú thích rằng trong ngữ cảnh nó chỉ sự đau khổ và cái chết sắp đến của Đức Giê-su.
  alternative: Diễn giải trực tiếp là “một cuộc đau khổ” hoặc hiểu theo nghĩa đen là nghi thức báp-têm bằng nước.
  rationale: Ngữ cảnh hướng đến cuộc thương khó, nhưng chính văn Hy Lạp chủ ý dùng hình ảnh báp-têm. Giữ ẩn dụ bảo toàn sức gợi và sự căng thẳng thần học của câu.
- issue: Sắc thái của συνέχομαι
  choice: “lòng Ta khắc khoải”
  alternative: “Ta bị dồn ép”, “Ta chịu áp lực” hoặc “Ta đau buồn”.
  rationale: Từ Hy Lạp cho phép cả sắc thái bị ràng buộc, chịu áp lực và khốn quẫn. “Khắc khoải” không quyết định liệu cảm xúc chủ yếu là đau buồn, áp lực hay sự thôi thúc hướng đến việc hoàn thành.
translation_notes:
  register: Dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp với lời Đức Giê-su trong văn phong Kinh Thánh tiếng Việt. “Báp-têm” là thuật ngữ quen thuộc và giữ được hình ảnh của nguyên văn; các chú thích giải thích cả cách dịch sát lẫn nghĩa ẩn dụ. Dấu chấm than phản ánh tính cảm thán của πῶς.
