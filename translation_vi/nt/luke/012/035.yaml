  text: Ἔστωσαν ὑμῶν αἱ ὀσφύες περιεζωσμέναι καὶ οἱ λύχνοι καιόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: vi
  text: Hãy thắt lưng cho gọn[a] và giữ đèn luôn cháy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Hãy sửa soạn y phục để sẵn sàng hành động.” Hình ảnh ở đây là thu vạt áo dài lên rồi thắt lại để có thể hành động ngay.'
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: Hãy ... và giữ ...
  rationale: Mệnh lệnh hiện tại ngôi thứ ba số nhiều được chuyển thành lời thúc giục tự nhiên trong tiếng Việt; động từ “giữ” ở vế sau làm rõ trạng thái liên tục mà không đổi ý.
- source_word: ὑμῶν
  choice: (hàm ý sở hữu trong lời nói trực tiếp)
  rationale: Tiếng Việt tự nhiên có thể lược đại từ sở hữu khi nói “thắt lưng”; chủ thể được xác định qua mệnh lệnh “hãy”.
- source_word: ὀσφύες
  choice: lưng
  rationale: Chỉ vùng eo/lưng, nơi áo dài được thắt lại. “Thắt lưng” là cách nói tự nhiên, dễ hiểu trong tiếng Việt và vẫn giữ hình ảnh cụ thể.
- source_word: περιεζωσμέναι
  choice: thắt ... cho gọn
  rationale: Phân từ hoàn thành bị động diễn tả trạng thái đã buộc áo quanh lưng để sẵn sàng hành động. Cách dịch này giữ hình ảnh văn hóa mà tránh lối nói khó hiểu “lưng được thắt”.
- source_word: λύχνοι
  choice: đèn
  rationale: Chỉ đèn dầu cụ thể, không phải ánh sáng trừu tượng; trong ngữ cảnh cổ đại, “đèn” là cách gọi tự nhiên.
- source_word: καιόμενοι
  choice: luôn cháy
  rationale: Phân từ hiện tại nhấn mạnh trạng thái đang tiếp diễn; “luôn cháy” truyền đạt sự duy trì sẵn sàng.
theological_decisions:
- issue: Hình ảnh thành ngữ về sự sẵn sàng
  choice: Giữ hình ảnh thắt áo quanh lưng trong bản văn chính bằng “thắt lưng cho gọn”
  alternative: Hãy mặc sẵn sàng để hành động
  rationale: Nguyên văn dùng hình ảnh cụ thể về việc thu gọn áo dài và buộc lại để sẵn sàng. Bản dịch giữ hình ảnh ấy, còn chú thích giải thích ý nghĩa văn hóa thay vì thay thế bằng diễn giải.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Thắt lưng cho gọn” giữ được hình ảnh cổ nhưng tự nhiên hơn cấu trúc dịch sát “hãy để lưng được thắt”; “giữ đèn luôn cháy” diễn đạt rõ sắc thái liên tục.
