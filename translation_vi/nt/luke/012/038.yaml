  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: vi
  text: Dù người chủ đến vào canh hai[a], hay thậm chí vào canh ba, và thấy họ như vậy, thì những đầy tớ ấy[b] thật có phước.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói đầy đủ hơn: “vào canh thứ hai trong đêm, hay vào canh thứ ba trong đêm.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “những người ấy.” Văn cảnh cho thấy đây là các đầy tớ được nói đến ở câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Dù ... hay thậm chí
  rationale: Cách diễn đạt này giữ sắc thái điều kiện nhượng bộ và sự nhấn mạnh do κἄν được lặp lại, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: vào canh hai ... vào canh ba
  rationale: φυλακή ở đây chỉ phiên canh ban đêm. “Canh hai” và “canh ba” là cách nói ngắn gọn, quen thuộc, còn ý “trong đêm” được làm rõ ở chú thích.
- source_word: ἔλθῃ
  choice: đến
  rationale: Thể giả định aorist trong cấu trúc này diễn tả một khả năng chưa xác định; tiếng Việt truyền đạt tự nhiên bằng “dù ... đến” mà không cần đánh dấu riêng về thì.
- source_word: εὕρῃ οὕτως
  choice: thấy họ vẫn như thế
  rationale: οὕτως hướng về tình trạng tỉnh thức, sẵn sàng của các đầy tớ trong câu trước. “Vẫn” làm rõ sự duy trì tình trạng ấy mà không xác định thêm nội dung.
- source_word: μακάριοι
  choice: thật có phước
  rationale: “Có phước” giữ được sắc thái được ưu đãi và đáng ao ước trước mặt Đức Chúa Trời, sâu hơn nghĩa cảm xúc đơn thuần của “hạnh phúc”.
- source_word: ἐκεῖνοι
  choice: những đầy tớ ấy
  rationale: Nguyên văn là “những người ấy”; danh từ “đầy tớ” được bổ sung từ văn cảnh trực tiếp để tiếng Việt rõ nghĩa.
theological_decisions:
- issue: Bổ sung chủ thể được ngầm hiểu của ἔλθῃ
  choice: chủ
  alternative: ông ấy
  rationale: Chủ thể là người chủ được nêu trong văn cảnh ngay trước đó. Dùng “chủ” giúp câu tiếng Việt rõ ràng mà không thêm một nhân vật hay ý nghĩa thần học mới.
- issue: Bổ sung tiền ngữ của ἐκεῖνοι
  choice: những đầy tớ ấy
  alternative: những người ấy
  rationale: Đại từ chỉ định Hy Lạp quy chiếu rõ ràng đến các đầy tớ trong văn cảnh. Bổ sung “đầy tớ” hỗ trợ người đọc, còn chú thích bảo lưu hình thức sát chữ của nguyên văn.
translation_notes:
  register: Bản dịch dùng tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Canh hai” và “canh ba” giữ hình ảnh lịch sử về các phiên canh ban đêm; “thật có phước” duy trì sắc thái Kinh Thánh mà vẫn tự nhiên.
