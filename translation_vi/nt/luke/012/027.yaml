id: LUK.12.27
reference: Luke 12:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: vi
  text: 'Hãy ngẫm xem những bông hoa huệ[a] lớn lên thế nào: chúng không lao nhọc, cũng không kéo sợi. Thế nhưng, tôi nói với anh em, ngay cả Sa-lô-môn trong tất cả vinh quang của mình[b] cũng không mặc như một trong những bông ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hoa dại” hoặc “các loài hoa”; tiếng Hy Lạp nói cụ thể là “hoa huệ”.
    reason: lexical_alternative
  - marker: b
    text: Hoặc “với tất cả vẻ huy hoàng của mình”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Hãy ngẫm xem
  rationale: Mệnh lệnh aorist kêu gọi quan sát chăm chú và suy ngẫm, không chỉ nhìn thoáng qua; cách diễn đạt này tự nhiên và giữ được lực của động từ.
- source_word: τὰ κρίνα
  choice: những hoa huệ
  rationale: κρίνα chỉ cụ thể hoa huệ; giữ danh từ cụ thể của nguyên văn thay vì khái quát thành các loài hoa hoặc hoa dại.
- source_word: πῶς αὐξάνει
  choice: lớn lên thế nào
  rationale: Giữ trọng tâm về cách thức của πῶς; tiếng Việt dùng cấu trúc số nhiều tự nhiên dù động từ Hy Lạp ở số ít theo quy tắc hòa hợp với chủ ngữ trung tính số nhiều.
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: chúng không nhọc công, cũng không kéo sợi
  rationale: κοπιάω diễn tả lao nhọc; νήθω là kéo sợi để làm vải. Bản dịch giữ hình ảnh sản xuất y phục và phép song hành phủ định.
- source_word: λέγω δὲ ὑμῖν
  choice: Thế mà, tôi nói với anh em
  rationale: δὲ tạo chuyển ý có sắc thái tương phản nhẹ; “thế mà” nối tự nhiên từ sự quan sát sang kết luận nhấn mạnh. Đại từ số nhiều được thể hiện bằng “anh em” trong lời trực tiếp.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: trong mọi vinh quang của mình
  rationale: δόξα ở đây nói đến vẻ huy hoàng của vua, nhưng “vinh quang” vẫn dễ hiểu và bảo toàn cộng hưởng từ vựng rộng hơn.
- source_word: περιεβάλετο ὡς ἓν τούτων
  choice: không được mặc đẹp bằng một trong những hoa ấy
  rationale: Cấu trúc “được mặc” giữ sắc thái trung gian/bị động mà không xác định tác nhân; thêm “đẹp” làm rõ phương diện so sánh về y phục, vốn đã hàm chứa trong ngữ cảnh, và tạo câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Phạm vi hình ảnh về hoa
  choice: Giữ cụ thể “hoa huệ”
  alternative: “hoa”, “hoa dại”
  rationale: Nguyên văn dùng κρίνα. Không có lý do thần học hay ngữ cảnh bắt buộc phải khái quát hóa danh từ.
- issue: Ý nghĩa của δόξα khi nói về Sa-lô-môn
  choice: “vinh quang”
  alternative: “vẻ huy hoàng”, “sự lộng lẫy”
  rationale: “Vinh quang” giữ tính liên tục từ vựng và âm hưởng Kinh Thánh, đồng thời trong ngữ cảnh vẫn chỉ rõ vẻ huy hoàng vương giả.
- issue: Dạng trung gian/bị động περιεβάλετο
  choice: “được mặc đẹp”
  alternative: “ăn mặc”, “tự mặc”
  rationale: Không quy định Sa-lô-môn tự mặc hay có người mặc cho ông; cách dịch giữ sự không xác định về tác nhân của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Hãy ngẫm xem” truyền đạt sự quan sát có suy xét; “nhọc công” và “kéo sợi” giữ phép đối chiếu về lao động và làm y phục. Dùng “Sa-lô-môn” theo cách phiên âm Kinh Thánh quen thuộc. Mọi ký hiệu chú thích đều có mặt trong chính văn.
