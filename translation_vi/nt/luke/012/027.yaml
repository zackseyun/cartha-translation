revisions:
- from: 'Hãy ngẫm xem những hoa huệ[a] lớn lên thế nào: chúng không nhọc công, cũng không kéo sợi. Thế mà, tôi nói với anh em, ngay cả Sa-lô-môn trong mọi vinh quang của mình cũng không được mặc đẹp bằng một trong những hoa ấy.[b]'
  to: 'Hãy ngẫm xem những bông hoa huệ[a] lớn lên thế nào: chúng không lao nhọc, cũng không kéo sợi. Thế nhưng, tôi nói với anh em, ngay cả Sa-lô-môn trong tất cả vinh quang của mình[b] cũng không mặc như một trong những bông ấy.'
  rationale: Bản sửa dùng các cụm tự nhiên hơn trong tiếng Việt hiện đại, đồng thời bỏ phần diễn giải «đẹp» và khôi phục phép so sánh trực tiếp của nguyên văn. Vị trí và nội dung chú thích b được điều chỉnh để nó thực sự giải thích lựa chọn «vinh quang».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh suy xét, tên gọi cụ thể của hoa, sự đối xứng «không lao nhọc/cũng không kéo sợi», và phép so sánh với Sa-lô-môn. Tuy nhiên, «được mặc đẹp bằng» vừa thêm ý «đẹp» không được phát biểu trực tiếp, vừa làm cấu trúc so sánh lệch khỏi «mặc như một [bông] trong số này».
  naturalness: «Những hoa huệ» và «trong mọi vinh quang» hơi kém tự nhiên trong tiếng Việt hiện đại. «Những bông hoa huệ» và «trong tất cả vinh quang của mình» rõ ràng, tự nhiên hơn. «Mặc như một trong những bông ấy» giữ hình ảnh so sánh trực tiếp mà vẫn trôi chảy.
  terminology: Giữ «hoa huệ», «Sa-lô-môn», và «vinh quang» là phù hợp với nguyên văn và cách dùng Kinh Thánh tiếng Việt. Chú thích b của bản nháp không phản ánh lựa chọn từ vựng được neo ở đó; cần nêu phương án cho «vinh quang»/«huy hoàng».
  issues:
  - severity: medium
    issue: «không được mặc đẹp bằng một trong những hoa ấy» thêm «đẹp» và đổi phép so sánh «như» thành so sánh mức độ «bằng».
    rationale: περιεβάλετο ὡς ἓν τούτων nói rằng Sa-lô-môn không mặc như một trong các hoa ấy. Ngữ cảnh quả có hàm ý vẻ đẹp, nhưng không cần thêm từ này vào chính văn; «được» cũng tạo sắc thái bị động không cần thiết.
  - severity: low
    issue: Chú thích b hiện tại không phải là một phương án từ vựng rõ ràng cho phần có ký hiệu chú thích.
    rationale: Chú thích nên ghi phương án «vẻ huy hoàng» cho δόξα, tương ứng với vết kiểm tra tiếng Anh và vị trí ký hiệu sau «vinh quang».
