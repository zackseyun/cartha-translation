  to: Người nào tích trữ của cải cho mình mà không giàu có trước mặt Đức Chúa Trời thì cũng sẽ như vậy[a].
  rationale: Bản sửa duy trì tính khái quát của chủ thể, hành động tích trữ vì lợi mình, và tính mở của cụm πλουτεῖν εἰς θεόν. “Trước mặt Đức Chúa Trời” thay cho một kết hợp từ tiếng Việt dễ gây hiểu sai; chú thích bảo lưu cách hiểu quan hệ. “Cũng sẽ như vậy” làm lời kết luận của dụ ngôn tự nhiên hơn mà không xác định thêm bản chất kết cục.
