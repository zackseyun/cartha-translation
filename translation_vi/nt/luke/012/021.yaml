  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: vi
  text: Người nào tích trữ của cải cho mình mà không giàu có trước mặt Đức Chúa Trời thì cũng sẽ như vậy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Người nào tích trữ của cải cho mình mà không giàu có trong mối liên hệ với Đức Chúa Trời thì cũng sẽ như vậy.”'
    reason: Phản ánh sắc thái quan hệ/hướng quy chiếu của εἰς θεόν, trong khi bản văn chính dùng cách diễn đạt Việt ngữ tự nhiên hơn.
lexical_decisions:
- source_word: οὕτως
  choice: thì cũng như vậy
  rationale: Nối lời kết luận trực tiếp với nhân vật trong dụ ngôn trước đó; cách diễn đạt này tự nhiên trong tiếng Việt và giữ sức nặng của lời áp dụng.
- source_word: ὁ θησαυρίζων
  choice: người nào tích trữ của cải
  rationale: Phân từ hiện tại có mạo từ chỉ một người nói chung, được nhận diện bởi hành động thường làm. “Tích trữ của cải” giữ ý gom góp và để dành như kho báu mà không giới hạn đối tượng vào nam giới.
- source_word: ἑαυτῷ
  choice: cho mình
  rationale: Diễn đạt trực tiếp sắc thái lợi ích của cách phản thân ở tặng cách và làm nổi bật hướng quy về bản thân.
- source_word: καὶ μὴ
  choice: mà không
  rationale: Trong tiếng Việt, “mà không” nối hai đặc điểm đối lập tự nhiên hơn “và không”, nhưng không biến liên từ thành một sự tương phản quá mạnh.
- source_word: εἰς θεὸν
  choice: đối với Đức Chúa Trời
  rationale: Giữ định hướng và quan hệ hàm chứa trong εἰς, không thu hẹp câu thành “giàu những điều Đức Chúa Trời coi trọng” hay chỉ nói về sự đánh giá trước mặt Ngài.
- source_word: πλουτῶν
  choice: giàu có
  rationale: Chuyển phân từ thành vị ngữ tự nhiên trong tiếng Việt, đồng thời giữ sự đối chiếu với của cải được tích trữ.
theological_decisions:
- issue: Chủ thể giống đực số ít trong một lời dạy luân lý có tính khái quát
  choice: người nào
  alternative: người đàn ông nào
  rationale: Giống đực ngữ pháp ở đây là hình thức đại diện chung, không cho thấy lời áp dụng chỉ dành cho nam giới; “người nào” vừa chính xác vừa tự nhiên trong tiếng Việt.
- issue: Ý nghĩa của việc “giàu có đối với Đức Chúa Trời”
  choice: giữ nguyên cách nói quan hệ “đối với Đức Chúa Trời”
  alternative: giàu có trước mặt Đức Chúa Trời
  rationale: Cụm từ giàu sức gợi nhưng câu này không giải nghĩa cụ thể. Bản dịch giữ độ mở thần học thay vì thêm một cách diễn giải như “giàu những điều đẹp lòng Đức Chúa Trời”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đảo mệnh đề “thì cũng như vậy” về cuối để câu tiếng Việt tự nhiên, đồng thời giữ liên hệ kết luận với dụ ngôn ngay trước đó.
