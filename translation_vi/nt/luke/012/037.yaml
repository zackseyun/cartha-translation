source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: vi
  text: 'Phước cho những đầy tớ[a] ấy mà khi chủ[b] trở về, ông thấy họ đang thức và canh chừng. Quả thật, tôi nói với anh em: ông sẽ thắt lưng để phục vụ[c], cho họ ngả mình vào bàn ăn[d], rồi đến phục vụ họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp doulos cũng có thể dịch là “nô lệ”; từ này chỉ người ở trong quan hệ lệ thuộc với chủ.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp kyrios cũng có thể dịch là “Chúa”. Trong khung cảnh trực tiếp của dụ ngôn, từ này chỉ người chủ; cách dùng ấy cũng có thể gợi âm hưởng về Chúa.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “sẽ thắt lưng mình”, tức thu gọn và buộc áo dài lại để sẵn sàng làm việc hoặc phục vụ.'
    reason: cultural_note
  - marker: d
    text: Nguyên văn nói ông sẽ cho họ “nằm tựa” dùng bữa, theo tư thế ăn uống thời ấy.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Công thức trang trọng, quen thuộc trong các lời chúc phước; diễn đạt địa vị được ban phước hơn là cảm xúc vui vẻ chủ quan.
- source_word: δοῦλοι
  choice: đầy tớ
  rationale: Trong tiếng Việt hiện đại, “đầy tớ” diễn đạt tự nhiên quan hệ phục dịch trong gia đình; địa vị nô lệ theo ngữ cảnh được nêu ở chú thích để không làm nhẹ sắc thái xã hội của từ Hy Lạp.
- source_word: κύριος
  choice: chủ
  rationale: Ngữ cảnh trực tiếp là một gia chủ trở về và gặp những người phục dịch đang thức. “Chủ” giữ đúng hình ảnh dụ ngôn, trong khi khả năng đọc là “Chúa” được bảo tồn ở chú thích.
- source_word: γρηγοροῦντας
  choice: vẫn đang thức canh
  rationale: Kết hợp nghĩa thức không ngủ với sắc thái cảnh giác, sẵn sàng của phân từ.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  rationale: Giữ cấu trúc nhấn mạnh trang trọng của công thức Hy Lạp và dùng cách xưng hô tự nhiên trong lời Đức Giê-su nói với các môn đồ.
- source_word: περιζώσεται
  choice: sẽ thắt lưng sẵn sàng phục vụ
  rationale: Giữ hình ảnh cụ thể của việc thắt áo ngang lưng, đồng thời làm rõ chức năng chuẩn bị để phục vụ.
- source_word: ἀνακλινεῖ αὐτούς
  choice: cho họ ngồi vào bàn
  rationale: Truyền đạt rõ bối cảnh bữa ăn cho độc giả hiện đại; tư thế nguyên văn là nằm tựa được ghi ở chú thích.
- source_word: παρελθὼν διακονήσει αὐτοῖς
  choice: rồi đến phục vụ họ
  rationale: Diễn đạt tự nhiên chuyển động của chủ đến bên những người dự bàn để hầu bàn, không khoác cho động từ sắc thái giáo vụ.
theological_decisions:
- issue: κύριος trong dụ ngôn có thể chỉ người chủ hoặc mang âm hưởng tước hiệu dành cho Chúa
  choice: chủ
  alternative: Chúa
  rationale: Bối cảnh trước mắt nói về quan hệ gia chủ–đầy tớ, nên “chủ” là nghĩa trực tiếp và tự nhiên. Chú thích bảo tồn khả năng “Chúa”, tránh loại bỏ âm hưởng Kitô học có thể có.
- issue: δοῦλος biểu thị người phục dịch có địa vị lệ thuộc
  choice: đầy tớ
  alternative: nô lệ
  rationale: “Đầy tớ” phù hợp văn phong dụ ngôn tiếng Việt và dễ hiểu, nhưng chú thích nêu rõ nguyên ngữ cũng có thể dịch là “nô lệ”, bảo tồn thực tại lệ thuộc của quan hệ này.
- issue: Sự đảo ngược vai trò khi người chủ phục vụ các đầy tớ
  choice: giữ nguyên phát biểu trực tiếp rằng chủ phục vụ họ
  alternative: diễn giải biểu tượng hoặc ý nghĩa cứu thế
  rationale: Bản dịch giữ sự đảo ngược gây sửng sốt của câu văn mà không giải thích nó theo một hệ phái hay áp đặt ý nghĩa thần học ngoài văn bản.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phước cho” theo văn phong lời chúc phước và “anh em” cho đại từ số nhiều ὑμῖν. Tránh từ cổ khó hiểu; các hình ảnh văn hóa được giữ trong câu hoặc giải thích bằng chú thích.
