source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: vi
  text: 'Chúa phán[a]: “Vậy, ai là người quản gia trung tín và khôn ngoan, người mà chủ sẽ cắt đặt coi sóc gia nhân của chủ để cấp phần lương thực cho họ đúng thời điểm[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép không có từ được dịch là “phán”.
    reason: textual_variant
  - marker: b
    text: “Phần lương thực” dịch một từ Hy Lạp có nghĩa đen là khẩu phần ngũ cốc được đong sẵn cho mỗi người.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Chúa / chủ
  rationale: Lần thứ nhất là danh xưng của Đức Giê-su trong lời trần thuật nên dịch là “Chúa”; lần thứ hai chỉ người chủ trong hình ảnh về gia đình nên dịch là “chủ”. Cả hai đều phản ánh phạm vi nghĩa của cùng một từ Hy Lạp.
- source_word: πιστός
  choice: trung tín
  rationale: Diễn tả sự đáng tin cậy của người được giao trách nhiệm; “trung tín” tự nhiên và phù hợp với ngữ cảnh quản gia.
- source_word: οἰκονόμος
  choice: quản gia
  rationale: Chỉ người được giao quản lý nhà cửa và gia nhân, không chỉ là một người quản lý nói chung.
- source_word: φρόνιμος
  choice: khôn ngoan
  rationale: Chỉ sự sáng suốt thực tiễn và biết xét đoán đúng trong khi thi hành trách nhiệm; “khôn ngoan” là cách nói rõ ràng, trang trọng và quen thuộc trong tiếng Việt.
- source_word: καταστήσει
  choice: sẽ cắt đặt
  rationale: Diễn tả việc đặt một người vào vị trí có trách nhiệm; “cắt đặt” giữ sắc thái giao phó thẩm quyền.
- source_word: θεραπείας
  choice: các gia nhân
  rationale: Trong ngữ cảnh này, từ này chỉ tập thể những người phục vụ trong nhà dưới quyền quản gia, chứ không chỉ hoạt động phục vụ.
- source_word: ἐν καιρῷ
  choice: đúng kỳ
  rationale: Diễn tả thời điểm thích hợp hoặc đã định; cách dịch ngắn gọn, tự nhiên và giữ sắc thái định kỳ trong việc phân phát lương thực.
- source_word: σιτομέτριον
  choice: phần lương thực
  rationale: Chỉ khẩu phần được đong và phân phát, vốn thường là ngũ cốc. “Phần lương thực” truyền đạt chức năng của từ một cách tự nhiên; nghĩa đen được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch hai lần xuất hiện của κύριος
  choice: “Chúa” cho Đức Giê-su là người phán; “chủ” cho nhân vật chủ nhà trong câu hỏi ví dụ
  alternative: Dịch cả hai lần là “Chúa” hoặc cả hai lần là “chủ”
  rationale: Nguyên văn dùng cùng một từ nhưng ở hai tầng quy chiếu khác nhau. Phân biệt bằng tiếng Việt giúp người đọc nhận ra Đức Giê-su là người phán và người chủ là nhân vật trong hình ảnh, mà không áp đặt việc đồng nhất hay tách biệt thần học giữa hai nhân vật.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Quản gia”, “trung tín”, “khôn ngoan” và “cắt đặt” giữ sắc thái trách nhiệm được giao phó; cấu trúc câu hỏi được duy trì. Tất cả dấu chú thích đều xuất hiện trong chính văn.
