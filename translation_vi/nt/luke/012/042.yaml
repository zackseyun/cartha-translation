- from: 'Chúa phán[a]: “Vậy, ai là người quản gia trung tín và khôn ngoan, người mà chủ sẽ cắt đặt coi sóc các gia nhân của mình để cấp phần lương thực cho họ đúng kỳ[b]?”'
  to: 'Chúa phán[a]: “Vậy, ai là người quản gia trung tín và khôn ngoan, người mà chủ sẽ cắt đặt coi sóc gia nhân của chủ để cấp phần lương thực cho họ đúng thời điểm[b]?”'
  rationale: Sửa chú thích a để phản ánh chính xác phạm vi biến thể trong SBLGNT. Đồng thời, làm rõ rằng các gia nhân thuộc về người chủ trong hình ảnh và dùng “đúng thời điểm” như một cách nói hiện đại, tự nhiên cho ἐν καιρῷ. Các sửa đổi không thay đổi nghĩa của câu.
