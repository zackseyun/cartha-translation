review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng lập luận từ điều nhỏ đến điều lớn, hình ảnh cỏ bị ném vào lò, và lời gọi trực tiếp “ít đức tin”. Tuy nhiên, “các con” thêm sắc thái quan hệ cha-con không được biểu thị bởi ὑμᾶς; nên dùng cách xưng hô số nhiều trung tính hơn trong ngữ cảnh môn đồ. “Mai đã bị ném” cũng khiến thì tương lai nghe chưa tự nhiên; nguyên văn chỉ đặt hành động vào ngày mai.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Sửa “nay còn đó mà mai đã bị ném” thành “hôm nay còn đó mà ngày mai bị ném” giúp mạch thời gian rõ và tự nhiên hơn.
  terminology: “cỏ”, “ngoài đồng”, “lò”, “mặc cho”, “Đức Chúa Trời” và “hỡi những người ít đức tin” đều phù hợp. “Anh em” giữ được ngôi thứ hai số nhiều trong bối cảnh lời nói với các môn đồ mà không thêm quan hệ gia đình vào nguyên văn.
  issues:
  - severity: medium
    issue: “các con” diễn giải thêm quan hệ cha-con
    rationale: ὑμᾶς chỉ là đại từ ngôi thứ hai số nhiều. Dù cách xưng hô này quen thuộc trong một số truyền thống Kinh Thánh, nó thêm một sắc thái quan hệ không có trong câu Hy Lạp.
  - severity: low
    issue: “mai đã bị ném” có phối hợp thời gian chưa tự nhiên
    rationale: αὔριον ... βαλλόμενον đặt việc bị ném vào ngày mai. “Ngày mai bị ném” diễn đạt trực tiếp hơn, không gợi một hành động tương lai đã hoàn tất.
  revised_text: Nhưng nếu cỏ ngoài đồng, hôm nay còn đó mà ngày mai bị ném vào lò, còn được Đức Chúa Trời mặc cho như thế, thì Ngài sẽ mặc cho anh em nhiều hơn biết bao, hỡi những người ít đức tin!
