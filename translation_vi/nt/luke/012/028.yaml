revisions:
- from: Nhưng nếu cỏ ngoài đồng, nay còn đó mà mai đã bị ném vào lò, còn được Đức Chúa Trời mặc cho như thế, thì Ngài sẽ mặc cho các con nhiều hơn biết bao, hỡi những người ít đức tin!
  to: Nhưng nếu cỏ ngoài đồng, hôm nay còn đó mà ngày mai bị ném vào lò, còn được Đức Chúa Trời mặc cho như thế, thì Ngài sẽ mặc cho anh em nhiều hơn biết bao, hỡi những người ít đức tin!
  rationale: Bản sửa chỉ loại bỏ sắc thái quan hệ được thêm vào bởi “các con” và làm rõ cách diễn đạt thời gian. Cấu trúc so sánh, hình ảnh “mặc cho”, lời gọi trực tiếp, cùng mức độ quở trách nhẹ của ὀλιγόπιστοι đều được giữ nguyên. Không cần chú thích để hiểu nghĩa câu, và không có neo chú thích trong bản văn Việt cần bảo toàn.
  reviewer_model: gpt-5.6-terra
