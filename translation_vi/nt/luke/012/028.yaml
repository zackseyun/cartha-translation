id: LUK.12.28
reference: Luke 12:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: vi
  text: Nhưng nếu cỏ ngoài đồng, hôm nay còn đó mà ngày mai bị ném vào lò, còn được Đức Chúa Trời mặc cho như thế, thì Ngài sẽ mặc cho anh em nhiều hơn biết bao, hỡi những người ít đức tin!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χόρτον
  choice: cỏ
  rationale: χόρτος chỉ cỏ hoặc cây cỏ nói chung; “cỏ” là cách diễn đạt tự nhiên, phù hợp với thứ mọc ngoài đồng và có thể phơi khô để làm chất đốt.
- source_word: ἐν ἀγρῷ
  choice: ngoài đồng
  rationale: Diễn đạt tự nhiên trong tiếng Việt về nơi cỏ mọc, đồng thời giữ nghĩa khái quát của cụm Hy Lạp.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: nay còn đó mà mai đã bị ném
  rationale: Triển khai cấu trúc phân từ cô đọng để làm rõ sự tương phản về thời gian và tính chóng tàn, nhưng không thêm ý “còn sống” vốn không được nói rõ trong nguyên văn.
- source_word: κλίβανον
  choice: lò
  rationale: κλίβανος là lò dùng để nướng bánh; “lò” chính xác và tự nhiên hơn “lò luyện”, còn chi tiết văn hóa được giải thích trong chú thích.
- source_word: ἀμφιέζει
  choice: mặc cho
  rationale: Động từ có nghĩa mặc hoặc khoác áo; “mặc cho” giữ được hình ảnh nhân cách hóa và liên hệ với việc lo áo mặc trong văn cảnh.
- source_word: πόσῳ μᾶλλον
  choice: nhiều hơn biết bao
  rationale: Giữ nguyên lập luận từ điều nhỏ đến điều lớn và sắc thái nhấn mạnh của thành ngữ so sánh.
- source_word: ὀλιγόπιστοι
  choice: hỡi những người ít đức tin
  rationale: Giữ cách xưng hô trực tiếp cùng lời quở trách nhẹ, không biến từ này thành một tuyên bố kỹ thuật về sự cứu rỗi.
- source_word: εἰ δὲ
  choice: Nhưng nếu
  rationale: δέ đánh dấu sự tiếp nối có sắc thái tương phản nhẹ; “Nhưng nếu” phù hợp với bước chuyển trong lập luận.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Chuyển trực tiếp danh từ chỉ Đức Chúa Trời bằng cách gọi trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: οὕτως
  choice: như thế
  rationale: Diễn đạt tự nhiên cách thức Đức Chúa Trời mặc cho cỏ.
theological_decisions:
- issue: Sắc thái của ὀλιγόπιστοι trong lời Đức Chúa Jêsus nói trực tiếp với các môn đồ
  choice: 'Lời quở trách trực tiếp nhưng nhẹ: “hỡi những người ít đức tin”'
  alternative: Lời quở trách gay gắt, hoặc chỉ là mô tả trung tính về lòng tin yếu
  rationale: Từ này phê bình sự thiếu tin cậy nơi Đức Chúa Trời nhưng không tự nó khẳng định mất đức tin cứu rỗi hay bội đạo. Bản dịch giữ nguyên sức căng mục vụ và thần học ấy.
- issue: Đối tượng được ngầm hiểu sau πόσῳ μᾶλλον ὑμᾶς
  choice: Bổ sung tự nhiên “Ngài sẽ mặc cho các con” từ phép tỉnh lược trong tiếng Hy Lạp
  alternative: 'Giữ câu tỉnh lược: “huống chi các con”'
  rationale: Nguyên văn lược động từ trong vế lớn hơn; tiếng Việt cần khôi phục “mặc cho” để rõ nghĩa. Việc dùng “Ngài” chỉ trở lại chủ ngữ rõ ràng là Đức Chúa Trời, không thêm tác nhân mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không đặt dấu chú thích trong câu vì bản thảo Việt ngữ này không cần chú thích từ vựng cho “cỏ”; chi tiết lò nướng và cỏ khô làm chất đốt cũng không thiết yếu để hiểu câu. Tuy nhiên, do cấu trúc dữ liệu yêu cầu danh sách footnotes, danh sách được để ở trạng thái không có nội dung thực chất.
