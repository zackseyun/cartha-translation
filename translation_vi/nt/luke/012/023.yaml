  terminology: “Sự sống,” “thân thể,” “thức ăn,” và “quần áo” đều phù hợp. Chú thích về ψυχή là hữu ích, nhưng ký hiệu chú thích cần đặt ngay sau từ được chú giải thay vì sau “thức ăn”.
