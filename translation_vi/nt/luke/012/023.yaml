id: LUK.12.23
reference: Luke 12:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: vi
  text: Vì sự sống[a] còn hơn thức ăn, và thân thể còn hơn quần áo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “linh hồn”: Từ Hy Lạp ψυχή có thể có nghĩa là “sự sống”, “bản thân” hoặc “linh hồn”; ở đây, ngữ cảnh thiên về nghĩa “sự sống”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do cho lời dạy đừng lo lắng ở câu trước, đồng thời giữ rõ chức năng giải thích của liên từ Hy Lạp.
- source_word: ψυχή
  choice: sự sống
  rationale: Trong ngữ cảnh ăn uống, lo lắng và sự chu cấp cho thân thể, từ này chỉ sự sống của con người hơn là riêng phần phi vật chất.
- source_word: πλεῖόν
  choice: quý hơn
  rationale: Diễn đạt tự nhiên ý so sánh về giá trị trong tiếng Việt; tránh cách nói 'nhiều hơn' vốn không phù hợp khi so sánh sự sống với thức ăn và thân thể với quần áo.
- source_word: τροφή
  choice: thức ăn
  rationale: Từ ngữ thông dụng, trực tiếp và phù hợp với ngữ cảnh ăn uống.
- source_word: σῶμα
  choice: thân thể
  rationale: Chỉ thân thể vật chất, song song với quần áo; 'thân thể' có sắc thái trang trọng, tự nhiên trong văn bản Kinh Thánh hiện đại.
- source_word: ἔνδυμα
  choice: quần áo
  rationale: Cách gọi hiện đại, dễ hiểu cho vật dùng để mặc và che thân.
theological_decisions:
- issue: Nghĩa của ψυχή trong lời dạy về sự lo lắng và sự chu cấp
  choice: Dịch là 'sự sống'
  alternative: linh hồn; bản thân
  rationale: Cấu trúc đối chiếu ψυχή với thức ăn và σῶμα với quần áo hướng đến sự sống hiện tại và sự tồn tại thể chất. Lựa chọn này không phủ nhận việc ψυχή có thể mang nghĩa 'linh hồn' ở những ngữ cảnh khác.
- issue: Sắc thái của πλεῖόν trong hai vế so sánh
  choice: Dịch là 'quý hơn' ở cả hai vế
  alternative: hơn; quan trọng hơn
  rationale: '''Quý hơn'' truyền đạt sự vượt trội về giá trị mà không biến câu thành một lời giải thích quá cụ thể về mức độ quan trọng.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Phép song song của nguyên văn được giữ lại, đồng thời lặp 'quý hơn' để hai vế đầy đủ và tự nhiên trong tiếng Việt.
