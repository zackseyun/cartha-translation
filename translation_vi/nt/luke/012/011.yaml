reference: Luke 12:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: vi
  text: Nhưng khi người ta đưa anh em ra trước các hội đường, các nhà cầm quyền và các nhà chức trách[a], thì đừng lo phải tự biện hộ thế nào hoặc biện hộ điều gì, hay phải nói điều gì[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các hội đường, các nhà cầm quyền và các nhà chức trách” chỉ những cơ quan tôn giáo và dân sự mà các môn đồ có thể bị đưa ra trước để xét hỏi.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “đừng lo phải tự biện hộ thế nào hoặc biện hộ điều gì, hay phải nói điều gì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nhưng khi
  rationale: ὅταν chỉ một tình huống tương lai có thể lặp lại; trong tiếng Việt, “khi” diễn đạt tự nhiên, còn δέ được thể hiện bằng liên từ chuyển ý nhẹ “nhưng” theo mạch văn.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: người ta đưa anh em ra trước
  rationale: Chủ ngữ số nhiều không xác định được diễn đạt tự nhiên bằng “người ta”; trong bối cảnh xét hỏi, εἰσφέρωσιν cùng ἐπί mang nghĩa đưa ra trước một cơ quan hay người có thẩm quyền.
- source_word: συναγωγάς
  choice: các hội đường
  rationale: Giữ nghĩa từ vựng trực tiếp là các hội đường Do Thái, đồng thời chú thích rằng trong ngữ cảnh này từ ấy có thể chỉ cơ quan xét xử gắn với hội đường.
- source_word: ἀρχάς
  choice: các nhà cầm quyền
  rationale: Trong ngữ cảnh hành chính và xét xử, từ này chỉ những người hoặc cơ quan cai trị; “nhà cầm quyền” rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐξουσίας
  choice: các bậc có thẩm quyền
  rationale: Diễn đạt những người được trao quyền hành pháp hoặc tư pháp, đồng thời phân biệt tương đối với ἀρχάς.
- source_word: μὴ μεριμνήσητε
  choice: đừng lo
  rationale: Mệnh lệnh phủ định nhắm đến sự lo âu, bận tâm trước; “đừng lo” tự nhiên và giữ đúng lực của câu.
- source_word: πῶς ἢ τί
  choice: thế nào hoặc nói gì
  rationale: Giữ cả hai yếu tố chỉ cách thức và nội dung. Trong tiếng Việt cần bổ sung “nói” trước “gì” để câu rõ và tự nhiên.
- source_word: ἀπολογήσησθε
  choice: phải biện hộ
  rationale: Động từ có nghĩa pháp lý là trình bày lời tự biện hộ. “Biện hộ” súc tích, tự nhiên và không nhất thiết hàm ý có luật sư đại diện.
- source_word: ἢ τί εἴπητε
  choice: hay phải nói điều gì
  rationale: Giữ mệnh đề thứ hai riêng biệt như bản Hy Lạp, dù có sự lặp ý, nhằm không xóa bỏ cấu trúc và sắc thái nhấn mạnh của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς theo lối xưng hô với các môn đồ. Giữ sự phân biệt giữa hội đường, người cai trị và người có thẩm quyền, đồng thời không làm phẳng sự lặp lại có thật giữa ἀπολογήσησθε và εἴπητε.
