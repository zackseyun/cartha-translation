revisions:
- from: Nhưng khi người ta đưa anh em ra trước các hội đường, các nhà cầm quyền và các bậc có thẩm quyền[a], thì đừng lo phải biện hộ thế nào hoặc nói gì, hay phải nói điều gì[b];
  to: Nhưng khi người ta đưa anh em ra trước các hội đường, các nhà cầm quyền và các nhà chức trách[a], thì đừng lo phải tự biện hộ thế nào hoặc biện hộ điều gì, hay phải nói điều gì[b];
  rationale: Sửa câu chính để τί thứ nhất được gắn rõ với hành động tự biện hộ (ἀπολογήσησθε), đồng thời vẫn giữ vế “hay phải nói điều gì” riêng biệt như nguyên văn. Thay cách gọi không tự nhiên “các bậc có thẩm quyền” bằng “các nhà chức trách”, và chỉnh chú thích văn hóa để bỏ hàm ý thời gian không có trong câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:32Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng bối cảnh bị đưa ra trước các cơ quan tôn giáo và chính quyền, cùng mệnh lệnh không lo lắng. Tuy nhiên, cụm “biện hộ thế nào hoặc nói gì” làm “nói gì” dễ được hiểu là bổ ngữ của εἴπητε ở vế cuối, thay vì là τί trực tiếp đi với ἀπολογήσησθε. Vì vậy, bản dịch chưa thể hiện rõ sự phân biệt trong cú pháp Hy Lạp giữa nội dung tự biện hộ và điều sẽ nói nói chung.
  naturalness: “Các bậc có thẩm quyền” không thật tự nhiên trong tiếng Việt hiện đại ở ngữ cảnh các cơ quan/chức trách công quyền. “Các nhà chức trách” tự nhiên hơn. Câu chú thích a có “mà trước đó” dùng sai nghĩa thời gian trong ngữ cảnh này.
  terminology: Giữ “hội đường” là phù hợp cho συναγωγαί. “Nhà cầm quyền” và “nhà chức trách” giữ được sự phân biệt tương đối giữa ἀρχαί và ἐξουσίαι mà không gán định quá mức tính chất thể chế. “Tự biện hộ” phản ánh được sắc thái trung của ἀπολογήσησθε và ngữ cảnh pháp lý.
  issues:
  - severity: medium
    issue: Quan hệ cú pháp của τί với ἀπολογήσησθε chưa rõ
    rationale: Nguyên văn có πῶς ἢ τί ἀπολογήσησθε, rồi mới đến ἢ τί εἴπητε. “... biện hộ thế nào hoặc nói gì, hay phải nói điều gì” khiến hai lần “nói gì” gần như đồng nghĩa và làm mờ nghĩa “biện hộ điều gì” của τί thứ nhất.
  - severity: low
    issue: “Các bậc có thẩm quyền” kém tự nhiên
    rationale: Cách gọi này thiên về phẩm trật cá nhân và ít thông dụng hơn “các nhà chức trách” khi nói về giới chức/cơ quan có thẩm quyền.
  - severity: low
    issue: Chú thích a có cụm “mà trước đó” không đúng nghĩa
    rationale: Cụm này hàm ý “trước thời điểm ấy”; chú thích chỉ cần nói các môn đồ có thể bị đưa ra trước những cơ quan này để xét hỏi.
