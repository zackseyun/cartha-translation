  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: vi
  text: Phước cho đầy tớ ấy, người mà chủ sẽ thấy đang làm như vậy khi chủ đến.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Phước cho
  rationale: Giữ sắc thái của lời tuyên phước trong Kinh Thánh, thay vì chỉ diễn tả cảm xúc vui vẻ hay hoàn cảnh may mắn.
- source_word: δοῦλος
  choice: đầy tớ
  rationale: Từ này có thể chỉ nô lệ hoặc đầy tớ. Trong hình ảnh gia đình của dụ ngôn, “đầy tớ” diễn đạt tự nhiên vai trò phục vụ và trách nhiệm dưới quyền chủ, mà không làm nổi bật quá mức địa vị pháp lý.
- source_word: ἐκεῖνος
  choice: ấy
  rationale: 'Giữ tính xác định và nhấn mạnh của đại từ chỉ định: chính đầy tớ ấy.'
- source_word: κύριος
  choice: chủ
  rationale: Trong bối cảnh trực tiếp của dụ ngôn, từ này chỉ người đứng đầu gia đình và là chủ của đầy tớ. Cách hiểu “Chúa” trong ứng dụng rộng hơn được giữ ở chú thích.
- source_word: ἐλθὼν
  choice: khi ông trở về
  rationale: Chuyển phân từ aorist thành mệnh đề thời gian tự nhiên trong tiếng Việt; “trở về” phù hợp với cảnh người chủ đi vắng rồi quay lại.
- source_word: εὑρήσει
  choice: sẽ thấy
  rationale: Thể hiện rõ thì tương lai và mang nghĩa người chủ bắt gặp đầy tớ trong tình trạng đang thực hiện công việc.
- source_word: ποιοῦντα οὕτως
  choice: đang làm như vậy
  rationale: Giữ khía cạnh hành động đang diễn ra khi người chủ trở về và quy chiếu tự nhiên đến cách hành xử vừa được mô tả ở câu trước.
theological_decisions:
- issue: Sắc thái Kitô học tiềm tàng của κύριος trong dụ ngôn về sự trở về của người chủ
  choice: Dùng “chủ” trong chính văn
  alternative: Dùng “Chúa” để làm nổi bật sự quy chiếu có thể có đến Chúa Giê-su
  rationale: Nghĩa bề mặt của dụ ngôn là quan hệ giữa chủ nhà và đầy tớ, nên “chủ” phù hợp nhất trong chính văn. Tuy nhiên, văn cảnh rộng hơn có thể gợi đến sự trở lại của Chúa; chú thích giữ lại chiều kích này mà không áp đặt nó lên hình ảnh trực tiếp.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Cấu trúc câu được sắp xếp tự nhiên theo tiếng Việt; “ông” chỉ người chủ và tránh lặp từ, còn “Phước cho” giữ âm hưởng quen thuộc của lời tuyên phước.
