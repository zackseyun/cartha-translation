source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: vi
  text: 'Còn Phi-e-rơ thưa: “Thưa Chúa, Chúa nói dụ ngôn này cho chúng tôi, hay cũng cho tất cả mọi người[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “cho tất cả.” Từ Hy Lạp ở dạng giống đực số nhiều nhưng ở đây được dùng theo nghĩa bao quát, chỉ những người khác ngoài nhóm «chúng tôi».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: nói
  rationale: Động từ aorist của λέγω có nghĩa cơ bản là “nói”. Nội dung là một câu hỏi, nhưng điều đó đã được thể hiện bằng cấu trúc và dấu câu, nên không cần đổi thành “hỏi”.
- source_word: δὲ
  choice: Bấy giờ
  rationale: δέ nối tiếp diễn ngôn và chuyển sự chú ý sang lời của Phi-e-rơ. “Bấy giờ” tự nhiên trong văn kể chuyện tiếng Việt mà không nhấn mạnh quá mức quan hệ thời gian.
- source_word: Κύριε
  choice: Thưa Chúa
  rationale: κύριος trong lời trực tiếp nói với Đức Giê-su vừa biểu thị sự kính trọng vừa có thể mang âm hưởng Kitô học. “Thưa Chúa” là cách xưng hô tự nhiên, trang trọng trong tiếng Việt và không làm mạnh thêm ý nghĩa ngoài nguyên văn.
- source_word: πρὸς ἡμᾶς
  choice: với chúng con
  rationale: πρός với đối cách sau λέγεις chỉ đối tượng được nói với. “Với” giữ đúng hướng của lời nói; “chúng con” là đại từ tiếng Việt tự nhiên khi các môn đồ thưa với Chúa, dù nguyên văn chỉ ghi “chúng tôi/chúng ta” theo nghĩa ngữ pháp.
- source_word: τὴν παραβολὴν ταύτην
  choice: dụ ngôn này
  rationale: “Dụ ngôn” là cách dịch ổn định và dễ hiểu của παραβολή trong các sách Tin Mừng, đồng thời giữ được thể loại lời dạy bằng hình ảnh.
- source_word: λέγεις
  choice: kể
  rationale: Trong tiếng Việt, “kể dụ ngôn” tự nhiên hơn “nói dụ ngôn”. Thì hiện tại của động từ Hy Lạp được hiểu từ ngữ cảnh câu hỏi về lời Đức Giê-su vừa phán.
- source_word: ἢ καὶ
  choice: hay cũng
  rationale: “Hay” thể hiện lựa chọn do ἤ nêu ra, còn “cũng” giữ sắc thái bổ sung của καί.
- source_word: πρὸς πάντας
  choice: với tất cả mọi người
  rationale: πάντας tuy mang hình thái giống đực số nhiều nhưng được dùng theo nghĩa bao quát trong sự đối chiếu với “chúng con”. “Tất cả mọi người” truyền đạt tự nhiên phạm vi rộng ấy trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος khi Phi-e-rơ thưa với Đức Giê-su
  choice: Chúa
  alternative: Thầy
  rationale: “Chúa” giữ nghĩa thông thường của κύριος và khả năng gợi âm hưởng Kitô học, nhưng câu này tự nó không xác định đầy đủ mức độ của hàm ý ấy.
- issue: Phạm vi của πάντας ở giống đực số nhiều
  choice: tất cả mọi người
  alternative: tất cả
  rationale: Trong ngữ cảnh, Phi-e-rơ đối chiếu “chúng con” với cử tọa rộng hơn. Cách dịch bao quát không giới hạn đối tượng vào nam giới và cũng không tự ý xác định chính xác những ai thuộc nhóm ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa Chúa” cùng “chúng con” tạo lời xưng hô tự nhiên trong tiếng Việt; câu hỏi vẫn giữ nguyên sự chưa xác định về việc dụ ngôn chỉ dành cho các môn đồ hay còn dành cho cử tọa rộng hơn.
