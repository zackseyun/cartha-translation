id: LUK.12.34
reference: Luke 12:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: vi
  text: Vì kho báu của anh em ở đâu, lòng anh em cũng sẽ ở đó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: ở đâu
  rationale: Diễn đạt tự nhiên mệnh đề chỉ nơi chốn và giữ cấu trúc tương liên với ἐκεῖ (“ở đó”).
- source_word: γάρ
  choice: vì
  rationale: Giữ chức năng giải thích, nối câu châm ngôn này với lời dạy ngay trước đó.
- source_word: θησαυρός
  choice: kho báu
  rationale: Giữ được cả nghĩa trực tiếp về của cải tích trữ lẫn sức gợi ẩn dụ về điều con người quý trọng.
- source_word: καρδία
  choice: lòng
  rationale: “Lòng” là cách diễn đạt tự nhiên trong tiếng Việt cho trung tâm của tình cảm, ước muốn và sự hướng về bên trong, không thu hẹp nghĩa vào riêng cảm xúc hay lý trí.
- source_word: ἐκεῖ
  choice: ở đó
  rationale: Duy trì cấu trúc tương liên “ở đâu… ở đó” của nguyên văn.
- source_word: καὶ
  choice: cũng
  rationale: 'Giữ ý bổ sung: lòng đi theo kho báu.'
- source_word: ἔσται
  choice: sẽ ở
  rationale: Bảo toàn thì tương lai trong nguyên văn, đồng thời diễn đạt kết quả và tính chắc chắn của lời châm ngôn.
- source_word: ὑμῶν
  choice: của anh em
  rationale: Thể hiện đại từ sở hữu ngôi thứ hai số nhiều bằng cách xưng hô trang trọng, dễ hiểu trong văn cảnh Chúa Giê-su nói với các môn đồ.
theological_decisions:
- issue: Ý nghĩa nhân học của καρδία
  choice: Dùng “lòng” để chỉ trung tâm nội tâm của tình cảm, ước muốn và sự gắn bó.
  alternative: Diễn giải hẹp hơn thành “ước muốn”, “tâm trí” hoặc “tấm lòng”.
  rationale: “Lòng” giữ được bề rộng của thuật ngữ Kinh Thánh và mối liên hệ văn chương với điều con người coi là kho báu, không áp đặt một thành tố tâm lý riêng lẻ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và cô đọng. Cấu trúc “ở đâu… cũng sẽ ở đó” gần với trật tự Hy Lạp nhưng vẫn tự nhiên trong tiếng Việt. “Anh em” làm rõ ngôi thứ hai số nhiều; “kho báu” và “lòng” bảo toàn hình ảnh giàu ý nghĩa của nguyên văn.
