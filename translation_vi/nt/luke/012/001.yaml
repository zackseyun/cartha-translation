revisions:
- from: 'Trong lúc ấy, đoàn dân đông hàng vạn người[a] tụ họp lại, đến nỗi giẫm đạp lên nhau. Đức Chúa Jêsus bắt đầu phán trước hết với các môn đồ mình: “Hãy đề phòng men của người Pha-ri-si[b], tức là thói đạo đức giả.”'
  to: 'Trong lúc ấy, khi hàng vạn người trong đám đông[a] tụ họp lại, đến nỗi giẫm đạp lên nhau, Đức Giê-su bắt đầu nói trước hết với các môn đệ của mình: “Hãy đề phòng men của những người Pha-ri-si[b], tức là sự giả hình.”'
  rationale: 'Bản sửa dùng tiếng Việt hiện đại, trung tính hơn, liên kết toàn bộ câu theo cấu trúc nguyên văn, và giữ sát thuật ngữ chủ chốt: “men”, “Pha-ri-si”, và “sự giả hình”. Không thay thế ẩn dụ bằng diễn giải và không áp đặt một cách hiểu giáo phái.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng phần lớn nội dung Hy Lạp: bối cảnh chuyển tiếp, đám đông cực lớn, hậu quả giẫm đạp, lời nói ưu tiên với các môn đệ, và ẩn dụ men được giải thích là giả hình. Tuy nhiên, “thói đạo đức giả” thu hẹp ὑπόκρισις thành một thói quen, trong khi danh từ này được nêu khái quát là “sự giả hình”.'
  naturalness: Câu hiện tại hiểu được nhưng “đoàn dân đông hàng vạn người” hơi nặng và việc tách thành hai câu làm yếu liên kết cú pháp của câu Hy Lạp. “Bắt đầu nói”, “các môn đệ”, và cách gọi hiện đại “Đức Giê-su” phù hợp hơn với tiếng Việt chuẩn hiện đại so với “bắt đầu phán”, “môn đồ”, “Đức Chúa Jêsus”.
  terminology: Giữ “men” là chính xác và bảo tồn ẩn dụ. “Những người Pha-ri-si” làm rõ số nhiều tập thể của τῶν Φαρισαίων. “Sự giả hình” là thuật ngữ trung tính, sát ὑπόκρισις và không thêm diễn giải thần học.
  issues:
  - severity: medium
    issue: Tên riêng và từ vựng mang sắc thái bản dịch Tin Lành cũ
    rationale: “Đức Chúa Jêsus” và “môn đồ” không phải lựa chọn trung tính, hiện đại nhất cho bản tiếng Việt chuẩn. “Đức Giê-su” và “môn đệ” tự nhiên, thông dụng và không làm đổi nghĩa.
  - severity: low
    issue: “Đoàn dân đông hàng vạn người” không tự nhiên
    rationale: Cụm này chồng ý “đoàn dân” và “người”. “Hàng vạn người trong đám đông” diễn đạt rõ số lượng lớn thuộc về đám đông.
  - severity: medium
    issue: “Thói đạo đức giả” thu hẹp ὑπόκρισις
    rationale: Nguyên văn xác định “men” là ὑπόκρισις nói chung; “sự giả hình” giữ danh từ trừu tượng và không gợi thêm rằng đây chỉ là một thói quen.
  - severity: low
    issue: Chú thích b có cách diễn đạt chưa tự nhiên
    rationale: “Hãy coi chừng chính mình trước men” không phải cấu trúc tiếng Việt tự nhiên. Có thể nêu các phương án thay thế thành ngữ hơn mà vẫn phản ánh sắc thái phản thân/cảnh giác của προσέχετε ἑαυτοῖς.
