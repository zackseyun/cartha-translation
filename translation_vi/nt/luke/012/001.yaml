id: LUK.12.1
reference: Luke 12:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: vi
  text: 'Trong lúc ấy, khi hàng vạn người trong đám đông[a] tụ họp lại, đến nỗi giẫm đạp lên nhau, Đức Giê-su bắt đầu nói trước hết với các môn đệ của mình: “Hãy đề phòng men của những người Pha-ri-si[b], tức là sự giả hình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vô số người trong đám đông.” Từ Hy Lạp μυριάδες có thể chỉ “hàng chục nghìn” hoặc nói chung một đám đông rất lớn.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “Hãy tự đề phòng men của những người Pha-ri-si” hoặc “Hãy cảnh giác với men của những người Pha-ri-si.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Trong lúc ấy
  rationale: Diễn đạt tự nhiên sắc thái chuyển tiếp vừa mang tính thời gian vừa gắn với hoàn cảnh trước đó.
- source_word: ἐπισυναχθεισῶν
  choice: tụ họp lại
  rationale: Truyền đạt việc đám đông đã quy tụ; tiếng Việt không cần ép thể bị động của phân từ Hy Lạp.
- source_word: τῶν μυριάδων τοῦ ὄχλου
  choice: đoàn dân đông hàng vạn người
  rationale: μυριάδες có thể chỉ nhiều chục nghìn hoặc nói khái quát về một số người vô cùng đông; “hàng vạn” giữ hình ảnh số lượng lớn mà vẫn tự nhiên.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: đến nỗi giẫm đạp lên nhau
  rationale: Giữ rõ quan hệ kết quả của ὥστε và cảnh chen lấn hỗn loạn đang diễn ra.
- source_word: ἤρξατο λέγειν
  choice: bắt đầu phán
  rationale: Giữ ý khởi đầu của cấu trúc; “phán” phù hợp văn phong Kinh Thánh trang trọng khi Đức Chúa Jêsus nói.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: phán trước hết với các môn đồ mình
  rationale: Giữ khả năng πρῶτον nhấn mạnh đối tượng được Ngài ưu tiên nói trước, không thêm một chuỗi bài nói không được nêu rõ.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Hãy đề phòng
  rationale: Cách nói tự nhiên trong tiếng Việt, bao hàm sự cảnh giác để tự bảo vệ mà không dịch cứng đại từ phản thân.
- source_word: τῆς ζύμης
  choice: men
  rationale: Giữ nguyên ẩn dụ Kinh Thánh thay vì diễn giải thành “ảnh hưởng” hay “sự dạy dỗ”; “men” tự nhiên và có sức gợi trong tiếng Việt.
- source_word: τῶν Φαρισαίων
  choice: của người Pha-ri-si
  rationale: Giữ quan hệ sở hữu/đặc trưng của sở hữu cách Hy Lạp.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: tức là thói đạo đức giả
  rationale: “Tức là” thể hiện chức năng giải thích của mệnh đề; “thói đạo đức giả” tự nhiên hơn danh từ trừu tượng “sự giả hình” đối với độc giả phổ thông.
theological_decisions:
- issue: Ẩn dụ “men”
  choice: Giữ “men” và để chính câu văn xác định đó là “thói đạo đức giả”.
  alternative: Diễn giải “men” thành “ảnh hưởng”, “sự dạy dỗ” hoặc “ảnh hưởng xấu”.
  rationale: Bản văn tự giải thích ẩn dụ, nên không cần thu hẹp nó bằng một cách diễn giải thần học bổ sung.
- issue: Phạm vi của πρῶτον
  choice: “trước hết với các môn đồ mình”
  alternative: “Trước hết, Ngài phán với các môn đồ mình” như một dấu hiệu bố cục diễn từ.
  rationale: Cách chọn ưu tiên sắc thái đối tượng được nói trước nhưng vẫn không khẳng định quá mức một trình tự diễn từ về sau.
- issue: Sắc thái của ὑπόκρισις
  choice: “thói đạo đức giả”
  alternative: “sự giả hình” hoặc “sự giả nhân giả nghĩa”.
  rationale: Cách dịch diễn tả hành vi tỏ ra đạo đức mà không chân thật, không gắn câu với một định nghĩa giáo phái riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus”, “môn đồ”, “Pha-ri-si” theo văn phong Kinh Thánh Tin Lành quen thuộc nhưng không thêm nét giáo phái vào nội dung. Giữ ẩn dụ “men”; tránh lối dịch quá sát khiến câu cảnh báo thiếu tự nhiên.
