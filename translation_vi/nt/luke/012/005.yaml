source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: vi
  text: 'Nhưng tôi sẽ cho anh em biết phải sợ ai: Hãy sợ người sau khi giết có quyền ném vào Ghê-hen-na.[a] Đúng vậy, tôi nói với anh em, hãy sợ chính người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “địa ngục.” Từ Hy Lạp là Ghê-hen-na, một thuật ngữ về sự phán xét bắt nguồn từ hình ảnh Thung lũng Hin-nôm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: tôi sẽ chỉ cho ... biết
  rationale: Diễn đạt tự nhiên động từ tương lai mang nghĩa chỉ ra, cho biết, mà không thêm sắc thái “cảnh cáo” vốn không nhất thiết có trong từ Hy Lạp.
- source_word: τίνα φοβηθῆτε
  choice: phải kính sợ ai
  rationale: Giữ ý của câu hỏi gián tiếp và sắc thái nghiêm trọng của φοβέομαι; “kính sợ” phù hợp khi đối tượng được ngụ ý là Đức Chúa Trời, đồng thời vẫn bao hàm nỗi sợ trước quyền phán xét.
- source_word: φοβήθητε
  choice: hãy kính sợ
  rationale: Mệnh lệnh được lặp lại để nhấn mạnh; dùng cùng một cách dịch nhằm bảo toàn sự liên kết từ vựng trong câu.
- source_word: τὸν
  choice: Đấng
  rationale: Mạo từ được dùng như danh từ để chỉ một chủ thể có ngôi vị. “Đấng” là cách nói trang trọng, tự nhiên trong văn cảnh này, nhưng không nêu đích danh chủ thể mà nguyên văn không nêu.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: sau khi giết chết
  rationale: Giữ rõ trình tự thời gian của cấu trúc μετά với động từ nguyên mẫu có mạo từ; chủ thể được hiểu là cùng một Đấng được nhắc tới.
- source_word: ἔχοντα ἐξουσίαν
  choice: còn có thẩm quyền
  rationale: “Thẩm quyền” thể hiện ἐξουσία là quyền hợp pháp/quyền định đoạt chứ không chỉ là sức mạnh; “còn” làm rõ quyền ấy tiếp tục vượt quá hành động giết chết.
- source_word: ἐμβαλεῖν εἰς
  choice: ném vào
  rationale: Cách diễn đạt trực tiếp, hiện đại, giữ được động tác mạnh của ἐμβάλλω εἰς.
- source_word: γέενναν
  choice: Ghê-hen-na
  rationale: Phiên âm thuật ngữ Hy Lạp để giữ hình ảnh và bối cảnh Do Thái của tên gọi, tránh đồng nhất hoàn toàn với mọi quan niệm thần học về “địa ngục” hình thành về sau.
- source_word: ναί
  choice: Phải
  rationale: Trợ từ xác nhận mang tính nhấn mạnh; “Phải” trang trọng và tự nhiên trong lời khẳng định này.
- source_word: τοῦτον
  choice: chính Đấng ấy
  rationale: “Chính” bảo toàn sức nhấn mạnh của đại từ chỉ định τοῦτον, thay vì chỉ dùng một đại từ trung tính.
theological_decisions:
- issue: Đối tượng phải kính sợ là ai
  choice: Không nêu đích danh, dùng “Đấng”
  alternative: Đức Chúa Trời
  rationale: Văn cảnh thường được hiểu là nói về Đức Chúa Trời, nhưng câu Hy Lạp chỉ dùng mạo từ làm danh từ. Bản dịch giữ hàm ý về một chủ thể có ngôi vị mà không bổ sung danh xưng ngoài nguyên văn.
- issue: Cách chuyển γέεννα trong bối cảnh phán xét
  choice: Ghê-hen-na
  alternative: địa ngục
  rationale: Giữ nguyên tên gọi đặc thù và nền hình ảnh Thung lũng Hin-nôm, không âm thầm nhập các hệ thống quan niệm về đời sau vào thuật ngữ Hy Lạp; phương án quen thuộc hơn được ghi ở chú thích.
- issue: Sắc thái của φοβέομαι đối với Đấng có quyền phán xét
  choice: kính sợ
  alternative: sợ hãi
  rationale: “Kính sợ” giữ được cả sự khiếp sợ nghiêm túc lẫn thái độ tôn kính phù hợp với văn cảnh nói về thẩm quyền tối hậu. “Sợ hãi” có thể làm mất chiều kích tôn kính, còn chỉ “tôn kính” lại quá nhẹ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô số nhiều trong lời dạy của Đức Chúa Jêsus; dùng “Đấng” để giữ tính trang nghiêm mà không bổ sung danh xưng không có trong câu Hy Lạp. Dấu chú thích [a] được đặt ngay sau thuật ngữ liên quan.
