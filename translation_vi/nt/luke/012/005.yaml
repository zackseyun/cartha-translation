  verdict: revise
  source_fidelity: Bản dịch giữ được trật tự chính của câu, sự lặp lại của mệnh lệnh φοβήθητε, ý nghĩa “thẩm quyền” của ἐξουσία, và thuật ngữ đặc thù γέεννα. Tuy nhiên, “kính sợ” thêm nét tôn kính không được từ φοβέομαι tự nó xác định trong lời cảnh báo này; viết hoa “Đấng” cũng định danh đối tượng theo cách trang trọng hơn nguyên văn, vốn chỉ nói “người ấy/đấng ấy” mà không nêu danh. “Còn có” có thể gợi ý một ý tiếp diễn không cần thiết; quan hệ thời gian “sau khi giết” đã do nguyên văn biểu đạt.
  naturalness: Câu dự thảo nhìn chung tự nhiên và trang trọng. “Tôi sẽ cho anh em biết phải sợ ai” gọn, hiện đại hơn “chỉ cho anh em biết”. “Đúng vậy” là lời xác nhận tự nhiên hơn “Phải” trong tiếng Việt hiện đại. Dùng “người” viết thường vừa tự nhiên vừa giữ đối tượng không được nêu đích danh.
  terminology: Giữ “Ghê-hen-na” trong thân bài và “địa ngục” ở chú thích là lựa chọn tốt, tránh đồng nhất hóa thuật ngữ γέεννα với một khái niệm thần học phát triển về sau. “Quyền” diễn đạt ἐξουσία rõ ràng và tự nhiên; “thẩm quyền” cũng khả dĩ nhưng trang trọng hơn mức cần thiết.
