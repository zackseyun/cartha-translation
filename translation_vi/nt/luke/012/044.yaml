  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: vi
  text: Quả thật, tôi nói với các anh em rằng chủ sẽ giao cho người ấy cai quản mọi tài sản của chủ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi thứ chủ có” hoặc “toàn bộ gia sản của chủ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: Quả thật
  rationale: Giữ sắc thái nhấn mạnh tính chân thật và trang trọng của lời tuyên bố, đồng thời tự nhiên trong lời nói của Chúa Giê-su.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các anh em
  rationale: Diễn đạt trực tiếp công thức phát ngôn có thẩm quyền; “các anh em” thể hiện đại từ số nhiều ὑμῖν trong ngữ cảnh Chúa Giê-su nói với các môn đồ.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: cai quản mọi tài sản của mình
  rationale: ἐπί với cách ba chỉ phạm vi thẩm quyền; cụm danh hóa từ ὑπάρχω chỉ toàn bộ những gì thuộc sở hữu của chủ. “Mọi tài sản” súc tích và phù hợp ngữ cảnh người quản gia.
- source_word: καταστήσει
  choice: sẽ giao cho ... cai quản
  rationale: Trong ngữ cảnh này, καθίστημι chỉ việc đặt hoặc bổ nhiệm một người vào vị trí có trách nhiệm. Cấu trúc tiếng Việt này diễn đạt rõ cả sự ủy nhiệm lẫn quyền quản lý.
- source_word: αὐτόν
  choice: người ấy
  rationale: Chỉ người quản gia nam đã được nói đến trong ngữ cảnh; “người ấy” tự nhiên hơn đại từ “ông ấy” và không xóa bỏ quy chiếu số ít.
theological_decisions:
- issue: Đại từ giống đực số ít trong bối cảnh dụ ngôn
  choice: Dùng “người ấy” và để danh từ “chủ” làm chủ ngữ
  alternative: Dùng “ông ấy” hoặc chuyển sang cách diễn đạt trung tính số nhiều
  rationale: Bản Hy Lạp nói đến một nhân vật nam số ít trong dụ ngôn. “Người ấy” bảo toàn quy chiếu số ít mà không tạo thêm sắc thái kính trọng hay xa cách vốn không có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chủ” theo chủ thể hàm ẩn từ ngữ cảnh trước; tiếng Việt cần nêu rõ chủ ngữ. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
