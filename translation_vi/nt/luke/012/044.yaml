  to: Quả thật, tôi nói với các anh em rằng chủ sẽ giao cho người ấy cai quản mọi tài sản của chủ.[a]
  rationale: 'Sửa duy nhất nhằm khử mơ hồ về đại từ sở hữu: “của chủ” xác định rõ rằng toàn bộ tài sản thuộc về người chủ, phù hợp với αὐτοῦ và mạch dụ ngôn. Các phương án chú thích được sửa tương ứng. Ý nghĩa, phạm vi “mọi,” và sắc thái ủy nhiệm cai quản của nguyên văn không thay đổi.'
