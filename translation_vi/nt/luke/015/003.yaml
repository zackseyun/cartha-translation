  text: 'Rồi Ngài kể cho họ dụ ngôn này:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: kể
  rationale: Động từ λέγω ở thì aorist có nghĩa cơ bản là “nói”; khi đi với tân ngữ “dụ ngôn”, tiếng Việt tự nhiên dùng “kể”, vẫn giữ đúng hành động truyền đạt bằng lời.
- source_word: δὲ
  choice: Vì vậy
  rationale: δέ là liên từ chuyển ý nhẹ. Trong ngữ cảnh, “Vì vậy” nối lời đáp của Đức Chúa Jêsus với sự phàn nàn ở các câu trước mà không biến nó thành một tương phản mạnh.
- source_word: πρὸς αὐτοὺς
  choice: cho họ
  rationale: πρός với đối cách chỉ những người được ngỏ lời; “cho họ” là cách diễn đạt tự nhiên khi dùng động từ “kể”.
- source_word: τὴν παραβολὴν ταύτην
  choice: dụ ngôn này
  rationale: παραβολή trong các sách Phúc Âm thường chỉ một dụ ngôn; ταύτην được thể hiện bằng từ chỉ định “này” đặt sau danh từ theo cú pháp tiếng Việt.
- source_word: λέγων
  choice: 'rằng:'
  rationale: Phân từ λέγων mở đầu nội dung lời nói. “Rằng:” diễn đạt chức năng dẫn lời tự nhiên trong tiếng Việt, dù không mô phỏng từng chữ là “nói rằng”.
- source_word: αὐτός (chủ ngữ hàm ẩn trong εἶπεν)
  choice: Đức Chúa Jêsus
  rationale: Tiếng Hy Lạp cho phép chủ ngữ được hàm ẩn trong động từ; nêu rõ Đức Chúa Jêsus giúp câu tiếng Việt đứng độc lập và xác định người nói từ ngữ cảnh mà không thay đổi đối tượng quy chiếu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt. Cấu trúc “kể cho họ dụ ngôn này rằng:” tự nhiên hơn bản dịch sát chữ “nói với họ dụ ngôn này, rằng”.
