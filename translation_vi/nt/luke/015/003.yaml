revisions:
- from: 'Vì vậy, Đức Chúa Jêsus kể cho họ dụ ngôn này rằng:'
  to: 'Rồi Ngài kể cho họ dụ ngôn này:'
  rationale: Bản sửa dùng “Rồi” để diễn đạt chuyển tiếp tự sự nhẹ của δέ mà không áp đặt quan hệ nhân quả; giữ “kể cho họ dụ ngôn này” cho εἶπεν πρὸς αὐτοὺς τὴν παραβολὴν ταύτην; và dùng dấu hai chấm để dẫn lời, diễn đạt tự nhiên chức năng của λέγων. “Ngài” phản ánh chủ ngữ hàm ẩn, với tiền đề là Đức Giê-su ở ngữ cảnh trước đó.
