revisions:
- from: 'Tôi nói với các bạn: Cũng vậy, trên trời sẽ vui mừng vì một người có tội ăn năn hơn là vì chín mươi chín người công chính không cần ăn năn.[a]'
  to: 'Tôi nói với các bạn: Cũng vậy, trên trời sẽ có niềm vui vì một người có tội ăn năn nhiều hơn là vì chín mươi chín người công chính[a] không cần ăn năn.'
  rationale: Thay “trên trời sẽ vui mừng” bằng “trên trời sẽ có niềm vui” để phản ánh đúng danh từ χαρά, tương lai ἔσται, và việc nguyên văn không nêu chủ thể của niềm vui. Thêm “nhiều hơn” để phép so sánh với “hơn là” rõ và tự nhiên trong tiếng Việt. Di chuyển mốc chú thích đến ngay sau “người công chính.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa “trên trời sẽ vui mừng”: cách này biến “trên trời” thành chủ thể hành động, trong khi χαρὰ ... ἔσται nói rằng sẽ có niềm vui ở trên trời, không nêu chủ thể vui mừng. Bản sửa giữ địa điểm và tính mơ hồ về tác nhân. “Ăn năn,” “người có tội,” “người công chính,” và quan hệ so sánh đều phản ánh sát câu Hy Lạp.'
  naturalness: “Trên trời sẽ có niềm vui ... nhiều hơn là ...” tự nhiên, rõ nghĩa và trang trọng vừa phải trong tiếng Việt hiện đại. “Tôi nói với các bạn” vẫn có thể dùng và bảo toàn số nhiều của ὑμῖν.
  terminology: Giữ “ăn năn” cho μετανοοῦντι và “công chính” cho δικαίοις. Không diễn giải “người công chính” thành “tự cho mình là công chính” trong chính văn. Chú thích được neo ngay sau cụm từ cần giải thích.
  issues:
  - severity: medium
    issue: “trên trời sẽ vui mừng” gán hành động vui mừng cho “trên trời.”
    rationale: χαρὰ ἐν τῷ οὐρανῷ ἔσται có nghĩa đen là “sẽ có niềm vui ở trên trời.” Câu không xác định ai là người vui mừng; bản dịch hiện tại làm thay đổi cấu trúc và phần nào thu hẹp tính mơ hồ của nguyên văn.
  - severity: low
    issue: Dấu chú thích về “người công chính” đặt ở cuối câu thay vì tại cụm từ được chú thích.
    rationale: Đặt mốc ngay sau “người công chính” giúp liên kết chú thích rõ ràng hơn mà không đổi nghĩa.
  revised_text: 'Tôi nói với các bạn: Cũng vậy, trên trời sẽ có niềm vui vì một người có tội ăn năn nhiều hơn là vì chín mươi chín người công chính[a] không cần ăn năn.'
