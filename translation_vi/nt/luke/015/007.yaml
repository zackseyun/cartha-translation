id: LUK.15.7
reference: Luke 15:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: vi
  text: 'Tôi nói với các bạn: Cũng vậy, trên trời sẽ có niềm vui vì một người có tội ăn năn nhiều hơn là vì chín mươi chín người công chính[a] không cần ăn năn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “người công chính” cũng có thể được hiểu theo sắc thái mỉa mai trong ngữ cảnh, chỉ những người tự cho mình là công chính; nguyên văn không nói rõ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Tôi nói với các bạn
  rationale: Diễn đạt tự nhiên công thức khẳng định trực tiếp, đồng thời giữ đại từ số nhiều ὑμῖν.
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Liên kết lời kết luận với niềm vui trong dụ ngôn ngay trước đó; ngắn gọn và tự nhiên trong tiếng Việt hiện đại.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: trên trời sẽ vui mừng
  rationale: Giữ ý tương lai và địa điểm của niềm vui, nhưng không tự ý xác định Đức Chúa Trời hay các thiên sứ là chủ thể vui mừng.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: vì một người có tội
  rationale: Trong kết cấu với χαρά, ἐπί chỉ nguyên cớ của niềm vui; “vì” tự nhiên trong tiếng Việt. “Người có tội” sáng rõ hơn “tội nhân” đối với độc giả phổ thông.
- source_word: μετανοοῦντι
  choice: ăn năn
  rationale: Động từ phân từ hiện tại mô tả người có tội đang đáp ứng bằng sự ăn năn; đây là cách diễn đạt quen thuộc, gọn và có phẩm cách trong tiếng Việt.
- source_word: ἢ
  choice: hơn là
  rationale: Trong ngữ cảnh so sánh mức độ vui mừng, ἢ mang nghĩa “hơn là”, chứ không chỉ đơn thuần là “hoặc”.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: chín mươi chín người công chính
  rationale: Giữ nguyên từ “công chính” của bản Hy Lạp và bổ sung “người” vì tính từ được dùng như danh từ.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: không cần ăn năn
  rationale: Diễn đạt tự nhiên cấu trúc “không có nhu cầu về sự ăn năn”, đồng thời tránh đại từ hồi chỉ mơ hồ.
theological_decisions:
- issue: “Người công chính” là người thực sự công chính hay cách nói mỉa mai về người tự cho mình công chính
  choice: Giữ nguyên “người công chính” và không giải quyết hàm ý trong chính văn.
  alternative: “những người tự cho mình là công chính”
  rationale: δικαίοις chỉ nói “công chính” và không đánh dấu rõ sự mỉa mai. Chính văn cần bảo tồn sức căng diễn giải của ngữ cảnh.
- issue: Chủ thể của niềm vui trên trời
  choice: Chỉ nêu địa điểm “trên trời”, không thêm chủ thể.
  alternative: “Đức Chúa Trời sẽ vui mừng” hoặc “các thiên sứ trên trời sẽ vui mừng”
  rationale: Câu Hy Lạp nói niềm vui sẽ ở trên trời nhưng không nêu rõ tác nhân; việc thêm Đức Chúa Trời hay thiên sứ sẽ vượt quá câu chữ.
- issue: Cách hiểu phép so sánh “hơn là”
  choice: Giữ phép so sánh trực tiếp của câu Hy Lạp.
  alternative: Diễn giải thành “chứ không phải vì” hoặc phủ nhận hoàn toàn niềm vui đối với chín mươi chín người
  rationale: ἢ trong ngữ cảnh tạo phép so sánh, nhưng câu không buộc phải hiểu rằng hoàn toàn không có niềm vui nào đối với nhóm kia.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các bạn” để thể hiện đại từ số nhiều ὑμῖν; dùng “người có tội” thay cho từ Hán-Việt nặng hơn là “tội nhân”. Dấu chân chú thích [a] được đặt ngay sau mệnh đề có nội dung cần giải thích.
