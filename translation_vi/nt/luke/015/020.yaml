id: LUK.15.20
reference: Luke 15:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: vi
  text: Anh đứng dậy, đến với cha mình. Khi anh còn ở đằng xa[a], cha anh đã thấy anh, động lòng thương xót. Ông chạy đến, ôm choàng lấy cổ anh và hôn anh thắm thiết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi anh vẫn còn ở cách xa một quãng.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp có thể hàm ý sự trìu mến mãnh liệt, có lẽ là “hôn anh nhiều lần.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ đánh dấu hành động dứt khoát mở đầu chuỗi sự việc; “đứng dậy” vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: đi đến với cha mình
  rationale: ἔρχομαι có thể là “đến” hoặc “đi” tùy điểm nhìn. “Đi đến với cha mình” giữ được hướng chuyển động và sắc thái quan hệ của πρὸς mà không thêm ý giải thích.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: nhưng khi anh còn ở đằng xa
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu cách tuyệt đối chỉ hoàn cảnh đồng thời; “còn” bảo toàn ý ἔτι và “ở đằng xa” truyền đạt μακρὰν ἀπέχοντος.
- source_word: ἐσπλαγχνίσθη
  choice: động lòng thương xót
  rationale: Động từ chỉ lòng thương sâu xa, mạnh mẽ từ bên trong. Cách nói này trang trọng, quen thuộc và giữ được cường độ cảm xúc.
- source_word: δραμὼν
  choice: chạy đến
  rationale: “Chạy” chuyển tải trực tiếp động từ τρέχω; thêm “đến” giúp nối tự nhiên với hành động hướng về người con trong tiếng Việt.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: ôm choàng lấy cổ anh
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là “ngã/áp mình lên cổ anh.” Bản dịch này giữ hình ảnh cái cổ và truyền đạt tự nhiên hành động ôm ghì thân thiết, không giản lược thành một cái ôm chung chung.
- source_word: κατεφίλησεν
  choice: hôn anh thắm thiết
  rationale: Động từ ghép καταφιλέω có thể hàm ý nụ hôn nồng nhiệt hoặc lặp lại. “Hôn anh thắm thiết” giữ sức biểu cảm nhưng không quyết định rằng hành động nhất thiết xảy ra nhiều lần.
theological_decisions:
- issue: Cách thể hiện lòng thương xót của người cha trong dụ ngôn
  choice: Giữ nguyên sức nặng cảm xúc qua các động từ kể chuyện, nhưng không giải nghĩa người cha như một biểu tượng thần học ngay trong bản văn.
  alternative: Giảm nhẹ cảm xúc của người cha, hoặc diễn giải rõ người cha tượng trưng cho Đức Chúa Trời.
  rationale: Câu Hy Lạp nhấn mạnh sáng kiến đầy thương xót của người cha bằng một chuỗi hành động mạnh. Bản dịch cần giữ sức sống ấy nhưng không thêm một cách giải nghĩa vượt quá câu văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh” dành cho người con và “ông” dành cho người cha giúp lời kể tự nhiên, đồng thời tránh lối diễn giải giáo phái. Các dấu chú thích [a], [b] được đặt ngay sau cụm từ mà chúng giải thích.
