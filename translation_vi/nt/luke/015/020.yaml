revisions:
- from: Anh đứng dậy, đi đến với cha mình. Nhưng khi anh còn ở đằng xa[a], cha anh đã trông thấy anh thì động lòng thương xót. Ông chạy đến, ôm choàng lấy cổ anh và hôn anh thắm thiết[b].
  to: Anh đứng dậy, đến với cha mình. Khi anh còn ở đằng xa[a], cha anh đã thấy anh, động lòng thương xót. Ông chạy đến, ôm choàng lấy cổ anh và hôn anh thắm thiết[b].
  rationale: 'Bản sửa chỉ điều chỉnh cú pháp và độ tự nhiên của tiếng Việt, nhất là bỏ kết cấu “đã ... thì” không phù hợp. Bản văn giữ nguyên các điểm then chốt của tiếng Hy Lạp: hành động đứng dậy rồi đến với cha; hoàn cảnh người con vẫn còn xa; lòng thương sâu xa của người cha; và chuỗi hành động chạy đến, ôm lấy cổ, hôn thắm thiết. Không thêm diễn giải thần học hay xác định quá mức ý lặp lại của καταφιλέω.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung truyền đạt đúng trình tự hành động và sắc thái cảm xúc của tiếng Hy Lạp: người con đứng dậy và đến với cha; khi còn ở xa thì cha thấy, động lòng thương, chạy đến, ôm lấy cổ và hôn thắm thiết. Tuy nhiên, cụm “cha anh đã trông thấy anh thì động lòng thương xót” dùng kết cấu “đã ... thì” không phù hợp trong câu này và làm câu tiếng Việt thiếu trôi chảy.'
  naturalness: Cần sửa nhẹ để thành tiếng Việt hiện đại tự nhiên hơn. “Đến với cha mình” gọn và tự nhiên hơn “đi đến với cha mình”; bỏ “thì” sau “đã thấy” giúp chuỗi động từ kể chuyện rõ ràng. “Ôm choàng lấy cổ anh” là cách chuyển ngữ tự nhiên, giữ được hình ảnh của thành ngữ Hy Lạp mà không diễn giải quá mức.
  terminology: “Động lòng thương xót” diễn tả tốt ἐσπλαγχνίσθη. “Hôn anh thắm thiết” thích hợp với καταφιλέω, giữ cường độ trìu mến mà không khẳng định chắc chắn hành động lặp lại. Cặp xưng hô “anh/ông” phù hợp văn kể hiện đại và quan hệ cha–con trong ngữ cảnh.
  issues:
  - severity: medium
    issue: Kết cấu “cha anh đã trông thấy anh thì động lòng thương xót” không tự nhiên.
    rationale: Sau mệnh đề thời gian “khi ...”, tiếng Việt có thể dùng “cha anh đã thấy anh, động lòng thương xót” hoặc “cha anh thấy anh và động lòng thương xót.” Từ “thì” sau “đã trông thấy” gây gãy cấu trúc và không phản ánh một quan hệ điều kiện/hệ quả trong nguyên ngữ.
  - severity: low
    issue: “Đi đến với cha mình” hơi nặng và kém tự nhiên.
    rationale: “Đến với cha mình” vẫn truyền đạt ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
  - severity: low
    issue: Nội dung chú thích a có thể diễn đạt tự nhiên hơn.
    rationale: “Còn ở cách xa một quãng” là một phương án tiếng Việt rõ và tự nhiên cho ý ‘still a long way off’; chú thích vẫn chỉ nêu phương án từ vựng, không thêm nghĩa.
