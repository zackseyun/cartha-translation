  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: vi
  text: 'Người em nói với cha mình: “Thưa cha, xin cha cho con phần tài sản thuộc về con.” Rồi người cha chia tài sản của mình[a] cho hai người con.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “phương tiện sinh sống” hoặc “của cải để sinh sống”, chỉ tài sản mà người cha dùng để nuôi sống mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: người em
  rationale: Tính từ so sánh được dùng như danh từ, nghĩa đen là “người trẻ hơn”. Trong ngữ cảnh hai người con trai, “người em” tự nhiên và không cần lặp lại danh từ “con trai” vốn không được nêu trực tiếp ở câu này.
- source_word: δός μοι
  choice: xin cha cho con
  rationale: Mệnh lệnh cách “hãy cho tôi” được chuyển theo lối xưng hô cha–con tự nhiên trong tiếng Việt; thêm “xin” thể hiện hình thức lời thỉnh cầu mà không làm giảm tính trực tiếp của yêu cầu.
- source_word: τὸ ἐπιβάλλον μέρος τῆς οὐσίας
  choice: phần tài sản thuộc về con
  rationale: ἐπιβάλλον chỉ phần rơi vào, thuộc về hoặc đến lượt một người; οὐσία ở đây là tài sản. Cách dịch này rõ nghĩa trong bối cảnh phân chia gia sản mà không khẳng định thêm một thủ tục thừa kế cụ thể.
- source_word: διεῖλεν
  choice: chia
  rationale: Diễn đạt trực tiếp hành động phân chia hoặc phân bổ.
- source_word: αὐτοῖς
  choice: cho hai người con
  rationale: Đại từ số nhiều nghĩa đen là “cho họ”. Ngữ cảnh xác định đó là hai người con; diễn đạt tường minh giúp câu tiếng Việt tự nhiên.
- source_word: βίον
  choice: gia sản
  rationale: βίος có thể chỉ đời sống, phương tiện sinh sống hoặc tài sản nuôi sống một người. Trong ngữ cảnh này, từ chỉ toàn bộ của cải người cha đem chia; “gia sản” vừa tự nhiên vừa giữ liên hệ với tài sản của gia đình, còn sắc thái nguyên ngữ được ghi ở chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải. Lối xưng hô “Thưa cha… cha… con” phù hợp quan hệ gia đình trong tiếng Việt. Dùng “người em” và “hai người con” để rõ đối tượng mà vẫn bám sát ngữ cảnh Hy Lạp.
