- from: 'Người em nói với cha mình: “Thưa cha, xin cha cho con phần tài sản thuộc về con.” Rồi người cha chia gia sản[a] cho hai người con.'
  to: 'Người em nói với cha mình: “Thưa cha, xin cha cho con phần tài sản thuộc về con.” Rồi người cha chia tài sản của mình[a] cho hai người con.'
