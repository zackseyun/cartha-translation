source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: vi
  text: 'Khi tìm được đồng bạc ấy[a], bà gọi những người bạn nữ và những người hàng xóm lại rồi nói: “Hãy chung vui với tôi, vì tôi đã tìm được đồng đơracma mà tôi làm mất.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một đơracma là đồng bạc Hy Lạp, trong nhiều bối cảnh có giá trị xấp xỉ tiền công một ngày của người lao động.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: Khi tìm được đồng bạc ấy
  rationale: Phân từ bất định giống cái chỉ hành động xảy ra trước hành động chính; dịch bằng mệnh đề thời gian tự nhiên trong tiếng Việt. Tân ngữ được bổ sung từ ngữ cảnh.
- source_word: συγκαλεῖ
  choice: bà gọi ... lại
  rationale: Thì hiện tại tạo nét kể chuyện sống động; “gọi ... lại” diễn đạt tự nhiên ý triệu tập đến với mình.
- source_word: φίλας
  choice: các bạn nữ
  rationale: Giữ rõ dạng giống cái số nhiều của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
- source_word: γείτονας
  choice: những người hàng xóm
  rationale: Từ này chỉ những người sống lân cận; nguyên văn không buộc phải biểu thị giới tính riêng cho nhóm này.
- source_word: λέγουσα
  choice: rồi nói
  rationale: Chuyển phân từ hiện tại thành động từ nối tiếp để câu tiếng Việt trôi chảy.
- source_word: Συγχάρητέ μοι
  choice: Hãy chung vui với tôi
  rationale: Mệnh lệnh số nhiều mời những người nghe cùng chia sẻ niềm vui; “chung vui” tự nhiên và sát nghĩa συγχαίρω.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do của lời mời chung vui.
- source_word: εὗρον
  choice: tôi đã tìm được
  rationale: Thể bất định nói đến việc tìm thấy đã hoàn tất; “đã ... được” vừa tự nhiên vừa nhấn mạnh kết quả.
- source_word: δραχμὴν
  choice: đồng đrachma
  rationale: Giữ tên cụ thể của loại tiền Hy Lạp, đồng thời thêm loại từ “đồng” để người đọc nhận ra đây là tiền kim loại.
- source_word: ἣν ἀπώλεσα
  choice: mà tôi làm mất
  rationale: Mệnh đề quan hệ xác định đồng tiền; “làm mất” diễn đạt tự nhiên động từ chủ động ἀπόλλυμι trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” để quy chiếu tự nhiên đến người phụ nữ trong ngữ cảnh; giữ tên tiền cổ và giải thích bằng chú thích văn hóa.
