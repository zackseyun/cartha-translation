  terminology: Giữ “Trời” thay vì diễn giải thành “Đức Chúa Trời” trong chính văn là thích hợp với οὐρανός và với tính chất uyển ngữ kính cẩn. “Phạm tội,” “xứng đáng,” và “được gọi là con của cha” đều truyền đạt tốt các thuật ngữ then chốt của nguồn Hy Lạp.
