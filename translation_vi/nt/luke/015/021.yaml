id: LUK.15.21
reference: Luke 15:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: vi
  text: 'Nhưng người con thưa với cha: “Cha ơi, con đã phạm tội với Trời[a] và trước mặt cha. Con không còn xứng đáng được gọi là con của cha nữa.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, “Trời” ở đây là cách nói kính cẩn để chỉ Đức Chúa Trời; một số bản dịch diễn giải là “phạm tội với Đức Chúa Trời”.
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản tiếp tục lời người con bằng câu có nghĩa là: “Xin cha coi con như một người làm thuê của cha”, phù hợp với câu 19; bản SBLGNT kết thúc lời nói tại “con của cha nữa”.'
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ ὁ υἱὸς αὐτῷ
  choice: Nhưng người con thưa với cha
  rationale: δέ là liên từ chuyển ý nhẹ; “nhưng” phù hợp với diễn tiến câu chuyện. “Thưa với cha” diễn đạt tự nhiên lời của người con nói với người cha, đồng thời giữ sắc thái kính trọng thích hợp trong tiếng Việt.
- source_word: Πάτερ
  choice: Cha ơi
  rationale: Cách xưng hô trực tiếp tự nhiên, trang trọng và giàu tình thân trong tiếng Việt; không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: ἥμαρτον
  choice: con đã phạm tội
  rationale: Thì aorist chỉ hành động phạm tội được nhìn như một sự kiện trọn vẹn; “đã phạm tội” là lời thú nhận tự nhiên trong tiếng Việt và vẫn cho thấy hậu quả hiện tại.
- source_word: εἰς τὸν οὐρανὸν
  choice: với trời
  rationale: Giữ hình ảnh “trời” của nguyên văn và không diễn giải thẳng thành “Đức Chúa Trời”; trong ngữ cảnh Do Thái, đây là cách nói kính cẩn để chỉ Đức Chúa Trời.
- source_word: καὶ ἐνώπιόν σου
  choice: và trước mặt cha
  rationale: Giữ nghĩa căn bản của ἐνώπιον là “trước mặt, trong sự hiện diện của”, thay vì giải nghĩa hoàn toàn thành “đắc tội với cha”.
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: con không còn xứng đáng
  rationale: Diễn đạt trực tiếp sự tự nhận định về địa vị đạo đức và quan hệ của người con.
- source_word: κληθῆναι υἱός σου
  choice: được gọi là con của cha nữa
  rationale: Giữ thể bị động của κληθῆναι và diễn đạt quan hệ sở hữu tự nhiên trong tiếng Việt; “nữa” đi với “không còn” tạo thành cấu trúc Việt ngữ trọn vẹn.
theological_decisions:
- issue: Ý nghĩa của “trời” trong lời thú tội
  choice: Giữ cách nói “phạm tội với trời” trong chính văn và giải thích rằng “trời” là lối nói kính cẩn chỉ Đức Chúa Trời.
  alternative: Dịch diễn giải là “phạm tội với Đức Chúa Trời”.
  rationale: Nguyên văn dùng οὐρανός, “trời”; giữ cách nói này bảo tồn hình ảnh và sắc thái kính cẩn của nguồn Hy Lạp mà không buộc chính văn phải giải quyết hàm ý thần học.
- issue: Phạm vi lời nói của người con trong câu này
  choice: Kết thúc lời người con tại “con của cha nữa”, theo SBLGNT.
  alternative: Thêm “Xin cha coi con như một người làm thuê của cha”, theo một số thủ bản và tương ứng với câu 19.
  rationale: Bản văn nguồn được chỉ định kết thúc tại υἱός σου. Dị bản dài hơn được ghi nhận ở chú thích chứ không đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp xưng hô “con—cha” phản ánh quan hệ gia đình; động từ “thưa” biểu thị sự kính trọng và tâm thế hạ mình của người con. Chính văn giữ cách nói giàu sắc thái “với trời” và “trước mặt cha”, còn chú thích làm rõ thành ngữ cùng dị bản.
