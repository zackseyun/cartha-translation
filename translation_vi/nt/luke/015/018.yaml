    issue: “trời” viết thường
    rationale: Trong tiếng Việt hiện đại, “trời” viết thường chủ yếu chỉ bầu trời. Ngữ cảnh Do Thái của οὐρανός ở đây dùng “Heaven” như lối nói kính cẩn quy chiếu về Đức Chúa Trời; viết hoa “Trời” biểu đạt chức năng này mà không giải nghĩa thay vào chính văn.
  - severity: low
    issue: “đi về với cha ta”
    rationale: “Về” phù hợp bối cảnh dụ ngôn nhưng thêm rõ nét ý trở về không có trong riêng động từ πορεύσομαι. “Đi đến với” giữ trung tính hơn đối với động từ chỉ đi.
