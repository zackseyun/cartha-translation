id: LUK.15.18
reference: Luke 15:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: vi
  text: 'Ta sẽ đứng dậy và đi đến với cha ta, rồi thưa với người: ‘Cha ơi, con đã phạm tội với Trời[a] và trước mặt cha.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trời” có lẽ là cách nói kính cẩn để chỉ Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Ta sẽ đứng dậy
  rationale: 'Phân từ bất định đứng trước động từ chính chỉ hành động đầu tiên trong dự định của người con. Tiếng Việt tự nhiên chuyển thành động từ hữu hạn phối hợp: “Ta sẽ đứng dậy, đi...”'
- source_word: πορεύσομαι
  choice: đi về
  rationale: Động từ tương lai chỉ sự di chuyển đến chỗ người cha. “Đi về” tự nhiên trong ngữ cảnh trở về nhà, nhưng không thêm từ “nhà” vốn không có trong câu Hy Lạp.
- source_word: πρὸς τὸν πατέρα μου
  choice: với cha ta
  rationale: πρός với đối cách diễn tả hướng chuyển động đến một người. Kết hợp “đi về với cha ta” truyền đạt đích đến và quan hệ cá nhân một cách tự nhiên.
- source_word: ἐρῶ αὐτῷ
  choice: thưa với người
  rationale: “Thưa” phù hợp với lời người con nói trực tiếp, kính trọng với cha; “người” làm đại từ hồi chỉ trang trọng, rõ nghĩa trong văn kể chuyện.
- source_word: Πάτερ
  choice: Cha ơi
  rationale: Hô cách trực tiếp được diễn đạt tự nhiên bằng “Cha ơi”, không thêm sở hữu từ vốn không có trong tiếng Hy Lạp.
- source_word: ἥμαρτον
  choice: con đã phạm tội
  rationale: Thì bất định trình bày việc phạm tội như một thực tại đã xảy ra; “đã phạm tội” vừa tự nhiên trong lời thú nhận vừa giữ ý nghĩa đạo đức hiện tại.
- source_word: εἰς τὸν οὐρανὸν
  choice: với trời
  rationale: Giữ nguyên hình ảnh “trời” của nguyên bản, có thể là cách nói kính cẩn để chỉ Đức Chúa Trời. Với động từ “phạm tội”, “phạm tội với” là cách diễn đạt tiếng Việt tự nhiên mà không thay “trời” bằng một lời giải nghĩa.
- source_word: ἐνώπιόν σου
  choice: trước mặt cha
  rationale: ἐνώπιον với sở hữu cách có nghĩa “trước mặt, trước sự hiện diện của”. Cách dịch này giữ từ ngữ khác biệt với εἰς và không tự động đồng nhất nó với “nghịch cùng cha”.
theological_decisions:
- issue: Có nên thay “trời” bằng danh xưng chỉ Đức Chúa Trời trong chính văn hay không
  choice: 'Giữ “trời”: “con đã phạm tội với trời và trước mặt cha”'
  alternative: con đã phạm tội với Đức Chúa Trời và nghịch cùng cha
  rationale: Nguyên bản dùng οὐρανός (“trời”), có lẽ như một cách nói kính cẩn để chỉ Đức Chúa Trời. Giữ từ này bảo toàn thành ngữ và độ hàm nghĩa của câu thay vì giải quyết cách diễn giải ngay trong chính văn.
- issue: Quan hệ giữa hai cụm εἰς τὸν οὐρανὸν và ἐνώπιόν σου
  choice: 'Giữ sự khác biệt: “với trời” và “trước mặt cha”'
  alternative: nghịch cùng trời và nghịch cùng cha
  rationale: Hai cụm giới từ trong nguyên bản không giống nhau. Cách dịch được chọn tránh san bằng cả hai thành hai đối tượng song song của việc phạm tội, đồng thời vẫn giữ sức nặng của lời thú nhận.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng cặp xưng hô “ta/con” theo sự chuyển đổi tự nhiên từ độc thoại sang lời trực tiếp với cha; dùng “thưa” để thể hiện sự kính trọng. Không thêm chú thích vì câu chính có thể bảo toàn trực tiếp cả “trời” lẫn “trước mặt cha”.
