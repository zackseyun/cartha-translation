revisions:
- from: Ai trong các ông có một trăm con chiên mà bị lạc mất một con, lại không để chín mươi chín con kia ngoài đồng hoang[a] rồi đi tìm con bị lạc cho đến khi tìm thấy nó?
  to: Ai trong các ông có một trăm con chiên mà mất một con, lại không để chín mươi chín con kia trong đồng hoang[a] rồi đi tìm con bị lạc cho đến khi tìm thấy nó?
  rationale: Chỉnh “bị lạc mất” thành “mất” để diễn đạt rõ và tự nhiên việc một con trong đàn bị thất lạc, đồng thời không thêm ý người chăn cố ý gây ra sự mất mát. Đổi “ngoài đồng hoang” thành “trong đồng hoang” để sát hơn với ἐν. Các yếu tố còn lại, kể cả cách giữ câu hỏi tu từ và chú thích về ἔρημος, được bảo lưu.
  reviewer_model: gpt-5.6-terra
