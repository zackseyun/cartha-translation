id: LUK.15.4
reference: Luke 15:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: vi
  text: Ai trong các ông có một trăm con chiên mà mất một con, lại không để chín mươi chín con kia trong đồng hoang[a] rồi đi tìm con bị lạc cho đến khi tìm thấy nó?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong vùng hoang vắng.” Từ Hy Lạp có thể chỉ nơi trống trải, đồng hoang hoặc vùng ít người ở.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Ai trong các ông
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ đại từ số nhiều giống đực của ngữ cảnh trực tiếp mà không cần lặp danh từ “người đàn ông” một cách nặng nề.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: có một trăm con chiên
  rationale: Diễn đạt trực tiếp, tự nhiên; “con chiên” là từ thông dụng và trang trọng trong văn cảnh Kinh Thánh.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: mà bị lạc mất một con
  rationale: Trong văn cảnh chăn chiên, cách diễn đạt này truyền đạt việc một con trong đàn bị thất lạc, không hàm ý người chăn cố ý làm hại nó.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: lại không để chín mươi chín con kia
  rationale: Giữ dạng câu hỏi phủ định mang tính tu từ, vốn chờ đợi câu trả lời khẳng định.
- source_word: ἐν τῇ ἐρήμῳ
  choice: ngoài đồng hoang
  rationale: “Đồng hoang” giữ sắc thái nơi trống trải, ít người của ἔρημος, đồng thời phù hợp với bối cảnh chăn thả hơn cách hiểu hẹp là sa mạc.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: rồi đi tìm con bị lạc
  rationale: Diễn đạt tự nhiên mục đích hướng đến và tìm kiếm con chiên đang ở trong tình trạng thất lạc.
- source_word: ἕως εὕρῃ αὐτό
  choice: cho đến khi tìm thấy nó
  rationale: Giữ rõ giới hạn thời gian và mục tiêu kiên trì của hành động tìm kiếm.
theological_decisions:
- issue: Ngôn ngữ giống đực mang tính đại diện trong câu hỏi dụ ngôn
  choice: Dùng “Ai trong các ông”
  alternative: “Người nào trong các ông” hoặc “Ai trong anh em”
  rationale: Cụm này giữ lời Chúa Giê-su trực tiếp nói với nhóm người nghe được quy chiếu bằng ἐξ ὑμῶν, nhưng tránh biến ἄνθρωπος thành một khẳng định giáo lý về giới tính. Tiếng Việt có thể truyền đạt tự nhiên tính đại diện bằng đại từ nghi vấn “ai”.
- issue: Tình trạng của con chiên trong τὸ ἀπολωλός
  choice: “con bị lạc”
  alternative: “con đã mất”
  rationale: Bản dịch giữ hình ảnh con chiên thất lạc và tránh để “đã mất” bị hiểu là đã chết hoặc mất hẳn; đồng thời không thêm nguyên nhân khiến nó lạc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được giữ nguyên; “đồng hoang” duy trì độ rộng nghĩa của ἔρημος và có chú thích nêu phương án khác.
