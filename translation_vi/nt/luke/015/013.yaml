  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng trình tự chính: một thời gian ngắn sau, người con nhỏ gom mọi thứ, đi tới một vùng xa, rồi làm tiêu tán tài sản trong một lối sống thiếu tiết độ. Tuy nhiên, “người con trai thứ” thường được hiểu là con thứ hai theo thứ tự, không trực tiếp phản ánh tính so sánh νεώτερος (“người con trẻ hơn/nhỏ hơn”).'
  naturalness: Văn xuôi nhìn chung tự nhiên. “Người con trai út” là cách kể chuyện hiện đại, rõ ràng và tự nhiên hơn trong ngữ cảnh hai người con. “Sống phung phí” giữ cấu trúc phân từ ζῶν và tránh diễn đạt phương tiện hơi gượng là “bằng lối sống hoang phí.”
  terminology: “Miền xa,” “tài sản,” và “phung phí” phù hợp. “Sống phung phí” diễn đạt ἀσώτως theo nghĩa tiêu tán, vô độ mà không áp đặt các tội cụ thể như tình dục.
