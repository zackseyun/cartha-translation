revisions:
- from: Ít ngày sau[a], người con trai thứ thu góp tất cả rồi đi đến một miền xa. Tại đó, anh phung phí tài sản của mình[b] bằng lối sống hoang phí[c].
  to: Ít ngày sau[a], người con trai út thu góp tất cả rồi đi đến một miền xa. Tại đó, anh phung phí tài sản của mình[b], sống phung phí[c].
  rationale: Đổi “người con trai thứ” thành “người con trai út” để phản ánh chính xác hơn tính so sánh của νεώτερος trong ngữ cảnh hai anh em. Đổi cụm cuối thành “sống phung phí” để bám sát ζῶν ἀσώτως như một mệnh đề phân từ, giữ tính khái quát của nguyên văn và tránh quy định hóa các hành vi không được câu này nêu rõ.
