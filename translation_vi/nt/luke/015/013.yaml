source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: vi
  text: Ít ngày sau[a], người con trai út thu góp tất cả rồi đi đến một miền xa. Tại đó, anh phung phí tài sản của mình[b], sống phung phí[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “sau không nhiều ngày.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “của cải của mình” hoặc “gia sản của mình.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “sống phóng túng.” Bản văn ở đây không nêu một tội cụ thể, mà mô tả một lối sống thiếu kiềm chế và làm tiêu tán tài sản.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Ít ngày sau
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại ý nguyên văn là “sau không nhiều ngày”; chú thích giữ lại hình thức phủ định của tiếng Hy Lạp.
- source_word: συναγαγὼν πάντα
  choice: thu góp tất cả
  rationale: Giữ ý hành động có trước việc ra đi và lực nghĩa gom lại của συνάγω, đồng thời không xác định quá mức rằng người con đã bán hay đổi toàn bộ tài sản thành tiền.
- source_word: ὁ νεώτερος υἱός
  choice: người con trai thứ
  rationale: Trong ngữ cảnh hai con trai, cách nói này tự nhiên hơn “người con trai trẻ hơn” và chỉ người con nhỏ.
- source_word: ἀπεδήμησεν
  choice: đi
  rationale: Kết hợp tự nhiên với “đến một miền xa” và chuyển tải việc rời nơi cư trú để đến một vùng xa mà không thêm chi tiết “rời nhà” vốn không nằm trực tiếp trong động từ.
- source_word: εἰς χώραν μακράν
  choice: đến một miền xa
  rationale: χώρα có thể chỉ vùng, xứ hay miền; “một miền xa” tự nhiên, không hàm ý nhất thiết là một quốc gia theo nghĩa chính trị hiện đại.
- source_word: διεσκόρπισεν
  choice: phung phí
  rationale: Trong ngữ cảnh tài sản, động từ mang nghĩa làm tiêu tán hoặc hoang phí, thay vì nghĩa đen “rải ra”.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: tài sản của mình
  rationale: οὐσία ở đây chỉ những gì anh sở hữu; “tài sản” đủ rộng và phù hợp với phần gia tài đã nhận.
- source_word: ζῶν ἀσώτως
  choice: bằng lối sống hoang phí
  rationale: Diễn đạt cách thức tài sản bị tiêu tán, nhưng không thu hẹp ἀσώτως thành một tội cụ thể như trụy lạc tình dục.
theological_decisions:
- issue: Mức độ xác định các hành vi trong ζῶν ἀσώτως
  choice: Không nêu một tội cụ thể; dịch là “bằng lối sống hoang phí”.
  alternative: “sống trụy lạc” hoặc “ăn chơi đàng điếm”
  rationale: Câu này chỉ mô tả một lối sống phóng túng, hoang phí; các cách dịch hẹp hơn sẽ đưa vào những hành vi mà bản văn tại đây không nói rõ.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Người con trai thứ” phù hợp ngữ cảnh gia đình có hai con; “miền xa” tránh sắc thái địa-chính trị quá cụ thể của “nước xa”. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
