    rationale: νεώτερος là dạng so sánh, nghĩa là người con trẻ hơn; trong khung truyện có hai con, “người con trai út” là cách tiếng Việt tự nhiên để chỉ người con nhỏ hơn. “Con trai thứ” thiên về số thứ tự và có thể không rõ nghĩa nếu tách khỏi ngữ cảnh.
  - severity: low
    issue: “bằng lối sống hoang phí” làm mờ cấu trúc “ζῶν ἀσώτως”
    rationale: Phân từ ζῶν mô tả người con đang sống như thế nào. “sống phung phí” trực tiếp hơn, đồng thời không thêm nội dung về những hành vi cụ thể.
