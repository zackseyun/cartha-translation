translation:
  language: vi
  text: 'Rồi Ngài nói: “Một người kia có hai con trai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Rồi Đức Chúa Jêsus nói
  rationale: Động từ aorist Εἶπεν cùng liên từ chuyển tiếp nhẹ δέ tiếp tục diễn từ; “Rồi ... nói” diễn đạt tự nhiên sự chuyển sang phần kế tiếp. Chủ ngữ được nêu rõ theo ngữ cảnh là Đức Chúa Jêsus, tránh đại từ thiếu tiền ngữ trong câu đứng riêng.
- source_word: Ἄνθρωπός τις
  choice: một người kia
  rationale: Cách nói quen thuộc trong tiếng Việt khi mở đầu một câu chuyện, đồng thời giữ sắc thái bất định nhưng có phần cá thể hóa của τις mà không khiến nhân vật trở thành xác định.
- source_word: εἶχεν
  choice: có
  rationale: Thì chưa hoàn thành ở đây nêu hoàn cảnh nền của dụ ngôn; tiếng Việt tự nhiên dùng “có” mà không cần đánh dấu thì quá khứ.
- source_word: δύο
  choice: hai
  rationale: Chuyển dịch trực tiếp số từ.
- source_word: υἱούς
  choice: con trai
  rationale: Giữ đúng giới tính nam được biểu thị rõ bởi υἱούς và chi tiết gia đình trọng yếu của dụ ngôn.
theological_decisions:
- issue: Mức độ xác định của Ἄνθρωπός τις
  choice: một người kia
  alternative: một người
  rationale: “Một người kia” bảo toàn sắc thái bất định có cá thể hóa nhẹ của τις, nhưng không thêm ý nghĩa biểu tượng hay cách giải thích thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Một người kia” là lối dẫn truyện tự nhiên trong tiếng Việt. Việc nêu “Đức Chúa Jêsus” làm rõ chủ thể khi câu được trình bày độc lập; không cần chú thích vì đây là bổ sung ngữ cảnh minh nhiên, không phải một dị bản.
