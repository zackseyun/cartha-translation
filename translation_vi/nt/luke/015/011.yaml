revisions:
- from: 'Rồi Đức Chúa Jêsus nói: “Có một người kia có hai con trai.”'
  to: 'Rồi Ngài nói: “Một người kia có hai con trai.”'
  rationale: Chỉnh để không thêm danh xưng không có trong câu nguồn, đồng thời giữ liên kết diễn ngôn nhẹ của δέ, sắc thái bất định có cá thể hóa của τις, và giới tính nam số nhiều của υἱούς. Bản sửa vẫn phù hợp với ngữ cảnh Chúa Giê-su đang nói nhưng không làm thông tin ngữ cảnh ấy thành một phần của bản văn câu dịch.
