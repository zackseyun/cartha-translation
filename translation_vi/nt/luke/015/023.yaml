  rationale: Bản sửa tách riêng việc “ăn” và “vui mừng,” tương ứng với φαγόντες và εὐφρανθῶμεν, thay vì dùng cụm “ăn mừng” có thể làm mờ cấu trúc và nội dung của nguyên văn. Cách dịch chính của θύσατε vẫn là “làm thịt nó” theo bối cảnh bữa tiệc; chú thích được diễn đạt lại tự nhiên hơn, vẫn bảo tồn khả năng sắc thái tế lễ.
