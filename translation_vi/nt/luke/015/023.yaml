  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: vi
  text: Hãy mang con bê đã vỗ béo đến, làm thịt nó[a], rồi chúng ta cùng ăn và vui mừng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giết nó làm tế lễ”; động từ Hy Lạp có thể chỉ việc giết mổ một con vật và trong một số ngữ cảnh mang sắc thái tế lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: Hãy mang ... đến
  rationale: Động từ mệnh lệnh số nhiều có nghĩa là “mang, đem.” Thêm “đến” làm câu lệnh tự nhiên trong tiếng Việt mà không chỉ rõ là mang ra hay mang vào.
- source_word: μόσχον τὸν σιτευτόν
  choice: con bê đã vỗ béo
  rationale: μόσχος chỉ bò non, còn σιτευτός chỉ con vật được nuôi béo để dùng vào dịp đặc biệt. “Con bê đã vỗ béo” vừa chính xác vừa tự nhiên trong tiếng Việt.
- source_word: θύσατε
  choice: làm thịt nó
  rationale: Trong bối cảnh chuẩn bị tiệc, θύω chỉ việc giết mổ con vật để ăn. “Làm thịt” là cách nói tiếng Việt tự nhiên, không áp đặt sắc thái tế lễ dù động từ Hy Lạp có thể mang sắc thái ấy trong một số ngữ cảnh.
- source_word: φαγόντες
  choice: cùng ăn
  rationale: Phân từ bất định quá khứ có hình thức sát nghĩa là “sau khi ăn/ăn rồi,” nhưng ở đây gắn với lời kêu gọi εὐφρανθῶμεν. Cách dịch “cùng ăn mừng” diễn đạt tự nhiên việc ăn tiệc và vui mừng mà không tách cứng cấu trúc Hy Lạp.
- source_word: εὐφρανθῶμεν
  choice: chúng ta cùng ... mừng
  rationale: Thể giả định khuyến nghị ngôi thứ nhất số nhiều mang nghĩa “chúng ta hãy vui mừng/ăn mừng.” “Ăn mừng” hợp với bối cảnh yến tiệc và là cách nói hiện đại, rõ ràng.
- source_word: καὶ ... καὶ
  choice: '..., rồi ...'
  rationale: Các liên từ καί nối chuỗi mệnh lệnh với lời kêu gọi cuối. “Rồi” diễn đạt tự nhiên trình tự hành động trong tiếng Việt mà vẫn giữ mối liên kết của câu.
theological_decisions:
- issue: Sắc thái tế lễ có thể có của θύσατε
  choice: Dịch là “làm thịt nó,” theo nghĩa chuẩn bị con vật cho bữa tiệc.
  alternative: “dâng nó làm sinh tế” hoặc “giết tế nó”
  rationale: θύω có thể chỉ việc giết con vật để tế lễ, nhưng trong ngữ cảnh gia đình mở tiệc, trọng tâm trực tiếp là chuẩn bị thức ăn cho cuộc ăn mừng. Bản dịch chính không đưa ý niệm tế lễ vào một cách quá mức; chú thích vẫn bảo tồn khả năng ngữ nghĩa đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Con bê đã vỗ béo” giữ hình ảnh cụ thể; “làm thịt” tự nhiên trong bối cảnh chuẩn bị tiệc. Cụm “chúng ta cùng ăn mừng” gọn và lưu loát, đồng thời chuyển tải cả hành động ăn lẫn niềm vui chung.
