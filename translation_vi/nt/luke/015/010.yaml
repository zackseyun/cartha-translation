id: LUK.15.10
reference: Luke 15:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: vi
  text: 'Cũng vậy[a], tôi nói với các ông: trước mặt các thiên sứ của Đức Chúa Trời có niềm vui vì một tội nhân ăn năn.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Như thế” hoặc “Vậy”.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn không nói rõ chính các thiên sứ là những người vui mừng; cũng có thể hiểu là niềm vui diễn ra trong sự hiện diện của các thiên sứ Đức Chúa Trời.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Cũng vậy
  rationale: Nối lời áp dụng với dụ ngôn ngay trước đó và giữ sắc thái so sánh; cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ công thức diễn ngôn trực tiếp và đại từ số nhiều; trong văn cảnh Lu-ca 15, Đức Giê-su đang nói với những người Pha-ri-si và các thầy thông giáo.
- source_word: γίνεται χαρά
  choice: có niềm vui
  rationale: Diễn đạt sự xuất hiện hoặc hiện hữu của niềm vui một cách tự nhiên, không gán thêm chủ thể vui mừng.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: Giữ nghĩa hiện diện của giới từ và tránh diễn giải rằng chính các thiên sứ là chủ thể vui mừng.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: các thiên sứ của Đức Chúa Trời
  rationale: Phản ánh trực tiếp kết cấu sở hữu của nguyên văn bằng lối diễn đạt trang trọng, quen thuộc.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: vì một tội nhân
  rationale: ἐπί với tặng cách nêu nguyên do hoặc dịp dẫn đến niềm vui; “vì” tự nhiên hơn trong tiếng Việt so với cách dịch sát hình thức “trên”.
- source_word: μετανοοῦντι
  choice: ăn năn
  rationale: Phân từ hiện tại bổ nghĩa cho “tội nhân”; “ăn năn” là thuật ngữ Kinh Thánh tự nhiên, giữ độ rộng thần học mà không diễn giải thêm.
theological_decisions:
- issue: Ý nghĩa của μετανοοῦντι
  choice: ăn năn
  alternative: thay đổi tâm trí; quay trở lại
  rationale: Câu này không tự định nghĩa đầy đủ sự ăn năn. Cách dịch đã chọn giữ khái niệm thần học quen thuộc mà không thu hẹp nó thành một cách giải thích riêng.
- issue: Nơi chốn hoặc chủ thể của niềm vui
  choice: trước mặt các thiên sứ của Đức Chúa Trời có niềm vui
  alternative: các thiên sứ của Đức Chúa Trời vui mừng; có niềm vui giữa các thiên sứ của Đức Chúa Trời
  rationale: Nguyên văn nói niềm vui xảy ra “trước mặt” các thiên sứ, chứ không nói rõ chính các thiên sứ là chủ thể vui mừng. Bản dịch giữ nguyên sự mở này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “các ông” theo đối tượng nam số nhiều trong văn cảnh gần; giữ “trước mặt” để bảo toàn sự mơ hồ chân thực về chủ thể của niềm vui. Tất cả dấu chú thích đều xuất hiện trong chính văn.
