  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: vi
  text: Nhưng anh nổi giận và không muốn vào.[a] Cha anh đi ra và khẩn khoản nài nỉ anh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không chịu vào” hoặc “từ chối vào.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ được dịch là “khẩn khoản nài nỉ” cũng có thể dịch là “khuyên nhủ” hoặc “khẩn khoản”; thì chưa hoàn thành gợi ý rằng người cha tiếp tục kêu gọi anh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: nổi giận
  rationale: Động từ aorist ở đây có thể diễn tả sự khởi phát của cơn giận; “nổi giận” tự nhiên và sát hơn “đang giận”, đồng thời không mạnh quá như “nổi cơn thịnh nộ”.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ thứ nhất đánh dấu sự tương phản nhẹ giữa niềm vui ăn mừng trước đó và phản ứng của người anh.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: không muốn vào nhà
  rationale: θέλω cùng động từ nguyên mẫu diễn tả ý muốn. Cách dịch này giữ sắc thái ý chí mà không khẳng định quá mức rằng anh đã công khai từ chối; “nhà” được bổ sung theo ngữ cảnh của hành động đi vào.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Cha anh liền
  rationale: δέ thứ hai chuyển sang hành động đáp lại của người cha. “Liền” diễn đạt tự nhiên sự tiếp nối trong câu chuyện mà không tạo thêm đối lập mạnh.
- source_word: ἐξελθὼν
  choice: đi ra
  rationale: Phân từ của ἐξέρχομαι chỉ sự di chuyển từ bên trong ra ngoài; “đi ra” phù hợp với điểm nhìn kể chuyện trong tiếng Việt.
- source_word: παρεκάλει
  choice: cứ nài nỉ
  rationale: παρακαλέω trong ngữ cảnh này chỉ lời khẩn khoản, còn thì chưa hoàn thành gợi một hành động đang tiếp diễn hoặc lặp lại. “Cứ nài nỉ” giữ được cả sự tha thiết lẫn tính liên tục mà không mạnh quá như “van xin”.
- source_word: αὐτόν
  choice: anh
  rationale: Đại từ chỉ người con trai lớn; tiếng Việt tự nhiên lặp lại đại từ thân tộc “anh” trong ngữ cảnh này.
theological_decisions:
- issue: Sắc thái lời kêu gọi của người cha trong dụ ngôn
  choice: cứ nài nỉ anh
  alternative: khuyên anh; khẩn khoản với anh; van xin anh
  rationale: Cách dịch giữ sáng kiến đầy tha thiết của người cha và khía cạnh tiếp diễn của động từ, nhưng không thêm một kết luận giáo lý hay làm lời lẽ hạ mình quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” theo mạch dụ ngôn để chỉ người con trai lớn; không thêm danh xưng hay cách giải thích mang màu sắc hệ phái.
