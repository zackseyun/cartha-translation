  rationale: Bản sửa loại bỏ hai chi tiết diễn giải nhẹ (“liền”, “nhà”) để bám sát câu Hy Lạp hơn, đồng thời điều chỉnh cách diễn đạt lời cha khẩn khoản cho tự nhiên và đúng sắc thái hơn. Các chú thích được giữ với mốc [a] và [b] khớp đúng vị trí trong câu.
