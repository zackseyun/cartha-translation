revisions:
- from: 'Cả người Pha-ri-si lẫn các chuyên gia Kinh Luật đều lẩm bẩm than phiền rằng: “Ông này đón tiếp những kẻ tội lỗi và ăn chung với họ.”[a]'
  to: 'Cả các người Pha-ri-si lẫn các kinh sư đều lẩm bẩm phàn nàn, nói rằng: “Ông này tiếp đón[a] những người tội lỗi và ăn cùng họ.”'
  rationale: Bản sửa khắc phục số nhiều của “Pha-ri-si”, dùng “kinh sư” sát hơn với γραμματεῖς, tránh phần nào sự trùng lặp trong động từ than phiền, và đặt chú thích vào đúng cụm từ προσδέχεται. Câu vẫn bảo toàn tính tiếp diễn của lời phàn nàn, sắc thái xa cách của “Ông này”, và ý nghĩa giao thực của συνεσθίει αὐτοῖς.
