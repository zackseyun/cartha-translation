reference: Luke 15:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: vi
  text: 'Cả các người Pha-ri-si lẫn các kinh sư đều lẩm bẩm phàn nàn, nói rằng: “Ông này tiếp đón[a] những người tội lỗi và ăn cùng họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếp nhận những người tội lỗi và ăn cùng họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγόγγυζον
  choice: đều lẩm bẩm than phiền
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; cụm này giữ được cả sắc thái bất bình lẫn lời nói nhỏ giọng của động từ.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: cả người Pha-ri-si lẫn các chuyên gia Kinh Luật
  rationale: Cấu trúc τε ... καί được thể hiện bằng “cả ... lẫn ...”. “Chuyên gia Kinh Luật” truyền đạt vai trò của γραμματεῖς rõ hơn cho độc giả hiện đại so với từ Hán-Việt ít quen thuộc “kinh sư”.
- source_word: λέγοντες
  choice: rằng
  rationale: Phân từ chỉ lời nói đồng thời với hành động lẩm bẩm; trong tiếng Việt, “rằng” nối lời trích dẫn một cách tự nhiên và gọn.
- source_word: Οὗτος
  choice: Ông này
  rationale: Giữ sắc thái chỉ trỏ, xa cách và có phần khinh miệt của đại từ chỉ định, nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: ἁμαρτωλοὺς
  choice: những kẻ tội lỗi
  rationale: Diễn đạt tính từ được danh từ hóa như một hạng người bị gán nhãn về mặt xã hội và tôn giáo; “những kẻ” cũng phù hợp với giọng điệu chê trách của người nói.
- source_word: προσδέχεται
  choice: đón tiếp
  rationale: Diễn tả việc tiếp nhận một cách thuận tình và thân thiện; tự nhiên hơn “tiếp nhận” trong ngữ cảnh con người giao tiếp với nhau.
- source_word: συνεσθίει αὐτοῖς
  choice: ăn chung với họ
  rationale: Truyền đạt trực tiếp việc cùng ăn và hàm ý giao hảo tại bàn ăn mà không thêm lời giải thích vào chính văn.
theological_decisions:
- issue: Ý nghĩa xã hội và thần học của việc Chúa Giê-su giao thiệp với những người bị gọi là tội lỗi
  choice: Giữ nguyên lời cáo buộc rằng ông đón tiếp họ và ăn chung với họ, không làm nhẹ đi sự xúc phạm mà những người phê phán cảm nhận.
  alternative: Diễn giải thành “giao du với những người bị xã hội ruồng bỏ” hoặc thêm ý nghĩa về sự chấp nhận vô điều kiện.
  rationale: Bản Hy Lạp nêu hai hành động cụ thể—đón tiếp và cùng ăn—nhưng không giải thích thần học ngay tại câu này. Bản dịch vì thế giữ sức căng của lời tố cáo mà không bổ sung cách diễn giải theo hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Pha-ri-si” giữ tên gọi quen thuộc; “chuyên gia Kinh Luật” làm rõ chức năng của nhóm γραμματεῖς. Dùng “lẩm bẩm than phiền” để tái hiện sắc thái và thể của động từ Hy Lạp.
