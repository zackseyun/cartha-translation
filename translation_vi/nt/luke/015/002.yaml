    rationale: Οἵ ... Φαρισαῖοι là số nhiều; tiếng Việt cần “các người Pha-ri-si” hoặc một cách diễn đạt tập hợp tương đương.
  - severity: medium
    issue: “Chuyên gia Kinh Luật” diễn giải hẹp γραμματεῖς
    rationale: γραμματεῖς trước hết là các kinh sư/thầy thông giáo; dù nhiều người có vai trò pháp lý, cách gọi “chuyên gia Kinh Luật” dễ áp đặt một phân loại hiện đại và không cần thiết.
  - severity: low
    issue: Ký hiệu chú thích không neo trực tiếp vào từ được thay thế
