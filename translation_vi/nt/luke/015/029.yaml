source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: vi
  text: 'Nhưng anh đáp lại cha mình: “Cha xem, suốt bao năm nay con đã hầu hạ cha và chưa từng trái lệnh cha; thế mà cha chưa hề cho con một con dê con để con ăn mừng với bạn bè.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp lại
  rationale: Thành ngữ Hy Lạp có nghĩa là trả lời; cách dịch gọn này tự nhiên trong tiếng Việt và không lặp thừa ‘đáp và nói’.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: cha mình
  rationale: Diễn đạt rõ người anh đang trả lời chính cha của mình, phù hợp cú pháp tiếng Việt.
- source_word: Ἰδοὺ
  choice: Cha xem
  rationale: Giữ lực nhấn mạnh của từ dẫn nhập, đồng thời thể hiện tự nhiên việc người con trực tiếp nói với cha.
- source_word: τοσαῦτα ἔτη
  choice: suốt bao nhiêu năm nay
  rationale: Diễn tả khoảng thời gian kéo dài đến hiện tại và giữ giọng than trách.
- source_word: δουλεύω
  choice: đã làm tôi tớ cho cha
  rationale: Giữ sắc thái phục dịch, lệ thuộc của động từ thuộc nhóm δοῦλος và phù hợp với lời than trách cay đắng của người anh, nhưng không khẳng định anh là nô lệ theo nghĩa pháp lý.
- source_word: ἐντολήν σου παρῆλθον
  choice: trái lệnh cha
  rationale: Cách nói tiếng Việt ngắn gọn, tự nhiên, diễn đạt đúng ý vi phạm hoặc không tuân theo mệnh lệnh.
- source_word: ἔδωκας ἔριφον
  choice: cho con lấy một con dê con
  rationale: ἔριφος chỉ dê non; ‘dê con’ rõ nghĩa với độc giả hiện đại. ‘Cho con lấy’ truyền đạt việc người cha cấp con vật để mở tiệc.
- source_word: ἵνα ... εὐφρανθῶ
  choice: để con ăn mừng
  rationale: Phù hợp ngữ cảnh tiệc tùng và truyền đạt tự nhiên mục đích của mệnh đề ἵνα.
- source_word: μετὰ τῶν φίλων μου
  choice: với bạn bè
  rationale: Diễn đạt tự nhiên quan hệ đồng hành; đại từ sở hữu đã rõ từ ngữ cảnh tiếng Việt.
theological_decisions:
- issue: Sắc thái của δουλεύω trong lời người anh
  choice: đã làm tôi tớ cho cha
  alternative: đã phục vụ cha; đã hầu hạ cha
  rationale: Bản dịch giữ sức nặng của từ chỉ sự phục dịch và tâm thế cay đắng của người anh, nhưng chú thích bảo tồn khả năng hiểu theo nghĩa nhẹ hơn là ‘phục vụ’. Cách dịch không biến lời than của nhân vật thành một tuyên bố giáo lý rằng quan hệ cha con thực sự là quan hệ chủ nô.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ xưng hô ‘anh—cha—con’ phù hợp mạch truyện gia đình; lời thoại giữ sắc thái trách móc mạnh mà không dùng cách nói cổ hoặc quá khẩu ngữ.
