  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: vi
  text: Con không còn xứng đáng được gọi là con của cha nữa. Xin cha cho con được như một người làm thuê của cha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một đầy tớ làm thuê của cha” hoặc “một người làm công của cha.” Từ Hy Lạp chỉ người lao động được trả công, không phải nô lệ trong nhà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: không còn... nữa
  rationale: Diễn đạt tự nhiên ý phủ định về thời gian, cho thấy người con nhận rằng địa vị của mình đã thay đổi.
- source_word: ἄξιος
  choice: xứng đáng
  rationale: Giữ được sắc thái về tư cách và sự đáng được hưởng một địa vị trong quan hệ gia đình và xã hội.
- source_word: κληθῆναι
  choice: được gọi là
  rationale: Phản ánh thể bị động và giữ được cả nghĩa gọi tên lẫn nhìn nhận một người trong địa vị ấy.
- source_word: υἱός
  choice: con
  rationale: Trong lời trực tiếp thưa với cha, tiếng Việt tự nhiên dùng “con”; ngữ cảnh xác định đây là người con trai nên không cần thêm chữ “trai” vốn dễ gây gượng.
- source_word: ποίησόν με
  choice: xin cha cho con được
  rationale: Truyền đạt lời cầu xin được đặt vào một địa vị mới; tự nhiên và trang trọng hơn cách dịch máy móc “hãy làm con thành”.
- source_word: ὡς
  choice: như
  rationale: Giữ sắc thái so sánh của ὡς mà không đồng nhất hóa hoàn toàn địa vị.
- source_word: ἕνα τῶν μισθίων σου
  choice: một người làm thuê của cha
  rationale: “Người làm thuê” là cách nói hiện đại, dễ hiểu, nhấn mạnh đây là lao động được trả công, khác với nô lệ hoặc gia nhân trong nhà.
theological_decisions:
- issue: Ngôn ngữ về địa vị trong lời thú nhận của người con
  choice: Giữ “xứng đáng” và quan hệ “con của cha”
  alternative: Con không còn đáng được cha coi là con nữa
  rationale: Bản dịch giữ nguyên sức nặng về quan hệ cha-con và danh dự xã hội, không giản lược thành một cảm giác hổ thẹn chung chung hay thêm kết luận thần học ngoài văn bản.
- issue: Sắc thái của ὡς trước địa vị người làm thuê
  choice: Dịch là “như một người làm thuê”
  alternative: cho con làm một người làm thuê
  rationale: “Như” bảo tồn hình thức so sánh trong tiếng Hy Lạp và tránh âm thầm quyết định rằng người con đòi được chính thức bổ nhiệm vào địa vị ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên trong lời một người con thưa với cha. Đại từ “con/cha” làm rõ quan hệ và phù hợp hội thoại tiếng Việt; từ “xin” thể hiện sắc thái khẩn cầu của mệnh lệnh Hy Lạp trong ngữ cảnh mà không cường điệu.
