source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: vi
  text: vì con trai này của ta đã chết, nay sống lại; đã mất, nay được tìm thấy. Rồi họ bắt đầu ăn mừng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do người cha đưa ra cho việc mở tiệc; “vì” là liên từ nhân quả tự nhiên trong tiếng Việt.
- source_word: οὗτος ὁ υἱός μου
  choice: con trai này của ta
  rationale: Giữ sắc thái nhấn mạnh của đại từ chỉ định οὗτος và cách người cha xác nhận mối quan hệ với người con.
- source_word: νεκρὸς ἦν
  choice: đã chết
  rationale: Giữ nguyên hình ảnh chết–sống mạnh mẽ của bản Hy Lạp, không diễn giải thành sự xa cách hay cái chết thuộc linh.
- source_word: ἀνέζησεν
  choice: nay sống lại
  rationale: Diễn đạt sự trở lại với sự sống và kết quả hiện tại trong ngữ cảnh; “sống lại” tự nhiên, đồng thời tương ứng trực tiếp với “đã chết”.
- source_word: ἦν ἀπολωλὼς
  choice: đã mất
  rationale: Bảo toàn mô-típ mất–tìm thấy xuyên suốt chương 15; không dùng “hư mất” vì có thể đưa thêm sắc thái thần học chuyên biệt vào câu chuyện.
- source_word: εὑρέθη
  choice: nay được tìm thấy
  rationale: Giữ thể bị động và không xác định tác nhân, đồng thời “nay” nêu bật tình trạng đã đổi thay mà không làm rõ hơn mức bản văn.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: họ bắt đầu ăn mừng
  rationale: Giữ ý khởi đầu của ἤρξαντο; “ăn mừng” là cách nói hiện đại, rõ ràng và hợp với bối cảnh yến tiệc.
theological_decisions:
- issue: Sức nặng ẩn dụ của ngôn ngữ “chết” và “sống lại”
  choice: Giữ nguyên ngôn ngữ chết–sống, không chú giải ngay trong câu.
  alternative: Diễn ý thành “coi như đã chết” hoặc xác định đây là sự sống lại về mặt thuộc linh/xã hội.
  rationale: Trong câu chuyện, lời người cha mang tính ẩn dụ về sự phục hồi sau xa cách, nhưng chính bản văn cố ý dùng ngôn ngữ chết và sống lại. Bản dịch cần giữ nguyên độ căng ấy.
- issue: Tác nhân của việc tìm thấy
  choice: Dùng thể bị động “được tìm thấy” mà không nêu ai tìm thấy.
  alternative: Dịch chủ động như “ta đã tìm thấy nó” hoặc quy hành động trực tiếp cho Đức Chúa Trời.
  rationale: εὑρέθη là thể bị động và không nêu tác nhân; việc giữ nguyên sự mở này tránh áp đặt một cách giải thích thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cặp “đã… mà nay…” làm nổi bật sự đảo ngược giữa tình trạng trước đây và hiện tại; “ta/nó” phù hợp lời người cha nói về con mình trong bối cảnh kể chuyện cổ, nhưng vẫn tự nhiên đối với độc giả phổ thông.
