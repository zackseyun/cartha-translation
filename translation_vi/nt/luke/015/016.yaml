review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cơn thèm muốn kéo dài, hình ảnh làm đầy bụng, việc heo đang ăn, và việc không ai tiếp tế cho người con. Tuy nhiên, “quả đậu carob” không phải cách gọi chính xác hoặc tự nhiên cho κεράτια, vốn chỉ quả/vỏ quả của cây carob (carob pods).
  naturalness: “Anh ta thèm được lấp đầy bụng mình” hơi gượng trong tiếng Việt hiện đại. “Anh ta thèm lấp đầy bụng mình” giữ sát hình ảnh nguyên ngữ mà tự nhiên hơn. “Quả carob” rõ và tránh cách ghép “quả đậu” không chuẩn.
  terminology: Dùng “heo” phù hợp tiếng Việt hiện đại. “Quả carob” là cách gọi trung tính, với chú thích giải thích đây là quả của cây carob và thường làm thức ăn cho vật nuôi. Không cần biến câu nối καὶ thành tương phản mạnh bằng “nhưng”; “vậy mà” phản ánh tự nhiên hoàn cảnh thiếu thốn mà không làm thay đổi nghĩa.
  issues:
  - severity: medium
    issue: Cụm “những quả đậu carob” không chính xác/tự nhiên.
    rationale: κεράτια là quả (pod) của cây carob, không phải “quả đậu” theo cách gọi thông dụng tiếng Việt. Cụm hiện tại có thể khiến người đọc hiểu là một loại đậu.
  - severity: low
    issue: Cấu trúc “thèm được lấp đầy bụng mình” gượng.
    rationale: Cấu trúc bị động với “được” làm giảm tính trực tiếp của ἐπεθύμει γεμίσαι. Bỏ “được” bảo toàn ý muốn của chủ thể và cải thiện độ tự nhiên.
  revised_text: Anh ta thèm lấp đầy bụng mình bằng những quả carob[a] mà đàn heo đang ăn, vậy mà chẳng ai cho anh ta thứ gì.
  revised_footnotes:
