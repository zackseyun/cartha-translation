  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: vi
  text: Anh ta thèm lấp đầy bụng mình bằng những quả carob[a] mà đàn heo đang ăn, vậy mà chẳng ai cho anh ta thứ gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp chỉ quả của cây carob, thường được dùng làm thức ăn cho vật nuôi.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐπεθύμει
  choice: thèm được
  rationale: Thì chưa hoàn thành diễn tả một ham muốn kéo dài; “thèm” tự nhiên trong bối cảnh đói khát và giữ được cường độ của động từ.
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: lấp đầy bụng mình
  rationale: Giữ hình ảnh cụ thể “làm đầy bụng” của tiếng Hy Lạp, thay vì diễn giải thành “ăn cho no”.
- source_word: ἀπὸ τῶν κερατίων
  choice: bằng những quả đậu carob
  rationale: “Bằng” diễn đạt tự nhiên phương tiện dùng để làm đầy bụng; κεράτια chỉ quả của cây carob, thường dùng làm thức ăn gia súc.
- source_word: οἱ χοῖροι
  choice: đàn heo
  rationale: “Heo” là từ hiện đại, phổ thông; thêm “đàn” phù hợp cách nói tự nhiên khi chỉ nhóm vật nuôi.
- source_word: ἤσθιον
  choice: đang ăn
  rationale: Diễn đạt khía cạnh tiếp diễn của thì chưa hoàn thành trong cảnh được kể.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: chẳng ai cho anh ta thứ gì
  rationale: “Chẳng ai” nhấn mạnh sự thiếu thốn; “thứ gì” làm rõ tân ngữ được hàm ý mà không xác định đó là thức ăn hay vật khác.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh ta” theo ngữ cảnh nhân vật trong dụ ngôn; giữ hình ảnh thể chất mạnh của cơn đói.
