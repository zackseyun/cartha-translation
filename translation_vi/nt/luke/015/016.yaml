revisions:
- from: Anh ta thèm được lấp đầy bụng mình bằng những quả đậu carob[a] mà đàn heo đang ăn, nhưng chẳng ai cho anh ta thứ gì.
  to: Anh ta thèm lấp đầy bụng mình bằng những quả carob[a] mà đàn heo đang ăn, vậy mà chẳng ai cho anh ta thứ gì.
  rationale: Sửa thuật ngữ “quả đậu carob” thành “quả carob” để phản ánh đúng κεράτια; chỉnh nhẹ cấu trúc động từ cho tiếng Việt tự nhiên hơn. Giữ khía cạnh đang diễn ra của “đang ăn” và ý thiếu thốn tiếp diễn trong “chẳng ai cho anh ta thứ gì.”
  reviewer_model: gpt-5.6-terra
