  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: vi
  text: 'Nhưng khi tỉnh ngộ[a], anh tự nhủ: ‘Biết bao người làm thuê của cha ta có dư bánh ăn[b], còn ta ở đây đang chết vì đói[c]!’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “đến với chính mình.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “có bánh ăn còn dư.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “đang kiệt quệ vì đói.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: khi tỉnh ngộ
  rationale: Đây là thành ngữ chỉ việc trở lại trạng thái nhận thức sáng suốt. “Tỉnh ngộ” tự nhiên trong tiếng Việt và phù hợp bước ngoặt của câu chuyện; chú thích giữ lại hình ảnh nguyên văn Hy Lạp.
- source_word: ἔφη
  choice: anh tự nhủ
  rationale: Động từ dẫn lời ở thì aorist được diễn đạt tự nhiên trong văn kể; ngữ cảnh cho thấy đây là lời nói với chính mình.
- source_word: μίσθιοι
  choice: người làm thuê
  rationale: Chỉ những người lao động nhận tiền công, phân biệt với nô lệ hay đầy tớ thuộc gia đình.
- source_word: περισσεύονται ἄρτων
  choice: có bánh ăn dư dật
  rationale: Giữ danh từ cụ thể “bánh” và chuyển tải ý nghĩa dư thừa, nhiều hơn nhu cầu của περισσεύονται.
- source_word: λιμῷ
  choice: vì đói
  rationale: Trong ngữ cảnh này, từ này nói đến tình trạng đói khát gây nên sự suy kiệt, không nhất thiết chỉ toàn cảnh nạn đói.
- source_word: ὧδε
  choice: ở đây
  rationale: Giữ rõ sự tương phản giữa hoàn cảnh hiện tại của người con và tình cảnh tại nhà cha.
- source_word: ἀπόλλυμαι
  choice: đang chết dần
  rationale: Diễn đạt tiến trình hủy hoại nghiêm trọng ở thể hiện tại mà không làm nhẹ sức nặng của động từ.
theological_decisions:
- issue: Ý nghĩa của việc “đến với chính mình”
  choice: Dịch “tỉnh ngộ” và ghi nghĩa đen trong chú thích
  alternative: Dịch trực tiếp “trở về với chính mình”
  rationale: Không diễn giải cụm từ thành một sự hoán cải theo nghĩa thần học chuyên biệt; bản dịch chỉ thể hiện sự hồi tỉnh và tự nhận thức mà ngữ cảnh trực tiếp cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” cho nhân vật trong lời kể và “cha ta” trong độc thoại để giữ sắc thái tự nhiên mà vẫn trang nghiêm. Các dấu chú thích [a], [b], [c] đều được đặt ngay sau cụm từ liên quan.
