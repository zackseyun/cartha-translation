id: LUK.15.22
reference: Luke 15:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: vi
  text: 'Nhưng người cha bảo các nô lệ[a] của ông: “Mau, đem chiếc áo choàng tốt nhất[b] ra đây và mặc cho cậu ấy; đeo một chiếc nhẫn[c] vào tay cậu ấy, và xỏ đôi dép vào chân cậu ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể được dịch là “đầy tớ”; tuy nhiên, từ này thường chỉ những người lệ thuộc phục vụ trong nhà, tức nô lệ hoặc người nô dịch.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát chữ: “chiếc áo choàng thứ nhất”; trong ngữ cảnh có lẽ là chiếc áo choàng hàng đầu hoặc tốt nhất.'
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn chỉ nói “nhẫn”; một số người hiểu đây là nhẫn ấn, biểu thị địa vị được phục hồi.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: các đầy tớ
  rationale: Trong bối cảnh gia đình và điền trang cổ đại, từ này chỉ những người lệ thuộc phục vụ trong nhà, có thể là nô lệ. “Đầy tớ” là cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, còn chú thích giữ lại thực trạng xã hội của từ Hy Lạp.
- source_word: Ταχὺ
  choice: Mau lên
  rationale: Trạng từ này thúc giục hành động tức thì; “Mau lên” tự nhiên trong lời sai bảo trực tiếp và truyền đạt sự khẩn trương.
- source_word: ἐξενέγκατε
  choice: hãy mang ... ra
  rationale: Động từ chỉ việc mang vật từ bên trong ra; cách diễn đạt này vừa cụ thể vừa tự nhiên.
- source_word: στολὴν τὴν πρώτην
  choice: chiếc áo choàng tốt nhất
  rationale: πρώτην theo nghĩa đen là “thứ nhất/đứng đầu”, nhưng trong cụm này nhiều khả năng chỉ chiếc áo choàng hàng đầu, tức tốt nhất; chú thích bảo lưu cách hiểu sát chữ.
- source_word: ἐνδύσατε αὐτόν
  choice: mặc cho nó
  rationale: Diễn đạt hành động mặc chiếc áo vừa được nhắc đến cho người con; “nó” phù hợp lời người cha nói với gia nhân trong ngữ cảnh kể chuyện.
- source_word: δακτύλιον
  choice: nhẫn
  rationale: Danh từ Hy Lạp chỉ một chiếc nhẫn, không tự nó xác định là nhẫn ấn; bản dịch không đưa suy luận biểu tượng vào chính văn.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: vào tay
  rationale: Tiếng Việt thường nói “đeo nhẫn vào tay”; đây là cách chuyển tự nhiên cho cấu trúc giới từ Hy Lạp.
- source_word: ὑποδήματα
  choice: dép
  rationale: Từ này chỉ đồ đi chân, đặc biệt là dép trong bối cảnh Địa Trung Hải cổ đại; “dép” chính xác về văn hóa hơn “giày”.
- source_word: εἰς τοὺς πόδας
  choice: vào chân
  rationale: 'Kết hợp tự nhiên với động từ “mang” trong tiếng Việt: “mang dép vào chân”.'
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển có sắc thái tương phản từ lời của người con sang mệnh lệnh của người cha.
theological_decisions:
- issue: Cách dịch δούλους theo địa vị xã hội
  choice: các đầy tớ, kèm chú thích rằng nguyên ngữ cũng có thể dịch là nô lệ
  alternative: các nô lệ
  rationale: “Đầy tớ” tự nhiên trong văn kể tiếng Việt và không làm câu nói trở nên thô cứng, trong khi chú thích minh thị rằng từ Hy Lạp hàm ý thân phận lệ thuộc, tránh xóa bỏ thực trạng xã hội cổ đại.
- issue: Nghĩa của πρώτην trong cụm στολὴν τὴν πρώτην
  choice: chiếc áo choàng tốt nhất
  alternative: chiếc áo choàng thứ nhất / hàng đầu
  rationale: Trong ngữ cảnh, từ này nhiều khả năng nói đến phẩm chất hoặc địa vị nổi trội chứ không phải thứ tự thời gian; chú thích bảo lưu nghĩa sát chữ và độ mở của nguyên văn.
- issue: Có xác định δακτύλιον là nhẫn ấn hay không
  choice: nhẫn
  alternative: nhẫn ấn
  rationale: Nguyên văn chỉ nói “nhẫn”. Dù có thể hiểu đó là dấu hiệu của địa vị được phục hồi, xác định nó là nhẫn ấn sẽ đưa một suy luận diễn giải vào chính văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Lời người cha dùng mệnh lệnh trực tiếp, khẩn trương. “Áo choàng”, “nhẫn” và “dép” giữ sắc thái văn hóa cổ đại mà vẫn tự nhiên trong tiếng Việt.
