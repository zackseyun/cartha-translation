reference: Luke 15:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: vi
  text: Nhưng khi đứa con này của cha đến—đứa đã ăn sạch gia sản của cha với gái mại dâm—thì cha làm thịt con bê béo cho nó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: Kết hợp ý thời gian của ὅτε với sắc thái tương phản nhẹ của δέ, phù hợp với lời trách móc của người con cả.
- source_word: ὁ υἱός σου οὗτος
  choice: đứa con này của cha
  rationale: Giữ sắc thái chỉ định và xa cách, khinh miệt; người con cả không gọi người kia là em mình.
- source_word: ὁ καταφαγών
  choice: đã ăn sạch
  rationale: Giữ hình ảnh mạnh và sinh động của động từ κατεσθίω, theo nghĩa đen là ăn hết/nuốt sạch, đồng thời tự nhiên trong tiếng Việt.
- source_word: σου τὸν βίον
  choice: gia sản của cha
  rationale: Trong ngữ cảnh, βίος chỉ tài sản hay của cải dùng để sinh sống, không phải sự sống sinh học. “Gia sản” phù hợp với phần tài sản người cha đã chia.
- source_word: μετὰ πορνῶν
  choice: với bọn gái mại dâm
  rationale: Dịch trực tiếp lời buộc tội của người con cả; “bọn” truyền đạt giọng khinh miệt trong lời nói mà không biến nó thành lời xác nhận của người kể chuyện.
- source_word: ἦλθεν
  choice: trở về
  rationale: Động từ có nghĩa cơ bản là “đến”; trong tiếng Việt, “trở về” tự nhiên hơn trong bối cảnh người con quay lại nhà, dù có phần làm rõ điều ngữ cảnh vốn đã cho biết.
- source_word: ἔθυσας
  choice: làm thịt
  rationale: Ở đây θύω nói đến giết con vật để làm tiệc, không nhất thiết là hiến tế. “Làm thịt” chính xác và tự nhiên trong ngữ cảnh gia đình mở tiệc.
- source_word: τὸν σιτευτὸν μόσχον
  choice: bê béo
  rationale: Chỉ con bê được nuôi vỗ béo dành cho dịp đặc biệt; cách nói ngắn gọn, quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: αὐτῷ
  choice: cho nó
  rationale: Thể hiện cách dùng tặng cách chỉ người hưởng lợi, đồng thời giữ giọng xa cách của người anh trong toàn câu.
theological_decisions:
- issue: Có nên trình bày lời người anh cáo buộc em mình như một sự kiện đã được người kể chuyện xác nhận hay không
  choice: Dịch thẳng lời cáo buộc, không thêm từ hạn định
  alternative: “đứa bị cho là đã ăn sạch…” hoặc diễn giải thành “đã phung phí tài sản trong lối sống vô đạo đức”
  rationale: Bản Hy Lạp đặt điều này trong lời người con cả, chứ không trực tiếp xác nhận bằng tiếng nói của người kể chuyện. Dịch nguyên lời nói giữ được căng thẳng tự sự mà không thêm “bị cho là” hay đồng nhất hoàn toàn với câu 13.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “cha—nó” tái hiện lời người con cả nói với cha và thái độ xa cách đối với người em. Dấu gạch ngang giúp phần phân từ bổ nghĩa rõ ràng trong tiếng Việt.
