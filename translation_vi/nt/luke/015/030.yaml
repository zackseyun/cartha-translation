review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa «trở về» thành «đến»: ἦλθεν đơn giản là «đến», dù ngữ cảnh cho thấy người con đã quay về. Bản dịch cũng nên tránh thêm sắc thái miệt thị tập thể qua «bọn», vì điều này không được đánh dấu riêng bởi μετὰ πορνῶν. Các yếu tố còn lại truyền đạt tốt lời trách móc xa cách của người con cả, hình ảnh mạnh của καταφαγών, và hành động giết bê để mở tiệc của ἔθυσας.'
  naturalness: Câu văn tự nhiên, rõ nghĩa và giữ được giọng trách móc. «Đứa con này của cha» và «cho nó» tái hiện hợp lý sự xa cách của người anh. «Con bê béo» tự nhiên hơn đôi chút so với cách nói lược «bê béo».
  terminology: «Gia sản» phù hợp với βίος trong ngữ cảnh tài sản/sinh kế; «gái mại dâm» là tương đương hiện đại, trực tiếp của πόρναι; «làm thịt» phù hợp với θύω trong bối cảnh chuẩn bị tiệc, không gợi ý hiến tế.
  issues:
  - severity: low
    issue: «trở về» dịch ἦλθεν
    rationale: Động từ nguồn chỉ nói «đến». Ý trở về có thể suy từ bối cảnh nhưng không nên được đưa vào riêng trong mệnh đề này.
  - severity: low
    issue: «bọn gái mại dâm» thêm sắc thái
    rationale: μετὰ πορνῶν nghĩa là «với gái mại dâm». Thái độ khinh miệt, xa cách đã được thể hiện rõ bởi «đứa con này của cha»; «bọn» thêm một mức độ khinh miệt không được từ nguồn biểu thị trực tiếp.
  revised_text: Nhưng khi đứa con này của cha đến—đứa đã ăn sạch gia sản của cha với gái mại dâm—thì cha làm thịt con bê béo cho nó.
