  to: Nhưng khi đứa con này của cha đến—đứa đã ăn sạch gia sản của cha với gái mại dâm—thì cha làm thịt con bê béo cho nó.
  rationale: 'Bản sửa giữ nguyên cấu trúc tố cáo của lời người con cả và không biến lời cáo buộc thành xác nhận của người kể chuyện. Chỉ loại bỏ hai sắc thái được thêm vào: «trở về» thay cho «đến» và từ tập hợp miệt thị «bọn».'
