review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc câu hỏi tu từ của Ἢ τίς γυνὴ, điều kiện ἐὰν ἀπολέσῃ, ba hành động liên tiếp (thắp đèn, quét nhà, tìm kiếm), và điểm kết thúc ἕως οὗ εὕρῃ. “Cho đến khi tìm thấy” lược tân ngữ một cách rõ nghĩa trong tiếng Việt.
  naturalness: Câu nhìn chung tự nhiên và đúng văn phong hiện đại. Tuy nhiên, “đracma” không phải cách phiên âm tiếng Việt thông dụng, dễ gây vấp khi đọc. “Đơ-ra-chma” minh bạch hơn cho độc giả Việt ngữ hiện nay.
  terminology: Nên thống nhất dùng “đồng đơ-ra-chma” cho δραχμή, vừa giữ tên đồng tiền cụ thể vừa có dạng phiên âm Việt ngữ dễ nhận biết. Chú thích văn hóa vẫn cần thiết. Chú thích lựa chọn từ vựng nên dùng “cẩn thận” để diễn đạt trực tiếp ἐπιμελῶς; “chuyên cần” thường nói về phẩm chất bền bỉ của một người hơn là cách thức tìm trong ngữ cảnh này.
  issues:
  - severity: low
    issue: Tên đồng tiền được viết là “đracma”.
    rationale: Cách viết này không phải dạng phiên âm Việt ngữ thông dụng và có thể làm giảm tính tự nhiên, dù không làm sai nghĩa. Dạng “đơ-ra-chma” phù hợp hơn với cách đọc tiếng Việt hiện đại.
  - severity: low
    issue: Chú thích b dùng “tìm kiếm chuyên cần”.
    rationale: “Chuyên cần” thiên về đức tính siêng năng, trong khi ἐπιμελῶς ở đây nói về việc tìm một cách cẩn thận/kỹ lưỡng. “Tìm kiếm cẩn thận” là lựa chọn từ vựng sát và tự nhiên hơn.
  revised_text: Hay có người phụ nữ nào có mười đồng đơ-ra-chma[a], nếu đánh mất một đồng đơ-ra-chma, lại không thắp đèn, quét nhà và tìm kiếm kỹ lưỡng[b] cho đến khi tìm thấy sao?
