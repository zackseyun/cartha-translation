id: LUK.15.8
reference: Luke 15:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: vi
  text: Hay có người phụ nữ nào có mười đồng đơ-ra-chma[a], nếu đánh mất một đồng đơ-ra-chma, lại không thắp đèn, quét nhà và tìm kiếm kỹ lưỡng[b] cho đến khi tìm thấy sao?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đơ-ra-chma là một đồng bạc của Hy Lạp.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “tìm kiếm cẩn thận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Hay
  rationale: Nối minh họa này với minh họa ngay trước đó và giữ sắc thái đưa ra một trường hợp song song.
- source_word: τίς γυνὴ
  choice: có người phụ nữ nào
  rationale: Diễn đạt tự nhiên trong câu hỏi tu từ tiếng Việt, không thêm ý “trong các ngươi,” vốn không có trong nguyên văn.
- source_word: δραχμὰς / δραχμὴν
  choice: đồng đracma
  rationale: Giữ tên gọi cụ thể của đồng tiền Hy Lạp thay vì khái quát hóa thành “đồng bạc” hay “đồng tiền”; chú thích cung cấp bối cảnh văn hóa cần thiết.
- source_word: ἐὰν ἀπολέσῃ
  choice: nếu đánh mất
  rationale: Thể hiện điều kiện tổng quát của ἐάν với động từ giả định, phù hợp với tình huống được nêu trong câu hỏi tu từ.
- source_word: οὐχὶ
  choice: lại không ... sao?
  rationale: Giữ lực của câu hỏi tu từ vốn chờ đợi câu trả lời khẳng định, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἅπτει λύχνον
  choice: thắp đèn
  rationale: Diễn đạt rõ hành động làm cho đèn cháy sáng; không thêm mạo từ xác định mà tiếng Hy Lạp không có.
- source_word: σαροῖ τὴν οἰκίαν
  choice: quét nhà
  rationale: Cách nói cụ thể, ngắn gọn và tự nhiên, phù hợp với khung cảnh sinh hoạt trong nhà.
- source_word: ζητεῖ ἐπιμελῶς
  choice: tìm kiếm kỹ lưỡng
  rationale: Truyền đạt cả hành động tìm kiếm lẫn sắc thái cẩn thận, chuyên tâm của ἐπιμελῶς.
- source_word: ἕως οὗ εὕρῃ
  choice: cho đến khi tìm thấy
  rationale: Giữ điểm kết thúc của cuộc tìm kiếm; tiếng Việt có thể lược tân ngữ vì đồng tiền bị mất đã rõ trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng gần gũi. Cấu trúc “có người phụ nữ nào... lại không... sao?” giữ tính chất câu hỏi tu từ. Tên đồng tiền được phiên âm là “đracma” để bảo toàn tính lịch sử, còn chú thích giải thích ngắn gọn.
