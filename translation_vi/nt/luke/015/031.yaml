  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: vi
  text: 'Nhưng ông nói với anh: “Con à,[a] con luôn ở với cha, và mọi sự của cha đều là của con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng từ nghĩa là “con,” một cách gọi thân tình trong gia đình; từ này không chuyên biệt có nghĩa là “con trai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Nhưng ông nói với anh
  rationale: δέ biểu thị sự chuyển ý hoặc tương phản nhẹ với lời than phiền trước đó của người con lớn; “Nhưng” phù hợp với mạch đối thoại. “Ông” và “anh” dựa trên các nhân vật đã rõ trong ngữ cảnh.
- source_word: Τέκνον
  choice: Con à
  rationale: τέκνον là cách xưng gọi thân tình trong gia đình, nghĩa căn bản là “con,” không dùng từ Hy Lạp chuyên biệt chỉ con trai. “Con à” vừa tự nhiên trong tiếng Việt vừa giữ được giọng trìu mến của người cha.
- source_word: πάντοτε
  choice: luôn
  rationale: πάντοτε có nghĩa “luôn luôn, mọi lúc”; “luôn” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: μετ’ ἐμοῦ
  choice: ở với cha
  rationale: μετά với sở hữu cách chỉ sự ở cùng hoặc đồng hành. Trong lời trực tiếp giữa cha và con, cặp xưng hô “cha–con” là cách chuyển đạt tự nhiên của tiếng Việt.
- source_word: πάντα τὰ ἐμὰ
  choice: mọi sự của cha
  rationale: Cụm trung tính số nhiều bao quát tất cả những gì thuộc về người cha. “Mọi sự của cha” giữ phạm vi rộng, không thu hẹp riêng vào tài sản pháp lý.
- source_word: σά ἐστιν
  choice: đều là của con
  rationale: σά ἐστιν có nghĩa “là của con”; thêm “đều” làm rõ tính bao quát đã có trong πάντα mà không quyết định cụ thể sắc thái pháp lý hay quan hệ.
theological_decisions:
- issue: Cách người cha gọi người con lớn
  choice: Dịch τέκνον là “Con à”
  alternative: “Con trai à” hoặc “Con của cha”
  rationale: “Con à” bảo tồn sự thân tình và mối quan hệ gia đình nhưng không thêm nét giống đực vốn không được biểu thị bằng chính danh từ τέκνον. Cách dịch này cũng tránh gia tăng sắc thái sở hữu không có trực tiếp trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên trong đối thoại gia đình. Cặp đại từ “cha–con” chuyển tải đúng quan hệ của các nhân vật; dấu “à” thể hiện lời gọi trìu mến mà không cường điệu cảm xúc.
