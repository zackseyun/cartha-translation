id: LUK.15.6
reference: Luke 15:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: vi
  text: 'Khi về đến nhà[a], người ấy gọi bạn bè và hàng xóm lại rồi nói: ‘Hãy chung vui với tôi[b], vì tôi đã tìm được con chiên của tôi, là con đã bị lạc[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “khi vào trong nhà.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Hãy cùng tôi vui mừng” hoặc “Hãy ăn mừng với tôi.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “con chiên bị lạc của tôi.” Hy Lạp dịch sát là “con chiên của tôi, con đã bị lạc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: Khi về đến nhà
  rationale: Diễn đạt tự nhiên trong tiếng Việt một phân từ chỉ thời gian; ‘về đến nhà’ phù hợp ngữ cảnh trở về sau cuộc tìm kiếm, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: συγκαλεῖ
  choice: gọi ... lại
  rationale: Truyền đạt hành động gọi nhiều người tụ họp, tự nhiên hơn ‘triệu tập’ trong khung cảnh vui mừng.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: bạn bè và hàng xóm
  rationale: Các từ tương đương trực tiếp, thông dụng trong tiếng Việt hiện đại.
- source_word: Συγχάρητέ μοι
  choice: Hãy chung vui với tôi
  rationale: Thể hiện mệnh lệnh cùng chia sẻ niềm vui với người nói, vừa tự nhiên vừa giữ sắc thái của συγχαίρω.
- source_word: ὅτι εὗρον
  choice: vì tôi đã tìm được
  rationale: ὅτι nêu lý do; ‘đã tìm được’ diễn tả hành động hoàn tất cùng kết quả hiện tại.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: con chiên của tôi, là con đã bị lạc
  rationale: Giữ cấu trúc danh từ kèm phân từ xác định của Hy Lạp và hình ảnh cụ thể trong dụ ngôn, thay vì thu gọn hoàn toàn thành ‘con chiên bị lạc của tôi’.
theological_decisions:
- issue: Hình ảnh tìm lại trong dụ ngôn
  choice: Giữ nguyên hình ảnh cụ thể ‘con chiên của tôi, là con đã bị lạc’.
  alternative: Diễn giải trực tiếp thành người có tội được cứu hoặc ‘con chiên lạc của tôi’.
  rationale: Câu này vẫn đang kể dụ ngôn; bản dịch không đưa phần giải nghĩa thần học của văn cảnh vào chính hình ảnh, đồng thời giữ nét nhấn của cấu trúc Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘con chiên’ theo văn phong Kinh Thánh quen thuộc; câu nói trực tiếp tự nhiên, không thêm cách diễn giải giáo phái.
