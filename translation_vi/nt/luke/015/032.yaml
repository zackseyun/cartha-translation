revisions:
- from: Nhưng chúng ta cần phải ăn mừng và vui mừng[a], vì em con đây đã chết mà nay sống lại[b], đã mất mà nay lại tìm thấy.
  to: Nhưng phải ăn mừng và vui mừng[a], vì em con đây đã chết mà nay sống lại[b], đã mất mà nay được tìm thấy.
  rationale: Bỏ “chúng ta” để duy trì cấu trúc vô nhân xưng của ἔδει, và đổi “nay lại tìm thấy” thành “nay được tìm thấy” để phản ánh rõ thể bị động của εὑρέθη. Chú thích a được viết lại để chỉ nêu phương án “phải lẽ”, đúng với phạm vi thay thế từ vựng. Các hình ảnh và quan hệ gia đình của nguyên văn được giữ nguyên.
