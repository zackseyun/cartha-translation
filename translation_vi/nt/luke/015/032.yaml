    issue: Thêm chủ ngữ “chúng ta” cho ἔδει.
    rationale: ἔδει là cấu trúc vô nhân xưng, “cần/phải” không nêu chủ thể. Dù ngữ cảnh có thể hàm ý những người trong nhà, việc thêm “chúng ta” thu hẹp hoặc xác định chủ thể hơn nguyên văn.
  - severity: medium
    issue: “Nay lại tìm thấy” không giữ rõ nghĩa bị động của εὑρέθη.
    rationale: εὑρέθη nghĩa là “được tìm thấy/bị tìm thấy”. Trong tiếng Việt, cần có “được” để câu tự nhiên và tránh biến động từ thành cách nói thiếu chủ thể.
  - severity: medium
    issue: Chú thích a thêm nội dung không có trong phương án thay thế và đặt dấu neo chưa phù hợp với nội dung chú thích.
    rationale: Phương án thay thế của ἔδει là “phải lẽ/thích đáng”, không phải một lời giải thích “vì đó là điều phải lẽ”. Chú thích nên trình bày trực tiếp lựa chọn dịch thay thế cho cả cụm.
