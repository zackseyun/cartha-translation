id: LUK.15.32
reference: Luke 15:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: vi
  text: Nhưng phải ăn mừng và vui mừng[a], vì em con đây đã chết mà nay sống lại[b], đã mất mà nay được tìm thấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “phải lẽ ăn mừng và vui mừng.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “đã sống” hoặc “đã sống lại”; trong dụ ngôn, cách nói này diễn tả sự phục hồi, đối lập với tình trạng “đã chết”.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: ăn mừng
  rationale: Diễn đạt tự nhiên sắc thái vui tiệc trong bối cảnh yến tiệc của dụ ngôn, rõ hơn cách dịch sát chữ nhưng kém thông dụng như “vui hưởng”.
- source_word: χαρῆναι
  choice: vui mừng
  rationale: Giữ lại vế diễn đạt niềm vui thứ hai, gần nghĩa nhưng không đồng nhất với “ăn mừng”.
- source_word: ἔδει
  choice: chúng ta cần phải
  rationale: Thể hiện sự cần thiết về hoàn cảnh và đạo lý của động từ vô nhân xưng; “chúng ta” được suy ra tự nhiên từ lời người cha về việc cùng ăn mừng, nhưng không làm yếu sắc thái cần thiết.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: em con đây
  rationale: Trong ngữ cảnh, người được nói đến là em trai của người con cả. “Đây” giữ sức nhấn của οὗτος, còn “em con” nhắc thẳng đến mối quan hệ gia đình theo cách nói tiếng Việt tự nhiên.
- source_word: νεκρὸς ἦν
  choice: đã chết
  rationale: Giữ nguyên hình ảnh chết, không diễn giải thành xa cách hay hư mất dù trong dụ ngôn hình ảnh này mang ý nghĩa phục hồi.
- source_word: ἔζησεν
  choice: nay sống lại
  rationale: Động từ Hy Lạp theo nghĩa đen là “đã sống”; đặt đối lập với “đã chết” nên tiếng Việt tự nhiên là “sống lại”. “Nay” làm rõ sự đổi thay hiện tại mà không biến câu thành một tuyên bố kỹ thuật về sự phục sinh thân thể.
- source_word: ἀπολωλὼς
  choice: đã mất
  rationale: Phân từ hoàn thành chỉ tình trạng bị mất; cách nói này duy trì mô-típ mất–tìm thấy xuyên suốt chương 15.
- source_word: εὑρέθη
  choice: nay lại tìm thấy
  rationale: Giữ thể bị động về ý nghĩa và diễn đạt kết quả phục hồi hiện tại; trong tiếng Việt, cấu trúc “lại tìm thấy” tự nhiên dù lược “được”.
theological_decisions:
- issue: Có nên giải thích ἔζησεν như sự phục hồi thay vì giữ hình ảnh chết–sống hay không
  choice: Giữ hình ảnh “đã chết mà nay sống lại”.
  alternative: Diễn giải là “đã xa cách mà nay được phục hồi”.
  rationale: Nguyên văn dùng trực tiếp cặp chết–sống trong lời kết của người cha. Bản dịch giữ sức mạnh và độ mở thần học của hình ảnh, để ngữ cảnh dụ ngôn cho thấy ý nghĩa phục hồi thay vì thay hình ảnh bằng lời giải thích.
- issue: Sắc thái của ἔδει
  choice: “cần phải”, nhấn mạnh sự cần thiết.
  alternative: “thật phải lẽ”, nhấn mạnh điều thích hợp.
  rationale: ἔδει có thể bao hàm cả sự cần thiết lẫn điều thích đáng. “Cần phải” giữ lực mạnh hơn của từ, còn khả năng hiểu là “phải lẽ” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “em con” vì người cha đang nói với người con cả về người em trai, đồng thời dùng “đây” để giữ sự nhấn mạnh vào quan hệ anh em. Hai động từ vui mừng được giữ riêng thành “ăn mừng và vui mừng”.
