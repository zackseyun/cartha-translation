  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: vi
  text: Anh ấy gọi một người đầy tớ đến và hỏi xem những điều đó có thể là gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “chuyện này có ý nghĩa gì?” Tiếng Hy Lạp sát nghĩa hơn là: “những điều đó có thể là gì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... lại
  rationale: Phân từ aorist trung của προσκαλέομαι diễn tả việc gọi một người đến với mình trước khi hỏi; “gọi ... lại” tự nhiên trong tiếng Việt và giữ được trình tự hành động.
- source_word: παίδων
  choice: đầy tớ
  rationale: παῖς có thể chỉ đứa trẻ hoặc đầy tớ, nhưng trong bối cảnh gia đình này, người được gọi để giải thích cuộc ăn mừng hợp lý nhất là một đầy tớ.
- source_word: ἐπυνθάνετο
  choice: hỏi
  rationale: Thể imperfect trung của πυνθάνομαι chỉ việc tìm hiểu bằng cách hỏi. “Hỏi” là cách diễn đạt tự nhiên; ngữ cảnh không đòi hỏi phải nhấn mạnh tiến trình kéo dài.
- source_word: τί ἂν εἴη ταῦτα
  choice: xem những việc ấy là gì
  rationale: Cách dịch này giữ số nhiều của ταῦτα và sắc thái thăm dò của câu hỏi gián tiếp có ἄν với optative, đồng thời vẫn tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” theo chủ thể là người anh trong mạch truyện; “đầy tớ” phản ánh bối cảnh gia đình và tránh nghĩa dễ gây nhầm là “đứa trẻ”.
