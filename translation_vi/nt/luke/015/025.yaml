  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: vi
  text: Người con trai lớn hơn của ông đang ở ngoài đồng. Khi đang về và đến gần nhà, anh nghe âm nhạc và nhảy múa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu là: “tiếng nhạc cụ và những nhóm người nhảy múa.” Các từ Hy Lạp có thể chỉ cụ thể hơn phần trình diễn nhạc cụ và các nhóm múa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: đang ở
  rationale: δέ đánh dấu sự chuyển tiếp trong câu chuyện; tiếng Việt không cần dịch bằng một liên từ riêng. Dạng “đang ở” diễn đạt tự nhiên hoàn cảnh nền.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: người con trai lớn của ông
  rationale: πρεσβύτερος là dạng so sánh, chỉ người con lớn hơn trong sự đối lập với người con thứ, không nhất thiết có nghĩa là con cả trong một gia đình nhiều con.
- source_word: ἐν ἀγρῷ
  choice: ở ngoài đồng
  rationale: ἀγρός chỉ đồng ruộng hoặc khu đất canh tác; “ngoài đồng” là cách nói tự nhiên trong tiếng Việt và thể hiện việc anh đang ở xa nhà.
- source_word: ὡς ἐρχόμενος
  choice: khi trở về
  rationale: Cụm này mô tả anh đang trên đường đến; trong ngữ cảnh từ ngoài đồng về nhà, “khi trở về” tự nhiên mà không làm thay đổi hướng chuyển động.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: đến gần nhà
  rationale: Diễn đạt trực tiếp nghĩa của ἐγγίζω là tiến đến gần, với τῇ οἰκίᾳ làm đích tiếp cận.
- source_word: ἤκουσεν
  choice: anh nghe
  rationale: Dịch thì aorist tường thuật bằng động từ đơn giản, không thêm sắc thái “bắt đầu nghe” vốn không bắt buộc.
- source_word: συμφωνίας
  choice: tiếng nhạc
  rationale: συμφωνία ở đây chỉ âm nhạc, có thể đặc biệt là nhạc khí; “tiếng nhạc” phù hợp với động từ “nghe” và tránh nghĩa hiện đại sai lệch của “giao hưởng”.
- source_word: χορῶν
  choice: tiếng nhảy múa
  rationale: χορός có thể chỉ sự nhảy múa hoặc nhóm người múa. “Tiếng nhảy múa” phối hợp tự nhiên với “nghe tiếng nhạc”, đồng thời chú thích giữ lại nghĩa cụ thể hơn là các vũ công hay nhóm múa.
