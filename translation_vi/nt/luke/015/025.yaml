  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Tách câu tại dấu chấm phẩy của bản Hy Lạp để câu tiếng Việt tự nhiên hơn; đại từ “ông/anh” dựa trên các vai đã được xác lập trong ngữ cảnh dụ ngôn.
