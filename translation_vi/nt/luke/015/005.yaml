source:
  edition: SBLGNT
  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: vi
  text: Khi tìm thấy nó[a], người ấy vui mừng đặt nó lên vai mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là con chiên bị lạc được nói đến trong câu trước.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: Khi tìm thấy nó
  rationale: Phân từ bất định chủ động được diễn đạt tự nhiên bằng mệnh đề thời gian. Tân ngữ “nó” được bổ sung theo ngữ cảnh gần, chỉ con chiên bị lạc.
- source_word: ἐπιτίθησιν
  choice: đặt
  rationale: Động từ hiện tại chủ động diễn tả hành động chính; “đặt ... lên” vừa tự nhiên vừa giữ được hình ảnh người chăn nâng con chiên lên vai.
- source_word: ἐπὶ τοὺς ὤμους
  choice: lên vai
  rationale: ἐπί với đối cách chỉ chuyển động và sự đặt lên trên. Tiếng Việt thường dùng danh từ tập hợp “vai” ở số ít, không làm mất ý hai vai của dạng số nhiều Hy Lạp.
- source_word: αὐτοῦ
  choice: mình
  rationale: Đại từ sở hữu quy chiếu về chủ thể là người chăn. “Vai mình” tự nhiên và tránh sự mơ hồ mà “vai người ấy” có thể gây ra.
- source_word: χαίρων
  choice: vui mừng
  rationale: Phân từ hiện tại diễn tả trạng thái đi kèm hành động đặt con chiên lên vai; cách dịch này giữ rõ niềm vui mà không biến nó thành một nhận định giải thích.
theological_decisions:
- issue: Bổ sung tân ngữ hàm ẩn sau εὑρὼν
  choice: Thêm “nó” để chỉ con chiên bị lạc trong ngữ cảnh trước.
  alternative: 'Lược tân ngữ: “Khi tìm thấy, người ấy...”'
  rationale: Bản Hy Lạp để tân ngữ hàm ẩn vì ngữ cảnh đã rõ. Tiếng Việt có thể lược bỏ, nhưng thêm “nó” giúp câu rõ ràng và không đưa thêm nội dung thần học.
- issue: Quan hệ cú pháp của χαίρων
  choice: Đặt “vui mừng” trước động từ chính để diễn tả trạng thái đi kèm của người chăn.
  alternative: “đặt nó lên vai mình, lòng đầy vui mừng” hoặc “vừa vui mừng vừa đặt...”
  rationale: Cách chọn giữ χαίρων gắn với chủ thể và hành động chính, đồng thời không xác định quá mức đây chỉ là cách thức, thời gian hay nguyên nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy” để nối với chủ thể giả định trong dụ ngôn; dùng “vai mình” theo lối diễn đạt tự nhiên của tiếng Việt.
