  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: vi
  text: 'Người ấy đáp: “Em cậu đã về, và cha cậu đã làm thịt con bê đã vỗ béo, vì ông đã nhận lại em cậu bình an vô sự[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “khỏe mạnh.” Từ Hy Lạp ὑγιαίνοντα có thể chỉ tình trạng khỏe mạnh, lành lặn hoặc, trong ngữ cảnh này, bình an vô sự.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: đã về
  rationale: Động từ diễn tả việc đã đến và hiện đang có mặt; trong bối cảnh người em trở về nhà, “đã về” tự nhiên và giữ được kết quả hiện tại.
- source_word: ἔθυσεν
  choice: đã làm thịt
  rationale: Trong bối cảnh chuẩn bị tiệc mừng, “làm thịt” diễn tả việc giết con vật để ăn mà không hàm ý đây là một lễ hiến tế nghi thức.
- source_word: μόσχον τὸν σιτευτόν
  choice: con bê béo
  rationale: Cụm từ chỉ con bê được vỗ béo, dành cho một dịp đặc biệt; “con bê béo” ngắn gọn, tự nhiên và quen thuộc trong tiếng Việt.
- source_word: ὑγιαίνοντα
  choice: bình an vô sự
  rationale: Phân từ này có nghĩa đen là đang khỏe mạnh, lành lặn; trong ngữ cảnh người con đi xa trở về, “bình an vô sự” truyền đạt tự nhiên ý an toàn và nguyên vẹn, đồng thời phương án nghĩa hẹp hơn được ghi ở chú thích.
- source_word: ἀπέλαβεν
  choice: đã đón ... trở về
  rationale: Động từ mang sắc thái nhận lại người đã mất hoặc vắng mặt; cách diễn đạt này giữ ý phục hồi và phù hợp tự nhiên với cảnh người cha đón con trở về.
- source_word: ὁ ἀδελφός σου
  choice: em cậu
  rationale: Danh từ Hy Lạp tự nó có nghĩa là anh hoặc em trai, nhưng ngữ cảnh xác định đây là người em của người con cả; tiếng Việt cần biểu thị quan hệ tuổi tác.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: 'Người ấy đáp:'
  rationale: δέ là từ nối nhẹ, còn ὅτι giới thiệu lời nói trực tiếp. “Người ấy đáp” rõ ràng, tự nhiên và phù hợp với câu hỏi ở câu trước.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “cậu” phù hợp với lời người đầy tớ nói với người con cả; “em” được dùng theo ngữ cảnh để làm rõ quan hệ mà tiếng Hy Lạp không mã hóa trực tiếp.
