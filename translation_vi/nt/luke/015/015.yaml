  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: vi
  text: Rồi anh đi nương nhờ một người dân trong xứ ấy[a]. Người ấy sai anh đến các cánh đồng của mình để chăn heo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “gắn mình với” hay “bám lấy”. Động từ Hy Lạp gợi ý việc tự gắn chặt, thậm chí lệ thuộc, vào một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: đi
  rationale: Phân từ quá khứ đóng vai trò trạng ngữ, diễn tả hành động đi trước hành động chính; tiếng Việt có thể diễn đạt tự nhiên bằng “đi”.
- source_word: ἐκολλήθη
  choice: làm thuê cho
  rationale: Động từ chỉ việc gắn mình chặt với một người, trong ngữ cảnh này hàm ý lệ thuộc để kiếm sống. “Làm thuê cho” truyền đạt quan hệ thực tế một cách tự nhiên, còn chú thích giữ lại hình ảnh và sắc thái sát nghĩa của tiếng Hy Lạp.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: một người dân
  rationale: πολίτης là thành viên hay công dân của một cộng đồng. “Một người dân” tự nhiên hơn “một công dân” trong văn kể chuyện tiếng Việt mà không làm thay đổi địa vị của nhân vật.
- source_word: τῆς χώρας ἐκείνης
  choice: trong xứ ấy
  rationale: χώρα có thể chỉ xứ, vùng hay miền; “xứ ấy” vừa phù hợp bối cảnh kể chuyện vừa liên kết với nơi xa được nói đến trước đó.
- source_word: ἔπεμψεν αὐτὸν
  choice: Người đó sai anh
  rationale: πέμπω cơ bản là sai hay phái đi. “Sai anh” thể hiện rõ chủ thể là người dân vừa nhắc đến và quan hệ phụ thuộc trong ngữ cảnh.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: ra đồng
  rationale: ἀγροί ở số nhiều chỉ các cánh đồng hay đất nông nghiệp của người ấy. “Ra đồng” là cách nói Việt tự nhiên; quyền sở hữu đã rõ từ chủ thể của động từ “sai”.
- source_word: βόσκειν χοίρους
  choice: chăn heo
  rationale: βόσκω có nghĩa cho ăn, chăn hoặc cho ăn cỏ. Với heo, “chăn heo” là thành ngữ tự nhiên và bao hàm việc chăm nom, cho ăn; “heo” là từ hiện đại, phổ thông.
theological_decisions:
- issue: Sắc thái lệ thuộc trong ἐκολλήθη
  choice: Diễn đạt trong câu chính là “làm thuê cho” và ghi chú nghĩa đen cùng sắc thái lệ thuộc.
  alternative: “bám lấy” hoặc “gắn mình với”
  rationale: Nguyên văn không dùng động từ chuyên biệt có nghĩa “thuê”, nên chú thích bảo toàn độ căng giữa nghĩa đen “gắn/bám” và quan hệ lao động được ngữ cảnh gợi ra, tránh biến một cách giải thích thành nghĩa duy nhất.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” để chỉ người con trong mạch truyện, “người đó” để tránh đại từ nhập nhằng, và “heo” là cách gọi thông dụng trong tiếng Việt hiện đại.
