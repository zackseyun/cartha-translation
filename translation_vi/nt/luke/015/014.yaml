id: LUK.15.14
reference: Luke 15:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: vi
  text: Nhưng sau khi anh ta đã tiêu hết mọi thứ, một nạn đói dữ dội xảy ra khắp miền ấy, và anh ta bắt đầu lâm cảnh thiếu thốn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: sau khi anh ta đã tiêu hết mọi thứ
  rationale: Phân từ bất định trong cấu trúc sở hữu cách độc lập diễn tả thời điểm xảy ra trước hành động chính. “Tiêu hết” phản ánh δαπανάω mà không tự thêm sắc thái phung phí vốn không bắt buộc trong chính câu này.
- source_word: δέ
  choice: Nhưng
  rationale: Đánh dấu bước ngoặt tương phản trong câu chuyện, từ lúc còn tiền sang cảnh khủng hoảng.
- source_word: ἐγένετο
  choice: xảy ra
  rationale: Với λιμός, động từ này chỉ sự xuất hiện của một biến cố; “xảy ra” tự nhiên trong tiếng Việt.
- source_word: λιμὸς ἰσχυρά
  choice: một nạn đói dữ dội
  rationale: ἰσχυρά nhấn mạnh mức độ nghiêm trọng của nạn đói; “dữ dội” vừa rõ nghĩa vừa tự nhiên.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: khắp miền ấy
  rationale: κατά với đối cách có thể diễn tả sự trải rộng trên một địa bàn. “Khắp miền ấy” giữ ý phạm vi bao quát, còn χώρα trong ngữ cảnh này có thể chỉ miền hoặc vùng đất.
- source_word: ἤρξατο ὑστερεῖσθαι
  choice: bắt đầu lâm cảnh thiếu thốn
  rationale: Giữ sắc thái khởi đầu của ἤρξατο và tình trạng túng thiếu của ὑστερεῖσθαι bằng cách diễn đạt tự nhiên, trang trọng vừa phải.
- source_word: αὐτὸς
  choice: anh ta
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp; “anh ta” duy trì chủ thể và phù hợp mạch kể về người con.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Không thêm đánh giá đạo đức như “phung phí” vào δαπανάω, đồng thời giữ diễn tiến từ cạn tiền đến nạn đói rồi thiếu thốn.
