review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng hai nhóm người, mục đích “để nghe Ngài,” và không thêm diễn giải xã hội hay thần học. Tuy nhiên, “đều đang đến gần” trong tiếng Việt hiện đại, khi đứng riêng không có mốc quá khứ, thường được hiểu là hành động đang diễn ra ở hiện tại. Thì chưa hoàn thành với phân từ hiện tại trong tiếng Hy Lạp đặt cảnh trong quá khứ và có thể gợi diễn tiến hoặc sự lặp lại; tiếng Việt nên để thì quá khứ do ngữ cảnh trần thuật đảm nhiệm và bảo tồn sắc thái bằng chú thích.
  naturalness: Câu chính sẽ tự nhiên hơn nếu dùng “đều đến gần Ngài” thay vì “đều đang đến gần Ngài.” Cách “Tất cả ... đều” phù hợp, rõ nghĩa và có sắc thái trang trọng vừa phải. Chú thích hiện tại dùng “vẫn thường” hơi thêm ý tiếp diễn từ trước (“vẫn”) không có trong nguyên văn.
  terminology: “Những người thu thuế,” “những người tội lỗi,” và “Ngài” đều phù hợp với lối dùng Kinh Thánh tiếng Việt hiện đại. Không cần thay tên hay mở rộng “người tội lỗi” thành một phân loại xã hội cụ thể.
  issues:
  - severity: medium
    issue: “đều đang đến gần” dễ chuyển khung thời gian sang hiện tại.
    rationale: Ngữ cảnh Hy Lạp là quá khứ qua Ἦσαν; tiếng Việt không bắt buộc đánh dấu thì trong câu trần thuật, nhưng “đang” không kèm ngữ cảnh quá khứ thường được đọc là hiện tại.
  - severity: low
    issue: Chú thích “vẫn thường đến gần” thêm sắc thái “vẫn.”
    rationale: Kết cấu Hy Lạp có thể gợi hành động liên tục hoặc lặp lại, nhưng không khẳng định sự tiếp diễn từ một thời điểm trước đó theo nghĩa “vẫn.”
  revised_text: Tất cả những người thu thuế và những người tội lỗi đều đến gần Ngài để nghe Ngài[a].
