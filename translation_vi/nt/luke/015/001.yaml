- from: Tất cả những người thu thuế và những người tội lỗi đều đang đến gần Ngài để nghe Ngài[a].
  to: Tất cả những người thu thuế và những người tội lỗi đều đến gần Ngài để nghe Ngài[a].
  rationale: Bỏ “đang” khỏi câu chính để tránh một cách đọc hiện tại không chủ ý trong tiếng Việt độc lập, đồng thời giữ sắc thái chưa hoàn thành và độ mở giữa diễn tiến với lặp lại trong chú thích. Việc này không thay đổi các đối tượng, hành động, hay mục đích được nêu trong nguyên văn.
  reviewer_model: gpt-5.6-terra
