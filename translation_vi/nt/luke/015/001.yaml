  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: vi
  text: Tất cả những người thu thuế và những người tội lỗi đều đến gần Ngài để nghe Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều đang đến gần Ngài” hoặc “đều thường đến gần Ngài.” Kết cấu tiếng Hy Lạp gợi một hành động đang diễn ra hoặc thường xuyên lặp lại trong quá khứ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ … ἐγγίζοντες
  choice: đều đang đến gần
  rationale: Kết cấu περιφραστικός gồm động từ ở thì chưa hoàn thành và phân từ hiện tại diễn tả hành động đang tiếp diễn hoặc thường xuyên lặp lại trong quá khứ. Tiểu từ δέ chỉ chuyển mạch nhẹ nên không cần thêm một trạng từ thời gian vốn không có trong nguyên văn.
- source_word: πάντες
  choice: Tất cả … đều
  rationale: Cặp từ hô ứng tự nhiên trong tiếng Việt giữ được sự nhấn mạnh của πάντες đối với cả hai nhóm được nêu.
- source_word: οἱ τελῶναι
  choice: những người thu thuế
  rationale: Cách gọi rõ ràng, thông dụng cho những người thu các khoản thuế và nguồn thu dưới chính quyền đương thời.
- source_word: οἱ ἁμαρτωλοὶ
  choice: những người tội lỗi
  rationale: Giữ nguyên phạm trù xã hội-tôn giáo của nguyên văn, không diễn giải thêm họ là những người bị ruồng bỏ hay phạm tội tai tiếng.
- source_word: ἀκούειν αὐτοῦ
  choice: để nghe Ngài
  rationale: Động từ nguyên mẫu nêu mục đích của việc đến gần; “nghe” giữ nghĩa rộng của ἀκούω mà không buộc phải diễn giải thành nghe lời hay tiếp nhận lời dạy.
theological_decisions:
- issue: Sắc thái xã hội-tôn giáo của cặp “người thu thuế và người tội lỗi”
  choice: Giữ nguyên hai nhóm được nêu trong nguyên văn.
  alternative: “người thu thuế và những người bị xã hội ruồng bỏ khác” hoặc “người thu thuế và những kẻ tội lỗi khét tiếng”
  rationale: Những cách diễn giải mở rộng sẽ xác định trước địa vị xã hội hoặc mức độ tai tiếng mà câu Hy Lạp không nói rõ, làm giảm căng thẳng vốn có của trình thuật.
- issue: Tính tiếp diễn hay lặp lại của hành động đến gần
  choice: Dùng “đang đến gần” và ghi chú khả năng hiểu là hành động thường xuyên diễn ra.
  alternative: “thường đến gần”
  rationale: Kết cấu Hy Lạp cho thấy diễn tiến đang tiếp tục nhưng không tự nó quyết định tuyệt đối giữa một cảnh đang diễn ra và hành động lặp lại; bản dịch chính và chú thích cùng bảo tồn độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” theo mạch văn chỉ Đức Giê-su; không chèn tên riêng vào chỗ nguyên văn dùng đại từ. Cấu trúc “Tất cả … đều” tự nhiên trong tiếng Việt và giữ trọng tâm của câu.
