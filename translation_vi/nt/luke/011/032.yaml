id: LUK.11.32
reference: Luke 11:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: vi
  text: Những người đàn ông ở Ni-ni-ve sẽ đứng dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn trước lời rao giảng của Giô-na. Kìa, tại đây có điều lớn hơn Giô-na.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại đây có Đấng lớn hơn Giô-na” hoặc “tại đây có điều vượt hơn Giô-na.” Tiếng Hy Lạp dùng dạng trung tính (“điều lớn hơn/nhiều hơn”), nên có thể hướng đến thực tại lớn hơn đang hiện diện, chứ không chỉ là so sánh giữa hai cá nhân.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Những người đàn ông thành Ni-ni-ve
  rationale: Giữ rõ danh từ giống đực số nhiều ἄνδρες, đồng thời diễn đạt Νινευῖται tự nhiên trong tiếng Việt là người thuộc thành Ni-ni-ve.
- source_word: ἀναστήσονται
  choice: sẽ đứng dậy
  rationale: Giữ hình ảnh cụ thể của ἀνίστημι trong bối cảnh phán xét cánh chung mà không giải thích quá mức thành một thuật ngữ chuyên biệt về sự sống lại.
- source_word: ἐν τῇ κρίσει
  choice: trong cuộc phán xét
  rationale: κρίσις ở đây chỉ sự kiện xét xử; thêm 'cuộc' giúp câu tiếng Việt tự nhiên và trang trọng.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: cùng với thế hệ này
  rationale: Thể hiện quan hệ đồng hiện/đồng hành của μετά với sở hữu cách và giữ nguyên thành ngữ 'thế hệ này'.
- source_word: κατακρινοῦσιν αὐτήν
  choice: sẽ kết án thế hệ ấy
  rationale: κατακρίνω có nghĩa mạnh là kết án. Lặp lại 'thế hệ ấy' giúp tiếng Việt rõ đối tượng hơn đại từ và tránh nhập nhằng.
- source_word: μετενόησαν
  choice: đã ăn năn
  rationale: Trong bối cảnh lời rao giảng tiên tri, μετανοέω diễn tả sự ăn năn về đạo đức và tâm linh, không chỉ là đổi ý.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: khi nghe lời rao giảng của Giô-na
  rationale: 'Diễn đạt tự nhiên quan hệ đáp ứng: họ ăn năn trước lời Giô-na công bố. ''Lời rao giảng'' truyền đạt κήρυγμα rõ ràng cho độc giả phổ thông.'
- source_word: ἰδοὺ
  choice: Và kìa
  rationale: Giữ chức năng nhấn mạnh, hướng sự chú ý của ἰδού bằng lối diễn đạt trang trọng nhưng vẫn dễ hiểu.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: tại đây có điều lớn hơn Giô-na
  rationale: Dùng 'điều' để phản ánh dạng trung tính πλεῖον và giữ mở khả năng lời này nói đến thực tại lớn hơn hiện diện nơi Chúa Giê-xu và sứ vụ của ngài, chứ không chỉ là một sự so sánh cá nhân.
theological_decisions:
- issue: Đối tượng quy chiếu và sắc thái của πλεῖον Ἰωνᾶ
  choice: tại đây có điều lớn hơn Giô-na
  alternative: tại đây có Đấng lớn hơn Giô-na; tại đây có điều vượt hơn Giô-na
  rationale: Dạng trung tính πλεῖον được giữ bằng 'điều', không tự ý chuyển thành danh xưng giống đực. Cách dịch vẫn để Chúa Giê-xu trong tầm nhìn nhưng bảo toàn khả năng câu nói bao hàm cả con người, sứ vụ và thực tại lớn hơn đang hiện diện nơi ngài.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng tên riêng quen thuộc 'Ni-ni-ve' và 'Giô-na'. Cấu trúc được làm tự nhiên cho tiếng Việt nhưng vẫn giữ hình ảnh xét xử, sự ăn năn và nét mơ hồ có chủ ý của πλεῖον.
