revisions:
- from: Những người đàn ông thành Ni-ni-ve sẽ đứng dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn khi nghe lời rao giảng của Giô-na. Và kìa, tại đây có điều lớn hơn Giô-na.[a]
  to: Những người đàn ông ở Ni-ni-ve sẽ đứng dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn trước lời rao giảng của Giô-na. Kìa, tại đây có điều lớn hơn Giô-na.[a]
  rationale: Sửa cách gọi người Ni-ni-ve cho tự nhiên; thay «khi nghe» bằng «trước» để không thêm hành động không được nêu trong bản gốc; và điều chỉnh chú thích để bảo toàn tính mở của dạng trung tính πλεῖον. Các yếu tố ngữ nghĩa chính còn lại được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát câu Hy Lạp: giữ được chủ ngữ nam giới Ni-ni-ve, bối cảnh phán xét, động từ mạnh «kết án», sự ăn năn, và sắc thái trung tính của πλεῖον. Tuy nhiên, «khi nghe lời rao giảng» thêm rõ hành động nghe, trong khi εἰς τὸ κήρυγμα diễn tả sự đáp ứng đối với/trước lời rao giảng mà không nêu hành động ấy.'
  naturalness: «Những người đàn ông thành Ni-ni-ve» không tự nhiên trong tiếng Việt hiện đại; «Những người đàn ông ở Ni-ni-ve» rõ nghĩa và trôi chảy hơn. «Kìa» cũng đủ chuyển tải ἰδού mà không cần liên từ «Và» sau dấu chấm.
  terminology: «Cuộc phán xét», «kết án», «ăn năn», «lời rao giảng», và «điều lớn hơn» đều phù hợp. Tên «Ni-ni-ve» và «Giô-na» nhất quán. Chú thích cần tránh diễn đạt quá xác quyết rằng dạng trung tính chỉ đến một thực tại nơi Chúa Giê-xu; nên nói đây là một khả năng diễn giải, như bản Hy Lạp để ngỏ.
  issues:
  - severity: medium
    issue: «khi nghe lời rao giảng của Giô-na» thêm ý hành động nghe
    rationale: Cụm εἰς τὸ κήρυγμα Ἰωνᾶ gắn với μετενόησαν, có nghĩa họ ăn năn trước/đáp lại lời công bố của Giô-na. Bản gốc không nói rõ «khi nghe».
  - severity: low
    issue: «Những người đàn ông thành Ni-ni-ve» gượng trong tiếng Việt
    rationale: «Thành Ni-ni-ve» thường bổ nghĩa địa điểm, không bổ nghĩa trực tiếp cho «người đàn ông». «Ở Ni-ni-ve» tự nhiên hơn mà vẫn giữ ἄνδρες.
  - severity: low
    issue: Chú thích nêu một diễn giải về πλεῖον hơi khẳng định
    rationale: Dạng trung tính quả thực cho phép cách hiểu rộng hơn một so sánh cá nhân, nhưng không tự nó xác định quy chiếu. Cần giữ đây là khả năng.
  revised_text: Những người đàn ông ở Ni-ni-ve sẽ đứng dậy trong cuộc phán xét cùng với thế hệ này và sẽ kết án thế hệ ấy, vì họ đã ăn năn trước lời rao giảng của Giô-na. Kìa, tại đây có điều lớn hơn Giô-na.[a]
