id: LUK.11.13
reference: Luke 11:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: vi
  text: Vậy, nếu anh em vốn xấu xa mà còn biết cách cho con cái mình những món quà tốt, thì Cha từ trời[a] lại càng ban Đức Thánh Linh[b] cho những người cầu xin Ngài biết bao!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản dịch viết “Cha trên trời của anh em” theo câu song song Ma-thi-ơ 7:11, nhưng bản Hy Lạp của Lu-ca ở đây nói “Cha từ trời.”
    reason: alternative_reading
  - marker: b
    text: Ma-thi-ơ 7:11 dùng “những điều tốt” tại vị trí Lu-ca dùng “Đức Thánh Linh”; cách dịch này giữ nguyên lời văn riêng của mỗi sách Phúc Âm.
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: vốn là người xấu
  rationale: Diễn đạt trạng thái đạo đức được phân từ mô tả, đồng thời để ngữ cảnh với “mà còn” thể hiện sắc thái nhượng bộ, không làm nhẹ ý nghĩa thành chỉ là bất toàn.
- source_word: οἴδατε ... διδόναι
  choice: biết cho
  rationale: Trong tiếng Việt, “biết cho” diễn đạt tự nhiên sự hiểu biết và khả năng thực hành mà động từ cùng nguyên mẫu truyền đạt.
- source_word: δόματα ἀγαθὰ
  choice: những món quà tốt
  rationale: “Món quà” giữ nghĩa cụ thể của δόματα, thay vì chuyển thành từ rộng hơn là “điều tốt”.
- source_word: τέκνοις ὑμῶν
  choice: con cái mình
  rationale: Cách nói tự nhiên trong quan hệ gia đình; “mình” quy chiếu về chủ thể số nhiều “anh em”.
- source_word: πόσῳ μᾶλλον
  choice: lại càng ... biết bao
  rationale: Tái hiện lập luận từ điều nhỏ đến điều lớn bằng cấu trúc so sánh và cảm thán tự nhiên trong tiếng Việt.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: Cha từ trời
  rationale: Giữ giới từ ἐξ, nghĩa là “từ”, và không thêm “của anh em” vốn không có trong bản Hy Lạp của Lu-ca.
- source_word: πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Chỉ Thần Linh thánh của Đức Chúa Trời trong ngữ cảnh này; cách viết hoa và danh xưng này rõ ràng, trang trọng, quen thuộc trong tiếng Việt.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: cho những người cầu xin Ngài
  rationale: Giữ cả ý nghĩa hiện tại/khái quát của phân từ và đại từ làm tân ngữ được nêu rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεῦμα ἅγιον
  choice: Đức Thánh Linh, tức Thần Linh thánh của Đức Chúa Trời
  alternative: một linh thánh
  rationale: Dù cụm từ không có mạo từ trong tiếng Hy Lạp, ngữ cảnh Lu-ca xác định đây là Thánh Linh do Cha ban, chứ không phải một linh nói chung.
- issue: Quan hệ với câu song song Ma-thi-ơ 7:11
  choice: 'Giữ cách nói riêng của Lu-ca: “Cha từ trời” và “Đức Thánh Linh”'
  alternative: Hài hòa thành “Cha trên trời của anh em” và “những điều tốt”
  rationale: Bản dịch theo sát câu Hy Lạp của Lu-ca, không đồng hóa lời văn với câu song song trong Ma-thi-ơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Anh em” phù hợp với lời Chúa Giê-su nói cùng các môn đồ và đám đông; “mà còn ... lại càng ... biết bao” làm rõ lập luận huống chi mà không biến câu thành mệnh đề phủ định. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
