language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: vi
  text: 'Nhưng Ngài phán: “Khốn cho các ông nữa, những chuyên gia về Luật pháp[a]! Vì các ông chất lên người ta những gánh nặng khó mang, còn chính các ông thì không hề chạm vào những gánh ấy, dù chỉ bằng một ngón tay[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chuyên gia về Luật pháp” chỉ người am hiểu Luật Do Thái, đặc biệt là Luật Môi-se; không phải luật sư dân sự theo nghĩa hiện đại.
    reason: lexical_clarification
  - marker: b
    text: 'Hoặc diễn đạt sát hình ảnh: “không chạm vào những gánh ấy bằng một ngón tay.” Hình ảnh nhấn mạnh rằng chính họ không bỏ ra dù chỉ một chút công sức nào đối với các gánh nặng họ đặt lên người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: những chuyên gia về Luật pháp
  rationale: Trong Lu-ca, từ này chỉ những người am hiểu Luật Môi-se, không phải luật sư dân sự theo nghĩa hiện đại. Cách dịch này nêu rõ đối tượng và tự nhiên trong tiếng Việt.
- source_word: οὐαί
  choice: Khốn cho
  rationale: Giữ sắc thái tuyên cáo phán xét mạnh mẽ của lời tiên tri, thay vì làm nhẹ thành một lời than tiếc.
- source_word: φορτίζετε
  choice: chất lên
  rationale: Giữ hình ảnh cụ thể về việc đặt tải nặng lên người khác và kết hợp tự nhiên với “gánh nặng”.
- source_word: ἀνθρώπους
  choice: người ta
  rationale: Diễn đạt nghĩa chỉ con người nói chung, không giới hạn ở nam giới.
- source_word: φορτία δυσβάστακτα
  choice: những gánh nặng khó mang
  rationale: Giữ ẩn dụ mang vác và không cường điệu δυσβάστακτα thành “không thể chịu nổi”.
- source_word: αὐτοὶ
  choice: chính các ông
  rationale: Thể hiện đại từ nhấn mạnh và sự tương phản giữa những người áp đặt gánh nặng với người phải mang chúng.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: một ngón tay
  rationale: Bảo tồn hình ảnh về mức nỗ lực tối thiểu trong nguyên văn.
- source_word: προσψαύετε
  choice: không đụng ... vào
  rationale: Giữ nghĩa cụ thể là chạm vào, thay vì đưa hàm ý “không giúp đỡ” trực tiếp vào chính văn.
- source_word: Καὶ ὑμῖν
  choice: cả các ông nữa
  rationale: 'Truyền đạt lực bổ sung của καί: lời khốn này cũng hướng đến một nhóm khác.'
theological_decisions:
- issue: Căn tính của νομικοῖς
  choice: Dịch là “những chuyên gia về Luật pháp”, chỉ các chuyên gia về Luật Do Thái.
  alternative: “các luật sư” hoặc “các thầy thông giáo”
  rationale: “Các luật sư” dễ bị hiểu là luật sư dân sự hiện đại, còn “các thầy thông giáo” có thể đồng nhất hai thuật ngữ không hoàn toàn tương đương. Cách chọn vừa chính xác vừa minh bạch.
- issue: Ý nghĩa của mệnh đề cuối
  choice: Giữ hình ảnh cụ thể “không đụng một ngón tay vào những gánh ấy”.
  alternative: “không hề giúp người ta mang các gánh ấy” hoặc “không nhấc một ngón tay để giúp”
  rationale: Nguyên văn nói đến việc không chạm vào gánh nặng dù chỉ bằng một ngón tay. Bản dịch giữ hình ảnh và không giải quyết thay người đọc liệu trọng tâm là không giúp đỡ, không chia sẻ hay không tự tuân giữ các đòi hỏi ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” và “các ông” để duy trì sự tôn trọng trong lời kể đồng thời thể hiện lời quở trách trực tiếp. Viết hoa “Luật pháp” để chỉ Luật Môi-se trong bối cảnh Do Thái.
