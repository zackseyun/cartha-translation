revisions:
- from: 'Nhưng Ngài phán: “Khốn cho cả các ông nữa, là những chuyên gia về Luật pháp[a]! Vì các ông chất lên người ta những gánh nặng khó mang, còn chính các ông thì không đụng một ngón tay vào những gánh ấy[b].”'
  to: 'Nhưng Ngài phán: “Khốn cho các ông nữa, những chuyên gia về Luật pháp[a]! Vì các ông chất lên người ta những gánh nặng khó mang, còn chính các ông thì không hề chạm vào những gánh ấy, dù chỉ bằng một ngón tay[b].”'
  rationale: Sửa đổi giới hạn ở độ tự nhiên và độ rõ cú pháp. Bản văn vẫn giữ “khốn cho”, ẩn dụ “chất” và “gánh nặng”, sự nhấn mạnh “chính các ông”, cùng hình ảnh không chạm bằng một ngón tay; không biến hàm ý giúp đỡ thành nội dung chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nội dung chính: lời khốn được mở rộng đến các chuyên gia về Luật, việc chất gánh nặng khó mang lên người khác, và sự tương phản nhấn mạnh rằng chính họ không chạm đến các gánh ấy dù chỉ bằng một ngón tay. Tuy nhiên, trật tự từ ở mệnh đề cuối cần điều chỉnh để tiếng Việt biểu thị rõ ‘bằng một ngón tay’ là phương tiện, tương ứng với cách ἑνὶ τῶν δακτύλων ὑμῶν bổ nghĩa cho προσψαύετε.'
  naturalness: “Khốn cho cả các ông nữa, là những…” hơi gượng trong lời gọi trực tiếp; bỏ “là” sẽ tự nhiên hơn. “Không đụng một ngón tay vào…” cũng có thể bị đọc như thể ‘một ngón tay’ là tân ngữ. Cách “không hề chạm vào …, dù chỉ bằng một ngón tay” vừa tự nhiên vừa giữ nguyên hình ảnh cụ thể của tiếng Hy Lạp.
  terminology: “Những chuyên gia về Luật pháp” là lựa chọn chính xác, tránh liên tưởng sai đến luật sư dân sự hiện đại. Viết hoa “Luật pháp” trong ngữ cảnh này có thể chỉ Luật Môi-se. “Khốn cho” giữ được lực tuyên cáo phán xét của οὐαί.
  issues:
  - severity: low
    issue: Cụm gọi trực tiếp “là những chuyên gia về Luật pháp” không tự nhiên sau dấu phẩy.
    rationale: Trong tiếng Việt hiện đại, “Khốn cho các ông nữa, những chuyên gia về Luật pháp!” rõ và tự nhiên hơn, đồng thời vẫn phản ánh đối tượng ở cách hô gọi của νομικοῖς.
  - severity: medium
    issue: Mệnh đề “không đụng một ngón tay vào những gánh ấy” chưa biểu thị rõ quan hệ cú pháp của “một ngón tay”.
    rationale: Nguyên văn nói họ không chạm vào các gánh nặng ‘bằng một ngón tay [của mình]’. Đưa cụm này thành “dù chỉ bằng một ngón tay” bảo toàn nghĩa và tránh mơ hồ tiếng Việt.
  - severity: low
    issue: Chú thích b dùng “góp lấy một chút công sức nào”, là lối nói chưa tự nhiên.
    rationale: Có thể diễn đạt rõ hơn là “không bỏ ra dù chỉ một chút công sức nào để đụng đến hoặc trợ giúp với các gánh nặng ấy”, mà vẫn phân biệt lời giải thích với chính văn.
