- from: 'Nhưng một số người trong họ nói: “Ông ấy nhờ Bê-ên-xê-bun[a], kẻ cai trị các quỷ, mà đuổi quỷ.”'
  to: 'Nhưng một số người trong số họ nói: “Ông ấy nhờ Bê-ên-xê-bun[a], kẻ cai trị các quỷ, mà đuổi quỷ.”'
  rationale: Chỉ thay “trong họ” bằng “trong số họ” để thể hiện rõ và tự nhiên hơn ý nghĩa bộ phận của ἐξ αὐτῶν. Các thành phần khác giữ nguyên vì phù hợp với nguyên văn và văn phong tiếng Việt hiện đại.
