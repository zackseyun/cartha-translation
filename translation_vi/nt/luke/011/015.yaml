id: LUK.11.15
reference: Luke 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: vi
  text: 'Nhưng một số người trong số họ nói: “Ông ấy nhờ Bê-ên-xê-bun[a], kẻ cai trị các quỷ, mà đuổi quỷ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng thường được gọi theo dạng truyền thống là Bê-ên-xê-búp.
    reason: Nêu dạng tên truyền thống quen thuộc trong khi bản chính theo dạng Βεελζεβούλ của văn bản Hy Lạp.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Nhưng một số người trong họ
  rationale: Giữ sắc thái tương phản của δὲ và ý nghĩa bộ phận của ἐξ αὐτῶν, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: εἶπον
  choice: nói
  rationale: Thì aorist trình bày lời buộc tội như một sự việc đơn giản; “nói” là cách dịch trực tiếp, tự nhiên.
- source_word: Ἐν Βεελζεβοὺλ
  choice: nhờ Bê-ên-xê-bun
  rationale: ἐν đi với tên riêng ở đây chỉ phương tiện hoặc quyền năng làm trung gian. “Nhờ” diễn đạt rõ lời cáo buộc rằng ông dùng quyền lực của Bê-ên-xê-bun.
- source_word: Βεελζεβοὺλ
  choice: Bê-ên-xê-bun
  rationale: Phiên âm theo dạng Βεελζεβούλ của bản Hy Lạp, thay vì âm truyền thống tương ứng với Beelzebub.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: kẻ cai trị các quỷ
  rationale: ἄρχων chỉ người có quyền cai trị; cách dịch này rõ nghĩa, hiện đại và không đưa thêm một hệ thống quỷ học ngoài câu văn.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: đuổi quỷ
  rationale: Diễn đạt tự nhiên trong tiếng Việt và giữ đúng nghĩa trừ quỷ của ἐκβάλλω cùng nghĩa trực tiếp của δαιμόνια.
theological_decisions:
- issue: Cách thể hiện danh xưng Βεελζεβούλ
  choice: Bê-ên-xê-bun
  alternative: Bê-ên-xê-búp
  rationale: Bản chính ưu tiên dạng tên trong văn bản Hy Lạp; dạng truyền thống quen thuộc được ghi ở chú thích để không đồng nhất hai dạng một cách âm thầm.
- issue: Cách dịch ἄρχων
  choice: kẻ cai trị các quỷ
  alternative: quỷ vương; thủ lĩnh các quỷ
  rationale: “Kẻ cai trị” thể hiện thẩm quyền được nói đến trong lời cáo buộc nhưng không thêm sắc thái tước vị hoặc mức độ tổ chức mà nguyên văn không xác định.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông ấy” phù hợp vì những người nói đang nhắc đến Chúa Giê-su ở ngôi thứ ba; cấu trúc “nhờ... mà...” làm rõ quan hệ phương tiện/quyền năng trong lời cáo buộc.
