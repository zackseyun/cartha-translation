  source_fidelity: 'Bản dịch truyền đạt chính xác cấu trúc điều kiện và kết luận của câu Hy Lạp: “nhờ ngón tay của Đức Chúa Trời” diễn đạt lực phương tiện của ἐν; “đuổi các quỷ” tương ứng tự nhiên với ἐκβάλλω τὰ δαιμόνια; và “đã đến với các ông” giữ được ý sự trị đến cách dứt khoát của ἔφθασεν ἐφ’ ὑμᾶς mà không áp đặt sắc thái phán xét mạnh hơn. Hình ảnh “ngón tay” được giữ nguyên, không bị thay bằng một diễn giải từ bản song hành trong Ma-thi-ơ.'
