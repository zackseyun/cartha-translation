id: LUK.11.20
reference: Luke 11:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: vi
  text: Nhưng nếu tôi nhờ ngón tay của Đức Chúa Trời[a] mà đuổi các quỷ, thì vương quốc Đức Chúa Trời đã đến với các ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng ngón tay của Đức Chúa Trời.” Đây là hình ảnh chỉ quyền năng trực tiếp của Đức Chúa Trời và gợi lại Xuất Ê-díp-tô Ký 8:19.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã vươn đến các ông” hoặc “đã bắt kịp các ông.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: nhờ ngón tay của Đức Chúa Trời
  rationale: “Nhờ” diễn đạt phương tiện hoặc tác nhân, đồng thời giữ nguyên hình ảnh sống động “ngón tay của Đức Chúa Trời” và âm vang Xuất Ê-díp-tô Ký 8:19.
- source_word: ἐκβάλλω
  choice: đuổi
  rationale: Đây là cách nói tự nhiên trong tiếng Việt về việc trục xuất quỷ, truyền đạt đúng động tác mạnh của động từ mà không dùng lối diễn đạt cổ.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Dịch trực tiếp danh từ số nhiều δαιμόνια; không đổi thành “các tà linh”, vốn tương ứng với một cách diễn đạt Hy Lạp khác.
- source_word: ἄρα
  choice: thì
  rationale: Trong cấu trúc “nếu… thì…”, từ này thể hiện tự nhiên kết luận suy ra từ mệnh đề điều kiện.
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: đã đến với các ông
  rationale: “Đã đến” giữ lực hoàn thành, dứt khoát của động từ; “với các ông” diễn đạt tự nhiên hướng đến những người nghe mà không mặc nhiên khiến câu mang sắc thái thù nghịch.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch rõ ràng, quen thuộc, giữ được cả ý niệm về lãnh vực vương quyền lẫn sự cai trị của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của “ngón tay Đức Chúa Trời”
  choice: Giữ nguyên như một hình ảnh chỉ quyền năng hoặc hành động trực tiếp của Đức Chúa Trời trong việc Chúa Giê-su đuổi quỷ.
  alternative: Diễn giải trực tiếp là Đức Thánh Linh dựa trên Ma-thi-ơ 12:28.
  rationale: Bản dịch giữ đúng cách diễn đạt riêng của Lu-ca cùng âm vang liên văn bản, không thay hình ảnh này bằng một lời giải nghĩa thần học.
- issue: Lực nghĩa của “vương quốc Đức Chúa Trời đã đến với các ông”
  choice: Khẳng định vương quốc Đức Chúa Trời đã thực sự hiện diện trong chức vụ của Chúa Giê-su.
  alternative: Chỉ nói đến vương quốc trong tương lai, hoặc hiểu hoàn toàn theo nghĩa phán xét là “đã bắt kịp các ông”.
  rationale: Dạng động từ Hy Lạp trong ngữ cảnh việc đuổi quỷ nói đến một sự đến nơi dứt khoát, nhưng bản dịch không áp đặt một hệ thống cánh chung chi tiết.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Đại từ “tôi” phù hợp lời nói trực tiếp trong ngữ cảnh; “các ông” chỉ nhóm người đang đối thoại và giữ sắc thái khoảng cách mà không thêm thái độ miệt thị.
