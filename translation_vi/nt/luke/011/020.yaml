  terminology: 'Các thuật ngữ nhất quán và phù hợp: “Đức Chúa Trời” cho θεός, “quỷ” cho δαιμόνια, và “vương quốc Đức Chúa Trời” cho ἡ βασιλεία τοῦ θεοῦ. Chú thích a nêu đúng lựa chọn tương đương “bằng,” bảo tồn hình ảnh và liên hệ Xuất Ê-díp-tô Ký 8:19; chú thích b phản ánh hợp lệ các khả năng “đã vươn đến”/“đã bắt kịp.” Các ký hiệu chú thích được đặt đúng tại các cụm liên quan.'
