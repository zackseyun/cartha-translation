id: LUK.11.30
reference: Luke 11:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: vi
  text: Vì Giô-na đã trở thành một dấu lạ cho người Ni-ni-ve thế nào, thì Con Người cũng sẽ là một dấu lạ cho thế hệ này như thế ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn hơn: “Vì như Giô-na đã trở thành một dấu lạ cho người Ni-ni-ve, thì Con Người cũng sẽ như vậy đối với thế hệ này”; ý “sẽ là một dấu lạ cho thế hệ này” được hiểu từ sự đối chiếu với Giô-na.'
    reason: Danh từ “dấu lạ” không được lặp lại trong vế thứ hai của bản Hy Lạp, nhưng được hàm ý bởi cấu trúc song song.
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Vì như
  rationale: Diễn đạt cả ý giải thích của γάρ và sự so sánh của καθώς bằng một cấu trúc tự nhiên trong tiếng Việt.
- source_word: ἐγένετο
  choice: đã trở thành
  rationale: Giữ sắc thái Giô-na đã trở nên hoặc đảm nhiệm vai trò một dấu lạ, thay vì chỉ nói ông 'là' một dấu lạ.
- source_word: Ἰωνᾶς
  choice: Giô-na
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τοῖς Νινευίταις
  choice: cho dân thành Ni-ni-ve
  rationale: Truyền đạt rõ đối tượng mà Giô-na trở thành dấu lạ; cách nói này tự nhiên hơn dạng danh xưng 'người Ni-ni-ve' trong câu tiếng Việt hiện đại.
- source_word: σημεῖον
  choice: một dấu lạ
  rationale: Trong văn cảnh Lu-ca, từ này chỉ một dấu hiệu có ý nghĩa mặc khải; 'dấu lạ' vừa quen thuộc trong ngôn ngữ Kinh Thánh vừa không thu hẹp nghĩa thành điềm báo hay bằng chứng.
- source_word: οὕτως ... καὶ
  choice: thì ... cũng
  rationale: Tạo cấu trúc tương liên tự nhiên 'như... thì... cũng', làm rõ sự song song giữa Giô-na và Con Người.
- source_word: ἔσται
  choice: sẽ là
  rationale: Phản ánh trực tiếp thì tương lai của εἰμί; danh từ vị ngữ 'một dấu lạ' được hiểu từ vế trước và được bổ sung để câu tiếng Việt sáng rõ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ cách dịch danh hiệu đã quen thuộc, đồng thời bảo toàn âm hưởng thần học và liên văn bản mà không diễn giải thành một nghĩa duy nhất.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: cho thế hệ này
  rationale: Giữ từ 'thế hệ' để phản ánh γενεά và truyền đạt quan hệ của dấu lạ đối với thế hệ đang được nói đến.
theological_decisions:
- issue: Vị ngữ được hiểu ngầm trong vế thứ hai
  choice: 'Bổ sung ''một dấu lạ'' trong câu chính: ''Con Người cũng sẽ là một dấu lạ cho thế hệ này.'''
  alternative: 'Dịch sát hình thức hơn: ''Con Người cũng sẽ như vậy đối với thế hệ này.'''
  rationale: Bản Hy Lạp không lặp lại σημεῖον trong vế thứ hai, nhưng cấu trúc so sánh cho thấy rõ danh từ này được hiểu ngầm. Bổ sung nó giúp tiếng Việt sáng nghĩa mà không đưa thêm một khẳng định thần học mới; chú thích ghi nhận hình thức rút gọn của nguyên văn.
- issue: Ý nghĩa của danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Giữ danh hiệu 'Con Người' mà không diễn giải thêm.
  alternative: Một người phàm; Đấng thuộc loài người
  rationale: Cụm từ vừa có nghĩa theo mặt chữ vừa mang tính danh hiệu trong các sách Tin Lành. Giữ 'Con Người' bảo toàn sự căng thẳng thần học và âm hưởng liên văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “như... thì... cũng” làm rõ phép so sánh; các tên riêng dùng dạng quen thuộc trong tiếng Việt. “Dấu lạ” và “Con Người” duy trì ngôn ngữ Kinh Thánh cần thiết mà không thêm nét giải thích mang tính hệ phái.
