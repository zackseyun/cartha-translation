id: LUK.11.33
reference: Luke 11:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: vi
  text: Không ai thắp một ngọn đèn rồi đặt nó vào nơi kín[a] hoặc dưới một thùng đong[b], nhưng đặt nó trên giá đèn, để người đi vào thấy ánh sáng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “hầm chứa”, “nơi bí mật” hoặc “chỗ giấu kín”; từ Hy Lạp κρύπτη có thể chỉ một nơi khuất, kể cả khu vực chứa đồ dưới đất.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp μόδιος chỉ một đơn vị đo đồ khô và cũng chỉ vật chứa dùng để đong; theo lối dịch truyền thống là “đấu” hoặc “giỏ đong”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Không ai
  rationale: Diễn đạt tự nhiên đại từ phủ định bất định và giữ nguyên tính khái quát của câu.
- source_word: λύχνον
  choice: đèn
  rationale: Chỉ chiếc đèn dầu cầm tay trong bối cảnh cổ đại; “đèn” là cách gọi chính xác và dễ hiểu, không thu hẹp thành nến.
- source_word: ἅψας
  choice: thắp đèn rồi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “rồi” thể hiện rõ trình tự một cách tự nhiên trong tiếng Việt.
- source_word: εἰς κρύπτην
  choice: vào chỗ kín
  rationale: κρύπτη có thể là nơi bị che khuất, nơi bí mật hoặc hầm chứa; “chỗ kín” giữ trọng tâm ở việc che giấu ánh sáng mà không xác định quá mức kiến trúc.
- source_word: τίθησιν
  choice: đặt
  rationale: Tương đương trực tiếp, tự nhiên với động từ chỉ việc đặt một vật vào vị trí nào đó.
- source_word: ὑπὸ τὸν μόδιον
  choice: dưới một cái thùng đong
  rationale: μόδιος vừa là đơn vị đo đồ khô vừa chỉ vật chứa dùng để đong; “thùng đong” giữ được chức năng của đồ vật và hình ảnh che phủ chiếc đèn.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: trên giá đèn
  rationale: λυχνία là vật kê hoặc giá để đặt đèn; “giá đèn” tránh khiến người đọc hiện đại hình dung cụ thể là chân nến.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt gọn và tự nhiên mục đích của việc đặt đèn trên giá.
- source_word: οἱ εἰσπορευόμενοι
  choice: những người đi vào
  rationale: Giữ sắc thái của phân từ hiện tại dùng như danh từ, chỉ những người đang hoặc thường đi vào.
- source_word: τὸ φέγγος
  choice: ánh sáng
  rationale: φέγγος chỉ ánh sáng hoặc độ sáng; trong hình ảnh chiếc đèn, “ánh sáng” là cách diễn đạt cụ thể và tự nhiên.
- source_word: βλέπωσιν
  choice: thấy
  rationale: Sau ἵνα, động từ ở thể giả định diễn tả mục đích; cấu trúc tiếng Việt “để… thấy” truyền đạt đầy đủ sắc thái này mà không cần thêm động từ tình thái.
theological_decisions:
- issue: Phạm vi nghĩa của κρύπτη
  choice: chỗ kín
  alternative: hầm chứa; nơi bí mật; chỗ giấu kín
  rationale: Câu nói nhấn mạnh sự phi lý của việc che giấu ánh sáng, chứ không phụ thuộc vào một kiểu phòng cụ thể. Cách dịch rộng giữ được hình ảnh mà không giải quyết thay sự đa nghĩa của từ Hy Lạp.
- issue: Cách thể hiện μόδιος
  choice: thùng đong
  alternative: giỏ đong; đấu; vật đong
  rationale: Cách dịch này cho người đọc hiện đại biết đây là vật chứa dùng để đong và có thể úp lên đèn. Chú thích bảo tồn thông tin rằng từ Hy Lạp cũng là tên một đơn vị đo đồ khô.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “thắp đèn rồi lại đặt” làm nổi bật sự trái lẽ thường trong hình ảnh. Hai dấu chú thích được đặt ngay sau các từ mà chúng giải thích, thay vì theo vị trí bị lệch trong lớp tham khảo tiếng Anh.
