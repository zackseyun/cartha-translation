revisions:
- from: Đèn của thân thể là mắt của con.[a] Khi mắt con sáng, cả thân thể con cũng đầy ánh sáng; nhưng khi mắt con xấu,[b] thân thể con cũng tối tăm.
  to: Mắt con là đèn của thân thể con.[a] Khi mắt con sáng, cả thân thể con cũng đầy ánh sáng; nhưng khi mắt con xấu,[b] thân thể con cũng tối tăm.
  rationale: Chỉnh cụm mở đầu để phản ánh đầy đủ sở hữu cách của nguyên văn và đạt trật tự từ tự nhiên hơn trong tiếng Việt. Chỉnh chú thích a để phân biệt chính xác tính từ ἁπλοῦς mô tả “mắt” với ngôn ngữ “ánh sáng” ở mệnh đề kết quả, đồng thời vẫn bảo tồn các khả năng nghĩa và tính mơ hồ của ẩn dụ. Không thay đổi hướng nghĩa của câu.
