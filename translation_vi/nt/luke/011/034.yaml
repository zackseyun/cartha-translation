source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: vi
  text: Mắt con là đèn của thân thể con.[a] Khi mắt con sáng, cả thân thể con cũng đầy ánh sáng; nhưng khi mắt con xấu,[b] thân thể con cũng tối tăm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp mô tả mắt ở đây cũng có thể mang nghĩa “khỏe mạnh,” “trong/sáng rõ,” hoặc, theo cách dịch truyền thống, “đơn nhất.” Trong ngữ cảnh này, “mắt sáng” diễn tả một con mắt hoạt động tốt, đối lập với mắt “xấu”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ác”. Từ Hy Lạp có thể chỉ điều xấu hoặc điều ác; ở đây nó có thể vừa gợi một con mắt khiếm khuyết vừa gợi cách nhìn lệch lạc về đạo đức.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: đèn
  rationale: Danh từ chỉ một ngọn đèn, tức nguồn sáng cụ thể, nên giữ nguyên hình ảnh ẩn dụ thay vì dịch thành khái niệm trừu tượng “ánh sáng”.
- source_word: σῶμα
  choice: thân thể
  rationale: Chỉ thân thể vật chất trong hình ảnh ẩn dụ về tình trạng nhận thức và đạo đức thuộc linh.
- source_word: ὀφθαλμός
  choice: mắt
  rationale: Giữ nghĩa trực tiếp của cơ quan thị giác, là nền tảng cho phép ẩn dụ trong câu.
- source_word: ὅταν ... ᾖ
  choice: khi ... sáng
  rationale: Cấu trúc với lối giả định diễn tả tình huống tổng quát; “khi” tự nhiên trong tiếng Việt và duy trì thế song song với vế đối lập.
- source_word: ἁπλοῦς
  choice: sáng
  rationale: Trong tiếng Việt, “mắt sáng” tự nhiên, gợi một con mắt nhìn rõ và hoạt động tốt, đồng thời có thể mang sắc thái nhận thức đúng đắn. Chú thích giữ lại các khả năng “khỏe mạnh”, “trong sáng” và nghĩa truyền thống “đơn nhất”.
- source_word: ὅλον ... φωτεινόν
  choice: cả thân thể con cũng đầy ánh sáng
  rationale: Diễn đạt tự nhiên ý nghĩa “sáng, đầy ánh sáng” của tính từ φωτεινός và giữ hình ảnh ánh sáng xuyên suốt.
- source_word: ἐπὰν δὲ
  choice: nhưng khi
  rationale: Thể hiện mệnh đề điều kiện-thời gian tương phản và tạo thế cân xứng với “khi” ở vế trước.
- source_word: πονηρός
  choice: xấu
  rationale: “Xấu” giữ được độ rộng nghĩa giữa tình trạng khiếm khuyết của mắt và sắc thái xấu xa về đạo đức, không thu hẹp thành “bệnh” hay chỉ thành “ác”.
- source_word: σκοτεινόν
  choice: tối tăm
  rationale: Giữ phép đối lập trực tiếp với tình trạng đầy ánh sáng; “tối tăm” cũng phù hợp với cả bình diện thể chất lẫn đạo đức thuộc linh.
theological_decisions:
- issue: Ý nghĩa của ἁπλοῦς khi mô tả mắt
  choice: Dịch “mắt con sáng” trong chính văn.
  alternative: “mắt con khỏe mạnh”, “mắt con trong sáng”, hoặc theo truyền thống “mắt con đơn nhất”.
  rationale: Ngữ cảnh trực tiếp nói về mắt như đèn của thân thể và đối lập ánh sáng với tối tăm. “Mắt sáng” là cách nói tự nhiên trong tiếng Việt về con mắt nhìn rõ, đồng thời không loại bỏ hàm ý đạo đức hay thuộc linh. Chú thích bảo tồn độ rộng nghĩa của từ Hy Lạp.
- issue: Sắc thái của πονηρός
  choice: Dịch “xấu”.
  alternative: “ác”, “hư” hoặc “không khỏe”.
  rationale: Từ Hy Lạp có thể nói về điều xấu, ác hoặc khiếm khuyết. “Xấu” không giải quyết dứt khoát phép ẩn dụ theo hướng thể chất hay đạo đức, nhờ đó giữ được sự căng thẳng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “con” phù hợp với lời Đức Giê-su trực tiếp dạy người nghe trong văn cảnh, đồng thời giữ nhịp đối xứng giữa “sáng/đầy ánh sáng” và “xấu/tối tăm”.
