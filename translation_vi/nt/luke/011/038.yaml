source:
  edition: SBLGNT
  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: vi
  text: Nhưng người Pha-ri-si thấy vậy thì ngạc nhiên vì Ngài chưa tẩy rửa theo nghi thức trước khi dùng bữa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng thường được dùng với nghĩa “làm báp-têm”. Trong ngữ cảnh này, từ ấy chỉ việc tẩy rửa theo nghi thức trước bữa ăn, theo tập tục thanh sạch của người Pha-ri-si.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ giữa hành động của Chúa Giê-su và phản ứng của người Pha-ri-si.
- source_word: Φαρισαῖος
  choice: người Pha-ri-si
  rationale: Cách gọi thông dụng, tự nhiên trong tiếng Việt đối với danh xưng nhóm này.
- source_word: ἰδὼν
  choice: khi thấy vậy
  rationale: Diễn đạt phân từ bất định quá khứ theo quan hệ thời gian với động từ chính, đồng thời dùng “vậy” để chỉ sự việc hàm ẩn từ câu trước.
- source_word: ἐθαύμασεν
  choice: ngạc nhiên
  rationale: Truyền đạt phản ứng sửng sốt trước một điều trái với mong đợi, không thêm sắc thái lên án vốn không được động từ nói rõ.
- source_word: οὐ πρῶτον
  choice: đã không ... trước bữa ăn
  rationale: Thể hiện việc hành động được mong đợi phải xảy ra trước khi dùng bữa; tiếng Việt không cần dịch πρῶτον thành một từ “trước tiên” riêng vì cụm thời gian đã làm rõ trình tự.
- source_word: ἐβαπτίσθη
  choice: làm nghi thức thanh tẩy
  rationale: Trong bối cảnh tập tục thanh sạch của người Pha-ri-si trước bữa ăn, động từ chỉ sự tẩy rửa theo nghi thức; cách dịch này tránh khiến độc giả hiểu lầm là phép báp-têm Cơ Đốc.
- source_word: πρὸ τοῦ ἀρίστου
  choice: trước bữa ăn
  rationale: Giữ nghĩa chung của ἄριστον là bữa ăn mà không xác định quá mức đó là bữa sáng hay bữa trưa.
theological_decisions:
- issue: Ý nghĩa của ἐβαπτίσθη trong bối cảnh dùng bữa của người Pha-ri-si
  choice: làm nghi thức thanh tẩy
  alternative: tắm rửa; chịu báp-têm; tự nhúng mình
  rationale: Ngữ cảnh trực tiếp nói đến tập tục thanh sạch trước khi ăn, không phải nghi thức báp-têm Cơ Đốc. Bản dịch nêu rõ tính nghi lễ nhưng chú thích vẫn bảo tồn liên hệ từ vựng với động từ thường được dịch là “làm báp-têm”.
- issue: Chủ thể được chỉ bằng động từ ngôi thứ ba số ít ἐβαπτίσθη
  choice: Ngài, chỉ Chúa Giê-su theo văn cảnh
  alternative: ông ấy/người ấy, để đại từ hoàn toàn không xác định
  rationale: Chủ thể được kế thừa tự nhiên từ câu trước là Chúa Giê-su. Dùng “Ngài” giúp câu tiếng Việt rõ ràng mà không thay đổi nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Làm nghi thức thanh tẩy” được chọn trong chính văn để làm rõ bối cảnh văn hóa; chú thích ghi nhận cách dịch sát hơn và phạm vi nghĩa rộng của động từ Hy Lạp. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
