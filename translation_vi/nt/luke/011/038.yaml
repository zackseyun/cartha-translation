review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhận diện đúng bối cảnh tẩy rửa theo nghi thức và không hiểu ἐβαπτίσθη là báp-têm Cơ Đốc. Tuy nhiên, “làm nghi thức thanh tẩy” diễn giải mạnh hơn động từ gốc và cách kết hợp với “Ngài đã không” chưa tự nhiên. “Tẩy rửa theo nghi thức” giữ được sắc thái nghi lễ mà gần động từ hơn, không quy định bộ phận cơ thể hay hình thức nghi lễ.
  naturalness: Câu sửa dùng trật tự và liên từ tự nhiên trong tiếng Việt hiện đại. “Trước khi dùng bữa” diễn tả rõ trình tự mà πρῶτον πρὸ τοῦ ἀρίστου đòi hỏi; “chưa tẩy rửa” phù hợp với sự ngạc nhiên về điều đáng lẽ phải được làm trước bữa ăn.
  terminology: Giữ “người Pha-ri-si” và đại từ tôn kính “Ngài” theo văn mạch chỉ Chúa Giê-su. Dùng “tẩy rửa theo nghi thức” thay cho “thanh tẩy” để tránh gợi một thuật ngữ nghi lễ chuyên biệt hoặc một hành vi được xác định quá mức. Chú thích nêu phạm vi từ vựng của βαπτίζω mà không biến chính văn thành “báp-têm.”
  issues:
  - severity: medium
    issue: “làm nghi thức thanh tẩy” diễn giải quá cụ thể
    rationale: ἐβαπτίσθη, trong ngữ cảnh này, chỉ việc tẩy rửa nghi thức, nhưng bản thân động từ không xác định một “nghi thức” như một hành vi lễ nghi riêng biệt. Cụm “tẩy rửa theo nghi thức” vừa rõ bối cảnh vừa gần nghĩa từ vựng hơn.
  - severity: low
    issue: Cách nói “Ngài đã không làm...” kém tự nhiên
    rationale: Trong câu thuật sự về một việc được trông đợi trước bữa ăn, “Ngài chưa tẩy rửa trước khi dùng bữa” tự nhiên hơn và vẫn truyền đạt phủ định cùng trình tự thời gian.
