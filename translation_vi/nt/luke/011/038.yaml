  rationale: Bản sửa bảo tồn phản ứng ngạc nhiên của người Pha-ri-si, chủ thể được hiểu từ văn mạch, và việc tẩy rửa được mong đợi trước bữa ăn. Nó tránh thêm chi tiết không có trong bản gốc, chẳng hạn tẩy rửa tay hay một hình thức nghi lễ cụ thể, đồng thời vẫn làm rõ bối cảnh qua cụm từ và chú thích.
  reviewer_model: gpt-5.6-terra
