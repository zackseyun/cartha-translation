id: LUK.11.48
reference: Luke 11:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: vi
  text: Vậy, các ông là nhân chứng và tán thành những việc làm của tổ tiên các ông, vì họ đã giết các nhà tiên tri, còn các ông thì xây mộ cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ viết “còn các ông thì xây”; tân ngữ được hiểu từ câu trước là mộ của các nhà tiên tri.
    reason: Làm rõ tân ngữ được tỉnh lược trong tiếng Hy Lạp và mối liên hệ với câu 47.
lexical_decisions:
- source_word: ἄρα
  choice: Vậy
  rationale: Diễn đạt kết luận suy ra từ lời tố cáo ở câu trước một cách tự nhiên và rõ ràng.
- source_word: μάρτυρές ἐστε
  choice: các ông là nhân chứng
  rationale: Giữ cấu trúc danh từ vị ngữ của tiếng Hy Lạp và ý rằng hành động của họ trở thành bằng chứng chống lại chính họ.
- source_word: συνευδοκεῖτε
  choice: cũng tán thành
  rationale: Diễn đạt sự đồng tình về mặt đạo đức với hành động của tổ tiên; “cũng” nêu sự liên kết giữa việc làm chứng và việc tán thành.
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: những việc tổ tiên mình đã làm
  rationale: “Việc… đã làm” tự nhiên hơn “công việc” trong văn cảnh mang tính lên án; “tổ tiên” chỉ các thế hệ trước mà không tạo cảm giác chỉ nói đến người cha trực hệ.
- source_word: ὅτι
  choice: vì
  rationale: Giữ quan hệ giải thích nguyên nhân được nêu rõ trong nguyên văn.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτούς
  choice: họ đã giết các nhà tiên tri
  rationale: Làm rõ đối tượng của đại từ từ văn cảnh ngay trước đó, tránh chuỗi đại từ “họ giết họ” tối nghĩa trong tiếng Việt.
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: còn các ông thì xây mộ cho các vị ấy
  rationale: “Còn… thì” giữ thế tương phản giữa tổ tiên và thế hệ hiện tại. Tân ngữ của “xây” được bổ sung từ câu 47 để câu tiếng Việt trọn nghĩa.
theological_decisions:
- issue: Có nên bổ sung tân ngữ được ngầm hiểu của οἰκοδομεῖτε hay không
  choice: Bổ sung “mộ cho các vị ấy” trong chính văn.
  alternative: 'Giữ sát hình thức: “còn các ông thì xây.”'
  rationale: Nguyên văn câu này chỉ có động từ “xây”, nhưng tân ngữ là mộ của các nhà tiên tri đã được nêu ngay ở câu 47. Bổ sung tân ngữ giúp tiếng Việt rõ nghĩa mà không giải quyết thêm bất kỳ vấn đề thần học nào; chú thích vẫn ghi nhận sự tỉnh lược trong tiếng Hy Lạp.
- issue: Đối tượng của đại từ αὐτούς
  choice: Dịch rõ là “các nhà tiên tri” rồi dùng “các vị ấy”.
  alternative: 'Dịch theo hình thức đại từ: “họ đã giết họ”.'
  rationale: Tiền ngữ nằm ở câu 47. Việc nêu lại giúp tránh mơ hồ đại từ trong tiếng Việt và không thêm một đối tượng mới vào văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực diện. “Các ông” phù hợp với lời Chúa Giê-su đang nói với các chuyên gia luật pháp trong văn cảnh, tự nhiên hơn đại từ “các ngươi” đối với độc giả hiện đại. “Các vị ấy” giữ sự quy chiếu rõ ràng đến các nhà tiên tri.
