revisions:
- from: Vậy, các ông là nhân chứng và cũng tán thành những việc tổ tiên mình đã làm, vì họ đã giết các nhà tiên tri, còn các ông thì xây mộ cho các vị ấy.[a]
  to: Vậy, các ông là nhân chứng và tán thành những việc làm của tổ tiên các ông, vì họ đã giết các nhà tiên tri, còn các ông thì xây mộ cho họ.[a]
  rationale: Chỉnh nhẹ để giữ rõ quan hệ sở hữu và đối lập trong nguyên văn, đồng thời dùng cách diễn đạt tiếng Việt tự nhiên hơn. Vẫn giữ việc bổ sung “mộ” và “các nhà tiên tri” theo văn cảnh trực tiếp, với chú thích nêu rõ tân ngữ không xuất hiện trong chính câu Hy Lạp.
