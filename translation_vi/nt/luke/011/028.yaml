  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: vi
  text: 'Nhưng Ngài nói: “Đúng hơn, phước cho những người nghe lời Đức Chúa Trời và vâng giữ lời ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Quả thật, phước cho…” hoặc “Phải, đúng hơn, phước cho…” Tiểu từ Hy Lạp có thể vừa xác nhận vừa chuyển trọng tâm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Đúng hơn
  rationale: Tiểu từ này vừa có thể xác nhận vừa chuyển trọng tâm. “Đúng hơn” diễn đạt sự điều chỉnh và nhấn mạnh của lời đáp mà không biến nó thành sự bác bỏ gay gắt.
- source_word: μακάριοι
  choice: phước cho
  rationale: Cách diễn đạt quen thuộc, trang trọng trong các lời chúc phước, giữ được chiều kích thần học thay vì chỉ nói đến cảm giác vui vẻ hay hoàn cảnh may mắn.
- source_word: οἱ ἀκούοντες
  choice: những người nghe
  rationale: Phân từ hiện tại dùng như danh từ chỉ những người có đặc điểm là nghe; cách dịch này tự nhiên và không làm mất sắc thái liên tục.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ phạm vi nghĩa của λόγος là lời phán, sứ điệp hay sự mặc khải từ Đức Chúa Trời, đồng thời phù hợp với văn phong Kinh Thánh tiếng Việt.
- source_word: φυλάσσοντες
  choice: vâng giữ lời ấy
  rationale: φυλάσσω trong ngữ cảnh này bao hàm gìn giữ và thực hành. “Vâng giữ” diễn tả sự tuân theo mà không thu hẹp nghĩa thành việc chấp hành luật lệ đơn thuần; “lời ấy” làm rõ tân ngữ đã nêu trước.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Nhưng Ngài nói
  rationale: δὲ tạo sắc thái chuyển ý có phần tương phản với lời nói ở câu trước; “nhưng” thể hiện điều đó, còn “nói” bám sát εἶπεν.
theological_decisions:
- issue: Sức nặng của lời Chúa Giê-su đáp lại lời chúc phước của người phụ nữ
  choice: Lời đáp chuyển trọng tâm sang phước thật của những người nghe và vâng giữ lời Đức Chúa Trời, nhưng không nói rõ rằng lời chúc trước đó bị phủ nhận.
  alternative: Hiểu lời đáp là bác bỏ hoàn toàn lời người phụ nữ, hoặc chỉ đơn thuần thêm một lời chúc phước khác mà không điều chỉnh trọng tâm.
  rationale: Μενοῦν có thể vừa xác nhận vừa điều chỉnh hoặc tăng cường ý. “Đúng hơn” giữ được sự căng thẳng này mà không áp đặt một cách hiểu quá dứt khoát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su; dùng “Đức Chúa Trời” cho θεός. Dấu chú thích [a] được đặt sau toàn bộ lời phán vì chú thích giải thích sắc thái mở đầu và lực của cả câu đáp.
