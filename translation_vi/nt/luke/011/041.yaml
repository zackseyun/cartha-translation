revisions:
- from: Nhưng hãy lấy những gì ở bên trong mà bố thí[a]; và kìa, mọi sự đều thanh sạch đối với các người.
  to: Nhưng hãy bố thí những gì ở bên trong[a]; và kìa, mọi sự đều thanh sạch cho các ông.
  rationale: Bản sửa loại bỏ động từ “lấy” không có trong nguyên văn, làm mệnh lệnh bố thí trực tiếp hơn, và thay đại từ/cấu trúc không tự nhiên bằng cách diễn đạt hiện đại phù hợp với người nghe trong ngữ cảnh. Cách hiểu còn tranh luận của τὰ ἐνόντα vẫn được bảo lưu đầy đủ ở chú thích, không áp đặt một cách giải thích thần học.
