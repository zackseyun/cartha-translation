  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: vi
  text: Nhưng hãy bố thí những gì ở bên trong[a]; và kìa, mọi sự đều thanh sạch cho các ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy bố thí những gì các ông có.” Cụm từ Hy Lạp có thể chỉ những gì ở bên trong hoặc của cải một người hiện có.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn tả sự tương phản mang tính sửa lại với việc chỉ làm sạch bên ngoài đã nói trước đó.
- source_word: τὰ ἐνόντα
  choice: những gì ở bên trong
  rationale: Giữ sát cấu trúc Hy Lạp và mối tương phản trực tiếp giữa bên ngoài với bên trong trong ngữ cảnh, đồng thời không loại bỏ cách hiểu khác được ghi ở chú thích.
- source_word: δότε ἐλεημοσύνην
  choice: hãy lấy ... mà bố thí
  rationale: Diễn đạt tự nhiên trong tiếng Việt mệnh lệnh cho đi để cứu giúp người thiếu thốn, mà không thêm một đối tượng không được nêu rõ trong nguyên văn.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ sắc thái nhấn mạnh, thu hút sự chú ý của lời Hy Lạp.
- source_word: πάντα
  choice: mọi sự
  rationale: Phản ánh nghĩa bao quát của dạng trung tính số nhiều và phù hợp với văn phong trang trọng.
- source_word: καθαρὰ
  choice: thanh sạch
  rationale: Giữ liên hệ với vấn đề thanh sạch trong ngữ cảnh, bao gồm sắc thái nghi lễ và đạo đức.
- source_word: ὑμῖν
  choice: đối với các người
  rationale: 'Thể hiện cách dùng tặng cách chỉ phương diện quy chiếu: mọi sự là thanh sạch xét trong tương quan với họ.'
theological_decisions:
- issue: Cách hiểu τὰ ἐνόντα trong mối liên hệ giữa nội tâm, việc bố thí và sự thanh sạch
  choice: những gì ở bên trong
  alternative: những gì mình có, tức của cải hiện có
  rationale: Ngữ cảnh ngay trước đó đối lập bên ngoài với bên trong chén đĩa, nên cách dịch chính giữ được sức nặng đạo đức trong lời quở trách của Đức Giê-su. Tuy nhiên, vì cụm Hy Lạp cũng có thể được hiểu là của cải sẵn có, cách hiểu ấy được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Kìa” bảo tồn điểm nhấn tu từ; “thanh sạch” duy trì liên hệ với chủ đề thanh tẩy. Đại từ “các người” phản ánh lời nói trực tiếp mang sắc thái quở trách trong ngữ cảnh.
