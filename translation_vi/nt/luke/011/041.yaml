review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng thế đối lập của πλὴν, cách hiểu chính của τὰ ἐνόντα là “những gì ở bên trong,” và tính bao quát của πάντα. Tuy nhiên, “hãy lấy ... mà bố thí” thêm động từ “lấy,” không có trong nguyên văn, và làm mệnh lệnh Hy Lạp δότε ... ἐλεημοσύνην kém trực tiếp.
  naturalness: “Hãy bố thí những gì ở bên trong” là cách diễn đạt hiện đại, trực tiếp và tự nhiên hơn. “Đối với các người” không tự nhiên trong tiếng Việt hiện đại; trong ngữ cảnh lời nói với người Pha-ri-si, “cho các ông” vừa tự nhiên vừa phản ánh số nhiều của ὑμῖν. “Kìa” có thể giữ lại để phản ánh ἰδοὺ.
  terminology: “Bố thí” chuyển tải chính xác ἐλεημοσύνην. “Thanh sạch” thích hợp trong ngữ cảnh tranh luận về sự sạch/ô uế. Chú thích cần giữ rõ rằng cách hiểu thay thế nói đến của cải hiện có, nhưng không nên dùng “mình” vì lời trực tiếp đang nhắm đến số nhiều.
  issues:
  - severity: medium
    issue: “hãy lấy những gì ở bên trong mà bố thí” thêm ý và kém trực tiếp
    rationale: δότε ἐλεημοσύνην nghĩa là “hãy bố thí/hãy cho làm của bố thí”; “lấy” không được diễn đạt trong tiếng Hy Lạp và có thể gợi một thao tác không cần thiết.
  - severity: low
    issue: “đối với các người” không tự nhiên trong văn phong Việt hiện đại
    rationale: Dù có thể phản ánh tặng cách quy chiếu, cụm này gượng. “Cho các ông” diễn đạt tự nhiên quan hệ “thanh sạch cho/đối với” mà vẫn phù hợp ngữ cảnh người nghe là các người Pha-ri-si.
  - severity: low
    issue: Chú thích dùng đại từ số ít “mình”
    rationale: Nguyên văn và lời nói trực tiếp hướng đến số nhiều; “mình có” không sai như một cách nói khái quát, nhưng “họ có” hoặc “của cải hiện có” rõ hơn và tránh chuyển đổi ngôi.
  revised_text: Nhưng hãy bố thí những gì ở bên trong[a]; và kìa, mọi sự đều thanh sạch cho các ông.
  revised_footnotes:
