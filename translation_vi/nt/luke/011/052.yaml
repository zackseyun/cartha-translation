  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: vi
  text: Khốn cho các ông, hỡi những chuyên gia về Luật pháp[a]! Vì các ông đã lấy đi chìa khóa của sự hiểu biết; chính các ông không vào, lại còn ngăn trở những người đang vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là những người thông thạo Luật pháp Do Thái, không phải luật sư dân sự theo nghĩa hiện đại.
    reason: lexical_clarification
lexical_decisions:
- source_word: οὐαὶ
  choice: Khốn cho
  rationale: Giữ được sắc thái tuyên cáo phán xét mạnh mẽ mang tính ngôn sứ, tự nhiên hơn trong tiếng Việt hiện đại so với một lời than đơn thuần.
- source_word: τοῖς νομικοῖς
  choice: những chuyên gia Luật pháp
  rationale: Chỉ những người thông thạo Luật pháp Do Thái, không phải luật sư dân sự theo nghĩa hiện đại. Viết hoa “Luật pháp” giúp chỉ rõ Luật pháp Môi-se trong ngữ cảnh.
- source_word: ἤρατε
  choice: đã lấy đi
  rationale: Diễn đạt ý loại bỏ hoặc tước mất phương tiện tiếp cận, phù hợp với hình ảnh chìa khóa hơn cách dịch trung tính “đã cầm lấy”.
- source_word: τὴν κλεῖδα τῆς γνώσεως
  choice: chìa khóa của sự hiểu biết
  rationale: Bám sát cấu trúc sở hữu trong tiếng Hy Lạp và giữ nguyên ẩn dụ, không xác định quá mức nội dung của sự hiểu biết.
- source_word: αὐτοὶ
  choice: chính các ông
  rationale: Bảo tồn tính nhấn mạnh và sự tương phản trong đại từ Hy Lạp.
- source_word: οὐκ εἰσήλθατε
  choice: không vào
  rationale: Giữ nguyên ẩn dụ bước vào mà không bổ sung một đối tượng không được nêu rõ trong câu.
- source_word: τοὺς εἰσερχομένους
  choice: những người đang vào
  rationale: Phản ánh khía cạnh tiếp diễn của phân từ hiện tại, không thêm ý “đang cố vào” vốn không được biểu đạt rõ.
- source_word: ἐκωλύσατε
  choice: ngăn trở
  rationale: Diễn đạt hành vi cản trở mà không nhất thiết khẳng định tuyệt đối rằng việc bước vào đã bị ngăn chặn hoàn toàn.
theological_decisions:
- issue: Đối tượng hàm ẩn của động từ “vào” và ý nghĩa của “chìa khóa của sự hiểu biết”
  choice: Giữ nguyên ẩn dụ tiếp cận và bước vào, không nêu thêm đối tượng trong chính văn.
  alternative: Hiểu là vào vương quốc Đức Chúa Trời, hoặc đi vào sự hiểu biết chân thật về Đức Chúa Trời.
  rationale: Bản Hy Lạp không nói rõ người ta bước vào đâu. Việc giữ nét hàm ẩn bảo tồn sự mơ hồ có thật của câu và tránh áp đặt một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “các ông” phù hợp với lời quở trách nhắm vào một nhóm nam giới có địa vị chuyên môn; “mà còn” làm rõ sức tương phản của καί trong lời cáo buộc mà không thay đổi nội dung.
