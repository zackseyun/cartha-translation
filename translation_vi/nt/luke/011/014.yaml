revisions:
- from: Bấy giờ, Đức Giê-su đang đuổi một quỷ khiến người ta câm. Khi quỷ ra khỏi, người câm nói được, và dân chúng kinh ngạc.[a]
  to: Đức Giê-su đang đuổi một quỷ khiến một người bị câm[a]. Khi quỷ đã ra khỏi, người ấy nói được, và dân chúng kinh ngạc.
  rationale: Bản sửa thay “người ta” bằng “một người” để giữ quy chiếu số ít của bản văn, rồi dùng “người ấy” để liên kết rõ ràng với người đó. “Đã ra khỏi” biểu đạt hợp lý hành động hoàn tất của phân từ aorist trước động từ chính. Chú thích được chuyển đến ngay sau “câm,” từ tương ứng với κωφός, đồng thời vẫn bảo tồn nghĩa từ vựng thay thế.
