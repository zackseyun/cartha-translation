id: LUK.11.14
reference: Luke 11:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: vi
  text: Đức Giê-su đang đuổi một quỷ khiến một người bị câm[a]. Khi quỷ đã ra khỏi, người ấy nói được, và dân chúng kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể có nghĩa là “điếc”; nhưng ở đây, nghĩa “câm” phù hợp với ngữ cảnh hơn, vì người ấy nói được sau khi quỷ ra khỏi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: đang đuổi
  rationale: Kết cấu vị ngữ ἦν với phân từ hiện tại diễn tả hành động đang diễn ra trong quá khứ; “đang đuổi” tự nhiên trong tiếng Việt và phù hợp ngữ cảnh trừ quỷ.
- source_word: δαιμόνιον
  choice: một quỷ
  rationale: δαιμόνιον trực tiếp chỉ một thực thể ma quỷ; cách dịch này giữ nguyên lời khẳng định siêu nhiên của bản văn mà không thay bằng cụm từ không có trong câu.
- source_word: κωφόν
  choice: khiến người ta câm
  rationale: κωφός có thể mang nghĩa “điếc” hoặc “câm”. Việc người bị hại nói được ngay sau khi quỷ ra cho thấy sự câm là trọng tâm; cách diễn đạt này cũng chuyển tự nhiên quan hệ giữa tính từ và “quỷ” trong nguyên văn.
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: Khi quỷ ra khỏi
  rationale: Kết cấu này đưa câu chuyện sang biến cố kế tiếp, với việc quỷ ra khỏi xảy ra trước hành động chính. Tiếng Việt không cần dịch máy móc ἐγένετο δὲ mà vẫn giữ rõ trình tự thời gian.
- source_word: ἐλάλησεν
  choice: nói được
  rationale: λαλέω nghĩa là “nói”. Trong tiếng Việt, “nói được” tự nhiên trong ngữ cảnh một người trước đó bị câm được phục hồi khả năng nói, nhưng không thêm ý “bắt đầu” vốn không được nói rõ.
- source_word: ὁ κωφός
  choice: người câm
  rationale: Tính từ được dùng như danh từ để chỉ người bị câm; “người câm” rõ nghĩa và không tự ý xác định giới tính.
- source_word: ἐθαύμασαν
  choice: kinh ngạc
  rationale: Động từ diễn tả sự ngạc nhiên và thán phục; “kinh ngạc” là cách nói hiện đại, tự nhiên và trang trọng vừa phải.
- source_word: οἱ ὄχλοι
  choice: dân chúng
  rationale: Danh từ số nhiều chỉ các đám đông. “Dân chúng” là cách gọi tập thể tự nhiên trong văn thuật chuyện tiếng Việt; không buộc phải thể hiện số nhiều bằng “các đám đông” vốn kém tự nhiên ở đây.
theological_decisions:
- issue: Bản chất của sự khốn khổ và ngôn ngữ trừ quỷ
  choice: Trình bày đúng như bản văn rằng Đức Giê-su đuổi một quỷ, và người bị câm nói được sau khi quỷ ra khỏi.
  alternative: Diễn đạt theo hiện tượng quan sát được, dùng “tà linh”, hoặc tránh khẳng định rõ thực tại siêu nhiên.
  rationale: Nguyên văn dùng δαιμόνιον và kể việc nó ra khỏi như biến cố dẫn đến khả năng nói được phục hồi. Bản dịch cần giữ nguyên tuyên bố siêu nhiên ấy, không giảm nhẹ hoặc thêm thắt.
- issue: Tính mơ hồ của κωφός
  choice: Dùng “câm” trong câu chính và ghi nhận khả năng “điếc” ở chú thích.
  alternative: Dịch “điếc” trong câu chính.
  rationale: Từ Hy Lạp có thể mang cả hai nghĩa, nhưng mệnh đề kế tiếp nhấn mạnh rằng người ấy nói được, nên “câm” phù hợp ngữ cảnh hơn mà chú thích vẫn bảo tồn khả năng từ vựng khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, giọng văn kể chuyện trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” để làm rõ chủ thể theo văn cảnh dù đại từ này được lược trong tiếng Hy Lạp; dùng “dân chúng” tự nhiên hơn cách dịch sát hình thức “các đám đông”. Dấu chú thích [a] được đặt ngay sau mệnh đề có từ cần giải thích.
