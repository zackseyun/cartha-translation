  terminology: “Chuyên gia về Luật pháp” tránh liên tưởng sai đến luật sư hiện đại, đồng thời vẫn chỉ những người chuyên về Luật Do Thái. “Thưa Thầy” và “sỉ nhục” phù hợp văn phong trang trọng hiện đại.
