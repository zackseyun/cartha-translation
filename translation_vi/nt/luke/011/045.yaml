base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: vi
  text: 'Một người trong các chuyên gia về Luật pháp đáp lời Đức Giê-su: “Thưa Thầy, khi nói những điều ấy, Thầy cũng sỉ nhục cả chúng tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: đáp lời
  rationale: Cụm này đưa vào lời phản hồi trong mạch kể. “Đáp lời” tự nhiên trong tiếng Việt và không làm δέ thành một ý tương phản mạnh.
- source_word: τις τῶν νομικῶν
  choice: một người trong số các chuyên gia Luật pháp
  rationale: νομικός ở đây chỉ người thông thạo Luật Môi-se, không phải luật sư theo nghĩa nghề nghiệp hiện đại. “Chuyên gia Luật pháp” truyền đạt rõ chức năng ấy.
- source_word: λέγει αὐτῷ
  choice: Đức Giê-su
  rationale: Đại từ αὐτῷ chỉ Đức Giê-su trong ngữ cảnh. Nêu rõ tên giúp câu tiếng Việt tự nhiên và tránh đại từ mơ hồ, trong khi vẫn giữ nguyên đối tượng được nói với.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Đây là cách xưng hô trực tiếp, kính trọng với người dạy; “Thưa Thầy” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ταῦτα λέγων
  choice: khi nói những điều ấy
  rationale: Diễn đạt quan hệ đồng thời của phân từ và nối trực tiếp lời vừa nói với lời phản đối của người chuyên gia.
- source_word: καὶ ἡμᾶς
  choice: cũng ... cả chúng tôi
  rationale: 'Giữ lực bổ sung của καί: những lời ấy không chỉ nhắm đến nhóm đã được nói đến mà còn chạm đến nhóm chuyên gia Luật pháp.'
- source_word: ὑβρίζεις
  choice: sỉ nhục
  rationale: ὑβρίζω mạnh hơn việc chỉ làm phật lòng; nó mang nghĩa xúc phạm, hạ nhục hoặc đối xử khinh miệt. “Sỉ nhục” giữ được sức nặng ấy trong ngữ cảnh lời nói.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Luật pháp” để chỉ Luật Môi-se trong bối cảnh Do Thái; dùng “Đức Giê-su” nhằm xác định rõ đối tượng của αὐτῷ. Không cần chú thích vì “chuyên gia Luật pháp” đã giải nghĩa νομικός ngay trong chính văn, còn “sỉ nhục” thể hiện đủ sắc thái mạnh của ὑβρίζω.
