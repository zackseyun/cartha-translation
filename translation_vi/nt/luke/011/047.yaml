  source_fidelity: 'Bản dịch phản ánh sát câu Hy Lạp: οὐαὶ ὑμῖν được chuyển thành lời cảnh cáo trực tiếp “Khốn cho các người”; ὅτι mang nghĩa nguyên nhân (“vì”); οἰκοδομεῖτε ở hiện tại được dịch tự nhiên là “xây”; τὰ μνημεῖα là “mộ”; và δέ được giữ bằng “nhưng”. Đại từ “họ” quy chiếu rõ về “các nhà tiên tri”. Bản dịch cũng giữ hai mệnh đề đặt cạnh nhau của nguyên văn, không biến chúng thành mệnh đề quan hệ hay giải thích trước hàm ý của câu kế tiếp.'
  naturalness: Câu văn rõ, tự nhiên trong tiếng Việt hiện đại và vẫn giữ giọng trang trọng, quở trách. “Cha ông các người” là cách nói phù hợp khi đề cập các thế hệ trước; “xây mộ cho các nhà tiên tri” là kết hợp từ tự nhiên.
  terminology: “Khốn cho”, “nhà tiên tri”, “cha ông”, và “giết” đều phù hợp ngữ cảnh Kinh Thánh và không thêm diễn giải giáo phái. Chú thích a giữ đúng khả năng nghĩa “mộ/công trình tưởng niệm nơi chôn cất” của μνημεῖον; chú thích b nêu được phương án “tổ tiên” cho πατέρες.
