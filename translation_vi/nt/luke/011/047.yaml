id: LUK.11.47
reference: Luke 11:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: vi
  text: Khốn cho các người, vì các người xây mộ[a] cho các nhà tiên tri, nhưng cha ông[b] các người đã giết họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “mộ tưởng niệm.” Từ Hy Lạp có thể chỉ ngôi mộ hoặc công trình tưởng niệm nơi chôn cất.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “tổ tiên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Khốn cho các người
  rationale: Giữ sức nặng của lời quở trách mang tính tiên tri, đồng thời dùng cách xưng hô trực tiếp, dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: vì
  rationale: 'Diễn đạt rõ quan hệ nguyên nhân: hành động được nêu sau đó là lý do cho lời tuyên bố ''khốn cho''.'
- source_word: οἰκοδομεῖτε
  choice: các người xây
  rationale: Thì hiện tại Hy Lạp được chuyển bằng hiện tại đơn tự nhiên, không áp đặt sắc thái đang diễn tiến.
- source_word: τὰ μνημεῖα
  choice: mộ
  rationale: Từ Hy Lạp có thể chỉ ngôi mộ hoặc công trình tưởng niệm nơi chôn cất; 'mộ' rõ ràng và tự nhiên nhất trong chính văn, còn nghĩa rộng hơn được giữ trong chú thích.
- source_word: τῶν προφητῶν
  choice: cho các nhà tiên tri
  rationale: Trong tiếng Việt, 'xây mộ cho' diễn đạt tự nhiên mối liên hệ sở hữu hoặc tưởng niệm của kết cấu sở hữu cách Hy Lạp.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: nhưng cha ông các người
  rationale: δέ tạo sự chuyển ý có sắc thái đối lập giữa việc xây mộ và việc cha ông họ giết các nhà tiên tri. 'Cha ông' vừa giữ hình ảnh gia tộc của πατέρες vừa tự nhiên trong ngữ cảnh nói về các thế hệ trước.
- source_word: ἀπέκτειναν αὐτούς
  choice: đã giết họ
  rationale: Diễn đạt trực tiếp động từ 'giết' và đại từ chỉ lại các nhà tiên tri, không thêm sắc thái pháp lý mạnh hơn như 'sát hại'.
theological_decisions:
- issue: Có nên nói rõ sự giả hình hoặc đồng lõa hàm ý trong việc xây mộ cho các nhà tiên tri mà cha ông họ đã giết hay không
  choice: 'Giữ phép đặt cạnh có tính đối lập: ''các người xây mộ… nhưng cha ông các người đã giết họ.'''
  alternative: 'Diễn thành mệnh đề quan hệ: ''các người xây mộ cho những nhà tiên tri mà cha ông các người đã giết.'''
  rationale: Câu Hy Lạp nêu hai hành động và dùng δέ để chuyển ý, nhưng chưa giải thích đầy đủ ý nghĩa thần học của sự đối chiếu; câu sau mới triển khai điều đó. Bản dịch vì vậy giữ nguyên sức căng tu từ mà không thêm lời kết tội.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và trực tiếp. 'Các người' giữ sắc thái quở trách mà không dùng đại từ 'các ngươi' mang màu sắc cổ; 'cha ông' tự nhiên hơn 'tổ phụ' đối với độc giả phổ thông.
