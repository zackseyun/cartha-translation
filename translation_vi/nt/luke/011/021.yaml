- from: Khi một người mạnh, được trang bị đầy đủ, canh giữ sân nhà mình[a], tài sản của người ấy được yên ổn[b].
  to: Khi người mạnh, đã được vũ trang đầy đủ, canh giữ sân nhà mình[a], thì tài sản của người ấy được yên ổn[b].
  rationale: Bản sửa loại bỏ mạo từ bất định được thêm vào, làm rõ nghĩa “vũ trang” của phân từ hoàn thành, và diễn đạt lại chú thích từ vựng về αὐλή theo hướng trung tính hơn. Hình ảnh ẩn dụ vẫn được giữ nguyên, không đồng nhất “người mạnh” với bất cứ nhân vật nào trong bản văn.
