review_pass:
  verdict: revise
  source_fidelity: Cần chỉnh nhẹ để phản ánh sát hơn ὁ ἰσχυρός như một nhân vật xác định trong hình ảnh minh họa (“người mạnh”), thay vì thêm sắc thái bất định “một”. “Đã được vũ trang đầy đủ” truyền đạt rõ καθωπλισμένος, gồm cả ý trang bị vũ khí và trạng thái kết quả. “Được yên ổn” diễn đạt phù hợp ἐν εἰρήνῃ khi chủ ngữ là tài sản, đồng thời chú thích giữ nghĩa đen.
  naturalness: Câu sửa vẫn là tiếng Việt chuẩn hiện đại và trôi chảy. Thêm “thì” làm quan hệ điều kiện–kết quả trong cấu trúc “Khi … thì …” rõ ràng hơn. “Sân nhà mình” tự nhiên; chú thích giúp người đọc nhận biết phạm vi nghĩa rộng hơn của αὐλή.
  terminology: Giữ “người mạnh” để không diễn giải ẩn dụ. Dùng “vũ trang đầy đủ” cho καθωπλισμένος. “Tài sản” là cách dịch rõ và trung tính cho τὰ ὑπάρχοντα. Chú thích về αὐλή được điều chỉnh để không gợi riêng một “dinh” có sắc thái quy mô/trang trọng vượt quá điều nguyên ngữ xác định.
  issues:
