    rationale: ὁ ἰσχυρός có mạo từ xác định trong câu minh họa. Tiếng Việt không buộc phải đánh dấu xác định, nhưng “người mạnh” giữ hình thức và giọng điệu nguồn tốt hơn.
  - severity: low
    issue: “được trang bị đầy đủ” không nói rõ khía cạnh vũ khí.
    rationale: καθωπλισμένος đặc biệt nói đến việc được vũ trang/trang bị khí giới. Thêm “vũ trang” là một hiệu chỉnh an toàn và sát nghĩa.
  - severity: low
    issue: Chú thích a dùng “dinh” như một lựa chọn rời.
    rationale: αὐλή có thể chỉ sân, nhà ở, hoặc khuôn viên gắn với nhà ở; “dinh” trong tiếng Việt dễ gợi quy mô hoặc địa vị không cần thiết. Nên mô tả phạm vi nghĩa thay vì ưu tiên một hình ảnh quá đặc thù.
