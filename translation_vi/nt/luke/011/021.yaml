source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: vi
  text: Khi người mạnh, đã được vũ trang đầy đủ, canh giữ sân nhà mình[a], thì tài sản của người ấy được yên ổn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể chỉ sân trong, hoặc nơi ở/khuôn viên nhà gắn với sân ấy.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ở trong bình an.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: Diễn tả một tình huống có tính khái quát theo thời gian hoặc điều kiện; “Khi” tự nhiên trong tiếng Việt và phù hợp với câu minh họa.
- source_word: ὁ ἰσχυρός
  choice: một người mạnh
  rationale: Tính từ có mạo từ được dùng như danh từ, chỉ một người nam có sức mạnh. Cách dịch này tự nhiên và không giải thích ẩn dụ ngay trong câu.
- source_word: καθωπλισμένος
  choice: được trang bị đầy đủ
  rationale: Phân từ hoàn thành mô tả trạng thái đã được trang bị vũ khí đầy đủ; cách diễn đạt này giữ được kết quả hiện tại mà không nặng nề.
- source_word: φυλάσσῃ
  choice: canh giữ
  rationale: Truyền đạt hành động liên tục trông coi và bảo vệ trong tình huống được nêu.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: sân nhà mình
  rationale: αὐλή có thể chỉ sân trong hoặc rộng hơn là khu nhà thuộc về nó. “Sân nhà mình” tự nhiên, giữ nghĩa trực tiếp và thể hiện sắc thái phản thân của ἑαυτοῦ.
- source_word: ἐν εἰρήνῃ ἐστίν
  choice: được yên ổn
  rationale: Nghĩa đen là “ở trong bình an”; trong ngữ cảnh tài sản được canh giữ, “được yên ổn” vừa tự nhiên vừa giữ hình ảnh bình an, không chỉ thu hẹp thành an toàn vật chất.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: tài sản của người ấy
  rationale: Chỉ những gì thuộc về người ấy; “tài sản” rõ ràng, hiện đại và đủ rộng.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của người mạnh trong văn cảnh
  choice: Giữ nguyên hình ảnh “một người mạnh” mà không nêu rõ nhân vật ấy là ai trong chính câu này.
  alternative: Dịch giải thích trực tiếp “người mạnh” là Sa-tan.
  rationale: Câu Hy Lạp trình bày hình ảnh ẩn dụ; văn cảnh xung quanh cung cấp cách hiểu. Bản dịch không nên giải quyết ngầm điều câu này chưa nói thẳng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “người ấy” để tránh lặp đại từ thiếu tự nhiên; giữ câu gọn và hình ảnh cụ thể của nguyên văn.
