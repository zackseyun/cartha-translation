  terminology: “Đức Giê-su,” “Lạy Chúa,” “cầu nguyện,” và “môn đồ” phù hợp với văn phong Kinh Thánh hiện đại và giữ được giá trị của các thuật ngữ nguồn. “Lạy Chúa” là cách xưng hô kính trọng thích hợp cho Κύριε, không áp đặt thêm diễn giải thần học.
