id: LUK.11.1
reference: Luke 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: vi
  text: 'Có lần, Đức Giê-su đang cầu nguyện tại một nơi kia. Khi ngài ngừng cầu nguyện, một trong các môn đồ của ngài thưa với ngài: “Lạy Chúa, xin dạy chúng con cầu nguyện, như Giăng cũng đã dạy các môn đồ của mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Có lần
  rationale: Cụm này mở đầu một sự việc trong mạch kể. “Có lần” tự nhiên trong tiếng Việt hiện đại và giữ chức năng dẫn nhập mà không dùng lối văn cổ.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: đang cầu nguyện
  rationale: Cách diễn đạt này thể hiện hoàn cảnh đồng thời và tính tiếp diễn của hành động trong cấu trúc Hy Lạp.
- source_word: ἐν τόπῳ τινὶ
  choice: tại một nơi kia
  rationale: Giữ tính bất định có chủ ý của τόπῳ τινὶ, đồng thời phù hợp với văn kể tiếng Việt.
- source_word: ὡς ἐπαύσατο
  choice: Khi ngài ngừng cầu nguyện
  rationale: ἐπαύσατο có nghĩa là ngừng hoặc thôi. Lặp lại “cầu nguyện” làm rõ đối tượng của việc ngừng, vốn được ngữ cảnh Hy Lạp cung cấp.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: một môn đồ
  rationale: Diễn đạt tự nhiên cấu trúc phân chia “một người trong số các môn đồ của ngài”; ngữ cảnh đã cho thấy người ấy thuộc nhóm môn đồ của Đức Giê-su.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Chúa” giữ phạm vi ý nghĩa và sức nặng danh xưng của κύριος; “lạy” là hô cách kính trọng, tự nhiên trong lời thưa trực tiếp.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: xin dạy chúng con cầu nguyện
  rationale: Bám sát bổ ngữ nguyên mẫu “dạy chúng con cầu nguyện”, không thêm từ “cách” vốn có thể thu hẹp lời xin thành phương pháp.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: như Giăng cũng đã dạy các môn đồ của ông
  rationale: “Như” truyền đạt phép so sánh của καθώς, còn “cũng” thể hiện καί. Đại từ “ông” phân biệt Giăng với Đức Giê-su một cách tự nhiên.
theological_decisions:
- issue: Cách dịch κύριος khi môn đồ thưa với Đức Giê-su
  choice: Chúa
  alternative: Thầy
  rationale: “Chúa” duy trì cách dịch nhất quán của κύριος và không làm nhẹ đi khả năng mang ý nghĩa tôn kính hoặc thần học của danh xưng; câu này tự nó không buộc phải xác định mức độ hàm ý ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su”, “ngài”, “môn đồ”, “thưa” và “Lạy Chúa” để phù hợp với văn thuật chuyện Kinh Thánh. Không thêm chú thích vì câu không có dị bản hay điểm mơ hồ nào cần giải thích trong bản văn chính.
