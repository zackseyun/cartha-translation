id: LUK.11.24
reference: Luke 11:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: vi
  text: 'Khi thần ô uế ra khỏi một người, nó đi qua những nơi không có nước[a], tìm chỗ nghỉ. Nhưng không tìm được, nó nói: “Ta sẽ trở về nhà ta, là nơi ta đã đi ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những nơi khô hạn.” Tiếng Hy Lạp nói sát nghĩa là những nơi không có nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Khi
  rationale: Diễn đạt tự nhiên mệnh đề thời gian mang tính khái quát đi với động từ giả định; “mỗi khi” cũng có thể hiểu được nhưng dễ làm câu nặng hơn.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: uế linh
  rationale: Giữ ý về một linh thể ô uế và tính tác nhân có ngôi vị trong văn cảnh, không giản lược thành ẩn dụ hay lực vô ngôi.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: ra khỏi một người
  rationale: “Ra khỏi” giữ hình ảnh rời khỏi một người; “một người” diễn đạt tự nhiên trường hợp đại diện dù tiếng Hy Lạp dùng mạo từ xác định.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: nó đi qua những nơi không có nước
  rationale: “Không có nước” chuyển tải trực tiếp nghĩa của ἀνύδρων và giữ hình ảnh hoang vắng mà không diễn giải quá mức.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: tìm chỗ nghỉ
  rationale: Cách nói hiện đại, tự nhiên trong tiếng Việt, vẫn giữ ý tìm kiếm sự nghỉ ngơi.
- source_word: καὶ μὴ εὑρίσκον
  choice: Không tìm được
  rationale: Tân ngữ “chỗ nghỉ” được hiểu từ vế trước; cách diễn đạt này gọn và giữ mạch kể ở hiện tại.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Ta sẽ trở về nhà ta
  rationale: Giữ thì tương lai biểu thị quyết định và hình ảnh cụ thể về “nhà”; đại từ “ta” phù hợp lời tự nói.
- source_word: ὅθεν ἐξῆλθον
  choice: nơi ta đã ra khỏi
  rationale: Giữ sự liên hệ trực tiếp với động từ “ra khỏi” ở đầu câu và không làm mờ hình ảnh rời khỏi rồi trở lại.
theological_decisions:
- issue: Bản chất của τὸ ἀκάθαρτον πνεῦμα
  choice: Dịch là “uế linh”, như một tác nhân có ngôi vị biết đi, tìm và nói.
  alternative: Hiểu thuần túy là ẩn dụ cho sự tái phạm đạo đức hoặc một lực vô ngôi.
  rationale: Ngữ pháp và văn cảnh trình bày linh này như một tác nhân hành động; bản dịch không nên giải huyền thoại hóa hay thu hẹp câu vào một cách giải thích ẩn dụ.
- issue: Tính đại diện của τοῦ ἀνθρώπου
  choice: Dịch là “một người”.
  alternative: Dịch là “người ấy” hoặc “người đàn ông”.
  rationale: Danh từ Hy Lạp số ít giống đực ở đây chỉ một con người trong trường hợp minh họa, không nhất thiết nhấn mạnh giới tính sinh học; “một người” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hiện tại khái quát của lời minh họa, duy trì phép nhân cách hóa rõ ràng của uế linh, đồng thời dùng chú thích để nêu cách dịch truyền thống “những nơi khô hạn”.
