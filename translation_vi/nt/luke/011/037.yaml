revisions:
- from: Khi Ngài đang nói, một người Pha-ri-si mời Ngài dùng bữa với mình.[a] Ngài vào nhà rồi nằm nghiêng bên bàn ăn.[b]
  to: Khi Ngài đang nói, một người Pha-ri-si mời Ngài dùng bữa[a] với ông. Ngài bước vào và nằm nghiêng bên bàn ăn.[b]
  rationale: Sửa “vào nhà” thành “bước vào” để không thêm địa điểm mà nguyên văn không nói. Chuyển ký hiệu a đến ngay sau “dùng bữa” để neo chú thích đúng cụm từ được giải thích. Các yếu tố khác được giữ lại vì phản ánh đúng nghĩa, văn phong và bối cảnh văn hóa của câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và ý chính: đang khi Chúa Giê-su nói, một người Pha-ri-si mời Ngài dùng bữa, rồi Ngài đi vào và nằm nghiêng để dùng bữa. Tuy nhiên, “vào nhà” thêm một địa điểm không được nêu rõ trong tiếng Hy Lạp; παρ’ αὐτῷ chỉ cho biết lời mời dùng bữa với người ấy/tại chỗ người ấy. Nên tránh đưa “nhà” vào câu chính.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng vừa phải. “Bước vào” tự nhiên hơn “vào nhà rồi” mà không cần bổ sung địa điểm. Đặt ký hiệu chú thích ngay sau “dùng bữa” và “bàn ăn” xác định rõ từ/cụm từ được chú thích.
  terminology: “Pha-ri-si” và “Ngài” phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. “Nằm nghiêng bên bàn ăn” diễn đạt đúng tư thế dùng bữa cổ đại của ἀνέπεσεν, không giản lược thành chỉ “ngồi.” “Mời” là cách chuyển ngữ tự nhiên theo chức năng lời yêu cầu trong ngữ cảnh, dù ἐρωτᾷ theo nghĩa gốc là “hỏi/xin.”
  issues:
  - severity: medium
    issue: Cụm “Ngài vào nhà rồi” thêm địa điểm “nhà”.
    rationale: Động từ εἰσελθών chỉ nói Ngài đã đi/bước vào; bản văn không nêu rõ “nhà.” Dù địa điểm này có thể được suy ra từ bối cảnh một bữa ăn, câu dịch không nên xác định hóa điều hàm ý.
  - severity: low
    issue: Vị trí ký hiệu chú thích a hiện ở sau cả câu thay vì sát cụm “dùng bữa”.
    rationale: Chú thích a giải thích ἀριστήσῃ/dùng bữa; neo chú thích ngay sau cụm này rõ ràng hơn.
