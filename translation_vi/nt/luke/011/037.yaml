base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: vi
  text: Khi Ngài đang nói, một người Pha-ri-si mời Ngài dùng bữa[a] với ông. Ngài bước vào và nằm nghiêng bên bàn ăn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có thể chỉ việc ăn bữa sáng hoặc một bữa ăn vào đầu ngày; tại đây, từ này được dịch theo nghĩa rộng là “dùng bữa.”
    reason: lexical_alternative
  - marker: b
    text: Theo phong tục trong những bữa ăn trang trọng thời ấy, người ta thường nằm nghiêng bên bàn ăn.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Khi Ngài đang nói
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hai hành động đồng thời; cách dịch này tự nhiên và giữ sắc thái tiếp diễn.
- source_word: ἐρωτᾷ
  choice: mời
  rationale: Động từ cơ bản có nghĩa là hỏi hoặc yêu cầu, nhưng mệnh đề chỉ mục đích dùng bữa khiến lời yêu cầu trong ngữ cảnh này mang chức năng một lời mời. Tiếng Việt dùng “mời” tự nhiên hơn mà không thay đổi nội dung hành động.
- source_word: Φαρισαῖος
  choice: một người Pha-ri-si
  rationale: Danh từ số ít không có mạo từ xác định chỉ một thành viên chưa được xác định của nhóm Pha-ri-si.
- source_word: ὅπως ἀριστήσῃ
  choice: dùng bữa
  rationale: ἀριστάω có thể chỉ bữa ăn vào buổi sáng hoặc ban ngày; “dùng bữa” giữ nghĩa rộng, tránh xác định thời điểm mà văn cảnh không cho biết chắc chắn.
- source_word: παρ’ αὐτῷ
  choice: với mình
  rationale: Cụm từ có nghĩa sát là “với ông ấy/tại chỗ ông ấy.” Đại từ phản thân “mình” làm rõ người Pha-ri-si mời Đức Giê-su cùng dùng bữa, nhưng không đưa địa điểm “nhà” vào chính cụm từ này.
- source_word: εἰσελθὼν
  choice: Ngài vào nhà rồi
  rationale: Phân từ quá khứ chỉ hành động đi vào xảy ra trước động từ chính. “Nhà” được bổ sung theo ngữ cảnh của việc đi vào nơi dùng bữa, giúp câu tiếng Việt tự nhiên.
- source_word: ἀνέπεσεν
  choice: nằm nghiêng bên bàn ăn
  rationale: Động từ chỉ tư thế ngả hoặc nằm nghiêng để dùng bữa theo phong tục thời đó, chứ không đơn thuần là ngồi xuống.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để nối với nhân vật đã được nhắc trong văn cảnh; giữ cách gọi quen thuộc “người Pha-ri-si.” Các dấu chú thích được đặt ngay sau cụm từ mà chúng giải thích.
