source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: vi
  text: Vì ai xin thì nhận được, ai tìm thì thấy, và ai gõ thì sẽ được mở cửa cho.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp không nêu rõ điều được mở; “cửa” được thêm theo ngữ cảnh để câu tiếng Việt tự nhiên.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ai
  rationale: Dùng theo nghĩa phân phối với phân từ được danh từ hóa; cấu trúc “ai... thì...” tự nhiên trong tiếng Việt và giữ phạm vi phổ quát.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối lời khẳng định này với lời khuyên ở câu trước.
- source_word: ὁ αἰτῶν
  choice: ai xin
  rationale: Diễn đạt tự nhiên một người nói chung được đặc trưng bởi hành động xin; không giới hạn giới tính.
- source_word: λαμβάνει
  choice: nhận được
  rationale: Tương ứng trực tiếp và trang trọng vừa phải trong ngữ cảnh xin và nhận.
- source_word: ὁ ζητῶν
  choice: ai tìm
  rationale: Giữ nghĩa khái quát của phân từ hiện tại mà không thêm đối tượng tìm kiếm.
- source_word: εὑρίσκει
  choice: thấy
  rationale: Là cách diễn đạt Việt ngữ tự nhiên trong cặp quen thuộc “tìm thì thấy”.
- source_word: τῷ κρούοντι
  choice: ai gõ
  rationale: Cấu trúc đề-thuyết “ai gõ thì...” chuyển tải tự nhiên người hưởng hành động bị động, dù không mô phỏng máy móc cách dữ cách của tiếng Hy Lạp.
- source_word: ἀνοιγήσεται
  choice: sẽ được mở cho
  rationale: Giữ thể tương lai bị động và không tự ý nêu rõ vật được mở; “cho” thể hiện người được hưởng hành động.
theological_decisions:
- issue: Phạm vi và sức mạnh của lời hứa phổ quát
  choice: Trình bày như một nguyên tắc phổ quát, không thêm điều kiện.
  alternative: Hiểu như lời khích lệ cường điệu hoặc thêm điều kiện như “ai cầu xin đúng cách”.
  rationale: Bản Hy Lạp phát biểu một châm ngôn phổ quát không kèm điều kiện trong ngữ cảnh dạy về cầu nguyện; bản dịch giữ nguyên sức căng thần học ấy.
- issue: Đối tượng ngầm của ἀνοιγήσεται
  choice: 'Không nêu rõ đối tượng trong chính văn: “sẽ được mở cho”.'
  alternative: Nêu rõ “cửa sẽ được mở”.
  rationale: Ngữ cảnh gợi đến cửa, nhưng tiếng Hy Lạp không nói rõ đối tượng; chính văn giữ sự hàm ẩn và chú thích cung cấp cách hiểu theo ngữ cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc song hành “ai... thì...” giữ nhịp điệu châm ngôn của ba vế và tránh đại từ mang giới tính.
