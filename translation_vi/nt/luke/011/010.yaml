  rationale: Bản sửa chỉ thêm “cửa” ở vế cuối để khắc phục cấu trúc bị lửng trong tiếng Việt. Chú thích bảo tồn sự minh bạch về việc nguyên văn Hy Lạp không nêu đối tượng được mở, đồng thời không thêm bất cứ điều kiện hay cách giải thích thần học nào vào lời hứa phổ quát.
