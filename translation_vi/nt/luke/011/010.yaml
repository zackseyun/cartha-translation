review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng tính giải thích của γάρ (“Vì”), phạm vi phổ quát của πᾶς, và chuỗi song hành xin—nhận, tìm—thấy, gõ—được mở. Tuy nhiên, “ai gõ thì sẽ được mở cho” không xác định được điều gì được mở trong tiếng Việt và vì thế không truyền đạt được mệnh đề bị động một cách rõ ràng. Thêm “cửa” là cần thiết cho ngữ pháp và cách dùng tự nhiên của tiếng Việt; chú thích cần cho biết đây là yếu tố được bổ sung theo ngữ cảnh, không phải đối tượng được nêu trong tiếng Hy Lạp.
  naturalness: 'Hai vế đầu tự nhiên, gọn và có nhịp điệu châm ngôn. Vế cuối của bản nháp bị lửng: “được mở cho” đòi hỏi một đối tượng như “cửa” trong tiếng Việt. “sẽ được mở cửa cho” là cấu trúc hiện đại, tự nhiên, vẫn giữ người gõ là người thụ hưởng hành động.'
  terminology: “xin,” “nhận được,” “tìm,” “thấy,” và “gõ” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Cửa” trong vế cuối là cách cụ thể hóa tối thiểu theo ngữ cảnh của hành động gõ/mở, không diễn giải thêm điều kiện thần học nào.
  issues:
  - severity: medium
    issue: Vế cuối thiếu đối tượng của động từ “mở” trong tiếng Việt.
