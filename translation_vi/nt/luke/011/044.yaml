  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: vi
  text: Khốn cho các người, vì các người giống như những ngôi mộ không có dấu; người ta đi trên chúng mà không biết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Khốn cho các người!
  rationale: Giữ sắc thái lời tuyên cáo tai họa và quở trách trực tiếp; “các người” phù hợp với đối tượng bị Đức Giê-su khiển trách trong ngữ cảnh.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: những ngôi mộ không có dấu
  rationale: ἄδηλα chỉ những ngôi mộ không thể nhận ra hoặc không được đánh dấu; cách dịch này tự nhiên và giữ hình ảnh nguyên bản.
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: người ta đi trên đó
  rationale: οἱ ἄνθρωποι mang nghĩa khái quát là con người/người ta, không nhấn mạnh giới tính; “đi trên đó” phản ánh περιπατοῦντες ἐπάνω.
- source_word: οὐκ οἴδασιν
  choice: mà không biết
  rationale: Diễn đạt gọn và tự nhiên việc họ không nhận biết rằng mình đang đi trên các ngôi mộ.
theological_decisions:
- issue: Hàm ý về sự ô uế do bước trên mộ
  choice: Giữ nguyên hình ảnh mà không giải thích thêm trong câu
  alternative: Thêm rõ rằng họ bị ô uế mà không biết
  rationale: Nguyên văn chỉ nói người ta không biết; hậu quả nghi lễ được gợi ra bởi bối cảnh Do Thái nhưng không được phát biểu trực tiếp, nên không nên đưa phần diễn giải vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Dùng “các người” để giữ giọng quở trách mạnh; dùng “người ta” thay vì từ ngữ chỉ riêng nam giới vì οἱ ἄνθρωποι ở đây có nghĩa chung.
