  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: vi
  text: 'Và tôi nói với anh em: Hãy xin, anh em sẽ được ban cho; hãy tìm, anh em sẽ tìm thấy; hãy gõ cửa, cửa sẽ được mở cho anh em.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch các mệnh lệnh hiện tại trong tiếng Hy Lạp với sắc thái tiếp diễn: “Cứ xin… cứ tìm… cứ gõ cửa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: Còn tôi nói với anh em rằng
  rationale: Κἀγώ nối lời khuyên này với phần dạy trước và nhấn mạnh chủ thể “tôi”; “Còn tôi” diễn đạt tự nhiên sự tiếp nối có nhấn mạnh. ὑμῖν là số nhiều, được thể hiện bằng “anh em”.
- source_word: αἰτεῖτε
  choice: hãy xin
  rationale: Trong ngữ cảnh cầu nguyện, “xin” tự nhiên và chính xác hơn “hỏi”, đồng thời không nói rõ đối tượng khi nguyên văn cũng không nêu.
- source_word: δοθήσεται ὑμῖν
  choice: anh em sẽ được ban cho
  rationale: Giữ thể bị động của nguyên văn và hướng lời hứa đến người nghe; không nêu tác nhân ban cho vì tiếng Hy Lạp cũng để ngầm.
- source_word: ζητεῖτε, καὶ εὑρήσετε
  choice: hãy tìm, anh em sẽ tìm thấy
  rationale: Giữ cấu trúc mệnh lệnh–lời hứa và phạm vi nghĩa rộng, có thể hiểu theo cả nghĩa trực tiếp lẫn nghĩa ẩn dụ.
- source_word: κρούετε
  choice: hãy gõ cửa
  rationale: Tiếng Hy Lạp chỉ nói “gõ”, nhưng trong tiếng Việt “gõ cửa” là cách nói tự nhiên và làm rõ vật được ngầm hiểu, không thay đổi hình ảnh.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: cửa sẽ mở cho anh em
  rationale: “Cửa” được suy ra trực tiếp từ hành động gõ cửa. Cách diễn đạt giữ ý bị động/không nêu người mở, dù tiếng Việt dùng cấu trúc tự nhiên “cửa sẽ mở”.
theological_decisions:
- issue: Thể của các mệnh lệnh hiện tại αἰτεῖτε, ζητεῖτε, κρούετε
  choice: Dùng các mệnh lệnh đơn giản “hãy xin… hãy tìm… hãy gõ cửa” trong chính văn.
  alternative: “Cứ xin… cứ tìm… cứ gõ cửa” để nhấn mạnh hành động tiếp diễn hoặc lặp lại.
  rationale: Mệnh lệnh hiện tại Hy Lạp có thể gợi hành động bền bỉ hoặc lặp lại, nhưng không phải lúc nào cũng buộc phải diễn đạt như vậy. Chính văn giữ độ mở của nguyên bản; chú thích nêu khả năng nhấn mạnh sự kiên trì.
- issue: Tác nhân của các động từ bị động δοθήσεται và ἀνοιγήσεται
  choice: 'Không nêu tác nhân: “sẽ được ban cho”, “cửa sẽ mở”.'
  alternative: Nêu rõ Đức Chúa Trời là Đấng ban và mở.
  rationale: Ngữ cảnh có thể hàm ý Đức Chúa Trời, nhưng nguyên văn không gọi tên tác nhân. Không thêm tác nhân giúp bảo toàn cách diễn đạt và sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν, phù hợp lời Chúa Giê-su nói với các môn đồ; lặp đại từ ở mỗi vế để duy trì nhịp song song và tránh mơ hồ. Dấu chú thích đặt sau toàn bộ chuỗi mệnh lệnh vì áp dụng cho cả ba động từ.
