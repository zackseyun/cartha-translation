  terminology: “Xin,” “tìm,” “gõ cửa,” và “được ban cho” là các lựa chọn phù hợp. “Anh em” chuyển đạt ngôi thứ hai số nhiều một cách thích hợp trong văn cảnh lời dạy dành cho các môn đồ.
