id: LUK.11.19
reference: Luke 11:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: vi
  text: Nhưng nếu tôi nhờ Bê-ên-xê-bun mà đuổi quỷ, thì các con trai của các ông nhờ ai[a] mà đuổi chúng? Vì thế, chính họ sẽ là người xét xử các ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nhờ ai” cũng có thể dịch là “nhờ điều gì” hoặc “nhờ quyền năng nào.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ ἐγὼ
  choice: Nhưng nếu tôi
  rationale: “Nhưng” diễn đạt sắc thái đối lập nhẹ của δέ trong lập luận; đại từ “tôi” giữ sự tương phản do ἐγώ được nêu rõ.
- source_word: ἐν Βεελζεβοὺλ
  choice: nhờ Bê-ên-xê-bun
  rationale: ἐν ở đây chỉ tác nhân hoặc phương tiện. “Nhờ” tự nhiên trong tiếng Việt và không thêm từ “quyền năng,” vốn mang tính diễn giải.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: đuổi các quỷ
  rationale: Trong ngữ cảnh trừ quỷ, ἐκβάλλω mang nghĩa đuổi ra; tiếng Việt có thể nói tự nhiên là “đuổi các quỷ” mà không cần lặp từ “ra.”
- source_word: οἱ υἱοὶ ὑμῶν
  choice: con cái các ông
  rationale: Giữ hình ảnh quan hệ huyết thống của υἱοί nhưng dùng “con cái” tự nhiên hơn “các con trai” trong lời chất vấn này, đồng thời không giải quyết thành “môn đồ” hay “người theo các ông.”
- source_word: ἐν τίνι
  choice: nhờ ai
  rationale: Cụm từ hỏi về tác nhân hoặc phương tiện; “ai” phù hợp với sự đối chiếu trực tiếp với Bê-ên-xê-bun, dù về ngữ pháp cũng có thể hiểu là “nhờ điều gì/quyền năng nào.”
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Diễn đạt ngắn gọn kết luận suy ra từ câu hỏi tu từ trước đó.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: chính họ sẽ là người xét xử các ông
  rationale: “Chính họ” giữ sự nhấn mạnh của αὐτοί; “người xét xử” diễn đạt tự nhiên vai trò κριταί trong tiếng Việt.
theological_decisions:
- issue: Danh tính của “con cái các ông”
  choice: Giữ cách gọi “con cái các ông.”
  alternative: môn đồ các ông; người theo các ông; những người đồng bào của các ông
  rationale: Nguyên văn dùng υἱοί, còn danh tính chính xác của nhóm người trừ quỷ này không được xác định trong câu. Bản dịch không nên tự ý giải quyết sự mơ hồ ấy.
- issue: Tác nhân hay quyền năng trong ἐν τίνι
  choice: Dịch “nhờ ai” trong chính văn.
  alternative: nhờ điều gì; nhờ quyền năng nào
  rationale: “Nhờ ai” giữ thế đối chiếu với nhân vật Bê-ên-xê-bun, nhưng chú thích bảo lưu khả năng hiểu câu hỏi theo phương tiện hoặc quyền năng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để thể hiện số nhiều của ὑμῶν và giọng tranh luận trực tiếp; phiên âm tên riêng Βεελζεβούλ là “Bê-ên-xê-bun.”
