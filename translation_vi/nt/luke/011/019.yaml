revisions:
- from: Nhưng nếu tôi nhờ Bê-ên-xê-bun mà đuổi các quỷ, thì con cái các ông nhờ ai mà đuổi chúng? Vì thế, chính họ sẽ là người xét xử các ông.[a]
  to: Nhưng nếu tôi nhờ Bê-ên-xê-bun mà đuổi quỷ, thì các con trai của các ông nhờ ai[a] mà đuổi chúng? Vì thế, chính họ sẽ là người xét xử các ông.
  rationale: Đổi "con cái" thành "các con trai" để phản ánh chính xác υἱοί mà không diễn giải họ là môn đồ hay một nhóm cụ thể. Chuyển neo [a] đến ngay sau "nhờ ai" để khớp với phạm vi của chú thích. Các lựa chọn còn lại được giữ vì truyền đạt trung thành và tự nhiên lập luận của câu Hy Lạp.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:11Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ tốt cấu trúc lập luận, tác nhân "Bê-ên-xê-bun," động từ trừ quỷ, và sự nhấn mạnh của αὐτοί trong "chính họ." Tuy nhiên, οἱ υἱοὶ ὑμῶν nghĩa đen là "các con trai của các ông," không phải "con cái các ông" (một cách nói bao gồm cả con gái).
  naturalness: Câu văn nhìn chung hiện đại và rõ ràng. "Các con trai của các ông" vẫn tự nhiên trong văn cảnh tranh biện và bảo toàn cách diễn đạt của nguyên văn.
  terminology: '"Bê-ên-xê-bun," "quỷ," và "người xét xử" phù hợp. Cần đặt ký hiệu chú thích ngay sau "nhờ ai," là cụm mà chú thích giải thích, thay vì đặt cuối câu.'
  issues:
  - severity: medium
    issue: '"con cái các ông" làm rộng nghĩa của υἱοί.'
    rationale: υἱοί là số nhiều giống đực của "con trai". Dù cụm từ có thể được hiểu theo lối gọi nhóm người liên hệ với đối tượng đang bị chất vấn, bản dịch tối ưu-tương-đương không nên chuyển thành cách gọi bao gồm cả hai giới mà nguyên văn không nói.
  - severity: medium
    issue: Ký hiệu chú thích [a] đang neo ở cuối câu, không cạnh "nhờ ai."
    rationale: Nội dung chú thích nêu các phương án cho ἐν τίνι/"nhờ ai"; neo chú thích tại cuối câu có thể khiến người đọc tưởng chú thích áp dụng cho mệnh đề kết luận "chính họ sẽ là người xét xử."
  revised_text: Nhưng nếu tôi nhờ Bê-ên-xê-bun mà đuổi quỷ, thì các con trai của các ông nhờ ai[a] mà đuổi chúng? Vì thế, chính họ sẽ là người xét xử các ông.
