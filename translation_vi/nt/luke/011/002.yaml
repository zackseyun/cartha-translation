  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: vi
  text: 'Ngài nói với họ: “Khi cầu nguyện, anh em hãy nói:


    ‘Lạy Cha,

    nguyện danh Cha được tôn là thánh.[a]

    Nguyện vương quốc Cha đến.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nguyện danh Cha được nhìn nhận là thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: Khi cầu nguyện
  rationale: Diễn đạt tự nhiên một điều kiện thời gian mang tính khái quát; bao hàm việc cầu nguyện thường xuyên mà không cần thêm từ làm nặng câu.
- source_word: λέγετε
  choice: anh em hãy nói
  rationale: Mệnh lệnh hiện tại được chuyển bằng lối nói tự nhiên trong tiếng Việt, phù hợp với lời chỉ dạy dành cho các môn đồ.
- source_word: Πάτερ
  choice: Lạy Cha
  rationale: Giữ đúng danh xưng số ít trong bản Hy Lạp; từ “Lạy” biểu thị cách xưng hô trực tiếp, trang trọng trong lời cầu nguyện, nhưng không thêm “chúng con” như bản song song ở Ma-thi-ơ.
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: nguyện danh Cha được tôn thánh
  rationale: Giữ thể bị động và sắc thái khẩn nguyện của mệnh lệnh cách; “tôn thánh” nói đến việc danh Đức Chúa Trời được nhìn nhận và đối đãi là thánh, không hàm ý danh Ngài vốn chưa thánh.
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: Nguyện vương quốc Cha đến
  rationale: “Nguyện” chuyển tải lực cầu xin của mệnh lệnh cách; “vương quốc” bảo tồn hình ảnh βασιλεία, vốn có thể bao hàm cả quyền trị vì lẫn phạm vi cai trị.
theological_decisions:
- issue: Danh xưng Πάτερ không có đại từ sở hữu
  choice: Lạy Cha
  alternative: Lạy Cha chúng con
  rationale: Theo SBLGNT, Lu-ca ở đây chỉ có Πάτερ. Không hòa đồng câu này với Ma-thi-ơ 6:9 hoặc truyền thống phụng vụ.
- issue: Ý nghĩa của ἁγιασθήτω τὸ ὄνομά σου
  choice: nguyện danh Cha được tôn thánh
  alternative: nguyện danh Cha được giữ thánh; nguyện danh Cha nên thánh
  rationale: Cách dịch được chọn giữ nguyên lời cầu xin và thể bị động, đồng thời tránh gợi ý rằng danh Đức Chúa Trời cần trở nên thánh hơn về bản thể.
- issue: Phạm vi nghĩa của βασιλεία
  choice: vương quốc
  alternative: quyền trị vì; vương quyền
  rationale: “Vương quốc” là cách nói dễ hiểu, giữ được hình ảnh Kinh Thánh và không thu hẹp sự mơ hồ chân thực giữa sự cai trị của Đức Chúa Trời và thực tại thuộc về sự cai trị ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “anh em” cho đại từ số nhiều αὐτοῖς/đối tượng của mệnh lệnh; dùng “Cha” nhất quán trong lời cầu nguyện. Bố cục xuống dòng làm rõ ba lời khẩn nguyện mà không thêm nội dung ngoài bản Hy Lạp.
