  to: 'Ngài nói với họ: “Khi cầu nguyện, anh em hãy nói:


    ‘Lạy Cha,

    nguyện danh Cha được tôn là thánh.[a]

    Nguyện vương quốc Cha đến.’”'
  rationale: Chỉ sửa cách diễn đạt “được tôn thánh” thành “được tôn là thánh” để bảo đảm tiếng Việt hiện đại tự nhiên và minh bạch hơn. Bản sửa không thêm nội dung, không thay đổi chủ ngữ sở hữu của Πάτερ, và vẫn giữ thể cầu nguyện bị động của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
