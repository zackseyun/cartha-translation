source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: vi
  text: Khốn cho các ngươi, hỡi người Pha-ri-si, vì các ngươi ưa thích những ghế danh dự[a] trong các hội đường và những lời chào[b] ở các chợ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những ghế hàng đầu” hoặc “những chỗ danh dự.”
    reason: lexical_alternative
  - marker: b
    text: Tức là những lời chào công khai bày tỏ sự kính trọng và công nhận địa vị xã hội.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Khốn cho
  rationale: Giữ sức nặng của lời quở trách mang tính tiên tri, tự nhiên hơn trong tiếng Việt Kinh Thánh hiện đại so với một tiếng than đơn thuần.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: các ngươi, những người Pha-ri-si
  rationale: Giữ lời nói trực tiếp và xác định rõ đối tượng; “các ngươi” phù hợp với giọng quở trách nghiêm khắc trong ngữ cảnh.
- source_word: ὅτι
  choice: Vì
  rationale: Dẫn vào lý do của lời tuyên bố “Khốn cho” một cách rõ ràng và tự nhiên.
- source_word: ἀγαπᾶτε
  choice: ưa ... và thích
  rationale: Trong ngữ cảnh này, động từ chỉ sự ham chuộng địa vị và sự nhìn nhận của công chúng; cách diễn đạt biến đổi nhẹ để câu tiếng Việt tự nhiên mà vẫn giữ cùng một động từ chi phối hai tân ngữ trong ý nghĩa.
- source_word: τὴν πρωτοκαθεδρίαν
  choice: những ghế danh dự
  rationale: Diễn đạt cụ thể các chỗ ngồi hàng đầu mang địa vị cao trong hội đường, tránh khiến “ghế tốt nhất” bị hiểu chủ yếu là tiện nghi.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: trong các hội đường
  rationale: “Hội đường” là cách gọi tiếng Việt quen thuộc cho nơi nhóm họp của người Do Thái.
- source_word: τοὺς ἀσπασμοὺς
  choice: được người ta kính chào
  rationale: Làm rõ đây không chỉ là lời chào thông thường mà là sự chào hỏi công khai thể hiện sự kính trọng và địa vị.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: ở các quảng trường
  rationale: ἀγορά chỉ không gian công cộng dùng làm nơi họp chợ và giao tiếp xã hội; “quảng trường” làm nổi bật bối cảnh công khai, với chú thích bảo lưu nghĩa “nơi họp chợ”.
theological_decisions:
- issue: Tính chất lời lên án của Chúa Giê-su
  choice: Một lời tuyên bố khốn họa mang tính tiên tri, lên án việc người Pha-ri-si ham chuộng danh dự công khai.
  alternative: Chỉ là lời phê bình xã hội về cách cư xử không đúng.
  rationale: οὐαί cùng mệnh đề nêu lý do tạo nên một lời lên án đạo đức và thuộc linh nghiêm trọng; bản dịch giữ sức nặng đó mà không thêm kết luận giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái đối diện, quở trách mạnh của câu nói; “Pha-ri-si” và “hội đường” theo cách dùng Kinh Thánh tiếng Việt phổ biến. Mọi chú thích đều có ký hiệu tương ứng trong chính văn.
