review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng lời khốn họa, hội đường và các ghế có địa vị. Tuy nhiên, ἀγαπᾶτε là một động từ cùng chi phối cả hai tân ngữ; cách dùng hai động từ “ưa ... và thích được người ta kính chào” làm diễn giải mạnh hơn nguyên văn. τοὺς ἀσπασμοὺς trước hết là “những lời chào”; sắc thái chào hỏi tôn vinh nên để trong chú thích. ἀγοραῖς là các không gian chợ/công cộng; “các chợ” sát nghĩa cơ bản hơn “các quảng trường” trong chính văn.
  naturalness: Bản sửa giữ giọng văn trang trọng, hiện đại và lời đối diện nghiêm khắc. “Hỡi người Pha-ri-si” là cách xưng hô trực tiếp tự nhiên; “ưa thích ... và ...” phản ánh cấu trúc câu Hy Lạp rõ ràng.
  terminology: Giữ “Pha-ri-si” và “hội đường” theo cách dùng Kinh Thánh tiếng Việt quen thuộc. “Ghế danh dự” diễn đạt πρωτοκαθεδρίαν thích đáng. Chú thích cho “lời chào” nêu đúng chức năng xã hội công khai mà không biến nó thành nội dung bắt buộc của chính văn.
  issues:
  - severity: medium
    issue: Chính văn diễn giải ἀσπασμοὺς là “thích được người ta kính chào”.
    rationale: Nguyên văn nói họ yêu thích “những lời chào”; tính chất tôn vinh công khai là sắc thái ngữ cảnh, không phải một động từ bị động hay từ “kính” được nêu minh thị.
  - severity: low
    issue: Dùng hai động từ “ưa ... và thích” cho một động từ ἀγαπᾶτε.
    rationale: Không sai ý chính, nhưng “ưa thích” dùng một lần cho cả hai tân ngữ bảo tồn cấu trúc và sức nhấn của nguyên văn tốt hơn.
  - severity: low
    issue: “Các quảng trường” được đặt trong chính văn cho ἀγοραῖς.
    rationale: ἀγορά có thể là quảng trường/chợ, nhưng nghĩa chợ là nền tảng trong ngữ cảnh này; “các chợ” là lựa chọn trực tiếp hơn, còn tính công khai được ghi chú.
