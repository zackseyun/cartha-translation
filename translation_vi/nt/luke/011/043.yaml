revisions:
- from: Khốn cho các ngươi, những người Pha-ri-si! Vì các ngươi ưa những ghế danh dự[a] trong các hội đường và thích được người ta kính chào[b] ở các quảng trường.
  to: Khốn cho các ngươi, hỡi người Pha-ri-si, vì các ngươi ưa thích những ghế danh dự[a] trong các hội đường và những lời chào[b] ở các chợ.
  rationale: Bản sửa đưa “lời chào” và “các chợ” vào chính văn theo nghĩa trực tiếp của ἀσπασμοὺς và ἀγοραῖς, đồng thời chuyển sắc thái tôn vinh công khai sang chú thích. Cụm “ưa thích ... và ...” phản ánh một động từ ἀγαπᾶτε chi phối hai đối tượng, không thay đổi ý nghĩa hay thêm diễn giải.
