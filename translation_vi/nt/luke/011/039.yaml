id: LUK.11.39
reference: Luke 11:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: vi
  text: 'Nhưng Chúa phán với ông: “Này, người Pha-ri-si các ông làm sạch bên ngoài chén và đĩa, nhưng bên trong các ông đầy lòng tham[a] và sự gian ác.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự cướp bóc”, “chiếm đoạt” hoặc “tống tiền”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Giữ tước hiệu quen thuộc trong Tân Ước, phù hợp với vai trò của Đức Giê-su trong lời thuật.
- source_word: Νῦν
  choice: Này
  rationale: Dùng như một từ dẫn nhập lời quở trách trực diện; tự nhiên hơn “bây giờ” trong tiếng Việt ở ngữ cảnh này.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: người Pha-ri-si các ông
  rationale: Thể hiện sắc thái nhấn mạnh của đại từ cùng danh từ chỉ nhóm người, đồng thời duy trì lời nói trực tiếp.
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: bên ngoài chén và đĩa
  rationale: Cách diễn đạt cụ thể, dễ hiểu, giữ nguyên hình ảnh bề ngoài của hai vật dụng.
- source_word: καθαρίζετε
  choice: làm sạch
  rationale: Diễn đạt hành động hiện tại theo cách tự nhiên, không thêm ý nghi lễ vốn không được nói rõ trong câu.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: bên trong các ông
  rationale: Giữ hình ảnh đối lập giữa bên ngoài và bên trong, không diễn giải thành “lòng” hay “tâm hồn” cho toàn cụm.
- source_word: γέμει
  choice: đầy
  rationale: Tương đương ngắn gọn và tự nhiên với động từ chỉ trạng thái chứa đầy.
- source_word: ἁρπαγῆς
  choice: lòng tham
  rationale: Trong lời lên án phẩm chất bên trong, “lòng tham” truyền đạt tính chiếm đoạt và ham lợi; chú thích bảo lưu các nghĩa cụ thể hơn.
- source_word: πονηρίας
  choice: sự gian ác
  rationale: Giữ mức độ nghiêm trọng và phạm vi đạo đức rộng của từ Hy Lạp.
theological_decisions:
- issue: Sở chỉ của hình ảnh “bên trong”
  choice: Giữ “bên trong các ông”
  alternative: “lòng các ông” hoặc “con người bên trong của các ông”
  rationale: Bản Hy Lạp cố ý đối lập phần bên ngoài của vật dụng với tình trạng bên trong của người Pha-ri-si; không xác định thêm một quan năng tâm lý hay tâm linh.
- issue: Ý nghĩa đạo đức của ἁρπαγή
  choice: “lòng tham” trong chính văn, kèm chú thích các nghĩa cụ thể
  alternative: “sự cướp bóc”, “chiếm đoạt” hoặc “tống tiền”
  rationale: “Lòng tham” phù hợp với sự bại hoại bên trong được lên án, nhưng trường nghĩa của từ cũng bao gồm hành vi cưỡng đoạt nên cần được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Pha-ri-si” là dạng phiên âm dễ nhận biết. Dùng “các ông” để thể hiện số nhiều và sắc thái quở trách mà không trở nên thô tục.
