id: LUK.11.29
reference: Luke 11:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: vi
  text: 'Khi đám đông đang tụ lại, Ngài bắt đầu nói: “Thế hệ này là một thế hệ gian ác. Họ tìm kiếm một dấu lạ, nhưng sẽ không có dấu lạ nào được ban cho họ, ngoại trừ dấu lạ của Giô-na.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dấu lạ của Giô-na” có thể chỉ chính Giô-na như một dấu lạ qua sứ mạng tiên tri của ông; đối chiếu với các đoạn song song trong sách Tin Mừng, cụm từ này cũng có thể gợi đến mối liên hệ hình bóng với sự chết và sống lại của Chúa Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: đang tụ lại
  rationale: Phân từ hiện tại trong kết cấu sở hữu tuyệt đối diễn tả hành động đang tiếp diễn đồng thời với động từ chính; cách dịch này tự nhiên và giữ ý đoàn dân đang tập hợp.
- source_word: ἤρξατο λέγειν
  choice: bắt đầu nói
  rationale: Giữ nguyên sắc thái khởi đầu của kết cấu Hy Lạp bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: γενεά
  choice: thế hệ
  rationale: Đây là nghĩa thông thường và bảo toàn chiều kích vừa thời đại vừa tập thể của lời phán.
- source_word: πονηρά
  choice: gian ác
  rationale: Diễn đạt trực tiếp sự phán xét về đạo đức, với văn phong trang trọng nhưng vẫn dễ hiểu.
- source_word: σημεῖον
  choice: dấu lạ
  rationale: Trong văn cảnh này, từ chỉ một dấu hiệu mang tính xác chứng và hàm ý việc phi thường; “dấu lạ” tự nhiên hơn “dấu hiệu” trong tiếng Việt Kinh Thánh mà không giải thích quá mức.
- source_word: ζητεῖ
  choice: tìm kiếm
  rationale: Bám sát nghĩa cơ bản của động từ; thái độ đòi hỏi được để cho văn cảnh biểu đạt thay vì đưa thẳng vào bản dịch.
- source_word: δοθήσεται
  choice: sẽ ... được ban cho
  rationale: Giữ rõ thì tương lai và thể bị động của nguyên văn.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Phù hợp với kết cấu loại trừ theo sau mệnh đề phủ định.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: dấu lạ của Giô-na
  rationale: Giữ nguyên tính mở của sở hữu cách Hy Lạp, không quyết định đó là dấu lạ do Giô-na làm, chính Giô-na là dấu lạ, hay một liên hệ hình bóng khác.
theological_decisions:
- issue: Phạm vi lời kết án “thế hệ này”
  choice: Giữ như một nhận định đạo đức mang tính tập thể về những người đương thời với Chúa Giê-su.
  alternative: Chỉ giới hạn vào một số đối thủ cụ thể đang hiện diện.
  rationale: Cụm danh từ được lặp lại trong nguyên văn tạo sức nhấn mạnh và không tự giới hạn đối tượng vào một nhóm hẹp.
- issue: Ý nghĩa của “dấu lạ của Giô-na”
  choice: Giữ nguyên cách diễn đạt sở hữu cách trong câu chính và chú thích tính đa nghĩa.
  alternative: Giải thích trực tiếp là sứ mạng rao giảng của Giô-na, hoặc là hình bóng về sự chết và sống lại của Chúa Giê-su.
  rationale: Văn cảnh kế tiếp trong Lu-ca làm sáng tỏ cụm từ theo một hướng, còn các đoạn song song trong Tin Mừng gợi thêm liên hệ hình bóng; bản dịch không nên âm thầm chọn một cách hiểu duy nhất.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo văn phong kính trọng; dùng “đoàn dân đông” cho ὄχλοι và “dấu lạ” cho σημεῖον. Dữ liệu tư vấn tiếng Anh đặt nhầm dấu chú thích [a] sau “were gathering” dù nội dung chú thích nói về “wicked generation”; vì chú thích ấy chỉ là một phương án từ vựng gần nghĩa và không cần thiết cho độc giả Việt, bản thảo không giữ chú thích sai vị trí đó. Mọi dấu chú thích được dùng đều xuất hiện trong câu chính.
