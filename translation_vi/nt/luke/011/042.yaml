id: LUK.11.42
reference: Luke 11:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: vi
  text: Nhưng khốn cho các ông, những người Pha-ri-si! Vì các ông dâng một phần mười bạc hà, cửu lý hương và mọi thứ rau, nhưng lại bỏ qua công lý và tình yêu dành cho Đức Chúa Trời.[a] Các ông phải thực hành những điều này mà không bỏ bê những điều kia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “tình yêu dành cho Đức Chúa Trời” cũng có thể được hiểu là “tình yêu của Đức Chúa Trời.”
    reason: τοῦ θεοῦ là sở hữu cách và có thể được hiểu theo nghĩa khách thể hoặc chủ thể; cần bảo tồn sự mơ hồ có thật của nguyên văn.
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: khốn cho các ông
  rationale: Giữ sức nặng của lời cảnh cáo và phán xét, đồng thời dùng đại từ xưng hô tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀποδεκατοῦτε
  choice: dâng một phần mười
  rationale: Diễn đạt rõ hành động nộp phần mười theo luật lệ tôn giáo, dễ hiểu hơn một thuật ngữ chuyên biệt.
- source_word: ἡδύοσμον
  choice: bạc hà
  rationale: Tên gọi thông dụng của mint trong tiếng Việt.
- source_word: πήγανον
  choice: cửu lý hương
  rationale: Tên tiếng Việt của rue (Ruta graveolens), giữ đúng loài thảo mộc được nêu.
- source_word: πᾶν λάχανον
  choice: mọi thứ rau
  rationale: λάχανον có nghĩa rộng là rau hoặc cây rau vườn; cách dịch này giữ phạm vi khái quát.
- source_word: παρέρχεσθε
  choice: bỏ qua
  rationale: Truyền đạt hình ảnh không dành sự quan tâm hoặc không thực hành điều đáng phải làm; tự nhiên hơn lối dịch sát chữ 'đi ngang qua'.
- source_word: κρίσιν
  choice: công lý
  rationale: Trong ngữ cảnh trách nhiệm đạo đức, từ này chỉ sự công chính và cách đối xử đúng đắn, không chỉ hành vi xét xử.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: tình yêu dành cho Đức Chúa Trời
  rationale: Chọn cách hiểu khách thể của sở hữu cách, phù hợp với cặp nghĩa 'công lý' và lòng yêu kính Đức Chúa Trời, nhưng ghi chú giữ lại khả năng ngữ pháp khác.
- source_word: παρεῖναι
  choice: sao nhãng
  rationale: Diễn tả việc bỏ bê hoặc không thực hiện; phù hợp với thế đối xứng giữa hai nhóm bổn phận.
theological_decisions:
- issue: Quan hệ giữa việc thực hành công lý, tình yêu và việc dâng phần mười
  choice: Các ông phải thực hành những điều này mà không được sao nhãng những điều kia
  alternative: Chỉ nhấn mạnh công lý và tình yêu, như thể Chúa Giê-su bãi bỏ việc dâng phần mười
  rationale: Mệnh đề Hy Lạp xác nhận bổn phận thực hành nhóm thứ nhất đồng thời không bỏ nhóm thứ hai; bản dịch giữ nguyên sự căng thẳng này mà không suy diễn thành một quy định rộng hơn cho mọi cộng đồng.
- issue: Nghĩa của ἀγάπην τοῦ θεοῦ
  choice: tình yêu dành cho Đức Chúa Trời
  alternative: tình yêu của Đức Chúa Trời
  rationale: Sở hữu cách Hy Lạp có thể mang nghĩa khách thể hoặc chủ thể. Trong lời quở trách về điều người Pha-ri-si phải làm, nghĩa yêu kính Đức Chúa Trời có vẻ phù hợp hơn; chú thích công khai phương án còn lại.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, trực tiếp và dễ hiểu. Dùng “các ông” vì lời quở trách hướng đến một nhóm nam giới có địa vị tôn giáo; giữ tên gọi quen thuộc “Pha-ri-si.”
