  terminology: “Pha-ri-si,” “dâng một phần mười,” “công lý,” và “Đức Chúa Trời” phù hợp. Cách dịch chính “tình yêu dành cho Đức Chúa Trời” chọn nghĩa khách thể, còn chú thích nêu đúng phương án nghĩa chủ thể mà không quyết đoán quá mức.
