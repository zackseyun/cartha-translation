  source_fidelity: Bản dịch truyền đạt đúng lời khốn, việc nộp phần mười các rau thơm, sự bỏ qua công lý và ἀγάπην τοῦ θεοῦ, cùng mệnh lệnh giữ cả hai nhóm bổn phận. Chú thích bảo tồn hợp lý tính mơ hồ của sở hữu cách τοῦ θεοῦ. Tuy nhiên, “sao nhãng” ở mệnh đề cuối nhẹ và kém trực tiếp hơn παρεῖναι trong đối lập này; “bỏ bê” phản ánh rõ hơn ý không bỏ điều kia.
