language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: vi
  text: 'Đang khi Đức Chúa Jêsus nói những điều ấy, một phụ nữ từ trong đám đông cất tiếng nói với Ngài: “Phước cho dạ đã cưu mang Ngài[a] và đôi vú đã cho Ngài bú!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã mang Ngài trong dạ.” Động từ Hy Lạp nói đến việc mang hoặc cưu mang; trong ngữ cảnh này là việc mang thai.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Khi
  rationale: Trong tiếng Việt hiện đại, công thức chuyển tiếp của Lu-ca được diễn đạt tự nhiên bằng mệnh đề thời gian; tránh lối dịch cổ và nặng nề như “Bấy giờ xảy ra rằng” mà vẫn đánh dấu diễn tiến của câu chuyện.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: Đức Chúa Jêsus đang nói những điều ấy
  rationale: “đang nói” giữ sắc thái đồng thời và tiếp diễn của cấu trúc ἐν + động từ nguyên mẫu có mạo từ; “những điều ấy” giữ đại từ chỉ định.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: một người phụ nữ ... cất tiếng nói
  rationale: “cất tiếng” là thành ngữ tiếng Việt tự nhiên cho hành động nâng giọng để nói giữa đám đông; τις được biểu đạt bằng “một”, không thêm sắc thái đặc biệt.
- source_word: ἐκ τοῦ ὄχλου
  choice: trong đám đông
  rationale: Diễn đạt tự nhiên vị trí/xuất xứ của người phụ nữ trong tập thể; không làm thay đổi ý rằng bà thuộc về hoặc lên tiếng từ đám đông.
- source_word: Μακαρία
  choice: Phước cho
  rationale: Giữ sắc thái tuyên bố một người ở trong địa vị đáng chúc phước, thay vì chỉ nói đến cảm xúc vui vẻ hay may mắn.
- source_word: ἡ κοιλία
  choice: lòng
  rationale: “lòng” trong thành ngữ “lòng cưu mang” chỉ dạ mẹ một cách rõ ràng, trang trọng và tự nhiên trong tiếng Việt Kinh Thánh; không dùng nghĩa rộng “bụng”.
- source_word: ἡ βαστάσασά σε
  choice: đã cưu mang Ngài
  rationale: “cưu mang” bao quát việc mang thai và phù hợp ngữ cảnh người mẹ; giữ khả năng nghĩa của βαστάζω mà không diễn đạt thô cứng.
- source_word: μαστοὶ
  choice: đôi vú
  rationale: Giữ hình ảnh giải phẫu cụ thể của nguyên văn và số nhiều; “đôi” là cách nói tự nhiên trong tiếng Việt.
- source_word: οὓς ἐθήλασας
  choice: đã cho Ngài bú
  rationale: 'Chuyển quan hệ theo cách nói tự nhiên của tiếng Việt: người mẹ/bầu vú cho con bú; truyền đạt chính xác hành động bú mẹ mà không dùng lối dịch gượng.'
theological_decisions:
- issue: Cách dịch μακαρία trong lời tôn vinh mẹ của Đức Chúa Jêsus
  choice: Phước cho lòng đã cưu mang Ngài, và đôi vú đã cho Ngài bú!
  alternative: Hạnh phúc thay lòng... / May mắn thay lòng...
  rationale: “Phước cho” giữ sức nặng tôn kính của μακαρία nhưng không khuếch đại hoặc giảm nhẹ vai trò của mẹ Đức Chúa Jêsus ngoài điều người phụ nữ thực sự thốt lên; nhờ đó bảo toàn sự căng thẳng với lời đáp ở câu kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ tôn kính “Ngài” để nhận diện rõ chủ thể trong câu đứng riêng. Cấu trúc được làm tự nhiên theo tiếng Việt nhưng vẫn giữ lời chúc phước cùng hình ảnh cụ thể của nguyên văn.
