  source_fidelity: 'Bản chính chuyển tải đúng mệnh đề mục đích/kết quả của ἵνα và ý nghĩa tư pháp của ἐκζητηθῇ: thế hệ này bị quy trách nhiệm về máu của mọi nhà tiên tri. Cụm “từ thuở sáng thế” phản ánh chính xác ἀπὸ καταβολῆς κόσμου. Việc chuyển cấu trúc bị động “máu ... bị đòi từ nơi thế hệ này” thành “thế hệ này phải chịu trách nhiệm” là tự nhiên trong tiếng Việt và không thêm một cơ chế thần học nào.'
