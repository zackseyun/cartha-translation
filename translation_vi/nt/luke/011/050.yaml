  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: vi
  text: để thế hệ này phải chịu trách nhiệm[a] về máu của tất cả các nhà tiên tri—máu đã đổ ra từ thuở sáng thế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát cấu trúc hơn: “để máu của tất cả các nhà tiên tri, đã đổ ra từ thuở sáng thế, bị đòi từ thế hệ này.” Động từ Hy Lạp mang ý truy cứu trách nhiệm về máu đã đổ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giữ sắc thái mục đích hoặc kết quả của liên từ Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐκζητηθῇ
  choice: phải chịu trách nhiệm về
  rationale: 'Trong ngữ cảnh máu bị đổ, động từ thụ động mang sắc thái tư pháp: bị gọi ra để trả lời và chịu trách nhiệm. Cách diễn đạt này rõ nghĩa trong tiếng Việt mà không ấn định cụ thể hình thức phán xét.'
- source_word: τὸ αἷμα
  choice: máu
  rationale: Giữ nguyên hình ảnh cụ thể của nguyên bản; ở đây “máu” cũng gợi đến trách nhiệm về việc sát hại các nhà tiên tri.
- source_word: πάντων τῶν προφητῶν
  choice: của tất cả các nhà tiên tri
  rationale: Chuyển tải trực tiếp kết cấu sở hữu và giữ phạm vi bao quát của πάντων.
- source_word: τὸ ἐκκεχυμένον
  choice: máu đã đổ ra
  rationale: Phân từ hoàn thành thụ động bổ nghĩa cho “máu”; “đổ máu” là cách nói tự nhiên về cái chết do bạo lực.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: từ thuở sáng thế
  rationale: Diễn đạt tự nhiên thành ngữ chỉ thời điểm đặt nền hoặc khởi đầu thế giới, đồng thời giữ sắc thái Kinh Thánh trang trọng.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: thế hệ này phải chịu trách nhiệm
  rationale: Đưa tác thể mà trách nhiệm bị đòi hỏi lên làm chủ thể trong tiếng Việt để tránh lối nói gượng “máu bị đòi từ thế hệ này”, nhưng vẫn giữ đúng quan hệ tư pháp của câu Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của việc máu các nhà tiên tri bị đòi nơi thế hệ này
  choice: Diễn đạt như sự quy trách nhiệm mang tính tư pháp đối với thế hệ này về máu các nhà tiên tri.
  alternative: Hiểu chủ yếu như một lời mô tả tu từ về sự tiếp nối lịch sử, không nhấn mạnh sự phán xét.
  rationale: ἐκζητέω ở thể thụ động trong ngữ cảnh đổ máu tự nhiên mang nghĩa đòi giải trình hoặc truy cứu trách nhiệm. Bản dịch giữ sức nặng ấy nhưng không giải thích thêm thế hệ này dự phần vào trách nhiệm tập thể theo cơ chế nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang làm rõ rằng “đã đổ ra” bổ nghĩa cho “máu”, không phải cho “các nhà tiên tri”. Cụm “từ thuở sáng thế” giữ sắc thái Kinh Thánh nhưng vẫn quen thuộc trong tiếng Việt phổ thông.
