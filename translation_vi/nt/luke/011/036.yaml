id: LUK.11.36
reference: Luke 11:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: vi
  text: Vậy, nếu toàn thân con tràn đầy ánh sáng, không có phần nào tối tăm, thì toàn thân con sẽ hoàn toàn sáng, như khi ngọn đèn chiếu sáng con bằng ánh sáng rực rỡ[a] của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng ánh chớp của nó.” Từ Hy Lạp có thể chỉ tia chớp hoặc độ sáng; trong ngữ cảnh này, có lẽ nói đến ánh sáng ngọn đèn tỏa ra, chứ không phải sét theo nghĩa đen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: thân
  rationale: Giữ hình ảnh cụ thể về thân thể trong lời nói liên quan đến mắt và ánh sáng; kết hợp với “toàn” thành cách nói tự nhiên “toàn thân”, không diễn giải thành linh hồn hay đời sống nội tâm.
- source_word: ὅλον
  choice: toàn
  rationale: Giữ sức nhấn mạnh bao quát của từ được dùng hai lần, đồng thời tạo câu tiếng Việt tự nhiên với “toàn thân”.
- source_word: φωτεινόν
  choice: tràn đầy ánh sáng / sáng rực
  rationale: Lần đầu dùng “tràn đầy ánh sáng” để làm rõ sự đối lập với phần tối tăm; lần sau dùng “sáng rực” cho câu tự nhiên mà vẫn giữ ý toàn thân được soi sáng hoàn toàn.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: không có phần nào tối tăm
  rationale: Thể hiện tự nhiên giá trị của cụm phủ định với μέρος τι, đồng thời giữ nguyên hình ảnh một phần của thân thể có thể tối.
- source_word: ἔσται
  choice: sẽ
  rationale: Diễn đạt trực tiếp thì tương lai của εἰμί bằng tiếng Việt hiện đại.
- source_word: ὡς ὅταν
  choice: như khi
  rationale: Giữ cả quan hệ so sánh lẫn sắc thái thời gian của cụm Hy Lạp.
- source_word: λύχνος
  choice: ngọn đèn
  rationale: Chỉ vật cụ thể là đèn, không phải ánh sáng trừu tượng hay chân đèn.
- source_word: τῇ ἀστραπῇ
  choice: ánh sáng
  rationale: Trong ngữ cảnh ngọn đèn làm chủ thể, từ này hợp lý nhất là ánh lóe hoặc độ sáng của đèn, chứ không phải sét theo nghĩa đen; chú thích bảo lưu khả năng dịch sát khác.
- source_word: φωτίζῃ σε
  choice: chiếu ... trên con
  rationale: Giữ đối tượng ngôi thứ hai số ít σε và diễn đạt tự nhiên hành động ngọn đèn soi sáng một người.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “thân” và “ánh sáng”
  choice: Giữ nguyên hình ảnh thân thể, ánh sáng và bóng tối.
  alternative: Diễn giải “thân” là toàn thể con người, nội tâm hoặc tình trạng thuộc linh.
  rationale: Câu này tiếp nối hình ảnh mắt là đèn của thân thể. Diễn giải rõ thành một phạm trù giáo lý sẽ giải quyết điều mà bản văn chủ ý để ở dạng ẩn dụ.
- issue: Quan hệ điều kiện giữa hai vế
  choice: Giữ cấu trúc “nếu ... thì ...”.
  alternative: Hiểu εἰ chủ yếu theo nghĩa xác nhận “vì/quả thật”.
  rationale: εἰ οὖν tự nhiên tạo một kết luận có điều kiện từ lời nói trước; cách dịch này giữ được lực lập luận mà không biến giả định thành lời xác nhận tuyệt đối.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng đại từ “con” để phản ánh ngôi thứ hai số ít trong lời dạy trực tiếp. Nhịp “Vậy, nếu ... thì ...” giữ rõ cấu trúc lập luận; hình ảnh cụ thể không bị thần học hóa bằng lối diễn giải.
