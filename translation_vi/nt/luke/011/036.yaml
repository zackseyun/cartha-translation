revisions:
- from: Vậy, nếu toàn thân con tràn đầy ánh sáng, không có phần nào tối tăm, thì toàn thân con sẽ sáng rực, như khi ngọn đèn chiếu ánh sáng[a] trên con.
  to: Vậy, nếu toàn thân con tràn đầy ánh sáng, không có phần nào tối tăm, thì toàn thân con sẽ hoàn toàn sáng, như khi ngọn đèn chiếu sáng con bằng ánh sáng rực rỡ[a] của nó.
  rationale: 'Sửa cụm động từ cuối để tiếng Việt tự nhiên và để phản ánh chính xác cú pháp: ngọn đèn soi sáng người được nói đến, bằng ánh sáng/ánh chớp của nó. Thêm “hoàn toàn” cho lần δεύτερη của ὅλον nhằm bảo lưu sự nhấn mạnh lặp lại trong bản gốc. Không diễn giải ẩn dụ thân thể và ánh sáng.'
  reviewer_model: gpt-5.6-terra
