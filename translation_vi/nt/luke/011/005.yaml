revisions:
- from: 'Ngài phán với họ: “Ai trong các con có một người bạn, rồi nửa đêm đến gặp người ấy và nói: ‘Bạn ơi, cho tôi mượn ba ổ bánh,’”'
  to: 'Ngài phán với họ: “Ai trong anh em có một người bạn mà nửa đêm đến gặp người ấy và nói: ‘Bạn ơi, cho tôi mượn ba ổ bánh,’”'
  rationale: Chỉ điều chỉnh đại từ xưng hô để không thêm quan hệ không có trong nguyên văn, và làm mượt liên kết cú pháp. Câu vẫn giữ cấu trúc bỏ ngỏ và dấu phẩy cuối vì lời nói tiếp tục ở câu sau.
