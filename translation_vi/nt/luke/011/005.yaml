  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: vi
  text: 'Ngài phán với họ: “Ai trong anh em có một người bạn mà nửa đêm đến gặp người ấy và nói: ‘Bạn ơi, cho tôi mượn ba ổ bánh,’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Ai trong các con
  rationale: Mở đầu câu hỏi tu từ hướng trực tiếp đến các môn đồ; cách diễn đạt này tự nhiên trong tiếng Việt và không làm giảm tính chất thách thức của câu hỏi.
- source_word: ἕξει ... καὶ πορεύσεται
  choice: có ... rồi ... đến
  rationale: Các dạng tương lai Hy Lạp nằm trong câu hỏi tu từ và có thể được diễn đạt tự nhiên bằng hiện tại trong tiếng Việt; “rồi” thể hiện diễn tiến mà không ép sắc thái thời gian tương lai vốn kém tự nhiên ở đây.
- source_word: φίλον / Φίλε
  choice: người bạn / Bạn ơi
  rationale: Giữ sự lặp lại từ vựng của φίλος, đồng thời dùng hình thức xưng gọi tự nhiên trong lời nói trực tiếp.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: đến gặp người ấy
  rationale: Diễn đạt tự nhiên cả chuyển động lẫn đích đến là người bạn; không thêm ý nghĩa ngoài ngữ cảnh.
- source_word: μεσονυκτίου
  choice: nửa đêm
  rationale: Đối ứng trực tiếp và thông dụng cho trạng ngữ thời gian của μεσονύκτιον.
- source_word: χρῆσόν μοι
  choice: cho tôi mượn
  rationale: Diễn đạt lời yêu cầu cung cấp tạm thời một cách tự nhiên; giữ ý vay mượn thay vì chỉ xin hoặc được cung cấp.
- source_word: τρεῖς ἄρτους
  choice: ba ổ bánh
  rationale: ἄρτοι chỉ các ổ bánh; “ổ bánh” rõ ràng, tự nhiên và tránh hiểu là ba mẩu bánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su và “các con” trong lời Ngài nói với các môn đồ. Cấu trúc được giữ mở vì câu nói tiếp tục sang câu kế tiếp; dấu phẩy cuối phản ánh tính chưa hoàn tất của câu trích dẫn.
