translation:
  language: vi
  text: Xin ban cho chúng con mỗi ngày bánh cần dùng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tính từ Hy Lạp được dịch là “cần dùng” rất hiếm và ý nghĩa còn gây tranh luận. Cũng có thể dịch là “bánh hằng ngày,” “bánh cho ngày sắp đến,” hoặc “bánh cần thiết để sống”; ít có khả năng hơn trong văn cảnh này là “bánh siêu bản thể.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: bánh
  rationale: Danh từ chỉ bánh theo nghĩa trực tiếp và trong lời cầu nguyện cũng có thể đại diện cho lương thực thiết yếu; giữ “bánh” bảo toàn hình ảnh cụ thể và truyền thống của câu.
- source_word: ἡμῶν
  choice: chúng con
  rationale: Đại từ sở hữu số nhiều được diễn đạt tự nhiên trong tiếng Việt bằng cấu trúc “bánh chúng con cần dùng”; “chúng con” cũng phù hợp với lời cầu nguyện hướng về Đức Chúa Trời.
- source_word: ἐπιούσιον
  choice: cần dùng trong ngày ấy
  rationale: Tính từ hiếm và gây tranh luận này có thể chỉ điều cần thiết hoặc bánh dành cho ngày đang đến. Cách diễn đạt này tự nhiên hơn việc lặp “hằng ngày mỗi ngày”, đồng thời không thu hẹp hoàn toàn nghĩa vào một cách hiểu duy nhất.
- source_word: δίδου
  choice: xin ban
  rationale: Thể mệnh lệnh hiện tại diễn tả lời thỉnh cầu có tính tiếp diễn; “xin ban” là cách nói tự nhiên, trang trọng trong lời cầu nguyện, còn ý lặp lại được thể hiện bằng “mỗi ngày”.
- source_word: ἡμῖν
  choice: cho chúng con
  rationale: Giữ rõ đối tượng tiếp nhận của động từ và dùng đại từ phù hợp với văn cảnh cầu nguyện.
- source_word: τὸ καθ’ ἡμέραν
  choice: Mỗi ngày
  rationale: Cụm này nhấn mạnh sự chu cấp lặp lại từng ngày. Đưa lên đầu câu tạo tiếng Việt tự nhiên và tránh hai cụm “hằng ngày” đứng gần nhau.
theological_decisions:
- issue: Ý nghĩa của ἐπιούσιον trong Bài Cầu Nguyện của Chúa
  choice: cần dùng trong ngày ấy
  alternative: hằng ngày; dành cho ngày sắp đến; cần thiết để sống; siêu bản thể
  rationale: Cụm τὸ καθ’ ἡμέραν của Lu-ca đặt lời cầu xin trong nhịp chu cấp từng ngày, nhưng bản thân ἐπιούσιον vẫn hiếm và không chắc nghĩa. Bản chính diễn đạt sự cần dùng theo ngày mà không đưa cách hiểu bí tích hay siêu hình vào câu; chú thích giữ các khả năng khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “chúng con” theo văn cảnh lời cầu nguyện. Trật tự “Mỗi ngày” làm nổi bật sắc thái lặp lại của τὸ καθ’ ἡμέραν và tránh cách nói gượng do lặp ý.
