revisions:
- from: Mỗi ngày, xin ban cho chúng con bánh chúng con cần dùng trong ngày ấy.[a]
  to: Xin ban cho chúng con mỗi ngày bánh cần dùng.[a]
  rationale: Sửa “cần dùng trong ngày ấy” thành “cần dùng” để không thêm ý chỉ định về thời điểm và để phân biệt rõ tính từ ἐπιούσιον với cụm trạng ngữ τὸ καθ’ ἡμέραν (“mỗi ngày”). Chú thích được chỉnh để phản ánh minh bạch tính đa nghĩa đang tranh luận của từ Hy Lạp hiếm này.
  reviewer_model: gpt-5.6-terra
