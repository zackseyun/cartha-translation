- from: Vậy, hãy coi chừng, kẻo ánh sáng trong anh lại là bóng tối.[a]
  to: Vậy, hãy coi chừng kẻo ánh sáng trong bạn là bóng tối.[a]
  rationale: Bản sửa thay đại từ có sắc thái giới tính bằng đại từ số ít bao quát hơn và bỏ “lại” để không thêm sắc thái diễn giải. Cấu trúc cảnh báo, liên từ suy luận, và hình ảnh ẩn dụ của nguyên văn vẫn được giữ nguyên. Chú thích vẫn nêu được cách diễn đạt thay thế hợp lý của cấu trúc σκόπει … μή.
