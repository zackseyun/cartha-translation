  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: vi
  text: Vậy, hãy coi chừng kẻo ánh sáng trong bạn là bóng tối.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vậy, hãy bảo đảm rằng ánh sáng trong bạn không phải là bóng tối.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκόπει
  choice: hãy coi chừng
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số ít, mang sắc thái cảnh báo và kêu gọi sự cảnh giác liên tục. “Hãy coi chừng” tự nhiên trong tiếng Việt hiện đại và giữ được lực cảnh báo.
- source_word: οὖν
  choice: vậy
  rationale: Đánh dấu kết luận rút ra từ lời dạy ngay trước đó về mắt, ánh sáng và tình trạng bên trong. “Vậy” nối kết lập luận rõ ràng, tự nhiên.
- source_word: μὴ
  choice: kẻo
  rationale: Đi với mệnh lệnh để cảnh báo về một khả năng không mong muốn. “Kẻo” diễn đạt ngắn gọn và đúng sắc thái phòng ngừa.
- source_word: τὸ φῶς
  choice: ánh sáng
  rationale: Giữ nguyên hình ảnh ẩn dụ của nguyên văn, không thu hẹp thành sự hiểu biết, lương tâm hay một trạng thái tâm linh cụ thể.
- source_word: τὸ ἐν σοὶ
  choice: trong anh
  rationale: Cách diễn đạt trực tiếp của cụm giới từ; đại từ số ít phù hợp với σοὶ và giữ lời cảnh báo hướng đến từng người nghe.
- source_word: σκότος
  choice: bóng tối
  rationale: Giữ sự tương phản trực tiếp với “ánh sáng” và phạm vi ẩn dụ rộng của nguyên văn.
- source_word: ἐστίν
  choice: lại là
  rationale: “Là” chuyển tải hệ từ; từ “lại” giúp câu cảnh báo tự nhiên hơn trong tiếng Việt và làm nổi bật nghịch lý ánh sáng hóa ra là bóng tối mà không thêm một nội dung giáo lý riêng.
theological_decisions:
- issue: Ý nghĩa ẩn dụ của “ánh sáng” và “bóng tối”
  choice: Giữ nguyên hai hình ảnh trong câu chính, không xác định “ánh sáng” chỉ là sự hiểu biết, lương tâm hay tình trạng tâm linh.
  alternative: Diễn giải thành “sự hiểu biết trong anh”, “ánh sáng nội tâm của anh” hoặc “lương tâm anh”.
  rationale: Câu nói của Chúa Giê-su dùng hình ảnh có phạm vi rộng, gắn với phần trước về khả năng nhìn nhận và tình trạng bên trong. Giữ nguyên ẩn dụ bảo toàn sự đa nghĩa và căng thẳng thần học của bản Hy Lạp.
- issue: Sắc thái của mệnh đề sau μή
  choice: 'Dịch theo hướng cảnh báo: “kẻo … lại là”.'
  alternative: 'Dịch như một lời yêu cầu trực tiếp: “hãy bảo đảm rằng … không phải là”.'
  rationale: Cấu trúc σκόπει … μή có thể được diễn đạt như lời cảnh báo hoặc lời nhắc phải bảo đảm điều trái lại. Bản chính ưu tiên lực cảnh báo, còn cách hiểu kia được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” để phản ánh đại từ ngôi thứ hai số ít của nguyên văn; giữ nguyên phép đối lập “ánh sáng—bóng tối” và nhịp cảnh báo ngắn gọn.
