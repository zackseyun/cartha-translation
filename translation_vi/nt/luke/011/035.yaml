review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc cảnh báo của σκόπει οὖν μή, cũng như hình ảnh đối lập “ánh sáng—bóng tối”. Tuy nhiên, “lại” không có đối ứng trực tiếp trong ἐστίν; dù có thể tạo sắc thái tự nhiên, từ này thêm nét ‘hóa ra/trở thành’ không cần thiết. Bỏ từ này sẽ sát nguyên văn hơn.
  naturalness: “Hãy coi chừng” và “kẻo” là tự nhiên, rõ nghĩa, với văn phong trang trọng vừa phải. Dùng “bạn” thay cho “anh” giúp lời cảnh báo ngôi thứ hai số ít có thể hướng đến mọi người nghe trong tiếng Việt hiện đại mà không mặc định giới tính.
  terminology: “Ánh sáng” và “bóng tối” chuyển tải chính xác φῶς và σκότος, đồng thời bảo toàn ẩn dụ mở của câu. Không nên diễn giải chúng thành lương tâm, tri thức, hay một ý nghĩa thần học chuyên biệt.
  issues:
  - severity: low
    issue: Đại từ “anh” có sắc thái mặc định nam giới.
    rationale: Dù σοὶ là số ít, bản Hy Lạp không xác định người nghe là nam. “Bạn” vẫn là ngôi thứ hai số ít tự nhiên trong tiếng Việt hiện đại và bao quát hơn.
  - severity: low
    issue: Từ “lại” thêm sắc thái không được nêu rõ trong nguyên văn.
    rationale: ἐστίν chỉ là hệ từ “là”. Trong ngữ cảnh cảnh báo, “lại” có thể gợi ý ‘hóa ra’ hoặc sự đảo ngược; bỏ đi bảo toàn sự ngắn gọn và tính mở của phép ẩn dụ.
  revised_text: Vậy, hãy coi chừng kẻo ánh sáng trong bạn là bóng tối.[a]
