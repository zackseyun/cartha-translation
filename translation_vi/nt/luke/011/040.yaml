  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: vi
  text: Hỡi những kẻ ngu dại! Đấng đã làm nên bên ngoài chẳng phải cũng làm nên bên trong sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phần bên ngoài ... phần bên trong.” Cách nói này có thể chỉ cả mặt ngoài và mặt trong của vật dụng trong ngữ cảnh gần, đồng thời mở rộng đến đời sống bề ngoài và nội tâm của con người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Thật ngu dại!
  rationale: Tính từ số nhiều dùng như danh từ để quở trách trực tiếp. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ được sắc thái mạnh mà không thêm đại từ không có trong nguyên văn.
- source_word: οὐχ ... ἐποίησεν;
  choice: chẳng phải ... sao?
  rationale: Câu hỏi phủ định chờ câu trả lời khẳng định; cấu trúc “chẳng phải ... sao?” thể hiện đúng lực tu từ trong tiếng Việt.
- source_word: ὁ ποιήσας
  choice: Đấng đã làm nên
  rationale: Phân từ có mạo từ được dùng như danh từ. “Đấng” giữ tham chiếu ngầm đến Đức Chúa Trời mà không chèn danh xưng “Đức Chúa Trời” vốn không xuất hiện trong tiếng Hy Lạp.
- source_word: τὸ ἔξωθεν
  choice: bên ngoài
  rationale: Giữ nghĩa phần hoặc phương diện ở ngoài, vừa phù hợp với hình ảnh chén đĩa trong ngữ cảnh gần, vừa cho phép liên hệ đến đời sống bề ngoài.
- source_word: τὸ ἔσωθεν
  choice: bên trong
  rationale: Song song với “bên ngoài”, giữ được cả hình ảnh vật chứa lẫn hàm ý về thực tại nội tâm.
- source_word: καὶ
  choice: cũng
  rationale: Trong câu hỏi tu từ, “cũng” làm rõ lập luận rằng Đấng làm nên bên ngoài đồng thời làm nên bên trong.
theological_decisions:
- issue: Đối tượng được nói đến qua ὁ ποιήσας
  choice: Giữ tham chiếu ngầm đến Đấng Tạo Hóa bằng từ “Đấng”, không thêm tên gọi cụ thể.
  alternative: Hiểu theo nghĩa trực tiếp hơn là người làm ra chiếc chén hoặc vật dụng.
  rationale: Lời nói vừa vận hành qua hình ảnh chén đĩa trong ngữ cảnh, vừa hàm ý rộng hơn về Đấng tạo nên con người cả bề ngoài lẫn bên trong. Bản dịch không thu hẹp về một tầng nghĩa duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Lời quở trách được giữ sắc bén; câu hỏi tu từ tự nhiên. Cặp “bên ngoài/bên trong” bảo toàn tính cô đọng và độ rộng nghĩa của nguyên văn.
