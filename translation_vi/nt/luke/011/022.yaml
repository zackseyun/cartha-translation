reference: Luke 11:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: vi
  text: Nhưng khi một người mạnh hơn người ấy đến đối đầu với người ấy và thắng người ấy[a], người đó tước lấy toàn bộ khí giới của người ấy, thứ mà người ấy đã tin cậy[b], rồi phân chia chiến lợi phẩm của người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chế ngự người ấy” hoặc “đánh bại người ấy”.
    reason: lexical_alternative
  - marker: b
    text: “Toàn bộ khí giới” chỉ một bộ trang bị chiến đấu đầy đủ.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Nhưng khi
  rationale: Diễn đạt tự nhiên sắc thái thời gian–điều kiện của ἐπάν, còn δέ đánh dấu sự tương phản với tình huống ở câu trước.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: một người mạnh hơn
  rationale: Tính từ so sánh được dùng như danh từ; tiếng Việt cần thêm “người” để câu tự nhiên, nhưng không xác định danh tính hay vai trò của nhân vật.
- source_word: ἐπελθὼν
  choice: đến tấn công
  rationale: Trong bối cảnh giao chiến, động từ chỉ việc tiến đến chống lại người kia; “đến tấn công” rõ nghĩa hơn “đến trên” mà không thêm cách giải thích thần học.
- source_word: νικήσῃ αὐτόν
  choice: thắng người ấy
  rationale: νικάω chỉ việc chiến thắng hay đánh bại; “thắng” ngắn gọn, tự nhiên và vẫn giữ các sắc thái khả dĩ được nêu trong chú thích.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: toàn bộ khí giới
  rationale: πανοπλία là trọn bộ trang bị chiến đấu. “Toàn bộ khí giới” vừa thể hiện tính đầy đủ vừa phù hợp hình ảnh một người có vũ trang.
- source_word: αἴρει
  choice: tước lấy
  rationale: Trong cảnh người thắng lấy khí giới của kẻ bại, “tước lấy” diễn đạt cụ thể hơn “lấy đi” và không hàm ý vượt quá văn cảnh.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: mà người ấy vẫn tin cậy
  rationale: Thì quá khứ chưa hoàn thành của πεποίθει diễn tả sự tin cậy kéo dài trước khi bị đánh bại; “vẫn tin cậy” chuyển tải sắc thái ấy tự nhiên.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: chiến lợi phẩm của người ấy
  rationale: σκῦλα chỉ những thứ bị lấy từ kẻ chiến bại; “chiến lợi phẩm” giữ rõ hình ảnh xung đột và chiến thắng.
- source_word: διαδίδωσιν
  choice: phân chia
  rationale: Động từ diễn tả việc chia hay phân phát chiến lợi phẩm; “phân chia” tự nhiên và không xác định những người nhận khi bản văn không nêu.
theological_decisions:
- issue: Có nên xác định người mạnh hơn là một nhân vật thần học cụ thể hay không
  choice: Giữ cách gọi không xác định là “một người mạnh hơn”.
  alternative: Nêu rõ người ấy là Chúa Giê-su hoặc một nhân vật cụ thể khác.
  rationale: Bản văn của câu này chỉ dùng tính từ so sánh như danh từ. Việc xác định nhân vật thuộc về cách hiểu văn mạch, không nên được đưa vào chính câu dịch.
- issue: Mức độ mạnh khi dịch νικάω
  choice: Dịch là “thắng người ấy”.
  alternative: “chế ngự người ấy” hoặc “đánh bại người ấy”.
  rationale: “Thắng” giữ nghĩa cốt lõi và sự rộng nghĩa của động từ; chú thích cung cấp hai cách diễn đạt cụ thể hơn mà không buộc bản văn vào riêng một sắc thái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người ấy” để tránh chuỗi đại từ dễ mơ hồ trong tiếng Việt; sự lặp lại có chủ ý giúp phân biệt người mạnh hơn với người bị thắng. Hình ảnh quân sự được giữ nguyên, nhưng không diễn giải danh tính thần học của hai nhân vật.
