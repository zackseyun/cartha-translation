id: LUK.11.12
reference: Luke 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: vi
  text: Hoặc nếu con mình xin một quả trứng, người cha lại cho nó một con bọ cạp sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Hoặc nếu
  rationale: Mở đầu ví dụ song song kế tiếp trong chuỗi câu hỏi tu từ; cách diễn đạt này tự nhiên trong tiếng Việt và không nhấn quá mức καί.
- source_word: αἰτήσει
  choice: xin
  rationale: Động từ ở thể tương lai nằm trong kết cấu mang tính điều kiện của câu hỏi tu từ; “xin” diễn đạt tự nhiên hành động người con yêu cầu cha mình một món ăn.
- source_word: ᾠόν
  choice: một quả trứng
  rationale: Nghĩa trực tiếp, thông dụng của danh từ trong ngữ cảnh.
- source_word: ἐπιδώσει
  choice: lại cho
  rationale: Động từ có nghĩa trao hoặc cho để đáp lại lời xin; “lại” làm rõ sự tương phản trong tiếng Việt mà không thêm ý “thay vào đó” một cách nặng nề.
- source_word: αὐτῷ
  choice: nó
  rationale: Đại từ làm tân ngữ gián tiếp, chỉ người con; “nó” tự nhiên trong lời kể thông thường về con của một người, không mang ý khinh miệt trong ngữ cảnh này.
- source_word: σκορπίον
  choice: một con bọ cạp
  rationale: Cách gọi chuẩn trong tiếng Việt, giữ nguyên hình ảnh tương phản sống động và phi lý với quả trứng.
theological_decisions:
- issue: Sức mạnh tu từ của phép so sánh cha và con
  choice: Giữ dưới dạng câu hỏi tu từ trực tiếp, với sự tương phản được diễn đạt tự nhiên bằng “lại”.
  alternative: Thêm cụm “thay vì quả trứng” để giải thích rõ sự đối lập.
  rationale: Bản Hy Lạp để sự đối lập được ngầm hiểu. Câu tiếng Việt vẫn truyền đạt rõ điều phi lý của hành động này và giữ nguyên lập luận về lòng tốt của người cha, không diễn giải thêm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người cha” để làm rõ chủ thể được tiếp nối từ ngữ cảnh trước; “con mình” và “nó” tạo cách diễn đạt tự nhiên, không quá cổ kính.
