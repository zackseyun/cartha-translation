  verdict: approve
  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố Hy Lạp: ἕτεροι δέ là “Nhưng những người khác”; πειράζοντες được diễn đạt đúng sắc thái ý định bằng “để thử Người”; ἐζήτουν giữ được tính kéo dài qua “cứ đòi”; παρ’ αὐτοῦ được bảo toàn bằng cấu trúc “đòi Người cho”; và σημεῖον ἐξ οὐρανοῦ là “một dấu lạ từ trời.” Không thêm nội dung giải thích vào thân câu.'
  naturalness: Câu tiếng Việt hiện đại, rõ nghĩa và có nhịp văn Kinh Thánh tự nhiên. “Cứ đòi Người cho” tránh được sự lặp lại nặng nề của hai cụm “từ,” đồng thời vẫn phân biệt nguồn người ban với xuất xứ/xác chứng “từ trời.”
  terminology: “Dấu lạ” là thuật ngữ phù hợp cho σημεῖον trong văn mạch này. Viết hoa “Người” nhất quán với quy chiếu đến Đức Giê-su và register Kinh Thánh tiếng Việt. Chú thích nêu một khả năng diễn đạt mà không áp đặt cách hiểu thần học cụ thể.
