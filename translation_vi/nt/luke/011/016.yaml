id: LUK.11.16
reference: Luke 11:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: vi
  text: Nhưng những người khác, để thử Người, cứ đòi Người cho một dấu lạ từ trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một dấu lạ thuộc về trời.”'
    reason: Cụm ἐξ οὐρανοῦ có thể được diễn đạt như nguồn gốc “từ trời” hoặc theo tính chất “thuộc về trời”.
lexical_decisions:
- source_word: ἕτεροι
  choice: những người khác
  rationale: Chỉ một nhóm khác, tương phản với những người vừa được nhắc đến trong ngữ cảnh trước.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý có sắc thái tương phản nhẹ giữa phản ứng của nhóm này và nhóm trước.
- source_word: πειράζοντες
  choice: để thử Người
  rationale: 'Phân từ chỉ mục đích hoặc dụng ý thù nghịch: họ muốn đặt Đức Giê-su vào thế bị thử thách; cách dịch này tự nhiên và không thu hẹp nghĩa thành cám dỗ phạm tội.'
- source_word: σημεῖον
  choice: một dấu lạ
  rationale: Trong văn cảnh, σημεῖον là một dấu hiệu siêu nhiên có ý nghĩa xác chứng; “dấu lạ” là cách diễn đạt quen thuộc mà không giải thích quá mức.
- source_word: ἐξ οὐρανοῦ
  choice: từ trời
  rationale: Giữ nguyên ý về nguồn gốc hoặc sự xác chứng đến từ trời.
- source_word: ἐζήτουν
  choice: cứ đòi
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; trong văn cảnh đối nghịch, “cứ đòi” truyền đạt tự nhiên cả tính kéo dài lẫn thái độ yêu sách.
- source_word: παρ’ αὐτοῦ
  choice: Người cho
  rationale: 'παρά với sở hữu cách chỉ nguồn: họ yêu cầu dấu lạ từ Đức Giê-su. Cấu trúc tiếng Việt “đòi Người cho” bảo toàn quan hệ này và tránh lặp hai lần “từ”.'
theological_decisions:
- issue: Bản chất của dấu lạ được yêu cầu
  choice: một dấu lạ từ trời
  alternative: một dấu lạ thuộc về trời
  rationale: Cách dịch chính giữ được khả năng cụm từ nói đến nguồn gốc hoặc sự xác chứng từ trời, không xác định quá mức loại phép lạ mà họ đòi hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Viết hoa “Người” để quy chiếu rõ đến Đức Giê-su theo lối văn Kinh Thánh tiếng Việt, nhưng không thêm danh xưng vốn không có trong câu Hy Lạp.
