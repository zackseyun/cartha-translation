id: LUK.11.4
reference: Luke 11:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: vi
  text: Xin tha tội cho chúng con, vì chính chúng con cũng tha cho mọi người mắc nợ chúng con.[a] Xin đừng đưa chúng con vào cơn cám dỗ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mọi người nợ chúng con”; tiếng Hy Lạp dùng hình ảnh nợ nần ở đây, dù vế đầu nói đến “tội”.
    reason: lexical_alternative
  - marker: b
    text: Hay “sự thử thách” hoặc “cơn thử luyện”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: xin tha
  rationale: Động từ mệnh lệnh ἀφίημι trong lời cầu nguyện mang nghĩa tự nhiên là xin Đức Chúa Trời tha thứ; thêm “xin” phù hợp lối khẩn cầu trang trọng trong tiếng Việt.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: tội cho chúng con
  rationale: ἁμαρτίας nói rõ về tội lỗi, không phải món nợ; cấu trúc “tha tội cho” tự nhiên và phổ thông trong tiếng Việt.
- source_word: καὶ γὰρ αὐτοὶ
  choice: vì chính chúng con cũng
  rationale: “Vì” thể hiện quan hệ giải thích của γάρ, “chính chúng con” giữ sắc thái nhấn mạnh của αὐτοί, còn “cũng” thể hiện καί.
- source_word: ἀφίομεν
  choice: tha
  rationale: Lặp lại “tha” để giữ liên hệ từ vựng với ἄφες và phù hợp quan hệ liên cá nhân trong ngữ cảnh.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: mọi người mắc nợ chúng con
  rationale: Cách dịch này giữ nguyên hình ảnh nợ nần của ὀφείλω, đồng thời tự nhiên hơn “mọi con nợ của chúng con” trong tiếng Việt hiện đại.
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: xin đừng đưa chúng con vào cơn cám dỗ
  rationale: “Đưa… vào” phản ánh trực tiếp εἰσφέρω mà vẫn tự nhiên; “cơn cám dỗ” là nghĩa phù hợp cho bản văn chính, còn nghĩa “thử thách” được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa lời cầu xin cuối về πειρασμός
  choice: xin đừng đưa chúng con vào cơn cám dỗ
  alternative: xin đừng đưa chúng con vào thử thách
  rationale: Giữ nguyên cách diễn đạt và sức căng thần học của tiếng Hy Lạp, không thêm lời giải thích nhằm dung hòa vai trò của Đức Chúa Trời đối với sự cám dỗ; nghĩa rộng hơn của πειρασμός được nêu ở chú thích.
- issue: Sự chuyển đổi từ “tội” sang hình ảnh “mắc nợ”
  choice: giữ “tội” ở vế đầu và “mắc nợ” ở vế sau
  alternative: đồng nhất cả hai vế bằng từ ngữ về sự xúc phạm hoặc tội lỗi
  rationale: Nguyên văn dùng ἁμαρτίας ở vế đầu nhưng ὀφείλοντι ở vế sau; giữ sự khác biệt này tránh làm phẳng hình ảnh và sự căng nghĩa của bản văn.
translation_notes:
  register: Văn phong cầu nguyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “chúng con” khi thưa với Đức Chúa Trời theo cách nói tự nhiên trong tiếng Việt; giữ động từ “đưa… vào” và không diễn giải để loại bỏ sức căng thần học của câu.
