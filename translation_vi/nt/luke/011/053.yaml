    rationale: ἐξελθόντος là phân từ aorist trong cấu trúc sở hữu cách tuyệt đối, tự nhiên nhất ở đây là hành động rời đi xảy ra trước hành động chính. “Sau khi Ngài ra khỏi đó” phản ánh rõ hơn “Khi Ngài ra khỏi đó”.
  - severity: low
    issue: Đối tượng của “gây sức ép” chưa được biểu thị trực tiếp.
    rationale: Trong tiếng Việt, “gây sức ép lên Ngài” rõ và tự nhiên hơn; đồng thời tránh để “Ngài” có vẻ chỉ là bổ ngữ của “dồn hỏi”.
  - severity: low
