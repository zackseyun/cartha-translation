review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính: việc Đức Giê-su rời khỏi nơi ấy, sự đối kháng gay gắt của các kinh sư và người Pha-ri-si, cùng việc họ dồn hỏi Ngài về nhiều vấn đề. Tuy nhiên, “Khi” không diễn tả rõ tính trước-sau của phân từ aorist trong sở hữu cách tuyệt đối; “Sau khi” sát hơn mà vẫn tự nhiên.'
  naturalness: “Ráo riết gây sức ép và dồn hỏi Ngài” có thể hiểu được, nhưng đối tượng của “gây sức ép” bị lửng và cụm phối hợp hơi gượng. Nêu rõ “lên Ngài” tạo câu Việt mạch lạc hơn. “Những người Pha-ri-si” cũng tự nhiên hơn trong phối hợp với danh từ số nhiều “các kinh sư”.
  terminology: “Kinh sư” và “Pha-ri-si” là các thuật ngữ quen thuộc, phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Dồn hỏi” giữ được sắc thái chất vấn ráo riết của ἀποστοματίζειν mà không áp đặt một cách hiểu quá cụ thể.
  issues:
