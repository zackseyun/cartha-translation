  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: vi
  text: Sau khi Ngài ra khỏi đó, các kinh sư và những người Pha-ri-si bắt đầu ráo riết gây sức ép lên Ngài và dồn hỏi[a] Ngài về nhiều điều,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gặng hỏi kỹ Ngài” hoặc “ép Ngài phải ứng khẩu trả lời”. Động từ Hy Lạp này hiếm gặp và hàm ý họ hung hăng tìm cách khiến Ngài phải nói ra câu trả lời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Khi Ngài ra khỏi đó
  rationale: 'Kết hợp liên từ-trạng từ với cấu trúc sở hữu cách tuyệt đối để diễn đạt tự nhiên quan hệ thời gian và sự tiếp nối về địa điểm: hành động ra khỏi đó xảy ra trước hành động chính.'
- source_word: οἱ γραμματεῖς
  choice: các kinh sư
  rationale: “Kinh sư” là cách gọi ngắn gọn, quen thuộc trong tiếng Việt hiện đại cho những người chuyên chép, nghiên cứu và giảng giải Luật trong bối cảnh Tin Mừng.
- source_word: οἱ Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên nhóm theo cách quen thuộc trong tiếng Việt, không diễn giải thêm đặc điểm thần học hay xã hội.
- source_word: δεινῶς ἐνέχειν
  choice: ráo riết gây sức ép
  rationale: Cụm từ diễn tả thái độ thù nghịch mạnh và sự ép buộc dai dẳng. “Ráo riết gây sức ép” truyền đạt cả cường độ của trạng từ lẫn hành động nhắm vào Đức Giê-su.
- source_word: ἀποστοματίζειν
  choice: dồn hỏi
  rationale: Động từ hiếm chỉ việc hung hăng khơi ra hoặc ép đối phương nói và trả lời. “Dồn hỏi” tự nhiên trong tiếng Việt, giữ được sắc thái đối đầu mà không xác định quá mức phương thức.
- source_word: περὶ πλειόνων
  choice: về nhiều điều
  rationale: Trong ngữ cảnh, cụm từ chỉ nhiều đề tài hoặc vấn đề khác nhau, không nhất thiết mang ý so sánh “nhiều hơn”.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ráo riết gây sức ép” cùng “dồn hỏi” giữ sắc thái thù nghịch tăng cao của nguyên văn. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang mệnh đề ở câu kế tiếp.
