  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng ‘anh em’ để nói với tập thể người nghe; giữ nguyên sức mạnh của câu hỏi tu từ và sự tương phản giữa cá với rắn.
