  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: vi
  text: Trong anh em, có người cha nào mà khi con mình xin một con cá, lại cho con một con rắn thay vì cá không?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Trong anh em, có người cha nào
  rationale: Cách diễn đạt này giữ cấu trúc câu hỏi tu từ và ý ‘người cha nào trong số những người đang nghe’, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: αἰτήσει
  choice: khi ... xin
  rationale: Động từ ở thì tương lai nằm trong tình huống giả định của câu hỏi tu từ; ‘khi ... xin’ truyền đạt tự nhiên hành động người con xin cha một vật.
- source_word: ὁ υἱός
  choice: con mình / con
  rationale: Mạo từ có ý nghĩa quan hệ trong ngữ cảnh; cách dịch này làm rõ quan hệ cha-con mà không thêm nội dung.
- source_word: ἰχθύν / ἰχθύος
  choice: một con cá / cá
  rationale: Lần đầu giữ hình ảnh cụ thể ở số ít bằng loại từ ‘con’; lần sau ‘thay vì cá’ tránh lặp nặng nề mà vẫn giữ rõ sự đối chiếu.
- source_word: ἀντί
  choice: thay vì
  rationale: Diễn đạt trực tiếp ý thay thế của giới từ trong tiếng Việt tự nhiên.
- source_word: ὄφιν
  choice: một con rắn
  rationale: ‘Rắn’ là từ thông dụng, chính xác trong ngữ cảnh và không tự ý thêm sắc thái biểu tượng.
- source_word: αὐτῷ ἐπιδώσει
  choice: lại cho con
  rationale: ‘Cho’ chuyển tải đúng hành động trao vật; ‘lại’ làm nổi bật sự tương phản phi lý trong câu hỏi tu từ, còn ‘con’ chỉ người con vừa được nhắc đến.
