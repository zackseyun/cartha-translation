  to: Nhưng nếu ngay cả Sa-tan cũng bị chia rẽ chống lại chính mình, thì vương quốc của nó sẽ đứng vững thế nào? Vì các ông nói rằng tôi nhờ Bê-ên-xê-bun[a] mà đuổi quỷ.
  rationale: Sửa “tự chia rẽ” thành “bị chia rẽ” để phản ánh thể bị động của διεμερίσθη, và thêm “ngay cả” để diễn đạt tự nhiên καὶ trong cấu trúc lập luận. Các thành tố khác được giữ nguyên về nghĩa; bỏ “các” trước “quỷ” cho lối nói tiếng Việt gọn và tự nhiên hơn, không thay đổi tính xác định của ngữ cảnh.
