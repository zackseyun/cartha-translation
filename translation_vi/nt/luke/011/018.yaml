id: LUK.11.18
reference: Luke 11:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: vi
  text: Nhưng nếu ngay cả Sa-tan cũng bị chia rẽ chống lại chính mình, thì vương quốc của nó sẽ đứng vững thế nào? Vì các ông nói rằng tôi nhờ Bê-ên-xê-bun[a] mà đuổi quỷ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: Bê-ên-xê-bun; một số truyền thống dùng dạng Bê-ên-xê-búp.'
    reason: Ghi nhận dạng tên theo nguyên văn Hy Lạp và dạng truyền thống khác.
lexical_decisions:
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Phiên âm tên gọi theo cách viết quen thuộc trong tiếng Việt hiện đại.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: tự chia rẽ chống lại chính mình
  rationale: Diễn đạt rõ sự phân rẽ và đối nghịch nội bộ, đồng thời giữ sắc thái của giới từ đi với đại từ phản thân.
- source_word: πῶς σταθήσεται
  choice: sẽ đứng vững thế nào
  rationale: Giữ hình ảnh 'đứng' của nguyên văn nhưng thêm 'vững' để diễn đạt tự nhiên ý tồn tại hoặc bền vững.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: vương quốc của nó
  rationale: Giữ hình ảnh vương quốc và dùng đại từ chỉ Sa-tan, tránh viết hoa tôn kính.
- source_word: ὅτι
  choice: Vì
  rationale: 'Thể hiện quan hệ giải thích: câu hỏi tu từ dựa trên chính lời cáo buộc của những người nghe.'
- source_word: ἐν Βεελζεβοὺλ
  choice: nhờ Bê-ên-xê-bun
  rationale: Trong ngữ cảnh này, ἐν diễn tả phương tiện hoặc tác nhân; 'nhờ' tự nhiên hơn trong tiếng Việt mà không thêm cụm 'quyền năng của'.
- source_word: ἐκβάλλειν ... τὰ δαιμόνια
  choice: đuổi các quỷ
  rationale: Cách diễn đạt trực tiếp, tự nhiên trong ngữ cảnh trừ quỷ và tương ứng sát với động từ 'đuổi ra' cùng danh từ 'quỷ'.
- source_word: Βεελζεβοὺλ
  choice: Bê-ên-xê-bun
  rationale: Phiên âm hình thức Βεελζεβούλ của bản văn Hy Lạp; dạng quen thuộc khác được ghi ở chú thích.
theological_decisions:
- issue: Bản chất lời cáo buộc về nguồn quyền năng của Chúa Giê-su
  choice: Dịch là 'nhờ Bê-ên-xê-bun' mà đuổi quỷ, chỉ nêu quan hệ tác nhân/phương tiện như lời cáo buộc.
  alternative: liên kết với Bê-ên-xê-bun; nhờ quyền năng của Bê-ên-xê-bun
  rationale: Không bổ sung lời giải thích thần học vượt quá nguyên văn, nhưng vẫn chuyển ἐν sang lối nói tiếng Việt dễ hiểu.
- issue: Đại từ chỉ Sa-tan
  choice: nó
  alternative: hắn; ông ta
  rationale: Dùng đại từ tự nhiên chỉ một hữu thể ác mà không hàm ý kính trọng hay thêm sắc thái khinh miệt quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi tu từ cùng hình ảnh 'vương quốc đứng vững' được giữ lại. Dấu chú thích [a] đặt ngay sau tên Bê-ên-xê-bun.
