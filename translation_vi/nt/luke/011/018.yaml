  terminology: “Sa-tan,” “vương quốc,” “Bê-ên-xê-bun,” và “quỷ” đều phù hợp. “Nhờ Bê-ên-xê-bun” diễn đạt đúng sắc thái phương tiện/tác nhân của ἐν mà không thêm diễn giải thần học. Chú thích tên gọi phù hợp với Βεελζεβούλ và dạng truyền thống Bê-ên-xê-búp.
