id: LUK.11.31
reference: Luke 11:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: vi
  text: Nữ vương phương Nam sẽ trỗi dậy trong cuộc phán xét cùng với những người đàn ông của thế hệ này và sẽ kết án họ,[a] vì bà đã từ tận cùng trái đất đến để nghe sự khôn ngoan của Sa-lô-môn; kìa,[b] điều lớn hơn Sa-lô-môn ở đây.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đây là nhân vật thường được đồng nhất với nữ vương Sê-ba (xem 1 Các Vua 10:1–13; 2 Sử Ký 9:1–12).
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “một vị lớn hơn Sa-lô-môn.” Tiếng Hy Lạp dùng một cách diễn đạt ở giống trung, sát nghĩa là “điều lớn hơn Sa-lô-môn”; điều này có thể nhấn mạnh thực tại rộng hơn là chỉ sự so sánh trực tiếp giữa hai cá nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Nữ vương phương Nam
  rationale: Giữ nguyên cấu trúc Hy Lạp và âm vang Cựu Ước, không đưa cách đồng nhất mang tính giải thích “nữ vương Sê-ba” vào chính văn.
- source_word: ἐγερθήσεται
  choice: sẽ trỗi dậy
  rationale: Diễn đạt hành động đứng lên/xuất hiện trong cảnh phán xét, đồng thời vẫn để ngỏ âm vang về sự sống lại.
- source_word: ἐν τῇ κρίσει
  choice: trong ngày phán xét
  rationale: Mạo từ xác định hướng đến cuộc phán xét cánh chung; thêm “ngày” giúp câu tiếng Việt tự nhiên mà không thay đổi ý chính.
- source_word: μετὰ τῶν ἀνδρῶν
  choice: cùng với những người đàn ông
  rationale: ἀνδρῶν mang nghĩa giống đực cụ thể, nên không làm thành từ chung chung như “người ta”.
- source_word: τῆς γενεᾶς ταύτης
  choice: thuộc thế hệ này
  rationale: γενεά ở đây chỉ thế hệ đương thời của Chúa Giê-su; “thuộc” nối tự nhiên với cụm “những người đàn ông”.
- source_word: κατακρινεῖ αὐτούς
  choice: sẽ kết án họ
  rationale: κατακρίνω mạnh hơn việc chỉ xét đoán, mang nghĩa tuyên án bất lợi.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: từ tận cùng trái đất
  rationale: Giữ thành ngữ chỉ một nơi vô cùng xa xôi và phạm vi rộng của γῆ trong ngữ cảnh.
- source_word: ἀκοῦσαι
  choice: để nghe
  rationale: Động từ nguyên mẫu aorist nêu mục đích của việc bà đến.
- source_word: τὴν σοφίαν Σολομῶνος
  choice: sự khôn ngoan của Sa-lô-môn
  rationale: Bám sát cấu trúc Hy Lạp và giữ “sự khôn ngoan” làm trọng tâm của điều bà tìm nghe.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Bảo tồn lời gọi chú ý trang trọng và cao trào của câu nói, đồng thời tự nhiên trong tiếng Việt Kinh Thánh.
- source_word: πλεῖον Σολομῶνος
  choice: điều lớn hơn Sa-lô-môn
  rationale: πλεῖον là dạng trung tính; “điều lớn hơn” giữ được hình thức và độ mở của nguyên văn thay vì xác định hẳn là “Đấng lớn hơn”.
- source_word: ὧδε
  choice: đang ở đây
  rationale: Diễn đạt sự hiện diện ngay tại nơi và thời điểm Chúa Giê-su đang nói.
theological_decisions:
- issue: Có nên nêu rõ nữ vương này là nữ vương Sê-ba hay không
  choice: Giữ “Nữ vương phương Nam” trong chính văn
  alternative: Nữ vương Sê-ba
  rationale: Dù liên hệ với 1 Các Vua 10 và 2 Sử Ký 9 rất rõ, nguyên văn Hy Lạp chỉ nói “nữ vương phương Nam”; chú thích cung cấp sự nhận diện mà không thay thế lời văn nguồn.
- issue: Có nên cá nhân hóa πλεῖον Σολομῶνος thành “Đấng lớn hơn Sa-lô-môn” hay không
  choice: Dịch “điều lớn hơn Sa-lô-môn”
  alternative: Đấng lớn hơn Sa-lô-môn
  rationale: Tính từ Hy Lạp ở dạng trung tính, nên bản dịch giữ độ căng giữa chính thân vị Chúa Giê-su và thực tại rộng hơn hiện diện nơi Ngài, như vương quyền hoặc sứ điệp của Ngài.
- issue: Có nên diễn đạt ἐγερθήσεται rõ ràng là sự sống lại hay không
  choice: Dịch “sẽ trỗi dậy”
  alternative: sẽ được sống lại
  rationale: Trong bối cảnh cánh chung, động từ có thể gợi sự sống lại, nhưng trong cảnh pháp đình cũng có thể chỉ việc đứng lên/xuất hiện làm chứng; cách dịch không đóng lại một trong hai sắc thái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Nữ vương” để phù hợp sắc thái hoàng gia; giữ “kìa” làm dấu hiệu tu từ trang trọng. Tên riêng được viết theo dạng phiên âm quen thuộc “Sa-lô-môn”.
