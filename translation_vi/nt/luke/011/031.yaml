revisions:
- from: Nữ vương phương Nam sẽ trỗi dậy trong ngày phán xét cùng với những người đàn ông thuộc thế hệ này và sẽ kết án họ,[a] vì bà đã từ tận cùng trái đất đến để nghe sự khôn ngoan của Sa-lô-môn. Và kìa,[b] điều lớn hơn Sa-lô-môn đang ở đây.
  to: Nữ vương phương Nam sẽ trỗi dậy trong cuộc phán xét cùng với những người đàn ông của thế hệ này và sẽ kết án họ,[a] vì bà đã từ tận cùng trái đất đến để nghe sự khôn ngoan của Sa-lô-môn; kìa,[b] điều lớn hơn Sa-lô-môn ở đây.
  rationale: 'Các sửa đổi chỉ nhằm tăng độ sát nguyên văn và độ tự nhiên của tiếng Việt: bỏ yếu tố “ngày” được thêm vào, tránh sắc thái tiếp diễn của “đang,” làm mượt cụm chỉ thế hệ, và điều chỉnh chú thích để nêu phương án cá nhân hóa mà không áp đặt tước hiệu thần học. Dạng trung tính và độ mở ngữ nghĩa của πλεῖον được giữ trong chính văn.'
  reviewer_model: gpt-5.6-terra
