- from: 'thì người ở bên trong đáp: “Đừng làm phiền tôi.[a] Cửa đã đóng rồi,[b] và các con tôi đang ở cùng tôi trên chỗ ngủ.[c] Tôi không thể dậy mà đưa cho anh được.”'
  to: 'thì người ở bên trong đáp rằng: “Đừng làm phiền tôi.[a] Cửa đã đóng rồi,[b] và các con tôi đang nằm cùng tôi.[c] Tôi không thể dậy để đưa cho anh được.”'
  rationale: Sửa cụm từ không tự nhiên “ở cùng tôi trên chỗ ngủ” thành “đang nằm cùng tôi”, vẫn giữ nghĩa của κοίτη là chỗ nằm ngủ chung trong gia đình; chú thích c được cập nhật tương ứng. Các phần còn lại được giữ sát nguyên văn và tránh bổ sung tân ngữ không có trong tiếng Hy Lạp.
