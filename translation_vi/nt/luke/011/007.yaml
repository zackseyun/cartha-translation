  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: vi
  text: 'thì người ở bên trong đáp rằng: “Đừng làm phiền tôi.[a] Cửa đã đóng rồi,[b] và các con tôi đang nằm cùng tôi.[c] Tôi không thể dậy để đưa cho anh được.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đừng gây phiền toái cho tôi” hoặc “Đừng làm phiền tôi mãi.” Thành ngữ Hy Lạp theo nghĩa đen nói đến việc “gây cho tôi những khó nhọc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Cửa đang đóng rồi.” Động từ Hy Lạp ở thể hoàn thành có thể nhấn mạnh hành động đã hoàn tất hoặc trạng thái do hành động ấy tạo nên.'
    reason: lexical_alternative
  - marker: c
    text: “Nằm cùng tôi” chỉ việc cùng ở trong chỗ nằm ngủ chung của gia đình trong bối cảnh nhà ở thời ấy, không hàm ý sự thân mật vợ chồng.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: thì người ở bên trong đáp
  rationale: Diễn đạt tự nhiên trong tiếng Việt mạch kể giả định của dụ ngôn; giữ rõ vị trí người trả lời ở bên trong, còn thành ngữ ‘đáp và nói’ được gọn hóa thành ‘đáp’.
- source_word: Μή μοι κόπους πάρεχε
  choice: Đừng làm phiền tôi
  rationale: Chuyển đúng thành ngữ Hy Lạp chỉ việc gây khó nhọc hoặc phiền toái, bằng cách nói hiện đại và trang trọng vừa phải.
- source_word: ἡ θύρα κέκλεισται
  choice: Cửa đã đóng rồi
  rationale: Thể hoàn thành biểu thị hành động đã xảy ra với kết quả còn hiệu lực; ‘đã… rồi’ giữ được cả nét hoàn tất lẫn trạng thái hiện tại mà không thêm ý ‘khóa’.
- source_word: τὰ παιδία μου
  choice: các con tôi
  rationale: Tự nhiên hơn ‘những đứa trẻ của tôi’ trong lời của một người cha, đồng thời không xác định quá mức tuổi của các con.
- source_word: μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: đang ở cùng tôi trên chỗ ngủ
  rationale: κοίτη trong bối cảnh này là nơi cả gia đình nằm ngủ. ‘Chỗ ngủ’ giữ được bối cảnh sinh hoạt chung và tránh hàm ý không thích hợp mà từ ‘giường’ đôi khi có thể gợi ra.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Tôi không thể dậy mà đưa cho anh được
  rationale: Giữ động từ ‘đưa/cho’ không có tân ngữ như nguyên văn Hy Lạp; ‘dậy mà… được’ diễn đạt tự nhiên hành động cần thực hiện trước khi trao vật được xin.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, tự nhiên và trang nghiêm vừa phải. Dùng ‘anh’ cho người bạn đang đứng ngoài cửa; tránh thêm tân ngữ sau ‘đưa cho anh’ vì nguyên văn để ngỏ và ngữ cảnh câu trước đã cung cấp vật được xin.
