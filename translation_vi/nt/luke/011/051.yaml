  terminology: Các tên riêng A-bên, Xa-cha-ri, Giê-hô-gia-đa và Bê-rê-kia được phiên chuyển nhất quán theo lối Việt ngữ Kinh Thánh. “Đền Thờ” là cách giải nghĩa phù hợp của οἶκος trong ngữ cảnh; chú thích đã bảo lưu nghĩa đen “nhà.”
