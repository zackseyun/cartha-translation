id: LUK.11.51
reference: Luke 11:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: vi
  text: từ máu của A-bên cho đến máu của Xa-cha-ri[a], người đã thiệt mạng giữa bàn thờ và Đền Thờ[b]. Phải, tôi nói với các ông, máu ấy sẽ bị đòi lại từ thế hệ này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Không rõ Xa-cha-ri nào được nói đến ở đây. Các khả năng được đề xuất gồm Xa-cha-ri con Giê-hô-gia-đa (2 Sử Ký 24:20–22) và Xa-cha-ri con Bê-rê-kia.
    reason: cross_reference
  - marker: b
    text: 'Nguyên văn Hy Lạp: “giữa bàn thờ và nhà”; trong văn cảnh, “nhà” chỉ Đền Thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: từ máu của A-bên cho đến máu của Xa-cha-ri
  rationale: Giữ cấu trúc đối xứng “từ… cho đến…” và hình ảnh “máu” của nguyên văn, qua đó bảo toàn ý về máu đã đổ và trách nhiệm đối với sự đổ máu.
- source_word: τοῦ ἀπολομένου
  choice: người đã chết
  rationale: Diễn đạt tự nhiên phân từ của ἀπόλλυμι mà không nói rõ tác nhân hơn nguyên văn; văn cảnh vẫn cho thấy đây là một cái chết bạo lực.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: giữa bàn thờ và Đền Thờ
  rationale: Trong văn cảnh, οἶκος chỉ tòa nhà Đền Thờ. Cách dịch này rõ nghĩa với độc giả hiện đại; nghĩa đen “nhà” được ghi ở chú thích.
- source_word: ναί, λέγω ὑμῖν
  choice: Phải, tôi nói với các ông
  rationale: “Phải” giữ sắc thái khẳng định mạnh của ναί; “tôi nói với các ông” truyền đạt tự nhiên động từ và đại từ số nhiều, phù hợp với những người đang được Đức Giê-su trực tiếp quở trách.
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: máu ấy sẽ bị đòi lại từ thế hệ này
  rationale: Giữ thể bị động và sắc thái truy cứu, đòi bồi hoàn của ἐκζητέω, đồng thời nối đại từ ngầm với “máu” trong mạch văn. “Từ thế hệ này” bảo toàn giới từ ἀπό và không làm mờ đối tượng phải chịu trách nhiệm.
theological_decisions:
- issue: Danh tính của Xa-cha-ri
  choice: Không xác định thêm Xa-cha-ri trong chính văn.
  alternative: Xa-cha-ri con Giê-hô-gia-đa; Xa-cha-ri con Bê-rê-kia; hoặc một nhân vật tử đạo mang tính đại diện.
  rationale: Bản Hy Lạp tại đây chỉ nêu tên Xa-cha-ri. Việc giữ nguyên sự không xác định tránh giải quyết thay văn bản một vấn đề lịch sử còn được tranh luận.
- issue: Phạm vi quy trách nhiệm cho “thế hệ này”
  choice: Giữ nguyên cụm “thế hệ này” và hình thức truy đòi nợ máu.
  alternative: Mở rộng thành toàn thể một dân tộc hoặc thu hẹp vào riêng một nhóm lãnh đạo.
  rationale: Nguyên văn quy trách nhiệm cho γενεὰ αὕτη nhưng không trình bày tại câu này một hệ thống thần học rộng hơn; bản dịch vì thế không tự ý mở rộng hay thu hẹp đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đền Thờ” thay cho nghĩa đen khó hiểu là “nhà”, nhưng bảo lưu nghĩa đen trong chú thích. Cụm “máu ấy sẽ bị đòi lại” duy trì hình ảnh pháp lý và thần học về nợ máu mà không nêu thêm chủ thể thi hành sự phán xét.
