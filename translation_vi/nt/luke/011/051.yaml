  source_fidelity: Bản dịch giữ đúng phạm vi tu từ “từ máu A-bên ... đến máu Xa-cha-ri,” không định danh Xa-cha-ri trong chính văn, và bảo toàn cách nói bị động về sự truy xét nơi “thế hệ này.” Tuy nhiên, “người đã chết” có thể chỉ một cái chết thông thường, trong khi ἀπολομένου trong ngữ cảnh này phù hợp hơn với một cái chết bạo lực mà vẫn không cần nêu tác nhân.
