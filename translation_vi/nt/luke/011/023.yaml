  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: vi
  text: Ai không cùng tôi là chống lại tôi, và ai không cùng tôi thu góp thì làm tan tác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: ai không ở
  rationale: Cấu trúc mạo từ với phân từ hiện tại được dùng như danh từ và chỉ một người nói chung. “Ai không ở” tự nhiên trong tiếng Việt, giữ được tính khái quát mà không mang sắc thái cổ.
- source_word: μετ’ ἐμοῦ
  choice: với tôi / cùng tôi
  rationale: μετά với sở hữu cách diễn tả sự liên kết hay đồng hành. Hai cách diễn đạt tự nhiên này được dùng theo ngữ cảnh cú pháp của từng vế mà vẫn giữ cùng ý nghĩa căn bản.
- source_word: κατ’ ἐμοῦ
  choice: chống lại tôi
  rationale: κατά với sở hữu cách ở đây chỉ sự đối nghịch. “Chống lại tôi” thể hiện rõ thế tương phản trực tiếp với “ở với tôi”.
- source_word: συνάγων
  choice: thu góp
  rationale: Động từ chỉ hành động gom lại. “Thu góp” giữ hình ảnh quy tụ và tạo thế đối lập rõ với “làm tan tác”, đồng thời không tự ý xác định đối tượng được gom.
- source_word: σκορπίζει
  choice: làm tan tác
  rationale: σκορπίζω có nghĩa làm phân tán, làm tản ra. “Làm tan tác” là cách nói tự nhiên, giàu hình ảnh và giữ sự đối lập với hành động thu góp.
- source_word: καὶ
  choice: và
  rationale: Liên từ nối hai mệnh đề song song; “và” bảo toàn sự phối hợp trực tiếp của nguyên văn.
theological_decisions:
- issue: Sức nặng của lời Đức Giê-su về thái độ trung lập đối với ngài
  choice: Người không ở cùng phía với Đức Giê-su được trình bày là chống lại ngài; câu dịch giữ nguyên sự đối lập dứt khoát.
  alternative: Diễn ý nhẹ hơn thành chỉ không ủng hộ, hoặc giới hạn rõ lời này chỉ vào việc trừ quỷ.
  rationale: Cách diễn đạt Hy Lạp mang tính tuyệt đối và không nêu giới hạn ngay trong câu. Bản dịch không làm nhẹ lời tuyên bố cũng không thêm một hệ thống giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc song song “ai không… và ai không…” tái hiện nhịp điệu của nguyên văn. Không thêm đại từ chỉ giới tính vì câu nói có phạm vi khái quát.
