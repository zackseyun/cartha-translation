source:
  edition: SBLGNT
  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: vi
  text: vì một người bạn của tôi vừa đi đường đến chỗ tôi[a], và tôi không có gì để dọn ra trước mặt người ấy.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “từ đường đến với tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: vì
  rationale: Giới thiệu lý do cho lời thỉnh cầu trong dụ ngôn; “vì” tự nhiên và trực tiếp trong tiếng Việt.
- source_word: φίλος μου
  choice: một người bạn của tôi
  rationale: Giữ sắc thái bất định của danh từ không có mạo từ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: παρεγένετο
  choice: vừa ... đến
  rationale: Động từ chỉ sự đến nơi; “vừa ... đến” làm rõ kết quả hiện tại phù hợp với hoàn cảnh người bạn mới tới và đang có mặt.
- source_word: ἐξ ὁδοῦ
  choice: đi đường xa
  rationale: Cụm từ có nghĩa đen là “từ ngoài đường/đường đi” và theo ngữ cảnh chỉ việc từ một chuyến đi đến; cách dịch này tự nhiên, đồng thời không biến cụm từ thành một địa điểm xuất phát cụ thể.
- source_word: πρός με
  choice: đến chỗ tôi
  rationale: Diễn tả hướng chuyển động về phía người nói một cách tự nhiên mà không thêm rõ “nhà” hay mục đích “thăm” vốn chỉ được hàm ý.
- source_word: οὐκ ἔχω
  choice: tôi không có gì
  rationale: Diễn đạt trực tiếp sự không có thứ cần thiết.
- source_word: ὃ παραθήσω αὐτῷ
  choice: để dọn ra mời người ấy
  rationale: Trong bối cảnh tiếp đãi bằng bữa ăn, παρατίθημι chỉ việc đặt thức ăn trước mặt khách. “Dọn ra mời” vừa tự nhiên trong văn hóa ngôn ngữ Việt vừa giữ hình ảnh tiếp đãi, không chỉ nói chung chung là phục vụ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy” thay cho đại từ mang dấu ấn vùng miền hoặc hàm ý tuổi tác. Dấu [a] được đặt ngay sau cụm từ mà chú thích giải thích.
