  to: 'Nhưng Đức Giê-su biết những suy nghĩ của họ, nên nói với họ: “Vương quốc nào tự chia rẽ thì bị tàn phá, và một nhà đổ trên một nhà khác.[a]”'
  rationale: Bản sửa giữ nguyên cấu trúc và sự mơ hồ của câu Hy Lạp, đồng thời cải thiện tính tự nhiên của tiếng Việt. “Một nhà... một nhà khác” phản ánh tính khái quát của οἶκος mà không thêm sự xác định. Chú thích nêu khả năng nghĩa xã hội của οἶκος nhưng không khẳng định một cách diễn giải duy nhất hay thêm chủ thể sụp đổ không được nói rõ.
