source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết những suy nghĩ của họ, nên nói với họ: “Vương quốc nào tự chia rẽ thì bị tàn phá, và một nhà đổ trên một nhà khác.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “một hộ gia đình chống lại một hộ gia đình thì sụp đổ.” Từ Hy Lạp οἶκος có thể chỉ một căn nhà hoặc một hộ gia đình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: biết
  rationale: Diễn đạt sự nhận biết trong tâm trí; cấu trúc “biết..., nên nói” chuyển tự nhiên quan hệ giữa phân từ và động từ chính trong tiếng Việt.
- source_word: διανοήματα
  choice: những suy nghĩ
  rationale: Giữ nghĩa rộng về điều đang diễn ra trong tâm trí, không tự ý quy thành ý đồ hay lập luận thù nghịch.
- source_word: Πᾶσα βασιλεία
  choice: Vương quốc nào
  rationale: Cấu trúc “nào... thì...” là cách nói tự nhiên trong tiếng Việt để diễn đạt mệnh đề khái quát có lực phân phối của πᾶσα.
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: tự chia rẽ
  rationale: Diễn đạt gọn và rõ tình trạng phân rẽ nội bộ, tương ứng với ý “bị chia rẽ chống lại chính mình” trong thành ngữ Hy Lạp.
- source_word: ἐρημοῦται
  choice: bị hoang tàn
  rationale: Giữ sắc thái bị tàn phá, trở nên tiêu điều, đồng thời bảo toàn thể bị động của động từ.
- source_word: οἶκος ἐπὶ οἶκον
  choice: nhà này đổ lên nhà kia
  rationale: Giữ hình ảnh cụ thể và cấu trúc cô đọng của câu Hy Lạp, đồng thời dùng “này... kia” để câu tiếng Việt tự nhiên hơn; nghĩa “gia đình/hộ” được ghi chú như một khả năng thực sự.
- source_word: πίπτει
  choice: đổ
  rationale: Trong hình ảnh về nhà, “đổ” tự nhiên hơn “ngã” và vẫn bảo toàn ẩn dụ sụp đổ.
theological_decisions:
- issue: Nghĩa của οἶκος trong vế thứ hai của câu châm ngôn
  choice: Dùng “nhà” trong chính văn
  alternative: “gia đình” hoặc “hộ này chống lại hộ kia”
  rationale: οἶκος có thể chỉ một căn nhà hoặc một hộ/gia đình. Chính văn giữ hình ảnh cụ thể và sự mơ hồ của nguyên ngữ; chú thích nêu nghĩa xã hội khả hữu mà không áp đặt cách hiểu.
- issue: Chủ ngữ αὐτός
  choice: Nêu rõ là “Đức Giê-su”
  alternative: “Ngài” hoặc “ông”
  rationale: Câu trích riêng lẻ cần chủ thể rõ ràng trong tiếng Việt; việc gọi tên dựa trên ngữ cảnh trực tiếp của phân đoạn, không thêm một khẳng định thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc châm ngôn “nào... thì...”; tránh lối dịch quá sát như “bị chia rẽ chống lại chính mình” vì nặng nề trong tiếng Việt, nhưng vẫn giữ nội dung về sự phân rẽ nội bộ. Dấu chú thích [a] đặt ngay sau mệnh đề có từ đa nghĩa.
