id: LUK.11.49
reference: Luke 11:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: vi
  text: 'Vì thế, sự khôn ngoan của Đức Chúa Trời cũng đã nói[a]: “Ta sẽ sai các nhà tiên tri và các sứ đồ đến với họ; họ sẽ giết và bắt bớ một số người trong số họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự khôn ngoan của Đức Chúa Trời.” Cụm từ này có thể được hiểu là sự nhân cách hóa sự khôn ngoan của Đức Chúa Trời, ý định khôn ngoan của Ngài, hoặc cách Chúa Giê-su ngầm nói về chính mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì thế
  rationale: Cách diễn đạt tự nhiên, giữ lực nguyên nhân–suy luận nối với lời lên án trước đó.
- source_word: καὶ
  choice: cũng
  rationale: Giữ sắc thái bổ sung của καὶ trong cụm mở đầu.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: sự khôn ngoan của Đức Chúa Trời
  rationale: Bám sát cấu trúc sở hữu của nguyên ngữ và không quyết định đây là nhân cách hóa, ý định khôn ngoan của Đức Chúa Trời hay lời tự quy chiếu ngầm của Chúa Giê-su.
- source_word: εἶπεν
  choice: đã phán
  rationale: Thì quá khứ được thể hiện bằng “đã”; “phán” phù hợp với lời được quy cho sự khôn ngoan thần thượng và giữ văn phong trang trọng.
- source_word: Ἀποστελῶ
  choice: Ta sẽ sai
  rationale: Giữ rõ ngôi thứ nhất và ý nghĩa tương lai của động từ.
- source_word: εἰς αὐτούς
  choice: đến với họ
  rationale: Diễn đạt tự nhiên hướng đến đối tượng tiếp nhận, phù hợp với động từ “sai”.
- source_word: προφήτας
  choice: các nhà tiên tri
  rationale: Thuật ngữ phổ thông, chuẩn xác trong tiếng Việt hiện đại.
- source_word: ἀποστόλους
  choice: các sứ đồ
  rationale: Giữ nghĩa chức danh chuyên biệt thường có trong Lu-ca–Công vụ, thay vì hạ thành nghĩa chung là “sứ giả”.
- source_word: ἐξ αὐτῶν
  choice: một số người trong số ấy
  rationale: 'Giữ nghĩa bộ phận: chỉ một số trong các nhà tiên tri và sứ đồ được sai đến.'
- source_word: ἀποκτενοῦσιν
  choice: họ sẽ giết
  rationale: Trực tiếp, tự nhiên và giữ rõ ý tương lai.
- source_word: διώξουσιν
  choice: bắt bớ
  rationale: Trong ngữ cảnh thù địch này, động từ mang nghĩa ngược đãi vì đức tin hoặc sứ mạng, không chỉ là đuổi theo.
theological_decisions:
- issue: Ý nghĩa của “sự khôn ngoan của Đức Chúa Trời”
  choice: Giữ nguyên cách nói “sự khôn ngoan của Đức Chúa Trời” mà không đồng nhất rõ ràng với Chúa Giê-su, Kinh Thánh hay một hữu thể riêng biệt.
  alternative: Có thể hiểu là sự nhân cách hóa sự khôn ngoan thần thượng, ý định khôn ngoan của Đức Chúa Trời, hoặc lời Chúa Giê-su ngầm tự quy chiếu.
  rationale: Nguyên ngữ cho phép nhiều cách hiểu; bản dịch cần bảo toàn sự mơ hồ và sức căng thần học thay vì tự ý giải quyết.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời”, “phán”, “Ta”, “nhà tiên tri”, “sứ đồ” theo văn phong Kinh Thánh quen thuộc; cấu trúc câu được điều chỉnh cho tự nhiên mà vẫn bảo toàn quan hệ cú pháp và sự mơ hồ của nguyên ngữ.
