revisions:
- from: 'Vì thế, sự khôn ngoan của Đức Chúa Trời cũng đã phán[a]: “Ta sẽ sai các nhà tiên tri và các sứ đồ đến với họ; họ sẽ giết và bắt bớ một số người trong số ấy.”'
  to: 'Vì thế, sự khôn ngoan của Đức Chúa Trời cũng đã nói[a]: “Ta sẽ sai các nhà tiên tri và các sứ đồ đến với họ; họ sẽ giết và bắt bớ một số người trong số họ.”'
  rationale: Thay “phán” bằng “nói” để không tăng sắc thái thần học hay nhân cách hóa vượt quá εἶπεν. Chỉnh chú thích cho tiếng Việt tự nhiên hơn, đồng thời giữ nguyên các khả năng diễn giải và không đồng nhất “sự khôn ngoan của Đức Chúa Trời” với bất cứ cách hiểu nào.
  reviewer_model: gpt-5.6-terra
