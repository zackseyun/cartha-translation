review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự và nội dung chính của câu Hy Lạp: linh ấy đi, đem theo bảy linh khác độc ác hơn nó; các linh đi vào; và tình trạng về sau của người ấy tệ hơn trước. Việc dùng chủ ngữ số nhiều cho hành động cư ngụ diễn đạt mạch nghĩa tập thể tự nhiên, dù κατοικεῖ trong bản SBLGNT có hình thức số ít.'
