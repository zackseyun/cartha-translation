id: LUK.11.26
reference: Luke 11:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: vi
  text: Bấy giờ, nó đi và đem theo bảy linh khác ác hơn chính nó[a]. Chúng đi vào và cư ngụ ở đó[b]. Tình trạng sau cùng của người ấy trở nên tệ hơn lúc đầu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “gian ác hơn chính nó.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp chỉ nói “các linh”, không nói rõ “quỷ” hay “các linh ô uế” trong câu này, dù ngữ cảnh cho thấy chúng là những linh thù nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu bước tiếp theo trong diễn tiến của câu chuyện một cách tự nhiên và trang trọng.
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: nó đi đem theo
  rationale: Diễn đạt cả hành động đi và ý đưa những linh khác cùng đi với mình.
- source_word: ἕτερα πνεύματα
  choice: bảy linh khác
  rationale: Giữ nguyên danh từ khái quát “linh”, không tự ý thêm “ô uế” hay đổi thành “quỷ”; con số bảy được đặt theo trật tự tự nhiên của tiếng Việt.
- source_word: πονηρότερα ἑαυτοῦ
  choice: dữ hơn mình
  rationale: Giữ phép so sánh với chính linh đang trở lại; “dữ” tự nhiên trong ngữ cảnh nói về các linh gây hại.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Chúng vào và ở lại đó
  rationale: Phân từ số nhiều cho thấy các linh đi vào; động từ số ít trong bản Hy Lạp tạo nét không đồng nhất về số, nhưng ý nghĩa theo tập thể được diễn đạt tự nhiên bằng “chúng” trong tiếng Việt.
- source_word: τὰ ἔσχατα ... χείρονα τῶν πρώτων
  choice: Tình trạng sau cùng ... tệ hơn lúc đầu
  rationale: Diễn đạt thành ngữ chỉ hoàn cảnh cuối cùng đối lập với hoàn cảnh ban đầu, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τοῦ ἀνθρώπου ἐκείνου
  choice: của người ấy
  rationale: Chỉ cá nhân cụ thể trong minh họa mà không thêm sắc thái không có trong nguyên văn.
theological_decisions:
- issue: Có nên gọi πνεύματα là “quỷ” hoặc “các linh ô uế” hay không
  choice: linh
  alternative: quỷ; các linh ô uế
  rationale: Câu này chỉ dùng πνεύματα. Ngữ cảnh và tính từ “dữ hơn” cho thấy tính thù nghịch, nên không cần thêm danh xưng không có ngay trong câu.
- issue: Sự không đồng nhất về số giữa εἰσελθόντα và κατοικεῖ
  choice: Dùng chủ ngữ số nhiều “chúng” trong câu chính
  alternative: 'Dịch sát hình thức số ít: “sau khi chúng vào, nó ở lại đó”'
  rationale: Phân từ εἰσελθόντα là số nhiều và mạch nghĩa nói đến nhóm linh đi vào cư ngụ. Cách dịch số nhiều truyền đạt ý nghĩa rõ ràng mà không xây dựng kết luận thần học từ sự không đồng nhất ngữ pháp.
- issue: Ý nghĩa của τὰ ἔσχατα và τῶν πρώτων
  choice: tình trạng sau cùng ... lúc đầu
  alternative: kết cuộc ... ban đầu
  rationale: Nguyên văn đối chiếu tình trạng về sau với tình trạng trước đó; bản dịch giữ sự đối chiếu nhưng không giải thích thêm bản chất thần học của tình trạng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Bấy giờ” để nối mạch tường thuật; “ở lại” truyền đạt κατοικεῖ tự nhiên hơn “cư ngụ” trong lời kể phổ thông. Mọi dấu chú thích đều xuất hiện trong chính văn.
