  terminology: Giữ “linh” là phù hợp vì câu chỉ nói πνεύματα, không lặp lại từ “ô uế” hay dùng δαιμόνια. “Ác hơn chính nó” phản ánh πονηρότερα ἑαυτοῦ trực tiếp hơn “dữ hơn mình,” đồng thời làm rõ đối tượng so sánh.
  issues:
  - severity: low
    issue: Cụm “nó đi đem theo” hơi gượng.
    rationale: Hai động từ phối hợp này cần liên từ hoặc ngắt câu để diễn đạt rõ hai hành động πορεύεται καὶ παραλαμβάνει.
  - severity: low
    issue: “Ở lại đó” chưa chuyển tải đầy đủ κατοικεῖ.
    rationale: Κατοικεῖ nhấn mạnh việc ở/cư ngụ, không chỉ là ở lại tạm thời.
