  to: Bấy giờ, nó đi và đem theo bảy linh khác ác hơn chính nó[a]. Chúng đi vào và cư ngụ ở đó[b]. Tình trạng sau cùng của người ấy trở nên tệ hơn lúc đầu.
  rationale: Chỉnh nhẹ để câu văn trôi chảy hơn và phản ánh κατοικεῖ bằng “cư ngụ”. Không thêm “quỷ” hoặc “linh ô uế” vào chính văn. “Chúng” theo số nhiều của εἰσελθόντα và ý nghĩa tập thể; bản Hy Lạp SBLGNT có động từ κατοικεῖ số ít không đồng nhất về số, nên không nên suy diễn thêm từ điểm ngữ pháp này.
  reviewer_model: gpt-5.6-terra
