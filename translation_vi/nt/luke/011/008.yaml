id: LUK.11.8
reference: Luke 11:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: vi
  text: 'Ta bảo các con: Dù người chủ nhà không chịu dậy cho người bạn ấy thứ gì chỉ vì người ấy là bạn mình, nhưng vì sự dai dẳng không biết ngượng của người bạn ấy[a], người chủ nhà cũng sẽ dậy và cho người ấy mọi thứ người ấy cần.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể dịch là “sự trơ trẽn”, “sự táo bạo” hoặc, sát nghĩa hơn, là “sự không biết xấu hổ”. Đại từ sở hữu trong nguyên văn ở cụm này có thể được hiểu là chỉ người bạn đến xin hoặc người chủ nhà.
    reason: Bảo tồn phạm vi nghĩa của ἀναίδεια và sự mơ hồ được tranh luận về quy chiếu của αὐτοῦ.
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Giữ công thức trực tiếp trong lời Đức Giê-su; “Ta” và “các con” tạo giọng trang trọng, tự nhiên trong ngữ cảnh thầy nói với môn đồ.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: Dù người ấy không chịu dậy lấy đồ cho bạn
  rationale: Diễn đạt sắc thái nhượng bộ của εἰ καί và hành động rời giường trong bối cảnh; “lấy đồ cho” bổ sung đối tượng được hàm ý để tiếng Việt tự nhiên.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: chỉ vì đó là bạn mình
  rationale: Giữ quan hệ bạn bè cụ thể và nguyên nhân trực tiếp, không trừu tượng hóa thành “tình bạn”.
- source_word: διά γε
  choice: thì ít nhất vì
  rationale: 'Thể hiện sự chuyển ý nhấn mạnh: nếu động cơ thứ nhất không đủ, động cơ thứ hai vẫn khiến người ấy hành động.'
- source_word: ἀναίδειαν αὐτοῦ
  choice: sự dai dẳng không biết ngượng của người bạn ấy
  rationale: ἀναίδεια có nét nghĩa cốt lõi là không biết xấu hổ hoặc không e ngại điều bị xem là không phải phép; “dai dẳng” làm rõ tác dụng theo ngữ cảnh mà không xóa sắc thái mạnh của từ.
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: người ấy cũng sẽ dậy và cho bạn
  rationale: Trong cảnh ban đêm, ἐγερθείς chỉ việc rời giường; tiếng Việt lặp “dậy” tự nhiên và giúp phân biệt rõ hai nhân vật.
- source_word: ὅσων χρῄζει
  choice: mọi thứ bạn cần
  rationale: Truyền đạt phạm vi đầy đủ của đại từ quan hệ số nhiều đi với χρῄζω bằng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἀναίδεια trong dụ ngôn
  choice: “sự dai dẳng không biết ngượng” quy về người đến xin bánh
  alternative: “sự trơ trẽn”, “sự táo bạo”, hoặc hiểu là vì chủ nhà muốn tránh bị mất mặt
  rationale: Đại từ αὐτοῦ về mặt ngữ pháp có thể quy chiếu đến một trong hai người nam, và ἀναίδεια tự nó không đồng nghĩa với “kiên trì”. Ngữ cảnh gần nhất thiên về sự nài xin không biết ngượng của người bạn, nhưng chú thích bảo tồn cả các nét nghĩa từ vựng lẫn khả năng quy chiếu khác thay vì biến câu thành một khẳng định giáo lý về cách Đức Chúa Trời đáp lời.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người ấy” và “người bạn ấy” để hạn chế sự nhập nhằng giữa hai nhân vật, nhưng chú thích vẫn ghi nhận tính mơ hồ thật của nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
