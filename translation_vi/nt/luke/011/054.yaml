translation:
  language: vi
  text: rình chờ Ngài[a], để chộp lấy lời nào từ miệng Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mai phục Ngài” hoặc “chờ để gài bẫy Ngài”.
