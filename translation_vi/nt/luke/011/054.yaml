lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: rình rập
  rationale: Phân từ này diễn tả việc mai phục với ý định thù nghịch nhằm gài bẫy; “rình rập” tự nhiên trong tiếng Việt và giữ được sắc thái ấy.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su; “Ngài” duy trì cách xưng hô trang trọng, rõ ràng trong văn cảnh.
- source_word: θηρεῦσαί
  choice: bắt lấy
  rationale: Động từ gợi hình ảnh săn bắt con mồi; “bắt lấy” giữ phép ẩn dụ và phù hợp với ý tìm lời để gài bẫy.
- source_word: τι
  choice: điều gì đó
  rationale: Đại từ bất định chỉ một lời hoặc một điều nào đó mà họ mong có thể vin vào.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: từ miệng Ngài
  rationale: Cách dịch này giữ hình ảnh cụ thể của nguyên văn về lời phát ra từ miệng, thay vì diễn giải thành “trong lời Ngài nói”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc phân từ cùng hình ảnh săn bắt và “từ miệng” của tiếng Hy Lạp, đồng thời dùng “rình rập” để truyền đạt ý đồ thù nghịch một cách tự nhiên.
