  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: vi
  text: Khi đến, nó thấy nhà đã được quét dọn và sắp xếp ngăn nắp.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được quét dọn và trang hoàng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: khi nó trở về
  rationale: Phân từ bất định của ἔρχομαι được diễn đạt bằng mệnh đề thời gian tự nhiên trong tiếng Việt. Ngữ cảnh câu trước cho thấy uế linh đang trở lại ngôi nhà, nên “trở về” làm rõ chuyển động theo mạch văn mà không thêm một hành động mới.
- source_word: εὑρίσκει
  choice: nó thấy
  rationale: Thì hiện tại tạo sắc thái kể chuyện sống động. Đại từ “nó” quy chiếu về uế linh trong câu trước và tránh gán giới tính không có trong nguyên văn.
- source_word: σεσαρωμένον
  choice: đã được quét dọn
  rationale: Phân từ hoàn thành bị động diễn tả ngôi nhà đã được quét và vẫn ở trong tình trạng ấy. “Đã được quét dọn” tự nhiên trong tiếng Việt và không thêm từ “sạch” vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: κεκοσμημένον
  choice: sắp xếp ngăn nắp
  rationale: Phân từ hoàn thành bị động của κοσμέω trong bối cảnh nhà cửa chủ yếu chỉ tình trạng đã được thu xếp có trật tự. Cách dịch này giữ sắc thái kết quả và phù hợp tiếng Việt hiện đại; nghĩa “trang hoàng” vẫn được ghi ở chú thích.
theological_decisions:
- issue: Đối tượng bị lược của εὑρίσκει
  choice: nó thấy nhà
  alternative: nó thấy nó; nó thấy ngôi nhà ấy
  rationale: Tiếng Hy Lạp không nêu tân ngữ nhưng ngữ cảnh xác định đó là “nhà.” Tiếng Việt không thể dùng hai đại từ “nó” liên tiếp mà vẫn rõ nghĩa, nên khôi phục “nhà” để câu tự nhiên mà không giải thích thêm ý nghĩa biểu tượng.
- issue: Cách quy chiếu về uế linh
  choice: nó
  alternative: hắn; ông ta
  rationale: “Nó” là cách quy chiếu tự nhiên đến “uế linh,” không áp đặt giới tính hay nhân cách hóa vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể ngắn gọn; dùng “nhà” thay cho tân ngữ lược để tránh mơ hồ không tự nhiên trong tiếng Việt. Dấu chú thích [a] đặt ngay sau mệnh đề liên quan.
