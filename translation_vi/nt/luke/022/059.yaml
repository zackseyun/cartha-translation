    rationale: Nguyên văn chỉ dùng αὐτοῦ và οὗτος, không mã hóa tương phản kính trọng hay khinh thị giữa Chúa Giê-xu và Phi-e-rơ. «Anh ta» có thể mang sắc thái xa cách hoặc coi nhẹ; «ông ấy» lại thêm sắc thái tôn kính. Nên dùng cách quy chiếu trung tính để không thêm diễn giải ngữ dụng.
