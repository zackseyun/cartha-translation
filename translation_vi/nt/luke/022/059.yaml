  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: vi
  text: 'Sau khoảng một giờ, một người khác quả quyết: “Đúng là người này cũng đã ở với người ấy, vì người này cũng là người Ga-li-lê.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Khoảng một giờ sau
  rationale: Cụm sở hữu cách tuyệt đối diễn tả một khoảng thời gian đã trôi qua; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái ước lượng của ὡσεὶ.
- source_word: ἄλλος τις
  choice: một người khác
  rationale: Cụm Hy Lạp mang nghĩa bất định là một người khác; tiếng Việt không cần xác định giới tính, nhờ đó giữ nguyên tính bất định của nguyên văn.
- source_word: διϊσχυρίζετο
  choice: quả quyết
  rationale: Động từ diễn tả lời khẳng định mạnh mẽ, đầy tin chắc; “quả quyết” truyền đạt sức nhấn ấy một cách gọn và tự nhiên.
- source_word: Ἐπ’ ἀληθείας
  choice: Đúng là
  rationale: Thành ngữ mở đầu một lời xác quyết về sự thật; “Đúng là” phù hợp với lời nói trực tiếp hiện đại và vẫn giữ sắc thái nhấn mạnh.
- source_word: οὗτος
  choice: người này
  rationale: Đại từ chỉ định hướng trực tiếp vào Phi-e-rơ; “người này” giữ được sắc thái chỉ trỏ, cáo buộc hơn cách dịch đơn thuần là “anh ta”.
- source_word: μετ’ αὐτοῦ ἦν
  choice: đã ở với ông ấy
  rationale: Dịch trực tiếp ý chỉ sự đồng hành, liên hệ mà không diễn giải quá mức thành môn đồ hay bạn đồng hành.
- source_word: καὶ γὰρ
  choice: vì ... cũng
  rationale: “Vì” nêu lý do cho lời khẳng định, còn “cũng” thể hiện lực bổ sung của καί.
- source_word: Γαλιλαῖός ἐστιν
  choice: là người Ga-li-lê
  rationale: Giữ cách nhận diện theo vùng miền trong nguyên văn và diễn đạt tự nhiên bằng tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông ấy” cho Chúa Giê-xu trong lời của người ngoài cuộc, và “anh ta” để quy chiếu Phi-e-rơ, tạo sự phân biệt tự nhiên giữa hai nhân vật mà không thêm danh xưng thần học. Không dùng chú thích vì tiếng Việt “một người” vốn giữ được tính bất định về giới của ἄλλος τις.
