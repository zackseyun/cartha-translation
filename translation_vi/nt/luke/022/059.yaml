revisions:
- from: 'Khoảng một giờ sau, một người khác quả quyết: “Đúng là người này cũng đã ở với ông ấy, vì anh ta cũng là người Ga-li-lê.”'
  to: 'Sau khoảng một giờ, một người khác quả quyết: “Đúng là người này cũng đã ở với người ấy, vì người này cũng là người Ga-li-lê.”'
  rationale: Chỉ thay các đại từ có sắc thái xã hội không được nguyên văn đánh dấu bằng «người ấy» và «người này». Bản sửa giữ nguyên ý nghĩa, tính chỉ trỏ mang sắc thái cáo buộc của οὗτος, và lối diễn đạt hiện đại, tự nhiên.
