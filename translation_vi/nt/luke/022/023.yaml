  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: vi
  text: Họ bắt đầu bàn luận với nhau xem ai trong số họ có lẽ là người sắp làm điều ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Họ bắt đầu bàn luận với nhau xem trong số họ ai có lẽ là người sắp làm điều ấy.” Theo ngữ cảnh, “điều ấy” là hành động phản bội được báo trước trong câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: bắt đầu
  rationale: Giữ rõ sắc thái khởi đầu hành động của động từ ἄρχω với động từ nguyên mẫu.
- source_word: συζητεῖν
  choice: bàn luận
  rationale: Diễn tả việc cùng nhau trao đổi để xác định người được nói đến, nhưng không hàm ý quá mức rằng họ tranh cãi gay gắt.
- source_word: πρὸς ἑαυτούς
  choice: với nhau
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt ý tương hỗ giữa những người trong cùng nhóm.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: xem ai trong số họ có thể là
  rationale: Cấu trúc câu hỏi gián tiếp và thể optative biểu thị sự cân nhắc, không chắc chắn; “có thể là” giữ được sắc thái ấy trong tiếng Việt.
- source_word: μέλλων πράσσειν
  choice: sắp làm
  rationale: Giữ sắc thái cận kề của μέλλω với động từ nguyên mẫu mà không chuyển thành ý định chủ quan.
- source_word: τοῦτο
  choice: điều ấy
  rationale: Giữ cách quy chiếu gián tiếp của nguyên văn về hành động vừa được nhắc đến, thay vì giải nghĩa ngay trong chính văn là phản bội.
theological_decisions:
- issue: Có nên nói rõ hành động được nhắc đến là sự phản bội hay không
  choice: Giữ cách nói “làm điều ấy” trong chính văn.
  alternative: “phản bội Ngài”
  rationale: Ngữ cảnh câu trước cho thấy đây là hành động phản bội, nhưng câu Hy Lạp này chỉ nói τοῦτο, “điều ấy”. Giữ cách nói gián tiếp bảo toàn hình thức và độ căng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bàn luận với nhau” tự nhiên hơn lối dịch sát chữ, còn “điều ấy” giữ sự quy chiếu trang trọng và rõ ràng đến lời vừa nói trước đó.
