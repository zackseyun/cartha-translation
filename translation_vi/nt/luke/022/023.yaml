- from: Họ bắt đầu bàn luận với nhau xem ai trong số họ có thể là người sắp làm điều ấy.[a]
  to: Họ bắt đầu bàn luận với nhau xem ai trong số họ có lẽ là người sắp làm điều ấy.[a]
  rationale: Chỉnh “có thể là” thành “có lẽ là” để truyền đạt tự nhiên và chính xác hơn sắc thái không chắc chắn của thể optative εἴη. Giữ “điều ấy” trong chính văn vì nguyên ngữ không nêu trực tiếp hành động phản bội ở câu này. Chú thích được điều chỉnh để phương án thay thế vẫn giữ sắc thái này.
