  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: ἤρξαντο là “bắt đầu,” συζητεῖν πρὸς ἑαυτούς là “bàn luận với nhau,” và μέλλων πράσσειν τοῦτο được giữ gián tiếp là “sắp làm điều ấy,” không thêm trực tiếp “phản bội Ngài.” Tuy nhiên, “có lẽ là” diễn đạt rõ hơn sắc thái cân nhắc/không chắc chắn của εἴη trong câu hỏi gián tiếp so với “có thể là,” vốn đôi khi có thể được hiểu là khả năng hay năng lực nói chung.'
