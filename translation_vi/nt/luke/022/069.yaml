    issue: Chú thích a bỏ cụm «của Đức Chúa Trời» và diễn giải «Đấng Quyền Năng» như một lối nói thay cho Đức Chúa Trời.
    rationale: SBLGNT có τῆς δυνάμεως τοῦ θεοῦ, nghĩa là «quyền năng của Đức Chúa Trời». Một phương án dịch không được lược τοῦ θεοῦ; lời giải thích về uyển ngữ cũng không phù hợp với cú pháp hiện diện của danh từ «Đức Chúa Trời» trong câu.
