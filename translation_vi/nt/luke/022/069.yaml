  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: vi
  text: Nhưng từ nay, Con Người sẽ ngồi bên phải quyền năng của Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: từ nay
  rationale: Cách nói thời gian tự nhiên trong tiếng Việt, chỉ thời điểm bắt đầu mà từ đó điều được tuyên bố sẽ có hiệu lực.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái chuyển ý có tính tương phản trong lời đáp của Chúa Giê-su.
- source_word: ἔσται ... καθήμενος
  choice: sẽ ngồi
  rationale: Kết hợp động từ tương lai với phân từ thành cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ hình ảnh ngự trị và tôn cao.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ nguyên danh xưng đã được xác lập của Chúa Giê-su cùng âm hưởng Đa-ni-ên và tính đa nghĩa thần học của cụm từ.
- source_word: ἐκ δεξιῶν
  choice: bên phải
  rationale: Thành ngữ Kinh Thánh chỉ vị trí danh dự và thẩm quyền cao nhất; cách dịch này tự nhiên mà vẫn giữ liên hệ liên văn bản.
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: quyền năng của Đức Chúa Trời
  rationale: Dịch sát cấu trúc sở hữu của tiếng Hy Lạp và nói rõ quyền năng thuộc về Đức Chúa Trời, không biến danh từ chung thành danh xưng riêng trong chính văn.
theological_decisions:
- issue: Công thức tôn cao và lời khẳng định về thẩm quyền thần thượng
  choice: Con Người sẽ ngồi bên phải quyền năng của Đức Chúa Trời
  alternative: Con Người sẽ ngồi bên phải Đấng Quyền Năng
  rationale: Cách dịch chính giữ rõ cả hình ảnh Thi Thiên 110 và âm hưởng Đa-ni-ên 7, không giải nghĩa quá mức. Cách hiểu cụm từ như lối nói tôn kính thay cho danh Đức Chúa Trời được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Con Người” được viết hoa như một danh xưng; “Đức Chúa Trời” phù hợp với cách dùng Tin Lành phổ biến nhưng không thêm diễn giải giáo phái. Dấu chú thích xuất hiện ngay sau câu.
