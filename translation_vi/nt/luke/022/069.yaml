review_pass:
  verdict: revise
  source_fidelity: 'Chính văn truyền đạt đầy đủ các thành tố Hy Lạp: sắc thái chuyển ý (δέ), mốc thời gian ἀπὸ τοῦ νῦν, danh xưng «Con Người», trạng thái tương lai «sẽ ngồi», và cụm «bên phải quyền năng của Đức Chúa Trời». Tuy nhiên, chú thích hiện có lược mất τοῦ θεοῦ («của Đức Chúa Trời») trong phương án thay thế, nên không phải là một phương án dịch tương đương của nguyên văn.'
  naturalness: «Nhưng từ nay, Con Người sẽ ngồi bên phải quyền năng của Đức Chúa Trời» là văn phong Kinh Thánh hiện đại, trang trọng và có thể hiểu được. Cấu trúc này cố ý giữ hình ảnh thành ngữ của bản nguồn; không cần diễn giải thành một cách nói ít sát hơn.
  terminology: «Con Người» là cách dịch chuẩn xác và nhất quán cho ὁ υἱὸς τοῦ ἀνθρώπου. «Đức Chúa Trời» phù hợp với đăng ký thuật ngữ của bản dịch. Không nên gọi riêng «Đấng Quyền Năng» là cách nói thay cho Đức Chúa Trời ở đây, vì nguyên văn đã nêu rõ «của Đức Chúa Trời».
  issues:
