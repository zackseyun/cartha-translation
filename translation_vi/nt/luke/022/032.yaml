  to: Nhưng Ta đã cầu nguyện cho con[a] để đức tin của con không mất đi. Còn con, sau khi đã quay lại[b], hãy làm cho anh em mình vững mạnh.
  rationale: Đổi “không suy tàn” thành “không mất đi” để gần hơn với ἐκλίπῃ mà vẫn không giải thích quá mức bản chất hay mức độ thất bại của đức tin. Rút “quay trở lại” thành “quay lại” và dùng “sau khi” để câu tiếng Việt mạch lạc hơn, vẫn giữ ý hành động quay lại có trước mệnh lệnh làm vững mạnh anh em.
