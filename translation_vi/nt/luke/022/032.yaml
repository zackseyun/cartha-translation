id: LUK.22.32
reference: Luke 22:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: vi
  text: Nhưng Ta đã cầu nguyện cho con[a] để đức tin của con không mất đi. Còn con, sau khi đã quay lại[b], hãy làm cho anh em mình vững mạnh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đức tin” cũng có thể mang sắc thái “lòng tin” hoặc “sự trung tín”; các nghĩa này chồng lấn nhau trong từ Hy Lạp.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “sau khi đã trở về” hoặc “sau khi đã quay lại”. Cách diễn đạt gợi đến việc Phi-e-rơ được phục hồi sau thất bại sắp xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: đã cầu nguyện
  rationale: Diễn đạt lời khẩn cầu tha thiết đã được thực hiện; tiếng Việt tự nhiên không cần dùng từ mạnh hơn như “van xin”.
- source_word: περὶ σοῦ
  choice: cho con
  rationale: Với động từ cầu nguyện, περί + sở hữu cách chỉ đối tượng được cầu thay. “Cho con” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: để ... không suy tàn
  rationale: ἐκλείπω có thể chỉ sự tắt đi, cạn kiệt hoặc thất bại. “Không suy tàn” giữ được hình ảnh đức tin có thể yếu đi mà không khẳng định rằng Phi-e-rơ sẽ hoàn toàn mất đức tin.
- source_word: πίστις
  choice: đức tin
  rationale: “Đức tin” giữ được phạm vi nghĩa gồm lòng tin, sự tín thác và sắc thái trung tín, không thu hẹp từ này vào chỉ một phương diện.
- source_word: ποτε
  choice: khi
  rationale: Trong ngữ cảnh này, ποτέ chỉ một thời điểm tương lai chưa xác định; “khi” nối tự nhiên với phân từ và mệnh lệnh theo sau.
- source_word: ἐπιστρέψας
  choice: khi đã quay trở lại
  rationale: Giữ hình ảnh quay về hoặc trở lại sau thất bại, đồng thời để ngỏ sắc thái ăn năn và phục hồi mà không biến nó thành thuật ngữ thần học hẹp.
- source_word: στήρισον
  choice: hãy làm cho ... vững mạnh
  rationale: Diễn đạt nghĩa khiến người khác đứng vững, được củng cố. Cách nói này tự nhiên hơn “hãy củng cố” khi tân ngữ là con người.
- source_word: ἀδελφούς
  choice: anh em
  rationale: Trong ngữ cảnh trực tiếp, từ giống đực số nhiều chỉ nhóm môn đồ nam của Đức Giê-su; “anh em” vừa chính xác vừa tự nhiên.
theological_decisions:
- issue: Phạm vi nghĩa của πίστις trong hoàn cảnh Phi-e-rơ bị thử thách
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: “Đức tin” bảo toàn chiều rộng thần học của từ Hy Lạp. Chú thích ghi nhận các sắc thái chồng lấn thay vì quyết định rằng câu chỉ nói đến niềm tin nội tâm hay sự trung tín trong hành động.
- issue: Ý nghĩa của ἐπιστρέψας đối với tình trạng tương lai của Phi-e-rơ
  choice: khi đã quay trở lại
  alternative: khi đã trở về; khi đã quay lại
  rationale: Cách dịch này gợi đến sự phục hồi sau lần chối Chúa nhưng không đưa thẳng từ “ăn năn” vào bản văn khi từ Hy Lạp không buộc phải được hiểu theo nghĩa kỹ thuật ấy.
- issue: Đối tượng của ἀδελφούς
  choice: anh em
  alternative: anh chị em; các tín hữu
  rationale: Ngữ cảnh trực tiếp hướng đến nhóm môn đồ nam. Giữ “anh em” tránh mở rộng đối tượng quá mức so với cảnh thuật.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta—con” để phản ánh lời Đức Giê-su nói trực tiếp với Phi-e-rơ trong quan hệ thầy–trò; giữ cấu trúc đối lập “Nhưng Ta... Còn con...” của câu Hy Lạp. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
