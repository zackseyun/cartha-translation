base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với Giu-đa: “Giu-đa, dùng một nụ hôn để phản bội Con Người sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “Giu-đa, dùng một nụ hôn để giao nộp Con Người sao?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: 'Liên từ nhẹ này mang sắc thái tương phản trong ngữ cảnh: Đức Giê-su đáp lại hành động của Giu-đa.'
- source_word: εἶπεν αὐτῷ
  choice: nói với hắn
  rationale: Giữ đại từ tường minh αὐτῷ; “hắn” tự nhiên trong ngữ cảnh và thể hiện khoảng cách đối với kẻ đang phản nộp, nhưng không thêm tên vào lời dẫn.
- source_word: Ἰούδα
  choice: Giu-đa
  rationale: Dạng hô cách của tên riêng, theo cách phiên âm quen thuộc trong tiếng Việt.
- source_word: φιλήματι
  choice: dùng một cái hôn
  rationale: Danh từ ở tặng cách chỉ phương tiện; cách dịch giữ hành động cụ thể và làm rõ ý nghĩa công cụ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu tự xưng đã thành lệ của Đức Giê-su và âm hưởng liên văn bản, không diễn giải thành một cách gọi thuần túy chỉ loài người.
- source_word: παραδίδως
  choice: phản nộp
  rationale: Động từ hiện tại ngôi hai số ít chỉ hành động đang diễn ra. “Phản nộp” vừa giữ ý giao nộp vào tay đối phương vừa truyền đạt sắc thái phản bội trong ngữ cảnh.
theological_decisions:
- issue: Cách dịch τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Người Con của loài người
  rationale: “Con Người” là danh hiệu quen thuộc, giữ được chức năng quy chiếu về chính Đức Giê-su và âm hưởng Đa-ni-ên mà không làm phẳng thành một cách nói chung về con người.
- issue: Sắc thái của παραδίδως
  choice: phản nộp
  alternative: giao nộp
  rationale: Trong cảnh Giu-đa dùng cái hôn để chỉ điểm Đức Giê-su, động từ có sắc thái phản bội rõ rệt; “phản nộp” bảo toàn cả hành vi giao nộp lẫn sự phản bội, còn chú thích nêu phương án sát nghĩa hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” và “Giu-đa” theo quy ước tên riêng quen thuộc; câu hỏi giữ lực chất vấn trực tiếp của nguyên văn.
