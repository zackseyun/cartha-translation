revisions:
- from: 'Nhưng Đức Giê-su nói với hắn: “Giu-đa, anh dùng một cái hôn để phản nộp Con Người sao?”[a]'
  to: 'Nhưng Đức Giê-su nói với Giu-đa: “Giu-đa, dùng một nụ hôn để phản bội Con Người sao?”[a]'
  rationale: Thay đại từ mang sắc thái miệt thị bằng việc gọi lại tên riêng để phản ánh trung tính αὐτῷ. Chỉnh cách diễn đạt thành tiếng Việt hiện đại và tự nhiên hơn, đồng thời giữ câu hỏi tu từ, hành động đang diễn ra theo ngữ cảnh, danh hiệu «Con Người», và phương án «giao nộp» trong chú thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:18Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng câu hỏi tu từ, danh hiệu «Con Người», và sắc thái phản bội của παραδίδως trong ngữ cảnh. Tuy nhiên, «hắn» thêm sắc thái khinh miệt không có trong αὐτῷ; «phản nộp» ít thông dụng trong tiếng Việt hiện đại. «Phản bội ... bằng một nụ hôn» tự nhiên hơn, còn chú thích «giao nộp» bảo lưu nghĩa từ vựng trực tiếp của παραδίδωμι.
  naturalness: «Dùng một cái hôn để phản nộp» hơi gượng và «cái hôn» kém tự nhiên hơn «nụ hôn» trong văn phong hiện đại. Lược đại từ ngôi hai trong lời chất vấn sau hô ngữ «Giu-đa» tránh áp đặt cách xưng hô mà vẫn rõ chủ thể.
  terminology: Giữ «Đức Giê-su», «Giu-đa» và «Con Người». «Con Người» là cách dịch ổn định, phù hợp cho τὸν υἱὸν τοῦ ἀνθρώπου. Chú thích dùng «giao nộp» như phương án sát nghĩa hơn cho παραδίδωμι.
  issues:
  - severity: medium
    issue: «nói với hắn»
    rationale: Đại từ «hắn» mang sắc thái hạ thấp/miệt thị trong tiếng Việt hiện đại, trong khi αὐτῷ chỉ đơn thuần là «với ông ấy/ông ta». Cần dùng cách quy chiếu trung tính.
  - severity: medium
    issue: «phản nộp»
    rationale: Từ này không tự nhiên và ít phổ biến trong tiếng Việt hiện đại. «Phản bội» diễn đạt tốt sắc thái ngữ cảnh; chú thích có thể nêu «giao nộp» để giữ phương án sát nghĩa từ vựng.
  - severity: low
    issue: «dùng một cái hôn để...»
    rationale: Cấu trúc này nặng và «cái hôn» kém tự nhiên. «Bằng một nụ hôn» là cách nói hiện đại, gọn và vẫn biểu thị phương tiện của tặng cách φιλήματι.
