id: LUK.22.67
reference: Luke 22:67
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: vi
  text: 'họ nói: “Nếu ông là Đấng Mê-si[a] thì hãy nói cho chúng tôi biết.” Nhưng Ngài đáp: “Nếu tôi nói cho các ông, chắc chắn các ông sẽ không tin;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: họ nói
  rationale: Phân từ hiện tại nối với mạch kể trước đó và dẫn vào lời của hội đồng; cách dịch này tự nhiên trong tiếng Việt mà không thêm ý.
- source_word: Εἰ σὺ εἶ
  choice: Nếu ông là
  rationale: Giữ nguyên cấu trúc điều kiện rõ ràng của tiếng Hy Lạp, thay vì chuyển thành câu hỏi trực tiếp.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Dịch Χριστός như một tước hiệu gắn với niềm mong đợi về Đấng được xức dầu trong bối cảnh Do Thái; chú thích nêu cách gọi quen thuộc khác.
- source_word: εἰπὸν ἡμῖν
  choice: hãy nói cho chúng tôi biết
  rationale: Diễn đạt mệnh lệnh tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Nhưng Ngài đáp
  rationale: δέ biểu thị sự chuyển ý có sắc thái tương phản nhẹ; “đáp” phù hợp với lời hồi đáp trực tiếp.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Nếu tôi nói cho các ông
  rationale: Giữ lực điều kiện của ἐάν với động từ giả định, bằng cấu trúc tiếng Việt tự nhiên.
- source_word: οὐ μὴ πιστεύσητε
  choice: chắc chắn các ông sẽ không tin
  rationale: “chắc chắn… không” chuyển tải phép phủ định nhấn mạnh οὐ μή mà không dùng lối văn cổ.
theological_decisions:
- issue: Cách dịch tước hiệu Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cuộc thẩm vấn này, từ ngữ mang nghĩa tước hiệu về Đấng được xức dầu theo kỳ vọng Do Thái. “Đấng Mê-si” làm rõ sắc thái đó, còn cách gọi truyền thống được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông/các ông” phản ánh lời của hội đồng dành cho Chúa Giê-su; “Ngài” trong lời kể biểu thị sự kính trọng, còn “tôi” trong lời trực tiếp tránh nâng cấp đại từ vượt quá dấu hiệu trong nguyên văn.
