- from: 'Bấy giờ, tất cả họ đều hỏi: “Vậy ông là Con Đức Chúa Trời sao?” Ngài đáp: “Chính các ông nói rằng tôi là Con Đức Chúa Trời.”[a]'
  to: 'Bấy giờ, mọi người đều nói: “Vậy ông là Con Đức Chúa Trời sao?” Ngài đáp: “Chính các ông nói rằng tôi là Con Đức Chúa Trời.”[a]'
  rationale: Đổi «hỏi» thành «nói» để phản ánh εἶπαν sát hơn, và chỉnh cụm chủ ngữ cho tự nhiên. Giữ nguyên kết cấu gián tiếp «Chính các ông nói rằng…», tước hiệu «Con Đức Chúa Trời», và chú thích về phần tỉnh lược của ἐγώ εἰμι.
  reviewer_model: gpt-5.6-terra
