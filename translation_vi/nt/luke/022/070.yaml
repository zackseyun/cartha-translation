source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: vi
  text: 'Bấy giờ, mọi người đều nói: “Vậy ông là Con Đức Chúa Trời sao?” Ngài đáp: “Chính các ông nói rằng tôi là Con Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nguyên văn: “Chính các ông nói rằng tôi là.” Trong ngữ cảnh, câu này có ý xác nhận, nhưng diễn đạt lời xác nhận ấy qua lời của những người chất vấn. Cũng có thể diễn đạt tự nhiên hơn: “Đúng như các ông nói” hoặc “Các ông nói đúng.”'
    reason: Nêu dạng tỉnh lược của nguyên văn và các cách diễn đạt tiếng Việt có sắc thái xác nhận gián tiếp, không biến câu đáp thành một lời khẳng định trực tiếp hơn bản gốc.
lexical_decisions:
- source_word: πάντες
  choice: tất cả họ đều
  rationale: Tính từ số nhiều được dùng như danh từ, chỉ toàn thể nhóm người đang thẩm vấn; cách diễn đạt này giữ được sắc thái tập thể và tự nhiên trong tiếng Việt.
- source_word: οὖν
  choice: vậy
  rationale: Trong câu hỏi này, từ nối biểu thị kết luận được rút ra từ lời trao đổi trước đó; “vậy” chuyển tải tự nhiên sức suy luận ấy.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên sức nặng của tước hiệu Cơ Đốc học, đồng thời dùng cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: ἔφη
  choice: đáp
  rationale: Trong mạch đối thoại, “đáp” tự nhiên hơn “nói” và không thêm sắc thái tuyên bố mạnh hơn nguyên văn.
- source_word: Ὑμεῖς
  choice: chính các ông
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp mang tính nhấn mạnh; “chính các ông” giữ trọng tâm đặt lại lời khẳng định nơi những người chất vấn.
- source_word: λέγετε
  choice: nói
  rationale: Thì hiện tại được chuyển bằng động từ hiện tại đơn giản, trực tiếp và tự nhiên.
- source_word: ὅτι
  choice: rằng
  rationale: Ở đây từ này dẫn vào nội dung lời họ nói, chứ không mang nghĩa nguyên nhân.
- source_word: ἐγώ εἰμι
  choice: tôi là Con Đức Chúa Trời
  rationale: Tiếng Việt không thể kết thúc tự nhiên bằng động từ hệ từ “là” mà không có bổ ngữ; vì vậy bổ ngữ từ câu hỏi được lặp lại để làm rõ phần được tỉnh lược, trong khi cấu trúc “chính các ông nói” vẫn giữ tính gián tiếp của câu đáp.
theological_decisions:
- issue: Câu đáp của Đức Chúa Jêsus là lời khẳng định trực tiếp hay một lời xác nhận gián tiếp
  choice: 'Giữ công thức gián tiếp: “Chính các ông nói rằng tôi là Con Đức Chúa Trời”'
  alternative: “Đúng như các ông nói” hoặc “Đúng, tôi là Con Đức Chúa Trời”
  rationale: Nguyên văn có chức năng xác nhận trong ngữ cảnh nhưng đặt cách diễn đạt trở lại nơi những người chất vấn. Bản dịch không biến câu ấy thành lời “đúng” trực tiếp, nhờ đó giữ được độ căng và sắc thái của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông/các ông” phù hợp với bối cảnh thẩm vấn; “Ngài” dùng trong lời dẫn để chỉ Đức Chúa Jêsus. Bổ ngữ sau “là” được khôi phục từ câu hỏi vì tiếng Việt không dùng động từ hệ từ độc lập như tiếng Hy Lạp.
