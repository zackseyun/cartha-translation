id: LUK.22.8
reference: Luke 22:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: vi
  text: 'Ngài sai Phi-e-rơ và Giăng đi, nói: “Hãy đi chuẩn bị lễ Vượt Qua[a] cho chúng ta ăn.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bữa ăn lễ Vượt Qua”; từ Hy Lạp có thể chỉ lễ Vượt Qua theo nghĩa rộng hơn, dù việc chuẩn bị và ăn trong ngữ cảnh này hướng đến bữa ăn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: sai ... đi
  rationale: Diễn đạt tự nhiên hành động ủy thác và phái Phi-e-rơ cùng Giăng đi làm một việc, đồng thời giữ nét nghĩa của ἀποστέλλω.
- source_word: εἰπών
  choice: nói
  rationale: Giữ liên kết phân từ với động từ chính theo cách gọn và tự nhiên trong tiếng Việt.
- source_word: Πορευθέντες
  choice: Hãy đi
  rationale: Trong ngữ cảnh mệnh lệnh, phân từ này mang lực của hành động mở đầu đi kèm mệnh lệnh chính; “Hãy đi” chuyển tải trực tiếp mà không máy móc.
- source_word: ἑτοιμάσατε
  choice: chuẩn bị
  rationale: Từ ngữ hiện đại, rõ ràng, chỉ những công việc thực tế cần làm trước lễ và bữa ăn.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ nghĩa lợi ích của cách dữ cách mà không thêm ý “tất cả” vốn không có trong nguyên văn.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: Giữ phạm vi nghĩa tương đối rộng của πάσχα; ngữ cảnh “chuẩn bị” và “ăn” hướng đến bữa ăn nhưng không buộc bản dịch chính phải thu hẹp thuật ngữ.
- source_word: ἵνα φάγωμεν
  choice: cho chúng ta ăn
  rationale: Diễn đạt mục đích tự nhiên trong tiếng Việt; đối tượng được ăn được ngữ cảnh cung cấp nên không cần lặp lại.
theological_decisions:
- issue: Phạm vi nghĩa của τὸ πάσχα
  choice: lễ Vượt Qua
  alternative: bữa ăn lễ Vượt Qua; chiên lễ Vượt Qua
  rationale: Ngữ cảnh chuẩn bị để ăn nghiêng mạnh về bữa ăn, nhưng chính thuật ngữ Hy Lạp có thể chỉ lễ Vượt Qua rộng hơn hoặc những yếu tố gắn với lễ. Bản dịch chính giữ độ rộng này, còn chú thích nêu cách hiểu cụ thể theo ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. “Ngài” duy trì cách quy chiếu kính trọng đến Chúa Giê-su; tên riêng dùng dạng Phi-e-rơ và Giăng quen thuộc trong tiếng Việt. Cấu trúc lời truyền bảo được làm tự nhiên mà không thêm chủ thể hay đối tượng không có trong nguyên văn.
