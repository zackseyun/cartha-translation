  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành phần chính của câu: Chúa Giê-su sai Phi-e-rơ và Giăng; lời truyền lệnh «Hãy đi» phản ánh lực mệnh lệnh của Πορευθέντες; «chuẩn bị» tương ứng ἑτοιμάσατε; «cho chúng ta ăn» diễn đạt tự nhiên quan hệ lợi ích của ἡμῖν và mục đích của ἵνα φάγωμεν. «Lễ Vượt Qua» giữ được độ rộng có chủ ý của τὸ πάσχα, không ép nghĩa thành chiên hoặc bữa ăn riêng lẻ.'
  naturalness: 'Câu văn hiện đại, rõ ràng và có nhịp kể chuyện tự nhiên. Cấu trúc «sai ... đi, nói: “Hãy đi ...”» có sự lặp lại bề mặt của «đi», nhưng phù hợp với việc câu nguồn vừa có động từ «sai» vừa có mệnh lệnh attendant «Hãy đi»; không gây tối nghĩa.'
  terminology: «Ngài», «Phi-e-rơ», «Giăng» và «lễ Vượt Qua» nhất quán với một bản dịch Việt ngữ trang trọng vừa phải. Chú thích nêu đúng khả năng «bữa ăn lễ Vượt Qua» mà không biến khả năng đó thành nghĩa bắt buộc của bản văn chính.
