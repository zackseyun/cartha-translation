  text: Họ vui mừng và đồng ý trao tiền cho ông ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bạc.” Từ Hy Lạp này có thể chỉ bạc theo nghĩa đen hoặc tiền nói chung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: vui mừng
  rationale: Động từ ở đây diễn tả phản ứng vui thích của họ; “vui mừng” tự nhiên, trang trọng vừa phải và giữ được cường độ của nguyên ngữ.
- source_word: συνέθεντο
  choice: đồng ý
  rationale: Dạng trung của συντίθημι mang nghĩa đi đến thỏa thuận. “Đồng ý” ngắn gọn, tự nhiên và không diễn giải thành “hứa”.
- source_word: αὐτῷ
  choice: cho hắn
  rationale: Đại từ chỉ Giu-đa, làm tân ngữ gián tiếp của δοῦναι. “Hắn” phù hợp với ngữ cảnh phản bội và cách kể tự nhiên trong tiếng Việt, nhưng không thêm một danh xưng không có trong nguyên văn.
- source_word: ἀργύριον
  choice: tiền
  rationale: Từ này theo nghĩa đen là bạc, nhưng trong ngữ cảnh giao dịch thường chỉ tiền. “Tiền” truyền đạt rõ nghĩa thông dụng; nghĩa đen được giữ trong chú thích.
- source_word: δοῦναι
  choice: trao
  rationale: Động từ nguyên mẫu nêu nội dung của sự thỏa thuận. “Trao” giữ nghĩa cho/đưa mà không diễn giải rõ hơn thành “trả công”.
