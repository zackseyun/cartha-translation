source:
  edition: SBLGNT
  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Khi Ta sai anh em đi mà không có túi tiền, túi đi đường[a] và dép, anh em có thiếu thứ gì không?” Họ đáp: “Không thiếu gì cả.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “túi hành trang.”
    reason: πήρα chỉ một loại túi hoặc bao dùng để mang đồ khi đi đường; nguyên ngữ không xác định chính xác kiểu dáng.
lexical_decisions:
- source_word: ἄτερ
  choice: mà không có
  rationale: Diễn đạt tự nhiên sự vắng thiếu của những vật được liệt kê, đúng chức năng của giới từ ἄτερ.
- source_word: βαλλαντίου
  choice: túi tiền
  rationale: Chỉ túi dùng để mang tiền; cách dịch cụ thể, dễ hiểu trong tiếng Việt hiện đại.
- source_word: πήρας
  choice: túi hành trang
  rationale: Chỉ loại túi mang đồ dùng hoặc lương thực khi đi đường; cách dịch nêu rõ công dụng mà không quy định quá cụ thể hình dạng của túi.
- source_word: ὑποδημάτων
  choice: dép
  rationale: Phù hợp với loại đồ mang chân trong bối cảnh đi đường thời các sách Phúc Âm.
- source_word: μή τινος ὑστερήσατε
  choice: anh em có thiếu thứ gì không?
  rationale: Giữ nguyên câu hỏi hướng đến câu trả lời phủ định và chuyển ὑστερέω bằng cách nói tự nhiên trong tiếng Việt.
- source_word: Οὐθενός
  choice: Không thiếu gì cả
  rationale: Tái hiện câu đáp phủ định ngắn gọn; thêm động từ được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: ἀπέστειλα
  choice: sai anh em đi
  rationale: Trong bối cảnh sứ mạng, cách nói này thể hiện rõ hành động phái các môn đồ đi làm nhiệm vụ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn, “Ta” và “anh em” trong lời Đức Giê-su để thể hiện quan hệ người sai phái với các môn đồ mà không dùng lối quá cổ. Cấu trúc hỏi–đáp ngắn gọn của nguyên văn được giữ lại.
