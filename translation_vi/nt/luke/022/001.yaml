  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: vi
  text: Lễ Bánh Không Men[a], còn gọi là Lễ Vượt Qua, đang đến gần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lễ Vượt Qua và Lễ Bánh Không Men là hai kỳ lễ liên hệ mật thiết; trong cách dùng của người Do Thái, hai tên gọi này có thể được dùng để chỉ toàn bộ kỳ lễ với phạm vi nghĩa chồng lấn.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: đang đến gần
  rationale: Thì chưa hoàn thành diễn tả lễ đang dần tới gần; cách dịch này tự nhiên và giữ được sắc thái tiếp diễn.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Ở đây δέ là từ nối nhẹ trong diễn tiến câu chuyện; tiếng Việt không cần thêm một từ như “bấy giờ” hay “nhưng”.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: Lễ Bánh Không Men
  rationale: Đây là tên gọi quen thuộc, rõ nghĩa của lễ hội Do Thái được nói đến trong câu.
- source_word: ἡ λεγομένη
  choice: còn gọi là
  rationale: Diễn đạt tự nhiên chức năng giải thích của phân từ, cho biết lễ này cũng được gọi bằng tên khác.
- source_word: Πάσχα
  choice: lễ Vượt Qua
  rationale: Đây là tên gọi tiếng Việt thông dụng của lễ Do Thái; thêm “lễ” giúp câu rõ và tự nhiên.
theological_decisions:
- issue: Mối quan hệ giữa Lễ Bánh Không Men và lễ Vượt Qua
  choice: 'Giữ cách Lu-ca đồng nhất hai tên gọi trong lời giải thích: “Lễ Bánh Không Men, còn gọi là lễ Vượt Qua”.'
  alternative: Phân biệt cứng nhắc hai lễ và diễn đạt như hai kỳ lễ riêng biệt.
  rationale: Cấu trúc Hy Lạp trình bày “Vượt Qua” như tên gọi giải thích cho lễ đang được nhắc đến. Bản dịch giữ nguyên cách diễn đạt này mà không xóa bỏ sự phân biệt lịch sử giữa các nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Bánh Không Men” theo cách gọi Kinh Thánh quen thuộc; không thêm từ nối ở đầu câu vì tiếng Việt không cần biểu thị riêng sắc thái chuyển ý nhẹ của δέ.
