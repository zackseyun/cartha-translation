id: LUK.22.43
reference: Luke 22:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: vi
  text: Bấy giờ, một thiên sứ từ trời hiện ra với Ngài[a] và thêm sức cho Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có các câu 43–44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: hiện ra
  rationale: Dạng thụ động aorist của ὁράω thường được dùng như công thức chỉ sự hiện ra; “hiện ra” tự nhiên hơn cách dịch máy móc “được thấy” và không chuyển trọng tâm sang người quan sát.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ thúc đẩy diễn tiến câu chuyện hơn là biểu thị sự tương phản; “Bấy giờ” trang trọng, tự nhiên và không nhấn quá mức quan hệ thời gian.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Đại từ ở cách dữ cách đi với ὤφθη chỉ người tiếp nhận sự hiện ra; “hiện ra với Ngài” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἄγγελος
  choice: một thiên sứ
  rationale: Ngữ cảnh từ trời xác định đây là sứ giả thiên giới; “thiên sứ” diễn đạt rõ nghĩa này, còn “một” phản ánh danh từ không có mạo từ.
- source_word: ἀπ’ οὐρανοῦ
  choice: từ trời
  rationale: Cụm giới từ diễn tả nguồn gốc thiên giới; “từ trời” ngắn gọn, tự nhiên và giữ nguyên sắc thái thần học của nguồn.
- source_word: ἐνισχύων
  choice: thêm sức cho
  rationale: Phân từ hiện tại chỉ hành động đi kèm với việc hiện ra. “Thêm sức cho” truyền đạt việc ban sức lực mà không thu hẹp nghĩa thành chỉ khích lệ tinh thần.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ làm tân ngữ, quy chiếu đến Chúa Giê-su; viết hoa đại từ là quy ước kính trọng quen thuộc trong văn phong Kinh Thánh tiếng Việt, không thêm một danh xưng vào nguyên văn.
theological_decisions:
- issue: Tình trạng văn bản của Lu-ca 22:43
  choice: Giữ câu này trong chính văn theo bản SBLGNT được cung cấp.
  alternative: Một số thủ bản không có Lu-ca 22:43–44.
  rationale: Bản dịch theo văn bản Hy Lạp được cung cấp, nhưng ghi rõ dị bản quan trọng trong chú thích để không che khuất vấn đề văn bản hoặc tự ý giải quyết căng thẳng thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Bấy giờ” duy trì nhịp kể chuyện; “thiên sứ” và “thêm sức” là những cách nói quen thuộc, rõ nghĩa. Dấu chú thích [a] được đặt ngay sau đối tượng của sự hiện ra, tương ứng lớp tham khảo tiếng Anh.
