id: LUK.22.27
reference: Luke 22:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: vi
  text: 'Vì ai lớn hơn: người ngồi ăn[a] hay người phục vụ? Chẳng phải người ngồi ăn sao? Nhưng tôi ở giữa anh em như người phục vụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “người nằm tựa.” Theo tập tục dự tiệc thời ấy, khách nằm tựa bên bàn, còn người phục vụ phục vụ họ.
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: Vì ai lớn hơn
  rationale: “Vì” giữ quan hệ giải thích của γὰρ với lời trước; “ai lớn hơn” bảo toàn phép so sánh về địa vị mà không diễn giải quá mức thành “quan trọng hơn”.
- source_word: ὁ ἀνακείμενος
  choice: người ngồi ăn
  rationale: Động từ chỉ tư thế nằm tựa khi dự tiệc trong văn hóa đương thời. Tiếng Việt tự nhiên dùng “ngồi ăn”; chú thích nêu rõ hình ảnh nguyên ngữ.
- source_word: ὁ διακονῶν
  choice: người phục vụ
  rationale: Dạng phân từ nhấn mạnh hành động phục vụ trong bữa ăn, không phải danh từ chỉ thân phận nô lệ hay một chức vụ trong hội thánh.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Cấu trúc hỏi tu từ này tự nhiên trong tiếng Việt và thể hiện câu hỏi mong đợi câu trả lời khẳng định.
- source_word: ἐγὼ δὲ
  choice: Nhưng tôi
  rationale: “Nhưng” làm rõ sự tương phản giữa quan niệm địa vị thông thường và cách Đức Giê-su hiện diện giữa các môn đồ.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: tôi ở giữa anh em
  rationale: Giữ khá sát hình ảnh “ở giữa các anh em” đồng thời dùng cách diễn đạt tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὡς ὁ διακονῶν
  choice: như một người phục vụ
  rationale: “Như” giữ sắc thái cách thức/so sánh của ὡς; “một người phục vụ” tránh biến phân từ thành một danh hiệu cố định.
theological_decisions:
- issue: Cách dịch lời Đức Giê-su tự mô tả bằng ngôn ngữ phục vụ
  choice: Nhưng tôi ở giữa anh em như một người phục vụ.
  alternative: Nhưng tôi ở giữa anh em như một đầy tớ.
  rationale: Nguyên ngữ dùng phân từ διακονῶν, chỉ người đang phục vụ, chứ không dùng δοῦλος, danh từ có thể nhấn mạnh thân phận nô lệ. Bản dịch giữ trọng tâm vào hành động phục vụ trong bối cảnh bữa ăn và không đưa thêm một sắc thái thần học vượt quá từ ngữ của câu.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. “Anh em” diễn đạt số nhiều ὑμῶν trong lời Đức Giê-su nói với các môn đồ; “ngồi ăn” được ưu tiên hơn cách dịch sát chữ nhưng xa lạ “nằm tựa,” với hình ảnh nguyên ngữ được bảo lưu trong chú thích.
