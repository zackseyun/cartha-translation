  to: 'Vì ai lớn hơn: người ngồi ăn[a] hay người phục vụ? Chẳng phải người ngồi ăn sao? Nhưng tôi ở giữa anh em như người phục vụ.'
  rationale: Chỉ điều chỉnh nhẹ để chú thích không thêm một chi tiết không có trong câu nguồn, và để cụm cuối phản ánh trực tiếp hơn thế đối lập của nguyên ngữ. Ý nghĩa của bản dịch không thay đổi.
