  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: vi
  text: Ông đồng ý và bắt đầu tìm cơ hội để nộp Người cho họ khi không có đám đông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phản bội Người”. Động từ Hy Lạp có nghĩa đen là “trao” hoặc “nộp”; trong vai trò của Giu-đa, dịch là “phản bội” cũng phù hợp với ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: đồng ý
  rationale: Trong mạch văn, Giu-đa chấp thuận đề nghị của các thầy tế lễ cả và các quan chỉ huy; “đồng ý” diễn đạt tự nhiên nghĩa ưng thuận tại đây.
- source_word: ἐζήτει
  choice: bắt đầu tìm
  rationale: Thì chưa hoàn thành có thể diễn tả hành động đang tiếp diễn hoặc khởi sự; “bắt đầu tìm” làm rõ bước phát triển của câu chuyện sau khi ông đồng ý.
- source_word: εὐκαιρίαν
  choice: cơ hội
  rationale: Diễn đạt tự nhiên một thời điểm hoặc hoàn cảnh thuận tiện để thực hiện hành động.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: để nộp Đức Chúa Jêsus
  rationale: “Nộp” giữ được nghĩa cơ bản của παραδίδωμι là trao hoặc giao một người vào tay người khác, đồng thời phù hợp ngữ cảnh Giu-đa phản bội. Dùng danh xưng thay cho đại từ giúp câu tiếng Việt rõ chủ thể được nộp.
- source_word: ἄτερ ὄχλου
  choice: khi không có đám đông
  rationale: Diễn đạt rõ ý Giu-đa tìm một dịp mà đám đông không hiện diện, theo nghĩa “không có/tách khỏi” của ἄτερ.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Chỉ những người nhận Đức Chúa Jêsus, tức các thầy tế lễ cả và các quan chỉ huy trong ngữ cảnh trước.
theological_decisions:
- issue: Cách diễn đạt hành động của Giu-đa
  choice: nộp Đức Chúa Jêsus cho họ
  alternative: phản bội Đức Chúa Jêsus
  rationale: “Nộp” bám sát nghĩa từ vựng và giữ liên hệ với các lần dùng cùng động từ trong trình thuật thương khó; nghĩa phản bội vẫn rõ từ ngữ cảnh và được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Chúa Jêsus” làm rõ đối tượng của đại từ αὐτόν; “khi không có đám đông” tự nhiên hơn lối dịch sát chữ “tách khỏi đám đông.”
