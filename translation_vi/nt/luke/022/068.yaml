  text: ἐὰν ⸀δὲ ἐρωτήσω, οὐ μὴ ⸀ἀποκριθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/068.yaml
  text: But if I ask[a], you will certainly not answer.
translation:
  language: vi
  text: Nhưng nếu tôi hỏi, các ông chắc chắn sẽ không trả lời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: nếu
  rationale: Dẫn vào một mệnh đề điều kiện; “nếu” tự nhiên và không thêm sắc thái nhấn mạnh ngoài nguyên văn.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện sự tương phản với lời trước và phù hợp với mạch tranh luận.
- source_word: ἐρωτήσω
  choice: tôi hỏi
  rationale: Diễn đạt tự nhiên hành động đặt câu hỏi mà không thu hẹp nghĩa thành thẩm vấn mang tính đối địch.
- source_word: οὐ μὴ
  choice: chắc chắn sẽ không
  rationale: Giữ được sức nhấn mạnh của cấu trúc phủ định mạnh οὐ μή trong tiếng Hy Lạp bằng lối nói Việt hiện đại.
- source_word: ἀποκριθῆτε
  choice: trả lời
  rationale: Là cách tương đương trực tiếp, tự nhiên trong bối cảnh đối thoại xét xử.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi” cùng cách gọi “các ông” phù hợp lời Đức Giê-su nói với hội đồng lãnh đạo nam giới, đồng thời giữ khoảng cách trong bối cảnh xét xử.
