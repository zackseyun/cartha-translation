id: LUK.22.49
reference: Luke 22:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: vi
  text: 'Khi những người ở quanh Ngài thấy điều sắp xảy ra, họ nói: “Lạy Chúa, chúng con có nên dùng gươm[a] mà đánh không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp μάχαιρα có thể chỉ gươm, đoản kiếm hoặc dao găm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi ... thấy
  rationale: Phân từ bất định quá khứ được diễn đạt như một mệnh đề thời gian tự nhiên trong tiếng Việt, giữ quan hệ với động từ chính.
- source_word: οἱ περὶ αὐτὸν
  choice: những người ở quanh Ngài
  rationale: Giữ cách nói khá sát nguyên văn, chỉ những người đang ở bên và bao quanh Đức Chúa Jêsus, mà không xác định quá mức rằng họ là ai.
- source_word: τὸ ἐσόμενον
  choice: điều sắp xảy ra
  rationale: Diễn tả rõ tính cận kề của sự việc được nói đến trong phân từ tương lai.
- source_word: εἶπαν
  choice: họ nói
  rationale: Giữ nghĩa thông thường của λέγω; dấu hỏi trong lời trích dẫn tự nhiên cho thấy đây là một câu hỏi.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Lạy” là từ xưng hô trang trọng, tự nhiên trong tiếng Việt; “Chúa” giữ sức nặng của tước hiệu κύριος khi thưa với Đức Chúa Jêsus.
- source_word: εἰ
  choice: có nên ... không
  rationale: Trong ngữ cảnh này, εἰ mở đầu một câu hỏi cân nhắc; cấu trúc “có nên ... không” truyền đạt tự nhiên ý xin quyết định hoặc chỉ thị.
- source_word: πατάξομεν
  choice: chúng con ... đánh
  rationale: Động từ tương lai được dùng trong câu hỏi cân nhắc. “Đánh” giữ nghĩa hành động ra đòn mà không diễn giải rộng thành một cuộc tấn công; “chúng con” là cách nhóm môn đồ thưa với Chúa trong tiếng Việt.
- source_word: ἐν μαχαίρῃ
  choice: dùng gươm
  rationale: ἐν có nghĩa chỉ phương tiện ở đây. Cách nói không có mạo từ trong tiếng Việt tự nhiên và không buộc phải quyết định giữa “thanh gươm ấy” với “một thanh gươm”; chú thích bảo lưu phạm vi nghĩa của μάχαιρα.
theological_decisions:
- issue: Cách dịch κύριος khi trực tiếp thưa với Đức Chúa Jêsus
  choice: Lạy Chúa
  alternative: Thưa Thầy
  rationale: “Lạy Chúa” vừa tự nhiên trong lời thưa trang trọng vừa giữ tước hiệu và âm hưởng thần học của κύριος, thay vì thu hẹp thành một danh xưng xã hội.
- issue: Đại từ chỉ Đức Chúa Jêsus trong οἱ περὶ αὐτόν
  choice: Ngài
  alternative: Đức Chúa Jêsus
  rationale: Đại từ giữ đúng cách diễn đạt của nguyên văn và tránh đưa tên riêng vào nơi bản Hy Lạp chỉ dùng đại từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi được diễn đạt tự nhiên bằng “có nên ... không”; trật tự “dùng gươm mà đánh” giữ rõ phương tiện và hành động. Viết hoa “Ngài” theo lối tôn kính dành cho Đức Chúa Jêsus.
