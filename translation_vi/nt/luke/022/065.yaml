  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: vi
  text: Họ còn nói nhiều điều khác, lăng mạ Ngài.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “phỉ báng Ngài” hay “nói nhiều lời phạm thượng chống lại Ngài.” Động từ Hy Lạp có thể chỉ việc phỉ báng, lăng mạ, hoặc—tùy ngữ cảnh—phạm thượng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “chống lại Ngài” hoặc, sát hơn, “với Ngài.” Giới từ Hy Lạp có thể chỉ lời nói hướng đến Ngài; trong ngữ cảnh này, lời nói ấy mang tính thù nghịch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: còn
  rationale: Nối với những hành vi ngược đãi ở câu trước và tự nhiên diễn đạt ý bổ sung trong tiếng Việt.
- source_word: ἕτερα πολλὰ
  choice: nhiều ... khác
  rationale: Giữ cả ý số lượng nhiều và ý bổ sung ngoài những điều đã kể.
- source_word: βλασφημοῦντες
  choice: lời ... xúc phạm
  rationale: Động từ có thể chỉ lời phỉ báng, lăng mạ hoặc phạm thượng. “Xúc phạm” tự nhiên trong ngữ cảnh lời nói nhắm vào Chúa Giê-xu, đồng thời chú thích giữ lại sắc thái mạnh hơn có thể có.
- source_word: ἔλεγον
  choice: nói
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; trong mạch kể tiếng Việt, “còn nói” chuyển tải tự nhiên sắc thái ấy mà không nặng nề.
- source_word: εἰς αὐτόν
  choice: đến Ngài
  rationale: Giữ đối tượng mà những lời thù nghịch nhắm tới; cách diễn đạt này tự nhiên khi đi với “xúc phạm” và không buộc phải phân xử giữa nghĩa sát “với Ngài” và nghĩa theo ngữ cảnh “chống lại Ngài”.
theological_decisions:
- issue: Mức độ thần học của βλασφημοῦντες
  choice: Dùng “xúc phạm” trong chính văn và nêu “phạm thượng” trong chú thích
  alternative: Dịch thẳng là “nói nhiều lời phạm thượng khác”
  rationale: βλασφημέω có phạm vi nghĩa từ lăng mạ, phỉ báng đến phạm thượng. Chính văn không nên chỉ dựa vào căn tính thần học của đối tượng để khóa nghĩa vào “phạm thượng”; chú thích bảo tồn đầy đủ sức nặng và sự mơ hồ thực sự của từ Hy Lạp.
- issue: Quan hệ của εἰς αὐτόν với lời nói thù nghịch
  choice: “đến Ngài”
  alternative: “chống lại Ngài” hoặc “với Ngài”
  rationale: Ngữ cảnh rõ ràng là thù nghịch, nhưng giới từ εἰς tự nó có thể được hiểu sát hơn là lời nói hướng đến Ngài. Bản dịch chính giữ cách nói tự nhiên, còn chú thích trình bày lựa chọn đối nghịch mạnh hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp với cách nhắc đến Chúa Giê-xu trong ngữ cảnh Kinh Thánh. Hai dấu chú thích đều xuất hiện trong chính văn.
