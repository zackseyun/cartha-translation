review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng thế đối lập mạnh của ὑμεῖς δὲ οὐχ οὕτως, mệnh lệnh γινέσθω, và hai cặp tương phản về địa vị/lãnh đạo với người trẻ hơn/phục vụ. Tuy nhiên, “người lớn hơn” trong tiếng Việt thường được hiểu là lớn tuổi hơn, trong khi μείζων ở đây chỉ người được xem là cao hơn về địa vị; cần làm rõ trong thân bài mà vẫn giữ ý so sánh.
  naturalness: Cấu trúc tổng thể tự nhiên và trang trọng. “Người có địa vị cao hơn giữa anh em” rõ nghĩa và tự nhiên hơn “người lớn hơn trong anh em”. Việc lặp lại “hãy trở nên” ở vế cuối làm lực mệnh lệnh và thế song song của câu rõ ràng hơn trong tiếng Việt.
  terminology: “Anh em,” “người lãnh đạo,” và “người phục vụ” phù hợp tiếng Việt Kinh Thánh hiện đại, không áp đặt cơ cấu chức vụ về sau. “Người trẻ hơn” được giữ sát νεώτερος; chú thích giải thích đúng hàm ý xã hội của từ trong bối cảnh.
  issues:
  - severity: medium
    issue: “người lớn hơn trong anh em” dễ được hiểu là người nhiều tuổi hơn.
    rationale: ὁ μείζων ở đây nói đến người lớn hơn/cao hơn theo địa vị hoặc tầm quan trọng, đối lập với người ở vị thế xã hội thấp hơn; cách dùng “lớn hơn” trong tiếng Việt không truyền đạt ổn định sắc thái này.
  - severity: low
    issue: Vế về người lãnh đạo chưa biểu lộ rõ lực mệnh lệnh “trở nên”.
    rationale: Dù có thể hiểu theo vế trước, thêm “cũng hãy trở nên” giúp tiếng Việt phản ánh rõ γινέσθω chi phối cấu trúc song song mà không đổi nghĩa.
