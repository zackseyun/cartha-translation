id: LUK.22.26
reference: Luke 22:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: vi
  text: Nhưng anh em thì không được như vậy.[a] Trái lại, người có địa vị cao hơn giữa anh em hãy trở nên như người trẻ hơn,[b] và người lãnh đạo cũng hãy trở nên như người phục vụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng anh em không được như thế.” Câu Hy Lạp được nói gọn và đối lập mạnh các môn đệ của Đức Chúa Giê-su với lối tìm kiếm địa vị vừa được mô tả.'
    reason: alternative_reading
  - marker: b
    text: “Người trẻ hơn” chỉ người có địa vị xã hội thấp hơn, chứ không chỉ đơn thuần là người ít tuổi hơn.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Nhưng anh em thì không được như vậy
  rationale: Giữ sự tương phản nhấn mạnh của ὑμεῖς δὲ và diễn đạt tự nhiên mệnh ý hàm ẩn trong οὐχ οὕτως; “như vậy” quy chiếu về lối tìm kiếm địa vị ở câu trước.
- source_word: ἀλλ’
  choice: Trái lại
  rationale: Đánh dấu rõ bước chuyển đối lập mạnh sang lời dạy tích cực của Đức Chúa Giê-su.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: người lớn hơn trong anh em
  rationale: Giữ dạng so sánh của μείζων và sắc thái về địa vị, đồng thời không đổi thành dạng cao nhất “lớn nhất”.
- source_word: γινέσθω
  choice: hãy trở nên
  rationale: Bảo toàn sắc thái trở thành hoặc đảm nhận một tư thế của γίνομαι cùng lực mệnh lệnh.
- source_word: ὡς ὁ νεώτερος
  choice: như người trẻ hơn
  rationale: Giữ dạng so sánh “trẻ hơn”; chú thích làm rõ đây còn là người ở địa vị xã hội thấp hơn, chứ không chỉ nói về tuổi tác.
- source_word: ὁ ἡγούμενος
  choice: người lãnh đạo
  rationale: Diễn đạt tự nhiên vai trò dẫn dắt trong cộng đồng mà không áp đặt sắc thái cai trị chính trị hay chức vụ giáo hội về sau.
- source_word: ὡς ὁ διακονῶν
  choice: như người phục vụ
  rationale: 'Giữ ý chủ động của phân từ διακονῶν: người đang phục vụ người khác.'
theological_decisions:
- issue: Bản chất lời dạy của Đức Chúa Giê-su về địa vị và sự lãnh đạo
  choice: 'Trình bày sự đảo ngược địa vị xã hội trong cộng đồng môn đồ: người có địa vị và người lãnh đạo phải mang tư thế thấp hơn và phục vụ.'
  alternative: Dùng ngôn ngữ thể chế mạnh hơn về chức vụ hoặc quyền cai trị.
  rationale: Bản Hy Lạp đặt “người lớn hơn” và “người lãnh đạo” song song với “người trẻ hơn” và “người phục vụ”; cách dịch duy trì lời kêu gọi khiêm nhường mà không nhập vào những cơ cấu giáo hội về sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời nói với các môn đồ; giữ cấu trúc đối xứng và sự căng thẳng giữa địa vị, lãnh đạo với phục vụ.
