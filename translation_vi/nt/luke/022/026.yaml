revisions:
- from: Nhưng anh em thì không được như vậy.[a] Trái lại, người lớn hơn trong anh em hãy trở nên như người trẻ hơn,[b] và người lãnh đạo hãy như người phục vụ.
  to: Nhưng anh em thì không được như vậy.[a] Trái lại, người có địa vị cao hơn giữa anh em hãy trở nên như người trẻ hơn,[b] và người lãnh đạo cũng hãy trở nên như người phục vụ.
  rationale: Đổi “người lớn hơn” thành “người có địa vị cao hơn” để chuyển đạt đúng μείζων trong ngữ cảnh, tránh hiểu lệch sang tuổi tác. Làm rõ tính song song mệnh lệnh ở vế thứ hai. Chú thích a được chỉnh nhẹ từ “môn đồ” thành “môn đệ” để nhất quán với văn phong hiện đại; ý nghĩa không thay đổi.
  reviewer_model: gpt-5.6-terra
