  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng chuỗi hành động của nguyên văn: sau khi bắt giữ Đức Giê-su, họ dẫn Ngài đi rồi đưa Ngài vào nhà thượng tế; Phêrô theo sau ở một khoảng cách. Tuy nhiên, việc lặp lại bổ ngữ “Ngài” ở động từ thứ hai làm rõ cấu trúc song hành ἤγαγον ... εἰσήγαγον và tự nhiên hơn trong tiếng Việt.'
  naturalness: “Nhà của vị thượng tế” không sai, nhưng “nhà thượng tế” gọn và tự nhiên hơn trong văn kể chuyện hiện đại. “Vẫn đi theo từ xa” diễn đạt rõ sắc thái tiếp diễn của thì chưa hoàn thành ἠκολούθει mà không thêm đánh giá về động cơ của Phêrô.
  terminology: “Thượng tế” là thuật ngữ chuẩn cho ἀρχιερεύς. Dạng tên “Phêrô” nhất quán với lối dùng Công giáo phổ biến; không có lý do ngữ văn để đổi tên trong câu này. Đại từ kính trọng “Ngài” phù hợp với văn phong của bản nháp.
