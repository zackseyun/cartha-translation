source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: vi
  text: Sau khi bắt giữ Ngài, họ dẫn Ngài đi và đưa Ngài vào nhà thượng tế; còn Phêrô vẫn đi theo từ xa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “từ đằng xa.”'
    reason: Nêu một cách diễn đạt tự nhiên khác cho μακρόθεν, chỉ khoảng cách không gian và không gán thêm động cơ cho Phêrô.
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Sau khi bắt
  rationale: Phân từ bất định chỉ hành động xảy ra trước các động từ chính; “sau khi bắt” tự nhiên trong tiếng Việt và phù hợp với bối cảnh bắt giữ.
- source_word: ἤγαγον
  choice: họ dẫn Ngài đi
  rationale: Giữ nghĩa căn bản của ἄγω là dẫn đi, đồng thời thể hiện việc Ngài đang ở dưới sự áp giải.
- source_word: εἰσήγαγον
  choice: đưa vào
  rationale: Diễn đạt rõ hướng chuyển động vào bên trong và tránh lặp lại động từ “dẫn” ngay trước đó.
- source_word: οἰκίαν
  choice: nhà
  rationale: Chỉ địa điểm vật chất; “nhà” là cách dịch trực tiếp, tự nhiên và không quá trang trọng.
- source_word: ἀρχιερέως
  choice: vị thượng tế
  rationale: Chỉ chức vụ tư tế cao nhất trong bối cảnh Do Thái; “vị thượng tế” trang trọng, gọn và dễ hiểu.
- source_word: ἠκολούθει
  choice: thì đi theo
  rationale: Kết cấu “thì đi theo” trong mạch kể tiếng Việt diễn tả hành động đang tiếp diễn mà không cần thêm nhận định về động cơ của Phêrô.
- source_word: μακρόθεν
  choice: từ xa
  rationale: Diễn đạt khoảng cách không gian bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: còn
  rationale: Thể hiện sự chuyển cảnh và tương phản nhẹ giữa việc Ngài bị đưa vào nhà với việc Phêrô theo sau.
theological_decisions:
- issue: Cách mô tả việc Phêrô đi theo Chúa Giê-su trong lúc Ngài bị bắt
  choice: “Phêrô thì đi theo từ xa” chỉ thuật lại hành động và khoảng cách.
  alternative: Có thể thêm sắc thái như “rụt rè” hoặc “lén lút”.
  rationale: Bản Hy Lạp không nói rõ động cơ hay tâm trạng của Phêrô; bản dịch giữ nguyên sức căng của câu chuyện và không thêm lời phán đoán.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Ngài” để tiếp nối nhân vật Chúa Giê-su đã được nêu trong ngữ cảnh, “vị thượng tế” để tránh cách gọi quá cổ, và “Phêrô” làm dạng tên quen thuộc, dễ đọc trong tiếng Việt.
