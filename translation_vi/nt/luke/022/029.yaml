  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: vi
  text: Còn Ta, Ta ban cho anh em một vương quốc[a], như Cha Ta đã ban cho Ta vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta lập giao ước để ban cho anh em một vương quốc, như Cha Ta đã lập giao ước để ban cho Ta vậy.” Động từ Hy Lạp có thể mang nghĩa lập giao ước hoặc định đoạt, trao ban.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀγὼ
  choice: Còn Ta, Ta
  rationale: Dạng rút gọn của καί và ἐγώ vừa nối với lời trước vừa nhấn mạnh chủ thể. “Còn Ta, Ta” diễn đạt tự nhiên sự chuyển ý và nhấn mạnh ấy trong tiếng Việt.
- source_word: διατίθεμαι / διέθετό
  choice: ban cho / đã ban cho
  rationale: Động từ có thể chỉ việc định đoạt, trao ban hoặc lập giao ước. Với “một vương quốc” làm đối tượng, “ban cho” là cách diễn đạt tự nhiên, trang trọng và giữ được sự song song giữa hành động của Đức Chúa Jesus với hành động của Cha.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: Đại từ số nhiều chỉ những người nhận. “Anh em” là lối xưng hô hiện đại, dễ hiểu trong lời Đức Chúa Jesus nói với các môn đồ, không dùng từ cổ “các ngươi”.
- source_word: καθὼς
  choice: như ... vậy
  rationale: Cấu trúc này làm rõ sự tương ứng giữa việc Đức Chúa Jesus ban cho các môn đồ và việc Cha đã ban cho Ngài.
- source_word: ὁ πατήρ μου
  choice: Cha Ta
  rationale: Giữ nguyên mối quan hệ Cha–Con và phù hợp với lối xưng hô trực tiếp trong câu.
- source_word: βασιλείαν
  choice: một vương quốc
  rationale: Danh từ có thể chỉ vương quốc, vương quyền hoặc sự trị vì. Trong ngữ cảnh kế tiếp nói đến bàn tiệc và các ngai, “một vương quốc” giữ được hình ảnh cụ thể và chiều kích quyền cai trị.
theological_decisions:
- issue: Có nên dịch διατίθεμαι bằng ngôn ngữ giao ước rõ ràng hay không
  choice: ban cho
  alternative: lập giao ước để ban cho
  rationale: Động từ có thể mang sắc thái giao ước, nhưng cú pháp với βασιλείαν cũng hỗ trợ nghĩa rộng hơn là định đoạt hoặc trao ban. Bản chính không áp đặt một công thức thần học cụ thể; khả năng hiểu theo nghĩa giao ước được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” thay cho “các ngươi”; giữ cách viết hoa “Ta” và “Cha” trong lời Đức Chúa Jesus. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, đồng thời vẫn duy trì sự song song của hai lần dùng cùng một động từ Hy Lạp.
