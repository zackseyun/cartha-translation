source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: vi
  text: Các thượng tế và các kinh sư đang tìm cách giết Ngài[a], vì họ sợ dân chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ có thể giết Ngài bằng cách nào.”'
    reason: Phản ánh rõ hơn cách diễn đạt τὸ πῶς ἀνέλωσιν αὐτόν (‘làm thế nào/họ có thể giết Ngài bằng cách nào’) mà vẫn không hàm ý một thủ tục xử tử chính thức.
lexical_decisions:
- source_word: ἐζήτουν
  choice: vẫn tìm cách
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn trong quá khứ; “vẫn tìm cách” tự nhiên trong tiếng Việt và giữ được sắc thái kéo dài.
- source_word: ἀρχιερεῖς
  choice: các thầy tế lễ cả
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế tại Giê-ru-sa-lem, tránh gây ấn tượng rằng cùng lúc có nhiều người giữ chức thượng tế duy nhất.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Cách dịch trực tiếp, gọn và quen thuộc cho những chuyên gia sao chép, nghiên cứu và giảng giải Kinh Luật.
- source_word: τὸ πῶς
  choice: cách
  rationale: Cấu trúc Hy Lạp mang nghĩa “làm thế nào/cách nào”; trong câu tiếng Việt, “tìm cách” diễn đạt tự nhiên ý deliberative này.
- source_word: ἀνέλωσιν
  choice: giết
  rationale: Trong ngữ cảnh, động từ chỉ việc loại bỏ bằng cách giết; “giết” rõ ràng, không làm nhẹ ý định thù nghịch và không áp đặt một thủ tục hành quyết chính thức.
- source_word: ἐφοβοῦντο
  choice: họ sợ
  rationale: Diễn tả trạng thái sợ hãi kéo dài; tiếng Việt không bắt buộc đánh dấu thể ở động từ thứ hai vì quan hệ bối cảnh đã rõ.
- source_word: τὸν λαόν
  choice: dân chúng
  rationale: Giữ nghĩa tập thể của λαός và rộng hơn “đám đông”, phù hợp với nỗi lo về phản ứng của quần chúng.
theological_decisions:
- issue: Mức độ mạnh của ἀνέλωσιν đối với ý định của các lãnh đạo
  choice: Dịch là “giết Ngài”, không làm nhẹ sự thù nghịch và không xác định đây là một cuộc hành quyết theo thủ tục pháp lý.
  alternative: “loại trừ Ngài” hoặc “xử tử Ngài”
  rationale: Bản văn nói rõ ý định giết Chúa Giê-xu, nhưng chưa nêu phương thức hay thủ tục; cách dịch này giữ nguyên sức nặng và giới hạn của câu.
- issue: Phạm vi chỉ định của λαός
  choice: Dịch là “dân chúng” theo nghĩa tập thể.
  alternative: “đám đông”
  rationale: “Dân chúng” không thu hẹp đối tượng thành một nhóm đang tụ tập tại chỗ và bảo toàn căng thẳng tường thuật về phản ứng của công chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Vẫn tìm cách” truyền đạt hành động tiếp diễn; “kinh sư” và “thầy tế lễ cả” là thuật ngữ Kinh Thánh quen thuộc. Đại từ “Ngài” giữ sắc thái tôn kính trong tiếng Việt Cơ Đốc phổ thông mà không thêm danh xưng vào bản văn.
