  source_fidelity: 'Bản dịch truyền đạt đúng trình tự chính: Chúa quay lại nhìn Phi-e-rơ, rồi Phi-e-rơ nhớ lời Chúa báo trước việc chối Ngài ba lần trước khi gà gáy trong ngày đó. Tuy nhiên, “nhìn thẳng vào” chọn một sắc thái tăng cường của ἐνέβλεψεν làm nghĩa chính, trong khi đây là sắc thái khả dĩ chứ không bắt buộc; nên để nghĩa cơ bản “nhìn” ở văn bản và giữ sắc thái “nhìn thẳng/chăm chú” trong chú thích.'
