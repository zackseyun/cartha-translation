id: LUK.22.61
reference: Luke 22:61
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: vi
  text: 'Chúa quay lại nhìn Phi-e-rơ[a], và Phi-e-rơ nhớ lại lời Chúa đã nói với ông: “Hôm nay, trước khi gà gáy, con sẽ chối Ta ba lần.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhìn thẳng vào Phi-e-rơ” hoặc “chăm chú nhìn Phi-e-rơ”; động từ Hy Lạp có thể gợi một cái nhìn trực diện hoặc chăm chú.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: quay lại
  rationale: Phân từ bất định của στρέφω diễn tả hành động xảy ra trước cái nhìn; “quay lại” tự nhiên và giữ đúng trình tự.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ tước hiệu κύριος dành cho Chúa Giê-su, phù hợp cách dùng Tân Ước và không làm nhẹ sắc thái thần học.
- source_word: ἐνέβλεψεν τῷ Πέτρῳ
  choice: nhìn thẳng vào Phi-e-rơ
  rationale: ἐμβλέπω có thể chỉ một cái nhìn trực diện, chăm chú. “Nhìn thẳng vào” chuyển tải sắc thái ấy tự nhiên trong tiếng Việt mà không thêm cảm xúc không có trong nguyên văn.
- source_word: ὑπεμνήσθη
  choice: nhớ lại
  rationale: Dạng động từ có thể được hiểu là “được nhắc nhớ”, nhưng trong ngữ cảnh trọng tâm là việc Phi-e-rơ hồi tưởng lời Chúa; “nhớ lại” tự nhiên và không xác định quá mức tác nhân.
- source_word: τοῦ λόγου τοῦ κυρίου
  choice: lời Chúa
  rationale: λόγος ở đây là lời tuyên bố cụ thể Chúa đã nói; “lời Chúa” vừa gọn vừa giữ cấu trúc quen thuộc.
- source_word: ὡς εἶπεν αὐτῷ
  choice: đã nói với ông
  rationale: ὡς giới thiệu nội dung Phi-e-rơ nhớ lại. Tiếng Việt có thể chuyển tự nhiên bằng lời dẫn trực tiếp, không cần dịch máy móc thành “thế nào”.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: trước khi gà gáy
  rationale: πρίν với động từ nguyên mẫu diễn tả thời điểm trước một sự kiện. Danh từ ἀλέκτωρ không có mạo từ; tiếng Việt tự nhiên dùng “gà gáy” mà không buộc phải thêm “một con” hay “con”.
- source_word: σήμερον
  choice: hôm nay
  rationale: Chuyển tải trực tiếp tính cận kề của lời báo trước.
- source_word: ἀπαρνήσῃ με
  choice: con sẽ chối Ta
  rationale: ἀπαρνέομαι trong trình thuật thương khó mang nghĩa phủ nhận hoặc chối bỏ mối liên hệ với Chúa Giê-su. “Chối” là cách diễn đạt chính xác, quen thuộc; “Ta” và “con” thể hiện lời Chúa nói trực tiếp với môn đồ trong văn phong trang trọng.
- source_word: τρίς
  choice: ba lần
  rationale: Cách nói hiện đại, rõ ràng và chính xác.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ Chúa Giê-su
  choice: Chúa
  alternative: Thầy
  rationale: “Chúa” giữ được tước hiệu và sức nặng Cơ Đốc học của κύριος; “Thầy” sẽ thu hẹp nghĩa sang quan hệ thầy-trò.
- issue: Đại từ trong lời Chúa Giê-su nói với Phi-e-rơ
  choice: con … Ta
  alternative: ngươi … ta; anh … tôi
  rationale: “Con … Ta” rõ quan hệ giữa Chúa và môn đồ, trang trọng mà vẫn dễ hiểu trong tiếng Việt hiện đại. Đây là lựa chọn văn phong, không nhằm xác quyết thêm một giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được chia nhịp để làm nổi bật cái nhìn của Chúa và sự nhớ lại của Phi-e-rơ. Dùng “Phi-e-rơ” theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; giữ dấu câu và lời dẫn trực tiếp tự nhiên.
