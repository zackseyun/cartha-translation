  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: vi
  text: 'Ngài nói: “Lạy Cha, nếu Cha muốn, xin cất chén này khỏi con.[a] Tuy vậy, xin đừng để ý con được thực hiện, nhưng để ý Cha được thực hiện.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chén” là hình ảnh Kinh Thánh chỉ phần được dành cho một người, thường đặc biệt nói đến đau khổ hoặc sự phán xét.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “Tuy vậy, không phải điều con muốn, nhưng điều Cha muốn được thực hiện.”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: Ngài nói
  rationale: Phân từ hiện tại dẫn vào nội dung lời cầu nguyện. Tiếng Việt tự nhiên dùng một mệnh đề hữu hạn, vẫn giữ sự nối tiếp với văn cảnh.
- source_word: Πάτερ
  choice: Lạy Cha
  rationale: Dạng hô cách trực tiếp với Đức Chúa Trời; “Lạy” diễn đạt lời thưa trang trọng và tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰ βούλει
  choice: nếu Cha muốn
  rationale: Diễn đạt điều kiện liên quan đến ý muốn hay sự sẵn lòng của Cha, không biến câu này thành lời khẳng định hoặc lời nghi vấn.
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: xin cất ... khỏi con
  rationale: Động từ mệnh lệnh cùng cụm giới từ mang nghĩa đưa vật ấy ra khỏi người nói. “Xin cất ... khỏi con” vừa tự nhiên trong lời cầu nguyện vừa giữ được lực cầu xin.
- source_word: τοῦτο τὸ ποτήριον
  choice: chén này
  rationale: Giữ nguyên hình ảnh “chén” thay vì giải nghĩa ngay thành đau khổ hay sự phán xét, nhằm bảo toàn chiều sâu liên văn bản.
- source_word: πλὴν
  choice: Dù vậy
  rationale: Đánh dấu sự chuyển ý nhượng bộ mạnh từ lời cầu xin sang sự thuận phục.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν γινέσθω
  choice: xin đừng theo ý con, mà theo ý Cha
  rationale: Cách nói tự nhiên trong tiếng Việt diễn đạt mệnh lệnh ngôi thứ ba γινέσθω và giữ nguyên sự đối lập giữa ý của Con với ý của Cha.
theological_decisions:
- issue: Mối quan hệ giữa ý muốn của Chúa Giê-su và ý muốn của Cha
  choice: 'Giữ sự đối lập trực tiếp: “đừng theo ý con, mà theo ý Cha.”'
  alternative: “không phải điều con muốn, nhưng điều Cha muốn được thực hiện”
  rationale: Nguyên văn phân biệt hai ý muốn đồng thời trình bày sự thuận phục của Chúa Giê-su; bản dịch không làm mờ sự phân biệt ấy cũng không thêm lời giải thích giáo lý về bản tính của Ngài.
- issue: Ý nghĩa ẩn dụ của “chén”
  choice: Giữ “chén” trong chính văn và giải thích bằng chú thích.
  alternative: “nỗi đau khổ này” hoặc “thử thách này”
  rationale: Giải nghĩa trực tiếp trong chính văn sẽ thu hẹp hình ảnh Kinh Thánh vốn có thể gợi đến phần được định, đặc biệt là đau khổ hoặc sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” trong lời Chúa Giê-su thưa với Cha thể hiện quan hệ Cha–Con tự nhiên trong tiếng Việt; không viết hoa đại từ để tránh áp đặt quy ước hệ phái. Dùng “Dù vậy” thay cho lối cổ “dầu vậy”.
