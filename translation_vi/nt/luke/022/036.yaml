revisions:
- from: Nhưng bây giờ, ai có túi tiền thì hãy mang theo, túi hành trang[a] cũng vậy; còn ai không có thì hãy bán áo choàng của mình mà mua một thanh gươm[b].
  to: Nhưng bây giờ, ai có túi tiền thì hãy mang theo; cũng hãy mang theo túi hành trang[a]. Còn ai không có thì hãy bán áo choàng của mình mà mua một thanh gươm[b].
  rationale: Chỉnh nhẹ cấu trúc câu để phản ánh rõ phép song hành của ὁμοίως καὶ πήραν và để tiếng Việt tự nhiên hơn. Không bổ sung tân ngữ cho “ai không có”, nhờ đó giữ nguyên tính tỉnh lược của bản văn. Chỉnh chú thích từ vựng về μάχαιρα cho chính xác hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của nguyên văn: tương phản “Nhưng bây giờ,”, túi tiền (βαλλάντιον), túi đi đường (πήρα), việc bán áo choàng/áo ngoài (ἱμάτιον), và mệnh lệnh mua μάχαιρα. Cụm “ai không có” giữ được tân ngữ bị tỉnh lược trong tiếng Hy Lạp, không áp đặt cách giải thích.'
  naturalness: Cụm “ai có túi tiền thì hãy mang theo, túi hành trang cũng vậy” hơi gãy và có thể khiến “túi hành trang cũng vậy” bị hiểu như một cụm danh từ rời. Lặp lại động từ mệnh lệnh trong vế song song giúp tiếng Việt hiện đại tự nhiên và rõ hơn mà không thêm nghĩa.
  terminology: “Túi tiền,” “túi hành trang,” “áo choàng,” và “thanh gươm” phù hợp văn phong hiện đại, trang trọng vừa phải. Chú thích về μάχαιρα nên gọi đây là “vũ khí có lưỡi” thay vì “lưỡi vũ khí”, vì từ Hy Lạp chỉ vật/loại vũ khí chứ không chỉ riêng bộ phận lưỡi.
  issues:
  - severity: low
    issue: Cấu trúc song song sau “hãy mang theo” chưa tự nhiên.
    rationale: Nguyên văn đặt mệnh lệnh “hãy lấy/mang” cho túi tiền rồi dùng “tương tự cũng [hãy lấy/mang]” cho túi đi đường. Tiếng Việt cần lặp “hãy mang theo” để vế thứ hai rõ và trôi chảy.
  - severity: low
    issue: Diễn đạt chú thích b “một loại lưỡi vũ khí” không chính xác về mặt từ vựng.
    rationale: μάχαιρα có thể chỉ dao găm hoặc gươm ngắn, tức một vũ khí có lưỡi tương đối ngắn; không phải bản thân “lưỡi” của vũ khí.
