  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: vi
  text: Nhưng bây giờ, ai có túi tiền thì hãy mang theo; cũng hãy mang theo túi hành trang[a]. Còn ai không có thì hãy bán áo choàng của mình mà mua một thanh gươm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp πήρα cũng có thể dịch là “túi đi đường” hoặc “bao hành lý”.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp μάχαιρα có thể chỉ một loại vũ khí có lưỡi tương đối ngắn, như dao găm hoặc gươm ngắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Nhưng bây giờ
  rationale: Giữ rõ sự tương phản mạnh với lời chỉ dẫn trước đó, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ὁ ἔχων
  choice: ai có
  rationale: Diễn đạt phân từ có mạo từ theo nghĩa khái quát, không thêm giới tính và phù hợp lối nói tự nhiên của tiếng Việt.
- source_word: βαλλάντιον
  choice: túi tiền
  rationale: Chỉ vật dùng để đựng và mang tiền; cách dịch này rõ nghĩa hơn các từ có thể gợi đến một loại túi hiện đại khác.
- source_word: ἀράτω
  choice: hãy mang theo
  rationale: Trong ngữ cảnh chuẩn bị lên đường, động từ mang nghĩa đem hoặc mang vật ấy theo; cách dịch này rõ hơn nghĩa đơn thuần là nhấc lên.
- source_word: ὁμοίως καὶ πήραν
  choice: túi hành trang cũng vậy
  rationale: πήρα là túi của người đi đường; “túi hành trang” truyền đạt chức năng ấy, còn “cũng vậy” giữ ý tương ứng của ὁμοίως.
- source_word: ὁ μὴ ἔχων
  choice: còn ai không có
  rationale: Giữ cấu trúc tỉnh lược của nguyên văn, trong đó đối tượng của “không có” không được nói ra; ngữ cảnh kế tiếp hướng người đọc đến thanh gươm mà không buộc bản dịch phải bổ sung.
- source_word: πωλησάτω τὸ ἱμάτιον αὐτοῦ
  choice: hãy bán áo choàng của mình
  rationale: ἱμάτιον thường chỉ áo ngoài hoặc áo choàng, một vật dụng cá nhân đáng kể; “của mình” diễn đạt đại từ sở hữu tự nhiên.
- source_word: ἀγορασάτω μάχαιραν
  choice: mua một thanh gươm
  rationale: Giữ nguyên mệnh lệnh trực tiếp và danh từ chỉ vũ khí trong tiếng Hy Lạp, không làm nhẹ thành ý nghĩa bóng hay khái quát hóa thành “vũ khí”.
theological_decisions:
- issue: Có nên làm nhẹ hoặc nhấn mạnh tính trực tiếp của mệnh lệnh mua gươm hay không
  choice: Dịch trực tiếp là “mua một thanh gươm”
  alternative: Diễn giải là “mua một vũ khí” hoặc “hãy chuẩn bị tinh thần đối diện nguy hiểm”
  rationale: Nguyên văn dùng μάχαιρα và thể mệnh lệnh trực tiếp. Bản dịch giữ nguyên sức căng của lời nói, không quyết định thay người đọc rằng câu này phải được hiểu hoàn toàn theo nghĩa đen, nghĩa bóng, hay như một lập trường giáo lý về bạo lực.
- issue: Đối tượng bị lược sau ὁ μὴ ἔχων
  choice: 'Giữ tỉnh lược: “ai không có”'
  alternative: Bổ sung rõ “ai không có gươm”
  rationale: Tiếng Hy Lạp không nêu tân ngữ tại đây. Dù “gươm” là điều được ngữ cảnh kế tiếp gợi ra mạnh nhất, giữ tỉnh lược tránh biến điều hàm ý thành điều được nói minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hãy” để thể hiện mệnh lệnh; giữ cấu trúc song song của câu và không thêm cách giải thích mang tính hệ phái.
