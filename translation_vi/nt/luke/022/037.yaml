id: LUK.22.37
reference: Luke 22:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: vi
  text: 'Vì tôi nói với anh em rằng điều đã được chép này phải được ứng nghiệm nơi tôi: “Người đã bị kể vào hàng những kẻ vô luật pháp.”[a] Thật vậy, điều liên quan đến tôi đang đi đến chỗ hoàn tất.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch theo lối quen thuộc hơn: “Người đã bị kể vào hàng những kẻ phạm pháp” (Ê-sai 53:12).'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đang đi đến hồi kết” hoặc “được hoàn tất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với anh em
  rationale: Giữ liên từ giải thích γάρ là “vì” và dịch λέγω...ὑμῖν tự nhiên, trang trọng; “anh em” phù hợp với lời Đức Giê-su nói với các môn đồ.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: điều đã chép này
  rationale: Giữ đại từ chỉ định cùng phân từ hoàn thành bị động, không thêm danh từ “Kinh Thánh” vốn không hiện diện trực tiếp trong câu Hy Lạp.
- source_word: δεῖ τελεσθῆναι
  choice: phải được ứng nghiệm
  rationale: “Phải” diễn đạt sức nặng của δεῖ; trong ngữ cảnh một lời đã chép được thực hiện nơi Đức Giê-su, “được ứng nghiệm” chuyển tải τελεσθῆναι tự nhiên và chính xác.
- source_word: ἐν ἐμοί
  choice: nơi tôi
  rationale: “Nơi tôi” giữ sắc thái của ἐν và cho phép hiểu lời chép được ứng nghiệm trong chính con người và hoàn cảnh của Đức Giê-su mà không diễn giải quá mức.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: Người đã bị kể vào hàng những kẻ không tuân luật pháp
  rationale: “Bị kể vào hàng” diễn đạt ἐλογίσθη...μετά một cách tự nhiên; “những kẻ không tuân luật pháp” giữ ý cơ bản của ἀνόμων và tránh đồng nhất quá hẹp với một loại vi phạm cụ thể. Không cần ép dịch Καί mở đầu lời trích là “Và” trong tiếng Việt.
- source_word: τὸ περὶ ἐμοῦ
  choice: điều liên quan đến tôi
  rationale: Cách nói tự nhiên, sát với cụm danh từ có mạo từ, không thu hẹp đối tượng quy chiếu.
- source_word: τέλος ἔχει
  choice: đang đi đến chỗ hoàn tất
  rationale: Giữ được sự căng nghĩa giữa “đi đến tận cùng” và “được hoàn tất/ứng nghiệm”; thể tiến triển phù hợp với bối cảnh cuộc thương khó đang tới gần mà không khẳng định việc ấy đã hoàn tất rồi.
theological_decisions:
- issue: Cách dịch lời trích Ê-sai 53:12
  choice: Người đã bị kể vào hàng những kẻ không tuân luật pháp
  alternative: Người đã bị kể vào hàng những kẻ phạm pháp
  rationale: Bản chính ưu tiên nghĩa trực tiếp của ἀνόμων, còn cách dịch ngắn gọn và quen thuộc hơn được giữ trong chú thích để bảo tồn âm vang truyền thống mà không để truyền thống lấn át bản Hy Lạp.
- issue: Nghĩa của τέλος ἔχει
  choice: đang đi đến chỗ hoàn tất
  alternative: đang đi đến hồi kết; được hoàn tất
  rationale: Cụm từ có thể gợi cả sự kết thúc lẫn sự hoàn thành/ứng nghiệm. Bản dịch chính cố ý giữ hai sắc thái này thay vì giải quyết căng nghĩa theo một hướng thần học duy nhất.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi/anh em” theo ngữ cảnh lời Đức Giê-su nói với các môn đồ; tránh từ Hán-Việt quá cổ, đồng thời giữ nhịp văn nghiêm trang của lời trích Kinh Thánh.
