translation:
  language: vi
  text: Và sau khi đi ra ngoài, ông khóc cay đắng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát cấu trúc Hy Lạp hơn: “Và đi ra ngoài, ông khóc cay đắng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối tiếp mạch kể chuyện; “Rồi” tự nhiên trong tiếng Việt và chỉ diễn tiến của câu chuyện mà không nhấn mạnh quá mức quan hệ thời gian.
- source_word: ἐξελθὼν
  choice: ông đi ra
  rationale: Phân từ bất định quá khứ của ἐξέρχομαι diễn tả hành động xảy ra trước động từ chính. Cấu trúc tiếng Việt “đi ra… và…” truyền đạt trình tự ấy một cách tự nhiên.
- source_word: ἔξω
  choice: ngoài
  rationale: Trạng từ này bổ sung hướng hoặc vị trí của việc đi ra; “ra ngoài” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: ἔκλαυσεν
  choice: khóc lóc
  rationale: κλαίω chỉ hành động khóc; “khóc lóc” phù hợp với sắc thái đau buồn mạnh trong ngữ cảnh và vẫn là cách nói thông dụng.
- source_word: πικρῶς
  choice: cay đắng
  rationale: Giữ hình ảnh trực tiếp của trạng từ Hy Lạp, diễn tả cách ông khóc với nỗi đau sâu sắc, đồng thời không giải thích cụ thể nguyên nhân hay trạng thái thần học của sự đau buồn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” dựa vào nhân vật Phê-rơ trong ngữ cảnh gần; bản Hy Lạp chỉ hàm ý chủ thể qua hình thái động từ. Cụm “cay đắng” giữ sức nặng của πικρῶς thay vì diễn giải thành một cảm xúc cụ thể như hối hận hay tuyệt vọng.
