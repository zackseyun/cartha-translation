  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: vi
  text: 'Khi đến nơi ấy, Ngài nói với họ: “Hãy cầu nguyện để anh em không bước vào cám dỗ[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thử thách” hoặc “thử luyện”. Từ Hy Lạp này có thể chỉ sự cám dỗ về mặt đạo đức hoặc, theo nghĩa rộng hơn, một hoàn cảnh chịu thử thách.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: Khi đến nơi ấy
  rationale: Cụm phân từ chỉ việc đến địa điểm đã được nhắc đến trong ngữ cảnh. Cách dịch này tự nhiên trong tiếng Việt và thể hiện hành động xảy ra trước động từ chính.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài nói với họ
  rationale: Diễn đạt trực tiếp động từ λέγω mà không thêm sắc thái mệnh lệnh vào chính động từ dẫn lời.
- source_word: Προσεύχεσθε
  choice: Hãy cầu nguyện
  rationale: Thể mệnh lệnh hiện tại kêu gọi việc cầu nguyện; tiếng Việt không cần thêm từ chỉ sự tiếp diễn trong câu chính.
- source_word: μὴ εἰσελθεῖν
  choice: để anh em không rơi vào
  rationale: Cấu trúc này nêu nội dung hoặc mục đích của lời cầu nguyện. “Rơi vào” là cách nói tự nhiên trong tiếng Việt với “cám dỗ”, tuy ít sát hình ảnh “đi vào” hơn nhưng tránh lối diễn đạt gượng gạo.
- source_word: πειρασμόν
  choice: cám dỗ
  rationale: Trong bối cảnh các môn đồ sắp đối diện nguy cơ thất bại thuộc linh, “cám dỗ” là nghĩa phù hợp nhất; các nghĩa rộng hơn được giữ lại trong chú thích.
theological_decisions:
- issue: Ý nghĩa của πειρασμός trong lời cảnh báo của Chúa Giê-su
  choice: cám dỗ
  alternative: thử thách; thử luyện
  rationale: Ngữ cảnh trực tiếp nhấn mạnh nguy cơ các môn đồ thất bại về mặt thuộc linh, nhưng từ Hy Lạp cũng có thể chỉ một hoàn cảnh thử thách rộng hơn. Chú thích bảo tồn độ mở này thay vì thu hẹp hoàn toàn ý nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng làm đại từ tôn kính chỉ Chúa Giê-su; “anh em” diễn đạt số nhiều của đối tượng được nói với. Dấu chú thích được đặt ngay sau “cám dỗ”, là từ mà chú thích giải nghĩa.
