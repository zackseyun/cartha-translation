reference: Luke 22:66
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: vi
  text: Khi trời sáng[a], hội đồng các trưởng lão của dân, gồm các thượng tế và các kinh sư, nhóm họp; họ dẫn Đức Giê-su đến hội đồng của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi ngày đến” hoặc “Lúc rạng đông.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vào nơi hội đồng của họ họp” hoặc “đến trước hội đồng của họ.” Từ Hy Lạp συνέδριον có thể chỉ chính hội đồng, phiên họp chính thức hoặc nơi hội đồng nhóm họp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: Khi trời vừa sáng
  rationale: Diễn đạt tự nhiên thành ngữ chỉ lúc ban ngày bắt đầu, đồng thời giữ sắc thái thời điểm của mệnh đề Hy Lạp.
- source_word: συνήχθη
  choice: họp lại
  rationale: Thể hiện việc tập thể quy tụ; tiếng Việt tự nhiên không cần tái hiện máy móc thể bị động.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: hội đồng trưởng lão của dân chúng
  rationale: πρεσβυτέριον chỉ tập thể các trưởng lão; “hội đồng trưởng lão” vừa rõ nghĩa thể chế vừa dễ hiểu.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: gồm cả các trưởng tế và các kinh luật gia
  rationale: τε καί liên kết hai nhóm cùng thuộc hội đồng. “Trưởng tế” là cách gọi gọn, quen thuộc; “kinh luật gia” truyền đạt vai trò chuyên gia Kinh Thánh và Luật pháp rõ hơn từ Hán-Việt “văn sĩ”.
- source_word: ἀπήγαγον
  choice: họ dẫn Đức Giê-su đến
  rationale: ἀπάγω mang nghĩa dẫn hoặc đưa đi. Trong tiếng Việt, “dẫn ... đến” diễn đạt tự nhiên hướng về nơi hay phiên họp được nêu sau đó.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: đến trước hội đồng của họ
  rationale: συνέδριον có thể chỉ chính hội đồng, phiên họp hoặc nơi họp. “Đến trước hội đồng” phù hợp bối cảnh xét hỏi mà không biến từ này thành một căn phòng cụ thể.
theological_decisions:
- issue: Cách gọi cơ quan lãnh đạo Do Thái
  choice: Dịch πρεσβυτέριον là “hội đồng trưởng lão” và συνέδριον là “hội đồng”, đồng thời dùng “đến trước” để thể hiện việc Đức Giê-su bị đưa ra trước phiên hội.
  alternative: Phiên âm συνέδριον là “Tòa Công Luận” hoặc hiểu là “phòng hội đồng”.
  rationale: Bản Hy Lạp dùng hai từ có phạm vi nghĩa liên hệ nhưng không đồng nhất hoàn toàn. Cách dịch này giữ sự khác biệt trong cấu trúc câu, không áp đặt rằng συνέδριον nhất thiết là căn phòng, cũng không đưa vào một nhãn thể chế phiên âm vốn khó hiểu với độc giả phổ thông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; dấu chấm phẩy làm rõ hai hành động liên tiếp. Tránh “Tòa Công Luận/Sanhedrin” vì đó là thuật ngữ chuyên biệt ít minh bạch đối với độc giả phổ thông.
