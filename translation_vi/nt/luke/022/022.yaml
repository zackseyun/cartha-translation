review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng sự đối lập giữa điều đã được định trước và lời khốn cho tác nhân. Tuy nhiên, câu hiện tại lược mất sắc thái chỉ định của τῷ ἀνθρώπῳ ἐκείνῳ (“người ấy/người kia”), và cách diễn đạt “kẻ nộp Ngài” không phản ánh rõ cấu trúc nguyên ngữ: Con Người là Đấng “bị nộp” qua tác nhân đó. Bổ sung “người ấy” và một cụm đồng vị sẽ giữ ý nguyên ngữ rõ hơn mà vẫn tự nhiên.'
  naturalness: “Vì Con Người ra đi theo điều đã được định trước” và “khốn thay” đều trang trọng, tự nhiên trong tiếng Việt hiện đại. “Nhưng khốn thay cho người ấy, kẻ nộp Ngài!” rõ ràng hơn “cho kẻ nộp Ngài”, đồng thời tránh cấu trúc bị động quá nặng như “qua người ấy Ngài bị nộp”.
  terminology: “Con Người,” “đã được định trước,” “khốn thay,” và “nộp” phù hợp với thuật ngữ Kinh Thánh Việt ngữ và không áp đặt cách giải quyết thần học. Chú thích nên nêu lựa chọn “bị phản bội” như một khả năng của παραδίδωμι trong ngữ cảnh, nhưng cần gắn với toàn mệnh đề để minh bạch rằng đây là cách diễn đạt thay thế cho quan hệ tác nhân.
  issues:
  - severity: medium
    issue: Thiếu yếu tố chỉ định “người ấy”
    rationale: τῷ ἀνθρώπῳ ἐκείνῳ có nghĩa là “người ấy/người kia.” “Kẻ” đơn thuần vẫn chỉ tác nhân nhưng làm giảm nét chỉ định và liên hệ với người được nhắc tới trong ngữ cảnh.
  - severity: low
    issue: Cấu trúc ‘Con Người bị nộp qua người ấy’ chưa được thể hiện rõ
    rationale: Nguyên ngữ dùng bị động παραδίδοται với cụm tác nhân δι’ οὗ. “Kẻ nộp Ngài” là cách chuyển chủ động có thể chấp nhận, nhưng thêm cụm đồng vị sau “người ấy” giúp bảo toàn quan hệ này rõ hơn.
  revised_text: Vì Con Người ra đi theo điều đã được định trước, nhưng khốn thay cho người ấy, kẻ nộp Ngài![a]
  revised_footnotes:
