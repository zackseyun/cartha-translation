    text: 'Cũng có thể dịch: “nhưng khốn thay cho người ấy, kẻ phản bội Ngài!” Động từ Hy Lạp có thể mang nghĩa “nộp, giao nộp” hoặc “phản bội,” tùy ngữ cảnh.'
    reason: lexical_alternative
