id: LUK.22.22
reference: Luke 22:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: vi
  text: Vì Con Người ra đi theo điều đã được định trước, nhưng khốn thay cho người ấy, kẻ nộp Ngài![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng khốn thay cho người ấy, kẻ phản bội Ngài!” Động từ Hy Lạp có thể mang nghĩa “nộp, giao nộp” hoặc “phản bội,” tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Trong mạch văn, từ này nêu lý do cho lời ngay trước đó; “Vì” tự nhiên và giữ quan hệ lập luận.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch quen thuộc cho danh xưng Chúa Giê-su dùng về chính mình, đồng thời giữ âm hưởng liên văn bản.
- source_word: μέν ... πλὴν
  choice: '... nhưng ...'
  rationale: Tiếng Việt không cần dịch μέν riêng; cặp tương phản được truyền đạt tự nhiên bằng “nhưng”, vẫn làm nổi bật sự đối chiếu.
- source_word: κατὰ τὸ ὡρισμένον
  choice: theo điều đã được định trước
  rationale: Giữ ý phù hợp với một sự định đoạt có trước và giữ thể bị động, không thêm rõ chủ thể định đoạt mà bản Hy Lạp không nêu.
- source_word: πορεύεται
  choice: ra đi
  rationale: Trong ngữ cảnh này, động từ chỉ hành trình của Chúa Giê-su tiến đến cái chết; “ra đi” vừa tự nhiên vừa giữ sắc thái trang trọng, không giải thích quá mức.
- source_word: οὐαὶ
  choice: khốn thay
  rationale: Giữ sức nặng của lời than và lời tuyên cáo tai họa theo phong cách ngôn sứ.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: cho kẻ
  rationale: “Kẻ” chỉ đúng cá nhân chịu trách nhiệm và phù hợp với sắc thái phán xét của “khốn thay”, không cần lặp đại từ chỉ định một cách gượng ép.
- source_word: δι’ οὗ
  choice: qua tay
  rationale: Diễn đạt tự nhiên ý tác nhân trung gian của διά với sở hữu cách trong tiếng Việt.
- source_word: παραδίδοται
  choice: nộp
  rationale: “Nộp” giữ nghĩa căn bản là giao vào tay người khác và phù hợp với hành động của Giu-đa; nghĩa phản bội trong ngữ cảnh được ghi ở chú thích để bảo toàn độ rộng từ vựng.
theological_decisions:
- issue: Quan hệ giữa sự định trước của Đức Chúa Trời và trách nhiệm của con người
  choice: 'Giữ cả hai vế đối lập: Con Người ra đi theo điều đã được định trước, nhưng tác nhân nộp Ngài vẫn bị tuyên bố là khốn thay.'
  alternative: Làm nhẹ ý định trước, hoặc làm nhẹ trách nhiệm của kẻ nộp Ngài.
  rationale: Bản Hy Lạp đặt sự định trước và trách nhiệm của con người cạnh nhau mà không giải thích cách dung hòa; bản dịch không nên giải quyết sự căng thẳng này theo một hệ thống thần học riêng.
- issue: Chủ thể của sự định trước
  choice: Dùng thể bị động “đã được định trước” mà không nêu đích danh tác nhân.
  alternative: Dịch rõ là “Đức Chúa Trời đã định”.
  rationale: Ngữ cảnh có thể hàm ý sự định liệu của Đức Chúa Trời, nhưng câu Hy Lạp không nêu chủ thể; giữ thể bị động tránh bổ sung điều không được phát biểu trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Con Người” giữ danh xưng truyền thống; “khốn thay” bảo toàn sắc thái ngôn sứ. Cấu trúc câu gọn, đồng thời duy trì sự đối lập giữa điều đã được định trước và trách nhiệm của kẻ nộp Chúa Giê-su.
