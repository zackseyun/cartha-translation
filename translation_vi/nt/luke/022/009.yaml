  text: 'Họ thưa Ngài: “Ngài muốn chúng con chuẩn bị ở đâu?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài muốn chúng con lo việc chuẩn bị ở đâu?” Điều cần chuẩn bị được ngầm hiểu là bữa ăn Lễ Vượt Qua đã nói ở câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ
  rationale: Mạo từ được dùng như danh từ, chỉ các môn đồ trong ngữ cảnh. δέ chỉ có tác dụng nối nhẹ nên không cần dịch riêng trong tiếng Việt tự nhiên.
- source_word: εἶπαν αὐτῷ
  choice: thưa với Ngài
  rationale: Động từ có nghĩa cơ bản là “nói”, nhưng “thưa” diễn đạt tự nhiên lời các môn đồ nói trực tiếp với Chúa Giê-xu; “với Ngài” thể hiện đại từ ở cách dữ liệu mà không biến động từ thành “hỏi”.
- source_word: Ποῦ
  choice: ở đâu
  rationale: Trạng từ nghi vấn hỏi về địa điểm; “ở đâu” là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt.
- source_word: θέλεις
  choice: Ngài muốn
  rationale: θέλω diễn tả ý muốn hoặc ý định; “muốn” là tương đương hiện đại, trực tiếp.
- source_word: ἑτοιμάσωμεν
  choice: chúng con chuẩn bị
  rationale: Thể giả định ngôi thứ nhất số nhiều sau θέλεις được diễn đạt tự nhiên bằng kết cấu “muốn chúng con chuẩn bị”. Tiếng Việt không bắt buộc thêm một tân ngữ; bữa ăn Lễ Vượt Qua được hiểu từ câu trước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” cùng cặp xưng hô “Ngài—chúng con” phù hợp với quan hệ giữa các môn đồ và Chúa Giê-xu trong lời thoại. Dấu chú thích [a] đặt ngay sau câu hỏi và giải thích cả phương án dịch lẫn tân ngữ được ngầm hiểu.
