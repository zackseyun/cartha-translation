  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu: chủ ngữ số nhiều chỉ các môn đồ trong ngữ cảnh, lời nói hướng đến Chúa Giê-xu, câu hỏi về địa điểm, ý muốn của Ngài, và hành động chuẩn bị ở ngôi thứ nhất số nhiều. Tân ngữ của “chuẩn bị” được để ngầm hiểu, phù hợp với tiếng Hy Lạp và ngữ cảnh bữa Vượt Qua ở câu trước.'
