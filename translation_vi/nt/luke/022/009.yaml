  - severity: low
    issue: Chú thích mô tả “lo việc chuẩn bị” là “dịch sát hơn”.
    rationale: “Lo việc chuẩn bị” là một cách diễn đạt rộng và mang tính giải thích; nên dùng nhãn trung tính “Cũng có thể dịch” để không đánh giá sai mức độ sát nghĩa.
