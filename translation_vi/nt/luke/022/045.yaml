source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: vi
  text: Rồi Ngài đứng dậy sau khi cầu nguyện, đến với các môn đồ và thấy họ đang ngủ vì buồn rầu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: đứng dậy sau khi cầu nguyện
  rationale: Phân từ bất định ἀναστὰς diễn tả hành động xảy ra trước động từ chính; cụm ἀπὸ τῆς προσευχῆς chỉ việc Ngài rời khỏi lúc cầu nguyện. Cách dịch này tự nhiên trong tiếng Việt và giữ rõ trình tự hành động.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: đến với các môn đồ
  rationale: ἐλθὼν cùng πρός diễn tả sự di chuyển về phía các môn đồ; chuyển phân từ thành động từ nối tiếp giúp câu tiếng Việt sáng rõ.
- source_word: μαθητὰς
  choice: các môn đồ
  rationale: “Môn đồ” là cách gọi trang trọng, quen thuộc và chính xác theo ngữ cảnh sách Tin Mừng dành cho μαθητής.
- source_word: εὗρεν
  choice: thấy
  rationale: Trong cấu trúc εὗρεν + bổ ngữ chỉ trạng thái, tiếng Việt tự nhiên dùng “thấy” để diễn tả việc bắt gặp họ trong tình trạng đang ngủ.
- source_word: κοιμωμένους αὐτούς
  choice: họ đang ngủ
  rationale: Phân từ hiện tại κοιμωμένους trình bày hành động hoặc trạng thái của họ vào lúc Ngài đến; “đang ngủ” giữ được sắc thái tiếp diễn.
- source_word: ἀπὸ τῆς λύπης
  choice: vì buồn rầu
  rationale: ἀπό với λύπη ở đây tự nhiên biểu thị nguyên nhân. “Vì buồn rầu” diễn đạt rõ quan hệ nhân quả mà không thêm lời giải thích tâm lý ngoài văn bản.
theological_decisions:
- issue: Nguyên nhân các môn đồ ngủ
  choice: Trình bày việc họ ngủ là do buồn rầu.
  alternative: Họ ngủ trong lúc buồn rầu, không nhấn mạnh mạnh quan hệ nhân quả.
  rationale: Cụm ἀπὸ τῆς λύπης tự nhiên nhất mang nghĩa nguyên nhân, “vì/do buồn rầu”; bản dịch không suy diễn thêm về trạng thái tâm lý của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su theo mạch văn, và “các môn đồ” theo thuật ngữ Tin Mừng quen thuộc. Không cần chú thích vì câu dịch trực tiếp thể hiện nghĩa nhân quả tự nhiên của ἀπὸ τῆς λύπης.
