  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: vi
  text: Giu-đa đi khỏi đó, rồi bàn bạc với các thượng tế và các viên chỉ huy về cách nộp Đức Giê-su cho họ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “phản bội Đức Giê-su.” Động từ Hy Lạp có thể mang nghĩa “giao,” “nộp,” hoặc, trong ngữ cảnh này, “phản bội.”'
    reason: lexical_alternative
  - marker: b
    text: “Các viên chỉ huy” nhiều khả năng là những người có thẩm quyền trong lực lượng bảo vệ Đền Thờ, không phải binh lính La Mã.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: đi gặp
  rationale: Phân từ bất định diễn tả hành động đi khỏi nơi trước đó để đến gặp các nhà chức trách; tiếng Việt tự nhiên có thể gộp hướng đi với cuộc gặp mà vẫn giữ trình tự.
- source_word: συνελάλησεν
  choice: bàn với
  rationale: Diễn tả việc cùng trao đổi, bàn bạc, không chỉ đơn thuần nói chuyện.
- source_word: ἀρχιερεῦσιν
  choice: các thượng tế
  rationale: Cách gọi quen thuộc dành cho giới lãnh đạo tư tế, không hàm ý cùng lúc có nhiều người giữ chức thượng tế tối cao.
- source_word: στρατηγοῖς
  choice: các viên chỉ huy
  rationale: Giữ nghĩa chức vụ chỉ huy của từ Hy Lạp; chú thích xác định đây nhiều khả năng là những người thuộc lực lượng bảo vệ Đền Thờ, không phải quân đội La Mã.
- source_word: τὸ πῶς
  choice: cách
  rationale: 'Diễn đạt tự nhiên cấu trúc Hy Lạp giới thiệu nội dung họ bàn bạc: bằng cách nào hoặc theo phương thức nào.'
- source_word: παραδῷ
  choice: nộp ... cho
  rationale: Giữ nghĩa cơ bản là giao hoặc nộp một người vào tay người khác, đồng thời để ngữ cảnh biểu lộ tính phản bội; nghĩa trực tiếp hơn được nêu trong chú thích.
- source_word: αὐτοῖς ... αὐτόν
  choice: Đức Giê-su ... cho họ
  rationale: Dùng danh xưng rõ nghĩa thay cho đại từ “Ngài” vì câu đứng riêng cần xác định đối tượng; “họ” quy chiếu về các thượng tế và các viên chỉ huy.
theological_decisions:
- issue: Cách dịch παραδῷ trong hành động của Giu-đa
  choice: nộp Đức Giê-su cho họ
  alternative: phản bội Đức Giê-su
  rationale: 'Ngữ cảnh rõ ràng là sự phản bội, nhưng động từ Hy Lạp có phạm vi nghĩa rộng hơn: giao, trao hoặc nộp. Bản văn chính giữ hành động cụ thể, còn chú thích bảo tồn cách hiểu theo ngữ cảnh.'
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Giu-đa” và “Đức Giê-su” để câu độc lập rõ chủ thể và đối tượng; “bàn với” thể hiện sắc thái cùng nhau mưu tính mà không cường điệu quá động từ nguồn.
