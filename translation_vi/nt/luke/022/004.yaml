review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành phần chính: Giu-đa, các thượng tế, các viên chỉ huy, việc bàn bạc về cách nộp Đức Giê-su cho họ. Tuy nhiên, “đi gặp” gộp và làm mạnh thêm ý hướng đến gặp trong khi ἀπελθών chỉ nói ông đã đi khỏi đó trước khi bàn bạc; nên giữ hai hành động phân biệt.'
  naturalness: “Bàn bạc với ... về cách ...” là cách diễn đạt tự nhiên, rõ ràng và phù hợp văn phong hiện đại. “Giu-đa đi khỏi đó, rồi bàn bạc ...” cũng tự nhiên hơn và sát trình tự của phân từ aorist.
  terminology: “Các thượng tế” là thuật ngữ chuẩn cho ἀρχιερεῦσιν. “Các viên chỉ huy” chấp nhận được cho στρατηγοῖς khi có chú thích xác định bối cảnh Đền Thờ. “Nộp ... cho” giữ được nghĩa cơ bản của παραδῷ mà không áp đặt “phản bội” vào bản văn chính.
  issues:
  - severity: medium
    issue: “đi gặp” bổ sung sắc thái mục đích/đích đến cho ἀπελθών.
    rationale: Nguyên ngữ nói “đi khỏi” rồi “bàn bạc”; dù bối cảnh cho thấy Giu-đa đến gặp các giới chức, động từ ἀπελθών không tự nó có nghĩa “đi gặp.” Bản dịch nên duy trì trình tự và sự phân biệt giữa hành động rời đi với cuộc bàn bạc.
  revised_text: Giu-đa đi khỏi đó, rồi bàn bạc với các thượng tế và các viên chỉ huy về cách nộp Đức Giê-su cho họ[a][b].
