- from: Rồi Giu-đa đi gặp các thượng tế và các viên chỉ huy, bàn với họ cách nộp Đức Giê-su cho họ[a][b].
  to: Giu-đa đi khỏi đó, rồi bàn bạc với các thượng tế và các viên chỉ huy về cách nộp Đức Giê-su cho họ[a][b].
  rationale: 'Sửa “đi gặp” thành “đi khỏi đó, rồi” để phản ánh trực tiếp hơn καὶ ἀπελθὼν συνελάλησεν: Giu-đa rời đi trước, sau đó bàn bạc. Thêm “về” trước “cách” để câu tiếng Việt trôi chảy. Chú thích b được gọn lại, vẫn bảo toàn nhận định văn hóa của bản tiếng Anh.'
  reviewer_model: gpt-5.6-terra
