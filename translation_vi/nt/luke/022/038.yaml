  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: vi
  text: 'Họ nói: “Thưa Chúa, đây có hai thanh gươm.” Ngài nói với họ: “Đủ rồi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Thôi, đủ rồi,” nghĩa là nên chấm dứt cuộc trao đổi, chứ không nhất thiết là hai thanh gươm là đủ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Họ nói
  rationale: δέ là từ nối nhẹ; tiếng Việt có thể lược dịch để lời kể tự nhiên mà không tạo sắc thái tương phản quá mức.
- source_word: Κύριε
  choice: Thưa Chúa
  rationale: Giữ cách xưng hô tôn kính trực tiếp với Chúa Giê-su và cách dùng danh hiệu κύριος trong Tân Ước.
- source_word: ἰδοὺ
  choice: xem này
  rationale: Diễn đạt tự nhiên sắc thái chỉ dẫn, thu hút sự chú ý của ἰδού trong lời nói trực tiếp.
- source_word: μάχαιραι
  choice: thanh gươm
  rationale: μάχαιρα chỉ một loại vũ khí có lưỡi; “gươm” là cách dịch quen thuộc mà không xác định quá mức là đoản kiếm hay dao găm.
- source_word: ὧδε δύο
  choice: ở đây có hai
  rationale: Giữ cả ý chỉ nơi chốn của ὧδε và số lượng δύο theo trật tự tự nhiên của tiếng Việt.
- source_word: Ἱκανόν ἐστιν
  choice: Thế là đủ rồi
  rationale: Cách nói tự nhiên trong tiếng Việt, có thể chỉ số gươm là đủ hoặc hàm ý nên chấm dứt cuộc trao đổi; vì vậy vẫn giữ được độ mơ hồ của câu Hy Lạp.
theological_decisions:
- issue: Sự mơ hồ trong lời đáp Ἱκανόν ἐστιν của Chúa Giê-su
  choice: Thế là đủ rồi
  alternative: 'Đủ rồi; hoặc: Bấy nhiêu là đủ'
  rationale: Nguyên văn có thể được hiểu là hai thanh gươm đã đủ, hoặc là Chúa Giê-su kết thúc cuộc trao đổi. Bản dịch chính không xác quyết một cách hiểu; chú thích nêu rõ khả năng thứ hai.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thưa Chúa” giữ sắc thái kính trọng; “xem này” tự nhiên hơn “hãy xem” hoặc lối cổ “kìa”. Đại từ “Ngài” giúp lời kể rõ chủ thể và duy trì văn phong tôn kính.
