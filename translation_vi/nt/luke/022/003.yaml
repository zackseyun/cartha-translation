  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: vi
  text: Bấy giờ, Sa-tan nhập vào Giu-đa, người được gọi là Ích-ca-ri-ốt, thuộc Nhóm Mười Hai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “thuộc số mười hai”; cũng có thể dịch: “là một trong Nhóm Mười Hai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Bấy giờ ... nhập vào
  rationale: δέ đánh dấu bước tiếp theo trong diễn tiến câu chuyện; “Bấy giờ” tạo liên kết tự nhiên. “Nhập vào” thể hiện rõ động từ εἰσέρχομαι đi với εἰς, không làm nhẹ thành ảnh hưởng đơn thuần.
- source_word: Σατανᾶς
  choice: Sa-tan
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên gọi này.
- source_word: εἰς Ἰούδαν
  choice: vào Giu-đa
  rationale: Giữ rõ giới từ εἰς và mô tả trực tiếp việc Sa-tan vào trong Giu-đa.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: người được gọi là Ích-ca-ri-ốt
  rationale: Phản ánh phân từ bị động καλούμενον, đồng thời nhận diện Giu-đa bằng tên gọi Ích-ca-ri-ốt theo lối tiếng Việt tự nhiên.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: thuộc số mười hai sứ đồ
  rationale: “Thuộc số” giữ sắc thái của ἐκ τοῦ ἀριθμοῦ, còn “sứ đồ” làm rõ nhóm người mà “mười hai” chỉ đến trong ngữ cảnh, tránh cách nói cụt và thiếu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất hành động của Sa-tan đối với Giu-đa
  choice: “Sa-tan nhập vào Giu-đa”
  alternative: “Sa-tan tác động đến Giu-đa” hoặc “Sa-tan khống chế Giu-đa”
  rationale: Cấu trúc εἰσῆλθεν ... εἰς diễn tả sự đi vào. Bản dịch giữ nguyên cách nói mạnh của nguyên văn nhưng không bổ sung lời giải thích về quỷ nhập hay mối quan hệ giữa hành động của Sa-tan và trách nhiệm của Giu-đa.
- issue: Cách nhận diện nhóm mười hai
  choice: “mười hai sứ đồ”
  alternative: “Nhóm Mười Hai” hoặc “mười hai người”
  rationale: Nguyên văn chỉ nói “mười hai”, nhưng trong ngữ cảnh đây là nhóm sứ đồ được công nhận. Thêm danh từ “sứ đồ” làm câu tiếng Việt rõ và tự nhiên mà không đưa thêm một nét thần học xa lạ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nhập vào” để giữ sức nặng của nguyên văn; dùng “thuộc số” nhằm bảo toàn sắc thái đếm thuộc nhóm, với chú thích ghi cách diễn đạt sát chữ và phương án gọi nhóm.
