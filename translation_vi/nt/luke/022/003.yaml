    rationale: τῶν δώδεκα chỉ ghi “mười hai”; dù ngữ cảnh xác định đây là nhóm các sứ đồ, bản văn câu này không dùng ἀπόστολοι. Nên dùng “Nhóm Mười Hai” và dành cách diễn đạt sát chữ cho chú thích.
