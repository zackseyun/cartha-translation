- from: 'Nhưng Ngài nói: “Phi-e-rơ, tôi nói với anh: hôm nay, gà chưa gáy cho đến khi anh ba lần chối rằng mình biết tôi.”'
  to: 'Nhưng Ngài nói: “Tôi nói với anh, Phi-e-rơ: hôm nay gà sẽ không gáy cho đến khi anh ba lần chối là mình biết tôi.”'
  rationale: Chỉ chỉnh cách diễn đạt mệnh đề về tiếng gà để phản ánh rõ thì tương lai của động từ Hy Lạp và cho câu tiếng Việt tự nhiên. Bản sửa vẫn giữ quan hệ thời gian οὐ ... ἕως mà không khẳng định tiếng gà nhất thiết gáy ngay sau lần chối thứ ba, đồng thời bảo toàn nội dung “chối ... biết tôi.”
