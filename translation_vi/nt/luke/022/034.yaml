base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: vi
  text: 'Nhưng Ngài nói: “Tôi nói với anh, Phi-e-rơ: hôm nay gà sẽ không gáy cho đến khi anh ba lần chối là mình biết tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Nhưng Ngài nói
  rationale: δέ chuyển sang lời đáp có sắc thái tương phản nhẹ với lời quả quyết trước đó của Phi-e-rơ; “Nhưng” phù hợp mạch văn.
- source_word: Λέγω σοι
  choice: tôi nói với anh
  rationale: Công thức trực tiếp, tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái của thì hiện tại λέγω.
- source_word: Πέτρε
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: οὐ φωνήσει ... ἀλέκτωρ
  choice: gà chưa gáy
  rationale: Với ἀλέκτωρ làm chủ ngữ, φωνήσει chỉ tiếng gà gáy; cấu trúc phủ định đi với ἕως được diễn đạt tự nhiên bằng “chưa ... cho đến khi”.
- source_word: σήμερον
  choice: hôm nay
  rationale: Tương đương trực tiếp và tự nhiên của trạng từ chỉ thời gian.
- source_word: ἕως
  choice: cho đến khi
  rationale: Giữ quan hệ thời gian của mệnh đề Hy Lạp mà không quyết định quá mức liệu tiếng gáy xảy ra ngay sau lần chối thứ ba.
- source_word: τρίς
  choice: ba lần
  rationale: Cách nói thông dụng, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: anh ba lần chối rằng mình biết tôi
  rationale: 'Giữ rõ nội dung của sự chối bỏ do εἰδέναι xác định: Phi-e-rơ sẽ chối rằng mình biết Chúa Giê-su, thay vì chỉ dịch chung là “chối tôi”.'
theological_decisions:
- issue: Bản chất lời tiên báo về sự chối của Phi-e-rơ
  choice: chối rằng mình biết tôi
  alternative: chối tôi ba lần
  rationale: Bản dịch giữ εἰδέναι trong nguyên văn, xác định sự chối là phủ nhận việc biết Chúa Giê-su, nhưng không mở rộng thành một kết luận thần học khác.
- issue: Quan hệ thời gian của tiếng gà gáy và ba lần chối
  choice: gà chưa gáy cho đến khi
  alternative: gà sẽ không gáy trước khi
  rationale: Giữ sát cấu trúc οὐ ... ἕως và không hàm ý không cần thiết rằng gà nhất định gáy ngay khi lần chối thứ ba hoàn tất.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” trong lời dẫn nhận diện Chúa Giê-su; trong lời thoại dùng cặp “tôi–anh” để giữ lời nói trực tiếp, tự nhiên và không thêm sắc thái giáo phái.
