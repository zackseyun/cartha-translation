review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của nguyên văn: lời đáp của Chúa Giê-su, lời gọi đích danh Phi-e-rơ, thời điểm “hôm nay,” tiếng gà gáy, và việc Phi-e-rơ ba lần chối mình biết Người. Tuy nhiên, “gà chưa gáy cho đến khi” dùng thể tình trạng hiện tại/quá khứ (“chưa gáy”) trong một lời tiên báo tương lai, nên không diễn đạt đầy đủ φωνήσει ở thì tương lai. Cần dùng “sẽ không gáy”.'
  naturalness: Cấu trúc “hôm nay, gà chưa gáy cho đến khi” không tự nhiên trong tiếng Việt hiện đại trong ngữ cảnh dự báo. “Hôm nay gà sẽ không gáy cho đến khi...” là rõ ràng và tự nhiên. Đưa lời xưng hô “Phi-e-rơ” sau công thức mở đầu cũng gần trật tự nguyên văn và mạch lời thoại Việt hơn.
  terminology: “Phi-e-rơ” phù hợp dạng tên Kinh Thánh Việt ngữ. “Chối là mình biết tôi” giữ rõ bổ ngữ εἰδέναι, tránh lối dịch rút gọn “chối tôi.” Cặp đại từ “tôi–anh” nhất quán với register hiện đại vừa phải của bản nháp.
  issues:
  - severity: medium
    issue: “gà chưa gáy” không biểu đạt thì tương lai của φωνήσει trong lời tiên báo.
    rationale: 'Nguyên văn dùng φωνήσει, thì tương lai: “sẽ gáy.” Trong tiếng Việt, “chưa gáy” thường mô tả tình trạng tính đến hiện tại hoặc một mốc quá khứ; thêm “sẽ không gáy” mới biểu đạt dự báo: tiếng gà sẽ không xảy ra trước mốc được nêu.'
  revised_text: 'Nhưng Ngài nói: “Tôi nói với anh, Phi-e-rơ: hôm nay gà sẽ không gáy cho đến khi anh ba lần chối là mình biết tôi.”'
