source:
  edition: SBLGNT
  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: vi
  text: Sau khi họ nhóm lửa giữa sân và cùng ngồi xuống, Phi-e-rơ đang ngồi giữa họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch đơn giản là “Phi-e-rơ ngồi giữa họ.” Dạng động từ Hy Lạp diễn tả một cảnh đang tiếp diễn, nên bản dịch chính dùng “đang ngồi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: sau khi họ nhóm
  rationale: Phân từ bất định quá khứ chỉ hành động xảy ra trước động từ chính; “nhóm một đống lửa” là cách nói tự nhiên trong tiếng Việt.
- source_word: πῦρ
  choice: một đống lửa
  rationale: Trong ngữ cảnh, danh từ số ít chỉ một đống lửa cụ thể được nhóm để mọi người ngồi quanh; cách diễn đạt này tự nhiên hơn chỉ nói “lửa”.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: giữa sân
  rationale: Diễn đạt ngắn gọn, rõ nghĩa không gian; αὐλή ở đây là sân trong dinh thượng tế.
- source_word: συγκαθισάντων
  choice: cùng ngồi xuống
  rationale: Giữ sắc thái của tiền tố σύν, cho biết họ ngồi cùng nhau; phân từ này song song với περιαψάντων.
- source_word: ἐκάθητο
  choice: đang ngồi
  rationale: Thể chưa hoàn thành mô tả tư thế đang tiếp diễn trong khung cảnh quá khứ; “đang ngồi” thể hiện rõ sắc thái ấy trong tiếng Việt.
- source_word: μέσος αὐτῶν
  choice: giữa họ
  rationale: Cho biết Phi-e-rơ ở ngay trong nhóm người ấy; cách dịch này giữ hình ảnh không gian của μέσος mà vẫn tự nhiên.
- source_word: δὲ
  choice: Sau khi
  rationale: Liên từ δέ chuyển tiếp nhẹ trong lời kể; trong tiếng Việt, quan hệ tự sự được chuyển tự nhiên qua cấu trúc “Sau khi ... rồi ...” mà không cần dịch δέ bằng một từ riêng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Sân” được dùng theo ngữ cảnh là sân trong dinh thượng tế; không thêm “dinh” vì câu này không nêu trực tiếp. Tên riêng dùng dạng quen thuộc “Phi-e-rơ”.
