revisions:
- from: Sau khi họ nhóm một đống lửa giữa sân rồi cùng ngồi xuống, Phi-e-rơ đang ngồi giữa họ.[a]
  to: Sau khi họ nhóm lửa giữa sân và cùng ngồi xuống, Phi-e-rơ đang ngồi giữa họ.[a]
  rationale: Chỉnh nhẹ để tránh thêm ý “đống” vào danh từ πῦρ và làm câu tiếng Việt gọn, tự nhiên hơn, đồng thời giữ nguyên các quan hệ thời gian, không gian, và sắc thái tiếp diễn của nguyên văn.
