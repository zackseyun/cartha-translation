  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: vi
  text: Những người đàn ông đang giữ Ngài vừa chế nhạo vừa đánh Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Những người đang giam giữ Ngài.”
    reason: συνέχω trong ngữ cảnh này cũng có thể được hiểu là giữ trong tình trạng giam giữ.
lexical_decisions:
- source_word: Καὶ
  choice: Lược dịch trong mạch văn
  rationale: Liên từ καί nối tiếp câu chuyện. Trong tiếng Việt, mở đầu bằng “Và” ở đây không cần thiết; sự tiếp nối đã rõ từ ngữ cảnh.
- source_word: οἱ ἄνδρες
  choice: Những người
  rationale: ἄνδρες chỉ những người nam, nhưng trong tiếng Việt hiện đại, “những người” là cách gọi tự nhiên trong ngữ cảnh này và không tự ý xác định họ là lính hay lính canh.
- source_word: οἱ συνέχοντες αὐτὸν
  choice: đang giữ Đức Chúa Jêsus
  rationale: συνέχω ở đây nói đến việc giữ người trong sự kiểm soát hoặc giam giữ. “Đang giữ” bảo toàn sắc thái cụ thể mà không thêm ý về thủ tục giam cầm chính thức. Dùng danh xưng để làm rõ đại từ trong câu độc lập.
- source_word: ἐνέπαιζον αὐτῷ
  choice: chế nhạo
  rationale: ἐμπαίζω diễn tả sự nhạo báng đầy khinh miệt. “Chế nhạo” tự nhiên, trang trọng vừa phải và đúng sắc thái thù nghịch.
- source_word: δέροντες
  choice: đánh Ngài
  rationale: Phân từ diễn tả những cú đánh diễn ra cùng với hành động chế nhạo. “Đánh” rõ ràng và không thu hẹp nghĩa thành “đánh roi”.
theological_decisions:
- issue: Danh tính của những người ngược đãi Đức Chúa Jêsus
  choice: những người đang giữ Đức Chúa Jêsus
  alternative: những lính canh đang giữ Ngài
  rationale: Bản Hy Lạp dùng từ khái quát ἄνδρες, không gọi họ là lính canh hay binh lính; vì vậy bản dịch không xác định cụ thể hơn nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang nghiêm nhưng dễ hiểu. Câu ngắn giữ nhịp kể trực tiếp; tránh thuật ngữ pháp lý hoặc quân sự không có trong nguyên văn.
