id: LUK.22.44
reference: Luke 22:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: vi
  text: Trong cơn thống khổ[a], Ngài càng tha thiết cầu nguyện; mồ hôi Ngài trở nên như những giọt máu[b] rơi xuống đất.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong nỗi quằn quại” hoặc “trong cơn giằng co dữ dội.”
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “như những giọt/cục máu đông,” giữ đây là một phép so sánh chứ không khẳng định mồ hôi tự nó là máu.
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản không có Lu-ca 22:43–44, còn các thủ bản khác có hai câu này. SBLGNT đặt các câu ấy trong dấu ngoặc để thể hiện sự bất định về văn bản.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: Trong cơn thống khổ
  rationale: Cụm phân từ giới thiệu trạng thái của Chúa Giê-su. “Trong cơn thống khổ” diễn đạt tự nhiên nỗi giằng co, đau đớn mãnh liệt mà không giới hạn ý nghĩa vào đau đớn thể xác.
- source_word: ἐκτενέστερον προσηύχετο
  choice: càng cầu nguyện tha thiết hơn
  rationale: ἐκτενέστερον là trạng từ so sánh, chỉ mức độ gia tăng; προσηύχετο ở thì chưa hoàn thành diễn tả hành động đang tiếp diễn. Cách dịch này giữ cả sắc thái “hơn” lẫn sự chuyên tâm mạnh mẽ trong lời cầu nguyện.
- source_word: ἐγένετο ὁ ἱδρὼς αὐτοῦ
  choice: mồ hôi Ngài trở nên
  rationale: “Trở nên” giữ lực nghĩa của ἐγένετο, thay vì giản lược thành “là”; “mồ hôi” là nghĩa trực tiếp của ἱδρώς.
- source_word: ὡσεὶ θρόμβοι αἵματος
  choice: như những giọt máu
  rationale: “Như” giữ rõ phép so sánh do ὡσεὶ đánh dấu. θρόμβοι có thể chỉ những giọt đặc hoặc cục đông; “những giọt máu” tự nhiên trong tiếng Việt và phù hợp với hình ảnh rơi xuống, còn sắc thái khác được ghi trong chú thích.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: rơi xuống đất
  rationale: Diễn đạt tự nhiên chuyển động đi xuống của các giọt, đúng với hình ảnh trong nguyên văn.
theological_decisions:
- issue: Bản chất của phép so sánh “như những giọt máu”
  choice: 'Giữ nguyên phép so sánh: mồ hôi trở nên như những giọt máu.'
  alternative: Khẳng định mồ hôi chính là máu.
  rationale: ὡσεὶ minh nhiên đánh dấu sự tương đồng chứ không nhất thiết đồng nhất hai sự vật. Bản dịch vì thế không áp đặt một cách giải thích y khoa hoặc phép lạ vượt quá điều câu Hy Lạp khẳng định.
- issue: Tính xác thực văn bản của Lu-ca 22:43–44
  choice: Dịch câu theo bản văn SBLGNT và ghi rõ sự bất định trong chú thích.
  alternative: Loại câu khỏi chính văn hoặc trình bày mà không báo cho độc giả về dị bản.
  rationale: SBLGNT in các câu này trong dấu ngoặc để phản ánh chứng cứ thủ bản không đồng nhất. Việc giữ câu và chú thích vừa đi theo văn bản nguồn được chỉ định vừa minh bạch về vấn đề phê bình văn bản.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối tôn kính phổ biến, đồng thời tránh thêm danh xưng không có trong câu Hy Lạp. Cấu trúc câu giữ nhịp tăng tiến từ nỗi thống khổ, lời cầu nguyện mãnh liệt đến hình ảnh mồ hôi rơi xuống đất.
