id: LUK.22.18
reference: Luke 22:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: vi
  text: 'Vì Ta bảo anh em: từ nay Ta chắc chắn sẽ không uống sản vật từ cây nho[a] nữa cho đến khi Nước Đức Chúa Trời đến.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “rượu”. Nguyên văn là “sản vật từ cây nho”, một cách nói rộng hơn, có lẽ chỉ đồ uống trong chén mà không dùng từ thông thường có nghĩa là rượu.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì Ta bảo anh em
  rationale: Giữ γάρ là “vì” để nối câu này với lời trước; “Ta bảo anh em” là công thức trực tiếp tự nhiên trong tiếng Việt. “Ta” phù hợp với lời Chúa Giê-su nói với các môn đồ trong văn phong Kinh Thánh trang trọng.
- source_word: οὐ μὴ πίω
  choice: Ta chắc chắn sẽ không uống ... nữa
  rationale: οὐ μή với động từ ở thể giả định aorist diễn tả sự phủ định tương lai rất mạnh. “Chắc chắn sẽ không” giữ được sức nhấn mạnh, còn “nữa” phối hợp tự nhiên với mốc “từ nay” và giới hạn “cho đến khi”.
- source_word: ἀπὸ τοῦ νῦν
  choice: từ nay
  rationale: Diễn đạt tự nhiên mốc bắt đầu ngay từ thời điểm hiện tại mà không làm câu nặng nề.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: sản phẩm của cây nho
  rationale: γένημα chỉ thứ được sinh ra hay sản xuất, nên “sản phẩm của cây nho” giữ phạm vi rộng hơn “rượu” và không xác định quá mức thứ trong chén.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Diễn đạt rõ giới hạn thời gian của lời phủ định.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: “Vương quốc” giữ hình ảnh vương quyền lẫn thực tại thuộc quyền cai trị của Đức Chúa Trời, đồng thời là cách diễn đạt dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἔλθῃ
  choice: đến
  rationale: Thể giả định aorist sau ἕως οὗ hướng đến một biến cố tương lai; “đến” là cách dịch tự nhiên và không xác định thêm phương thức hay giai đoạn ứng nghiệm.
theological_decisions:
- issue: Nên dịch γενήματος τῆς ἀμπέλου là “rượu” hay giữ cách nói rộng hơn
  choice: sản phẩm của cây nho
  alternative: rượu
  rationale: Nguyên văn không dùng từ thông thường chỉ rượu. Cách dịch đã chọn giữ cách nói rộng và trang trọng của Hy Lạp, không áp đặt một nhận diện hẹp hơn văn bản.
- issue: Ý nghĩa cánh chung của việc vương quốc Đức Chúa Trời “đến”
  choice: cho đến khi vương quốc Đức Chúa Trời đến
  alternative: cho đến khi vương quốc Đức Chúa Trời đến trọn vẹn
  rationale: Câu Hy Lạp đặt ra một giới hạn tương lai nhưng không nói rõ phương thức, mức độ hay giai đoạn vương quốc đến; bản dịch giữ nguyên độ mở thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được sắp xếp tự nhiên theo tiếng Việt, đồng thời giữ sức nhấn mạnh của lời phủ định và độ mở của phát biểu cánh chung.
