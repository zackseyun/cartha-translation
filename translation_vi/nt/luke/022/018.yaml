    rationale: “Sản phẩm” thường chỉ hàng hóa hoặc kết quả sản xuất, gây sắc thái hiện đại-kỹ thuật không có trong γένημα. “Sản vật từ cây nho” diễn đạt sản vật/hoa lợi của cây nho, không thu hẹp thành “rượu”.
  - severity: low
    issue: “vương quốc Đức Chúa Trời”
    rationale: Dù không sai nghĩa, “Nước Đức Chúa Trời” là lối dùng ổn định và tự nhiên hơn trong tiếng Việt Kinh Thánh cho βασιλεία τοῦ θεοῦ.
  - severity: medium
    issue: Chú thích nói “thứ đựng trong chén”
    rationale: Cụm này mơ hồ và có thể bị hiểu là vật được đặt trong chén. Nguyên ý tiếng Anh là nội dung/đồ uống trong chén.
