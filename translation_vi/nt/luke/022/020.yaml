review_pass:
  verdict: revise
  source_fidelity: 'Bản thảo truyền đạt đúng các yếu tố chính: trình tự sau bữa ăn, chén, giao ước mới, huyết của Chúa Giê-su và ý “vì” các người được nói đến. Tuy nhiên, “cầm chén” bổ sung một động tác không hiện diện trong câu Hy Lạp này; động tác ấy chỉ có thể được suy từ phép song hành với câu trước. Cách dùng “các con” cũng thêm sắc thái quan hệ cha-con không được biểu thị bởi ὑμῶν.'
  naturalness: Câu tiếng Việt nhìn chung rõ và trang trọng. “Cũng lấy chén” là cách Việt ngữ tự nhiên hơn “cũng cầm chén” trong ngữ cảnh lời thiết lập, đồng thời “anh em” là cách xưng hô số nhiều trung tính, hiện đại và phù hợp hơn với đại từ nguồn.
  terminology: “Chén,” “giao ước mới,” và “trong huyết Ta” đều thích đáng. Giữ “trong” bảo toàn độ mở của ἐν; chú thích có thể nêu cách hiểu “bằng huyết Ta.” Câu cuối được diễn đạt theo nghĩa ngữ cảnh là huyết được đổ ra, trong khi chú thích tiếp tục ghi nhận điểm mơ hồ cú pháp của phân từ giống trung.
