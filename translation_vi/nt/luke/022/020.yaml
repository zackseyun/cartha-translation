  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: vi
  text: 'Sau bữa ăn, Ngài cũng lấy chén và nói: “Chén này là giao ước mới trong huyết Ta[a]—huyết được đổ ra vì anh em.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “trong huyết Ta” cũng có thể được hiểu là “được lập bằng huyết Ta”; bản dịch chính giữ sát giới từ Hy Lạp.
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, cụm “đổ ra vì anh em” đứng sau toàn bộ lời nói về chén và giao ước; về mặt ngữ pháp, phân từ giống trung có thể liên hệ với “chén.” Theo nghĩa tự nhiên trong ngữ cảnh, huyết của Chúa Giê-su là điều được đổ ra vì họ.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ποτήριον
  choice: chén
  rationale: “Chén” là cách gọi tự nhiên, trang trọng vừa phải cho vật dùng để uống; không đưa thêm sắc thái nghi lễ mà từ Hy Lạp không nhất thiết hàm ý.
- source_word: ὡσαύτως
  choice: cũng
  rationale: Giữ mối liên hệ với hành động tương tự đối với bánh ở câu trước, đồng thời phù hợp cú pháp tiếng Việt.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: sau bữa ăn
  rationale: Diễn đạt tự nhiên cấu trúc nguyên mẫu có mạo từ và giữ rõ trình tự thời gian.
- source_word: λέγων
  choice: và nói
  rationale: Chuyển phân từ Hy Lạp thành động từ phối hợp để câu tiếng Việt rõ và tự nhiên.
- source_word: καινὴ διαθήκη
  choice: giao ước mới
  rationale: “Giao ước” giữ đúng bối cảnh Kinh Thánh về mối cam kết được thiết lập bằng huyết; “di chúc” dễ gợi một văn kiện phân chia tài sản và không phù hợp bằng.
- source_word: ἐν τῷ αἵματί μου
  choice: trong huyết Ta
  rationale: Giữ cách diễn đạt giao ước và tế lễ của nguyên văn, đồng thời không xác định quá mức ἐν là “bởi” hay “nhờ”.
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: huyết đổ ra vì các con
  rationale: Diễn đạt ý nghĩa tự nhiên rằng huyết của Chúa Giê-su được đổ ra; “vì” giữ được sắc thái vì lợi ích hoặc thay cho người khác của ὑπέρ mà không áp đặt một mô hình thần học cụ thể.
theological_decisions:
- issue: Cách dịch διαθήκη trong lời thiết lập giao ước
  choice: giao ước mới
  alternative: di chúc mới
  rationale: Ngôn ngữ về huyết gợi trực tiếp bối cảnh thiết lập giao ước trong Cựu Ước. “Giao ước” vừa chính xác về từ vựng vừa tránh để truyền thống dịch thuật lấn át bối cảnh nguồn.
- issue: Từ mà phân từ ἐκχυννόμενον quy chiếu đến
  choice: Hiểu theo nghĩa là “huyết Ta”, và diễn đạt “huyết đổ ra vì các con”
  alternative: Gắn theo hình thức ngữ pháp trực tiếp hơn với “chén” hoặc với toàn bộ mệnh đề
  rationale: Phân từ giống trung có thể phù hợp hình thức với ποτήριον, và đứng sau toàn bộ mệnh đề; tuy nhiên trong ngữ cảnh tế lễ, thứ được đổ ra vì các môn đồ là huyết. Bản dịch chính truyền đạt nghĩa tự nhiên, còn chú thích bảo lưu đặc điểm cú pháp và sự căng thẳng của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta/các con” trong lời Chúa Giê-su để giữ giọng nói trang nghiêm, gần gũi. Cụm “cầm chén” bổ sung động tác được lược theo phép song hành trong tiếng Hy Lạp, dựa vào hành động ở câu trước, nhằm tạo câu hoàn chỉnh tự nhiên trong tiếng Việt.
