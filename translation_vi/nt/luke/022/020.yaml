  - severity: medium
    issue: “các con” thêm sắc thái thân tộc không có trong ὑμῶν
    rationale: Đại từ Hy Lạp chỉ là ngôi thứ hai số nhiều. “Anh em” giữ số nhiều và giọng trang trọng của lời nói với các môn đồ mà không xác định thêm quan hệ cha-con.
