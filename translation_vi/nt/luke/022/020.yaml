  to: 'Sau bữa ăn, Ngài cũng lấy chén và nói: “Chén này là giao ước mới trong huyết Ta[a]—huyết được đổ ra vì anh em.[b]”'
  rationale: Đổi “cầm” thành “lấy” để diễn đạt phép song hành với câu trước bằng cách tự nhiên hơn, mà không nhấn mạnh một cử chỉ không được lặp lại trong câu nguồn. Đổi “các con” thành “anh em” để không thêm sắc thái thân tộc vào đại từ số nhiều Hy Lạp. Cụm “huyết được đổ ra” giữ cách hiểu ngữ cảnh, còn chú thích bảo lưu khả năng liên hệ hình thức với “chén.”
  reviewer_model: gpt-5.6-terra
