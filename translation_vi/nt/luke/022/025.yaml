revisions:
- from: 'Nhưng Đức Chúa Jêsus phán với họ: “Các vua của dân ngoại[a] thống trị dân mình, còn những người thi hành quyền hành trên dân thì được gọi là ‘ân nhân’[b].”'
  to: 'Nhưng Ngài nói với họ: “Các vua của dân ngoại[a] thống trị họ, và những người nắm quyền trên họ được gọi là ‘ân nhân’[b].”'
  rationale: Sửa lời dẫn để không thêm danh xưng không có trong câu tiếng Hy Lạp; thay cách diễn đạt không tự nhiên về việc thực thi quyền lực bằng «nắm quyền». Các từ ngữ then chốt, tính bị động của «được gọi là», sự mơ hồ có chủ ý của «dân ngoại/các dân tộc», và hàm ý danh hiệu của εὐεργέται đều được giữ lại.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và các ý chính của câu: vua, các dân ngoại, sự thống trị, người thực thi quyền lực, và danh hiệu «ân nhân». Tuy nhiên, nguyên văn chỉ nói «Ngài nói với họ» (ὁ δὲ εἶπεν αὐτοῖς), không nêu trực tiếp danh «Đức Chúa Jêsus»; bản sửa giữ đại từ theo nguyên văn. «Những người thi hành quyền hành» cũng chưa diễn đạt tự nhiên và rõ nét tính chủ động của ἐξουσιάζοντες.'
  naturalness: «Những người nắm quyền trên họ» là cách nói hiện đại, tự nhiên hơn «những người thi hành quyền hành». «Thống trị họ» giữ quan hệ đại từ của nguyên văn rõ hơn cách diễn giải «thống trị dân mình».
  terminology: Giữ «các vua», «dân ngoại», và «ân nhân». Dấu ngoặc kép quanh «ân nhân» cùng chú thích văn hóa thích hợp để biểu thị đây là một danh hiệu tôn kính trong bối cảnh Hy-La, không chỉ là một lời khen thông thường.
  issues:
  - severity: low
    issue: Danh xưng «Đức Chúa Jêsus» được thêm vào phần lời dẫn.
    rationale: SBLGNT có ὁ δὲ εἶπεν αὐτοῖς, nghĩa là «Nhưng Ngài nói với họ», không nêu tên hay tước hiệu. Dù ngữ cảnh xác định nhân vật, giữ đại từ sẽ sát nguyên văn hơn.
  - severity: medium
    issue: «Những người thi hành quyền hành» không tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này lặp nghĩa và có thể gợi việc chấp hành mệnh lệnh hơn là chủ động sử dụng quyền lực. ἐξουσιάζοντες được diễn đạt rõ, tự nhiên hơn bằng «những người nắm quyền trên họ».
  revised_text: 'Nhưng Ngài nói với họ: “Các vua của dân ngoại[a] thống trị họ, và những người nắm quyền trên họ được gọi là ‘ân nhân’[b].”'
