review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh cầu nguyện và mục đích tránh πειρασμός. Tuy nhiên, «các con» không được đánh dấu trong αὐτοῖς và thêm sắc thái quan hệ gia trưởng/thầy-trò không cần thiết; «sa vào» cũng diễn giải mạnh hơn εἰσέλθητε εἰς, vốn nghĩa sát là “đi vào/rơi vào”.
  naturalness: Câu Việt nhìn chung tự nhiên. «Sao các anh ngủ?» là lời trách hỏi tự nhiên, và việc lặp «các anh» ở mệnh đề mục đích làm rõ chủ thể mà vẫn gọn.
  terminology: «cơn thử thách» bảo toàn nghĩa rộng, phụ thuộc ngữ cảnh, của πειρασμός mà không thu hẹp thành chỉ “cám dỗ”. «Người» và «các anh» giữ lối quy chiếu trung tính, không đưa thêm tước hiệu hoặc quan hệ không có trong câu nguồn.
  issues:
  - severity: medium
    issue: «các con» thêm sắc thái quan hệ không được nêu trong nguyên văn.
    rationale: αὐτοῖς chỉ đơn giản là “họ”; trong bối cảnh các môn đồ nam, «các anh» là cách xưng hô tự nhiên hơn và tránh áp đặt sắc thái thân phụ/quyền uy vào lời thoại.
  - severity: low
    issue: «sa vào» diễn giải mạnh hơn động từ εἰσέρχομαι.
    rationale: Cụm Hy Lạp là “đi vào trong thử thách”; «rơi vào cơn thử thách» là cách nói Việt tự nhiên, gần nghĩa hơn và không hàm ý sẵn việc bị khuất phục hay phạm lỗi.
  revised_text: 'Người nói với họ: “Sao các anh ngủ? Hãy đứng dậy và cầu nguyện, để các anh không rơi vào cơn thử thách.”'
