  to: 'Người nói với họ: “Sao các anh ngủ? Hãy đứng dậy và cầu nguyện, để các anh không rơi vào cơn thử thách.”'
  rationale: Đổi cách xưng hô để không thêm quan hệ vào đại từ nguồn; điều chỉnh cách diễn đạt mệnh đề cuối cho gần nghĩa “đi vào” hơn, đồng thời giữ «cơn thử thách» để bảo toàn độ rộng ngữ nghĩa của πειρασμός. Không cần chú thích vì câu tiếng Việt đã giữ được sự không xác định giữa thử thách và cám dỗ.
