source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: vi
  text: 'Người nói với họ: “Sao các anh ngủ? Hãy đứng dậy và cầu nguyện, để các anh không rơi vào cơn thử thách.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: ngủ
  rationale: 'Diễn đạt trực tiếp trạng thái đang ngủ; kết hợp với τί thành câu hỏi tự nhiên: “Sao các con lại ngủ?”'
- source_word: ἀναστάντες
  choice: hãy đứng dậy
  rationale: Phân từ aorist mang lực mệnh lệnh đi kèm προσεύχεσθε; “đứng dậy” giữ rõ hành động thức dậy và đứng lên.
- source_word: προσεύχεσθε
  choice: cầu nguyện
  rationale: Tương đương thông dụng và chính xác với động từ chỉ việc cầu nguyện.
- source_word: ἵνα μὴ εἰσέλθητε εἰς πειρασμόν
  choice: để khỏi sa vào cơn thử thách
  rationale: Giữ mục đích phủ định của ἵνα μή. “Sa vào” diễn đạt tự nhiên việc bước vào và bị cuốn vào hoàn cảnh thử thách; πειρασμός có thể bao hàm cả thử thách lẫn cám dỗ.
theological_decisions:
- issue: Nghĩa của πειρασμός
  choice: cơn thử thách
  alternative: sự cám dỗ
  rationale: Trong bối cảnh cuộc khủng hoảng sắp xảy đến, “thử thách” giữ nghĩa rộng của từ Hy Lạp, không thu hẹp chỉ còn sự xúi giục phạm tội.
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: các con
  alternative: các anh / các ông
  rationale: “Các con” thể hiện quan hệ thầy-trò gần gũi và có thẩm quyền trong tiếng Việt hiện đại, nhưng không thêm danh xưng thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi được chuyển thành “Sao các con lại ngủ?” để tự nhiên trong tiếng Việt mà vẫn giữ sắc thái trách hỏi của Τί καθεύδετε.
