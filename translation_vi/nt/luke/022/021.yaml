  - severity: low
    issue: Trật tự “đang ở cùng Ta trên bàn” hơi nặng và kém tự nhiên.
    rationale: “Cùng Ta ở trên bàn” diễn đạt rõ rằng bàn tay của người giao nộp cũng hiện diện trên bàn, tương ứng μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης.
