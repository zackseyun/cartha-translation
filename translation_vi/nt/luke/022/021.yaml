  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: vi
  text: Nhưng kìa, bàn tay của kẻ giao nộp Ta cùng Ta ở trên bàn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn tả rõ nét chuyển ý tương phản của πλὴν trong ngữ cảnh.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ sắc thái thu hút sự chú ý của mệnh lệnh chỉ xuất, với lối diễn đạt trang trọng nhưng vẫn quen thuộc trong tiếng Việt hiện đại.
- source_word: τοῦ παραδιδόντος με
  choice: của kẻ nộp Ta
  rationale: Phân từ hiện tại được chuyển thành cụm danh từ; “nộp” giữ nghĩa giao một người vào tay đối phương và không thu hẹp thành động cơ phản bội.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: đang ở cùng Ta trên bàn
  rationale: 'Bám sát cấu trúc nguồn: bàn tay ở cùng Đức Chúa Jêsus trên bàn; “đang” giúp câu tiếng Việt tự nhiên và phản ánh tình thế hiện tại.'
theological_decisions:
- issue: Cách dịch παραδίδω
  choice: nộp
  alternative: phản bội
  rationale: “Nộp” bảo toàn hình ảnh hành động giao nộp trong nguyên ngữ, đồng thời ngữ cảnh vẫn hàm chứa sự phản bội mà không cần diễn giải thay cho bản văn.
translation_notes:
  register: Câu văn hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời Đức Chúa Jêsus trong văn phong Kinh Thánh tiếng Việt; không thêm tên người nói vì nguyên văn không có.
