- from: 'Ngài nói với họ: “Ta tha thiết mong được ăn lễ Vượt Qua này với các con trước khi Ta chịu khổ.[a][b]”'
  to: 'Ngài nói với họ: “Ta tha thiết mong[a] được cùng anh em ăn bữa Vượt Qua này[b] trước khi Ta chịu khổ.”'
  rationale: Bản sửa thay cách xưng hô thêm sắc thái bằng “anh em”, diễn đạt tự nhiên hành động ăn trong bối cảnh bằng “ăn bữa Vượt Qua”, và đặt lại các neo chú thích đúng thành tố. Câu vẫn giữ cường độ của Ἐπιθυμίᾳ ἐπεθύμησα, nghĩa thời gian của πρὸ τοῦ, và nghĩa rộng của πάσχω.
