source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Ta tha thiết mong[a] được cùng anh em ăn bữa Vượt Qua này[b] trước khi Ta chịu khổ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “Ta đã mong với lòng mong mỏi”; tiếng Hy Lạp dùng danh từ và động từ cùng gốc để nhấn mạnh lòng mong mỏi mãnh liệt của Đức Giê-su.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “lễ Vượt Qua này”. Từ này có thể chỉ lễ Vượt Qua hoặc, trong ngữ cảnh ăn uống này, cụ thể là bữa ăn Vượt Qua.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: Ngài nói với họ
  rationale: Cách diễn đạt trực tiếp, tự nhiên của công thức tường thuật lời nói với πρός + đối cách.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Ta tha thiết mong
  rationale: Danh từ và động từ cùng gốc tạo cấu trúc nhấn mạnh, diễn tả lòng mong mỏi mãnh liệt; “tha thiết mong” giữ được cường độ mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦτο τὸ πάσχα
  choice: lễ Vượt Qua này
  rationale: πάσχα có thể chỉ lễ Vượt Qua hoặc bữa ăn Vượt Qua. Giữ cách gọi “lễ Vượt Qua” trong chính văn bảo tồn độ rộng nghĩa, còn ngữ cảnh với động từ “ăn” cho thấy bữa ăn đang được nói đến.
- source_word: φαγεῖν
  choice: được ăn
  rationale: φαγεῖν có nghĩa trực tiếp là “ăn”; từ “được” kết hợp tự nhiên với “mong” trong tiếng Việt và không thay đổi nội dung hành động.
- source_word: μεθ’ ὑμῶν
  choice: với các con
  rationale: Diễn đạt sự đồng hành trực tiếp. “Các con” phù hợp lời Đức Giê-su nói với các môn đồ trong văn phong trang trọng, dễ hiểu.
- source_word: πρὸ τοῦ με παθεῖν
  choice: trước khi Ta chịu khổ
  rationale: Cấu trúc πρό với động từ nguyên mẫu có mạo từ diễn tả thời điểm trước một biến cố; “chịu khổ” giữ nghĩa rộng và trang trọng của πάσχω, không thêm chi tiết ngoài nguyên văn.
theological_decisions:
- issue: Ý nghĩa của πάσχα trong ngữ cảnh
  choice: Giữ “lễ Vượt Qua này” trong chính văn.
  alternative: “bữa ăn Vượt Qua này”
  rationale: Ngữ cảnh ăn uống cho thấy bữa ăn Vượt Qua là điều được nhắm đến, nhưng πάσχα tự nó cũng có thể chỉ lễ Vượt Qua. Bản dịch giữ độ rộng nghĩa và ghi khả năng cụ thể hơn trong chú thích.
- issue: Sắc thái nhấn mạnh của Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Dịch là “Ta tha thiết mong”.
  alternative: '“Ta đã hết sức mong mỏi”; sát chữ: “Ta đã mong với lòng mong mỏi”'
  rationale: Cách dịch này truyền đạt lòng mong mỏi mạnh mẽ của Đức Giê-su mà không biến cấu trúc nhấn mạnh thành một câu tiếng Việt gượng gạo.
- issue: Phạm vi nghĩa của πάσχω
  choice: Dịch là “chịu khổ”.
  alternative: “chịu nạn”
  rationale: “Chịu khổ” gần với nghĩa từ vựng rộng của πάσχω và không tự động giới hạn từ này vào một thuật ngữ thần học truyền thống, dù trong ngữ cảnh nó hướng đến cuộc thương khó sắp xảy ra.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài/Ta/các con” để giữ giọng kể và lời nói tôn kính, gần gũi. Tránh lối sát chữ gượng ép, đồng thời bảo tồn sự nhấn mạnh và độ rộng nghĩa của nguyên văn.
