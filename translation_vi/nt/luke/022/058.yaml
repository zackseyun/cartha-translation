  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: vi
  text: 'Một lát sau, một người khác thấy ông thì nói: “Anh cũng là một trong số họ.” Nhưng Phi-e-rơ nói: “Này anh, tôi không phải.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể nói rõ hơn: “Tôi không phải là một trong số họ.” Tiếng Hy Lạp chỉ viết “tôi không phải,” còn bổ ngữ được hiểu từ lời nói trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Một lát sau
  rationale: Diễn đạt tự nhiên một khoảng thời gian ngắn đã trôi qua, sát với thành ngữ Hy Lạp.
- source_word: ἕτερος
  choice: một người khác
  rationale: Danh từ hóa tính từ để chỉ một người khác trong số những người có mặt; tiếng Việt cần nêu rõ 'người' cho tự nhiên.
- source_word: ἰδὼν αὐτὸν
  choice: thấy ông thì
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề hoàn cảnh tự nhiên trong tiếng Việt, với 'ông' chỉ Phi-e-rơ.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Anh cũng là một trong bọn họ
  rationale: Diễn đạt đúng ý thuộc về nhóm người đang bị nhắc đến; 'bọn họ' giữ sắc thái quy chiếu đến nhóm ấy mà không xác định thêm.
- source_word: Ἄνθρωπε
  choice: Này anh
  rationale: Giữ lời gọi trực tiếp và giọng đáp đột ngột; tự nhiên hơn cách dịch sát chữ 'Hỡi người' trong tiếng Việt hiện đại.
- source_word: οὐκ εἰμί
  choice: tôi không phải
  rationale: Giữ nguyên lối nói tỉnh lược của nguyên văn, trong đó bổ ngữ 'một trong bọn họ' được hiểu từ lời buộc tội trước.
theological_decisions: []
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ được chọn theo tương quan hội thoại: người tố cáo gọi Phi-e-rơ là “anh,” còn lời kể dùng “ông.”'
