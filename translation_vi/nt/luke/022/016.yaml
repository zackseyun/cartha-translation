  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: vi
  text: Vì tôi nói với anh em rằng tôi sẽ nhất định không ăn lễ ấy[b] cho đến khi lễ ấy được ứng nghiệm trong vương quốc Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “tôi sẽ không bao giờ ăn lễ ấy nữa cho đến khi lễ ấy được ứng nghiệm trong vương quốc Đức Chúa Trời.” Nguyên văn nhấn mạnh mạnh mẽ sự phủ định về việc ăn trong tương lai; từ “nữa” có thể được suy ra từ ngữ cảnh nhưng không được nói rõ trong tiếng Hy Lạp.'
    reason: lexical_alternative
  - marker: b
    text: “Lễ ấy” chỉ về lễ Vượt Qua vừa được nhắc đến ở câu trước; có thể hiểu là bữa ăn hoặc việc cử hành lễ Vượt Qua.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với anh em
  rationale: Giữ liên từ giải thích γάρ bằng “Vì” và chuyển công thức nói năng sang tiếng Việt tự nhiên, trang trọng.
- source_word: οὐ μὴ φάγω
  choice: tôi chắc chắn sẽ không ăn ... nữa
  rationale: οὐ μή với động từ giả định aorist nhấn mạnh sự phủ định trong tương lai. “Chắc chắn sẽ không” thể hiện sức nhấn; “nữa” được làm rõ là yếu tố hàm ẩn theo ngữ cảnh và được chú thích vì không có từ tương ứng riêng trong Hy Lạp.
- source_word: αὐτό
  choice: lễ ấy
  rationale: Đại từ trung tính số ít chỉ về lễ Vượt Qua ở câu trước. Tiếng Việt khó dùng “nó” một cách trang trọng và rõ nghĩa ở đây; “lễ ấy” nhận diện tiền ngữ mà không thu hẹp dứt khoát thành riêng bữa ăn.
- source_word: ἕως ὅτου
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên giới hạn thời gian của cụm từ Hy Lạp.
- source_word: πληρωθῇ
  choice: được ứng nghiệm
  rationale: Dạng bị động của πληρόω mang ý nghĩa đạt tới sự hoàn tất hay ứng nghiệm; “được ứng nghiệm” giữ sắc thái lịch sử cứu chuộc quen thuộc mà không giải thích cơ chế ứng nghiệm.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: trong vương quốc Đức Chúa Trời
  rationale: “Vương quốc” giữ được hình ảnh về quyền trị vì và lãnh vực cai trị; “Đức Chúa Trời” là cách gọi trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Đối tượng của αὐτό
  choice: Dịch là “lễ ấy”, chỉ về lễ Vượt Qua vừa được nhắc đến.
  alternative: “bữa ăn ấy” hoặc “lễ Vượt Qua ấy”
  rationale: Ngữ cảnh xác định lễ Vượt Qua, nhưng có thể bao hàm cả bữa ăn lẫn việc cử hành. “Lễ ấy” giữ độ rộng của tiền ngữ tốt hơn cách thu hẹp thành “bữa ăn”.
- issue: Ý nghĩa của “được ứng nghiệm trong vương quốc Đức Chúa Trời”
  choice: Giữ nguyên ngôn ngữ ứng nghiệm mang tính cánh chung mà không xác định ứng nghiệm diễn ra theo cách nào.
  alternative: Được ứng nghiệm khi vương quốc Đức Chúa Trời đến, hoặc trong yến tiệc Đấng Mê-si.
  rationale: Bản Hy Lạp không nêu rõ cơ chế hay biến cố cụ thể, nên bản dịch không áp đặt một cách giải thích thần học hẹp hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “tôi—anh em” phù hợp lời trực tiếp của Đức Giê-su với các môn đồ. Tránh giải nghĩa quá mức cụm từ mang tính cánh chung.
