revisions:
- from: Vì tôi nói với anh em rằng tôi chắc chắn sẽ không ăn lễ ấy nữa[a] cho đến khi lễ ấy được ứng nghiệm trong vương quốc Đức Chúa Trời[b].
  to: Vì tôi nói với anh em rằng tôi sẽ nhất định không ăn lễ ấy[b] cho đến khi lễ ấy được ứng nghiệm trong vương quốc Đức Chúa Trời.[a]
  rationale: Bản sửa loại bỏ sự bổ sung diễn giải “nữa” khỏi thân bài để bảo toàn mức độ minh thị của nguyên văn, đồng thời giữ lựa chọn này trong chú thích như một cách hiểu theo ngữ cảnh. Dấu chú thích về tiền ngữ của “lễ ấy” được đặt sát cụm từ mà nó giải thích. Cấu trúc cánh chung “được ứng nghiệm trong vương quốc Đức Chúa Trời” được giữ nguyên, không áp đặt cơ chế ứng nghiệm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:03Z'
review_pass:
  verdict: revise
  source_fidelity: Cần bỏ “nữa” khỏi thân bài. Οὐ μή φάγω nhấn mạnh sự phủ định dứt khoát về hành động ăn trong tương lai, nhưng “nữa/lại” không được phát biểu trong tiếng Hy Lạp; nó chỉ có thể được suy ra từ ngữ cảnh. Bản sửa vẫn giữ αὐτό là “lễ ấy” và giữ sự mơ hồ hợp lý giữa bữa ăn và việc cử hành lễ Vượt Qua.
  naturalness: “Vì tôi nói với anh em rằng” và “được ứng nghiệm trong vương quốc Đức Chúa Trời” là văn phong Kinh Thánh trang trọng nhưng vẫn hiểu được trong tiếng Việt hiện đại. Việc lặp “lễ ấy” phản ánh đại từ αὐτό và giúp câu rõ nghĩa.
  terminology: “Đức Chúa Trời,” “vương quốc,” và “được ứng nghiệm” phù hợp với ngữ vực Kinh Thánh Tin Lành hiện đại. Không nên biến “trong vương quốc” thành một giải thích như “khi vương quốc đến.”
  issues:
