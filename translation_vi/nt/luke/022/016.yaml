  - severity: low
    issue: Chú thích a hiện giải thích lựa chọn đã được đưa vào thân bài
    rationale: Sau khi bỏ “nữa,” chú thích cần được viết lại thành phương án dịch thay thế, nêu rằng một số bản dịch thêm “nữa/lại” theo ngữ cảnh.
