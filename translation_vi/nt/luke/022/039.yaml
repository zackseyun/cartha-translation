id: LUK.22.39
reference: Luke 22:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: vi
  text: Rồi Ngài đi ra và theo lệ thường đi đến Núi Ô-liu; các môn đệ cũng đi theo Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: đi ra
  rationale: Phân từ bất định quá khứ của ἐξέρχομαι diễn tả hành động đi ra trước hoặc gắn liền với động từ chính; cách dịch này tự nhiên và không thêm địa điểm không có trong câu.
- source_word: ἐπορεύθη
  choice: đến
  rationale: Trong kết cấu có đích đến với εἰς, πορεύομαι được diễn đạt tự nhiên bằng “đến”, tránh lặp cứng “đi ra và đi” trong tiếng Việt.
- source_word: κατὰ τὸ ἔθος
  choice: theo lệ thường
  rationale: Giữ sát ý về một thông lệ quen thuộc mà không thêm đại từ sở hữu “của Ngài”, vốn không được nói rõ trong cụm từ Hy Lạp.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: đến núi Ô-liu
  rationale: Dùng địa danh Kinh Thánh quen thuộc trong tiếng Việt cho Mount of Olives.
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: Diễn đạt cả chuyển động thực tế lẫn quan hệ các môn đồ theo Ngài, phù hợp với nghĩa thông thường của ἀκολουθέω.
- source_word: οἱ μαθηταί
  choice: các môn đồ
  rationale: Dùng thuật ngữ trang trọng, quen thuộc và không thêm từ sở hữu không có trong nguyên văn.
- source_word: καὶ ... δὲ ... καὶ
  choice: Rồi ...; ... cũng
  rationale: “Rồi” nối tiếp mạch kể, dấu chấm phẩy thể hiện sự tiếp diễn nhẹ của δέ, còn “cũng” giữ lực bổ sung của καί trước “các môn đồ”.
theological_decisions:
- issue: Có nên nói rõ đây là lệ thường của Đức Chúa Jêsus hay không
  choice: Giữ “theo lệ thường” mà không thêm “của Ngài”
  alternative: theo lệ thường của Ngài / như thường lệ của Ngài
  rationale: Ngữ cảnh cho thấy chủ thể là Đức Chúa Jêsus, nhưng κατὰ τὸ ἔθος không có đại từ sở hữu; bản dịch giữ độ hàm ẩn của nguyên văn.
- issue: Cách biểu thị chủ thể bị lược trong tiếng Hy Lạp
  choice: Dùng “Ngài” theo ngữ cảnh
  alternative: Đức Chúa Jêsus
  rationale: Tiếng Việt cần chủ thể rõ ràng hơn, còn câu trước đã xác lập Đức Chúa Jêsus; “Ngài” duy trì mạch văn mà không thêm danh xưng vào chính câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể ngắn gọn; “theo lệ thường” bảo tồn sự cô đọng và không xác định sở hữu của nguyên văn.
