  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: hành động đi ra, việc đi đến Núi Ô-liu theo thông lệ, và các môn đồ/môn đệ cùng đi theo Ngài. Tuy nhiên, việc dùng “đến” ngay sau “đi ra và” làm mờ động từ di chuyển ἐπορεύθη; thêm “đi” giúp phản ánh rõ hơn động từ này mà vẫn tự nhiên.'
  naturalness: Câu hiện tại nhìn chung dễ hiểu, nhưng cụm “đi ra và theo lệ thường đến” hơi gượng trong tiếng Việt hiện đại. “Môn đệ” là cách gọi hiện đại, trung tính và phổ biến hơn “môn đồ” trong văn cảnh Kinh Thánh.
  terminology: Giữ “Ngài” theo mạch văn là phù hợp. “Núi Ô-liu” là cách viết địa danh Kinh Thánh quen thuộc; viết hoa “Núi” giúp nhận diện đây là tên riêng. Không cần thêm “của Ngài” vào “theo lệ thường”, vì nguyên văn không nêu sở hữu trong cụm này.
