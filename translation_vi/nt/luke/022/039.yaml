  - severity: low
    issue: “Các môn đồ” mang sắc thái truyền thống hơn là cách dùng hiện đại chuẩn.
    rationale: “Các môn đệ” diễn đạt μαθηταί tự nhiên, phổ biến và không thay đổi nghĩa.
