  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đáp: “Thôi, đủ rồi!” Rồi Ngài chạm vào tai người ấy và chữa lành cho người ấy.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: Thôi, đủ rồi!
  rationale: Cụm Hy Lạp có thể mang nghĩa đen gần với “hãy để đến mức này”, nhưng trong ngữ cảnh Đức Giê-su chặn hành động bạo lực đang diễn ra, câu tiếng Việt tự nhiên “Thôi, đủ rồi!” giữ được tính mệnh lệnh ngắn gọn và sắc thái chấm dứt ngay.
- source_word: ὠτίου
  choice: tai
  rationale: Dạng từ này có thể chỉ “tai” hoặc “vành tai”; bản văn ở đây không cần xác định chi tiết giải phẫu hơn.
- source_word: ἰάσατο
  choice: chữa lành
  rationale: Diễn đạt trực tiếp hành động chữa trị và phục hồi trong nguyên văn.
theological_decisions:
- issue: Đối tượng của mệnh lệnh Ἐᾶτε ἕως τούτου
  choice: Giữ câu nói ngắn, không nêu rõ Đức Giê-su đang nói với môn đồ hay nhóm đến bắt Ngài
  alternative: Diễn giải thành “Hãy để họ làm vậy!” hoặc “Đừng làm thế nữa!”
  rationale: Nguyên văn không xác định tường minh người nghe hay chính xác điều được phép/chấm dứt; bản dịch tránh giải quyết sự mơ hồ bằng cách thêm đối tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ kính trọng “Ngài”; câu nói trực tiếp ngắn, mạnh, phù hợp tình huống khẩn cấp.
