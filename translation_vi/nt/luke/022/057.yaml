base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: vi
  text: 'Nhưng ông chối, nói rằng: “Tôi không biết người ấy, bà ạ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: chối điều đó
  rationale: Động từ có nghĩa là phủ nhận hoặc chối bỏ. Bản Hy Lạp không nêu tân ngữ; trong ngữ cảnh, điều Phi-e-rơ phủ nhận là lời quả quyết vừa được người phụ nữ đưa ra. Thêm “điều đó” giúp câu tiếng Việt tự nhiên mà không xác định tân ngữ là chính Chúa Giê-su.
- source_word: λέγων
  choice: và nói
  rationale: Phân từ hiện tại giới thiệu nội dung lời chối. “Và nói” tự nhiên trong tiếng Việt và diễn đạt rõ quan hệ với động từ chính.
- source_word: Οὐκ οἶδα
  choice: tôi không biết
  rationale: Diễn đạt trực tiếp động từ chỉ sự biết khi bị phủ định, với giọng văn hiện đại và trang nghiêm.
- source_word: αὐτόν
  choice: người ấy
  rationale: Đại từ giống đực số ít chỉ về Chúa Giê-su. “Người ấy” giữ nguyên tính chất đại từ và tự nhiên hơn “ông ấy” trong lời phủ nhận này; không mở rộng thành “người này” hay nêu danh tính.
- source_word: γύναι
  choice: này bà
  rationale: Đây là danh từ ở hô cách, trực tiếp gọi một phụ nữ. “Này bà” thể hiện chức năng xưng hô trong tiếng Việt; không thêm sắc thái lịch thiệp hơn mức nguyên văn như “thưa bà”.
theological_decisions:
- issue: Có nên thêm tân ngữ rõ ràng cho lời chối của Phi-e-rơ hay không
  choice: Dùng “chối điều đó” để chỉ lời quả quyết mà ông đang phủ nhận.
  alternative: “ông chối và nói” hoặc “ông chối người ấy và nói”
  rationale: Nguyên văn không có tân ngữ cho ἠρνήσατο. Tiếng Việt có thể bỏ tân ngữ nhưng câu sẽ hơi gượng; “điều đó” làm rõ tân ngữ ngầm mà không biến câu thành lời tuyên bố trực tiếp chối bỏ chính Chúa Giê-su.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Trật tự câu được điều chỉnh để lời gọi “này bà” đứng tự nhiên ở đầu câu nói trực tiếp. Đại từ “ông” chỉ Phi-e-rơ theo lối thuật chuyện kính trọng vừa phải.
