id: LUK.22.47
reference: Luke 22:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: vi
  text: Khi Đức Giê-su còn đang nói, kìa, một đám đông kéo đến. Người tên Giu-đa, một trong Nhóm Mười Hai, đi trước họ[a]. Người ấy đến gần Đức Giê-su để hôn Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn đường cho họ” hoặc “đi đầu đoàn người.”'
    reason: Động từ προέρχομαι với đại từ làm bổ ngữ ở đây trước hết chỉ việc đi trước; trong ngữ cảnh, nó cũng có thể hàm ý Giu-đa dẫn đoàn người.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Khi Đức Giê-su còn đang nói
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hành động đang tiếp diễn đồng thời với sự việc sau đó. Nêu rõ Đức Giê-su thay cho đại từ giúp câu đứng riêng vẫn sáng nghĩa trong tiếng Việt.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động, bất ngờ của lời kể.
- source_word: ὄχλος
  choice: một đám đông kéo đến
  rationale: ὄχλος là một đám đông. Động từ “kéo đến” được bổ sung theo lối diễn đạt tự nhiên của tiếng Việt, phù hợp với sự xuất hiện và chuyển động của đoàn người trong ngữ cảnh.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: Người được gọi là Giu-đa
  rationale: Bám sát cấu trúc phân từ dùng để nhận diện Giu-đa, không thêm sắc thái miệt thị như “kẻ gọi là”.
- source_word: εἷς τῶν δώδεκα
  choice: một trong Nhóm Mười Hai
  rationale: Giữ cách gọi quen thuộc dành cho nhóm môn đồ đặc biệt này và sức nặng trớ trêu của việc Giu-đa thuộc về nhóm ấy, nhưng không thêm danh xưng “sứ đồ” vốn không có trong câu.
- source_word: προήρχετο αὐτούς
  choice: đi trước họ
  rationale: Giữ nghĩa trực tiếp của việc đi phía trước đoàn người và sắc thái đang diễn tiến của thì chưa hoàn thành; không khẳng định quá mức rằng Giu-đa là người chỉ huy, dù ý dẫn đường có thể được hàm chứa.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Ông ta đến gần Đức Giê-su
  rationale: Diễn đạt tự nhiên hành động tiến đến gần Đức Giê-su. “Ông ta” giúp nối rõ chủ thể là Giu-đa mà không thêm lời kết án.
- source_word: φιλῆσαι αὐτόν
  choice: để hôn ngài
  rationale: Giữ nghĩa đơn giản của φιλέω trong ngữ cảnh là hôn; không đưa lời giải thích về ý nghĩa phản bội vào chính câu dịch.
theological_decisions:
- issue: Cách trình bày hành động của Giu-đa
  choice: Chỉ thuật lại việc Giu-đa đến gần để hôn Đức Giê-su.
  alternative: “để dùng nụ hôn phản bội ngài” hoặc “để phản bội ngài bằng một nụ hôn”
  rationale: Ngữ cảnh rộng hơn cho biết đây là hành động phản bội, nhưng câu Hy Lạp tại đây chỉ nói Giu-đa đến gần để hôn Đức Giê-su. Bản dịch không đưa phần diễn giải đạo đức hoặc thần học vào câu.
- issue: Tư cách của Giu-đa trong εἷς τῶν δώδεκα
  choice: “một trong Nhóm Mười Hai”
  alternative: “một trong mười hai sứ đồ”
  rationale: Nguyên văn chỉ nói “một trong mười hai”. Cách dịch đã chọn giữ sự nhận diện đặc biệt của nhóm nhưng không bổ sung danh xưng không xuất hiện trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” giữ nét sống động của lời kể; “Nhóm Mười Hai” được viết hoa như một danh xưng tập thể. Đại từ “ngài” dành cho Đức Giê-su thể hiện sự tôn kính theo lối dùng phổ biến mà không làm thay đổi nội dung nguyên văn.
