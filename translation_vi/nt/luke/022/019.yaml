reference: Luke 22:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: vi
  text: 'Rồi Ngài lấy bánh, dâng lời tạ ơn, bẻ ra và trao cho họ, nói: “Đây là thân thể Ta[c][a], được ban vì các con[b]. Hãy tiếp tục làm điều này để tưởng nhớ Ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có phần: “được ban vì các con. Hãy tiếp tục làm điều này để tưởng nhớ Ta.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “đang được ban vì các con.”'
    reason: lexical_alternative
  - marker: c
    text: Cụm “Đây là thân thể Ta” được dịch sát theo cách viết của bản Hy Lạp. Có người hiểu là “Đây tượng trưng cho thân thể Ta”, nhưng chính bản Hy Lạp dùng từ “là”.
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: lấy bánh
  rationale: Diễn đạt tự nhiên chuỗi hành động của phân từ aorist và giữ nghĩa trực tiếp của ἄρτος là “bánh” trong bối cảnh bữa ăn.
- source_word: εὐχαριστήσας
  choice: dâng lời tạ ơn
  rationale: Thể hiện hành động tạ ơn xảy ra trước khi bẻ bánh; không thêm tân ngữ “Đức Chúa Trời” khi bản Hy Lạp không nêu rõ.
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: bẻ ra và trao cho họ
  rationale: “Bẻ ra” là cách nói tự nhiên về bánh; “trao cho họ” truyền đạt rõ người nhận, còn vật được trao đã rõ từ ngữ cảnh.
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Đây là thân thể Ta
  rationale: Giữ nguyên cấu trúc hệ từ ἐστιν là “là”, không diễn giải thành “tượng trưng cho” hay “có nghĩa là”, nhờ đó không giải quyết thay bản văn một tranh luận thần học.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: được ban vì các con
  rationale: Chuyển cấu trúc mạo từ–phân từ thành mệnh đề quan hệ tự nhiên. “Vì” giữ được nghĩa vì lợi ích/thay cho mà không ấn định quá mức sắc thái của ὑπέρ; “được ban” bảo tồn thể bị động và sắc thái hiến trao.
- source_word: τοῦτο ποιεῖτε
  choice: Hãy tiếp tục làm điều này
  rationale: Thể hiện sức liên tục hoặc lặp lại của mệnh lệnh hiện tại ποιεῖτε trong bối cảnh thiết lập một thực hành.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: để tưởng nhớ Ta
  rationale: Diễn đạt hành động chủ động nhớ đến và kỷ niệm, bằng tiếng Việt hiện đại, rõ ràng, không tạo sắc thái tang lễ mà “lễ tưởng niệm” có thể gợi ra.
theological_decisions:
- issue: Ý nghĩa của câu “Đây là thân thể Ta” trong bối cảnh Tiệc Thánh
  choice: Giữ nguyên “Đây là thân thể Ta”.
  alternative: “Đây tượng trưng cho thân thể Ta” hoặc “Đây có nghĩa là thân thể Ta”.
  rationale: Bản Hy Lạp dùng hệ từ “là”; bản dịch không nên tự quyết định cuộc tranh luận về bản chất của bánh bằng một cách diễn giải giáo phái.
- issue: Tình trạng văn bản của phần dài trong Lu-ca 22:19
  choice: Đưa phần “được ban vì các con. Hãy tiếp tục làm điều này để tưởng nhớ Ta” vào chính văn và chú thích dị bản.
  alternative: Kết thúc câu sau “Đây là thân thể Ta”.
  rationale: SBLGNT cung cấp phần dài trong dấu ngoặc phê bình văn bản; vì vậy giữ trong chính văn làm bản đọc làm việc, đồng thời minh bạch ghi nhận bản đọc ngắn hơn.
- issue: Sắc thái của ὑπέρ
  choice: Dịch là “vì các con”.
  alternative: “thay cho các con” hoặc “cho các con”.
  rationale: “Vì” cho phép cả sắc thái vì lợi ích và sắc thái đại diện/thay thế trong ngữ cảnh, không thu hẹp một cách không cần thiết ý nghĩa thần học của giới từ.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài/Ta/các con” theo lối xưng hô Kinh Thánh quen thuộc giữa Chúa Giê-su và các môn đồ; tránh thuật ngữ phụng vụ chuyên biệt không có trong câu Hy Lạp. Dấu chú thích được đặt ngay sau nội dung liên quan; chú thích [a] đặt cuối lời phán vì dị bản bao trùm cả hai mệnh đề cuối.
