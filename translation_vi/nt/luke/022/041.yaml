  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: vi
  text: Ngài rời khỏi họ chừng một tầm ném đá[a], rồi quỳ xuống[b] cầu nguyện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cách họ chừng một khoảng bằng tầm ném đá.”
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “đặt đầu gối xuống,” nghĩa là “quỳ xuống.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: rời họ
  rationale: Dạng bị động có thể dịch sát là “bị tách ra”, nhưng trong ngữ cảnh động từ diễn tả việc Chúa Giê-su chủ động tách khỏi các môn đồ; “rời họ” tự nhiên và không làm mất ý chuyển ra xa.
- source_word: ὡσεὶ λίθου βολήν
  choice: đi xa chừng một tầm ném đá
  rationale: Cụm này chỉ khoảng cách ước chừng bằng tầm một viên đá được ném đi. “Chừng” giữ sắc thái xấp xỉ của ὡσεὶ, còn “một tầm ném đá” là cách nói gọn, dễ hiểu trong tiếng Việt.
- source_word: θεὶς τὰ γόνατα
  choice: quỳ xuống
  rationale: Nghĩa sát là “đặt hai đầu gối xuống”, một thành ngữ chỉ tư thế quỳ. “Quỳ xuống” diễn đạt rõ động tác và tự nhiên trong tiếng Việt hiện đại.
- source_word: προσηύχετο
  choice: cầu nguyện
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn. Trong chuỗi kể tiếng Việt, “và cầu nguyện” tự nhiên; không thêm “bắt đầu” vì nguyên văn không xác định rõ sắc thái khởi đầu.
- source_word: αὐτὸς
  choice: Ngài
  rationale: Đại từ có chút nhấn mạnh vào chính Chúa Giê-su, nhưng tiếng Việt không cần thêm “chính Ngài” ở đây. “Ngài” duy trì quy chiếu rõ ràng và giọng văn trang trọng.
- source_word: καὶ
  choice: rồi; và
  rationale: Hai liên từ καὶ nối các hành động trong trình tự kể chuyện. “Rồi” thể hiện diễn tiến mà không thêm quan hệ nhân quả, còn “và” nối tư thế với hành động cầu nguyện.
theological_decisions:
- issue: Tư thế cầu nguyện và cách khắc họa Chúa Giê-su
  choice: Dịch trực tiếp việc Chúa Giê-su rời các môn đồ, quỳ xuống và cầu nguyện, không thêm diễn giải thần học hay cảm xúc.
  alternative: Thêm ngôn ngữ sùng kính hoặc giải thích ý nghĩa thần học của việc Ngài quỳ cầu nguyện.
  rationale: Câu này chỉ thuật lại hành động, khoảng cách, tư thế và việc cầu nguyện của Chúa Giê-su. Bản dịch cần giữ sự trang nghiêm của cảnh mà không bổ sung điều nguyên văn không nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo văn phong Kinh Thánh tiếng Việt; giữ hình ảnh đo khoảng cách bằng tầm ném đá và diễn đạt thành ngữ về đầu gối bằng động từ tự nhiên “quỳ xuống”. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ tương ứng.
