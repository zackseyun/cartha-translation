  source_fidelity: Bản dịch truyền đạt đúng trình tự thuật chuyện của δέ và ἦλθεν, giữ số ít của “ngày,” đồng thời diễn đạt phù hợp quan hệ thời gian của ᾗ. “Người ta phải dâng sinh tế Vượt Qua” phản ánh tốt tính vô nhân xưng tất yếu của ἔδει và sắc thái tế tự của θύεσθαι. Cách dùng “sinh tế Vượt Qua” trong văn cảnh này làm rõ đối tượng được tế lễ mà không buộc bản văn phải xác định riêng là chiên.
  naturalness: Câu tiếng Việt hiện đại, rõ nghĩa và có giọng văn Kinh Thánh trang trọng nhưng không cổ. “Bấy giờ” nối mạch tự sự tự nhiên; cấu trúc “là ngày...” diễn đạt trôi chảy ý “vào ngày mà.”
  terminology: “Bánh Không Men” và “Vượt Qua” là các thuật ngữ quen thuộc, nhất quán cho các kỳ lễ Do Thái. “Sinh tế” phù hợp văn cảnh hiến tế. Chú thích nêu đúng các khả năng ngữ nghĩa của πάσχα trong kết hợp với θύεσθαι.
