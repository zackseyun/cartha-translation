  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: vi
  text: Bấy giờ, ngày lễ Bánh Không Men đã đến, là ngày người ta phải dâng sinh tế Vượt Qua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chiên Vượt Qua” hoặc “con vật hiến tế trong lễ Vượt Qua.” Từ Hy Lạp có thể chỉ lễ Vượt Qua hoặc, như trong văn cảnh này, vật được hiến tế trong lễ ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: đã đến
  rationale: Động từ ở thì aorist được dùng theo nghĩa ngày hay thời điểm đã đến; cách dịch này tự nhiên và giữ đúng sắc thái thời gian.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ đánh dấu bước tiến trong trình thuật; “Bấy giờ” nối mạch tự nhiên mà không nhấn mạnh quan hệ đối lập.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: ngày lễ Bánh Không Men
  rationale: Giữ danh từ “ngày” ở số ít, đồng thời diễn đạt rõ đây là ngày thuộc kỳ lễ Do Thái gắn với bánh không men.
- source_word: ᾗ
  choice: là ngày
  rationale: Diễn đạt tự nhiên quan hệ hồi chỉ và ý nghĩa thời gian của đại từ quan hệ ở cách dữ liệu.
- source_word: ἔδει
  choice: người ta phải
  rationale: Truyền đạt tính bắt buộc theo lịch nghi lễ của động từ vô nhân xưng, đồng thời cung cấp chủ thể chung tự nhiên trong tiếng Việt cho động từ bị động Hy Lạp.
- source_word: θύεσθαι
  choice: dâng sinh tế
  rationale: Trong bối cảnh nghi lễ, θύω chỉ việc giết con vật để hiến tế. “Dâng sinh tế” nêu rõ chiều kích tế lễ mà không chỉ mô tả việc giết mổ.
- source_word: τὸ πάσχα
  choice: sinh tế Vượt Qua
  rationale: Trong kết hợp với θύεσθαι, πάσχα chỉ vật hiến tế của lễ Vượt Qua; cách dịch này tự nhiên trong tiếng Việt nhưng không thu hẹp thành “chiên” ngay trong chính văn.
theological_decisions:
- issue: Đối tượng được chỉ bởi τὸ πάσχα trong bối cảnh hiến tế
  choice: Dịch “sinh tế Vượt Qua” trong chính văn.
  alternative: “chiên Vượt Qua” hoặc “con vật hiến tế trong lễ Vượt Qua”
  rationale: Động từ θύεσθαι cho thấy rõ đối tượng là vật hiến tế, nhưng bản thân πάσχα có phạm vi nghĩa rộng hơn riêng “chiên.” “Sinh tế Vượt Qua” giữ được ý nghĩa nghi lễ mà không âm thầm thu hẹp đối tượng; các cách hiểu cụ thể hơn được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “lễ Bánh Không Men” và “Vượt Qua” như tên các kỳ lễ Do Thái; cấu trúc câu giữ diễn tiến kể chuyện và sự liên hệ giữa ngày lễ với yêu cầu hiến tế.
