id: LUK.22.10
reference: Luke 22:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Này, khi các anh vào thành, một người đàn ông mang một vò nước sẽ gặp các anh.[a] Hãy đi theo người ấy vào ngôi nhà mà người ấy bước vào.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp κεράμιον có thể chỉ cụ thể một vật chứa bằng đất nung; vì thế cũng có thể dịch là “một vò đất nung đựng nước.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Này
  rationale: Dùng từ gọi sự chú ý tự nhiên, trang trọng vừa phải trong tiếng Việt hiện đại, giữ chức năng chỉ dẫn của nguyên ngữ mà không mang sắc thái cổ quá mức.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: khi các anh vào thành
  rationale: Diễn đạt cấu trúc sở hữu cách tuyệt đối theo nghĩa thời gian; “khi” tự nhiên và giữ sự việc xảy ra lúc họ vào thành.
- source_word: συναντήσει ὑμῖν
  choice: sẽ gặp các anh
  rationale: Chuyển tương lai chủ động với bổ ngữ gián tiếp thành cách nói tự nhiên, trực tiếp trong tiếng Việt.
- source_word: ἄνθρωπος
  choice: một người đàn ông
  rationale: Ngữ cảnh chỉ một cá nhân nam cụ thể; cách dịch này chính xác về giới tính và rõ nghĩa.
- source_word: κεράμιον ὕδατος
  choice: một vò nước
  rationale: “Vò nước” là cách nói gọn, tự nhiên về một vật chứa nước; chi tiết vật liệu bằng đất nung có thể có trong κεράμιον được giữ ở chú thích để tránh diễn giải quá mức trong chính văn.
- source_word: βαστάζων
  choice: mang
  rationale: Diễn tả hành động đang thực hiện một cách tự nhiên trong tiếng Việt.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Hãy đi theo người ấy
  rationale: Giữ lực mệnh lệnh trực tiếp của động từ aorist và tránh lặp đại từ thiếu rõ ràng.
- source_word: οἰκίαν
  choice: ngôi nhà
  rationale: Giữ nghĩa cụ thể của οἰκία trong ngữ cảnh chỉ phương hướng.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: mà người ấy bước vào
  rationale: Mệnh đề quan hệ xác định đúng ngôi nhà, đồng thời giữ sắc thái chuyển động vào bên trong của εἰσπορεύεται.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Ngài” cho nhân vật đang nói theo mạch văn, “các anh” cho nhóm môn đồ nam, và “người ấy” để tránh đại từ mơ hồ. Mọi dấu chú thích trong chính văn đều có chú thích tương ứng.
