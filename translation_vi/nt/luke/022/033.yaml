base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: vi
  text: 'Nhưng ông nói với Ngài: “Lạy Chúa, tôi sẵn sàng đi với Ngài, cả vào tù lẫn chịu chết.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Nhưng ông
  rationale: Mạo từ được dùng như đại từ, chỉ Phi-e-rơ; δέ tạo sự tương phản nhẹ với lời Đức Chúa Jêsus vừa nói.
- source_word: εἶπεν αὐτῷ
  choice: thưa với Ngài
  rationale: Trong lời thuật, “thưa” diễn đạt tự nhiên thái độ kính trọng của Phi-e-rơ khi nói với Đức Chúa Jêsus; “Ngài” giữ nguyên đại từ quy chiếu mà không đưa tên riêng vào câu.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Trong lời xưng hô trực tiếp, “Lạy Chúa” vừa tự nhiên, trang trọng, vừa giữ được sức nặng tước hiệu của κύριος.
- source_word: μετὰ σοῦ
  choice: với Ngài
  rationale: μετά với sở hữu cách biểu thị sự đồng hành; “với Ngài” là cách diễn đạt gọn và chính xác.
- source_word: ἕτοιμός εἰμι
  choice: con sẵn sàng
  rationale: Cụm từ nói lên sự chuẩn bị và quyết tâm. Đại từ “con” phù hợp với lời trực tiếp mở đầu bằng “Lạy Chúa” và thể hiện quan hệ kính trọng.
- source_word: καὶ ... καὶ
  choice: dù ... hay
  rationale: Trong tiếng Việt, cấu trúc này diễn đạt tự nhiên hai viễn cảnh song song mà Phi-e-rơ tuyên bố sẵn lòng cùng trải qua, không làm mất phạm vi bao quát của cặp καί.
- source_word: εἰς φυλακὴν
  choice: vào tù
  rationale: φυλακή ở đây chỉ cảnh giam cầm; εἰς mang hướng chuyển động, được thể hiện tự nhiên bằng “vào tù”.
- source_word: εἰς θάνατον
  choice: đến chỗ chết
  rationale: Cách dịch giữ hướng đích của εἰς và sự song song với “vào tù”, đồng thời diễn đạt tự nhiên ý sẵn lòng đi cho tới cái chết.
- source_word: πορεύεσθαι
  choice: đi
  rationale: Động từ nguyên mẫu bổ nghĩa cho “sẵn sàng”, chỉ việc cùng đi hoặc cùng bước vào những điều sắp xảy đến; “đi” là tương đương tự nhiên nhất.
theological_decisions:
- issue: Cách dịch κύριος khi Phi-e-rơ xưng hô với Đức Chúa Jêsus
  choice: Chúa
  alternative: Thầy
  rationale: “Chúa” giữ được cả sắc thái tôn kính lẫn sức nặng thần học của tước hiệu, mà không khẳng định thêm điều vượt quá văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” trong lời kể để chỉ Phi-e-rơ, “Ngài” cho Đức Chúa Jêsus, và “con” trong lời Phi-e-rơ thưa với Chúa. Không cần chú thích vì câu không có dị bản hay điểm mơ hồ cần đưa ra ngoài chính văn.
