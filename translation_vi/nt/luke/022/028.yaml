id: LUK.22.28
reference: Luke 22:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: vi
  text: Còn anh em là những người đã luôn ở bên tôi trong những thử thách của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong những cám dỗ của tôi” hoặc “trong những lần tôi bị thử nghiệm”. Từ Hy Lạp có thể chỉ cám dỗ, thử thách hoặc sự thử nghiệm; ở đây, từ này có lẽ nói đến những gian nan Chúa Giê-su đã trải qua.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: anh em
  rationale: Đại từ số nhiều đứng đầu câu để nhấn mạnh. “Anh em” là cách xưng hô tự nhiên, trang trọng vừa phải của Chúa Giê-su với nhóm môn đồ; cấu trúc “anh em là những người” giữ được sắc thái nhấn mạnh.
- source_word: δέ
  choice: Còn
  rationale: Đánh dấu sự tương phản với lời ngay trước đó. “Còn” chuyển ý tự nhiên trong tiếng Việt mà không làm sự đối lập mạnh quá mức.
- source_word: οἱ διαμεμενηκότες
  choice: những người đã luôn ở
  rationale: Phân từ hoàn thành có mạo từ chỉ một nhóm người được nhận diện bởi việc kiên trì ở lại cho đến thời điểm nói. “Đã luôn ở” diễn đạt sự tiếp diễn và kết quả hiện tại một cách tự nhiên.
- source_word: μετ’ ἐμοῦ
  choice: bên tôi
  rationale: Diễn đạt sự đồng hành và gắn bó; trong tiếng Việt, “ở bên tôi” tự nhiên hơn “ở với tôi” trong ngữ cảnh cùng trải qua gian khó.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: trong những thử thách của tôi
  rationale: πειρασμός có thể chỉ sự thử thách, thử nghiệm hoặc cám dỗ. Ở đây, “thử thách” phù hợp nhất với những gian nan Chúa Giê-su đã trải qua, đồng thời chú thích giữ lại phạm vi nghĩa rộng của từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của πειρασμοῖς khi nói về Chúa Giê-su
  choice: những thử thách Chúa Giê-su trải qua
  alternative: những cám dỗ hoặc sự thử nghiệm Chúa Giê-su trải qua
  rationale: Mạch văn nhấn mạnh việc các môn đồ ở bên Chúa Giê-su giữa những gian nan và chống đối trong chức vụ. Tuy vậy, vì từ Hy Lạp cũng có thể mang nghĩa “cám dỗ” hoặc “thử nghiệm”, chú thích bảo tồn độ mở ngữ nghĩa và không phủ nhận các phương diện ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, tự nhiên và trang nghiêm. Dùng “anh em” cho lời Chúa Giê-su nói với các môn đồ và “tôi” theo lối kể trực tiếp dễ hiểu; tránh từ ngữ giáo phái. Cụm “đã luôn ở bên” truyền đạt sự kiên trì đồng hành mà không nặng tính cổ văn.
