  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói: “Này anh, tôi không biết anh đang nói gì.” Ngay lập tức, khi ông vẫn còn đang nói, một con gà trống gáy.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với lời cáo buộc ngay trước đó và tiếp nối chuỗi chối nhận.
- source_word: Ἄνθρωπε
  choice: Này anh
  rationale: Lời gọi trực tiếp một người nam; cách dịch này giữ sắc thái thẳng, không trang trọng quá mức, đồng thời tự nhiên hơn lối dịch từng chữ “Hỡi người” trong tiếng Việt hiện đại.
- source_word: οὐκ οἶδα
  choice: tôi không biết
  rationale: Diễn đạt trực tiếp động từ οἶδα ở nghĩa hiện tại, giữ nguyên lời phủ nhận của Phi-e-rơ.
- source_word: ὃ λέγεις
  choice: anh đang nói gì
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, tương ứng trực tiếp với “điều anh đang nói” mà không diễn giải thành “anh muốn nói gì”.
- source_word: παραχρῆμα
  choice: Ngay lúc
  rationale: Kết hợp với mệnh đề đồng thời theo sau để diễn tả sự việc xảy ra tức khắc ngay khi Phi-e-rơ còn nói.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: ông còn đang nói
  rationale: Giữ rõ sự chồng lấn thời gian được nhấn mạnh bởi ἔτι và cấu trúc sở hữu cách tuyệt đối.
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: một con gà trống gáy
  rationale: Cách nói thông dụng, chính xác và tự nhiên trong tiếng Việt hiện đại.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang nghiêm nhưng dễ hiểu. Dùng “ông” trong lời trần thuật để chỉ Phi-e-rơ, còn “anh” trong lời đối đáp nhằm phản ánh lối gọi trực tiếp Ἄνθρωπε. Không thêm chú thích vì biến thể tiếng Anh “cock” chỉ là khác biệt từ vựng tiếng Anh và không tạo ra phương án dịch Việt đáng kể.
