  source_fidelity: 'Bản dịch giữ đúng các thành tố chính của câu Hy Lạp: tính lặp lại hằng ngày, sự hiện diện của Đức Giê-su trong khuôn viên đền thờ, việc những người đối diện trước đó không hành động để bắt ngài, rồi sự đối lập với “giờ” của họ và “quyền lực của bóng tối”. Tuy nhiên, “tra tay bắt tôi” không phải cách kết hợp từ tự nhiên trong tiếng Việt hiện đại. “Ra tay bắt tôi” diễn đạt rõ hành động bắt giữ trong ngữ cảnh mà không biến ẩn ngữ thành một diễn giải thần học.'
