id: LUK.22.53
reference: Luke 22:53
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: vi
  text: Hằng ngày, khi tôi ở cùng các ông trong đền thờ, các ông đã không ra tay bắt tôi[a]. Nhưng đây là giờ của các ông và quyền lực[b] của bóng tối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “giơ tay chống lại tôi”; trong văn cảnh này, thành ngữ chỉ hành động thù địch nhằm bắt giữ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “quyền hành”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Hằng ngày
  rationale: Diễn đạt tự nhiên ý phân bố và lặp lại mỗi ngày.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: khi tôi ở cùng các ông
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành mệnh đề chỉ thời gian tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ toàn khuôn viên đền thờ; cách dịch ngắn gọn này quen thuộc và không thu hẹp thành nơi thánh bên trong.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: các ông đã không tra tay bắt tôi
  rationale: Thành ngữ Hy Lạp nói theo nghĩa đen là giơ tay chống lại một người; trong văn cảnh này, hành động thù địch cụ thể là bắt giữ. “Tra tay bắt” vừa rõ nghĩa vừa giữ sắc thái hành động trực tiếp.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Nhưng đây là giờ của các ông
  rationale: Giữ hình ảnh “giờ” như thời điểm đặc biệt hoặc được định, cùng giọng điệu trang trọng của câu nguồn.
- source_word: ἐξουσία
  choice: quyền lực
  rationale: Từ này có thể chỉ thẩm quyền, quyền hành hoặc năng lực cai trị. “Quyền lực” tự nhiên trong tiếng Việt và giữ được cả chiều kích tác động lẫn thống trị trong ngữ cảnh.
- source_word: τοῦ σκότους
  choice: của bóng tối
  rationale: Giữ nguyên ẩn dụ thần học của bản nguồn, không tự ý giải thích bóng tối là một nhân vật hay hệ thống cụ thể.
theological_decisions:
- issue: Có nên nói rõ “quyền lực của bóng tối” là quyền lực của Sa-tan hoặc sự thống trị của điều ác hay không
  choice: Giữ nguyên cách nói ẩn dụ “quyền lực của bóng tối”.
  alternative: quyền lực của Sa-tan; sự thống trị của điều ác
  rationale: Bản văn nói “bóng tối” chứ không trực tiếp nêu Sa-tan hay diễn giải thành điều ác. Giữ nguyên ẩn dụ bảo toàn độ mở và sức căng thần học của câu.
- issue: Quan hệ giữa “giờ của các ông” và “quyền lực của bóng tối”
  choice: Giữ hai cụm được nối bằng “và”, không giải thích cụm sau là đồng nhất hoàn toàn với cụm trước hay chỉ cùng hoạt động trong thời điểm ấy.
  alternative: Nhưng đây là giờ của các ông—giờ quyền lực của bóng tối.
  rationale: Cấu trúc Hy Lạp súc tích và có phần căng về cú pháp. Bản dịch không nên âm thầm quyết định mức độ đồng nhất giữa hai vế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi/các ông” phù hợp lời Đức Giê-su nói với nhóm người đến bắt mình. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
