revisions:
- from: 'Nhưng Đức Giê-su nói với các thượng tế, những người chỉ huy lực lượng bảo vệ đền thờ và các trưởng lão đã đến bắt ngài: “Các ông đem gươm và gậy kéo đến như để bắt một tên cướp[a] sao?”'
  to: 'Nhưng Đức Giê-su nói với các thượng tế, các chỉ huy Đền Thờ và các trưởng lão đã đến chống lại ngài: “Các ông mang gươm và gậy kéo đến như thể đối phó với một tên cướp[a] sao?”'
  rationale: Bản sửa giảm các diễn giải không được nêu trực tiếp trong nguyên văn, phục hồi phép so sánh tu từ của câu hỏi, và rút gọn cách gọi các στρατηγοὶ τοῦ ἱεροῦ mà không mất chức năng của họ. Chú thích tiếp tục phản ánh phạm vi nghĩa tranh chấp của λῃστής.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:20Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng các thành phần chính của câu. Tuy nhiên, “đã đến bắt ngài” xác định hành động bắt giữ mạnh hơn cụm παραγενομένους ἐπ’ αὐτόν (“đã đến chống lại ngài/nhắm vào ngài”) tự nó nói; và “như để bắt” chuyển phép so sánh ὡς ἐπὶ λῃστήν thành một mệnh đề mục đích. Sửa thành “đã đến chống lại ngài” và “như thể đối phó với một tên cướp” giữ sát sắc thái chất vấn, đồng thời vẫn tự nhiên.
  naturalness: Câu sửa dùng văn phong hiện đại, trang trọng, mạch lạc. “Các chỉ huy Đền Thờ” ngắn gọn và dễ hiểu hơn “những người chỉ huy lực lượng bảo vệ đền thờ,” mà vẫn chỉ các viên chức phụ trách an ninh Đền Thờ. “Gươm và gậy” phù hợp ngữ cảnh và cách dùng tiếng Việt.
  terminology: “Đức Giê-su,” “thượng tế,” “Đền Thờ,” và “trưởng lão” nhất quán với đăng ký Kinh Thánh tiếng Việt. “Tên cướp” là nghĩa chính có thể chấp nhận của λῃστής; chú thích bảo lưu các khả năng “kẻ cướp có vũ trang” và “kẻ nổi loạn,” không áp đặt một nghĩa chính trị cụ thể.
  issues:
  - severity: medium
    issue: “đã đến bắt ngài” diễn giải quá cụ thể παραγενομένους ἐπ’ αὐτόν.
    rationale: Ngữ cảnh quả thực là cuộc bắt giữ, nhưng cụm Hy Lạp mô tả những người đã đến chống lại/nhắm vào Đức Giê-su, không trực tiếp nêu động từ “bắt.”
  - severity: medium
    issue: “như để bắt một tên cướp” không giữ đúng cấu trúc so sánh của ὡς ἐπὶ λῃστήν.
    rationale: Cụm này hỏi liệu họ có ra đối phó với ngài như đối phó một λῃστής hay không; “như thể đối phó với” phản ánh trực tiếp hơn mà không thêm sắc thái mục đích.
  revised_text: 'Nhưng Đức Giê-su nói với các thượng tế, các chỉ huy Đền Thờ và các trưởng lão đã đến chống lại ngài: “Các ông mang gươm và gậy kéo đến như thể đối phó với một tên cướp[a] sao?”'
