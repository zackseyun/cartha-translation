language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với các thượng tế, các chỉ huy Đền Thờ và các trưởng lão đã đến chống lại ngài: “Các ông mang gươm và gậy kéo đến như thể đối phó với một tên cướp[a] sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp có thể chỉ tên cướp, kẻ cướp có vũ trang, hoặc kẻ nổi loạn ngoài vòng pháp luật. Ở đây, câu hỏi nhấn mạnh việc họ kéo đến có vũ trang như khi đối phó với một kẻ nguy hiểm.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý có sắc thái tương phản nhẹ, từ hành động bắt giữ sang lời đáp của Đức Giê-su.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: đã đến bắt ngài
  rationale: Trong bối cảnh bắt giữ, cụm từ chỉ việc họ tiến đến với ý định chống lại và bắt Đức Giê-su; cách dịch này tự nhiên hơn tiếng Việt mà vẫn giữ rõ tính thù địch của hành động.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Thuật ngữ quen thuộc trong tiếng Việt để chỉ tập thể các chức sắc tư tế đứng đầu, chứ không chỉ nhiều người cùng giữ chức thượng tế.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: những người chỉ huy lực lượng bảo vệ đền thờ
  rationale: Chỉ các viên chức phụ trách an ninh đền thờ. Cách diễn đạt này rõ nghĩa với độc giả hiện đại hơn lối dịch sát là 'các chỉ huy đền thờ'.
- source_word: πρεσβυτέρους
  choice: các trưởng lão
  rationale: Trong ngữ cảnh này, từ chỉ những người lãnh đạo được công nhận trong cộng đồng, không đơn thuần là người cao tuổi.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: như để bắt một tên cướp
  rationale: 'Giữ cấu trúc so sánh và sắc thái chất vấn: họ dùng lực lượng như khi đi bắt một tội phạm nguy hiểm. λῃστής có phạm vi nghĩa rộng nên có chú thích.'
- source_word: ἐξήλθατε
  choice: kéo đến
  rationale: Trong câu hỏi về hành động vừa xảy ra, 'kéo đến' diễn đạt tự nhiên việc một nhóm có vũ trang cùng tiến ra, đồng thời tránh lặp với 'đã đến bắt ngài'.
- source_word: μαχαιρῶν
  choice: gươm
  rationale: Cách gọi thông dụng và phù hợp với loại vũ khí trong cảnh bắt giữ.
- source_word: ξύλων
  choice: gậy
  rationale: Trong ngữ cảnh vũ trang, từ chỉ những khúc gỗ hoặc gậy được dùng làm vũ khí; 'gậy' là cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của λῃστής
  choice: tên cướp, kèm chú thích về các nghĩa khả dĩ
  alternative: kẻ cướp có vũ trang / kẻ nổi loạn
  rationale: Nguyên ngữ có thể chỉ tên cướp, kẻ cướp có vũ trang hoặc một kẻ ngoài vòng pháp luật mang tính nổi loạn. Không nên khóa câu văn vào một cách hiểu chính trị cụ thể khi ngữ cảnh chủ yếu nhấn mạnh cách họ đem vũ khí đến bắt một người nguy hiểm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “ngài” với sắc thái tôn kính; lời chất vấn dùng “các ông” để tự nhiên trong tiếng Việt. Cụm “lực lượng bảo vệ đền thờ” làm rõ chức năng của στρατηγοὶ mà không đồng nhất họ với quân đội thông thường.
