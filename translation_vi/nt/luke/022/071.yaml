  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: vi
  text: 'Bấy giờ họ nói[a]: “Tại sao chúng ta còn cần lời chứng nữa? Vì chính chúng ta đã nghe chính miệng ông ấy nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng ta còn cần lời chứng nữa làm gì?”'
    reason: Cách dịch thay thế phản ánh sát hơn cấu trúc câu hỏi tu từ Τί ἔτι… χρείαν, trong khi câu chính dùng lối hỏi tự nhiên của tiếng Việt.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Bấy giờ họ nói
  rationale: δέ là liên từ nhẹ tiếp nối diễn tiến; “Bấy giờ” diễn đạt trình tự tự nhiên mà không nhấn mạnh sự tương phản.
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: Tại sao chúng ta còn cần lời chứng nữa?
  rationale: Câu hỏi tu từ được diễn đạt tự nhiên trong tiếng Việt; “còn… nữa” chuyển tải ἔτι, còn χρείαν ἔχειν mang nghĩa “cần”.
- source_word: μαρτυρίας
  choice: lời chứng
  rationale: Trong bối cảnh xét xử, “lời chứng” phù hợp hơn “nhân chứng” vì từ này chỉ điều được làm chứng hay lời khai.
- source_word: αὐτοὶ γὰρ
  choice: Vì chính chúng ta
  rationale: '“Chính chúng ta” giữ được sắc thái nhấn mạnh của αὐτοί: họ tuyên bố mình đã trực tiếp nghe.'
- source_word: ἠκούσαμεν
  choice: đã nghe
  rationale: Dạng quá khứ aorist được chuyển bằng “đã nghe”, tự nhiên và rõ về hành động vừa xảy ra.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: từ miệng ông ấy
  rationale: Giữ sát thành ngữ Hy Lạp về việc nghe trực tiếp từ người nói; “ông ấy” là cách quy chiếu tự nhiên, không thêm sắc thái tôn kính hay miệt thị ngoài văn bản.
theological_decisions:
- issue: Có nên nói rõ điều họ nghe là lời tự buộc tội hay lời tuyên bố của Đức Giê-su không
  choice: 'Giữ câu nói khái quát: “chính chúng ta đã nghe từ miệng ông ấy”'
  alternative: “chính chúng ta đã nghe lời chứng ấy từ miệng ông ấy” hoặc “đã nghe lời ông ấy tự xưng”
  rationale: Nguyên văn không có tân ngữ sau ἠκούσαμεν. Không thêm “lời chứng”, “lời tuyên bố” hay “lời tự buộc tội” để bảo toàn sự hàm súc và sức căng pháp lý của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “lời chứng” theo ngữ cảnh pháp lý; tránh thuật ngữ giáo phái và không giải thích quá mức điều họ đã nghe.
