    issue: Cụm “đã nghe từ miệng ông ấy” thiếu tự nhiên trong tiếng Việt.
    rationale: Tiếng Việt thông thường cần một bổ ngữ cho “nghe” hoặc dùng thành ngữ “nghe chính miệng [ai] nói”. Bản sửa làm rõ hành vi phát ngôn vốn đã hàm ý trong thành ngữ ἀπὸ τοῦ στόματος αὐτοῦ, không thêm nội dung của điều được nghe.
  - severity: low
    issue: Chú thích hiện tại lặp lại toàn bộ lời dẫn thay vì chỉ nêu phương án cho câu hỏi.
    rationale: Rút gọn chú thích giúp neo chú thích rõ ràng vào cách dịch thay thế của τί ἔτι ... χρείαν và tránh thay đổi không cần thiết đối với phần lời dẫn.
