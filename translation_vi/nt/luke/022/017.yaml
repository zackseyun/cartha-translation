source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: vi
  text: 'Sau khi nhận lấy một cái chén[a] và dâng lời tạ ơn, Ngài nói: “Hãy cầm lấy chén này và phân chia cho nhau[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cái chén.” Trong tiếng Hy Lạp, danh từ ở đây không có mạo từ, dù bối cảnh bữa ăn có thể hàm ý một cái chén cụ thể.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “phân phát cho nhau.” Động từ Hy Lạp có thể mang nghĩa “chia ra” hoặc “phân phát/chia phần” trong văn cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεξάμενος
  choice: sau khi nhận lấy
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này thể hiện rõ trình tự và tự nhiên trong tiếng Việt.
- source_word: ποτήριον
  choice: một cái chén
  rationale: Danh từ Hy Lạp không có mạo từ. “Một cái chén” phản ánh hình thức ấy mà không mặc nhiên biến nó thành thuật ngữ nghi lễ.
- source_word: εὐχαριστήσας
  choice: dâng lời tạ ơn
  rationale: Diễn tả hành động cảm tạ trước khi nói, bằng ngôn ngữ kể chuyện trang trọng nhưng thông dụng, không áp đặt thuật ngữ bí tích về sau.
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Tiếng Hy Lạp chỉ nói “người nói” mà không nêu tân ngữ gián tiếp. Tiếng Việt cần một chủ ngữ rõ; “Ngài” phù hợp với Đức Giê-su trong văn cảnh mà không thêm “với họ”.
- source_word: Λάβετε
  choice: Hãy cầm lấy
  rationale: Mệnh lệnh này chỉ hành động nhận hoặc cầm vật được trao. “Hãy cầm lấy” tự nhiên trong bối cảnh dùng bữa.
- source_word: τοῦτο
  choice: chén này
  rationale: Đại từ chỉ định giống trung số ít quy chiếu đến cái chén vừa được nhắc. Tiếng Việt cần nêu danh từ để câu mệnh lệnh tự nhiên và rõ nghĩa; đây là sự minh thị hóa quy chiếu, không thêm một vật mới.
- source_word: διαμερίσατε
  choice: chia
  rationale: Động từ có thể chỉ việc chia phần hoặc phân phát. “Chia” giữ được nghĩa gần với nguyên văn, còn “cho nhau” làm rõ việc phân chia trong nhóm.
- source_word: εἰς ἑαυτούς
  choice: cho nhau
  rationale: Trong văn cảnh, cụm từ diễn tả việc phân chia giữa những người trong nhóm. “Cho nhau” tự nhiên hơn “giữa chính các con” trong tiếng Việt.
theological_decisions:
- issue: Có nên dùng ngôn ngữ phụng vụ hoặc bí tích khi dịch εὐχαριστήσας và ποτήριον hay không
  choice: 'Dùng ngôn ngữ tường thuật thông thường: “một cái chén” và “dâng lời tạ ơn”'
  alternative: Dùng “cái chén” như một vật đã được xác định hoặc dùng thuật ngữ mang sắc thái nghi lễ mạnh hơn
  rationale: Câu này kể lại hành động của Đức Giê-su trong bữa ăn nhưng không tự nó đòi hỏi thuật ngữ giáo hội về sau. Cách dịch giữ nguyên cảnh lịch sử và tránh đưa thêm một lập trường giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Sau khi… và…, Ngài nói” giữ rõ trình tự hành động. “Chén này” minh thị hóa đối tượng của đại từ τοῦτο để tránh cách nói thiếu tự nhiên “cái này” trong tiếng Việt, trong khi các chú thích bảo tồn những khả năng từ vựng thực sự của nguyên văn.
