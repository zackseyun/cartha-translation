source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: vi
  text: 'Anh em hãy nói với chủ nhà: ‘Thầy nhắn ông: “Phòng dành cho khách[a] ở đâu để tôi ăn lễ Vượt Qua với các môn đồ của tôi?”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nơi nghỉ trọ.” Từ Hy Lạp κατάλυμα chỉ một nơi để nghỉ hoặc phòng dành cho khách; ở đây không có nghĩa cụ thể là “quán trọ,” và mãi đến câu kế tiếp mới cho biết đó là một phòng trên lầu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: chủ nhà
  rationale: Cụm từ chỉ người đứng đầu gia đình hoặc người quản lý ngôi nhà. “Chủ nhà” tự nhiên trong tiếng Việt hiện đại và phù hợp với ngữ cảnh, không nhất thiết khẳng định quyền sở hữu pháp lý.
- source_word: ὁ διδάσκαλος
  choice: Thầy
  rationale: Đây là danh xưng của Đức Giê-su. “Thầy” truyền đạt tự nhiên vai trò dạy dỗ và mối quan hệ với các môn đồ, tránh sắc thái quyền lực rộng hơn của “Chủ”.
- source_word: κατάλυμα
  choice: phòng dành cho khách
  rationale: Từ này chỉ nơi nghỉ trọ hoặc chỗ dành cho khách. Trong bối cảnh một ngôi nhà, “phòng dành cho khách” phù hợp hơn “quán trọ”; “phòng trên lầu” chỉ được câu kế tiếp xác định.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: πάσχα có thể chỉ lễ hoặc bữa ăn Vượt Qua. Động từ “ăn” khiến bữa ăn được hàm ý rõ, nhưng cách dịch này giữ phạm vi biểu đạt của nguyên bản.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: với các môn đồ của tôi
  rationale: “Môn đồ” giữ được ý nghĩa về những người theo học và gắn bó với thầy, thích hợp với văn cảnh Phúc Âm hơn “học trò”.
- source_word: φάγω
  choice: để tôi ăn
  rationale: Thể giả định trong mệnh đề với ὅπου diễn tả hành động được dự liệu hoặc mục đích. “Để tôi ăn” tự nhiên trong câu hỏi gián tiếp tiếng Việt và không biến nó thành lời khẳng định chắc chắn.
- source_word: ἐρεῖτε
  choice: Anh em hãy nói
  rationale: Dù nguyên bản dùng thì tương lai, trong ngữ cảnh này nó mang chức năng chỉ dẫn. “Hãy nói” diễn đạt lực mệnh lệnh tự nhiên hơn tiếng Việt; “anh em” cho thấy số nhiều.
theological_decisions:
- issue: Cách dịch danh xưng διδάσκαλος khi Đức Giê-su tự xưng
  choice: Thầy
  alternative: Người Thầy; Thầy Giáo; Chủ
  rationale: “Thầy” là danh xưng trực tiếp, tự nhiên và trung thành với nghĩa dạy dỗ của διδάσκαλος. Cách dịch này không nhập thêm ý nghĩa thần học của κύριος (“Chúa/Chủ”).
- issue: Phạm vi nghĩa của πάσχα
  choice: lễ Vượt Qua
  alternative: bữa ăn Vượt Qua
  rationale: Ngữ cảnh “ăn” cho thấy bữa ăn được nhắm đến, nhưng nguyên bản chỉ dùng πάσχα. Giữ “lễ Vượt Qua” tránh giải nghĩa quá mức và bảo tồn sự cô đọng của tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để biểu thị đại từ số nhiều hàm ẩn trong động từ; dùng “ông” khi truyền lời cho chủ nhà. Dấu ngoặc kép lồng nhau làm rõ lời Đức Giê-su được các môn đồ thuật lại.
