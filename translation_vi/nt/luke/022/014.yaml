  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: vi
  text: Khi giờ đã đến, Ngài ngả mình vào bàn ăn cùng các sứ đồ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo phong tục dùng bữa thời ấy, người ta thường nằm nghiêng quanh bàn ăn.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: Khi giờ đã đến
  rationale: Giữ danh từ xác định “giờ” và sắc thái về một thời điểm đã định, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀνέπεσεν
  choice: ngả mình dùng bữa
  rationale: Động từ chỉ tư thế ngả mình khi ăn theo phong tục thời cổ; cách dịch này chính xác hơn “ngồi xuống” và vẫn dễ hiểu với độc giả hiện đại.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: Dịch trực tiếp danh từ có mạo từ, chỉ nhóm sứ đồ đã được biết đến trong mạch văn; không thêm từ sở hữu vốn không có trong nguyên văn.
- source_word: σὺν αὐτῷ
  choice: cũng ở cùng Ngài
  rationale: Diễn đạt tự nhiên sự đồng hành và cùng hiện diện; “cũng” phản ánh cấu trúc phối hợp của câu.
- source_word: Καὶ
  choice: lược dịch ở đầu câu
  rationale: Trong tiếng Việt hiện đại, mở câu bằng “Và” ở đây không cần thiết; quan hệ tiếp nối đã rõ trong mạch kể.
theological_decisions:
- issue: Tư thế dùng bữa trong bối cảnh lễ Vượt Qua
  choice: ngả mình dùng bữa
  alternative: ngồi xuống dùng bữa
  rationale: Giữ chi tiết lịch sử-văn hóa do động từ Hy Lạp biểu đạt, thay vì đồng hóa với tư thế ăn uống hiện đại; đây là quyết định từ vựng-văn hóa, không phải diễn giải giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ “Ngài” theo lối gọi tôn kính quen thuộc trong tiếng Việt Cơ Đốc; cụm “ngả mình dùng bữa” bảo tồn nét văn hóa của nguyên văn mà không gây cảm giác quá cổ.
