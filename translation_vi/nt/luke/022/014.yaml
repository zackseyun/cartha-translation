revisions:
- from: Khi giờ đã đến, Đức Chúa Jêsus ngả mình dùng bữa, và các sứ đồ cũng ở cùng Ngài.[a]
  to: Khi giờ đã đến, Ngài ngả mình vào bàn ăn cùng các sứ đồ.[a]
  rationale: Bản sửa không thêm tên riêng ngoài nguyên văn, giữ “giờ” xác định, diễn đạt ἀνέπεσεν bằng “ngả mình vào bàn ăn”, và gắn các sứ đồ trực tiếp với bữa ăn qua “cùng các sứ đồ”. Chú thích được rút gọn để giải thích tư thế dùng bữa cổ đại một cách rõ ràng, không diễn giải thêm.
