  text: κἀκεῖνος ὑμῖν δείξει ἀνάγαιον μέγα ἐστρωμένον· ἐκεῖ ἑτοιμάσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/012.yaml
  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: vi
  text: Người ấy sẽ chỉ cho anh em một căn phòng lớn ở tầng trên, đã được sắp đặt[a]. Hãy chuẩn bị ở đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được chuẩn bị sẵn” hoặc “đã được bày biện sẵn.”'
    reason: ἐστρωμένον có thể nhấn mạnh căn phòng đã được trải, bố trí hay chuẩn bị, nhưng không nói rõ chính xác những gì đã được sắp đặt.
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Người ấy
  rationale: Từ ghép καί + ἐκεῖνος vừa tiếp nối lời chỉ dẫn vừa quy chiếu rõ đến chủ nhà đã được nhắc tới; “người ấy” tự nhiên và giữ được sắc thái xác định.
- source_word: ὑμῖν δείξει
  choice: sẽ chỉ cho các con
  rationale: Diễn đạt tự nhiên cấu trúc động từ tương lai với bổ ngữ gián tiếp, trong đó người nghe là các môn đồ.
- source_word: ἀνάγαιον μέγα
  choice: một căn phòng lớn ở tầng trên
  rationale: ἀνάγαιον chỉ căn phòng thuộc tầng trên; cách diễn đạt này rõ nghĩa hơn lối nói có thể cổ hoặc chuyên biệt “phòng cao”.
- source_word: ἐστρωμένον
  choice: đã được sắp đặt sẵn
  rationale: Phân từ hoàn thành bị động của στρώννυμι mô tả căn phòng ở trong trạng thái đã được trải hoặc bố trí, có thể gồm các chỗ nằm dùng khi dùng bữa; cách dịch giữ ý đã hoàn tất mà không xác định quá mức đồ đạc cụ thể.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: Hãy chuẩn bị tại đó
  rationale: Giữ nguyên trạng từ chỉ nơi chốn và lực mệnh lệnh số nhiều của ἑτοιμάσατε, tức chuẩn bị bữa lễ tại căn phòng ấy.
