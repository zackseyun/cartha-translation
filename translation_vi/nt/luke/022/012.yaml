  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” để phù hợp lời Đức Chúa Jêsus nói với các môn đồ trong ngữ cảnh; câu cuối tách riêng nhằm thể hiện rõ mệnh lệnh.
