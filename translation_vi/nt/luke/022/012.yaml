review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính: người chủ sẽ chỉ cho các môn đồ một phòng lớn ở tầng trên, trong tình trạng đã được bố trí, và họ phải chuẩn bị tại đó. Tuy nhiên, “các con” thêm sắc thái quan hệ cha–con không được biểu thị trong đại từ số nhiều ὑμῖν; “anh em” trung tính hơn và vẫn tự nhiên trong lời nói với các môn đồ. “Đã được sắp đặt sẵn” hơi dư ý; dạng hoàn thành bị động đã được thể hiện đầy đủ bằng “đã được sắp đặt.”'
  naturalness: “Một căn phòng lớn ở tầng trên” và “Hãy chuẩn bị ở đó” là tiếng Việt hiện đại, rõ ràng. “Anh em” phù hợp ngữ cảnh lời nói trực tiếp với nhóm môn đồ mà không áp đặt sắc thái gia đình.
  terminology: '“Phòng ... ở tầng trên” phản ánh ἀνάγαιον mà không dùng thuật ngữ cổ. “Đã được sắp đặt” giữ tính không xác định của ἐστρωμένον: căn phòng đã được trải/bố trí, nhưng không xác định cụ thể là đồ đạc hay chỗ nằm.'
  issues:
  - severity: medium
    issue: “các con” diễn giải thêm quan hệ người nói–người nghe.
    rationale: Ὑμῖν chỉ là đại từ ngôi thứ hai số nhiều. Dù ngữ cảnh là các môn đồ, bản Hy Lạp không dùng từ ngữ cha–con; “anh em” giữ cách xưng hô trực tiếp và trung tính hơn.
  - severity: low
    issue: “đã được sắp đặt sẵn” có tính trùng ý.
    rationale: “Đã được sắp đặt” đã biểu đạt tình trạng hoàn tất của phân từ hoàn thành bị động ἐστρωμένον; bỏ “sẵn” giúp câu gọn hơn mà không mất nghĩa.
