  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: vi
  text: Vậy họ đi, và thấy sự việc đúng như Ngài đã nói với họ; rồi họ chuẩn bị Lễ Vượt Qua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bữa ăn Lễ Vượt Qua” hoặc “chiên Vượt Qua.” Từ Hy Lạp có thể chỉ Lễ Vượt Qua nói chung, hoặc cụ thể hơn là bữa ăn hay các yếu tố tế lễ liên quan đến lễ ấy.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες
  choice: họ đi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; chuyển thành chuỗi động từ hữu hạn là tự nhiên trong tiếng Việt và vẫn giữ đúng trình tự.
- source_word: δὲ
  choice: Vậy
  rationale: Ở đây δέ là từ nối nhẹ, tiếp tục câu chuyện và liên kết việc họ làm với chỉ dẫn trước đó của Chúa Giê-su, chứ không biểu thị sự tương phản mạnh.
- source_word: εὗρον
  choice: thấy mọi sự
  rationale: Động từ có nghĩa là tìm thấy hoặc nhận thấy. Nguyên văn không nêu tân ngữ; 'mọi sự' diễn đạt tự nhiên điều họ gặp đúng như đã được báo trước mà không thu hẹp vào một vật cụ thể.
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn tả sự tương ứng giữa điều Chúa Giê-su đã nói và điều các môn đồ gặp thấy.
- source_word: εἰρήκει αὐτοῖς
  choice: Ngài đã nói với họ
  rationale: Thì quá khứ hoàn thành chỉ lời nói có trước; 'đã nói với họ' giữ sát λέγω và không diễn giải quá mức thành mệnh lệnh.
- source_word: ἡτοίμασαν
  choice: họ chuẩn bị
  rationale: Diễn đạt trực tiếp hành động làm cho sẵn sàng, tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: τὸ πάσχα
  choice: lễ Vượt Qua
  rationale: πάσχα có thể chỉ lễ Vượt Qua nói chung, bữa ăn lễ hoặc chiên sinh tế; cách dịch rộng này bảo toàn phạm vi nghĩa của từ Hy Lạp.
theological_decisions:
- issue: Phạm vi nghĩa của πάσχα trong ngữ cảnh
  choice: lễ Vượt Qua
  alternative: bữa ăn lễ Vượt Qua; chiên lễ Vượt Qua
  rationale: Ngữ cảnh nói đến việc chuẩn bị để ăn lễ Vượt Qua, nhưng chính từ Hy Lạp vẫn có phạm vi rộng hơn. Bản dịch chính không thu hẹp nghĩa vào riêng bữa ăn hay sinh tế.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su trong mạch văn; đặt dấu chấm phẩy để thể hiện hai bước liên tiếp của câu Hy Lạp.
