  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: vi
  text: 'Một cô đầy tớ thấy ông đang ngồi gần ánh sáng[a], nhìn chăm chú vào ông rồi nói: “Người này cũng đã ở với ông ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “bên ánh sáng.” Cụm Hy Lạp có thể chỉ vị trí gần nguồn sáng hoặc ở trong vùng được chiếu sáng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα δὲ
  choice: Một tớ gái thấy
  rationale: Phân từ bất định ἰδοῦσα cùng δέ tiếp nối diễn biến câu chuyện; cấu trúc tiếng Việt này tự nhiên và giữ hành động nhìn thấy làm tiền đề cho lời nhận diện.
- source_word: παιδίσκη τις
  choice: một tớ gái
  rationale: παιδίσκη chỉ một nữ đầy tớ còn trẻ; “một” diễn đạt tính bất định của τις. “Tớ gái” ngắn gọn, dễ hiểu và không nhấn quá mức vào quy chế nô lệ.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: đang ngồi bên ánh lửa
  rationale: καθήμενον mô tả tư thế đang ngồi; πρὸς τὸ φῶς chỉ vị trí gần nguồn sáng. Trong ngữ cảnh sân nhà và đống lửa ở câu trước, “bên ánh lửa” diễn đạt tự nhiên mà vẫn tập trung vào ánh sáng giúp cô nhận ra ông.
- source_word: ἀτενίσασα αὐτῷ
  choice: liền nhìn kỹ ông
  rationale: ἀτενίζω diễn tả việc chăm chú nhìn; “nhìn kỹ” là cách nói hiện đại, tự nhiên, cho thấy sự quan sát tập trung nhằm nhận diện.
- source_word: Καὶ οὗτος
  choice: Người này cũng
  rationale: Giữ sắc thái chỉ định của οὗτος và ý bổ sung của καί; cách nói này tự nhiên trong lời nhận diện trực tiếp.
- source_word: σὺν αὐτῷ ἦν
  choice: đã ở với ông ấy
  rationale: Diễn đạt trực tiếp sự đồng hành trong quá khứ, không thêm ý giải thích rằng Phi-e-rơ là môn đồ hay bạn đồng hành.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” dành cho người đang bị nhận diện và “ông ấy” cho Chúa Giê-su giữ nguyên sự phân biệt của hai đại từ Hy Lạp mà không thêm danh xưng ngoài câu nguồn.
