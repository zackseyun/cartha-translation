    issue: “được ăn uống” thêm sắc thái thụ hưởng/được phép.
    rationale: Nguyên văn dùng hai động từ chủ động ở lối giả định dưới ἵνα; tiếng Việt có thể diễn đạt mệnh đề mục đích trực tiếp bằng “để anh em ăn uống” mà không thêm sắc thái này.
  - severity: low
    issue: Liên kết “mà xét xử” chưa tự nhiên.
    rationale: Phân từ κρίνοντες bổ sung hành động gắn với việc ngồi trên ngai. Dấu phẩy và động từ “xét xử” diễn đạt quan hệ này tự nhiên, không áp đặt thêm quan hệ cú pháp.
  - severity: low
    issue: “quản trị” trong chú thích chưa phải lựa chọn tự nhiên nhất cho κρίνω trong bối cảnh này.
    rationale: “Cai trị” và “cầm quyền trên” truyền đạt được sắc thái cai quản/chấp chính có thể có của κρίνω mà không mang sắc thái quản trị doanh nghiệp hiện đại.
