  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: vi
  text: để anh em ăn uống tại bàn của tôi trong vương quốc của tôi, và anh em sẽ ngồi trên các ngai, xét xử[a] mười hai chi phái Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cai trị” hoặc “cầm quyền trên” mười hai chi phái Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả nối với lời hứa ở câu trước.
- source_word: ἔσθητε καὶ πίνητε
  choice: anh em được ăn uống
  rationale: Giữ sắc thái khả năng được ban cho dưới ἵνα; “ăn uống” là cách phối hợp tự nhiên trong tiếng Việt.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: tại bàn của tôi
  rationale: Diễn đạt tự nhiên sự cùng bàn, đồng thời giữ hình ảnh chiếc bàn trong nguyên văn.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: trong vương quốc của tôi
  rationale: Bối cảnh bàn tiệc và các ngai ủng hộ nghĩa chỉ vương quốc, nhưng cụm từ vẫn hàm chứa quyền trị vì.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: anh em sẽ ngồi trên các ngai
  rationale: Giữ thì tương lai và hình ảnh đăng ngai mang sắc thái vương quyền, xét xử.
- source_word: κρίνοντες
  choice: mà xét xử
  rationale: “Xét xử” phản ánh trực tiếp nhất nghĩa tư pháp của κρίνω; cấu trúc “mà” nối tự nhiên hành động này với việc ngồi trên các ngai.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: mười hai chi phái Israel
  rationale: Cách diễn đạt rõ ràng, quen thuộc, giữ nguyên quy chiếu giao ước về mười hai chi phái của Israel.
theological_decisions:
- issue: Bản chất vai trò tương lai của các môn đồ đối với mười hai chi phái Israel
  choice: Giữ ngôn ngữ tư pháp “xét xử”, không thu hẹp thành chỉ kết án hoặc chỉ cai trị hành chính.
  alternative: “cai trị” hoặc “quản trị” mười hai chi phái Israel
  rationale: κρίνω có thể bao gồm cả việc phán xét và thi hành quyền cai trị. Bản chính giữ nghĩa từ vựng trực tiếp nhất, còn chú thích bảo lưu các sắc thái khả hữu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để thể hiện ngôi thứ hai số nhiều hướng đến các môn đồ; dùng “tôi” theo lối nói trực tiếp tự nhiên, không tự ý đưa thêm sắc thái giáo phái. Dấu chú thích được đặt ngay sau “xét xử”, đúng với từ có phương án dịch thay thế.
