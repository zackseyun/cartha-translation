  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa chính của câu Hy Lạp: phân từ aorist περικαλύψαντες được chuyển thành hành động che trước khi chế nhạo; ἐπηρώτων được diễn đạt bằng “cứ hỏi,” giữ được sắc thái chưa hoàn thành, lặp lại/tiếp diễn; và ὁ παίσας σε là “kẻ đã đánh ông.” “Che mặt Ngài lại” là cách diễn đạt Việt ngữ tự nhiên cho hành động che phủ trong ngữ cảnh, không khẳng định quá cụ thể phương tiện bịt mắt; chú thích bảo lưu phương án này.'
