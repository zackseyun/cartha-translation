id: LUK.22.64
reference: Luke 22:64
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: vi
  text: 'Rồi họ che mặt Ngài lại[a] và cứ hỏi: “Hãy nói tiên tri đi! Ai là kẻ đã đánh ông?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bịt mắt Ngài lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: che mặt Ngài lại
  rationale: Động từ chỉ hành động phủ hoặc che kín. Trong ngữ cảnh, đối tượng bị che là mặt để cản tầm nhìn; cách diễn đạt này tự nhiên trong tiếng Việt nhưng không xác định cụ thể phương tiện như từ “bịt mắt”.
- source_word: ἐπηρώτων
  choice: cứ hỏi
  rationale: Thì chưa hoàn thành diễn tả hành động tiếp diễn hoặc lặp đi lặp lại; “cứ hỏi” chuyển tải sắc thái ấy và phù hợp với lời nhạo báng.
- source_word: λέγοντες
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ giới thiệu nội dung họ nói; tiếng Việt tự nhiên có thể biểu đạt chức năng này bằng dấu hai chấm thay vì thêm từ “rằng” hoặc “nói rằng”.
- source_word: Προφήτευσον
  choice: Hãy nói tiên tri đi!
  rationale: Mệnh lệnh mang sắc thái chế nhạo. “Nói tiên tri” là cách diễn đạt rõ ràng, quen thuộc và giữ liên hệ với vai trò tiên tri.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Ai là kẻ đã đánh ông?
  rationale: Phân từ có mạo từ mang nghĩa danh từ, chỉ người đã đánh. “Kẻ” hợp với giọng thách thức của những người chế nhạo; họ gọi Đức Giê-su là “ông”, không hàm ý kính trọng.
theological_decisions:
- issue: Có nên nói rõ Đức Giê-su bị bịt mắt hay không
  choice: Dùng “che mặt Ngài lại” trong chính văn
  alternative: “bịt mắt Ngài lại”
  rationale: Ngữ cảnh hàm ý tầm nhìn của Đức Giê-su bị ngăn lại, nhưng động từ Hy Lạp rộng hơn hành động bịt mắt. Chính văn giữ cách nói ít đặc định hơn, còn chú thích ghi cách hiểu tự nhiên trong bối cảnh.
- issue: Đại từ dùng cho Đức Giê-su trong lời trần thuật và lời chế nhạo
  choice: Trong lời trần thuật dùng “Ngài”; trong lời chế nhạo dùng “ông”
  alternative: Dùng cùng một đại từ ở cả hai nơi
  rationale: 'Sự phân biệt này phù hợp với tiếng Việt hiện đại: lời người kể giữ sắc thái tôn kính, còn câu trực tiếp phản ánh thái độ thiếu kính trọng của những kẻ đang chế nhạo, không thêm một danh xưng thần học vào miệng họ.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cứ hỏi” giữ sắc thái lặp lại của thì chưa hoàn thành; mệnh lệnh “Hãy nói tiên tri đi!” giữ giọng chế nhạo. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
