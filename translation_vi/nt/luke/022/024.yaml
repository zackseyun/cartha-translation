  text: Ἐγένετο δὲ καὶ φιλονεικία ἐν αὐτοῖς, τὸ τίς αὐτῶν δοκεῖ εἶναι μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: vi
  text: Giữa họ cũng nảy sinh một cuộc tranh cãi xem ai trong họ được coi là lớn hơn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có vẻ là lớn hơn.” Động từ Hy Lạp có thể mang nghĩa “có vẻ” hoặc “được coi là.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: nảy sinh
  rationale: Diễn tả sự xuất hiện của một tình huống; “nảy sinh” tự nhiên trong tiếng Việt khi nói về một cuộc tranh cãi.
- source_word: δὲ καὶ
  choice: cũng
  rationale: “Cũng” giữ sắc thái bổ sung của καί; quan hệ chuyển tiếp nhẹ của δέ được thể hiện tự nhiên qua mạch câu, không cần thêm một từ chỉ thời gian hay tương phản.
- source_word: φιλονεικία
  choice: một cuộc tranh cãi
  rationale: Diễn đạt rõ sự bất đồng mang tính ganh đua về địa vị trong nhóm.
- source_word: ἐν αὐτοῖς
  choice: giữa họ
  rationale: Chỉ việc tranh cãi xảy ra trong nội bộ nhóm; đây là cách nói tự nhiên trong tiếng Việt.
- source_word: τὸ τίς αὐτῶν
  choice: xem ai trong họ
  rationale: Diễn đạt tự nhiên nội dung của cuộc tranh cãi do mạo từ τὸ danh hóa câu hỏi gián tiếp.
- source_word: δοκεῖ
  choice: được coi là
  rationale: Giữ nghĩa đánh giá xã hội của δοκέω trong ngữ cảnh, đồng thời chú thích nghĩa khả dĩ “có vẻ là”.
- source_word: εἶναι
  choice: là
  rationale: Bổ nghĩa trực tiếp cho δοκεῖ theo cấu trúc tự nhiên của tiếng Việt.
- source_word: μείζων
  choice: lớn hơn
  rationale: Giữ đúng dạng so sánh hơn của tiếng Hy Lạp, không chuyển thành dạng cao nhất “lớn nhất”.
theological_decisions:
- issue: Ngôn ngữ địa vị giữa các môn đồ
  choice: lớn hơn
  alternative: lớn nhất; quan trọng hơn
  rationale: μείζων là dạng so sánh hơn, không phải dạng cao nhất. Bản dịch giữ nguyên độ căng và phạm vi của cách diễn đạt trong nguyên văn.
- issue: Chủ thể đánh giá địa vị
  choice: được coi là
  alternative: có vẻ là
  rationale: Nguyên văn không nói rõ ai là người đánh giá. Cấu trúc bị động trong tiếng Việt giữ sự không xác định ấy thay vì thêm “họ coi” hay một chủ thể khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “giữa họ” và “nảy sinh một cuộc tranh cãi” để câu văn tự nhiên; giữ nguyên dạng so sánh “lớn hơn” và sự mơ hồ của δοκεῖ.
