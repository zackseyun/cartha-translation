  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: vi
  text: “Si-môn, Si-môn, này, Sa-tan đã đòi được các con[a] để sàng các con như sàng lúa mì.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các con” ở đây là số nhiều, chỉ Si-môn cùng các môn đồ khác.
    reason: Tiếng Việt không tự biểu thị rõ sự chuyển từ lời gọi đích danh Si-môn sang đại từ ὑμᾶς số nhiều.
lexical_decisions:
- source_word: ἰδού
  choice: này
  rationale: Từ gọi sự chú ý tự nhiên trong lời cảnh báo trực tiếp, trang trọng mà vẫn dễ hiểu.
- source_word: ἐξῃτήσατο
  choice: đã đòi
  rationale: Giữ sắc thái Sa-tan yêu cầu mạnh mẽ cho mình, nhưng không thêm ý rằng yêu cầu ấy đã được chấp thuận.
- source_word: ὑμᾶς
  choice: tất cả các con
  rationale: Đại từ số nhiều chỉ nhóm môn đồ, không riêng Si-môn; thêm “tất cả” để làm rõ sự tương phản với lời xưng hô số ít.
- source_word: σινιάσαι ὡς τὸν σῖτον
  choice: sàng ... như sàng lúa mì
  rationale: Bảo tồn hình ảnh nông nghiệp và sắc thái thử thách, phân rẽ dữ dội của nguyên văn.
theological_decisions:
- issue: Đối tượng của lời đòi hỏi của Sa-tan
  choice: tất cả các con
  alternative: con
  rationale: ὑμᾶς là số nhiều, nên lời cảnh báo hướng đến toàn thể các môn đồ dù Chúa Giê-su đang gọi đích danh Si-môn.
- issue: Hàm ý về sự cho phép của Đức Chúa Trời
  choice: đã đòi
  alternative: đã được phép
  rationale: Nguyên văn nói Sa-tan đã yêu cầu/đòi, không trực tiếp khẳng định tại đây rằng nó đã được cho phép; không nên giải quyết ngầm căng thẳng thần học ấy.
translation_notes:
  register: Lời văn hiện đại, trực tiếp và trang nghiêm. Giữ lối lặp “Si-môn, Si-môn” để truyền đạt sự khẩn thiết; dùng “các con” phù hợp lời Chúa Giê-su nói với các môn đồ.
