  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và nội dung Hy Lạp: một người vô danh trong nhóm ấy đánh người thuộc thượng tế, rồi tai phải của người đó bị chém đứt. “Một người trong số họ,” “thượng tế,” và “tai phải của người ấy” đều bảo toàn các chi tiết của εἷς τις ἐξ αὐτῶν, ἀρχιερεύς, và τὸ οὖς αὐτοῦ τὸ δεξιόν. “Chém đứt” diễn đạt tự nhiên kết quả của ἀφεῖλεν trong ngữ cảnh thương tích, phù hợp với audit trail tiếng Anh (“cut off”).'
  naturalness: Câu văn rõ, hiện đại và có nhịp kể tự nhiên. “Người ấy” quy chiếu không mơ hồ về người đầy tớ, tránh lặp lại danh từ không cần thiết.
  terminology: “Thượng tế” là thuật ngữ Kinh Thánh chuẩn. Bản chính dùng “đầy tớ” cho δοῦλος, là một lựa chọn Việt ngữ tự nhiên và phù hợp với bản tiếng Anh được cung cấp; chú thích giữ lại khả năng “nô lệ” và giải thích đúng tính đa nghĩa phụ thuộc ngữ cảnh của doulos.
