source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: vi
  text: Một người trong số họ đánh đầy tớ của thượng tế và chém đứt tai phải của người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nô lệ của thượng tế.” Từ Hy Lạp doulos có thể chỉ đầy tớ hoặc nô lệ, tùy ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: đánh
  rationale: Động từ πατάσσω chỉ một cú đánh mạnh. “Đánh” là cách diễn đạt tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; hành động chém đứt được nói rõ ở vế sau.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: một người trong số họ
  rationale: Cụm từ bất định này xác định một người nhưng không nêu danh tính; cách dịch giữ nguyên sự ẩn danh và tự nhiên trong tiếng Việt.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: đầy tớ của thượng tế
  rationale: δοῦλος có thể chỉ đầy tớ hoặc nô lệ. Trong bối cảnh thuộc hạ trong nhà thượng tế, “đầy tớ” là cách gọi tự nhiên trong tiếng Việt, còn sắc thái địa vị nô lệ được ghi ở chú thích.
- source_word: ἀφεῖλεν
  choice: chém đứt
  rationale: ἀφαιρέω có nghĩa rộng là lấy đi hoặc loại bỏ; trong ngữ cảnh bị vũ khí đánh vào tai, “chém đứt” diễn đạt rõ kết quả cụ thể mà không dài dòng.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: tai phải của người ấy
  rationale: Cách dịch giữ đầy đủ bộ phận và phía bị thương. “Người ấy” làm rõ đại từ chỉ người đầy tớ mà không gây nhầm với người ra tay.
theological_decisions:
- issue: Cách dịch δοῦλος
  choice: đầy tớ
  alternative: nô lệ
  rationale: Từ Hy Lạp có thể mô tả người phục dịch hoặc người ở địa vị nô lệ. Chính câu này không xác định chi tiết pháp lý về địa vị của người ấy; vì vậy bản chính dùng “đầy tớ” theo ngữ cảnh, đồng thời chú thích “nô lệ” để bảo lưu sắc thái xã hội có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thượng tế” cho ἀρχιερεύς theo cách gọi Kinh Thánh quen thuộc; tránh lối cổ như “đoạn” hoặc “bèn”.
