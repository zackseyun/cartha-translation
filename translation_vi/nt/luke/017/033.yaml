revisions:
- from: Ai tìm cách giữ mạng sống mình thì sẽ mất, còn ai mất mạng sống mình thì sẽ giữ cho nó sống.[a]
  to: Ai tìm cách giữ lấy mạng sống mình[a] thì sẽ mất nó; còn ai mất mạng sống mình thì sẽ bảo toàn được nó.[b]
  rationale: Thay “sẽ giữ cho nó sống” bằng “sẽ bảo toàn được nó” để câu tiếng Việt tự nhiên, đồng thời vẫn chuyển đạt ζωογονήσει là giữ mạng sống ấy còn sống. “Giữ lấy” làm rõ sắc thái cố giữ cho mình của περιποιήσασθαι. Các chú thích làm rõ hai lựa chọn từ vựng có liên quan mà không áp đặt diễn giải thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:39Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc khái quát–đối lập của ὃς ἐὰν ... ὃς δ’ ἄν, hiểu ψυχή là “mạng sống,” và giữ nghịch lý giữa việc cố bảo toàn, đánh mất, rồi được giữ sống. Tuy nhiên, “giữ cho nó sống” tuy sát chữ ζωογονήσει lại không tự nhiên trong tiếng Việt và khiến đại từ “nó” có sắc thái không phù hợp khi chỉ “mạng sống.” “Bảo toàn được nó” diễn đạt tự nhiên hơn ý giữ cho còn sống, mà không đồng nhất động từ này với “cứu.”
  naturalness: “Ai ... còn ai ...” và “mạng sống mình” phù hợp tiếng Việt hiện đại. Cần thay cụm cuối bằng một cách diễn đạt tự nhiên hơn; thêm “lấy” ở vế đầu cũng làm rõ sắc thái chủ ý/tư lợi của περιποιήσασθαι.
  terminology: “Mạng sống” là lựa chọn đúng ngữ cảnh cho ψυχή, không áp đặt nghĩa “linh hồn.” “Bảo toàn” thích hợp cho ζωογονέω trong văn cảnh này; chú thích giữ khả năng diễn đạt sát chữ “làm cho sống/giữ sống.”
  issues:
  - severity: medium
    issue: Cụm “sẽ giữ cho nó sống” không tự nhiên và có quy chiếu đại từ gượng.
    rationale: Trong tiếng Việt hiện đại, “giữ cho nó sống” thường dùng cho một sinh thể hơn là “mạng sống”; dù sát hình thức Hy Lạp, câu gây vấp và làm mờ ý “giữ mạng sống ấy còn sống.”
  - severity: low
    issue: Chú thích chưa nêu lựa chọn từ vựng “linh hồn” cho ψυχή.
    rationale: Bản dịch “mạng sống” là đúng, nhưng một chú thích ngắn giúp minh bạch lựa chọn có ý nghĩa từ vựng này, tương ứng với hồ sơ tiếng Anh.
