source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: vi
  text: Ai tìm cách giữ lấy mạng sống mình[a] thì sẽ mất nó; còn ai mất mạng sống mình thì sẽ bảo toàn được nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “linh hồn”; trong ngữ cảnh này, từ Hy Lạp (ψυχή) nhiều khả năng chỉ mạng sống hay chính bản thân người ấy.
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp có nghĩa là “làm cho sống” hoặc “giữ sống”; cũng có thể dịch là “sẽ giữ cho nó được sống.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: tìm cách
  rationale: Diễn tả sự chủ ý và nỗ lực nhằm đạt mục tiêu, tự nhiên hơn lối dịch đơn thuần là “tìm” trong ngữ cảnh này.
- source_word: ψυχὴν
  choice: mạng sống
  rationale: Trong lời nói nghịch lý này, từ ấy chỉ sự sống hay chính bản thân một người trước nguy cơ mất mạng, chứ không nhất thiết chỉ phần linh hồn phi vật chất.
- source_word: περιποιήσασθαι
  choice: giữ
  rationale: Truyền đạt ý bảo toàn hay giữ lại cho mình; cách nói ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: sẽ mất / mất
  rationale: Giữ nguyên sự đối xứng và nghịch lý của hai vế, không diễn giải thêm thành tự nguyện từ bỏ hay bị hủy diệt.
- source_word: ζῳογονήσει
  choice: sẽ giữ cho nó sống
  rationale: Phản ánh nghĩa cụ thể là làm cho sống hoặc giữ sống, thay vì đồng nhất với động từ thông thường mang nghĩa “cứu”.
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Ai ... còn ai
  rationale: Thể hiện điều kiện khái quát và sự tương phản giữa hai vế bằng cấu trúc tiếng Việt tự nhiên.
theological_decisions:
- issue: Nghĩa của ψυχή trong lời nói nghịch lý
  choice: Dịch là “mạng sống”
  alternative: “linh hồn” hoặc “sự sống”
  rationale: Ngữ cảnh nói về việc cố bảo toàn hay đánh mất chính mạng sống mình trong thời điểm phán xét. “Mạng sống” không áp đặt quan niệm phân đôi thân thể–linh hồn.
- issue: Cách dịch ζῳογονήσει
  choice: “sẽ giữ cho nó sống”
  alternative: “sẽ cứu được mạng sống ấy” hoặc “sẽ bảo toàn nó”
  rationale: Động từ Hy Lạp nhấn mạnh việc giữ sống/làm cho sống và không phải động từ thường dùng cho “cứu”; cách dịch này duy trì nét nghĩa riêng và sức căng của nghịch lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Mạng sống mình” giữ sắc thái khái quát, không đánh dấu giới tính; “còn” biểu thị rõ sự tương phản. Đại từ “nó” quy chiếu về “mạng sống” và giúp giữ nét diễn đạt cụ thể của động từ cuối câu.
