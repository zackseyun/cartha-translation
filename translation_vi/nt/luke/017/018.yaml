  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: vi
  text: Ngoài người ngoại quốc này ra, chẳng thấy ai trở lại để tôn vinh Đức Chúa Trời sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người thuộc dân khác này” hoặc “người xa lạ này”; từ Hy Lạp chỉ một người ngoại quốc, tức người ở ngoài dân Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: Không tìm thấy ai
  rationale: Diễn đạt tự nhiên cấu trúc bị động aorist trong câu hỏi tu từ, đồng thời giữ ý rằng không có người nào khác được thấy là đã trở lại.
- source_word: ὑποστρέψαντες
  choice: trở lại
  rationale: Chuyển tải hành động quay trở lại, đi trước và gắn với việc tôn vinh Đức Chúa Trời.
- source_word: δοῦναι δόξαν
  choice: để tôn vinh
  rationale: Diễn đạt tự nhiên thành ngữ 'trao sự vinh hiển', vẫn giữ trọng tâm là quy vinh hiển cho Đức Chúa Trời.
- source_word: τῷ θεῷ
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: εἰ μὴ
  choice: ngoài ... sao?
  rationale: Thể hiện quan hệ loại trừ 'ngoại trừ' trong một câu hỏi tu từ tự nhiên.
- source_word: ἀλλογενής
  choice: người ngoại quốc
  rationale: Chỉ người thuộc một dân khác, là người ở ngoài cộng đồng Israel; cách dịch này giữ sắc thái dân tộc-xã hội mà không diễn giải quá mức.
- source_word: οὗτος
  choice: này
  rationale: Giữ sự nhấn mạnh của đại từ chỉ định đối với chính người ngoại quốc đang được nói đến.
theological_decisions:
- issue: Địa vị người ngoài về dân tộc/tôn giáo của người được chữa lành
  choice: người ngoại quốc này
  alternative: người thuộc dân khác này; người xa lạ này
  rationale: Bản văn nhấn mạnh nghịch lý rằng người duy nhất quay lại tôn vinh Đức Chúa Trời là một người ngoài Israel. Không thêm trực tiếp 'người Sa-ma-ri' dù văn cảnh cho biết điều đó, vì câu này dùng từ rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được giữ nguyên; 'tôn vinh' tự nhiên hơn lối dịch sát chữ 'dâng vinh quang' nhưng vẫn bảo toàn ý nghĩa của thành ngữ Hy Lạp.
