  terminology: “Các thầy tế lễ” phù hợp với ἱερεῦσιν và ngữ cảnh Lê-vi Ký. “Thanh sạch” bảo toàn trường nghĩa của καθαρίζω, không thu hẹp thành chỉ “được chữa lành.”
