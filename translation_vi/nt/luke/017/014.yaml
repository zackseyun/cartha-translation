  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: vi
  text: 'Khi thấy họ, Ngài phán: “Hãy đi, trình diện trước các thầy tế lễ.” Trên đường đi, họ được thanh sạch.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ được làm cho sạch.” Động từ Hy Lạp có thể chỉ sự thanh sạch cả về thân thể lẫn nghi lễ.'
    reason: lexical_alternative
  - marker: b
    text: Lệnh trình diện trước các thầy tế lễ phản ánh quy định các thầy tế lễ khám xét người đã được thanh sạch khỏi bệnh ngoài da theo Luật pháp; xem Lê-vi Ký 14.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδὼν
  choice: Khi thấy họ
  rationale: Phân từ bất định của ὁράω được diễn đạt bằng mệnh đề thời gian tự nhiên trong tiếng Việt; “họ” được bổ sung theo ngữ cảnh từ αὐτοῖς.
- source_word: Πορευθέντες
  choice: Hãy đi
  rationale: Phân từ bất định được dùng cùng sắc thái mệnh lệnh với ἐπιδείξατε; cách dịch này tự nhiên và giữ trình tự hành động.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: trình diện
  rationale: Trong bối cảnh các thầy tế lễ phải khám xét, “trình diện” diễn đạt tự nhiên việc đến để họ xem xét, đồng thời hàm chứa ý “cho họ thấy chính mình”.
- source_word: τοῖς ἱερεῦσιν
  choice: với các thầy tế lễ
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt đối với các tư tế thực hiện việc khám xét theo Luật pháp.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: đang khi họ đi
  rationale: Giữ quan hệ đồng thời của cấu trúc Hy Lạp và nhấn mạnh rằng sự thanh sạch xảy ra trên đường họ vâng lời đi.
- source_word: ἐκαθαρίσθησαν
  choice: họ được sạch
  rationale: Thể bị động của καθαρίζω được giữ lại; “được sạch” bảo toàn cả chiều kích thân thể lẫn tình trạng thanh sạch theo nghi lễ, thay vì thu hẹp thành “được chữa lành”.
theological_decisions:
- issue: Ngôn ngữ thanh sạch trong bối cảnh bệnh ngoài da
  choice: họ được sạch
  alternative: họ được chữa lành
  rationale: Động từ Hy Lạp nhấn mạnh sự làm sạch, có thể bao gồm cả sự phục hồi thân thể và tình trạng thanh sạch theo nghi lễ. Bản dịch không thu hẹp ý nghĩa vào việc chữa bệnh đơn thuần.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài phán” để phù hợp văn thể Kinh Thánh tiếng Việt; “trình diện” gọn và tự nhiên trong bối cảnh khám xét của thầy tế lễ. Hai dấu chú thích được đặt sau mệnh đề kết, trong đó [a] giải thích “được sạch” và [b] cung cấp bối cảnh Luật pháp.
