  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và lực mệnh lệnh của câu Hy Lạp: Chúa Giê-su thấy họ, truyền họ đi trình diện với các thầy tế lễ, và sự thanh sạch xảy ra trong khi họ đang đi. Tuy nhiên, “trình diện trước” diễn tả chính xác hơn hướng của ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν, và “được thanh sạch” rõ hơn “được sạch” trong tiếng Việt hiện đại mà vẫn giữ được nét thể chất lẫn nghi lễ của ἐκαθαρίσθησαν.'
