  - severity: medium
    issue: “Họ được sạch” chưa đủ tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
    rationale: Cách nói này có thể bị hiểu theo nghĩa sạch sẽ thông thường. “Họ được thanh sạch” duy trì chiều kích thanh sạch thể chất và nghi lễ của động từ καθαρίζω.
