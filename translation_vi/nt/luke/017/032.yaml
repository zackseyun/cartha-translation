  text: μνημονεύετε τῆς γυναικὸς Λώτ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: vi
  text: Hãy nhớ vợ của Lót.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này gợi đến Sáng Thế Ký 19:26, khi vợ của Lót ngoái nhìn lại trong lúc Sô-đôm bị hủy diệt.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Hãy nhớ
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều. “Hãy nhớ” truyền đạt trực tiếp lời cảnh tỉnh dành cho các môn đồ mà không diễn giải quá mức sắc thái thể của thì hiện tại.
- source_word: τῆς γυναικὸς
  choice: vợ của
  rationale: γυνή có thể nghĩa là “người phụ nữ” hoặc “vợ”; khi đi với tên riêng Λώτ ở sở hữu cách, nghĩa quan hệ “vợ” là rõ ràng. Cấu trúc “vợ của Lót” tự nhiên trong tiếng Việt và bám sát cấu trúc nguồn.
- source_word: Λώτ
  choice: Lót
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Hình thức của lời cảnh báo và sự ám chỉ
  choice: 'Giữ nguyên mệnh lệnh ngắn gọn: “Hãy nhớ vợ của Lót.”'
  alternative: Hãy nhớ đến vợ của Lót.
  rationale: Câu nguồn là một lời cảnh báo cô đọng, gợi lại Sáng Thế Ký 19:26. “Hãy nhớ” giữ được tính trực tiếp; không thêm lời giải thích vào chính văn và để chú thích nêu rõ sự kiện được ám chỉ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Hãy nhớ” cho lời mệnh lệnh trực tiếp; giữ câu ngắn, mạnh như nguyên văn Hy Lạp.
