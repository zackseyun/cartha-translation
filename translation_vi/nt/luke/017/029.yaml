  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: vi
  text: Nhưng vào ngày Lót ra khỏi Sô-đôm, lửa và diêm sinh mưa xuống từ trời và hủy diệt hết mọi người.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Nhưng vào ngày
  rationale: Cụm ở cách dữ liệu có chức năng chỉ thời gian, nghĩa là “vào ngày khi”; δέ biểu thị sự chuyển tiếp có nét tương phản nhẹ với câu trước.
- source_word: ἐξῆλθεν
  choice: ra khỏi
  rationale: Giữ ý chuyển động cụ thể của ἐξέρχομαι và kết hợp tự nhiên với ἀπό trong tiếng Việt.
- source_word: Λὼτ
  choice: Lót
  rationale: Dạng tên riêng quen dùng và dễ nhận biết trong tiếng Việt.
- source_word: ἀπὸ Σοδόμων
  choice: khỏi Sô-đôm
  rationale: Diễn đạt tự nhiên hướng đi ra khỏi địa danh; Sô-đôm là dạng tên địa danh quen thuộc trong tiếng Việt.
- source_word: ἔβρεξεν
  choice: đổ xuống như mưa
  rationale: Động từ βρέχω được dùng theo lối vô nhân xưng với “lửa và diêm sinh” làm đối tượng; cách diễn đạt này giữ hình ảnh mưa mà không thêm một chủ thể hành động không có trong bản Hy Lạp.
- source_word: πῦρ καὶ θεῖον
  choice: lửa và diêm sinh
  rationale: θεῖον chỉ lưu huỳnh; “diêm sinh” vẫn là từ tiếng Việt dễ hiểu trong văn cảnh Kinh Thánh và kết hợp tự nhiên với “lửa”, đồng thời tránh cách nói quá kỹ thuật.
- source_word: ἀπ’ οὐρανοῦ
  choice: từ trời
  rationale: οὐρανός có thể chỉ trời hoặc bầu trời; “từ trời” giữ được thành ngữ Kinh Thánh và sự liên hệ với Sáng Thế Ký 19:24 mà không diễn giải thêm.
- source_word: ἀπώλεσεν πάντας
  choice: hủy diệt tất cả
  rationale: ἀπόλλυμι ở đây có nghĩa là hủy diệt; πάντας chỉ toàn thể những người được hiểu ngầm từ văn cảnh. Tiếng Việt có thể để đối tượng ngầm mà vẫn rõ nghĩa.
theological_decisions:
- issue: Cách dịch θεῖον trong bối cảnh phán xét
  choice: diêm sinh
  alternative: lưu huỳnh
  rationale: “Diêm sinh” giữ sắc thái văn chương Kinh Thánh và hình ảnh phán xét nhưng vẫn có thể hiểu trong tiếng Việt hiện đại; “lưu huỳnh” trực tiếp và khoa học hơn nhưng kém tự nhiên trong cụm này.
- issue: Cách dịch οὐρανός
  choice: trời
  alternative: bầu trời
  rationale: “Trời” giữ thành ngữ Kinh Thánh và tiếng vọng của Sáng Thế Ký, đồng thời không xác quyết quá mức giữa nghĩa không gian “bầu trời” và nghĩa “thiên giới”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Cấu trúc giữ nét tương phản nhẹ của δέ, hình ảnh mưa của ἔβρεξεν và không thêm chủ thể thần học vốn không được nêu rõ trong câu Hy Lạp.
