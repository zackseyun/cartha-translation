id: LUK.17.27
reference: Luke 17:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: vi
  text: Họ cứ ăn, cứ uống, cứ cưới vợ và được gả chồng,[a] cho đến ngày Nô-ê vào tàu; rồi cơn lụt đến và hủy diệt tất cả mọi người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể dịch gọn: “cứ kết hôn và được gả.” Tiếng Hy Lạp dùng hai động từ khác nhau: một động từ chủ động, nghĩa là “cưới vợ,” và một động từ bị động, nghĩa là “được gả chồng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: cứ ăn, cứ uống
  rationale: Các động từ ở thì chưa hoàn thành diễn tả những sinh hoạt đang tiếp diễn hoặc thường xuyên trong quá khứ; từ “cứ” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ἐγάμουν
  choice: cứ cưới vợ lấy chồng
  rationale: Cách nói bao quát, tự nhiên trong tiếng Việt hiện đại, diễn tả việc kết hôn mà không giới hạn vào một giới tính.
- source_word: ἐγαμίζοντο
  choice: được gả cưới
  rationale: Giữ dạng bị động và phân biệt với động từ chủ động đứng trước, dù tiếng Việt cần cách diễn đạt gọn để tránh quá cổ.
- source_word: ἄχρι ἧς ἡμέρας
  choice: cho đến ngày
  rationale: Diễn đạt tự nhiên mốc chấm dứt của chuỗi hoạt động đang tiếp diễn.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Nô-ê vào tàu
  rationale: “Tàu” là cách gọi quen thuộc, dễ hiểu đối với chiếc tàu của Nô-ê; động từ “vào” truyền đạt trực tiếp chuyển động vào bên trong.
- source_word: ὁ κατακλυσμός
  choice: trận lụt
  rationale: Diễn đạt rõ ràng biến cố đại hồng thủy trong ngữ cảnh mà không dùng từ quá cổ.
- source_word: ἀπώλεσεν πάντας
  choice: hủy diệt tất cả họ
  rationale: Giữ sức nặng của động từ và làm rõ đối tượng chỉ người được hàm ý trong πάντας.
theological_decisions:
- issue: Phân biệt hai động từ chỉ hôn nhân
  choice: cứ cưới vợ lấy chồng và được gả cưới
  alternative: cứ cưới gả
  rationale: Bản dịch chính giữ sự phân biệt giữa động từ chủ động ἐγάμουν và động từ bị động ἐγαμίζοντο, không gộp mất kết cấu của nguyên văn.
- issue: Thể của chuỗi động từ mở đầu
  choice: lặp từ “cứ” để diễn tả hoạt động tiếp diễn hoặc thường xuyên
  alternative: 'dùng quá khứ đơn không có dấu hiệu thể: “ăn, uống, cưới...”'
  rationale: Các động từ chưa hoàn thành khắc họa đời sống bình thường vẫn liên tục diễn ra cho đến khi sự phán xét bất ngờ xảy đến.
- issue: Phạm vi của πάντας
  choice: tất cả họ
  alternative: mọi người
  rationale: Đại từ hồi chỉ nhóm người đang được nói đến, đồng thời giữ nguyên tính toàn diện của lời phán xét mà không mở rộng quá mức sang một mệnh đề phổ quát ngoài ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Việc lặp “cứ” tạo nhịp liệt kê, đồng thời thể hiện các động từ chưa hoàn thành. “Được gả cưới” hơi trang trọng nhưng cần thiết để bảo tồn sự đối lập chủ động–bị động của nguyên văn.
