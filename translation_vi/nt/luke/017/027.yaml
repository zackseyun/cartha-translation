    issue: Cụm “cứ cưới vợ lấy chồng và được gả cưới” làm chồng lấn hai động từ hôn nhân.
    rationale: “Cưới vợ lấy chồng” trong tiếng Việt đã bao quát việc kết hôn của cả nam lẫn nữ, trong khi nguyên văn đặt một động từ chủ động cạnh một động từ bị động. “Được gả cưới” lại không phải cụm bị động tự nhiên.
  - severity: low
    issue: “Hủy diệt tất cả họ” hơi gượng trong tiếng Việt hiện đại.
    rationale: πάντας chỉ toàn thể những người trong nhóm đang nói đến; “hủy diệt tất cả mọi người ấy” diễn đạt rõ và tự nhiên hơn.
