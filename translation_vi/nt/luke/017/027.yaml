review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng chuỗi động từ chưa hoàn thành bằng “cứ”, mốc thời gian, việc Nô-ê vào tàu, và sự hủy diệt toàn bộ. Tuy nhiên, “cưới vợ lấy chồng” đã bao gồm cả hai vai trò hôn nhân trong động từ chủ động, nên làm mờ sự đối lập với động từ bị động ἐγαμίζοντο. “Được gả cưới” cũng không phải là cách nói tự nhiên cho bị động này.
  naturalness: Cấu trúc liệt kê với “cứ” tự nhiên và có nhịp. “Được gả chồng” là cách diễn đạt hiện đại, rõ nghĩa hơn “được gả cưới”; “tất cả mọi người ấy” tự nhiên và minh thị hơn “tất cả họ” sau động từ “hủy diệt.”
  terminology: Giữ “Nô-ê” và “tàu” phù hợp văn phong hiện đại. “Cơn lụt” dịch trực tiếp κατακλυσμός trong ngữ cảnh Nô-ê; không cần thêm diễn giải. Cặp “cưới vợ / được gả chồng” giữ được sự phân biệt chủ động–bị động của tiếng Hy Lạp mà không gộp chúng thành một cụm chung.
  issues:
