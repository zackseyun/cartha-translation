  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: vi
  text: Và như đã xảy ra trong những ngày của Nô-ê, thì trong những ngày của Con Người[a] cũng sẽ như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Danh xưng Hy Lạp thường được dịch là “Con Người” có thể gợi đến Đa-ni-ên 7; bản dịch giữ cách gọi quen thuộc này để bảo toàn âm hưởng Mê-si-a và khải huyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: như
  rationale: Mở đầu phép so sánh tương ứng; kết cấu “như… thì… cũng…” truyền đạt rõ quan hệ giữa hai vế trong tiếng Việt.
- source_word: ἐγένετο
  choice: đã xảy ra
  rationale: Giữ nghĩa sự việc đã diễn ra trong thời Nô-ê, đồng thời tự nhiên hơn lối diễn đạt cổ “đã xảy đến”.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: trong những ngày của Nô-ê
  rationale: Bám sát thành ngữ thời gian của nguyên văn và duy trì sự song hành với “những ngày của Con Người” ở vế sau.
- source_word: οὕτως
  choice: như vậy
  rationale: Chỉ sự tương ứng với tình trạng vừa được nhắc đến, tự nhiên trong kết cấu so sánh tiếng Việt.
- source_word: ἔσται
  choice: sẽ … như vậy
  rationale: Giữ thì tương lai và sắc thái khái quát của động từ “sẽ là”, không tự ý xác định cụ thể điều gì sẽ xảy ra.
- source_word: καὶ
  choice: cũng
  rationale: Giữ lực bổ sung của καί trong vế sau và tạo cặp tương ứng tự nhiên “thì… cũng…”.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Đây là danh xưng quen thuộc của Chúa Giê-su trong các sách Phúc Âm; cách dịch này giữ hình thức và âm hưởng Đa-ni-ên 7 mà không diễn giải quá mức.
theological_decisions:
- issue: Cách dịch danh xưng τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Người Thuộc Về Nhân Loại
  rationale: “Con Người” là danh xưng đã được xác lập trong tiếng Việt, vừa bảo toàn hình thức của tiếng Hy Lạp vừa giữ âm hưởng Cứu thế và khải huyền có thể liên hệ đến Đa-ni-ên 7. Phương án khác làm rõ yếu tố nhân loại nhưng dễ biến danh xưng thành lời giải nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “Và” cùng cấu trúc song hành “trong những ngày…” của nguyên văn; dùng kết cấu tiếng Việt “như… thì… cũng…” để phép so sánh được rõ ràng.
