source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: vi
  text: Sẽ có hai phụ nữ xay cùng nhau[a]; một người sẽ được đem đi[b], còn người kia sẽ bị để lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “xay tại cùng một nơi.” Cụm từ Hy Lạp có thể mang nghĩa “cùng nhau” hoặc “tại cùng một nơi.”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “sẽ được đem đi” tự nó không cho biết người ấy được đem đi để được cứu hay để chịu phán xét; tiếng Hy Lạp để điều này ngỏ cho ngữ cảnh rộng hơn.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: Sẽ có
  rationale: Động từ εἰμί ở thì tương lai mở ra khung cảnh; “sẽ có” tự nhiên trong tiếng Việt và giữ nguyên ý tương lai.
- source_word: δύο ... ἀλήθουσαι
  choice: hai người phụ nữ ... xay
  rationale: δύο tự nó là “hai”, còn phân từ giống cái số nhiều ἀλήθουσαι cho biết hai người này là phụ nữ. “Xay” diễn đạt trực tiếp hoạt động nghiền hạt mà không thêm một tân ngữ không được nói rõ.
- source_word: ἐπὶ τὸ αὐτό
  choice: cùng
  rationale: Cụm này có thể chỉ việc ở cùng nhau hoặc tại cùng một nơi; “cùng” tự nhiên trong ngữ cảnh hai người làm chung một công việc, đồng thời chú thích giữ lại khả năng nghĩa chỉ địa điểm.
- source_word: ἡ μία
  choice: một người
  rationale: Cách nói này phân biệt một người trong số hai người; “một người” là cách diễn đạt rõ ràng và tự nhiên trong tiếng Việt.
- source_word: παραλημφθήσεται
  choice: sẽ được đem đi
  rationale: Thể bị động tương lai của παραλαμβάνω diễn tả một người được đưa hoặc đem đi. Cách dịch này không tự xác định việc ấy là để được cứu hay chịu phán xét.
- source_word: ἡ δὲ ἑτέρα
  choice: còn người kia
  rationale: δέ tạo thế tương phản, còn ἑτέρα chỉ người thứ hai; “còn người kia” thể hiện sự đối chiếu tự nhiên trong tiếng Việt.
- source_word: ἀφεθήσεται
  choice: sẽ bị để lại
  rationale: Thể bị động tương lai của ἀφίημι ở đây mang nghĩa bị để lại. “Bị để lại” giữ rõ thế đối lập với “được đem đi” mà không thêm ý “bỏ rơi”.
theological_decisions:
- issue: Việc người được đem đi và người bị để lại tương ứng với sự cứu rỗi hay sự phán xét
  choice: 'Giữ cách nói trung tính: “một người sẽ được đem đi, còn người kia sẽ bị để lại.”'
  alternative: Diễn giải người được đem đi là được cứu, hoặc là bị đem đi để chịu phán xét.
  rationale: Bản thân câu Hy Lạp chỉ nói đến sự phân cách, không xác định rõ giá trị thần học của mỗi kết quả. Vì vậy bản dịch không nên giải quyết thay cho ngữ cảnh rộng hơn một vấn đề vẫn còn có thể được hiểu theo nhiều hướng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ cấu trúc đối xứng của nguyên văn; dùng “người phụ nữ” để thể hiện giống cái hàm chứa trong phân từ Hy Lạp. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
