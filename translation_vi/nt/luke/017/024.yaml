id: LUK.17.24
reference: Luke 17:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: vi
  text: Vì như tia chớp lóe lên từ một phía dưới bầu trời đến phía kia dưới bầu trời,[a] và chiếu sáng, thì Con Người cũng sẽ như vậy trong ngày của mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Có thể diễn đạt tự nhiên hơn: “từ đầu trời này đến đầu trời kia.” Tiếng Hy Lạp lặp lại cụm “dưới bầu trời” ở cả hai vế.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vào ngày của mình.” Cụm từ này chỉ thời điểm gắn với Con Người và được giữ với nghĩa rộng như trong nguyên văn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Vì như
  rationale: Giữ cả sắc thái giải thích của γάρ lẫn cấu trúc so sánh của ὥσπερ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀστραπὴ ἀστράπτουσα
  choice: tia chớp lóe lên
  rationale: Dùng “tia chớp” cho danh từ và “lóe lên” cho phân từ cùng gốc, giữ hình ảnh sống động mà không tạo lối diễn đạt nặng nề.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν ... εἰς τὴν ὑπ’ οὐρανόν
  choice: từ vùng này dưới bầu trời đến vùng kia dưới bầu trời
  rationale: Giữ sự lặp lại có chủ ý của cụm “dưới bầu trời” trong tiếng Hy Lạp và bổ sung “vùng này/vùng kia” để câu có thể hiểu được trong tiếng Việt.
- source_word: λάμπει
  choice: chiếu sáng
  rationale: Phân biệt động từ này với ἀστράπτουσα (“lóe lên”), qua đó giữ hai hành động liên hệ nhưng không hoàn toàn đồng nhất trong nguyên văn.
- source_word: οὕτως ἔσται
  choice: cũng sẽ như vậy
  rationale: Thể hiện rõ vế kết của phép so sánh và thì tương lai bằng lối nói tự nhiên.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng truyền thống và minh bạch của Đức Giê-su, không diễn giải thành một căn tính hay vai trò cụ thể hơn.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: trong ngày của mình
  rationale: Giữ giới từ “trong” và ý sở hữu của αὐτοῦ, đồng thời dùng đại từ phản thân để quy chiếu tự nhiên về “Con Người” mà không thêm nội dung như sự quang lâm hay phán xét.
theological_decisions:
- issue: Ý nghĩa của “Con Người trong ngày của mình” trong bối cảnh cánh chung
  choice: Giữ cách nói rộng “trong ngày của mình”.
  alternative: “khi Con Người quang lâm”, “trong ngày phán xét”, hoặc “vào ngày của Con Người”
  rationale: Nguyên văn chỉ nói ἐν τῇ ἡμέρᾳ αὐτοῦ. Không mở rộng thành sự quang lâm hay ngày phán xét, nhằm bảo toàn độ mở và sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc so sánh, phân biệt “lóe lên” với “chiếu sáng,” đồng thời chấp nhận đôi chút khác thường trong cụm lặp “dưới bầu trời” để phản ánh hình thức nguyên văn; chú thích cung cấp cách nói thuần Việt hơn.
