id: LUK.17.25
reference: Luke 17:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: vi
  text: Nhưng trước hết, người phải chịu nhiều đau khổ và bị thế hệ này khước từ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: trước hết
  rationale: Trạng từ chỉ thứ tự thời gian; “trước hết” tự nhiên trong tiếng Việt và giữ rõ điều phải xảy ra trước các sự kiện vừa được nói đến.
- source_word: δὲ
  choice: Nhưng
  rationale: Ở đây δέ biểu thị sự chuyển ý có sắc thái tương phản nhẹ; “Nhưng” nối tự nhiên với văn cảnh trước.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt tính tất yếu một cách ngắn gọn, đồng thời không giải thích thêm rằng sự tất yếu ấy trực tiếp do ý định của Đức Chúa Trời.
- source_word: αὐτὸν
  choice: người
  rationale: Đại từ chỉ Con Người trong văn cảnh. Viết thường để tránh tự thêm một tước hiệu hoặc cách hiểu thần học không được hình thức đại từ Hy Lạp tự nó xác định.
- source_word: πολλὰ παθεῖν
  choice: chịu nhiều đau khổ
  rationale: πολλά là đối tượng trung tính số nhiều của παθεῖν. Tiếng Việt tự nhiên diễn đạt cả cụm là “chịu nhiều đau khổ”, giữ được phạm vi rộng và sức nặng của những điều người sẽ trải qua.
- source_word: ἀποδοκιμασθῆναι
  choice: bị ... khước từ
  rationale: Động từ nói đến việc bị bác bỏ sau khi bị xem xét. “Khước từ” trang trọng vừa phải, rõ nghĩa và phù hợp với ngữ cảnh.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: bị thế hệ này ...
  rationale: Với động từ bị động, ἀπό có thể nêu tác nhân hoặc nguồn của sự khước từ. Cấu trúc tiếng Việt dùng “bị” trước tác nhân là tự nhiên; “thế hệ này” giữ nguyên quy chiếu đến những người đương thời.
theological_decisions:
- issue: Sắc thái của δεῖ đối với sự chịu khổ của Con Người
  choice: Dịch là “phải” để giữ tính tất yếu mà không nói rõ trong câu rằng đó là sắc lệnh hay kế hoạch của Đức Chúa Trời.
  alternative: “cần phải”; hoặc diễn giải thành “theo kế hoạch của Đức Chúa Trời, người phải”
  rationale: Lu-ca thường dùng δεῖ cho những biến cố phù hợp với mục đích thần thượng, nhất là trong các lời báo trước cuộc thương khó. Bản dịch giữ sức nặng thần học ấy ở dạng hàm ẩn, không thêm lời giải thích ngoài câu.
- issue: Quy chiếu của αὐτόν
  choice: Dùng “người”, dựa vào tiền ngữ “Con Người” trong văn cảnh.
  alternative: “Ngài” hoặc lặp lại “Con Người”
  rationale: Nguyên văn dùng đại từ, không lặp tước hiệu. “Người” bảo toàn liên kết với tiền ngữ mà không tự thêm sắc thái tôn xưng vào chính đại từ này.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu giữ trật tự nhấn mạnh “trước hết”, đồng thời duy trì sự cô đọng của nguyên văn Hy Lạp.
