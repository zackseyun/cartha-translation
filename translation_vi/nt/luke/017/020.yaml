source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: vi
  text: 'Khi những người Pha-ri-si hỏi Đức Giê-su bao giờ vương quốc Đức Chúa Trời đến, Ngài đáp lời họ rằng: “Vương quốc Đức Chúa Trời không đến theo cách người ta có thể quan sát được[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với sự quan sát,” “theo cách có thể nhận thấy được,” hoặc “với sự theo dõi kỹ lưỡng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Khi những người Pha-ri-si hỏi Đức Giê-su
  rationale: Chuyển cấu trúc phân từ bị động Hy Lạp sang mệnh đề chủ động tự nhiên trong tiếng Việt; tác nhân là người Pha-ri-si, còn chủ thể được hỏi được làm rõ từ ngữ cảnh là Đức Giê-su. δέ là liên từ chuyển ý nhẹ và không cần biểu đạt riêng ở đầu câu.
- source_word: πότε ἔρχεται
  choice: bao giờ ... đến
  rationale: Diễn đạt trực tiếp câu hỏi về thời điểm. Thì hiện tại Hy Lạp có hướng tương lai, và tiếng Việt không cần đánh dấu thì bằng một từ riêng.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch rõ nghĩa, trang trọng và quen thuộc, giữ hình ảnh về quyền trị vì cùng thực tại vương quốc mà không thu hẹp vào một ý niệm trừu tượng.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: Ngài đáp lời họ rằng
  rationale: Diễn đạt tự nhiên trong tiếng Việt và phản ánh chức năng của cả hai động từ Hy Lạp mà không tạo sự lặp vụng về kiểu 'đáp và nói'.
- source_word: Οὐκ ἔρχεται
  choice: không đến
  rationale: Giữ dạng phát biểu hiện tại mang tính khái quát về cách vương quốc đến.
- source_word: μετὰ παρατηρήσεως
  choice: theo cách người ta có thể quan sát được
  rationale: παρατήρησις chỉ sự quan sát, theo dõi hoặc xem xét kỹ. Cách dịch này giữ độ rộng nghĩa tốt hơn việc thêm danh từ 'dấu hiệu', vốn không có trực tiếp trong nguyên văn.
theological_decisions:
- issue: Ý nghĩa lời phủ định của Đức Giê-su về cách vương quốc đến
  choice: Không đến theo cách người ta có thể quan sát hoặc theo dõi được
  alternative: Không đến với những dấu hiệu có thể quan sát được
  rationale: Bản dịch giữ sự mơ hồ thực sự của μετὰ παρατηρήσεως giữa 'sự quan sát', 'cách có thể quan sát' và 'sự theo dõi kỹ', đồng thời không biến câu này thành lời phủ định tuyệt đối mọi dấu hiệu cánh chung.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su”, “Ngài” và “Đức Chúa Trời” nhất quán; cấu trúc câu được Việt hóa tự nhiên nhưng không giải thích quá mức ý nghĩa thần học.
