    rationale: μετά với sở hữu cách ở đây có nghĩa “với/kèm theo” hoặc “theo cách có thể được quan sát/theo dõi”, không phải “bằng” theo nghĩa phương tiện. Chú thích nên giữ các khả năng từ vựng mà không làm lệch quan hệ cú pháp.
