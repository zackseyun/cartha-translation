  source_fidelity: Bản dịch giữ đúng cấu trúc tương lai, cặp đối lập “một người/người kia”, và không quyết định ý nghĩa cứu rỗi hay phán xét của παραλημφθήσεται. Tuy nhiên, “các con” không có trong nguyên văn và thu hẹp người nghe thành quan hệ cha-con; ὑμῖν chỉ là ngôi thứ hai số nhiều.
  naturalness: “Ta nói với các con” pha trộn lối xưng hô cổ/trang trọng với cách gọi quan hệ, không phù hợp nhất với tiếng Việt chuẩn hiện đại. “Tôi nói với anh em” tự nhiên, trang trọng và vẫn trực tiếp. Phần còn lại nhìn chung rõ ràng, nhịp câu tốt.
  terminology: “Được đưa đi” và “bị để lại” duy trì được thế bị động và tính trung tính cánh chung của hai động từ. “Giường” phù hợp κλίνη trong ngữ cảnh ban đêm. Không cần thêm diễn giải về cứu rỗi hay phán xét.
