source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: vi
  text: 'Tôi nói với anh em: Đêm ấy, sẽ có hai người trên cùng một chiếc giường; một người sẽ được đưa đi[a], còn người kia sẽ bị để lại[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ được đem theo”. Động từ παραλημφθήσεται tự nó không cho biết ở đây người ấy được đưa đi để được giải cứu hay để chịu phán xét.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ bị bỏ lại”. Bản văn chính dùng “bị để lại” để tránh đưa vào câu những liên tưởng cánh chung về sau vốn không được nói rõ trong tiếng Hy Lạp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Giữ công thức phát ngôn trực tiếp và sắc thái nhấn mạnh; đại từ số nhiều của ὑμῖν được thể hiện bằng “các con” trong lời Đức Giê-su nói với các môn đồ.
- source_word: ταύτῃ τῇ νυκτί
  choice: trong đêm ấy
  rationale: Diễn đạt tự nhiên một thời điểm ban đêm cụ thể đang được nói đến, đồng thời giữ chỉ định từ “ấy” của ταύτῃ.
- source_word: ἔσονται δύο
  choice: sẽ có hai người
  rationale: Cấu trúc hiện hữu tự nhiên trong tiếng Việt, giữ thì tương lai và làm rõ rằng hai đối tượng là người.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: trên cùng một chiếc giường
  rationale: κλίνη có thể là giường hoặc trường kỷ; bối cảnh ban đêm ủng hộ “giường”. “Cùng một” diễn đạt rõ cả hai ở trên một chiếc giường.
- source_word: παραλημφθήσεται
  choice: sẽ được đưa đi
  rationale: Diễn đạt thể bị động tương lai và ý được đưa hoặc đem theo, nhưng không xác định việc ấy nhằm giải cứu hay xét xử.
- source_word: ὁ ἕτερος
  choice: người kia
  rationale: Tạo thế đối chiếu tự nhiên với “một người” trong cặp hai người.
- source_word: ἀφεθήσεται
  choice: sẽ bị để lại
  rationale: Trong thế đối lập với παραλημφθήσεται, ἀφίημι mang nghĩa để lại, không phải tha thứ. Cách dịch ngắn gọn này tránh tự động gắn câu với một hệ thống cánh chung về việc “bị bỏ lại phía sau”.
theological_decisions:
- issue: Người được đưa đi là người được cứu hay người chịu phán xét
  choice: 'Giữ trung tính: “một người sẽ được đưa đi, còn người kia sẽ bị để lại”'
  alternative: Giải thích người được đưa đi là được giải cứu, hoặc ngược lại là bị đưa đi chịu phán xét
  rationale: Bản thân hai động từ Hy Lạp trong câu này không xác định kết quả thần học của mỗi người; bản dịch không áp đặt một mô hình cánh chung cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc song song “một người… người kia…” giữ nhịp đối lập của nguyên văn. Các dấu chú thích được đặt ngay sau những động từ mà chú thích giải thích.
