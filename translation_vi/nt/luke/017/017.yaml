revisions:
- from: 'Bấy giờ Đức Giê-su lên tiếng: “Chẳng phải mười người đều đã được sạch[a] sao? Thế còn chín người kia đâu?”'
  to: 'Bấy giờ Đức Giê-su đáp: “Chẳng phải mười người đã được làm sạch[a] sao? Thế còn chín người kia đâu?”'
  rationale: Thay “lên tiếng” bằng “đáp” để phản ánh trực tiếp công thức dẫn lời ἀποκριθεὶς ... εἶπεν. Thay “được sạch” bằng “được làm sạch” vì tự nhiên và minh bạch hơn trong tiếng Việt hiện đại, nhưng vẫn bảo toàn sắc thái thanh sạch của nguyên ngữ. Không thêm “đều/cả” để tránh tăng cường nhấn mạnh không cần thiết; “mười người” đã chỉ nhóm mười người được nói đến trong ngữ cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:33Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng hai câu hỏi tu từ và tương phản giữa nhóm mười người với chín người còn lại. Tuy nhiên, “lên tiếng” chỉ diễn tả việc bắt đầu nói, chưa chuyển tải rõ công thức ἀποκριθεὶς ... εἶπεν là lời đáp lại. “Được sạch” có thể hiểu được trong văn phong Kinh Thánh, nhưng “được làm sạch” rõ nghĩa và tự nhiên hơn trong tiếng Việt hiện đại, đồng thời vẫn giữ được cách dùng bị động và trường nghĩa của καθαρίζω.
  naturalness: “Bấy giờ Đức Giê-su lên tiếng” hơi gượng và giảm nét đáp lời của câu. “Đức Giê-su đáp” là lối dẫn lời tự nhiên, trang trọng, và gọn. “Chẳng phải mười người đã được làm sạch sao?” cùng “Thế còn chín người kia đâu?” tự nhiên trong tiếng Việt hiện đại và duy trì sắc thái trách vấn.
  terminology: Giữ “Đức Giê-su” theo đăng ký trang trọng của bản nháp. Dịch καθαρίζω là “được làm sạch” thay vì “được chữa lành” để không thu hẹp nghĩa vào hồi phục thể lý và để bảo lưu sắc thái thanh sạch liên quan đến bối cảnh bệnh phong. Chú thích “được thanh sạch” là một phương án từ vựng phù hợp.
  issues:
  - severity: medium
    issue: “lên tiếng” chưa phản ánh đầy đủ ἀποκριθεὶς.
    rationale: Phân từ ἀποκριθεὶς trong công thức này có nghĩa thành ngữ là “đáp/lời đáp”; “lên tiếng” chỉ nêu hành động phát biểu và không cho thấy Đức Giê-su đang đáp lại tình huống.
  - severity: low
    issue: “đã được sạch” kém tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này có thể được chấp nhận trong lối văn Kinh Thánh truyền thống, nhưng “đã được làm sạch” rõ ràng, trôi chảy hơn và vẫn giữ nghĩa bị động của ἐκαθαρίσθησαν.
