  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: vi
  text: 'Bấy giờ Đức Giê-su đáp: “Chẳng phải mười người đã được làm sạch[a] sao? Thế còn chín người kia đâu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã được thanh sạch.”'
    reason: Nêu cách diễn đạt khác cho καθαρίζω, làm rõ sắc thái thanh sạch mà không giới hạn từ này vào việc khỏi bệnh thể chất.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Bấy giờ Đức Giê-su lên tiếng
  rationale: Cụm phân từ ἀποκριθείς đi với εἶπεν là công thức dẫn lời. “Lên tiếng” chuyển tải tự nhiên việc Đức Giê-su đáp lại tình huống, còn “bấy giờ” thể hiện sắc thái tiếp diễn nhẹ của δέ mà không tạo tương phản quá mạnh.
- source_word: Οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: οὐχί mở đầu câu hỏi tu từ chờ đợi câu trả lời khẳng định; cấu trúc tiếng Việt này giữ nguyên lực tu từ ấy.
- source_word: οἱ δέκα
  choice: mười người
  rationale: Mạo từ cùng số từ chỉ nhóm mười người đã được nhắc đến. Danh từ “người” được thêm vào theo cú pháp tự nhiên của tiếng Việt; “đều” đi với vị ngữ làm rõ rằng lời hỏi bao quát cả nhóm mà không cần thêm ý ngoài văn bản.
- source_word: ἐκαθαρίσθησαν
  choice: đã được sạch
  rationale: Thể thụ động của καθαρίζω có nghĩa là được làm cho sạch. Trong bối cảnh bệnh phong, cách dịch này giữ được cả chiều kích khỏi bệnh lẫn tình trạng thanh sạch, thay vì thu hẹp nghĩa thành “được chữa lành”.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Thế còn chín người kia đâu?
  rationale: δέ ở đây tạo sự tương phản giữa một người quay lại và chín người còn lại. “Thế còn ... đâu?” là câu hỏi tự nhiên trong tiếng Việt, đồng thời giữ sức nặng trách vấn của nguyên văn.
theological_decisions:
- issue: Ý nghĩa của καθαρίζω trong việc chữa người mắc bệnh phong
  choice: đã được sạch
  alternative: đã được chữa lành; đã được thanh tẩy
  rationale: “Được sạch” giữ trường nghĩa cụ thể của καθαρίζω và không xóa đi sự đan xen giữa phục hồi thân thể với tình trạng thanh sạch theo nghi lễ. Cách dịch này cũng không áp đặt một cách giải nghĩa thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; câu hỏi thứ hai ngắn gọn để giữ lực tu từ của nguyên văn.
