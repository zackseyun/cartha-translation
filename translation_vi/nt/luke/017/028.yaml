base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: vi
  text: 'Cũng vậy, như trong thời Lót: người ta ăn, uống, mua, bán, trồng trọt và xây cất.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: Cũng vậy
  rationale: Trạng từ nối ví dụ về Lót với phép so sánh ngay trước đó; cách dịch này ngắn gọn, tự nhiên và giữ rõ ý tương đồng.
- source_word: καθὼς
  choice: như
  rationale: Dẫn vào mệnh đề so sánh về điều đã xảy ra; trong tiếng Việt, “như” đã diễn đạt tự nhiên lực so sánh mà không cần thêm từ.
- source_word: ἐγένετο
  choice: điều đã xảy ra
  rationale: Diễn đạt nghĩa sự kiện của γίνομαι bằng tiếng Việt hiện đại, đồng thời tạo một chủ ngữ tự nhiên cho mệnh đề.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: trong những ngày của Lót
  rationale: Giữ thành ngữ thời gian của nguyên văn, chỉ thời kỳ gắn với Lót, và dùng dạng tên quen thuộc trong tiếng Việt.
- source_word: ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν
  choice: người ta vẫn ăn, uống, mua, bán, trồng trọt và xây cất
  rationale: Các động từ thể chưa hoàn thành mô tả những sinh hoạt bình thường đang tiếp diễn hoặc lặp lại. “Vẫn” cùng chuỗi động từ tự nhiên trong tiếng Việt giữ được nét diễn tiến mà không dùng cấu trúc nặng nề; “trồng trọt” và “xây cất” làm rõ hoạt động nông nghiệp và xây dựng theo nghĩa đen.
