base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: vi
  text: Người sấp mặt xuống dưới chân Đức Giê-su, vừa cảm tạ Ngài. Người ấy là một người Sa-ma-ri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: sấp mặt xuống
  rationale: Diễn đạt tự nhiên tư thế phủ phục được tạo bởi động từ πίπτω kết hợp với thành ngữ ἐπὶ πρόσωπον, đồng thời giữ hình ảnh thân thể cụ thể.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: nơi chân Đức Giê-su
  rationale: Trong bối cảnh kính cẩn này, cụm từ chỉ vị trí phủ phục sát chân Chúa Giê-su. Nêu rõ Đức Giê-su giúp tránh đại từ mơ hồ trong tiếng Việt mà không thêm ý giải thích.
- source_word: εὐχαριστῶν αὐτῷ
  choice: cảm tạ Ngài
  rationale: Phân từ hiện tại diễn tả hành động đi kèm với việc sấp mặt. “Cảm tạ” giữ sắc thái trang trọng và hướng trực tiếp đến Đức Giê-su.
- source_word: Σαμαρίτης
  choice: người Sa-ma-ri
  rationale: Cách gọi dân tộc-tôn giáo quen thuộc trong tiếng Việt, bảo toàn ý nghĩa xã hội và tự sự của căn tính người này.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Người ấy là một người Sa-ma-ri
  rationale: “Người ấy” phản ánh phần nào sự nhấn mạnh của αὐτός; câu đơn giản giữ nguyên nét bất ngờ kín đáo của lời kể.
theological_decisions:
- issue: Sự nhấn mạnh trong lời kể về căn tính của người được chữa lành
  choice: Người ấy là một người Sa-ma-ri
  alternative: Vả, người ấy là người Sa-ma-ri
  rationale: Giữ lời xác nhận ngắn gọn và sự nhấn mạnh của αὐτός, không thêm bình luận về địa vị người ngoài hay ý nghĩa thần học của căn tính ấy.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” để chỉ rõ đối tượng của đại từ Hy Lạp, và “Ngài” làm đại từ kính trọng thông dụng; không thêm chú giải giáo phái.
