    rationale: Cụm “khi có ... mà lúc ... lại bảo” nặng và kém sáng rõ. Đưa mệnh đề thời gian sau “mà” giúp câu hỏi tu từ tự nhiên hơn, đồng thời vẫn giữ quan hệ của ὃς với “có ai trong các ông”.
  - severity: low
    issue: “Chăn bầy” chưa tự nhiên
    rationale: “Chăn đàn” là cách dùng hiện đại quen thuộc hơn. Cách này vẫn giữ tính khái quát của ποιμαίνοντα, không tự ý thêm “chiên” hay một loài vật cụ thể.
