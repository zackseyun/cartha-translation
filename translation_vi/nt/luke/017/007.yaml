  to: '“Có ai trong các ông có một nô lệ[a] đang cày ruộng hoặc chăn đàn mà, khi người ấy từ đồng về, lại bảo người ấy: ‘Hãy đến ngay và nằm xuống dùng bữa[b]’?”'
