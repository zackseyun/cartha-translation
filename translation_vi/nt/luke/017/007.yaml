id: LUK.17.7
reference: Luke 17:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: vi
  text: '“Có ai trong các ông có một nô lệ[a] đang cày ruộng hoặc chăn đàn mà, khi người ấy từ đồng về, lại bảo người ấy: ‘Hãy đến ngay và nằm xuống dùng bữa[b]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đầy tớ” hoặc “tôi tớ”; từ Hy Lạp doulos chỉ người thuộc quyền một người chủ, chứ không phải người làm thuê.
    reason: alternative_reading
  - marker: b
    text: Theo tập tục thời ấy, người ta thường nằm nghiêng khi dùng bữa; diễn đạt thoáng hơn là “ngồi xuống ăn”.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: nô lệ
  rationale: Từ này chỉ một người lao động thuộc quyền chủ, không phải người làm thuê. “Nô lệ” giữ được sự bất cân xứng về địa vị và quyền hành vốn thiết yếu cho câu ví dụ.
- source_word: ἀροτριῶντα
  choice: đang cày ruộng
  rationale: Diễn đạt trực tiếp công việc cày đất; thêm “ruộng” giúp câu tự nhiên trong tiếng Việt mà không làm thay đổi ý nghĩa.
- source_word: ποιμαίνοντα
  choice: chăn bầy
  rationale: Giữ hình ảnh công việc của người chăn mà không tự ý xác định đó là chiên hay một loại gia súc cụ thể.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: lúc người ấy từ ngoài đồng về
  rationale: Phân từ cách cho có chức năng chỉ thời gian; cách dịch này làm rõ nô lệ là người từ đồng trở về mà vẫn giữ trình tự của hành động.
- source_word: ἐρεῖ αὐτῷ
  choice: lại bảo
  rationale: Truyền đạt tự nhiên động từ tương lai trong câu hỏi tu từ; “lại” thể hiện sắc thái đối chiếu do δὲ và cấu trúc câu tạo nên.
- source_word: Εὐθέως
  choice: mau
  rationale: Diễn tả mệnh lệnh phải thực hiện ngay, bằng một từ tự nhiên và trực tiếp trong tiếng Việt.
- source_word: παρελθὼν
  choice: lại đây
  rationale: Trong kết cấu đi kèm mệnh lệnh ἀνάπεσε, phân từ diễn tả động tác tiến đến trước khi vào chỗ dùng bữa.
- source_word: ἀνάπεσε
  choice: nằm xuống dùng bữa
  rationale: Giữ tư thế nằm nghiêng dùng bữa của thế giới cổ đại, đồng thời nêu rõ đây là hành động vào bàn ăn.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh gia hộ của câu ví dụ
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Lập luận dựa trên quyền của chủ đối với người thuộc quyền mình. “Nô lệ” bảo toàn sức nặng xã hội của nguyên ngữ mà không thêm một kết luận thần học ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ được giữ nguyên; cách dùng “có ai… mà… lại” truyền đạt tự nhiên hàm ý rằng người nghe khó có thể trả lời là có. Đại từ “các ông” phù hợp với lời Đức Giê-su nói cùng các sứ đồ trong ngữ cảnh gần.
