  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: vi
  text: Người ấy thà bị buộc một cối đá vào cổ và bị ném xuống biển còn hơn là khiến một trong những người bé mọn này sa ngã.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay cụ thể hơn, “một cối đá lớn”. Cụm từ Hy Lạp có thể chỉ loại cối đá nặng hơn dùng trong cối xay.
    reason: lexical_alternative
  - marker: b
    text: Hay “khiến một trong những người bé mọn này phạm tội”. Động từ Hy Lạp bao hàm ý khiến người khác sa vào tội lỗi hoặc sự hủy hoại thuộc linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: thà ... còn hơn
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý so sánh rằng kết cục được nêu trước là điều tốt hơn cho người ấy.
- source_word: λίθος μυλικὸς
  choice: một cối đá
  rationale: Chỉ tảng đá dùng để xay; cách nói ngắn gọn, dễ hiểu, còn khả năng chỉ loại cối đá lớn được ghi ở chú thích.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: buộc ... vào cổ người ấy
  rationale: Truyền đạt rõ trạng thái hòn đá được đặt và giữ quanh cổ trong giả định so sánh.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: ném xuống biển
  rationale: Diễn đạt tự nhiên hành động bị quăng xuống biển, phù hợp với chuỗi bị động được hiểu trong ngữ cảnh.
- source_word: σκανδαλίσῃ
  choice: khiến ... sa ngã
  rationale: Giữ hình ảnh vấp ngã trong nguyên ngữ và hàm ý dẫn người khác vào tội lỗi hoặc sự hủy hoại thuộc linh.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: một trong những người bé mọn này
  rationale: Không thu hẹp đối tượng thành trẻ em hoặc tín hữu; giữ độ rộng và sự mơ hồ thật sự của nguyên ngữ.
- source_word: ἢ ἵνα
  choice: còn hơn để
  rationale: Thể hiện tự nhiên quan hệ so sánh giữa hai kết cục.
theological_decisions:
- issue: Đối tượng của cụm từ “những người bé mọn này”
  choice: Dịch khái quát là “những người bé mọn này”
  alternative: những trẻ nhỏ này; những môn đồ/tín hữu khiêm nhường này
  rationale: Câu Hy Lạp không xác định rõ họ chỉ là trẻ em hay một nhóm tín hữu; bản dịch không nên tự ý giải quyết vấn đề diễn giải này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “thà ... còn hơn” giữ lực so sánh; “người bé mọn” tránh xác định quá mức đối tượng.
