revisions:
- from: Thà buộc một cối đá vào cổ người ấy rồi ném xuống biển còn hơn để người ấy khiến một trong những người bé mọn này sa ngã.[a][b]
  to: Người ấy thà bị buộc một cối đá vào cổ và bị ném xuống biển còn hơn là khiến một trong những người bé mọn này sa ngã.[a][b]
  rationale: Sửa vế đầu sang bị động để phản ánh trực tiếp các động từ Hy Lạp và làm rõ rằng kết cục ấy xảy đến cho “người ấy.” Giữ “thà ... còn hơn là” để bảo toàn lực so sánh, cùng toàn bộ tính mơ hồ có chủ ý của “những người bé mọn này.” Chú thích a được chỉnh nhẹ cho rõ và tự nhiên hơn, không thay đổi nội dung chú giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp chuyển tải đúng quan hệ so sánh của λυσιτελεῖ ... ἢ ἵνα, hình ảnh cối đá, việc bị ném xuống biển, và giữ không xác định quá mức cụm τῶν μικρῶν τούτων. Tuy nhiên, mệnh đề đầu hiện dùng dạng chủ động vô nhân xưng (“buộc ... rồi ném”), trong khi nguyên ngữ mô tả điều xảy đến cho “người ấy” bằng các hình thức bị động.
  naturalness: Cấu trúc “Thà buộc ... rồi ném xuống biển còn hơn để người ấy...” làm chủ thể của các động từ đầu không rõ và kém cân xứng với “người ấy” ở vế sau. Dùng “người ấy thà bị buộc ... và bị ném ... còn hơn là...” vừa tự nhiên vừa rõ nghĩa.
  terminology: “Cối đá,” “người bé mọn,” và “sa ngã” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. “Người bé mọn” giữ được độ mở của μικροί, không ép nghĩa là trẻ em hay một nhóm tín hữu xác định.
  issues:
  - severity: medium
    issue: Động từ bị động trong nguyên ngữ chưa được thể hiện rõ ở vế so sánh thứ nhất.
    rationale: περίκειται và ἔρριπται mô tả cối đá ở quanh cổ người ấy và người ấy đã bị ném xuống biển. Bản nháp “buộc ... rồi ném” có thể đọc như một mệnh lệnh hay hành động chủ động không xác định chủ thể, thay vì điều xảy đến cho người ấy.
  revised_text: Người ấy thà bị buộc một cối đá vào cổ và bị ném xuống biển còn hơn là khiến một trong những người bé mọn này sa ngã.[a][b]
