  terminology: “Đức Giê-su,” “Giê-ru-sa-lem,” “Sa-ma-ri,” và “Ga-li-lê” nhất quán, dễ hiểu, và phù hợp cách phiên âm đang dùng. Không có vấn đề thuật ngữ thần học.
