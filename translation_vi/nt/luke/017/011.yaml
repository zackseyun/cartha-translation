id: LUK.17.11
reference: Luke 17:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: vi
  text: Trên đường đi lên Giê-ru-sa-lem, Đức Giê-su đang đi qua giữa Sa-ma-ri và Ga-li-lê.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là đi qua vùng giáp ranh giữa Sa-ma-ri và Ga-li-lê. Cụm từ Hy Lạp có thể chỉ việc đi giữa hai miền hoặc qua khu vực biên giới phân cách chúng.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν τῷ πορεύεσθαι
  choice: Trên đường đi
  rationale: Cụm dẫn chuyện của Lu-ca cùng kết cấu ἐν + động từ nguyên mẫu có mạo từ diễn tả hoàn cảnh đồng thời. Tiếng Việt tự nhiên có thể gộp thành “Trên đường đi”, vẫn giữ ý hành trình đang diễn ra mà tránh lối dịch nặng “Và xảy ra rằng”.
- source_word: εἰς Ἰερουσαλήμ
  choice: lên Giê-ru-sa-lem
  rationale: εἰς chỉ đích đến. “Đi lên Giê-ru-sa-lem” là cách nói tự nhiên, phù hợp địa thế và cách diễn đạt quen thuộc về hành trình đến thành này.
- source_word: αὐτός
  choice: Đức Giê-su
  rationale: Đại từ chỉ nhân vật chính trong mạch văn; nêu lại tên giúp câu đứng riêng rõ nghĩa trong tiếng Việt mà không thêm sự nhấn mạnh của “chính Người”.
- source_word: διήρχετο
  choice: đi qua
  rationale: Thì chưa hoàn thành diễn tả chuyển động đang tiếp diễn; “đi qua” là cách diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: qua vùng giáp ranh giữa Sa-ma-ri và Ga-li-lê
  rationale: διὰ μέσον với hai địa danh có thể chỉ khu vực ở giữa hoặc đi xuyên qua vùng trung gian. Cách dịch chính nêu rõ ý vùng biên mà không hàm ý Đức Giê-su đi xuyên qua toàn bộ cả hai miền.
theological_decisions:
- issue: Ý nghĩa địa lý của διὰ μέσον
  choice: vùng giáp ranh giữa Sa-ma-ri và Ga-li-lê
  alternative: qua giữa miền Sa-ma-ri và miền Ga-li-lê
  rationale: Cú pháp Hy Lạp có thể được hiểu là đi giữa hai vùng hoặc qua khu vực biên giới của chúng. Bản dịch chính chọn cách nói tự nhiên về vùng giáp ranh, còn chú thích bảo lưu khả năng hiểu rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể trong câu độc lập; phiên âm địa danh theo lối Việt hóa thông dụng. Chú thích giữ lại sự mơ hồ địa lý của nguyên văn.
