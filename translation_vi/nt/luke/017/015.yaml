  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: vi
  text: Nhưng một người trong số họ, khi thấy mình đã được chữa lành, quay lại, lớn tiếng tôn vinh Đức Chúa Trời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ca ngợi Đức Chúa Trời.” Động từ Hy Lạp có thể mang nghĩa “tôn vinh” hoặc “dâng lời ca ngợi, quy vinh quang cho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Nhưng một người trong số họ
  rationale: Cụm εἷς ἐξ αὐτῶν mang nghĩa phân bộ rõ ràng là “một người trong số họ”; δέ tạo sự tương phản nhẹ với chín người còn lại nên dịch là “Nhưng”.
- source_word: ἰδὼν ὅτι ἰάθη
  choice: khi thấy mình đã được chữa lành
  rationale: Cách diễn đạt này truyền đạt tự nhiên quan hệ thời gian của phân từ bất định ἰδών và tình trạng chữa lành đã hoàn tất của ἰάθη, đồng thời không làm thay đổi chủ thể.
- source_word: ὑπέστρεψεν
  choice: liền quay lại
  rationale: ὑποστρέφω ở đây chỉ việc trở lại nơi vừa rời đi; “quay lại” tự nhiên trong tiếng Việt. “Liền” làm rõ diễn tiến kể chuyện được hàm ý, không chủ trương một khoảng thời gian cụ thể.
- source_word: μετὰ φωνῆς μεγάλης
  choice: lớn tiếng
  rationale: Đây là cách nói tự nhiên trong tiếng Việt cho thành ngữ Hy Lạp nghĩa là bằng một giọng lớn, vang.
- source_word: δοξάζων τὸν θεόν
  choice: tôn vinh Đức Chúa Trời
  rationale: “Tôn vinh” giữ được ý cốt lõi của δοξάζω là quy vinh quang cho Đức Chúa Trời, trong khi chú thích ghi nhận nghĩa gần là “ca ngợi”.
theological_decisions:
- issue: Cách dịch τὸν θεόν
  choice: Đức Chúa Trời
  alternative: Thiên Chúa
  rationale: “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt hiện đại và phản ánh đơn thuần θεός trong câu, không thêm diễn giải giáo lý.
- issue: Sắc thái của δοξάζων
  choice: tôn vinh
  alternative: ca ngợi
  rationale: “Tôn vinh” bảo toàn mối liên hệ với ý niệm vinh quang; “ca ngợi” cũng có thể diễn đạt hành động cụ thể trong bối cảnh nên được ghi ở chú thích thay vì loại bỏ.
translation_notes:
  register: Văn phong trang trọng nhưng tự nhiên, dễ hiểu đối với độc giả Việt Nam hiện đại. Câu giữ nhịp kể chuyện và cấu trúc hành động nối tiếp của nguyên văn; dấu chú thích được đặt ngay sau cụm từ liên quan.
