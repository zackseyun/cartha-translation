review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng bối cảnh khẩn cấp, hình ảnh người trên mái nhà và người ngoài đồng, cũng như lời cấm không xuống lấy đồ. Tuy nhiên, “đừng quay lại lấy những gì ở phía sau” thêm mục đích “lấy” mà động từ ἐπιστρέφω và cụm εἰς τὰ ὀπίσω không nói rõ. Cụm Hy Lạp này có thể gợi điều đã bỏ lại, nhưng không xác định hành động lấy lại chúng.
  naturalness: “Trong ngày ấy” và “trên mái nhà” tự nhiên trong tiếng Việt tiêu chuẩn. Thay “còn” bằng “mà” làm liên kết mệnh đề rõ và tự nhiên hơn. “Đừng quay lại” là cách diễn đạt thông dụng, gọn, phù hợp với lời cảnh báo khẩn cấp.
  terminology: “Mái nhà” kèm chú thích mái bằng phù hợp với δώμα. “Đồ đạc” là lựa chọn tốt cho σκεύη trong ngữ cảnh này. Chú thích về εἰς τὰ ὀπίσω nên nêu phương án sát chữ mà không biến hàm ý ngữ cảnh thành mục đích được nguyên văn xác định.
  issues:
