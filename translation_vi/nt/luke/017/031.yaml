revisions:
- from: Trong ngày ấy, ai đang ở trên mái nhà[b], còn đồ đạc của mình ở trong nhà, thì đừng xuống lấy; cũng vậy, người đang ở ngoài đồng đừng quay lại lấy những gì ở phía sau.[a]
  to: Trong ngày ấy, ai đang ở trên mái nhà[b] mà đồ đạc của mình ở trong nhà thì đừng xuống lấy chúng; cũng vậy, người ở ngoài đồng đừng quay lại.[a]
  rationale: Sửa mệnh đề cuối để không thêm ý “lấy” ngoài nguyên văn, đồng thời giữ khả năng hàm ý của εἰς τὰ ὀπίσω trong chú thích. Các chỉnh sửa nhỏ về liên kết câu và đại từ giúp tiếng Việt tự nhiên hơn mà không đổi nghĩa.
  reviewer_model: gpt-5.6-terra
