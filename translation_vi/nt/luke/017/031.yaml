id: LUK.17.31
reference: Luke 17:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: vi
  text: Trong ngày ấy, ai đang ở trên mái nhà[b] mà đồ đạc của mình ở trong nhà thì đừng xuống lấy chúng; cũng vậy, người ở ngoài đồng đừng quay lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nghĩa hơn: “đừng quay lại phía sau.” Cụm này có thể hàm ý đừng trở về với những gì đã bỏ lại.'
    reason: lexical_alternative
  - marker: b
    text: “Mái nhà” ở đây là mái bằng, thường có lối lên và được dùng làm nơi sinh hoạt.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Trong ngày ấy
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, đồng thời giữ sắc thái chỉ định của ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: ai đang ở
  rationale: Diễn đạt ý khái quát của đại từ quan hệ trong bối cảnh tương lai mà không làm câu tiếng Việt nặng nề.
- source_word: ἐπὶ τοῦ δώματος
  choice: ở trên mái nhà
  rationale: δώμα chỉ phần mái bằng có thể đi lại và sử dụng; 'trên mái nhà' rõ ràng, tự nhiên trong tiếng Việt, kèm chú thích văn hóa.
- source_word: τὰ σκεύη αὐτοῦ
  choice: đồ đạc của mình
  rationale: σκεύη ở đây chỉ những vật dụng hoặc tài sản có thể mang đi; 'đồ đạc' phù hợp bối cảnh và dễ hiểu.
- source_word: μὴ καταβάτω
  choice: đừng xuống
  rationale: Mệnh lệnh ngôi ba mang ý cấm đoán khẩn cấp; 'đừng' truyền đạt trực tiếp và tự nhiên.
- source_word: ἆραι αὐτά
  choice: lấy
  rationale: Trong ngữ cảnh, αἴρω nói đến việc xuống nhà lấy đồ đạc; tân ngữ đã xuất hiện ngay trước nên tiếng Việt có thể lược bỏ đại từ để câu gọn tự nhiên.
- source_word: ὁ ἐν ἀγρῷ
  choice: người đang ở ngoài đồng
  rationale: Giữ hình ảnh cụ thể và cấu trúc đại diện của nguyên văn; 'ngoài đồng' tự nhiên hơn 'trong cánh đồng'.
- source_word: ὁμοίως
  choice: cũng vậy
  rationale: Giữ mối song song giữa hai lời cấm bằng cách diễn đạt phổ thông, trang trọng vừa phải.
- source_word: μὴ ἐπιστρεψάτω
  choice: đừng quay lại
  rationale: ἐπιστρέφω trong cảnh phải rời đi khẩn cấp có nghĩa quay trở lại hoặc quay lui.
- source_word: εἰς τὰ ὀπίσω
  choice: lấy những gì ở phía sau
  rationale: Giữ lực danh từ hóa của τὰ ὀπίσω, nhưng thêm 'lấy' theo ngữ cảnh để tiếng Việt dễ hiểu; chú thích bảo tồn cách hiểu ít diễn giải hơn.
theological_decisions:
- issue: Tính khẩn cấp trong hình ảnh cánh chung
  choice: 'Giữ nguyên hai mệnh lệnh cụ thể: không xuống lấy đồ và không quay lại lấy những gì ở phía sau.'
  alternative: Khái quát hóa thành lời khuyên đừng lưu luyến của cải.
  rationale: Nguyên văn trình bày một cảnh huống cụ thể gắn với 'ngày ấy'; giữ hình ảnh này bảo toàn tính khẩn cấp và tránh đưa thêm lời giải thích đạo đức hóa.
- issue: Đối tượng của hành động quay lại
  choice: Dịch εἰς τὰ ὀπίσω là 'lấy những gì ở phía sau'.
  alternative: Chỉ dịch là 'đừng quay lại'.
  rationale: Cụm từ Hy Lạp có yếu tố danh từ hóa, có thể gợi đến những gì bị bỏ lại phía sau. Bản dịch chính giữ nét ấy, còn chú thích nêu cách dịch ngắn hơn để bảo tồn sự nhập nhằng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm vừa phải. Dùng 'ai' và 'đừng' để mệnh lệnh trực tiếp, dễ hiểu; giữ hình ảnh cụ thể của bối cảnh cổ đại và giải thích mái bằng trong chú thích.
