id: LUK.17.12
reference: Luke 17:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: vi
  text: Khi Ngài đang đi vào một làng nọ, mười người mắc bệnh phong[a] gặp Ngài. Họ đứng từ xa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng một tính từ để mô tả họ. Thuật ngữ này có thể chỉ nhiều chứng bệnh ngoài da theo cách phân loại thời xưa, không nhất thiết tương ứng chính xác với bệnh Hansen ngày nay.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ở đằng xa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Khi Ngài đang đi vào
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; “đang đi vào” giữ được sắc thái tiếp diễn.
- source_word: εἴς τινα κώμην
  choice: một làng nọ
  rationale: “Một làng nọ” chuyển tải tính bất định nhưng có quy chiếu của τινα, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπήντησαν
  choice: gặp
  rationale: Động từ có thể mang nghĩa “gặp” hoặc “đi ra gặp”; “gặp” ngắn gọn và không thêm chi tiết chuyển động mà câu Hy Lạp không buộc phải xác định.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: mười người mắc bệnh phong
  rationale: Cách diễn đạt lấy con người làm trung tâm, tự nhiên và trang trọng trong tiếng Việt. Chú thích ngăn người đọc đồng nhất thuật ngữ cổ với một chẩn đoán y khoa hiện đại quá cụ thể.
- source_word: οἳ ἔστησαν
  choice: Họ đứng
  rationale: Đại từ quan hệ Hy Lạp được chuyển thành một câu ngắn tự nhiên trong tiếng Việt, vẫn giữ nguyên chủ thể và hành động.
- source_word: πόρρωθεν
  choice: từ xa
  rationale: Cách nói thông dụng, rõ nghĩa, diễn tả sự cách biệt về không gian mà không quy định khoảng cách cụ thể.
theological_decisions:
- issue: Cách dịch λεπροί, thuật ngữ chỉ bệnh ngoài da theo phân loại cổ
  choice: người mắc bệnh phong
  alternative: người phong hủi; người mắc bệnh ngoài da
  rationale: “Người mắc bệnh phong” dễ hiểu và ít mang tính miệt thị hơn “người phong hủi”; chú thích bảo lưu sự không tương ứng hoàn toàn giữa phạm trù bệnh tật cổ đại và chẩn đoán hiện đại.
- issue: Cách xưng hô đối với αὐτοῦ trong ngữ cảnh chỉ Đức Giê-su
  choice: Ngài
  alternative: ông
  rationale: “Ngài” là đại từ trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt và không thêm một danh xưng thần học vốn không xuất hiện trong câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu được tách sau “gặp Ngài” để tránh mệnh đề quan hệ nặng nề trong tiếng Việt. Dấu phẩy cuối câu được giữ vì câu nguồn tiếp tục sang câu kế tiếp.
