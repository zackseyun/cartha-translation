  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: vi
  text: Hai người[a] sẽ ở ngoài đồng; một người sẽ được đem đi, còn người kia sẽ bị để lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp sớm nhất, gồm Sinaiticus và Vaticanus thuộc thế kỷ IV, cũng như trong các bản dịch Coptic cổ; nhưng có trong truyền thống Tây phương, như Codex Bezae thuộc thế kỷ V, trong đa số thủ bản Byzantine và trong bản Vulgata tiếng La-tinh. Có lẽ những người sao chép về sau đã thêm câu này để làm cho đoạn văn hòa hợp với Ma-thi-ơ 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: hai người
  rationale: Tiếng Hy Lạp chỉ nói “hai” và lược danh từ; ngữ cảnh nói về hai người, nên bổ sung “người” để câu tiếng Việt tự nhiên mà không xác định giới tính.
- source_word: παραληφθήσεται
  choice: sẽ được đem đi
  rationale: Dạng bị động của παραλαμβάνω diễn tả một người được đưa hoặc đem theo; cách dịch này giữ nguyên việc tác nhân không được nêu và không quyết định trước người ấy được đem đi để được cứu hay chịu phán xét.
- source_word: ἀφεθήσεται
  choice: sẽ bị để lại
  rationale: Dạng bị động của ἀφίημι ở đây đối lập trực tiếp với việc được đem đi; “bị để lại” truyền đạt rõ sự tương phản và vẫn giữ tác nhân không được nêu.
- source_word: ὁ ἕτερος
  choice: người kia
  rationale: Chỉ người thứ hai trong hai người đã được nhắc đến; “người kia” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ ἀγρῷ
  choice: ở ngoài đồng
  rationale: ἀγρός chỉ cánh đồng hoặc khu vực canh tác; “ngoài đồng” là cách nói thông dụng, phù hợp bối cảnh.
theological_decisions:
- issue: Ý nghĩa cánh chung của việc được đem đi và bị để lại
  choice: Không xác định trong bản dịch bên nào được cứu hay bị phán xét
  alternative: Diễn giải “được cất lên” hoặc “bị bắt đi” để ấn định số phận của từng người
  rationale: Câu Hy Lạp chỉ nêu sự phân cách, không nói rõ đích đến hay số phận; dịch trung tính bảo toàn sự mơ hồ và căng thẳng của văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cấu trúc đối xứng “một người… còn người kia…” để thể hiện rõ sự tương phản của nguyên văn; đặt dấu chú thích sau “Hai người” theo lớp tham khảo đã được kiểm định.
