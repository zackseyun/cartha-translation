  naturalness: Cấu trúc câu và khẩu ngữ trang trọng vừa phải nhìn chung tự nhiên. Tuy nhiên, “thắt áo ngang lưng” không phải cách nói Việt hiện đại tự nhiên cho hành động thu gọn áo để làm việc; “thắt gọn áo lại” rõ và mượt hơn.
