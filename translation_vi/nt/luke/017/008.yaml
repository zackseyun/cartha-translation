id: LUK.17.8
reference: Luke 17:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: vi
  text: 'Trái lại, chẳng phải người ấy sẽ bảo anh ta: “Hãy chuẩn bị bữa tối cho tôi, thắt gọn áo lại[a] và phục vụ tôi cho đến khi tôi ăn uống xong[b]; sau đó anh mới ăn uống” sao?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “thắt quanh mình”, nói đến việc thắt gọn áo lại để sẵn sàng làm việc.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch sát hơn: “cho đến khi tôi ăn và uống”. Cách dịch “ăn uống xong” làm nổi bật việc hành động ấy phải hoàn tất trước khi đến lượt người phục vụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Trái lại, chẳng phải ... sao?
  rationale: Diễn đạt sức đối lập của ἀλλά và giữ hình thức câu hỏi tu từ với οὐχί, vốn chờ đợi câu trả lời khẳng định.
- source_word: ἐρεῖ αὐτῷ
  choice: người ấy sẽ bảo anh ta
  rationale: Giữ đại từ như nguyên văn thay vì tự ý thêm “chủ” hay “đầy tớ”; “bảo” dẫn vào lời truyền khiến tự nhiên trong tiếng Việt.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Hãy chuẩn bị bữa tối cho tôi
  rationale: δειπνέω chỉ việc dùng bữa tối hoặc bữa chính; cách dịch này tự nhiên và truyền đạt điều người nói yêu cầu chuẩn bị để mình dùng.
- source_word: περιζωσάμενος
  choice: thắt áo ngang lưng
  rationale: Giữ hình ảnh cụ thể của việc thu gọn áo bằng cách thắt quanh lưng để sẵn sàng làm việc, đồng thời tránh lối nói cổ “thắt lưng mình” dễ gây tối nghĩa.
- source_word: διακόνει μοι
  choice: phục vụ tôi
  rationale: Trong ngữ cảnh bữa ăn, động từ chỉ việc hầu bàn hoặc phục vụ; “phục vụ tôi” rõ nghĩa mà không mang sắc thái giáo hội.
- source_word: ἕως φάγω καὶ πίω
  choice: cho đến khi tôi ăn uống xong
  rationale: “Xong” làm rõ điểm kết thúc của hành động trước khi đến lượt người kia, phù hợp với các động từ aorist sau ἕως.
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: sau đó anh mới ăn uống
  rationale: “Sau đó” diễn đạt trình tự thời gian, còn “mới” thể hiện sự nhấn mạnh của đại từ σύ và việc lượt của người phục vụ đến sau.
theological_decisions:
- issue: Cách gọi vai trò xã hội trong dụ ngôn
  choice: Giữ các đại từ “người ấy” và “anh ta/anh”, không thêm danh từ “chủ”, “đầy tớ” hay “nô lệ” trong câu này.
  alternative: Nêu rõ “chủ” và “đầy tớ” dựa trên câu trước.
  rationale: Câu Hy Lạp này chỉ dùng đại từ, dù ngữ cảnh trước đó nói đến δοῦλος. Giữ đại từ bảo toàn cách diễn đạt của câu và tránh đưa thêm danh xưng xã hội không xuất hiện tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu hỏi tu từ được đặt theo cấu trúc tự nhiên “chẳng phải ... sao?”. Lời truyền dùng “tôi/anh” để rõ quan hệ trong lời thoại mà không thêm danh xưng vai trò; “anh mới” bảo toàn nét nhấn mạnh của σύ.
