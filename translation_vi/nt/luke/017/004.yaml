  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: vi
  text: 'Nếu người ấy phạm tội chống lại anh em bảy lần trong một ngày, và bảy lần trở lại với anh em mà nói: ‘Tôi ăn năn,’ thì anh em phải tha thứ cho người ấy.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις
  choice: bảy lần
  rationale: Diễn đạt trực tiếp số lần lặp lại, tự nhiên trong tiếng Việt.
- source_word: τῆς ἡμέρας
  choice: trong một ngày
  rationale: Đây là sở hữu cách chỉ khoảng thời gian diễn ra hành động; cách nói này tự nhiên và không hàm ý một ngày cụ thể.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: phạm tội với con
  rationale: Cụm ἁμαρτάνω với εἰς σέ chỉ hành vi phạm lỗi nhằm vào người được nói đến; “phạm tội với” vừa rõ nghĩa vừa tự nhiên trong ngữ cảnh.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: quay lại với con
  rationale: Giữ được nét nghĩa có thể là quay trở lại hoặc trở lại tìm gặp người nghe trong chuỗi hành động lặp lại.
- source_word: λέγων
  choice: mà nói
  rationale: Diễn đạt phân từ chỉ hành động đi kèm một cách tự nhiên trong tiếng Việt.
- source_word: Μετανοῶ
  choice: Tôi ăn năn
  rationale: “Ăn năn” giữ được nội dung luân lý của μετανοέω, mạnh hơn việc chỉ nói “tôi xin lỗi” hay “tôi hối tiếc”.
- source_word: ἀφήσεις
  choice: con phải tha thứ
  rationale: Dạng tương lai có lực mệnh lệnh trong ngữ cảnh dạy bảo; “phải” truyền đạt rõ nghĩa vụ, vì tiếng Việt không có cách dùng tương lai mang lực mệnh lệnh tương ứng tự nhiên.
- source_word: αὐτῷ
  choice: cho người ấy
  rationale: Đại từ chỉ người phạm tội; “người ấy” tự nhiên và không buộc tiếng Việt phải đánh dấu giới tính.
theological_decisions:
- issue: Lực nghĩa của dạng tương lai ἀφήσεις
  choice: 'Hiểu là mệnh lệnh/nghĩa vụ: “con phải tha thứ”'
  alternative: 'Hiểu theo nghĩa dự báo: “con sẽ tha thứ”'
  rationale: Trong lời chỉ dạy này, dạng tương lai mang lực quy định chứ không chỉ tiên báo hành động.
- issue: Nội dung của Μετανοῶ
  choice: “Tôi ăn năn”
  alternative: “Tôi xin lỗi” hoặc “Tôi đổi ý”
  rationale: Bản văn nói đến sự ăn năn, không chỉ cảm giác tiếc nuối, lời xin lỗi, hay một sự thay đổi ý kiến trung tính.
- issue: Điều kiện tha thứ trong câu
  choice: 'Giữ nguyên cấu trúc: người ấy quay lại và nói mình ăn năn, thì môn đồ phải tha thứ'
  alternative: Diễn giải thêm về tính chân thật hoặc bằng chứng của sự ăn năn
  rationale: Câu không nêu tiêu chuẩn bổ sung để thẩm định sự ăn năn; bản dịch không nên tự ý thêm hoặc giải quyết căng thẳng mục vụ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo ngữ cảnh Chúa Giê-su trực tiếp dạy các môn đồ; dùng “người ấy” để tránh lối đại từ đánh dấu giới tính không cần thiết. Không đặt chú thích vì các sắc thái quan trọng có thể truyền đạt rõ ngay trong câu.
