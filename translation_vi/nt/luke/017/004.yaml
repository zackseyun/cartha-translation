revisions:
- from: 'Dù người ấy phạm tội với con bảy lần trong một ngày, và bảy lần quay lại với con mà nói: ‘Tôi ăn năn,’ thì con phải tha thứ cho người ấy.'
  to: 'Nếu người ấy phạm tội chống lại anh em bảy lần trong một ngày, và bảy lần trở lại với anh em mà nói: ‘Tôi ăn năn,’ thì anh em phải tha thứ cho người ấy.'
  rationale: Bản sửa dùng cấu trúc điều kiện “Nếu … thì”, làm rõ hướng của hành vi bằng “phạm tội chống lại”, và dùng cách xưng hô số nhiều mang tính đại diện “anh em” theo ngữ cảnh diễn ngôn. “Trở lại” giữ được độ mở nghĩa của ἐπιστρέφω (quay lại/trở lại), còn “phải tha thứ” chuyển tải lực mệnh lệnh của tương lai ἀφήσεις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:28Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng số lần, khung thời gian, lời tự nhận ăn năn, và lực mệnh lệnh của ἀφήσεις. Tuy nhiên, “Dù” có sắc thái nhượng bộ hơn điều kiện ἐὰν; “phạm tội với con” không diễn đạt rõ hành vi phạm tội nhắm/chống lại người được nói đến của ἁμαρτήσῃ εἰς σέ.
  naturalness: “Phạm tội với con” và phần nào “quay lại với con” chưa tự nhiên trong tiếng Việt hiện đại. “Nếu … phạm tội chống lại anh em” và “trở lại với anh em” rõ nghĩa, tự nhiên, đồng thời phù hợp một lời dạy hướng đến nhóm môn đồ.
  terminology: “Ăn năn” thích hợp cho Μετανοῶ; “tha thứ” thích hợp cho ἀφήσεις. Đổi cách xưng hô từ “con” sang “anh em” phù hợp hơn với diễn ngôn Chúa Giê-su dạy các môn đồ trong ngữ cảnh này, mà không làm thay đổi tính khái quát của số ít tiếng Hy Lạp.
  issues:
  - severity: medium
    issue: “Dù” thay cho điều kiện ἐὰν.
    rationale: 'ἐὰν mở đầu mệnh đề điều kiện: “Nếu”. “Dù” dễ gợi một nhượng bộ và làm quan hệ điều kiện–hệ quả kém trực tiếp.'
  - severity: medium
    issue: “phạm tội với con” không phản ánh rõ εἰς σέ.
    rationale: Giới từ εἰς trong cụm này chỉ đối tượng bị xúc phạm, tức phạm tội chống lại/đối với người nghe. “Với” trong tiếng Việt có thể gợi một hành vi chung với người nghe thay vì hành vi nhắm vào họ.
  - severity: low
    issue: Cách xưng hô “con” không tối ưu trong lời dạy các môn đồ.
    rationale: Dù không sai thần học, “anh em” là cách xưng hô hiện đại, tự nhiên và phù hợp hơn cho lời dạy hướng đến các môn đồ; nó cũng tránh áp đặt quan hệ thân tộc/tuổi tác cụ thể.
  revised_text: 'Nếu người ấy phạm tội chống lại anh em bảy lần trong một ngày, và bảy lần trở lại với anh em mà nói: ‘Tôi ăn năn,’ thì anh em phải tha thứ cho người ấy.'
