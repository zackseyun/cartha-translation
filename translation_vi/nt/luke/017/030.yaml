revisions:
- from: Cũng vậy, trong ngày Con Người được tỏ ra[a].
  to: Cũng sẽ như vậy vào ngày Con Người được tỏ ra[a].
  rationale: Bản sửa bổ sung «sẽ như vậy» để dịch minh bạch động từ tương lai ἔσται và để câu tiếng Việt hoàn chỉnh; đổi «trong ngày» thành «vào ngày» cho cách chỉ thời điểm tự nhiên hơn. Các lựa chọn chủ chốt «Con Người» và «được tỏ ra» được giữ nguyên vì trung thành với danh xưng và động từ Hy Lạp.
