review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng thành ngữ so sánh κατὰ τὰ αὐτά, danh xưng «Con Người», và sắc thái bị động của ἀποκαλύπτεται. Tuy nhiên, mệnh đề chính bỏ mất cách diễn đạt rõ ràng của động từ tương lai ἔσται; trong tiếng Việt, câu hiện tại là một mảnh câu và không nêu rõ điều «sẽ» xảy ra như vậy.
  naturalness: «Cũng vậy, trong ngày Con Người được tỏ ra» chưa trọn câu trong tiếng Việt hiện đại. Thêm «sẽ như vậy» tạo một câu tự nhiên, trang trọng và phản ánh cấu trúc đối chiếu của nguyên văn. «Vào ngày» tự nhiên hơn «trong ngày» khi chỉ thời điểm của một biến cố.
  terminology: «Con Người» là cách dịch ổn định, phù hợp cho ὁ υἱὸς τοῦ ἀνθρώπου. «Được tỏ ra» bảo toàn ý nghĩa được bày tỏ/hiển lộ và thể bị động của ἀποκαλύπτεται, không diễn giải thành «đến».
  issues:
  - severity: medium
    issue: Mệnh đề chính thiếu sự thể hiện rõ của ἔσται.
    rationale: ἔσται là động từ tương lai «sẽ là/sẽ như vậy». Dù tiếng Việt đôi khi có thể lược bỏ thời, câu nháp trở thành cụm trạng ngữ không có vị ngữ chính; thêm «sẽ như vậy» vừa khôi phục nghĩa tương lai vừa làm câu hoàn chỉnh.
  revised_text: Cũng sẽ như vậy vào ngày Con Người được tỏ ra[a].
