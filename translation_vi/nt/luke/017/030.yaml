  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: vi
  text: Cũng sẽ như vậy vào ngày Con Người được tỏ ra[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Theo cùng một cách” hoặc “Cũng như thế”. Thành ngữ Hy Lạp này quy chiếu về những ví dụ trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Cũng vậy
  rationale: 'Thành ngữ này quy chiếu về những ví dụ ngay trước đó và diễn tả sự tương ứng: “cũng vậy” hoặc “theo cùng một cách”. Cách dịch này tự nhiên, ngắn gọn và giữ được lực so sánh.'
- source_word: ἔσται
  choice: được thể hiện qua cấu trúc toàn câu hướng đến tương lai
  rationale: Động từ tương lai εἰμί cho biết điều được mô tả sẽ xảy ra. Trong tiếng Việt, “Cũng vậy, trong ngày...” tự nhiên hơn việc thêm “sẽ là”, trong khi ngữ cảnh cánh chung vẫn giữ rõ định hướng tương lai.
- source_word: ᾗ ἡμέρᾳ
  choice: trong ngày
  rationale: Cụm định cách mang nghĩa thời gian, chỉ ngày mà sự việc xảy ra. “Trong ngày” vừa trang trọng vừa tự nhiên trong văn cảnh này.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh xưng quen thuộc của Chúa Giê-xu trong các sách Tin Lành, đồng thời bảo tồn âm hưởng khải huyền và mối liên hệ với Đa-ni-ên 7.
- source_word: ἀποκαλύπτεται
  choice: được tỏ ra
  rationale: Giữ thể bị động và ý nghĩa được bày tỏ, hiển lộ công khai; không thay bằng “đến”, vì từ Hy Lạp nhấn mạnh sự mặc khải hơn là chuyển động.
theological_decisions:
- issue: Cách dịch danh xưng cánh chung ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Người Con của loài người
  rationale: “Con Người” là danh xưng đã quen thuộc trong tiếng Việt và giữ được mối liên hệ liên văn bản với Đa-ni-ên 7 mà không diễn giải thêm.
- issue: Sắc thái của ἀποκαλύπτεται trong văn cảnh
  choice: được tỏ ra
  alternative: hiện đến; xuất hiện
  rationale: Bản dịch đã chọn bảo tồn ý niệm được vén mở và bày tỏ công khai. “Hiện đến” hoặc “xuất hiện” có thể làm mờ sắc thái mặc khải của động từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu ngắn giữ nhịp mạnh của lời cảnh báo cánh chung; không thêm chủ thể hay giải thích ngoài nguyên văn.
