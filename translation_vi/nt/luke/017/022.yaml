id: LUK.17.22
reference: Luke 17:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: vi
  text: 'Rồi Người nói với các môn đồ: “Sẽ đến những ngày anh em ao ước được thấy một trong những ngày của Con Người,[a] nhưng sẽ không thấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những ngày của Con Người” có thể chỉ thời gian Người hiện diện và thi hành công việc, hoặc cụ thể hơn là sự bày tỏ của Người trong tương lai; cách diễn đạt Hy Lạp không giới hạn phạm vi.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Rồi Ngài phán
  rationale: δέ là từ nối nhẹ, tiếp tục mạch kể chuyện; “rồi” tự nhiên trong tiếng Việt mà không nhấn mạnh sự tương phản. “Phán” giữ sắc thái trang trọng, phù hợp với lời Chúa Giê-su.
- source_word: πρὸς τοὺς μαθητάς
  choice: với các môn đồ
  rationale: Nguyên văn có mạo từ nhưng không có đại từ sở hữu; vì vậy không thêm “của Ngài”.
- source_word: Ἐλεύσονται ἡμέραι
  choice: Sẽ đến những ngày
  rationale: Giữ hình thức tiên báo và hình ảnh “những ngày” của nguyên văn, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐπιθυμήσετε
  choice: các con ao ước
  rationale: ἐπιθυμέω ở đây diễn tả lòng mong mỏi mãnh liệt; “ao ước” vừa rõ ràng vừa tự nhiên. “Các con” giúp phân biệt ngôi thứ hai số nhiều và phù hợp lời Chúa Giê-su nói với môn đồ.
- source_word: μίαν τῶν ἡμερῶν
  choice: một trong những ngày
  rationale: 'Phản ánh chính xác cấu trúc phân thuộc: một ngày thuộc nhóm “những ngày”.'
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: của Con Người
  rationale: Dịch sát tước hiệu tự xưng của Chúa Giê-su, giữ liên hệ Kinh Thánh và ý nghĩa thần học mà không diễn giải thêm.
- source_word: ἰδεῖν
  choice: được thấy
  rationale: “Được thấy” diễn đạt tự nhiên bổ ngữ của “ao ước” và không thêm ý nghĩa ngoài nguyên văn.
- source_word: καὶ οὐκ ὄψεσθε
  choice: nhưng sẽ không thấy
  rationale: καί theo nghĩa cơ bản là “và”, nhưng trong quan hệ ngữ nghĩa ở đây mệnh đề sau trái với điều ao ước; “nhưng” truyền đạt tự nhiên sức đối lập hàm ẩn trong tiếng Việt. Không thêm tân ngữ vì tiếng Việt cho phép lược bỏ mà ý vẫn rõ.
theological_decisions:
- issue: Ý nghĩa của “những ngày của Con Người”
  choice: Giữ nguyên cách nói rộng và đậm sắc thái cánh chung, không giới hạn vào một thời kỳ duy nhất.
  alternative: Có thể hiểu riêng là thời Chúa Giê-su hiện diện và thi hành chức vụ trên đất, hoặc riêng là thời Ngài được bày tỏ trong tương lai.
  rationale: Cụm từ Hy Lạp có thể gợi cả nỗi mong nhớ sự hiện diện của Chúa Giê-su lẫn sự bày tỏ tương lai của Con Người trong văn cảnh. Dịch sát bảo toàn sự căng thẳng thần học này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” và “các con” theo ngữ cảnh lời Chúa Giê-su nói với môn đồ; giữ tước hiệu “Con Người”. Chỉ đặt một chú thích tại cụm từ thực sự có sự mở rộng nghĩa cần bảo toàn; dữ liệu chú thích tiếng Anh đánh dấu [a] sau “disciples” nhưng nội dung lại là một bản dịch thay thế cho toàn câu, nên không lặp lỗi định vị đó.
