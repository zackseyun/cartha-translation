revisions:
- from: 'Rồi Ngài phán với các môn đồ: “Sẽ đến những ngày các con ao ước được thấy một trong những ngày của Con Người,[a] nhưng sẽ không thấy.”'
  to: 'Rồi Người nói với các môn đồ: “Sẽ đến những ngày anh em ao ước được thấy một trong những ngày của Con Người,[a] nhưng sẽ không thấy.”'
  rationale: Chỉ chỉnh cách xưng hô “các con” thành “anh em” để không thêm sắc thái quan hệ không có trong nguyên văn. Giữ cách dịch sát, mở của cụm “những ngày của Con Người” và giữ chú thích để không thu hẹp phạm vi khả dĩ của cụm này.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: lời nói hướng đến các môn đồ, thời điểm tương lai, ước muốn thấy một trong các ngày của Con Người, và kết quả không thấy. Tuy nhiên, “các con” thêm một sắc thái quan hệ gia trưởng/thân tình không được biểu thị trong tiếng Hy Lạp, vốn chỉ dùng ngôi thứ hai số nhiều. Cần thay bằng một cách xưng hô số nhiều trung tính hơn. “Nhưng” có thể diễn đạt sự tương phản ngữ nghĩa của mệnh đề cuối trong tiếng Việt.'
  naturalness: “Sẽ đến những ngày” và “ao ước được thấy” tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. “Anh em” là cách gọi trực tiếp tự nhiên đối với một nhóm môn đồ và tránh sắc thái thêm vào của “các con.”
  terminology: Giữ “môn đồ” và tước hiệu “Con Người” là thích hợp, nhất quán và bảo toàn cách nói có ý nghĩa đặc thù của nguyên văn. Chú thích nên dùng đại từ nhất quán với bản văn đã chỉnh.
  issues:
  - severity: medium
    issue: “các con” không phản ánh trung tính ngôi thứ hai số nhiều của nguyên văn.
    rationale: τοὺς μαθητάς và các động từ số nhiều chỉ xác định người nghe là các môn đồ; không có từ ngữ nào xác lập cách xưng hô “con” hay quan hệ phụ tử. “Anh em” chuyển tải số nhiều mà không thêm sắc thái này.
  revised_text: 'Rồi Người nói với các môn đồ: “Sẽ đến những ngày anh em ao ước được thấy một trong những ngày của Con Người,[a] nhưng sẽ không thấy.”'
