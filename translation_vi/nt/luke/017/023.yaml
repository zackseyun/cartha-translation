base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: vi
  text: 'Người ta sẽ nói với anh em: “Kìa, ở đằng kia!” hoặc: “Kìa, ở đây!” Anh em đừng đi, cũng đừng đuổi theo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Anh em đừng rời đi, cũng đừng theo đuổi.” Tiếng Hy Lạp không nêu đối tượng của động từ “đuổi theo”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: Người ta sẽ nói với anh em
  rationale: Dạng tương lai của λέγω được dịch trực tiếp là “sẽ nói”; chủ ngữ số nhiều không xác định được diễn đạt tự nhiên bằng “người ta”. “Anh em” phù hợp với đại từ số nhiều ὑμῖν trong lời Chúa Giê-xu nói với các môn đồ.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: “Kìa” là từ chỉ dẫn, thu hút sự chú ý một cách ngắn gọn và tự nhiên, đồng thời phù hợp với cả vị trí xa lẫn gần được nêu tiếp theo.
- source_word: ἐκεῖ
  choice: ở đằng kia
  rationale: Diễn đạt rõ nét ý chỉ nơi chốn ở xa và tạo thế tương phản tự nhiên với “ở đây”.
- source_word: ὧδε
  choice: ở đây
  rationale: Giữ nguyên ý chỉ nơi chốn gần và sự đối lập súc tích với ἐκεῖ.
- source_word: μὴ ἀπέλθητε
  choice: đừng đi theo
  rationale: ἀπέρχομαι cơ bản nói đến việc đi khỏi hoặc đi ra; trong ngữ cảnh đáp lại lời chỉ dẫn về một địa điểm, “đi theo” truyền đạt tự nhiên hành động đi theo lời báo ấy mà không xác định thêm một địa điểm.
- source_word: μηδὲ διώξητε
  choice: cũng đừng đuổi theo
  rationale: διώκω có nghĩa là đuổi theo hoặc truy đuổi. Bản dịch giữ động từ không có tân ngữ như nguyên văn, nhờ đó không tự quyết định đối tượng là người nói, một người tự xưng, hay tin báo.
theological_decisions:
- issue: Đối tượng không được nêu của διώξητε
  choice: Giữ “đuổi theo” không có tân ngữ và thêm chú thích
  alternative: “đuổi theo họ” hoặc “chạy theo họ”
  rationale: Nguyên văn Hy Lạp không nêu đối tượng. Giữ cấu trúc này bảo tồn sự mơ hồ thật của câu và tránh đồng nhất đối tượng với những người đưa tin hoặc với một nhóm người tự xưng nào đó.
- issue: Hai tiếng chỉ nơi chốn
  choice: '“Kìa, ở đằng kia!” hoặc: “Kìa, ở đây!”'
  alternative: “Hãy xem, ở kia! Hãy xem, ở đây!”
  rationale: Cách dịch được chọn giữ tính trực tiếp của lời hô chỉ dẫn mà không thêm một cách giải thích cánh chung vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời nói với các môn đồ; dùng “Kìa” để giữ sắc thái chỉ dẫn gấp và súc tích.
