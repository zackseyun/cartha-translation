review_pass:
  verdict: revise
  source_fidelity: Bản nháp dịch đúng các lời chỉ nơi chốn và mệnh lệnh phủ định. Tuy nhiên, “đừng đi theo” không phản ánh ἀπέλθητε (“đừng đi/đừng đi khỏi, đừng rời đi”) và lại trùng ý với διώξητε (“đuổi theo, theo đuổi”). Cần tách rõ hai động từ như nguyên văn.
  naturalness: “Người ta sẽ nói với anh em”, “Kìa, ở đằng kia/ở đây” và “anh em” đều tự nhiên, phù hợp văn phong Kinh Thánh hiện đại. “Anh em đừng đi, cũng đừng đuổi theo” ngắn gọn, tự nhiên trong lời cảnh báo, đồng thời không buộc phải thêm tân ngữ cho “đuổi theo”.
  terminology: “Kìa” giữ tốt lực thu hút chú ý của ἰδού; “ở đằng kia” và “ở đây” bảo toàn đối lập xa/gần. “Đuổi theo” là cách dịch phù hợp của διώξητε. Không có vấn đề về danh xưng hay thuật ngữ thần học trong câu này.
  issues:
  - severity: high
    issue: “đừng đi theo” dịch μὴ ἀπέλθητε
    rationale: ἀπέρχομαι chỉ việc đi, đi khỏi, rời đi; không có nghĩa “đi theo”. Nghĩa “theo đuổi/đuổi theo” thuộc động từ kế tiếp διώξητε. Cách dịch hiện tại làm nhập hai mệnh lệnh riêng biệt thành hai cách nói gần như đồng nghĩa.
  - severity: medium
    issue: Chú thích thay thế “đừng đi khỏi đó”
    rationale: Nguyên văn không có đại từ chỉ nơi chốn “đó”. Có thể nêu “đừng rời đi” như một cách dịch thay thế của ἀπέλθητε, nhưng không nên thêm địa điểm vào bản chú thích như thể đó là nội dung được nói rõ.
