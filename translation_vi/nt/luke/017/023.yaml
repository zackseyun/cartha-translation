revisions:
- from: 'Người ta sẽ nói với anh em: “Kìa, ở đằng kia!” hoặc: “Kìa, ở đây!” Anh em đừng đi theo, cũng đừng đuổi theo.[a]'
  to: 'Người ta sẽ nói với anh em: “Kìa, ở đằng kia!” hoặc: “Kìa, ở đây!” Anh em đừng đi, cũng đừng đuổi theo.[a]'
  rationale: Sửa “đừng đi theo” thành “đừng đi” để phản ánh trực tiếp μὴ ἀπέλθητε và để phân biệt với μηδὲ διώξητε. Giữ “đuổi theo” không có tân ngữ nhằm bảo toàn sự không xác định của nguyên văn; chú thích được chỉnh để không thêm “đó”, vốn không có trong tiếng Hy Lạp.
