  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: vi
  text: 'Chúa phán: “Nếu anh em có đức tin như một hạt cải, anh em có thể nói với cây dâu tằm này[a]: ‘Hãy bật rễ lên và được trồng trong biển!’ và nó sẽ vâng lời anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “cây sycamine,” một cách gọi truyền thống của loại cây dâu này; không nên nhầm với cây sung dâu.'
    reason: Bảo lưu phương án từ vựng truyền thống cho συκάμινος, đồng thời phân biệt với cây sung dâu (sycamore-fig).
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Giữ tước hiệu tường thuật và sắc thái Cơ Đốc học tự nhiên trong văn mạch Lu-ca; “Chủ” không tự nhiên bằng trong tiếng Việt ở đây.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong lời phán về điều tưởng như không thể, từ này chỉ lòng tin cậy hướng về Đức Chúa Trời; “đức tin” là cách diễn đạt rõ và quen thuộc, còn “sự trung tín” không phù hợp với trọng tâm văn cảnh.
- source_word: ὡς κόκκον σινάπεως
  choice: như một hạt cải
  rationale: Giữ nguyên phép so sánh của ὡς, không diễn giải thu hẹp thành “nhỏ bằng” một hạt cải.
- source_word: συκαμίνῳ
  choice: cây dâu tằm
  rationale: συκάμινος chỉ một loại cây dâu; cách gọi này rõ nghĩa đối với độc giả hiện đại và tránh lẫn với cây sung dâu.
- source_word: ἐλέγετε ἂν
  choice: anh em sẽ nói
  rationale: Diễn đạt tự nhiên sắc thái tiềm năng của thể chưa hoàn thành đi với ἄν trong kết cấu điều kiện; không biến ý thành một mệnh lệnh dành cho các môn đồ.
- source_word: Ἐκριζώθητι
  choice: Hãy bật rễ lên
  rationale: Chuyển mệnh lệnh thụ động sang lối nói tự nhiên khi trực tiếp ra lệnh cho cây, đồng thời giữ hình ảnh toàn cây bị bật khỏi rễ.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: được trồng xuống biển
  rationale: Giữ hình thức thụ động và hình ảnh nghịch lý “được trồng” trong biển, không diễn giải thành “chuyển sang” hay làm giảm tính kỳ lạ của lời phán.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: nó sẽ vâng lời anh em
  rationale: “Vâng lời” phù hợp với hình ảnh cái cây tuân theo mệnh lệnh và truyền đạt rõ lực nghĩa của ὑπακούω.
theological_decisions:
- issue: Ý nghĩa của πίστις trong lời phán về phép lạ
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Văn cảnh nhấn mạnh lòng tin cậy có thể đối diện điều không thể, chứ không chủ yếu nói đến phẩm chất bền lòng hay trung tín. Bản dịch không thêm đối tượng của đức tin vì nguyên văn không nêu rõ.
- issue: Sắc thái của câu điều kiện
  choice: Nếu anh em có… anh em sẽ nói… thì nó sẽ vâng lời
  alternative: Nếu anh em đã có… anh em hẳn đã nói… và nó hẳn đã vâng lời
  rationale: Mệnh đề điều kiện dùng εἰ với động từ hiện tại, còn các mệnh đề chính có thể thức tiềm năng với ἄν. Cách dịch được chọn giữ điều kiện mở và quan hệ tiềm năng mà không quyết định rằng Chúa đang phủ nhận hoàn toàn việc các môn đồ có đức tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμεῖς; giữ hình ảnh mạnh và nghịch lý của cái cây bật rễ rồi được trồng xuống biển. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
