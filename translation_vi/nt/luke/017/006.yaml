  to: 'Chúa phán: “Nếu anh em có đức tin như một hạt cải, anh em có thể nói với cây dâu tằm này[a]: ‘Hãy bật rễ lên và được trồng trong biển!’ và nó sẽ vâng lời anh em.”'
  rationale: Bản sửa chỉ điều chỉnh sắc thái tiềm năng của câu điều kiện, thay giới từ vị trí cho sát nguyên văn, và làm rõ chú thích từ vựng. Không thêm đối tượng cho “đức tin,” không giải thích hóa hình ảnh nghịch lý, và không thay đổi ý nghĩa đoạn văn.
