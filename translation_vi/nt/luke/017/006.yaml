review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các từ trọng yếu: κύριος là “Chúa,” πίστις là “đức tin,” hình ảnh hạt cải, cây dâu tằm (συκάμινος), việc bật rễ, trồng trong biển, và cây vâng lời. Tuy nhiên, “anh em sẽ nói ... thì nó sẽ vâng lời” làm sắc thái tiềm năng của các động từ có ἄν (ἐλέγετε ἄν; ὑπήκουσεν ἄν) thành lời dự báo quá trực tiếp. “Trong biển” sát với ἐν τῇ θαλάσσῃ hơn “xuống biển.”'
  naturalness: Văn phong nhìn chung tự nhiên và phù hợp đăng đọc hiện đại. Cần thay “được trồng xuống biển” bằng “được trồng trong biển” để vừa tự nhiên hơn vừa chính xác hơn. Cấu trúc “Nếu ... , anh em có thể nói ... , và nó sẽ vâng lời anh em” diễn đạt mạch điều kiện-tiềm năng rõ hơn trong tiếng Việt mà không áp đặt cách hiểu phản thực.
  terminology: “Chúa,” “đức tin,” “hạt cải,” và “cây dâu tằm” phù hợp. Chú thích cần diễn đạt “sycamine” như một cách gọi/truyền thống từ vựng, không như một tên Việt ngữ thông dụng thay thế; phần phân biệt với “cây sung dâu” là hữu ích.
  issues:
  - severity: medium
    issue: Sắc thái tiềm năng của mệnh đề chính chưa được phản ánh đầy đủ.
    rationale: ἐλέγετε ἄν và ὑπήκουσεν ἄν dùng ἄν để diễn tả hệ quả tiềm năng. “Sẽ nói ... thì sẽ vâng lời” dễ được đọc như hệ quả chắc chắn, dự báo. “Có thể nói” giữ tốt hơn lực tiềm năng, trong khi “sẽ vâng lời” vẫn tự nhiên trong hệ quả của mệnh lệnh giả định.
  - severity: low
    issue: “Xuống biển” không sát bằng “trong biển.”
    rationale: Giới từ ἐν chỉ vị trí “trong/ở trong,” không chỉ hướng chuyển động “xuống.” Hình ảnh nghịch lý cần được giữ là cây được trồng trong biển.
  - severity: low
    issue: Diễn đạt chú thích về “sycamine” cần chính xác hơn.
    rationale: “Sycamine” là cách gọi truyền thống/transliteration được bảo lưu như một phương án từ vựng, không phải cách gọi Việt ngữ thông dụng của cây.
  revised_text: 'Chúa phán: “Nếu anh em có đức tin như một hạt cải, anh em có thể nói với cây dâu tằm này[a]: ‘Hãy bật rễ lên và được trồng trong biển!’ và nó sẽ vâng lời anh em.”'
