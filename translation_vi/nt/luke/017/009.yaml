  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: vi
  text: Chẳng lẽ chủ có cảm ơn người nô lệ vì người ấy đã thực hiện những điều đã được ra lệnh sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp doulos cũng có thể dịch là “đầy tớ” hoặc “tôi tớ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Chẳng lẽ ... sao?
  rationale: μή với động từ chỉ định mở đầu câu hỏi tu từ chờ câu trả lời phủ định. Cấu trúc “Chẳng lẽ ... sao?” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ἔχει χάριν
  choice: biết ơn
  rationale: Thành ngữ ἔχειν χάριν τινί diễn tả việc mang lòng biết ơn đối với ai. “Biết ơn” tự nhiên và giữ được ý nghĩa mà không buộc phải hiểu là lời cảm ơn được nói ra.
- source_word: τῷ δούλῳ
  choice: người nô lệ
  rationale: Trong bối cảnh chủ–nô và nghĩa vụ thi hành mệnh lệnh, “người nô lệ” giữ rõ địa vị lệ thuộc và sức nặng xã hội của δοῦλος.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu lý do cho sự biết ơn được giả định trong câu hỏi tu từ.
- source_word: ἐποίησεν τὰ διαταχθέντα
  choice: đã làm những điều được truyền bảo
  rationale: Cách dịch này giữ thể thụ động của phân từ διαταχθέντα và diễn đạt tự nhiên ý thực hiện những điều đã được ra lệnh.
theological_decisions:
- issue: Cách dịch δοῦλος trong bối cảnh dụ ngôn về quan hệ chủ–nô
  choice: người nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Lập luận của câu dựa trên địa vị lệ thuộc và nghĩa vụ vâng lệnh. “Người nô lệ” không làm nhẹ đi thực tại xã hội mà dụ ngôn giả định; chú thích cung cấp các cách dịch truyền thống hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng câu hỏi tu từ “Chẳng lẽ ... sao?” để thể hiện kỳ vọng câu trả lời phủ định; dùng “chủ” để làm rõ chủ thể được ngữ cảnh gần xác định dù tiếng Hy Lạp chỉ hàm chứa trong động từ ngôi thứ ba.
