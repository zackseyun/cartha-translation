  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: vi
  text: 'Các sứ đồ thưa với Chúa: “Xin thêm đức tin cho chúng tôi.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin gia tăng đức tin cho chúng tôi.” Động từ Hy Lạp có nghĩa đen là “thêm”, nhưng trong ngữ cảnh này có nghĩa là “làm cho tăng thêm”.'
    reason: lexical_alternative
  - marker: b
    text: “Đức tin” cũng có thể được hiểu là “lòng tin” hoặc “lòng tin cậy”; nghĩa “sự trung tín” có thể có trong một số văn cảnh, nhưng ít phù hợp hơn ở đây.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp đơn giản; trong tiếng Việt, mở câu bằng “Và” ở đây không cần thiết, còn quan hệ kể chuyện vẫn rõ từ ngữ cảnh.
- source_word: εἶπαν
  choice: thưa
  rationale: Động từ aorist chỉ hành động nói trong mạch kể. “Thưa” là cách diễn đạt tự nhiên, trang trọng khi các sứ đồ nói với Chúa.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: “Sứ đồ” là thuật ngữ quen thuộc trong tiếng Việt để chỉ những người được sai phái thuộc nhóm của Chúa Giê-su; mạo từ Hy Lạp được thể hiện tự nhiên qua danh ngữ xác định theo ngữ cảnh.
- source_word: τῷ κυρίῳ
  choice: với Chúa
  rationale: κύριος ở đây là danh hiệu dành cho Chúa Giê-su. “Chúa” giữ được cả sắc thái xưng hô kính trọng lẫn ý nghĩa Kitô học; giới từ “với” đi tự nhiên với động từ “thưa”.
- source_word: Πρόσθες
  choice: Xin thêm
  rationale: προστίθημι có nghĩa đen là “thêm”; thể mệnh lệnh được diễn đạt lịch sự bằng “xin”. Cách dịch này giữ sát cấu trúc Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἡμῖν
  choice: cho chúng con
  rationale: Đại từ ngôi thứ nhất số nhiều ở tặng cách có nghĩa “cho chúng tôi/chúng con”. “Chúng con” phù hợp với lời kính cẩn của các sứ đồ thưa với Chúa.
- source_word: πίστιν
  choice: đức tin
  rationale: Trong ngữ cảnh này, πίστις chủ yếu chỉ đức tin hay lòng tin cậy của các sứ đồ. “Đức tin” là cách gọi tự nhiên, quen thuộc và giữ được thuật ngữ thần học mà không loại bỏ sắc thái “lòng tin”.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ Chúa Giê-su
  choice: Chúa
  alternative: chủ; thầy
  rationale: “Chúa” bảo toàn danh hiệu trang trọng và chiều kích Kitô học trong văn mạch Lu-ca; “chủ” hoặc “thầy” có thể làm hẹp ý nghĩa.
- issue: Cách hiểu πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Lời cầu xin tăng thêm cho người nói khiến nghĩa “đức tin/lòng tin cậy” tự nhiên nhất. “Sự trung tín” thuộc phạm vi nghĩa của từ nhưng ít khả dĩ hơn tại đây, nên được ghi ở chú thích thay vì đưa vào chính văn.
- issue: Hình thức của lời cầu xin Πρόσθες ἡμῖν πίστιν
  choice: Xin thêm đức tin cho chúng con
  alternative: Xin gia tăng đức tin của chúng con
  rationale: Bản chính giữ hình ảnh “thêm ... cho” của tiếng Hy Lạp và không quyết định quá mức rằng các sứ đồ đã có một lượng đức tin cần được tăng lên, dù đó là cách hiểu tự nhiên trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thưa” cùng đại từ “chúng con” thể hiện quan hệ kính cẩn với Chúa mà không thêm nội dung ngoài nguyên văn. Hai dấu chú thích được đặt ngay sau câu trích dẫn và đều có mục chú thích tương ứng.
