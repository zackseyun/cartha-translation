  to: 'Rồi Ngài phán với các môn đệ của mình: “Không thể nào những cớ gây vấp ngã[a] lại không đến; nhưng khốn cho người mà qua người ấy những cớ ấy đến!”'
  rationale: Bản sửa đổi thay “môn đồ” bằng “môn đệ” để dùng tiếng Việt hiện đại, và thay cách diễn giải tác nhân “làm chúng xảy đến” bằng “mà qua người ấy những cớ ấy đến” để phản ánh sát hơn δι’ οὗ mà vẫn giữ lời cảnh cáo nghiêm trọng của câu. Chú thích được giữ nguyên vì mô tả đúng các khả năng ngữ nghĩa của σκάνδαλα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chính: điều không thể là các σκάνδαλα không đến, rồi chuyển sang lời “khốn cho” người liên hệ. Tuy nhiên, “người làm chúng xảy đến” chuyển δι’ οὗ (người mà qua người ấy chúng đến) thành một khẳng định tác nhân trực tiếp, mạnh hơn cách diễn đạt trung gian trong tiếng Hy Lạp.'
  naturalness: Câu văn nhìn chung rõ và trang trọng. “Môn đệ” là cách gọi hiện đại, phổ thông và trung tính hơn “môn đồ”. Cụm “người mà qua người ấy những cớ ấy đến” hơi lặp nhưng tự nhiên trong văn phong Kinh Thánh trang trọng, đồng thời phản ánh chính xác quan hệ διὰ.
  terminology: “Những cớ gây vấp ngã” bảo toàn hình ảnh và phạm vi của σκάνδαλα tốt. “Khốn cho” truyền đạt phù hợp οὐαί. Đổi “môn đồ” thành “môn đệ” cải thiện tính chuẩn mực hiện đại mà không đổi nghĩa.
  issues:
  - severity: medium
    issue: “người làm chúng xảy đến” diễn giải δι’ οὗ theo nghĩa tác nhân trực tiếp.
    rationale: Giới từ διά với sở hữu cách nêu người là kênh/phương tiện “qua người ấy” mà các cớ vấp ngã đến. Dù ngữ cảnh hàm ý trách nhiệm, bản văn không dùng động từ “làm xảy đến”; nên cần giữ cách nói trung gian để không tăng mức độ diễn giải.
  - severity: low
    issue: “môn đồ” kém tự nhiên hơn trong tiếng Việt chuẩn hiện đại.
    rationale: “Môn đệ” là thuật ngữ phổ thông hơn trong bản dịch Kinh Thánh và văn phong học thuật hiện nay, đồng thời tương ứng trực tiếp với μαθηταί.
