language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: vi
  text: 'Rồi Ngài phán với các môn đệ của mình: “Không thể nào những cớ gây vấp ngã[a] lại không đến; nhưng khốn cho người mà qua người ấy những cớ ấy đến!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những điều xúc phạm”, “những nguyên cớ khiến người ta phạm tội” hoặc “những cám dỗ phạm tội”. Từ Hy Lạp σκάνδαλα chỉ những điều làm người ta vấp ngã về đạo đức hoặc thuộc linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Rồi Ngài phán
  rationale: δέ là từ nối nhẹ trong mạch kể chuyện; “Rồi” diễn đạt tự nhiên sự tiếp nối. “Phán” phù hợp với lời dạy trang trọng của Chúa Giê-su.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: với các môn đồ của mình
  rationale: Giữ rõ đại từ sở hữu αὐτοῦ và dùng “môn đồ” theo nghĩa những người theo học Chúa Giê-su.
- source_word: Ἀνένδεκτόν ἐστιν τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: Không thể nào những cớ gây vấp ngã lại không đến
  rationale: 'Giữ hình thức phủ định của cấu trúc Hy Lạp: điều không thể xảy ra là σκάνδαλα không đến; cách diễn đạt này đồng thời truyền đạt tính tất yếu mà không đổi thành một khẳng định diễn giải.'
- source_word: σκάνδαλα
  choice: những cớ gây vấp ngã
  rationale: Giữ hình ảnh ẩn dụ về điều làm người khác vấp ngã về đạo đức hoặc thuộc linh, thay vì thu hẹp nghĩa vào sự xúc phạm chủ quan hay chỉ riêng cám dỗ.
- source_word: πλὴν οὐαὶ
  choice: nhưng khốn cho
  rationale: “Nhưng” thể hiện bước chuyển từ tính tất yếu sang lời cảnh cáo; “khốn cho” chuyển tải sắc thái tuyên cáo nghiêm trọng của οὐαί.
- source_word: δι’ οὗ ἔρχεται
  choice: người làm chúng xảy đến
  rationale: Diễn đạt tự nhiên trong tiếng Việt vai trò trung gian hoặc tác nhân của người mà qua họ các cớ vấp ngã đến, đồng thời giữ số ít đại diện.
theological_decisions:
- issue: Phạm vi đạo đức của σκάνδαλα
  choice: Dịch là “những cớ gây vấp ngã” trong chính văn
  alternative: “những điều xúc phạm”, “những nguyên cớ khiến người ta phạm tội”, hoặc “những cám dỗ phạm tội”
  rationale: 'Cách dịch chính giữ được hình ảnh và phạm vi rộng của từ Hy Lạp: những điều khiến người khác sa ngã về đạo đức hoặc thuộc linh, mà không quyết định quá sớm đó chỉ là xúc phạm, cám dỗ hay nguyên nhân phạm tội.'
- issue: Trách nhiệm của người trong δι’ οὗ
  choice: “người làm chúng xảy đến”
  alternative: “người mà qua người ấy chúng đến”
  rationale: Cách diễn đạt được chọn rõ và tự nhiên hơn trong tiếng Việt, nhưng không làm mất sự căng thẳng giữa việc các cớ vấp ngã chắc chắn sẽ đến và trách nhiệm nghiêm trọng của người đưa chúng đến.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc phủ định kép được giữ vì tự nhiên trong tiếng Việt và phản ánh sát lập luận của nguyên văn. Dấu chấm phẩy làm rõ sự tương phản giữa tính tất yếu của các cớ vấp ngã và trách nhiệm của người gây ra chúng.
