  to: 'Người ta cũng sẽ không nói: ‘Kìa, ở đây!’ hay ‘Ở kia!’ Vì kìa, vương quốc Đức Chúa Trời ở giữa các ông.[a]'
  rationale: Bản sửa chỉ loại bỏ sắc thái tiếp diễn không cần thiết, thay cách diễn đạt hơi gượng bằng một tương đương tự nhiên hơn cho ἰδοὺ, và chuẩn hóa dấu câu. Cách dịch chính “ở giữa các ông” cùng chú thích về nghĩa “ở bên trong các ông” được giữ nguyên để bảo tồn tính mơ hồ thực sự của ἐντὸς ὑμῶν.
