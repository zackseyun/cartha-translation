base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: vi
  text: 'Người ta cũng sẽ không nói: ‘Kìa, ở đây!’ hay ‘Ở kia!’ Vì kìa, vương quốc Đức Chúa Trời ở giữa các ông.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vương quốc Đức Chúa Trời ở bên trong các ông.” Cụm từ Hy Lạp có thể chỉ điều ở bên trong hoặc điều hiện diện giữa một tập thể.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Người ta cũng sẽ không nói
  rationale: Diễn đạt tự nhiên sự tiếp nối phủ định từ câu trước, đồng thời giữ thì tương lai của ἐροῦσιν.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘Kìa, ở đây!’ hay ‘Ở kia!’
  rationale: Giữ cấu trúc chỉ địa điểm đối xứng; ‘Kìa’ là lời hướng sự chú ý tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: ἰδοὺ γὰρ
  choice: Vì này
  rationale: ‘Vì’ giữ quan hệ giải thích của γάρ; ‘này’ phản ánh lời nhấn mạnh ἰδού mà không lặp lại ‘kìa’.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch minh bạch, giữ cả chiều kích vương quyền lẫn thực tại cánh chung của βασιλεία.
- source_word: ἐντὸς ὑμῶν ἐστιν
  choice: đang ở giữa các ông
  rationale: Trong ngữ cảnh nói với một nhóm người Pha-ri-si, cách dịch này thể hiện nghĩa tập thể ‘ở giữa/cùng ở giữa’, đồng thời ‘đang’ làm rõ sự hiện diện hiện tại mà không thêm ý địa điểm hữu hình.
theological_decisions:
- issue: Ý nghĩa của ἐντὸς ὑμῶν
  choice: vương quốc Đức Chúa Trời đang ở giữa các ông
  alternative: vương quốc Đức Chúa Trời ở bên trong các ông
  rationale: Cụm Hy Lạp có thể được hiểu theo nghĩa nội tại hoặc tập thể. Đại từ số nhiều và ngữ cảnh về việc chỉ ra một địa điểm khiến nghĩa ‘ở giữa các ông’ phù hợp hơn cho chính văn, nhưng nghĩa ‘ở bên trong các ông’ vẫn khả dĩ và được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng ‘các ông’ để thể hiện ngôi thứ hai số nhiều trong lời nói trực tiếp với nhóm người Pha-ri-si; dùng ‘Kìa’ và ‘này’ để giữ hai lần xuất hiện của ἰδού mà tránh lặp từ cứng nhắc.
