id: LUK.17.37
reference: Luke 17:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: vi
  text: 'Họ thưa với Ngài: “Thưa Chúa, ở đâu?” Ngài đáp: “Nơi nào có thân xác[a], nơi đó chim kền kền[b] cũng sẽ tụ lại.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Thân xác” cũng có thể dịch là “xác chết,” khiến hình ảnh chim ăn xác trở nên rõ hơn.
    reason: lexical_alternative
  - marker: b
    text: Hay “đại bàng.” Từ Hy Lạp có thể chỉ đại bàng, nhưng trong ngữ cảnh chim tụ quanh một thân xác, “chim kền kền” có lẽ truyền đạt ý nghĩa rõ hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: Họ thưa
  rationale: Diễn đạt tự nhiên hành động đáp lời và sắc thái kính trọng trong lời các môn đồ nói với Chúa Giê-su; tiếng Việt không cần giữ công thức phân từ Hy Lạp một cách cứng nhắc.
- source_word: Ποῦ, κύριε
  choice: Thưa Chúa, ở đâu?
  rationale: Giữ câu hỏi ngắn gọn về địa điểm và dịch κύριε bằng tước hiệu thông dụng, trang trọng “Chúa”.
- source_word: Ὅπου
  choice: Nơi nào… nơi đó
  rationale: Cấu trúc tương liên này chuyển tải tự nhiên sắc thái khái quát, mang tính châm ngôn của câu Hy Lạp.
- source_word: σῶμα
  choice: thân xác
  rationale: Giữ nghĩa cơ bản là “thân thể/thân xác” thay vì xác quyết rõ là “xác chết”; ngữ cảnh chim ăn xác tự gợi ra tình trạng chết.
- source_word: ἀετοὶ
  choice: chim kền kền
  rationale: Từ Hy Lạp có thể chỉ đại bàng, nhưng hình ảnh chim tụ quanh một thân xác phù hợp hơn với loài chim ăn xác; phương án “đại bàng” được giữ trong chú thích.
- source_word: ἐπισυναχθήσονται
  choice: sẽ tụ lại
  rationale: Diễn đạt rõ ý quy tụ trong thì tương lai bằng tiếng Việt tự nhiên; tránh lối bị động “sẽ được tụ họp” vốn dễ gợi một tác nhân cụ thể mà bản văn không nêu.
theological_decisions:
- issue: Ý nghĩa của hình ảnh thân xác và chim ăn xác
  choice: Giữ nguyên hình ảnh châm ngôn mà không xác định đối tượng ám chỉ
  alternative: Giải thích đó là quân đội La Mã, sự phán xét cuối cùng, hoặc một nguyên tắc chung về sự phán xét không thể tránh khỏi
  rationale: Bản văn Hy Lạp không xác định trực tiếp ý nghĩa quy chiếu; bản dịch cần bảo toàn tính hàm súc và sự căng thẳng thần học thay vì quyết định thay người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cặp “nơi nào… nơi đó” giữ giọng châm ngôn; “thưa” thể hiện cách xưng hô kính trọng mà không làm câu văn nặng nề.
