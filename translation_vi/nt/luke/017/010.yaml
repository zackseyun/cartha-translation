  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: vi
  text: 'Cũng vậy, khi anh em đã làm mọi điều đã được truyền cho anh em, hãy nói: “Chúng tôi là những nô lệ vô dụng[a]; chúng tôi đã làm điều chúng tôi có bổn phận phải làm[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “những nô lệ không sinh lợi” hoặc “những nô lệ không có ích”. Trong ngữ cảnh này, cách nói nhấn mạnh rằng việc làm trọn mệnh lệnh không tạo cho họ quyền đòi phần thưởng.'
    reason: Bảo lưu phạm vi nghĩa của ἀχρεῖοι, đồng thời giải thích sắc thái ngữ cảnh mà không thay thế nghĩa từ vựng trong bản chính.
  - marker: b
    text: 'Hay: “điều chúng tôi phải làm”.'
    reason: Nêu cách diễn đạt ngắn gọn cho nghĩa vụ trong ὃ ὠφείλομεν ποιῆσαι.
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Cũng vậy, ... anh em
  rationale: Diễn đạt tự nhiên mối liên hệ suy luận giữa lời áp dụng này và minh họa ngay trước đó; đại từ số nhiều được giữ rõ bằng “anh em”.
- source_word: ὅταν ποιήσητε
  choice: khi anh em đã làm
  rationale: ὅταν với động từ giả định bất định quá khứ chỉ một tình huống chung hoặc tương lai, trong đó hành động hoàn tất trước mệnh lệnh “hãy nói”.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: mọi điều được truyền cho mình
  rationale: “Được truyền” giữ sắc thái mệnh lệnh có thẩm quyền của διατάσσω; “cho mình” quy chiếu tự nhiên về chủ ngữ “anh em” trong tiếng Việt.
- source_word: λέγετε
  choice: hãy nói
  rationale: Thể mệnh lệnh hiện tại được chuyển bằng mệnh lệnh trực tiếp, tự nhiên trong tiếng Việt, không áp đặt sắc thái tiếp diễn không chắc chắn.
- source_word: Δοῦλοι
  choice: những nô lệ
  rationale: Bối cảnh trực tiếp là quan hệ chủ–nô lệ, nên “nô lệ” giữ rõ địa vị lệ thuộc và sức nặng của hình ảnh hơn “đầy tớ”.
- source_word: ἀχρεῖοί
  choice: không đáng được kể công
  rationale: Trong ngữ cảnh, cụm từ nhấn mạnh rằng việc vâng lời không tạo ra công trạng vượt mức hay quyền đòi thưởng. Cách dịch này tránh khiến độc giả hiểu rằng các môn đồ hoàn toàn vô dụng hoặc không có giá trị, đồng thời giữ được ý không có công trạng để yêu sách.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: điều mình có bổn phận phải làm
  rationale: ὀφείλω diễn tả nghĩa vụ hay điều mắc nợ phải thực hiện; “có bổn phận phải làm” là cách nói hiện đại, rõ ràng và tự nhiên.
- source_word: πεποιήκαμεν
  choice: chúng tôi đã làm
  rationale: Thì hoàn thành chỉ hành động đã hoàn tất và có ý nghĩa ở hiện tại; trong tiếng Việt, “đã làm” diễn đạt tự nhiên giá trị này.
theological_decisions:
- issue: Cách dịch δοῦλοι trong hình ảnh về môn đồ
  choice: nô lệ
  alternative: đầy tớ; tôi tớ
  rationale: Bối cảnh kể về người thuộc quyền một chủ và phải thi hành mệnh lệnh. “Nô lệ” bảo toàn thực tại xã hội và lực tu từ của hình ảnh, không biến nó thành quan hệ phục vụ tự nguyện.
- issue: Ý nghĩa của ἀχρεῖοι
  choice: không đáng được kể công
  alternative: vô dụng; không sinh lợi; không xứng đáng
  rationale: Lời nói kết hợp ngay với việc họ đã hoàn tất bổn phận, nên trọng tâm là không có công trạng dư thừa để khiến chủ mắc nợ. Bản dịch chính thể hiện điểm ấy nhưng chú thích vẫn bảo lưu các nghĩa từ vựng mạnh hơn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Lời trích dùng “chúng tôi” vì nhóm người nói tự nhận địa vị trước chủ; “anh em” thể hiện rõ đại từ số nhiều trong lời Chúa Giê-su. Dùng “nô lệ” theo bối cảnh lịch sử cụ thể, còn cụm “không đáng được kể công” diễn đạt ý nghĩa ngữ cảnh mà không xóa các khả năng sát chữ, vốn được giữ trong chú thích.
