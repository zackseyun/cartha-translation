  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: vi
  text: 'Ngài nói với anh: “Hãy đứng dậy và đi; đức tin[a] của anh đã cứu anh[b].”


    [a] Cũng có thể dịch là “lòng tin”. Từ Hy Lạp này có thể chỉ đức tin, lòng tin cậy hoặc sự trung tín; trong câu này, “đức tin” là cách dịch phù hợp nhất.


    [b] Cũng có thể dịch là “đã làm cho anh được lành” hoặc “đã chữa lành anh”. Động từ Hy Lạp này có thể nói đến việc cứu thoát, chữa lành hoặc ban sự cứu rỗi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lòng tin”. Từ Hy Lạp này có thể chỉ đức tin, lòng tin cậy hoặc sự trung tín; trong câu này, “đức tin” là cách dịch phù hợp nhất.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đã làm cho anh được lành” hoặc “đã chữa lành anh”. Động từ Hy Lạp này có thể nói đến việc cứu thoát, chữa lành hoặc ban sự cứu rỗi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: Ngài nói với anh
  rationale: Cách diễn đạt tự nhiên trong lời kể tiếng Việt; “anh” quy chiếu đến người Sa-ma-ri vừa được chữa lành mà không thêm chi tiết giải thích vào chính văn.
- source_word: Ἀναστὰς
  choice: Hãy đứng dậy
  rationale: Phân từ bất định quá khứ được dùng với lực mệnh lệnh cùng với động từ theo sau; “hãy đứng dậy” rõ nghĩa, tự nhiên và trang trọng vừa phải.
- source_word: πορεύου
  choice: và đi
  rationale: Mệnh lệnh đơn giản, trực tiếp; cách dịch này tránh lối nói cổ “hãy đi đường mình” vốn không cần thiết trong tiếng Việt hiện đại.
- source_word: πίστις
  choice: đức tin
  rationale: Giữ thuật ngữ quen thuộc và phạm vi thần học của πίστις; khả năng hiểu là “lòng tin” được nêu trong chú thích, còn “sự trung tín” ít có khả năng hơn trong ngữ cảnh này.
- source_word: σέσωκέν σε
  choice: đã cứu anh
  rationale: Thể hoàn thành của σῴζω diễn tả hành động với kết quả còn hiệu lực. “Đã cứu anh” giữ được nghĩa rộng hơn sự chữa lành thể chất, trong khi các nghĩa chữa lành vẫn được bảo lưu ở chú thích.
theological_decisions:
- issue: Ý nghĩa của σέσωκέν σε trong bối cảnh chữa lành
  choice: đã cứu anh
  alternative: đã làm cho anh được lành; đã chữa lành anh
  rationale: Động từ σῴζω có thể chỉ sự chữa lành thể chất hoặc sự cứu rỗi. Vì cả mười người đều đã được sạch nhưng chỉ người này quay lại tôn vinh Đức Chúa Trời, bản dịch chính giữ nghĩa rộng “đã cứu anh” mà không loại bỏ nghĩa chữa lành; các khả năng kia được nêu trong chú thích.
- issue: Sắc thái của πίστις
  choice: đức tin
  alternative: lòng tin; sự trung tín
  rationale: Trong ngữ cảnh, từ này nhiều khả năng nói đến sự tin cậy của người đàn ông đối với Chúa Giê-su. “Đức tin” giữ cách diễn đạt thần học quen thuộc, còn chú thích bảo lưu phạm vi nghĩa rộng hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm nhưng không cổ kính. Mệnh lệnh “Hãy đứng dậy và đi” tự nhiên với độc giả phổ thông. Đại từ “anh” phù hợp với người đàn ông trưởng thành được Chúa Giê-su trực tiếp nói đến; “Ngài” duy trì giọng kể tôn kính mà không kéo dài câu.
