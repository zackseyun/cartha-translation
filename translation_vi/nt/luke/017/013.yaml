source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: vi
  text: 'Họ cất tiếng kêu lên[a]: “Lạy Giê-su, Thầy[b], xin thương xót chúng tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “cất tiếng lên.”'
    reason: lexical_alternative
  - marker: b
    text: “Thầy” dịch từ Hy Lạp epistatēs, một cách xưng hô với người có thẩm quyền; đây không phải từ thường được dịch là “Chúa” (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp câu chuyện; trong tiếng Việt, mạch kể tự nhiên ở câu độc lập này không nhất thiết phải thêm “và” hay “rồi”, vốn có thể làm nặng câu hoặc tăng sắc thái thời gian.
- source_word: αὐτοὶ
  choice: Họ
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp; “họ” vừa tự nhiên vừa đủ thể hiện chủ thể, không cần dịch nhấn thành “chính họ” trong ngữ cảnh này.
- source_word: ἦραν φωνὴν
  choice: cất tiếng kêu lên
  rationale: Giữ được hình ảnh của thành ngữ Hy Lạp “nâng/cất tiếng” đồng thời truyền đạt tự nhiên việc họ lớn tiếng gọi.
- source_word: λέγοντες
  choice: dấu hai chấm dẫn lời trực tiếp
  rationale: Phân từ “nói rằng” được thể hiện tự nhiên bằng dấu hai chấm trước lời trực tiếp, tránh câu tiếng Việt rườm rà.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Dạng hô cách của tên riêng; dùng cách phiên âm tiếng Việt thông dụng.
- source_word: ἐπιστάτα
  choice: Thầy
  rationale: Đây là lời xưng hô dành cho người có thẩm quyền hoặc đứng đầu. “Thầy” tự nhiên trong tiếng Việt khi thưa với Chúa Giê-su và không đồng nhất từ này với κύριος, thường được dịch là “Chúa”.
- source_word: ἐλέησον
  choice: xin thương xót
  rationale: Mệnh lệnh cách diễn tả lời khẩn cầu được làm mềm tự nhiên bằng “xin”; “thương xót” giữ cả lòng trắc ẩn lẫn lời cầu mong được cứu giúp.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Đại từ ngôi thứ nhất số nhiều làm đối tượng của lòng thương xót; “chúng tôi” phù hợp khi nhóm người thưa với Chúa Giê-su.
theological_decisions:
- issue: Cách dịch tước hiệu ἐπιστάτα dành cho Chúa Giê-su
  choice: Thầy
  alternative: Chúa; Chủ
  rationale: Nguyên văn dùng ἐπιστάτης chứ không phải κύριος. “Thầy” giữ ý tôn kính và thẩm quyền trong lời xưng hô, đồng thời không xóa nhòa sự phân biệt từ vựng hay tự ý đưa sắc thái Kitô học mạnh hơn vào từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lạy” đánh dấu lời trực tiếp khẩn thiết, tôn kính; câu cảm thán giữ sức nặng của lời cầu cứu. Tất cả dấu chú thích đều xuất hiện trong chính văn.
