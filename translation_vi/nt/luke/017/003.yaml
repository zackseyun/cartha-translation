id: LUK.17.3
reference: Luke 17:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: vi
  text: Hãy chú ý đến chính mình.[a] Nếu người anh em của con[b] phạm tội, hãy quở trách người ấy; và nếu người ấy ăn năn, hãy tha thứ cho người ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Nếu người anh em của con phạm tội chống lại con, hãy quở trách người ấy.”'
    reason: textual_variant
  - marker: b
    text: “Anh em” là danh từ giống đực số ít trong tiếng Hy Lạp; trong ngữ cảnh này có thể chỉ một môn đồ đồng đạo nói chung.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Hãy coi chừng chính mình
  rationale: Mệnh lệnh hiện tại kêu gọi sự cảnh giác liên tục. Cách dịch này giữ sắc thái cảnh báo và ý phản thân, đồng thời không quyết định thay người đọc rằng câu này chỉ nói về tự xét mình hay còn hàm ý lưu tâm trong cộng đồng.
- source_word: ἁμάρτῃ
  choice: phạm tội
  rationale: Bản SBLGNT không có bổ ngữ “đối với con”, nên bản dịch giữ nghĩa rộng và không thêm giới hạn ấy vào chính văn.
- source_word: ὁ ἀδελφός σου
  choice: anh em của con
  rationale: Cụm từ Hy Lạp ở ngôi số ít, giống đực. “Anh em của con” giữ hình thức của nguyên văn và tự nhiên hơn “người anh em của con” trong tiếng Việt hiện đại; chú thích nêu khả năng chỉ một môn đồ đồng đạo nói chung.
- source_word: ἐπιτίμησον αὐτῷ
  choice: hãy quở trách người ấy
  rationale: “Quở trách” diễn đạt hành động sửa trị trực tiếp và đủ mạnh, không làm nhẹ thành lời khuyên hay nhắc nhở đơn thuần.
- source_word: μετανοήσῃ
  choice: ăn năn
  rationale: Đây là cách diễn đạt tự nhiên, quen thuộc trong ngữ cảnh đạo đức và thuộc linh, bao hàm sự thay đổi hướng lòng và thái độ đối với tội lỗi.
- source_word: ἄφες αὐτῷ
  choice: hãy tha thứ
  rationale: Trong quan hệ giữa người với người, ἀφίημι mang nghĩa tha thứ. Tiếng Việt có thể lược đối tượng ở đây mà vẫn rõ và tự nhiên.
theological_decisions:
- issue: Có thêm “đối với con” sau “phạm tội” hay không
  choice: Không thêm vào chính văn
  alternative: Nếu anh em của con phạm tội với con, hãy quở trách người ấy...
  rationale: Nguyên văn SBLGNT chỉ có ἐὰν ἁμάρτῃ ὁ ἀδελφός σου, không có εἰς σέ hay cụm tương đương. Vì vậy, chính văn giữ phạm vi rộng hơn; dị bản dài hơn được ghi ở chú thích.
- issue: Phạm vi chỉ người của ἀδελφός
  choice: anh em của con
  alternative: một anh chị em đồng đạo của con; người đồng đạo của con
  rationale: Nguyên văn dùng danh từ giống đực số ít. Chính văn bảo toàn hình thức ấy, còn chú thích giải thích rằng trong bối cảnh này từ đó có thể chỉ rộng hơn đến một môn đồ đồng đạo.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và trực tiếp. Đại từ “con” phù hợp lời Đức Giê-su nói với các môn đồ trong văn mạch. Cần gắn dấu [b] ngay sau “anh em của con” trong chính văn để tương ứng đầy đủ với chú thích.
