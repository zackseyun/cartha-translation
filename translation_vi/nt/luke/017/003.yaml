revisions:
- from: Hãy coi chừng chính mình.[a] Nếu anh em của con phạm tội, hãy quở trách người ấy; và nếu người ấy ăn năn, hãy tha thứ.
  to: Hãy chú ý đến chính mình.[a] Nếu người anh em của con[b] phạm tội, hãy quở trách người ấy; và nếu người ấy ăn năn, hãy tha thứ cho người ấy.
  rationale: Sửa chính văn để diễn đạt προσέχετε ἑαυτοῖς rõ và trung tính hơn trong tiếng Việt, làm rõ số ít của ἀδελφός, và thêm đầy đủ chú thích [b] cùng neo của nó. Thêm “cho người ấy” sau “tha thứ” để phản ánh rõ αὐτῷ, đồng thời giữ câu tự nhiên. Chú thích [a] tiếp tục bảo tồn dị bản dài mà không đưa “chống lại con” vào chính văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:25Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng dị bản SBLGNT ngắn, không thêm “đối với con” vào chính văn; các động từ “phạm tội,” “quở trách,” “ăn năn,” và “tha thứ” chuyển đạt sát nghĩa. Tuy nhiên, “Hãy coi chừng chính mình” trong tiếng Việt dễ hiểu là chỉ tự bảo vệ hoặc tự đề phòng, trong khi προσέχετε ἑαυτοῖς là lời kêu gọi hãy lưu ý/cẩn thận về chính mình, với phạm vi phản thân rộng hơn.
  naturalness: Câu văn nhìn chung tự nhiên và phù hợp văn phong hiện đại. “Hãy chú ý đến chính mình” rõ hơn và ít gây hiểu nhầm hơn “Hãy coi chừng chính mình.” “anh em của con” có thể được hiểu là nhiều anh em, trái với số ít của ὁ ἀδελφός σου; “người anh em của con” bảo toàn số ít một cách tự nhiên.
  terminology: “Ăn năn,” “quở trách,” và “tha thứ” phù hợp ngữ cảnh. Cần bổ sung chú thích về phạm vi khả dĩ của ἀδελφός và đặt neo [b] trong chính văn, như chính hồ sơ dự thảo đã nhận ra. Cụm “phạm tội với con” trong chú thích dị bản được đổi thành “phạm tội chống lại con” để diễn đạt rõ quan hệ εἰς σέ của bản đọc dài.
  issues:
  - severity: medium
    issue: Thiếu chú thích [b] về “anh em” và neo tương ứng trong chính văn.
    rationale: Hồ sơ quyết định dịch thuật yêu cầu ghi chú rằng danh từ giống đực số ít này có thể chỉ một môn đồ đồng đạo nói chung. Bản thảo chỉ có chú thích [a], dù phần translation_notes cũng đã nêu thiếu sót này.
  - severity: low
    issue: “Hãy coi chừng chính mình” có thể thu hẹp hoặc lệch sắc thái của προσέχετε ἑαυτοῖς.
    rationale: Cách nói này thường gợi ý tự đề phòng nguy hiểm. “Hãy chú ý đến chính mình” duy trì lời kêu gọi cảnh giác phản thân mà không xác định quá mức nội hàm.
  - severity: low
    issue: “anh em của con” mơ hồ về số lượng trong tiếng Việt.
    rationale: Nguyên văn là danh từ giống đực số ít. “Người anh em của con” diễn đạt số ít minh bạch hơn, vẫn giữ giới tính ngữ pháp của nguồn.
