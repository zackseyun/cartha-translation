  - severity: low
    issue: “Tôi nói với các người rằng” hơi nặng và kém tự nhiên.
    rationale: “Tôi nói cho các người biết” là công thức tiếng Việt hiện đại tự nhiên, vẫn giữ lực khẳng định của λέγω γὰρ ὑμῖν.
