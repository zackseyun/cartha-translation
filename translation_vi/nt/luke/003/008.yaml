id: LUK.3.8
reference: Luke 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: vi
  text: 'Vậy, hãy sinh ra những kết quả phù hợp với sự ăn năn[a], và đừng bắt đầu tự nhủ[b]: ‘Chúng ta có Áp-ra-ham là cha,’ vì tôi nói cho các người biết rằng Đức Chúa Trời có thể từ những hòn đá này dựng nên con cháu cho Áp-ra-ham.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những quả xứng hợp với sự ăn năn.” Tiếng Hy Lạp dùng số nhiều, nhấn mạnh những biểu hiện trong cách sống tương xứng với sự ăn năn chân thật.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này cũng có thể có nghĩa là “nói với nhau” hoặc “nói trong lòng.” Tiếng Hy Lạp có thể chỉ lời tự nhủ trong lòng hoặc lời họ nói với nhau trong nhóm mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: hãy sinh
  rationale: Mệnh lệnh aorist kêu gọi hành động dứt khoát. Khi đi với hình ảnh καρπούς, “sinh ... quả” tự nhiên trong tiếng Việt và giữ được ẩn dụ về kết quả thể hiện qua đời sống.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận rút ra từ lời cảnh báo ngay trước đó, tự nhiên hơn “do đó” trong lời nói trực tiếp.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: những quả xứng hợp với sự ăn năn
  rationale: Giữ số nhiều của καρπούς và diễn đạt ἀξίους theo nghĩa tương xứng, phù hợp. “Sự ăn năn” chỉ sự đổi hướng nội tâm và đời sống, không chỉ cảm giác hối tiếc.
- source_word: μὴ ἄρξησθε λέγειν
  choice: đừng bắt đầu tự nhủ
  rationale: Giữ sắc thái “đừng bắt đầu nói”; kết hợp với ἐν ἑαυτοῖς, “tự nhủ” là cách nói tiếng Việt tự nhiên, đồng thời chú thích bảo lưu khả năng họ nói với nhau trong nhóm.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Chúng ta có Áp-ra-ham là tổ phụ
  rationale: “Tổ phụ” làm rõ đây là lời viện dẫn nguồn gốc huyết thống; “cha” tuy sát hình thức hơn nhưng kém tự nhiên khi nói về Áp-ra-ham như tổ tiên xa.
- source_word: λέγω γὰρ ὑμῖν
  choice: Vì tôi nói với các người rằng
  rationale: Giữ công thức khẳng định trang trọng và liên từ γάρ giải thích lý do họ không được cậy vào dòng dõi.
- source_word: δύναται ὁ θεὸς
  choice: Đức Chúa Trời có thể
  rationale: Diễn đạt trực tiếp năng quyền của Đức Chúa Trời bằng tiếng Việt hiện đại.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: từ những hòn đá này dựng nên con cháu cho Áp-ra-ham
  rationale: “Dựng nên” bảo lưu sắc thái của ἐγεῖραι là làm xuất hiện hoặc làm dấy lên, không diễn giải thành một cơ chế cụ thể. “Con cháu” phù hợp với ngữ cảnh dòng dõi hơn “con cái”.
theological_decisions:
- issue: Ý nghĩa của “những quả xứng hợp với sự ăn năn”
  choice: Những kết quả hữu hình trong cách sống phải tương xứng với sự ăn năn chân thật.
  alternative: Có thể dịch “kết quả phù hợp với sự ăn năn” để bỏ ẩn dụ, hoặc “quả chứng tỏ lòng ăn năn” để nhấn mạnh bằng chứng.
  rationale: Bản dịch giữ nguyên ẩn dụ và mối tương quan giữa sự ăn năn với hành vi, nhưng không thêm ý rằng hành vi lập công để được tha thứ.
- issue: Giá trị của việc thuộc dòng dõi Áp-ra-ham
  choice: Lời tuyên bố bác bỏ việc dựa vào huyết thống Áp-ra-ham như một sự bảo đảm trước mặt Đức Chúa Trời.
  alternative: Có thể hiểu rộng hơn rằng Đức Chúa Trời có quyền tạo nên một cộng đồng giao ước mới, nhưng câu này không tự nó giải thích đầy đủ cộng đồng ấy là ai.
  rationale: Bản dịch giữ sức nặng của lời cảnh cáo và quyền tự do của Đức Chúa Trời mà không đưa các hệ thống thần học hậu kỳ vào câu.
- issue: Sắc thái của τέκνα τῷ Ἀβραάμ
  choice: “con cháu cho Áp-ra-ham” giữ cả ý quan hệ dòng dõi và việc Đức Chúa Trời có thể làm xuất hiện những người ở trong quan hệ ấy.
  alternative: “con cái cho Áp-ra-ham” sát từ hơn nhưng dễ được hiểu là con trực tiếp trong tiếng Việt.
  rationale: Ngữ cảnh đối chiếu sự cậy vào tổ tiên cho thấy trọng tâm là tư cách thuộc dòng dõi Áp-ra-ham, còn bản văn không xác định rõ ở đây đó là dòng dõi theo nghĩa sinh học hay tư cách rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “sự ăn năn” theo cách dùng Kinh Thánh quen thuộc nhưng giải nghĩa bằng chú thích; dùng “các người” để giữ lời quở trách trực tiếp mà không quá cổ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
