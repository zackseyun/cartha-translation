  source_fidelity: Bản dịch nhìn chung truyền đạt đúng mệnh lệnh, số nhiều của καρπούς, lời cảnh cáo về việc cậy dòng dõi Áp-ra-ham, và quyền năng của Đức Chúa Trời. Tuy nhiên, “tổ phụ” thu hẹp và làm dịu cách nói trực tiếp πατέρα (“cha”), còn việc tách “Vì tôi nói...” thành một câu mới làm lỏng liên kết γάρ với lời tự biện hộ được trích dẫn.
  naturalness: “Đừng bắt đầu tự nhủ” là tự nhiên và chú thích đã bảo lưu đúng tính mơ hồ của ἐν ἑαυτοῖς. “Tôi nói với các người rằng” hơi gượng trong tiếng Việt hiện đại; “tôi nói cho các người biết” tự nhiên hơn. “Những kết quả phù hợp với sự ăn năn” rõ nghĩa hơn “những quả xứng hợp với sự ăn năn”, đồng thời vẫn giữ ý hành vi tương ứng với sự ăn năn.
  terminology: Giữ “sự ăn năn” và “Đức Chúa Trời” nhất quán với bản thảo. Dùng “cha chúng ta” cho πατέρα ... τὸν Ἀβραάμ sát nguồn hơn “tổ phụ”; trong ngữ cảnh này, cách nói ấy vẫn tự nhiên và thể hiện rõ lời họ viện dẫn quan hệ dòng dõi. Giữ “con cháu cho Áp-ra-ham” vì phù hợp ngữ cảnh, dù τέκνα sát chữ là “con cái/con.”
