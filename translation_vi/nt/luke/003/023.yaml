id: LUK.3.23
reference: Luke 3:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: vi
  text: Chính Đức Giê-su, khi bắt đầu[a], thì vào khoảng ba mươi tuổi. Người là con ông Giô-sép—như người ta vẫn nghĩ[b]; Giô-sép là con ông Hê-li.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “bắt đầu” mà không nêu rõ bắt đầu việc gì; theo văn cảnh, có lẽ là bắt đầu hoạt động công khai.
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là người ta thường coi Đức Giê-su là con của Giô-sép.
    reason: alternative_reading
  - marker: c
    text: Tiếng Hy Lạp trình bày gia phả bằng một chuỗi sở hữu cách rút gọn; ở đây từ “con” được hiểu ngầm trước tên Hê-li.
    reason: translation_clarity
lexical_decisions:
- source_word: Καὶ αὐτὸς … Ἰησοῦς
  choice: Chính Đức Giê-su
  rationale: Dùng “chính” để giữ sắc thái nhấn mạnh của αὐτός. Không dịch máy móc Καί thành “và” ở đầu câu vì tiếng Việt không cần liên từ ấy để duy trì mạch kể.
- source_word: ἀρχόμενος
  choice: khi bắt đầu
  rationale: Giữ động từ ở dạng không nêu bổ ngữ như nguyên văn; bối cảnh cho thấy đây là lúc Đức Giê-su bắt đầu hoạt động công khai, nhưng bản văn không có từ tương đương với “chức vụ” hay “sứ vụ”.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: vào khoảng ba mươi tuổi
  rationale: Cách nói tự nhiên trong tiếng Việt và giữ rõ tính ước lượng của ὡσεί.
- source_word: υἱός, ὡς ἐνομίζετο, Ἰωσὴφ
  choice: là con ông Giô-sép—như người ta vẫn nghĩ—
  rationale: Cụm chen giữa giữ khoảng cách của người kể đối với nhận định phổ biến rằng Đức Giê-su là con của Giô-sép; “người ta vẫn nghĩ” tự nhiên hơn lối bị động cứng trong tiếng Việt.
- source_word: τοῦ Ἠλὶ
  choice: Giô-sép là con ông Hê-li
  rationale: Chuỗi sở hữu cách rút gọn trong gia phả được diễn đạt đầy đủ để người đọc tiếng Việt hiểu quan hệ nối tiếp; từ “con” được bổ sung theo quy ước cú pháp của toàn gia phả.
theological_decisions:
- issue: Quan hệ giữa cụm ὡς ἐνομίζετο và tư cách làm con của Giô-sép
  choice: Đặt “như người ta vẫn nghĩ” trong dấu gạch ngang để cho thấy đây là nhận định phổ biến về Đức Giê-su là con Giô-sép, chứ không phải lời người kể xác nhận quan hệ cha con sinh học.
  alternative: Dịch liền mạch “Người được cho là con ông Giô-sép” hoặc bỏ dấu chen.
  rationale: Cách dịch giữ nguyên sự dè dặt của Lu-ca và sự căng thẳng với trình thuật thụ thai trước đó, nhưng không giải thích thêm theo một hệ phái.
- issue: Có nên thêm “sứ vụ” hoặc “chức vụ” sau “bắt đầu”
  choice: Không thêm trong chính văn.
  alternative: “khi bắt đầu sứ vụ” hoặc “khi bắt đầu thi hành chức vụ”
  rationale: Bối cảnh gợi đến việc bắt đầu hoạt động công khai, nhưng danh từ ấy không có trong tiếng Hy Lạp; giữ cách nói mở tránh giải quyết điều nguyên văn để ngỏ.
- issue: Quan hệ của Hê-li trong chuỗi gia phả
  choice: 'Diễn đạt quan hệ nối tiếp theo cú pháp gia phả: Giô-sép là con Hê-li.'
  alternative: Giữ sát hình thức rút gọn “con ông Giô-sép, của ông Hê-li”.
  rationale: Tiếng Hy Lạp dùng chuỗi sở hữu cách với từ “con” được hiểu ngầm ở các mắt xích sau. Lặp lại chủ thể và từ “con” giúp tiếng Việt sáng nghĩa mà không đưa thêm một cách giải thích thần học về bản chất của gia phả.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Giê-su” và kính ngữ “Người” theo lối tiếng Việt phổ thông; dùng “ông” trước tên Giô-sép và Hê-li để câu gia phả tự nhiên. Dấu gạch ngang thể hiện rõ lời chen của người kể mà không làm mất tính cô đọng.
