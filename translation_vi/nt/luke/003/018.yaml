  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: vi
  text: Vậy, với nhiều lời khuyên nhủ khác nữa[a], ông loan báo tin mừng cho dân chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vậy, ông còn khuyên nhủ họ nhiều điều khác.” Tiếng Hy Lạp không nói rõ đối tượng của từ “nhiều”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ
  choice: nhiều
  rationale: Tính từ số nhiều giống trung được dùng như danh từ; đối tượng được lược bỏ, chỉ nhiều điều hoặc nhiều lời Giăng nói.
- source_word: μὲν οὖν
  choice: Vậy
  rationale: Diễn đạt sự tiếp nối và chuyển ý của tổ hợp tiểu từ một cách tự nhiên trong tiếng Việt, không cố tách nghĩa từng tiểu từ.
- source_word: καὶ ἕτερα
  choice: khác nữa
  rationale: 'Thể hiện ý bổ sung của ἕτερα và καί: còn có nhiều lời khuyên nhủ khác ngoài những điều vừa được thuật lại.'
- source_word: παρακαλῶν
  choice: bằng ... lời khuyên nhủ
  rationale: Trong bối cảnh lời rao giảng mang tính tiên tri của Giăng, cách dịch này bao hàm sự khuyên bảo và thúc giục, đồng thời kết hợp tự nhiên với Πολλὰ ... καὶ ἕτερα.
- source_word: εὐηγγελίζετο
  choice: loan báo tin mừng
  rationale: Giữ rõ ý công bố tin mừng; động từ chính ở thì chưa hoàn thành mô tả hoạt động đang tiếp diễn, điều mà ngữ cảnh tiếng Việt truyền đạt tự nhiên.
- source_word: τὸν λαόν
  choice: cho dân chúng
  rationale: Dịch sát đối tượng được Giăng rao giảng mà không thu hẹp thành một nhóm không được câu này nêu rõ.
theological_decisions:
- issue: Sắc thái của εὐηγγελίζετο đối với chức vụ của Giăng
  choice: loan báo tin mừng
  alternative: rao giảng; công bố
  rationale: Nguyên văn chủ ý mô tả lời khuyên nhủ của Giăng là việc loan báo tin mừng. Giữ cách diễn đạt này bảo tồn sức căng thần học của câu thay vì làm nhạt thành việc giảng dạy nói chung.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Ông” theo tự nhiên chỉ về Giăng trong mạch văn; “loan báo tin mừng” tránh thuật ngữ giáo phái và giữ sắc thái của nguyên văn.
