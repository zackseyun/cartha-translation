  text: the son of Joanan[a], the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri[b],
translation:
  language: vi
  text: con của Giô-a-nan[a], con của Rê-sa, con của Xô-rô-ba-bên, con của Sa-la-thi-ên[b], con của Nê-ri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp lặp mạo từ ở sở hữu cách trước mỗi tên; “con của” được bổ sung theo mô thức gia phả đã được xác lập trong ngữ cảnh.
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “Sa-la-thi-ên”; theo truyền thống, tên này được xem là tương ứng với Sê-anh-ti-ên trong Cựu Ước.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả này, mạo từ sở hữu cách lặp lại trước mỗi tên mang ý nghĩa tỉnh lược dựa trên công thức đã được xác lập trong ngữ cảnh. Bổ sung “con của” truyền đạt rõ quan hệ được hàm ý và tự nhiên trong tiếng Việt.
- source_word: Ἰωανὰν
  choice: Giô-a-nan
  rationale: Phiên âm tên riêng Hy Lạp sang dạng quen thuộc, dễ đọc trong tiếng Việt.
- source_word: Ῥησὰ
  choice: Rê-sa
  rationale: Phiên âm trực tiếp tên riêng Hy Lạp theo âm tiết tự nhiên trong tiếng Việt.
- source_word: Ζοροβαβὲλ
  choice: Xô-rô-ba-bên
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt, đồng thời phản ánh tên Hy Lạp Ζοροβαβέλ và giúp nhận ra nhân vật Cựu Ước.
- source_word: Σαλαθιὴλ
  choice: Sa-la-thi-ên
  rationale: Phiên âm sát dạng Hy Lạp Σαλαθιήλ; mối liên hệ truyền thống với tên Hê-bơ-rơ Sê-anh-ti-ên được ghi ở chú thích thay vì thay thế âm dạng của bản nguồn.
- source_word: Νηρὶ
  choice: Nê-ri
  rationale: Phiên âm trực tiếp tên riêng Hy Lạp bằng hình thức tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cấu trúc tỉnh lược trong gia phả
  choice: Lặp lại “con của” trước mỗi tên.
  alternative: Dùng một chuỗi tên với quan hệ sở hữu không được nói rõ.
  rationale: Bản Hy Lạp chỉ lặp mạo từ sở hữu cách, nhưng quan hệ cha-con được hàm ý từ mô thức gia phả trong ngữ cảnh. Nêu rõ “con của” bảo toàn ý nghĩa cú pháp mà không thêm một khẳng định thần học ngoài văn bản.
- issue: Dạng tên Σαλαθιὴλ
  choice: Dịch theo dạng Hy Lạp là “Sa-la-thi-ên” và ghi nhận cách đồng nhất truyền thống trong chú thích.
  alternative: Dùng trực tiếp dạng tên Cựu Ước “Sê-anh-ti-ên” trong chính văn.
  rationale: Cách chọn này ưu tiên chứng cứ của văn bản nguồn Hy Lạp, đồng thời không che khuất mối liên hệ kinh điển thường được công nhận.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Các tên riêng được phiên âm có dấu và nối âm tiết bằng gạch nối theo lối quen thuộc trong bản văn Kinh Thánh tiếng Việt; cấu trúc “con của” được lặp để gia phả rõ ràng.
