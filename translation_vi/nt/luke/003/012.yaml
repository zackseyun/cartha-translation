  rationale: Chỉ điều chỉnh “Họ thưa với ông” thành “Họ nói với ông” để có tiếng Việt tự nhiên hơn và giữ sắc thái trung tính của εἶπαν. Các lựa chọn khác bảo toàn đầy đủ ý nghĩa, sắc thái nhấn mạnh có chú thích, và văn phong của bản nguồn.
