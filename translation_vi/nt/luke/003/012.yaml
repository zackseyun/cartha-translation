id: LUK.3.12
reference: Luke 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: vi
  text: 'Ngay cả những người thu thuế cũng đến để chịu phép báp-têm[a]. Họ nói với ông: “Thưa thầy, chúng tôi phải làm gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Những người thu thuế cũng đến để chịu phép báp-têm.”'
    reason: Giữ khả năng hiểu δὲ καί theo nghĩa bổ sung trung tính “cũng”, thay vì nét nhấn mạnh “ngay cả”.
lexical_decisions:
- source_word: ἦλθον
  choice: đến
  rationale: Động từ aorist được diễn đạt như một sự việc quá khứ đơn; trong mạch kể tiếng Việt, không nhất thiết phải thêm “đã”.
- source_word: δὲ καὶ τελῶναι
  choice: Ngay cả những người thu thuế cũng
  rationale: Kết hợp sắc thái chuyển ý của δέ với lực bổ sung/nhấn mạnh của καί, qua đó giữ nét đáng chú ý rằng nhóm người này cũng hưởng ứng lời kêu gọi.
- source_word: βαπτισθῆναι
  choice: để chịu phép báp-têm
  rationale: 'Động từ nguyên mẫu bị động chỉ mục đích: họ đến để được làm phép báp-têm. “Chịu phép báp-têm” là cách nói tự nhiên, trang trọng và vẫn giữ sắc thái bị động.'
- source_word: εἶπαν πρὸς αὐτόν
  choice: Họ thưa với ông
  rationale: Giữ hành động nói của λέγω thay vì chuyển thành “hỏi”; “thưa” phù hợp với lời xưng hô kính trọng ngay sau đó, còn “ông” tránh thêm danh tính không có trong câu.
- source_word: Διδάσκαλε
  choice: Thưa thầy
  rationale: Diễn đạt lời gọi trực tiếp và kính trọng dành cho một người dạy dỗ; không dùng “Ra-bi” vì đó không phải từ được dùng trong nguyên văn.
- source_word: τί ποιήσωμεν
  choice: chúng tôi phải làm gì?
  rationale: Truyền đạt câu hỏi cân nhắc bằng thức giả định, xin chỉ dẫn về hành động thích hợp; “phải làm gì” tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sự hưởng ứng của một nhóm bị xem thường trong xã hội đối với lời kêu gọi ăn năn của Giăng
  choice: Dịch rõ τελῶναι là “những người thu thuế” và giữ nét nhấn mạnh bằng “Ngay cả ... cũng”.
  alternative: “Những người thu thuế cũng đến để chịu phép báp-têm.”
  rationale: Cách dịch giữ lực tu từ về sự tham gia đáng chú ý của nhóm này mà không thêm lời phán xét đạo đức hoặc diễn giải thần học ngoài câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Dùng “phép báp-têm” để chỉ nghi thức, “thưa thầy” cho lời xưng hô kính trọng, và tách thành hai câu để lời thoại tự nhiên.
