base_translation:
  language: en
  yaml_path: translation/nt/luke/003/026.yaml
  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: vi
  text: con của Ma-át, con của Ma-tha-thia, con của Sê-mê-in, con của Giô-sếch, con của Giô-đa,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả này, mạo từ sở hữu cách được lặp lại theo lối tỉnh lược, tiếp nối quan hệ cha-con đã rõ từ ngữ cảnh. Dịch là “con của” giúp câu tự nhiên và minh bạch trong tiếng Việt.
- source_word: Μάαθ
  choice: Ma-át
  rationale: Phiên âm tên riêng theo âm dạng Hy Lạp, dùng dấu gạch nối phù hợp quy ước trình bày tên phiên âm trong tiếng Việt.
- source_word: Ματταθίου
  choice: Mát-ta-thia
  rationale: Đây là dạng sở hữu cách của tên Ματταθίας; bản dịch dùng dạng tên cơ bản và phiên âm trực tiếp sang tiếng Việt.
- source_word: Σεμεῒν
  choice: Sê-mê-in
  rationale: Phiên âm trực tiếp tên riêng theo dạng Hy Lạp, không đồng nhất với một dạng Hê-bơ-rơ chưa chắc chắn.
- source_word: Ἰωσὴχ
  choice: Giô-sếch
  rationale: Phiên âm sát dạng Hy Lạp Ἰωσήχ, trong đó phụ âm cuối χ được thể hiện bằng “ch”.
- source_word: Ἰωδὰ
  choice: Giô-đa
  rationale: Phiên âm trực tiếp dạng Hy Lạp Ἰωδά, không hòa hợp hóa thành một dạng tên khác.
theological_decisions: []
translation_notes:
  register: Văn phong gia phả ngắn gọn, trang trọng và dễ hiểu. Lặp “con của” để thể hiện rõ cấu trúc tỉnh lược của nguyên văn. Không đặt chú thích vì sự bổ sung này được ngữ cảnh gia phả xác định rõ và vận hành tự nhiên trong tiếng Việt.
