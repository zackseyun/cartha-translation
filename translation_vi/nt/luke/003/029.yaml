base_translation:
  language: en
  yaml_path: translation/nt/luke/003/029.yaml
  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: vi
  text: con của Giê-sua, con của Ê-li-ê-xe, con của Giô-rim, con của Mát-thát, con của Lê-vi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: Giê-sua
  rationale: Dùng dạng tên riêng phân biệt cho một tổ tiên trong gia phả; nguyên ngữ là dạng sở hữu của Ἰησοῦς, tên có thể tương ứng với Giê-su/Giô-suê trong những ngữ cảnh khác.
- source_word: Ἐλιέζερ
  choice: Ê-li-ê-xe
  rationale: Phiên âm tên riêng Hy Lạp theo cách đọc rõ ràng, quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: Ἰωρίμ
  choice: Giô-rim
  rationale: Phiên âm trực tiếp tên riêng, giữ âm đầu và cấu trúc âm tiết dễ đọc trong tiếng Việt.
- source_word: Μαθθάτ
  choice: Mát-thát
  rationale: Phiên âm tên riêng và thể hiện hai thành tố phụ âm của dạng Hy Lạp mà không làm tên khó đọc.
- source_word: Λευί
  choice: Lê-vi
  rationale: Dùng dạng tên đã quen thuộc rộng rãi trong tiếng Việt.
- source_word: τοῦ
  choice: con của
  rationale: Trong chuỗi gia phả, sở hữu cách lặp lại biểu thị quan hệ cha-con; bổ sung danh từ được hàm ý để câu tiếng Việt tự nhiên và rõ nghĩa.
theological_decisions:
- issue: Quan hệ gia phả được hàm ý bởi sở hữu cách Hy Lạp
  choice: Lặp lại cấu trúc “X con của Y”
  alternative: Chỉ liệt kê các tên sau “con của” một lần
  rationale: Cách chọn này truyền đạt rõ quan hệ nối tiếp giữa từng thế hệ mà không thêm nhận định thần học ngoài văn bản.
- issue: Cách thể hiện tên Ἰησοῦς của nhân vật trong gia phả
  choice: Giê-sua
  alternative: Giê-su hoặc Giô-suê
  rationale: “Giê-sua” giúp phân biệt nhân vật tổ tiên này với Đức Giê-su trong cùng sách, đồng thời không khẳng định chắc chắn một dạng tên Hê-bơ-rơ cụ thể hơn điều bản Hy Lạp cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Giữ nhịp liệt kê của gia phả, đồng thời lặp tên theo cú pháp tiếng Việt để tránh nhập nhằng quan hệ giữa các thế hệ.
