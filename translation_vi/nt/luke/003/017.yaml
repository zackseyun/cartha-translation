review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng hình ảnh và trật tự cơ bản của nguyên văn: dụng cụ sảy, sân đập lúa, lúa mì được thu vào kho, và trấu bị thiêu bằng lửa không thể dập tắt. Tuy nhiên, “Tay người cầm nia” không diễn đạt tự nhiên mệnh đề sở hữu οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ (“nia của người ở trong tay người”), và “sảy sạch sân đập lúa” có thể khiến hiểu rằng chính cái sân được sảy. διακαθᾶραι ở đây nói việc làm sạch/thu dọn kỹ sân đập lúa qua quá trình sảy.'
  naturalness: Cần đổi mở đầu thành “Người cầm nia trong tay” để tiếng Việt tự nhiên và rõ chủ thể. “làm sạch kỹ sân đập lúa” tránh kết hợp từ không tự nhiên “sảy sạch sân”, đồng thời giữ sắc thái tăng cường của διακαθᾶραι.
  terminology: “Nia,” “sân đập lúa,” “lúa mì,” “kho,” “trấu,” và “lửa không thể dập tắt” đều phù hợp với ngữ cảnh nông nghiệp và hình ảnh phán xét. Chú thích về πτύον và ἀποθήκη hữu ích; chú thích về πυρὶ ἀσβέστῳ giữ đúng lựa chọn từ vựng thay thế.
