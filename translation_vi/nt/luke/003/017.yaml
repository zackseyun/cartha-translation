    rationale: Nguyên văn nói dụng cụ sảy thuộc về/người ấy cầm trong tay, không chỉ đơn thuần mô tả một bàn tay đang cầm dụng cụ. “Người cầm nia trong tay” truyền đạt tự nhiên ý này.
