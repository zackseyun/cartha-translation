language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: vi
  text: Người cầm nia[a] trong tay để làm sạch kỹ sân đập lúa của mình và thu lúa mì vào kho[b]; còn trấu thì người sẽ đốt cháy bằng lửa không thể dập tắt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “xẻng sảy lúa” hoặc “chĩa sảy lúa.” Từ Hy Lạp chỉ dụng cụ dùng để tung ngũ cốc lên không trung nhằm tách hạt khỏi trấu.
    reason: lexical_alternative
  - marker: b
    text: Hay “vựa lúa.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “lửa không bao giờ tắt.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: nia
  rationale: Chỉ dụng cụ dùng để tung hoặc sảy thóc, nhờ gió tách hạt khỏi trấu. “Nia” là từ nông nghiệp tự nhiên, dễ hiểu trong tiếng Việt; chú thích giữ lại khả năng đây là một dụng cụ dạng xẻng hoặc chĩa.
- source_word: διακαθᾶραι
  choice: để sảy sạch
  rationale: Động từ nhấn mạnh việc làm sạch hoàn toàn; trong hình ảnh nông nghiệp, “sảy sạch” diễn đạt tự nhiên cả hành động rê sảy lẫn kết quả làm sạch sân đập lúa.
- source_word: ἅλωνα
  choice: sân đập lúa
  rationale: Chỉ nơi lúa được đập và rê sảy. Cách gọi này cụ thể, dễ hiểu và giữ nguyên hình ảnh nông nghiệp.
- source_word: συναγαγεῖν
  choice: thu
  rationale: Diễn đạt ngắn gọn hành động gom phần lúa hữu dụng sau khi sảy.
- source_word: σῖτον
  choice: lúa mì
  rationale: Từ có thể chỉ ngũ cốc nói chung, nhưng trong thế đối lập với trấu ở đây, “lúa mì” là cách hiểu tự nhiên và truyền thống.
- source_word: ἀποθήκην
  choice: kho
  rationale: Chỉ nơi chứa lương thực mà không quy định quá cụ thể kiểu kiến trúc; phù hợp với nghĩa rộng của từ Hy Lạp.
- source_word: ἄχυρον
  choice: trấu
  rationale: Trong ngữ cảnh rê sảy, đây là phần vỏ nhẹ, vô dụng bị tách khỏi hạt; “trấu” phù hợp hơn “rơm” với sự tương phản được mô tả.
- source_word: κατακαύσει
  choice: sẽ đốt cháy
  rationale: Diễn đạt việc thiêu đốt hoàn toàn mà vẫn tự nhiên trong tiếng Việt; kết quả triệt để còn được nhấn mạnh bởi ngọn lửa không thể dập tắt.
- source_word: πυρὶ ἀσβέστῳ
  choice: bằng ngọn lửa không thể dập tắt
  rationale: Giữ đúng ý ngọn lửa không thể bị làm cho tắt, đồng thời bảo toàn sức nặng của hình ảnh phán xét.
- source_word: οὗ
  choice: Tay người cầm
  rationale: Đại từ quan hệ sở hữu mô tả Đấng đang đến. Cấu trúc tiếng Việt này chuyển tự nhiên ý “dụng cụ của người ở trong tay người” mà không làm thay đổi chủ thể.
theological_decisions:
- issue: Hình ảnh phán xét qua việc sảy lúa
  choice: Giữ nguyên sự phân chia dứt khoát giữa lúa mì được thu vào kho và trấu bị đốt bằng lửa không thể dập tắt.
  alternative: Giải thích rõ đây chỉ là sự phán xét lịch sử trên Israel, hoặc diễn giải thành một hệ thống đầy đủ về hình phạt cuối cùng.
  rationale: Câu văn rõ ràng trình bày cả sự thu nhận lẫn sự phán xét, nhưng không tự giải thích đầy đủ thời điểm hay cách thức thần học của sự phán xét ấy. Bản dịch vì vậy không làm nhẹ hình ảnh, cũng không thêm kết luận vượt quá câu gốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” làm đại từ chỉ Đấng đang đến để tránh áp đặt cách viết hoa mang tính diễn giải; nhịp câu giữ sự tương phản mạnh giữa “lúa mì” và “trấu.”
