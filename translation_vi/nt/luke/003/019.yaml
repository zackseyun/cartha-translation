id: LUK.3.19
reference: Luke 3:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: vi
  text: Nhưng tiểu vương Hê-rốt[a] bị ông khiển trách[b] về Hê-rô-đia, vợ của anh/em ông ta, cũng như về mọi điều gian ác Hê-rốt đã làm,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tiểu vương” dịch tước hiệu Hy Lạp tetrarchēs, một tước hiệu của người cai trị một lãnh thổ; từ này nguyên nghĩa liên hệ đến “một phần tư.”
    reason: historical_title
  - marker: b
    text: Cũng có thể dịch là “quở trách” hoặc “vạch rõ lỗi lầm.” Từ Hy Lạp có thể nhấn mạnh sự khiển trách về đạo đức hoặc việc phơi bày điều sai trái.
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: tiểu vương
  rationale: Đây là tước hiệu lịch sử chỉ người cai trị một phần lãnh thổ. “Tiểu vương” tương đối tự nhiên trong tiếng Việt nhưng cần chú thích để tránh hiểu là vua theo nghĩa đầy đủ.
- source_word: ἐλεγχόμενος
  choice: bị ông khiển trách
  rationale: Dạng phân từ thụ động diễn tả việc Hê-rốt chịu sự quở trách về mặt đạo đức; đại từ “ông” giữ cách nói bằng đại từ của nguyên văn và theo ngữ cảnh chỉ Giăng.
- source_word: ὑπ’ αὐτοῦ
  choice: bị ông
  rationale: Giữ đại từ của nguyên văn thay vì đưa tên Giăng vào câu; ngữ cảnh trước đó xác định người được nói đến.
- source_word: περὶ Ἡρῳδιάδος
  choice: về chuyện Hê-rô-đia
  rationale: “Về chuyện” diễn đạt tự nhiên trong tiếng Việt rằng sự khiển trách liên quan đến mối quan hệ với Hê-rô-đia, đồng thời không bổ sung chi tiết ngoài văn bản.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: vợ của anh mình
  rationale: Giữ quan hệ sở hữu trong chuỗi sở hữu cách. Từ ἀδελφός không tự nó xác định anh hay em; tiếng Việt buộc phải xử lý quan hệ tuổi tác, nên chọn cách quen thuộc “anh mình” và ghi nhận tính khái quát của nguyên ngữ trong chú thích.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: cũng như về mọi điều gian ác Hê-rốt đã làm
  rationale: Giữ cấu trúc song song với περὶ thứ nhất, đồng thời diễn đạt tự nhiên toàn bộ các việc xấu xa mà Hê-rốt đã làm.
- source_word: πονηρῶν
  choice: điều gian ác
  rationale: Truyền đạt rõ sắc thái luân lý tiêu cực của từ Hy Lạp mà vẫn trang trọng và dễ hiểu.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển hướng và tương phản trong mạch kể so với phần trước.
theological_decisions:
- issue: Sức nặng đạo đức trong lời phê phán Hê-rốt
  choice: “bị ông khiển trách”
  alternative: “bị ông quở trách” hoặc “bị ông vạch rõ lỗi lầm”
  rationale: “Khiển trách” giữ được tính chất phê phán đạo đức có thẩm quyền mà không biến câu thành một phán quyết pháp lý hay thêm bình luận thần học.
- issue: Tình trạng của Hê-rô-đia trong mệnh đề đồng vị
  choice: “Hê-rô-đia, vợ của anh mình”
  alternative: “Hê-rô-đia, người từng là vợ của anh mình”
  rationale: Nguyên văn gọi bà là vợ của anh/em Hê-rốt và không có từ “từng”; bản dịch giữ nguyên sự căng thẳng trong cách gọi này, không giải quyết theo một cách diễn giải lịch sử hoặc pháp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được giữ ở dạng chưa kết thúc bằng dấu phẩy vì Lu-ca 3:19 nối cú pháp sang câu 20. Tên riêng được phiên âm theo lối Việt hóa phổ biến; hai chú thích đều có ký hiệu tương ứng trong chính văn.
