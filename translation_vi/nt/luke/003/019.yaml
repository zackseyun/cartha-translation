revisions:
- from: Nhưng tiểu vương Hê-rốt[a] bị ông khiển trách[b] về chuyện Hê-rô-đia, vợ của anh mình, cũng như về mọi điều gian ác Hê-rốt đã làm,
  to: Nhưng tiểu vương Hê-rốt[a] bị ông khiển trách[b] về Hê-rô-đia, vợ của anh/em ông ta, cũng như về mọi điều gian ác Hê-rốt đã làm,
  rationale: Sửa “anh mình” thành “anh/em ông ta” để không áp đặt thứ bậc tuổi tác và để quy chiếu rõ người anh/em là của Hê-rốt. Thay “về chuyện Hê-rô-đia” bằng “về Hê-rô-đia” cho sát cấu trúc περὶ. Điều chỉnh chú thích tước hiệu để chính xác hơn về lịch sử và không diễn giải quá mức.
  reviewer_model: gpt-5.6-terra
