review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch câu, sắc thái quở trách đạo đức của ἐλεγχόμενος, và phạm vi rộng của các việc xấu Hê-rốt đã làm. Tuy nhiên, “anh mình” xác định tuổi tác mà ἀδελφός không xác định; đồng thời “mình” dễ làm quan hệ sở hữu thiếu rõ ràng trong câu có cả Giăng lẫn Hê-rốt.
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng, và dấu phẩy cuối câu phù hợp vì cú pháp tiếp tục sang câu 20. “Về Hê-rô-đia” tự nhiên và sát nguyên văn hơn “về chuyện Hê-rô-đia”.
  terminology: “Tiểu vương” có thể giữ như một cách dịch tước hiệu τετραάρχης khi có chú thích. Chú thích hiện hành cần tránh khẳng định đây là người cai trị “một phần tư” hay mặc nhiên “dưới quyền đế quốc Rô-ma”, vì trong cách dùng thế kỷ thứ nhất đây là một tước hiệu chính trị và không nhất thiết mô tả chính xác phần tư lãnh thổ.
  issues:
  - severity: medium
    issue: “vợ của anh mình” thu hẹp nghĩa của ἀδελφός.
    rationale: Từ Hy Lạp ἀδελφός có thể là “anh” hoặc “em”; nguyên văn không nêu thứ bậc tuổi. Cần dùng “anh/em” để bảo toàn sự mơ hồ của nguồn.
  - severity: medium
    issue: Chú thích cho “tiểu vương” giải thích quá cụ thể về chức vị.
    rationale: τετραάρχης nguyên nghĩa liên hệ đến “một phần tư”, nhưng trong ngữ cảnh này là tước hiệu cai trị; không nên trình bày như một định nghĩa hành chính chính xác hoặc gắn tất yếu với quyền đế quốc Rô-ma.
  - severity: low
    issue: “về chuyện Hê-rô-đia” thêm sắc thái tình huống không có trong περὶ Ἡρῳδιάδος.
    rationale: “Về Hê-rô-đia” giữ quan hệ “liên quan đến” của nguyên văn mà không thêm từ “chuyện”.
