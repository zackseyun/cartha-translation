base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: vi
  text: 'Hê-rốt còn thêm việc này vào tất cả những việc trước đó: ông nhốt Giăng vào tù.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Ông còn thêm việc này vào tất cả những việc ấy.” Ý nói Hê-rốt thêm hành động này vào mọi việc xấu khác mình đã làm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: lại chồng thêm
  rationale: Động từ aorist προστίθημι mang ý nghĩa cộng thêm một hành động vào những việc đã làm trước đó; “lại chồng thêm” diễn đạt tự nhiên sắc thái tích lũy.
- source_word: τοῦτο
  choice: việc này
  rationale: Đại từ chỉ định hướng đến hành động cụ thể được kể ngay sau đó, tức việc nhốt Giăng.
- source_word: ἐπὶ πᾶσιν
  choice: lên tất cả những việc ấy
  rationale: Cụm từ có nghĩa tích lũy, tức thêm hành động này vào mọi việc xấu đã nêu trong ngữ cảnh trước; cách dịch vẫn giữ hình ảnh “chồng thêm lên” của nguyên văn.
- source_word: κατέκλεισεν
  choice: nhốt
  rationale: κατακλείω chỉ hành động đóng giữ hoặc giam một người; “nhốt” giữ được tính cụ thể mà không lặp ý không cần thiết với “vào tù”.
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἐν φυλακῇ
  choice: vào tù
  rationale: φυλακή ở đây chỉ nơi giam giữ; kết hợp “nhốt ... vào tù” là cách nói tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng quy chiếu và sắc thái của ἐπὶ πᾶσιν
  choice: Cụm từ nói rằng Hê-rốt thêm việc giam Giăng vào tất cả những việc xấu trước đó của mình.
  alternative: Có thể dịch sát cấu trúc hơn là “thêm việc này vào tất cả” hoặc “trên tất cả những điều ấy”.
  rationale: Ngữ cảnh Lu-ca 3:19–20 liệt kê những việc xấu của Hê-rốt rồi trình bày việc giam Giăng như một hành động xấu nữa. Bản dịch giữ sắc thái tích lũy mà không thêm một phán đoán thần học ngoài ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Chủ ngữ “Hê-rốt” được nêu rõ từ ngữ cảnh thay cho đại từ Hy Lạp hàm ẩn; “lại chồng thêm” giữ sắc thái tích lũy của câu nguồn.
