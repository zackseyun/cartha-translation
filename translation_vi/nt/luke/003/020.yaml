  terminology: “Hê-rốt,” “Giăng,” và “nhốt ... vào tù” phù hợp với cách dùng Kinh Thánh tiếng Việt và với nghĩa của κατέκλεισεν ἐν φυλακῇ. Không cần thay đổi thuật ngữ.
