id: LUK.3.37
reference: Luke 3:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: vi
  text: con của Mê-tu-sê-la, con của Hê-nóc, con của Gia-rết, con của Ma-ha-la-lê-ên, con của Cai-nam[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp Καϊνάμ, cũng có thể phiên âm là “Kai-nam”; khi hài hòa với các gia phả Cựu Ước, tên này đôi khi được viết là “Kê-nan”. Bản Hy Lạp của Lu-ca có tên này.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách được lặp lại trước mỗi tên và mang nghĩa tỉnh lược, tiếp nối quan hệ cha–con từ ngữ cảnh. Dịch là “con của” giúp câu tự nhiên và làm rõ quan hệ gia phả.
- source_word: Μαθουσαλά
  choice: Mê-tu-sê-la
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho nhân vật tương ứng trong Cựu Ước.
- source_word: Ἑνώχ
  choice: Hê-nóc
  rationale: Dùng dạng tên Kinh Thánh tiếng Việt quen thuộc, dễ nhận biết.
- source_word: Ἰάρετ
  choice: Gia-rết
  rationale: Dùng dạng tên Kinh Thánh tiếng Việt quen thuộc cho nhân vật tương ứng trong Sáng Thế Ký.
- source_word: Μαλελεήλ
  choice: Ma-ha-la-lê-ên
  rationale: Chọn dạng tên tiếng Việt dễ nhận ra và tương ứng với nhân vật trong gia phả Cựu Ước.
- source_word: Καϊνάμ
  choice: Cai-nam
  rationale: Phiên âm trực tiếp tên có trong bản Hy Lạp của Lu-ca, không lược bỏ hoặc âm thầm đồng nhất với một dạng tên trong gia phả Cựu Ước.
theological_decisions:
- issue: Lối tỉnh lược trong chuỗi sở hữu cách của gia phả Lu-ca
  choice: Lặp lại “con của” trước mỗi tên
  alternative: Giữ chuỗi sát chữ với “của” trước mỗi tên
  rationale: Ngữ cảnh gia phả cho thấy quan hệ cha–con được hiểu ngầm. Việc bổ sung “con” diễn đạt đúng chức năng của cấu trúc Hy Lạp và rõ ràng trong tiếng Việt mà không thêm một lập trường giáo lý.
- issue: Cách thể hiện Καϊνάμ trong gia phả Lu-ca
  choice: Giữ tên “Cai-nam” trong chính văn
  alternative: Đồng nhất hoặc hài hòa hóa thành “Kê-nan”
  rationale: Bản SBLGNT có tên Καϊνάμ, vì vậy bản dịch phải thể hiện tên này thay vì âm thầm hài hòa với gia phả Cựu Ước. Dạng tên thay thế được ghi ở chú thích để bảo toàn tính minh bạch.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Các tên riêng được viết theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc; riêng Καϊνάμ được giữ theo hình thức của bản văn Lu-ca. Dấu phẩy cuối câu cho thấy câu gia phả còn tiếp nối.
