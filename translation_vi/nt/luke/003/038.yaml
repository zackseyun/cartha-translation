base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: vi
  text: con của Ê-nót[a], con của Sết, con của A-đam, con của Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp chỉ lặp lại cấu trúc sở hữu cách: “của Ê-nót, của Sết, của A-đam, của Đức Chúa Trời”; cụm “con của” được thêm vào theo cú pháp đã được xác lập trong gia phả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: con của Ê-nốt
  rationale: Cấu trúc sở hữu cách lặp lại tiếp nối công thức gia phả của Lu-ca; danh từ chỉ quan hệ “con” được hiểu ngầm và cần được thêm vào trong tiếng Việt để câu rõ nghĩa. Ἐνώς được phiên âm là “Ê-nốt” theo cách dùng Kinh Thánh tiếng Việt quen thuộc.
- source_word: τοῦ Σὴθ
  choice: con của Sết
  rationale: Cùng một cấu trúc tỉnh lược trong chuỗi gia phả, hàm ý quan hệ cha-con. Σήθ được phiên âm là “Sết” theo cách gọi quen thuộc trong tiếng Việt.
- source_word: τοῦ Ἀδὰμ
  choice: con của A-đam
  rationale: Công thức gia phả tiếp tục hàm ý quan hệ cha-con. Ἀδάμ được giữ như tên riêng “A-đam”, không dịch thành “người”.
- source_word: τοῦ θεοῦ
  choice: con của Đức Chúa Trời
  rationale: Cụm sở hữu cách cuối cùng phù hợp với cùng khuôn mẫu gia phả, nên “con của” được bổ sung để giữ tính song song. θεός ở đây chỉ Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch cụm cuối τοῦ θεοῦ trong gia phả của A-đam
  choice: con của Đức Chúa Trời
  alternative: thuộc về Đức Chúa Trời; bởi Đức Chúa Trời mà có
  rationale: Nguyên văn chỉ dùng cụm sở hữu cách, nhưng trong chuỗi gia phả, quan hệ “con của” được hiểu ngầm xuyên suốt. Cách dịch này bảo toàn khuôn mẫu văn chương và sức nặng thần học của việc A-đam trực tiếp có nguồn gốc từ Đức Chúa Trời, mà không đồng nhất quan hệ này với những phạm trù thần học khác về tư cách Con.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng dùng dạng phiên âm quen thuộc trong Kinh Thánh tiếng Việt; cấu trúc lặp “con của” giữ nhịp gia phả và làm rõ quan hệ vốn được tỉnh lược trong nguyên văn Hy Lạp.
