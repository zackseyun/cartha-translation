id: LUK.3.1
reference: Luke 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: vi
  text: Vào năm thứ mười lăm dưới triều hoàng đế Tiberius[a], khi Pontius Pilate cai quản xứ Judea, Herod làm tiểu vương xứ Galilee, Philip, người anh em của ông, làm tiểu vương vùng Iturea và Trachonitis, còn Lysanias làm tiểu vương xứ Abilene[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong năm thứ mười lăm dưới triều hoàng đế Tiberius.”'
    reason: lexical_alternative
  - marker: b
    text: “Tiểu vương” là người cai trị một địa hạt dưới quyền La Mã.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει ... πεντεκαιδεκάτῳ
  choice: Vào năm thứ mười lăm
  rationale: Diễn đạt tự nhiên cấu trúc chỉ thời gian, đồng thời giữ nguyên khung niên đại của câu Hy Lạp.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chủ yếu chuyển tiếp sang bối cảnh mới; tiếng Việt không cần thêm “bấy giờ” hay “nay”, vì như vậy dễ làm từ nối nổi bật quá mức.
- source_word: ἡγεμονίας Τιβερίου Καίσαρος
  choice: dưới triều hoàng đế Tiberius
  rationale: “Dưới triều” diễn đạt tự nhiên quyền cai trị của Tiberius; Καῖσαρ được thể hiện bằng tước hiệu “hoàng đế” thay vì phiên âm “Caesar”, giúp độc giả hiện đại nhận rõ chức vị.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: khi Pontius Pilate cai quản xứ Judea
  rationale: Giữ sắc thái hành động của phân từ “cai quản”, không biến nó thành lời khẳng định chức danh “làm tổng đốc”.
- source_word: τετρααρχοῦντος
  choice: làm tiểu vương
  rationale: Giữ chức vị lịch sử cụ thể thay vì giản lược thành “cai trị”; chú thích giải thích chức vị này cho độc giả.
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: Philip, em trai ông
  rationale: Cách đặt đồng vị tự nhiên trong tiếng Việt; “ông” quy chiếu về Herod.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: vùng Iturea và Trachonitis
  rationale: Từ “vùng” thể hiện χώρας, tránh khiến các địa danh bị hiểu như những quốc gia độc lập.
- source_word: τῆς Ἀβιληνῆς
  choice: xứ Abilene
  rationale: “Xứ” cho thấy đây là một địa hạt cổ, tránh liên tưởng đến địa danh hiện đại cùng tên.
theological_decisions:
- issue: Cách dịch chức vị τετρααρχοῦντος
  choice: làm tiểu vương
  alternative: cai trị; làm người cai trị
  rationale: Đây chủ yếu là vấn đề lịch sử chứ không phải giáo lý. Giữ chức vị riêng bảo toàn độ chính xác của nguyên văn, còn chú thích cung cấp bối cảnh cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dạng tên quốc tế nhất quán. Các mệnh đề song song giữ nhịp liệt kê của nguyên văn; dấu phẩy cuối câu cho thấy câu Hy Lạp còn tiếp tục sang câu sau.
