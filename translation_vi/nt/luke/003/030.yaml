lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách được lặp lại trước mỗi tên và tiếp nối công thức gia phả ở các câu chung quanh; “con của” diễn đạt rõ quan hệ được hàm ý và tự nhiên trong tiếng Việt.
- source_word: Συμεὼν
  choice: Si-mê-ôn
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc, rõ ràng đối với độc giả tiếng Việt.
- source_word: Ἰούδα
  choice: Giu-đa
  rationale: Dạng Hy Lạp này có thể được phiên âm là Giu-đa hoặc dùng tên tương ứng theo truyền thống Hê-bơ-rơ là Đa-vít? Trong ngữ cảnh tên người Do Thái, “Giu-đa” là dạng tiếng Việt quen thuộc và không buộc phải phân biệt Judah/Judas như tiếng Anh.
- source_word: Ἰωσὴφ
  choice: Giô-sép
  rationale: Dạng phiên âm tiếng Việt thông dụng của tên riêng này.
- source_word: Ἰωνὰμ
  choice: Giô-nam
  rationale: Phiên âm sát dạng Ἰωνάμ của SBLGNT; dị bản hoặc truyền thống “Giô-nan” được ghi chú.
- source_word: Ἐλιακὶμ
  choice: Ê-li-a-kim
  rationale: Dạng phiên âm tiếng Việt dễ đọc và phản ánh rõ các âm tiết của tên Semit.
