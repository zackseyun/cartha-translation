  text: con của Si-mê-ôn, con của Giu-đa[a], con của Giô-sép, con của Giô-nam[b], con của Ê-li-a-kim,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Hy Lạp này có thể tương ứng với “Judah” hoặc “Judas” trong tiếng Anh. Tiếng Việt thường dùng “Giu-đa” cho tên này tùy theo ngữ cảnh.
    reason: lexical_alternative
  - marker: b
