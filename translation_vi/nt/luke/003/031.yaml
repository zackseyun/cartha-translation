  text: τοῦ Μελεὰ τοῦ Μεννὰ τοῦ Ματταθὰ τοῦ Ναθὰμ τοῦ Δαυὶδ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/031.yaml
  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: vi
  text: con của Mê-lê-a[a], con của Men-na, con của Mát-ta-tha, con của Na-than, con của Đa-vít,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “của Mê-lê-a, của Men-na, của Mát-ta-tha, của Na-than, của Đa-vít”; trong cấu trúc được lặp lại của gia phả Lu-ca, cụm này hàm ý “con của”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách được lặp lại trước mỗi tên riêng là cấu trúc tỉnh lược, tiếp nối công thức gia phả ở văn cảnh. Bổ sung “con của” giúp câu tiếng Việt tự nhiên và diễn đạt rõ quan hệ vốn được ngầm hiểu.
- source_word: Μελεὰ
  choice: Mê-lê-a
  rationale: Phiên âm trực tiếp tên riêng Hy Lạp Μελεά sang tiếng Việt, có dấu nối để dễ đọc.
- source_word: Μεννὰ
  choice: Men-na
  rationale: Phiên âm theo dạng Μεννά của bản SBLGNT; không theo dạng tên khác xuất hiện trong một số truyền thống bản văn.
- source_word: Ματταθὰ
  choice: Mát-ta-tha
  rationale: Phiên âm sát dạng Hy Lạp Ματταθά, đồng thời trình bày theo âm tiết để độc giả tiếng Việt dễ đọc.
- source_word: Ναθὰμ
  choice: Na-than
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt cho Ναθάμ, giữ khả năng nhận biết đây là Na-than, con Đa-vít.
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dùng dạng tên Kinh Thánh đã quen thuộc trong tiếng Việt cho Δαυίδ.
theological_decisions:
- issue: Cấu trúc tỉnh lược trong gia phả
  choice: Lặp lại “con của” trước mỗi tên.
  alternative: Dịch sát hình thức là “của Mê-lê-a, của Men-na, của Mát-ta-tha, của Na-than, của Đa-vít”.
  rationale: Chuỗi sở hữu cách Hy Lạp phụ thuộc vào công thức gia phả trong văn cảnh. Việc bổ sung “con của” không thêm quan hệ mới mà chỉ nói rõ ý nghĩa cú pháp vốn được ngầm hiểu, đồng thời tạo tiếng Việt tự nhiên.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm nhất quán, có dấu nối theo âm tiết. Không cần chú thích riêng về dạng “Menan” của một số bản tiếng Anh vì nguồn SBLGNT được chỉ định đọc rõ là Μεννά, và khác biệt ấy không phải là một biến thể cần thiết để giải thích trong bản dịch tiếng Việt.
