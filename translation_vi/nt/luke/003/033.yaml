base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: vi
  text: con của A-mi-na-đáp[a], con của A-đơ-min, con của A-rơ-ni, con của Hết-rôn, con của Phê-rết, con của Giu-đa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “con của A-mi-na-đáp, con của A-đơ-min, con của A-ram”; những thủ bản khác bỏ tên “A-đơ-min” và chép: “con của A-mi-na-đáp, con của A-ram.”'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả của Lu-ca, mạo từ sở hữu cách được lặp lại trước mỗi tên mang tính tỉnh lược, tiếp nối quan hệ gia phả đã nêu ở câu trước. “Con của” diễn đạt tự nhiên và rõ ràng trong tiếng Việt.
- source_word: Ἀμιναδάβ
  choice: A-mi-na-đáp
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc trong tiếng Việt và gần với dạng tên quen thuộc trong truyền thống Kinh Thánh.
- source_word: Ἀδμίν
  choice: Át-min
  rationale: Phiên âm trực tiếp tên riêng theo bản SBLGNT; giữ tên này trong chính văn vì đây là cách đọc của văn bản nguồn được chỉ định.
- source_word: Ἀρνί
  choice: A-ni
  rationale: Phiên âm tên riêng đúng theo cách đọc Ἀρνί của SBLGNT; cách đọc khác được ghi trong chú thích do có dị bản đáng kể.
- source_word: Ἑσρώμ
  choice: Hết-rôn
  rationale: Dùng dạng tên tương ứng quen thuộc trong Cựu Ước để người đọc dễ nhận ra nhân vật, thay vì phiên âm hoàn toàn theo hình thức Hy Lạp.
- source_word: Φαρές
  choice: Phê-rết
  rationale: Dùng dạng tên tương ứng quen thuộc trong Cựu Ước, vừa dễ nhận biết vừa phản ánh cùng một tên Semit.
- source_word: Ἰούδα
  choice: Giu-đa
  rationale: Trong bối cảnh tổ phụ và gia phả, “Giu-đa” là dạng tên tiếng Việt quen thuộc và phù hợp.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp lặp “con của” của gia phả; các tên được viết có gạch nối theo lối phiên âm tiếng Việt. Dấu phẩy cuối câu được giữ vì câu gia phả tiếp tục sang câu kế.
