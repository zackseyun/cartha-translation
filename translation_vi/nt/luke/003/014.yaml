  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: vi
  text: 'Binh lính cũng hỏi ông: “Còn chúng tôi thì phải làm gì?” Ông đáp: “Đừng cưỡng đoạt tiền của ai, cũng đừng vu cáo ai; hãy bằng lòng với lương của mình.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατευόμενοι
  choice: những người đang phục vụ trong quân đội
  rationale: Phân từ hiện tại chỉ những người đang thi hành quân dịch hoặc phục vụ như binh lính; cách dịch này giữ được sắc thái đang phục vụ mà vẫn tự nhiên trong tiếng Việt.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Còn chúng tôi thì phải làm gì?
  rationale: Câu hỏi cân nhắc với động từ giả định được diễn đạt tự nhiên bằng “phải làm gì”; “còn… thì” bảo lưu sự nhấn mạnh của καὶ ἡμεῖς rằng nhóm này cũng hỏi như các nhóm trước.
- source_word: διασείσητε
  choice: cưỡng đoạt tiền
  rationale: Trong bối cảnh người có vũ lực hoặc quyền thế, động từ nói đến việc đe dọa hay dùng sức ép để chiếm đoạt; thêm “tiền” làm rõ mục đích vụ lợi theo ngữ cảnh.
- source_word: συκοφαντήσητε
  choice: vu cáo
  rationale: Từ này chỉ việc tố cáo sai trái, có thể nhằm gây hại hoặc trục lợi; “vu cáo” ngắn gọn, rõ và phù hợp bối cảnh pháp lý-xã hội.
- source_word: ἀρκεῖσθε
  choice: hãy bằng lòng
  rationale: Mệnh lệnh hiện tại diễn tả thái độ mãn nguyện liên tục; “hãy bằng lòng” truyền đạt đúng sức nặng đạo đức và tự nhiên trong tiếng Việt.
- source_word: ὀψωνίοις
  choice: quân lương
  rationale: Danh từ có thể chỉ tiền công hoặc khẩu phần cấp cho quân nhân. “Quân lương” giữ bối cảnh quân sự và phần nào bảo lưu độ rộng nghĩa, dù trong tiếng Việt hiện đại đôi khi có thể được hiểu là lương thực quân đội.
theological_decisions:
- issue: Lời dạy đạo đức dành cho người phục vụ trong quân đội
  choice: Giữ nguyên lời chỉ dẫn về việc không lạm dụng quyền lực và không tham lợi trong khi đang phục vụ.
  alternative: Diễn giải câu này thành lời lên án bản thân việc phục vụ quân đội hoặc thành sự tán thành toàn diện đối với quân nghiệp.
  rationale: Bản văn trực tiếp cấm cưỡng đoạt, vu cáo và bất mãn với khoản được cấp, nhưng không nói rõ một lập trường tổng quát về tính chính đáng của quân nghiệp; bản dịch không nên thêm kết luận giáo phái vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho Gioan theo mạch tường thuật; “Còn chúng tôi thì” tự nhiên hóa sự nhấn mạnh rõ ràng của καὶ ἡμεῖς. Không dùng chú thích vì các sắc thái chính đã được chuyển tải trong thân câu.
