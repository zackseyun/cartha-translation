revisions:
- from: 'Cũng có những người đang phục vụ trong quân đội hỏi ông: “Còn chúng tôi thì phải làm gì?” Ông đáp: “Đừng cưỡng đoạt tiền của ai, cũng đừng vu cáo ai; hãy bằng lòng với quân lương của mình.”'
  to: 'Binh lính cũng hỏi ông: “Còn chúng tôi thì phải làm gì?” Ông đáp: “Đừng cưỡng đoạt tiền của ai, cũng đừng vu cáo ai; hãy bằng lòng với lương của mình.”'
  rationale: 'Sửa hai cách gọi để bản dịch chính xác và tự nhiên hơn trong tiếng Việt hiện đại: dùng “binh lính” cho nhóm người được nói đến, và “lương của mình” cho khoản ὀψώνια. Những phần còn lại giữ nguyên vì đã phản ánh tốt nội dung, giọng điệu, và phạm vi của nguyên văn, không thêm kết luận về nghề quân nhân.'
