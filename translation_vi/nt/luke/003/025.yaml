  text: τοῦ Ματταθίου τοῦ Ἀμὼς τοῦ Ναοὺμ τοῦ Ἑσλὶ τοῦ Ναγγαὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/025.yaml
  text: the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai,
translation:
  language: vi
  text: con của Ma-tha-thia, con của A-mốt, con của Na-hum, con của Ét-li, con của Na-gai,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách được lặp lại trước mỗi tên và mang ý nghĩa tỉnh lược theo công thức gia phả ở văn cảnh; “con của” diễn đạt rõ quan hệ huyết thống bằng tiếng Việt tự nhiên.
- source_word: Ματταθίου
  choice: Ma-tha-thia
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc đối với độc giả Việt, đồng thời phân biệt hợp lý với các tên gần giống khác trong gia phả.
- source_word: Ἀμὼς
  choice: A-mốt
  rationale: Phiên âm tên riêng theo dạng quen thuộc trong tiếng Việt Kinh Thánh; ở đây chỉ một tổ tiên trong gia phả, không nhất thiết là vị tiên tri cùng tên.
- source_word: Ναοὺμ
  choice: Na-hum
  rationale: Phiên âm trực tiếp tên riêng, giữ âm h giữa tên thể hiện trong dạng Hy Lạp và phù hợp lối đọc tiếng Việt.
- source_word: Ἑσλὶ
  choice: Ét-li
  rationale: Phiên âm tên riêng Ἑσλί thành dạng rõ âm tiết và tự nhiên trong tiếng Việt; phụ âm đầu được thể hiện bằng Ét- thay vì nhập tên này với một tên quen thuộc khác.
- source_word: Ναγγαὶ
  choice: Na-gai
  rationale: Phiên âm tên riêng theo âm hình Hy Lạp, dùng dạng ngắn gọn, dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Lặp “con của” để duy trì cấu trúc gia phả minh bạch; dùng dấu gạch nối trong các tên phiên âm theo thông lệ tiếng Việt.
