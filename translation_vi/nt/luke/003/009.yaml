revisions:
- from: Ngay cả chiếc rìu cũng đã được đặt sát gốc cây. Vì vậy, cây nào không sinh trái tốt đều bị đốn xuống và ném vào lửa.
  to: Và rìu cũng đã được đặt sẵn nơi gốc các cây. Vì vậy, cây nào không sinh trái tốt đều bị đốn xuống và bị ném vào lửa.
  rationale: Chỉnh nhẹ cụm mở đầu để giữ chức năng tiếp nối–gia tăng của δὲ καὶ mà không tạo nhấn mạnh đối chiếu quá mức, và phục hồi số nhiều của “các cây.” Các hình ảnh phán xét vẫn được giữ nguyên, không diễn giải “lửa” theo một lập trường thần học cụ thể.
