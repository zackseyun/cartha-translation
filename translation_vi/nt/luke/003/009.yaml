source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: vi
  text: Và rìu cũng đã được đặt sẵn nơi gốc các cây. Vì vậy, cây nào không sinh trái tốt đều bị đốn xuống và bị ném vào lửa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: Ngay cả ... cũng đã
  rationale: Diễn đạt cả tính tiếp nối, sắc thái gia tăng của καὶ và sự cấp bách của ἤδη bằng tiếng Việt tự nhiên.
- source_word: ἡ ἀξίνη
  choice: chiếc rìu
  rationale: Chỉ dụng cụ chặt cây trong hình ảnh phán xét; “chiếc rìu” rõ nghĩa và thông dụng.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: được đặt sát gốc cây
  rationale: Giữ hình ảnh chiếc rìu đã nằm sẵn ở vị trí chặt, nhấn mạnh hành động sắp xảy ra; tiếng Việt dùng danh từ tập hợp số ít tự nhiên hơn trong cụm này.
- source_word: πᾶν οὖν δένδρον
  choice: Vì vậy, cây nào ... đều
  rationale: οὖν nêu hệ quả; cấu trúc “cây nào... đều” chuyển tải tự nhiên ý nghĩa bao quát của πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: không sinh trái tốt
  rationale: “Sinh trái” là cách nói tự nhiên trong tiếng Việt đối với cây, đồng thời giữ được nghĩa ẩn dụ về kết quả đạo đức thuộc linh.
- source_word: ἐκκόπτεται
  choice: bị đốn xuống
  rationale: Phù hợp cụ thể với việc chặt hạ cây và giữ thể bị động của nguyên văn.
- source_word: εἰς πῦρ βάλλεται
  choice: ném vào lửa
  rationale: Diễn đạt trực tiếp, hiện đại và giữ nguyên mức độ nghiêm khắc của hình ảnh.
theological_decisions:
- issue: Hình ảnh ẩn dụ về sự phán xét
  choice: Giữ nguyên hình ảnh chiếc rìu sát gốc, cây bị đốn và ném vào lửa như lời cảnh báo về sự phán xét đã gần kề.
  alternative: Giải thích cụ thể “lửa” là hỏa ngục, hoặc chỉ là sự phán xét lịch sử trên Israel.
  rationale: Câu văn khẳng định sự phán xét nghiêm khắc và cấp bách nhưng không tự xác định đầy đủ đối tượng hay tính chất của “lửa”; bản dịch không nên thu hẹp ẩn dụ theo một hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đốn xuống” thay cho cách nói cổ hoặc kém chính xác; giữ nhịp cảnh báo mạnh và trực tiếp của nguyên văn.
