  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: vi
  text: con của Kê-nan[a][b], con của Ác-phác-xát[c], con của Sem, con của Nô-ê, con của La-méc,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên này cũng có thể được phiên âm là “Kai-nam”.
    reason: lexical_alternative
  - marker: b
    text: Một số truyền thống lược bỏ tên Kê-nan ở đây nhằm làm cho gia phả phù hợp hơn với một số dạng gia phả trong Cựu Ước.
    reason: textual_variant
  - marker: c
    text: “Ác-phác-xát” phản ánh dạng tên Hy Lạp trong Lu-ca; đối chiếu dạng tên Hê-bơ-rơ trong Cựu Ước, thường được phiên âm là “Ác-pác-sát”.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong chuỗi gia phả, mạo từ sở hữu cách được dùng tỉnh lược theo khuôn mẫu đã xác lập ở các câu lân cận; “con của” diễn đạt rõ quan hệ dòng dõi bằng tiếng Việt tự nhiên.
- source_word: Καϊνὰμ
  choice: Kê-nan
  rationale: Phiên âm tên riêng Hy Lạp Καϊνάμ theo lối đọc tự nhiên trong tiếng Việt; dạng này cũng giúp phân biệt với tên Ca-in.
- source_word: Ἀρφαξὰδ
  choice: Ạc-phác-sát
  rationale: Phiên âm dạng tên Hy Lạp trong Lu-ca, đồng thời giữ hình thức quen thuộc của tên này trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Σὴμ
  choice: Sem
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt hiện đại.
- source_word: Νῶε
  choice: Nô-ê
  rationale: Dùng dạng tên Kinh Thánh quen thuộc trong tiếng Việt thay vì phiên âm máy móc hình thức Hy Lạp.
- source_word: Λάμεχ
  choice: La-méc
  rationale: Phiên âm tên riêng theo lối dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
theological_decisions:
- issue: Việc có tên Kê-nan giữa Ạc-phác-sát và Sem trong gia phả Lu-ca
  choice: Giữ Kê-nan trong chính văn theo SBLGNT.
  alternative: Một số truyền thống lược bỏ Kê-nan để gia phả gần hơn với một số dạng văn bản Cựu Ước.
  rationale: Bản Hy Lạp được chỉ định có Καϊνάμ; không nên âm thầm điều hòa Lu-ca với gia phả trong Sáng Thế Ký.
translation_notes:
  register: Văn phong ngắn gọn, trang trọng và tự nhiên, phù hợp cấu trúc liệt kê của gia phả. Dấu phẩy cuối câu được giữ vì đây là một phần của chuỗi gia phả tiếp nối sang câu kế cận.
