source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: vi
  text: Khi dân chúng đang trông đợi, ai nấy đều tự hỏi trong lòng về Giăng, phải chăng chính ông là Đấng Mê-si[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Đấng Christ”. Tiếng Hy Lạp: ho christos.'
    reason: Nêu cách dịch tước hiệu thay thế và dạng Hy Lạp đứng sau bản dịch.
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: đang mong đợi
  rationale: Phân từ sở hữu cách tuyệt đối dựng bối cảnh và diễn tả sự trông mong đang tiếp diễn; “đang mong đợi” tự nhiên trong tiếng Việt và giữ sắc thái kỳ vọng.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Đây là liên từ nhẹ để tiếp nối diễn biến. Cấu trúc “Khi...” đã chuyển cảnh tự nhiên, nên thêm “bấy giờ” hoặc “nhưng” sẽ dễ làm quá rõ sắc thái thời gian hay tương phản.
- source_word: τοῦ λαοῦ
  choice: dân chúng
  rationale: Diễn tả tập thể dân đang hiện diện, tự nhiên hơn “dân sự” trong tiếng Việt hiện đại mà không thu hẹp thành một đám đông đơn thuần.
- source_word: διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν
  choice: mọi người đều tự hỏi trong lòng
  rationale: διαλογίζομαι chỉ sự suy xét nội tâm; cùng với “trong lòng”, “tự hỏi” chuyển đạt tự nhiên tiến trình cân nhắc trước khả năng được nêu sau đó.
- source_word: περὶ τοῦ Ἰωάννου
  choice: về Giăng
  rationale: περί với sở hữu cách có nghĩa là “về/liên quan đến”; tên truyền thống “Giăng” rõ ràng với độc giả Kinh Thánh tiếng Việt.
- source_word: μήποτε αὐτὸς εἴη
  choice: rằng biết đâu chính ông là
  rationale: “biết đâu” giữ tính phỏng đoán của μήποτε và thức mong mỏi εἴη; “chính ông” thể hiện đại từ nhấn mạnh αὐτός mà không biến suy đoán thành khẳng định.
- source_word: ὁ χριστός
  choice: Đấng Mê-si
  rationale: Ở đây Χριστός là tước hiệu chỉ nhân vật được dân chúng mong đợi; “Đấng Mê-si” bảo toàn bối cảnh Do Thái và chức năng tước hiệu.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này dân chúng đang suy đoán về căn tính của Giăng, nên từ này rõ ràng là tước hiệu Mê-si chứ không phải cách gọi gần như tên riêng của Chúa Giê-su. Chú thích giữ cách dịch truyền thống thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc dựng bối cảnh của sở hữu cách tuyệt đối nhưng điều chỉnh thành mệnh đề “Khi...”; không thêm từ chuyển ý mạnh. Dấu phẩy cuối được giữ vì câu 15 tiếp tục sang lời công bố của Giăng ở phần sau.
