source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: vi
  text: 'Ông trả lời họ: “Ai có hai áo[a], hãy chia cho người không có; còn ai có thức ăn, cũng hãy làm như vậy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Áo” dịch từ một từ Hy Lạp chỉ áo tunic, một loại áo cơ bản thường mặc sát người trong thời cổ; cũng có thể dịch là “áo dài” theo nghĩa áo choàng dài thời cổ, nhưng không phải áo khoác ngoài.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Ông đáp lời họ
  rationale: Cụm phân từ kết hợp với động từ ở thì chưa hoàn thành giới thiệu lời đáp của Giăng. Tiếng Việt tự nhiên gộp lại thành “đáp lời”; không cần diễn đạt sắc thái tiếp diễn vốn không rõ là trọng tâm trong ngữ cảnh.
- source_word: Ὁ ἔχων
  choice: Ai có
  rationale: Diễn đạt tự nhiên ý nghĩa khái quát của phân từ được danh từ hóa số ít, không giới hạn theo giới tính.
- source_word: δύο χιτῶνας
  choice: hai áo trong
  rationale: χιτών chỉ loại áo cơ bản mặc sát người, không phải áo khoác. “Áo trong” dễ hiểu hơn “áo dài kiểu cổ/tunic” và giữ được nét văn hóa nhờ chú thích.
- source_word: μεταδότω
  choice: hãy chia
  rationale: Mệnh lệnh ngôi thứ ba kêu gọi người có dư chia phần mình cho người thiếu; “hãy chia” giữ rõ lực mệnh lệnh và tự nhiên trong tiếng Việt.
- source_word: τῷ μὴ ἔχοντι
  choice: cho người không có
  rationale: Tân ngữ bị lược trong tiếng Hy Lạp được hiểu từ “áo trong” ở vế trước; tiếng Việt cũng có thể giữ cách nói ngắn gọn này.
- source_word: βρώματα
  choice: thức ăn
  rationale: Từ số nhiều chỉ những thứ dùng làm thực phẩm; “thức ăn” là cách gọi phổ thông, bao quát và tự nhiên.
- source_word: ὁμοίως ποιείτω
  choice: cũng hãy làm như vậy
  rationale: Giữ cấu trúc song song và lực mệnh lệnh, áp dụng cùng nguyên tắc chia sẻ cho thức ăn.
theological_decisions:
- issue: Chủ thể số ít mang nghĩa khái quát
  choice: Ai có ... ai có ...
  alternative: Người nào có ... người nào có ...
  rationale: “Ai có” truyền đạt đúng tính khái quát của các phân từ giống đực số ít mà không khiến câu bị hiểu là chỉ nói với nam giới.
- issue: Sức nặng của hai mệnh lệnh
  choice: hãy chia ... cũng hãy làm như vậy
  alternative: phải chia ... cũng phải làm như vậy
  rationale: “Hãy” giữ đúng tính chất khuyên truyền mang lực mệnh lệnh của hình thái mệnh lệnh ngôi thứ ba, đồng thời tránh bổ sung sắc thái pháp quy cứng nhắc không nhất thiết có trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để chỉ Giăng theo mạch văn, “ai” cho lời dạy có tính phổ quát, và giữ phép song song giữa việc chia áo với việc chia thức ăn.
