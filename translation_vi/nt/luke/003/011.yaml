revisions:
- from: 'Ông đáp lời họ: “Ai có hai áo trong[a], hãy chia cho người không có; còn ai có thức ăn, cũng hãy làm như vậy.”'
  to: 'Ông trả lời họ: “Ai có hai áo[a], hãy chia cho người không có; còn ai có thức ăn, cũng hãy làm như vậy.”'
  rationale: Bản sửa thay cách gọi dễ gây hiểu nhầm “áo trong” bằng “áo”, rồi chuyển thông tin văn hóa cần thiết vào chú thích. Cách này phản ánh χιτών chính xác hơn trong tiếng Việt hiện đại, không áp đặt một loại trang phục hiện đại, và vẫn giữ nguyên nghĩa, lực mệnh lệnh, tính khái quát và phép song song của nguyên văn.
  reviewer_model: gpt-5.6-terra
