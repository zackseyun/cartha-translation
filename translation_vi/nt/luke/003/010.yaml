  text: Καὶ ἐπηρώτων αὐτὸν οἱ ὄχλοι λέγοντες· Τί οὖν ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: vi
  text: 'Đám đông cứ hỏi ông: “Vậy chúng tôi phải làm gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: cứ hỏi
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; “cứ hỏi” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: οἱ ὄχλοι
  choice: đám đông
  rationale: Danh từ số nhiều chỉ những nhóm người tụ tập. Tiếng Việt thường dùng danh từ tập hợp “đám đông” một cách tự nhiên mà không cần đánh dấu số nhiều hình thức.
- source_word: λέγοντες
  choice: lược dịch
  rationale: Phân từ này dẫn vào nội dung câu hỏi. Trong tiếng Việt, dấu hai chấm trực tiếp đảm nhiệm chức năng ấy; dịch thêm “nói rằng” sẽ nặng câu.
- source_word: Τί οὖν
  choice: Vậy ... gì
  rationale: “Vậy” giữ quan hệ suy luận từ lời khuyên trước đó của Giăng, đồng thời phù hợp trật tự tự nhiên của câu hỏi tiếng Việt.
- source_word: ποιήσωμεν
  choice: chúng tôi phải làm
  rationale: Thể giả định aorist trong câu hỏi cân nhắc được diễn đạt tự nhiên bằng “phải làm gì?”, thể hiện việc đám đông hỏi về hành động thực tế cần thực hiện mà không áp đặt thêm sắc thái.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sắc thái tiếp diễn của động từ chính, đồng thời chuyển cấu trúc phân từ Hy Lạp thành lời dẫn trực tiếp tự nhiên trong tiếng Việt.
