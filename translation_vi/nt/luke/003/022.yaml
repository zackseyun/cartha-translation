id: LUK.3.22
reference: Luke 3:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: vi
  text: 'và Đức Thánh Linh ngự xuống trên Người dưới hình thể như chim bồ câu, rồi có tiếng từ trời phán: “Con là Con yêu dấu của Ta; Ta hài lòng về Con[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ta đã hài lòng về Con.”'
    reason: Bảo lưu khả năng phản ánh εὐδόκησα, động từ aorist, bằng thì quá khứ; chính văn dùng hiện tại tự nhiên trong lời tuyên phán tiếng Việt.
lexical_decisions:
- source_word: καταβῆναι
  choice: ngự xuống
  rationale: Diễn đạt chuyển động đi xuống trong mạch tường thuật; “ngự” phù hợp với chủ thể là Đức Thánh Linh mà vẫn giữ ý nghĩa căn bản của động từ.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi chuẩn, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: σωματικῷ εἴδει
  choice: trong hình thể
  rationale: Giữ ý về một sự biểu hiện có hình thể, không giản lược thành một kinh nghiệm chỉ ở bên trong; đồng thời tránh lối diễn đạt nặng nề như “trong hình dạng thể chất”.
- source_word: ὡς περιστερὰν
  choice: như chim bồ câu
  rationale: Giữ rõ phép so sánh của ὡς, không khẳng định rằng Đức Thánh Linh đã biến thành một con chim bồ câu theo nghĩa đen.
- source_word: ἐπ’ αὐτόν
  choice: trên Người
  rationale: Diễn đạt trực tiếp hướng và vị trí của sự ngự xuống trên Chúa Giê-su; “Người” là đại từ trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: có tiếng từ trời phán
  rationale: γενέσθαι với φωνή là lối nói về việc một tiếng vang lên; thêm “phán” phù hợp với lời trực tiếp có thẩm quyền từ trời và tự nhiên trong tiếng Việt.
- source_word: Σὺ εἶ
  choice: Con là
  rationale: Giữ lời xưng hô trực tiếp và sắc thái nhấn mạnh đủ tự nhiên trong tiếng Việt.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: Con yêu dấu của Ta
  rationale: Cách diễn đạt tự nhiên, trang trọng, giữ cả quan hệ làm Con và ý nghĩa được yêu quý của ἀγαπητός.
- source_word: ἐν σοὶ
  choice: nơi Con
  rationale: Giữ sát giới từ ἐν hơn cách dịch “về Con”, đồng thời vẫn có thể hiểu tự nhiên trong lời tuyên phán trang trọng.
- source_word: εὐδόκησα
  choice: Ta hài lòng
  rationale: Diễn đạt tự nhiên trạng thái đẹp lòng trong tiếng Việt; sắc thái quá khứ của thì aorist được bảo lưu trong chú thích.
theological_decisions:
- issue: Bản chất sự hiện ra của Đức Thánh Linh
  choice: Đức Thánh Linh ngự xuống trong hình thể được ví như chim bồ câu.
  alternative: Đức Thánh Linh ngự xuống như một con chim bồ câu thật.
  rationale: Cụm σωματικῷ εἴδει ὡς περιστερὰν vừa nói đến sự biểu hiện có hình thể vừa dùng phép so sánh; bản dịch không áp đặt kết luận rằng Đức Thánh Linh biến thành chim bồ câu theo nghĩa bản thể.
- issue: Thời thể của lời εὐδόκησα
  choice: Dùng hiện tại tự nhiên “Ta hài lòng” trong chính văn.
  alternative: “Ta đã hài lòng” hoặc “Ta đã vui lòng.”
  rationale: Động từ Hy Lạp ở thì aorist có thể được phản ánh bằng quá khứ, nhưng lời tuyên bố bằng hiện tại tự nhiên hơn trong tiếng Việt và truyền đạt sự chấp thuận đang có hiệu lực; chú thích bảo lưu sắc thái quá khứ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “Người” dành cho Chúa Giê-su và cách xưng hô “Ta/Con” trong tiếng từ trời tạo sắc thái tôn nghiêm mà không dùng từ cổ khó hiểu. Dấu chú thích [a] được đặt ngay sau mệnh đề mà nó giải thích.
