id: LUK.3.2
reference: Luke 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: vi
  text: dưới thời thượng tế An-ne và Cai-pha[a], lời Đức Chúa Trời đến với Giăng, con trai Xa-cha-ri, trong hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, sát nghĩa hơn: “trong thời thượng tế An-ne và Cai-pha.” Lu-ca nêu tên cả hai người dù từ chỉ chức vụ trong nguyên văn ở số ít.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: trong thời kỳ thượng tế của An-ne và Cai-pha
  rationale: ἐπί với sở hữu cách mang nghĩa thời gian là “trong thời kỳ”. Cách dịch này giữ danh từ ἀρχιερέως ở số ít, đồng thời vẫn nêu tên cả An-ne lẫn Cai-pha như nguyên văn.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: lời Đức Chúa Trời đến
  rationale: Đây là công thức ngôn sứ quen thuộc, diễn tả việc Đức Chúa Trời truyền lời cho một người; “đến” chuyển tải tự nhiên sắc thái sự kiện của ἐγένετο.
- source_word: ἐπὶ Ἰωάννην
  choice: đến với Giăng
  rationale: ἐπί với đối cách ở đây chỉ lời được hướng đến và đến trên Giăng. “Đến với” tự nhiên trong tiếng Việt mà không làm mất ý ông là người tiếp nhận.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: con trai Xa-cha-ri
  rationale: Cụm đồng vị xác định Giăng là ai. “Con trai Xa-cha-ri” rõ ràng, tự nhiên và sát cấu trúc nguồn.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: ἔρημος chỉ vùng hoang vu, thưa người, không nhất thiết là sa mạc đầy cát; “hoang mạc” phù hợp với bối cảnh chức vụ của Giăng.
theological_decisions:
- issue: Cách thể hiện việc Lu-ca dùng ἀρχιερέως ở số ít nhưng nêu tên An-ne và Cai-pha
  choice: 'Giữ ý niệm chức vụ ở số ít: “trong thời kỳ thượng tế của An-ne và Cai-pha”'
  alternative: “khi An-ne và Cai-pha làm thượng tế”
  rationale: Bản Hy Lạp dùng ἀρχιερέως ở số ít trong khi nêu hai người. Bản dịch giữ nguyên sự căng thẳng lịch sử và văn chương này, không tự ý giải thích hoặc dung hòa.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt: An-ne, Cai-pha, Giăng và Xa-cha-ri. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.'
