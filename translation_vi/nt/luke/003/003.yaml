  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: vi
  text: Ông đi khắp vùng quanh sông Giô-đanh, công bố phép báp-têm về sự ăn năn để được tha tội lỗi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: đi khắp vùng quanh sông Giô-đanh
  rationale: Trong ngữ cảnh kể chuyện tiếng Việt, “đi khắp” diễn đạt tự nhiên cả chuyển động của ἦλθεν εἰς lẫn phạm vi toàn vùng của πᾶσαν περίχωρον, mà không cần giữ cứng hướng nhìn “đến” vốn tùy thuộc điểm quy chiếu.
- source_word: κηρύσσων
  choice: công bố
  rationale: Diễn đạt hành động loan báo công khai của một người truyền tin, đồng thời tránh giới hạn từ này vào nghĩa giảng trong sinh hoạt nhà thờ.
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Đây là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt hiện đại đối với nghi thức được danh từ βάπτισμα chỉ đến.
- source_word: μετανοίας
  choice: của sự ăn năn
  rationale: Giữ sát cấu trúc sở hữu của dạng sở hữu cách, liên kết phép báp-têm với sự ăn năn mà không giải thích quá mức quan hệ giữa hai điều.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: để được tha tội
  rationale: Cách diễn đạt tự nhiên cho mục tiêu hoặc kết quả hướng đến của εἰς; ἄφεσις trong ngữ cảnh này mang nghĩa sự tha thứ, còn ἁμαρτιῶν là tội lỗi.
theological_decisions:
- issue: Quan hệ giữa phép báp-têm, sự ăn năn và sự tha tội
  choice: phép báp-têm của sự ăn năn để được tha tội
  alternative: phép báp-têm biểu thị sự ăn năn dẫn đến sự tha tội; phép báp-têm qua đó sự ăn năn được bày tỏ để được tha tội
  rationale: Bản dịch giữ chuỗi quan hệ của βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν mà không xác định phép báp-têm có vai trò phương tiện, dấu hiệu hay lời tuyên bố đối với sự tha tội.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” theo mạch kể để chỉ Giăng; “Giô-đanh” là dạng tên riêng quen thuộc. “Ăn năn” được giữ vì là thuật ngữ Kinh Thánh thông dụng nhưng vẫn dễ hiểu; “công bố” nhấn mạnh lời loan báo công khai.
