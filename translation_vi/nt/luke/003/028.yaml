  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ Μελχὶ τοῦ Ἀδδὶ τοῦ Κωσὰμ τοῦ Ἐλμαδὰμ τοῦ Ἢρ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/028.yaml
  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: vi
  text: con của Mên-chi[a], con của A-đi, con của Cô-sam, con của Ên-ma-đam, con của Ê-rơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp chỉ lặp từ “của” trước mỗi tên; bản dịch thêm “con” để nêu rõ mối quan hệ trong gia phả theo văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách được lặp lại trước mỗi tên và mang tính tỉnh lược; quan hệ cha–con được xác định từ công thức ở văn cảnh trước. “Con của” diễn đạt rõ ý hàm ẩn và tự nhiên trong tiếng Việt.
- source_word: Μελχὶ
  choice: Mên-chi
  rationale: Phiên âm tên riêng Hy Lạp theo lối viết dễ đọc và quen thuộc trong tiếng Việt.
- source_word: Ἀδδὶ
  choice: Át-đi
  rationale: Phiên âm tên riêng, dùng “t” để thể hiện phụ âm kép δδ theo cách đọc thích hợp với tiếng Việt.
- source_word: Κωσὰμ
  choice: Cô-xam
  rationale: Phiên âm trực tiếp tên riêng Hy Lạp; “x” thể hiện âm /s/ của sigma, còn “C” giữ âm đầu /k/.
- source_word: Ἐλμαδὰμ
  choice: Ên-ma-đam
  rationale: Phiên âm tên riêng sang dạng tự nhiên, dễ đọc trong tiếng Việt.
- source_word: Ἢρ
  choice: Ê
  rationale: Phiên âm tên riêng Hy Lạp Ἢρ; bỏ phụ âm r cuối vì dạng tiếng Việt thông dụng và phù hợp cách phát âm.
theological_decisions:
- issue: Quan hệ được hàm ẩn bởi chuỗi sở hữu cách
  choice: Lặp lại “con của” trước mỗi tên
  alternative: Chỉ dùng “của” hoặc liệt kê các tên
  rationale: Bản Hy Lạp chỉ lặp τοῦ, nhưng văn cảnh gia phả cho thấy quan hệ cha–con. Bổ sung “con” làm sáng nghĩa mà không áp đặt một cách giải thích thần học ngoài văn cảnh.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Cấu trúc lặp “con của” giữ nhịp gia phả, đồng thời các tên riêng được phiên âm theo lối đọc tiếng Việt.
