id: LUK.3.32
reference: Luke 3:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ Ἰεσσαὶ τοῦ Ἰωβὴλ τοῦ Βόος τοῦ ⸀Σαλὰ τοῦ Ναασσὼν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/032.yaml
  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: vi
  text: con của Giê-sê, con của Giô-bên[a], con của Bô-ô, con của Sa-la[b], con của Na-ha-sôn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hy Lạp được cung cấp ghi Giô-bên; tên Ô-bết thường xuất hiện tại vị trí này trong các gia phả tương ứng.
    reason: Báo cho độc giả biết dạng tên bất thường mà không sửa ngầm bản văn nguồn.
  - marker: b
    text: Một số thủ bản ghi Sanh-môn.
    reason: Dấu hiệu phê bình văn bản trước Σαλὰ cho thấy có biến thể đáng kể, liên quan trực tiếp đến tên trong gia phả.
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả này, chuỗi sở hữu cách Hy Lạp diễn tả quan hệ dòng dõi; lặp lại “con của” giúp câu tiếng Việt rõ ràng và giữ cấu trúc nguồn.
- source_word: Ἰεσσαὶ
  choice: Giê-sê
  rationale: Dùng dạng tên quen thuộc trong tiếng Việt, tương ứng với Iessai/Jesse.
- source_word: Ἰωβὴλ
  choice: Giô-bên
  rationale: Chuyển tự theo đúng dạng Hy Lạp được cung cấp (Iōbēl), không tự ý đổi thành Ô-bết dù tên này thường xuất hiện tại vị trí tương ứng trong gia phả Cựu Ước.
- source_word: Βόος
  choice: Bô-ô
  rationale: Chuyển tự dạng Hy Lạp Boos bằng hình thức tên dễ đọc trong tiếng Việt.
- source_word: Σαλὰ
  choice: Sa-la
  rationale: Chuyển tự dạng Hy Lạp Sala, giữ nguyên cách gọi của bản văn chính thay vì đồng nhất ngầm với Sanh-môn.
- source_word: Ναασσὼν
  choice: Na-ha-sôn
  rationale: Chuyển tự Naassōn theo âm tiết tự nhiên trong tiếng Việt và tương ứng với tên Nahshon.
theological_decisions:
- issue: Quan hệ gia phả được hàm ý bởi chuỗi sở hữu cách
  choice: Diễn đạt mỗi mắt xích là “con của”
  alternative: Chỉ liệt kê tên hoặc dùng “thuộc dòng”
  rationale: Ngữ cảnh gia phả của Lu-ca xác định quan hệ nối tiếp, còn “con của” giữ lối trình bày trực tiếp mà không thêm diễn giải thần học.
- issue: Nhận diện Giô-bên với Ô-bết
  choice: Giữ dạng tên theo chứng cứ nguồn được cung cấp và ghi chú
  alternative: Chuẩn hóa thành Ô-bết theo Ru-tơ 4 và các gia phả tương ứng
  rationale: Không nên âm thầm sửa một dạng tên khác biệt trong nguồn, dù vị trí gia phả gợi mạnh đến Ô-bết.
- issue: Nhận diện Sa-la với Sanh-môn
  choice: Giữ “Sa-la” trong chính văn
  alternative: Dịch là “Sanh-môn” theo biến thể thủ bản và gia phả Cựu Ước
  rationale: Bản chính SBLGNT được cung cấp đọc Σαλὰ; bản dịch giữ sự căng thẳng văn bản thay vì tự chọn biến thể khác.
translation_notes:
  register: Văn phong trang trọng, sáng rõ, dùng mẫu lặp “con của” quen thuộc trong gia phả. Tên riêng được Việt hóa vừa đủ để dễ đọc, đồng thời các dạng khác biệt của nguồn Hy Lạp được bảo toàn và giải thích bằng chú thích.
