  text: τοῦ Μαθθὰτ τοῦ Λευὶ τοῦ Μελχὶ τοῦ Ἰανναὶ τοῦ Ἰωσὴφ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/024.yaml
  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: vi
  text: con của Mát-thát[a], con của Lê-vi, con của Mên-chi, con của Gian-nai, con của Giô-sép,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói sát hình thức hơn: “của Mát-thát, của Lê-vi, của Mên-chi, của Gian-nai, của Giô-sép.” Tiếng Hy Lạp tiếp tục gia phả bằng cách lặp lại dạng sở hữu cách; cụm “con của” được ngầm hiểu từ ngữ cảnh xung quanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Mạo từ sở hữu cách được lặp lại trước mỗi tên riêng và là cách nói tỉnh lược trong gia phả; dựa vào ngữ cảnh, quan hệ được ngầm hiểu là “con của”. Nêu rõ cụm này giúp câu tự nhiên, dễ hiểu trong tiếng Việt mà không thêm ý ngoài nguyên văn.
- source_word: Μαθθὰτ
  choice: Mát-thát
  rationale: Phiên âm tên riêng theo âm dạng Hy Lạp, dùng hình thức rõ ràng và dễ đọc trong tiếng Việt.
- source_word: Λευὶ
  choice: Lê-vi
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt của tên Λευί.
- source_word: Μελχὶ
  choice: Mên-chi
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc, dễ đọc trong tiếng Việt, tương ứng với Μελχί.
- source_word: Ἰανναὶ
  choice: Gian-nai
  rationale: Phiên âm tên Ἰανναί theo dạng quen dùng trong tiếng Việt, đồng thời giữ âm tiết cuối của dạng Hy Lạp.
- source_word: Ἰωσὴφ
  choice: Giô-sép
  rationale: Dùng dạng phiên âm tiếng Việt đã quen thuộc của tên Ἰωσήφ.
theological_decisions:
- issue: Cách nói tỉnh lược trong gia phả
  choice: Lặp lại “con của” trước mỗi tên
  alternative: 'Giữ chuỗi sở hữu cách sát hình thức: “của Mát-thát, của Lê-vi, của Mên-chi, của Gian-nai, của Giô-sép”'
  rationale: Nguyên văn Hy Lạp chỉ lặp mạo từ sở hữu cách với các tên riêng, nhưng cấu trúc gia phả trong ngữ cảnh cung cấp quan hệ cha-con được tỉnh lược. Nêu rõ “con của” bảo toàn ý nghĩa ngữ pháp trong tiếng Việt mà không giải quyết thêm bất kỳ vấn đề thần học nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp “con của” để chuỗi gia phả rõ nghĩa trong tiếng Việt; các tên riêng được phiên âm theo lối quen thuộc của văn bản Kinh Thánh tiếng Việt. Dấu phẩy cuối câu được giữ vì câu gia phả tiếp tục sang câu kế tiếp.
