  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: vi
  text: con của Sê-rúc[a], con của Rê-u, con của Bê-léc, con của Ê-be, con của Sê-la[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “của Sê-rúc, của Ra-ga-u, của Pha-léc, của Ê-be, của Sa-la.” Gia phả trong Lu-ca dùng một chuỗi sở hữu cách tỉnh lược; cụm “con của” được bổ sung theo ngữ cảnh để tiếng Việt rõ nghĩa.'
    reason: lexical_alternative
  - marker: b
    text: Các tên Rê-u, Bê-léc và Sê-la được trình bày theo dạng quen thuộc trong Cựu Ước tiếng Việt; các dạng Hy Lạp tương ứng là Ra-ga-u, Pha-léc và Sa-la.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách lặp lại trước mỗi tên tiếp nối công thức chỉ quan hệ cha-con đã được hàm ý trong ngữ cảnh. Dịch là “con của” giúp câu tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: Σεροὺχ
  choice: Sê-rúc
  rationale: Phiên âm trực tiếp tên Hy Lạp Σερούχ theo quy ước tên riêng Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: Ῥαγαὺ
  choice: Rê-u
  rationale: Dùng dạng tên Cựu Ước quen thuộc tương ứng với tổ phụ được gọi là Ῥαγαύ trong bản Hy Lạp, giúp người đọc nhận ra mối liên hệ với gia phả Sáng Thế Ký.
- source_word: Φάλεκ
  choice: Bê-léc
  rationale: Dùng dạng tên Cựu Ước quen thuộc của nhân vật tương ứng với Φάλεκ, giữ sự liên kết giữa hai phần Kinh Thánh.
- source_word: Ἔβερ
  choice: Ê-be
  rationale: Phiên âm tên Ἔβερ theo cách dùng Kinh Thánh tiếng Việt, tương ứng với nhân vật trong gia phả Sáng Thế Ký.
- source_word: Σαλὰ
  choice: Sê-la
  rationale: Dùng dạng tên Cựu Ước quen thuộc tương ứng với Σαλά, giúp nhận diện nhân vật trong gia phả Sáng Thế Ký.
