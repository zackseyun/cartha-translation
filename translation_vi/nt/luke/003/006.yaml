reference: Luke 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: vi
  text: 'và mọi xác thịt sẽ thấy sự cứu rỗi của Đức Chúa Trời[a][b].


    [a] Hay “toàn thể nhân loại.” Nguyên văn Hy Lạp là “mọi xác thịt,” vọng lại Ê-sai 40:5 và tại đây chỉ tất cả mọi người.


    [b] Hay “sự cứu rỗi đến từ Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “toàn thể nhân loại.” Nguyên văn Hy Lạp là “mọi xác thịt,” vọng lại Ê-sai 40:5 và tại đây chỉ tất cả mọi người.
    reason: lexical_alternative
  - marker: b
    text: Hay “sự cứu rỗi đến từ Đức Chúa Trời.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: sẽ thấy
  rationale: Động từ ở thì tương lai, mang nghĩa trực tiếp là “sẽ thấy.” Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ được hình ảnh thị giác cụ thể của nguyên văn.
- source_word: πᾶσα σὰρξ
  choice: mọi xác thịt
  rationale: Đây là thành ngữ mang sắc thái ngôn ngữ tiên tri, chỉ toàn thể loài người và vọng lại Ê-sai 40:5. Giữ cách nói sát nguyên văn trong chính văn để bảo toàn mối liên hệ liên văn bản; chú thích nêu nghĩa tự nhiên là “toàn thể nhân loại.”
- source_word: σωτήριον
  choice: sự cứu rỗi
  rationale: Từ này được dùng như danh từ với mạo từ. “Sự cứu rỗi” là cách dịch trực tiếp, quen thuộc, đồng thời giữ được độ rộng về hành động cứu độ của Đức Chúa Trời; “sự giải cứu” có thể hẹp nghĩa hơn.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch sát cấu trúc sở hữu cách của tiếng Hy Lạp, không quyết định dứt khoát đó là quan hệ sở hữu hay nguồn gốc. Cách hiểu “đến từ Đức Chúa Trời” được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của thành ngữ πᾶσα σὰρξ
  choice: 'Phạm vi phổ quát đối với loài người: toàn thể nhân loại sẽ thấy sự cứu rỗi của Đức Chúa Trời.'
  alternative: Hiểu hoàn toàn theo nghĩa đen là mọi sinh vật có thân xác.
  rationale: Trong ngữ cảnh trích dẫn Ê-sai, cụm từ này chỉ nhân loại nói chung. Giữ “mọi xác thịt” trong chính văn vừa bảo toàn thành ngữ Kinh Thánh và âm hưởng tiên tri, vừa không phủ nhận đối tượng được nói đến là toàn thể loài người.
- issue: Quan hệ sở hữu cách trong τοῦ θεοῦ
  choice: “sự cứu rỗi của Đức Chúa Trời,” giữ nguyên độ mở của cấu trúc Hy Lạp.
  alternative: “sự cứu rỗi đến từ Đức Chúa Trời,” nhấn mạnh Đức Chúa Trời là nguồn ban sự cứu rỗi.
  rationale: Sở hữu cách có thể biểu thị sự thuộc về hoặc nguồn gốc. Chính văn không nên thu hẹp sự mơ hồ chân thực này; cách hiểu theo nguồn gốc được đưa vào chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Chính văn giữ thành ngữ “mọi xác thịt” để bảo toàn âm hưởng tiên tri và liên hệ với Ê-sai; chú thích giải nghĩa cho độc giả phổ thông. Cụm “sự cứu rỗi của Đức Chúa Trời” giữ độ mở của sở hữu cách Hy Lạp.
