  source_fidelity: 'Bản dịch phản ánh sát câu Hy Lạp: καὶ được chuyển là “và”; ὄψεται là tương lai “sẽ thấy”; πᾶσα σὰρξ được giữ là “mọi xác thịt”; và τὸ σωτήριον τοῦ θεοῦ là “sự cứu rỗi của Đức Chúa Trời.” Cách giữ thành ngữ “mọi xác thịt” trong chính văn, cùng chú thích giải nghĩa phạm vi là toàn thể nhân loại, bảo toàn tiếng vọng Ê-sai 40:5 và không làm phẳng hình ảnh của nguyên ngữ. “Của Đức Chúa Trời” cũng duy trì độ mở phù hợp của sở hữu cách τοῦ θεοῦ.'
  naturalness: Câu văn trang trọng, rõ ràng và phù hợp tiếng Việt Kinh Thánh hiện đại. “Mọi xác thịt” không phải lối nói hội thoại thông thường, nhưng là lựa chọn có chủ ý và thích hợp trong văn cảnh trích dẫn tiên tri; chú thích đã hỗ trợ đầy đủ cho độc giả hiện đại.
  terminology: “Sự cứu rỗi,” “Đức Chúa Trời,” và “mọi xác thịt” nhất quán với ngữ vực Kinh Thánh tiếng Việt. Chú thích [a] nêu đúng nghĩa thành ngữ; chú thích [b] trình bày hợp lý khả năng sở hữu cách nguồn gốc mà không biến nó thành nghĩa duy nhất.
