id: LUK.3.21
reference: Luke 3:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: vi
  text: Khi toàn dân chịu phép báp-têm, Giê-su cũng đã chịu phép báp-têm và đang cầu nguyện, thì trời[a] mở ra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây có thể chỉ “bầu trời” hữu hình hoặc cõi trời. Trong văn cảnh mặc khải này, nghĩa “cõi trời” phù hợp hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Khi ... thì
  rationale: Dùng cấu trúc kể chuyện tự nhiên trong tiếng Việt để dẫn vào sự việc, đồng thời không thêm một từ chỉ thời gian như “bấy giờ” vốn không có trực tiếp trong nguyên văn.
- source_word: ἐν τῷ βαπτισθῆναι
  choice: khi ... chịu phép báp-têm
  rationale: Cấu trúc giới từ với động từ nguyên mẫu có giá trị thời gian; “khi” diễn đạt rõ và tự nhiên trong tiếng Việt.
- source_word: ἅπαντα τὸν λαὸν
  choice: toàn dân
  rationale: Giữ ý chỉ toàn thể dân chúng mà không thu hẹp thành một đám đông riêng lẻ.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: Giê-su cũng đã chịu phép báp-têm
  rationale: “Cũng” thể hiện lực bổ sung của καί; “đã chịu” đặt việc báp-têm của Giê-su trước hành động Ngài đang cầu nguyện và trước biến cố chính.
- source_word: καὶ προσευχομένου
  choice: và đang cầu nguyện
  rationale: “Đang” làm rõ hành động tiếp diễn đồng thời với việc trời mở ra.
- source_word: ἀνεῳχθῆναι
  choice: mở ra
  rationale: Ngữ cảnh tiếng Việt cho phép hiểu theo thể bị động mà không cần thêm “được”; cách dịch này không đưa vào hình ảnh mạnh hơn như “xé ra”.
- source_word: τὸν οὐρανὸν
  choice: trời
  rationale: “Trời” là cách nói tự nhiên, trang trọng và có thể chỉ cả bầu trời hữu hình lẫn cõi trời; trong văn cảnh này nghĩa mặc khải từ cõi trời nổi bật hơn.
theological_decisions:
- issue: Nghĩa của οὐρανός trong cảnh Giê-su chịu phép báp-têm
  choice: trời
  alternative: bầu trời
  rationale: Văn cảnh ngay sau đó nói đến Thánh Linh ngự xuống và tiếng phán từ trời, nên sắc thái cõi trời phù hợp hơn; tuy vậy, từ “trời” cùng chú thích vẫn bảo tồn khả năng từ Hy Lạp chỉ bầu trời hữu hình.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giê-su” thay vì thêm một tước hiệu không có trong câu Hy Lạp; dùng “phép báp-têm” như thuật ngữ quen thuộc nhưng không giải thích thêm ngoài nguyên văn.
source_grounding:
  english_pob_role: consult_only
