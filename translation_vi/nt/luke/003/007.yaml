id: LUK.3.7
reference: Luke 3:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: vi
  text: 'Vậy, ông nói với các đám đông đang đi ra để được ông làm phép báp-têm: “Hỡi dòng dõi rắn độc[a], ai đã cảnh báo các ngươi chạy trốn cơn thịnh nộ sắp đến[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “lũ rắn độc.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “cơn thịnh nộ sẽ đến.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ông nói
  rationale: Thì chưa hoàn thành cho thấy lời nói diễn ra trong tiến trình hoặc được lặp lại; tiếng Việt không bắt buộc đánh dấu khía cạnh này bằng một cụm riêng, và ngữ cảnh tường thuật cho phép diễn đạt tự nhiên là “ông nói” mà không khẳng định mức độ lặp lại.
- source_word: οὖν
  choice: Vì thế
  rationale: Diễn tả sự tiếp nối có tính kết quả hoặc suy luận từ phần trước, đồng thời vẫn tự nhiên trong văn kể chuyện.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: với những đám đông đang kéo ra
  rationale: Giữ số nhiều của ὄχλοις và ý chuyển động ra ngoài để đến chỗ Giăng; “đang kéo ra” tự nhiên khi nói về nhiều người cùng đi.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: để được ông làm phép báp-têm
  rationale: Giữ mục đích và thể bị động của động từ Hy Lạp, đồng thời giữ đại từ “ông” thay vì thêm tên Giăng.
- source_word: Γεννήματα ἐχιδνῶν
  choice: nòi rắn độc
  rationale: “Nòi” chuyển tải ý về con cái hoặc dòng giống do γέννημα biểu thị và giữ được sắc thái quở trách mạnh; “rắn độc” diễn đạt rõ ἐχιδνῶν.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ai đã cảnh báo các ngươi
  rationale: Trong bối cảnh hiểm họa và phán xét, ὑποδείκνυμι mang lực nghĩa cảnh báo hoặc chỉ cho biết; “cảnh báo” phù hợp nhất. “Các ngươi” giữ sắc thái đối chất trực diện với số nhiều.
- source_word: φυγεῖν
  choice: chạy trốn
  rationale: Giữ hình ảnh cụ thể về việc bỏ chạy khỏi nguy hiểm, thay vì chuyển thành ý khái quát hơn là “thoát khỏi”.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: cơn thịnh nộ sắp đến
  rationale: μέλλουσης chỉ điều đang tới hoặc sắp xảy ra; “cơn thịnh nộ sắp đến” rõ ràng, tự nhiên và không xác định thêm thời điểm hay cơ chế của sự phán xét.
theological_decisions:
- issue: Bản chất của ὀργή trong lời cảnh báo của Giăng
  choice: “cơn thịnh nộ” chỉ sự phán xét của Đức Chúa Trời đang đến nhưng không thu hẹp vào một hệ thống cánh chung cụ thể
  alternative: Hiểu riêng là sự phán xét cánh chung cuối cùng, hoặc riêng là một cuộc phán xét trong lịch sử
  rationale: Ngữ cảnh nhấn mạnh sự ăn năn trước sự phán xét của Đức Chúa Trời. Bản dịch giữ nguyên hình ảnh “thịnh nộ” và sự sắp đến của nó, không giải quyết thay cho bản văn phạm vi hay thời điểm chính xác.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Nòi rắn độc” giữ sức nặng của lời quở trách; “các ngươi” được dùng có chủ ý trong lời đối chất gay gắt, không phải như đại từ giao tiếp thông thường. Thuật ngữ “phép báp-têm” giúp nhận diện hành động tôn giáo trong ngữ cảnh Tân Ước mà không diễn giải thêm phương thức thực hiện.
