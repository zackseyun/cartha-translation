id: LUK.3.4
reference: Luke 3:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: vi
  text: 'Như đã chép trong sách lời của nhà tiên tri Ê-sai rằng:


    “Có tiếng người kêu trong hoang địa[a]:


    ‘Hãy dọn đường cho Chúa[b],


    làm thẳng các lối của Ngài.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm “trong hoang địa” có thể đi với “kêu” như trong câu chính, hoặc đi với mệnh lệnh theo cách hiểu: “Có tiếng người kêu: ‘Trong hoang địa, hãy dọn đường cho Chúa.’”'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch theo nền tảng của Ê-sai 40:3 là “CHÚA”; bản Hê-bơ-rơ tại đó dùng danh riêng của Đức Chúa Trời là YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: như đã chép
  rationale: Cách diễn đạt tự nhiên để dẫn lời Kinh Thánh, đồng thời phản ánh thể hoàn thành bị động và giá trị còn hiệu lực của điều đã được chép.
- source_word: ἐν βίβλῳ λόγων
  choice: trong sách ghi những lời
  rationale: Giữ được cả ý 'sách' và 'những lời' nhưng dùng cấu trúc tiếng Việt tự nhiên; 'cuộn sách' đúng với vật thể cổ đại hơn nhưng không cần thiết trong câu chính.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: của nhà tiên tri Ê-sai
  rationale: Diễn đạt tự nhiên quan hệ sở hữu và danh xưng đồng vị trong tiếng Việt.
- source_word: Φωνὴ βοῶντος
  choice: Có tiếng người kêu
  rationale: Thể hiện danh từ không có mạo từ và ý chỉ người của phân từ βοῶντος bằng một câu tiếng Việt sáng rõ, trang trọng.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang địa
  rationale: '''Hoang địa'' phù hợp bối cảnh tiên tri và nơi Giăng thi hành chức vụ, đồng thời có sắc thái trang trọng mà người đọc hiện đại vẫn hiểu được.'
- source_word: Ἑτοιμάσατε
  choice: Hãy dọn
  rationale: Giữ nguyên lực mệnh lệnh; đi với 'đường' tự nhiên hơn cách dịch máy móc là 'chuẩn bị'.
- source_word: τὴν ὁδὸν κυρίου
  choice: đường cho Chúa
  rationale: Truyền đạt tự nhiên hình ảnh dọn một con đường để Chúa đến, không biến hình ảnh thành một khái niệm trừu tượng.
- source_word: κυρίου
  choice: Chúa
  rationale: Theo sát κύριος trong bản Hy Lạp; bối cảnh danh YHWH của Ê-sai được nêu trong chú thích thay vì áp đặt vào câu chính.
- source_word: εὐθείας ποιεῖτε
  choice: làm thẳng
  rationale: Giữ trực tiếp hình ảnh sửa đường và lực mệnh lệnh của cấu trúc Hy Lạp.
- source_word: τὰς τρίβους αὐτοῦ
  choice: các lối của Ngài
  rationale: '''Các lối'' phản ánh số nhiều và duy trì thế song song với ''đường''; ''của Ngài'' giữ đại từ sở hữu của nguyên văn.'
theological_decisions:
- issue: Cách dịch κύριος trong lời trích dẫn Ê-sai vốn dùng danh YHWH trong tiếng Hê-bơ-rơ
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA / CHÚA (biểu thị YHWH)
  rationale: Bản văn Hy Lạp của Lu-ca có κύριος, nên câu chính dịch là 'Chúa'. Chú thích bảo tồn nền tảng Cựu Ước có danh YHWH, đồng thời không thu hẹp sức căng thần học và âm hưởng Cơ Đốc học của lời trích.
- issue: Quan hệ cú pháp của cụm ἐν τῇ ἐρήμῳ
  choice: 'gắn với ''kêu'': ''tiếng người kêu trong hoang địa'''
  alternative: 'gắn với mệnh lệnh: ''Trong hoang địa, hãy dọn đường cho Chúa'''
  rationale: Cách ngắt câu chính phù hợp trực tiếp với trật tự và cách hiểu thông dụng của bản Hy Lạp Lu-ca, nhưng cấu trúc vẫn có thể được hiểu theo cách thứ hai; vì vậy giữ phương án đó trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng 'hoang địa' để giữ âm hưởng tiên tri; dùng 'dọn đường' thay vì 'chuẩn bị con đường' nhằm tạo câu tự nhiên. Các dòng thơ được xuống hàng để thể hiện lời trích dẫn thi ca. Hai dấu chú thích được đặt đúng tại những điểm có vấn đề văn bản hoặc diễn giải liên quan.
