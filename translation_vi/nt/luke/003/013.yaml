  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh cấm thu vượt mức quy định trong ngữ cảnh những người thu thuế. Tuy nhiên, “mức đã được ấn định cho mình” có thể gợi một mức được ấn định cho chính họ, thay vì số tiền họ được lệnh thu; “số đã được quy định cho các anh” rõ quan hệ hơn mà vẫn giữ bị động và sắc thái quy định chính thức của διατεταγμένον.
  naturalness: “Đừng thu quá số đã được quy định cho các anh” là cách nói hiện đại, tự nhiên và chính xác trong văn cảnh thu thuế. “Ông nói với họ” phản ánh đầy đủ εἶπεν πρὸς αὐτούς; lời xưng hô “các anh” vẫn phù hợp với nhóm người thu thuế trong ngữ cảnh.
  terminology: Giữ “thu” như sự cụ thể hóa theo ngữ cảnh của πράσσετε, không thêm nội dung ngoài câu trước. “Quy định” diễn đạt thích hợp διατεταγμένον; chú thích giữ phương án rộng hơn của động từ “làm”.
