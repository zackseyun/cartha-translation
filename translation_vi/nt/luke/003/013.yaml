  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: vi
  text: 'Ông nói với họ: “Các anh đừng thu quá số đã được quy định cho các anh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thức hơn: “Đừng làm gì vượt quá điều đã được quy định cho các anh.” Trong ngữ cảnh, động từ này chỉ hoạt động thu thuế của họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ông đáp
  rationale: δέ là từ nối nhẹ; trong mạch đối thoại tiếng Việt, “đáp” tự nhiên và thể hiện việc Giăng trả lời câu hỏi ở câu trước mà không nhấn mạnh sự tương phản.
- source_word: εἶπεν πρὸς αὐτούς
  choice: đáp
  rationale: Cụm λέγω + πρός có nghĩa là nói với họ; “đáp” diễn đạt gọn và đúng chức năng đối thoại trong ngữ cảnh.
- source_word: Μηδὲν πλέον
  choice: đừng ... quá mức
  rationale: Cụm này cấm lấy hoặc làm vượt quá giới hạn. Cách nói “đừng thu quá mức” tự nhiên trong tiếng Việt khi nói về hoạt động thu thuế.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: mức đã được ấn định cho mình
  rationale: διατεταγμένον là phân từ hoàn thành bị động của διατάσσω, chỉ điều đã được quy định hoặc ấn định. “Đã được ấn định” giữ sắc thái bị động và tính chính thức; “mức” được hiểu từ hoạt động thu thuế trong ngữ cảnh.
- source_word: πράσσετε
  choice: thu
  rationale: πράσσω có nghĩa rộng là làm hoặc thực hiện, nhưng khi nói trực tiếp với những người thu thuế, nó chỉ việc thu tiền. “Thu” làm rõ đối tượng hàm ẩn mà không thêm nội dung ngoài ngữ cảnh.
theological_decisions:
- issue: Cụ thể hóa hành động hàm ẩn trong πράσσετε
  choice: Dịch theo ngữ cảnh là “thu”
  alternative: “Đừng làm gì vượt quá điều đã được ấn định cho mình”
  rationale: Nguyên văn có thể được diễn đạt theo nghĩa rộng là “làm”, nhưng đối tượng nghe là những người thu thuế ở câu 12. Bản dịch chính nêu rõ hoạt động thu tiền để tiếng Việt tự nhiên, còn chú thích bảo tồn cách hiểu sát hình thức và độ rộng từ vựng của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các anh” phù hợp khi một người nam trưởng thành nói với một nhóm người trong ngữ cảnh này; “mình” tránh lối hành chính nặng nề nhưng vẫn chỉ rõ điều được ấn định cho họ.
