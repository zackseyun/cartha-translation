id: LUK.3.5
reference: Luke 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: vi
  text: 'Mọi thung lũng sẽ được lấp đầy[a],

    mọi núi và đồi sẽ bị hạ thấp;

    những chỗ quanh co sẽ trở nên thẳng[b],

    và những lối gồ ghề sẽ thành đường bằng phẳng.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mọi khe sâu sẽ được lấp đầy … những chỗ quanh co sẽ trở nên thẳng, và những nơi gồ ghề sẽ thành đường bằng phẳng.”'
    reason: lexical_alternative
  - marker: b
    text: Dòng này vọng lại Ê-sai 40:4, dùng hình ảnh sửa sang đường sá để nói về việc chuẩn bị con đường của Chúa.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: Mọi thung lũng
  rationale: φάραγξ có thể chỉ thung lũng, khe sâu hoặc hẻm núi. “Thung lũng” tự nhiên, dễ hiểu trong tiếng Việt và phù hợp với hình ảnh san lấp địa hình; chú thích giữ lại sắc thái “khe sâu”.
- source_word: πληρωθήσεται
  choice: sẽ được lấp đầy
  rationale: Thể tương lai bị động của πληρόω được giữ rõ; trong ngữ cảnh địa hình, “lấp đầy” diễn đạt tự nhiên hành động san lấp chỗ thấp.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: mọi núi và đồi
  rationale: Giữ cả hai danh từ gần nghĩa nhưng khác cấp độ địa hình, bảo toàn nhịp điệu và tính đầy đặn của lời tiên tri.
- source_word: ταπεινωθήσεται
  choice: sẽ bị hạ thấp
  rationale: Trong ngữ cảnh địa hình, động từ chỉ việc làm cho nơi cao thấp xuống. “Bị hạ thấp” cũng giữ được âm vang rộng hơn của động từ mà không chuyển hẳn sang nghĩa đạo đức “bị hạ mình”.
- source_word: τὰ σκολιά
  choice: những chỗ quanh co
  rationale: Tính từ trung tính số nhiều được dùng như danh từ. “Những chỗ quanh co” giữ sự không xác định của tiếng Hy Lạp, đồng thời phù hợp với hình ảnh mở đường.
- source_word: εἰς εὐθείαν
  choice: sẽ trở nên thẳng
  rationale: Cấu trúc εἰς diễn tả kết quả biến đổi. Cách dịch này tự nhiên trong tiếng Việt và không thêm danh từ “đường” khi nguyên văn không nêu rõ tại đây.
- source_word: αἱ τραχεῖαι
  choice: những lối gồ ghề
  rationale: Tính từ giống cái số nhiều được dùng như danh từ, có thể ngầm chỉ lối đi hoặc đường. “Lối” làm rõ hình ảnh vừa đủ mà không lặp sớm danh từ “đường” xuất hiện ngay sau đó.
- source_word: εἰς ὁδοὺς λείας
  choice: sẽ thành đường bằng phẳng
  rationale: ὁδούς nêu rõ “đường”, còn λείας có nghĩa nhẵn hoặc bằng phẳng. Trong tiếng Việt, “đường bằng phẳng” là cách diễn đạt tự nhiên cho con đường đã được sửa sang, san phẳng.
theological_decisions:
- issue: Hình ảnh tiên tri và địa hình trích từ Ê-sai 40:4
  choice: Giữ nguyên hình ảnh cụ thể về việc san lấp địa hình và sửa đường để chuẩn bị con đường của Chúa.
  alternative: Diễn giải trực tiếp thành ý nghĩa đạo đức hoặc thuộc linh, chẳng hạn người kiêu ngạo bị hạ xuống và người thấp hèn được nâng lên.
  rationale: Câu Hy Lạp dùng ngôn ngữ cụ thể về địa hình và đường sá. Giữ hình ảnh này bảo toàn sức thơ và sự liên hệ với lời tiên tri, đồng thời không áp đặt một cách giải nghĩa thần học vào chính bản dịch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ cấu trúc song song và hình ảnh địa hình của nguyên văn; dùng “bị hạ thấp” thay vì cách diễn đạt thuần đạo đức, và phân biệt “lối gồ ghề” với “đường bằng phẳng” để câu tự nhiên mà vẫn sát cấu trúc Hy Lạp.
