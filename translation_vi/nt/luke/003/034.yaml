base_translation:
  language: en
  yaml_path: translation/nt/luke/003/034.yaml
  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: vi
  text: con của Gia-cốp, con của Y-sác, con của Áp-ra-ham, con của Tha-rê[a], con của Na-cô[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hy Lạp: Tha-ra; ở đây dùng dạng tên Cựu Ước quen thuộc là Tha-rê.'
    reason: lexical_alternative
  - marker: b
    text: 'Hy Lạp: Na-khôr; ở đây dùng dạng tên Cựu Ước quen thuộc là Na-cô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: con của
  rationale: Trong gia phả Lu-ca, mạo từ sở hữu cách lặp lại trước mỗi tên tiếp nối cấu trúc tỉnh lược của cả phân đoạn. Tiếng Việt cần nêu rõ quan hệ cha-con để câu dễ hiểu; “con của” truyền đạt tự nhiên quan hệ được ngầm hiểu.
- source_word: Ἰακώβ
  choice: Gia-cốp
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho tổ phụ này.
- source_word: Ἰσαάκ
  choice: Y-sác
  rationale: Dùng dạng tên quen thuộc trong Kinh Thánh tiếng Việt, tương ứng với nhân vật Cựu Ước.
- source_word: Ἀβραάμ
  choice: Áp-ra-ham
  rationale: Dùng dạng tên quen thuộc và dễ nhận biết trong Kinh Thánh tiếng Việt.
- source_word: Θάρα
  choice: Tha-rê
  rationale: Dùng dạng tên Cựu Ước quen thuộc trong tiếng Việt cho cùng một nhân vật, thay vì phiên âm sát dạng Hy Lạp Θάρα.
- source_word: Ναχώρ
  choice: Na-cô
  rationale: Dùng dạng tên Cựu Ước quen thuộc trong tiếng Việt cho cùng một nhân vật, thay vì phiên âm cứng theo dạng Hy Lạp Ναχώρ.
theological_decisions:
- issue: Nêu rõ quan hệ con cái trong cấu trúc gia phả tỉnh lược
  choice: Lặp lại “con của” trước mỗi tên
  alternative: Chỉ dùng một chuỗi tên ở dạng sở hữu mà không nêu quan hệ
  rationale: Nguyên văn chỉ lặp mạo từ sở hữu cách với từng tên vì quan hệ đã được thiết lập trong văn cảnh. Việc thêm “con của” làm sáng tỏ cú pháp tiếng Việt mà không thêm nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Lặp “con của” để giữ nhịp gia phả và làm rõ quan hệ. Các tên riêng theo dạng quen thuộc trong Kinh Thánh tiếng Việt; dấu câu kết thúc câu được cung cấp theo đơn vị câu.
