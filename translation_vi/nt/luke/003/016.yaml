source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: vi
  text: 'Giăng trả lời mọi người rằng: “Phần tôi, tôi làm phép báp-têm cho anh em bằng nước; nhưng có Đấng mạnh hơn tôi đang đến, Đấng mà tôi không xứng đáng tháo quai dép của Ngài. Chính Ngài sẽ làm phép báp-têm cho anh em trong Đức Thánh Linh và lửa.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm “trong Đức Thánh Linh và lửa” cũng có thể được hiểu là “bằng Đức Thánh Linh và lửa.” “Lửa” có thể gợi đến sự thanh tẩy, sự phán xét, hoặc thuộc về một hình ảnh thống nhất về phép báp-têm trong Thánh Linh và lửa; câu dịch giữ nguyên cách diễn đạt của bản văn.
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: Giăng đáp lời tất cả họ
  rationale: Diễn đạt tự nhiên công thức trần thuật Hy Lạp; động từ phân từ λέγων không cần dịch riêng thành “rằng” vì dấu hai chấm đã làm rõ lời trực tiếp, còn πᾶσιν được giữ bằng “tất cả họ”.
- source_word: Ἐγὼ μὲν
  choice: Phần tôi, tôi
  rationale: Giữ sắc thái nhấn mạnh và chuẩn bị cho sự tương phản do μέν...δέ tạo ra, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὕδατι
  choice: bằng nước
  rationale: Cách hiểu công cụ/chất liệu của cách dữ cách; “bằng nước” là cách nói rõ và tự nhiên trong tiếng Việt.
- source_word: βαπτίζω / βαπτίσει
  choice: làm phép báp-têm / sẽ làm phép báp-têm
  rationale: Dùng thuật ngữ Kinh Thánh quen thuộc mà không thu hẹp nghĩa thành một phương thức nghi lễ riêng.
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: nhưng có Đấng mạnh hơn tôi đang đến
  rationale: Giữ quan hệ tương phản của δέ, tính hiện thời/sắp xảy ra của ἔρχεται và phép so sánh trực tiếp của ἰσχυρότερός μου.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: tôi không xứng đáng
  rationale: Trong công thức tự hạ này, ἱκανός biểu thị sự xứng đáng hoặc tư cách; “không xứng đáng” truyền đạt đúng nghĩa theo ngữ cảnh.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: cởi quai dép cho Ngài
  rationale: Diễn tả rõ công việc thấp hèn là tháo quai giày dép; “cởi quai dép” tự nhiên hơn cách dịch quá sát như “tháo dây của dép”.
- source_word: αὐτὸς
  choice: Chính Ngài
  rationale: “Chính” thể hiện lực nhấn mạnh của αὐτός và làm nổi bật sự tương phản giữa Giăng với Đấng đang đến.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: trong Đức Thánh Linh và lửa
  rationale: Giữ “trong” để không quyết định quá mức sắc thái của ἐν là phương tiện, phạm vi hay yếu tố; giữ nguyên “và lửa” để bảo tồn tính hàm hồ của hình ảnh.
theological_decisions:
- issue: Ý nghĩa của phép báp-têm “trong Đức Thánh Linh và lửa”
  choice: Giữ nguyên một cụm liên kết, không xác định lửa là sự thanh tẩy, sự phán xét hay một khía cạnh của cùng một phép báp-têm.
  alternative: Diễn giải lửa chỉ là sự thanh tẩy, hoặc tách Đức Thánh Linh dành cho một nhóm và lửa phán xét dành cho nhóm khác.
  rationale: Bản văn ngắn gọn và văn cảnh cho phép nhiều cách hiểu; bản dịch cần giữ nguyên sức căng thần học thay vì giải quyết ngay trong câu dịch.
- issue: πνεύματι ἁγίῳ là Thánh Linh thần linh hay một tinh thần thánh khiết
  choice: Đức Thánh Linh
  alternative: thánh linh hoặc tinh thần thánh khiết
  rationale: Trong lời loan báo về Đấng đang đến, cụm từ chỉ Thánh Linh của Đức Chúa Trời; cách viết hoa và tôn xưng phù hợp ngữ cảnh mà không thêm một diễn giải hệ phái.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς trong lời nói trực tiếp với đám đông; dùng “Ngài” để quy chiếu tôn kính đến Đấng đang đến. Thuật ngữ “làm phép báp-têm” được giữ vì quen thuộc rộng rãi trong tiếng Việt Cơ Đốc.
