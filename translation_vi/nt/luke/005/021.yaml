  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: vi
  text: 'Các thầy thông giáo và những người Pha-ri-si bắt đầu suy luận với nhau: “Người này là ai mà nói những lời phạm thượng như vậy? Ngoài một mình Đức Chúa Trời ra, ai có thể tha tội?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: bắt đầu suy luận với nhau
  rationale: Giữ cấu trúc ‘bắt đầu’ và sắc thái cân nhắc, chất vấn của διαλογίζομαι, đồng thời không quyết định quá mức rằng đây chỉ là suy nghĩ thầm hay một cuộc trao đổi thành lời.
- source_word: γραμματεῖς
  choice: các thầy thông giáo
  rationale: Cách gọi quen thuộc trong tiếng Việt dành cho những người am hiểu và giảng dạy Luật pháp trong bối cảnh Phúc Âm.
- source_word: Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Phiên âm tên nhóm theo cách dùng Kinh Thánh tiếng Việt phổ biến và dễ nhận biết.
- source_word: λαλεῖ βλασφημίας
  choice: nói những lời phạm thượng
  rationale: Diễn đạt tự nhiên trong tiếng Việt và phản ánh danh từ số nhiều βλασφημίας mà không làm nhẹ lời cáo buộc.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: tha tội
  rationale: Đây là cách diễn đạt tự nhiên và chính xác của thành ngữ Hy Lạp chỉ việc tha thứ tội lỗi.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: Ngoài một mình Đức Chúa Trời ra
  rationale: 'Giữ nguyên ý loại trừ và sự nhấn mạnh của μόνος: không ai ngoài chính Đức Chúa Trời.'
- source_word: Τίς ἐστιν οὗτος
  choice: Người này là ai
  rationale: Giữ giọng chất vấn gay gắt; ‘người này’ là cách chỉ định tự nhiên trong tiếng Việt, không thêm một kết luận về căn tính của Chúa Giê-su.
theological_decisions:
- issue: Hàm ý về thẩm quyền tha tội của Chúa Giê-su
  choice: Trình bày trực tiếp lời phản đối rằng chỉ một mình Đức Chúa Trời có thể tha tội.
  alternative: Giảm nhẹ tính độc quyền của lời khẳng định, hoặc bổ sung kết luận minh nhiên về thần tính của Chúa Giê-su.
  rationale: Câu này tạo nên sự căng thẳng thần học trong mạch truyện nhưng chưa tự phát biểu kết luận Cơ Đốc học; bản dịch không nên giải quyết thay cho văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘thầy thông giáo’, ‘Pha-ri-si’, ‘Đức Chúa Trời’ theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; giữ câu hỏi trực diện và sắc thái cáo buộc của nguyên văn.
