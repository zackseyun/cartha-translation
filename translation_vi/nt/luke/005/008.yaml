revisions:
- from: 'Nhưng khi Si-môn Phi-e-rơ thấy vậy[a], ông sụp xuống bên đầu gối Đức Giê-su và thưa: “Lạy Chúa, xin rời xa con, vì con là một người tội lỗi[b].”'
  to: 'Nhưng khi Si-môn Phi-e-rơ thấy vậy[a], ông sụp xuống trước đầu gối Đức Giê-su và thưa: “Lạy Chúa, xin rời xa con, vì con là một người tội lỗi[b].”'
  rationale: Chỉ thay «bên đầu gối» bằng «trước đầu gối» để phản ánh chính xác hơn quan hệ không gian và sắc thái quy phục của nguyên ngữ, đồng thời giữ chi tiết cụ thể «đầu gối». Không cần thay đổi chú thích, vì các neo chú thích và nội dung của chúng đều phù hợp.
  reviewer_model: gpt-5.6-terra
