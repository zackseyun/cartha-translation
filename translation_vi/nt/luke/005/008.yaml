id: LUK.5.8
reference: Luke 5:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: vi
  text: 'Nhưng khi Si-môn Phi-e-rơ thấy vậy[a], ông sụp xuống trước đầu gối Đức Giê-su và thưa: “Lạy Chúa, xin rời xa con, vì con là một người tội lỗi[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn không nêu điều ông thấy; theo văn cảnh, đó là mẻ cá lạ lùng.
    reason: implicit_object
  - marker: b
    text: Từ Hy Lạp được dùng ở đây có nghĩa cụ thể là “một người đàn ông tội lỗi”, chỉ chính Si-môn Phi-e-rơ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: khi ... thấy vậy
  rationale: Phân từ bất định quá khứ của ὁράω được diễn đạt như một mệnh đề chỉ thời gian. Tiếng Hy Lạp không nêu bổ ngữ; “vậy” tự nhiên trong tiếng Việt và hướng về mẻ cá lạ lùng trong văn cảnh.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển trong câu chuyện và có sắc thái tương phản nhẹ giữa phép lạ với phản ứng của Phi-e-rơ.
- source_word: Σίμων Πέτρος
  choice: Si-môn Phi-e-rơ
  rationale: Giữ cả hai tên có trong nguyên bản, theo dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: προσέπεσεν
  choice: ông sụp xuống
  rationale: προσπίπτω diễn tả việc ngã hoặc sụp xuống hướng về một người; “sụp xuống” truyền đạt tư thế đột ngột và khiêm hạ.
- source_word: τοῖς γόνασιν Ἰησοῦ
  choice: bên đầu gối Đức Giê-su
  rationale: Giữ hình ảnh cụ thể “đầu gối” của nguyên bản, thay vì đổi thành cách nói quen thuộc hơn là “dưới chân”.
- source_word: λέγων
  choice: và thưa
  rationale: Chuyển phân từ đồng thời thành động từ nối để câu tiếng Việt tự nhiên; “thưa” phù hợp với lời nói đầy kính sợ hướng đến Chúa Giê-su.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: xin rời xa con
  rationale: Mệnh lệnh bất định quá khứ của ἐξέρχομαι là lời khẩn cầu muốn có sự cách biệt. “Xin rời xa con” rõ nghĩa, trang trọng vừa phải và không cổ kính.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho lời khẩn cầu của Phi-e-rơ một cách tự nhiên trong tiếng Việt.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: một người tội lỗi
  rationale: Giữ cấu trúc danh từ và tính từ của nguyên bản. “Người đàn ông tội lỗi” sẽ nặng nề trong tiếng Việt, nên sắc thái giống đực của ἀνήρ được ghi ở chú thích.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: “Chúa” giữ được sự tôn kính và chiều sâu thần học có thể có của κύριε; tiểu từ “lạy” thể hiện lối xưng hô trực tiếp đầy kính sợ trong tiếng Việt mà không buộc câu phải xác định mức độ nhận thức thần học của Phi-e-rơ.
theological_decisions:
- issue: Cách dịch κύριε khi Si-môn Phi-e-rơ thưa với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa ngài; thưa Thầy
  rationale: Trong bối cảnh Phi-e-rơ kinh sợ trước dấu lạ và nhìn nhận tình trạng tội lỗi của mình, “Lạy Chúa” bảo toàn cả sự tôn kính lẫn khả năng hàm chứa nhận thức sâu hơn về thẩm quyền của Đức Giê-su, nhưng không giải thích quá mức lời xưng hô này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời kể, còn “Lạy Chúa” và đại từ “con” trong lời nói để diễn đạt thái độ kính sợ của Phi-e-rơ. Cụm “bên đầu gối” chủ ý giữ chi tiết thân thể khác thường nhưng rõ nét của nguyên bản.
