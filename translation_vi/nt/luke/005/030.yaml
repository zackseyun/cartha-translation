  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: nhóm người Pha-ri-si cùng các thầy thông giáo thuộc về họ, hành động than phiền mang sắc thái kéo dài, lời nói hướng đến các môn đồ của Đức Giê-su, và câu hỏi về việc ăn uống với người thu thuế cùng người bị gọi là tội lỗi. “Cứ” phản ánh hợp lý thì chưa hoàn thành của ἐγόγγυζον. “Với các môn đồ” phù hợp với πρὸς ở ngữ cảnh lời nói.'
