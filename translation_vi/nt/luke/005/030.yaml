  to: 'Những người Pha-ri-si và các thầy thông giáo của họ cứ lẩm bẩm than phiền với các môn đồ của Đức Giê-su rằng: “Tại sao các ông ăn uống với những người thu thuế và những kẻ tội lỗi?”'
