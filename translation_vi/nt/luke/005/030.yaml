source:
  edition: SBLGNT
  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: vi
  text: 'Những người Pha-ri-si và các thầy thông giáo của họ cứ lẩm bẩm than phiền với các môn đồ của Đức Giê-su rằng: “Tại sao các ông ăn uống với những người thu thuế và những kẻ tội lỗi?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: cứ lẩm bẩm phàn nàn
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; cụm từ này giữ được cả sắc thái nói nhỏ và bất bình của động từ.
- source_word: γραμματεῖς
  choice: các thầy thông giáo
  rationale: Cách gọi lịch sử quen thuộc trong tiếng Việt, chỉ những người chuyên chép, nghiên cứu và giảng giải Luật pháp.
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu theo cú pháp Hy Lạp bổ nghĩa tự nhiên cho “các thầy thông giáo,” liên hệ họ với những người Pha-ri-si.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: với các môn đồ của Đức Giê-su
  rationale: πρός với đối cách ở đây chỉ đối tượng mà lời phàn nàn hướng đến; dùng danh xưng rõ nghĩa để tránh đại từ mơ hồ trong câu tiếng Việt.
- source_word: Διὰ τί
  choice: Tại sao
  rationale: Cách hỏi tự nhiên, trực tiếp trong tiếng Việt hiện đại.
- source_word: τελωνῶν
  choice: những người thu thuế
  rationale: Cách dịch rõ ràng và thông dụng, đồng thời giữ nguyên căn tính xã hội bị khinh miệt của nhóm này trong bối cảnh.
- source_word: ἁμαρτωλῶν
  choice: những kẻ tội lỗi
  rationale: Tương đương trực tiếp, giữ được sắc thái phân loại mang tính phán xét trong lời của những người phản đối.
- source_word: ἐσθίετε καὶ πίνετε
  choice: ăn uống
  rationale: Diễn đạt tự nhiên trong tiếng Việt mà vẫn bảo toàn hai hành vi cụ thể “ăn” và “uống.”
- source_word: καὶ
  choice: Những
  rationale: Không dịch máy móc liên từ mở đầu; tiếng Việt tiếp nối mạch kể tự nhiên bằng cách vào thẳng chủ ngữ, không thêm quan hệ diễn ngôn ngoài văn bản.
theological_decisions:
- issue: Ý nghĩa xã hội-tôn giáo của việc đồng bàn với “những người thu thuế và những kẻ tội lỗi”
  choice: Giữ nguyên lời chất vấn cụ thể về việc ăn uống với hai nhóm người này
  alternative: Diễn giải rõ rằng hành động đó bị xem là vi phạm sự thanh sạch nghi lễ hoặc là tán thành đời sống đạo đức của họ
  rationale: Nguyên văn không giải thích bản chất chính xác của sự phản đối. Cách dịch này duy trì căng thẳng thần học và xã hội mà không áp đặt một cách giải thích hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Pha-ri-si,” “thầy thông giáo” và “môn đồ” duy trì các danh xưng Kinh Thánh quen thuộc; “cứ lẩm bẩm phàn nàn” tái hiện giá trị kéo dài của thì chưa hoàn thành cùng sắc thái tiêu cực của động từ Hy Lạp.
