  terminology: “Pha-ri-si,” “thầy thông giáo,” “môn đồ,” “người thu thuế,” và “kẻ tội lỗi” đều là các cách gọi quen thuộc, thích hợp với văn cảnh Kinh Thánh. “Những kẻ tội lỗi” cần được giữ vì đây là nhãn gọi mang tính phán xét của những người đang phản đối, không phải lời xác nhận của người kể chuyện.
