  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: hạt từ thu hút chú ý (ἰδού), những người nam đang khiêng người bại liệt trên giường, nỗ lực đang tiếp diễn nhằm đưa người ấy vào và đặt trước mặt nhân vật được ngữ cảnh xác định là Chúa Giê-su. “Tìm cách” diễn đạt phù hợp sắc thái chưa hoàn thành của ἐζήτουν; “đưa ... vào” giữ được hướng tính của εἰσενεγκεῖν. Đại từ “Ngài” bảo lưu việc nguyên văn dùng αὐτοῦ thay vì lặp tên riêng.'
  naturalness: Câu văn tự nhiên, rõ ràng, và có sắc thái trang trọng vừa phải phù hợp văn bản Kinh Thánh tiếng Việt hiện đại. Việc tách thành hai câu không làm mất quan hệ cú pháp hay diễn tiến của câu Hy Lạp.
  terminology: “Bại liệt” là cách gọi thông dụng và chính xác cho παραλελυμένος trong ngữ cảnh này. “Chiếc giường” là lựa chọn trực tiếp, không diễn giải quá mức κλίνη; các khả năng “cáng” và “chõng” được ghi chú thích hợp. Cách dùng “Ngài” nhất quán với văn phong tôn kính thông thường khi đại từ trong ngữ cảnh chỉ Chúa Giê-su, đồng thời chính văn vẫn giữ đại từ như nguồn.
