id: LUK.5.18
reference: Luke 5:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: vi
  text: Kìa, có mấy người đàn ông đang khiêng một người bị bại liệt trên một chiếc giường[a]. Họ tìm cách đưa người ấy vào và đặt trước mặt Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một chiếc cáng” hoặc “một chiếc chõng”; từ Hy Lạp κλίνη có thể chỉ một vật giống giường dùng để nằm.
    reason: lexical_alternative
  - marker: b
    text: Tức là trước mặt Chúa Giê-su.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sống động của lời kể, đồng thời vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại.
- source_word: ἄνδρες
  choice: mấy người đàn ông
  rationale: Diễn đạt đúng nghĩa chỉ những người nam trưởng thành; từ “mấy” thể hiện số nhiều không xác định một cách tự nhiên.
- source_word: φέροντες
  choice: đang khiêng
  rationale: Thể hiện hành động đang diễn ra của phân từ hiện tại và phù hợp với việc nhiều người cùng mang một người nằm trên giường.
- source_word: ἐπὶ κλίνης
  choice: trên một chiếc giường
  rationale: κλίνη chỉ một vật dùng để nằm như giường, chõng hoặc cáng; “chiếc giường” là cách dịch trực tiếp, không diễn giải quá mức.
- source_word: ἄνθρωπον ὃς ἦν παραλελυμένος
  choice: một người bị bại liệt
  rationale: Diễn đạt tự nhiên trạng thái kéo dài do phân từ hoàn thành bị động παραλελυμένος biểu thị mà không thêm mức độ hay nguyên nhân.
- source_word: ἐζήτουν
  choice: Họ tìm cách
  rationale: Truyền đạt sắc thái nỗ lực đang tiếp diễn của thì chưa hoàn thành; trong ngữ cảnh, “tìm cách” tự nhiên hơn “tìm kiếm”.
- source_word: εἰσενεγκεῖν
  choice: đưa người ấy vào
  rationale: Giữ ý nghĩa hướng vào bên trong của εἰσφέρω; ngữ cảnh đã cho biết họ khiêng người ấy nên không cần lặp lại động từ “khiêng”.
- source_word: θεῖναι
  choice: đặt
  rationale: τίθημι ở đây có nghĩa rộng là đặt một người tại một vị trí, không nhất thiết xác định thêm tư thế.
- source_word: ἐνώπιον αὐτοῦ
  choice: trước mặt Ngài
  rationale: “Trước mặt” tương ứng sát với ἐνώπιον; đại từ tôn kính “Ngài” đọc tự nhiên trong tiếng Việt và ngữ cảnh xác định người được nói đến là Chúa Giê-su, trong khi chú thích ghi rõ điểm này.
theological_decisions:
- issue: Đối tượng được đại từ αὐτοῦ ở cuối câu chỉ đến
  choice: trước mặt Ngài
  alternative: trước mặt Chúa Giê-su
  rationale: Bản Hy Lạp dùng đại từ chứ không nhắc lại danh xưng. Bản dịch vì thế giữ đại từ, còn chú thích xác định đối tượng theo ngữ cảnh, tránh đưa tên riêng vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Tách thành hai câu để tiếng Việt sáng rõ mà vẫn giữ trình tự hành động của nguyên văn. Các dấu chú thích được đặt ngay sau từ ngữ thực sự liên quan, thay vì theo vị trí dường như bị đảo trong lớp tham khảo tiếng Anh.
