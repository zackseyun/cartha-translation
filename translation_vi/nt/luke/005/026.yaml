base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: vi
  text: 'Sự kinh ngạc bao trùm mọi người; họ tôn vinh Đức Chúa Trời và đầy sợ hãi, nói rằng: “Hôm nay chúng ta đã thấy những điều phi thường[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những điều lạ thường” hoặc “những điều khác thường”; từ Hy Lạp chỉ những điều vượt ngoài sự mong đợi thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις ἔλαβεν ἅπαντας
  choice: Mọi người đều kinh ngạc
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp theo nghĩa sự kinh ngạc mạnh mẽ bao trùm tất cả mọi người, tránh nghĩa thần bí mà từ tương đương với ‘xuất thần’ có thể gợi ra trong tiếng Việt.
- source_word: ἐδόξαζον τὸν θεόν
  choice: tôn vinh Đức Chúa Trời
  rationale: Giữ sát ý δοξάζω là làm rạng danh, tôn vinh; ngữ cảnh và thể chưa hoàn thành cho thấy hành động đang diễn ra, được thể hiện tự nhiên trong chuỗi hành động tiếng Việt.
- source_word: ἐπλήσθησαν φόβου
  choice: đầy lòng sợ hãi
  rationale: Giữ trực tiếp sắc thái φόβος là sợ hãi, đồng thời dùng cách nói tự nhiên trong tiếng Việt, không thu hẹp nghĩa thành chỉ ‘kính sợ’ hay ‘thán phục’.
- source_word: Εἴδομεν
  choice: chúng ta đã thấy
  rationale: Thì quá khứ với ‘đã’ diễn tả điều họ vừa chứng kiến và phản ứng hiện thời của họ.
- source_word: παράδοξα
  choice: những việc phi thường
  rationale: Chỉ những việc vượt ngoài điều người ta thường mong đợi; ‘phi thường’ vừa tự nhiên vừa giữ sắc thái kinh ngạc của ngữ cảnh.
- source_word: σήμερον
  choice: Hôm nay
  rationale: Chuyển dịch trực tiếp trạng từ thời gian và đặt đầu câu trích dẫn cho lời nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của φόβος trước hành động của Đức Chúa Trời
  choice: sợ hãi
  alternative: kính sợ
  rationale: ‘Sợ hãi’ bảo tồn sự căng thẳng giữa nỗi sợ và việc tôn vinh Đức Chúa Trời, thay vì diễn giải cảm xúc ấy theo hướng chỉ còn lòng tôn kính.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc được điều chỉnh nhẹ để tự nhiên, trong khi vẫn giữ đủ ba phản ứng của đám đông và không làm nhẹ sắc thái ‘sợ hãi’.
