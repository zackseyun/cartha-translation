id: LUK.5.1
reference: Luke 5:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: vi
  text: Có lần, trong lúc đám đông chen lấn quanh ngài và lắng nghe lời Đức Chúa Trời[a], ngài đang đứng bên hồ Ghê-nê-xa-rết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khi đám đông chen lấn quanh ngài và nghe lời Đức Chúa Trời.”'
    reason: lexical_alternative
  - marker: b
    text: Ghê-nê-xa-rết là hồ cũng được gọi là Biển Ga-li-lê.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Có lần
  rationale: Diễn đạt tự nhiên công thức tường thuật thường gặp trong Lu-ca, mở ra một sự việc mà không thêm một từ chỉ thời điểm như “bây giờ” vốn không có trong nguyên văn.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: trong lúc ... chen lấn ... và lắng nghe
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ mang ý nghĩa thời gian; “trong lúc” giữ được tính đồng thời và hai hành động song song trong tiếng Hy Lạp.
- source_word: ὄχλον
  choice: đám đông
  rationale: Cách gọi tự nhiên trong tiếng Việt hiện đại, tương ứng trực tiếp với ὄχλος.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: chen lấn quanh ngài
  rationale: Động từ diễn tả đám đông ép sát vào một người; “chen lấn quanh” truyền đạt rõ sức ép thể chất mà vẫn tự nhiên.
- source_word: ἀκούειν
  choice: lắng nghe
  rationale: Trong ngữ cảnh đám đông chủ ý nghe lời được rao giảng, “lắng nghe” diễn tả sự chú tâm; chú thích giữ lại khả năng dịch sát hơn là “nghe”.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ cách diễn đạt Kinh Thánh quen thuộc và phạm vi ý nghĩa rộng của λόγος, thay vì thu hẹp thành “sứ điệp”.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: ngài đang đứng
  rationale: Cấu trúc quanh động từ cho thấy tư thế đang tiếp diễn; đại từ αὐτός không cần được nhấn mạnh thành “chính ngài” trong câu tiếng Việt.
- source_word: παρὰ τὴν λίμνην
  choice: bên hồ
  rationale: Diễn đạt ngắn gọn vị trí ở sát cạnh hồ theo nghĩa của παρά với đối cách trong ngữ cảnh này.
- source_word: Γεννησαρέτ
  choice: Ghê-nê-xa-rết
  rationale: Phiên âm tên riêng được dùng trong nguyên văn, không thay bằng tên giải thích “Biển Ga-li-lê”.
theological_decisions:
- issue: Cách dịch τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  alternative: sứ điệp của Đức Chúa Trời
  rationale: “Lời Đức Chúa Trời” bảo toàn sắc thái thần học và liên văn bản rộng của cụm từ; “sứ điệp” có thể đúng trong ngữ cảnh rao giảng nhưng thu hẹp nghĩa hơn nguyên văn.
- issue: Cách xử lý địa danh Γεννησαρέτ
  choice: Ghê-nê-xa-rết
  alternative: Biển Ga-li-lê
  rationale: Nguyên văn gọi hồ này là Ghê-nê-xa-rết. Giữ nguyên địa danh tránh đưa sự đồng nhất hóa mang tính giải thích vào chính câu Kinh Thánh; thông tin nhận diện được đặt ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Có lần” mở đầu câu chuyện tự nhiên; “ngài” duy trì lối xưng hô kính trọng phù hợp với văn mạch. Câu giữ dạng tiếp diễn và dấu phẩy cuối ý không cần thiết trong tiếng Việt vì bản dịch được trình bày như một câu hoàn chỉnh ở cấp câu.
