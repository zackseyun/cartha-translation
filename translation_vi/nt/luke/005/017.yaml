id: LUK.5.17
reference: Luke 5:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: vi
  text: Một hôm, Đức Giê-su đang giảng dạy. Có các người Pha-ri-si và các thầy dạy luật đang ngồi ở đó; họ đã đến từ khắp các làng ở miền Ga-li-lê và Giu-đê, cũng như từ thành Giê-ru-sa-lem. Quyền năng của Chúa hiện diện để Người chữa lành.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “để chữa lành họ” thay cho “để Người chữa lành.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Một hôm
  rationale: Diễn đạt tự nhiên công thức dẫn chuyện quen thuộc của Lu-ca, giữ ý ‘vào một trong những ngày ấy’ mà không nặng tính từng chữ.
- source_word: αὐτὸς ἦν διδάσκων
  choice: Đức Giê-su đang giảng dạy
  rationale: Thì tiếp diễn của kết cấu Hy Lạp được thể hiện bằng ‘đang’; nêu rõ Đức Giê-su theo văn cảnh để tiếng Việt tự nhiên, không coi αὐτός là đại từ nhấn mạnh.
- source_word: Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt và thêm từ chỉ người để câu rõ nghĩa.
- source_word: νομοδιδάσκαλοι
  choice: các thầy dạy luật
  rationale: Phản ánh trực tiếp vai trò giảng dạy luật Môi-se, ít diễn giải hơn ‘các chuyên gia luật pháp’.
- source_word: ἐκ πάσης κώμης
  choice: từ khắp các làng
  rationale: Trong ngữ cảnh này, cách nói tự nhiên diễn đạt phạm vi phân bố rộng của πάσης và giữ nghĩa κώμη là làng.
- source_word: δύναμις κυρίου
  choice: Quyền năng của Chúa
  rationale: Giữ cấu trúc sở hữu và sức nặng thần học của δύναμις; ‘Chúa’ không thu hẹp thêm căn tính của κύριος.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: hiện diện để Đức Giê-su chữa lành
  rationale: Thể hiện chức năng mục đích/kết quả của εἰς τὸ với động từ nguyên mẫu và hiểu αὐτόν theo bản văn SBLGNT là chủ thể ngữ nghĩa của việc chữa lành, không tự ý thêm đối tượng ‘họ’.
theological_decisions:
- issue: Chủ thể và đối tượng trong cụm δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Quyền năng của Chúa hiện diện để Đức Giê-su chữa lành
  alternative: Quyền năng của Chúa hiện diện để chữa lành họ
  rationale: Bản văn được cung cấp đọc αὐτόν, không phải αὐτούς. Bản dịch chính vì thế hiểu Đức Giê-su là người thực hiện việc chữa lành và không thêm đối tượng; chú thích ghi nhận dị bản số nhiều.
- issue: Đối tượng quy chiếu của κυρίου
  choice: Chúa
  alternative: Đức Chúa Trời
  rationale: Giữ nguyên độ mở của danh xưng κύριος, không xác định tường minh hơn điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối tiếng Việt phổ biến; câu dài của nguyên bản được chia nhịp để đọc tự nhiên nhưng vẫn giữ trật tự thông tin và quan hệ ý nghĩa.
