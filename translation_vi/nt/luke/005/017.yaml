revisions:
- from: Một hôm, Đức Giê-su đang giảng dạy. Có những người Pha-ri-si và các thầy dạy luật ngồi ở đó; họ từ khắp các làng thuộc miền Ga-li-lê và Giu-đê, cũng như từ thành Giê-ru-sa-lem đến. Quyền năng của Chúa hiện diện để Đức Giê-su chữa lành.[a]
  to: Một hôm, Đức Giê-su đang giảng dạy. Có các người Pha-ri-si và các thầy dạy luật đang ngồi ở đó; họ đã đến từ khắp các làng ở miền Ga-li-lê và Giu-đê, cũng như từ thành Giê-ru-sa-lem. Quyền năng của Chúa hiện diện để Người chữa lành.[a]
  rationale: Chỉnh nhẹ trật tự câu để tiếng Việt tự nhiên hơn và phản ánh rõ sắc thái “đã đến” của phân từ hoàn thành ἐληλυθότες. Thay “Đức Giê-su” bằng “Người” ở mệnh đề cuối để tránh lặp, đồng thời vẫn phản ánh αὐτόν theo cách hiểu được chọn trong bản văn SBLGNT. Chú thích được hoàn chỉnh để xác định minh bạch dị bản số nhiều thay thế cho cách đọc số ít của bản chính.
