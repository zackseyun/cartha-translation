    issue: Chú thích dị bản không nói rõ dị bản “để chữa lành họ” thay cho phần nào của bản dịch chính.
    rationale: 'Bản chính dịch αὐτόν là chủ thể ngữ nghĩa: “để Đức Giê-su/Người chữa lành.” Chú thích hiện tại chỉ nêu một cách đọc thay thế, không cho biết quan hệ thay thế với cách đọc chính, nên người đọc khó nhận ra đây là dị bản αὐτούς thay cho αὐτόν.'
  - severity: low
