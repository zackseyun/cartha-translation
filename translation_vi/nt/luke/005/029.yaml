    issue: Cách diễn đạt số lượng khách chưa tự nhiên
    rationale: “Có đông đảo những người thu thuế” kết hợp từ “đông đảo” với “những người” khá gượng trong tiếng Việt. Đổi thành “Có rất đông người thu thuế” giữ nguyên nghĩa “một đám đông lớn” và tự nhiên hơn.
  - severity: low
    issue: Liên kết trong cụm “mở một tiệc lớn thết đãi”
    rationale: Thêm “để” làm rõ quan hệ mục đích và tạo câu tiếng Việt tự nhiên, không thay đổi ý nghĩa của αὐτῷ.
