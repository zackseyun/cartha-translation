source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: vi
  text: Lê-vi mở một tiệc lớn để thết đãi Ngài tại nhà mình. Có rất đông người thu thuế và những người khác đang ngả mình dùng bữa cùng họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Ngả mình dùng bữa” nói đến tư thế thường thấy khi dự những bữa ăn trang trọng trong thế giới Địa Trung Hải thời cổ: khách nằm nghiêng hoặc tựa mình bên bàn ăn.'
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: một tiệc lớn
  rationale: Danh từ δοχή chỉ một bữa tiệc hoặc cuộc khoản đãi; “một tiệc lớn” tự nhiên, trang trọng vừa phải và giữ được quy mô do μεγάλην diễn đạt.
- source_word: αὐτῷ
  choice: thết đãi Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus trong văn cảnh. Cách diễn đạt này giữ đại từ của nguyên văn và làm rõ quan hệ giữa việc mở tiệc với vị khách được khoản đãi.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: tại nhà mình
  rationale: Đại từ phản thân tiếng Việt xác định ngôi nhà thuộc về Lê-vi, phù hợp cú pháp và tránh cảm giác mơ hồ không cần thiết.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: đông đảo những người thu thuế
  rationale: Diễn đạt số lượng lớn của nhóm người thu thuế bằng tiếng Việt hiện đại, đồng thời tránh từ “đám đông” vốn có thể gợi cảnh tụ tập hơn là khách dự tiệc.
- source_word: ἄλλων
  choice: những người khác
  rationale: Giữ tính không xác định của nguyên văn, không suy đoán căn tính hay địa vị của những khách khác.
- source_word: μετ’ αὐτῶν
  choice: cùng họ
  rationale: Giữ nguyên đại từ số nhiều αὐτῶν và sự mơ hồ thật sự về phạm vi quy chiếu, thay vì âm thầm đổi thành số ít.
- source_word: κατακείμενοι
  choice: đang ngả mình dùng bữa
  rationale: Động từ diễn tả tư thế nằm/ngả người tại bàn ăn theo phong tục cổ. Cụm này vừa truyền đạt tư thế vừa làm rõ bối cảnh dùng bữa.
theological_decisions:
- issue: Đối tượng quy chiếu của μετ’ αὐτῶν
  choice: cùng họ
  alternative: cùng Ngài
  rationale: Bản Hy Lạp dùng đại từ số nhiều “họ”; bản dịch giữ nguyên hình thức ấy. Không đổi thành số ít dù Đức Chúa Jêsus là trung tâm của bữa tiệc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Jêsus theo mạch văn; “ngả mình dùng bữa” bảo tồn chi tiết văn hóa mà không dùng lối nói cổ khó hiểu.
