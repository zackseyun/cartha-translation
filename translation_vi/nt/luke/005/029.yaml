  to: Lê-vi mở một tiệc lớn để thết đãi Ngài tại nhà mình. Có rất đông người thu thuế và những người khác đang ngả mình dùng bữa cùng họ.[a]
  rationale: Chỉnh sửa chỉ nhằm làm câu tiếng Việt hiện đại tự nhiên hơn. Bản sửa vẫn giữ “Ngài” cho αὐτῷ, “tại nhà mình” cho ἐν τῇ οἰκίᾳ αὐτοῦ, tính không xác định của “những người khác,” và đại từ số nhiều “cùng họ” cho μετ’ αὐτῶν. Chú thích được giữ nguyên nội dung và neo tại cụm được giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: Lê-vi tổ chức một bữa tiệc lớn cho Đức Chúa Jêsus tại nhà mình; có nhiều người thu thuế và những người khác cùng ngả mình dùng bữa. “Cùng họ” giữ được đại từ số nhiều μετ’ αὐτῶν và không áp đặt một cách giải thích về tiền ngữ của đại từ.'
  naturalness: Cụm “Có đông đảo những người thu thuế” chưa tự nhiên trong tiếng Việt hiện đại. “Có rất đông người thu thuế và những người khác” mạch lạc, thành ngữ hơn, mà vẫn diễn đạt ὄχλος πολύς. “Mở một tiệc lớn” cũng cần thêm “để” trước “thết đãi” để câu trôi chảy hơn.
  terminology: “Lê-vi,” “Ngài,” “người thu thuế,” và “ngả mình dùng bữa” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích văn hóa giải thích đúng tư thế κατακείμενοι, không đưa thêm diễn giải thần học.
  issues:
