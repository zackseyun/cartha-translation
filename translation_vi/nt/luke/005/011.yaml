source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: vi
  text: Sau khi đưa các thuyền vào bờ[a], họ bỏ lại tất cả[b] và đi theo Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đưa các thuyền lên đất liền.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “bỏ lại mọi sự.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: Khi đưa
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. “Khi đưa” thể hiện tự nhiên trình tự hành động trong tiếng Việt mà không làm câu nặng nề.
- source_word: τὰ πλοῖα
  choice: các thuyền
  rationale: Trong bối cảnh đánh cá trên hồ Ga-li-lê, “thuyền” là từ tự nhiên và chính xác hơn “tàu”.
- source_word: ἐπὶ τὴν γῆν
  choice: vào bờ
  rationale: Cụm từ có nghĩa đen là “lên đất liền”; “vào bờ” là cách nói tự nhiên trong tiếng Việt khi đưa thuyền từ mặt nước lên hoặc sát đất liền.
- source_word: ἀφέντες
  choice: họ bỏ lại
  rationale: Ở đây ἀφίημι mang nghĩa rời bỏ hoặc để lại. Chuyển phân từ thành động từ hữu hạn phối hợp giúp câu tiếng Việt rõ ràng, đồng thời giữ đúng chuỗi hành động.
- source_word: πάντα
  choice: tất cả
  rationale: Dạng trung tính số nhiều có ý nghĩa bao quát. “Tất cả” giữ nguyên sức nặng của sự từ bỏ toàn diện mà không xác định thêm họ đã bỏ những gì.
- source_word: ἠκολούθησαν αὐτῷ
  choice: đi theo Ngài
  rationale: ἀκολουθέω vừa chỉ hành động đi theo vừa gợi ý nghĩa làm môn đồ. “Đi theo Ngài” giữ được cả ý nghĩa kể chuyện lẫn hàm ý môn đồ mà không giải thích quá mức.
theological_decisions:
- issue: Phạm vi của sự từ bỏ trong πάντα
  choice: họ bỏ lại tất cả
  alternative: họ bỏ lại mọi sự
  rationale: Bản văn diễn tả sự từ bỏ bao quát để đáp lại lời kêu gọi của Chúa Giê-su. “Tất cả” giữ nguyên tính toàn diện nhưng không suy diễn rằng đây nhất thiết là sự từ bỏ quyền sở hữu vĩnh viễn.
translation_notes:
  register: Bản dịch dùng tiếng Việt phổ thông, hiện đại và trang trọng. “Ngài” là đại từ tôn kính tự nhiên để chỉ Chúa Giê-su trong văn mạch, còn “đi theo” tránh giải nghĩa quá mức hàm ý làm môn đồ.
