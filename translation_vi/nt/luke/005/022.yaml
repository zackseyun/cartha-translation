revisions:
- from: 'Nhưng Đức Giê-su biết những suy tính của họ, nên đáp lời họ: “Tại sao các ông lại suy tính trong lòng như vậy?”'
  to: 'Nhưng Đức Giê-su biết những suy tính của họ, liền đáp lời họ rằng: “Tại sao các ông suy tính trong lòng?”'
  rationale: Loại bỏ các yếu tố thêm nghĩa (“nên”, “như vậy”), đồng thời giữ cách diễn đạt tự nhiên, trang trọng và sát nội dung của ἐπιγνούς, διαλογισμούς/διαλογίζεσθε, và ἐν ταῖς καρδίαις ὑμῶν.
