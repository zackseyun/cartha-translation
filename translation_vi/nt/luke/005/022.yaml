  timestamp: '2026-07-16T09:02:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: Đức Giê-su nhận biết những suy tính nội tâm của họ và chất vấn họ. Tuy nhiên, “nên” tạo quan hệ nguyên nhân-kết quả không được δέ hay phân từ ἀποκριθείς nêu rõ, còn “như vậy” thêm một quy chiếu không có trong nguyên văn. Bản sửa giữ trình tự và sắc thái tường thuật của tiếng Hy Lạp sát hơn.'
  naturalness: “Suy tính trong lòng” là tiếng Việt hiện đại, tự nhiên trong văn phong Kinh Thánh và bảo toàn thành ngữ καρδία. “Liền đáp lời họ rằng” lưu loát, tránh lối dịch quá cơ học của ἀποκριθεὶς εἶπεν mà vẫn diễn đạt hành động đáp lại.
  terminology: Giữ “Đức Giê-su” nhất quán. “Suy tính” thích hợp cho cả διαλογισμοί và διαλογίζεσθε, biểu đạt sự cân nhắc/lập luận thầm kín hơn là chỉ các ý nghĩ rời rạc. Không cần chú thích; cách dịch không khẳng định cơ chế Đức Giê-su biết điều họ suy tính.
  issues:
  - severity: medium
    issue: “nên” thêm quan hệ nhân quả.
    rationale: Nguyên văn có δέ và phân từ ἀποκριθείς, cho biết diễn tiến/chuyển ý khi Đức Giê-su đáp lại; không nói rõ rằng việc Ngài đáp lời là hệ quả được đánh dấu bởi “nên” của việc Ngài biết.
  - severity: low
    issue: “như vậy” thêm yếu tố quy chiếu không hiện diện trong nguyên văn.
    rationale: Câu Hy Lạp chỉ hỏi vì sao họ đang suy tính trong lòng; không có từ tương ứng với “như vậy”.
  revised_text: 'Nhưng Đức Giê-su biết những suy tính của họ, liền đáp lời họ rằng: “Tại sao các ông suy tính trong lòng?”'
