  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su biết những suy tính của họ, liền đáp lời họ rằng: “Tại sao các ông suy tính trong lòng?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: biết
  rationale: Phân từ aorist của ἐπιγινώσκω diễn tả việc Đức Giê-su nhận biết rõ những suy tính của họ. “Biết” tự nhiên trong tiếng Việt và không thêm lời giải thích về cách Ngài biết.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một chuyển ý nhẹ, có sắc thái tương phản với những phản ứng thầm kín ở câu trước; “Nhưng” phù hợp với diễn tiến tường thuật.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: những suy tính của họ
  rationale: Danh từ διαλογισμός ở đây chỉ các lập luận hoặc cân nhắc diễn ra bên trong. “Những suy tính” giữ được sắc thái chủ động hơn “ý nghĩ” và liên kết tự nhiên với động từ cùng gốc ở vế sau.
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: nên đáp lời họ
  rationale: Cụm Hy Lạp theo lối kể chuyện Semit dùng cả “đáp” và “nói”. Tiếng Việt tự nhiên có thể cô đọng thành “đáp lời họ” mà vẫn truyền đạt đầy đủ hành động hồi đáp.
- source_word: Τί
  choice: Tại sao
  rationale: Dù nghĩa hình thức là “gì”, trong cấu trúc này τί hỏi lý do của việc suy tính, nên “Tại sao” là cách diễn đạt tự nhiên và chính xác theo ngữ cảnh.
- source_word: διαλογίζεσθε
  choice: lại suy tính
  rationale: Động từ hiện tại diễn tả tiến trình cân nhắc hoặc lập luận đang diễn ra bên trong. “Suy tính” giữ được sắc thái cân nhắc chủ động; “lại” biểu thị sự chất vấn tự nhiên trong tiếng Việt.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng như vậy
  rationale: “Trong lòng” bảo tồn thành ngữ Kinh Thánh về con người nội tâm, bao gồm tư tưởng và ý chí. “Như vậy” quy chiếu tự nhiên đến nội dung suy tính đã nêu mà không thêm nội dung mới.
theological_decisions:
- issue: Bản chất sự hiểu biết của Đức Giê-su về suy nghĩ bên trong của người khác
  choice: Diễn đạt thẳng rằng Đức Giê-su biết những suy tính của họ, không giải thích Ngài biết bằng cách nào.
  alternative: Nói rõ đây là sự biết siêu nhiên, hoặc giảm nhẹ thành Ngài chỉ đoán ra điều họ nghĩ.
  rationale: Câu này khẳng định Đức Giê-su nhận biết sự suy tính bên trong của họ nhưng không nêu cơ chế. Bản dịch giữ nguyên sự căng thẳng thần học ấy, không thêm cũng không giảm ý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “các ông” phù hợp bối cảnh Đức Giê-su nói với các kinh sư và người Pha-ri-si. Không cần chú thích vì các sắc thái từ vựng chính có thể được thể hiện rõ trong chính văn.
