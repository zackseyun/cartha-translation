  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: vi
  text: Đức Giê-su bước vào một trong những chiếc thuyền, là thuyền của Si-môn, rồi xin ông đưa thuyền ra khỏi bờ một chút.[a] Ngài ngồi xuống và từ trên thuyền giảng dạy dân chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ra khỏi đất liền một chút.” Nguyên văn nói “từ đất liền,” đối lập chiếc thuyền với phần đất khô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: bước vào
  rationale: Phân từ bất định của ἐμβαίνω diễn tả việc Đức Giê-su vào thuyền trước hành động chính; “bước vào” tự nhiên và giữ được chuyển động cụ thể.
- source_word: πλοίων / πλοίου
  choice: những chiếc thuyền / thuyền
  rationale: πλοῖον trong bối cảnh hồ chỉ thuyền đánh cá; bản dịch giữ số nhiều và số ít tương ứng với nguyên văn.
- source_word: ὃ ἦν Σίμωνος
  choice: là thuyền của Si-môn
  rationale: Sở hữu cách Σίμωνος biểu thị quyền sở hữu; cách diễn đạt này rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἠρώτησεν
  choice: xin
  rationale: ἐρωτάω ở đây là đưa ra một lời yêu cầu; “xin” phù hợp với việc Đức Giê-su nhờ Si-môn thực hiện hành động.
- source_word: ἐπαναγαγεῖν
  choice: chèo ra
  rationale: Trong ngữ cảnh thuyền bè, ἐπανάγω có nghĩa đưa thuyền ra khỏi bờ; “chèo ra” là cách nói tự nhiên trong bối cảnh thuyền đánh cá, dù động từ Hy Lạp không nêu riêng phương thức di chuyển.
- source_word: ἀπὸ τῆς γῆς
  choice: xa bờ
  rationale: γῆ theo nghĩa đen là đất hoặc đất liền, nhưng trong bối cảnh này chỉ bờ đối lập với thuyền trên nước; “xa bờ” kết hợp tự nhiên với động từ chuyển động.
- source_word: ὀλίγον
  choice: một chút
  rationale: Dạng đối cách dùng như trạng từ chỉ một khoảng cách nhỏ; “một chút” ngắn gọn và tự nhiên.
- source_word: καθίσας
  choice: Ngài ngồi xuống
  rationale: Phân từ bất định diễn tả hành động xảy ra trước việc giảng dạy; tách thành mệnh đề hữu hạn làm câu tiếng Việt rõ ràng.
- source_word: ἐκ τοῦ πλοίου
  choice: từ trên thuyền
  rationale: ἐκ ở đây xác định vị trí từ đó Đức Giê-su giảng dạy; “từ trên thuyền” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐδίδασκεν
  choice: giảng dạy
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn. Tiếng Việt không bắt buộc đánh dấu thể tiếp diễn; trong mạch kể, “giảng dạy” truyền đạt hoạt động kéo dài mà không làm câu nặng nề.
- source_word: τοὺς ὄχλους
  choice: dân chúng
  rationale: ὄχλοι là số nhiều, chỉ những đám đông tụ họp. “Dân chúng” tự nhiên trong tiếng Việt và có thể chỉ tập thể đông người mà không cần cách nói gượng “các đám đông”.
theological_decisions:
- issue: Cách gọi Đức Giê-su bằng đại từ trong lời kể
  choice: Ngài
  alternative: ông / Đức Giê-su
  rationale: “Ngài” là đại từ kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt và tránh sự suồng sã; lựa chọn này không thêm một khẳng định thần học ngoài ngữ cảnh.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu được điều chỉnh cho tự nhiên trong tiếng Việt, đồng thời giữ thứ tự các hành động: bước vào thuyền, xin đưa thuyền ra, ngồi xuống và giảng dạy.'
