revisions:
- from: Bấy giờ, Đức Giê-su bước vào một trong những chiếc thuyền, là thuyền của Si-môn, rồi xin ông chèo ra xa bờ một chút.[a] Ngài ngồi xuống và từ trên thuyền giảng dạy dân chúng.
  to: Đức Giê-su bước vào một trong những chiếc thuyền, là thuyền của Si-môn, rồi xin ông đưa thuyền ra khỏi bờ một chút.[a] Ngài ngồi xuống và từ trên thuyền giảng dạy dân chúng.
  rationale: Bỏ “Bấy giờ” vì δέ chủ yếu nối mạch câu chuyện, không nhất thiết xác định thời điểm. Đổi “chèo ra” thành “đưa thuyền ra khỏi bờ” để phản ánh ἐπαναγαγεῖν mà không thêm phương thức di chuyển. Chú thích được chỉnh để nêu rõ lựa chọn “bờ” theo ngữ cảnh so với nghĩa từ vựng “đất liền.”
