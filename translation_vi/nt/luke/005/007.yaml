  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: vi
  text: Họ ra hiệu[a] cho những người cùng làm nghề ở chiếc thuyền kia đến giúp họ. Những người ấy đến và chất đầy cả hai thuyền, đến nỗi cả hai thuyền bắt đầu chìm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ra dấu” hoặc “vẫy gọi.”
    reason: lexical_alternative
  - marker: b
    text: Hay “đến nỗi cả hai thuyền đang chìm dần.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: ra hiệu
  rationale: Động từ chỉ việc dùng dấu hiệu hoặc cử chỉ, có lẽ từ xa trên mặt nước; “ra hiệu” tự nhiên và không xác định quá mức loại cử chỉ.
- source_word: μετόχοις
  choice: những người bạn cùng làm
  rationale: Trong bối cảnh đánh cá, từ này chỉ những người cùng tham gia công việc, có thể là cộng sự kinh doanh; cách dịch này rõ nghĩa với độc giả phổ thông mà không thu hẹp thành một cơ cấu pháp lý cụ thể.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: ở chiếc thuyền kia
  rationale: ἕτερος phân biệt chiếc thuyền còn lại trong cảnh truyện; “chiếc thuyền kia” tự nhiên trong tiếng Việt.
- source_word: τοῦ ἐλθόντας
  choice: đến
  rationale: Cấu trúc nguyên mẫu có mạo từ diễn tả mục đích; kết hợp “đến giúp” truyền đạt gọn và tự nhiên.
- source_word: συλλαβέσθαι αὐτοῖς
  choice: giúp mình
  rationale: Ở đây συλλαμβάνω mang nghĩa cùng góp sức trợ giúp, phù hợp với việc xử lý mẻ cá quá lớn.
- source_word: ἔπλησαν
  choice: chất đầy
  rationale: “Chất đầy” giữ hình ảnh hai thuyền được làm cho đầy, đồng thời hợp tự nhiên với cá được đưa lên thuyền.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: cả hai thuyền
  rationale: Diễn đạt trực tiếp ý nghĩa của ἀμφότερα và tự nhiên trong tiếng Việt.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: đến nỗi thuyền bắt đầu chìm
  rationale: Diễn tả kết quả đang phát triển của nguyên mẫu hiện tại βυθίζεσθαι, không hàm ý hai thuyền đã chìm hẳn.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “những người bạn cùng làm” để truyền đạt quan hệ thực tiễn trong nghề đánh cá; tránh từ quá hành chính hoặc mang sắc thái hệ phái. Đại từ “mình” quy chiếu về nhóm đã ra hiệu, còn “những người ấy” giúp phân biệt nhóm ở thuyền kia.
