revisions:
- from: Vì thế, họ ra hiệu cho những người bạn cùng làm ở chiếc thuyền kia đến giúp mình[a]. Những người ấy đến, và họ chất đầy cả hai thuyền, đến nỗi thuyền bắt đầu chìm[b].
  to: Họ ra hiệu[a] cho những người cùng làm nghề ở chiếc thuyền kia đến giúp họ. Những người ấy đến và chất đầy cả hai thuyền, đến nỗi cả hai thuyền bắt đầu chìm[b].
  rationale: Bản sửa loại bỏ sắc thái hệ quả không bắt buộc của liên từ đầu câu, thay cách gọi quan hệ συνεργ tác bằng tiếng Việt tự nhiên hơn, và sửa sự không nhất quán số ít/số nhiều ở mệnh đề kết quả. Các lựa chọn vẫn giữ hình ảnh và tiến trình kết quả của nguyên mẫu hiện tại βυθίζεσθαι, không nói rằng thuyền đã chìm hẳn.
