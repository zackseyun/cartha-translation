    issue: “Vì thế” thêm sắc thái suy luận/hệ quả cho καὶ.
    rationale: Trong nguyên văn, καὶ chủ yếu tiếp nối câu chuyện. “Họ” hoặc “Và họ” giữ liên kết tường thuật mà không diễn giải thêm.
  - severity: medium
    issue: “đến nỗi thuyền bắt đầu chìm” dùng danh từ số ít sau khi nói “cả hai thuyền.”
    rationale: αὐτά quy chiếu rõ đến ἀμφότερα τὰ πλοῖα. Cần nêu số nhiều, tốt nhất là “cả hai thuyền bắt đầu chìm.”
  - severity: low
    issue: “những người bạn cùng làm” không tự nhiên và có thể làm mờ quan hệ cộng tác nghề nghiệp của μετόχοις.
    rationale: “Những người cùng làm nghề” diễn đạt tự nhiên quan hệ hợp tác trong bối cảnh đánh cá, không hàm ý họ chỉ là bạn bè.
