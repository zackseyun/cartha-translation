  source_fidelity: Bản dịch truyền đạt đúng công thức tường thuật ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς là lời đáp hướng đến họ. Đối lập giữa οἱ ὑγιαίνοντες (“người khỏe mạnh”) và οἱ κακῶς ἔχοντες (thành ngữ chỉ người đau bệnh) được giữ nguyên; “không cần thầy thuốc ... thì cần” phản ánh chính xác ý của câu.
  naturalness: “Đức Giê-su đáp lời họ” và cấu trúc đối lập “Người khỏe mạnh không cần..., nhưng người đau ốm thì cần” tự nhiên, rõ ràng, và phù hợp văn phong Việt hiện đại trang trọng vừa phải. Việc nêu rõ “thì cần” ở vế sau giúp câu tiếng Việt trọn ý mà không thêm nghĩa.
  terminology: “Đức Giê-su” nhất quán với cách gọi tôn kính thông dụng; “thầy thuốc” là lựa chọn dễ hiểu, phù hợp bối cảnh cổ và sắc thái châm ngôn. “Đau ốm” truyền đạt đúng thành ngữ κακῶς ἔχειν mà không diễn dịch quá mức.
