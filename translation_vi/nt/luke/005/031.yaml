  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: vi
  text: 'Đức Giê-su đáp lời họ: “Người khỏe mạnh không cần thầy thuốc, nhưng người đau ốm thì cần.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: đáp lời họ
  rationale: Cụm phân từ đi với động từ nói là một công thức kể chuyện, diễn tả lời đáp. “Đáp lời họ” tự nhiên trong tiếng Việt, đồng thời giữ rõ đối tượng αὐτούς.
- source_word: οἱ ὑγιαίνοντες
  choice: người khỏe mạnh
  rationale: Phân từ được danh từ hóa chỉ những người đang ở tình trạng khỏe mạnh; cách dịch này rõ ràng và tự nhiên.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: không cần
  rationale: Diễn đạt tự nhiên cấu trúc Hy Lạp nghĩa đen là “không có nhu cầu”, không làm thay đổi ý nghĩa.
- source_word: ἰατροῦ
  choice: thầy thuốc
  rationale: “Thầy thuốc” là cách gọi trang trọng, dễ hiểu đối với người Việt hiện đại và phù hợp với sắc thái câu tục ngữ hơn “bác sĩ” trong bối cảnh cổ đại.
- source_word: οἱ κακῶς ἔχοντες
  choice: người đau ốm
  rationale: κακῶς ἔχειν, nghĩa đen là “ở trong tình trạng tồi tệ”, là thành ngữ chỉ tình trạng đau bệnh. “Đau ốm” truyền đạt đúng nghĩa thành ngữ và đối lập tự nhiên với “khỏe mạnh”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hình thức đối lập mang tính châm ngôn của nguyên văn; thêm “thì cần” ở vế sau để hoàn chỉnh tự nhiên phần tỉnh lược trong tiếng Việt.
