  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của tiếng Hy Lạp: Si-môn trả lời; cách xưng hô Ἐπιστάτα được chuyển tự nhiên là “Thưa Thầy”; nỗ lực vất vả trọn đêm nhưng không bắt được gì; và quyết định cá nhân “tôi sẽ” thả lưới dựa trên lời của Thầy. “Lưới” là danh từ không đánh dấu số tự nhiên trong tiếng Việt và không làm mất nghĩa số nhiều trong ngữ cảnh đánh cá.'
