id: LUK.5.5
reference: Luke 5:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: vi
  text: 'Si-môn đáp: “Thưa Thầy, chúng tôi đã vất vả suốt đêm mà không bắt được gì; nhưng theo lời Thầy, tôi sẽ thả lưới xuống.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp
  rationale: Cụm phân từ kèm động từ nói là lối dẫn lời quen thuộc trong tiếng Hy Lạp; tiếng Việt tự nhiên chỉ cần dùng động từ hữu hạn “đáp”.
- source_word: Ἐπιστάτα
  choice: Thưa Thầy
  rationale: Danh xưng này trong Lu-ca nhìn nhận thẩm quyền của Đức Chúa Jêsus nhưng không đồng nhất với κύριος. “Thưa Thầy” vừa tự nhiên, kính trọng, vừa không đưa thêm hàm ý thần học của “Chúa”.
- source_word: δι’ ὅλης νυκτός
  choice: suốt đêm
  rationale: Diễn đạt tự nhiên khoảng thời gian kéo dài trọn đêm.
- source_word: κοπιάσαντες
  choice: đã vất vả
  rationale: Giữ được sắc thái lao nhọc, gắng sức của động từ mà vẫn thông dụng trong tiếng Việt hiện đại.
- source_word: οὐδὲν ἐλάβομεν
  choice: không bắt được gì
  rationale: Trong ngữ cảnh đánh cá, λαμβάνω mang nghĩa bắt được; cách dịch này tự nhiên mà không cần thêm danh từ “cá” vốn chỉ được hàm ý.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: nhưng theo lời Thầy
  rationale: ἐπί với cách dữ liệu ở đây nêu lời của Đức Chúa Jêsus làm căn cứ cho hành động. “Theo lời Thầy” giữ được quan hệ ấy và tự nhiên hơn lối dịch sát chữ.
- source_word: χαλάσω
  choice: tôi sẽ thả ... xuống
  rationale: Diễn tả hành động hạ lưới xuống nước; “thả ... xuống” phù hợp ngữ cảnh đánh cá.
- source_word: τὰ δίκτυα
  choice: lưới
  rationale: Tiếng Hy Lạp dùng số nhiều, nhưng tiếng Việt thường dùng danh từ khối “lưới” không đánh dấu số trong ngữ cảnh này; dịch “những tấm lưới” sẽ kém tự nhiên.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện sự tương phản nhẹ giữa một đêm lao nhọc không kết quả và quyết định làm theo lời Thầy.
theological_decisions:
- issue: Cách dịch danh xưng Ἐπιστάτα dành cho Đức Chúa Jêsus
  choice: Thưa Thầy
  alternative: Lạy Chúa
  rationale: Bản nguồn dùng ἐπιστάτης chứ không dùng κύριος. “Thưa Thầy” bảo toàn sự nhìn nhận thẩm quyền trong tiến trình tường thuật mà không đưa hàm ý Kitô học rộng hơn của “Chúa” vào danh xưng này.
- issue: Quan hệ ý nghĩa trong ἐπὶ τῷ ῥήματί σου
  choice: theo lời Thầy
  alternative: vì lời Thầy / dựa vào lời Thầy
  rationale: Cấu trúc có thể nhấn mạnh cơ sở hoặc lý do của hành động. “Theo lời Thầy” giữ sự thuận phục rõ ràng mà không xác định quá mức giữa các sắc thái gần nhau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Thưa Thầy” trong lời thoại để biểu đạt sự kính trọng; giữ sự chuyển đổi từ “chúng tôi” (công việc cả nhóm trong đêm) sang “tôi” (quyết định của Si-môn) đúng với nguồn Hy Lạp.
