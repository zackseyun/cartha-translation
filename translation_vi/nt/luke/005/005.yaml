  terminology: “Thưa Thầy” truyền đạt sự kính trọng và thẩm quyền của Ἐπιστάτα mà không thay thế bằng danh xưng “Chúa” vốn không có trong bản nguồn. “Vất vả,” “bắt được gì,” và “thả lưới xuống” phù hợp ngữ cảnh đánh cá và tiếng Việt chuẩn hiện đại.
