revisions:
- from: Nhưng rồi sẽ đến những ngày mà chàng rể bị đem đi khỏi họ; bấy giờ, trong những ngày ấy, họ sẽ kiêng ăn.
  to: Nhưng sẽ đến những ngày, và khi chàng rể bị đem đi khỏi họ, thì trong những ngày ấy họ sẽ kiêng ăn.
  rationale: Chỉnh cấu trúc câu để phản ánh rõ «nhưng/ngày sẽ đến, và khi... thì...», đồng thời giữ nguyên thể bị động có sắc thái bị đem đi, phép lặp «những ngày», và ý nghĩa của hành vi kiêng ăn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:58Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được hình ảnh «chàng rể», thể bị động và ý bị tách khỏi những người đi theo, cũng như sự lặp lại của «những ngày». Tuy nhiên, cấu trúc «sẽ đến những ngày mà...» gộp ὅταν vào mệnh đề quan hệ và làm mờ liên từ καί cùng trình tự «ngày sẽ đến, và khi... thì...».
  naturalness: Câu hiện tại dễ hiểu, nhưng cách đặt «bấy giờ, trong những ngày ấy» hơi ngắt quãng. Cấu trúc «và khi ... thì trong những ngày ấy...» vừa tự nhiên trong văn phong Kinh Thánh hiện đại vừa phản ánh sát trình tự nguyên ngữ.
  terminology: «Chàng rể» phù hợp với νυμφίος; «bị đem đi khỏi họ» bảo toàn sắc thái bị động, không biến thành tự ý ra đi. «Kiêng ăn» là cách dùng có thể chấp nhận để chỉ việc nhịn ăn tôn giáo trong ngữ cảnh này.
  issues:
  - severity: low
    issue: Cấu trúc thời gian «những ngày mà...» làm mờ liên từ καί và ὅταν.
    rationale: Nguyên văn nêu trước «sẽ đến những ngày», rồi thêm «và khi chàng rể bị đem đi...». Nên giữ hai bước này để bảo toàn nhịp và liên hệ thời gian của câu.
  - severity: low
    issue: Vị trí của «bấy giờ» và «trong những ngày ấy» chưa tối ưu.
    rationale: Đặt «thì» trước mệnh đề kết quả và để «trong những ngày ấy» sát với hành động kiêng ăn cho câu Việt trôi chảy hơn, không đổi nghĩa.
  revised_text: Nhưng sẽ đến những ngày, và khi chàng rể bị đem đi khỏi họ, thì trong những ngày ấy họ sẽ kiêng ăn.
