source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: vi
  text: Nhưng sẽ đến những ngày, và khi chàng rể bị đem đi khỏi họ, thì trong những ngày ấy họ sẽ kiêng ăn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Nhưng rồi sẽ đến những ngày
  rationale: Giữ hình ảnh thời gian của thành ngữ Hy Lạp, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt; “nhưng” thể hiện sự tương phản nhẹ với hoàn cảnh hiện tại.
- source_word: ὅταν
  choice: mà ...
  rationale: Trong cấu trúc “sẽ đến những ngày mà...”, đại từ quan hệ “mà” diễn đạt tự nhiên thời điểm tương lai do ὅταν mở đầu, không biến ý này thành sự việc lặp lại.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: bị đem đi khỏi họ
  rationale: Giữ thể bị động và sắc thái bị tách khỏi họ, thay vì làm nhẹ thành việc chàng rể tự rời đi.
- source_word: ὁ νυμφίος
  choice: chàng rể
  rationale: Cách gọi thông dụng, chính xác và tự nhiên trong tiếng Việt cho người nam trong hình ảnh lễ cưới.
- source_word: τότε
  choice: bấy giờ
  rationale: Đánh dấu hệ quả theo thời gian sau khi chàng rể bị đem đi.
- source_word: νηστεύσουσιν
  choice: họ sẽ kiêng ăn
  rationale: “Kiêng ăn” diễn đạt hành vi nhịn ăn mang ý nghĩa tôn giáo trong văn cảnh, dễ hiểu đối với độc giả hiện đại.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Giữ nguyên sự lặp lại có chủ ý về “những ngày” trong bản Hy Lạp.
theological_decisions:
- issue: Có nên làm nhẹ thể bị động của ἀπαρθῇ thành việc chàng rể tự ra đi hay không
  choice: 'Giữ sắc thái bị động: “chàng rể bị đem đi khỏi họ”'
  alternative: “chàng rể rời khỏi họ”
  rationale: Bản Hy Lạp gợi ý chàng rể bị một tác nhân khác đem đi. Cách dịch này bảo toàn sắc thái đáng ngại và sự căng thẳng hàm ý mà không giải thích rõ đó là biến cố nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ đủ hai lần nhắc đến “những ngày” như nguyên văn, nhưng dùng dấu chấm phẩy để phân định hai vế dài cho sáng nghĩa.
