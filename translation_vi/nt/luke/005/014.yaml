  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố chính của câu Hy Lạp: mệnh lệnh không nói cho ai, đi trình diện thầy tế lễ, dâng lễ vật liên quan đến sự thanh sạch theo điều Môi-se truyền, và mục đích “làm chứng cho họ”. Cụm “cho họ” được giữ không xác định, phù hợp với tính mơ hồ của αὐτοῖς. Việc thêm “lễ vật” là sự làm rõ an toàn trong ngữ cảnh động từ προσένεγκε và nghi lễ Lê-vi Ký 14.'
