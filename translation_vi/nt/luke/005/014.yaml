id: LUK.5.14
reference: Luke 5:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: vi
  text: 'Người truyền cho anh: “Đừng nói với ai, nhưng hãy đi trình diện thầy tế lễ và dâng lễ vật cho việc thanh sạch của anh theo điều Môi-se đã truyền[b], để làm chứng cho họ.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này cũng có thể được hiểu là “để làm bằng chứng cho họ” hoặc “để làm bằng chứng chống lại họ”; “họ” có thể chỉ các thầy tế lễ hoặc những người khác.
    reason: alternative_reading
  - marker: b
    text: Xem Lê-vi Ký 14 về lễ vật Môi-se truyền phải dâng khi một người được thanh sạch khỏi bệnh phong hủi.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: truyền
  rationale: Diễn đạt mệnh lệnh có thẩm quyền, tự nhiên trong văn phong Kinh Thánh tiếng Việt mà không thêm sắc thái nghiêm khắc vốn không được nêu rõ trong động từ.
- source_word: μηδενὶ εἰπεῖν
  choice: Đừng nói với ai
  rationale: Cách diễn đạt tự nhiên và trực tiếp trong tiếng Việt, giữ nguyên lệnh cấm nói cho bất cứ ai.
- source_word: ἀπελθὼν
  choice: hãy đi
  rationale: Phân từ aorist chỉ hành động đi trước các mệnh lệnh tiếp theo; kết cấu “hãy đi trình diện” vừa tự nhiên vừa giữ được trình tự ấy.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: trình diện thầy tế lễ
  rationale: “Trình diện” chuyển đạt tự nhiên ý đến cho thầy tế lễ xem xét, còn số ít của τῷ ἱερεῖ được giữ nguyên.
- source_word: προσένεγκε
  choice: dâng lễ vật
  rationale: Trong bối cảnh nghi lễ, “dâng” thể hiện đúng hành động hiến dâng; thêm “lễ vật” để câu tiếng Việt rõ nghĩa, dù tân ngữ được hàm ý trong nguyên văn.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: cho việc thanh sạch của anh
  rationale: Giữ mối liên hệ giữa lễ vật và sự thanh sạch theo nghi lễ, đồng thời dùng ngôn ngữ dễ hiểu hơn “thanh tẩy” trong câu chính.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: theo điều Môi-se đã truyền
  rationale: Chuyển đạt trực tiếp việc tuân theo chỉ thị trong Luật Môi-se mà không thêm cách giải thích giáo phái.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: để làm chứng cho họ
  rationale: Giữ nguyên đại từ không xác định rõ đối tượng và không quyết định lời chứng mang ý nghĩa xác nhận hay chống lại họ.
theological_decisions:
- issue: Đối tượng và sắc thái của αὐτοῖς trong εἰς μαρτύριον αὐτοῖς
  choice: Giữ là “cho họ”, không xác định “họ” là ai và lời chứng có sắc thái thuận hay nghịch.
  alternative: “cho các thầy tế lễ”, “cho dân chúng”, hoặc “làm bằng chứng chống lại họ”
  rationale: Nguyên văn chỉ dùng đại từ số nhiều, không nêu rõ đối tượng; cụm từ cũng có thể mang ý nghĩa chứng nhận hoặc bằng chứng chống lại. Bản dịch giữ sự mơ hồ có thật của câu.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Lời truyền được đặt trong dấu ngoặc kép để chuyển tự nhiên từ động từ dẫn nhập sang các mệnh lệnh trực tiếp trong tiếng Hy Lạp. “Thầy tế lễ” giữ thuật ngữ quen thuộc và số ít của nguyên văn; các chú thích bảo toàn sự mơ hồ của cụm cuối câu.
