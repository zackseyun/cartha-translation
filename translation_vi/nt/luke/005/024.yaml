id: LUK.5.24
reference: Luke 5:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: vi
  text: 'Nhưng để các ông biết rằng Con Người có thẩm quyền trên đất để tha tội—Ngài phán với người bị bại liệt[a]: “Ta bảo anh, hãy trỗi dậy, nhấc tấm đệm[b] của anh lên và đi về nhà anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người bại liệt.”
    reason: Nêu cách diễn đạt ngắn gọn tương đương cho phân từ Hy Lạp được dùng như danh từ.
  - marker: b
    text: Cũng có thể dịch là “giường nhỏ” hoặc “chõng.” Từ Hy Lạp κλινίδιον chỉ một vật nhỏ dùng để nằm, có thể nhấc lên và mang đi.
    reason: Làm rõ phạm vi nghĩa của κλινίδιον và sự không chắc chắn về hình dạng chính xác của vật này.
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Nhưng để
  rationale: δέ đánh dấu sự chuyển ý nhẹ có sắc thái tương phản, còn ἵνα nêu mục đích; “Nhưng để” diễn đạt tự nhiên cả hai nét nghĩa.
- source_word: εἰδῆτε
  choice: các ông biết
  rationale: Động từ οἶδα chỉ sự biết hoặc nhận biết chắc chắn. Số nhiều được thể hiện qua “các ông,” phù hợp với những người đang chất vấn Chúa Giê-su trong văn cảnh.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ danh hiệu tự xưng của Chúa Giê-su và âm hưởng liên văn bản, đặc biệt với Đa-ni-ên 7, mà không diễn giải thu hẹp thành một nghĩa duy nhất.
- source_word: ἐξουσίαν ἔχει
  choice: có thẩm quyền
  rationale: ἐξουσία nhấn mạnh quyền chính đáng để hành động, không chỉ là năng lực hay sức mạnh.
- source_word: ἐπὶ τῆς γῆς
  choice: ở trên đất
  rationale: Cách dịch trực tiếp, giữ nguyên phạm vi không gian của lời khẳng định mà không khai triển theo hướng diễn giải.
- source_word: ἀφιέναι ἁμαρτίας
  choice: để tha tội
  rationale: Trong văn cảnh này, ἀφίημι mang nghĩa tha hoặc xóa tội; “tha tội” là cách nói rõ ràng và quen thuộc trong tiếng Việt.
- source_word: τῷ παραλελυμένῳ
  choice: với người bị bại liệt
  rationale: Phân từ hoàn thành được dùng như danh từ, chỉ người đang ở trong tình trạng bại liệt; cách diễn đạt này tự nhiên và tôn trọng nhân vị.
- source_word: Σοὶ λέγω
  choice: Ta bảo anh
  rationale: Đại từ Σοί đứng đầu tạo sự nhấn mạnh vào người được nói trực tiếp. “Ta bảo anh” vừa trang trọng vừa tự nhiên trong lời truyền lệnh.
- source_word: ἔγειρε
  choice: hãy trỗi dậy
  rationale: Mệnh lệnh kêu gọi hành động tức thời; “trỗi dậy” giữ sắc thái trang trọng và mạnh mẽ của câu.
- source_word: ἄρας
  choice: nhấc ... lên
  rationale: Phân từ αἴρω diễn tả việc nâng vật lên để mang đi; “nhấc ... lên” chuyển tải rõ hành động này.
- source_word: κλινίδιόν σου
  choice: tấm đệm của anh
  rationale: κλινίδιον chỉ một giường nhỏ, tấm đệm hoặc chõng; “tấm đệm” phù hợp với vật có thể nhấc và mang đi, đồng thời tránh hình dung về một chiếc giường lớn.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: đi về nhà mình
  rationale: πορεύου là mệnh lệnh di chuyển, còn εἰς chỉ đích đến; “đi về nhà mình” tự nhiên và chính xác trong tiếng Việt.
theological_decisions:
- issue: Cách dịch ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Con của loài người; Đấng thuộc về nhân loại
  rationale: “Con Người” giữ danh hiệu Cơ Đốc học đã được nhận biết và sự cộng hưởng với Đa-ni-ên 7, đồng thời không giải quyết thay độc giả tính đa nghĩa của cụm từ.
- issue: Sắc thái của ἐξουσία trong việc tha tội
  choice: thẩm quyền
  alternative: quyền năng
  rationale: Tranh luận trong văn cảnh liên quan đến quyền chính đáng để tha tội, không đơn thuần là khả năng làm phép lạ; “thẩm quyền” bảo toàn trọng tâm ấy.
- issue: Phạm vi của ἐπὶ τῆς γῆς
  choice: ở trên đất
  alternative: trong cõi trần
  rationale: Giữ cách nói cụ thể và mở của bản Hy Lạp, không thêm một cách giải thích về quan hệ giữa thẩm quyền trên trời và dưới đất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời dẫn và cặp xưng hô “Ta—anh” trong lời trực tiếp để giữ phẩm cách của lời Chúa Giê-su mà không quá cổ. Dấu gạch ngang bảo toàn sự ngắt cú pháp của nguyên văn, nơi câu nêu mục đích chuyển sang lời phán với người bị bại liệt.
