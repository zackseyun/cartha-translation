id: LUK.5.10
reference: Luke 5:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: vi
  text: 'Gia-cơ và Giăng, các con trai của Xê-bê-đê, là những người cùng làm ăn với Si-môn, cũng kinh ngạc như vậy. Đức Giê-su phán với Si-môn: “Đừng sợ. Từ nay, ông sẽ bắt người ta còn sống.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “ông sẽ bắt sống người ta.” Động từ Hy Lạp có nghĩa là bắt hoặc bắt sống, nghĩa là bắt mà không giết.'
    reason: lexical_alternative
  - marker: b
    text: So sánh Ma-thi-ơ 4:19 và Mác 1:17, nơi Đức Giê-su dùng cách diễn đạt “những người đánh lưới người.” Cách diễn đạt của Lu-ca ở đây khác với hai câu ấy.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: cũng kinh ngạc như vậy
  rationale: Cụm từ nối Gia-cơ và Giăng với phản ứng kinh ngạc đã nêu ở câu trước; bổ sung động từ theo ngữ cảnh để câu tiếng Việt tự nhiên mà không đổi ý.
- source_word: υἱοὺς Ζεβεδαίου
  choice: các con trai của Xê-bê-đê
  rationale: Giữ rõ quan hệ gia đình và dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: κοινωνοὶ
  choice: những người cùng làm ăn
  rationale: Trong bối cảnh nghề đánh cá, từ này chỉ những người hợp tác trong công việc, không chỉ là bạn đồng hành.
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ!
  rationale: Lời trấn an ngắn gọn, tự nhiên và đúng lực của mệnh lệnh phủ định trong tiếng Hy Lạp.
- source_word: ἀπὸ τοῦ νῦν
  choice: Từ nay
  rationale: Diễn đạt tự nhiên một bước ngoặt bắt đầu ngay từ thời điểm này.
- source_word: ἀνθρώπους
  choice: người ta
  rationale: Chỉ con người nói chung, không giới hạn ở nam giới.
- source_word: ζωγρῶν
  choice: thu phục người ta để họ được sống
  rationale: Tái hiện ý đặc thù của ζωγρέω là bắt hoặc thu phục mà để sống, đồng thời tránh gợi hình ảnh bắt người để giam giữ.
theological_decisions:
- issue: Ẩn dụ của ζωγρέω trong lời kêu gọi Si-môn
  choice: con sẽ thu phục người ta để họ được sống
  alternative: con sẽ bắt người ta còn sống; con sẽ trở thành tay đánh lưới người
  rationale: Lu-ca dùng ζωγρέω, khác với cách nói “những tay đánh lưới người” trong Ma-thi-ơ 4:19 và Mác 1:17. Bản dịch giữ sắc thái đem người vào sự sống và không đồng nhất hóa các câu song song.
- issue: Phạm vi giới tính của ἀνθρώπους
  choice: người ta
  alternative: đàn ông; loài người
  rationale: Danh từ ở đây nói đến con người nói chung, nên không nên giới hạn đối tượng vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và “phán” phù hợp lời trực tiếp của Chúa; dùng “con” trong lời Ngài nói với Si-môn để thể hiện quan hệ thầy-trò gần gũi. Các tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
