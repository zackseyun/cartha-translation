revisions:
- from: 'Gia-cơ và Giăng, các con trai của Xê-bê-đê, là những người cùng làm ăn với Si-môn, cũng kinh ngạc như vậy. Đức Giê-su phán với Si-môn: “Đừng sợ! Từ nay, con sẽ thu phục người ta để họ được sống.”[a][b]'
  to: 'Gia-cơ và Giăng, các con trai của Xê-bê-đê, là những người cùng làm ăn với Si-môn, cũng kinh ngạc như vậy. Đức Giê-su phán với Si-môn: “Đừng sợ. Từ nay, ông sẽ bắt người ta còn sống.”[a][b]'
  rationale: Bản sửa giữ sự tỉnh lược ở đầu câu bằng cách nêu rõ phản ứng đã được mô tả ở câu trước, và giữ κοινωνοί theo nghĩa cộng tác làm ăn. Cụm ζωγρῶν được dịch sát là “bắt người ta còn sống,” bảo toàn cả hình ảnh bắt giữ lẫn sắc thái “còn sống,” thay vì thêm ý rằng việc ấy được thực hiện nhằm đem họ vào sự sống. Chú thích được viết lại để giải thích nghĩa từ vựng và đối chiếu các câu song song mà không áp đặt diễn giải giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:33Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng phản ứng của Gia-cơ và Giăng theo phép tỉnh lược nối với câu trước, quan hệ cộng tác làm ăn với Si-môn, và lời trấn an. Tuy nhiên, “thu phục người ta để họ được sống” diễn giải thêm mục đích và sắc thái cứu sống mà động từ ζωγρέω không phát biểu trực tiếp. Từ này có nghĩa cơ bản là bắt/capture sống, và cần giữ hình ảnh ấy trong bản văn chính.
  naturalness: Câu đầu tự nhiên khi bổ sung “cũng kinh ngạc như vậy” từ ngữ cảnh trước. “Bắt người ta còn sống” hơi mạnh nhưng là cách nói Việt ngữ rõ ràng, trực tiếp giữ được sắc thái khác thường của nguyên ngữ; chú thích giúp giải thích mà không làm dịu hoặc thần học hóa bản văn.
  terminology: Giữ các tên Gia-cơ, Giăng, Xê-bê-đê, Si-môn và tước hiệu “Đức Giê-su” nhất quán. “Những người cùng làm ăn” diễn đạt phù hợp κοινωνοί trong bối cảnh nghề cá. Không nên dùng “con” trong lời trực tiếp, vì đại từ này thêm một quan hệ xưng hô không được nêu trong tiếng Hy Lạp; “ông” là cách xưng hô lịch sự, hiện đại và không thêm nội dung thần học.
  issues:
  - severity: medium
    issue: “thu phục người ta để họ được sống” diễn giải ζωγρῶν quá mức.
    rationale: ζωγρέω nhấn mạnh việc bắt hoặc bắt sống, không tự nó khẳng định mục đích “để họ được sống” hay một diễn giải cứu độ. Cách dịch này vừa làm mờ ẩn dụ bắt cá vừa thêm quan hệ mục đích không có trong câu.
  - severity: low
    issue: Các ký hiệu chú thích được đặt ở cuối cả lời nói thay vì ngay sau cụm được chú giải.
    rationale: Chú thích a và b đều liên quan trực tiếp đến “bắt người ta còn sống”; đặt neo tại cụm này giúp phạm vi chú thích rõ ràng hơn.
  - severity: low
    issue: Đại từ “con” thêm sắc thái quan hệ không được đánh dấu trong nguyên ngữ.
    rationale: Nguyên văn chỉ dùng ngôi thứ hai số ít. Dùng “ông” trong văn cảnh trang trọng giữ lời nói tự nhiên mà tránh áp đặt quan hệ xưng hô.
