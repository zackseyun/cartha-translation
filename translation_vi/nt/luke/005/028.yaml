  source_fidelity: 'Bản dịch truyền đạt đúng chuỗi hành động của καὶ καταλιπὼν πάντα ἀναστὰς ἠκολούθει αὐτῷ: ông bỏ lại tất cả, đứng dậy, và đi theo Chúa Giê-su. “Bỏ lại tất cả” giữ được tính bao quát của πάντα mà không suy diễn về tính vĩnh viễn; “đứng dậy” phù hợp với ἀναστὰς; và “đi theo” là cách dịch tự nhiên, đủ bao hàm sắc thái tiếp diễn/khởi đầu có thể có của thì chưa hoàn thành ἠκολούθει trong văn cảnh kể chuyện. Việc không mở đầu bằng “Và” là tự nhiên trong tiếng Việt và không làm mất quan hệ liên kết.'
