  terminology: “Bỏ lại,” “tất cả,” “đứng dậy,” và “đi theo” đều chính xác và không áp đặt diễn giải thần học. “Ngài” duy trì đại từ tôn kính mà vẫn giữ việc nguồn văn dùng đại từ thay vì lặp danh riêng.
