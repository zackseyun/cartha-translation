  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: vi
  text: Ông bỏ lại tất cả[a], đứng dậy và đi theo Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi bỏ lại tất cả, ông đứng dậy và đi theo Ngài.”'
    reason: Phản ánh sát hơn cấu trúc hai phân từ bất định quá khứ trước động từ chính, đồng thời giữ khả năng hiểu các hành động theo trình tự.
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối trực tiếp hành động này với lời kêu gọi ở câu trước; trong tiếng Việt, không nhất thiết phải mở câu bằng “và”, nhưng vẫn giữ quan hệ phối hợp trong chuỗi động từ.
- source_word: καταλιπὼν
  choice: bỏ lại
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hoặc gắn chặt với các hành động chính. “Bỏ lại” tự nhiên, thể hiện sự dứt khoát mà không cường điệu thành “từ bỏ vĩnh viễn”.
- source_word: πάντα
  choice: tất cả
  rationale: Đại từ/trạng từ hóa số nhiều trung tính có ý nghĩa bao quát. “Tất cả” giữ nguyên mức độ tuyệt đối của câu Hy Lạp nhưng không tự xác định cụ thể mọi thứ ông sở hữu.
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ của ἀνίστημι; trong văn cảnh kể chuyện, chỉ hành động đứng lên để đáp lại lời gọi.
- source_word: ἠκολούθει
  choice: đi theo
  rationale: Thì chưa hoàn thành của ἀκολουθέω có thể gợi hành động tiếp diễn, nhưng trong chuỗi kể chuyện này tiếng Việt tự nhiên dùng “đi theo”; cụm này vẫn có thể bao hàm việc bắt đầu và tiếp tục làm môn đồ mà không diễn giải quá mức.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su theo văn cảnh. “Ngài” là đại từ tôn kính thông dụng trong bản văn Kinh Thánh tiếng Việt, đồng thời không thay đại từ nguồn bằng danh riêng.
theological_decisions:
- issue: Phạm vi sự từ bỏ của Lê-vi khi đi theo Chúa Giê-su
  choice: Giữ lời khẳng định rằng ông bỏ lại “tất cả”, nhưng không nói thêm đó là sự từ bỏ vĩnh viễn mọi tài sản hay nghề nghiệp.
  alternative: Hiểu là ông chỉ tạm rời công việc, hoặc hiểu là ông vĩnh viễn từ bỏ toàn bộ tài sản.
  rationale: πάντα mang tính bao quát và nhấn mạnh sự đáp lời dứt khoát, nhưng câu này không giải thích cụ thể hệ quả lâu dài đối với tài sản hoặc nghề nghiệp của ông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” cho Lê-vi và “Ngài” cho Chúa Giê-su. Câu chính ưu tiên nhịp kể tự nhiên của tiếng Việt; chú thích bảo tồn cách thể hiện rõ hơn quan hệ trước-sau của các phân từ Hy Lạp.
