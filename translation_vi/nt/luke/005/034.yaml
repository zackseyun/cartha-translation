id: LUK.5.34
reference: Luke 5:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: vi
  text: 'Ngài nói với họ: “Các ông không thể bắt những người dự tiệc cưới[a] kiêng ăn trong lúc chú rể đang ở với họ, phải không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo nghĩa đen, “các con trai của phòng cưới”, một thành ngữ chỉ những người đi cùng chú rể hoặc những người dự tiệc cưới.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Các ông không thể… phải không?
  rationale: μή trong câu hỏi dùng với động từ ở thức chỉ định hướng người nghe đến câu trả lời phủ định. Cách diễn đạt này giữ rõ lực tu từ ấy trong tiếng Việt tự nhiên.
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: những người dự tiệc cưới
  rationale: Đây là một thành ngữ, theo nghĩa đen là “các con trai của phòng cưới”, chỉ những người cùng tham dự lễ cưới, đặc biệt là bạn hữu hoặc người tháp tùng chú rể. Bản dịch theo nghĩa giúp độc giả hiện đại hiểu đúng mà không biến hình ảnh thành một mô tả không gian khó hiểu.
- source_word: νυμφίος
  choice: chú rể
  rationale: “Chú rể” là cách gọi hiện đại, thông dụng và rõ nghĩa trong tiếng Việt, đồng thời giữ nguyên hình ảnh hôn lễ của nguyên văn.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: đang ở với họ
  rationale: Cụm từ diễn tả sự hiện diện của chú rể cùng những người dự tiệc; “đang ở với họ” trực tiếp và tự nhiên trong ngữ cảnh “trong lúc”.
- source_word: ποιῆσαι νηστεῦσαι
  choice: bắt… kiêng ăn
  rationale: ποιέω đi với động từ nguyên mẫu mang nghĩa khiến hoặc bắt ai làm điều gì. “Bắt… kiêng ăn” giữ được sắc thái gây khiến, thay vì chỉ nói những người dự tiệc có kiêng ăn hay không.
- source_word: νηστεῦσαι
  choice: kiêng ăn
  rationale: Trong ngữ cảnh tôn giáo, “kiêng ăn” diễn đạt hành vi nhịn ăn có chủ ý mà không gợi một chế độ ăn uống hay tập tục riêng của một hệ phái.
theological_decisions:
- issue: Hình ảnh ẩn dụ về Đức Giê-su như chú rể
  choice: Giữ nguyên hình ảnh “chú rể” mà không giải thích ý nghĩa thần học ngay trong câu.
  alternative: Diễn giải rõ rằng Đức Giê-su tự ví mình là chú rể.
  rationale: Nguyên văn hàm ý vai trò đặc biệt của Đức Giê-su qua hình ảnh này nhưng không giải thích trực tiếp. Giữ nguyên ẩn dụ giúp bảo toàn hàm ý và sức căng thần học mà không đưa phần chú giải vào bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” phù hợp với ngữ cảnh tường thuật về Đức Giê-su; “các ông” thể hiện lời Ngài nói với nhóm người đối thoại. Cấu trúc hỏi đuôi “phải không?” truyền đạt rõ câu hỏi tu từ chờ đợi câu trả lời phủ định.
