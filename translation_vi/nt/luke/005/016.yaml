translation:
  language: vi
  text: Nhưng Ngài thường lui vào những nơi hoang vắng và cầu nguyện[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát cấu trúc hơn: “Nhưng chính Ngài đang lui vào những nơi hoang vắng và cầu nguyện.” Tiếng Hy Lạp dùng động từ ở thời chưa hoàn thành với các phân từ hiện tại; trong ngữ cảnh, kết cấu này có thể diễn tả hành động đang tiếp diễn hoặc thói quen lặp lại.'
    reason: Nêu lựa chọn dịch sát cấu trúc và giải thích sắc thái thời-thể mà không làm mất tính mơ hồ giữa ý tiếp diễn và tập quán.
lexical_decisions:
- source_word: αὐτὸς
  choice: Ngài
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp và có sắc thái nhấn nhẹ. “Ngài” chỉ Đức Giê-su một cách tự nhiên, trang trọng; không thêm “chính” để tránh nhấn mạnh quá mức trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Liên từ đánh dấu sự tương phản nhẹ với bối cảnh: danh tiếng Đức Giê-su lan rộng, nhưng Ngài vẫn thường lui đi để cầu nguyện.'
- source_word: ἦν ὑποχωρῶν
  choice: thường lui
  rationale: Kết cấu vị quá khứ chưa hoàn thành với phân từ hiện tại diễn tả hành động tiếp diễn hoặc có tính tập quán. “Thường lui” truyền đạt tự nhiên việc này lặp lại trong quá khứ.
- source_word: ἐν ταῖς ἐρήμοις
  choice: vào những nơi hoang vắng
  rationale: Danh từ số nhiều chỉ những vùng không người ở hoặc thanh vắng. Với động từ “lui”, “vào” là cách diễn đạt tự nhiên trong tiếng Việt, còn “những nơi hoang vắng” giữ được ý số nhiều mà không giới hạn vào địa hình sa mạc.
- source_word: καὶ
  choice: và
  rationale: Liên kết đơn giản hai hành động có tính tập quán.
- source_word: προσευχόμενος
  choice: cầu nguyện
  rationale: Phân từ phối hợp với ὑποχωρῶν, mô tả hoạt động cầu nguyện đi cùng với việc lui vào nơi hoang vắng.
theological_decisions:
- issue: Tính chất thời thể của hành động Đức Giê-su
  choice: Câu này mô tả thói quen Đức Giê-su thường lui vào nơi hoang vắng để cầu nguyện.
  alternative: Câu này kể về một lần cụ thể Ngài lui đi và cầu nguyện.
  rationale: Kết cấu ἦν với các phân từ hiện tại tự nhiên nhất diễn tả hành động tiếp diễn hoặc lặp lại trong quá khứ. Từ “thường” giữ ý nghĩa ngữ pháp ấy mà không thêm suy luận giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, tự nhiên và trang trọng vừa phải. “Những nơi hoang vắng” dễ hiểu, không khiến người đọc nghĩ nhất thiết đến sa mạc; “thường lui” diễn đạt rõ thói quen được hàm ý bởi cấu trúc Hy Lạp.
