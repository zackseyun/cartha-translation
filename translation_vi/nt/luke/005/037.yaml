  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: vi
  text: Không ai đổ rượu mới vào những túi da cũ.[a] Nếu làm vậy, rượu mới sẽ làm nứt vỡ các túi da; rượu ấy sẽ đổ ra, còn các túi da sẽ hỏng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên ngữ nói đến những vật chứa bằng da dùng để đựng rượu.
    reason: lexical_clarification
lexical_decisions:
- source_word: βάλλει
  choice: đổ
  rationale: Động từ có nghĩa khái quát là đặt hoặc cho vào; với chất lỏng và vật chứa, “đổ ... vào” là cách diễn đạt tự nhiên trong tiếng Việt, dù cụ thể hơn đôi chút so với nguyên ngữ.
- source_word: οἶνον νέον
  choice: rượu mới
  rationale: Cách dịch trực tiếp, tự nhiên, giữ nguyên hình ảnh rượu đang trong giai đoạn có thể tiếp tục lên men.
- source_word: ἀσκοὺς παλαιούς
  choice: những túi da cũ
  rationale: ἀσκός là vật chứa bằng da dùng cho chất lỏng. “Túi da” rõ nghĩa trong tiếng Việt; ngữ cảnh đã cho biết chúng được dùng để đựng rượu.
- source_word: εἰ δὲ μήγε
  choice: Nếu làm vậy
  rationale: Thành ngữ điều kiện nêu hậu quả nếu người ta làm điều vừa bị phủ định. Cách diễn đạt này rõ và tự nhiên hơn lối dịch sát chữ “nếu không” vốn dễ gây hiểu nhầm trong tiếng Việt.
- source_word: ῥήξει
  choice: sẽ làm bục
  rationale: Động từ chỉ việc gây rách hoặc vỡ toạc. “Làm bục” diễn tả tự nhiên việc rượu mới khiến túi da cũ nứt vỡ.
- source_word: ἐκχυθήσεται
  choice: sẽ đổ ra
  rationale: Thể bị động mô tả rượu thoát và bị mất khi túi bục. Tiếng Việt thường dùng “đổ ra” tự nhiên hơn một cấu trúc bị động.
- source_word: ἀπολοῦνται
  choice: sẽ hỏng
  rationale: Đối với vật chứa, “hỏng” diễn đạt sự bị phá hủy và mất công dụng mà không gợi ý bị tiêu diệt hoàn toàn.
- source_word: καὶ αὐτός
  choice: rượu
  rationale: Đại từ nhấn mạnh quy chiếu về rượu mới. Lặp lại “rượu” giúp câu tiếng Việt rõ chủ thể; không thêm “chính” vì sẽ nặng lời hơn cần thiết.
- source_word: οὐδεὶς
  choice: Không ai
  rationale: Tương đương trực tiếp, rõ ràng và phù hợp với giọng châm ngôn.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “túi da” thay vì thuật ngữ cổ hoặc dài dòng; cấu trúc đối xứng ở vế cuối làm rõ cả rượu lẫn túi đều bị mất. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
