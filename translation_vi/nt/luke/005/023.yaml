id: LUK.5.23
reference: Luke 5:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: vi
  text: 'Điều nào dễ hơn: nói, “Tội lỗi của anh đã được tha,”[a] hay nói, “Hãy đứng dậy và bước đi”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tội lỗi của anh được tha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Điều nào dễ hơn
  rationale: Cách hỏi tự nhiên trong tiếng Việt, giữ nguyên ý so sánh giữa hai lời nói.
- source_word: εἰπεῖν
  choice: nói
  rationale: Động từ nguyên mẫu giới thiệu nội dung của hai lời được đem ra so sánh; “nói” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: Ἀφέωνταί
  choice: đã được tha
  rationale: Trong ngữ cảnh này, ἀφίημι nói về sự tha tội. Dạng hoàn thành mang sắc thái một hành động đã xảy ra với kết quả còn hiệu lực; “đã được tha” diễn đạt rõ điều đó mà vẫn giữ thể bị động.
- source_word: σοι
  choice: của anh
  rationale: Trong cấu trúc tiếng Việt “Tội lỗi của anh đã được tha,” người được nói trực tiếp đến được thể hiện tự nhiên bằng sở hữu ngữ “của anh”; không cần thêm một đại từ gián tiếp gượng ép.
- source_word: αἱ ἁμαρτίαι σου
  choice: Tội lỗi của anh
  rationale: Diễn đạt chính xác quan hệ sở hữu và phù hợp với lời Chúa Giê-su nói trực tiếp với người đàn ông trong ngữ cảnh.
- source_word: ἢ
  choice: hay
  rationale: Liên từ phân cách tự nhiên trong một câu hỏi lựa chọn tiếng Việt.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh bảo người đang nằm trỗi dậy; “đứng dậy” rõ nghĩa, tự nhiên và trang trọng vừa phải trong tiếng Việt hiện đại.
- source_word: καὶ περιπάτει
  choice: và bước đi
  rationale: Ở đây περιπατέω chỉ hành động đi lại theo nghĩa đen; “bước đi” tạo thành cặp mệnh lệnh tự nhiên với “đứng dậy.”
theological_decisions:
- issue: Cách chuyển lời tuyên bố tha tội mà không áp đặt thêm hàm ý thần học lên dạng hoàn thành/bị động của động từ Hy Lạp
  choice: Tội lỗi của anh đã được tha
  alternative: Tội lỗi của anh được tha
  rationale: Bản dịch chính giữ thể bị động và diễn đạt trạng thái hiện tại bắt nguồn từ hành động đã hoàn tất, nhưng không xác định tác nhân ngoài điều bản văn cho biết. Cách thay thế nhấn mạnh trạng thái tha thứ hơn và giảm sắc thái thời gian.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang trọng vừa phải. Đại từ “anh” phù hợp với việc Chúa Giê-su trực tiếp nói với một người đàn ông trưởng thành; câu hỏi giữ sự đối xứng giữa lời tuyên bố tha tội và mệnh lệnh chữa lành.
