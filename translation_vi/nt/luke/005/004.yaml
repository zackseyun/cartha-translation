  terminology: “Ngài,” “Si-môn,” “lưới,” và “bắt cá” đều phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Không có vấn đề thuật ngữ thần học. Không cần chú thích; nghĩa ngữ cảnh của βάθος đã được diễn đạt rõ.
