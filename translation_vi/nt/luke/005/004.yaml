  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: vi
  text: 'Khi nói xong, Ngài bảo Si-môn: “Hãy đưa thuyền ra chỗ nước sâu, rồi các anh hãy thả lưới xuống để bắt cá.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Khi
  rationale: Diễn tả quan hệ thời gian và sự chuyển tiếp nhẹ trong câu chuyện mà không cần dịch riêng δέ.
- source_word: ἐπαύσατο λαλῶν
  choice: nói xong
  rationale: Diễn đạt tự nhiên việc chấm dứt hành động đang nói, đồng thời giữ rõ quan hệ thời gian.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: Ngài bảo Si-môn
  rationale: Trong tiếng Việt, “bảo” là cách dẫn vào một lời chỉ dẫn trực tiếp tự nhiên; “Ngài” nối rõ với Chúa Giê-su trong ngữ cảnh.
- source_word: Ἐπανάγαγε
  choice: Hãy chèo ra
  rationale: Trong bối cảnh thuyền trên hồ, động từ chỉ việc đưa thuyền trở ra xa bờ; “chèo ra” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ βάθος
  choice: chỗ nước sâu
  rationale: βάθος theo ngữ cảnh chỉ vùng nước sâu, không phải chiều sâu trừu tượng.
- source_word: χαλάσατε
  choice: thả ... xuống
  rationale: Thể hiện đúng hành động hạ lưới từ thuyền xuống nước.
- source_word: τὰ δίκτυα ὑμῶν
  choice: lưới của các anh
  rationale: Giữ số nhiều của người nhận trong ὑμῶν; tiếng Việt có thể dùng danh từ tập hợp “lưới” tự nhiên mà không buộc biểu thị số lượng từng chiếc.
- source_word: εἰς ἄγραν
  choice: để đánh cá
  rationale: Diễn đạt tự nhiên mục đích của việc thả lưới; trong ngữ cảnh, ἄγρα là việc bắt được cá hay mẻ cá.
theological_decisions:
- issue: Sự chuyển đổi từ mệnh lệnh số ít sang số nhiều
  choice: “Hãy chèo ra” hướng đến Si-môn; “thả lưới của các anh” hướng đến cả nhóm
  alternative: Dịch cả hai mệnh lệnh như chỉ hướng đến Si-môn
  rationale: Ἐπανάγαγε là số ít, còn χαλάσατε và ὑμῶν là số nhiều. Bản dịch bảo tồn sự chuyển đổi người nhận này mà không giải thích thêm trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho chủ thể là Chúa Giê-su theo ngữ cảnh; giữ tên “Si-môn”. Không thêm chú thích vì “chỗ nước sâu” truyền đạt trực tiếp nghĩa theo ngữ cảnh, còn chú thích [a] của lớp tham khảo tiếng Anh dường như được đặt sau “speaking” nhưng nội dung lại thuộc εἰς τὸ βάθος, nên không sao chép máy móc.
