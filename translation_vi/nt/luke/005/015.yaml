id: LUK.5.15
reference: Luke 5:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: vi
  text: Nhưng tin tức về Ngài càng lan truyền[a], và dân chúng tụ họp rất đông để nghe và được chữa lành khỏi bệnh tật của họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời truyền về Ngài” hoặc “tin về Ngài.”'
    reason: Giữ các khả năng diễn đạt của ὁ λόγος περὶ αὐτοῦ, vốn có thể chỉ lời truyền, tin tức hoặc tin về Chúa Giê-su.
lexical_decisions:
- source_word: διήρχετο
  choice: lan rộng
  rationale: Động từ ở thì chưa hoàn thành diễn tả tin tức tiếp tục lưu truyền; “lan rộng” tự nhiên trong tiếng Việt và giữ được sắc thái diễn tiến.
- source_word: μᾶλλον
  choice: càng ... hơn
  rationale: Giữ lực so sánh và tăng tiến của μᾶλλον trong mạch kể.
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: tin tức về Ngài
  rationale: Trong ngữ cảnh này, λόγος chỉ tin tức đang lưu truyền về Chúa Giê-su, không nhất thiết mang nghĩa thần học chuyên biệt là “Lời”.
- source_word: συνήρχοντο ὄχλοι πολλοὶ
  choice: dân chúng tụ họp rất đông
  rationale: Diễn đạt tự nhiên số đông tụ lại, đồng thời thì chưa hoàn thành của συνήρχοντο cho thấy hành động đang tiếp diễn hoặc lặp lại.
- source_word: ἀκούειν
  choice: để nghe Ngài
  rationale: Nguyên văn để ngỏ tân ngữ, nhưng trong tiếng Việt cần nêu đối tượng được hiểu theo ngữ cảnh là Chúa Giê-su để câu tự nhiên; không thêm nội dung cụ thể về điều Ngài giảng.
- source_word: θεραπεύεσθαι
  choice: được chữa lành
  rationale: Giữ thể bị động và ý nghĩa chữa trị rõ ràng của động từ trong bối cảnh này.
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: khỏi bệnh tật của họ
  rationale: “Khỏi” phản ánh ἀπό theo nghĩa được giải thoát khỏi bệnh; ἀσθένεια ở đây chỉ các chứng bệnh thể chất.
theological_decisions:
- issue: Phạm vi của ngôn ngữ chữa lành
  choice: Dùng ngôn ngữ trực tiếp về việc được chữa lành khỏi bệnh tật thể chất.
  alternative: Dùng cách nói rộng hơn như “được phục hồi trọn vẹn,” có thể bao hàm sự phục hồi thuộc linh.
  rationale: Ngữ cảnh trực tiếp nói đến dân chúng đến nghe và được chữa khỏi các chứng bệnh; câu này không minh nhiên mở rộng việc chữa lành sang phương diện thuộc linh.
- issue: Ý nghĩa của λόγος
  choice: Hiểu là “tin tức” về Chúa Giê-su.
  alternative: Dịch là “lời” theo nghĩa một sứ điệp mang nội hàm thần học chuyên biệt.
  rationale: Trong mạch tường thuật, điều đang lan truyền là tin tức về Ngài; bản dịch tránh áp đặt một nghĩa thần học mà ngữ cảnh không đòi hỏi.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” phù hợp lối kể Kinh Thánh phổ thông. Cấu trúc “dân chúng tụ họp rất đông” tránh cách dịch cứng “nhiều đám đông” nhưng vẫn chuyển tải ὄχλοι πολλοὶ.
