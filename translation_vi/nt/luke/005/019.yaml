source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: vi
  text: Không tìm được cách nào để đưa người ấy vào vì đám đông[a], họ lên mái nhà, rồi hạ người ấy cùng chiếc giường nhỏ[c] xuống qua lớp ngói trên mái[b], vào giữa, trước mặt Đức Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ không tìm được lối nào để đưa người ấy vào vì đám đông.” Cách nói Hy Lạp có thể nhấn mạnh cách thức, phương tiện hoặc lối vào.'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa sát là “qua những viên ngói.” Lu-ca nêu rõ chi tiết ngói trên mái nhà.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “tấm đệm”, “cái cáng” hoặc “cái chõng.” Từ Hy Lạp chỉ một chiếc giường nhỏ hoặc vật dùng để nằm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: không tìm được cách đưa người ấy vào
  rationale: Cụm Hy Lạp mang tính tỉnh lược, có thể chỉ cách thức, phương tiện hoặc lối để đưa người ấy vào. Cách dịch này tự nhiên trong tiếng Việt và giữ được độ rộng nghĩa.
- source_word: διὰ τὸν ὄχλον
  choice: Vì đám đông cản lối
  rationale: διά với đối cách ở đây nêu nguyên nhân. Thêm 'cản lối' diễn đạt rõ vai trò chướng ngại của đám đông mà không hiểu sai thành chuyển động xuyên qua đám đông.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: họ bèn lên mái nhà
  rationale: δῶμα chỉ mái nhà hoặc khu vực trên mái; 'lên mái nhà' là cách nói hiện đại, tự nhiên và giữ chuyển động đi lên.
- source_word: διὰ τῶν κεράμων
  choice: qua những viên ngói
  rationale: κέραμος ở số nhiều chỉ các viên ngói bằng đất nung. Cách dịch giữ chi tiết kiến trúc đặc trưng trong lời kể của Lu-ca.
- source_word: καθῆκαν
  choice: hạ ... xuống
  rationale: Động từ chỉ hành động hạ từ trên cao xuống; cách diễn đạt này rõ hướng chuyển động và tự nhiên trong tiếng Việt.
- source_word: σὺν τῷ κλινιδίῳ
  choice: cùng với tấm đệm
  rationale: κλινίδιον là giường nhỏ, chõng hoặc đệm nằm. 'Tấm đệm' phù hợp ngữ cảnh chuyên chở mà không áp đặt hình ảnh cáng y tế hiện đại.
- source_word: εἰς τὸ μέσον
  choice: xuống giữa mọi người
  rationale: Nghĩa đen là 'vào giữa'. Bổ sung 'mọi người' làm rõ điểm đến trong không gian tụ họp, vốn được ngữ cảnh hàm ý.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: ngay trước mặt Đức Giê-su
  rationale: Diễn đạt vị trí không gian một cách rõ ràng; 'ngay' làm nổi bật sự đặt người ấy trực tiếp trước Đức Giê-su mà không thay đổi ý nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi phổ biến trong tiếng Việt; tránh từ cổ như “chõng” trong chính văn nhưng giữ ở chú thích như một khả năng từ vựng. Các dấu chú thích [a], [b], [c] đều xuất hiện đúng tại nội dung liên quan.
