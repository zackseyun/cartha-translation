  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố của SBLGNT: phủ định khái quát (οὐδείς), hành động uống rượu cũ có trước sự ưa muốn, đối tượng rượu mới được làm rõ theo ngữ cảnh, và lời giải thích với γάρ. “Ngon” diễn đạt phù hợp χρηστός trong ngữ cảnh rượu mà không thêm sắc thái so sánh. Chú thích phản ánh đúng dị bản có nghĩa so sánh.'
