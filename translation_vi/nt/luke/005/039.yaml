id: LUK.5.39
reference: Luke 5:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: vi
  text: 'Không ai sau khi uống rượu cũ lại muốn rượu mới, vì người ấy nói: “Rượu cũ ngon.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Rượu cũ ngon hơn.”'
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: Không ai
  rationale: Diễn tả phủ định khái quát về bất cứ người nào; tự nhiên, hiện đại và không hàm ý giới tính.
- source_word: πιὼν
  choice: sau khi uống
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách diễn đạt này giữ rõ quan hệ thời gian trong tiếng Việt.
- source_word: παλαιὸν
  choice: rượu cũ
  rationale: Danh từ “rượu” được ngầm hiểu từ ngữ cảnh gần; thêm vào giúp câu tiếng Việt rõ và tự nhiên.
- source_word: θέλει νέον
  choice: muốn rượu mới
  rationale: θέλει diễn tả ý muốn hoặc sự ưa thích; tiếng Việt cần nêu lại “rượu” để tránh cách nói cụt và thiếu tự nhiên.
- source_word: λέγει γάρ
  choice: vì người ấy nói
  rationale: γάρ nêu lý do cho lời khẳng định trước đó; “người ấy” quy chiếu tự nhiên đến người vừa uống rượu cũ.
- source_word: Ὁ παλαιὸς
  choice: Rượu cũ
  rationale: Tiếng Hy Lạp lược danh từ “rượu”; tiếng Việt khôi phục danh từ để lời trích dẫn rõ nghĩa.
- source_word: χρηστός
  choice: ngon
  rationale: Trong ngữ cảnh đánh giá rượu, “ngon” diễn đạt tự nhiên sắc thái tốt, dễ chịu hoặc hợp khẩu vị mà không biến tính từ thành dạng so sánh “ngon hơn”.
theological_decisions:
- issue: Cách dịch χρηστός trong lời nói về rượu cũ và rượu mới
  choice: ngon
  alternative: ngon hơn / tốt hơn
  rationale: Bản văn SBLGNT có χρηστός, một tính từ không ở dạng so sánh, mang nghĩa “tốt, dễ chịu.” Trong ngữ cảnh rượu, “ngon” là cách nói tự nhiên; không đưa ý so sánh “hơn” vào chính văn. Dị bản hoặc cách đọc truyền thống mang nghĩa “tốt hơn” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lặp lại “rượu” ở hai chỗ tiếng Hy Lạp dùng tính từ độc lập để câu tiếng Việt tự nhiên và không mơ hồ. Dấu chú thích [a] được đặt ngay sau lời trích dẫn mà dị bản liên quan.
