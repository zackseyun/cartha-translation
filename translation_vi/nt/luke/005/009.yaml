  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: vi
  text: Vì sự kinh ngạc đã bao trùm ông và tất cả những người ở cùng ông do mẻ cá họ đã bắt được.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “số cá mà họ đã bắt được.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: kinh ngạc
  rationale: Danh từ này chỉ trạng thái sửng sốt, kinh ngạc mạnh mẽ. “Kinh ngạc” tự nhiên trong tiếng Việt hiện đại và phù hợp với phản ứng trước mẻ cá lạ thường.
- source_word: γὰρ
  choice: Vì
  rationale: Liên từ nêu lý do cho phản ứng của Si-môn trong câu trước; “Vì” giữ rõ quan hệ giải thích.
- source_word: περιέσχεν
  choice: đều kinh ngạc
  rationale: Động từ theo nghĩa đen là bao quanh hoặc chiếm lấy; khi đi với θάμβος, câu có nghĩa sự kinh ngạc bao trùm họ. Cách diễn đạt này tự nhiên hơn trong tiếng Việt, còn sắc thái bao trùm được chuyển tải qua phạm vi “ông và tất cả...” cùng từ “đều”.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: tất cả những người ở với ông
  rationale: Giữ nguyên phạm vi tập thể và chỉ những người đang có mặt cùng Si-môn.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: trước mẻ cá
  rationale: ἄγρα là mẻ đánh bắt, ở đây là mẻ cá; ἐπί biểu thị căn nguyên hoặc điều gây nên phản ứng. “Trước mẻ cá” vừa tự nhiên vừa diễn đạt việc mẻ cá khiến họ kinh ngạc.
- source_word: ὧν συνέλαβον
  choice: họ đã bắt được
  rationale: Đại từ quan hệ quy chiếu đến số cá, còn động từ số nhiều cho biết cả nhóm tham gia. “Bắt được” là cách nói tự nhiên, chính xác trong ngữ cảnh đánh cá.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc được điều chỉnh tự nhiên theo tiếng Việt nhưng vẫn giữ quan hệ nguyên nhân với câu trước và phạm vi bao gồm Si-môn cùng mọi người ở với ông.
