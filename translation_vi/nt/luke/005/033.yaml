id: LUK.5.33
reference: Luke 5:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: vi
  text: 'Họ nói với Ngài: “Các môn đồ của Giăng thường kiêng ăn và cầu nguyện; các môn đồ của người Pha-ri-si cũng vậy, còn môn đồ của Ngài thì ăn uống.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Họ nói với Ngài
  rationale: δέ là từ nối nhẹ trong mạch kể; tiếng Việt không cần dịch riêng bằng “và” hay “nhưng”. “Ngài” giữ giọng văn trang trọng khi chỉ Chúa Giê-su.
- source_word: μαθηταὶ Ἰωάννου
  choice: các môn đồ của Giăng
  rationale: Cách diễn đạt tự nhiên, rõ quan hệ giữa các môn đồ và Giăng.
- source_word: νηστεύουσιν πυκνά
  choice: thường kiêng ăn
  rationale: πυκνά mang nghĩa chỉ tần suất; “thường” diễn đạt tự nhiên việc làm được lặp lại.
- source_word: δεήσεις ποιοῦνται
  choice: cầu nguyện
  rationale: Thành ngữ Hy Lạp nói về việc dâng lời khẩn nguyện. “Cầu nguyện” là cách nói hiện đại, tự nhiên và không tạo sắc thái gượng gạo như bản dịch từng chữ “làm những lời cầu nguyện”.
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: các môn đồ của người Pha-ri-si cũng vậy
  rationale: Danh từ “môn đồ” được tỉnh lược trong tiếng Hy Lạp nhưng được hiểu từ vế trước; bổ sung trong tiếng Việt để câu rõ nghĩa. “Cũng vậy” diễn đạt gọn cả ὁμοίως καί.
- source_word: οἱ δὲ σοὶ
  choice: còn môn đồ của Ngài thì
  rationale: σοί được dùng tỉnh lược với nghĩa “những người thuộc về Ngài”, tức các môn đồ. Bổ sung “môn đồ” giúp tiếng Việt tự nhiên; “còn... thì” nêu đúng sự tương phản của δέ.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: ăn uống
  rationale: Diễn đạt tự nhiên cặp động từ “ăn và uống”; thì hiện tại mô tả nếp hành xử được quan sát nói chung.
theological_decisions:
- issue: Có nên bổ sung “môn đồ” ở hai vế sau hay giữ nguyên lối tỉnh lược của tiếng Hy Lạp
  choice: Bổ sung “môn đồ” trong cả hai vế để tiếng Việt rõ ràng và tự nhiên
  alternative: “những người của người Pha-ri-si... còn những người của Ngài” hoặc một lối tỉnh lược tương tự
  rationale: Ngữ cảnh và cấu trúc Hy Lạp đều cho thấy μαθηταί được hiểu ngầm. Việc bổ sung không giải quyết một tranh luận thần học mà chỉ làm rõ thành phần đã hàm chứa trong nguyên bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” vì đây là thuật ngữ Kinh Thánh quen thuộc; dùng “người Pha-ri-si” theo cách gọi phổ biến trong tiếng Việt. Không giữ máy móc phép tỉnh lược Hy Lạp khi điều đó khiến câu tiếng Việt thiếu tự nhiên.
