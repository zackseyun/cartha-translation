reference: Luke 5:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: vi
  text: 'Ngài cũng kể cho họ một ví dụ: “Không ai xé một miếng vá từ áo mới rồi đắp lên áo cũ.[a] Nếu không, người ấy sẽ làm rách áo mới, và miếng vá từ áo mới sẽ không hợp[b] với áo cũ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát cấu trúc Hy Lạp hơn: “Không ai, sau khi xé một miếng vá từ áo mới, đem đắp nó lên áo cũ.”'
    reason: Câu Hy Lạp dùng một phân từ aorist (“đã xé”/“sau khi xé”) trước động từ chính.
  - marker: b
    text: “Không hợp” cũng có thể hiểu là “không vừa” hoặc “không tương xứng.”
    reason: Động từ Hy Lạp diễn tả sự thiếu tương hợp hay thích hợp mà không xác định cụ thể phương diện nào.
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Ngài cũng kể
  rationale: Thì chưa hoàn thành cho thấy lời nói đang diễn ra trong mạch kể; tiếng Việt tự nhiên không cần đánh dấu riêng khía cạnh này. “Cũng” thể hiện καὶ, còn “kể” phù hợp với việc đưa ra một ẩn dụ.
- source_word: παραβολὴν
  choice: một ẩn dụ
  rationale: “Ẩn dụ” là cách gọi quen thuộc, dễ hiểu đối với παραβολή trong văn cảnh lời dạy bằng hình ảnh so sánh.
- source_word: Οὐδεὶς
  choice: Không ai
  rationale: Cách diễn đạt tự nhiên, giữ nguyên tính khái quát của câu nói.
- source_word: ἐπίβλημα ἀπὸ ἱματίου καινοῦ σχίσας
  choice: xé một miếng vá từ áo mới
  rationale: Giữ rõ nguồn gốc của miếng vá và động tác σχίζω là xé; chuyển phân từ sang chuỗi động từ tự nhiên trong tiếng Việt.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: đắp vào áo cũ
  rationale: “Đắp” là động từ tự nhiên khi nói đến việc dùng miếng vá cho áo, nhưng không xác định quá mức rằng người ấy khâu hay dùng một phương thức cụ thể nào.
- source_word: εἰ δὲ μήγε
  choice: Nếu làm thế
  rationale: Trong văn cảnh, cụm này dẫn vào hậu quả nếu người ta thực hiện hành động vừa nêu; cách dịch này rõ và tự nhiên hơn lối sát chữ “nếu không”.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: người ấy vừa xé rách áo mới
  rationale: Động từ tương lai chủ động có chủ thể ngầm là người thực hiện hành động. “Người ấy” làm rõ chủ thể, còn “vừa… mà… cũng” chuyển tải hai hậu quả song song do hai καὶ liên kết.
- source_word: τῷ παλαιῷ οὐ συμφωνήσει
  choice: không hợp với áo cũ
  rationale: συμφωνέω ở đây chỉ sự không tương xứng hoặc không thích hợp; “không hợp” giữ được độ rộng nghĩa, không giới hạn vào màu sắc, kích cỡ hay độ bền.
