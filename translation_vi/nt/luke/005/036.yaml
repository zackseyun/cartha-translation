revisions:
- from: 'Ngài cũng kể cho họ một ẩn dụ: “Không ai xé một miếng vá từ áo mới rồi đắp vào áo cũ.[a] Nếu làm thế, người ấy vừa xé rách áo mới, mà miếng vá lấy từ áo mới cũng không hợp[b] với áo cũ.”'
  to: 'Ngài cũng kể cho họ một ví dụ: “Không ai xé một miếng vá từ áo mới rồi đắp lên áo cũ.[a] Nếu không, người ấy sẽ làm rách áo mới, và miếng vá từ áo mới sẽ không hợp[b] với áo cũ.”'
  rationale: Bản sửa thay thuật ngữ thể loại dễ gây lệch nghĩa, chỉnh mệnh đề hậu quả theo hai động từ tương lai chủ động của nguyên văn, và giữ nguyên tính mở của «không hợp». Các dấu chú thích vẫn gắn đúng với phần văn bản được chú giải.
