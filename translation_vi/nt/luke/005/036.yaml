translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su trong mạch kể; “áo” tự nhiên hơn “y phục,” còn “đắp” phù hợp ngữ cảnh vá áo mà không thêm chi tiết không có trong nguyên văn.
