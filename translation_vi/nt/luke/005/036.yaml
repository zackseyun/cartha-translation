review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng hình ảnh và mạch lập luận chính. Tuy nhiên, «ẩn dụ» không phải tương đương chính xác nhất của παραβολή trong ngữ cảnh này; «ví dụ» (hoặc «dụ ngôn») phù hợp hơn. Mệnh đề hậu quả cần biểu đạt rõ thì tương lai của σχίσει và chủ thể chủ động: người ấy sẽ làm rách áo mới.'
  naturalness: «Ngài cũng kể cho họ một ví dụ» và «đắp lên áo cũ» là tự nhiên, trang trọng vừa phải. Cấu trúc «vừa xé rách áo mới, mà ... cũng» trong bản nháp không tự nhiên trong quan hệ điều kiện–hậu quả; thay bằng hai hậu quả song song với «sẽ» rõ ràng hơn.
  terminology: Dùng «ví dụ» cho παραβολή để tránh đồng nhất thể loại dụ ngôn/lời so sánh với biện pháp tu từ «ẩn dụ». «Miếng vá», «áo mới», «áo cũ» và «không hợp» đều phù hợp, không áp đặt một loại bất tương hợp cụ thể.
  issues:
  - severity: medium
    issue: «ẩn dụ» cho παραβολή
    rationale: «Ẩn dụ» thường chỉ phép tu từ metaphor trong tiếng Việt, trong khi παραβολή ở đây là một lời ví dụ/so sánh có tính minh họa. «Ví dụ» giữ đúng thể loại và tự nhiên trong văn cảnh.
  - severity: medium
    issue: Mệnh đề «người ấy vừa xé rách áo mới, mà ... cũng không hợp»
    rationale: Câu này không phản ánh rõ hai động từ tương lai σχίσει và συμφωνήσει, đồng thời «vừa ... mà» làm quan hệ hậu quả thiếu tự nhiên. Cần diễn đạt «sẽ làm rách ... và ... sẽ không hợp».
