  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của SBLGNT: μετὰ ταῦτα là “Sau những việc ấy”; ἐξῆλθεν là “đi ra”; ἐθεάσατο được dịch tự nhiên là “nhìn thấy”; τελώνης là “người thu thuế”; và ἐπὶ τὸ τελώνιον là địa điểm thu thuế. “Hãy theo tôi” truyền đạt đúng mệnh lệnh hiện tại Ἀκολούθει μοι mà không diễn giải quá mức thành lời giải thích về môn đồ hóa.'
