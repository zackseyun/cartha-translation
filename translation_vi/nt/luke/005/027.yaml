  terminology: Tên riêng “Lê-vi” và “Đức Giê-su” nhất quán với cách phiên chuyển quen dùng. “Người thu thuế” là thuật ngữ rõ nghĩa, không áp đặt đánh giá xã hội ngoài nguyên văn. “Trạm thu thuế” là một cách dịch chấp nhận được cho τελώνιον, và chú thích bảo lưu các khả năng “trạm thu phí” và “trạm hải quan”.
