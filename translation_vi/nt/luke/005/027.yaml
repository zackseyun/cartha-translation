id: LUK.5.27
reference: Luke 5:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: vi
  text: 'Sau những việc ấy, Đức Giê-su đi ra và nhìn thấy[a] một người thu thuế tên là Lê-vi đang ngồi tại trạm thu thuế[b]. Ngài nói với ông: “Hãy theo tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “để ý thấy” hoặc “nhìn kỹ”; động từ Hy Lạp có thể hàm ý nhiều hơn một cái nhìn thoáng qua.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “quầy thu thuế”, “trạm thu phí” hoặc “trạm hải quan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Giữ số nhiều của đại từ chỉ định và sự chuyển tiếp tường thuật của Lu-ca, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἐξῆλθεν
  choice: đi ra
  rationale: Diễn đạt trực tiếp chuyển động cụ thể của động từ ἐξέρχομαι, không làm mờ thành “rời đi”.
- source_word: ἐθεάσατο
  choice: nhìn thấy
  rationale: Thể hiện hành động thấy, đồng thời phần nào giữ sắc thái chú ý quan sát có thể có của θεάομαι mà không cường điệu.
- source_word: τελώνην
  choice: một người thu thuế
  rationale: Cách gọi rõ ràng, quen thuộc trong tiếng Việt hiện đại và phù hợp với vai trò xã hội được nói đến.
- source_word: ὀνόματι Λευὶν
  choice: tên là Lê-vi
  rationale: Chuyển cấu trúc Hy Lạp sang cách nói tự nhiên, chính xác trong tiếng Việt.
- source_word: καθήμενον
  choice: đang ngồi
  rationale: Giữ khía cạnh diễn tiến của phân từ hiện tại và tính trực quan của cảnh kể.
- source_word: ἐπὶ τὸ τελώνιον
  choice: tại trạm thu thuế
  rationale: τελώνιον chỉ địa điểm thu thuế hoặc thu phí; “trạm thu thuế” vừa dễ hiểu vừa không xác định quá mức loại khoản thu.
- source_word: Ἀκολούθει μοι
  choice: Hãy theo tôi
  rationale: Giữ nguyên mệnh lệnh trực tiếp và sức gợi về lời kêu gọi làm môn đồ, không thêm phần giải nghĩa vào chính văn.
theological_decisions:
- issue: Sức nặng của mệnh lệnh như lời kêu gọi làm môn đồ
  choice: Hãy theo tôi
  alternative: Hãy làm môn đồ của tôi
  rationale: Ngữ cảnh cho thấy đây là lời kêu gọi làm môn đồ, nhưng bản dịch giữ cách nói ngắn gọn của nguyên văn thay vì đưa lời giải thích thần học vào câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để làm rõ chủ thể vốn được lược trong tiếng Hy Lạp nhưng đã rõ từ ngữ cảnh; dùng “Ngài” cho chủ thể và “ông” cho Lê-vi. Các dấu chú thích được đặt đúng tại từ ngữ mà chúng giải thích.
