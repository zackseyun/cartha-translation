id: LUK.5.6
reference: Luke 5:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: vi
  text: Họ làm như vậy và vây được rất nhiều cá[a]; những tấm lưới của họ đang rách dần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bắt được rất nhiều cá.” Động từ Hy Lạp theo nghĩa sát hơn là “vây lại” hoặc “nhốt vào trong,” gợi hình ảnh cá bị bao quanh trong lưới.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bắt đầu rách.” Thì chưa hoàn thành trong tiếng Hy Lạp mô tả việc rách đang diễn ra, không nhất thiết có nghĩa là lưới đã rách đứt hoàn toàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Họ làm như vậy
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hoặc gắn liền với động từ chính. Cách dịch này tự nhiên trong tiếng Việt và nối rõ với mệnh lệnh ở câu trước.
- source_word: συνέκλεισαν
  choice: vây được
  rationale: Động từ mang nghĩa bao vây, khép lại hoặc nhốt vào trong. “Vây được” giữ hình ảnh cá bị lưới bao quanh, đồng thời tự nhiên hơn cách dịch thuần túy là “bắt được”.
- source_word: πλῆθος ἰχθύων πολύ
  choice: rất nhiều cá
  rationale: Cụm từ nhấn mạnh số lượng cá vô cùng lớn. “Rất nhiều cá” truyền đạt rõ mức độ dồi dào bằng tiếng Việt hiện đại mà không tạo lối diễn đạt nặng nề.
- source_word: διερρήσσετο
  choice: đang rách dần
  rationale: Thì chưa hoàn thành mô tả quá trình rách đang diễn ra, chứ không nhất thiết nói rằng lưới đã rách đứt hoàn toàn. “Đang rách dần” giữ được sắc thái tiến triển ấy.
- source_word: τὰ δίκτυα αὐτῶν
  choice: những tấm lưới của họ
  rationale: Giữ rõ dạng số nhiều của nguyên văn và diễn đạt quan hệ sở hữu tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ trình tự của nguyên văn; dấu chấm phẩy giúp thể hiện hai diễn biến liên tiếp mà không thêm quan hệ nhân quả vốn không được nói rõ bằng liên từ chuyên biệt trong tiếng Hy Lạp.
