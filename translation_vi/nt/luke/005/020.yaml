id: LUK.5.20
reference: Luke 5:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: vi
  text: 'Thấy đức tin của họ[a], Ngài nói: “Này anh, tội lỗi của anh đã được tha[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “lòng tin”; tiếng Hy Lạp: “đức tin”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “được tha”. Dạng hoàn thành bị động trong tiếng Hy Lạp có thể nhấn mạnh tình trạng hiện tại do một hành động đã hoàn tất tạo nên.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Thấy
  rationale: Phân từ aorist được diễn đạt gọn và tự nhiên, giữ quan hệ thời gian với động từ chính mà không nhấn quá mức rằng đây là hành động đã hoàn tất trước đó.
- source_word: πίστιν
  choice: đức tin
  rationale: Đây là cách dịch trực tiếp và quen thuộc của πίστις trong ngữ cảnh nói về lòng tin được biểu lộ qua hành động; chú thích giữ lại khả năng dịch là “lòng tin”.
- source_word: αὐτῶν
  choice: của họ
  rationale: Giữ nguyên đại từ số nhiều, không quyết định đó chỉ là những người khiêng hay bao gồm cả người bại liệt.
- source_word: Ἄνθρωπε
  choice: Này anh
  rationale: Cách xưng hô trực tiếp, tự nhiên trong tiếng Việt hiện đại đối với một người nam; tránh “Hỡi người” quá cổ và tránh thêm sắc thái thân tình không có rõ trong nguyên văn.
- source_word: ἀφέωνταί
  choice: đã được tha
  rationale: Thể hoàn thành bị động diễn tả tình trạng hiện tại phát sinh từ hành động đã hoàn tất; “đã được tha” tự nhiên và giữ được sắc thái ấy.
- source_word: ἁμαρτίαι
  choice: tội lỗi
  rationale: Diễn đạt trực tiếp nội dung đạo đức và thần học của danh từ số nhiều, đồng thời tự nhiên trong tiếng Việt.
- source_word: σοι ... σου
  choice: của anh ... anh
  rationale: Cụm “tội lỗi của anh” và cách xưng hô “anh” xác định rõ người nhận sự tha thứ; không lặp thêm một đại từ cuối câu vốn sẽ kém tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của “đức tin của họ”
  choice: Giữ đại từ số nhiều “họ” mà không xác định cụ thể những ai được kể vào đó.
  alternative: Chỉ những người khiêng người bại liệt; hoặc người bại liệt cùng các bạn đồng hành.
  rationale: Nguyên văn dùng đại từ số nhiều và không tự giải thích phạm vi; bản dịch giữ nguyên sự rộng mở này.
- issue: Sắc thái thời gian của lời tuyên bố tha tội
  choice: Dịch “đã được tha”, vừa nêu sự tha thứ đã thành hiện thực vừa để ngỏ cơ chế và thời điểm chính xác.
  alternative: “được tha”, có thể nhấn mạnh tình trạng hiện tại hơn và ít biểu thị hành động đã hoàn tất.
  rationale: Thể hoàn thành bị động khẳng định thực tại của sự tha thứ nhưng không tự nó giải quyết lời này là hành vi ban tha thứ ngay lúc đó hay công bố một sự tha thứ đã được ban.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. “Này anh” giữ cách gọi trực tiếp dành cho người nam mà không dùng lối cổ. Đại từ “Ngài” nối tự nhiên với ngữ cảnh trước và thể hiện sự kính trọng thông thường trong văn thuật chuyện về Đức Giê-su.
