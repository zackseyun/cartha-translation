language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: vi
  text: Lập tức, anh đứng dậy trước mặt họ, nhấc lên thứ anh đã nằm trên đó[a], rồi đi về nhà mình, vừa đi vừa tôn vinh Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chiếc chiếu anh đã nằm trên đó”; nguyên văn: “điều mà anh đang nằm trên đó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Ngay lập tức
  rationale: Diễn tả hành động xảy ra không chút trì hoãn và giữ được sự nhấn mạnh của Lu-ca về hiệu quả tức thời của việc chữa lành.
- source_word: ἀναστὰς
  choice: anh đứng dậy
  rationale: Chuyển phân từ bất định sang động từ hữu hạn để câu kể tự nhiên trong tiếng Việt, đồng thời vẫn giữ đúng trình tự hành động.
- source_word: ἐνώπιον αὐτῶν
  choice: trước mặt họ
  rationale: Diễn đạt ngắn gọn việc anh đứng dậy công khai ngay trong sự hiện diện của mọi người, không thêm sắc thái 'trước mắt' vốn mạnh hơn nguyên văn.
- source_word: ἄρας
  choice: nhấc ... lên
  rationale: Thể hiện hành động nâng vật anh đã nằm trên đó lên; cách nói cụ thể, tự nhiên và phù hợp với ngữ cảnh.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: vật mình đã nằm trên đó
  rationale: Giữ cách diễn đạt quan hệ của tiếng Hy Lạp, vốn không nêu rõ danh từ như 'chiếu' hay 'giường', qua đó tránh thêm độ xác định không có trong câu.
- source_word: κατέκειτο
  choice: đã nằm
  rationale: Thì chưa hoàn thành chỉ trạng thái nằm kéo dài trước hành động đứng dậy; 'đã nằm' thể hiện hợp lý quan hệ thời gian ấy trong tiếng Việt.
- source_word: ἀπῆλθεν
  choice: đi về
  rationale: Trong sự kết hợp với 'về nhà mình', cách nói này tự nhiên hơn 'đi khỏi' mà vẫn thể hiện việc rời nơi đang ở.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: về nhà mình
  rationale: '''Nhà mình'' là cách nói hiện đại, tự nhiên, đồng thời giữ rõ ngôi phản thân theo chủ thể của câu.'
- source_word: δοξάζων τὸν θεόν
  choice: vừa đi vừa tôn vinh Đức Chúa Trời
  rationale: Phân từ hiện tại cho thấy hành động tôn vinh diễn ra đồng thời với việc đi về. 'Tôn vinh' giữ phạm vi nghĩa rộng hơn 'ca ngợi', bao gồm việc quy vinh hiển và danh dự cho Đức Chúa Trời.
theological_decisions:
- issue: Có nên xác định vật anh mang là 'giường' hay 'chiếu' trong chính văn hay không
  choice: 'Giữ cách nói gần nguyên văn: ''vật mình đã nằm trên đó''.'
  alternative: '''chiếc chiếu mình đã nằm trên đó'' hoặc ''chiếc giường mình đã nằm trên đó'''
  rationale: Câu Hy Lạp dùng một mệnh đề quan hệ chứ không nêu danh từ cụ thể. Không xác định vật ấy trong chính văn giúp bảo toàn tính không cụ thể của nguồn; chú thích cung cấp cách hiểu rõ hơn theo ngữ cảnh mà không biến nó thành chi tiết chắc chắn của chính câu này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'anh' cho người được chữa lành, 'Đức Chúa Trời' cho θεός, và cấu trúc 'vừa đi vừa' để thể hiện phân từ đồng thời. Dấu chú thích [a] đặt sau toàn câu vì chú thích giải thích cụm chỉ vật được nhấc lên trong câu.
