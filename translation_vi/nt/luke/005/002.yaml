revisions:
- from: Ngài thấy hai chiếc thuyền đậu bên hồ, còn những người đánh cá đã rời thuyền[a] và đang giặt lưới.
  to: Ngài thấy hai chiếc thuyền ở bên hồ, còn những người đánh cá đã xuống khỏi thuyền[a] và đang giặt lưới.
  rationale: Điều chỉnh tối thiểu để tránh thêm sắc thái neo/đỗ vào trạng thái tĩnh tại của thuyền và để dịch trực tiếp hơn hành động xuống khỏi thuyền. Thì hoàn thành trong “đã xuống” và thể tiếp diễn trong “đang giặt” vẫn phản ánh quan hệ giữa phân từ aorist với động từ chính ở thì chưa hoàn thành.
  reviewer_model: gpt-5.6-terra
