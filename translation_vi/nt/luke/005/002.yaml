  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: vi
  text: Ngài thấy hai chiếc thuyền ở bên hồ, còn những người đánh cá đã xuống khỏi thuyền[a] và đang giặt lưới.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã rời khỏi thuyền.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: thấy
  rationale: Động từ aorist của ὁράω trong lời kể được chuyển tự nhiên là “thấy”, không thêm sắc thái bất ngờ như “để ý thấy”.
- source_word: δύο πλοῖα
  choice: hai chiếc thuyền
  rationale: Trong bối cảnh đánh cá trên hồ, “thuyền” là cách gọi hiện đại và thích hợp hơn “tàu”.
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: đậu bên hồ
  rationale: ἑστῶτα mô tả hai chiếc thuyền ở vị trí cố định; “đậu” là cách nói tự nhiên trong tiếng Việt đối với thuyền và không khẳng định cụ thể rằng chúng đã được neo. παρά với đối cách chỉ vị trí dọc bên hồ.
- source_word: οἱ δὲ ἁλιεῖς
  choice: còn những người đánh cá
  rationale: “Còn” thể hiện sự chuyển cảnh và tương phản nhẹ của δέ giữa vị trí của thuyền và hoạt động của những người đánh cá.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: đã rời thuyền
  rationale: Phân từ aorist chỉ hành động xảy ra trước hành động chính. “Đã rời thuyền” vừa rõ trình tự vừa tự nhiên; đại từ số nhiều αὐτῶν quy chiếu về hai chiếc thuyền.
- source_word: ἔπλυνον
  choice: đang giặt
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn trong khung cảnh; “đang giặt” giữ được thể tiến hành.
- source_word: τὰ δίκτυα
  choice: lưới
  rationale: “Lưới” diễn đạt tự nhiên danh từ số nhiều theo ngữ cảnh tiếng Việt mà không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo mạch văn; “đậu bên hồ” và “giặt lưới” là cách diễn đạt tự nhiên trong tiếng Việt. Dấu chú thích được đặt ngay sau cụm từ mà chú thích giải thích.
