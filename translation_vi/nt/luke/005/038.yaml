  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: vi
  text: Nhưng rượu mới phải được đổ vào bầu da còn mới[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rượu mới phải được đổ vào bầu da mới.” Tiếng Hy Lạp dùng hai tính từ khác nhau: νέος (“mới”, nhất là về thời gian) cho rượu và καινός (“mới/còn mới”, nhất là về phẩm chất hoặc tình trạng) cho bầu da.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Liên từ chỉ sự tương phản với cách làm không thích hợp được nói đến ở câu trước; “Nhưng” tự nhiên và rõ trong tiếng Việt.
- source_word: οἶνον νέον
  choice: rượu mới
  rationale: νέον trực tiếp bổ nghĩa cho οἶνον, chỉ rượu mới làm; “rượu mới” là cách diễn đạt chuẩn và dễ hiểu.
- source_word: εἰς
  choice: vào
  rationale: Giới từ diễn tả hướng chuyển động vào trong vật chứa.
- source_word: ἀσκοὺς
  choice: bầu da
  rationale: ἀσκός là vật chứa chất lỏng làm bằng da. “Bầu da” diễn đạt gọn, tự nhiên và giữ được đặc điểm văn hóa của vật dụng.
- source_word: καινοὺς
  choice: còn mới
  rationale: καινός nhấn mạnh tình trạng mới, chưa cũ hoặc còn thích hợp để sử dụng. “Còn mới” giúp phần nào phân biệt với νέος dùng cho rượu mà vẫn tự nhiên trong tiếng Việt.
- source_word: βλητέον
  choice: phải được đổ
  rationale: Tính từ động từ βλητέον diễn tả điều cần phải làm. Với rượu và vật chứa, “đổ” tự nhiên hơn cách dịch máy móc là “đặt” hay “bỏ”; thể bị động giữ sắc thái vô nhân xưng.
theological_decisions:
- issue: Phân biệt νέος và καινός trong cùng một câu
  choice: Dịch νέος là “mới” và καινός là “còn mới”
  alternative: Dịch cả hai từ là “mới”
  rationale: Bản Hy Lạp dùng hai tính từ khác nhau. Cách dịch này không tuyệt đối hóa khác biệt ngữ nghĩa nhưng vẫn cho thấy καινός mô tả tình trạng thích hợp của bầu da, đồng thời bảo toàn điểm nhấn của hình ảnh.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. “Bầu da” giữ hình ảnh vật chứa bằng da trong bối cảnh cổ; cấu trúc ngắn gọn phù hợp với tính chất châm ngôn của câu.
