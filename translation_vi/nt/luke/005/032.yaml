id: LUK.5.32
reference: Luke 5:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: vi
  text: Tôi đến không phải để kêu gọi người công chính, nhưng để kêu gọi những người tội lỗi ăn năn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để họ ăn năn.” Cụm từ Hy Lạp εἰς μετάνοιαν diễn tả mục đích hoặc đích hướng đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Tôi đến
  rationale: Thì hoàn thành diễn tả việc đến với kết quả và sứ mạng còn hiệu lực trong hiện tại; tiếng Việt tự nhiên dùng “Tôi đến” trong lời tuyên bố về mục đích.
- source_word: καλέσαι
  choice: kêu gọi
  rationale: Giữ được nghĩa rộng của lời gọi, không thu hẹp thành lời mời nhẹ nhàng hay mệnh lệnh cưỡng bách.
- source_word: δικαίους
  choice: người công chính
  rationale: Tính từ được dùng như danh từ, chỉ những người thuộc phạm trù “công chính”; cách dịch không quyết định họ thật sự công chính hay chỉ được xem là như vậy.
- source_word: ἁμαρτωλοὺς
  choice: những người tội lỗi
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại và giữ sắc thái đạo đức-xã hội của danh từ chỉ người trong ngữ cảnh.
- source_word: εἰς μετάνοιαν
  choice: ăn năn
  rationale: εἰς diễn tả mục đích hoặc đích hướng đến; sau “kêu gọi”, cấu trúc động từ “ăn năn” tự nhiên hơn trong tiếng Việt mà vẫn truyền đạt ý nghĩa của μετάνοια.
theological_decisions:
- issue: Liệu câu này phủ nhận sự tồn tại của người thật sự công chính hay nói theo cách phân loại xã hội/hiện tượng
  choice: Giữ nguyên sự đối lập giữa “người công chính” và “những người tội lỗi”, không thêm lời giải thích.
  alternative: “những người tự cho mình là công chính” hoặc “những người được xem là công chính”
  rationale: Bản văn không nêu rõ sự mỉa mai hay tự nhận; thêm điều kiện sẽ giải quyết thay cho người đọc một căng thẳng thần học vốn có trong câu.
- issue: Sắc thái của μετάνοια
  choice: “ăn năn”
  alternative: “thay đổi tâm trí” hoặc “sự ăn năn”
  rationale: “Ăn năn” là cách nói tự nhiên, trang trọng và quen thuộc để chỉ sự đổi hướng nội tâm và đời sống; “thay đổi tâm trí” dễ bị hiểu đơn thuần là đổi ý kiến, còn danh từ “đến sự ăn năn” kém tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại “để kêu gọi” ở vế sau nhằm làm rõ cấu trúc tương phản trong tiếng Việt; không thêm cách hiểu giáo phái về “người công chính”.
