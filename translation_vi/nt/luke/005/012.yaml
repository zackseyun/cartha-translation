source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: vi
  text: 'Khi Đức Giê-su đang ở một trong các thành, thì kìa, có một người bị bệnh phong khắp mình.[a] Vừa thấy Đức Giê-su, người ấy phủ phục và khẩn cầu Ngài: “Lạy Chúa, nếu Ngài muốn, Ngài có thể làm cho con được sạch.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mình đầy bệnh phong.” Nguyên văn Hy Lạp nói “đầy bệnh phong,” nhấn mạnh tình trạng trầm trọng và lan khắp của người ấy. Từ Hy Lạp này có thể chỉ nhiều chứng bệnh ngoài da, không chỉ riêng bệnh Hansen ngày nay.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “thanh tẩy con.” Động từ này có thể nói đến việc làm cho sạch về thể chất, đồng thời có các phương diện nghi lễ và xã hội, chứ không chỉ việc chữa bệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: Khi Đức Giê-su đang ở
  rationale: Chuyển công thức trần thuật cùng kết cấu chỉ thời gian sang tiếng Việt tự nhiên; ngữ cảnh cho thấy đại từ chỉ Đức Giê-su.
- source_word: μιᾷ τῶν πόλεων
  choice: một trong các thành
  rationale: πόλις có thể chỉ thành hoặc thị trấn; “thành” ngắn gọn, trang trọng và không nhất thiết hàm ý một đô thị lớn.
- source_word: ἰδοὺ
  choice: thì kìa
  rationale: Giữ sắc thái đột ngột, sống động của dấu hiệu diễn ngôn trong lời kể của Lu-ca.
- source_word: πλήρης λέπρας
  choice: mình đầy bệnh phong hủi
  rationale: Giữ hình ảnh nhấn mạnh “đầy” của πλήρης và cách gọi truyền thống cho λέπρα, đồng thời diễn đạt mức độ trầm trọng bằng tiếng Việt dễ hiểu.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: sấp mặt xuống
  rationale: Diễn tả đúng tư thế phủ phục, thể hiện sự hạ mình và lời cầu xin khẩn thiết.
- source_word: ἐδεήθη αὐτοῦ
  choice: khẩn cầu Ngài
  rationale: Truyền đạt sức nặng của lời nài xin tha thiết, mạnh hơn cách nói trung tính “xin”.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: “Chúa” giữ được sự tôn kính và khả năng hàm chứa ý nghĩa Kitô học; “Lạy” là hô cách tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἐὰν θέλῃς
  choice: nếu Ngài muốn
  rationale: Diễn đạt trực tiếp ý chí hay sự sẵn lòng, không biến câu nói thành nghi vấn về khả năng của Đức Giê-su.
- source_word: δύνασαί με καθαρίσαι
  choice: Ngài có thể thanh tẩy con
  rationale: “Có thể” diễn đạt năng lực; “thanh tẩy” giữ cả bình diện chữa lành thể lý lẫn sự sạch về nghi lễ và xã hội trong καθαρίζω.
theological_decisions:
- issue: Ý nghĩa của λέπρα và καθαρίζω trong trình thuật chữa lành
  choice: Dùng “bệnh phong hủi” và “thanh tẩy”
  alternative: Dùng “bệnh ngoài da” và “chữa lành”
  rationale: Ngôn ngữ Hy Lạp không chỉ nói đến bệnh tật mà còn nhấn mạnh sự sạch, vốn có hệ quả nghi lễ và xã hội. “Thanh tẩy” giữ chiều kích ấy mà không phủ nhận việc chữa lành thể lý; chú thích tránh đồng nhất tuyệt đối λέπρα cổ đại với bệnh Hansen hiện đại.
- issue: Cách dịch κύριος khi người bệnh thưa với Đức Giê-su
  choice: Chúa
  alternative: Thầy hoặc ngài
  rationale: “Chúa” giữ sự tôn kính và âm hưởng Kitô học có thể có, nhưng bản dịch không giải quyết quá mức điều mà riêng ngữ cảnh trực tiếp chưa xác định hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su,” “Ngài” và “con” để tạo hệ thống xưng hô tự nhiên trong lời khẩn cầu, đồng thời không thêm một kết luận tín lý vượt quá câu Hy Lạp. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
