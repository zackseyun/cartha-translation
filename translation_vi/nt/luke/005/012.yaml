- from: 'Khi Đức Giê-su đang ở một trong các thành, thì kìa, có một người mình đầy bệnh phong hủi.[a] Vừa thấy Đức Giê-su, người ấy sấp mặt xuống và khẩn cầu Ngài: “Lạy Chúa, nếu Ngài muốn, Ngài có thể thanh tẩy con.”[b]'
  to: 'Khi Đức Giê-su đang ở một trong các thành, thì kìa, có một người bị bệnh phong khắp mình.[a] Vừa thấy Đức Giê-su, người ấy phủ phục và khẩn cầu Ngài: “Lạy Chúa, nếu Ngài muốn, Ngài có thể làm cho con được sạch.”[b]'
  rationale: Chỉnh các cách diễn đạt để tiếng Việt hiện đại tự nhiên hơn, đồng thời bảo toàn lực nhấn của πλήρης và trường nghĩa rộng của λέπρα/καθαρίζω. Không thay đổi trình tự, nội dung hay mức độ mơ hồ của nguyên văn.
