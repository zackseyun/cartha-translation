- from: 'Ngài đưa tay ra chạm vào người ấy và nói: “Ta sẵn lòng; hãy được sạch!” Ngay lập tức, bệnh phong[a] rời khỏi người ấy.'
  to: 'Ngài đưa tay ra chạm vào người ấy và nói: “Ta sẵn lòng; hãy sạch đi!” Ngay lập tức, bệnh phong[a] rời khỏi người ấy.'
  rationale: Chỉ sửa mệnh lệnh “hãy được sạch” thành “hãy sạch đi” để đạt cách diễn đạt hiện đại, tự nhiên và vẫn trung thành với lời truyền khiến người bệnh được thanh sạch. Giữ nguyên cách gọi “bệnh phong” cùng chú thích giải thích phạm vi nghĩa lịch sử của λέπρα.
