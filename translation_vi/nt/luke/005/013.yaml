review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của nguyên văn: hành động đưa tay, sự chạm trực tiếp, ý muốn/sẵn lòng, mệnh lệnh được thanh sạch, và việc bệnh biến mất tức khắc. Tuy nhiên, “hãy được sạch” là lối giữ thể bị động quá sát mặt chữ và không tự nhiên trong tiếng Việt; mệnh lệnh “hãy sạch đi” diễn đạt đúng hiệu lực lời phán mà không làm mất trường nghĩa sạch/uế.'
  naturalness: Câu văn nhìn chung rõ ràng và trang trọng. Thay “hãy được sạch” bằng “hãy sạch đi” làm lời nói trực tiếp tự nhiên, dứt khoát hơn trong tiếng Việt hiện đại. “Người ấy” và “rời khỏi người ấy” giữ giọng điệu tôn trọng, trung tính.
  terminology: “Bệnh phong” có thể dùng trong văn mạch Kinh Thánh nếu được chú thích về phạm vi rộng hơn của λέπρα. Chú thích hiện có làm rõ rằng thuật ngữ cổ không nhất thiết đồng nhất với bệnh Hansen hiện đại. “Sạch” bảo toàn cách nói thanh sạch của καθαρίζω, không thu hẹp thành chỉ sự chữa bệnh.
  issues:
  - severity: medium
    issue: “Hãy được sạch” không tự nhiên trong lời mệnh lệnh tiếng Việt.
    rationale: Dù phản ánh thể bị động của καθαρίσθητι, cụm này nghe gượng và ít dùng. “Hãy sạch đi!” là mệnh lệnh tự nhiên trong tiếng Việt, vẫn biểu thị kết quả thanh sạch do lời phán đem lại và giữ được chiều kích sạch/uế của nguyên văn.
