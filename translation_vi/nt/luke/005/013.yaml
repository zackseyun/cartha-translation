  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: vi
  text: 'Ngài đưa tay ra chạm vào người ấy và nói: “Ta sẵn lòng; hãy sạch đi!” Ngay lập tức, bệnh phong[a] rời khỏi người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay, theo nghĩa rộng hơn: “bệnh ngoài da.” Trong cách dùng của Kinh Thánh, từ Hy Lạp λέπρα có thể chỉ nhiều chứng bệnh ngoài da nghiêm trọng, chứ không chỉ bệnh phong (bệnh Hansen) theo cách hiểu hiện đại.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: đưa tay ra
  rationale: Diễn đạt tự nhiên hành động đưa tay về phía người bệnh, đồng thời giữ trình tự của phân từ bất định đứng trước động từ chính.
- source_word: ἥψατο αὐτοῦ
  choice: chạm vào người ấy
  rationale: Dạng trung của ἅπτω với đối tượng ở sở hữu cách mang nghĩa thông thường là chạm vào; cách dịch này cũng giữ rõ hành động tiếp xúc trực tiếp.
- source_word: Θέλω
  choice: Ta sẵn lòng
  rationale: Trong ngữ cảnh đáp lại lời thỉnh cầu của người bệnh, động từ này biểu thị sự sẵn lòng và chủ ý, không chỉ một mong muốn chung chung hay thì tương lai.
- source_word: καθαρίσθητι
  choice: hãy được sạch
  rationale: Giữ thể bị động mệnh lệnh và trường nghĩa sạch/uế của καθαρίζω, vốn bao gồm sự chữa lành thể chất cùng chiều kích thanh sạch về nghi lễ và xã hội.
- source_word: εὐθέως
  choice: ngay lập tức
  rationale: Tương đương rõ ràng, tự nhiên với trạng từ chỉ sự việc xảy ra tức thì.
- source_word: ἡ λέπρα
  choice: bệnh phong
  rationale: Đây là cách gọi truyền thống, dễ nhận biết trong văn cảnh Kinh Thánh; chú thích nêu rõ phạm vi nghĩa cổ rộng hơn bệnh Hansen hiện đại.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: rời khỏi người ấy
  rationale: Giữ hình ảnh căn bệnh rời đi trong nguyên văn mà vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch καθαρίσθητι trong câu chuyện chữa người mắc bệnh phong
  choice: hãy được sạch
  alternative: hãy được chữa lành; hãy trở nên thanh sạch
  rationale: Nguyên văn nhấn mạnh sự làm cho sạch, vừa liên quan đến khỏi bệnh vừa liên quan đến tình trạng sạch/uế. Cách dịch được chọn không thu hẹp ý nghĩa thành chữa trị y khoa, cũng không làm nghiêng hẳn về nghi lễ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ta” phù hợp với lời trực tiếp của Chúa Giê-su trong văn cảnh trang trọng; “người ấy” tránh sắc thái xa cách hoặc miệt thị. Dấu chú thích được đặt sau “bệnh phong,” đúng với nội dung chú thích, thay vì sau “tay” như vị trí có vẻ bị lệch trong lớp tham khảo tiếng Anh.
