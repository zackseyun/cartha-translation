revisions:
- from: Và này, có những người cuối cùng sẽ trở thành những người đầu tiên, và có những người đầu tiên sẽ trở thành những người cuối cùng.
  to: Và kìa, có những người đang ở cuối sẽ ở đầu, và có những người đang ở đầu sẽ ở cuối.
  rationale: Sửa động từ tương lai thành «sẽ ở» để phản ánh εἰμί mà không thêm ý về tiến trình biến đổi. Thêm «đang ở» tại hai vị ngữ hiện tại giúp tiếng Việt biểu đạt quan hệ hiện tại–tương lai vốn có trong câu Hy Lạp. Bản sửa vẫn để ngỏ phạm vi của «đầu» và «cuối».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ được cấu trúc song hành, lực tồn tại của εἰσίν và tính khái quát của lời đảo ngược. Tuy nhiên, «sẽ trở thành» dịch ἔσονται theo hướng một tiến trình/thay đổi trạng thái mà động từ εἰμί chỉ nói «sẽ là».
  naturalness: «Và này» và việc lặp «những người ... cùng» hơi gượng trong tiếng Việt hiện đại. «Và kìa» cùng «đang ở cuối/ở đầu» diễn đạt tự nhiên hơn, vẫn trang trọng và giữ rõ sự đối xứng.
  terminology: «Ở cuối/ở đầu» bảo toàn cặp ἔσχατοι/πρῶτοι như các vị trí hay thứ hạng, không diễn giải chúng thành phẩm chất đạo đức hoặc một nhóm người xác định.
  issues:
  - severity: medium
    issue: «sẽ trở thành» cho ἔσονται
    rationale: ἔσονται là thì tương lai của εἰμί («sẽ là»), không tự nó khẳng định quá trình «trở thành». Dù ý đảo ngược có thể hàm ý thay đổi, bản dịch nên không thêm sắc thái đó.
  - severity: low
    issue: Cách mở đầu «Và này»
    rationale: Có thể hiểu được nhưng ít tự nhiên trong văn phong Việt hiện đại. «Và kìa» là một lời gọi chú ý trang trọng, ngắn gọn, tương ứng tốt với καὶ ἰδού.
  revised_text: Và kìa, có những người đang ở cuối sẽ ở đầu, và có những người đang ở đầu sẽ ở cuối.
  revised_footnotes: []
