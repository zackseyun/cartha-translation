id: LUK.13.30
reference: Luke 13:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: vi
  text: Và kìa, có những người đang ở cuối sẽ ở đầu, và có những người đang ở đầu sẽ ở cuối.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: này
  rationale: Dùng từ gọi sự chú ý tự nhiên và trang trọng trong tiếng Việt, giữ chức năng diễn ngôn của ἰδού mà không buộc câu nói vào nghĩa nhìn thấy theo không gian.
- source_word: ἔσχατοι
  choice: những người cuối cùng
  rationale: Giữ ý về vị trí cuối hoặc thứ hạng thấp và duy trì phép đối xứng ngắn gọn với πρῶτοι; không chuyển thành nghĩa luân lý như “kém cỏi nhất”.
- source_word: πρῶτοι
  choice: những người đầu tiên
  rationale: Là cách đối ứng trực tiếp, tự nhiên với “những người cuối cùng”, đồng thời không giới hạn vào một loại địa vị cụ thể.
- source_word: οἳ ἔσονται
  choice: sẽ trở thành
  rationale: Diễn đạt rõ sự đảo ngược trong tương lai. “Sẽ là” sát hình thức hơn nhưng kém tự nhiên trong cấu trúc đối lập này; “trở thành” không xác định nguyên nhân hay phạm vi của sự thay đổi.
- source_word: εἰσὶν
  choice: có những người
  rationale: Bảo toàn lực tồn tại của động từ Hy Lạp và tạo câu tiếng Việt tự nhiên, không thêm ý rằng mọi người thuộc từng nhóm đều bị đảo ngược.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ mở đầu và liên kết giữa hai vế, qua đó bảo toàn nhịp song song của câu nói.
theological_decisions:
- issue: Phạm vi của lời nói về sự đảo ngược
  choice: Diễn đạt như một nguyên tắc chung về sự đảo ngược vị trí, không nêu rõ các nhóm dân tộc, xã hội hay thứ hạng trong ngày phán xét.
  alternative: Giải thích cụ thể là sự đảo ngược giữa dân ngoại và người Do Thái, giữa người khiêm nhường và người kiêu ngạo, hoặc giữa các thứ hạng trong sự phán xét cuối cùng.
  rationale: Ngữ cảnh liên quan đến việc vào vương quốc, nhưng câu Hy Lạp vẫn được phát biểu ngắn gọn và rộng. Bản dịch giữ nguyên độ mở và sức căng thần học ấy thay vì đưa một cách giải thích riêng vào chính câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc song song cùng sự lặp lại “những người… cuối cùng/đầu tiên” được giữ để tái hiện tính cách ngôn và nhịp đảo nghịch của nguyên văn.
