id: LUK.13.17
reference: Luke 13:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: vi
  text: Trong khi Ngài đang nói những điều ấy, tất cả những người chống đối Ngài[a] đều bị bẽ mặt, còn cả đám đông thì vui mừng vì tất cả những việc vinh hiển Ngài đang làm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi đối thủ của Ngài”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “mọi việc kỳ diệu” hoặc “mọi việc vẻ vang”. Tiếng Hy Lạp nói “những việc vinh hiển”, một cách diễn đạt rộng có thể bao gồm các việc quyền năng Ngài làm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Khi Ngài đang nói những điều ấy
  rationale: Diễn đạt kết cấu sở hữu cách tuyệt đối với phân từ hiện tại, giữ được tính đồng thời và tiếp diễn của hành động nói.
- source_word: κατῃσχύνοντο
  choice: đều bị bẽ mặt
  rationale: Giữ sắc thái bị động và sự mất thể diện công khai; dạng chưa hoàn thành cho thấy tình trạng này diễn ra khi Đức Giê-su đang nói.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: những người chống đối Ngài
  rationale: Giữ lực động từ của phân từ, cho thấy họ đang chủ động chống đối, thay vì chỉ gắn cho họ danh xưng cố định là 'đối thủ'.
- source_word: πᾶς ὁ ὄχλος
  choice: cả đoàn dân
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện đám đông xét như một toàn thể.
- source_word: ἔχαιρεν
  choice: thì vui mừng
  rationale: Ngữ cảnh cùng dạng chưa hoàn thành diễn tả phản ứng vui mừng đang tiếp diễn; từ 'thì' làm nổi bật sự tương phản với những người chống đối.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: vì mọi việc vinh quang
  rationale: Giữ nghĩa rộng của ἔνδοξος là vinh quang, vẻ vang hoặc kỳ diệu, đồng thời không thu hẹp câu chỉ còn nói đến phép lạ.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: Ngài đang làm
  rationale: 'Diễn đạt tự nhiên phân từ hiện tại và giữ rõ tác nhân của ὑπό với sở hữu cách: chính Ngài thực hiện các việc ấy.'
theological_decisions:
- issue: Bản chất của 'những việc vinh quang'
  choice: Dịch rộng là 'mọi việc vinh quang'.
  alternative: mọi việc kỳ diệu; mọi phép lạ
  rationale: Ngữ cảnh có việc chữa lành, nhưng ἐνδόξοις không tự nó giới hạn vào phép lạ. Cách dịch rộng giữ nguyên sức căng của câu và bao gồm cả những việc quyền năng lẫn đáng tôn quý.
- issue: Tác nhân trong ὑπ’ αὐτοῦ
  choice: Diễn đạt trực tiếp là 'Ngài đang làm'.
  alternative: đang được thực hiện qua Ngài
  rationale: Giới từ ὑπό với sở hữu cách chỉ tác nhân; bản dịch trực tiếp quy các việc ấy cho Đức Giê-su mà không đưa vào sắc thái công cụ gián tiếp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo văn cảnh; “bị bẽ mặt” tự nhiên hơn lối nói thụ động “bị làm cho hổ thẹn” mà vẫn giữ sắc thái công khai. Hai vế được nối bằng “còn” để thể hiện rõ sự tương phản trong câu Hy Lạp.
