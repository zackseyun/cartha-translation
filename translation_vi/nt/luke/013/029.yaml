source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: vi
  text: Người ta sẽ đến từ phương đông và phương tây, từ phương bắc và phương nam, và sẽ ngồi dự tiệc[a] trong vương quốc Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn nói đến việc ngả mình tại bàn theo phong tục dự tiệc thời xưa; cũng có thể dịch là “sẽ ngồi xuống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: người ta sẽ đến
  rationale: Động từ tương lai của ἥκω mang nghĩa “đến”; chủ ngữ số nhiều không được nêu rõ, nên “người ta” diễn đạt tự nhiên mà không xác định thêm thành phần dân tộc.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ἀπὸ βορρᾶ καὶ νότου
  choice: từ đông, tây, bắc, nam
  rationale: Các danh từ chỉ bốn phương trời, diễn tả phạm vi địa lý rộng khắp. Cách liệt kê không thêm mạo từ là tự nhiên trong tiếng Việt.
- source_word: ἀνακλιθήσονται
  choice: sẽ ngồi dự tiệc
  rationale: Trong bối cảnh yến tiệc, ἀνακλίνω chỉ việc ngả mình tại bàn ăn theo phong tục cổ. “Ngồi dự tiệc” truyền đạt rõ hình ảnh dùng bữa cho độc giả hiện đại, còn chú thích bảo tồn nét văn hóa cụ thể.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: trong vương quốc Đức Chúa Trời
  rationale: Cách dịch trực tiếp, sáng rõ, giữ nguyên ý nghĩa thần học của βασιλεία τοῦ θεοῦ mà không diễn giải thêm.
theological_decisions:
- issue: Hình ảnh yến tiệc trong vương quốc thời sau cùng
  choice: Giữ rõ ý dự tiệc qua cụm “ngồi dự tiệc”.
  alternative: “ngồi xuống” hoặc chỉ diễn đạt là “vào” vương quốc Đức Chúa Trời
  rationale: Động từ gợi một bữa tiệc, không chỉ hành động ngồi hay việc bước vào vương quốc; bản dịch giữ hình ảnh cụ thể nhưng không thêm chi tiết giáo lý.
- issue: Phạm vi phổ quát theo địa lý
  choice: Dịch thẳng bốn phương “đông, tây, bắc, nam” mà không xác định dân tộc.
  alternative: Nói rõ đây là dân ngoại từ mọi nước
  rationale: Câu này mô tả người ta đến từ mọi hướng nhưng không trực tiếp gọi họ là dân ngoại; không nên biến hàm ý theo văn cảnh thành nội dung minh thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngồi dự tiệc” tự nhiên hơn cách dịch sát hình thức “ngả mình tại bàn”, đồng thời chú thích lưu giữ hình ảnh văn hóa của nguyên ngữ.
