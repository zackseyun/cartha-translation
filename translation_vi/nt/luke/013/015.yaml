source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: vi
  text: 'Nhưng Chúa đáp lại ông: “Các người đạo đức giả! Chẳng phải mỗi người trong các ông, vào ngày Sa-bát, đều tháo dây cho con bò hay con lừa của mình khỏi máng ăn[a], rồi dắt nó đi cho uống nước sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp φάτνη có thể chỉ máng hoặc nơi cho súc vật ăn.
    reason: Nêu phạm vi nghĩa của từ nguồn mà không thay nghĩa chính trong câu.
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Giữ danh xưng tường thuật của Lu-ca dành cho Đức Giê-su và sắc thái Cơ Đốc luận của κύριος, không hạ xuống thành “chủ”.
- source_word: Ὑποκριταί
  choice: Những kẻ đạo đức giả
  rationale: Lời gọi số nhiều mang tính quở trách mạnh; cách diễn đạt này tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἕκαστος ὑμῶν
  choice: mỗi người trong các ông
  rationale: Bảo toàn ý phân phối của ἕκαστος và trực tiếp hướng đến những người đang bị chất vấn.
- source_word: τῷ σαββάτῳ
  choice: trong ngày Sa-bát
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, đồng thời giữ thuật ngữ tôn giáo quen thuộc.
- source_word: λύει
  choice: cởi dây cho
  rationale: Trong ngữ cảnh gia súc bị buộc ở máng ăn, cụm này cụ thể và tự nhiên hơn “tháo” hay “giải thoát”.
- source_word: βοῦν
  choice: bò
  rationale: βοῦς có thể chỉ gia súc thuộc loài bò nói chung; “bò” là từ phổ thông, không áp đặt nghĩa hẹp hơn như “bò đực thiến”.
- source_word: ὄνον
  choice: lừa
  rationale: Tương đương hiện đại, rõ ràng của ὄνος.
- source_word: φάτνης
  choice: máng ăn
  rationale: Chỉ nơi hoặc vật đựng thức ăn cho súc vật; “máng ăn” cụ thể và phù hợp ngữ cảnh con vật được cởi dây khỏi đó.
- source_word: ἀπαγαγὼν
  choice: rồi dắt nó đi
  rationale: 'Diễn đạt tự nhiên trình tự của phân từ aorist: cởi dây rồi dẫn con vật rời chỗ ấy.'
- source_word: ποτίζει
  choice: cho đi uống nước
  rationale: Trong tiếng Việt, “dắt nó đi uống nước” diễn đạt tự nhiên hành động đưa con vật đến nơi để nó uống, giữ đúng ý cung cấp nước uống.
theological_decisions:
- issue: Danh xưng κύριος được người kể chuyện dùng cho Đức Giê-su
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” bảo toàn trọng lượng của danh xưng trong lối kể của Lu-ca mà không thêm lời giải thích thần học ngoài văn bản.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Câu hỏi tu từ được giữ nguyên; “các ông” phù hợp lời quở trách trực tiếp trong bối cảnh mà không dùng đại từ quá cổ.
