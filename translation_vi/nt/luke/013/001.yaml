  to: Đúng vào lúc ấy, có vài người đang có mặt ở đó, báo cho Đức Giê-su về những người Ga-li-lê mà Phi-lát đã trộn máu của họ với các sinh tế của họ.[a]
  rationale: Bản sửa thay cụm chỉ thời gian để tránh sắc thái “lập tức” không được nêu rõ trong tiếng Hy Lạp, và điều chỉnh cách diễn đạt về sự hiện diện của những người báo tin cho tự nhiên hơn. Các tên riêng, thuật ngữ “sinh tế,” quan hệ sở hữu, và tính mơ hồ về hoàn cảnh biến cố đều được giữ nguyên.
