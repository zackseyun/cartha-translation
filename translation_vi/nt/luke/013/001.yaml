  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: vi
  text: Đúng vào lúc ấy, có vài người đang có mặt ở đó, báo cho Đức Giê-su về những người Ga-li-lê mà Phi-lát đã trộn máu của họ với các sinh tế của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã hòa lẫn máu của họ với các sinh tế của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: có mấy người đang ở đó
  rationale: Thể chưa hoàn thành của πάρειμι diễn tả sự hiện diện; δέ là liên từ chuyển ý nhẹ và được thể hiện tự nhiên trong mạch câu bằng cụm mở đầu, không thêm một từ chỉ thời gian vốn không có trong nguyên bản.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: Ngay lúc ấy
  rationale: Giữ sắc thái nhấn mạnh và quy chiếu đến chính thời điểm trong văn cảnh trước.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: báo cho Đức Giê-su
  rationale: ἀπαγγέλλω mang nghĩa trình báo hoặc thuật lại tin tức. Danh xưng được nêu để câu tiếng Việt rõ đại từ quy chiếu trong ngữ cảnh.
- source_word: περὶ τῶν Γαλιλαίων
  choice: về những người Ga-li-lê
  rationale: περί với sở hữu cách nêu đề tài của lời báo; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν
  choice: mà Phi-lát đã trộn máu của họ
  rationale: Giữ hình ảnh trực tiếp, gây sửng sốt của nguyên văn và thể hiện biến cố xảy ra trước lúc được báo lại.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: với các sinh tế của họ
  rationale: Giữ quan hệ sở hữu nhưng không xác định thêm họ đang dâng lễ hay đã mang lễ vật đến, vì nguyên văn để ngỏ điều này.
theological_decisions:
- issue: Tính chất lịch sử và đạo đức trong hành động của Phi-lát
  choice: Dịch thẳng rằng Phi-lát đã trộn máu họ với các sinh tế của họ.
  alternative: Diễn giải thành “giết họ khi họ đang dâng sinh tế.”
  rationale: Câu này không giải thích cụ thể diễn biến hay ý nghĩa thần học của sự kiện; bản dịch giữ nguyên lối nói khắc nghiệt và sự căng thẳng của nguyên văn.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “sinh tế” để chỉ lễ vật hiến tế trong ngữ cảnh thờ phượng; giữ nguyên sự mơ hồ của đại từ sở hữu. Tên riêng được viết theo lối phiên âm quen dùng: Đức Giê-su, Ga-li-lê, Phi-lát.'
