revisions:
- from: 'Ngay chính giờ ấy, có mấy người Pha-ri-si đến gần và nói với Đức Giê-su: “Hãy rời khỏi đây và đi nơi khác, vì Hê-rốt muốn giết thầy.”'
  to: 'Đúng ngay lúc ấy, một số người Pha-ri-si đến gặp Đức Giê-su và nói với ngài: “Hãy rời khỏi đây và đi đi, vì Hê-rốt muốn giết ngài.”'
  rationale: Chỉnh câu cho tự nhiên trong tiếng Việt hiện đại, đồng thời bảo toàn tính bất định của τινες, sự nhấn mạnh thời điểm, hai mệnh lệnh rời đi, và sự không xác định về động cơ của những người Pha-ri-si. Không cần chú thích vì không có biến thể văn bản hay phương án dịch nào cần thiết để hiểu câu.
