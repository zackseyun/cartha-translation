  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: vi
  text: 'Đúng ngay lúc ấy, một số người Pha-ri-si đến gặp Đức Giê-su và nói với ngài: “Hãy rời khỏi đây và đi đi, vì Hê-rốt muốn giết ngài.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: Ngay chính giờ ấy
  rationale: Diễn đạt thời điểm cụ thể và sắc thái nhấn mạnh của αὐτῇ; tự nhiên trong tiếng Việt mà không làm thành một khoảng thời gian chung chung.
- source_word: προσῆλθάν
  choice: đến gần
  rationale: Giữ ý tiến đến hoặc đến gần Đức Giê-su, thay vì chỉ nói chung là “đến”.
- source_word: τινες Φαρισαῖοι
  choice: có mấy người Pha-ri-si
  rationale: τινες mang nghĩa bất định; “mấy người” là cách nói hiện đại, không xác định họ là những ai.
- source_word: λέγοντες αὐτῷ
  choice: và nói với Đức Giê-su
  rationale: Chuyển phân từ đồng thời thành động từ hữu hạn để câu tiếng Việt tự nhiên; dùng tên để tránh đại từ mơ hồ.
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: Hãy rời khỏi đây và đi nơi khác
  rationale: Giữ hai mệnh lệnh liên tiếp và ý chuyển đi khỏi địa điểm hiện tại, đồng thời tránh cách diễn đạt trùng lặp, gượng gạo.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu trực tiếp lý do của lời cảnh báo bằng liên từ thông dụng, rõ ràng.
- source_word: Ἡρῴδης
  choice: Hê-rốt
  rationale: Phiên âm tên riêng theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: θέλει
  choice: muốn
  rationale: Giữ nghĩa mong muốn của θέλω, không tăng mức độ thành một ý định hoặc kế hoạch đã được xác lập.
- source_word: σε
  choice: thầy
  rationale: Trong lời trực tiếp của các người Pha-ri-si nói với Đức Giê-su, “thầy” là đại từ xưng hô tự nhiên và kính trọng trong tiếng Việt; không thêm danh hiệu thần học.
- source_word: ἀποκτεῖναι
  choice: giết
  rationale: Tương đương trực tiếp và rộng của động từ nguồn, không hàm ý riêng một cuộc hành quyết chính thức.
theological_decisions:
- issue: Động cơ của những người Pha-ri-si khi cảnh báo
  choice: Trình bày lời nói như một lời cảnh báo mà không xác định động cơ của họ.
  alternative: Diễn giải họ là thật lòng bảo vệ Đức Giê-su, hoặc là đang đe dọa và tìm cách buộc ngài rời đi.
  rationale: Bản Hy Lạp chỉ thuật lại hành động và lời nói, không nói rõ họ chân thành, lừa dối hay liên kết với Hê-rốt; bản dịch giữ nguyên tính bỏ ngỏ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hai hành động mệnh lệnh trong nguyên văn nhưng diễn đạt “đi nơi khác” để tránh cụm “rời khỏi đây và đi khỏi đây” thiếu tự nhiên. Không thêm chú thích vì các phương án từ vựng không tạo ra khác biệt đủ quan trọng trong tiếng Việt.
