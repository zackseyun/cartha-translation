  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: vi
  text: 'Ngài đáp: “Các ông tưởng rằng những người Ga-li-lê ấy đã trở thành những người tội lỗi hơn tất cả những người Ga-li-lê vì họ phải chịu những việc đó sao?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp lời họ
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp ‘đáp lại mà nói’, đồng thời giữ ý Đức Giê-su phản hồi điều vừa được thuật lại.
- source_word: ἁμαρτωλοὶ παρὰ πάντας
  choice: tội lỗi hơn tất cả
  rationale: Giữ phép so sánh của παρὰ πάντας, không diễn giải thêm rằng họ phạm nhiều hay nặng hơn.
- source_word: ἐγένοντο
  choice: đã trở thành
  rationale: Phản ánh sát động từ γίνομαι trong bản SBLGNT và giữ nguyên sắc thái có thể gây căng thẳng của câu thay vì làm phẳng thành ‘là’.
- source_word: πεπόνθασιν
  choice: phải chịu
  rationale: Thể hoàn thành chỉ điều họ đã trải qua với hệ quả còn được nhắc đến; tiếng Việt tự nhiên dùng ‘phải chịu’ trong ngữ cảnh tai họa.
theological_decisions:
- issue: Quan hệ được giả định giữa tội lỗi và tai họa
  choice: 'Giữ dưới dạng câu hỏi: ‘tội lỗi hơn… vì họ phải chịu… sao?’'
  alternative: Diễn giải rõ rằng tai họa không chứng minh họ tội lỗi hơn
  rationale: Câu này nêu giả định để Đức Giê-su bác bỏ ở câu tiếp theo; không đưa lời giải của câu 3 vào câu 2.
- issue: Sắc thái của ἐγένοντο
  choice: đã trở thành tội lỗi hơn
  alternative: là những người tội lỗi hơn
  rationale: Theo chứng cứ từ nguyên văn và lớp tham khảo đã được kiểm định, giữ động thái ‘trở thành’ dù cách nói này kém quen thuộc hơn trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ theo ngữ cảnh quy chiếu đến Đức Giê-su; ‘các ông’ phù hợp lời nói trực tiếp với một nhóm người, không thêm sắc thái miệt thị. Không cần chú thích.
