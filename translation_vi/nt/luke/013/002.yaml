revisions:
- from: 'Ngài đáp lời họ: “Các ông tưởng rằng những người Ga-li-lê ấy đã trở thành tội lỗi hơn tất cả những người Ga-li-lê khác vì họ phải chịu những việc đó sao?”'
  to: 'Ngài đáp: “Các ông tưởng rằng những người Ga-li-lê ấy đã trở thành những người tội lỗi hơn tất cả những người Ga-li-lê vì họ phải chịu những việc đó sao?”'
  rationale: Chỉ bổ sung “những người” sau “trở thành” để dịch đúng ἁμαρτωλοί và làm câu tiếng Việt ngữ pháp, tự nhiên hơn. Giữ “đã trở thành” để tôn trọng sắc thái của ἐγένοντο trong bản SBLGNT và English POB audit trail; không thêm diễn giải thần học từ câu kế tiếp.
  reviewer_model: gpt-5.6-terra
