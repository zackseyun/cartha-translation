  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: vi
  text: 'Nhưng người làm vườn đáp lời ông: “Thưa chủ, xin cứ để nó lại trong năm nay nữa[a], cho đến khi tôi đào đất chung quanh nó và bón phân chuồng cho nó[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin tha cho nó” hoặc “xin cứ để nó trong năm nay nữa.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch khái quát hơn: “bón phân cho nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ
  choice: Nhưng người làm vườn đáp lời ông
  rationale: Cụm phân từ đi với động từ hiện tại là lối kể chuyện chịu ảnh hưởng Sê-mít. “Đáp lời ông” diễn đạt tự nhiên trong tiếng Việt, giữ cả ý trả lời lẫn người được nói với; chủ ngữ được nêu là “người làm vườn” theo ngữ cảnh trực tiếp của dụ ngôn.
- source_word: Κύριε
  choice: Thưa chủ
  rationale: Trong bối cảnh dụ ngôn, đây là lời xưng hô kính trọng với chủ vườn. “Thưa chủ” tự nhiên và không áp đặt rằng người nói đang trực tiếp dùng một tước hiệu thần học.
- source_word: ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος
  choice: xin cứ để nó lại trong năm nay nữa
  rationale: Cách dịch này giữ nghĩa cho cây tiếp tục ở nguyên đó thêm cả năm nay, đồng thời không đưa ý “tha” hay “khỏi chặt” vốn chỉ được hàm ý từ ngữ cảnh vào chính câu dịch.
- source_word: ἕως ὅτου
  choice: cho đến khi
  rationale: Giữ rõ giới hạn thời gian được diễn đạt trong nguyên văn, dù tiếng Việt cũng có thể diễn đạt trôi chảy hơn bằng “để tôi”.
- source_word: σκάψω περὶ αὐτὴν
  choice: tôi đào đất chung quanh nó
  rationale: Giữ hình ảnh cụ thể của σκάπτω là đào, đồng thời thêm “đất” là bổ ngữ tự nhiên và hiển nhiên trong ngữ cảnh canh tác.
- source_word: βάλω κόπρια
  choice: bón phân cho nó
  rationale: Trong ngữ cảnh trồng trọt, đây là cách nói tự nhiên trong tiếng Việt. Chú thích giữ lại nghĩa cụ thể hơn của κόπρια là phân chuồng.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô thuộc dụ ngôn
  choice: Thưa chủ
  alternative: Lạy Chúa; thưa ngài
  rationale: Người làm vườn đang nói với chủ vườn trong thế giới câu chuyện. “Thưa chủ” bảo toàn quan hệ chủ–người làm mà không buộc danh xưng này thành lời trực tiếp gọi Đức Chúa Trời; chiều kích thần học của dụ ngôn vẫn được để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời thoại dùng “thưa chủ” phù hợp quan hệ trong dụ ngôn. Hai dấu chú thích [a], [b] được đặt ngay sau các cụm từ tương ứng, tránh sự lệch vị trí có trong lớp tham khảo tiếng Anh.
