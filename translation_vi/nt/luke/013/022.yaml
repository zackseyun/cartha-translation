source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: vi
  text: Ngài đi qua các thành và làng mạc, vừa dạy dỗ vừa tiến về Giê-ru-sa-lem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến Giê-ru-sa-lem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: đi qua
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành trình đang tiếp diễn qua nhiều nơi; trong tiếng Việt, ngữ cảnh cùng các phân từ theo sau đã làm rõ sắc thái tiếp diễn.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: qua các thành và làng mạc
  rationale: κατά với đối cách ở đây chỉ sự di chuyển qua nhiều địa điểm theo tính phân bố; cách dịch giữ sự phân biệt giữa khu dân cư lớn và nhỏ.
- source_word: διδάσκων
  choice: vừa dạy dỗ
  rationale: Phân từ hiện tại chỉ hoạt động diễn ra đồng thời với hành trình; cấu trúc “vừa… vừa…” diễn đạt tự nhiên mối quan hệ này.
- source_word: πορείαν ποιούμενος
  choice: vừa tiến
  rationale: Thành ngữ mang nghĩa thực hiện hành trình hoặc tiếp tục lên đường; “tiến” thể hiện sự di chuyển có hướng đích mà không lặp lại từ “đi” một cách nặng nề.
- source_word: εἰς Ἱεροσόλυμα
  choice: về Giê-ru-sa-lem
  rationale: εἰς nêu hướng và đích của hành trình. “Về” tự nhiên trong tiếng Việt và phù hợp với sự tiến triển đang diễn ra, nhưng cũng có thể hiểu trực tiếp là “đến”.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho địa danh Jerusalem.
theological_decisions:
- issue: Hướng hành trình của Chúa Giê-su đến Giê-ru-sa-lem
  choice: về Giê-ru-sa-lem
  alternative: đến Giê-ru-sa-lem
  rationale: Câu này tóm lược hành trình đang tiếp diễn và nhấn mạnh hướng tiến về đích hơn là việc đã tới nơi. Đây là lựa chọn tường thuật, không nhằm áp đặt một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” theo lối kể kính trọng phổ biến; cấu trúc “vừa… vừa…” làm rõ hai hoạt động đồng thời mà vẫn giữ câu gọn.
