id: LUK.13.19
reference: Luke 13:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: vi
  text: Nước Đức Chúa Trời giống như một hạt cải[a] mà một người đàn ông lấy và ném vào vườn mình. Hạt ấy lớn lên, trở thành một cây[b], và chim trời làm tổ trên các cành của nó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hạt cải” là hạt của một loài cây cải; nguyên văn dùng cách gọi thông thường theo loại cây, không xác định chính xác loài thực vật.
    reason: lexical_clarification
  - marker: b
    text: Nguyên văn Hy Lạp nói “trở thành một cây”, giữ nguyên hình ảnh tăng trưởng lớn lao trong dụ ngôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Nó giống như
  rationale: Giữ công thức so sánh tự nhiên của các dụ ngôn; đại từ “nó” nối lại đối tượng được nói đến trong câu trước.
- source_word: κόκκῳ σινάπεως
  choice: một hạt cải
  rationale: “Hạt cải” là cách nói tự nhiên trong tiếng Việt và diễn đạt đúng κόκκος trong ngữ cảnh một hạt giống của cây cải.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: mà một người đàn ông lấy
  rationale: Giữ nhân vật nam số ít được nêu trong tiếng Hy Lạp, thay vì trung tính hóa thành “một người nào đó”.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: ném vào vườn mình
  rationale: “Ném” giữ sắc thái sinh động của βάλλω; “vườn mình” phản ánh κῆπον ἑαυτοῦ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ηὔξησεν
  choice: Hạt ấy lớn lên
  rationale: “Lớn lên” diễn đạt tự nhiên quá trình tăng trưởng; lặp lại “hạt ấy” giúp chủ ngữ rõ ràng sau câu dài.
- source_word: ἐγένετο εἰς δένδρον
  choice: trở thành một cây
  rationale: Dịch trực tiếp hình ảnh δένδρον, không làm dịu thành “bụi cây” dù hình ảnh có tính phóng đại.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Cụm từ Việt ngữ trang trọng, dễ hiểu, diễn đạt loài chim bay trên trời trong nghĩa không gian của οὐρανός.
- source_word: κατεσκήνωσεν
  choice: làm tổ
  rationale: Trong ngữ cảnh chim và cành cây, “làm tổ” truyền đạt tự nhiên ý cư ngụ hoặc định chỗ của động từ.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: trên các cành của nó
  rationale: “Trên các cành” là cách diễn đạt tự nhiên về vị trí chim làm tổ; “của nó” quy chiếu về cây vừa được nhắc đến.
theological_decisions:
- issue: Cách thể hiện giới tính của ἄνθρωπος
  choice: một người đàn ông
  alternative: một người; một người nào đó
  rationale: Nhân vật trong dụ ngôn được trình bày ở dạng nam số ít; bản dịch giữ chi tiết ấy mà không biến thành một mệnh đề phổ quát về nhân loại.
- issue: Hình ảnh δένδρον trong dụ ngôn hạt cải
  choice: một cây
  alternative: một bụi cây; một cây lớn
  rationale: Nguyên văn dùng δένδρον, nghĩa là “cây”. Bản dịch giữ nguyên độ lớn gây ấn tượng của hình ảnh, đồng thời không thêm tính từ “lớn” vốn không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ đọc. Dùng “chim trời” để giữ sắc thái Kinh Thánh quen thuộc nhưng vẫn tự nhiên; tránh thuật ngữ thực vật học và không giải thích ý nghĩa biểu tượng ngay trong bản văn.
