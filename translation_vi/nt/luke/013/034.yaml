revisions:
- from: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, thành giết các nhà tiên tri và ném đá những người được sai đến với mình! Đã bao lần ta muốn tập hợp con cái ngươi, như gà mẹ ấp ủ đàn con dưới cánh[a], nhưng các ngươi không muốn.
  to: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, kẻ giết các nhà tiên tri và ném đá những người được sai đến với mình—đã bao lần Ta muốn quy tụ con cái ngươi, như gà mẹ gom đàn con mình dưới cánh, mà các ngươi không muốn!
  rationale: Sửa “ấp ủ” thành “gom” để dịch đúng hành động quy tụ của nguyên văn; thay “thành giết” bằng “kẻ giết” cho tự nhiên hơn mà vẫn duy trì phép nhân cách hóa; nối toàn bộ lời than bằng gạch ngang. Bảo lưu sự mơ hồ về “con cái ngươi” và sự đối lập ý chí giữa “Ta” với “các ngươi.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ được lời gọi lặp lại, nét mô tả mang tính đặc trưng qua các phân từ hiện tại, đối lập về ý muốn, và chuyển đổi từ số ít sang số nhiều. Tuy nhiên, “ấp ủ” không dịch hành động ἐπισυνάξαι trong vế so sánh: nguyên văn nói đến việc gom/quy tụ đàn con dưới cánh, không nói đến ấp.'
  naturalness: “thành giết” hơi gượng trong tiếng Việt hiện đại, và dấu chấm than sau mệnh đề này làm ngắt lời than vốn tiếp tục bằng “Đã bao lần...”. “kẻ giết... và ném đá...” tự nhiên hơn trong lối xưng hô nhân cách hóa, còn “gom đàn con mình” diễn đạt rõ hình ảnh gà mẹ.
  terminology: Giữ “Giê-ru-sa-lem,” “nhà tiên tri,” “được sai,” “con cái ngươi,” và cặp “Ta muốn / các ngươi không muốn.” “Gà mẹ” là lựa chọn hợp lý cho ὄρνις trong ngữ cảnh, với chú thích bảo lưu nghĩa rộng hơn là “chim mẹ.”
  issues:
