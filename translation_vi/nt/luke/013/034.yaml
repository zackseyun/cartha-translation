id: LUK.13.34
reference: Luke 13:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: vi
  text: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, kẻ giết các nhà tiên tri và ném đá những người được sai đến với mình—đã bao lần Ta muốn quy tụ con cái ngươi, như gà mẹ gom đàn con mình dưới cánh, mà các ngươi không muốn!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem
  rationale: Giữ nguyên sự lặp lại đầy đau xót và nhấn mạnh; thêm “Hỡi” để lời gọi trực tiếp tự nhiên, trang trọng trong tiếng Việt.
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: thành giết ... và ném đá
  rationale: Mạo từ cùng các phân từ hiện tại mô tả Giê-ru-sa-lem qua cách hành xử mang tính đặc trưng. “Thành” làm rõ phép nhân cách hóa mà không biến nó thành một biến cố đơn lẻ.
- source_word: τοὺς προφήτας
  choice: các nhà tiên tri
  rationale: Cách gọi phổ thông, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: những người được sai đến với mình
  rationale: Giữ nghĩa bị động của phân từ hoàn thành và dùng “mình” để quy chiếu tự nhiên về thành Giê-ru-sa-lem đang được nhân cách hóa.
- source_word: ποσάκις ἠθέλησα
  choice: Đã bao lần ta muốn
  rationale: Diễn đạt tự nhiên sắc thái than tiếc và giữ rõ ngôn ngữ về ý muốn.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: tập hợp con cái ngươi
  rationale: “Tập hợp” thể hiện lực của động từ ghép; “con cái ngươi” giữ nguyên hình ảnh thành phố như người mẹ và không thu hẹp đối tượng quy chiếu.
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: gà mẹ ấp ủ đàn con
  rationale: ὄρνις có thể chỉ chim nói chung, nhưng bối cảnh con mẹ gom đàn con dưới cánh khiến “gà mẹ” là hình ảnh tự nhiên nhất. “Ấp ủ” chuyển tải hành động che chở trong phép so sánh; xem chú thích.
- source_word: ὑπὸ τὰς πτέρυγας
  choice: dưới cánh
  rationale: Giữ trực tiếp hình ảnh che chở của nguyên văn.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: nhưng các ngươi không muốn
  rationale: καί ở đây tạo sự tương phản mạnh trong lời than nên dịch tự nhiên là “nhưng”. Động từ số nhiều được biểu thị bằng “các ngươi”, qua đó giữ sự chuyển đổi từ thành phố số ít sang những người được nói đến số nhiều.
theological_decisions:
- issue: Đối tượng của “con cái ngươi”
  choice: Giữ nguyên “con cái ngươi”
  alternative: cư dân Giê-ru-sa-lem; dân thuộc về Giê-ru-sa-lem hoặc Ít-ra-ên
  rationale: Nguyên văn nhân cách hóa Giê-ru-sa-lem như một người mẹ nhưng không xác định hẹp hơn “con cái” là nhóm nào; bản dịch bảo toàn độ mở này.
- issue: Sự tương phản về ý muốn trong ἠθέλησα / ἠθελήσατε
  choice: “ta muốn” / “các ngươi không muốn”
  alternative: “ta ao ước” / “các ngươi không chịu”; “ta sẵn lòng” / “các ngươi không sẵn lòng”
  rationale: Giữ đúng ngôn ngữ ý chí của câu mà không suy diễn một kết luận giáo lý rộng hơn về ý muốn thần linh và sự khước từ của con người.
- issue: Sự chuyển đổi số từ σου sang ἠθελήσατε
  choice: “ngươi” rồi “các ngươi”
  alternative: Dùng “ngươi” ở cả hai vế để làm phẳng sự chuyển đổi
  rationale: Nguyên văn trước hết nói với thành phố được nhân cách hóa ở số ít, rồi dùng động từ số nhiều cho những người khước từ. Bản dịch giữ sự căng thẳng ngữ pháp và ý nghĩa này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tính than tiếc. Đại từ “ta/ngươi/các ngươi” được dùng để giữ lời phán trực tiếp và sự chuyển đổi số trong tiếng Hy Lạp. Dấu chấm than sau mệnh đề mô tả giúp lời gọi và lời than tự nhiên trong tiếng Việt.
