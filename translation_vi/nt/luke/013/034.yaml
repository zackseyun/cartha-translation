    issue: “ấp ủ đàn con” thay đổi hành động trong phép so sánh.
    rationale: ἐπισυνάξαι nghĩa là gom, quy tụ; hình ảnh ὑπὸ τὰς πτέρυγας là đưa đàn con xuống dưới cánh để che chở. “Ấp ủ” gợi hành động ủ trứng/chăm bẵm và không chuyển tải rõ hành động gom tụ.
  - severity: low
    issue: “thành giết” không tự nhiên và dấu chấm than chia cắt câu than.
    rationale: Cấu trúc “kẻ giết ... và ném đá ...” phản ánh tự nhiên chức năng mô tả của các phân từ, trong khi gạch ngang nối liền lời gọi với lời than theo nguyên văn.
  revised_text: Hỡi Giê-ru-sa-lem, Giê-ru-sa-lem, kẻ giết các nhà tiên tri và ném đá những người được sai đến với mình—đã bao lần Ta muốn quy tụ con cái ngươi, như gà mẹ gom đàn con mình dưới cánh, mà các ngươi không muốn!
