revisions:
- from: 'Rồi ông nói với người làm vườn nho: “Này, đã ba năm nay tôi đến tìm trái trên cây vả này mà chẳng thấy. Hãy đốn nó đi! Tại sao còn để nó làm đất ra vô dụng[a]?”'
  to: 'Rồi ông nói với người làm vườn nho: “Này, đã ba năm nay tôi đến tìm trái trên cây vả này mà chẳng thấy. Hãy đốn nó đi! Tại sao nó còn làm cho đất trở nên vô dụng[a]?”'
  rationale: Chỉ sửa cấu trúc tiếng Việt không tự nhiên “làm đất ra vô dụng” thành “làm cho đất trở nên vô dụng.” Bản sửa bảo toàn phạm vi nghĩa của καταργεῖ theo nguyên ngữ và ghi chú, đồng thời giữ nguyên điểm neo chú thích sau cụm được giải thích.
