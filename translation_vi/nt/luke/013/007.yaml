id: LUK.13.7
reference: Luke 13:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: vi
  text: 'Rồi ông nói với người làm vườn nho: “Này, đã ba năm nay tôi đến tìm trái trên cây vả này mà chẳng thấy. Hãy đốn nó đi! Tại sao nó còn làm cho đất trở nên vô dụng[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tại sao nó còn chiếm dụng đất?” Động từ Hy Lạp có thể mang nghĩa khiến đất trở nên vô dụng hoặc không sinh lợi, chứ không chỉ chiếm chỗ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: người làm vườn nho
  rationale: Chỉ người chăm sóc và canh tác vườn nho; cách nói này chính xác, tự nhiên và giữ nguyên bối cảnh vườn nho.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Từ gọi người nghe chú ý với sắc thái nhấn mạnh, phù hợp với lời nói trực tiếp trong tiếng Việt hiện đại.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: đã ba năm nay
  rationale: Diễn đạt một khoảng thời gian kéo dài từ quá khứ đến hiện tại một cách tự nhiên.
- source_word: ἔρχομαι ζητῶν
  choice: tôi đến tìm
  rationale: Giữ sát cấu trúc động từ hiện tại kèm phân từ, đồng thời ngữ cảnh ba năm cho thấy hành động xảy ra lặp lại.
- source_word: καρπὸν
  choice: trái
  rationale: Giữ nghĩa nông nghiệp trực tiếp trong dụ ngôn; “trái” tự nhiên trong cách nói về cây vả.
- source_word: συκῇ
  choice: cây vả
  rationale: Tên gọi thông dụng và chính xác của loài cây trong tiếng Việt Kinh Thánh.
- source_word: οὐχ εὑρίσκω
  choice: mà chẳng thấy
  rationale: Phản ánh thì hiện tại Hy Lạp và kết quả liên tục của những lần tìm kiếm không thành công; tự nhiên hơn cách nói cứng “không tìm thấy trái nào”.
- source_word: ἔκκοψον
  choice: Hãy đốn nó đi
  rationale: Mệnh lệnh trực tiếp về việc chặt hạ cây; “đốn” rõ nghĩa và tự nhiên.
- source_word: ἱνατί
  choice: Tại sao
  rationale: Chuyển tải trực tiếp câu hỏi về lý do.
- source_word: καὶ
  choice: còn
  rationale: 'Trong câu hỏi tu từ, “còn” diễn đạt sắc thái phụ thêm/nhấn mạnh: cây không sinh trái mà lại gây hại cho đất.'
- source_word: γῆν
  choice: đất
  rationale: Phù hợp với bối cảnh canh tác và bao gồm cả nghĩa đất trồng.
- source_word: καταργεῖ
  choice: làm đất ra vô dụng
  rationale: Giữ nghĩa mạnh của động từ là khiến đất mất tác dụng hoặc không sinh lợi, thay vì chỉ diễn giải là chiếm chỗ.
theological_decisions:
- issue: Hình ảnh dụ ngôn và lời giải nghĩa thần học
  choice: Giữ nguyên ngôn ngữ nông nghiệp, không đưa ý nghĩa thuộc linh vào bản văn.
  alternative: Diễn giải cây không sinh trái theo nghĩa thuộc linh ngay trong câu.
  rationale: Nguyên văn trình bày một cảnh nông nghiệp trong dụ ngôn; bản dịch cần để việc giải nghĩa phát sinh từ văn cảnh.
- issue: Sắc thái của καταργεῖ
  choice: Dịch trong chính văn là “làm đất ra vô dụng”, đồng thời ghi chú nghĩa theo ngữ cảnh là “chiếm dụng đất”.
  alternative: Chỉ dịch “chiếm đất” hoặc “làm đất cằn cỗi”.
  rationale: Động từ có thể nhấn mạnh việc khiến đất không còn hữu dụng, nhưng trong ngữ cảnh cũng có thể được hiểu thực tế là cây vô ích chiếm dụng đất; chú thích bảo tồn độ rộng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “người làm vườn nho” thay cho thuật ngữ chuyên môn khó hiểu; giữ lời thoại mạnh và trực tiếp. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
