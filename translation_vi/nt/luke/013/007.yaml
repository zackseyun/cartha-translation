  naturalness: “Rồi ông nói với người làm vườn nho” và các câu thoại nhìn chung tự nhiên, trang trọng vừa phải. Cụm “làm đất ra vô dụng” là lỗi kết hợp từ; “làm cho đất trở nên vô dụng” tự nhiên và rõ nghĩa hơn.
  terminology: “Người làm vườn nho,” “cây vả,” “trái,” và “đốn nó đi” phù hợp với tiếng Việt Kinh Thánh hiện đại. Không cần diễn giải ý nghĩa dụ ngôn theo hướng thần học.
