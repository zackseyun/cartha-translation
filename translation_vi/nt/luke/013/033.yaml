id: LUK.13.33
reference: Luke 13:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: vi
  text: Tuy vậy, hôm nay, ngày mai và ngày kế tiếp[b], tôi phải tiếp tục lên đường, vì không thể nào[a] một nhà tiên tri lại chết bên ngoài Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không thể có chuyện” hoặc “thật không thể tưởng tượng nổi”.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ “hôm nay, ngày mai và ngày kế tiếp” có thể là lối nói chỉ một tiến trình ngắn đã được ấn định, chứ không nhất thiết nói đúng ba ngày theo lịch.
    reason: cultural_note
lexical_decisions:
- source_word: πλὴν
  choice: Tuy vậy
  rationale: Giữ sắc thái đối lập và chuyển hướng mạnh so với lời trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: δεῖ με
  choice: tôi phải
  rationale: Diễn đạt trực tiếp tính tất yếu của δεῖ mà không giải thích thêm đó là sự tất yếu do Thiên Chúa định hay do hoàn cảnh bắt buộc.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: hôm nay, ngày mai và ngày kế tiếp
  rationale: Giữ nguyên tiến trình ba mốc thời gian của bản Hy Lạp, đồng thời để ngỏ khả năng đây là lối nói chỉ một tiến trình ngắn và đã được ấn định.
- source_word: πορεύεσθαι
  choice: tiếp tục lên đường
  rationale: Thể hiện hành động đi tới hoặc tiếp tục hành trình; cách nói này phù hợp ngữ cảnh di chuyển và tự nhiên hơn một động từ 'đi' đơn lẻ.
- source_word: ὅτι
  choice: vì
  rationale: Nêu lý do cho tính tất yếu vừa được khẳng định.
- source_word: οὐκ ἐνδέχεται
  choice: không thể nào
  rationale: Giữ ý bất khả hoặc khó có thể quan niệm được, nhưng không buộc câu phải được hiểu như một mệnh đề tuyệt đối theo nghĩa siêu hình.
- source_word: προφήτην
  choice: một nhà tiên tri
  rationale: Danh từ số ít không có mạo từ mang nghĩa khái quát, tạo sắc thái như một nhận định có tính châm ngôn.
- source_word: ἀπολέσθαι
  choice: chết
  rationale: Trong ngữ cảnh số phận của nhà tiên tri, 'chết' truyền đạt tự nhiên ý mất mạng mà không thu hẹp động từ thành riêng hành vi 'bị giết'; sắc thái nghiêm trọng vẫn được giữ trong toàn câu.
- source_word: ἔξω Ἰερουσαλήμ
  choice: bên ngoài Giê-ru-sa-lem
  rationale: Phản ánh trực tiếp quan hệ không gian của ἔξω và gọi rõ địa danh.
theological_decisions:
- issue: Sức nặng của lời khẳng định rằng nhà tiên tri không thể chết ngoài Giê-ru-sa-lem
  choice: Dịch theo ngôn ngữ bất khả với cấu trúc 'không thể nào ... lại', để người đọc vẫn có thể nhận ra sắc thái nghịch lý hoặc mỉa mai mang tính tiên tri.
  alternative: Dịch là 'không thể có chuyện' hoặc 'thật không thể tưởng tượng nổi', nhấn mạnh rõ hơn tính phi lý theo quy ước hay sự mỉa mai.
  rationale: οὐκ ἐνδέχεται có thể chỉ điều không thể xảy ra, không thích hợp, hoặc khó quan niệm. Bản dịch không biến lời này thành một khẳng định siêu hình tuyệt đối, cũng không làm mất căng thẳng giữa bề mặt của câu và lịch sử Giê-ru-sa-lem đối với các nhà tiên tri.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi” phù hợp lời phát biểu trực tiếp trong tiếng Việt phổ thông. Cấu trúc “một nhà tiên tri lại chết” giữ sắc thái nghịch lý của câu mà không giải thích thay cho người đọc.
