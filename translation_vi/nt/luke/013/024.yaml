review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng mệnh lệnh Ἀγωνίζεσθε, hình ảnh “cửa hẹp” của θύρα, quan hệ nguyên nhân của ὅτι, và sự đối lập giữa “nỗ lực” với việc nhiều người tìm vào nhưng không thể. Tuy nhiên, “Ta nói với các con” không được quyết định bởi nguyên ngữ và áp một quan hệ xưng hô cụ thể hơn văn cảnh nêu ra; câu “không thể được” cũng chưa nêu rõ hành động bất thành trong tiếng Việt hiện đại.
  naturalness: “Hãy nỗ lực vào qua” hơi gượng vì “nỗ lực” thường cần cấu trúc “để + động từ”. “Tôi nói cho anh em biết” và “sẽ không thể vào được” tự nhiên, rõ nghĩa, và vẫn giữ sắc thái diễn ngôn trang trọng vừa phải.
  terminology: Giữ “cửa hẹp” là chính xác cho θύρα, không thay bằng “cổng” như trong Ma-thi-ơ. “Hãy nỗ lực” phản ánh tốt lực của ἀγωνίζεσθε. “Tìm cách để vào” là cách diễn đạt Việt ngữ tự nhiên cho ζητήσουσιν εἰσελθεῖν, không đồng nhất nó với mệnh lệnh “nỗ lực”.
  issues:
  - severity: medium
    issue: Cặp xưng hô “Ta—các con” áp đặt quan hệ người nói–người nghe không có trong câu Hy Lạp.
    rationale: λέγω ὑμῖν chỉ đánh dấu ngôi thứ nhất số ít và người nghe số nhiều; “các con” thêm sắc thái gia trưởng/thân thuộc, trong khi Lu-ca 13:23–24 không giới hạn người nghe vào một nhóm được gọi như vậy. “Tôi—anh em” trung tính hơn trong tiếng Việt Kinh Thánh hiện đại.
  - severity: low
    issue: Cú pháp “Hãy nỗ lực vào qua” và kết câu “không thể được” kém tự nhiên/ít rõ hành động.
    rationale: Thêm “để” sau “nỗ lực” làm rõ quan hệ mệnh lệnh với động từ nguyên mẫu. Lặp lại “vào” ở mệnh đề cuối biểu đạt minh nhiên εἰσελθεῖν và ἰσχύσουσιν trong tiếng Việt.
  revised_text: 'Hãy nỗ lực để vào qua cửa hẹp[a], vì tôi nói cho anh em biết: nhiều người sẽ tìm cách để vào nhưng sẽ không thể vào được.'
