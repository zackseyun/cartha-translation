id: LUK.13.24
reference: Luke 13:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: vi
  text: 'Hãy nỗ lực để vào qua cửa hẹp[a], vì tôi nói cho anh em biết: nhiều người sẽ tìm cách để vào nhưng sẽ không thể vào được.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “qua cổng hẹp”. Từ Hy Lạp của Lu-ca ở đây là θύρα, thường có nghĩa là “cửa”, trong khi phân đoạn tương ứng ở Ma-thi-ơ dùng từ “cổng”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Hãy nỗ lực
  rationale: Động từ mệnh lệnh hiện tại ἀγωνίζομαι diễn tả sự gắng sức nghiêm túc. “Hãy nỗ lực” tự nhiên trong tiếng Việt hiện đại, giữ được sức nặng của mệnh lệnh mà không hàm ý công trạng.
- source_word: εἰσελθεῖν
  choice: vào
  rationale: Dịch tự nhiên động từ εἰσέρχομαι và được dùng nhất quán cho cả hai lần xuất hiện trong câu.
- source_word: διὰ τῆς στενῆς θύρας
  choice: qua cửa hẹp
  rationale: θύρα thông thường là “cửa”; στενῆς là “hẹp”. Cách dịch này giữ hình ảnh riêng của Lu-ca, không đồng hóa với “cổng” trong phân đoạn tương ứng ở Ma-thi-ơ.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι dẫn vào lý do của mệnh lệnh; “vì” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: πολλοί
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ, chỉ một số đông người.
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Giữ công thức diễn ngôn trực tiếp và đại từ số nhiều ὑμῖν. “Ta—các con” phù hợp lời Đức Giê-su nói với người nghe, trang trọng nhưng vẫn dễ hiểu.
- source_word: ζητήσουσιν
  choice: sẽ tìm cách
  rationale: Giữ ý tìm kiếm/cố tìm của ζητέω và phân biệt với mệnh lệnh mạnh hơn ἀγωνίζεσθε; “tìm cách vào” tự nhiên hơn “tìm vào” trong tiếng Việt.
- source_word: οὐκ ἰσχύσουσιν
  choice: không thể được
  rationale: ἰσχύω ở đây chỉ khả năng thực hiện hành động; cách dịch này rõ nghĩa mà không diễn giải thành nguyên nhân thất bại.
theological_decisions:
- issue: Nỗ lực của con người và ngôn ngữ cứu rỗi
  choice: Giữ mệnh lệnh mạnh “Hãy nỗ lực” và lời cảnh báo rằng nhiều người sẽ không thể vào.
  alternative: “Hãy cố vào” hoặc thêm lời giải thích rằng nỗ lực không tạo nên công trạng.
  rationale: Bản văn đặt cạnh nhau mệnh lệnh phải gắng sức và cảnh báo về những người tìm cách vào nhưng không thể. Bản dịch bảo toàn căng thẳng ấy, không giải quyết thay bản văn các tranh luận về công trạng, trách nhiệm con người hay quyền tối thượng của Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu. Trật tự “vì Ta nói với các con” phản ánh vị trí xen giữa của λέγω ὑμῖν mà vẫn tự nhiên. Dùng “cửa” trong chính văn để trung thành với từ Hy Lạp của Lu-ca.
