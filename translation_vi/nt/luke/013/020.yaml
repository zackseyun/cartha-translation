  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: vi
  text: 'Ngài lại nói: “Ta sẽ ví Nước Đức Chúa Trời với điều gì?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ πάλιν
  choice: lại
  rationale: Trong tiếng Việt, “lại” diễn đạt tự nhiên cả sự nối tiếp lẫn ý lặp lại của cụm này mà không thêm sắc thái thời gian không có trong nguyên văn.
- source_word: εἶπεν
  choice: Ngài phán
  rationale: Động từ λέγω ở thì aorist mở đầu lời nói trực tiếp. “Phán” là cách diễn đạt trang trọng, tự nhiên khi chủ thể là Chúa Giê-su; đại từ “Ngài” được bổ sung theo chủ thể đã rõ trong ngữ cảnh.
- source_word: Τίνι
  choice: với điều gì
  rationale: Đại từ nghi vấn ở cách dữ, giống trung, số ít chỉ đối tượng dùng để so sánh, không phải một người.
- source_word: ὁμοιώσω
  choice: Ta sẽ ví
  rationale: Giữ hình thức tương lai ngôi thứ nhất của ὁμοιόω, đồng thời diễn đạt tự nhiên sắc thái câu hỏi cân nhắc trong tiếng Việt.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: “Vương quốc” giữ được cả phạm vi cai trị và thực tại thuộc quyền vua; “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
theological_decisions:
- issue: Cách dịch βασιλεία trong lời nói về quyền trị vì của Đức Chúa Trời
  choice: vương quốc Đức Chúa Trời
  alternative: sự trị vì của Đức Chúa Trời
  rationale: βασιλεία có thể nói đến cả quyền trị vì lẫn vương quốc thuộc quyền cai trị. “Vương quốc Đức Chúa Trời” bảo toàn phạm vi nghĩa rộng hơn, thay vì thu hẹp chỉ còn hành động trị vì.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu hỏi tu từ giữ nguyên, không thêm lời giải thích hay giải quyết trước phép so sánh sẽ theo sau.
