revisions:
- from: 'Bấy giờ, các ngươi sẽ bắt đầu nói: “Chúng tôi đã ăn uống trước mặt ngài, và ngài đã dạy dỗ ngoài các đường phố của chúng tôi.[a]”'
  to: 'Bấy giờ, các ngươi sẽ bắt đầu nói: “Chúng tôi đã ăn và uống trước mặt ngài, và ngài đã dạy trên các đường phố của chúng tôi[a].”'
  rationale: Sửa giới từ địa điểm để không đảo nghĩa của ἐν; tách “ăn” và “uống” nhằm phản ánh hai động từ aorist song hành; và dùng “dạy” làm tương đương trung tính, tự nhiên với ἐδίδαξας. Chú thích vẫn được neo đúng vào cụm “các đường phố của chúng tôi” và bảo tồn khả năng hiểu πλατεῖαι là quảng trường/nơi công cộng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:52Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng trình tự τότε, sắc thái khởi sự của ἄρξεσθε λέγειν, và tính chất của lời biện hộ dựa trên sự gần gũi bề ngoài. Tuy nhiên, “ngoài các đường phố” có nghĩa là ở bên ngoài đường phố, không tương ứng với ἐν ταῖς πλατείαις (“trên/trong các đường phố rộng, nơi công cộng”). “Ăn và uống” cũng phản ánh minh thị hơn hai động từ riêng biệt Ἐφάγομεν ... ἐπίομεν.
  naturalness: “Trên các đường phố của chúng tôi” là cách nói hiện đại, tự nhiên cho hoạt động công khai diễn ra tại đường phố, đồng thời không ép πλατεῖαι thành “quảng trường”. “Dạy” tự nhiên và trung tính hơn “dạy dỗ” trong ngữ cảnh giảng dạy công khai.
  terminology: Giữ “các ngươi” cho ngôi thứ hai số nhiều trong lời phán, và “ngài” trong lời những người ấy trực tiếp thưa với nhân vật được tôn kính. Không thêm hàm ý về sự công nhận hay thông công được chấp nhận.
  issues:
  - severity: medium
    issue: “ngoài các đường phố của chúng tôi”
    rationale: “Ngoài” biểu thị vị trí bên ngoài đường phố, trái với giới từ ἐν (“trong/tại”). Cần đổi thành “trên các đường phố” để diễn tả địa điểm dạy công khai và giữ độ rộng nghĩa của πλατεῖαι.
  - severity: low
    issue: “ăn uống” gộp hai động từ nguồn
    rationale: Cụm này tự nhiên nhưng làm mờ sự song hành rõ ràng của “chúng tôi đã ăn ... và đã uống”. Dùng hai động từ riêng giúp bản dịch tối ưu-tương-đương sát nguyên văn hơn.
  - severity: low
    issue: “dạy dỗ”
    rationale: Từ này không sai, nhưng “dạy” là tương ứng trung tính, trực tiếp hơn với ἐδίδαξας và tránh thêm sắc thái chăm nom/khuyên bảo.
