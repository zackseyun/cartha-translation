  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: vi
  text: 'Bấy giờ, các ngươi sẽ bắt đầu nói: “Chúng tôi đã ăn và uống trước mặt ngài, và ngài đã dạy trên các đường phố của chúng tôi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tại các quảng trường của chúng tôi”; từ Hy Lạp có thể chỉ những đường phố rộng hoặc những nơi công cộng thoáng rộng trong một thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu trình tự thời gian trong lời kể một cách ngắn gọn, trang trọng và tự nhiên.
- source_word: ἄρξεσθε λέγειν
  choice: các ngươi sẽ bắt đầu nói
  rationale: Giữ rõ sắc thái khởi đầu của ἄρξεσθε cùng động từ nguyên mẫu λέγειν, thay vì giản lược thành “sẽ nói”.
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Chúng tôi đã ăn uống
  rationale: Hai động từ aorist chỉ việc ăn và uống được diễn đạt tự nhiên bằng một cặp từ quen dùng trong tiếng Việt, với “đã” nêu hành động quá khứ.
- source_word: ἐνώπιόν σου
  choice: trước mặt ngài
  rationale: Diễn tả việc ở trong sự hiện diện của người được nói đến mà không hàm ý người ấy công nhận một mối quan hệ cứu rỗi.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: ngoài các đường phố của chúng tôi
  rationale: πλατεῖαι có thể chỉ những đường phố rộng hoặc nơi công cộng thoáng rộng trong thành; “đường phố” tự nhiên và không thu hẹp nghĩa thành quảng trường.
- source_word: ἐδίδαξας
  choice: ngài đã dạy dỗ
  rationale: Thể aorist được chuyển bằng quá khứ đơn, nêu sự kiện người ấy từng giảng dạy công khai giữa họ.
theological_decisions:
- issue: Bản chất lời viện dẫn của những người đang nói
  choice: Giữ lời tuyên bố về sự gần gũi bên ngoài—họ ăn uống trước mặt ngài và ngài dạy tại đường phố của họ—mà không hàm ý ngài công nhận họ.
  alternative: Diễn đạt theo hướng họ từng thông công hoặc có quan hệ giao ước được chấp nhận với ngài.
  rationale: Nguyên văn chỉ nêu sự hiện diện và hoạt động công khai như căn cứ họ viện dẫn; bản dịch không nên tự giải quyết căng thẳng thần học bằng cách xác nhận một mối quan hệ sâu hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các ngươi” giữ sắc thái số nhiều của ngôi thứ hai trong lời quở trách; “ngài” thể hiện lời xưng hô kính trọng của những người đang cầu viện. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
