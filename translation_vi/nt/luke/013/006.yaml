- from: 'Rồi Ngài kể dụ ngôn này: “Một người kia[a] có một cây vả được trồng trong vườn nho của mình. Ông đến tìm trái trên cây nhưng không thấy.”'
  to: 'Ngài kể dụ ngôn này: “Một người kia[a] có một cây vả được trồng trong vườn nho của mình. Ông đến tìm trái trên cây nhưng không tìm thấy trái nào.”'
  rationale: Chỉ điều chỉnh mệnh đề kết để phản ánh trực tiếp hơn “đã không tìm thấy” và làm rõ đối tượng được tìm. Chú thích được diễn đạt lại để mô tả chính xác tính bất định của τις, không thay đổi ý nghĩa câu.
