id: LUK.13.6
reference: Luke 13:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: vi
  text: 'Ngài kể dụ ngôn này: “Một người kia[a] có một cây vả được trồng trong vườn nho của mình. Ông đến tìm trái trên cây nhưng không tìm thấy trái nào.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Có người”. Đại từ bất định trong tiếng Hy Lạp không chỉ rõ một người cụ thể; “một người kia” phù hợp với lối kể chuyện của dụ ngôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: Rồi Ngài kể
  rationale: Thì vị hoàn của ἔλεγεν mở đầu lời kể đang tiếp diễn trong mạch văn; tiếng Việt tự nhiên dùng “kể”. δέ là từ nối nhẹ, được thể hiện bằng “Rồi” để giữ sự tiếp nối mà không nhấn mạnh quá mức.
- source_word: ταύτην τὴν παραβολήν
  choice: dụ ngôn này
  rationale: “Dụ ngôn” là cách gọi chuẩn, chính xác và quen thuộc đối với câu chuyện minh họa trong lời dạy của Đức Giê-su.
- source_word: Συκῆν
  choice: một cây vả
  rationale: Danh từ chỉ cụ thể cây vả; thêm “một” phù hợp với cách giới thiệu sự vật lần đầu trong tiếng Việt.
- source_word: εἶχέν τις
  choice: Một người kia có
  rationale: τις là đại từ bất định. “Một người kia” tự nhiên trong lối mở đầu dụ ngôn và không xác định nhân vật cụ thể.
- source_word: πεφυτευμένην
  choice: được trồng
  rationale: Phân từ hoàn thành bị động mô tả cây đang ở tình trạng đã được trồng; “được trồng” giữ được sắc thái bị động và trạng thái đã thiết lập.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: trong vườn nho của mình
  rationale: ἀμπελών là “vườn nho”; “của mình” quy chiếu tự nhiên về người chủ vừa được nhắc đến.
- source_word: ἦλθεν ζητῶν
  choice: Ông đến tìm
  rationale: Động từ chính cùng phân từ hiện tại diễn tả việc đến và tìm kiếm; “đến tìm” ngắn gọn, tự nhiên và giữ rõ mục đích/hành động đi kèm.
- source_word: καρπὸν ἐν αὐτῇ
  choice: trái trên cây
  rationale: καρπός là “trái”; với cây, tiếng Việt tự nhiên nói “trái trên cây”, đồng thời vẫn giữ được khả năng gợi nghĩa biểu tượng của “trái”.
- source_word: καὶ οὐχ εὗρεν
  choice: nhưng không thấy
  rationale: Liên từ καί ở đây dẫn đến kết quả trái với mong đợi nên “nhưng” thể hiện quan hệ diễn ngôn tự nhiên. “Không thấy” quy chiếu rõ đến trái đang được tìm mà không cần lặp lại.
theological_decisions:
- issue: Chủ thể bất định τις trong dụ ngôn
  choice: Một người kia
  alternative: Có người; một người nào đó
  rationale: Cụm này giới thiệu một nhân vật bình thường, không xác định, và không gán cho nhân vật ấy một ý nghĩa thần học ngay trong câu. “Một người kia” hợp với văn phong kể chuyện trang trọng, dễ hiểu.
- issue: Đại từ chỉ Đức Giê-su trong Ἔλεγεν
  choice: Ngài
  alternative: Đức Giê-su; Người
  rationale: Bản Hy Lạp dùng chủ ngữ hàm ẩn ngôi thứ ba dựa vào mạch văn. “Ngài” giữ liên kết đại từ và sắc thái tôn kính quen thuộc trong tiếng Việt mà không thêm danh xưng thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu thoại giữ nhịp kể súc tích; “cây vả”, “vườn nho” và “trái” bảo toàn hình ảnh cụ thể cũng như khả năng gợi nghĩa của dụ ngôn.
