id: LUK.13.28
reference: Luke 13:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: vi
  text: Tại đó sẽ có khóc lóc và nghiến răng khi các ngươi thấy Áp-ra-ham, Y-sác, Gia-cốp cùng tất cả các nhà tiên tri ở trong vương quốc Đức Chúa Trời, còn chính các ngươi thì bị quăng ra ngoài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp được dịch là “bị quăng ra ngoài” nhấn mạnh việc bị cưỡng bức loại trừ; cũng có thể dịch là “bị đuổi ra ngoài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: tại đó
  rationale: Giữ nghĩa chỉ địa điểm, liên hệ với nơi bị loại trừ được nêu ở cuối câu.
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: người ta sẽ khóc lóc và nghiến răng
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ nguyên hình ảnh cụ thể về đau đớn và phẫn uất.
- source_word: ὅταν ὄψησθε
  choice: khi các ngươi thấy
  rationale: ὅταν với động từ giả định aorist hướng đến một cảnh tượng tương lai xác định; tiếng Việt diễn đạt tự nhiên bằng “khi ... thấy”.
- source_word: πάντας τοὺς προφήτας
  choice: tất cả các nhà tiên tri
  rationale: Giữ đầy đủ yếu tố πάντας, nhấn mạnh toàn thể các nhà tiên tri.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: ở trong vương quốc Đức Chúa Trời
  rationale: Giữ thuật ngữ thần học βασιλεία τοῦ θεοῦ và quan hệ vị trí của giới từ ἐν.
- source_word: ὑμᾶς δὲ
  choice: còn chính mình
  rationale: “Còn” thể hiện sự tương phản của δέ; “chính mình” chuyển tải sắc thái nhấn mạnh của đại từ ὑμᾶς trong cấu trúc đối lập.
- source_word: ἐκβαλλομένους ἔξω
  choice: bị quăng ra ngoài
  rationale: “Bị quăng” giữ thể bị động và sức mạnh của ἐκβάλλω; “ra ngoài” giữ rõ ἔξω và hình ảnh bị cưỡng bức loại trừ.
theological_decisions:
- issue: Bản chất của hình ảnh phán xét
  choice: Giữ nguyên hình ảnh cụ thể về khóc lóc, nghiến răng và bị quăng ra ngoài.
  alternative: Diễn giải thành “đau buồn sâu sắc” hoặc xác định rõ đây là một hệ thống giáo lý về sự kết án cuối cùng.
  rationale: Câu này mô tả nỗi thống khổ và sự bị loại khỏi vương quốc nhưng không tự nó trình bày trọn vẹn bản chất hay thời hạn của sự phán xét; bản dịch không nên thêm kết luận giáo phái.
- issue: Nghĩa của βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: sự cai trị của Đức Chúa Trời
  rationale: Trong cảnh tượng này, tổ phụ và các nhà tiên tri được thấy là “ở trong” βασιλεία, nên “vương quốc” giữ tự nhiên cả ý niệm trị vì lẫn phạm vi thuộc về mà không thu hẹp nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ sắc thái lời cảnh báo trực tiếp với số nhiều; tên riêng theo dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
