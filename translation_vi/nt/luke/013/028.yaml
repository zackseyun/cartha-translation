    rationale: ὑμᾶς δέ có nghĩa là “còn chính các ngươi”, đối lập trực tiếp với Áp-ra-ham, Y-sác, Gia-cốp và các nhà tiên tri. “Chính mình” không nêu rõ người được nói đến là “các ngươi”.
