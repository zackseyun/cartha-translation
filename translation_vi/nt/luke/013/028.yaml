revisions:
- from: Tại đó, người ta sẽ khóc lóc và nghiến răng khi các ngươi thấy Áp-ra-ham, Y-sác, Gia-cốp cùng tất cả các nhà tiên tri ở trong vương quốc Đức Chúa Trời, còn chính mình thì bị quăng ra ngoài.[a]
  to: Tại đó sẽ có khóc lóc và nghiến răng khi các ngươi thấy Áp-ra-ham, Y-sác, Gia-cốp cùng tất cả các nhà tiên tri ở trong vương quốc Đức Chúa Trời, còn chính các ngươi thì bị quăng ra ngoài.[a]
  rationale: Sửa “chính mình” thành “chính các ngươi” để phản ánh đầy đủ đại từ ὑμᾶς và sắc thái đối lập của δέ. Thay cấu trúc có chủ thể phiếm chỉ bằng cấu trúc hiện hữu phù hợp với ἔσται, không thay đổi hình ảnh phán xét hay thêm diễn giải thần học. Chú thích vẫn được neo đúng sau cụm “bị quăng ra ngoài”.
