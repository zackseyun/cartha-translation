  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự và các thành tố chính của câu Hy Lạp: cảnh khóc lóc/nghiến răng, việc thấy các tổ phụ và toàn thể các nhà tiên tri trong vương quốc Đức Chúa Trời, cùng sự đối lập với việc bị loại ra ngoài. Tuy nhiên, “còn chính mình thì” không chuyển tải trực tiếp đại từ số nhiều nhấn mạnh ὑμᾶς; cần là “còn chính các ngươi thì”.'
