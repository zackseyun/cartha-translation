  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: vi
  text: 'Vậy, Ngài tiếp tục nói: “Vương quốc của Đức Chúa Trời[a] giống như điều gì, và Ta sẽ ví nó với điều gì?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự cai trị của Đức Chúa Trời,” nhấn mạnh việc Đức Chúa Trời cai trị hơn là một vương quốc hay lãnh vực.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ngài nói
  rationale: Thì chưa hoàn thành có thể gợi lời nói đang tiếp diễn hoặc lặp lại, nhưng trong lối kể chuyện tiếng Việt, “Ngài nói” tự nhiên và không buộc phải diễn đạt tiến hành tính vốn không nổi bật trong ngữ cảnh này.
- source_word: οὖν
  choice: Vì thế
  rationale: Giữ lực nối kết hoặc suy luận với phần trước; “vì thế” trang trọng vừa phải và tự nhiên trong văn kể Kinh Thánh.
- source_word: Τίνι ὁμοία ἐστὶν
  choice: giống điều gì
  rationale: Diễn đạt tự nhiên thành ngữ so sánh của tiếng Hy Lạp mà vẫn giữ nguyên dạng câu hỏi.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Vương quốc của Đức Chúa Trời
  rationale: Giữ thuật ngữ Kinh Thánh quen thuộc và trường nghĩa về vương quyền, đồng thời không loại trừ ý nghĩa động là sự cai trị của Đức Chúa Trời.
- source_word: καὶ
  choice: Ta sẽ
  rationale: Không chuyển καὶ thành một từ nối cứng nhắc; quan hệ song song giữa hai câu hỏi được thể hiện tự nhiên bằng việc đặt liền nhau.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: Ta sẽ ví vương quốc ấy với điều gì?
  rationale: “Sẽ ví… với điều gì” giữ sắc thái tương lai mang tính cân nhắc của ὁμοιώσω; lặp lại “vương quốc ấy” giúp tiếng Việt rõ tham chiếu hơn đại từ “nó”.
theological_decisions:
- issue: Cách dịch βασιλεία τοῦ θεοῦ
  choice: Vương quốc của Đức Chúa Trời
  alternative: Sự cai trị của Đức Chúa Trời
  rationale: “Vương quốc” bảo tồn cách nói và hình ảnh quen thuộc trong các ẩn dụ của Chúa Giê-su, còn chú thích ghi nhận rằng danh từ Hy Lạp cũng có thể nhấn mạnh quyền cai trị đang được thực thi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể trong lời dẫn và “Ta” trong lời trực tiếp của Chúa Giê-su; tránh cấu trúc quá sát tiếng Hy Lạp gây gượng.
