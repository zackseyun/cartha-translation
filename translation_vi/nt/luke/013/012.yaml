  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: vi
  text: 'Khi thấy bà, Đức Giê-su gọi bà và nói: “Này bà, bà đã được giải thoát khỏi sự đau yếu của mình.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bà đã được giải phóng khỏi tình trạng đau yếu của mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: Khi thấy bà
  rationale: Phân từ bất định ἰδὼν được diễn đạt tự nhiên như một mệnh đề thời gian; δέ chủ yếu nối tiếp diễn tiến câu chuyện nên không cần ép thành một từ chỉ tương phản trong tiếng Việt.
- source_word: προσεφώνησεν
  choice: gọi bà lại
  rationale: Động từ có thể chỉ việc gọi hoặc ngỏ lời trực tiếp; trong ngữ cảnh, “gọi bà lại” diễn đạt sáng kiến của Đức Giê-su mà không thêm sắc thái quá mạnh.
- source_word: Γύναι
  choice: Này bà
  rationale: Đây là lối xưng hô trực tiếp và tôn trọng. “Này bà” tự nhiên hơn “Hỡi người đàn bà” trong tiếng Việt hiện đại và không hàm ý thiếu kính trọng.
- source_word: ἀπολέλυσαι
  choice: bà đã được giải thoát
  rationale: Thể hoàn thành bị động diễn tả hành động đã hoàn tất với kết quả còn hiệu lực; “đã được giải thoát” giữ cả nghĩa bị động lẫn trạng thái hiện tại.
- source_word: τῆς ἀσθενείας σου
  choice: khỏi sự đau yếu của mình
  rationale: ἀσθένεια có phạm vi nghĩa gồm yếu đuối, đau yếu và bệnh tật. “Sự đau yếu” phù hợp tình trạng thể chất trong ngữ cảnh mà không biến câu thành một chẩn đoán y khoa cụ thể.
theological_decisions:
- issue: Bản chất tình trạng của người phụ nữ trong từ ἀσθένεια
  choice: sự đau yếu
  alternative: bệnh tật; sự yếu đuối; chứng tật nguyền
  rationale: Ngữ cảnh cho thấy một tình trạng thể chất gây suy nhược, nhưng từ Hy Lạp có nghĩa rộng. “Sự đau yếu” giữ được độ rộng ấy và tránh áp đặt một loại bệnh hay khuyết tật cụ thể.
- issue: Giá trị của thể hoàn thành bị động ἀπολέλυσαι
  choice: đã được giải thoát
  alternative: được thoát khỏi; được chữa khỏi
  rationale: Cách dịch được chọn bảo toàn hành động giải phóng đã hoàn tất và kết quả đang còn, đồng thời không thu hẹp động từ thành thuật ngữ chữa bệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; “bà” phù hợp cách xưng hô với một phụ nữ trưởng thành. Dấu chú thích [a] được đặt sau toàn bộ lời tuyên bố vì chú thích nêu phương án dịch cho cụm ἀπολέλυσαι τῆς ἀσθενείας σου.
