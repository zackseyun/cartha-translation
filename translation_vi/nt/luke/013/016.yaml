source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: vi
  text: Còn người phụ nữ này, vốn là con gái của Áp-ra-ham, đã bị Sa-tan trói buộc—này, đã mười tám năm rồi—chẳng lẽ không nên được giải thoát khỏi sự trói buộc này trong ngày Sa-bát sao?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: con gái của Áp-ra-ham
  rationale: Giữ nguyên hình ảnh thân tộc của nguyên văn, diễn tả tư cách thuộc về dân giao ước mà không giải nghĩa quá mức.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: trói buộc / được tháo khỏi / xiềng xích
  rationale: Duy trì trường hình ảnh trói–tháo xuyên suốt câu; 'xiềng xích' tự nhiên trong tiếng Việt và vẫn chỉ tình trạng ràng buộc.
- source_word: ἰδού
  choice: hãy xem
  rationale: Thể hiện lời kêu gọi chú ý rõ ràng của ἰδού, vốn được chứng thực trong SBLGNT và không nên bị lược bỏ.
- source_word: οὐκ ἔδει
  choice: chẳng lẽ không nên
  rationale: Tái hiện câu hỏi tu từ mong đợi câu trả lời khẳng định, đồng thời giữ sắc thái về điều thích đáng/cần phải xảy ra.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: trong ngày Sa-bát
  rationale: Cách diễn đạt tự nhiên, trang trọng, bám sát cụm chỉ thời gian của nguyên văn.
theological_decisions:
- issue: Quan hệ giữa bệnh tật của người phụ nữ và hành động của Sa-tan
  choice: đã bị Sa-tan trói buộc
  alternative: đã bị Sa-tan làm cho tàn tật
  rationale: Giữ đúng lời quy tác trực tiếp và ẩn dụ trói buộc của Chúa Giê-su, không diễn giải cơ chế hoặc đồng nhất mọi bệnh tật với hoạt động trực tiếp của Sa-tan.
- issue: Ý nghĩa của danh xưng 'con gái của Áp-ra-ham'
  choice: giữ nguyên danh xưng, không chú giải trong câu
  alternative: một người thuộc dân giao ước của Áp-ra-ham
  rationale: Bảo tồn chiều sâu và độ mở của cách gọi—có thể bao hàm căn tính dân giao ước, phẩm giá và quyền được thương xót—mà không khóa nghĩa theo một hệ phái.
- issue: Sắc thái của ἔδει trong câu hỏi về ngày Sa-bát
  choice: không nên
  alternative: không cần phải
  rationale: Trong tiếng Việt, 'chẳng lẽ không nên' truyền đạt nghĩa vụ thích đáng trong câu hỏi tu từ mà không biến câu thành khẳng định tất định thần học quá mạnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'Còn' để nối lập luận tương phản ngầm với việc tháo dây cho gia súc ở câu trước; đặt 'hãy xem' giữa hai gạch ngang để giữ sức nhấn của ἰδού mà câu vẫn tự nhiên.
