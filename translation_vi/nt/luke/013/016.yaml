revisions:
- from: Còn người phụ nữ này, vốn là con gái của Áp-ra-ham, đã bị Sa-tan trói buộc suốt mười tám năm—hãy xem—chẳng lẽ không nên được tháo khỏi xiềng xích ấy trong ngày Sa-bát sao?
  to: Còn người phụ nữ này, vốn là con gái của Áp-ra-ham, đã bị Sa-tan trói buộc—này, đã mười tám năm rồi—chẳng lẽ không nên được giải thoát khỏi sự trói buộc này trong ngày Sa-bát sao?
  rationale: Điều chỉnh nhẹ để giữ sát ẩn dụ và sự lặp lại từ vựng của nguyên văn, đồng thời làm cách đặt lời nhấn «ἰδού» tự nhiên hơn. Không thêm diễn giải về bản chất bệnh tật, Sa-tan, hay ý nghĩa thần học của danh xưng «con gái của Áp-ra-ham».
  reviewer_model: gpt-5.6-terra
