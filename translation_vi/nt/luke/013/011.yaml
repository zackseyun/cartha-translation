revisions:
- from: Kìa, có một người phụ nữ đã mang một thần gây suy nhược[a] suốt mười tám năm. Bà bị còng lưng và hoàn toàn không thể đứng thẳng lên được.
  to: Kìa, có một người phụ nữ bị một linh khiến bà suy nhược suốt mười tám năm. Bà khom lưng và không sao đứng thẳng hẳn được.[a]
  rationale: Bản sửa thay thuật ngữ có thể gây hiểu nhầm “thần” bằng “linh,” diễn đạt quan hệ của πνεῦμα ἀσθενείας một cách Việt ngữ tự nhiên mà không áp đặt nhận định về quỷ nhập, và dùng “khom lưng” cho tình trạng cong gập. Chú thích được dời đến cuối mệnh đề liên quan để neo vào toàn bộ cách dịch tư thế và mức độ không thể đứng thẳng, đồng thời vẫn giải thích yếu tố πνεῦμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:47Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được lời gọi chú ý của ἰδού, thời lượng mười tám năm, tình trạng thân thể cong khom, và sự không thể đứng thẳng hoàn toàn. Tuy nhiên, “mang một thần gây suy nhược” không tự nhiên trong tiếng Việt và “thần” dễ gợi một thần linh/thần minh hơn là πνεῦμα trong ngữ cảnh này. Dùng “linh” và cấu trúc bị động diễn đạt rõ hơn mà vẫn không gọi tác nhân ấy là quỷ.
  naturalness: “Bị còng lưng” có thể hiểu theo nghĩa lao lực/còng lưng trong cách dùng hiện đại; “khom lưng” tự nhiên và sát với tư thế được mô tả hơn. “Không sao đứng thẳng hẳn được” là cách nói hiện đại, rõ ý và chuyển tải được sắc thái tăng cường của εἰς τὸ παντελές.
  terminology: Chuyển “thần” thành “linh” để chỉ πνεῦμα một cách trung tính hơn trong tiếng Việt Cơ Đốc giáo và tránh hàm ý đa thần. “Một linh khiến bà suy nhược” giữ yếu tố thuộc linh và quan hệ với sự suy nhược, nhưng không quyết đoán đó là quỷ nhập hay xác định một chẩn đoán y khoa.
  issues:
  - severity: medium
    issue: “một thần gây suy nhược”
    rationale: “Thần” thường chỉ một vị thần/thần minh trong tiếng Việt hiện đại, không phải lựa chọn trung tính nhất cho πνεῦμα; cả cụm cũng không tự nhiên vì người bệnh được nói là “mang một thần.”
  - severity: low
    issue: “bị còng lưng”
    rationale: Cụm này có thể gợi nghĩa thành ngữ về sự lao lực. “Khom lưng” trực tiếp và tự nhiên hơn cho συγκύπτουσα.
