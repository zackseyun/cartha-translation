source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: vi
  text: Kìa, có một người phụ nữ bị một linh khiến bà suy nhược suốt mười tám năm. Bà khom lưng và không sao đứng thẳng hẳn được.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “Bà khom lưng và hoàn toàn không thể đứng thẳng lên được.” Tiếng Hy Lạp nói rõ đến “linh,” có thể hàm ý một tác nhân thuộc linh trong tình trạng suy nhược của bà.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái sống động của lời kể bằng một từ trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: γυνὴ
  choice: một người phụ nữ
  rationale: Nhân vật mới được đưa vào câu chuyện nên dùng cấu trúc bất định tự nhiên trong tiếng Việt.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: đã mang một thần gây suy nhược
  rationale: Giữ rõ danh từ πνεῦμα là 'thần', đồng thời diễn đạt quan hệ sở hữu bằng tác dụng gây suy nhược cho tự nhiên hơn trong tiếng Việt; không xác định quá mức đó là quỷ nhập hay chỉ là bệnh lý.
- source_word: ἔτη δεκαοκτώ
  choice: suốt mười tám năm
  rationale: '''Suốt'' diễn đạt tự nhiên khoảng thời gian kéo dài của tình trạng này.'
- source_word: συγκύπτουσα
  choice: bị còng lưng
  rationale: Diễn tả rõ tư thế cong gập kéo dài; tự nhiên và cụ thể hơn 'khom xuống' trong ngữ cảnh bệnh trạng.
- source_word: μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές
  choice: hoàn toàn không thể đứng thẳng lên được
  rationale: Giữ cả ý bất lực, động tác trở lại tư thế thẳng và sắc thái nhấn mạnh của εἰς τὸ παντελές.
theological_decisions:
- issue: πνεῦμα ἀσθενείας có hàm ý tác nhân thuộc linh đến mức nào
  choice: Giữ từ 'thần' trong chính văn và diễn đạt là 'một thần gây suy nhược'
  alternative: '''một thần suy nhược'' hoặc ''một chứng bệnh do thần gây nên'''
  rationale: Bản Hy Lạp nêu rõ πνεῦμα, nên không được giản lược thành một tình trạng thuần y khoa. Tuy vậy, câu này không trực tiếp gọi đó là quỷ hay mô tả sự nhập quỷ, vì thế bản dịch tránh khẳng định quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. 'Kìa' bảo lưu lời gọi chú ý của ἰδοὺ; 'còng lưng' diễn tả cụ thể tình trạng thân thể. Dấu [a] được đặt ngay sau cụm từ cần chú giải.
