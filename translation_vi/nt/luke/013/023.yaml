base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: vi
  text: 'Có người thưa với Ngài: “Lạy Chúa[a], có phải chỉ có ít người được cứu không?”[b] Ngài nói với họ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được hiểu là lời xưng hô kính trọng, như “thưa Ngài”; trong câu này, nguyên văn để ngỏ sắc thái đầy đủ của danh xưng.
    reason: alternative_reading
  - marker: b
    text: 'Dịch sát hơn: “có phải những người đang được cứu là ít không?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: (không dịch thành một từ riêng ở đầu câu)
  rationale: Đây là liên từ nhẹ, tiếp nối diễn tiến câu chuyện. Trong tiếng Việt, mạch kể đã rõ nên không cần thêm “và” hay “bấy giờ”, vốn có thể làm câu nặng hoặc nhấn thời gian quá mức.
- source_word: τις
  choice: có người
  rationale: Diễn đạt tự nhiên một người không được xác định danh tính.
- source_word: αὐτῷ
  choice: với Ngài
  rationale: Giữ đại từ của nguyên văn thay vì đưa tên Chúa Giê-xu vào câu này; “Ngài” phù hợp văn phong Kinh Thánh trang trọng hiện đại.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách xưng hô κύριος theo nghĩa “Chúa”, đồng thời chú thích rằng trong ngữ cảnh này từ ấy cũng có thể chỉ là lời xưng hô kính trọng.
- source_word: εἰ ὀλίγοι
  choice: có phải chỉ có ít người … không?
  rationale: Chuyển cấu trúc nghi vấn sang cách hỏi tự nhiên trong tiếng Việt và thể hiện ý số lượng ít.
- source_word: οἱ σῳζόμενοι
  choice: người được cứu
  rationale: Giữ thể bị động thần học quan trọng mà không chỉ rõ tác nhân; chú thích cung cấp cách dịch sát hơn, có thể gợi khía cạnh đang diễn ra của phân từ hiện tại.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Giữ đại từ số nhiều của nguyên văn, cho thấy câu trả lời hướng đến nhiều người chứ không riêng người vừa hỏi.
theological_decisions:
- issue: Sắc thái của κύριε khi xưng hô với Chúa Giê-xu
  choice: Lạy Chúa
  alternative: Thưa Ngài
  rationale: “Lạy Chúa” giữ khả năng mang ý nghĩa thần học cao, còn chú thích bảo tồn khả năng đây chỉ là lời xưng hô kính trọng; không quyết định thay cho độc giả.
- issue: Khía cạnh của σῳζόμενοι
  choice: người được cứu
  alternative: những người đang được cứu
  rationale: “Được cứu” giữ thể bị động nhưng tự nhiên hơn trong câu hỏi tiếng Việt. Chú thích nêu cách dịch sát hơn nhằm bảo tồn khả năng phân từ hiện tại gợi một tiến trình hoặc trạng thái đang diễn ra, mà không áp đặt một hệ thống cứu rỗi học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thưa với” và “Lạy Chúa” để giữ sắc thái kính trọng; câu hỏi được sắp xếp tự nhiên theo cú pháp tiếng Việt. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
