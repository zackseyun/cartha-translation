  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của câu Hy Lạp: một người không nêu tên nói với Ngài; lời xưng hô Κύριε được dịch là “Lạy Chúa” nhưng chú thích vẫn giữ khả năng nghĩa xưng hô kính trọng; câu hỏi về số người được cứu; và lời đáp hướng đến số nhiều “họ”. Cách dịch “được cứu” bảo toàn thể bị động; chú thích b nêu đúng cách diễn đạt sát hơn của phân từ hiện tại có mạo từ.'
