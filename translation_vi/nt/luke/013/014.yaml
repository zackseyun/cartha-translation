  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: vi
  text: 'Nhưng trưởng hội đường đáp lại, vì tức giận việc Đức Giê-su đã chữa lành vào ngày Sa-bát, nên nói với đám đông: “Có sáu ngày phải làm việc; vậy hãy đến vào những ngày ấy để được chữa lành, chứ không phải vào ngày Sa-bát.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχισυνάγωγος
  choice: viên quản lý hội đường
  rationale: Chỉ người phụ trách các công việc của hội đường; cách dịch này tự nhiên và không gợi ý thẩm quyền dân sự.
- source_word: ἀποκριθεὶς δὲ
  choice: Nhưng ... nên lên tiếng nói
  rationale: δέ đánh dấu sự tương phản với việc chữa lành trước đó; ἀποκριθείς có thể chỉ hành động đáp lại tình huống, dù không có câu hỏi trực tiếp.
- source_word: ἀγανακτῶν
  choice: tức giận
  rationale: Diễn tả sự bất bình mạnh; trong tiếng Việt hiện đại, “tức giận” rõ ràng và tự nhiên, không thêm phán xét rằng sự phẫn nộ ấy là chính đáng.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: vì Đức Giê-su đã chữa lành trong ngày Sa-bát
  rationale: ὅτι mang nghĩa nguyên nhân; “đã chữa lành” chỉ hành động xảy ra trước lời phản đối.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: nói với đám đông
  rationale: Thì chưa hoàn thành của ἔλεγεν trình bày hành động lời nói trong diễn tiến; tiếng Việt tự nhiên không cần đánh dấu riêng sắc thái tiếp diễn tại đây.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: Có sáu ngày phải làm việc
  rationale: Giữ sức nặng nghĩa vụ của δεῖ, đồng thời dùng cấu trúc gọn và tự nhiên trong tiếng Việt.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: vậy hãy đến trong những ngày ấy để được chữa lành
  rationale: Bảo toàn suy luận của οὖν, lời kêu gọi đến, và thể bị động của θεραπεύεσθε.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: chứ đừng đến trong ngày Sa-bát
  rationale: Bổ sung lại động từ “đến” được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ và tự nhiên.
theological_decisions:
- issue: Lời khẳng định về sáu ngày làm việc và việc chữa lành trong ngày Sa-bát
  choice: Trình bày nguyên vẹn như lời phản đối mang tính quy phạm của viên quản lý hội đường, không xác nhận lời ấy là phán quyết của Đức Chúa Trời.
  alternative: Diễn giải thêm rằng ông giả hình hoặc rằng chữa lành chắc chắn không phải là công việc.
  rationale: Câu này chỉ thuật lại quan điểm và sự bất bình của nhân vật; bản dịch không nên đưa trước lời đánh giá hay kết luận thần học từ các câu kế tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su”, “hội đường” và “ngày Sa-bát” theo cách gọi Kinh Thánh quen thuộc; tránh lối dịch quá sát gây nặng câu.
