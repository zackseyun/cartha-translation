source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: vi
  text: 'Ngài nói với họ: “Hãy đi nói với con cáo ấy rằng: ‘Này, hôm nay và ngày mai Ta đuổi quỷ và thực hiện việc chữa lành; vào ngày thứ ba, Ta được đưa đến chỗ hoàn tất[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ta đạt tới đích”, “Ta được hoàn tất” hoặc “Ta hoàn thành hành trình.” Từ Hy Lạp có thể chỉ việc được đưa đến sự hoàn tất, có lẽ nói đến sự hoàn thành sứ mạng đã được định cho Đức Giê-su.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: con cáo
  rationale: Giữ nguyên hình ảnh ẩn dụ trực tiếp của danh từ Hy Lạp, không diễn giải thành “kẻ xảo quyệt”; “con cáo ấy” cũng giữ sắc thái chỉ định và khinh miệt của ταύτῃ.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Là từ thu hút sự chú ý, tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại mà không quá cổ kính.
- source_word: ἐκβάλλω δαιμόνια
  choice: Ta đuổi quỷ
  rationale: Cách nói quen thuộc, chính xác cho hành động trục xuất các quỷ; giữ sức mạnh của ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: thực hiện các việc chữa lành
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ἰάσεις là các hành động/kết quả chữa lành và phân biệt với động từ “đuổi” ở vế trước.
- source_word: σήμερον καὶ αὔριον
  choice: hôm nay và ngày mai
  rationale: Giữ nguyên cặp từ chỉ thời gian và để ngỏ khả năng đây vừa là thời gian theo nghĩa trực tiếp vừa là cách nói về một khoảng thời gian ngắn, xác định.
- source_word: τῇ τρίτῃ
  choice: đến ngày thứ ba
  rationale: Diễn đạt tự nhiên giá trị thời gian của cách thứ ba; “đến” làm rõ tiến trình dẫn tới điểm hoàn tất mà không thêm nội dung thần học.
- source_word: τελειοῦμαι
  choice: Ta được đưa đến chỗ hoàn tất
  rationale: Giữ thể bị động và ý nghĩa được làm cho hoàn tất/đạt tới sự hoàn thành, tránh khiến người đọc hiểu chủ yếu theo nghĩa hoàn thiện đạo đức.
theological_decisions:
- issue: Ý nghĩa của τελειοῦμαι đối với sứ mạng của Đức Giê-su và khả năng ám chỉ cái chết hoặc sự phục sinh
  choice: Ta được đưa đến chỗ hoàn tất
  alternative: Ta đạt tới đích; Ta được hoàn tất; Ta hoàn thành hành trình
  rationale: 'Bản dịch giữ thể bị động và sự rộng mở của nguyên văn: lời này có thể nói đến việc sứ mạng được hoàn tất, có khả năng hướng tới cái chết và sự vindication/phục sinh, nhưng không ghi rõ biến cố nào. Vì vậy không thu hẹp câu thành một cách giải thích giáo lý cụ thể.'
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời dẫn và “Ta” trong lời Đức Giê-su để giữ sắc thái tôn nghiêm; cấu trúc câu bám sát nhịp và sự căng thẳng của nguyên văn.
