review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng trình tự và ý loại trừ của câu. Tuy nhiên, «Nhưng ông sẽ đáp» làm liên từ καί mang sắc thái đối nghịch không có trong nguyên văn; và «Lạy Chúa» trong chính lời thoại của dụ ngôn dễ chuyển κύριε từ lời thưa với chủ nhà thành một danh xưng thần linh xác định. Cần giữ mơ hồ hợp lý của lời xưng hô này.
  naturalness: «đứng ngoài» tự nhiên hơn «đứng ở ngoài». Cấu trúc «Một khi ... thì ... sẽ bắt đầu» diễn đạt rõ quan hệ thời gian-hệ quả của mệnh đề Hy Lạp. «Thưa chủ» phù hợp với đối thoại trong dụ ngôn và nhất quán với «chủ nhà».
  terminology: Dùng «chủ nhà» cho οἰκοδεσπότης và «Thưa chủ» cho κύριε trong khung cảnh dụ ngôn. «Ta/các ngươi» giữ được giọng trang trọng, có thẩm quyền; «các ngươi» vẫn chấp nhận được trong văn phong Kinh Thánh hiện đại. Câu đáp dùng «Ta không biết các ngươi xuất thân từ đâu» giữ đối tượng «các ngươi» và ý πόθεν («từ đâu»), không biến nó thành chỉ một câu hỏi về địa lý.
  issues:
  - severity: medium
    issue: «Nhưng ông sẽ đáp» thêm sắc thái tương phản.
    rationale: 'καὶ ἀποκριθεὶς ἐρεῖ chỉ nối diễn tiến: «thì/người ấy sẽ đáp», không có từ nào tương đương «nhưng».'
  - severity: medium
    issue: «Lạy Chúa» định hướng lời xưng hô trong dụ ngôn quá mạnh theo nghĩa thần linh.
    rationale: κύριε có thể có âm hưởng thần học trong Lu-ca, nhưng ở đây người nói đang gọi οἰκοδεσπότης. «Thưa chủ» là cách dịch tự nhiên, bám ngữ cảnh, và không loại trừ tầng nghĩa rộng hơn của văn mạch.
  - severity: low
    issue: Bản chú thích hiện tại gọi là «sát nghĩa hơn» nhưng câu đề nghị không phải cách diễn đạt tiếng Việt tự nhiên.
    rationale: Nên giải thích trực tiếp rằng Hy Lạp nêu rõ cả tân ngữ «các ngươi» lẫn mệnh đề «từ đâu đến», thay vì đưa một câu Việt rời rạc.
