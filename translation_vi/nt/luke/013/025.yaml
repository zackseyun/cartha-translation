id: LUK.13.25
reference: Luke 13:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: vi
  text: 'Một khi chủ nhà đã đứng dậy và đóng cửa lại, thì các ngươi sẽ bắt đầu đứng ngoài và gõ cửa, nói: ‘Thưa chủ, xin mở cửa cho chúng tôi!’ Người ấy sẽ đáp: ‘Ta không biết các ngươi xuất thân từ đâu.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Câu Hy Lạp nêu rõ cả «các ngươi» và «từ đâu đến»: sát chữ, «Ta không biết các ngươi, từ đâu các ngươi đến.»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Một khi
  rationale: Diễn đạt tự nhiên mệnh đề thời gian bất định, đồng thời giữ ý hành động sau đó chỉ xảy ra khi chủ nhà đã đứng dậy và đóng cửa.
- source_word: ἐγερθῇ
  choice: đã đứng dậy
  rationale: Trong ngữ cảnh này là đứng dậy khỏi tư thế ngồi hoặc nằm, không mang nghĩa phục sinh.
- source_word: ὁ οἰκοδεσπότης
  choice: chủ nhà
  rationale: Cách gọi hiện đại, tự nhiên, chỉ người có quyền làm chủ trong nhà.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: đóng cửa lại
  rationale: Giữ nghĩa đóng kín, khiến những người bên ngoài không thể vào; 'lại' làm rõ tính hoàn tất mà không thêm ý khóa cửa.
- source_word: ἔξω ἑστάναι
  choice: đứng ở ngoài
  rationale: Phản ánh trạng thái đứng bên ngoài do dạng hoàn thành ἑστάναι diễn tả.
- source_word: κρούειν τὴν θύραν
  choice: gõ cửa
  rationale: Thành ngữ tiếng Việt tự nhiên và đúng mức độ của động từ, không cường điệu thành đập cửa.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách dịch truyền thống và sắc thái thần học có thể có của κύριος, trong khi ngữ cảnh dụ ngôn cũng cho phép hiểu là lời thưa với chủ nhà.
- source_word: ἄνοιξον ἡμῖν
  choice: xin mở cửa cho chúng tôi
  rationale: Tiếng Việt cần nêu 'cửa' để lời cầu xin tự nhiên; bổ sung này được suy ra trực tiếp từ ngữ cảnh.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Ta không biết các ngươi từ đâu đến
  rationale: Giữ cả đại từ tân ngữ ὑμᾶς và mệnh đề chỉ nguồn gốc πόθεν ἐστέ, đồng thời tạo câu tiếng Việt tự nhiên hơn lối bám chữ.
theological_decisions:
- issue: Cách dịch κύριος trong lời xưng hô thuộc dụ ngôn
  choice: Lạy Chúa
  alternative: Thưa chủ / Thưa ngài
  rationale: κύριος có thể là lời xưng hô với chủ nhà, nhưng 'Chúa' vừa giữ nghĩa từ vựng quen thuộc vừa không loại bỏ âm hưởng thần học trong văn mạch Lu-ca.
- issue: Quan hệ cú pháp trong οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Ta không biết các ngươi từ đâu đến
  alternative: Ta không biết các ngươi; các ngươi từ đâu đến
  rationale: Bản dịch giữ nguyên sự căng giữa tân ngữ 'các ngươi' và mệnh đề 'từ đâu đến', nhưng dùng cấu trúc tiếng Việt tự nhiên; không thu hẹp câu thành chỉ không biết xuất xứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi/ta” để thể hiện lời phán có thẩm quyền trong dụ ngôn; dùng “Lạy Chúa” cho κύριε. Dấu chú thích [a] được đặt ngay sau toàn bộ lời đáp vì chú thích giải thích cấu trúc của cả câu Hy Lạp.
