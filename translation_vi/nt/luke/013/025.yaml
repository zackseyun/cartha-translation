revisions:
- from: 'Một khi chủ nhà đã đứng dậy và đóng cửa lại, các ngươi bắt đầu đứng ở ngoài và gõ cửa, nói: ‘Lạy Chúa, xin mở cửa cho chúng tôi!’ Nhưng ông sẽ đáp: ‘Ta không biết các ngươi từ đâu đến.’[a]'
  to: 'Một khi chủ nhà đã đứng dậy và đóng cửa lại, thì các ngươi sẽ bắt đầu đứng ngoài và gõ cửa, nói: ‘Thưa chủ, xin mở cửa cho chúng tôi!’ Người ấy sẽ đáp: ‘Ta không biết các ngươi xuất thân từ đâu.’[a]'
  rationale: Sửa liên từ để phản ánh diễn tiến thay vì đối lập; dịch κύριε theo vai trò của người được gọi trong dụ ngôn; và chỉnh câu cùng chú thích để giữ rõ cả hai thành tố của Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ trong tiếng Việt tự nhiên.
  reviewer_model: gpt-5.6-terra
