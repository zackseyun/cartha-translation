id: LUK.13.10
reference: Luke 13:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἦν δὲ διδάσκων ἐν μιᾷ τῶν συναγωγῶν ἐν τοῖς σάββασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/010.yaml
  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: vi
  text: Ngài đang giảng dạy tại một trong các hội đường vào ngày Sa-bát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào các ngày Sa-bát”; tiếng Hy Lạp dùng hình thức số nhiều, nhưng hình thức này thường được dùng theo lối thành ngữ với nghĩa số ít là “ngày Sa-bát.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Ngài đang giảng dạy
  rationale: Cấu trúc περιφραστικός gồm động từ ἦν ở thì chưa hoàn thành và phân từ διδάσκων diễn tả một hành động đang tiếp diễn trong quá khứ. Tiếng Việt dùng “đang giảng dạy” để truyền đạt tự nhiên sắc thái ấy; δέ chỉ chuyển tiếp câu chuyện nên không cần dịch thành một liên từ riêng.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: tại một trong các hội đường
  rationale: Giữ nguyên cấu trúc bộ phận “một trong các” và dịch συναγωγή bằng thuật ngữ quen thuộc “hội đường,” chỉ cơ sở hội họp và thờ phượng của người Do Thái.
- source_word: ἐν τοῖς σάββασιν
  choice: vào ngày Sa-bát
  rationale: Dù σάββασιν có hình thức số nhiều, cách dùng này trong tiếng Hy Lạp Koinē thường có nghĩa thành ngữ số ít, chỉ ngày Sa-bát. Cách dịch số nhiều được ghi ở chú thích để bảo lưu khả năng hình thái.
theological_decisions: []
