  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh nói về Chúa Giê-su; “hội đường” và “ngày Sa-bát” là các thuật ngữ Kinh Thánh phổ thông trong tiếng Việt.
