revisions:
- from: 'Này[a], nhà của các ngươi bị bỏ lại cho các ngươi.[b] Nhưng tôi nói với các ngươi: các ngươi chắc chắn sẽ không thấy tôi cho đến khi thời điểm đến, lúc các ngươi nói rằng: “Phước cho Đấng đến nhân danh Chúa!”[c][d]'
  to: 'Này[a], nhà của các ngươi bị bỏ lại cho các ngươi.[b] Nhưng tôi nói với các ngươi: các ngươi chắc chắn sẽ không thấy tôi cho đến khi đến lúc các ngươi nói: “Phước cho Đấng đến nhân danh Chúa!”[c][d]'
  rationale: Chỉ chỉnh sửa cú pháp tiếng Việt ở mệnh đề thời gian và cách dẫn lời trích. Bản sửa bảo toàn thể bị động, mức độ mơ hồ của “nhà của các ngươi,” sắc thái phủ định mạnh, và tính mở của thời điểm lời trích được nói.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hy Lạp SBLGNT: mệnh lệnh thu hút chú ý ἰδού, thể bị động của ἀφίεται, cụm không xác định hơn “nhà của các ngươi,” phủ định tương lai nhấn mạnh οὐ μή, và lời trích Thi Thiên 118:26. Không nên thêm “hoang tàn,” vì từ này không có trong bản SBLGNT của Lu-ca 13:35.'
  naturalness: Câu “cho đến khi thời điểm đến, lúc các ngươi nói rằng” chưa tự nhiên trong tiếng Việt hiện đại. “Cho đến khi đến lúc các ngươi nói” là cấu trúc thời gian tự nhiên hơn và vẫn phản ánh ἕως ἥξει ὅτε. Bỏ “rằng” trước lời trích cũng giúp câu gọn và đúng nhịp văn hơn.
  terminology: “Này,”, “nhà của các ngươi,” “Phước cho Đấng đến nhân danh Chúa,” và các đại từ số nhiều đều phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng. Giữ “nhà” thay vì diễn giải thành đền thờ hoặc Giê-ru-sa-lem là cần thiết. Các chú thích bảo toàn đúng những khả năng diễn giải mà bản văn không quyết định.
  issues:
  - severity: low
    issue: Cấu trúc thời gian “cho đến khi thời điểm đến, lúc...” gượng và không tự nhiên.
    rationale: Cụm này dịch quá sát từng thành tố của ἕως ἥξει ὅτε. Tiếng Việt tự nhiên dùng “cho đến khi đến lúc...”, vẫn giữ rõ một thời điểm tương lai mà không giải thích thêm.
  - severity: low
    issue: “nói rằng:” trước một lời trích trực tiếp là thừa.
    rationale: Tiếng Việt có thể dẫn trực tiếp sau “nói:”; bỏ “rằng” cải thiện nhịp văn mà không ảnh hưởng ý nghĩa.
