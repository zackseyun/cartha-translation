id: LUK.13.35
reference: Luke 13:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: vi
  text: 'Này[a], nhà của các ngươi bị bỏ lại cho các ngươi.[b] Nhưng tôi nói với các ngươi: các ngươi chắc chắn sẽ không thấy tôi cho đến khi đến lúc các ngươi nói: “Phước cho Đấng đến nhân danh Chúa!”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Này” mở đầu một lời tuyên bố trang trọng, nhằm thu hút sự chú ý.
    reason: lexical_alternative
  - marker: b
    text: “Nhà của các ngươi” có lẽ chỉ Giê-ru-sa-lem, đặc biệt là đền thờ, nhưng tiếng Hy Lạp chỉ nói đơn giản là “nhà của các ngươi.” “Bị bỏ lại” cũng có thể hiểu là “bị bỏ hoang” hoặc “bị từ bỏ,” với sắc thái bị phó mặc để chịu phán xét.
    reason: alternative_reading
  - marker: c
    text: Câu “Phước cho Đấng đến nhân danh Chúa” vọng lại Thi Thiên 118:26.
    reason: cross_reference
  - marker: d
    text: Có người hiểu lời này chỉ việc Chúa Giê-su vào thành trong tiếng tung hô; người khác hiểu là sự thừa nhận Ngài trong tương lai. Bản Hy Lạp không buộc phải chọn một thời điểm cụ thể.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Từ cảm thán trang trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt và giữ chức năng thu hút sự chú ý.
- source_word: ἀφίεται
  choice: bị bỏ lại
  rationale: Giữ thể bị động và không quyết định quá mức giữa các sắc thái “bỏ lại,” “bỏ hoang” và “từ bỏ”; ngữ cảnh vẫn có thể hàm ý sự phó mặc để chịu phán xét.
- source_word: ὁ οἶκος ὑμῶν
  choice: nhà của các ngươi
  rationale: Dịch sát cụm từ Hy Lạp, không đưa cách hiểu “đền thờ” hay “Giê-ru-sa-lem” vào chính văn.
- source_word: λέγω δὲ ὑμῖν
  choice: Nhưng tôi nói với các ngươi
  rationale: δέ chuyển từ lời tuyên bố sang hệ quả và có thể mang sắc thái đối chiếu nhẹ; “nhưng” diễn đạt tự nhiên mà không làm tương phản quá mạnh.
- source_word: οὐ μὴ ἴδητέ με
  choice: các ngươi chắc chắn sẽ không thấy tôi
  rationale: Diễn đạt rõ sức nhấn mạnh của cấu trúc phủ định οὐ μή hướng về tương lai.
- source_word: ἕως ἥξει ὅτε
  choice: cho đến khi thời điểm đến, lúc
  rationale: Chuyển ngữ thành ngữ chỉ thời gian một cách rõ ràng, đồng thời giữ ý rằng một thời điểm tương lai sẽ đến.
- source_word: εἴπητε
  choice: các ngươi nói rằng
  rationale: Trong mệnh đề sau “cho đến khi,” cách nói hiện tại tự nhiên trong tiếng Việt vẫn chuyển tải sự kiện hướng đến tương lai.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Phước cho Đấng đến
  rationale: Giữ công thức chúc tụng và âm hưởng Thi Thiên 118:26; “Đấng” phù hợp với một nhân vật được xác định trong lời trích mà không bổ sung danh xưng thần học.
- source_word: ἐν ὀνόματι κυρίου
  choice: nhân danh Chúa
  rationale: Cách diễn đạt tự nhiên, quen thuộc trong tiếng Việt và tương ứng chính xác với công thức Hy Lạp.
theological_decisions:
- issue: Đối tượng được gọi là “nhà của các ngươi”
  choice: Giữ nguyên “nhà của các ngươi” trong chính văn
  alternative: đền thờ; Giê-ru-sa-lem; nhà Ít-ra-ên
  rationale: Ngữ cảnh cho thấy một đối tượng tập thể, có lẽ là Giê-ru-sa-lem và đặc biệt là đền thờ, nhưng bản Hy Lạp chỉ nói “nhà”; chính văn không nên thu hẹp điều còn hàm nghĩa.
- issue: Thời điểm ứng nghiệm của lời trích cuối câu
  choice: Giữ lời nói như một điều kiện trong tương lai mà không xác định biến cố
  alternative: cuộc vào thành khải hoàn; sự thừa nhận Chúa Giê-su trong tương lai; sự thừa nhận vào ngày Ngài trở lại
  rationale: Cú pháp Hy Lạp không bắt buộc chỉ một thời điểm cụ thể, nên bản dịch bảo toàn sự mở rộng và căng thẳng thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các ngươi” để giữ lời xưng hô số nhiều trực tiếp, nghiêm nghị; dùng “tôi” cho lời tự thuật của Chúa Giê-su nhằm tránh tự ý nâng cấp đại từ thành một khẳng định thần học không nằm trong hình thái Hy Lạp.
