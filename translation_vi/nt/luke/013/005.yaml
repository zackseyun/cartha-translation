review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc phủ định–điều kiện–hệ quả, diễn đạt μετανοῆτε bằng “ăn năn” phù hợp, và không thu hẹp ἀπολεῖσθε thành cái chết thể xác. Tuy nhiên, “Ta ... các con” thêm sắc thái quan hệ cha–con không có trong ὑμῖν, còn “bị diệt vong” dùng bị động không cần thiết đối với động từ trung động có nghĩa nội động trong ngữ cảnh này.
  naturalness: “Ta nói với các con” không tự nhiên cho lời nói với đám đông trong tiếng Việt hiện đại và có sắc thái giáo hội/cha–con. “Tôi nói với anh em” là lối xưng hô hiện đại, nghiêm trang, và không thêm quan hệ không được nêu. “Sẽ diệt vong” tự nhiên hơn “sẽ bị diệt vong.”
  terminology: “Ăn năn” là thuật ngữ Kinh Thánh phù hợp cho μετανοῆτε. “Diệt vong” bảo toàn mức độ nghiêm trọng của ἀπόλλυμι. “Cũng” cho ὡσαύτως được giữ trong chính văn; chú thích làm rõ khả năng so sánh mà không khẳng định đó nhất thiết là cùng cách thức.
  issues:
