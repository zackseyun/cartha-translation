    issue: Đại từ “Ta ... các con” thêm sắc thái cha–con.
    rationale: Nguyên ngữ chỉ có ngôi thứ nhất số ít và ngôi thứ hai số nhiều, không biểu thị quan hệ cha–con. Trong ngữ cảnh Chúa Giê-su nói với thính giả, cách xưng hô này dễ mang sắc thái diễn giải/giáo hội hơn là tương đương tối ưu.
  - severity: low
    issue: “Bị diệt vong” không cần thiết và kém tự nhiên.
    rationale: ἀπολεῖσθε là hình thức trung động với nghĩa “diệt vong/perish” trong ngữ cảnh này, không đòi hỏi một cấu trúc bị động tiếng Việt.
  - severity: low
    issue: Vị trí chú thích nên gắn trực tiếp với “cũng”.
    rationale: Chú thích giải thích ὡσαύτως, được dịch là “cũng”; đặt ký hiệu ngay sau từ này giúp neo chú thích chính xác hơn.
