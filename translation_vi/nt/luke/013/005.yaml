id: LUK.13.5
reference: Luke 13:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: vi
  text: Không, tôi nói với anh em; nhưng nếu anh em không ăn năn, thì tất cả anh em cũng[a] sẽ diệt vong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ diệt vong theo cách tương tự.” Từ Hy Lạp được dịch là “cũng” có thể chỉ một sự phán xét tương tự, xét theo các trường hợp vừa được nêu trước đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Không
  rationale: Lời phủ định trực tiếp và có sức nhấn mạnh đối với câu hỏi ngầm trong mạch văn trước; “Không” tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: Ta nói với các con
  rationale: Giữ sát công thức thường gặp trong Lu-ca; “Ta” phù hợp lời Chúa Giê-su, còn “các con” biểu đạt đại từ số nhiều ὑμῖν bằng lối nói dễ hiểu.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: nhưng nếu ... không
  rationale: Cấu trúc điều kiện phủ định này được diễn đạt tự nhiên trong tiếng Việt bằng “nhưng nếu ... không”, tương đương ý “trừ khi” mà không làm câu nặng nề.
- source_word: μετανοῆτε
  choice: ăn năn
  rationale: “Ăn năn” là cách nói Kinh Thánh quen thuộc về sự hối cải trước Đức Chúa Trời, rộng hơn sự đổi ý thuần túy và không áp đặt một hệ thống thần học chi tiết.
- source_word: πάντες
  choice: tất cả các con
  rationale: Nêu rõ phạm vi bao quát của lời cảnh báo và gắn πάντες với chủ thể số nhiều, không với cách thức bị diệt vong.
- source_word: ὡσαύτως
  choice: cũng
  rationale: Trong cấu trúc tiếng Việt, “cũng” diễn đạt sự tương ứng với những trường hợp vừa nêu mà vẫn để ngỏ phương diện so sánh; chú thích ghi nhận cách hiểu sát chữ hơn.
- source_word: ἀπολεῖσθε
  choice: sẽ bị diệt vong
  rationale: Diễn đạt tính tương lai và mức độ nghiêm trọng của ἀπόλλυμι, không thu hẹp lời cảnh báo thành cái chết thể xác đơn thuần.
theological_decisions:
- issue: Ý nghĩa của μετανοῆτε trong lời cảnh báo của Chúa Giê-su
  choice: Dịch là “ăn năn” mà không giới hạn vào cảm giác hối tiếc hay một định nghĩa tín lý đầy đủ về sự quy đạo.
  alternative: đổi lòng; quay trở lại
  rationale: Từ Hy Lạp chỉ sự hối cải trước Đức Chúa Trời trong ngữ cảnh này. “Ăn năn” giữ được sức nặng Kinh Thánh nhưng không giải nghĩa quá mức.
- issue: Sắc thái của ὡσαύτως ἀπολεῖσθε
  choice: Dịch trong chính văn là “cũng sẽ bị diệt vong”, đồng thời chú thích khả năng “sẽ bị diệt vong theo cùng một cách”.
  alternative: cũng sẽ chết; sẽ bị diệt vong theo cùng một cách
  rationale: Mạch văn cho thấy một sự so sánh với các nạn nhân vừa được nhắc đến, nhưng không xác định rõ đó là cùng cách thức, cùng tính chắc chắn hay cùng tính bất ngờ. Cách dịch và chú thích bảo toàn sự mơ hồ chính đáng.
translation_notes:
  register: Văn phong hiện đại, nghiêm trang và dễ hiểu. Dùng “Ta—các con” cho lời Chúa Giê-su nói với đám đông; giữ nhịp cảnh báo mạnh của câu Hy Lạp. Dấu chú thích [a] xuất hiện trong chính văn.
