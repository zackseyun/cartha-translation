revisions:
- from: Không, Ta nói với các con; nhưng nếu các con không ăn năn, thì tất cả các con cũng sẽ bị diệt vong.[a]
  to: Không, tôi nói với anh em; nhưng nếu anh em không ăn năn, thì tất cả anh em cũng[a] sẽ diệt vong.
  rationale: Bản sửa loại bỏ sắc thái cha–con không có trong nguyên ngữ, dùng cách diễn đạt hiện đại và tự nhiên hơn cho lời cảnh báo, đồng thời vẫn giữ phạm vi “tất cả”, ý nghĩa ăn năn, và sự mơ hồ có chủ ý của ὡσαύτως.
