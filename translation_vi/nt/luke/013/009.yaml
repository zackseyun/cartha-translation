id: LUK.13.9
reference: Luke 13:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: vi
  text: Và nếu trong thời gian tới[a] nó ra quả—còn nếu không, ông sẽ đốn nó đi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “năm tới”. Nguyên văn sát hơn là “cho thời gian sắp đến” hoặc “trong tương lai”; câu này không nêu rõ một năm, dù câu trước nói đến việc để cây lại “năm nay”.'
    reason: alternative_reading
  - marker: b
    text: Nguyên văn để vế tích cực bỏ lửng sau câu “nó ra quả—”, với ý ngầm có thể là “thì tốt”.
    reason: source_ellipsis
lexical_decisions:
- source_word: κἂν μὲν
  choice: Và nếu
  rationale: κἄν (καί + ἐάν) vừa nối tiếp lời trước vừa mở điều kiện; μέν chuẩn bị cho vế tương phản với δέ. “Và nếu” tự nhiên trong tiếng Việt mà vẫn giữ cả quan hệ nối kết lẫn điều kiện.
- source_word: ποιήσῃ καρπὸν
  choice: nó ra quả
  rationale: Khi đi với καρπός, ποιέω mang nghĩa thành ngữ là cây sinh hoặc ra quả. “Ra quả” là cách nói nông nghiệp tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: εἰς τὸ μέλλον
  choice: trong thời gian tới
  rationale: Cụm từ chỉ thời gian sắp đến hoặc tương lai nhưng không tự nó nêu rõ “năm tới”. Cách dịch này giữ được tính khái quát của nguyên văn.
- source_word: εἰ δὲ μήγε
  choice: còn nếu không
  rationale: δέ đánh dấu vế tương phản, còn μήγε phủ định điều kiện vừa nêu. “Còn nếu không” diễn đạt gọn và tự nhiên.
- source_word: ἐκκόψεις αὐτήν
  choice: ông sẽ đốn nó đi
  rationale: Trong bối cảnh chăm sóc cây, ἐκκόπτω có nghĩa đốn hoặc chặt bỏ. Đại từ ngôi thứ hai số ít được diễn đạt là “ông” vì người làm vườn đang thưa với chủ vườn; “nó” quy chiếu tự nhiên đến cây vả.
theological_decisions:
- issue: Thời điểm của sự trì hoãn phán xét trong dụ ngôn
  choice: Giữ cách nói khái quát “trong thời gian tới” trong chính văn.
  alternative: Dịch cụ thể là “năm tới” dựa theo “năm nay” ở câu trước.
  rationale: εἰς τὸ μέλλον trong câu này không nêu đích danh một năm. Không đưa “năm tới” vào chính văn giúp tránh làm cho thời hạn trở nên cụ thể hơn nguyên bản.
- issue: Vế kết quả không được nói rõ sau điều kiện tích cực
  choice: Giữ dấu gạch ngang, không thêm “thì tốt”.
  alternative: Bổ sung “thì tốt” để hoàn chỉnh câu theo nghĩa ngầm hiểu.
  rationale: Bản Hy Lạp chuyển thẳng từ “nếu nó ra quả…” sang vế “còn nếu không”, nên kết quả tích cực bị bỏ lửng và phải được hiểu theo ngữ cảnh. Giữ cấu trúc bỏ lửng bảo tồn nét tu từ và không biến phần ngầm hiểu thành lời minh nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ra quả” giữ hình ảnh nông nghiệp tự nhiên; “đốn nó đi” diễn tả hành động đối với cây mà không dùng lối nói quá cổ. Dấu gạch ngang tái hiện sự bỏ lửng có chủ ý của câu Hy Lạp.
