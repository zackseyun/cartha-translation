  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: vi
  text: Hay mười tám người kia bị tháp ở Si-lô-ê đổ xuống đè chết—các ông tưởng rằng họ mắc nợ nhiều hơn tất cả những người sống tại Giê-ru-sa-lem sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mắc nợ” dịch từ từ Hy Lạp có nghĩa đen là “những người mắc nợ.” Trong ngữ cảnh này, từ ấy có thể chỉ món nợ hoặc trách nhiệm về mặt đạo đức trước Đức Chúa Trời; cũng có thể dịch là “có tội nặng hơn” hoặc “là những kẻ phạm lỗi nặng hơn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Hay
  rationale: Mở đầu một ví dụ khác trong cùng lập luận; “Hay” giữ được mạch câu hỏi tu từ.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: mười tám người kia
  rationale: Diễn đạt tự nhiên cấu trúc chỉ định + số từ; “người” không xác định giới tính vì nhóm này không được bản Hy Lạp xác định là nam.
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος
  choice: bị tháp ... đổ xuống đè
  rationale: Giữ hình ảnh tháp rơi xuống trên họ, đồng thời dùng cách diễn đạt tiếng Việt tự nhiên cho tai nạn này.
- source_word: ἐν τῷ Σιλωὰμ
  choice: tại Si-lô-ê
  rationale: “Tại” phù hợp với địa danh; “Si-lô-ê” là dạng phiên âm quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: καὶ ἀπέκτεινεν αὐτούς
  choice: chết
  rationale: Kết hợp thành “đè chết” để diễn đạt tự nhiên rằng chính việc tháp đổ đã giết họ.
- source_word: δοκεῖτε ὅτι
  choice: các ông tưởng ... sao?
  rationale: Giữ lời chất vấn trực tiếp của Chúa Giê-su, với đại từ số nhiều phù hợp ngữ cảnh.
- source_word: ὀφειλέται ἐγένοντο
  choice: mắc tội
  rationale: Trong ngữ cảnh, ὀφειλέται chỉ tình trạng mắc nợ về mặt đạo đức, tức có tội; “mắc tội” vừa giữ được nét ‘mắc/nợ’ vừa tự nhiên hơn “trở thành con nợ” trong tiếng Việt.
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: nặng hơn tất cả những người
  rationale: παρά với đối cách biểu thị sự so sánh; “nặng hơn” làm rõ mức độ trách nhiệm đạo đức, còn ἀνθρώπους ở đây chỉ chung cư dân nên dịch là “những người”.
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: sống tại Giê-ru-sa-lem
  rationale: Diễn đạt tự nhiên phân từ hiện tại, giữ ý những người đang cư trú tại thành này.
theological_decisions:
- issue: Ý nghĩa của ὀφειλέται trong ngữ cảnh
  choice: mắc tội nặng hơn
  alternative: mắc nợ nhiều hơn; là những kẻ phạm tội nặng hơn
  rationale: Danh từ có nghĩa đen là “con nợ/người mắc nợ” nhưng ở đây mang nghĩa trách nhiệm đạo đức trước Đức Chúa Trời. “Mắc tội” bảo tồn phần nào ẩn dụ về sự mắc nợ mà không khiến độc giả hiểu thành nợ tiền; “nặng hơn” thể hiện phép so sánh của παρά.
- issue: Phạm vi của ἀνθρώπους
  choice: những người
  alternative: những người đàn ông
  rationale: Trong câu này từ này chỉ chung mọi cư dân Giê-ru-sa-lem, không có dấu hiệu giới hạn ở nam giới; “những người” là cách dịch chính xác về phạm vi.
- issue: Quan hệ giữa tai họa và mức độ tội lỗi
  choice: giữ dưới dạng câu hỏi tu từ, không khẳng định nạn nhân có tội nặng hơn
  alternative: diễn giải rằng tai họa chứng minh họ có tội nặng hơn
  rationale: Câu Hy Lạp chỉ đặt vấn đề để thách thức giả định của người nghe; bản dịch không được biến giả định ấy thành một kết luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để phản ánh đối tượng số nhiều trong lời chất vấn. Cấu trúc “tháp ... đổ xuống đè chết” tự nhiên trong tiếng Việt, còn chú thích bảo tồn ẩn dụ ‘con nợ’ của nguyên ngữ.
