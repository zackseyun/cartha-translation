base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: vi
  text: 'Người sẽ nói với các ngươi: “Ta không biết các ngươi từ đâu đến. Hãy rời xa Ta, tất cả những kẻ làm điều bất chính[a]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều sai trái” hoặc “sự bất công”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: Người sẽ nói với các ngươi
  rationale: Cấu trúc gồm động từ ‘sẽ nói’ và phân từ ‘nói’ mang tính lặp để dẫn lời trực tiếp. Tiếng Việt tự nhiên gộp chức năng của cả hai vào một mệnh đề mà không làm mất nội dung.
- source_word: οὐκ οἶδα
  choice: Ta không biết
  rationale: Giữ nghĩa trực tiếp của οἶδα là ‘biết’, đồng thời không diễn giải quá mức thành ‘không công nhận’ dù sắc thái đoạn văn có thể hàm ý sự khước từ quan hệ.
- source_word: πόθεν ἐστέ
  choice: các ngươi từ đâu đến
  rationale: Diễn đạt tự nhiên trong tiếng Việt về nguồn gốc hoặc xuất xứ, tương ứng với πόθεν.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Hãy rời khỏi ta
  rationale: Thể hiện mệnh lệnh dứt khoát phải tách xa người nói, với văn phong trang trọng nhưng vẫn hiện đại.
- source_word: πάντες ἐργάται ἀδικίας
  choice: tất cả những kẻ làm điều bất chính
  rationale: ‘Những kẻ làm’ truyền đạt người thường xuyên thực hiện hành vi; ‘điều bất chính’ giữ phạm vi đạo đức rộng của ἀδικία và tránh đưa riêng khái niệm ‘luật pháp’ vào câu.
theological_decisions:
- issue: Ý nghĩa của ἀδικίας trong lời phán xét
  choice: điều bất chính
  alternative: điều gian ác; điều sai trái; sự bất công
  rationale: ‘Điều bất chính’ giữ được sức nặng luân lý và mối liên hệ ý niệm với sự công chính, nhưng không thu hẹp từ này thành sự vi phạm luật pháp theo nghĩa chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. Đại từ “Người/ta/các ngươi” phù hợp với lời phán xét trong ngữ cảnh Kinh Thánh; dấu hai chấm thay cho việc dịch lặp cấu trúc dẫn lời của tiếng Hy Lạp.
