revisions:
- from: 'Người sẽ nói với các ngươi: “Ta không biết các ngươi từ đâu đến. Hãy rời khỏi ta, tất cả những kẻ làm điều bất chính[a]!”'
  to: 'Người sẽ nói với các ngươi: “Ta không biết các ngươi từ đâu đến. Hãy rời xa Ta, tất cả những kẻ làm điều bất chính[a]!”'
  rationale: Chỉnh nhẹ để câu mệnh lệnh tự nhiên hơn trong tiếng Việt, thống nhất quy ước đại từ tôn kính, và thu gọn các phương án chú thích vào những nghĩa gần với ἀδικία. Nghĩa câu, tính trực tiếp của lời phán xét, và sự không xác định rộng của thuật ngữ Hy Lạp đều được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của câu: lời nói ở thì tương lai, sự không thừa nhận nguồn gốc/quan hệ, mệnh lệnh tách khỏi người nói, và lời kết án những người thực hành ἀδικία. Việc không dịch riêng phân từ λέγων là phù hợp vì đây là lối dẫn lời trùng điệp trong tiếng Hy Lạp. “Điều bất chính” phản ánh tốt phạm vi luân lý rộng của ἀδικία, không đồng nhất hóa từ này với “vô luật pháp”.'
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “Hãy rời khỏi ta” có thể hiểu được, nhưng “Hãy rời xa Ta” là cách diễn đạt Việt ngữ trôi chảy hơn cho mệnh lệnh ἀπόστητε ἀπ’ ἐμοῦ. Viết hoa “Ta” cũng nhất quán với “Người” trong cách xưng hô tôn kính mà bản thảo đã chọn.
  terminology: “Những kẻ làm điều bất chính” giữ được nghĩa thực hành/hành nghề của ἐργάται và sức nặng đạo đức của ἀδικίας. Chú thích nên tránh “điều gian ác”, vì cụm này nghiêng rộng về sự dữ hơn là các lựa chọn gần với ἀδικία; “điều sai trái” và “sự bất công” là các phương án sát nghĩa hơn.
  issues:
  - severity: low
    issue: Cụm mệnh lệnh “Hãy rời khỏi ta” hơi kém tự nhiên trong tiếng Việt hiện đại.
    rationale: “Hãy rời xa Ta” diễn đạt rõ hành động tách khỏi người nói, tương ứng với ἀπόστητε ἀπ’ ἐμοῦ, mà vẫn giữ sắc thái mệnh lệnh dứt khoát.
  - severity: low
    issue: Đại từ “ta” chưa nhất quán về quy ước viết hoa với “Người”.
    rationale: Vì bản thảo đã dùng lối xưng hô tôn kính “Người”, viết “Ta” tạo sự nhất quán nội bộ; thay đổi này không ảnh hưởng nghĩa.
  - severity: low
    issue: Chú thích nêu “điều gian ác” như một phương án cho ἀδικία.
    rationale: Phương án này có phạm vi nghĩa rộng và sắc thái khác hơn; các lựa chọn “điều sai trái” và “sự bất công” gần với ἀδικία hơn.
