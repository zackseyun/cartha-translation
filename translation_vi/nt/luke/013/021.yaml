revisions:
- from: Nước Đức Chúa Trời giống như men[a] mà một người phụ nữ lấy, giấu[c] vào ba đấu bột[b], cho đến khi toàn bộ bột đều dậy men.
  to: Nước Đức Chúa Trời giống như men[a] mà một người phụ nữ lấy rồi giấu[c] vào ba sa-ta bột[b], cho đến khi cả khối bột đều dậy men.
  rationale: Sửa cách gọi và chú thích đơn vị đo để tránh một quy đổi văn hóa không chính xác, đồng thời chỉnh liên kết động từ cho tự nhiên hơn. Các sửa đổi không thêm diễn giải thần học và vẫn giữ nét nghĩa «giấu» của nguyên ngữ.
