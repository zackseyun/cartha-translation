review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng phép so sánh, hình ảnh men, hành động «lấy» và «giấu», cùng kết quả toàn bộ lượng bột được lên men. Tuy nhiên, «ba đấu bột» dễ bị hiểu là đơn vị «đấu» Việt Nam, không phải sa-ta/sê-a; chú thích hiện tại còn đưa ra ước lượng 35–40 lít không vững và có thể sai lệch đáng kể tùy chuẩn quy đổi.
  naturalness: Câu «mà một người phụ nữ lấy, giấu vào» hơi gãy trong tiếng Việt hiện đại. Thêm «rồi» làm rõ chuỗi hành động và tự nhiên hơn. «Cả khối bột» diễn đạt tự nhiên kết quả bao trùm của ὅλον.
  terminology: «Nước Đức Chúa Trời» và «men» phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Giữ «giấu» trong chính văn để phản ánh ἔκρυψεν; giải thích khả năng hiểu theo thao tác làm bánh ở chú thích. Dùng «sa-ta» trong chính văn tránh đồng nhất sai với một đơn vị Việt Nam.
  issues:
  - severity: medium
    issue: Đơn vị «đấu» và ước lượng 35–40 lít
    rationale: σάτα là dạng Hy Lạp của đơn vị Sê-mít seah, không phải «đấu» Việt Nam. Việc đồng nhất trong chính văn dễ tạo một quy đổi sai; con số 35–40 lít trong chú thích không phải là quy đổi chuẩn đáng tin cậy cho ba sê-a. Nên phiên âm đơn vị nguồn và chỉ giải thích là một lượng bột lớn.
  - severity: low
    issue: Liên kết hai động từ «lấy, giấu»
    rationale: Cấu trúc hiện có có thể hiểu được nhưng không trôi chảy. «Lấy rồi giấu» tự nhiên hơn mà vẫn phản ánh phân từ aorist trước động từ chính.
  revised_text: Nước Đức Chúa Trời giống như men[a] mà một người phụ nữ lấy rồi giấu[c] vào ba sa-ta bột[b], cho đến khi cả khối bột đều dậy men.
