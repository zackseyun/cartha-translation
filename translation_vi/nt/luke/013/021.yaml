language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: vi
  text: Nước Đức Chúa Trời giống như men[a] mà một người phụ nữ lấy rồi giấu[c] vào ba sa-ta bột[b], cho đến khi cả khối bột đều dậy men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chất làm dậy bột”. Từ Hy Lạp chỉ chất men được dùng trong khối bột.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “ba sa-ta” (khoảng ba sê-a), một đơn vị đo khô cổ; đây là một lượng bột lớn.'
    reason: cultural_note
  - marker: c
    text: Động từ Hy Lạp có nghĩa đen là “giấu” hoặc “che kín”; trong hình ảnh làm bánh, có thể hiểu là “trộn vào”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Nước Đức Chúa Trời giống như
  rationale: Tính từ giống cái ὁμοία nối lại chủ thể “Nước Đức Chúa Trời” trong ngữ cảnh trước. Lặp lại chủ thể trong tiếng Việt giúp câu đứng riêng vẫn rõ nghĩa, còn “giống như” diễn đạt tự nhiên phép so sánh của dụ ngôn.
- source_word: ζύμῃ
  choice: men
  rationale: “Men” là cách gọi tự nhiên trong tiếng Việt cho chất gây lên men trong bột, giữ được hình ảnh cổ mà không gợi riêng đến sản phẩm men thương mại hiện đại.
- source_word: λαβοῦσα γυνὴ
  choice: mà một người phụ nữ lấy
  rationale: Phân từ aorist được chuyển thành chuỗi hành động tự nhiên trong tiếng Việt; γυνή mang nghĩa không xác định trong dụ ngôn nên dịch là “một người phụ nữ”.
- source_word: ἔκρυψεν
  choice: giấu
  rationale: Giữ nghĩa trực tiếp “giấu/che kín” của động từ Hy Lạp, thay vì âm thầm giải thích thành “trộn”, đồng thời chú thích nghĩa phù hợp với thao tác làm bột.
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: vào ba đấu bột
  rationale: “Vào” phản ánh hướng của εἰς; “ba đấu” là cách diễn đạt gọn, dễ đọc về một lượng bột được đong, còn đơn vị Hy Lạp–Semit cụ thể và quy mô lớn được nêu trong chú thích.
- source_word: ἕως οὗ
  choice: cho đến khi
  rationale: Diễn đạt trực tiếp và tự nhiên mốc thời gian trong tiếng Việt.
- source_word: ἐζυμώθη ὅλον
  choice: toàn bộ bột đều dậy men
  rationale: Cách diễn đạt này giữ thể bị động về kết quả lên men và nhấn mạnh ὅλον, tức toàn bộ lượng bột, nhưng vẫn tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa biểu tượng của men trong dụ ngôn
  choice: Giữ hình ảnh “men” một cách trung tính, không chèn cách đánh giá tích cực hay tiêu cực vào bản dịch.
  alternative: Diễn giải men là sự tăng trưởng tích cực của vương quốc, hoặc là biểu tượng tiêu cực dựa trên những phân đoạn khác.
  rationale: Chính câu này chỉ đưa ra phép so sánh và nhấn mạnh tác động lan khắp. Bản dịch không nên giải quyết thay người đọc cuộc tranh luận thần học rộng hơn về biểu tượng của men.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng thông dụng. Câu giữ hình ảnh cụ thể và nét bất ngờ của động từ “giấu”, đồng thời dùng chú thích để giải thích đơn vị đo cổ và các phương án từ vựng mà không làm nặng phần chính văn.
