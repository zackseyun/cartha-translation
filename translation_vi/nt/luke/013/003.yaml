  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: vi
  text: Không, tôi nói với các ông; nhưng nếu các ông không ăn năn, các ông đều sẽ diệt vong như vậy[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “theo cùng một cách.” Từ được dịch là “như vậy” có thể chỉ một sự phán xét bất ngờ tương tự, không nhất thiết là cách chết y hệt.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Không đâu
  rationale: Diễn đạt lời phủ định mạnh đối với giả định ngầm trong ngữ cảnh trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ lời tuyên bố trực tiếp và nhấn mạnh của Chúa Giê-su với những người đang nghe; “các ông” thể hiện ngôi thứ hai số nhiều trong ngữ cảnh.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Đánh dấu sự tương phản trực tiếp với điều vừa bị phủ nhận.
- source_word: ἐὰν μὴ
  choice: nếu ... không
  rationale: Cấu trúc điều kiện phủ định này tự nhiên trong tiếng Việt và giữ nguyên lực cảnh báo của câu.
- source_word: μετανοῆτε
  choice: ăn năn
  rationale: Trong ngữ cảnh, từ này chỉ sự ăn năn trước Đức Chúa Trời, bao gồm thay đổi tâm trí và hướng sống, chứ không chỉ suy nghĩ lại về mặt trí thức.
- source_word: πάντες
  choice: tất cả các ông
  rationale: Thể hiện rõ phạm vi bao quát áp dụng cho toàn thể những người nghe.
- source_word: ὁμοίως
  choice: cũng ... như vậy
  rationale: Giữ phép so sánh với biến cố vừa được nhắc đến mà không khẳng định rằng cách chết phải hoàn toàn giống nhau.
- source_word: ἀπολεῖσθε
  choice: sẽ diệt vong
  rationale: Truyền đạt ý đi đến chỗ hủy hoại hoặc mất còn, đồng thời không thu hẹp lời cảnh báo vào cái chết thể xác hay diễn giải rõ thành án phạt đời đời.
theological_decisions:
- issue: Phạm vi ý nghĩa của ἀπολεῖσθε trong lời cảnh báo
  choice: sẽ diệt vong
  alternative: sẽ chết; sẽ bị hủy diệt; sẽ bị kết án đời đời
  rationale: Nguyên văn cảnh báo về sự phán xét nếu không ăn năn nhưng không xác định chính xác hình thức hoặc mức độ của sự diệt vong tại đây. Cách dịch này giữ nguyên sức nặng và sự căng thẳng thần học của câu.
- issue: Ý nghĩa của μετανοῆτε
  choice: ăn năn
  alternative: thay đổi suy nghĩ; đổi ý; quay trở lại
  rationale: “Ăn năn” truyền đạt chiều kích đạo đức và thuộc linh trong ngữ cảnh, không biến mệnh lệnh thành một sự thay đổi quan điểm thuần túy, đồng thời không thêm một hệ thống giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi ... các ông” để thể hiện lời nói trực tiếp với nhóm người nghe mà không sử dụng đại từ cổ; dùng “diệt vong” để giữ độ rộng nghĩa và sức nặng của lời cảnh báo.
