  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: vi
  text: Ngài đặt tay trên bà; lập tức bà đứng thẳng lên[a] và tôn vinh Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bà được làm cho đứng thẳng” hoặc “bà được làm cho thẳng người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: Ngài đặt tay trên bà
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp chỉ hành động đặt tay trên một người; đại từ sở hữu không cần nêu trong tiếng Việt.
- source_word: παραχρῆμα
  choice: lập tức
  rationale: Giữ rõ ý sự việc xảy ra ngay, đồng thời phù hợp văn phong kể chuyện trang trọng, hiện đại.
- source_word: ἀνωρθώθη
  choice: bà đứng thẳng lên
  rationale: Trong ngữ cảnh người phụ nữ vốn còng lưng, cách dịch này diễn đạt sự phục hồi tư thế mà không thêm từ 'lại', vốn không được nói tường minh trong động từ Hy Lạp. Chú thích giữ các khả năng diễn đạt theo thể bị động.
- source_word: ἐδόξαζεν
  choice: tôn vinh
  rationale: Giữ sắc thái thần học của δοξάζω là dâng vinh quang cho Đức Chúa Trời; dạng chưa hoàn thành có thể hàm ý hành động đang tiếp diễn nhưng tiếng Việt không cần đánh dấu cứng nhắc.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt cho θεός khi chỉ Đức Chúa Trời.
theological_decisions:
- issue: Kết quả chữa lành được mô tả bởi ἀνωρθώθη
  choice: bà đứng thẳng lên
  alternative: bà được làm cho thẳng lại; bà được làm cho đứng thẳng
  rationale: Bản dịch chính tự nhiên trong tiếng Việt và phù hợp tình trạng còng lưng ở văn cảnh trước; chú thích bảo tồn sắc thái bị động cùng sự mơ hồ về cách diễn đạt, không xác định thêm cơ chế chữa lành.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để nối chủ thể là Chúa Giê-su trong ngữ cảnh và “bà” cho người phụ nữ; câu văn gọn, giữ chuỗi hành động của nguyên bản.
