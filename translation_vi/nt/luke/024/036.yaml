  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: vi
  text: Khi họ đang nói những điều ấy, chính Ngài đứng giữa họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản thêm: “và Ngài nói với họ: ‘Bình an cho anh em.’”'
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều ấy
  rationale: Giữ dạng số nhiều của đại từ chỉ định và liên kết rõ với những việc họ vừa thuật lại; “ấy” tự nhiên trong văn kể trang trọng.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Khi họ đang nói
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ hiện tại diễn tả hành động đang diễn ra đồng thời; “khi ... đang” chuyển tải tự nhiên quan hệ thời gian này.
- source_word: αὐτὸς
  choice: chính Ngài
  rationale: “Chính” bảo tồn sắc thái nhấn mạnh của đại từ Hy Lạp; “Ngài” là cách gọi trang trọng, dễ hiểu dành cho Chúa Giê-su trong ngữ cảnh.
- source_word: ἔστη
  choice: đứng
  rationale: Dịch trực tiếp động từ ἵστημι, không diễn giải thành “hiện ra” hay thêm chuyển động không được nói rõ.
- source_word: ἐν μέσῳ αὐτῶν
  choice: giữa họ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, chỉ việc Ngài hiện diện ở giữa nhóm người ấy.
theological_decisions:
- issue: 'Có đưa lời chào dài hơn “và Ngài phán với họ: ‘Bình an cho các con!’” vào chính văn hay không'
  choice: Không đưa vào chính văn, theo văn bản SBLGNT được cung cấp.
  alternative: 'Một số thủ bản thêm: “và Ngài phán với họ: ‘Bình an cho các con!’”'
  rationale: Bản dịch ưu tiên văn bản Hy Lạp nguồn đã cho, nhưng ghi nhận dị bản có ý nghĩa trong chú thích thay vì âm thầm bỏ qua.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ sắc thái nhấn mạnh của αὐτός và tính đột ngột của sự kiện mà không thêm từ “hiện ra” vốn không có trong nguồn.
