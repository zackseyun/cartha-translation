lexical_decisions:
- source_word: οἱ δὲ
  choice: Họ
  rationale: οἱ được dùng như đại từ chỉ những người đang tụ họp; δέ là từ nối nhẹ. Trong tiếng Việt, lược dịch δέ giúp câu tự nhiên mà không tạo sắc thái tương phản quá mức.
- source_word: ἐπέδωκαν αὐτῷ
  choice: đưa cho Ngài
  rationale: ἐπιδίδωμι ở đây có nghĩa là trao hoặc đưa cho; cấu trúc “đưa cho Ngài” diễn đạt tự nhiên cả động từ lẫn tân ngữ gián tiếp αὐτῷ.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: một miếng cá nướng
  rationale: μέρος là danh từ trung tâm, nghĩa là “miếng/phần”; ἰχθύος ὀπτοῦ chỉ chất liệu của miếng ấy, tức cá đã được làm chín bằng cách nướng. “Một miếng cá nướng” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὀπτοῦ
  choice: nướng
  rationale: ὀπτός chỉ thức ăn được làm chín bằng cách nướng; “nướng” chính xác hơn từ rộng nghĩa “nấu chín” và tự nhiên hơn việc cố phân biệt các kỹ thuật nướng hiện đại.
theological_decisions:
- issue: Dạng văn bản của Lu-ca 24:42
  choice: 'Chỉ dịch bản văn SBLGNT: “một miếng cá nướng.”'
  alternative: 'Một số thủ bản muộn hơn thêm: “và một phần tổ ong.”'
  rationale: Bản văn Hy Lạp được cung cấp kết thúc ở μέρος và không có phần đọc dài hơn. Bản dịch theo bản văn phê bình đã cho, đồng thời ghi nhận dị bản quen thuộc trong chú thích để minh bạch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo lối xưng hô kính trọng phổ biến; câu ngắn giữ đúng tính trực tiếp của nguyên văn.
