  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc chính của câu: sự nhấn mạnh ở αὐτοὶ, nội dung họ thuật lại, và thể bị động của ἐγνώσθη. Tuy nhiên, “những việc trên đường” hơi thiếu tự nhiên và có thể được làm rõ thành những việc đã xảy ra trên đường mà không thêm ý đáng kể. “Khi bẻ bánh” là tự nhiên, nhưng “trong lúc bẻ bánh” bám sát hơn chức năng hoàn cảnh của ἐν τῇ κλάσει τοῦ ἄρτου.'
  naturalness: “Ngài đã được họ nhận biết thế nào” hiểu được nhưng hơi nặng trong tiếng Việt hiện đại. “Ngài đã được họ nhận ra thế nào” tự nhiên hơn, vẫn giữ được hướng bị động của nguyên văn. “Chính họ” diễn đạt sự nhấn mạnh mà không lặp lại cách chỉ hai người vốn đã rõ theo ngữ cảnh.
  terminology: “Ngài” phù hợp văn phong Kinh Thánh trang trọng. “Bẻ bánh” là cách dùng chuẩn cho κλάσις τοῦ ἄρτου trong ngữ cảnh bữa ăn và không áp đặt một cách hiểu nghi lễ. Chú thích cần trình bày phương án “được tỏ cho họ biết” như một cách diễn đạt khác của sắc thái bị động, không như một khẳng định giáo lý.
  issues:
