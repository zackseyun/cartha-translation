  - severity: low
    issue: “Được họ nhận biết” kém tự nhiên hơn “được họ nhận ra.”
    rationale: “Nhận ra” là cách diễn đạt thông dụng cho sự nhận diện một người trong tiếng Việt, đồng thời vẫn có thể giữ cấu trúc bị động tương ứng với ἐγνώσθη.
