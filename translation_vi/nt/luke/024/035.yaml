  rationale: Bản sửa giữ sự nhấn mạnh của αὐτοὶ, diễn đạt tự nhiên hơn cụm tỉnh lược τὰ ἐν τῇ ὁδῷ, và dùng “được họ nhận ra” để vừa bảo tồn thể bị động vừa phù hợp tiếng Việt hiện đại. “Trong lúc bẻ bánh” duy trì tính chất hoàn cảnh của cụm giới từ Hy Lạp. Chú thích bảo lưu cách hiểu khác của thể bị động mà không quyết định hàm ý thần học.
