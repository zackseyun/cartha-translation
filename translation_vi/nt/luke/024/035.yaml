base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: vi
  text: Chính họ thuật lại những việc đã xảy ra trên đường, và Ngài đã được họ nhận ra thế nào trong lúc bẻ bánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngài đã được tỏ cho họ biết trong lúc bẻ bánh.” Động từ Hy Lạp ở thể bị động; cách này có thể nhấn mạnh hoặc việc họ nhận ra Ngài, hoặc việc Ngài được làm cho họ nhận biết.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: chính hai người ấy
  rationale: Đại từ được nêu rõ mang sắc thái nhấn mạnh; theo ngữ cảnh, đó là hai môn đồ vừa trở về và giờ chính họ thuật lại sự việc.
- source_word: ἐξηγοῦντο
  choice: thuật lại
  rationale: Động từ diễn tả việc kể lại hoặc trình bày các sự việc; dạng chưa hoàn thành gợi một hành động đang diễn ra, và tiếng Việt tự nhiên có thể chuyển bằng “thuật lại”.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: những việc trên đường
  rationale: Giữ nét cô đọng của cụm Hy Lạp, trong khi ngữ cảnh giúp người đọc hiểu đó là những việc xảy ra trên đường.
- source_word: ὡς
  choice: thế nào
  rationale: Dẫn vào nội dung về cách thức hoặc hoàn cảnh Ngài được nhận biết.
- source_word: ἐγνώσθη αὐτοῖς
  choice: Ngài đã được họ nhận biết
  rationale: Giữ thể bị động của nguyên văn và không quyết định dứt khoát giữa việc họ nhận ra Ngài với việc Ngài được tỏ cho họ biết.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: khi bẻ bánh
  rationale: Trong tiếng Việt, đây là cách diễn đạt tự nhiên cho hoàn cảnh nhận biết được kể ngay trước đó; “bánh” phù hợp với ἄρτος mà không thêm chi tiết không có trong bản văn.
theological_decisions:
- issue: Thể bị động ἐγνώσθη có nhấn mạnh sự nhận ra của các môn đồ hay việc Chúa Giê-su được tỏ cho họ biết
  choice: Ngài đã được họ nhận biết
  alternative: họ đã nhận ra Ngài; Ngài đã tỏ mình cho họ biết
  rationale: 'Bản dịch giữ cấu trúc bị động để bảo tồn sức căng của nguyên văn: sự kiện có thể được nhìn từ phía họ nhận biết Ngài, đồng thời vẫn để ngỏ hàm ý rằng sự nhận biết ấy được ban cho.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chính hai người ấy” bảo tồn sự nhấn mạnh của αὐτοὶ; “những việc trên đường” giữ độ cô đọng của nguyên văn; đại từ “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt mà không thêm danh xưng vào câu.
