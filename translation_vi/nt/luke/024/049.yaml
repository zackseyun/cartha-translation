review_pass:
  verdict: revise
  source_fidelity: Bản nháp nhìn chung bám sát cấu trúc và các hình ảnh chính của câu Hy Lạp, nhất là mệnh lệnh ở lại trong thành và ẩn dụ được mặc lấy quyền năng. Tuy nhiên, “xuống trên” thêm hướng chuyển động không được nêu trực tiếp trong ἐφ’ ὑμᾶς, và “từ trời cao” diễn giải ὕψους cụ thể hơn mức nguyên văn.
  naturalness: “Sai điều ... đã hứa xuống trên các con” hơi gượng trong tiếng Việt hiện đại. “Gửi ... đến với các con” tự nhiên hơn, đồng thời vẫn truyền đạt hành động sai/gửi hướng tới những người nghe.
  terminology: Dùng “lời hứa của Cha Ta” sát τὴν ἐπαγγελίαν τοῦ πατρός μου hơn “điều Cha Ta đã hứa”, vì giữ được danh từ “lời hứa” và quan hệ sở hữu trong nguyên văn. “Từ trên cao” giữ tính mở của ἐξ ὕψους, không diễn giải thành một địa điểm cụ thể.
  issues:
  - severity: medium
    issue: “xuống trên” thêm nét nghĩa hướng xuống
    rationale: ἐφ’ ὑμᾶς nghĩa là “trên/đến trên các anh em”; động từ ἐξαποστέλλω không tự nó nêu “xuống”. Nét này có thể được suy ra từ văn mạch, nhưng không nên đưa vào bản văn.
  - severity: low
    issue: “từ trời cao” cụ thể hóa “từ trên cao”
    rationale: ἐξ ὕψους nói “từ trên cao/on high”. Dù có thể hàm ý nguồn thiên thượng, “từ trên cao” giữ sát hơn cách nói mở của nguyên văn.
  - severity: low
    issue: “điều Cha Ta đã hứa” không giữ trực tiếp danh từ “lời hứa”
    rationale: Cách diễn đạt này vẫn hiểu được, nhưng “lời hứa của Cha Ta” bám sát ἐπαγγελία và τοῦ πατρός μου hơn.
  revised_text: Này, chính Ta sẽ gửi lời hứa của Cha Ta đến với các con. Còn các con, hãy ở lại trong thành cho đến khi được mặc lấy quyền năng từ trên cao.
