revisions:
- from: Này, chính Ta sẽ sai điều Cha Ta đã hứa xuống trên các con. Còn các con, hãy ở lại trong thành cho đến khi được mặc lấy quyền năng từ trời cao.
  to: Này, chính Ta sẽ gửi lời hứa của Cha Ta đến với các con. Còn các con, hãy ở lại trong thành cho đến khi được mặc lấy quyền năng từ trên cao.
  rationale: Bản sửa loại bỏ nét nghĩa “xuống” không có trong nguyên văn, giữ “lời hứa” là danh từ và bảo toàn tính không xác định cụ thể của “từ trên cao”. Cấu trúc đối lập “Còn các con” và hình ảnh thụ động “được mặc lấy” vẫn được giữ nguyên.
  reviewer_model: gpt-5.6-terra
