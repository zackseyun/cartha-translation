source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: vi
  text: Này, chính Ta sẽ gửi lời hứa của Cha Ta đến với các con. Còn các con, hãy ở lại trong thành cho đến khi được mặc lấy quyền năng từ trên cao.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Này
  rationale: Dấu hiệu thu hút sự chú ý, tự nhiên và trang trọng trong văn cảnh lời phán; tránh cách dịch quá cổ như “kìa”.
- source_word: ἐγὼ ἐξαποστέλλω
  choice: chính Ta sẽ sai
  rationale: Đại từ ἐγώ được thể hiện bằng “chính Ta” để giữ sắc thái nhấn mạnh. Hiện tại Hy Lạp có thể chỉ hành động sắp xảy ra; tiếng Việt dùng tương lai để phù hợp thời điểm ứng nghiệm gần kề.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: điều Cha Ta đã hứa
  rationale: Chuyển danh từ “lời/điều hứa” thành mệnh đề tự nhiên trong tiếng Việt, vẫn giữ nguồn của lời hứa là Cha của Chúa Giê-su và không nói rõ đối tượng được hứa là ai.
- source_word: ἐφ’ ὑμᾶς
  choice: xuống trên các con
  rationale: Giữ hình ảnh hướng đến và phủ trên người nhận của giới từ ἐπί, đồng thời kết hợp tự nhiên với động từ “sai”.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: hãy ở lại trong thành
  rationale: καθίζω ở đây mang nghĩa lưu lại/chờ tại chỗ, không đơn thuần là tư thế ngồi. “Trong thành” giữ cách nói không nêu tên thành phố của nguyên văn.
- source_word: ἐνδύσησθε
  choice: được mặc lấy
  rationale: Giữ ẩn dụ mặc một vật như áo và hình thái thụ động, thay vì diễn giải thành “nhận được”.
- source_word: ἐξ ὕψους δύναμιν
  choice: quyền năng từ trời cao
  rationale: δύναμις là năng lực/quyền năng; “từ trời cao” diễn đạt tự nhiên nguồn ở trên cao mà không thu hẹp ngay thành một danh xưng thần học.
theological_decisions:
- issue: “Điều Cha Ta đã hứa” chỉ về điều gì
  choice: Không bổ sung danh xưng “Đức Thánh Linh” trong chính câu
  alternative: “Đức Thánh Linh mà Cha Ta đã hứa”
  rationale: Văn mạch cho phép nhận diện điều hứa ấy, nhưng câu Hy Lạp dùng cách nói gián tiếp. Giữ nguyên mức độ hàm ẩn tránh đưa phần giải thích vào bản văn.
- issue: Quan hệ giữa “điều đã hứa” và “quyền năng từ trời cao”
  choice: Giữ hai cách diễn đạt song song mà không đồng nhất hóa bằng lời giải thích thêm
  alternative: Diễn giải cả hai trực tiếp là Đức Thánh Linh
  rationale: Nguyên văn đặt hai hình ảnh gần nhau nhưng không thêm một mệnh đề giải thích trực tiếp; bản dịch giữ cấu trúc và sức căng thần học đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/các con” cho lời Chúa Giê-su nói với các môn đồ, nhất quán về ngôi xưng hô và không quá cổ kính.
