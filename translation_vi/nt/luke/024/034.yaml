  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: vi
  text: 'họ nói: “Chúa thật sự đã được làm cho sống lại[a] và đã hiện ra với Si-môn!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa quả thật đã sống lại” hoặc “Chúa thật sự đã được vực dậy.” Trạng từ và động từ Hy Lạp cho phép vài cách diễn đạt gần nghĩa; bản chính giữ thể bị động của động từ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντας
  choice: họ nói
  rationale: Phân từ hiện tại, đối cách, số nhiều, nối với chủ thể trong câu rộng hơn. Tiếng Việt tự nhiên hơn khi chuyển thành mệnh đề có chủ ngữ “họ”, nhưng không thêm danh tính của những người nói.
- source_word: ὅτι
  choice: dấu hai chấm và ngoặc kép
  rationale: ὅτι dẫn nội dung lời nói trực tiếp; dấu câu tiếng Việt truyền đạt chức năng này tự nhiên hơn cách dịch máy móc là “rằng” trước một lời trích dẫn.
- source_word: ὄντως
  choice: thật sự
  rationale: Giữ sắc thái nhấn mạnh rằng lời loan báo là một sự thật, bằng cách diễn đạt thông dụng và trang trọng trong tiếng Việt hiện đại.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Động từ aorist thể bị động của ἐγείρω. Cách dịch này giữ thể bị động và nghĩa phục sinh, dù kém gọn hơn cách nói quen thuộc “đã sống lại”.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Trong ngữ cảnh này, κύριος là tước hiệu chỉ Đức Giê-su; “Chúa” giữ được sức nặng Cơ Đốc học mà không diễn giải thêm.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối lời xác nhận về sự phục sinh với việc hiện ra cho Si-môn.
- source_word: ὤφθη
  choice: đã hiện ra với
  rationale: Hình thức bị động của ὁράω được dùng theo nghĩa quen thuộc về một cuộc hiện ra. “Hiện ra với” tự nhiên trong tiếng Việt và không buộc phải dịch cứng là “đã được nhìn thấy”.
- source_word: Σίμωνι
  choice: Si-môn
  rationale: Giữ đúng tên riêng Σίμων ở cách tặng dữ; bản Hy Lạp chỉ nói Si-môn, không nói rõ “Si-môn Phi-e-rơ”.
theological_decisions:
- issue: Thể của động từ phục sinh
  choice: đã được làm cho sống lại
  alternative: đã sống lại; đã được vực dậy
  rationale: Bản Hy Lạp dùng thể bị động ἠγέρθη. Bản chính giữ thể này để không âm thầm đổi sắc thái thần học, đồng thời dùng “sống lại” để làm rõ đây là sự phục sinh chứ không chỉ là đứng dậy.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: chủ; thầy
  rationale: Trong lời công bố phục sinh này, từ ấy là tước hiệu dành cho Đức Giê-su. “Chúa” giữ nguyên trọng lượng của tước hiệu mà không làm yếu hay mở rộng nghĩa.
- issue: Cách hiểu ὤφθη
  choice: đã hiện ra với Si-môn
  alternative: đã được Si-môn nhìn thấy
  rationale: Dù hình thức Hy Lạp là bị động, động từ này thường diễn tả việc một người hiện ra trước người khác. Cách dịch đã chọn giữ trọng tâm ở sự hiện ra và tránh hàm ý rằng Si-môn tình cờ trông thấy Chúa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Si-môn” theo lối phiên âm quen thuộc; tránh thêm “Phi-e-rơ” vì nguyên văn không có. Cấu trúc trích dẫn được điều chỉnh theo cú pháp tiếng Việt, còn thể bị động của lời công bố phục sinh được cố ý bảo tồn.
