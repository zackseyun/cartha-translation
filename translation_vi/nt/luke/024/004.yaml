id: LUK.24.4
reference: Luke 24:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: vi
  text: Đang khi họ còn bối rối về việc ấy, thì kìa, hai người đàn ông đứng bên họ, mặc y phục sáng chói[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “mặc y phục lóe sáng như chớp.”'
    reason: Bảo tồn hình ảnh ánh chớp hàm chứa trong ἀστραπτούσῃ, trong khi bản văn chính dùng cách diễn đạt tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: ἐγένετο
  choice: Đang khi… thì
  rationale: Công thức dẫn chuyện của Lu-ca được diễn đạt bằng cấu trúc kể chuyện tự nhiên trong tiếng Việt; cấu trúc này vẫn giới thiệu biến cố xảy ra trong lúc các phụ nữ đang bối rối mà không dùng lối nói gượng như “chuyện xảy ra là”.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: Đang khi họ còn bối rối
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ mang nghĩa thời gian; ἀπορέω chỉ trạng thái lúng túng, không biết phải hiểu hay xử trí thế nào, mạnh hơn ý đơn thuần ngạc nhiên.
- source_word: περὶ τούτου
  choice: về việc ấy
  rationale: Cụm từ quy chiếu tự nhiên đến sự việc vừa được thuật lại; “ấy” hợp với văn phong trang trọng vừa phải.
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và nét sống động của một diễn biến bất ngờ, thay vì âm thầm diễn giải thành trạng từ “bỗng nhiên”.
- source_word: ἄνδρες δύο
  choice: hai người đàn ông
  rationale: ἀνήρ chỉ người nam; cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ nguyên cách câu chuyện trình bày hai nhân vật ở câu này.
- source_word: ἐπέστησαν αὐταῖς
  choice: đứng bên họ
  rationale: Giữ ý không gian là đứng sát hoặc đứng gần các phụ nữ, không diễn giải trước rằng họ “hiện ra”.
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: mặc y phục sáng chói
  rationale: Diễn đạt tự nhiên vẻ rực sáng của y phục; hình ảnh cụ thể hơn về ánh chớp được bảo tồn trong chú thích.
theological_decisions:
- issue: Danh tính của hai nhân vật
  choice: Dịch là “hai người đàn ông” theo cách trình bày trực tiếp của câu Hy Lạp.
  alternative: hai thiên sứ
  rationale: Dù văn cảnh rộng hơn cho thấy họ là các sứ giả từ trời, câu này gọi họ là ἄνδρες. Không đưa nhận định từ văn cảnh kế cận vào bản dịch chính của câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Kìa” duy trì dấu hiệu tu từ nổi bật của ἰδού; “y phục” tạo sắc thái trang nghiêm vừa phải. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
