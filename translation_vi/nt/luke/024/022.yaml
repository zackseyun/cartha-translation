base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: vi
  text: 'Nhưng cũng có vài phụ nữ trong nhóm chúng tôi đã làm chúng tôi kinh ngạc[a]: họ ra mộ từ sáng sớm[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “làm chúng tôi sửng sốt” hoặc “làm chúng tôi bối rối.” Động từ Hy Lạp có thể diễn tả sự ngạc nhiên mạnh hoặc trạng thái mất phương hướng.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “lúc rạng đông.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Hơn nữa
  rationale: Trong mạch lời kể, cụm này bổ sung một diễn biến bất ngờ bên cạnh nỗi thất vọng vừa nêu; “Hơn nữa” diễn đạt tự nhiên lực bổ sung có sắc thái chuyển ý.
- source_word: γυναῖκές τινες
  choice: vài phụ nữ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho một số người nữ không xác định.
- source_word: ἐξ ἡμῶν
  choice: trong nhóm chúng tôi
  rationale: Cho thấy các phụ nữ thuộc về cộng đồng môn đồ của người nói, chứ không chỉ xuất phát từ chỗ họ.
- source_word: ἐξέστησαν ἡμᾶς
  choice: đã làm chúng tôi kinh ngạc
  rationale: Giữ được mức độ phản ứng mạnh của động từ mà không khẳng định riêng sự tin tưởng hay hoang mang.
- source_word: γενόμεναι
  choice: Họ đến
  rationale: Khi đi với ὀρθριναὶ và cụm chỉ hướng đến mộ, phân từ được diễn đạt tự nhiên trong tiếng Việt bằng hành động đến nơi ấy.
- source_word: ὀρθριναὶ
  choice: từ sáng sớm
  rationale: Diễn đạt rõ thời điểm rất sớm; “từ” kết hợp tự nhiên với động từ “đến” trong lời kể.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: đến mộ
  rationale: ἐπί với đối cách phù hợp với hướng chuyển động; “mộ” là từ phổ thông, trang trọng vừa phải trong ngữ cảnh mai táng Chúa Giê-su.
theological_decisions:
- issue: Sắc thái của ἐξέστησαν trong lời tường thuật về sự sống lại
  choice: làm chúng tôi kinh ngạc
  alternative: làm chúng tôi sửng sốt; làm chúng tôi bối rối
  rationale: “Kinh ngạc” giữ nguyên sức mạnh và độ mở của phản ứng, không áp đặt rằng các môn đồ đã tin hay không tin lời các phụ nữ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tách phân từ thành câu thứ hai để lời kể tự nhiên, đồng thời giữ dấu phẩy cuối câu theo tính chất câu chưa kết thúc của câu 22 trong văn mạch.
