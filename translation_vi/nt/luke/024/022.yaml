  to: 'Nhưng cũng có vài phụ nữ trong nhóm chúng tôi đã làm chúng tôi kinh ngạc[a]: họ ra mộ từ sáng sớm[b].'
  rationale: Đổi “Hơn nữa” thành “Nhưng cũng” để phản ánh lực ἀλλὰ καὶ. Đổi “Họ đến mộ” thành “họ ra mộ” là cách nói tự nhiên hơn cho chuyển động hướng đến mộ trong tiếng Việt, đồng thời giữ hướng tính của ἐπὶ với đối cách. Dùng dấu hai chấm và dấu chấm hoàn chỉnh hóa câu trình bày độc lập, không thêm hay giải quyết bất cứ hàm ý thần học nào.
