id: LUK.24.25
reference: Luke 24:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: vi
  text: 'Người nói với họ: “Ôi, các anh thật thiếu hiểu biết[a], lòng lại chậm tin[b] tất cả những điều các nhà tiên tri đã nói!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khờ dại” hoặc “không hiểu.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “chậm trong lòng”; “lòng” chỉ con người nội tâm, bao gồm sự hiểu biết, tin cậy và đón nhận điều đã được nói.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: Người nói với họ
  rationale: Diễn đạt tự nhiên lời dẫn truyện; καί nối tiếp mạch văn và không nhất thiết phải được chuyển thành một từ riêng trong tiếng Việt, còn αὐτός được thể hiện bằng đại từ “Người” mà không thêm sắc thái nhấn mạnh.
- source_word: Ὦ
  choice: Ôi
  rationale: Giữ lực cảm thán và giọng quở trách trực tiếp của hô từ Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀνόητοι
  choice: các anh thật thiếu hiểu biết
  rationale: Nhấn vào sự thiếu nhận thức, không thu hẹp thành sự đồi bại về đạo đức. “Các anh” thể hiện lời gọi trực tiếp ở số nhiều trong ngữ cảnh hai môn đồ.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: lòng lại chậm tin
  rationale: Giữ hình ảnh “lòng” như con người nội tâm thay vì chỉ diễn giải thành trí óc chậm hiểu; trật tự được điều chỉnh để câu tiếng Việt tự nhiên.
- source_word: τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς
  choice: tin tất cả những điều
  rationale: Diễn đạt tự nhiên quan hệ giữa “chậm” và động từ nguyên mẫu “tin,” đồng thời giữ phạm vi toàn diện của πᾶσιν.
- source_word: ἐλάλησαν οἱ προφῆται
  choice: các nhà tiên tri đã nói
  rationale: Chuyển tải trực tiếp lời chứng đã được các nhà tiên tri công bố mà không thêm ý rằng chính Đức Chúa Trời trực tiếp phán trong cấu trúc ngữ pháp này.
theological_decisions:
- issue: Bản chất lời quở trách của Chúa Giê-xu
  choice: Lời quở trách bao gồm cả sự thiếu hiểu biết lẫn sự chậm tin nơi con người nội tâm đối với toàn bộ lời chứng của các nhà tiên tri.
  alternative: Chỉ là lời kết án về đạo đức, hoặc chỉ nói đến một sai lầm trí tuệ.
  rationale: ἀνόητοι đi cùng βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν, nên câu văn kết hợp nhận thức và lòng tin. Bản dịch giữ cả “thiếu hiểu biết,” “lòng” và “tin,” không giản lược sức căng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ôi” giữ sắc thái cảm thán của lời quở trách; “các anh” phù hợp với lời nói trực tiếp dành cho hai môn đồ. Cụm “lòng lại chậm tin” bảo tồn thành ngữ Hy Lạp nhưng vẫn có nhịp điệu tự nhiên trong tiếng Việt.
