translation:
  language: vi
  text: Họ tìm thấy tảng đá đã được lăn đi khỏi mộ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: Họ thấy
  rationale: Động từ aorist chủ động, ngôi thứ ba số nhiều; chủ ngữ được hiểu từ câu trước là những người phụ nữ. “Thấy” tự nhiên trong tiếng Việt và diễn tả việc họ nhận ra tình trạng của tảng đá.
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: δέ là liên từ nhẹ để tiếp nối trình thuật. Trong tiếng Việt, sự tiếp nối đã rõ từ mạch văn; thêm “và” ở đầu câu không cần thiết và kém tự nhiên.
- source_word: τὸν λίθον
  choice: tảng đá
  rationale: Trong bối cảnh mai táng, λίθος chỉ tảng đá dùng để đóng cửa mộ. “Tảng đá” chính xác và tự nhiên hơn “hòn đá”.
- source_word: ἀποκεκυλισμένον
  choice: đã được lăn
  rationale: 'Phân từ hoàn thành thể bị động nhấn mạnh trạng thái kết quả: tảng đá ở trong tình trạng đã bị lăn đi. “Đã được lăn” giữ được cả ý bị động lẫn kết quả hiện tại.'
- source_word: ἀπὸ τοῦ μνημείου
  choice: khỏi mộ
  rationale: μνημεῖον trong bối cảnh này là ngôi mộ; ἀπό diễn tả sự tách khỏi vị trí ấy. “Khỏi mộ” gọn và tự nhiên, đồng thời tránh lặp ý với động từ.
theological_decisions:
- issue: Chủ ngữ được hàm ẩn trong câu Hy Lạp
  choice: Họ thấy tảng đá đã được lăn khỏi mộ
  alternative: Thấy tảng đá đã được lăn khỏi mộ
  rationale: Tiếng Việt có thể lược chủ ngữ, nhưng nêu “Họ” làm câu độc lập rõ ràng và tiếp nối đúng chủ thể số nhiều từ câu trước mà không thêm nội dung thần học.
- issue: Tác nhân lăn tảng đá không được nêu
  choice: giữ thể bị động “đã được lăn”
  alternative: tảng đá đã lăn ra khỏi mộ
  rationale: Bản Hy Lạp dùng thể bị động và không xác định tác nhân. Bản dịch không nên ngầm quy hành động cho thiên sứ, con người hay chính tảng đá.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ dấu phẩy cuối câu theo đơn vị văn bản được cung cấp, vì câu Hy Lạp tiếp tục sang câu kế.
