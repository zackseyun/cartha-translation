review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng chủ ngữ số nhiều hàm ẩn, danh từ ‘tảng đá’, và thể bị động của phân từ hoàn thành ἀποκεκυλισμένον. Tuy nhiên, ‘thấy’ nghiêng về hành vi nhìn hơn εὗρον (‘tìm thấy/phát hiện’), còn ‘được lăn khỏi mộ’ chưa tự nhiên và chưa diễn đạt rõ chuyển động rời xa ngôi mộ.
  naturalness: ‘Họ thấy tảng đá đã được lăn khỏi mộ’ có thể hiểu được, nhưng kết hợp ‘lăn khỏi mộ’ hơi gượng trong tiếng Việt hiện đại. ‘đã được lăn đi khỏi mộ’ diễn tả tự nhiên hơn trạng thái kết quả của hòn đá đã bị dời ra xa.
  terminology: ‘Tảng đá’ và ‘mộ’ phù hợp với ngữ cảnh mai táng. Giữ bị động để không nêu hay suy đoán tác nhân đã lăn đá.
  issues:
  - severity: low
    issue: ‘Thấy’ chưa phản ánh đầy đủ sắc thái εὗρον.
    rationale: εὗρον là ‘họ tìm thấy/phát hiện’; ‘tìm thấy’ phản ánh hành vi phát hiện rõ hơn mà không thay đổi chủ thể hay nội dung.
  - severity: medium
    issue: Cụm ‘đã được lăn khỏi mộ’ chưa tự nhiên và mơ hồ về hướng chuyển động.
    rationale: Phân từ ἀποκεκυλισμένον mô tả hòn đá đã ở tình trạng được lăn rời khỏi mộ. Thêm ‘đi’ giúp diễn đạt ý rời xa trong tiếng Việt, vẫn giữ bị động và không thêm tác nhân.
  revised_text: Họ tìm thấy tảng đá đã được lăn đi khỏi mộ,
