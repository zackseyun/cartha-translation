source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: vi
  text: Sau khi thờ lạy Ngài,[a][b] họ trở về Giê-ru-sa-lem với niềm vui lớn lao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có cụm từ “sau khi thờ lạy Ngài”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “sau khi cúi mình trước Ngài” hoặc “sau khi bày tỏ lòng tôn kính đối với Ngài”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: họ
  rationale: Đại từ αὐτοὶ được diễn đạt tự nhiên bằng “họ”; liên từ καὶ không cần chuyển thành một từ riêng vì quan hệ tiếp nối đã rõ trong câu tiếng Việt.
- source_word: προσκυνήσαντες αὐτόν
  choice: sau khi thờ lạy Ngài
  rationale: Phân từ aorist chỉ hành động xảy ra trước động từ chính. “Thờ lạy” phù hợp với bối cảnh Chúa Giê-su phục sinh và thăng thiên, đồng thời chú thích bảo lưu nghĩa có thể là cúi mình bày tỏ lòng tôn kính.
- source_word: ὑπέστρεψαν
  choice: trở về
  rationale: Diễn đạt chính xác và tự nhiên ý quay lại nơi trước đó.
- source_word: εἰς Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Trong tiếng Việt, hướng đến thành phố được biểu đạt tự nhiên trong cụm động từ “trở về Giê-ru-sa-lem”, không cần thêm giới từ.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: lòng tràn đầy vui mừng
  rationale: Cách diễn đạt tự nhiên, trang trọng, truyền đạt rõ trạng thái vui mừng lớn lao mà cụm Hy Lạp mô tả.
theological_decisions:
- issue: Cách dịch προσκυνέω đối với Chúa Giê-su phục sinh
  choice: thờ lạy Ngài
  alternative: cúi mình trước Ngài / bày tỏ lòng tôn kính đối với Ngài
  rationale: Trong bối cảnh sau phục sinh và thăng thiên, “thờ lạy” phản ánh hợp lý sắc thái mạnh của động từ mà không thêm một khẳng định giáo phái; chú thích vẫn bảo lưu phạm vi nghĩa rộng hơn của từ.
- issue: Cụm từ có vấn đề văn bản προσκυνήσαντες αὐτόν
  choice: giữ trong chính văn và ghi chú dị bản
  alternative: lược bỏ cụm “sau khi thờ lạy Ngài”
  rationale: SBLGNT cung cấp cụm từ nhưng đánh dấu là không chắc chắn; vì vậy giữ lại trong bản dịch và công khai dị bản trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su trong ngữ cảnh trực tiếp này; cấu trúc câu được điều chỉnh cho tự nhiên trong tiếng Việt.
