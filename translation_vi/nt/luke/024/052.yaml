  rationale: Giữ cụm từ có dị bản trong chính văn theo SBLGNT và bảo lưu bất định văn bản bằng chú thích [a]. Chuyển chú thích [b] về đúng cụm προσκυνήσαντες αὐτόν. Thay “lòng tràn đầy vui mừng” bằng “với niềm vui lớn lao” để phản ánh rõ μετὰ χαρᾶς μεγάλης mà không thêm sắc thái ngoài nguyên ngữ.
