  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: vi
  text: Đó là Ma-ri Ma-đơ-len, Giô-an-na, Ma-ri của Gia-cơ[a], và những phụ nữ khác cùng đi với họ. Họ đang thuật lại những điều này cho các sứ đồ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “Ma-ri của Gia-cơ.” Có lẽ bà là mẹ của Gia-cơ, nhưng cũng có thể là vợ của Gia-cơ.'
    reason: Giữ sự mơ hồ về quan hệ gia đình trong nguyên văn.
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Những người ấy là
  rationale: Dựa vào ngữ cảnh trước đó, diễn đạt tự nhiên sự nhận diện nhóm phụ nữ; δέ chỉ là liên từ chuyển ý nhẹ nên không cần dịch thành một trạng từ thời gian riêng.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Ma-ri Ma-đơ-len
  rationale: Cách phiên âm và gọi tên quen thuộc, rõ ràng trong tiếng Việt.
- source_word: Ἰωάννα
  choice: Gian-na
  rationale: Phiên âm tên riêng sang tiếng Việt theo lối dùng Kinh Thánh quen thuộc.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Ma-ri của Gia-cơ
  rationale: Giữ nguyên sự cô đọng và mơ hồ thật sự của sở hữu cách Hy Lạp thay vì quyết định trong chính văn rằng bà là mẹ hay vợ của Gia-cơ.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: cùng những phụ nữ khác đi với họ
  rationale: Giống cái số nhiều và ngữ cảnh cho phép bổ sung danh từ 'phụ nữ'; 'đi với họ' diễn đạt tự nhiên σὺν αὐταῖς.
- source_word: ἔλεγον
  choice: thuật lại
  rationale: Thì chưa hoàn thành chỉ hành động đang diễn ra hoặc lặp lại; trong tiếng Việt, ngữ cảnh và động từ 'thuật lại' truyền đạt việc họ kể các sự việc vừa chứng kiến mà không cần thêm dấu hiệu thể bắt buộc.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: cho các sứ đồ
  rationale: '''Sứ đồ'' là thuật ngữ tiếng Việt quen thuộc và phù hợp với nhóm người được Chúa Giê-su sai phái.'
- source_word: ταῦτα
  choice: những điều này
  rationale: Giữ số nhiều và quy chiếu về các sự việc cùng sứ điệp vừa được kể.
theological_decisions:
- issue: Mối quan hệ trong Μαρία ἡ Ἰακώβου
  choice: Ma-ri của Gia-cơ
  alternative: Ma-ri, mẹ của Gia-cơ; hoặc Ma-ri, vợ của Gia-cơ
  rationale: Cấu trúc Hy Lạp không nói rõ quan hệ. Tiếng Việt có thể giữ cách nói 'của Gia-cơ' trong chính văn và giải thích ở chú thích, nhờ đó không biến cách hiểu có khả năng cao thành điều chắc chắn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chính văn ưu tiên giữ sự mơ hồ của nguyên ngữ; câu thứ hai tách riêng để phản ánh cấu trúc hai mệnh đề của tiếng Hy Lạp.
