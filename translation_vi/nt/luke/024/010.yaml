review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng danh sách các phụ nữ, tính mơ hồ của Μαρία ἡ Ἰακώβου trong chính văn và chú thích, số nhiều của ταῦτα, và đối tượng là các sứ đồ. Tuy nhiên, tên Ἰωάννα nên được phiên âm là «Giô-an-na» để tương ứng chính xác hơn với tên Hy Lạp và lối phiên âm Việt ngữ thông dụng. Thêm «đang» là một cách tự nhiên, an toàn để biểu thị sắc thái chưa hoàn thành của ἔλεγον.
  naturalness: Cấu trúc hai câu rõ ràng và phù hợp văn phong Việt hiện đại. «Đó là» tự nhiên hơn «Những người ấy là» trong câu giới thiệu một danh sách. «Những phụ nữ khác cùng đi với họ» diễn đạt mạch lạc nhóm phụ nữ còn lại ở cùng nhóm đã nêu.
  terminology: «Ma-ri Ma-đơ-len», «Gia-cơ» và «các sứ đồ» là các thuật ngữ/tên gọi phù hợp. Đổi «Gian-na» thành «Giô-an-na». Chú thích về «Ma-ri của Gia-cơ» cần được giữ vì nguyên ngữ không minh định quan hệ gia đình.
  issues:
  - severity: medium
    issue: Tên Ἰωάννα được dịch là «Gian-na».
    rationale: «Giô-an-na» phản ánh trực tiếp và rõ hơn tên Joanna/Ἰωάννα trong tiếng Việt hiện đại; «Gian-na» không phải dạng phiên âm thông dụng nhất trong hệ tên gọi đang dùng với Ma-ri và Gia-cơ.
  - severity: low
    issue: Sắc thái chưa hoàn thành của ἔλεγον chưa được biểu thị rõ.
    rationale: Động từ trần «thuật lại» vẫn có thể chấp nhận trong tiếng Việt, nhưng «đang thuật lại» truyền đạt tốt hơn hành động đang/tiếp diễn được nguyên ngữ dùng để mô tả.
  revised_text: Đó là Ma-ri Ma-đơ-len, Giô-an-na, Ma-ri của Gia-cơ[a], và những phụ nữ khác cùng đi với họ. Họ đang thuật lại những điều này cho các sứ đồ.
