revisions:
- from: Những người ấy là Ma-ri Ma-đơ-len, Gian-na, Ma-ri của Gia-cơ[a], cùng những phụ nữ khác đi với họ. Họ thuật lại những điều này cho các sứ đồ.
  to: Đó là Ma-ri Ma-đơ-len, Giô-an-na, Ma-ri của Gia-cơ[a], và những phụ nữ khác cùng đi với họ. Họ đang thuật lại những điều này cho các sứ đồ.
  rationale: Chỉ điều chỉnh an toàn tên riêng «Giô-an-na», làm mượt câu giới thiệu danh sách, và biểu thị rõ hơn thể chưa hoàn thành của động từ «thuật lại». Cách dịch «Ma-ri của Gia-cơ» cùng chú thích được giữ nguyên để không quyết định thay cho nguyên ngữ một quan hệ gia đình còn mơ hồ.
  reviewer_model: gpt-5.6-terra
