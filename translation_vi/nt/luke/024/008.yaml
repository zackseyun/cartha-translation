  text: Và họ nhớ lại những lời của Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những lời phán của Ngài” hoặc “những điều Ngài đã nói.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: liền
  rationale: Trong mạch kể chuyện, καὶ nối kết phản ứng này với điều vừa xảy ra; “liền” diễn đạt tự nhiên sự tiếp nối trực tiếp trong tiếng Việt mà không làm thay đổi nội dung.
- source_word: ἐμνήσθησαν
  choice: nhớ lại
  rationale: Động từ aorist dạng trung gian/thụ động nhưng mang nghĩa chủ động ở đây; “nhớ lại” diễn đạt tự nhiên việc những lời đã nói trước đó trở lại trong trí nhớ.
- source_word: τῶν ῥημάτων
  choice: những lời
  rationale: ῥῆμα ở đây chỉ các lời đã được nói. “Những lời” vừa sát nghĩa vừa tự nhiên; “những điều Ngài đã nói” là cách diễn đạt rõ hơn nhưng dài hơn.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ sở hữu quy chiếu về Chúa Giê-xu trong văn cảnh. “Ngài” giữ văn phong trang trọng, quen thuộc trong bản văn Kinh Thánh tiếng Việt, mà không thay tên riêng vào câu.
