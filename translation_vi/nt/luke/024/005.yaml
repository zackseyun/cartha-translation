id: LUK.24.5
reference: Luke 24:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: vi
  text: 'Khi các bà kinh hãi và cúi mặt xuống đất, họ nói với các bà: “Sao các bà lại tìm Đấng sống giữa những người chết?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Các bà tìm Đấng sống với những người chết làm gì?” Trong ngữ cảnh, câu này có nghĩa: “Sao các bà lại tìm Đấng sống giữa những người chết?”'
    reason: Nêu nghĩa sát chữ của Τί và μετά, đồng thời giải thích cách diễn đạt theo ngữ cảnh trong chính văn.
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: khi các bà kinh hãi
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh đi trước động từ chính; “kinh hãi” truyền đạt mức độ mạnh của ἔμφοβος, còn ngữ cảnh cho thấy chủ thể là các phụ nữ.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: cúi mặt xuống đất
  rationale: Giữ hình ảnh thân thể cụ thể của κλίνω và πρόσωπα, đồng thời là cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: εἶπαν πρὸς αὐτάς
  choice: họ nói với các bà
  rationale: “Họ” giữ đại từ chỉ những người nói như nguyên văn; “các bà” thể hiện rõ đại từ giống cái số nhiều αὐτάς và tránh sự mơ hồ không tự nhiên của hai đại từ “họ” liên tiếp.
- source_word: Τί ζητεῖτε
  choice: Sao các bà lại tìm
  rationale: Τί có nghĩa đen là “gì”, nhưng trong câu hỏi này mang lực chất vấn lý do hoặc sự thích đáng của việc tìm kiếm; “sao ... lại” diễn đạt tự nhiên sắc thái ấy.
- source_word: τὸν ζῶντα
  choice: Đấng sống
  rationale: Phân từ có mạo từ được dùng như danh từ, ở số ít và chỉ một nhân vật; “Đấng sống” giữ tính cá vị và sự tương phản với những người chết mà không thêm lời giải thích về sự phục sinh.
- source_word: μετὰ τῶν νεκρῶν
  choice: giữa những người chết
  rationale: μετά với sở hữu cách có thể là “với” hoặc “giữa”; trong ngữ cảnh ngôi mộ, “giữa những người chết” là cách diễn đạt tiếng Việt tự nhiên và bảo toàn sự đối lập.
theological_decisions:
- issue: Hàm ý phục sinh trong τὸν ζῶντα
  choice: Đấng sống
  alternative: người đang sống
  rationale: Cách dịch xác định một nhân vật đang sống đối lập với những người chết, phù hợp hàm ý phục sinh nhưng không chèn tên Chúa Giê-su hay giải thích thần học không có trong câu.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Các bà” phù hợp cách xưng gọi lịch sự đối với nhóm phụ nữ; cấu trúc “sao ... lại” truyền đạt sắc thái chất vấn mà không thô. Dấu chú thích [a] được đặt ngay sau mệnh đề mà chú thích giải thích.
