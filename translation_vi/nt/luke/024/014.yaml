  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: vi
  text: Họ đang trò chuyện với nhau về mọi việc đã xảy ra ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “mọi biến cố ấy đã xảy ra.”'
    reason: 'Phương án từ vựng: τῶν συμβεβηκότων τούτων có thể được diễn đạt là “những việc” hoặc “những biến cố ... đã xảy ra”.'
lexical_decisions:
- source_word: καὶ
  choice: Không dịch riêng
  rationale: Liên từ nối tiếp mạch kể; trong tiếng Việt, mở câu bằng “Và” ở đây không cần thiết và kém tự nhiên, trong khi quan hệ nối tiếp vẫn rõ từ văn cảnh.
- source_word: αὐτοὶ
  choice: Họ
  rationale: Đại từ làm chủ ngữ được diễn đạt tự nhiên là “Họ”; sắc thái nhấn mạnh của đại từ Hy Lạp không đủ mạnh để thêm “chính họ”.
- source_word: ὡμίλουν
  choice: đang trò chuyện
  rationale: Thì chưa hoàn thành biểu thị hoạt động đang diễn ra trong quá khứ; “đang trò chuyện” vừa giữ được thể tiếp diễn vừa phù hợp với cuộc đối thoại thân mật.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Diễn tả hành động tương hỗ; “với nhau” là cách nói tự nhiên trong tiếng Việt.
- source_word: περὶ πάντων
  choice: về tất cả
  rationale: περί nêu chủ đề cuộc trò chuyện, còn πάντων bao quát toàn bộ những sự việc được nhắc đến.
- source_word: τῶν συμβεβηκότων τούτων
  choice: những việc vừa xảy ra
  rationale: Phân từ hoàn thành chỉ những sự việc đã xảy ra và vẫn có liên hệ trực tiếp với tình huống hiện tại của câu chuyện; “vừa xảy ra” truyền đạt tính gần gũi ấy một cách tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Trò chuyện” tự nhiên hơn “đàm luận”; “những việc” giữ cách diễn đạt rộng của nguyên văn, còn chú thích ghi nhận phương án “những biến cố”.
