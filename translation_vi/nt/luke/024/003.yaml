review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng trình tự và nét tương phản nhẹ của δέ, cũng như chủ ngữ số nhiều giống cái được hiểu từ ngữ cảnh. Tuy nhiên, εὗρον là “tìm thấy/nhận ra là có,” không đơn thuần là “thấy”; và σῶμα trong bản văn ngắn của SBLGNT nên được dịch là “thân thể” để sát nghĩa mà không thêm sắc thái pháp-y của “thi thể.”
  naturalness: “Nhưng khi bước vào, họ không tìm thấy thân thể” là tiếng Việt hiện đại, tự nhiên trong văn kể chuyện và vẫn cho phép lược đối tượng “ngôi mộ” vốn đã rõ từ ngữ cảnh trước đó.
  terminology: Dùng “thân thể” cho σῶμα bảo toàn thuật ngữ trung tính của tiếng Hy Lạp và liên kết tự nhiên với câu chuyện phục sinh. Không thêm “của Chúa Giê-su” vào chính văn; biến thể dài hơn được giữ ở chú thích.
  issues:
  - severity: low
    issue: “không thấy” dịch οὐχ εὗρον chưa sát động từ.
    rationale: εὑρίσκω có nghĩa cơ bản là “tìm thấy”; “không tìm thấy” bảo toàn hành động và kết quả của bản văn.
  - severity: low
    issue: “thi thể” thêm sắc thái hẹp hơn cho τὸ σῶμα.
    rationale: σῶμα là “thân thể/body.” Dù bối cảnh là mộ, “thi thể” có thể gợi sắc thái xác chết mà bản văn Hy Lạp không lựa chọn và làm yếu sự trung tính có ý nghĩa trong trình thuật phục sinh.
  revised_text: Nhưng khi bước vào, họ không tìm thấy thân thể.[a]
