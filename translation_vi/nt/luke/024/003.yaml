  text: But when they entered[a], they did not find the body.
translation:
  language: vi
  text: Nhưng khi bước vào, họ không tìm thấy thân thể.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “thân thể của Chúa Giê-su.”'
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: khi bước vào
  rationale: Phân từ bất định chủ động, giống cái số nhiều, chỉ những người phụ nữ; dịch bằng mệnh đề thời gian để tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu diễn tiến câu chuyện kèm nét tương phản nhẹ giữa việc họ vào mộ và điều bất ngờ họ gặp.
- source_word: οὐχ εὗρον
  choice: họ không thấy
  rationale: Diễn đạt tự nhiên hành động tìm mà không gặp; trong ngữ cảnh này, “không thấy” gọn và rõ hơn “không tìm thấy” mà không đổi ý nghĩa.
- source_word: τὸ σῶμα
  choice: thi thể
  rationale: Trong bối cảnh ngôi mộ, σῶμα chỉ thân thể của người đã chết; “thi thể” rõ nghĩa và trang trọng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Có nên nói rõ thi thể của ai
  choice: thi thể
  alternative: thi thể của Chúa Giê-su
  rationale: Bản văn SBLGNT được cung cấp chỉ có τὸ σῶμα (“thi thể”). Không đưa cách đọc dài hơn vào chính văn, nhưng ghi nhận trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “họ” tiếp nối những người phụ nữ ở câu trước; không bổ sung danh từ vào câu này.
