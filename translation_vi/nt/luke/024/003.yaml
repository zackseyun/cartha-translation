- from: Nhưng khi bước vào, họ không thấy thi thể.[a]
  to: Nhưng khi bước vào, họ không tìm thấy thân thể.[a]
  rationale: Điều chỉnh “không thấy” thành “không tìm thấy” để phản ánh εὗρον, và “thi thể” thành “thân thể” để phản ánh τὸ σῶμα một cách trung tính, sát nghĩa. Chú thích biến thể được điều chỉnh tương ứng; chính văn vẫn theo cách đọc ngắn của SBLGNT.
