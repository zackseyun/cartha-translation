id: LUK.24.21
reference: Luke 24:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: vi
  text: Nhưng chúng tôi đã hy vọng rằng chính ông ấy là Đấng sẽ cứu chuộc Israel.[a][b] Nhưng ngoài tất cả những điều ấy, đến nay đã là ngày thứ ba kể từ khi những việc ấy xảy ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc có thể dịch: “chính ông ấy là Đấng được định sẽ cứu chuộc Israel.” Tiếng Hy Lạp giữ động từ hiện tại “là” trong nội dung của niềm hy vọng được kể lại ở quá khứ.'
    reason: alternative_reading
  - marker: b
    text: “Cứu chuộc Israel” có thể chỉ rộng đến sự giải cứu mà người ta mong đợi nơi Đấng Mêsia; câu này không nói rõ họ nghĩ đến sự giải phóng chính trị, sự cứu rỗi thuộc linh, hay cả hai.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Nhưng chúng tôi
  rationale: δέ tạo thế tương phản với lời kể trước đó, còn đại từ ἡμεῖς được nêu rõ để nhấn mạnh chủ thể; cách dịch này tự nhiên trong tiếng Việt.
- source_word: ἠλπίζομεν
  choice: vẫn hy vọng
  rationale: Thì chưa hoàn thành diễn tả niềm mong đợi kéo dài trong quá khứ và nay đã bị lung lay; “vẫn hy vọng” gợi được sắc thái liên tục ấy trong ngữ cảnh hồi tưởng.
- source_word: ὅτι αὐτός ἐστιν
  choice: rằng chính ông ấy là
  rationale: 'Giữ động từ hiện tại ἐστιν trong nội dung của niềm hy vọng ở quá khứ, đồng thời αὐτός mang sắc thái nhấn mạnh: “chính ông ấy”.'
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: Đấng sắp cứu chuộc
  rationale: μέλλων với động từ nguyên mẫu chỉ hành động được trông đợi hoặc sắp xảy ra. “Đấng” phù hợp với vai trò cứu chuộc được nói đến mà không bổ sung một danh hiệu không có trong câu.
- source_word: λυτροῦσθαι
  choice: cứu chuộc
  rationale: Từ này chỉ sự giải thoát hay chuộc lại và có âm hưởng giao ước, cứu độ; “cứu chuộc” bảo toàn độ rộng thần học tốt hơn việc thu hẹp thành giải phóng chính trị.
- source_word: τὸν Ἰσραήλ
  choice: Israel
  rationale: Chỉ trực tiếp dân giao ước xét như một toàn thể; giữ tên riêng theo dạng thông dụng hiện đại.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Hơn nữa, ngoài tất cả những điều đó
  rationale: Cụm từ thêm một yếu tố đáng lưu ý vào toàn bộ sự việc vừa kể; cách dịch này truyền đạt lực tích lũy và vẫn tự nhiên.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: hôm nay đã là ngày thứ ba
  rationale: ἄγει được dùng theo lối nói về thời gian đã tiến đến một mốc; câu tiếng Việt này rõ ràng và tự nhiên.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: kể từ khi những việc ấy xảy ra
  rationale: Diễn đạt đúng mốc khởi đầu dùng để tính thời gian.
theological_decisions:
- issue: Phạm vi ý nghĩa của “cứu chuộc Israel”
  choice: Giữ nguyên cách nói rộng “cứu chuộc Israel”.
  alternative: Diễn giải thành “giải phóng Israel khỏi ách thống trị” hoặc “cứu Israel về phần thuộc linh”.
  rationale: Bản văn không xác định sự cứu chuộc chỉ mang tính chính trị hay chỉ mang tính thuộc linh; cách dịch giữ nguyên tính rộng và sức căng của niềm hy vọng về Đấng Mêsia.
- issue: Thời tính của ἐστιν sau ἠλπίζομεν
  choice: Dịch “chính ông ấy là Đấng sắp cứu chuộc”.
  alternative: Dịch lùi thì thành “chính ông ấy đã là Đấng sẽ cứu chuộc”.
  rationale: Tiếng Hy Lạp giữ động từ hiện tại trong nội dung của niềm hy vọng quá khứ. Bản dịch bảo toàn nét này thay vì âm thầm biến toàn bộ mệnh đề thành quá khứ.
- issue: Cách gọi người mà hai môn đồ chưa nhận ra
  choice: Dùng “ông ấy” trong mệnh đề rồi “Đấng” cho vai trò được mong đợi.
  alternative: Dùng ngay “Ngài” hoặc gọi rõ “Đấng Mêsia”.
  rationale: Người nói đang nhắc đến Đức Giê-su trước một người mà họ tưởng là khách lạ; “ông ấy” tự nhiên trong tình huống, còn “Đấng” thể hiện cấu trúc danh hóa ὁ μέλλων mà không chèn thêm danh hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc hiện tại bất thường nhưng có chủ ý của tiếng Hy Lạp; không thu hẹp nội dung của niềm hy vọng cứu chuộc. Dấu chú thích [a], [b] đều xuất hiện trong chính văn.
