  to: Nhưng chúng tôi đã hy vọng rằng chính ông ấy là Đấng sẽ cứu chuộc Israel.[a][b] Nhưng ngoài tất cả những điều ấy, đến nay đã là ngày thứ ba kể từ khi những việc ấy xảy ra.
  rationale: Bản sửa phân biệt rõ niềm hy vọng quá khứ với nội dung mệnh đề vẫn giữ động từ hiện tại theo tiếng Hy Lạp; tránh sắc thái quá cận kề của “sắp”; và chuyển chú thích giải thích “cứu chuộc Israel” về đúng cụm từ được chú giải. “Nhưng ngoài tất cả những điều ấy” giữ lực đối lập/tích lũy của ἀλλά γε καὶ σὺν πᾶσιν τούτοις mà không thêm diễn giải.
