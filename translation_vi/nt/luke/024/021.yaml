  source_fidelity: Cần sửa nhẹ. “vẫn hy vọng” dễ hiểu là niềm hy vọng vẫn còn tiếp diễn ở thời điểm nói, trong khi ἠλπίζομεν là hồi tưởng về một kỳ vọng trong quá khứ. “Sắp cứu chuộc” cũng có thể gợi sự cận kề quá mức cho μέλλων, vốn ở đây nêu Đấng được kỳ vọng/được định sẽ cứu chuộc. Bản văn giữ ἐστιν ở hiện tại trong mệnh đề nội dung; tiếng Việt có thể giữ nét này bằng “là Đấng sẽ...”.
