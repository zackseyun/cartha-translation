id: LUK.24.51
reference: Luke 24:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: vi
  text: Trong khi Ngài đang ban phước cho họ, Ngài rời khỏi họ và được đưa lên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có mệnh đề “và được đưa lên trời.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: không dịch thành một mệnh đề riêng
  rationale: Đây là công thức tự sự quen thuộc của Lu-ca. Trong tiếng Việt hiện đại, ý chuyển sang sự việc xảy ra được thể hiện tự nhiên bằng mệnh đề thời gian “Khi...”; dịch sát là “Và đã xảy ra rằng” sẽ nặng nề và kém tự nhiên.
- source_word: ἐν τῷ εὐλογεῖν
  choice: Khi đang ban phước
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hành động đồng thời và đang tiếp diễn vào lúc Ngài rời đi.
- source_word: εὐλογεῖν
  choice: ban phước
  rationale: Cách nói trang trọng, tự nhiên trong ngữ cảnh một người ban lời chúc phước cho những người khác.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: Ngài rời khỏi họ
  rationale: Diễn đạt rõ sự tách ra và ra đi, không thêm cách thức hoặc khoảng cách mà nguyên văn không nêu.
- source_word: ἀνεφέρετο
  choice: được đưa lên
  rationale: Giữ thể bị động và hướng đi lên của động từ, đồng thời không xác định tác nhân vốn không được nói rõ trong câu.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: Trong ngữ cảnh này, οὐρανός chỉ trời theo nghĩa nơi Đức Chúa Trời ngự, chứ không chỉ bầu trời hữu hình; “lên trời” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Mệnh đề có dấu ngoặc καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: Đưa vào chính văn và ghi chú dị bản
  alternative: Lược bỏ mệnh đề “và được đưa lên trời”
  rationale: SBLGNT đặt mệnh đề này trong dấu ngoặc để báo hiệu sự bất định về văn bản. Bản dịch giữ mệnh đề vì nó có trong nguồn được cung cấp, nhưng ghi rõ dị bản thay vì âm thầm quyết định vấn đề.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su để giữ sắc thái tôn kính; tránh công thức “Và đã xảy ra rằng” vì không tự nhiên trong tiếng Việt. Dấu chú thích [a] được đặt ngay sau mệnh đề có dị bản.
