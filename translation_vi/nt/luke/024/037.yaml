review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng chuỗi phản ứng trong nguyên ngữ: họ bị giật mình (πτοηθέντες), đi vào trạng thái sợ hãi (ἔμφοβοι γενόμενοι), rồi tưởng rằng mình đang nhìn thấy (ἐδόκουν ... θεωρεῖν) một πνεῦμα. Tuy nhiên, “một linh” không phải là một danh ngữ tự nhiên hay rõ nghĩa trong tiếng Việt hiện đại. “Một linh hồn” diễn đạt tự nhiên hơn ý một hữu thể vô thân xác trong ngữ cảnh này, mà không khẳng định đó là bản chất thật của Chúa Giê-su.'
  naturalness: '“Nhưng họ giật mình và trở nên sợ hãi” dễ hiểu, dù “trở nên” hơi sát cấu trúc Hy Lạp. Vấn đề chính là “một linh”: cách nói này không thông dụng trong tiếng Việt chuẩn và có thể gây khó hiểu. “Một linh hồn” tự nhiên, trang trọng vừa phải, và phù hợp với văn cảnh một sự hiện ra.'
  terminology: Không nên dùng “một linh” làm thuật ngữ độc lập. “Một linh hồn” là cách gọi Việt ngữ quen thuộc cho điều các môn đồ ngộ nhận đang thấy; chú thích giữ phương án “một bóng ma” và giải thích πνεῦμα để không áp đặt sắc thái dân gian của “ma.”
  issues:
  - severity: medium
    issue: Cụm “một linh” không tự nhiên và không rõ nghĩa trong tiếng Việt hiện đại.
    rationale: Dù nhằm bám sát πνεῦμα, “linh” không thường được dùng như một danh từ đếm được chỉ một hữu thể trong tiếng Việt. Điều này làm giảm tính dễ hiểu của bản văn. “Một linh hồn” là cách diễn đạt tự nhiên hơn trong bối cảnh một nhân vật bị tưởng là hữu thể không có thân xác.
