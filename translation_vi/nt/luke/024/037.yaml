  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: vi
  text: Nhưng họ giật mình và trở nên sợ hãi, tưởng mình đang thấy một linh hồn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một bóng ma.” Từ Hy Lạp là πνεῦμα, nghĩa cơ bản là “linh” hoặc “thần”; trong ngữ cảnh này chỉ một hữu thể không có thân xác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: giật mình
  rationale: Diễn tả phản ứng bất ngờ, hoảng hốt tức thời mà không lấn át ý sợ hãi được nói rõ ngay sau đó.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu bước chuyển tương phản nhẹ giữa việc Đức Chúa Giê-su hiện ra và phản ứng của các môn đồ.
- source_word: ἔμφοβοι γενόμενοι
  choice: trở nên sợ hãi
  rationale: Giữ ý nghĩa họ bước vào trạng thái sợ hãi của tính từ đi với γενόμενοι.
- source_word: ἐδόκουν
  choice: tưởng
  rationale: Diễn đạt tự nhiên nhận định chủ quan và sai lầm của họ trong ngữ cảnh.
- source_word: πνεῦμα
  choice: một linh
  rationale: Giữ tương đương trực tiếp với πνεῦμα và không tự động đưa vào các liên tưởng dân gian của từ 'ma'.
- source_word: θεωρεῖν
  choice: đang thấy
  rationale: Phản ánh thể hiện tại của động từ nguyên mẫu, chỉ điều họ nghĩ mình đang nhìn thấy.
theological_decisions:
- issue: Cách dịch πνεῦμα trong trình thuật Chúa phục sinh hiện ra
  choice: một linh
  alternative: một bóng ma
  rationale: “Một linh” gần với từ Hy Lạp hơn và giữ nguyên nhận định sai lầm của các môn đồ rằng Đấng phục sinh là một hữu thể không có thân thể, thay vì giải thích trước điểm thần học mà phần kể tiếp theo sẽ làm sáng tỏ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc được làm tự nhiên cho tiếng Việt nhưng vẫn giữ chuỗi phản ứng và sự phân biệt giữa giật mình, sợ hãi, rồi ngộ nhận.
