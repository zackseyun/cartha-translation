  to: Nhưng họ giật mình và trở nên sợ hãi, tưởng mình đang thấy một linh hồn[a].
  rationale: Chỉ thay “một linh” bằng “một linh hồn” để bản dịch là tiếng Việt tự nhiên và rõ nghĩa. Chuỗi phản ứng, tính đang diễn ra của điều họ tưởng thấy, và sự ngộ nhận của các môn đồ đều được giữ nguyên. Chú thích bảo lưu lựa chọn “một bóng ma” và nêu nghĩa cơ bản của πνεῦμα.
