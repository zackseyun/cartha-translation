revisions:
- from: Khi họ đang trò chuyện và bàn luận[a] với nhau, chính Đức Giê-su đến gần rồi cùng đi với họ.[b]
  to: Đang khi họ trò chuyện và bàn luận[a] với nhau, chính Đức Giê-su đến gần và đi cùng họ.[b]
  rationale: Thay “Khi họ đang” bằng “Đang khi họ” để câu gọn và tự nhiên, đồng thời thay “rồi cùng đi với họ” bằng “và đi cùng họ” để không làm rõ quá mức quan hệ thời gian giữa hai động tác. Các chú thích vẫn được giữ đúng vị trí và nội dung.
