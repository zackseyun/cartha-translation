source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: vi
  text: Đang khi họ trò chuyện và bàn luận[a] với nhau, chính Đức Giê-su đến gần và đi cùng họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tranh luận”; từ Hy Lạp có thể gợi một cuộc trao đổi gay gắt hơn.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đến gần và cùng đi với họ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ
  choice: Khi
  rationale: Công thức tường thuật ἐγένετο kết hợp với cấu trúc thời gian ἐν τῷ + động từ nguyên mẫu được diễn đạt tự nhiên trong tiếng Việt bằng “Khi”, vừa đánh dấu hoàn cảnh vừa tránh lối dịch cổ cứng nhắc “đã xảy ra rằng”.
- source_word: ὁμιλεῖν
  choice: trò chuyện
  rationale: Diễn tả việc nói chuyện qua lại trong khung cảnh thông thường; “trò chuyện” tự nhiên và phân biệt được với động từ mạnh hơn theo sau.
- source_word: συζητεῖν
  choice: bàn luận
  rationale: Giữ ý trao đổi kỹ hoặc tranh luận mà không mặc nhiên biến cuộc nói chuyện thành cãi vã; chú thích bảo lưu sắc thái mạnh hơn có thể có của từ Hy Lạp.
- source_word: αὐτὸς Ἰησοῦς
  choice: chính Đức Giê-su
  rationale: “Chính” bảo toàn tính nhấn mạnh của αὐτός đặt cùng tên Ἰησοῦς. “Đức Giê-su” phù hợp văn phong Kinh Thánh tiếng Việt trang trọng, phổ thông.
- source_word: ἐγγίσας
  choice: đến gần
  rationale: Diễn đạt trực tiếp chuyển động tiến lại gần của phân từ bất định, trong quan hệ với hành động cùng đi theo sau.
- source_word: συνεπορεύετο
  choice: cùng đi với họ
  rationale: Tái hiện ý đồng hành của động từ σύν + πορεύομαι. Ngữ cảnh và “cùng” tự nhiên truyền đạt hành động đang tiếp diễn dù tiếng Việt không cần đánh dấu thể tiếp diễn thêm lần nữa.
theological_decisions:
- issue: Sự nhấn mạnh căn tính của người đến gần
  choice: chính Đức Giê-su
  alternative: Đức Giê-su
  rationale: Bản Hy Lạp nhấn mạnh αὐτὸς Ἰησοῦς; giữ “chính” làm rõ rằng người đích thân đến gần là Đức Giê-su, không thêm suy luận thần học ngoài ngữ pháp.
- issue: Quan hệ thời gian giữa việc đến gần và cùng đi
  choice: đến gần rồi cùng đi với họ
  alternative: đến gần và cùng đi với họ
  rationale: “Rồi” thể hiện tự nhiên việc đến gần dẫn sang hành động đồng hành, nhưng không khẳng định một khoảng cách thời gian đáng kể giữa hai hành động.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu được tái cấu trúc theo trật tự tự nhiên của tiếng Việt, tránh sao chép máy móc công thức tường thuật Hy Lạp. Hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
