source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: vi
  text: Rồi, bắt đầu từ Môi-se và tất cả các sách Tiên tri[b], Ngài giải nghĩa[a] cho họ, trong toàn bộ Kinh Thánh, những điều liên quan đến chính Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giải thích” hoặc “diễn giải.” Động từ Hy Lạp có thể chỉ việc trình bày ý nghĩa một cách chi tiết.
    reason: lexical_alternative
  - marker: b
    text: “Môi-se và tất cả các sách Tiên tri” chỉ các sách Kinh Thánh gắn với Môi-se và phần sách Tiên tri.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: bắt đầu từ Môi-se
  rationale: Giữ hình ảnh điểm khởi đầu của ἀπό và diễn đạt tự nhiên trong tiếng Việt; trong ngữ cảnh, “Môi-se” chỉ các sách gắn với Môi-se.
- source_word: πάντων τῶν προφητῶν
  choice: tất cả các sách Tiên tri
  rationale: Ngữ cảnh nói về các phần Kinh Thánh; thêm “các sách” giúp người đọc hiện đại hiểu đây là bộ phận văn chương Kinh Thánh chứ không chỉ là các cá nhân tiên tri.
- source_word: διερμήνευσεν
  choice: giải nghĩa
  rationale: Diễn đạt hành động giải thích, diễn giải ý nghĩa một cách chi tiết, phù hợp với việc trình bày Kinh Thánh.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Chuyển đúng bổ ngữ gián tiếp số nhiều, chỉ hai môn đồ trong ngữ cảnh.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: trong toàn bộ Kinh Thánh
  rationale: γραφή ở đây chỉ Kinh Thánh; cách dịch này giữ phạm vi rộng của πάσαις mà không khẳng định rằng từng câu riêng lẻ đều trực tiếp nói về Chúa Giê-su.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: những điều nói về chính Ngài
  rationale: Giữ tính khái quát của cấu trúc Hy Lạp, không thu hẹp thành riêng các lời tiên tri trực tiếp hay một loại hình giải kinh cụ thể.
theological_decisions:
- issue: Phạm vi lời giải nghĩa Kinh Thánh của Chúa Giê-su
  choice: Ngài giải nghĩa trong toàn bộ Kinh Thánh những điều nói về chính Ngài
  alternative: Ngài chỉ nêu các lời tiên tri trực tiếp về Đấng Mê-si; hoặc mọi đoạn Kinh Thánh đều trực tiếp nói về Ngài
  rationale: Câu Hy Lạp cho thấy một phạm vi giải nghĩa rộng, lấy Môi-se và các sách Tiên tri làm toàn cảnh, nhưng không xác định mọi liên hệ thuộc cùng một loại hay từng đoạn đều trực tiếp quy chiếu về Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo ngữ cảnh tiếng Việt Cơ Đốc phổ thông; viết hoa “Kinh Thánh” và “Tiên tri” khi chỉ các phần sách thánh. Các dấu chú thích đều xuất hiện ngay trong câu chính.
