  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: vi
  text: Rồi Ngài dẫn họ ra đến tận khu vực Bê-tha-ni[a]; Ngài giơ hai tay lên và ban phước cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến Bê-tha-ni” hoặc “đến gần Bê-tha-ni”; cách diễn đạt Hy Lạp đầy đủ hơn, sát nghĩa là “đến tận về phía Bê-tha-ni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: dẫn họ ra
  rationale: Động từ ἐξάγω diễn tả việc dẫn hoặc đưa ra ngoài; “dẫn họ ra” tự nhiên và giữ được ý hướng ra ngoài của tiền tố ἐξ-.
- source_word: δὲ
  choice: Rồi
  rationale: Ở đây δέ đánh dấu bước tiếp theo trong mạch kể chuyện, không diễn tả sự tương phản mạnh; “Rồi” phù hợp với tiếng Việt tự nhiên.
- source_word: ἕως πρὸς Βηθανίαν
  choice: đến tận vùng Bê-tha-ni
  rationale: Cụm ἕως πρός diễn tả phạm vi di chuyển về phía hoặc tới khu vực Bê-tha-ni. “Đến tận vùng” giữ được sắc thái về giới hạn và vùng lân cận mà không gượng ép.
- source_word: Βηθανίαν
  choice: Bê-tha-ni
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: giơ tay lên
  rationale: Thành ngữ tiếng Việt “giơ tay lên” diễn đạt tự nhiên cử chỉ nâng hai bàn tay để chúc phước; tiếng Việt thường dùng danh từ “tay” không đánh dấu số nhiều, nhưng ngữ cảnh vẫn cho phép hiểu cử chỉ bằng hai tay.
- source_word: εὐλόγησεν αὐτούς
  choice: ban phước cho họ
  rationale: Trong ngữ cảnh này εὐλογέω chỉ hành động chúc hoặc truyền phước lành trên các môn đồ. “Ban phước cho” là cách diễn đạt trang trọng, dễ hiểu và không thêm một công thức nghi lễ.
theological_decisions:
- issue: Bản chất hành động Chúa Giê-su chúc phước cho các môn đồ
  choice: ban phước cho họ
  alternative: đọc lời chúc phước trên họ
  rationale: Giữ cách diễn đạt đơn giản về hành động ban phước đi kèm với việc giơ tay, không nhập thêm phạm trù chức tư tế hay nghi thức giáo hội về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo mạch văn; giữ địa danh theo dạng phiên âm Việt quen thuộc. Cụm “vùng Bê-tha-ni” cùng chú thích bảo tồn độ mở của ἕως πρός.
