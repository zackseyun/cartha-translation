  source_fidelity: Bản văn chính truyền đạt chính xác câu hỏi về điều hai người đang trao đổi khi đi đường, cũng như hành động họ dừng lại với nét mặt buồn rầu. “Vừa đi vừa” diễn đạt tốt phân từ περιπατοῦντες; “trao đổi với nhau” giữ được sắc thái tương hỗ của ἀντιβάλλετε. Tuy nhiên, chú thích b hiện dùng “đứng sững lại”, vốn dễ gợi sự sửng sốt/khựng lại đột ngột, một sắc thái không có trong ἐστάθησαν.
  naturalness: Câu văn tự nhiên, hiện đại và vẫn phù hợp văn phong Kinh Thánh trang trọng. Cụm “vẻ mặt buồn bã” diễn đạt rõ tính từ σκυθρωποί, vốn nói đến dáng vẻ/nét mặt u sầu.
