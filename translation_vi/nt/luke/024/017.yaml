  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: vi
  text: 'Ngài nói với họ: “Các anh vừa đi vừa trao đổi với nhau về chuyện gì vậy?”[a] Họ dừng lại,[b] vẻ mặt buồn bã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Đó là những lời gì mà các anh vừa đi vừa trao đổi với nhau?”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Họ đứng lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Giữ nghĩa thông thường của λέγω là “nói”; tuy lời nói mang hình thức câu hỏi, không cần chuyển thành “hỏi” và làm rõ hơn nguyên văn.
- source_word: δὲ
  choice: không dịch riêng
  rationale: δέ là liên từ nhẹ để tiếp nối diễn biến. Trong tiếng Việt, mạch kể đã tự nhiên mà không cần thêm “và” hay “nhưng” ở đầu câu.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: về chuyện gì vậy
  rationale: λόγοι theo nghĩa đen là “những lời”, nhưng trong ngữ cảnh chỉ nội dung cuộc trò chuyện. “Về chuyện gì vậy” là cách diễn đạt tự nhiên trong tiếng Việt; nghĩa sát chữ được giữ ở chú thích.
- source_word: ἀντιβάλλετε
  choice: trao đổi
  rationale: Động từ diễn tả việc hai bên đưa lời qua lại. “Trao đổi” giữ được tính tương hỗ mà không hàm ý tranh cãi gay gắt như “tranh luận”.
- source_word: πρὸς ἀλλήλους
  choice: với nhau
  rationale: Diễn đạt tự nhiên ý tương hỗ của cụm từ Hy Lạp.
- source_word: περιπατοῦντες
  choice: vừa đi vừa
  rationale: Phân từ chỉ hành động đang diễn ra đồng thời với việc trao đổi; cấu trúc “vừa… vừa…” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἐστάθησαν
  choice: Họ dừng lại
  rationale: Dạng của ἵστημι ở đây diễn tả việc họ ngừng bước. “Dừng lại” truyền đạt rõ chuyển động đang đi bị chặn lại; khả năng dịch sát hình ảnh hơn được ghi trong chú thích.
- source_word: σκυθρωποί
  choice: vẻ mặt buồn bã
  rationale: Tính từ này mô tả nét mặt ủ rũ, buồn rầu. “Vẻ mặt buồn bã” làm rõ sắc thái có thể nhìn thấy mà vẫn giữ giọng văn trang trọng, dễ hiểu.
theological_decisions: []
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng nhưng tự nhiên. Dùng “các anh” phù hợp với lời một người lạ đang nói với hai người nam; “Ngài” giúp quy chiếu tôn kính về Chúa Giê-su mà không làm thay đổi nội dung câu.
