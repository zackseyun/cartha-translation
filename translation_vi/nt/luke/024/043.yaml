id: LUK.24.43
reference: Luke 24:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: vi
  text: Ngài cầm lấy[a] rồi ăn trước mặt họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bản Hy Lạp chỉ nói “cầm lấy” và “ăn”; tân ngữ được hiểu từ câu trước là miếng cá.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: rồi
  rationale: Liên kết hành động này với câu trước và diễn tả tự nhiên trình tự của hai hành động trong tiếng Việt, không thêm một khoảng thời gian đáng kể.
- source_word: λαβὼν
  choice: cầm lấy
  rationale: Phân từ bất định quá khứ chủ động của λαμβάνω diễn tả hành động xảy ra trước động từ chính. “Cầm lấy” tự nhiên trong ngữ cảnh nhận miếng cá; tân ngữ vẫn được để hàm ẩn như bản Hy Lạp.
- source_word: ἐνώπιον αὐτῶν
  choice: trước mặt họ
  rationale: Cụm từ chỉ hành động diễn ra trong sự hiện diện và tầm nhìn của họ; cách nói này tự nhiên, ngắn gọn và giữ được ý nghĩa làm chứng của cảnh tượng.
- source_word: ἔφαγεν
  choice: ăn
  rationale: Động từ bất định quá khứ của ἐσθίω thuật lại hành động đã xảy ra. Tiếng Việt có thể để tân ngữ hàm ẩn một cách tự nhiên khi vật được ăn đã nêu ở câu trước.
theological_decisions:
- issue: Có nên nói rõ tân ngữ bị lược của phân từ và động từ chính hay không
  choice: Giữ tân ngữ hàm ẩn trong câu chính, phù hợp cả bản Hy Lạp lẫn cách dùng tự nhiên của tiếng Việt
  alternative: Ngài cầm lấy miếng cá rồi ăn trước mặt họ.
  rationale: Bản Hy Lạp không nêu tân ngữ vì có thể hiểu từ câu trước. Khác với tiếng Anh, tiếng Việt không cần lặp lại đại từ tân ngữ ở đây. Cách dịch vẫn cho thấy Chúa Giê-xu phục sinh thực sự ăn thức ăn trước mặt họ mà không diễn giải thêm ý nghĩa thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch quy chiếu đến Chúa Giê-xu; “trước mặt họ” là cách diễn đạt thông dụng cho hành động được thực hiện ngay trong tầm mắt của các môn đồ.
