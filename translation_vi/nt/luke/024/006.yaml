  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: vi
  text: 'Ngài không ở đây, nhưng đã được làm cho sống lại.[a] Hãy nhớ lại điều Ngài đã nói với các bà khi Ngài còn ở Ga-li-lê:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã sống lại.” Động từ Hy Lạp ở thể bị động; bản chính dùng “đã được làm cho sống lại” để phản ánh thể này.'
    reason: Nêu cách dịch tự nhiên hơn trong tiếng Việt, đồng thời giải thích lý do bản chính giữ sắc thái bị động của nguyên văn.
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ngài không ở đây
  rationale: Tiếng Hy Lạp lược chủ ngữ, nhưng ngữ cảnh chỉ rõ là Đức Giê-su. Tiếng Việt cần nêu chủ ngữ để câu tự nhiên; “ở đây” diễn đạt trực tiếp ý địa điểm của ὧδε.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Liên từ này nêu sự tương phản trực tiếp giữa việc Ngài không còn ở trong mộ và lời công bố về sự sống lại.
- source_word: ἠγέρθη
  choice: đã được làm cho sống lại
  rationale: Giữ thể bị động của động từ Hy Lạp, đồng thời diễn đạt kết quả của biến cố vẫn còn có hiệu lực. Cách nói này cũng không xóa đi sắc thái về tác nhân được ngầm hiểu.
- source_word: μνήσθητε
  choice: Hãy nhớ
  rationale: Mệnh lệnh trực tiếp, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ὡς
  choice: thế nào
  rationale: Giữ sắc thái cách thức/nội dung của lời đã nói và dẫn tự nhiên sang lời được nhắc lại ở câu kế tiếp.
- source_word: ἐλάλησεν ὑμῖν
  choice: Ngài đã nói với các bà
  rationale: “Nói với” phản ánh nghĩa thông thường của λαλέω. “Các bà” làm rõ nhóm người nữ đang được trực tiếp nói đến trong ngữ cảnh, dù đại từ Hy Lạp tự nó không đánh dấu giới tính.
- source_word: ἔτι ὢν
  choice: khi Ngài còn ở
  rationale: “Còn” giữ ý “vẫn còn” của ἔτι, còn phân từ ὢν được chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ở Ga-li-lê
  rationale: Cách dịch địa điểm trực tiếp; địa danh được phiên âm theo lối quen thuộc với độc giả Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch động từ phục sinh ἠγέρθη
  choice: đã được làm cho sống lại
  alternative: đã sống lại
  rationale: Bản chính giữ thể bị động của tiếng Hy Lạp và sắc thái về hành động của Đức Chúa Trời mà không nêu tác nhân vốn không được nói rõ trong câu. Cách dịch chủ động nội động “đã sống lại” tự nhiên hơn nhưng làm mờ hình thức bị động của nguyên văn, nên được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su trong lời của các thiên sứ; dùng “các bà” vì người nghe trực tiếp trong ngữ cảnh là những phụ nữ. Dấu hai chấm cuối câu cho thấy lời được nhắc lại tiếp tục ở câu 7.
