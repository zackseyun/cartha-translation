  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc và nội dung Hy Lạp: chủ ngữ ngầm chỉ Đức Giê-su, tương phản với ἀλλά, thể bị động của ἠγέρθη, mệnh lệnh μνήσθητε, và bối cảnh Ga-li-lê. Tuy nhiên, trong tiếng Việt, cụm “Hãy nhớ Ngài đã nói ... thế nào” không tự nhiên và có thể gây vấp về quan hệ cú pháp. “Hãy nhớ lại điều Ngài đã nói...” truyền đạt đúng ý của μνήσθητε ὡς ἐλάλησεν trong ngữ cảnh này mà không thêm nội dung.'
  naturalness: “Đã được làm cho sống lại” là cách diễn đạt hơi nặng nhưng có thể chấp nhận trong bản dịch ưu tiên tương đương hình thức, vì bảo toàn bị động của nguyên văn. Thêm “lại” sau “nhớ” và thay “thế nào” bằng “điều” làm câu tiếng Việt hiện đại mạch lạc hơn. “Các bà” phù hợp với những người phụ nữ được nói đến trong ngữ cảnh trực tiếp.
