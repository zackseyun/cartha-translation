- from: 'Rồi Ngài phán với họ: “Đây là những lời Ta đã nói với các con khi Ta còn ở với các con: mọi điều đã chép về Ta[a] trong Luật Môi-se, các sách Tiên tri và Thi thiên[b] đều phải được ứng nghiệm.”'
  to: 'Rồi Người nói với họ: “Đây là những lời tôi đã nói với anh em khi tôi còn ở cùng anh em: mọi điều đã chép về tôi[a] trong Luật Môi-se, các sách Tiên tri và Thi thiên[b] đều phải được ứng nghiệm.”'
  rationale: Bản sửa chỉ điều chỉnh đại từ để tránh thêm sắc thái quan hệ hoặc tôn xưng ngoài nguyên văn, và làm mượt một cụm từ trong chú thích. Trật tự và nội dung mệnh đề vẫn bảo toàn nghĩa của tiếng Hy Lạp; chú thích tiếp tục giữ mở khả năng “Thi thiên” là sách Thi thiên hoặc cách gọi đại diện cho phần Văn phẩm.
