id: LUK.24.44
reference: Luke 24:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: vi
  text: 'Rồi Người nói với họ: “Đây là những lời tôi đã nói với anh em khi tôi còn ở cùng anh em: mọi điều đã chép về tôi[a] trong Luật Môi-se, các sách Tiên tri và Thi thiên[b] đều phải được ứng nghiệm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “liên quan đến tôi.”
    reason: lexical_alternative
  - marker: b
    text: “Luật Môi-se, các sách Tiên tri và Thi thiên” có lẽ chỉ các phần chính của Kinh Thánh Ít-ra-ên. “Thi thiên” có thể chỉ riêng sách Thi thiên hoặc, theo nghĩa rộng hơn, đại diện cho phần Văn phẩm.
    reason: cultural_note
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Rồi Ngài phán với họ
  rationale: δέ là liên từ nhẹ tiếp nối diễn tiến; “rồi” tự nhiên trong tiếng Việt. “Phán” phù hợp với lời trang trọng của Chúa Giê-su mà không thêm ý đối lập.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Đây là những lời Ta
  rationale: Giữ cấu trúc chỉ định và số nhiều của λόγοι bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: đã nói với các con
  rationale: Diễn đạt trực tiếp mệnh đề quan hệ và nghĩa thông dụng của λαλέω; “các con” duy trì cách xưng hô trang trọng, dễ hiểu của Chúa Giê-su với các môn đồ.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: khi Ta còn ở với các con
  rationale: Chuyển phân từ thành mệnh đề thời gian tự nhiên; “còn” thể hiện ἔτι.
- source_word: δεῖ πληρωθῆναι
  choice: đều phải được ứng nghiệm
  rationale: “Phải” giữ lực tất yếu của δεῖ; “được ứng nghiệm” là cách diễn đạt rõ và quen thuộc cho πληρόω khi nói đến Kinh Thánh.
- source_word: πάντα τὰ γεγραμμένα
  choice: mọi điều đã chép
  rationale: “Mọi điều” giữ sức khái quát của πάντα; “đã chép” phản ánh phân từ hoàn thành bị động γεγραμμένα mà vẫn tự nhiên.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: trong Luật Môi-se, các sách Tiên tri và Thi thiên
  rationale: Giữ ba nhóm văn bản được nêu trong tiếng Hy Lạp. Viết hoa cho thấy đây là các phần Kinh Thánh; thêm “các sách” trước “Tiên tri” giúp tiếng Việt rõ nghĩa mà không quyết định quá mức phạm vi quy điển.
- source_word: περὶ ἐμοῦ
  choice: về Ta
  rationale: “Về Ta” là tương đương trực tiếp, tự nhiên của περί với sở hữu cách và bảo toàn nghĩa ‘liên quan đến Ta’.
theological_decisions:
- issue: Tính tất yếu của việc Kinh Thánh được ứng nghiệm
  choice: “đều phải được ứng nghiệm”
  alternative: “sẽ được ứng nghiệm” hoặc “ắt phải thành sự thật”
  rationale: Bản dịch giữ lực tất yếu của δεῖ nhưng không giải thích thêm cơ chế hay học thuyết về sự ứng nghiệm.
- issue: Phạm vi của “Luật Môi-se, các sách Tiên tri và Thi thiên”
  choice: Giữ nguyên ba tên gọi trong chính văn và giải thích sự không chắc chắn trong chú thích
  alternative: Giải thích ngay “Thi thiên” là toàn bộ phần Văn phẩm
  rationale: Câu này có thể nhắc đến các phần lớn của Kinh Thánh Ít-ra-ên, nhưng ψαλμοῖς có thể chỉ riêng sách Thi thiên hoặc đại diện rộng hơn cho Văn phẩm; không nên quyết định dứt khoát trong chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài/Ta/các con” nhất quán với văn phong lời Chúa Giê-su. Cú pháp được sắp xếp tự nhiên cho tiếng Việt nhưng vẫn giữ quan hệ giữa lời đã nói, những điều đã chép và sự ứng nghiệm.
