  naturalness: 'Bản sửa dùng cấu trúc tiếng Việt hiện đại, tự nhiên: “họ đến và thuật lại rằng...”. Cụm “các thiên sứ, những vị nói rằng...” vẫn giữ quan hệ cú pháp của nguyên văn nhưng tránh lối diễn đạt hơi gượng “là những vị nói”.'
