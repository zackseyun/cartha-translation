id: LUK.24.23
reference: Luke 24:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: vi
  text: và khi không tìm thấy thân thể Ngài[a], họ đến và thuật lại rằng họ cũng đã thấy một khải tượng về các thiên sứ[b], những vị nói rằng Ngài đang sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một cách hiểu khác, nhưng ít có khả năng hơn: “họ đến và thuật lại rằng họ đã thấy một khải tượng về các thiên sứ và rằng họ nói Ngài đang sống”; theo cách này, “những vị nói” được hiểu là các phụ nữ chứ không phải các thiên sứ.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “thậm chí đã thấy một khải tượng về các thiên sứ.”'
    reason: translation_alternative
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: khi không tìm thấy
  rationale: Phân từ bất định quá khứ, giống cái số nhiều, bổ nghĩa cho những người phụ nữ; dịch thành mệnh đề chỉ thời gian để tự nhiên trong tiếng Việt, đồng thời giữ nguyên ý phủ định.
- source_word: τὸ σῶμα αὐτοῦ
  choice: thi thể của Ngài
  rationale: Trong bối cảnh ngôi mộ, σῶμα chỉ thân thể đã được mai táng; “thi thể” là cách nói tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἦλθον λέγουσαι
  choice: họ trở về, thuật lại rằng
  rationale: ἦλθον theo chữ là “đến”, nhưng trong mạch truyện là từ ngôi mộ trở về với nhóm môn đồ. “Thuật lại rằng” diễn đạt tự nhiên phân từ λέγουσαι và lời tường thuật gián tiếp theo sau.
- source_word: καὶ
  choice: cũng
  rationale: καί đứng trước ὀπτασίαν bổ sung một sự việc đáng chú ý vào việc không thấy thi thể; “cũng” giữ được ý bổ sung mà không nhấn mạnh quá mức.
- source_word: ὀπτασίαν ἀγγέλων
  choice: một khải tượng về các thiên sứ
  rationale: ὀπτασία chỉ một cảnh tượng hay thị kiến siêu nhiên. “Khải tượng” giữ sắc thái đặc biệt của từ nguồn; “về các thiên sứ” không quyết định quá mức bản chất chính xác của trải nghiệm.
- source_word: ἑωρακέναι
  choice: đã thấy
  rationale: Động từ nguyên mẫu hoàn thành trong lời tường thuật gián tiếp; “đã thấy” diễn đạt tự nhiên hành động xảy ra trước lúc họ thuật lại.
- source_word: οἳ λέγουσιν
  choice: là những vị nói
  rationale: Đại từ quan hệ giống đực số nhiều gần nhất và tự nhiên nhất quy chiếu về các thiên sứ. Hiện tại λέγουσιν được giữ bằng “nói” thay vì chuyển thành quá khứ.
- source_word: αὐτὸν ζῆν
  choice: rằng Ngài đang sống
  rationale: Kết cấu nguyên mẫu được chuyển thành mệnh đề tiếng Việt. “Đang sống” diễn đạt trực tiếp lời xác nhận rằng Chúa Giê-xu còn sống, không thêm cách giải thích thần học.
theological_decisions:
- issue: Đối tượng quy chiếu của οἳ λέγουσιν
  choice: 'Quy chiếu về các thiên sứ: “các thiên sứ, là những vị nói rằng Ngài đang sống.”'
  alternative: 'Có thể hiểu quy chiếu về những người phụ nữ: họ trở về nói rằng họ đã thấy khải tượng về các thiên sứ và rằng chính họ nói Ngài đang sống.'
  rationale: Tiền ngữ gần nhất và phù hợp về giống, số là ἀγγέλων; cách hiểu này cũng tự nhiên trong văn cảnh. Tuy vậy, khả năng cú pháp kém tự nhiên hơn được giữ trong chú thích thay vì bị loại bỏ hoàn toàn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” làm đại từ kính trọng cho Chúa Giê-xu; dùng “thiên sứ” và “khải tượng” là các thuật ngữ Kinh Thánh phổ thông. Câu được nối với văn cảnh trước bằng “và”.
