    issue: “đã trở nên một nhà tiên tri” dịch ἐγένετο quá sát theo nghĩa chuyển trạng thái và không chuyển tải ἀνήρ.
    rationale: Trong ngữ cảnh mô tả này, ἐγένετο có thể mang nghĩa thành ngữ “là/đã là,” không nhất thiết nói đến một thời điểm bắt đầu trở thành tiên tri. Nguyên văn có ἀνὴρ προφήτης; bản nháp chỉ còn “một nhà tiên tri.” Bản sửa giữ cả hai yếu tố mà không tạo hàm ý không cần thiết.
