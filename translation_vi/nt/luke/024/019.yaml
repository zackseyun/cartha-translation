  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: vi
  text: 'Ngài hỏi họ: “Việc gì?” Họ đáp: “Việc liên quan đến Đức Giê-su người Na-xa-rét,[a] là một người, một nhà tiên tri đầy quyền năng trong việc làm và lời nói trước mặt Đức Chúa Trời và toàn dân,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đức Giê-su quê Na-xa-rét”; nguyên văn Hy Lạp là “Đức Giê-su người Na-xa-rét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Việc gì?
  rationale: Đại từ nghi vấn số nhiều chỉ những sự việc vừa được nhắc đến; tiếng Việt tự nhiên dùng số ít tập hợp “Việc gì?” mà không làm mất ý nghĩa ngữ cảnh.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Việc liên quan đến Đức Giê-su
  rationale: Phản ánh trực tiếp cấu trúc chỉ “những điều liên quan đến Giê-su,” đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: Ναζαρηνοῦ
  choice: người Na-xa-rét
  rationale: Giữ sắc thái danh xưng xuất xứ của tính từ Hy Lạp; chú thích cung cấp cách diễn đạt tiếng Việt tương đương khác.
- source_word: ἐγένετο
  choice: đã trở nên
  rationale: Giữ lực động từ γίνομαι thay vì đồng nhất hoàn toàn với “là”; chú thích ghi nhận cách dịch thành ngữ tự nhiên hơn là “đã là.”
- source_word: ἀνὴρ προφήτης
  choice: một nhà tiên tri
  rationale: Trong kết cấu này, ἀνήρ đi với danh từ chỉ vai trò và không nhất thiết cần dịch tách thành “một người nam”; tiếng Việt “một nhà tiên tri” tự nhiên, tránh hàm ý sai rằng Đức Giê-su đến lúc ấy mới trở thành con người.
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: đầy quyền năng trong việc làm và lời nói
  rationale: Diễn đạt rõ năng lực được bày tỏ cả qua hành động lẫn lời nói, giữ cặp ý song song của nguyên văn.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: trước mặt Đức Chúa Trời và toàn dân
  rationale: ἐναντίον ở đây chỉ trước sự hiện diện và chứng kiến của Đức Chúa Trời cùng toàn thể dân chúng.
theological_decisions:
- issue: Cách hiểu ἀνὴρ trong cụm ἀνὴρ προφήτης khi nói về Đức Giê-su
  choice: Dịch tự nhiên là “một nhà tiên tri,” không tách ἀνήρ thành “một người nam.”
  alternative: “một người, một nhà tiên tri” hoặc “một người nam, một nhà tiên tri”
  rationale: Nguyên văn khẳng định Đức Giê-su là một nhà tiên tri đầy quyền năng theo lời hai môn đồ. Trong ngữ cảnh này, việc tách “người nam” vừa gượng trong tiếng Việt vừa có thể khiến “đã trở nên” bị hiểu lầm là lúc ấy Ngài mới trở thành con người; không cần suy diễn thêm hay giảm nhẹ nhân tính của Ngài.
- issue: Lực nghĩa của ἐγένετο
  choice: Giữ “đã trở nên” trong chính văn và nêu “đã là” ở chú thích.
  alternative: “đã là”
  rationale: Cách dịch chính giữ lực động của động từ Hy Lạp và sự căng nghĩa vốn có; chú thích giúp người đọc nhận biết cách diễn đạt thành ngữ khả dĩ mà không áp đặt một cách giải nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Đức Giê-su trong lời dẫn; giữ câu trích dẫn dang dở bằng dấu phẩy cuối câu vì lời nói tiếp tục sang câu kế. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
