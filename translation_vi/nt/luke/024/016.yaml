  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: vi
  text: Nhưng mắt họ bị ngăn không cho nhận ra Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Mắt họ bị giữ lại nên không nhận ra Ngài” hoặc “Mắt họ bị cản trở, không nhận ra Ngài.” Tiếng Hy Lạp không cho biết ai hay điều gì đã ngăn họ nhận ra Ngài.'
    reason: Nêu các khả năng từ vựng của động từ bị động và bảo tồn việc tác nhân không được xác định trong nguyên văn.
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: 'Liên từ nhẹ đánh dấu diễn tiến có sắc thái tương phản: Chúa Giê-su đang hiện diện, nhưng hai môn đồ không nhận ra Ngài.'
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: mắt họ
  rationale: Giữ hình ảnh cụ thể của nguyên văn, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: ἐκρατοῦντο
  choice: bị ngăn lại
  rationale: Giữ thể bị động và ý bị giữ lại hoặc cản trở, nhưng không xác định tác nhân vì nguyên văn không nêu tác nhân.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: khiến họ không nhận ra
  rationale: Diễn đạt tự nhiên cấu trúc động từ nguyên mẫu có mạo từ với μή, mang sắc thái kết quả hoặc mục đích; ἐπιγινώσκω trong văn cảnh này là nhận ra, nhận diện.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su; cách viết này phù hợp với văn phong Kinh Thánh tiếng Việt trang trọng, mà không bổ sung danh xưng không có trong câu Hy Lạp.
theological_decisions:
- issue: Có xác định ai đã ngăn họ nhận ra Chúa Giê-su hay không
  choice: 'Giữ thể bị động không nêu tác nhân: “mắt họ bị ngăn lại”.'
  alternative: Nói rõ Đức Chúa Trời là tác nhân, hoặc chuyển thành “họ không thể nhận ra Ngài”.
  rationale: Nguyên văn dùng thể bị động mà không nêu tác nhân. Bản dịch không thêm tác nhân thần thượng và cũng không làm mất hàm ý có sự cản trở bằng cách chỉ mô tả sự bất lực.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh “mắt họ” và thể bị động của nguyên văn; dùng “Ngài” để chỉ Chúa Giê-su theo lối hành văn Kinh Thánh tiếng Việt.
