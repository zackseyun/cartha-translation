revisions:
- from: Khi họ đến gần ngôi làng mình định tới, Đức Chúa Jêsus làm như thể Ngài muốn đi xa hơn.[a]
  to: Khi họ đến gần ngôi làng mà họ đang đi tới, Đức Chúa Jêsus làm như thể sẽ đi xa hơn.[a]
  rationale: Thay “mình định tới” bằng “mà họ đang đi tới” để phản ánh chính xác hành trình đang diễn ra. Thay “muốn đi” bằng “sẽ đi” để không thêm ý muốn, đồng thời giữ nghĩa Đức Chúa Jêsus tạo ấn tượng rằng Ngài sẽ tiếp tục đi xa hơn. Vị trí neo chú thích vẫn gắn trực tiếp với mệnh đề dịch προσεποιήσατο.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:14Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng bối cảnh chung, nhưng “mình định tới” thêm sắc thái ý định không có trong οὗ ἐπορεύοντο, vốn chỉ nơi họ đang đi đến. Quan trọng hơn, “muốn đi” chuyển nguyên mẫu πορεύεσθαι thành ý muốn của Đức Chúa Jêsus; tiếng Hy Lạp nói Ngài tỏ ra như đang/sẽ tiếp tục đi xa hơn, không nói về điều Ngài muốn làm.
  naturalness: “Khi họ đến gần ngôi làng mà họ đang đi tới” là cách diễn đạt hiện đại, rõ nghĩa. “Ngài làm như thể sẽ đi xa hơn” tự nhiên trong tiếng Việt và giữ được sắc thái hành động có vẻ sắp tiếp diễn.
  terminology: Giữ cách gọi “Đức Chúa Jêsus” và đại từ “Ngài” theo bản nháp. “Ngôi làng” phù hợp với κώμη; “xa hơn” phù hợp với πορρώτερον. Chú thích được giữ để nêu các khả năng từ vựng của προσεποιήσατο.
