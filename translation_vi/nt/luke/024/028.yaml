  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: vi
  text: Khi họ đến gần ngôi làng mà họ đang đi tới, Đức Chúa Jêsus làm như thể sẽ đi xa hơn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài giả vờ đi xa hơn” hoặc “Ngài làm bộ như sẽ đi xa hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: đến gần
  rationale: Động từ ở thì bất định diễn tả việc tiến đến gần một địa điểm; “đến gần” tự nhiên và giữ rõ ý chuyển động.
- source_word: κώμην
  choice: ngôi làng
  rationale: κώμη thường chỉ một khu dân cư nhỏ hơn thành phố; “ngôi làng” phù hợp với quy mô và văn cảnh.
- source_word: οὗ ἐπορεύοντο
  choice: mình định tới
  rationale: Cụm này nêu đích đến của hành trình đang diễn ra. “Mình” quy chiếu tự nhiên về hai môn đồ; “định tới” truyền đạt hướng đi mà không khẳng định họ đã đến nơi.
- source_word: προσεποιήσατο
  choice: làm như thể
  rationale: Cách dịch này giữ ý Ngài tỏ ra như sắp tiếp tục đi, nhưng không áp đặt sắc thái lừa dối mạnh hơn điều từ Hy Lạp nhất thiết hàm ý.
- source_word: πορρώτερον
  choice: xa hơn
  rationale: Trạng từ so sánh chỉ khoảng cách tiếp tục vượt quá địa điểm hiện tại; “xa hơn” rõ và tự nhiên trong ngữ cảnh hành trình.
- source_word: πορεύεσθαι
  choice: muốn đi
  rationale: Nguyên mẫu bổ nghĩa cho προσεποιήσατο, diễn tả hành động có vẻ sẽ tiếp diễn; trong kết cấu tiếng Việt “làm như thể ... muốn đi” tạo câu tự nhiên.
theological_decisions:
- issue: Cách diễn đạt προσεποιήσατο liên quan đến hành động của Đức Chúa Jêsus
  choice: làm như thể Ngài muốn đi xa hơn
  alternative: giả vờ đi xa hơn; làm bộ như sẽ đi xa hơn
  rationale: 'Bản dịch giữ nguyên sức căng của lời kể: Ngài tạo ấn tượng rằng mình sẽ tiếp tục đi, nhưng không tự ý kết luận rằng hành động ấy là sự lừa dối.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ kính trọng “Ngài” để làm rõ chủ thể của αὐτός trong ngữ cảnh, tránh đại từ “ông” dễ gây mơ hồ. Dấu chú thích [a] được đặt ngay sau mệnh đề có phương án dịch khác.
