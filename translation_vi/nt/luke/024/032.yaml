revisions:
- from: 'Họ nói với nhau: “Chẳng phải lòng chúng ta đã nóng cháy trong chúng ta[a] khi Ngài nói với chúng ta dọc đường[b] và mở Kinh Thánh cho chúng ta sao?”'
  to: 'Họ nói với nhau: “Lòng chúng ta chẳng phải đã bừng cháy[a] khi Ngài đang nói với chúng ta dọc đường[b], khi Ngài đang mở Kinh Thánh[c] cho chúng ta sao?”'
  rationale: Bản sửa giữ nguyên câu hỏi tu từ, ẩn dụ lửa cháy và ẩn dụ “mở Kinh Thánh”, đồng thời làm câu tiếng Việt tự nhiên hơn. Chú thích dị bản minh bạch về ἐν ἡμῖν mà không buộc một cách diễn đạt thừa nghĩa vào chính văn. Các chú thích từ vựng được tách theo đúng điểm neo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:24Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng câu hỏi tu từ, hình ảnh lòng bừng cháy, bối cảnh trên đường và ẩn dụ “mở Kinh Thánh”. Tuy nhiên, “lòng chúng ta đã nóng cháy trong chúng ta” là lặp cấu trúc không tự nhiên trong tiếng Việt. Hai mệnh đề với ὡς và hai động từ ở thì chưa hoàn thành nên được phản ánh rõ hơn bằng “khi Ngài đang nói... khi Ngài đang mở...”.
  naturalness: Cần đổi trật tự câu hỏi thành “Lòng chúng ta chẳng phải... sao?” và dùng “bừng cháy” thay cho “đã nóng cháy” để có tiếng Việt hiện đại, tự nhiên, mà vẫn giữ nguyên ẩn dụ. Không nên ép dịch “ἐν ἡμῖν” thành “trong chúng ta” ngay sau “lòng chúng ta”; chú thích văn bản có thể minh bạch cụm từ được SBLGNT đặt trong ngoặc.
  terminology: “Kinh Thánh” phù hợp với τὰς γραφάς trong ngữ cảnh này; “Ngài” giữ được văn phong tôn trọng, hiện đại. Tách chú thích về “dọc đường” và về nghĩa ẩn dụ của “mở Kinh Thánh” để mỗi chú thích có điểm neo rõ ràng.
  issues:
  - severity: medium
    issue: Cụm “lòng chúng ta đã nóng cháy trong chúng ta” không tự nhiên và bị lặp nghĩa.
    rationale: “Lòng chúng ta” vốn đã chỉ nội tâm; thêm “trong chúng ta” theo lối dịch từng chữ tạo câu gượng trong tiếng Việt. Vì ἐν ἡμῖν còn là cụm có dị bản và SBLGNT đặt trong ngoặc, nên có thể phản ánh trong chú thích thay vì làm câu chính văn kém tự nhiên.
  - severity: low
    issue: Chú thích [b] gộp hai vấn đề nhưng chỉ được neo sau “dọc đường”.
    rationale: Lựa chọn “trên đường” và lời giải thích “mở Kinh Thánh” cần các điểm neo riêng để người đọc biết chính xác chú thích áp dụng cho cụm nào.
  - severity: low
    issue: Các động từ chưa hoàn thành ἐλάλει và διήνοιγεν chưa được biểu đạt rõ trong bản nháp.
    rationale: Tiếng Việt không bắt buộc đánh dấu thì, nhưng “đang nói” và “đang mở” trong hai mệnh đề “khi” diễn đạt tốt hơn tính đang diễn tiến của nguyên ngữ.
