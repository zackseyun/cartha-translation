id: LUK.24.32
reference: Luke 24:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: vi
  text: 'Họ nói với nhau: “Lòng chúng ta chẳng phải đã bừng cháy[a] khi Ngài đang nói với chúng ta dọc đường[b], khi Ngài đang mở Kinh Thánh[c] cho chúng ta sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: SBLGNT đặt cụm “trong chúng ta” trong dấu ngoặc; một số thủ bản không có cụm này. Ý nội tâm của cụm từ đã được hàm ý trong cách nói “lòng chúng ta... bừng cháy”.
    reason: textual_variant
  - marker: b
    text: 'Hoặc: “trên đường”.'
    reason: lexical_alternative
  - marker: c
    text: Nghĩa đen là “mở Kinh Thánh”, tức là làm cho họ hiểu rõ ý nghĩa của Kinh Thánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: nói với nhau
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ rõ tính tương hỗ của cuộc trò chuyện.
- source_word: Οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Giữ cấu trúc câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: ἡ καρδία ἡμῶν
  choice: lòng chúng ta
  rationale: Giữ số ít tập hợp của nguyên văn Hy Lạp; “lòng” cũng tự nhiên hơn “trái tim” khi nói về trải nghiệm nội tâm.
- source_word: καιομένη ἦν
  choice: đã nóng cháy
  rationale: Giữ hình ảnh lửa cháy và ý nghĩa trạng thái kéo dài trong quá khứ, không quy giản thành xúc động hay giác ngộ.
- source_word: ἐν ἡμῖν
  choice: trong chúng ta
  rationale: Dịch sát biến thể văn bản được SBLGNT in trong dấu ngoặc, dù tiếng Việt thường có thể nói tự nhiên hơn là “trong lòng chúng ta”.
- source_word: ἐλάλει
  choice: nói
  rationale: Trong cấu trúc với “khi”, tiếng Việt không cần hình thái tiếp diễn riêng; ngữ cảnh vẫn biểu đạt hành động đang diễn ra.
- source_word: ἐν τῇ ὁδῷ
  choice: dọc đường
  rationale: Tự nhiên trong bối cảnh họ đang đi đường, đồng thời giữ nghĩa cụ thể của ὁδός.
- source_word: διήνοιγεν
  choice: mở
  rationale: Giữ nguyên ẩn dụ “mở” của διανοίγω thay vì diễn giải thẳng là “giải thích”.
- source_word: τὰς γραφάς
  choice: Kinh Thánh
  rationale: Cách gọi chuẩn, dễ hiểu trong tiếng Việt đối với các sách thánh được nhắc đến ở đây.
theological_decisions:
- issue: Ẩn dụ lòng nóng cháy
  choice: Giữ “lòng chúng ta đã nóng cháy”
  alternative: lòng chúng ta đã xúc động sâu xa / chúng ta đã được soi sáng
  rationale: Nguyên văn không xác định trải nghiệm ấy chỉ thuộc cảm xúc, tâm linh hay nhận thức; giữ ẩn dụ bảo toàn sự rộng mở và sức căng thần học.
- issue: Ẩn dụ mở Kinh Thánh
  choice: Giữ “mở Kinh Thánh cho chúng ta”
  alternative: giải thích Kinh Thánh cho chúng ta
  rationale: Giữ hình ảnh của nguyên văn, còn chú thích làm rõ rằng đây là việc giúp họ hiểu ý nghĩa Kinh Thánh.
- issue: Biến thể văn bản ἐν ἡμῖν
  choice: Đưa “trong chúng ta” vào chính văn và ghi chú biến thể
  alternative: Lược bỏ cụm từ theo một số thủ bản
  rationale: SBLGNT đặt cụm này trong dấu ngoặc chỉ biến thể; việc giữ trong chính văn cùng chú thích vừa theo văn bản trình bày vừa minh bạch chứng cứ thủ bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su trong lời thuật, tránh lặp đại từ gây mơ hồ. Giữ các ẩn dụ “lòng nóng cháy” và “mở Kinh Thánh”; các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
