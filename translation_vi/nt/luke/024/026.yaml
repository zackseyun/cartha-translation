id: LUK.24.26
reference: Luke 24:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: vi
  text: Chẳng phải Đấng Mê-si cần phải chịu những điều ấy và bước vào vinh quang của mình sao?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô.” Tước hiệu Hy Lạp Χριστός được dịch là “Đấng Mê-si” ở đây để giữ rõ ý nghĩa của tước hiệu trong bối cảnh ứng nghiệm Kinh Thánh.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Diễn đạt tự nhiên trong tiếng Việt một câu hỏi tu từ mong đợi câu trả lời khẳng định.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ lực chỉ định của đại từ số nhiều trung tính và quy chiếu về những đau khổ vừa được nhắc đến.
- source_word: ἔδει
  choice: cần phải
  rationale: Thể hiện tính tất yếu gắn với chương trình của Đức Chúa Trời và sự ứng nghiệm Kinh Thánh, nhưng không giải thích thêm vượt quá nguyên văn.
- source_word: παθεῖν
  choice: chịu
  rationale: Trong ngữ cảnh, động từ này chỉ việc chịu những đau khổ đã nói đến; cách diễn đạt ngắn gọn và tự nhiên.
- source_word: τὸν χριστὸν
  choice: Đấng Mê-si
  rationale: Χριστός là tước hiệu tương ứng với Đấng được xức dầu; “Đấng Mê-si” làm rõ ý nghĩa tước hiệu trong bối cảnh ứng nghiệm Kinh Thánh.
- source_word: καὶ
  choice: và
  rationale: Giữ phép nối đơn giản giữa hai động từ nguyên mẫu, không thêm ý trình tự như “rồi” hoặc “sau đó”.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: bước vào vinh quang của mình
  rationale: Giữ hình ảnh đi vào một địa hạt hay trạng thái vinh quang và bảo toàn đại từ sở hữu quy chiếu về Đấng Mê-si.
- source_word: δόξαν
  choice: vinh quang
  rationale: Là cách tương đương quen thuộc và thích hợp cho δόξα trong bối cảnh phục sinh và tôn cao.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Từ này hoạt động như một tước hiệu trong bối cảnh lời Kinh Thánh được ứng nghiệm. Bản chính chuyển tải ý nghĩa Mê-si, còn chú thích giữ cách gọi truyền thống bắt nguồn từ tiếng Hy Lạp.
- issue: Sắc thái của ἔδει
  choice: cần phải
  alternative: phải
  rationale: “Cần phải” bảo toàn ý về tính tất yếu trong chương trình cứu chuộc và sự ứng nghiệm Kinh Thánh mà không xác định chi tiết hơn điều nguyên văn không nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc hỏi tu từ “Chẳng phải ... sao?” tự nhiên; không thêm từ chỉ trình tự vào καὶ. Đại từ phản thân “mình” quy chiếu rõ về chủ ngữ mà không đưa vào lối xưng hô mang sắc thái hệ phái.
