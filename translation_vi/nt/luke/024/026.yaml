  source_fidelity: Bản dịch chuyển tải đầy đủ câu hỏi tu từ οὐχὶ…; ταῦτα là “những điều ấy”; ἔδει παθεῖν là “cần phải chịu”; và hai động từ nguyên mẫu được nối bằng “và”. “Bước vào vinh quang của mình” giữ được εἰσελθεῖν εἰς và đại từ sở hữu αὐτοῦ, không thêm ý về trình tự hay diễn giải nguyên nhân.
  naturalness: “Chẳng phải … sao?” là cấu trúc hỏi tu từ hiện đại, tự nhiên và phù hợp với lực của nguyên ngữ. Câu có giọng văn trang trọng, sáng rõ, phù hợp văn cảnh Kinh Thánh mà không cổ hóa quá mức.
  terminology: “Đấng Mê-si” dịch đúng tính chất tước hiệu của ὁ χριστός và phù hợp quyết định thuật ngữ đã nêu. “Vinh quang” là tương đương ổn định, tự nhiên cho δόξα trong ngữ cảnh tôn cao. Chú thích nêu phương án “Đấng Ki-tô” đúng chỗ, rõ ràng và không áp đặt diễn giải hệ phái.
