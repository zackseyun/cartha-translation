    issue: “các con” thêm sắc thái quan hệ không có trong nguyên văn.
    rationale: Ἔχετέ là ngôi thứ hai số nhiều, nhưng không xác định cách xưng hô là cha-con hoặc thầy-trò. Hơn nữa, nhóm người nghe trong bối cảnh có thể không chỉ gồm những người mà tiếng Việt tự nhiên gọi là “các con”.
  - severity: low
    issue: “quá” diễn giải thêm mức độ của niềm vui.
    rationale: Cụm ἀπὸ τῆς χαρᾶς nêu niềm vui là nguyên nhân/nguồn cơn, không nêu trực tiếp mức độ “quá”. Bản dịch có thể giữ nghịch lý mà không thêm cường độ.
  - severity: low
    issue: “Ngài hỏi họ” ít sát động từ tường thuật εἶπεν.
    rationale: Dù câu trực tiếp có hình thức câu hỏi, εἶπεν nghĩa cơ bản là “nói”. “Ngài nói với họ” vừa tự nhiên vừa sát nguồn hơn.
