language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: vi
  text: 'Trong khi họ vẫn chưa tin vì vui mừng và còn kinh ngạc[a], Ngài nói với họ: “Ở đây, mọi người có gì ăn không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong khi vì vui mừng mà họ vẫn chưa tin và còn ngỡ ngàng.”'
    reason: Giữ một cách sắp xếp sát cấu trúc Hy Lạp hơn và sắc thái thay thế của θαυμάζω.
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Trong khi ... vẫn
  rationale: Diễn đạt tự nhiên sự tiếp diễn của ἔτι cùng liên từ chuyển tiếp nhẹ δέ, đồng thời dẫn vào hai phân từ chỉ hoàn cảnh.
- source_word: ἀπιστούντων
  choice: chưa tin
  rationale: Giữ nghĩa trạng thái chưa thể tin đang tiếp diễn trong tình huống này, không hàm ý một thái độ vô tín cố hữu hay cứng lòng.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: vì quá vui mừng
  rationale: ἀπό biểu thị nguyên nhân; thêm “quá” giúp tiếng Việt diễn đạt tự nhiên nghịch lý rằng niềm vui lớn đến mức khiến họ chưa thể tin điều đang xảy ra.
- source_word: θαυμαζόντων
  choice: còn kinh ngạc
  rationale: Diễn đạt trạng thái kinh ngạc đang tiếp diễn và phối hợp tự nhiên với “vẫn chưa tin”; sắc thái thán phục/ngỡ ngàng được ghi nhận trong chú thích.
- source_word: εἶπεν αὐτοῖς
  choice: Ngài hỏi họ
  rationale: Động từ nguyên nghĩa là “nói”, nhưng lời theo sau là câu hỏi trực tiếp; “hỏi” là cách diễn đạt tự nhiên, đúng chức năng ngôn hành trong tiếng Việt.
- source_word: Ἔχετέ τι βρώσιμον
  choice: các con có gì ăn không?
  rationale: Cách hỏi khẩu ngữ trang trọng và tự nhiên; βρώσιμον là thứ ăn được, được diễn đạt thành “gì ăn” thay vì cụm từ cứng “vật gì có thể ăn được”.
- source_word: ἐνθάδε
  choice: Ở đây
  rationale: Tương đương trực tiếp, ngắn gọn với trạng từ chỉ nơi chốn.
theological_decisions:
- issue: Tính chất phản ứng của các môn đồ trước Chúa Giê-su phục sinh
  choice: Họ vẫn chưa thể tin vì niềm vui quá lớn, đồng thời đang kinh ngạc.
  alternative: Họ không tin theo nghĩa hoài nghi hoặc khước từ, còn niềm vui chỉ là một cảm xúc đi kèm.
  rationale: Cấu trúc ἀπιστούντων ... ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων nối trạng thái chưa tin với nguyên nhân là niềm vui và với sự kinh ngạc. Bản dịch giữ nguyên sự căng thẳng tâm lý-thần học này, không biến nó thành sự vô tín cứng lòng cũng không xóa bỏ thực tế rằng họ vẫn chưa tin.
- issue: Cách xưng hô của Chúa Giê-su với các môn đồ
  choice: các con
  alternative: các anh / anh em / các ông
  rationale: Chủ ngữ số nhiều trong tiếng Hy Lạp không quy định đại từ xưng hô. “Các con” phù hợp văn phong Kinh Thánh tiếng Việt và quan hệ thầy-trò, nhưng không nhằm khẳng định một danh xưng thần học có trong nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu dịch giữ nghịch lý “chưa tin vì quá vui mừng” và nhịp của hai trạng thái đồng thời. Đại từ “Ngài” và “các con” theo văn phong Kinh Thánh phổ thông; không viết hoa đại từ sở hữu hay thêm danh hiệu không có trong nguyên văn.
