review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp phản ánh đúng mạch chính của câu: một số người thuộc nhóm đi đến mộ, xác nhận điều các phụ nữ đã thuật lại, nhưng không thấy chính Người. Tuy nhiên, “mọi sự” cụ thể hóa và khái quát hóa tân ngữ hàm ẩn của εὗρον (“họ thấy/tìm thấy đúng như...”) theo cách không cần thiết; nguyên văn không nói rằng họ đã kiểm chứng ‘mọi sự’.'
  naturalness: “Có mấy người trong nhóm chúng tôi” khá tự nhiên, nhưng “mấy người” trong văn kể trang trọng có thể gợi số lượng ít xác định. “Một số người trong những người cùng chúng tôi” sát nghĩa và rõ quan hệ nhóm hơn. Cụm “thấy mọi sự đúng như” hơi gượng; “thấy đúng như các phụ nữ đã nói” tự nhiên hơn trong tiếng Việt và vẫn giữ tân ngữ được hàm ý như tiếng Hy Lạp.
  terminology: “Ngôi mộ” phù hợp với μνημεῖον trong ngữ cảnh này. “Ngài” là cách xưng hô kính trọng quen thuộc trong văn phong Kinh Thánh tiếng Việt và vẫn giữ đại từ thay vì thay bằng tên riêng. “Các phụ nữ” phản ánh mạo từ xác định trong ngữ cảnh mà không thêm sắc thái chỉ xuất xa của “ấy”.
  issues:
  - severity: medium
    issue: Cụm “mọi sự” thêm một khái quát hóa không có trong nguyên văn.
    rationale: εὗρον οὕτως καθὼς... diễn đạt rằng họ thấy/tìm thấy sự việc đúng như các phụ nữ đã nói; tân ngữ được để hàm ẩn. “Mọi sự” dễ khiến người đọc hiểu họ đã xác minh toàn bộ các chi tiết trong lời kể.
  - severity: low
    issue: “Mấy người trong nhóm chúng tôi” kém sát với cấu trúc “một số người trong những người cùng chúng tôi”.
    rationale: Bản nháp không sai nghĩa, nhưng cách sửa đề xuất giữ rõ hơn rằng đây là một phần của những người đang ở cùng người kể, đồng thời phù hợp văn phong thuật chuyện trang trọng.
  revised_text: Một số người trong những người cùng chúng tôi đã đi đến ngôi mộ và thấy đúng như các phụ nữ đã nói, nhưng họ không thấy Ngài.
