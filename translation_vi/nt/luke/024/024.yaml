revisions:
- from: Có mấy người trong nhóm chúng tôi đã đi đến ngôi mộ và thấy mọi sự đúng như những phụ nữ ấy đã nói, nhưng họ không thấy Ngài.
  to: Một số người trong những người cùng chúng tôi đã đi đến ngôi mộ và thấy đúng như các phụ nữ đã nói, nhưng họ không thấy Ngài.
  rationale: Sửa tối thiểu để tránh thêm ý “mọi sự”, giữ tân ngữ hàm ẩn của nguyên văn, đồng thời diễn đạt rõ hơn quan hệ “một số người” với nhóm đang ở cùng người nói. Sự tương phản do δέ và đại từ αὐτόν vẫn được giữ nguyên.
