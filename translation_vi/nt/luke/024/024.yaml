source:
  edition: SBLGNT
  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: vi
  text: Một số người trong những người cùng chúng tôi đã đi đến ngôi mộ và thấy đúng như các phụ nữ đã nói, nhưng họ không thấy Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: đã đi
  rationale: Động từ aorist ἀπέρχομαι ở đây thuật lại việc họ đi đến ngôi mộ; “đã đi” tự nhiên và không nhấn quá mức ý rời khỏi.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: mấy người trong nhóm chúng tôi
  rationale: Diễn đạt một số người thuộc nhóm đang ở cùng người nói; cách nói này tự nhiên trong tiếng Việt và không xác định họ cụ thể hơn nguyên văn.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: đến ngôi mộ
  rationale: Trong bối cảnh mai táng và phục sinh, μνημεῖον chỉ nơi đặt thi thể Chúa Giê-su; “ngôi mộ” là cách gọi rõ ràng, thông dụng.
- source_word: εὗρον
  choice: thấy
  rationale: Trong ngữ cảnh này, εὗρον có nghĩa họ đến nơi và nhận thấy tình trạng đúng như lời thuật lại. “Thấy” tự nhiên hơn “tìm thấy” khi tân ngữ được hiểu là tình trạng/sự việc.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: mọi sự đúng như những phụ nữ ấy đã nói
  rationale: Diễn đạt sự tương ứng giữa điều họ chứng kiến và lời những phụ nữ đã báo; “mọi sự” làm rõ bổ ngữ được hàm ý mà không thêm nội dung cụ thể.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su. “Ngài” giữ hình thức đại từ và phù hợp văn phong Kinh Thánh trang trọng hiện đại, không thay bằng tên riêng.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện sự tương phản nhẹ giữa việc xác nhận lời các phụ nữ và việc không thấy Chúa Giê-su.
- source_word: οὐκ εἶδον
  choice: họ không thấy
  rationale: Giữ đúng nghĩa của ὁράω là “thấy”, không đổi thành “tìm thấy”; chủ ngữ là những người đã đi đến mộ.
theological_decisions:
- issue: Cách thuật lại sự phục sinh
  choice: Những người đến mộ xác nhận tình trạng đúng như lời các phụ nữ, nhưng không thấy chính Chúa Giê-su.
  alternative: Diễn giải thêm họ đã thấy ngôi mộ trống hoặc hài hòa hóa với các trình thuật song song.
  rationale: Bản dịch giữ nguyên sự phân biệt của câu Hy Lạp giữa điều họ thấy tại mộ và việc họ không thấy Ngài, không bổ sung chi tiết từ các trình thuật khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp kể chuyện tự nhiên và duy trì sự tương phản của nguyên văn.
