  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: vi
  text: và nhân danh Ngài, sự ăn năn để được tha tội phải được công bố cho mọi dân tộc[b][a], bắt đầu từ Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự ăn năn và sự tha tội”; tiếng Hy Lạp có thể được hiểu là hai nội dung song song của lời được công bố.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “cho mọi dân ngoại”; từ Hy Lạp này trong một số văn cảnh có nghĩa là “dân ngoại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: phải được công bố
  rationale: Động từ nguyên mẫu thụ động phụ thuộc vào mạch văn về điều Kinh Thánh đã chép phải được ứng nghiệm; “công bố” giữ sắc thái loan báo công khai mà không giới hạn vào việc giảng trong một khung cảnh chính thức.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: nhân danh Ngài
  rationale: Thành ngữ này diễn tả việc công bố dựa trên thẩm quyền và thân vị của Chúa Giê-su; “nhân danh Ngài” là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: μετάνοιαν
  choice: sự ăn năn
  rationale: Diễn đạt sự đổi hướng nội tâm và quay trở lại, chứ không chỉ là thay đổi ý nghĩ; đây cũng là thuật ngữ tiếng Việt quen thuộc, dễ hiểu trong văn cảnh.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: để được tha tội
  rationale: ἄφεσις trong văn cảnh là sự tha thứ hay giải thoát khỏi tội. Cách dịch chính liên kết sự ăn năn với việc được tha tội, đồng thời ghi chú khả năng hiểu hai danh từ như hai nội dung song song.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: cho mọi dân tộc
  rationale: “Mọi dân tộc” giữ phạm vi phổ quát của sứ mạng và không thu hẹp ἔθνη chỉ vào dân ngoại; giới từ “cho” diễn đạt hướng đến những người tiếp nhận lời công bố.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: bắt đầu từ Giê-ru-sa-lem
  rationale: Giữ rõ Giê-ru-sa-lem là điểm khởi đầu của việc công bố và phản ánh sắc thái xuất phát của ἀπό.
theological_decisions:
- issue: Mối quan hệ giữa sự ăn năn và sự tha tội trong nội dung được công bố
  choice: “sự ăn năn để được tha tội”
  alternative: “sự ăn năn và sự tha tội” như hai nội dung song song
  rationale: Văn bản Hy Lạp có biến thể và cấu trúc có thể được hiểu theo hai cách. Bản dịch chính thể hiện mối liên hệ tự nhiên giữa ăn năn và tha tội nhưng không triển khai một trật tự cứu rỗi chi tiết; chú thích bảo tồn cách hiểu phối hợp.
- issue: Phạm vi của ἔθνη
  choice: “mọi dân tộc”
  alternative: “mọi dân ngoại”
  rationale: Trong lời ủy thác sau phục sinh, cụm từ mang phạm vi toàn cầu. “Mọi dân tộc” vừa giữ hình thức từ vựng vừa bao gồm dân ngoại mà không loại trừ các dân khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su; giữ địa danh quen thuộc “Giê-ru-sa-lem.” Các dấu chú thích [b][a] được đặt ngay sau cụm từ liên quan, theo thứ tự của lớp tham khảo đã cung cấp.
