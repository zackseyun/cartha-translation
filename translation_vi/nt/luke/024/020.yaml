  rationale: 'Chỉnh nhẹ để tiếng Việt hiện đại, tự nhiên hơn: thay “và thể nào” bằng “và cách mà,” rút gọn “những người lãnh đạo” thành “các nhà lãnh đạo,” và thay giới từ “vào” bằng “trên” trong cụm chỉ việc đóng đinh. Bản văn vẫn giữ chủ thể số nhiều và động từ chủ động của nguyên ngữ; chú thích chỉ nêu phương án diễn giải về tác nhân, không thay thế bản dịch chính.'
