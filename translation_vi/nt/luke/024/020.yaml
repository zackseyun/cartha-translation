  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: vi
  text: và cách mà các thượng tế cùng các nhà lãnh đạo của chúng ta đã nộp Ngài để bị kết án tử hình, rồi đóng đinh Ngài trên thập tự giá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “rồi cho đóng đinh Ngài trên thập tự giá,” nhằm nói rõ rằng các nhà lãnh đạo chịu trách nhiệm về việc hành quyết, dù nhà cầm quyền La Mã là bên thi hành.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: và thể nào
  rationale: ὅπως giới thiệu nội dung đang được thuật lại, còn τε nối tiếp ý của câu trước. “Và thể nào” giữ được mạch kể trang trọng và tự nhiên.
- source_word: παρέδωκαν
  choice: đã nộp
  rationale: παραδίδωμι ở đây mang nghĩa giao nộp cho thẩm quyền xét xử và hành quyết; “nộp” ngắn gọn, tự nhiên và không thu hẹp nghĩa thành “phản bội”.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế cấp cao, không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: những người lãnh đạo của chúng ta
  rationale: ἄρχοντες chỉ những người có quyền lãnh đạo. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ đại từ sở hữu ἡμῶν.
- source_word: εἰς κρίμα θανάτου
  choice: để bị kết án tử hình
  rationale: κρίμα có thể chỉ phán quyết hay bản án; cụm này nói đến phán quyết dẫn tới cái chết. Cách dịch giữ sắc thái pháp lý mà vẫn rõ nghĩa.
- source_word: ἐσταύρωσαν
  choice: đóng đinh Ngài vào thập tự giá
  rationale: Động từ chủ động quy trách nhiệm trực tiếp cho các thượng tế và giới lãnh đạo. Bản dịch giữ nguyên lực tu từ đó, không tự thêm ý sai khiến.
theological_decisions:
- issue: Chủ thể và trách nhiệm trong việc hành quyết Chúa Giê-xu
  choice: 'Giữ cấu trúc chủ động: “rồi đóng đinh Ngài vào thập tự giá.”'
  alternative: “rồi cho đóng đinh Ngài vào thập tự giá.”
  rationale: Bản Hy Lạp dùng động từ chủ động số nhiều với các thượng tế và những người lãnh đạo làm chủ thể, qua đó quy trách nhiệm cho họ, dù việc hành quyết trong lịch sử do nhà cầm quyền La Mã thực hiện. Không nên âm thầm đổi sang cấu trúc sai khiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-xu và “thượng tế” cho giới lãnh đạo tư tế. Giữ quan hệ nối tiếp với câu trước qua “và thể nào”.
