review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: hai người thuộc nhóm lớn hơn, đang trên đường đến một làng, cách Giê-ru-sa-lem sáu mươi sta-đi-ôn, tên là Em-ma-út. Tuy nhiên, “cũng trong ngày ấy” thêm sắc thái ‘cũng/also’ không có trong ἐν αὐτῇ τῇ ἡμέρᾳ; cụm này nhấn mạnh ‘chính/đúng ngày ấy’.'
