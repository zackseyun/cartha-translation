  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: vi
  text: Và kìa, chính trong ngày ấy, hai người trong số họ đang đi đến một làng tên là Em-ma-út, cách Giê-ru-sa-lem sáu mươi sta-đi-ôn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sta-đi-ôn là một đơn vị đo chiều dài thời cổ; sáu mươi sta-đi-ôn tương đương khoảng 11 ki-lô-mét.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của dấu hiệu trần thuật Hy Lạp; lược từ nối Καί để câu tiếng Việt tự nhiên, vì “Và kìa” dễ mang sắc thái dịch sát cứng.
- source_word: δύο ἐξ αὐτῶν
  choice: có hai người trong số họ
  rationale: Diễn đạt tự nhiên cấu trúc bộ phận, không xác định thêm họ là ai ngoài điều văn mạch cho biết.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: cũng trong ngày ấy
  rationale: “Ngày ấy” giữ liên hệ với biến cố vừa kể, còn “cũng” truyền đạt sắc thái nhấn mạnh của αὐτῇ mà không làm câu quá nặng.
- source_word: ἦσαν πορευόμενοι
  choice: đang đi
  rationale: Thể hiện hành động đang tiếp diễn trong quá khứ của cấu trúc vị ngữ vòng imperfect.
- source_word: εἰς κώμην
  choice: đến một làng
  rationale: κώμη chỉ một làng; “đến” phù hợp tự nhiên với chuyển động hướng tới địa điểm.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: cách Giê-ru-sa-lem sáu mươi sta-đi-ôn
  rationale: Giữ đơn vị đo cổ trong chính văn để minh bạch với nguồn, đồng thời giải thích khoảng cách hiện đại ở chú thích.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: tên là Em-ma-út
  rationale: Tái hiện rõ cấu trúc nói tên của làng bằng cách diễn đạt gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Kìa” để bảo toàn dấu hiệu thu hút chú ý của lời kể; phiên âm các địa danh và đơn vị cổ có gạch nối theo lối quen thuộc trong văn bản Kinh Thánh tiếng Việt.
