revisions:
- from: Kìa, cũng trong ngày ấy, có hai người trong số họ đang đi đến một làng tên là Em-ma-út, cách Giê-ru-sa-lem sáu mươi sta-đi-ôn.[a]
  to: Và kìa, chính trong ngày ấy, hai người trong số họ đang đi đến một làng tên là Em-ma-út, cách Giê-ru-sa-lem sáu mươi sta-đi-ôn.[a]
  rationale: Chỉ sửa “cũng” thành “chính” để phản ánh đúng lực nhấn mạnh của nguyên ngữ mà không đưa thêm ý nghĩa. Thêm “Và” để giữ từ nối Καὶ; các yếu tố còn lại và chú thích được giữ nguyên vì đã trung thành với bản SBLGNT và tự nhiên trong tiếng Việt hiện đại.
