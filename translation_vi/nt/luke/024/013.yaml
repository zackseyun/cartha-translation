  terminology: “Làng,” “Em-ma-út,” “Giê-ru-sa-lem,” và “sta-đi-ôn” nhất quán với lối phiên âm Kinh Thánh tiếng Việt. Chú thích giải thích đơn vị cổ cách thích hợp; khoảng 11 ki-lô-mét là xấp xỉ hợp lý cho sáu mươi sta-đi-ôn.
