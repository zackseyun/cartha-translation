revisions:
- from: 'Một người trong họ tên là Cơ-lê-ô-pa đáp lời Người: “Chẳng lẽ ông là người duy nhất đang tạm trú tại Giê-ru-sa-lem mà không biết những việc đã xảy ra ở đó trong những ngày này sao?”'
