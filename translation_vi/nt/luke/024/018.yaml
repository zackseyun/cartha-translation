source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: vi
  text: 'Bấy giờ, một người trong số họ, tên là Cơ-lê-ô-pa, đáp lời ông: “Ông là người duy nhất ở tạm[a] tại Giê-ru-sa-lem mà không biết những việc đã xảy ra ở đó trong mấy ngày nay sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ở như một người khách lạ” hoặc “cư trú như người ngoài.” Động từ Hy Lạp hàm ý cư trú với tư cách người ngoài hay người ở tạm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: đáp lời
  rationale: Phân từ ἀποκριθείς mở đầu lời đáp; tiếng Việt tự nhiên có thể gộp vào động từ chính. δέ là liên từ nhẹ và không cần dịch riêng khi mạch kể đã rõ.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: Một người trong họ tên là Cơ-lê-ô-pa
  rationale: εἷς chỉ một trong hai môn đồ theo ngữ cảnh; ὀνόματι giới thiệu tên người. Cách diễn đạt này rõ ràng và tự nhiên trong tiếng Việt.
- source_word: εἶπεν πρὸς αὐτόν
  choice: đáp lời Người
  rationale: Gộp ý 'nói với người ấy' vào công thức 'đáp lời Người' để tránh lặp động từ mà vẫn giữ đối tượng đại từ của bản Hy Lạp; viết hoa 'Người' theo văn phong Kinh Thánh tiếng Việt, không thêm tên riêng.
- source_word: Σὺ μόνος
  choice: Chẳng lẽ ông là người duy nhất
  rationale: μόνος nhấn mạnh tính duy nhất. Cấu trúc 'Chẳng lẽ... sao?' truyền đạt sắc thái ngạc nhiên của câu hỏi, còn 'ông' phù hợp với lời nói trực tiếp giữa những người chưa nhận ra nhau.
- source_word: παροικεῖς
  choice: đang tạm trú tại
  rationale: παροικέω mang nghĩa cư trú như người ngoài hoặc người ở tạm. 'Tạm trú' giữ được sắc thái cư ngụ không thường xuyên rõ hơn 'đến thăm'.
- source_word: Ἰερουσαλὴμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng tên địa danh quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: οὐκ ἔγνως
  choice: không biết
  rationale: Dù động từ ở thì aorist, trong câu hỏi này nó diễn tả tình trạng không hay biết về các biến cố mới xảy ra; 'không biết' là tự nhiên và chính xác.
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: những việc đã xảy ra ở đó
  rationale: Giữ ý của phân từ danh hóa và quy chiếu αὐτῇ về Giê-ru-sa-lem bằng trạng từ tự nhiên trong tiếng Việt.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: trong những ngày này
  rationale: Bám sát thành ngữ thời gian của bản Hy Lạp, chỉ các ngày ngay trước cuộc trò chuyện.
theological_decisions:
- issue: Đối tượng của đại từ αὐτόν
  choice: Giữ đại từ 'Người' thay vì thêm tên 'Đức Giê-su'
  alternative: đáp lời Đức Giê-su
  rationale: Bản Hy Lạp dùng đại từ; giữ đại từ tránh bổ sung sự xác định không có ngay trong câu, dù ngữ cảnh cho biết đó là Đức Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ sắc thái người ngoài hoặc người ở tạm của παροικεῖς bằng 'tạm trú', đồng thời dùng câu hỏi 'Chẳng lẽ... sao?' để thể hiện sự kinh ngạc tự nhiên.
