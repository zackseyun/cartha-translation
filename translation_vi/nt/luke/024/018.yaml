  rationale: Bản sửa làm rõ quan hệ “một người trong số họ”, tránh thêm sắc thái phản vấn không cần thiết, và dùng cách diễn đạt hiện đại hơn cho khoảng thời gian gần đây. Chú thích gắn với “ở tạm” bảo toàn sắc thái của παροικεῖς theo nguyên ngữ.
