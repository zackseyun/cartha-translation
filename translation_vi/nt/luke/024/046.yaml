  terminology: «Đấng Mê-si» truyền đạt tốt chức năng tước hiệu của Χριστός; «sống lại» giữ thể chủ động của ἀναστῆναι. «Từ cõi chết» là cách nói Việt ngữ thông dụng; chú thích cung cấp phương án sát chữ cần thiết.
