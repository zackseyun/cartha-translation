id: LUK.24.46
reference: Luke 24:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: vi
  text: 'Ngài nói với họ: “Có lời chép như sau: Đấng Mê-si[a] sẽ chịu đau khổ và sống lại từ cõi chết[b] vào ngày thứ ba.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Christ.” Từ Hy Lạp Χριστός ở đây là tước hiệu chỉ Đấng được xức dầu.
    reason: alternative_reading
  - marker: b
    text: 'Dịch sát hơn: “từ giữa những người chết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: Có lời chép
  rationale: Đây là công thức dẫn Kinh Thánh ở thể hoàn thành bị động, diễn tả điều đã được chép và vẫn có hiệu lực. “Có lời chép” tự nhiên, trang trọng và quen thuộc trong tiếng Việt.
- source_word: παθεῖν
  choice: sẽ chịu đau khổ
  rationale: Động từ nguyên mẫu nêu nội dung của lời đã chép. “Sẽ” diễn đạt tự nhiên nội dung mang tính tiên báo mà không thêm sắc thái bắt buộc vốn không được biểu thị rõ bằng từ ngữ trong mệnh đề này.
- source_word: τὸν χριστόν
  choice: Đấng Mê-si
  rationale: Mạo từ cho thấy Χριστός được dùng như một tước hiệu. “Đấng Mê-si” giữ được bối cảnh Do Thái và ý nghĩa Đấng được xức dầu.
- source_word: ἀναστῆναι
  choice: sống lại
  rationale: Đây là động từ nguyên mẫu chủ động được dùng theo nghĩa nội động. “Sống lại” giữ đúng dạng chủ động, thay vì đổi thành “được làm cho sống lại”.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt về sự phục sinh; cách dịch sát hơn “từ giữa những người chết” được ghi ở chú thích.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: đến ngày thứ ba
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, phản ánh sở cách chỉ thời điểm trong tiếng Hy Lạp.
- source_word: οὕτως
  choice: như sau
  rationale: Trong công thức giới thiệu nội dung được chép, “như sau” chuyển tải tự nhiên ý nghĩa của οὕτως và hướng người đọc đến mệnh đề tiếp theo.
- source_word: ὅτι
  choice: ':'
  rationale: Sau động từ nói, dấu hai chấm giới thiệu trực tiếp nội dung lời nói một cách tự nhiên trong tiếng Việt mà không làm mất chức năng dẫn nội dung của ὅτι.
theological_decisions:
- issue: Cách dịch Χριστός trong phần tóm lược về thương khó và phục sinh
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Từ này hoạt động như một tước hiệu chứ không như thành phần tên riêng; “Đấng Mê-si” giữ rõ nền tảng Kinh Thánh Do Thái và ý niệm Đấng được xức dầu.
- issue: Thể của động từ phục sinh ἀναστῆναι
  choice: sống lại từ cõi chết
  alternative: được làm cho sống lại từ cõi chết
  rationale: Bản Hy Lạp dùng dạng chủ động, nên bản dịch chính giữ cách nói chủ động. Những chỗ khác trong Tân Ước có thể nói Đức Chúa Trời khiến Chúa Giê-su sống lại, nhưng không nên đưa thể bị động ấy vào câu này.
- issue: Sắc thái của παθεῖν
  choice: sẽ chịu đau khổ
  alternative: phải chịu đau khổ
  rationale: Nguyên văn không có một động từ tình thái riêng biểu thị sự bắt buộc trong mệnh đề này. “Sẽ” giữ sắc thái của nội dung được chép trước mà không loại bỏ ý nghĩa thần học về chương trình của Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su theo ngữ cảnh; “Có lời chép như sau” giữ sắc thái dẫn Kinh Thánh mà vẫn tự nhiên trong tiếng Việt. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
