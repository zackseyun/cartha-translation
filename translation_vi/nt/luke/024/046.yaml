revisions:
- from: 'Ngài nói với họ: “Có lời chép như sau: Đấng Mê-si[a] sẽ chịu đau khổ và đến ngày thứ ba sống lại từ cõi chết[b].”'
  to: 'Ngài nói với họ: “Có lời chép như sau: Đấng Mê-si[a] sẽ chịu đau khổ và sống lại từ cõi chết[b] vào ngày thứ ba.”'
  rationale: Chỉ đổi «đến ngày thứ ba» thành «vào ngày thứ ba» để biểu đạt chính xác hơn trạng ngữ chỉ thời điểm trong nguyên văn, không thay đổi ý nghĩa hay các lựa chọn thuật ngữ của bản dịch.
