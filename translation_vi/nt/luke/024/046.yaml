  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: công thức γέγραπται, tước hiệu τὸν χριστόν, hai nguyên mẫu «chịu đau khổ» và «sống lại», cùng thời điểm ngày thứ ba. Tuy nhiên, «đến ngày thứ ba» có thể gợi ý một mốc hạn định hoặc diễn tiến đến ngày ấy; τῇ τρίτῃ ἡμέρᾳ chỉ thời điểm «vào ngày thứ ba».'
