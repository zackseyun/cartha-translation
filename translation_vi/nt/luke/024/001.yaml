  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: vi
  text: Nhưng vào ngày thứ nhất trong tuần[a], lúc tảng sáng, họ đến ngôi mộ, mang theo các hương liệu họ đã chuẩn bị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “vào ngày thứ nhất của các ngày Sa-bát”; đây là một thành ngữ có nghĩa là ngày thứ nhất trong tuần.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Nhưng vào ngày thứ nhất trong tuần
  rationale: Cụm từ Hy Lạp là một thành ngữ Semit/Koine chỉ ngày đầu tuần. Cách dịch này truyền đạt đúng nghĩa thời gian trong tiếng Việt hiện đại, còn chú thích bảo lưu hình thức sát chữ.
- source_word: ὄρθρου βαθέως
  choice: lúc tảng sáng
  rationale: Cụm này nhấn mạnh thời điểm rất sớm khi bình minh vừa bắt đầu. “Lúc tảng sáng” tự nhiên, trang trọng và giữ được sắc thái sớm tinh mơ mà không dùng cách nói gượng ép.
- source_word: ἐπὶ τὸ μνῆμα
  choice: đến ngôi mộ
  rationale: Với động từ chỉ chuyển động, ἐπί diễn tả hướng đến nơi chốn; μνῆμα trong bối cảnh mai táng phù hợp với “ngôi mộ”.
- source_word: ἦλθον
  choice: họ đến
  rationale: Động từ aorist thuật lại việc họ đi tới và có mặt tại ngôi mộ; “đến” là cách kể tự nhiên trong tiếng Việt.
- source_word: φέρουσαι
  choice: mang theo
  rationale: Phân từ diễn tả hành động đồng thời với việc đến; “mang theo” thể hiện rõ họ đem hương liệu cùng mình.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: các hương liệu đã chuẩn bị
  rationale: ἀρώματα là các chất thơm dùng trong việc mai táng. Trật tự tiếng Việt tự nhiên đặt danh từ trước mệnh đề quan hệ được lược gọn.
theological_decisions:
- issue: Thành ngữ thời gian τῇ μιᾷ τῶν σαββάτων trong trình thuật phục sinh
  choice: vào ngày thứ nhất trong tuần
  alternative: vào ngày thứ nhất của các ngày Sa-bát
  rationale: Dịch theo nghĩa thành ngữ thông thường, tránh khiến độc giả suy ra một lập trường lịch pháp hoặc hệ phái mà câu Hy Lạp không đòi hỏi; dạng sát chữ được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Lúc tảng sáng” giữ sắc thái rất sớm của ὄρθρου βαθέως; “hương liệu” phù hợp với bối cảnh chuẩn bị mai táng.
