  source_fidelity: Bản dịch truyền đạt đúng thành ngữ χρονικό τῇ μιᾷ τῶν σαββάτων là “ngày thứ nhất trong tuần”, hướng chuyển động đến mộ, và việc họ mang hương liệu. Tuy nhiên, cụm “các hương liệu đã chuẩn bị” không còn nêu rõ chủ thể “họ” đã chuẩn bị, trong khi ἃ ἡτοίμασαν xác định điều này.
  naturalness: Văn phong tự nhiên, hiện đại và phù hợp văn cảnh tường thuật trang trọng. “Lúc tảng sáng” diễn đạt tốt thời điểm rất sớm của ὄρθρου βαθέως.
  terminology: “Ngôi mộ” phù hợp với μνῆμα trong văn cảnh an táng; “hương liệu” phù hợp với ἀρώματα. Chú thích bảo lưu cách đọc sát chữ của thành ngữ mà không áp đặt một cách hiểu lịch pháp.
