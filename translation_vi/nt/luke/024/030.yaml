id: LUK.24.30
reference: Luke 24:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: vi
  text: Khi đang ngồi dùng bữa với họ,[a] Đức Giê-su cầm lấy bánh, chúc phước, rồi bẻ ra và bắt đầu trao cho họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn mô tả Đức Giê-su nằm nghiêng tại bàn cùng họ, theo cách dùng bữa thời xưa.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đang trao cho họ.” Thì chưa hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh hành động đang tiếp diễn; “bắt đầu trao” nhấn mạnh lúc hành động khởi sự trong mạch truyện.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: Khi
  rationale: Công thức chuyển tiếp tự sự của Lu-ca được diễn đạt tự nhiên bằng mệnh đề thời gian tiếng Việt; không dùng lối cổ như “và chuyện xảy ra là”, nhưng vẫn giữ sự chuyển cảnh qua cấu trúc “Khi...”.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: đang ngồi dùng bữa với họ
  rationale: Cụm nguyên mẫu có quán từ với ἐν mang nghĩa thời gian. κατακλίνω chỉ tư thế nằm nghiêng khi ăn theo tập tục cổ; “ngồi dùng bữa” là cách nói tiếng Việt tự nhiên, còn chi tiết văn hóa được giữ trong chú thích.
- source_word: λαβὼν τὸν ἄρτον
  choice: cầm lấy bánh
  rationale: Chuyển phân từ thành động từ hữu hạn để câu tiếng Việt trôi chảy và giữ đúng trình tự hành động. Trong tiếng Việt, “bánh” tự nhiên hơn “cái bánh” hay “ổ bánh” khi loại bánh không được xác định.
- source_word: εὐλόγησεν
  choice: chúc phước
  rationale: Giữ nghĩa của εὐλογέω là đọc lời chúc phước trong bối cảnh bữa ăn, không đổi thành “tạ ơn” vốn nghiêng về một động từ Hy Lạp khác.
- source_word: κλάσας
  choice: rồi bẻ ra
  rationale: Diễn đạt hành động xảy ra trước động từ chính và giữ chuỗi hành động rõ ràng, tự nhiên trong tiếng Việt.
- source_word: ἐπεδίδου
  choice: bắt đầu trao cho họ
  rationale: Thể chưa hoàn thành có thể nhấn mạnh hành động đang tiếp diễn hoặc sự khởi đầu của hành động. “Bắt đầu trao” phù hợp diễn tiến của cảnh nhưng không loại bỏ cách hiểu tiếp diễn, được nêu trong chú thích.
theological_decisions:
- issue: Những hàm ý có thể liên quan đến Tiệc Thánh trong chuỗi hành động tại bàn ăn
  choice: Dùng ngôn ngữ bữa ăn thông thường, không diễn giải hành động này như một nghi lễ trong chính văn
  alternative: Dùng cách diễn đạt gợi trực tiếp hơn đến Tiệc Thánh
  rationale: Chuỗi hành động “cầm lấy—chúc phước—bẻ—trao” có thể gợi lại các trình thuật bữa ăn khác, nhưng câu này không minh nhiên xác định đây là một nghi lễ. Bản dịch giữ nguyên các hành động mà không thêm cách hiểu hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; tránh lối văn cổ và tránh thuật ngữ mang màu sắc hệ phái.
