  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: vi
  text: Và họ luôn ở trong đền thờ, chúc tụng[a] Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ca ngợi.” Động từ Hy Lạp ở đây được dịch là “chúc tụng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ đơn giản nối câu kết này với diễn tiến ngay trước đó.
- source_word: ἦσαν διὰ παντός
  choice: họ luôn ở
  rationale: Kết hợp thể chưa hoàn thành của ἦσαν với thành ngữ διὰ παντός để diễn đạt trạng thái kéo dài và thường xuyên bằng tiếng Việt tự nhiên.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong; “đền thờ” là cách dịch chuẩn, gọn và phù hợp ngữ cảnh.
- source_word: εὐλογοῦντες
  choice: chúc tụng
  rationale: “Chúc tụng” vừa giữ sát nghĩa căn bản của εὐλογέω vừa là cách nói trang trọng, tự nhiên khi Đức Chúa Trời là đối tượng; “ca ngợi” vẫn là một khả năng theo ngữ cảnh.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Đây là tân ngữ trực tiếp của εὐλογοῦντες; cách gọi này trang trọng, quen thuộc và không làm thay đổi ý nghĩa của θεός.
theological_decisions:
- issue: Ngôn ngữ thờ phượng trong εὐλογοῦντες τὸν θεόν
  choice: chúc tụng Đức Chúa Trời
  alternative: ca ngợi Đức Chúa Trời
  rationale: Bản dịch chính giữ nét nghĩa trực tiếp của εὐλογέω thay vì đồng nhất hoàn toàn với động từ “ca ngợi”; chú thích ghi nhận cách diễn đạt thay thế tự nhiên theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “luôn ở” để thể hiện tính liên tục mà không tạo cảm giác họ không bao giờ rời khuôn viên đền thờ; đặt dấu chú thích ngay sau từ ngữ mà chú thích giải thích.
