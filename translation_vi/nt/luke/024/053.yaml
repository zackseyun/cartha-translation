  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý chính của câu Hy Lạp: trạng thái kéo dài (ἦσαν), tính liên tục/thường xuyên (διὰ παντός), địa điểm là khu vực Đền Thờ (ἱερόν), và hành động εὐλογοῦντες hướng về Đức Chúa Trời. “Luôn ở” là cách diễn đạt tự nhiên, dù sắc thái có thể hơi tuyệt đối hơn “liên tục/thường xuyên”; trong ngữ cảnh, vẫn chấp nhận được.'
