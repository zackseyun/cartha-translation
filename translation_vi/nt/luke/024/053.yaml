  terminology: '“Chúc tụng Đức Chúa Trời” giữ được lựa chọn từ vựng của εὐλογέω tốt hơn “ca ngợi” trong phần văn bản chính. Tuy nhiên, chú thích hiện nói động từ Hy Lạp “có nghĩa đen là ‘chúc tụng,’” là cách mô tả không chính xác: “chúc tụng” là bản dịch theo ngữ cảnh, không phải một ‘nghĩa đen’ có thể khẳng định như vậy. Chú thích cần được chỉnh để chỉ nêu phương án dịch và nhận diện động từ được dịch.'
