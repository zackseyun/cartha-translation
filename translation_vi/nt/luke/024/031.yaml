id: LUK.24.31
reference: Luke 24:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: vi
  text: Bấy giờ mắt họ được mở ra và họ nhận ra Ngài; rồi Ngài khuất khỏi mắt họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài trở nên vô hình đối với họ” hoặc “Ngài biến mất khỏi tầm mắt họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: được mở ra
  rationale: Giữ thể bị động của động từ Hy Lạp, cho thấy khả năng nhận biết được khai mở chứ không đơn thuần do chính họ tạo nên.
- source_word: οἱ ὀφθαλμοὶ
  choice: mắt họ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc Hy Lạp theo nghĩa đen là “đôi mắt của họ”.
- source_word: ἐπέγνωσαν
  choice: nhận ra
  rationale: Trong bối cảnh Em-ma-út, động từ chỉ việc nhận biết đúng người mà trước đó họ chưa nhận ra; “nhận ra” tự nhiên và chính xác hơn “biết”.
- source_word: ἄφαντος
  choice: khuất khỏi mắt
  rationale: Diễn đạt tự nhiên trạng thái không còn được họ nhìn thấy, mà không xác định cơ chế của sự việc.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: rồi Ngài khuất khỏi mắt họ
  rationale: 'Truyền đạt quan hệ được diễn tả bằng ἀπό: Ngài không còn hiện diện trong tầm nhìn của họ. “Rồi” thể hiện diễn tiến của mệnh đề nối tiếp.'
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu bước phát triển tiếp theo của câu chuyện bằng lối kể trang trọng nhưng dễ hiểu.
theological_decisions:
- issue: Bản chất việc Chúa Giê-su không còn được nhìn thấy
  choice: Ngài khuất khỏi mắt họ
  alternative: Ngài trở nên vô hình đối với họ; Ngài biến mất khỏi họ
  rationale: Cách dịch chính giữ được ý Ngài không còn được họ trông thấy nhưng không khẳng định một cơ chế cụ thể, qua đó bảo tồn sự huyền nhiệm và độ mở của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng làm đại từ tôn kính; “mắt họ được mở ra” giữ hình ảnh và thể bị động của nguyên văn, còn “khuất khỏi mắt họ” tránh cách nói máy móc nhưng không diễn giải quá mức.
