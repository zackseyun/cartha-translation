source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: vi
  text: 'Hãy xem tay và chân tôi: chính tôi đây.[a] Hãy chạm vào tôi và xem, vì một hồn ma[b] không có thịt và xương như các anh thấy nơi tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để biết chính là tôi” hoặc “vì chính tôi đây.” Cụm từ Hy Lạp nhấn mạnh căn tính của người nói.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch sát chữ: “một linh thể.” Từ Hy Lạp là “thần/linh”; trong văn cảnh này có thể chỉ một hồn ma.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: hãy xem
  rationale: Mệnh lệnh kêu gọi các môn đồ trực tiếp quan sát; “hãy xem” tự nhiên, rõ ràng và dùng được cho cả hai lần xuất hiện.
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: tay và chân tôi
  rationale: Chuyển ngữ trực tiếp các bộ phận thân thể, nhấn mạnh sự đồng nhất hữu hình của Chúa Giê-su phục sinh.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: chính là tôi đây
  rationale: Diễn đạt sức nhấn mạnh kết hợp của ἐγώ và αὐτός về chính thân vị của người đang nói, bằng tiếng Việt hiện đại và tự nhiên.
- source_word: ψηλαφήσατέ με
  choice: hãy chạm vào tôi
  rationale: Động từ chỉ việc sờ/chạm để kiểm chứng bằng xúc giác; “chạm vào” trang trọng, tự nhiên hơn “sờ tôi” trong văn cảnh.
- source_word: πνεῦμα
  choice: thần linh
  rationale: Giữ nghĩa trực tiếp về một hữu thể phi vật chất trong sự tương phản với thân thể; chú thích nêu phương án “hồn ma” theo văn cảnh.
- source_word: σάρκα καὶ ὀστέα
  choice: thịt và xương
  rationale: Giữ nguyên ngôn ngữ cụ thể về thân thể, không làm nhẹ đi sự tương phản giữa thân thể hữu hình và thần linh.
- source_word: θεωρεῖτε ἔχοντα
  choice: các anh thấy tôi đang có
  rationale: Chuyển cấu trúc phân từ Hy Lạp thành mệnh đề tiếng Việt tự nhiên, đồng thời giữ sắc thái quan sát trực tiếp.
theological_decisions:
- issue: Lời khẳng định về thực tại thân thể của Chúa Giê-su sau khi sống lại
  choice: Giữ nguyên sự đối lập rõ ràng giữa “thần linh” và “thịt và xương”.
  alternative: Diễn giải theo cách làm nhẹ hoặc giải thích thêm bản chất của thân thể phục sinh.
  rationale: Bản Hy Lạp trực tiếp kêu gọi nhìn và chạm, rồi khẳng định người nói có thịt và xương. Bản dịch giữ nguyên lời chứng thân thể này nhưng không thêm một hệ thống giải thích thần học ngoài câu.
- issue: Quan hệ của ὅτι trong mệnh đề đầu
  choice: 'Dùng dấu hai chấm: “Hãy xem tay và chân tôi: chính là tôi đây.”'
  alternative: “Hãy xem tay và chân tôi, vì chính là tôi đây” hoặc “để biết chính là tôi đây”.
  rationale: Dấu hai chấm bảo toàn khả năng mệnh đề sau nêu nội dung điều họ cần nhận ra, tránh quyết định dứt khoát rằng ὅτι hoàn toàn mang nghĩa nguyên nhân, đồng thời tạo câu tiếng Việt tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “các anh” phù hợp khi Chúa Giê-su nói với nhóm môn đồ; tránh từ cổ “hãy rờ” và tránh thêm lời giải thích giáo phái.
