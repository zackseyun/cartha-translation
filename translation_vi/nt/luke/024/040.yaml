  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: vi
  text: Và sau khi nói điều này[a], Ngài cho họ xem tay và chân mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản không có câu này.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Sau khi
  rationale: Liên từ καὶ kết hợp với phân từ τοῦτο εἰπών tạo mạch kể tiếp nối; tiếng Việt diễn đạt tự nhiên bằng cấu trúc thời gian “Sau khi...”, không cần dịch καὶ thành một từ riêng.
- source_word: τοῦτο εἰπὼν
  choice: Sau khi nói điều này
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách dịch này rõ ràng, tự nhiên và giữ đúng trình tự.
- source_word: ἔδειξεν
  choice: cho ... xem
  rationale: Trong ngữ cảnh này, δείκνυμι có nghĩa làm cho người khác nhìn thấy; “cho họ xem” tự nhiên hơn “chỉ cho họ” và không hàm ý chỉ bằng ngón tay.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ số nhiều cách dữ được diễn đạt tự nhiên trong cấu trúc tiếng Việt “cho họ xem”.
- source_word: τὰς χεῖρας
  choice: tay ... mình
  rationale: Mạo từ Hy Lạp chỉ các bộ phận thân thể của chính Chúa Giê-su; tiếng Việt dùng “mình” ở cuối cụm ghép để thể hiện quan hệ sở hữu mà không nặng nề.
- source_word: τοὺς πόδας
  choice: chân mình
  rationale: πόδας chỉ bàn chân hoặc chân trong ngữ cảnh thân thể; “chân” là cách gọi thông dụng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Tình trạng văn bản của toàn câu
  choice: Đưa câu vào chính văn và ghi chú dị bản
  alternative: Lược bỏ toàn câu
  rationale: SBLGNT đặt toàn câu trong ngoặc vuông, cho thấy mức độ nghi vấn văn bản đáng kể. Vì nguồn được cung cấp vẫn in câu này, bản dịch giữ câu trong chính văn và minh bạch nêu dị bản ở chú thích, không tự ý giải quyết vấn đề văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su trong mạch văn; cấu trúc “cho họ xem tay và chân mình” gọn, tự nhiên và tránh lặp đại từ sở hữu.
