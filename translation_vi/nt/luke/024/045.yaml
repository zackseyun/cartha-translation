  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: vi
  text: Bấy giờ, Ngài mở tâm trí họ để hiểu Kinh Thánh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Ngài khai mở sự hiểu biết của họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “để họ có thể hiểu Kinh Thánh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu diễn tiến kế tiếp trong trình thuật; “Bấy giờ” tự nhiên, trang trọng và súc tích trong tiếng Việt.
- source_word: διήνοιξεν
  choice: mở
  rationale: Giữ nguyên hình ảnh cụ thể của διανοίγω là mở ra, thay vì diễn giải thành “khiến cho có khả năng”.
- source_word: αὐτῶν τὸν νοῦν
  choice: tâm trí họ
  rationale: νοῦς chỉ khả năng nhận thức, hiểu biết. “Tâm trí” vừa tự nhiên trong tiếng Việt vừa giữ được đối tượng cụ thể của động từ “mở”; cũng tránh cách hiểu thuần cảm xúc mà “lòng” có thể gợi ra.
- source_word: τοῦ συνιέναι
  choice: để hiểu
  rationale: Cấu trúc nguyên mẫu có mạo từ có thể biểu đạt mục đích hoặc kết quả; “để hiểu” súc tích và giữ được độ mở ấy trong tiếng Việt.
- source_word: τὰς γραφάς
  choice: Kinh Thánh
  rationale: Trong văn cảnh Lu-ca–Công Vụ, cụm này chỉ các văn bản thánh của Israel; “Kinh Thánh” là cách gọi đã được xác lập và dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất hành động của Chúa Giê-xu khi mở sự hiểu biết
  choice: Giữ cách nói trực tiếp “Ngài mở tâm trí họ” mà không thêm lời giải thích giáo lý.
  alternative: Ngài khiến họ có thể hiểu; Ngài giải thích Kinh Thánh cho họ.
  rationale: Bản Hy Lạp nói trực tiếp rằng Ngài mở tâm trí họ để hiểu Kinh Thánh. Cách dịch này bảo toàn lời khẳng định thần học và hình ảnh của câu, không giản lược hành động ấy thành việc giải thích cũng không áp đặt một hệ thống giáo lý về sự soi sáng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo lối kể tôn kính và “Kinh Thánh” làm danh xưng đã định hình. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
