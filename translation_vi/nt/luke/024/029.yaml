  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: vi
  text: 'Nhưng họ tha thiết nài ép Ngài[a], nói rằng: “Xin ở lại với chúng tôi, vì trời đã về chiều và ngày đã xế rồi.” Ngài vào để ở lại với họ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ cố nài Ngài” hoặc “họ khẩn khoản giữ Ngài lại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: tha thiết nài ép
  rationale: Diễn tả sự nài nỉ mạnh mẽ, khẩn khoản trong thể trung động, nhưng không hàm ý dùng sức ép thể chất.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Xin ở lại với chúng tôi
  rationale: Trong bối cảnh mời khách, “ở lại” là cách nói tự nhiên; “xin” truyền đạt sắc thái lời mời khẩn khoản của mệnh lệnh cách.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: vì trời đã về chiều
  rationale: “Về chiều” diễn đạt tự nhiên hướng tiến đến buổi tối của πρὸς ἑσπέραν, không nhất thiết nói rằng tối đã hẳn.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: ngày đã xế rồi
  rationale: Giữ hình ảnh ngày đang nghiêng, tàn dần của κλίνω bằng một thành ngữ tiếng Việt hiện đại, dễ hiểu.
- source_word: εἰσῆλθεν
  choice: Ngài liền vào
  rationale: Diễn đạt hành động đi vào nơi ở theo lối kể chuyện tự nhiên; “liền” cho thấy diễn tiến sau lời nài mời mà không biến liên từ thành quan hệ nhân quả quá mạnh.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: để ở lại với họ
  rationale: Articular infinitive được hiểu theo mục đích; cách dịch này cũng lặp lại động từ “ở lại” như nguyên văn.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho nhân vật Giê-su trong ngữ cảnh này. Giữ hai vế thời gian gần nguyên văn nhưng diễn đạt bằng các thành ngữ Việt tự nhiên: “trời đã về chiều” và “ngày đã xế rồi”.'
