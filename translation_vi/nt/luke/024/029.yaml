- from: 'Nhưng họ tha thiết nài ép Ngài[a]: “Xin ở lại với chúng tôi, vì trời đã về chiều và ngày đã xế rồi.” Ngài liền vào để ở lại với họ.'
  to: 'Nhưng họ tha thiết nài ép Ngài[a], nói rằng: “Xin ở lại với chúng tôi, vì trời đã về chiều và ngày đã xế rồi.” Ngài vào để ở lại với họ.'
