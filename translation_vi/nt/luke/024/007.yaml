- from: 'rằng: “Con Người phải bị nộp vào tay những kẻ tội lỗi, bị đóng đinh trên thập tự giá, và đến ngày thứ ba phải sống lại.”[a]'
  to: 'rằng: “Con Người phải bị nộp vào tay những kẻ tội lỗi, bị đóng đinh trên thập tự giá, và vào ngày thứ ba sống lại.”[a]'
  rationale: Chỉ điều chỉnh cách diễn đạt mốc thời gian từ «đến ngày thứ ba» thành «vào ngày thứ ba» và không lặp «phải», nhằm phản ánh chính xác hơn dative thời gian τῇ τρίτῃ ἡμέρᾳ và một δεῖ chi phối toàn bộ chuỗi nguyên mẫu. Không thay đổi nghĩa hay thuật ngữ thần học.
  reviewer_model: gpt-5.6-terra
