  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: vi
  text: 'rằng: “Con Người phải bị nộp vào tay những kẻ tội lỗi, bị đóng đinh trên thập tự giá, và vào ngày thứ ba sống lại.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sống lại” dịch một động từ chủ động trong tiếng Hy Lạp, không phải thể bị động “được làm cho sống lại”.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: rằng
  rationale: Phân từ hiện tại nối với công thức nhắc nhớ ở câu trước; trong tiếng Việt, “rằng” dẫn trực tiếp nội dung lời Đức Giê-su đã phán một cách tự nhiên.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh xưng đã quen thuộc, giữ được tính chất tự xưng và âm hưởng liên văn bản của cụm từ.
- source_word: ὅτι δεῖ
  choice: phải
  rationale: “Phải” diễn đạt sự cần thiết trong chương trình của Đức Chúa Trời, chứ không chỉ là một dự báo đơn thuần.
- source_word: παραδοθῆναι
  choice: bị nộp
  rationale: Động từ bị động chỉ việc bị giao nộp vào quyền lực của người khác; “bị phản bội” quá hẹp vì câu này không chỉ nói đến hành động của Giu-đa.
- source_word: εἰς χεῖρας
  choice: vào tay
  rationale: Giữ hình ảnh của thành ngữ Hy Lạp, đồng thời tự nhiên trong tiếng Việt với nghĩa bị đặt dưới quyền người khác.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: những kẻ tội lỗi
  rationale: Cách nói tự nhiên, nghiêm trang, chỉ những người trực tiếp bắt và hành hình Đức Giê-su; không thêm sắc thái giới tính mà tiếng Việt không cần biểu thị ở số nhiều.
- source_word: σταυρωθῆναι
  choice: bị đóng đinh trên thập tự giá
  rationale: Cách diễn đạt chính xác và phổ thông về hình phạt đóng đinh; “trên thập tự giá” làm rõ phương thức hành hình mà không diễn giải quá mức.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: đến ngày thứ ba
  rationale: Diễn đạt thời điểm tự nhiên trong tiếng Việt và giữ nguyên cách tính ngày của nguyên văn.
- source_word: ἀναστῆναι
  choice: sống lại
  rationale: Động từ nguyên mẫu chủ động được giữ bằng cách nói chủ động “sống lại”, không chuyển thành bị động “được làm cho sống lại”.
theological_decisions:
- issue: Sắc thái của δεῖ trong lời báo trước cuộc thương khó
  choice: “phải”, hàm ý sự cần thiết trong chương trình của Đức Chúa Trời
  alternative: “sẽ”, như một dự báo tương lai đơn thuần
  rationale: Trong Lu-ca, δεῖ thường diễn tả điều cần được hoàn tất theo ý định cứu chuộc của Đức Chúa Trời. “Phải” giữ sức nặng ấy mà không giải thích thêm vào bản văn.
- issue: Thể chủ động của ἀναστῆναι
  choice: “sống lại”
  alternative: “được làm cho sống lại”
  rationale: Nguyên văn dùng thể chủ động. Bản dịch giữ hình thức ấy, đồng thời không phủ nhận những chỗ khác trong Tân Ước nói Đức Chúa Trời khiến Đức Giê-su sống lại.
- issue: Cách diễn đạt ἀνθρώπων ἁμαρτωλῶν
  choice: “những kẻ tội lỗi”
  alternative: “những người nam tội lỗi”
  rationale: Danh từ Hy Lạp có hình thái giống đực số nhiều, nhưng tiếng Việt không bắt buộc đánh dấu giới tính; “những kẻ tội lỗi” chuyển tải sự quy chiếu đến các tác nhân cụ thể mà không thêm từ chỉ giới không có tính đối lập rõ trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dấu hai chấm cùng ngoặc kép cho thấy đây là nội dung lời được nhắc lại từ câu trước. Cấu trúc ba vế giữ nhịp của nguyên văn; “phải” được lặp ở vế đầu và vế cuối để câu tiếng Việt rõ nghĩa, trong khi vế giữa cùng nằm dưới phạm vi của sự cần thiết.
