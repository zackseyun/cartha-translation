id: LUK.24.33
reference: Luke 24:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: vi
  text: Ngay lúc ấy, họ đứng dậy, trở về Giê-ru-sa-lem, và thấy Nhóm Mười Một cùng những người ở với họ đã tụ họp[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đã nhóm lại.” Dạng từ Hy Lạp mô tả họ đang ở trong trạng thái đã tụ họp khi được hai môn đồ thấy.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ của ἀνίστημι diễn tả hành động xảy ra trước động từ chính; “đứng dậy” giữ được hành động cụ thể và tự nhiên trong tiếng Việt.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: ngay giờ đó
  rationale: Cụm chỉ thời gian nhấn mạnh chính thời điểm ấy; “ngay giờ đó” vừa giữ mốc thời gian vừa truyền đạt tính tức thời, không giản lược thành trạng từ “lập tức”.
- source_word: ὑπέστρεψαν
  choice: trở về
  rationale: Trong ngữ cảnh hành trình, ὑποστρέφω chỉ việc quay lại nơi trước đó; “trở về” trang trọng, tự nhiên và phù hợp với Giê-ru-sa-lem là đích quay lại.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho địa danh Jerusalem.
- source_word: εὗρον
  choice: thấy
  rationale: Trong cấu trúc εὗρον + đối tượng + phân từ, động từ có nghĩa họ đến nơi và nhận thấy những người ấy trong tình trạng đã tụ họp; “thấy” tự nhiên hơn “tìm thấy” trong văn cảnh này mà không hàm ý họ đang tìm kiếm.
- source_word: ἠθροισμένους
  choice: đã tụ họp
  rationale: Phân từ hoàn thành bị động mô tả trạng thái đã hình thành khi hai môn đồ đến; “đã tụ họp” thể hiện việc cả Nhóm Mười Một lẫn những người đi cùng họ đều đã ở trong một cuộc tập hợp.
- source_word: τοὺς ἕνδεκα
  choice: Nhóm Mười Một
  rationale: Giữ đây là danh xưng quy ước của nhóm môn đồ nòng cốt sau khi Giu-đa vắng mặt, đồng thời không thêm từ “sứ đồ” vốn không xuất hiện trong câu Hy Lạp.
- source_word: τοὺς σὺν αὐτοῖς
  choice: những người ở với họ
  rationale: Dịch sát phạm vi mở của cụm từ, không xác định thêm những người này là ai.
theological_decisions:
- issue: Danh xưng “Nhóm Mười Một” dù số người thực sự có mặt có thể không đúng là mười một
  choice: Giữ danh xưng “Nhóm Mười Một” mà không hài hòa hóa số người hiện diện.
  alternative: “mười một sứ đồ” hoặc “các môn đồ còn lại”
  rationale: τοὺς ἕνδεκα là danh xưng của nhóm; bản dịch không thêm “sứ đồ,” không đổi thành một mô tả rộng hơn, và không giải quyết ngầm vấn đề Tô-ma có mặt hay không.
- issue: Phạm vi bổ nghĩa của ἠθροισμένους
  choice: Cho “đã tụ họp” bổ nghĩa chung cho Nhóm Mười Một và những người ở với họ.
  alternative: Chỉ liên kết “đã tụ họp” với Nhóm Mười Một
  rationale: Cấu trúc Hy Lạp đặt cả hai nhóm dưới động từ “thấy” và phân từ số nhiều, nên trạng thái tụ họp áp dụng tự nhiên cho toàn thể những người được nhắc đến.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đặt dấu chú thích ngay sau “đã tụ họp,” là từ mà chú thích giải thích. Viết hoa “Nhóm Mười Một” để biểu thị danh xưng tập thể, không phải khẳng định chính xác số người đang hiện diện.
