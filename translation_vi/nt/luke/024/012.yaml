  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các hành động chính: Phi-e-rơ đứng dậy, chạy đến mộ, cúi nhìn, thấy các vải liệm, rồi rời đi trong sự kinh ngạc. “Ra về” là cách chuyển ngữ thận trọng, có thể chấp nhận được cho πρὸς ἑαυτόν, vốn không nên bị giải nghĩa thành một lời độc thoại nội tâm.'
