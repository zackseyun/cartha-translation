  terminology: “Phi-e-rơ,” “ngôi mộ,” và “những tấm vải liệm” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích dị bản phản ánh thích đáng việc toàn câu được SBLGNT đánh dấu là có vấn đề văn bản.
