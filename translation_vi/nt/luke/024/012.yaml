id: LUK.24.12
reference: Luke 24:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: vi
  text: Nhưng Phi-e-rơ đứng dậy, chạy đến ngôi mộ. Ông cúi xuống nhìn vào và thấy chỉ có những tấm vải liệm. Rồi ông ra về, vẫn kinh ngạc về điều đã xảy ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản cổ không có câu này.
    reason: SBLGNT đánh dấu toàn bộ Lu-ca 24:12 là đoạn có dị bản đáng kể; chú thích ngắn gọn phản ánh sự không đồng nhất của chứng cứ thủ bản.
lexical_decisions:
- source_word: παρακύψας
  choice: cúi xuống nhìn vào
  rationale: Diễn đạt cả tư thế cúi xuống lẫn hành động nhìn vào bên trong ngôi mộ.
- source_word: τὰ ὀθόνια μόνα
  choice: chỉ có những tấm vải liệm
  rationale: 'Giữ trọng tâm của μόνα: ngoài các tấm vải dùng để liệm xác ra thì không còn gì khác; cách nói này tự nhiên trong tiếng Việt.'
- source_word: βλέπει
  choice: thấy
  rationale: Thì hiện tại lịch sử trong tiếng Hy Lạp làm câu chuyện sống động; tiếng Việt không bắt buộc đánh dấu thì, nên “thấy” vừa tự nhiên vừa không làm mất sắc thái ấy.
- source_word: πρὸς αὑτὸν
  choice: ra về
  rationale: Cụm từ khó xác định này có thể hàm ý trở về nơi của mình hoặc rời đi trong tâm trạng riêng; “ra về” phù hợp ngữ cảnh mà không xác định đích đến quá mức.
- source_word: θαυμάζων
  choice: lòng đầy kinh ngạc
  rationale: Truyền đạt trạng thái kinh ngạc sâu sắc đang tiếp diễn khi Phi-e-rơ rời đi, thay vì đổi nghĩa thành nghi ngờ hay chỉ thắc mắc.
theological_decisions:
- issue: Tình trạng văn bản của toàn câu
  choice: Giữ câu trong chính văn và ghi chú dị bản
  alternative: Lược bỏ câu hoặc đặt toàn câu trong ngoặc
  rationale: SBLGNT in câu này nhưng đánh dấu là một đơn vị có vấn đề văn bản; ghi chú giúp độc giả biết bằng chứng thủ bản không đồng nhất mà không tự ý loại câu khỏi bản dịch.
- issue: Ý nghĩa của πρὸς αὑτόν
  choice: Dịch trung tính là “ra về”
  alternative: “trở về nhà mình” hoặc “vừa đi vừa tự nhủ”
  rationale: Nguyên văn có thể được hiểu theo hơn một cách; bản dịch chính tránh giải quyết dứt khoát sự mơ hồ bằng một đích đến hay một hoạt động nội tâm không được nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” theo lối phiên âm Kinh Thánh quen thuộc; cấu trúc câu ngắn giữ nhịp kể nhanh của nguyên văn.
