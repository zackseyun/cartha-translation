revisions:
- from: Nhưng Phi-e-rơ đứng dậy, chạy đến ngôi mộ. Ông cúi xuống nhìn vào và thấy chỉ có những tấm vải liệm. Rồi ông ra về, lòng đầy kinh ngạc về điều đã xảy ra.[a]
  to: Nhưng Phi-e-rơ đứng dậy, chạy đến ngôi mộ. Ông cúi xuống nhìn vào và thấy chỉ có những tấm vải liệm. Rồi ông ra về, vẫn kinh ngạc về điều đã xảy ra.[a]
  rationale: Chỉ chỉnh nhẹ câu cuối để tiếng Việt tự nhiên hơn và làm rõ rằng sự kinh ngạc vẫn tiếp diễn khi Phi-e-rơ rời đi. Không thay đổi nghĩa, tình trạng dị bản, hay mức độ mơ hồ của πρὸς ἑαυτόν.
