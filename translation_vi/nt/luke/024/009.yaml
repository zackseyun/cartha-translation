  source_fidelity: 'Bản dịch truyền đạt đầy đủ cấu trúc và nội dung của câu Hy Lạp: phân từ giống cái số nhiều được nối tự nhiên với chủ ngữ ngầm “họ”; ἀπὸ τοῦ μνημείου là “từ ngôi mộ”; ἀπήγγειλαν là “thuật lại”; và hai nhóm tiếp nhận được phân biệt rõ: “Nhóm Mười Một” và “tất cả những người còn lại.” Cụm “Sau khi ... trở về” diễn đạt hợp lý tính hoàn tất trước hành động chính của phân từ aorist, mà không thêm nội dung đáng kể.'
  naturalness: Văn câu rõ ràng, hiện đại và có sắc thái trần thuật phù hợp. “Ngôi mộ,” “thuật lại,” và “tất cả những người còn lại” đều tự nhiên trong tiếng Việt chuẩn. “Nhóm Mười Một” là cách diễn đạt dễ hiểu cho danh xưng quy ước trong ngữ cảnh, không cần thêm “sứ đồ.”
  terminology: Các thuật ngữ chính phù hợp với nguyên văn và không áp đặt diễn giải thần học. Viết hoa “Nhóm Mười Một” giúp nhận ra đây là cách gọi xác định của tập thể, đồng thời không mở rộng nguyên văn thành “các sứ đồ.” Không cần chú thích hoặc mỏ neo chú thích cho câu này.
