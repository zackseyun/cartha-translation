id: LUK.24.9
reference: Luke 24:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: vi
  text: Sau khi từ ngôi mộ trở về, họ thuật lại tất cả những điều ấy cho Nhóm Mười Một và tất cả những người còn lại.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Sau khi ... trở về
  rationale: Phân từ bất định chủ động, giống cái số nhiều, chỉ những phụ nữ trong ngữ cảnh trước. Cấu trúc “Sau khi ... trở về” diễn đạt tự nhiên quan hệ thời gian xảy ra trước động từ chính.
- source_word: μνημείου
  choice: ngôi mộ
  rationale: Trong bối cảnh mai táng và phục sinh của Chúa Giê-su, “ngôi mộ” là cách gọi tự nhiên và chính xác về nơi an táng.
- source_word: ἀπήγγειλαν
  choice: thuật lại
  rationale: Động từ có nghĩa báo lại hoặc truyền đạt điều đã biết. “Thuật lại” phù hợp văn kể chuyện và không gợi một lời công bố công khai quá mức.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Giữ được cả đại từ chỉ định ταῦτα và ý nghĩa bao quát của πάντα.
- source_word: τοῖς ἕνδεκα
  choice: Nhóm Mười Một
  rationale: Giữ nguyên cách gọi quy ước của bản Hy Lạp mà không thêm danh từ “sứ đồ”; viết hoa để cho thấy đây là tên gọi của nhóm.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: tất cả những người còn lại
  rationale: Diễn đạt rõ sự phân biệt giữa Nhóm Mười Một và nhóm rộng hơn gồm những người khác đang hiện diện.
theological_decisions:
- issue: Chủ thể của phân từ giống cái số nhiều và động từ số nhiều
  choice: Dùng đại từ “họ”, với sở chỉ là những phụ nữ đã đến ngôi mộ trong ngữ cảnh trước.
  alternative: Nêu rõ “các phụ nữ”.
  rationale: Tiếng Hy Lạp không lặp lại danh từ nhưng hình thái giống cái số nhiều xác định chủ thể theo ngữ cảnh. “Họ” tự nhiên trong tiếng Việt và không thêm một danh từ không có trong câu.
- issue: Danh xưng của nhóm các sứ đồ
  choice: Nhóm Mười Một
  alternative: mười một sứ đồ
  rationale: Nguyên văn chỉ nói “Mười Một”. Không thêm “sứ đồ” giúp giữ sát cách diễn đạt và tránh giải thích ngay trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự câu tiếng Việt làm rõ quan hệ thời gian của phân từ, đồng thời giữ nhịp kể chuyện gọn. Không cần chú thích cho câu này.
