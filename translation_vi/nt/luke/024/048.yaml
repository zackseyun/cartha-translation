base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: vi
  text: Chính anh em là những người làm chứng về những điều này.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chính anh em là nhân chứng của những điều này.” Đại từ chỉ định Hy Lạp nói đến các sự việc Chúa Giê-su vừa đề cập.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: chính anh em
  rationale: Đại từ ngôi thứ hai số nhiều được nêu rõ để nhấn mạnh chủ thể. “Chính anh em” truyền đạt sắc thái nhấn mạnh này một cách tự nhiên trong tiếng Việt.
- source_word: ἐστε
  choice: là
  rationale: Động từ εἰμί ở thì hiện tại, lối trình bày; trong cấu trúc danh từ vị ngữ tiếng Việt, dịch tự nhiên là “là”.
- source_word: μάρτυρες
  choice: những người làm chứng
  rationale: Chỉ những người làm chứng về điều họ đã thấy và nghe. Cách dịch này tự nhiên, rõ nghĩa và không đưa hàm ý tử đạo phát triển về sau vào ngữ cảnh.
- source_word: τούτων
  choice: về những điều này
  rationale: Đại từ chỉ định số nhiều ở sở hữu cách quy chiếu về các sự việc Chúa Giê-su vừa nói đến. Giới từ “về” diễn đạt tự nhiên quan hệ nội dung của lời chứng trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa vai trò μάρτυρες của các môn đồ
  choice: Câu này xác định các môn đồ là những người làm chứng về các sự việc vừa được thuật lại.
  alternative: Có thể hiểu từ này mang thêm âm hưởng về sự tử đạo theo cách dùng Kitô giáo về sau.
  rationale: Trong ngữ cảnh trực tiếp, Chúa Giê-su nói đến việc chịu khổ, sống lại và sứ điệp sẽ được công bố. Vì vậy, nghĩa chính là làm chứng; bản dịch không áp đặt nghĩa tử đạo phát triển về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời Chúa Giê-su trực tiếp nói với nhóm môn đồ; “chính” bảo toàn nét nhấn mạnh của đại từ ὑμεῖς.
