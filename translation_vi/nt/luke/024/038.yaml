revisions:
- from: 'Ngài phán với họ: “Sao các con bối rối, và tại sao những mối nghi ngờ lại nổi lên trong lòng các con?[a]”'
  to: 'Ngài nói với họ: “Vì sao anh em bối rối, và vì sao những nghi ngờ nổi lên trong lòng anh em?”[a]'
  rationale: Bản sửa giữ nguyên nội dung và độ mơ hồ từ vựng của διαλογισμοί qua chú thích, đồng thời dùng lối xưng hô không thêm sắc thái quan hệ ngoài nguyên ngữ, làm cân đối hai câu hỏi, và giản lược cụm danh từ cho tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:14Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng hai câu hỏi nguyên ngữ, trạng thái bị xao động của τεταραγμένοι, và hình ảnh các suy nghĩ/hoài nghi «nổi lên» trong lòng. Tuy nhiên, «các con» thêm một sắc thái quan hệ thân-tôn không được biểu thị bởi đại từ số nhiều ὑμῶν và không phù hợp nhất với cách Chúa Giê-su đang nói với một nhóm môn đồ trưởng thành trong văn cảnh này.
  naturalness: «Sao ... và tại sao ...» có thể hiểu được, nhưng sự xen lẫn hai cách hỏi làm câu kém cân đối. «Vì sao ... và vì sao ...» vừa tự nhiên vừa phản chiếu phép song hành τί ... καὶ διὰ τί của tiếng Hy Lạp. «Những nghi ngờ» tự nhiên, gọn hơn «những mối nghi ngờ».
  terminology: Giữ «Ngài», «lòng», và «nổi lên» là phù hợp với văn phong Kinh Thánh hiện đại và phạm vi nghĩa của καρδία. Đổi ngôi xưng hô thành «anh em» để không áp đặt quan hệ cha-con và vẫn là cách gọi trực tiếp tự nhiên đối với các môn đồ.
  issues:
  - severity: medium
    issue: «các con» là lựa chọn xưng hô mang sắc thái diễn giải
    rationale: Nguyên ngữ chỉ dùng đại từ ngôi hai số nhiều, không có danh xưng tương ứng với «con». Trong tiếng Việt, «các con» đặc biệt gợi quan hệ bậc trên với con cái; «anh em» trung tính hơn trong ngữ cảnh nói với các môn đồ.
  - severity: low
    issue: Cách hỏi không song hành và danh ngữ hơi nặng
    rationale: «Sao ... và tại sao ...» trộn hai cách diễn đạt trong một cặp câu hỏi song song; «những mối nghi ngờ» dài hơn cần thiết. Điều chỉnh giúp văn phong hiện đại, sáng rõ mà không đổi nghĩa.
