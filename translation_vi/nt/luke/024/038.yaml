  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: vi
  text: 'Ngài nói với họ: “Vì sao anh em bối rối, và vì sao những nghi ngờ nổi lên trong lòng anh em?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những ý nghĩ” hoặc “những suy luận” thay cho “những nghi ngờ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί τεταραγμένοι ἐστέ
  choice: Sao các con bối rối
  rationale: Τί trong cấu trúc này hỏi về nguyên nhân, nên dịch tự nhiên là “sao/tại sao”; τεταραγμένοι diễn tả trạng thái đang bị xao động, hoang mang. “Bối rối” truyền đạt rõ sự bất an nội tâm mà không cường điệu.
- source_word: διαλογισμοὶ
  choice: những mối nghi ngờ
  rationale: Danh từ có thể chỉ các ý nghĩ, sự suy luận hay chất vấn nội tâm; trong ngữ cảnh các môn đồ chưa tin chắc về điều họ đang thấy, “những mối nghi ngờ” phù hợp, đồng thời chú thích giữ lại độ rộng từ vựng.
- source_word: ἀναβαίνουσιν
  choice: nổi lên
  rationale: Nghĩa đen là “đi lên”; khi nói về hoạt động nội tâm, “nổi lên” vừa tự nhiên vừa giữ được hình ảnh của nguyên ngữ.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: trong lòng các con
  rationale: καρδίᾳ ở số ít với đại từ sở hữu số nhiều mang tính phân phối. Tiếng Việt dùng “lòng các con” tự nhiên, áp dụng cho cả nhóm mà không thu hẹp ý nghĩa vào cảm xúc בלבד.
- source_word: αὐτοῖς
  choice: với họ / các con
  rationale: Lời dẫn dùng “với họ” cho đại từ ngôi ba; trong lời nói trực tiếp, “các con” diễn đạt quan hệ của Chúa Giê-su với nhóm môn đồ bằng lối xưng hô tự nhiên, trang trọng và dễ hiểu.
theological_decisions:
- issue: Phạm vi nghĩa của καρδία
  choice: lòng
  alternative: tâm trí; con tim
  rationale: Trong nhân học Kinh Thánh, καρδία bao gồm tư tưởng, ý chí và cảm xúc. “Lòng” trong tiếng Việt giữ được phạm vi nội tâm rộng ấy; “tâm trí” quá thiên về nhận thức, còn “con tim” dễ bị hiểu chủ yếu theo cảm xúc.
- issue: Sắc thái của διαλογισμοί
  choice: những mối nghi ngờ
  alternative: những ý nghĩ; những suy luận
  rationale: Ngữ cảnh phục sinh cho thấy đây là những suy nghĩ mang tính hoài nghi hoặc chất vấn. Bản dịch chính thể hiện sắc thái ngữ cảnh nhưng chú thích không xóa bỏ các nghĩa từ vựng rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “các con” trong lời trực tiếp để thể hiện quan hệ với các môn đồ; giữ hình ảnh “nổi lên trong lòng” của nguyên ngữ.
