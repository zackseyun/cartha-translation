    text: 'Cũng có thể dịch: “chuyện vô lý” hoặc “lời mê sảng.” Từ Hy Lạp λῆρος chỉ lời nói bị coi là vô nghĩa, phi lý, hoặc nhảm nhí.'
    reason: lexical_alternative
  revision_rationale: Sửa các liên từ để không thêm sắc thái tương phản hoặc hệ quả ngoài nguyên văn, đồng thời điều chỉnh cách dịch λῆρος theo nghĩa chính của từ. Bản sửa vẫn giữ nhận định này là góc nhìn của những người nghe, không khẳng định các lời ấy thực sự nhảm nhí.
