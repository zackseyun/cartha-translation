base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: vi
  text: Đối với họ, những lời ấy dường như là chuyện nhảm nhí[a], và họ không tin các bà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chuyện vô lý” hoặc “lời mê sảng.” Từ Hy Lạp λῆρος chỉ lời nói bị coi là vô nghĩa, phi lý, hoặc nhảm nhí.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  choice: đối với họ dường như
  rationale: Trong kết cấu đánh giá này, ἐφάνησαν mang nghĩa “dường như”, còn ἐνώπιον αὐτῶν nêu góc nhìn của họ; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ὡσεὶ λῆρος
  choice: là chuyện vô lý
  rationale: Giữ sắc thái so sánh của ὡσεὶ qua “dường như là”, và diễn đạt λῆρος là lời nói bị xem là thiếu ý nghĩa hoặc phi lý.
- source_word: τὰ ῥήματα ταῦτα
  choice: những lời ấy
  rationale: Bám sát cụm danh từ Hy Lạp, đồng thời dùng cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἠπίστουν
  choice: không tin
  rationale: Diễn đạt trực tiếp sự không tin đang tiếp diễn trong quá khứ mà không thêm sắc thái cố ý khước từ.
- source_word: αὐταῖς
  choice: các bà
  rationale: Đại từ giống cái số nhiều chỉ những phụ nữ trong văn cảnh; nêu rõ giới tính giúp tiếng Việt xác định đúng đối tượng mà không thêm nhân vật mới.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang nghiêm. “Các bà” phù hợp để chỉ nhóm phụ nữ đã được nhắc đến; “chuyện vô lý” chuyển tải đánh giá của những người nghe mà không khẳng định bản thân lời thuật là sai.
