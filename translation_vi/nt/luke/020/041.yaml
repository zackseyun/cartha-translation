  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với họ: “Sao người ta lại nói Đấng Mê-si[a] là con của Đa-vít[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Đấng Ki-tô.” Tước hiệu Hy Lạp Χριστός ở đây chỉ vị vua giải cứu thuộc dòng Đa-vít mà dân mong đợi.
    reason: alternative_reading
  - marker: b
    text: 'Nguyên văn: “con Đa-vít”; cũng có thể hiểu là “một người con của Đa-vít” hoặc “Con Đa-vít.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ chuyển ý nhẹ; “Nhưng” phù hợp với việc Đức Giê-su chuyển sang nêu một câu hỏi thách thức.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc chỉ người được nói với.
- source_word: Πῶς
  choice: Sao
  rationale: Trong câu hỏi chất vấn, “Sao” tự nhiên, dễ hiểu và truyền đạt ý hỏi về cơ sở hoặc tính hợp lý của lời khẳng định.
- source_word: λέγουσιν
  choice: người ta lại nói
  rationale: Chủ ngữ số nhiều không xác định được chuyển thành “người ta”; “lại” làm rõ sắc thái chất vấn trong văn cảnh mà không xác định thêm chủ thể.
- source_word: τὸν χριστόν
  choice: Đấng Mê-si
  rationale: Χριστός được dùng như tước hiệu của vị vua giải cứu thuộc dòng Đa-vít mà dân đang mong đợi; “Đấng Mê-si” thể hiện rõ nghĩa ấy.
- source_word: εἶναι
  choice: là
  rationale: Động từ nguyên mẫu trong lời nói gián tiếp được chuyển tự nhiên thành mệnh đề với “là” trong tiếng Việt.
- source_word: Δαυὶδ υἱόν
  choice: con của Đa-vít
  rationale: Giữ sát cấu trúc sở hữu và ngôn ngữ quan hệ cha-con, nhưng không áp đặt tính xác định hay biến cụm này thành một danh hiệu cố định.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Văn cảnh tập trung vào vị vua giải cứu được mong đợi thuộc dòng Đa-vít, nên “Đấng Mê-si” làm nổi bật nghĩa tước hiệu mà không biến từ này thành tên riêng.
- issue: Ngôn ngữ về quan hệ với Đa-vít
  choice: con của Đa-vít
  alternative: một người con của Đa-vít; Con Đa-vít
  rationale: Cách dịch này bảo toàn lời khẳng định về dòng dõi mà Đức Giê-su sắp chất vấn, đồng thời không tự ý xác định mạo từ hoặc viết hoa thành một danh hiệu không được biểu thị rõ trong tiếng Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi phổ biến trong tiếng Việt; giữ câu hỏi ngắn gọn và sắc thái chất vấn, đồng thời bảo toàn sự căng thẳng thần học sẽ được triển khai trong các câu tiếp theo.
