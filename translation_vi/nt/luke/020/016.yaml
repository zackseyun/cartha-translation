id: LUK.20.16
reference: Luke 20:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: vi
  text: 'Người ấy sẽ đến, tiêu diệt những tá điền này[a], rồi giao vườn nho cho những người khác.” Nghe vậy, họ nói: “Mong sao điều ấy đừng bao giờ xảy ra![b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người làm vườn” hoặc “những người thuê vườn”; từ Hy Lạp chỉ những người canh tác đất thuộc về người khác.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Không thể như vậy được!” hoặc “Tuyệt đối không!” Cụm từ Hy Lạp bày tỏ sự bác bỏ mạnh mẽ; sát nghĩa là “Mong điều ấy đừng xảy ra.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Người ấy sẽ đến
  rationale: Động từ ở thì tương lai nói về chủ vườn trong dụ ngôn. “Sẽ đến” diễn đạt tự nhiên mà không thêm ý “trở lại,” vốn không được nói rõ trong nguyên văn.
- source_word: ἀπολέσει
  choice: tiêu diệt
  rationale: ἀπόλλυμι có thể mang nghĩa tiêu diệt, giết hoặc làm cho hư mất. “Tiêu diệt” giữ được mức độ nghiêm trọng của sự phán xét mà không thu hẹp nghĩa quá mức.
- source_word: γεωργοὺς
  choice: tá điền
  rationale: Trong bối cảnh này, từ Hy Lạp chỉ những người canh tác vườn nho thuộc về người khác. “Tá điền” nêu rõ quan hệ thuê đất và phù hợp với bối cảnh dụ ngôn.
- source_word: τούτους
  choice: này
  rationale: Giữ sắc thái chỉ định gần của đại từ Hy Lạp, trực tiếp nói đến chính những tá điền đang được đề cập.
- source_word: δώσει
  choice: giao
  rationale: δίδωμι có nghĩa cơ bản là “cho.” Trong tiếng Việt, “giao vườn nho cho” tự nhiên hơn và diễn đạt việc chuyển quyền quản lý mà không xác định thêm bản chất pháp lý.
- source_word: τὸν ἀμπελῶνα
  choice: vườn nho
  rationale: Cách dịch tiêu chuẩn, rõ ràng và giữ nguyên hình ảnh của dụ ngôn cũng như âm hưởng Kinh Thánh.
- source_word: ἄλλοις
  choice: cho những người khác
  rationale: Giữ nguyên tính không xác định của nguyên văn về danh tính những người nhận vườn nho.
- source_word: ἀκούσαντες
  choice: Nghe vậy
  rationale: Phân từ quá khứ có giá trị thời gian; “Nghe vậy” là cách diễn đạt gọn, tự nhiên và chỉ rõ phản ứng theo sau lời vừa nghe.
- source_word: Μὴ γένοιτο
  choice: Mong sao điều ấy đừng bao giờ xảy ra!
  rationale: Cụm cầu khiến ở thức mong ước biểu thị sự kinh hãi và bác bỏ mạnh mẽ. Cách dịch này giữ hình thức mong ước của nguyên văn và phù hợp với lời thoại tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái lời đáp Μὴ γένοιτο
  choice: 'Dịch như một lời mong ước phủ định mạnh: “Mong sao điều ấy đừng bao giờ xảy ra!”'
  alternative: “Không thể như vậy được!” hoặc “Tuyệt đối không!”
  rationale: Trong Lu-ca 20:16, lời này là phản ứng xúc động trước điều chủ vườn sắp làm, không chỉ là một lời phủ định về mặt lý luận. Bản dịch giữ sắc thái cầu mong của thức mong ước mà không giải thích thêm ý nghĩa thần học của dụ ngôn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “tá điền” vì chính xác về vai trò xã hội, đồng thời kèm chú thích để hỗ trợ độc giả không quen từ này. Đại từ “Người ấy” tránh tự ý thêm “chủ vườn” vào câu, trong khi vẫn rõ trong mạch dụ ngôn.
