  terminology: “Sê-sa” bảo lưu tính đặc thù lịch sử của Καίσαρι. “Thuế” là lựa chọn tự nhiên cho φόρον; chú thích cung cấp các khả năng “thuế cống” và “cống nạp,” đồng thời giải thích đây là khoản thuế nộp cho quyền lực cai trị, nên bảo toàn sắc thái chính trị của từ mà không làm nặng câu chính.
