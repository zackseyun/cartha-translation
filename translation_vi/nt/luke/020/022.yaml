  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: vi
  text: Chúng ta có được phép nộp thuế[a] cho Sê-sa hay không?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thuế cống” hoặc “cống nạp.” Từ Hy Lạp này chỉ khoản thuế phải nộp cho một thế lực cai trị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: có được phép
  rationale: Diễn đạt sự được phép về phương diện luật pháp hoặc tôn giáo, đồng thời không xác định cụ thể luật La Mã hay luật của Đức Chúa Trời.
- source_word: ἡμᾶς
  choice: chúng ta
  rationale: Phản ánh chủ thể của cấu trúc nguyên mẫu động từ mà không thêm ý “người Do Thái,” vốn không được nói rõ trong nguyên văn.
- source_word: Καίσαρι
  choice: cho Sê-sa
  rationale: Giữ danh hiệu lịch sử của hoàng đế La Mã thay vì khái quát hóa thành “hoàng đế.”
- source_word: φόρον
  choice: thuế
  rationale: Trong ngữ cảnh này, từ này chỉ khoản thuế hay cống nộp cho chính quyền cai trị; “thuế” tự nhiên và dễ hiểu trong tiếng Việt, còn sắc thái cống nộp được ghi ở chú thích.
- source_word: δοῦναι
  choice: nộp
  rationale: Dù nghĩa đen là “cho,” kết hợp tự nhiên trong tiếng Việt với “thuế” là “nộp thuế.”
- source_word: ἢ οὔ
  choice: hay không
  rationale: Là cách diễn đạt tự nhiên cho câu hỏi lựa chọn kết thúc bằng phủ định.
theological_decisions:
- issue: Căn cứ của sự được phép trong câu hỏi
  choice: Dùng “có được phép” mà không nói rõ căn cứ là luật La Mã hay luật tôn giáo của người Do Thái.
  alternative: “Có hợp pháp theo luật La Mã” hoặc “có đúng theo luật của Đức Chúa Trời.”
  rationale: Nguyên văn để ngỏ căn cứ pháp lý hoặc tôn giáo. Việc giữ sự mơ hồ bảo toàn sức căng chính trị và thần học trong cái bẫy được đặt ra cho Chúa Giê-xu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và tự nhiên. “Sê-sa” giữ màu sắc lịch sử; cấu trúc hỏi “có được phép… hay không?” rõ ràng mà vẫn bảo toàn sự mơ hồ của nguyên văn.
