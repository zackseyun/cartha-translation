source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: vi
  text: Sau khi quăng người ấy ra khỏi vườn nho, họ giết người ấy. Vậy, chủ vườn nho[a] sẽ làm gì với họ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “chủ nhân của vườn nho.” Từ Hy Lạp kyrios thường được dịch là “Chúa” khi dùng như một tước hiệu, nhưng ở đây từ này chỉ người sở hữu vườn nho trong dụ ngôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: quăng ... ra
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước hành động giết; “quăng ... ra” giữ được sắc thái mạnh của việc xua đuổi bằng sức lực và tự nhiên trong tiếng Việt.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ra khỏi vườn nho
  rationale: Cụm từ chỉ sự chuyển động từ bên trong ra bên ngoài; “ra khỏi” diễn đạt hướng chuyển động rõ hơn “ở ngoài”.
- source_word: ἀπέκτειναν
  choice: giết đi
  rationale: Động từ có nghĩa trực tiếp là giết; cách dịch này không thêm sắc thái pháp lý của “xử tử” hoặc sự định tính vượt quá nguyên văn.
- source_word: τί οὖν
  choice: Vậy, ... gì
  rationale: “Vậy” giữ quan hệ suy luận do οὖν biểu thị và tạo câu hỏi tự nhiên trong tiếng Việt hiện đại.
- source_word: ποιήσει ... αὐτοῖς
  choice: sẽ làm gì với họ
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn đạt hành động mà chủ vườn sẽ thực hiện đối với những tá điền.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: chủ vườn nho
  rationale: Trong bối cảnh dụ ngôn, κύριος chỉ người sở hữu hoặc có quyền trên vườn nho; “chủ vườn nho” rõ nghĩa, gọn và không khiến độc giả lầm tưởng đây là một tước hiệu thần linh trực tiếp.
theological_decisions:
- issue: Cách dịch κύριος khi từ này chỉ một nhân vật con người trong dụ ngôn
  choice: chủ vườn nho
  alternative: ông chủ vườn nho; chúa vườn nho
  rationale: Ngữ cảnh trực tiếp xác định nhân vật là người có quyền sở hữu vườn nho. Dịch theo nghĩa ngữ cảnh tránh áp đặt tước hiệu “Chúa” vào lời kể, nhưng chú thích vẫn bảo lưu phạm vi nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Người ấy” giữ đại từ của nguyên văn mà không lặp lại danh xưng từ câu trước; “quăng ... ra khỏi” bảo toàn sức mạnh của hành động, còn câu hỏi dùng trật tự tự nhiên của tiếng Việt.
