revisions:
- from: Họ quăng người ấy ra khỏi vườn nho rồi giết đi. Vậy, chủ vườn nho[a] sẽ làm gì với họ?
  to: Sau khi quăng người ấy ra khỏi vườn nho, họ giết người ấy. Vậy, chủ vườn nho[a] sẽ làm gì với họ?
  rationale: Sửa tối thiểu để bỏ “đi” sau “giết”, vốn không cần thiết cho nghĩa “giết” của ἀπέκτειναν. Đưa quan hệ trước–sau của phân từ ἐκβαλόντες vào cấu trúc “Sau khi ...” giúp bản dịch rõ ràng, vẫn tự nhiên trong tiếng Việt hiện đại. Thuật ngữ “chủ vườn nho” và ý nghĩa chú thích được giữ nguyên; chỉ điều chỉnh phương án thay thế cho hữu ích hơn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:32:57Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự của phân từ aorist ἐκβαλόντες (đuổi/quăng ra trước khi giết), hướng chuyển động trong ἔξω τοῦ ἀμπελῶνος, và câu hỏi suy luận τί οὖν. Tuy nhiên, “giết đi” thêm tiểu từ tình thái/thể “đi” không cần thiết và kém trung tính so với ἀπέκτειναν.
  naturalness: “Quăng ... ra khỏi” tự nhiên và giữ sắc thái cưỡng bức. Cấu trúc “Sau khi ... , họ giết ...” làm quan hệ thời gian minh thị, tránh sự gượng của “rồi giết đi.”
  terminology: “Chủ vườn nho” phù hợp ngữ cảnh dụ ngôn cho ὁ κύριος τοῦ ἀμπελῶνος và không biến κύριος thành tước hiệu thần linh trực tiếp. Chú thích nên nêu một phương án tiếng Việt có khác biệt thực chất hơn là chỉ thêm “ông” vào cùng một cách hiểu.
  issues:
  - severity: low
    issue: “giết đi”
    rationale: Tiểu từ “đi” không có đối ứng trong ἀπέκτειναν; trong câu trần thuật này nó không cần thiết và có thể tạo sắc thái khẩu ngữ hoặc hoàn tất không được nhấn trong nguyên văn.
  - severity: low
    issue: Phương án chú thích “ông chủ vườn nho”
    rationale: Phương án này về thực chất không khác nghĩa với bản văn “chủ vườn nho”; “chủ nhân của vườn nho” phản ánh rõ hơn khả năng diễn đạt sở hữu của κύριος.
