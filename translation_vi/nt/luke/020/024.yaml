  source_fidelity: Bản dịch truyền đạt chính xác mệnh lệnh Δείξατέ μοι, danh từ δηνάριον, câu hỏi sở hữu τίνος, hai yếu tố εἰκόνα và ἐπιγραφήν, cùng câu trả lời tỉnh lược Καίσαρος. Cụm “Đồng tiền ấy” chỉ làm rõ quy chiếu đã có trong câu trước và không thêm nghĩa thực chất.
