  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: vi
  text: '“Hãy cho tôi xem một đồng đê-na-ri[a]. Đồng tiền ấy mang hình và dòng chữ của ai?” Họ đáp: “Của Sê-sa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đê-na-ri là một đồng tiền La Mã được dùng phổ biến vào thời ấy; tên đồng tiền được giữ lại để bảo toàn bối cảnh lịch sử.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Hãy cho tôi xem
  rationale: Mệnh lệnh aorist được chuyển thành lời yêu cầu trực tiếp, tự nhiên trong tiếng Việt hiện đại, giữ đúng nghĩa “cho xem” thay vì thêm ý “mang đến” vốn không được nêu rõ.
- source_word: δηνάριον
  choice: một đồng đê-na-ri
  rationale: Giữ tên đồng tiền La Mã bằng lối phiên âm quen thuộc để bảo toàn bối cảnh lịch sử, thay vì khái quát hóa thành “đồng tiền La Mã” hay “đồng bạc”.
- source_word: τίνος
  choice: của ai
  rationale: Đại từ nghi vấn sở hữu được diễn đạt tự nhiên là “của ai” trong câu hỏi tiếng Việt.
- source_word: εἰκόνα
  choice: hình
  rationale: “Hình” vừa dễ hiểu vừa phù hợp với chân dung hoặc hình ảnh được đúc trên đồng tiền, không thu hẹp quá mức thành “chân dung”.
- source_word: ἐπιγραφήν
  choice: dòng chữ
  rationale: Trong ngữ cảnh đồng tiền, từ này chỉ phần chữ khắc; “dòng chữ” tự nhiên với độc giả phổ thông, trong khi “minh văn” quá chuyên môn.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Họ đáp
  rationale: Chuyển cấu trúc phân từ cộng động từ thành một động từ hữu hạn gọn, tự nhiên, vẫn giữ diễn tiến trần thuật.
- source_word: Καίσαρος
  choice: Của Sê-sa
  rationale: Giữ câu trả lời tỉnh lược của nguyên văn bằng một cụm sở hữu ngắn gọn; “Sê-sa” là dạng phiên âm tiếng Việt rõ nghĩa trong bối cảnh Kinh Thánh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Thêm “Đồng tiền ấy” ở câu hỏi để tiếng Việt tự nhiên và làm rõ rằng “hình” cùng “dòng chữ” nằm trên đồng đê-na-ri, nhưng không thêm nội dung diễn giải thần học.
