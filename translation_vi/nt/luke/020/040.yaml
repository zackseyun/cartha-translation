  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: không còn... nữa
  rationale: Diễn tả sự chấm dứt từ thời điểm ấy trở đi; cấu trúc tiếng Việt tự nhiên này giữ nguyên sắc thái thời gian.
- source_word: γάρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời tường thuật ngay trước đó.
- source_word: ἐτόλμων
  choice: dám
  rationale: Diễn tả sự can đảm hoặc sẵn lòng làm một việc; kết hợp với “không còn... nữa” truyền đạt tự nhiên ý nghĩa của thì chưa hoàn thành trong ngữ cảnh.
- source_word: ἐπερωτᾶν
  choice: hỏi
  rationale: Là cách diễn đạt tự nhiên, rõ ràng cho hành động đặt câu hỏi trong cuộc đối thoại công khai.
- source_word: αὐτὸν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus; “Ngài” phù hợp văn phong Kinh Thánh trang trọng hiện đại mà không thêm nội dung vào nguyên văn.
- source_word: οὐδέν
  choice: điều gì
  rationale: Trong câu phủ định, “không... điều gì” diễn đạt tự nhiên phạm vi tuyệt đối của đại từ này.
