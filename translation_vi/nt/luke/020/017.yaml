source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nhìn thẳng vào họ và nói: “Vậy, lời đã chép này là gì: ‘Tảng đá mà những người xây dựng đã loại bỏ, chính tảng đá ấy đã trở thành đá đầu góc[a]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đá góc” hoặc “đá đỉnh”. Nguyên văn Hy Lạp là “đầu của góc”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: nhìn thẳng vào
  rationale: Diễn tả cái nhìn có chủ ý hướng vào họ, tự nhiên trong tiếng Việt mà không cường điệu thành nhìn chằm chằm.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Vậy, lời đã chép này có nghĩa gì
  rationale: Câu hỏi trong ngữ cảnh mang lực tu từ hỏi về ý nghĩa của lời Kinh Thánh; “đã chép” giữ sắc thái hoàn thành-bị động của γεγραμμένον, còn cách diễn đạt toàn câu tự nhiên trong tiếng Việt.
- source_word: Λίθον
  choice: Tảng đá
  rationale: Danh từ xác định theo ngữ cảnh của câu trích dẫn; “tảng đá” phù hợp hình ảnh xây dựng hơn “hòn đá”.
- source_word: ἀπεδοκίμασαν
  choice: loại bỏ
  rationale: Thể hiện việc đánh giá là không đạt rồi bác bỏ; phù hợp ngữ cảnh những người xây dựng chọn vật liệu.
- source_word: οἱ οἰκοδομοῦντες
  choice: những người xây dựng
  rationale: Giữ hình thức phân từ chỉ những người đang làm công việc xây dựng, đồng thời tự nhiên và dễ hiểu.
- source_word: οὗτος
  choice: lại
  rationale: Tiếng Việt thường dùng cấu trúc tương phản “bị... loại bỏ lại trở thành...” để truyền đạt sự nhấn mạnh vào chính tảng đá ấy mà không cần đại từ gượng gạo.
- source_word: ἐγενήθη εἰς
  choice: trở thành
  rationale: Diễn đạt tự nhiên sự chuyển thành vai trò hay địa vị mới và giữ ý kết quả của cụm Hy Lạp.
- source_word: κεφαλὴν γωνίας
  choice: đá đứng đầu góc
  rationale: Giữ cả hai thành tố “đầu” và “góc” trong hình ảnh kiến trúc, tránh quyết định dứt khoát đây là đá góc nền hay đá đỉnh.
theological_decisions:
- issue: Hình ảnh kiến trúc trong câu trích Thi Thiên 118:22
  choice: đá đứng đầu góc
  alternative: đá góc nhà; hoặc đá đỉnh góc
  rationale: Cụm κεφαλὴ γωνίας có thể được hiểu theo nhiều cách về kiến trúc. Bản văn chính giữ hình ảnh gần nguyên ngữ, còn chú thích nêu các cách hiểu thông dụng mà không giải quyết sự mơ hồ thay cho độc giả.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể theo văn cảnh; câu trích dẫn giữ nhịp cân đối và sự tương phản của nguyên văn.
