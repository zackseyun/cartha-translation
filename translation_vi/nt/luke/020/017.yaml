revisions:
- from: 'Nhưng Đức Giê-su nhìn thẳng vào họ và nói: “Vậy, lời đã chép này có nghĩa gì: ‘Tảng đá bị những người xây dựng loại bỏ lại trở thành đá đứng đầu góc[a]’?”'
  to: 'Nhưng Đức Giê-su nhìn thẳng vào họ và nói: “Vậy, lời đã chép này là gì: ‘Tảng đá mà những người xây dựng đã loại bỏ, chính tảng đá ấy đã trở thành đá đầu góc[a]’?”'
  rationale: Sửa câu hỏi để phản ánh trực tiếp cấu trúc τὸ γεγραμμένον (“điều/lời đã chép”) thay vì diễn giải thành câu hỏi về ý nghĩa. Sửa phần trích dẫn để nêu rõ đại từ nhấn οὗτος và dùng một cách diễn đạt kiến trúc tự nhiên hơn, nhưng vẫn giữ sự mơ hồ có chủ ý của κεφαλὴ γωνίας. Chú thích được điều chỉnh cho nhất quán với bản văn chính và nêu các phương án kiến trúc thông dụng.
