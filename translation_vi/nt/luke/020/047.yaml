source:
  edition: SBLGNT
  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: vi
  text: là những kẻ nuốt hết nhà cửa của các góa phụ và lấy cớ[a] cầu nguyện lâu. Những kẻ ấy sẽ chịu sự phán xét nặng hơn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm ra vẻ” hoặc “dùng làm bình phong.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự kết án nghiêm khắc hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: nuốt hết
  rationale: Giữ hình ảnh mạnh của động từ Hy Lạp, diễn tả sự bóc lột tham tàn chứ không phải hành động ăn theo nghĩa đen.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: nhà cửa của các góa phụ
  rationale: Bám sát danh từ 'nhà', đồng thời cách nói 'nhà cửa' trong tiếng Việt có thể gợi cả cơ nghiệp và tài sản của các góa phụ.
- source_word: προφάσει
  choice: lấy cớ
  rationale: Diễn đạt tự nhiên ý dùng việc cầu nguyện như một cái cớ hoặc vỏ bọc; không quyết định quá mức liệu trọng tâm là sự phô trương hay che đậy hành vi bóc lột.
- source_word: μακρὰ προσεύχονται
  choice: cầu nguyện dài dòng
  rationale: Truyền đạt việc cầu nguyện kéo dài với sắc thái phê phán phù hợp văn cảnh.
- source_word: λήμψονται περισσότερον κρίμα
  choice: sẽ chịu sự phán xét nặng hơn
  rationale: Trong tiếng Việt, 'chịu sự phán xét' tự nhiên hơn dịch máy móc là 'nhận sự phán xét'; 'nặng hơn' biểu đạt cấp so sánh và tính bất lợi rõ ràng trong văn cảnh.
theological_decisions:
- issue: Ý nghĩa của κρίμα trong văn cảnh
  choice: sự phán xét
  alternative: sự kết án
  rationale: Văn cảnh cho thấy đây là phán xét bất lợi của Đức Chúa Trời, nhưng 'sự phán xét' giữ được phạm vi từ vựng rộng hơn của κρίμα thay vì thu hẹp thành bản án kết tội.
- issue: Quan hệ của προφάσει với lời cầu nguyện dài
  choice: lấy cớ cầu nguyện dài dòng
  alternative: cầu nguyện dài dòng để làm ra vẻ
  rationale: Chọn cách diễn đạt gần nghĩa 'cái cớ/vỏ bọc', giữ khả năng lời cầu nguyện được dùng để che đậy hoặc phục vụ hành vi sai trái, thay vì chỉ xác định đó là sự phô trương.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. 'Nuốt hết' giữ sức tố cáo của nguyên văn; 'nhà cửa' tự nhiên hơn 'nhà' đơn lẻ trong tiếng Việt và vẫn bảo toàn hình ảnh gốc. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
