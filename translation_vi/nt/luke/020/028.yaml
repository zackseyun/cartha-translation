  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: vi
  text: 'họ nói: “Thưa Thầy, Môi-se đã viết cho chúng ta rằng nếu anh trai hoặc em trai của một người qua đời khi đang có vợ, và người ấy không có con, thì người anh trai hoặc em trai của người ấy phải lấy người vợ đó và nối dõi cho người anh em đã qua đời.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nối dõi” vọng lại cách nói pháp lý trong Phục Truyền Luật Lệ Ký 25:5, chỉ việc gây dựng dòng dõi được kể cho người anh em đã qua đời; nguyên văn là “dựng dậy hạt giống.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Lời xưng hô trực tiếp, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Môi-se đã viết cho chúng ta
  rationale: Giữ sắc thái luật Môi-se được ban vì lợi ích và để áp dụng cho cộng đồng, thay vì hàm ý một lá thư gửi trực tiếp.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: nếu anh em của một người qua đời
  rationale: τινος mang nghĩa bất định; “anh em” giữ được phạm vi nghĩa của ἀδελφός trong cấu trúc luật định mà không buộc phải xác định anh hay em.
- source_word: ἔχων γυναῖκα
  choice: khi đang có vợ
  rationale: Theo sát nghĩa đen “có vợ”, đồng thời diễn đạt tự nhiên hơn trong tiếng Việt; không tự ý đổi thành “để lại vợ” trong chính văn.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: mà người ấy không có con
  rationale: “Người ấy” quy chiếu rõ về người đã qua đời; “không có con” là cách nói thông dụng và không xác định giới tính của con.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: thì người anh em phải lấy người vợ ấy
  rationale: “Phải” thể hiện nghĩa vụ trong điều luật; “lấy người vợ ấy” giữ động từ λαμβάνω và tránh giải thích dài dòng ngay trong chính văn.
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: nối dõi cho anh em mình
  rationale: Đây là thành ngữ pháp lý về việc tạo lập dòng dõi được kể cho người anh em đã chết; “nối dõi” tự nhiên, gọn và dễ hiểu trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt luật hôn nhân nối dõi mà không đưa phần giải thích văn hóa hoặc giáo phái vào chính văn
  choice: người anh em phải lấy người vợ ấy và nối dõi cho anh em mình
  alternative: người anh em phải cưới góa phụ ấy và sinh con để mang danh người đã chết
  rationale: Cách chọn giữ giọng luật định và ý niệm dòng dõi được kể cho người đã chết, nhưng không thêm các chi tiết giải thích vượt quá câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô “Thưa Thầy” và giọng luật định. Dùng “anh em” để không ép ἀδελφός thành “anh” hay “em”; ngữ cảnh cho biết đây là người nam có vợ.
