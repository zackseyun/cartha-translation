revisions:
- from: 'họ nói: “Thưa Thầy, Môi-se đã viết cho chúng ta rằng nếu anh em của một người qua đời khi đang có vợ, mà người ấy không có con, thì người anh em phải lấy người vợ ấy và nối dõi cho anh em mình.[a]”'
  to: 'họ nói: “Thưa Thầy, Môi-se đã viết cho chúng ta rằng nếu anh trai hoặc em trai của một người qua đời khi đang có vợ, và người ấy không có con, thì người anh trai hoặc em trai của người ấy phải lấy người vợ đó và nối dõi cho người anh em đã qua đời.[a]”'
  rationale: Sửa cách gọi quan hệ anh em để phản ánh ἀδελφός là số ít và là người nam, nhưng vẫn giữ tính không xác định anh hay em. Sửa phần cuối để quy chiếu rõ dòng dõi cho người anh/em đã chết. Không thay đổi ý nghĩa, giọng luật định, hay mức độ giải thích của bản văn.
