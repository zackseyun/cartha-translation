  text: ἀποκριθέντες δέ τινες τῶν γραμματέων εἶπαν· Διδάσκαλε, καλῶς εἶπας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: vi
  text: 'Bấy giờ, một số thầy thông giáo đáp: “Thưa Thầy, Thầy nói đúng lắm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: đáp
  rationale: Phân từ bất định quá khứ của ἀποκρίνομαι giới thiệu lời hồi đáp; chuyển thành động từ hữu hạn “đáp” là tự nhiên trong tiếng Việt.
- source_word: δέ
  choice: Bấy giờ
  rationale: δέ đánh dấu một chuyển tiếp nhẹ trong mạch tường thuật; “Bấy giờ” nối với lập luận ngay trước đó mà không nhấn mạnh sự tương phản.
- source_word: τινες τῶν γραμματέων
  choice: một số thầy thông giáo
  rationale: Kết cấu bộ phận τινες + sở hữu cách chỉ một nhóm trong số các thầy thông giáo; “một số” thể hiện rõ điều này.
- source_word: γραμματέων
  choice: thầy thông giáo
  rationale: Đây là cách gọi quen thuộc, trang trọng và tương đối cô đọng đối với các chuyên gia sao chép và giải thích Luật trong bối cảnh Tin Mừng.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Dạng hô cách của διδάσκαλος có nghĩa là người dạy; “Thưa Thầy” vừa chuyển tải danh xưng vừa thể hiện lối xưng hô tự nhiên trong tiếng Việt.
- source_word: καλῶς
  choice: đúng lắm
  rationale: Trong ngữ cảnh này, καλῶς khen lời nói là đúng hoặc xác đáng; “đúng lắm” diễn đạt tự nhiên sự tán thành mạnh mà không thêm nội dung thần học.
- source_word: εἶπας
  choice: Thầy nói
  rationale: Thì bất định quá khứ Hy Lạp nhắc đến lời vừa được nói; tiếng Việt không cần đánh dấu thì và lặp “Thầy” là tự nhiên trong lời xưng hô.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “thầy thông giáo” theo thuật ngữ Kinh Thánh quen thuộc; lời trực tiếp giữ sắc thái kính trọng qua “Thưa Thầy”.
