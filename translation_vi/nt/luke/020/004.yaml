  naturalness: “Phép báp-têm của Giăng” và “từ loài người” là cách nói rõ ràng, phù hợp văn phong Kinh Thánh tiếng Việt. Câu được chỉnh để hai phương án cân xứng. Trong chú thích, “thần thượng” không phải cách dùng tự nhiên trong tiếng Việt hiện đại; nên diễn đạt trực tiếp là nguồn gốc hoặc thẩm quyền từ Đức Chúa Trời.
