  text: Was John's baptism from heaven or from men?[a]
translation:
  language: vi
  text: Phép báp-têm của Giăng là từ trời hay từ loài người?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “từ Đức Chúa Trời”; tiếng Hy Lạp theo nghĩa đen là “từ trời”, một lối nói kính cẩn chỉ nguồn gốc hoặc thẩm quyền từ Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: phép báp-têm
  rationale: Danh từ chỉ nghi thức gắn với chức vụ của Giăng; “phép báp-têm” là cách gọi quen thuộc, chính xác trong tiếng Việt Cơ Đốc.
- source_word: Ἰωάννου
  choice: của Giăng
  rationale: Sở hữu cách Hy Lạp chỉ phép báp-têm gắn với Giăng; cấu trúc “của Giăng” tự nhiên trong tiếng Việt.
- source_word: ἐξ οὐρανοῦ
  choice: đến từ trời
  rationale: Giữ nguyên hình ảnh “từ trời” của nguyên văn và thành ngữ kính ngữ Do Thái, thay vì diễn giải thẳng là “từ Đức Chúa Trời”.
- source_word: ἐξ ἀνθρώπων
  choice: từ loài người
  rationale: Chỉ nguồn gốc hoặc thẩm quyền thuần túy từ con người, đối lập với nguồn gốc từ trời; “loài người” không mang nghĩa riêng về giới tính.
- source_word: ἦν
  choice: đến
  rationale: Dù nguyên văn dùng động từ “là”, tiếng Việt tự nhiên diễn đạt nguồn gốc bằng “đến từ” mà vẫn giữ đúng ý nghĩa.
- source_word: ἢ
  choice: hay
  rationale: Liên từ phân cách hai khả năng trong câu hỏi; “hay” là lựa chọn tự nhiên trong câu nghi vấn tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của “từ trời” đối với phép báp-têm của Giăng
  choice: Giữ thành ngữ “từ trời” trong chính văn.
  alternative: từ Đức Chúa Trời
  rationale: Cụm từ hàm ý nguồn gốc hoặc thẩm quyền thần thượng, nhưng nguyên văn nói rõ là “từ trời”. Giữ cách nói này tránh diễn giải quá mức và bảo tồn sắc thái kính ngữ của bản văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” và “phép báp-têm” theo thuật ngữ Kinh Thánh tiếng Việt quen thuộc; giữ thành ngữ “từ trời” nhằm bảo tồn hình thức và sắc thái của nguyên văn.
