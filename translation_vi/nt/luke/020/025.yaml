  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa của câu Hy Lạp: δέ được diễn đạt hợp lý bằng “Nhưng”; Τοίνυν bằng “Vậy”; ἀπόδοτε bằng “hãy trả”; và hai cụm τὰ ... giữ được phạm vi mở, không bị thu hẹp thành tiền thuế. Phép song song giữa Sê-sa và Đức Chúa Trời được bảo toàn, không áp đặt cách giải thích chính trị hay thần học ngoài bản văn.'
