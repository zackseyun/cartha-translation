  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Vậy, hãy trả cho Sê-sa những gì thuộc về Sê-sa, và trả cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy trao cho Sê-sa… và trao cho Đức Chúa Trời…”. Động từ Hy Lạp có thể mang nghĩa trao, nộp hoặc hoàn trả điều phải trả.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Nhưng Ngài nói với họ
  rationale: δέ có sắc thái chuyển tiếp hoặc đối chiếu nhẹ; “Nhưng” phù hợp với diễn tiến đối thoại. “Nói với họ” là cách diễn đạt tự nhiên của tiếng Việt.
- source_word: Τοίνυν
  choice: Vậy
  rationale: Từ này đánh dấu kết luận suy ra từ điều vừa nói; “Vậy” vừa tự nhiên vừa giữ được sức nặng lập luận.
- source_word: ἀπόδοτε
  choice: hãy trả
  rationale: Động từ có thể chỉ việc trao, nộp hoặc hoàn trả điều thuộc về hay phải dành cho ai. “Trả” giữ được ý nghĩa về nghĩa vụ mà không thu hẹp câu nói vào việc nộp thuế.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: trả cho Sê-sa những gì thuộc về Sê-sa
  rationale: Cách dịch này giữ phạm vi rộng của τὰ và cấu trúc thuộc hữu, không diễn giải riêng thành tiền thuế.
- source_word: Καίσαρος / Καίσαρι
  choice: Sê-sa
  rationale: Giữ danh xưng đế quốc quen thuộc trong truyền thống Kinh Thánh tiếng Việt thay vì diễn giải thành “hoàng đế”.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: trả cho Đức Chúa Trời những gì thuộc về Đức Chúa Trời
  rationale: Giữ phép song song cân xứng với vế nói về Sê-sa và không tự xác định giới hạn của hai phạm vi.
- source_word: θεοῦ / θεῷ
  choice: Đức Chúa Trời
  rationale: Trong ngữ cảnh, θεός chỉ Đức Chúa Trời của Y-sơ-ra-ên; đây là cách gọi trang trọng, rõ ràng và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Phạm vi chính trị và thần học trong lời phán của Chúa Giê-su
  choice: Giữ nguyên nghĩa vụ song song đối với Sê-sa và Đức Chúa Trời mà không xác định cụ thể giới hạn của mỗi bên.
  alternative: Diễn giải câu này như sự phân lập tuyệt đối giữa tôn giáo và nhà nước, sự chuẩn thuận quyền lực nhà nước vô hạn, hoặc chỉ là mệnh lệnh nộp thuế.
  rationale: Bản Hy Lạp nêu nguyên tắc trả cho mỗi bên điều thuộc về bên ấy nhưng không trình bày một học thuyết chính trị đầy đủ; bản dịch cần giữ độ rộng và sự căng thẳng thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lặp lại động từ “trả” ở vế thứ hai để câu tiếng Việt rõ và cân đối. Dấu chú thích [a] đặt sau toàn bộ lời trích dẫn vì chú thích áp dụng cho động từ được dùng song song ở cả hai vế.
