  terminology: “Sê-sa” là cách viết quen thuộc và phù hợp cho danh xưng Καίσαρ. “Đức Chúa Trời” là thuật ngữ trang trọng, phổ biến trong văn phong Kinh Thánh tiếng Việt để chỉ θεός ở ngữ cảnh này. Chú thích từ vựng phản ánh đúng dải nghĩa của ἀποδίδωμι và không làm thay đổi nghĩa bản dịch chính.
