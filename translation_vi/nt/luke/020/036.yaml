revisions:
- from: Vì họ không còn có thể chết nữa, bởi họ giống như các thiên sứ và là con của Đức Chúa Trời[a], vì là con của sự sống lại.
  to: Vì họ cũng không thể chết nữa, vì họ giống như các thiên sứ và là con của Đức Chúa Trời[a], là con của sự sống lại.
  rationale: Bản sửa thêm “cũng” để phản ánh οὐδέ, rút gọn cách nói về khả năng chết cho tự nhiên, và thay “vì là” bằng “là” để giữ tính mở của phân từ ὄντες. Các thuật ngữ then chốt và phép lặp “con ... con ...” được giữ nguyên.
