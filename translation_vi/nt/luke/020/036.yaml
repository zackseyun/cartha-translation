  - severity: low
    issue: Cụm “không còn có thể chết nữa” thừa và kém gọn
    rationale: “Không thể chết nữa” đã diễn đạt đầy đủ δύνανται + ἔτι; thêm cả “không còn” và “nữa” làm câu nặng mà không tăng nghĩa.
  - severity: low
    issue: “Vì là con của sự sống lại” diễn giải quan hệ phân từ theo hướng nguyên nhân
    rationale: ὄντες có thể mang sắc thái hoàn cảnh hoặc giải thích. “Là con của sự sống lại” bảo toàn sự mơ hồ cú pháp tốt hơn, không loại trừ sắc thái giải thích từ ngữ cảnh.
