id: LUK.20.36
reference: Luke 20:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: vi
  text: Vì họ cũng không thể chết nữa, vì họ giống như các thiên sứ và là con của Đức Chúa Trời[a], là con của sự sống lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong nguyên văn Hy Lạp, cả “con của Đức Chúa Trời” lẫn “con của sự sống lại” đều dùng từ mang dạng giống đực số nhiều. Trong ngữ cảnh này, “con” diễn tả địa vị và căn tính, không hàm ý chỉ bao gồm nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: không còn có thể chết nữa
  rationale: Giữ rõ sắc thái khả năng của δύνανται và ý chấm dứt tình trạng phải chết của ἔτι; cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ἰσάγγελοι
  choice: giống như các thiên sứ
  rationale: Diễn đạt sự tương đồng hoặc ngang hàng với thiên sứ mà không hàm ý họ trở thành thiên sứ.
- source_word: υἱοί ... θεοῦ
  choice: con của Đức Chúa Trời
  rationale: Danh từ υἱοί chỉ địa vị và căn tính thuộc về Đức Chúa Trời trong ngữ cảnh này. Tiếng Việt dùng “con” tự nhiên cho cả nam lẫn nữ mà vẫn giữ hình ảnh quan hệ gia đình.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: vì là con của sự sống lại
  rationale: Giữ nguyên ẩn dụ “con của sự sống lại”; “vì là” thể hiện sắc thái giải thích hợp lý của phân từ ὄντες trong mạch câu.
- source_word: γάρ ... γάρ
  choice: Vì ... bởi
  rationale: Hai từ nối đều có chức năng giải thích; dùng “Vì” và “bởi” giúp câu tiếng Việt tránh lặp nặng nề trong khi giữ mạch lập luận.
theological_decisions:
- issue: Ngôn ngữ về tư cách làm con trong bối cảnh phục sinh
  choice: Giữ hai cách gọi “con của Đức Chúa Trời” và “con của sự sống lại”
  alternative: “con cái của Đức Chúa Trời” và “những người thuộc về sự sống lại”
  rationale: Bản Hy Lạp lặp υἱοί để liên kết địa vị làm con của Đức Chúa Trời với căn tính do sự sống lại. “Con” trong tiếng Việt không giới hạn giới tính, nên vừa giữ được ẩn dụ vừa không tạo hàm ý chỉ dành cho nam giới.
- issue: Quan hệ logic của τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: 'Dịch theo sắc thái giải thích: “vì là con của sự sống lại”'
  alternative: “là con của Đức Chúa Trời, là con của sự sống lại”
  rationale: Phân từ ὄντες có thể được hiểu theo hướng hoàn cảnh hoặc nguyên nhân. “Vì là” phản ánh mạch giải thích tự nhiên nhưng không thêm một hệ thống thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và “thiên sứ” theo lối Kinh Thánh Việt ngữ quen thuộc; giữ phép lặp “con ... con ...” để bảo toàn liên kết tu từ của nguyên văn.
