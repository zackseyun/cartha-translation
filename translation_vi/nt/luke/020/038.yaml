  source_fidelity: 'Bản dịch chuyển tải đúng cấu trúc đối lập οὐκ ... ἀλλὰ và các danh từ số nhiều mang tính thực thể: “Đức Chúa Trời của người chết ... của người sống.” Mệnh đề πάντες γὰρ αὐτῷ ζῶσιν được dịch “vì đối với Ngài, tất cả đều sống,” giữ được phạm vi không xác định quá mức của πάντες và sắc thái quan hệ có chủ ý để mở của dữ cách αὐτῷ. Không thêm diễn giải về tình trạng sau khi chết hay cơ chế sự sống lại.'
