id: LUK.20.38
reference: Luke 20:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: vi
  text: Ngài không phải là Đức Chúa Trời của người chết, nhưng của người sống, vì đối với Ngài, tất cả đều sống.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì trước mặt Ngài, tất cả đều đang sống.”'
    reason: αὐτῷ có thể được hiểu theo sắc thái “đối với Ngài” hoặc “trước mặt Ngài”; bản dịch thay thế làm rõ một cách hiểu cổ truyền mà nguyên văn cho phép.
lexical_decisions:
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Danh từ không có mạo từ nhưng mang nghĩa xác định trong bối cảnh độc thần Do Thái; cách dịch này tự nhiên và trang trọng trong tiếng Việt.
- source_word: δὲ
  choice: nhưng
  rationale: δέ có thể đánh dấu chuyển ý nhẹ; trong câu này, sắc thái đối lập đã được diễn đạt tự nhiên qua cấu trúc “không phải... nhưng...”, nên không thêm một từ nối riêng ở đầu câu.
- source_word: νεκρῶν
  choice: người chết
  rationale: Tính từ dùng như danh từ, ở số nhiều; “người chết” diễn đạt gọn và đối xứng với “người sống”.
- source_word: ζώντων
  choice: người sống
  rationale: Phân từ dùng như danh từ, giữ nguyên thế đối lập súc tích với “người chết”.
- source_word: πάντες
  choice: tất cả
  rationale: Giữ phạm vi diễn đạt rộng và cô đọng của tiếng Hy Lạp, không tự ý giới hạn vào các tổ phụ dù họ là đối tượng gần trong văn cảnh.
- source_word: αὐτῷ
  choice: đối với Ngài
  rationale: Cách dịch này giữ tính chất quan hệ của cách dữ cách mà không buộc câu phải mang nghĩa mục đích “sống cho Ngài” hay chỉ vị trí “trước mặt Ngài”.
- source_word: ζῶσιν
  choice: đều sống
  rationale: Thể hiện động từ hiện tại một cách trực tiếp; “đều” kết hợp tự nhiên với “tất cả” trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của αὐτῷ trong πάντες γὰρ αὐτῷ ζῶσιν
  choice: vì đối với Ngài, tất cả đều sống
  alternative: vì trước mặt Ngài, tất cả đều đang sống
  rationale: Cách dịch chính giữ sự cô đọng và tính quan hệ của dữ cách αὐτῷ, hỗ trợ lập luận về sự sống và sự sống lại mà không xác định quá mức cơ chế thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp “người chết/người sống” để giữ phép đối lập của nguyên văn; đại từ “Ngài” chỉ Đức Chúa Trời. Dấu chú thích [a] được đặt sau mệnh đề có cách dịch thay thế.
