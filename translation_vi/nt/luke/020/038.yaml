  terminology: “Đức Chúa Trời” và đại từ “Ngài” nhất quán với ngữ cảnh độc thần và có thanh ghi trang trọng. Không có thuật ngữ giáo phái hoặc diễn giải giáo lý bị áp đặt. Chú thích nêu đúng phương án “trước mặt Ngài” mà không khẳng định đó là nghĩa duy nhất.
