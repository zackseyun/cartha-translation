    rationale: ὁ Ἰησοῦς chỉ nêu tên Giê-su; tước hiệu «Đức Chúa» không xuất hiện trong câu nguồn và nên không được thêm vào bản dịch tối ưu-tương-đương.
  - severity: low
    issue: «phán» không phải tương đương hiện đại trung tính nhất cho εἶπεν
    rationale: εἶπεν đơn giản là «nói». «Phán» tạo thanh điệu cổ và kính ngữ vượt quá động từ nguồn.
  - severity: medium
    issue: «Con cái của thời đại này» mơ hồ trong tiếng Việt
    rationale: Cụm này dễ được đọc là hậu duệ/con cháu của thời đại, trong khi υἱοὶ τοῦ αἰῶνος τούτου là thành ngữ chỉ những người thuộc về trật tự/thời đại hiện tại. Cần chuyển nghĩa trong bản văn và giữ hình thức sát chữ ở chú thích.
