review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng ý chính của câu, gồm sự đối lập giữa αἰών này và cặp động từ chủ động/bị động về hôn nhân. Tuy nhiên, «Đức Chúa Jêsus» thêm tước hiệu không có trong nguyên văn, còn «phán» là lối dùng cổ/trang trọng hơn sắc thái đơn thuần của εἶπεν. «Con cái của thời đại này» có thể bị hiểu theo nghĩa con cháu của một thời đại hơn là những người thuộc thời đại ấy.
  naturalness: «Giê-su nói với họ» là tiếng Việt hiện đại, tự nhiên và không thêm sắc thái. «Những người thuộc thời đại này» diễn đạt rõ nghĩa thành ngữ «các con/các con trai của thời đại này» trong tiếng Hy Lạp. Cặp «cưới vợ và được gả chồng» vẫn tự nhiên trong văn cảnh và phản ánh cách diễn đạt chủ động/bị động của nguồn.
  terminology: Dùng «Giê-su» theo dạng chính tả hiện đại phổ biến. «Thời đại này» là lựa chọn chính xác cho αἰών và duy trì chiều kích đối chiếu cánh chung của ngữ cảnh. Chú thích nêu cách dịch sát «các con trai» và chức năng đại diện của giống đực, thay vì đưa tước hiệu hoặc diễn giải giáo phái vào bản văn.
  issues:
