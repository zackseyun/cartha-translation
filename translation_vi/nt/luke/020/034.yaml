  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: vi
  text: 'Giê-su nói với họ[a]: “Những người thuộc thời đại này cưới vợ và được gả chồng,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch sát: «Các con trai của thời đại này.» Tiếng Hy Lạp dùng một cách nói giống đực mang nghĩa đại diện, chỉ những người thuộc về thời đại hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (không dịch riêng)
  rationale: Liên từ nối tiếp lời thuật; trong tiếng Việt, mở đầu trực tiếp bằng chủ ngữ tự nhiên hơn mà không làm mất quan hệ với văn cảnh.
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Đức Chúa Jêsus phán với họ
  rationale: Giữ động từ trung tính λέγω, không thêm sắc thái “trả lời”; “phán” phù hợp với lời nói trang trọng của Chúa Jêsus.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Con cái của thời đại này
  rationale: “Con cái” là cách nói đại diện tự nhiên trong tiếng Việt, bao gồm những người thuộc về thời đại hiện tại, đồng thời giữ thành ngữ chỉ sự thuộc về của υἱοί.
- source_word: γαμοῦσιν καὶ γαμίσκονται
  choice: cưới vợ và được gả chồng
  rationale: Giữ sự phân biệt giữa thể chủ động và bị động trong nguyên văn, cũng như lối diễn đạt về vai trò nam nữ theo tập quán hôn nhân cổ.
theological_decisions:
- issue: Cách nói giống đực mang nghĩa đại diện
  choice: Con cái của thời đại này
  alternative: Người của thời đại này; các con trai của thời đại này
  rationale: “Các con trai” quá dễ bị hiểu là chỉ nam giới trong tiếng Việt, còn “con cái” giữ được hình ảnh quan hệ/thuộc về và truyền đạt phạm vi đại diện của câu.
- issue: αἰών như một phạm trù cánh chung
  choice: thời đại này
  alternative: thế gian này
  rationale: “Thời đại” giữ rõ sự tương phản giữa trật tự hiện tại và thời đại sắp đến trong văn cảnh, thay vì gợi chủ yếu đến thế giới vật chất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi kính trọng; duy trì cặp “cưới vợ/được gả chồng” để phản ánh đối lập chủ động-bị động của tiếng Hy Lạp.
