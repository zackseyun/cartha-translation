revisions:
- from: 'Đức Chúa Jêsus phán với họ: “Con cái của thời đại này cưới vợ và được gả chồng,”'
  to: 'Giê-su nói với họ[a]: “Những người thuộc thời đại này cưới vợ và được gả chồng,”'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn và thay lối hành văn cổ bằng cách diễn đạt hiện đại, trung tính. Thành ngữ Hy Lạp về «các con trai của thời đại này» được chuyển nghĩa rõ ràng trong bản văn, còn hình thức giống đực của nguồn được bảo tồn minh bạch trong chú thích. Cặp «cưới vợ/được gả chồng» được giữ để phản ánh sự phân biệt chủ động/bị động của γαμοῦσιν καὶ γαμίσκονται.
