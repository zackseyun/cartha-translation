  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: vi
  text: 'Nhưng họ bàn luận với nhau, nói rằng: “Nếu chúng ta nói: ‘Từ trời,’ thì Người sẽ nói: ‘Tại sao các ông không tin Giăng?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: bàn tính với nhau
  rationale: Cụm này diễn tả việc cả nhóm cùng suy xét, cân nhắc cách trả lời. “Bàn tính với nhau” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái deliberative, có tính toán của động từ.
- source_word: λέγοντες
  choice: (thể hiện bằng lời trích dẫn trực tiếp sau dấu hai chấm)
  rationale: Trong tiếng Việt, sau động từ “bàn tính”, dấu hai chấm và lời trích dẫn trực tiếp chuyển tải tự nhiên ý của phân từ “nói rằng”, tránh lối diễn đạt nặng nề “bàn tính với nhau, nói rằng”.
- source_word: Ἐὰν εἴπωμεν
  choice: Nếu chúng ta nói
  rationale: Diễn đạt tự nhiên điều kiện còn để ngỏ của cấu trúc Hy Lạp.
- source_word: Ἐξ οὐρανοῦ
  choice: Từ trời
  rationale: Giữ nguyên thành ngữ chỉ nguồn gốc và thẩm quyền thiên thượng, không diễn giải thành “từ Đức Chúa Trời”.
- source_word: ἐρεῖ
  choice: sẽ hỏi
  rationale: Động từ theo nghĩa đen là “sẽ nói”, nhưng nội dung ngay sau đó là một câu hỏi; “sẽ hỏi” là cách chuyển đạt tự nhiên trong tiếng Việt mà không thay đổi ý.
- source_word: ἐπιστεύσατε αὐτῷ
  choice: không tin ông ấy
  rationale: πιστεύω với tặng cách ở đây nói đến việc tin lời hoặc lời chứng của Giăng. “Tin ông ấy” phù hợp hơn “tin vào ông ấy”, vốn dễ gợi một ý thần học mạnh hơn cú pháp đòi hỏi.
theological_decisions:
- issue: Ý nghĩa nguồn gốc phép báp-têm của Giăng trong câu trả lời giả định Ἐξ οὐρανοῦ
  choice: Giữ “Từ trời”
  alternative: “Từ Đức Chúa Trời”
  rationale: “Từ trời” bảo tồn cách nói kính cẩn của nguyên văn và hàm ý thẩm quyền thần thượng mà không diễn giải quá mức.
- issue: Đối tượng của hành động tin trong ἐπιστεύσατε αὐτῷ
  choice: “tin ông ấy”
  alternative: “tin vào ông ấy” hoặc “tin cậy ông ấy”
  rationale: Ngữ cảnh nhấn mạnh việc chấp nhận lời của Giăng; bản dịch không nên tự ý biến cấu trúc này thành công thức chỉ đức tin cứu rỗi hay sự phó thác cá nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Bàn tính với nhau” thể hiện sự cân nhắc trong nội bộ nhóm. Đại từ “ông ấy/các ông” phù hợp đối thoại trong ngữ cảnh, tránh sắc thái quá cổ.
