  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: vi
  text: Người thứ ba cũng lấy bà ấy; tương tự, cả bảy người đều không để lại con cái rồi chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cưới bà ấy làm vợ.” Nguyên văn Hy Lạp là “lấy bà ấy,” một thành ngữ chỉ việc lấy một phụ nữ làm vợ trong ngữ cảnh này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: người thứ ba
  rationale: Bản Hy Lạp chỉ nói “người thứ ba”, không lặp lại “anh em”; tiếng Việt có thể giữ cách tỉnh lược này một cách tự nhiên nhờ ngữ cảnh.
- source_word: ἔλαβεν αὐτήν
  choice: lấy bà
  rationale: Trong ngữ cảnh hôn nhân kế tục, cụm này có nghĩa là lấy người phụ nữ ấy làm vợ. “Lấy bà” vừa gần nguyên văn vừa là cách nói tự nhiên trong tiếng Việt.
- source_word: ὡσαύτως δὲ καὶ οἱ ἑπτὰ
  choice: rồi cả bảy người đều như vậy
  rationale: Cách dịch này diễn đạt sự tiếp nối và tình trạng tương tự của toàn bộ bảy người, đồng thời tự nhiên hơn việc chuyển từng tiểu từ riêng rẽ.
- source_word: οὐ κατέλιπον τέκνα
  choice: không để lại con cái
  rationale: καταλείπω trong mạch kể về cái chết nhấn mạnh rằng họ không để con cái lại sau khi qua đời; cách dịch này giữ được sắc thái ấy.
- source_word: ἀπέθανον
  choice: đều chết
  rationale: Động từ có nghĩa trực tiếp là “chết”; thêm “đều” làm rõ động từ số nhiều áp dụng cho cả bảy người mà không thay đổi nội dung.
