source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: vi
  text: 'Họ hỏi Ngài: “Thưa Thầy, chúng tôi biết Thầy nói và dạy đúng đắn, không thiên vị[a], nhưng dạy đường lối của Đức Chúa Trời theo lẽ thật.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nghĩa đen: “không nhận lấy khuôn mặt”, một thành ngữ chỉ việc không thiên vị, không nể mặt, hoặc không bị chi phối bởi vẻ bề ngoài hay địa vị.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng thật sự dạy đường lối của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: hỏi
  rationale: Động từ chỉ hành động hỏi hay chất vấn. “Hỏi” tự nhiên trong tiếng Việt và không diễn giải quá mức ý thù địch, còn dụng ý thử Chúa Giê-su được văn cảnh cho biết.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: Dạng xưng hô của διδάσκαλος được chuyển thành lối gọi kính trọng, tự nhiên trong tiếng Việt hiện đại.
- source_word: οἴδαμεν
  choice: chúng tôi biết
  rationale: Diễn đạt trực tiếp lời khẳng định chắc chắn của những người nói, dù văn cảnh cho thấy đây là lời tâng bốc.
- source_word: ὀρθῶς
  choice: đúng đắn
  rationale: Bao hàm ý đúng và ngay thẳng, đồng thời kết hợp tự nhiên với cả “nói” lẫn “dạy”.
- source_word: λέγεις καὶ διδάσκεις
  choice: Thầy nói và dạy
  rationale: Giữ lại hai động từ song song trong bản Hy Lạp thay vì gộp chúng thành một.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: không thiên vị
  rationale: Đây là thành ngữ, nghĩa đen là “không nhận lấy khuôn mặt”, chỉ việc không ưu đãi ai vì địa vị hay vẻ bề ngoài. “Không thiên vị” truyền đạt rõ nghĩa trong tiếng Việt.
- source_word: ἐπ’ ἀληθείας
  choice: thật lòng
  rationale: Cụm từ diễn tả cách thức giảng dạy phù hợp với sự thật. “Thật lòng” tự nhiên, nhưng có thể cũng được hiểu là “theo sự thật”; vì vậy ghi chú bảo lưu khả năng này.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: đường lối của Đức Chúa Trời
  rationale: “Đường lối” vừa tự nhiên vừa giữ được chiều kích ẩn dụ của ὁδός, nói về ý muốn và nếp sống Đức Chúa Trời chỉ dạy.
- source_word: ἀλλ’
  choice: nhưng
  rationale: Giữ quan hệ tương phản giữa việc không thiên vị và việc giảng dạy theo sự thật.
theological_decisions:
- issue: Thành ngữ về sự không thiên vị
  choice: không thiên vị
  alternative: không xét người theo bề ngoài; không nể mặt ai
  rationale: Cách dịch theo nghĩa thành ngữ làm rõ rằng Chúa Giê-su không bị chi phối bởi địa vị hay vẻ bề ngoài, mà không đưa thêm một lập trường giáo phái.
- issue: Phạm vi bổ nghĩa của ἐπ’ ἀληθείας
  choice: thật lòng giảng dạy đường lối của Đức Chúa Trời
  alternative: giảng dạy đường lối của Đức Chúa Trời theo sự thật
  rationale: Cấu trúc Hy Lạp cho phép nhấn mạnh cách thức chân thật hoặc sự phù hợp với sự thật. Bản chính dùng cách nói tự nhiên, còn chú thích giữ lại sắc thái thay thế.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Thầy” trong lời đối thoại. Giữ nhịp phối hợp của câu Hy Lạp, đồng thời chuyển thành ngữ sang tiếng Việt tự nhiên.
