  text: Later[a], the woman also died.
translation:
  language: vi
  text: Sau đó, người phụ nữ cũng chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: Sau đó
  rationale: Trạng từ chỉ thời điểm tiếp sau trong trình tự câu chuyện; cách dịch này tự nhiên và không hàm ý rằng đây nhất thiết là sự việc cuối cùng.
- source_word: καὶ
  choice: cũng
  rationale: Ở đây καί nhấn mạnh rằng người phụ nữ cũng chết như những người anh em đã được nhắc đến trước đó.
- source_word: ἡ γυνή
  choice: người phụ nữ
  rationale: γυνή có thể là “người phụ nữ” hoặc “người vợ”; trong tình huống người ấy lần lượt kết hôn với nhiều anh em, “người phụ nữ” xác định đối tượng rõ ràng mà không gắn bà với riêng một người chồng.
- source_word: ἀπέθανεν
  choice: qua đời
  rationale: Diễn đạt tự nhiên, trang trọng trong tiếng Việt hiện đại và báo cáo trực tiếp việc bà chết.
