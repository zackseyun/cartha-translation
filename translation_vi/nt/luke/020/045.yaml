    rationale: παντὸς τοῦ λαοῦ là “toàn thể dân chúng/người dân” như một tập thể trong khung cảnh đang lắng nghe. “Toàn thể dân chúng” chuyển tải rõ hơn phạm vi tập thể của λαός mà vẫn không đồng nhất nó với một “đám đông” đơn thuần.
