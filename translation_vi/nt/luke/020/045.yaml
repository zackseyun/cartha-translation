  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: vi
  text: 'Khi toàn thể dân chúng đang lắng nghe[a], Ngài nói với các môn đồ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong lúc toàn thể dân chúng lắng nghe, Ngài nói với các môn đồ.” Tiếng Hy Lạp dùng kết cấu sinh cách tuyệt đối để nêu hoàn cảnh khi Ngài nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: đang lắng nghe
  rationale: Phân từ hiện tại trong kết cấu sinh cách tuyệt đối diễn tả hành động đang diễn ra đồng thời và làm bối cảnh cho lời nói; “đang lắng nghe” tự nhiên trong tiếng Việt và giữ được sắc thái tiếp diễn.
- source_word: δὲ
  choice: Khi
  rationale: δέ là liên từ nhẹ nối tiếp mạch kể; trong tiếng Việt, quan hệ nối tiếp được thể hiện tự nhiên qua mệnh đề hoàn cảnh mở đầu bằng “Khi”, không cần thêm một từ nối riêng như “và”.
- source_word: παντὸς τοῦ λαοῦ
  choice: toàn dân
  rationale: Cụm từ chỉ dân chúng như một toàn thể. “Toàn dân” ngắn gọn, tự nhiên và giữ sắc thái cộng đồng của λαός hơn “đám đông”.
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Động từ λέγω ở đây đơn giản là “nói”. Đại từ “Ngài” giúp câu tiếng Việt có chủ ngữ rõ ràng, chỉ Đức Chúa Jêsus theo văn mạch mà không thêm tên riêng vào bản văn.
- source_word: τοῖς μαθηταῖς
  choice: với các môn đồ
  rationale: μαθηταί được dịch theo cách gọi quen thuộc trong văn cảnh Phúc Âm. Bản Hy Lạp không có từ sở hữu “của Ngài”, nên không thêm vào.
theological_decisions:
- issue: Phân biệt các nhóm người nghe trong cảnh này
  choice: Ngài trực tiếp nói với các môn đồ trong khi toàn dân đang lắng nghe.
  alternative: Ngài trực tiếp nói với toàn dân; hoặc Ngài nói riêng với các môn đồ, tách khỏi dân chúng.
  rationale: Kết cấu sinh cách tuyệt đối xác lập bối cảnh công khai là toàn dân đang nghe, còn cụm tặng cách τοῖς μαθηταῖς xác định các môn đồ là người được trực tiếp nói với. Bản dịch giữ nguyên cả hai yếu tố.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “toàn dân” thay vì “đám đông” để giữ nghĩa cộng đồng của λαός; dùng “nói” thay vì “phán” để phản ánh tính trung tính của λέγω.
