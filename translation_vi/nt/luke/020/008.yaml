- from: 'Đức Giê-su nói với họ: “Ta cũng không nói cho các ông biết ta làm những việc này bởi thẩm quyền nào.”'
  to: 'Đức Giê-su nói với họ: “Ta cũng không cho các ông biết Ta làm những việc này với thẩm quyền nào.”'
  rationale: Hiệu chỉnh nhẹ vì tính tự nhiên và độ sáng rõ của cú pháp tiếng Việt, không thay đổi nghĩa, lực đối đáp của οὐδέ, số nhiều của ταῦτα, hay sự mơ hồ vốn có về nguồn thẩm quyền.
