  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: vi
  text: 'Đức Giê-su nói với họ: “Ta cũng không cho các ông biết Ta làm những việc này với thẩm quyền nào.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Đức Giê-su nói với họ
  rationale: Dịch tự nhiên lời dẫn chuyện và giữ đối tượng số nhiều của αὐτοῖς. Không nhất thiết dịch καί thành “và” ở đầu câu vì tiếng Việt hiện đại thường lược liên từ này trong mạch kể mà không làm mất quan hệ với câu trước.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Ta cũng không nói cho các ông biết
  rationale: οὐδέ nối lời từ chối của Đức Giê-su với việc họ vừa không trả lời; “cũng không” thể hiện rõ lực đáp lại ấy. “Nói cho... biết” diễn đạt tự nhiên λέγω với người nhận và nội dung được ngầm hiểu, đồng thời không buộc phải chuyển hiện tại Hy Lạp thành tương lai.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: bởi thẩm quyền nào
  rationale: Cụm này hỏi về cơ sở hoặc thẩm quyền chính đáng mà Đức Giê-su dựa vào để hành động. “Bởi thẩm quyền nào” vừa tự nhiên vừa phân biệt ἐξουσία với sức mạnh thuần túy.
- source_word: ταῦτα
  choice: những việc này
  rationale: Giữ rõ số nhiều của đại từ chỉ định và quy chiếu đến các hành động đang bị chất vấn.
- source_word: ποιῶ
  choice: ta làm
  rationale: Hiện tại đơn diễn tả hoạt động của Đức Giê-su trong bối cảnh này; “làm” là cách diễn đạt trực tiếp, tự nhiên.
theological_decisions:
- issue: Việc Đức Giê-su từ chối trả lời các nhà lãnh đạo
  choice: Dịch như một lời từ chối trực tiếp, không giải thích thêm động cơ.
  alternative: Diễn giải rằng Đức Giê-su né tránh câu hỏi hoặc công khai phán xét sự vô tín của họ.
  rationale: Bản văn chỉ nói rằng Đức Giê-su cũng không cho họ biết mình hành động bởi thẩm quyền nào; cần giữ nguyên sức căng tu từ và không thêm phán đoán thần học ngoài câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; cặp đại từ “Ta/các ông” phù hợp với lời đối đáp công khai, giữ uy nghiêm mà không quá cổ.
