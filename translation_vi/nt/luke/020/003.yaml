base_translation:
  language: en
  yaml_path: translation/nt/luke/020/003.yaml
  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: vi
  text: 'Nhưng Ngài đáp lại họ: “Ta cũng sẽ hỏi các ông một câu, và các ông hãy nói cho Ta biết:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Nhưng Ngài đáp lại họ
  rationale: Diễn đạt tự nhiên cấu trúc phân từ kèm động từ nói, giữ sắc thái đáp lời của ἀποκριθείς và nét chuyển ý/đối lập nhẹ của δέ mà không lặp vụng về ‘đáp... nói’.
- source_word: Ἐρωτήσω ὑμᾶς
  choice: Ta sẽ hỏi các ông
  rationale: Giữ nghĩa tương lai của ἐρωτάω và cho thấy đối tượng được hỏi là nhóm người đang đối thoại với Chúa Giê-su.
- source_word: κἀγὼ
  choice: Ta cũng
  rationale: 'Giữ sắc thái nhấn mạnh và tương ứng của καὶ ἐγώ: họ chất vấn Ngài, và Ngài cũng sẽ hỏi họ.'
- source_word: λόγον
  choice: một câu
  rationale: Trong kết cấu với ἐρωτάω, λόγον chỉ điều được hỏi. ‘Một câu’ tự nhiên trong tiếng Việt và ít dư thừa hơn ‘một câu hỏi’ sau động từ ‘hỏi’, đồng thời vẫn phản ánh nghĩa rộng ‘lời/việc’ của danh từ.
- source_word: καὶ εἴπατέ μοι
  choice: và các ông hãy nói cho Ta biết
  rationale: Giữ mệnh lệnh số nhiều và đại từ μοι; cách nói này tự nhiên, trực tiếp, không tự ý đổi động từ ‘nói’ thành ‘trả lời’.
theological_decisions:
- issue: Cách xưng hô của Chúa Giê-su với nhóm lãnh đạo tôn giáo
  choice: Ta / các ông
  alternative: Tôi / các ông; Ta / các ngươi
  rationale: ‘Ta / các ông’ truyền đạt quan hệ đối thoại trang trọng nhưng đối đầu trong bối cảnh, không dùng ‘các ngươi’ vốn dễ tạo sắc thái cổ hoặc khinh miệt mạnh hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘Ngài’ để chỉ Chúa Giê-su trong lời kể, còn lời thoại dùng cặp ‘Ta / các ông’. Dấu hai chấm cuối câu được giữ vì lời của Chúa Giê-su dẫn sang câu hỏi ở câu kế tiếp.
