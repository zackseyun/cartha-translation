  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: vi
  text: 'Bấy giờ, một số người thuộc phái Sa-đu-sê, là những người nói rằng không có sự sống lại, đến hỏi Người:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσελθόντες
  choice: đến
  rationale: Phân từ bất định chỉ việc họ tiến đến trước khi hỏi; “đến” tự nhiên trong tiếng Việt và vẫn thể hiện sự tiếp cận.
- source_word: δέ
  choice: Có
  rationale: δέ đánh dấu bước chuyển trong mạch kể hơn là sự tương phản mạnh; câu hiện sinh với “Có” là cách mở tự nhiên trong tiếng Việt, không cần dịch máy móc thành “bấy giờ”.
- source_word: τινες τῶν Σαδδουκαίων
  choice: mấy người thuộc phái Sa-đu-sê
  rationale: 'Giữ sắc thái bộ phận: đây là một số người trong nhóm Sa-đu-sê, không nhất thiết toàn thể nhóm.'
- source_word: οἱ ἀντιλέγοντες ἀνάστασιν μὴ εἶναι
  choice: những người nói rằng không có sự sống lại
  rationale: Cụm phân từ cùng mệnh đề nguyên mẫu nêu lập trường của họ. “Nói rằng không có” sát nghĩa và tự nhiên, đồng thời không cường hóa thành một thuật ngữ thần học vượt quá câu Hy Lạp.
- source_word: ἀνάστασιν
  choice: sự sống lại
  rationale: Cách diễn đạt phổ thông, trang trọng cho khái niệm người chết sống lại; không thêm đối tượng hoặc thời điểm mà nguyên văn không nêu.
- source_word: ἐπηρώτησαν αὐτόν
  choice: hỏi Đức Chúa Jêsus
  rationale: ἐπερωτάω có thể là “hỏi” hoặc “chất vấn”; tại điểm này “hỏi” giữ trung tính, còn tính thử thách sẽ được bối cảnh tiếp theo làm rõ. Đại từ αὐτόν quy chiếu về Đức Chúa Jêsus, nên nêu tên giúp câu đứng riêng rõ nghĩa.
theological_decisions:
- issue: Cách diễn đạt lập trường của người Sa-đu-sê về sự sống lại
  choice: những người nói rằng không có sự sống lại
  alternative: những người phủ nhận có sự sống lại
  rationale: Nguyên văn mô tả điều họ nói/chủ trương, không triển khai thêm bản chất hay phạm vi của sự sống lại. Cách chọn giữ nguyên tuyên bố phủ định mà không nhập thêm hệ thống giáo lý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “phái Sa-đu-sê” để nhận diện nhóm lịch sử; dùng “Đức Chúa Jêsus” nhằm làm rõ đại từ khi câu được trình bày độc lập. Dấu gạch ngang cô lập mệnh đề mô tả, giúp câu dài vẫn sáng rõ.
source_grounding:
  english_pob_role: consult_only
