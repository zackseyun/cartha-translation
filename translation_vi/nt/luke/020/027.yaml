revisions:
- from: Có mấy người thuộc phái Sa-đu-sê—những người nói rằng không có sự sống lại—đến hỏi Đức Chúa Jêsus,
  to: 'Bấy giờ, một số người thuộc phái Sa-đu-sê, là những người nói rằng không có sự sống lại, đến hỏi Người:'
  rationale: Sửa cách mở câu để phản ánh mạch kể của δέ và dùng lối diễn đạt tự nhiên hơn cho thành ngữ bộ phận. Thay danh xưng được thêm vào bằng “Người”, tương ứng với đại từ αὐτόν mà vẫn phù hợp với văn phong tôn trọng của bản dịch. Giữ nguyên phát biểu về sự sống lại mà không diễn giải thêm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:33:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các ý chính: một số người Sa-đu-sê đến và hỏi; họ giữ lập trường không có sự sống lại. Tuy nhiên, αὐτόν chỉ là đại từ “người/ngài ấy”; việc thay bằng “Đức Chúa Jêsus” thêm danh xưng không có trong câu Hy Lạp. Cũng nên thể hiện δέ bằng một từ nối diễn tiến tự nhiên như “Bấy giờ” trong bản dịch câu đứng độc lập.'
  naturalness: “Một số người thuộc phái Sa-đu-sê” tự nhiên hơn “Có mấy người thuộc phái Sa-đu-sê” trong văn xuôi Kinh Thánh hiện đại. Mệnh đề quan hệ với dấu phẩy đọc trôi chảy hơn dấu gạch ngang ở đây.
  terminology: Giữ “phái Sa-đu-sê” và “sự sống lại”, là các thuật ngữ rõ nghĩa và phù hợp. Không dùng danh xưng “Đức Chúa” trong chỗ nguyên văn chỉ dùng đại từ, để tránh bổ sung sắc thái thần học vào câu.
  issues:
  - severity: medium
    issue: “Đức Chúa Jêsus” mở rộng αὐτόν.
    rationale: Nguyên văn chỉ nói “hỏi người ấy/ngài ấy”. Dù ngữ cảnh quy chiếu về Chúa Jêsus, danh xưng “Đức Chúa” không xuất hiện trong câu và bổ sung một tước hiệu thần học.
  - severity: low
    issue: “Có mấy người” chưa phản ánh rõ chức năng diễn tiến của δέ và kém tự nhiên hơn trong văn xuôi hiện đại.
    rationale: “Bấy giờ, một số người...” vừa giữ mạch tự sự của δέ vừa diễn đạt tự nhiên τινες τῶν.
  revised_text: 'Bấy giờ, một số người thuộc phái Sa-đu-sê, là những người nói rằng không có sự sống lại, đến hỏi Người:'
