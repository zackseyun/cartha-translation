  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: vi
  text: Ông lại sai[a] một người thứ ba; nhưng bọn tá điền cũng làm người này bị thương rồi ném người ấy ra ngoài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “ông thêm việc sai một người thứ ba,” một thành ngữ có nghĩa là ông tiếp tục sai hoặc lại sai một người thứ ba.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: lại sai
  rationale: Cấu trúc προστίθημι với động từ nguyên mẫu diễn tả việc tiếp tục hoặc làm thêm một hành động. “Lại sai” tự nhiên trong tiếng Việt và giữ được ý lặp lại.
- source_word: τρίτον πέμψαι
  choice: sai người thứ ba đến
  rationale: Tiếng Hy Lạp lược bỏ danh từ chỉ người vì đã rõ từ ngữ cảnh. Tiếng Việt cần thêm “người” để câu tự nhiên, nhưng không cần lặp lại “đầy tớ”; “đến” làm rõ hướng sai phái theo mạch truyện.
- source_word: οἱ δὲ
  choice: nhưng bọn tá điền
  rationale: δέ đánh dấu sự chuyển hướng tương phản. Nêu lại “bọn tá điền” giúp chủ thể rõ ràng trong một câu đứng riêng và phù hợp với ngữ cảnh trước đó.
- source_word: καὶ τοῦτον
  choice: cũng ... người này
  rationale: καί nhấn mạnh rằng người thứ ba cũng chịu cách đối xử tương tự. Vị trí “cũng” trước cụm động từ là tự nhiên trong tiếng Việt.
- source_word: τραυματίσαντες
  choice: làm ... bị thương
  rationale: τραυματίζω chỉ việc gây thương tích; cách diễn đạt này trực tiếp, rõ ràng và không thêm ý “đánh” vốn không có trong từ Hy Lạp.
- source_word: ἐξέβαλον
  choice: ném ra ngoài
  rationale: ἐκβάλλω ở đây diễn tả hành động mạnh, bạo lực. “Ném ra ngoài” giữ được sắc thái ấy rõ hơn “đuổi ra”.
