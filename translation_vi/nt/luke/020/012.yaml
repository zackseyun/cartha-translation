  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo chủ thể đã có trong ngữ cảnh, “bọn tá điền” để xác định rõ nhóm hành động, và giữ nhịp kể ngắn gọn của nguyên văn.
