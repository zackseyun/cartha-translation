  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: vi
  text: 'Họ nói với Ngài: “Hãy nói cho chúng tôi biết: Ngài làm những việc này dựa trên thẩm quyền nào? Hay ai là người đã ban thẩm quyền này cho Ngài?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Họ
  rationale: Liên từ καὶ nối tiếp diễn biến câu trước; trong tiếng Việt, không cần dịch thành một từ riêng ở đầu câu vì mạch kể vẫn rõ và tự nhiên.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: Họ nói với Ngài
  rationale: Diễn đạt tự nhiên cấu trúc có phần trùng ý trong tiếng Hy Lạp, đồng thời giữ rõ người được nói với là Chúa Giê-xu.
- source_word: Εἰπὸν ἡμῖν
  choice: Xin nói cho chúng tôi biết
  rationale: Thể hiện mệnh lệnh trực tiếp nhưng có sắc thái giao tiếp tự nhiên; từ “xin” ở đây không nhất thiết biểu thị thái độ khiêm nhường mà phù hợp với cách đặt yêu cầu trong tiếng Việt.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: lấy thẩm quyền nào
  rationale: Thành ngữ tiếng Việt tự nhiên để hỏi về cơ sở hoặc nguồn tư cách hành động, tương ứng với ἐν cộng cách dữ liệu trong ngữ cảnh này.
- source_word: ταῦτα ποιεῖς
  choice: mà làm những việc này
  rationale: Giữ số nhiều của ταῦτα và diễn tả hành động đang được chất vấn trong bối cảnh trước mắt.
- source_word: ἢ
  choice: Hay
  rationale: Giữ câu hỏi thứ hai như một cách nêu khác nhưng liên hệ chặt chẽ với câu hỏi về thẩm quyền.
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: ai là người đã ban ... cho Ngài
  rationale: Giữ lực danh từ hóa của ὁ δούς bằng “ai là người”, thay vì rút gọn hoàn toàn thành “ai đã ban”.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: thẩm quyền ấy
  rationale: ἐξουσία chỉ quyền hợp pháp hoặc tư cách được phép hành động, không chỉ năng lực; “ấy” quy chiếu tự nhiên đến thẩm quyền vừa được nhắc đến.
theological_decisions:
- issue: Ý nghĩa của ἐξουσία trong cuộc chất vấn tại đền thờ
  choice: thẩm quyền
  alternative: quyền năng; quyền
  rationale: Bối cảnh tập trung vào tính chính đáng và nguồn ủy quyền cho những việc Chúa Giê-xu làm. “Thẩm quyền” giữ được sắc thái thể chế và thần học, không thu hẹp ý nghĩa thành năng lực thuần túy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” làm đại từ kính trọng dành cho Chúa Giê-xu; không thêm cách diễn giải giáo phái. Cấu trúc hai câu hỏi và sự phân biệt giữa cơ sở thẩm quyền với người ban thẩm quyền được giữ nguyên.
