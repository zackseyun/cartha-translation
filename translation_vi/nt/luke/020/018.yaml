  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: vi
  text: Ai ngã trên tảng đá ấy sẽ bị vỡ tan[a]; còn tảng đá ấy rơi trúng ai, thì sẽ nghiền nát người đó[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ bị đập tan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sẽ nghiền người đó thành bụi” hoặc “sẽ tung người đó ra như trấu”; động từ Hy Lạp mạnh hơn ý va đập thông thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Ai ngã
  rationale: Cụm phân từ có mạo từ được dùng như danh từ với ý nghĩa khái quát. “Ai ngã” là cách diễn đạt tự nhiên trong tiếng Việt và vẫn giữ phạm vi bất định, phổ quát của nguyên văn.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: trên tảng đá ấy
  rationale: ἐπί với đối cách sau πίπτω chỉ chuyển động ngã lên hoặc vào tảng đá; “trên tảng đá ấy” giữ rõ đại từ chỉ định ἐκεῖνον và phù hợp với hình ảnh.
- source_word: συνθλασθήσεται
  choice: sẽ bị vỡ tan
  rationale: Động từ tương lai bị động diễn tả việc bị đập vỡ hoặc tan thành nhiều mảnh. “Bị vỡ tan” giữ thể bị động và mức độ nghiêm trọng mà không xác định quá mức cơ chế.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: còn tảng đá ấy rơi trúng ai
  rationale: Mệnh đề quan hệ với ἄν và động từ giả định diễn tả đối tượng bất định. Việc nêu lại “tảng đá ấy” làm rõ chủ thể ngầm của πέσῃ trong tiếng Việt, còn “ai” bảo toàn tính khái quát.
- source_word: λικμήσει
  choice: sẽ nghiền nát
  rationale: λικμάω có thể chỉ việc nghiền rồi sàng hoặc tung rải. Trong hình ảnh phán xét này, “nghiền nát” truyền đạt sức hủy diệt mạnh hơn một va chạm thông thường; các sắc thái “nghiền thành bụi” và “tung ra như trấu” được ghi ở chú thích.
- source_word: αὐτόν
  choice: người đó
  rationale: Đại từ giống đực số ít quy chiếu về người bất định trong mệnh đề trước. Tiếng Việt không đánh dấu giống ở đại từ theo cách Hy Lạp; “người đó” giữ số ít và sự quy chiếu rõ ràng, không thêm giới tính mà ngôn ngữ đích không đòi hỏi.
theological_decisions:
- issue: Hình ảnh tảng đá thi hành sự phán xét
  choice: Giữ nguyên tảng đá như tác nhân của sự hủy diệt quyết liệt, không làm nhẹ ẩn dụ.
  alternative: Diễn đạt nhẹ hơn như chỉ vấp ngã hoặc bị thương.
  rationale: Trong văn cảnh, tảng đá từ lời trích dẫn ngay trước đó mang hình ảnh về sự phán xét dứt khoát. Cả συνθλασθήσεται lẫn λικμήσει đều có sức nặng mạnh; bản dịch giữ nguyên sức căng thần học mà không giải nghĩa vượt quá câu.
- issue: Đại từ giống đực mang nghĩa khái quát
  choice: Dịch αὐτόν là “người đó”, phù hợp với hệ thống đại từ tự nhiên của tiếng Việt.
  alternative: Dùng “ông ấy” hoặc một đại từ nam giới để mô phỏng giống đực ngữ pháp của tiếng Hy Lạp.
  rationale: Giống đực trong nguyên văn đi với một tiền ngữ khái quát, không khẳng định đối tượng chỉ là nam giới. “Người đó” giữ số ít và quan hệ quy chiếu mà không đưa vào tiếng Việt một sắc thái giới tính không tự nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế đối xứng được giữ, nhưng chủ thể “tảng đá ấy” được lặp lại ở vế sau để tránh mơ hồ trong tiếng Việt. “Vỡ tan” và “nghiền nát” phân biệt hai động từ Hy Lạp đồng thời duy trì mức độ tăng tiến của hình ảnh.
