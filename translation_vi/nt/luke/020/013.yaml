language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: vi
  text: 'Bấy giờ, chủ vườn nho nói[a]: “Ta sẽ làm gì? Ta sẽ sai con trai yêu dấu của ta đến; có lẽ họ sẽ kính trọng con ta[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “chủ của vườn nho.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp này cũng có thể mang nghĩa “biết hổ thẹn trước” hoặc “tỏ lòng nể trọng đối với.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: chủ vườn nho
  rationale: Trong bối cảnh dụ ngôn, cụm này chỉ người sở hữu và có quyền trên vườn nho. “Chủ vườn nho” tự nhiên trong tiếng Việt và không áp đặt danh xưng thần học “Chúa” lên nhân vật ở bình diện câu chuyện.
- source_word: Τί ποιήσω;
  choice: Ta phải làm gì đây?
  rationale: Diễn đạt tự nhiên sắc thái tự hỏi và cân nhắc của thể giả định deliberative; “đây” làm rõ giọng độc thoại mà không thêm nội dung.
- source_word: πέμψω
  choice: Ta sẽ sai ... đến
  rationale: Thì tương lai cho thấy chủ vườn đã quyết định cách hành động; “sai ... đến” phù hợp quan hệ thẩm quyền và tự nhiên trong ngữ cảnh.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: con trai yêu dấu của ta
  rationale: Giữ rõ giới tính của υἱός và sức nặng tình cảm của ἀγαπητός, đồng thời bảo tồn âm vang Kitô học có thể có mà không diễn giải thêm.
- source_word: ἴσως
  choice: có lẽ
  rationale: Diễn đạt đúng sự mong đợi nhưng không chắc chắn.
- source_word: τοῦτον
  choice: nó
  rationale: Đại từ chỉ trực tiếp người con vừa được nhắc đến. Trong tiếng Việt, “nó” tự nhiên trong lời người cha nói về con mình ở ngôi thứ ba, dù sắc thái xưng hô có thể thay đổi theo văn phong.
- source_word: ἐντραπήσονται
  choice: họ sẽ kính trọng
  rationale: Trong ngữ cảnh này, động từ mang nghĩa tỏ lòng tôn trọng hoặc nể trọng; bản dịch chính ưu tiên cách nói rõ ràng, hiện đại, còn nghĩa sát chữ hơn được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch κύριος trong dụ ngôn, nơi nhân vật có thể tượng trưng cho Đức Chúa Trời
  choice: chủ vườn nho
  alternative: chúa của vườn nho; chủ nhân vườn nho
  rationale: “Chủ vườn nho” giữ nghĩa trực tiếp ở bình diện câu chuyện và vẫn để người đọc nhận ra ý nghĩa tượng trưng, thay vì ép liên hệ thần học bằng danh xưng “Chúa”.
- issue: Âm vang Kitô học của cụm “người con yêu dấu”
  choice: con trai yêu dấu của ta
  alternative: con trai ta, người yêu dấu
  rationale: Cách dịch này giữ cả quan hệ cha-con lẫn sắc thái “yêu dấu”, có thể gợi lại lời phán về Con trong sách Lu-ca, nhưng không mở rộng thành lời giải nghĩa.
- issue: Sắc thái của ἐντραπήσονται
  choice: kính trọng
  alternative: biết hổ thẹn trước; nể trọng
  rationale: “Kính trọng” phù hợp diễn tiến dụ ngôn, nhưng chú thích bảo tồn khả năng hiểu theo nghĩa “hổ thẹn trước” hay “tỏ lòng nể trọng” của động từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ta” trong lời độc thoại của chủ vườn để thể hiện địa vị và giọng kể dụ ngôn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
