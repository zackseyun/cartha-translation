review_pass:
  verdict: revise
  source_fidelity: Cần tránh thêm sắc thái toàn thể bằng “cả”; οἱ ἑπτά là “bảy người ấy/the seven,” dù mệnh đề sau vẫn hàm ý mỗi người trong bảy người đều có bà làm vợ. “Lấy ... làm vợ” dễ chuyển trọng tâm từ tình trạng “có ... làm vợ” của ἔσχον αὐτὴν γυναῖκα sang hành động cưới. “Người phụ nữ ấy” phản ánh rõ ἡ γυνή hơn đại từ “bà ấy.”
  naturalness: Bản sửa vẫn là tiếng Việt hiện đại, trang trọng vừa phải. “Người phụ nữ ấy” phù hợp văn mạch tường thuật Kinh Thánh và tránh đại từ có thể hơi khẩu ngữ hoặc mơ hồ khi đứng đầu câu.
  terminology: Giữ “sự sống lại” cho ἀνάστασις, không thêm “của người chết.” Giữ “trở thành vợ của ai trong số họ” để phản ánh γίνεται γυνή và τίνος αὐτῶν mà không giải thích thần học.
  issues:
  - severity: medium
    issue: “cả bảy người” thêm nét nhấn mạnh không có từ tương ứng trực tiếp trong οἱ ἑπτά.
    rationale: Theo văn bản Hy Lạp và vệt kiểm toán tiếng Anh, nên dùng “bảy người ấy”; ý mỗi người trong nhóm có thể được diễn đạt bằng “đều” trong vị ngữ.
  - severity: low
    issue: “đã lấy bà làm vợ” thiên về hành động kết hôn.
    rationale: ἔσχον αὐτὴν γυναῖκα là thành ngữ “có bà ấy làm vợ”; cách dịch này bảo toàn trọng tâm quan hệ/tình trạng hơn.
  - severity: low
    issue: “bà ấy” không nêu rõ danh từ ἡ γυνή ở lần xuất hiện đầu.
    rationale: “Người phụ nữ ấy” giữ tham chiếu danh từ của nguyên văn và có đăng ký văn phong phù hợp hơn.
  revised_text: Vậy, trong sự sống lại[a], người phụ nữ ấy sẽ trở thành vợ của ai trong số họ? Vì bảy người ấy đều đã có bà ấy làm vợ.[b]
