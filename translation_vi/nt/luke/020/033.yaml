id: LUK.20.33
reference: Luke 20:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: vi
  text: Vậy, trong sự sống lại[a], người phụ nữ ấy sẽ trở thành vợ của ai trong số họ? Vì bảy người ấy đều đã có bà ấy làm vợ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào lúc sống lại”.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “đã có bà ấy làm vợ”; cũng có thể dịch: “đã cưới bà ấy”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: bà ấy
  rationale: Chỉ người phụ nữ đã được nhắc đến trong tình huống trước; đại từ này tự nhiên trong tiếng Việt và tránh lặp nặng nề.
- source_word: οὖν
  choice: vậy
  rationale: Giữ chức năng suy luận của từ nối trong lập luận của người Sa-đu-sê.
- source_word: ἐν τῇ ἀναστάσει
  choice: trong sự sống lại
  rationale: Bám sát giới từ và danh từ Hy Lạp, đồng thời giữ nguyên cách đặt vấn đề của người hỏi mà không thêm lời giải thích thần học.
- source_word: τίνος αὐτῶν
  choice: của ai trong số họ
  rationale: Diễn đạt tự nhiên quan hệ được hỏi bằng đại từ sở hữu ở cách sở hữu trong tiếng Hy Lạp.
- source_word: γίνεται γυνή
  choice: sẽ trở thành vợ
  rationale: Giữ sắc thái 'trở thành' của γίνομαι và nghĩa hôn nhân rõ ràng của γυνή trong vị trí vị ngữ.
- source_word: οἱ ἑπτὰ
  choice: cả bảy người
  rationale: Chỉ nhóm bảy người đã được nhắc đến; 'cả bảy người' là cách nói tiếng Việt tự nhiên để nêu toàn bộ nhóm, dù nguyên văn sát chữ là 'bảy người ấy'.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: đều đã lấy bà làm vợ
  rationale: Diễn đạt thành ngữ hôn nhân bằng tiếng Việt tự nhiên, đồng thời giữ cụm 'làm vợ' thay vì chỉ nói chung là kết hôn.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ về sự sống lại trong câu hỏi của người Sa-đu-sê
  choice: Dịch ἀνάστασις đơn giản là 'sự sống lại', không thêm đối tượng hay lời giải thích.
  alternative: '''sự sống lại của người chết'''
  rationale: Câu này chỉ có danh từ ἀνάστασις; không nên đưa thêm từ ngữ từ ngữ cảnh rộng hơn hoặc giải quyết trước sự căng thẳng thần học trong câu hỏi.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà ấy” cho người phụ nữ đang được nói đến và “cả bảy người” cho nhóm bảy anh em; các phương án sát chữ hơn được ghi ở chú thích.
