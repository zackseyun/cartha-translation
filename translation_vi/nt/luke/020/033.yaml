- from: Vậy, trong sự sống lại[a], bà ấy sẽ trở thành vợ của ai trong số họ? Vì cả bảy người đều đã lấy bà làm vợ.[b]
  to: Vậy, trong sự sống lại[a], người phụ nữ ấy sẽ trở thành vợ của ai trong số họ? Vì bảy người ấy đều đã có bà ấy làm vợ.[b]
  rationale: Bản sửa sát hơn với ἡ γυνή, οἱ ἑπτά, và thành ngữ ἔσχον αὐτὴν γυναῖκα, đồng thời giữ cách diễn đạt tự nhiên, hiện đại và không thêm diễn giải thần học.
