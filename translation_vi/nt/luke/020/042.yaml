id: LUK.20.42
reference: Luke 20:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: vi
  text: 'Vì chính Đa-vít nói trong sách Thi Thiên: “Chúa[a] phán với Chúa của tôi: ‘Hãy ngồi bên phải Ta.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo bản Hê-bơ-rơ của Thi Thiên 110:1: “ĐỨC CHÚA phán với Chúa của tôi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: Vì chính
  rationale: γάρ giới thiệu lời giải thích nên được dịch là “vì”; αὐτός mang ý nhấn mạnh, được thể hiện tự nhiên bằng “chính” trước tên Đa-vít.
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt quen thuộc.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại trong công thức trích dẫn được giữ bằng “nói”, diễn tả lời Kinh Thánh vẫn đang lên tiếng.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: trong sách Thi Thiên
  rationale: βίβλος là “sách”, còn ψαλμῶν là sở hữu cách số nhiều; “sách Thi Thiên” là cách gọi tự nhiên và quen thuộc trong tiếng Việt.
- source_word: Εἶπεν
  choice: phán
  rationale: Động từ aorist mang nghĩa “đã nói”; trong ngữ cảnh lời Đức Chúa Trời, “phán” là cách diễn đạt trang trọng, tự nhiên, không thêm nội dung ngoài động từ.
- source_word: κύριος
  choice: Chúa
  rationale: Bám theo bản Hy Lạp κύριος, không tự động thay bằng danh riêng giao ước từ bản Hê-bơ-rơ; viết hoa vì chỉ về Đức Chúa Trời trong lời trích dẫn.
- source_word: τῷ κυρίῳ μου
  choice: với Chúa của tôi
  rationale: Dativus sau động từ nói được diễn đạt bằng “với”; “Chúa của tôi” giữ cả κύριος và đại từ sở hữu μου, đồng thời bảo toàn sự phân biệt và sức nặng thần học giữa hai lần dùng κύριος.
- source_word: Κάθου
  choice: Hãy ngồi
  rationale: Mệnh lệnh của κάθημαι được chuyển bằng cấu trúc cầu khiến tự nhiên “hãy ngồi”.
- source_word: ἐκ δεξιῶν μου
  choice: bên phải ta
  rationale: Đây là thành ngữ chỉ vị trí ở phía tay phải của người nói; “bên phải ta” tự nhiên hơn cách dịch từng chữ và không diễn giải thêm ý nghĩa về địa vị.
theological_decisions:
- issue: Cách dịch κύριος thứ nhất trong lời trích Thi Thiên 110:1, nơi bản Hê-bơ-rơ có danh YHWH
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Văn bản nguồn trực tiếp của Lu-ca là tiếng Hy Lạp và dùng κύριος, nên bản chính dịch “Chúa”. Chú thích ghi nhận nền Hê-bơ-rơ dùng danh giao ước mà không thay thế dữ liệu của bản Hy Lạp.
- issue: Cách dịch κύριος thứ hai trong lời trích có ý nghĩa về Đấng Mê-si
  choice: Chúa của tôi
  alternative: chủ của tôi
  rationale: “Chúa của tôi” giữ được nghĩa và sức nặng của κύριος trong lập luận của Chúa Giê-su mà không xác định thêm căn tính hay bản thể của nhân vật được gọi như vậy; “chủ của tôi” tuy khả dĩ về từ vựng nhưng làm yếu liên kết văn chương và thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu hai chấm cùng ngoặc kép lồng nhau để thể hiện rõ lời trích dẫn bên trong lời nói. Đại từ “ta” trong mệnh lệnh giữ sắc thái trang trọng phù hợp với lời Đức Chúa Trời. Dấu chú thích [a] được đặt sau toàn bộ câu trích dẫn vì chú thích liên quan đến cách đọc của vế mở đầu trong Thi Thiên 110:1.
