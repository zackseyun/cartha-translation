  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và nghĩa cơ bản của tiếng Hy Lạp: γάρ được phản ánh bằng “Vì”, αὐτός bằng “chính”, λέγει bằng hiện tại “nói”, và mệnh lệnh “Hãy ngồi bên phải Ta” tương ứng tự nhiên với Κάθου ἐκ δεξιῶν μου. “Chúa” cho cả hai lần κύριος bảo toàn sự căng thẳng của nguyên văn, không đồng nhất hoặc giải thích quá mức hai nhân vật.'
