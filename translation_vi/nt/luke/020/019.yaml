  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: vi
  text: Các thầy thông giáo và các thượng tế tìm cách bắt Đức Giê-su ngay lúc ấy[a], nhưng họ sợ dân chúng, vì biết rằng Ngài đã kể dụ ngôn này nhằm chống lại họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đặt tay trên Ngài”; cũng có thể dịch là “tóm lấy Ngài” hoặc “bắt giữ Ngài”.'
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch sát hơn là “nói với họ” hoặc “nói về họ”; trong văn cảnh, cụm từ này có ý rằng dụ ngôn nhắm vào họ để lên án.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: tìm cách
  rationale: Diễn đạt ý định và nỗ lực được động từ aorist tóm lược, nhưng không hàm ý rằng họ đã thành công.
- source_word: γραμματεῖς
  choice: các thầy thông giáo
  rationale: Cách gọi quen thuộc trong văn cảnh Phúc Âm, chỉ nhóm chuyên chép, nghiên cứu và giảng dạy Luật pháp; tránh đồng nhất hoàn toàn họ với mọi người dạy luật.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo thuộc hàng tư tế cấp cao, chứ không hàm ý có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: bắt Đức Giê-su
  rationale: Thành ngữ có nghĩa đen là đặt tay trên người nào đó, nhưng trong văn cảnh chỉ hành động khống chế hoặc bắt giữ mang tính thù địch. Bản dịch chính dùng cách nói tự nhiên; chú thích giữ hình ảnh và độ mở của nguyên ngữ.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: ngay lúc ấy
  rationale: Truyền đạt sự tức thời được nhấn mạnh mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: họ sợ dân chúng
  rationale: λαός ở đây chỉ dân chúng nói chung, không nhất thiết chỉ một đám đông đang tụ họp.
- source_word: ἔγνωσαν
  choice: biết
  rationale: Diễn đạt trực tiếp việc họ nhận ra đối tượng mà dụ ngôn nhắm đến, không thêm sắc thái giải thích quá mức.
- source_word: πρὸς αὐτοὺς
  choice: nhằm chống lại họ
  rationale: Văn cảnh phản ứng thù địch cho thấy họ hiểu dụ ngôn lên án mình. Cách dịch này truyền đạt lực đối nghịch, còn nghĩa sát chữ hơn được ghi trong chú thích.
- source_word: παραβολὴν
  choice: dụ ngôn
  rationale: Thuật ngữ tiếng Việt quen thuộc và chính xác cho παραβολή trong các sách Phúc Âm.
theological_decisions:
- issue: Sắc thái của πρὸς αὐτοὺς đối với dụ ngôn Đức Giê-su vừa kể
  choice: Dụ ngôn nhằm chống lại, tức lên án, các lãnh đạo tôn giáo ấy.
  alternative: Dụ ngôn được nói với họ hoặc nói về họ.
  rationale: Phản ứng tức thì trong mạch văn cho thấy họ nhận ra mình là đối tượng bị phê phán. Bản dịch chính giữ lực đối nghịch của câu mà không thêm kết luận giáo lý; chú thích bảo tồn khả năng dịch sát hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các thầy thông giáo” và “các thượng tế” để giữ các nhóm xã hội-lịch sử riêng biệt; dùng “ngay lúc ấy” thay cho lối dịch sát nhưng kém tự nhiên “ngay trong giờ ấy”. Tên “Đức Giê-su” được nêu để câu đơn lẻ rõ nghĩa, dù nguyên ngữ dùng đại từ.
