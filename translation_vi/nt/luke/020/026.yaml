  to: Họ không thể vin vào lời Ngài nói để bắt bẻ Ngài trước mặt dân chúng[a]; kinh ngạc về câu trả lời của Ngài, họ im lặng.
  rationale: Bản sửa giữ “vin vào” để phản ánh ý chộp lấy lời nói làm cớ, nhưng thêm “để bắt bẻ Ngài” và đặt “trước mặt dân chúng” sau hành động này nhằm loại bỏ mơ hồ cú pháp. Cấu trúc “kinh ngạc ..., họ im lặng” bảo tồn quan hệ phân từ rồi động từ chính của câu Hy Lạp.
