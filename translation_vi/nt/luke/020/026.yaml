  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: vi
  text: Họ không thể vin vào lời Ngài nói để bắt bẻ Ngài trước mặt dân chúng[a]; kinh ngạc về câu trả lời của Ngài, họ im lặng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nắm lấy lời Ngài nói”; tức là tìm cớ từ lời nói của Ngài để bắt bẻ Ngài.'
    reason: Phản ánh nghĩa đen hơn của ἐπιλαβέσθαι τοῦ ῥήματος, đồng thời làm rõ cách dùng thành ngữ trong ngữ cảnh.
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: không thể
  rationale: Diễn đạt trực tiếp ý không có khả năng làm điều họ định làm, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: vin vào lời Ngài nói
  rationale: Giữ được hình ảnh nắm lấy một lời phát biểu để làm cớ chống lại Chúa Giê-su, đồng thời phù hợp với kết cấu có bổ ngữ sở hữu trong tiếng Hy Lạp.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: trước mặt dân chúng
  rationale: Phản ánh nghĩa 'trước mặt, trong sự hiện diện của' và giữ sắc thái công khai trước dân chúng.
- source_word: θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ
  choice: họ kinh ngạc về câu trả lời của Ngài
  rationale: Chuyển phân từ sang một mệnh đề phối hợp tự nhiên, vẫn giữ phản ứng kinh ngạc trước câu trả lời.
- source_word: ἐσίγησαν
  choice: im lặng
  rationale: Diễn đạt gọn và tự nhiên hành động họ không nói gì nữa sau khi nghe câu trả lời.
