  - severity: low
    issue: “Gia tài” không biểu thị rõ đối tượng thừa kế xác định.
    rationale: ἡ κληρονομία có mạo từ và chỉ phần thừa kế đang được nhắc đến. “Phần thừa kế ấy” giữ thuật ngữ và tính xác định rõ hơn.
