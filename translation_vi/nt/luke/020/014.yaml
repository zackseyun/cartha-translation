reference: Luke 20:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: vi
  text: 'Nhưng khi những người trồng nho[a] thấy người con, họ bàn tính với nhau: “Đây là người thừa kế. Chúng ta hãy giết người này đi, để phần thừa kế ấy thuộc về chúng ta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tá điền” hoặc “nông dân”. Từ Hy Lạp chỉ những người làm nông; trong dụ ngôn này, họ làm việc trong một vườn nho.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: những người trồng nho
  rationale: Danh từ chỉ những người làm nông; trong ngữ cảnh trực tiếp của dụ ngôn, họ làm trong vườn nho. Cách dịch này giữ nét nông nghiệp cụ thể mà không đưa ý nghĩa pháp lý về tá điền vào chính danh từ.
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: họ bàn tính với nhau
  rationale: Động từ ở thì chưa hoàn thành cùng cụm chỉ sự tương tác qua lại diễn tả một cuộc trao đổi có tính cân nhắc, tính toán. “Bàn tính” tự nhiên trong tiếng Việt và không hàm ý tranh cãi.
- source_word: κληρονόμος
  choice: người thừa kế
  rationale: Tương đương pháp lý và tự nhiên trong tiếng Việt, phù hợp với mạch truyện.
- source_word: ἀποκτείνωμεν
  choice: chúng ta hãy giết nó đi
  rationale: Thể giả định ngôi thứ nhất số nhiều có chức năng khuyến dụ. “Hãy giết” trực tiếp, không thêm sự đánh giá pháp lý vốn có trong “sát hại”; tiểu từ “đi” làm lời xúi giục tự nhiên hơn.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: để gia tài thuộc về chúng ta
  rationale: Giữ quan hệ mục đích của ἵνα và diễn đạt tự nhiên kết quả họ mong muốn. “Gia tài” phù hợp hơn “quyền thừa kế” vì ở đây κληρονομία chỉ tài sản được thừa hưởng.
- source_word: δὲ
  choice: nhưng
  rationale: Thể hiện bước chuyển trần thuật có sắc thái tương phản nhẹ khi người con xuất hiện.
- source_word: ἰδόντες
  choice: khi ... thấy
  rationale: Phân từ bất định được diễn đạt thành mệnh đề thời gian để câu tiếng Việt rõ ràng, tự nhiên.
theological_decisions:
- issue: Cách gọi γεωργοὶ trong dụ ngôn về vườn nho
  choice: những người trồng nho
  alternative: tá điền; nông dân; người canh tác
  rationale: Bản dịch ưu tiên nghĩa từ vựng là người lao động nông nghiệp và đặc điểm vườn nho trong ngữ cảnh. “Tá điền” nêu rõ quan hệ thuê đất được suy ra từ toàn dụ ngôn nhưng không nằm sẵn trong danh từ này, nên được giữ làm phương án chú thích.
- issue: Ý nghĩa của κληρονομία
  choice: gia tài
  alternative: phần thừa kế; quyền thừa kế; cơ nghiệp
  rationale: “Gia tài” chỉ điều được thừa hưởng và phù hợp với động cơ chiếm hữu trong câu. Cách dịch không quyết định thêm tầng nghĩa biểu tượng thần học của dụ ngôn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. “Người con” được nêu rõ thay cho đại từ “người ấy” vì đối tượng đã được xác định trong ngữ cảnh trước; lời thoại dùng “nó” để phản ánh thái độ coi thường, thù nghịch của những người trồng nho mà không làm câu văn cổ kính.
