id: LUK.20.37
reference: Luke 20:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: vi
  text: Còn việc người chết được sống lại thì ngay cả Môi-se cũng đã cho biết trong đoạn nói về bụi gai[a], khi ông gọi Chúa[b] là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tại bụi gai”. Cụm từ Hy Lạp có thể chỉ chính khung cảnh ấy hoặc, theo lối dẫn Kinh Thánh, chỉ đoạn nói về bụi gai trong Xuất Ai Cập 3.'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “Chúa”; cách dùng này phản ánh lối dịch thông thường của Bản Bảy Mươi đối với danh riêng của Đức Chúa Trời trong Xuất Ai Cập 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: được sống lại
  rationale: Thể bị động hiện tại trong ngữ cảnh phục sinh được diễn đạt tự nhiên bằng “được sống lại”, vừa giữ hành động hàm ý do Đức Chúa Trời thực hiện vừa không thêm chủ thể vào câu.
- source_word: οἱ νεκροὶ
  choice: người chết
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ nghĩa tập thể của tính từ được dùng như danh từ.
- source_word: ἐμήνυσεν
  choice: đã cho biết
  rationale: Diễn đạt ý “làm cho biết, chỉ ra” mà không cường điệu thành một lời tuyên bố chính thức.
- source_word: ἐπὶ τῆς βάτου
  choice: trong đoạn nói về bụi gai
  rationale: Trong ngữ cảnh này, cụm từ có thể là cách dẫn đến phần Kinh Thánh về bụi gai; bản dịch chính diễn đạt rõ lối quy chiếu văn chương, còn nghĩa địa điểm được giữ trong chú thích.
- source_word: ὡς λέγει
  choice: khi ông gọi
  rationale: Động từ λέγει ở đây dẫn vào cấu trúc gọi Chúa là Đức Chúa Trời của các tổ phụ; “khi ông gọi” tự nhiên và phù hợp với cú pháp.
- source_word: κύριον
  choice: Chúa
  rationale: Giữ danh hiệu thần linh tương ứng với κύριος trong bản Hy Lạp, không thay trực tiếp bằng dạng viết hoa biểu thị danh riêng giao ước.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp
  rationale: Giữ sự lặp lại của θεόν để bảo tồn nhịp điệu và sức nhấn mạnh trong lời trích dẫn.
theological_decisions:
- issue: Ngôn ngữ phục sinh trong lập luận của Chúa Giê-su với người Sa-đu-sê
  choice: người chết được sống lại
  alternative: người chết sống lại
  rationale: Cách chọn giữ sắc thái bị động của ἐγείρονται và hàm ý hành động của Đức Chúa Trời, nhưng không thêm một khẳng định thần học ngoài văn bản.
- issue: Cách dịch κύριος trong lời dẫn liên quan đến Đức Chúa Trời của Israel
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA
  rationale: Bản Hy Lạp dùng κύριος, nên bản chính giữ “Chúa”; mối liên hệ với cách Bản Bảy Mươi thay thế danh Đức Chúa Trời trong Xuất Ai Cập 3 được trình bày ở chú thích thay vì đưa vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Môi-se”, “Áp-ra-ham”, “Y-sác”, “Gia-cốp” theo dạng tên quen thuộc; giữ phép lặp “Đức Chúa Trời của...” để phản ánh trọng âm tu từ của nguyên bản.
