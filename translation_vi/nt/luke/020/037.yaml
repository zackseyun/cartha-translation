  to: Còn việc người chết được sống lại thì ngay cả Môi-se cũng đã cho biết trong đoạn nói về bụi gai[a], khi ông gọi Chúa[b] là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác và Đức Chúa Trời của Gia-cốp.
