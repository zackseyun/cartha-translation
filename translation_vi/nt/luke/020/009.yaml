- from: 'Rồi Đức Giê-su bắt đầu kể cho dân chúng ngụ ngôn này: “Có một người trồng một vườn nho, cho những người làm vườn thuê, rồi đi xa trong một thời gian dài.”'
  to: 'Rồi Đức Giê-su bắt đầu kể cho dân chúng dụ ngôn này: “Có một người trồng một vườn nho, cho các tá điền thuê, rồi đi xa[a] trong một thời gian dài.”'
  rationale: Thay “ngụ ngôn” bằng “dụ ngôn” để dùng thuật ngữ Phúc Âm thông dụng hơn; thay “những người làm vườn” bằng “các tá điền” để phản ánh đúng những người thuê đất canh tác. Thêm chú thích cho “đi xa” theo khả năng ngữ nghĩa của ἀποδημέω, trong khi bản văn chính vẫn giữ độ mở của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
