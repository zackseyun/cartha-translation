  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: vi
  text: 'Rồi Đức Giê-su bắt đầu kể cho dân chúng dụ ngôn này: “Có một người trồng một vườn nho, cho các tá điền thuê, rồi đi xa[a] trong một thời gian dài.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đi sang một xứ khác trong một thời gian dài.” Động từ này có thể hàm ý rời khỏi quê quán, kể cả sang xứ khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Rồi ... bắt đầu
  rationale: δέ đánh dấu bước chuyển tiếp trong trình thuật, còn ἤρξατο diễn tả việc Đức Giê-su bắt đầu nói; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: kể cho dân chúng
  rationale: πρός với đối cách chỉ đối tượng được nói với; khi παραβολή làm nội dung, tiếng Việt tự nhiên dùng “kể”. λαός được giữ theo nghĩa tập thể là “dân chúng”.
- source_word: τὴν παραβολὴν ταύτην
  choice: ngụ ngôn này
  rationale: “Ngụ ngôn” là cách gọi quen thuộc, trang trọng và dễ hiểu cho παραβολή trong văn mạch các sách Phúc Âm.
- source_word: Ἄνθρωπος
  choice: Có một người
  rationale: Công thức mở đầu này tự nhiên trong lời kể tiếng Việt; “người” không phủ nhận việc nhân vật được ngữ pháp Hy Lạp trình bày ở giống đực.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: trồng một vườn nho
  rationale: Dịch trực tiếp động từ φυτεύω và danh từ ἀμπελών bằng cách kết hợp quen thuộc trong tiếng Việt.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: cho những người làm vườn thuê
  rationale: ἐκδίδωμι trong ngữ cảnh tài sản có nghĩa là cho thuê; γεωργοί chỉ những người canh tác. Cụm này giữ cả quan hệ thuê mướn lẫn công việc canh tác.
- source_word: ἀπεδήμησεν
  choice: đi xa
  rationale: Động từ có thể hàm ý rời quê nhà, thậm chí ra nước ngoài, nhưng câu không xác định điểm đến; “đi xa” giữ được độ mở đó.
- source_word: χρόνους ἱκανούς
  choice: trong một thời gian dài
  rationale: Dạng số nhiều kết hợp với ἱκανούς nhấn mạnh một khoảng thời gian đáng kể; “một thời gian dài” tự nhiên và rõ nghĩa.
theological_decisions:
- issue: Giới tính của nhân vật mở đầu qua Ἄνθρωπος
  choice: Có một người
  alternative: Có một người đàn ông
  rationale: Trong tiếng Việt, “có một người” là lối mở đầu tự nhiên cho một nhân vật cụ thể và không làm thay đổi vai trò của nhân vật; thêm “đàn ông” sẽ nhấn mạnh giới tính hơn mức cần thiết trong văn mạch này.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Nêu rõ “Đức Giê-su” thay cho đại từ chủ ngữ ngầm để câu độc lập theo mã câu vẫn sáng nghĩa; dùng “những người làm vườn” thay vì thuật ngữ pháp lý nặng nề.
