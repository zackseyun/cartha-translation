review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: thời điểm thích hợp, sai một δοῦλος đến với người canh tác vườn nho, mục đích nhận một phần sản vật, rồi người ấy bị đánh và bị sai về tay không. Tuy nhiên, “nộp” dễ gợi nghĩa nộp thuế hay nghĩa vụ hành chính mạnh hơn động từ δώσουσιν (“họ sẽ cho/giao”), trong khi quan hệ pháp lý cụ thể không được phát biểu trực tiếp ở câu này.'
  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. “Vào đúng thời điểm” và “giao cho ông” tự nhiên hơn trong tiếng Việt hiện đại; “tay không” là thành ngữ phù hợp cho κενόν.
  terminology: “Những người trồng nho” giữ được nét canh tác của γεωργοί mà không áp đặt “tá điền”. “Đầy tớ” có thể dùng trong văn cảnh dụ ngôn; chú thích giải thích hợp lý phổ nghĩa của δοῦλος. “Sản vật của vườn nho” sát καρπός hơn “hoa lợi”, vốn có thể rộng hơn thành quả/fruit cụ thể.
  issues:
  - severity: medium
    issue: “nộp cho ông” mạnh hơn động từ nguồn
    rationale: δώσουσιν αὐτῷ chỉ nói “họ cho/giao cho ông”; dù ngữ cảnh dụ ngôn có thể hàm ý phần phải trả cho chủ, “nộp” thêm sắc thái nghĩa vụ hành chính hoặc cưỡng chế. “Giao cho ông” giữ nghĩa trung tính hơn.
  - severity: low
    issue: “hoa lợi” rộng hơn καρπός
    rationale: καρπός trong ngữ cảnh ἀμπελών là sản vật/trái của vườn nho. “Sản vật của vườn nho” vừa tự nhiên vừa tránh mở rộng nghĩa.
