source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: vi
  text: Vào đúng thời điểm, ông sai một đầy tớ[a] đến gặp những người trồng nho để họ giao cho ông một phần sản vật của vườn nho. Nhưng họ đánh người đầy tớ rồi đuổi về tay không[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp δοῦλος có thể chỉ “đầy tớ” hoặc “nô lệ”; ở đây từ này nói đến một người có thân phận lệ thuộc và thuộc quyền chủ.
    reason: alternative_reading
  - marker: b
    text: Nguyên văn là “trống không”, nghĩa là không được giao chút sản vật nào của vườn nho.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: Đến đúng thời điểm
  rationale: Giữ nghĩa thời điểm thích hợp hoặc đã định mà không xác định quá mức là mùa thu hoạch.
- source_word: γεωργούς
  choice: những người trồng nho
  rationale: Theo ngữ cảnh vườn nho, cách dịch này tự nhiên và giữ tính chất canh tác, nhưng không tự thêm địa vị pháp lý là tá điền.
- source_word: δοῦλον
  choice: một đầy tớ
  rationale: Trong tiếng Việt hiện đại, “đầy tớ” phù hợp với bối cảnh gia chủ sai người thuộc quyền mình đi làm việc; chú thích nêu nghĩa mạnh hơn về thân phận lệ thuộc của từ Hy Lạp.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: để họ nộp cho ông
  rationale: Diễn đạt tự nhiên mục đích của việc sai đi; “nộp” phù hợp với việc giao phần hoa lợi cho chủ mà không xác định một tỷ lệ pháp lý.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: một phần hoa lợi của vườn nho
  rationale: ἀπό với sở hữu cách mang nghĩa phân lượng; “hoa lợi” bao quát sản vật thu được từ vườn nho.
- source_word: ἐξαπέστειλαν ... δείραντες
  choice: đánh ... rồi đuổi về
  rationale: Thể hiện cả việc hành hung lẫn sai đuổi đi; trật tự tiếng Việt làm rõ hành động đánh xảy ra trước khi đuổi về.
- source_word: κενόν
  choice: tay không
  rationale: Thành ngữ tiếng Việt tự nhiên, diễn đạt đúng việc người ấy không nhận được phần hoa lợi nào.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng dễ hiểu. Dùng “ông” theo mạch dụ ngôn để chỉ chủ vườn; tránh thêm danh xưng không có trong câu. “Đuổi về tay không” là cách nói hiện đại, tự nhiên, vẫn bảo toàn hình ảnh κενόν.
