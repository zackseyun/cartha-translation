- from: Đến đúng thời điểm, ông sai một đầy tớ[a] đến gặp những người trồng nho để họ nộp cho ông một phần hoa lợi của vườn nho. Nhưng họ đánh người đầy tớ rồi đuổi về tay không[b].
  to: Vào đúng thời điểm, ông sai một đầy tớ[a] đến gặp những người trồng nho để họ giao cho ông một phần sản vật của vườn nho. Nhưng họ đánh người đầy tớ rồi đuổi về tay không[b].
  rationale: Thay “nộp” bằng “giao” để không thêm sắc thái nghĩa vụ vượt quá δώσουσιν, và thay “hoa lợi” bằng “sản vật” để phản ánh sát hơn καρπός. Các yếu tố còn lại giữ nguyên vì phù hợp với tiếng Hy Lạp, văn mạch dụ ngôn và tiếng Việt hiện đại.
