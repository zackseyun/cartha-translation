source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: vi
  text: Nhưng những người được xét là xứng đáng để dự phần vào thời đại ấy[b] và sự sống lại từ cõi chết thì không cưới vợ cũng không được gả chồng[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn phân biệt giữa “cưới” và “được gả”; đây là cách diễn đạt theo vai trò của nam và nữ trong hôn nhân thời đó.
    reason: cultural_clarification
  - marker: b
    text: 'Cũng có thể dịch: “thời đại sắp đến.” Nguyên văn là “thời đại ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: được xét là xứng đáng
  rationale: Giữ thể bị động của tiếng Hy Lạp, cho thấy họ được đánh giá là xứng đáng chứ không khẳng định sự xứng đáng tự thân.
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: thời đại ấy
  rationale: Bám sát danh từ chỉ thời đại cùng đại từ chỉ định, đồng thời giữ nguyên sự tương phản cánh chung mà không diễn giải quá mức thành “thời đại sắp đến” trong chính văn.
- source_word: τυχεῖν
  choice: để hưởng
  rationale: Trong cấu trúc đi với sở hữu cách, động từ có nghĩa đạt được hoặc được dự phần. “Hưởng” tự nhiên trong tiếng Việt và có thể chi phối cả “thời đại ấy” lẫn “sự sống lại”.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: sự sống lại từ cõi chết
  rationale: Diễn đạt rõ ràng ý sống lại khỏi tình trạng hay phạm vi của người chết, phù hợp cách nói tự nhiên trong tiếng Việt.
- source_word: γαμοῦσιν
  choice: cưới vợ
  rationale: Trong cặp diễn đạt cổ này, động từ chủ động chỉ phía nam lấy vợ; cách dịch giữ sự đối xứng xã hội của nguyên văn.
- source_word: γαμίζονται
  choice: được gả chồng
  rationale: Giữ sắc thái bị động và sự phân biệt với động từ đứng trước, phản ánh tập quán người nữ được gia đình gả đi trong bối cảnh cổ đại.
theological_decisions:
- issue: Liệu καταξιωθέντες có hàm ý con người nhờ công trạng mà giành được sự sống phục sinh hay không
  choice: Dịch “được xét là xứng đáng” để bảo toàn ý có một sự đánh giá mà không nói rõ chủ thể.
  alternative: “những người xứng đáng” hoặc “những người được kể là xứng đáng”
  rationale: Cách dịch không biến sự xứng đáng thành phẩm chất tự thân hay công trạng kiếm được, nhưng cũng không thêm “Đức Chúa Trời” khi nguyên văn dùng thể bị động và không nêu tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “thì không... cũng không...” làm rõ mệnh đề chính dài. Chính văn giữ “thời đại ấy” để bảo toàn cách chỉ định của nguyên bản; chú thích nêu cách hiểu cánh chung phổ biến.
