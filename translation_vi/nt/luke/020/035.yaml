review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng cấu trúc chủ yếu của nguyên văn: phân từ bị động καταξιωθέντες được phản ánh bằng “được xét là xứng đáng”; “thời đại ấy” bảo toàn τοῦ αἰῶνος ἐκείνου; và cặp γαμοῦσιν/γαμίζονται được phân biệt. Tuy nhiên, “hưởng thời đại ấy” không diễn đạt tự nhiên và chưa phản ánh rõ ý τυχεῖν là đạt đến/được dự phần vào cả “thời đại ấy” lẫn sự phục sinh.'
  naturalness: “Được xét là xứng đáng để dự phần vào” là lối nói hiện đại, trang trọng và tự nhiên hơn “để hưởng” khi đi với “thời đại”. Cấu trúc phủ định song đôi và cách phân biệt “cưới vợ / được gả chồng” vẫn rõ ràng.
  terminology: Giữ “sự sống lại từ cõi chết”, một cách dịch chuẩn và dễ hiểu cho ἀνάστασις ἡ ἐκ νεκρῶν. “Dự phần vào” không khẳng định công trạng tự thân, đồng thời diễn đạt phù hợp quan hệ của τυχεῖν với hai bổ ngữ sở hữu cách.
  issues:
  - severity: low
    issue: Cụm “hưởng thời đại ấy” chưa tự nhiên và hơi mơ hồ.
    rationale: Trong tiếng Việt, người ta thường “dự phần vào” hoặc “đạt đến” một thời đại; “hưởng” hợp với phúc lợi hơn là với chính một “thời đại”. “Dự phần vào” cũng chi phối tự nhiên cả “thời đại ấy” và “sự sống lại”.
  revised_text: Nhưng những người được xét là xứng đáng để dự phần vào thời đại ấy[b] và sự sống lại từ cõi chết thì không cưới vợ cũng không được gả chồng[a].
