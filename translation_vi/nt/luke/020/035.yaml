  rationale: Thay “để hưởng” bằng “để dự phần vào” để phản ánh tự nhiên hơn τυχεῖν với cả hai đối tượng phối hợp, mà không thay đổi ý nghĩa hay thêm diễn giải thần học. Các phần còn lại, gồm các neo chú thích và chú thích văn hóa, phù hợp với nguyên văn và tiếng Việt hiện đại.
