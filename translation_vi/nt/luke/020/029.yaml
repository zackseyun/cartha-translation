  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: vi
  text: Vậy, có bảy anh em; người thứ nhất lấy vợ[a] rồi chết không có con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “kết hôn.” Theo nghĩa đen, tiếng Hy Lạp là “lấy một người vợ”, một thành ngữ chỉ việc kết hôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Giữ chức năng nối tiếp hoặc suy ra của tiểu từ trong phần trình bày tình huống, nhưng không làm nó mang sức nặng lập luận quá mức.
- source_word: ἑπτὰ ἀδελφοὶ
  choice: bảy anh em
  rationale: Cách nói tự nhiên trong tiếng Việt; ngữ cảnh hôn nhân kế tục cho thấy đây là bảy người anh em nam.
- source_word: ὁ πρῶτος
  choice: người thứ nhất
  rationale: Diễn đạt thứ tự trong chuỗi, không tự ý hiểu là người lớn tuổi nhất.
- source_word: λαβὼν γυναῖκα
  choice: lấy vợ
  rationale: Đây là thành ngữ Hy Lạp chỉ việc kết hôn; “lấy vợ” vừa tự nhiên trong tiếng Việt vừa gần với hình thức của nguyên văn.
- source_word: ἀπέθανεν
  choice: chết
  rationale: Cách dịch trực tiếp, rõ ràng, không dùng lối nói giảm.
- source_word: ἄτεκνος
  choice: mà không có con
  rationale: Diễn đạt tự nhiên trạng thái không có con khi qua đời và giữ nguyên ý nghĩa quan trọng đối với tình huống pháp lý đang được nêu.
