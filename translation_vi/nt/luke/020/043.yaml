  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: vi
  text: cho đến khi Ta đặt kẻ thù của Con làm bệ kê chân Con.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “cho đến khi Ta đặt kẻ thù của Con làm bệ kê cho chân Con.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên giới hạn thời gian hướng tới một sự việc trong tương lai, không cần thêm ý giải thích.
- source_word: θῶ
  choice: ta đặt ... làm
  rationale: τίθημι có nghĩa cơ bản là “đặt”; trong cấu trúc này, “đặt ... làm” vừa giữ sắc thái nguyên văn vừa diễn đạt rõ quan hệ với “bệ chân”.
- source_word: τοὺς ἐχθρούς σου
  choice: các kẻ thù của con
  rationale: Chuyển trực tiếp danh từ số nhiều và đại từ sở hữu, không làm nhẹ đi ý đối địch.
- source_word: ὑποπόδιον
  choice: bệ chân
  rationale: Từ này chỉ vật kê chân; “bệ chân” trang trọng, dễ hiểu và phù hợp với hình ảnh vương quyền trong lời trích dẫn Thi Thiên 110:1.
- source_word: τῶν ποδῶν σου
  choice: cho con
  rationale: Trong tiếng Việt, “bệ chân cho con” tự nhiên và tránh cách lặp vụng “bệ chân của chân con”; chi tiết “chân” đã hiện diện trong danh từ ghép “bệ chân”.
theological_decisions:
- issue: Hình ảnh khuất phục trong lời trích Thi Thiên 110:1
  choice: Giữ nguyên ẩn dụ “đặt các kẻ thù ... làm bệ chân”
  alternative: Diễn giải thành “đặt các kẻ thù dưới chân con” hoặc “hoàn toàn đánh bại các kẻ thù của con”
  rationale: Ẩn dụ vương quyền được giữ nguyên mà không giải thích quá mức bản chất hay mức độ khuất phục, nhờ đó bảo toàn sức nặng Cơ Đốc luận và sự căng thẳng thần học của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ta—con” phản ánh lời Đức Chúa Trời phán với nhân vật được gọi là “Chúa” trong ngữ cảnh trích dẫn, nhưng không thêm danh xưng hay lời giải thích ngoài câu nguồn.
