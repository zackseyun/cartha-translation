  to: Vậy Đa-vít gọi người ấy là Chúa, thì làm sao người ấy lại là con[a] của Đa-vít được?
  rationale: Sửa vị trí ký hiệu chú thích để nó neo đúng vào «con», và điều chỉnh chú thích để phân biệt cách nói trực tiếp «con» với khả năng hiểu theo dòng dõi. Câu chính cũng làm rõ các đại từ bằng cách lặp «người ấy» và «Đa-vít», không thay đổi ý nghĩa hay giải quyết trước sự căng thẳng của câu hỏi.
