  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: vi
  text: Vậy Đa-vít gọi người ấy là Chúa, thì làm sao người ấy lại là con[a] của Đa-vít được?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là «hậu duệ» trong ngữ cảnh dòng dõi. Tiếng Hy Lạp dùng từ «con»; bản văn chính giữ cách nói trực tiếp của lập luận.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Đa-vít
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: οὖν
  choice: Vậy
  rationale: Biểu thị kết luận suy ra từ lời trích dẫn và lập luận ngay trước đó, đồng thời tự nhiên trong câu hỏi tiếng Việt.
- source_word: αὐτὸν κύριον
  choice: gọi người là Chúa
  rationale: Giữ đại từ chỉ Đấng Mê-si-a và dịch κύριος là “Chúa”, phù hợp sức nặng tôn kính và tính chất của lập luận dựa trên Thi Thiên 110.
- source_word: καλεῖ
  choice: gọi
  rationale: Phản ánh trực tiếp động từ hiện tại καλεῖ và tạo cách diễn đạt tự nhiên “gọi ... là” trong tiếng Việt.
- source_word: πῶς
  choice: làm sao
  rationale: Thể hiện rõ câu hỏi tu từ và tự nhiên hơn “thế nào” trong cấu trúc này.
- source_word: αὐτοῦ υἱός
  choice: con của ông ấy
  rationale: Giữ danh từ υἱός là “con” thay vì giải nghĩa thành “hậu duệ”; “ông ấy” quy chiếu rõ về Đa-vít và tránh nhầm với đại từ “người” chỉ Đấng Mê-si-a.
- source_word: ἐστιν
  choice: lại là ... được
  rationale: Diễn đạt động từ “là” trong một câu hỏi tu từ tiếng Việt; “lại ... được” truyền đạt sắc thái nghịch lý mà không giải quyết sự căng thẳng của lập luận.
theological_decisions:
- issue: Cách dịch κύριος trong lập luận về Đấng Mê-si-a
  choice: Chúa
  alternative: chủ; thầy
  rationale: “Chúa” giữ được cả nghĩa tôn xưng lẫn sức nặng thần học của κύριος trong lời trích Thi Thiên 110 mà không diễn giải vượt quá nguyên văn.
- issue: Có nên mở rộng υἱός thành “hậu duệ” hay không
  choice: con
  alternative: hậu duệ
  rationale: Nguyên văn Hy Lạp nói rõ “con”; giữ cách gọi này bảo toàn hình thức và sự căng thẳng trong câu hỏi của Chúa Giê-su, trong khi chú thích nêu nghĩa dòng dõi có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” để chỉ nhân vật được Đa-vít gọi là Chúa, còn “ông ấy” để quy chiếu về Đa-vít, nhằm hạn chế sự mơ hồ đại từ vốn không tự nhiên trong tiếng Việt; vẫn giữ nguyên câu hỏi tu từ và sự căng thẳng thần học.
