revisions:
- from: Họ theo dõi Đức Chúa Jêsus rất kỹ rồi sai những kẻ do thám giả vờ là người công chính, nhằm bắt bẻ lời Ngài nói[a], để nộp Ngài cho quyền cai trị và thẩm quyền của tổng đốc[b].
  to: Họ theo dõi Người kỹ lưỡng, rồi sai những người được cài vào, giả vờ là người công chính, hòng vin vào lời Người nói để nộp Người cho quyền cai trị và thẩm quyền của tổng đốc[a].
  rationale: Sửa “những kẻ do thám” thành “những người được cài vào” để phản ánh chính xác hơn ἐγκαθέτους; sửa “bắt bẻ” thành “vin vào lời ... nói” để giữ ý gài bẫy pháp lý của ἐπιλαμβάνομαι λόγου. Do hai chú thích đều giải thích các cụm liên tiếp ở cuối câu, gộp thành một chú thích đặt sau cụm cuối để tránh neo chú thích không rõ phạm vi. Không thay đổi ý nghĩa, mối quan hệ mục đích–hệ quả, hay cặp thuật ngữ ἀρχή–ἐξουσία.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:33:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: theo dõi, sai người bí mật để gài bẫy bằng lời nói, rồi giao Đức Chúa Jêsus cho thẩm quyền của tổng đốc. Tuy nhiên, ἐγκαθέτους nhấn mạnh những người được cài vào/bố trí bí mật, không chỉ là người do thám nói chung; nên diễn đạt rõ sắc thái này. Cụm “bắt bẻ lời Ngài nói” có thể chỉ sự phản bác, chưa biểu đạt đầy đủ ý vin vào lời nói để gài bẫy. Sửa nhẹ để làm rõ mà không thêm một lời buộc tội không có trong nguyên văn.'
  naturalness: Câu hiện tại dễ hiểu nhưng “những kẻ do thám giả vờ” hơi chồng chức năng mô tả. “Những người được cài vào, giả vờ...” tự nhiên hơn và sát ngữ cảnh hơn. Dùng “Người” thay cho việc lặp danh xưng ở đầu câu giữ văn phong trang trọng, hiện đại và tránh đưa thêm tước hiệu vào chỗ nguyên văn chỉ hàm ý một đại từ.
  terminology: “Người công chính,” “nộp/giao,” “quyền cai trị,” “thẩm quyền,” và “tổng đốc” đều phù hợp. Giữ phân biệt tương đối giữa ἀρχή và ἐξουσία. Chú thích b nên tránh “bộ máy cai trị,” vì đó là cách cụ thể hóa vượt quá danh từ trừu tượng ἀρχή.
  issues:
  - severity: medium
    issue: Sắc thái của ἐγκαθέτους và ἐπιλάβωνται αὐτοῦ λόγου chưa đủ rõ.
    rationale: ἐγκαθέτους là những người được bí mật cài/bố trí nhằm gài bẫy; “do thám” có thể rộng hơn. “Bắt bẻ” thường nói đến phản bác lời nói, còn thành ngữ Hy Lạp hướng đến việc vin vào lời nói làm cớ để tóm/gài bẫy.
  - severity: low
    issue: Danh xưng “Đức Chúa Jêsus” được thêm vào nơi bản Hy Lạp chỉ dùng đại từ hàm ẩn từ ngữ cảnh.
    rationale: Việc xác định quy chiếu là cần thiết trong tiếng Việt, nhưng dùng “Người” giữ sát hơn và tránh thêm tước hiệu vào câu.
  revised_text: Họ theo dõi Người kỹ lưỡng, rồi sai những người được cài vào, giả vờ là người công chính, hòng vin vào lời Người nói để nộp Người cho quyền cai trị và thẩm quyền của tổng đốc[a].
