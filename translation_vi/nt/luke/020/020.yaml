  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: vi
  text: Họ theo dõi Người kỹ lưỡng, rồi sai những người được cài vào, giả vờ là người công chính, hòng vin vào lời Người nói để nộp Người cho quyền cai trị và thẩm quyền của tổng đốc[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay sát nghĩa hơn: “nắm lấy lời Người” hoặc “vin vào một lời của Người.” Cặp từ “quyền cai trị và thẩm quyền” có lẽ nhấn mạnh quyền tài phán và quyền lực chính thức của tổng đốc.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: theo dõi Đức Chúa Jêsus rất kỹ
  rationale: Diễn tả sự giám sát có chủ ý và thù nghịch; thì phân từ bất định cho thấy việc này đi trước hành động sai người đi. Danh xưng được bổ sung từ ngữ cảnh để câu tiếng Việt rõ nghĩa.
- source_word: ἐγκαθέτους
  choice: những kẻ do thám
  rationale: Chỉ những người được bí mật cài vào để gài bẫy; cách dịch này tự nhiên và làm rõ ý đồ kín đáo, thù nghịch.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: giả vờ là người công chính
  rationale: Giữ rõ sự tự trình bày gian dối và sắc thái đạo đức–tôn giáo của δίκαιος.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: nhằm bắt bẻ lời Ngài nói
  rationale: Diễn đạt thành ngữ về việc vin vào lời nói của một người để gài bẫy hay buộc tội, đồng thời giữ liên hệ trực tiếp với λόγος.
- source_word: ὥστε
  choice: để
  rationale: Trong mạch câu này, từ nối dẫn đến mục đích hay kết quả được nhắm tới của việc gài bẫy; tiếng Việt dùng “để” tự nhiên mà không buộc phải phân định quá mức giữa hai sắc thái.
- source_word: παραδοῦναι
  choice: nộp Ngài
  rationale: Cách nói tự nhiên trong bối cảnh pháp lý và thù nghịch, diễn tả việc giao một người vào tay nhà chức trách.
- source_word: τῇ ἀρχῇ
  choice: quyền cai trị
  rationale: Giữ khía cạnh quyền lực cai quản của ἀρχή và phân biệt tương đối với ἐξουσία đứng kế tiếp.
- source_word: τῇ ἐξουσίᾳ
  choice: thẩm quyền
  rationale: Diễn tả quyền hợp pháp hay quyền được trao để hành động, thích hợp với bối cảnh tài phán chính thức.
- source_word: τοῦ ἡγεμόνος
  choice: của tổng đốc
  rationale: Danh xưng quen thuộc và dễ hiểu cho viên chức cai trị cấp tỉnh của La Mã trong bối cảnh này.
theological_decisions:
- issue: Cách dịch δίκαιος khi sự công chính chỉ là giả vờ
  choice: người công chính
  alternative: người ngay thẳng; người chính trực
  rationale: “Công chính” giữ được chiều kích đạo đức–tôn giáo của từ Hy Lạp, thay vì thu hẹp thành vẻ đáng tin hay tư cách công dân đơn thuần.
- issue: Quan hệ giữa ἀρχή và ἐξουσία của tổng đốc
  choice: quyền cai trị và thẩm quyền của tổng đốc
  alternative: nhà cầm quyền và thẩm quyền của tổng đốc; quyền tài phán của tổng đốc
  rationale: Giữ nguyên cặp từ nhấn mạnh quyền cai quản và quyền hành chính thức, không nhập chúng thành một khái niệm duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng hô Kinh Thánh tiếng Việt; giữ sắc thái pháp lý của phần cuối câu và tránh làm phẳng cặp ἀρχή–ἐξουσία.
