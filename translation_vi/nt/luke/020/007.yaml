  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: vi
  text: Vì thế, họ trả lời rằng họ không biết điều ấy đến từ đâu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “từ đâu”. Từ Hy Lạp ở đây hỏi về nguồn gốc hoặc nguồn phát xuất.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Vì thế
  rationale: Trong mạch kể, καὶ nối câu trả lời này với sự bàn tính ngay trước đó; “Vì thế” diễn đạt tự nhiên sắc thái tiếp nối mang tính kết quả trong tiếng Việt.
- source_word: ἀπεκρίθησαν
  choice: họ trả lời
  rationale: Động từ ἀποκρίνομαι ở đây mang nghĩa thông dụng là đáp lại câu hỏi; “họ trả lời” rõ ràng và phù hợp văn kể.
- source_word: μὴ εἰδέναι
  choice: rằng họ không biết
  rationale: Sau động từ chỉ sự trả lời, cấu trúc nguyên mẫu với μή làm lời gián tiếp; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên ý phủ định.
- source_word: πόθεν
  choice: đến từ đâu
  rationale: πόθεν hỏi về nguồn gốc hay xuất xứ. “Đến từ đâu” giữ được nghĩa ấy mà không nói rõ hơn điều bản văn Hy Lạp nói.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “họ” theo ngữ cảnh; “điều ấy” làm rõ đối tượng được ngầm hiểu từ câu trước mà không xác định thêm nguồn gốc.
