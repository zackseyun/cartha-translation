  text: But perceiving their cunning[a], he said to them,
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nhận ra mưu mô của họ và nói với họ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατανοήσας
  choice: nhận ra
  rationale: Phân từ bất định quá khứ diễn tả việc Đức Giê-su nhận biết rõ ý đồ của họ trước khi lên tiếng; “nhận ra” tự nhiên và giữ được sắc thái nhận thức.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Liên từ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ: họ toan gài bẫy, nhưng Đức Giê-su nhận ra ý đồ ấy.'
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu bổ nghĩa tự nhiên cho “mưu mô” trong tiếng Việt.
- source_word: πανουργίαν
  choice: mưu mô
  rationale: Từ này chỉ sự khôn khéo bất chính, có tính toán và nhằm lừa gạt. “Mưu mô” chuyển tải cả sự tính toán lẫn sắc thái đạo đức tiêu cực mà không thu hẹp nghĩa chỉ còn hành vi lừa dối.
- source_word: εἶπεν
  choice: nói
  rationale: Cách dịch tự nhiên của động từ tường thuật lời nói trong ngữ cảnh này.
- source_word: πρὸς αὐτούς
  choice: với họ
  rationale: Sau động từ nói, cụm giới từ nêu người được nói trực tiếp; “nói với họ” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể vốn được hàm ẩn trong động từ Hy Lạp, phù hợp ngữ cảnh liên tục; “nên” diễn đạt tự nhiên quan hệ hoàn cảnh giữa phân từ và động từ chính mà không thêm nội dung thần học.
