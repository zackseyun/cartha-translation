- from: Hãy coi chừng các kinh sư[a], những người thích đi lại trong áo choàng dài[b], ưa được chào hỏi nơi quảng trường, ngồi ghế danh dự trong các hội đường[c] và ở chỗ danh dự trong các bữa tiệc[d].
  to: Hãy coi chừng các kinh sư[a], những người thích đi lại trong áo choàng dài[b], ưa được chào hỏi ở các khu chợ, những ghế danh dự trong các hội đường[c] và những chỗ danh dự trong các bữa tiệc[d].
  rationale: Thay “nơi quảng trường” bằng “ở các khu chợ” để phản ánh ἀγοραῖς sát hơn. Thay “ngồi ghế ... và ở chỗ ...” bằng “những ghế ... và những chỗ ...” để giữ ba đối tượng song song của φιλούντων (“ưa/yêu thích”), không thêm hay bớt ý nghĩa.
