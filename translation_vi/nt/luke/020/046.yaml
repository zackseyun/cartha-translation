id: LUK.20.46
reference: Luke 20:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: vi
  text: Hãy coi chừng các kinh sư[a], những người thích đi lại trong áo choàng dài[b], ưa được chào hỏi ở các khu chợ, những ghế danh dự trong các hội đường[c] và những chỗ danh dự trong các bữa tiệc[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đề phòng các kinh sư.”'
    reason: lexical_alternative
  - marker: b
    text: “Áo choàng dài” là loại y phục nổi bật, có thể biểu thị địa vị và uy thế.
    reason: cultural_note
  - marker: c
    text: Hay “những ghế hàng đầu” hoặc “những ghế cao trọng” trong các hội đường.
    reason: lexical_alternative
  - marker: d
    text: Hay “những chỗ tốt nhất” hoặc “những chỗ cao trọng” trong các bữa tiệc.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Hãy coi chừng
  rationale: Cấu trúc mệnh lệnh số nhiều kêu gọi người nghe cảnh giác trước một nhóm người. “Hãy coi chừng” tự nhiên trong tiếng Việt và giữ nguyên sức cảnh báo.
- source_word: γραμματέων
  choice: các kinh sư
  rationale: Trong bối cảnh các sách Tin Mừng, γραμματεῖς chỉ những người thông thạo, sao chép và giảng giải Luật; “kinh sư” là cách gọi ngắn gọn, quen thuộc và không mở rộng nghĩa quá mức.
- source_word: τῶν θελόντων περιπατεῖν
  choice: những người thích đi lại
  rationale: θελόντων diễn tả ý muốn hoặc sở thích, còn περιπατεῖν trong ngữ cảnh gợi việc xuất hiện công khai. Cách dịch này tự nhiên mà không thêm động cơ ngoài câu.
- source_word: ἐν στολαῖς
  choice: trong áo choàng dài
  rationale: στολή là loại áo dài, trang trọng, có thể biểu thị địa vị. “Áo choàng dài” nêu rõ loại y phục mà vẫn để chú thích giải thích ý nghĩa xã hội.
- source_word: φιλούντων
  choice: ưa
  rationale: Động từ diễn tả sự yêu thích mạnh đối với việc được tôn trọng công khai. “Ưa” nối tự nhiên với cả ba đối tượng song song mà vẫn giữ sắc thái phê phán.
- source_word: ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: được chào hỏi nơi quảng trường
  rationale: Đây là những lời chào công khai mang tính tôn kính tại khu vực tụ họp và buôn bán. Dạng “được chào hỏi” làm rõ rằng họ ham được người khác công nhận.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: ngồi ghế danh dự trong các hội đường
  rationale: πρωτοκαθεδρία chỉ ghế có thứ bậc cao hoặc vị trí nổi bật trong hội đường; “ghế danh dự” truyền đạt chức năng xã hội rõ hơn cách dịch thuần không gian.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: ở chỗ danh dự trong các bữa tiệc
  rationale: πρωτοκλισία chỉ vị trí ngả mình dùng bữa dành cho người được trọng vọng. “Chỗ danh dự” truyền đạt đúng địa vị, không áp đặt cách bố trí bàn ghế hiện đại.
theological_decisions:
- issue: Phạm vi lời cảnh báo đối với các kinh sư
  choice: Giữ cách gọi “các kinh sư” rồi mô tả họ bằng các đặc điểm theo sau, để lời cảnh báo nhắm vào nhóm được nhận diện qua lối phô trương và ham danh dự.
  alternative: Hiểu câu như lời kết án không phân biệt mọi cá nhân thuộc giới kinh sư, hoặc chỉ như lời phê bình cách ăn mặc.
  rationale: Các phân từ Hy Lạp mô tả những kinh sư đang được nói đến bằng các hành vi cụ thể. Bản dịch giữ sức phê phán của câu nhưng không mở rộng thành một khẳng định thần học về mọi kinh sư.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “kinh sư” và “hội đường” theo cách gọi quen thuộc trong văn liệu Kinh Thánh; cấu trúc liệt kê giữ nhịp và sức phê phán của nguyên văn.
