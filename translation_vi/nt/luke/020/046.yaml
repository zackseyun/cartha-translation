    issue: “nơi quảng trường” cho ἐν ταῖς ἀγοραῖς
    rationale: ἀγοραί là các khu chợ/không gian chợ công cộng. “Quảng trường” có thể đúng một phần về không gian công cộng nhưng không nêu được phương diện chợ trong từ Hy Lạp.
  - severity: low
    issue: Chuỗi đối tượng của “ưa” không song song
    rationale: 'Nguyên văn liệt kê ba điều các kinh sư yêu thích: lời chào, ghế hàng đầu, và chỗ hàng đầu. “ngồi ghế ... và ở chỗ ...” đổi hai danh từ thành hành động/trạng thái; chỉnh thành các danh từ giữ cấu trúc và sắc thái ham chuộng danh dự.'
