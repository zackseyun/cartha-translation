id: LUK.20.1
reference: Luke 20:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: vi
  text: Vào một trong những ngày ấy, khi Ngài đang dạy dân chúng trong đền thờ[b] và loan báo tin mừng[a], các thượng tế, các kinh sư cùng với các trưởng lão đến gặp Ngài,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “rao giảng phúc âm.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khu vực đền thờ, không chỉ riêng thánh điện bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Chuyện xảy ra
  rationale: Giữ lại công thức chuyển tiếp tường thuật quen thuộc của Lu-ca nhưng tránh lối diễn đạt cổ như “bấy giờ xảy ra rằng”.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: vào một trong những ngày ấy
  rationale: Giữ sắc thái bất định và quan hệ bộ phận của thành ngữ Hy Lạp, đồng thời nối với chuỗi sự việc trong văn cảnh.
- source_word: διδάσκοντος αὐτοῦ
  choice: khi Ngài đang dạy
  rationale: Diễn đạt phân từ sở hữu cách tuyệt đối như một hành động đang diễn ra đồng thời; “Ngài” chuyển tải đại từ chỉ Đức Giê-su trong văn cảnh mà không thêm tên vào nguyên văn.
- source_word: τὸν λαὸν
  choice: dân chúng
  rationale: Chỉ dân chúng nói chung, tự nhiên hơn “dân” trong câu này và không thu hẹp thành một đám đông nhất thời.
- source_word: ἐν τῷ ἱερῷ
  choice: trong đền thờ
  rationale: Cách nói tự nhiên trong tiếng Việt; chú thích làm rõ ἱερόν chỉ toàn khu đền thờ, không riêng nơi thánh bên trong.
- source_word: εὐαγγελιζομένου
  choice: loan báo tin mừng
  rationale: Giữ ý nghĩa động từ là công bố một tin vui, dễ hiểu và ít mang tính thuật ngữ giáo hội hơn “rao giảng phúc âm”.
- source_word: ἐπέστησαν
  choice: tiến đến
  rationale: Diễn tả việc họ trực tiếp đến gần Đức Giê-su mà không thêm sắc thái đối đầu vốn chưa được nói rõ trong chính động từ.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế thời Đền Thờ thứ hai, không hàm ý có nhiều người đồng thời giữ chức thượng tế duy nhất.
- source_word: γραμματεῖς
  choice: các kinh sư
  rationale: Danh xưng lịch sử quen thuộc trong tiếng Việt cho nhóm chuyên gia Kinh Thánh và luật pháp Do Thái.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: cùng với các trưởng lão
  rationale: Giữ rõ ý cùng đi và sự phối hợp giữa các nhóm lãnh đạo.
theological_decisions:
- issue: Cách dịch εὐαγγελιζομένου trong lời kể về chức vụ công khai của Đức Giê-su
  choice: loan báo tin mừng
  alternative: rao giảng phúc âm
  rationale: “Loan báo tin mừng” bảo toàn nội dung ngữ nghĩa của động từ mà không mặc nhiên biến nó thành một thuật ngữ giáo hội kỹ thuật; phương án truyền thống vẫn được ghi trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “khi… thì…” làm rõ quan hệ giữa các phân từ Hy Lạp và động từ chính. Dấu phẩy cuối câu được giữ vì câu nói tiếp sang câu 2. Các ký hiệu chú thích được đặt ngay sau cụm từ mà chúng giải thích, thay vì giữ vị trí bị lệch trong lớp tham khảo tiếng Anh.
