  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: vi
  text: 'Nhưng nếu chúng ta nói: ‘Từ loài người,’ thì toàn dân sẽ ném đá chúng ta, vì họ tin chắc rằng Giăng là một nhà tiên tri.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Nhưng nếu chúng ta nói
  rationale: ἐὰν với động từ giả định εἴπωμεν nêu một khả năng có điều kiện; δέ mang sắc thái tương phản với phương án trước đó. Cách dịch này tự nhiên và giữ đúng quan hệ lập luận.
- source_word: Ἐξ ἀνθρώπων
  choice: Từ loài người
  rationale: Cụm từ tỉnh lược, quy chiếu về nguồn gốc phép báp-têm hay thẩm quyền của Giăng. “Từ loài người” giữ cấu trúc đối lập trực tiếp với “từ trời” trong ngữ cảnh mà không diễn giải thêm.
- source_word: ὁ λαὸς ἅπας
  choice: toàn dân
  rationale: λαός chỉ dân chúng như một tập thể, còn ἅπας nhấn mạnh tính toàn thể. “Toàn dân” ngắn gọn, trang trọng và tự nhiên trong tiếng Việt.
- source_word: καταλιθάσει
  choice: sẽ ném đá chúng ta
  rationale: Động từ tương lai có nghĩa là dùng đá ném vào người. Bản dịch không thêm “cho đến chết,” vì chi tiết ấy không được nói rõ trong câu nguồn.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: vì họ tin chắc
  rationale: Dạng số ít hòa hợp với danh từ tập thể ὁ λαὸς ἅπας; tiếng Việt tự nhiên dùng “họ” để chỉ toàn dân. Thể hoàn thành diễn tả một sự xác tín đã hình thành và hiện còn hiệu lực.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: rằng Giăng là một nhà tiên tri
  rationale: Kết cấu đối cách–động từ nguyên mẫu được chuyển thành mệnh đề với “rằng.” Động từ nguyên mẫu εἶναι không tự biểu thị thời; “là” trong tiếng Việt giữ được tính không xác định về thời và diễn đạt niềm tin hiện hữu của dân chúng.
theological_decisions:
- issue: Cách diễn đạt nhận định của dân chúng về Giăng
  choice: rằng Giăng là một nhà tiên tri
  alternative: rằng Giăng đã là một nhà tiên tri
  rationale: εἶναι là động từ nguyên mẫu không tự đánh dấu thời. Tiếng Việt không buộc phải lùi thì như tiếng Anh, nên “là” bảo toàn sự mơ hồ về thời và không ngầm giới hạn địa vị tiên tri của Giăng vào quá khứ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Giăng” theo truyền thống tên riêng Kinh Thánh tiếng Việt; giữ “Từ loài người” để phản ánh sát cấu trúc đối lập trong nguyên văn.
