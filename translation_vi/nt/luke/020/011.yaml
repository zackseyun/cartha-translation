  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: vi
  text: Ông lại sai một đầy tớ khác đến; nhưng họ cũng đánh đập và làm nhục người ấy, rồi cho về tay không.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθετο
  choice: lại
  rationale: Trong cấu trúc với động từ nguyên mẫu, từ này diễn tả việc tiếp tục hoặc làm thêm một hành động; “lại” tự nhiên trong tiếng Việt và giữ được sự tiếp diễn của câu chuyện.
- source_word: ἕτερον
  choice: một ... khác
  rationale: Chỉ một người nữa, phân biệt với người đã được sai đến trước đó.
- source_word: πέμψαι
  choice: sai ... đến
  rationale: “Sai đến” diễn đạt tự nhiên hành động chủ vườn cử người đại diện đến gặp các tá điền.
- source_word: δοῦλον
  choice: đầy tớ
  rationale: Trong tiếng Việt hiện đại, “đầy tớ” vừa phù hợp bối cảnh gia chủ sai người thuộc quyền mình, vừa dễ hiểu hơn “nô lệ” trong mạch kể này; quan hệ lệ thuộc vẫn được hàm chứa mà không làm câu văn gượng gạo.
- source_word: κἀκεῖνον
  choice: họ cũng ... người ấy
  rationale: Giữ cả ý “cũng” và sự quy chiếu nhấn mạnh đến người đầy tớ thứ hai.
- source_word: δείραντες
  choice: đánh đập
  rationale: Diễn tả rõ hành vi hành hung thể xác nhưng không xác định quá mức phương thức như “đánh roi”.
- source_word: ἀτιμάσαντες
  choice: làm nhục
  rationale: Giữ phương diện hạ nhục và tước danh dự của ἀτιμάζω, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἐξαπέστειλαν
  choice: đuổi về
  rationale: Trong ngữ cảnh, người ấy bị buộc rời đi và trở về mà không nhận được gì; “đuổi về” truyền đạt sắc thái mạnh hơn việc chỉ trung tính “sai đi”.
- source_word: κενόν
  choice: tay không
  rationale: Thành ngữ tiếng Việt tự nhiên cho việc trở về mà không nhận được hoa lợi đáng lẽ phải thu.
theological_decisions:
- issue: Cách dịch δοῦλος trong dụ ngôn
  choice: đầy tớ
  alternative: nô lệ
  rationale: δοῦλος có thể chỉ một người ở địa vị nô lệ hoặc đầy tớ lệ thuộc. Trong văn cảnh dụ ngôn, “đầy tớ” là cách gọi tự nhiên, trang trọng vừa phải trong tiếng Việt và vẫn biểu thị người thuộc quyền chủ; không cần giải quyết quá mức địa vị pháp lý vốn không phải trọng tâm trực tiếp của câu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, rõ ràng và trang dignified; giữ cấu trúc đối lập của nguyên văn bằng dấu chấm phẩy và “nhưng”. Không cần chú thích vì câu dịch không chứa phương án từ vựng gây hiểu lầm đáng kể.
