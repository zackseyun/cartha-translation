  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: vi
  text: 'Vì có lời chép rằng: “Ngài sẽ truyền lệnh cho các thiên sứ của Ngài về ngươi, để gìn giữ ngươi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: có lời chép rằng
  rationale: Cách dẫn Kinh Thánh tự nhiên và trang trọng trong tiếng Việt, đồng thời thể hiện văn bản đã được chép và vẫn có hiệu lực.
- source_word: γὰρ
  choice: vì
  rationale: Giữ chức năng giải thích, nối lời trích dẫn này với phát biểu về sự thử thách ở câu trước.
- source_word: ὅτι
  choice: 'rằng:'
  rationale: Dùng “rằng” cùng dấu hai chấm để giới thiệu trực tiếp nội dung trích dẫn một cách tự nhiên trong tiếng Việt.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: cho các thiên sứ của Ngài
  rationale: Giữ rõ đối tượng nhận mệnh lệnh ở cách dữ liệu và đại từ sở hữu chỉ về Đức Chúa Trời.
- source_word: ἐντελεῖται
  choice: Ngài sẽ truyền
  rationale: Diễn đạt sát động từ tương lai mang nghĩa ban lệnh hoặc truyền bảo, với chủ thể được hàm ý từ ngữ cảnh của lời trích Thi Thiên.
- source_word: περὶ σοῦ
  choice: về việc
  rationale: Kết hợp tự nhiên với cấu trúc mục đích theo sau; toàn cụm diễn đạt mệnh lệnh liên quan đến việc gìn giữ người được nói tới.
- source_word: τοῦ διαφυλάξαι σε
  choice: gìn giữ ngươi
  rationale: Diễn đạt sắc thái bảo vệ cẩn thận của διαφυλάσσω; “ngươi” phù hợp với lời Sa-tan trực tiếp nói với Đức Giê-su trong văn phong Kinh Thánh trang trọng.
theological_decisions:
- issue: Cách dịch lời Sa-tan trích Thi Thiên
  choice: Dịch sát phần lời trích được Lu-ca ghi lại, không bổ sung phần tiếp theo của Thi Thiên 91:11.
  alternative: Bổ sung ý “trên mọi nẻo đường ngươi” theo bản văn đầy đủ của Thi Thiên.
  rationale: Lu-ca chỉ ghi phần trích dẫn này; không nên hòa hợp hoặc thêm nội dung không có trong bản Hy Lạp của câu.
- issue: Chủ thể hàm ẩn của ἐντελεῖται
  choice: Dùng “Ngài” để chỉ Đức Chúa Trời.
  alternative: Nêu rõ “Đức Chúa Trời.”
  rationale: Chủ thể được hiểu từ lời Kinh Thánh được trích; đại từ giữ được cấu trúc của nguyên văn mà không giải thích quá mức.
- issue: Quan hệ giữa περὶ σοῦ và τοῦ διαφυλάξαι σε
  choice: Dịch gộp tự nhiên là “về việc gìn giữ ngươi.”
  alternative: “về ngươi, để gìn giữ ngươi.”
  rationale: Cấu trúc Hy Lạp có thể được hiểu là mệnh lệnh liên quan đến người được nói tới, với động từ nguyên mẫu nêu mục đích/nội dung bảo vệ. Bản dịch gộp tránh câu tiếng Việt gượng mà không loại bỏ ý nghĩa cốt lõi.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “thiên sứ” cho ἄγγελοι, “Ngài” cho chủ thể thần linh hàm ẩn, và “ngươi” vì đây là lời nói trực tiếp nhắm đến Đức Giê-su trong ngữ cảnh thử thách.
