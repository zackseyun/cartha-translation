  source_fidelity: Bản nháp truyền đạt đúng lời dẫn Kinh Thánh, thì tương lai của ἐντελεῖται, các thiên sứ thuộc về chủ thể hàm ẩn, và ý bảo vệ của διαφυλάξαι. Tuy nhiên, cách gộp περὶ σοῦ với mệnh đề nguyên mẫu thành “về việc gìn giữ ngươi” làm mờ mất đối ngữ riêng “về ngươi” và biến nó thành nội dung trực tiếp của mệnh lệnh.
  naturalness: “Truyền lệnh cho ... về ngươi, để gìn giữ ngươi” là tiếng Việt hiện đại, trang trọng, và phản ánh rõ quan hệ cú pháp của bản Hy Lạp. Trong lời trích dẫn, “ngươi” phù hợp với ngôi trực tiếp và văn phong Kinh Thánh.
  terminology: Giữ “có lời chép rằng,” “thiên sứ,” “Ngài,” và “gìn giữ” là nhất quán với thanh ghi trang trọng. “Truyền lệnh” diễn đạt tự nhiên sắc thái ban lệnh của ἐντελεῖται.
