  to: '“Thần Khí của Chúa ngự trên tôi,

    vì Ngài đã xức dầu cho tôi

    để loan báo tin mừng cho người nghèo.

    Ngài đã sai tôi đi công bố sự giải thoát[a] cho những người bị giam cầm,

