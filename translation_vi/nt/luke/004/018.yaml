id: LUK.4.18
reference: Luke 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: vi
  text: '“Thần Khí của Chúa ngự trên tôi,

    vì Ngài đã xức dầu cho tôi

    để loan báo tin mừng cho người nghèo.

    Ngài đã sai tôi đi công bố sự giải thoát[a] cho những người bị giam cầm,

    cho người mù được sáng mắt,

    và để đưa những người bị áp bức[b] ra tự do.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἄφεσις cũng có thể có nghĩa là “sự tha thứ”; ở đây, ngữ cảnh nói về người bị giam cầm và người bị áp bức nghiêng về nghĩa giải thoát hoặc phóng thích.
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “những người đã bị đập vỡ” hoặc “bị nghiền nát.” Trong ngữ cảnh này, “những người bị áp bức” diễn đạt nghĩa thành ngữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: Thần Khí của Chúa
  rationale: Giữ quan hệ sở hữu hoặc nguồn gốc của cụm sở hữu cách, đồng thời không thêm từ “Thánh” vốn không có trong câu Hy Lạp.
- source_word: ἐπ’ ἐμέ
  choice: ngự trên tôi
  rationale: Tiếng Hy Lạp lược động từ; “ngự trên tôi” bổ sung động từ cần thiết trong tiếng Việt, diễn đạt tự nhiên ἐπί và giữ sắc thái trang trọng của lời Kinh Thánh.
- source_word: οὗ εἵνεκεν
  choice: vì
  rationale: Diễn đạt trực tiếp ý nghĩa nguyên nhân của thành ngữ Hy Lạp bằng tiếng Việt hiện đại.
- source_word: ἔχρισέν με
  choice: Ngài đã xức dầu cho tôi
  rationale: “Xức dầu” giữ hình ảnh nghi lễ và âm hưởng về Đấng được xức dầu của χρίω; “đã” thể hiện hành động sai phái đã xảy ra.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: để loan báo tin mừng cho người nghèo
  rationale: “Loan báo tin mừng” diễn đạt hành động công bố tin tốt lành mà không thu hẹp πτωχοῖς vào một nghĩa bóng hoặc vật chất duy nhất.
- source_word: ἀπέσταλκέν με
  choice: Ngài đã sai tôi đi
  rationale: Diễn đạt hành động sai phái đã hoàn tất nhưng sứ mạng vẫn tiếp tục; “đi” khiến câu tự nhiên trong tiếng Việt.
- source_word: κηρύξαι
  choice: công bố
  rationale: Thể hiện việc tuyên cáo công khai của κηρύσσω, không giới hạn vào hoạt động giảng trong một thiết chế tôn giáo.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: sự giải thoát cho những người bị giam cầm
  rationale: Trong ngữ cảnh Ê-sai về người bị giam cầm và bị áp bức, ἄφεσις chủ yếu chỉ sự phóng thích hoặc giải thoát; chú thích vẫn bảo lưu nghĩa “tha thứ” có thể có.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: cho người mù được sáng mắt
  rationale: Cách nói tự nhiên này diễn đạt việc nhận lại hoặc có được thị lực của ἀνάβλεψις.
- source_word: ἀποστεῖλαι
  choice: đưa ... ra đi
  rationale: Giữ hình ảnh sai hoặc đưa ra khỏi tình trạng giam hãm của động từ ἀποστέλλω, thay vì hoàn toàn đồng nhất nó với “trả tự do”.
- source_word: τεθραυσμένους
  choice: những người bị áp bức
  rationale: Phân từ hoàn thành bị động có nghĩa đen là “những người đã bị đập vỡ”; trong ngữ cảnh giải phóng, “bị áp bức” truyền đạt nghĩa thành ngữ rõ ràng, còn nghĩa đen được ghi trong chú thích.
- source_word: ἐν ἀφέσει
  choice: trong sự giải thoát
  rationale: Giữ sự lặp lại có chủ ý của ἄφεσις và mối liên kết tu từ với lời công bố giải thoát ở vế trước, dù cách diễn đạt trang trọng hơn lời nói thường ngày.
theological_decisions:
- issue: Nghĩa của ἄφεσις trong lời trích dẫn từ Ê-sai
  choice: giải thoát/phóng thích
  alternative: tha thứ
  rationale: Các từ đi kèm trực tiếp—người bị giam cầm, người mù và người bị đập vỡ hoặc áp bức—đặt câu trong trường nghĩa giải phóng và phục hồi. Tuy nhiên, vì ἄφεσις cũng có thể chỉ sự tha thứ, nhất là ở những chỗ khác trong Lu-ca, chú thích bảo lưu khả năng đó thay vì loại bỏ sự căng thẳng về nghĩa.
- issue: Phạm vi của πτωχοῖς
  choice: người nghèo
  alternative: người khốn khó hoặc thấp hèn
  rationale: Bản dịch không xác định đây chỉ là nghèo vật chất hay một nhóm thấp kém về xã hội và tinh thần, nhờ đó giữ được độ rộng của từ Hy Lạp trong ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc, với nhịp xuống dòng phản ánh cấu trúc tuyên cáo của câu. Dùng “Thần Khí của Chúa” để bám sát nguyên văn mà không thêm “Thánh”; dùng “Ngài” cho chủ thể thần linh theo lối kính trọng thông dụng. Cụm “trong sự giải thoát” hơi trang trọng nhưng được giữ để tái hiện việc lặp ἄφεσις trong nguyên văn.
