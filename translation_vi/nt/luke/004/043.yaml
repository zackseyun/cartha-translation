id: LUK.4.43
reference: Luke 4:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với họ: “Ta cũng phải rao truyền tin mừng[a] về vương quốc của Đức Chúa Trời cho những thành phố khác, vì việc này mà Ta được sai đến[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “loan báo tin mừng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “vì Ta được sai đến nhằm mục đích này.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτέραις πόλεσιν
  choice: các thành khác
  rationale: Diễn đạt trực tiếp những thành ngoài nơi hiện tại; “thành” tương ứng tự nhiên với πόλις và giữ rõ ý tương phản.
- source_word: εὐαγγελίσασθαί
  choice: rao truyền tin mừng
  rationale: Giữ nghĩa hành động loan báo tin tốt lành, đồng thời phù hợp với văn phong trang trọng, dễ hiểu và không biến động từ thành một thuật ngữ giáo phái.
- source_word: δεῖ
  choice: phải
  rationale: Diễn tả sự cần thiết mạnh mẽ gắn với sứ mạng của Chúa Giê-xu, nhưng không giải thích thêm nguồn gốc của sự cần thiết ấy.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Giữ nguyên cụm từ thần học trọng tâm của Lu-ca, không thu hẹp nghĩa thành chỉ lãnh thổ hay chỉ sự cai trị.
- source_word: ἐπὶ τοῦτο
  choice: vì chính việc này
  rationale: Diễn đạt mục đích của việc được sai đến; từ “chính” phản ánh trọng tâm của τοῦτο mà không cường điệu.
- source_word: ἀπεστάλην
  choice: Ta được sai đến
  rationale: Giữ thể bị động và ngôn ngữ sứ mạng của nguyên văn, không nêu đích danh Đấng sai khi câu Hy Lạp không nói rõ.
- source_word: Καὶ
  choice: cũng
  rationale: 'Thể hiện ý bổ sung: sứ mạng còn hướng đến những thành khác.'
- source_word: ὁ δὲ εἶπεν πρὸς αὐτοὺς
  choice: Nhưng Ngài nói với họ
  rationale: “Nhưng” thể hiện sắc thái chuyển ý hoặc tương phản nhẹ của δέ trong bối cảnh đám đông muốn giữ Ngài ở lại.
theological_decisions:
- issue: Tính tất yếu trong lời tuyên bố về sứ mạng của Chúa Giê-xu
  choice: Dùng “phải” để giữ sức nặng của δεῖ và trình bày sứ mạng rao truyền vương quốc Đức Chúa Trời tại nhiều thành.
  alternative: Có thể diễn đạt dài hơn là “điều cần thiết là Ta phải,” nhưng cách này nặng nề và kém tự nhiên.
  rationale: Trong Lu-ca, δεῖ thường mang sắc thái tất yếu theo chương trình của Đức Chúa Trời; bản dịch giữ sắc thái ấy mà không giải nghĩa vượt quá câu văn.
- issue: Chủ thể sai Chúa Giê-xu
  choice: Giữ thể bị động “Ta được sai đến,” không thêm chủ thể trong chính văn.
  alternative: Có thể hiểu Đức Chúa Trời là Đấng sai Ngài.
  rationale: Ngữ cảnh thần học gợi đến Đức Chúa Trời, nhưng nguyên văn không nêu chủ thể; giữ thể bị động bảo toàn độ hàm ẩn của câu.
- issue: Nghĩa của “vương quốc Đức Chúa Trời”
  choice: Giữ cụm từ truyền thống và rộng nghĩa “vương quốc Đức Chúa Trời.”
  alternative: Có thể dịch diễn giải là “quyền cai trị của Đức Chúa Trời.”
  rationale: Cụm Hy Lạp có thể bao hàm cả sự trị vì lẫn lĩnh vực thuộc quyền trị vì; không nên âm thầm thu hẹp nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể và “Ta” trong lời trực tiếp của Chúa Giê-xu; giữ cấu trúc sứ mạng súc tích, đồng thời bảo toàn thể bị động và những điểm hàm ẩn của nguyên văn.
