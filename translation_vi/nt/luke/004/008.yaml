id: LUK.4.8
reference: Luke 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: vi
  text: 'Đức Giê-su đáp lại: “Có lời chép: ‘Ngươi phải thờ phượng[a] Chúa là Đức Chúa Trời của ngươi và phụng sự một mình Ngài.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “sấp mình trước” hoặc “cúi lạy.”'
    reason: lexical_alternative
  - marker: b
    text: Lời trích này gợi lại Phục Truyền Luật Lệ Ký 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Đức Giê-su trả lời nó
  rationale: Gộp phân từ và động từ chính thành cách kể tự nhiên trong tiếng Việt, đồng thời giữ đối tượng gián tiếp αὐτῷ; “nó” phù hợp với đối tượng là ma quỷ trong ngữ cảnh.
- source_word: Γέγραπται
  choice: Có lời chép
  rationale: Công thức dẫn Kinh Thánh quen thuộc, tự nhiên, và vẫn diễn đạt lời đã được ghi chép có giá trị hiện hành.
- source_word: Κύριον τὸν θεόν σου
  choice: Chúa là Đức Chúa Trời của ngươi
  rationale: Giữ κύριος là “Chúa” và θεός là “Đức Chúa Trời”; từ “là” làm rõ quan hệ đồng vị trong tiếng Việt mà không đưa danh YHWH từ bản Hê-bơ-rơ vào chính văn Hy Lạp.
- source_word: προσκυνήσεις
  choice: ngươi phải thờ phượng
  rationale: Trong bối cảnh lòng tôn kính dành riêng cho Đức Chúa Trời, “thờ phượng” truyền đạt đúng sức nặng tôn giáo; “phải” diễn đạt lực mệnh lệnh của thì tương lai trong lời trích.
- source_word: λατρεύσεις
  choice: phụng sự
  rationale: “Phụng sự” thể hiện việc phục vụ dành cho thần linh rõ hơn từ “phục vụ” thông thường, mà vẫn trang trọng và dễ hiểu.
- source_word: αὐτῷ μόνῳ
  choice: chỉ phụng sự một mình Ngài
  rationale: 'Giữ trọng tâm loại trừ của μόνῳ: sự phụng sự chỉ dành cho một mình Đức Chúa Trời.'
theological_decisions:
- issue: Cách dịch κύριος trong lời trích Kinh Thánh nói về Đức Chúa Trời
  choice: Chúa
  alternative: CHÚA; Chủ
  rationale: Dịch theo chính văn Hy Lạp κύριος, không tự động đưa cách trình bày danh YHWH của bản Hê-bơ-rơ vào chính văn Tân Ước.
- issue: Sắc thái của προσκυνέω
  choice: thờ phượng
  alternative: sấp mình trước; cúi lạy
  rationale: Ngữ cảnh đòi hỏi sự tôn thờ tôn giáo dành riêng cho Đức Chúa Trời, nhưng chú thích vẫn bảo lưu hình ảnh cụ thể hơn của động từ.
- issue: Tính độc quyền trong αὐτῷ μόνῳ
  choice: chỉ phụng sự một mình Ngài
  alternative: phụng sự Ngài mà thôi
  rationale: Cách chọn giữ rõ sự độc quyền hướng về đối tượng, không làm μόνῳ thành trạng từ chỉ cách thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “ngươi” trong lời trích mệnh lệnh để giữ sắc thái Kinh Thánh mà vẫn rõ nghĩa; “Ngài” quy chiếu về Đức Chúa Trời. Dấu chú thích [a] được đặt ngay sau từ liên quan, còn [b] đặt sau toàn bộ lời trích.
