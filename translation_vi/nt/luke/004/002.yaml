  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: vi
  text: Suốt bốn mươi ngày, Ngài bị ma quỷ cám dỗ.[a] Trong những ngày ấy, Ngài không ăn gì cả; khi những ngày ấy đã kết thúc, Ngài thấy đói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bị thử thách.” Động từ Hy Lạp có thể mang nghĩa “cám dỗ” hoặc “thử thách”; ở đây, “cám dỗ” phù hợp hơn vì tác nhân là ma quỷ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: suốt bốn mươi ngày
  rationale: Đối cách chỉ khoảng thời gian được diễn đạt tự nhiên bằng “suốt,” làm rõ sự kéo dài mà không thêm ý.
- source_word: πειραζόμενος
  choice: chịu ... cám dỗ
  rationale: Động từ có thể mang nghĩa “cám dỗ” hoặc “thử thách.” Vì tác nhân ở đây là ma quỷ, nghĩa “cám dỗ” phù hợp nhất; nghĩa còn lại được giữ trong chú thích.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: ma quỷ
  rationale: Trong văn cảnh Phúc Âm, διάβολος là danh xưng quen thuộc chỉ một tác nhân có ngôi vị; “ma quỷ” là cách gọi rõ ràng, phổ thông trong tiếng Việt.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: Ngài không ăn gì cả
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sắc thái phủ định nhấn mạnh của nguyên văn.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Trong những ngày ấy
  rationale: Cụm từ chỉ khoảng thời gian nói trên, được chuyển sát nghĩa và trang trọng tự nhiên.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: khi những ngày đó đã mãn
  rationale: Kết cấu sở hữu cách tuyệt đối được chuyển thành mệnh đề thời gian; “đã mãn” bảo toàn ý khoảng thời gian đã đi đến chỗ kết thúc.
- source_word: ἐπείνασεν
  choice: Ngài thấy đói
  rationale: Đây là cách nói tiếng Việt tự nhiên, diễn tả tình trạng đói xuất hiện sau khi thời gian ấy kết thúc.
theological_decisions:
- issue: Cách dịch πειραζόμενος đối với trải nghiệm của Chúa Giê-su trong hoang mạc
  choice: chịu ma quỷ cám dỗ
  alternative: bị ma quỷ thử thách
  rationale: “Cám dỗ” phù hợp nhất với tác nhân là ma quỷ, nhưng chú thích vẫn bảo lưu nghĩa từ vựng “thử thách,” không giải quyết thay độc giả sự căng thẳng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su theo ngữ cảnh liên tục của câu trước; dấu chấm phẩy giúp câu tiếng Việt rõ nhịp mà vẫn giữ quan hệ giữa hai mệnh đề.
