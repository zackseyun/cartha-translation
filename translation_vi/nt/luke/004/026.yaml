review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng thể bị động không nêu tác nhân, phủ định loại trừ, và mệnh đề ngoại lệ. Tuy nhiên, cách đặt “một bà góa ở Sa-rép-ta” làm quan hệ cú pháp thiên về việc người góa phụ ở tại Sa-rép-ta, trong khi nguyên văn lần lượt nêu địa điểm Sa-rép-ta (thuộc Si-đôn) rồi người nhận là một phụ nữ góa chồng. Cần diễn đạt lại để phản ánh rõ cả hai bổ ngữ của động từ “được sai đến”.
  naturalness: “đã không được sai đến với một ai” không sai, nhưng “không được sai đến với ai” tự nhiên và gọn hơn trong tiếng Việt hiện đại. “Bà góa” có thể gợi độ tuổi hoặc sắc thái xưng gọi; “một người phụ nữ góa chồng” trung tính hơn và phản ánh rõ γυναῖκα χήραν.
  terminology: Ê-li, Sa-rép-ta và Si-đôn là các dạng phiên âm có thể dùng nhất quán. Chú thích hiện dùng “Xa-rép-ta” như thể là dạng Cựu Ước khác, nhưng không cần thiết và có nguy cơ gây lẫn lộn với chính tên Sa-rép-ta trong bản dịch; nên nói trực tiếp về sự đồng nhất truyền thống với địa danh trong 1 Các Vua 17:9.
  issues:
  - severity: medium
    issue: Quan hệ của Sa-rép-ta và người góa phụ chưa được phản ánh sát cấu trúc nguồn
    rationale: 'Nguyên văn có hai cụm πρὸς: Ê-li được sai đến Sa-rép-ta thuộc Si-đôn, đến với một phụ nữ góa chồng. “một bà góa ở Sa-rép-ta” nén hai cụm này và chuyển trọng tâm sang nơi cư trú của người phụ nữ.'
  - severity: low
    issue: “Bà góa” có sắc thái tuổi tác/xưng gọi không có trong γυναῖκα
    rationale: γυναῖκα χήραν chỉ một người phụ nữ góa chồng; cách gọi trung tính tránh thêm sắc thái không được nêu.
  - severity: low
    issue: Chú thích dùng một dạng địa danh khác không giải thích rõ
    rationale: Nên giữ Sa-rép-ta trong chú thích và chỉ nêu sự đồng nhất truyền thống với địa danh được nhắc đến tại 1 Các Vua 17:9.
