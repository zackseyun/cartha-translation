revisions:
- from: Ê-li đã không được sai đến với một ai trong số họ, ngoại trừ đến với một bà góa ở Sa-rép-ta, thuộc vùng Si-đôn.[a]
  to: Ê-li không được sai đến với ai trong số họ, ngoại trừ đến Sa-rép-ta, thuộc Si-đôn, đến với một người phụ nữ góa chồng.[a]
  rationale: Bản sửa giữ thể bị động và tác nhân không được nêu, giữ lực loại trừ của εἰ μὴ, đồng thời biểu đạt riêng địa điểm Sa-rép-ta thuộc Si-đôn và người phụ nữ góa chồng là đối tượng Ê-li được sai đến. Chú thích được làm nhất quán với dạng địa danh trong bản văn và vẫn cung cấp liên hệ Cựu Ước.
  reviewer_model: gpt-5.6-terra
