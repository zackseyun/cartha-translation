source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: vi
  text: Ê-li không được sai đến với ai trong số họ, ngoại trừ đến Sa-rép-ta, thuộc Si-đôn, đến với một người phụ nữ góa chồng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp: “Sa-rép-ta thuộc Si-đôn”; theo truyền thống, đây là địa danh được nhắc đến trong 1 Các Vua 17:9.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: được sai đến
  rationale: Giữ thể bị động của động từ πέμπω và không nói rõ tác nhân, đúng với sự dè dặt của bản Hy Lạp.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: không ... đến với một ai trong số họ
  rationale: Diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ ý hướng đến người và sự loại trừ nhấn mạnh bởi οὐδεμίαν.
- source_word: Ἠλίας
  choice: Ê-li
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Đây là cấu trúc chỉ ngoại lệ, không phải điều kiện.
- source_word: Σάρεπτα
  choice: Sa-rép-ta
  rationale: Phiên âm trực tiếp địa danh Hy Lạp Σάρεπτα; chú thích nêu sự đồng nhất truyền thống với địa danh thời Cựu Ước.
- source_word: τῆς Σιδωνίας
  choice: thuộc vùng Si-đôn
  rationale: Truyền đạt quan hệ địa lý của sở hữu cách một cách rõ ràng, tự nhiên, không đồng nhất thị trấn với chính thành Si-đôn.
- source_word: γυναῖκα χήραν
  choice: một bà góa
  rationale: Cách nói tự nhiên trong tiếng Việt cho cụm đồng vị nghĩa đen là 'một người đàn bà, một góa phụ'.
theological_decisions:
- issue: Tác nhân ngầm của việc sai Ê-li đi
  choice: 'Giữ thể bị động không nêu tác nhân: “Ê-li ... được sai đến”'
  alternative: 'Nói rõ Đức Chúa Trời là tác nhân: “Đức Chúa Trời sai Ê-li”'
  rationale: Ngữ cảnh hàm ý Đức Chúa Trời là Đấng sai phái, nhưng câu Hy Lạp không trực tiếp nêu tác nhân; bản dịch không bổ sung điều mà câu không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh vừa phải cho tiếng Việt tự nhiên, nhưng vẫn giữ trọng tâm loại trừ và thể bị động của nguyên bản.
