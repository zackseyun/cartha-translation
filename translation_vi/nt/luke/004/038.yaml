source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: vi
  text: Rời hội đường, Đức Giê-su vào nhà Si-môn. Mẹ vợ của Si-môn đang bị một cơn sốt cao hành hạ, và họ thưa với Ngài về bà[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ cầu xin Ngài giúp bà.” Nguyên văn Hy Lạp sát nghĩa là “họ hỏi/thỉnh cầu Ngài về bà”; trong văn cảnh, lời này rất có thể hàm ý xin Ngài cứu giúp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Đức Giê-su đứng dậy, rời hội đường
  rationale: Phân từ bất định Ἀναστὰς diễn tả hành động xảy ra trước động từ chính; ἀπό chỉ sự rời khỏi một nơi. Cách dịch này giữ trình tự hành động và tự nhiên trong tiếng Việt.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: và vào nhà Si-môn
  rationale: εἰσέρχομαι đi với εἰς chỉ sự đi vào một địa điểm. “Vào nhà Si-môn” ngắn gọn và đúng nghĩa.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: Mẹ vợ của Si-môn
  rationale: πενθερά chỉ cụ thể mẹ vợ; sở hữu cách τοῦ Σίμωνος diễn tả quan hệ với Si-môn. Bản dịch nêu trực tiếp quan hệ thân thuộc mà không suy diễn thêm.
- source_word: ἦν συνεχομένη
  choice: đang bị ... hành hạ
  rationale: Cấu trúc περιφραστικός với phân từ bị động của συνέχω diễn tả tình trạng bị bệnh tật khống chế hoặc đè nặng. “Đang bị ... hành hạ” giữ sắc thái bị động và mức độ nghiêm trọng.
- source_word: πυρετῷ μεγάλῳ
  choice: một cơn sốt cao
  rationale: πυρετός là cơn sốt, còn μέγας nhấn mạnh mức độ. “Sốt cao” là cách nói y khoa thông dụng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: họ thưa với Ngài về bà
  rationale: ἐρωτάω có thể mang nghĩa hỏi hoặc thỉnh cầu. Cách dịch này giữ lời văn tương đối gần với cấu trúc Hy Lạp và không biến hàm ý xin chữa lành thành một phát biểu hoàn toàn minh nhiên.
theological_decisions:
- issue: Hàm ý về tình trạng hôn nhân của Si-môn trong πενθερά
  choice: Dịch trực tiếp là “mẹ vợ” mà không thêm kết luận lịch sử hay giáo lý.
  alternative: Diễn giải thêm rằng Si-môn đã kết hôn.
  rationale: Câu này xác định quan hệ thân thuộc và qua đó hàm ý Si-môn có vợ, nhưng bản dịch không nên mở rộng quá ý nghĩa từ vựng của nguyên văn.
- issue: Sắc thái của lời thỉnh cầu trong ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: Dùng “họ thưa với Ngài về bà” trong chính văn.
  alternative: “Họ xin Ngài giúp bà” hoặc “họ cầu xin Ngài chữa cho bà.”
  rationale: Văn cảnh cho thấy đây rất có thể là lời xin Đức Giê-su giúp đỡ hoặc chữa lành, nhưng nguyên văn chỉ nói họ hỏi/thỉnh cầu Ngài về bà. Chính văn giữ sự dè dặt ấy, còn chú thích nêu hàm ý theo văn cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “hội đường” cho συναγωγή và “Ngài” làm đại từ tôn kính chỉ Đức Giê-su. Dấu chú thích [a] được đặt sau cụm từ mà chú thích giải thích, thay vì sau “hội đường” như vị trí bị lệch trong lớp tham khảo tiếng Anh.
