source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: vi
  text: Khi mặt trời đang lặn[a], tất cả những ai có người mắc đủ loại bệnh đều đưa họ đến với Giê-su. Ngài đặt tay trên từng người và chữa lành họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong lúc mặt trời đang lặn.” Tiếng Hy Lạp dùng một cấu trúc diễn tả thời điểm các sự việc này xảy ra, với hành động mặt trời lặn đang diễn tiến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Khi mặt trời đang lặn
  rationale: Cấu trúc sở hữu cách tuyệt đối với phân từ hiện tại diễn tả thời điểm đồng thời và tiến trình mặt trời lặn. “Khi… đang lặn” tự nhiên trong tiếng Việt và giữ được sắc thái diễn tiến; δέ không cần được dịch bằng một từ nối riêng ở đây.
- source_word: ἅπαντες ὅσοι
  choice: tất cả những ai
  rationale: Giữ sức nhấn mạnh bao quát của tổ hợp Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: có người mắc đủ loại bệnh
  rationale: Trong ngữ cảnh này, εἶχον chỉ những người có thân nhân hoặc người thuộc sự chăm nom đang đau ốm; cách dịch không thu hẹp quan hệ ấy thành một loại quan hệ cụ thể. “Đủ loại bệnh” chuyển tải tính đa dạng của νόσοις ποικίλαις.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: đều đưa họ đến với Đức Chúa Jêsus
  rationale: “Đưa… đến” là cách diễn đạt tự nhiên cho ἄγω trong bối cảnh người bệnh được mang hoặc dẫn đến. Danh xưng được nêu rõ để tránh đại từ mơ hồ trong tiếng Việt.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: từng người
  rationale: 'Diễn đạt rõ sức nhấn mạnh phân phối của ἑνὶ ἑκάστῳ: không bỏ sót một cá nhân nào.'
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: đặt tay trên
  rationale: Giữ nguyên hành động cụ thể được mô tả, dùng thành ngữ Kinh Thánh quen thuộc nhưng vẫn dễ hiểu trong tiếng Việt.
- source_word: ἐθεράπευεν
  choice: chữa lành
  rationale: Thì chưa hoàn thành gợi hành động tiếp diễn hoặc lặp lại khi Ngài lần lượt chăm sóc từng người; “từng người” đã giúp thể hiện sắc thái lặp lại, nên “chữa lành” là tự nhiên và đầy đủ.
theological_decisions:
- issue: Ý nghĩa của việc đặt tay
  choice: Ngài đặt tay trên từng người và chữa lành họ
  alternative: Ngài cứ đặt tay trên từng người mà chữa lành họ
  rationale: Bản dịch bảo toàn hành động chữa lành mang tính cụ thể và sự quan tâm đến từng cá nhân, nhưng không gán cho việc đặt tay ý nghĩa bí tích hay giáo hội học mà câu này không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi tôn kính, đồng thời làm rõ chủ thể mà nguyên văn biểu thị bằng đại từ. Không thêm một từ nối tương đương “bấy giờ” vì nguyên văn không có từ chỉ thời gian ấy; lực nối nhẹ của δέ được để cho mạch văn đảm nhiệm.
