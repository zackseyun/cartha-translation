  source_fidelity: Bản dịch chuyển tải đúng mốc thời gian đồng thời của sở hữu cách tuyệt đối, tính bao quát của ἅπαντες ὅσοι, các bệnh đa dạng, và việc Chúa Giê-su chữa lành từng cá nhân. Tuy nhiên, “Đức Chúa Jêsus” vừa dùng chính tả tên riêng không phải dạng hiện đại phổ thông, vừa thêm tước hiệu không có trong câu Hy Lạp, nơi chỉ dùng đại từ πρὸς αὐτόν.
  naturalness: Câu văn nhìn chung tự nhiên, trang trọng và rõ ràng. “Khi mặt trời đang lặn” và “đặt tay trên từng người” là những cách diễn đạt tốt. Dùng “Ngài” ở câu hai có tiền ngữ rõ khi câu trước nêu tên Giê-su.
  terminology: Nên dùng “Giê-su”, cách viết hiện đại phổ thông. “Chữa lành” phù hợp ngữ cảnh và không áp đặt hàm ý giáo lý; “đặt tay trên” giữ đúng hành động cụ thể của nguyên văn.
