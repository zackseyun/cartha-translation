  source_fidelity: Bản thảo truyền đạt đúng hướng đi trong κατῆλθεν, tính bất định của πόλιν, đại từ αὐτούς, và số nhiều của ἐν τοῖς σάββασιν. Tuy nhiên, “thường giảng dạy” diễn giải rõ hơn mức cần thiết về sắc thái thói quen; thì chưa hoàn thành kết hợp với số nhiều có thể gợi tính lặp lại, nhưng không cần thêm trạng từ “thường” vào bản văn chính. “Ở miền Ga-li-lê” cũng phản ánh tự nhiên hơn quan hệ địa vực của τῆς Γαλιλαίας.
