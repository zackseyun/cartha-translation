source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: vi
  text: Rồi Ngài đi xuống Ca-phác-na-um, một thành ở miền Ga-li-lê. Ngài giảng dạy họ vào các ngày Sa-bát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng số nhiều, “các ngày Sa-bát,” có lẽ chỉ nhiều dịp Sa-bát lặp lại; cũng có thể dịch theo lối nói gọn là “vào ngày Sa-bát.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: đi xuống
  rationale: Giữ sắc thái phương hướng của κατέρχομαι; cách nói này cũng phù hợp với hành trình xuống vùng Ca-phác-na-um mà không giải thích quá mức.
- source_word: Καφαρναοὺμ
  choice: Ca-phác-na-um
  rationale: Phiên âm địa danh Hy Lạp sang dạng dễ đọc và gần âm nguồn trong tiếng Việt hiện đại.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: một thành thuộc miền Ga-li-lê
  rationale: “Một thành” phản ánh danh từ không có mạo từ; “thuộc miền Ga-li-lê” diễn đạt tự nhiên quan hệ sở thuộc/địa vực của sở hữu cách.
- source_word: ἦν διδάσκων
  choice: thường giảng dạy
  rationale: Kết cấu vị từ chưa hoàn thành với phân từ diễn tả hành động kéo dài hoặc lặp lại; trong ngữ cảnh có “các ngày sa-bát,” “thường giảng dạy” truyền đạt tự nhiên tính lặp lại.
- source_word: αὐτοὺς
  choice: họ
  rationale: Giữ đại từ của nguyên văn, không tự ý xác định đó là một nhóm người cụ thể.
- source_word: ἐν τοῖς σάββασιν
  choice: vào các ngày sa-bát
  rationale: Giữ dạng số nhiều của σάββασιν và sắc thái nhiều dịp sa-bát, đồng thời diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Có nên chuyển số nhiều σάββασιν thành số ít theo lối nói quen thuộc hay không
  choice: vào các ngày sa-bát
  alternative: vào ngày sa-bát
  rationale: Số nhiều có thể cho thấy Chúa Giê-su giảng dạy vào nhiều dịp sa-bát; giữ số nhiều tránh làm người đọc hiểu đây chỉ là một dịp duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để giữ đại từ ngôi thứ ba của nguyên văn trong mạch văn nói về Chúa Giê-su; “thành” và “miền” tạo giọng Kinh Thánh tự nhiên mà không cổ hóa. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
