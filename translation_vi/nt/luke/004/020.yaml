revisions:
- from: Rồi Ngài cuộn sách[a] lại, trao trả cho người phục vụ[b] và ngồi xuống. Ánh mắt của mọi người trong hội đường đều chăm chú hướng về Ngài.
  to: Rồi Ngài cuộn sách[a] lại, trả lại cho người phục vụ[b] và ngồi xuống. Mọi người trong hội đường đều chăm chú nhìn Ngài.
  rationale: Các chỉnh sửa chỉ nhằm tăng tính tự nhiên của tiếng Việt và làm rõ sắc thái “trả lại”; không thay đổi ý nghĩa, trình tự hành động, phạm vi “mọi người”, hay mức độ chăm chú trong nguyên văn. Vị trí các ký hiệu chú thích vẫn gắn đúng với “sách” và “người phục vụ”.
