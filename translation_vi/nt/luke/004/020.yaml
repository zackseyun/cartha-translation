source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: vi
  text: Rồi Ngài cuộn sách[a] lại, trả lại cho người phục vụ[b] và ngồi xuống. Mọi người trong hội đường đều chăm chú nhìn Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “sách”. Từ Hy Lạp này có thể chỉ một văn bản nói chung, nhưng trong bối cảnh hội đường, vật được đọc là một cuộn sách.
    reason: lexical_alternative
  - marker: b
    text: Tức là người phục vụ tại hội đường, có trách nhiệm coi sóc các cuộn sách.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: cuộn ... lại
  rationale: Trong bối cảnh đọc Kinh Thánh tại hội đường, vật được dùng là cuộn sách; cách dịch này diễn tả đúng động tác cuộn lại, thay vì cách nói dành cho sách đóng gáy.
- source_word: βιβλίον
  choice: cuộn sách
  rationale: Từ Hy Lạp có thể chỉ văn bản hay sách nói chung, nhưng tại hội đường thế kỷ thứ nhất, bản sách Ê-sai được đọc dưới dạng cuộn.
- source_word: ἀποδοὺς
  choice: trao trả
  rationale: Diễn tả việc giao vật lại cho người phụ trách sau khi sử dụng, đồng thời giữ được sắc thái của động từ ghép Hy Lạp.
- source_word: ὑπηρέτῃ
  choice: người phục vụ
  rationale: Trong ngữ cảnh này, đây là người phụ trách hỗ trợ buổi nhóm và coi sóc các cuộn sách; cách dịch này tránh sắc thái dễ gây hiểu lầm của “đầy tớ”.
- source_word: ἐκάθισεν
  choice: ngồi xuống
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, thuật lại trực tiếp hành động mà không giải thích thêm tư thế giảng dạy.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: Ánh mắt của mọi người
  rationale: Giữ hình ảnh đôi mắt trong nguyên văn nhưng diễn đạt tự nhiên, đồng thời bảo toàn phạm vi bao quát của πάντων.
- source_word: ἀτενίζοντες αὐτῷ
  choice: đều chăm chú hướng về Ngài
  rationale: Diễn tả ánh nhìn liên tục và tập trung, không thêm sắc thái thù địch hay bất lịch sự.
- source_word: συναγωγῇ
  choice: hội đường
  rationale: Ngữ cảnh chỉ rõ nơi nhóm họp và thiết chế thờ phượng của người Do Thái.
theological_decisions:
- issue: Hình thức lịch sử của βιβλίον trong việc đọc Kinh Thánh tại hội đường
  choice: Dịch là “cuộn sách”
  alternative: sách
  rationale: “Cuộn sách” phản ánh chính xác vật thể trong bối cảnh lịch sử mà không làm thay đổi ý nghĩa thần học; chú thích vẫn bảo lưu nghĩa rộng hơn của từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu đầu giữ chuỗi hành động theo thứ tự của nguyên văn; câu sau giữ hình ảnh “ánh mắt” và cường độ của động từ chỉ sự chăm chú. Các dấu chú thích [a], [b] đều được đặt ngay sau từ ngữ liên quan.
