id: LUK.4.6
reference: Luke 4:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: vi
  text: 'Ma quỷ nói với Ngài: “Ta sẽ ban cho Ngài tất cả quyền cai trị này cùng vinh quang của các nước ấy[a], vì quyền ấy đã được giao cho ta, và ta muốn ban cho ai thì ban.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vẻ huy hoàng của các nước ấy.” Từ Hy Lạp ở đây có thể chỉ vinh quang, vẻ huy hoàng hoặc sự tráng lệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Ma quỷ
  rationale: Trong trình thuật cám dỗ của Lu-ca, từ này là danh xưng chỉ Sa-tan; “Ma quỷ” là cách gọi quen thuộc và tự nhiên trong tiếng Việt, phù hợp hơn việc dịch theo nghĩa từ nguyên là “kẻ vu khống”.
- source_word: Σοὶ δώσω
  choice: Ta sẽ ban cho Ngài
  rationale: Đại từ ở đầu câu mang sắc thái nhấn mạnh người nhận. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ được sự đối lập ngầm giữa “Ngài” và người nói.
- source_word: ἐξουσίαν
  choice: quyền cai trị
  rationale: Trong ngữ cảnh các vương quốc ở câu trước, từ này chỉ thẩm quyền hoặc quyền thống trị, không đơn thuần là sức mạnh. “Quyền cai trị” làm rõ sắc thái chính trị mà không vượt quá nguồn.
- source_word: ταύτην ἅπασαν
  choice: tất cả ... này
  rationale: Giữ cả ý chỉ định lẫn tính toàn thể của cụm Hy Lạp theo trật tự tự nhiên của tiếng Việt.
- source_word: δόξαν αὐτῶν
  choice: vinh quang của các nước ấy
  rationale: Đại từ số nhiều quay lại các vương quốc đã được cho thấy ở câu 5. Nêu rõ “các nước ấy” tránh đại từ mơ hồ trong tiếng Việt, còn “vinh quang” giữ liên hệ từ vựng và sắc thái Kinh Thánh; chú thích ghi nhận nghĩa “vẻ huy hoàng” trong ngữ cảnh.
- source_word: παραδέδοται
  choice: đã được giao cho ta
  rationale: Thể hoàn thành bị động diễn tả việc đã xảy ra với kết quả còn hiệu lực. “Đã được giao” giữ thể bị động và không tự thêm nhận định về tính chính đáng của lời tuyên bố.
- source_word: ᾧ ἂν θέλω δίδωμι αὐτήν
  choice: ta muốn ban cho ai thì ban
  rationale: Cấu trúc tiếng Việt này diễn đạt tự nhiên quyền tùy ý mà người nói tự nhận, đồng thời truyền đạt giá trị khái quát của động từ hiện tại.
theological_decisions:
- issue: Lời Ma quỷ tự nhận quyền trên các vương quốc có được trình bày như một sự thật do người kể xác nhận hay không
  choice: Dịch trực tiếp nguyên lời tuyên bố của Ma quỷ, không thêm từ ngữ xác nhận hoặc phủ nhận
  alternative: Thêm lời phân cách như “ta tự cho rằng” hoặc “theo lời hắn”
  rationale: 'Bản Hy Lạp trình bày đây là lời nói trực tiếp của Ma quỷ. Bản dịch cần giữ nguyên căng thẳng thần học: không biến lời ấy thành lời xác nhận của người kể, nhưng cũng không dùng lời bình của dịch giả để làm suy yếu nó.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ta/Ngài” trong lời Ma quỷ nói với Đức Chúa Jêsus để phản ánh sự đối thoại trực tiếp mà không dùng lối xưng hô suồng sã. “Quyền cai trị” phù hợp ngữ cảnh các vương quốc; câu cuối dùng kết cấu thành ngữ tự nhiên “muốn ban cho ai thì ban”.
