  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: vi
  text: Họ sửng sốt trước lời dạy của Ngài, vì lời Ngài có uy quyền[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì sứ điệp của Ngài đầy uy quyền,” hoặc “vì Ngài nói với uy quyền.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: sửng sốt
  rationale: Động từ ở thì chưa hoàn thành diễn tả phản ứng kinh ngạc đang diễn ra; “sửng sốt” truyền đạt rõ cường độ của phản ứng trong tiếng Việt hiện đại.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: trước lời dạy của Ngài
  rationale: ἐπί với cách dữ ở đây chỉ đối tượng/căn nguyên gây sửng sốt. “Trước lời dạy” tự nhiên trong tiếng Việt và không thu hẹp διδαχή chỉ còn giáo lý.
- source_word: διδαχῇ
  choice: lời dạy
  rationale: Cách dịch này có thể bao hàm cả hành động giảng dạy lẫn nội dung được dạy, phù hợp với bối cảnh hội đường.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι giới thiệu nguyên nhân khiến người nghe sửng sốt; “vì” thể hiện quan hệ nhân quả ngắn gọn và tự nhiên.
- source_word: ἐν ἐξουσίᾳ
  choice: có uy quyền
  rationale: Thành ngữ Hy Lạp mô tả phẩm chất và sức nặng có thẩm quyền của lời Chúa Giê-su. “Có uy quyền” là cách diễn đạt tự nhiên, trang trọng và không thêm lời giải thích thần học.
- source_word: ὁ λόγος αὐτοῦ
  choice: lời Ngài
  rationale: λόγος ở đây chỉ lời nói hoặc điều Chúa Giê-su phán dạy. “Lời Ngài” giữ được sự cô đọng của nguyên văn mà vẫn rõ nghĩa trong văn cảnh.
theological_decisions:
- issue: Bản chất uy quyền trong lời Chúa Giê-su
  choice: lời Ngài có uy quyền
  alternative: Ngài nói với uy quyền; sứ điệp của Ngài có thẩm quyền
  rationale: Câu này khẳng định lời Chúa Giê-su mang uy quyền nhưng không giải thích đầy đủ nguồn gốc thần học của uy quyền ấy. Bản dịch giữ nguyên lời khẳng định mà không thêm một kết luận Kitô học ngoài điều câu này trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo lối xưng hô kính trọng quen thuộc trong bản văn Kinh Thánh tiếng Việt; câu văn giữ cấu trúc nhân quả gọn của nguyên văn.
