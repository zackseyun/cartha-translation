id: LUK.4.23
reference: Luke 4:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Chắc hẳn các ông sẽ nói với tôi câu tục ngữ này: ‘Thầy thuốc, hãy chữa lấy mình!’ Những việc chúng tôi đã nghe xảy ra tại Ca-phác-na-um[a], ông cũng hãy làm tại đây, ở quê hương mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát giới từ Hy Lạp: “đến/vào Ca-phác-na-um”; nhưng trong ngữ cảnh này, giới từ ấy được dùng theo nghĩa chỉ nơi sự việc xảy ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: Chắc hẳn
  rationale: Diễn đạt sắc thái nhấn mạnh và dự đoán đầy tin chắc của trạng từ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐρεῖτέ μοι
  choice: các ông sẽ nói với tôi
  rationale: Giữ thì tương lai chỉ lời đáp mà Chúa Giê-su biết trước; đại từ số nhiều phù hợp với nhóm người đang nghe.
- source_word: παραβολὴν
  choice: câu tục ngữ
  rationale: Trong ngữ cảnh này, từ này chỉ một câu nói dân gian ngắn gọn, không phải một dụ ngôn có cốt truyện.
- source_word: Ἰατρέ
  choice: Thầy thuốc
  rationale: Chỉ người hành nghề chữa bệnh và giữ được sắc thái trang trọng, quen thuộc của câu tục ngữ.
- source_word: θεράπευσον σεαυτόν
  choice: hãy chữa lấy mình
  rationale: Giữ lực mệnh lệnh của động từ và lối diễn đạt súc tích, có tính tục ngữ trong tiếng Việt.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Mọi việc chúng tôi nghe nói đã xảy ra
  rationale: Giữ tính chất thông tin được nghe kể lại và nghĩa rộng của những sự việc đã xảy ra, không tự ý xác định đó chỉ là phép lạ hay việc chữa lành.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: tại Ca-phác-na-um
  rationale: Dù giới từ εἰς thường có nghĩa là ‘đến/vào’, với động từ chỉ sự xảy ra, ý nghĩa trong ngữ cảnh là địa điểm; ‘tại’ diễn đạt tự nhiên trong tiếng Việt.
- source_word: ποίησον καὶ ὧδε
  choice: ông cũng hãy làm tại đây
  rationale: Giữ động từ nghĩa rộng ‘làm’, lực mệnh lệnh và ý bổ sung của καί, không thu hẹp thành ‘thực hiện phép lạ’.
- source_word: ἐν τῇ πατρίδι σου
  choice: ở quê hương mình
  rationale: πατρίς ở đây chỉ quê quán hay nơi quê nhà của Chúa Giê-su trong bối cảnh Na-xa-rét; ‘quê hương’ tự nhiên và không hàm ý một quốc gia hiện đại.
theological_decisions:
- issue: Bản chất của παραβολή trong câu này
  choice: Dịch là ‘câu tục ngữ’
  alternative: ‘dụ ngôn’ hoặc ‘lời ví von’
  rationale: Câu ‘Thầy thuốc, hãy chữa lấy mình’ là một châm ngôn ngắn gọn, không phải một câu chuyện dụ ngôn; lựa chọn này phản ánh thể loại trong ngữ cảnh mà không áp đặt cách giải thích giáo phái.
- issue: Phạm vi của những việc đã xảy ra tại Ca-phác-na-um
  choice: Giữ cách nói rộng ‘mọi việc ... đã xảy ra’
  alternative: Diễn giải là ‘mọi phép lạ’ hoặc ‘mọi việc chữa lành’
  rationale: Nguyên văn không nêu cụ thể loại hành động; giữ cách nói rộng bảo toàn sự không xác định của văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời trần thuật; trong lời mà Chúa Giê-su dự báo dân chúng sẽ nói trực tiếp với mình, dùng “ông” để phản ánh ngôi thứ hai số ít mà không thêm sắc thái tôn kính không có trong nguyên văn. “Ca-phác-na-um” theo lối phiên âm Kinh Thánh quen thuộc.
