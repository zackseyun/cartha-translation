revisions:
- from: 'Ngài nói với họ: “Chắc hẳn các ông sẽ nói với tôi câu tục ngữ này: ‘Thầy thuốc, hãy chữa lấy mình!’ Mọi việc chúng tôi nghe nói đã xảy ra tại Ca-phác-na-um[a], ông cũng hãy làm tại đây, ở quê hương mình.”'
  to: 'Ngài nói với họ: “Chắc hẳn các ông sẽ nói với tôi câu tục ngữ này: ‘Thầy thuốc, hãy chữa lấy mình!’ Những việc chúng tôi đã nghe xảy ra tại Ca-phác-na-um[a], ông cũng hãy làm tại đây, ở quê hương mình.”'
  rationale: Chỉ thay «Mọi việc chúng tôi nghe nói đã xảy ra» bằng «Những việc chúng tôi đã nghe xảy ra» để phản ánh ὅσα ἠκούσαμεν γενόμενα mà không tạo cảm giác nguyên văn khẳng định tất cả mọi việc hoặc thêm một tầng thuật lại không cần thiết. Các lựa chọn còn lại được giữ nguyên.
