lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: đều đầy
  rationale: Giữ hình ảnh và sắc thái bị động của πίμπλημι theo cách diễn đạt tự nhiên trong tiếng Việt; kết hợp với θυμοῦ thành “đầy giận dữ”.
- source_word: πάντες
  choice: tất cả mọi người
  rationale: Diễn đạt rõ toàn thể những người hiện diện, phù hợp với danh từ số nhiều chỉ tập thể.
- source_word: θυμοῦ
  choice: giận dữ
  rationale: θυμός ở đây chỉ cơn giận mạnh; “giận dữ” tự nhiên, trang trọng và không mặc nhiên đẩy cường độ lên mức “cuồng nộ”.
- source_word: ἐν τῇ συναγωγῇ
  choice: trong nhà hội
  rationale: Giữ nghĩa định vị trực tiếp của giới từ ἐν và dùng thuật ngữ tiếng Việt quen thuộc cho συναγωγή trong bối cảnh Do Thái.
- source_word: ἀκούοντες
  choice: Nghe
  rationale: Phân từ hiện tại diễn tả hoàn cảnh đồng thời dẫn đến phản ứng; đưa lên đầu câu tạo câu tiếng Việt tự nhiên mà vẫn giữ quan hệ thời gian.
- source_word: ταῦτα
  choice: những điều ấy
  rationale: Giữ tính khái quát và số nhiều của đại từ chỉ định, quy chiếu về các lời Đức Giê-su vừa nói mà không thu hẹp thành riêng “những lời”.
