  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: vi
  text: 'Trong hội đường có một người đàn ông có một linh của một quỷ ô uế[a], và người ấy kêu lên bằng một giọng lớn:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp dùng cả hai từ “linh” và “quỷ”; cũng có thể dịch: “một linh quỷ ô uế.”'
    reason: lexical_clarification
lexical_decisions:
- source_word: συναγωγῇ
  choice: hội đường
  rationale: Chỉ nơi người Do Thái tụ họp và thờ phượng; “hội đường” là cách gọi chuẩn xác, quen thuộc trong tiếng Việt.
- source_word: ἄνθρωπος
  choice: một người đàn ông
  rationale: Trong câu chuyện, danh từ số ít giống đực chỉ một người nam, nên dịch rõ là “người đàn ông”.
- source_word: ἔχων
  choice: mang
  rationale: Giữ gần nghĩa “có, mang” của phân từ Hy Lạp, đồng thời tự nhiên hơn “có linh” trong tiếng Việt và không thêm ý giải thích mạnh hơn như “bị ám”.
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: linh của một quỷ ô uế
  rationale: Giữ lại cả πνεῦμα (“linh”) lẫn δαιμόνιον (“quỷ”); ἀκαθάρτου ở dạng sở hữu cách hòa hợp trực tiếp với δαιμονίου, vì vậy “quỷ ô uế” phản ánh sát cấu trúc Hy Lạp.
- source_word: ἀνέκραξεν
  choice: kêu lớn tiếng
  rationale: Diễn đạt tự nhiên hành động cất tiếng kêu mạnh, không cường điệu thành “gào thét”.
- source_word: φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Truyền đạt trực tiếp thành ngữ “bằng một tiếng lớn” theo cách nói tự nhiên của tiếng Việt.
theological_decisions:
- issue: Cách dịch thuật ngữ chỉ thực thể ma quỷ
  choice: linh của một quỷ ô uế
  alternative: tà linh; linh ô uế; quỷ thần ô uế
  rationale: Nguyên văn dùng cả “linh” và “quỷ”, nên bản dịch giữ cả hai thay vì giản lược thành một thuật ngữ. Cách dịch này không thêm khẳng định thần học như “bị quỷ ám” và giữ được cấu trúc bất thường của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hội đường” giữ sắc thái lịch sử Do Thái; “mang linh” bảo toàn cách diễn đạt của nguyên văn dù hơi khác lối nói thông thường. Dấu hai chấm chuẩn bị cho lời nói ở câu kế tiếp.
