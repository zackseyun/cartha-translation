  to: 'Trong hội đường có một người đàn ông có một linh của một quỷ ô uế[a], và người ấy kêu lên bằng một giọng lớn:'
  rationale: Sửa “mang” thành “có” để vừa sát nghĩa ἔχων vừa tự nhiên trong tiếng Việt. Điều chỉnh cách diễn đạt tiếng kêu để phản ánh đầy đủ động từ và cụm chỉ “giọng lớn.” Giữ cấu trúc “linh của một quỷ ô uế” trong thân bài nhằm bảo toàn cả hai thuật ngữ của nguyên văn và tránh thêm diễn giải thần học.
