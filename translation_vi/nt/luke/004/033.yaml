    issue: “mang linh” không tự nhiên và dễ gợi một nghĩa khác trong tiếng Việt.
    rationale: ἔχων nghĩa cơ bản là “có/đang có”; “có một linh...” sát nguyên văn hơn và không thêm hàm ý diễn giải.
  - severity: low
    issue: “kêu lớn tiếng” hơi trùng lặp và chưa diễn đạt rõ cấu trúc “kêu lên ... bằng một giọng lớn.”
    rationale: “Kêu lên bằng một giọng lớn” tự nhiên hơn, đồng thời phản ánh cả ἀνέκραξεν và φωνῇ μεγάλῃ.
  - severity: low
    issue: Chú thích hiện tại gọi chính cách dịch trong thân bài là “sát chữ” nhưng chưa nêu lựa chọn diễn đạt thay thế.
    rationale: Chú thích nên giải thích rõ rằng tiếng Hy Lạp dùng cả hai từ “linh” và “quỷ,” và cho biết cách dịch thay thế có thể có.
