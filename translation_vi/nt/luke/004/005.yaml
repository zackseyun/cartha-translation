  terminology: “Đức Giê-su,” “quỷ,” “vương quốc,” và “thế giới có người ở” phù hợp văn phong Kinh Thánh Việt ngữ hiện đại. “của thế giới có người ở” giữ sát hơn quan hệ ngữ pháp và nghĩa từ vựng của οἰκουμένη.
