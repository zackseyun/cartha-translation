revisions:
- from: Rồi quỷ đưa Đức Giê-su lên cao và cho Ngài thấy tất cả các vương quốc trong thế giới có người ở[a] chỉ trong khoảnh khắc[b].
  to: Sau khi đưa Đức Giê-su lên, quỷ cho Ngài thấy tất cả các vương quốc của thế giới có người ở[a] trong một khoảnh khắc[b].
  rationale: Sửa “đưa ... lên cao” thành “đưa ... lên” để không thêm mức độ cao hoặc địa điểm không có trong nguyên văn. Sửa “trong thế giới” thành “của thế giới” để phản ánh trực tiếp τῆς οἰκουμένης. Cấu trúc “Sau khi ...” biểu đạt tự nhiên giá trị thời gian/trình tự của phân từ ἀναγαγών mà không giải thích cơ chế của việc cho thấy các vương quốc.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:04Z'
