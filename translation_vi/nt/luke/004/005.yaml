  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng trình tự chính: quỷ đưa Đức Giê-su lên rồi cho Ngài thấy mọi vương quốc trong một khoảng thời gian cực ngắn. Tuy nhiên, “lên cao” thêm nét độ cao mà ἀναγαγών chỉ xác định hướng “lên”, không nói “cao”; và “các vương quốc trong thế giới” dễ chuyển quan hệ sở hữu/phạm vi của τῆς οἰκουμένης thành quan hệ vị trí.'
