source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: vi
  text: Sau khi đưa Đức Giê-su lên, quỷ cho Ngài thấy tất cả các vương quốc của thế giới có người ở[a] trong một khoảnh khắc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “của thế gian”. Từ Hy Lạp thường có nghĩa là “thế giới có người ở”, và trong một số văn cảnh có thể chỉ cụ thể hơn thế giới văn minh hoặc thế giới thuộc đế quốc.
    reason: lexical_alternative
  - marker: b
    text: Hay “trong tích tắc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν αὐτὸν
  choice: đưa Đức Giê-su lên cao
  rationale: Động tính từ bất định của ἀνάγω diễn tả việc đưa lên và có trước động từ chính. Cách dịch này giữ hướng đi lên nhưng không thêm địa điểm “núi”, vốn không có trong câu Hy Lạp của Lu-ca.
- source_word: ἔδειξεν αὐτῷ
  choice: cho Ngài thấy
  rationale: Diễn đạt tự nhiên cấu trúc “cho người ấy thấy”; giữ nguyên lời kể mà không xác định việc thấy diễn ra bằng thị kiến hay bằng cách nào khác.
- source_word: πάσας τὰς βασιλείας
  choice: tất cả các vương quốc
  rationale: βασιλεία ở số nhiều tại đây chỉ các vương quốc hay lãnh thổ cai trị, chứ không phải khái niệm trừu tượng về quyền trị vì.
- source_word: τῆς οἰκουμένης
  choice: trong thế giới có người ở
  rationale: οἰκουμένη thường chỉ thế giới có cư dân, đôi khi mang sắc thái thế giới văn minh hay đế quốc. “Thế giới có người ở” giữ nét nghĩa từ vựng mà không thu hẹp thành Đế quốc La Mã.
- source_word: ἐν στιγμῇ χρόνου
  choice: chỉ trong khoảnh khắc
  rationale: στιγμή chỉ một điểm hay khoảnh khắc cực ngắn. “Chỉ trong khoảnh khắc” tự nhiên trong tiếng Việt và bảo toàn ý nhấn mạnh sự ngắn ngủi.
theological_decisions:
- issue: Bản chất của việc quỷ cho Đức Giê-su thấy các vương quốc
  choice: Chỉ thuật lại rằng quỷ cho Ngài thấy, không xác định cơ chế.
  alternative: Một thị kiến siêu nhiên hoặc cảnh tượng được nhìn thấy theo nghĩa đen từ một nơi cao.
  rationale: Bản Hy Lạp không nói việc này là thị kiến, phép siêu nhiên hay quan sát từ một vị trí địa lý; bản dịch giữ nguyên sự không xác định ấy.
- issue: Chủ ngữ hàm ẩn của ἀναγαγών và ἔδειξεν
  choice: Nêu rõ là “quỷ” để câu tiếng Việt tự nhiên và liên kết với văn cảnh.
  alternative: Giữ đại từ “hắn” hoặc lược chủ ngữ theo sát hình thức Hy Lạp.
  rationale: Chủ ngữ được tiếp nối từ câu trước và là quỷ; việc nêu lại không thêm một khẳng định thần học mới mà giúp câu độc lập, rõ nghĩa trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” và đại từ tôn kính “Ngài”; không thêm “núi” từ câu song song trong Ma-thi-ơ. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
