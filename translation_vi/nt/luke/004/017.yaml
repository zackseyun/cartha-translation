  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: vi
  text: 'Người ta trao cho Ngài cuộn sách của nhà tiên tri Ê-sai[a]. Ngài mở cuộn sách ra và tìm đến chỗ có lời chép rằng:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quyển sách”. Từ Hy Lạp βιβλίον có thể chỉ một tài liệu viết nói chung, nhưng trong bối cảnh hội đường này, nhiều khả năng đó là một cuộn sách.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: người ta trao cho Ngài
  rationale: Động từ bị động có nghĩa là được trao hoặc được đưa cho. Cách chuyển sang chủ động với chủ ngữ phiếm chỉ “người ta” tự nhiên trong tiếng Việt và phù hợp với bối cảnh đọc Kinh Thánh tại hội đường.
- source_word: βιβλίον
  choice: cuộn sách
  rationale: Từ này có thể chỉ tài liệu viết nói chung, nhưng trong bối cảnh hội đường thế kỷ thứ nhất, vật được nói đến rất có thể là một cuộn sách chứ không phải sách đóng gáy.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: của nhà tiên tri Ê-sai
  rationale: Giữ nguyên quan hệ sở thuộc và danh hiệu tiên tri của Ê-sai bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀναπτύξας
  choice: mở cuộn sách ra
  rationale: Phân từ aorist diễn tả hành động xảy ra trước động từ chính. “Mở cuộn sách ra” tự nhiên hơn “tháo cuộn” trong tiếng Việt, đồng thời vẫn phù hợp với hình dạng của vật được nói đến.
- source_word: εὗρεν
  choice: tìm đến
  rationale: Trong ngữ cảnh xác định một vị trí trong cuộn sách, “tìm đến” truyền đạt tự nhiên hành động tìm và định vị đoạn cần đọc mà không hàm ý mức độ khó khăn.
- source_word: τόπον
  choice: chỗ
  rationale: Dịch sát nghĩa không gian của τόπος, đồng thời “chỗ có lời chép” là cách nói rõ ràng, tự nhiên khi chỉ một vị trí trong văn bản.
- source_word: οὗ ἦν γεγραμμένον
  choice: có lời chép rằng
  rationale: Diễn đạt tự nhiên công thức dẫn nhập lời trích dẫn trong tiếng Việt, phản ánh trạng thái ‘đã được chép’ của cấu trúc hoàn thành quanh co mà không dùng lối văn cổ khó hiểu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; giữ hình ảnh lịch sử “cuộn sách”. Tách thành hai câu để tiếng Việt tự nhiên, nhưng vẫn bảo toàn trình tự hành động của nguyên văn.
