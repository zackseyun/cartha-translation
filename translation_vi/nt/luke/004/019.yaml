  text: để công bố năm Chúa thi ân[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để công bố năm ân huệ của Chúa.”'
    reason: lexical_alternative
  - marker: b
