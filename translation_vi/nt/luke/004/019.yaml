lexical_decisions:
- source_word: κηρύξαι
  choice: để công bố
  rationale: Động từ nguyên mẫu chỉ mục đích, tiếp nối chuỗi mục đích ở câu trước. “Công bố” giữ sắc thái loan báo công khai của κηρύσσω mà không thu hẹp thành việc giảng đạo.
- source_word: ἐνιαυτὸν
  choice: năm
  rationale: ἐνιαυτός thông thường có nghĩa là “năm”. Giữ cách nói này để bảo tồn âm hưởng Ê-sai 61:2 và không diễn giải khái quát thành “thời kỳ”.
- source_word: κυρίου
  choice: Chúa
  rationale: κύριος được dịch là “Chúa”. Trong cụm “năm Chúa thi ân”, quan hệ sở hữu/đặc trưng của sở hữu cách được diễn đạt tự nhiên bằng tiếng Việt.
- source_word: δεκτόν
  choice: thi ân
  rationale: Trong ngữ cảnh lời trích Ê-sai, δεκτός nói đến thời kỳ được đánh dấu bởi sự ưu ái và chấp nhận của Chúa. “Thi ân” truyền đạt tự nhiên ý niệm Chúa ban ân huệ, trong khi chú thích giữ lại cách hiểu sát mặt chữ hơn là “được Chúa vui nhận”.
theological_decisions:
- issue: Âm hưởng Ê-sai 61:2 và khả năng gợi đến Năm Hân Hỉ
  choice: Giữ từ “năm” nhưng không thêm “Năm Hân Hỉ” vào chính văn.
  alternative: để công bố Năm Hân Hỉ của Chúa
  rationale: Câu Hy Lạp gợi lại Ê-sai 61:2 và có thể khiến người đọc liên tưởng đến Năm Hân Hỉ, nhưng không trực tiếp dùng thuật ngữ ấy. Vì vậy, không đưa phần diễn giải đó vào chính văn.
- issue: Sắc thái của δεκτόν
  choice: năm Chúa thi ân
  alternative: năm được Chúa vui nhận
  rationale: Cách chọn chính diễn đạt ý về ân huệ của Đức Chúa Trời phù hợp với ngữ cảnh Ê-sai, còn chú thích bảo tồn khả năng hiểu theo nghĩa “được chấp nhận/vui nhận” vốn có của δεκτός.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: CHÚA
  rationale: “Chúa” phản ánh trực tiếp κύριος trong bản Hy Lạp và không quy định quá mức cách thể hiện danh Đức Chúa Trời từ truyền thống Cựu Ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thi ân” là cách nói cô đọng, vẫn thông dụng trong văn phong trang trọng; các chú thích nêu cách diễn đạt minh giải và cách dịch sát truyền thống. Cả hai dấu chú thích [a], [b] đều xuất hiện trong chính văn.
