    issue: “tiếp tục giảng dạy” thêm ý và làm mờ nghĩa của κηρύσσων
    rationale: ἦν κηρύσσων là kết cấu vị hoàn thành tiếp diễn, nêu hoạt động đang diễn ra hoặc lặp lại trong quá khứ, không tất yếu hàm ý hành động đã có trước đó rồi được tiếp tục. κηρύσσω nhấn mạnh sự rao truyền/công bố công khai, không đơn thuần là dạy dỗ.
