  rationale: 'Thay “tiếp tục giảng dạy” bằng “đang rao giảng” để phản ánh sát hơn kết cấu ἦν κηρύσσων: một hoạt động rao truyền công khai đang diễn ra trong quá khứ, không thêm suy diễn rằng hoạt động ấy được tiếp nối từ trước. Giữ nguyên địa danh theo bản SBLGNT và chú thích dị bản để không điều hòa căng thẳng địa lý trong văn mạch.'
