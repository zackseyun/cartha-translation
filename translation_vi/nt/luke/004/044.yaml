source:
  edition: SBLGNT
  text: καὶ ἦν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ τῆς ⸀Ἰουδαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: vi
  text: Ngài đang rao giảng trong các nhà hội ở Giu-đê[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Ga-li-lê” thay cho “Giu-đê”. Phần chính theo cách đọc “Giu-đê” trong bản văn Hy Lạp được dùng ở đây.
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: tiếp tục giảng dạy
  rationale: Kết cấu vị hoàn thành tiếp diễn (ἦν + phân từ hiện tại) diễn tả hoạt động kéo dài hoặc lặp lại trong quá khứ. “Tiếp tục giảng dạy” thể hiện tự nhiên sắc thái này trong tiếng Việt.
- source_word: κηρύσσων
  choice: giảng dạy
  rationale: Động từ κηρύσσω chỉ việc công bố công khai. Trong bối cảnh nhà hội, “giảng dạy” là cách diễn đạt tự nhiên, dễ hiểu, dù “rao giảng” cũng có thể dùng.
- source_word: εἰς τὰς συναγωγάς
  choice: trong các nhà hội
  rationale: Dù εἰς thường mang nghĩa “vào”, tại đây cụm từ chỉ địa điểm hoặc phạm vi diễn ra việc giảng dạy; tiếng Việt tự nhiên dùng “trong”.
- source_word: συναγωγάς
  choice: các nhà hội
  rationale: Trong bối cảnh này, συναγωγή chỉ nơi hội họp và thờ phượng của người Do Thái; “nhà hội” là thuật ngữ tiếng Việt quen thuộc và chính xác.
- source_word: Ἰουδαίας
  choice: Giu-đê
  rationale: Bản SBLGNT đọc Ἰουδαίας, tức Giu-đê. Bản dịch giữ nguyên địa danh này thay vì điều hòa với bối cảnh Ga-li-lê; dị bản được ghi ở chú thích.
theological_decisions:
- issue: Địa danh τῆς Ἰουδαίας trong bối cảnh phần tường thuật đang nói đến Ga-li-lê
  choice: Giu-đê
  alternative: Ga-li-lê; hoặc hiểu Giu-đê theo nghĩa rộng là lãnh thổ của người Do Thái
  rationale: Ưu tiên chứng cứ nguyên ngữ đòi hỏi giữ cách đọc “Giu-đê” của SBLGNT. Sự căng thẳng về địa lý không được âm thầm điều hòa; dị bản “Ga-li-lê” được nêu trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu về Chúa Giê-su theo ngữ cảnh; “nhà hội” là thuật ngữ phổ thông cho συναγωγή. Câu ngắn gọn, giữ sắc thái hành động tiếp diễn và không giải quyết thay người đọc sự căng thẳng địa lý.
