id: LUK.4.41
reference: Luke 4:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: vi
  text: 'Các quỷ cũng lần lượt ra khỏi nhiều người, vừa la lớn vừa nói rằng: “Ngài là Con Đức Chúa Trời!” Nhưng Ngài quở trách chúng và không cho chúng nói, vì chúng biết Ngài là Đấng Mê-si-a[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Ki-tô.” Từ Hy Lạp Χριστός nghĩa là “Đấng được xức dầu.”'
    reason: Bảo lưu cách dịch truyền thống của danh hiệu Χριστός và giải thích nghĩa từ nguyên chính xác.
lexical_decisions:
- source_word: δαιμόνια
  choice: các quỷ
  rationale: Danh từ chỉ trực tiếp các quỷ; không đổi thành “tà linh” vì nguyên văn không dùng cụm từ tương ứng với “uế linh”.
- source_word: ἐξήρχετο
  choice: ra khỏi
  rationale: Thì chưa hoàn thành diễn tả hành động đang hoặc liên tiếp xảy ra trong bối cảnh; kết hợp với “cũng” và “nhiều người” tạo lời kể tự nhiên trong tiếng Việt.
- source_word: ἀπὸ πολλῶν
  choice: khỏi nhiều người
  rationale: Nguyên văn lược bỏ danh từ chỉ người, nhưng tiếng Việt cần bổ sung “người” để câu rõ ràng và tự nhiên; ngữ cảnh xác định đây là những người bị quỷ ám.
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: la lớn rằng
  rationale: Gộp hai phân từ theo lối diễn đạt tự nhiên của tiếng Việt, vẫn giữ cả cường độ lớn tiếng và nội dung lời nói.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Giữ nguyên sức nặng danh hiệu và cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: ἐπιτιμῶν
  choice: quở trách
  rationale: Diễn đạt lời khiển trách hoặc mệnh lệnh nghiêm khắc, phù hợp với thẩm quyền của Chúa Giê-xu trong trình thuật.
- source_word: οὐκ εἴα αὐτὰ λαλεῖν
  choice: không cho chúng nói
  rationale: Cách nói gọn, tự nhiên, phản ánh sự ngăn cấm có tính tiếp diễn của động từ ở thì chưa hoàn thành.
- source_word: ᾔδεισαν
  choice: chúng biết
  rationale: Diễn đạt đúng trạng thái nhận biết trong quá khứ theo văn cảnh mà không làm nặng câu bằng một cấu trúc quá khứ kép.
- source_word: τὸν χριστὸν
  choice: Đấng Mê-si
  rationale: Χριστός ở đây là danh hiệu chỉ Đấng được xức dầu, không phải tên riêng; “Đấng Mê-si” giữ rõ chức năng danh hiệu.
- source_word: αὐτὸν εἶναι
  choice: Ngài là
  rationale: Chuyển cấu trúc đối cách–nguyên mẫu sang mệnh đề phụ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch Χριστός trong lời nhận biết của các quỷ
  choice: Đấng Mê-si
  alternative: Đấng Ki-tô
  rationale: Từ này có chức năng danh hiệu trong câu. Bản dịch chính nêu nghĩa thiên sai, còn cách gọi truyền thống được bảo lưu trong chú thích.
- issue: Quan hệ giữa “Con Đức Chúa Trời” và “Đấng Mê-si”
  choice: Giữ hai danh hiệu riêng biệt
  alternative: Gộp hai danh hiệu thành một lời giải thích duy nhất
  rationale: Nguyên văn để các quỷ xưng “Con Đức Chúa Trời”, rồi người kể cho biết chúng nhận ra Ngài là “Đấng Mê-si”; giữ riêng hai cách gọi bảo toàn cấu trúc và sức căng thần học của câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-xu, “chúng” để chỉ các quỷ. Dấu chú thích được đặt ngay sau “Đấng Mê-si”, là từ mà chú thích giải thích.
