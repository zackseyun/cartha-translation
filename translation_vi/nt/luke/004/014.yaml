source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: vi
  text: Rồi Đức Giê-su trở về Ga-li-lê trong quyền năng của Thánh Linh, và tin về Ngài lan khắp cả vùng lân cận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp cũng có thể được dịch là “tin tức”, “danh tiếng” hoặc “tin đồn”. Từ này chỉ một tin được truyền rộng rãi, nhưng tự nó không xác định đó là tin tích cực hay tiêu cực.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: trở về
  rationale: Động từ ὑποστρέφω trong lời kể chỉ sự quay lại một nơi; “trở về” tự nhiên và giữ rõ hướng di chuyển.
- source_word: ἐν τῇ δυνάμει
  choice: trong quyền năng
  rationale: Giữ tương đối sát cấu trúc giới từ, diễn đạt hoàn cảnh hoặc cách thức Chúa Giê-su trở về mà không thu hẹp thành ý nghĩa công cụ.
- source_word: τοῦ πνεύματος
  choice: của Thánh Linh
  rationale: Trong văn mạch Lu-ca 4, πνεῦμα chỉ Thánh Linh. Tiếng Việt thường cần dùng danh xưng đầy đủ để xác định rõ đối tượng, dù tính từ “thánh” không xuất hiện tại câu này.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: về Ga-li-lê
  rationale: “Về” phù hợp với động từ “trở về” và diễn đạt tự nhiên đích đến trong tiếng Việt.
- source_word: φήμη
  choice: tin
  rationale: φήμη chỉ tin tức hoặc lời truyền đi rộng rãi, không tự nó xác định nội dung tích cực hay tiêu cực. “Tin” ngắn gọn, tự nhiên và giữ được tính trung lập ấy.
- source_word: ἐξῆλθεν
  choice: lan
  rationale: Ẩn dụ chuyển động “đi ra” khi nói về tin tức được diễn đạt tự nhiên trong tiếng Việt bằng “lan”, không làm thay đổi ý nghĩa.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: khắp cả vùng lân cận
  rationale: Diễn đạt đầy đủ ý phân bố “khắp toàn bộ” và nghĩa địa lý của περίχωρος là khu vực bao quanh.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: Cách diễn đạt tự nhiên cho περί với sở hữu cách; “Ngài” duy trì văn phong tôn kính phổ biến khi nói về Chúa Giê-su.
theological_decisions:
- issue: Đối tượng được πνεύματος chỉ đến
  choice: Thánh Linh
  alternative: thần linh hoặc tinh thần không xác định
  rationale: Văn mạch trực tiếp của Lu-ca 4 nhiều lần xác định Thánh Linh là Đấng dẫn dắt và ban quyền năng cho Chúa Giê-su. Bản dịch làm rõ đối tượng theo văn mạch, không thêm một ý thần học xa lạ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su”, “Thánh Linh” và đại từ tôn kính “Ngài”. Dấu chú thích [a] được đặt sau mệnh đề chứa từ “tin” mà chú thích giải thích.
