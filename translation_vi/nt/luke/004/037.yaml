translation:
  language: vi
  text: Tin tức về Ngài cứ lan ra khắp mọi nơi trong vùng lân cận.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tin tức về Ngài đang truyền đi đến mọi nơi trong vùng lân cận.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: cứ lan ra
  rationale: Thể chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ; với ἦχος làm chủ ngữ, “cứ lan ra” tự nhiên trong tiếng Việt mà vẫn giữ hướng lan truyền ra ngoài.
- source_word: ἦχος
  choice: tin tức
  rationale: Từ này có nghĩa gốc là “âm thanh”, nhưng trong kết cấu ἦχος περὶ αὐτοῦ chỉ tin tức hoặc lời truyền về Đức Giê-su; “tin tức” rõ nghĩa và hợp văn cảnh.
- source_word: περὶ αὐτοῦ
  choice: về Ngài
  rationale: Diễn đạt trực tiếp nội dung của tin tức. “Ngài” là đại từ tôn kính, tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: εἰς πάντα τόπον
  choice: khắp mọi nơi
  rationale: Truyền đạt tự nhiên sức phân bố của πάντα τόπον trong tiếng Việt; “khắp” cũng thể hiện sự lan đến nhiều nơi.
- source_word: τῆς περιχώρου
  choice: trong vùng lân cận
  rationale: περίχωρος chỉ khu vực bao quanh; “vùng lân cận” ngắn gọn, tự nhiên và giữ ý địa lý.
- source_word: καὶ
  choice: '[không dịch riêng]'
  rationale: Trong tiếng Việt, mở câu bằng “Và” ở đây kém tự nhiên; quan hệ tiếp nối với câu trước vẫn rõ qua mạch thuật chuyện.
