  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: vi
  text: 'Đức Giê-su đáp lời nó: “Có lời phán rằng:[a] ‘Ngươi không được thử thách Chúa là Đức Chúa Trời của ngươi.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hy Lạp: “Đã có lời phán.” Cách dịch truyền thống thường là “Có lời chép rằng.”'
    reason: alternative_reading
  - marker: b
    text: Lời này trích Phục Truyền Luật Lệ Ký 6:16; bản Hê-bơ-rơ tại đó dùng danh YHWH, thường được thể hiện là “CHÚA”.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: đáp lời
  rationale: Cụm phân từ + động từ hữu hạn là một cách nói Hy Lạp chịu ảnh hưởng Semit, mang nghĩa tự nhiên là “đáp” hoặc “trả lời”; “đáp lời” vừa gọn vừa trang trọng trong tiếng Việt.
- source_word: αὐτῷ
  choice: nó
  rationale: Đại từ chỉ đối tượng mà Đức Giê-su đang đáp lại, tức ma quỷ trong văn cảnh. “Nó” là cách gọi tự nhiên trong tiếng Việt đối với ma quỷ và tránh thêm danh xưng không có trong câu Hy Lạp.
- source_word: ὅτι
  choice: —
  rationale: Sau động từ “đáp lời”, tiếng Việt không cần dịch riêng liên từ ὅτι; nội dung lời đáp được dẫn trực tiếp.
- source_word: Εἴρηται
  choice: Có lời phán rằng
  rationale: Đây là dạng hoàn thành bị động của λέγω, theo nghĩa sát là “đã được nói/phán”. Trong công thức trích dẫn Kinh Thánh, “Có lời phán rằng” tự nhiên, biểu đạt thẩm quyền của lời được trích và không đổi động từ thành “chép” như truyền thống.
- source_word: Οὐκ ἐκπειράσεις
  choice: Ngươi không được thử thách
  rationale: ἐκπειράζω có nghĩa đưa ra thử, thử đến mức thách thức. “Thử thách” rõ nghĩa trong tiếng Việt và tránh sắc thái “cám dỗ” là lôi kéo phạm tội.
- source_word: κύριον
  choice: Chúa
  rationale: Dịch κύριος là “Chúa”, theo hình thức của bản Hy Lạp. Cụm tiếp theo “là Đức Chúa Trời của ngươi” làm rõ quan hệ đồng vị.
- source_word: τὸν θεόν σου
  choice: Đức Chúa Trời của ngươi
  rationale: Cách dịch trang trọng, dễ hiểu, giữ đại từ sở hữu và quan hệ đồng vị trong cụm “Chúa là Đức Chúa Trời của ngươi”.
theological_decisions:
- issue: Công thức trích dẫn Kinh Thánh (Εἴρηται)
  choice: Có lời phán rằng
  alternative: Có lời chép rằng; Đã có lời phán
  rationale: Bản Hy Lạp dùng dạng bị động của λέγω (“nói/phán”), không dùng γράφω (“viết/chép”). Bản chính giữ nét nghĩa của nguyên ngữ; chú thích nêu cách dịch truyền thống quen thuộc.
- issue: Cách dịch κύριος trong lời trích Phục Truyền Luật Lệ Ký 6:16
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA; CHÚA
  rationale: Câu Hy Lạp có κύριον nên bản chính dịch theo bản Hy Lạp là “Chúa”. Tuy nhiên, nguồn Hê-bơ-rơ của lời trích dùng danh YHWH; điều này được ghi trong chú thích mà không áp đặt cách thể hiện danh ấy vào bản chính.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ trích dẫn “ngươi” để giữ sắc thái lời Kinh Thánh cổ được viện dẫn; dùng “nó” cho đối tượng là ma quỷ theo văn cảnh. Các dấu chú thích [a], [b] đều có mặt trong bản văn chính.
