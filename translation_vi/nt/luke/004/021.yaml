source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: vi
  text: 'Rồi Ngài bắt đầu nói với họ: “Hôm nay, lời Kinh Thánh này đã được ứng nghiệm trong lúc anh em đang nghe.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “trong tai anh em.”'
    reason: Cho biết hình ảnh nguyên văn đứng sau cách diễn đạt tự nhiên “trong lúc anh em đang nghe.”
lexical_decisions:
- source_word: ἤρξατο
  choice: bắt đầu
  rationale: Diễn đạt trực tiếp động từ ἄρχομαι trong cấu trúc với động từ nguyên mẫu, giữ ý Chúa Giê-su bắt đầu phát biểu.
- source_word: δὲ
  choice: Rồi
  rationale: Ở đây δέ đánh dấu bước tiếp theo trong diễn tiến câu chuyện hơn là sự tương phản; “Rồi” tự nhiên trong tiếng Việt.
- source_word: λέγειν πρὸς αὐτοὺς
  choice: nói với họ
  rationale: Giữ rõ hành động nói và đối tượng được Chúa Giê-su trực tiếp nói với.
- source_word: Σήμερον
  choice: Hôm nay
  rationale: Giữ vị trí nổi bật và tính tức thời của trạng từ chỉ thời gian.
- source_word: πεπλήρωται
  choice: đã được ứng nghiệm
  rationale: Thể hoàn thành bị động diễn tả điều đã xảy ra và có kết quả hiện tại; cách nói này cũng phù hợp khi Kinh Thánh được thực hiện trọn vẹn.
- source_word: ἡ γραφὴ αὕτη
  choice: lời Kinh Thánh này
  rationale: Trong ngữ cảnh, γραφή chỉ phần Kinh Thánh vừa được đọc; “lời Kinh Thánh này” rõ ràng và tự nhiên đối với độc giả hiện đại.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: ngay trong lúc anh em nghe
  rationale: Chuyển thành ngữ sát chữ “trong tai anh em” sang tiếng Việt tự nhiên, đồng thời giữ ý sự ứng nghiệm được công bố là đang xảy ra trong chính lúc cử tọa nghe.
theological_decisions:
- issue: Bản chất của lời tuyên bố ứng nghiệm
  choice: Giữ nguyên lời tuyên bố rằng Kinh Thánh đã được ứng nghiệm hôm nay, không thêm tác nhân hay cách thức ứng nghiệm.
  alternative: Diễn giải thành “Hôm nay, lời tiên tri này đã được ứng nghiệm bởi Ta khi anh em nghe.”
  rationale: Bản Hy Lạp nói “lời Kinh Thánh này” đã được ứng nghiệm trong sự nghe của cử tọa, nhưng không trực tiếp có các từ “lời tiên tri,” “bởi Ta” hay “trong Ta.” Bản dịch giữ nguyên sức nặng thần học mà không giải quyết thay cho văn mạch.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “anh em” cho số nhiều của ὑμῶν, tránh lối cổ “các ngươi.”
