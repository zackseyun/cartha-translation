revisions:
- from: 'Rồi Ngài bắt đầu nói với họ: “Hôm nay, lời Kinh Thánh này đã được ứng nghiệm ngay trong lúc anh em nghe.”[a]'
  to: 'Rồi Ngài bắt đầu nói với họ: “Hôm nay, lời Kinh Thánh này đã được ứng nghiệm trong lúc anh em đang nghe.”[a]'
  rationale: Chỉ bỏ “ngay” để tránh thêm sắc thái không được nêu rõ trong nguyên ngữ, đồng thời giữ nguyên ý rằng lời Kinh Thánh được ứng nghiệm hôm nay trong chính sự nghe của cử tọa. Các thành phần khác của bản dịch phù hợp với tiếng Hy Lạp và văn phong tiếng Việt hiện đại.
