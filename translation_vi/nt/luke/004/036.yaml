language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: vi
  text: 'Mọi người đều kinh ngạc, và họ nói với nhau: “Lời này là gì[a] mà Ngài truyền lệnh cho các linh ô uế với thẩm quyền và quyền năng, và chúng ra?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “Sứ điệp này là gì?” Từ Hy Lạp logos có thể có nghĩa là “lời”, “sứ điệp” hoặc “sự việc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: kinh ngạc
  rationale: Diễn tả trạng thái sửng sốt mạnh mẽ, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: mọi người đều kinh ngạc
  rationale: Chuyển thành cấu trúc tiếng Việt tự nhiên, vẫn giữ ý sự kinh ngạc bao trùm tất cả những người hiện diện.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: nói với nhau
  rationale: Thể hiện cuộc trao đổi qua lại; ngữ cảnh đủ để truyền đạt sắc thái tiếp diễn của thì chưa hoàn thành mà không cần thêm từ nặng nề.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Lời này là gì
  rationale: Giữ sự cô đọng và độ rộng nghĩa của λόγος, có thể chỉ lời nói, mệnh lệnh hoặc sứ điệp; chú thích nêu phương án tự nhiên hơn.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: lấy thẩm quyền và quyền năng
  rationale: Diễn đạt sắc thái phương tiện/cách thức của ἐν và giữ nguyên thứ tự hai khái niệm trong tiếng Hy Lạp.
- source_word: ἐπιτάσσει
  choice: truyền lệnh
  rationale: Một cách diễn đạt tự nhiên, rõ lực ra lệnh và giữ sắc thái hiện tại sống động của lời thuật.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: các uế linh
  rationale: Giữ thuật ngữ chỉ các hữu thể thuộc linh bị xem là ô uế trong bối cảnh trừ quỷ, không tâm lý hóa hay ẩn dụ hóa câu chuyện.
- source_word: ἐξέρχονται
  choice: chúng phải ra
  rationale: Trong tiếng Việt, “phải ra” diễn đạt tự nhiên kết quả tất yếu của mệnh lệnh có thẩm quyền; tuy vậy, nó làm rõ hàm ý hơn hình thức Hy Lạp đơn thuần “chúng ra”.
theological_decisions:
- issue: Cách gọi các hữu thể thuộc linh trong bối cảnh trừ quỷ
  choice: các uế linh
  alternative: các linh ô uế
  rationale: “Uế linh” ngắn gọn và quen thuộc trong văn phong Kinh Thánh, đồng thời bảo toàn khung tường thuật siêu nhiên và ý niệm ô uế của ἀκάθαρτος.
- issue: Quan hệ giữa thẩm quyền và quyền năng
  choice: giữ cả “thẩm quyền” và “quyền năng”
  alternative: gộp thành “đầy quyền năng”
  rationale: Hai danh từ Hy Lạp phân biệt quyền ra lệnh chính đáng với năng lực hữu hiệu; không nên hòa nhập chúng thành một ý.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Uế linh” duy trì sắc thái Kinh Thánh; “thẩm quyền và quyền năng” giữ sự phân biệt của nguyên văn. Dấu chú thích [a] được đặt sau toàn bộ câu trích dẫn để không cản trở nhịp đọc, nhưng chú thích trực tiếp giải thích cụm “Lời này là gì”.
