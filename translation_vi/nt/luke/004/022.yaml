source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: vi
  text: 'Mọi người đều nói tốt về Ngài[a] và kinh ngạc trước những lời ân hậu phát ra từ miệng Ngài[b]. Họ nói: “Đây chẳng phải là con ông Giô-sép sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm chứng cho Ngài” hoặc “làm chứng về Ngài.” Trong ngữ cảnh này, cụm từ Hy Lạp có lẽ mang nghĩa họ nói tốt về Ngài.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “những lời của ân điển.” Cụm từ có thể chỉ những lời mang đặc tính ân điển, ân huệ hoặc duyên dáng/cuốn hút.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: nói tốt về Ngài
  rationale: Trong ngữ cảnh này, cụm từ diễn tả phản ứng thuận lợi đối với Chúa Giê-su và đi song song với việc họ kinh ngạc; chú thích giữ lại nghĩa khả dĩ là làm chứng cho Ngài.
- source_word: ἐθαύμαζον
  choice: kinh ngạc
  rationale: Diễn đạt tự nhiên phản ứng ngạc nhiên, thán phục đang diễn ra của mọi người.
- source_word: ἐπὶ τοῖς λόγοις τῆς χάριτος
  choice: trước những lời đầy ân hậu
  rationale: ἐπί với cách dữ biểu thị căn cứ hay đối tượng của sự kinh ngạc; τῆς χάριτος có thể mang tính định phẩm, chỉ những lời có đặc tính ân hậu, đẹp lòng và ban ơn.
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: từ miệng Ngài thốt ra
  rationale: Giữ hình ảnh cụ thể của nguyên văn và cho thấy những lời ấy phát xuất từ chính miệng Chúa Giê-su.
- source_word: Οὐχὶ
  choice: chẳng phải ... sao
  rationale: Cấu trúc câu hỏi tiếng Việt này tự nhiên và giữ được sắc thái câu hỏi mong đợi câu trả lời khẳng định.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: Đây ... là con ông Giô-sép
  rationale: Truyền đạt trực tiếp nhận định của đám đông và quan hệ sở hữu trong nguyên văn, không thêm lời giải thích thần học.
theological_decisions:
- issue: Việc đám đông gọi Chúa Giê-su là con ông Giô-sép trong tương quan với sự thụ thai đồng trinh
  choice: Dịch thẳng lời của đám đông là “con ông Giô-sép” mà không thêm điều kiện giải thích.
  alternative: Thêm cách diễn đạt như “người ta vẫn cho là con ông Giô-sép” để tránh hiểu lầm.
  rationale: Câu này thuật lại nhận thức của đám đông chứ không phải lời hiệu đính của người kể chuyện. Việc thêm lời giải thích sẽ làm mất căng thẳng tự sự và đưa vào câu điều nguyên văn không nói.
- issue: Ý nghĩa của λόγοις τῆς χάριτος
  choice: Dùng “những lời đầy ân hậu” và ghi chú nghĩa sát chữ “những lời của ân điển”.
  alternative: Dịch ngay trong chính văn là “những lời của ân điển”.
  rationale: Cách dịch chính văn tự nhiên trong tiếng Việt và phản ánh khả năng genitive định phẩm, trong khi chú thích bảo toàn cách hiểu sát chữ cùng độ mở thần học của χάρις.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “ông” cho Giô-sép. Cấu trúc “chẳng phải ... sao?” bảo toàn lực tu từ của câu hỏi Hy Lạp.
