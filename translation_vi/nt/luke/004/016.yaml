  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: vi
  text: Ngài đến Nazara[a], nơi Ngài đã lớn lên; theo thói quen của Ngài, vào ngày Sa-bát Ngài vào hội đường và đứng dậy để đọc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng gọi là Nazareth (Na-xa-rét). Tiếng Hy Lạp ở đây ghi Nazara.
    reason: Giữ dạng Ναζαρά của nguồn Hy Lạp trong chính văn, đồng thời giúp độc giả nhận ra địa danh quen thuộc.
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: Phiên âm trực tiếp dạng địa danh Hy Lạp Ναζαρά trong câu này, thay vì đồng nhất âm thầm với dạng quen thuộc Nazareth.
- source_word: τεθραμμένος
  choice: đã lớn lên
  rationale: Phân từ hoàn thành bị động của τρέφω ở đây chỉ việc được nuôi dưỡng, trưởng thành tại một nơi; “đã lớn lên” tự nhiên trong tiếng Việt và giữ trọng tâm vào nơi Ngài được nuôi dạy.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: theo thói quen
  rationale: Diễn đạt tự nhiên một việc Ngài vẫn thường làm, không thêm ý về quy định hay nghĩa vụ.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: vào ngày Sa-bát
  rationale: σαββάτων mang hình thức số nhiều trong thành ngữ Hy Lạp nhưng ở ngữ cảnh này chỉ ngày Sa-bát.
- source_word: συναγωγήν
  choice: hội đường
  rationale: Trong bối cảnh Do Thái, từ này chỉ nơi hội họp và thờ phượng; “hội đường” là cách gọi tiếng Việt rõ ràng, thông dụng.
- source_word: ἀνέστη ἀναγνῶναι
  choice: đứng lên để đọc Kinh Thánh
  rationale: Giữ quan hệ mục đích của động từ với nguyên mẫu. “Kinh Thánh” được bổ sung để làm rõ đối tượng đọc theo bối cảnh phụng vụ hội đường, dù tân ngữ không được nêu trực tiếp trong câu Hy Lạp.
theological_decisions:
- issue: Cách ghi địa danh Ναζαρά
  choice: Nazara
  alternative: Nazareth (Na-xa-rét)
  rationale: Theo sát dạng địa danh thực sự có trong bản văn Hy Lạp của câu này, đồng thời ghi dạng quen thuộc ở chú thích để người đọc nhận diện; quyết định này không nhằm tạo ra hai địa điểm khác nhau.
- issue: Chủ ngữ được biểu thị bằng đại từ
  choice: Ngài
  alternative: ông / người
  rationale: Bản Hy Lạp dùng ngôi thứ ba theo mạch văn. “Ngài” là cách quy chiếu trang trọng và tự nhiên đến Chúa Giê-su trong văn phong Kinh Thánh tiếng Việt, không thêm một khẳng định thần học mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu dài Hy Lạp được tách thành hai câu tiếng Việt để đọc tự nhiên. “Sa-bát” và “hội đường” giữ thuật ngữ văn hóa Do Thái quen thuộc.
