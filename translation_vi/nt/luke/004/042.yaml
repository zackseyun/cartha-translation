  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: vi
  text: Khi trời sáng, Đức Giê-su đi ra và đến một nơi vắng vẻ[a]. Dân chúng tìm kiếm Người; họ đến chỗ Người và cố giữ Người lại, không cho Người rời khỏi họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một nơi hiu quạnh” hoặc “một nơi hoang vắng”. Tiếng Hy Lạp chỉ một địa điểm cách biệt hoặc không có người ở.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “tìm cách cản Người lại”. Ý nói dân chúng cố ngăn Người rời đi, nhưng câu này không nhất thiết hàm ý họ dùng sức mạnh thể chất.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Khi trời sáng
  rationale: Diễn đạt tự nhiên cấu trúc sở hữu cách tuyệt đối chỉ sự chuyển tiếp thời gian, vẫn giữ nghĩa lúc ngày bắt đầu.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: đi ra và đến
  rationale: Phân từ ἐξελθών diễn tả hành động đi ra trước hành động chính; tiếng Việt tự nhiên dùng hai động từ nối tiếp, còn “đến” thể hiện sự di chuyển tới địa điểm được nêu sau đó mà không lặp “đi” vụng về.
- source_word: εἰς ἔρημον τόπον
  choice: đến một nơi vắng vẻ
  rationale: ἔρημος mô tả nơi cách biệt hoặc không có người ở, không nhất thiết là sa mạc; “nơi vắng vẻ” rõ nghĩa và hợp ngữ cảnh.
- source_word: οἱ ὄχλοι
  choice: Dân chúng
  rationale: ὄχλοι chỉ đông đảo quần chúng; “dân chúng” tự nhiên, trang trọng vừa phải và tránh sắc thái hỗn tạp có thể có của “đám đông”.
- source_word: ἐπεζήτουν αὐτόν
  choice: tìm kiếm Người
  rationale: Thì chưa hoàn thành cho thấy hành động đang tiếp diễn; “tìm kiếm” giữ sắc thái chủ động và bền bỉ của động từ ghép ἐπιζητέω.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: họ đến tận nơi Người ở
  rationale: ἕως αὐτοῦ nhấn mạnh việc họ đi tới chỗ của Người; cách diễn đạt này tự nhiên hơn lối dịch sát “đến tận Người”.
- source_word: κατεῖχον αὐτὸν
  choice: cố giữ Người lại
  rationale: κατέχω có thể chỉ giữ lại hoặc ngăn cản; kết hợp với thì chưa hoàn thành, “cố giữ... lại” diễn tả nỗ lực đang diễn ra mà không khẳng định họ dùng sức mạnh thể chất.
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: không cho Người rời khỏi họ
  rationale: 'Cấu trúc mạo từ với động từ nguyên mẫu phủ định nêu điều họ muốn ngăn cản: Người rời đi khỏi họ.'
