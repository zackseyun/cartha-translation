    rationale: Không sai nghĩa chính, nhưng “vấp phải đá” diễn đạt tự nhiên hơn προσκόψῃς trong ngữ cảnh bàn chân gặp đá và vẫn không cường điệu hành động.
  revised_text: 'và rằng: “Họ sẽ nâng ngươi trên tay họ,[a] kẻo chân ngươi vấp phải đá.”[b]'
