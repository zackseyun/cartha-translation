  source_fidelity: 'Cần sửa “lấy tay nâng đỡ ngươi”: ἐπὶ χειρῶν nói rõ hình ảnh được nâng/mang «trên tay họ», không chỉ bằng tay như một phương tiện. Phần “kẻo chân ngươi va phải đá” truyền đạt đúng mệnh đề μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου, dù “vấp phải đá” sát hình ảnh hơn.'
  naturalness: “Họ sẽ nâng ngươi trên tay họ” là tiếng Việt hiện đại, rõ hình ảnh và vẫn có sắc thái trang trọng phù hợp lời trích dẫn. “Ngươi” phù hợp với lời trực tiếp trong văn cảnh này.
  terminology: Không có vấn đề thuật ngữ thần học. “Nâng” phản ánh αἴρω (nâng, mang), còn “trên tay họ” giữ đúng hình ảnh bảo vệ trong câu trích.
