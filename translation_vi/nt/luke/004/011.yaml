reference: Luke 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ὅτι Ἐπὶ χειρῶν ἀροῦσίν σε μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: vi
  text: 'và rằng: “Họ sẽ nâng ngươi trên tay họ,[a] kẻo chân ngươi vấp phải đá.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Họ sẽ bồng ngươi trên tay.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “kẻo ngươi đập chân vào đá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτι
  choice: và rằng
  rationale: Καί tiếp nối lời trích dẫn ở câu trước, còn ὅτι giới thiệu nội dung được trích. “Và rằng” giữ rõ sự tiếp nối ấy trong tiếng Việt.
- source_word: Ἐπὶ χειρῶν
  choice: lấy tay
  rationale: Diễn đạt tự nhiên phương tiện và hình ảnh được nâng đỡ bằng tay; chủ thể số nhiều được hiểu từ câu trước là các thiên sứ.
- source_word: ἀροῦσίν σε
  choice: họ sẽ nâng đỡ ngươi
  rationale: Động từ αἴρω ở đây mang nghĩa nâng lên hoặc mang đỡ. “Nâng đỡ” vừa dễ hiểu vừa giữ hình ảnh bảo vệ trong lời trích Thi Thiên.
- source_word: μήποτε
  choice: kẻo
  rationale: Diễn đạt ngắn gọn, tự nhiên sắc thái phòng ngừa của mệnh đề phủ định.
- source_word: προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: chân ngươi va phải đá
  rationale: Giữ số ít của πόδα và diễn đạt cụ thể việc bàn chân đụng vào đá; cấu trúc tiếng Việt tự nhiên mà không làm mạnh thêm động từ.
theological_decisions:
- issue: Cách diễn đạt hình ảnh bảo vệ trong lời trích Thi Thiên
  choice: “Họ sẽ lấy tay nâng đỡ ngươi”
  alternative: “Họ sẽ bồng ngươi trên tay”
  rationale: Cả hai đều phù hợp với αἴρω và ἐπὶ χειρῶν. Bản chính dùng “nâng đỡ” để giữ sắc thái trang trọng, dễ hiểu và không xác định quá mức tư thế mang; phương án kia được ghi ở chú thích.
- issue: Mức độ mạnh của προσκόπτω trong hình ảnh chân chạm đá
  choice: “va phải đá”
  alternative: “đập chân vào đá”
  rationale: “Va phải” phản ánh sự tiếp xúc gây vấp mà không cường điệu mức độ; “đập chân” là khả năng mạnh hơn và được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải. Đại từ “ngươi” được giữ vì đây là lời Kinh Thánh được trích dẫn trực tiếp với ngôi thứ hai số ít; câu văn tránh lối diễn đạt cổ như “e rằng” nhưng vẫn duy trì nhịp điệu trang nghiêm.
