  naturalness: Câu văn hiện đại, rõ ràng và trang trọng. “Ngài,” “giảng dạy,” và “hội đường” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Được mọi người ca ngợi” tự nhiên hơn cách dịch quá sát là “được mọi người tôn vinh” trong ngữ cảnh sự đón nhận công khai.
  terminology: “Hội đường” là thuật ngữ phù hợp cho συναγωγαί. “Ca ngợi” phản ánh hợp ngữ cảnh nghĩa khen ngợi/tán dương của δοξαζόμενος; chú thích bảo lưu các khả năng “tôn kính” và “tôn vinh,” kể cả liên hệ từ vựng với ý niệm vinh quang, mà không áp đặt diễn giải thần học.
