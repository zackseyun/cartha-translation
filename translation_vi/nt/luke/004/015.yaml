source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: vi
  text: Ngài giảng dạy trong các hội đường của họ và được mọi người ca ngợi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được mọi người tôn kính” hoặc “được mọi người tôn vinh.” Từ Hy Lạp có thể chỉ sự ca ngợi hay tôn kính công khai; “tôn vinh” giữ rõ hơn mối liên hệ của từ này với ý niệm vinh quang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối câu này với mạch kể trước đó; “và” giữ quan hệ phối hợp đơn giản, không thêm sắc thái thời gian.
- source_word: αὐτὸς
  choice: Ngài
  rationale: Đại từ chỉ Chúa Giê-su. Tiếng Việt không cần diễn đạt thành “chính Ngài” vì như vậy có thể nhấn mạnh quá mức sắc thái nhẹ của đại từ Hy Lạp.
- source_word: ἐδίδασκεν
  choice: giảng dạy
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn hoặc thường xuyên trong quá khứ. Trong mạch kể tiếng Việt, “giảng dạy” tự nhiên mà vẫn cho phép ngữ cảnh truyền đạt tính kéo dài.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: trong các hội đường của họ
  rationale: Giữ rõ địa điểm, số nhiều và đại từ sở hữu của nguyên văn; “hội đường” là cách gọi quen thuộc cho nơi hội họp và thờ phượng của người Do Thái.
- source_word: δοξαζόμενος
  choice: được ... ca ngợi
  rationale: Trong ngữ cảnh sự đón nhận công khai dành cho việc giảng dạy của Chúa Giê-su, động từ mang nghĩa được khen ngợi hoặc tôn kính. “Ca ngợi” là tiếng Việt tự nhiên, còn chú thích bảo lưu khả năng dịch mạnh hơn liên hệ với ý niệm vinh quang.
- source_word: ὑπὸ πάντων
  choice: được mọi người
  rationale: ὑπό với sở hữu cách đánh dấu tác nhân; “mọi người” truyền đạt phạm vi rộng của πάντων một cách tự nhiên.
theological_decisions:
- issue: Cách dịch δοξαζόμενος khi nói về Chúa Giê-su
  choice: được mọi người ca ngợi
  alternative: được mọi người tôn kính; được mọi người tôn vinh
  rationale: Ở đây từ này có thể chỉ sự khen ngợi hay tôn kính của công chúng. “Ca ngợi” phù hợp tự nhiên với ngữ cảnh, trong khi chú thích giữ lại nghĩa mạnh hơn “tôn vinh” và mối liên hệ từ vựng với vinh quang, không biến phản ứng thuận lợi của dân chúng thành một khẳng định thần học đầy đủ hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su; “hội đường” là thuật ngữ phổ thông trong văn cảnh Do Thái. Cấu trúc câu được sắp xếp tự nhiên trong tiếng Việt, đồng thời giữ cả hoạt động giảng dạy và phản ứng rộng rãi của công chúng.
