    rationale: ἐκαθαρίσθη là bị động của καθαρίζω, trong ngữ cảnh này là “được sạch/được làm sạch.” “Thanh sạch” trong tiếng Việt thường dễ hướng đến sự trong sạch đạo đức; “được sạch” vừa tự nhiên vừa giữ được cộng hưởng nghi lễ-thể chất của nguyên văn.
