source:
  edition: SBLGNT
  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: vi
  text: Vào thời nhà tiên tri Ê-li-sê, có nhiều người mắc bệnh phong[a] tại Israel, nhưng không ai trong số họ được sạch, ngoại trừ Na-a-man, người Syria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp được dịch là “bệnh phong” có thể chỉ nhiều loại bệnh ngoài da nghiêm trọng, không nhất thiết chỉ bệnh Hansen mà ngày nay thường gọi là bệnh phong.
    reason: Giữ cách gọi Kinh Thánh quen thuộc nhưng tránh đồng nhất phạm vi nghĩa cổ với một chẩn đoán y khoa hiện đại.
lexical_decisions:
- source_word: λεπροὶ
  choice: những người mắc bệnh phong
  rationale: Diễn đạt tự nhiên và tôn trọng con người trong tiếng Việt hiện đại, đồng thời giữ thuật ngữ Kinh Thánh quen thuộc; chú thích nêu rõ phạm vi nghĩa của từ Hy Lạp rộng hơn bệnh Hansen hiện đại.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: tại Israel
  rationale: Thể hiện nghĩa địa điểm hoặc phạm vi của giới từ ἐν mà không xác định quá mức là đất đai hay dân tộc.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: vào thời nhà tiên tri Ê-li-sê
  rationale: ἐπί với sở hữu cách ở đây mang nghĩa thời gian; cách dịch này rõ ràng, tự nhiên và giữ nguyên danh xưng của Ê-li-sê.
- source_word: ἐκαθαρίσθη
  choice: được thanh sạch
  rationale: Giữ hình ảnh về sự làm sạch trong nguyên văn, vốn bao gồm chiều kích thể chất và tình trạng thanh sạch theo bối cảnh Kinh Thánh, thay vì thu hẹp thành chỉ được chữa lành.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Trong cấu trúc này, cụm từ giới thiệu trường hợp ngoại lệ sau mệnh đề phủ định.
- source_word: Ναιμὰν ὁ Σύρος
  choice: Na-a-man, người Syria
  rationale: Giữ tên riêng cùng căn tính dân tộc của Na-a-man, qua đó bảo toàn sự tương phản giữa người được thanh sạch và nhiều người tại Israel.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ thanh sạch đối với bệnh phong
  choice: Dịch ἐκαθαρίσθη là “được thanh sạch”.
  alternative: “được chữa lành” hoặc “được làm cho tinh sạch”
  rationale: “Được thanh sạch” bảo toàn thành ngữ Kinh Thánh liên kết bệnh trạng với tình trạng ô uế, nhưng không thêm một kết luận giáo lý ngoài văn bản.
- issue: Sức nặng của căn tính dân tộc của Na-a-man
  choice: Giữ “người Syria” trong chính văn.
  alternative: Lược bỏ căn tính dân tộc hoặc diễn đạt mơ hồ hơn
  rationale: Cụm ὁ Σύρος nhận diện Na-a-man là người Syria và duy trì điểm nhấn rằng người được thanh sạch là một người ngoại quốc.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Dùng cách nói hướng đến con người “người mắc bệnh phong” thay vì biến bệnh trạng thành nhãn gọi. Các tên Ê-li-sê và Na-a-man theo dạng phiên âm quen thuộc; Israel và Syria dùng dạng quốc danh phổ biến trong tiếng Việt hiện đại.
