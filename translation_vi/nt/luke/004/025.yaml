source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: vi
  text: 'Nhưng tôi nói thật với các ông: vào thời Ê-li, có nhiều góa phụ trong Y-sơ-ra-ên, khi trời bị đóng lại trong ba năm sáu tháng và một nạn đói lớn xảy ra khắp cả xứ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: Nhưng quả thật, tôi nói với các ông
  rationale: Giữ sắc thái đối lập của δέ và lời khẳng định mạnh ἐπ’ ἀληθείας, đồng thời dùng cách nói tự nhiên trong tiếng Việt; ὑμῖν ở số nhiều được thể hiện bằng “các ông” theo nhóm người nghe trong ngữ cảnh.
- source_word: χῆραι
  choice: góa phụ
  rationale: Tương đương trực tiếp, rõ nghĩa và trang trọng vừa phải.
- source_word: ἐν ταῖς ἡμέραις Ἠλίου
  choice: Vào thời Ê-li
  rationale: Diễn đạt thành ngữ Hy Lạp tự nhiên trong tiếng Việt mà vẫn giữ tham chiếu lịch sử.
- source_word: ἐκλείσθη ὁ οὐρανὸς
  choice: trời đóng lại
  rationale: Giữ hình ảnh bị động mạnh của nguyên văn về việc trời không ban mưa, không diễn giải thêm tác nhân.
- source_word: ἐπὶ ἔτη τρία καὶ μῆνας ἕξ
  choice: suốt ba năm sáu tháng
  rationale: “Suốt” truyền đạt thời lượng kéo dài của ἐπί với đối cách.
- source_word: λιμὸς μέγας
  choice: một nạn đói lớn
  rationale: Phản ánh cả danh từ và tính từ nhấn mạnh mức độ.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: trên khắp xứ
  rationale: Trong ngữ cảnh này, γῆ có thể chỉ vùng đất/xứ sở; “xứ” bảo toàn phạm vi địa phương khả dĩ thay vì mặc nhiên mở rộng thành toàn thế giới.
theological_decisions:
- issue: Tác nhân khiến trời đóng lại
  choice: Giữ cấu trúc bị động “trời đóng lại”
  alternative: “Đức Chúa Trời đóng trời” hoặc “trời không mưa”
  rationale: Nguyên văn không nêu tác nhân trực tiếp và dùng hình ảnh “trời bị đóng”; bản dịch không thêm lời giải thích thần học hoặc thay hình ảnh bằng hệ quả.
- issue: Phạm vi của πᾶσαν τὴν γῆν
  choice: “khắp xứ”
  alternative: “khắp đất” hoặc “toàn thế giới”
  rationale: γῆ có độ rộng nghĩa từ đất/xứ đến địa cầu. Ngữ cảnh nạn đói thời Ê-li hỗ trợ nghĩa vùng đất; tránh giải quyết theo hướng phổ quát không cần thiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng tên quen thuộc “Ê-li” và “Y-sơ-ra-ên”. Chia câu sau lời dẫn để câu tiếng Việt sáng rõ nhưng vẫn giữ đầy đủ tiến trình ý của nguyên văn.
