  to: 'Nhưng tôi nói thật với các ông: vào thời Ê-li, có nhiều góa phụ trong Y-sơ-ra-ên, khi trời bị đóng lại trong ba năm sáu tháng và một nạn đói lớn xảy ra khắp cả xứ.'
  rationale: Chỉnh sửa giới hạn ở việc làm rõ quan hệ thời gian của ὡς và sắc thái bị động của ἐκλείσθη. Bản sửa vẫn bảo toàn tính không xác định tương đối của γῆ bằng “xứ”, không thêm tác nhân khiến trời đóng lại, và không thay đổi nội dung lịch sử hay thần học.
