  - severity: low
    issue: Sắc thái bị động của ἐκλείσθη chưa rõ
    rationale: “Trời đóng lại” có thể hiểu như một trạng thái chủ động trong tiếng Việt. “Trời bị đóng lại” giữ hình ảnh và sắc thái bị động của nguồn.
