id: LUK.4.29
reference: Luke 4:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: vi
  text: Họ đứng dậy, đuổi Ngài ra khỏi thị trấn và dẫn Ngài đến mép ngọn đồi, nơi thị trấn của họ đã được xây dựng,[a] để ném Ngài xuống.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gờ đồi” hoặc “chỏm của ngọn đồi”. Từ Hy Lạp chỉ phần gờ, mép, hoặc phần nhô của một nơi cao.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “quăng Ngài xuống” hoặc “ném Ngài từ trên cao xuống”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: đứng dậy
  rationale: Phân từ bất định diễn tả đám đông đứng lên và lập tức hành động; “đứng dậy” tự nhiên và giữ được động tác cụ thể.
- source_word: ἐξέβαλον
  choice: đuổi ... ra khỏi
  rationale: Động từ mang nghĩa trục xuất hoặc đẩy ra; “đuổi ... ra khỏi” thể hiện hành động cưỡng ép mà không thêm chi tiết ngoài nguyên văn.
- source_word: πόλεως
  choice: thị trấn
  rationale: πόλις có thể là thành hoặc thành phố, nhưng trong bối cảnh Na-xa-rét, “thị trấn” là cách gọi tự nhiên, phù hợp quy mô địa phương.
- source_word: ἤγαγον
  choice: dẫn
  rationale: Giữ nghĩa rộng của ἄγω; không dùng “lôi” vì từ Hy Lạp tự nó không nhất thiết biểu thị cách thức ấy.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: đến tận mép ngọn đồi
  rationale: ὀφρύς theo nghĩa địa hình chỉ phần nhô cao, bờ hoặc mép của một độ cao; “mép ngọn đồi” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: mà thị trấn của họ được xây trên đó
  rationale: Giữ quan hệ địa điểm, thể bị động và đại từ sở hữu αὐτῶν, cho thấy đây là thị trấn của những người đang hành động.
- source_word: ὥστε
  choice: để
  rationale: Với động từ nguyên mẫu, từ này ở đây diễn tả mục đích hoặc kết quả dự định; “để” tự nhiên và phù hợp mạch văn.
- source_word: κατακρημνίσαι
  choice: xô ... xuống
  rationale: Động từ chỉ việc ném hoặc xô từ một nơi cao xuống; cách dịch giữ rõ ý định bạo lực nhưng không tự ý thêm “vách đá” hay “giết” vào chính văn.
theological_decisions:
- issue: Mức độ bạo lực trong hành động của đám đông
  choice: Diễn đạt ý định xô Đức Giê-su từ nơi cao xuống mà không thêm lời giải thích rằng họ định giết Ngài.
  alternative: Dịch mạnh hơn là “ném Ngài xuống vực” hoặc diễn giải là “định giết Ngài”.
  rationale: Trình tự hành động và κατακρημνίσαι cho thấy ý định gây chết người, nhưng nguyên văn không dùng trực tiếp động từ “giết”; bản dịch để ý nghĩa ấy tự hiện ra từ câu chuyện.
- issue: Địa hình được chỉ bởi ὀφρύς
  choice: “mép ngọn đồi” trong chính văn, kèm chú thích về các khả năng “sườn cao” hoặc “gờ đồi”.
  alternative: “đỉnh đồi”, “vách đá” hoặc “bờ vực”.
  rationale: ὀφρύς có phạm vi nghĩa là phần nhô, gờ hay mép của một độ cao. Không nên xác định địa hình chính xác hơn mức nguyên văn cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Đức Giê-su trong mạch kể; tránh cách diễn đạt giáo phái. Cấu trúc câu bám sát chuỗi hành động của nguyên văn nhưng vẫn tự nhiên trong tiếng Việt.
