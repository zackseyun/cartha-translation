revisions:
- from: Họ đứng dậy, đuổi Ngài ra khỏi thị trấn và dẫn Ngài đến tận mép ngọn đồi mà thị trấn của họ được xây trên đó,[a] để xô Ngài xuống.[b]
  to: Họ đứng dậy, đuổi Ngài ra khỏi thị trấn và dẫn Ngài đến mép ngọn đồi, nơi thị trấn của họ đã được xây dựng,[a] để ném Ngài xuống.[b]
  rationale: Bản sửa thay “xô” bằng “ném” để phản ánh chính xác hơn κατακρημνίσαι, nhưng không tự ý xác định đó là vách đá hay vực. Mệnh đề địa điểm được viết lại cho tự nhiên trong tiếng Việt, vẫn giữ ý thị trấn của họ được xây trên ngọn đồi. Các chú thích được chỉnh để nêu những lựa chọn từ vựng sát nguồn hơn và các ký hiệu chú thích vẫn gắn đúng với phần được chú giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch bám đúng chuỗi hành động của bản Hy Lạp: đám đông đứng dậy, đuổi Đức Giê-su ra ngoài, dẫn đến mép/gờ của ngọn đồi, rồi nhằm ném Người xuống. Tuy nhiên, “xô Ngài xuống” làm nhẹ sắc thái của κατακρημνίσαι, vốn chỉ hành động quăng/ném xuống từ độ cao. Cấu trúc “ngọn đồi mà thị trấn của họ được xây trên đó” cũng lặp quan hệ từ và kém tự nhiên.'
  naturalness: “Họ đứng dậy” và “đuổi Ngài ra khỏi thị trấn” tự nhiên, phù hợp văn kể hiện đại. Cần sửa mệnh đề chỉ địa điểm để tiếng Việt trôi chảy hơn, đồng thời dùng một động từ mạnh và chính xác hơn cho hành động cuối.
  terminology: “Thị trấn” là lựa chọn phù hợp cho πόλις trong ngữ cảnh này; “mép ngọn đồi” giữ được tính không xác định địa hình của ὀφρύς. Đại từ kính ngữ “Ngài” được dùng nhất quán. Chú thích a nên tránh “sườn cao”, vì từ nguồn nhấn vào phần gờ, mép hoặc chỏm/brow của nơi cao hơn là cả sườn đồi.
  issues:
  - severity: medium
    issue: “xô Ngài xuống” chưa truyền đạt đầy đủ κατακρημνίσαι.
    rationale: Động từ này diễn tả ném/quăng xuống từ nơi cao, thường có sắc thái mạnh hơn việc đơn thuần xô. “Ném Ngài xuống” bảo toàn lực của động từ mà không thêm “vực” hay “vách đá” vào chính văn.
  - severity: low
    issue: Mệnh đề “ngọn đồi mà thị trấn của họ được xây trên đó” bị lặp và không tự nhiên.
    rationale: Tiếng Việt không cần đồng thời dùng “mà” và “trên đó” theo cấu trúc này. “Nơi thị trấn của họ đã được xây dựng” diễn đạt tự nhiên quan hệ địa điểm và vẫn phản ánh thể bị động/quá khứ hoàn thành của ᾠκοδόμητο.
  - severity: low
    issue: Chú thích a nêu “sườn cao” như một phương án trực tiếp.
    rationale: ὀφρύς phù hợp hơn với “gờ”, “mép”, hoặc “chỏm/brow” của độ cao; “sườn” có thể gợi toàn bộ mặt dốc và kém chính xác.
