  source_fidelity: 'Bản dịch phản ánh đúng mệnh đề chính: lời xác quyết trang trọng, phủ định phổ quát đối với “nhà tiên tri,” ý được cộng đồng tiếp nhận thuận lợi, và phạm vi từ vựng rộng của πατρίς. Tuy nhiên, ὅτι được biểu đạt tự nhiên và rõ hơn bằng “rằng”; chú thích hiện tại hơi thu hẹp/khẳng định quá mức quy chiếu của πατρίς vào Na-xa-rét và dùng “vùng quê,” một từ không tương ứng chính xác với các khả năng nghĩa chính ở đây.'
