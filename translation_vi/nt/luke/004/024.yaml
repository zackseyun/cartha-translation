  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: vi
  text: 'Ngài nói: “Thật, tôi nói với các ông rằng: không một nhà tiên tri nào được đón nhận tại quê hương mình[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tại quê quán mình” hoặc “tại quê nhà mình.” Từ Hy Lạp πατρίς có thể chỉ quê quán, nơi quê nhà, vùng xuất thân hoặc quê hương; trong bối cảnh Na-xa-rét, “quê nhà” là một cách hiểu phù hợp.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Ngài nói
  rationale: δέ là từ nối nhẹ trong mạch kể; tiếng Việt không cần dịch riêng bằng “và” hay “nhưng” ở đây. “Ngài” giữ lối kể trang trọng và chỉ về Đức Giê-su theo ngữ cảnh.
- source_word: Ἀμὴν
  choice: Thật
  rationale: Trong lời Đức Giê-su, ἀμήν mở đầu một lời xác quyết trang nghiêm. “Thật” truyền đạt trực tiếp sức nặng của công thức này mà không dùng phiên âm khó hiểu trong vị trí ấy.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các ông
  rationale: Giữ nguyên hành động nói và đại từ số nhiều. “Các ông” phù hợp với nhóm người đang nghe trong hội đường, đồng thời tránh thêm sắc thái thân mật không có trong nguyên văn.
- source_word: οὐδεὶς προφήτης
  choice: không một nhà tiên tri nào
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, đồng thời giữ sắc thái tuyệt đối của οὐδείς.
- source_word: δεκτός
  choice: được đón nhận
  rationale: Diễn đạt việc được tiếp nhận một cách thuận lợi hoặc được chấp nhận; tự nhiên hơn “được chấp nhận” trong quan hệ giữa một nhà tiên tri và cộng đồng quê nhà.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: tại quê hương mình
  rationale: πατρίς có thể chỉ quê quán, miền quê hoặc quê hương. “Quê hương mình” giữ được độ rộng từ vựng của tiếng Hy Lạp; chú thích nêu rõ khả năng hiểu là quê nhà Na-xa-rét trong ngữ cảnh.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu giữ công thức xác quyết trực tiếp của nguyên văn; dấu hai chấm sau “các ông” giúp lời tuyên bố chính rõ ràng. Dấu chú thích [a] được đặt ngay sau câu có từ cần giải thích.
