  naturalness: Câu văn rõ ràng, hiện đại và có sắc thái trang trọng phù hợp. «Rồi ma quỷ nói với Ngài» tự nhiên hơn và phản ánh tốt hơn diễn tiến của nguyên văn.
  terminology: «Ma quỷ», «Ngài», «Con Đức Chúa Trời», và «bánh» đều phù hợp với cách dùng Kinh Thánh tiếng Việt phổ biến. Không cần thay «hãy bảo» bằng «ra lệnh», vì điều đó sẽ làm mạnh hơn động từ εἰπὲ.
