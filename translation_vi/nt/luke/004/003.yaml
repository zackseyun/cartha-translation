source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: vi
  text: 'Rồi ma quỷ nói với Ngài: “Nếu[a] Ngài là Con Đức Chúa Trời, hãy bảo hòn đá này biến thành bánh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Vì Ngài là Con Đức Chúa Trời.” Điều kiện trong tiếng Hy Lạp có thể hàm ý tạm xem tiền đề ấy là đúng để đưa ra lời thách thức; bản chính vẫn giữ hình thức điều kiện.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂εἶπεν δὲ⸃
  choice: nói
  rationale: Động từ εἶπεν được dịch trực tiếp là “nói”. δέ là liên từ nhẹ; trong câu tiếng Việt, không dịch thành một từ riêng giúp lời kể tự nhiên mà vẫn giữ đúng diễn tiến.
- source_word: ὁ διάβολος
  choice: Ma quỷ
  rationale: Trong ngữ cảnh này, διάβολος là danh xưng quen thuộc chỉ nhân vật cám dỗ; “Ma quỷ” là cách gọi rõ ràng, thông dụng trong tiếng Việt.
- source_word: Εἰ
  choice: Nếu
  rationale: “Nếu” giữ nguyên hình thức điều kiện và sức căng của lời thách thức, thay vì giải thích thành “Vì” hoặc “Nếu quả thật”.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Trong ngữ cảnh Kitô học này, cụm từ mang nghĩa xác định, chỉ tước hiệu “Con Đức Chúa Trời”, chứ không phải “một người con của Đức Chúa Trời”.
- source_word: εἰπὲ
  choice: hãy bảo
  rationale: Mệnh lệnh của λέγω hướng đến hòn đá; “hãy bảo” diễn đạt tự nhiên hành vi nói khiến điều được truyền xảy ra mà không tăng nghĩa thành “hãy ra lệnh”.
- source_word: τῷ λίθῳ τούτῳ
  choice: hòn đá này
  rationale: λίθος thường chỉ một hòn đá; từ chỉ định τούτῳ được giữ bằng “này”.
- source_word: ἵνα γένηται
  choice: biến thành
  rationale: Sau động từ nói, ἵνα với giả định thức nêu nội dung được truyền khiến xảy ra. “Biến thành” là cách diễn đạt tự nhiên trong tiếng Việt và giữ ý chuyển thành một trạng thái khác.
- source_word: ἄρτος
  choice: bánh
  rationale: Trong tiếng Việt Kinh Thánh và ngữ cảnh này, “bánh” là cách dịch gọn, quen thuộc của ἄρτος; “ổ bánh” sẽ cụ thể hơn nguyên văn.
theological_decisions:
- issue: Sắc thái của mệnh đề điều kiện Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Nếu Ngài là Con Đức Chúa Trời
  alternative: Vì Ngài là Con Đức Chúa Trời
  rationale: Bản chính giữ hình thức điều kiện của tiếng Hy Lạp và không tự giải quyết lời thách thức thành một tiền đề được công khai khẳng định; chú thích ghi nhận sắc thái giả định tiền đề có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để xưng hô với Chúa Giê-su và “Đức Chúa Trời” cho θεός. Dấu chú thích [a] đặt ngay sau “Ngài”, tương ứng vị trí của lớp tham khảo tiếng Anh, dù nội dung chú thích giải thích mệnh đề điều kiện theo sau.
