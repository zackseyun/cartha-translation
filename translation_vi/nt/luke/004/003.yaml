  - severity: medium
    issue: Ký hiệu chú thích [a] neo sau «Ngài» thay vì tại từ/cụm có sắc thái được chú thích
    rationale: Chú thích giải thích cách hiểu thay thế của Εἰ («Nếu»/«Vì»), nên cần đặt ký hiệu ngay sau «Nếu» để người đọc nhận biết chính xác phần văn bản được chú giải.
