id: LUK.4.7
reference: Luke 4:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: vi
  text: Vậy, nếu ngươi thờ lạy trước mặt ta,[a] thì tất cả sẽ thuộc về ngươi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sấp mình trước mặt ta.” Động từ Hy Lạp có thể chỉ hành động phủ phục hoặc sự thờ phượng; ở đây dùng “thờ lạy” vì văn cảnh nói đến việc dành cho ma quỷ sự tôn kính mang tính tôn giáo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: ngươi
  rationale: Đại từ ngôi hai số ít được nêu rõ để tạo sắc thái nhấn mạnh. Trong lời của ma quỷ nói trực tiếp với Đức Giê-su, “ngươi” giữ được tính trực diện và trang trọng của văn cảnh.
- source_word: οὖν
  choice: vậy
  rationale: Từ này đánh dấu hệ quả rút ra từ lời đề nghị ở câu trước; “vậy” tự nhiên trong tiếng Việt và vẫn giữ mối liên hệ suy luận.
- source_word: ἐὰν
  choice: nếu
  rationale: Dẫn vào mệnh đề điều kiện với động từ ở thể giả định; “nếu” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: προσκυνήσῃς
  choice: thờ lạy
  rationale: Động từ có thể chỉ hành động phủ phục hoặc sự thờ phượng. “Thờ lạy” vừa gợi cử chỉ cúi mình vừa truyền đạt sự tôn kính mang tính tôn giáo mà văn cảnh đòi hỏi.
- source_word: ἐνώπιον ἐμοῦ
  choice: trước mặt ta
  rationale: Giữ nghĩa không gian–quan hệ của cụm Hy Lạp và diễn đạt tự nhiên hành vi tôn kính được thực hiện trước ma quỷ.
- source_word: ἔσται σοῦ
  choice: sẽ thuộc về ngươi
  rationale: Cấu trúc động từ tương lai đi với đại từ sở hữu được chuyển thành cách nói sở hữu tự nhiên trong tiếng Việt.
- source_word: πᾶσα
  choice: tất cả
  rationale: Dạng giống cái số ít quy chiếu tỉnh lược về toàn bộ quyền cai trị và vinh quang của các vương quốc ở câu trước; “tất cả” giữ sự quy chiếu tổng quát mà không thêm danh từ vốn không có trong câu này.
theological_decisions:
- issue: Nên hiểu προσκυνέω là một cử chỉ trung tính hay sự tôn kính mang tính thờ phượng
  choice: thờ lạy
  alternative: sấp mình trước mặt ta
  rationale: Trong cơn cám dỗ này, ma quỷ đòi sự tôn kính vốn thuộc về Đức Chúa Trời, như câu trả lời của Đức Giê-su ở câu kế tiếp cho thấy. “Thờ lạy” truyền đạt sức nặng tôn giáo ấy, trong khi chú thích vẫn bảo tồn nghĩa cử chỉ có thể có của động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi/ta” phản ánh lời đối đầu trực tiếp trong trình thuật, không dùng cách gọi quá khẩu ngữ. Dấu chú thích được đặt ngay sau cụm từ mà nó giải thích.
