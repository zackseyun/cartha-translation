  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc điều kiện và hệ quả của câu Hy Lạp: οὖν là “Vậy,”, ἐὰν là “nếu,” προσκυνήσῃς được diễn đạt là “thờ lạy,” ἐνώπιον ἐμοῦ là “trước mặt ta,” và ἔσται σοῦ πᾶσα là “tất cả sẽ thuộc về ngươi.” “Tất cả” giữ đúng tính quy chiếu tỉnh lược của πᾶσα về điều vừa nêu ở câu trước, không thêm danh từ vào bản văn.'
  naturalness: Câu văn tự nhiên, rõ nghĩa và giữ được sắc thái trang trọng của lời đối thoại đối đầu. Cặp đại từ “ta/ngươi” nhất quán trong lời trực tiếp và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại-trang trọng.
  terminology: “Thờ lạy” là lựa chọn phù hợp cho προσκυνέω trong ngữ cảnh ma quỷ đòi sự tôn kính mang tính tôn giáo. Chú thích nêu đúng khả năng nghĩa cử chỉ (“sấp mình”) mà không làm mất trọng lượng ngữ cảnh. Thuật ngữ “ma quỷ” trong chú thích phù hợp với ngữ cảnh trực tiếp của phân đoạn.
