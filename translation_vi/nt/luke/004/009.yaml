source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: vi
  text: 'Rồi ma quỷ dẫn Ngài đến Giê-ru-sa-lem, đặt Ngài trên chóp[a] của đền thờ[b], và nói với Ngài: “Nếu[c] ông là Con Đức Chúa Trời, hãy gieo mình từ đây xuống;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mỏm nhô ra” hoặc “cánh của đền thờ”. Từ Hy Lạp chỉ một đầu mút nhô ra hay một điểm cao của công trình.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khu đền thờ, không chỉ riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể hiểu là: “Vì ông là Con Đức Chúa Trời” hoặc “Ông đã là Con Đức Chúa Trời thì”. Ở đây dịch là “Nếu” để giữ tính chất thách thức trong lời kẻ cám dỗ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: Rồi ma quỷ dẫn Ngài
  rationale: δέ đánh dấu bước tiếp theo trong trình thuật nên được diễn đạt tự nhiên là “Rồi”. ἤγαγεν mang nghĩa dẫn hoặc đưa đi; “dẫn” giữ được vai trò chủ động của kẻ cám dỗ. Chủ ngữ “ma quỷ” được nêu rõ theo ngữ cảnh để câu tiếng Việt đứng riêng vẫn dễ hiểu.
- source_word: εἰς Ἰερουσαλήμ
  choice: đến Giê-ru-sa-lem
  rationale: εἰς chỉ hướng chuyển động đến địa điểm; “đến” là cách diễn đạt tự nhiên. “Giê-ru-sa-lem” là dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: ἔστησεν
  choice: đặt Ngài
  rationale: Dạng ngoại động của ἵστημι ở đây có nghĩa khiến ai đứng tại một vị trí, tức đặt người ấy ở đó; “đặt” gọn và tự nhiên hơn cách dịch sát chữ “làm cho đứng”.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: trên chóp cao
  rationale: πτερύγιον theo nghĩa đen liên hệ đến “cánh nhỏ”, nhưng trong kiến trúc chỉ một đầu mút nhô ra hoặc điểm cao. “Chóp cao” rõ nghĩa với độc giả hiện đại, còn phương án sát chữ được giữ trong chú thích.
- source_word: τοῦ ἱεροῦ
  choice: của đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ chứ không riêng nơi thánh bên trong. “Đền thờ” là cách gọi tự nhiên trong câu chính, với phạm vi nghĩa được làm rõ ở chú thích.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Nếu ông là Con Đức Chúa Trời
  rationale: εἰ với trực thuyết có thể mang sắc thái “nếu” hoặc trong một số ngữ cảnh gần với “vì/đã là”. “Nếu” giữ nguyên tính chất thách thức của lời cám dỗ mà không phủ nhận căn tính của Đức Giê-su theo người kể chuyện. “Con Đức Chúa Trời” giữ sắc thái tước hiệu của cụm Hy Lạp.
- source_word: βάλε σεαυτὸν
  choice: hãy gieo mình
  rationale: βάλε là mệnh lệnh của βάλλω, mang nghĩa ném hoặc quăng. “Gieo mình” là cách nói tiếng Việt tự nhiên khi một người chủ động lao từ trên cao xuống, đồng thời giữ lực của động từ.
- source_word: ἐντεῦθεν κάτω
  choice: từ đây xuống
  rationale: ἐντεῦθεν xác định vị trí hiện tại, còn κάτω chỉ hướng xuống dưới; cụm “từ đây xuống” ngắn gọn và đúng trật tự tự nhiên của tiếng Việt.
theological_decisions:
- issue: Sắc thái lời thách thức đối với căn tính của Đức Giê-su
  choice: Nếu ông là Con Đức Chúa Trời
  alternative: Vì ông là Con Đức Chúa Trời / Ông đã là Con Đức Chúa Trời thì
  rationale: Cấu trúc εἰ với trực thuyết đôi khi có thể giả định điều kiện là đúng, nhưng trong cảnh cám dỗ này, “Nếu” bảo toàn sức ép và tính thách thức trong lời ma quỷ, đồng thời không biến lời người kể thành sự nghi ngờ căn tính của Đức Giê-su.
- issue: Cách xưng hô trong lời ma quỷ
  choice: ông
  alternative: Ngài
  rationale: Đại từ αὐτῷ không tự quy định mức độ kính trọng. “Ông” trong lời trực tiếp truyền đạt lời thách thức mà không tự ý gán cho ma quỷ thái độ tôn kính; phần trần thuật vẫn dùng “Ngài” theo văn phong trang trọng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện ngắn gọn của nguyên văn; dùng “Ngài” trong lời trần thuật nhưng “ông” trong lời thách thức trực tiếp. Các thuật ngữ kiến trúc và sắc thái điều kiện được giải thích bằng chú thích thay vì giải quyết dứt khoát trong câu chính.
