  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các thành phần chính của Hy Lạp: kẻ cám dỗ dẫn Đức Giê-su đến Giê-ru-sa-lem, đặt Ngài trên πτερύγιον của toàn khu đền thờ, rồi ra lệnh Ngài tự gieo mình xuống. “Nếu” bảo toàn sắc thái điều kiện/thách thức của εἰ. Tuy nhiên, “chóp cao” thêm ý ‘cao’ một cách dư thừa và có phần thu hẹp πτερύγιον, vốn chỉ một phần nhô ra/cực biên kiến trúc; “chóp” cùng chú thích giữ được sự dè dặt hơn.'
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. “Đặt Ngài trên chóp của đền thờ” gọn, tự nhiên hơn “đặt Ngài trên chóp cao của đền thờ”. “Hãy gieo mình từ đây xuống” là lối diễn đạt có thể chấp nhận trong văn cảnh này.
  terminology: “Đền thờ” cùng chú thích phân biệt ἱερόν với nơi thánh bên trong là chính xác. “Con Đức Chúa Trời” nhất quán với đăng ký thuật ngữ của bản thảo. Sự đối lập “Ngài” trong trần thuật và “ông” trong lời kẻ cám dỗ là một lựa chọn diễn ngôn khả dĩ; đại từ Hy Lạp không buộc phải dùng kính ngữ.
