  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: vi
  text: Sau khi đã hoàn tất mọi sự cám dỗ[a], ma quỷ rời khỏi Ngài cho đến một thời cơ thuận tiện.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi sự thử thách”. Từ Hy Lạp có thể mang nghĩa “cám dỗ” hoặc “thử thách”; ở đây, vì ma quỷ là tác nhân, “cám dỗ” là cách dịch tự nhiên hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: Sau khi đã dùng hết
  rationale: Phân từ bất định chủ động chỉ hành động xảy ra trước động từ chính. Trong tiếng Việt, “sau khi đã dùng hết” diễn đạt tự nhiên ý ma quỷ đã thực hiện trọn mọi cách cám dỗ trong trình thuật.
- source_word: πάντα πειρασμόν
  choice: mọi sự cám dỗ
  rationale: πᾶς đi với danh từ số ít có sắc thái bao quát hoặc phân phối. “Mọi sự cám dỗ” vừa tự nhiên vừa truyền đạt toàn bộ những cám dỗ được kể; nghĩa “thử thách” vẫn được giữ trong chú thích.
- source_word: ὁ διάβολος
  choice: ma quỷ
  rationale: Trong trình thuật này, từ ngữ chỉ một đối thủ siêu nhiên có ngôi vị; “ma quỷ” là cách gọi chuẩn, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: rời khỏi Ngài
  rationale: ἀφίστημι ở đây có nghĩa rời đi hoặc lui khỏi một người. “Rời khỏi Ngài” rõ ràng, tự nhiên và giữ được đối tượng được tách khỏi.
- source_word: ἄχρι καιροῦ
  choice: cho đến một thời cơ thuận tiện
  rationale: καιρός không chỉ một thời điểm bất kỳ mà thường hàm ý thời điểm thích hợp hay thuận lợi. Cách dịch này giữ sắc thái việc ma quỷ rời đi chỉ là tạm thời và có tính chờ đợi cơ hội.
theological_decisions:
- issue: Sắc thái của πειρασμός trong kinh nghiệm của Chúa Giê-su
  choice: sự cám dỗ
  alternative: sự thử thách
  rationale: πείρασμος có thể mang nghĩa “cám dỗ” hoặc “thử thách”. Vì tác nhân ở đây là ma quỷ và các hành động nhằm lôi kéo Chúa Giê-su lìa khỏi sự vâng phục, “cám dỗ” phù hợp hơn trong chính văn; nghĩa “thử thách” được giữ ở chú thích để không xóa bỏ tính đa nghĩa thật sự.
- issue: Sắc thái thời gian của ἄχρι καιροῦ
  choice: cho đến một thời cơ thuận tiện
  alternative: cho đến một thời điểm
  rationale: καιρός có thể chỉ một thời điểm thích hợp, nhưng câu không xác định cụ thể đó là lúc nào. Bản dịch giữ ý thời cơ mà không đồng nhất nó với một biến cố thần học cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho đại từ chỉ Chúa Giê-su nhằm giữ sự tôn kính theo lối dùng phổ biến trong văn bản Cơ Đốc tiếng Việt; câu vẫn bám sát cấu trúc thời gian và sự mơ hồ từ vựng của nguyên văn.
