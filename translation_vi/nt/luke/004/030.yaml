  source_fidelity: Bản dịch giữ đúng quan hệ đối lập của δέ (“Nhưng”), diễn tả việc Đức Giê-su đi qua ở giữa nhóm người (διελθὼν διὰ μέσου αὐτῶν), và truyền đạt hợp lý sắc thái chuyển động tiếp diễn của ἐπορεύετο bằng “tiếp tục lên đường”. Không thêm cơ chế phép lạ mà nguyên văn không nêu.
