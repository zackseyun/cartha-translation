  terminology: “Đức Giê-su” phù hợp cách gọi trang trọng vừa phải trong tiếng Việt hiện đại. Không có thuật ngữ thần học nào bị áp đặt. Chú thích nêu đúng khả năng thay thế “đi qua chính giữa họ” và giữ tính trung tính về cách sự việc xảy ra.
