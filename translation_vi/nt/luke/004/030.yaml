id: LUK.4.30
reference: Luke 4:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: vi
  text: Nhưng Đức Giê-su đi xuyên qua giữa họ rồi tiếp tục lên đường.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn cũng có thể hiểu là “đi qua chính giữa họ”. Tiếng Hy Lạp mô tả Đức Giê-su đi xuyên qua đám đông nhưng không nói việc ấy xảy ra bằng cách nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Đức Giê-su
  rationale: Đại từ được nêu rõ và có phần nhấn mạnh. Tiếng Việt dùng tên riêng ở đây giúp xác định chủ thể tự nhiên theo ngữ cảnh; không thêm sắc thái quá mạnh như “chính Người”.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản nhẹ giữa ý định thù nghịch của đám đông ở câu trước và việc Đức Giê-su rời đi an toàn.
- source_word: διελθὼν
  choice: đi xuyên qua
  rationale: Phân từ bất định của διέρχομαι diễn tả chuyển động qua một không gian. Cách nói này tự nhiên và giữ được hình ảnh không gian rõ nét.
- source_word: διὰ μέσου αὐτῶν
  choice: qua giữa họ
  rationale: Cụm từ chỉ việc đi qua phần giữa của nhóm người. “Qua giữa họ” rõ ràng, hiện đại và không giải thích cơ chế việc này xảy ra.
- source_word: ἐπορεύετο
  choice: tiếp tục lên đường
  rationale: Dạng chưa hoàn thành trình bày chuyển động đang tiếp diễn. “Tiếp tục lên đường” diễn đạt tự nhiên ý Người đi tiếp, thay vì chỉ nói rằng Người rời khỏi đó.
theological_decisions:
- issue: Câu này có nên hàm ý Đức Giê-su thoát đi bằng phép lạ hay giữ cách mô tả trung tính
  choice: 'Giữ cách diễn đạt trung tính: “đi xuyên qua giữa họ rồi tiếp tục lên đường”'
  alternative: Diễn đạt rõ đây là một cuộc thoát đi siêu nhiên hoặc bằng phép lạ
  rationale: Bản Hy Lạp thuật lại chuyển động của Đức Giê-su qua đám đông nhưng không nói việc ấy xảy ra bằng cách nào. Bản dịch vì thế không áp đặt lời giải thích, đồng thời vẫn để ngỏ ý nghĩa của sự kiện theo ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể rõ ràng; giữ mô tả trung tính, không thêm cơ chế siêu nhiên mà nguyên văn không nêu.
