  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: vi
  text: 'Đức Chúa Jêsus đáp lại ma quỷ[a]: “Có lời chép rằng: ‘Người ta không sống chỉ nhờ bánh mà thôi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Đức Chúa Jêsus đang trích Phục Truyền Luật Lệ Ký 8:3.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: đáp lời nó
  rationale: Cụm ἀποκρίνομαι với πρός + đối cách có nghĩa tự nhiên là đáp lại người đang nói. Đại từ αὐτόν chỉ ma quỷ trong ngữ cảnh; “nó” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: Γέγραπται
  choice: Có lời chép rằng
  rationale: Đây là công thức trích dẫn Kinh Thánh. Cách dịch này tự nhiên, trang trọng và giữ được ý rằng lời đã được chép vẫn có thẩm quyền.
- source_word: ὅτι
  choice: 'rằng:'
  rationale: ὅτι giới thiệu nội dung trích dẫn; “rằng” kết hợp dấu hai chấm thể hiện rõ lời trích trong tiếng Việt.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: không chỉ nhờ bánh mà thôi
  rationale: ἐπί ở đây diễn tả cơ sở hay phương tiện duy trì sự sống. “Nhờ bánh” tự nhiên hơn lối dịch sát chữ “trên bánh,” còn cấu trúc “không chỉ... mà thôi” giữ trọng tâm của μόνῳ.
- source_word: ζήσεται
  choice: sống
  rationale: Trong câu châm ngôn có giá trị khái quát, thì hiện tại tiếng Việt diễn đạt tự nhiên ý của tương lai Hy Lạp mà không cần thêm “sẽ.”
- source_word: ὁ ἄνθρωπος
  choice: người ta
  rationale: Danh từ số ít có mạo từ được dùng theo nghĩa đại diện, chỉ con người nói chung. “Người ta” giữ nghĩa khái quát trong tiếng Việt hiện đại mà không biến thành một danh từ tập thể trừu tượng.
theological_decisions:
- issue: Cách dịch ὁ ἄνθρωπος số ít mang nghĩa đại diện trong lời trích Kinh Thánh
  choice: người ta
  alternative: con người; một người
  rationale: Ở đây ὁ ἄνθρωπος không chỉ riêng một người nam nhưng nói về loài người theo nghĩa khái quát. “Người ta” truyền đạt tự nhiên phạm vi phổ quát ấy, đồng thời vẫn giữ hình thức quy chiếu đến con người thay vì diễn giải thần học thêm.
- issue: Phạm vi lời trích Phục truyền luật lệ ký 8:3
  choice: Chỉ dịch phần hiện có trong văn bản SBLGNT của Lu-ca 4:4
  alternative: Bổ sung “nhưng nhờ mọi lời phán của Đức Chúa Trời” theo một số bản thảo và truyền thống bản dịch
  rationale: Văn bản SBLGNT được cung cấp kết thúc sau ὁ ἄνθρωπος. Không bổ sung vế dài từ truyền thống bản thảo khác, nhờ đó bản dịch bám sát nguồn đã chỉ định.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi Kinh Thánh tiếng Việt quen thuộc; dùng “nó” để quy chiếu rõ đến ma quỷ trong ngữ cảnh. Dấu ngoặc kép lồng nhau phân biệt lời Đức Chúa Jêsus với câu Kinh Thánh được Ngài trích.
