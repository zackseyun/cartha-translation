revisions:
- from: 'Đức Giê-su quở trách nó rằng: “Câm đi[a] và ra khỏi người này!” Quỷ vật người ấy ngã xuống giữa mọi người[b], rồi ra khỏi ông mà không làm ông bị thương chút nào.'
  to: 'Đức Giê-su quở trách nó, nói rằng: “Im đi[a] và ra khỏi người ấy!” Quỷ quật người ấy vào giữa họ[b], rồi ra khỏi ông mà không làm ông bị thương chút nào.'
  rationale: Bản sửa loại bỏ chi tiết «ngã xuống» không có trong câu, duy trì trình tự của phân từ aorist («quật ... rồi ra khỏi»), và dùng cách nói tiếng Việt rõ ràng hơn. Chú thích bạch hóa phần «họ» được suy ra từ bối cảnh công cộng, trong khi chính văn vẫn giữ ý «vào giữa» của nguyên ngữ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:31:31Z'
review_pass:
  verdict: revise
  source_fidelity: Cần sửa cách diễn đạt hành động của quỷ. Nguyên văn nói quỷ đã quật người ấy «vào giữa» rồi mới ra khỏi ông; bản dịch hiện tại thêm rõ nét «ngã xuống» vốn không có trong câu. «Người này» cũng mạnh hơn đại từ αὐτοῦ, nên nên dịch nhất quán là «người ấy».
  naturalness: «Quỷ vật người ấy ngã xuống giữa mọi người» có thể bị đọc thoáng như người ấy tự ngã và hơi gượng. «Quỷ quật người ấy vào giữa họ» rõ chủ thể, tự nhiên, và vẫn phản ánh bối cảnh hội chúng được hàm ý.
  terminology: «Đức Giê-su», «quở trách», và «quỷ» phù hợp văn phong trang trọng hiện đại và các thuật ngữ của đoạn. «Im đi!» là mệnh lệnh tự nhiên, dứt khoát; chú thích giữ hình ảnh sát chữ của Φιμώθητι.
  issues:
  - severity: medium
    issue: «ngã xuống» thêm một chi tiết không được nêu trực tiếp trong nguyên văn.
    rationale: ῥίψαν αὐτὸν εἰς τὸ μέσον nói quỷ quật/ném người ấy vào giữa; động từ không xác định hướng «xuống» trong câu này.
  - severity: low
    issue: «ra khỏi người này» không phản ánh sát đại từ αὐτοῦ.
    rationale: «Người này» là chỉ định từ, còn nguyên văn dùng đại từ «ông ấy/người ấy»; không cần tăng sắc thái chỉ trỏ.
  - severity: low
    issue: Cấu trúc «Quỷ vật người ấy ngã xuống...» chưa thật rõ và tự nhiên.
    rationale: Sửa thành «quỷ quật người ấy vào giữa họ» làm rõ quỷ là chủ thể hành động và người ấy là đối tượng bị quật.
