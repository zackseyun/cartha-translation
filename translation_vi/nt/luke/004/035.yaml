source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: vi
  text: 'Đức Giê-su quở trách nó, nói rằng: “Im đi[a] và ra khỏi người ấy!” Quỷ quật người ấy vào giữa họ[b], rồi ra khỏi ông mà không làm ông bị thương chút nào.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “Hãy bị bịt mõm.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát chữ: “vào giữa.” «Họ» được hàm ý theo ngữ cảnh.'
    reason: implicit_context
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: quở trách nó
  rationale: “Quở trách” diễn đạt lời khiển trách đầy uy quyền của Đức Giê-su; “nó” chỉ con quỷ được nhắc đến trong ngữ cảnh.
- source_word: Φιμώθητι
  choice: Câm đi
  rationale: Trong mệnh lệnh trực tiếp, cách nói này tự nhiên, mạnh và diễn đạt đúng nghĩa thành ngữ là bắt phải im tiếng; hình ảnh sát chữ “bị bịt mõm” được giữ trong chú thích.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: ra khỏi người này
  rationale: Giữ nguyên mệnh lệnh trừ quỷ trực tiếp. “Người này” làm rõ đại từ chỉ người đàn ông mà không đưa tên hay đặc điểm ngoài bản văn.
- source_word: ῥίψαν αὐτὸν ... εἰς τὸ μέσον
  choice: vật người ấy ngã xuống giữa mọi người
  rationale: ῥίπτω diễn tả hành động quăng/vật mạnh; “ngã xuống” tạo câu tiếng Việt tự nhiên trong ngữ cảnh, còn “mọi người” là thành phần được ngữ cảnh hàm ý nhưng không hiện rõ trong nguyên văn nên được ghi chú.
- source_word: τὸ δαιμόνιον
  choice: quỷ
  rationale: Đây là tương đương trực tiếp, thông dụng của δαιμόνιον và bảo toàn cách bản văn trình bày một hữu thể tà ác được Đức Giê-su trực tiếp truyền lệnh.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: mà không làm ông bị thương chút nào
  rationale: 'Diễn đạt tự nhiên sức nhấn mạnh của μηδέν: dù bị vật ngã, người ấy hoàn toàn không bị thương tổn.'
theological_decisions:
- issue: Cách trình bày δαιμόνιον trong câu chuyện trừ quỷ
  choice: Dịch là “quỷ” và giữ nguyên việc Đức Giê-su trực tiếp truyền lệnh cho nó
  alternative: Diễn giải thành một sức mạnh tà ác trừu tượng hoặc một chứng bệnh tâm thần
  rationale: Nguyên văn mô tả một đối tượng được trực tiếp quở trách, nhận mệnh lệnh và ra khỏi người đàn ông; bản dịch không nên giải huyền thoại hóa hoặc giải thích lại hiện tượng vượt quá điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; lời truyền “Câm đi” giữ sắc thái ngắn, gắt và đầy uy quyền của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
