    issue: Tiếng kêu “A!”
    rationale: Trong tiếng Việt hiện đại, “A!” thường gợi sự chợt nhận ra hơn là lời kêu báo động hoặc phản kháng. “Ôi!” là tiếng thốt ngắn tự nhiên hơn trong ngữ cảnh bị đe dọa, mà không áp đặt cách hiểu diễn giải “Hãy để chúng tôi yên!”.
  - severity: low
    issue: Cụm “có can hệ gì với ông”
    rationale: Cụm này hơi cổ và không phải cách nói thông dụng trong tiếng Việt hiện đại. “Có liên can gì với ông” giữ ý nghĩa tách biệt/phản kháng của thành ngữ τί ἡμῖν καὶ σοί và có độ tự nhiên tốt hơn.
  - severity: low
