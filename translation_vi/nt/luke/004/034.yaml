id: LUK.4.34
reference: Luke 4:34
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: vi
  text: '“Ôi! Chúng tôi có liên can gì với ông, hỡi Giê-su, người Na-xa-rét?[a][b][c] Ông đến để tiêu diệt chúng tôi sao?[d] Tôi biết ông là ai: Đấng Thánh của Đức Chúa Trời.[e]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “A!” Tiếng kêu Ἔα là một lời thốt đột ngột diễn tả sự hoảng hốt hoặc phản kháng; một số bản dịch diễn giải là “Hãy để chúng tôi yên!”'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa đen: “Việc gì cho chúng tôi và cho ông?” Đây là một thành ngữ kiểu Semit, diễn tả sự tách biệt hoặc phản kháng thù địch.'
    reason: cultural_note
  - marker: c
    text: 'Hoặc: “Giê-su Na-xa-rét” hoặc “Giê-su người Na-xa-ren.”'
    reason: alternative_reading
  - marker: d
    text: “Chúng tôi” trong nguyên văn là số nhiều nhưng không nói rõ gồm những ai; có thể là con quỷ nói đại diện cho giới quỷ, hoặc chỉ một phạm vi khác mà câu không xác định.
    reason: alternative_reading
  - marker: e
    text: 'Hoặc: “Đấng Thánh thuộc về Đức Chúa Trời” hoặc “Đấng Thánh của Thiên Chúa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: A!
  rationale: Giữ tiếng kêu đột ngột biểu thị sự hoảng hốt hoặc phản đối, không diễn giải rộng thành “Hãy để chúng tôi yên!”.
- source_word: τί ἡμῖν καὶ σοί
  choice: Chúng tôi có can hệ gì với ông
  rationale: Diễn đạt tự nhiên thành ngữ Semit theo nghĩa tách biệt hoặc phản kháng, đồng thời vẫn giữ sắc thái đối đầu.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: hỡi Giê-su người Na-xa-rét
  rationale: Thể hiện lời gọi trực tiếp và danh xưng gắn Chúa Giê-su với Na-xa-rét; “hỡi” giúp làm rõ hô cách trong tiếng Việt trang trọng.
- source_word: ἦλθες ἀπολέσαι
  choice: Ông đến để tiêu diệt
  rationale: Aorist được diễn đạt tự nhiên bằng “đến”; động từ nguyên mẫu chỉ mục đích, còn “tiêu diệt” chuyển tải sức mạnh của ἀπόλλυμι mà không thêm diễn giải thần học.
- source_word: ἡμᾶς
  choice: chúng tôi
  rationale: Giữ nguyên số nhiều và không xác định phạm vi đại từ, như bản Hy Lạp.
- source_word: οἶδά σε τίς εἶ
  choice: Tôi biết ông là ai
  rationale: Chuyển tải trực tiếp lời tuyên bố nhận biết của quỷ, không thêm nội dung.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Đấng Thánh của Đức Chúa Trời
  rationale: Giữ cấu trúc và trọng lượng của danh hiệu Kitô học, đồng thời dùng cách gọi Đức Chúa Trời quen thuộc và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của đại từ số nhiều ἡμᾶς
  choice: Giữ là “chúng tôi” mà không xác định đối tượng bao gồm.
  alternative: Con quỷ có thể đại diện cho giới quỷ, hoặc nói về chính nó cùng người bị quỷ ám.
  rationale: Câu Hy Lạp không giải thích phạm vi số nhiều; bản dịch bảo toàn sự mơ hồ thay vì quyết định thay cho người đọc.
- issue: Danh hiệu ὁ ἅγιος τοῦ θεοῦ
  choice: Đấng Thánh của Đức Chúa Trời
  alternative: Đấng Thánh thuộc về Đức Chúa Trời
  rationale: Cách dịch đã chọn giữ nguyên danh hiệu quan trọng trong câu mà không mở rộng thành một giải thích giáo lý hoặc thu hẹp quan hệ sở hữu/xuất xứ của τοῦ θεοῦ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phản ánh lời của quỷ nói với Chúa Giê-su trong thế đối đầu, không hàm ý đánh giá của người kể. Dùng “hỡi” vừa phải để thể hiện hô cách Hy Lạp. Mọi nét mơ hồ đáng kể về đại từ số nhiều và danh hiệu đều được giữ lại hoặc chú thích.
