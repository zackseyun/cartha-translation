  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: vi
  text: Đức Giê-su đứng ở phía trên bà, quở cơn sốt, và cơn sốt rời khỏi bà. Ngay lập tức, bà đứng dậy và bắt đầu phục vụ họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: đến đứng bên bà
  rationale: Cụm từ mô tả Đức Giê-su tiến đến và đứng ở vị trí ngay bên trên người bệnh. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ được sự gần gũi của khung cảnh mà không thêm chi tiết như cúi xuống hay chạm vào bà.
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: quở cơn sốt
  rationale: Động từ ἐπιτιμάω mang sắc thái quở trách hoặc truyền lệnh nghiêm khắc; bản văn trực tiếp đặt cơn sốt làm đối tượng. “Quở cơn sốt” giữ nguyên cách trình bày đầy thẩm quyền của Lu-ca mà không quy bệnh tật cho ma quỷ.
- source_word: ἀφῆκεν αὐτήν
  choice: cơn sốt rời khỏi bà
  rationale: Chủ ngữ được ngầm hiểu là cơn sốt. Lặp lại “cơn sốt” giúp câu tiếng Việt rõ nghĩa, đồng thời phản ánh hình ảnh căn bệnh rời khỏi người phụ nữ.
- source_word: παραχρῆμα
  choice: ngay lập tức
  rationale: Trạng từ nhấn mạnh sự hồi phục tức thì; “ngay lập tức” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀναστᾶσα
  choice: bà đứng dậy
  rationale: Phân từ bất định chỉ hành động tiếp theo ngay sau khi cơn sốt rời khỏi bà. “Đứng dậy” là cách diễn đạt tự nhiên và trực tiếp.
- source_word: διηκόνει αὐτοῖς
  choice: bắt đầu phục vụ họ
  rationale: Thì chưa hoàn thành có thể gợi hành động khởi sự rồi tiếp diễn. “Bắt đầu phục vụ họ” diễn đạt sắc thái ấy và tránh nghĩa chuyên biệt mang tính chức vụ của từ “hầu việc”.
theological_decisions:
- issue: Việc Đức Giê-su quở cơn sốt có hàm ý nhân cách hóa hay cho rằng bệnh do ma quỷ gây ra hay không
  choice: Giữ nguyên cách nói “quở cơn sốt” mà không giải thích thêm
  alternative: Diễn giải thành “truyền cho cơn sốt phải lui đi” hoặc gắn cơn sốt với tác nhân ma quỷ
  rationale: Bản Hy Lạp nói trực tiếp rằng Đức Giê-su quở cơn sốt nhưng không giải thích bản chất của cơn bệnh. Bản dịch vì thế giữ sức căng của cách nói này và không áp đặt một nguyên nhân thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể; dùng “bà” cho người phụ nữ và “họ” cho nhóm người hiện diện. Câu văn giữ nhịp hành động nhanh của nguyên bản.
