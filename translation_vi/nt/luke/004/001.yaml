source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: vi
  text: Đức Giê-su, đầy tràn Thánh Linh, từ sông Giô-đanh trở về và được Thánh Linh dẫn dắt[a] trong hoang mạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Thánh Linh.” Cụm từ Hy Lạp có thể được dịch sát như vậy, nhưng trong câu này nhiều khả năng có nghĩa là Thánh Linh đang dẫn dắt Ngài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: đầy tràn Thánh Linh
  rationale: πλήρης với sở hữu cách diễn tả trạng thái đầy. “Đầy tràn Thánh Linh” tự nhiên trong tiếng Việt, giữ tính mô tả và không hàm ý đây là một biến cố được đổ đầy xảy ra tức thời.
- source_word: ὑπέστρεψεν
  choice: trở về
  rationale: Động từ ὑποστρέφω ở đây có nghĩa thông thường là quay trở lại; “trở về” ngắn gọn và tự nhiên trong mạch kể chuyện.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: từ sông Giô-đanh
  rationale: Danh xưng Ἰορδάνης trong ngữ cảnh chỉ sông Giô-đanh. Thêm danh từ loại “sông” là cách gọi địa danh tự nhiên trong tiếng Việt và tránh bị hiểu là quốc gia Gio-đan.
- source_word: ἤγετο
  choice: được ... dẫn đi
  rationale: Thể chưa hoàn thành bị động biểu thị hành động đang tiếp diễn trong quá khứ. Cấu trúc “được ... dẫn đi” giữ nghĩa bị động và cho thấy sự dẫn dắt kéo dài.
- source_word: ἐν τῷ πνεύματι
  choice: được Thánh Linh dẫn đi
  rationale: Với động từ ἄγω ở thể bị động, ἐν có thể mang sắc thái phương tiện hoặc tác nhân. Cách dịch này xác định Thánh Linh là Đấng dẫn Đức Giê-su, phù hợp với cụm “đầy tràn Thánh Linh” ngay trước đó; chú thích vẫn bảo lưu cách dịch sát mặt chữ “trong Thánh Linh”.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: ἔρημος chỉ vùng hoang vắng, không nhất thiết là sa mạc đầy cát. “Hoang mạc” vừa tự nhiên vừa giữ được sắc thái nơi vắng vẻ.
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: δέ là từ chuyển ý nhẹ. Trong tiếng Việt, mở câu trực tiếp bằng chủ ngữ nối tiếp mạch văn tự nhiên hơn; quan hệ tiếp diễn vẫn được thể hiện qua cấu trúc toàn câu.
theological_decisions:
- issue: Đối tượng được πνεῦμα chỉ đến trong ἐν τῷ πνεύματι
  choice: Thánh Linh
  alternative: trạng thái tâm linh bên trong của Đức Giê-su
  rationale: Cụm “đầy tràn Thánh Linh” ngay trước đó và cách Lu-ca trình bày Thánh Linh như tác nhân khiến cách hiểu cùng một Thánh Linh đang dẫn Đức Giê-su là tự nhiên nhất, mà không thêm một khẳng định tín lý vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” như lối gọi tên kính trọng phổ biến; dùng “Thánh Linh” nhất quán cho πνεῦμα ἅγιον. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
