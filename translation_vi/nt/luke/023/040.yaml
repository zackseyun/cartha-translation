source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: vi
  text: 'Nhưng người kia đáp lại, quở trách anh ta: “Đến cả anh mà cũng không kính sợ Đức Chúa Trời sao, vì anh đang chịu cùng một bản án[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cùng chịu sự kết án” hoặc “ở trong cùng một sự phán xét”. Từ Hy Lạp κρίμα có thể chỉ sự phán xét, phán quyết hoặc bản án; tại đây, từ này nói đến hình phạt mà cả hai cùng chịu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Nhưng người kia đáp lại
  rationale: δέ biểu thị sự tương phản nhẹ với lời của người phạm tội trước đó; ἀποκριθείς là phân từ thường dùng để dẫn vào lời đáp. Cách diễn đạt này tự nhiên trong lời kể tiếng Việt.
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: và quở trách anh ta
  rationale: ἐπιτιμάω mang nghĩa quở trách hoặc khiển trách. Phân từ hiện tại diễn tả hành động đi kèm lời nói; tiếng Việt tự nhiên có thể phối hợp bằng “và”, còn động từ ἔφη được thể hiện qua dấu hai chấm dẫn lời.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Anh cũng không kính sợ Đức Chúa Trời sao
  rationale: οὐδέ cùng đại từ nhấn mạnh σύ tạo sắc thái “ngay cả anh cũng không”. “Kính sợ Đức Chúa Trời” giữ được cả ý sợ hãi trước trách nhiệm và lòng tôn kính trong thành ngữ Kinh Thánh, mà không làm nhẹ thành chỉ “tôn trọng”.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu lý do cho lời quở trách. “Vì” rõ ràng và tự nhiên trong câu hỏi tu từ này.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: anh đang chịu cùng một bản án
  rationale: κρίμα có thể chỉ sự phán xét, phán quyết hoặc bản án. Trong bối cảnh cả hai đang bị đóng đinh, “chịu cùng một bản án” diễn đạt rõ kết quả hình phạt chung, đồng thời chú thích giữ lại phạm vi nghĩa rộng hơn.
theological_decisions:
- issue: Ý nghĩa của việc kính sợ Đức Chúa Trời
  choice: Giữ cách nói “kính sợ Đức Chúa Trời”
  alternative: “tôn kính Đức Chúa Trời” hoặc “sợ Đức Chúa Trời”
  rationale: Cách chọn này bảo toàn thành ngữ đạo đức–tôn giáo và sức nặng của trách nhiệm trước Đức Chúa Trời, không thu hẹp thành nỗi sợ đơn thuần cũng không làm nhẹ thành sự tôn trọng.
- issue: Phạm vi nghĩa của κρίμα
  choice: “bản án” trong chính văn, kèm chú thích các khả năng “sự kết án” và “sự phán xét”
  alternative: Dịch trực tiếp là “sự phán xét” hoặc “sự kết án”
  rationale: Bối cảnh hành hình nghiêng về bản án và hậu quả hình phạt chung, nhưng từ Hy Lạp vẫn có độ rộng ngữ nghĩa cần được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh” phù hợp với lời một người phạm tội nói trực tiếp với người kia; “Đức Chúa Trời” giữ lối gọi trang nghiêm và quen thuộc trong tiếng Việt Cơ Đốc.
