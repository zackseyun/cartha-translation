id: LUK.23.31
reference: Luke 23:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: vi
  text: Vì nếu người ta làm những điều này với cây còn xanh[a][b], thì khi cây đã khô, điều gì sẽ xảy ra?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “đối với cây còn tươi… đối với cây khô.” Từ Hy Lạp có thể chỉ cây hoặc gỗ.'
    reason: lexical_alternative
  - marker: b
    text: 'Hình ảnh này có lẽ lập luận từ điều nhẹ hơn đến điều nặng hơn: nếu người ta còn làm những điều như thế với cây còn xanh, thì cây đã khô sẽ gặp điều gì? Câu nói không xác định rõ cây xanh và cây khô tượng trưng cho ai.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Liên từ này nêu lý do cho lời than khóc và cảnh báo ngay trước đó, nên “Vì” giữ được quan hệ nhân quả.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: với cây còn xanh
  rationale: Cách dịch này giữ nguyên hình ảnh ẩn dụ, đồng thời tự nhiên hơn trong tiếng Việt so với cách dịch sát từng chữ “trong cây ướt”. “Cây còn xanh” diễn tả vật còn tươi, chưa khô.
- source_word: ὑγρῷ
  choice: còn xanh
  rationale: Từ này có thể mang nghĩa “ướt”, “ẩm” hoặc “tươi”. Trong thế đối lập với ξηρός, “còn xanh” là cách nói tự nhiên về cây hoặc gỗ chưa khô.
- source_word: ξύλῳ
  choice: cây
  rationale: ξύλον có thể chỉ cây, gỗ hoặc khúc gỗ. “Cây” tạo được cặp đối xứng tự nhiên “cây còn xanh—cây đã khô” và không buộc người đọc phải hiểu hình ảnh chỉ theo nghĩa nhiên liệu.
- source_word: ταῦτα ποιοῦσιν
  choice: người ta làm những điều này
  rationale: Giữ số nhiều của ταῦτα. Chủ thể của động từ không được xác định rõ trong tiếng Hy Lạp; “người ta” bảo toàn tính phiếm chỉ tốt hơn việc xác định một nhóm cụ thể.
- source_word: ἐν τῷ ξηρῷ
  choice: khi cây đã khô
  rationale: Cách diễn đạt này đối xứng tự nhiên với “cây còn xanh”; danh từ “cây” được nhắc lại để hình ảnh rõ ràng trong tiếng Việt.
- source_word: τί γένηται
  choice: điều gì sẽ xảy ra?
  rationale: Câu hỏi tu từ hướng đến kết quả được dự liệu; thì tương lai trong tiếng Việt truyền đạt rõ lực nghĩa ấy mà không giải thích cụ thể kết quả.
theological_decisions:
- issue: Ý nghĩa của hình ảnh cây còn xanh và cây đã khô
  choice: Giữ nguyên hình ảnh mà không xác định các đối tượng được tượng trưng trong chính văn.
  alternative: Giải thích “cây còn xanh” là Đức Giê-su và “cây đã khô” là Giê-ru-sa-lem hoặc dân thành; hoặc diễn giải thành một nguyên tắc chung từ nhẹ đến nặng.
  rationale: Lời nói có thể hướng từ sự đau khổ bất công hiện tại của Đức Giê-su đến sự phán xét lớn hơn sắp đến, nhưng câu Hy Lạp không nêu rõ từng đối tượng. Việc giữ nguyên hình ảnh bảo toàn sự hàm súc và căng thẳng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người ta” giữ chủ thể phiếm chỉ; cặp “cây còn xanh—cây đã khô” giữ hình ảnh và nhịp đối xứng của câu Hy Lạp.
