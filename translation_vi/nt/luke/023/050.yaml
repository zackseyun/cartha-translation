source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: vi
  text: Kìa, có một người tên là Giô-sép, là thành viên của hội đồng, một người tốt và công chính—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý và chuyển cảnh của ἰδού trong lời kể; không cần dịch máy móc Καί thành “Và” ở đầu câu vì “Kìa” tự nhiên hơn trong tiếng Việt mà vẫn bảo toàn lực diễn ngôn.
- source_word: ἀνὴρ
  choice: một người
  rationale: Trong ngữ cảnh, từ này chỉ một người đàn ông trưởng thành; tên Giô-sép và mạch văn đã xác định giới tính, nên “một người” là cách giới thiệu tự nhiên, không làm mất nghĩa.
- source_word: ὀνόματι Ἰωσὴφ
  choice: tên là Giô-sép
  rationale: Diễn đạt thành ngữ sở cách ὀνόματι bằng cấu trúc tiếng Việt hiện đại, rõ ràng và tự nhiên.
- source_word: βουλευτὴς ὑπάρχων
  choice: là thành viên Hội đồng
  rationale: βουλευτής chỉ một thành viên của hội đồng quản trị; viết hoa “Hội đồng” để chỉ hội đồng Do Thái cụ thể trong trình thuật, nhưng không thêm tên gọi mà nguyên văn câu này không nêu.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: một người tốt và công chính
  rationale: Giữ lại danh từ ἀνήρ được lặp lại để bảo toàn sự nhấn mạnh của Lu-ca. “Tốt” chuyển tải ἀγαθός, còn “công chính” giữ chiều kích đạo đức và tôn giáo của δίκαιος.
theological_decisions:
- issue: Cách dịch δίκαιος trong lời mô tả phẩm chất của Giô-sép
  choice: công chính
  alternative: công bằng; ngay thẳng
  rationale: δίκαιος có thể bao hàm cả sự ngay thẳng về đạo đức lẫn công bằng theo nghĩa pháp lý. “Công chính” duy trì âm hưởng Kinh Thánh rộng hơn mà không biến lời mô tả này thành một khẳng định giáo lý chuyên biệt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Kìa” giữ nét kể chuyện gây chú ý; dấu gạch ngang cuối câu được giữ vì cú pháp tiếp tục sang câu sau. Không đặt chú thích vì các khả năng “công bằng/ngay thẳng” không cần thiết để hiểu câu và bản nguồn tiếng Anh cũng không nhất quán giữa dấu chú thích trong câu với nội dung chú thích đã cung cấp.
