revisions:
- from: Quân lính cũng chế giễu Đức Chúa Jêsus; họ đến gần và đưa rượu chua cho Ngài uống,[a]
  to: Các binh lính cũng chế giễu Người; họ đến gần, đưa rượu chua cho Người,[a]
  rationale: Bản sửa giữ nguyên hành vi chế giễu và việc quân lính tiến lại gần để đưa rượu chua, nhưng không thêm chi tiết rằng Người uống. Nó cũng tránh tước hiệu và chính tả mang dấu ấn hệ phái, đồng thời chỉnh chú thích cho sát nghĩa từ vựng của ὄξος.
