  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: vi
  text: Các binh lính cũng chế giễu Người; họ đến gần, đưa rượu chua cho Người,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giấm”. Từ Hy Lạp ὄξος chỉ rượu chua, một thức uống rẻ tiền phổ biến; theo truyền thống, từ này thường được dịch là “giấm”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: chế giễu
  rationale: Động từ ἐμπαίζω chỉ hành vi nhạo báng, khinh miệt; “chế giễu” tự nhiên, trang trọng vừa phải và giữ được sắc thái thù nghịch.
- source_word: δὲ ... καὶ οἱ στρατιῶται
  choice: Quân lính cũng
  rationale: δέ nối tiếp câu chuyện, còn καί nhấn mạnh quân lính cũng tham gia vào việc chế giễu; tiếng Việt diễn đạt gọn và tự nhiên bằng “cũng”.
- source_word: αὐτῷ
  choice: Đức Chúa Jêsus / Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus. Nêu rõ danh xưng ở lần đầu giúp câu đứng độc lập dễ hiểu; “Ngài” ở lần sau tránh lặp mà vẫn giữ văn phong tôn kính.
- source_word: οἱ στρατιῶται
  choice: Quân lính
  rationale: Chỉ những người lính trong cảnh hành hình; “quân lính” là cách gọi rõ ràng và quen thuộc trong tiếng Việt.
- source_word: προσερχόμενοι
  choice: họ đến gần
  rationale: Phân từ mô tả quân lính tiến lại gần Đức Chúa Jêsus; chuyển thành mệnh đề phối hợp giúp câu tiếng Việt tự nhiên mà vẫn giữ trình tự hành động.
- source_word: ὄξος
  choice: rượu chua
  rationale: ὄξος là loại rượu đã chua, một thức uống rẻ tiền phổ biến; “rượu chua” chính xác hơn “giấm”, vốn dễ khiến độc giả hiện đại nghĩ đến gia vị.
- source_word: προσφέροντες
  choice: đưa ... cho ... uống
  rationale: Trong ngữ cảnh thức uống được đưa cho một người đang chịu đóng đinh, cách nói này diễn đạt tự nhiên hành động mời hoặc trao thức uống mà không tự quyết định động cơ thương xót hay chế nhạo.
theological_decisions:
- issue: Tính chất của việc quân lính đưa ὄξος
  choice: Diễn đạt hành động một cách trung tính trong khung cảnh chế giễu, không gán thêm động cơ.
  alternative: Xem đây là hành động thương xót nhỏ; hoặc khẳng định đây hoàn toàn là một cách hành hạ, trêu chọc.
  rationale: Mạch văn đặt hành động trong cảnh quân lính chế giễu, nhưng câu này không giải thích cụ thể động cơ của việc đưa rượu chua. Bản dịch để ngữ cảnh tạo sắc thái, không áp đặt phán đoán tâm lý vượt quá văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm. Dùng “chế giễu” thay cho lối nói quá khẩu ngữ; cấu trúc hai mệnh đề giữ nhịp kể tự nhiên. Dấu chân chú thích [a] được đặt ngay sau cụm liên quan “rượu chua”.
