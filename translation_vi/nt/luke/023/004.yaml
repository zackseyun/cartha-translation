  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: vi
  text: 'Bấy giờ, Phi-lát nói với các thượng tế và đám đông: “Tôi không tìm thấy căn cứ nào để buộc tội người này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Bấy giờ
  rationale: Liên từ nhẹ nối tiếp diễn tiến câu chuyện; “Bấy giờ” tự nhiên trong văn kể tiếng Việt mà không tạo sắc thái tương phản quá mạnh.
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: εἶπεν πρὸς
  choice: nói với
  rationale: Diễn đạt tự nhiên cấu trúc λέγω + πρός, chỉ lời nói hướng đến người nghe.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế cấp cao; tránh hiểu là có nhiều người đồng thời giữ chức thầy tế lễ thượng phẩm duy nhất.
- source_word: ὄχλους
  choice: đám đông
  rationale: Tiếng Việt thường dùng danh từ tập hợp “đám đông” không cần đánh dấu số nhiều; phù hợp ngữ cảnh nhóm dân chúng hiện diện.
- source_word: Οὐδὲν εὑρίσκω
  choice: Ta không tìm thấy ... nào
  rationale: Giữ thì hiện tại và lực phủ định của nguyên văn, đồng thời tự nhiên trong lời tuyên bố xét xử.
- source_word: αἴτιον
  choice: căn cứ ... để buộc tội
  rationale: Trong ngữ cảnh pháp lý, αἴτιον chỉ lý do hoặc cơ sở hợp lệ cho một cáo buộc; cách dịch này rõ nghĩa hơn “lỗi” và vẫn giữ trọng tâm tư pháp.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: người này
  rationale: Kết hợp theo ngữ pháp tiếng Việt với “buộc tội”; nội dung của ἐν được chuyển tự nhiên vào toàn cụm “căn cứ ... để buộc tội người này” thay vì dịch máy móc là “trong người này”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “Ta” phù hợp lời của một quan chức cầm quyền trong bối cảnh cổ đại, không hàm ý thần học. Câu dịch ưu tiên sắc thái pháp lý của lời tuyên bố nhưng không thêm kết luận rằng người này hoàn toàn vô tội theo mọi nghĩa.
