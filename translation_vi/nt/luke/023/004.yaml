  terminology: “Phi-lát,” “các thượng tế,” và “đám đông” đều phù hợp. “Căn cứ ... để buộc tội” diễn tả tốt αἴτιον theo nghĩa pháp lý, không khẳng định rộng hơn rằng người này không có bất cứ lỗi nào.
