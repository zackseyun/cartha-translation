  source_fidelity: Bản dịch phản ánh đúng diễn tiến nhẹ của δέ, đối tượng lời nói, các thượng tế và đám đông, cùng ý nghĩa pháp lý của οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ. Cụm “căn cứ nào để buộc tội người này” truyền đạt thích đáng ý ‘không có cơ sở cho một cáo buộc’ trong ngữ cảnh xét xử.
