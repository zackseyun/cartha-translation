source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: vi
  text: Lúc ấy đã vào khoảng giờ thứ sáu[a], và bóng tối bao phủ khắp xứ[b] cho đến giờ thứ chín.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Theo cách tính giờ thời đó, giờ thứ sáu là khoảng mười hai giờ trưa, và giờ thứ chín là khoảng ba giờ chiều.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “khắp đất” hoặc “trên khắp mặt đất.” Từ Hy Lạp γῆ có thể có nghĩa là “xứ, vùng đất” hoặc “đất, trái đất.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: đã
  rationale: Diễn tả thời điểm này trong trình thuật đã đến; cách dùng “đã vào khoảng” tự nhiên trong tiếng Việt hiện đại.
- source_word: ὡσεὶ
  choice: khoảng
  rationale: Giữ rõ ý ước chừng, không biến giờ được nêu thành một thời điểm chính xác tuyệt đối.
- source_word: ὥρα ἕκτη
  choice: giờ thứ sáu
  rationale: Giữ cách tính giờ của nguyên văn; chú thích cung cấp giờ tương đương theo cách tính hiện nay.
- source_word: σκότος
  choice: bóng tối
  rationale: Tương đương trực tiếp, rõ ràng và tự nhiên của danh từ Hy Lạp trong ngữ cảnh này.
- source_word: ἐγένετο
  choice: bao phủ
  rationale: Trong kết cấu tiếng Việt với chủ ngữ “bóng tối”, “bao phủ” diễn đạt tự nhiên việc bóng tối xuất hiện và lan trên một phạm vi, không thêm nguyên nhân của hiện tượng.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: khắp xứ
  rationale: γῆ có thể chỉ vùng đất/xứ hoặc cả đất; “khắp xứ” giữ cách hiểu theo phạm vi khu vực trong chính văn mà không khẳng định quá mức phạm vi toàn cầu. Nghĩa rộng hơn được giữ trong chú thích.
- source_word: ἕως ὥρας ἐνάτης
  choice: cho đến giờ thứ chín
  rationale: Giữ nguyên cách biểu đạt thời gian song song với “giờ thứ sáu”; giờ hiện đại tương ứng được giải thích trong chú thích.
theological_decisions:
- issue: Phạm vi của γῆ trong lời thuật về bóng tối
  choice: xứ
  alternative: cả đất / toàn thể trái đất
  rationale: Danh từ Hy Lạp cho phép cả nghĩa khu vực lẫn nghĩa toàn cầu. Chính văn dùng cách hiểu thận trọng hơn theo ngữ cảnh, còn chú thích giữ nghĩa rộng hơn, nhờ đó không áp đặt cách giải quyết cho chiều kích lịch sử hoặc vũ trụ của biến cố.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Giữ cách tính giờ cổ trong chính văn để trung thành với hình thức của nguyên bản, đồng thời giải thích bằng giờ hiện đại trong chú thích. Dùng “khắp xứ” thay vì một cách diễn đạt khẳng định phạm vi toàn cầu, nhưng vẫn bảo lưu khả năng ấy trong chú thích.
