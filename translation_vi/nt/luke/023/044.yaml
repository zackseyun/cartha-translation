  terminology: «Giờ thứ sáu/thứ chín», «bóng tối», và «xứ» phù hợp với văn phong Kinh Thánh Việt ngữ hiện đại. Giữ «xứ» trong chính văn và nêu «mặt đất» trong chú thích bảo toàn sự mơ hồ ngữ nghĩa của γῆ, không quyết định trước phạm vi khu vực hay toàn cầu.
