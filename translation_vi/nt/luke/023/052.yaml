  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; cấu trúc câu ngắn gọn theo nhịp kể chuyện. Dùng “Phi-lát” và “Đức Chúa Jêsus” theo lối phiên âm và danh xưng quen thuộc trong văn phong Kinh Thánh tiếng Việt.
