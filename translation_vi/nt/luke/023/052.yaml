translation:
  language: vi
  text: Người này đến gặp Phi-lát và xin thi thể của Giê-su.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Người này
  rationale: Đại từ chỉ định quy chiếu về Giô-sép người A-ri-ma-thê ở câu trước; “Người này” giữ được sắc thái hồi chỉ rõ hơn “ông” mà vẫn tự nhiên trong lời kể.
- source_word: προσελθὼν
  choice: đến gặp
  rationale: Phân từ bất định quá khứ diễn tả hành động đi kèm và xảy ra trước động từ chính. “Đến gặp” tự nhiên trong tiếng Việt và thể hiện việc Giô-sép đến trình diện Phi-lát, không nhất thiết hàm ý chỉ đến gần về khoảng cách.
- source_word: τῷ Πιλάτῳ
  choice: Phi-lát
  rationale: Tặng cách chỉ người mà Giô-sép đến gặp. Không thêm tên “Bôn-xơ” vì câu Hy Lạp chỉ có “Phi-lát” và nhân vật đã rõ trong ngữ cảnh.
- source_word: ᾐτήσατο
  choice: xin
  rationale: Động từ ở đây mang nghĩa yêu cầu được nhận một vật. “Xin” vừa gọn, tự nhiên, vừa phù hợp với việc thỉnh cầu nhà cầm quyền giao thi thể.
- source_word: τὸ σῶμα
  choice: thi thể
  rationale: σῶμα có nghĩa cơ bản là “thân thể”; trong ngữ cảnh Đức Chúa Jêsus đã chết, “thi thể” truyền đạt rõ và trang trọng, không mang sắc thái thô như “xác chết”.
- source_word: τοῦ Ἰησοῦ
  choice: của Đức Chúa Jêsus
  rationale: Sở hữu cách được dịch tự nhiên bằng “của”. Cách gọi “Đức Chúa Jêsus” theo văn phong Kinh Thánh tiếng Việt trang trọng và xác định đúng nhân vật, không thêm nội dung ngoài nguyên văn.
theological_decisions: []
