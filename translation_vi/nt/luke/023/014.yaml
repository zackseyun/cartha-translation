id: LUK.23.14
reference: Luke 23:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: vi
  text: 'Ông nói với họ: “Các ông đã đưa người này đến trước tôi, vì cho rằng người ấy làm cho dân chúng lầm đường.[a] Này, sau khi thẩm vấn người ấy trước mặt các ông, tôi không tìm thấy nơi người này bất cứ căn cứ nào cho những cáo buộc các ông đưa ra chống lại người ấy.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm cho dân chúng quay khỏi”. Động từ Hy Lạp có thể mang nghĩa làm quay khỏi hoặc dẫn đi sai lạc.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tôi không thấy người này có tội về những điều các ông tố cáo người ấy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: đã giải ... đến cho tôi
  rationale: Động từ chỉ hành động đã hoàn tất là đưa Đức Giê-su đến trước Phi-lát; “giải ... đến” tự nhiên trong bối cảnh pháp lý và hàm ý người bị đưa đến đang bị quản thúc.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: người này
  rationale: Cách diễn đạt tự nhiên, chính xác và trang trọng trong tiếng Việt; đại từ “anh ta” ở mệnh đề sau giúp tránh lặp nặng nề.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: tố cáo rằng anh ta làm cho dân chúng lầm đường
  rationale: ὡς ở đây trình bày tư cách hoặc cáo buộc mà họ gán cho người bị giải đến. ἀποστρέφω có thể chỉ làm quay khỏi hoặc dẫn sai đường; “làm cho ... lầm đường” giữ sắc thái ấy mà không nâng thành “xúi giục nổi loạn”.
- source_word: τὸν λαόν
  choice: dân chúng
  rationale: λαός chỉ dân chúng nói chung trong bối cảnh này, không nhất thiết là đám đông ngay tại chỗ hay một thuật ngữ chính trị như “quốc gia”.
- source_word: ἰδοὺ
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý của tiểu từ diễn ngôn, đồng thời phù hợp với lời nói trang trọng nhưng hiện đại.
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: tôi đã thẩm vấn anh ta trước mặt các ông
  rationale: ἀνακρίνω mang nghĩa điều tra, thẩm tra hoặc thẩm vấn trong bối cảnh tư pháp; “thẩm vấn” làm rõ sắc thái pháp lý. “Trước mặt các ông” bảo tồn việc cuộc thẩm vấn diễn ra công khai trong sự hiện diện của họ.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: không tìm thấy nơi người này căn cứ nào
  rationale: αἴτιον trong ngữ cảnh pháp lý là căn cứ của cáo buộc hoặc sự quy tội. Cấu trúc này giữ gần cách nói Hy Lạp mà vẫn hiểu được trong tiếng Việt.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: cho những điều các ông tố cáo anh ta
  rationale: Bảo tồn động từ pháp lý κατηγορέω và quan hệ trực tiếp giữa điều bị tố cáo với kết luận của Phi-lát.
theological_decisions:
- issue: Phạm vi lời tuyên bố của Phi-lát
  choice: Diễn đạt như kết luận pháp lý rằng không tìm thấy căn cứ cho các cáo buộc đang được nêu.
  alternative: “Tôi không thấy người này có tội” hoặc “Tôi không thấy người này đáng bị kết án.”
  rationale: Các từ ἀνακρίνω, αἴτιον và κατηγορέω tạo nên khung cảnh tư pháp. Bản dịch không biến kết luận cụ thể về cáo buộc thành một phán quyết tuyệt đối về tình trạng đạo đức hay thần học của Đức Giê-su.
- issue: Sắc thái của ἀποστρέφοντα
  choice: “làm cho dân chúng lầm đường”
  alternative: “làm cho dân chúng quay khỏi” hoặc “xúi giục dân chúng”
  rationale: Giữ khả năng hiểu là dẫn sai lạc mà không mặc nhiên xác định đối tượng mà dân chúng bị làm cho quay khỏi, cũng không tăng mức độ thành kích động nổi loạn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, giữ sắc thái pháp đình. Đại từ “ông/các ông” phù hợp lời của Phi-lát nói với các lãnh đạo và đám đông; “anh ta” là cách quy chiếu tự nhiên trong lời tố tụng. Dấu [a] được đặt ngay sau toàn bộ kết luận pháp lý mà chú thích giải thích.
