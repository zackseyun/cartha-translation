  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: vi
  text: 'Ông nói với họ lần thứ ba[a]: “Tại sao? Người này đã làm điều ác gì? Ta không thấy người này có tội gì đáng chết[b]. Vậy, sau khi trừng phạt người này[c], ta sẽ thả ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì người này đã làm điều ác gì?” Từ Τί mở đầu có thể được hiểu là một lời phản đối rút gọn dẫn vào câu hỏi đầy đủ.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “căn cứ nào để xử tử,” “điều gì đáng phải chết,” hoặc “tội gì đáng chịu án tử hình.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “sau khi sửa phạt người này”; cũng có thể cụ thể hơn là “sau khi đánh đòn người này.” Động từ Hy Lạp παιδεύσας chỉ sự kỷ luật mang tính trừng phạt, nhưng tự nó không xác định chính xác hình thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: lần thứ ba
  rationale: Dạng đối cách dùng như trạng từ, diễn tả hành động được lặp lại; cách dịch này tự nhiên và giữ được sự nhấn mạnh của trình thuật.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Tại sao? Người này đã làm điều ác gì?
  rationale: Τί có thể là một lời phản đối rút gọn trước câu hỏi đầy đủ. Tách thành hai câu giữ được nhịp tranh biện của nguyên văn; “điều ác” bảo toàn sắc thái đạo đức của κακόν.
- source_word: οὐδὲν αἴτιον θανάτου
  choice: không ... có điều gì đáng tội chết
  rationale: Trong ngữ cảnh xét xử, αἴτιον chỉ căn cứ hay điều đáng chịu một hình phạt. Cách diễn đạt này rõ ràng trong tiếng Việt và giữ liên hệ trực tiếp với án chết mà không diễn giải quá mức.
- source_word: εὗρον ἐν αὐτῷ
  choice: Ta không thấy nơi người này
  rationale: “Thấy nơi người này” phản ánh ἐν αὐτῷ và trình bày kết luận hiện tại của người nói; không đổi thành “cáo buộc người này,” vốn mang tính diễn giải hơn.
- source_word: παιδεύσας
  choice: sau khi trừng phạt người này
  rationale: Trong ngữ cảnh này, động từ chỉ một hình thức kỷ luật mang tính trừng phạt, nhưng tự nó không xác định chính xác biện pháp. “Trừng phạt” tự nhiên hơn “sửa phạt” trong tiếng Việt hiện đại và không mặc nhiên xác định là đánh đòn.
- source_word: ἀπολύσω
  choice: ta sẽ thả ra
  rationale: Trong bối cảnh pháp lý, ἀπολύω có nghĩa là phóng thích. “Thả ra” là cách nói tự nhiên, dễ hiểu và vẫn phù hợp với lời tuyên bố của người có thẩm quyền.
theological_decisions:
- issue: Bản chất hình phạt được đề nghị qua παιδεύσας
  choice: Dịch khái quát là “sau khi trừng phạt người này.”
  alternative: “sau khi sửa phạt người này” hoặc cụ thể hơn là “sau khi đánh đòn người này”
  rationale: Câu này đặt việc tuyên bố người ấy không đáng chết bên cạnh đề nghị áp dụng một hình phạt nhẹ hơn. Nguyên ngữ cho phép nghĩa kỷ luật hoặc trừng phạt nhưng không tự xác định hình thức, nên bản chính không áp đặt một sự tái dựng lịch sử cụ thể.
- issue: Sắc thái pháp lý của αἴτιον θανάτου
  choice: “điều gì đáng tội chết”
  alternative: “căn cứ nào để xử tử” hoặc “tội gì đáng phải chết”
  rationale: Cách dịch chính giữ được cả sắc thái pháp lý lẫn sự đánh giá về mức hình phạt, nhưng không biến câu thành một thuật ngữ tố tụng quá chuyên biệt.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” cho đại từ kể chuyện và “ta” trong lời của người có thẩm quyền. Tránh từ cổ “quở phạt”; giữ nhịp chất vấn ngắn của nguyên văn và sắc thái pháp lý của lời tuyên bố.
