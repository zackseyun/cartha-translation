id: LUK.23.51
reference: Luke 23:51
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: vi
  text: Ông đã không tán thành kế hoạch và hành động của họ[a]—ông đến từ A-ri-ma-thê, một thành của người Do Thái, và đang trông đợi vương quốc Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã không đồng thuận với quyết định và việc làm của họ.”'
    reason: Giữ các khả năng từ vựng chính của συγκατατίθεμαι, βουλή và πρᾶξις mà không làm thay đổi ý chính.
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: không tán thành
  rationale: Cấu trúc phân từ hoàn thành đi với ἦν diễn tả lập trường không đồng thuận đã được xác lập trước đó. “Không tán thành” tự nhiên trong tiếng Việt hiện đại và không hàm ý một thủ tục bỏ phiếu cụ thể.
- source_word: βουλῇ
  choice: kế hoạch
  rationale: Trong ngữ cảnh này, từ này chỉ ý định hoặc chủ trương đã được bàn định của họ, chứ không phải chính hội đồng. “Kế hoạch” giữ được sự phân biệt với hành động thực hiện kế hoạch ấy.
- source_word: πράξει
  choice: hành động
  rationale: Từ này nói đến điều họ thực sự làm; “hành động” tạo thành cặp nghĩa rõ ràng với “kế hoạch” mà không diễn giải thêm.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: đến từ A-ri-ma-thê, một thành của người Do Thái
  rationale: Cách dịch này giữ cấu trúc đồng vị của câu Hy Lạp và không thu hẹp “của người Do Thái” thành một xác định địa lý hoặc sắc tộc cụ thể hơn nguồn văn bản.
- source_word: προσεδέχετο
  choice: vẫn trông đợi
  rationale: Thì chưa hoàn thành diễn tả trạng thái mong đợi kéo dài. “Vẫn trông đợi” vừa tự nhiên vừa gợi sự chờ đợi đầy kỳ vọng, thay vì chủ động tìm kiếm.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Đây là cách diễn đạt rõ ràng, trang trọng và quen thuộc, đồng thời giữ được hình ảnh βασιλεία mà không buộc nghĩa chỉ còn là lãnh thổ hay chỉ là sự cai trị.
- source_word: οὗτος
  choice: Ông
  rationale: Đại từ nối trực tiếp với Giô-sép ở câu trước. Trong tiếng Việt, “ông” tự nhiên và đủ rõ; dịch sát thành “người này” sẽ nặng và kém tự nhiên trong mạch văn.
theological_decisions:
- issue: Mức độ Giô-sép tách mình khỏi vai trò của giới lãnh đạo trong cái chết của Đức Chúa Jêsus
  choice: Nói rằng ông không tán thành kế hoạch và hành động của họ, nhưng không thêm chi tiết về việc bỏ phiếu hay thủ tục của Hội đồng.
  alternative: Ông đã không bỏ phiếu thuận cho quyết định của họ.
  rationale: Bản Hy Lạp khẳng định sự không đồng thuận của ông đối với βουλή và πρᾶξις, nhưng không nói rõ một cuộc bỏ phiếu. Bản dịch vì thế giữ nguyên mức độ xác định của nguồn văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dấu gạch ngang giữ mối nối chặt giữa lập trường của Giô-sép và phần mô tả quê quán cùng niềm trông đợi của ông. Tên riêng dùng dạng phiên âm quen thuộc “A-ri-ma-thê”; danh xưng thần học dùng “Đức Chúa Trời” theo lối văn Kinh Thánh phổ thông.
