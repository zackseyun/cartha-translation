  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Câu giữ nhịp dồn dập của cảnh xét xử; dấu chấm phẩy phân biệt hành động gây sức ép với kết quả tiếng kêu của họ thắng thế.
