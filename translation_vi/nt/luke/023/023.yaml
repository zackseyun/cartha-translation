  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: vi
  text: Nhưng họ cứ lớn tiếng[a] thúc ép, đòi đóng đinh Ngài; và tiếng kêu của họ đang thắng thế.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp lặp lại từ φωνή (“tiếng nói” hoặc “tiếng kêu”) ở cả hai vế: cụm “lớn tiếng” ở vế đầu và “tiếng kêu” ở vế sau. Vế sau cũng có thể dịch là: “tiếng nói của họ đang thắng thế”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: cứ… thúc ép
  rationale: Thể chưa hoàn thành diễn tả sự gây sức ép liên tục và dai dẳng; “cứ… thúc ép” chuyển tải cả tính kéo dài lẫn mức độ quyết liệt trong bối cảnh trước mặt Phi-lát.
- source_word: φωναῖς μεγάλαις
  choice: lớn tiếng
  rationale: Cụm từ chỉ cách thức họ gây sức ép. “Lớn tiếng” tự nhiên trong tiếng Việt và giữ được trọng tâm thính giác mà không buộc nghĩa thành một loại tiếng hô cụ thể.
- source_word: αἰτούμενοι
  choice: đòi
  rationale: Động từ có nghĩa căn bản là xin hoặc yêu cầu, nhưng trong bối cảnh đám đông liên tục gây sức ép, “đòi” diễn đạt tự nhiên sắc thái mạnh mà không cần thêm ý ngoài văn cảnh.
- source_word: αὐτὸν σταυρωθῆναι
  choice: phải đóng đinh Ngài
  rationale: Cách diễn đạt này giữ nghĩa bị động của động từ Hy Lạp và chuyển tự nhiên nội dung điều đám đông yêu cầu. “Ngài” duy trì văn phong tôn kính phổ thông khi nói về Chúa Giê-su.
- source_word: κατίσχυον
  choice: đã thắng thế
  rationale: Diễn tả tiếng kêu của họ giành được ưu thế và cuối cùng chi phối diễn tiến. “Đã thắng thế” rõ nghĩa, trang trọng và tự nhiên trong tiếng Việt.
- source_word: αἱ φωναὶ αὐτῶν
  choice: tiếng kêu của họ
  rationale: Trong ngữ cảnh đám đông, “tiếng kêu” tự nhiên hơn “tiếng nói” và làm nổi bật sức ép của tiếng hô. Chú thích nêu rõ nguyên văn lặp lại cùng một danh từ đã được dịch gọn là “lớn tiếng” ở vế trước.
theological_decisions: []
