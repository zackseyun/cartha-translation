  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc của câu Hy Lạp: οὖν là kết luận (“Vậy”), phân từ aorist παιδεύσας được diễn đạt theo thời gian (“sau khi trừng phạt”), và ἀπολύσω là lời tuyên bố tương lai về việc trả tự do. “Trừng phạt” phù hợp bối cảnh tư pháp và không tự ý cụ thể hóa thành đánh đòn.'
