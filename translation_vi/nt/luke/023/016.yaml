source:
  edition: SBLGNT
  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: vi
  text: Vậy, sau khi trừng phạt ông ấy, tôi sẽ thả ông ấy ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi sửa phạt ông ấy” hoặc “sau khi trừng trị ông ấy”. Động từ Hy Lạp có thể chỉ sự sửa phạt nhằm uốn nắn. Một số người hiểu hình phạt ở đây cụ thể là đánh đòn, nhưng bản thân động từ có nghĩa rộng hơn.'
    reason: Nêu các khả năng từ vựng thật sự của παιδεύσας và tránh xác định quá mức phương thức trừng phạt.
lexical_decisions:
- source_word: παιδεύσας
  choice: sau khi trừng phạt
  rationale: Phân từ bất định được hiểu theo thời gian. Trong bối cảnh xét xử của Phi-lát, động từ mang nghĩa xử phạt; cách dịch này giữ phạm vi nghĩa rộng của từ Hy Lạp mà không xác định quá mức là đánh đòn.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận hoặc hệ quả trong lời Phi-lát một cách tự nhiên, đồng thời vẫn giữ lực suy luận của liên từ.
- source_word: αὐτόν
  choice: người
  rationale: Đại từ chỉ Đức Giê-su; viết thường vì đây là đại từ nhân xưng chứ không phải danh xưng, phù hợp văn phong tiếng Việt trang trọng.
- source_word: ἀπολύσω
  choice: tôi sẽ thả người ra
  rationale: Trong bối cảnh pháp lý và giam giữ, động từ có nghĩa trả tự do; “thả ... ra” là cách nói hiện đại, rõ ràng và tự nhiên.
theological_decisions:
- issue: Phạm vi nghĩa của παιδεύω trong đề nghị của Phi-lát
  choice: Dịch theo nghĩa tư pháp là “trừng phạt”, không xác định hình thức cụ thể.
  alternative: “sửa phạt”, “kỷ luật”, hoặc cụ thể hóa thành “đánh đòn”
  rationale: Bối cảnh đòi hỏi một hành động mang tính hình phạt trước khi phóng thích. “Trừng phạt” phản ánh điều đó nhưng không thu hẹp nghĩa thành một hình thức xử phạt mà bản thân động từ Hy Lạp không nêu rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc suy luận của lời Phi-lát; “người” được dùng để quy chiếu Đức Giê-su theo lối văn Kinh Thánh trang trọng nhưng không cổ hóa.
