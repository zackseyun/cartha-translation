  terminology: “Trừng phạt” là lựa chọn thích hợp cho παιδεύω trong ngữ cảnh này. Chú thích giữ đúng độ rộng từ vựng của động từ và nêu khả năng “đánh đòn” chỉ như một cách hiểu cụ thể hơn, không như nghĩa bắt buộc của từ.
