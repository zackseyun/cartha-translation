revisions:
- from: 'Rồi người ấy nói: “Lạy Đức Giê-su, xin nhớ đến tôi khi Ngài đến trong vương quốc của Ngài.”[a]'
  to: 'Rồi người ấy nói: “Giê-su, xin nhớ đến tôi khi Ngài đến trong vương quốc của Ngài.”[a]'
  rationale: Bản sửa giữ nguyên cấu trúc và ý nghĩa của câu Hy Lạp, đặc biệt là giới từ ἐν trong bản SBLGNT, đồng thời loại bỏ các tước xưng không được nêu trong nguyên văn. Ghi chú được thu hẹp để mô tả chính xác biến thể thủ bản và không áp đặt cách giải thích thần học.
