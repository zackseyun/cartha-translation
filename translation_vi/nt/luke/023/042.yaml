  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: vi
  text: 'Rồi người ấy nói: “Giê-su, xin nhớ đến tôi khi Ngài đến trong vương quốc của Ngài.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “vào vương quốc của Ngài” thay cho “trong vương quốc của Ngài”; bản SBLGNT chép “trong vương quốc của Ngài”.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Rồi
  rationale: Liên từ nối tiếp diễn biến; “Rồi” tự nhiên trong văn kể chuyện tiếng Việt mà không thêm quan hệ nhân quả.
- source_word: ἔλεγεν
  choice: người ấy nói
  rationale: Dạng vị hoàn thành chưa hoàn tất có thể là “đang nói”, nhưng ở đây công thức dẫn lời được diễn đạt tự nhiên bằng quá khứ đơn theo ngữ cảnh; chủ thể được nêu là “người ấy” để tiếng Việt rõ nghĩa.
- source_word: Ἰησοῦ
  choice: Lạy Đức Giê-su
  rationale: Đây là hô cách của tên riêng. “Lạy” biểu thị lời thưa trực tiếp, khẩn cầu; “Đức Giê-su” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: μνήσθητί μου
  choice: xin nhớ đến tôi
  rationale: Mệnh lệnh dùng như lời khẩn cầu. “Nhớ đến” giữ nghĩa trực tiếp, đồng thời không diễn giải quá mức hàm ý hành động ưu ái.
- source_word: ὅταν ἔλθῃς
  choice: khi Ngài đến
  rationale: ὅταν với động từ giả định hướng đến một biến cố tương lai; “khi… đến” là cách diễn đạt tự nhiên và giữ nguyên sự mong đợi của người nói.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: trong vương quốc của Ngài
  rationale: Dịch sát giới từ ἐν là “trong”. Cụm từ trong ngữ cảnh động từ “đến” có thể mang sắc thái đến trong tư cách trị vì hoặc đến vào vương quốc; ghi chú giữ lại độ mở này.
- source_word: βασιλείᾳ
  choice: vương quốc
  rationale: βασιλεία có thể chỉ vương quốc, vương quyền hoặc sự trị vì. “Vương quốc” là từ tự nhiên, truyền thống và vẫn gợi được quyền cai trị của vua.
theological_decisions:
- issue: Sắc thái cánh chung trong lời cầu xin với Đức Giê-su
  choice: Người nói xin Đức Giê-su nhớ đến mình khi Ngài đến trong vương quốc của Ngài, không xác định thêm thời điểm hay trình tự.
  alternative: Có thể hiểu là khi Đức Giê-su đến với vương quyền, hoặc khi Ngài bước vào vương quốc của mình.
  rationale: Câu này xác nhận sự trông đợi về vương quốc thuộc về Đức Giê-su nhưng không tự trình bày một hệ thống cánh chung chi tiết; bản dịch giữ nguyên độ mở ấy.
- issue: Hướng nghĩa của ἐν τῇ βασιλείᾳ σου
  choice: trong vương quốc của Ngài
  alternative: vào vương quốc của Ngài; với vương quyền của Ngài
  rationale: Bản SBLGNT dùng ἐν, thường có nghĩa “trong”, trong khi ngữ cảnh với “đến” cho phép cách hiểu có sắc thái chuyển động hoặc xuất hiện trong vương quyền. Không nên âm thầm quyết định một cách hiểu duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời thưa trực tiếp để giữ sắc thái kính trọng; tránh thêm các chi tiết giáo lý không có trong câu Hy Lạp.
