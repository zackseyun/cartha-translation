  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: vi
  text: Các thượng tế và các kinh sư đứng đó, kịch liệt tố cáo Đức Giê-su.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: đứng đó
  rationale: Dạng quá khứ mang nghĩa trạng thái, cho biết họ đang hiện diện trong tư thế đứng tại hiện trường; “đứng đó” tự nhiên và giữ chức năng dựng cảnh.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ nhẹ để tiếp nối trình thuật; tiếng Việt tự nhiên có thể thể hiện sự tiếp nối bằng cách mở câu trực tiếp, không cần thêm “và” hay “nhưng”.
- source_word: ἀρχιερεῖς
  choice: các thượng tế
  rationale: Chỉ giới lãnh đạo tư tế, không hàm ý rằng nhiều người đồng thời giữ chức thượng tế duy nhất; đây là cách gọi quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: γραμματεῖς
  choice: các kinh luật gia
  rationale: Chỉ những chuyên gia sao chép, nghiên cứu và giải thích Kinh Luật; “kinh luật gia” vừa gọn vừa giúp độc giả hiện đại hiểu chức năng rõ hơn “kinh sư” hay “thầy thông giáo”.
- source_word: εὐτόνως
  choice: kịch liệt
  rationale: Diễn đạt cường độ mạnh và thái độ quyết liệt trong việc buộc tội.
- source_word: κατηγοροῦντες
  choice: tố cáo
  rationale: Phân từ hiện tại diễn tả hành động đang tiếp diễn đồng thời với việc họ đứng đó; “tố cáo” phù hợp bối cảnh xét xử và kết hợp tự nhiên với “kịch liệt”.
- source_word: αὐτοῦ
  choice: Đức Giê-su
  rationale: Đại từ chỉ Đức Giê-su; dùng lại danh xưng để câu tiếng Việt đứng độc lập rõ nghĩa theo đơn vị câu được yêu cầu.
