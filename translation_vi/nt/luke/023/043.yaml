  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: vi
  text: 'Ngài nói với người ấy[a]: “Ta bảo thật với anh, hôm nay anh sẽ ở với Ta trong cõi phước lạc.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, ít có khả năng hơn: “Ta bảo thật với anh hôm nay: anh sẽ ở với Ta trong cõi phước lạc.” Các bản chép tay Hy Lạp cổ không có dấu câu hiện đại; cách hiểu này gắn “hôm nay” với “Ta bảo thật với anh” thay vì với “anh sẽ ở”.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: Thật
  rationale: Trong lời nói của Chúa Giê-su, từ này mở đầu một lời tuyên bố long trọng và chắc chắn. “Thật” tự nhiên trong tiếng Việt hiện đại và giữ được sức nặng của lời xác quyết.
- source_word: σοι λέγω
  choice: tôi nói với anh
  rationale: Cách dịch sát và tự nhiên, đồng thời giữ đại từ số ít và lời nói trực tiếp với người cùng chịu đóng đinh.
- source_word: σήμερον
  choice: hôm nay
  rationale: Trạng từ này tự nhiên nhất khi bổ nghĩa cho “anh sẽ ở”, nghĩa là lời hứa được thực hiện ngay trong ngày ấy. Vì nguyên bản không có dấu câu hiện đại và có thể hiểu theo cách khác, cách đọc thay thế được ghi ở chú thích.
- source_word: μετ’ ἐμοῦ
  choice: ở với tôi
  rationale: Giữ nguyên ý nghĩa hiệp thông mang tính cá nhân của cụm giới từ; trong câu tiếng Việt, “ở với tôi” tự nhiên hơn chỉ riêng “với tôi”.
- source_word: ἔσῃ
  choice: anh sẽ ở
  rationale: Diễn đạt trực tiếp thì tương lai của εἰμί bằng tiếng Việt hiện đại.
- source_word: παραδείσῳ
  choice: nơi phước hạnh
  rationale: παράδεισος trong ngữ cảnh này chỉ nơi phước hạnh dành cho người công chính. “Nơi phước hạnh” rõ nghĩa đối với độc giả phổ thông và tránh để từ vay mượn “thiên đàng” tự nó áp đặt những chi tiết thần học mà câu không nêu.
theological_decisions:
- issue: Vị trí và phạm vi bổ nghĩa của σήμερον (“hôm nay”) trong một lời nói phụ thuộc vào dấu câu và có hệ quả đối với cách hiểu về trạng thái sau khi chết
  choice: Gắn “hôm nay” với “anh sẽ ở với tôi trong nơi phước hạnh”
  alternative: Gắn “hôm nay” với “tôi nói với anh”
  rationale: Các bản chép tay Hy Lạp cổ không có hệ thống dấu câu hiện đại. Tuy vậy, trật tự và cách dùng tự nhiên của tiếng Hy Lạp Koine thuận hơn cho cách hiểu rằng “hôm nay” xác định thời điểm người ấy sẽ ở với Chúa Giê-su. Cách hiểu khác vẫn được nêu trong chú thích để bảo tồn sự mơ hồ thực sự của việc chấm câu và không âm thầm giải quyết một vấn đề thần học đang được tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su trong lời dẫn, nhưng giữ “tôi–anh” trong lời trực tiếp để phản ánh ngôi thứ nhất và ngôi thứ hai số ít mà không đưa thêm tước hiệu vào nguyên văn. Dấu chú thích [a] được đặt ngay sau cụm lời dẫn liên quan.
