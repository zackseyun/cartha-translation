  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: vi
  text: Hê-rốt hỏi Ngài rất nhiều[a], nhưng Ngài không đáp lại điều gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “hỏi Ngài bằng nhiều lời” hoặc “hỏi Ngài hồi lâu.” Cụm Hy Lạp nhấn mạnh việc hỏi bằng lời nói kéo dài; không nhất thiết chỉ rõ đó là nhiều câu hỏi riêng lẻ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: hỏi ... dồn dập
  rationale: Thì chưa hoàn thành diễn tả hành động kéo dài hoặc lặp đi lặp lại; “hỏi dồn dập” truyền đạt việc liên tục chất vấn trong ngữ cảnh.
- source_word: δὲ
  choice: Vì vậy / nhưng
  rationale: δὲ thứ nhất là từ nối nhẹ tiếp tục mạch kể chuyện, được diễn đạt tự nhiên bằng “Vì vậy”; δὲ thứ hai đánh dấu sự tương phản giữa việc Hê-rốt chất vấn và sự im lặng của Đức Giê-su, nên dịch là “nhưng”.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: dồn dập hồi lâu
  rationale: Cụm này theo sát nghĩa là “bằng nhiều lời”, nhấn mạnh việc chất vấn bằng lời nói kéo dài. Cách dịch này tự nhiên trong tiếng Việt và giữ cả sắc thái lặp lại lẫn thời lượng.
- source_word: αὐτὸς
  choice: Ngài
  rationale: Đại từ có chút nhấn mạnh và tạo thế tương phản với hoạt động của Hê-rốt; sự tương phản đã được thể hiện bằng “nhưng”. “Ngài” là cách quy chiếu trang trọng, tự nhiên đến Đức Giê-su.
- source_word: οὐδὲν
  choice: không ... điều gì
  rationale: Diễn đạt trực tiếp nội dung phủ định hoàn toàn của câu trả lời mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀπεκρίνατο αὐτῷ
  choice: trả lời ông
  rationale: Đây là cách diễn đạt tiếng Việt tiêu chuẩn cho động từ “đáp/trả lời” cùng bổ ngữ gián tiếp chỉ Hê-rốt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Nêu rõ Hê-rốt và Đức Giê-su thay cho các đại từ liên tiếp để tránh mơ hồ trong câu đứng riêng; giữ tương phản giữa việc chất vấn kéo dài và việc Đức Giê-su hoàn toàn không đáp lời.
