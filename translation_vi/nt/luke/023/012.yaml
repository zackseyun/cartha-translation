id: LUK.23.12
reference: Luke 23:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: vi
  text: Chính ngày hôm ấy, Hê-rốt và Phi-lát trở thành bạn với nhau[a], vì trước đó hai người vốn thù nghịch nhau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trở nên thân thiện với nhau.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì trước đó hai người vốn ở trong tình trạng thù địch với nhau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: trở thành
  rationale: Diễn tả sự thay đổi trong quan hệ, phù hợp với động từ aorist γίνομαι.
- source_word: φίλοι
  choice: bạn
  rationale: Giữ cách nói trực tiếp của danh từ vị ngữ; trong ngữ cảnh cũng có thể chỉ quan hệ thân thiện hoặc liên minh.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: Chính ngày hôm ấy
  rationale: Bảo lưu sắc thái nhấn mạnh của αὐτῇ và diễn đạt tự nhiên trong tiếng Việt.
- source_word: μετ’ ἀλλήλων
  choice: với nhau
  rationale: Thể hiện rõ quan hệ tương hỗ giữa Hê-rốt và Phi-lát.
- source_word: προϋπῆρχον
  choice: trước đó ... vốn
  rationale: Diễn tả trạng thái đã tồn tại liên tục từ trước, tương phản với sự thay đổi xảy ra trong ngày ấy.
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: hai người vốn thù nghịch nhau
  rationale: Chuyển cấu trúc danh từ của tiếng Hy Lạp thành cách nói tiếng Việt tự nhiên mà vẫn giữ ý về tình trạng đối địch lẫn nhau.
theological_decisions:
- issue: Tính chất của sự thay đổi quan hệ giữa Hê-rốt và Phi-lát
  choice: Dịch là “trở thành bạn với nhau” nhưng ghi chú khả năng hiểu yếu hơn là “trở nên thân thiện với nhau”.
  alternative: Hiểu φίλοι chủ yếu theo nghĩa đồng minh chính trị hoặc chỉ là hòa hoãn tạm thời.
  rationale: Câu văn xác nhận một sự thay đổi quan hệ nhưng không nêu động cơ, độ sâu hay ý nghĩa thần học của tình bạn; bản dịch không bổ sung những điều văn bản không nói.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đưa cụm thời gian lên đầu câu để diễn đạt tự nhiên và giữ sự nhấn mạnh; dùng “hai người” ở vế sau để tránh mơ hồ nhưng không thêm nội dung diễn giải.
