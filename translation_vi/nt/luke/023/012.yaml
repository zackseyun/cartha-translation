  terminology: Tên riêng “Hê-rốt” và “Phi-lát” phù hợp thông lệ tiếng Việt. “Trở thành bạn với nhau” phản ánh trực tiếp φίλοι, còn chú thích nêu đúng khả năng hiểu nhẹ hơn là “trở nên thân thiện.” Thuật ngữ “thù nghịch” phù hợp với ἔχθρα.
