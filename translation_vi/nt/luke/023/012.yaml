  source_fidelity: 'Bản dịch chuyển tải đúng các yếu tố chính của câu Hy Lạp: sự thay đổi quan hệ (ἐγένοντο), quan hệ “bạn” (φίλοι), sự nhấn mạnh thời điểm “chính ngày hôm ấy” (ἐν αὐτῇ τῇ ἡμέρᾳ), và tình trạng thù nghịch có từ trước, mang tính tương hỗ (προϋπῆρχον ... πρὸς αὑτούς). Không thêm động cơ chính trị hay hàm ý thần học ngoài văn bản.'
