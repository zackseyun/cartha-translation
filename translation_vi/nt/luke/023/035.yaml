reference: Luke 23:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: vi
  text: 'Dân chúng đứng đó quan sát. Ngay cả các nhà lãnh đạo cũng chế nhạo Người, nói rằng: “Ông ta đã cứu người khác; cứ tự cứu mình đi, nếu tên này là Đấng Mê-si của Đức Chúa Trời, Đấng Được Chọn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: đứng đó
  rationale: Dạng động từ diễn tả trạng thái làm nền cho cảnh; “đứng đó” tự nhiên trong tiếng Việt và giữ được tư thế của dân chúng.
- source_word: θεωρῶν
  choice: nhìn xem
  rationale: Phân từ diễn tả việc dân chúng tiếp tục chăm chú quan sát; “nhìn xem” rõ nghĩa và trang trọng vừa phải.
- source_word: ἐξεμυκτήριζον
  choice: chế nhạo Người
  rationale: Động từ chỉ sự nhạo báng đầy khinh miệt. Tân ngữ “Người” được bổ sung theo ngữ cảnh; cách viết hoa phù hợp văn phong Kinh Thánh tiếng Việt mà không làm mất lời nhạo báng của các nhà lãnh đạo.
- source_word: ἄρχοντες
  choice: các nhà lãnh đạo
  rationale: Trong ngữ cảnh này, từ chỉ những người giữ vai trò lãnh đạo trong dân. “Các nhà lãnh đạo” tự nhiên và ít gợi một cơ cấu chính trị cụ thể hơn “những người cai trị”.
- source_word: Ἄλλους ἔσωσεν
  choice: Ông ta đã cứu người khác
  rationale: Giữ động từ “cứu” để bảo toàn sự lặp lại với mệnh đề kế tiếp. “Ông ta” truyền đạt sắc thái xa cách, khinh miệt của οὗτος trong lời chế nhạo.
- source_word: σωσάτω ἑαυτόν
  choice: hãy để ông ta tự cứu mình đi
  rationale: Diễn đạt tự nhiên mệnh lệnh ngôi thứ ba, đồng thời giữ nguyên sự lặp lại của động từ “cứu” và sức mạnh khiêu khích của lời nói.
- source_word: εἰ οὗτός ἐστιν
  choice: nếu ông ta là
  rationale: Tiếng Việt khó dùng đại từ chỉ định theo đúng cấu trúc Hy Lạp mà vẫn tự nhiên; “ông ta” giữ được phần nào sắc thái chỉ trỏ và khinh miệt, thay vì đại từ trung tính.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: Đấng Mê-si của Đức Chúa Trời
  rationale: Χριστός ở đây là tước hiệu nên được dịch là “Đấng Mê-si”. Kết cấu “của Đức Chúa Trời” bám sát quan hệ sở hữu/thuộc về trong nguyên văn mà không giải thích thêm.
- source_word: ὁ ἐκλεκτός
  choice: Đấng Được Chọn
  rationale: Cụm từ có chức năng như một tước hiệu. “Đấng Được Chọn” dễ hiểu, trang trọng và không thêm nội dung thần học ngoài nguyên văn.
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong cụm này Χριστός rõ ràng là tước hiệu về Đấng được xức dầu. “Đấng Mê-si” làm sáng nghĩa chức danh mà không biến nó thành tên riêng.
- issue: Sắc thái của ὁ ἐκλεκτός
  choice: Đấng Được Chọn
  alternative: Đấng Tuyển Chọn
  rationale: Giữ nguyên sức nặng của tước hiệu Kitô học trong chính lời chế nhạo, nhưng không diễn giải người chọn, mục đích chọn, hay hệ quả thần học vượt quá câu văn.
- issue: Quan hệ giữa hai tước hiệu
  choice: Đấng Mê-si của Đức Chúa Trời, Đấng Được Chọn
  alternative: Đấng Mê-si, Đấng Được Chọn của Đức Chúa Trời
  rationale: Theo cách ngắt câu của SBLGNT, τοῦ θεοῦ bổ nghĩa cho ὁ χριστός, còn ὁ ἐκλεκτός là tước hiệu đồng vị. Bản dịch bảo toàn cấu trúc này và không chuyển “của Đức Chúa Trời” sang tước hiệu sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Lời kể dùng “Người” cho Chúa Giê-su, còn lời chế nhạo dùng “ông ta” để phản ánh sắc thái khinh miệt của người nói. Không thêm chú thích vì SBLGNT tại đây không đòi hỏi ghi chú biến thể trong bản dịch tiếng Việt; ghi chú tiếng Anh được cung cấp dường như không khớp với vị trí dấu [a] trong câu.
