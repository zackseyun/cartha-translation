source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: vi
  text: 'Nhưng họ càng khăng khăng quả quyết: “Người này kích động dân chúng[a], giảng dạy khắp cả miền Giu-đê[b], bắt đầu từ Ga-li-lê cho đến tận đây[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khuấy động dân chúng” hoặc “xúi giục dân chúng.” Động từ Hy Lạp nói đến việc làm cho người ta bị kích động theo chiều hướng gây rối.
    reason: lexical_alternative
  - marker: b
    text: “Giu-đê” có thể chỉ riêng vùng Giu-đê, hoặc trong một số ngữ cảnh có thể được dùng rộng hơn về lãnh thổ của người Do Thái; ở đây cách nói nhấn mạnh phạm vi rộng của hoạt động ấy.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “cho tới nơi này.” Cụm từ chỉ phạm vi từ Ga-li-lê đến địa điểm hiện tại trước Phi-lát.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: càng khăng khăng
  rationale: Động từ ở thì chưa hoàn thành diễn tả sự thúc ép dai dẳng hoặc ngày càng mạnh; “càng khăng khăng” truyền đạt được cả tính tiếp diễn lẫn sức ép trong lời tố cáo.
- source_word: λέγοντες
  choice: nói
  rationale: Phân từ này dẫn vào nội dung họ quả quyết; “nói” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: Ἀνασείει
  choice: kích động
  rationale: Động từ chỉ việc khuấy động người ta theo chiều hướng gây rối. “Kích động” phù hợp với ngữ cảnh tố cáo trước Phi-lát nhưng không tự ý nâng thành một thuật ngữ pháp lý cụ thể về nổi loạn.
- source_word: τὸν λαὸν
  choice: dân chúng
  rationale: λαός ở đây chỉ dân chúng nói chung, không phải một đám đông đang tụ họp cụ thể; “dân chúng” thể hiện đúng phạm vi của lời tố cáo.
- source_word: διδάσκων
  choice: giảng dạy
  rationale: Phân từ hiện tại mô tả hoạt động gắn với lời tố cáo; “giảng dạy” tự nhiên và giữ được sắc thái đang tiếp diễn.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: khắp cả miền Giu-đê
  rationale: κατά với sở hữu cách mang ý nghĩa phân bố theo không gian; “khắp cả miền Giu-đê” giữ được phạm vi bao quát và rõ ràng trong tiếng Việt.
- source_word: Ἰουδαίας
  choice: Giu-đê
  rationale: Dùng dạng địa danh quen thuộc trong tiếng Việt; từ này có thể chỉ riêng vùng Giu-đê hoặc được dùng rộng hơn tùy ngữ cảnh.
- source_word: ἀρξάμενος
  choice: bắt đầu
  rationale: Phân từ aorist đánh dấu điểm khởi đầu của hoạt động được mô tả; “bắt đầu” nối tự nhiên với cụm chỉ xuất phát điểm.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: từ Ga-li-lê
  rationale: ἀπό chỉ điểm xuất phát; “từ Ga-li-lê” bảo toàn hướng địa lý của lời tố cáo.
- source_word: ἕως ὧδε
  choice: cho đến tận đây
  rationale: Cụm từ nhấn mạnh phạm vi kéo dài từ Ga-li-lê tới chính nơi hiện tại trước Phi-lát; “cho đến tận đây” giữ được cả ý chỉ địa điểm lẫn sắc thái nhấn mạnh.
theological_decisions:
- issue: Tính chất của lời tố cáo chống lại Chúa Giê-su
  choice: Diễn đạt lời buộc tội là “kích động dân chúng” mà không biến nó thành một tội danh chính trị chuyên biệt hơn điều từ Hy Lạp tự nó nói.
  alternative: “Khuấy động dân chúng” hoặc “xúi giục dân chúng.”
  rationale: Những người tố cáo đang gia tăng sức nặng của vụ kiện trước Phi-lát, nhưng ἀνασείει không nhất thiết là thuật ngữ kỹ thuật chỉ hành vi nổi loạn. Bản dịch giữ nguyên tính thù nghịch của lời cáo buộc mà không diễn giải quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Đại từ “hắn” phản ánh lời tố cáo thù nghịch của các đối thủ trong ngữ cảnh xét xử, không phải lời trần thuật trung lập. Các địa danh dùng dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
