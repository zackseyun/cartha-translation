  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: vi
  text: Bấy giờ, toàn thể đám đông ấy đứng dậy và dẫn Người đến gặp Phi-lát.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “toàn thể nhóm người của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: và
  rationale: Liên từ nối tiếp diễn biến; tiếng Việt tự nhiên không cần dịch tách biệt ở đầu câu vì quan hệ tiếp nối đã được thể hiện bằng chuỗi động từ.
- source_word: ἀναστὰν
  choice: đứng dậy
  rationale: Phân từ aorist chỉ hành động xảy ra trước động từ chính; “đứng dậy” vừa tự nhiên vừa giữ đúng trình tự hành động.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: toàn thể hội đồng
  rationale: πλῆθος chỉ toàn bộ nhóm người đã tụ họp trong bối cảnh xét xử; “hội đồng” truyền đạt tính chất của tập thể này mà không xác định quá mức tên gọi thể chế. ἅπαν được thể hiện bằng “toàn thể”; αὐτῶν được hiểu theo ngữ cảnh thay vì dịch cứng là “của họ”.
- source_word: ἤγαγον
  choice: dẫn
  rationale: Động từ ἄγω diễn tả việc đưa một người đi đến nơi hay đến một người khác; “dẫn” phù hợp với việc áp giải Đức Chúa Jêsus.
- source_word: αὐτὸν
  choice: Đức Chúa Jêsus
  rationale: Đại từ chỉ Đức Chúa Jêsus; dùng lại danh xưng trong tiếng Việt để tránh chuỗi đại từ có thể gây mơ hồ và giữ văn phong trang trọng.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: đến Phi-lát
  rationale: ἐπί với đối cách sau động từ chuyển động biểu thị hướng đến một người; “đến Phi-lát” là cách diễn đạt trực tiếp và tự nhiên.
- source_word: Πιλᾶτον
  choice: Phi-lát
  rationale: Phiên âm tên riêng theo cách viết Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt chủ thể tập thể trong bối cảnh xét xử
  choice: toàn thể hội đồng
  alternative: toàn thể đám đông của họ
  rationale: “Hội đồng” phù hợp với nhóm người vừa tiến hành việc xét xử, nhưng πλῆθος tự thân cũng có thể mang nghĩa rộng hơn là “đám đông” hay “toàn thể nhóm người”; chú thích giữ lại khả năng từ vựng đó mà không biến câu chính thành một mô tả về đám đông ngẫu nhiên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ trình tự “đứng dậy rồi dẫn đi”; danh xưng “Đức Chúa Jêsus” và tên “Phi-lát” theo lối dùng quen thuộc trong Kinh Thánh tiếng Việt.
