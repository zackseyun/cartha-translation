revisions:
- from: Toàn thể hội đồng đứng dậy và dẫn Đức Chúa Jêsus đến Phi-lát.[a]
  to: Bấy giờ, toàn thể đám đông ấy đứng dậy và dẫn Người đến gặp Phi-lát.[a]
  rationale: Sửa “hội đồng” thành “đám đông ấy” để không áp đặt tính chất thể chế lên πλῆθος, đồng thời thay danh xưng được thêm vào bằng đại từ tương ứng với nguyên ngữ. Chú thích giữ phương án sát cấu trúc sở hữu của αὐτῶν.
