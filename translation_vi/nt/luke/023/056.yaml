base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: vi
  text: Sau khi trở về[a], họ chuẩn bị hương liệu và dầu thơm[b]. Còn trong ngày Sa-bát, họ nghỉ theo điều răn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi họ trở về” hoặc “Trở về rồi.” Phân từ Hy Lạp cho biết việc trở về xảy ra trước việc chuẩn bị.'
    reason: lexical_alternative
  - marker: b
    text: “Dầu thơm” cũng có thể dịch là “dầu xức thơm” hoặc “chế phẩm thơm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: sau khi trở về
  rationale: Phân từ bất định quá khứ chủ động, giống cái số nhiều, chỉ hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ quan hệ thời gian.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ chỉ nhẹ nhàng tiếp nối diễn tiến câu chuyện; cấu trúc “Sau khi…” đã chuyển mạch tự nhiên mà không cần thêm một liên từ nặng nghĩa.
- source_word: ἡτοίμασαν
  choice: họ chuẩn bị
  rationale: Cách diễn đạt thông dụng, trực tiếp và phù hợp với văn cảnh chuẩn bị mai táng.
- source_word: ἀρώματα
  choice: hương liệu
  rationale: Trong văn cảnh mai táng, từ này chỉ các chất có hương thơm dùng cho thi hài; “hương liệu” rõ nghĩa và phân biệt được với μύρα.
- source_word: μύρα
  choice: dầu thơm
  rationale: μύρον chỉ dầu hoặc chế phẩm thơm dùng để xức; “dầu thơm” là cách nói tự nhiên, cụ thể hơn “nước hoa” và phù hợp với văn cảnh.
- source_word: τὸ μὲν σάββατον
  choice: đến ngày Sa-bát
  rationale: Diễn đạt tự nhiên giá trị thời gian của cụm từ; μέν có tác dụng chuyển tiếp nhẹ nên không cần thể hiện bằng một từ riêng.
- source_word: ἡσύχασαν
  choice: họ nghỉ
  rationale: Trong bối cảnh ngày Sa-bát, động từ mang nghĩa ngừng công việc, nghỉ ngơi; “nghỉ” truyền đạt đúng ý mà không diễn giải quá mức.
- source_word: κατὰ τὴν ἐντολήν
  choice: theo điều răn
  rationale: Giữ số ít của ἐντολήν và ý nghĩa hành động phù hợp với điều đã truyền, không thêm phần giải thích vào chính văn.
theological_decisions:
- issue: Điều răn được nhắc đến là gì
  choice: giữ nguyên “điều răn” ở số ít, trong văn cảnh chỉ điều răn về việc nghỉ ngày Sa-bát
  alternative: diễn giải thành “luật Môi-se” hoặc “điều răn của Đức Chúa Trời”
  rationale: Văn cảnh xác định điều răn liên quan đến ngày Sa-bát, nhưng nguyên văn không nêu thêm chủ thể hay tên bộ luật; bản dịch tránh đưa phần diễn giải thần học vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Sa-bát” là dạng phiên âm quen thuộc trong văn phong Kinh Thánh; câu văn giữ nhịp kể chuyện ngắn gọn. Các ký hiệu chú thích [a], [b] đều được đặt ngay sau từ ngữ liên quan.
