reference: Luke 23:55
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: vi
  text: Những phụ nữ—những người đã cùng đi với ngài từ Ga-li-lê[a]—đi theo và quan sát ngôi mộ, cùng cách thi thể ngài được đặt vào đó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “đã theo ngài từ Ga-li-lê.”'
    reason: Cụm Hy Lạp có thể được diễn đạt theo nghĩa các phụ nữ đã cùng đến với ngài từ Ga-li-lê hoặc đã theo ngài từ Ga-li-lê.
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: đi theo sau
  rationale: Phân từ bất định quá khứ diễn tả hành động đi theo dẫn đến việc quan sát. Cách chuyển thành động từ hữu hạn phối hợp tự nhiên trong tiếng Việt và vẫn giữ được trình tự kể chuyện.
- source_word: δέ
  choice: không dịch thành một từ riêng
  rationale: δέ chỉ đánh dấu sự chuyển tiếp nhẹ trong mạch kể. Cấu trúc câu tiếng Việt và văn cảnh đã thể hiện sự tiếp nối, nên thêm “bấy giờ” hoặc “rồi” có thể làm sắc thái thời gian mạnh hơn nguyên văn.
- source_word: αἱ γυναῖκες
  choice: các phụ nữ
  rationale: Mạo từ xác định cho thấy đây là nhóm phụ nữ đã được biết đến trong câu chuyện; “các phụ nữ” là cách nói tự nhiên trong tiếng Việt.
- source_word: αἵτινες
  choice: những người
  rationale: Cụm chen giải thích xác định rõ hơn nhóm phụ nữ, tương ứng tự nhiên với đại từ quan hệ Hy Lạp.
- source_word: συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: đã cùng ngài từ Ga-li-lê đến
  rationale: Giữ cả ý xuất phát từ Ga-li-lê lẫn ý cùng đi với Chúa Giê-su trước đó, phù hợp với cấu trúc mang sắc thái quá khứ hoàn thành của nguyên văn.
- source_word: ἐθεάσαντο
  choice: quan sát
  rationale: Động từ θεάομαι có thể hàm ý nhìn có chú ý; “quan sát” thích hợp vì các phụ nữ để ý cả ngôi mộ lẫn cách đặt thi thể.
- source_word: τὸ μνημεῖον
  choice: ngôi mộ
  rationale: Trong bối cảnh mai táng, “ngôi mộ” là cách dịch chính xác và quen thuộc.
- source_word: ὡς
  choice: cách
  rationale: Ở đây ὡς giới thiệu cách thức thi thể được đặt, nên “cách” truyền đạt rõ nghĩa mà vẫn tự nhiên.
- source_word: ἐτέθη
  choice: được đặt vào đó
  rationale: Giữ thể bị động của τίθημι; thêm “vào đó” làm rõ việc đặt thi thể trong ngôi mộ mà không bổ sung chủ thể hành động.
- source_word: τὸ σῶμα αὐτοῦ
  choice: thi thể ngài
  rationale: “Thi thể” diễn đạt σῶμα phù hợp với bối cảnh người đã chết; đại từ sở hữu chỉ Chúa Giê-su được thể hiện tự nhiên bằng “ngài”.
theological_decisions:
- issue: Quan hệ về trình tự giữa phân từ κατακολουθήσασαι và động từ chính ἐθεάσαντο
  choice: 'Diễn đạt bằng hai hành động phối hợp: “đi theo sau và quan sát”'
  alternative: “Sau khi đi theo sau, họ quan sát”
  rationale: Đây là lựa chọn cú pháp chứ không phải quyết định giáo lý. Cách phối hợp động từ tự nhiên trong tiếng Việt vẫn giữ được việc các phụ nữ đi theo rồi quan sát nơi mai táng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngài” để chỉ Chúa Giê-su theo lối tôn kính tự nhiên; không viết hoa đại từ. Dấu gạch ngang làm rõ mệnh đề giải thích, tránh chuỗi động từ khó đọc.
