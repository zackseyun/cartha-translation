  to: Cũng có hai người khác, là những tội phạm[a], đang bị dẫn đi cùng Ngài để bị xử tử[b].
  rationale: Sửa “những kẻ phạm tội” thành “tội phạm” để diễn đạt κακοῦργοι chính xác và tự nhiên hơn trong ngữ cảnh hình sự. Đưa “cũng” lên đầu câu để phản ánh rõ ý bổ sung của καί. Điều chỉnh hai chú thích để phân biệt nghĩa từ vựng với thông tin do ngữ cảnh cung cấp và để diễn đạt ἀναιρεθῆναι nhất quán với lựa chọn “bị xử tử”.
