  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: vi
  text: Cũng có hai người khác, là những tội phạm[a], đang bị dẫn đi cùng Ngài để bị xử tử[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những kẻ làm điều ác” hoặc “những kẻ bất lương”. Từ Hy Lạp chỉ những người làm điều sai trái; trong ngữ cảnh này, họ đang bị dẫn đi để chịu án tử.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “để bị đưa đến chỗ chết”. Động từ Hy Lạp nói đến việc bị tước mạng sống theo án, nhưng không nêu phương thức tại đây; ngữ cảnh cho biết họ bị đóng đinh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: đang bị dẫn đi
  rationale: Thể chưa hoàn thành bị động diễn tả hành động đang diễn tiến trong quá khứ; cách dịch này giữ được cả sắc thái tiếp diễn lẫn bị động.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Trong mạch kể chuyện, δέ nối tiếp nhẹ nhàng, còn καί thêm ý rằng ngoài Đức Giê-su còn có những người khác. Tiếng Việt diễn đạt tự nhiên ý này bằng “cũng” mà không cần dịch riêng từng liên từ.
- source_word: ἕτεροι ... δύο
  choice: hai người khác
  rationale: Diễn đạt rõ đây là hai người ngoài Đức Giê-su, đồng thời giữ đúng số lượng của nguyên văn.
- source_word: κακοῦργοι
  choice: những kẻ phạm tội
  rationale: Từ này chỉ những người làm điều xấu và trong ngữ cảnh đang chịu án hình sự. “Những kẻ phạm tội” vừa dễ hiểu vừa giữ được sắc thái đạo đức và pháp lý, không dùng từ cổ.
- source_word: σὺν αὐτῷ
  choice: cùng Ngài
  rationale: Giữ nghĩa đồng hành của σύν với cách diễn đạt gọn, tự nhiên trong tiếng Việt; “Ngài” phù hợp văn phong tôn kính khi nói về Đức Giê-su.
- source_word: ἀναιρεθῆναι
  choice: để bị xử tử
  rationale: Động từ nguyên mẫu bị động ở đây nói đến việc bị nhà chức trách giết theo bản án. “Bị xử tử” tự nhiên và chính xác, nhưng không đưa riêng phương thức đóng đinh vào câu.
theological_decisions:
- issue: Có nên dịch ἀναιρεθῆναι cụ thể là “bị đóng đinh” hay không
  choice: Dịch rộng hơn là “bị xử tử”.
  alternative: bị đóng đinh; bị giết
  rationale: Ngữ cảnh cho biết hình thức xử tử là đóng đinh, nhưng bản thân động từ ἀναιρέω không nêu phương thức. Bản dịch giữ phạm vi nghĩa của từ Hy Lạp thay vì đưa thông tin từ ngữ cảnh vào chính động từ.
- issue: Quan hệ giữa ἕτεροι và κακοῦργοι
  choice: “Hai người khác, là những kẻ phạm tội” xác định hai người kia là tội phạm mà không xếp Đức Giê-su vào cùng loại.
  alternative: hai tội phạm khác
  rationale: Cụm “hai tội phạm khác” trong tiếng Việt có thể bị hiểu rằng Đức Giê-su cũng là một tội phạm. Cấu trúc được chọn bảo toàn ý hai người khác ngoài Ngài, đồng thời nêu thân phận của họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự câu giữ “hai người khác” làm chủ đề, dùng “đang bị dẫn đi” để phản ánh thể chưa hoàn thành, và đặt cả hai ký hiệu chú thích ngay sau những cụm từ liên quan.
