revisions:
- from: Còn chúng ta chịu thế này là công bằng, vì chúng ta đang nhận điều xứng với những việc mình đã làm; nhưng người này chẳng làm điều gì sai trái.[a]
  to: Còn chúng ta thì bị phạt như vậy là đáng,[a] vì chúng ta đang nhận điều đáng phải chịu vì những việc chúng ta đã làm;[b] nhưng người này chẳng làm điều gì sai trái.[c]
  rationale: Bản sửa làm rõ ý án phạt là đáng chịu của δικαίως mà không thêm chi tiết lịch sử ngoài điều văn cảnh trực tiếp hàm ý. Cụm diễn đạt hậu quả được điều chỉnh để phản ánh thì hiện tại của ἀπολαμβάνομεν và cơ sở là các hành vi đã hoàn tất của ἐπράξαμεν. Các chú thích được đặt tại các điểm từ vựng tương ứng và không áp đặt cách hiểu tín lý.
  reviewer_model: gpt-5.6-terra
