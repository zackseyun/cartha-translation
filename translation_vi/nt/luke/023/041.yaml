  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: vi
  text: Còn chúng ta thì bị phạt như vậy là đáng,[a] vì chúng ta đang nhận điều đáng phải chịu vì những việc chúng ta đã làm;[b] nhưng người này chẳng làm điều gì sai trái.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “chúng ta chịu như vậy là chính đáng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “chúng ta đang nhận lấy những điều tương xứng với những gì chúng ta đã làm.”'
    reason: lexical_alternative
  - marker: c
    text: 'Hoặc: “người này chẳng làm điều gì không thích đáng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: là công bằng
  rationale: Diễn đạt tự nhiên ý trạng từ rằng hình phạt họ đang chịu là chính đáng và tương xứng.
- source_word: ἄξια ... ἀπολαμβάνομεν
  choice: đang nhận điều xứng với
  rationale: Giữ ý hậu quả đang được nhận là tương xứng với hành vi trước đó, đồng thời phản ánh thì hiện tại của ἀπολαμβάνομεν.
- source_word: ὧν ἐπράξαμεν
  choice: những việc mình đã làm
  rationale: Tái hiện rõ mệnh đề quan hệ và hành động đã xảy ra; “mình” tự nhiên khi người nói gộp bản thân với người cùng chịu án.
- source_word: οὗτος
  choice: người này
  rationale: Giữ lực chỉ định của đại từ và sự đối lập trực tiếp với hai người đang chịu hình phạt.
- source_word: οὐδὲν ἄτοπον
  choice: chẳng làm điều gì sai trái
  rationale: “Sai trái” truyền đạt nghĩa không đúng đắn hoặc không thích hợp trong bối cảnh xét xử, nhưng không thu hẹp quá mức thành một thuật ngữ pháp lý.
- source_word: ἔπραξεν
  choice: làm
  rationale: Động từ tiếng Việt tự nhiên trong cấu trúc phủ định này; ngữ cảnh đủ cho thấy lời nhận định bao quát những gì người ấy đã làm.
theological_decisions:
- issue: Lời người phạm tội khẳng định sự vô tội của Chúa Giê-su
  choice: nhưng người này chẳng làm điều gì sai trái
  alternative: nhưng người này chẳng làm điều gì không phải
  rationale: Bản dịch giữ nguyên lời chứng trực tiếp về sự vô tội trong hoàn cảnh hành hình, không mở rộng thành một khẳng định tín lý vượt quá câu chữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Còn… nhưng…” làm rõ thế đối chiếu μὲν…δέ; “chịu thế này” bổ sung tối thiểu điều được ngầm hiểu từ bối cảnh để câu tiếng Việt trọn nghĩa.
