- from: Bấy giờ là ngày Chuẩn Bị, và ngày Sa-bát đang bắt đầu.[a]
  to: Hôm ấy là ngày Chuẩn Bị, và ngày Sa-bát đang bắt đầu.[a]
  rationale: Sửa «Bấy giờ» thành «Hôm ấy» để diễn đạt tự nhiên hơn mệnh đề ἡμέρα ἦν παρασκευῆς, và giữ ký hiệu chú thích sau «đang bắt đầu» để neo chính xác vào động từ ἐπέφωσκεν. Không thay đổi ý nghĩa hay mức độ giải thích của bản dịch.
