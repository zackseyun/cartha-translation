  verdict: revise
  source_fidelity: 'Bản dịch chính truyền đạt đúng hai mệnh đề của nguyên văn: hôm ấy là ngày παρασκευή và ngày Sa-bát đang đi vào lúc khởi đầu. «Đang bắt đầu» là cách giải nghĩa theo ngữ cảnh phù hợp cho ἐπέφωσκεν, vốn theo nghĩa từ nguyên có hình ảnh ‘rạng/dawn’ nhưng ở đây chỉ sự khởi đầu của Sa-bát vào buổi tối.'
  naturalness: «Hôm ấy là ngày Chuẩn Bị» tự nhiên và gọn hơn «Bấy giờ là ngày Chuẩn Bị». «Ngày Sa-bát đang bắt đầu» là tiếng Việt hiện đại, trang trọng và tránh gợi ý sai rằng đây là lúc bình minh.
  terminology: «Ngày Chuẩn Bị» bảo lưu cách gọi lịch Do Thái của παρασκευή mà không thay bằng cách diễn giải «thứ Sáu»; «Sa-bát» là thuật ngữ quen thuộc và nhất quán. Dấu chú thích cần đặt ngay sau «Chuẩn Bị», là từ/cụm từ mà chú thích đang giải thích.
