  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: vi
  text: Hôm ấy là ngày Chuẩn Bị, và ngày Sa-bát đang bắt đầu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: «ngày Sa-bát đang rạng». Động từ Hy Lạp có thể mang nghĩa «đang rạng» hoặc «đang bắt đầu»; trong ngữ cảnh này, từ ấy chỉ lúc ngày Sa-bát bắt đầu vào buổi tối.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: ngày Chuẩn Bị
  rationale: Trong cách dùng Hy Lạp của người Do Thái, παρασκευή thường chỉ ngày chuẩn bị trước ngày Sa-bát. Viết hoa «Chuẩn Bị» cho thấy đây là tên gọi quen thuộc của ngày ấy, đồng thời giữ được nghĩa từ vựng thay vì thay bằng «thứ Sáu».
- source_word: σάββατον
  choice: ngày Sa-bát
  rationale: Ngữ cảnh xác định đây là ngày Sa-bát hằng tuần. Thêm «ngày» làm câu tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἐπέφωσκεν
  choice: đang bắt đầu
  rationale: Động từ có thể mang nghĩa đen là «đang rạng» hoặc nghĩa theo ngữ cảnh là «đang bắt đầu». Vì ngày Sa-bát khởi đầu vào buổi tối, «đang bắt đầu» truyền đạt đúng quan hệ thời gian mà không khiến độc giả tưởng đây là bình minh; nghĩa sát chữ được giữ trong chú thích.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Bấy giờ là ngày Chuẩn Bị
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt, vẫn giữ ý nghĩa của cấu trúc Hy Lạp và chức năng chỉ thời điểm trong mạch kể.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ nối hai mệnh đề để phản ánh lối phối hợp trong lời kể của Lu-ca; καὶ mở đầu được diễn đạt bằng «Bấy giờ» cho tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἐπέφωσκεν liên quan đến lúc ngày Sa-bát khởi đầu
  choice: Câu này nói ngày Sa-bát đang bắt đầu vào buổi tối.
  alternative: ngày Sa-bát đang rạng
  rationale: Theo cách tính ngày từ chiều tối đến chiều tối của người Do Thái và theo bối cảnh chôn cất trước kỳ nghỉ Sa-bát, câu không nói đến bình minh buổi sáng. Bản dịch chính dùng «đang bắt đầu», còn chú thích bảo tồn hình ảnh và khả năng dịch sát chữ của động từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. «Ngày Chuẩn Bị» được dùng như một tên gọi theo lịch Do Thái; «Sa-bát» là dạng phiên âm quen thuộc. Chú thích bảo tồn cách nói giàu hình ảnh của nguyên văn mà không gây nhầm lẫn về thời điểm trong ngày.
