source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: vi
  text: 'Đức Giê-su kêu lớn tiếng: “Lạy Cha, con phó thác thần trí con trong tay Cha.”[a] Nói xong lời ấy, Ngài trút hơi thở cuối cùng.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lời này gợi lại Thi Thiên 31:5 trong bản Kinh Thánh Hy Lạp: “Con phó thác thần trí con trong tay Ngài.” “Phó thác” cũng có thể dịch là “giao phó” hoặc “giao cho chăm nom.”'
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Ngài tắt thở,” “Ngài chết,” hoặc “Ngài qua đời”; theo nghĩa đen, động từ Hy Lạp nói đến việc thở ra.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: kêu lớn
  rationale: Diễn đạt tự nhiên trong tiếng Việt hành động cất tiếng mạnh và rõ; tránh lối dịch nặng nề “kêu bằng một tiếng lớn”.
- source_word: Πάτερ
  choice: Lạy Cha
  rationale: Hô cách trực tiếp được chuyển bằng “Lạy” theo lối xưng hô trang trọng, tự nhiên trong lời cầu nguyện; không thêm từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: εἰς χεῖράς σου
  choice: vào tay Cha
  rationale: Tiếng Hy Lạp dùng số nhiều, nhưng tiếng Việt tự nhiên dùng danh từ khái quát “tay” trong thành ngữ phó thác vào sự chăm nom của ai; đại từ “Cha” giữ đúng quan hệ xưng hô trong lời nói.
- source_word: παρατίθεμαι
  choice: con xin phó thác
  rationale: Động từ trung cách diễn tả việc chủ động giao điều quý báu cho người khác gìn giữ. “Phó thác” giữ sắc thái tin cậy; “xin” làm câu cầu nguyện tự nhiên mà không biến nó thành một lời xin phép.
- source_word: τὸ πνεῦμά μου
  choice: tâm linh con
  rationale: “Tâm linh” phân biệt πνεῦμα với hơi thở sinh lý trong mệnh đề kế tiếp, đồng thời giữ chiều sâu của việc Đức Giê-su ý thức phó mình cho Cha mà không áp đặt một hệ thống thần học về bản tính con người.
- source_word: τοῦτο δὲ εἰπών
  choice: Nói xong lời ấy
  rationale: Chuyển tự nhiên phân từ bất định chỉ hành động hoàn tất trước động từ chính.
- source_word: ἐξέπνευσεν
  choice: Ngài trút hơi thở cuối cùng
  rationale: Thành ngữ tiếng Việt rõ nghĩa là qua đời, đồng thời giữ được hình ảnh thở ra vốn có trong động từ Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của τὸ πνεῦμά μου trong lời cuối của Đức Giê-su
  choice: tâm linh con
  alternative: hơi thở của con; linh hồn con
  rationale: Ngữ cảnh là lời có ý thức phó mình cho Cha, nên “tâm linh” phù hợp hơn cách hiểu thuần sinh lý “hơi thở”. Cũng tránh dùng “linh hồn”, vốn có thể thu hẹp nghĩa và đưa vào những phân biệt nhân học không được câu này trình bày.
- issue: Lực diễn đạt của παρατίθεμαι ở thì hiện tại, trung cách
  choice: con xin phó thác
  alternative: con đang phó thác; con giao phó
  rationale: Cách dịch này thể hiện lời tuyên bố mang tính thực hiện ngay trong lúc nói và sắc thái tự nguyện giao mình cho Cha, nhưng không giải quyết quá mức ý nghĩa thần học của hành động ấy.
- issue: Liên hệ với Thi Thiên 31:5 theo bản Hy Lạp
  choice: giữ ngôn ngữ “vào tay Cha” và “phó thác”
  alternative: diễn ý hoàn toàn là “xin Cha gìn giữ sự sống con”
  rationale: Giữ tiếng vọng Kinh Thánh trong lời nói của Đức Giê-su mà không cần đưa lời dẫn chiếu vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “Đức Giê-su” trong lời kể, “Ngài” để nối chủ thể, và cặp xưng hô “Cha–con” trong lời cầu nguyện. Chính văn giữ nhịp ngắn, mạnh của câu Hy Lạp và đặt mọi ký hiệu chú thích [a], [b] tại vị trí liên quan.
