  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: vi
  text: mặt trời không còn chiếu sáng[a], và bức màn trong đền thờ[b] bị xé chính giữa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mặt trời tối đi.” Động từ Hy Lạp có thể mang nghĩa ánh sáng ngừng hoặc mất đi; dịch là “xảy ra nhật thực” sẽ cụ thể hơn điều nguyên văn đòi hỏi.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “màn che của thánh điện.” Từ Hy Lạp có thể chỉ phần thánh điện của đền thờ.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “bị xé dọc chính giữa” hoặc “bị xé làm đôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: mặt trời không còn chiếu sáng
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh đi kèm. ἐκλείπω có nghĩa là ngừng, mất đi hoặc không còn tác dụng; trong ngữ cảnh về mặt trời, cách dịch này tự nhiên và không ấn định cơ chế thiên văn như “nhật thực”.
- source_word: ἐσχίσθη
  choice: bị xé
  rationale: Thể bị động aorist của σχίζω; “bị xé” là cách nói tự nhiên đối với một bức màn và giữ nguyên thể bị động của nguyên văn.
- source_word: δὲ
  choice: và
  rationale: δέ là liên từ chuyển tiếp nhẹ ở đây; “và” nối hai sự việc tự nhiên mà không tạo sắc thái tương phản quá mạnh.
- source_word: τὸ καταπέτασμα
  choice: bức màn
  rationale: καταπέτασμα chỉ tấm màn ngăn trong đền thờ. “Bức màn” là từ hiện đại, dễ hiểu; “màn che” được ghi nhận như một khả năng khác.
- source_word: τοῦ ναοῦ
  choice: trong đền thờ
  rationale: ναός ở đây có thể chỉ phần thánh điện của đền thờ. Tiếng Việt tự nhiên dùng “bức màn trong đền thờ”; chú thích bảo lưu sắc thái cụ thể hơn của từ Hy Lạp.
- source_word: μέσον
  choice: chính giữa
  rationale: μέσον xác định vị trí hoặc đường xé ở giữa. “Chính giữa” bám sát nguyên văn hơn “xé làm đôi”, vốn nêu rõ kết quả hơn mức từ Hy Lạp trực tiếp nói.
theological_decisions:
- issue: Ý nghĩa của ἐκλιπόντος khi nói về mặt trời
  choice: Dịch không theo thuật ngữ thiên văn là “mặt trời không còn chiếu sáng”.
  alternative: mặt trời tối đi; xảy ra nhật thực
  rationale: Bản văn mô tả ánh sáng mặt trời không còn trong biến cố Chúa Giê-su chịu chết, nhưng động từ Hy Lạp không buộc phải hiểu là một hiện tượng nhật thực theo nghĩa kỹ thuật. Cách dịch được chọn giữ sự kiện mà không áp đặt lời giải thích khoa học.
- issue: Cách dịch καταπέτασμα τοῦ ναοῦ
  choice: bức màn trong đền thờ
  alternative: màn che của thánh điện
  rationale: Cách chính văn dễ hiểu đối với độc giả hiện đại, đồng thời chú thích bảo lưu khả năng ναός nói cụ thể đến thánh điện chứ không phải toàn bộ khuôn viên đền thờ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc gồm một mệnh đề hoàn cảnh và một mệnh đề chính, nhưng điều chỉnh trật tự từ cho tự nhiên. Không dùng “nhật thực” vì quá chuyên biệt; không dùng thuật ngữ giáo hội cổ nếu không cần thiết.
