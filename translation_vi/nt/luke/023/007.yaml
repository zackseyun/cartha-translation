source:
  edition: SBLGNT
  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: vi
  text: Khi biết Đức Giê-su thuộc thẩm quyền của Hê-rốt[a], Phi-lát sai Người đến Hê-rốt; chính Hê-rốt cũng đang ở Giê-ru-sa-lem trong những ngày ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc quyền tài phán của Hê-rốt” hoặc “thuộc quyền cai quản của Hê-rốt.” Cụm từ Hy Lạp chỉ phạm vi cai trị hoặc thẩm quyền pháp lý của Hê-rốt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Khi biết
  rationale: Phân từ bất định quá khứ diễn tả việc nhận biết xảy ra trước hành động chính; cách dịch này tự nhiên và giữ rõ quan hệ thời gian.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Đức Giê-su thuộc thẩm quyền xét xử của Hê-rốt
  rationale: Trong ngữ cảnh tố tụng, ἐξουσία chỉ phạm vi cai quản hoặc quyền tài phán của Hê-rốt. “Thẩm quyền xét xử” truyền đạt rõ sắc thái pháp lý-hành chính mà không hiểu ἐξουσία theo nghĩa thần học.
- source_word: ἀνέπεμψεν αὐτὸν
  choice: Phi-lát sai giải Người
  rationale: Động từ có thể chỉ việc chuyển một người hoặc vụ việc đến cấp có thẩm quyền. “Sai giải” hợp với bối cảnh một bị cáo đang bị giam giữ, đồng thời vẫn tránh thuật ngữ pháp lý quá chuyên biệt.
- source_word: πρὸς Ἡρῴδην
  choice: đến Hê-rốt
  rationale: πρός với đối cách diễn tả sự chuyển đến một người.
- source_word: ὄντα καὶ αὐτὸν
  choice: chính Hê-rốt cũng đang ở
  rationale: Giữ được cả ý bổ sung của καί và sắc thái nhấn mạnh của αὐτόν.
- source_word: ἐν Ἱεροσολύμοις
  choice: ở Giê-ru-sa-lem
  rationale: Dạng tên riêng quen dùng trong tiếng Việt hiện đại.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: lúc ấy
  rationale: Diễn đạt tự nhiên điểm quy chiếu thời gian của lời kể; nghĩa đen là “trong những ngày ấy/này”.
theological_decisions:
- issue: Nghĩa chính trị-pháp lý của ἐξουσία liên quan đến Hê-rốt
  choice: thẩm quyền xét xử
  alternative: quyền cai quản; phạm vi tài phán
  rationale: Mạch văn nói đến việc Phi-lát xác định thẩm quyền của Hê-rốt đối với Đức Giê-su theo miền xuất thân. Cách dịch giữ nghĩa hành chính-pháp lý, không đưa thêm nội hàm thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Dùng “Đức Giê-su”, “Phi-lát”, “Hê-rốt” để làm rõ các đại từ vốn có chủ thể từ ngữ cảnh. Viết hoa “Người” theo thông lệ văn phong Kinh Thánh tiếng Việt, nhưng không dùng cách viết hoa này để giải quyết một điểm mơ hồ thần học.
