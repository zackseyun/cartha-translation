  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: vi
  text: Nhưng tất cả những người quen của Ngài[a], cùng những phụ nữ đã theo Ngài từ Ga-li-lê, đều đứng từ xa, nhìn những việc ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tất cả những người quen biết Ngài.” Từ Hy Lạp γνωστοί có thể chỉ những người quen hay những người có quan hệ quen biết với một người.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: đều đứng
  rationale: Diễn tả tư thế kéo dài trong khung cảnh; tiếng Việt tự nhiên không cần thêm dấu hiệu hình thái tương đương với quá khứ tiếp diễn.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với cảnh ngay trước đó.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: tất cả những người quen biết Ngài
  rationale: Giữ nghĩa rộng của γνωστοί là những người có quen biết với Ngài, không thu hẹp thành bạn hữu thân thiết.
- source_word: μακρόθεν
  choice: từ xa
  rationale: Cách nói tự nhiên, rõ nghĩa trong tiếng Việt để chỉ khoảng cách không gian.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: những phụ nữ đã theo Ngài
  rationale: Nhận diện một nhóm phụ nữ cụ thể qua việc họ đã đồng hành với Chúa Giê-su; 'đã theo' thể hiện hành động có trước cảnh đang thuật.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: từ Ga-li-lê
  rationale: Chỉ nơi khởi đầu của việc họ theo Ngài.
- source_word: ὁρῶσαι ταῦτα
  choice: nhìn những việc ấy
  rationale: Giữ ý họ trực tiếp quan sát các sự việc đang diễn ra và bảo toàn số nhiều của ταῦτα.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su; giữ cấu trúc hai nhóm nhân chứng và sắc thái họ đứng quan sát từ xa.
