revisions:
- from: Nhưng tất cả những người quen biết Ngài[a], cùng những phụ nữ đã theo Ngài từ Ga-li-lê, đều đứng từ xa nhìn những việc ấy.
  to: Nhưng tất cả những người quen của Ngài[a], cùng những phụ nữ đã theo Ngài từ Ga-li-lê, đều đứng từ xa, nhìn những việc ấy.
  rationale: Đổi sang “những người quen của Ngài” để truyền đạt tự nhiên danh từ γνωστοί trong tiếng Việt mà vẫn giữ phạm vi rộng, không mặc nhiên hiểu là bạn thân. Chỉnh chú thích để giải thích đúng hướng nghĩa của từ Hy Lạp. Dấu phẩy trước “nhìn những việc ấy” làm rõ đây là hành động đồng thời của cả hai nhóm.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:51Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng hai nhóm người quan sát, tư thế đứng ở xa, và hành động chứng kiến các sự việc. Tuy nhiên, “những người quen biết Ngài” dễ được hiểu là “những người biết Ngài” theo nghĩa động từ, trong khi οἱ γνωστοὶ αὐτῷ ở đây tự nhiên hơn là “những người quen của Ngài”/“người quen biết Ngài.”
  naturalness: Câu nhìn chung tự nhiên trong tiếng Việt hiện đại. Thêm dấu phẩy trước phân từ kết quả/đồng thời “nhìn” làm quan hệ với hành động “đứng” rõ và trôi chảy hơn.
  terminology: “Ngài,” “phụ nữ,” và “Ga-li-lê” phù hợp văn phong trang trọng của bản dịch. Chú thích hiện có đảo chiều một phần sắc thái từ vựng khi nói γνωστοί là “những người được một người biết đến”; cần diễn đạt đây là những người có quen biết với ai đó, tức những người quen/quen biết của người ấy.
  issues:
  - severity: low
    issue: Cụm “những người quen biết Ngài” có thể mơ hồ về chức năng từ loại.
    rationale: Cách nói này có thể được đọc như một mệnh đề quan hệ “những người [đã] quen biết Ngài.” Dùng danh ngữ “những người quen của Ngài” phản ánh trực tiếp và tự nhiên hơn οἱ γνωστοὶ αὐτῷ mà không hàm ý họ là bạn thân.
  - severity: low
    issue: Nội dung chú thích mô tả γνωστοί chưa chính xác hoàn toàn.
    rationale: Trong ngữ cảnh này, γνωστοί chỉ những người quen hay người có quan hệ quen biết với Ngài; diễn đạt “người được một người biết đến” có thể gợi nghĩa bị động không cần thiết.
