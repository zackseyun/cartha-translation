  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: vi
  text: 'Nhưng Giê-su quay lại phía họ và nói: “Hỡi các con gái Giê-ru-sa-lem[a], đừng khóc thương tôi; trái lại, hãy khóc thương chính mình và con cái mình.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hỡi những phụ nữ Giê-ru-sa-lem.” Nguyên văn Hy Lạp là “các con gái Giê-ru-sa-lem,” một lối xưng hô mang âm hưởng tiên tri được giữ lại trong bản văn chính.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Nhưng Đức Chúa Jêsus quay lại phía họ
  rationale: Diễn đạt tự nhiên hành động Đức Chúa Jêsus đổi hướng về phía những phụ nữ, đồng thời δέ tạo một chuyển ý tương phản nhẹ.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Hỡi các con gái của Giê-ru-sa-lem
  rationale: Giữ hình ảnh thân tộc theo nguyên văn và âm hưởng của lối xưng hô tiên tri, thay vì giản lược thành “phụ nữ Giê-ru-sa-lem”.
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: đừng khóc thương tôi
  rationale: “Khóc thương” diễn đạt rõ việc than khóc vì một người; “đừng” không quyết định quá mức rằng mệnh lệnh nhất thiết có nghĩa là phải ngừng một hành động đang diễn ra.
- source_word: πλὴν
  choice: trái lại
  rationale: 'Nêu bật sự chỉnh hướng tương phản: không khóc thương Đức Chúa Jêsus mà hãy khóc thương chính họ và con cái họ.'
- source_word: ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν
  choice: hãy khóc thương chính mình và con cái mình
  rationale: Giữ sự song song với vế trước, làm rõ đại từ phản thân, và dùng cách nói hiện đại, dễ hiểu.
theological_decisions:
- issue: Cách dịch lời xưng hô Θυγατέρες Ἰερουσαλήμ
  choice: Hỡi các con gái của Giê-ru-sa-lem
  alternative: Hỡi những phụ nữ Giê-ru-sa-lem
  rationale: Bản chính giữ lối nói theo nghĩa đen để bảo toàn âm hưởng tiên tri và cộng đồng giao ước trong cách diễn đạt Kinh Thánh, nhưng chú thích cung cấp cách hiểu tự nhiên theo đối tượng được gọi.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “Hỡi” để đánh dấu lời gọi trực tiếp có sắc thái Kinh Thánh; “khóc thương” thích hợp hơn “khóc” vì ἐπί chỉ đối tượng hoặc nguyên cớ của sự than khóc.
