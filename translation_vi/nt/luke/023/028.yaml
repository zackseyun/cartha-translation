revisions:
- from: 'Nhưng Đức Chúa Jêsus quay lại phía họ và nói: “Hỡi các con gái của Giê-ru-sa-lem[a], đừng khóc thương tôi; trái lại, hãy khóc thương chính mình và con cái mình.”'
  to: 'Nhưng Giê-su quay lại phía họ và nói: “Hỡi các con gái Giê-ru-sa-lem[a], đừng khóc thương tôi; trái lại, hãy khóc thương chính mình và con cái mình.”'
  rationale: Bản sửa bỏ tước hiệu không có trong nguyên văn, chuẩn hóa tên “Giê-su,” và giữ nguyên các lựa chọn sát nghĩa còn lại, kể cả lối xưng hô theo nghĩa đen cùng chú thích về cách hiểu tự nhiên hơn.
