  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố của câu Hy Lạp: Hê-rốt cùng quân lính khinh miệt và chế nhạo Đức Giê-su, khoác cho Ngài y phục lộng lẫy, rồi gửi Ngài trở lại Phi-lát. “cũng” phản ánh thích đáng καὶ gắn với chủ ngữ Hê-rốt; “trở lại” bảo toàn sắc thái ἀνέπεμψεν trong bối cảnh thủ tục xét xử.'
  naturalness: Câu văn hiện đại, rõ ràng và giữ được giọng trang trọng của trình thuật Thương khó. Việc lặp tên Hê-rốt ở câu hai giúp chủ thể của hành động cuối không mơ hồ. “cho đưa Ngài trở lại với Phi-lát” là cách nói chấp nhận được trong tiếng Việt hiện đại.
  terminology: Tên riêng “Hê-rốt,” “Đức Giê-su,” và “Phi-lát” nhất quán với lối phiên âm Kinh Thánh tiếng Việt. “khinh miệt,” “chế nhạo,” và “y phục lộng lẫy” phù hợp về ngữ nghĩa và thanh điệu. Chú thích bảo tồn các khả năng nghĩa của λαμπράν mà không áp đặt diễn giải biểu tượng.
