id: LUK.23.11
reference: Luke 23:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: vi
  text: Nhưng Hê-rốt cùng quân lính của mình cũng khinh miệt và chế nhạo Đức Giê-su. Sau khi khoác cho Ngài một bộ y phục lộng lẫy[a], Hê-rốt cho đưa Ngài trở lại với Phi-lát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một chiếc áo choàng lộng lẫy”; λαμπρά cũng có thể mang nghĩa “sáng chói”. Bộ y phục này có lẽ góp phần vào việc chế nhạo bằng cách tạo cho Đức Giê-su vẻ được tôn kính giả tạo.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: khinh miệt
  rationale: Diễn tả việc coi một người là không đáng kể và đối xử với người ấy bằng thái độ khinh thường; “khinh miệt” ngắn gọn, tự nhiên và phù hợp với cảnh sỉ nhục công khai.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: cùng quân lính của mình
  rationale: στράτευμα có thể chỉ binh lính hoặc quân đội; “quân lính” rõ nghĩa và hợp với bối cảnh tường thuật.
- source_word: ἐμπαίξας
  choice: chế nhạo
  rationale: Chuyển tải trực tiếp hành động nhạo báng, đồng thời giữ giọng văn trang trọng.
- source_word: περιβαλὼν
  choice: khoác cho
  rationale: Diễn đạt tự nhiên hành động đặt hoặc mặc y phục lên người khác.
- source_word: ἐσθῆτα λαμπρὰν
  choice: một bộ y phục lộng lẫy
  rationale: ἐσθής chỉ y phục, còn λαμπρός có thể mang nghĩa sáng chói, lộng lẫy hoặc tráng lệ. Cách dịch này không xác định quá mức rằng đó nhất thiết là một áo choàng, đồng thời giữ được sắc thái danh dự giả tạo trong màn chế nhạo.
- source_word: ἀνέπεμψεν
  choice: cho đưa ... trở lại
  rationale: Trong bối cảnh xét xử, động từ chỉ việc chuyển trả Đức Giê-su về cho nhà chức trách trước đó; cách diễn đạt này tự nhiên và không thêm chi tiết về phương thức áp giải.
- source_word: τῷ Πιλάτῳ
  choice: với Phi-lát
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt; giới từ “với” sau “trở lại” diễn đạt đích đến là Phi-lát một cách tự nhiên.
theological_decisions:
- issue: Ý nghĩa của bộ y phục trong hành động chế nhạo của Hê-rốt
  choice: Giữ cách diễn đạt rộng là “một bộ y phục lộng lẫy”, qua đó bảo tồn sắc thái mỉa mai của sự tôn kính giả tạo mà không giải thích biểu tượng ngay trong câu.
  alternative: Dịch cụ thể là “áo choàng hoàng gia”, hoặc hiểu y phục chủ yếu như dấu hiệu của sự điên dại hay phù phiếm.
  rationale: Ngữ cảnh nói rõ sự khinh miệt và chế nhạo, nên y phục lộng lẫy rất có thể là một phần của hành động ấy. Tuy nhiên, tiếng Hy Lạp không gọi cụ thể đây là áo bào hoàng gia và cũng không giải thích biểu tượng của nó; vì vậy bản dịch không nên quyết định thay cho người đọc.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối tường thuật kính trọng phổ biến; lặp lại “Hê-rốt” ở mệnh đề cuối để tránh mơ hồ về chủ thể. Hư từ “cũng” phản ánh καὶ đi cùng chủ thể ὁ Ἡρῴδης.
