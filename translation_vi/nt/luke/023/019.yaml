  text: ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον ⸂βληθεὶς ἐν τῇ φυλακῇ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: vi
  text: người đã bị tống vào tù vì một cuộc nổi dậy xảy ra trong thành[a] và vì tội giết người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cuộc bạo loạn” hoặc “cuộc phản loạn.” Từ Hy Lạp στάσις có thể chỉ một cuộc nổi dậy, bạo loạn hay phản loạn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: người
  rationale: Đại từ quan hệ chỉ cụ thể Ba-ra-ba; trong mạch câu tiếng Việt, “người” nối tự nhiên với câu trước.
- source_word: διὰ
  choice: vì
  rationale: Với đối cách, giới từ này nêu nguyên nhân; “vì” diễn đạt rõ lý do ông bị bỏ tù và kết hợp tự nhiên với cả hai tội danh.
- source_word: στάσιν τινὰ
  choice: một cuộc nổi dậy
  rationale: στάσις chỉ một vụ biến động hoặc chống đối có tính bạo lực; “nổi dậy” dễ hiểu và vẫn giữ sắc thái chính trị. Mạo từ “một” chuyển tải tính bất định của τινά.
- source_word: γενομένην ἐν τῇ πόλει
  choice: xảy ra trong thành
  rationale: Diễn đạt rõ ý của phân từ γενομένην mà không tự ý xác định thành này là Giê-ru-sa-lem.
- source_word: φόνον
  choice: tội giết người
  rationale: φόνος trong bối cảnh tư pháp nói đến hành vi giết người mang tính phạm tội; thêm “tội” giúp câu tiếng Việt rõ và tự nhiên.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: đã bị tống vào tù
  rationale: “Tống vào tù” giữ được sức mạnh của động từ βάλλω ở thể bị động, đồng thời là cách nói hiện đại, tự nhiên.
