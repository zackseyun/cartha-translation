  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: vi
  text: 'Nhưng họ cứ gào lên: “Đóng đinh, đóng đinh hắn!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, diễn rõ hơn: “Hành quyết hắn trên thập tự giá, hành quyết hắn trên thập tự giá!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng họ
  rationale: Đại từ hóa οἱ theo ngữ cảnh là đám đông đã được nhắc đến; δέ đánh dấu sự tương phản với lời Phi-lát vừa nói.
- source_word: ἐπεφώνουν
  choice: cứ gào lên
  rationale: Thì chưa hoàn thành diễn tả tiếng kêu kéo dài hoặc lặp đi lặp lại; ἐπιφωνέω chỉ việc lớn tiếng kêu, nên “cứ gào lên” vừa tự nhiên vừa giữ được sắc thái mãnh liệt.
- source_word: λέγοντες
  choice: dấu hai chấm trước lời hô trực tiếp
  rationale: Phân từ đồng thời giới thiệu nội dung tiếng hô. Trong tiếng Việt, dấu hai chấm tự nhiên hơn việc dịch máy móc là “nói rằng”.
- source_word: Σταύρου σταύρου
  choice: Đóng đinh hắn vào thập tự giá! Đóng đinh hắn vào thập tự giá!
  rationale: Mệnh lệnh được lặp lại để nhấn mạnh sự thúc ép. Cách diễn đạt này nói rõ hình thức hành quyết vốn nằm trong nghĩa của σταυρόω và phù hợp với tiếng Việt hiện đại.
- source_word: αὐτόν
  choice: hắn
  rationale: Đại từ đối cách làm tân ngữ của mệnh lệnh. “Hắn” tự nhiên trong lời hô thù nghịch của đám đông và không thêm danh tính ngoài nguyên văn.
theological_decisions:
- issue: Cách dịch yêu cầu hành quyết σταύρου
  choice: Đóng đinh hắn vào thập tự giá
  alternative: Đóng đinh hắn
  rationale: σταυρόω chỉ việc hành quyết bằng cách đóng trên thập tự giá. Bản dịch chính diễn đạt rõ nghĩa từ vựng mà không thêm cách giải thích thần học; phương án ngắn hơn được ghi ở chú thích vì cũng là cách nói quen thuộc trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng trực tiếp. “Cứ gào lên” giữ sắc thái tiếp diễn và cường độ của động từ; lời hô được lặp trọn vẹn để tự nhiên trong tiếng Việt. Dùng “thập tự giá” thay vì từ cổ hoặc cách nói mang tính giáo phái.
