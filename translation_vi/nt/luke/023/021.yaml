review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được sắc thái tiếp diễn/lặp lại của ἐπεφώνουν qua “cứ gào lên” và giữ được mệnh lệnh lặp lại. Tuy nhiên, bản chính triển khai “σταύρου” thành “Đóng đinh hắn vào thập tự giá” ở cả hai vế, trong khi nguyên văn chỉ lặp động từ và đặt αὐτόν sau lần mệnh lệnh thứ hai. Cách dịch ngắn gọn “Đóng đinh, đóng đinh hắn!” phản ánh cấu trúc và độ cô đọng của tiếng Hy Lạp tốt hơn; nghĩa hành quyết trên thập tự giá nên được nêu trong chú thích từ vựng.
  naturalness: “Cứ gào lên” tự nhiên, giàu cường độ và phù hợp với lời hô của đám đông. “Đóng đinh, đóng đinh hắn!” là lời hô trực tiếp, tự nhiên trong văn cảnh, đồng thời tránh sự dài dòng khi lặp nguyên cụm “vào thập tự giá”.
  terminology: “Đóng đinh” là cách dịch Kinh Thánh Việt ngữ quen thuộc cho σταυρόω trong ngữ cảnh này. Chú thích nên làm rõ đây là hành quyết trên thập tự giá, thay vì xem cách dịch ngắn là một phương án phụ kém rõ nghĩa. “Hắn” có thể giữ, vì lời hô mang tính thù nghịch; bản thân đại từ Hy Lạp không xác định mức độ khinh miệt.
