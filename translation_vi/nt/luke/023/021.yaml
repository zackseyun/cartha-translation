    rationale: σταύρου được lặp lại, còn αὐτόν chỉ xuất hiện một lần sau lần thứ hai. “Đóng đinh, đóng đinh hắn!” bảo toàn tốt hơn nhịp cú pháp và sự cô đọng của nguyên văn; chi tiết “trên thập tự giá” thích hợp ở chú thích.
