  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: vi
  text: Bấy giờ, Phi-lát triệu tập các thầy tế lễ cả, các nhà lãnh đạo và dân chúng,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng phiên âm tên riêng Hy Lạp quen thuộc trong tiếng Việt.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu bước chuyển nhẹ trong mạch kể và đưa câu chuyện trở lại hành động của Phi-lát; tự nhiên hơn trong tiếng Việt so với một từ nối mang sắc thái đối lập mạnh.
- source_word: συγκαλεσάμενος
  choice: triệu tập
  rationale: Diễn đạt hành động gọi nhiều nhóm người đến họp; trong tiếng Việt, động từ hữu hạn này tự nhiên và vẫn giữ quan hệ thời gian trước hành động sẽ tiếp nối ở câu sau.
- source_word: ἀρχιερεῖς
  choice: các thầy tế lễ cả
  rationale: Chỉ giới lãnh đạo tư tế, không hàm ý có nhiều người đồng thời giữ chức thượng tế duy nhất; đây là cách gọi Kinh Thánh quen thuộc và chính xác.
- source_word: ἄρχοντας
  choice: các nhà lãnh đạo
  rationale: Chỉ những người có vị thế cai quản hoặc lãnh đạo; cách dịch này tự nhiên trong tiếng Việt và không thu hẹp họ vào một chức danh chính quyền cụ thể.
- source_word: λαὸν
  choice: dân chúng
  rationale: Giữ nghĩa tập thể của λαός, rộng hơn một đám đông nhất thời nhưng tự nhiên trong bối cảnh những người hiện diện.
