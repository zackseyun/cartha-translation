  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: vi
  text: Nhưng Phi-lát lại ngỏ lời với họ, muốn thả Giê-su[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lại nói với họ.”'
    reason: Động từ προσφωνέω có nghĩa là ngỏ lời hoặc nói với ai; từ này không nhất thiết hàm ý gọi lớn.
lexical_decisions:
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả hành động được lặp lại, tự nhiên và gọn trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản nhẹ với phản ứng trước đó của đám đông.
- source_word: ὁ Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng phiên âm quen thuộc của tên riêng trong truyền thống Kinh Thánh tiếng Việt.
- source_word: προσεφώνησεν
  choice: lên tiếng với họ
  rationale: Động từ có thể chỉ việc gọi lớn hoặc ngỏ lời với người khác; cách dịch này hợp với bối cảnh công khai mà không khẳng định quá mức âm lượng.
- source_word: θέλων
  choice: vì muốn
  rationale: Diễn đạt ý muốn của Phi-lát đồng thời nêu rõ quan hệ hoàn cảnh với hành động chính.
- source_word: ἀπολῦσαι
  choice: thả
  rationale: Phù hợp với ngữ cảnh pháp lý và giam giữ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸν Ἰησοῦν
  choice: Đức Chúa Jêsus
  rationale: Dùng tên gọi kính trọng và dạng tên quen thuộc theo quy ước bản dịch.
