source:
  edition: SBLGNT
  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: vi
  text: 'Nhưng Đức Giê-su đang nói[a]: “Lạy Cha, xin tha thứ cho họ, vì họ không biết mình đang làm gì.” Họ bắt thăm để chia y phục của Người.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản không có câu: “Lạy Cha, xin tha thứ cho họ, vì họ không biết mình đang làm gì.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: vẫn nói
  rationale: Thì chưa hoàn thành diễn tả lời nói đang tiếp diễn hoặc được lặp lại; “vẫn nói” giữ được sắc thái này tự nhiên hơn “đã nói” trong tiếng Việt.
- source_word: Πάτερ
  choice: Lạy Cha
  rationale: Hô cách trực tiếp được diễn đạt tự nhiên bằng “Lạy Cha”, không thêm đại từ sở hữu vốn không có trong tiếng Hy Lạp.
- source_word: ἄφες
  choice: xin tha
  rationale: Trong lời cầu nguyện với Đức Chúa Trời về những người xúc phạm, nghĩa phù hợp là tha thứ; “xin” thể hiện tự nhiên sắc thái lời cầu xin của mệnh lệnh cách.
- source_word: αὐτοῖς
  choice: họ
  rationale: Đại từ Hy Lạp không xác định rõ nhóm người nào; “họ” giữ nguyên sự không xác định ấy.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: vì họ không biết mình đang làm gì
  rationale: “Biết” chuyển trực tiếp nghĩa của οἴδασιν, còn “đang làm” phản ánh thể hiện tại của ποιοῦσιν trong ngữ cảnh.
- source_word: διαμεριζόμενοι
  choice: chia
  rationale: Diễn đạt rõ và tự nhiên hành động chia áo xống của Đức Chúa Jêsus.
- source_word: ἱμάτια
  choice: áo xống
  rationale: Chỉ các món y phục nói chung; “áo xống” có sắc thái trang trọng vừa phải và dễ hiểu trong văn kể Kinh Thánh.
- source_word: ἔβαλον κλήρους
  choice: bắt thăm
  rationale: Đây là thành ngữ tiếng Việt tự nhiên cho tập tục dùng thăm để quyết định phần thuộc về mỗi người.
- source_word: δὲ
  choice: Nhưng / Rồi
  rationale: Từ nối thứ nhất đánh dấu sự chuyển ý nhẹ, còn từ thứ hai tiếp tục diễn tiến câu chuyện; cách dịch biến đổi theo ngữ cảnh giúp câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Tính nguyên thủy của lời “Lạy Cha, xin tha cho họ, vì họ không biết mình đang làm gì”
  choice: Giữ trong chính văn
  alternative: Một số thủ bản không có lời này
  rationale: SBLGNT in mệnh đề trong chính văn nhưng đánh dấu là một biến thể văn bản đáng kể. Bản dịch theo văn bản nguồn được cung cấp và ghi rõ dị bản trong chú thích, không tự giải quyết vấn đề văn bản.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ kính trọng “Ngài”; giữ lời cầu nguyện ngắn gọn, tự nhiên và không xác định cụ thể “họ” là ai.
