- from: Vậy, Phi-lát thả người đã bị tống vào tù vì nổi loạn và giết người[a], là người họ vẫn đòi thả; còn Đức Giê-su thì ông giao nộp theo ý muốn của họ[b].
  to: Vậy, Phi-lát thả người đã bị tống vào tù vì nổi loạn và giết người[a], là người họ đang xin thả; còn Đức Giê-su thì ông giao nộp theo ý muốn của họ[b].
  rationale: Chỉnh “vẫn đòi thả” thành “đang xin thả” để phản ánh sát hơn thể chưa hoàn thành của ᾐτοῦντο mà không tăng cường sắc thái cưỡng ép. Chỉnh chú thích b thành một phương án dịch trực tiếp của “theo ý muốn của họ,” tránh diễn giải thêm. Các phần còn lại được giữ nguyên vì sát nguồn, tự nhiên, và không áp đặt diễn giải thần học.
