id: LUK.23.25
reference: Luke 23:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: vi
  text: Vậy, Phi-lát thả người đã bị tống vào tù vì nổi loạn và giết người[a], là người họ đang xin thả; còn Đức Giê-su thì ông giao nộp theo ý muốn của họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã bị bỏ tù.” Nguyên văn có sắc thái mạnh và sinh động hơn: “đã bị tống vào tù.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “theo điều họ muốn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: thả
  rationale: Trong bối cảnh pháp lý và giam giữ, động từ này chỉ việc trả tự do cho một tù nhân; “thả” tự nhiên và chính xác trong tiếng Việt.
- source_word: διὰ στάσιν καὶ φόνον
  choice: vì nổi loạn và giết người
  rationale: διά với đối cách nêu nguyên nhân. στάσις ở đây chỉ hành vi nổi dậy gây bất ổn chính trị, không chỉ là tranh chấp; φόνος chỉ hành vi giết người.
- source_word: βεβλημένον εἰς φυλακήν
  choice: đã bị tống vào tù
  rationale: Phân từ hoàn thành bị động của βάλλω có sắc thái mạnh, theo nghĩa đen là bị quăng/tống vào tù; cách dịch này vừa giữ được tính sinh động vừa tự nhiên hơn “bị quăng vào tù” trong văn cảnh hiện đại.
- source_word: ὃν ᾐτοῦντο
  choice: là người họ vẫn đòi thả
  rationale: Thì chưa hoàn thành diễn tả yêu cầu đang tiếp diễn. Tân ngữ được bổ sung là “thả” theo ngữ cảnh trực tiếp; “vẫn đòi” thể hiện sự dai dẳng của lời yêu cầu mà không làm thay đổi đối tượng.
- source_word: παρέδωκεν
  choice: giao nộp
  rationale: Giữ sắc thái chuyển giao một người cho quyền xử lý của bên khác và phù hợp với động từ quan trọng trong trình thuật thương khó.
- source_word: τῷ θελήματι αὐτῶν
  choice: theo ý muốn của họ
  rationale: θέλημα chỉ ý muốn hay điều người ta muốn. “Theo ý muốn của họ” tự nhiên trong tiếng Việt, đồng thời giữ trọng lượng ý chí của nguyên văn.
- source_word: δὲ ... δὲ
  choice: Vậy ... còn ... thì
  rationale: Cặp tiểu từ vừa tiếp nối diễn tiến vừa tạo tương phản rõ giữa người được thả và Đức Giê-su bị giao nộp.
theological_decisions:
- issue: Sự tương phản giữa người nổi loạn được thả và Đức Giê-su bị giao nộp
  choice: Giữ sự tương phản rõ trong câu nhưng không thêm ngôn ngữ giải thích về sự thay thế hay chuộc tội.
  alternative: Thêm những cụm như “thay cho Đức Giê-su” hoặc “thế chỗ Ngài”.
  rationale: Câu này thuật lại quyết định của Phi-lát và ý muốn của đám đông; các chủ đề thần học rộng hơn có thể được suy ra từ toàn bộ trình thuật thương khó nhưng không được phát biểu trực tiếp ở đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-lát” để làm rõ chủ thể vốn được hiểu từ văn cảnh; dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến nhưng không thêm diễn giải giáo phái. Cấu trúc “còn ... thì” làm nổi bật tương phản của nguyên văn.
