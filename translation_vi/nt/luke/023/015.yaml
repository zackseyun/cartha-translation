id: LUK.23.15
reference: Luke 23:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: vi
  text: Hê-rốt cũng không thấy người này có tội, vì ông đã gửi người này trở lại cho chúng ta. Này, người này chẳng làm điều gì đáng phải chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Này, nơi người này không có điều gì đáng phải chết.”'
    reason: Cách dùng αὐτῷ có thể được hiểu là chỉ tác nhân (“do người này làm”) hoặc theo nghĩa quy chiếu (“nơi người này”); cả hai đều truyền đạt lời tuyên bố vô tội trong bối cảnh xét xử.
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Vua Hê-rốt cũng không thấy người này có tội
  rationale: Cụm Hy Lạp để lửng động từ theo lời tuyên bố của Phi-lát ở câu trước. Tiếng Việt bổ sung “thấy người này có tội” để câu tự nhiên và làm rõ rằng Hê-rốt cũng không kết tội Đức Chúa Jêsus, nhưng không thêm một phán quyết cụ thể hơn nguyên văn.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: vì vua đã gửi người này trở lại cho chúng ta
  rationale: ἀναπέμπω trong mạch truyện xét xử mang nghĩa gửi trả lại; “vua” giúp đại từ chỉ Hê-rốt rõ ràng, còn “người này” phù hợp với lời công khai của Phi-lát.
- source_word: καὶ ἰδοὺ
  choice: Kìa
  rationale: “Kìa” là từ nhấn mạnh, thu hút sự chú ý và giữ được tính trực tiếp của ἰδού trong lối văn trang trọng hiện đại.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: chẳng làm điều gì đáng phải chết
  rationale: 'Diễn đạt tự nhiên sức nặng pháp lý của cụm từ: không có hành vi nào đáng chịu án tử hình.'
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: người này chẳng làm
  rationale: Hiểu αὐτῷ là chỉ tác nhân gắn với phân từ hoàn thành bị động, theo đó lời tuyên bố nói về những việc có thể quy cho bị cáo; tiếng Việt chuyển sang câu chủ động cho sáng rõ.
theological_decisions:
- issue: Quan hệ của αὐτῷ với πεπραγμένον
  choice: 'Hiểu là tác nhân: “người này chẳng làm”'
  alternative: 'Hiểu theo nghĩa quy chiếu: “không thấy nơi người này điều gì đáng phải chết”'
  rationale: Bối cảnh là lời Phi-lát tuyên bố rằng Đức Chúa Jêsus không phạm tội đáng chết. Cách dịch chính diễn đạt trực tiếp kết luận ấy, còn chú thích giữ lại khả năng cấu trúc quy chiếu của cụm Hy Lạp.
- issue: Động từ bị lược sau “Hê-rốt cũng không”
  choice: Bổ sung “thấy người này có tội”
  alternative: 'Giữ câu lửng: “Vua Hê-rốt cũng không”'
  rationale: Nguyên văn dựa vào ngữ cảnh trước để hiểu động từ bị lược. Tiếng Việt cần bổ sung tối thiểu để câu hoàn chỉnh, nhưng không biến lời ấy thành một công thức thần học hay pháp lý chi tiết hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Vua Hê-rốt” để nhận diện chức vị tự nhiên trong tiếng Việt; “Kìa” giữ sắc thái nhấn mạnh của lời nói trực tiếp. Câu đầu bổ sung phần động từ bị lược trong tiếng Hy Lạp để tránh một câu tiếng Việt cụt nghĩa.
