revisions:
- from: Vua Hê-rốt cũng không thấy người này có tội, vì vua đã gửi người này trở lại cho chúng ta. Kìa, người này chẳng làm điều gì đáng phải chết.[a]
  to: Hê-rốt cũng không thấy người này có tội, vì ông đã gửi người này trở lại cho chúng ta. Này, người này chẳng làm điều gì đáng phải chết.[a]
  rationale: Bỏ danh xưng lịch sử không có trong nguyên văn và có nguy cơ không chính xác; thay “Kìa” bằng “Này” cho tự nhiên hơn trong tiếng Việt hiện đại. Các yếu tố còn lại, gồm phần động từ được bổ sung để diễn đạt phép lược của tiếng Hy Lạp và chú thích về αὐτῷ, được giữ nguyên về nghĩa.
