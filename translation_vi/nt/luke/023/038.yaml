  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: vi
  text: 'Cũng có một dòng chữ[a] ở phía trên Ngài[b]: “Đây là Vua dân Do Thái.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tấm biển”, “thông báo” hoặc “lời buộc tội được viết”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trên Ngài”.
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hy Lạp sát nghĩa là: “Vua của người Do Thái, người này.”'
    reason: lexical_alternative
  - marker: d
    text: Từ được dịch là “dân Do Thái” trong một số ngữ cảnh có thể chỉ “người Giu-đê”; nhưng trong tước hiệu cố định này tại cuộc đóng đinh, “dân Do Thái” là nghĩa truyền thống và phù hợp với ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: dòng chữ
  rationale: Chỉ nội dung được viết và đặt trên thập tự giá. “Dòng chữ” tự nhiên, dễ hiểu trong tiếng Việt hiện đại và không diễn giải quá mức thành một cáo trạng pháp lý.
- source_word: ἐπ’ αὐτῷ
  choice: phía trên Ngài
  rationale: Trong bối cảnh đóng đinh, cụm này diễn tả vị trí của dòng chữ so với Đức Chúa Jêsus; “phía trên Ngài” rõ ràng và tự nhiên.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Đây là Vua dân Do Thái
  rationale: Câu Hy Lạp không có động từ và đặt đại từ chỉ định οὗτος ở cuối để nhấn mạnh. Tiếng Việt cần thêm “là”; cách dịch này giữ được ý chỉ trực tiếp mà vẫn tự nhiên.
- source_word: Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong tước hiệu cố định tại cuộc đóng đinh, “Vua dân Do Thái” là cách diễn đạt truyền thống, tự nhiên và phù hợp với sắc thái dân tộc-chính trị của nguyên văn.
- source_word: δὲ καὶ
  choice: cũng có
  rationale: Diễn tả việc tác giả bổ sung một chi tiết nữa vào mạch kể chuyện, không làm nặng câu bằng một liên từ không cần thiết trong tiếng Việt.
theological_decisions:
- issue: Tính chất của dòng chữ trên thập tự giá
  choice: Dịch thẳng nội dung dòng chữ là “Đây là Vua dân Do Thái”, không thêm lời giải thích về sự mỉa mai, cáo trạng hay lời tuyên xưng Đấng Mê-si-a.
  alternative: Dịch rõ thành một cáo trạng pháp lý hoặc thêm sắc thái mỉa mai/chính trị.
  rationale: Câu này chỉ thuật lại sự hiện diện và nội dung của dòng chữ. Bản dịch nên giữ nguyên sức căng của lời ấy thay vì quyết định thay cho người đọc ý nghĩa thần học hoặc dụng ý chính trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu về Đức Chúa Jêsus theo mạch văn; giữ cấu trúc câu gọn, tự nhiên, đồng thời đưa các khả năng từ vựng và trật tự sát nguyên văn vào chú thích.
