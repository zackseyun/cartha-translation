  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng nội dung của ἦν δὲ καὶ ἐπιγραφὴ ἐπ’ αὐτῷ và giữ cách diễn đạt không diễn giải của tước hiệu. Tuy nhiên, đặt cụm chỉ vị trí sau danh từ (“một dòng chữ ... ở phía trên Ngài”) phản ánh rõ hơn việc dòng chữ ở trên người bị đóng đinh, đồng thời tự nhiên hơn trong trật tự câu tiếng Việt.
  naturalness: “Dòng chữ” và “Đây là Vua dân Do Thái” đều rõ ràng, trang trọng và tự nhiên trong tiếng Việt hiện đại. Bản sửa chỉ điều chỉnh trật tự câu cho mạch văn trôi chảy hơn. Chú thích về ἐπιγραφή được sửa để tránh cụm “cáo trạng viết” không tự nhiên.
