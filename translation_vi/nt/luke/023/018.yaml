  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: vi
  text: 'Nhưng cả đám đông đồng loạt kêu lên: “Hãy đem người này đi[a], và thả Ba-ra-ba cho chúng tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đem người này đi!” Mệnh lệnh Hy Lạp có thể được diễn đạt ngắn gọn hơn; ý là họ đòi đem người này đi, loại khỏi trước mặt họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: kêu lên
  rationale: Động từ diễn tả một tiếng kêu lớn; “kêu lên” tự nhiên trong tiếng Việt và giữ được cường độ của lời phản đối.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản với diễn biến ngay trước đó; “Nhưng” diễn đạt rõ bước ngoặt đối nghịch.
- source_word: παμπληθεὶ
  choice: tất cả đồng thanh
  rationale: Trạng từ nhấn mạnh hành động tập thể của toàn đám đông. “Tất cả đồng thanh” vừa thể hiện tính toàn thể vừa giữ sắc thái cùng cất tiếng, mà không nhất thiết khẳng định tuyệt đối rằng từng cá nhân đều có cùng ý nghĩ.
- source_word: λέγοντες
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ giới thiệu nội dung tiếng kêu; trong tiếng Việt, dấu hai chấm dẫn lời trực tiếp tự nhiên hơn việc thêm “rằng” hoặc “nói rằng”.
- source_word: Αἶρε
  choice: Hãy đem ... đi
  rationale: Mệnh lệnh ở đây đòi loại người được chỉ đến khỏi trước mặt họ. “Đem ... đi” tự nhiên, mạnh, nhưng không tự ý nói rõ phương thức hay kết quả cuối cùng.
- source_word: τοῦτον
  choice: người này
  rationale: Giữ lực chỉ định của đại từ giống đực và sắc thái hướng thẳng vào Đức Giê-su, thay vì làm yếu thành “ông ấy”.
- source_word: ἀπόλυσον
  choice: thả
  rationale: Động từ chỉ việc phóng thích khỏi tình trạng giam giữ; “thả” rõ ràng, thông dụng và phù hợp ngữ cảnh tư pháp.
- source_word: ἡμῖν
  choice: cho chúng tôi
  rationale: Dữ cách biểu thị người hưởng lợi hoặc nhận kết quả của hành động; “cho chúng tôi” là cách nói tự nhiên trong tiếng Việt.
- source_word: τὸν Βαραββᾶν
  choice: Ba-ra-ba
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu trực tiếp giữ nhịp dồn dập của hai mệnh lệnh Hy Lạp. Không thêm hàm ý rằng “đem đi” nhất thiết đồng nghĩa trực tiếp với hành quyết, dù văn cảnh có thể hướng tới điều đó.
