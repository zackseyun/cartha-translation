id: LUK.23.3
reference: Luke 23:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: vi
  text: 'Phi-lát hỏi Ngài: “Ông có phải là vua dân Do Thái[a] không?” Ngài đáp: “Chính ông nói vậy.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người Giu-đê.” Từ Hy Lạp này tùy ngữ cảnh có thể chỉ dân Do Thái hoặc người Giu-đê.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ông nói đó” hoặc “Đúng như ông nói.” Câu Hy Lạp rất ngắn và có thể được hiểu là một lời xác nhận có dè dặt.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: lược dịch qua mạch kể liền mạch
  rationale: δέ ở đây chỉ là từ nối nhẹ để tiếp diễn câu chuyện; tiếng Việt không cần một liên từ riêng ở đầu câu.
- source_word: ἠρώτησεν αὐτὸν λέγων
  choice: hỏi Ngài
  rationale: Cách nói Hy Lạp theo nghĩa đen là “hỏi Ngài rằng”; “hỏi Ngài” tự nhiên, rõ nghĩa và lời trích dẫn trực tiếp đã thể hiện hành động nói.
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: Ông có phải là vua
  rationale: Giữ rõ dạng câu hỏi và tước hiệu chính trị βασιλεύς; đại từ “ông” phù hợp với lời Phi-lát thẩm vấn Chúa Giê-su mà không thêm sắc thái kính trọng không có trong văn bản.
- source_word: τῶν Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong ngữ cảnh cáo buộc chính trị, đây là cách gọi quen thuộc và tự nhiên trong tiếng Việt; khả năng chỉ người Giu-đê được ghi ở chú thích.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Ngài đáp
  rationale: Gói gọn cấu trúc “trả lời ông ấy, Ngài nói” thành cách diễn đạt tiếng Việt tự nhiên mà vẫn giữ quan hệ hỏi–đáp.
- source_word: Σὺ λέγεις
  choice: Chính ông nói vậy
  rationale: Giữ câu trả lời ngắn, gián tiếp và có sắc thái quy lời phát biểu cho Phi-lát, thay vì biến nó thành một lời “vâng” hoàn toàn minh nhiên.
theological_decisions:
- issue: Sắc thái của câu đáp Σὺ λέγεις
  choice: “Chính ông nói vậy” như một lời xác nhận có dè dặt
  alternative: “Đúng như ông nói” hoặc “Ông nói đó”
  rationale: Nguyên văn súc tích, không phủ nhận danh hiệu nhưng cũng không đơn thuần nói “phải”; bản dịch giữ sự căng thẳng tu từ và thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể để chỉ Chúa Giê-su, nhưng dùng “ông” trong lời thẩm vấn của Phi-lát nhằm phản ánh quan hệ diễn ngôn. Lược bỏ phân từ “rằng/nói rằng” vốn dư thừa trong tiếng Việt.
