  source_fidelity: Bản dịch truyền đạt đúng mạch hỏi–đáp của nguyên văn. “Phi-lát hỏi Ngài” diễn đạt tự nhiên ἠρώτησεν αὐτόν; câu hỏi giữ rõ tước hiệu βασιλεύς và cụm τῶν Ἰουδαίων. “Ngài đáp” diễn đạt gọn mà vẫn bảo toàn chức năng của ἀποκριθεὶς ... ἔφη. “Chính ông nói vậy” giữ được chủ ngữ σὺ được nêu rõ và tính chất ngắn gọn, quy phát biểu về phía Phi-lát của Σὺ λέγεις, không biến câu đáp thành một lời khẳng định hoàn toàn minh nhiên.
  naturalness: Văn câu hiện đại, trang trọng và tự nhiên. Việc lược bỏ λέγων và gộp cấu trúc phân từ trả lời vào “Ngài đáp” là phù hợp với cú pháp tiếng Việt, không làm mất nội dung cần thiết.
  terminology: “Vua dân Do Thái” là cách gọi Việt ngữ quen thuộc, phù hợp với danh hiệu trong bối cảnh tố cáo chính trị. Chú thích a bảo lưu cách hiểu “người Giu-đê”; chú thích b bảo lưu các cách hiểu khả dĩ của câu đáp ngắn Σὺ λέγεις. Cách xưng “Ngài” trong lời kể và “ông” trong lời Phi-lát nhất quán với thanh điệu bản dịch.
