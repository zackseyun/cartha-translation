source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: vi
  text: Tất cả các đám đông đã tụ tập để xem cảnh tượng này[a], sau khi thấy những việc đã xảy ra, đều vừa đấm ngực[b] vừa trở về.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cảnh này.”
    reason: lexical_alternative
  - marker: b
    text: Đấm ngực là cử chỉ biểu lộ sự đau buồn, than khóc hoặc kinh hãi.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: đã tụ tập
  rationale: Diễn tả những người đã cùng đến và tập trung tại hiện trường; cách nói tự nhiên, giữ được ý nghĩa tập hợp của từ Hy Lạp.
- source_word: ὄχλοι
  choice: những đám đông
  rationale: Giữ dạng số nhiều của nguyên văn và phù hợp với cách dùng quen thuộc của Lu-ca.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: để xem cảnh tượng này
  rationale: Thể hiện cả mục đích họ tụ tập lẫn tính chất của sự việc như một cảnh công khai được chứng kiến; chú thích giữ phương án sát hơn là “quang cảnh này”.
- source_word: θεωρήσαντες
  choice: sau khi thấy
  rationale: Phản ánh hành động xảy ra trước động từ chính và diễn đạt tự nhiên trong tiếng Việt.
- source_word: τὰ γενόμενα
  choice: những việc đã xảy ra
  rationale: Chuyển đạt rõ nghĩa sự kiện của cụm danh hóa mà không thêm cách diễn giải.
- source_word: τύπτοντες τὰ στήθη
  choice: vừa đấm ngực
  rationale: Giữ hành động cụ thể và sống động; không tự ý xác định đó là ăn năn, đau buồn hay kinh hãi.
- source_word: ὑπέστρεφον
  choice: vừa ... vừa trở về
  rationale: Kết hợp với phân từ để thể hiện hành động đấm ngực đang diễn ra trong lúc họ lần lượt trở về, qua đó phần nào bảo toàn sắc thái chưa hoàn tất của thì quá khứ chưa hoàn thành.
theological_decisions:
- issue: Ý nghĩa cảm xúc và thuộc linh trong phản ứng của đám đông
  choice: Chỉ mô tả hành động “đấm ngực” và giải thích đây có thể là cử chỉ đau buồn, than khóc hoặc kinh hãi.
  alternative: Diễn giải rõ rằng họ đang ăn năn hoặc cảm thấy tội lỗi.
  rationale: Nguyên văn nêu hành động bên ngoài nhưng không xác định trạng thái thuộc linh bên trong; bản dịch vì thế giữ nguyên sự mơ hồ có thật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “vừa… vừa…” tái hiện hai hành động đồng thời; tránh từ ngữ giáo phái và không gán động cơ ăn năn cho đám đông.
