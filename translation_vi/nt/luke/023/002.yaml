    issue: «tự xưng mình là» mạnh hơn λέγοντα αὑτὸν ... εἶναι.
    rationale: λέγοντα có nghĩa cơ bản là «nói rằng», không tự nó mang nghĩa «tự xưng/claim». αὑτόν cho phép diễn đạt sự nhấn mạnh bằng «chính mình». Cách dịch trung tính hơn giữ được giọng cáo buộc mà không thêm đánh giá.
  - severity: low
    issue: Chú thích a nêu «đang kích động dân tộc chúng tôi» như một phương án từ vựng.
    rationale: διαστρέφω ở đây là làm sai lệch, dẫn lạc, hoặc phá hoại/làm bại hoại; «kích động» quy định hóa quá cụ thể theo hướng xúi giục chính trị. Nên bỏ phương án này.
