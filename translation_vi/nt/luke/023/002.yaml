revisions:
- from: 'Rồi họ bắt đầu tố cáo Ngài rằng: “Chúng tôi thấy người này đang làm dân tộc chúng tôi lầm lạc[a], ngăn cấm chúng tôi nộp thuế[b] cho Sê-sa, và tự xưng mình là Đấng Mê-si, một vị vua.”[c]'
  to: 'Rồi họ bắt đầu tố cáo Ngài rằng: “Chúng tôi thấy người này đang làm dân tộc chúng tôi lầm lạc[a], ngăn cấm chúng tôi nộp thuế[b] cho Sê-sa, và nói rằng chính mình là Đấng Mê-si, một vị vua.”[c]'
  rationale: Thay «tự xưng mình là» bằng «nói rằng chính mình là» để dịch sát và trung tính hơn đối với λέγοντα, đồng thời vẫn giữ nhấn mạnh của αὑτόν. Chú thích a được thu hẹp về các khả năng nghĩa phù hợp của διαστρέφω, tránh diễn giải «kích động» quá chuyên biệt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:30Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc cáo buộc, ý nghĩa pháp lý của κατηγορεῖν, sắc thái chỉ trỏ của «người này», và các cáo buộc về thuế cùng vương quyền. Tuy nhiên, «tự xưng» diễn giải λέγοντα mạnh hơn nguyên văn, vốn đơn giản là «nói rằng»; nên giữ cách nói trung tính để không thêm sắc thái đánh giá của bên tố cáo.
  naturalness: Văn tiếng Việt hiện đại, rõ ràng và phù hợp văn cảnh xét xử. «Ngăn cấm chúng tôi nộp thuế cho Sê-sa» tự nhiên và truyền đạt chủ ngữ hàm ẩn của động từ nguyên mẫu.
  terminology: «Đấng Mê-si» thích hợp cho χριστός như một tước hiệu; «một vị vua» bảo toàn βασιλέα như thành tố riêng. «Sê-sa» và «Ngài» phù hợp lối dùng Kinh Thánh tiếng Việt trang trọng.
  issues:
