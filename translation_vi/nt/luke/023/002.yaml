id: LUK.23.2
reference: Luke 23:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: vi
  text: 'Rồi họ bắt đầu tố cáo Ngài rằng: “Chúng tôi thấy người này đang làm dân tộc chúng tôi lầm lạc[a], ngăn cấm chúng tôi nộp thuế[b] cho Sê-sa, và nói rằng chính mình là Đấng Mê-si, một vị vua.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang làm dân tộc chúng tôi rối loạn” hoặc “đang lôi kéo dân tộc chúng tôi đi sai đường.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp φόρους chỉ thuế hoặc cống nạp cho nhà cầm quyền La Mã.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “và nói rằng chính mình là Đấng Mê-si, là vua.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Rồi họ bắt đầu tố cáo Ngài
  rationale: Giữ sắc thái khởi đầu của ἤρξαντο và nghĩa pháp lý của κατηγορεῖν; “tố cáo” tự nhiên trong bối cảnh xét xử.
- source_word: Τοῦτον εὕραμεν
  choice: Chúng tôi thấy người này
  rationale: Diễn đạt tự nhiên lời buộc tội; “người này” giữ sắc thái chỉ trỏ và có phần miệt thị của Τοῦτον.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: đang làm dân tộc chúng tôi lầm lạc
  rationale: διαστρέφω ở đây có thể chỉ việc dẫn sai đường hoặc gây đảo lộn; bản chính chọn cách diễn đạt dễ hiểu mà không mặc định rõ đó là sự lừa dối tôn giáo hay hoạt động lật đổ chính trị.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: ngăn cấm chúng tôi nộp thuế cho Sê-sa
  rationale: “Ngăn cấm” phản ánh κωλύοντα trong lời cáo buộc; chủ thể hàm ẩn của διδόναι được diễn đạt là “chúng tôi,” còn φόρους được dịch bằng từ hiện đại “thuế.”
- source_word: λέγοντα αὑτὸν χριστὸν βασιλέα εἶναι
  choice: tự xưng mình là Đấng Mê-si, một vị vua
  rationale: “Tự xưng” chuyển tải nội dung lời cáo buộc và sắc thái nhấn mạnh của αὑτόν; “Đấng Mê-si” giữ chức danh được xức dầu, còn “một vị vua” bảo tồn yếu tố βασιλέα riêng biệt.
theological_decisions:
- issue: Cách dịch χριστόν trong lời cáo buộc mang tính chính trị
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Trong câu này χριστός hoạt động như một tước hiệu gắn với vương quyền Do Thái, nên “Đấng Mê-si” làm rõ chức năng tước hiệu mà không biến nó thành tên riêng.
- issue: Quan hệ giữa χριστόν và βασιλέα
  choice: Đấng Mê-si, một vị vua
  alternative: Đấng Mê-si là Vua
  rationale: Cách dịch giữ cả hai thành tố vị ngữ của tiếng Hy Lạp và không hợp nhất chúng thành một danh hiệu thần học cố định.
- issue: Sắc thái của λέγοντα αὑτὸν ... εἶναι
  choice: tự xưng mình là
  alternative: nói rằng chính mình là
  rationale: “Tự xưng” tự nhiên trong văn cảnh một cáo trạng và giữ trọng tâm quy chiếu về chính người bị tố cáo, nhưng không khẳng định lời cáo buộc là đúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su, “Sê-sa” theo lối phiên âm Kinh Thánh quen thuộc, và giữ giọng điệu pháp lý của lời tố cáo. Các chú thích bảo tồn độ rộng nghĩa của διαστρέφω và cấu trúc có phần mơ hồ của χριστὸν βασιλέα.
