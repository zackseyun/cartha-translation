id: LUK.23.6
reference: Luke 23:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: vi
  text: Nhưng khi nghe vậy, Phi-lát hỏi người ấy có phải là người Ga-li-lê không.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu bước chuyển nhẹ trong diễn tiến câu chuyện; “Nhưng” phù hợp với sự chuyển hướng khi Phi-lát phản ứng trước điều vừa nghe.
- source_word: ἀκούσας
  choice: khi nghe vậy
  rationale: Phân từ bất định quá khứ bổ nghĩa cho Phi-lát. Cách dịch này tự nhiên trong tiếng Việt; “vậy” được bổ sung theo ngữ cảnh để diễn đạt đối tượng được nghe vốn để ngầm trong tiếng Hy Lạp.
- source_word: ἐπηρώτησεν
  choice: hỏi
  rationale: Diễn đạt trực tiếp và tự nhiên nghĩa hỏi hoặc dò hỏi của động từ.
- source_word: εἰ
  choice: có phải ... không
  rationale: Cấu trúc tự nhiên trong tiếng Việt để mở đầu câu hỏi gián tiếp.
- source_word: ὁ ἄνθρωπος
  choice: người ấy
  rationale: Chỉ người đàn ông đang được nói đến, tức Chúa Giê-su, mà không thay danh từ Hy Lạp bằng tên riêng; “người ấy” tự nhiên hơn “người đàn ông” trong mạch văn này.
- source_word: Γαλιλαῖός
  choice: người Ga-li-lê
  rationale: Tính từ dùng theo chức năng vị ngữ, chỉ căn tính hoặc xuất thân theo vùng miền.
- source_word: ἐστιν
  choice: có phải ... không
  rationale: Thì hiện tại của tiếng Hy Lạp được thể hiện trong cấu trúc câu hỏi gián tiếp tiếng Việt, vốn không cần biến đổi hình thái theo thì.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc câu hỏi gián tiếp, đồng thời tránh thêm cách diễn giải thần học hoặc xác định chi tiết hơn mức bản Hy Lạp.
