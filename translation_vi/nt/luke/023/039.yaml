id: LUK.23.39
reference: Luke 23:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: vi
  text: 'Một trong những tên tội phạm bị treo ở đó cứ lăng mạ Ngài rằng: “Chẳng phải ông là Đấng Mê-si sao?[a] Hãy cứu chính mình và cả chúng tôi nữa!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Đấng Christ”. Tiếng Hy Lạp: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Một
  rationale: δέ chỉ sự chuyển ý hoặc tương phản nhẹ; mạch văn tiếng Việt không cần thêm một từ nối rõ nghĩa như “nhưng”.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: trong những tên tội phạm bị treo ở đó
  rationale: κακούργων chỉ những kẻ phạm tội; “tên tội phạm” tự nhiên trong ngữ cảnh này. κρεμασθέντων được giữ theo nghĩa tương đối rộng là “bị treo”, không thay bằng động từ cụ thể hơn “bị đóng đinh”.
- source_word: ἐβλασφήμει
  choice: cứ lăng mạ
  rationale: Trong ngữ cảnh, động từ chỉ lời xúc phạm nhắm vào Chúa Giê-su; thể chưa hoàn thành được diễn đạt bằng “cứ”, cho thấy hành động tiếp diễn.
- source_word: λέγων
  choice: rằng
  rationale: Cách dẫn lời trực tiếp gọn và tự nhiên trong văn kể chuyện tiếng Việt.
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: Chẳng phải ông là Đấng Mê-si sao?
  rationale: Cấu trúc “chẳng phải... sao?” giữ sức nặng của câu hỏi tu từ mang ý chế giễu và chờ câu trả lời khẳng định; “ông” phù hợp với giọng xúc phạm, không đưa thêm sự tôn kính của người nói.
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: Hãy cứu chính mình và cả chúng tôi nữa!
  rationale: “Cứu” vừa diễn tả sự thoát khỏi cái chết trước mắt vừa duy trì liên hệ từ vựng với chủ đề cứu rỗi; “cả... nữa” làm rõ sự gộp thêm nhóm người nói mà không đổi nội dung.
theological_decisions:
- issue: Cách dịch ὁ χριστός như một tước hiệu
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ở đây Χριστός là tước hiệu trong lời thách thức, không phải cách gọi gần như tên riêng. “Đấng Mê-si” giữ ý nghĩa và bối cảnh kỳ vọng về Đấng được xức dầu.
- issue: Sắc thái của ἐβλασφήμει
  choice: lăng mạ
  alternative: phạm thượng
  rationale: Đối tượng trực tiếp là Chúa Giê-su, và trong câu này từ ngữ nhấn vào lời sỉ nhục. “Phạm thượng” có thể khiến bản dịch tự quyết định trước hàm ý thần học về căn tính của Ngài.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” được dùng trong lời kể để chỉ Chúa Giê-su, còn “ông” trong câu nói trực tiếp giữ nguyên thái độ chế giễu của tên tội phạm. Dấu chú thích [a] được đặt ngay sau tước hiệu mà chú thích giải thích.
