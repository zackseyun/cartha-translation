  to: Khi Hê-rốt thấy Đức Chúa Jêsus, ông rất vui mừng, vì từ lâu ông đã muốn thấy Ngài, bởi ông vẫn thường nghe nói về Ngài, và ông hy vọng được thấy Ngài làm một dấu lạ.[a]
  rationale: Đổi “gặp” thành “thấy” để bám sát ἰδεῖν và duy trì sự lặp lại có chủ ý của động từ “thấy” trong câu. Chỉnh dấu câu nhẹ để văn Việt tự nhiên hơn. Chú thích [a] được giữ đúng vị trí, gắn với “dấu lạ,” và không cần thêm chú thích nào khác.
