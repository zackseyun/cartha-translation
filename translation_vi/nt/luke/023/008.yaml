  source_fidelity: 'Bản dịch truyền đạt đúng mạch câu: Hê-rốt vui mừng khi thấy Đức Chúa Jêsus, từ lâu muốn thấy Ngài vì thường nghe về Ngài, và hy vọng thấy một dấu lạ do Ngài làm. Tuy nhiên, “muốn gặp Ngài” thu hẹp động từ ἰδεῖν (“thấy”) thành một cuộc gặp gỡ trực tiếp; trong cùng câu, động từ này cũng được dùng ở hai chỗ còn lại theo nghĩa “thấy.” Nên giữ cách dịch nhất quán là “muốn thấy Ngài.”'
