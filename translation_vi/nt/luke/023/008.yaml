source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: vi
  text: Khi Hê-rốt thấy Đức Chúa Jêsus, ông rất vui mừng, vì từ lâu ông đã muốn thấy Ngài, bởi ông vẫn thường nghe nói về Ngài, và ông hy vọng được thấy Ngài làm một dấu lạ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một phép lạ.” Từ Hy Lạp có nghĩa đen là “một dấu hiệu,” ở đây chỉ một việc phi thường được xem như dấu hiệu có ý nghĩa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: rất vui mừng
  rationale: Diễn đạt tự nhiên động từ χαίρω cùng mức độ nhấn mạnh của λίαν, không làm nhẹ cảm xúc của Hê-rốt.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: từ lâu
  rationale: Thành ngữ chỉ một khoảng thời gian kéo dài nhưng không xác định cụ thể; “từ lâu” gọn và tự nhiên trong tiếng Việt.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: đã muốn gặp Ngài
  rationale: Trong ngữ cảnh, ἰδεῖν không chỉ là thoáng nhìn mà là được gặp trực tiếp; cấu trúc ἦν ... θέλων diễn tả mong muốn đã kéo dài.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: bởi ông vẫn thường nghe nói về Ngài
  rationale: διά với động từ nguyên mẫu có mạo từ nêu nguyên nhân; hiện tại ἀκούειν có thể gợi việc nghe các tin tức nhiều lần hoặc liên tục.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: ông hy vọng được thấy ... một dấu lạ
  rationale: Giữ sắc thái hy vọng/mong đợi của ἐλπίζω và ý nghĩa “dấu hiệu có ý nghĩa” của σημεῖον.
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: Ngài làm
  rationale: Chuyển cấu trúc bị động có tác nhân sang chủ động để tiếng Việt tự nhiên, đồng thời vẫn xác định Đức Chúa Jêsus là người thực hiện dấu lạ.
- source_word: ὁ δὲ Ἡρῴδης ... ἰδὼν τὸν Ἰησοῦν
  choice: Khi Hê-rốt thấy Đức Chúa Jêsus
  rationale: δέ đánh dấu bước tiếp theo của câu chuyện và không cần một từ nối riêng; phân từ quá khứ ἰδών được diễn đạt tự nhiên bằng mệnh đề thời gian “khi”.
theological_decisions:
- issue: Ý nghĩa của σημεῖον
  choice: dấu lạ
  alternative: phép lạ
  rationale: “Dấu lạ” giữ được ý niệm về một hành động phi thường mang ý nghĩa dấu hiệu, thay vì chỉ nhấn mạnh tính kỳ diệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi tôn kính; câu được sắp xếp tự nhiên trong tiếng Việt nhưng vẫn giữ nguyên chuỗi nguyên nhân và kỳ vọng của bản Hy Lạp.
