base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: vi
  text: 'Bấy giờ, họ sẽ bắt đầu nói với núi[a]: “Hãy đổ xuống trên chúng tôi!” và với đồi[b]: “Hãy che phủ chúng tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cách diễn đạt này gợi lại ngôn ngữ tiên tri về sự phán xét, đặc biệt là Ô-sê 10:8.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “Hãy che giấu chúng tôi.” Động từ theo nghĩa đen là “che phủ,” nhưng trong ngữ cảnh mang ý xin được ẩn giấu khỏi sự phán xét sắp đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian và trình tự; “Bấy giờ” tự nhiên, trang trọng vừa phải và nối lời tiên báo này với bối cảnh trước.
- source_word: ἄρξονται λέγειν
  choice: người ta sẽ bắt đầu nói
  rationale: Giữ sắc thái khởi đầu của ἄρξονται cùng động từ nguyên mẫu λέγειν, thay vì giản lược thành “sẽ nói.” Chủ thể số nhiều không được nêu rõ trong tiếng Hy Lạp nên dùng “người ta” theo ngữ cảnh tổng quát.
- source_word: τοῖς ὄρεσιν
  choice: với các núi
  rationale: ὄρος có thể chỉ núi hoặc đồi, nhưng dịch là “núi” để giữ sự phân biệt với βουνός ở vế sau.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Hãy đổ xuống trên chúng tôi
  rationale: Giữ mệnh lệnh trực tiếp và hình ảnh cụ thể về các núi đổ xuống trên người nói; “đổ xuống” tự nhiên hơn “rơi” khi nói về núi.
- source_word: τοῖς βουνοῖς
  choice: với các đồi
  rationale: βουνός thường chỉ địa hình thấp hơn núi; “đồi” duy trì đối sánh từ vựng với ὄρεσιν.
- source_word: Καλύψατε ἡμᾶς
  choice: Hãy che phủ chúng tôi
  rationale: Dịch sát nghĩa cơ bản “che phủ,” đồng thời không loại bỏ hàm ý xin được giấu khỏi sự phán xét.
theological_decisions:
- issue: Ngôn ngữ tiên tri về sự phán xét
  choice: Giữ nguyên lời kêu gọi cụ thể hướng đến núi và đồi, không diễn giải thêm trong chính văn.
  alternative: Diễn ý thành lời cầu xin được ẩn giấu khỏi sự phán xét.
  rationale: Cách diễn đạt gợi lại Ô-sê 10:8 và bảo toàn hình ảnh cùng sức căng thần học của nguyên văn.
- issue: Sắc thái của Καλύψατε
  choice: Dùng “che phủ” trong chính văn.
  alternative: Dùng “che giấu” hoặc “giấu kín.”
  rationale: “Che phủ” giữ nghĩa trực tiếp của động từ, còn sắc thái ẩn mình khỏi sự phán xét được nêu trong chú thích thay vì bị áp đặt vào chính văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm nhưng dễ hiểu. Giữ cấu trúc song song, mệnh lệnh mạnh và hình ảnh tiên tri của nguyên văn; các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
