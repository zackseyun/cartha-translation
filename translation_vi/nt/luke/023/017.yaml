  terminology: Giữ «Phi-lát», «Lu-ca», «Ma-thi-ơ», «Mác», «Codex Vaticanus», «Codex Sinaiticus», và «Byzantine». Dùng «Copt» cho tên truyền thống/ngôn ngữ Coptic trong tiếng Việt học thuật hiện nay.
