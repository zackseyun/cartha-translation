  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: vi
  text: Phi-lát buộc phải thả cho họ một người nhân dịp lễ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Toàn bộ câu này không có trong một số thủ bản Hy Lạp cổ nhất, gồm Papyrus 75 thuộc thế kỷ III và Codex Vaticanus thuộc thế kỷ IV, cũng như trong các bản dịch Copt cổ. Câu này có trong một số thủ bản cổ quan trọng khác, chẳng hạn Codex Sinaiticus thuộc thế kỷ IV, trong truyền thống La-tinh và trong phần lớn các thủ bản Byzantine về sau. Có khả năng các người sao chép đã thêm câu này để làm cho lời thuật của Lu-ca phù hợp với tục lệ phóng thích được nhắc đến trong Ma-thi-ơ 27:15 và Mác 15:6. Một số thủ bản đặt câu này sau câu 18.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην ... εἶχεν
  choice: buộc phải
  rationale: Thành ngữ ἀνάγκην ἔχειν diễn tả tình trạng bị đặt dưới một sự cần thiết hay nghĩa vụ. “Buộc phải” tự nhiên trong tiếng Việt và giữ được sức ép do tập tục hoặc nghĩa vụ, không xác định quá mức đó là nghĩa vụ pháp lý.
- source_word: ἀπολύειν
  choice: thả
  rationale: Trong bối cảnh giam giữ và xét xử, động từ này chỉ việc trả tự do cho một người đang bị giữ; “thả” là cách nói rõ ràng, tự nhiên.
- source_word: κατὰ ἑορτήν
  choice: vào mỗi dịp lễ
  rationale: κατά với danh từ số ít ở đây diễn tả thông lệ theo từng kỳ lễ. “Mỗi dịp lễ” truyền đạt tính lặp lại của tập tục, còn “dịp lễ” phù hợp với một lễ hội tôn giáo công cộng.
- source_word: ἕνα
  choice: một người
  rationale: Dạng giống đực số ít được dùng độc lập; “một người” diễn đạt tự nhiên mà không thêm danh tính hay tình trạng tù nhân vốn không được nêu trực tiếp trong câu.
theological_decisions:
- issue: Chủ thể ngầm của εἶχεν
  choice: Phi-lát
  alternative: ông ấy
  rationale: Tiếng Hy Lạp lược chủ ngữ, nhưng ngữ cảnh xác định Phi-lát là người phải thực hiện việc phóng thích. Nêu tên giúp câu tiếng Việt đứng riêng rõ nghĩa mà không làm thay đổi nội dung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Buộc phải” giữ sắc thái nghĩa vụ hoặc sức ép của nguyên văn; “vào mỗi dịp lễ” làm rõ tính thông lệ mà cấu trúc κατὰ ἑορτήν hàm ý. Dấu chú thích [a] xuất hiện trong chính văn.
