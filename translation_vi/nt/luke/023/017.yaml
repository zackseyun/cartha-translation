  source_fidelity: 'Bản dịch truyền đạt đúng ý chính của Ἀνάγκην ... εἶχεν ἀπολύειν αὐτοῖς ... ἕνα: Phi-lát ở trong tình thế phải phóng thích cho họ một người. Tuy nhiên, «mỗi dịp lễ» diễn giải κατὰ ἑορτήν thành thông lệ lặp lại rõ hơn điều câu Hy Lạp đơn lẻ trực tiếp nói; «nhân dịp lễ» giữ ý thời điểm/tục lệ mà không thêm sắc thái này.'
