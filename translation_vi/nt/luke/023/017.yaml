- from: Phi-lát buộc phải thả cho họ một người vào mỗi dịp lễ.[a]
  to: Phi-lát buộc phải thả cho họ một người nhân dịp lễ.[a]
  rationale: Chỉ điều chỉnh cách diễn đạt để tránh làm mạnh hơn sắc thái lặp lại của κατὰ ἑορτήν, đồng thời làm thuật ngữ trong chú thích tự nhiên hơn. «Buộc phải», «thả», và «một người» vẫn phản ánh sát thành ngữ ἀνάγκην ἔχειν, động từ ἀπολύω, và ἕνα. Việc nêu Phi-lát là chủ ngữ được ngữ cảnh trước mắt xác định rõ.
