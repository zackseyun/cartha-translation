  - severity: low
    issue: «ký lục» trong chú thích không phải cách gọi tự nhiên nhất cho scribes.
    rationale: Trong ngữ cảnh phê bình văn bản, «người sao chép» rõ nghĩa, hiện đại và phù hợp hơn.
