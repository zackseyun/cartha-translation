  text: And Pilate decided that their demand should be granted[a].
translation:
  language: vi
  text: Phi-lát phán quyết rằng yêu cầu của họ phải được thực hiện.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Phi-lát quyết định chấp thuận yêu cầu của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Không dịch riêng
  rationale: Liên từ nối câu này với diễn tiến trước đó; trong tiếng Việt, mạch kể vẫn tự nhiên mà không cần thêm “và” hay sắc thái thời gian không có rõ trong nguyên văn.
- source_word: Πιλᾶτος
  choice: Phi-lát
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: ἐπέκρινεν
  choice: phán quyết
  rationale: Diễn đạt hành vi đưa ra quyết định mang tính tư pháp; rõ hơn sắc thái pháp lý so với “quyết định”, nhưng không thu hẹp thành việc tuyên một bản án hình sự.
- source_word: γενέσθαι
  choice: phải được thực hiện
  rationale: Động từ nguyên mẫu bổ nghĩa cho “phán quyết”, nói rằng điều được yêu cầu phải trở thành hiện thực; cách diễn đạt này tự nhiên trong ngữ cảnh tư pháp.
- source_word: τὸ αἴτημα
  choice: yêu cầu
  rationale: Giữ phạm vi nghĩa của αἴτημα là điều được xin hoặc đòi hỏi, không áp đặt quá mức sắc thái “đòi hỏi” vốn chủ yếu đến từ ngữ cảnh.
- source_word: αὐτῶν
  choice: của họ
  rationale: Đại từ sở hữu số nhiều chỉ những người đang gây sức ép và đưa ra yêu cầu với Phi-lát.
theological_decisions:
- issue: Sắc thái tư pháp trong hành động của Phi-lát
  choice: Phi-lát phán quyết rằng yêu cầu của họ phải được thực hiện
  alternative: Phi-lát quyết định chấp thuận yêu cầu của họ
  rationale: Bản dịch chính giữ sắc thái phán xử chính thức của ἐπέκρινεν và mối quan hệ bổ nghĩa của γενέσθαι, nhưng không thêm nhận định thần học hay lịch sử ngoài câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Phán quyết” giữ sắc thái pháp lý của động từ Hy Lạp; “yêu cầu” tránh làm mạnh hơn mức cần thiết, còn chú thích cung cấp cách diễn đạt tự nhiên hơn.
