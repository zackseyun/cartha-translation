  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: vi
  text: Một đám đông dân chúng đi theo Đức Giê-su, trong đó có những phụ nữ đang đấm ngực và than khóc Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: đi theo
  rationale: Thì vị hoàn diễn tả hành động đang tiếp diễn trong diễn tiến câu chuyện; tiếng Việt tự nhiên có thể dùng “đi theo”, còn tính kéo dài được làm rõ bởi ngữ cảnh.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Liên từ này tiếp nối mạch kể; dấu chấm phẩy truyền đạt sự chuyển tiếp tự nhiên mà không cần thêm “và” hay “bấy giờ”.
- source_word: αὐτῷ
  choice: Đức Giê-su
  rationale: Đại từ chỉ về Đức Giê-su trong ngữ cảnh. Nêu lại danh xưng giúp câu đứng riêng rõ nghĩa mà không thay đổi sở chỉ.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: một đoàn dân đông
  rationale: Diễn đạt tự nhiên cấu trúc chỉ một đám đông gồm dân chúng, đồng thời tránh lối dịch máy móc “một đám đông lớn của dân”.
- source_word: καὶ γυναικῶν
  choice: trong đó có những phụ nữ
  rationale: Cách diễn đạt này hiểu những phụ nữ là thành phần được nêu bật trong đoàn người và chuẩn bị rõ sở chỉ giống cái của đại từ quan hệ tiếp theo.
- source_word: αἳ
  choice: những phụ nữ đang
  rationale: Lặp lại danh từ trong cấu trúc tiếng Việt để cho thấy mệnh đề sau chỉ nói riêng về các phụ nữ, đúng với đại từ quan hệ giống cái số nhiều.
- source_word: ἐκόπτοντο
  choice: đấm ngực
  rationale: Trong bối cảnh tang thương, động từ chỉ hành động tự đấm mình, theo tập tục biểu lộ đau buồn; “đấm ngực” truyền đạt rõ hành động cụ thể.
- source_word: ἐθρήνουν
  choice: than khóc
  rationale: Diễn tả sự than vãn, khóc lóc vì đau buồn; đây là cách nói hiện đại, dễ hiểu và vẫn giữ sắc thái hữu thanh của lời ai oán.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đối tượng của việc than khóc là Đức Giê-su. “Ngài” là đại từ tôn kính, trang trọng và thông dụng trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Sở chỉ của mệnh đề αἳ ἐκόπτοντο καὶ ἐθρήνουν
  choice: chỉ riêng những phụ nữ
  alternative: toàn thể đoàn dân và những phụ nữ
  rationale: Đại từ quan hệ αἳ ở giống cái số nhiều quy chiếu trực tiếp đến γυναικῶν, nên các hành động đấm ngực và than khóc được gán cho những phụ nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đoàn dân đông” tự nhiên hơn một chuỗi sở hữu sát chữ; dấu chấm phẩy giữ mạch kể và làm nổi bật nhóm phụ nữ. Không cần chú thích.
