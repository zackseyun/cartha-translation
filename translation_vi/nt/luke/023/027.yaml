  terminology: “Đức Giê-su” và đại từ “Ngài” phù hợp văn phong Kinh Thánh trang trọng hiện đại. “Đấm ngực” là cách diễn đạt rõ ràng, phù hợp với κόπτομαι trong ngữ cảnh tang khóc; “than khóc Ngài” bảo toàn đối tượng trực tiếp của động từ Hy Lạp.
