  verdict: revise
  source_fidelity: Bản dịch xác định đúng chủ thể đi theo Đức Giê-su, quy chiếu đúng mệnh đề quan hệ giống cái số nhiều chỉ riêng các phụ nữ, và diễn đạt đúng hai hành động than khóc mang tính tiếp diễn. Cách hiểu “trong đó có những phụ nữ” truyền đạt tự nhiên quan hệ giữa đám đông và nhóm phụ nữ được nêu bật, không làm thay đổi ý nghĩa.
