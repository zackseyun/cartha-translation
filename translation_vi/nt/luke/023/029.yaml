  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: vi
  text: 'Vì kìa, những ngày sắp đến, khi người ta sẽ nói: “Phước cho những phụ nữ son sẻ, những dạ con chưa từng sinh nở và những bầu vú chưa từng cho bú!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: này
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của từ Hy Lạp, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: Μακάριαι
  choice: Phước cho
  rationale: Diễn đạt lời tuyên bố về tình trạng đáng được xem là có phước, không biến thành lời cầu chúc.
- source_word: αἱ στεῖραι
  choice: những phụ nữ son sẻ
  rationale: Tính từ được dùng như danh từ chỉ những người nữ không sinh con; thêm “phụ nữ” để câu tiếng Việt rõ và tự nhiên.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: những dạ con chưa từng sinh nở
  rationale: Giữ hình ảnh bộ phận cơ thể và phép song hành của nguyên văn; “chưa từng” truyền đạt sự phủ định trong toàn bộ kinh nghiệm quá khứ.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: những bầu vú chưa từng cho bú
  rationale: Trong ngữ cảnh này, ἔθρεψαν nói đến việc nuôi trẻ bằng sữa mẹ; “cho bú” là cách diễn đạt trực tiếp, tự nhiên.
theological_decisions:
- issue: Nghịch lý gọi người son sẻ là có phước trong bối cảnh tai họa sắp đến
  choice: Giữ nguyên lời tuyên bố “Phước cho” mà không giải thích thêm trong câu
  alternative: Diễn giải thành “may mắn hơn” hoặc nói rõ rằng họ tránh được đau khổ vì con cái
  rationale: Nguyên văn cố ý đảo ngược quan niệm thông thường về phước lành do mức độ khủng khiếp của tai họa; bản dịch không nên tự ý giải quyết hay làm nhẹ sức căng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc ba vế song hành của nguyên văn. “Dạ con” và “bầu vú” duy trì hình ảnh cụ thể, mạnh mẽ, phù hợp với lời tiên báo bi thương.
