  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: vi
  text: 'và nói: “Nếu ông là Vua của người Do Thái[a], hãy tự cứu mình đi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vua của người Giu-đê.” Từ Hy Lạp Ἰουδαίων có thể chỉ người Do Thái hoặc người Giu-đê, tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối lời nói này với hành động của những người lính trong câu trước.
- source_word: λέγοντες
  choice: nói
  rationale: Phân từ hiện tại chủ động bổ nghĩa cho chủ thể số nhiều ở câu trước. Dịch là “nói” giữ nguyên nghĩa, không đưa sắc thái nhạo báng từ văn cảnh vào chính động từ.
- source_word: Εἰ
  choice: Nếu
  rationale: Mở đầu lời thách thức mang tính điều kiện; “nếu” giữ được giọng chế nhạo mà không hàm ý người nói thừa nhận lời tuyên xưng.
- source_word: σὺ εἶ
  choice: ông là
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp để tạo nhấn mạnh. Tiếng Việt tự nhiên dùng “ông là”; cách xưng hô “ông” phù hợp với lời của quân lính nói với một người trưởng thành trong ngữ cảnh chế giễu.
- source_word: ὁ βασιλεὺς
  choice: Vua
  rationale: Chỉ tước hiệu quân vương cụ thể đang được dùng để thách thức Chúa Giê-xu; viết hoa theo chức danh trong cụm tước hiệu.
- source_word: τῶν Ἰουδαίων
  choice: dân Do Thái
  rationale: Trong trình thuật thương khó, cụm này là tước hiệu chính trị–Mê-si được dùng trong lời cáo buộc và chế nhạo. “Dân Do Thái” là cách diễn đạt quen thuộc và tự nhiên, còn nghĩa địa vực “người Giu-đê” được giữ trong chú thích.
- source_word: σῶσον
  choice: hãy cứu
  rationale: Mệnh lệnh cách aorist ngôi hai số ít; “hãy cứu” truyền đạt trực tiếp mệnh lệnh và giữ liên hệ với cách dùng rộng hơn của động từ σῴζω trong Lu-ca.
- source_word: σεαυτόν
  choice: tự ... mình
  rationale: Đại từ phản thân làm tân ngữ; cấu trúc “tự cứu mình” là cách diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách dịch tước hiệu mang tính chế nhạo βασιλεὺς τῶν Ἰουδαίων
  choice: Vua dân Do Thái
  alternative: vua của người Giu-đê
  rationale: Cụm từ là một tước hiệu đầy hàm ý trong bối cảnh đóng đinh, gắn với cáo buộc chống lại Chúa Giê-xu và tính trớ trêu về vương quyền của Ngài. “Vua dân Do Thái” phản ánh cách hiểu dân tộc phổ biến, đồng thời chú thích giữ lại khả năng mang sắc thái địa vực của Ἰουδαῖος.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu hai chấm dẫn lời nói trực tiếp tự nhiên hơn việc tái tạo máy móc phân từ Hy Lạp. Tiểu từ “đi” ở cuối mệnh lệnh làm rõ giọng thách thức trong tiếng Việt mà không thêm nội dung thần học.
