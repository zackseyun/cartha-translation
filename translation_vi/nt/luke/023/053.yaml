  terminology: Dùng “vải lanh” cho σινδών. Giữ “Đức Chúa Jêsus” và “Ngài” theo hệ thuật ngữ của bản thảo, không thêm khẳng định thần học nào ngoài quy chiếu nhân vật đã rõ từ ngữ cảnh. “Ngôi mộ được đục trong đá” phản ánh λαξευτός mà không áp đặt chi tiết ngoài văn bản.
  issues:
