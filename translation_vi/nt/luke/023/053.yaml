  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: vi
  text: Sau khi hạ Đức Chúa Jêsus xuống, ông quấn Ngài trong một tấm vải lanh, rồi đặt Ngài vào một ngôi mộ được đục trong đá[a], nơi chưa từng có ai được đặt nằm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một ngôi mộ được đẽo” hoặc “một ngôi mộ đục vào vách đá.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “nơi chưa có ai nằm.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: hạ thi thể Đức Chúa Jêsus xuống
  rationale: Phân từ bất định chỉ hành động đưa thi thể xuống trước khi quấn và đặt vào mộ. Nêu “thi thể” làm rõ đối tượng theo ngữ cảnh đóng đinh mà không thêm chi tiết ngoài ý câu.
- source_word: ἐνετύλιξεν
  choice: quấn
  rationale: Diễn đạt tự nhiên hành động bọc thi thể bằng vải trong bối cảnh mai táng.
- source_word: σινδόνι
  choice: trong một tấm vải gai
  rationale: σινδών chỉ một tấm vải lanh dùng để quấn; “vải gai” là cách gọi phổ thông trong tiếng Việt Kinh Thánh, không diễn giải quá mức thành một loại khăn liệm chuyên biệt.
- source_word: ἔθηκεν
  choice: đặt
  rationale: Giữ nghĩa cơ bản của τίθημι và giọng văn trang trọng, tự nhiên.
- source_word: μνήματι
  choice: vào một ngôi mộ
  rationale: μνῆμα là nơi chôn cất; “ngôi mộ” phù hợp bối cảnh mộ đá thế kỷ thứ nhất.
- source_word: λαξευτῷ
  choice: đục trong đá
  rationale: λαξευτός mô tả vật được đẽo hoặc đục; cách dịch này truyền đạt rõ ngôi mộ được tạo trong đá mà không dùng từ cổ.
- source_word: οὗ
  choice: nơi
  rationale: Đại từ/trạng từ quan hệ quy chiếu về ngôi mộ; “nơi” tự nhiên trong tiếng Việt.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: nơi chưa từng chôn cất ai
  rationale: Trong ngữ cảnh mộ phần, cách nói này diễn đạt tự nhiên rằng trước đó chưa có người nào được đặt nằm trong mộ; chú thích giữ cách hiểu sát hình ảnh “nằm”.
theological_decisions:
- issue: Mô tả việc mai táng và tình trạng chưa sử dụng của ngôi mộ
  choice: Giô-sép đặt thi thể Đức Chúa Jêsus trong một ngôi mộ đục trong đá, nơi chưa từng chôn cất ai.
  alternative: Giô-sép đặt Ngài trong một ngôi mộ đẽo, nơi chưa có ai nằm.
  rationale: Câu này mang tính tường thuật. Bản dịch giữ các chi tiết được văn bản Hy Lạp nêu, không bổ sung dữ kiện từ các sách Phúc Âm song song hay suy luận thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để xác định đối tượng của đại từ theo ngữ cảnh; dùng “thi thể” vì hành động hạ xuống và mai táng diễn ra sau khi Ngài đã chết. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
