  to: Sau khi hạ Đức Chúa Jêsus xuống, ông quấn Ngài trong một tấm vải lanh, rồi đặt Ngài vào một ngôi mộ được đục trong đá[a], nơi chưa từng có ai được đặt nằm[b].
