review_pass:
  verdict: revise
  source_fidelity: Cấu trúc hành động trước–sau của phân từ καθελὼν và các động từ chính được giữ tốt; μνῆμα λαξευτόν được diễn đạt đúng là mộ được đục trong đá, và mệnh đề cuối bảo toàn ý ngôi mộ chưa được dùng để đặt bất cứ ai. Tuy nhiên, σινδών là vải lanh, không phải “vải gai”; “vải gai” thường gợi loại vải thô từ sợi gai/bố và không phải tương đương từ vựng an toàn ở đây.
