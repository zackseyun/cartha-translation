  source_fidelity: 'Bản dịch truyền đạt đúng diễn tiến và các thành tố chính của câu: đến địa điểm, địa danh Κρανίον, việc đóng đinh, và hai κακοῦργοι được phân bố ở hai phía. Tuy nhiên, cách nói “cùng với” hơi chuyển quan hệ đẳng lập trong nguyên văn thành một trạng ngữ phụ; bản sửa giữ rõ cả Ngài lẫn hai tội phạm đều là đối tượng của động từ. Chú thích b cũng cần diễn đạt sát và tự nhiên hơn về kết cấu phân bố của tiếng Hy Lạp.'
  naturalness: “Hai tên tội phạm” và “một tên” có sắc thái miệt thị không cần thiết; “hai tội phạm, một người...” là tiếng Việt hiện đại, trung tính và mạch lạc hơn. Cấu trúc câu được chỉnh để tránh lối ghép “cùng với” và để điểm neo chú thích b đứng ngay sau cụm được chú giải.
