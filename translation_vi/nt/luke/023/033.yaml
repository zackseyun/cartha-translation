  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: vi
  text: Khi họ đến nơi gọi là Sọ[a], tại đó họ đóng đinh Ngài và hai tội phạm vào thập tự giá, một người ở bên phải và một người ở bên trái.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nơi gọi là Cái Sọ.” Tên gọi Hy Lạp Κρανίον có nghĩa đen là “sọ”.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “một người ở bên phải, còn một người ở bên trái.” Bản Hy Lạp không nói rõ “bên phải của Ngài” và “bên trái của Ngài”, dù điều đó được hàm ý trong ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: đến
  rationale: Động từ ἔρχομαι ở thì aorist trong văn thuật chuyện được diễn đạt tự nhiên là “đến”; ngữ cảnh đã bao hàm ý tới nơi.
- source_word: ἐπὶ τὸν τόπον
  choice: đến nơi
  rationale: Sau động từ chỉ sự chuyển động, ἐπί với đối cách diễn tả hướng tới địa điểm; tiếng Việt tự nhiên gộp thành “đến nơi”.
- source_word: τὸν καλούμενον Κρανίον
  choice: nơi gọi là Sọ
  rationale: Κρανίον có nghĩa đen là “sọ”. Dịch nghĩa giữ được nội dung của địa danh mà không đưa vào hình thức truyền thống từ các sách Phúc Âm song song.
- source_word: ἐσταύρωσαν
  choice: đóng đinh Ngài vào thập tự giá
  rationale: Đây là cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt cho σταυρόω, chỉ việc hành hình bằng thập tự giá.
- source_word: κακούργους
  choice: hai tên tội phạm
  rationale: κακοῦργος chỉ người phạm tội hay kẻ làm điều ác. “Tội phạm” hiện đại và chính xác hơn các cách dịch có thể thu hẹp nghĩa thành “kẻ cướp”; “hai” được làm rõ từ kết cấu phân phối tiếp theo.
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: một tên bên phải và một tên bên trái
  rationale: Kết cấu tương liên phân bố hai người theo vị trí. Không thêm “của Ngài” vì đại từ sở hữu không có trong bản Hy Lạp, dù ngữ cảnh hàm ý điều đó.
theological_decisions:
- issue: Cách dịch Κρανίον
  choice: Sọ
  alternative: Cái Sọ; Cranion
  rationale: Dịch nghĩa danh xưng địa điểm bảo toàn ý nghĩa trực tiếp của từ Hy Lạp và tránh nhập vào tên gọi truyền thống bắt nguồn từ ngôn ngữ khác.
- issue: Cách gọi hai người cùng chịu đóng đinh
  choice: tội phạm
  alternative: kẻ làm ác; kẻ cướp
  rationale: “Tội phạm” giữ độ rộng nghĩa của κακοῦργοι và không đồng nhất hóa cách dùng từ của Lu-ca với thuật ngữ trong các trình thuật song song.
- issue: Chủ thể được đóng đinh
  choice: Ngài
  alternative: ông ấy; Người
  rationale: Đại từ αὐτόν tự nó chỉ ngôi thứ ba giống đực. “Ngài” phù hợp văn phong Kinh Thánh tiếng Việt trang trọng và quy chiếu rõ đến Chúa Giê-su, nhưng không bổ sung một tước hiệu thần học vào câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “đóng đinh ... vào thập tự giá” theo cách nói Kinh Thánh quen thuộc; tránh từ cổ như “gian phi” và tránh thu hẹp κακούργους thành “kẻ cướp”. Mọi dấu chú thích [a], [b] đều xuất hiện trong chính văn.
