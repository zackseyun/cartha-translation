source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: vi
  text: 'Khi viên đại đội trưởng thấy điều đã xảy ra, ông tôn vinh Đức Chúa Trời và nói: “Quả thật, người này là công chính[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vô tội” hoặc “ngay chính.” Từ Hy Lạp ở đây có thể chỉ sự công chính về đạo đức hoặc sự vô tội về phương diện pháp lý.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Khi ... thấy
  rationale: Phân từ bất định quá khứ được diễn đạt tự nhiên bằng mệnh đề thời gian, giữ quan hệ với động từ chính.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: Đây là liên từ nhẹ nối tiếp câu chuyện; cấu trúc tiếng Việt đã thể hiện mạch kể, nên thêm “bấy giờ” hay “nhưng” sẽ dễ nhấn quá mức.
- source_word: ὁ ἑκατοντάρχης
  choice: viên đội trưởng
  rationale: Cách gọi quen thuộc, trang trọng và dễ hiểu trong tiếng Việt dành cho sĩ quan La Mã chỉ huy một đơn vị khoảng một trăm quân.
- source_word: τὸ γενόμενον
  choice: điều đã xảy ra
  rationale: Diễn đạt tự nhiên nội dung của phân từ có mạo từ, chỉ sự việc viên sĩ quan vừa chứng kiến.
- source_word: ἐδόξαζεν
  choice: tôn vinh
  rationale: Giữ nghĩa mạnh của δοξάζω đối với Đức Chúa Trời; thể chưa hoàn thành không nhất thiết phải khai triển thành “bắt đầu tôn vinh” trong ngữ cảnh này.
- source_word: τὸν θεὸν
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, phổ thông trong văn phong Kinh Thánh tiếng Việt.
- source_word: λέγων
  choice: và nói
  rationale: Chuyển phân từ giới thiệu lời nói thành kết cấu phối hợp tự nhiên trong tiếng Việt.
- source_word: Ὄντως
  choice: Quả thật
  rationale: Thể hiện lời khẳng định mạnh mà vẫn tự nhiên và trang trọng.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: người này
  rationale: Diễn đạt trực tiếp, tự nhiên, không thêm nội dung ngoài bản Hy Lạp.
- source_word: δίκαιος
  choice: người công chính
  rationale: Giữ sắc thái luân lý và thần học rộng của từ Hy Lạp; nghĩa pháp lý “vô tội” được bảo lưu trong chú thích.
- source_word: ἦν
  choice: là
  rationale: Trong lời nhận định tiếng Việt, “là” tự nhiên hơn “đã là”; ngữ cảnh quá khứ đã rõ mà không cần đánh dấu cứng nhắc.
theological_decisions:
- issue: Ý nghĩa của δίκαιος trong lời xác nhận của viên đội trưởng
  choice: người công chính
  alternative: vô tội; ngay chính
  rationale: “Công chính” bảo toàn chiều kích đạo đức và thần học của từ, trong khi ngữ cảnh xét xử cũng cho phép hiểu là “vô tội.” Chú thích giữ lại độ mở ấy thay vì quyết định dứt khoát theo một hướng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Câu văn đi theo trật tự kể chuyện tự nhiên của tiếng Việt; không thêm một từ tương đương “bấy giờ” cho δέ. Dấu chú thích được đặt ngay sau cụm từ có phương án dịch khác.
