revisions:
- from: 'Khi viên đội trưởng thấy điều đã xảy ra, ông tôn vinh Đức Chúa Trời và nói: “Quả thật, người này là người công chính[a].”'
  to: 'Khi viên đại đội trưởng thấy điều đã xảy ra, ông tôn vinh Đức Chúa Trời và nói: “Quả thật, người này là công chính[a].”'
  rationale: Sửa chức danh của viên sĩ quan để phản ánh chính xác ἑκατοντάρχης, đồng thời bỏ sự lặp từ không cần thiết trong lời nói trực tiếp. Giữ nguyên cách dịch “công chính” và chú thích nhằm không quyết định thay cho bản văn giữa sắc thái đạo đức/thần học và sắc thái vô tội theo pháp lý.
  reviewer_model: gpt-5.6-terra
