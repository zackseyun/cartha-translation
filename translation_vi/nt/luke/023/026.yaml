id: LUK.23.26
reference: Luke 23:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: vi
  text: Khi họ dẫn Ngài đi, họ bắt một người Sy-ren tên là Si-môn, đang từ miền quê đi vào[a]. Họ đặt thập tự giá[b] lên ông để ông vác theo sau Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đang từ cánh đồng đi vào.” Từ Hy Lạp có thể chỉ một cánh đồng cụ thể hoặc nói rộng hơn về miền quê bên ngoài thành.
    reason: lexical_alternative
  - marker: b
    text: Một số người hiểu “thập tự giá” ở đây cụ thể là “thanh ngang của thập tự giá,” nhưng bản Hy Lạp chỉ nói “thập tự giá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: dẫn ... đi
  rationale: Động từ ἀπάγω chỉ việc dẫn hoặc đưa một người đi; cách dịch này tự nhiên và vẫn phù hợp với bối cảnh Giê-su đang bị áp giải.
- source_word: ἐπιλαβόμενοι
  choice: bắt
  rationale: Phân từ ἐπιλαμβάνομαι diễn tả việc túm hoặc giữ lấy một người; “bắt” truyền đạt ngắn gọn tính cưỡng ép của hành động.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: một người Sy-ren tên là Si-môn
  rationale: τινα giới thiệu một người trước đó chưa được xác định; Κυρηναῖον cho biết ông là người thuộc Sy-ren.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: đang từ miền quê đi vào
  rationale: ἀγρός có thể chỉ một cánh đồng cụ thể hoặc vùng nông thôn; “miền quê” tự nhiên trong tiếng Việt và phù hợp với ý ông đang đi từ ngoài thành vào.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: đặt thập tự giá lên ông
  rationale: Giữ hình ảnh gánh nặng bị đặt lên Si-môn mà không thêm chi tiết “lên vai”, vốn không có trong bản Hy Lạp.
- source_word: τὸν σταυρὸν
  choice: thập tự giá
  rationale: σταυρός có nghĩa trực tiếp là thập tự giá; không thu hẹp thành “thanh ngang” dựa trên một sự tái dựng lịch sử.
- source_word: φέρειν
  choice: vác
  rationale: Trong ngữ cảnh mang một thập tự giá nặng, “vác” tự nhiên và cụ thể hơn “mang” mà vẫn thể hiện đúng hành động φέρειν.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: theo sau Giê-su
  rationale: ὄπισθεν chủ yếu chỉ vị trí ở phía sau; “theo sau” diễn đạt tự nhiên vị trí của Si-môn trong đoàn người.
theological_decisions:
- issue: Có nên dịch σταυρός cụ thể là “thanh ngang của thập tự giá” hay không
  choice: thập tự giá
  alternative: thanh ngang của thập tự giá
  rationale: Bản văn dùng từ σταυρός, không dùng một thuật ngữ riêng cho thanh ngang. Vì vậy, bản dịch giữ nghĩa trực tiếp và không đưa một giả thuyết lịch sử vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Giê-su” theo lối phiên âm tiếng Việt hiện nay, không thêm tước hiệu không có trong câu Hy Lạp. Đại từ “Ngài” ở đầu câu giúp nối với ngữ cảnh trước và tránh lặp tên quá sớm; tên Giê-su vẫn được nêu rõ ở cuối câu theo bản nguồn.
