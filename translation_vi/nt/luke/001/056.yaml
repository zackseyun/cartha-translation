source:
  edition: SBLGNT
  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: vi
  text: Ma-ri ở lại với bà khoảng ba tháng, rồi trở về nhà mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: ở lại
  rationale: Động từ μένω ở thì aorist diễn tả việc tiếp tục lưu lại một nơi trong một khoảng thời gian; “ở lại” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: rồi
  rationale: δέ là liên từ nhẹ nối tiếp mạch kể. Trong câu tiếng Việt, “rồi” giúp liên kết hai hành động theo diễn tiến tự nhiên mà không tạo sắc thái tương phản.
- source_word: Μαριὰμ
  choice: Ma-ri
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt và dễ đọc đối với độc giả phổ thông.
- source_word: σὺν αὐτῇ
  choice: với bà
  rationale: σύν với đối cách gián tiếp biểu thị sự đồng hành. Đại từ αὐτῇ chỉ Ê-li-sa-bét trong ngữ cảnh; “bà” là đại từ tự nhiên và tôn trọng trong tiếng Việt.
- source_word: ὡς μῆνας τρεῖς
  choice: khoảng ba tháng
  rationale: ὡς đứng trước một đơn vị đo thời gian biểu thị sự ước lượng; “khoảng ba tháng” truyền đạt trực tiếp sắc thái không hoàn toàn chính xác.
- source_word: ὑπέστρεψεν
  choice: trở về
  rationale: Động từ ὑποστρέφω chỉ việc quay lại nơi trước đó; “trở về” phù hợp với hướng chuyển động về nhà và văn phong kể chuyện.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: về nhà mình
  rationale: οἶκος ở đây chỉ nơi cư trú chứ không phải gia đình hay gia hộ. Cách nói “về nhà mình” tự nhiên trong tiếng Việt và làm rõ rằng đó là nhà của Ma-ri.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Không thêm chú thích vì sắc thái ước lượng của ὡς đã được thể hiện rõ bằng từ “khoảng”; do đó không cần một phương án thay thế trùng lặp.
