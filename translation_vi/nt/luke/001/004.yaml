translation:
  language: vi
  text: để ngài biết chắc về những điều ngài đã được chỉ dạy.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để ngài biết sự đáng tin cậy của những điều ngài đã được chỉ dạy”; danh từ Hy Lạp có thể chỉ sự chắc chắn, sự vững chắc hoặc sự đáng tin cậy.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đã được dạy”; động từ Hy Lạp này chỉ việc được truyền dạy, đặc biệt bằng lời nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Mở đầu mệnh đề chỉ mục đích của Lu-ca một cách tự nhiên và rõ ràng trong tiếng Việt.
- source_word: ἐπιγνῷς
  choice: ngài biết
  rationale: Diễn đạt tự nhiên động từ ở thể giả định trong mệnh đề mục đích; không thêm sắc thái “biết đầy đủ,” vì như vậy có thể nhấn quá mức tiền tố của động từ.
- source_word: περὶ ὧν
  choice: về những điều
  rationale: Giữ quan hệ quy chiếu của περί với nội dung mà Thê-ô-phi-lơ đã được dạy.
- source_word: κατηχήθης
  choice: mình đã được chỉ dạy
  rationale: Thể bị động nói đến việc tiếp nhận sự dạy dỗ, có thể bằng lời; “chỉ dạy” là cách nói hiện đại, trang trọng vừa phải và không đưa thuật ngữ giáo hội về sau vào chính văn.
- source_word: λόγων
  choice: những điều
  rationale: Trong cấu trúc này, λόγων chỉ nội dung hay các vấn đề đã được truyền dạy hơn là riêng từng “lời”; cách dịch này tự nhiên trong tiếng Việt.
- source_word: τὴν ἀσφάλειαν
  choice: biết chắc
  rationale: Chuyển danh từ Hy Lạp thành kết cấu động từ tiếng Việt tự nhiên, đồng thời giữ ý về sự chắc chắn và đáng tin của điều đã được dạy.
theological_decisions:
- issue: Bản chất mục đích Lu-ca nêu khi viết
  choice: “biết chắc” để ngỏ cả sự xác tín của người tiếp nhận lẫn tính chắc chắn, đáng tin của nội dung đã được dạy
  alternative: Chỉ nhấn mạnh sự bảo đảm chủ quan, hoặc chỉ nhấn mạnh độ xác thực lịch sử khách quan
  rationale: ἀσφάλεια có thể biểu thị sự chắc chắn, an toàn hoặc độ đáng tin; không nên thu hẹp dụng ý của câu vào một phương diện duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “ngài” phù hợp với lời đề tặng dành cho Thê-ô-phi-lơ trong văn mạch; “mình” tránh lặp đại từ và vẫn tự nhiên. Hai chú thích bảo toàn các khả năng từ vựng của ἀσφάλεια và κατηχέω.
