  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: vi
  text: Người sẽ khiến nhiều con trai Israel quay về với Chúa, là Đức Chúa Trời của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con cái Israel” hoặc “người Israel.” Tiếng Hy Lạp chép sát nghĩa là “các con trai Israel,” một cách diễn đạt giao ước có tính truyền thống.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Người sẽ
  rationale: Trong tiếng Việt, không nhất thiết giữ liên từ ở đầu câu khi câu vẫn tiếp nối tự nhiên; đại từ “Người” nối trực tiếp với chủ thể là Giăng trong văn cảnh trước.
- source_word: πολλοὺς
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ; “nhiều người” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: trong số các con trai Israel
  rationale: Giữ hình ảnh giao ước theo sát tiếng Hy Lạp “các con trai Israel,” đồng thời dùng “trong số” để diễn đạt tự nhiên cấu trúc sở thuộc chỉ thành phần.
- source_word: ἐπιστρέψει
  choice: sẽ khiến … quay về
  rationale: 'Động từ tương lai chủ động có lực tác động: Giăng khiến nhiều người đổi hướng/quay lại; cách dịch này tránh biến nó thành hành động hoàn toàn nội động và không thêm thuật ngữ diễn giải như “cải đạo.”'
- source_word: ἐπὶ
  choice: về với
  rationale: Sau ἐπιστρέφω, giới từ diễn tả sự chuyển hướng đến một đối tượng; “quay về với” tự nhiên và giữ sắc thái trở lại.
- source_word: κύριον
  choice: Chúa
  rationale: Trong ngữ cảnh này, κύριος chỉ Đức Chúa Trời của Israel chứ không phải một chủ nhân loài người.
- source_word: τὸν θεὸν αὐτῶν
  choice: là Đức Chúa Trời của họ
  rationale: Cụm này đồng vị với “Chúa”; thêm “là” làm rõ quan hệ đồng vị trong tiếng Việt mà không thay đổi ý nghĩa giao ước.
theological_decisions:
- issue: Cách dịch thành ngữ giao ước τῶν υἱῶν Ἰσραήλ
  choice: các con trai Israel
  alternative: con cái Israel; người Israel
  rationale: Bản dịch chính giữ nguyên hình thức giống đực và âm hưởng Kinh Thánh của nguyên văn, trong khi chú thích nêu những cách diễn đạt tiếng Việt tự nhiên hơn.
- issue: Đối tượng của κύριον τὸν θεὸν αὐτῶν
  choice: Chúa là Đức Chúa Trời của họ
  alternative: Chúa, Đức Chúa Trời của họ
  rationale: Cụm Hy Lạp xác định Chúa chính là Đức Chúa Trời của Israel; “là” thể hiện rõ quan hệ đồng vị, không hiểu κύριος theo nghĩa một chủ nhân loài người.
- issue: Lực tác động của ἐπιστρέψει
  choice: sẽ khiến … quay về
  alternative: sẽ đưa … trở lại; sẽ làm … quay lại
  rationale: Giữ Giăng là tác nhân trong cấu trúc chủ động gây khiến, nhưng không giải thích cơ chế thần học của sự quay về.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quay về với” giữ sắc thái trở lại cùng Đức Chúa Trời; “các con trai Israel” được giữ trong câu chính vì giá trị liên văn bản, với các cách nói tự nhiên hơn ở chú thích.
