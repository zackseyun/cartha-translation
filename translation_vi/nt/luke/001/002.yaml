  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: vi
  text: đúng như những người ngay từ đầu đã là nhân chứng tận mắt và đã trở thành những người phục vụ lời ấy truyền lại cho chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ điệp ấy”. Từ Hy Lạp λόγος có thể mang nghĩa “lời”, “sứ điệp” hoặc “lời tường thuật”; tại đây, từ này có lẽ chỉ sứ điệp được công bố về Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn đạt tự nhiên quan hệ tương ứng với mệnh đề trước, đồng thời giữ lực liên kết của καθὼς.
- source_word: παρέδοσαν
  choice: truyền lại
  rationale: Trong ngữ cảnh này, παραδίδωμι nói về việc chuyển giao thông tin hoặc truyền thống đã được tiếp nhận; “truyền lại” rõ và tự nhiên trong tiếng Việt.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: Giữ nguyên ngôi thứ nhất số nhiều và chức năng tân ngữ gián tiếp.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: những người ngay từ đầu
  rationale: Giữ cả ý chỉ nhóm người và mốc thời gian, không xác định thêm “đầu” là thời điểm cụ thể nào.
- source_word: αὐτόπται
  choice: nhân chứng tận mắt
  rationale: Diễn đạt việc trực tiếp chứng kiến bằng một cụm từ rõ ràng, thông dụng trong tiếng Việt hiện đại.
- source_word: ὑπηρέται
  choice: những người phục vụ
  rationale: Phản ánh ý nghĩa phục vụ mà không áp đặt một chức vụ chính thức trong cơ cấu giáo hội.
- source_word: γενόμενοι
  choice: đã trở thành
  rationale: Giữ rõ sắc thái chuyển biến của phân từ γενόμενοι thay vì làm phẳng thành “là”; cách sắp xếp tiếng Việt cho thấy họ vốn là nhân chứng từ đầu rồi trở thành người phục vụ lời ấy.
- source_word: τοῦ λόγου
  choice: lời ấy
  rationale: “Lời” giữ được độ rộng nghĩa của λόγος; từ “ấy” giúp cụm từ tự nhiên hơn và hướng về nội dung đã được nhắc trong văn mạch, nhưng không thu hẹp hẳn thành “sứ điệp”.
theological_decisions:
- issue: Đối tượng được gọi là “lời” (τοῦ λόγου)
  choice: Giữ “lời ấy” trong chính văn, nhiều khả năng chỉ sứ điệp được công bố về Chúa Giê-su.
  alternative: “sứ điệp ấy” hoặc “lời tường thuật ấy”
  rationale: Ngữ cảnh thiên về sứ điệp được truyền lại hơn là danh hiệu thần học “Ngôi Lời”. Viết thường và thêm chú thích giữ được độ rộng từ vựng mà không đồng nhất hóa λόγος với một cách hiểu Kitô học cụ thể.
- issue: Quan hệ của γενόμενοι với “nhân chứng” và “những người phục vụ”
  choice: Diễn đạt “đã là nhân chứng tận mắt và đã trở thành những người phục vụ”.
  alternative: “đã trở thành những nhân chứng tận mắt và những người phục vụ” hoặc “là những nhân chứng tận mắt và những người phục vụ”
  rationale: Hình thức Hy Lạp có thể được liên hệ về mặt ngữ pháp với cả hai danh từ, nhưng trật tự và ý nghĩa trong văn cảnh thuận với việc họ chứng kiến từ đầu rồi đảm nhận vai trò phục vụ lời. Bản dịch vẫn giữ hai mô tả trong cùng một nhóm người.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nhân chứng tận mắt” thay cho lối diễn đạt cổ; viết “lời” bằng chữ thường để tránh gợi rằng đây nhất thiết là danh hiệu “Ngôi Lời”. Dấu chú thích [a] xuất hiện ngay sau câu chính.
