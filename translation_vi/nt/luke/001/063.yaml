  rationale: Sửa cách quy chiếu đứa trẻ từ “nó” thành “cậu bé” để bảo đảm cách nói hiện đại, tự nhiên và tôn trọng. Giữ trật tự “Giăng là...” để phản ánh sự nổi bật của Ἰωάννης trong nguyên văn. Rút chú thích về nhận xét ngôn ngữ của chính câu, không thêm diễn giải thần học từ ngữ cảnh.
