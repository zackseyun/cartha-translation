  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: vi
  text: 'Ông xin một tấm bảng nhỏ để viết, rồi viết: “Giăng là tên của cậu bé.”[a] Tất cả đều kinh ngạc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cách nói tự nhiên hơn: “Tên cậu bé là Giăng.” Nguyên văn đặt “Giăng” ở đầu câu, làm nổi bật tên này và sắc thái khẳng định dứt khoát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτήσας
  choice: xin
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách diễn đạt “xin..., rồi...” tự nhiên trong tiếng Việt và giữ rõ trình tự.
- source_word: πινακίδιον
  choice: một tấm bảng nhỏ để viết
  rationale: Chỉ một bảng nhỏ dùng để viết; cách dịch này làm rõ công dụng và tránh liên tưởng hiện đại đến thiết bị điện tử.
- source_word: ἔγραψεν λέγων
  choice: viết rằng
  rationale: Gộp cấu trúc “viết, nói rằng” thành cách dẫn nội dung chữ viết tự nhiên trong tiếng Việt, nhưng vẫn giữ đầy đủ chức năng của λέγων.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên Kinh Thánh đã quen thuộc trong tiếng Việt cho Ἰωάννης.
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: là tên của nó
  rationale: Kết hợp với trật tự “Giăng là...” để giữ sự nhấn mạnh của nguyên văn vào chính tên được ban, thay vì đảo thành câu tiếng Việt thông dụng hơn.
- source_word: ἐθαύμασαν πάντες
  choice: Mọi người đều kinh ngạc
  rationale: Diễn đạt tự nhiên phản ứng sửng sốt của toàn thể những người hiện diện và bảo toàn sắc thái tập thể của πάντες.
theological_decisions:
- issue: Sự nhấn mạnh vào tên do Đức Chúa Trời truyền đặt
  choice: “Giăng là tên của nó”
  alternative: “Tên nó là Giăng”
  rationale: Giữ trật tự từ nổi bật của tiếng Hy Lạp mà không diễn giải thì hiện tại thành ý tương lai “sẽ là”; câu dịch bảo toàn tính quả quyết trong lời viết của Xa-cha-ri.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “Giăng là tên của nó” hơi khác khẩu ngữ thông thường nhưng được giữ có chủ ý để phản ánh sự nhấn mạnh trong nguyên văn; chú thích cung cấp cách nói tự nhiên hơn.
