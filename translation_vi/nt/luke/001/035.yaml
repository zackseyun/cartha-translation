- from: 'Thiên sứ đáp lời cô: “Đức Thánh Linh sẽ ngự trên cô, và quyền năng của Đấng Tối Cao sẽ phủ bóng trên cô. Vì thế, Đấng Thánh sắp sinh ra[a] sẽ được gọi là Con Đức Chúa Trời[b].”'
  to: 'Thiên sứ trả lời cô: “Đức Thánh Linh sẽ đến trên cô, và quyền năng của Đấng Tối Cao sẽ che phủ cô. Vì thế, đấng thánh sắp chào đời[a] sẽ được gọi là Con Đức Chúa Trời[b].”'
  rationale: Bản sửa làm rõ rằng ἅγιον mô tả đấng/con trẻ được sinh ra, đồng thời thay cách nói hơi gượng “phủ bóng trên cô” bằng “che phủ cô”. Bản dịch vẫn giữ quan hệ nhân quả của διὸ καὶ, thể bị động của κληθήσεται, danh hiệu “Con Đức Chúa Trời”, và tính ẩn dụ kín đáo của hành động thần linh.
