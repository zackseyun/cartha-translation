reference: Luke 1:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: vi
  text: 'Thiên sứ trả lời cô: “Đức Thánh Linh sẽ đến trên cô, và quyền năng của Đấng Tối Cao sẽ che phủ cô. Vì thế, đấng thánh sắp chào đời[a] sẽ được gọi là Con Đức Chúa Trời[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đứa trẻ thánh sắp chào đời.” Cụm Hy Lạp τὸ γεννώμενον ἅγιον nói về đấng/con trẻ thánh đang được sinh ra; dạng “sắp chào đời” diễn đạt theo viễn cảnh tương lai của lời báo tin.'
    reason: lexical_alternative
  - marker: b
    text: Trong tiếng Hy Lạp, từ “Con” không có mạo từ; tuy nhiên, trong văn cảnh này, “Con Đức Chúa Trời” hoạt động như một tước hiệu, không có nghĩa “một người con của Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Thiên sứ đáp lời cô
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp “đáp và nói với cô ấy,” đồng thời giữ sắc thái đây là lời đáp. “Thiên sứ” chỉ sứ giả từ trời trong văn cảnh này.
- source_word: Πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Chỉ Thần Linh thánh của Đức Chúa Trời với tư cách tác nhân thần linh; cách gọi này trang trọng, tự nhiên và quen thuộc trong tiếng Việt hiện đại.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: sẽ ngự trên cô
  rationale: Giữ ý Thánh Linh đến trên Ma-ri trong quyền năng. “Ngự trên” phù hợp với tác nhân thần linh và tránh lối diễn đạt vụng “đến trên,” nhưng không giải thích thêm cơ chế của hành động.
- source_word: δύναμις Ὑψίστου
  choice: quyền năng của Đấng Tối Cao
  rationale: Giữ trực tiếp quan hệ sở hữu và sắc thái tước hiệu của Ὑψίστου.
- source_word: ἐπισκιάσει σοι
  choice: sẽ phủ bóng trên cô
  rationale: Bảo tồn hình ảnh bóng che phủ gắn với sự hiện diện và hành động thần linh, không đưa vào hàm ý sinh học hay tính dục vốn không có trong nguyên văn.
- source_word: διὸ καὶ
  choice: Vì thế
  rationale: Truyền đạt quan hệ kết quả rõ ràng trong tiếng Việt. Sắc thái καί được thể hiện tự nhiên trong toàn mệnh đề hơn là dịch máy móc thành “cũng”.
- source_word: τὸ γεννώμενον ἅγιον
  choice: Đấng Thánh sắp sinh ra
  rationale: Giữ ἅγιον gắn với nhân vật được sinh ra và diễn đạt hiện tại phân từ theo viễn cảnh tương lai của lời báo tin. “Đấng” phù hợp với tước gọi về một nhân vật, còn chú thích nêu cách diễn đạt sát cấu trúc hơn.
- source_word: κληθήσεται
  choice: sẽ được gọi là
  rationale: Giữ thể bị động và để ngỏ cả ý được xưng gọi lẫn được nhìn nhận đúng căn tính.
- source_word: υἱὸς θεοῦ
  choice: Con Đức Chúa Trời
  rationale: Trong văn cảnh, cụm không có mạo từ này mang tính phẩm định và tước hiệu, không có nghĩa bất định là một người con bất kỳ.
theological_decisions:
- issue: Tính chất của Πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  alternative: thần khí thánh
  rationale: Văn cảnh trình bày Thánh Linh là tác nhân thần linh trong việc thụ thai; bản dịch không hạ cụm này thành một sức mạnh vô ngôi, nhưng cũng không thêm một công thức tín điều ngoài lời câu.
- issue: Hình ảnh về hành động thần linh trong ἐπισκιάσει
  choice: sẽ phủ bóng trên cô
  alternative: sẽ bao phủ cô
  rationale: Giữ ẩn dụ kín đáo của nguyên văn và không áp đặt một lời giải thích sinh học hoặc tính dục.
- issue: Lực xác định và tính tước hiệu của υἱὸς θεοῦ
  choice: Con Đức Chúa Trời
  alternative: một con của Đức Chúa Trời
  rationale: Việc thiếu mạo từ trong tiếng Hy Lạp không khiến cụm này thành bất định; trong lời truyền tin, đây là tước hiệu chỉ căn tính của con trẻ.
- issue: Quan hệ cú pháp của ἅγιον với τὸ γεννώμενον
  choice: Đấng Thánh sắp sinh ra
  alternative: đứa trẻ sắp sinh ra sẽ là thánh
  rationale: Cách chọn chính đọc ἅγιον như từ bổ nghĩa cho nhân vật được sinh ra, phù hợp trật tự và cách hiểu thông thường; chú thích giữ cách diễn đạt thay thế mà không biến câu chính thành lời giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cô” khi thiên sứ nói với Ma-ri để tránh lối xưng hô cổ, đồng thời không thêm danh xưng không có trong câu. Dấu chấm thay dấu chấm phẩy để câu tiếng Việt sáng rõ hơn; quan hệ kết quả vẫn được giữ bằng “Vì thế.”
