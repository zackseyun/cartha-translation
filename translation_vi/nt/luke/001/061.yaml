  source_fidelity: 'Bản dịch chuyển đạt chính xác mệnh đề tường thuật và lời nói trực tiếp: «Họ nói với bà» phản ánh καὶ εἶπαν πρὸς αὐτήν; «Trong họ hàng của bà không có ai» diễn đạt đúng phủ định cùng ý bộ phận của οὐδείς ἐστιν ἐκ τῆς συγγενείας σου; «mang tên này» truyền đạt tự nhiên ὃς καλεῖται τῷ ὀνόματι τούτῳ. «Này» giữ đúng lực chỉ định của τούτῳ trong bối cảnh tên vừa được nêu.'
