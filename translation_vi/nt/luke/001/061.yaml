source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: vi
  text: 'Họ nói với bà: “Trong họ hàng của bà không có ai mang tên này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: Họ nói với bà
  rationale: Cách diễn đạt tự nhiên trong văn kể chuyện tiếng Việt; πρός + đối cách chỉ người được nói với. “Bà” phù hợp ngữ cảnh nói với Ê-li-sa-bét.
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: Trong họ hàng của bà không có ai
  rationale: Diễn đạt tự nhiên cấu trúc bộ phận ἐκ; συγγένεια ở đây chỉ những người có quan hệ huyết tộc, nên “họ hàng” rõ nghĩa hơn “gia đình” và không thu hẹp phạm vi.
- source_word: ὃς καλεῖται τῷ ὀνόματι τούτῳ
  choice: mang tên này
  rationale: Trong ngữ cảnh đặt tên, “mang tên” chuyển tải tự nhiên nghĩa bị động của καλέω cùng cấu trúc chỉ tên gọi, đồng thời giữ đại từ chỉ định τούτῳ là “này”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ lời thoại trực tiếp; không thêm chú giải vì các phương án như “được gọi bằng tên này” hoặc “có tên này” không tạo khác biệt ý nghĩa đáng kể cần ghi chú.
