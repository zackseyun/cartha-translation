  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: vi
  text: Ông sẽ có niềm vui và sự hân hoan, và nhiều người sẽ vui mừng khi con chào đời[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ vui mừng vì con chào đời.” Cụm từ Hy Lạp có thể chỉ dịp vui mừng hoặc nguyên do của sự vui mừng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται ... σοι
  choice: sẽ đem lại cho ông
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý rằng niềm vui và sự hân hoan sẽ đến với Xa-cha-ri, đồng thời giữ thì tương lai.
- source_word: χαρά
  choice: niềm vui
  rationale: Cách dịch thông dụng, rõ nghĩa của χαρά.
- source_word: ἀγαλλίασις
  choice: sự hân hoan
  rationale: Giữ sắc thái vui mừng mạnh mẽ, đầy phấn khởi, và phân biệt với χαρά.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Tính từ được dùng như danh từ; thêm “người” để câu tiếng Việt rõ và tự nhiên.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: khi con chào đời
  rationale: ἐπί với tặng cách có thể chỉ dịp hoặc căn nguyên của niềm vui; “khi con chào đời” diễn đạt tự nhiên sắc thái chỉ dịp mà không loại trừ hoàn toàn quan hệ nguyên nhân.
- source_word: χαρήσονται
  choice: sẽ vui mừng
  rationale: Phản ánh thể tương lai của χαίρω và duy trì liên hệ từ vựng với “niềm vui” trong vế đầu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” phù hợp với lời thiên sứ nói trực tiếp với Xa-cha-ri; dùng “con” để chỉ đứa trẻ sắp sinh trong quan hệ với ông. Dấu chú thích [a] đặt ngay sau cụm từ có cách hiểu khác.
