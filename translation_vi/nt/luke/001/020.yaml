  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: vi
  text: Và kìa, ông sẽ im lặng và không thể nói cho đến ngày những điều ấy xảy ra, vì ông đã không tin lời tôi, là những lời sẽ được ứng nghiệm vào thời điểm đã định.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “vào đúng thời điểm của chúng.” Cụm từ Hy Lạp chỉ thời điểm thích hợp hoặc đã được định để những lời ấy được ứng nghiệm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của lời thiên sứ, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: ông sẽ phải im lặng, không thể nói được
  rationale: Giữ cả trạng thái im lặng lẫn sự bất lực trong việc nói, cho thấy đây không phải sự im lặng tự nguyện.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: cho đến ngày những điều ấy xảy ra
  rationale: Diễn đạt trực tiếp giới hạn thời gian và dùng cách nói hiện đại cho γένηται.
- source_word: ἀνθ’ ὧν
  choice: vì
  rationale: Trong ngữ cảnh này, cụm từ nêu nguyên nhân của tình trạng bị câm; “vì” truyền đạt tự nhiên quan hệ nhân quả.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: ông đã không tin lời tôi
  rationale: πιστεύω với bổ ngữ chỉ lời nói ở đây nói đến việc tin điều đã được nói; “lời tôi” giữ liên hệ từ vựng với λόγοις.
- source_word: οἵτινες πληρωθήσονται
  choice: là những lời sẽ được ứng nghiệm
  rationale: Lặp lại “những lời” để làm rõ sở chỉ của đại từ quan hệ và giữ thể bị động của πληρωθήσονται.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: đúng thời điểm của chúng
  rationale: καιρός chỉ thời điểm thích hợp hoặc đã được định; cách dịch chính giữ cấu trúc quy chiếu số nhiều của αὐτῶν mà không nói rõ hơn tác nhân định thời.
theological_decisions:
- issue: Bản chất hình phạt dành cho Xa-cha-ri
  choice: Một tình trạng không thể nói do lời thiên sứ áp đặt, kéo dài đến khi các sự việc xảy ra
  alternative: Chỉ là yêu cầu tự nguyện giữ im lặng
  rationale: Sự kết hợp giữa σιωπῶν và μὴ δυνάμενος λαλῆσαι nhấn mạnh tình trạng mất khả năng nói chứ không chỉ là mệnh lệnh giữ yên lặng.
- issue: Sắc thái của καιρός
  choice: Giữ ý về thời điểm thích hợp hoặc đã được định mà không xác định tường minh ai định
  alternative: Dịch rõ là “thời điểm Đức Chúa Trời đã định”
  rationale: Ngữ cảnh có thể hàm ý sự định liệu của Đức Chúa Trời, nhưng câu Hy Lạp không nêu tác nhân; bản dịch tránh bổ sung điều không được nói trực tiếp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phù hợp với lời thiên sứ nói trực tiếp với Xa-cha-ri. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
