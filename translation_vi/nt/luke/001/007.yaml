  terminology: Tên riêng “Ê-li-sa-bét” nhất quán với lối phiên âm Kinh Thánh tiếng Việt. Các từ “con,” “vì,” “không thể sinh con,” và “cao tuổi” đều phù hợp ngữ cảnh và không áp đặt cách diễn giải giáo phái.
