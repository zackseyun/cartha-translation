id: LUK.1.7
reference: Luke 1:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: vi
  text: Nhưng họ không có con, vì Ê-li-sa-bét không thể sinh con, và cả hai đều đã cao tuổi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đã tiến xa trong những ngày của mình.”'
    reason: Giữ lại hình ảnh thành ngữ của nguyên tác phía sau cách dịch tự nhiên “đã cao tuổi”.
lexical_decisions:
- source_word: τέκνον
  choice: con
  rationale: Danh từ số ít được dịch tự nhiên là “con”; không chuyển thành số nhiều hay dùng từ trang trọng quá mức.
- source_word: καθότι
  choice: vì
  rationale: 'Diễn đạt rõ quan hệ nguyên nhân: tình trạng của Ê-li-sa-bét giải thích việc họ không có con.'
- source_word: στεῖρα
  choice: không thể sinh con
  rationale: Diễn đạt trực tiếp tình trạng hiếm muộn mà không dùng “son sẻ”, một từ có thể kém quen thuộc hoặc dễ gây cảm giác nặng nề trong tiếng Việt hiện đại.
- source_word: ἀμφότεροι
  choice: cả hai
  rationale: Giữ sự nhấn mạnh rằng điều được nói áp dụng cho cả Xa-cha-ri lẫn Ê-li-sa-bét.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: đã cao tuổi
  rationale: Cách nói tự nhiên, trang trọng và tôn trọng trong tiếng Việt, truyền đạt đúng ý của thành ngữ Hy Lạp.
- source_word: οὐκ ἦν αὐτοῖς
  choice: họ không có
  rationale: Chuyển thành ngữ sở hữu trong tiếng Hy Lạp sang cách nói tự nhiên của tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang nghiêm. Dùng “không thể sinh con” để phân biệt nguyên nhân sinh học với kết quả “không có con”; đặt “Nhưng” đầu câu để nối với lời kể trước đó. Tên riêng theo dạng phiên âm tiếng Việt quen dùng.
