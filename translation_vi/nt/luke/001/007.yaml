  source_fidelity: 'Bản dịch truyền đạt đầy đủ các thành phần của câu Hy Lạp: họ không có con; nguyên nhân là tình trạng vô sinh của Ê-li-sa-bét; và cả hai đều đã cao tuổi. “Không thể sinh con” phân biệt hợp lý tình trạng στεῖρα với kết quả “không có con.” “Nhưng” là liên từ diễn ngôn tự nhiên trong mạch văn, dù καὶ về mặt từ vựng là “và”.'
