  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: vi
  text: trong sự thánh khiết và công chính trước mặt Ngài, suốt mọi ngày trong đời chúng ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “công lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: trong
  rationale: Giữ hình ảnh về phạm vi hoặc cách thức của sự phụng sự, đồng thời tự nhiên trong cụm “trong sự thánh khiết và công chính”.
- source_word: ὁσιότητι
  choice: sự thánh khiết
  rationale: Diễn đạt phẩm chất thánh thiện, kính虔 trong mối tương quan với Đức Chúa Trời và giữ sự phân biệt với δικαιοσύνη.
- source_word: καὶ
  choice: và
  rationale: Liên từ đơn giản nối hai phẩm chất song song.
- source_word: δικαιοσύνῃ
  choice: công chính
  rationale: “Công chính” diễn đạt sự ngay thẳng phù hợp với chuẩn mực của Đức Chúa Trời trong ngữ cảnh đạo đức này; “công lý” vẫn là một khả năng từ vựng và được ghi ở chú thích.
- source_word: ἐνώπιον αὐτοῦ
  choice: trước mặt Ngài
  rationale: Cách nói tự nhiên, trang trọng, mang nghĩa sống trong sự hiện diện và dưới sự đoán xét của Đức Chúa Trời.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: suốt mọi ngày đời chúng ta
  rationale: Diễn đạt toàn bộ quãng đời mà không làm mất hình thức số nhiều “mọi ngày” của tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch δικαιοσύνη trong ngữ cảnh đạo đức ngoài thư tín Phao-lô
  choice: công chính
  alternative: công lý
  rationale: Từ này đi đôi với ὁσιότης và mô tả đời sống ngay thẳng trước mặt Đức Chúa Trời; “công chính” giữ rõ chiều kích đạo đức và giao ước hơn trong ngữ cảnh trực tiếp, còn “công lý” được bảo lưu như một nghĩa khả dĩ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” chỉ Đức Chúa Trời; câu giữ cấu trúc của một mệnh đề tiếp nối từ câu trước.
