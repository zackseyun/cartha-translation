  to: để bày tỏ lòng thương xót đối với các tổ phụ chúng ta[a] và nhớ đến giao ước thánh của Ngài.[b]
  rationale: Đổi “nhớ lại” thành “nhớ đến” để không thêm ý lặp lại vào μνησθῆναι. Đổi “với” thành “đối với” để câu tiếng Việt tự nhiên hơn, đồng thời vẫn giữ tính khái quát của quan hệ μετά trong thành ngữ “bày tỏ lòng thương xót.” Chú thích a được biên tập cho tự nhiên và chính xác hơn, còn các mốc chú thích vẫn đặt đúng tại các từ được giải thích.
