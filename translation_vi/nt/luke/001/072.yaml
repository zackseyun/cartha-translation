  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: vi
  text: để bày tỏ lòng thương xót đối với các tổ phụ chúng ta[a] và nhớ đến giao ước thánh của Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bày tỏ lòng thương xót cho các tổ phụ chúng ta”. “Các tổ phụ” chỉ các bậc cha ông, tức những tiền nhân của dân Y-sơ-ra-ên; cũng có thể hiểu là “tổ tiên chúng ta”.'
    reason: lexical_alternative
  - marker: b
    text: Trong ngôn ngữ giao ước của Kinh Thánh, việc Đức Chúa Trời “nhớ” thường không chỉ là hồi tưởng mà còn hàm ý Ngài hành động trung tín theo lời đã hứa.
    reason: cultural_note
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: bày tỏ lòng thương xót
  rationale: Thành ngữ Hy Lạp có nghĩa là thi hành hay bày tỏ lòng thương xót; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái hành động.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: với các tổ phụ chúng ta
  rationale: Giữ sát giới từ μετά với sở hữu cách là “với”, đồng thời “các tổ phụ” diễn đạt những người cha đời trước của Y-sơ-ra-ên và duy trì âm hưởng giao ước.
- source_word: μνησθῆναι
  choice: nhớ lại
  rationale: Giữ nguyên hình ảnh Kinh Thánh về việc Đức Chúa Trời nhớ giao ước, không diễn giải thẳng thành “thực hiện” hay “làm ứng nghiệm”.
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: giao ước thánh của Ngài
  rationale: διαθήκη trong văn cảnh này là giao ước của Đức Chúa Trời; ἁγίας được dịch trực tiếp là “thánh”, còn đại từ được bảo lưu.
theological_decisions:
- issue: Việc Đức Chúa Trời “nhớ” giao ước
  choice: nhớ lại giao ước thánh của Ngài
  alternative: hành động để thực hiện giao ước thánh của Ngài
  rationale: Trong ngôn ngữ giao ước của Kinh Thánh, “nhớ” thường bao hàm hành động trung tín theo lời hứa, nhưng bản văn Hy Lạp vẫn nói “nhớ”; bản dịch giữ sự hàm súc ấy.
- issue: Quan hệ của lòng thương xót với các tổ phụ
  choice: bày tỏ lòng thương xót với các tổ phụ chúng ta
  alternative: bày tỏ lòng thương xót cho các tổ phụ chúng ta
  rationale: μετά theo nghĩa đen là “với”; cách dịch chính giữ cấu trúc quan hệ có phần khác thường của nguyên văn thay vì quyết định cụ thể lòng thương xót được ban “cho” họ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tổ phụ” được giữ vì sắc thái lịch sử giao ước; “Ngài” dùng cho đại từ quy chiếu về Đức Chúa Trời. Mọi dấu chú thích đều xuất hiện trong chính văn.
