    rationale: “Vì nhớ đến” trình bày hành động giúp đỡ như xảy ra vì Đức Chúa Trời nhớ đến lòng thương xót. Nguyên mẫu aorist trong cụm này phù hợp sát hơn với ý hướng/mục đích hoặc sự tưởng nhớ đi kèm. “Để nhớ đến” bảo tồn cấu trúc và tránh áp đặt quan hệ nhân quả.
