  text: ἀντελάβετο Ἰσραὴλ παιδὸς αὐτοῦ, μνησθῆναι ἐλέους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: vi
  text: Ngài đã nâng đỡ Y-sơ-ra-ên, tôi tớ Ngài[a], để nhớ đến lòng thương xót[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Y-sơ-ra-ên, con của Ngài.” Từ Hy Lạp παῖς có thể có nghĩa là “tôi tớ” hoặc “con”; ở đây chọn “tôi tớ” vì Cựu Ước thường gọi Y-sơ-ra-ên là tôi tớ của Đức Chúa Trời.
    reason: lexical_alternative
  - marker: b
    text: “Lòng thương xót” cũng có thể mang sắc thái lòng thương xót gắn với giao ước hoặc sự thành tín đầy cảm thương.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: đã nâng đỡ
  rationale: Động từ diễn tả việc nắm lấy để giúp đỡ hoặc hỗ trợ. “Đã nâng đỡ” vừa tự nhiên trong tiếng Việt vừa giữ được sắc thái trợ giúp tích cực của hành động cứu giúp.
- source_word: Ἰσραὴλ
  choice: Y-sơ-ra-ên
  rationale: Giữ cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt; ở đây chỉ tập thể dân Y-sơ-ra-ên.
- source_word: παιδὸς
  choice: tôi tớ
  rationale: παῖς có thể mang nghĩa “tôi tớ” hoặc “con trẻ”. Trong ngữ cảnh giao ước và âm hưởng Cựu Ước gọi Y-sơ-ra-ên là tôi tớ của Đức Chúa Trời, “tôi tớ” phù hợp hơn; cách hiểu kia được giữ trong chú thích.
- source_word: αὐτοῦ
  choice: Ngài
  rationale: Đại từ sở hữu quy chiếu về Đức Chúa Trời. Cấu trúc “tôi tớ Ngài” trang trọng, gọn và tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: μνησθῆναι
  choice: vì nhớ đến
  rationale: Động từ nguyên mẫu aorist liên kết việc Đức Chúa Trời nâng đỡ Y-sơ-ra-ên với sự Ngài nhớ đến lòng thương xót. “Vì nhớ đến” diễn đạt tự nhiên mà không quyết định quá mức giữa sắc thái mục đích, kết quả và hoàn cảnh đi kèm.
- source_word: ἐλέους
  choice: lòng thương xót
  rationale: Diễn đạt trực tiếp ý niệm thương xót và cảm thương; sắc thái về lòng thương xót trung tín trong giao ước được nêu ở chú thích thay vì thêm vào chính văn.
theological_decisions:
- issue: Nghĩa của παῖς khi nói về Y-sơ-ra-ên
  choice: Y-sơ-ra-ên, tôi tớ Ngài
  alternative: Y-sơ-ra-ên, con của Ngài
  rationale: “Tôi tớ” giữ được âm hưởng Cựu Ước về Y-sơ-ra-ên là tôi tớ của Đức Chúa Trời, đồng thời chú thích bảo tồn sự đa nghĩa thật sự của từ Hy Lạp.
- issue: Sắc thái của μνησθῆναι ἐλέους
  choice: vì nhớ đến lòng thương xót
  alternative: để nhớ đến lòng thương xót; trong sự tưởng nhớ lòng thương xót
  rationale: Cách dịch này liên kết sự nâng đỡ với việc Đức Chúa Trời nhớ đến lòng thương xót, nhưng không thêm “của Ngài” hay diễn giải chi tiết về giao ước vốn không được nói rõ trong cụm từ Hy Lạp.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu về Đức Chúa Trời và “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc. Câu giữ dấu phẩy cuối vì câu thơ tiếp tục sang câu kế tiếp.
