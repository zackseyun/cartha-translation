  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: vi
  text: đúng như Ngài đã phán với các tổ phụ[a] chúng ta, với Áp-ra-ham và dòng dõi[b] ông, cho đến đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tổ tiên chúng ta.” Nguyên văn Hy Lạp là “các cha của chúng ta.”
    reason: lexical_alternative
  - marker: b
    text: Hay “hạt giống của ông” hoặc “hậu duệ ông.” Từ Hy Lạp ở số ít nhưng có nghĩa tập hợp, có thể chỉ hạt giống, dòng dõi hoặc các hậu duệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn tả sự tương ứng với điều vừa nói ở câu trước và nhấn mạnh rằng việc ấy xảy ra phù hợp với lời Đức Chúa Trời đã phán.
- source_word: ἐλάλησεν
  choice: đã phán
  rationale: Trong ngữ cảnh lời Đức Chúa Trời nói với các tổ phụ, “phán” vừa tự nhiên vừa giữ sắc thái trang trọng của lời thần thượng.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: với các tổ phụ chúng ta
  rationale: “Tổ phụ” giữ được hình thức chỉ nam giới và âm hưởng lịch sử giao ước của πατέρες, đồng thời quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: τῷ Ἀβραὰμ
  choice: với Áp-ra-ham
  rationale: Duy trì quan hệ song song với động từ “đã phán”; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: và dòng dõi ông
  rationale: “Dòng dõi” là danh từ tập hợp tự nhiên trong tiếng Việt, có thể bao gồm toàn thể hậu duệ mà không buộc số nhiều; “ông” quy chiếu về Áp-ra-ham.
- source_word: εἰς τὸν αἰῶνα
  choice: đến đời đời
  rationale: Thành ngữ trang trọng, dễ hiểu, diễn đạt sự kéo dài vĩnh viễn của cụm Hy Lạp.
theological_decisions:
- issue: Cách dịch πατέρας ἡμῶν trong bối cảnh lịch sử giao ước
  choice: các tổ phụ chúng ta
  alternative: tổ tiên chúng ta
  rationale: “Các tổ phụ” giữ ngôn ngữ nam tính của nguyên bản và âm hưởng về những người cha trong lịch sử giao ước, nhưng chú thích cung cấp cách hiểu rộng hơn là tổ tiên.
- issue: Cách dịch σπέρματι αὐτοῦ trong lời hứa với Áp-ra-ham
  choice: dòng dõi ông
  alternative: hạt giống của ông; hậu duệ ông
  rationale: Nguyên ngữ dùng một danh từ số ít mang nghĩa tập hợp. “Dòng dõi” giữ được tính tập hợp và âm hưởng giao ước mà không quyết định danh từ này chỉ về một cá nhân hay nhiều hậu duệ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Ngài” chỉ Đức Chúa Trời theo mạch văn; “phán,” “tổ phụ” và “đến đời đời” giữ âm hưởng Kinh Thánh mà vẫn thông dụng. Dấu phẩy bảo toàn cấu trúc đặt Áp-ra-ham và dòng dõi ông sau các tổ phụ mà không giải thích quá mức quan hệ cú pháp.
