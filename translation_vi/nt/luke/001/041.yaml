id: LUK.1.41
reference: Luke 1:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: vi
  text: Khi Ê-li-sa-bét nghe lời chào[a] của Ma-ri, đứa bé trong bụng bà nhảy lên, và Ê-li-sa-bét được tràn đầy Đức Thánh Linh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời thăm hỏi.”
    reason: Nêu một cách dịch khác của ἀσπασμός; trong ngữ cảnh, từ này có thể nhấn mạnh lời chào khi đến thăm.
lexical_decisions:
- source_word: καὶ ἐγένετο ὡς
  choice: Khi
  rationale: Trong công thức kể chuyện này của Lu-ca, cụm từ dẫn vào một sự việc xảy ra ngay khi hành động kế tiếp diễn ra. Dùng “Khi” truyền đạt tự nhiên quan hệ thời gian trong tiếng Việt mà không tạo câu rườm rà hoặc cổ kính.
- source_word: ἀσπασμός
  choice: lời chào
  rationale: Chỉ lời Ma-ri nói khi gặp Ê-li-sa-bét. “Lời chào” rõ ràng, tự nhiên và phù hợp với văn phong hiện đại.
- source_word: ἐσκίρτησεν
  choice: nhảy lên
  rationale: Diễn tả một chuyển động đột ngột, sống động; “nhảy lên” giữ được sức gợi của động từ Hy Lạp hơn những cách diễn đạt nhẹ như “cựa mình”.
- source_word: βρέφος
  choice: đứa bé
  rationale: Từ này chỉ một em bé rất nhỏ và tại đây nói về Giăng khi còn trong bụng mẹ. “Đứa bé” tự nhiên, cụ thể, đồng thời không thêm thuật ngữ y khoa vào bản văn.
- source_word: κοιλία
  choice: bụng
  rationale: Trong ngữ cảnh này, từ ấy chỉ nơi đứa bé đang ở trong thân thể Ê-li-sa-bét. Cụm “đứa bé trong bụng bà” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: ἐπλήσθη
  choice: được tràn đầy
  rationale: Giữ thể bị động của nguyên văn và diễn đạt tự nhiên việc Ê-li-sa-bét được Thánh Linh chiếm đầy, không giải thích thêm tác nhân ngoài điều bản văn nói.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Đây là cách gọi quen thuộc, trang trọng trong tiếng Việt đối với Thần Linh của Đức Chúa Trời; viết hoa biểu thị danh xưng riêng của Đấng được nhắc đến.
theological_decisions:
- issue: Đối tượng được nói đến trong πνεύματος ἁγίου
  choice: Đức Thánh Linh, tức Thần Linh của Đức Chúa Trời
  alternative: một linh thánh
  rationale: Trong Lu-ca–Công Vụ, cụm từ này thường chỉ Đức Thánh Linh, và ngữ cảnh ở đây liên quan đến sự cảm thúc mang tính tiên tri. Cách dịch này truyền đạt đối tượng tự nhiên trong tiếng Việt mà không thêm nội dung tín lý ngoài cách dùng của bản văn.
- issue: Cách gọi Giăng khi còn trong bụng mẹ bằng βρέφος
  choice: đứa bé
  alternative: thai nhi; con trẻ
  rationale: Nguyên ngữ chỉ một em bé rất nhỏ và ngữ cảnh xác định em đang ở trong bụng mẹ. “Đứa bé” giữ cách nói cụ thể của bản văn mà không biến câu thành thuật ngữ y khoa hay thêm bình luận thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Cấu trúc “Khi…” chuyển tải tự nhiên công thức kể chuyện καὶ ἐγένετο ὡς; lặp lại “Ê-li-sa-bét” ở vế cuối giúp tránh mơ hồ về chủ thể.
