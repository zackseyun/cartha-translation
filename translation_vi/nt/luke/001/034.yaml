base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: vi
  text: 'Nhưng Ma-ri nói với thiên sứ: “Việc ấy sẽ xảy ra thế nào, vì tôi chưa hề biết người nam nào[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói theo lối trực tiếp hơn: “vì tôi chưa từng quan hệ với một người nam.” Trong tiếng Hy Lạp, “biết một người nam” là lối nói kín đáo chỉ quan hệ tình dục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý nhẹ từ lời báo của thiên sứ sang câu hỏi đáp lại của Ma-ri, mà không tạo cảm giác đối lập quá mạnh.
- source_word: Μαριὰμ
  choice: Ma-ri
  rationale: Dạng phiên âm quen thuộc, rõ ràng trong tiếng Việt hiện đại.
- source_word: πρὸς τὸν ἄγγελον
  choice: nói với thiên sứ
  rationale: ἄγγελος có thể là người đưa tin, nhưng trong văn cảnh này rõ ràng chỉ một hữu thể thiên giới; “thiên sứ” vừa chính xác vừa quen thuộc.
- source_word: Πῶς ἔσται τοῦτο
  choice: Việc ấy sẽ xảy ra thế nào
  rationale: Diễn đạt tự nhiên câu hỏi về cách điều vừa được báo sẽ trở thành hiện thực; “việc ấy” chỉ sự thụ thai và sinh con đã được loan báo.
- source_word: ἐπεὶ
  choice: vì
  rationale: Nêu lý do dẫn đến câu hỏi của Ma-ri bằng một liên từ nhân quả tự nhiên trong tiếng Việt.
- source_word: ἄνδρα
  choice: người nam nào
  rationale: Giữ nghĩa “người nam” thay vì thu hẹp thành “chồng”; từ “nào” làm câu phủ định tự nhiên trong tiếng Việt.
- source_word: οὐ γινώσκω
  choice: tôi chưa biết đến
  rationale: Giữ hình ảnh uyển ngữ “biết” của nguyên văn, còn “chưa” diễn tả tự nhiên tình trạng tính đến thời điểm Ma-ri nói. Nghĩa chỉ quan hệ tình dục được giải thích trong chú thích.
theological_decisions:
- issue: Lời Ma-ri và sự thụ thai của Chúa Giê-su
  choice: Giữ lối nói uyển ngữ “chưa biết đến người nam nào” trong chính văn.
  alternative: “chưa từng quan hệ với người nam nào” hoặc “vẫn còn là trinh nữ”
  rationale: Nguyên văn dùng γινώσκω, “biết”, như một lối nói kín đáo về quan hệ tình dục. Bản dịch giữ hình ảnh của nguồn văn, qua đó thể hiện tình trạng chưa có quan hệ tình dục của Ma-ri mà không thay lời bà bằng một cách diễn giải thần học rộng hơn; chú thích làm sáng tỏ nghĩa thành ngữ.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu. “Thiên sứ” và “Ma-ri” là các cách gọi quen thuộc trong tiếng Việt Kinh Thánh; câu hỏi được diễn đạt tự nhiên, còn lối nói uyển ngữ của nguyên văn được giữ lại và giải thích bằng chú thích.
