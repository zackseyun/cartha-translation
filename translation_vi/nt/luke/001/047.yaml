  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: vi
  text: và tâm thần tôi hân hoan trong Đức Chúa Trời, Đấng Cứu Rỗi của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hớn hở trong Đức Chúa Trời, Đấng Cứu Rỗi của tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ đơn giản nối câu này với câu trước trong cấu trúc song song thi ca.
- source_word: ἠγαλλίασεν
  choice: hân hoan
  rationale: Động từ diễn tả niềm vui mãnh liệt; “hân hoan” tự nhiên, trang trọng vừa phải và mạnh hơn “vui mừng” mà không thêm ý ngoài nguyên văn.
- source_word: τὸ πνεῦμά μου
  choice: tâm linh tôi
  rationale: Giữ danh từ tương ứng với πνεῦμα và sự phân biệt từ vựng với ψυχή ở câu trước, nhưng không áp đặt một hệ thống nhân học lên phép song song thi ca.
- source_word: ἐπὶ τῷ θεῷ
  choice: trong Đức Chúa Trời
  rationale: Với động từ chỉ sự hân hoan, ἐπί kèm tặng cách có thể chỉ nền tảng hoặc đối tượng của niềm vui; cách nói này giữ trọng tâm tương quan và phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: τῷ σωτῆρί μου
  choice: Đấng Cứu Rỗi tôi
  rationale: Chuyển trực tiếp σωτήρ theo nghĩa “Đấng Cứu Rỗi”, giữ đầy đủ sức nặng thần học của lời Ma-ri nói về Đức Chúa Trời.
theological_decisions:
- issue: Đức Chúa Trời được gọi là Đấng Cứu Rỗi của Ma-ri
  choice: Đức Chúa Trời, Đấng Cứu Rỗi tôi
  alternative: Đức Chúa Trời, Đấng giải cứu tôi
  rationale: Nguyên văn trực tiếp gọi Đức Chúa Trời là σωτήρ của Ma-ri. Bản dịch giữ nguyên lời xác nhận ấy mà không suy diễn thêm kết luận giáo phái.
- issue: Quan hệ giữa “tâm linh tôi” và “linh hồn tôi” trong phép song song
  choice: Giữ hai thuật ngữ phân biệt
  alternative: Đồng nhất cả hai bằng một cách dịch
  rationale: Hai từ Hy Lạp khác nhau dù có thể chồng lấn ý nghĩa trong thi ca; giữ sự phân biệt bảo toàn độ căng và cấu trúc của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng và dễ hiểu; giữ sắc thái thi ca của bài ca Ma-ri. Dùng “Đức Chúa Trời” và “Đấng Cứu Rỗi” theo cách gọi quen thuộc trong văn cảnh Kinh Thánh, không thêm diễn giải giáo phái.
