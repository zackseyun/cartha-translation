  source_fidelity: Bản nháp truyền đạt đúng liên từ καὶ, niềm vui mãnh liệt của ἠγαλλίασεν, và việc Đức Chúa Trời được gọi trực tiếp là Đấng Cứu Rỗi của người nói. Tuy nhiên, “tâm linh” trong tiếng Việt hiện đại thường chỉ bình diện/đời sống thuộc linh hơn là chính nội tâm của một người, nên chưa là tương đương sát và trung tính nhất cho τὸ πνεῦμά μου trong phép song song thi ca.
