  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: vi
  text: 'Vì sao tôi lại được ơn này[a]: mẹ của Chúa tôi đến với tôi?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Bởi đâu điều này đến với tôi...?” Đây là lối nói bày tỏ sự kinh ngạc khi nhận được một đặc ân như thế.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: Vì sao tôi lại được ơn này
  rationale: Cụm Hy Lạp có nghĩa đen gần như “điều này từ đâu đến với tôi?”, là một lối nói bày tỏ sự kinh ngạc trước một đặc ân. Cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái ngỡ ngàng, khiêm nhường.
- source_word: ἵνα ἔλθῃ
  choice: là ... đến thăm
  rationale: ἵνα ở đây giới thiệu nội dung của sự việc khiến Ê-li-sa-bét kinh ngạc. “Đến thăm” diễn đạt tự nhiên hành động một người đến với người khác trong ngữ cảnh, mà không thêm địa điểm không có trong nguyên văn.
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: mẹ của Chúa tôi
  rationale: Dịch trực tiếp cấu trúc sở hữu, giữ κύριος là “Chúa” và bảo toàn sức nặng tôn kính, Kitô học của lời xưng nhận.
- source_word: πρὸς ἐμέ
  choice: đến thăm tôi
  rationale: πρός với đối cách chỉ chuyển động hướng đến Ê-li-sa-bét. Trong tiếng Việt, “đến thăm tôi” tự nhiên hơn “đến với tôi” trong tình huống này, nhưng không diễn giải thành “đến nhà tôi”.
theological_decisions:
- issue: Cách dịch κυρίου trong ἡ μήτηρ τοῦ κυρίου μου
  choice: Chúa tôi
  alternative: chủ tôi
  rationale: “Chúa tôi” giữ nguyên tước hiệu κύριος và sức nặng của lời xưng nhận, không làm nhẹ ý nghĩa cũng không đưa thêm những công thức tín lý về sau.
- issue: Mức độ diễn ý của thành ngữ πόθεν μοι τοῦτο
  choice: Vì sao tôi lại được ơn này
  alternative: Bởi đâu điều này đến với tôi
  rationale: Bản dịch chính dùng lối nói Việt tự nhiên để truyền đạt sự kinh ngạc và cảm nhận mình nhận được đặc ân; chú thích bảo lưu hình thức gần nghĩa đen và tính hàm súc của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Từ “lại” làm nổi bật sự ngỡ ngàng, khiêm nhường; “được ơn này” chuyển tải hàm ý về đặc ân nhưng được kèm chú thích để người đọc thấy cấu trúc sát nguyên văn.
