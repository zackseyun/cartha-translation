  to: 'Tất cả những ai nghe chuyện ấy đều ghi nhớ trong lòng và nói: “Vậy sau này đứa trẻ này sẽ trở nên thế nào?”[a] Vì quả thật, tay Chúa ở cùng đứa trẻ ấy.[b]'
  rationale: 'Chỉ sửa những điểm an toàn và cần thiết: loại bỏ từ tiếng Anh còn sót trong chú thích, và thay đại từ “em” bằng cụm quy chiếu rõ ràng, phù hợp hơn với văn phong tường thuật. Các lựa chọn còn lại bảo tồn tốt sắc thái suy luận của ἄρα, tương lai mở của ἔσται, và ẩn dụ thần học của χεὶρ κυρίου.'
