id: LUK.1.66
reference: Luke 1:66
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: vi
  text: 'Tất cả những ai nghe chuyện ấy đều ghi nhớ trong lòng và nói: “Vậy sau này đứa trẻ này sẽ trở nên thế nào?”[a] Vì quả thật, tay Chúa ở cùng đứa trẻ ấy.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát là: “đứa trẻ này sẽ là gì?” Động từ Hy Lạp chỉ đơn giản là “sẽ là”, nhưng trong ngữ cảnh, câu hỏi hướng đến thân phận hoặc vai trò tương lai của đứa trẻ.'
    reason: lexical_alternative
  - marker: b
    text: “Tay Chúa” là một thành ngữ Kinh Thánh chỉ quyền năng, ân huệ hoặc sự dẫn dắt chủ động của Chúa.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: ghi nhớ trong lòng
  rationale: Giữ hình ảnh về tấm lòng nhưng diễn đạt tự nhiên trong tiếng Việt, cho thấy họ lưu giữ và suy ngẫm nghiêm túc về điều đã nghe.
- source_word: πάντες οἱ ἀκούσαντες
  choice: tất cả những ai nghe chuyện ấy
  rationale: Cụm phân từ chỉ mọi người đã nghe các sự việc vừa được thuật lại; “chuyện ấy” bổ sung đối tượng hàm ẩn một cách tự nhiên.
- source_word: Τί ἄρα
  choice: Vậy ... thế nào?
  rationale: “Vậy” chuyển tải sắc thái suy luận của ἄρα, khi người nghe từ các dấu lạ trước đó suy nghĩ về tương lai của đứa trẻ.
- source_word: τὸ παιδίον τοῦτο
  choice: đứa trẻ này
  rationale: Cách gọi tự nhiên, không xác định tuổi cụ thể hơn từ Hy Lạp.
- source_word: ἔσται
  choice: sẽ trở nên thế nào
  rationale: Động từ có nghĩa đen là “sẽ là”, nhưng trong ngữ cảnh câu hỏi hướng đến tương lai, thân phận hoặc vai trò của đứa trẻ; cách dịch này truyền đạt ý ấy mà không xác định cụ thể kết quả.
- source_word: καὶ γὰρ
  choice: Vì quả thật
  rationale: Giữ cả chức năng nêu lý do và sắc thái nhấn mạnh của tổ hợp tiểu từ.
- source_word: χεὶρ κυρίου
  choice: tay Chúa
  rationale: Giữ nguyên ẩn dụ Kinh Thánh về quyền năng, ân favor và sự dẫn dắt chủ động của Đức Chúa Trời, thay vì thu hẹp vào một cách giải thích.
- source_word: κυρίου
  choice: Chúa
  rationale: Trong ngữ cảnh này κύριος chỉ Đức Chúa Trời; “Chúa” là cách xưng kính trọng, quen thuộc và phù hợp.
- source_word: μετ’ αὐτοῦ
  choice: ở cùng em
  rationale: μετά với sở hữu cách mang nghĩa “cùng với”; “em” quy chiếu tự nhiên về đứa trẻ mà không thêm ý “ở trên” hay chỉ riêng sự trợ giúp.
theological_decisions:
- issue: Ý nghĩa của thành ngữ “tay Chúa ở cùng em”
  choice: Giữ nguyên ẩn dụ như lời khẳng định về sự hiện diện và tác động của Chúa, không xác định hẹp hơn.
  alternative: Chúa giúp đỡ em; quyền năng của Chúa ở trên em
  rationale: Cụm từ cho thấy Chúa chủ động can dự vào đời sống đứa trẻ, nhưng bản văn không nói rõ đó chỉ là sự che chở, ban ơn, hướng dẫn hay trao quyền năng. Giữ ẩn dụ bảo toàn độ mở thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ghi nhớ trong lòng” để bảo tồn hình ảnh nguồn mà vẫn tự nhiên; dùng “em” để quy chiếu về đứa trẻ với sắc thái phù hợp. Hai dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
