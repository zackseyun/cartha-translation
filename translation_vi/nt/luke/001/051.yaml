base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: vi
  text: Ngài đã bày tỏ sức mạnh bằng cánh tay Ngài[a]; Ngài đã làm tan tác những kẻ kiêu ngạo trong toan tính của lòng họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài đã thực hiện những việc quyền năng bằng cánh tay Ngài.” Tiếng Hy Lạp theo nghĩa đen là “đã làm nên sức mạnh”, một thành ngữ chỉ việc biểu lộ quyền năng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ngài đã làm tan tác những kẻ kiêu ngạo bởi toan tính trong lòng họ” hoặc “trong sự tưởng tượng của lòng họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: đã bày tỏ sức mạnh
  rationale: Cụm Hy Lạp theo nghĩa đen là “đã làm nên sức mạnh”, một cách nói chỉ việc biểu lộ hay thi hành quyền năng. “Đã bày tỏ sức mạnh” tự nhiên trong tiếng Việt và giữ sắc thái hành động đã được thực hiện.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: bằng cánh tay Ngài
  rationale: ἐν mang nghĩa phương tiện trong thành ngữ chịu ảnh hưởng Cựu Ước. Cách dịch này giữ nguyên hình ảnh nhân hóa về cánh tay quyền năng của Đức Chúa Trời.
- source_word: διεσκόρπισεν
  choice: đã làm tan tác
  rationale: Động từ chỉ hành động làm phân tán, xua tan. “Làm tan tác” phù hợp với văn thơ trang trọng và diễn tả rõ quyền năng khiến đối phương bị phân tán.
- source_word: ὑπερηφάνους
  choice: những kẻ kiêu ngạo
  rationale: Tính từ được dùng như danh từ, chỉ những người kiêu căng. Cách dịch này ngắn gọn và giữ nguyên sự đánh giá đạo đức của từ nguồn.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: trong những ý tưởng của lòng họ
  rationale: Cách dịch giữ cả διάνοια (ý tưởng, tư tưởng, tâm trí) lẫn καρδία (lòng, con người bên trong), đồng thời không quyết định dứt khoát ἐν là chỉ phạm vi hay phương tiện.
theological_decisions:
- issue: Thì của các động từ aorist trong bài ca của Ma-ri
  choice: Dùng “đã bày tỏ” và “đã làm tan tác”
  alternative: Có thể dịch theo hiện tại để nhấn mạnh hành động thường xuyên, hoặc theo quá khứ đơn gắn với các biến cố trước đó
  rationale: “Đã” giữ lực của hành động trọn vẹn mà không buộc câu phải chỉ về một biến cố lịch sử riêng biệt; điều này cũng phù hợp với tính chất tổng kết hoặc tiên báo của các aorist trong bài ca.
- issue: Quan hệ của “những ý tưởng của lòng họ” với hành động làm tan tác
  choice: Giữ cách nói “trong những ý tưởng của lòng họ”
  alternative: “bởi toan tính trong lòng họ” hoặc “trong sự tưởng tượng của lòng họ”
  rationale: Cấu trúc Hy Lạp có thể được hiểu theo phạm vi, phương tiện hoặc liên hệ với tâm thế bên trong. Bản chính giữ sự căng thẳng này thay vì xác định một quan hệ nhân quả duy nhất.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hình ảnh Kinh Thánh “cánh tay Ngài” và lối nói Semit “ý tưởng của lòng họ”; các khả năng diễn giải khác được nêu trong chú thích.
