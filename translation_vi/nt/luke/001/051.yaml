  to: Ngài đã bày tỏ sức mạnh bằng cánh tay Ngài[a]; Ngài đã làm tan tác những kẻ kiêu ngạo trong toan tính của lòng họ.[b]
  rationale: Chỉ điều chỉnh cách dịch διανοίᾳ καρδίας αὐτῶν để câu tiếng Việt tự nhiên hơn và phản ánh tốt hơn ý suy tính nội tâm. Các lựa chọn khác, gồm thì hoàn thành, hình ảnh “cánh tay,” và động từ “làm tan tác,” đều có thể giữ nguyên.
