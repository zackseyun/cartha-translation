  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: vi
  text: Còn đứa trẻ cứ lớn lên và trở nên mạnh mẽ về tâm linh[a]. Cậu ở trong những vùng hoang vắng[b] cho đến ngày cậu xuất hiện công khai trước dân Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Thánh Linh.” Tiếng Hy Lạp có thể nói chung về sức mạnh nội tâm hoặc tâm linh, hay nói cụ thể hơn về sự mạnh mẽ trong mối liên hệ với Đức Thánh Linh.'
    reason: alternative_reading
  - marker: b
    text: Nguyên văn Hy Lạp dùng số nhiều, sát nghĩa là “ở các vùng hoang vắng” hoặc “ở những nơi hiu quạnh.”
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “cho đến ngày cậu xuất hiện trước dân Israel” hoặc “cho đến ngày cậu trình diện trước dân Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: đứa trẻ
  rationale: Chỉ Giăng khi còn nhỏ mà không ấn định một giai đoạn tuổi cụ thể; cách gọi này tự nhiên và đủ rộng trong tiếng Việt.
- source_word: ηὔξανε
  choice: cứ lớn lên
  rationale: Thì chưa hoàn thành diễn tả quá trình tiếp diễn; “cứ lớn lên” giữ được sắc thái ấy.
- source_word: ἐκραταιοῦτο
  choice: trở nên mạnh mẽ
  rationale: Diễn tả một quá trình đang phát triển, đồng thời không xác định quá mức đây là thể bị động (“được làm cho mạnh”) hay nội động (“ngày càng mạnh”).
- source_word: πνεύματι
  choice: trong tâm linh
  rationale: Giữ nghĩa tương đối rộng về phương diện tinh thần/tâm linh, không mặc nhiên xác định là Đức Thánh Linh.
- source_word: ἐν ταῖς ἐρήμοις
  choice: ở những vùng hoang vắng
  rationale: Phản ánh dạng số nhiều của tiếng Hy Lạp và phạm vi nghĩa rộng hơn “sa mạc”, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: ἀναδείξεως
  choice: xuất hiện công khai
  rationale: Truyền đạt ý được đưa ra ánh sáng hoặc bắt đầu xuất hiện trước công chúng bằng cách nói hiện đại, rõ ràng.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: trước dân Israel
  rationale: Trong kết cấu với ἀνάδειξις, cụm này chỉ cộng đồng mà Giăng xuất hiện trước mặt; thêm “dân” giúp tránh hiểu Israel thuần túy là địa danh.
theological_decisions:
- issue: Ý nghĩa của πνεύματι trong sự trưởng thành của Giăng
  choice: trong tâm linh
  alternative: trong Thánh Linh; về mặt tâm linh
  rationale: Danh từ không có mạo từ và câu không minh nhiên nêu Đức Thánh Linh. Bản dịch chính giữ nghĩa rộng, còn chú thích bảo lưu khả năng hiểu cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu” ở mệnh đề sau để tránh lặp “đứa trẻ”; “dân Israel” xác định đây là cộng đồng giao ước chứ không chỉ địa danh. Các dấu chú thích được đặt ngay sau cụm từ liên quan theo đúng thứ tự.
