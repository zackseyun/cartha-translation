  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: vi
  text: 'Bà lớn tiếng kêu lên rằng: “Chị được chúc phước giữa những người nữ, và hoa trái trong lòng chị cũng được chúc phước.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: cất tiếng kêu
  rationale: Động từ chỉ việc cất tiếng mạnh và rõ. Cách dịch này diễn đạt sự lớn tiếng mà không gợi rằng Ê-li-sa-bét kêu vì đau đớn hay hoảng sợ.
- source_word: κραυγῇ μεγάλῃ
  choice: lớn
  rationale: Cụm cách cho biết cách thức và cường độ của tiếng kêu. Ghép với “cất tiếng kêu” thành “cất tiếng kêu lớn” là tự nhiên trong tiếng Việt và vẫn giữ sức mạnh của nguyên văn.
- source_word: Εὐλογημένη
  choice: được ban phước
  rationale: Phân từ hoàn thành bị động được dùng theo lối vị ngữ. “Được ban phước” giữ rõ sắc thái bị động và công thức chúc phước, không chuyển sang trường nghĩa riêng của “được ơn” hay “được ưu ái”.
- source_word: ἐν γυναιξίν
  choice: giữa những người nữ
  rationale: Giữ ý người được nói đến nổi bật trong tương quan với giới nữ nói chung; không thêm “tất cả” vì từ ấy không có trong tiếng Hy Lạp.
- source_word: εὐλογημένος
  choice: cũng được ban phước
  rationale: Lặp lại cách diễn đạt của vế trước để bảo toàn cấu trúc song song giữa Ma-ri và người con bà đang mang thai.
- source_word: ὁ καρπὸς
  choice: hoa trái
  rationale: Giữ hình ảnh ẩn dụ “trái” của nguyên văn nhưng dùng cụm “hoa trái” quen thuộc và dễ hiểu hơn trong tiếng Việt trang trọng.
- source_word: τῆς κοιλίας σου
  choice: của lòng chị
  rationale: Trong ngữ cảnh mang thai, κοιλία chỉ dạ con/lòng mẹ. “Lòng chị” là cách nói trang trọng, tự nhiên trong thành ngữ “hoa trái của lòng”, đồng thời giữ hình ảnh mẫu tử.
theological_decisions:
- issue: Công thức chúc phước dành cho Ma-ri
  choice: Chị được ban phước giữa những người nữ
  alternative: Chị có phước hơn mọi người nữ
  rationale: Bản dịch giữ lời chúc phước dành cho Ma-ri nhưng không thêm ý so sánh hơn hoặc từ “mọi”, vốn không được nêu trực tiếp trong tiếng Hy Lạp; cũng không mở rộng câu theo các công thức tín lý về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Chị” là đại từ xưng hô tôn trọng, tự nhiên trong lời nói trực tiếp giữa hai phụ nữ; tránh lối “ngươi” cổ. Cấu trúc song song và ẩn dụ “hoa trái của lòng” được giữ để phản ánh hình thức của nguyên văn.
