id: LUK.1.31
reference: Luke 1:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: vi
  text: Này, cô sẽ thụ thai và sinh một con trai, rồi cô sẽ đặt tên con là Giê-su.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Này
  rationale: Dùng tiểu từ thu hút sự chú ý tự nhiên trong tiếng Việt, đồng thời giữ sắc thái trang trọng của lời truyền báo.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: cô sẽ thụ thai
  rationale: Cụm Hy Lạp diễn tả việc mang thai trong lòng; “thụ thai” chính xác, gọn và tự nhiên hơn lối dịch sát chữ “thụ thai trong lòng” trong tiếng Việt hiện đại.
- source_word: τέξῃ υἱόν
  choice: sinh một con trai
  rationale: Giữ rõ giới tính của υἱός và diễn đạt tự nhiên hành động sinh con.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: cô sẽ đặt tên con
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt của công thức đặt tên trong tiếng Hy Lạp; tránh lối dịch cứng “gọi tên của con”.
- source_word: Ἰησοῦν
  choice: Giê-su
  rationale: Theo dạng tên đã được dùng rộng rãi và dễ nhận biết trong tiếng Việt.
theological_decisions:
- issue: Cách dịch công thức đặt tên καλέσεις τὸ ὄνομα αὐτοῦ
  choice: cô sẽ đặt tên con là Giê-su
  alternative: cô sẽ gọi tên con là Giê-su
  rationale: Không có khác biệt tín lý; bản chính ưu tiên cách nói tiếng Việt hiện đại, trong khi phương án sát cấu trúc nguồn nghe kém tự nhiên hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “cô” phù hợp với lời thiên sứ trực tiếp nói với Ma-ri, nhưng không thêm tên riêng vốn không có trong câu này.
