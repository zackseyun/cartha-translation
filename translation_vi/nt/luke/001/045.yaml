  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính: lời chúc phước dành cho người nữ đã tin, với “rằng” dẫn vào nội dung đức tin; các điều Chúa đã phán sẽ được ứng nghiệm. “Được ứng nghiệm” là cách dịch thích hợp cho τελείωσις trong ngữ cảnh lời hứa. Tuy nhiên, “mình” có thể tạo sắc thái khẩu ngữ và quy chiếu phản thân không rõ trong lời nói của Ê-li-sa-bét về Ma-ri; “bà” phản ánh rõ αὐτῇ hơn. Thêm “đã” với “Chúa đã phán” cũng biểu đạt rõ hơn phân từ hoàn thành λελαλημένοις.'
