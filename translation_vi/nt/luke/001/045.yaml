  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: vi
  text: Phước cho người nữ đã tin rằng những điều Chúa đã phán với bà sẽ được ứng nghiệm[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Phước cho người nữ đã tin, vì những điều Chúa đã phán với bà sẽ được ứng nghiệm.” Từ nối Hy Lạp có thể mang nghĩa “vì”, dù nghĩa “rằng” có khả năng hơn ở đây.'
    reason: alternative_reading
  - marker: b
    text: “Được ứng nghiệm” cũng có thể dịch là “được hoàn tất” hoặc “được thành tựu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: Phước cho
  rationale: Cách diễn đạt tự nhiên, trang trọng trong tiếng Việt, giữ được sắc thái tôn giáo của lời tuyên bố μακαρία hơn là chỉ nói về cảm giác vui sướng hay may mắn.
- source_word: ἡ πιστεύσασα
  choice: người nữ đã tin
  rationale: Giữ cấu trúc danh từ hóa của phân từ có mạo từ và sắc thái hành động đã xảy ra của phân từ aorist; đồng thời phù hợp với người được nói đến trong ngữ cảnh.
- source_word: ὅτι
  choice: rằng
  rationale: Hiểu liên từ là từ dẫn vào nội dung của điều bà đã tin, là cách đọc tự nhiên nhất về cú pháp và ngữ cảnh.
- source_word: τελείωσις
  choice: được ứng nghiệm
  rationale: Trong ngữ cảnh lời Chúa đã phán, cách dịch này diễn đạt tự nhiên việc lời ấy được đưa đến chỗ hoàn tất, dù danh từ Hy Lạp cũng có thể được diễn đạt là sự hoàn tất hay thành tựu.
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: những điều ... phán với mình
  rationale: Giữ nội dung số nhiều/trung tính của phân từ hoàn thành bị động và đối tượng tiếp nhận αὐτῇ; “mình” quy chiếu tự nhiên về người nữ vừa được nhắc đến.
- source_word: παρὰ κυρίου
  choice: Chúa phán
  rationale: Chuyển nguồn gốc của lời nói thành chủ thể trong một cấu trúc tiếng Việt tự nhiên. παρά với sở hữu cách chỉ lời ấy đến từ Chúa; cách diễn đạt này không thay đổi nguồn của lời.
- source_word: κυρίου
  choice: Chúa
  rationale: Cách gọi tiêu chuẩn, trang trọng trong tiếng Việt; ở đây chỉ Đức Chúa Trời là nguồn của lời hứa.
theological_decisions:
- issue: Mối liên hệ giữa phước lành của Ma-ri, đức tin của bà và lời đã được phán
  choice: Bà được tuyên bố là có phước trong tư cách người đã tin rằng lời Chúa phán sẽ được ứng nghiệm.
  alternative: Bà có phước vì những điều Chúa phán với bà sẽ được hoàn tất, với ὅτι mang nghĩa nguyên nhân.
  rationale: Cú pháp tự nhiên nhất cho thấy ὅτι dẫn vào nội dung của πιστεύσασα. Bản dịch giữ trọng tâm của câu vào lòng tin đối với lời Chúa mà không đưa thêm kết luận thần học ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu chủ động “Chúa phán” tự nhiên hơn cấu trúc bị động cứng “được phán từ/bởi Chúa”, trong khi vẫn bảo toàn Chúa là nguồn của lời. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
