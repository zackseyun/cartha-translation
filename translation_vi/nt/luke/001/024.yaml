  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: vi
  text: 'Sau những ngày ấy[a], Ê-li-sa-bét, vợ ông, thụ thai. Bà cứ ẩn mình suốt năm tháng[b] và nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Sau những ngày này.” Đại từ chỉ định Hy Lạp có nghĩa sát là “này,” nhưng trong lời kể về quá khứ, tiếng Việt thường dùng “ấy.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “Bà ẩn mình năm tháng” hoặc “Bà sống tách biệt trong năm tháng.” Dạng động từ Hy Lạp cho thấy hành động kéo dài trong khoảng thời gian đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Sau những ngày ấy
  rationale: μετά với đối cách chỉ thời gian tiếp nối, còn δέ là từ nối nhẹ nên không cần dịch riêng. Trong lối kể chuyện tiếng Việt, “những ngày ấy” tự nhiên hơn cách bám sát hình thức “những ngày này” của ταύτας.
- source_word: συνέλαβεν
  choice: có thai
  rationale: Trong ngữ cảnh này, συλλαμβάνω chỉ việc thụ thai. “Có thai” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: Ἐλισάβετ
  choice: Ê-li-sa-bét
  rationale: Phiên âm tên riêng theo cách đọc quen thuộc trong tiếng Việt.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: vợ ông
  rationale: γυνή có thể là “người phụ nữ” hoặc “vợ”; với đại từ sở hữu và trong ngữ cảnh này, nghĩa “vợ” là rõ ràng. “Ông” quy chiếu về Xa-cha-ri.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: Bà cứ ẩn mình
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động kéo dài; “cứ ẩn mình” giữ được sắc thái tiếp diễn và tính phản thân mà không suy đoán lý do.
- source_word: μῆνας πέντε
  choice: suốt năm tháng
  rationale: Đối cách diễn tả khoảng thời gian. “Suốt” làm rõ hành động kéo dài trong toàn bộ khoảng năm tháng.
- source_word: λέγουσα
  choice: 'và nói:'
  rationale: Phân từ hiện tại dẫn vào lời nói ở câu kế tiếp. Chuyển thành động từ hữu hạn giúp câu tiếng Việt tự nhiên, còn dấu hai chấm cho thấy lời nói tiếp tục.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” để quy chiếu tự nhiên về Ê-li-sa-bét; giữ sự mơ hồ của bản văn về lý do bà ẩn mình. Câu kết bằng dấu hai chấm vì lời bà được nêu ở câu tiếp theo.
