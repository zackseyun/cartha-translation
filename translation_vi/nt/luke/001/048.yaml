  naturalness: Văn bản tự nhiên trong tiếng Việt hiện đại với sắc thái trang trọng, thi ca phù hợp Bài ca Ma-ri. “Ngài,” “đoái nhìn,” và “Kìa” thuộc đăng ký tôn giáo-trang trọng nhưng vẫn rõ nghĩa. Cụm “nữ tỳ Ngài” là lối sở hữu rút gọn quen thuộc trong văn phong Kinh Thánh; không cần đổi thành cách dài hơn, vốn sẽ gây nặng câu.
  terminology: “Thân phận thấp hèn” bảo toàn bình diện xã hội của ταπείνωσις. “Nữ tỳ” là lựa chọn phù hợp cho δούλη trong giọng văn này, còn chú thích bảo lưu cách dịch trực tiếp hơn. “Người có phước” diễn đạt μακαρίζω như một sự tuyên nhận người được phước, không thêm hàm ý giáo phái.
