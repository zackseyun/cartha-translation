id: LUK.1.48
reference: Luke 1:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: vi
  text: vì Ngài đã đoái nhìn thân phận thấp hèn của nữ tỳ Ngài.[a] Kìa, từ nay mọi thế hệ sẽ gọi tôi là người có phước.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nữ tỳ” dịch từ một từ cũng có thể dịch trực tiếp là “nữ nô lệ” hoặc “nữ đầy tớ”.
    reason: alternative_reading
  - marker: b
    text: Hay “sẽ xưng tôi là có phước”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: đã đoái nhìn
  rationale: Diễn đạt việc Thiên Chúa hướng sự chú ý đến Ma-ri với hàm ý ưu ái; “đoái nhìn” tự nhiên trong văn phong thi ca trang trọng và không thêm ý ngoài nguyên ngữ.
- source_word: ταπείνωσιν
  choice: thân phận thấp hèn
  rationale: Chỉ địa vị hoặc hoàn cảnh thấp kém của Ma-ri, chứ không chỉ đức tính khiêm nhường nội tâm; cách dịch này cũng không buộc từ ngữ mang nghĩa bị làm nhục.
- source_word: δούλης
  choice: nữ tỳ
  rationale: Giữ sắc thái một nữ nô bộc thuộc về chủ, đồng thời phù hợp với lời ca trang trọng trong tiếng Việt; chú thích nêu cách dịch trực tiếp hơn để bảo toàn lực nghĩa.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng gây chú ý và nhấn mạnh của từ Hy Lạp, phù hợp với giọng thơ mà vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀπὸ τοῦ νῦν
  choice: từ nay
  rationale: Cách nói gọn, tự nhiên, giữ nguyên ý nghĩa bắt đầu từ thời điểm hiện tại và tiếp tục về sau.
- source_word: μακαριοῦσίν με
  choice: sẽ gọi tôi là người có phước
  rationale: Thể hiện việc các thế hệ công khai nhìn nhận và tuyên xưng Ma-ri là người được phước; không ngụ ý bà là nguồn ban phước.
- source_word: πᾶσαι αἱ γενεαί
  choice: mọi thế hệ
  rationale: Chỉ toàn bộ các thế hệ kế tiếp; ý tương lai đã được thể hiện qua “từ nay” và động từ “sẽ gọi”.
theological_decisions:
- issue: Cách dịch lời Ma-ri tự xưng là δούλη
  choice: nữ tỳ
  alternative: nữ nô lệ; nữ đầy tớ
  rationale: “Nữ tỳ” giữ ý phục thuộc và thuộc về Thiên Chúa mà không đưa vào các khẳng định giáo phái về Ma-ri. Vì từ này trong tiếng Việt có thể được hiểu nhẹ hơn “nô lệ”, chú thích bảo lưu sắc thái trực tiếp của nguyên ngữ.
- issue: Ý nghĩa của ταπείνωσις trong bài ca của Ma-ri
  choice: thân phận thấp hèn
  alternative: sự thấp hèn; cảnh bị hạ nhục
  rationale: Ngữ cảnh nhấn mạnh địa vị thấp kém của Ma-ri trước khi được Thiên Chúa đoái đến, không đơn thuần nói về đức khiêm nhường nội tâm và cũng không nhất thiết khẳng định bà đã bị làm nhục.
- issue: Ý nghĩa của μακαριοῦσίν με
  choice: gọi tôi là người có phước
  alternative: xưng tôi là có phước; cho tôi là người có phước
  rationale: Giữ trọng tâm ở sự nhìn nhận của các thế hệ rằng Ma-ri được Thiên Chúa ban phước, tránh diễn giải thành sự thờ phượng hoặc cho rằng bà tự ban phước.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và có nhịp điệu thi ca. “Ngài” phù hợp lời ca hướng về Thiên Chúa; “Kìa” giữ sắc thái nhấn mạnh. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
