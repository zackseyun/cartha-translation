  rationale: Chỉ điều chỉnh “trở về” thành “đi về” để không thêm sắc thái trở lại, và làm rõ chú thích từ vựng về οἶκος. Các lựa chọn còn lại giữ được ý nghĩa, giọng văn, và sắc thái của bản văn nguồn.
