    issue: “trở về” diễn đạt mạnh hơn ἀπῆλθεν.
    rationale: Động từ Hy Lạp có nghĩa cơ bản là “đi/ra đi”; đích đến là nhà của ông, nhưng bản văn không nhấn rõ hành động “trở lại.” “Đi về nhà mình” sát hơn mà vẫn tự nhiên.
  - severity: low
    issue: Cách diễn đạt chú thích a về phạm vi nghĩa của οἶκος chưa thật chính xác, gọn rõ.
    rationale: οἶκος có thể chỉ căn nhà hoặc, theo nghĩa rộng, gia đình/hộ nhà. “Nhà cửa và gia đình” dễ tạo cảm giác liệt kê hai thực thể hơn là nêu sự mở rộng nghĩa của một từ.
  revised_text: Khi những ngày phục vụ của ông đã mãn[b], ông đi về nhà mình.[a]
