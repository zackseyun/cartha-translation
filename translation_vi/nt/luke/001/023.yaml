  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: vi
  text: Khi những ngày phục vụ của ông đã mãn[b], ông đi về nhà mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đến nhà của ông”. Từ Hy Lạp có thể chỉ căn nhà hoặc, theo nghĩa rộng hơn, gia đình/hộ nhà của ông.
    reason: lexical_alternative
  - marker: b
    text: “Phục vụ” ở đây chỉ phiên nhiệm vụ được ấn định cho Xa-cha-ri tại đền thờ trong tư cách thầy tế lễ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: không dịch thành một cụm riêng
  rationale: Đây là công thức kể chuyện quen thuộc của Lu-ca. Trong tiếng Việt hiện đại, mở câu trực tiếp bằng mệnh đề thời gian tự nhiên hơn và vẫn giữ nguyên diễn tiến của lời kể.
- source_word: ὡς
  choice: khi
  rationale: Ở đây từ này mở đầu một mệnh đề chỉ thời gian; “khi” là cách diễn đạt tự nhiên và chính xác.
- source_word: ἐπλήσθησαν
  choice: đã mãn
  rationale: Động từ chỉ những ngày được ấn định đã đạt đủ số, tức đã kết thúc. “Đã mãn” ngắn gọn, trang trọng và phù hợp với một kỳ phục vụ.
- source_word: λειτουργίας
  choice: phục vụ
  rationale: Trong ngữ cảnh, từ này nói đến phiên nhiệm vụ của Xa-cha-ri tại đền thờ trong tư cách thầy tế lễ. Bản văn chính giữ cách nói gọn, còn chú thích làm rõ bối cảnh nghi lễ.
- source_word: ἀπῆλθεν
  choice: trở về
  rationale: Động từ tự nó có nghĩa là đi khỏi; nhưng vì đích đến là nhà của ông sau thời gian thi hành nhiệm vụ, “trở về” diễn đạt tự nhiên hướng chuyển động trong tiếng Việt mà không làm thay đổi ý.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: về nhà mình
  rationale: οἶκος có thể chỉ căn nhà hoặc rộng hơn là mái ấm/gia đình. “Nhà mình” tự nhiên trong tiếng Việt và giữ được phần lớn phạm vi nghĩa ấy.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lược công thức kể chuyện καὶ ἐγένετο như một thành ngữ riêng để tránh câu tiếng Việt nặng nề; dùng “đã mãn” nhằm giữ sắc thái những ngày được ấn định đã đạt đủ kỳ hạn. Tất cả dấu chú thích đều xuất hiện trong bản văn chính.
