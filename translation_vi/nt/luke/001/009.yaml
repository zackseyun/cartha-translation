  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: vi
  text: Theo lệ thường của chức tế lễ, ông được chọn bằng cách bắt thăm để dâng hương khi vào đền thờ của Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “khi vào nơi thánh của Chúa.” Từ Hy Lạp ναός ở đây thường chỉ tòa nhà đền thờ, đặc biệt là phần thánh điện bên trong, chứ không phải toàn bộ khuôn viên đền thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: theo lệ thường của chức tế lễ
  rationale: Cụm κατά với đối cách diễn tả sự phù hợp với một thông lệ đã được thiết lập; ἱερατεία chỉ chức vụ hoặc sự phục vụ tế lễ. Cách dịch này vừa giữ nét thể chế vừa tự nhiên trong tiếng Việt.
- source_word: ἔλαχε
  choice: ông bắt thăm được nhiệm vụ
  rationale: Động từ λαγχάνω nói đến việc nhận được điều gì qua hình thức bắt thăm. Cách diễn đạt này nêu rõ phương thức và tránh hàm ý rằng con người trực tiếp bổ nhiệm ông.
- source_word: τοῦ θυμιᾶσαι
  choice: để dâng hương
  rationale: Động từ θυμιάω chỉ việc đốt hoặc dâng hương; trong bối cảnh nghi lễ, “dâng hương” tự nhiên và thể hiện đây là hành vi thờ phượng.
- source_word: εἰσελθὼν εἰς τὸν ναὸν
  choice: vào nơi thánh
  rationale: Phân từ aorist εἰσελθών gắn việc đi vào với nhiệm vụ dâng hương. ναός ở đây nhiều khả năng chỉ chính điện/nơi thánh của đền thờ, không phải toàn bộ khuôn viên.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: κύριος trong ngữ cảnh đền thờ chỉ Đức Chúa Trời; “Chúa” phản ánh trực tiếp từ Hy Lạp mà không tự ý thay bằng dạng biểu thị danh riêng YHWH.
theological_decisions:
- issue: Phạm vi nghĩa của ναός trong bối cảnh thờ phượng tại đền thờ
  choice: nơi thánh
  alternative: đền thờ
  rationale: ναός thường chỉ tòa nhà thánh, nhất là phần bên trong, khác với toàn bộ khuôn viên đền thờ; việc Xa-cha-ri vào dâng hương củng cố nghĩa hẹp này. Chọn “nơi thánh” trong chính văn để truyền đạt chính xác không gian nghi lễ, đồng thời ghi nhận cách dịch quen thuộc “đền thờ” trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chức tế lễ” để giữ sắc thái thể chế; dùng “bắt thăm được nhiệm vụ” nhằm diễn đạt rõ thủ tục tuyển chọn. Trật tự câu được điều chỉnh cho tự nhiên trong tiếng Việt, nhưng vẫn giữ mối liên hệ giữa bắt thăm, đi vào nơi thánh và dâng hương.
