  to: Theo lệ thường của chức tế lễ, ông được chọn bằng cách bắt thăm để dâng hương khi vào đền thờ của Chúa.[a]
  rationale: Bản sửa đặt “để dâng hương” ngay sau cụm “được chọn bằng cách bắt thăm,” nhờ đó phản ánh trực tiếp τοῦ θυμιᾶσαι là nội dung của điều ông nhận được qua bắt thăm. “Khi vào” giữ quan hệ thời gian của εἰσελθών mà không xác định quá mức trình tự. “Đền thờ” là cách dịch chính văn tự nhiên; chú thích giữ lại khả năng nghĩa hẹp của ναός.
