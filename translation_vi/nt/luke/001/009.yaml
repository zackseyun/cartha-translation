    rationale: Trong tiếng Việt, “bắt thăm được nhiệm vụ vào nơi thánh ... để dâng hương” dễ gắn “nhiệm vụ” trước hết với hành động “vào nơi thánh.” Nguyên văn nói ông được trúng/chọn bằng thăm để dâng hương, với phân từ “sau/khi đã vào” bổ nghĩa theo thời gian cho hành động đó.
  - severity: low
