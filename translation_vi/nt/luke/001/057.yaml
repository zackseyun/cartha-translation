    rationale: “Kỳ hạn” thường chỉ deadline/thời hạn; thành ngữ Hy Lạp nói thời gian thai kỳ đã đủ, được tiếng Việt diễn đạt tự nhiên nhất là “đến kỳ sinh nở.”
  - severity: low
