  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: vi
  text: Đến kỳ sinh nở, Ê-li-sa-bét sinh một con trai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, sát nguyên văn: “Thời gian Ê-li-sa-bét sinh nở đã mãn.”'
    reason: Nêu lối diễn đạt sát thành ngữ Hy Lạp “thời gian đã được làm cho trọn/đã mãn”, trong khi bản chính dùng cách nói tiếng Việt tự nhiên hơn.
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ trong mạch kể chuyện. Tiếng Việt không cần thêm “bấy giờ” hay “nay”, vì như vậy dễ tạo sắc thái thời gian rõ hơn nguyên văn.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: kỳ hạn… đã mãn
  rationale: Giữ hình ảnh thời kỳ đã trọn hoặc hoàn tất trong nguyên văn, đồng thời dùng cách diễn đạt trang trọng và dễ hiểu trong tiếng Việt.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: sinh nở của Ê-li-sa-bét
  rationale: Diễn đạt rõ việc đến kỳ sinh con; nhắc lại tên riêng giúp câu tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: ἐγέννησεν
  choice: bà sinh
  rationale: Động từ kể lại hành động sinh con đã hoàn tất; “bà” là đại từ tự nhiên và tôn trọng khi quy chiếu về Ê-li-sa-bét.
- source_word: υἱόν
  choice: một con trai
  rationale: Giữ đúng nghĩa chỉ người con thuộc nam giới của danh từ Hy Lạp.
- source_word: Ἐλισάβετ
  choice: Ê-li-sa-bét
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc đối với độc giả tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản chính giữ nét diễn đạt “đã mãn” của nguyên văn; chú thích cung cấp cách nói tiếng Việt tự nhiên hơn.
