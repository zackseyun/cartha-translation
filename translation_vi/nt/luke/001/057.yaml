- from: Kỳ hạn sinh nở của Ê-li-sa-bét đã mãn[a], và bà sinh một con trai.
  to: Đến kỳ sinh nở, Ê-li-sa-bét sinh một con trai.[a]
  rationale: 'Sửa “kỳ hạn sinh nở ... đã mãn” thành “Đến kỳ sinh nở” để tránh sắc thái “thời hạn” không cần thiết và để câu văn hiện đại, tự nhiên. Trật tự mệnh đề vẫn phản ánh nguyên văn: thời gian sinh nở đã đến trước, rồi Ê-li-sa-bét sinh con trai. Chú thích được chỉnh để cung cấp lựa chọn sát nguyên văn mà không áp đặt cách diễn giải.'
