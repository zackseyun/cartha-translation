id: LUK.1.17
reference: Luke 1:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: vi
  text: Người sẽ đi trước Ngài với tinh thần và quyền năng của Ê-li[a], để hướng lòng những người cha về con cái[b], và đưa những kẻ không vâng phục đến sự sáng suốt của những người công chính[c], hầu chuẩn bị cho Chúa một dân sẵn sàng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ “tinh thần và quyền năng của Ê-li” mô tả một chức vụ tiên tri và năng lực theo mẫu mực Ê-li; không nhất thiết có nghĩa chính Ê-li đích thân trở lại.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “hướng lòng những người cha về phía con cái.” Cụm từ này gợi lại Ma-la-chi 4:6 và có thể hàm ý sự hòa giải trong gia đình.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “theo cách suy xét của những người công chính” hoặc “trong sự khôn ngoan thận trọng của những người công chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: sẽ đi trước Ngài
  rationale: Diễn đạt tự nhiên ý đi trước một người trong sứ mạng, đồng thời không xác định rõ hơn đối tượng của đại từ αὐτοῦ so với nguyên bản.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: với tinh thần và quyền năng của Ê-li
  rationale: Giữ sự song hành của πνεῦμα và δύναμις, đồng thời diễn đạt tự nhiên trong tiếng Việt về phẩm chất và năng lực tiên tri giống Ê-li.
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: để khiến lòng những người cha quay về với con cái
  rationale: Giữ hình ảnh 'lòng' và động tác quay về trong điển tích Ma-la-chi, đồng thời dùng cấu trúc tiếng Việt rõ nghĩa.
- source_word: ἀπειθεῖς
  choice: những kẻ không vâng phục
  rationale: Bao quát ý ngoan cố, không chịu nghe và bất tuân, phù hợp với sự đối chiếu đạo đức cùng những người công chính.
- source_word: ἐν φρονήσει δικαίων
  choice: quay về với sự khôn ngoan của những người công chính
  rationale: φρόνησις chỉ sự hiểu biết thực tiễn hay cách suy xét khôn ngoan; cách dịch này đọc tự nhiên nhưng vẫn để chú thích ghi nhận khả năng hiểu theo nghĩa tâm trí hoặc sự thận trọng.
- source_word: ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον
  choice: hầu chuẩn bị cho Chúa một dân sẵn sàng
  rationale: Thể hiện mục đích của ἑτοιμάσαι và trạng thái đã sẵn sàng do phân từ hoàn thành thụ động κατεσκευασμένον diễn tả.
theological_decisions:
- issue: Ý nghĩa của ngôn ngữ về Ê-li
  choice: Giăng thi hành chức vụ với tinh thần và quyền năng giống Ê-li.
  alternative: Hiểu câu này là Ê-li đích thân trở lại theo nghĩa đen.
  rationale: Nguyên văn nói 'với/trong tinh thần và quyền năng của Ê-li', nhấn mạnh sự tiếp nối và năng lực tiên tri chứ không đồng nhất hai nhân vật.
- issue: Đối tượng của đại từ αὐτοῦ và danh xưng κυρίῳ
  choice: Giữ 'Ngài' và 'Chúa' như cách diễn đạt của nguyên văn.
  alternative: Mở rộng thành 'Đấng Mê-si-a' hoặc 'Đức Chúa Trời/Chúa Giê-su' ngay trong câu.
  rationale: Ngữ cảnh giúp nhận diện đối tượng, nhưng chính câu này dùng đại từ và danh xưng; bản dịch không nên âm thầm giải quyết mối liên hệ thần học vốn được diễn đạt hàm súc.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại và dễ hiểu. Dùng “Ngài” để chỉ đối tượng của đại từ trong ngữ cảnh tôn kính, “Chúa” cho κύριος, và tên quen dùng “Ê-li”. Các dấu chú thích [a], [b], [c] đều đặt ngay sau cụm từ liên quan.
