  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: vi
  text: Cả hai đều công chính trước mặt Đức Chúa Trời, sống không chỗ trách được, tuân theo mọi điều răn và quy định của Chúa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: người công chính
  rationale: Giữ được sắc thái đạo đức và giao ước của từ Hy Lạp, thay vì chỉ diễn đạt sự ngay thẳng nói chung hay công bằng theo nghĩa pháp lý.
- source_word: ἀμφότεροι
  choice: cả hai
  rationale: Nhấn mạnh rằng lời mô tả áp dụng như nhau cho Xa-cha-ri và Ê-li-sa-bét.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt tự nhiên ý họ được nhìn nhận và đánh giá là công chính trong mắt Đức Chúa Trời, chứ không chỉ theo tiêu chuẩn con người.
- source_word: πορευόμενοι
  choice: sống
  rationale: Trong ngữ cảnh đạo đức, động từ mang nghĩa ẩn dụ về cách sống; “sống” rõ ràng và tự nhiên hơn lối dịch sát “bước đi” trong tiếng Việt hiện đại.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: theo mọi điều răn
  rationale: Diễn đạt cách sống phù hợp với toàn bộ các điều răn, đồng thời bảo toàn phạm vi bao quát của πάσαις.
- source_word: δικαιώμασιν
  choice: quy định
  rationale: Chỉ những quy định hoặc điều lệ được ấn định, đồng thời giữ được sự phân biệt tương đối với “điều răn”.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Cách diễn đạt sở hữu tự nhiên; trong ngữ cảnh này, “Chúa” chỉ Đức Chúa Trời của Israel.
- source_word: ἄμεμπτοι
  choice: không chỗ trách được
  rationale: Giữ sức mạnh của tính từ chỉ tư cách không đáng bị khiển trách mà không tự ý biến câu thành một khẳng định về sự hoàn hảo tuyệt đối.
- source_word: ἦσαν δὲ
  choice: đều là
  rationale: Động từ số nhiều được thể hiện qua cấu trúc “cả hai đều”; δέ là liên từ nhẹ và không cần dịch cứng thành một từ nối trong câu tiếng Việt độc lập.
theological_decisions:
- issue: ἄμεμπτοι có hàm ý hoàn toàn vô tội hay không
  choice: Dịch là “không chỗ trách được”, giữ nguyên lời đánh giá mạnh mẽ về cách sống của họ.
  alternative: Diễn giải thành “trung tín” hoặc thêm lời giới hạn rằng họ không hoàn hảo.
  rationale: Nguyên văn mô tả họ không đáng bị trách cứ trong việc tuân giữ các điều răn và quy định. Bản dịch không làm yếu lời ấy, cũng không thêm một kết luận giáo lý về sự vô tội tuyệt đối mà câu không trực tiếp nêu ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chọn “sống” thay cho ẩn dụ dịch sát “bước đi”; dùng “Đức Chúa Trời” cho θεός và “Chúa” cho κύριος để câu tự nhiên mà vẫn phân biệt cách gọi trong nguyên văn.
