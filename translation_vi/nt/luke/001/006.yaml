  to: Cả hai đều công chính trước mặt Đức Chúa Trời, sống không chỗ trách được, tuân theo mọi điều răn và quy định của Chúa.
  rationale: Bản sửa giữ nguyên toàn bộ nội dung và mức độ khẳng định của nguyên văn, đồng thời điều chỉnh cấu trúc câu cho rõ và tự nhiên hơn trong tiếng Việt hiện đại. “Tuân theo” diễn đạt chức năng đạo đức của πορευόμενοι ἐν mà không áp đặt cách giải thích thần học nào.
