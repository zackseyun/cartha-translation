translation:
  language: vi
  text: Họ bèn ra hiệu cho cha em bé, hỏi ông muốn em bé được gọi là gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa hơn: “Họ ra hiệu cho cha em bé về việc ông có thể muốn em bé được gọi là gì.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνένευον
  choice: ra hiệu
  rationale: Động từ chỉ việc truyền đạt bằng dấu hiệu hoặc cử chỉ; “ra hiệu” tự nhiên và chính xác trong tiếng Việt.
- source_word: δὲ
  choice: bèn
  rationale: Tiểu từ nối nhẹ, đưa câu chuyện tiến sang hành động kế tiếp; “bèn” diễn tả mạch kể tự nhiên mà không tạo sắc thái tương phản mạnh.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: cho cha của em
  rationale: Dữ cách chỉ người tiếp nhận dấu hiệu. “Cha của em” làm rõ đại từ chỉ về đứa trẻ.
- source_word: τὸ τί ἂν θέλοι
  choice: để hỏi ông muốn
  rationale: Cụm này giới thiệu nội dung được truyền đạt bằng cử chỉ. “Để hỏi ông muốn” diễn đạt tự nhiên chức năng của hành động, trong khi sắc thái tiềm năng hoặc dè dặt của ἄν với thể optative khó tái hiện gọn trong tiếng Việt.
- source_word: καλεῖσθαι αὐτό
  choice: đặt tên em là gì
  rationale: Nghĩa đen là “em được gọi là gì”; trong ngữ cảnh đặt tên cho trẻ, “đặt tên em là gì” là cách nói tiếng Việt tự nhiên, dù chuyển cấu trúc bị động thành chủ động theo ngữ dụng.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “em” để chỉ đứa trẻ, tránh đại từ vô nhân xưng; giữ chú thích cho cấu trúc sát nguyên văn và sắc thái gián tiếp của câu hỏi.
