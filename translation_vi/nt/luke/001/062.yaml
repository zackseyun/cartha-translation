revisions:
- from: Họ bèn ra hiệu cho cha của em để hỏi ông muốn đặt tên em là gì.[a]
  to: Họ bèn ra hiệu cho cha em bé, hỏi ông muốn em bé được gọi là gì.[a]
  rationale: Bản sửa thay đại từ có thể mơ hồ bằng «em bé», giữ «ra hiệu» cho hành động giao tiếp không lời, và diễn đạt nội dung câu hỏi gián tiếp theo sát cấu trúc Hy Lạp hơn. Chú thích bảo lưu sắc thái khả năng/dè dặt của θέλοι ἄν mà không áp đặt cách giải thích giáo phái.
