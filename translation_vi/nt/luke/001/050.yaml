  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: vi
  text: Và lòng thương xót của Ngài dành cho những người kính sợ Ngài qua các thế hệ, từ thế hệ này đến thế hệ khác.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đến các thế hệ và các thế hệ,” diễn tả lòng thương xót tiếp tục qua các thế hệ nối tiếp nhau.'
    reason: lexical_alternative
  - marker: b
    text: “Kính sợ Ngài” nói đến lòng tôn kính sâu xa và thái độ sống tôn kính Đức Chúa Trời, chứ không chỉ là khiếp đảm.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Diễn đạt trực tiếp lòng nhân từ và sự xót thương dành cho người cần được thương xót, đồng thời phù hợp với giọng văn giao ước trong bài ca của Ma-ri.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: từ đời này sang đời kia
  rationale: Cách nói tự nhiên trong tiếng Việt, diễn tả lòng thương xót tiếp tục trải qua các thế hệ kế tiếp; chú thích giữ lại hình thức sát nguyên văn hơn.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: dành cho những người kính sợ Ngài
  rationale: Dạng tặng cách chỉ những người hưởng lòng thương xót. “Kính sợ” giữ được cả ý kính reverence lẫn sức nặng của “sợ” khi Đức Chúa Trời là đối tượng.
- source_word: καὶ
  choice: Và
  rationale: Giữ liên kết cộng dồn với những câu trước trong bài ca.
- source_word: αὐτοῦ / αὐτόν
  choice: của Ngài / Ngài
  rationale: Các đại từ đều chỉ về Đức Chúa Trời trong văn cảnh; “Ngài” là cách xưng hô trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của việc “sợ” Đức Chúa Trời
  choice: kính sợ Ngài
  alternative: tôn kính Ngài; sợ Ngài
  rationale: φοβέομαι khi có Đức Chúa Trời làm đối tượng thường bao hàm lòng tôn kính và thái độ đạo hạnh, nhưng vẫn giữ yếu tố “sợ”; “kính sợ” tránh biến thành nỗi khiếp đảm đơn thuần mà không làm phẳng sức nặng thần học.
- issue: Phạm vi kéo dài của lòng thương xót
  choice: từ đời này sang đời kia
  alternative: đến các thế hệ nối tiếp nhau
  rationale: Cụm Hy Lạp nói đến sự tiếp diễn qua nhiều thế hệ, chứ không khẳng định vô điều kiện rằng mọi cá nhân trong mọi thế hệ đều nhận được lòng thương xót; đối tượng vẫn là những người kính sợ Ngài.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu; duy trì nhịp thơ cộng dồn của bài ca Ma-ri. Dùng “lòng thương xót,” “kính sợ” và “từ đời này sang đời kia” là những cách nói quen thuộc nhưng không quá cổ.
