    rationale: γενεὰς nghĩa là các thế hệ. “Đời này sang đời kia” là thành ngữ có thể chấp nhận, nhưng cũng có thể được hiểu là các thời đại hoặc các kiếp đời. Nêu rõ “thế hệ” bảo toàn hình ảnh và phạm vi của nguyên văn.
