  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: vi
  text: đến với một trinh nữ đã đính hôn[a] với một người đàn ông tên là Giô-sép, thuộc nhà Đa-vít; tên trinh nữ ấy là Ma-ri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được hứa gả.” Từ Hy Lạp chỉ một tình trạng đính ước chính thức trước khi đôi bên chung sống trọn vẹn như vợ chồng.'
    reason: lexical_alternative
  - marker: b
    text: Hay “Ma-ri-am,” là dạng phiên âm sát hơn với tên trong tiếng Hy Lạp.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: trinh nữ
  rationale: Từ Hy Lạp ở đây có nghĩa thông thường là người nữ chưa có quan hệ tính dục; việc Lu-ca lặp lại từ này trong cùng câu nhấn mạnh ý nghĩa ấy.
- source_word: ἐμνηστευμένην
  choice: đã đính hôn
  rationale: Phân từ hoàn thành diễn tả một tình trạng đính ước chính thức đã được thiết lập. “Đã đính hôn” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại; chú thích nêu “đã được hứa gả” để làm rõ sắc thái pháp lý và xã hội mạnh hơn so với cách hiểu hiện đại thông thường về lễ đính hôn.
- source_word: ἀνδρὶ
  choice: với một người đàn ông
  rationale: ἀνήρ có thể là “người đàn ông” hoặc “chồng”, nhưng kết cấu với việc đính hôn không đòi hỏi dịch là “chồng”; lựa chọn này tránh nói quá mức về giai đoạn hôn nhân.
- source_word: ᾧ ὄνομα Ἰωσήφ
  choice: tên là Giô-sép
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt của công thức gọi tên trong tiếng Hy Lạp.
- source_word: ἐξ οἴκου Δαυίδ
  choice: thuộc nhà Đa-vít
  rationale: Giữ hình ảnh Kinh Thánh về “nhà” theo nghĩa dòng tộc và vương triều, đồng thời diễn đạt tự nhiên quan hệ xuất thân hoặc thuộc về.
- source_word: Μαριάμ
  choice: Ma-ri
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt; chú thích bảo lưu dạng phiên âm sát tiếng Hy Lạp hơn.
theological_decisions:
- issue: Có nên dịch παρθένος theo nghĩa bảo lưu tình trạng đồng trinh trong trình thuật thời thơ ấu của Lu-ca hay không
  choice: trinh nữ
  alternative: thiếu nữ
  rationale: Từ ngữ Hy Lạp và ngữ cảnh trực tiếp hỗ trợ rõ nghĩa “trinh nữ”. Cách dịch này bảo toàn ý nghĩa thần học của văn bản mà không thêm điều vượt quá câu.
- issue: Tư cách của Giô-sép trong giai đoạn đính ước
  choice: một người đàn ông mà cô đã đính hôn
  alternative: chồng
  rationale: Văn bản mô tả một tình trạng đính ước chính thức nhưng chưa dùng chính cấu trúc này để xác quyết đầy đủ sắc thái của đời sống hôn nhân; vì vậy không dịch ἀνήρ là “chồng” tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nguyên tính chất nối tiếp của mệnh đề mở đầu “đến với” vì đây là một phần của câu dài bắt đầu ở câu trước. Các tên riêng dùng dạng quen thuộc trong Kinh Thánh tiếng Việt.
