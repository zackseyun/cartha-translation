  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: vi
  text: 'Và mẹ cậu bé đáp: “Không, mà cậu bé sẽ được gọi là Giăng.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: đáp
  rationale: Phân từ bất định quá khứ của ἀποκρίνομαι dùng để dẫn lời đáp; chuyển thành động từ hữu hạn là tự nhiên trong tiếng Việt.
- source_word: μήτηρ αὐτοῦ
  choice: mẹ em
  rationale: Đại từ αὐτοῦ chỉ đứa trẻ đang được đặt tên; “mẹ em” tự nhiên, rõ nghĩa và tránh cách dịch cứng “mẹ của em ấy”.
- source_word: Οὐχί
  choice: Không!
  rationale: Lời phủ định trực tiếp và dứt khoát; dấu chấm than thể hiện lực nhấn mạnh của οὐχί trong ngữ cảnh.
- source_word: ἀλλὰ
  choice: nhưng
  rationale: ἀλλά bác bỏ đề nghị trước đó rồi đưa ra sự sửa lại; “nhưng” diễn đạt tự nhiên quan hệ tương phản, đính chính trong tiếng Việt.
- source_word: κληθήσεται
  choice: phải được gọi là
  rationale: Thể tương lai bị động của καλέω được giữ bằng “được gọi”; “phải” truyền đạt sắc thái quả quyết trong lời người mẹ mà không biến câu thành lời khuyên.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên Kinh Thánh tiếng Việt quen thuộc cho Ἰωάννης.
theological_decisions:
- issue: Sắc thái của thì tương lai trong κληθήσεται
  choice: phải được gọi là
  alternative: sẽ được gọi là
  rationale: Ngữ cảnh là lời khẳng định dứt khoát về tên của đứa trẻ. “Phải được gọi là” thể hiện lực xác quyết, còn “sẽ được gọi là” bám sát hình thức tương lai hơn; không suy diễn nguyên nhân thần học của sự bắt buộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “em” để chỉ trẻ sơ sinh theo lối nói tự nhiên của tiếng Việt; giữ câu thoại ngắn và dứt khoát.
