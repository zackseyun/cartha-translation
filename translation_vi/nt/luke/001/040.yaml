source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸν οἶκον Ζαχαρίου καὶ ἠσπάσατο τὴν Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: vi
  text: rồi vào nhà Xa-cha-ri và chào Ê-li-sa-bét.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: vào
  rationale: Động từ aorist εἰσέρχομαι chỉ hành động đi vào một nơi. “Vào” tự nhiên, gọn và đủ rõ trong tiếng Việt.
- source_word: οἶκον
  choice: nhà
  rationale: Với giới từ εἰς, từ này chỉ ngôi nhà là địa điểm được đi vào; “nhà” vừa sát nghĩa vừa tự nhiên.
- source_word: Ζαχαρίου
  choice: Xa-cha-ri
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt cho tên riêng Ζαχαρίας ở sở hữu cách.
- source_word: ἠσπάσατο
  choice: chào
  rationale: ἀσπάζομαι ở đây diễn tả việc chào hỏi khi gặp mặt. “Chào” trực tiếp và không thêm sắc thái nồng nhiệt hay nghi lễ vốn không được câu Hy Lạp xác định.
- source_word: Ἐλισάβετ
  choice: Ê-li-sa-bét
  rationale: Dùng dạng phiên âm tiếng Việt dễ đọc và quen thuộc cho tên riêng Ἐλισάβετ.
- source_word: καὶ
  choice: rồi; và
  rationale: Καί thứ nhất nối câu này với diễn tiến trước nên “rồi” tạo mạch kể tự nhiên; καί thứ hai phối hợp hai hành động nên dịch là “và”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc phối hợp đơn giản của nguyên văn nhưng dùng “rồi” ở đầu câu để mạch tiếng Việt tự nhiên. Không cần chú thích vì các phương án “đi vào nhà” và “chào hỏi” không tạo khác biệt nội dung đáng kể.
