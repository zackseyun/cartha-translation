id: LUK.1.13
reference: Luke 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: vi
  text: 'Nhưng thiên sứ nói với ông: “Đừng sợ, Xa-cha-ri, vì lời cầu xin của ông đã được lắng nghe[a]. Vợ ông là Ê-li-sa-bét sẽ sinh cho ông một con trai, và ông sẽ đặt tên con là Giăng[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời khẩn cầu của ông đã được lắng nghe.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn, theo thành ngữ: “ông sẽ gọi tên người ấy là Giăng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Nhưng ... nói
  rationale: δέ là liên từ chuyển ý nhẹ; “nhưng” phù hợp với sự chuyển từ nỗi sợ của Xa-cha-ri sang lời trấn an mà không tạo tương phản quá mạnh.
- source_word: ὁ ἄγγελος
  choice: thiên sứ
  rationale: Trong ngữ cảnh này, ἄγγελος chỉ một sứ giả thuộc thiên giới; “thiên sứ” là cách gọi tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ
  rationale: Cách diễn đạt ngắn gọn, tự nhiên, truyền đạt đúng lời cấm và lời trấn an trong nguyên văn.
- source_word: Ζαχαρία
  choice: Xa-cha-ri
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, tương ứng với Ζαχαρίας.
- source_word: διότι
  choice: vì
  rationale: Nêu rõ lý do Xa-cha-ri không cần sợ, đúng chức năng nhân quả của διότι.
- source_word: εἰσηκούσθη
  choice: đã được lắng nghe
  rationale: Giữ thể bị động và ý nghĩa một lời cầu xin đã được tiếp nhận, đồng thời không nêu đích danh tác nhân mà nguyên văn để hàm ẩn.
- source_word: ἡ δέησίς σου
  choice: lời cầu xin của ông
  rationale: δέησις là lời khẩn cầu hay thỉnh nguyện tha thiết; “lời cầu xin” tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: Vợ ông là Ê-li-sa-bét
  rationale: Với đại từ sở hữu và ngữ cảnh hôn nhân, γυνή rõ ràng mang nghĩa “vợ”; cấu trúc tiếng Việt này tự nhiên và xác định tên người vợ.
- source_word: γεννήσει υἱόν σοι
  choice: sẽ sinh cho ông một con trai
  rationale: Với chủ ngữ nữ, γεννάω có nghĩa sinh con; σοι diễn tả mối liên hệ và lợi ích dành cho Xa-cha-ri.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: ông sẽ đặt tên con là Giăng
  rationale: Diễn đạt tự nhiên thành ngữ Hy Lạp “gọi tên nó là”; giữ hình thức tương lai của καλέσεις mà không tự ý chuyển thành một mệnh lệnh trực tiếp.
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dùng dạng tên riêng đã quen thuộc trong Kinh Thánh tiếng Việt cho Ἰωάννης.
theological_decisions:
- issue: Tác nhân của thể bị động “đã được lắng nghe”
  choice: Giữ thể bị động, để hàm ý rằng Đức Chúa Trời đã nghe lời cầu xin mà không thêm tên Ngài vào câu.
  alternative: 'Dịch chủ động: “Đức Chúa Trời đã nghe lời cầu xin của ông.”'
  rationale: Trong bối cảnh cầu nguyện Do Thái, tác nhân tự nhiên được hiểu là Đức Chúa Trời, nhưng nguyên văn không nêu Ngài; bản dịch giữ sự hàm ẩn ấy và tránh giải thích quá mức.
translation_notes:
  register: Văn phong trang trọng vừa phải, tự nhiên và dễ hiểu đối với độc giả Việt Nam hiện đại. Câu giữ lời trấn an trực tiếp, thể bị động thần học của nguyên văn và công thức đặt tên, đồng thời dùng cách diễn đạt tiếng Việt thông dụng.
