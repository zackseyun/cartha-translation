  source_fidelity: 'Bản dịch chuyển đạt chính xác các thành tố chính của tiếng Hy Lạp: lời trấn an, lý do được nêu bằng διότι, thể bị động hàm ẩn tác nhân trong “đã được lắng nghe,” lời hứa Ê-li-sa-bét sẽ sinh một con trai, và việc đặt tên là Giăng. Không thêm tác nhân thần học vào thể bị động.'
  naturalness: Văn phong hiện đại, trang trọng vừa phải và tự nhiên. “Đặt tên con là Giăng” là cách Việt ngữ trôi chảy cho thành ngữ Hy Lạp. Tuy nhiên, chú thích b dùng “nó” để chỉ đứa trẻ không hợp với sắc thái tôn trọng thông thường trong tiếng Việt hiện đại, đồng thời chưa phản ánh sát cấu trúc “gọi tên người ấy.”
  terminology: “Thiên sứ,” “Xa-cha-ri,” “Ê-li-sa-bét,” và “Giăng” nhất quán với cách dùng Kinh Thánh Việt ngữ quen thuộc. “Lời cầu xin” phù hợp với δέησις; chú thích “lời khẩn cầu” nêu đúng sắc thái thay thế.
  issues:
