    issue: Cụm “vợ tôi thì tuổi đã cao” chưa thật tự nhiên.
    rationale: Tiếng Việt thường nói một người “đã cao tuổi” hơn là nói “tuổi đã cao.” Điều chỉnh này bảo toàn thành ngữ Hy Lạp chỉ tuổi già (προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς) trong cách diễn đạt tự nhiên hơn.
