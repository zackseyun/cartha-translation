source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: vi
  text: 'Xa-cha-ri nói với thiên sứ: “Dựa vào đâu tôi sẽ biết điều này? Vì tôi đã già, còn vợ tôi thì đã cao tuổi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν ... πρὸς τὸν ἄγγελον
  choice: nói với thiên sứ
  rationale: Diễn đạt tự nhiên cấu trúc chỉ người được nói với; “thiên sứ” phù hợp với nhân vật trong ngữ cảnh.
- source_word: Κατὰ τί
  choice: Dựa vào đâu
  rationale: Giữ sắc thái hỏi về căn cứ hoặc dấu hiệu để biết, cụ thể hơn cách dịch đơn thuần là “Làm sao”.
- source_word: γνώσομαι
  choice: tôi sẽ biết
  rationale: Giữ giá trị tương lai của động từ, không chuyển câu hỏi thành vấn đề về khả năng.
- source_word: πρεσβύτης
  choice: tôi đã già
  rationale: Truyền đạt trực tiếp tuổi cao của Xa-cha-ri bằng tiếng Việt tự nhiên; từ này nói về tuổi tác, không phải chức vị trưởng lão.
- source_word: ἡ γυνή μου
  choice: vợ tôi
  rationale: Trong cấu trúc sở hữu và ngữ cảnh hôn nhân, γυνή rõ ràng mang nghĩa “vợ”.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: tuổi đã cao
  rationale: Đây là cách nói tiếng Việt tự nhiên cho thành ngữ Hy Lạp theo nghĩa đen là “đã tiến xa trong những ngày của bà ấy”.
theological_decisions:
- issue: Nghĩa của ἄγγελος
  choice: thiên sứ
  alternative: sứ giả
  rationale: Trong ngữ cảnh trực tiếp, nhân vật là Gáp-ri-ên hiện ra và truyền lời; “thiên sứ” xác định đúng nghĩa theo văn cảnh mà không thêm diễn giải giáo lý.
translation_notes:
  register: Văn phong trần thuật trang trọng nhưng hiện đại, dễ hiểu. Câu hỏi “Dựa vào đâu tôi sẽ biết” giữ được sắc thái Xa-cha-ri đòi hỏi căn cứ hoặc dấu hiệu xác nhận. Thành ngữ về tuổi của người vợ được chuyển thành “tuổi đã cao” vì bản dịch sát chữ “đã tiến xa trong những ngày của bà ấy” không tự nhiên trong tiếng Việt.
