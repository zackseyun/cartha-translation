  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: vi
  text: 'Và Xa-cha-ri, cha của đứa trẻ ấy, được đầy Đức Thánh Linh và nói tiên tri rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: Xa-cha-ri
  rationale: Dùng dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt, phiên âm từ tên Hy Lạp.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: cha của em
  rationale: Đại từ αὐτοῦ chỉ về đứa trẻ vừa được đặt tên là Giăng; “em” tự nhiên trong mạch kể tiếng Việt và tránh cách diễn đạt cứng “cha của nó”.
- source_word: ἐπλήσθη
  choice: được đầy dẫy
  rationale: Giữ sắc thái bị động và tính biến cố của động từ aorist πίμπλημι; “đầy dẫy” là cách nói trang trọng, dễ nhận biết trong ngữ cảnh được Đức Thánh Linh tác động.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Sau πίμπλημι, sở hữu cách diễn tả điều làm cho người ấy được đầy; trong văn mạch Lu-ca về sự soi dẫn từ Đức Chúa Trời, cụm từ chỉ Đức Thánh Linh.
- source_word: ἐπροφήτευσεν
  choice: nói tiên tri
  rationale: Diễn đạt trực tiếp hành động phát ngôn do sự soi dẫn, bằng thuật ngữ Kinh Thánh tự nhiên trong tiếng Việt hiện đại.
- source_word: λέγων
  choice: rằng
  rationale: Phân từ này dẫn vào nội dung lời tiên tri; “rằng” nối tự nhiên với phần phát biểu ở các câu tiếp theo.
- source_word: Καὶ
  choice: Và
  rationale: Giữ liên kết tường thuật liên tục của Καὶ ở đầu câu.
theological_decisions:
- issue: Đối tượng được nói đến bởi πνεύματος ἁγίου
  choice: Đức Thánh Linh
  alternative: một linh thánh / thần khí thánh
  rationale: Trong Lu-ca–Công Vụ, cụm này trong bối cảnh được ban năng lực để phát ngôn tiên tri thường chỉ Thánh Linh của Đức Chúa Trời. Bản dịch xác định đối tượng nhưng không thêm diễn giải tín lý ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Được đầy dẫy” duy trì sắc thái Kinh Thánh mà vẫn thông dụng; “em” quy chiếu tự nhiên về hài nhi Giăng trong văn mạch. Không có chú thích nên không dùng ký hiệu chú thích.
