revisions:
- from: Nhưng khi đi ra, ông không thể nói với họ, nên họ nhận ra rằng ông đã thấy một khải tượng trong nơi thánh[a]. Ông cứ ra hiệu cho họ và vẫn bị câm[b].
  to: Nhưng khi ông đi ra, ông không thể nói với họ, và họ nhận ra rằng ông đã thấy một khải tượng trong thánh điện[a]. Ông cứ ra hiệu cho họ và vẫn không nói được[b].
  rationale: Sửa liên từ để không thêm quan hệ nhân quả không được đánh dấu trong nguyên văn; dùng “thánh điện” để phản ánh chính xác ναός; và thay “bị câm” bằng cách diễn đạt trung tính, trực tiếp theo ngữ cảnh là “vẫn không nói được”. Các điểm còn lại, gồm “khải tượng” và “cứ ra hiệu”, được giữ vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
