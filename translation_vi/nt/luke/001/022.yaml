language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: vi
  text: Nhưng khi ông đi ra, ông không thể nói với họ, và họ nhận ra rằng ông đã thấy một khải tượng trong thánh điện[a]. Ông cứ ra hiệu cho họ và vẫn không nói được[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong đền thờ”; từ Hy Lạp ở đây chỉ cụ thể hơn thánh điện, chứ không phải toàn bộ khuôn viên đền thờ.
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có thể chỉ người không nói được, và trong một số ngữ cảnh cũng có thể hàm ý “điếc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: khi đi ra
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch theo thời gian này tự nhiên và giữ đúng trình tự câu chuyện.
- source_word: οὐκ ἐδύνατο λαλῆσαι
  choice: ông không thể nói
  rationale: Giữ rõ ý không có khả năng nói trong cấu trúc δύναμαι đi với động từ nguyên mẫu.
- source_word: ἐπέγνωσαν
  choice: họ nhận ra
  rationale: Diễn tả việc đám đông đi đến nhận biết từ tình trạng và cử chỉ của Xa-cha-ri.
- source_word: ὀπτασίαν
  choice: một khải tượng
  rationale: Trong ngữ cảnh này, từ chỉ một cảnh hiện thấy mang tính siêu nhiên hoặc mặc khải; “khải tượng” vừa chính xác vừa quen thuộc trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν τῷ ναῷ
  choice: trong nơi thánh
  rationale: ναός ở đây chỉ phần thánh điện bên trong, không phải toàn bộ khuôn viên đền thờ; “nơi thánh” giữ được sự phân biệt ấy mà vẫn dễ hiểu.
- source_word: διανεύων
  choice: cứ ra hiệu
  rationale: Cấu trúc ἦν với phân từ hiện tại diễn tả hành động kéo dài; “cứ ra hiệu” thể hiện tính liên tục một cách tự nhiên.
- source_word: διέμενεν
  choice: vẫn
  rationale: Động từ ở thì chưa hoàn thành diễn tả trạng thái tiếp diễn; “vẫn” truyền đạt ngắn gọn ý ông tiếp tục ở trong tình trạng đó.
- source_word: κωφός
  choice: bị câm
  rationale: Ngữ cảnh trực tiếp nhấn mạnh việc không thể nói. Tuy nhiên, vì từ Hy Lạp cũng có thể chỉ tình trạng điếc, phương án khác được giữ trong chú thích.
theological_decisions:
- issue: Ý nghĩa của κωφός trong hình phạt dành cho Xa-cha-ri
  choice: Dịch trong chính văn là “bị câm”, nhấn mạnh tình trạng không nói được.
  alternative: Có thể hiểu là “bị điếc” hoặc tình trạng gồm cả điếc lẫn câm.
  rationale: Mệnh đề ngay trước nói rõ ông không thể nói, nhưng trường nghĩa của κωφός và diễn tiến rộng hơn của câu chuyện không cho phép loại bỏ hoàn toàn khả năng liên quan đến thính giác. Chú thích bảo tồn sự mơ hồ này thay vì quyết đoán quá mức.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Nơi thánh” duy trì sự phân biệt từ vựng giữa thánh điện bên trong và toàn bộ khuôn viên đền thờ; “cứ ra hiệu” thể hiện hành động kéo dài. Các dấu chú thích [a], [b] được đặt ngay sau những từ ngữ mà chú thích giải thích.
