id: LUK.1.46
reference: Luke 1:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: vi
  text: 'Ma-ri nói: “Linh hồn tôi tôn cao Chúa[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tuyên xưng sự cao cả của Chúa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: lược dịch
  rationale: Trong tiếng Hy Lạp, Καὶ nối lời ca với mạch kể trước đó. Tiếng Việt tự nhiên không cần mở câu dẫn bằng “Và”; quan hệ tiếp nối vẫn rõ trong văn cảnh.
- source_word: εἶπεν
  choice: nói
  rationale: Động từ aorist của λέγω được dịch tự nhiên bằng động từ kể chuyện thông dụng “nói”.
- source_word: Μαριάμ
  choice: Ma-ri
  rationale: Dùng dạng tên riêng Kinh Thánh quen thuộc, dễ đọc trong tiếng Việt hiện đại.
- source_word: Μεγαλύνει
  choice: tôn cao
  rationale: 'Giữ sắc thái thi ca của động từ μεγαλύνω: nhìn nhận, tuyên xưng và ca ngợi là cao cả, chứ không hàm ý con người làm cho Đức Chúa Trời trở nên lớn hơn.'
- source_word: ἡ ψυχή μου
  choice: Linh hồn tôi
  rationale: Bảo tồn cách nói nhân học mang tính thi ca của nguyên văn, thay vì giản lược thành “tôi” hoặc diễn giải thành “tâm hồn tôi”.
- source_word: τὸν κύριον
  choice: Chúa
  rationale: κύριος ở đây là tước hiệu tôn kính chỉ Đức Chúa Trời trong ngôn ngữ ngợi ca; “Chúa” là cách dịch tự nhiên và có trọng lượng thần học trong tiếng Việt.
theological_decisions:
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: Trong văn cảnh thánh ca hướng về Đức Chúa Trời, “Chúa” phù hợp hơn “Chủ”, vốn dễ bị hiểu hẹp theo quan hệ xã hội.
- issue: Cách hiểu ἡ ψυχή μου
  choice: Linh hồn tôi
  alternative: Tôi; tâm hồn tôi
  rationale: Giữ nguyên cách diễn đạt thi ca và độ mở nhân học của ψυχή, không biến nó thành một đại từ đơn thuần hoặc giới hạn vào cảm xúc nội tâm.
- issue: Ẩn dụ của μεγαλύνει
  choice: tôn cao
  alternative: tuyên xưng sự cao cả của; ngợi khen
  rationale: “Tôn cao” giữ được tính cô đọng và sắc thái thi ca, đồng thời chú thích nêu rõ cách hiểu tuyên xưng sự cao cả để tránh cách hiểu vật lý về việc làm cho lớn lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và giàu tính thi ca. Dấu phẩy cuối câu được giữ vì đây là phần mở đầu của lời ca tiếp tục ở câu sau.
