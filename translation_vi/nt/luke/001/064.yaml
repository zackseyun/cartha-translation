  rationale: 'Sửa nhẹ để câu tiếng Việt mạch lạc hơn: lặp lại «được mở ra» cho «lưỡi ông» nhằm giải phép tỉnh lược của nguyên văn. Giữ «bắt đầu nói» như một cách hiểu hợp ngữ cảnh của thể chưa hoàn thành, kèm chú thích bảo lưu cách hiểu tiếp diễn.'
