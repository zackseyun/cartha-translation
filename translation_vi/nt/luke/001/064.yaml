source:
  edition: SBLGNT
  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: vi
  text: Miệng ông lập tức mở ra, lưỡi ông cũng được mở ra,[a] và ông bắt đầu nói,[b] chúc tụng Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “và lưỡi ông”; một số bản dịch diễn đạt là “lưỡi ông được tháo buộc”, nhưng cụm “được tháo buộc” không có trong bản Hy Lạp ở đây.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ông cứ nói” hoặc “ông đang nói”. Động từ ở thể chưa hoàn thành có thể nhấn mạnh lời nói tiếp diễn thay vì sự bắt đầu nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: được mở ra
  rationale: Dạng aorist bị động của ἀνοίγω; cách dịch bị động phản ánh hình thức Hy Lạp và không xác định thêm tác nhân.
- source_word: δὲ
  choice: và
  rationale: Ở đây δέ là liên từ nhẹ tiếp nối diễn biến, không nhất thiết biểu thị tương phản.
- source_word: στόμα
  choice: miệng
  rationale: Tương đương trực tiếp, tự nhiên trong ngữ cảnh khả năng nói được phục hồi.
- source_word: παραχρῆμα
  choice: ngay lập tức
  rationale: Diễn đạt rõ tính tức thời và sự nối tiếp trực tiếp của sự việc.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: lưỡi ông cũng vậy
  rationale: Giữ việc bản Hy Lạp nhắc riêng cả miệng lẫn lưỡi, đồng thời không thêm ý 'được tháo buộc' vốn không có trong câu này.
- source_word: ἐλάλει
  choice: ông bắt đầu nói
  rationale: Thể chưa hoàn thành có thể chỉ hành động đang tiếp diễn hoặc sự khởi đầu của hành động; sau thời gian bị câm, cách diễn đạt này phù hợp với mạch thuật chuyện, nhưng phương án tiếp diễn được ghi ở chú thích.
- source_word: εὐλογῶν
  choice: chúc tụng
  rationale: Phân từ hiện tại mô tả điều ông làm khi nói; 'chúc tụng' gần nghĩa trực tiếp hơn 'ca ngợi' và phù hợp văn phong trang trọng, dễ hiểu.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Tân ngữ trực tiếp của εὐλογῶν; dùng danh xưng phổ biến trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cụm “lưỡi ông cũng vậy” giữ phép tỉnh lược của nguyên văn mà không thêm hình ảnh “tháo buộc”. Dấu phẩy trước phân từ “chúc tụng” giúp thể hiện đây là hành động đi kèm với việc nói.
