  terminology: «Chúc tụng Đức Chúa Trời» là cách diễn đạt trang trọng, phù hợp với εὐλογῶν τὸν θεόν và với đăng ký Kinh Thánh tiếng Việt. Không có vấn đề về tên riêng hay thuật ngữ thần học.
