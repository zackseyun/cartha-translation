id: LUK.1.5
reference: Luke 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: vi
  text: Vào thời Hê-rốt, vua xứ Giu-đê, có một thầy tế lễ tên là Xa-cha-ri, thuộc ban tế lễ A-bi-gia[a]; ông có một người vợ thuộc dòng dõi A-rôn[b], tên bà là Ê-li-sa-bét.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ban tế lễ A-bi-gia” là một trong các nhóm thầy tế lễ luân phiên phục vụ tại đền thờ.
    reason: cultural_note
  - marker: b
    text: Nguyên văn nói sát nghĩa là “từ các con gái của A-rôn,” một cách nói chỉ người thuộc dòng dõi tư tế của A-rôn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: Vào thời
  rationale: Cụm này mở đầu một trình thuật và xác định bối cảnh thời gian. “Vào thời” tự nhiên trong tiếng Việt hiện đại, đồng thời truyền đạt đúng ý “trong những ngày của” mà không dịch quá sát thành một lối nói gượng.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Hê-rốt, vua xứ Giu-đê
  rationale: Cách dịch này giữ rõ tên người, tước vị và lãnh thổ cai trị. “Giu-đê” phù hợp với bối cảnh địa lý-lịch sử của Ἰουδαία.
- source_word: ἱερεύς τις
  choice: một thầy tế lễ
  rationale: τις giới thiệu một nhân vật chưa xác định; từ “một” diễn đạt tự nhiên sắc thái ấy. “Thầy tế lễ” là cách gọi rõ nghĩa và quen thuộc đối với chức vụ tư tế Do Thái.
- source_word: ὀνόματι Ζαχαρίας
  choice: tên là Xa-cha-ri
  rationale: ὀνόματι là công thức nêu tên; “tên là” ngắn gọn, tự nhiên và chính xác.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: thuộc ban tế lễ A-bi-gia
  rationale: ἐφημερία chỉ một ban hay phiên phục vụ của các thầy tế lễ. Thêm “tế lễ” giúp độc giả hiện đại hiểu ngay bản chất của ban này mà không làm thay đổi ý nguồn.
- source_word: γυνὴ αὐτῷ
  choice: ông có một người vợ
  rationale: Đại từ ở cách tặng αὐτῷ mang nghĩa sở hữu trong cấu trúc này. “Ông có một người vợ” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: thuộc dòng dõi A-rôn
  rationale: Nguyên văn dùng thành ngữ “từ các con gái của A-rôn” để nói về nguồn gốc gia tộc. “Thuộc dòng dõi A-rôn” truyền đạt rõ ý phả hệ trong tiếng Việt; hình ảnh nguyên văn được ghi ở chú thích.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: tên bà là Ê-li-sa-bét
  rationale: Đây là công thức nêu tên thông thường. Đại từ “bà” phù hợp với nhân vật nữ trưởng thành và giữ văn phong trang trọng, tự nhiên.
- source_word: Ἡρῴδης / Ζαχαρίας / Ἀβιά / Ἀαρών / Ἐλισάβετ
  choice: Hê-rốt / Xa-cha-ri / A-bi-gia / A-rôn / Ê-li-sa-bét
  rationale: Dùng các dạng phiên âm Kinh Thánh tiếng Việt dễ nhận biết, nhất quán và thuận đọc.
theological_decisions:
- issue: Cách diễn đạt nguồn gốc gia tộc của Ê-li-sa-bét
  choice: thuộc dòng dõi A-rôn
  alternative: thuộc hàng các con gái A-rôn
  rationale: Cụm Hy Lạp theo nghĩa đen là “từ các con gái của A-rôn,” nhưng trong ngữ cảnh chỉ sự xuất thân từ dòng tư tế. Bản dịch chính diễn đạt ý phả hệ một cách tự nhiên, còn chú thích bảo lưu hình thức cụ thể của nguyên văn, không thêm một kết luận giáo lý nào.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu dịch giữ cấu trúc một câu của nguyên văn bằng dấu chấm phẩy, đồng thời tránh lối dịch sát chữ gây gượng. Các chú thích được đặt ngay sau cụm từ mà chúng giải thích; thứ tự này sửa sự lệch vị trí giữa hai chú thích trong lớp tham khảo tiếng Anh.
