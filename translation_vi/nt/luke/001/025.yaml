  - severity: low
    issue: “đoái nhìn đến tôi” hơi nặng và kém gọn.
    rationale: ἐπεῖδεν diễn tả sự đoái đến/lưu tâm. “Đoái đến tôi” bảo toàn sắc thái này trong tiếng Việt hiện đại, không thêm hình ảnh hay ý nghĩa.
