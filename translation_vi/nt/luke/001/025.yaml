  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: vi
  text: “Vì Chúa đã làm như thế cho tôi trong những ngày Ngài đoái đến tôi, để cất nỗi nhục[a] của tôi giữa người đời.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự hổ thẹn” hoặc “sự ô nhục.” Từ Hy Lạp nhấn mạnh sự chê trách hay mất danh dự trước cộng đồng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Diễn tả sắc thái giải thích hoặc nêu lý do trong lời Ê-li-sa-bét, phù hợp tự nhiên với ngữ cảnh câu trước.
- source_word: Οὕτως
  choice: như thế
  rationale: Giữ sắc thái chỉ cách thức được nhấn mạnh của trạng từ Hy Lạp.
- source_word: μοι ... πεποίηκεν
  choice: đã đối đãi với tôi
  rationale: Diễn đạt tự nhiên thành ngữ ποιέω đi với tặng cách, đồng thời vẫn giữ ý về hành động riêng của Chúa đối với Ê-li-sa-bét.
- source_word: κύριος
  choice: Chúa
  rationale: Danh hiệu chỉ Đức Chúa Trời trong ngữ cảnh; cách dịch quen thuộc, trang trọng và không thu hẹp ý nghĩa theo một cách giải thích hệ phái.
- source_word: ἐν ἡμέραις αἷς
  choice: trong những ngày
  rationale: Bám sát cấu trúc thời gian của nguyên văn và duy trì sắc thái văn chương trang trọng.
- source_word: ἐπεῖδεν
  choice: Ngài đoái nhìn đến tôi
  rationale: Giữ hình ảnh nhìn đến với sự lưu tâm và ân huệ; bổ sung đối tượng “tôi” theo ngữ cảnh và quan hệ cú pháp.
- source_word: ἀφελεῖν
  choice: để cất đi
  rationale: Giữ khả năng mục đích hoặc kết quả của động từ nguyên mẫu mà không giải quyết quá mức sự linh hoạt cú pháp.
- source_word: ὄνειδός μου
  choice: nỗi nhục của tôi
  rationale: “Nỗi nhục” diễn tả tình trạng bị chê trách và mất danh dự trong xã hội rõ hơn cách nói thiên về cảm xúc nội tâm.
- source_word: ἐν ἀνθρώποις
  choice: giữa người đời
  rationale: Chỉ phạm vi xã hội nơi sự ô nhục được cảm nhận; “người đời” mang nghĩa chung, không giới hạn giới tính.
theological_decisions:
- issue: Đối tượng được κύριος chỉ đến
  choice: “Chúa” chỉ Đức Chúa Trời, Đấng đã hành động cho Ê-li-sa-bét.
  alternative: Không có cách hiểu đáng kể khác trong ngữ cảnh trực tiếp.
  rationale: Ngữ cảnh nói về việc Đức Chúa Trời cất đi sự son sẻ và nỗi nhục xã hội của Ê-li-sa-bét; bản dịch giữ nguyên danh hiệu mà không áp đặt một cách đọc Kitô học hẹp vào câu này.
- issue: Ý nghĩa xã hội của ὄνειδος
  choice: Dịch là “nỗi nhục,” nhấn mạnh sự mất danh dự trước cộng đồng.
  alternative: “sự hổ thẹn” hoặc “điều ô nhục.”
  rationale: Nguyên văn chủ yếu nói đến sự chê trách và mất danh dự trong mắt người khác do tình trạng son sẻ, chứ không chỉ một cảm xúc xấu hổ bên trong.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đoái nhìn đến” giữ sắc thái Kinh Thánh quen thuộc nhưng vẫn rõ nghĩa; “giữa người đời” diễn đạt tự nhiên phạm vi xã hội của nỗi nhục.
