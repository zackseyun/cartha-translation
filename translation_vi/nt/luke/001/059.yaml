source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: vi
  text: Vào ngày thứ tám, người ta đến để cắt bì cho đứa trẻ, và họ định gọi em là Xa-cha-ri[a], theo tên cha em[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ đang gọi em là Xa-cha-ri.” Động từ Hy Lạp ở thì chưa hoàn thành có thể gợi một hành động đang diễn ra hoặc một ý định đặt tên chưa hoàn tất, phù hợp với lời sửa lại ở câu tiếp theo.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “theo tên cha em, Xa-cha-ri”, nói đến tập quán đặt tên đứa trẻ theo tên một người trong gia đình.'
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Đến
  rationale: Trong mạch kể chuyện, công thức dẫn nhập của Lu-ca cùng cụm thời gian được diễn đạt tự nhiên là “Đến ngày thứ tám”, vẫn đánh dấu sự chuyển sang sự việc kế tiếp mà không dùng lối cổ “và xảy ra rằng”.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: ngày thứ tám
  rationale: Diễn đạt thời điểm cụ thể bằng tiếng Việt tự nhiên; giới từ đã được hàm trong cấu trúc “Đến ngày”.
- source_word: ἦλθον
  choice: người ta đến
  rationale: Động từ Hy Lạp có chủ ngữ số nhiều không nêu rõ. “Người ta” giữ tính không xác định và tự nhiên hơn đại từ “họ” khi chưa có tiền ngữ trực tiếp.
- source_word: περιτεμεῖν
  choice: để làm phép cắt bì
  rationale: Giữ rõ ý mục đích của động từ nguyên mẫu và dùng cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: τὸ παιδίον
  choice: đứa trẻ
  rationale: Tương ứng trực tiếp với παιδίον, dễ hiểu và không thu hẹp nghĩa hơn mức văn bản dù ngữ cảnh là một em bé sơ sinh.
- source_word: ἐκάλουν
  choice: họ định gọi
  rationale: Thì chưa hoàn thành trong ngữ cảnh có thể chỉ hành động đang được tiến hành hoặc dự định đặt tên nhưng bị người mẹ sửa lại ở câu sau. “Định gọi” diễn đạt tự nhiên tính chưa hoàn tất, đồng thời chú thích bảo lưu cách hiểu sát hình thái hơn.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: theo tên của cha em
  rationale: Diễn đạt thành ngữ đặt tên một người theo tên người khác, đồng thời giữ rõ quan hệ gia đình.
- source_word: Ζαχαρίαν
  choice: Xa-cha-ri
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt, có gạch nối để dễ đọc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu tiếng Việt tránh sao chép máy móc công thức kể chuyện Hy Lạp, nhưng giữ chủ thể không xác định, thời điểm ngày thứ tám và sắc thái hành động đặt tên chưa hoàn tất. Mọi ký hiệu chú thích đều có mặt trong chính văn.
