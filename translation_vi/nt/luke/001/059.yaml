- from: Đến ngày thứ tám, người ta đến để làm phép cắt bì cho đứa trẻ, và họ định gọi em là Xa-cha-ri[a], theo tên của cha em[b].
  to: Vào ngày thứ tám, người ta đến để cắt bì cho đứa trẻ, và họ định gọi em là Xa-cha-ri[a], theo tên cha em[b].
  rationale: Sửa “làm phép cắt bì” thành “cắt bì” để tránh thêm sắc thái không được diễn đạt trực tiếp trong nguyên ngữ; điều chỉnh trạng ngữ và chú thích để câu tự nhiên hơn, đồng thời bảo lưu sắc thái chưa hoàn tất/đang diễn tiến của ἐκάλουν.
