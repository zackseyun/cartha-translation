    rationale: Nguyên ngữ περιτεμεῖν có nghĩa trực tiếp là “cắt bì”; nghi thức được hàm ý bởi bối cảnh nhưng không cần đưa thành một thành tố từ vựng trong bản dịch.
  - severity: low
    issue: Cách nêu phương án trong chú thích a chưa thật nhất quán với bản dịch chính
    rationale: Bản chính dùng “định gọi”, còn chú thích nêu “họ đang gọi”. Cần nói rõ đây là phương án khác và thì chưa hoàn thành có thể biểu thị hành động đang tiến hành hoặc ý định chưa hoàn tất.
  revised_text: Vào ngày thứ tám, người ta đến để cắt bì cho đứa trẻ, và họ định gọi em là Xa-cha-ri[a], theo tên cha em[b].
