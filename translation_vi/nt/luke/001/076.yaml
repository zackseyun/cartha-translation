id: LUK.1.76
reference: Luke 1:76
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: vi
  text: Còn con, hỡi con trẻ, sẽ được gọi là nhà tiên tri của Đấng Tối Cao, vì con sẽ đi trước Chúa[a] để chuẩn bị các con đường của Ngài[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “ở trước mặt Chúa.” Cụm từ này có thể chỉ việc đi trước một người hoặc phụng sự trong sự hiện diện của người ấy.
    reason: lexical_alternative
  - marker: b
    text: Cách diễn đạt này gợi lại những lời tiên tri về việc chuẩn bị đường trước Chúa (xem Ê-sai 40:3; Ma-la-chi 3:1). Trong trình thuật Lu-ca, điều này được ứng nghiệm qua chức vụ của Giăng đi trước Chúa Giê-su.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Còn con
  rationale: Cách diễn đạt này chuyển trọng tâm sang người được nói trực tiếp và nhấn mạnh đối tượng, đồng thời tự nhiên hơn trong tiếng Việt so với việc dịch máy móc từng liên từ.
- source_word: παιδίον
  choice: hỡi con trẻ
  rationale: Đây là lời gọi trực tiếp dành cho Giăng khi còn là trẻ sơ sinh. “Con trẻ” giữ được ý nghĩa về tuổi nhỏ mà không thêm chi tiết ngoài nguyên văn; “hỡi” làm rõ sắc thái xưng hô trang trọng.
- source_word: προφήτης
  choice: nhà tiên tri
  rationale: Tương đương thông dụng và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: Ὑψίστου
  choice: của Đấng Tối Cao
  rationale: Giữ nguyên tước hiệu tôn kính dành cho Đức Chúa Trời và quan hệ sở thuộc của nguyên văn.
- source_word: κληθήσῃ
  choice: sẽ được gọi là
  rationale: Phản ánh thể tương lai bị động và ý nghĩa được gọi hay được nhìn nhận với tư cách là nhà tiên tri.
- source_word: προπορεύσῃ
  choice: sẽ đi trước
  rationale: Diễn đạt trực tiếp hành động đi trước để mở đường, phù hợp với vai trò người tiền phong trong ngữ cảnh.
- source_word: ἐνώπιον κυρίου
  choice: trước Chúa
  rationale: Giữ được khả năng hiểu là đi trước Chúa, đồng thời không loại bỏ sắc thái ở trước mặt hay trong sự hiện diện của Chúa; phương án khác được nêu trong chú thích.
- source_word: ἑτοιμάσαι
  choice: để chuẩn bị
  rationale: Động từ nguyên mẫu chỉ mục đích; cách dịch này vừa sát nghĩa vừa tự nhiên.
- source_word: ὁδοὺς αὐτοῦ
  choice: các con đường của Ngài
  rationale: Giữ dạng số nhiều của nguyên văn và âm hưởng của những lời tiên tri về việc chuẩn bị đường cho Chúa.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong lời tiên báo về người đi trước
  choice: Giữ tước hiệu “Chúa” mà không xác định hẹp đối tượng ngay trong câu dịch.
  alternative: Hiểu là Chúa, tức Đức Chúa Trời, theo nền Cựu Ước; hoặc là Chúa Giê-su theo sự ứng nghiệm trong trình thuật Lu-ca.
  rationale: Ngôn từ gợi lại các lời tiên tri Cựu Ước về việc dọn đường trước Chúa, trong khi trình thuật Lu-ca trình bày Giăng là người đi trước Chúa Giê-su. Giữ nguyên tước hiệu bảo tồn sự căng thẳng thần học này thay vì âm thầm giải quyết nó.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp với lời tiên tri được nói trực tiếp với một trẻ sơ sinh. Dùng “Ngài” để quy chiếu tôn kính về Chúa. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa; [b] được đặt sau hình ảnh mang âm hưởng liên văn bản.
