  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: vi
  text: Đáng chúc tụng thay là Chúa, Đức Chúa Trời của Israel, vì Ngài đã viếng thăm dân Ngài[a] và đem sự cứu chuộc đến cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã đến cứu giúp”; trong Kinh Thánh, “viếng thăm” là cách nói về việc Đức Chúa Trời đoái đến và hành động can thiệp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Đáng chúc tụng thay
  rationale: Diễn đạt tính từ vị ngữ trong lời chúc tụng bằng một công thức trang trọng, tự nhiên, đồng thời giữ sắc thái tôn vinh.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ danh hiệu thần linh quen thuộc và phù hợp với công thức chúc tụng Đức Chúa Trời của Israel.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: Đức Chúa Trời của Israel
  rationale: Bảo toàn danh xưng Kinh Thánh và quan hệ đồng vị với “Chúa”.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do của lời chúc tụng một cách rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐπεσκέψατο
  choice: đã viếng thăm
  rationale: Giữ hình ảnh Kinh Thánh về việc Đức Chúa Trời đoái đến và can thiệp cứu giúp, thay vì thu hẹp ý nghĩa thành một cách diễn giải duy nhất.
- source_word: ἐποίησεν λύτρωσιν
  choice: đem sự cứu chuộc đến
  rationale: Chuyển thành ngữ Hy Lạp theo lối diễn đạt tiếng Việt tự nhiên mà vẫn giữ hành động và kết quả cứu chuộc.
- source_word: λύτρωσιν
  choice: sự cứu chuộc
  rationale: Giữ sức nặng thần học và ý niệm giải thoát gắn với việc chuộc lại; “sự giải cứu” là khả dĩ nhưng ít bảo toàn liên hệ từ vựng này hơn.
- source_word: τῷ λαῷ αὐτοῦ
  choice: đến cho dân Ngài
  rationale: Thể hiện cách dative chỉ đối tượng thụ hưởng/đích đến của hành động và giữ cấu trúc phối hợp của hai động từ trong nguyên văn.
theological_decisions:
- issue: Ngôn ngữ về việc Đức Chúa Trời viếng thăm
  choice: đã viếng thăm
  alternative: đã đến cứu giúp
  rationale: Giữ nguyên ẩn dụ Kinh Thánh về sự hiện diện đầy quan tâm và hành động cứu độ của Đức Chúa Trời, không âm thầm giải nghĩa nó theo một hướng hẹp hơn.
translation_notes:
  register: Văn phong trang trọng nhưng dễ hiểu trong tiếng Việt hiện đại. “Đáng chúc tụng thay” giữ sắc thái phụng tụng; “viếng thăm” bảo toàn cách nói giàu âm hưởng Kinh Thánh và được giải thích ngắn gọn bằng chú thích.
