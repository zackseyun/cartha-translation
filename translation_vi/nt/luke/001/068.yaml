  to: Đáng chúc tụng thay là Chúa, Đức Chúa Trời của Israel, vì Ngài đã viếng thăm dân Ngài[a] và đem sự cứu chuộc đến cho họ.
  rationale: Bản sửa thêm “là” cho công thức chúc tụng tự nhiên, đồng thời đặt “dân Ngài” làm đối tượng rõ ràng của “viếng thăm.” Đại từ “họ” tiếp nối dân Ngài trong vế thứ hai, giữ ý dative là người hưởng lợi của sự cứu chuộc. Chú thích vẫn neo trực tiếp vào “viếng thăm” và bảo toàn chiều sâu thành ngữ của ἐπεσκέψατο.
