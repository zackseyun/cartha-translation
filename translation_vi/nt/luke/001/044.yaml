id: LUK.1.44
reference: Luke 1:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: vi
  text: Vì kìa, khi tiếng chào của em đến tai chị, đứa bé trong bụng chị đã nhảy lên vì vui mừng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: này
  rationale: Dùng tiểu từ gây chú ý tự nhiên trong tiếng Việt, giữ sắc thái sống động mà không cổ kính quá mức.
- source_word: γὰρ
  choice: vì
  rationale: Giữ quan hệ giải thích với lời ngay trước đó.
- source_word: ὡς ἐγένετο
  choice: vừa khi ... đến
  rationale: Diễn đạt thời điểm và tính tức thì hàm chứa trong ngữ cảnh bằng tiếng Việt tự nhiên.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: tiếng chào của em
  rationale: φωνή ở đây chỉ âm thanh nghe được của lời chào; ἀσπασμός được chuyển là 'lời chào/tiếng chào'. Đại từ thân tộc 'em' phù hợp quan hệ giao tiếp tự nhiên giữa Ma-ri và Ê-li-sa-bét trong câu nói trực tiếp.
- source_word: εἰς τὰ ὦτά μου
  choice: đến tai chị
  rationale: Giữ hướng chuyển động của εἰς và hình ảnh thính giác, đồng thời tránh cách nói cứng 'vào tai chị'.
- source_word: ἐσκίρτησεν
  choice: đã nhảy lên
  rationale: Diễn tả chuyển động đột ngột, rõ ràng của thai nhi.
- source_word: ἐν ἀγαλλιάσει
  choice: vui mừng
  rationale: Diễn đạt sắc thái hân hoan của ἀγαλλίασις theo lối tự nhiên; cấu trúc có thể được hiểu là trạng thái/cách thức nhảy lên.
- source_word: τὸ βρέφος
  choice: thai nhi
  rationale: Trong ngữ cảnh đứa trẻ còn ở trong bụng mẹ, 'thai nhi' là từ hiện đại, chính xác và không thêm khẳng định ngoài văn bản.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: trong bụng chị
  rationale: κοιλία trong ngữ cảnh chỉ nơi thai nhi đang ở; 'trong bụng' là cách nói tự nhiên trong lời thoại tiếng Việt.
theological_decisions:
- issue: Cách gọi βρέφος khi nói về Giăng chưa sinh
  choice: thai nhi
  alternative: em bé
  rationale: ‘Thai nhi’ chuyển đúng quy chiếu trong ngữ cảnh và giữ cách văn bản gọi một đứa trẻ còn trong bụng mẹ, không suy diễn thêm lập trường giáo lý.
- issue: Quan hệ cú pháp của ἐν ἀγαλλιάσει
  choice: đã nhảy lên vui mừng
  alternative: đã nhảy lên trong niềm hân hoan
  rationale: Bản dịch giữ ý vui mừng/hân hoan gắn với hành động nhảy lên mà không xác định quá mức đó là nguyên nhân hay cách thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp xưng hô chị–em trong lời Ê-li-sa-bét nói với Ma-ri để tiếng Việt tự nhiên; bản Hy Lạp chỉ đánh dấu ngôi thứ hai và ngôi thứ nhất, không mã hóa quan hệ thân tộc trong đại từ.
