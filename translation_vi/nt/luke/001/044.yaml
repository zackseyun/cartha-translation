  to: Vì kìa, khi tiếng chào của em đến tai chị, đứa bé trong bụng chị đã nhảy lên vì vui mừng.
  rationale: Chỉnh thành ngữ mở đầu để tự nhiên trong tiếng Việt mà vẫn giữ lực chú ý–giải thích của ἰδοὺ γάρ; bỏ sắc thái tức thì không cần thiết; và thay thuật ngữ lâm sàng “thai nhi” bằng “đứa bé” để phản ánh βρέφος trong ngữ cảnh lời thoại. “Vì vui mừng” diễn đạt tự nhiên ἐν ἀγαλλιάσει mà không xác định quá mức quan hệ cú pháp.
