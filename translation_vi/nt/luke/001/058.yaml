revisions:
- from: Những người láng giềng và họ hàng của bà nghe biết Chúa đã tỏ lòng thương xót lớn lao đối với bà, nên họ cùng vui với bà.
  to: Những người láng giềng và họ hàng của bà nghe rằng Chúa đã tỏ lòng thương xót lớn lao đối với bà, và họ cùng vui với bà.
  rationale: Chỉnh sửa tối thiểu để câu tiếng Việt tự nhiên hơn và giữ sát cấu trúc liên kết của nguyên văn. Cách dịch “đã tỏ lòng thương xót lớn lao đối với bà” diễn đạt thành ngữ ἐμεγάλυνεν ... τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς một cách rõ ràng mà vẫn giữ nét nhấn về sự lớn lao của lòng thương xót.
