  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: vi
  text: Những người láng giềng và họ hàng của bà nghe rằng Chúa đã tỏ lòng thương xót lớn lao đối với bà, và họ cùng vui với bà.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίοικοι
  choice: những người láng giềng
  rationale: Chỉ những người sống quanh Ê-li-sa-bét; cách dịch này tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: συγγενεῖς
  choice: họ hàng
  rationale: Diễn đạt tự nhiên những người có quan hệ huyết thống, không thu hẹp vào gia đình gần.
- source_word: ἐμεγάλυνεν
  choice: đã tỏ ... lớn lao
  rationale: Trong kết cấu với ἔλεος, động từ mang nghĩa làm cho lòng thương xót được biểu lộ cách lớn lao; cách dịch này giữ sắc thái cường độ mà không tạo câu tiếng Việt gượng ép như 'làm lớn lòng thương xót'.
- source_word: κύριος
  choice: Chúa
  rationale: Danh xưng xác định chỉ Đức Chúa Trời trong ngữ cảnh; viết hoa theo quy ước tiếng Việt.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Giữ ý nghĩa về sự thương xót và nhân từ của Đức Chúa Trời, đồng thời phù hợp mạch văn Lu-ca 1.
- source_word: μετ’ αὐτῆς
  choice: đối với bà
  rationale: Dù nghĩa cơ bản là 'với bà', trong thành ngữ này cụm từ chỉ người nhận lòng thương xót; 'đối với bà' là tiếng Việt tự nhiên và chính xác.
- source_word: συνέχαιρον αὐτῇ
  choice: họ cùng vui với bà
  rationale: Truyền đạt trực tiếp ý cùng chung vui với một người; không thu hẹp nghĩa thành chúc mừng.
theological_decisions:
- issue: Cách diễn đạt ἐμεγάλυνεν ... τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: Chúa đã tỏ lòng thương xót lớn lao đối với bà
  alternative: Chúa đã làm cho lòng thương xót của Ngài nên lớn lao với bà
  rationale: Lựa chọn chính diễn đạt đúng chức năng thành ngữ trong tiếng Việt và vẫn giữ sức nhấn của μεγαλύνω qua 'lớn lao'. Cách thay thế bám hình thức Hy Lạp hơn nhưng gượng và có thể khiến người đọc hiểu sai rằng lòng thương xót vốn chưa lớn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng 'bà' để quy chiếu Ê-li-sa-bét một cách tự nhiên, tôn trọng; câu được nối bằng 'nên' để biểu thị phản ứng phát sinh sau khi nghe tin mà không làm thay đổi nội dung.
source_grounding:
  english_pob_role: consult_only
