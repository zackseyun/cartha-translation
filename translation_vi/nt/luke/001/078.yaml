  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: vi
  text: do lòng thương xót sâu xa của Đức Chúa Trời chúng ta mà ánh bình minh[a] từ trên cao sẽ viếng thăm chúng ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “rạng đông”; từ Hy Lạp này cũng có thể gợi đến hình ảnh hoặc tước hiệu “Chồi” dành cho Đấng Mê-si-a trong Cựu Ước Hy Lạp.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: vì
  rationale: Với đối cách σπλάγχνα, διά nêu nguyên nhân hoặc nền tảng; “vì” diễn đạt tự nhiên quan hệ nguyên nhân trong tiếng Việt.
- source_word: σπλάγχνα ἐλέους
  choice: lòng thương xót sâu xa
  rationale: Cụm từ có nghĩa đen liên quan đến nội tạng, nhưng là thành ngữ chỉ lòng trắc ẩn phát xuất từ nơi sâu thẳm bên trong; cách dịch này giữ được chiều sâu cảm xúc mà không dịch thô cứng.
- source_word: θεοῦ ἡμῶν
  choice: của Đức Chúa Trời chúng ta
  rationale: Diễn đạt trực tiếp kết cấu sở hữu của nguyên văn bằng trật tự tự nhiên trong tiếng Việt.
- source_word: ἐν οἷς
  choice: nhờ lòng thương xót ấy
  rationale: Cụm đại từ quan hệ quay lại ý thương xót của Đức Chúa Trời và có thể chỉ phương tiện hoặc phạm vi. Việc lặp lại danh từ giúp câu tiếng Việt rõ ràng hơn mà vẫn giữ quan hệ ấy.
- source_word: ἐπισκέψεται
  choice: sẽ viếng thăm
  rationale: Giữ thì tương lai và nghĩa cơ bản “viếng thăm”; ngữ cảnh cho thấy đây là cuộc viếng thăm đầy ân huệ và cứu giúp mà không cần đưa phần diễn giải đó vào chính văn.
- source_word: ἀνατολὴ
  choice: ánh bình minh
  rationale: Trong ngữ cảnh ánh sáng ở câu kế tiếp, nghĩa bình minh hay sự mọc lên là nổi bật. “Ánh bình minh” tự nhiên, dễ hiểu và giữ hình ảnh ánh sáng.
- source_word: ἐξ ὕψους
  choice: từ nơi cao
  rationale: Bám sát cách diễn đạt của nguyên văn về cõi cao mà không giải thích trực tiếp thành “từ trời”.
theological_decisions:
- issue: Ý nghĩa của ἀνατολή trong ngữ cảnh Đấng Mê-si-a
  choice: Dịch là “ánh bình minh” trong chính văn
  alternative: “rạng đông” hoặc tước hiệu “Chồi Non”
  rationale: Mạch văn câu 78–79 nhấn mạnh ánh sáng chiếu vào bóng tối, nên hình ảnh bình minh là nghĩa nổi bật. Tuy vậy, từ này trong Cựu Ước Hy Lạp cũng có thể gợi đến tước hiệu Đấng Mê-si-a “Chồi Non”; ghi chú bảo tồn âm vang ấy mà không biến một khả năng liên văn bản thành nghĩa duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo lối gọi quen thuộc trong văn bản Kinh Thánh tiếng Việt; dấu chấm phẩy làm rõ quan hệ giữa nguyên nhân là lòng thương xót và hành động viếng thăm.
