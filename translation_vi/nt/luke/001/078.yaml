  source_fidelity: Bản dịch truyền đạt đúng quan hệ nguyên nhân của διὰ, chiều sâu thành ngữ của σπλάγχνα ἐλέους, thì tương lai của ἐπισκέψεται, và hình ảnh ánh sáng của ἀνατολή. Tuy nhiên, dấu chấm phẩy tách câu nguyên nhân với hệ quả mạnh hơn cấu trúc nguyên văn, và việc lặp lại “nhờ lòng thương xót ấy” kém sát với đại từ quan hệ ἐν οἷς hơn “nhờ đó”. “Từ trên cao” cũng là cách diễn đạt tự nhiên và gần nghĩa hơn cho ἐξ ὕψους.
  naturalness: “Ánh bình minh từ trên cao sẽ viếng thăm chúng ta” giữ được phép ẩn dụ nhân hóa của câu và tự nhiên trong văn phong Kinh Thánh hiện đại. Cấu trúc “Do ... mà ...” nối hai vế mạch lạc hơn trong tiếng Việt.
  terminology: “Đức Chúa Trời,” “lòng thương xót sâu xa,” và “ánh bình minh” phù hợp văn phong trang trọng. Ghi chú nên dùng “Chồi” thay vì “Chồi Non” như một cách gọi trung tính hơn cho âm vang từ ngữ ἀνατολή trong Bản Bảy Mươi, không khẳng định đó là nghĩa chính của câu.
