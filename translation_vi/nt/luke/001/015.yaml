id: LUK.1.15
reference: Luke 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: vi
  text: Vì người sẽ cao trọng trước mặt Chúa; người tuyệt nhiên không uống rượu nho hay đồ uống gây say[a], và sẽ được đầy dẫy Đức Thánh Linh ngay từ lòng mẹ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đồ uống gây say” ở đây chỉ loại đồ uống gây say khác với rượu nho.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “ngay khi còn trong lòng mẹ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: cao trọng
  rationale: Diễn đạt địa vị và tầm vóc đáng kể của Giăng trước mặt Chúa, tự nhiên hơn cách dịch thuần kích thước như “lớn”.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: trước mặt Chúa
  rationale: Giữ sát ý ở trước sự hiện diện và sự nhìn nhận của Chúa; κύριος trong ngữ cảnh chỉ về Đức Chúa Trời.
- source_word: οἶνον καὶ σίκερα
  choice: rượu nho hay thức uống có men
  rationale: Phân biệt οἶνος là rượu làm từ nho với σίκερα là đồ uống gây say thuộc loại khác, đồng thời dùng cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: οὐ μὴ πίῃ
  choice: tuyệt nhiên không uống
  rationale: Bảo toàn cấu trúc tương lai cùng sức phủ định mạnh của οὐ μή, không quyết đoán chuyển thành một mệnh lệnh.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: sẽ được đầy dẫy Đức Thánh Linh
  rationale: Giữ thể bị động, hàm ý hành động đến từ Đức Chúa Trời; “Đức Thánh Linh” là cách gọi trang trọng và quen thuộc.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: ngay từ trong lòng mẹ
  rationale: Giữ cả sắc thái nhấn mạnh của ἔτι và điểm khởi đầu được biểu thị bởi ἐκ, nhưng không loại trừ khả năng hiểu là khi còn trong lòng mẹ.
theological_decisions:
- issue: Sức nghĩa của οὐ μὴ πίῃ trong lời tiên báo
  choice: “tuyệt nhiên không uống,” một lời tiên báo với phủ định mạnh
  alternative: “không được bao giờ uống,” hiểu như quy định hay mệnh lệnh
  rationale: Hình thức Hy Lạp trực tiếp là phủ định nhấn mạnh trong lời nói về tương lai. Bản dịch giữ sức nhấn mạnh mà không âm thầm giải quyết nó thành nghĩa vụ, dù bối cảnh ơn gọi biệt riêng vẫn có thể hàm chứa điều đó.
- issue: Thời điểm được đầy dẫy Đức Thánh Linh
  choice: “ngay từ trong lòng mẹ”
  alternative: “ngay khi còn trong lòng mẹ” hoặc “ngay từ lúc lọt lòng mẹ”
  rationale: ἐκ κοιλίας có thể nhấn mạnh nguồn điểm hay thời điểm cực sớm; cách dịch chính giữ được độ mở, không giới hạn chắc chắn vào trước hay đúng lúc sinh.
- issue: Căn tính của πνεῦμα ἅγιον
  choice: “Đức Thánh Linh,” chỉ Thần Linh thánh của Đức Chúa Trời
  alternative: “một linh thiêng liêng,” hiểu phi ngôi vị
  rationale: Văn mạch Lu-ca cho thấy đây là sự tác động của Thần Linh Đức Chúa Trời; cách dịch không thêm định nghĩa thần học ngoài điều văn bản biểu đạt.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “người” để chỉ Giăng trong lời sứ thần, “cao trọng” cho μέγας, và dấu chấm phẩy để làm rõ các mệnh đề song song. Mọi ký hiệu chú thích đều xuất hiện trong chính văn.
