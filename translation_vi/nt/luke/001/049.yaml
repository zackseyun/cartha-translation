  to: vì Đấng Quyền Năng đã làm những việc lớn lao cho tôi, và danh Ngài là thánh.[a]
  rationale: Sửa trật tự thành phần trong mệnh đề đầu để tiếng Việt tự nhiên hơn. Thay “thật thánh” bằng “là thánh” để không thêm ý cường độ ngoài nguyên văn, đồng thời giữ chú thích về sự nhấn mạnh do trật tự từ tiếng Hy Lạp.
