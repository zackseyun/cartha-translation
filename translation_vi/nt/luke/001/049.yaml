  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: vi
  text: vì Đấng Quyền Năng đã làm những việc lớn lao cho tôi, và danh Ngài là thánh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn đặt từ “thánh” trước “danh Ngài” để nhấn mạnh.
    reason: source_word_order
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Diễn tả quan hệ nguyên nhân với lời Ma-ri tôn cao Chúa ở câu trước; “vì” tự nhiên và giữ rõ nghĩa nhân quả.
- source_word: ἐποίησέν
  choice: đã làm
  rationale: Thì aorist chỉ hành động quyết định của Đức Chúa Trời đã được thực hiện; “đã làm” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: μοι
  choice: cho tôi
  rationale: 'Dữ cách ở đây mang ý nghĩa thụ hưởng: Đức Chúa Trời làm những việc lớn lao vì lợi ích của Ma-ri.'
- source_word: μεγάλα
  choice: những việc lớn lao
  rationale: Tính từ trung tính số nhiều được dùng như danh từ; cách dịch này giữ nghĩa rộng, không giới hạn vào một loại hành động cụ thể.
- source_word: ὁ δυνατός
  choice: Đấng Quyền Năng
  rationale: Tính từ có mạo từ được dùng như một danh xưng dành cho Đức Chúa Trời; cách dịch ngắn gọn, trang trọng và dễ hiểu.
- source_word: ἅγιον
  choice: thật thánh
  rationale: “Thánh” giữ nghĩa cốt lõi của ἅγιον; “thật” chuyển tải phần nào sự nhấn mạnh do từ này được đặt trước trong tiếng Hy Lạp.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: danh Ngài
  rationale: Giữ nguyên hình ảnh “danh” trong Kinh Thánh, có thể gợi đến bản tính và danh tiếng được bày tỏ của Đức Chúa Trời, mà không diễn giải quá mức.
theological_decisions:
- issue: Cách dịch ὁ δυνατός như một danh xưng thần linh
  choice: Đấng Quyền Năng
  alternative: Đấng đầy quyền năng; Đấng mạnh mẽ
  rationale: Cấu trúc Hy Lạp dùng tính từ có mạo từ như danh từ, ở đây là một danh xưng tôn kính dành cho Đức Chúa Trời. “Đấng Quyền Năng” giữ được sắc thái danh xưng mà không thêm nội dung giáo lý.
- issue: Trật tự từ trong καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: và danh Ngài thật thánh
  alternative: và thánh là danh Ngài
  rationale: Tiếng Hy Lạp đặt “thánh” trước để nhấn mạnh. Bản dịch chính dùng trật tự tự nhiên của tiếng Việt và thêm “thật” để thể hiện sự nhấn mạnh; chú thích ghi nhận cấu trúc nguyên văn nhằm tránh che khuất sắc thái ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đấng Quyền Năng” như một danh xưng và “danh Ngài” theo văn phong Kinh Thánh quen thuộc; tránh lối diễn đạt cổ hoặc mang màu sắc hệ phái.
