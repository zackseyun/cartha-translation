source:
  edition: SBLGNT
  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: vi
  text: Vì đã có nhiều người bắt tay biên soạn bản tường thuật về những việc đã được ứng nghiệm giữa chúng ta,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được hoàn thành” hoặc “đã được xác chứng đầy đủ giữa chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Vì
  rationale: Mở đầu phần tựa trang trọng bằng quan hệ nguyên nhân/bối cảnh; “Vì” tự nhiên trong tiếng Việt và nối trực tiếp với mệnh đề chính tiếp theo.
- source_word: πολλοὶ
  choice: nhiều người
  rationale: Diễn đạt rõ số lượng người mà không thêm ý “những người khác,” vốn không có trong nguyên văn.
- source_word: ἐπεχείρησαν
  choice: đã ... bắt tay
  rationale: Diễn tả việc đảm nhận và khởi sự một công trình, không hàm ý rằng nỗ lực ấy thất bại như “cố gắng” đôi khi có thể gợi ra.
- source_word: ἀνατάξασθαι
  choice: biên soạn
  rationale: Phù hợp với hoạt động sắp xếp và viết thành một tác phẩm tường thuật, đồng thời giữ văn phong trang trọng, tự nhiên.
- source_word: διήγησιν
  choice: bản tường thuật
  rationale: Chỉ một bài trình thuật có bố cục; cách dịch này rõ nghĩa và hợp với sắc thái sử liệu của lời tựa.
- source_word: περὶ
  choice: về
  rationale: Tự nhiên trong tiếng Việt hiện đại và diễn đạt đúng quan hệ đề tài mà không làm câu nặng nề.
- source_word: τῶν πεπληροφορημένων
  choice: đã được ứng nghiệm
  rationale: Dạng hoàn thành bị động ở đây có thể chỉ những việc đã đạt đến sự hoàn tất; “ứng nghiệm” giữ được âm hưởng hoàn thành lời hứa trong Lu-ca, nhưng nghĩa “được hoàn thành” và “được xác chứng đầy đủ” vẫn được ghi nhận ở chú thích.
- source_word: ἐν ἡμῖν
  choice: giữa chúng ta
  rationale: Giữ nghĩa tập thể và không xác định quá mức “chúng ta” là nhóm nào.
- source_word: πραγμάτων
  choice: những việc
  rationale: Giữ phạm vi nghĩa rộng của πρᾶγμα, có thể bao gồm các sự việc, biến cố và điều đã xảy ra.
theological_decisions:
- issue: Nghĩa của πεπληροφορημένων trong lời tựa Lu-ca
  choice: được ứng nghiệm
  alternative: được hoàn thành; được xác chứng đầy đủ
  rationale: Trong sự kết hợp với πραγμάτων và mạch tường thuật về các biến cố cứu độ, nghĩa hoàn tất/ứng nghiệm có sức thuyết phục hơn. Tuy nhiên, động từ cũng có thể mang sắc thái được xác nhận hoặc xác chứng đầy đủ, nên chú thích bảo lưu các khả năng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, phù hợp với phần mở đầu mang tính văn chương. Câu này chủ ý để ngỏ vì còn tiếp tục sang Lu-ca 1:2; dấu phẩy phản ánh cấu trúc chưa hoàn tất của nguyên văn.
