  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: vi
  text: Ngài đã cho người đói no đầy những điều tốt lành, còn cho người giàu ra về tay không.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: người đói
  rationale: Phân từ hiện tại được dùng như danh từ, chỉ những người đang đói; cách dịch này tự nhiên, cụ thể và không tăng mức độ thành “đói khát cùng cực”.
- source_word: ἐνέπλησεν
  choice: đã làm cho ... được no đầy
  rationale: Động từ chỉ hành động làm đầy hoặc cho no. Trong ngữ cảnh người đói và những điều tốt lành, “làm cho ... được no đầy” vừa giữ hình ảnh làm đầy vừa diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀγαθῶν
  choice: những điều tốt lành
  rationale: Danh từ hóa ở sở hữu cách chỉ nội dung mà người đói được làm cho no đầy; không thêm sắc thái “quà tặng” vốn không được nói rõ.
- source_word: πλουτοῦντας
  choice: người giàu
  rationale: Phân từ hiện tại được dùng như danh từ, tạo sự đối lập xã hội trực tiếp với “người đói”.
- source_word: ἐξαπέστειλεν
  choice: đuổi ... về
  rationale: Động từ ghép mang nghĩa sai đi hoặc cho đi khỏi. Trong cấu trúc tiếng Việt, “đuổi ... về” diễn đạt rõ việc họ bị cho ra về, đồng thời giữ sắc thái mạnh của ἐξαπέστειλεν.
- source_word: κενούς
  choice: tay không
  rationale: Tính từ vị ngữ mô tả tình trạng của người giàu khi bị cho về. Trong tiếng Việt, “về tay không” là cách nói tự nhiên tương ứng với việc ra đi mà không nhận được gì; cách dịch đơn thuần “trống không” không tự nhiên khi chỉ người.
theological_decisions:
- issue: Sự đảo ngược địa vị xã hội-thần học trong bài ca của Ma-ri
  choice: Giữ nguyên sự đối lập cụ thể giữa “người đói” và “người giàu”.
  alternative: Diễn giải thành người thiếu thốn về tâm linh và người tự mãn hoặc kiêu ngạo.
  rationale: Bản Hy Lạp trực tiếp nói đến người đói và người giàu. Bản dịch không tâm linh hóa các nhóm này, nhờ đó giữ nguyên sức căng và chủ đề đảo ngược của Đức Chúa Trời trong Lu-ca.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế cân xứng phù hợp với thể thi ca của bài Magnificat; tránh thuật ngữ giáo phái và tránh giải nghĩa vượt quá bản Hy Lạp.
