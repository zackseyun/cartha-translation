  rationale: Thay “đuổi ... về” bằng “cho ... ra về” để phản ánh chính xác hơn ἐξαπέστειλεν, đồng thời giữ lối nói “ra về tay không” tự nhiên cho κενούς. Liên từ “còn” làm nổi bật phép đối xứng và đảo ngược giữa hai vế mà không thêm diễn giải.
