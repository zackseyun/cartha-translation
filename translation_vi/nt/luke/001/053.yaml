  terminology: “Người đói,” “người giàu,” và “những điều tốt lành” phù hợp với nguyên ngữ và giữ được sự đối chiếu xã hội trong bài ca của Ma-ri. Không cần thuật ngữ thần học hay chú thích bổ sung.
