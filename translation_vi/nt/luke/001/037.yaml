  rationale: Sửa duy nhất cách diễn đạt vị ngữ để tiếng Việt hiện đại tự nhiên hơn. Bản sửa vẫn giữ “lời,” “từ Đức Chúa Trời,” và tính phủ định phổ quát của nguyên văn; chú thích tiếp tục ghi nhận cách hiểu thay thế mà không giải quyết tính đa nghĩa theo hướng giáo phái.
