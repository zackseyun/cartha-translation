  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: vi
  text: Vì không một lời nào từ Đức Chúa Trời là không thể thực hiện được.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vì đối với Đức Chúa Trời, không điều gì là không thể.”'
    reason: Cách hiểu khác có cơ sở ngữ pháp, xem παρά theo nghĩa liên hệ và ῥῆμα theo nghĩa rộng là “điều, sự việc”.
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Mệnh đề này nêu lý do cho lời thiên sứ vừa nói; “Vì” giữ được chức năng giải thích của liên từ.
- source_word: οὐκ ἀδυνατήσει
  choice: sẽ là điều không thể
  rationale: Cách diễn đạt này chuyển tải nghĩa tương lai “sẽ không thể xảy ra/không thể thực hiện được” mà không thu hẹp câu vào riêng ý “ứng nghiệm” hay “thất bại”.
- source_word: παρὰ τοῦ θεοῦ
  choice: từ Đức Chúa Trời
  rationale: Với sở hữu cách, παρά có thể chỉ nguồn gốc; đi cùng ῥῆμα, cụm này tự nhiên nói về lời đến từ Đức Chúa Trời. Nghĩa truyền thống “đối với Đức Chúa Trời” vẫn được giữ trong chú thích.
- source_word: πᾶν
  choice: không một
  rationale: Trong cấu trúc phủ định, “không một lời nào” diễn đạt tự nhiên sức khái quát của πᾶν trong tiếng Việt.
- source_word: ῥῆμα
  choice: lời
  rationale: “Lời” giữ rõ danh từ có thật trong bản Hy Lạp và phù hợp với ngữ cảnh lời công bố của thiên sứ, trong khi “điều” rộng hơn và “lời hứa” mang tính diễn giải quá mức.
theological_decisions:
- issue: Ý nghĩa của cụm παρὰ τοῦ θεοῦ πᾶν ῥῆμα
  choice: Câu chính nói rằng không một lời nào từ Đức Chúa Trời sẽ là điều không thể.
  alternative: Đối với Đức Chúa Trời, không điều gì là không thể.
  rationale: Cả hai cách hiểu đều có cơ sở ngữ pháp. Bản chính giữ “lời” vì ῥῆμα hiện diện rõ trong tiếng Hy Lạp và phù hợp với lời thiên sứ vừa công bố; chú thích giữ cách hiểu truyền thống để không xóa bỏ tính đa nghĩa thực sự.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “không một lời nào” nhấn mạnh tính phổ quát; “sẽ là điều không thể” giữ sắc thái tương lai của động từ Hy Lạp và tránh diễn giải quá hẹp thành “ứng nghiệm”.
