  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: vi
  text: Toàn thể dân chúng đang cầu nguyện ở bên ngoài vào giờ dâng hương[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vào lúc đốt hương.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: cả đoàn dân
  rationale: “Cả” diễn đạt tính toàn thể của πᾶν, còn “đoàn dân” chuyển tải πλῆθος như một tập thể đông người đang tụ họp, tự nhiên hơn trong tiếng Việt so với cách dịch sát chữ “toàn bộ đám đông”.
- source_word: τοῦ λαοῦ
  choice: dân
  rationale: λαός chỉ “dân chúng/dân” trong bối cảnh đền thờ. Bản dịch không thêm “Y-sơ-ra-ên” vì nguyên văn không nêu rõ tên dân tộc tại đây.
- source_word: προσευχόμενον
  choice: đang cầu nguyện
  rationale: Phân từ hiện tại đi với ἦν diễn tả hành động đang tiếp diễn; “đang cầu nguyện” là cách diễn đạt tự nhiên và không thêm ý “cùng nhau” vốn không được nói rõ.
- source_word: ἔξω
  choice: ở bên ngoài
  rationale: Giữ nghĩa đơn giản của ἔξω là “bên ngoài”, không tự ý xác định là bên ngoài nơi thánh hay bên ngoài đền thờ.
- source_word: τῇ ὥρᾳ
  choice: vào giờ
  rationale: “Vào giờ” giữ được ý về một thời điểm được ấn định trong nghi thức, đồng thời tự nhiên trong tiếng Việt.
- source_word: τοῦ θυμιάματος
  choice: dâng hương
  rationale: Trong bối cảnh nghi lễ đền thờ, θυμίαμα chỉ hương được dâng; “dâng hương” diễn đạt gọn và rõ hành vi thờ phượng, còn khả năng dịch sát hơn là “đốt hương” được giữ trong chú thích.
theological_decisions:
- issue: Thuật ngữ nghi lễ đền thờ trong θυμίαμα
  choice: dâng hương
  alternative: đốt hương
  rationale: “Dâng hương” bảo toàn sắc thái nghi lễ thờ phượng trong bối cảnh tư tế mà không đưa thêm một khẳng định giáo lý; chú thích giữ cách hiểu nhấn mạnh hành động đốt hương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cả đoàn dân” tránh lối nói nặng nề “toàn thể đám đông dân chúng” nhưng vẫn giữ ý về toàn bộ cộng đồng đông người đang tụ họp.
