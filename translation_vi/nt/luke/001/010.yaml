  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính của nguyên văn: tính toàn thể của nhóm người, hành động cầu nguyện đang diễn ra, vị trí ở bên ngoài, và thời điểm nghi thức dâng hương. Tuy nhiên, “đoàn dân” thường gợi một đoàn/nhóm đang di chuyển hoặc được tổ chức thành hàng, không diễn đạt rõ bằng “πλῆθος” một đám đông đông người tụ họp.'
