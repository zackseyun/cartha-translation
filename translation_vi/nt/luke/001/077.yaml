  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: vi
  text: để ban cho dân Ngài sự hiểu biết về ơn cứu rỗi trong sự tha thứ tội lỗi của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua sự tha thứ tội lỗi của họ” hoặc “nhờ sự tha thứ tội lỗi của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: để cho
  rationale: Cụm động từ nguyên mẫu có mạo từ diễn tả mục đích, phụ thuộc vào câu trước; “để cho” thể hiện tự nhiên quan hệ mục đích trong tiếng Việt.
- source_word: γνῶσιν σωτηρίας
  choice: biết sự cứu rỗi
  rationale: γνῶσις chỉ sự biết hoặc hiểu biết. Cách diễn đạt bằng động từ “biết” tự nhiên hơn “ban sự hiểu biết” trong tiếng Việt, đồng thời không xác định quá mức tính chất của sự nhận biết; “sự cứu rỗi” phù hợp với σωτηρία trong văn mạch Lu-ca.
- source_word: τῷ λαῷ αὐτοῦ
  choice: dân Ngài
  rationale: Thể tặng cách chỉ đối tượng tiếp nhận; λαός trong văn mạch giao ước được dịch tự nhiên là “dân”, còn αὐτοῦ là “Ngài”, quy chiếu về Chúa trong câu trước.
- source_word: ἐν ἀφέσει
  choice: trong sự tha thứ
  rationale: Giữ sắc thái rộng của ἐν, có thể chỉ phạm vi hoặc cách thức, mà không buộc câu theo nghĩa công cụ hay nguyên nhân.
- source_word: ἁμαρτιῶν αὐτῶν
  choice: tội lỗi của họ
  rationale: Giữ ý số nhiều tập hợp của ἁμαρτιῶν bằng cách nói tự nhiên “tội lỗi”; “của họ” quy chiếu về dân Ngài.
theological_decisions:
- issue: Mối liên hệ giữa sự cứu rỗi và sự tha thứ
  choice: “trong sự tha thứ tội lỗi của họ” trình bày sự cứu rỗi được nhận biết trong mối liên hệ mật thiết với sự tha thứ.
  alternative: Có thể dịch “qua sự tha thứ tội lỗi của họ” hoặc “nhờ sự tha thứ tội lỗi của họ”, nhấn mạnh phương tiện hơn.
  rationale: ἐν với thể tặng cách cho phép nhiều sắc thái gần nhau. Bản chính giữ “trong” để bảo tồn độ mở và sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” giữ cách xưng hô tôn kính; cấu trúc nối bằng “để” phản ánh việc câu này tiếp tục lời tiên tri ở câu trước.
