language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: vi
  text: 'Thiên sứ đáp lời ông: “Ta là Gáp-ri-ên, người đứng trước mặt Đức Chúa Trời; ta đã được sai đến để nói với ông và loan báo cho ông tin mừng này.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “loan báo cho ông những điều này.” Nguyên văn Hy Lạp có thể dịch sát là: “loan báo tin mừng cho ông: những điều này”; “những điều này” chỉ sứ điệp Gáp-ri-ên vừa công bố.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: đáp lời
  rationale: Phân từ bất định mở đầu lời nói trực tiếp; “đáp lời” diễn đạt tự nhiên trong tiếng Việt và giữ ý hồi đáp.
- source_word: ἄγγελος
  choice: thiên sứ
  rationale: Ngữ cảnh xác định đây là sứ giả thuộc thiên giới, chính là Gáp-ri-ên; “thiên sứ” vừa rõ nghĩa vừa phù hợp văn phong Kinh Thánh hiện đại.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Ta là Gáp-ri-ên
  rationale: Giữ đại từ được nêu rõ để phản ánh sắc thái nhấn mạnh; tên riêng được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
- source_word: ὁ παρεστηκὼς
  choice: người đứng
  rationale: Phân từ hoàn thành diễn tả tư thế và địa vị đang tiếp diễn; thì hiện tại tiếng Việt truyền đạt tự nhiên ý này.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Diễn đạt trực tiếp ý hiện diện trước Đức Chúa Trời, đồng thời giữ sắc thái về địa vị phụng sự trong triều đình thiên thượng.
- source_word: ἀπεστάλην
  choice: Ta đã được sai đến
  rationale: Giữ thể bị động và ý được giao phái; “đến” làm rõ hướng sai phái đến với Xa-cha-ri mà không thay đổi nội dung.
- source_word: λαλῆσαι πρὸς σὲ
  choice: nói với ông
  rationale: Diễn đạt tự nhiên mục đích của việc được sai phái và giữ trực tiếp giới từ πρὸς.
- source_word: εὐαγγελίσασθαί σοι
  choice: báo cho ông tin mừng
  rationale: Động từ có nghĩa loan báo tin tốt lành; cách dịch này giữ thành tố “tin mừng” mà không biến nó thành một thuật ngữ kỹ thuật quá mức trong ngữ cảnh.
- source_word: ταῦτα
  choice: này
  rationale: Đại từ chỉ định số nhiều theo nghĩa đen là “những điều này”, nhưng ở đây quy chiếu toàn bộ sứ điệp vừa được công bố; kết hợp thành “tin mừng này” là tiếng Việt tự nhiên. Nghĩa sát chữ được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch εὐαγγελίζω trong lời loan báo của thiên sứ
  choice: báo ... tin mừng
  alternative: rao truyền phúc âm; loan báo tin vui
  rationale: “Tin mừng” giữ nghĩa từ vựng và âm hưởng thần học của động từ, nhưng tránh áp đặt sắc thái thuật ngữ phát triển về sau của “phúc âm” lên chính cảnh thuật chuyện này.
- issue: Địa vị của Gáp-ri-ên trước Đức Chúa Trời
  choice: người đứng trước mặt Đức Chúa Trời
  alternative: người hầu cận Đức Chúa Trời
  rationale: Bản dịch giữ nguyên hình ảnh “đứng trước mặt” và không giải nghĩa nó thành một chức vụ cụ thể, nhờ đó bảo tồn độ mở và sắc thái triều đình của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thiên sứ” cho sứ giả thiên giới, “Đức Chúa Trời” cho θεός, và cặp đại từ “Ta–ông” để phù hợp lời của thiên sứ nói với Xa-cha-ri. Cấu trúc được điều chỉnh nhẹ cho tự nhiên nhưng vẫn giữ thể bị động, sự nhấn mạnh của đại từ và hình ảnh đứng trước mặt Đức Chúa Trời.
