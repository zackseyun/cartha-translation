id: LUK.1.30
reference: Luke 1:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: vi
  text: 'Thiên sứ nói với cô: “Ma-ri, đừng sợ, vì cô đã được ơn[a] trước mặt Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ân huệ.” Danh từ Hy Lạp χάρις có thể chỉ “ơn” hoặc “ân huệ”; trong thành ngữ ở đây, ý nghĩa là được Đức Chúa Trời ưu ái.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: nói
  rationale: Động từ tường thuật ở thì aorist được chuyển tự nhiên bằng “nói” khi dẫn lời trực tiếp.
- source_word: ἄγγελος
  choice: thiên sứ
  rationale: Trong trình thuật thời thơ ấu của Lu-ca, từ này chỉ một sứ giả từ trời; “thiên sứ” vừa nêu rõ đối tượng vừa giữ nét nghĩa sứ giả.
- source_word: Μὴ φοβοῦ
  choice: đừng sợ
  rationale: Cách diễn đạt ngắn gọn, tự nhiên trong tiếng Việt hiện đại, truyền đạt đúng mệnh lệnh phủ định của nguyên ngữ.
- source_word: Μαριάμ
  choice: Ma-ri
  rationale: Phiên âm tên riêng theo cách quen thuộc, dễ đọc trong tiếng Việt.
- source_word: εὗρες
  choice: đã được
  rationale: Trong thành ngữ “tìm thấy ân huệ trước mặt” của nguyên ngữ, tiếng Việt tự nhiên diễn đạt kết quả hiện tại bằng “đã được”; cách này tránh lối nói gượng “đã tìm thấy ơn”.
- source_word: χάριν
  choice: ơn
  rationale: “Ơn” là từ tiếng Việt ngắn gọn có thể bao hàm ân huệ hay sự ưu ái; chú thích giữ lại khả năng dịch “ân huệ” và giải thích thành ngữ.
- source_word: παρὰ τῷ θεῷ
  choice: trước mặt Đức Chúa Trời
  rationale: Với động từ chỉ việc được ơn, παρά cộng cách cho diễn tả sự ưu ái trong cái nhìn hay sự hiện diện của Đức Chúa Trời; “trước mặt” bảo toàn sắc thái ấy.
theological_decisions:
- issue: Cách dịch χάριν trong ngữ cảnh nói về Ma-ri
  choice: ơn
  alternative: ân huệ
  rationale: Cụm εὑρίσκω χάριν παρά là thành ngữ chỉ việc được ai ưu ái. “Được ơn trước mặt Đức Chúa Trời” giữ được thành ngữ và không đưa các công thức tín lý về sau vào câu; chú thích nêu rõ phương án “ân huệ” để bảo toàn phạm vi nghĩa của χάρις.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cô” để chỉ Ma-ri trong lời kể, tránh lối xưng hô cổ; dùng “thiên sứ” cho hữu thể từ trời và “Đức Chúa Trời” làm danh xưng thần linh.
