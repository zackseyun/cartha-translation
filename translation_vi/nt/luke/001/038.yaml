    rationale: γένοιτό μοι là optative diễn tả nguyện ước và sự ưng thuận của Ma-ri, không nhất thiết là lời thỉnh cầu lịch sự với người đối thoại. “Nguyện” phản ánh chức năng này trực tiếp hơn.
  - severity: low
