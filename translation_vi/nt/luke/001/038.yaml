source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: vi
  text: 'Ma-ri nói: “Này, tôi là nữ tôi tớ của Chúa[a]. Nguyện điều ấy xảy đến với tôi theo lời ngài[b].” Rồi thiên sứ rời khỏi Ma-ri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “nữ nô lệ của Chúa.” Từ Hy Lạp δούλη có thể chỉ một nữ nô lệ hoặc nữ tôi tớ; ở đây “nữ tôi tớ” nhấn mạnh sự khiêm nhường quy phục Chúa.
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch là “Nguyện điều ấy thành cho tôi theo lời ngài.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: nói
  rationale: Liên từ nhẹ δὲ không nhất thiết phải được biểu đạt riêng trong tiếng Việt; bỏ từ nối ở đầu câu giúp lời kể tự nhiên mà không thêm sắc thái thời gian.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Giữ sắc thái trang trọng và nhấn mạnh trong lời Ma-ri tự trình diện, thay vì làm yếu thành một tiếng đồng ý đơn thuần.
- source_word: δούλη
  choice: tôi tớ
  rationale: Danh từ giống cái chỉ một nữ nô lệ hoặc nữ tôi tớ. “Tôi tớ” diễn đạt tự nhiên thái độ khiêm nhường và quy phục Chúa trong ngữ cảnh; nghĩa mạnh hơn được nêu trong chú thích.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ κύριος là tước hiệu chỉ Đức Chúa Trời và diễn đạt quan hệ sở thuộc theo cú pháp tự nhiên của tiếng Việt.
- source_word: γένοιτό μοι
  choice: Xin điều ấy xảy đến với tôi
  rationale: Thể optative aorist diễn tả lời ưng thuận mang tính mong nguyện. Cách dịch này truyền đạt sự tự nguyện tiếp nhận, chứ không chỉ dự báo điều sẽ xảy ra.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: theo lời ngài
  rationale: “Theo” giữ ý phù hợp với lời vừa được thiên sứ nói; “lời” bảo toàn cách diễn đạt ngắn gọn của ῥῆμα, còn “ngài” là đại từ kính trọng hướng đến thiên sứ, không đồng nhất thiên sứ với Chúa.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: rời khỏi Ma-ri
  rationale: Diễn đạt trực tiếp hành động thiên sứ đi khỏi bà; lặp tên riêng để tránh phải thêm vào bản văn một đại từ tiếng Việt hàm ý tuổi tác hay địa vị.
- source_word: ὁ ἄγγελος
  choice: thiên sứ
  rationale: Trong trình thuật này, ἄγγελος rõ ràng là một sứ giả thiên giới; “thiên sứ” chính xác và trang trọng.
theological_decisions:
- issue: Cách dịch lời Ma-ri tự gọi mình là δούλη
  choice: tôi tớ của Chúa
  alternative: nữ nô lệ của Chúa
  rationale: δούλη có thể chỉ một nữ nô lệ, nhưng tại đây trọng tâm là sự khiêm nhường và quy phục ý Chúa. Bản dịch chính dùng cách nói tự nhiên hơn, đồng thời chú thích giữ lại sắc thái lệ thuộc mạnh của từ Hy Lạp.
- issue: Sắc thái của γένοιτό μοι
  choice: Xin điều ấy xảy đến với tôi theo lời ngài
  alternative: Nguyện điều ấy thành cho tôi theo lời ngài
  rationale: Thể optative diễn tả sự ưng thuận và mong nguyện của Ma-ri, không chỉ là một lời xác nhận tương lai. Cách dịch chính rõ ràng trong tiếng Việt hiện đại mà không áp đặt cách hiểu giáo phái.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Này” giữ sắc thái nhấn mạnh của Ἰδού; “tôi tớ” duy trì âm hưởng Kinh Thánh quen thuộc. Việc lặp tên Ma-ri ở cuối câu tránh chọn đại từ xưng gọi có thể vô tình gán tuổi tác hoặc địa vị không được bản Hy Lạp nêu rõ.
