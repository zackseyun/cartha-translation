  to: 'Ma-ri nói: “Này, tôi là nữ tôi tớ của Chúa[a]. Nguyện điều ấy xảy đến với tôi theo lời ngài[b].” Rồi thiên sứ rời khỏi Ma-ri.'
  rationale: Chỉnh “Xin” thành “Nguyện” để phản ánh rõ hơn optative γένοιτό μοι là sự ưng thuận mang tính mong nguyện, không tạo ấn tượng Ma-ri đang xin phép thiên sứ. Chỉnh “tôi tớ” thành “nữ tôi tớ” để biểu lộ giống cái của δούλη. Các yếu tố khác, gồm “theo lời ngài” hướng đến thiên sứ và “rời khỏi Ma-ri,” được giữ nguyên vì trung thành với bản Hy Lạp và tự nhiên trong tiếng Việt.
