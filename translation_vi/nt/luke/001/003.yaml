  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: vi
  text: Sau khi đã tìm hiểu kỹ lưỡng mọi sự từ đầu[a], tôi cũng thấy nên viết cho ngài một bản tường thuật theo trình tự[b], thưa ngài Thê-ô-phi-lô rất đáng kính.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã theo dõi sát sao mọi sự từ đầu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “theo thứ tự”; cụm từ này có thể nói đến cách sắp xếp mạch lạc chứ không nhất thiết là trình tự thời gian nghiêm ngặt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: thấy nên
  rationale: Trong thành ngữ này, từ này diễn tả một nhận định và quyết định đã được cân nhắc. “Thấy nên” tự nhiên trong tiếng Việt mà vẫn giữ sắc thái trang trọng của lời mở đầu.
- source_word: κἀμοὶ
  choice: tôi cũng
  rationale: Giữ ý tác giả đặt mình bên cạnh những người đã thuật lại trước đó trong ngữ cảnh liền trước.
- source_word: παρηκολουθηκότι
  choice: sau khi đã theo dõi
  rationale: Động từ có thể chỉ việc theo sát hoặc tìm hiểu kỹ. “Theo dõi” giữ nghĩa trực tiếp, còn “kỹ lưỡng” làm rõ sắc thái cẩn trọng; nghĩa “tìm hiểu” được nêu trong chú thích.
- source_word: ἄνωθεν
  choice: từ đầu
  rationale: Trong ngữ cảnh lời tựa mang tính biên soạn lịch sử, nghĩa tự nhiên nhất là từ khởi đầu, không phải từ trên cao.
- source_word: πᾶσιν
  choice: mọi sự
  rationale: Diễn đạt đầy đủ phạm vi bao quát của dạng trung tính số nhiều và phù hợp văn phong trang trọng.
- source_word: ἀκριβῶς
  choice: kỹ lưỡng
  rationale: Truyền đạt sự cẩn trọng và chính xác trong quá trình theo dõi, đồng thời kết hợp tự nhiên với động từ tiếng Việt.
- source_word: καθεξῆς
  choice: theo trình tự
  rationale: Giữ được ý sắp xếp có thứ tự nhưng không khẳng định đó nhất thiết là một niên biểu hoàn toàn nghiêm ngặt.
- source_word: σοι γράψαι
  choice: viết lại cho ngài
  rationale: “Cho ngài” thể hiện người nhận ở cách gián tiếp. “Viết lại” trong tiếng Việt tự nhiên ở đây và liên kết với các sự việc đang được thuật lại, không hàm ý sửa chữa.
- source_word: κράτιστε
  choice: đáng kính
  rationale: Thể hiện lối xưng hô tôn trọng dành cho người có địa vị trong lời đề tặng, nhưng không suy đoán một chức vụ cụ thể.
- source_word: Θεόφιλε
  choice: Thê-ô-phi-lô
  rationale: Phiên âm tên riêng Hy Lạp theo cách đọc rõ ràng, quen thuộc với độc giả tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của καθεξῆς đối với thứ tự lịch sử
  choice: theo trình tự
  alternative: theo thứ tự thời gian
  rationale: Từ Hy Lạp có thể nói đến sự nối tiếp hoặc cách sắp xếp có trật tự, nhưng không buộc phải hàm ý một trình tự thời gian tuyệt đối. Bản dịch giữ nguyên độ mở này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, phù hợp lời tựa chính thức. Cấu trúc câu được điều chỉnh cho tự nhiên trong tiếng Việt, đồng thời giữ liên hệ “tôi cũng” với các tác giả được nhắc ở câu trước và không giải quyết quá mức độ mở của καθεξῆς.
