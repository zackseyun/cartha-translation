  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: vi
  text: đúng như Ngài đã phán qua miệng các nhà tiên tri thánh của Ngài từ thuở xa xưa,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ thời cổ xưa.” Cụm từ này có thể chỉ một thời quá khứ rất xa. Một số người hiểu mạnh hơn là “từ cõi đời đời,” nhưng ở đây việc nhắc đến các nhà tiên tri nghiêng về nghĩa “từ thuở xa xưa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: đúng như
  rationale: Diễn đạt sự tương ứng với lời ngay trước đó và giữ sắc thái điều đang xảy ra phù hợp với lời Đức Chúa Trời đã phán.
- source_word: ἐλάλησεν
  choice: đã phán
  rationale: Động từ aorist chỉ hành động nói trong quá khứ; “phán” tự nhiên trong ngữ cảnh Đức Chúa Trời truyền lời qua các nhà tiên tri.
- source_word: διὰ στόματος
  choice: qua miệng
  rationale: Giữ hình ảnh cụ thể của thành ngữ Kinh Thánh về lời Đức Chúa Trời được truyền đạt qua trung gian, thay vì giản lược thành “qua”.
- source_word: τῶν ἁγίων ... προφητῶν
  choice: các nhà tiên tri thánh
  rationale: ἁγίων bổ nghĩa cho προφητῶν; “thánh” giữ ý những nhà tiên tri thuộc về và được biệt riêng cho Đức Chúa Trời.
- source_word: ἀπ’ αἰῶνος
  choice: từ thuở xa xưa
  rationale: Trong ngữ cảnh nói đến các nhà tiên tri, cụm này tự nhiên chỉ thời xa xưa; cách dịch vừa dễ hiểu vừa giữ chiều sâu thời gian.
- source_word: αὐτοῦ
  choice: của Ngài
  rationale: Đại từ tự nhiên quy chiếu về Đức Chúa Trời trong ngữ cảnh, xác định các nhà tiên tri là của Ngài.
theological_decisions:
- issue: Phạm vi nghĩa của ἀπ’ αἰῶνος
  choice: thời xa xưa trong lịch sử cứu chuộc (“từ thuở xa xưa”)
  alternative: từ cõi đời đời
  rationale: Việc nhắc ngay đến các nhà tiên tri khiến nghĩa chỉ thời cổ xưa phù hợp hơn nghĩa siêu hình về cõi đời đời; chú thích vẫn bảo lưu khả năng về sắc thái của cụm từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ thành ngữ “qua miệng” để bảo toàn hình ảnh về sự truyền lời qua các nhà tiên tri; dùng “Ngài” nhất quán để chỉ Đức Chúa Trời.
