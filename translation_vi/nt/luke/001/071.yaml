- from: sự cứu rỗi khỏi kẻ thù của chúng ta và khỏi tay tất cả những kẻ thù ghét chúng ta.[a]
  to: sự cứu rỗi khỏi các kẻ thù của chúng ta và khỏi tay mọi kẻ ghét chúng ta.[a]
  rationale: Chỉnh cụm chỉ những người ghét “chúng ta” để phản ánh chính xác phân từ được danh từ hóa trong nguyên văn, loại bỏ sự thêm ý “kẻ thù,” đồng thời giữ nguyên tính mơ hồ có chủ ý giữa sự cứu rỗi và sự giải cứu khỏi các thế lực thù nghịch. Chú thích tiếp tục nêu phương án nghĩa bóng của “khỏi tay.”
