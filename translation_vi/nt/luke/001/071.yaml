translation:
  language: vi
  text: sự cứu rỗi khỏi các kẻ thù của chúng ta và khỏi tay mọi kẻ ghét chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự giải cứu khỏi các kẻ thù của chúng ta và khỏi quyền lực của mọi kẻ ghét chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρίαν
  choice: sự cứu rỗi
  rationale: Giữ được chiều sâu thần học của lời tiên tri, đồng thời trong ngữ cảnh vẫn chỉ sự giải cứu cụ thể khỏi các thế lực thù địch.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: khỏi kẻ thù của chúng ta
  rationale: ἐξ với sở hữu cách diễn tả sự tách khỏi; bản dịch không thêm ý “quyền lực” vốn không được nói rõ trong cụm này.
- source_word: ἐκ χειρὸς
  choice: khỏi tay
  rationale: Giữ hình ảnh Kinh Thánh về bàn tay biểu thị quyền lực hoặc sự kiểm soát, đồng thời vẫn dễ hiểu trong tiếng Việt.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: tất cả những kẻ thù ghét chúng ta
  rationale: Diễn đạt tự nhiên phân từ hiện tại được dùng như danh từ, đồng thời giữ sắc thái hành động hoặc thái độ mang tính liên tục, đặc trưng.
- source_word: καὶ
  choice: và
  rationale: Liên kết trực tiếp hai cụm giới từ mà không diễn giải thêm.
theological_decisions:
- issue: Bản chất của sự cứu rỗi được hứa trong lời tiên tri của Xa-cha-ri
  choice: Dùng “sự cứu rỗi” trong một câu nói rõ việc thoát khỏi kẻ thù, nhờ đó giữ cả nghĩa giải cứu cụ thể lẫn chiều kích cứu chuộc rộng hơn.
  alternative: Chỉ hiểu là sự giải phóng chính trị/dân tộc, hoặc chỉ hiểu là sự cứu rỗi thuộc linh khỏi tội lỗi.
  rationale: Câu này trực tiếp nói đến kẻ thù và những kẻ thù ghét dân Chúa, nhưng trong Lu-ca 1, ngôn ngữ cứu rỗi cũng có ý nghĩa cứu chuộc; bản dịch không nên thu hẹp sự căng thẳng này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Cụm “khỏi tay” được giữ như một hình ảnh Kinh Thánh quen thuộc; chú thích nêu rõ nghĩa bóng là “khỏi quyền lực”.
