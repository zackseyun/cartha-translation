id: LUK.1.36
reference: Luke 1:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: vi
  text: Kìa, Ê-li-sa-bét, người họ hàng của cô, cũng đã thụ thai một con trai trong tuổi già; và bà ấy, người vốn bị gọi là son sẻ, nay đã ở tháng thứ sáu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của lời thiên sứ, đồng thời tự nhiên và trang trọng trong tiếng Việt.
- source_word: συγγενίς
  choice: người họ hàng
  rationale: Từ Hy Lạp chỉ một nữ thân thuộc nhưng không xác định quan hệ cụ thể; tránh thu hẹp thành chị em hoặc chị họ.
- source_word: συνείληφεν υἱόν
  choice: đã mang thai một con trai
  rationale: Diễn đạt tự nhiên ý đã thụ thai và hiện đang mang thai con trai.
- source_word: ἐν γήρει αὐτῆς
  choice: trong tuổi già
  rationale: Giữ sắc thái trực tiếp của nguyên văn về việc thụ thai khi đã cao tuổi.
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: người từng bị gọi là hiếm muộn
  rationale: Giữ ý người khác gọi bà như vậy và trạng thái ấy được nhìn từ hoàn cảnh trước đây; “hiếm muộn” tự nhiên, tôn trọng hơn “son sẻ” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Mức độ xác định quan hệ giữa Ma-ri và Ê-li-sa-bét
  choice: người họ hàng
  alternative: chị em họ
  rationale: Nguyên văn không xác định chính xác quan hệ huyết thống, nên bản dịch không suy diễn.
- issue: Cách thể hiện danh xưng “hiếm muộn”
  choice: người từng bị gọi là hiếm muộn
  alternative: người bị gọi là son sẻ
  rationale: “Từng bị gọi” phản ánh tình trạng được gán cho bà trước khi mang thai mà không thêm một kết luận thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cô” theo ngữ cảnh lời thiên sứ nói với Ma-ri, một phụ nữ trẻ; không thêm dấu chú thích vì câu không cần chú giải để bảo toàn nghĩa.
