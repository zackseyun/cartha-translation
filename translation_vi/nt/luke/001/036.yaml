  to: Kìa, Ê-li-sa-bét, người họ hàng của cô, cũng đã thụ thai một con trai trong tuổi già; và bà ấy, người vốn bị gọi là son sẻ, nay đã ở tháng thứ sáu.
  rationale: Đổi “đã mang thai” thành “đã thụ thai” để phản ánh trực tiếp συνείληφεν (đã thụ thai), và sửa danh xưng của Ê-li-sa-bét để sát thì và lực nghĩa của τῇ καλουμένῃ στείρᾳ. Các yếu tố khác được giữ nguyên, kể cả tính bất định của quan hệ thân thuộc.
