id: LUK.1.11
reference: Luke 1:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: vi
  text: Bấy giờ, một thiên sứ của Chúa hiện ra với ông, đứng bên phải bàn thờ dâng hương.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: hiện ra
  rationale: Dạng thụ động aorist của ὁράω thường mang nghĩa nội động “hiện ra” trong văn thuật sự; cách dịch này tự nhiên và diễn đạt sự xuất hiện hữu hình.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ nối tiếp diễn tiến câu chuyện hơn là biểu thị tương phản; “Bấy giờ” phù hợp với văn kể chuyện trang trọng và tự nhiên.
- source_word: αὐτῷ
  choice: với ông
  rationale: Túc từ gián tiếp đi với ὤφθη chỉ người được thấy sự hiện ra; “hiện ra với ông” là cách diễn đạt tiếng Việt rõ và tự nhiên.
- source_word: ἄγγελος
  choice: một thiên sứ
  rationale: Trong bối cảnh khải hiện tại đền thờ, từ này chỉ một sứ giả thiên giới; “thiên sứ” chính xác hơn nghĩa rộng “sứ giả”.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ danh xưng κύριος là “Chúa” trong kết cấu sở hữu ἄγγελος κυρίου.
- source_word: ἑστὼς
  choice: đứng
  rationale: Phân từ hoàn thành của ἵστημι mô tả tư thế và vị trí của thiên sứ lúc hiện ra; “đứng” truyền đạt tự nhiên trạng thái ấy.
- source_word: ἐκ δεξιῶν
  choice: bên phải
  rationale: Thành ngữ này chỉ vị trí ở phía bên phải; “bên phải” ngắn gọn, rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: τοῦ θυσιαστηρίου τοῦ θυμιάματος
  choice: bàn thờ dâng hương
  rationale: Cụm sở hữu xác định đây là bàn thờ dùng cho việc dâng hương. “Bàn thờ dâng hương” tự nhiên trong tiếng Việt và không làm thay đổi vật được nói đến.
theological_decisions:
- issue: Cách dịch κύριος trong cụm ἄγγελος κυρίου
  choice: Chúa
  alternative: Đức Chúa
  rationale: “Chúa” bảo toàn danh xưng κύριος mà không thêm một cách định danh thần học không được biểu thị rõ hơn trong chính câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thiên sứ” để chỉ hữu thể thiên giới, và “bàn thờ dâng hương” để diễn đạt rõ chức năng của bàn thờ.
