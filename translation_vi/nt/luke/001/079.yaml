  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: vi
  text: soi sáng những người đang ngồi trong bóng tối và bóng của sự chết[a], dẫn bước chân chúng ta vào con đường bình an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bóng sự chết”; một số người hiểu cụm từ này theo nghĩa rộng hơn là “bóng tối dày đặc”, nhưng tiếng Hy Lạp nêu rõ “sự chết”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: soi sáng
  rationale: Diễn đạt tự nhiên hình ảnh ánh sáng chiếu đến những người trong bóng tối, đồng thời phù hợp với động từ nguyên mẫu chỉ mục đích/kết quả trong ngữ cảnh.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: những người đang ngồi trong bóng tối
  rationale: Giữ động tác cụ thể “ngồi” của phân từ καθημένοις và âm hưởng liên văn bản, thay vì diễn giải thành “sống” hay “ở”.
- source_word: σκότει
  choice: bóng tối
  rationale: Cách dịch thông dụng, bảo toàn cả sức gợi nghĩa đen lẫn nghĩa ẩn dụ mà không giải thích quá mức.
- source_word: σκιᾷ θανάτου
  choice: bóng sự chết
  rationale: Giữ rõ danh từ θανάτου (“sự chết”) và hình ảnh thi ca của nguyên văn; cách nói này cũng bảo toàn âm hưởng Kinh Thánh.
- source_word: τοῦ κατευθῦναι
  choice: dẫn
  rationale: Diễn đạt tự nhiên hành động định hướng đối với “chân chúng ta”; cấu trúc nguyên mẫu có mạo từ tiếp tục nêu mục đích.
- source_word: τοὺς πόδας ἡμῶν
  choice: chân chúng ta
  rationale: Giữ hình ảnh thân thể cụ thể của nguyên văn thay vì khái quát thành “chúng ta”.
- source_word: εἰς ὁδὸν εἰρήνης
  choice: vào con đường bình an
  rationale: Giữ ẩn dụ con đường và sắc thái định hướng của εἰς; “bình an” là cách diễn đạt tự nhiên, rộng nghĩa, không thu hẹp thành chỉ sự yên ổn hay hòa thuận.
theological_decisions:
- issue: Giữ nguyên hay diễn giải các hình ảnh bóng tối, sự chết, chân và con đường
  choice: Giữ các hình ảnh trong bản văn chính mà không giải nghĩa chúng.
  alternative: Diễn giải thành sự ngu dốt thuộc linh, hiểm nguy chết chóc, hoặc lối sống đem lại bình an.
  rationale: Câu này mang tính thi ca và gợi nhắc Kinh Thánh. Việc giữ nguyên các hình ảnh bảo toàn độ mở và sức căng thần học của nguyên văn.
- issue: Ý nghĩa của σκιᾷ θανάτου
  choice: bóng sự chết
  alternative: bóng tối dày đặc
  rationale: Dù thành ngữ tương ứng trong nền Cựu Ước đôi khi có thể được hiểu rộng là bóng tối sâu dày, tiếng Hy Lạp tại đây nêu rõ θανάτου, nên bản dịch chính giữ “sự chết”.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ nhịp thi ca và chuỗi hình ảnh cụ thể; dùng “sự chết” thay vì “cái chết” để bảo toàn sắc thái Kinh Thánh mà vẫn rõ nghĩa.
