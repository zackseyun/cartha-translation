language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: vi
  text: Vào tháng thứ sáu[a], thiên sứ Gáp-ri-ên được sai từ Đức Chúa Trời đến một thành thuộc miền Ga-li-lê, tên là Na-xa-rét[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là tháng thứ sáu thai kỳ của Ê-li-sa-bét; xem Lu-ca 1:24, 36.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “một thành ở miền Ga-li-lê, tên là Na-xa-rét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: Đến tháng thứ sáu
  rationale: Cụm ἐν với cách tặng chỉ thời gian; trong mạch kể tiếng Việt, “Đến tháng thứ sáu” diễn đạt tự nhiên sự chuyển tiếp nhẹ của δέ mà không thêm một từ nhấn mạnh tương phản.
- source_word: ἀπεστάλη
  choice: được ... sai đến
  rationale: Giữ thể bị động của động từ ἀποστέλλω và ý nghĩa được giao phái đi, đồng thời phù hợp cú pháp tiếng Việt với đích đến theo sau.
- source_word: ὁ ἄγγελος
  choice: thiên sứ
  rationale: Trong ngữ cảnh này, ἄγγελος chỉ một sứ giả thuộc thiên giới; “thiên sứ” là cách gọi trang trọng, rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: Γαβριὴλ
  choice: Gáp-ri-ên
  rationale: Phiên âm tên riêng theo cách đọc và chính tả Kinh Thánh tiếng Việt dễ nhận biết.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: được Đức Chúa Trời sai
  rationale: Cấu trúc tiếng Việt tự nhiên nêu Đức Chúa Trời là nguồn và tác nhân của việc sai phái. Tuy ἀπό trực tiếp biểu thị nguồn xuất phát, ngữ cảnh với động từ bị động cũng hàm ý tác nhân.
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: đến một thành thuộc miền Ga-li-lê
  rationale: εἰς chỉ đích đến; sở hữu cách τῆς Γαλιλαίας được diễn đạt bằng “thuộc miền Ga-li-lê”, vừa gần cấu trúc nguồn vừa tự nhiên.
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: tên là Na-xa-rét
  rationale: Diễn đạt gọn và tự nhiên cấu trúc sát nghĩa “mà tên là Na-xa-rét”.
theological_decisions:
- issue: “Tháng thứ sáu” quy chiếu điều gì
  choice: Giữ nguyên “tháng thứ sáu” trong chính văn và giải thích bằng chú thích rằng đó là tháng thứ sáu thai kỳ của Ê-li-sa-bét.
  alternative: Hiểu là tháng thứ sáu trong năm.
  rationale: Ngữ cảnh gần ở Lu-ca 1:24, 36 xác định thai kỳ của Ê-li-sa-bét, nhưng câu Hy Lạp không lặp lại đối tượng quy chiếu; giữ cách nói nguyên văn tránh đưa lời giải thích vào chính văn.
- issue: Sắc thái của ἀπὸ τοῦ θεοῦ
  choice: Diễn đạt tự nhiên là “được Đức Chúa Trời sai”, thể hiện tác nhân sai phái.
  alternative: “được sai từ Đức Chúa Trời đến”, nhấn mạnh nguồn xuất phát.
  rationale: ἀπό về hình thức nhấn mạnh nguồn, nhưng khi đi với ἀπεστάλη, tiếng Việt tự nhiên có thể nêu Đức Chúa Trời là chủ thể sai phái mà không thay đổi nội dung sự kiện.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “thành” thay cho “thành phố” để phù hợp bối cảnh cổ đại; các địa danh và tên riêng được phiên âm có dấu, có gạch nối theo tập quán Kinh Thánh tiếng Việt.
