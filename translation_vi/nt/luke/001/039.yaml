source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: vi
  text: Trong những ngày ấy, Ma-ri đứng dậy, vội vã đi đến miền đồi núi, tới một thành thuộc Giu-đa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thị trấn thuộc Giu-đa” hoặc “một thành ở xứ Giu-đê.” Từ Hy Lạp πόλις có thể chỉ thành hoặc thị trấn, còn Ἰούδα có thể chỉ vùng Giu-đa/Giu-đê.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: đứng dậy
  rationale: Phân từ bất định quá khứ của ἀνίστημι diễn tả hành động đi trước động từ chính; “đứng dậy” giữ được trình tự kể chuyện mà không diễn giải thành “lên đường”.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ; trong tiếng Việt, mạch chuyển tiếp đã tự nhiên nhờ cụm thời gian mở đầu, nên thêm “bấy giờ” hoặc “và” sẽ nặng hay dễ gợi một sắc thái không cần thiết.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: trong những ngày ấy
  rationale: Cách dịch tự nhiên, trang trọng và giữ được sắc thái chỉ định của ταύταις.
- source_word: ἐπορεύθη
  choice: đi
  rationale: πορεύομαι ở đây chỉ việc di chuyển; “đi” là tương đương rộng, tự nhiên, không thêm ý về độ dài hành trình.
- source_word: εἰς τὴν ὀρεινὴν
  choice: đến miền đồi núi
  rationale: ὀρεινή được dùng như danh từ, chỉ vùng cao hay miền đồi núi; cách diễn đạt này rõ nghĩa với độc giả Việt Nam hiện đại.
- source_word: μετὰ σπουδῆς
  choice: vội vã
  rationale: σπουδή có thể chỉ sự sốt sắng, chuyên tâm hoặc mau lẹ; trong ngữ cảnh đi đường, “vội vã” diễn đạt tự nhiên ý khẩn trương mà không giải thích thêm động cơ.
- source_word: εἰς πόλιν Ἰούδα
  choice: tới một thành thuộc Giu-đa
  rationale: πόλις có thể là thành hoặc thị trấn; “thành” phù hợp văn phong Kinh Thánh tiếng Việt nhưng không nhất thiết hàm ý đô thị lớn. Ἰούδα được hiểu là địa danh vùng/chi phái, nên “thuộc Giu-đa” diễn đạt quan hệ tự nhiên.
theological_decisions:
- issue: Cách xác định Ἰούδα
  choice: Giu-đa như tên vùng hoặc địa hạt
  alternative: xứ Giu-đê; hoặc một thành mang tên Giu-đa
  rationale: Trong ngữ cảnh, Ἰούδα hợp lý nhất là địa danh vùng/chi phái. Giữ “Giu-đa” bám sát dạng Hy Lạp và tránh xác quyết quá mức rằng tác giả dùng tên hành chính “Giu-đê”.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ma-ri” và “Giu-đa” theo lối phiên âm quen thuộc; giữ nhịp kể chuyện ngắn gọn và không làm mất sự mơ hồ địa lý của nguyên văn.
