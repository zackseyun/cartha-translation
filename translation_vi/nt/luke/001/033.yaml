source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: vi
  text: Ngài sẽ trị vì trên nhà Gia-cốp đời đời[a], và vương quốc của Ngài sẽ không bao giờ chấm dứt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cho muôn đời” hoặc “qua mọi thời đại”. Thành ngữ Hy Lạp εἰς τοὺς αἰῶνας diễn tả thời gian không cùng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: sẽ trị vì
  rationale: Động từ tương lai chủ động diễn tả việc thực thi vương quyền; “trị vì” tự nhiên, trang trọng và giữ rõ sắc thái làm vua.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: trên nhà Gia-cốp
  rationale: ἐπί với đối cách sau βασιλεύω chỉ đối tượng thuộc quyền cai trị. “Nhà Gia-cốp” giữ nguyên cách gọi mang tính tập thể và giao ước, không diễn giải thành “dân Y-sơ-ra-ên” hay “dân Đức Chúa Trời”.
- source_word: εἰς τοὺς αἰῶνας
  choice: đời đời
  rationale: Thành ngữ Hy Lạp diễn tả thời gian không cùng; “đời đời” là cách nói tự nhiên, quen thuộc và trang trọng trong tiếng Việt.
- source_word: βασιλείας
  choice: vương quốc
  rationale: βασιλεία có thể chỉ sự trị vì hoặc vương quốc. Trong mệnh đề nói rằng nó không có điểm kết thúc, “vương quốc” tự nhiên và vẫn bảo toàn sắc thái vương quyền.
- source_word: οὐκ ἔσται τέλος
  choice: sẽ không bao giờ chấm dứt
  rationale: Cách diễn đạt này chuyển tải rõ cấu trúc phủ định ở tương lai và tự nhiên hơn trong tiếng Việt hiện đại so với lối dịch sát chữ “sẽ không có sự cuối cùng”.
theological_decisions:
- issue: Phạm vi của “nhà Gia-cốp”
  choice: Giữ nguyên “nhà Gia-cốp”, không mở rộng thành “dân Y-sơ-ra-ên” hoặc “dân Đức Chúa Trời”.
  alternative: dân Y-sơ-ra-ên; dân Đức Chúa Trời
  rationale: Cụm từ nguyên ngữ là một danh xưng truyền thống mang ý nghĩa tập thể và giao ước. Giữ nguyên giúp tránh áp đặt kết luận thần học về phạm vi của lời hứa.
- issue: Thời hạn của sự trị vì
  choice: Dịch εἰς τοὺς αἰῶνας là “đời đời” và diễn đạt vương quốc “sẽ không bao giờ chấm dứt”.
  alternative: qua các thời đại; cho đến các thời đại
  rationale: Hai vế song song nhấn mạnh sự trị vì không cùng. Bản dịch chính truyền đạt trực tiếp ý này, còn chú thích ghi nhận hình thức sát chữ của thành ngữ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh lời thiên sứ nói về Con sẽ được sinh ra; giữ “nhà Gia-cốp” như một thành ngữ Kinh Thánh có ý nghĩa tập thể. Dấu chú thích [a] xuất hiện ngay sau “đời đời”.
