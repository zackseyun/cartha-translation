id: LUK.1.32
reference: Luke 1:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: vi
  text: Người sẽ cao trọng và sẽ được gọi là Con Đấng Tối Cao[a]; Chúa là Đức Chúa Trời sẽ ban cho Người ngai của Đa-vít, tổ phụ của Người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát phần mở đầu: “Người này sẽ cao trọng.” Từ Hy Lạp οὗτος là đại từ chỉ định, nghĩa là “người này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “Đa-vít, cha Người.” Ở đây “cha” mang nghĩa tổ tiên trong dòng dõi hoàng gia.'
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Người
  rationale: Đại từ chỉ định nói về người con vừa được loan báo; “Người” tự nhiên trong tiếng Việt và giữ sắc thái tôn kính, còn nghĩa sát chữ được ghi ở chú thích.
- source_word: ἔσται μέγας
  choice: sẽ trở nên cao trọng
  rationale: Diễn đạt tự nhiên ý về địa vị và tầm vóc lớn lao, không thu hẹp μέγας vào sức mạnh thể chất.
- source_word: υἱὸς Ὑψίστου
  choice: Con Đấng Tối Cao
  rationale: Giữ nguyên tước hiệu mang ý nghĩa hoàng gia và thần học, không thêm mạo từ bất định vốn không phù hợp với cấu trúc vị ngữ này.
- source_word: κληθήσεται
  choice: sẽ được gọi là
  rationale: Thể bị động tương lai của καλέω ở đây chỉ sự xưng gọi hoặc xác nhận tước hiệu.
- source_word: κύριος ὁ θεὸς
  choice: Chúa là Đức Chúa Trời
  rationale: Phản ánh cả κύριος và ὁ θεός bằng cách diễn đạt tiếng Việt rõ ràng, trang trọng, không đồng nhất κύριος với danh YHWH ngoài điều văn bản Hy Lạp nói.
- source_word: δώσει αὐτῷ
  choice: sẽ ban cho Người
  rationale: “Ban” phù hợp với hành động của Đức Chúa Trời trong văn phong Kinh Thánh hiện đại mà vẫn tương ứng trực tiếp với δίδωμι.
- source_word: τὸν θρόνον Δαυὶδ
  choice: ngai của Đa-vít
  rationale: Giữ kết cấu sở hữu và âm hưởng của lời hứa về vương quyền Đa-vít.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: tổ phụ Người
  rationale: πατήρ có thể chỉ tổ tiên; trong tiếng Việt, “tổ phụ” truyền đạt rõ quan hệ dòng dõi xa giữa Đa-vít và Chúa Giê-xu, tránh cách hiểu sai rằng Đa-vít là cha trực tiếp.
theological_decisions:
- issue: Tước hiệu Cơ Đốc luận υἱὸς Ὑψίστου
  choice: Con Đấng Tối Cao
  alternative: một người con của Đấng Tối Cao
  rationale: Ngữ cảnh lời thiên sứ và cấu trúc vị ngữ cho thấy đây là tước hiệu; bản dịch giữ sức nặng của lời tuyên bố mà không đưa thêm thuật ngữ tín điều hậu kỳ.
- issue: Cách dịch κύριος khi chỉ Đức Chúa Trời
  choice: Chúa là Đức Chúa Trời
  alternative: CHÚA Đức Chúa Trời
  rationale: Bản Hy Lạp dùng κύριος chứ không trực tiếp ghi danh YHWH; vì vậy không dùng kiểu chữ biểu thị chắc chắn danh ấy.
- issue: Quan hệ của Đa-vít với Chúa Giê-xu
  choice: tổ phụ Người
  alternative: cha Người
  rationale: Lựa chọn này làm rõ nghĩa gia phả có sẵn trong phạm vi nghĩa của πατήρ, đồng thời vẫn giữ mối liên hệ vương triều Đa-vít.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” cho nhân vật được loan báo và “ban” trong hành động của Đức Chúa Trời. Câu được ngắt bằng dấu chấm phẩy để hai lời tiên báo liên kết rõ ràng.
