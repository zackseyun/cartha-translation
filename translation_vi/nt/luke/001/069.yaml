  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: vi
  text: Và Ngài đã dấy lên cho chúng ta một sừng cứu rỗi trong dòng dõi Đa-vít, là tôi tớ Ngài,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một Đấng Cứu Thế đầy quyền năng.” Nguyên văn là “một sừng cứu rỗi,” một hình ảnh Kinh Thánh về quyền năng đem lại sự giải cứu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: đã dấy lên
  rationale: Động từ aorist diễn tả hành động cứu độ của Đức Chúa Trời như một việc đã được thực hiện; “dấy lên” giữ được lối nói Kinh Thánh về việc Đức Chúa Trời làm xuất hiện một đấng giải cứu.
- source_word: κέρας σωτηρίας
  choice: một sừng cứu rỗi
  rationale: Giữ nguyên hình ảnh Kinh Thánh chỉ quyền năng mạnh mẽ và chiến thắng đem lại sự cứu rỗi, thay vì thu hẹp ngay thành một danh hiệu chỉ người cứu thế.
- source_word: ἡμῖν
  choice: cho chúng ta
  rationale: 'Diễn đạt cách tự nhiên sắc thái tặng cách chỉ lợi ích: hành động này được thực hiện vì lợi ích của cộng đồng đang nói.'
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: trong nhà Đa-vít
  rationale: “Nhà” chỉ dòng dõi hoặc vương triều; giữ nguyên thành ngữ giúp bảo tồn âm hưởng giao ước Đa-vít, còn “trong” phản ánh ἐν mà vẫn có thể hiểu là xuất hiện trong dòng dõi ấy.
- source_word: παιδὸς αὐτοῦ
  choice: tôi tớ Ngài
  rationale: Trong cách dùng Kinh Thánh đối với Đa-vít, παῖς mang nghĩa người tôi tớ của Đức Chúa Trời, không phải trẻ nhỏ; “Ngài” chỉ Đức Chúa Trời.
theological_decisions:
- issue: Giữ hình ảnh “sừng cứu rỗi” hay diễn giải thành “Đấng Cứu Thế đầy quyền năng”
  choice: Giữ “một sừng cứu rỗi” trong chính văn
  alternative: một Đấng Cứu Thế đầy quyền năng
  rationale: Cụm Hy Lạp dùng một ẩn dụ cụ thể bắt nguồn từ ngôn ngữ Cựu Ước về sức mạnh, vương quyền và sự giải cứu chiến thắng. Giữ ẩn dụ bảo tồn mối liên hệ văn chương và thần học, còn chú thích giúp độc giả hiện đại hiểu nghĩa.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Dấy lên” và “sừng cứu rỗi” có sắc thái Kinh Thánh có chủ ý; chú thích giải nghĩa hình ảnh khó. Dùng “Đa-vít” theo cách phiên âm quen thuộc và “Ngài” để chỉ Đức Chúa Trời.
