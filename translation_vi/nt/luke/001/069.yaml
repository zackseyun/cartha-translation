  source_fidelity: 'Bản nháp giữ đúng các yếu tố chủ đạo: động từ ἤγειρεν, ẩn dụ κέρας σωτηρίας, tặng cách ἡμῖν, và cách gọi Đa-vít là παῖς của Đức Chúa Trời. Tuy nhiên, “trong nhà Đa-vít” dễ bị hiểu là địa điểm cư trú, trong khi οἶκος ở đây chỉ dòng dõi/vương triều; cụm đồng vị “Đa-vít, tôi tớ Ngài” cũng thiếu dấu hiệu ngữ pháp để xác định rõ Đa-vít là tôi tớ của Đức Chúa Trời.'
