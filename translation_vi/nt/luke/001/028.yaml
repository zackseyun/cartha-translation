base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: vi
  text: 'Thiên sứ đi vào gặp cô và nói: “Chào cô[a], người được ban ơn[b]! Chúa ở cùng cô.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy vui mừng”; theo lối dịch truyền thống: “Kính mừng.” Từ Hy Lạp này về hình thức có nghĩa là “hãy vui mừng,” nhưng thường được dùng như một lời chào.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người rất được ơn,” “người đã được ban ân sủng”; theo lối dịch truyền thống: “đầy ơn phúc.” Từ Hy Lạp chỉ một người đã được ban ân huệ hoặc ân sủng.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: đi vào gặp cô
  rationale: Cụm này diễn tả việc đi vào và đến với Ma-ri trước khi nói. “Đi vào gặp cô” tự nhiên trong tiếng Việt, vừa giữ ý chuyển động vào trong của εἰσέρχομαι vừa thể hiện hướng đến cô của πρὸς αὐτήν.
- source_word: Χαῖρε
  choice: Chào cô
  rationale: Dù về hình thức là mệnh lệnh “hãy vui mừng,” từ này thường được dùng như một lời chào. “Chào cô” truyền đạt công dụng giao tiếp trong tiếng Việt hiện đại; nghĩa sát hình thức được giữ trong chú thích.
- source_word: κεχαριτωμένη
  choice: người được ban ơn
  rationale: Phân từ hoàn thành bị động của χαριτόω mô tả một người đã nhận được ân huệ. Cách dịch này giữ rõ sắc thái tiếp nhận, không biến ân sủng thành một phẩm chất tự có.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Danh xưng κύριος ở đây chỉ Đức Chúa Trời. “Chúa” là cách gọi trang trọng, quen thuộc và tự nhiên trong tiếng Việt Kinh Thánh.
- source_word: μετὰ σοῦ
  choice: ở cùng cô
  rationale: μετά với sở hữu cách có nghĩa là “cùng với.” Tiếng Việt cần thêm “ở” để tạo thành một mệnh đề tự nhiên và diễn tả sự hiện diện của Chúa.
theological_decisions:
- issue: Cách dịch κεχαριτωμένη trong câu có ý nghĩa thần học nhạy cảm về Ma-ri
  choice: người được ban ơn
  alternative: đầy ơn phúc; người rất được ơn; người đã được ban ân sủng
  rationale: 'Cách dịch chính theo sắc thái bị động của phân từ Hy Lạp: Ma-ri là người nhận ân huệ. Nó khẳng định mạnh mẽ ân huệ Chúa dành cho cô nhưng không đưa vào câu những kết luận tín lý vượt quá điều từ ngữ Hy Lạp trực tiếp nói. Cách dịch truyền thống “đầy ơn phúc” được ghi nhận trong chú thích.'
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Cô” phù hợp khi nói với một phụ nữ trẻ và tránh sắc thái cổ của “nàng.” Chủ ngữ “thiên sứ” được nêu lại từ ngữ cảnh trước để câu tiếng Việt đứng độc lập được rõ ràng; tiếng Hy Lạp dùng hình thức giống đực số ít ngầm chỉ vị thiên sứ.
