  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: vi
  text: Khi thấy thiên sứ[a], Xa-cha-ri bối rối, và nỗi sợ hãi ập xuống trên ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dịch sát là “thấy”; đối tượng được thấy—thiên sứ—được hiểu từ câu trước.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: bối rối
  rationale: Động từ ở đây diễn tả sự xao động, bất an trong lòng. “Bối rối” tự nhiên trong tiếng Việt và không cường điệu thành nỗi kinh hoàng, vì φόβος ngay sau đó mới trực tiếp nói đến sự sợ hãi.
- source_word: Ζαχαρίας
  choice: Xa-cha-ri
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, rõ ràng và dễ nhận biết.
- source_word: ἰδών
  choice: Khi thấy thiên sứ
  rationale: Phân từ bất định quá khứ mang sắc thái thời gian, nên dịch là “khi thấy”. Tân ngữ không được nêu trong chính câu Hy Lạp nhưng được xác định từ câu trước là thiên sứ; bổ sung danh từ giúp tiếng Việt tự nhiên và tránh đại từ mơ hồ.
- source_word: φόβος
  choice: nỗi sợ hãi
  rationale: Giữ nghĩa rộng và trực tiếp của φόβος, không tăng mức độ thành “kinh hoàng” hay “khiếp đảm”.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: ập đến trên ông
  rationale: Giữ hình ảnh đột ngột, mạnh mẽ của động từ ἐπιπίπτω với ἐπί, đồng thời diễn đạt tự nhiên hơn trong tiếng Việt so với cách dịch hoàn toàn sát chữ “rơi xuống trên ông”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc câu được sắp xếp tự nhiên theo tiếng Việt, đồng thời giữ sự phân biệt giữa trạng thái bối rối ban đầu và nỗi sợ hãi ập đến sau đó.
