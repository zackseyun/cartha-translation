  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: vi
  text: Nhưng cô vô cùng bối rối vì lời ấy[a] và cứ suy nghĩ[b] xem lời chào này là lời chào ra sao.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì lời nói ấy” hoặc “vì sứ điệp ấy.” Từ Hy Lạp λόγος có thể có nghĩa là “lời,” “điều được nói” hoặc “sứ điệp.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đang cân nhắc” hoặc “cứ tự hỏi.” Dạng động từ Hy Lạp cho thấy sự suy xét đang tiếp diễn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý nhẹ từ lời chào của thiên sứ sang phản ứng của Ma-ri.
- source_word: ἐπὶ τῷ λόγῳ
  choice: vì lời ấy
  rationale: Cụm từ chỉ điều vừa được nói; “lời ấy” tự nhiên trong tiếng Việt và vẫn giữ được phạm vi nghĩa của λόγος.
- source_word: διεταράχθη
  choice: vô cùng bối rối
  rationale: Diễn đạt trạng thái bị xáo động mạnh mà không gán cho Ma-ri sự vô tín hay lỗi đạo đức.
- source_word: διελογίζετο
  choice: cứ suy nghĩ
  rationale: Thể chưa hoàn thành diễn tả quá trình suy xét đang tiếp diễn trong nội tâm.
- source_word: ποταπὸς εἴη
  choice: có ý nghĩa gì
  rationale: Trong ngữ cảnh, diễn đạt tự nhiên việc Ma-ri cân nhắc bản chất và hàm ý của lời chào; sắc thái gián tiếp, dè dặt của εἴη được giữ trong câu hỏi suy tưởng.
- source_word: ἀσπασμὸς οὗτος
  choice: lời chào này
  rationale: Chỉ trực tiếp lời chào cụ thể thiên sứ vừa nói.
theological_decisions:
- issue: Bản chất phản ứng của Ma-ri
  choice: Ma-ri bối rối vì điều thiên sứ nói và tiếp tục suy xét ý nghĩa của lời chào.
  alternative: Ma-ri sợ vì diện mạo của thiên sứ, hoặc phản ứng của cô hàm ý sự vô tín.
  rationale: Bản Hy Lạp gắn sự bối rối với λόγος và mô tả sự suy xét nội tâm, nhưng không đưa ra phán xét thần học hay đạo đức về phản ứng ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô” vì danh xưng riêng Ma-ri không xuất hiện trong câu Hy Lạp này; tránh thêm nội dung về sự sợ hãi, vô tín hoặc diện mạo của thiên sứ.
