id: LUK.1.65
reference: Luke 1:65
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: vi
  text: Nỗi sợ hãi[b] bao trùm tất cả những người sống quanh họ, và tất cả những điều ấy[a] được bàn tán khắp miền đồi núi Giu-đê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tất cả những lời ấy” hoặc “tất cả những việc ấy”. Từ Hy Lạp có thể chỉ lời được nói ra hoặc những sự việc đang được kể lại.
    reason: lexical_alternative
  - marker: b
    text: “Sợ hãi” ở đây cũng có thể bao hàm sự kinh ngạc và kính sợ trước hoạt động rõ ràng của Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας ... φόβος
  choice: Nỗi sợ hãi bao trùm tất cả
  rationale: Diễn đạt tự nhiên trong tiếng Việt sự xuất hiện và lan đến mọi người của nỗi sợ, đồng thời giữ sắc thái biến cố của thành ngữ Hy Lạp.
- source_word: φόβος
  choice: nỗi sợ hãi
  rationale: Giữ nghĩa trực tiếp của từ Hy Lạp, không thu hẹp thành riêng sự kính sợ; trong ngữ cảnh, từ này cũng có thể hàm ý kinh ngạc, kính sợ trước hoạt động rõ ràng của Đức Chúa Trời.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: những người sống quanh họ
  rationale: Phản ánh rõ nghĩa cư ngụ ở vùng chung quanh, thay vì rút gọn thành “hàng xóm”.
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: khắp miền đồi núi Giu-đê
  rationale: “Miền đồi núi” diễn đạt tự nhiên đặc điểm địa lý của ἡ ὀρεινή, còn “khắp” thể hiện phạm vi toàn vùng.
- source_word: διελαλεῖτο
  choice: được bàn tán
  rationale: Thể chưa hoàn thành bị động chỉ việc những điều này liên tục được truyền miệng và bàn luận; cách dịch này tự nhiên và dễ hiểu trong tiếng Việt.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: tất cả những điều ấy
  rationale: “Điều” đủ rộng để chỉ cả lời nói lẫn những sự việc đang được kể lại, qua đó giữ độ mở nghĩa của ῥήματα trong văn cảnh.
theological_decisions:
- issue: Sắc thái của φόβος trước hoạt động của Đức Chúa Trời
  choice: Dịch là “nỗi sợ hãi” trong chính văn.
  alternative: “sự kính sợ” hoặc “niềm kinh sợ”
  rationale: Cách dịch trực tiếp giữ nguyên sức căng giữa sợ hãi và kính sợ, không quyết định thay người đọc rằng phản ứng này chỉ là lòng tôn kính.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc câu giữ hai vế của nguyên văn; cách dùng “bao trùm” và “được bàn tán” tránh lối dịch từng chữ cứng nhắc mà vẫn bảo toàn tiến trình và sắc thái bị động của câu Hy Lạp.
