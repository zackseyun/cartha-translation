  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: vi
  text: để chúng ta, sau khi được giải cứu khỏi tay kẻ thù[b], không sợ hãi mà phụng sự[c] Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cách không sợ hãi.”'
    reason: lexical_alternative
  - marker: b
    text: '“Khỏi tay kẻ thù” là thành ngữ, cũng có thể dịch: “khỏi quyền lực của kẻ thù.”'
    reason: lexical_alternative
  - marker: c
    text: Từ này cũng có thể dịch là “thờ phượng”, nhất là khi nói về sự phục vụ dành cho Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: mà không sợ hãi
  rationale: Diễn đạt tự nhiên nghĩa trạng từ “không sợ hãi”; vị trí cuối câu gắn rõ với việc phụng sự, đồng thời chú thích bảo lưu cách dịch cô đọng hơn.
- source_word: ἐκ χειρὸς
  choice: khỏi tay
  rationale: Giữ hình ảnh thành ngữ của nguyên văn về việc thoát khỏi quyền lực hay sự kiểm soát của kẻ thù, và vẫn dễ hiểu trong tiếng Việt.
- source_word: ἐχθρῶν
  choice: quân thù
  rationale: Chuyển danh từ số nhiều theo cách tự nhiên, trang trọng. Nguyên văn không có đại từ sở hữu, nên bản dịch không thêm “của chúng ta”; quan hệ ấy đã được ngữ cảnh cho thấy.
- source_word: ῥυσθέντας
  choice: sau khi được giải cứu
  rationale: Thể bị động và sắc thái hành động có trước của phân từ aorist được thể hiện bằng “sau khi được”, cho thấy sự giải cứu làm nền tảng cho việc phụng sự.
- source_word: λατρεύειν
  choice: phụng sự
  rationale: “Phụng sự” tự nhiên khi đối tượng là Đức Chúa Trời, đồng thời giữ được cả ý phục vụ tận hiến lẫn thờ phượng mà không thu hẹp vào nghi lễ.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Trời trong ngữ cảnh trước; “Ngài” là cách xưng gọi trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của λατρεύειν khi hướng đến Đức Chúa Trời
  choice: phụng sự Ngài
  alternative: thờ phượng Ngài
  rationale: “Phụng sự” giữ được cả sự thờ kính lẫn sự phục vụ vâng phục, thay vì giới hạn nghĩa vào hoạt động thờ phượng hay nghi lễ.
- issue: Phạm vi bổ nghĩa của ἀφόβως
  choice: gắn “mà không sợ hãi” với việc phụng sự
  alternative: “được giải cứu không còn sợ hãi”
  rationale: Cú pháp và mạch ý thuận hơn khi trạng từ mô tả cách dân Chúa phụng sự Ngài, nhưng trật tự từ Hy Lạp cho phép người đọc cảm nhận sự liên hệ gần với cả sự giải cứu; bản dịch không thêm nội dung nhằm giải quyết quá mức độ căng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quân thù” giữ sắc thái Kinh Thánh mà không cổ kính quá mức; “phụng sự” phù hợp với đối tượng thần linh và rộng nghĩa hơn “thờ phượng”. Mọi dấu chú thích đều được đặt ngay sau cụm từ liên quan.
