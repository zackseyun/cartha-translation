  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: vi
  text: Ngài đã hạ những người quyền thế khỏi các ngai và nâng những người thấp hèn lên.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người cai trị” thay cho “những người quyền thế”. Từ Hy Lạp có thể chỉ người có quyền lực nói chung, dù cụm “khỏi các ngai” nghiêng về nghĩa người cai trị.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “những người khiêm nhường” thay cho “những người thấp hèn”. Từ Hy Lạp có thể chỉ người khiêm nhường và/hoặc người có địa vị xã hội thấp.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: đã hạ
  rationale: Động từ chỉ hành động đưa từ địa vị cao xuống. “Đã hạ” tự nhiên, súc tích và giữ được tính quyết định của thì aorist mà không giới hạn vào việc phế truất bằng bạo lực.
- source_word: δυνάστας
  choice: những người quyền thế
  rationale: Danh từ có thể chỉ người cầm quyền hoặc người có quyền lực nói chung. Cụm “khỏi ngai” làm nổi bật sắc thái cai trị, nhưng “người quyền thế” giữ được phạm vi nghĩa rộng vốn có của từ Hy Lạp.
- source_word: ἀπὸ θρόνων
  choice: khỏi ngai
  rationale: Cách dịch trực tiếp, giữ nguyên hình ảnh cụ thể về ngai vị; không thêm đại từ sở hữu vốn không có trong nguyên văn.
- source_word: ὕψωσεν
  choice: nâng ... lên
  rationale: Diễn đạt tự nhiên động tác đưa lên cao, đồng thời giữ được cả sắc thái đảo ngược địa vị xã hội lẫn ý nghĩa thần học.
- source_word: ταπεινούς
  choice: những người thấp hèn
  rationale: Từ này có thể chỉ người khiêm nhường và/hoặc người có địa vị thấp. “Thấp hèn” phù hợp với sự đảo ngược địa vị trong câu, nhưng vẫn để mở sắc thái khiêm nhường.
theological_decisions:
- issue: Giá trị thời-thể của các động từ aorist trong bài ca Ma-ri
  choice: Dịch bằng “đã hạ ... và nâng ... lên”
  alternative: Có thể diễn đạt như chân lý thường xuyên hoặc nhấn mạnh kết quả còn tiếp diễn
  rationale: Tiếng Việt không có một hình thức tương ứng chính xác với hiện tại hoàn thành tiếng Anh. “Đã” thể hiện hành động quyết định được trình bày như đã hoàn tất, đồng thời không buộc người đọc phải chọn giữa cách hiểu tiên tri, tổng kết lịch sử hay lời ca ngợi về hành động chắc chắn của Đức Chúa Trời.
- issue: Sắc thái của ταπεινούς
  choice: Giữ trọng tâm địa vị xã hội qua “những người thấp hèn”
  alternative: “những người khiêm nhường”
  rationale: Ngữ cảnh tương phản với người quyền thế và ngai vị làm nổi bật địa vị thấp, nhưng nguyên ngữ cũng có thể hàm ý sự khiêm nhường; chú thích bảo tồn cả hai khả năng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc song song “đã hạ ... và nâng ... lên” giữ nhịp thơ cùng hình ảnh đảo ngược địa vị của nguyên văn. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
