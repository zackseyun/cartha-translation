  to: Khi Xa-cha-ri đang thi hành chức vụ tư tế trước mặt Đức Chúa Trời theo phiên phục vụ của ban mình, thì xảy ra việc sau đây:[a]
  rationale: Thay “làm nhiệm vụ tế lễ” bằng “thi hành chức vụ tư tế” để phản ánh đầy đủ hơn ἱερατεύειν. Thêm “phục vụ” sau “phiên” để diễn đạt rõ cơ cấu luân phiên của ban tư tế. Công thức “thì xảy ra việc sau đây” được giữ lại như một cách tiếng Việt tự nhiên để mở diễn biến tiếp theo, không thêm nội dung thực chất.
