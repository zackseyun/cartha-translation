  - severity: low
    issue: “theo phiên của ban mình” chưa nói rõ đây là phiên phục vụ.
    rationale: Thêm “phục vụ” làm rõ quan hệ giữa τάξις (trật tự/phiên được ấn định) và ἐφημερία (ban tư tế), mà vẫn tự nhiên.
