base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: vi
  text: Khi Xa-cha-ri đang thi hành chức vụ tư tế trước mặt Đức Chúa Trời theo phiên phục vụ của ban mình, thì xảy ra việc sau đây:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong khi ông thi hành chức vụ tư tế trước mặt Đức Chúa Trời theo thứ tự của ban mình, thì có việc xảy ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: thì xảy ra việc sau đây
  rationale: Cụm công thức tự sự này mở đầu một diễn biến mới; cách dịch giữ lực chuyển tiếp của δὲ và tránh lối nói cổ hoặc câu tiếng Việt thiếu tự nhiên.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: Khi Xa-cha-ri đang làm nhiệm vụ tế lễ
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ mang nghĩa thời gian; ἱερατεύω chỉ việc thực hiện chức vụ tư tế. Nêu tên Xa-cha-ri để đại từ trong tiếng Việt rõ nghĩa theo ngữ cảnh.
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: theo phiên của ban mình
  rationale: τάξις chỉ trật tự đã định, còn ἐφημερία chỉ ban tư tế đồng thời hàm ý phiên phục vụ; cách dịch này truyền đạt cả cơ cấu ban và lịch luân phiên một cách tự nhiên.
- source_word: ἔναντι τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ nguyên ý phục vụ trong sự hiện diện của Đức Chúa Trời bằng một cách diễn đạt trang trọng, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ thờ phượng về công việc của Xa-cha-ri trong đền thờ
  choice: làm nhiệm vụ tế lễ trước mặt Đức Chúa Trời theo phiên của ban mình
  alternative: thi hành chức vụ tư tế trước mặt Đức Chúa Trời theo thứ tự của ban mình
  rationale: Bản dịch giữ bối cảnh lịch sử về các ban tư tế và không đồng nhất chức vụ này với bất kỳ chức vụ giáo hội về sau nào.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Câu được sắp xếp theo cú pháp tự nhiên của tiếng Việt; dấu hai chấm cho thấy công thức Ἐγένετο dẫn vào sự việc được kể ở câu kế tiếp.
