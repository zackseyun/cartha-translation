  text: ὅρκον ὃν ὤμοσεν πρὸς Ἀβραὰμ τὸν πατέρα ἡμῶν, τοῦ δοῦναι ἡμῖν
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: vi
  text: lời thề mà Ngài đã thề với Áp-ra-ham, tổ phụ chúng ta,[a] để ban cho chúng ta
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cha chúng ta.”'
    reason: Bảo tồn cách nói thân tộc–giao ước của tiếng Hy Lạp, trong khi bản văn chính dùng cách gọi tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: ὅρκον
  choice: lời thề
  rationale: Danh từ ở đối cách tiếp nối cú pháp của câu trước và chỉ một lời thề cụ thể; tiếng Việt tự nhiên không cần thêm từ chỉ định tại đây.
- source_word: ὃν ὤμοσεν
  choice: mà Ngài đã thề
  rationale: Giữ rõ quan hệ giữa danh từ 'lời thề' và động từ cùng trường nghĩa; thì aorist được diễn đạt tự nhiên bằng 'đã'.
- source_word: πρὸς Ἀβραὰμ
  choice: với Áp-ra-ham
  rationale: Với động từ thề, πρός chỉ người mà lời thề hướng đến; 'thề với' là cách nói tự nhiên và chính xác trong tiếng Việt.
- source_word: τὸν πατέρα ἡμῶν
  choice: tổ phụ chúng ta
  rationale: '''Tổ phụ'' diễn đạt Abraham là người cha thuộc lịch sử giao ước và dòng tộc, đồng thời tự nhiên hơn ''cha chúng ta'' trong ngữ cảnh tiếng Việt; chú thích giữ nghĩa sát chữ.'
- source_word: τοῦ δοῦναι ἡμῖν
  choice: để ban cho chúng ta
  rationale: Động từ nguyên mẫu có mạo từ có thể nêu mục đích hoặc kết quả. 'Để ban cho chúng ta' giữ liên kết mở sang câu kế tiếp và phù hợp văn phong thánh ca trang trọng.
theological_decisions:
- issue: Ngôn ngữ giao ước về Áp-ra-ham
  choice: tổ phụ chúng ta
  alternative: cha chúng ta
  rationale: Bản dịch chính truyền đạt tự nhiên vai trò của Áp-ra-ham trong lịch sử giao ước mà không thêm một khẳng định giáo phái; chú thích bảo tồn cách nói nguyên văn 'cha chúng ta'.
- issue: Quan hệ của τοῦ δοῦναι với lời thề
  choice: để ban cho chúng ta
  alternative: ban cho chúng ta / đến nỗi ban cho chúng ta
  rationale: Cấu trúc Hy Lạp có thể mang sắc thái mục đích hoặc kết quả. 'Để' là cách nối tự nhiên nhưng không giải thích thêm nội dung, vốn được hoàn tất ở câu sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, phù hợp bài ca tiên tri của Xa-cha-ri. Đại từ 'Ngài' quy chiếu về Đức Chúa Trời theo mạch văn; câu được giữ ở dạng chưa trọn ý vì tiếp nối trực tiếp sang câu 74.
