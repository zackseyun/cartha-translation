  source_fidelity: 'Bản dịch chuyển đạt đúng các yếu tố của tiếng Hy Lạp: ὅρκον là “lời thề”; mệnh đề quan hệ và động từ ὤμοσεν được giữ bằng “mà Ngài đã thề”; πρός Ἀβραάμ được dịch tự nhiên là “với Áp-ra-ham”; và τοῦ δοῦναι ἡμῖν được nối mở sang câu sau bằng “để ban cho chúng ta.” Việc giữ câu chưa trọn ý phù hợp với cú pháp liên câu của nguyên văn.'
  naturalness: “Lời thề mà Ngài đã thề với Áp-ra-ham, tổ phụ chúng ta, để ban cho chúng ta” là tiếng Việt hiện đại, trang trọng và phù hợp thể văn bài ca tiên tri. Sự lặp giữa “lời thề” và “đã thề” phản ánh chủ ý liên kết từ vựng của nguyên văn mà vẫn không gượng trong văn cảnh Kinh Thánh.
  terminology: “Tổ phụ chúng ta” là cách gọi tự nhiên, chuẩn mực đối với Áp-ra-ham trong tiếng Việt Kinh Thánh, đồng thời chú thích neo [a] minh bạch cho biết cách diễn đạt sát chữ “cha chúng ta.” “Ngài” và “ban cho” giữ đúng thanh giọng tôn kính của mạch văn.
