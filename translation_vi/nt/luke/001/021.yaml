  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: vi
  text: Dân chúng đang chờ Xa-cha-ri và lấy làm lạ vì ông ở lâu trong đền thờ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói chính xác hơn: “khu thánh điện”, tức phần chính của đền thờ, không phải toàn bộ khuôn viên đền thờ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς
  choice: dân chúng
  rationale: Chỉ tập thể những người đang tụ họp bên ngoài; “dân chúng” tự nhiên trong tiếng Việt và không thêm sắc thái ồn ào của “đám đông”.
- source_word: προσδοκῶν
  choice: đang chờ
  rationale: Cấu trúc ἦν + phân từ diễn tả hành động kéo dài trong quá khứ; “đang chờ” chuyển tải rõ tính tiếp diễn.
- source_word: Ζαχαρίαν
  choice: Xa-cha-ri
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt hiện đại.
- source_word: ἐθαύμαζον
  choice: lấy làm lạ
  rationale: Diễn đạt phản ứng ngạc nhiên kéo dài mà không cường điệu thành kinh ngạc tột độ hay làm yếu thành chỉ thắc mắc.
- source_word: ἐν τῷ χρονίζειν
  choice: vì ông ở lâu
  rationale: Động từ χρονίζω nói đến việc kéo dài thời gian hay chậm trễ; trong ngữ cảnh, “ở lâu” tự nhiên hơn “trì hoãn” và không ngụ ý ông cố ý chậm trễ.
- source_word: ναῷ
  choice: đền thờ
  rationale: Cách gọi phổ thông, dễ hiểu; ở đây ναός chính xác hơn là khu thánh điện bên trong, nên nét nghĩa này được nêu trong chú thích.
- source_word: αὐτόν
  choice: ông
  rationale: Đại từ đối cách là chủ thể logic của động từ nguyên mẫu χρονίζειν; tiếng Việt dùng “ông” làm chủ ngữ của mệnh đề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hai hành động tiếp diễn trong bối cảnh quá khứ bằng “đang chờ” và cách diễn đạt phản ứng “lấy làm lạ”. Dấu chú thích [a] được đặt sau tên Xa-cha-ri theo lớp tham khảo, dù nội dung chú thích làm rõ từ “đền thờ” ở cuối câu.
