id: LUK.16.15
reference: Luke 16:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: vi
  text: 'Ngài nói với họ: “Chính các ông là những người tự xưng mình là công chính trước mặt người ta, nhưng Đức Chúa Trời biết lòng các ông. Vì điều được người ta tôn cao[a] lại là điều ghê tởm trước mặt Đức Chúa Trời[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều được người ta coi trọng.”'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “một điều ghê tởm trước mặt Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: tự cho mình là công chính
  rationale: Diễn đạt tự nhiên ý tự trình bày hoặc tự xác nhận mình là công chính trước người khác, đồng thời giữ liên hệ ngữ nghĩa với δικαιόω mà không hàm ý họ thực sự được Đức Chúa Trời tuyên xưng công chính.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: trước mặt người ta
  rationale: Giữ hình ảnh 'trước mặt/trong tầm nhìn của' và truyền đạt nghĩa khái quát của ἀνθρώπων bằng cách nói tiếng Việt tự nhiên, không giới hạn ở nam giới.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: biết lòng các ông
  rationale: Giữ ẩn dụ Kinh Thánh về 'lòng' như nội tâm, động cơ và ý nghĩ; đại từ 'các ông' phù hợp với lời trực tiếp quở trách nhóm người Pha-ri-si trong ngữ cảnh.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: điều được người ta tôn cao
  rationale: Bảo toàn ẩn dụ về sự cao trọng và sắc thái xã hội của cụm từ, thay vì thu hẹp nghĩa chỉ còn 'được coi trọng'.
- source_word: βδέλυγμα
  choice: điều ghê tởm
  rationale: Truyền đạt sức nặng của điều bị Đức Chúa Trời ghét bỏ bằng ngôn ngữ hiện đại, trang trọng; phương án mạnh và truyền thống hơn được ghi ở chú thích.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ cấu trúc song song và sự tương phản giữa đánh giá của con người với đánh giá của Đức Chúa Trời.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: Chính các ông là những người ...
  rationale: Từ 'Chính' thể hiện sự nhấn mạnh của Ὑμεῖς và cấu trúc đại từ cộng mạo từ-phân từ.
theological_decisions:
- issue: Ý nghĩa của hành động tự xưng công chính
  choice: tự cho mình là công chính
  alternative: tự biện minh cho mình
  rationale: Trong ngữ cảnh, lời quở trách nhắm vào việc phô bày địa vị công chính trước con người, trong khi Đức Chúa Trời biết nội tâm. Cách dịch không quyết định vượt quá văn bản rằng đây chỉ là biện hộ thông thường hay một tuyên bố pháp lý đầy đủ.
- issue: Phạm vi của ἀνθρώπων
  choice: người ta
  alternative: loài người
  rationale: Danh từ Hy Lạp chỉ con người nói chung. 'Người ta' vừa bao quát vừa tự nhiên trong tiếng Việt và làm rõ sự tương phản giữa chuẩn mực xã hội với cái nhìn của Đức Chúa Trời.
- issue: Sắc thái của τὸ ... ὑψηλὸν
  choice: điều được người ta tôn cao
  alternative: điều được người ta coi trọng
  rationale: Giữ sự mơ hồ chân thực giữa địa vị được nâng cao, sự ngưỡng mộ xã hội và giá trị được đề cao; chú thích nêu cách hiểu thiên về sự đánh giá.
- issue: Mức độ mạnh của βδέλυγμα
  choice: điều ghê tởm
  alternative: điều đáng ghê tởm
  rationale: Danh từ Hy Lạp mô tả chính sự vật là một điều ghê tởm trước Đức Chúa Trời. Cách dịch giữ sức mạnh phán xét mà không thêm hệ thống thần học riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể đã được xác định trong ngữ cảnh; “các ông” giữ sắc thái quở trách trực tiếp. Hai lần “trước mặt” được duy trì để làm nổi bật phép đối chiếu giữa cái nhìn của con người và của Đức Chúa Trời.
