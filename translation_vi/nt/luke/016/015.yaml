    rationale: δικαιοῦντες ἑαυτούς, nhất là khi đi với “trước mặt người ta”, mô tả hành vi tự trình bày/tự tuyên nhận mình là công chính trước người khác. “Tự xưng mình là công chính” bảo toàn rõ hơn chiều kích công khai này.
  - severity: low
