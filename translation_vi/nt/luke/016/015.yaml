revisions:
- from: 'Ngài nói với họ: “Chính các ông là những người tự cho mình là công chính trước mặt người ta, nhưng Đức Chúa Trời biết lòng các ông. Vì điều được người ta tôn cao[a] lại là điều ghê tởm trước mặt Đức Chúa Trời[b].”'
  to: 'Ngài nói với họ: “Chính các ông là những người tự xưng mình là công chính trước mặt người ta, nhưng Đức Chúa Trời biết lòng các ông. Vì điều được người ta tôn cao[a] lại là điều ghê tởm trước mặt Đức Chúa Trời[b].”'
  rationale: Sửa “tự cho mình là công chính” thành “tự xưng mình là công chính” để phản ánh chính xác hơn việc tự tuyên nhận mình là công chính trước mắt người khác, vốn là trọng tâm của δικαιοῦντες ἑαυτούς ἐνώπιον τῶν ἀνθρώπων. Điều chỉnh chú thích b cho sát với danh từ βδέλυγμα. Các phần còn lại được giữ nguyên vì đã trung thành với nguyên ngữ và tự nhiên trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
