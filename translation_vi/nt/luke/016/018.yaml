source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: vi
  text: Bất cứ ai ly dị vợ mình rồi cưới một phụ nữ khác thì phạm tội ngoại tình; và ai cưới một phụ nữ đã bị chồng ly dị[a] thì phạm tội ngoại tình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo sát tiếng Hy Lạp: “một người nữ đã bị ly dị khỏi một người chồng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Bất cứ ai
  rationale: Cấu trúc có mạo từ với πᾶς diễn tả một nhận định khái quát, áp dụng cho mọi người thuộc trường hợp được nêu.
- source_word: ἀπολύων
  choice: ly dị
  rationale: Trong ngữ cảnh hôn nhân, ἀπολύω mang nghĩa pháp lý–quan hệ là chấm dứt hôn nhân, không chỉ đơn thuần là “đuổi đi”.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: vợ mình
  rationale: γυνή ở đây rõ ràng có nghĩa là “vợ”; “mình” quy chiếu tự nhiên về chủ thể của mệnh đề trong tiếng Việt.
- source_word: γαμῶν ἑτέραν
  choice: cưới người khác
  rationale: ἑτέραν chỉ một người nữ khác; tiếng Việt có thể diễn đạt tự nhiên và đầy đủ bằng “người khác” sau động từ “cưới”.
- source_word: μοιχεύει
  choice: phạm tội ngoại tình
  rationale: Diễn đạt rõ hành vi μοιχεύω bằng cách nói trang trọng, quen thuộc trong tiếng Việt; “phạm tội” cũng giữ sắc thái luân lý của lời tuyên bố.
- source_word: ἀπολελυμένην
  choice: một phụ nữ đã bị ... ly dị
  rationale: Dạng phân từ hoàn thành thụ động chỉ người phụ nữ đang ở trong tình trạng đã bị ly dị; cấu trúc “đã bị” bảo toàn cả tính hoàn thành lẫn thể thụ động.
- source_word: ἀπὸ ἀνδρός
  choice: bị chồng ly dị
  rationale: ἀνήρ trong ngữ cảnh này là “chồng”. Cụm Hy Lạp theo sát chữ là “đã bị ly dị khỏi một người chồng”; tiếng Việt tự nhiên cần diễn đạt tác nhân là người chồng, nhưng chú thích bảo lưu cấu trúc nguồn.
theological_decisions:
- issue: Phạm vi và sức nặng của lời dạy về ly dị
  choice: Trình bày như một lời tuyên bố luân lý phổ quát, không thêm ngoại lệ.
  alternative: Bổ sung một ngoại lệ dựa trên các phân đoạn khác, hoặc giới hạn lời này vào một loại ly dị bất hợp pháp cụ thể.
  rationale: Bản văn Lu-ca không nêu ngoại lệ. Bản dịch phải giữ nguyên lời văn cô đọng và sự căng thẳng thần học của câu này, thay vì hòa hợp ngầm với một phân đoạn khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ly dị” là cách nói thông dụng trong tiếng Việt hiện nay; giữ hai vế song song và không thêm điều kiện hay ngoại lệ không có trong bản văn Hy Lạp.
