id: LUK.16.8
reference: Luke 16:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: vi
  text: Ông chủ khen người quản gia bất chính vì người ấy đã hành động khôn khéo. Vì trong cách đối xử với người cùng thời của mình, con cái đời này khôn khéo hơn con cái ánh sáng.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa khen người quản gia bất chính.” Tuy nhiên, trong ngữ cảnh gần, “ông chủ” tự nhiên hơn vì chỉ người chủ trong dụ ngôn.'
    reason: alternative_reading
  - marker: b
    text: 'Sát nghĩa hơn: “Vì con cái đời này khôn khéo hơn con cái ánh sáng đối với thế hệ của chính mình.” Cụm từ Hy Lạp ở cuối câu khó hiểu; bản dịch chính diễn đạt ý họ khôn khéo khi giao tiếp với những người cùng thời hoặc cùng nhóm của mình.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: ông chủ
  rationale: Trong mạch truyện của dụ ngôn, từ này tự nhiên nhất chỉ người chủ giàu có của viên quản gia; cách dịch này không buộc người đọc hiểu đây là tước hiệu trực tiếp dành cho Chúa Giê-su hay Đức Chúa Trời.
- source_word: τὸν οἰκονόμον τῆς ἀδικίας
  choice: người quản gia bất chính
  rationale: “Quản gia” là cách gọi hiện đại, rõ nghĩa cho người trông coi tài sản; “bất chính” giữ nguyên sự đánh giá đạo đức của ἀδικία mà không thu hẹp nó chỉ vào một hình thức gian dối cụ thể.
- source_word: φρονίμως / φρονιμώτεροι
  choice: khôn khéo / khôn khéo hơn
  rationale: Cụm từ diễn tả sự sắc sảo thực tiễn nhằm đạt mục đích. “Khôn khéo” giữ được lời khen về tài xoay xở nhưng không nhất thiết hàm ý hành vi ấy đúng về đạo đức.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: con cái đời này
  rationale: Giữ hình ảnh kiểu Sê-mít “con cái của…” và diễn đạt αἰών là “đời,” tức thời đại hiện tại, thay vì đồng nhất đơn giản với thế giới vật chất.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: con cái ánh sáng
  rationale: Giữ nguyên hình ảnh Kinh Thánh và thế đối xứng với “con cái đời này,” chỉ những người gắn với ánh sáng của Đức Chúa Trời.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: trong cách đối xử với người cùng thời của mình
  rationale: Cụm Hy Lạp khó xác định chính xác. Cách dịch này thể hiện ý hành xử trong phạm vi những người cùng thế hệ mà vẫn ghi nhận cách dịch sát hơn trong chú thích.
theological_decisions:
- issue: Danh tính của ὁ κύριος trong mệnh đề đầu
  choice: ông chủ trong dụ ngôn
  alternative: Chúa
  rationale: Ngữ cảnh gần nhất nói về người giàu có và viên quản gia của ông. Dịch “ông chủ” giữ lời khen trong bình diện câu chuyện mà không loại bỏ hoàn toàn khả năng một số người hiểu κύριος là “Chúa”; phương án ấy được nêu trong chú thích.
- issue: Sự đánh giá đạo đức đối với hành động của viên quản gia
  choice: khen sự khôn khéo, không đồng nghĩa tán thành sự bất chính
  alternative: khen hành động như một việc khôn ngoan và đúng đắn về đạo đức
  rationale: Bản văn đồng thời gọi người này là “bất chính” và nói anh ta hành động φρονίμως. “Khôn khéo” bảo toàn chính sự căng thẳng đó, không biến lời khen về tài xoay xở thành sự tán thành điều sai trái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ các hình ảnh “con cái đời này” và “con cái ánh sáng,” đồng thời dùng “khôn khéo” nhất quán để bảo toàn sự đối chiếu trong nguyên văn và tránh hàm ý tán thành về mặt đạo đức.
