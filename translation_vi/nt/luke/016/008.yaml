  verdict: revise
  source_fidelity: 'Bản chính chuyển tải đúng cấu trúc và ý chính của SBLGNT: «ông chủ» là nhân vật chủ trong dụ ngôn; «bất chính» giữ đánh giá đạo đức của τῆς ἀδικίας; và «khôn khéo» phù hợp với cả φρονίμως lẫn φρονιμώτεροι mà không biến lời khen thành sự tán thành về đạo đức. Cách giải nghĩa cụm εἰς τὴν γενεὰν τὴν ἑαυτῶν là phạm vi quan hệ với những người thuộc thế hệ/nhóm của họ là có thể chấp nhận được, đồng thời chú thích cần giữ tính bất định của cụm khó này.'
  naturalness: Văn bản nhìn chung tự nhiên, hiện đại và giữ được đối xứng giữa «con cái đời này» và «con cái ánh sáng». «Trong cách đối xử với người cùng thời của mình» là một cách làm rõ hợp lý, dù có thêm sắc thái quan hệ; chú thích sát nghĩa giúp không che lấp độ khó của nguyên văn.
  terminology: «Người quản gia bất chính», «ông chủ», «khôn khéo», «con cái đời này» và «con cái ánh sáng» đều nhất quán và phù hợp. Tuy nhiên, «cùng giới» trong chú thích tiếng Việt thường được hiểu là cùng giới tính, không thể dùng để diễn đạt khả năng «người cùng loại/nhóm»; cần sửa để tránh sai nghĩa.
