  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: vi
  text: 'Sau khi gọi từng con nợ của chủ mình[a] đến, ông nói với người thứ nhất: “Ông nợ chủ tôi bao nhiêu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp κύριος thường có thể dịch là “Chúa”, nhưng ở đây chỉ người chủ trần thế của viên quản gia, nên dịch là “chủ” phù hợp với ngữ cảnh hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: gọi ... đến
  rationale: Động tính từ bất định trung cách diễn tả hành động xảy ra trước động từ chính; “gọi ... đến” tự nhiên trong tiếng Việt và giữ được ý gọi họ đến gặp mình.
- source_word: ἕνα ἕκαστον
  choice: từng
  rationale: Cụm từ có sắc thái phân phối nhấn mạnh; “từng” diễn đạt gọn và tự nhiên ý mỗi người riêng rẽ.
- source_word: χρεοφειλετῶν
  choice: con nợ
  rationale: Danh từ chỉ những người mắc nợ; “con nợ” rõ nghĩa và phù hợp bối cảnh giao dịch tài chính.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: của chủ mình
  rationale: κύριος ở đây chỉ người chủ trần thế của viên quản gia, còn ἑαυτοῦ quy chiếu về viên quản gia; “chủ mình” giữ đúng quan hệ ấy.
- source_word: ἔλεγεν
  choice: hỏi
  rationale: Nội dung lời nói là một câu hỏi. Tiếng Việt tự nhiên dùng “hỏi”; trong ngữ cảnh gọi từng người đến, cấu trúc vẫn cho thấy hành động được lặp lại mà không cần diễn đạt nặng nề thể chưa hoàn thành.
- source_word: τῷ πρώτῳ
  choice: người thứ nhất
  rationale: Diễn đạt trực tiếp thứ tự của người đầu tiên được hỏi.
- source_word: Πόσον
  choice: bao nhiêu
  rationale: Trong bối cảnh khoản nợ, từ này hỏi về số lượng hay mức nợ; “bao nhiêu” là cách nói tự nhiên nhất.
- source_word: ὀφείλεις
  choice: nợ
  rationale: Động từ ở ngữ cảnh tài chính có nghĩa trực tiếp là mắc nợ; “nợ” ngắn gọn và chính xác.
- source_word: τῷ κυρίῳ μου
  choice: chủ tôi
  rationale: 'κύριος chỉ người chủ trần thế của viên quản gia, và μου giữ góc nhìn của ông ta: “chủ tôi”.'
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh kinh tế-gia chủ của dụ ngôn
  choice: chủ
  alternative: Chúa
  rationale: Trong câu này, κύριος chỉ cấp trên trần thế của viên quản gia chứ không phải một danh hiệu thần linh. “Chủ” diễn đạt đúng quan hệ xã hội và tránh gợi một cách sai lệch rằng đây là lời trực tiếp nói về Đức Chúa Trời.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo mạch kể về viên quản gia; “anh” là đại từ đối thoại trung tính trong bối cảnh giao dịch. Dấu [a] được đặt ngay sau cụm từ liên quan.
