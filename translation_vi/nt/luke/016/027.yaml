id: LUK.16.27
reference: Luke 16:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: vi
  text: 'Ông nói: “Vậy, thưa cha, con xin cha sai La-xa-rơ đến nhà cha con.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con nài xin cha.” Động từ Hy Lạp có thể diễn tả một lời thỉnh cầu tha thiết, nhưng nghĩa cơ bản là “xin” hoặc “yêu cầu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: Ông nói
  rationale: δέ là liên từ nhẹ tiếp nối diễn tiến; trong tiếng Việt, không cần dịch riêng khi “vậy” ngay sau đó đã thể hiện mạch nối với lời từ chối trước.
- source_word: Ἐρωτῶ σε οὖν
  choice: Vậy, thưa cha, con xin cha
  rationale: ἐρωτάω mang nghĩa hỏi hoặc thỉnh cầu; trong ngữ cảnh này, “xin” diễn đạt tự nhiên lời thỉnh cầu khẩn thiết mà không cường điệu thành “van xin”. οὖν được thể hiện bằng “vậy”.
- source_word: πάτερ
  choice: thưa cha … con
  rationale: Cặp xưng hô “cha–con” tự nhiên trong tiếng Việt và cho thấy đây là lời thưa với Áp-ra-ham như tổ phụ, không hàm ý người nói đang trực tiếp gọi Đức Chúa Trời.
- source_word: ἵνα πέμψῃς αὐτὸν
  choice: sai La-xa-rơ
  rationale: Sau động từ thỉnh cầu, ἵνα với giả định thức nêu nội dung lời xin. Tiếng Việt lược đại từ chủ ngữ và dùng “sai” tự nhiên. Dùng tên “La-xa-rơ” thay cho “ông ấy” để tránh nhập nhằng do tiếng Việt không có đại từ giống đực tương ứng hoàn toàn.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: đến nhà cha con
  rationale: οἶκος ở đây chỉ ngôi nhà hoặc gia đình; “đến nhà cha con” vừa tự nhiên vừa giữ hình ảnh cụ thể của nguyên văn.
theological_decisions:
- issue: Cách hiểu hô cách πάτερ
  choice: thưa cha … con
  alternative: lạy Cha
  rationale: Người giàu đang thưa với Áp-ra-ham như tổ phụ trong câu chuyện. “Lạy Cha” dễ khiến độc giả hiểu sai là đang trực tiếp thưa với Đức Chúa Trời.
- issue: Đối tượng của αὐτόν
  choice: La-xa-rơ
  alternative: ông ấy / người ấy
  rationale: Đại từ chỉ về La-xa-rơ trong văn cảnh trước. Nêu tên làm rõ sở chỉ mà không thêm một nhân vật hay một khẳng định thần học nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cách xưng hô “thưa cha, con xin cha” phù hợp lời nói trực tiếp trong bối cảnh gia tộc; tránh viết hoa “Cha” để không gợi cách xưng hô trực tiếp với Đức Chúa Trời.
