  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: vi
  text: 'Người ấy đáp: “Một trăm ba-tơ[a] dầu ô-liu.” Quản gia bảo ông: “Hãy lấy giấy nợ[b] của ông, ngồi xuống ngay rồi viết năm mươi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ba-tơ là một đơn vị đo chất lỏng thời cổ. Nguyên văn Hy Lạp là “một trăm ba-tơ dầu ô-liu”.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “văn tự”, “khế ước” hoặc “giấy tờ”. Nguyên văn Hy Lạp là “các văn bản của ông”; trong bối cảnh này, cụm từ chỉ giấy tờ ghi khoản nợ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: ba-tơ
  rationale: Giữ tên đơn vị đo chất lỏng cụ thể thời cổ, được phiên âm sang tiếng Việt; chú thích giải thích để người đọc hiện đại hiểu.
- source_word: ἐλαίου
  choice: dầu ô-liu
  rationale: Trong bối cảnh này, ἔλαιον chỉ dầu ô-liu; cách dịch này rõ nghĩa hơn từ chung chung “dầu”.
- source_word: Δέξαι
  choice: Hãy lấy
  rationale: Mệnh lệnh này yêu cầu người mắc nợ cầm lấy văn kiện để sửa số nợ; “hãy lấy” tự nhiên và sát hành động.
- source_word: τὰ γράμματα
  choice: giấy nợ
  rationale: Nghĩa đen là “các văn bản/giấy tờ”, nhưng trong bối cảnh mắc nợ, cụm từ chỉ chứng từ ghi khoản nợ. “Giấy nợ” ngắn gọn và tự nhiên; chú thích bảo lưu phạm vi nghĩa rộng hơn của nguyên ngữ.
- source_word: καθίσας
  choice: ngồi xuống
  rationale: Phân từ diễn tả hành động đi kèm mệnh lệnh γράψον, nên được chuyển tự nhiên thành một mệnh lệnh phối hợp.
- source_word: ταχέως
  choice: mau
  rationale: Diễn đạt trực tiếp ý làm nhanh và hợp với lời sai bảo trong văn kể chuyện.
- source_word: γράψον
  choice: viết
  rationale: Giữ động từ trực tiếp của nguyên ngữ, chỉ việc ghi con số đã sửa vào chứng từ.
- source_word: πεντήκοντα
  choice: năm mươi
  rationale: Chuyển đúng số từ, không thêm diễn giải.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “quản gia” để làm rõ người nói theo ngữ cảnh gần, vì tiếng Hy Lạp chỉ dùng đại từ; dùng “ông” phù hợp lời giao dịch mà không quá cổ kính. Phiên âm “ba-tơ” bảo tồn đơn vị cổ, kèm chú thích văn hóa.
