  to: 'Người ấy đáp: “Một trăm ba-tơ[a] dầu ô-liu.” Quản gia bảo ông: “Hãy lấy giấy nợ[b] của ông, ngồi xuống ngay rồi viết năm mươi.”'
  rationale: Chỉ điều chỉnh trật tự diễn đạt ở mệnh lệnh cuối để “ngay” diễn tả tự nhiên tính khẩn trương của ταχέως. Giữ nguyên các lựa chọn thuật ngữ, số lượng, cách làm rõ “quản gia”, và toàn bộ nội dung chú thích; không thay đổi nghĩa của câu.
