    issue: Vị trí của “mau” trong mệnh lệnh cuối.
    rationale: ταχέως đứng giữa καθίσας và γράψον, và có thể chi phối hành động khẩn trương nói chung. “Ngồi xuống và mau viết” thiên về chỉ việc viết mau; “ngồi xuống ngay rồi viết” tự nhiên hơn và giữ được sắc thái gấp rút mà không quyết định quá mức phạm vi cú pháp.
