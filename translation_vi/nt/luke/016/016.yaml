  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: vi
  text: Thời kỳ Luật pháp và các Tiên tri kéo dài cho đến Giăng; từ đó, vương quốc Đức Chúa Trời được loan báo là tin mừng, và mọi người đều cố sức tiến vào đó.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi người đều dồn sức tiến vào đó.” Động từ Hy Lạp có thể diễn tả sự vận động mạnh mẽ hoặc dùng sức; cách dịch trong câu chính nhấn mạnh sự khẩn thiết khi tiến vào vương quốc.'
    reason: lexical_alternative
  - marker: b
    text: Một số người hiểu mệnh đề cuối theo nghĩa tiêu cực hơn, nhất là khi so với một lời tương tự trong Ma-thi-ơ 11:12. Tuy nhiên, trong câu này, chủ ngữ Hy Lạp là “mọi người”, chứ không phải “vương quốc”.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: Luật pháp
  rationale: Chỉ Luật pháp Môi-se như một phần được thừa nhận của Kinh Thánh Do Thái, song hành với “các sách Tiên tri”.
- source_word: οἱ προφῆται
  choice: các sách Tiên tri
  rationale: Trong cặp “Luật pháp và các Tiên tri”, cụm này chỉ phần Kinh Thánh mang tên Các Tiên tri; thêm “các sách” giúp người đọc tiếng Việt không hiểu đơn thuần là những cá nhân tiên tri.
- source_word: μέχρι Ἰωάννου
  choice: kéo dài cho đến thời Giăng
  rationale: Diễn đạt tự nhiên ranh giới thời gian của mệnh đề danh từ Hy Lạp; “thời Giăng” làm rõ ý thời kỳ mà không thêm một mốc chính xác hơn nguồn văn.
- source_word: ἀπὸ τότε
  choice: từ đó
  rationale: Cách nói gọn, tự nhiên, giữ sự chuyển tiếp thời gian và sắc thái tiếp diễn từ mốc Giăng.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Giữ được phạm vi nghĩa vừa cụ thể vừa năng động của βασιλεία, đồng thời dùng thuật ngữ trang trọng, quen thuộc trong tiếng Việt.
- source_word: εὐαγγελίζεται
  choice: được rao truyền như tin mừng
  rationale: Giữ thể bị động và nội hàm “tin mừng” của động từ εὐαγγελίζω, thay vì chỉ nói chung là “được rao giảng”.
- source_word: πᾶς
  choice: ai nấy đều
  rationale: 'Phản ánh lực phân phối của dạng số ít: từng người, hay mọi người nói chung.'
- source_word: εἰς αὐτὴν
  choice: tiến vào đó
  rationale: Đại từ quy chiếu về vương quốc; động từ “tiến vào” diễn đạt hướng chuyển động của εἰς một cách tự nhiên.
- source_word: βιάζεται
  choice: cố sức tiến vào
  rationale: Giữ ý chuyển động mạnh mẽ, đầy nỗ lực của động từ khó này mà không hàm ý con người có thể tự mình lập công để đạt được vương quốc.
theological_decisions:
- issue: Ý nghĩa của βιάζεται trong quan hệ với vương quốc
  choice: Mệnh đề mô tả mọi người cố sức tiến vào vương quốc.
  alternative: Mệnh đề có thể được hiểu theo sắc thái tiêu cực hơn, liên hệ với việc vương quốc chịu bạo lực hoặc người ta dùng sức mạnh đối với vương quốc.
  rationale: Trong câu Lu-ca này, chủ ngữ ngữ pháp là πᾶς (“ai nấy”), còn εἰς αὐτὴν biểu thị hướng vào vương quốc. Bản dịch theo cú pháp đó nhưng ghi chú tính đa nghĩa, không biến nỗ lực mạnh mẽ thành giáo lý về công trạng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Giăng” và “Đức Chúa Trời” theo lối gọi quen thuộc trong truyền thống Kinh Thánh tiếng Việt; cấu trúc câu giữ hai vế và sự căng thẳng của nguyên văn, không giải thích thần học quá mức.
