revisions:
- from: Luật pháp và các sách Tiên tri kéo dài cho đến thời Giăng; từ đó, vương quốc Đức Chúa Trời được rao truyền như tin mừng, và ai nấy đều cố sức tiến vào đó.[a][b]
  to: Thời kỳ Luật pháp và các Tiên tri kéo dài cho đến Giăng; từ đó, vương quốc Đức Chúa Trời được loan báo là tin mừng, và mọi người đều cố sức tiến vào đó.[a][b]
  rationale: Bản sửa thay cách diễn đạt không tự nhiên ở mệnh đề đầu bằng “Thời kỳ ... kéo dài,” một cách tái hiện an toàn mệnh đề tỉnh lược và ranh giới thời gian trong nguyên văn. “được loan báo là tin mừng” giữ nghĩa bị động, hiện tại của εὐαγγελίζεται bằng tiếng Việt tự nhiên hơn. Câu cuối và hai chú thích tiếp tục bảo tồn sắc thái tranh luận của βιάζεται mà không giải quyết theo một lập trường giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:23Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp phản ánh đúng cấu trúc chuyển tiếp χρον học của câu và hiểu hợp lý πᾶς εἰς αὐτὴν βιάζεται là mọi người mạnh mẽ tiến vào vương quốc. Tuy nhiên, “Luật pháp và các sách Tiên tri kéo dài” gán trực tiếp động từ thời lượng cho các sách, gây lệch cách diễn đạt của mệnh đề danh từ Hy Lạp. “được rao truyền như tin mừng” cũng hơi calque; εὐαγγελίζεται tự nó đã có nghĩa “được loan báo/công bố như tin mừng.”
  naturalness: Cần chỉnh câu đầu cho tự nhiên trong tiếng Việt hiện đại và thay “rao truyền như tin mừng” bằng cách nói lưu loát hơn. “Mọi người đều cố sức tiến vào đó” giữ được sắc thái mạnh mẽ nhưng không áp đặt một cách giải nghĩa thần học.
  terminology: “Luật pháp,” “các Tiên tri,” “Giăng,” và “vương quốc Đức Chúa Trời” phù hợp với đăng ký Kinh Thánh tiếng Việt. Bỏ “các sách” giúp giữ cụm đôi truyền thống “Luật pháp và các Tiên tri” gần nguyên ngữ hơn; ngữ cảnh vẫn cho thấy đây là danh xưng Kinh Thánh.
