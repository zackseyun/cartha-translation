  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: vi
  text: và mong được ăn no từ những gì đang rơi từ bàn của người giàu xuống.[a] Nhưng ngay cả chó cũng đến liếm các vết lở của ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ những mẩu thức ăn rơi từ bàn của người giàu xuống.” Nguyên văn Hy Lạp là “từ những gì đang rơi”; “mẩu thức ăn” được suy ra từ bối cảnh bữa ăn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: mong
  rationale: Phân từ hiện tại diễn tả ước muốn kéo dài; “mong” tự nhiên trong tiếng Việt và vẫn cho thấy La-xa-rơ khao khát được ăn.
- source_word: χορτασθῆναι
  choice: được ăn no
  rationale: Động từ nguyên mẫu thụ động chỉ việc nhận đủ thức ăn; “được ăn no” giữ sắc thái thụ động và phù hợp ngữ cảnh hơn cách nói trừu tượng “được thỏa mãn”.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: bằng những gì ... rơi xuống
  rationale: Phân từ có mạo từ được dùng như danh từ. Cách dịch này không tự ý thêm “vụn thức ăn”, dù điều đó được ngữ cảnh bữa ăn gợi ra.
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: từ bàn của người giàu
  rationale: Dịch trực tiếp hình ảnh bàn ăn và tính từ được danh từ hóa chỉ người giàu đã nhắc đến trong câu chuyện.
- source_word: ἀλλὰ καὶ
  choice: Thế mà ngay cả
  rationale: Diễn đạt cả sắc thái tương phản lẫn yếu tố tăng tiến đáng chú ý của cụm Hy Lạp.
- source_word: οἱ κύνες
  choice: chó
  rationale: Giữ nguyên danh từ số nhiều theo nghĩa đen, không làm nhẹ hình ảnh.
- source_word: ἐρχόμενοι ἐπέλειχον
  choice: cũng đến liếm
  rationale: Diễn đạt tự nhiên quan hệ giữa phân từ “đến” và động từ chính. Trong tiếng Việt, ngữ cảnh kể chuyện cho phép “liếm” bao hàm hành động diễn tiến hoặc lặp lại mà không cần thêm từ nặng nề.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: các vết lở của ông
  rationale: ἕλκη chỉ các chỗ loét/lở; “vết lở” chính xác, dễ hiểu và ít mang tính thuật ngữ y khoa hơn “vết loét”.
