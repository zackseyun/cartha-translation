  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: vi
  text: 'Ông cho gọi anh ta rồi nói: “Tôi nghe chuyện gì về anh vậy? Hãy khai trình[a] về việc quản lý của anh, vì anh không còn có thể quản lý nữa.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy trình bản tường trình về việc quản lý của anh” hoặc “Hãy nộp bản quyết toán về việc quản lý của anh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “vì anh không thể tiếp tục làm quản gia nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: gọi người ấy đến
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và thể hiện ý triệu gọi người quản gia đến.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Chuyện gì về anh mà tôi nghe thế này?
  rationale: Giữ hình thức câu hỏi mang tính chất chất vấn và sắc thái ngạc nhiên của τί τοῦτο, đồng thời diễn đạt περὶ σοῦ tự nhiên là “về anh”.
- source_word: ἀπόδος τὸν λόγον
  choice: Hãy trình sổ sách
  rationale: Trong bối cảnh quản lý tài sản, λόγος chỉ bản kê khai hay phần sổ sách phải được giao để kiểm tra. “Trình sổ sách” vừa dễ hiểu vừa truyền đạt yêu cầu phải quyết toán, không dịch λόγος theo nghĩa thông thường là “lời”.
- source_word: τῆς οἰκονομίας σου
  choice: về việc quản lý của anh
  rationale: οἰκονομία ở đây là trách nhiệm điều hành tài sản của chủ. “Việc quản lý” là cách nói hiện đại, rõ nghĩa và không thu hẹp từ này chỉ vào một chức danh.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: vì anh không còn có thể quản lý nữa
  rationale: Giữ trực tiếp ý nghĩa khả năng của δύναμαι, sự chấm dứt được ἔτι phủ định, và nghĩa động từ của οἰκονομεῖν.
