revisions:
- from: Ở nơi âm phủ[a], người giàu ngước mắt lên, đang lúc chịu đau đớn, thì thấy Áp-ra-ham ở đằng xa và La-xa-rơ ở trong lòng ông[b].
  to: Trong Ha-đét[a], người giàu ngước mắt lên; đang chịu thống khổ, ông thấy Áp-ra-ham ở đằng xa và La-xa-rơ trong lòng Áp-ra-ham[b].
  rationale: Sửa thuật ngữ chính sang “Ha-đét” để ưu tiên sự phân biệt của nguyên văn giữa ᾅδης và Ghê-hen-na. Làm rõ đại từ quy chiếu ở hình ảnh κόλποις bằng “lòng Áp-ra-ham”, đồng thời duy trì hình ảnh và không diễn giải thành hành động ôm. Điều chỉnh “đau đớn” thành “thống khổ” để phản ánh rõ hơn βασάνοις. Không có vấn đề cấu trúc cần xử lý.
