review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng trình tự và các yếu tố chính của câu, gồm Ha-đét, cái nhìn ngước lên, tình trạng đau khổ, khoảng cách với Áp-ra-ham, và La-xa-rơ trong κόλποις của Áp-ra-ham. Tuy nhiên, “âm phủ” có thể gợi hệ hình dân gian hoặc nơi trừng phạt trong tiếng Việt mạnh hơn thuật ngữ ᾅδης; dùng trực tiếp “Ha-đét” cùng chú thích bảo toàn tốt hơn sự phân biệt từ vựng của nguyên văn. “Trong lòng ông” cũng có thể được hiểu là trạng thái nội tâm trong tiếng Việt; nêu thẳng “lòng Áp-ra-ham” vừa rõ quy chiếu vừa giữ lối nói truyền thống.
  naturalness: Câu gốc nhìn chung tự nhiên và trang trọng. Bản sửa dùng dấu chấm phẩy để làm rõ phân từ chỉ hoàn cảnh (“đang chịu thống khổ”) mà vẫn giữ nhịp kể chuyện. “Trong lòng Áp-ra-ham” là cách nói quen thuộc, dễ hiểu hơn đại từ “ông” ở cuối câu.
  terminology: Giữ tên Áp-ra-ham và La-xa-rơ. “Ha-đét” phiên âm thuật ngữ Hy Lạp ᾅδης, không đồng nhất nó với Ghê-hen-na. “Thống khổ” diễn tả mức độ của βασάνοις mà không xác định bản chất thần học của sự đau khổ.
  issues:
  - severity: medium
    issue: “Âm phủ” có thể quá tải hàm nghĩa đối với ᾅδῃ.
    rationale: Dù chú thích có phân biệt, “âm phủ” trong cách dùng Việt ngữ thường gợi một quan niệm dân gian về cõi âm và đôi khi gợi nơi trừng phạt. Dịch là “Ha-đét” trong thân bài bảo lưu thuật ngữ nguồn và tránh nhập các liên tưởng ngoài văn bản.
  - severity: low
    issue: Đại từ “ông” trong “ở trong lòng ông” có thể gây mơ hồ về nghĩa của “lòng”.
    rationale: Nguyên văn quy chiếu αὐτοῦ về Áp-ra-ham, nhưng tiếng Việt dùng “trong lòng ông” dễ được đọc là ‘trong tâm trí/tình cảm của ông’. Lặp tên Áp-ra-ham làm rõ hình ảnh không gian-thân cận của thành ngữ.
  - severity: low
    issue: “Đau đớn” hơi khái quát đối với βασάνοις.
    rationale: “Thống khổ” diễn tả rõ hơn tình trạng đau khổ dữ dội trong khi không thêm chi tiết về nguyên nhân hoặc tính chất chung cuộc của nó.
