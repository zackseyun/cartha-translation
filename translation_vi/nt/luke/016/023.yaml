source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: vi
  text: Trong Ha-đét[a], người giàu ngước mắt lên; đang chịu thống khổ, ông thấy Áp-ra-ham ở đằng xa và La-xa-rơ trong lòng Áp-ra-ham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ha-đét: cõi người chết; không phải Ghê-hen-na, thuật ngữ thường chỉ nơi phán xét cuối cùng.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “trong lòng ông”; đại từ này chỉ Áp-ra-ham. Đây là cách nói diễn tả sự gần gũi, thân mật.'
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: ᾅδῃ
  choice: âm phủ
  rationale: “Âm phủ” là cách diễn đạt tiếng Việt tự nhiên cho cõi người chết, đồng thời chú thích giữ lại tên Hy Lạp Ha-đét và phân biệt với Ghê-hen-na.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ngước mắt lên
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ hình ảnh người giàu hướng mắt lên để nhìn.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: đang lúc chịu đau đớn
  rationale: Thể hiện phân từ chỉ hoàn cảnh và tình trạng thống khổ nghiêm trọng mà không thêm nguyên nhân hay bản chất của hình phạt.
- source_word: ὁρᾷ
  choice: thì thấy
  rationale: Dùng hiện tại tường thuật theo chức năng kể chuyện tự nhiên trong tiếng Việt; “thì” liên kết hành động ngước mắt với điều người giàu nhìn thấy.
- source_word: ἀπὸ μακρόθεν
  choice: ở đằng xa
  rationale: Giữ rõ khoảng cách không gian được nhấn mạnh trong câu.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: ở trong lòng ông
  rationale: Giữ hình ảnh κόλπος về vị trí sát ngực/lòng và sự gần gũi; đại từ “ông” quy chiếu về Áp-ra-ham như trong nguyên văn.
theological_decisions:
- issue: Cách dịch ᾅδης trong phân đoạn liên quan đến tình trạng sau khi chết
  choice: âm phủ
  alternative: Ha-đét; địa ngục; cõi người chết
  rationale: “Âm phủ” truyền đạt cõi người chết trong văn cảnh mà không đồng nhất từ này với Ghê-hen-na, nơi phán xét cuối cùng; chú thích nêu rõ thuật ngữ Hy Lạp để bảo toàn sự phân biệt.
- issue: Hình ảnh κόλπος gắn với cách nói truyền thống “lòng Áp-ra-ham”
  choice: ở trong lòng ông
  alternative: ở bên cạnh ông; được ông ôm vào lòng; trong lòng Áp-ra-ham
  rationale: Cách dịch giữ hình ảnh gần nguyên văn và sự thân cận nhưng không diễn giải quá mức thành một hành động ôm; chú thích làm rõ đại từ và cách nói truyền thống.
- issue: Chủ thể ngầm của các động từ
  choice: người giàu
  alternative: ông ta; người ấy
  rationale: Tiếng Hy Lạp chỉ dùng đại từ sở hữu và động từ ngôi ba, nhưng văn cảnh ngay trước xác định người giàu là chủ thể. Nêu lại chủ thể giúp câu tiếng Việt rõ ràng mà không thay đổi nội dung.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các tên riêng quen thuộc trong tiếng Việt: Áp-ra-ham và La-xa-rơ. Cấu trúc câu giữ trình tự hình ảnh của nguyên văn nhưng thêm chủ thể “người giàu” theo văn cảnh để tránh đại từ mơ hồ.'
