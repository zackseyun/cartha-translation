  to: Không một đầy tớ trong nhà nào có thể phục vụ hai chủ, vì người ấy hoặc sẽ ghét chủ này mà yêu chủ kia, hoặc sẽ gắn bó với chủ này mà khinh thường chủ kia. Anh em không thể phục vụ Đức Chúa Trời và Ma-môn.[a]
