id: LUK.16.13
reference: Luke 16:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: vi
  text: Không một đầy tớ trong nhà nào có thể phục vụ hai chủ, vì người ấy hoặc sẽ ghét chủ này mà yêu chủ kia, hoặc sẽ gắn bó với chủ này mà khinh thường chủ kia. Anh em không thể phục vụ Đức Chúa Trời và Ma-môn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tiền bạc” hoặc “của cải.” Nguyên văn dùng Ma-môn, một từ chỉ của cải được nhân cách hóa ở đây như một ông chủ đối địch.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: đầy tớ trong nhà
  rationale: Diễn đạt địa vị phục dịch trong một gia đình, cụ thể hơn từ chung chỉ đầy tớ, đồng thời giữ rõ bối cảnh quan hệ chủ–tớ.
- source_word: κυρίοις
  choice: chủ
  rationale: Trong hình ảnh xã hội này, từ chỉ những người chủ của đầy tớ; “chủ” tự nhiên và tránh nhầm với tước hiệu thần học “Chúa”.
- source_word: δουλεύειν
  choice: phục vụ
  rationale: Giữ ý phục dịch dưới quyền một chủ và vận hành tự nhiên trong cả hình ảnh hai người chủ lẫn sự đối lập giữa Đức Chúa Trời và Ma-môn.
- source_word: μισήσει / ἀγαπήσει
  choice: sẽ ghét / yêu
  rationale: Giữ nguyên cặp đối lập mạnh và tính chất châm ngôn của nguyên văn, không làm nhẹ “ghét” thành “yêu ít hơn”.
- source_word: ἀνθέξεται
  choice: sẽ gắn bó với
  rationale: Thể hiện ý bám chặt, đứng về phía và trung thành với một chủ, đồng thời phù hợp với vế đối lập “khinh thường”.
- source_word: καταφρονήσει
  choice: sẽ khinh thường
  rationale: Diễn đạt thái độ coi nhẹ kèm sự khinh miệt, giữ được sức nặng của động từ Hy Lạp.
- source_word: θεῷ
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, quen thuộc và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: μαμωνᾷ
  choice: Ma-môn
  rationale: Giữ từ vay mượn mang sắc thái nhân cách hóa của cải như một chủ đối địch; chú thích giải nghĩa cho độc giả hiện đại.
theological_decisions:
- issue: Cách dịch μαμωνᾷ trong thế đối lập với θεῷ
  choice: Ma-môn
  alternative: tiền bạc; của cải
  rationale: Giữ sức mạnh tu từ trong đó của cải được trình bày như một ông chủ cạnh tranh với Đức Chúa Trời, nhưng không hàm ý đó nhất thiết là một vị thần có thật.
- issue: Chủ ngữ số ít mang nghĩa khái quát
  choice: người ấy
  alternative: người đầy tớ ấy; họ
  rationale: “Người ấy” giữ số ít đại diện của nguyên văn mà vẫn tự nhiên và không thêm giới tính vốn không cần biểu thị trong tiếng Việt.
- issue: Đối lập ghét và yêu
  choice: ghét ... yêu
  alternative: yêu ít hơn ... yêu
  rationale: Giữ nguyên độ căng và sức nhấn của cặp động từ Hy Lạp thay vì giải thích theo một thành ngữ ưu tiên có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đầy tớ trong nhà” để giữ bối cảnh gia đình; lặp “phục vụ” ở câu kết nhằm làm rõ cấu trúc song song. Đại từ “anh em” thể hiện lời trực tiếp với số nhiều của δύνασθε mà không đưa giới tính vào nghĩa.
