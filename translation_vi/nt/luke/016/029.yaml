  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: vi
  text: 'Nhưng Áp-ra-ham nói: “Họ có Môi-se và các nhà tiên tri[a]; hãy để họ lắng nghe các vị ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Môi-se và các nhà tiên tri” chỉ lời chứng trong Kinh Thánh gắn với Môi-se và các sách tiên tri.
    reason: cross_reference
  - marker: b
    text: 'Dịch sát hơn: “hãy để họ nghe các vị ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Nhưng Áp-ra-ham nói
  rationale: λέγει là hiện tại lịch sử; tiếng Việt có thể dùng “nói” tự nhiên trong lời kể mà không cần đánh dấu thì quá khứ. δέ mang sắc thái chuyển ý hoặc đối chiếu nhẹ; “Nhưng” phù hợp với lời đáp bác lại đề nghị ở câu trước.
- source_word: Ἔχουσι
  choice: Họ có
  rationale: Giữ nghĩa trực tiếp của động từ hiện tại, diễn tả rằng những người anh em hiện đã có sẵn lời chứng ấy.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Môi-se và các nhà tiên tri
  rationale: Giữ nguyên cách nói hoán dụ của Hy Lạp thay vì diễn giải thành “Luật Môi-se và sách các Tiên tri”; chú thích làm rõ rằng cụm từ chỉ lời chứng trong Kinh Thánh.
- source_word: ἀκουσάτωσαν
  choice: hãy để họ nghe theo
  rationale: Thể mệnh lệnh ngôi thứ ba số nhiều được diễn đạt tự nhiên bằng “hãy để họ...”. “Nghe theo” thể hiện việc tiếp nhận và làm theo lời chứng, trong khi chú thích bảo lưu cách dịch sát hơn là “nghe”.
- source_word: αὐτῶν
  choice: các vị ấy
  rationale: Đại từ sở hữu cách sau ἀκούω quy chiếu về Môi-se và các nhà tiên tri. “Các vị ấy” giữ quy chiếu đến những người được nêu, đồng thời tránh cách nói thiếu tự nhiên “nghe theo chúng”.
theological_decisions:
- issue: Sở chỉ của “Môi-se và các nhà tiên tri”
  choice: Giữ cụm từ nguyên văn như một cách nói hoán dụ về lời chứng có thẩm quyền trong Kinh Thánh.
  alternative: Diễn giải ngay trong câu thành “Luật Môi-se và sách các Tiên tri”, hoặc hiểu hẹp chỉ về các nhân vật lịch sử.
  rationale: Cách dùng trong Lu-ca và bối cảnh Do Thái thường chỉ phần Kinh Thánh gắn với Môi-se và các sách tiên tri. Bản dịch không mở rộng câu Hy Lạp, còn chú thích giải thích sở chỉ.
- issue: Sắc thái của ἀκούω
  choice: Dùng “nghe theo” để diễn tả lời kêu gọi đáp ứng lời chứng.
  alternative: Dịch sát hơn là “nghe”.
  rationale: Trong ngữ cảnh, động từ không chỉ nói đến tiếp nhận âm thanh mà còn đến việc chú ý và vâng theo. Chú thích nêu cách dịch sát để không che khuất độ rộng nghĩa của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dạng tên quen thuộc trong tiếng Việt là “Áp-ra-ham” và “Môi-se”. “Các nhà tiên tri” được viết thường vì câu chính giữ cách gọi người theo bề mặt ngữ pháp, còn ý nghĩa chỉ khối sách Kinh Thánh được giải thích trong chú thích.
