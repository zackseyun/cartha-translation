id: LUK.16.25
reference: Luke 16:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: vi
  text: 'Nhưng Áp-ra-ham nói: “Con ơi, hãy nhớ rằng khi còn sống, con đã nhận những điều tốt lành của mình[a], còn La-xa-rơ cũng đã nhận những điều khốn khổ. Nhưng bây giờ, người được an ủi tại đây, còn con thì đau đớn[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nhận đầy đủ những điều tốt lành của mình.” Động từ Hy Lạp có thể hàm ý nhận phần được dành cho mình hoặc nhận đầy đủ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bị hành hạ” hoặc “chịu thống khổ.” Từ Hy Lạp có thể chỉ nỗi đau hoặc sự khốn khổ dữ dội.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Con ơi
  rationale: Lối xưng hô thân tình nhưng vẫn thể hiện vị thế của Áp-ra-ham; không nhất thiết hàm ý quan hệ cha con theo nghĩa đen.
- source_word: μνήσθητι
  choice: hãy nhớ
  rationale: Diễn đạt trực tiếp và tự nhiên mệnh lệnh hồi tưởng.
- source_word: ἀπέλαβες
  choice: đã nhận
  rationale: Giữ nghĩa rộng của động từ, có thể chỉ việc nhận phần dành cho mình hoặc nhận đầy đủ; sắc thái mạnh hơn được nêu trong chú thích.
- source_word: τὰ ἀγαθά σου
  choice: những điều tốt lành của mình
  rationale: Giữ tính khái quát của cụm từ Hy Lạp và tránh thêm sắc thái thần học như “phước lành”.
- source_word: ἐν τῇ ζωῇ σου
  choice: khi còn sống
  rationale: Cách nói tự nhiên trong tiếng Việt, chỉ rõ thời gian sống trên đời.
- source_word: ὁμοίως τὰ κακά
  choice: cũng đã nhận những điều khốn khổ
  rationale: Tạo thế song song với việc người giàu đã nhận điều tốt; “khốn khổ” nói đến trải nghiệm bất hạnh chứ không phải điều ác về luân lý.
- source_word: παρακαλεῖται
  choice: được an ủi
  rationale: Thể bị động phù hợp với bối cảnh đảo ngược hoàn cảnh sau khi chết.
- source_word: ὧδε
  choice: tại đây
  rationale: Giữ rõ ý chỉ địa điểm hiện tại trong cảnh thuật.
- source_word: ὀδυνᾶσαι
  choice: đau đớn
  rationale: Diễn đạt sự đau khổ hoặc thống khổ dữ dội mà không tự động thêm hàm ý giáo lý mạnh hơn của “bị hành hạ”.
theological_decisions:
- issue: Cách diễn đạt sự đau khổ sau khi chết
  choice: con thì đau đớn
  alternative: con bị hành hạ; con đang chịu thống khổ
  rationale: Bản dịch xác nhận tình trạng đau khổ có ý thức trong câu chuyện nhưng không khuếch đại quá nghĩa từ vựng của ὀδυνᾶσαι.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Con ơi” giữ sắc thái nhân từ trong lời xưng hô; cấu trúc đối xứng làm nổi bật sự đảo ngược hoàn cảnh mà không giải thích thêm về mặt giáo lý.
