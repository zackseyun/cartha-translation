source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: vi
  text: Rồi người nghèo chết và được các thiên sứ đưa vào lòng Áp-ra-ham[a]. Người giàu cũng chết và được chôn cất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đến bên Áp-ra-ham.” Cụm Hy Lạp theo nghĩa đen là “vào lòng Áp-ra-ham,” một hình ảnh diễn tả sự gần gũi, danh dự và thông công.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: Chuyện xảy ra là ... qua đời
  rationale: Diễn đạt tự nhiên cấu trúc tường thuật ἐγένετο + động từ nguyên mẫu, đồng thời giữ sắc thái chuyển tiếp nhẹ của δέ mà không thêm một từ chỉ thời gian không có trong nguyên văn.
- source_word: τὸν πτωχὸν
  choice: người nghèo
  rationale: Dịch trực tiếp πτωχός là người nghèo hoặc túng thiếu; tránh thêm ý 'ăn xin' vốn không nằm trong chính cụm từ này.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: được các thiên sứ đưa
  rationale: Giữ thể bị động và tác nhân được xác định trong nguyên văn; 'đưa' tự nhiên hơn 'mang đi' trong tiếng Việt ở ngữ cảnh này.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: đến trong lòng Áp-ra-ham
  rationale: Giữ hình ảnh cụ thể của κόλπος và sắc thái gần gũi, vinh dự, thông công, thay vì giải nghĩa hoàn toàn thành một địa điểm ở thế giới bên kia.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Người giàu cũng qua đời
  rationale: '''Cũng'' thể hiện καί và duy trì sự song song giữa cái chết của hai người; δέ được thể hiện bằng sự chuyển sang câu mới tự nhiên.'
- source_word: ἐτάφη
  choice: được chôn cất
  rationale: Giữ thể bị động và ý nghĩa trực tiếp của θάπτω bằng cách diễn đạt trang trọng, thông dụng.
theological_decisions:
- issue: Cách dịch εἰς τὸν κόλπον Ἀβραάμ
  choice: đến trong lòng Áp-ra-ham
  alternative: đến bên Áp-ra-ham
  rationale: Cách dịch chính giữ nguyên ẩn dụ giàu ý nghĩa của nguyên văn và không vội đồng nhất nó với một khái niệm hậu thế cụ thể; cách nói dễ hiểu hơn được nêu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “qua đời” và “chôn cất” để giữ giọng kể nghiêm trang; giữ hình ảnh “trong lòng Áp-ra-ham” cùng chú thích giải nghĩa nhằm bảo toàn sự mơ hồ và sức gợi thần học của nguyên văn.
