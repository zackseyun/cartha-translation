revisions:
- from: Chuyện xảy ra là người nghèo qua đời và được các thiên sứ đưa đến trong lòng Áp-ra-ham[a]. Người giàu cũng qua đời và được chôn cất.
  to: Rồi người nghèo chết và được các thiên sứ đưa vào lòng Áp-ra-ham[a]. Người giàu cũng chết và được chôn cất.
  rationale: Bản sửa chuyển công thức tường thuật sang tiếng Việt tự nhiên, giữ sắc thái chuyển tiếp nhẹ, duy trì sự đối xứng “chết” giữa hai nhân vật, và sửa cách diễn đạt hình ảnh κόλπος để phản ánh chính xác hơn hướng chuyển động của nguyên văn mà vẫn bảo toàn ẩn dụ và tính không xác quyết về thần học.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp giữ đúng các thành tố chính: cái chết của người nghèo, việc các thiên sứ đưa ông đến với Áp-ra-ham, cái chết và việc chôn cất người giàu. Tuy nhiên, “đến trong lòng Áp-ra-ham” không diễn đạt tự nhiên hướng chuyển động của εἰς; “vào lòng Áp-ra-ham” sát hình ảnh κόλπος hơn. Cụm “Chuyện xảy ra là” cũng nặng và không tự nhiên cho công thức tường thuật Hy Lạp này.'
  naturalness: 'Nên dùng câu kể trực tiếp, tự nhiên: “Rồi người nghèo chết...”. “Chết” tương ứng trực tiếp với ἀποθανεῖν/ἀπέθανεν và giữ thế đối xứng ngắn gọn của nguyên văn; không cần uyển ngữ “qua đời.”'
  terminology: Giữ “các thiên sứ,” “Áp-ra-ham,” và hình ảnh “lòng Áp-ra-ham.” Chú thích cần sửa phần diễn giải nghĩa đen từ “đến trong lòng” thành “vào lòng” và có thể nêu rõ đây là hình ảnh về sự gần gũi, danh dự và thông công, không áp đặt một cách giải thích hậu thế.
  issues:
  - severity: medium
    issue: “đến trong lòng Áp-ra-ham” không tự nhiên và chưa phản ánh rõ hướng của εἰς.
    rationale: Giới từ εἰς chỉ sự đi vào/đến với một đích điểm. Trong tiếng Việt, “đưa vào lòng Áp-ra-ham” vừa giữ hình ảnh κόλπος vừa diễn đạt đúng chuyển động hơn.
  - severity: low
    issue: “Chuyện xảy ra là” là lối mở đầu gượng trong tiếng Việt hiện đại.
    rationale: Công thức ἐγένετο + nguyên mẫu có thể được chuyển tự nhiên bằng một chuyển tiếp kể chuyện như “Rồi,” không cần danh từ hóa thành “chuyện xảy ra.”
  - severity: low
    issue: “qua đời” làm yếu sự song song từ vựng giữa hai lần dùng động từ chết.
    rationale: Nguyên văn dùng các dạng của cùng động từ ἀποθνῄσκω cho cả hai nhân vật. “Chết” trang trọng vừa đủ trong văn bản Kinh Thánh và giữ sự song song ấy.
  revised_text: Rồi người nghèo chết và được các thiên sứ đưa vào lòng Áp-ra-ham[a]. Người giàu cũng chết và được chôn cất.
  revised_footnotes:
