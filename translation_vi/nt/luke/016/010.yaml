id: LUK.16.10
reference: Luke 16:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: vi
  text: Ai trung tín trong việc rất nhỏ thì cũng trung tín trong việc lớn; còn ai bất chính trong việc rất nhỏ thì cũng bất chính trong việc lớn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bất chính” cũng có thể dịch là “gian dối”, “bất công” hoặc “không công chính”. Từ Hy Lạp có nghĩa rộng hơn sự gian dối về tiền bạc, dù sắc thái ấy phù hợp với văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: trung tín
  rationale: Trong ngữ cảnh quản lý điều được giao, từ này chỉ sự đáng tin cậy và tận tâm, chứ không đơn thuần là tin; “trung tín” vừa tự nhiên vừa giữ được sắc thái đạo đức.
- source_word: ἐν ἐλαχίστῳ
  choice: trong việc rất nhỏ
  rationale: Cụm giới từ diễn tả phạm vi hoặc hoàn cảnh. Thêm “việc” giúp câu tiếng Việt rõ và tự nhiên, đồng thời giữ thế đối lập về mức độ.
- source_word: ἐν πολλῷ
  choice: trong việc lớn
  rationale: Dạng trung tính số ít đối lập với ἐλαχίστῳ về lượng hoặc tầm mức. “Việc lớn” là cách diễn đạt Việt ngữ gọn, rõ và cân xứng với “việc rất nhỏ”.
- source_word: ἄδικος
  choice: bất chính
  rationale: Từ Hy Lạp chỉ tình trạng sai trái, không công chính hoặc bất công theo nghĩa rộng. “Bất chính” không thu hẹp ý vào sự gian dối tiền bạc, nhưng vẫn phù hợp với ngữ cảnh quản lý tài sản.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: ai trung tín ... ai bất chính
  rationale: Mạo từ đi với tính từ được dùng như danh từ và mang nghĩa khái quát. Cấu trúc “ai...” tự nhiên trong tiếng Việt, không áp đặt giới tính và giữ tính đại diện phổ quát.
- source_word: καὶ
  choice: cũng; còn
  rationale: “Cũng” thể hiện nghĩa bổ sung trong từng vế; “còn” nối hai mệnh đề chính và làm rõ sự tương phản song song mà không thay đổi nội dung.
theological_decisions:
- issue: Sắc thái đạo đức của ἄδικος trong ngữ cảnh quản lý tài sản
  choice: bất chính
  alternative: gian dối; bất công; không công chính
  rationale: Câu này nêu một nguyên tắc đạo đức tổng quát, không chỉ nói về gian lận tài chính. “Bất chính” giữ được phạm vi nghĩa rộng và thế đối lập với “trung tín”, đồng thời vẫn thích hợp với văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc hai vế cân xứng nhằm tái hiện phép song song của nguyên văn. “Việc rất nhỏ/việc lớn” được dùng thay cho lối dịch sát chữ kém tự nhiên “trong rất ít/trong nhiều”.
