  source_fidelity: 'Bản dịch giữ đúng cấu trúc song hành và khái quát của nguyên văn: người trung tín trong điều/việc rất nhỏ cũng trung tín trong điều/việc lớn, và người bất chính thì cũng như vậy. “Trung tín” diễn đạt πιστός phù hợp trong bối cảnh trách nhiệm được giao; “bất chính” giữ ἄδικος ở bình diện đạo đức rộng, không thu hẹp vào gian dối tài chính. Cách thêm “việc” là một sự làm rõ tự nhiên trong tiếng Việt, không làm thay đổi ý nghĩa.'
