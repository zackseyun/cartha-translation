  to: 'Nhưng ông nói với người ấy: “Nếu họ không nghe theo[a] Môi-se và các tiên tri, thì dù có người sống lại từ cõi chết[b], họ cũng sẽ không được thuyết phục[c].”'
  rationale: 'Chuyển neo [a] đến đúng cụm “nghe theo”, là từ được chú thích, và dùng “các tiên tri” như cách gọi tự nhiên hơn. Các yếu tố nghĩa còn lại được giữ nguyên: họ không chịu nghe chứng ngôn của Môi-se và các tiên tri, và ngay cả việc một người sống lại từ cõi chết cũng sẽ không thuyết phục họ.'
