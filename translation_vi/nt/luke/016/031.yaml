id: LUK.16.31
reference: Luke 16:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: vi
  text: 'Nhưng ông nói với người ấy: “Nếu họ không nghe theo[a] Môi-se và các tiên tri, thì dù có người sống lại từ cõi chết[b], họ cũng sẽ không được thuyết phục[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nghe theo” cũng có thể dịch là “nghe” hoặc “chú ý đến.” Động từ Hy Lạp có thể bao hàm cả việc nghe và đáp ứng điều đã nghe.
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nghĩa: “từ giữa những người chết.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “được làm cho tin chắc.” Từ Hy Lạp có nghĩa là được thuyết phục hoặc xác tín, không nhất thiết là “tin” theo một nghĩa thần học hẹp hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Nhưng ông nói với người ấy
  rationale: “Nhưng” giữ sắc thái chuyển ý tương phản nhẹ của δέ; cách diễn đạt còn lại tự nhiên và không xác định quá mức danh tính của các đại từ trong riêng câu này.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Môi-se và các nhà tiên tri
  rationale: Giữ nguyên lối gọi quen thuộc chỉ chứng ngôn có thẩm quyền trong Kinh Thánh của Israel, thay vì diễn giải thành “Kinh Thánh”.
- source_word: οὐκ ἀκούουσιν
  choice: không nghe theo
  rationale: ἀκούω trong ngữ cảnh này bao hàm cả nghe và chú tâm đáp ứng; “nghe theo” diễn đạt tự nhiên sắc thái ấy mà chưa đồng nhất hoàn toàn với vâng phục.
- source_word: οὐδ’ ἐάν
  choice: thì dù ... cũng không
  rationale: Cấu trúc tiếng Việt này giữ được sức nhấn mạnh của phủ định nối tiếp trong điều kiện giả định.
- source_word: τις
  choice: có người
  rationale: Giữ tính bất định và số ít của đại từ Hy Lạp.
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: sống lại từ cõi chết
  rationale: Diễn đạt tự nhiên ngôn ngữ phục sinh trong tiếng Việt; chú thích bảo lưu khả năng hiểu sát hơn là “từ giữa những người chết”.
- source_word: πεισθήσονται
  choice: sẽ được thuyết phục
  rationale: Giữ thể bị động và nghĩa khái quát của πείθω, tránh thu hẹp thành “tin” hoặc “ăn năn” theo nghĩa thần học chuyên biệt.
theological_decisions:
- issue: Ý nghĩa của “Môi-se và các nhà tiên tri”
  choice: Giữ nguyên thành ngữ chỉ chứng ngôn Kinh Thánh đã được ban cho Israel
  alternative: Diễn giải thành “Kinh Thánh” hoặc chỉ hiểu là hai nhóm nhân vật
  rationale: Trong ngữ cảnh, cụm từ có chức năng hoán dụ cho chứng ngôn Kinh Thánh, nhưng bản dịch giữ cách nói nguyên thủy để không giải thích thay cho bản văn.
- issue: Sức nghĩa của πεισθήσονται
  choice: được thuyết phục
  alternative: tin hoặc ăn năn
  rationale: Động từ chỉ việc được thuyết phục hay xác tín nói chung; các phương án kia sẽ đưa vào một phản ứng thần học cụ thể hơn điều bản văn trực tiếp nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” và “người ấy” để giữ quan hệ đại từ của câu mà không bổ sung tên riêng; dùng “các nhà tiên tri” theo cách nói tự nhiên hiện nay.
