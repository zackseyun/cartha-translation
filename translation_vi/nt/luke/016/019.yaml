revisions:
- from: Có một người giàu kia, thường mặc y phục màu tía và vải lanh mịn, ngày nào cũng vui hưởng xa hoa.[a]
  to: Có một người giàu, thường mặc y phục màu tía và vải lanh mịn, ngày nào cũng vui hưởng một cách xa hoa.[a]
  rationale: Bỏ “kia” để không thêm sắc thái chỉ trỏ ngoài nguyên văn, và đổi thành “vui hưởng một cách xa hoa” để quan hệ trạng từ trong câu rõ, tự nhiên hơn. Nghĩa và chú thích từ vựng được giữ nguyên.
