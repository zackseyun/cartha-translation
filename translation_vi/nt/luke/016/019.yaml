  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: vi
  text: Có một người giàu, thường mặc y phục màu tía và vải lanh mịn, ngày nào cũng vui hưởng một cách xa hoa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngày nào cũng mở tiệc linh đình.” Từ εὐφραινόμενος có thể nói đến sự vui thú, ăn mừng hoặc yến tiệc, còn λαμπρῶς nhấn mạnh vẻ huy hoàng, xa hoa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: Có một người… kia
  rationale: Cách nói này giới thiệu một nhân vật chưa xác định một cách tự nhiên trong tiếng Việt; mạch chuyển nhẹ của δέ được thể hiện qua lối kể, không thêm một từ chỉ thời gian như “bấy giờ”.
- source_word: πλούσιος
  choice: giàu
  rationale: Diễn đạt trực tiếp sự giàu có về vật chất và tự nhiên trong văn kể chuyện.
- source_word: ἐνεδιδύσκετο
  choice: thường mặc
  rationale: Thì chưa hoàn thành diễn tả thói quen lặp lại trong quá khứ; “thường mặc” truyền đạt rõ nét nghĩa tập quán ấy.
- source_word: πορφύραν
  choice: y phục màu tía
  rationale: Danh từ chỉ màu/chất nhuộm được dùng hoán dụ cho quần áo nhuộm tía, một dấu hiệu của sự sang trọng.
- source_word: βύσσον
  choice: vải lanh mịn
  rationale: Chỉ loại vải lanh chất lượng cao; cách dịch này giữ cả chất liệu lẫn nét quý giá của nó.
- source_word: εὐφραινόμενος
  choice: vui hưởng
  rationale: Giữ nghĩa rộng là vui thú, hưởng thụ hoặc ăn mừng, thay vì buộc câu chính chỉ mang nghĩa mở tiệc.
- source_word: καθ’ ἡμέραν
  choice: ngày nào cũng
  rationale: Cách diễn đạt tự nhiên, rõ ràng về hành động diễn ra hằng ngày.
- source_word: λαμπρῶς
  choice: xa hoa
  rationale: Trong bối cảnh giàu có và y phục đắt giá, trạng từ này nhấn mạnh vẻ huy hoàng, sang trọng và xa xỉ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Y phục màu tía” rõ nghĩa hơn “mặc màu tía”; “vải lanh mịn” giữ sắc thái vật liệu quý. Câu chính bảo tồn độ rộng nghĩa của εὐφραινόμενος, còn chú thích nêu cách hiểu thiên về yến tiệc.
