  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: vi
  text: Có một người nghèo tên là La-xa-rơ đã bị đặt nằm bên cổng nhà ông ấy, mình đầy vết lở loét.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đầy những vết loét.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: người nghèo
  rationale: Diễn đạt tình trạng nghèo túng mà không thêm vai trò cụ thể là người ăn xin.
- source_word: τις
  choice: một người
  rationale: Cách tự nhiên trong tiếng Việt để giới thiệu một nhân vật mới, vẫn giữ sắc thái bất định.
- source_word: ὀνόματι Λάζαρος
  choice: tên là La-xa-rơ
  rationale: Chuyển ngữ tự nhiên cấu trúc chỉ tên gọi; tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt.
- source_word: ἐβέβλητο
  choice: bị người ta đặt nằm
  rationale: Giữ thể bị động và hàm ý người này bất lực, được người khác đưa đến đó; tránh làm nhẹ thành chỉ đơn thuần 'nằm' nhưng không khẳng định sắc thái dữ dội như 'quăng'.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: bên cổng nhà ông
  rationale: πυλών là cổng hoặc lối cổng của ngôi nhà; thêm 'nhà' giúp đại từ chỉ người giàu ở câu trước được hiểu tự nhiên trong tiếng Việt.
- source_word: εἱλκωμένος
  choice: mình đầy ghẻ lở
  rationale: Diễn đạt rõ tình trạng bị các vết loét hành hạ bằng ngôn ngữ phổ thông, giàu hình ảnh nhưng trang nghiêm.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, tự nhiên và trang nghiêm. Câu giữ sự tương phản mở đầu bằng việc giới thiệu người nghèo, bảo toàn tính bị động của ἐβέβλητο và không thêm rằng ông là người ăn xin.
