revisions:
- from: Có một người nghèo tên là La-xa-rơ bị người ta đặt nằm bên cổng nhà ông, mình đầy ghẻ lở.
  to: Có một người nghèo tên là La-xa-rơ đã bị đặt nằm bên cổng nhà ông ấy, mình đầy vết lở loét.[a]
  rationale: Đổi “ghẻ lở” thành “vết lở loét” để phản ánh εἱλκωμένος một cách chính xác và tự nhiên hơn trong tiếng Việt hiện đại. Các phần khác của bản dịch được giữ nguyên về nghĩa.
