    issue: “mình đầy ghẻ lở” không chính xác tối ưu cho εἱλκωμένος.
    rationale: Từ Hy Lạp nói người này bị những vết loét hành hạ/đầy vết loét. Trong cách dùng hiện đại, “ghẻ” thường chỉ bệnh ghẻ, do đó thêm một chẩn đoán cụ thể không có trong nguồn.
