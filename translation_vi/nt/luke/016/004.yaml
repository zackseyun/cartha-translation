id: LUK.16.4
reference: Luke 16:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: vi
  text: Ta biết mình sẽ làm gì, để khi bị cách chức quản gia, họ sẽ đón ta vào nhà họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: Ta biết
  rationale: Động từ aorist ở đây diễn tả việc vừa nhận ra hoặc đã nghĩ ra một kế; trong lời độc thoại, “Ta biết” tự nhiên và vẫn hàm ý ông đã tìm ra cách.
- source_word: τί ποιήσω
  choice: mình sẽ làm gì
  rationale: Thể giả định mang ý cân nhắc nhưng trong ngữ cảnh đã chuyển thành quyết định; cách dịch này diễn đạt kế hoạch ông sắp thực hiện.
- source_word: ἵνα ὅταν
  choice: để khi
  rationale: Giữ cả ý mục đích của ἵνα và tình huống tương lai của ὅταν bằng một kết cấu tiếng Việt gọn, tự nhiên.
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: bị cách chức quản gia
  rationale: Cụm này chỉ việc bị loại khỏi chức vụ chịu trách nhiệm quản lý gia sản. “Cách chức quản gia” rõ nghĩa trong bối cảnh và không đem sắc thái thần học ngoài dụ ngôn.
- source_word: δέξωνταί με
  choice: họ sẽ đón ta
  rationale: δέχομαι có thể là tiếp nhận hoặc đón tiếp; ở đây hành động cho vào nhà hàm ý tiếp đón. “Sẽ” diễn đạt kết quả được nhắm tới, không khẳng định chắc chắn ngoài ý định của người quản gia.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: vào nhà họ
  rationale: “Nhà” tự nhiên trong tiếng Việt và đủ biểu đạt sở hữu phản thân; thêm “riêng” là không cần thiết.
theological_decisions: []
translation_notes:
  register: Lời độc thoại dùng đại từ “ta” phù hợp với nhân vật trong văn kể trang trọng nhưng vẫn dễ hiểu. Câu văn hiện đại, rõ ràng; “quản gia” giữ đúng bối cảnh quản lý gia sản.
