  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành tố chính của câu Hy Lạp: lời kêu lớn tiếng, lời xưng hô với Áp-ra-ham, hai mệnh lệnh xin thương xót và sai La-xa-rơ, hành động nhúng đầu ngón tay vào nước, mục đích làm mát lưỡi, và lý do là đang chịu đau đớn trong ngọn lửa này. “Tổ phụ Áp-ra-ham ơi” diễn đạt phù hợp sắc thái viện đến tổ tiên của Πάτερ Ἀβραάμ mà không làm thay đổi ý nghĩa.'
