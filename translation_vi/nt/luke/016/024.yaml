id: LUK.16.24
reference: Luke 16:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: vi
  text: 'Ông kêu lên: “Tổ phụ Áp-ra-ham ơi, xin thương xót tôi và sai La-xa-rơ nhúng đầu ngón tay vào nước để làm mát lưỡi tôi, vì tôi đang đau đớn trong ngọn lửa này.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì tôi đang bị hành hạ trong ngọn lửa này.” Động từ Hy Lạp có thể chỉ sự đau khổ dữ dội hoặc bị hành hạ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: kêu lên
  rationale: Diễn tả lời gọi lớn tiếng, khẩn thiết trong tiếng Việt tự nhiên mà không thêm ý quá mức.
- source_word: Πάτερ Ἀβραάμ
  choice: Tổ phụ Áp-ra-ham ơi
  rationale: πάτερ là cách xưng hô dựa trên quan hệ tổ tiên; “Tổ phụ” làm rõ nghĩa này trong tiếng Việt, còn “ơi” thể hiện hô cách tự nhiên.
- source_word: ἐλέησόν με
  choice: xin thương xót tôi
  rationale: Giữ nguyên lời cầu xin lòng thương xót, trang trọng và quen thuộc nhưng vẫn dễ hiểu.
- source_word: πέμψον
  choice: sai
  rationale: “Sai” phù hợp với việc một người có thẩm quyền phái người khác đi, đồng thời phản ánh mệnh lệnh πέμψον.
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: nhúng đầu ngón tay vào nước
  rationale: Giữ hình ảnh cụ thể của hành động nhúng ngắn và phần đầu ngón tay; “vào nước” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: làm mát lưỡi tôi
  rationale: Chuyển đạt trực tiếp hành động làm nguội hay làm dịu bằng cách làm mát, không thay hình ảnh thân thể.
- source_word: ὀδυνῶμαι
  choice: tôi đang đau đớn
  rationale: Động từ chỉ sự đau khổ dữ dội; “đau đớn” truyền đạt cường độ mà không mặc nhiên xác định tác nhân gây đau.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: trong ngọn lửa này
  rationale: φλόξ chỉ ngọn lửa; bản dịch giữ hình ảnh số ít và đại từ chỉ định của nguyên văn.
theological_decisions:
- issue: Cách diễn đạt nỗi đau của người giàu
  choice: vì tôi đang đau đớn trong ngọn lửa này
  alternative: vì tôi đang bị hành hạ trong ngọn lửa này
  rationale: Thể trung/bị động ὀδυνῶμαι có thể diễn tả đau khổ dữ dội hoặc bị hành hạ. “Đang đau đớn” giữ cường độ nhưng không khẳng định rõ một tác nhân hành hạ mà nguyên văn không nêu.
- issue: Cách gọi Áp-ra-ham
  choice: Tổ phụ Áp-ra-ham ơi
  alternative: Cha Áp-ra-ham ơi
  rationale: “Tổ phụ” thể hiện lời viện đến quan hệ huyết thống tổ tiên trong bối cảnh, tránh để “Cha” bị hiểu chủ yếu là quan hệ cha con trực tiếp; phương án sát hình thức hơn vẫn được ghi nhận.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Lời cầu xin giữ sắc thái khẩn thiết; tên riêng được phiên âm theo lối quen dùng. Dùng “ông” theo mạch kể để chỉ người giàu, không thêm danh xưng ngoài ngữ cảnh.
