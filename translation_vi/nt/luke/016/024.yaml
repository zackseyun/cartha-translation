  terminology: Tên riêng Áp-ra-ham và La-xa-rơ nhất quán với lối phiên âm Kinh Thánh tiếng Việt quen dùng. “Đau đớn” phản ánh tốt ὀδυνῶμαι mà không áp đặt tác nhân hay diễn giải giáo lý. Chú thích bảo lưu phương án “bị hành hạ,” tương ứng hợp lý với khả năng dịch “tormented.”
