source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: vi
  text: 'Người quản gia tự nhủ: “Mình sẽ làm gì đây, vì chủ đang tước quyền quản lý của mình? Cuốc đất thì mình không đủ sức, còn đi ăn xin thì mình xấu hổ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκονόμος
  choice: người quản gia
  rationale: Chỉ người được giao trông coi tài sản và công việc của chủ; “người quản gia” vừa tự nhiên vừa giữ được bối cảnh gia sản.
- source_word: ἐν ἑαυτῷ
  choice: tự nhủ
  rationale: Diễn đạt tự nhiên lời nói thầm hay sự suy tính trong lòng.
- source_word: Τί ποιήσω
  choice: Mình sẽ làm gì đây
  rationale: Thể hiện câu hỏi tự cân nhắc về hành động sắp tới; “đây” truyền đạt sắc thái bối rối mà không thêm một lời giải thích.
- source_word: κύριός μου
  choice: chủ
  rationale: Trong dụ ngôn, từ này chỉ người có thẩm quyền đối với quản gia, không phải danh xưng thần học.
- source_word: ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ
  choice: sắp tước quyền quản lý khỏi tay mình
  rationale: “Tước” giữ sắc thái lấy đi một chức trách; hiện tại trong ngữ cảnh diễn tả việc đã được quyết định và đang cận kề, nên dịch tự nhiên là “sắp”.
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: Cuốc đất thì mình không đủ sức
  rationale: σκάπτειν là đào/cuốc, trong ngữ cảnh chỉ lao động chân tay; “không đủ sức” nêu rõ sắc thái thể lực của ἰσχύω.
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: đi ăn xin thì mình xấu hổ
  rationale: ἐπαιτεῖν chỉ việc xin bố thí; cách nói này rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch κύριος trong bối cảnh dụ ngôn không chỉ về Đức Chúa Trời
  choice: chủ
  alternative: Chúa; ông chủ
  rationale: Đối tượng là người chủ giàu có trong câu chuyện. “Chủ” bảo toàn quan hệ thẩm quyền mà không tạo hàm ý đây là danh xưng thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “mình” trong lời độc thoại để nghe tự nhiên; dùng cặp “người quản gia/quyền quản lý” thay vì cố giữ các từ đồng căn bằng một cấu tạo gượng ép. Không cần chú thích vì tiếng Việt không có một cặp từ tự nhiên vừa đồng căn vừa truyền đạt chính xác chức vụ và trách nhiệm.
