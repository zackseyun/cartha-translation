review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng mạch ý và các thuật ngữ chính: οἰκονόμος là “người quản gia,” κύριος là “chủ,” và hai việc “cuốc đất/đi ăn xin” phản ánh đúng câu Hy Lạp. Tuy nhiên, “sắp tước” chuyển hiện tại ἀφαιρεῖται (“đang lấy/tước đi”) thành ý sắp xảy ra, còn “khỏi tay” là một hình ảnh không có trong nguyên văn. Dịch “đang tước quyền quản lý của mình” giữ sát hơn tiến trình được diễn tả mà vẫn tự nhiên.'
  naturalness: Lời độc thoại với “mình” tự nhiên trong tiếng Việt hiện đại. Cấu trúc “Cuốc đất thì…, còn đi ăn xin thì…” rõ ràng, có nhịp điệu phù hợp. “Đang tước quyền quản lý của mình” tự nhiên hơn và tránh thành ngữ thêm ý.
  terminology: “Người quản gia” và “quyền quản lý” diễn đạt tốt cặp từ đồng gốc οἰκονόμος/οἰκονομία trong bối cảnh quản trị tài sản. “Chủ” thích hợp cho κύριος chỉ nhân vật người chủ trong dụ ngôn, không gợi một tước hiệu thần học.
  issues:
  - severity: low
    issue: “sắp tước ... khỏi tay mình”
    rationale: ἀφαιρεῖται là thì hiện tại, diễn tả việc chủ đang lấy/tước chức vụ khỏi ông; “sắp” làm lệch sang sự kiện chỉ cận kề, và “khỏi tay” thêm hình ảnh không được nêu trong văn bản.
  revised_text: 'Người quản gia tự nhủ: “Mình sẽ làm gì đây, vì chủ đang tước quyền quản lý của mình? Cuốc đất thì mình không đủ sức, còn đi ăn xin thì mình xấu hổ.”'
