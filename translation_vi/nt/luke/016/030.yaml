source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: vi
  text: 'Nhưng ông ấy nói: “Không, thưa tổ phụ Áp-ra-ham, nhưng nếu có người từ cõi chết đến với họ, họ sẽ ăn năn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: Không đâu
  rationale: Diễn đạt lời phủ định mạnh nhưng vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: πάτερ Ἀβραάμ
  choice: thưa tổ phụ Áp-ra-ham
  rationale: Giữ sắc thái xưng hô kính trọng và mối liên hệ tổ tiên; “tổ phụ” tự nhiên hơn cách gọi sát chữ “cha Áp-ra-ham” trong ngữ cảnh này.
- source_word: ἀλλ’ ἐάν
  choice: Trái lại, nếu
  rationale: Thể hiện rõ sự bác bỏ và chuyển sang điều kiện mà người giàu cho là hữu hiệu.
- source_word: τις
  choice: có người
  rationale: Diễn đạt đại từ bất định số ít một cách tự nhiên.
- source_word: ἀπὸ νεκρῶν
  choice: từ cõi chết
  rationale: Cách nói tiếng Việt gọn, tự nhiên, giữ ý người ấy xuất phát từ phạm vi của những người chết; cụm Hy Lạp không nhất thiết khẳng định rõ một công thức phục sinh kỹ thuật.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: đến với họ
  rationale: Trong tiếng Việt, “đến với họ” diễn đạt tự nhiên chuyển động hướng về những người được nói đến, dù động từ Hy Lạp theo nghĩa cơ bản là “đi”.
- source_word: μετανοήσουσιν
  choice: họ sẽ ăn năn
  rationale: Trong văn mạch Lu-ca, động từ chỉ sự ăn năn, thay đổi hướng sống trước lời cảnh báo của Đức Chúa Trời, chứ không chỉ thay đổi ý kiến.
theological_decisions:
- issue: Ý nghĩa của μετανοήσουσιν
  choice: họ sẽ ăn năn
  alternative: họ sẽ thay đổi suy nghĩ
  rationale: “Ăn năn” giữ được chiều kích đạo đức và thuộc linh của μετανοέω trong Lu-ca; phương án “thay đổi suy nghĩ” dễ bị hiểu là chỉ cân nhắc lại về mặt trí óc.
- issue: Cách hiểu ἀπὸ νεκρῶν
  choice: từ cõi chết
  alternative: từ giữa những người chết
  rationale: Bản dịch chính giữ sự tự nhiên và không giải quyết quá mức việc người ấy trở về từ phạm vi người chết hay sống lại từ giữa họ.
translation_notes:
  register: Văn phong đối thoại trang trọng nhưng dễ hiểu. Dùng “ông ấy” để quy chiếu người giàu trong câu chuyện; “thưa tổ phụ Áp-ra-ham” vừa kính trọng vừa làm rõ lời viện đến quan hệ tổ tiên.
