  terminology: “Tổ phụ Áp-ra-ham” bảo toàn cách xưng hô kính trọng và quan hệ tổ tiên trong πάτερ Ἀβραάμ. “Ăn năn” là tương đương thích hợp cho μετανοήσουσιν trong văn mạch Lu-ca, tránh thu hẹp thành thay đổi ý kiến đơn thuần.
