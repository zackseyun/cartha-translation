  source_fidelity: 'Bản dịch truyền đạt đúng ý chính: lời phản bác, lời thưa với Áp-ra-ham, điều kiện một người đi từ cõi chết đến với họ, và kết quả là họ ăn năn. Tuy nhiên, dấu chấm than sau lời phủ định và cụm “Trái lại” làm lời nói tách mạnh hơn và đối lập gay gắt hơn đôi chút so với mạch συνεχ của οὐχί ... ἀλλ’ ἐάν. “Nhưng nếu” phản ánh trực tiếp hơn liên từ Hy Lạp.'
