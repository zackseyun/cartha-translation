revisions:
- from: Ngoài tất cả những điều ấy[a], giữa chúng ta và các ngươi đã có một vực thẳm lớn được ấn định, để những ai muốn từ đây sang chỗ các ngươi thì không thể, mà từ đó sang chỗ chúng ta cũng không thể được.
  to: Ngoài tất cả những điều ấy[a], giữa chúng ta và các ngươi có một vực thẳm lớn đã được thiết lập, để những ai muốn từ đây sang chỗ các ngươi không thể sang được, và cũng không ai từ đó có thể sang chỗ chúng ta.
  rationale: Chỉnh cấu trúc quanh ἐστήρικται thành “đã được thiết lập” để diễn đạt tự nhiên và chính xác trạng thái đã được xác lập, còn hiệu lực. Chỉnh hai mệnh đề về việc vượt qua thành các vế song hành, nêu rõ “không ai” ở vế thứ hai. Giữ “Ngoài tất cả những điều ấy” cùng chú thích để bảo lưu tính không hoàn toàn đơn nghĩa của ἐν πᾶσι τούτοις; không thêm diễn giải giáo lý.
  reviewer_model: gpt-5.6-terra
