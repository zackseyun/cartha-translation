  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: vi
  text: Ngoài tất cả những điều ấy[a], giữa chúng ta và các ngươi có một vực thẳm lớn đã được thiết lập, để những ai muốn từ đây sang chỗ các ngươi không thể sang được, và cũng không ai từ đó có thể sang chỗ chúng ta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong tất cả những điều ấy.” Cụm từ Hy Lạp trong ngữ cảnh có thể được hiểu theo lối thành ngữ là nêu thêm một điều cần xét đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: Ngoài tất cả những điều ấy
  rationale: Trong mạch văn, cụm này đưa thêm một lý do quyết định; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ phạm vi của πᾶσι τούτοις. Chú thích bảo lưu khả năng dịch sát cấu trúc hơn.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: giữa chúng ta và các ngươi
  rationale: Giữ rõ sự đối lập giữa hai nhóm và thể số nhiều của ὑμῶν; “các ngươi” phù hợp với lời xưng hô trang trọng trong bối cảnh dụ ngôn.
- source_word: χάσμα μέγα
  choice: một vực thẳm lớn
  rationale: “Vực thẳm” diễn đạt rõ một khoảng cách sâu rộng, không thể vượt qua; “lớn” giữ trực tiếp tính từ μέγα.
- source_word: ἐστήρικται
  choice: đã có ... được ấn định
  rationale: Thể hoàn thành bị động nói đến một sự thiết lập đã xảy ra và còn hiệu lực; “được ấn định” truyền đạt tính cố định mà không xác định tác nhân vốn không được nêu.
- source_word: ὅπως
  choice: để
  rationale: Giữ quan hệ mục đích/kết quả của mệnh đề Hy Lạp một cách gọn và tự nhiên.
- source_word: οἱ θέλοντες
  choice: những ai muốn
  rationale: Diễn đạt tự nhiên phân từ được danh từ hóa, không thêm điều kiện hay động cơ.
- source_word: διαβῆναι ἔνθεν πρὸς ὑμᾶς
  choice: từ đây sang chỗ các ngươi
  rationale: Giữ điểm nhìn của người nói và ý chuyển từ phía này sang phía kia.
- source_word: μὴ δύνωνται
  choice: không thể
  rationale: Diễn tả sự bất lực, không phải một lệnh cấm.
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: mà từ đó sang chỗ chúng ta cũng không thể được
  rationale: Giữ sự song song giữa hai hướng vượt qua; tiếng Việt lược chủ ngữ ở vế sau một cách tự nhiên mà không giới hạn chủ thể hơn nguyên văn.
theological_decisions:
- issue: Bản chất của sự phân cách giữa hai miền trong dụ ngôn
  choice: Dịch như một sự phân cách đã được ấn định và không thể vượt qua, không giải thích thêm bản thể hay địa hình của nó.
  alternative: Hiểu vực thẳm hoàn toàn theo nghĩa địa hình trong thế giới sau khi chết, hoặc chỉ coi đó là hình ảnh không hàm ý sự phân cách cố định.
  rationale: Câu này nhấn mạnh trạng thái đã được thiết lập và việc cả hai phía đều không thể vượt qua; bản dịch giữ nguyên sức nặng ấy nhưng không phát triển thành một hệ thống giáo lý vượt quá lời văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “chúng ta/các ngươi” để phản ánh các đại từ số nhiều và giữ sắc thái lời đối thoại trong dụ ngôn; tránh từ quá cổ như “bên kia qua bên này” hoặc diễn giải giáo lý ngoài câu.
