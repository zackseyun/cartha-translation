base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: vi
  text: Những người Pha-ri-si vốn yêu tiền nghe tất cả những điều ấy và chế nhạo Ngài.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhạo báng Ngài.” Động từ này có thể chỉ sự chế giễu công khai hoặc thái độ cười khẩy đầy khinh miệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: nghe
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra trong bối cảnh; tiếng Việt tự nhiên có thể giữ sắc thái này qua kết cấu toàn câu mà không cần thêm “đang”.
- source_word: δὲ
  choice: thì
  rationale: Ở đây δέ là từ nối chuyển nhẹ và tạo quan hệ với mệnh đề trước, không nhất thiết biểu thị tương phản mạnh. “Thì” nối tự nhiên với hành động kế tiếp trong tiếng Việt.
- source_word: ταῦτα πάντα
  choice: tất cả những điều ấy
  rationale: Giữ đầy đủ ý của đại từ chỉ định kết hợp với πᾶς và quy chiếu về toàn bộ lời dạy ngay trước đó.
- source_word: οἱ Φαρισαῖοι
  choice: những người Pha-ri-si
  rationale: Cách phiên âm quen thuộc và dễ hiểu trong tiếng Việt, đồng thời thể hiện số nhiều và nhóm người được xác định.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: vốn yêu tiền
  rationale: “Vốn” thể hiện đây là đặc tính sẵn có của họ, còn “yêu tiền” chuyển trực tiếp ý φιλάργυροι mà không mở rộng thành nhãn đạo đức chung chung như “tham lam”.
- source_word: ἐξεμυκτήριζον
  choice: chế nhạo
  rationale: Diễn đạt rõ hành vi nhạo báng đầy khinh miệt; cấu trúc câu tiếng Việt truyền đạt hành động trong diễn tiến mà không cần sao chép máy móc thì chưa hoàn thành.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus theo ngữ cảnh; “Ngài” là cách xưng hô trang trọng, tự nhiên trong văn bản Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Đặc tính φιλάργυροι của những người Pha-ri-si
  choice: yêu tiền
  alternative: tham tiền; tham lam
  rationale: Tiếng Hy Lạp nói cụ thể đến lòng yêu tiền. Cách dịch này giữ liên hệ trực tiếp với lời dạy về của cải trong văn cảnh và tránh diễn giải rộng hơn bản văn.
- issue: Mức độ khinh miệt trong ἐξεμυκτήριζον
  choice: chế nhạo
  alternative: nhạo báng; cười khẩy
  rationale: “Chế nhạo” vừa tự nhiên vừa giữ ý công khai giễu cợt; chú thích nêu sắc thái khinh miệt mạnh hơn mà không thu hẹp động từ vào một cử chỉ cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không thêm từ mở đầu tương đương “bấy giờ”; δέ được thể hiện nhẹ bằng cấu trúc “thì”. Dấu chú thích [a] đặt ngay sau mệnh đề chứa từ cần giải thích.
