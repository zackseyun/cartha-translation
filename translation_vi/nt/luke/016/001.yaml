- from: 'Ngài cũng nói với các môn đồ: “Có một người giàu kia có một quản gia[a]. Người này bị tố cáo với chủ rằng đã phung phí tài sản của ông.”[b]'
  to: 'Ngài cũng nói với các môn đồ: “Có một người giàu kia có một quản gia[a]. Người này bị tố cáo[b] với người giàu ấy là đang phung phí tài sản của ông.”'
  rationale: Chỉnh nhẹ để quy chiếu αὐτῷ trực tiếp về người giàu và để «đang phung phí» phản ánh phân từ hiện tại. Dời ký hiệu chú thích [b] sát «bị tố cáo» để neo chú thích chính xác vào từ được giải thích. Không thay đổi ý nghĩa của câu.
