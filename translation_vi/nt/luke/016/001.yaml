    issue: «với chủ» diễn giải αὐτῷ
    rationale: Nguyên ngữ chỉ nói lời tố cáo được trình lên «ông ấy», tức người giàu. «Với người giàu ấy» giữ quy chiếu minh thị mà không thêm danh xưng «chủ».
  - severity: low
    issue: «đã phung phí» làm yếu sắc thái hiện tại của διασκορπίζων
    rationale: Phân từ hiện tại mô tả hành vi bị cáo buộc là đang diễn ra; «đang phung phí» phản ánh sắc thái này tự nhiên hơn trong tiếng Việt.
