source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: vi
  text: 'Ngài cũng nói với các môn đồ: “Có một người giàu kia có một quản gia[a]. Người này bị tố cáo[b] với người giàu ấy là đang phung phí tài sản của ông.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người quản lý”; từ Hy Lạp chỉ người được giao trông coi một gia đình hoặc điền sản.
    reason: lexical_alternative
  - marker: b
    text: “Bị tố cáo” cũng có thể dịch là “bị báo cáo” hoặc “bị tố giác”; từ này không nhất thiết cho biết lời cáo buộc đã được chứng minh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ngài ... nói
  rationale: Thì chưa hoàn thành tạo bối cảnh cho lời kể đang tiếp diễn; tiếng Việt tự nhiên không cần dùng kết cấu nặng nề như “đang nói” trong câu dẫn này.
- source_word: δὲ καὶ
  choice: cũng
  rationale: “Cũng” thể hiện καί; δέ chủ yếu đánh dấu chuyển tiếp và có thể không dịch riêng để câu tiếng Việt tự nhiên.
- source_word: πρὸς τοὺς μαθητάς
  choice: với các môn đồ
  rationale: Giữ mạo từ xác định theo ngữ cảnh mà không thêm đại từ sở hữu vốn không có trong bản Hy Lạp.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: Có một người giàu kia
  rationale: Cách mở đầu tự nhiên trong truyện dụ ngôn, giữ sắc thái một nhân vật không nêu tên nhưng cụ thể.
- source_word: οἰκονόμον
  choice: quản gia
  rationale: Chỉ người được giao quản lý nhà cửa hoặc tài sản; “quản gia” vừa quen thuộc vừa phù hợp bối cảnh điền sản.
- source_word: οὗτος
  choice: Người này
  rationale: Giữ lực quy chiếu rõ của đại từ chỉ định về người quản gia.
- source_word: διεβλήθη αὐτῷ
  choice: bị tố cáo với chủ
  rationale: Giữ ý một lời cáo buộc hoặc báo cáo bất lợi được đưa đến người giàu, nhưng không hàm ý cáo buộc đã được chứng minh.
- source_word: ὡς διασκορπίζων
  choice: rằng đã phung phí
  rationale: Diễn đạt tự nhiên nội dung cáo buộc; “phung phí” phù hợp ngữ cảnh tài sản hơn nghĩa đen “làm phân tán”.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: tài sản của ông
  rationale: Chỉ những gì thuộc về người giàu; “tài sản” là cách nói hiện đại, rộng và rõ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “môn đồ” theo ngữ vực Kinh Thánh quen thuộc; “quản gia” diễn đạt vai trò quản trị tài sản rõ hơn một thuật ngữ cổ. Đưa chú thích [b] sau toàn bộ mệnh đề để làm rõ sắc thái của “bị tố cáo”.
