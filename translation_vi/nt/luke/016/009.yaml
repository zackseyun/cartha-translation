source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: vi
  text: 'Ta nói với các con: Hãy dùng của cải bất chính[a] để kết bạn cho mình, để khi của cải ấy không còn nữa[b], họ sẽ đón tiếp các con vào những nơi ở đời đời[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “từ ma-môn của sự bất chính.” “Ma-môn” là cách phiên âm truyền thống của từ Hy Lạp chỉ tiền của hay của cải. “Của cải bất chính” không nhất thiết chỉ tài sản kiếm được bằng gian lận.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “khi các con qua đời,” hoặc “khi nó cạn hết.” Động từ Hy Lạp không nêu rõ chủ ngữ; nhiều người hiểu là của cải không còn, còn một số người hiểu là con người qua đời.'
    reason: alternative_reading
  - marker: c
    text: 'Sát chữ: “vào những căn lều đời đời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: hãy ... kết bạn cho mình
  rationale: Diễn đạt tự nhiên mệnh lệnh aorist cùng đại từ phản thân, đồng thời giữ ý chủ động tạo lập các mối quan hệ.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: dùng của cải bất chính
  rationale: “Dùng” thể hiện nghĩa phương tiện của ἐκ trong ngữ cảnh. “Của cải” truyền đạt μαμωνᾶς rõ ràng hơn từ vay mượn “Ma-môn”; “bất chính” giữ phạm vi rộng của ἀδικία, không thu hẹp thành tiền do gian lận mà có.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: để khi của cải ấy không còn nữa
  rationale: Hiểu chủ ngữ ngầm gần nhất là của cải; “không còn nữa” diễn đạt động từ nội động ἐκλείπω một cách tự nhiên. Chú thích bảo lưu cách hiểu “khi các con không còn nữa/qua đời”.
- source_word: δέξωνται ὑμᾶς
  choice: họ sẽ đón tiếp các con
  rationale: “Đón tiếp” thể hiện sắc thái tiếp nhận đầy lòng hiếu khách của δέχομαι. Đại từ “họ” không xác định danh tính, như chính bản Hy Lạp.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: vào những nơi ở đời đời
  rationale: “Nơi ở” truyền đạt nghĩa theo ngữ cảnh của σκηναί bằng tiếng Việt tự nhiên; hình ảnh sát chữ “lều” được giữ trong chú thích. “Đời đời” diễn đạt αἰωνίους theo cách quen thuộc, trang trọng.
theological_decisions:
- issue: Ý nghĩa của “của cải bất chính”
  choice: Giữ cụm từ rộng, có thể chỉ của cải thuộc trật tự đời này vốn mang dấu ấn bất chính, chứ không nhất thiết chỉ tài sản kiếm được bằng gian lận.
  alternative: Của cải do hành vi bất lương mà có; hoặc Ma-môn được nhân cách hóa như một ông chủ đối nghịch.
  rationale: Cách dịch không thu hẹp ἀδικία vào nguồn gốc phi pháp của tài sản và cũng không buộc người đọc phải hiểu μαμωνᾶς là một nhân vật được nhân cách hóa.
- issue: Chủ ngữ của ἐκλίπῃ
  choice: Của cải không còn nữa.
  alternative: Các con không còn nữa, tức là qua đời; hoặc nguồn lực trần thế nói chung cạn hết.
  rationale: μαμωνᾶς là tiền ngữ gần và tự nhiên nhất, nhưng bản Hy Lạp không nêu chủ ngữ một cách minh nhiên; vì vậy cách hiểu khác được bảo lưu trong chú thích.
- issue: Danh tính của “họ” trong δέξωνται
  choice: Để ngỏ, không xác định.
  alternative: Những người bạn có được nhờ việc sử dụng của cải; người nghèo hoặc dân Chúa; các hữu thể trên trời.
  rationale: Bản Hy Lạp dùng động từ ngôi thứ ba số nhiều nhưng không nêu rõ chủ thể. Việc thêm một danh tính cụ thể sẽ giải thích quá mức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “Ta—các con” phù hợp lời Đức Giê-su nói với các môn đồ trong ngữ cảnh, không thêm danh xưng thần học. Câu giữ nguyên sự mơ hồ về danh tính của “họ” và dùng chú thích để bảo lưu các khả năng thực sự có trong nguyên ngữ.
