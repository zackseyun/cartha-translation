    issue: “năm người anh em” không biểu thị rõ giới tính nam
    rationale: ἀδελφούς là số nhiều giống đực và trong ngữ cảnh chỉ năm người anh/em trai. “Anh em” trong tiếng Việt hiện đại có thể được hiểu theo nghĩa bao gồm cả nam lẫn nữ.
  - severity: low
    issue: “nghiêm nghị cảnh báo” chưa tự nhiên
    rationale: “Nghiêm nghị” thường mô tả thái độ của người nói hơn là bổ nghĩa trực tiếp cho hành động “cảnh báo.” “Tha thiết cảnh báo” tự nhiên hơn và phù hợp với lực ngữ cảnh của διαμαρτύρηται.
  revised_text: vì tôi có năm người anh em trai, để người ấy tha thiết cảnh báo họ[a], hầu cho họ cũng không đến nơi đau đớn này.’
