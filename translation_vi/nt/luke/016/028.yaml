review_pass:
  verdict: revise
  source_fidelity: Cần nêu rõ ἀδελφούς là “anh em trai,” không chỉ “anh em,” vì tiếng Việt có thể hiểu từ này bao gồm cả chị em gái. Động từ διαμαρτύρηται trong ngữ cảnh này phù hợp với lời cảnh báo khẩn thiết; “nghiêm nghị cảnh báo” không phải là kết hợp tự nhiên trong tiếng Việt.
  naturalness: “Tha thiết cảnh báo” tự nhiên, trang nghiêm, và truyền đạt tính khẩn thiết của lời cảnh báo. “Hầu cho” vẫn phù hợp với văn phong Kinh Thánh hiện đại và diễn tả đúng mục đích phủ định.
  terminology: Giữ “nơi đau đớn này” để chuyển tải τόπος τῆς βασάνου mà không thêm một thuật ngữ giáo lý hệ thống. Chú thích điều chỉnh cách diễn đạt phương án “làm chứng” cho tự nhiên và sát quan hệ với người được cảnh báo.
  issues:
