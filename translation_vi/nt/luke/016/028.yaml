source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: vi
  text: vì tôi có năm người anh em trai, để người ấy tha thiết cảnh báo họ[a], hầu cho họ cũng không đến nơi đau đớn này.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “long trọng làm chứng trước họ” hoặc “mạnh mẽ cảnh báo họ.” Động từ Hy Lạp mang ý nghĩa làm chứng cách long trọng hoặc cảnh báo cách khẩn thiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: vì tôi có
  rationale: γάρ nối lời giải thích này với lời thỉnh cầu ở câu trước; “vì” tự nhiên trong tiếng Việt và giữ rõ quan hệ nguyên nhân.
- source_word: πέντε ἀδελφούς
  choice: năm người anh em
  rationale: ἀδελφούς là số nhiều giống đực, chỉ năm anh/em trai; “anh em” là cách gọi tự nhiên trong tiếng Việt khi không rõ thứ bậc tuổi tác.
- source_word: ὅπως
  choice: để
  rationale: ὅπως biểu thị mục đích; “để” ngắn gọn, tự nhiên và rõ nghĩa.
- source_word: διαμαρτύρηται
  choice: nghiêm nghị cảnh báo
  rationale: διαμαρτύρομαι có thể mang nghĩa làm chứng long trọng hoặc tha thiết cảnh báo. Ngữ cảnh tránh nơi đau đớn này nghiêng về ý cảnh báo, còn “nghiêm nghị” giữ sắc thái trang trọng, mạnh mẽ của động từ.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: hầu cho họ cũng không đến
  rationale: ἵνα μή diễn tả mục đích phủ định, còn καὶ αὐτοὶ nhấn mạnh “họ cũng”; “hầu cho” tránh lặp “để” và phù hợp văn phong trang nghiêm mà vẫn dễ hiểu.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: đến nơi đau đớn này
  rationale: εἰς diễn tả hướng đến; βάσανος chỉ sự đau đớn, khổ sở dữ dội. Cách dịch này giữ mô tả của câu mà không bổ sung một hệ thống giáo lý về đời sau.
theological_decisions:
- issue: Cách diễn đạt địa điểm đời sau trong lời người giàu
  choice: nơi đau đớn này
  alternative: nơi hành hạ này; nơi thống khổ này
  rationale: βάσανος mô tả tình trạng đau đớn hoặc hành hạ. “Nơi đau đớn này” truyền đạt cường độ của trải nghiệm nhưng không mở rộng câu thành một khẳng định giáo lý chi tiết hơn nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang nghiêm và dễ hiểu. Dùng “anh em” vì nguyên văn chỉ anh/em trai nhưng không cho biết ai lớn hay nhỏ tuổi hơn. Dùng “hầu cho” để thể hiện mục đích phủ định và tránh lặp từ.
