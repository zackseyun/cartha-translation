base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: vi
  text: Vậy, nếu anh em không trung tín đối với của cải bất chính[a], thì ai sẽ giao của cải đích thực[b] cho anh em?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn Hy Lạp: “ma-môn bất chính”; cũng có thể dịch: “của cải không công chính.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “điều đích thực”; “của cải” được bổ sung theo sự đối lập với của cải ở vế trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: bất chính
  rationale: Giữ sắc thái đạo đức của ἄδικος là ‘không công chính/bất chính’, nhưng không thu hẹp nghĩa thành của cải nhất thiết có được bằng gian lận.
- source_word: μαμωνᾷ
  choice: của cải
  rationale: μαμωνᾶς chỉ tiền của hoặc tài sản nói chung; ‘của cải’ tự nhiên trong tiếng Việt và rộng hơn ‘tiền bạc’.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: trong việc sử dụng của cải bất chính
  rationale: ἐν xác định lĩnh vực trong đó sự trung tín được bày tỏ. Cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ ý quản lý của cải theo văn cảnh.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: không trung tín
  rationale: Cụm từ mô tả việc không tỏ ra đáng tin trong trách nhiệm được giao; ‘trung tín’ phù hợp với chủ đề quản gia.
- source_word: τὸ ἀληθινὸν
  choice: của cải chân thật
  rationale: Tính từ trung tính được dùng như danh từ, đối lập với μαμωνᾶς. Bổ sung ‘của cải’ giúp tiếng Việt rõ và tự nhiên, đồng thời ghi chú dạng sát chữ.
- source_word: πιστεύσει
  choice: sẽ giao ... cho
  rationale: πιστεύω với vật làm tân ngữ và người nhận ở gián cách có nghĩa là giao phó, chứ không phải tin một mệnh đề.
theological_decisions:
- issue: Ý nghĩa của τὸ ἀληθινὸν đối lập với của cải bất chính
  choice: của cải chân thật
  alternative: điều chân thật
  rationale: Bản Hy Lạp để danh từ hàm ẩn; sự đối lập trực tiếp với μαμωνᾶς cho phép hiểu là của cải đích thực. Chú thích bảo lưu tính hàm ẩn của nguyên văn mà không xác định thêm bản chất thần học của của cải ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng ‘anh em’ cho đại từ số nhiều ὑμῖν; tránh từ phiên âm ‘Ma-môn’ trong chính văn nhưng giữ trong chú thích để phản ánh hình thức Hy Lạp.
