    rationale: ἐν τῷ ἀδίκῳ μαμωνᾷ nêu phạm vi/liên hệ ‘với/trong của cải bất chính’, chứ không trực tiếp nêu hành động sử dụng. “Đối với” tự nhiên trong tiếng Việt và ít diễn giải hơn.
  - severity: low
    issue: “của cải chân thật” có thể chưa chuyển tải rõ sắc thái ‘đích thực/thật’ của ἀληθινόν.
    rationale: Trong sự tương phản với μαμωνᾶς bất chính, “của cải đích thực” là cách nói tự nhiên hơn và làm rõ đây là của cải thật theo nghĩa genuine, không phải đặc tính ‘chân thật’ theo nghĩa không gian dối.
