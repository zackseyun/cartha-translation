- from: Vậy, nếu anh em không trung tín trong việc sử dụng của cải bất chính[a], thì ai sẽ giao của cải chân thật[b] cho anh em?
  to: Vậy, nếu anh em không trung tín đối với của cải bất chính[a], thì ai sẽ giao của cải đích thực[b] cho anh em?
  rationale: Chỉnh “trong việc sử dụng” thành “đối với” để tránh thêm một hành động không được nói rõ trong nguyên văn, dù vẫn phù hợp văn cảnh quản gia. Chỉnh “chân thật” thành “đích thực” để phản ánh tự nhiên hơn ἀληθινόν trong đối lập với của cải bất chính. Chú thích b được điều chỉnh tương ứng để bảo lưu danh từ hàm ẩn của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:21Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc điều kiện và các ý chính: sự không trung tín liên quan đến μαμωνᾶς bất chính, cùng câu hỏi về việc được giao τὸ ἀληθινόν. Tuy nhiên, “trong việc sử dụng” diễn giải rõ hơn nguyên ngữ, vốn chỉ nêu lĩnh vực/liên hệ với của cải; “đối với” giữ ý trung tín trong sự quản lý của cải mà không thêm hành động cụ thể. “Của cải đích thực” diễn đạt tự nhiên và chính xác hơn sắc thái ‘thật/genuine’ của ἀληθινόν trong thế đối lập này.'
  naturalness: Câu văn hiện đại, trang trọng và rõ ràng. “Của cải đích thực” tự nhiên hơn “của cải chân thật,” vốn có thể gợi nghĩa của cải không nói dối hơn là của cải thật, chân chính.
  terminology: “Trung tín,” “của cải,” và “giao ... cho” phù hợp văn mạch quản gia và nghĩa của πιστοί, μαμωνᾷ, πιστεύσει. Giữ “bất chính” bảo toàn sắc thái đạo đức của ἀδίκῳ mà không thu hẹp thành của cải do gian lận.
  issues:
