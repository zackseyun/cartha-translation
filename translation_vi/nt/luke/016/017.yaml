source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: vi
  text: Nhưng trời đất qua đi còn dễ hơn là một nét nhỏ của Luật pháp bị mất đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “rơi”; “một nét nhỏ” chỉ một nét rất nhỏ trong hình dạng của một chữ viết.'
    reason: Bảo lưu hình ảnh nghĩa đen của πεσεῖν và giải thích κεραία.
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: còn dễ hơn
  rationale: Diễn đạt tự nhiên cấu trúc so sánh, giữ nghĩa “dễ hơn” hay “dễ xảy ra hơn”.
- source_word: δέ
  choice: Nhưng
  rationale: Thể hiện sắc thái tương phản nhẹ với mạch văn trước.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: trời đất
  rationale: Giữ thành ngữ Kinh Thánh chỉ toàn thể trật tự thọ tạo; tiếng Việt tự nhiên không cần liên từ.
- source_word: παρελθεῖν
  choice: qua đi
  rationale: Chỉ sự tiêu biến hoặc chấm dứt, đồng thời giữ hình ảnh của nguyên văn.
- source_word: τοῦ νόμου
  choice: Luật pháp
  rationale: Trong ngữ cảnh này, νόμος chỉ Luật pháp trong Kinh Thánh chứ không phải luật nói chung.
- source_word: μίαν κεραίαν
  choice: một nét nhỏ
  rationale: κεραία là nét hoặc dấu rất nhỏ thuộc hình dạng một chữ; cách dịch này rõ ràng, hiện đại và không quá diễn giải.
- source_word: πεσεῖν
  choice: mất hiệu lực
  rationale: Nghĩa đen là “rơi”; trong ngữ cảnh, hình ảnh nói đến việc một chi tiết nhỏ nhất của Luật pháp bị mất giá trị. Cách dịch này làm rõ ý nghĩa theo tiếng Việt tự nhiên, còn chú thích bảo lưu nghĩa đen.
theological_decisions:
- issue: Sở chỉ của νόμος
  choice: Luật pháp trong Kinh Thánh
  alternative: luật nói chung
  rationale: Ngữ cảnh Do Thái và lời khẳng định về từng nét chữ cho thấy Luật pháp được mặc khải là sở chỉ tự nhiên nhất; bản dịch không xác định hẹp hơn là phần nào của Luật pháp.
- issue: Ý nghĩa của πεσεῖν
  choice: mất hiệu lực
  alternative: rơi xuống; mất đi
  rationale: Bản dịch diễn đạt tác dụng tu từ của động từ trong ngữ cảnh nhưng dùng chú thích để giữ nghĩa đen và tránh che khuất hình ảnh nguyên bản.
- issue: Mức độ nhỏ bé của κεραία
  choice: một nét nhỏ
  alternative: một dấu nhỏ; một nét phân biệt chữ cái
  rationale: Giữ trọng tâm rằng ngay cả chi tiết chữ viết nhỏ nhất của Luật pháp cũng không mất hiệu lực, mà không áp đặt một hệ chữ cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Luật pháp” được viết hoa để chỉ Luật pháp trong Kinh Thánh. Cấu trúc “còn dễ hơn” giữ lực so sánh của câu Hy Lạp.
