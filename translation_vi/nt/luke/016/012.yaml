review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng cấu trúc điều kiện, tính từ πιστοί theo nghĩa đáng tin cậy/trung tín, và sự đối lập cố ý không xác định giữa τῷ ἀλλοτρίῳ và τὸ ὑμέτερον. Tuy nhiên, cụm “trong việc sử dụng” thêm một hành động không có trong nguyên văn; ἐν τῷ ἀλλοτρίῳ chỉ nói “trong/đối với điều thuộc về người khác.”
  naturalness: Câu sửa vẫn giữ văn phong hiện đại, trang trọng, và câu hỏi tu từ tự nhiên. “Trong những gì thuộc về người khác” hơi sát cấu trúc nguyên ngữ nhưng rõ nghĩa và tránh thêm diễn giải; “ai sẽ cho anh em” là cách nói thông dụng, trực tiếp.
  terminology: “Trung tín” phù hợp với πιστοί trong bối cảnh trách nhiệm quản lý. “Những gì thuộc về người khác” và “những gì là của anh em” giữ được hai cụm danh từ hóa số trung của tiếng Hy Lạp và không áp đặt cách đồng nhất chúng với của cải trần gian hay cơ nghiệp tương lai.
  issues:
  - severity: medium
    issue: Thêm ý “việc sử dụng” vào mệnh đề chỉ phạm vi.
    rationale: Nguyên văn καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε không nêu động từ “sử dụng”; việc thêm động từ này hướng độc giả đến một cách hiểu cụ thể về sự quản lý. Nên giữ phạm vi khái quát là “trong những gì thuộc về người khác.”
  - severity: low
    issue: Từ “chính” trong “thuộc về chính anh em” thêm sắc thái nhấn mạnh.
    rationale: τὸ ὑμέτερον đã biểu thị “điều là của anh em”; sự đối lập với ἀλλότριον nằm ở tính sở hữu, không cần tăng cường bằng “chính.”
