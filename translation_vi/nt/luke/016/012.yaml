source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: vi
  text: Và nếu anh em không trung tín trong những gì thuộc về người khác[a][c], thì ai sẽ cho anh em những gì là của anh em[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tài sản của người khác.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “những gì thuộc về anh em.”'
    reason: lexical_alternative
  - marker: c
    text: Sự tương phản có thể nói đến việc trung tín với của cải đời này và việc nhận lãnh của cải chân thật hoặc bền vững về sau; tuy nhiên, chính câu này không nói rõ các đối tượng ấy là gì.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ
  choice: Và nếu
  rationale: Giữ liên kết với câu trước và mở đầu mệnh đề điều kiện một cách tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ ἀλλοτρίῳ
  choice: trong việc sử dụng những gì thuộc về người khác
  rationale: ἀλλότριος ở giống trung số ít có mạo từ được dùng như danh từ, chỉ điều thuộc về người khác. Cụm “trong việc sử dụng” làm rõ chức năng của ἐν trong ngữ cảnh quản lý mà không xác định cụ thể tài sản ấy là gì.
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: không trung tín
  rationale: πιστός ở đây nói đến sự đáng tin cậy trong trách nhiệm quản lý, không phải hành vi tin. Tiếng Việt tự nhiên không cần dịch riêng nét “trở nên/tỏ ra” của ἐγένεσθε.
- source_word: τὸ ὑμέτερον
  choice: những gì thuộc về chính anh em
  rationale: Cách diễn đạt danh từ hóa, giữ rõ sự tương phản với “những gì thuộc về người khác”; “chính” nhấn mạnh ý sở hữu vốn có trong ὑμέτερον.
- source_word: δώσει ὑμῖν
  choice: sẽ trao cho anh em
  rationale: “Trao” giữ nghĩa cơ bản là ban/giao cho, đồng thời phù hợp với ngữ cảnh quản lý mà không diễn giải mạnh thành “giao phó”.
- source_word: τίς
  choice: ai
  rationale: Chuyển trực tiếp câu hỏi tu từ trong bản Hy Lạp sang cách nói tự nhiên của tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của sự tương phản giữa “những gì thuộc về người khác” và “những gì thuộc về chính anh em”
  choice: Giữ các đối tượng quy chiếu không được xác định trong chính văn.
  alternative: Có thể hiểu là của cải đời này đối lập với của cải chân thật hoặc bền vững; cũng có thể hiểu là trách nhiệm quản lý hiện tại đối lập với cơ nghiệp tương lai.
  rationale: Câu Hy Lạp nêu sự tương phản nhưng không tự xác định các đối tượng. Không thu hẹp câu vào một cách giải nghĩa thần học duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμεῖς theo lối xưng hô quen thuộc trong diễn từ Kinh Thánh; giữ hình thức câu hỏi tu từ và tính hàm ẩn của nguyên văn.
