- from: Và nếu anh em không trung tín trong việc sử dụng những gì thuộc về người khác[a][c], thì ai sẽ trao cho anh em những gì thuộc về chính anh em[b]?
  to: Và nếu anh em không trung tín trong những gì thuộc về người khác[a][c], thì ai sẽ cho anh em những gì là của anh em[b]?
  rationale: Bản sửa loại bỏ ý “sử dụng,” vốn không được diễn đạt trong tiếng Hy Lạp, và bỏ sắc thái nhấn mạnh không cần thiết của “chính.” Các đối tượng của hai vế tương phản vẫn được để mở, đúng với nguyên văn và với lưu ý diễn giải trong chú thích.
