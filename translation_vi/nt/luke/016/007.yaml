  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: vi
  text: 'Rồi người quản gia nói với một người khác: “Còn ông, ông nợ bao nhiêu?” Người ấy đáp: “Một trăm co-rơ lúa mì.” Người quản gia nói với ông: “Hãy lấy giấy nợ của ông[a] và viết tám mươi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “văn tự của ông” hoặc “giấy tờ của ông”; tiếng Hy Lạp là “các văn bản”, tại đây chỉ chứng từ ghi khoản nợ.
    reason: lexical_alternative
  - marker: b
    text: Co-rơ là một đơn vị đo dung tích lớn thời xưa, dùng cho ngũ cốc.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπειτα
  choice: Rồi
  rationale: Diễn tả bước kế tiếp trong trình tự câu chuyện một cách tự nhiên và gọn.
- source_word: ἑτέρῳ
  choice: với một người khác
  rationale: Giữ ý đây là một con nợ khác với người trước, không thêm giới tính vốn không được nói rõ trong từ Hy Lạp.
- source_word: Σὺ δὲ
  choice: Còn ông
  rationale: Thể hiện đại từ nhấn mạnh cùng sắc thái chuyển nhẹ của δέ, đồng thời phù hợp với lời đối thoại lịch sự trong tiếng Việt.
- source_word: πόσον ὀφείλεις
  choice: ông nợ bao nhiêu
  rationale: Cách nói hiện đại, rõ ràng cho nghĩa mắc nợ tài chính của ὀφείλω.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Một trăm co-rơ lúa mì
  rationale: Phiên âm đơn vị đo cổ κόρος để không thay nó bằng một đơn vị hiện đại thiếu chắc chắn; σῖτος trong ngữ cảnh được dịch là lúa mì.
- source_word: λέγει αὐτῷ
  choice: Người quản gia nói với ông
  rationale: Tiếng Việt thường dùng hiện tại kể chuyện kém tự nhiên hơn tiếng Hy Lạp; dùng “nói” không đánh dấu thì vẫn tạo mạch kể tự nhiên và làm rõ chủ thể.
- source_word: Δέξαι
  choice: Hãy lấy
  rationale: Diễn đạt mệnh lệnh nhận/lấy chứng từ trong ngữ cảnh giao dịch.
- source_word: σου τὰ γράμματα
  choice: giấy nợ của ông
  rationale: Dạng số nhiều Hy Lạp nghĩa đen là “các văn bản/giấy tờ”, nhưng tại đây chỉ chứng từ ghi khoản nợ; “giấy nợ” truyền đạt chức năng tự nhiên trong tiếng Việt, còn nghĩa sát được giữ ở chú thích.
- source_word: γράψον ὀγδοήκοντα
  choice: viết tám mươi
  rationale: Giữ sát hành động ghi con số mới vào chứng từ mà không diễn giải thêm thành “sửa lại” hay “ghi thành”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” trong đối thoại để tự nhiên, không hàm ý giới tính từ riêng ἑτέρῳ; danh tính nam được suy ra từ ngữ cảnh đại từ Hy Lạp tiếp theo. Hai dấu chú thích đều được đặt trong chính văn; chú thích đơn vị đo gắn sau toàn câu chứa “co-rơ” để tránh chen ngang lời thoại.
