source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: vi
  text: Anh em muốn người ta làm cho mình thế nào thì cũng hãy làm cho họ như vậy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: không dịch riêng
  rationale: Ở đây καὶ nối tiếp mạch lời dạy. Trong tiếng Việt, mở câu bằng “và” sẽ kém tự nhiên; sự tiếp nối vẫn rõ trong văn cảnh.
- source_word: καθὼς
  choice: thế nào… như vậy
  rationale: Cấu trúc tương liên tự nhiên trong tiếng Việt, giữ nguyên lực so sánh và chuẩn mực tương ứng của καθὼς.
- source_word: θέλετε
  choice: muốn
  rationale: Diễn đạt trực tiếp mong muốn hoặc điều người nghe mong người khác làm, bằng từ thông dụng và đúng sắc thái.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: người ta làm cho mình
  rationale: Với θέλετε, ἵνα giới thiệu nội dung của điều mong muốn. Cách diễn đạt này tự nhiên trong tiếng Việt; “làm” giữ nghĩa rộng của ποιέω và “cho mình” thể hiện hướng của hành động.
- source_word: οἱ ἄνθρωποι
  choice: người ta
  rationale: Cụm từ chỉ con người nói chung, không riêng nam giới. “Người ta” là cách nói tự nhiên, mang nghĩa khái quát trong ngữ cảnh này.
- source_word: ποιεῖτε
  choice: hãy làm
  rationale: Thể mệnh lệnh hiện tại được chuyển bằng “hãy làm”, diễn đạt mệnh lệnh đạo đức mà không cường điệu hóa sắc thái thể.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Tương ứng với ὑμῖν (“cho mình”), giữ rõ tính có đi có lại của câu.
- source_word: ὁμοίως
  choice: cũng… như vậy
  rationale: Diễn đạt hành động tương ứng, đồng thời tạo cấu trúc tiếng Việt cân xứng với “thế nào” ở vế trước.
theological_decisions:
- issue: Phạm vi chỉ người của οἱ ἄνθρωποι
  choice: người ta
  alternative: người khác; loài người
  rationale: Danh từ ở đây mang nghĩa khái quát, không giới hạn ở nam giới. “Người ta” truyền đạt đúng phạm vi ấy mà không thêm sắc thái giới tính.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” dùng để xưng hô với số nhiều theo văn cảnh lời dạy, không nhằm giới hạn người nghe theo giới tính. Cấu trúc “thế nào… như vậy” giữ tính cân xứng nổi bật của nguyên văn.
