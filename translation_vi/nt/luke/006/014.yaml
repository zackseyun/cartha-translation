source:
  edition: SBLGNT
  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: vi
  text: Si-môn, người mà Ngài cũng đặt tên là Phi-e-rơ; Anh-rê, người anh em của Si-môn; Gia-cơ; Giăng; Phi-líp; và Ba-thê-lê-my,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Si-môn
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, phản ánh Σίμων và phân biệt với dạng Si-mê-ôn ở những ngữ cảnh khác.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: người mà Ngài cũng đặt tên là Phi-e-rơ
  rationale: “Đặt tên” diễn đạt hành động ban hoặc gán tên rõ hơn “gọi”; καί được giữ bằng “cũng”.
- source_word: Πέτρον
  choice: Phi-e-rơ
  rationale: Dạng phiên âm đã quen thuộc của Πέτρος trong Kinh Thánh tiếng Việt.
- source_word: Ἀνδρέαν
  choice: Anh-rê
  rationale: Dạng phiên âm hiện hành và dễ nhận biết của Ἀνδρέας.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: em trai ông
  rationale: ἀδελφός chỉ anh hoặc em trai; quan hệ đã biết giữa Anh-rê và Si-môn cho phép diễn đạt tự nhiên là “em trai ông”, với “ông” quy chiếu về Si-môn.
- source_word: Ἰάκωβον
  choice: Gia-cơ
  rationale: Dạng tên Tân Ước quen thuộc trong tiếng Việt cho Ἰάκωβος.
- source_word: Ἰωάννην
  choice: Giăng
  rationale: Dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt cho Ἰωάννης.
- source_word: Φίλιππον
  choice: Phi-líp
  rationale: Phiên âm tự nhiên, quen thuộc của Φίλιππος.
- source_word: Βαρθολομαῖον
  choice: Ba-thê-lê-my
  rationale: Dạng phiên âm Kinh Thánh tiếng Việt quen thuộc của Βαρθολομαῖος.
- source_word: καὶ
  choice: dấu chấm phẩy trong phần lớn danh sách; “và” trước tên cuối
  rationale: Tiếng Hy Lạp dùng καί lặp lại để nối danh sách; tiếng Việt hiện đại tự nhiên hơn khi dùng dấu câu và giữ “và” trước mục cuối, không làm thay đổi quan hệ phối hợp.
theological_decisions:
- issue: Chủ thể ẩn của ὠνόμασεν
  choice: Ngài
  alternative: ông ấy / người
  rationale: Động từ tiếp nối chủ thể là Chúa Giê-su từ câu trước. Viết “Ngài” giúp tiếng Việt rõ nghĩa và giữ văn phong tôn kính, nhưng không thêm danh xưng thần học vào câu.
- issue: Phân biệt tên Si-môn và Phi-e-rơ
  choice: giữ cấu trúc đặt tên
  alternative: người còn gọi là Phi-e-rơ
  rationale: Cấu trúc Hy Lạp nhấn mạnh hành động Chúa Giê-su đặt tên, không chỉ nêu một tên gọi khác.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. Dùng các dạng tên riêng quen thuộc trong Kinh Thánh tiếng Việt; dấu chấm phẩy giúp danh sách dễ đọc. Câu này tiếp tục sang câu sau nên kết thúc bằng dấu phẩy.
