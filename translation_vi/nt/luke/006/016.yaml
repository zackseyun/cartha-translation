source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: vi
  text: và Giu-đa, con Gia-cơ[a], cùng Giu-đa Ích-ca-ri-ốt, người đã trở thành kẻ phản bội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giu-đa, anh/em của Gia-cơ”; tiếng Hy Lạp chỉ nói: “Giu-đa của Gia-cơ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Giu-đa, con Gia-cơ
  rationale: Cụm sở hữu cách Hy Lạp chỉ nói sát nghĩa là “Giu-đa của Gia-cơ,” để ngỏ quan hệ cụ thể. Trong danh sách các sứ đồ, bổ sung “con” tạo câu tiếng Việt tự nhiên và là cách hiểu có khả năng hơn; chú thích vẫn bảo lưu khả năng “anh/em của Gia-cơ.”
- source_word: Ἰσκαριὼθ
  choice: Ích-ca-ri-ốt
  rationale: Đây là tên gọi riêng, được phiên âm theo cách quen dùng trong tiếng Việt thay vì dịch nghĩa.
- source_word: ὃς ἐγένετο
  choice: người đã trở thành
  rationale: Giữ lực diễn tiến của ἐγένετο (“trở thành”), thay vì làm phẳng thành trạng thái “là.” “Đã” phù hợp với góc nhìn hồi thuật của câu.
- source_word: προδότης
  choice: kẻ phản bội
  rationale: Diễn đạt tự nhiên danh từ chỉ người phản bội; giữ sắc thái định danh và lên án của nguyên ngữ.
- source_word: καὶ
  choice: và; cùng
  rationale: Các liên từ nối hai tên cuối danh sách. Dùng “và” rồi “cùng” để câu tiếng Việt trôi chảy mà vẫn bảo toàn quan hệ phối hợp.
theological_decisions:
- issue: Quan hệ được hàm ý bởi Ἰακώβου trong cụm “Giu-đa của Gia-cơ”
  choice: Dịch trong chính văn là “Giu-đa, con Gia-cơ”
  alternative: “Giu-đa, anh/em của Gia-cơ” hoặc dịch sát nhưng không tự nhiên là “Giu-đa của Gia-cơ”
  rationale: Sở hữu cách Hy Lạp không nói rõ quan hệ. “Con Gia-cơ” là cách bổ sung tự nhiên và có khả năng hơn trong danh sách nhân danh, nhưng không nên biến suy đoán ngữ pháp thành điều chắc chắn; vì vậy phương án “anh/em” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cách phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Cụm “người đã trở thành kẻ phản bội” bảo toàn chuyển biến trong động từ Hy Lạp, còn chú thích công khai sự mơ hồ về quan hệ gia đình.
