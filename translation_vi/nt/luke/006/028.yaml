  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: vi
  text: Hãy chúc phước cho những người nguyền rủa anh em; hãy cầu nguyện cho những người đối xử tệ với anh em.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người lăng mạ anh em” hoặc “những người ngược đãi anh em.” Động từ Hy Lạp có thể bao quát nhiều hình thức đối xử thù nghịch.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Hãy chúc phước
  rationale: Mệnh lệnh số nhiều của εὐλογέω. “Chúc phước” là cách diễn đạt tự nhiên trong tiếng Việt, giữ được sự đối lập trực tiếp với hành động nguyền rủa.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: những người nguyền rủa anh em
  rationale: Phân từ có mạo từ được dùng như danh từ, chỉ những người đang có hành động nguyền rủa người nghe. Cách dịch này rõ ràng và giữ nguyên tính chủ động của lời nói thù nghịch.
- source_word: προσεύχεσθε
  choice: hãy cầu nguyện
  rationale: Mệnh lệnh số nhiều ở thì hiện tại. “Hãy cầu nguyện” truyền đạt tự nhiên sức mạnh của mệnh lệnh; không cần diễn đạt quá mức sắc thái tiếp diễn của thì hiện tại Hy Lạp.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: cho những người ngược đãi anh em
  rationale: περί đi với προσεύχομαι mang nghĩa cầu nguyện cho hoặc về ai đó. ἐπηρεάζω có thể chỉ việc xúc phạm, lăng mạ hoặc đối xử thù nghịch; “ngược đãi” truyền đạt hành vi đối xử độc ác nói chung mà không giới hạn vào lời nói.
theological_decisions:
- issue: Phạm vi của mệnh lệnh yêu thương kẻ thù
  choice: Dịch thẳng các mệnh lệnh như những đòi hỏi đạo đức, không thêm lời giải thích giáo lý.
  alternative: Diễn giải thêm điều kiện, giới hạn hoặc ý nghĩa thần học của việc chúc phước và cầu nguyện.
  rationale: Câu này trực tiếp truyền lệnh phải đáp lại sự thù nghịch bằng việc chúc phước và cầu nguyện. Bản dịch nên giữ nguyên sức mạnh và sự căng thẳng của các mệnh lệnh ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμᾶς trong lời Chúa Giê-su nói với các môn đồ; cấu trúc mệnh lệnh song song được giữ để bảo toàn nhịp điệu và sức nặng của nguyên văn.
