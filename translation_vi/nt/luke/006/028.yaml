review_pass:
  verdict: revise
  source_fidelity: Mệnh lệnh số nhiều và cấu trúc song hành của nguyên văn được truyền đạt đúng. “Chúc phước” phản ánh tốt εὐλογεῖτε; “nguyền rủa” phản ánh καταράομαι. Tuy nhiên, “ngược đãi” thường gợi hành vi hà khắc hoặc bạo hành tương đối nặng/kéo dài, trong khi ἐπηρεάζω có phạm vi rộng hơn, gồm cả xúc phạm, lăng mạ và đối xử thù nghịch. “Đối xử tệ” giữ được phạm vi rộng ấy tốt hơn.
  naturalness: Bản văn trang trọng, rõ ràng và tự nhiên. Việc thay “ngược đãi” bằng “đối xử tệ” tạo cách nói hiện đại, dễ hiểu hơn mà vẫn phù hợp văn cảnh.
  terminology: “Chúc phước,” “nguyền rủa,” và “cầu nguyện” là các thuật ngữ phù hợp, nhất quán với văn phong Kinh Thánh tiếng Việt hiện đại. “Anh em” là cách xưng hô số nhiều có thể chấp nhận trong diễn từ dành cho môn đồ.
  issues:
  - severity: medium
    issue: “Ngược đãi” thu hẹp và có thể làm mạnh quá nghĩa của ἐπηρεάζω.
    rationale: Động từ này bao hàm sự đối xử thù nghịch, xúc phạm hay lăng mạ, không nhất thiết là sự ngược đãi theo nghĩa nặng. “Đối xử tệ” bảo toàn độ rộng từ vựng của nguyên ngữ; các cách hiểu cụ thể hơn nên để ở chú thích.
  revised_text: Hãy chúc phước cho những người nguyền rủa anh em; hãy cầu nguyện cho những người đối xử tệ với anh em.[a]
