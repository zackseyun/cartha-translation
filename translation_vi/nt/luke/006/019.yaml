id: LUK.6.19
reference: Luke 6:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: vi
  text: Cả đám đông đều tìm cách chạm vào Ngài, vì quyền năng từ Ngài phát ra[a] và chữa lành mọi người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “từ Ngài đi ra.”'
    reason: Giữ cách diễn đạt thay thế cho ἐξήρχετο; “phát ra” tự nhiên hơn trong tiếng Việt, còn “đi ra” phản ánh sát hơn hình ảnh chuyển động của động từ.
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: cả đoàn dân
  rationale: Diễn đạt tự nhiên danh từ tập hợp số ít ὄχλος đi với πᾶς, đồng thời giữ ý toàn thể đám đông đều tham gia.
- source_word: ἐζήτουν
  choice: đều tìm cách
  rationale: Thì vị hoàn biểu thị hành động đang tiếp diễn hoặc lặp lại; “tìm cách” thể hiện nỗ lực liên tục, còn “đều” phù hợp với chủ thể tập hợp.
- source_word: ἅπτεσθαι
  choice: chạm vào
  rationale: Trong bối cảnh chữa lành, ἅπτομαι tự nhiên nhất là “chạm vào”, không cần tăng nghĩa thành nắm giữ.
- source_word: δύναμις
  choice: quyền năng
  rationale: “Quyền năng” truyền đạt sức mạnh hữu hiệu đem lại sự chữa lành mà không thêm tính từ “phép lạ”, vốn không xuất hiện trực tiếp trong câu Hy Lạp.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: từ Ngài phát ra
  rationale: Cách diễn đạt này giữ hình ảnh quyền năng liên tục xuất phát từ Chúa Giê-su và tự nhiên trong tiếng Việt.
- source_word: ἰᾶτο πάντας
  choice: chữa lành tất cả mọi người
  rationale: Giữ ý hành động chữa lành đang diễn ra và phạm vi bao quát của πάντας; “mọi người” làm rõ đối tượng được ngầm hiểu trong tiếng Hy Lạp.
theological_decisions:
- issue: Bản chất của δύναμις phát ra từ Chúa Giê-su
  choice: quyền năng từ Ngài phát ra
  alternative: quyền năng kỳ diệu từ Ngài phát ra
  rationale: Bản dịch giữ nguyên lời khẳng định rằng Chúa Giê-su là nguồn của quyền năng chữa lành, nhưng không thêm “kỳ diệu” hay một lời giải thích giáo lý không được câu Hy Lạp nói rõ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su; cấu trúc câu giữ nhịp kể chuyện và tính tiếp diễn của các động từ Hy Lạp mà không trở nên nặng nề.
