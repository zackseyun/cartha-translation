    reason: cultural_note
  revision_rationale: Sửa “một đấu đầy” thành “một lượng đong tốt” để phản ánh μέτρον καλὸν mà không chuyển “tốt” thành “đầy” hoặc ấn định một đơn vị đo cụ thể. Điều chỉnh câu về κόλπος thành “vạt áo trước” để diễn đạt rõ hơn vật chứa bằng nếp áo trong bối cảnh cổ đại. Phần còn lại duy trì sự mơ hồ về tác nhân, tính rộng của lời kêu gọi cho đi, và phép ẩn dụ về sự đong lại tương ứng.
