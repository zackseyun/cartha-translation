source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: vi
  text: Hãy cho, thì anh em sẽ được ban cho. Người ta sẽ cho vào vạt áo trước của anh em một lượng đong tốt, đã nén xuống, đã lắc cho chặt, tràn ra. Vì anh em dùng mức nào để đong, thì anh em cũng sẽ được đong lại theo mức ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδοτε
  choice: Hãy cho
  rationale: Thể mệnh lệnh hiện tại số nhiều diễn tả lời kêu gọi chung. “Hãy cho” tự nhiên trong tiếng Việt và không diễn giải quá mức khía cạnh tiếp diễn thành “hãy cứ tiếp tục cho”.
- source_word: δοθήσεται ὑμῖν
  choice: sẽ được ban cho anh em
  rationale: Giữ thể bị động và để chủ thể hành động không được nêu rõ, như bản Hy Lạp.
- source_word: μέτρον καλὸν
  choice: một đấu đầy
  rationale: Trong hình ảnh mua bán, μέτρον là lượng đong hoặc dụng cụ đong; “đấu” làm rõ hình ảnh đong ngũ cốc. καλόν được diễn đạt tự nhiên là “đầy”, chỉ một lượng đong đúng mức, dồi dào, nhưng không thêm ý nghĩa chuyên biệt về tiền bạc.
- source_word: πεπιεσμένον
  choice: đã nén xuống
  rationale: Diễn tả hàng hóa hoặc ngũ cốc được ép xuống để chứa được nhiều hơn, đồng thời phản ánh trạng thái kết quả của phân từ hoàn thành bị động.
- source_word: σεσαλευμένον
  choice: lắc cho chặt
  rationale: Trong ngữ cảnh đong hạt, việc lắc làm cho các hạt lèn và ổn định trong vật chứa. Cách nói này tự nhiên hơn “được rung” mà vẫn giữ hình ảnh cụ thể.
- source_word: ὑπερεκχυννόμενον
  choice: tràn ra
  rationale: Giữ hình ảnh lượng chứa dư dật đến mức tràn khỏi vật đựng; chú thích nêu cách dịch gần nghĩa khác.
- source_word: δώσουσιν
  choice: Người ta sẽ đong
  rationale: Động từ ngôi ba số nhiều có chủ thể bất định. “Người ta” giữ tính không xác định của tác nhân; “đong” phù hợp với tân ngữ là một lượng được đo và với hình ảnh xuyên suốt câu.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: vào vạt áo anh em
  rationale: κόλπος ở đây chỉ phần áo choàng phía trước có thể kéo lên thành chỗ chứa hàng. “Vạt áo” giữ được bối cảnh văn hóa rõ hơn “lòng” hay “lòng áo”, kèm chú thích giải thích.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: Vì anh em dùng đấu nào mà đong
  rationale: Giữ phép ẩn dụ về dụng cụ đong và diễn đạt tự nhiên cấu trúc quan hệ trong tiếng Việt.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: thì cũng sẽ được đong lại cho anh em bằng đấu ấy
  rationale: “Đong lại” thể hiện ý tương ứng, đáp lại trong tiền tố ἀντί, còn thể bị động và tác nhân không nêu được giữ nguyên.
theological_decisions:
- issue: Có nên giới hạn lời dạy vào tiền bạc hoặc việc bố thí hay không
  choice: Giữ ngôn ngữ rộng về việc cho và sự đong lại tương ứng.
  alternative: Diễn giải cụ thể là bố thí hoặc cho tiền của; hoặc mở rộng minh nhiên thành lòng thương xót, tha thứ và không xét đoán.
  rationale: Văn cảnh Lu-ca 6 bao gồm lòng thương xót, việc không xét đoán, tha thứ và cho đi. Bản Hy Lạp không giới hạn δίδοτε vào tiền bạc, nên bản dịch không thu hẹp thành việc bố thí cũng không biến câu này thành một lời hứa về thịnh vượng vật chất.
- issue: Tác nhân của việc ban lại
  choice: Không xác định tác nhân ở mệnh đề bị động đầu tiên; dùng “người ta” cho chủ thể số nhiều bất định của δώσουσιν.
  alternative: Nêu rõ Đức Chúa Trời là Đấng ban lại, hoặc đổi toàn bộ thành thể bị động.
  rationale: Bản văn vừa dùng thể bị động vừa dùng ngôi ba số nhiều không xác định. Giữ sự chuyển đổi này tránh quyết định thay bản văn rằng tác nhân trực tiếp nhất thiết là Đức Chúa Trời hay con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν, phù hợp lời Đức Chúa Jêsus nói với nhiều người. Hình ảnh “đấu”, “đong”, “vạt áo” được duy trì nhất quán để bảo toàn bối cảnh đo lường cổ đại; không thêm cách hiểu riêng về tiền bạc hay phúc lợi vật chất.
