revisions:
- from: Hãy cho, thì sẽ được ban cho anh em. Người ta sẽ đong vào vạt áo[b] anh em một đấu đầy, đã nén xuống, lắc cho chặt và tràn ra[a]. Vì anh em dùng đấu nào mà đong, thì cũng sẽ được đong lại cho anh em bằng đấu ấy.
  to: Hãy cho, thì anh em sẽ được ban cho. Người ta sẽ cho vào vạt áo trước của anh em một lượng đong tốt, đã nén xuống, đã lắc cho chặt, tràn ra. Vì anh em dùng mức nào để đong, thì anh em cũng sẽ được đong lại theo mức ấy.
  rationale: Sửa “một đấu đầy” thành “một lượng đong tốt” để phản ánh μέτρον καλὸν mà không chuyển “tốt” thành “đầy” hoặc ấn định một đơn vị đo cụ thể. Điều chỉnh câu về κόλπος thành “vạt áo trước” để diễn đạt rõ hơn vật chứa bằng nếp áo trong bối cảnh cổ đại. Phần còn lại duy trì sự mơ hồ về tác nhân, tính rộng của lời kêu gọi cho đi, và phép ẩn dụ về sự đong lại tương ứng.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng mệnh lệnh “Hãy cho,” tính bất định của tác nhân trong δώσουσιν, hình ảnh đong đo, và ý đáp lại của ἀντιμετρηθήσεται. Tuy nhiên, “một đấu đầy” đã chuyển καλὸν (“tốt”) thành “đầy”; ý đầy đến tràn thuộc các phân từ theo sau, nhất là ὑπερεκχυννόμενον. “Đấu” cũng là một đơn vị/dụng cụ cụ thể hơn mức μέτρον đòi hỏi.
  naturalness: Bản sửa dùng “lượng đong tốt” và “mức” để giữ hình ảnh đo lường mà không buộc vào một đơn vị cổ cụ thể. “Vạt áo trước” cùng chú thích làm rõ κόλπος theo bối cảnh áo choàng và vẫn dễ hiểu trong tiếng Việt hiện đại.
  terminology: Giữ “anh em” cho số nhiều ὑμῖν, “ban cho” cho thể bị động không nêu tác nhân, và “người ta” cho ngôi ba số nhiều bất định. Không thu hẹp lời dạy vào tiền bạc hay áp đặt tác nhân là Đức Chúa Trời.
  issues:
  - severity: medium
    issue: “một đấu đầy” không phản ánh chính xác μέτρον καλὸν.
    rationale: καλὸν có nghĩa là “tốt,” không phải “đầy.” Bản văn sau đó mới mô tả lượng đong là đã nén, đã lắc và tràn ra; “đầy” ở vị trí này làm mờ cấu trúc và thêm một nét nghĩa không nằm trong cụm μέτρον καλὸν.
  - severity: low
    issue: “đấu” đặc thù hóa μέτρον.
    rationale: μέτρον có thể chỉ lượng/mức đong hoặc dụng cụ đong nói chung. Dùng “đấu” không làm đổi trọng tâm đoạn văn, nhưng “lượng đong” bảo toàn tính khái quát của từ Hy Lạp tốt hơn.
  revised_text: Hãy cho, thì anh em sẽ được ban cho. Người ta sẽ cho vào vạt áo trước của anh em một lượng đong tốt, đã nén xuống, đã lắc cho chặt, tràn ra. Vì anh em dùng mức nào để đong, thì anh em cũng sẽ được đong lại theo mức ấy.
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chảy tràn”. Hình ảnh là một vật chứa được đổ đầy đến mức vật bên trong tràn ra ngoài.'
    reason: lexical_alternative
