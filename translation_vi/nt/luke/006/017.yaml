  terminology: «môn đồ», «dân chúng», «Giu-đê», «Giê-ru-sa-lem», «Ty-rơ», và «Si-đôn» phù hợp với văn phong Kinh Thánh tiếng Việt. «nơi bằng phẳng» giữ đúng mức độ dè dặt của ἐπὶ τόπου πεδινοῦ; chú thích bảo lưu phương án «đồng bằng».
