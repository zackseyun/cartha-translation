  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của câu: Chúa Giê-su đi xuống cùng họ, đứng ở địa điểm bằng phẳng, và có hai nhóm hiện diện—các môn đồ cùng đông đảo dân chúng từ các địa phương nêu tên. Tuy nhiên, «đông đảo môn đồ» chỉ nói số lượng môn đồ và làm mờ danh từ ὄχλος (một đám đông). Cần nêu rõ đây là một đám đông gồm các môn đồ của Ngài.'
