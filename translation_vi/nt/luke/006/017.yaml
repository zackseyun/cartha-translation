revisions:
- from: Ngài cùng họ đi xuống rồi đứng tại một chỗ bằng phẳng,[a] ở đó có đông đảo môn đồ của Ngài và rất nhiều dân chúng từ khắp miền Giu-đê, thành Giê-ru-sa-lem, cùng vùng duyên hải Ty-rơ và Si-đôn đến.
  to: Ngài đi xuống cùng họ và đứng tại một nơi bằng phẳng,[a] nơi có mặt một đám đông lớn gồm các môn đồ của Ngài và một đoàn dân chúng rất đông, từ khắp miền Giu-đê, thành Giê-ru-sa-lem, cùng vùng duyên hải Ty-rơ và Si-đôn đến.
  rationale: Bản sửa khôi phục rõ danh từ «đám đông» cho ὄχλος πολὺς μαθητῶν αὐτοῦ, đồng thời giữ sự phân biệt giữa nhóm môn đồ và đoàn dân chúng (πλῆθος πολὺ τοῦ λαοῦ). «Tại một nơi bằng phẳng» và chú thích «trên một đồng bằng» phản ánh từ ngữ Hy Lạp mà không áp đặt cách hài hòa địa hình với các sách khác.
