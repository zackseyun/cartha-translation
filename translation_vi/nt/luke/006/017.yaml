source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: vi
  text: Ngài đi xuống cùng họ và đứng tại một nơi bằng phẳng,[a] nơi có mặt một đám đông lớn gồm các môn đồ của Ngài và một đoàn dân chúng rất đông, từ khắp miền Giu-đê, thành Giê-ru-sa-lem, cùng vùng duyên hải Ty-rơ và Si-đôn đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên một đồng bằng.” Cụm từ Hy Lạp theo sát nghĩa là “trên một nơi bằng phẳng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: cùng họ đi xuống rồi
  rationale: Phân từ bất định quá khứ diễn tả việc đi xuống gắn với động từ chính; “rồi” thể hiện tự nhiên trình tự kể chuyện, còn “cùng họ” giữ nguyên μετ’ αὐτῶν.
- source_word: ἔστη
  choice: đứng
  rationale: Diễn đạt trực tiếp hành động đứng hoặc dừng lại ở một vị trí, không thêm sắc thái giải thích.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: tại một chỗ bằng phẳng
  rationale: Giữ nghĩa cụ thể của τόπος và πεδινός, đồng thời không khẳng định quá mức rằng đây là một đồng bằng rộng.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: đông đảo môn đồ của Ngài
  rationale: Diễn đạt tự nhiên một đám đông gồm các môn đồ; tránh lặp nặng nề từ “đám đông” ngay trước mệnh đề nói về dân chúng.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: rất nhiều dân chúng
  rationale: Phân biệt nhóm dân chúng rộng lớn với các môn đồ, đồng thời truyền đạt rõ ý số lượng lớn của πλῆθος πολὺ.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: từ khắp miền Giu-đê
  rationale: “Khắp miền” diễn đạt phạm vi bao quát của πάσης và phù hợp với một địa danh vùng miền.
- source_word: Ἰερουσαλήμ
  choice: thành Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt; thêm “thành” để làm rõ đây là địa điểm song song với vùng Giu-đê.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: vùng duyên hải Ty-rơ và Si-đôn
  rationale: παράλιος chỉ vùng ven biển; “vùng duyên hải” vừa chính xác vừa trang trọng, tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt địa hình của bối cảnh bài giảng
  choice: tại một chỗ bằng phẳng
  alternative: trên một đồng bằng
  rationale: Bản dịch theo nghĩa từ vựng của cụm Hy Lạp, không hòa giải với bối cảnh trên núi trong Ma-thi-ơ và cũng không tạo ra mâu thuẫn địa hình vượt quá điều Lu-ca nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su theo ngữ cảnh; các địa danh được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
