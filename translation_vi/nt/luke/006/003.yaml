  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: vi
  text: 'Đức Giê-su đáp lại họ: “Ngay cả điều này, các ông cũng chưa đọc sao: Đa-vít đã làm gì khi ông đói—ông và những người ở với ông?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: đáp
  rationale: Cụm phân từ kết hợp với động từ hữu hạn là lối diễn đạt Hy Lạp Koinē thường mang nghĩa ‘đáp và nói’; tiếng Việt tự nhiên chỉ cần ‘đáp’.
- source_word: πρὸς αὐτοὺς
  choice: các ông
  rationale: Đại từ số nhiều chỉ những người đang chất vấn Đức Giê-su; ‘các ông’ phù hợp ngữ cảnh đối thoại và tự nhiên hơn cách dịch sát ‘với họ’.
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: Ngay cả điều này các ông cũng chưa đọc sao
  rationale: Giữ sắc thái nhấn mạnh của οὐδέ (‘ngay cả… cũng’) và lực của câu hỏi tu từ nhằm nhắc đến điều họ đáng lẽ đã biết qua Kinh Thánh.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: Đa-vít đã làm gì
  rationale: Cách đặt mệnh đề hỏi gián tiếp tự nhiên trong tiếng Việt, truyền đạt đúng ‘điều Đa-vít đã làm’.
- source_word: ὁπότε ἐπείνασεν
  choice: khi ... bị đói
  rationale: Diễn đạt gọn mệnh đề thời gian và tình trạng đói trong văn cảnh kể chuyện.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: ông và những người đi cùng
  rationale: Giữ cả đại từ chỉ Đa-vít lẫn nhóm người ở với ông, không diễn giải thêm quan hệ của họ.
theological_decisions: []
