- from: 'Đức Giê-su đáp: “Ngay cả điều này các ông cũng chưa đọc sao: Đa-vít đã làm gì khi ông và những người đi cùng bị đói?”'
  to: 'Đức Giê-su đáp lại họ: “Ngay cả điều này, các ông cũng chưa đọc sao: Đa-vít đã làm gì khi ông đói—ông và những người ở với ông?”'
  rationale: Sửa phần cuối để giữ động từ “đói” quy chiếu số ít về Đa-vít, đồng thời vẫn duy trì việc bản văn nhắc đến những người ở với ông. Dấu gạch ngang giúp tiếng Việt giữ được cấu trúc bổ sung hơi đột ngột của nguyên văn mà không diễn giải rằng cả nhóm đều đói.
