revisions:
- from: Hãy vui mừng trong ngày ấy và nhảy lên vì vui sướng[a], vì này, phần thưởng của anh em ở trên trời thật lớn; bởi tổ tiên của họ cũng từng đối xử với các nhà tiên tri như vậy[b].
  to: Hãy vui mừng trong ngày ấy và nhảy lên vì vui sướng[a], vì kìa, phần thưởng của anh em ở trên trời thật lớn; vì tổ tiên của họ cũng thường đối xử với các nhà tiên tri như vậy[b].
  rationale: Điều chỉnh tối thiểu để câu tiếng Việt tự nhiên hơn và để «ἐποίουν» được thể hiện như một hành vi có tính thông lệ trong quá khứ. Bản sửa vẫn giữ vị trí/cõi của phần thưởng là «ở trên trời», quy chiếu «tổ tiên của họ», và tính hàm súc của ποιέω về cách họ đối xử với các nhà tiên tri.
