language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: vi
  text: Hãy vui mừng trong ngày ấy và nhảy lên vì vui sướng[a], vì kìa, phần thưởng của anh em ở trên trời thật lớn; vì tổ tiên của họ cũng thường đối xử với các nhà tiên tri như vậy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy vui mừng trong ngày ấy và nhảy lên.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “vì tổ tiên của họ đã làm những điều tương tự với các nhà tiên tri”; ý nói tổ tiên của họ đã đối xử với các nhà tiên tri theo cùng một cách.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Hãy vui mừng
  rationale: Mệnh lệnh số nhiều của χαίρω kêu gọi người nghe chủ động vui mừng; cách diễn đạt này tự nhiên, trang trọng và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: σκιρτήσατε
  choice: nhảy lên vì vui sướng
  rationale: Động từ chỉ một hành động thân thể biểu lộ niềm vui mãnh liệt; cách dịch này giữ được cả hành động nhảy lên lẫn nguyên nhân vui mừng.
- source_word: ἰδοὺ
  choice: vì này
  rationale: ἰδού thu hút sự chú ý vào lý do tiếp theo. “Này” duy trì sắc thái Kinh Thánh trang trọng mà vẫn dễ hiểu.
- source_word: ὁ μισθὸς ὑμῶν πολὺς
  choice: phần thưởng của anh em ở trên trời thật lớn
  rationale: μισθός trong ngữ cảnh này là phần thưởng tích cực, còn πολύς nhấn mạnh mức độ lớn lao; “thật lớn” là cách kết hợp tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ οὐρανῷ
  choice: ở trên trời
  rationale: Cụm từ chỉ nơi hoặc cõi của phần thưởng; bản dịch giữ nguyên cách diễn đạt của câu mà không bổ sung diễn giải thần học.
- source_word: κατὰ τὰ αὐτά
  choice: như vậy
  rationale: Thành ngữ có nghĩa “theo cùng một cách”; “như vậy” nối tự nhiên với việc đối xử được nói đến trong văn cảnh.
- source_word: ἐποίουν
  choice: từng đối xử
  rationale: Thì chưa hoàn thành có thể diễn tả hành động quen thuộc trong quá khứ. Khi đi với tân ngữ chỉ người, “từng đối xử” truyền đạt tự nhiên ý của lối nói cô đọng “làm với” trong tiếng Hy Lạp.
- source_word: τοῖς προφήταις
  choice: với các nhà tiên tri
  rationale: Giới từ “với” phù hợp tự nhiên với động từ “đối xử”, trong khi chiều hướng thù nghịch vẫn được xác định bởi văn cảnh.
- source_word: οἱ πατέρες αὐτῶν
  choice: tổ tiên của họ
  rationale: πατέρες ở đây chỉ những người thuộc các thế hệ trước, tức tổ tiên của những kẻ chống đối; “tổ tiên” rõ nghĩa hơn cách dịch sát chữ “cha ông” trong tiếng Việt hiện đại.
theological_decisions:
- issue: Bản chất và vị trí của phần thưởng được hứa
  choice: phần thưởng của anh em ở trên trời thật lớn
  alternative: phần thưởng Đức Chúa Trời dành cho anh em trên trời thật lớn
  rationale: Nguyên văn chỉ nói phần thưởng “ở trên trời”, không nêu thêm chủ thể ban thưởng. Bản dịch giữ nguyên sự cô đọng và chiều kích cánh chung của câu.
- issue: Đối tượng được gọi là οἱ πατέρες αὐτῶν
  choice: tổ tiên của họ
  alternative: cha ông của họ
  rationale: Cụm từ nói đến các thế hệ đi trước của những kẻ bắt bớ, qua đó đặt sự chống đối hiện tại trong mạch lịch sử từng khước từ các nhà tiên tri. “Tổ tiên” truyền đạt rõ quy chiếu mà không thêm nhận định giáo phái.
- issue: Nội dung hành động đối với các nhà tiên tri
  choice: cũng từng đối xử với các nhà tiên tri như vậy
  alternative: cũng từng làm những điều tương tự với các nhà tiên tri
  rationale: Nguyên văn dùng ποιέω một cách cô đọng và dựa vào văn cảnh để xác định sự đối xử thù nghịch. “Đối xử… như vậy” tự nhiên trong tiếng Việt nhưng không chỉ định thêm hình thức bách hại nào.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῶν nhằm giữ lời nói trực tiếp với cộng đồng môn đồ; dùng “các nhà tiên tri” theo cách gọi phổ thông. Hai dấu chú thích đều xuất hiện trong chính văn.
