  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng hai mệnh lệnh số nhiều (χαίρετε, σκιρτήσατε), lý do về phần thưởng lớn ở trên trời, và sự tương ứng với cách tổ tiên của những người chống đối đã đối xử với các nhà tiên tri. Tuy nhiên, «từng đối xử» không nêu rõ sắc thái thói quen/lặp lại của thì chưa hoàn thành ἐποίουν; «thường đối xử» phù hợp hơn mà không xác định quá mức bản chất của sự đối xử.
  naturalness: «Vì này» không tự nhiên trong tiếng Việt hiện đại ở vị trí này. «Vì kìa» giữ lực thu hút chú ý của ἰδού, có sắc thái trang trọng phù hợp, và đọc trôi chảy hơn. Cấu trúc còn lại tự nhiên và giữ được văn phong Kinh Thánh hiện đại.
