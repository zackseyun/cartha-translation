  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: vi
  text: 'Sao bạn có thể nói với người anh em của mình[a]: ‘Anh ơi, hãy để tôi lấy cái dằm trong mắt anh ra,’ trong khi chính bạn lại không thấy cây xà trong mắt mình? Kẻ đạo đức giả! Trước hết, hãy lấy cây xà ra khỏi mắt mình[b], rồi bạn sẽ thấy rõ để lấy cái dằm trong mắt người anh em của mình ra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người anh em” dịch từ ἀδελφός, một danh từ thân tộc giống đực số ít. Lời dạy có thể được áp dụng rộng hơn, nhưng cách diễn đạt trong tiếng Hy Lạp chỉ một người nam.
    reason: cultural_note
  - marker: b
    text: “Cây xà” chỉ một thanh gỗ lớn; cũng có thể dịch là “cây đà” hoặc “khúc gỗ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Sao con có thể nói
  rationale: Giữ hình thức câu hỏi tu từ về khả năng và sự chính đáng, đồng thời dùng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: anh em mình / Anh ơi / anh em mình
  rationale: ἀδελφός là danh từ thân tộc giống đực số ít. “Anh em” là cách gọi nam giới tự nhiên trong tiếng Việt và không tự ý chuyển thành thuật ngữ giáo hội; lời xưng hô trực tiếp được diễn đạt là “Anh ơi”.
- source_word: ἄφες ἐκβάλω
  choice: hãy để tôi lấy ... ra
  rationale: ἄφες ở đây là lời xin cho phép; “hãy để tôi” truyền đạt đúng chức năng ấy, còn “lấy ... ra” phù hợp với hình ảnh dị vật trong mắt.
- source_word: κάρφος
  choice: cái dằm
  rationale: Chỉ một mẩu vật liệu khô rất nhỏ. “Dằm” tạo hình ảnh cụ thể, tự nhiên và giữ được sự tương phản phóng đại với cây xà.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: trong khi chính con lại không thấy
  rationale: “Chính” bảo toàn sắc thái nhấn mạnh của αὐτός; “trong khi” thể hiện quan hệ đối lập của phân từ với mệnh đề chính.
- source_word: δοκός
  choice: cây xà
  rationale: δοκός là một thanh gỗ lớn dùng làm xà; “cây xà” vừa chính xác vừa duy trì sự tương phản mạnh với “cái dằm”.
- source_word: ὑποκριτά
  choice: Kẻ đạo đức giả!
  rationale: Giữ lời quở trách trực tiếp ở số ít. Cụm từ hiện đại, rõ nghĩa và đủ mạnh.
- source_word: διαβλέψεις
  choice: con sẽ thấy rõ
  rationale: Động từ mang nghĩa nhìn rõ hoặc nhận thấy sáng tỏ; “thấy rõ” bảo toàn ý nghĩa và nối tự nhiên với hành động lấy dằm ra.
theological_decisions:
- issue: Phạm vi của danh từ thân tộc ἀδελφός trong lời dạy đạo đức
  choice: anh em mình
  alternative: người anh em; anh chị em; người đồng đạo
  rationale: Nguyên văn dùng danh từ giống đực số ít. Bản dịch giữ đặc điểm ấy mà không thu hẹp rõ ràng vào quan hệ huyết thống hay tự ý giải nghĩa thành “người đồng đạo”; chú thích nêu khả năng áp dụng rộng hơn.
- issue: Sự tương phản ẩn dụ giữa κάρφος và δοκός
  choice: cái dằm ... cây xà
  alternative: mảnh vụn ... khúc gỗ; cọng rác ... cây đà
  rationale: 'Giữ nguyên hình ảnh cường điệu và sức căng đạo đức: người phê phán lỗi nhỏ của người khác lại không nhận ra lỗi vô cùng lớn của mình, nhưng không diễn giải ẩn dụ ngay trong câu.'
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “con” theo ngữ cảnh Đức Giê-su trực tiếp dạy môn đồ, còn “mình” làm đại từ phản thân tự nhiên. Dấu chấm than sau lời gọi “Kẻ đạo đức giả!” thể hiện sức nặng của thể hô cách mà không thêm nội dung.
