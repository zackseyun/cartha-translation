review_pass:
  verdict: revise
  source_fidelity: Bản thảo giữ đúng cấu trúc câu hỏi tu từ, lời xin phép «hãy để tôi», sự nhấn mạnh «chính», hình ảnh tương phản cái dằm/cây xà, và trình tự mệnh lệnh rồi mới thấy rõ của nguyên văn. Tuy nhiên, «con» thêm một quan hệ vai vế không có trong ngôi thứ hai số ít của tiếng Hy Lạp; «anh em mình» trong văn xuôi hiện đại thường được hiểu là số nhiều hoặc một quan hệ tập thể, trong khi ἀδελφός ở đây là số ít.
  naturalness: Cần thay «con» bằng «bạn» để câu nói hiện đại, trung tính về vai vế và nhất quán. «Người anh em» tuy trang trọng hơn «anh em» nhưng làm rõ số ít của nguyên văn; lời gọi «Anh ơi» vẫn là cách xưng hô tự nhiên trong câu trích dẫn.
  terminology: «Cái dằm» và «cây xà» truyền đạt tốt κάρφος và δοκός, bảo toàn độ chênh lệch cường điệu. «Kẻ đạo đức giả» là cách dịch rõ ràng, phù hợp ὑποκριτά. Chú thích về ἀδελφός cần đi cùng cách dịch số ít đã sửa.
  issues:
  - severity: medium
    issue: Đại từ «con»
    rationale: Nguyên văn chỉ dùng ngôi thứ hai số ít và không xác định quan hệ trên–dưới. «Con» áp đặt vai vế người nói với người được nói, đồng thời không nhất quán với «tôi» trong lời trích.
  - severity: medium
    issue: «Anh em mình» không biểu đạt rõ số ít
    rationale: ἀδελφῷ/ἀδελφοῦ là số ít. Trong tiếng Việt hiện đại, «anh em» dễ được đọc là số nhiều hoặc một nhóm quan hệ; «người anh em của bạn» giữ số ít rõ ràng hơn.
