id: LUK.6.4
reference: Luke 6:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: vi
  text: thể nào ông ấy đã vào nhà Đức Chúa Trời, lấy bánh bày trước mặt Đức Chúa Trời[a] mà ăn, rồi cho những người đi cùng mình—là loại bánh mà chỉ các thầy tế lễ mới được phép ăn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bánh thánh”; theo cách gọi truyền thống: “bánh trần thiết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: thể nào
  rationale: Trong câu hỏi gián tiếp tiếp nối câu trước, từ này giới thiệu cách thức/nội dung việc Đa-vít đã làm; “thể nào” giữ được sắc thái ấy và hợp với văn phong Kinh Thánh trang trọng.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: đã vào nhà Đức Chúa Trời
  rationale: Dịch trực tiếp chuyển động đi vào, đồng thời giữ “nhà Đức Chúa Trời” thay vì diễn giải thành “đền thờ,” vì nguyên văn dùng οἶκος và câu chuyện nền liên quan đến nơi thờ phượng.
- source_word: ἄρτους τῆς προθέσεως
  choice: bánh Trưng Bày
  rationale: Cụm từ chỉ bánh thánh được đặt/trưng bày trước mặt Đức Chúa Trời. Cách dịch này bảo tồn hình ảnh nghi lễ của προθέσεως; chú thích cung cấp cách gọi giải nghĩa dễ hiểu hơn.
- source_word: λαβὼν ἔφαγεν
  choice: lấy ... mà ăn
  rationale: Diễn đạt tự nhiên cấu trúc phân từ đi trước động từ chính và giữ trình tự hành động.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: rồi đưa cho những người đi cùng mình
  rationale: “Những người đi cùng mình” bám sát τοῖς μετ’ αὐτοῦ; “rồi” thể hiện trình tự tự nhiên mà không thêm ý thần học.
- source_word: οὓς
  choice: thứ bánh mà
  rationale: Đại từ quan hệ số nhiều quy chiếu về các ổ bánh; tiếng Việt tự nhiên cần nêu lại danh từ tập hợp “bánh” để tránh mơ hồ.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: theo luật, không ai được phép ăn
  rationale: ἔξεστιν nói về điều được luật tôn giáo cho phép. “Theo luật” làm rõ sắc thái pháp lý-tế lễ, còn “không ai được phép ăn” là tiếng Việt hiện đại, dễ hiểu.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: ngoại trừ các thầy tế lễ mà thôi
  rationale: “Ngoại trừ ... mà thôi” giữ trọn tính loại trừ kép của εἰ μή và μόνους; “thầy tế lễ” là thuật ngữ Kinh Thánh tiếng Việt quen thuộc cho ἱερεῖς.
theological_decisions:
- issue: Giới hạn pháp luật-nghi lễ đối với bánh thánh
  choice: theo luật, không ai được phép ăn
  alternative: không được phép ăn
  rationale: Thêm “theo luật” diễn đạt rõ sắc thái của οὐκ ἔξεστιν trong bối cảnh luật tế lễ, nhưng không xác định thêm bản chất hay phạm vi ngoại lệ ngoài điều câu văn nói.
- issue: Danh xưng loại bánh thánh
  choice: bánh Trưng Bày
  alternative: bánh thánh; bánh đặt trước mặt Đức Chúa Trời
  rationale: Giữ hình ảnh của προθέσεως và mối liên hệ nghi lễ mà không giản lược thành một mô tả thần học chung; chú thích hỗ trợ độc giả phổ thông.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” và “thầy tế lễ” theo cách gọi Kinh Thánh tiếng Việt thông dụng. Dấu gạch ngang giữ mệnh đề giải thích về giới hạn của luật; dấu hỏi nối với câu hỏi được mở đầu ở câu trước.
