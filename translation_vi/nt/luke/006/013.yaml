id: LUK.6.13
reference: Luke 6:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: vi
  text: Khi trời sáng, Đức Giê-su gọi các môn đệ đến[a], rồi chọn mười hai người trong số họ và gọi họ là các sứ đồ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp cũng có thể mang nghĩa “gọi” hoặc “ngỏ lời với”; trong văn cảnh này, ý gọi các môn đệ quy tụ lại phù hợp hơn.
    reason: lexical_alternative
  - marker: b
    text: Hay “đặt tên cho họ là các sứ đồ.” Động từ Hy Lạp có thể chỉ việc gọi tên hoặc ban một danh xưng.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Khi trời sáng
  rationale: Diễn đạt tự nhiên thời điểm ban ngày bắt đầu, phù hợp với mạch văn sau một đêm cầu nguyện.
- source_word: προσεφώνησεν
  choice: gọi ... đến
  rationale: Trong ngữ cảnh này, động từ chỉ việc Đức Giê-su gọi các môn đệ quy tụ lại để chọn người; cách dịch này tránh hiểu đơn thuần là lên tiếng nói với họ.
- source_word: μαθητὰς
  choice: các môn đệ
  rationale: Thuật ngữ quen thuộc, chính xác trong văn cảnh sách Tin Mừng, vừa chỉ người học vừa chỉ người đi theo thầy.
- source_word: ἐκλεξάμενος
  choice: chọn
  rationale: Ngắn gọn, tự nhiên và giữ đúng ý lựa chọn có chủ ý.
- source_word: ἀπ’ αὐτῶν
  choice: trong số họ
  rationale: Cho thấy mười hai người được chọn từ một nhóm môn đệ đông hơn.
- source_word: δώδεκα
  choice: mười hai người
  rationale: Thêm danh từ chỉ người theo cách diễn đạt tự nhiên của tiếng Việt, không bổ sung nội dung ngoài nguyên văn.
- source_word: ἀποστόλους
  choice: các sứ đồ
  rationale: Đây là danh xưng được thiết lập cho nhóm Mười Hai trong văn mạch Lu-ca; “sứ đồ” giữ được sắc thái chức danh hơn cách dịch khái quát như “sứ giả”.
- source_word: ὠνόμασεν
  choice: gọi họ là
  rationale: Diễn đạt tự nhiên hành động đặt danh xưng; tuy cùng dùng “gọi” trong tiếng Việt, cấu trúc “gọi ... đến” và “gọi ... là” phân biệt rõ triệu tập với đặt tên.
theological_decisions:
- issue: Nên dịch ἀποστόλους theo nghĩa khái quát hay như một danh xưng
  choice: các sứ đồ
  alternative: những người được sai đi; các sứ giả
  rationale: Ở đây Đức Giê-su ban danh xưng này cho mười hai người, nên giữ thuật ngữ đã mang tính chuyên biệt trong trình thuật, nhưng không thêm các hàm ý giáo phái hay định nghĩa chức vụ ngoài câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo văn phong Kinh Thánh phổ thông; câu được sắp xếp trôi chảy nhưng vẫn giữ đủ trình tự thời gian, triệu tập, tuyển chọn và ban danh xưng của nguyên văn.
