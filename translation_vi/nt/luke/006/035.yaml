reference: Luke 6:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: vi
  text: Nhưng hãy yêu kẻ thù của anh em, làm điều tốt và cho vay mà không mong được hoàn lại[a]. Và phần thưởng của anh em sẽ lớn lao, anh em sẽ là con trai của Đấng Tối Cao[b], vì chính Ngài nhân từ đối với những kẻ vô ơn và kẻ ác.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm Hy Lạp được dịch là “không mong được hoàn lại” rất khó hiểu. Một cách hiểu khác, nhưng ít có khả năng hơn, là “không tuyệt vọng về một ai” hoặc “không bao giờ mất hy vọng.” Trong ngữ cảnh này, cụm từ được hiểu là không mong được trả lại hay nhận lại điều gì.
    reason: lexical_alternative
  - marker: b
    text: “Con trai” dịch danh từ giống đực số nhiều trong tiếng Hy Lạp; tại đây, từ này có thể mang nghĩa đại diện, bao gồm những người thuộc về Đấng Tối Cao.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn tả sự tương phản mạnh với lối yêu thương chỉ dựa trên sự đáp lại ở phần trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: hãy yêu kẻ thù của các con
  rationale: Giữ nguyên mệnh lệnh trực tiếp và sức gây sửng sốt của danh từ “kẻ thù”, không làm nhẹ thành “đối thủ”.
- source_word: ἀγαθοποιεῖτε
  choice: làm điều lành
  rationale: Cách nói trang trọng, dễ hiểu, diễn đạt hành động tích cực đem điều tốt đến cho người khác.
- source_word: δανίζετε
  choice: cho vay
  rationale: Chuyển tải đúng nghĩa của động từ mà không tự ý giới hạn đối tượng cho vay là tiền.
- source_word: μηδὲν ἀπελπίζοντες
  choice: mà không mong được hoàn lại
  rationale: Trong ngữ cảnh cho vay và sự đáp trả, cụm phân từ khó này hợp lý nhất khi chỉ việc không trông mong được trả lại; cách hiểu khác được giữ trong chú thích.
- source_word: μισθὸς ὑμῶν πολύς
  choice: phần thưởng của các con sẽ lớn
  rationale: “Phần thưởng” phù hợp với ngữ cảnh đạo đức và cánh chung hơn “tiền công”; “lớn” giữ trực tiếp sắc thái của πολύς.
- source_word: υἱοὶ Ὑψίστου
  choice: con trai của Đấng Tối Cao
  rationale: Giữ danh từ giống đực số nhiều υἱοί và tước hiệu thần linh Ὕψιστος; ý nghĩa đại diện được giải thích trong chú thích.
- source_word: χρηστός
  choice: nhân từ
  rationale: Diễn đạt lòng tốt được thể hiện qua cách Thiên Chúa đối xử tử tế với những người không xứng đáng, với sắc thái trang trọng tự nhiên.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: những kẻ vô ơn và gian ác
  rationale: Giữ hai nhóm phẩm chất tiêu cực riêng biệt; “vô ơn” và “gian ác” rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch υἱοὶ Ὑψίστου có nên trung tính hóa giới tính hay không
  choice: con trai của Đấng Tối Cao
  alternative: con cái của Đấng Tối Cao
  rationale: Bản văn Hy Lạp dùng danh từ giống đực số nhiều υἱοί. Bản chính giữ hình thức “con trai” thay vì âm thầm trung tính hóa, đồng thời chú thích rằng trong ngữ cảnh cụm này có thể mang nghĩa đại diện.
- issue: Cách hiểu μηδὲν ἀπελπίζοντες trong mệnh lệnh cho vay
  choice: không mong được hoàn lại
  alternative: không tuyệt vọng về một ai; không bao giờ mất hy vọng
  rationale: Ngữ cảnh trực tiếp nói về cho vay và sự đền đáp, nên cách hiểu từ bỏ mong đợi được hoàn trả là phù hợp nhất. Vì cụm Hy Lạp thực sự khó và có cách hiểu khác, sự mơ hồ được ghi nhận trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “các con” phản ánh lời Đức Giê-su trực tiếp dạy các môn đồ; “Ngài” giữ sắc thái tôn kính. Câu được chia nhịp tự nhiên nhưng vẫn bảo toàn chuỗi mệnh lệnh và các mệnh đề nguyên nhân-kết quả của bản Hy Lạp.
