revisions:
- from: Nhưng hãy yêu kẻ thù của các con[a], làm điều lành và cho vay mà không mong được hoàn lại. Bấy giờ, phần thưởng của các con sẽ lớn, và các con sẽ là con trai của Đấng Tối Cao[b], vì chính Ngài nhân từ với những kẻ vô ơn và gian ác.
  to: Nhưng hãy yêu kẻ thù của anh em, làm điều tốt và cho vay mà không mong được hoàn lại[a]. Và phần thưởng của anh em sẽ lớn lao, anh em sẽ là con trai của Đấng Tối Cao[b], vì chính Ngài nhân từ đối với những kẻ vô ơn và kẻ ác.
  rationale: Bản sửa loại bỏ các sắc thái không được nêu trong tiếng Hy Lạp (“các con,” “Bấy giờ”), neo lại chú thích từ vựng đúng vị trí, và điều chỉnh vài cách diễn đạt để tự nhiên hơn trong tiếng Việt hiện đại đồng thời giữ nguyên các quyết định dịch thuật chính của bản nguồn.
  reviewer_model: gpt-5.6-terra
