language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: vi
  text: Các kinh sư và người Pha-ri-sêu chăm chú theo dõi Đức Giê-su, xem Người có chữa lành vào ngày Sa-bát không, để tìm cớ tố cáo Người.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “để tìm lời buộc tội Người” hoặc đơn giản là “để tố cáo Người.” Cách diễn đạt Hy Lạp hàm ý họ muốn tìm cơ sở cho một lời cáo buộc.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: chăm chú theo dõi Đức Chúa Jêsus
  rationale: Thì vị hoàn diễn tả hành động theo dõi đang tiếp diễn; trong ngữ cảnh, động từ còn hàm ý dò xét với ý đối nghịch. Tân ngữ “Đức Chúa Jêsus” được bổ sung từ ngữ cảnh để câu tiếng Việt rõ và tự nhiên.
- source_word: γραμματεῖς
  choice: các thầy dạy luật
  rationale: Cách gọi này truyền đạt chức năng của nhóm γραμματεῖς một cách dễ hiểu cho độc giả Việt hiện đại; “các kinh sư” là phương án trực tiếp và truyền thống hơn.
- source_word: Φαρισαῖοι
  choice: người Pha-ri-si
  rationale: Phiên âm tên riêng chỉ một nhóm tôn giáo-xã hội Do Thái, không diễn giải thêm về nhóm này.
- source_word: εἰ
  choice: xem ... hay không
  rationale: Sau động từ chỉ sự quan sát, cấu trúc này diễn đạt tự nhiên một câu hỏi gián tiếp trong tiếng Việt.
- source_word: ἐν τῷ σαββάτῳ
  choice: trong ngày sa-bát
  rationale: Diễn đạt thời gian tự nhiên trong tiếng Việt, đồng thời giữ dạng số ít của σαββάτῳ.
- source_word: θεραπεύει
  choice: có chữa bệnh
  rationale: Thì hiện tại trong câu hỏi gián tiếp được chuyển bằng kết cấu “có ... hay không”, không cần áp đặt sắc thái thời tương lai vốn không được đánh dấu trực tiếp trong tiếng Hy Lạp.
- source_word: ἵνα εὕρωσιν
  choice: để tìm
  rationale: Giữ rõ ý chỉ mục đích của ἵνα mà vẫn gọn và tự nhiên trong tiếng Việt.
- source_word: κατηγορεῖν αὐτοῦ
  choice: cớ tố cáo Ngài
  rationale: Kết hợp với εὕρωσιν, động từ nguyên mẫu hàm ý họ muốn tìm một cơ sở hay cơ hội để buộc tội; “tìm cớ tố cáo” chuyển tải ý đó tự nhiên mà không xác định trước nội dung cáo buộc.
theological_decisions:
- issue: Ý định của các đối thủ
  choice: Dịch là “chăm chú theo dõi ... để tìm cớ tố cáo” nhằm thể hiện sự dò xét có chủ đích đối nghịch.
  alternative: Có thể dịch trung tính hơn là “quan sát kỹ ... để tố cáo Ngài”.
  rationale: Sắc thái của παρετηροῦντο trong ngữ cảnh, kết hợp với mệnh đề mục đích ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ, cho thấy đây không chỉ là quan sát trung lập. Bản dịch không mở rộng sự đối nghịch vượt quá điều câu văn nêu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Thầy dạy luật” ưu tiên tính minh bạch chức năng; “Pha-ri-si” và “sa-bát” dùng dạng phiên âm quen thuộc. Đại từ tôn kính “Ngài” và danh xưng “Đức Chúa Jêsus” được dùng nhất quán trong câu.
