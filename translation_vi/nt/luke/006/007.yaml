revisions:
- from: Các thầy dạy luật và người Pha-ri-si chăm chú theo dõi Đức Chúa Jêsus[a] xem Ngài có chữa bệnh trong ngày sa-bát hay không, để tìm cớ tố cáo Ngài.[b]
  to: Các kinh sư và người Pha-ri-sêu chăm chú theo dõi Đức Giê-su, xem Người có chữa lành vào ngày Sa-bát không, để tìm cớ tố cáo Người.[a]
  rationale: Bản sửa loại bỏ danh xưng không hiện diện trong câu nguồn và chính tả mang tính hệ phái, chuẩn hóa các thuật ngữ theo tiếng Việt hiện đại, đồng thời làm rõ hành động chữa lành. Ghi chú về παρετηροῦντο không cần thiết vì “chăm chú theo dõi” đã chuyển tải sát ý theo dõi kỹ; ghi chú còn lại được giữ với neo chú thích đặt đúng sau mệnh đề liên quan.
