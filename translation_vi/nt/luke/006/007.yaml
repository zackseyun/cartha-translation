    rationale: Nguồn chỉ có đại từ ngầm chỉ Giê-su trong ngữ cảnh, không có danh xưng “Chúa”. “Jêsus” không phải dạng chính tả trung tính, hiện hành rộng rãi trong tiếng Việt hiện đại.
  - severity: low
