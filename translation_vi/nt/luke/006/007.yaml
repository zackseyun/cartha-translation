  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc chính: các kinh sư và người Pha-ri-sêu liên tục theo dõi Đức Giê-su để xem Người có chữa lành vào ngày Sa-bát không, với mục đích tìm căn cứ tố cáo Người. Tuy nhiên, “Đức Chúa Jêsus” vừa thêm tước hiệu “Chúa” không có trong câu nguồn vừa dùng chính tả mang tính truyền thống hệ phái; nên thay bằng dạng trung tính, chuẩn hiện đại hơn. “Chữa bệnh” cũng có thể gợi hoạt động hành nghề hơn là một hành vi chữa lành cụ thể đang bị theo dõi.'
  naturalness: Câu văn nhìn chung rõ và tự nhiên. Dùng “các kinh sư”, “Pha-ri-sêu”, “Giê-su”, và “chữa lành” phù hợp hơn với cách dùng Kinh Thánh tiếng Việt hiện đại, liên tôn/phổ thông. “Chăm chú theo dõi” giữ được ý theo dõi dai dẳng; mệnh đề “để tìm cớ tố cáo” diễn đạt tự nhiên mục đích thù nghịch.
  terminology: “Kinh sư” là tương đương trực tiếp, quen thuộc của γραμματεῖς. “Pha-ri-sêu” là dạng phiên âm Việt ngữ thông dụng hơn “Pha-ri-si”. Không nên đưa “Chúa” vào tên Giê-su tại đây, vì văn bản Hy Lạp không có κύριος; đại từ tôn kính “Người” đủ giữ văn phong trang trọng mà không thêm danh xưng.
