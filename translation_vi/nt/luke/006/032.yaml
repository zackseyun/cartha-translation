source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: vi
  text: Nếu anh em yêu những người yêu anh em, thì anh em có gì đáng khen?[a] Vì ngay cả những người tội lỗi cũng yêu những người yêu họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thì anh em được ân huệ gì?” Từ Hy Lạp có thể mang nghĩa “ân điển”, “ân huệ” hoặc “điều đáng ghi nhận”; tại đây, từ này nói đến điều đáng khen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: yêu / những người yêu / yêu
  rationale: Dùng nhất quán động từ “yêu” để giữ phép lặp có chủ ý trong câu Hy Lạp và sức mạnh của lập luận.
- source_word: ποία
  choice: gì
  rationale: Trong câu hỏi tu từ này, “gì” diễn đạt tự nhiên ý hỏi về giá trị hay điều đáng ghi nhận.
- source_word: χάρις
  choice: đáng khen
  rationale: Trong ngữ cảnh, từ này chỉ điều đáng ghi nhận hoặc đáng khen, chứ không chủ yếu nói về ân điển cứu rỗi. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ trọng tâm đạo đức của câu hỏi.
- source_word: ἁμαρτωλοὶ
  choice: những người tội lỗi
  rationale: Diễn đạt trực tiếp danh từ hóa của tính từ Hy Lạp, giữ nguyên phạm trù đạo đức mà bản văn sử dụng.
- source_word: καὶ γὰρ
  choice: Vì ngay cả
  rationale: “Vì” giữ chức năng giải thích của γάρ, còn “ngay cả” thể hiện sắc thái nhấn mạnh của καί.
- source_word: ὑμῖν
  choice: anh em có
  rationale: Ý nghĩa hướng đến người nghe được thể hiện tự nhiên bằng cấu trúc tiếng Việt “anh em có gì đáng khen”, thay vì dịch máy móc là “cho anh em”.
theological_decisions:
- issue: Nghĩa của χάρις trong lời Đức Chúa Jêsus
  choice: điều đáng khen hoặc đáng ghi nhận
  alternative: ân điển; ân huệ; lời cảm ơn
  rationale: Ngữ cảnh hỏi điều gì là khác biệt và đáng ghi nhận khi một người chỉ yêu những ai yêu mình. Dịch là “ân điển” có thể khiến độc giả hiện đại hiểu theo nghĩa thần học không phải là trọng tâm tại đây; chú thích vẫn bảo tồn phạm vi nghĩa của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp với lời dạy trực tiếp dành cho các môn đồ và giữ sắc thái số nhiều của ὑμῖν/ὑμᾶς. Phép lặp “yêu” được giữ nguyên; câu hỏi tu từ được diễn đạt theo cú pháp tiếng Việt tự nhiên.
