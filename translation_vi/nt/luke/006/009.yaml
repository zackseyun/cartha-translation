language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với họ: “Tôi hỏi các ông: Vào ngày Sa-bát, có được phép làm điều lành hay làm điều dữ[a], cứu một mạng sống hay hủy diệt nó[b] không?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “gây hại”. Từ Hy Lạp tạo nên sự tương phản giữa làm điều lành và làm điều dữ hoặc có hại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cứu một linh hồn hay hủy diệt nó”. Ở đây, “mạng sống” được ưu tiên vì văn cảnh nói đến việc bảo toàn hay hủy hoại sự sống của một con người.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn tả sự chuyển ý có sắc thái tương phản nhẹ khi Đức Giê-su đáp lại những người đang dò xét mình.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Tôi hỏi các ông
  rationale: Giữ hình thức chất vấn trực tiếp; “các ông” phù hợp với nhóm người đối thoại trong văn cảnh và tự nhiên trong tiếng Việt hiện đại.
- source_word: εἰ ἔξεστιν
  choice: có được phép ... không
  rationale: Thể hiện câu hỏi về điều luật pháp cho phép trong cuộc tranh luận liên quan đến ngày Sa-bát, đồng thời dùng cấu trúc nghi vấn tự nhiên của tiếng Việt.
- source_word: τῷ σαββάτῳ
  choice: trong ngày Sa-bát
  rationale: Diễn đạt cách tự nhiên ý nghĩa thời gian của cách dữ cách Hy Lạp và xác định rõ ngày đang được bàn đến.
- source_word: ἀγαθοποιῆσαι
  choice: làm điều lành
  rationale: Giữ rõ cực đạo đức tích cực và tạo thế đối xứng với “làm điều dữ”.
- source_word: κακοποιῆσαι
  choice: làm điều dữ
  rationale: Giữ sự đối lập đạo đức trực tiếp với ἀγαθοποιῆσαι; từ này cũng có thể nhấn mạnh hành động gây hại trong văn cảnh chữa lành.
- source_word: ψυχὴν
  choice: một mạng sống
  rationale: Trong cặp với “cứu” và “hủy diệt”, từ này chỉ sinh mạng hay sự sống của một con người trong hoàn cảnh cụ thể, không nhất thiết nói riêng về phần phi vật chất.
- source_word: σῶσαι
  choice: cứu
  rationale: Giữ nghĩa căn bản và mối liên hệ từ vựng rộng hơn của động từ, đồng thời phù hợp với ý bảo toàn mạng sống.
- source_word: ἀπολέσαι
  choice: hủy diệt mạng sống ấy
  rationale: Giữ sức mạnh của động từ và làm rõ tân ngữ được hiểu lại từ ψυχήν; không thu hẹp nghĩa thành riêng hành vi “giết”.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong cụm ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: Dịch theo nghĩa cụ thể là “cứu một mạng sống hay hủy diệt mạng sống ấy”.
  alternative: “cứu một linh hồn hay hủy diệt linh hồn ấy”; hoặc “cứu một người hay hủy diệt người ấy”.
  rationale: Văn cảnh chữa lành trong ngày Sa-bát tập trung vào việc bảo toàn hay làm hại sự sống con người, chứ không minh nhiên đưa ra một khẳng định nhân học về linh hồn. Chú thích vẫn bảo lưu khả năng từ vựng của ψυχή.
- issue: Sắc thái của κακοποιῆσαι
  choice: Dịch “làm điều dữ” để giữ đối cực đạo đức với “làm điều lành”.
  alternative: “gây hại” hoặc “làm hại”.
  rationale: Nguyên văn đặt hai hành động trong một thế tương phản vừa đạo đức vừa thực tiễn. Bản chính giữ tính đối xứng; chú thích nêu sắc thái gây tổn hại phù hợp với hoàn cảnh.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng cấu trúc nghi vấn tự nhiên “có được phép ... không”. Danh xưng “Đức Giê-su” và “ngày Sa-bát” phù hợp lối dùng Kinh Thánh phổ thông trong tiếng Việt. Hai cặp đối lập được giữ cân xứng để bảo toàn sức chất vấn của câu.
