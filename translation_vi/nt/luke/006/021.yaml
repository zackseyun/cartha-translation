  rationale: Chỉ sửa vị trí neo của chú thích b để khớp với từ Hy Lạp và từ bản dịch mà chú thích giải thích. Đồng thời thay thuật ngữ ngữ pháp trong chú thích a từ “danh động từ có mạo từ” thành “phân từ có mạo từ”, chính xác hơn đối với οἱ πεινῶντες và οἱ κλαίοντες. Nội dung câu dịch không cần thay đổi.
