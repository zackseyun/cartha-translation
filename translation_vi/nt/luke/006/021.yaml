id: LUK.6.21
reference: Luke 6:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: vi
  text: Phước cho anh em đang đói bây giờ[a], vì anh em sẽ được no[b]. Phước cho anh em đang khóc bây giờ, vì anh em sẽ cười.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Phước cho những người đang đói bây giờ … Phước cho những người đang khóc bây giờ.” Tiếng Hy Lạp dùng phân từ có mạo từ, nhưng ngữ cảnh trực tiếp hỗ trợ cách dịch bằng lời xưng hô “anh em”.'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “anh em sẽ được no đủ.” Động từ này thường chỉ việc được ăn no và cũng có thể mang nghĩa rộng hơn là được thỏa nguyện hoàn toàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Phước cho
  rationale: Cách nói này giữ được hình thức lời chúc phước cùng sắc thái tôn giáo và giao ước, thay vì chỉ diễn tả cảm giác vui vẻ chủ quan.
- source_word: οἱ πεινῶντες
  choice: anh em đang đói
  rationale: Danh động từ có mạo từ chỉ những người ở trong tình trạng đói đang tiếp diễn. Ngữ cảnh và các động từ ngôi thứ hai số nhiều cho thấy lời này được nói trực tiếp với các môn đồ.
- source_word: νῦν
  choice: bây giờ
  rationale: Diễn đạt rõ sự tương phản về thời gian giữa cảnh thiếu thốn hiện tại và sự đảo ngược sẽ đến.
- source_word: χορτασθήσεσθε
  choice: anh em sẽ được no
  rationale: Dạng tương lai bị động giữ hình ảnh cụ thể về việc được ăn no, đồng thời không loại trừ ý nghĩa rộng hơn về sự thỏa nguyện.
- source_word: οἱ κλαίοντες
  choice: anh em đang khóc
  rationale: Giữ hành động khóc đang diễn ra và lối nói trực tiếp trong ngữ cảnh; không thu hẹp nghĩa thành chỉ sự than khóc vì tang chế.
- source_word: γελάσετε
  choice: anh em sẽ cười
  rationale: Dịch trực tiếp hình ảnh cụ thể về tiếng cười, qua đó giữ nguyên sự đảo ngược sinh động của câu nói.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do của lời chúc phước bằng cách diễn đạt tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Lời nói trực tiếp hay công thức chúc phước chung ở ngôi thứ ba
  choice: Dùng “anh em đang đói/đang khóc” như lời nói trực tiếp.
  alternative: “Phước cho những người đang đói/đang khóc.”
  rationale: Tiếng Hy Lạp dùng danh động từ có mạo từ, vốn có thể được diễn đạt ở ngôi thứ ba, nhưng các động từ tương lai ở ngôi thứ hai số nhiều và ngữ cảnh trực tiếp với các môn đồ hỗ trợ cách xưng hô “anh em”.
- issue: Bản chất và thời điểm của sự đảo ngược được hứa
  choice: Giữ các hình ảnh cụ thể “được no” và “sẽ cười”, không xác định cách thức hay thời điểm ứng nghiệm.
  alternative: Giải thích rõ đây là sự thỏa nguyện thuộc linh hoặc chỉ là sự đảo ngược vào thời cuối cùng.
  rationale: Câu này hứa về một sự đảo ngược nhưng tự nó không xác định sự ứng nghiệm là trần thế, thuộc linh hay cánh chung; bản dịch không nên giải quyết thay sự căng thẳng đó.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để phản ánh lời Chúa Giê-su nói trực tiếp với nhóm môn đồ mà không đưa thêm cách giải thích hệ phái. Giữ nhịp song song, các hình ảnh cụ thể và sự tương phản giữa “bây giờ” với tương lai.
