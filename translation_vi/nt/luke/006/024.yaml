review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng thế đối lập của πλὴν, lực cảnh cáo/phán xét của οὐαί, đối tượng được gọi trực tiếp là người giàu, và quan hệ nguyên nhân do ὅτι. “Đã nhận được ... rồi” là cách diễn đạt có cơ sở cho ἀπέχετε, vốn có thể mang nghĩa thành ngữ là đã nhận/trọn phần; chú thích cũng bảo lưu nghĩa này. Cần sửa nhẹ cấu trúc ở cụm chỉ đối tượng được gọi để phản ánh rõ hơn dạng gọi trực tiếp trong tiếng Hy Lạp.
  naturalness: “Khốn cho các ngươi là những người giàu có” không tự nhiên trong tiếng Việt hiện đại vì “là” khiến cụm này dễ được đọc như một mệnh đề xác định chủ ngữ, thay vì một lời gọi trực tiếp. “Khốn cho các ngươi, những người giàu có” trang nghiêm, rõ ràng và tự nhiên hơn. “Sự an ủi” là danh ngữ thông dụng hơn “niềm an ủi” trong ngữ cảnh này.
  terminology: “Khốn cho,” “giàu có,” và “an ủi” phù hợp với sắc thái văn bản và ngữ vực trang nghiêm. Không cần thêm diễn giải rằng người giàu cậy vào của cải hoặc chỉ sự giàu có ở đời này.
  issues:
  - severity: medium
    issue: Cấu trúc “các ngươi là những người giàu có” không rõ chức năng gọi trực tiếp.
    rationale: ὑμῖν τοῖς πλουσίοις là lời ngỏ trực tiếp với nhóm “các ngươi, những người giàu có.” Bỏ “là” và dùng dấu phẩy tái tạo quan hệ đồng vị này tự nhiên hơn trong tiếng Việt.
  - severity: low
    issue: “Niềm an ủi” kém tự nhiên hơn “sự an ủi” trong câu này.
    rationale: Cả hai đều có thể dịch παράκλησις, nhưng “sự an ủi” là cách kết hợp thông dụng và trung tính hơn, đồng thời vẫn giữ được nghĩa comfort/consolation.
  revised_text: Nhưng khốn cho các ngươi, những người giàu có, vì các ngươi đã nhận được sự an ủi[b] của mình rồi.[a]
