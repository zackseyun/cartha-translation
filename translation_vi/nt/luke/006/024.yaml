revisions:
- from: Nhưng khốn cho các ngươi là những người giàu có, vì các ngươi đã nhận được niềm an ủi[b] của mình rồi.[a]
  to: Nhưng khốn cho các ngươi, những người giàu có, vì các ngươi đã nhận được sự an ủi[b] của mình rồi.[a]
  rationale: Bản sửa chỉ cải thiện cú pháp tiếng Việt và lựa chọn danh ngữ, không thay đổi nghĩa của câu. Thì/khía cạnh của ἀπέχετε vẫn được thể hiện bằng “đã nhận được ... rồi,” còn khả năng “nhận đủ” được giữ trong chú thích.
  reviewer_model: gpt-5.6-terra
