  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: vi
  text: Nhưng khốn cho các ngươi, những người giàu có, vì các ngươi đã nhận được sự an ủi[b] của mình rồi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã nhận đủ sự an ủi dành cho mình.” Động từ này có thể mang nghĩa nhận đầy đủ điều thuộc về mình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sự khuây khỏa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Nhưng
  rationale: Diễn đạt tự nhiên sự tương phản mạnh với các lời phước trước đó.
- source_word: οὐαὶ
  choice: khốn cho
  rationale: Giữ được sắc thái nghiêm trọng của công thức cảnh cáo và phán xét mang tính tiên tri, không làm nhẹ thành một tiếng than đơn thuần.
- source_word: ὑμῖν τοῖς πλουσίοις
  choice: cho các ngươi là những người giàu có
  rationale: Giữ lời nói trực tiếp ở ngôi thứ hai và xác định rõ nhóm người được nói đến; “các ngươi” phù hợp với giọng cảnh cáo trang nghiêm.
- source_word: ὅτι
  choice: vì
  rationale: Nêu rõ lý do của lời tuyên bố “khốn cho” bằng một liên từ tự nhiên trong tiếng Việt.
- source_word: ἀπέχετε
  choice: đã nhận được ... rồi
  rationale: Diễn đạt tình trạng hiện tại là họ đã có sự an ủi ấy, đồng thời không đưa toàn bộ sắc thái “nhận đủ” vào chính văn; sắc thái đó được bảo lưu trong chú thích.
- source_word: παράκλησιν
  choice: niềm an ủi
  rationale: Là cách nói tự nhiên, dễ hiểu, giữ nghĩa comfort/consolation thích hợp trong văn cảnh đối lập và đảo ngược.
- source_word: ὑμῶν
  choice: của mình
  rationale: Đại từ phản thân sở hữu tự nhiên trong câu tiếng Việt có chủ ngữ ngôi thứ hai, tương ứng với sở hữu cách của bản Hy Lạp.
theological_decisions:
- issue: Tính chất của lời cảnh cáo dành cho người giàu
  choice: Dịch trực tiếp “khốn cho ... những người giàu có,” không làm nhẹ lời này và không thêm điều kiện như “những người tin cậy nơi của cải.”
  alternative: Than ôi cho các ngươi; hoặc những người giàu có trong đời này/những người cậy vào của cải
  rationale: Bản Hy Lạp trực tiếp nói với người giàu và dùng οὐαί; mọi phần giải thích thêm về nguyên nhân đạo đức cụ thể đều vượt quá câu này.
- issue: Sắc thái thời và nghĩa của ἀπέχετε
  choice: Chính văn dùng “đã nhận được ... rồi,” diễn đạt việc sự an ủi hiện đã thuộc về họ.
  alternative: đang nhận; đã nhận đủ/trọn phần an ủi
  rationale: Dạng hiện tại có thể chỉ tình trạng đang có, còn động từ cũng mang thành ngữ thương mại “nhận đủ.” Chú thích bảo lưu sắc thái thứ hai để không giải quyết dứt khoát sự căng thẳng từ vựng.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp. “Các ngươi” được chọn thay vì “anh em” để giữ sức nặng của lời cảnh cáo, tránh hàm ý thân mật hoặc cộng đồng không có sẵn trong câu Hy Lạp.
