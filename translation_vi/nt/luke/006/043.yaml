id: LUK.6.43
reference: Luke 6:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: vi
  text: Vì không có cây tốt nào sinh quả xấu, cũng không có cây xấu nào sinh quả tốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: Vì không có
  rationale: “Vì” giữ chức năng giải thích của γάρ và nối câu này với lời dạy ngay trước đó; “không có” diễn đạt tự nhiên cấu trúc phủ định sự hiện hữu.
- source_word: δένδρον καλὸν
  choice: cây tốt
  rationale: “Cây” là nghĩa thông thường của δένδρον trong hình ảnh cây ăn trái; “tốt” giữ được cả nghĩa nông nghiệp lẫn sức gợi đạo đức của καλός.
- source_word: ποιοῦν καρπὸν
  choice: sinh quả
  rationale: Trong tiếng Việt, “cây sinh quả” diễn đạt tự nhiên hành động ποιέω với καρπός, đồng thời giữ hình ảnh cụ thể và sắc thái ẩn dụ.
- source_word: σαπρόν
  choice: hư
  rationale: “Hư” có thể dùng cho quả bị hỏng và cây không tốt, nhờ đó giữ cùng một từ cho hai lần xuất hiện của σαπρός mà không thu hẹp nghĩa chỉ còn “thối” hay chỉ còn đánh giá trừu tượng “xấu”.
- source_word: οὐδὲ πάλιν
  choice: ngược lại, … cũng không
  rationale: Cách diễn đạt này truyền đạt tự nhiên sự phối hợp phủ định của οὐδέ và ý đảo chiều tương phản của πάλιν.
- source_word: καρπὸν καλόν
  choice: quả tốt
  rationale: Giữ sự đối xứng với “cây tốt” và thế tương phản chặt chẽ của câu Hy Lạp.
theological_decisions:
- issue: Cường độ của hình ảnh nông nghiệp và hàm ý đạo đức trong σαπρός
  choice: Dùng “hư” ở cả “quả hư” và “cây hư”
  alternative: “quả thối/cây mục” hoặc “quả xấu/cây xấu”
  rationale: “Hư” giữ được hình ảnh cây và quả không lành mạnh, đồng thời để hàm ý đạo đức phát sinh từ ẩn dụ thay vì đưa thẳng một phán đoán đạo đức vào câu. Việc lặp cùng từ cũng phản ánh việc bản Hy Lạp dùng cùng một tính từ ở cả hai vế.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc hai vế cân xứng giữ tính cách ngôn của nguyên văn; “ngược lại” diễn đạt πάλιν tự nhiên hơn lối dịch sát chữ “lại nữa” trong tiếng Việt.
