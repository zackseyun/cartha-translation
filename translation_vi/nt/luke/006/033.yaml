id: LUK.6.33
reference: Luke 6:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: vi
  text: Nếu anh em làm điều tốt cho những người làm điều tốt cho mình, thì anh em có gì đáng được khen?[a] Ngay cả những người tội lỗi cũng làm như vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “anh em được ân huệ gì?” Từ Hy Lạp có thể mang nghĩa “ân điển”, “ân huệ”, “lời cảm ơn” hoặc “sự ghi nhận”; ở đây, từ này nói đến sự khen ngợi dành cho việc lấy điều tốt đáp lại điều tốt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: làm điều tốt
  rationale: Diễn đạt tự nhiên ý làm điều lành hoặc đem lợi ích cho người khác, đồng thời giữ được sự lặp lại với phân từ cùng gốc ở vế sau.
- source_word: ἀγαθοποιοῦντας
  choice: những người làm điều tốt
  rationale: Giữ nhất quán với ἀγαθοποιῆτε và chuyển cấu trúc phân từ Hy Lạp thành mệnh đề quan hệ tự nhiên trong tiếng Việt.
- source_word: ποία ... χάρις
  choice: có gì đáng được khen
  rationale: Trong ngữ cảnh lời dạy đạo đức này, χάρις chỉ sự ghi nhận hoặc khen ngợi dành cho hành động, chứ không nhất thiết mang nghĩa thần học là ân điển. Cách diễn đạt này tự nhiên trong câu hỏi tu từ tiếng Việt.
- source_word: ὑμῖν
  choice: anh em ... được
  rationale: Ý nghĩa hướng đến người nghe được thể hiện tự nhiên trong cấu trúc “anh em có gì đáng được khen”, thay vì dịch máy móc giới từ cách là “cho anh em”.
- source_word: ἁμαρτωλοὶ
  choice: những người tội lỗi
  rationale: Cách dịch trực tiếp, rõ ràng, giữ nguyên phạm trù đạo đức-xã hội trong Lu-ca mà không làm nhẹ nghĩa.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: cũng làm như vậy
  rationale: Cách nói tiếng Việt tự nhiên và chính xác cho thành ngữ Hy Lạp “làm cùng một điều”.
- source_word: καὶ
  choice: Nếu / Ngay cả ... cũng
  rationale: Liên từ đầu câu được hòa vào cấu trúc tiếng Việt vì câu đã mở bằng “Nếu”; liên từ thứ hai mang sắc thái tăng tiến, được diễn đạt bằng “Ngay cả ... cũng”.
theological_decisions:
- issue: Nghĩa của χάρις trong ngữ cảnh lời dạy đạo đức
  choice: sự khen ngợi hoặc ghi nhận
  alternative: ân điển; ân huệ; lời cảm ơn
  rationale: Câu hỏi tu từ nói về sự ghi nhận dành cho lòng tốt có tính đáp trả. Bản dịch chính tránh đưa nghĩa cứu rỗi vào nơi văn bản không nêu rõ, còn chú thích bảo lưu phạm vi nghĩa rộng của từ Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp với lời Đức Chúa Jêsus nói với các môn đồ và đám đông trong văn mạch. Phép lặp “làm điều tốt” được giữ có chủ ý để phản ánh sự lặp từ trong nguyên văn.
