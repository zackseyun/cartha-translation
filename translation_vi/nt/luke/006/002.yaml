review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng thành phần cốt lõi của câu: chỉ một bộ phận người Pha-ri-si lên tiếng, câu hỏi mang ý chất vấn “tại sao,” và điều bị cho là không được phép liên hệ đến ngày Sa-bát. Tuy nhiên, “một số người Pha-ri-si” có thể được hiểu là những người mang tên Pha-ri-si hơn là một số người thuộc nhóm/phái này; thêm “thuộc phái” phản ánh rõ hơn τῶν Φαρισαίων. Giới từ thời gian “vào” tự nhiên và sát chức năng của τοῖς σάββασιν hơn “trong ngày.”'
  naturalness: Câu nhìn chung tự nhiên, trang trọng vừa phải. “Vào ngày Sa-bát” là cách nói tiếng Việt hiện đại thông dụng hơn “trong ngày Sa-bát” trong một quy định hoặc hành động diễn ra vào một ngày cụ thể.
  terminology: Giữ “Pha-ri-si” và “Sa-bát,” là các cách phiên âm Kinh Thánh tiếng Việt quen thuộc. “Không được phép” phản ánh ἔξεστιν tốt hơn “trái luật,” vì đây là lời phản đối của người Pha-ri-si và không tự xác nhận tiêu chuẩn pháp lý của họ.
  issues:
  - severity: low
    issue: Cụm chỉ nhóm Pha-ri-si có thể rõ hơn.
    rationale: τινὲς δὲ τῶν Φαρισαίων nghĩa là “một số [người] trong/thuộc nhóm Pha-ri-si.” “Một số người thuộc phái Pha-ri-si” giữ rõ quan hệ bộ phận mà vẫn tự nhiên.
  - severity: low
    issue: Giới từ thời gian cần tự nhiên hơn.
    rationale: τοῖς σάββασιν là thành ngữ chỉ thời điểm/ngày Sa-bát. Tiếng Việt hiện đại thường nói “vào ngày Sa-bát”; số ít là phù hợp vì số nhiều Hy Lạp ở đây có tính thành ngữ.
  revised_text: 'Nhưng một số người thuộc phái Pha-ri-si nói: “Tại sao các ông làm điều không được phép vào ngày Sa-bát?”'
