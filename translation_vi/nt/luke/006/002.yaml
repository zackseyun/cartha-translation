  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: vi
  text: 'Nhưng một số người thuộc phái Pha-ri-si nói: “Tại sao các ông làm điều không được phép vào ngày Sa-bát?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: một số người
  rationale: Diễn tả một bộ phận trong nhóm người Pha-ri-si, không quy lời chất vấn cho toàn thể nhóm.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện bước chuyển nhẹ mang tính tương phản từ hành động của các môn đồ sang lời phản đối.
- source_word: Φαρισαίων
  choice: người Pha-ri-si
  rationale: Dùng cách phiên âm quen thuộc trong tiếng Việt cho tên nhóm Do Thái này.
- source_word: Τί ποιεῖτε
  choice: Tại sao các ông làm
  rationale: Τί theo nghĩa đen là “gì”, nhưng trong cấu trúc chất vấn này có nghĩa tự nhiên là “tại sao”; “các ông” giữ ngôi thứ hai số nhiều.
- source_word: ὃ οὐκ ἔξεστιν
  choice: điều không được phép
  rationale: Giữ sắc thái quy chuẩn về điều được phép hay không được phép mà không khẳng định thêm rằng hành động ấy thật sự vi phạm luật Đức Chúa Trời.
- source_word: τοῖς σάββασιν
  choice: trong ngày Sa-bát
  rationale: Danh từ số nhiều trong tiếng Hy Lạp là một cách nói thông dụng chỉ ngày Sa-bát; tiếng Việt tự nhiên dùng số ít trong ngữ cảnh này.
theological_decisions:
- issue: Tính chất của lời cáo buộc về ngày Sa-bát
  choice: không được phép
  alternative: trái luật
  rationale: “Không được phép” phản ánh ἔξεστιν và trình bày đúng lời chất vấn của người Pha-ri-si, nhưng không ngầm xác nhận cách giải thích luật Sa-bát của họ.
- issue: Dạng số của cụm từ chỉ ngày Sa-bát
  choice: trong ngày Sa-bát
  alternative: trong các ngày Sa-bát
  rationale: τοῖς σάββασιν có hình thức số nhiều nhưng được dùng theo thành ngữ để nói về ngày Sa-bát. Số ít truyền đạt đúng nghĩa trong tiếng Việt hiện đại mà không làm thay đổi nội dung thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Các ông” biểu thị rõ đối tượng được nói với là số nhiều; “Pha-ri-si” và “Sa-bát” theo lối phiên âm phổ biến. Không thêm từ ngữ nhằm phân xử trước cuộc tranh luận về việc giữ ngày Sa-bát.
