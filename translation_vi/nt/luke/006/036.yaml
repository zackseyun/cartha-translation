  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: vi
  text: Hãy có lòng thương xót[a], như Cha anh em là Đấng có lòng thương xót.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy có lòng trắc ẩn.” Tính từ Hy Lạp chỉ người động lòng thương cảm và bày tỏ lòng thương xót.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Hãy có
  rationale: Mệnh lệnh thức hiện tại, ngôi thứ hai số nhiều, kêu gọi một phẩm chất phải được thể hiện liên tục. “Hãy có lòng” tự nhiên trong tiếng Việt hơn cách dịch sát cứng “hãy trở nên”.
- source_word: οἰκτίρμονες
  choice: có lòng thương xót
  rationale: Diễn đạt phẩm chất thương cảm dẫn đến việc bày tỏ lòng thương xót; cách nói này tự nhiên, trang trọng và giữ được sắc thái đạo đức của tính từ Hy Lạp.
- source_word: καθὼς
  choice: như
  rationale: Đánh dấu sự so sánh, nêu Cha làm khuôn mẫu cho cách sống của các môn đồ, không chuyển thành quan hệ nguyên nhân “vì”.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Cha anh em
  rationale: Giữ đúng nguyên văn “Cha của anh em”, không thêm “trên trời”; “anh em” diễn đạt ngôi thứ hai số nhiều trong văn phong Kinh Thánh hiện đại, trang trọng.
- source_word: οἰκτίρμων
  choice: là Đấng có lòng thương xót
  rationale: Giữ liên kết từ vựng với lần xuất hiện trước; thêm “Đấng” giúp câu vị ngữ nói về Cha tự nhiên và tôn kính trong tiếng Việt mà không thêm một thuộc tính ngoài bản văn.
theological_decisions:
- issue: Mối liên hệ giữa mệnh lệnh và phẩm tính của Cha
  choice: Dùng “như” để trình bày lòng thương xót của Cha là khuôn mẫu cho cách sống của người nghe.
  alternative: 'Dịch theo quan hệ nguyên nhân: “vì Cha anh em có lòng thương xót.”'
  rationale: καθὼς ở đây biểu thị sự so sánh. Cách dịch này giữ nguyên lời kêu gọi noi theo phẩm tính của Cha mà không thêm lời giải thích thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “lòng thương xót” ở cả hai vế để bảo toàn sự lặp lại có chủ ý của cùng một tính từ Hy Lạp; dùng “Cha anh em” thay vì thêm “Cha trên trời” vì nguyên văn không có từ tương ứng.
