base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: vi
  text: 'Người nói với họ: “Con Người là Chúa của ngày Sa-bát.”[a]


    [a] Hay: “Con Người là Chúa trên ngày Sa-bát.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Con Người là Chúa trên ngày Sa-bát.”'
    reason: Nêu cách diễn đạt tiếng Việt khác cho quan hệ thẩm quyền được diễn tả bởi sở thuộc cách τοῦ σαββάτου sau Κύριος, mà vẫn giữ lời khẳng định trực tiếp của câu.
lexical_decisions:
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại, nhưng trong lối kể chuyện tiếng Việt, “nói” là cách diễn đạt tự nhiên và không làm mất ý chính; thêm “đang” hoặc “vẫn” ở đây dễ tạo sắc thái không chắc chắn từ ngữ cảnh.
- source_word: Κύριος
  choice: Chúa
  rationale: Ở đây từ này diễn tả địa vị và thẩm quyền của Con Người, không chỉ là cách xưng hô lịch sự. “Chúa” giữ được sức nặng của danh xưng mang tính Kitô học.
- source_word: τοῦ σαββάτου
  choice: của ngày Sa-bát
  rationale: Dịch sát cấu trúc sở hữu của nguyên văn, đồng thời diễn tả mối quan hệ thẩm quyền đối với ngày Sa-bát. Bản chú thích nêu cách diễn đạt rõ nghĩa hơn là “có quyền làm Chúa trên” mà không áp đặt thêm từ “ngay cả” vốn không có trong câu này.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Đây là danh xưng quen thuộc của Đức Giê-su, giữ được nền tảng Do Thái và khả năng liên hệ với Đa-ni-ên 7. Viết hoa để nhận diện đây là danh xưng, không chỉ là cách nói chung về một con người.
- source_word: καὶ
  choice: không dịch riêng
  rationale: Liên từ nối tiếp mạch kể đã được thể hiện tự nhiên bằng việc bắt đầu câu mới; dịch máy móc là “và” sẽ kém tự nhiên trong tiếng Việt mà không thêm nội dung đáng kể.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Đại từ số nhiều chỉ những người đang đối thoại với Đức Giê-su; “với họ” tự nhiên và không thêm sự xác định ngoài nguyên văn.
theological_decisions:
- issue: Sức nặng Kitô học trong lời tuyên bố về ngày Sa-bát
  choice: “Con Người là Chúa của ngày Sa-bát”
  alternative: “Con Người có quyền làm Chúa trên ngày Sa-bát”
  rationale: Bản dịch chính giữ lời khẳng định trực tiếp và cô đọng rằng Con Người có địa vị Chúa đối với ngày Sa-bát. Không thêm “ngay cả,” vì nguyên văn câu này không có yếu tố ấy; chú thích chỉ làm rõ quan hệ thẩm quyền vốn có thể được diễn đạt bằng “trên”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngày Sa-bát” là cách gọi quen thuộc trong tiếng Việt; câu chính giữ cấu trúc cô đọng của Hy Lạp, còn chú thích cung cấp cách diễn đạt minh nhiên hơn về thẩm quyền.
