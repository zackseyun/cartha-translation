review_pass:
  verdict: revise
  source_fidelity: 'Câu chính chuyển đạt đúng mệnh đề Hy Lạp: chủ ngữ danh xưng «Con Người», vị ngữ khẳng định «là Chúa», và sở thuộc cách «của ngày Sa-bát». «Người nói với họ» giữ đại từ số nhiều αὐτοῖς mà không thêm định danh; thì chưa hoàn thành ἔλεγεν có thể được diễn đạt tự nhiên bằng quá khứ đơn trong tiếng Việt kể chuyện.'
  naturalness: «Con Người là Chúa của ngày Sa-bát» tự nhiên, trang trọng và phù hợp với cách dùng Kinh Thánh tiếng Việt hiện đại. Tuy nhiên, «có quyền làm Chúa trên» trong chú thích không tự nhiên và làm yếu/diễn giải lời khẳng định trực tiếp của nguyên văn.
  terminology: Giữ nhất quán các danh xưng «Con Người», «Chúa» và thuật ngữ «ngày Sa-bát». Đổi «Ngài» thành «Người» để phản ánh chủ ngữ hàm ẩn của nguyên văn mà không thêm một kính ngữ ngoài văn bản; trong ngữ cảnh, «Người» vẫn chỉ Đức Giê-su.
  issues:
  - severity: medium
    issue: Chú thích thay thế diễn đạt «có quyền làm Chúa trên».
    rationale: Cụm này không phải cách nói tự nhiên trong tiếng Việt và chuyển lời tuyên bố bản thể/danh hiệu «là Chúa» thành một diễn giải về quyền hạn. Cách thay thế sát và rõ hơn là «là Chúa trên ngày Sa-bát».
  - severity: low
    issue: Dùng «Ngài» cho chủ ngữ không được nêu trong câu Hy Lạp.
    rationale: Tuy không sai trong văn cảnh, đây là kính ngữ được thêm vào. «Người» là lựa chọn trung tính hơn, vẫn phù hợp với văn phong Kinh Thánh và bám sát câu nguồn.
  revised_text: 'Người nói với họ: “Con Người là Chúa của ngày Sa-bát.”[a]


