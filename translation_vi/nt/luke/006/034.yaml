revisions:
- from: Nếu anh em cho những người mà mình mong sẽ nhận lại[a] vay, thì có gì đáng khen? Ngay cả những người tội lỗi cũng cho những người tội lỗi vay để nhận lại đủ số đã cho vay.
  to: Nếu anh em cho những người mà anh em mong nhận lại từ họ vay, thì có gì đáng khen cho anh em? Ngay cả những người tội lỗi cũng cho những người tội lỗi vay để nhận lại phần tương đương.
  rationale: 'Chỉnh cú pháp của mệnh đề cho vay để phản ánh rõ δανίσητε παρ’ ὧν ἐλπίζετε λαβεῖν: người được cho vay là chính những người mà từ họ người cho vay kỳ vọng nhận lại. Thay «mình» bằng «anh em» để nhất quán ngôi xưng. Thay «đủ số đã cho vay» bằng «phần tương đương» để dịch τὰ ἴσα sát và trung tính hơn, không quy định loại tài sản hay chi tiết hoàn trả vượt quá nguyên văn. Neo chú thích tại «mong» vẫn cần được giữ trong văn bản.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc và ý chính của nguyên văn: cho vay với kỳ vọng nhận lại, câu hỏi tu từ về sự đáng khen, và sự có đi có lại giữa những người tội lỗi. Tuy nhiên, trật tự từ trong «cho những người mà mình mong sẽ nhận lại vay» khiến «vay» có thể bị hiểu là bổ nghĩa cho «nhận lại», đồng thời không biểu đạt rõ quan hệ «nhận lại từ họ» của παρ’ ὧν. «Đủ số đã cho vay» nhìn chung đúng ý τὰ ἴσα, nhưng «phần tương đương» sát hơn với cách nói mở của tiếng Hy Lạp và không giới hạn vào một khoản tiền cụ thể.'
  naturalness: Cần chỉnh câu đầu để tiếng Việt hiện đại rõ và trôi chảy hơn. «Nếu anh em cho những người mà anh em mong nhận lại từ họ vay» giữ được cách nói tự nhiên «cho ai vay», đồng thời đặt rõ nguồn của điều nhận lại. Dùng nhất quán «anh em» thay vì chuyển sang «mình» cũng phù hợp với ngôi xưng của lời nói trực tiếp.
  terminology: «Cho vay», «những người tội lỗi», và «có gì đáng khen» phù hợp với ngữ cảnh. «Có gì đáng khen cho anh em?» diễn đạt χάρις theo nghĩa sự tín nhiệm/đáng được ghi nhận về mặt đạo đức, không áp đặt nghĩa ân điển thần học. Chú thích chỉ nên neo ở «mong» và nêu lựa chọn «trông đợi»/«hy vọng» cho ἐλπίζετε; không cần đưa một thay thế không thuộc từ được neo.
  issues:
  - severity: medium
    issue: Cú pháp câu đầu mơ hồ và thiếu rõ quan hệ «từ họ».
    rationale: Cụm «cho những người mà mình mong sẽ nhận lại vay» có thể gây ngập ngừng khi đọc vì «vay» đứng sau «nhận lại», và không thể hiện minh nhiên rằng điều nhận lại đến từ những người được cho vay (παρ’ ὧν).
  - severity: low
    issue: «Đủ số đã cho vay» cụ thể hóa τὰ ἴσα hơi hẹp.
    rationale: Ngữ cảnh quả thực là cho vay, nhưng τὰ ἴσα nói rộng là điều/phần tương đương. «Phần tương đương» bảo toàn tính khái quát của nguyên văn mà vẫn tự nhiên.
  revised_text: Nếu anh em cho những người mà anh em mong nhận lại từ họ vay, thì có gì đáng khen cho anh em? Ngay cả những người tội lỗi cũng cho những người tội lỗi vay để nhận lại phần tương đương.
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trông đợi nhận lại từ họ” hoặc “hy vọng nhận lại từ họ.” Động từ Hy Lạp có thể mang nghĩa “hy vọng” hoặc “trông đợi.”'
    reason: lexical_alternative
  revision_rationale: 'Chỉnh cú pháp của mệnh đề cho vay để phản ánh rõ δανίσητε παρ’ ὧν ἐλπίζετε λαβεῖν: người được cho vay là chính những người mà từ họ người cho vay kỳ vọng nhận lại. Thay «mình» bằng «anh em» để nhất quán ngôi xưng. Thay «đủ số đã cho vay» bằng «phần tương đương» để dịch τὰ ἴσα sát và trung tính hơn, không quy định loại tài sản hay chi tiết hoàn trả vượt quá nguyên văn. Neo chú thích tại «mong» vẫn cần được giữ trong văn bản.'
