  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: vi
  text: Nếu anh em cho những người mà anh em mong nhận lại từ họ vay, thì có gì đáng khen cho anh em? Ngay cả những người tội lỗi cũng cho những người tội lỗi vay để nhận lại phần tương đương.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: cho ... vay
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, giữ rõ nghĩa cho vay tiền hoặc tài vật.
- source_word: παρ’ ὧν
  choice: những người mà mình ... nhận lại
  rationale: Trong kết cấu với động từ cho vay, cụm này chỉ những người mà người cho vay trông đợi nhận lại khoản đã cho vay; cách diễn đạt tiếng Việt tránh lặp giới từ cứng nhắc.
- source_word: ἐλπίζετε λαβεῖν
  choice: mong sẽ nhận lại
  rationale: ἐλπίζω có thể mang nghĩa hy vọng hoặc trông đợi. “Mong” giữ được phần nào độ rộng ấy, còn “nhận lại” làm rõ ý hoàn trả trong văn cảnh cho vay.
- source_word: ποία ... χάρις ἐστίν
  choice: thì có gì đáng khen?
  rationale: Trong điệp câu của phân đoạn này, χάρις nói đến điều khiến hành vi được nhìn nhận hoặc khen ngợi, chứ không phải ân điển cứu rỗi. Cách dịch này tự nhiên và phù hợp câu hỏi tu từ.
- source_word: ἁμαρτωλοὶ
  choice: những người tội lỗi
  rationale: Diễn đạt rõ tính từ được dùng như danh từ, giữ nguyên phạm trù đạo đức trong lời Chúa Giê-su mà vẫn tự nhiên với độc giả hiện đại.
- source_word: ἵνα ἀπολάβωσιν
  choice: để nhận lại
  rationale: ἀπολαμβάνω ở đây có nghĩa nhận lại hoặc thu hồi điều đã cho vay.
- source_word: τὰ ἴσα
  choice: đủ số đã cho vay
  rationale: Cụm từ chỉ phần tương đương được hoàn lại. Cách dịch diễn đạt rõ việc nhận lại đầy đủ khoản gốc mà không hàm ý tiền lãi.
theological_decisions:
- issue: Ý nghĩa của χάρις trong câu hỏi tu từ
  choice: Dịch là “có gì đáng khen”, theo nghĩa hành vi có gì đáng được nhìn nhận hay khen ngợi.
  alternative: “được cảm ơn gì”, “được ơn gì”, hoặc “được lợi gì”
  rationale: Văn cảnh đối chiếu cách cư xử của môn đồ với người tội lỗi. Trọng tâm là giá trị khác biệt đáng được nhìn nhận, không phải ân điển cứu rỗi như một thuật ngữ thần học. Tuy vậy, nghĩa “được cảm ơn” vẫn là một khả năng từ vựng và được ghi ở chú thích.
- issue: Bản chất của điều nhận lại khi cho vay
  choice: Diễn đạt trung tính là nhận lại đủ số đã cho vay.
  alternative: Nhận cả vốn lẫn lãi hoặc thu lợi
  rationale: τὰ ἴσα chỉ phần tương đương, không xác định tiền lãi hay lợi nhuận; bản dịch không đưa thêm một lập trường kinh tế hoặc đạo đức mà nguyên văn không nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” để phù hợp lời Chúa Giê-su nói với các môn đồ. Cụm “đủ số đã cho vay” tránh lối dịch quá sát “những điều bằng nhau” và không hàm ý có lãi.
