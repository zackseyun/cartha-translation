  terminology: “Phước,” “môn đồ,” và “vương quốc Đức Chúa Trời” nhất quán với đăng ký bản dịch đã chọn. “Những người nghèo khó” không thêm cách hiểu “trong tâm linh” và phù hợp với πτωχοί.
  issues:
