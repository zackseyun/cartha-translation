    issue: “Các con” trong mệnh đề cuối thêm sắc thái quan hệ cha-con.
    rationale: Ὑμετέρα chỉ là sở hữu ngôi thứ hai số nhiều, không xác định người nghe là “con.” Trong ngữ cảnh Chúa Giê-su nói với các môn đồ, “anh em” giữ lời xưng hô trực tiếp mà không đưa thêm một quan hệ diễn giải vào bản văn.
  - severity: low
    issue: “Các môn đồ mình” có thể được chỉnh thành “các môn đồ của Ngài.”
    rationale: Cách này rõ chủ thể sở hữu hơn và hợp với văn phong trang trọng hiện đại, không thay đổi nghĩa.
