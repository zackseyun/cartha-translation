- from: 'Ngài ngước mắt nhìn các môn đồ mình và nói: “Phước cho những người nghèo khó[a], vì vương quốc Đức Chúa Trời thuộc về các con.”'
  to: 'Ngài ngước mắt nhìn các môn đồ của Ngài và nói: “Phước cho những người nghèo khó[a], vì vương quốc Đức Chúa Trời thuộc về anh em.”'
  rationale: Thay “các con” bằng “anh em” để không thêm quan hệ cha-con ngoài nguyên ngữ, đồng thời vẫn giữ sự chuyển từ cụm ngôi thứ ba “những người nghèo khó” sang lời xưng hô trực tiếp trong mệnh đề sở hữu. Chỉnh “các môn đồ mình” thành “các môn đồ của Ngài” cho rõ ràng và tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
