id: LUK.6.20
reference: Luke 6:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: vi
  text: 'Ngài ngước mắt nhìn các môn đồ của Ngài và nói: “Phước cho những người nghèo khó[a], vì vương quốc Đức Chúa Trời thuộc về anh em.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lu-ca viết “những người nghèo khó,” không viết “những người nghèo khó trong tâm linh” (so sánh Ma-thi-ơ 5:3).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ngước mắt
  rationale: Diễn đạt tự nhiên trong tiếng Việt hành động hướng mắt lên; phân từ bất định quá khứ nêu hành động đi trước hoặc đi kèm động từ chính.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: nhìn các môn đồ mình
  rationale: εἰς chỉ hướng nhìn. Cách diễn đạt này tự nhiên hơn lối dịch sát từng chữ “về phía các môn đồ của Ngài” mà vẫn giữ đúng hình ảnh.
- source_word: ἔλεγεν
  choice: nói
  rationale: Thì chưa hoàn thành có thể tạo khung cho lời giảng đang được trình bày; tiếng Việt không cần thêm yếu tố kéo dài thiếu tự nhiên như “đang nói rằng” trong ngữ cảnh này.
- source_word: Μακάριοι
  choice: Phước cho
  rationale: Công thức chúc phước trang trọng, quen thuộc và tự nhiên trong tiếng Việt; tránh thu hẹp nghĩa thành cảm xúc chủ quan như “hạnh phúc”.
- source_word: οἱ πτωχοί
  choice: những người nghèo khó
  rationale: Giữ hình thức ngôi thứ ba của cụm danh hóa trong Hy Lạp và nghĩa thông thường của πτωχοί, không thêm “trong tâm linh” từ câu song song ở Ma-thi-ơ.
- source_word: ὅτι
  choice: vì
  rationale: Thể hiện quan hệ nguyên nhân giữa lời chúc phước và mệnh đề theo sau.
- source_word: ὑμετέρα ἐστίν
  choice: thuộc về các con
  rationale: Truyền đạt vị ngữ sở hữu “là của các con” bằng lối nói tự nhiên, đồng thời giữ rõ việc Chúa Giê-su trực tiếp nói với các môn đồ.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Giữ phạm vi nghĩa của βασιλεία và cách gọi trang trọng, phổ biến trong tiếng Việt, không thu hẹp chỉ còn hành động cai trị.
theological_decisions:
- issue: πτωχοί nói về người nghèo theo nghĩa nào
  choice: những người nghèo khó
  alternative: những người nghèo khó trong tâm linh
  rationale: Lu-ca chỉ viết “những người nghèo khó”; không nên hòa đồng câu này với Ma-thi-ơ 5:3 hay âm thầm giới hạn nó vào sự nghèo khó thuộc linh.
- issue: Hình thức ngôi thứ ba của οἱ πτωχοί và lời xưng hô trực tiếp trong ὑμετέρα
  choice: Giữ “những người nghèo khó” rồi chuyển sang “các con”
  alternative: Phước cho các con là những người nghèo khó
  rationale: Cách chọn giữ được hình thức ngôi thứ ba của tiếng Hy Lạp, đồng thời mệnh đề sau vẫn bộc lộ rõ lời nói trực tiếp với các môn đồ; nhờ vậy không xóa đi sự chuyển đổi ngữ pháp của nguyên bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su và “các con” trong lời Ngài trực tiếp nói với các môn đồ; giữ thuật ngữ quen thuộc “môn đồ,” “phước” và “vương quốc Đức Chúa Trời.”
