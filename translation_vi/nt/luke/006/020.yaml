  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính: Chúa Giê-su ngước mắt nhìn các môn đồ, lời chúc phước dành cho “những người nghèo khó,” và lý do là vương quốc của Đức Chúa Trời thuộc về người nghe. Tuy nhiên, “các con” thêm một quan hệ cha-con không được biểu thị bởi đại từ sở hữu số nhiều ὑμετέρα (“của anh em/của các bạn”).'
