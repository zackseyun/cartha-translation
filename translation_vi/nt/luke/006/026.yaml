id: LUK.6.26
reference: Luke 6:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: vi
  text: Khốn cho các con khi mọi người đều nói tốt về các con,[a] vì tổ tiên của họ[b] cũng từng đối xử như vậy với các tiên tri giả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nói những điều tốt đẹp về các con” hoặc “nói có thiện cảm về các con.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “cha ông của họ”, nghĩa là các thế hệ trước trong dân họ.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαί
  choice: Khốn cho
  rationale: Giữ sắc thái cảm thán và cảnh cáo mang tính tiên tri, trang trọng nhưng vẫn quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ὅταν
  choice: khi
  rationale: Diễn đạt tự nhiên một tình huống có tính khái quát, đồng thời giữ nguyên sức cảnh báo.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: nói tốt về các con
  rationale: Thể hiện thành ngữ chỉ việc nói thuận lợi, khen ngợi một người; không hiểu καλῶς theo nghĩa đơn thuần là nói đúng cách.
- source_word: πάντες οἱ ἄνθρωποι
  choice: mọi người đều
  rationale: Truyền đạt tính phổ quát của cụm từ và không gán nghĩa riêng cho giới tính.
- source_word: κατὰ τὰ αὐτά
  choice: cũng ... như vậy
  rationale: Diễn đạt tự nhiên ý hành xử theo cùng một cách trong sự so sánh với các tiên tri giả.
- source_word: γάρ
  choice: vì
  rationale: 'Giữ quan hệ giải thích: cách các thế hệ trước đối xử với tiên tri giả là cơ sở cho lời cảnh cáo.'
- source_word: ἐποίουν
  choice: từng đối xử
  rationale: Trong ngữ cảnh, ποιέω với tặng cách chỉ cách người ta đối đãi với ai; “từng” gợi hành động quen thuộc trong quá khứ của thì chưa hoàn thành mà không làm câu nặng nề.
- source_word: τοῖς ψευδοπροφήταις
  choice: với các tiên tri giả
  rationale: “Đối xử ... với” là kết cấu tiếng Việt tự nhiên, giữ đúng đối tượng của hành động.
- source_word: οἱ πατέρες αὐτῶν
  choice: tổ tiên của họ
  rationale: Trong ngữ cảnh lịch sử liên thế hệ, “tổ tiên” truyền đạt rõ nghĩa tập thể của πατέρες hơn cách dịch sát chữ “cha ông”, đồng thời tránh gây hiểu nhầm là cha ruột.
theological_decisions:
- issue: Ý nghĩa và phạm vi của sự so sánh với các tiên tri giả
  choice: Câu này cảnh báo về việc được mọi người đồng loạt nói tốt, vì đó cũng là cách các thế hệ trước từng đối xử với các tiên tri giả.
  alternative: Hiểu câu này như sự lên án vô điều kiện đối với mọi lời khen, hoặc chỉ như lời phê phán sự nổi tiếng.
  rationale: γάρ và κατὰ τὰ αὐτά đặt lời cảnh cáo trong một khuôn mẫu lịch sử về sự tán thành dành cho tiên tri giả. Bản dịch giữ mối liên hệ ấy nhưng không suy diễn rằng mọi lời khen đều đáng lên án.
- issue: Đối tượng được Chúa Giê-su trực tiếp nói với
  choice: các con
  alternative: các ngươi; anh em
  rationale: Đại từ ὑμᾶς là số nhiều và trong mạch văn Chúa Giê-su đang nói với các môn đệ. “Các con” tự nhiên, tôn nghiêm trong tương quan thầy-trò và thể hiện rõ số nhiều, nhưng không thêm một danh xưng không có trong nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Khốn cho” để giữ sức nặng tiên tri; “tổ tiên” trong câu chính giúp độc giả hiện đại hiểu ngay ý nghĩa liên thế hệ, còn chú thích bảo lưu hình thức sát chữ. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
