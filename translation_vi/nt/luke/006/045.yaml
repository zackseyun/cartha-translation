revisions:
- from: Người tốt lấy điều tốt từ kho báu tốt lành trong lòng mình mà đem ra; còn người xấu lấy điều xấu từ kho báu xấu xa mà đem ra. Vì lòng đầy tràn điều gì thì miệng nói ra điều ấy.[a]
  to: Người tốt đem điều tốt ra từ kho báu tốt lành của lòng mình; còn người ác đem điều ác ra từ kho báu xấu xa của mình. Vì miệng người ấy nói ra từ sự đầy tràn của lòng.[a]
  rationale: Bản sửa bám sát hơn động từ προφέρει, duy trì phép đối xứng của nguyên văn, và dùng “ác” để bảo toàn lực đạo đức của πονηρός. Mệnh đề cuối được đặt theo trật tự nguồn–kết quả của tiếng Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại. Chú thích được điều chỉnh thành một ghi chú từ vựng có neo [a] ở “sự đầy tràn”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:07Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ đúng cấu trúc đối xứng và các hình ảnh chính của câu Hy Lạp. Tuy nhiên, động từ προφέρει có nghĩa là “đem ra/đưa ra”, không bao hàm hành động “lấy”; cụm “lấy ... mà đem ra” thêm một sắc thái không có trong nguyên văn. Mệnh đề cuối của bản chính là một diễn đạt thành ngữ hợp lệ, nhưng chú thích hiện có lại mô tả cách dịch sát như thể khác với câu Hy Lạp trong khi chính bản chính đã diễn giải khá xa cấu trúc nguồn–xuất phát của nguyên văn.
  naturalness: “Người tốt/Người xấu” dễ hiểu, nhưng “người ác” phản ánh rõ hơn đối lập đạo đức của πονηρός và vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Bản sửa tránh lặp ý “lấy ... đem ra” và giữ câu văn trang trọng, sáng rõ.
  terminology: Giữ nhất quán “tốt/ác”, “kho báu”, “lòng”, “miệng”. “Kho báu tốt lành của lòng mình” phản ánh trực tiếp γενική “kho báu ... của lòng người ấy”; ở vế thứ hai, “kho báu xấu xa của mình” bảo toàn phép tỉnh lược của tiếng Hy Lạp mà không thêm “lòng” vào bản văn.
  issues:
  - severity: medium
    issue: “lấy điều tốt ... mà đem ra” thêm hành động “lấy”
    rationale: προφέρει chỉ diễn tả việc đưa/đem ra, không nói đến một bước “lấy” riêng biệt. Bỏ từ này giúp bản dịch sát nghĩa hơn.
  - severity: medium
    issue: “người xấu” làm nhẹ sắc thái đạo đức của πονηρός
    rationale: Trong thế đối lập ἀγαθός/πονηρός, “người ác” truyền đạt rõ hơn phẩm chất đạo đức tiêu cực, song không thêm diễn giải giáo phái.
  - severity: low
    issue: Chú thích hiện tại không nêu đúng chức năng của biến thể từ vựng
    rationale: περίσσευμα có thể dịch là “sự dư dật/dồi dào” bên cạnh “sự đầy tràn”. Chú thích nên ghi nhận lựa chọn từ vựng này, thay vì gọi cả câu là một cách dịch “sát hơn”.
  revised_text: Người tốt đem điều tốt ra từ kho báu tốt lành của lòng mình; còn người ác đem điều ác ra từ kho báu xấu xa của mình. Vì miệng người ấy nói ra từ sự đầy tràn của lòng.[a]
  revised_footnotes:
