    text: 'Hoặc: “sự dư dật” (hay “sự dồi dào”) của lòng.'
    reason: Phương án từ vựng cho περισσεύματος, diễn tả điều dư đầy, tràn ra.
  revision_rationale: Bản sửa bám sát hơn động từ προφέρει, duy trì phép đối xứng của nguyên văn, và dùng “ác” để bảo toàn lực đạo đức của πονηρός. Mệnh đề cuối được đặt theo trật tự nguồn–kết quả của tiếng Hy Lạp, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại. Chú thích được điều chỉnh thành một ghi chú từ vựng có neo [a] ở “sự đầy tràn”.
