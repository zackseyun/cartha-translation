id: LUK.6.45
reference: Luke 6:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: vi
  text: Người tốt đem điều tốt ra từ kho báu tốt lành của lòng mình; còn người ác đem điều ác ra từ kho báu xấu xa của mình. Vì miệng người ấy nói ra từ sự đầy tràn của lòng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “sự dư dật” (hay “sự dồi dào”) của lòng.'
    reason: Phương án từ vựng cho περισσεύματος, diễn tả điều dư đầy, tràn ra.
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: người tốt
  rationale: Diễn đạt tự nhiên trong tiếng Việt, chỉ một người có phẩm chất đạo đức tốt và vẫn có thể mang nghĩa đại diện chung.
- source_word: θησαυροῦ
  choice: kho báu
  rationale: Giữ hình ảnh ẩn dụ về một nguồn tích chứa bên trong, thay vì giải thích rộng thành “kho chứa”.
- source_word: καρδίας
  choice: lòng
  rationale: “Lòng” là cách nói tự nhiên, trang trọng trong tiếng Việt về nội tâm, ý hướng và tình cảm của con người.
- source_word: προφέρει
  choice: đem ra
  rationale: Thể hiện điều được đưa ra từ một nguồn tích chứa bên trong, đồng thời tạo câu tiếng Việt sáng rõ.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: người xấu / xấu xa / điều xấu
  rationale: Giữ sức nặng đạo đức của từ Hy Lạp và sự đối lập nhất quán với điều tốt; các dạng tiếng Việt được điều chỉnh cho phù hợp với danh từ mà chúng bổ nghĩa.
- source_word: περισσεύματος
  choice: đầy tràn
  rationale: Truyền đạt hình ảnh sự dồi dào đến mức tuôn ra ngoài và phù hợp tự nhiên với thành ngữ tiếng Việt.
- source_word: λαλεῖ
  choice: nói ra
  rationale: Cách diễn đạt hiện đại, tự nhiên, nhấn mạnh lời nói biểu lộ nội tâm.
- source_word: τὸ στόμα αὐτοῦ
  choice: miệng nói ra
  rationale: Giữ hình ảnh “miệng” được nêu rõ trong tiếng Hy Lạp, thay vì giản lược thành chủ thể “người ấy”.
theological_decisions:
- issue: Sự đối lập đạo đức trong ἀγαθός/πονηρός
  choice: Giữ các phạm trù “tốt” và “xấu”, không làm nhẹ thành các đặc tính chỉ mang tính chức năng.
  alternative: “lành mạnh” và “không tốt”
  rationale: Ngữ cảnh nói về phẩm chất đạo đức bên trong và biểu hiện ra ngoài; cách dịch này bảo toàn sức căng đạo đức của lời dạy.
- issue: Quan hệ giữa nội tâm và lời nói trong mệnh đề cuối
  choice: Diễn đạt theo thành ngữ “lòng đầy tràn điều gì thì miệng nói ra điều ấy”.
  alternative: “miệng người ấy nói từ sự dư dật của lòng”
  rationale: Cách được chọn làm rõ quan hệ nguồn–kết quả mà không biến câu thành tuyên bố tuyệt đối vượt quá hình ảnh của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ phép đối xứng giữa người tốt và người xấu, hình ảnh “kho báu”, “lòng” và “miệng”; tránh từ ngữ giáo phái hoặc lối diễn đạt cổ.
