  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: vi
  text: Tại sao các ngươi gọi tôi là ‘Lạy Chúa[a], lạy Chúa,’ mà không làm điều tôi nói?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lạy Thầy, lạy Thầy” hoặc “Lạy Chủ, lạy Chủ.” Tiếng Hy Lạp: Kyrios, kyrios.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Tại sao
  rationale: Trong cấu trúc Τί ... καλεῖτε, τί có chức năng hỏi lý do; “Tại sao” diễn đạt tự nhiên và giữ sức chất vấn.
- source_word: δέ
  choice: —
  rationale: δέ là từ nối nhẹ; tiếng Việt không cần dịch rõ ở đây vì mạch văn và sắc thái chuyển ý đã tự nhiên.
- source_word: με
  choice: ta
  rationale: Đại từ làm tân ngữ của καλεῖτε. “Ta” phù hợp với lời Đức Giê-su nói với các môn đệ trong văn phong trang trọng nhưng dễ hiểu.
- source_word: καλεῖτε
  choice: gọi
  rationale: Động từ hiện tại, ngôi hai số nhiều; “gọi” trực tiếp và tự nhiên trong cấu trúc xưng gọi này.
- source_word: Κύριε κύριε
  choice: Lạy Chúa, lạy Chúa
  rationale: “Chúa” giữ trọng lượng của tước hiệu κύριος; “lạy” đánh dấu hô cách tự nhiên trong tiếng Việt, và sự lặp lại được giữ nguyên để nhấn mạnh.
- source_word: καὶ οὐ
  choice: mà không
  rationale: “Mà không” diễn đạt tự nhiên sự tương phản giữa lời xưng nhận và việc không vâng làm.
- source_word: ποιεῖτε
  choice: làm
  rationale: Ở đây ποιέω chỉ việc thực hiện lời Đức Giê-su; “làm” đơn giản, trực tiếp và sát nghĩa.
- source_word: ἃ
  choice: điều
  rationale: Đại từ quan hệ trung tính số nhiều chỉ nội dung lời nói; tiếng Việt dùng “điều” tự nhiên hơn lối dịch máy móc theo số nhiều.
- source_word: λέγω
  choice: ta nói
  rationale: Dịch trực tiếp, không thêm đối tượng gián tiếp vốn không được nêu trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch κύριος khi được dùng làm tước hiệu xưng hô với Đức Giê-su
  choice: Chúa
  alternative: Thầy / Chủ
  rationale: “Chúa” bảo tồn cả sắc thái kính trọng lẫn sức nặng Kitô học tiềm tàng, nhưng chú thích vẫn nêu khả năng từ vựng “Thầy” hoặc “Chủ” mà không giải quyết quá mức sự đa nghĩa.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “các con—ta” cho lời Đức Giê-su nói với các môn đệ; giữ câu hỏi quở trách, sự lặp lại của tước hiệu và nét tương phản giữa xưng nhận bằng lời với hành động.
