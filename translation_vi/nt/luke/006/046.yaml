- from: 'Tại sao các con gọi ta[a]: ‘Lạy Chúa, lạy Chúa,’ mà không làm điều ta nói?'
  to: Tại sao các ngươi gọi tôi là ‘Lạy Chúa[a], lạy Chúa,’ mà không làm điều tôi nói?
  rationale: Bản sửa loại bỏ sắc thái quan hệ “các con—ta” không có trong tiếng Hy Lạp, giữ số nhiều và lực quở trách của câu hỏi, đồng thời đặt chú thích đúng tại tước hiệu Κύριε. “Lạy” được giữ để diễn đạt hô cách tiếng Việt; sự lặp lại của tước hiệu và sự tương phản “mà không” đều được bảo toàn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:08Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng câu hỏi tu từ, sự lặp lại của Κύριε, và thế tương phản giữa việc xưng hô với việc làm theo lời Đức Giê-su. Tuy nhiên, “các con” thêm một quan hệ phụ tử không được nêu trong nguyên văn, và chú thích về κύριος lại được gắn sau “ta” thay vì sau từ được chú thích.
  naturalness: Câu sửa vẫn trang trọng, rõ ràng và tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. “Các ngươi” giữ được số nhiều và giọng quở trách của câu hỏi mà không xác định thêm mối quan hệ giữa người nói và người nghe.
  terminology: “Chúa” là cách dịch thích hợp cho Κύριε trong ngữ cảnh này và bảo toàn sự lặp lại nhấn mạnh. Chú thích nêu các khả năng từ vựng mà không khẳng định một cách giải thích thần học vượt quá nguyên văn.
  issues:
  - severity: medium
    issue: “Các con” diễn giải thêm quan hệ giữa Đức Giê-su và người nghe.
    rationale: Nguyên văn chỉ có ngôi hai số nhiều (καλεῖτε/ποιεῖτε), không có danh từ hay đại từ mang nghĩa “con cái.” Dù cách xưng hô này quen thuộc trong một số truyền thống dịch thuật, nó thu hẹp người nghe và thêm sắc thái không được phát biểu trong câu.
  - severity: low
    issue: Mỏ neo chú thích [a] đặt sau “ta” thay vì “Chúa.”
    rationale: Chú thích giải thích Κύριε/Kyrios, tức tước hiệu được dịch là “Chúa”; mỏ neo cần đặt ngay sau từ đó để liên kết rõ ràng và chính xác.
  - severity: low
    issue: 'Cú pháp “gọi ta: ‘...’” kém tự nhiên.'
    rationale: Trong tiếng Việt, “gọi tôi là ‘...’” liên kết động từ “gọi” với tước hiệu xưng hô rõ hơn, không làm thay đổi ý nghĩa.
