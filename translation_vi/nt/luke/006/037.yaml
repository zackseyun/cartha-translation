id: LUK.6.37
reference: Luke 6:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: vi
  text: Đừng xét đoán, thì chắc chắn sẽ không bị xét đoán; đừng kết án, thì chắc chắn sẽ không bị kết án. Hãy tha thứ[a], thì sẽ được tha thứ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “hãy thả” hoặc “hãy giải thoát.” Động từ Hy Lạp có thể có nghĩa là “thả,” “giải thoát,” hoặc “phóng thích”; trong ngữ cảnh này, cũng có thể được hiểu là “tha thứ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: xét đoán
  rationale: “Xét đoán” diễn đạt hành vi phán xét người khác và giữ được sự đối ứng tự nhiên với thể bị động “bị xét đoán”; từ này cũng phân biệt với động từ mạnh hơn καταδικάζω ở vế sau.
- source_word: οὐ μὴ κριθῆτε
  choice: chắc chắn sẽ không bị xét đoán
  rationale: Cụm οὐ μή với động từ giả định quá khứ mang sắc thái phủ định nhấn mạnh; “chắc chắn sẽ không” truyền đạt lực nhấn mạnh ấy trong tiếng Việt hiện đại.
- source_word: καταδικάζετε
  choice: kết án
  rationale: καταδικάζω mạnh hơn κρίνω, chỉ sự tuyên người khác có tội hay đáng chịu án; “kết án” giữ được bước tăng tiến từ xét đoán đến phán quyết bất lợi.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: chắc chắn sẽ không bị kết án
  rationale: Cách dịch này giữ cả phủ định nhấn mạnh của οὐ μή lẫn cấu trúc song song với vế trước.
- source_word: ἀπολύετε
  choice: tha
  rationale: ἀπολύω có nghĩa rộng là thả, giải thoát hoặc cho đi; trong mạch văn về xét đoán và kết án, “tha” tự nhiên trong tiếng Việt và vẫn có thể bao hàm việc tha thứ hoặc miễn khỏi sự quy tội. Chú thích bảo lưu nghĩa rộng hơn.
- source_word: ἀπολυθήσεσθε
  choice: sẽ được tha
  rationale: Giữ sự lặp lại và tính tương hỗ của cùng một động từ Hy Lạp, đồng thời tạo câu tiếng Việt tự nhiên.
- source_word: καὶ
  choice: thì
  rationale: Trong các cặp mệnh lệnh–kết quả, “thì” diễn đạt quan hệ nối tiếp/hệ quả tự nhiên trong tiếng Việt, dù καί theo hình thức là liên từ “và”.
theological_decisions:
- issue: Nên hiểu ἀπολύετε theo nghĩa hẹp là tha thứ hay theo nghĩa rộng là thả/giải thoát
  choice: Dịch “tha” trong chính văn và chú thích nghĩa rộng “thả, giải thoát”
  alternative: Hãy thả/giải thoát, thì các con sẽ được thả/giải thoát
  rationale: “Tha” phù hợp tự nhiên với ngữ cảnh xét đoán và kết án nhưng không nhất thiết giới hạn vào một công thức thần học riêng. Chú thích duy trì độ rộng từ vựng thật sự của động từ Hy Lạp.
- issue: Lực của οὐ μή trong hai mệnh đề kết quả
  choice: Diễn đạt bằng “chắc chắn sẽ không”
  alternative: Chỉ dịch “sẽ không”
  rationale: Bản dịch có từ nhấn mạnh phản ánh rõ cấu trúc phủ định mạnh của nguyên văn mà không giải thích chủ thể hay cơ chế của sự phán xét.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” để phù hợp lời Chúa Giê-su trực tiếp dạy các môn đồ trong ngữ cảnh, đồng thời giữ giọng thân mật có thẩm quyền. Nhịp câu song song được bảo tồn; dấu chấm phẩy phân tách hai cặp mệnh lệnh–kết quả.
