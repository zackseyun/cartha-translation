revisions:
- from: Đừng xét đoán, thì các con chắc chắn sẽ không bị xét đoán; đừng kết án, thì các con chắc chắn sẽ không bị kết án. Hãy tha[a], thì các con sẽ được tha.
  to: Đừng xét đoán, thì chắc chắn sẽ không bị xét đoán; đừng kết án, thì chắc chắn sẽ không bị kết án. Hãy tha thứ[a], thì sẽ được tha thứ.
  rationale: Bản sửa loại bỏ đại từ "các con" không có trong câu nguồn, dùng "tha thứ" để câu tiếng Việt tự nhiên và rõ trong mạch văn, và chỉnh chú thích để bảo lưu phạm vi nghĩa của ἀπολύω mà không nêu nghĩa "cho đi" không phù hợp. Cấu trúc song song và sự phủ định nhấn mạnh của hai mệnh đề đầu được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:56Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phân biệt đúng κρίνω ("xét đoán") với καταδικάζω ("kết án") và phản ánh hợp lý lực nhấn mạnh của οὐ μή bằng "chắc chắn sẽ không." Tuy nhiên, nguyên văn chỉ có ngôi thứ hai số nhiều, không xác định người nghe là "các con"; việc thêm đại từ này vượt quá dữ liệu của câu. Với ἀπολύετε trong ngữ cảnh, "tha thứ" là cách hiểu tự nhiên và phù hợp, trong khi chú thích nên bảo lưu các nghĩa "thả/giải thoát" mà không thêm nghĩa không được hỗ trợ.
  naturalness: Bỏ "các con" làm câu tiếng Việt phổ quát, trang trọng và sát với tính hàm ẩn chủ ngữ của tiếng Hy Lạp. "Hãy tha thứ ... sẽ được tha thứ" tự nhiên, rõ nghĩa và giữ nhịp đối ứng của nguyên văn.
  terminology: '"Xét đoán," "kết án," và "tha thứ" tạo được cấp độ tăng tiến và mối song hành của câu. Thay "tha" bằng "tha thứ" tránh sắc thái "tha" có thể chỉ việc nương tay hoặc miễn phạt. Chú thích thay "cho đi"—không phải nghĩa từ vựng thích hợp ở đây—bằng các lựa chọn được chứng thực là "thả," "giải thoát," và theo ngữ cảnh là "tha thứ."'
  issues:
  - severity: medium
    issue: Thêm "các con" vào cả ba mệnh đề.
    rationale: Động từ Hy Lạp ở ngôi thứ hai số nhiều nhưng bản thân câu không gọi người nghe là "các con." Đại từ này vừa thu hẹp đối tượng nghe vừa thêm sắc thái quan hệ không được biểu thị trong câu đang dịch.
  - severity: medium
    issue: Chú thích liệt kê nghĩa "cho đi" cho ἀπολύω.
    rationale: '"Cho đi" không diễn đạt nghĩa từ vựng phù hợp của ἀπολύω trong ngữ cảnh này; các nghĩa liên quan là thả, giải thoát, phóng thích, hoặc tha thứ.'
  - severity: low
    issue: '"Hãy tha" có thể mơ hồ trong tiếng Việt hiện đại.'
    rationale: '"Tha thứ" diễn đạt rõ hơn hành vi tương ứng với mạch văn xét đoán và kết án, đồng thời vẫn có thể bảo lưu nghĩa rộng hơn trong chú thích.'
