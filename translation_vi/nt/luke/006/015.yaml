id: LUK.6.15
reference: Luke 6:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: vi
  text: và Ma-thi-ơ, Thô-ma, Gia-cơ con của An-phê, và Si-môn, người được gọi là Nhiệt Thành[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người nhiệt thành.” Danh xưng Hy Lạp này có thể là một biệt hiệu và tự nó không đòi hỏi phải kết luận rằng Si-môn là thành viên chính thức của một phong trào chính trị hình thành về sau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: và
  rationale: Liên từ nối các tên trong danh sách; giữ lại ở những vị trí cần thiết để phản ánh nhịp liệt kê của tiếng Hy Lạp mà vẫn tự nhiên trong tiếng Việt.
- source_word: Μαθθαῖον
  choice: Ma-thi-ơ
  rationale: Dạng tên riêng quen dùng trong tiếng Việt, phiên âm từ Μαθθαῖος.
- source_word: Θωμᾶν
  choice: Thô-ma
  rationale: Dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Gia-cơ con của An-phê
  rationale: Trong công thức định danh này, sở hữu cách Ἁλφαίου tự nhiên nhất chỉ quan hệ cha con; diễn đạt rõ bằng “con của” để phân biệt Gia-cơ này với những người cùng tên.
- source_word: Σίμωνα
  choice: Si-môn
  rationale: Dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: τὸν καλούμενον
  choice: người được gọi là
  rationale: Phản ánh cấu trúc mạo từ cộng phân từ bị động hiện tại dùng để bổ nghĩa và giới thiệu biệt hiệu của Si-môn.
- source_word: Ζηλωτὴν
  choice: Nhiệt Thành
  rationale: Dùng như một biệt hiệu định danh, vừa gợi nghĩa “người nhiệt thành” vừa không buộc phải kết luận rằng Si-môn là thành viên chính thức của một phong trào chính trị về sau.
theological_decisions:
- issue: Ζηλωτής là nhãn chỉ một đảng phái chính trị hay một biệt hiệu mô tả
  choice: Dịch là biệt hiệu “Nhiệt Thành” và giải thích độ mở nghĩa trong chú thích.
  alternative: “người nhiệt thành” hoặc “thành viên phái Nhiệt Thành”
  rationale: Nguyên ngữ xác nhận đây là một danh xưng nhận diện nhưng không tự nó quyết định vấn đề Si-môn có thuộc một tổ chức chính trị chính thức hay không; bản dịch tránh diễn giải quá mức.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và tự nhiên trong tiếng Việt hiện đại. Các tên riêng theo lối phiên âm Kinh Thánh tiếng Việt quen thuộc; dấu phẩy giúp nhận rõ từng người trong danh sách.
