id: LUK.6.41
reference: Luke 6:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: vi
  text: Nhưng tại sao bạn thấy cái dằm[a] trong mắt người anh em của bạn[b], mà không nhận ra cây xà[c] trong chính mắt bạn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mảnh rơm” hoặc “mẩu vụn”; từ Hy Lạp κάρφος chỉ một vật nhỏ, khô, tương phản với cây xà rất lớn.
    reason: lexical_alternative
  - marker: b
    text: “Người anh em” dịch danh từ giống đực số ít trong tiếng Hy Lạp; trong lời dạy này, cách dùng ấy không giới hạn phạm vi áp dụng vào một người nam hay một anh em ruột.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “khúc gỗ lớn” hoặc “tấm ván”; từ Hy Lạp δοκός chỉ một thanh gỗ lớn dùng trong kết cấu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: tại sao
  rationale: Trong câu hỏi tu từ đi với βλέπεις, τί mang sắc thái chất vấn về lý do, nên “tại sao” tự nhiên hơn “điều gì”.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ nối với lời dạy trước đó và tạo thế tương phản nhẹ; “nhưng” giữ được bước chuyển mang tính quở trách.
- source_word: βλέπεις
  choice: thấy
  rationale: Giữ hình ảnh thị giác cụ thể và cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: κάρφος
  choice: cái dằm
  rationale: κάρφος chỉ một mảnh nhỏ, khô, như mẩu rơm hay dằm; “cái dằm” tự nhiên trong hình ảnh vật nhỏ mắc trong mắt và tương phản rõ với cây xà.
- source_word: τῷ ὀφθαλμῷ
  choice: trong mắt
  rationale: Cách diễn đạt trực tiếp, tự nhiên, giữ số ít như nguyên văn Hy Lạp.
- source_word: τοῦ ἀδελφοῦ σου
  choice: người anh em mình
  rationale: Giữ danh từ giống đực số ít của nguyên văn, đồng thời “người anh em” phù hợp với lời nói về quan hệ trong cộng đồng; “mình” tự nhiên trong lời chất vấn trực tiếp.
- source_word: τὴν δοκόν
  choice: cây xà
  rationale: δοκός là một thanh gỗ lớn dùng trong kết cấu; “cây xà” giữ đúng hình ảnh phóng đại và sự tương phản mạnh với cái dằm.
- source_word: τῷ ἰδίῳ ὀφθαλμῷ
  choice: trong chính mắt mình
  rationale: “chính” thể hiện sắc thái nhấn mạnh của ἰδίῳ và làm nổi bật sự đối lập với mắt người anh em.
- source_word: οὐ κατανοεῖς
  choice: không nhận ra
  rationale: κατανοέω ở đây nói đến việc nhận biết hay lưu tâm đầy đủ; “không nhận ra” giữ được sự mỉa mai rằng vật lớn trong mắt mình lại bị bỏ qua.
theological_decisions:
- issue: Phạm vi của danh từ giống đực ἀδελφοῦ
  choice: người anh em
  alternative: anh chị em; người đồng đạo
  rationale: Nguyên văn dùng danh từ giống đực số ít trong một minh họa đạo đức. Bản dịch giữ hình thức ấy, không thu hẹp ý nghĩa vào anh em ruột; chú thích cho biết lời dạy có phạm vi áp dụng rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cặp “cái dằm—cây xà” giữ hình ảnh cụ thể, nét phóng đại và thế tương phản của nguyên văn. Đại từ “con” theo lối Chúa Giê-su trực tiếp chất vấn người nghe; “mình” giúp câu tự nhiên mà vẫn giữ sự nhấn mạnh vào lỗi của chính người nghe.
