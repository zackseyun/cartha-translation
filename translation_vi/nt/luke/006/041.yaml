revisions:
- from: Nhưng tại sao con thấy cái dằm[a] trong mắt người anh em mình[b], mà lại không nhận ra cây xà[c] trong chính mắt mình?
  to: Nhưng tại sao bạn thấy cái dằm[a] trong mắt người anh em của bạn[b], mà không nhận ra cây xà[c] trong chính mắt bạn?
  rationale: Bản sửa chỉ loại bỏ đại từ xưng hô “con” vốn không được nguyên văn xác định, đồng thời làm rõ tham chiếu sở hữu bằng “của bạn/chính mắt bạn”. Các hình ảnh và tương phản từ vựng của nguyên văn được giữ nguyên; chú thích về ἀδελφοῦ được chỉnh để không gán nghĩa anh em ruột cho câu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:00Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc câu hỏi tu từ, sự đối lập giữa κάρφος (vật nhỏ) và δοκός (thanh gỗ lớn), cũng như sắc thái nhấn mạnh của ἰδίῳ. Tuy nhiên, đại từ “con” thêm một quan hệ xưng hô không có trong nguyên văn và không phù hợp khi đứng độc lập ngoài ngữ cảnh diễn ngôn rộng hơn.
  naturalness: Câu nhìn chung tự nhiên và hình ảnh “cái dằm—cây xà” rõ ràng. Thay “con/mình” bằng “bạn” và các sở hữu ngữ minh thị giúp câu độc lập, nhất quán và tránh áp đặt vai giao tiếp không được nêu trong tiếng Hy Lạp.
  terminology: “Cái dằm” là một lựa chọn khả dĩ cho κάρφος trong ngữ cảnh dị vật trong mắt; chú thích vẫn bảo lưu các khả năng “mảnh rơm” và “mẩu vụn”. “Cây xà” diễn đạt tốt δοκός là một thanh gỗ kết cấu lớn. “Người anh em” bảo toàn danh từ giống đực số ít ἀδελφοῦ mà không diễn giải thành quan hệ huyết thống.
  issues:
  - severity: medium
    issue: Đại từ “con” được thêm vào bản dịch.
    rationale: Nguyên văn chỉ dùng ngôi thứ hai số ít, không xác định người nghe là “con” trong quan hệ xưng hô. “Con” tạo thêm sắc thái quan hệ và giọng nói không do câu Hy Lạp này tự nó cung cấp.
  - severity: low
    issue: Chú thích b nói “không chỉ áp dụng cho một người anh em trai ruột”.
    rationale: Cách nói này dễ khiến người đọc hiểu rằng nghĩa từ vựng chính là anh em ruột. Ἀδελφός ở đây là hình ảnh đạo đức về “người anh em”; chú thích nên chỉ nói rằng hình thức giống đực số ít không giới hạn phạm vi áp dụng vào nam giới hay anh em ruột.
