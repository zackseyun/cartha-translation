  rationale: Bản sửa chỉ làm rõ liên từ γάρ thứ hai và thay cách gọi thực vật không tự nhiên bằng một cách diễn đạt Việt ngữ tự nhiên hơn, không định danh loài vượt quá bằng chứng của βάτος. Hình ảnh ẩn dụ và ý nghĩa của câu được giữ nguyên.
