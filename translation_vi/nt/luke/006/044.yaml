id: LUK.6.44
reference: Luke 6:44
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: vi
  text: Vì mỗi cây được nhận biết nhờ chính trái của nó. Quả thật, người ta không hái trái vả từ bụi gai, cũng không thu hoạch nho từ bụi mâm xôi dại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “bụi gai rậm”; từ Hy Lạp chỉ một loại bụi cây có gai, giống bramble.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: mỗi cây
  rationale: Diễn đạt tự nhiên ý phân phối của ἕκαστον đi với danh từ số ít, đồng thời giữ nét nhấn mạnh đến từng cây.
- source_word: γὰρ
  choice: vì
  rationale: Giữ quan hệ giải thích với lời trước; ở mệnh đề thứ hai không lặp lại để câu tiếng Việt tự nhiên hơn, nhưng quan hệ lập luận vẫn rõ.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: nhờ chính trái của nó
  rationale: ἐκ trong kết cấu với γινώσκεται chỉ căn cứ nhận biết; “nhờ” tự nhiên trong tiếng Việt, còn “chính ... của nó” bảo toàn sắc thái của ἰδίου.
- source_word: γινώσκεται
  choice: được nhận biết
  rationale: Giữ thể bị động hiện tại và ý nghĩa mang tính phổ quát, thường nghiệm của câu tục ngữ.
- source_word: ἀκανθῶν
  choice: bụi gai
  rationale: Danh từ số nhiều chỉ các cây hoặc bụi có gai; “bụi gai” rõ và tự nhiên hơn cách dịch chỉ bộ phận “gai” trong ngữ cảnh hái trái.
- source_word: συλλέγουσιν
  choice: hái
  rationale: Trong ngữ cảnh trái vả, “hái” là động từ nông nghiệp tự nhiên, diễn đạt đúng hành động thu gom trái.
- source_word: σῦκα
  choice: trái vả
  rationale: Tên gọi tiếng Việt thông dụng của quả sung vùng Địa Trung Hải trong ngữ cảnh Kinh Thánh.
- source_word: βάτου
  choice: bụi mâm xôi gai
  rationale: βάτος chỉ một loại bụi cây có gai thuộc dạng bramble; cách dịch này truyền đạt hình ảnh thực vật mà không giản lược thành một bụi cây bất kỳ.
- source_word: σταφυλήν
  choice: nho
  rationale: Dù tiếng Hy Lạp dùng số ít, tiếng Việt dùng “nho” theo nghĩa loại quả hoặc tập hợp một cách tự nhiên.
- source_word: τρυγῶσιν
  choice: thu hoạch
  rationale: Giữ sắc thái chuyên biệt của việc thu hái sản vật chín, nhất là nho, và phân biệt nhẹ với συλλέγουσιν.
theological_decisions:
- issue: Sức gợi ẩn dụ của hình ảnh trái cây
  choice: Giữ nguyên câu tục ngữ nông nghiệp, không diễn giải “trái” thành phẩm hạnh, lời nói hay việc làm.
  alternative: Mở rộng theo lối giải nghĩa để nói rõ phẩm chất đạo đức hoặc hành vi.
  rationale: Bản văn Hy Lạp chỉ nêu hình ảnh; giữ hình ảnh bảo toàn sức tu từ và không thu hẹp ý nghĩa thần học trong văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “trái” thay vì “quả” để kết hợp tự nhiên với “trái vả” và duy trì sự liên kết từ vựng trong câu. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
