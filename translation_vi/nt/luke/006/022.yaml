id: LUK.6.22
reference: Luke 6:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: vi
  text: Phước cho anh em khi người ta ghét anh em, khi họ loại trừ anh em, sỉ nhục anh em và gạt bỏ tên tuổi anh em như điều xấu xa[a] vì cớ Con Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “bác bỏ danh tiếng anh em như điều xấu xa.” Thành ngữ này có thể chỉ việc công khai chối bỏ hoặc lên án tên tuổi/danh tiếng của anh em là xấu xa.'
    reason: Giải thích thành ngữ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν, đồng thời giữ mở cơ chế xã hội chính xác mà thành ngữ hàm ý.
lexical_decisions:
- source_word: Μακάριοί
  choice: Phước cho
  rationale: Giữ giọng văn đặc trưng của các lời chúc phước và chiều kích thần học của μακάριος; tự nhiên, trang trọng hơn cách diễn đạt thuần cảm xúc như “hạnh phúc”.
- source_word: μισήσωσιν
  choice: ghét
  rationale: Diễn đạt trực tiếp thái độ thù ghét trong bối cảnh bị bách hại.
- source_word: οἱ ἄνθρωποι
  choice: người ta
  rationale: Chỉ con người nói chung, không giới hạn ở nam giới, đồng thời tự nhiên trong tiếng Việt.
- source_word: ἀφορίσωσιν
  choice: loại trừ
  rationale: Thể hiện việc gạt khỏi cộng đồng hoặc quan hệ xã hội mà không giới hạn vào một cơ chế khai trừ chính thức.
- source_word: ὀνειδίσωσιν
  choice: sỉ nhục
  rationale: Chuyển tải hành vi lăng mạ, làm nhục bằng lời nói với sắc thái đủ mạnh và dễ hiểu.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν
  choice: gạt bỏ tên tuổi anh em
  rationale: “Gạt bỏ” giữ hình ảnh cụ thể của ἐκβάλλω, còn “tên tuổi” diễn đạt tự nhiên phạm vi tên gọi và danh tiếng xã hội trong tiếng Việt.
- source_word: ὡς πονηρὸν
  choice: vì cho là xấu xa
  rationale: Giữ ý đây là sự quy kết của những người chống đối, chứ không khẳng định môn đồ thật sự xấu xa.
- source_word: ἕνεκα
  choice: bởi cớ
  rationale: Diễn tả nguyên nhân, đồng thời giữ sắc thái trang trọng phù hợp văn mạch lời chúc phước.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Giữ tước hiệu quen thuộc của Chúa Giê-su và các liên hệ liên văn bản, thay vì diễn giải thành một danh xưng mới.
theological_decisions:
- issue: Thành ngữ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: gạt bỏ tên tuổi anh em vì cho là xấu xa
  alternative: bêu xấu anh em như những kẻ gian ác
  rationale: Bản chính giữ hình ảnh “gạt bỏ” và yếu tố “tên” của nguyên văn, đồng thời dùng “tên tuổi” để câu tiếng Việt có nghĩa tự nhiên. Cách dịch không ấn định chính xác hành vi ấy là vu khống, khai trừ hay công khai chối bỏ.
- issue: Phạm vi của οἱ ἄνθρωποι
  choice: người ta
  alternative: mọi người; loài người
  rationale: “Người ta” truyền đạt chủ thể chung, không mang nghĩa chỉ nam giới và không hàm ý tuyệt đối rằng tất cả mọi người đều làm như vậy.
- issue: Tước hiệu τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng làm Con Người; Người Con của loài người
  rationale: “Con Người” là cách dịch trang trọng, quen thuộc, giữ nguyên tước hiệu trong các sách Phúc Âm và không thu hẹp các âm hưởng thần học của cụm từ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “Phước cho anh em” giữ nhịp điệu của lời chúc phước; “bởi cớ” duy trì sắc thái Kinh Thánh mà vẫn thông dụng. Đại từ “anh em” phù hợp lời Chúa Giê-su trực tiếp nói với các môn đồ và không nhằm xác định giới tính của toàn thể người nghe.
