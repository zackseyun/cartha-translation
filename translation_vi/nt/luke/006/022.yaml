revisions:
- from: Phước cho anh em khi người ta ghét anh em, loại trừ và sỉ nhục anh em, cũng như gạt bỏ tên tuổi anh em vì cho là xấu xa[a], bởi cớ Con Người.
  to: Phước cho anh em khi người ta ghét anh em, khi họ loại trừ anh em, sỉ nhục anh em và gạt bỏ tên tuổi anh em như điều xấu xa[a] vì cớ Con Người.
  rationale: Bản sửa giữ nhịp điệu lời chúc phước, làm rõ ba hành động cùng hướng vào “anh em,” và chuyển “cũng như” thành liên kết liệt kê sát với καὶ. Chú thích được thu gọn để giải thích thành ngữ mà không áp đặt một cách hiểu quá cụ thể.
  reviewer_model: gpt-5.6-terra
