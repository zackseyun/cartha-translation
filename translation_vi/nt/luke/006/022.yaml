    rationale: καὶ nối trực tiếp hành động “gạt bỏ tên tuổi anh em” với các hành động trước, không chủ yếu có nghĩa so sánh hay bổ sung kiểu “cũng như.”
  - severity: medium
    issue: Chú thích diễn giải “như những kẻ gian ác” quá hẹp.
    rationale: ὡς πονηρόν quy tên tuổi/danh tiếng của họ là xấu xa; thành ngữ có thể hàm ý sự chối bỏ hoặc lên án công khai, nhưng nguyên văn không buộc phải nói rằng họ bị gọi đích danh là “những kẻ gian ác.”
