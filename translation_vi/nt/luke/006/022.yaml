review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng các hành vi thù ghét, loại trừ, sỉ nhục và sự quy kết tiêu cực đối với “tên tuổi” của các môn đồ vì cớ Con Người. Tuy nhiên, “cũng như” làm yếu quan hệ liệt kê trực tiếp của các động từ Hy Lạp, và chú thích hiện tại giải thích hơi quá cụ thể theo hướng xem các môn đồ bị gọi là “những kẻ gian ác.”
  naturalness: “Phước cho anh em” và “người ta” tự nhiên trong văn phong Kinh Thánh tiếng Việt hiện đại. Cấu trúc lặp “khi” và liên kết bằng “và” làm câu rõ nhịp hơn; “vì cớ” trang trọng nhưng vẫn thông dụng hơn “bởi cớ” trong ngữ cảnh này.
  terminology: Giữ “Con Người” như tước hiệu ổn định. “Tên tuổi” là cách diễn đạt tự nhiên cho thành ngữ τὸ ὄνομα ὑμῶν, đồng thời chú thích cần duy trì tính mở của thành ngữ thay vì đồng nhất nó với một hình thức lên án cụ thể.
