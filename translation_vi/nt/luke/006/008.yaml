id: LUK.6.8
reference: Luke 6:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: vi
  text: 'Nhưng ngài biết những suy tính của họ[a], và nói với người đàn ông có một bàn tay bị teo[b]: “Hãy đứng dậy và ra đứng ở giữa[c].” Ông ấy đứng dậy và đứng đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những ý nghĩ của họ” hoặc “những lý lẽ trong lòng họ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “có một bàn tay bị khô héo.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hy Lạp: “vào giữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: biết
  rationale: Dạng của οἶδα ở đây mang nghĩa hiện tại là biết; “biết” diễn đạt tự nhiên lời khẳng định của câu mà không giải thích cơ chế ngài biết.
- source_word: διαλογισμοὺς
  choice: những điều họ đang suy tính
  rationale: Danh từ này có thể chỉ ý nghĩ, sự suy luận hoặc sự bàn tính trong lòng. “Những điều họ đang suy tính” phù hợp ngữ cảnh mà không quy định quá mức nội dung hay động cơ.
- source_word: ἀνδρὶ
  choice: người đàn ông
  rationale: ἀνήρ chỉ một người nam trưởng thành; cách dịch này giữ đúng nét nghĩa về giới tính.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: có một bàn tay bị teo
  rationale: ξηρός khi nói về một bộ phận cơ thể chỉ tình trạng khô héo, teo hoặc co quắp. “Bàn tay bị teo” là cách diễn đạt tự nhiên, dễ hiểu trong tiếng Việt hiện đại.
- source_word: Ἔγειρε
  choice: Hãy đứng dậy
  rationale: Mệnh lệnh yêu cầu người đàn ông đứng dậy khỏi chỗ của mình và được dịch riêng với στῆθι để giữ hai hành động trong nguyên văn.
- source_word: στῆθι
  choice: ra đứng
  rationale: Cách dịch này giữ động tác đứng ở một vị trí, phân biệt với hành động “đứng dậy” ngay trước đó.
- source_word: εἰς τὸ μέσον
  choice: ở giữa
  rationale: Cụm từ chỉ việc đi vào vị trí giữa những người đang hiện diện. Kết hợp “ra đứng ở giữa” tự nhiên hơn trong tiếng Việt mà vẫn giữ hình ảnh không gian.
- source_word: ἀναστὰς ἔστη
  choice: Ông ấy đứng dậy và đứng đó
  rationale: Giữ cả phân từ chỉ hành động đứng dậy và động từ chính chỉ việc đứng tại vị trí được truyền bảo, thay vì gộp thành một hành động.
theological_decisions:
- issue: Việc Đức Giê-su biết những suy tính bên trong của người khác
  choice: Khẳng định đơn giản rằng ngài biết những điều họ suy tính, không giải thích bằng cách nào.
  alternative: Ngài nhận ra ý định của họ; hoặc ngài biết các suy tính của họ nhờ sự hiểu biết siêu nhiên.
  rationale: Câu Hy Lạp khẳng định ngài biết nhưng không nêu cơ chế. Bản dịch giữ nguyên lời khẳng định và sự căng thẳng thần học, không thêm lời giải thích.
translation_notes:
  register: Dùng tiếng Việt phổ thông hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ngài” giữ cách quy chiếu tôn kính nhưng không thêm danh xưng không có trong câu Hy Lạp. Hai mệnh lệnh và hai hành động đáp lại được giữ tách biệt.
