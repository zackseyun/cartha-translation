base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: vi
  text: là những người đã đến để nghe Ngài và được chữa lành khỏi bệnh tật của mình; và những người bị các thần ô uế quấy nhiễu thì được chữa lành.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: là những người đã đến
  rationale: Đại từ quan hệ nối với đám đông ở câu trước; cách diễn đạt này tự nhiên trong tiếng Việt và giữ mối liên kết cú pháp. Thì quá khứ được thể hiện bằng “đã đến”.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: để nghe Ngài
  rationale: Động từ nguyên mẫu chỉ mục đích; “để nghe Ngài” ngắn gọn và trực tiếp.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: được chữa lành khỏi bệnh tật của mình
  rationale: Giữ thể bị động của ἰάομαι và ý tách khỏi bệnh tật do ἀπό biểu đạt. “Bệnh tật” là cách nói tự nhiên, bao quát trong ngữ cảnh.
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: bị các uế linh quấy nhiễu
  rationale: “Quấy nhiễu” thể hiện nghĩa rộng của ἐνοχλέω mà không mặc nhiên tăng mức độ thành “hành hạ”; “uế linh” giữ thành ngữ Kinh Thánh và sắc thái của ἀκάθαρτος.
- source_word: ἐθεραπεύοντο
  choice: đang được chữa lành
  rationale: “Đang” giúp thể hiện hành động đang tiếp diễn trong bối cảnh do thì vị hoàn biểu đạt; thể bị động được giữ nguyên.
theological_decisions:
- issue: Cách dịch πνευμάτων ἀκαθάρτων trong bối cảnh sự quấy nhiễu thuộc linh
  choice: các uế linh
  alternative: các tà linh; các linh ô uế
  rationale: “Uế linh” dịch trực tiếp danh từ và tính từ Hy Lạp, giữ sắc thái ô uế trong thành ngữ Phúc Âm mà không diễn giải thành “ma quỷ” hay đồng nhất với một thuật ngữ khác.
- issue: Thể của ἐθεραπεύοντο
  choice: đang được chữa lành
  alternative: được chữa lành
  rationale: Giữ sắc thái tiếp diễn của thì vị hoàn, cho thấy việc chữa lành diễn ra trong cảnh được thuật lại.
- issue: Mức độ tác động của ἐνοχλούμενοι
  choice: quấy nhiễu
  alternative: hành hạ; làm khổ
  rationale: Từ Hy Lạp có thể chỉ sự quấy nhiễu, làm khổ hoặc hành hạ; bản chính chọn cách rộng và trung tính hơn để không áp đặt mức độ mà văn cảnh không xác định rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Giê-su theo lối tôn kính phổ biến. Dấu chấm phẩy giữ hai vế liên kết chặt chẽ; “còn” đánh dấu nhóm thứ hai, và “cũng” cho thấy họ cùng được chữa lành.
