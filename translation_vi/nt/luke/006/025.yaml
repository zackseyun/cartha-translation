revisions:
- from: Khốn cho các ngươi là những người hiện đang no nê, vì các ngươi sẽ đói[a]. Khốn[b] cho các ngươi là những người hiện đang cười, vì các ngươi sẽ sầu than và khóc lóc.
  to: Khốn cho các ngươi, những người nay đang no đủ, vì các ngươi sẽ đói[a]. Khốn cho các ngươi, những người nay đang cười, vì các ngươi sẽ đau buồn và khóc[b].
  rationale: Chỉnh câu cho tự nhiên trong tiếng Việt hiện đại, duy trì sắc thái tuyên cáo của «Khốn cho», đánh dấu rõ sự đối lập hiện tại–tương lai bằng «nay đang», và dùng «đau buồn và khóc» để phản ánh hai động từ riêng πενθέω và κλαίω. Chú thích b được sửa thành một lựa chọn cảm thán hoàn chỉnh, đặt đúng tại lần xuất hiện thứ hai của οὐαί.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:22Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch phản ánh đúng cấu trúc hai lời «οὐαί», tình trạng hiện tại («bây giờ») đối lập với sự đảo ngược trong tương lai, và giữ riêng hai động từ πενθήσετε và κλαύσετε. Tuy nhiên, «sầu than» nghiêng về hành vi than vãn hơn là πενθέω («đau buồn, để tang, than khóc»), còn chú thích b diễn đạt chưa hoàn chỉnh như một phương án cho οὐαί.
  naturalness: «Khốn cho các ngươi là những người...» nặng và không tự nhiên trong tiếng Việt hiện đại. Cấu trúc apposition «Khốn cho các ngươi, những người...» trực tiếp, trang trọng và gần với lời tuyên cáo hơn. «Nay» diễn đạt νῦν gọn, tự nhiên, không cần cụm «hiện đang».
  terminology: «Khốn cho» thích hợp cho οὐαί trong lời cảnh báo mang sắc thái tiên tri. «No đủ» giữ nghĩa trạng thái được ăn no mà tránh sắc thái có thể hàm ý hưởng thụ quá mức của «no nê». «Đau buồn và khóc» diễn đạt tự nhiên πενθήσετε καὶ κλαύσετε mà vẫn không đồng nhất hai động từ.
  issues:
  - severity: medium
    issue: Cấu trúc «Khốn cho các ngươi là những người...» thiếu tự nhiên.
    rationale: Phân từ có mạo từ οἱ hoạt động như danh từ chỉ nhóm người; trong tiếng Việt, «các ngươi, những người...» là cách đặt đồng vị tự nhiên hơn và không thêm ý hệ từ.
  - severity: low
    issue: «Sầu than» không phải tương ứng tối ưu cho πενθήσετε.
    rationale: πενθέω trước hết chỉ sự đau buồn/tang chế; «sầu than» có thể gợi việc than vãn. «Đau buồn» giữ trọng tâm là sự đau khổ, và động từ «khóc» kế tiếp vẫn bảo toàn sự tăng tiến của cặp động từ.
  - severity: medium
    issue: Chú thích b «Than ôi cho.» không thành một phương án tiếng Việt hoàn chỉnh cho οὐαί.
    rationale: «Than ôi!» là lời cảm thán tự nhiên; khi ghép với đối tượng, có thể nói «Than ôi cho các ngươi!».
