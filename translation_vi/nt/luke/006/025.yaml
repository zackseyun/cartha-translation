base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: vi
  text: Khốn cho các ngươi, những người nay đang no đủ, vì các ngươi sẽ đói[a]. Khốn cho các ngươi, những người nay đang cười, vì các ngươi sẽ đau buồn và khóc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ chịu đói.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Than ôi!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Khốn cho
  rationale: Giữ sức nặng của lời cảnh báo và phán xét mang tính tiên tri, thay vì làm nhẹ thành lời thương hại đơn thuần.
- source_word: ἐμπεπλησμένοι
  choice: đang no nê
  rationale: Diễn đạt tự nhiên trạng thái hiện tại do đã được ăn no, đồng thời tạo thế đối lập rõ với tình trạng sẽ đói.
- source_word: νῦν
  choice: hiện đang
  rationale: Làm rõ sự tương phản thời gian giữa hoàn cảnh hiện tại và sự đảo ngược trong tương lai.
- source_word: πεινάσετε
  choice: sẽ đói
  rationale: Phản ánh trực tiếp thì tương lai và diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: γελῶντες
  choice: đang cười
  rationale: Giữ hình ảnh cụ thể và sắc thái tiếp diễn của phân từ hiện tại, không mở rộng thành ý nghĩa chung là vui mừng.
- source_word: πενθήσετε
  choice: sẽ sầu than
  rationale: Truyền đạt nỗi đau buồn được biểu lộ qua lời than, đồng thời giữ phân biệt với động từ khóc theo sau.
- source_word: κλαύσετε
  choice: khóc lóc
  rationale: Giữ sắc thái khóc thành tiếng và sự tăng cường tu từ khi đi sau 'sầu than'.
- source_word: ὅτι
  choice: vì
  rationale: Nối lời công bố tai họa với lý do hoặc cơ sở của nó bằng cách diễn đạt gọn, tự nhiên.
theological_decisions:
- issue: Bản chất của lời tuyên bố tai họa
  choice: Một lời cảnh báo mang tính tiên tri về sự đảo ngược và phán xét sắp đến đối với những người hiện đang no đủ và vô tư
  alternative: Chỉ là nhận xét xã hội học về sự thay đổi hoàn cảnh
  rationale: Việc lặp lại οὐαί, các động từ ở thì tương lai và cấu trúc song song với những lời phước trong văn cảnh cho thấy đây không chỉ là nhận xét trung tính. Bản dịch giữ sức nặng cảnh báo nhưng không xác định cơ chế hay thời điểm vượt quá điều câu Kinh Thánh nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. “Các ngươi” giữ lối xưng hô số nhiều rõ ràng cùng sức nặng của lời cảnh báo; “no nê” và “đang cười” duy trì hình ảnh cụ thể, còn “sầu than và khóc lóc” bảo toàn hai động từ riêng biệt trong nguyên văn.
