  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: vi
  text: Vào một ngày Sa-bát, Đức Giê-su đi qua các cánh đồng ngũ cốc. Các môn đệ của Ngài bứt những bông ngũ cốc[a], vò trong tay rồi ăn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những đầu hạt”; từ Hy Lạp chỉ phần bông hoặc đầu mang hạt của cây ngũ cốc, không xác định đó là loại cây nào.
    reason: lexical_alternative
  - marker: b
    text: Tức là họ vò các bông ngũ cốc trong tay để tách lấy hạt ăn được.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Vào
  rationale: Cấu trúc dẫn nhập sự kiện quen thuộc của Lu-ca được chuyển tự nhiên sang tiếng Việt bằng trạng ngữ mở đầu; không thêm một từ chỉ thời gian tương đương với “bây giờ” vốn không có trong nguyên văn.
- source_word: ἐν σαββάτῳ
  choice: một ngày Sa-bát
  rationale: Danh từ không có mạo từ cho phép hiểu là một dịp Sa-bát chưa được xác định trước; “một ngày Sa-bát” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: διαπορεύεσθαι αὐτὸν διὰ σπορίμων
  choice: Đức Giê-su đi ngang qua những cánh đồng lúa
  rationale: Diễn đạt tự nhiên cấu trúc nguyên mẫu sau ἐγένετο; “cánh đồng lúa” chỉ ruộng ngũ cốc nói chung, không xác định loại cây cụ thể.
- source_word: ἔτιλλον
  choice: bứt
  rationale: Diễn tả hành động hái các bông lúa bằng tay; mạch câu cùng các động tác tiếp theo truyền đạt tính đang diễn ra của thì chưa hoàn thành.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ Ngài
  rationale: Cách gọi trang trọng, dễ hiểu và giữ quan hệ sở hữu của nguyên văn.
- source_word: καὶ ἤσθιον τοὺς στάχυας
  choice: rồi ăn
  rationale: Tiếng Việt tự nhiên đặt tân ngữ “những bông lúa” sau động từ đầu và không cần lặp lại; “rồi” thể hiện trình tự thực tế được phân từ giải thích.
- source_word: τοὺς στάχυας
  choice: những bông lúa
  rationale: στάχυς là bông hoặc đầu hạt của cây ngũ cốc; “bông lúa” là cách nói thông dụng trong tiếng Việt nhưng có thể bị hiểu hẹp là lúa gạo, nên có chú thích.
- source_word: ψώχοντες ταῖς χερσίν
  choice: vò trong tay
  rationale: Mô tả cụ thể việc chà xát bông lúa bằng tay để tách phần hạt ăn được; “vò” ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Sa-bát” theo cách gọi quen thuộc; “Đức Giê-su” giúp xác định rõ chủ thể vì câu đứng riêng. Trật tự “bứt… vò… rồi ăn” phù hợp cách kể tiếng Việt và làm sáng tỏ quan hệ hành động mà không thêm nội dung.
