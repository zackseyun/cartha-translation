  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: vi
  text: 'Bất cứ ai đến với tôi, nghe những lời của tôi và làm theo, tôi sẽ chỉ cho anh em biết người ấy giống ai:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Bất cứ ai đến với tôi
  rationale: Cụm πᾶς với phân từ có mạo từ chỉ chung mọi người thuộc trường hợp này. “Bất cứ ai” diễn đạt tự nhiên phạm vi phổ quát, còn “đến với tôi” giữ đúng hướng chuyển động của πρός.
- source_word: ἀκούων μου τῶν λόγων
  choice: nghe những lời tôi
  rationale: Cách diễn đạt này giữ động từ “nghe” và số nhiều λόγων, đồng thời hiểu μου tự nhiên là những lời do Chúa Giê-su phán.
- source_word: ποιῶν αὐτούς
  choice: và làm theo
  rationale: Trong ngữ cảnh lời dạy, ποιέω mang nghĩa thực hiện những điều đã nghe. “Làm theo” tự nhiên trong tiếng Việt và không thu hẹp ý nghĩa thành sự nghe suông.
- source_word: ὑποδείξω ὑμῖν
  choice: tôi sẽ chỉ cho anh em biết
  rationale: ὑποδείκνυμι ở đây dẫn vào hình ảnh so sánh sắp được nêu. “Chỉ cho … biết” vừa rõ nghĩa vừa trang trọng; “anh em” thể hiện đại từ ngôi thứ hai số nhiều ὑμῖν.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: người ấy giống ai
  rationale: Tiếng Việt có thể diễn đạt tự nhiên cấu trúc so sánh với đại từ nghi vấn ở dạng “giống ai”, gần sát nghĩa đen “giống với ai”. “Người ấy” chỉ lại bất cứ người nào đến, nghe và làm theo mà không gán giới tính.
theological_decisions:
- issue: Phạm vi của việc đến, nghe và làm theo
  choice: Giữ cả ba hành động cùng mô tả “bất cứ ai”
  alternative: Diễn giải “nghe” thành “vâng lời” hoặc gộp nghe và làm theo thành một ý
  rationale: 'Bản Hy Lạp đặt ba phân từ song song: đến, nghe và làm. Giữ riêng từng hành động bảo toàn sự nhấn mạnh rằng nghe lời Chúa Giê-su đi đôi với thực hành.'
- issue: Dạng giống đực số ít dùng theo nghĩa khái quát
  choice: Dùng “người ấy” không đánh dấu giới tính
  alternative: Dùng đại từ nam giới “ông ấy/anh ấy”
  rationale: Dạng giống đực số ít trong tiếng Hy Lạp có chức năng khái quát. Tiếng Việt không bắt buộc đánh dấu giống ở đây, nên “người ấy” vừa giữ số ít đại diện vừa bao gồm mọi người.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi” theo lời trực tiếp của Chúa Giê-su và “anh em” cho đại từ ngôi thứ hai số nhiều; giữ dấu hai chấm vì câu tiếp theo sẽ trình bày hình ảnh so sánh.
