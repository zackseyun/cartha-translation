id: LUK.6.48
reference: Luke 6:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: vi
  text: 'Người ấy giống như một người đàn ông xây nhà[a]: ông đào sâu rồi đặt móng trên đá. Khi lũ lụt xảy đến, dòng sông ập mạnh vào ngôi nhà ấy, nhưng không thể lay chuyển nó, vì nó đã được xây dựng tốt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “một người”. Tiếng Hy Lạp dùng một nhân vật nam số ít làm hình ảnh đại diện trong phép so sánh.
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: “vì nó đã được đặt móng trên đá”.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: Người ấy giống như một người đàn ông
  rationale: Giữ công thức so sánh trực tiếp và hình ảnh một nhân vật nam số ít trong nguyên văn, đồng thời diễn đạt tự nhiên bằng tiếng Việt.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: xây nhà
  rationale: Cách nói thông dụng, sáng rõ và tương ứng trực tiếp với hành động xây một ngôi nhà.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: đào sâu
  rationale: Hai động từ diễn tả việc đào và làm cho sâu; tiếng Việt tự nhiên có thể gói lại thành “đào sâu” mà vẫn giữ trọng tâm về độ sâu.
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: đặt nền trên đá
  rationale: Giữ hình ảnh xây dựng và không diễn giải πέτρα cụ thể hơn thành “đá nền” hay “nền đá”.
- source_word: πλημμύρης δὲ γενομένης
  choice: Khi lũ lụt xảy đến
  rationale: Diễn đạt tự nhiên hoàn cảnh thời gian của kết cấu sở hữu cách tuyệt đối và giữ tính đột ngột của biến cố.
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: dòng sông ập mạnh vào ngôi nhà ấy
  rationale: “Ập mạnh vào” truyền đạt sức va đập dữ dội của προσρήγνυμι; “dòng sông” tương ứng với ποταμός.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: không thể lay chuyển nó
  rationale: Giữ ý bất lực trước việc làm ngôi nhà dao động hoặc mất ổn định; “lay chuyển” tự nhiên trong ngữ cảnh này.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: vì nó đã được xây dựng vững chắc
  rationale: Giữ quan hệ nguyên nhân và thể bị động; “vững chắc” diễn đạt kết quả của καλῶς trong ngữ cảnh xây dựng mà không thu hẹp thành việc đặt móng בלבד.
theological_decisions:
- issue: Cách thể hiện ἀνθρώπῳ là nhân vật đại diện giống đực
  choice: một người đàn ông
  alternative: một người
  rationale: Nguyên văn dùng danh từ số ít có hình thức giống đực cho nhân vật trong phép so sánh. Bản dịch giữ nhân vật nam cụ thể, còn chú thích cho biết cách dịch rộng hơn có thể có.
- issue: Biến thể văn bản ở mệnh đề kết thúc
  choice: vì nó đã được xây dựng vững chắc
  alternative: vì nó được đặt nền trên đá
  rationale: SBLGNT in διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν trong dấu ngoặc biến thể; bản chính dịch đúng văn bản được cung cấp, đồng thời chú thích biến thể có chứng cứ thủ bản đáng kể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để quy chiếu rõ đến nhân vật nam; “ập mạnh” tái hiện sức nước dữ dội. Chú thích biến thể được thêm vì mệnh đề cuối trong SBLGNT có dấu hiệu bất định văn bản.
