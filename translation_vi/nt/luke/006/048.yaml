    issue: “vững chắc” ở mệnh đề nguyên nhân
    rationale: 'καλῶς bổ nghĩa cho việc nhà được xây: “tốt/đúng cách,” không trực tiếp nói nhà “vững chắc.” Dù ý liên hệ hợp lý, cách dịch hiện tại thêm một kết quả suy diễn.'
  - severity: low
    issue: Cách diễn đạt của chú thích biến thể
    rationale: Cách đọc thay thế thường gồm lý do “vì/quả thật” và nêu nhà “đã được đặt móng trên đá.” Bổ sung “đã” giúp phản ánh tốt hơn thể hoàn thành bị động và quan hệ với hành động trước đó.
