revisions:
- from: 'Người ấy giống như một người đàn ông xây nhà[a]: ông đào sâu, đặt nền trên đá. Khi lũ lụt xảy đến, dòng sông ập mạnh vào ngôi nhà ấy nhưng không thể lay chuyển nó, vì nó đã được xây dựng vững chắc.[b]'
  to: 'Người ấy giống như một người đàn ông xây nhà[a]: ông đào sâu rồi đặt móng trên đá. Khi lũ lụt xảy đến, dòng sông ập mạnh vào ngôi nhà ấy, nhưng không thể lay chuyển nó, vì nó đã được xây dựng tốt.[b]'
  rationale: Thay “đặt nền” bằng “đặt móng” để diễn đạt rõ và tự nhiên θεμέλιον trong tiếng Việt. Thay “được xây dựng vững chắc” bằng “đã được xây dựng tốt” để giữ sát καλῶς và thể bị động của οἰκοδομῆσθαι, không thêm kết quả suy diễn. Chú thích biến thể được chỉnh nhẹ để phản ánh đầy đủ hơn cách đọc thay thế mà vẫn không khẳng định một lựa chọn văn bản vượt quá SBLGNT.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:10Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch theo sát cấu trúc và hình ảnh của SBLGNT: phép so sánh, việc đào sâu, đặt móng trên đá, nước sông đập vào nhà, và nhà không bị lay chuyển. Tuy nhiên, “được xây dựng vững chắc” chuyển καλῶς (“tốt, đúng cách”) thành kết quả “vững chắc”, phần nào thêm sắc thái không được nêu trực tiếp. Cần dịch sát hơn là “được xây dựng tốt.” Chú thích biến thể là phù hợp với mệnh đề cuối được đặt trong dấu ngoặc của văn bản nguồn; nên phản ánh trọn ý của cách đọc thay thế.'
  naturalness: Văn phong hiện đại, rõ ràng và tự nhiên. “Đặt móng trên đá” là cách nói xây dựng tự nhiên hơn “đặt nền trên đá”; “dòng sông ập mạnh vào” diễn đạt tốt lực của προσέρηξεν.
  terminology: “Người đàn ông” giữ được nhân vật giống đực số ít của ἀνθρώπῳ, và chú thích nêu đúng phương án rộng hơn. “Đá” bảo toàn hình ảnh πέτρα mà không diễn giải thành “đá nền.”
