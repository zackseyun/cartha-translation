  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: vi
  text: Vào một ngày Sa-bát khác, Đức Giê-su vào hội đường và đang giảng dạy. Ở đó có một người đàn ông có bàn tay phải bị teo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khô héo.” Tính từ Hy Lạp mô tả vật bị khô hoặc héo; trong ngữ cảnh này, từ ấy nói đến tình trạng khuyết tật ở bàn tay phải của người đàn ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ἑτέρῳ σαββάτῳ
  choice: Vào một ngày Sa-bát khác
  rationale: Diễn đạt tự nhiên công thức chuyển cảnh thường gặp trong Lu-ca, đồng thời giữ rõ thời điểm và ý nghĩa ‘một dịp khác’ của ἑτέρῳ.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: Đức Giê-su vào hội đường
  rationale: Chuyển cấu trúc nguyên mẫu sau ἐγένετο thành mệnh đề hữu hạn tự nhiên trong tiếng Việt; gọi rõ Đức Giê-su là chủ thể theo ngữ cảnh.
- source_word: καὶ διδάσκειν
  choice: và đang giảng dạy
  rationale: ‘Đang giảng dạy’ phản ánh thể chưa hoàn thành của nguyên mẫu hiện tại, trình bày hành động đang diễn ra.
- source_word: ἄνθρωπος
  choice: một người đàn ông
  rationale: Giữ đúng quy chiếu nam giới cụ thể trong câu.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: có bàn tay phải
  rationale: Cấu trúc lại theo lối diễn đạt tự nhiên của tiếng Việt nhưng vẫn nhấn rõ đó là bàn tay phải.
- source_word: ξηρά
  choice: bị teo khô
  rationale: Trong ngữ cảnh chữa lành, từ này chỉ bàn tay khô héo, teo lại hoặc mất chức năng; ‘teo khô’ vừa dễ hiểu vừa giữ hình ảnh của nguyên ngữ mà không thu hẹp thành một chẩn đoán y khoa cụ thể.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hội đường” theo thuật ngữ Kinh Thánh quen thuộc; tránh chẩn đoán tình trạng bàn tay là “bại liệt” vì nguyên ngữ không xác định chính xác nguyên nhân y khoa.
