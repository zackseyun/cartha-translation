source:
  edition: SBLGNT
  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: vi
  text: 'Nhưng tôi nói với những người đang lắng nghe[a]: Hãy yêu kẻ thù của anh em; hãy làm điều tốt cho những người ghét anh em.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những người nghe”. Phân từ Hy Lạp có thể được chuyển sát hình thức như vậy; “đang lắng nghe” làm rõ sắc thái tiếp diễn và sự chú tâm trong ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Nhưng
  rationale: Diễn đạt tự nhiên sự tương phản mạnh với phần trước mà không làm câu nặng nề.
- source_word: ὑμῖν λέγω
  choice: tôi nói với
  rationale: Giữ nguyên công thức phát biểu trực tiếp và đối tượng được nói đến; “tôi” là đại từ ngôi thứ nhất tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῖς ἀκούουσιν
  choice: những người đang lắng nghe
  rationale: Phân từ hiện tại chỉ những người thực sự chú tâm tiếp nhận lời nói; “đang lắng nghe” vừa tự nhiên vừa thể hiện sắc thái tiếp diễn trong ngữ cảnh.
- source_word: ἀγαπᾶτε
  choice: Hãy yêu
  rationale: Giữ nghĩa cơ bản của động từ ἀγαπάω và thể mệnh lệnh số nhiều bằng “hãy”.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: kẻ thù của anh em
  rationale: Chuyển trực tiếp đối tượng và đại từ sở hữu số nhiều; “kẻ thù” giữ nguyên sức nặng của từ Hy Lạp, còn “anh em” phù hợp với lời nói trực tiếp trang trọng trong ngữ cảnh Kinh Thánh.
- source_word: καλῶς ποιεῖτε
  choice: hãy làm điều tốt
  rationale: Diễn đạt thành ngữ Hy Lạp một cách rõ ràng, tự nhiên, đồng thời giữ tính mệnh lệnh song song với “hãy yêu”.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: cho những người ghét anh em
  rationale: Giữ nguyên đối tượng hưởng hành động và nghĩa mạnh, trực tiếp của μισέω, không làm nhẹ thành “không ưa”.
theological_decisions:
- issue: Các mệnh lệnh đạo đức đối với kẻ thù
  choice: Chuyển các lời này thành những mệnh lệnh trực tiếp, không giới hạn phạm vi của “kẻ thù”.
  alternative: Giới hạn vào kẻ thù cá nhân hoặc diễn giải là lối nói cường điệu.
  rationale: Bản Hy Lạp dùng các mệnh lệnh ngôi thứ hai số nhiều và không nêu điều kiện hay giới hạn; bản dịch cần giữ nguyên tính triệt để và sức căng thần học của lời dạy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều trong lời trực tiếp nhằm tránh lối cổ “các ngươi”; không thêm điều kiện hay lời giải thích vào các mệnh lệnh. Dấu chấm phẩy làm rõ hai mệnh lệnh song song.
