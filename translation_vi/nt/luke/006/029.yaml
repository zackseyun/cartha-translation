id: LUK.6.29
reference: Luke 6:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: vi
  text: Ai đánh bạn vào má[a], hãy đưa cả má kia ra cho người ấy[b]; ai lấy áo choàng của bạn[c], cũng đừng ngăn người ấy lấy áo trong của bạn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “vào hàm.”
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn mang nghĩa “đưa” hoặc “trình” má kia ra, chứ không dùng động từ có nghĩa là “quay.”
    reason: alternative_reading
  - marker: c
    text: “Áo choàng” (ἱμάτιον) là áo mặc bên ngoài; “áo trong” (χιτών) là y phục mặc sát người ở bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: Ai đánh con
  rationale: Phân từ hiện tại có mạo từ được hiểu như danh từ chỉ một người nói chung; cách diễn đạt này tự nhiên trong tiếng Việt và giữ nguyên hành động trực tiếp.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: vào má
  rationale: σιαγών có thể chỉ má hoặc hàm; trong ngữ cảnh bị đánh vào mặt, “má” là cách nói tự nhiên, còn nghĩa “hàm” được ghi ở chú thích.
- source_word: πάρεχε καὶ τὴν ἄλλην
  choice: hãy đưa cả má kia ra cho người ấy
  rationale: παρέχω mang nghĩa đưa ra, trao hoặc trình ra. Cách dịch này giữ nét riêng trong lời văn của Lu-ca và không thay bằng cách diễn đạt quen thuộc “quay má kia” từ đoạn song song trong Ma-thi-ơ. “cả” chuyển tải sắc thái bổ sung của καί.
- source_word: ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον
  choice: ai lấy áo choàng của con
  rationale: αἴρω ở đây chỉ việc lấy đi; ἱμάτιον là áo khoác bên ngoài. Cấu trúc “ai… thì…” tự nhiên trong tiếng Việt và truyền đạt quan hệ với người thực hiện hành động.
- source_word: τὸν χιτῶνα
  choice: áo trong
  rationale: χιτών là y phục mặc sát người, phân biệt với ἱμάτιον là áo ngoài. “Áo trong” dễ hiểu hơn từ vay mượn chỉ trang phục cổ mà vẫn giữ đúng sự phân biệt.
- source_word: μὴ κωλύσῃς
  choice: đừng ngăn người ấy lấy
  rationale: κωλύω có nghĩa ngăn cản hoặc ngăn không cho làm. Cách dịch trực tiếp này rõ ràng, tự nhiên và không làm nhẹ mệnh lệnh.
theological_decisions:
- issue: Có nên đồng hóa lời văn của Lu-ca với cách nói quen thuộc “quay má kia” trong Ma-thi-ơ hay không
  choice: 'Giữ động từ riêng của Lu-ca: “hãy đưa cả má kia ra”'
  alternative: “hãy quay má kia”
  rationale: Bản Hy Lạp dùng πάρεχε, nghĩa là đưa ra hoặc trình ra, chứ không dùng động từ mang nghĩa quay. Giữ cách nói này tôn trọng nét riêng của nguồn văn Lu-ca.
- issue: Có nên thêm điều kiện giải thích để giới hạn các mệnh lệnh hay không
  choice: Dịch trực tiếp các mệnh lệnh, không thêm lời giảm nhẹ hay điều kiện
  alternative: Thêm trong chính văn các giới hạn về bất bạo động, trả đũa hoặc lối nói cường điệu
  rationale: Câu Hy Lạp nêu những mệnh lệnh trực tiếp. Bản dịch giữ nguyên sức nặng và sự căng thẳng thần học của lời dạy thay vì quyết định trước cách áp dụng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “con” phù hợp với lời Chúa Giê-su trực tiếp dạy người nghe trong văn mạch. Cấu trúc mệnh lệnh được giữ dứt khoát, không thêm diễn giải giáo phái.
