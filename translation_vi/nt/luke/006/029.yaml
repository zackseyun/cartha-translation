    issue: Đại từ “con” trong chính văn
    rationale: Tiếng Hy Lạp chỉ có đại từ ngôi hai số ít σου, không xác định người nghe là “con” theo quan hệ tôn giáo. “Bạn” là đại từ số ít khái quát tự nhiên hơn trong tiếng Việt hiện đại và tránh thêm sắc thái không có trong nguồn.
  - severity: low
    issue: Sở hữu của “áo trong” chưa được nói rõ
    rationale: Trong tiếng Hy Lạp, σου (“của bạn”) chi phối cả “áo choàng” lẫn “áo trong”. Thêm “của bạn” ở cuối mệnh đề tiếng Việt làm rõ quan hệ này.
