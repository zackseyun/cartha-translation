revisions:
- from: Ai đánh con vào má[a], hãy đưa cả má kia ra cho người ấy[b]; ai lấy áo choàng của con[c], thì cũng đừng ngăn người ấy lấy áo trong.
  to: Ai đánh bạn vào má[a], hãy đưa cả má kia ra cho người ấy[b]; ai lấy áo choàng của bạn[c], cũng đừng ngăn người ấy lấy áo trong của bạn.
  rationale: Chỉnh nhẹ đại từ xưng hô từ “con” thành “bạn” để bản dịch giữ tính khái quát của ngôi thứ hai số ít trong nguồn và phù hợp tiếng Việt hiện đại, không áp đặt quan hệ xưng hô ngoài văn bản. Thêm “của bạn” sau “áo trong” để biểu thị rõ sở hữu đã được tiếng Hy Lạp gắn với cả hai y phục. Các động từ mệnh lệnh, thứ tự y phục, và các chú thích/neo chú thích được giữ nguyên về ý nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính: người đánh, má/má kia, áo choàng và áo trong; đồng thời không đồng hóa động từ πάρεχε với “quay”. Tuy nhiên, đại từ “con” thêm một sắc thái quan hệ tôn giáo/địa vị không được biểu thị trong tiếng Hy Lạp, trong khi câu này dùng số ít khái quát. Dùng “bạn” giữ được ngôi thứ hai số ít tổng quát và tự nhiên trong tiếng Việt hiện đại. Cụm cuối cần nêu rõ áo trong cũng thuộc về người bị lấy để phản ánh sự liên kết của σου với cả hai y phục.'
  naturalness: “Ai đánh con vào má” có thể hiểu được trong văn phong Kinh Thánh, nhưng “bạn” phù hợp hơn với bản dịch tiếng Việt hiện đại và cấu trúc lời dạy khái quát. “Hãy đưa cả má kia ra cho người ấy” tự nhiên và giữ đúng ý “offer/present”; ở mệnh đề sau, thêm “của bạn” làm câu rõ ràng hơn mà không thêm ý.
  terminology: “Má” là lựa chọn phù hợp cho σιαγών, với chú thích “hàm” bảo tồn khả năng từ vựng. “Áo choàng” và “áo trong” phân biệt chính xác ἱμάτιον với χιτών. Chú thích về πάρεχε đúng hướng và hữu ích; “trình” chỉ là lựa chọn từ vựng phụ trong chú thích, không ảnh hưởng chính văn.
  issues:
