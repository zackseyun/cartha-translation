review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt được phản ứng bất lợi và sự bàn tính tiếp theo, nhưng “giận dữ” không được nêu trong ἀνοίας, còn “mất hết lý trí” làm mạnh tuyệt đối mức độ thiếu sáng suốt. Ἐπλήσθησαν ἀνοίας nói sát hơn là “đầy/tràn đầy sự điên cuồng,” với khả năng nghĩa là sự ngu dại hay phi lý. “Bàn với nhau xem họ có thể làm gì với Đức Giê-su” giữ được sắc thái bàn tính chưa quyết định của τί ἂν ποιήσαιεν và không thêm “chống lại.”
  naturalness: “Nhưng họ tràn đầy sự điên cuồng” là cách diễn đạt hiện đại, rõ nghĩa và vẫn phản ánh thành ngữ bị động “được đầy dẫy” của nguyên ngữ. Việc thêm “họ” sau “xem” làm mệnh đề tiếng Việt minh bạch hơn.
  terminology: Giữ “Đức Giê-su” theo đăng ký tôn kính đã chọn. “Sự điên cuồng” ở đây là cách dịch ngữ cảnh của ἀνοία, không phải chẩn đoán lâm sàng; chú thích nêu các khả năng nghĩa liên hệ. Không theo audit tiếng Anh ở chỗ rút ἀνοία thành “rage,” vì bản văn Hy Lạp không dùng từ chỉ cơn giận.
  issues:
