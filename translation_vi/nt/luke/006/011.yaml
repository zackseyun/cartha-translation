    issue: “giận dữ đến mất hết lý trí” thêm yếu tố giận dữ và mức độ tuyệt đối.
    rationale: ἀνοίας trực tiếp chỉ sự thiếu sáng suốt, ngu dại hoặc điên cuồng; dù ngữ cảnh cho thấy thái độ thù nghịch, bản văn không dùng từ ngữ chỉ giận dữ. “Mất hết” cũng mạnh hơn điều nguyên ngữ khẳng định.
  - severity: low
