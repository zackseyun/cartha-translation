  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: vi
  text: Nhưng họ tràn đầy sự điên cuồng[a], và bàn với nhau xem họ có thể làm gì với Đức Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đầy sự ngu dại” hoặc “đầy sự phi lý.” Từ Hy Lạp có thể chỉ sự thiếu sáng suốt, ngu dại, hoặc một trạng thái cuồng loạn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Nhưng họ
  rationale: “Nhưng” diễn đạt sắc thái tương phản của δὲ; đại từ “họ” đủ tự nhiên để chỉ nhóm chống đối, còn cách dịch nhấn mạnh “chính họ” sẽ nặng nề trong tiếng Việt.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: giận dữ đến mất hết lý trí
  rationale: ἄνοια chỉ tình trạng thiếu sáng suốt, dại dột hoặc điên cuồng. Trong ngữ cảnh phản ứng thù nghịch, cách dịch này truyền đạt cả cơn giận và tính phi lý của họ mà không khiến người đọc mặc nhiên hiểu đây là chẩn đoán bệnh tâm thần. Cấu trúc được chuyển đổi nhẹ để tiếng Việt tự nhiên.
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: bàn với nhau
  rationale: Động từ ở thì chưa hoàn thành gợi một cuộc trao đổi đang diễn ra; “bàn với nhau” diễn đạt tự nhiên sự hội ý qua lại.
- source_word: τί ἂν ποιήσαιεν
  choice: xem có thể làm gì
  rationale: τί kết hợp với ἄν và thức mong mỏi diễn đạt sự cân nhắc về một hành động khả dĩ. “Có thể làm gì” giữ được tính chưa xác định, không biến câu thành mệnh lệnh hay quyết định đã có sẵn.
- source_word: τῷ Ἰησοῦ
  choice: với Đức Giê-su
  rationale: Giữ cách nói tương đối trung tính “làm gì với Đức Giê-su”; không thêm “chống lại,” dù thái độ thù nghịch đã rõ từ ngữ cảnh.
theological_decisions:
- issue: Nên hiểu ἀνοίας là sự điên loạn theo nghĩa tâm lý hay sự mất sáng suốt mang tính đạo đức và cảm xúc
  choice: giận dữ đến mất hết lý trí
  alternative: đầy sự điên cuồng; đầy sự ngu dại
  rationale: Ngữ cảnh cho thấy phản ứng giận dữ và phi lý trước việc Đức Giê-su chữa lành. Cách dịch đã chọn tránh áp đặt một chẩn đoán tâm thần hiện đại, đồng thời không làm yếu đi tính chất mê muội và thù nghịch của phản ứng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đức Giê-su” phù hợp cách gọi tôn kính thông dụng; câu văn giữ sự dè dặt của nguyên văn về điều họ định làm.
