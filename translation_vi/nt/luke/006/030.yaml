revisions:
- from: Hãy cho bất cứ ai xin bạn[a]; và nếu ai lấy đi những gì thuộc về bạn, đừng đòi lại.
  to: Hãy cho bất cứ ai xin bạn; còn ai lấy những gì thuộc về bạn thì đừng đòi lại[a].
  rationale: Sửa “và nếu ai lấy đi” thành “còn ai lấy ... thì” để tránh thêm điều kiện vào cấu trúc phân từ của tiếng Hy Lạp, đồng thời giữ câu tiếng Việt tự nhiên. Đặt lại neo và rút gọn chú thích để nó gắn trực tiếp với phương án dịch của ἀπαιτέω.
