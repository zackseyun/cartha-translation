review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hai mệnh lệnh chính và giữ được phạm vi bao quát của παντί. Tuy nhiên, “nếu ai” thêm một liên từ điều kiện không có trong nguyên ngữ; mệnh đề phân từ có mạo từ ở câu thứ hai nên được diễn đạt như một hạng người/tình huống đối lập, không như một giả thiết điều kiện. Cụm “lấy” phản ánh αἴρων an toàn hơn “lấy đi”, vốn có thể thêm sắc thái.
  naturalness: 'Câu sửa dùng cấu trúc tiếng Việt hiện đại, tự nhiên: “còn ai ... thì ...”. Cấu trúc này nối hai mệnh lệnh rõ ràng mà không biến câu thứ hai thành một điều kiện giả định.'
  terminology: “Hãy cho”, “bất cứ ai xin bạn”, “những gì thuộc về bạn”, và “đừng đòi lại” đều phù hợp với δίδου, παντὶ αἰτοῦντί σε, τὰ σὰ, và μὴ ἀπαίτει. Đại từ “bạn” có sắc thái trực tiếp, hiện đại và nhất quán.
  issues:
  - severity: medium
    issue: “nếu ai lấy đi” thêm sắc thái điều kiện
    rationale: Nguyên văn có καὶ ἀπὸ τοῦ αἴροντος, nghĩa là “và đối với/từ người lấy ...”, không có từ tương đương “nếu”. “Còn ai ... thì ...” diễn đạt tự nhiên chức năng của cấu trúc này mà không thêm điều kiện.
  - severity: low
    issue: Ký hiệu chú thích đặt sau “xin bạn” nhưng chú thích lại bàn về ἀπαιτέω
    rationale: Neo chú thích cần đặt sau “đòi lại”, là từ/cụm được chú thích. Nội dung chú thích cũng nên chỉ nêu phương án từ vựng thực tế, thay vì nói là cách hiểu “toàn câu” khi chỉ một động từ thay đổi.
  revised_text: Hãy cho bất cứ ai xin bạn; còn ai lấy những gì thuộc về bạn thì đừng đòi lại[a].
