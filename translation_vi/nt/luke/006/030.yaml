  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: vi
  text: Hãy cho bất cứ ai xin bạn; còn ai lấy những gì thuộc về bạn thì đừng đòi lại[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đừng xin lại.”'
    reason: ἀπαιτέω có thể mang nghĩa yêu cầu hoặc đòi hoàn lại; “xin lại” là một phương án nhẹ hơn về sắc thái.
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: bất cứ ai xin bạn
  rationale: 'Cụm này có phạm vi phân phối rộng: mọi người đang xin nơi người nghe. “Bất cứ ai xin bạn” tự nhiên trong tiếng Việt và không thêm ý người ấy nhất thiết là người ăn xin.'
- source_word: δίδου
  choice: Hãy cho
  rationale: Động từ mệnh lệnh hiện tại được diễn đạt bằng mệnh lệnh tự nhiên “Hãy cho”; không cần gượng ép biểu thị tính tiếp diễn trong tiếng Việt.
- source_word: ἀπὸ τοῦ αἴροντος
  choice: nếu ai lấy đi
  rationale: Phân từ có mạo từ chỉ người lấy hoặc mang đi. Cách diễn đạt “nếu ai lấy đi” tự nhiên hơn cấu trúc sát chữ “từ người lấy đi” trong tiếng Việt, đồng thời không thu hẹp thành một phạm trù pháp lý như trộm cắp.
- source_word: τὰ σὰ
  choice: những gì thuộc về bạn
  rationale: Giữ được nghĩa rộng của cấu trúc trung tính số nhiều, không giới hạn rõ rệt vào tiền bạc hay một loại tài sản cụ thể.
- source_word: μὴ ἀπαίτει
  choice: đừng đòi lại
  rationale: ἀπαιτέω ở đây mang nghĩa yêu cầu hoặc đòi hoàn lại thứ đã bị lấy. “Đừng đòi lại” ngắn gọn, tự nhiên và giữ được lực của lời cấm.
theological_decisions:
- issue: Phạm vi và sức nặng của các mệnh lệnh đạo đức trong lời này
  choice: Trình bày trực tiếp như những mệnh lệnh có phạm vi rộng, không làm nhẹ hay giới hạn bằng lời diễn giải.
  alternative: Có thể hiểu là lối nói cường điệu, chỉ giới hạn vào việc bố thí, hoặc chỉ áp dụng cho một số hoàn cảnh pháp lý nhất định.
  rationale: Bản Hy Lạp dùng các mệnh lệnh trực tiếp cùng ngôn ngữ bao quát. Bản dịch nên giữ nguyên sức căng đạo đức và không quyết định thay cho người đọc cách áp dụng đang còn được tranh luận.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng đại từ “bạn” theo lối diễn đạt trực tiếp; giữ hai mệnh lệnh sắc gọn và không thêm điều kiện giải thích.
