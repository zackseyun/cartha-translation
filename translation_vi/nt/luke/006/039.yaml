  terminology: Đổi “ẩn dụ” thành “dụ ngôn” để giữ thuật ngữ Tin Mừng cho παραβολή mà không biến câu nói thành một câu chuyện dài. “Người mù” là cách dịch tự nhiên và bao quát cho dạng giống đực số ít mang nghĩa đại diện trong tiếng Hy Lạp.
  issues:
  - severity: medium
    issue: “Ẩn dụ” chưa phản ánh chính xác παραβολή.
    rationale: Trong cách dùng tiếng Việt hiện đại, “ẩn dụ” chủ yếu là biện pháp tu từ; παραβολή trong ngữ cảnh này là một dụ ngôn/lời ví dụ có chức năng minh họa. “Dụ ngôn” vừa là thuật ngữ Kinh Thánh quen thuộc vừa giữ đúng thể loại.
  revised_text: 'Ngài cũng kể cho họ một dụ ngôn: “Người mù có thể dẫn đường cho người mù được sao? Chẳng phải cả hai sẽ rơi xuống hố sao?”[a]'
