- from: 'Ngài cũng nói với họ một ẩn dụ: “Người mù có thể dẫn đường cho người mù được sao? Chẳng phải cả hai sẽ rơi xuống hố sao?”[a]'
  to: 'Ngài cũng kể cho họ một dụ ngôn: “Người mù có thể dẫn đường cho người mù được sao? Chẳng phải cả hai sẽ rơi xuống hố sao?”[a]'
  rationale: 'Chỉ điều chỉnh cách dịch παραβολή và động từ dẫn nhập đi kèm: “kể cho họ một dụ ngôn” rõ nghĩa thể loại, tự nhiên trong tiếng Việt, và vẫn trung thành với Εἶπεν ... παραβολήν. Các thành phần khác của bản dịch được giữ nguyên vì đã phản ánh tốt văn bản nguồn.'
