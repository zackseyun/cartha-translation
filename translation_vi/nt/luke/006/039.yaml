source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: vi
  text: 'Ngài cũng kể cho họ một dụ ngôn: “Người mù có thể dẫn đường cho người mù được sao? Chẳng phải cả hai sẽ rơi xuống hố sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “rãnh” thay cho “hố”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: cũng
  rationale: Giữ sắc thái bổ sung của καὶ sau δὲ, đồng thời đặt tự nhiên trong câu tiếng Việt.
- source_word: παραβολὴν
  choice: một ẩn dụ
  rationale: Chỉ lời nói mang tính hình tượng, minh họa; lựa chọn này giữ đặc trưng thể loại mà không khiến người đọc tưởng đây nhất thiết là một câu chuyện dài.
- source_word: Μήτι δύναται
  choice: có thể ... được sao?
  rationale: Diễn đạt tự nhiên câu hỏi tu từ chờ đợi câu trả lời phủ định.
- source_word: τυφλὸς ... τυφλὸν
  choice: người mù ... người mù
  rationale: Danh từ hóa tính từ số ít giống đực trong tiếng Hy Lạp có ý nghĩa đại diện. “Người mù” là cách diễn đạt tự nhiên, không đánh mất phạm vi khái quát của câu nói.
- source_word: ὁδηγεῖν
  choice: dẫn đường
  rationale: Thể hiện rõ hình ảnh một người chỉ lối cho người khác, phù hợp với bối cảnh hai người mù.
- source_word: οὐχὶ
  choice: Chẳng phải ... sao?
  rationale: Giữ lực của câu hỏi tu từ chờ đợi sự xác nhận.
- source_word: ἀμφότεροι
  choice: cả hai
  rationale: Chuyển tải trực tiếp ý nói đến hai người.
- source_word: βόθυνον
  choice: hố
  rationale: Từ Hy Lạp có thể chỉ hố hoặc rãnh; “hố” rộng nghĩa, sinh động và tự nhiên trong hình ảnh này.
- source_word: ἐμπεσοῦνται
  choice: sẽ rơi xuống
  rationale: Giữ ý tương lai và chuyển động vào trong chỗ trũng; tiếng Việt dùng “rơi xuống hố” tự nhiên hơn cách dịch máy móc.
theological_decisions:
- issue: Giống đực và ý nghĩa đại diện của τυφλός
  choice: người mù ... người mù
  alternative: người đàn ông mù ... người đàn ông mù
  rationale: Dạng giống đực số ít trong tiếng Hy Lạp được dùng theo nghĩa khái quát. Tiếng Việt không đánh dấu giống ở từ “người”, nên cách dịch này vừa chính xác về phạm vi vừa tự nhiên, không thu hẹp lời dạy chỉ vào nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để nối với chủ thể là Chúa Giê-su trong ngữ cảnh; “nói với họ một ẩn dụ” phù hợp hơn “kể” vì câu này là một lời ví von ngắn, không phải một truyện kể triển khai.
