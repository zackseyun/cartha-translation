id: LUK.6.49
reference: Luke 6:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: vi
  text: Nhưng người nghe mà không làm theo thì giống như một người xây nhà trên mặt đất, không có nền móng. Nước sông ập vào nhà ấy, nhà liền sụp đổ, và sự đổ nát của ngôi nhà đó thật lớn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vết vỡ của ngôi nhà ấy thật lớn.” Từ Hy Lạp có thể chỉ chỗ vỡ, sự tan vỡ hoặc cảnh đổ nát do việc sụp đổ gây ra.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Nhưng người nghe mà không làm theo
  rationale: Phân từ có mạo từ chỉ một người tiêu biểu. “Làm theo” diễn đạt tự nhiên ý ποιέω trong văn cảnh là thực hành những lời Đức Chúa Jêsus vừa nói, nhưng không thêm một tân ngữ không có trong câu Hy Lạp.
- source_word: ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν
  choice: một người xây nhà
  rationale: ἄνθρωπος ở đây chỉ một con người trong hình ảnh minh họa; tiếng Việt tự nhiên không cần đánh dấu giới tính, và “xây nhà” truyền đạt gọn cấu trúc phân từ.
- source_word: ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: trên mặt đất, không có nền móng
  rationale: γῆ chỉ bề mặt đất nơi ngôi nhà được dựng; θεμέλιον là nền móng. Cách diễn đạt rõ ràng, hiện đại và giữ nguyên điểm chính của hình ảnh.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Nước sông ập vào nhà ấy
  rationale: Đại từ quan hệ quy chiếu về ngôi nhà; προσρήγνυμι diễn tả sự va đập mạnh. “Nước sông ập vào” tự nhiên trong tiếng Việt và giữ tác lực dữ dội của dòng nước.
- source_word: εὐθὺς συνέπεσεν
  choice: nhà liền sụp đổ
  rationale: συμπίπτω trong ngữ cảnh công trình có nghĩa là sụp xuống; “liền” bảo toàn sắc thái tức khắc của εὐθύς.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: sự đổ nát của ngôi nhà đó thật lớn
  rationale: ῥῆγμα có thể chỉ chỗ vỡ, sự tan vỡ hoặc hậu quả đổ nát. “Sự đổ nát” phù hợp với ngôi nhà vừa sụp, còn “thật lớn” giữ tính chất μέγα mà không diễn giải thành “hoàn toàn”.
theological_decisions:
- issue: Ngôn ngữ chỉ người mang tính đại diện trong ví dụ
  choice: một người
  alternative: một người đàn ông
  rationale: ἀνθρώπῳ là hình thức số ít chỉ con người và không nhất thiết nhấn mạnh giới tính. “Một người” là tiếng Việt tự nhiên, chính xác và vẫn giữ số ít đại diện.
- issue: Ý nghĩa của việc “làm” lời đã nghe
  choice: làm theo
  alternative: thực hành / làm
  rationale: Văn cảnh trực tiếp đối chiếu nghe lời Đức Chúa Jêsus với việc thực hiện lời ấy. “Làm theo” làm rõ quan hệ này ở mức tiếng Việt đòi hỏi mà không bổ sung một cách áp dụng thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “nền móng,” “ập vào,” “sụp đổ” để hình ảnh xây dựng và dòng nước được rõ ràng; tránh lối diễn đạt cổ hoặc quá chuyên môn.
