id: LUK.6.40
reference: Luke 6:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: vi
  text: Môn đồ không hơn thầy mình, nhưng ai được rèn luyện đầy đủ thì sẽ giống như thầy mình.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nhưng mỗi người, khi đã được trang bị hoặc chuẩn bị đầy đủ, sẽ giống như thầy mình.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: môn đồ
  rationale: “Môn đồ” giữ được sắc thái một người học gắn bó với và được người thầy đào luyện, mạnh hơn nghĩa thuần học đường của “học trò”.
- source_word: ὑπὲρ
  choice: hơn
  rationale: Trong cấu trúc so sánh này, từ chỉ địa vị hoặc cấp bậc cao hơn; “không hơn thầy mình” là cách nói tự nhiên, súc tích trong tiếng Việt.
- source_word: διδάσκαλον / διδάσκαλος
  choice: thầy
  rationale: “Thầy” là từ tương đương tự nhiên, trang trọng vừa phải và phù hợp với quan hệ đào luyện giữa môn đồ và người dạy.
- source_word: κατηρτισμένος
  choice: được rèn luyện đầy đủ
  rationale: Phân từ hoàn thành bị động diễn tả một người đã được làm cho sẵn sàng, hoàn bị hoặc được đào luyện. Trong ngữ cảnh môn đồ–thầy, “được rèn luyện đầy đủ” giữ cả sắc thái thụ động lẫn quá trình hình thành.
- source_word: πᾶς
  choice: ai
  rationale: Từ này có nghĩa khái quát là mọi người; cấu trúc “ai ... thì” chuyển tải tự nhiên tính phổ quát của câu châm ngôn trong tiếng Việt.
- source_word: ὡς
  choice: giống như
  rationale: Ở đây từ này đánh dấu sự so sánh; “giống như” diễn đạt trực tiếp và tự nhiên.
- source_word: αὐτοῦ
  choice: mình
  rationale: Đại từ quy chiếu về người môn đồ trong câu nói khái quát. “Thầy mình” bảo toàn quan hệ sở thuộc ở số ít mà không buộc tiếng Việt phải thêm dấu giống.
theological_decisions:
- issue: Mối quan hệ giữa việc được đào luyện đầy đủ và trở nên giống người thầy
  choice: 'Giữ nguyên khẳng định so sánh: “ai được rèn luyện đầy đủ thì sẽ giống như thầy mình”'
  alternative: Diễn giải thành người môn đồ sẽ hoàn toàn ngang bằng hoặc đồng nhất với thầy
  rationale: ὡς diễn tả sự tương tự, không nhất thiết là đồng nhất tuyệt đối; bản dịch không mở rộng câu thành một khẳng định về sự bình đẳng hoàn toàn.
- issue: Phạm vi khái quát của πᾶς và đại từ αὐτοῦ
  choice: Dùng “ai ... thầy mình”
  alternative: “mọi môn đồ ... thầy của họ”
  rationale: Cách chọn giữ tính khái quát và quan hệ số ít của nguyên văn, đồng thời tự nhiên trong tiếng Việt và không thêm giới tính mà ngôn ngữ nguồn không cần được biểu thị trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Môn đồ” được giữ vì chiều sâu quan hệ và đào luyện; “thầy mình” là cách nói tiếng Việt tự nhiên, tránh lặp nặng nề. Dấu chú thích [a] được đặt ngay sau mệnh đề có phương án dịch khác.
