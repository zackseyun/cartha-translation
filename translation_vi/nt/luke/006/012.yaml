  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: vi
  text: Trong những ngày ấy, Ngài ra núi để cầu nguyện, và suốt đêm Ngài cầu nguyện cùng Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Trong những ngày ấy, Đức Chúa Jêsus đi
  rationale: Kết cấu ἐγένετο δὲ mở một diễn biến mới theo lối kể chuyện của Lu-ca. Tiếng Việt tự nhiên có thể chuyển nhẹ bằng trạng ngữ thời gian và mệnh đề chính, không cần dịch máy móc là “xảy ra rằng”; δέ được thể hiện qua sự chuyển tiếp của câu.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: trong những ngày ấy
  rationale: Cách nói thời gian tự nhiên, chỉ giai đoạn vừa được nhắc đến trong mạch truyện.
- source_word: ἐξελθεῖν αὐτὸν
  choice: Đức Chúa Jêsus đi
  rationale: Chuyển kết cấu nguyên mẫu với chủ ngữ đối cách thành mệnh đề hữu hạn tự nhiên trong tiếng Việt. Dùng tên xưng rõ chủ thể theo văn cảnh, tránh đại từ “Ngài” thiếu tiền ngữ trong câu đứng riêng.
- source_word: εἰς τὸ ὄρος
  choice: lên núi
  rationale: εἰς diễn tả hướng đến; với địa hình núi, “lên núi” là cách nói tiếng Việt tự nhiên. Không thêm một địa danh hay ngọn núi cụ thể.
- source_word: προσεύξασθαι
  choice: để cầu nguyện
  rationale: Diễn đạt trực tiếp mục đích của việc đi lên núi.
- source_word: ἦν διανυκτερεύων
  choice: suốt đêm
  rationale: Nắm được sắc thái kéo dài xuyên đêm của động từ cùng kết cấu tiếp diễn, đồng thời tránh lối diễn đạt nặng nề.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: cầu nguyện với Đức Chúa Trời
  rationale: 'Hiểu sở hữu cách τοῦ θεοῦ theo quan hệ hướng đến/đối tượng: lời cầu nguyện được dâng lên Đức Chúa Trời. “Với” là cách diễn đạt tự nhiên trong tiếng Việt và không gợi rằng đây là lời cầu nguyện do Đức Chúa Trời thực hiện.'
theological_decisions:
- issue: Quan hệ của τοῦ θεοῦ với προσευχῇ
  choice: cầu nguyện với Đức Chúa Trời
  alternative: sự cầu nguyện của Đức Chúa Trời
  rationale: Văn cảnh mô tả Đức Chúa Jêsus cầu nguyện hướng đến Đức Chúa Trời; cách dịch sở hữu máy móc sẽ dễ gây hiểu lầm rằng Đức Chúa Trời là chủ thể cầu nguyện. Bản dịch không bổ sung “Đức Chúa Cha”, vì từ ấy không có trong câu Hy Lạp.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ nhịp kể cô đọng của Lu-ca; tránh kết cấu Hán-Việt hoặc mô phỏng cú pháp Hy Lạp. Không có chú thích nên không đặt ký hiệu chú thích trong chính văn.
