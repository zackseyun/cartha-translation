  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: vi
  text: 'Sau khi nhìn quanh mọi người, Đức Giê-su nói với người ấy: “Hãy đưa tay anh ra.” Người ấy làm theo, và bàn tay của người ấy được phục hồi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bàn tay của người ấy được chữa lành.” Nguyên văn Hy Lạp sát nghĩa hơn là “được phục hồi”, nhấn mạnh việc trở lại tình trạng bình thường.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Sau khi nhìn quanh
  rationale: Phân từ aorist diễn tả việc Đức Giê-su nhìn khắp những người hiện diện trước khi lên tiếng; cách dịch này giữ được trình tự hành động và tự nhiên trong tiếng Việt.
- source_word: πάντας αὐτούς
  choice: tất cả họ
  rationale: Giữ ý nhấn mạnh rằng ánh nhìn hướng đến toàn thể những người đang hiện diện, không thu hẹp thành một nhóm không được nêu trong câu.
- source_word: εἶπεν αὐτῷ
  choice: nói với người ấy
  rationale: Chuyển tải trực tiếp động từ λέγω cùng bổ ngữ gián tiếp, không thêm sắc thái như ra lệnh ngoài lời mệnh lệnh được trích dẫn.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Hãy giơ tay anh ra
  rationale: Diễn đạt mệnh lệnh trực tiếp bằng tiếng Việt hiện đại; “giơ ... ra” phù hợp với động tác đưa bàn tay đang co lại hoặc bất động ra phía trước.
- source_word: ὁ δὲ ἐποίησεν
  choice: Anh làm theo
  rationale: ποιέω ở đây quy chiếu về mệnh lệnh vừa nói; “làm theo” tự nhiên và rõ hơn cách dịch máy móc “làm điều đó”. δέ chỉ nối tiếp nhẹ trong mạch kể.
- source_word: ἀπεκατεστάθη
  choice: được phục hồi
  rationale: Giữ nghĩa cơ bản của ἀποκαθίστημι là được đưa trở lại tình trạng đúng hoặc trước kia, thay vì diễn giải trực tiếp bằng thuật ngữ “được chữa lành”.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: bàn tay anh
  rationale: χείρ trong ngữ cảnh này là bàn tay; dùng đại từ sở hữu tự nhiên trong tiếng Việt và lặp lại danh từ như bản Hy Lạp.
theological_decisions:
- issue: Cách diễn tả phép lạ trong ἀπεκατεστάθη
  choice: bàn tay anh được phục hồi
  alternative: bàn tay anh được chữa lành
  rationale: “Được phục hồi” bám sát hình ảnh bàn tay trở lại tình trạng đúng đắn mà động từ Hy Lạp diễn tả, đồng thời vẫn truyền đạt rõ kết quả kỳ diệu mà không thay bằng một thuật ngữ y khoa cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể vốn được ngữ cảnh trước đó nêu rõ; dùng “anh” cho người đàn ông, tránh lối xưng hô cổ hoặc quá xa cách.
