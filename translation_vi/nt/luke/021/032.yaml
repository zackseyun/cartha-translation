  source_fidelity: 'Bản dịch bảo toàn tốt trật tự và ý chính của nguyên văn: ἀμὴν là lời xác quyết long trọng; οὐ μὴ παρέλθῃ được chuyển bằng phủ định nhấn mạnh; ἡ γενεὰ αὕτη, πάντα và γένηται đều được dịch không thêm yếu tố giải thích. Tuy nhiên, “các con” thêm sắc thái quan hệ cha-con/cha-thầy mà λέγω ὑμῖν không tự nó biểu thị.'
  naturalness: “Thật, tôi nói với các con” không phải cách mở đầu tự nhiên nhất trong tiếng Việt Kinh Thánh chuẩn hiện đại. “Quả thật, tôi nói với anh em” vừa tự nhiên vừa giữ được tính trang trọng. Trong chú thích c, “thành sự” ít dùng và không tự nhiên; “xảy đến” là lựa chọn rõ ràng hơn.
  terminology: Dùng “thế hệ này”, “mọi sự” và “qua đi” là phù hợp. “Anh em” là cách xưng hô Kinh Thánh Việt ngữ thông dụng cho số nhiều ὑμῖν trong diễn ngôn này, không áp đặt một quan hệ gia đình trực tiếp. Các chú thích tiếp tục bảo lưu những khả năng từ vựng mà không giải quyết tranh luận cánh chung.
