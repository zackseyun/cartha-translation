  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: thế hệ này[a] chắc chắn sẽ không qua đi cho đến khi mọi sự[b] xảy ra[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “dân này” hoặc “thời đại này”; từ Hy Lạp này có thể được hiểu theo nhiều cách, dù “thế hệ” là cách dịch trực tiếp nhất.
    reason: alternative_reading
  - marker: b
    text: Một số bản dịch viết “mọi điều này”, lấy ý “này” từ ngữ cảnh chung quanh; tiếng Hy Lạp tại đây chỉ nói “mọi sự”.
    reason: lexical_alternative
  - marker: c
    text: Cũng có thể dịch là “diễn ra” hoặc “xảy đến”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Thật
  rationale: Dùng như lời mở đầu long trọng xác nhận tính chân thật và thẩm quyền của lời nói; cách dịch này gần nguyên ngữ và vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: λέγω ὑμῖν
  choice: tôi nói với các con
  rationale: Giữ sát công thức trực tiếp của Hy Lạp. Trong bối cảnh Đức Giê-su nói với các môn đồ, “các con” diễn đạt quan hệ thầy-trò tự nhiên, trang trọng và dễ hiểu.
- source_word: οὐ μὴ παρέλθῃ
  choice: chắc chắn sẽ không qua đi
  rationale: οὐ μή đi với động từ giả định aorist là lối phủ định nhấn mạnh; “chắc chắn sẽ không” giữ được sức mạnh ấy, còn “qua đi” bảo toàn hình ảnh của παρέρχομαι.
- source_word: ἡ γενεὰ αὕτη
  choice: thế hệ này
  rationale: Đây là nghĩa trực tiếp và thông thường nhất của cụm từ; không xác định thay người đọc đối tượng quy chiếu đang được tranh luận.
- source_word: ἕως ἂν
  choice: cho đến khi
  rationale: Diễn đạt tự nhiên giới hạn thời gian do liên từ Hy Lạp nêu ra.
- source_word: πάντα
  choice: mọi sự
  rationale: Giữ đúng dạng “tất cả/mọi sự” của nguyên văn, vốn không có đại từ chỉ định “này”; ngữ cảnh có thể xác định các sự việc được nói tới.
- source_word: γένηται
  choice: xảy ra
  rationale: Trong ngữ cảnh này γίνομαι chỉ việc xảy đến hay thành sự. “Xảy ra” tự nhiên và không thêm sắc thái “được ứng nghiệm” mà từ Hy Lạp không bắt buộc.
theological_decisions:
- issue: Đối tượng quy chiếu của “thế hệ này” trong lời nói về thời kỳ cuối cùng
  choice: Dịch theo nghĩa từ vựng trực tiếp là “thế hệ này”, không xác quyết đó là những người đương thời với Đức Giê-su, thế hệ chứng kiến các dấu hiệu, hay một cộng đồng dân tộc.
  alternative: “dân này” hoặc “thời đại này”
  rationale: Cụm Hy Lạp cho phép tranh luận về đối tượng quy chiếu trong ngữ cảnh cánh chung. Bản dịch giữ nguyên độ căng và sự mơ hồ thực sự thay vì giải quyết vấn đề thần học ngay trong chính văn.
- issue: Phạm vi của πάντα
  choice: Dịch “mọi sự”, không tự ý thêm “này”.
  alternative: “mọi điều này”
  rationale: Ngữ cảnh có thể khiến người đọc hiểu là các biến cố vừa được mô tả, nhưng nguyên văn câu này chỉ có πάντα và không có từ chỉ định.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ nhịp của một lời tuyên bố long trọng, thể hiện rõ phủ định nhấn mạnh. Các dấu chú thích đều được đặt ngay sau cụm từ liên quan trong chính văn.
