  - severity: low
    issue: Chú thích a thu hẹp quá mức nghĩa thay thế của παγίς.
    rationale: “Bẫy lưới” là một hình dung cụ thể hơn cần thiết. “Bẫy/thòng lọng” phản ánh an toàn hơn trường nghĩa của từ và tương ứng với ghi chú tiếng Anh “snare.”
