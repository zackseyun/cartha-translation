  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: vi
  text: như một cái bẫy.[a] Vì ngày ấy sẽ ập đến với mọi người đang cư ngụ khắp mặt đất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “như một cái thòng lọng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “tất cả những người đang ngồi trên mặt của toàn thể đất.” Trong thành ngữ này, “đang ngồi” có nghĩa là đang cư ngụ hoặc sinh sống. Từ Hy Lạp chỉ “đất” cũng có thể mang nghĩa “miền đất”.'
    reason: lexical_and_semantic_alternative
lexical_decisions:
- source_word: ὡς παγίς
  choice: như một cái bẫy
  rationale: παγίς chỉ bẫy hoặc thòng lọng. “Cái bẫy” là cách nói tự nhiên trong tiếng Việt hiện đại, giữ được hình ảnh về sự bất ngờ và khó thoát.
- source_word: ἐπεισελεύσεται
  choice: sẽ ập đến trên
  rationale: Động từ ở thì tương lai diễn tả việc điều ấy đến trên hoặc bất ngờ chụp lấy người ta. “Ập đến” phù hợp với hình ảnh cái bẫy và ngữ cảnh cảnh báo; chủ ngữ hàm ẩn là “ngày ấy” ở câu trước nên được nêu lại để câu tiếng Việt rõ nghĩa.
- source_word: γὰρ
  choice: Vì
  rationale: γάρ nêu lý do cho lời cảnh báo ngay trước đó; “Vì” bảo toàn quan hệ giải thích một cách tự nhiên.
- source_word: ἐπὶ πάντας
  choice: trên mọi người
  rationale: ἐπί với đối cách biểu thị sự đến trên tất cả mọi người; cách dịch này giữ phạm vi bao quát của πάντας.
- source_word: τοὺς καθημένους
  choice: người đang sống
  rationale: Dù κάθημαι có nghĩa đen là “ngồi”, trong thành ngữ này nó chỉ những người cư ngụ hay sinh sống trên đất. “Đang sống” truyền đạt nghĩa thành ngữ rõ ràng cho độc giả hiện đại.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: trên khắp mặt đất
  rationale: Cụm Hy Lạp có nghĩa sát là “trên mặt của toàn thể đất/trái đất”. “Trên khắp mặt đất” là tiếng Việt tự nhiên, vẫn giữ hình ảnh bề mặt và ý nghĩa toàn thể.
theological_decisions:
- issue: Phạm vi của γῆ trong lời cảnh báo về thời cuối cùng
  choice: khắp mặt đất
  alternative: khắp miền đất ấy
  rationale: γῆ có thể chỉ “đất” hoặc “miền đất”, nhưng sự kết hợp với πάσης và “mọi người đang sống trên mặt...” nghiêng về phạm vi toàn cầu. Chú thích vẫn bảo tồn khả năng từ vựng hẹp hơn mà không áp đặt một hệ giải thích.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. “Ập đến” diễn đạt sức bất ngờ của lời cảnh báo; “khắp mặt đất” tự nhiên hơn lối dịch từng chữ nhưng không xóa nét nghĩa của thành ngữ Hy Lạp. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
