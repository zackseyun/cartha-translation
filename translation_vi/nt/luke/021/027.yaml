  source_fidelity: 'Bản dịch chuyển đạt đầy đủ các thành phần của nguyên văn: mốc thời gian καὶ τότε, chủ thể số nhiều của ὄψονται, danh hiệu τὸν υἱὸν τοῦ ἀνθρώπου, phân từ ἐρχόμενον, số ít của ἐν νεφέλῃ, và hai yếu tố đi kèm μετὰ δυνάμεως καὶ δόξης πολλῆς. “Trong một đám mây” theo sát giới từ ἐν và danh từ số ít, không hòa đồng với các truyền thống dùng số nhiều.'
  naturalness: Câu văn tự nhiên, trang trọng và dễ hiểu trong tiếng Việt hiện đại. “Bấy giờ,” phù hợp văn cảnh khải huyền; “ngự đến” và “vinh quang lớn lao” giữ được phẩm cách của lời văn mà vẫn thông dụng trong văn phong Kinh Thánh Việt ngữ.
  terminology: “Con Người” là cách dịch ổn định, giữ được tính danh hiệu và âm hưởng Đa-ni-ên. “Quyền năng” và “vinh quang lớn lao” tương ứng tốt với δύναμις và δόξα πολλή. Chú thích trình bày đúng lựa chọn thay thế “trên một đám mây,” đồng thời nêu rõ dữ kiện Hy Lạp là số ít và cách dịch sát là “trong một đám mây.”
