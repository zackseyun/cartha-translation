id: LUK.21.27
reference: Luke 21:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: vi
  text: Bấy giờ, họ sẽ thấy Con Người ngự đến trong một đám mây, với quyền năng và vinh quang lớn lao.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trên một đám mây.” Tiếng Hy Lạp dùng số ít và nói sát nghĩa là “trong một đám mây,” trong khi hình ảnh này gợi lại Đa-ni-ên 7 và những phân đoạn liên hệ nói về Con Người ngự đến với các đám mây.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: họ sẽ thấy
  rationale: Động từ ở thì tương lai diễn tả sự nhìn thấy trực tiếp; “họ sẽ thấy” tự nhiên, rõ ràng và không thêm sắc thái không có trong nguyên văn.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Cách dịch danh hiệu đã quen thuộc trong tiếng Việt, giữ được mối liên hệ với Đa-ni-ên 7 và chức năng Kitô học của cụm từ.
- source_word: ἐρχόμενον
  choice: ngự đến
  rationale: “Ngự đến” diễn đạt hành động đến trong bối cảnh khải huyền với sắc thái trang trọng phù hợp địa vị của Con Người; không xác định thêm điểm đến hay cách thức.
- source_word: ἐν νεφέλῃ
  choice: trong một đám mây
  rationale: Giữ số ít của νεφέλῃ và nghĩa trực tiếp của ἐν với cách; mạo từ không xác định được diễn đạt tự nhiên bằng “một” trong tiếng Việt.
- source_word: μετὰ δυνάμεως
  choice: với quyền năng
  rationale: μετά với sở hữu cách chỉ sự đi cùng; “quyền năng” phù hợp văn cảnh về quyền lực siêu việt hơn “sức mạnh” thuần thể chất.
- source_word: δόξης πολλῆς
  choice: vinh quang lớn lao
  rationale: Diễn đạt tự nhiên cường độ của πολλῆς, đồng thời giữ văn phong trang trọng của δόξα.
theological_decisions:
- issue: Cách dịch danh hiệu τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Người Con của loài người
  rationale: “Con Người” là danh hiệu Kinh Thánh quen thuộc, bảo toàn âm hưởng Đa-ni-ên 7 và không giản lược cụm từ thành một cách gọi chung về nhân tính.
- issue: Hình ảnh đám mây và âm hưởng Đa-ni-ên/thần hiện
  choice: trong một đám mây
  alternative: trên một đám mây
  rationale: Theo sát cách diễn đạt số ít ἐν νεφέλῃ của Lu-ca thay vì hòa đồng với cách nói “với những đám mây” ở các bản văn liên hệ; chú thích bảo lưu khả năng dịch giới từ khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Bấy giờ” để giữ sắc thái trình thuật–khải huyền; “ngự đến” và “vinh quang lớn lao” duy trì phẩm cách của câu mà không thêm diễn giải giáo phái.
