  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: vi
  text: Từ sáng sớm, toàn dân thường đến với Ngài trong khuôn viên đền thờ để nghe Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ, gồm cả các sân, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: toàn dân
  rationale: Diễn đạt tự nhiên sắc thái tập thể và bao quát của cụm Hy Lạp, nói chung về dân chúng đến nghe Đức Giê-su, không nhất thiết khẳng định từng cá nhân đều có mặt.
- source_word: ὤρθριζεν
  choice: từ sáng sớm ... thường đến
  rationale: “Từ sáng sớm” giữ sắc thái đi sớm hoặc lúc rạng đông của động từ ὀρθρίζω; “thường” chuyển tải hành động có tính lặp lại của thì vị hoàn.
- source_word: πρὸς αὐτόν
  choice: đến với Ngài
  rationale: Giữ hướng chuyển động đến một người của πρός với đối cách và dùng đại từ tôn kính tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, kể cả các sân, chứ không riêng nơi thánh bên trong; cách dịch này làm rõ nghĩa ngay trong câu mà vẫn gọn và tự nhiên.
- source_word: ἀκούειν αὐτοῦ
  choice: để nghe Ngài
  rationale: Động từ nguyên mẫu diễn tả mục đích; cấu trúc ἀκούω với sở hữu cách ở đây có nghĩa nghe hoặc lắng nghe một người.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự “Từ sáng sớm” nhấn đúng sắc thái thời gian; “thường đến” biểu thị hành động lặp lại. Dùng “Ngài” nhất quán để chỉ Đức Giê-su.
