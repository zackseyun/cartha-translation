source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: vi
  text: 'Ngài phán: “Hãy coi chừng, kẻo anh em bị dẫn lạc. Vì nhiều người sẽ nhân danh Ta mà đến và nói: ‘Ta đây’[a], và ‘Thời điểm đã đến gần.’ Đừng đi theo họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Ta là”; trong ngữ cảnh này, đây là lời của kẻ mạo nhận, tự nhận mình là đấng người ta đang trông đợi, có thể là Đấng Mê-si-a.'
    reason: Giữ lại dạng diễn đạt ngắn và hàm ẩn của nguyên văn, đồng thời giải thích cách hiểu theo ngữ cảnh mà không đưa cách hiểu ấy thẳng vào chính văn.
lexical_decisions:
- source_word: Βλέπετε
  choice: Hãy coi chừng
  rationale: Mệnh lệnh kêu gọi sự cảnh giác; cách nói này tự nhiên trong tiếng Việt hiện đại và dẫn vào lời cảnh báo theo sau.
- source_word: μὴ πλανηθῆτε
  choice: kẻo anh em bị dẫn lạc
  rationale: Giữ thể bị động và phần nào giữ hình ảnh đi chệch khỏi đường lối chân thật, thay vì chỉ diễn đạt phẳng là “bị lừa dối”.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: sẽ nhân danh Ta mà đến
  rationale: Diễn đạt việc đến bằng cách viện đến danh, thẩm quyền hoặc căn tính của Chúa Giê-su mà không xác định quá mức một sắc thái duy nhất.
- source_word: Ἐγώ εἰμι
  choice: Ta đây
  rationale: Là cách tự nhận diện tự nhiên trong tiếng Việt, giữ được sự hàm ẩn của câu Hy Lạp mà không thêm rõ “Đấng Mê-si-a” vốn không có trong nguyên văn.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Thời điểm đã đến gần
  rationale: “Thời điểm” thể hiện καιρός như thời khắc có ý nghĩa quyết định; “đã đến gần” phản ánh thể hoàn thành với kết quả hiện tại.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Đừng đi theo họ
  rationale: Cách nói rõ ràng, tự nhiên, đồng thời giữ hình ảnh chuyển động theo sau những kẻ ấy.
theological_decisions:
- issue: Cách dịch Ἐγώ εἰμι trong lời của những kẻ mạo nhận
  choice: Ta đây
  alternative: Ta là; Ta chính là Đấng ấy; Ta là Đấng Mê-si-a
  rationale: “Ta đây” truyền đạt lời tự nhận diện trong ngữ cảnh mà không biến sự hàm ẩn thành lời tuyên bố minh nhiên về Đấng Mê-si-a, cũng không buộc cụm từ phải được hiểu như một lời tự xưng thần tính. Dạng sát chữ được giữ trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể kể chuyện, “Ta” trong lời Chúa Giê-su và lời được trích dẫn của những kẻ mạo nhận, cùng “anh em” để gọi nhóm môn đồ mà không làm câu quá thân mật hoặc cổ kính.
