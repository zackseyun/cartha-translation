  to: 'Ngài phán: “Hãy coi chừng, kẻo anh em bị dẫn lạc. Vì nhiều người sẽ nhân danh Ta mà đến và nói: ‘Ta đây’[a], và ‘Thời điểm đã đến gần.’ Đừng đi theo họ.”'
