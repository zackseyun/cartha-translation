  source_fidelity: Bản nháp nắm đúng ý kết quả tương lai của ἀποβήσεται và ý làm chứng của μαρτύριον trong văn cảnh bị tra hỏi trước nhà cầm quyền. Tuy nhiên, cụm “một lời chứng cho các con” có thể bị hiểu là lời chứng được dành cho các môn đồ hoặc có lợi cho họ, thay vì dịp để chính họ làm chứng, nên chưa chuyển đạt rõ quan hệ của toàn cụm ὑμῖν εἰς μαρτύριον.
  naturalness: “Điều ấy sẽ trở thành một lời chứng cho các con” không tự nhiên trong tiếng Việt hiện đại và tạo mơ hồ không hữu ích. “Điều đó sẽ là dịp để anh em làm chứng” là cách nói tự nhiên, gọn, và phù hợp với lời nói trực tiếp với nhóm môn đồ.
  terminology: “Làm chứng” là thuật ngữ phù hợp cho trường nghĩa μαρτύριον trong Lu-ca. Đổi “các con” thành “anh em” phù hợp hơn với cách xưng hô một nhóm môn đồ trưởng thành trong tiếng Việt hiện đại, mà không thêm sắc thái gia trưởng không có trong nguyên ngữ.
