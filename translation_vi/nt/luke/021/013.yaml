  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: vi
  text: Điều đó sẽ là dịp để anh em làm chứng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Điều đó sẽ trở thành một lời chứng cho anh em.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: sẽ trở thành
  rationale: Động từ ở thì tương lai diễn tả kết quả mà những sự việc vừa được nói đến sẽ dẫn tới, chứ không chỉ đơn thuần là một điều sẽ xảy ra.
- source_word: ὑμῖν
  choice: cho các con
  rationale: Dữ cách chỉ kết quả liên quan đến các môn đồ. “Cho các con” tự nhiên trong tiếng Việt và phù hợp với cách Đức Giê-su trực tiếp nói với họ.
- source_word: εἰς
  choice: thành
  rationale: Giới từ này có thể chỉ kết quả hoặc mục đích; “trở thành” diễn đạt tự nhiên chức năng kết quả trong câu.
- source_word: μαρτύριον
  choice: một lời chứng
  rationale: “Lời chứng” giữ được ý nghĩa về việc làm chứng hoặc nội dung chứng thực, đồng thời phù hợp với bối cảnh các môn đồ bị đưa ra trước nhà cầm quyền.
theological_decisions:
- issue: Ý nghĩa của việc các môn đồ chịu bắt bớ trước nhà cầm quyền
  choice: Những biến cố ấy sẽ trở thành dịp hoặc phương tiện để các môn đồ làm chứng.
  alternative: Những biến cố ấy sẽ trở thành bằng chứng chống lại những người đối nghịch.
  rationale: Trong văn cảnh Lu-ca, việc bị bắt và bị đưa ra trước vua chúa cùng quan quyền tự nhiên hướng đến lời chứng do các môn đồ đưa ra về Đức Giê-su. Tuy nhiên, bản dịch chính không nói rõ đối tượng hay tác dụng cuối cùng của lời chứng, nhờ đó giữ được độ rộng nghĩa của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” để thể hiện lời Đức Giê-su trực tiếp nói với các môn đồ; “một lời chứng” giữ sắc thái công khai hoặc pháp lý mà không thu hẹp thành một cách giải thích giáo phái.
