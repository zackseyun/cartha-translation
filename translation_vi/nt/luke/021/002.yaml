lexical_decisions:
- source_word: εἶδεν
  choice: Ngài thấy
  rationale: Động từ ὁράω ở thì aorist diễn tả trực tiếp việc nhìn thấy; “thấy” tự nhiên và giữ được nhịp kể đơn giản.
- source_word: δέ
  choice: cũng
  rationale: δέ là từ nối nhẹ, tiếp tục cảnh trước; trong tiếng Việt, “cũng” liên kết việc Đức Giê-su thấy bà góa với việc Ngài vừa thấy những người giàu, mà không nhấn quá mạnh ý tương phản.
- source_word: τινα
  choice: một
  rationale: Đại từ bất định τις giới thiệu một người không được nêu danh; “một bà góa” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: χήραν
  choice: bà góa
  rationale: χήρα có nghĩa trực tiếp là người phụ nữ đã mất chồng; “bà góa” là cách gọi thông dụng, trang trọng vừa phải.
- source_word: πενιχρὰν
  choice: nghèo
  rationale: πενιχρός chỉ tình trạng ít phương tiện sinh sống; “nghèo” chính xác và tự nhiên, không cường điệu thành hoàn toàn cùng quẫn.
- source_word: βάλλουσαν
  choice: bỏ vào
  rationale: Trong ngữ cảnh dâng tiền vào thùng tiền, “bỏ vào” truyền đạt hành động của βάλλω tự nhiên hơn cách dịch sát chữ như “ném vào”.
- source_word: ἐκεῖ
  choice: đó
  rationale: ἐκεῖ là trạng từ chỉ nơi chốn; “đó” quy chiếu tự nhiên đến thùng tiền dâng đã được nhắc trong câu trước.
- source_word: λεπτὰ δύο
  choice: hai đồng tiền đồng nhỏ
  rationale: λεπτά là hai đồng tiền bằng đồng có giá trị rất thấp. Cách dịch này nêu số lượng, chất liệu và kích thước/giá trị nhỏ, còn tên đơn vị Hy Lạp được giữ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” nối chủ thể Đức Giê-su từ ngữ cảnh trước. Cụm “tiền đồng nhỏ” tránh từ cổ “đồng xu” theo nghĩa một đơn vị hiện đại, đồng thời chú thích bảo tồn tên gọi lịch sử lepton.
