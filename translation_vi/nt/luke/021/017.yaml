  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: vi
  text: Và các con sẽ bị mọi người thù ghét vì danh Ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “vì Ta” hoặc “vì cớ danh Ta”. Cụm từ “danh Ta” có thể chỉ căn tính và thẩm quyền của Chúa Giê-su, cũng như việc công khai xưng nhận và trung thành với Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Và
  rationale: Giữ liên từ nối câu này với mạch diễn từ trước đó.
- source_word: ἔσεσθε μισούμενοι
  choice: các con sẽ bị ... thù ghét
  rationale: Diễn đạt tự nhiên cấu trúc vị lai kết hợp với phân từ bị động, đồng thời giữ ý nghĩa các môn đồ là đối tượng của sự thù ghét.
- source_word: ὑπὸ πάντων
  choice: bị mọi người
  rationale: ὑπό với sở hữu cách chỉ tác nhân; πάντων có nghĩa bao quát là “mọi người”. Cách đặt tác nhân giữa “bị” và động từ phù hợp tiếng Việt hiện đại.
- source_word: διὰ τὸ ὄνομά μου
  choice: vì danh Ta
  rationale: διά với đối cách nêu nguyên nhân. “Danh Ta” giữ nguyên hình ảnh “danh” trong bản Hy Lạp và sắc thái về căn tính, thẩm quyền cùng sự công nhận lòng trung thành với Chúa Giê-su.
theological_decisions:
- issue: Ý nghĩa của “danh Ta” trong bối cảnh môn đồ bị bắt bớ
  choice: Giữ cách nói “vì danh Ta”.
  alternative: “vì Ta” hoặc “vì các con mang danh Ta”
  rationale: Nguyên văn nói rõ “vì danh Ta”. Giữ nguyên cách nói này bảo toàn chiều rộng ý nghĩa của “danh” trong Lu-ca–Công Vụ, thay vì thu hẹp nó vào một cách giải thích duy nhất.
- issue: Phạm vi của πάντων (“mọi người”)
  choice: Giữ cách nói bao quát “mọi người”.
  alternative: Diễn giải giảm nhẹ thành “nhiều người” hoặc xác định một nhóm cụ thể
  rationale: πάντων mang nghĩa “tất cả/mọi người”; bản dịch không tự ý giảm nhẹ hoặc giới hạn phạm vi của lời cảnh báo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” cho lời Chúa Giê-su trực tiếp nói với các môn đồ và “Ta” trong cụm “danh Ta”; giữ cấu trúc ngắn, mạnh của nguyên văn.
