  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: vi
  text: Nhưng hãy giữ mình, kẻo lòng anh em bị nặng trĩu vì chè chén quá độ, say rượu và những lo toan của cuộc sống, và ngày ấy bất ngờ ập đến trên anh em.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: Nhưng hãy giữ mình
  rationale: Mệnh lệnh kêu gọi sự cảnh giác đối với chính mình. “Hãy giữ mình” tự nhiên trong tiếng Việt và giữ nguyên sức cảnh báo.
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: kẻo lòng anh em trở nên nặng nề
  rationale: “Kẻo” diễn đạt lực ngăn ngừa của μήποτε; “trở nên nặng nề” giữ hình ảnh của động từ bị động βαρηθῶσιν, còn “lòng” chỉ đời sống nội tâm và sự nhạy bén đạo đức-tâm linh.
- source_word: κραιπάλῃ
  choice: chè chén
  rationale: Từ Hy Lạp có thể chỉ sự quá độ trong ăn uống, nhất là uống rượu, hoặc hậu quả của nó. “Chè chén” dễ hiểu và phù hợp với sự kết hợp cùng “say sưa”; chú thích giữ lại phạm vi nghĩa rộng hơn.
- source_word: μέθῃ
  choice: say sưa
  rationale: Diễn đạt tự nhiên tình trạng say rượu, đồng thời tránh lặp cấu trúc nặng nề bên cạnh “chè chén”.
- source_word: μερίμναις βιωτικαῖς
  choice: những lo toan của cuộc sống
  rationale: Bao quát các mối bận tâm, lo lắng thuộc đời sống thường nhật mà không tự ý thêm sắc thái lên án mọi công việc trần thế.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: bất ngờ ập đến trên anh em
  rationale: “Ập đến” giữ sắc thái một biến cố đến trên người ta, còn “bất ngờ” chuyển tự nhiên tính từ αἰφνίδιος sang chức năng trạng từ trong tiếng Việt.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ngày ấy
  rationale: Giữ nguyên cách nói quy chiếu của bản Hy Lạp, không tự ý thêm “phán xét” dù văn cảnh mang tính cánh chung.
theological_decisions:
- issue: Ý nghĩa cánh chung của “ngày ấy”
  choice: ngày ấy
  alternative: ngày phán xét ấy
  rationale: Văn cảnh cho thấy đây là ngày cao điểm được Chúa Giê-su nói đến, nhưng nguyên văn chỉ nói “ngày ấy”; bản dịch không giải nghĩa giáo lý ngay trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ngôi thứ hai trong lời Chúa Giê-su nói với các môn đồ; giữ hình ảnh “lòng... nặng nề” và nhịp cảnh báo của câu Hy Lạp.
