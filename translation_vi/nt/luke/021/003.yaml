  source_fidelity: 'Bản dịch chuyển tải đầy đủ các yếu tố của bản SBLGNT: lời xác quyết trang trọng (Ἀληθῶς), đối tượng số nhiều của λέγω ὑμῖν, bà góa nghèo được chỉ định cụ thể, và phép so sánh πλεῖον πάντων trong bối cảnh những người dâng tiền. “Đã bỏ vào” diễn đạt phù hợp ἔβαλεν trong ngữ cảnh hòm dâng hiến.'
