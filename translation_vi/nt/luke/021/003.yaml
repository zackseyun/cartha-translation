  terminology: “Bà góa,” “nghèo,” và “bỏ vào” là các lựa chọn chuẩn xác, không cường điệu mức độ nghèo hay giải thích trước ý nghĩa của sự so sánh. Chú thích [a] được gắn đúng tại động từ được chú giải và nêu một phương án sát từ vựng có thể chấp nhận được.
