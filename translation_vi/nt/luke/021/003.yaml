  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: vi
  text: 'Ngài phán: “Quả thật, tôi nói với anh em: bà góa nghèo này đã bỏ vào[a] nhiều hơn tất cả những người khác.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “đã ném vào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: Quả thật
  rationale: Trạng từ mở đầu một lời khẳng định long trọng và nhấn mạnh; “quả thật” tự nhiên, trang trọng và giữ được sức nặng trong lời Chúa Giê-su.
- source_word: λέγω ὑμῖν
  choice: tôi nói với anh em
  rationale: Giữ nguyên lời nói trực tiếp và đối tượng số nhiều, đồng thời dùng cách diễn đạt hiện đại, dễ hiểu và không áp đặt lối xưng hô riêng của một truyền thống giáo phái.
- source_word: χήρα
  choice: bà góa
  rationale: Cách gọi chuẩn, tự nhiên trong tiếng Việt đối với người phụ nữ có chồng đã qua đời.
- source_word: πτωχή
  choice: nghèo
  rationale: Diễn đạt trực tiếp tình trạng nghèo khó mà không xác định quá mức thành “khốn cùng” hay “túng quẫn” ngay trong câu này.
- source_word: αὕτη
  choice: này
  rationale: Giữ sắc thái chỉ định đến chính bà góa đang được quan sát.
- source_word: πλεῖον
  choice: nhiều hơn
  rationale: Thể hiện rõ ý so sánh về lượng trong ngữ cảnh tiền được bỏ vào hòm dâng hiến.
- source_word: πάντων
  choice: tất cả những người khác
  rationale: Đây là sở hữu cách dùng để so sánh sau πλεῖον; cách dịch này làm rõ rằng bà được so với tất cả những người dâng tiền còn lại mà không thêm lời giải thích về tỷ lệ.
- source_word: ἔβαλεν
  choice: đã bỏ vào
  rationale: Trong ngữ cảnh hòm dâng hiến, “bỏ vào” là cách nói tự nhiên, giữ hành động đưa tiền vào hòm mà không khiến câu mang sắc thái tùy tiện như “ném vào”.
theological_decisions:
- issue: Lời so sánh về lễ vật của bà góa
  choice: “đã bỏ vào nhiều hơn tất cả những người khác”
  alternative: “đã bỏ vào nhiều hơn bất cứ người nào khác”
  rationale: πλεῖον πάντων diễn tả sự so sánh với những người dâng tiền khác. Bản dịch giữ nguyên lời đánh giá gây chú ý của Chúa Giê-su, không vội giải thích đó là xét theo tỷ lệ hay động cơ—điều câu kế tiếp mới làm sáng tỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” trong lời dẫn và “tôi… anh em” trong lời trực tiếp để tránh áp đặt hệ thống đại từ đặc thù của một hệ phái. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải nghĩa.
