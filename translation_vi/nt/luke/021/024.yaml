id: LUK.21.24
reference: Luke 21:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: vi
  text: Họ sẽ ngã dưới lưỡi gươm và bị dẫn đi làm tù binh giữa mọi dân tộc[a]. Giê-ru-sa-lem sẽ bị các dân tộc giày đạp[b] cho đến khi thời kỳ của các dân tộc được hoàn tất[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến giữa mọi dân ngoại”; từ Hy Lạp ἔθνη có thể chỉ “các dân tộc” hoặc “dân ngoại”, tùy văn cảnh.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Giê-ru-sa-lem sẽ bị dân ngoại giày đạp.”'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “cho đến khi thời kỳ của dân ngoại được hoàn tất.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: sẽ ngã
  rationale: Giữ hình ảnh của động từ πίπτω trong bối cảnh chiến tranh, hàm ý ngã chết mà không diễn giải quá mức thành “sẽ chết”.
- source_word: στόματι μαχαίρης
  choice: dưới lưỡi gươm
  rationale: Diễn đạt tự nhiên thành ngữ theo nghĩa đen là “miệng gươm”, đồng thời giữ hình ảnh cụ thể của khí giới.
- source_word: αἰχμαλωτισθήσονται
  choice: bị dẫn đi làm tù binh
  rationale: Phản ánh thể bị động và ý nghĩa bị bắt rồi đưa đi khỏi quê hương.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: giữa mọi dân tộc
  rationale: εἰς chỉ sự chuyển động đến rồi phân tán giữa các dân; “giữa” tự nhiên trong tiếng Việt và không thu hẹp ἔθνη thành riêng “dân ngoại”.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc, rõ ràng trong tiếng Việt.
- source_word: πατουμένη
  choice: sẽ bị ... giày đạp
  rationale: Giữ hình ảnh bị chà đạp và tình trạng áp bức kéo dài được diễn tả bởi kết cấu ngoại vi tương lai.
- source_word: ὑπὸ ἐθνῶν
  choice: bị các dân tộc
  rationale: Dịch nhất quán ἔθνη là “các dân tộc”, đồng thời giữ phương án “dân ngoại” trong chú thích.
- source_word: ἄχρι οὗ
  choice: cho đến khi
  rationale: Cách diễn đạt thời gian trực tiếp và tự nhiên.
- source_word: πληρωθῶσιν
  choice: được mãn
  rationale: Giữ thể bị động và sắc thái một thời kỳ đạt đến mức viên mãn hay giới hạn đã định, không áp đặt một hệ thống cánh chung cụ thể.
- source_word: καιροὶ ἐθνῶν
  choice: thời kỳ của các dân tộc
  rationale: “Thời kỳ” truyền đạt các khoảng thời gian có ý nghĩa hoặc được ấn định; kết cấu sở hữu giữ nguyên độ mở của nguyên ngữ.
theological_decisions:
- issue: Cách dịch ἔθνη trong toàn câu
  choice: các dân tộc
  alternative: dân ngoại
  rationale: Ba lần xuất hiện của cùng một từ Hy Lạp được dịch nhất quán để giữ liên kết từ vựng và không vội quyết định sắc thái là địa chính trị hay sự tương phản giữa người Do Thái với người ngoài Do Thái.
- issue: Ý nghĩa của καιροὶ ἐθνῶν
  choice: thời kỳ của các dân tộc được mãn
  alternative: thời kỳ của dân ngoại được hoàn tất
  rationale: Bản dịch giữ ý về một giai đoạn có giới hạn nhưng không xác định một sơ đồ cánh chung hay chủ thể ngầm đứng sau thể bị động.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngã dưới lưỡi gươm” giữ hình ảnh chiến trận; “bị dẫn đi làm tù binh” nêu rõ sự lưu đày. Các chú thích bảo tồn khả năng dịch ἔθνη là “dân ngoại” mà không làm mất tính nhất quán của chính văn.
