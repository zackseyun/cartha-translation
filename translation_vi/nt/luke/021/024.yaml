  to: Họ sẽ ngã dưới lưỡi gươm và bị dẫn đi làm tù binh giữa mọi dân tộc[a]. Giê-ru-sa-lem sẽ bị các dân tộc giày đạp[b] cho đến khi thời kỳ của các dân tộc được hoàn tất[c].
  rationale: Chỉ thay “được mãn” bằng “được hoàn tất” trong chính văn và chú thích tương ứng để đạt cách diễn đạt tiếng Việt hiện đại tự nhiên hơn. Ý nghĩa về một thời kỳ được làm trọn/đạt đến sự hoàn tất, cùng tính bị động và độ mở thần học của nguyên ngữ, đều được giữ lại.
