source:
  edition: SBLGNT
  text: ἐν τῇ ὑπομονῇ ὑμῶν ⸀κτήσασθε τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: vi
  text: Nhờ sự kiên trì của anh em, anh em sẽ giữ được mạng sống mình[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo hình thức mệnh lệnh của động từ Hy Lạp: “Nhờ sự kiên trì của anh em, anh em hãy giành lấy mạng sống mình.”'
    reason: grammatical_alternative
  - marker: b
    text: Hoặc “linh hồn” hay “chính mình”; từ Hy Lạp có thể mang các nghĩa ấy tùy văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: sự bền lòng
  rationale: ὑπομονή chỉ sự kiên trì đứng vững khi chịu thử thách. “Sự bền lòng” tự nhiên, trang trọng và hợp với bối cảnh các môn đồ bị bắt bớ.
- source_word: κτήσασθε
  choice: sẽ giữ được
  rationale: Động từ có ý đạt được hoặc sở hữu. Trong ngữ cảnh bị bách hại và có người bị giết, “giữ được” diễn tả kết quả bảo toàn sự sống mà không quyết định đó chỉ là sự sống thể chất; hình thức mệnh lệnh của bản văn SBLGNT được ghi ở chú thích.
- source_word: ψυχὰς
  choice: mạng sống
  rationale: ψυχή có thể chỉ mạng sống, bản thân hoặc linh hồn. “Mạng sống” phù hợp với bối cảnh nói về cái chết và sự bảo toàn, đồng thời tránh áp đặt một sự phân chia hẹp giữa thân thể và linh hồn.
- source_word: ἐν
  choice: nhờ
  rationale: ἐν với cách ba ở đây có thể diễn tả phương tiện; “nhờ” là cách nói tiếng Việt tự nhiên và rõ nghĩa.
theological_decisions:
- issue: Ý nghĩa của ψυχή trong bối cảnh bắt bớ và thời cuối cùng
  choice: “mạng sống” theo nghĩa toàn diện
  alternative: “linh hồn” hoặc “chính mình”
  rationale: Cách dịch này giữ mối căng thẳng giữa nguy cơ chết về thể xác và sự bảo toàn tối hậu, không giới hạn lời hứa vào phần phi vật chất của con người.
- issue: Sắc thái của κτήσασθε
  choice: Diễn đạt kết quả là “sẽ giữ được” trong câu chính
  alternative: 'Mệnh lệnh trực tiếp: “hãy giữ lấy” hoặc “hãy giành lấy”'
  rationale: Bản văn SBLGNT có hình thức mệnh lệnh aorist trung động, nhưng trong mạch văn câu này cũng có thể được hiểu theo sắc thái kết quả. Câu chính dùng lối diễn đạt tự nhiên, còn chú thích bảo tồn hình thức ngữ pháp và sự mơ hồ của nguyên văn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” để xưng hô với nhóm môn đồ; giữ hai chú thích nhằm phản ánh hình thức mệnh lệnh và phạm vi nghĩa của ψυχή.
