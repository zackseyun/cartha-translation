id: LUK.21.7
reference: Luke 21:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: vi
  text: 'Họ hỏi Ngài: “Thưa Thầy, vậy khi nào những điều ấy sẽ xảy ra, và có dấu hiệu gì khi những điều ấy sắp xảy ra?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và dấu hiệu nào cho biết những điều ấy sẽ xảy ra?” Động từ Hy Lạp có thể được hiểu rộng hơn sắc thái “sắp xảy ra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: Họ hỏi
  rationale: Động từ aorist tường thuật một hành động trong quá khứ; “hỏi” là cách diễn đạt tự nhiên, chính xác trong ngữ cảnh câu hỏi trực tiếp.
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: δέ là từ nối nhẹ nhằm tiếp tục mạch kể; trong tiếng Việt, mở đầu bằng “Họ hỏi” đã tự nhiên và không làm mất quan hệ diễn ngôn.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đức Giê-su; “Ngài” phù hợp văn phong Kinh Thánh trang trọng hiện đại mà không thêm danh xưng vào nguyên văn.
- source_word: λέγοντες
  choice: dẫn trực tiếp bằng dấu hai chấm
  rationale: Phân từ giới thiệu nội dung lời hỏi. Tiếng Việt tự nhiên không cần dịch máy móc là “rằng” hay “nói rằng” sau động từ “hỏi”.
- source_word: Διδάσκαλε
  choice: Thưa Thầy
  rationale: διδάσκαλος có nghĩa là người dạy; “Thưa Thầy” vừa giữ nghĩa vừa thể hiện hô cách tự nhiên trong tiếng Việt.
- source_word: πότε οὖν
  choice: vậy khi nào
  rationale: “Khi nào” diễn đạt πότε, còn “vậy” giữ sắc thái suy luận của οὖν từ lời vừa nói trước đó.
- source_word: ταῦτα ἔσται
  choice: những điều ấy sẽ xảy ra
  rationale: Dạng tương lai của εἰμί với đại từ trung tính số nhiều chỉ việc các sự kiện sẽ diễn ra; “sẽ xảy ra” tự nhiên hơn lối dịch sát chữ “sẽ là”.
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: Chỉ dấu cho biết một sự kiện có ý nghĩa sắp diễn ra; “dấu hiệu” rõ ràng và thông dụng trong tiếng Việt hiện đại.
- source_word: ὅταν
  choice: khi
  rationale: Với động từ giả định, từ này mở đầu mệnh đề thời gian hướng đến tương lai; “khi” là tương đương tự nhiên.
- source_word: μέλλῃ
  choice: sắp
  rationale: Giữ sắc thái cận kề hoặc đang trên đà xảy đến của μέλλω, nhưng không xác định chính xác mức độ gần về thời gian.
- source_word: γίνεσθαι
  choice: xảy ra
  rationale: Trong ngữ cảnh này, γίνομαι nói đến các biến cố diễn ra; “xảy ra” là cách nói hiện đại, dễ hiểu.
theological_decisions:
- issue: Sắc thái thời gian trong lời hỏi mang tính cánh chung
  choice: Dịch μέλλῃ là “sắp”, giữ ý về sự việc đang tiến gần mà không quy định khoảng thời gian.
  alternative: “sẽ” hoặc “định” xảy ra
  rationale: “Sắp” phản ánh sắc thái của μέλλω rõ hơn cách dịch tương lai chung chung, đồng thời không áp đặt một hệ thống giải thích cánh chung cụ thể.
- issue: Quan hệ giữa “dấu hiệu” và thời điểm các biến cố
  choice: Giữ câu hỏi riêng về “dấu hiệu” và mệnh đề “khi những điều ấy sắp xảy ra”.
  alternative: Diễn giải dấu hiệu như bằng chứng cho một biến cố hoặc thời kỳ cụ thể
  rationale: Nguyên văn không xác định bản chất dấu hiệu ở câu này; bản dịch không nên giải quyết trước điều còn để ngỏ trong diễn ngôn.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng câu dẫn trực tiếp tự nhiên; tránh lặp “nói rằng”. “Thưa Thầy” giữ hô cách kính trọng, còn “sắp xảy ra” bảo tồn sắc thái thời gian và sự căng thẳng của nguyên văn.
