id: LUK.21.33
reference: Luke 21:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: vi
  text: Trời và đất sẽ qua đi, nhưng những lời của tôi chắc chắn sẽ không qua đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: trời và đất
  rationale: Cặp từ này chỉ toàn thể trật tự thọ tạo; cách nói “trời và đất” tự nhiên trong tiếng Việt và giữ được phạm vi vũ trụ của nguyên văn.
- source_word: παρελεύσονται
  choice: sẽ qua đi
  rationale: Động từ ở thì tương lai mang nghĩa qua đi hoặc chấm dứt. Lặp lại cùng cách dịch ở hai vế để giữ cấu trúc đối xứng và sự tương phản của câu.
- source_word: δὲ
  choice: nhưng
  rationale: Liên từ đánh dấu sự tương phản rõ rệt giữa sự qua đi của trời đất và tính bền vững tuyệt đối của lời Chúa Giê-su.
- source_word: οἱ λόγοι μου
  choice: những lời của tôi
  rationale: λόγοι ở đây là các lời phán của Chúa Giê-su. “Những lời của tôi” trực tiếp, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: οὐ μὴ
  choice: chắc chắn sẽ không
  rationale: Cấu trúc phủ định nhấn mạnh οὐ μὴ đi với động từ tương lai mạnh hơn một lời phủ định thông thường; “chắc chắn sẽ không” truyền đạt sức nhấn ấy một cách tự nhiên.
theological_decisions:
- issue: Mức độ tuyệt đối trong lời khẳng định về sự trường tồn của lời Chúa Giê-su
  choice: 'Giữ nguyên sự đối lập mạnh: trời đất sẽ qua đi, còn lời của Chúa Giê-su chắc chắn sẽ không qua đi.'
  alternative: “những lời của tôi sẽ không bao giờ qua đi”
  rationale: Nguyên văn dùng οὐ μὴ, một phủ định nhấn mạnh. Bản dịch không làm nhẹ lời khẳng định, cũng không thêm diễn giải giáo lý vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “tôi” phản ánh trực tiếp μου trong lời nói ngôi thứ nhất, không tự ý đưa tước hiệu vào câu. Không cần chú thích vì sắc thái nhấn mạnh của οὐ μὴ đã được thể hiện rõ ngay trong chính văn.
