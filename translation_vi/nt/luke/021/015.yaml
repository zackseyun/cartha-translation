id: LUK.21.15
reference: Luke 21:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: vi
  text: Vì chính Ta sẽ ban cho các con lời nói và sự khôn ngoan mà tất cả những kẻ chống đối các con không thể chống lại hay phản bác.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: lời lẽ
  rationale: Nghĩa đen là “miệng”, nhưng trong ngữ cảnh biện giải, đây là hoán dụ chỉ khả năng và lời ăn tiếng nói được ban; “lời lẽ” tự nhiên trong tiếng Việt mà vẫn giữ trọng tâm vào điều sẽ nói.
- source_word: σοφίαν
  choice: sự khôn ngoan
  rationale: Diễn đạt trực tiếp σοφία, chỉ sự khôn ngoan được ban cùng lời nói.
- source_word: ἀντιστῆναι
  choice: chống lại
  rationale: Giữ nghĩa đối kháng hoặc đứng vững để chống lại lời chứng.
- source_word: ἀντειπεῖν
  choice: bác bỏ
  rationale: Trong bối cảnh tranh biện, từ này nói đến việc nói ngược lại hay phản bác; “bác bỏ” phân biệt rõ với ἀντιστῆναι.
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: những kẻ chống đối các con
  rationale: Diễn đạt nhóm người đứng về phía đối nghịch với các môn đồ; “các con” phù hợp lời Đức Giê-su trực tiếp nói với môn đồ.
theological_decisions:
- issue: Chủ thể ban lời lẽ và sự khôn ngoan
  choice: Giữ đại từ nhấn mạnh “chính Ta”
  alternative: “Ta” hoặc “tôi”
  rationale: ἐγώ được nêu rõ và mang sắc thái nhấn mạnh; viết hoa “Ta” theo quy ước tôn kính trong lời Đức Giê-su mà không thêm danh xưng vào nguyên văn.
- issue: Quan hệ giữa sự khôn ngoan và mệnh đề quan hệ
  choice: Dùng “mà” để mệnh đề nói về toàn bộ điều được ban
  alternative: Hiểu ᾗ chỉ riêng “sự khôn ngoan”
  rationale: Đại từ ᾗ phù hợp ngữ pháp với σοφίαν, nhưng ý nghĩa câu gắn lời lẽ và sự khôn ngoan thành một sự ban cho; tiếng Việt “mà” bảo toàn độ mở tự nhiên thay vì ép cách phân giải.
- issue: Mức độ bất lực của những người chống đối
  choice: “tất cả ... không thể”
  alternative: “không ai ... có thể”
  rationale: Giữ sát cấu trúc ἅπαντες ... οὐ δυνήσονται, khẳng định toàn thể những người chống đối đều không có khả năng chống lại hay bác bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Chọn “lời lẽ” thay cho nghĩa đen “miệng” để hoán dụ Hy Lạp có hiệu lực tự nhiên trong tiếng Việt; giữ hai động từ gần nghĩa nhưng khác sắc thái là “chống lại” và “bác bỏ”.
