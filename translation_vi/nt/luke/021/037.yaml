    rationale: “Ngọn núi gọi là núi Ô-liu” hiểu được nhưng không mượt trong tiếng Việt. Viết hoa địa danh và thêm “được” giúp câu tự nhiên hơn, đồng thời vẫn dịch sát τὸ ὄρος τὸ καλούμενον Ἐλαιῶν.
