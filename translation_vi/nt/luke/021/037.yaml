  to: Ban ngày, Đức Giê-su giảng dạy trong khuôn viên đền thờ[a]; còn ban đêm, Ngài thường đi ra và nghỉ đêm trên ngọn núi được gọi là Núi Ô-liu[b].
  rationale: Bản sửa đặt “thường” tại vế ban đêm để phản ánh minh bạch hơn hoạt động có tính lặp lại do các dạng vị hoàn thành trong nguyên văn diễn tả. Đồng thời, “được gọi là Núi Ô-liu” làm cho tên địa danh tự nhiên hơn trong tiếng Việt mà không lược bỏ yếu tố “được gọi là” của bản Hy Lạp. Các chú thích được giữ nguyên nội dung và neo đúng tại các từ cần giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:53Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng sự đối lập ban ngày/ban đêm, nghĩa rộng của ἱερόν và địa danh Núi Ô-liu. Tuy nhiên, động từ vị hoàn thành ηὐλίζετο cùng phân từ ἐξερχόμενος mô tả nếp sinh hoạt lặp lại; trong bản nháp, “thường” đặt ở vế ban ngày nhưng vế ban đêm dễ được hiểu là một hành động đơn lẻ. Cần biểu thị tính thường lệ rõ hơn ở vế ban đêm.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và dễ hiểu. “Ngọn núi gọi là núi Ô-liu” hơi gượng vì lặp từ “núi”; dùng “ngọn núi được gọi là Núi Ô-liu” tự nhiên hơn mà vẫn giữ cấu trúc gọi tên của nguyên văn.
  terminology: “Đức Giê-su,” “Ngài,” “khuôn viên đền thờ,” và “Núi Ô-liu” phù hợp với văn phong Kinh Thánh tiếng Việt hiện đại. Chú thích về ἱερόν và αὐλίζομαι đúng trọng tâm, không áp đặt diễn giải.
