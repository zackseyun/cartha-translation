  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: vi
  text: Ban ngày, Đức Giê-su giảng dạy trong khuôn viên đền thờ[a]; còn ban đêm, Ngài thường đi ra và nghỉ đêm trên ngọn núi được gọi là Núi Ô-liu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên đền thờ, chứ không riêng nơi thánh bên trong.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trú qua đêm”; động từ này đôi khi gợi ý việc nghỉ ngoài trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: thường giảng dạy
  rationale: Kết cấu vị hoàn thành của εἰμί với phân từ hiện tại diễn tả hoạt động kéo dài và có tính thường lệ; “thường giảng dạy” truyền đạt tự nhiên sắc thái ấy.
- source_word: τὰς ἡμέρας
  choice: ban ngày
  rationale: Đối cách chỉ thời gian được diễn đạt tự nhiên là “ban ngày”, đồng thời giữ rõ thế đối lập với “ban đêm”.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; cách dịch này làm rõ phạm vi mà nguyên ngữ biểu thị.
- source_word: τὰς δὲ νύκτας
  choice: còn ban đêm
  rationale: “Còn” thể hiện sự tương phản do δέ tạo nên giữa sinh hoạt ban ngày và ban đêm.
- source_word: ἐξερχόμενος
  choice: Ngài đi ra
  rationale: Phân từ đi cùng động từ vị hoàn thành mô tả hành động lặp lại; câu tiếng Việt được tách tự nhiên mà vẫn giữ ý thường lệ trong văn cảnh.
- source_word: ηὐλίζετο
  choice: nghỉ đêm
  rationale: αὐλίζομαι nghĩa là qua đêm hoặc trú đêm, đôi khi có thể hàm ý ở ngoài trời; “nghỉ đêm” tự nhiên và không xác định quá mức cách thức.
- source_word: εἰς τὸ ὄρος
  choice: trên ngọn núi
  rationale: Sau động từ chỉ việc nghỉ lại, εἰς diễn tả đích đến dẫn tới địa điểm lưu trú; tiếng Việt tự nhiên dùng “trên” ở đây.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: gọi là núi Ô-liu
  rationale: Ἐλαιῶν là dạng sở hữu số nhiều, nghĩa là “của những cây ô-liu”; “núi Ô-liu” là địa danh tiếng Việt rõ ràng, quen thuộc và sát nghĩa.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” theo lối kể tôn kính phổ thông; nhịp “ban ngày… còn ban đêm…” làm nổi bật cấu trúc tương phản và hoạt động thường lệ của nguyên văn.
