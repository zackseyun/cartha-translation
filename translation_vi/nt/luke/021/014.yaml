  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: vi
  text: Vậy, anh em hãy quyết định trong lòng mình là không suy tính trước cách tự biện hộ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέτε
  choice: hãy quyết tâm
  rationale: Động từ mệnh lệnh, khi đi với cụm “trong lòng”, diễn tả việc xác định dứt khoát trong nội tâm. “Hãy quyết tâm” tự nhiên trong tiếng Việt và giữ được lực mệnh lệnh.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận rút ra từ lời dạy ngay trước đó; “Vậy” gọn, tự nhiên và làm rõ mạch suy luận.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: trong lòng
  rationale: Giữ hình ảnh Kinh Thánh về nội tâm và ý chí. Tiếng Việt thường dùng danh từ số ít tập hợp “lòng” dù lời nói hướng đến nhiều người.
- source_word: μὴ προμελετᾶν
  choice: sẽ không chuẩn bị trước
  rationale: Diễn tả quyết định không suy tính hoặc tập dượt trước. Cấu trúc “rằng ... sẽ không” phù hợp tự nhiên với “hãy quyết tâm trong lòng”.
- source_word: ἀπολογηθῆναι
  choice: lời tự biện hộ
  rationale: Trong bối cảnh bị đưa ra trước nhà cầm quyền, từ này chỉ việc trình bày lời bào chữa hay biện hộ cho chính mình; “tự biện hộ” giữ sắc thái pháp lý và ý nghĩa phản thân.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ thành ngữ “trong lòng” cùng sắc thái pháp lý của việc biện hộ; dấu phẩy cuối câu phản ánh việc câu nói tiếp tục sang câu kế.
