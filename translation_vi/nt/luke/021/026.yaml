  source_fidelity: 'Bản nháp nhìn chung phản ánh đúng các thành tố Hy Lạp: con người ngất lịm vì sợ hãi và sự trông đợi, những điều sắp đến trên οἰκουμένη, và các quyền lực của trời sẽ bị lay chuyển. Tuy nhiên, “giáng xuống” thêm sắc thái từ trên xuống không được biểu thị trực tiếp bởi ἐπερχομένων, vốn là “đang/sắp ập đến trên”.'
