revisions:
- from: người ta ngất đi vì sợ hãi và vì chờ đợi những điều sắp giáng xuống thế giới có người ở[a], vì các quyền lực trên trời sẽ bị lay chuyển[b].
  to: Người ta ngất đi vì sợ hãi và vì trông đợi những điều sắp ập đến trên thế giới có người ở[a], vì các quyền lực trên trời[b] sẽ bị lay chuyển.
  rationale: Đổi “chờ đợi” thành “trông đợi” để diễn đạt danh từ προσδοκίας trôi chảy hơn trong cấu trúc nguyên nhân; đổi “sắp giáng xuống” thành “sắp ập đến trên” để tránh thêm sắc thái hướng xuống; và dời neo [b] đến ngay sau cụm từ mà chú thích giải thích. Các cách diễn đạt về οἰκουμένη và “các quyền lực trên trời” được giữ để bảo toàn sắc thái và tính mơ hồ của nguyên văn.
