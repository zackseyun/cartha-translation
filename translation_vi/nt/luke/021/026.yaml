source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: vi
  text: Người ta ngất đi vì sợ hãi và vì trông đợi những điều sắp ập đến trên thế giới có người ở[a], vì các quyền lực trên trời[b] sẽ bị lay chuyển.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thế giới” hoặc “địa cầu”; tiếng Hy Lạp có nghĩa đen là “thế giới có người ở.”
    reason: lexical_alternative
  - marker: b
    text: Hay “các quyền lực thuộc trời” hoặc “các sức mạnh của các tầng trời.” Cụm từ này có thể chỉ rộng đến những quyền lực vũ trụ hoặc thiên giới.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων ἀνθρώπων
  choice: người ta ngất đi
  rationale: Cụm phân từ diễn tả con người kiệt sức hoặc ngất lịm vì kinh hãi. “Người ta” mang nghĩa khái quát, không giới hạn ở nam giới; “ngất đi” giữ được sắc thái vừa thể chất vừa tâm lý.
- source_word: ἀπὸ φόβου
  choice: vì sợ hãi
  rationale: ἀπό với sở hữu cách chỉ nguyên nhân ở đây. “Vì sợ hãi” tự nhiên trong tiếng Việt và thể hiện rõ quan hệ nhân quả.
- source_word: προσδοκίας
  choice: chờ đợi
  rationale: Từ này chỉ sự trông chờ điều sắp xảy đến. Bối cảnh cho thấy tính chất đáng sợ, nên không cần thêm một từ diễn giải như “điềm gở” vốn sẽ thu hẹp nghĩa.
- source_word: τῶν ἐπερχομένων
  choice: những điều sắp giáng xuống
  rationale: Phân từ được dùng như danh từ, số nhiều, chỉ các biến cố đang tiến đến. “Sắp giáng xuống” vừa tự nhiên vừa giữ hướng tác động lên thế giới trong cấu trúc Hy Lạp.
- source_word: τῇ οἰκουμένῃ
  choice: thế giới có người ở
  rationale: οἰκουμένη nhấn mạnh thế giới cư trú của loài người, không đơn thuần là địa cầu vật chất. Cách dịch này giữ sắc thái nguồn; “thế gian” hoặc “thế giới” là các phương án trôi chảy hơn.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: các quyền lực trên trời
  rationale: Cụm từ có thể chỉ rộng đến các sức mạnh, thực thể hoặc cơ cấu thuộc cõi trời. Cách dịch không đồng nhất nó riêng với thiên thể hay thiên sứ.
- source_word: σαλευθήσονται
  choice: sẽ bị lay chuyển
  rationale: Động từ tương lai thể bị động diễn tả sự rung chuyển hoặc đảo lộn. “Sẽ bị lay chuyển” bảo toàn cả hình ảnh vũ trụ lẫn âm hưởng khải huyền.
theological_decisions:
- issue: Ý nghĩa của “các quyền lực trên trời” trong văn cảnh khải huyền
  choice: Giữ cách diễn đạt rộng “các quyền lực trên trời”.
  alternative: “các thiên thể” hoặc “các quyền lực thuộc trời”
  rationale: Nguyên văn có thể gợi đến những sức mạnh vũ trụ, các thiên thể, hoặc các quyền lực thuộc cõi trời. Không nên xác định riêng là thiên thể hay các hữu thể thiên sứ khi câu Hy Lạp vẫn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng “người ta” để chỉ loài người nói chung. Trật tự dấu chú thích đặt ngay sau cụm từ tương ứng; cả [a] và [b] đều hiện diện trong chính văn.
