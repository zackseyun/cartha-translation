  verdict: approve
  source_fidelity: Bản dịch truyền đạt đúng τότε như “Bấy giờ,” động từ dẫn lời ἔλεγεν, bổ ngữ αὐτοῖς, và công thức xung đột ἔθνος ἐπ’ ἔθνος / βασιλεία ἐπὶ βασιλείαν. “Sẽ nổi lên ... chống lại” diễn đạt tự nhiên giá trị tương lai và sắc thái đối nghịch của ἐγερθήσεται và ἐπί với đối cách, không thêm tác nhân hay diễn giải cánh chung.
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và có nhịp song song phù hợp với lời nói trang trọng. Cặp “này ... kia” là cách Việt hóa tự nhiên cho công thức tổng quát lặp lại, không làm thay đổi ý nghĩa địa-chính trị của nguyên văn. “Ngài phán” thuộc văn phong Kinh Thánh trang trọng nhưng vẫn thông dụng.
  terminology: “Dân tộc” và “vương quốc” phân biệt hợp lý ἔθνος với βασιλεία trong ngữ cảnh các thực thể tập thể/chính trị. Cách dùng không áp đặt cách giải thích giáo phái. Chú thích [a] được đặt đúng tại “nổi lên” và nêu một phương án từ vựng khả dĩ.
