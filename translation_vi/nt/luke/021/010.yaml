id: LUK.21.10
reference: Luke 21:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: vi
  text: 'Bấy giờ, Ngài phán với họ: “Dân tộc này sẽ nổi lên[a] chống lại dân tộc kia, vương quốc này chống lại vương quốc kia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ đứng lên.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên một dấu mốc thời gian nối lời này với văn cảnh ngay trước đó.
- source_word: ἔλεγεν
  choice: phán
  rationale: Thì vị hoàn thành trong tiếng Hy Lạp có thể nhấn mạnh diễn tiến hoặc sự lặp lại, nhưng ở đây chức năng chính là dẫn vào lời nói trực tiếp; “phán” là cách diễn đạt trang trọng, tự nhiên khi chủ thể là Chúa Giê-su mà không cường điệu sắc thái thể.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Diễn đạt tự nhiên bổ ngữ gián tiếp trong tiếng Việt.
- source_word: Ἐγερθήσεται
  choice: sẽ nổi lên
  rationale: Dạng tương lai bị động/trung gian của ἐγείρω trong công thức xung đột mang nghĩa đứng lên hoặc nổi lên chống đối; cách dịch này tự nhiên và không áp đặt một tác nhân bên ngoài.
- source_word: ἔθνος
  choice: dân tộc
  rationale: Trong văn cảnh địa chính trị, từ này chỉ một dân tộc hoặc cộng đồng chính trị; “dân tộc” giữ được sự phân biệt với βασιλεία.
- source_word: ἐπ’ ἔθνος
  choice: chống lại dân tộc kia
  rationale: ἐπί với đối cách trong thành ngữ này biểu thị sự đối địch; thêm “này… kia” để công thức đối ứng tự nhiên, rõ nghĩa trong tiếng Việt.
- source_word: βασιλεία
  choice: vương quốc
  rationale: Ở đây từ này chỉ một lãnh thổ hoặc thực thể chính trị do vua cai trị, chứ không phải khái niệm trừu tượng về vương quyền.
- source_word: ἐπὶ βασιλείαν
  choice: chống lại vương quốc kia
  rationale: Giữ cấu trúc song song và sắc thái đối địch giống vế trước; động từ được lược theo cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Công thức xung đột mang tính khải huyền
  choice: Dịch như một lời báo trước trực tiếp về xung đột giữa các dân tộc và vương quốc.
  alternative: Giới hạn lời này chỉ vào sự sụp đổ của Giê-ru-sa-lem, hoặc diễn giải nó thành một thời biểu chi tiết về thời kỳ cuối cùng.
  rationale: Câu này tự nó chỉ nói đến các dân tộc và vương quốc nổi lên chống nhau; bản dịch không nên giải quyết những tranh luận cánh chung rộng hơn mà câu chữ không nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “Ngài” dựa vào chủ thể đã có trong văn cảnh, tránh lặp tên riêng không xuất hiện trong câu Hy Lạp. Cấu trúc “này… kia” giúp thành ngữ đối ứng tự nhiên trong tiếng Việt mà không thay đổi nội dung.
