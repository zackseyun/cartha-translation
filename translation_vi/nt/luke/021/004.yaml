  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: vi
  text: Vì tất cả những người này đều đã dâng các lễ vật[a] từ phần dư dật của mình; còn bà ấy thì, từ cảnh túng thiếu của mình[b], đã dâng tất cả những gì bà có để sinh sống[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các khoản dâng”. Tiếng Hy Lạp nói “các lễ vật”, tức những lễ vật được dâng trong bối cảnh đền thờ.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “trong cảnh thiếu thốn” hoặc “trong cảnh nghèo khó”.
    reason: lexical_alternative
  - marker: c
    text: Hay “toàn bộ phương tiện sinh sống của mình”. Ý nói mọi thứ bà có để duy trì cuộc sống, không phải “cả cuộc đời” theo nghĩa toàn bộ sự tồn tại của bà.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: Vì tất cả những người này đều
  rationale: “Vì” giữ quan hệ giải thích của γάρ với câu trước; “tất cả những người này” diễn đạt tự nhiên πάντες ... οὗτοι trong tiếng Việt.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: lấy phần dư dật của mình
  rationale: Diễn đạt điều họ có dư, đồng thời tạo thế đối lập rõ với sự túng thiếu của bà góa.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: bỏ vào các lễ vật
  rationale: “Bỏ vào” giữ hình ảnh cụ thể của βάλλω; “các lễ vật” theo sát δῶρα mà không diễn giải thành kho tiền đền thờ.
- source_word: αὕτη δὲ
  choice: còn bà ấy
  rationale: Đại từ chỉ người giống cái nhắc lại bà góa trong ngữ cảnh; “còn” thể hiện sự tương phản của δέ.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: dù đang túng thiếu
  rationale: “Túng thiếu” chuyển tải tình trạng thiếu thốn, nhu cầu của ὑστέρημα bằng tiếng Việt tự nhiên; “dù đang” làm rõ thế tương phản vốn có trong cấu trúc mà không biến nó thành một nhận định giáo lý.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: tất cả những gì mình có để sinh sống
  rationale: βίος ở đây chỉ phương tiện sinh sống chứ không phải toàn bộ sự sống; cách dịch này rõ nghĩa và gắn với ὃν εἶχεν.
- source_word: ἔβαλεν
  choice: đã bỏ vào
  rationale: Giữ hành động cụ thể là đặt tiền vào nơi nhận lễ vật và dùng thì hoàn thành tự nhiên trong lời thuật tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của βίος trong món dâng của bà góa
  choice: 'Phương tiện sinh sống: “tất cả những gì mình có để sinh sống”'
  alternative: “cả cuộc đời mình”
  rationale: Ngữ cảnh nói về tiền bạc và βίος chỉ của cải hay phương tiện duy trì cuộc sống; dịch là “cuộc đời” dễ dẫn đến cách hiểu hiện sinh vượt quá ý câu.
- issue: Đối tượng chỉ bởi τὰ δῶρα
  choice: “các lễ vật”
  alternative: “các khoản dâng” hoặc “kho tiền đền thờ”
  rationale: δῶρα có nghĩa trực tiếp là các lễ vật/quà dâng. Bản dịch không thêm sự xác định “kho tiền” vốn không nằm trong từ ngữ của câu này.
- issue: Sắc thái của ὑστέρημα
  choice: “túng thiếu”
  alternative: “nghèo khó” hoặc “thiếu thốn”
  rationale: Từ Hy Lạp có thể chỉ sự thiếu hụt, cảnh cần thiếu hay nghèo túng. “Túng thiếu” bảo toàn phạm vi nghĩa mà không tuyệt đối hóa thành một cấp độ nghèo cụ thể.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ thế đối lập giữa sự dư dật và cảnh túng thiếu, đồng thời tránh lối dịch “cả cuộc đời” có thể gây hiểu sai.
