revisions:
- from: Nhưng hãy luôn tỉnh thức và cầu nguyện, để anh em có đủ sức thoát khỏi mọi điều sắp xảy ra[a], và đứng trước Con Người.[b]
  to: Nhưng hãy luôn tỉnh thức và cầu nguyện, để anh em có đủ sức thoát khỏi tất cả những điều này sắp xảy ra[a], và đứng trước Con Người.[b]
  rationale: Chỉnh “mọi điều” thành “tất cả những điều này” để bảo toàn ταῦτα πάντα. Đồng thời điều chỉnh nhẹ câu chữ trong chú thích dị bản cho tự nhiên hơn. Các lựa chọn còn lại được giữ nguyên vì trung thành với bản SBLGNT và bảo toàn tính hàm ẩn của vế cuối.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:51Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh phải tỉnh thức, cầu nguyện, ý “có đủ sức” của κατισχύσητε (không theo dị bản “được kể là xứng đáng”), và hình ảnh không diễn giải thêm “đứng trước Con Người”. Tuy nhiên, “mọi điều sắp xảy ra” làm mờ đại từ chỉ định ταῦτα (“những điều này”). Cần giữ yếu tố này trong bản văn chính.
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt tiêu chuẩn hiện đại. “Hãy luôn tỉnh thức và cầu nguyện” diễn đạt trôi chảy ý συνεχ tục của ἀγρυπνεῖτε ... ἐν παντὶ καιρῷ. Cấu trúc “để anh em có đủ sức ... và đứng ...” rõ ràng.
  terminology: “Con Người” là cách dịch chuẩn và nhất quán cho ὁ υἱὸς τοῦ ἀνθρώπου. “Có đủ sức” phản ánh phù hợp κατισχύσητε. Chú thích dị bản nên dùng “được coi là xứng đáng” để diễn đạt tự nhiên hơn dạng bị động của καταξιωθῆτε, mà không thay đổi ý.
  issues:
  - severity: medium
    issue: Thiếu sắc thái chỉ định của ταῦτα.
    rationale: Cụm ταῦτα πάντα không chỉ là “mọi điều” mà là “tất cả những điều này”. Việc bổ sung “này” giữ liên kết với các biến cố vừa được mô tả trong ngữ cảnh mà vẫn tự nhiên trong tiếng Việt.
  - severity: low
    issue: Cách diễn đạt chú thích dị bản hơi gượng.
    rationale: “Được kể là xứng đáng” có thể hiểu được, nhưng “được coi là xứng đáng” tự nhiên hơn trong tiếng Việt hiện đại và phản ánh đúng ý của dị bản, không áp đặt cách hiểu thần học.
  revised_text: Nhưng hãy luôn tỉnh thức và cầu nguyện, để anh em có đủ sức thoát khỏi tất cả những điều này sắp xảy ra[a], và đứng trước Con Người.[b]
