reference: Luke 21:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: vi
  text: Nhưng hãy luôn tỉnh thức và cầu nguyện, để anh em có đủ sức thoát khỏi tất cả những điều này sắp xảy ra[a], và đứng trước Con Người.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “để anh em được coi là xứng đáng thoát khỏi tất cả những điều này sắp xảy ra.”'
    reason: textual_variant
  - marker: b
    text: Cụm từ “đứng trước Con Người” có thể hàm ý đứng trước ngài với tư cách được chấp nhận hoặc được minh oan, nhưng tiếng Hy Lạp không nói rõ điều này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: hãy luôn tỉnh thức
  rationale: Mệnh lệnh kêu gọi duy trì sự cảnh giác; “tỉnh thức” giữ được hình ảnh thức canh và là cách nói tự nhiên, trang trọng trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ với lời cảnh báo trước đó.
- source_word: ἐν παντὶ καιρῷ
  choice: luôn
  rationale: Diễn đạt tự nhiên ý nghĩa liên tục của cụm “trong mọi thời điểm”, tránh cách nói cứng.
- source_word: δεόμενοι
  choice: và cầu nguyện
  rationale: Phân từ chỉ hành động khẩn cầu đi kèm việc tỉnh thức; chuyển thành động từ phối hợp giúp câu tiếng Việt rõ và tự nhiên.
- source_word: ἵνα κατισχύσητε
  choice: để anh em có đủ sức
  rationale: κατισχύω có nghĩa là đủ sức hoặc thắng thế; cách dịch này phù hợp với các động từ nguyên mẫu theo sau và không lẫn với dị bản “được kể là xứng đáng”.
- source_word: ἐκφυγεῖν
  choice: thoát khỏi
  rationale: Diễn đạt rõ hành động thoát khỏi những biến cố được nhắc đến.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: mọi điều sắp xảy ra
  rationale: Giữ được cả ý tương lai và sắc thái gần kề có thể có của μέλλω, bằng lối nói hiện đại, gọn rõ.
- source_word: σταθῆναι
  choice: đứng
  rationale: Giữ nguyên hình ảnh của tiếng Hy Lạp, không thêm ý được chấp nhận hay được minh oan vốn chỉ là hàm ý khả dĩ.
- source_word: ἔμπροσθεν
  choice: trước
  rationale: Cách diễn đạt quan hệ hiện diện trực tiếp, ngắn gọn và tự nhiên.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Danh hiệu quen thuộc trong các sách Phúc Âm, giữ nền tảng ngôn ngữ Semit và chức năng Kitô học của cụm từ.
theological_decisions:
- issue: Ý nghĩa của κατισχύσητε đối với sự chịu đựng trong thời kỳ cuối cùng
  choice: có đủ sức
  alternative: được kể là xứng đáng
  rationale: Bản SBLGNT đọc κατισχύσητε, nói đến khả năng đủ sức hoặc thắng thế, chứ không trực tiếp nói đến sự xứng đáng. Dị bản có ảnh hưởng đến cách hiểu được ghi ở chú thích.
- issue: Ý nghĩa của σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: đứng trước Con Người
  alternative: đứng trước Con Người với tư cách được chấp nhận hoặc được minh oan
  rationale: Cụm từ có thể hàm ý được chấp nhận hay được minh oan trong ngày phán xét, nhưng tiếng Hy Lạp không nói rõ; bản dịch giữ nguyên sự hàm ẩn này.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” theo lối xưng hô số nhiều trong lời Chúa Giê-su nói với các môn đồ. Trật tự câu được điều chỉnh nhẹ cho tự nhiên, đồng thời bảo toàn mệnh lệnh tỉnh thức, lời cầu nguyện có mục đích và sự mơ hồ thần học của vế cuối.
