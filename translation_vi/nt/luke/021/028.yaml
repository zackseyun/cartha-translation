revisions:
- from: Nhưng khi những điều này bắt đầu xảy ra[a], anh em hãy đứng thẳng dậy và ngẩng đầu lên[b], vì sự cứu chuộc[c] của anh em đang đến gần.
  to: Nhưng khi những điều này bắt đầu xảy ra[a], anh em hãy đứng thẳng và ngẩng đầu lên[b], vì sự cứu chuộc[c] của anh em đang đến gần.
  rationale: Đổi “đứng thẳng dậy” thành “đứng thẳng” để phản ánh chính xác hơn ἀνακύψατε, vốn diễn tả tư thế thẳng người, đồng thời giữ câu văn tự nhiên. Chú thích b được sửa để loại bỏ cụm từ không tự nhiên và vẫn phản ánh phương án dịch thay thế. Các yếu tố nghĩa khác, thuật ngữ “sự cứu chuộc”, các mốc chú thích và ý nghĩa văn cảnh được giữ nguyên.
  reviewer_model: gpt-5.6-terra
