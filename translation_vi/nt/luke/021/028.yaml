id: LUK.21.28
reference: Luke 21:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: vi
  text: Nhưng khi những điều này bắt đầu xảy ra[a], anh em hãy đứng thẳng và ngẩng đầu lên[b], vì sự cứu chuộc[c] của anh em đang đến gần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi những điều này bắt đầu diễn ra.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “hãy thẳng người lên và ngẩng đầu lên.” Hai mệnh lệnh diễn tả tư thế vững lòng và đầy hy vọng.'
    reason: lexical_alternative
  - marker: c
    text: “Sự cứu chuộc” cũng có thể dịch là “sự giải thoát”; tại đây, từ này nói đến sự giải cứu cuối cùng đang đến gần dành cho những người thuộc về Chúa Giê-su.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: khi những điều này bắt đầu xảy ra
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. Cách dịch này giữ cả ý “bắt đầu” lẫn ý “xảy ra” và tự nhiên trong tiếng Việt.
- source_word: δέ
  choice: Nhưng
  rationale: Từ nối đánh dấu sự chuyển ý nhẹ, tương phản cảnh hoạn nạn phía trước với lời khích lệ dành cho các môn đồ.
- source_word: ἀνακύψατε
  choice: hãy đứng thẳng dậy
  rationale: Động từ chỉ việc duỗi thẳng người hoặc đứng thẳng lên sau khi cúi xuống; cách dịch giữ được cả hình ảnh thân thể lẫn sắc thái lấy lại can đảm.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: ngẩng đầu lên
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ hình ảnh về niềm hy vọng và sự vững lòng.
- source_word: διότι
  choice: vì
  rationale: Diễn đạt rõ quan hệ nguyên nhân trong tiếng Việt hiện đại.
- source_word: ἐγγίζει
  choice: đang đến gần
  rationale: Giữ sắc thái hiện tại diễn tiến của một điều đang tiến đến gần, thay vì chỉ nói về trạng thái “ở gần”.
- source_word: ἀπολύτρωσις
  choice: sự cứu chuộc
  rationale: Giữ thuật ngữ có chiều sâu về sự giải phóng và cứu rỗi, đồng thời không thu hẹp ý nghĩa thành việc thoát khỏi một cuộc khủng hoảng trước mắt.
theological_decisions:
- issue: Ý nghĩa của “sự cứu chuộc của anh em” trong diễn từ về thời cuối cùng
  choice: Giữ cách dịch “sự cứu chuộc của anh em”, trong văn cảnh chỉ sự giải cứu và minh oan cuối cùng đang đến gần cho các môn đồ của Chúa Giê-su.
  alternative: Chỉ sự giải thoát khỏi một cuộc khủng hoảng lịch sử trước mắt; hoặc một sự cứu chuộc hoàn toàn thuộc linh, không liên quan đến thời cuối cùng.
  rationale: Văn cảnh trực tiếp hướng về tương lai và mang tính khải huyền. Bản dịch giữ nguyên sức nặng của ἀπολύτρωσις nhưng không giải thích quá mức cơ chế hay thời điểm của sự cứu chuộc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “anh em” phù hợp với lời Chúa Giê-su nói trực tiếp với các môn đồ và giữ số nhiều của nguyên văn. Cặp động từ “đứng thẳng dậy và ngẩng đầu lên” bảo tồn hình ảnh cụ thể mà không làm mất hàm ý can đảm, hy vọng.
