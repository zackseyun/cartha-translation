  rationale: Bản sửa thay cách nối mệnh đề để tiếng Việt tự nhiên hơn và thay “lễ vật” bằng “vật” nhằm phản ánh chính xác hơn ἀναθήματα là những vật phẩm được biệt dâng. Các yếu tố còn lại, gồm phạm vi của ἱερόν, sắc thái “trang hoàng” và đại từ tôn kính theo mạch văn, được giữ nguyên.
