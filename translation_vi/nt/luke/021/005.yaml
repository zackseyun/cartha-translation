  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: vi
  text: 'Khi có vài người đang nói về việc đền thờ[a] được trang hoàng bằng những viên đá đẹp và các vật dâng hiến[b], Ngài nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ở đây chỉ toàn bộ khuôn viên đền thờ nói chung, không riêng phần nội điện.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “các tặng vật biệt dâng”; đây là những vật được dâng cho Đức Chúa Trời và trưng bày tại đền thờ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Khi một số người đang nói
  rationale: Cụm sở hữu cách tuyệt đối diễn tả hoàn cảnh đồng thời; cách dịch này tự nhiên trong tiếng Việt và giữ được tính tiếp diễn của phân từ λεγόντων.
- source_word: τοῦ ἱεροῦ
  choice: đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ nói chung, không riêng phần nội điện; “đền thờ” là cách gọi tự nhiên, còn phạm vi nghĩa được làm rõ trong chú thích.
- source_word: λίθοις καλοῖς
  choice: những khối đá đẹp
  rationale: καλοῖς nêu vẻ đẹp và phẩm chất đáng ngưỡng mộ của đá; “khối đá” phù hợp với những viên đá kiến trúc lớn của đền thờ.
- source_word: ἀναθήμασιν
  choice: các lễ vật dâng hiến
  rationale: Từ này chỉ các vật được dâng cho Đức Chúa Trời và trưng bày tại đền thờ; cách dịch giữ sắc thái thờ phượng mà vẫn dễ hiểu.
- source_word: κεκόσμηται
  choice: được trang hoàng
  rationale: Thể hoàn thành bị động diễn tả việc trang hoàng đã hoàn tất với kết quả vẫn hiện hữu; tiếng Việt diễn đạt tự nhiên trạng thái kết quả ấy bằng “được trang hoàng”.
- source_word: εἶπεν
  choice: Ngài nói
  rationale: Động từ Hy Lạp chỉ hàm chứa chủ ngữ, vốn là Đức Giê-su trong mạch văn. “Ngài” duy trì liên kết diễn ngôn mà không lặp lại tên không có trong câu.
