id: LUK.21.22
reference: Luke 21:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: vi
  text: Vì đây là những ngày báo trả[a], để mọi điều đã được chép đều được ứng nghiệm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những ngày báo thù” hoặc “những ngày trừng phạt.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cấu trúc Hy Lạp có thể diễn tả mục đích hoặc kết quả: “để” hoặc “khiến mọi điều đã được chép đều được ứng nghiệm.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ lực giải thích/nguyên nhân nối câu này với lời cảnh báo ngay trước đó; “Vì” tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἡμέραι ἐκδικήσεως
  choice: những ngày báo trả
  rationale: Giữ hình ảnh số nhiều “những ngày” và sắc thái xét xử, trừng phạt thích đáng của ἐκδίκησις. “Báo trả” tránh hàm ý nóng giận, tư thù quá mạnh của “báo thù” nhưng không làm nhẹ tính nghiêm khắc.
- source_word: αὗταί εἰσιν
  choice: đây là
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho đại từ chỉ định nhấn mạnh cùng động từ liên kết.
- source_word: τοῦ πλησθῆναι
  choice: để ... được ứng nghiệm
  rationale: Diễn đạt tự nhiên cấu trúc τοῦ với động từ nguyên mẫu, đồng thời cho phép hiểu theo hướng mục đích hoặc kết quả; chú thích nêu rõ độ mở này.
- source_word: πάντα τὰ γεγραμμένα
  choice: mọi điều đã được chép
  rationale: Giữ phạm vi bao quát của πάντα và dạng phân từ hoàn thành bị động, không tự ý thu hẹp đối tượng thành một nhóm lời tiên tri hay một phần Kinh Thánh cụ thể.
- source_word: πλησθῆναι
  choice: được ứng nghiệm
  rationale: Trong quan hệ với những điều “đã được chép”, “được ứng nghiệm” là cách nói tiếng Việt tự nhiên, giữ ý hoàn tất những điều đã được ghi lại.
theological_decisions:
- issue: Tính chất của ἐκδικήσεως trong lời tiên báo của Chúa Giê-su
  choice: báo trả
  alternative: báo thù; trừng phạt; thi hành công lý
  rationale: “Báo trả” giữ sắc thái phán xét và sự đền đáp tương xứng mà không biến hành động thành sự trả thù mang tính tư oán. Câu văn vẫn để ngỏ tác nhân thay vì thêm trực tiếp “của Đức Chúa Trời” vào bản văn.
- issue: Lực nghĩa của τοῦ cộng động từ nguyên mẫu
  choice: để ... được ứng nghiệm
  alternative: khiến ... được ứng nghiệm; đến nỗi ... được ứng nghiệm
  rationale: Cấu trúc Hy Lạp có thể nghiêng về mục đích hoặc kết quả. Bản chính dùng “để”, còn chú thích bảo tồn khả năng hiểu theo kết quả, không quyết định quá mức.
- issue: Phạm vi của τὰ γεγραμμένα
  choice: mọi điều đã được chép
  alternative: mọi lời Kinh Thánh đã chép; mọi lời tiên tri đã chép
  rationale: Không thêm “Kinh Thánh” hay “lời tiên tri” vì nguyên văn chỉ nói theo nghĩa rộng về những điều đã được chép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Những ngày báo trả” duy trì âm hưởng tư pháp–tiên tri; “mọi điều đã được chép” cố ý không xác định hẹp hơn nguyên văn.
