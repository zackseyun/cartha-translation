id: LUK.21.9
reference: Luke 21:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: vi
  text: Nhưng khi các con nghe nói về chiến tranh và những biến động[a], đừng kinh hãi; vì những điều ấy phải xảy ra trước[b], nhưng sự tận cùng chưa đến ngay.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những cuộc náo động,” “tình trạng bất ổn” hoặc “hỗn loạn.”
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “nhưng sự tận cùng sẽ không đến ngay lập tức.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Nhưng khi
  rationale: ὅταν mở đầu một mệnh đề thời gian hướng đến tương lai; δέ là liên từ nhẹ, ở đây thích hợp với “nhưng” để nối với lời cảnh báo trước đó mà không nhấn mạnh sự tương phản quá mức.
- source_word: ἀκούσητε
  choice: các con nghe nói về
  rationale: Trong ngữ cảnh nghe tin về các biến cố, “nghe nói về” là cách diễn đạt tự nhiên của tiếng Việt; ngôi số nhiều được thể hiện bằng “các con” theo lời Đức Giê-su nói với các môn đồ.
- source_word: πολέμους
  choice: chiến tranh
  rationale: Chuyển tải trực tiếp danh từ số nhiều chỉ các cuộc xung đột vũ trang; tiếng Việt có thể dùng danh từ không biến đổi hình thái số.
- source_word: ἀκαταστασίας
  choice: những cuộc biến động
  rationale: ἀκαταστασία có trường nghĩa gồm bất ổn, hỗn loạn và náo động. “Những cuộc biến động” giữ nghĩa rộng về xáo trộn xã hội-chính trị mà không thu hẹp thành bạo loạn hay nổi dậy.
- source_word: μὴ πτοηθῆτε
  choice: đừng kinh hãi
  rationale: Diễn đạt mệnh lệnh phủ định với sắc thái sợ hãi mạnh, gần với tác động bị làm cho hoảng sợ của động từ Hy Lạp.
- source_word: δεῖ γὰρ
  choice: vì ... phải
  rationale: γάρ nêu lý do, còn δεῖ biểu thị tính tất yếu; cấu trúc “vì ... phải” tự nhiên và rõ ràng trong tiếng Việt.
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: những điều ấy phải xảy ra trước
  rationale: γίνομαι ở đây nói về các biến cố xảy đến; πρῶτον chỉ thứ tự trước sau. Cách dịch giữ nguyên ý tất yếu và trình tự.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: nhưng chưa phải là tận cùng ngay lập tức
  rationale: Nguyên văn là một cụm không có động từ, theo sát nghĩa đen là “nhưng không ngay lập tức là tận cùng.” Cách dịch này giữ sự cô đọng và tránh tự động bổ sung một hệ thống thời kỳ tận thế cụ thể.
theological_decisions:
- issue: Thời điểm của sự tận cùng
  choice: Các cuộc chiến tranh và biến động phải xảy ra trước, nhưng chúng không đồng nghĩa với việc sự tận cùng đến ngay lập tức.
  alternative: Nhưng sự tận cùng sẽ không đến ngay lập tức.
  rationale: Bản dịch giữ lời cảnh báo rằng biến động không chứng minh sự tận cùng xảy đến tức khắc, đồng thời không áp đặt một sơ đồ cánh chung cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Kinh hãi” giữ cường độ cảm xúc của nguyên văn; “tận cùng” duy trì tính khái quát của τὸ τέλος. Tất cả dấu chú thích [a], [b] đều được đặt trong chính văn.
