id: LUK.21.16
reference: Luke 21:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: vi
  text: Nhưng ngay cả cha mẹ, anh em[a], bà con và bạn bè cũng sẽ nộp anh em; họ sẽ giết một số người trong anh em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”, vì danh từ giống đực số nhiều trong tiếng Hy Lạp đôi khi có thể chỉ một nhóm anh chị em gồm cả nam lẫn nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: sẽ bị ... nộp
  rationale: Dạng tương lai bị động của παραδίδωμι, chỉ việc bị trao nộp cho nhà chức trách hoặc những kẻ chống đối. Cách diễn đạt chủ động tự nhiên hơn trong tiếng Việt với các tác nhân được nêu rõ, nhưng vẫn giữ ý nghĩa bị trao nộp.
- source_word: δὲ καὶ
  choice: Nhưng ngay cả ... cũng
  rationale: “Nhưng” thể hiện sự chuyển ý tương phản nhẹ của δέ; cấu trúc “ngay cả ... cũng” diễn đạt sắc thái tăng tiến của καί, nhấn mạnh rằng chính những người thân cận cũng sẽ trao nộp các môn đồ.
- source_word: γονέων
  choice: cha mẹ
  rationale: Từ số nhiều γονεῖς chỉ chung cha và mẹ; “cha mẹ” là cách gọi tự nhiên, chính xác trong tiếng Việt.
- source_word: ἀδελφῶν
  choice: anh em
  rationale: Danh từ giống đực số nhiều chỉ anh em trong gia đình, nhưng trong ngữ cảnh quan hệ họ hàng cũng có thể bao gồm cả chị em; giữ “anh em” trong chính văn và ghi khả năng rộng hơn ở chú thích.
- source_word: συγγενῶν
  choice: bà con
  rationale: Chỉ những người cùng gia tộc hoặc có quan hệ huyết thống; “bà con” tự nhiên, phổ thông và đủ rộng trong tiếng Việt.
- source_word: φίλων
  choice: bạn bè
  rationale: Cách tương đương trực tiếp, tự nhiên của φίλοι ở số nhiều.
- source_word: θανατώσουσιν
  choice: sẽ giết
  rationale: θανατόω nghĩa là làm cho chết hoặc xử tử. “Sẽ giết” rõ ràng, tự nhiên và không thu hẹp phương thức gây chết.
- source_word: ἐξ ὑμῶν
  choice: một số người trong anh em
  rationale: Thành ngữ này có nghĩa là “một số người trong số anh em”, không phải toàn thể những người nghe.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφῶν trong danh sách thân thuộc
  choice: anh em
  alternative: anh chị em
  rationale: Chính văn giữ hình thức giống đực của từ Hy Lạp, đồng thời chú thích bảo lưu khả năng từ này đại diện cho một nhóm anh chị em gồm cả nam lẫn nữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng cặp đại từ “anh em” phù hợp với lời Chúa Giê-su nói cùng các môn đồ; cấu trúc chủ động tránh câu bị động nặng nề trong tiếng Việt mà vẫn giữ rõ tác nhân trao nộp.
