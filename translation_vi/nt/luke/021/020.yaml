  to: Nhưng khi anh em thấy Giê-ru-sa-lem bị quân đội bao vây[a], thì hãy biết rằng sự hoang tàn của thành đã đến gần[b].
  rationale: Đổi đại từ xưng hô để không thêm sắc thái ngoài nguyên văn, và đổi “cảnh hoang tàn” thành “sự hoang tàn” để phản ánh chính xác hơn ἐρήμωσις. Không thay đổi ý nghĩa, lực mệnh lệnh, hay tính mơ hồ giải thích của câu.
