    rationale: Dù mạch văn là lời nói với các môn đồ, cách xưng hô này thêm sắc thái phụ tử/địa vị không nằm trong câu Hy Lạp. “anh em” là lựa chọn hiện đại, tự nhiên và ít diễn giải hơn.
  - severity: low
    issue: “cảnh hoang tàn” không phản ánh tối ưu danh từ ἐρήμωσις.
    rationale: Từ này nói về sự/tình trạng hoang tàn, không chủ yếu là một cảnh tượng. “Sự hoang tàn” bảo toàn tốt hơn nghĩa từ vựng và trọng lượng tiên tri.
