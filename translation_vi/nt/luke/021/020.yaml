source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: vi
  text: Nhưng khi anh em thấy Giê-ru-sa-lem bị quân đội bao vây[a], thì hãy biết rằng sự hoang tàn của thành đã đến gần[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị các doanh trại quân sự bao quanh.” Từ Hy Lạp có thể chỉ doanh trại hoặc quân đội đóng trại; ở đây nói đến lực lượng đang vây Giê-ru-sa-lem.'
    reason: lexical_alternative
  - marker: b
    text: “Sự hoang tàn” gợi lại ngôn ngữ phán xét trong các sách tiên tri; so sánh cách diễn đạt có liên hệ trong Ma-thi-ơ 24:15 và Mác 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Nhưng khi
  rationale: Diễn đạt tự nhiên một tình huống chắc chắn sẽ được nhận biết trong tương lai, đồng thời giữ sắc thái chuyển ý nhẹ của δέ.
- source_word: ἴδητε
  choice: các con thấy
  rationale: Động từ ở ngôi thứ hai số nhiều; “thấy” là cách diễn đạt trực tiếp và tự nhiên trong lời cảnh báo này.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: bị quân đội bao vây
  rationale: Phân từ bị động diễn tả tình trạng Giê-ru-sa-lem bị vây quanh; στρατόπεδον có thể chỉ doanh trại hoặc lực lượng đóng trại, và trong ngữ cảnh này là quân lực đang vây thành.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho địa danh này.
- source_word: τότε γνῶτε
  choice: thì hãy biết
  rationale: Giữ quan hệ thời gian-hệ quả của τότε và lực mệnh lệnh của γνῶτε.
- source_word: ἤγγικεν
  choice: đã đến gần
  rationale: Thể hoàn thành nhấn mạnh rằng sự việc đã tiến đến gần và hiện ở trong trạng thái cận kề.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: cảnh hoang tàn của thành
  rationale: “Cảnh hoang tàn” giữ sắc thái tàn phá và tiếng vọng ngôn ngữ phán xét của các tiên tri; “của thành” làm rõ đại từ αὐτῆς chỉ về Giê-ru-sa-lem mà không nhân cách hóa gượng ép trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa cuộc phán xét sắp đến trên Giê-ru-sa-lem
  choice: Dịch ἐρήμωσις là “cảnh hoang tàn” mà không gắn câu này với một hệ thống giải thích cánh chung cụ thể.
  alternative: Dịch động hơn là “sự hủy diệt”, hoặc đưa trực tiếp cụm “điều ghê tởm gây hoang tàn” vào chính văn.
  rationale: Câu này nói trực tiếp về cảnh hoang tàn của Giê-ru-sa-lem đến gần khi quân đội bao vây thành. Cách dịch giữ sức nặng tiên tri nhưng không thêm điều câu Hy Lạp không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các con” phù hợp lời Đức Chúa Jêsus nói trực tiếp với các môn đồ trong mạch văn; câu giữ cấu trúc dấu hiệu–mệnh lệnh của nguyên bản. Các ký hiệu chú thích được đặt ngay sau cụm từ liên quan.
