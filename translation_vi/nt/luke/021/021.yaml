id: LUK.21.21
reference: Luke 21:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: vi
  text: Bấy giờ, những người ở Giu-đê hãy trốn lên núi; những người ở trong thành[a] hãy rời khỏi đó; còn những người ở miền quê thì đừng vào thành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp dùng đại từ giống cái, theo nghĩa đen là “ở giữa nàng” và “vào nàng”. Đại từ này chỉ Giê-ru-sa-lem được nhân cách hóa; bản dịch tiếng Việt dùng “thành” cho rõ nghĩa.
    reason: Giải thích sở chỉ của đại từ và sắc thái nhân cách hóa vốn không thể hiện tự nhiên bằng đại từ tiếng Việt.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian nối mệnh lệnh này với dấu hiệu vừa nêu ở câu trước; “Bấy giờ” tự nhiên và giữ rõ trình tự diễn tiến.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: những người ở Giu-đê
  rationale: Cụm danh hóa chỉ những người đang ở trong miền Giu-đê; cách dịch này trực tiếp và tự nhiên trong tiếng Việt hiện đại.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: hãy trốn lên núi
  rationale: Thể mệnh lệnh ngôi thứ ba truyền đạt hành động khẩn cấp. “Trốn lên núi” vừa giữ ý chạy lánh nạn của φεύγω vừa diễn đạt tự nhiên hướng đến vùng núi.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: những người ở trong thành
  rationale: Theo ngữ cảnh ngay trước đó, đại từ giống cái αὐτῆς chỉ Giê-ru-sa-lem. Tiếng Việt không dùng giống ngữ pháp như tiếng Hy Lạp, nên “trong thành” truyền đạt sở chỉ tự nhiên hơn “giữa nàng” hoặc “giữa nó”.
- source_word: ἐκχωρείτωσαν
  choice: hãy rời khỏi đó
  rationale: Động từ mang nghĩa rút ra hoặc rời khỏi một nơi. “Rời khỏi đó” làm rõ hướng ra khỏi thành trong tiếng Việt mà không thêm ý giải thích quá mức.
- source_word: οἱ ἐν ταῖς χώραις
  choice: những người ở miền quê
  rationale: χῶραι số nhiều ở đây chỉ những khu vực nông thôn bên ngoài thành, không nhất thiết chỉ các cánh đồng canh tác.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: đừng vào thành
  rationale: Mệnh lệnh phủ định cấm đi vào. Đại từ αὐτήν tiếp tục chỉ Giê-ru-sa-lem; lặp lại “thành” là rõ ràng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sở chỉ và giống của αὐτῆς / αὐτήν
  choice: Dịch rõ là “thành”, hiểu là Giê-ru-sa-lem, đồng thời ghi chú hình thức giống cái trong nguyên văn.
  alternative: Giữ lối nhân cách hóa bằng “nàng”, hoặc dùng đại từ “nó/ấy” mà không nêu danh từ.
  rationale: 'Ngữ cảnh câu 20 xác định Giê-ru-sa-lem là sở chỉ gần nhất và phù hợp với ba nhóm địa điểm: Giu-đê, bên trong thành và miền quê. Tiếng Việt không có yêu cầu hòa hợp giống ngữ pháp; “nàng” dễ gợi một người nữ thật, còn “nó” thiếu trang trọng và kém rõ. Ghi chú bảo tồn sắc thái nhân cách hóa của tiếng Hy Lạp mà không làm câu chính gượng ép.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Ba mệnh lệnh song song được ngăn bằng dấu chấm phẩy để giữ nhịp khẩn cấp của nguyên văn; “hãy…; hãy…; đừng…” bảo toàn lực mệnh lệnh.
