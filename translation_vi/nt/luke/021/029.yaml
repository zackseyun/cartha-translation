- from: 'Rồi Ngài kể cho họ một ẩn dụ: “Hãy nhìn cây vả và mọi cây cối.[a]'
  to: 'Rồi Ngài kể cho họ một dụ ngôn: “Hãy xem cây vả và tất cả các cây.”[a]'
  rationale: Thay “ẩn dụ” bằng “dụ ngôn” để phản ánh đúng παραβολή; thay “mọi cây cối” bằng “tất cả các cây” để sát với πάντα τὰ δένδρα; chỉnh lời thay thế trong chú thích cho nhất quán, và hoàn tất dấu ngoặc kép.
