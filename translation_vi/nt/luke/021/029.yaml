  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: vi
  text: 'Rồi Ngài kể cho họ một dụ ngôn: “Hãy xem cây vả và tất cả các cây.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nhìn cây vả và tất cả các cây.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Rồi
  rationale: Liên từ nối tiếp mạch kể; “Rồi” tự nhiên trong tiếng Việt và diễn đạt sự tiếp nối mà không nhấn mạnh quá mức.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: Ngài kể cho họ một ẩn dụ
  rationale: Cách nói tự nhiên trong tiếng Việt khi παραβολή làm bổ ngữ của động từ nói; vẫn giữ đủ người nghe và thể loại lời dạy.
- source_word: παραβολὴν
  choice: ẩn dụ
  rationale: “Ẩn dụ” là cách gọi quen thuộc, trang trọng cho παραβολή trong văn cảnh các sách Phúc Âm; không làm phẳng thành “minh họa” hay giải quyết trước ý nghĩa của hình ảnh.
- source_word: Ἴδετε
  choice: Hãy nhìn
  rationale: Thể mệnh lệnh kêu gọi người nghe hướng sự chú ý đến ví dụ cụ thể; “Hãy nhìn” rõ ràng và tự nhiên.
- source_word: τὴν συκῆν
  choice: cây vả
  rationale: Danh từ chỉ cây sung vả, không chỉ trái; “cây vả” là cách gọi chính xác và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: πάντα τὰ δένδρα
  choice: mọi cây cối
  rationale: Giữ phạm vi khái quát của πάντα và số nhiều của δένδρα; không thêm ý “khác” vốn không có mặt tường minh trong tiếng Hy Lạp.
