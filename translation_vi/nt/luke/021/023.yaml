reference: Luke 21:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: vi
  text: Khốn cho những phụ nữ đang mang thai và đang cho con bú trong những ngày ấy! Vì sẽ có cơn khốn khó lớn trên đất[a], và cơn thịnh nộ giáng trên dân này[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trên xứ” hoặc “trên trái đất”. Từ Hy Lạp γῆ có thể chỉ đất/xứ hoặc toàn cõi đất; trong ngữ cảnh tập trung vào Giê-ru-sa-lem và Giu-đê, “trên xứ” là một cách hiểu có cơ sở.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “cơn thịnh nộ dành cho dân này” hoặc “cơn thịnh nộ trên dân này”.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Khốn cho
  rationale: Giữ sắc thái cảm thán tiên tri vừa than thương vừa báo trước tai họa, mạnh hơn cách diễn đạt đơn thuần như “thương thay”.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: những phụ nữ đang mang thai
  rationale: Cách nói tự nhiên trong tiếng Việt hiện đại, diễn đạt rõ thành ngữ Hy Lạp “có trong bụng”.
- source_word: ταῖς θηλαζούσαις
  choice: những người đang cho con bú
  rationale: Diễn đạt tự nhiên hành động cho bú; đối tượng được hàm ý trong động từ được nêu rõ để câu tiếng Việt dễ hiểu.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: trong những ngày ấy
  rationale: Sát cấu trúc thời gian của nguyên văn và phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἀνάγκη μεγάλη
  choice: cảnh khốn cùng lớn
  rationale: Trong bối cảnh chiến tranh và tai họa, cụm từ chỉ tình trạng nguy khốn, bức bách nghiêm trọng chứ không chỉ là “sự cần thiết”.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất này
  rationale: γῆ có thể là “đất/xứ” hoặc “đất/địa cầu”. Ngữ cảnh gần nói về Giê-ru-sa-lem và Giu-đê nên “đất này” truyền đạt cách hiểu địa phương, đồng thời chú thích giữ lại khả năng chỉ toàn cõi đất.
- source_word: ὀργή
  choice: cơn thịnh nộ
  rationale: Giữ sức nặng của sự giận dữ mang tính xét phạt mà không chuyển thẳng thành “sự phán xét” hay thêm chủ thể không có trong nguyên văn.
- source_word: τῷ λαῷ τούτῳ
  choice: giáng trên dân này
  rationale: Dative chỉ dân chịu tác động của cơn thịnh nộ; “giáng trên” tự nhiên trong tiếng Việt và vẫn giữ nguyên từ chỉ định “này”.
theological_decisions:
- issue: Phạm vi quy chiếu của γῆ và “dân này”
  choice: Dùng “đất này” theo cách hiểu chủ yếu là vùng đất Giu-đê/Ít-ra-ên trong bối cảnh trực tiếp.
  alternative: Dịch “khắp đất” hoặc “trên trái đất” để hiểu theo phạm vi toàn thế giới.
  rationale: Mạch văn trực tiếp nói đến Giê-ru-sa-lem bị vây, sự hoang tàn và người trong Giu-đê. Tuy vậy, chú thích bảo lưu nghĩa rộng có thể có của γῆ.
- issue: Chủ thể của ὀργή
  choice: Dịch “cơn thịnh nộ” mà không thêm “của Đức Chúa Trời”.
  alternative: Dịch rõ là “cơn thịnh nộ của Đức Chúa Trời” hoặc diễn giải thành “sự phán xét”.
  rationale: Ngữ cảnh có thể hàm ý cơn thịnh nộ của Đức Chúa Trời, nhưng nguyên văn không nêu chủ thể; bản dịch không nên giải quyết ngầm điều mà câu Hy Lạp để hàm ẩn.
- issue: Sắc thái của οὐαί
  choice: “Khốn cho” giữ cả lời than thương lẫn lời báo họa.
  alternative: “Thương thay” nhấn mạnh lòng thương cảm hơn.
  rationale: Trong lời tiên báo tai họa, οὐαί có sức nặng của một tiếng kêu tiên tri; “khốn cho” bảo toàn sức nặng ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Khốn cho” giữ âm hưởng tiên tri; “cảnh khốn cùng lớn” tránh cách nói cổ nhưng vẫn có sức nặng. Không thêm Đức Chúa Trời làm chủ thể của cơn thịnh nộ vì nguyên văn không nói rõ.
