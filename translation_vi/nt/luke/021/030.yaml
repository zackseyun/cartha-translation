  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: vi
  text: Khi chúng đã đâm chồi[a], anh em tự mình quan sát thì biết rằng mùa hè đã gần rồi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay, “đã trổ ra.” Tiếng Hy Lạp không nói rõ là lá hay chồi; trong ngữ cảnh cây cối, động từ chỉ sự sinh trưởng mới.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Khi
  rationale: Diễn đạt tự nhiên mệnh đề thời gian có tính điều kiện trong lời minh họa.
- source_word: προβάλωσιν
  choice: đâm chồi
  rationale: Động từ chỉ cây cối trổ ra phần sinh trưởng mới; “đâm chồi” tự nhiên trong tiếng Việt và không thêm rõ danh từ “lá” vốn không có trong tiếng Hy Lạp.
- source_word: ἤδη
  choice: đã / đã... rồi
  rationale: Giữ sắc thái thời gian của cả hai lần xuất hiện, đồng thời dùng cấu trúc tiếng Việt tự nhiên.
- source_word: βλέποντες ἀφ’ ἑαυτῶν
  choice: chính anh em nhìn thấy
  rationale: Truyền đạt việc người nghe tự mình quan sát và nhận biết, tránh lối dịch cứng “từ chính mình”.
- source_word: γινώσκετε
  choice: biết
  rationale: Diễn tả sự nhận biết trực tiếp rút ra từ quan sát.
- source_word: ἐγγὺς
  choice: gần
  rationale: Giữ nghĩa thời gian cơ bản của từ Hy Lạp.
- source_word: θέρος
  choice: mùa hè
  rationale: Cách gọi thông dụng, chính xác cho mùa được nói đến.
theological_decisions: []
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “anh em” phù hợp với lời Đức Chúa Jêsus nói cùng các môn đồ trong ngữ cảnh. Câu giữ cả hai sắc thái ἤδη bằng “đã” và “đã gần rồi” mà không làm lời văn nặng nề.
