- from: Khi chúng đã đâm chồi[a], chính anh em nhìn thấy và biết rằng mùa hè đã gần rồi.
  to: Khi chúng đã đâm chồi[a], anh em tự mình quan sát thì biết rằng mùa hè đã gần rồi.
  rationale: Chỉnh nhẹ cụm diễn đạt “nhìn thấy ... biết” để phản ánh rõ hơn βλέποντες ἀφ’ ἑαυτῶν là sự nhận biết dựa trên quan sát trực tiếp của người nghe. Giữ nguyên nghĩa, hai dấu hiệu thời gian “đã”, thuật ngữ thực vật, và văn phong tiếng Việt chuẩn hiện đại.
