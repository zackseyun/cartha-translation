id: LUK.21.11
reference: Luke 21:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: vi
  text: Sẽ có những trận động đất lớn; tại nhiều nơi sẽ có nạn đói và dịch bệnh[a]. Cũng sẽ có những điều kinh hoàng và những dấu lạ[b] lớn từ trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ôn dịch.” Từ Hy Lạp λοιμοί chỉ những đợt dịch hoặc bệnh dịch lan rộng.'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “điềm lạ,” nhất là khi hiểu theo sắc thái khải huyền.'
    reason: lexical_alternative
  - marker: c
    text: 'Hay: “từ bầu trời.” Từ Hy Lạp οὐρανός có thể chỉ thiên giới hoặc bầu trời, và cụm từ này có thể nói đến những hiện tượng thiên thể nhìn thấy được.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί τε μεγάλοι
  choice: những trận động đất lớn
  rationale: “Động đất” là nghĩa thông thường của σεισμός; “lớn” giữ nguyên sắc thái về quy mô hoặc mức độ nghiêm trọng của μεγάλοι.
- source_word: κατὰ τόπους
  choice: tại nhiều nơi
  rationale: Cụm này diễn tả sự phân bố theo nhiều địa điểm; cách nói này tự nhiên trong tiếng Việt và không hàm ý rằng mọi nơi đều xảy ra.
- source_word: λιμοὶ
  choice: nạn đói
  rationale: Từ này chỉ tình trạng đói kém nghiêm trọng, không chỉ là thiếu lương thực ở mức nhẹ.
- source_word: λοιμοὶ
  choice: dịch bệnh
  rationale: λοιμός chỉ dịch bệnh lan rộng hoặc ôn dịch; “dịch bệnh” rõ nghĩa và tự nhiên trong tiếng Việt hiện đại.
- source_word: φόβητρα
  choice: những điều kinh hoàng
  rationale: Danh từ số nhiều hiếm gặp này chỉ những sự vật hoặc biến cố gây khiếp sợ. “Những điều kinh hoàng” giữ được độ rộng nghĩa, không xác định chúng là cảnh tượng hay biến cố cụ thể.
- source_word: σημεῖα
  choice: những dấu lạ
  rationale: “Dấu lạ” chuyển tải ý nghĩa một hiện tượng có tính dấu hiệu mà không mặc nhiên giải thích cơ chế hay ý nghĩa của nó.
- source_word: ἀπ’ οὐρανοῦ
  choice: từ trời
  rationale: οὐρανός có thể chỉ trời theo nghĩa thiên giới hoặc bầu trời hữu hình. Từ “trời” trong tiếng Việt giữ được phần nào sự nhập nhằng đó.
- source_word: μεγάλα
  choice: lớn
  rationale: “Lớn” phản ánh trực tiếp tính từ Hy Lạp và tránh thêm ý “quyền năng” hoặc “siêu nhiên” vốn không được tính từ tự nó quy định.
- source_word: ἔσονται / ἔσται
  choice: sẽ có
  rationale: Cấu trúc hiện hữu ở thì tương lai được diễn đạt tự nhiên bằng “sẽ có” trong lời liệt kê các biến cố sắp xảy ra.
theological_decisions:
- issue: Ý nghĩa của οὐρανός trong văn cảnh khải huyền
  choice: từ trời
  alternative: từ bầu trời
  rationale: “Từ trời” duy trì khả năng chỉ nguồn gốc thuộc thiên giới lẫn các hiện tượng thấy được trên bầu trời, thay vì buộc câu chỉ mang một trong hai nghĩa.
- issue: Sắc thái của σημεῖα
  choice: dấu lạ
  alternative: điềm lạ
  rationale: “Dấu lạ” giữ nghĩa rộng của σημεῖον. “Điềm lạ” có thể phù hợp với văn cảnh khải huyền nhưng dễ nghiêng hơn về ý báo trước điềm lành hoặc dữ.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các danh từ quen thuộc với độc giả phổ thông. Dấu chấm phẩy và hai câu ngắn làm rõ hai nhóm trong cấu trúc Hy Lạp mà không làm mất nhịp liệt kê dồn dập. Các dấu chú thích được đặt ngay sau đúng từ ngữ liên quan và theo thứ tự xuất hiện.
