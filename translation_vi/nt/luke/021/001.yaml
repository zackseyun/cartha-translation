  terminology: Dùng “lễ vật” cho τὰ δῶρα phù hợp văn cảnh thờ phượng và giữ sắc thái trang trọng. Nên dùng “kho bạc” cho γαζοφυλάκιον trong thân bài, đồng thời giữ chú thích nêu khả năng từ này chỉ khu vực kho bạc của đền thờ hoặc các hòm nhận lễ vật. Cách này không áp đặt một trong hai cách hiểu đang được thảo luận.
