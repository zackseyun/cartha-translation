  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: vi
  text: Rồi Ngài ngước mắt lên và thấy những người giàu đang bỏ lễ vật của họ[a] vào kho bạc[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “quà tặng của họ.”
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp được dịch là “kho bạc” có thể chỉ khu vực kho bạc trong đền thờ hoặc các hòm dùng để nhận lễ vật.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: ngước mắt lên
  rationale: Diễn đạt cụ thể hành động nâng ánh nhìn, tự nhiên trong tiếng Việt và phù hợp với phân từ bất định quá khứ của ἀναβλέπω.
- source_word: δὲ
  choice: Rồi
  rationale: Thể hiện liên từ chuyển tiếp nhẹ trong diễn tiến câu chuyện mà không tạo sắc thái tương phản quá mức.
- source_word: εἶδεν
  choice: thấy
  rationale: Giữ nghĩa tri giác trực tiếp của động từ ὁράω, không thêm sắc thái diễn giải như “để ý thấy”.
- source_word: τοὺς βάλλοντας
  choice: những người… đang bỏ
  rationale: Danh hóa phân từ bằng “những người”; dịch βάλλω theo cách nói tự nhiên trong bối cảnh dâng lễ vật, thay vì dịch sát là “ném”.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: vào kho dâng hiến
  rationale: Cách dịch ngắn gọn, không thêm từ “đền thờ” vốn không xuất hiện trực tiếp trong câu; chú thích giữ lại phạm vi nghĩa có thể chỉ khu vực kho bạc hoặc các hòm tiếp nhận lễ vật.
- source_word: τὰ δῶρα αὐτῶν
  choice: lễ vật của họ
  rationale: Trong bối cảnh thờ phượng, “lễ vật” diễn đạt tự nhiên nghĩa của δῶρα là những gì được đem dâng; “của họ” phản ánh rõ đại từ αὐτῶν.
- source_word: πλουσίους
  choice: những người giàu
  rationale: Diễn đạt tính từ được dùng như danh từ, tự nhiên trong tiếng Việt và không làm thay đổi trọng tâm của câu.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để cung cấp chủ ngữ cần thiết trong tiếng Việt từ ngữ cảnh trước đó, vì câu Hy Lạp không nêu lại danh xưng. Giữ cách gọi “kho dâng hiến” tương đối rộng và giải thích bằng chú thích để không thu hẹp sự mơ hồ của γαζοφυλάκιον.
