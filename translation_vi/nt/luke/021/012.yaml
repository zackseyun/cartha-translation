revisions:
- from: Nhưng trước tất cả những điều ấy, người ta sẽ tra tay bắt các con[a] và bắt bớ các con; họ sẽ giao các con cho các hội đường và nhà tù, giải các con đến trước các vua và các tổng đốc vì danh ta.[b]
  to: Nhưng trước tất cả những điều đó, người ta sẽ ra tay bắt giữ các con[a] và bắt bớ các con, giao các con cho các hội đường và nhà tù; các con sẽ bị giải đến trước các vua và các tổng đốc vì danh ta.[b]
  rationale: Sửa “tra tay bắt” thành “ra tay bắt giữ” để dùng tiếng Việt hiện đại, rõ nghĩa hơn, trong khi chú thích bảo toàn hình ảnh thành ngữ Hy Lạp. Sửa vế cuối thành cấu trúc bị động “các con sẽ bị giải” để phản ánh chính xác ἀπαγομένους và duy trì bối cảnh pháp lý. Các thuật ngữ và hai điểm neo chú thích được giữ nguyên ý nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:35Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng trình tự thời gian, sự bắt giữ/bách hại, việc bị giao cho hội đường và nhà tù, bị giải ra trước các vua và tổng đốc, cùng lý do “vì danh ta”. Tuy nhiên, ἀπαγομένους là phân từ bị động, nên “họ sẽ ... giải các con” chưa phản ánh rõ việc các môn đồ là những người bị áp giải.
  naturalness: “Tra tay bắt” không phải cách nói hiện đại tự nhiên trong tiếng Việt phổ thông. “Ra tay bắt giữ” rõ và tự nhiên hơn; chú thích vẫn giữ được hình ảnh chữ nghĩa của thành ngữ Hy Lạp. Cấu trúc “các con sẽ bị giải đến trước” cũng tự nhiên và sát thể bị động của nguyên văn.
  terminology: “Bắt bớ,” “hội đường,” “nhà tù,” “các vua và các tổng đốc,” và “vì danh ta” đều phù hợp ngữ cảnh và truyền thống thuật ngữ Kinh Thánh. Giữ “danh ta” bảo toàn cách nói giàu hàm nghĩa của nguyên văn mà không diễn giải giáo phái.
  issues:
  - severity: medium
    issue: “Tra tay bắt” thiếu tự nhiên trong tiếng Việt hiện đại.
    rationale: Cụm này có thể gây cảm giác gượng hoặc bị hiểu theo một hành vi cụ thể khác; không phải tương đương thông dụng cho thành ngữ ἐπιβάλλειν τὰς χεῖρας. “Ra tay bắt giữ” diễn đạt rõ hành động thù nghịch; chú thích cung cấp hình ảnh sát nghĩa.
  - severity: medium
    issue: “Họ sẽ ... giải các con” làm mờ thể bị động của ἀπαγομένους.
