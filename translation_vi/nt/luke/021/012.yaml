id: LUK.21.12
reference: Luke 21:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: vi
  text: Nhưng trước tất cả những điều đó, người ta sẽ ra tay bắt giữ các con[a] và bắt bớ các con, giao các con cho các hội đường và nhà tù; các con sẽ bị giải đến trước các vua và các tổng đốc vì danh ta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đặt tay trên các con,” một thành ngữ chỉ việc bắt giữ hoặc ngược đãi với thái độ thù nghịch.'
    reason: lexical_alternative
  - marker: b
    text: “Vì danh ta” cũng có thể dịch là “vì cớ danh ta” hoặc diễn ý là “vì ta.” Bản văn chính giữ cách nói Kinh Thánh, trong đó “danh” gắn với chính thân vị và thẩm quyền của Chúa Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Nhưng trước tất cả những điều ấy
  rationale: πρό với sở hữu cách chỉ sự xảy ra trước về thời gian; δέ đánh dấu chuyển ý tương phản, còn πάντων được giữ bằng “tất cả”.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: người ta sẽ tra tay bắt các con
  rationale: Thành ngữ Hy Lạp có hình ảnh sát nghĩa là “đặt tay trên,” nhưng trong ngữ cảnh này chỉ hành động bắt giữ đầy thù nghịch. “Tra tay bắt” vừa giữ được phần nào hình ảnh vừa tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: διώξουσιν
  choice: bắt bớ
  rationale: Trong bối cảnh các môn đồ bị chống đối vì danh Chúa Giê-su, từ này mang nghĩa ngược đãi, bách hại chứ không chỉ đuổi theo.
- source_word: παραδιδόντες
  choice: họ sẽ giao
  rationale: Phân từ nêu cách thức hoặc diễn tiến của sự bắt bớ. Chuyển thành mệnh đề phối hợp giúp câu tiếng Việt tự nhiên mà vẫn giữ sắc thái bị trao nộp cho các thiết chế có thẩm quyền.
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: cho các hội đường và nhà tù
  rationale: “Hội đường” giữ nguyên thiết chế Do Thái; cụm từ có thể hàm ý giới chức hoặc việc xét xử tại đó nhưng bản dịch không diễn giải thêm. “Nhà tù” chỉ nơi giam giữ.
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: giải các con đến trước các vua và các tổng đốc
  rationale: ἀπάγω ở thể bị động mô tả việc bị áp giải; trong tiếng Việt, cấu trúc chủ động với chủ thể tiếp nối “họ” là tự nhiên. “Đến trước” thể hiện việc phải ra trước nhà cầm quyền, có sắc thái pháp lý.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: vì danh ta
  rationale: Giữ cách nói Kinh Thánh “danh ta,” trong đó “danh” gắn với chính thân vị và thẩm quyền của Chúa Giê-su, thay vì thu hẹp thành một lời diễn giải.
theological_decisions:
- issue: Ý nghĩa của “danh ta” trong bối cảnh bị bắt bớ
  choice: Giữ nguyên cách nói “vì danh ta.”
  alternative: vì ta; vì các con thuộc về ta
  rationale: τοῦ ὀνόματός μου có chiều sâu thần học, liên hệ danh Chúa Giê-su với thân vị và thẩm quyền của Ngài. Giữ nguyên cách diễn đạt bảo toàn âm hưởng Kinh Thánh và không áp đặt một cách giải nghĩa hẹp.
- issue: Chủ thể không xác định của các hành động thù nghịch
  choice: Dùng “người ta” ở đầu câu, sau đó dùng “họ.”
  alternative: họ
  rationale: Động từ số nhiều trong tiếng Hy Lạp không nêu rõ chủ thể. “Người ta” bảo toàn tính không xác định; “họ” nối tiếp tự nhiên mà không xác định một nhóm cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các con” phù hợp lời Chúa Giê-su nói trực tiếp với các môn đồ; dùng “ta” để giữ giọng uy nghi nhưng không cổ hóa quá mức. “Tra tay bắt” và “giải đến trước” truyền đạt rõ bối cảnh bắt giữ và xét xử.
