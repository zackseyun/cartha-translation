  terminology: Giữ “anh em” cho nhóm môn đồ và “vương quốc Đức Chúa Trời” cho ἡ βασιλεία τοῦ θεοῦ là nhất quán, dễ hiểu, và không diễn giải cụm từ theo một lập trường thần học cụ thể.
