  to: Cũng vậy, khi anh em thấy những điều ấy đang xảy ra, hãy biết rằng vương quốc Đức Chúa Trời ở gần.[a]
  rationale: Đổi bản văn chính từ “đã đến gần” sang “ở gần” để phản ánh trực tiếp hơn ἐγγύς ἐστιν, đồng thời giữ “đã đến gần” như một phương án diễn đạt hợp lệ trong chú thích. Không thay đổi quy chiếu, sắc thái cánh chung, hay thuật ngữ thần học của câu.
