source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: vi
  text: Cũng vậy, khi anh em thấy những điều ấy đang xảy ra, hãy biết rằng vương quốc Đức Chúa Trời ở gần.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vương quốc Đức Chúa Trời đã đến gần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Cũng vậy
  rationale: Diễn đạt tự nhiên sự áp dụng phép so sánh ở câu trước. Đại từ ὑμεῖς được thể hiện trong chủ ngữ “anh em” của mệnh đề kế tiếp, tránh cách nhấn mạnh gượng gạo.
- source_word: ὅταν ἴδητε
  choice: khi anh em thấy
  rationale: ὅταν với động từ giả định aorist chỉ một tình huống tương lai; “khi ... thấy” vừa tự nhiên vừa giữ sắc thái dự báo.
- source_word: ταῦτα γινόμενα
  choice: những điều ấy đang xảy ra
  rationale: Giữ đại từ chỉ định quy chiếu về các dấu hiệu vừa nêu; “đang xảy ra” thể hiện rõ các biến cố diễn tiến mà không dùng lối văn cổ.
- source_word: γινώσκετε
  choice: hãy biết
  rationale: Thể mệnh lệnh hiện tại kêu gọi người nghe nhận biết ý nghĩa của các dấu hiệu; “hãy biết” trực tiếp và trang trọng.
- source_word: ἐγγύς ἐστιν
  choice: đã đến gần
  rationale: Thành ngữ tiếng Việt tự nhiên để diễn tả sự gần kề. Từ “đã” gắn với việc nhận thấy các dấu hiệu, nhưng không xác định cụ thể thời điểm hoàn tất.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: “Vương quốc” bảo lưu cả phạm vi lẫn quyền trị vì, không thu hẹp cụm từ thành riêng một nghĩa. “Đức Chúa Trời” là cách gọi trang trọng, quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἡ βασιλεία τοῦ θεοῦ trong bối cảnh cánh chung
  choice: Giữ cụm “vương quốc Đức Chúa Trời” mà không diễn giải thêm.
  alternative: quyền trị vì của Đức Chúa Trời
  rationale: Bản văn nói vương quốc gần kề nhưng không xác định đây chủ yếu là sự hiển lộ, hoàn tất hay minh chứng. Cách dịch này giữ nguyên độ mở và sự căng thẳng thần học của nguyên văn.
- issue: Sắc thái thời gian của ἐγγύς ἐστιν
  choice: đã đến gần
  alternative: ở gần / gần rồi
  rationale: Không thêm một mốc thời gian hay cách hiểu cánh chung cụ thể; chú thích nêu phương án sát cấu trúc trạng thái của tiếng Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho ngôi thứ hai số nhiều trong lời Chúa Giê-su nói với các môn đồ; tránh lối diễn đạt quá cổ và không giải quyết thay bản văn các tranh luận cánh chung.
