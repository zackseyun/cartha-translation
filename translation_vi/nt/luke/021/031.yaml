    rationale: Cụm Hy Lạp dùng ἐγγύς với động từ “là,” nghĩa trực tiếp là “ở/gần.” “Đã đến gần” có thể là một cách diễn đạt tiếng Việt khả dĩ, nhưng thêm sắc thái sự đến gần như một diễn tiến đã xảy ra; nên để ở chú thích thay vì bản văn chính.
