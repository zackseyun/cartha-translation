  text: And not a hair from your head will perish[a].
translation:
  language: vi
  text: Và không một sợi tóc nào trên đầu anh em chắc chắn sẽ mất đi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “không một sợi tóc nào trên đầu anh em sẽ hề mất đi”; tiếng Hy Lạp dùng οὐ μή, một cấu trúc phủ định nhấn mạnh, để diễn tả lời bảo đảm chắc chắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Dù ... cũng
  rationale: Trong mạch văn, καί nối lời bảo đảm này với lời báo trước rằng một số môn đồ sẽ bị giết. Cách diễn đạt tiếng Việt “Dù... cũng” làm câu tự nhiên và giữ được sự căng thẳng trong ngữ cảnh mà không biến liên từ thành một sự đối lập quá mạnh.
- source_word: θρὶξ
  choice: một sợi tóc
  rationale: Danh từ số ít được chuyển tự nhiên sang tiếng Việt là “một sợi tóc”, giữ hình ảnh cụ thể và tính thành ngữ về sự bảo toàn trọn vẹn.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: trên đầu anh em
  rationale: “Trên đầu anh em” là cách nói tự nhiên trong tiếng Việt cho ý một sợi tóc thuộc về hoặc rơi khỏi đầu; “anh em” biểu thị số nhiều của ὑμῶν và có sắc thái trang trọng, gần gũi.
- source_word: οὐ μὴ
  choice: chắc chắn không
  rationale: Cụm phủ định kép với động từ ở thể giả định aorist diễn tả lời phủ định đặc biệt mạnh; “chắc chắn không” truyền đạt lực nhấn này rõ ràng trong tiếng Việt hiện đại.
- source_word: ἀπόληται
  choice: bị mất
  rationale: Trong hình ảnh về một sợi tóc, “bị mất” tự nhiên hơn “bị hủy diệt” hay “diệt vong”, đồng thời vẫn giữ trường nghĩa mất đi của ἀπόλλυμι và không giải thích quá mức bản chất của sự bảo toàn.
theological_decisions:
- issue: Sự căng thẳng biểu kiến với lời báo trước ngay trước đó rằng một số môn đồ sẽ bị giết
  choice: Giữ nguyên lời bảo đảm tuyệt đối bằng hình ảnh thành ngữ, không thêm lời giải thích rằng đây chỉ là sự bảo toàn thuộc linh hay tối hậu.
  alternative: Hiểu theo nghĩa đen rằng các môn đồ hoàn toàn không chịu tổn hại thể chất, hoặc diễn giải rõ trong câu rằng linh hồn họ sẽ được bảo toàn.
  rationale: Bản văn Hy Lạp đặt lời bảo đảm mạnh này cạnh lời tiên báo về bách hại và cái chết. Bản dịch nên bảo tồn sự căng thẳng ấy thay vì âm thầm giải quyết theo một cách diễn giải thần học riêng.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Anh em” phù hợp lời Đức Chúa Jêsus nói với nhiều môn đồ. Cấu trúc “Dù... cũng” giúp câu đứng tự nhiên trong mạch văn; chú thích ghi nhận hình thức sát hơn và lực nhấn của phủ định kép.
