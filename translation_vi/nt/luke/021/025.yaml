source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: vi
  text: Sẽ có những dấu lạ trên mặt trời, mặt trăng và các ngôi sao; và trên đất, các dân tộc sẽ khốn đốn, hoang mang trước tiếng gầm của biển và sự cuộn trào.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “... trong cảnh bối rối trước tiếng biển và sự cuộn trào.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: những dấu lạ
  rationale: Diễn đạt nghĩa rộng của các hiện tượng mang ý nghĩa báo hiệu mà không thu hẹp thành điềm dữ.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: nơi mặt trời, mặt trăng và các ngôi sao
  rationale: “Nơi” tự nhiên trong tiếng Việt và giữ phạm vi vị trí của ἐν, không giải thích bản chất các hiện tượng.
- source_word: συνοχὴ ἐθνῶν
  choice: các dân tộc sẽ khốn quẫn
  rationale: Chuyển danh ngữ Hy Lạp thành mệnh đề tự nhiên trong tiếng Việt; “khốn quẫn” giữ sắc thái bị dồn ép và đau khổ.
- source_word: ἐν ἀπορίᾳ
  choice: hoang mang
  rationale: Thể hiện trạng thái bối rối, không biết lối thoát; phối hợp tự nhiên với “khốn quẫn”.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: trước tiếng biển gầm và sóng cuộn
  rationale: Giữ cả âm thanh dữ dội của biển và sự cuộn trào; “trước” bảo tồn khả năng hiểu là phản ứng trước hiện tượng, thay vì khẳng định quan hệ nhân quả mạnh hơn nguyên văn.
theological_decisions:
- issue: Bản chất của các hiện tượng vũ trụ
  choice: Dịch thẳng là các dấu lạ nơi các thiên thể, không xác định đó là hiện tượng thiên văn theo nghĩa đen, hình ảnh biểu tượng hay cả hai.
  alternative: Giải thích rõ là biến động vũ trụ theo nghĩa đen hoặc biểu tượng chính trị.
  rationale: Câu Hy Lạp không giải quyết vấn đề diễn giải này; bản dịch cần giữ nguyên độ mở và sức căng cánh chung.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “dấu lạ” theo ngôn ngữ Kinh Thánh phổ thông; “biển gầm” và “sóng cuộn” tạo hình ảnh tự nhiên mà không diễn giải quá mức.
