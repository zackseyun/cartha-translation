source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: vi
  text: “Còn những điều anh em đang ngắm nhìn đây[a], sẽ đến những ngày mà không một hòn đá nào còn trên hòn đá khác mà không bị phá đổ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Còn những điều anh em thấy đây.” Động từ Hy Lạp có thể chỉ việc thấy nói chung hoặc ngắm nhìn, quan sát.'
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “sẽ không còn hòn đá nào trên hòn đá nào mà không bị phá đổ”—một cách nói nhấn mạnh sự phá hủy hoàn toàn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Còn những điều anh em đang ngắm nhìn đây
  rationale: “Còn” thể hiện chức năng nêu chủ đề của Ταῦτα được đưa lên đầu câu; “đang ngắm nhìn” giữ sắc thái quan sát chăm chú và thể hiện thể hiện tại của θεωρεῖτε. “Đây” làm rõ các sự vật đang ở trước mắt mà không thêm một đối tượng không có trong câu.
- source_word: ἐλεύσονται ἡμέραι
  choice: sẽ có những ngày
  rationale: Đây là cách diễn đạt tự nhiên trong tiếng Việt cho thành ngữ chỉ thời điểm tương lai đang đến, đồng thời giữ danh từ số nhiều không có mạo từ xác định.
- source_word: ἐν αἷς
  choice: (được thể hiện bằng cấu trúc) sẽ có những ngày không…
  rationale: Quan hệ thời gian được lồng tự nhiên vào cấu trúc tiếng Việt; dịch máy móc là “trong những ngày ấy” sẽ nặng nề hơn mà không thêm nội dung.
- source_word: οὐκ ἀφεθήσεται
  choice: không … nào còn nằm
  rationale: Trong bối cảnh công trình bị phá hủy, thể bị động mang nghĩa không được để lại hoặc không còn nguyên tại chỗ. “Còn nằm” kết hợp tự nhiên với hình ảnh đá chồng trên đá.
- source_word: λίθος ἐπὶ λίθῳ
  choice: không một hòn đá nào còn nằm trên hòn đá khác
  rationale: Giữ hình ảnh cụ thể của nguyên văn và diễn đạt tự nhiên thành ngữ chỉ sự phá hủy hoàn toàn.
- source_word: ὃς οὐ καταλυθήσεται
  choice: tất cả đều sẽ bị phá đổ
  rationale: Mệnh đề quan hệ Hy Lạp có tác dụng nhấn mạnh tính toàn diện. Tách thành vế “tất cả đều” tránh một chuỗi phủ định khó hiểu trong tiếng Việt, trong khi “bị phá đổ” giữ ý công trình bị tháo phá.
theological_decisions:
- issue: Phạm vi và sức nặng của lời tiên báo về các công trình đền thờ
  choice: Trình bày như lời tiên báo cụ thể về sự phá hủy hoàn toàn các công trình đang được nhìn thấy.
  alternative: Hiểu chủ yếu theo nghĩa biểu tượng hoặc gắn câu này với một hệ thống cánh chung cụ thể.
  rationale: Bản Hy Lạp nói trực tiếp về những hòn đá bị phá đổ. Bản dịch giữ sức nặng cụ thể ấy nhưng không thêm thời điểm, tác nhân hay khuôn khổ giáo lý mà câu này không nêu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” phù hợp lời Chúa Giê-su nói với nhóm người nghe trong văn mạch; giữ hình ảnh đá trên đá và tránh thuật ngữ thần học chuyên biệt.
