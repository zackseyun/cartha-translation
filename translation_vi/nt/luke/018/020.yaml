revisions:
- from: 'Ngươi biết các điều răn: Chớ ngoại tình[a], chớ giết người, chớ trộm cắp, chớ làm chứng dối; hãy hiếu kính cha mẹ mình.'
  to: 'Bạn biết các điều răn: Đừng ngoại tình, đừng giết người, đừng trộm cắp, đừng làm chứng gian; hãy tôn kính cha và mẹ của anh.'
  rationale: Sửa bản dịch sang tiếng Việt chuẩn hiện đại, đồng thời giữ nguyên nội dung, trật tự và lực mệnh lệnh của tiếng Hy Lạp. “Tôn kính” phản ánh trực tiếp τιμάω; “cha và mẹ” giữ rõ hai đối tượng được nêu trong nguồn. Không cần chú thích vì không có biến thể văn bản hay lựa chọn từ vựng gây tranh chấp cần đánh dấu.
  reviewer_model: gpt-5.6-terra
