source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: vi
  text: 'Bạn biết các điều răn: Đừng ngoại tình, đừng giết người, đừng trộm cắp, đừng làm chứng gian; hãy tôn kính cha và mẹ của anh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: các điều răn
  rationale: Trong ngữ cảnh Đức Giê-su dẫn các mệnh lệnh quen thuộc của Mười Điều Răn, “các điều răn” giữ được sắc thái thẩm quyền và liên văn bản.
- source_word: οἶδας
  choice: ngươi biết
  rationale: Dù οἶδα có hình thức hoàn thành, từ này mang nghĩa hiện tại trong tiếng Hy Lạp Koinē; “biết” là cách diễn đạt tự nhiên và chính xác.
- source_word: Μὴ μοιχεύσῃς
  choice: Chớ ngoại tình
  rationale: μοιχεύω chỉ hành vi ngoại tình; “chớ” truyền đạt gọn và trang trọng sức mạnh của lời cấm trong Mười Điều Răn.
- source_word: Μὴ φονεύσῃς
  choice: chớ giết người
  rationale: φονεύω nói đến việc cố ý giết một người, không phải mọi hành vi làm chết nói chung; “giết người” là cách nói tự nhiên trong tiếng Việt và tránh mở rộng quá mức phạm vi của điều cấm.
- source_word: Μὴ κλέψῃς
  choice: chớ trộm cắp
  rationale: κλέπτω có nghĩa trực tiếp là lấy trộm; “trộm cắp” là cách diễn đạt rõ ràng, quen thuộc trong tiếng Việt.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: chớ làm chứng dối
  rationale: Cách dịch này giữ cả ý làm chứng sai sự thật lẫn âm hưởng quen thuộc của điều răn, thay vì thu hẹp vào một bối cảnh pháp đình hiện đại.
- source_word: Τίμα
  choice: hãy hiếu kính
  rationale: τιμάω ở đây đòi hỏi dành sự tôn kính thích đáng cho cha mẹ. “Hiếu kính” là cách diễn đạt tự nhiên, trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: cha mẹ mình
  rationale: Tiếng Hy Lạp nêu riêng cha và mẹ, còn “cha mẹ mình” diễn đạt đầy đủ cả hai một cách tự nhiên trong tiếng Việt; “mình” quy chiếu về người đang được Đức Giê-su nói với.
theological_decisions:
- issue: Hình thức diễn đạt các lời cấm của Mười Điều Răn
  choice: Dùng “Chớ ...”
  alternative: Dùng “Đừng ...” hoặc “Ngươi không được ...”
  rationale: “Chớ” vừa truyền đạt đúng lực cấm của μή với động từ giả định aorist, vừa giữ âm hưởng điều răn mà không dùng cấu trúc cổ tối nghĩa; đây là quyết định về văn phong, không phải giải thích giáo lý.
- issue: Phạm vi của φονεύω
  choice: Dịch là “giết người”
  alternative: Dịch là “giết” hoặc “sát nhân”
  rationale: “Giết người” phản ánh đối tượng con người hàm chứa trong động từ và không biến điều răn thành lời cấm mọi trường hợp gây chết; đồng thời tự nhiên hơn danh từ pháp lý “sát nhân” trong một mệnh lệnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ngươi” phù hợp lời nói trực tiếp với một người và giữ sắc thái Kinh Thánh; “chớ” bảo tồn nhịp điệu điều răn. Dấu chấm phẩy tách bốn lời cấm khỏi mệnh lệnh tích cực cuối câu.
