source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: vi
  text: Ngay lập tức, anh thấy được[a] và đi theo Ngài, tôn vinh Đức Chúa Trời. Toàn thể dân chúng thấy vậy thì dâng lời ca ngợi Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lại nhìn thấy” hoặc “được sáng mắt”. Động từ Hy Lạp có thể chỉ việc có lại khả năng nhìn thấy; ở đây chọn “thấy được” vì tự nhiên và không khẳng định rằng trước kia anh từng nhìn thấy.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Ngay lập tức
  rationale: Diễn đạt rõ ý sự việc xảy ra không chút trì hoãn, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀνέβλεψεν
  choice: anh thấy được
  rationale: Trong bối cảnh chữa lành người mù, động từ chỉ việc có lại hoặc nhận được khả năng nhìn thấy. “Thấy được” tự nhiên và không khẳng định quá mức rằng trước kia anh từng sáng mắt.
- source_word: ἠκολούθει
  choice: đi theo Ngài
  rationale: Thì chưa hoàn thành gợi hành động đang tiếp diễn; trong văn kể chuyện tiếng Việt, “đi theo” diễn đạt tự nhiên ý ấy mà không cần thêm từ nặng nề.
- source_word: δοξάζων
  choice: tôn vinh
  rationale: Giữ sắc thái dành vinh hiển cho Đức Chúa Trời và phân biệt với αἶνον ở cuối câu.
- source_word: λαός
  choice: dân chúng
  rationale: Chỉ toàn thể những người hiện diện như một tập thể; “dân chúng” phù hợp hơn “đám đông” với từ λαός.
- source_word: ἰδὼν
  choice: thấy vậy
  rationale: Đối tượng của việc thấy không được nói thẳng trong Hy Lạp; “vậy” quy chiếu tự nhiên đến việc chữa lành và phản ứng vừa kể mà không thu hẹp vào một chi tiết duy nhất.
- source_word: ἔδωκεν αἶνον
  choice: dâng lời ca ngợi
  rationale: Phản ánh cấu trúc “trao/dâng sự ca ngợi” của nguyên văn, đồng thời là cách nói tự nhiên khi hướng về Đức Chúa Trời.
- source_word: θεόν / θεῷ
  choice: Đức Chúa Trời
  rationale: Danh xưng phổ thông, trang trọng trong tiếng Việt Kinh Thánh; giữ nguyên cả hai lần xuất hiện để bảo toàn điểm nhấn của câu.
- source_word: αὐτῷ
  choice: Ngài
  rationale: Đại từ quy chiếu đến Chúa Giê-su; viết hoa thể hiện lối xưng hô kính trọng quen thuộc trong tiếng Việt mà không thêm danh xưng không có trong nguyên văn.
theological_decisions:
- issue: Sắc thái tiếp diễn của việc đi theo Chúa Giê-su
  choice: đi theo Ngài
  alternative: đang đi theo Ngài
  rationale: ἠκολούθει là thì chưa hoàn thành và có thể nhấn mạnh hành động tiếp diễn. Tuy nhiên, tiếng Việt kể chuyện thường không cần đánh dấu bằng “đang”; bản dịch giữ ý đi theo như phản ứng kéo dài mà không biến sắc thái thể thành một khẳng định thần học mạnh hơn.
- issue: Đối tượng ngầm của ἰδών
  choice: thấy vậy
  alternative: thấy việc ấy
  rationale: Nguyên văn không có đại từ chỉ đối tượng. “Thấy vậy” bảo toàn độ rộng quy chiếu, có thể bao gồm cả sự chữa lành lẫn việc người ấy đi theo và tôn vinh Đức Chúa Trời.
- issue: Sự phân biệt giữa δοξάζων và αἶνον
  choice: tôn vinh ... dâng lời ca ngợi
  alternative: ca ngợi ... ca ngợi
  rationale: Dùng hai cách diễn đạt khác nhau giữ được sự phân biệt từ vựng của nguyên văn, đồng thời không tạo ra khác biệt thần học giả tạo giữa phản ứng của người được chữa lành và của dân chúng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh” cho người được chữa lành theo ngữ cảnh người trưởng thành; dùng “Ngài” để quy chiếu kính trọng đến Chúa Giê-su. Cấu trúc câu gọn, bảo toàn hai lần nhắc đến Đức Chúa Trời và phân biệt “tôn vinh” với “dâng lời ca ngợi”.
