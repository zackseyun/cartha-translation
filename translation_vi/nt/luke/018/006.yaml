  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: vi
  text: 'Chúa phán: “Hãy nghe điều vị thẩm phán bất chính nói.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: phán
  rationale: Động từ aorist λέγω mở lời trực tiếp. Khi chủ ngữ là “Chúa”, “phán” là cách diễn đạt tiếng Việt tự nhiên, trang trọng mà không thêm nội dung.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ nối tiếp mạch kể; trong tiếng Việt, sự tiếp nối đã được thể hiện tự nhiên qua câu kế tiếp, còn thêm “và” hoặc “bấy giờ” ở đây dễ gượng hoặc gán sắc thái thời gian.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Trong văn mạch Lu-ca, danh xưng này chỉ về Đức Giê-su và mang trọng lượng tước hiệu; “Chúa” giữ được sắc thái ấy.
- source_word: Ἀκούσατε
  choice: Hãy nghe
  rationale: Mệnh lệnh aorist kêu gọi người nghe chú ý đến lời sắp được trích dẫn; “Hãy nghe” ngắn gọn và giữ nguyên lực mệnh lệnh.
- source_word: τί
  choice: điều
  rationale: τί chỉ nội dung lời vị quan tòa nói; cấu trúc “nghe điều ... nói” tự nhiên trong tiếng Việt.
- source_word: ὁ κριτὴς
  choice: viên quan tòa
  rationale: Chỉ nhân vật quan tòa đã được nhắc đến trong dụ ngôn; “viên quan tòa” là cách gọi rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: τῆς ἀδικίας
  choice: bất chính
  rationale: Cụm sở hữu cách mang tính phẩm chất, sát nghĩa đen là “của sự bất chính/bất công”. “Bất chính” giữ phạm vi đạo đức rộng của ἀδικία, thay vì chỉ giới hạn vào việc xét xử thiếu công bằng.
- source_word: λέγει
  choice: nói
  rationale: Thì hiện tại tạo tính sống động; tiếng Việt không biến đổi thì ở động từ, và “nói” truyền đạt tự nhiên nội dung được dẫn.
theological_decisions:
- issue: Cách dịch κύριος khi chỉ về Đức Giê-su
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” bảo toàn trọng lượng tước hiệu trong lời kể của Lu-ca mà không đưa thêm khẳng định thần học ngoài văn bản.
- issue: Sắc thái của τῆς ἀδικίας
  choice: bất chính
  alternative: bất công
  rationale: “Bất chính” giữ được chiều kích đạo đức rộng của ἀδικία; “bất công” cũng hợp ngữ cảnh pháp lý nhưng có thể thu hẹp nghĩa vào sự thiếu công bằng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không dùng chú thích vì bản dịch chính “bất chính” thể hiện đầy đủ phẩm chất đạo đức của cụm Hy Lạp; cấu trúc sở hữu cách nguyên văn không cần tái tạo máy móc trong câu chính.
