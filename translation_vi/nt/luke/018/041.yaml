id: LUK.18.41
reference: Luke 18:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: vi
  text: '“Anh muốn tôi làm gì cho anh?” Người ấy đáp: “Lạy Chúa[a], xin cho tôi được thấy lại[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thưa Ngài”; từ Hy Lạp κύριε có thể là một cách xưng hô kính trọng, dù “Chúa” là cách dịch mặc định của dự án đối với κύριος.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “được sáng mắt lại” hoặc “lấy lại thị lực.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: gì
  rationale: Đại từ nghi vấn hỏi về điều cụ thể người ấy muốn Đức Giê-su làm; “gì” là cách diễn đạt tự nhiên, không mang nghĩa nguyên nhân như “tại sao”.
- source_word: σοι
  choice: cho anh
  rationale: Dữ cách với ποιήσω mang ý nghĩa thụ hưởng; tiếng Việt tự nhiên dùng “cho anh”.
- source_word: θέλεις
  choice: anh muốn
  rationale: θέλω diễn tả ý muốn; “muốn” là từ hiện đại, rõ ràng và phù hợp với lời đối thoại trực tiếp.
- source_word: ποιήσω
  choice: tôi làm
  rationale: Động từ ποιέω ở đây có nghĩa “làm”; cấu trúc cả câu được chuyển tự nhiên thành “Anh muốn tôi làm gì cho anh?”
- source_word: ὁ δὲ εἶπεν
  choice: Người ấy đáp
  rationale: δέ chỉ sự nối tiếp nhẹ trong lời kể, không nhất thiết mang nghĩa đối lập; “đáp” tự nhiên vì đây là câu trả lời cho câu hỏi vừa nêu.
- source_word: Κύριε
  choice: Lạy Chúa
  rationale: Giữ cách dịch mặc định của κύριος là “Chúa” khi trực tiếp thưa với Đức Giê-su. “Lạy” tạo lời xưng hô khẩn cầu tự nhiên trong tiếng Việt, còn chú thích bảo lưu khả năng đây chỉ là cách gọi kính trọng.
- source_word: ἵνα
  choice: xin cho
  rationale: ἵνα giới thiệu nội dung điều cầu xin; “xin cho” chuyển tải chức năng ấy tự nhiên hơn một cấu trúc mục đích cứng nhắc trong tiếng Việt.
- source_word: ἀναβλέψω
  choice: tôi được thấy lại
  rationale: Trong bối cảnh chữa lành, ἀναβλέπω thường có nghĩa lấy lại khả năng nhìn. “Được thấy lại” ngắn gọn và giữ rõ yếu tố “lại”.
theological_decisions:
- issue: Cách dịch κύριος trong lời trực tiếp thưa với Đức Giê-su
  choice: Lạy Chúa
  alternative: Thưa Ngài
  rationale: “Chúa” bảo lưu khả năng từ này có ý nghĩa Kitô học, nhưng chú thích cũng giữ cách hiểu như một lối xưng hô kính trọng, không buộc câu nói chỉ mang một sắc thái thần học.
translation_notes:
  register: Văn phong đối thoại hiện đại, trang trọng vừa phải và dễ hiểu. Cặp đại từ “anh—tôi” trong câu hỏi tránh lối xưng hô cổ, còn “Lạy Chúa” phản ánh lời khẩn cầu trang trọng. Hai chú thích bảo lưu cả độ mở của κύριε và các sắc thái hợp lệ của ἀναβλέψω.
