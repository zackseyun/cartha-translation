  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: vi
  text: 'Ông không chịu làm việc ấy trong một thời gian. Nhưng sau đó, ông tự nhủ: ‘Dù ta không kính sợ Đức Chúa Trời, cũng chẳng nể nang ai,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελεν
  choice: không chịu làm việc ấy
  rationale: Động từ ở thì chưa hoàn thành diễn tả thái độ không muốn kéo dài; thêm “làm việc ấy” để tiếng Việt tự nhiên và nối rõ với lời cầu xin ở câu trước, không hàm ý ông vĩnh viễn khước từ.
- source_word: ἐπὶ χρόνον
  choice: trong một thời gian
  rationale: Diễn đạt một khoảng thời gian không xác định, không thêm độ dài ngoài bản nguồn.
- source_word: μετὰ ταῦτα δὲ
  choice: Nhưng sau đó
  rationale: Giữ cả trình tự thời gian lẫn sắc thái chuyển hướng nhẹ của δέ.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: ông tự nhủ
  rationale: Cách nói tự nhiên trong tiếng Việt để diễn tả lời nói nội tâm.
- source_word: Εἰ καὶ
  choice: Dù
  rationale: Ở đây là kết cấu nhượng bộ, không phải điều kiện chưa chắc có thật.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: ta không kính sợ Đức Chúa Trời
  rationale: “Kính sợ” giữ được thành ngữ Kinh Thánh về thái độ đối với Đức Chúa Trời, gồm cả sự kính reverence lẫn ý thức sợ Ngài.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: cũng chẳng nể nang ai
  rationale: ἐντρέπομαι trong ngữ cảnh chỉ việc có sự kiêng nể hoặc lưu tâm đến người khác; “ai” diễn đạt tự nhiên danh từ số ít ἄνθρωπον dùng theo nghĩa khái quát.
theological_decisions:
- issue: Ý nghĩa của việc “kính sợ Đức Chúa Trời”
  choice: kính sợ Đức Chúa Trời
  alternative: sợ Đức Chúa Trời
  rationale: Giữ cách diễn đạt quen thuộc của Kinh Thánh mà không thu hẹp nghĩa thành nỗi sợ hãi đơn thuần.
- issue: Danh từ số ít khái quát ἄνθρωπον
  choice: ai
  alternative: con người
  rationale: Trong tiếng Việt, “chẳng nể nang ai” truyền đạt tự nhiên ý nghĩa khái quát của danh từ số ít và không làm thay đổi sự đối lập giữa Đức Chúa Trời với con người.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” theo mạch kể về vị thẩm phán; trong độc thoại dùng “ta”. Câu được để mở ở cuối vì lời nói trực tiếp tiếp tục sang câu 5.
