- from: 'Khi nghe vậy, Đức Giê-su nói với ông: “Ông vẫn còn thiếu một điều: hãy bán tất cả những gì ông có, phân phát cho người nghèo, thì ông sẽ có kho báu trên trời; rồi hãy đến theo tôi.”'
  to: 'Khi nghe vậy, Đức Giê-su nói với ông: “Ông vẫn còn thiếu một điều: hãy bán tất cả những gì ông có, phân phát cho người nghèo, thì ông sẽ có kho báu trên trời; rồi hãy đến và theo tôi.”'
