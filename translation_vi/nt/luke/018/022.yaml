source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: vi
  text: 'Khi nghe vậy, Đức Giê-su nói với ông: “Ông vẫn còn thiếu một điều: hãy bán tất cả những gì ông có, phân phát cho người nghèo, thì ông sẽ có kho báu trên trời; rồi hãy đến và theo tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Khi nghe vậy, Đức Giê-su
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên trong tiếng Việt; “vậy” nối với lời vừa nói ở ngữ cảnh trước, còn δέ không cần được dịch riêng.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Ông vẫn còn thiếu một điều
  rationale: Diễn đạt tự nhiên nghĩa của λείπει và giữ trọng tâm vào một điều còn thiếu; cách xưng hô “ông” phù hợp với người đàn ông trưởng thành trong ngữ cảnh.
- source_word: πάντα ὅσα ἔχεις
  choice: tất cả những gì ông có
  rationale: Thể hiện đầy đủ tính bao quát của πάντα ὅσα bằng tiếng Việt hiện đại, rõ ràng.
- source_word: πώλησον
  choice: hãy bán
  rationale: Mệnh lệnh trực tiếp, dứt khoát, tương ứng với thể mệnh lệnh bất định quá khứ.
- source_word: διάδος πτωχοῖς
  choice: phân phát cho người nghèo
  rationale: “Phân phát” giữ sắc thái phân chia, phân phối của διαδίδωμι rõ hơn từ “cho” chung chung, đồng thời không tự ý thêm “tiền thu được” vốn không được nêu trực tiếp.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: ông sẽ có kho báu trên trời
  rationale: “Kho báu” là cách tương ứng tự nhiên với θησαυρός; “trên trời” là thành ngữ tiếng Việt tự nhiên dù nguyên văn dùng dạng số nhiều οὐρανοῖς.
- source_word: δεῦρο ἀκολούθει μοι
  choice: rồi hãy đến theo tôi
  rationale: “Đến” thể hiện lời gọi hướng về Đức Giê-su của δεῦρο, còn “theo tôi” truyền đạt tự nhiên mệnh lệnh tiếp diễn ἀκολούθει μοι; “rồi” làm rõ trình tự mà không giảm sức mạnh của lời gọi.
theological_decisions:
- issue: Phạm vi của mệnh lệnh từ bỏ tài sản và lời kêu gọi làm môn đồ
  choice: Dịch như một mệnh lệnh cụ thể, triệt để dành trực tiếp cho người đang đối thoại, đạt cao điểm ở lời “theo tôi”.
  alternative: Hiểu đây hoặc là mệnh lệnh phổ quát buộc mọi môn đồ phải bán hết tài sản, hoặc chỉ là biểu tượng không đòi hỏi hành động kinh tế cụ thể.
  rationale: Câu Hy Lạp nêu các mệnh lệnh cụ thể với cá nhân này nhưng tự nó không xác định đầy đủ phạm vi áp dụng cho mọi tín hữu; bản dịch vì thế giữ nguyên sức căng thần học thay vì mở rộng hay làm nhẹ lời phán.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi kính trọng phổ biến; đại từ “ông” tránh sắc thái cổ hoặc quá thân mật. Không cần chú thích vì cách nói “trên trời” và cấu trúc “ông vẫn còn thiếu một điều” đều truyền đạt nghĩa nguồn tự nhiên trong tiếng Việt.
