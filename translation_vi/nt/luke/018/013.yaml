id: LUK.18.13
reference: Luke 18:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: vi
  text: 'Nhưng người thu thuế đứng đằng xa, đến cả việc ngước mắt lên trời ông cũng không muốn, nhưng cứ đấm ngực mình mà nói: ‘Lạy Đức Chúa Trời, xin thương xót con[a], là kẻ tội lỗi.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xin làm nguôi cơn thịnh nộ đối với con.” Động từ này thuộc nhóm từ ngữ có liên hệ với sự chuộc tội và việc làm nguôi cơn thịnh nộ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: người thu thuế
  rationale: Cách gọi tự nhiên, hiện đại và chính xác cho viên chức thu thuế; ngữ cảnh Tin Mừng tự truyền đạt sự khinh miệt xã hội gắn với vai trò này.
- source_word: μακρόθεν ἑστὼς
  choice: đứng đằng xa
  rationale: Diễn đạt rõ khoảng cách không gian và giữ được sắc thái khiêm nhường hàm ẩn trong ngữ cảnh.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: thậm chí không dám
  rationale: Tiếng Hy Lạp diễn tả ý chí, theo nghĩa sát là ‘thậm chí không muốn’. Trong tiếng Việt, ‘không dám’ tự nhiên hơn trong cử chỉ hổ thẹn và khiêm nhường này, nhưng có phần diễn giải sắc thái theo ngữ cảnh.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: ngước mắt lên trời
  rationale: Thành ngữ tiếng Việt tự nhiên, bảo toàn cả hành động nâng mắt lẫn hướng lên trời.
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: cứ đấm ngực mình
  rationale: ‘Cứ’ thể hiện hành động tiếp diễn hoặc lặp lại của thì chưa hoàn thành; ‘đấm ngực’ là cách diễn đạt hiện đại, rõ nghĩa cho cử chỉ đau buồn và ăn năn.
- source_word: ἱλάσθητί μοι
  choice: xin thương xót con
  rationale: Diễn đạt tự nhiên lời cầu xin lòng thương xót của Đức Chúa Trời, đồng thời chú thích mối liên hệ của động từ với việc chuộc tội và làm nguôi cơn thịnh nộ.
- source_word: τῷ ἁμαρτωλῷ
  choice: con, là kẻ có tội
  rationale: Giữ mạo từ xác định và sức nhấn mạnh tự hạ của nguyên văn tốt hơn cách dịch đơn giản ‘một kẻ có tội’, đồng thời vẫn tự nhiên trong lời cầu nguyện tiếng Việt.
theological_decisions:
- issue: Cách dịch ἱλάσθητί μοι trong lời cầu xin Đức Chúa Trời đoái nhận
  choice: xin thương xót con
  alternative: xin nguôi giận đối với con; xin làm lễ chuộc tội cho con
  rationale: Động từ thuộc nhóm từ ngữ liên quan đến sự chuộc tội và làm nguôi cơn thịnh nộ, nhưng ở đây là lời cầu nguyện trực tiếp nên ‘xin thương xót con’ vừa dễ hiểu vừa không áp đặt một hệ thống thần học vào chính văn. Chú thích bảo lưu chiều sâu tế lễ của từ.
- issue: Giá trị của mạo từ trong τῷ ἁμαρτωλῷ
  choice: con, là kẻ có tội
  alternative: con, một kẻ có tội
  rationale: 'Mạo từ có thể tạo sắc thái nhấn mạnh: người ấy nhìn nhận mình như ‘kẻ có tội’ trước mặt Đức Chúa Trời. Bản dịch giữ sắc thái này mà không khẳng định rằng ông là người có tội duy nhất.'
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và dễ hiểu. Dùng ‘Lạy Đức Chúa Trời’ và đại từ ‘con’ phù hợp với lời cầu nguyện. Cụm ‘thậm chí không dám’ ưu tiên tiếng Việt tự nhiên và sắc thái hổ thẹn của ngữ cảnh; ‘cứ đấm’ làm rõ hành động lặp lại.
