id: LUK.18.7
reference: Luke 18:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: vi
  text: Vậy, chẳng lẽ Đức Chúa Trời lại không thực thi công lý cho những người Ngài đã chọn, là những người ngày đêm kêu cầu Ngài sao? Lẽ nào Ngài còn trì hoãn lâu đối với họ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dù Ngài kiên nhẫn đối với họ” hoặc “và Ngài có kiên nhẫn đối với họ không?” Cụm từ Hy Lạp có thể nói về lòng kiên nhẫn hoặc sự nhịn chịu lâu, thay vì việc trì hoãn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: thực thi công lý
  rationale: Trong ngữ cảnh vị quan tòa bất chính và lời cầu xin bền bỉ, từ này chỉ việc đem lại sự phân xử công bằng hoặc minh oan, chứ không nhấn mạnh sự báo thù cá nhân.
- source_word: ἐκλεκτῶν
  choice: những người Ngài đã chọn
  rationale: Tính từ được dùng như danh từ. Cách diễn đạt này rõ ràng trong tiếng Việt hiện đại, giữ ý họ được Đức Chúa Trời chọn mà không gắn với một cách giải thích hệ phái cụ thể.
- source_word: βοώντων
  choice: kêu cầu
  rationale: Động từ diễn tả lời khẩn cầu mạnh mẽ, cấp thiết; “kêu cầu” vừa tự nhiên trong ngữ cảnh cầu nguyện vừa giữ được cường độ của nguyên văn.
- source_word: ἡμέρας καὶ νυκτός
  choice: ngày đêm
  rationale: Giữ hình ảnh thời gian của nguyên văn và diễn đạt tự nhiên ý cầu xin liên tục.
- source_word: οὐ μὴ ποιήσῃ
  choice: chẳng lẽ ... lại không thực thi ... sao?
  rationale: Cấu trúc phủ định mạnh nằm trong câu hỏi tu từ chờ đợi câu trả lời khẳng định. Mẫu câu tiếng Việt này truyền đạt tự nhiên lực tu từ ấy.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Lẽ nào Ngài còn trì hoãn lâu đối với họ?
  rationale: Cụm từ khó về cú pháp và ngữ nghĩa. Trong mạch văn dẫn sang lời bảo đảm về sự xét xử mau chóng ở câu 8, cách dịch này nêu khả năng Đức Chúa Trời trì hoãn hành động vì họ, nhưng không xóa bỏ nghĩa khả dĩ về sự kiên nhẫn.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng chuẩn, trang trọng và dễ hiểu trong tiếng Việt; mạo từ Hy Lạp xác định chủ ngữ, không đòi hỏi triển khai thêm.
theological_decisions:
- issue: Ý nghĩa của μακροθυμεῖ ἐπ’ αὐτοῖς đối với tính kiên nhẫn và hành động của Đức Chúa Trời
  choice: 'Dịch trong chính văn như câu hỏi về việc trì hoãn hành động: “Lẽ nào Ngài còn trì hoãn lâu đối với họ?”'
  alternative: Có thể hiểu theo nghĩa Đức Chúa Trời kiên nhẫn đối với họ, dưới dạng mệnh đề nhượng bộ hoặc câu hỏi.
  rationale: Nguyên văn Hy Lạp cho phép hiểu μακροθυμέω là “kiên nhẫn/chịu đựng lâu”, trong khi ngữ cảnh gần nhấn mạnh sự minh xét mau chóng. Chính văn giữ dòng lập luận của câu hỏi tu từ, còn chú thích bảo tồn sự mơ hồ thật sự của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Thực thi công lý” giữ sắc thái pháp lý; “kêu cầu” phù hợp ngữ cảnh cầu nguyện khẩn thiết. Hai câu hỏi tu từ tái hiện lực lập luận của nguyên văn, và chú thích giữ cách hiểu khác của cụm từ cuối.
