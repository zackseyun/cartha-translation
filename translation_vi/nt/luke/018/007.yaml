  source_fidelity: Bản dịch truyền đạt đúng câu hỏi tu từ phủ định mạnh οὐ μὴ ποιήσῃ, ý nghĩa pháp lý của ἐκδίκησις (“thực thi công lý”), đối tượng “những người Ngài đã chọn,” và lời kêu cầu liên tục “ngày đêm.” Câu cuối giữ cách hiểu trì hoãn phù hợp mạch văn và không loại bỏ khả năng nghĩa “kiên nhẫn/chịu đựng lâu,” vốn đã được nêu trong chú thích.
  naturalness: Tiếng Việt hiện đại, trang trọng và dễ hiểu. “Chẳng lẽ ... sao?” và “Lẽ nào ...?” tái tạo tốt lực của hai câu hỏi tu từ. Cụm “trì hoãn lâu đối với họ” có sắc thái khá sát cú pháp nguyên văn; dù hơi trang trọng, vẫn chấp nhận được và hữu ích vì không giải quyết quá mức chỗ mơ hồ.
