revisions:
- from: 'Rồi Đức Chúa Jêsus đem riêng Nhóm Mười Hai ra[a] và nói với họ: “Này, chúng ta đang lên Giê-ru-sa-lem; mọi điều các nhà tiên tri đã viết về Con Người sẽ được ứng nghiệm.”'
  to: 'Rồi Đức Giê-su đưa Nhóm Mười Hai ra riêng và nói với họ: “Này, chúng ta đang lên Giê-ru-sa-lem, và mọi điều đã được chép qua các nhà tiên tri về Con Người sẽ được ứng nghiệm.”'
  rationale: Sửa câu mở đầu cho tự nhiên trong tiếng Việt chuẩn hiện đại; diễn đạt lại phần «đã được chép qua các nhà tiên tri» để phản ánh sát hơn γεγραμμένα διὰ τῶν προφητῶν. Thay chú thích để đánh dấu đúng mơ hồ của cách Dative liên hệ với «Con Người», đồng thời giữ bản văn chính theo cách hiểu phù hợp ngữ cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:50Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mạch câu, hướng đi lên Giê-ru-sa-lem, sự ứng nghiệm trong tương lai, và danh hiệu «Con Người». Tuy nhiên, chú thích hiện có chỉ nêu một cách hiểu khác của Παραλαβών, trong khi điểm mơ hồ đáng chú thích theo nguồn và audit trail là quan hệ của cụm τῷ υἱῷ τοῦ ἀνθρώπου («về/cho Con Người»).
  naturalness: «Đức Chúa Jêsus đem riêng Nhóm Mười Hai ra» có sắc thái truyền thống và trật tự từ hơi gượng đối với tiếng Việt chuẩn hiện đại. «Đức Giê-su đưa Nhóm Mười Hai ra riêng» tự nhiên hơn, vẫn diễn tả hợp lý sắc thái đưa nhóm này ra để nói riêng.
  terminology: Dùng «Đức Giê-su», «Nhóm Mười Hai», «Giê-ru-sa-lem», và «Con Người» nhất quán, dễ hiểu trong văn phong Kinh Thánh hiện đại. «Mọi điều đã được chép qua các nhà tiên tri» phản ánh trực tiếp hơn dạng bị động hoàn thành và vai trò trung gian của διά + sở hữu cách, không quy định quá mức tác nhân cuối cùng.
  issues:
  - severity: medium
    issue: Chú thích không phản ánh mơ hồ ngữ pháp chính của câu.
    rationale: Audit trail tiếng Anh đánh dấu biến thể «for the Son of Man» đối với cụm dative τῷ υἱῷ τοῦ ἀνθρώπου. Chú thích bản nháp lại nói về Παραλαβών và vì vậy không hỗ trợ cách dịch «về Con Người» hay bảo tồn lựa chọn sát chữ «cho Con Người».
  - severity: low
    issue: Cụm mở đầu chưa thật tự nhiên theo tiếng Việt hiện đại.
    rationale: «đem riêng Nhóm Mười Hai ra» nặng và có trật tự từ kém trôi chảy. «đưa Nhóm Mười Hai ra riêng» giữ ý ngữ cảnh mà tự nhiên hơn.
  revised_text: 'Rồi Đức Giê-su đưa Nhóm Mười Hai ra riêng và nói với họ: “Này, chúng ta đang lên Giê-ru-sa-lem, và mọi điều đã được chép qua các nhà tiên tri về Con Người sẽ được ứng nghiệm.”'
  revised_footnotes:
