language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: vi
  text: 'Rồi Đức Giê-su đưa Nhóm Mười Hai ra riêng và nói với họ: “Này, chúng ta đang lên Giê-ru-sa-lem, và mọi điều đã được chép qua các nhà tiên tri về Con Người sẽ được ứng nghiệm.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παραλαβὼν
  choice: đem riêng ... ra
  rationale: Động từ phân từ diễn tả việc Đức Chúa Jêsus đưa Nhóm Mười Hai ra riêng để dạy bảo; cách dịch này tự nhiên trong tiếng Việt và làm rõ sắc thái theo ngữ cảnh.
- source_word: τοὺς δώδεκα
  choice: Nhóm Mười Hai
  rationale: Giữ danh xưng chỉ nhóm thân cận của Đức Chúa Jêsus mà không thêm từ “môn đồ” vốn không có trong nguyên văn.
- source_word: Ἰδοὺ
  choice: Này
  rationale: Là từ dẫn thu hút sự chú ý; “Này” trang trọng, tự nhiên và phù hợp lời nói trực tiếp trong tiếng Việt.
- source_word: ἀναβαίνομεν
  choice: chúng ta đang lên
  rationale: Giữ sắc thái hiện tại và ý đi lên Giê-ru-sa-lem, vừa mang nghĩa địa lý vừa có tính sống động trong trình thuật.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τελεσθήσεται
  choice: sẽ được ứng nghiệm
  rationale: Thể tương lai bị động cho biết những điều đã chép sẽ đạt đến sự hoàn tất; “được ứng nghiệm” phù hợp ngữ cảnh lời tiên tri.
- source_word: πάντα τὰ γεγραμμένα
  choice: mọi điều ... đã viết
  rationale: Chuyển đạt đầy đủ tính toàn thể của πάντα và hiệu lực hiện tại của phân từ hoàn thành γεγραμμένα bằng tiếng Việt tự nhiên.
- source_word: διὰ τῶν προφητῶν
  choice: các nhà tiên tri đã viết
  rationale: Diễn đạt tự nhiên vai trò trung gian/tác nhân của các nhà tiên tri; ý “qua các nhà tiên tri” vẫn được phản ánh trong chú thích về cấu trúc cả cụm.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: về Con Người
  rationale: Hiểu cách Dative trong ngữ cảnh là chỉ đối tượng/nội dung liên quan; giữ nguyên danh hiệu mang chiều sâu liên văn bản và thần học.
theological_decisions:
- issue: Cách dịch danh hiệu ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  alternative: Đấng thuộc loài người
  rationale: “Con Người” là cách dịch truyền thống, dễ nhận biết, bám sát hình thức tiếng Hy Lạp và bảo tồn âm hưởng Đa-ni-ên cũng như sự căng thẳng thần học của danh hiệu.
- issue: Quan hệ của τῷ υἱῷ τοῦ ἀνθρώπου với πάντα τὰ γεγραμμένα
  choice: mọi điều ... đã viết về Con Người
  alternative: mọi điều ... đã viết cho Con Người
  rationale: Trong ngữ cảnh, Dative nhiều khả năng chỉ điều các nhà tiên tri viết liên quan đến Con Người; tuy nhiên, cấu trúc sát chữ vẫn có thể được hiểu là “cho Con Người”, nên giữ phương án ấy trong chú thích thay vì xóa bỏ sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để xác định chủ thể vốn được lược trong tiếng Hy Lạp nhưng rõ từ ngữ cảnh; dùng “Nhóm Mười Hai” như một danh xưng. Dấu chấm phẩy giữ mối liên hệ chặt giữa hành trình lên Giê-ru-sa-lem và sự ứng nghiệm lời tiên tri.
