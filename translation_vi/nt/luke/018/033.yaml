revisions:
- from: Sau khi đánh đòn Người, họ sẽ giết Người; và vào ngày thứ ba, Người sẽ sống lại.[a]
  to: Sau khi đánh roi Người, họ sẽ giết Người; đến ngày thứ ba, Người sẽ sống lại.[a]
  rationale: Đổi “đánh đòn” thành “đánh roi” để phản ánh chính xác μαστιγώσαντες. Chỉnh chú thích sang cách nói bị động tự nhiên hơn trong tiếng Việt, đồng thời giữ nguyên sự phân biệt của bản văn Hy Lạp giữa cách diễn đạt trực tiếp “sống lại” và phương án dịch bị động.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng trình tự và ý nghĩa chính của nguyên văn: hành động đánh roi đi trước việc giết, và sự sống lại xảy ra vào ngày thứ ba. Tuy nhiên, μαστιγώσαντες chỉ rõ việc đánh bằng roi/đòn roi (flogging, scourging), nên “đánh roi” chính xác hơn “đánh đòn”, vốn có thể chỉ hình phạt đánh nói chung.'
  naturalness: Câu sửa vẫn là tiếng Việt hiện đại, trang trọng và tự nhiên. “Đến ngày thứ ba” diễn đạt thời điểm rõ ràng, không thay đổi ý nghĩa.
  terminology: “Sống lại” là cách dịch tự nhiên, trực tiếp cho ἀναστήσεται và không biến dạng trung động thành bị động. Ghi chú thay thế nên dùng cách nói tiếng Việt tự nhiên hơn “được làm cho sống lại”; “được phục sinh” nêu rõ đây là cách dịch bị động/diễn giải thay thế.
  issues:
  - severity: medium
    issue: “đánh đòn” chưa phản ánh đủ tính đặc thù của μαστιγώσαντες.
    rationale: Động từ μαστιγόω nói đến việc đánh roi/đánh bằng roi, không chỉ là đánh đòn theo nghĩa khái quát. “Đánh roi” vừa chính xác hơn vừa vẫn thông dụng trong tiếng Việt hiện đại.
  - severity: low
    issue: Cách diễn đạt bị động trong chú thích “được làm cho sống lại” hơi gượng.
    rationale: Cụm này có thể hiểu được nhưng không tự nhiên trong tiếng Việt hiện đại. “Được phục sinh” truyền đạt rõ phương án bị động tương ứng với “be raised”, trong khi phần sau vẫn xác nhận cách dịch trực tiếp của tiếng Hy Lạp là “sống lại”.
  revised_text: Sau khi đánh roi Người, họ sẽ giết Người; đến ngày thứ ba, Người sẽ sống lại.[a]
