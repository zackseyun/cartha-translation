source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: vi
  text: Sau khi đánh roi Người, họ sẽ giết Người; đến ngày thứ ba, Người sẽ sống lại.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người sẽ được phục sinh.” Tiếng Hy Lạp ở đây trực tiếp hơn là “Người sẽ sống lại.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: sau khi đánh đòn
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính. “Đánh đòn” là cách nói hiện đại, dễ hiểu và vẫn thể hiện tính tàn bạo của hành động.
- source_word: ἀποκτενοῦσιν
  choice: họ sẽ giết
  rationale: Giữ nghĩa trực tiếp của động từ chủ động tương lai và không thêm sắc thái pháp lý hay phán xét đạo đức vốn không nằm ngay trong từ Hy Lạp.
- source_word: αὐτόν
  choice: Người
  rationale: Đại từ chỉ Đức Chúa Giê-su, tức Con Người trong ngữ cảnh. “Người” trang trọng, tự nhiên và tránh lặp tên không có trong câu Hy Lạp.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: vào ngày thứ ba
  rationale: Chuyển cách chỉ thời gian sang lối nói tiếng Việt tự nhiên, không thêm cách tính ngày ngoài điều bản văn nêu.
- source_word: ἀναστήσεται
  choice: Người sẽ sống lại
  rationale: Dạng tương lai trung động ở đây được diễn đạt tự nhiên theo nghĩa nội động là “sống lại”, bám sát hình thức Hy Lạp hơn cách dịch bị động.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh
  choice: Người sẽ sống lại
  alternative: Người sẽ được làm cho sống lại
  rationale: Bản Hy Lạp dùng dạng tương lai trung động, nên “sẽ sống lại” là cách chuyển trực tiếp và tự nhiên. Cách dịch bị động phù hợp với thần học của những phân đoạn khác nhưng không nên được đưa vào để giải quyết sắc thái còn mở của câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” viết hoa để quy chiếu tôn kính đến Đức Chúa Giê-su; dùng “đánh đòn” thay cho từ cổ hoặc chuyên biệt hơn như “đánh roi”; giữ trình tự hành động và sự căng thẳng thần học của nguyên văn.
