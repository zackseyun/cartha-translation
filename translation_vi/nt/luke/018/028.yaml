base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: vi
  text: 'Bấy giờ, Phi-e-rơ nói: “Này, chúng con đã bỏ những gì thuộc về mình[a] mà theo Thầy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những gì là của mình” hoặc “tài sản riêng của mình”. Cụm từ Hy Lạp có nghĩa rộng, không nói rõ Phi-e-rơ và những người khác đã bỏ lại điều gì.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: nói
  rationale: Động từ aorist của λέγω trong lời thuật chuyện được chuyển tự nhiên là “nói”; ngữ cảnh không đòi hỏi sắc thái “đáp”.
- source_word: δὲ
  choice: Bấy giờ
  rationale: δέ đánh dấu bước chuyển tiếp nhẹ trong mạch kể. “Bấy giờ” giữ chức năng chuyển đoạn mà không nhấn mạnh sự tương phản quá mức.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: ἰδού là từ gọi sự chú ý. “Kìa” ngắn gọn, tự nhiên và giữ được sức gợi trực tiếp của lời Phi-e-rơ.
- source_word: ἡμεῖς
  choice: chúng con
  rationale: Đại từ được hiểu theo lời Phi-e-rơ thưa với Chúa Giê-su; “chúng con” tự nhiên trong tiếng Việt và thể hiện quan hệ người nói với người được nói đến, dù tiếng Hy Lạp không mã hóa sắc thái tôn xưng này.
- source_word: ἀφέντες
  choice: đã bỏ
  rationale: Phân từ aorist chỉ hành động xảy ra trước hoặc gắn liền với việc đi theo. “Đã bỏ ... mà theo” diễn đạt tự nhiên mà không tăng cường thành “từ bỏ hoàn toàn”.
- source_word: τὰ ἴδια
  choice: những gì thuộc về mình
  rationale: Cụm danh từ hóa này có nghĩa rộng là những gì riêng thuộc về họ, không xác định đó chỉ là tài sản, nhà cửa hay gia đình. Cách dịch giữ độ rộng ấy.
- source_word: ἠκολουθήσαμέν σοι
  choice: theo Thầy
  rationale: ἀκολουθέω với đại từ tặng cách mang nghĩa đi theo, đồng thời có sắc thái môn đồ trong ngữ cảnh. “Theo Thầy” vừa tự nhiên vừa không diễn giải quá mức.
theological_decisions:
- issue: Phạm vi của τὰ ἴδια
  choice: Giữ nghĩa rộng bằng “những gì thuộc về mình”
  alternative: “tài sản của mình”, “nhà cửa của mình” hoặc “mọi sự”
  rationale: Bản Hy Lạp không nêu cụ thể những gì các môn đồ đã bỏ; thu hẹp thành tài sản hay nhà cửa sẽ giải quyết một sự mơ hồ có thật trong nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Phi-e-rơ” theo lối phiên âm quen thuộc; lời xưng hô “chúng con—Thầy” tạo hội thoại tự nhiên trong tiếng Việt. “Kìa” giữ từ gọi chú ý của nguyên văn, còn cấu trúc “đã bỏ ... mà theo” làm rõ quan hệ giữa hai hành động mà không thêm nội dung.
