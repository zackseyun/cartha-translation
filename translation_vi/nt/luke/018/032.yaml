id: LUK.18.32
reference: Luke 18:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: vi
  text: Vì Người sẽ bị nộp vào tay dân ngoại[a], bị chế giễu, bị sỉ nhục[b] và bị người ta nhổ vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân”. Ở đây, từ này chỉ những người không thuộc dân Do Thái, tức dân ngoại.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “bị lăng nhục” hoặc “bị đối xử nhục nhã”.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: sẽ bị nộp vào tay
  rationale: Giữ thể bị động tương lai và diễn đạt tự nhiên việc Người bị trao vào quyền kiểm soát của dân ngoại; không thu hẹp nghĩa thành “bị phản bội”.
- source_word: γὰρ
  choice: Vì
  rationale: Thể hiện quan hệ giải thích với lời báo trước ở câu trước.
- source_word: τοῖς ἔθνεσιν
  choice: dân ngoại
  rationale: Trong ngữ cảnh này, cụm từ chỉ những người không thuộc dân Do Thái, đặc biệt là các nhà cầm quyền ngoại bang, chứ không chỉ các quốc gia theo nghĩa trừu tượng.
- source_word: ἐμπαιχθήσεται
  choice: bị chế giễu
  rationale: Diễn đạt sự nhạo báng, chế giễu trong bối cảnh cuộc thương khó bằng lối nói trang trọng và hiện đại.
- source_word: ὑβρισθήσεται
  choice: bị sỉ nhục
  rationale: Truyền đạt hành vi xúc phạm và làm nhục; chú thích bảo lưu sắc thái rộng hơn là bị đối xử nhục nhã.
- source_word: ἐμπτυσθήσεται
  choice: bị người ta nhổ vào
  rationale: Giữ tính cụ thể của hành vi nhổ nước bọt vào Người, đồng thời dùng cấu trúc tự nhiên trong tiếng Việt và không thêm “mặt”, điều không được nêu rõ trong nguyên văn.
theological_decisions:
- issue: Chủ ngữ hàm ẩn của các động từ bị động
  choice: Dùng “Người”, quy chiếu về Con Người trong câu trước
  alternative: Lặp lại “Con Người” hoặc để chủ ngữ hoàn toàn hàm ẩn
  rationale: Các động từ Hy Lạp ở ngôi thứ ba số ít không nêu chủ ngữ trong câu này, nhưng chủ thể được xác định rõ từ Lu-ca 18:31. “Người” tạo câu tiếng Việt tự nhiên mà không thêm nội dung thần học.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Chuỗi các động từ bị động được giữ để tái hiện nhịp liệt kê dồn dập của nguyên văn; “và” chỉ xuất hiện trước hành vi cuối theo cú pháp tiếng Việt tự nhiên.
