  source_fidelity: 'Bản dịch bám sát SBLGNT: “Vì” phản ánh γάρ; “sẽ bị nộp vào tay dân ngoại” giữ thì tương lai và thể bị động của παραδοθήσεται; “dân ngoại” phù hợp với τοῖς ἔθνεσιν trong ngữ cảnh Lu-ca. Chuỗi “bị chế giễu, bị sỉ nhục ... bị người ta nhổ vào” truyền đạt đầy đủ ba động từ bị động tiếp theo, không thêm chi tiết như vị trí bị nhổ.'
  naturalness: Câu tiếng Việt hiện đại, trang trọng và mạch lạc. Cấu trúc liệt kê các động từ bị động tạo được nhịp dự báo đau khổ của nguyên văn. “Bị người ta nhổ vào” là cách nói tự nhiên và rõ nghĩa trong tiếng Việt.
  terminology: “Người” quy chiếu tự nhiên đến Con Người ở câu trước; “dân ngoại” là thuật ngữ Kinh Thánh thông dụng và phù hợp; “sỉ nhục” phản ánh tốt sắc thái xúc phạm/làm nhục của ὑβρισθήσεται. Các chú thích bảo lưu đúng các khả năng từ vựng mà không áp đặt diễn giải.
