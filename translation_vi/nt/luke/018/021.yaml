  source_fidelity: “Ông đáp” diễn đạt tự nhiên ὁ δὲ εἶπεν trong lượt đối thoại; việc không dịch riêng δέ là phù hợp. “Tất cả những điều ấy” giữ đúng tính khái quát của Ταῦτα πάντα, không thêm “điều răn” vào chính văn. “Tôi đã giữ” phản ánh hợp lý ἐφύλαξα trong ngữ cảnh tuân giữ, và “từ thuở còn trẻ” chuyển tải ἐκ νεότητός μου mà không đồng nhất với thời thơ ấu.
  naturalness: Câu tiếng Việt chuẩn hiện đại, rõ nghĩa và có sắc thái trang trọng vừa phải. Đại từ “ông/tôi” nhất quán với lời nói của nhân vật nam trong mạch văn. Dấu câu và trật tự câu tự nhiên.
  terminology: “Giữ” là lựa chọn phù hợp, ngắn gọn cho φυλάσσω trong ngữ cảnh các mệnh lệnh. “Những điều ấy” bảo toàn cách nói không nêu rõ danh từ của nguyên ngữ; không có thuật ngữ thần học cần điều chỉnh.
