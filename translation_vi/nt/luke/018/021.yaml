  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: vi
  text: 'Ông đáp: “Tất cả những điều ấy, tôi đã giữ từ thuở còn trẻ.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ông đáp
  rationale: Trong mạch đối thoại, εἶπεν tự nhiên được diễn đạt là “đáp”; δέ là liên từ nhẹ, không cần thể hiện bằng một từ riêng trong tiếng Việt.
- source_word: Ταῦτα πάντα
  choice: Tất cả những điều ấy
  rationale: Cách dịch này giữ đúng biểu thức khái quát của Hy Lạp; “các điều răn” được ngữ cảnh gợi ra nhưng không xuất hiện trực tiếp trong câu.
- source_word: ἐφύλαξα
  choice: tôi đã giữ
  rationale: φυλάσσω trong ngữ cảnh các điều răn mang nghĩa tuân giữ. “Đã giữ” chuyển tải lời khẳng định nhìn lại quá trình cho đến hiện tại mà không thêm ý ngoài nguyên văn.
- source_word: ἐκ νεότητος μου
  choice: từ thuở còn trẻ
  rationale: ἐκ chỉ điểm khởi đầu trong thời gian; cách nói này tự nhiên, trang trọng vừa phải và không thu hẹp νεότης thành thời thơ ấu.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, rõ ràng và trang nghiêm. Giữ cách nói khái quát “những điều ấy” thay vì giải nghĩa ngay trong chính văn là “các điều răn”.
