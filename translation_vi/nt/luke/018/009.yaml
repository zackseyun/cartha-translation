  source_fidelity: 'Bản dịch nhìn chung theo sát cấu trúc và ý nghĩa câu Hy Lạp: đối tượng được nhắm đến là những người đặt lòng tin nơi bản thân về sự công chính của mình và khinh thường những người khác. Tuy nhiên, “tự tin rằng” làm mờ nét tin cậy/cậy dựa «ἐφ’ ἑαυτοῖς» nơi chính mình; cách tách bằng “tin cậy vào chính mình, cho rằng...” giữ rõ cả hai vế. Hơn nữa, παραβολή không nên dịch là “ẩn dụ”, vì “ẩn dụ” thường chỉ một biện pháp tu từ, còn ở đây là một dụ ngôn/câu chuyện minh họa.'
