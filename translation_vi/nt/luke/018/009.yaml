revisions:
- from: Ngài cũng kể ẩn dụ này cho một số người tự tin rằng mình là người công chính và khinh thường những người còn lại:[a]
  to: Ngài cũng kể dụ ngôn này cho một số người tin cậy vào chính mình, cho rằng mình là người công chính và khinh thường những người còn lại:[a]
  rationale: Sửa “ẩn dụ” thành “dụ ngôn” để phản ánh đúng παραβολή như một thể loại lời kể minh họa. Sửa cụm chỉ sự tự tin để biểu đạt rõ hơn việc họ tin cậy nơi chính mình, đồng thời giữ nguyên sự mơ hồ/đánh giá của nguyên văn về lời tự nhận là công chính. Dấu neo chú thích và nội dung chú thích được giữ nguyên, vì chúng phù hợp với ἐξουθενοῦντας τοὺς λοιπούς.
