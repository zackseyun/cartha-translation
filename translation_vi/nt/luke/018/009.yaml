    rationale: Trong tiếng Việt hiện đại, “ẩn dụ” chủ yếu là một phép chuyển nghĩa ở cấp từ/cụm từ, không tương ứng ổn định với thể loại παραβολή. “Dụ ngôn” chỉ đúng lời kể minh họa mà câu này giới thiệu.
