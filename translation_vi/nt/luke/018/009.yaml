  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: vi
  text: Ngài cũng kể dụ ngôn này cho một số người tin cậy vào chính mình, cho rằng mình là người công chính và khinh thường những người còn lại:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “coi thường những người khác” hoặc “xem những người khác chẳng ra gì.”'
    reason: Nêu các cách diễn đạt tự nhiên khác cho ἐξουθενοῦντας τοὺς λοιπούς, vốn hàm ý coi những người còn lại là không đáng kể.
lexical_decisions:
- source_word: Εἶπεν δὲ καὶ
  choice: Ngài cũng kể
  rationale: Với “ẩn dụ này” làm tân ngữ, “kể” là cách diễn đạt tự nhiên trong tiếng Việt; “cũng” giữ ý bổ sung của καί, còn δέ được thể hiện bằng sự tiếp nối tự nhiên của câu chuyện, không cần một liên từ gượng ép.
- source_word: πρός τινας
  choice: cho một số người
  rationale: Sau động từ nói, πρός chỉ những người được nhắm đến; “cho một số người” phù hợp tự nhiên với động từ “kể” trong tiếng Việt.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: tự tin
  rationale: Phân từ hoàn thành diễn tả trạng thái tin cậy vững chắc đặt nơi chính mình. “Tự tin” chuyển đạt gọn và tự nhiên, đồng thời phần sau nêu rõ nội dung sự tin tưởng ấy.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: rằng mình là người công chính
  rationale: “Công chính” giữ thuật ngữ đạo đức–tôn giáo của δίκαιοι và để chính văn cảnh bộc lộ sự phê phán, thay vì đưa sắc thái “tự cho mình” vào bản dịch.
- source_word: ἐξουθενοῦντας
  choice: khinh thường
  rationale: Động từ có nghĩa coi người khác là không đáng kể, khinh miệt; “khinh thường” là cách diễn đạt hiện đại, rõ ràng và có lực chủ động.
- source_word: τοὺς λοιπούς
  choice: những người còn lại
  rationale: Cách dịch sát ý “phần còn lại/những người khác” của λοιποί, không mở rộng thành “tất cả mọi người khác”.
- source_word: τὴν παραβολὴν ταύτην
  choice: ẩn dụ này
  rationale: “Ẩn dụ” là thuật ngữ tiếng Việt quen thuộc cho παραβολή trong thể loại lời dạy bằng câu chuyện so sánh.
theological_decisions:
- issue: Cách dịch δίκαιοι trong văn cảnh phê phán sự tự cho mình là công chính
  choice: người công chính
  alternative: người đúng đắn; người có lẽ công chính; người tự cho mình là công chính
  rationale: Nguyên văn nói họ tin rằng mình là δίκαιοι chứ không gắn sắc thái miệt thị ngay vào danh từ. Giữ “công chính” bảo toàn từ ngữ thần học và để văn cảnh cho thấy sự mỉa mai cùng lời phê phán.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo lối kể tôn kính dành cho Chúa Giê-su; câu giữ nhịp gọn, không thêm lời giải thích ngoài nguyên văn.
