  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: vi
  text: 'Ông kêu lớn: “Giê-su, Con Đa-vít[a], xin thương xót tôi!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Con Đa-vít” là một tước hiệu mang sắc thái Mê-si-a, gợi đến vị vua thuộc dòng Đa-vít đã được hứa ban; cũng có thể hiểu theo nghĩa khái quát hơn là “hậu duệ của Đa-vít.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: kêu lớn
  rationale: Động từ βοάω diễn tả tiếng kêu lớn và khẩn thiết; “kêu lớn” tự nhiên trong tiếng Việt hiện đại và giữ được cả âm lượng lẫn sự cấp bách.
- source_word: λέγων
  choice: dấu hai chấm trước lời nói trực tiếp
  rationale: Phân từ “nói rằng” được chuyển tự nhiên bằng dấu hai chấm trong văn kể tiếng Việt, tránh lối diễn đạt nặng nề mà vẫn giới thiệu chính xác lời nói trực tiếp.
- source_word: Ἰησοῦ
  choice: Đức Chúa Jêsus
  rationale: Đây là hô cách của tên riêng Ἰησοῦς. Dạng gọi “Lạy Đức Chúa Jêsus” thể hiện lời xưng hô trực tiếp, kính trọng trong ngữ cảnh cầu xin.
- source_word: υἱὲ Δαυίδ
  choice: Con vua Đa-vít
  rationale: Cách dịch này giữ hình thức tước hiệu hoàng gia–Mê-si-a, đồng thời “vua” giúp độc giả Việt nhận ra Đa-vít được nhắc đến với tư cách vị vua thuộc dòng giao ước.
- source_word: ἐλέησόν με
  choice: xin thương xót tôi
  rationale: Mệnh lệnh cách aorist là lời khẩn cầu hành động đầy lòng thương xót; “xin thương xót tôi” vừa trực tiếp, trang trọng, vừa tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Sức nặng Mê-si-a của tước hiệu υἱὲ Δαυίδ
  choice: Dịch là “Con vua Đa-vít.”
  alternative: “Hậu duệ của Đa-vít.”
  rationale: Trong mạch văn Lu-ca, đây là lời xưng tụng mang ý nghĩa vương quyền và Mê-si-a, không chỉ là thông tin gia phả. Giữ “Con vua Đa-vít” bảo toàn sức gợi thần học mà không giải nghĩa quá mức trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng câu trực tiếp ngắn để giữ nhịp gấp gáp của lời kêu xin; tên riêng theo quy ước Kinh Thánh tiếng Việt.
