review_pass:
  verdict: revise
  source_fidelity: Bản thảo thêm “Đức Chúa” vào tên Giê-su, trong khi bản Hy Lạp chỉ có hô cách “Ἰησοῦ” (Giê-su). Bản thảo cũng dịch υἱὲ Δαυίδ là “Con vua Đa-vít,” thêm yếu tố “vua” không có trong tước hiệu nguồn. Cần giữ tước hiệu trực tiếp là “Con Đa-vít.”
  naturalness: “Ông kêu lớn” và “xin thương xót tôi” là tự nhiên, trang trọng và truyền đạt được tính khẩn thiết. Dấu hai chấm là cách tự nhiên để chuyển sang lời nói trực tiếp; không cần dịch riêng λέγων bằng “nói rằng.”
  terminology: Dùng “Giê-su” theo chính tả Việt ngữ hiện hành và “Con Đa-vít” cho tước hiệu đã được xác lập trong ngữ cảnh Phúc Âm. Không thêm “Chúa” hoặc “vua” vào chính văn. “Đấng Mê-si-a” trong chú thích giải thích chức năng tước hiệu mà không áp đặt vào bản dịch.
  issues:
  - severity: high
    issue: Thêm “Đức Chúa”
    rationale: Ἰησοῦ là tên riêng ở hô cách; nguyên văn không có κύριε (“Lạy Chúa”). Việc thêm danh xưng này vượt quá văn bản nguồn.
  - severity: medium
    issue: “Con vua Đa-vít” thêm từ “vua”
    rationale: υἱὲ Δαυίδ nghĩa đen là “Con Đa-vít.” Dù Đa-vít là vua và tước hiệu có sắc thái Mê-si-a, “vua” không xuất hiện trong cụm Hy Lạp và không nên được thêm vào chính văn.
