  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: vi
  text: Khi Đức Giê-su đến gần thành Giê-ri-cô, có một người mù đang ngồi bên đường ăn xin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: không dịch thành một từ riêng
  rationale: Cụm này chủ yếu làm chức năng chuyển tiếp trong lời kể; câu tiếng Việt tự nhiên không cần thêm “bấy giờ” hay “xảy ra rằng”.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Khi Đức Giê-su đến gần thành Giê-ri-cô
  rationale: Kết cấu ἐν với động từ nguyên mẫu có mạo từ diễn tả thời gian đồng thời; “khi… đến gần” vừa tự nhiên vừa giữ hướng chuyển động về phía thành. Đại từ αὐτόν được nêu rõ là Đức Giê-su theo văn cảnh.
- source_word: τυφλός τις
  choice: có một người mù
  rationale: Cách nói này truyền đạt sắc thái bất định nhưng có tính cá thể của τις tự nhiên hơn “một người mù nọ” trong tiếng Việt hiện đại.
- source_word: ἐκάθητο
  choice: đang ngồi
  rationale: “Đang ngồi” phản ánh tính tiếp diễn và chức năng dựng cảnh của thì chưa hoàn thành.
- source_word: παρὰ τὴν ὁδὸν
  choice: bên đường
  rationale: Diễn đạt rõ vị trí ở sát dọc theo con đường bằng lối nói tiếng Việt thông dụng.
- source_word: ἐπαιτῶν
  choice: ăn xin
  rationale: Diễn đạt trực tiếp hoạt động xin bố thí; trong ngữ cảnh này tự nhiên và chính xác hơn cách dài dòng “xin của bố thí”.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” để xác định chủ thể đại từ theo văn cảnh; “thành Giê-ri-cô” giúp địa danh rõ ràng đối với độc giả phổ thông.
