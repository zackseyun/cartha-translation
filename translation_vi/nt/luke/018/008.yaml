id: LUK.18.8
reference: Luke 18:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: vi
  text: 'Ta nói với anh em: Ngài sẽ mau chóng thực thi công lý cho họ.[a] Tuy nhiên, khi Con Người đến, liệu Người có thật sự tìm thấy đức tin[b] trên đất không?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “minh oan cho họ” hoặc “đem lại công lý cho họ.” Từ Hy Lạp có thể chỉ việc minh oan, thực thi công lý, hoặc báo trả để bênh vực quyền lợi của một người.'
    reason: lexical_alternative
  - marker: b
    text: “Đức tin” cũng có thể được hiểu là “sự tin cậy” hoặc “lòng trung tín.” Trong ngữ cảnh này, từ Hy Lạp có thể bao hàm đức tin bền bỉ được thể hiện qua việc cầu nguyện.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: Ngài sẽ ... thực thi công lý cho họ
  rationale: 'Cụm từ mang sắc thái tư pháp: đem lại công lý hoặc minh oan cho những người đang kêu cầu. Cách dịch này phù hợp với bối cảnh người góa phụ xin xét xử công minh và tránh nhấn quá mạnh ý báo thù.'
- source_word: ἐν τάχει
  choice: mau chóng
  rationale: Giữ ý hành động nhanh chóng, không chậm trễ, nhưng không nhất thiết biến câu thành một dự báo thời điểm theo nghĩa 'sắp xảy ra'.
- source_word: πλὴν
  choice: Tuy nhiên
  rationale: Thể hiện bước chuyển tương phản mạnh từ lời quả quyết về công lý của Đức Chúa Trời sang câu hỏi dò xét về đức tin.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Con Người
  rationale: Danh xưng quen thuộc và trang trọng, bảo toàn liên hệ liên văn bản, đặc biệt với Đa-ni-ên 7.
- source_word: ἐλθὼν
  choice: khi ... đến
  rationale: Phân từ aorist được diễn đạt tự nhiên như một mệnh đề thời gian, giữ đúng quan hệ với động từ chính 'tìm thấy'.
- source_word: ἆρα
  choice: liệu ... có thật sự
  rationale: Diễn tả sắc thái suy xét, dò hỏi của tiểu từ trong câu hỏi tu từ thay vì bỏ qua sắc thái ấy.
- source_word: τὴν πίστιν
  choice: đức tin
  rationale: Giữ độ rộng nghĩa của πίστις, không thu hẹp dứt khoát thành lòng trung tín hay sự tin cậy; mạo từ không nhất thiết phải được thể hiện bằng một từ chỉ định trong tiếng Việt.
- source_word: ἐπὶ τῆς γῆς
  choice: trên đất
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ phạm vi phổ quát khả dĩ của γῆ trong ngữ cảnh cánh chung.
theological_decisions:
- issue: πίστις có thể chỉ đức tin, sự tin cậy hoặc lòng trung tín trong bối cảnh kiên trì cầu nguyện
  choice: đức tin
  alternative: sự tin cậy; lòng trung tín
  rationale: Bản chính giữ thuật ngữ rộng và quen thuộc, không quyết định thay độc giả rằng câu hỏi chỉ nói về trạng thái tin tưởng hay sự bền lòng trung tín; các khả năng khác được nêu trong chú thích.
- issue: Sắc thái của ἐκδίκησις giữa công lý, minh oan và báo trả
  choice: thực thi công lý cho họ
  alternative: minh oan cho họ; đem lại công lý cho họ
  rationale: Ngữ cảnh xét xử của dụ ngôn ưu tiên sắc thái bảo vệ quyền lợi và xét xử công minh, đồng thời không phủ nhận hoàn toàn chiều kích báo trả vốn có thể hiện diện trong từ Hy Lạp.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ta” trong lời trực tiếp của Chúa Giê-su và “các con” cho ὑμῖν để giữ sắc thái thầy-trò gần gũi; dùng “Ngài” cho chủ thể là Đức Chúa Trời và “Người” cho danh xưng Con Người nhằm tránh lặp và vẫn giữ sự tôn kính. Các dấu chú thích đều xuất hiện trong bản văn.
