  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: vi
  text: 'Ta nói với các ngươi: người này đi xuống, về nhà mình, được tuyên là công chính hơn người kia[a]. Vì ai tự tôn mình lên sẽ bị hạ xuống, còn ai tự hạ mình xuống sẽ được tôn lên.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “được tuyên là công chính thay vì người kia”; cụm từ Hy Lạp đặt người này trong thế tương phản hoặc so sánh với người thờ phượng kia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: được tuyên là công chính
  rationale: Phân từ hoàn thành thụ động của δικαιόω diễn tả một phán quyết thuận lợi đã có hiệu lực. Cách dịch này giữ sắc thái pháp lý và kết quả, đồng thời không nêu rõ tác nhân vì bản Hy Lạp cũng để tác nhân hàm ẩn.
- source_word: παρ’ ἐκεῖνον
  choice: chứ không phải người kia
  rationale: παρά với đối cách trong cấu trúc có ý so sánh hoặc tương phản phân biệt người thu thuế với người Pha-ri-si. Cách diễn đạt này tự nhiên trong tiếng Việt nhưng vẫn ghi nhận cách hiểu so sánh ở chú thích.
- source_word: κατέβη
  choice: đi xuống
  rationale: Giữ chuyển động cụ thể của καταβαίνω, phù hợp với việc rời khu vực đền thờ, thay vì làm phẳng thành ‘trở về’.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: về nhà mình
  rationale: Diễn đạt tự nhiên hướng chuyển động về nơi ở của chính người ấy; ‘mình’ quy chiếu rõ về chủ ngữ.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: ai tự tôn mình lên
  rationale: ‘Ai’ diễn đạt tự nhiên mệnh đề khái quát của phân từ có mạo từ; ‘tự… mình’ giữ lực phản thân.
- source_word: ταπεινωθήσεται
  choice: sẽ bị hạ xuống
  rationale: Giữ thể thụ động và để tác nhân không được nói rõ như trong tiếng Hy Lạp.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: còn ai tự hạ mình xuống
  rationale: ‘Còn’ thể hiện sự tương phản của δέ, đồng thời duy trì cấu trúc song song với vế trước.
- source_word: ὑψωθήσεται
  choice: sẽ được tôn lên
  rationale: Giữ thể thụ động và tạo thế đối xứng với ‘sẽ bị hạ xuống’, phù hợp với chủ đề đảo ngược địa vị.
- source_word: ὅτι
  choice: Vì
  rationale: Diễn đạt quan hệ giải thích/nguyên nhân giữa phán quyết trong dụ ngôn và nguyên tắc khái quát theo sau.
- source_word: οὗτος
  choice: người này
  rationale: Quy chiếu trực tiếp về người thu thuế và làm rõ sự tương phản với người thờ phượng kia.
theological_decisions:
- issue: Ý nghĩa của δικαιόω trong kết luận dụ ngôn
  choice: Diễn tả phán quyết thuận lợi bằng ‘được tuyên là công chính’
  alternative: ‘được minh oan’ hoặc ‘được kể là công chính’
  rationale: Bối cảnh là hai người đứng trước Đức Chúa Trời và kết quả trái ngược của họ. ‘Được tuyên là công chính’ giữ trọng lượng của phán quyết thần linh mà không đưa cả một hệ thống thần học hậu kỳ vào câu.
- issue: Tác nhân của các động từ thụ động
  choice: Không nêu tác nhân trong ‘bị hạ xuống’ và ‘được tôn lên’
  alternative: Thêm rõ ‘Đức Chúa Trời sẽ…’
  rationale: Các dạng thụ động Hy Lạp để tác nhân hàm ẩn. Bản dịch giữ nguyên độ hàm ẩn thần học thay vì giải nghĩa ngay trong chính văn.
- issue: Ngôn ngữ đại diện trong châm ngôn
  choice: Dùng đại từ khái quát ‘ai’
  alternative: Dùng danh từ giới tính nam như ‘người nào… người ấy’ hoặc cách số nhiều
  rationale: Tiếng Việt không buộc đánh dấu giống ở đây; ‘ai’ truyền đạt chính xác tính phổ quát của cấu trúc số ít mà không thêm hay xóa một đối lập giới tính không có chức năng trong câu.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. ‘Ta nói với các ngươi’ giữ giọng phán dạy trực tiếp và số nhiều của ὑμῖν; các cặp ‘tôn mình lên/hạ xuống’ và ‘hạ mình xuống/tôn lên’ duy trì phép đối xứng nổi bật của câu Hy Lạp.
