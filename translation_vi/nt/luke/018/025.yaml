id: LUK.18.25
reference: Luke 18:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: vi
  text: Vì lạc đà chui qua lỗ kim còn dễ hơn người giàu vào vương quốc Đức Chúa Trời.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc sát nghĩa: “qua lỗ của một cây kim.”'
    reason: lexical_alternative
  - marker: b
    text: Có người đề xuất những cách giải thích như một cổng hẹp mang tên “Lỗ Kim,” hoặc hiểu từ Hy Lạp được dịch là “lạc đà” là “dây thừng”; tuy nhiên, bản văn Hy Lạp ở đây ghi “lạc đà.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: còn dễ hơn
  rationale: Diễn đạt tự nhiên cấu trúc so sánh của tiếng Hy Lạp và làm rõ sự đối chiếu giữa hai mệnh đề nguyên mẫu.
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích, nối lời này với nhận định ngay trước đó.
- source_word: κάμηλον
  choice: lạc đà
  rationale: Đây là nghĩa thông thường và được chứng thực của κάμηλος; không đổi thành cách giải thích như “dây thừng” khi không có cơ sở trong văn bản Hy Lạp đã cho.
- source_word: διὰ τρήματος βελόνης
  choice: chui qua lỗ kim
  rationale: “Lỗ kim” là cách nói tự nhiên trong tiếng Việt cho khe/lỗ của cây kim; “chui qua” diễn tả sinh động nhưng chính xác chuyển động qua một khe cực nhỏ.
- source_word: εἰσελθεῖν
  choice: chui qua / vào
  rationale: 'Hai lần xuất hiện được diễn đạt theo ngữ cảnh: “chui qua” với lỗ kim và “vào” với vương quốc, vừa tự nhiên vừa giữ ý đi vào.'
- source_word: πλούσιον
  choice: người giàu
  rationale: Tính từ giống đực số ít được dùng như danh từ; tiếng Việt “người giàu” là cách diễn đạt đại diện tự nhiên, không thêm giới tính mà ngôn ngữ đích không đòi hỏi.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: vào vương quốc Đức Chúa Trời
  rationale: Giữ hướng nghĩa của εἰς và thuật ngữ Kinh Thánh βασιλεία τοῦ θεοῦ; “vương quốc” dễ hiểu, trang trọng và không làm mất sắc thái cai trị/lãnh địa.
theological_decisions:
- issue: Cách hiểu hình ảnh lạc đà và lỗ kim
  choice: 'Giữ nguyên hình ảnh cường điệu theo nghĩa mặt chữ: lạc đà chui qua lỗ kim.'
  alternative: Hiểu “lỗ kim” là tên một cổng hẹp, hoặc đổi “lạc đà” thành “dây thừng”.
  rationale: Bản văn SBLGNT đọc κάμηλον, nghĩa là “lạc đà”; không có căn cứ trong câu này để đưa các lối giải thích về cổng hẹp hay dây thừng vào chính văn. Hình ảnh nghịch lý/cường điệu và sức căng thần học của nó được giữ nguyên.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu ngắn gọn, giữ liên từ giải thích “Vì” và hình ảnh cường điệu của nguyên tác. “Đức Chúa Trời” được dùng nhất quán như cách gọi tôn kính, quen thuộc trong văn phong Kinh Thánh Việt ngữ.
