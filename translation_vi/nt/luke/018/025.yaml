  source_fidelity: Chính văn truyền đạt đúng cấu trúc so sánh của εὐκοπώτερον, liên từ giải thích γάρ, hình ảnh theo nghĩa đen κάμηλον ... διὰ τρήματος βελόνης, và hướng nghĩa của εἰς trong mệnh đề thứ hai. “Người giàu” là cách chuyển tự nhiên cho tính từ giống đực dùng như danh từ trong tiếng Hy Lạp mà không áp đặt giới tính không cần thiết trong tiếng Việt.
  naturalness: Câu văn ngắn gọn, tự nhiên và giữ được sắc thái cường điệu mạnh của nguyên tác. “Lạc đà chui qua lỗ kim còn dễ hơn...” là một cấu trúc so sánh Việt ngữ rõ ràng và phù hợp văn phong Kinh Thánh hiện đại.
  terminology: “Lạc đà,” “lỗ kim,” và “vương quốc Đức Chúa Trời” được dùng nhất quán, trang trọng và dễ hiểu. Chú thích a nên dùng “lỗ” thay vì “khe”, vì τρῆμα chỉ lỗ/khẩu độ; chú thích b cần xác định rõ chính từ Hy Lạp đang được nói đến khi đề cập đề xuất “dây thừng.”
