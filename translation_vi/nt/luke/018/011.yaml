reference: Luke 18:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: vi
  text: 'Người Pha-ri-si đứng riêng[a] và cầu nguyện những lời này: “Lạy Đức Chúa Trời, con cảm tạ Ngài vì con không giống như những người còn lại—những kẻ bóc lột, bất chính, ngoại tình—hay thậm chí như tên thu thuế này.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người Pha-ri-si đứng và cầu nguyện với chính mình những lời này.” Cụm từ Hy Lạp πρὸς ἑαυτόν có thể chỉ việc ông đứng riêng, hoặc có thể mang nghĩa mỉa mai rằng lời cầu nguyện của ông hướng về chính mình.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: đứng
  rationale: Phân từ bất định của ἵστημι diễn tả tư thế đi kèm hành động; “đứng” tự nhiên trong tiếng Việt và giữ nguyên khung cảnh.
- source_word: πρὸς ἑαυτὸν
  choice: riêng một mình
  rationale: Cụm từ có thể mang nghĩa không gian là đứng riêng, hoặc nghĩa phản thân là cầu nguyện với chính mình. Bản văn chính chọn nghĩa không gian, còn nghĩa kia được giữ trong chú thích.
- source_word: ταῦτα
  choice: những lời này
  rationale: Đại từ số nhiều chỉ nội dung lời cầu nguyện theo sau; “những lời này” tự nhiên hơn “những điều này” trong văn cảnh phát ngôn mà vẫn giữ số nhiều.
- source_word: προσηύχετο
  choice: cầu nguyện
  rationale: Dịch trực tiếp hành động cầu nguyện; tiếng Việt không bắt buộc đánh dấu thể tiếp diễn của thì chưa hoàn thành như tiếng Anh.
- source_word: εὐχαριστῶ σοι
  choice: con cảm tạ Ngài
  rationale: “Cảm tạ” phù hợp với lời hướng lên Đức Chúa Trời; cặp đại từ “con–Ngài” tự nhiên, trang trọng trong lời cầu nguyện tiếng Việt.
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: giống như những người còn lại
  rationale: Giữ được ý λοιποί là “phần còn lại” và dùng “người” với nghĩa bao quát, không thu hẹp vào nam giới.
- source_word: ἅρπαγες
  choice: những kẻ bóc lột
  rationale: ἅρπαξ chỉ những người tham lam chiếm đoạt của người khác; “bóc lột” thể hiện sắc thái lợi dụng và cưỡng đoạt, phù hợp danh sách thói xấu.
- source_word: ἄδικοι
  choice: bất chính
  rationale: “Bất chính” giữ chiều kích đạo đức rộng của ἄδικος, không thu hẹp thành hành vi thiếu công bằng theo nghĩa pháp lý.
- source_word: μοιχοί
  choice: ngoại tình
  rationale: Trong chuỗi danh từ chỉ hạng người, tiếng Việt tự nhiên có thể dùng “những kẻ… ngoại tình”; nghĩa hành vi vi phạm hôn nhân được giữ rõ.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: hay thậm chí như tên thu thuế này
  rationale: “Thậm chí” chuyển tải sắc thái tăng tiến của ἢ καί. “Tên… này” thể hiện thái độ khinh miệt trong οὗτος mà không thêm lời giải thích vào bản văn.
theological_decisions:
- issue: Ý nghĩa của πρὸς ἑαυτόν trong lời cầu nguyện của người Pha-ri-si
  choice: 'Bản văn chính dịch theo nghĩa không gian: “đứng riêng một mình”'
  alternative: “đứng đó, cầu nguyện với chính mình”
  rationale: Ngữ pháp Hy Lạp cho phép hiểu ông đứng tách riêng hoặc lời cầu nguyện có tính hướng về chính mình. Chọn nghĩa không gian trong bản văn chính tránh áp đặt phán xét mạnh hơn, đồng thời chú thích bảo tồn cách hiểu phản thân và sự mỉa mai có thể có.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Lạy Đức Chúa Trời” cùng cặp xưng hô “con–Ngài” phù hợp ngữ cảnh cầu nguyện. Dấu gạch ngang làm rõ danh sách các hạng người mà người Pha-ri-si khinh miệt; “tên thu thuế này” giữ giọng điệu khinh miệt của nhân vật.
