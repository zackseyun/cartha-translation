  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: vi
  text: 'Ngài phán rằng: “Trong một thành nọ có một quan tòa không kính sợ Đức Chúa Trời và cũng không nể ai.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không tôn trọng bất cứ ai.” Tiếng Hy Lạp dùng danh từ số ít “người” theo nghĩa khái quát.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: Ngài phán rằng
  rationale: Phân từ hiện tại nối trực tiếp với câu trước và dẫn vào nội dung dụ ngôn. Tiếng Việt tự nhiên dùng mệnh đề hữu hạn; đại từ tôn kính chỉ Chúa Giê-xu được hiểu từ ngữ cảnh trước.
- source_word: Κριτής τις
  choice: một quan tòa
  rationale: τις diễn tả một nhân vật không được nêu danh. “Quan tòa” phù hợp với bối cảnh xã hội cổ đại và vẫn dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἦν ἔν τινι πόλει
  choice: Trong một thành nọ có
  rationale: Cấu trúc hiện hữu “có” là cách kể chuyện tự nhiên trong tiếng Việt; “một thành nọ” giữ tính bất định có chủ ý của τινι.
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: không kính sợ Đức Chúa Trời
  rationale: “Kính sợ” giữ được chiều kích đạo đức và tôn giáo của φοβέομαι, thay vì chỉ diễn đạt sự sợ hãi.
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: không coi trọng người nào
  rationale: ἄνθρωπον là số ít mang nghĩa khái quát, còn ἐντρέπομαι trong ngữ cảnh này chỉ sự nể trọng hay quan tâm đến người khác. Cách dịch này tự nhiên và giữ thế đối xứng với việc không kính sợ Đức Chúa Trời.
theological_decisions:
- issue: Số ít khái quát ἄνθρωπον đối lập với τὸν θεόν
  choice: người nào
  alternative: con người; bất cứ ai
  rationale: Tiếng Việt không cần giữ hình thức giống đực để biểu đạt nghĩa khái quát. “Người nào” truyền đạt rằng viên quan tòa không nể trọng bất kỳ người nào, đồng thời không biến câu thành một nhận định trừu tượng về toàn thể nhân loại.
- issue: Sắc thái của φοβούμενος khi nói về Đức Chúa Trời
  choice: kính sợ
  alternative: sợ
  rationale: “Kính sợ” bảo tồn sắc thái đạo đức-tôn giáo quen thuộc của cụm từ mà không giảm nó xuống thành nỗi khiếp sợ thuần túy.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. “Thành nọ” và “quan tòa” gợi đúng sắc thái dụ ngôn cổ đại mà vẫn rõ nghĩa đối với độc giả phổ thông; tránh lối diễn đạt quá cổ như “chẳng vị nể người ta”.
