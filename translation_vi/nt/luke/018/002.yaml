- from: 'Ngài phán rằng: “Trong một thành nọ có một quan tòa không kính sợ Đức Chúa Trời và cũng không coi trọng người nào.[a]”'
  to: 'Ngài phán rằng: “Trong một thành nọ có một quan tòa không kính sợ Đức Chúa Trời và cũng không nể ai.[a]”'
  rationale: Thay “không coi trọng người nào” bằng “không nể ai” để diễn đạt chính xác và tự nhiên hơn sắc thái “không tôn trọng/không kiêng nể bất cứ ai” của ἄνθρωπον μὴ ἐντρεπόμενος. Các thành tố khác giữ nguyên vì đã sát nguồn và phù hợp với tiếng Việt hiện đại.
