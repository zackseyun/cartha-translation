  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: vi
  text: 'Những người nghe vậy liền nói: “Thế thì ai có thể được cứu?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: nói
  rationale: Động từ aorist chỉ một lời đáp trong diễn tiến câu chuyện; tiếng Việt dùng “nói” tự nhiên, không cần biểu thị riêng thì quá khứ.
- source_word: δὲ
  choice: liền
  rationale: Ở đây δέ chuyển câu chuyện sang phản ứng của người nghe; “liền” diễn đạt tự nhiên sự tiếp nối mà không tạo nét đối lập quá mạnh.
- source_word: οἱ ἀκούσαντες
  choice: những người nghe vậy
  rationale: Phân từ được danh từ hóa chỉ những người vừa nghe lời Đức Giê-su nói; “vậy” bổ sung đối tượng đã rõ từ ngữ cảnh theo lối nói tự nhiên của tiếng Việt.
- source_word: Καὶ τίς
  choice: Thế thì ai
  rationale: καί trong câu hỏi biểu thị sự tiếp nối và phản ứng sửng sốt trước lời vừa nghe; “thế thì” truyền đạt chức năng này tự nhiên hơn cách dịch máy móc là “và”.
- source_word: δύναται
  choice: có thể
  rationale: Diễn đạt trực tiếp khả năng hoặc tính khả thi được nêu trong động từ Hy Lạp.
- source_word: σωθῆναι
  choice: được cứu
  rationale: Dạng nguyên mẫu bị động mang nghĩa được cứu; trong ngữ cảnh về việc vào vương quốc Đức Chúa Trời, đây là ý nghĩa cứu rỗi, nhưng bản dịch ngắn gọn vẫn giữ nguyên cách diễn đạt của nguồn.
theological_decisions:
- issue: Ý nghĩa của σωθῆναι trong ngữ cảnh
  choice: được cứu
  alternative: được giải cứu
  rationale: Ngữ cảnh gần nói về việc vào vương quốc Đức Chúa Trời và khả năng người giàu làm điều ấy, nên nghĩa cứu rỗi là trọng tâm. “Được cứu” giữ cách nói thần học quen thuộc mà không thêm chi tiết giáo lý ngoài câu nguồn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cụm “Thế thì” giữ được sắc thái kinh ngạc, suy luận của câu hỏi; không cần chú thích vì không có dị bản hay sự mơ hồ nào cần giải thích cho độc giả phổ thông.
