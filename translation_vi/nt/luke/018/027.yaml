base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói: “Những gì loài người không thể làm được thì Đức Chúa Trời có thể làm được.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Nhưng Đức Giê-su nói
  rationale: δέ có sắc thái chuyển tiếp hơi tương phản với phản ứng ở câu trước. Chủ ngữ được nêu rõ là Đức Giê-su để câu tiếng Việt tự nhiên và rõ nghĩa trong ngữ cảnh.
- source_word: Τὰ ἀδύνατα
  choice: Những gì ... không thể làm được
  rationale: Tính từ trung tính số nhiều được dùng như danh từ, chỉ những điều vượt quá khả năng; cấu trúc này tự nhiên trong tiếng Việt và kết hợp rõ với vế đối xứng phía sau.
- source_word: παρὰ ἀνθρώποις
  choice: loài người ... làm
  rationale: παρά với tặng cách biểu thị phạm vi hay điểm quy chiếu. “Loài người” diễn đạt nghĩa khái quát của ἀνθρώποις, còn cấu trúc “không thể làm được” truyền đạt tự nhiên sự bất khả trong phạm vi năng lực con người.
- source_word: δυνατὰ
  choice: có thể làm được
  rationale: Giữ sự đối xứng trực tiếp với “không thể làm được” và diễn đạt khả năng thực hiện, không chuyển nghĩa sang quyền năng như một phẩm tính trừu tượng.
- source_word: παρὰ τῷ θεῷ ἐστιν
  choice: Đức Chúa Trời có thể làm được
  rationale: παρά với tặng cách đặt khả năng ấy nơi Đức Chúa Trời. Cách diễn đạt chủ động tự nhiên trong tiếng Việt, đồng thời giữ nguyên thế tương phản giữa sự bất lực của con người và khả năng của Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi của điều Đức Chúa Trời có thể làm
  choice: Câu dịch khẳng định rằng những gì vượt quá khả năng của loài người thì Đức Chúa Trời có thể thực hiện, trong ngữ cảnh nói về sự cứu rỗi.
  alternative: Hiểu câu này như một mệnh đề triết học tuyệt đối về mọi hành động có thể hình dung.
  rationale: Bản Hy Lạp đối chiếu khả năng của con người với khả năng của Đức Chúa Trời mà không tự xác định mọi trường hợp trừu tượng. Bản dịch giữ lời khẳng định rộng và không thêm một kết luận triết học ngoài văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để làm rõ chủ ngữ ngầm trong tiếng Hy Lạp; dùng “loài người” cho nghĩa khái quát, không phân biệt giới. Hai vế “không thể làm được / có thể làm được” giữ cấu trúc đối xứng và trọng tâm về khả năng hành động.
