  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: vi
  text: 'Có một người lãnh đạo hỏi Ngài: “Thưa Thầy nhân lành, tôi phải làm gì để thừa hưởng sự sống đời đời?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ hơn: “Làm điều gì rồi, tôi sẽ thừa hưởng sự sống đời đời?”'
    reason: Giữ lại, trong chừng mực tiếng Việt cho phép, cấu trúc τί ποιήσας đi với động từ tương lai κληρονομήσω mà không áp đặt quan hệ thời gian “sau khi”.
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: hỏi
  rationale: Động từ này thường có nghĩa là hỏi hoặc chất vấn; “hỏi” tự nhiên và phù hợp với lối kể chuyện, không làm câu hỏi mang sắc thái trang trọng hay đối đầu quá mức.
- source_word: τις ἄρχων
  choice: một người lãnh đạo
  rationale: Đại từ bất định τις giới thiệu một người không nêu tên, còn ἄρχων chỉ người có địa vị hoặc thẩm quyền. “Một người lãnh đạo” giữ được ý nghĩa rộng mà không võ đoán chức vụ cụ thể.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Thưa Thầy nhân lành
  rationale: “Thầy” diễn đạt đúng vai trò giảng dạy của διδάσκαλος; “nhân lành” giữ nguyên phẩm chất ἀγαθός mà Chúa Giê-xu sẽ đề cập ngay ở câu sau. Từ “thưa” tạo lời xưng hô tự nhiên, kính trọng trong tiếng Việt.
- source_word: τί ποιήσας
  choice: tôi phải làm gì
  rationale: Phân từ bất định quá khứ đi với động từ tương lai diễn đạt hành động được người hỏi xem là điều kiện hoặc phương tiện. Cách dịch này tự nhiên trong tiếng Việt và giữ nguyên cách ông đặt vấn đề, còn cấu trúc sát chữ được ghi ở chú thích.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Đây là cách diễn đạt rõ ràng, quen thuộc và chính xác trong ngữ cảnh Lu-ca, vừa chỉ sự sống không cùng vừa không loại trừ sắc thái sự sống thuộc thời đại sẽ đến.
- source_word: κληρονομήσω
  choice: thừa hưởng
  rationale: Động từ mang hình ảnh nhận phần gia nghiệp. “Thừa hưởng” bảo tồn hình ảnh ấy rõ hơn những cách dịch chung như “nhận được” hay “đạt được”.
theological_decisions:
- issue: Câu hỏi về sự sống đời đời được đặt trong tương quan với hành động của con người
  choice: tôi phải làm gì để thừa hưởng sự sống đời đời
  alternative: tôi nên làm gì để nhận được sự sống đời đời
  rationale: Bản dịch giữ nguyên cách người lãnh đạo đặt câu hỏi theo hướng một hành động cần thực hiện, nhưng không biến cách đặt vấn đề của ông thành lời khẳng định thần học của tác giả và cũng không đưa lời giải thích giáo lý từ bên ngoài vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để duy trì lối kể kính trọng; “Thưa Thầy nhân lành” phù hợp lời xưng hô trực tiếp. Không xác định chức vụ cụ thể của ἄρχων và không giải quyết thay cho độc giả sức căng thần học trong câu hỏi.
