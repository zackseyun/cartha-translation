  terminology: “Thầy,” “nhân lành,” “sự sống đời đời,” và “thừa hưởng” đều nhất quán, dễ hiểu, và phù hợp với các thuật ngữ nguồn. Không cần thêm diễn giải thần học vào lời hỏi của người này.
