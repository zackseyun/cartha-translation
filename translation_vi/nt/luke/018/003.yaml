source:
  edition: SBLGNT
  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: vi
  text: 'Trong thành ấy có một bà góa. Bà cứ đến gặp ông và nói: “Xin phân xử công bằng cho tôi đối với đối phương của tôi.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Xin minh oan cho tôi trước đối phương của tôi” hoặc “Xin thực thi công lý cho tôi đối với đối phương của tôi.” Động từ Hy Lạp ở đây có thể chỉ việc đem lại công lý hoặc minh oan về mặt pháp lý, không nhất thiết là báo thù cá nhân.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: một bà góa
  rationale: Cách gọi tự nhiên, chính xác trong tiếng Việt hiện đại đối với một phụ nữ đã mất chồng; đồng thời giữ được ý nghĩa xã hội quan trọng của nhân vật trong dụ ngôn.
- source_word: δὲ
  choice: cũng
  rationale: Tiểu từ nối tiếp mạch kể; “cũng” liên kết người đàn bà góa với các nhân vật trong cùng thành mà không nhấn mạnh một sự tương phản không rõ ràng.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: Trong thành ấy ... có
  rationale: Diễn đạt cấu trúc tồn tại một cách tự nhiên trong tiếng Việt, đồng thời giữ sát địa điểm πόλις là “thành”.
- source_word: ἤρχετο πρὸς αὐτὸν
  choice: Bà cứ đến gặp ông
  rationale: Thể chưa hoàn thành trong ngữ cảnh cho thấy hành động lặp đi lặp lại; “cứ đến” làm nổi bật sự kiên trì, còn “gặp ông” tự nhiên hơn cách dịch máy móc “đến với ông”.
- source_word: λέγουσα
  choice: và nói
  rationale: Diễn đạt hành động nói đi kèm mỗi lần bà đến, phù hợp cú pháp và nhịp kể tiếng Việt.
- source_word: Ἐκδίκησόν με
  choice: Xin xử cho tôi được công lý
  rationale: Trong bối cảnh pháp đình, động từ nói đến việc bảo đảm công lý hoặc bênh vực quyền lợi hợp pháp, không nhất thiết là báo thù. “Xin” cũng phù hợp với lời thỉnh cầu trực tiếp với quan tòa.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: trước đối phương của tôi
  rationale: ἀντίδικος chỉ phía đối nghịch, đặc biệt là đối phương trong tranh tụng. “Đối phương” dễ hiểu trong tiếng Việt hiện đại; “trước” giữ được phần nào độ mở của giới từ ἀπό mà vẫn phù hợp với lời xin phân xử.
theological_decisions:
- issue: Sắc thái của ἐκδικέω trong lời cầu xin
  choice: Diễn đạt theo nghĩa pháp lý là “xử cho tôi được công lý”
  alternative: “Báo thù cho tôi” hoặc “minh oan cho tôi”
  rationale: “Báo thù” dễ khiến người đọc hiểu là trả đũa cá nhân, còn “minh oan” có thể hàm ý bà đã bị kết tội oan. Bản dịch chính giữ trọng tâm ở việc quan tòa thực thi công lý mà không quyết định trước toàn bộ bản chất vụ tranh chấp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bà cứ đến” truyền đạt rõ hành động lặp lại; “đối phương” phổ thông hơn thuật ngữ chuyên môn “kẻ đối tụng” nhưng vẫn hợp bối cảnh pháp lý.
