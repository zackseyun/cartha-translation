source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói với người ấy: “Tại sao anh gọi tôi là tốt? Không ai tốt, trừ một mình Đức Chúa Trời.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sắc thái chuyển ý và phần nào tương phản trong lời đáp của Đức Giê-su; “Còn” cũng có thể dùng, nhưng “Nhưng” làm rõ hơn tính chất chỉnh lại cách xưng hô trước đó.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Đức Giê-su nói
  rationale: Giữ nghĩa trực tiếp của λέγω là “nói”, không diễn giải thêm thành “đáp” dù lời nói xuất hiện trong một cuộc đối thoại.
- source_word: αὐτῷ
  choice: với người ấy
  rationale: Giữ đại từ được nêu rõ trong tiếng Hy Lạp mà không mở rộng thành danh từ cụ thể hơn.
- source_word: Τί
  choice: Sao
  rationale: Trong cấu trúc câu hỏi này, τί mang nghĩa hỏi lý do; “Sao” tự nhiên trong tiếng Việt hiện đại và vẫn giữ giọng trực tiếp.
- source_word: με λέγεις ἀγαθόν
  choice: anh gọi tôi là tốt
  rationale: Diễn đạt tự nhiên cấu trúc λέγεις với tính từ vị ngữ ἀγαθόν, đồng thời tránh thêm ý nghĩa không có trong nguyên văn.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: tốt
  rationale: Dịch nhất quán cả hai lần bằng “tốt”; không thêm “trọn lành” hay “tốt lành về đạo đức”, vì những cách ấy có thể thu hẹp hoặc tăng cường nghĩa quá mức.
- source_word: οὐδεὶς
  choice: Không ai
  rationale: Cách diễn đạt rõ ràng, tự nhiên, giữ nguyên tính phủ định phổ quát.
- source_word: εἰ μὴ εἷς
  choice: ngoại trừ một Đấng
  rationale: Giữ cả cấu trúc ngoại lệ lẫn sự nhấn mạnh vào số một; dùng “Đấng” để câu tiếng Việt tự nhiên khi ngay sau đó xác định là Đức Chúa Trời, nhưng không biến cụm này thành một mệnh đề thần học diễn giải.
- source_word: ὁ θεός
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, rõ nghĩa và phổ thông cho θεός khi chỉ Đức Chúa Trời.
theological_decisions:
- issue: Hàm ý Kitô học trong câu hỏi của Đức Giê-su
  choice: Giữ nguyên câu hỏi, không diễn giải thành lời phủ nhận sự tốt lành của Đức Giê-su cũng không biến nó thành lời trực tiếp tuyên bố thần tính của Ngài.
  alternative: Diễn ý theo hướng Đức Giê-su phủ nhận mình tốt theo nghĩa tuyệt đối, hoặc theo hướng Ngài mặc nhiên nhận danh xưng ấy để trực tiếp khẳng định thần tính.
  rationale: Nguyên văn tạo ra một sức căng thần học nhưng không tự giải thích trọn kết luận. Bản dịch cần bảo tồn sức căng ấy thay vì áp đặt một cách hiểu hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh” phù hợp với lời Đức Giê-su nói trực tiếp với một người đàn ông trong ngữ cảnh, không hàm ý thiếu tôn trọng. Dấu gạch ngang làm nổi bật cụm đồng vị “Đức Chúa Trời” tương ứng với εἷς ὁ θεός.
