  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: vi
  text: 'Đức Giê-su thấy người ấy thì nói: “Những người có của cải thật khó vào Vương quốc Đức Chúa Trời biết bao!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: thấy ... thì
  rationale: Phân từ bất định quá khứ của ὁράω được diễn đạt bằng kết cấu thời gian tự nhiên trong tiếng Việt, vẫn giữ quan hệ với động từ chính.
- source_word: δὲ
  choice: thì
  rationale: δέ là liên từ nhẹ để tiếp diễn câu chuyện; trong kết cấu tiếng Việt, “thì” nối hoàn cảnh Đức Giê-su nhìn thấy người ấy với lời Ngài nói mà không tạo sắc thái đối lập quá mạnh.
- source_word: αὐτὸν
  choice: người ấy
  rationale: Đại từ chỉ vị quan giàu có trong ngữ cảnh trước; “người ấy” rõ nghĩa và trang trọng tự nhiên hơn “ông ấy” khi câu đứng riêng.
- source_word: Πῶς δυσκόλως
  choice: thật khó biết bao
  rationale: Giữ sức cảm thán về mức độ của cụm Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: người có của cải
  rationale: χρήματα có thể chỉ tiền bạc, tài sản hay của cải; “của cải” giữ nghĩa rộng và không thu hẹp thành tiền mặt בלבד.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: vào vương quốc Đức Chúa Trời
  rationale: Diễn đạt trực tiếp chuyển động đi vào và giữ thuật ngữ thần học quen thuộc, dễ hiểu.
- source_word: εἰσπορεύονται
  choice: vào
  rationale: Động từ hiện tại được diễn đạt tự nhiên trong mệnh đề cảm thán tiếng Việt; câu vẫn nêu một nhận định khái quát.
theological_decisions:
- issue: Mức độ khó khăn của người giàu khi vào vương quốc Đức Chúa Trời
  choice: Một nhận định khái quát rằng người có của cải rất khó vào vương quốc Đức Chúa Trời
  alternative: Khẳng định rằng mọi người giàu tuyệt đối không thể vào vương quốc Đức Chúa Trời
  rationale: Cụm Πῶς δυσκόλως nhấn mạnh sự khó khăn chứ trong chính câu này chưa nói là tuyệt đối bất khả; bản dịch giữ nguyên căng thẳng thần học mà không giải quyết thay cho văn mạch tiếp theo.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời” theo lối gọi tôn kính; cấu trúc cảm thán “thật khó biết bao” phản ánh lực của nguyên văn mà vẫn tự nhiên trong tiếng Việt.
