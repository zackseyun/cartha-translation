    issue: Trật tự từ trong câu cảm thán có thể gây mơ hồ cú pháp.
    rationale: Trong “Người có của cải vào vương quốc Đức Chúa Trời thật khó biết bao!”, cụm mở đầu có thể được đọc như chủ ngữ của “khó.” Đưa “thật khó” lên trước động từ “vào” làm rõ rằng sự khó khăn thuộc về việc vào vương quốc, tương ứng với Πῶς δυσκόλως ... εἰσπορεύονται.
