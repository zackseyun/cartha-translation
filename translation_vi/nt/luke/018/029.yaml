  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính và đầy đủ danh sách trong tiếng Hy Lạp: nhà, vợ, anh em, cha mẹ, con cái, cùng động cơ “vì vương quốc Đức Chúa Trời”. Tuy nhiên, οἰκίαν là số ít (“một nhà/căn nhà”), không phải cách nói số nhiều “nhà cửa”.'
  naturalness: Cụm “Thật, tôi nói với anh em” không tự nhiên trong lời nói trực tiếp trang trọng và tạo sự lệch giọng khi người dẫn truyện gọi nhân vật là “Ngài” nhưng nhân vật tự xưng “tôi”. “Quả thật, Ta nói với anh em” là công thức tiếng Việt trang trọng, rõ ràng và phù hợp hơn.
  terminology: Giữ “vương quốc Đức Chúa Trời” theo lựa chọn thuật ngữ của bản nháp; cách dịch này chuyển đạt βασιλεία τοῦ θεοῦ mà không diễn giải thêm. “Anh em” có thể bao quát các anh chị em trong danh sách quan hệ gia đình, phù hợp với ἀδελφούς trong ngữ cảnh này.
  issues:
