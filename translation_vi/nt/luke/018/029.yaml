source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: vi
  text: 'Ngài nói với họ: “Quả thật, Ta nói với anh em, không ai đã rời bỏ một căn nhà, vợ, anh em, cha mẹ hay con cái vì vương quốc Đức Chúa Trời,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Thật, tôi nói với anh em
  rationale: Giữ công thức nhấn mạnh trang trọng của lời Đức Giê-su, đồng thời dùng cách diễn đạt rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀφῆκεν
  choice: đã rời bỏ
  rationale: Diễn đạt hành động lìa khỏi hoặc từ bỏ những quan hệ và tài sản được liệt kê, không thêm ý rằng người ấy ruồng bỏ trách nhiệm.
- source_word: οἰκίαν
  choice: nhà cửa
  rationale: Trong ngữ cảnh liệt kê những điều một người rời bỏ, “nhà cửa” tự nhiên hơn “một căn nhà” và vẫn giữ được nghĩa về nơi ở/gia cư.
- source_word: ἀδελφοὺς
  choice: anh em
  rationale: Giữ nghĩa số nhiều của quan hệ anh chị em; tiếng Việt thường dùng “anh em” theo nghĩa bao quát trong danh sách gia đình.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: vì vương quốc Đức Chúa Trời
  rationale: “Vì” truyền đạt lý do hoặc mục đích; “vương quốc Đức Chúa Trời” giữ trọng tâm về sự trị vì và vương quyền của Đức Chúa Trời.
theological_decisions:
- issue: Phạm vi của lời hứa đối với việc rời bỏ gia đình
  choice: Dịch sát danh sách và cụm “vì vương quốc Đức Chúa Trời”, không giải thích thêm động cơ hay giới hạn đạo đức.
  alternative: Diễn giải là từ bỏ hoàn toàn trách nhiệm gia đình để phục vụ Đức Chúa Trời.
  rationale: Nguyên văn nêu việc rời bỏ nhưng không giải thích tại đây hình thức hay hoàn cảnh cụ thể; bản dịch cần giữ nguyên sức căng đó và tránh áp đặt một kết luận giáo phái.
- issue: Cách gọi βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: nước Đức Chúa Trời
  rationale: “Vương quốc” minh bạch với độc giả hiện đại và giữ được trường nghĩa về vương quyền; không thu hẹp thành một lãnh thổ chính trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ dấu phẩy cuối câu vì câu nói tiếp tục sang câu 30; không thêm đại từ chủ thể “Đức Giê-su” vì câu Hy Lạp chỉ dùng “Ngài” theo mạch văn.
