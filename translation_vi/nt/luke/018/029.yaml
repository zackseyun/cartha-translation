  - severity: medium
    issue: “Thật, tôi nói với anh em” thiếu tự nhiên và không nhất quán về giọng xưng hô.
    rationale: Ἀμὴν λέγω ὑμῖν là công thức khẳng định trang trọng. “Quả thật, Ta nói với anh em” phản ánh rõ công thức này và nhất quán với văn phong lời Đức Giê-su.
