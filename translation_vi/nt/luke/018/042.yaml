  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: vi
  text: 'Đức Giê-su nói với anh: “Hãy sáng mắt lại[a]; đức tin của anh đã cứu anh[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy nhìn thấy lại” hoặc “Hãy được lại thị lực.” Trong ngữ cảnh chữa lành, mệnh lệnh Hy Lạp có thể chỉ việc có lại khả năng nhìn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đức tin của anh đã chữa lành anh” hoặc “đã làm cho anh được khỏe mạnh.” Động từ Hy Lạp có thể nói đến sự chữa lành cũng như sự cứu rỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: (không dịch thành từ riêng)
  rationale: Trong mạch kể tiếng Việt, phép nối đơn giản được thể hiện tự nhiên bằng việc tiếp tục câu chuyện; thêm “và” ở đầu câu sẽ kém tự nhiên mà không bổ sung ý nghĩa.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Cách gọi tên trang trọng, tự nhiên trong tiếng Việt hiện đại; không thêm tước hiệu “Chúa” vốn không hiện diện trong cụm từ Hy Lạp này.
- source_word: εἶπεν αὐτῷ
  choice: nói với anh
  rationale: Diễn đạt trực tiếp động từ nói và tân ngữ gián tiếp; “anh” phù hợp với người đàn ông đã được nhắc đến trong ngữ cảnh.
- source_word: Ἀνάβλεψον
  choice: Hãy sáng mắt lại
  rationale: Trong ngữ cảnh chữa lành người mù, động từ chỉ việc có lại khả năng nhìn, chứ không đơn thuần là ngước nhìn. Cách nói này ngắn gọn, tự nhiên và có sắc thái mệnh lệnh.
- source_word: πίστις
  choice: đức tin
  rationale: Giữ thuật ngữ quen thuộc và chiều kích tin cậy nơi Đức Giê-su; không chuyển thành “lòng trung tín”, vốn khó phù hợp hơn trong ngữ cảnh này.
- source_word: σέσωκέν
  choice: đã cứu
  rationale: Giữ phạm vi nghĩa rộng của σῴζω, có thể bao gồm cả sự chữa lành thể chất lẫn sự cứu rỗi, thay vì thu hẹp câu chỉ còn việc khỏi bệnh. Thì hoàn thành được thể hiện tự nhiên bằng “đã”.
theological_decisions:
- issue: Phạm vi nghĩa của σῴζω trong trình thuật chữa lành
  choice: đã cứu anh
  alternative: đã chữa lành anh; đã làm cho anh được khỏe mạnh
  rationale: Ngữ cảnh rõ ràng bao gồm việc phục hồi thị lực, nhưng động từ Hy Lạp cũng có nghĩa cứu. Bản dịch chính giữ nguyên độ căng giữa chữa lành và cứu rỗi, không âm thầm giới hạn ý nghĩa vào thân thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Sáng mắt lại” là cách nói tự nhiên trong tiếng Việt về sự phục hồi thị lực. Các dấu chú thích được đặt ngay sau những cụm từ có phương án dịch khác.
