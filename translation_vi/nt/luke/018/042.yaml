  source_fidelity: Bản dịch truyền đạt đúng cấu trúc và ý chính của καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε. “Hãy sáng mắt lại” phù hợp với Ἀνάβλεψον trong ngữ cảnh chữa lành; “đức tin của anh đã cứu anh” bảo toàn thì hoàn thành của σέσωκέν và không thu hẹp động từ này chỉ còn nghĩa chữa lành thể xác.
  naturalness: Câu văn tự nhiên, rõ ràng và có sắc thái trang trọng vừa phải trong tiếng Việt hiện đại. Cách xưng hô “anh” nhất quán trong câu và phù hợp với một người đàn ông trong ngữ cảnh tường thuật.
  terminology: “Đức Giê-su” là cách gọi trang trọng, không thêm tước hiệu không có trong nguyên văn. “Đức tin” và “đã cứu” là các lựa chọn thuật ngữ phù hợp; đặc biệt “đã cứu” giữ được độ rộng ngữ nghĩa chữa lành/cứu rỗi của σῴζω. Các chú thích nêu các phương án thay thế hữu ích mà không áp đặt một diễn giải giáo phái.
