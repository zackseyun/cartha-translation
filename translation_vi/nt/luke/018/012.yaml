  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: vi
  text: Tôi kiêng ăn mỗi tuần hai lần[a]; tôi dâng một phần mười mọi thứ tôi thu được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Theo nghĩa đen: “hai lần của ngày Sa-bát”; đây là một thành ngữ có nghĩa là “mỗi tuần hai lần.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Tôi kiêng ăn
  rationale: Thì hiện tại ở đây diễn tả thói quen thường xuyên trong lời tự thuật; “kiêng ăn” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δὶς τοῦ σαββάτου
  choice: mỗi tuần hai lần
  rationale: Cụm này theo nghĩa đen liên hệ đến ngày Sa-bát nhưng là thành ngữ chỉ chu kỳ tuần; cách dịch này truyền đạt đúng tần suất và tránh hiểu lầm rằng ông kiêng ăn hai lần vào ngày Sa-bát.
- source_word: ἀποδεκατῶ
  choice: tôi dâng một phần mười
  rationale: Động từ chỉ việc nộp hoặc dâng một phần mười. Cách diễn đạt này dễ hiểu hơn thuật ngữ tôn giáo chuyên biệt mà vẫn giữ chính xác nội dung.
- source_word: πάντα ὅσα
  choice: mọi thứ
  rationale: 'Hai từ kết hợp diễn tả phạm vi bao quát: tất cả những gì thuộc hành động được nói đến.'
- source_word: κτῶμαι
  choice: mình thu được
  rationale: Động từ trung thái mang nghĩa có được hoặc thu về cho mình, chứ không đơn thuần chỉ tình trạng sở hữu; “thu được” giữ được sắc thái ấy và phù hợp với ngữ cảnh dâng phần mười.
theological_decisions:
- issue: Ý nghĩa của τοῦ σαββάτου trong lời nói về kiêng ăn
  choice: Hiểu theo thành ngữ thời gian là “mỗi tuần”
  alternative: Dịch sát chữ là “của ngày Sa-bát”
  rationale: Cụm này diễn tả tần suất trong chu kỳ tuần, không đưa ra một khẳng định thần học về việc giữ ngày Sa-bát. Dịch theo nghĩa thành ngữ tránh khiến độc giả tưởng rằng người nói kiêng ăn hai lần ngay trong một ngày Sa-bát.
- issue: Phạm vi của việc dâng phần mười
  choice: “mọi thứ mình thu được”
  alternative: “mọi thứ mình có”
  rationale: κτῶμαι thường chỉ điều người ta có được hoặc thu về. Giữ nghĩa động này tránh biến lời tuyên bố thành việc dâng phần mười trên toàn bộ tài sản đang sở hữu.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “tôi” giữ giọng tự thuật trực tiếp; “mình” trong mệnh đề phụ tránh lặp nặng nề mà vẫn quy chiếu rõ về người nói.
