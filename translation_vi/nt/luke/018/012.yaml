  to: Tôi kiêng ăn mỗi tuần hai lần[a]; tôi dâng một phần mười mọi thứ tôi thu được.
  rationale: Giữ nguyên nghĩa thành ngữ “mỗi tuần hai lần” và việc dâng một phần mười trên mọi điều có được. Chỉnh chú thích để phản ánh đúng hơn hình thức nguyên ngữ mà không làm mất nghĩa thành ngữ, đồng thời nhất quán đại từ trong câu.
