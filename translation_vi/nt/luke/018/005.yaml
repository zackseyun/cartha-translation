  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: vi
  text: “Nhưng vì bà góa này cứ gây phiền toái cho ta, ta sẽ phân xử cho bà ấy[a], kẻo bà ấy cứ đến mãi làm ta kiệt sức[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “minh oan cho bà ấy” hoặc, trong một số ngữ cảnh, “báo thù cho bà ấy”; ở đây động từ Hy Lạp nói đến việc thực thi công lý trong một vụ kiện.'
    reason: alternative_reading
  - marker: b
    text: 'Theo nghĩa đen: “đánh bầm mắt ta”; đây có thể là thành ngữ mang nghĩa “làm ta kiệt sức” hoặc “bào mòn ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: nhưng vì ... cứ gây phiền toái cho ta
  rationale: διά với động từ nguyên mẫu có mạo từ diễn tả nguyên nhân, còn γε nhấn mạnh lý do này. Thì hiện tại của παρέχειν cùng thành ngữ παρέχειν κόπον cho thấy sự quấy rầy đang tiếp diễn.
- source_word: τὴν χήραν ταύτην
  choice: bà góa này
  rationale: Giữ nguyên danh từ chỉ hoàn cảnh xã hội dễ bị tổn thương của nhân vật và sắc thái của đại từ chỉ định.
- source_word: ἐκδικήσω αὐτήν
  choice: ta sẽ xử công lý cho bà ấy
  rationale: Trong bối cảnh pháp lý, động từ nói đến việc thực thi công lý hay minh oan cho người phụ nữ, không nhất thiết là báo thù. Cách diễn đạt này cũng giữ được mối liên hệ từ vựng với chủ đề công lý ở các câu kế tiếp.
- source_word: εἰς τέλος ἐρχομένη
  choice: bà ấy cứ đến mãi
  rationale: Diễn tả hành động đến lặp đi lặp lại và sắc thái kéo dài đến mức người phán xét bực bội, đồng thời tránh ấn định quá cứng εἰς τέλος là 'mãi mãi'.
- source_word: ὑπωπιάζῃ με
  choice: làm ta kiệt sức
  rationale: Nghĩa đen gợi việc đánh dưới mắt, nhưng trong ngữ cảnh đây tự nhiên hơn là thành ngữ chỉ sự bào mòn, làm mệt mỏi vì liên tục gây áp lực.
theological_decisions:
- issue: Nghĩa của ἐκδικήσω trong dụ ngôn về cầu nguyện và công lý
  choice: ta sẽ xử công lý cho bà ấy
  alternative: ta sẽ báo thù cho bà ấy; ta sẽ minh oan cho bà ấy
  rationale: Bối cảnh là một vụ khiếu kiện cần được xét xử. 'Xử công lý' giữ nét pháp lý và chủ đề công lý của phân đoạn mà không đưa thêm sắc thái trả thù.
- issue: Mức độ cụ thể của ὑπωπιάζῃ
  choice: làm ta kiệt sức
  alternative: đánh ta thâm mắt; làm ta mệt mỏi
  rationale: Giữ cách hiểu thành ngữ phù hợp với sự đeo bám trong câu chuyện, nhưng ghi chú nghĩa đen mạnh hơn để bảo tồn hình ảnh và độ căng của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và tự nhiên trong lời độc thoại của vị quan tòa. Đại từ “ta” phù hợp với địa vị và thái độ của nhân vật; “bà ấy” tránh sắc thái khinh miệt không có trong nguyên văn.
