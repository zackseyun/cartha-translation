  to: 'Đức Giê-su dừng lại[a] và ra lệnh đưa người ấy đến chỗ Ngài[b]. Khi người ấy đến gần, Ngài hỏi:'
  rationale: Sửa “truyền đưa” thành “ra lệnh đưa” để tái tạo rõ và tự nhiên cấu trúc mệnh lệnh của bản gốc. Thay “đến với Ngài” bằng “đến chỗ Ngài” cho phù hợp hơn với chuyển động không gian trong ngữ cảnh. Các neo chú thích vẫn gắn đúng với lựa chọn từ vựng được chú giải.
