  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: vi
  text: 'Đức Giê-su dừng lại[a] và ra lệnh đưa người ấy đến chỗ Ngài[b]. Khi người ấy đến gần, Ngài hỏi:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đứng lại”. Phân từ Hy Lạp cho biết Đức Giê-su ngừng bước tại chỗ; “dừng lại” diễn đạt ý này tự nhiên trong tiếng Việt.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “dẫn người ấy đến chỗ Ngài”. Động từ Hy Lạp có thể chỉ việc dẫn hoặc đưa một người đi; ở đây “đưa ... đến” phù hợp với ngữ cảnh rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: σταθεὶς
  choice: dừng lại
  rationale: Phân từ aorist của ἵστημι được dùng theo nghĩa nội động từ, cho biết Đức Giê-su ngừng bước; “dừng lại” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: và
  rationale: δέ là liên từ chuyển tiếp nhẹ trong mạch kể chuyện; “và” nối tiếp diễn biến tự nhiên mà không tạo sắc thái tương phản quá mạnh.
- source_word: ἐκέλευσεν
  choice: truyền
  rationale: κελεύω diễn tả việc đưa ra mệnh lệnh; “truyền” giữ được thẩm quyền của lời Đức Giê-su mà vẫn trang trọng, gọn và quen thuộc.
- source_word: ἀχθῆναι
  choice: đưa ... đến
  rationale: Động từ nguyên mẫu thụ động aorist của ἄγω có thể mang nghĩa được dẫn hoặc được đưa đến. Cách diễn đạt “truyền đưa người ấy đến” tự nhiên trong ngữ cảnh những người khác đưa người mù đến gần Đức Giê-su.
- source_word: πρὸς αὐτόν
  choice: đến với Ngài
  rationale: πρός với đối cách chỉ chuyển động hướng đến Đức Giê-su; “đến với Ngài” diễn đạt rõ đích đến trong tiếng Việt.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Khi người ấy đến gần
  rationale: Kết cấu sở hữu cách tuyệt đối với phân từ aorist của ἐγγίζω mang ý nghĩa thời gian. “Người ấy” chỉ người mù vừa được nhắc đến và tránh sự mơ hồ về chủ thể.
- source_word: ἐπηρώτησεν
  choice: Ngài hỏi
  rationale: ἐπερωτάω ở đây có nghĩa thông dụng là hỏi. Việc nêu “Ngài” giúp tiếng Việt xác định rõ Đức Giê-su là chủ thể của động từ.
- source_word: ὁ Ἰησοῦς
  choice: Đức Giê-su
  rationale: Dùng cách viết tên riêng và kính xưng phổ biến trong tiếng Việt hiện đại.
