    rationale: ἐκέλευσεν ἀχθῆναι là “ra lệnh cho [người ấy] được đưa/dẫn đến”; tiếng Việt cần một động từ mệnh lệnh rõ ràng như “ra lệnh” trước cụm nguyên mẫu “đưa người ấy...”.
  - severity: low
    issue: “Đến với Ngài” có thể dùng được, nhưng “đến chỗ Ngài” tự nhiên hơn trong cảnh chuyển động vật lý hướng đến một người.
    rationale: πρὸς αὐτόν chỉ hướng chuyển động đến nơi Đức Giê-su đang ở; “đến chỗ Ngài” diễn đạt trực tiếp và thành ngữ hơn.
