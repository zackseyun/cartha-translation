reference: Luke 18:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: vi
  text: Người ta còn đem cả trẻ sơ sinh đến với Chúa Giê-su để Người chạm vào chúng[a]. Khi các môn đệ thấy vậy[c], họ quở trách họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “các em bé.” Từ Hy Lạp chỉ những trẻ còn rất nhỏ, đặc biệt là trẻ sơ sinh.
    reason: lexical_alternative
  - marker: b
    text: Tức là những người đem trẻ sơ sinh đến với Chúa Giê-su.
    reason: referent_clarification
  - marker: c
    text: Trong các trình thuật song song, việc Chúa Giê-su chạm vào các em gắn với việc Người đặt tay và ban phước cho các em (Ma-thi-ơ 19:13; Mác 10:13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: người ta ... đem ... đến
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra hoặc lặp lại; tiếng Việt có thể truyền đạt tự nhiên qua ngữ cảnh kể chuyện mà không cần thêm từ chỉ tiến hành.
- source_word: δὲ
  choice: Nhưng
  rationale: Ở lần xuất hiện thứ hai, liên từ đánh dấu sự tương phản giữa việc đem các em bé đến và phản ứng của các môn đồ. Liên từ đầu câu được thể hiện bằng mạch kể tự nhiên, không cần dịch riêng.
- source_word: καὶ τὰ βρέφη
  choice: còn đem cả các em bé
  rationale: καὶ mang sắc thái nhấn mạnh; “cả” truyền đạt ý “ngay cả,” còn βρέφη chỉ trẻ rất nhỏ, nên “các em bé” vừa chính xác vừa tự nhiên.
- source_word: αὐτῷ
  choice: đến với Đức Chúa Jêsus
  rationale: Đại từ chỉ về Đức Chúa Jêsus; nêu rõ danh xưng giúp câu đứng riêng dễ hiểu trong tiếng Việt mà không thay đổi đối tượng quy chiếu.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: để Ngài chạm vào các em
  rationale: Giữ nguyên quan hệ mục đích của ἵνα và nghĩa trực tiếp “chạm” của ἅπτομαι, không đưa ý “ban phước” vào chính văn.
- source_word: ἰδόντες
  choice: khi thấy vậy
  rationale: Phân từ bất định được diễn đạt tự nhiên như một mệnh đề thời gian; “vậy” chỉ toàn bộ sự việc vừa nêu.
- source_word: οἱ μαθηταὶ
  choice: các môn đồ
  rationale: Cách gọi quen thuộc, trang trọng và trực tiếp tương ứng với danh từ Hy Lạp.
- source_word: ἐπετίμων αὐτοῖς
  choice: quở trách họ
  rationale: “Quở trách” giữ được sắc thái mạnh của ἐπιτιμάω; “họ” bảo lưu đại từ và trong ngữ cảnh chỉ những người đem các em bé đến.
theological_decisions:
- issue: Bản chất hành động Đức Chúa Jêsus được xin thực hiện đối với các em
  choice: chạm vào các em
  alternative: ban phước cho các em / đặt tay trên các em
  rationale: Động từ ἅπτηται trực tiếp có nghĩa là “chạm.” Các sách Tin Lành song song liên hệ hành động ấy với việc ban phước và đặt tay, nhưng không nên thay thế cách diễn đạt dè dặt hơn của Lu-ca trong chính văn.
- issue: Đối tượng bị các môn đồ quở trách
  choice: những người đem các em bé đến
  alternative: các em bé
  rationale: Đại từ αὐτοῖς về ngữ pháp có thể gây chút mơ hồ khi đứng riêng, nhưng theo mạch văn hợp lý nhất là chỉ những người đang đem các em đến; chú thích làm rõ mà vẫn giữ đại từ trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Các em bé” tự nhiên hơn “các trẻ sơ sinh” trong chính văn nhưng vẫn giữ rõ độ tuổi rất nhỏ; “quở trách” bảo toàn sắc thái nghiêm khắc. Các dấu chú thích đều xuất hiện trong chính văn.
