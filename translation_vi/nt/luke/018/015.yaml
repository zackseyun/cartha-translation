revisions:
- from: Người ta còn đem cả các em bé đến với Đức Chúa Jêsus để Ngài chạm vào các em[a]. Nhưng khi thấy vậy[c], các môn đồ quở trách họ[b].
  to: Người ta còn đem cả trẻ sơ sinh đến với Chúa Giê-su để Người chạm vào chúng[a]. Khi các môn đệ thấy vậy[c], họ quở trách họ[b].
  rationale: Sửa “các em bé” thành “trẻ sơ sinh” để phản ánh chính xác βρέφη, đồng thời chuyển cách viết tên riêng và thuật ngữ chỉ các môn đồ sang tiếng Việt chuẩn hiện đại. Cấu trúc “Khi các môn đệ thấy vậy” biểu đạt tự nhiên phân từ ἰδόντες. Đại từ “họ” ở cuối câu được giữ theo nguyên ngữ, còn chú thích b xác định đối tượng bị quở trách là những người đem trẻ đến.
  reviewer_model: gpt-5.6-terra
