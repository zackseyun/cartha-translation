  source_fidelity: 'Bản dịch giữ đúng các yếu tố chính của câu Hy Lạp: hành động đem trẻ đến, sắc thái nhấn mạnh của καὶ, mục đích để Chúa chạm vào trẻ, và việc các môn đồ quở trách những người đem trẻ đến. Tuy nhiên, βρέφη chỉ rõ trẻ rất nhỏ/trẻ sơ sinh hơn là cách gọi rộng hơn “các em bé”; và cách viết “Đức Chúa Jêsus” không phù hợp tối ưu với tiếng Việt chuẩn hiện đại.'
