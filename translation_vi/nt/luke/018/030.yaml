id: LUK.18.30
reference: Luke 18:30
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: vi
  text: thì chắc chắn sẽ nhận được gấp nhiều lần trong thời này, và sự sống đời đời trong thời đại sắp đến[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “thời đại sẽ đến.”'
    reason: Ghi nhận cách diễn đạt khác của αἰῶνι τῷ ἐρχομένῳ, bảo toàn sắc thái của phân từ ἐρχομένῳ mà không hàm ý dị bản.
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: chắc chắn sẽ
  rationale: Cấu trúc phủ định nhấn mạnh đi với động từ giả định diễn tả một lời bảo đảm chắc chắn; chuyển sang câu khẳng định mạnh là tự nhiên trong tiếng Việt và tránh lối phủ định kép khó hiểu.
- source_word: ἀπολάβῃ
  choice: nhận được
  rationale: Động từ có thể mang nghĩa nhận lại hoặc nhận được. Trong ngữ cảnh đền bù cho những gì đã từ bỏ, “nhận được” tự nhiên mà không nhấn quá mức sắc thái của tiền tố.
- source_word: πολλαπλασίονα
  choice: gấp nhiều lần
  rationale: Giữ rõ ý phần nhận được tăng lên nhiều lần, đồng thời dùng cách nói thông dụng trong tiếng Việt hiện đại.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: trong thời kỳ hiện tại
  rationale: καιρός chỉ một thời kỳ hay thời điểm xác định; “thời kỳ hiện tại” làm rõ sự tương phản với thời đại sắp đến.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: trong thời đại sắp đến
  rationale: Giữ hình ảnh hai thời đại của bối cảnh Do Thái và Tân Ước, thay vì làm phẳng thành ý niệm chung chung về tương lai.
- source_word: ζωὴν αἰώνιον
  choice: sự sống đời đời
  rationale: Đây là cách diễn đạt quen thuộc, chính xác và trang trọng trong tiếng Việt cho khái niệm sự sống thuộc thời đại tương lai và không chấm dứt.
- source_word: ὃς
  choice: thì
  rationale: Đại từ quan hệ nối trực tiếp với người được mô tả ở câu trước. Vì đây là phần tiếp nối của một câu, “thì” thể hiện tự nhiên quan hệ kết quả trong cú pháp tiếng Việt mà không biến câu thành một mệnh đề khái quát độc lập.
theological_decisions:
- issue: Cách diễn đạt cánh chung αἰῶνι τῷ ἐρχομένῳ
  choice: thời đại sắp đến
  alternative: thời đại sẽ đến
  rationale: Cách dịch chính giữ sự tương phản thần học giữa thời kỳ hiện tại và trật tự tương lai, đồng thời bảo toàn sắc thái đang đến của phân từ ἐρχομένῳ. Phương án khác được ghi chú vì cũng phản ánh trực tiếp cấu trúc Hy Lạp.
- issue: Quan hệ giữa phần thưởng hiện tại và sự sống đời đời
  choice: Giữ cả hai trong cùng một lời hứa nhưng lặp lại “sẽ nhận được” trước “sự sống đời đời”
  alternative: Chỉ dùng một lần “sẽ nhận được” cho cả hai bổ ngữ
  rationale: Việc lặp động từ là điều chỉnh cú pháp tự nhiên trong tiếng Việt, làm rõ rằng phần nhận gấp nhiều lần thuộc thời hiện tại còn sự sống đời đời thuộc thời đại sắp đến, nhưng không thêm điều kiện hay giải thích giáo lý ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch được giữ như một mệnh đề tiếp nối câu trước; “gấp nhiều lần” là cách nói tự nhiên, còn “thời đại sắp đến” duy trì sắc thái cánh chung của nguyên văn.
