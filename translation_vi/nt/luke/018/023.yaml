  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: vi
  text: Nhưng khi nghe những điều ấy, ông trở nên vô cùng buồn rầu[a], vì ông rất giàu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đau buồn sâu sắc.” Tính từ Hy Lạp diễn tả nỗi buồn hoặc đau đớn rất mãnh liệt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: khi nghe
  rationale: Phân từ bất định có ý nghĩa thời gian trong ngữ cảnh; cách dịch này tự nhiên và giữ đúng trình tự dẫn đến phản ứng của ông.
- source_word: ταῦτα
  choice: những lời ấy
  rationale: Đại từ chỉ định số nhiều quy chiếu đến những điều Đức Giê-su vừa nói; “những lời ấy” tự nhiên hơn “những điều ấy” trong ngữ cảnh lời thoại.
- source_word: περίλυπος
  choice: vô cùng buồn rầu
  rationale: Tính từ diễn tả nỗi buồn hoặc đau đớn sâu sắc; “vô cùng buồn rầu” giữ được cường độ mạnh mà vẫn dễ hiểu.
- source_word: ἐγενήθη
  choice: trở nên
  rationale: Động từ chỉ sự chuyển sang một trạng thái, chứ không chỉ đơn thuần mô tả trạng thái sẵn có.
- source_word: πλούσιος
  choice: giàu
  rationale: Cách tương đương trực tiếp, tự nhiên và phổ thông cho tính từ chỉ sự giàu có.
- source_word: σφόδρα
  choice: rất
  rationale: Trạng từ nhấn mạnh mức độ giàu có; “rất giàu” là cách diễn đạt tự nhiên trong tiếng Việt hiện đại và vẫn truyền đạt rõ sức nhấn mạnh.
- source_word: δὲ
  choice: Nhưng
  rationale: Nêu bật sự tương phản giữa lời Đức Giê-su vừa phán và phản ứng buồn rầu của người nghe.
- source_word: γὰρ
  choice: vì
  rationale: Giới thiệu nguyên nhân giải thích cho nỗi buồn của ông.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng phổ thông. Giữ cấu trúc tương phản và quan hệ nguyên nhân của nguyên văn; dùng “ông” phù hợp với nhân vật nam đã được nhắc đến trong văn mạch.
