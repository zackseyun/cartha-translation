  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: vi
  text: 'Những người đi phía trước quở trách anh, bảo anh im đi; nhưng anh càng kêu lớn hơn: “Lạy Con Đa-vít, xin thương xót con!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: những người đi phía trước
  rationale: Phân từ hiện tại dùng như danh từ, chỉ những người ở phía trước trong đoàn người; cách dịch giữ rõ ý không gian mà không gán cho họ vai trò lãnh đạo.
- source_word: ἐπετίμων αὐτῷ
  choice: quở trách anh
  rationale: Động từ ở thì chưa hoàn thành diễn tả hành động đang diễn ra hoặc lặp lại; “quở trách” giữ được sắc thái khiển trách nghiêm khắc.
- source_word: ἵνα σιγήσῃ
  choice: bảo anh im đi
  rationale: Mệnh đề ἵνα diễn tả điều họ muốn anh làm. Cách nói này tự nhiên trong tiếng Việt và truyền đạt mệnh lệnh hàm chứa trong lời quở trách.
- source_word: αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν
  choice: nhưng anh càng kêu lớn hơn
  rationale: “Nhưng anh” thể hiện sự tương phản; thì chưa hoàn thành của ἔκραζεν gợi hành động tiếp diễn, còn πολλῷ μᾶλλον được diễn đạt tự nhiên bằng “càng… hơn.” “Lớn” phù hợp ngữ cảnh của hành động kêu nhưng không thêm nội dung ngoài ý cường độ.
- source_word: Υἱὲ Δαυίδ
  choice: Lạy Con vua Đa-vít
  rationale: Giữ nguyên tước hiệu thuộc dòng vua Đa-vít và sắc thái xưng hô trực tiếp. Thêm “vua” giúp độc giả Việt hiểu “Đa-vít” trong tước hiệu này mà không thay thế danh xưng.
- source_word: ἐλέησόν με
  choice: xin thương xót con
  rationale: Mệnh lệnh cầu khẩn được chuyển bằng “xin”; “thương xót” giữ ý lòng thương xót và sắc thái khẩn thiết, còn đại từ “con” phù hợp lời cầu xin kính cẩn.
theological_decisions:
- issue: Ý nghĩa Mê-si của Υἱὲ Δαυίδ
  choice: Dịch trong chính văn là “Con vua Đa-vít.”
  alternative: Hiểu đây chỉ là một cách xưng hô tôn kính thông thường.
  rationale: Trong mạch truyện Lu-ca, đây là tước hiệu mang ý nghĩa vương quyền thuộc dòng Đa-vít và hàm ý Mê-si. Bản dịch giữ tước hiệu mà không diễn giải thêm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” cho người mù trong lời kể, nhưng dùng “Lạy… xin… con” trong lời khẩn cầu để phản ánh sự kính cẩn và cấp thiết.
