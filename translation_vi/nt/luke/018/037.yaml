review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hành động đang diễn ra và danh xưng Ναζωραῖος, nhưng thêm “Đức Chúa” vào trước tên Giê-su. Danh xưng này không có trong câu Hy Lạp (chỉ có Ἰησοῦς ὁ Ναζωραῖος), nên cần bỏ để không thêm nội dung tôn xưng ngoài nguyên văn.
  naturalness: “Họ báo cho ông biết” và “đang đi ngang qua” là tiếng Việt hiện đại, rõ ràng, phù hợp mạch truyện. Dùng “Giê-su” là dạng chính tả phổ biến, tự nhiên trong tiếng Việt Kinh Thánh hiện đại.
  terminology: “Người Na-xa-rét” giữ được danh xưng có mạo từ/dạng danh từ của ὁ Ναζωραῖος tốt hơn cách diễn giải “quê Na-xa-rét.” Không nên thêm “Đức Chúa,” vì đây là tước hiệu không hiện diện trong nguồn của câu này.
  issues:
  - severity: high
    issue: Thêm tước hiệu “Đức Chúa”
    rationale: Nguyên văn SBLGNT ghi “Ἰησοῦς ὁ Ναζωραῖος” (“Giê-su, người Na-xa-rét”), không có κύριος hay một tước hiệu tương đương. Thêm “Đức Chúa” làm bản dịch vượt quá nội dung câu.
  - severity: low
    issue: Chính tả tên riêng “Jêsus”
    rationale: “Giê-su” phù hợp hơn với cách dùng phổ biến trong tiếng Việt tiêu chuẩn hiện đại. Đây là điều chỉnh về tính nhất quán và tự nhiên, không ảnh hưởng nghĩa.
  revised_text: 'Họ báo cho ông biết: “Giê-su, người Na-xa-rét, đang đi ngang qua.”[a]'
  revised_footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su quê Na-xa-rét đang đi ngang qua.” Tiếng Hy Lạp viết sát nghĩa là “Giê-su, người Na-xa-rét.”'
    reason: lexical_alternative
