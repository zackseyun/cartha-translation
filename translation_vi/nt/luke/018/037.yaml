  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: vi
  text: 'Họ báo cho ông biết: “Giê-su, người Na-xa-rét, đang đi ngang qua.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su quê Na-xa-rét đang đi ngang qua.” Tiếng Hy Lạp viết sát nghĩa là “Giê-su, người Na-xa-rét.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: báo cho ... biết
  rationale: Động từ mang nghĩa báo tin hoặc thuật lại. Trong ngữ cảnh người mù hỏi đám đông điều gì đang xảy ra, cách diễn đạt này tự nhiên và giữ được ý chuyển đạt thông tin.
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: δέ là từ nối nhẹ dùng để tiếp diễn câu chuyện; trong tiếng Việt, sự tiếp nối đã rõ qua trật tự câu nên không cần thêm “và” hoặc “bấy giờ”.
- source_word: αὐτῷ
  choice: cho ông
  rationale: Đại từ chỉ người mù đã được nhắc đến; “ông” là cách quy chiếu tự nhiên, trang trọng và phù hợp ngữ cảnh.
- source_word: ὅτι
  choice: dấu hai chấm và lời dẫn trực tiếp
  rationale: ὅτι giới thiệu nội dung được báo. Lời dẫn trực tiếp diễn đạt rõ và tự nhiên trong tiếng Việt mà không thay đổi nội dung.
- source_word: Ἰησοῦς
  choice: Đức Chúa Jêsus
  rationale: Dùng dạng tên quen thuộc trong văn phong Kinh Thánh tiếng Việt, kèm kính ngữ trang trọng, không thêm một mệnh đề thần học vào nội dung câu.
- source_word: ὁ Ναζωραῖος
  choice: người Na-xa-rét
  rationale: Cụm danh từ chỉ danh xưng gắn với Na-xa-rét. “Người Na-xa-rét” vừa tự nhiên trong tiếng Việt vừa giữ sắc thái định danh của nguyên văn.
- source_word: παρέρχεται
  choice: đang đi ngang qua
  rationale: Thì hiện tại trong ngữ cảnh diễn tả hành động đang diễn ra ngay lúc ấy; “đang đi ngang qua” truyền đạt rõ tính tức thời.
theological_decisions:
- issue: Cách dịch danh xưng Ναζωραῖος của Đức Chúa Jêsus
  choice: người Na-xa-rét
  alternative: Đức Chúa Jêsus quê Na-xa-rét / người quê ở Na-xa-rét
  rationale: Nguyên văn dùng một danh xưng định danh chứ không dùng cụm giới từ “từ Na-xa-rét”. Cách chọn giữ hình thức và sự mơ hồ hợp lý của danh xưng, không khai triển thành một khẳng định thần học.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu văn dùng lời thoại tự nhiên; tên riêng được phiên âm theo lối quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
