revisions:
- from: 'Họ báo cho ông biết: “Đức Chúa Jêsus, người Na-xa-rét, đang đi ngang qua.”[a]'
  to: 'Họ báo cho ông biết: “Giê-su, người Na-xa-rét, đang đi ngang qua.”[a]'
  rationale: Bản sửa loại bỏ tước hiệu không có trong nguyên văn, đồng thời giữ cách diễn đạt hiện tại tiếp diễn của παρέρχεται và danh xưng “người Na-xa-rét” cho ὁ Ναζωραῖος. Chú thích nêu phương án diễn giải địa lý mà không thay thế cách dịch sát danh xưng trong bản văn chính.
