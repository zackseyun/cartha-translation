  terminology: “Đền Thờ,” “Pha-ri-si,” và “người thu thuế” là các thuật ngữ chuẩn, dễ hiểu và đúng thanh ghi. Việc dùng “hai người” là tự nhiên trong tiếng Việt; ngữ cảnh và hai danh xưng xác định hai nhân vật nam mà không cần thêm một cách nặng câu “đàn ông.”
