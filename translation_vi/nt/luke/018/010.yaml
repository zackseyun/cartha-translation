source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: vi
  text: 'Có hai người đi lên Đền Thờ để cầu nguyện[a]: một người là người Pha-ri-si, còn người kia là người thu thuế.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khuôn viên hay khu phức hợp Đền Thờ, không riêng nơi thánh bên trong.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Có hai người
  rationale: Trong ngữ cảnh, hai nhân vật đều là nam, nhưng tiếng Việt tự nhiên dùng “hai người”; không cần thêm từ chỉ giới tính vì các danh xưng theo sau đã xác định họ.
- source_word: ἀνέβησαν
  choice: đi lên
  rationale: Giữ hướng nghĩa của ἀναβαίνω và cách nói gắn với việc đến Giê-ru-sa-lem hay khu Đền Thờ, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: εἰς τὸ ἱερὸν
  choice: lên Đền Thờ
  rationale: Trong tiếng Việt, “đi lên Đền Thờ” diễn đạt tự nhiên cả chuyển động đến nơi và đi vào khuôn viên. ἱερόν chỉ toàn bộ khu Đền Thờ chứ không riêng nơi thánh bên trong; sắc thái này được nêu ở chú thích.
- source_word: προσεύξασθαι
  choice: để cầu nguyện
  rationale: Động từ nguyên mẫu diễn tả mục đích; “để cầu nguyện” trực tiếp, rõ ràng và tự nhiên.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: một người ... còn người kia
  rationale: Thể hiện rõ cấu trúc đối chiếu giữa hai nhân vật và phù hợp văn phong tiếng Việt hiện đại.
- source_word: Φαρισαῖος
  choice: người Pha-ri-si
  rationale: Dùng tên gọi quen thuộc trong tiếng Việt cho thành viên nhóm Pha-ri-si.
- source_word: τελώνης
  choice: người thu thuế
  rationale: Cách gọi rõ nghĩa, hiện đại cho người thu các loại thuế hay phí; tránh từ cổ hoặc hàm ý vượt quá nguyên văn.
theological_decisions:
- issue: Phân biệt ἱερόν với ναός
  choice: Đền Thờ, kèm chú thích rằng đây là toàn bộ khuôn viên
  alternative: khuôn viên Đền Thờ
  rationale: Bản văn nói đến khu phức hợp Đền Thờ, không nhất thiết là nơi thánh bên trong. Cách dịch chính giữ lối nói quen thuộc, còn chú thích bảo toàn độ chính xác từ vựng.
- issue: Cách thể hiện giới tính của ἄνθρωποι
  choice: hai người
  alternative: hai người đàn ông
  rationale: Ngữ cảnh Hy Lạp nói về hai nhân vật nam, nhưng tiếng Việt không cần đánh dấu giới tính trong danh từ “người”. Cách dịch không phủ nhận giới tính và tránh diễn đạt nặng nề.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Viết hoa “Đền Thờ” để chỉ Đền Thờ tại Giê-ru-sa-lem; dùng “Pha-ri-si” theo lối phiên âm quen thuộc. Dấu hai chấm làm rõ phần sau xác định hai người vừa được nhắc đến.
