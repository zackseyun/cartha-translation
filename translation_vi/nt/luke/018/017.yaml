source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: vi
  text: 'Quả thật, tôi nói với anh em: Ai không đón nhận vương quốc Đức Chúa Trời như một đứa trẻ[a] thì chắc chắn sẽ không vào đó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “với tư cách là một đứa trẻ”. Cụm từ này có thể nhấn mạnh sự dễ tiếp nhận, tin cậy, khiêm nhường hoặc lệ thuộc của trẻ em; tiếng Hy Lạp không xác định chính xác phẩm chất nào.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Thật
  rationale: Trong công thức mở đầu trang trọng của Chúa Giê-su, “Thật” truyền đạt sức khẳng định của ἀμήν một cách tự nhiên, rõ nghĩa hơn lối phiên âm “A-men”.
- source_word: λέγω ὑμῖν
  choice: tôi bảo anh em
  rationale: Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được lời trực tiếp ngỏ với số nhiều.
- source_word: ὃς ἂν
  choice: Ai
  rationale: Đại từ quan hệ kết hợp với ἄν diễn tả điều kiện khái quát, bất định; “Ai” chuyển tải gọn và tự nhiên.
- source_word: μὴ δέξηται
  choice: không đón nhận
  rationale: “Đón nhận” bao hàm cả tiếp nhận và chấp nhận, phù hợp với đối tượng là vương quốc Đức Chúa Trời mà không giải thích quá mức hình ảnh.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Đây là cách dịch minh bạch và quen thuộc, giữ cả chiều kích vương quyền lẫn lãnh địa của βασιλεία mà không thu hẹp thành chỉ “sự cai trị”.
- source_word: ὡς παιδίον
  choice: như một đứa trẻ
  rationale: Giữ nguyên phép so sánh về cách thức, không tự xác định phẩm chất được nhấn mạnh là khiêm nhường, tin cậy, lệ thuộc hay dễ tiếp nhận.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: chắc chắn sẽ không được vào
  rationale: Cấu trúc οὐ μή với động từ giả định quá khứ đơn là lời phủ định mạnh. “Chắc chắn sẽ không” thể hiện sức nhấn; “được vào” là cách nói tiếng Việt tự nhiên trong ngữ cảnh được phép gia nhập.
- source_word: εἰς αὐτήν
  choice: vào đó
  rationale: Đại từ giống cái chỉ lại “vương quốc”; “đó” tránh lặp từ và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của việc đón nhận vương quốc “như một đứa trẻ”
  choice: Giữ nguyên phép so sánh mà không chỉ rõ phẩm chất nào của trẻ em được nhấn mạnh.
  alternative: Dịch diễn giải là “với lòng khiêm nhường như trẻ thơ”, “với sự tin cậy như trẻ thơ”, hoặc hiểu là “trong tư cách một đứa trẻ”.
  rationale: Câu Hy Lạp nêu phép so sánh nhưng không xác định rõ đó là sự dễ tiếp nhận, tin cậy, khiêm nhường hay lệ thuộc. Giữ hình ảnh nguyên vẹn bảo tồn sự rộng nghĩa và tránh áp đặt một cách giải thích thần học riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh em” cho đại từ số nhiều ὑμῖν; dùng “Đức Chúa Trời” và “vương quốc” theo thuật ngữ Kinh Thánh tiếng Việt phổ thông. Dấu hai chấm làm rõ sự chuyển tiếp từ công thức tuyên bố sang nội dung lời phán.
