  rationale: Sửa “không được vào” thành “không vào” để không chuyển động từ chủ động thành sắc thái thụ động/cho phép. Điều chỉnh nhẹ công thức mở đầu và câu chữ chú thích cho tự nhiên hơn, đồng thời giữ nguyên tính mơ hồ diễn giải của ὡς παιδίον.
