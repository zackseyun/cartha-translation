  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc chính: phân từ aorist ἀκούσας, đám đông đang di chuyển (ὄχλου διαπορευομένου), và nội dung câu hỏi gián tiếp τί εἴη τοῦτο. “Đó là chuyện gì” là cách nói Việt tự nhiên cho điều đang xảy ra, không áp đặt nghĩa thần học. “Hỏi xem” không tự thân biểu thị rõ sắc thái chưa hoàn tất/lặp lại của ἐπυνθάνετο, nhưng chú thích đã nêu một khả năng hợp lệ.'
  naturalness: 'Câu văn hiện đại, rõ ràng và đúng ngữ cảnh: “Nghe thấy một đám đông đang đi ngang qua, ông hỏi xem đó là chuyện gì.” Cách dùng “ông” phù hợp với văn mạch nói về người mù, và không cần thêm từ nối để dịch δέ.'
