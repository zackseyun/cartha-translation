  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” để tiếp nối nhân vật người mù trong ngữ cảnh; tránh từ nối gượng ép và giữ nguyên độ mở về sắc thái tiếp diễn hoặc lặp lại của động từ Hy Lạp.
