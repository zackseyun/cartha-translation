  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: vi
  text: Nghe thấy một đám đông đang đi ngang qua, ông hỏi xem đó là chuyện gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông cứ hỏi xem chuyện đó có thể là gì.” Động từ Hy Lạp ở thì chưa hoàn thành có thể gợi việc hỏi nhiều lần; thức cầu ước trong câu hỏi gián tiếp sau động từ ở quá khứ cũng có thể được diễn đạt với sắc thái dè dặt hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Nghe thấy
  rationale: 'Phân từ bất định diễn tả hoàn cảnh, chủ yếu mang sắc thái thời gian: khi nghe thấy. Cách dịch này giữ được nhịp kể ngắn gọn và tự nhiên.'
- source_word: δὲ
  choice: không dịch thành từ nối riêng
  rationale: δέ là từ nối nhẹ trong mạch kể. Trong tiếng Việt, sự tiếp nối đã rõ từ cấu trúc đầu câu; thêm “và” hoặc “bấy giờ” sẽ kém tự nhiên hoặc nhấn mạnh quá mức.
- source_word: ὄχλου
  choice: một đám đông
  rationale: Danh từ không có mạo từ, chỉ nhóm người mà ông nghe thấy đang di chuyển; “một đám đông” là cách diễn đạt tự nhiên.
- source_word: διαπορευομένου
  choice: đang đi ngang qua
  rationale: Phân từ hiện tại diễn tả chuyển động đang tiếp diễn. “Đi ngang qua” phù hợp với cảnh đám đông đi qua chỗ người mù ngồi.
- source_word: ἐπυνθάνετο
  choice: ông hỏi xem
  rationale: Thì vị hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại. Tiếng Việt không buộc phải xác định một trong hai; “hỏi xem” giữ câu tự nhiên mà không áp đặt sắc thái khởi đầu hay lặp lại.
- source_word: τί εἴη τοῦτο
  choice: đó là chuyện gì
  rationale: Câu hỏi gián tiếp dùng thức mong mỏi sau động từ quá khứ. “Đó là chuyện gì” truyền đạt nội dung trực tiếp và tự nhiên, đồng thời không biến câu hỏi thành lời giải thích về ý nghĩa.
