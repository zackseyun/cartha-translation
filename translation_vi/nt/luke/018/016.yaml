reference: Luke 18:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su gọi các em lại gần mình và nói: “Hãy để trẻ em đến với Ta, đừng ngăn cản chúng, vì vương quốc Đức Chúa Trời thuộc về những người như các em này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: gọi các em đến
  rationale: Động từ trung gian προσκαλέομαι diễn tả việc gọi người khác đến với mình. Trong tiếng Việt, “gọi các em đến” tự nhiên, đủ rõ theo ngữ cảnh và không cần thêm “với Ngài”.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Hãy để trẻ em đến với Ta
  rationale: Ἄφετε trong cấu trúc này có nghĩa là cho phép; “hãy để” giữ được tính trực tiếp của mệnh lệnh. παιδία được dịch là “trẻ em” mà không thêm sắc thái “nhỏ” vốn không nhất thiết phải biểu đạt riêng ở đây.
- source_word: μὴ κωλύετε αὐτά
  choice: đừng ngăn cản chúng
  rationale: κωλύω có nghĩa là ngăn cản hoặc cản trở. “Đừng ngăn cản” là cách nói tự nhiên và không buộc thì hiện tại phải mang nghĩa chuyên biệt là chấm dứt một hành động đang tiếp diễn.
- source_word: τῶν ... τοιούτων
  choice: những người giống như các em ấy
  rationale: Cụm từ chỉ một lớp người được những trẻ em hiện diện làm hình ảnh tiêu biểu, chứ không nhất thiết chỉ nói đến chính các em. Cách dịch này giữ phạm vi đại diện mà không xác định cụ thể họ giống trẻ em ở phẩm chất nào.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: “Vương quốc” diễn đạt βασιλεία bằng tiếng Việt hiện đại, bao hàm quyền trị vì và lĩnh vực thuộc sự cai trị của Đức Chúa Trời; tên gọi “Đức Chúa Trời” phù hợp văn phong Kinh Thánh trang trọng và phổ thông.
theological_decisions:
- issue: Phạm vi của τῶν τοιούτων
  choice: “những người giống như các em ấy,” bao gồm một lớp người được các trẻ em làm đại diện
  alternative: Chỉ chính những trẻ em đang được đưa đến với Đức Giê-su
  rationale: τοιοῦτος ở số nhiều thường mở rộng từ những người đang hiện diện sang những người cùng loại hoặc tương tự. Bản dịch không giải thích họ phải giống trẻ em ở điểm nào, nhờ đó giữ nguyên sự căng thẳng thần học của câu.
- issue: Quan hệ sở thuộc trong τῶν τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: “vương quốc Đức Chúa Trời thuộc về”
  alternative: Dịch sát cấu trúc là “vương quốc Đức Chúa Trời là của những người như thế”
  rationale: “Thuộc về” diễn đạt tự nhiên quan hệ do sở hữu cách nêu lên, nhưng không giải thích xa hơn bản chất thần học của việc thuộc về vương quốc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời dẫn và đại từ “Ta” trong lời trực tiếp của Ngài. Không thêm chú thích vì câu dịch chính đã diễn đạt rõ cấu trúc Hy Lạp mà không loại bỏ sự mơ hồ có ý nghĩa.
