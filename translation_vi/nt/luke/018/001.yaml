  source_fidelity: 'Bản dịch phản ánh đầy đủ các thành tố chính của Hy Lạp: động từ tường thuật ở quá khứ, người nghe, “một dụ ngôn,” và nội dung/sự cần thiết họ phải kiên trì cầu nguyện mà không nản lòng. “Về việc họ phải...” là cách diễn đạt tiếng Việt thích hợp cho quan hệ πρὸς τὸ δεῖν, không ép cấu trúc này chỉ theo một cách hiểu mục đích.'
  naturalness: “Ngài kể cho họ một dụ ngôn về việc họ phải luôn cầu nguyện và không nản lòng” tự nhiên, trang trọng vừa phải và rõ nghĩa trong tiếng Việt hiện đại. “Luôn” diễn đạt πάντοτε mà không gợi một cách không cần thiết việc cầu nguyện bằng lời không gián đoạn.
