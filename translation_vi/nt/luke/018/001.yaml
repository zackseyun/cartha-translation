id: LUK.18.1
reference: Luke 18:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: vi
  text: Ngài kể cho họ một dụ ngôn về việc họ phải luôn cầu nguyện và không nản lòng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để dạy rằng họ phải luôn cầu nguyện và không nản lòng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: kể
  rationale: Thì chưa hoàn thành tạo bối cảnh hoặc diễn tả hành động đang tiếp diễn trong quá khứ; tiếng Việt không bắt buộc đánh dấu phương diện này bằng từ riêng, nên “kể” tự nhiên và không thêm sắc thái không có trong nguồn.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ chuyển ý nhẹ; trong câu tiếng Việt độc lập này, mạch chuyển được thể hiện tự nhiên mà không cần thêm “bấy giờ” hay “nhưng”.
- source_word: παραβολὴν
  choice: một dụ ngôn
  rationale: Thuật ngữ quen thuộc, chính xác cho thể loại παραβολή trong các sách Tin Mừng.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Thể hiện tự nhiên bổ ngữ gián tiếp chỉ những người nghe Đức Giê-su.
- source_word: πρὸς τὸ δεῖν … αὐτοὺς
  choice: về việc họ phải
  rationale: πρὸς τὸ với động từ nguyên mẫu có thể chỉ mục đích hoặc điều được đề cập; cách dịch này giữ nét quy chiếu và sức bắt buộc của δεῖν mà không diễn giải quá mức.
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn đạt trực tiếp sự bền bỉ, thường xuyên, nhưng không nhất thiết hàm ý cầu nguyện bằng lời không gián đoạn.
- source_word: προσεύχεσθαι
  choice: cầu nguyện
  rationale: Tương đương chuẩn và tự nhiên trong văn cảnh.
- source_word: μὴ ἐγκακεῖν
  choice: không nản lòng
  rationale: Giữ sắc thái mất can đảm hoặc chùn bước; tự nhiên hơn “không mệt mỏi” trong văn cảnh kiên trì cầu nguyện.
theological_decisions:
- issue: Mức độ bắt buộc của lời dạy về sự kiên trì cầu nguyện
  choice: “phải luôn cầu nguyện và không nản lòng”
  alternative: “nên luôn cầu nguyện và không nản chí”
  rationale: δεῖν diễn tả sự cần thiết, nên “phải” giữ được sức nặng của câu mà không đưa thêm một học thuyết về hiệu quả của lời cầu nguyện.
- issue: Quan hệ do πρὸς τὸ biểu thị
  choice: “về việc” trong chính văn, kèm phương án chỉ mục đích ở chú thích
  alternative: “để dạy rằng”
  rationale: Cấu trúc có thể được hiểu theo hướng quy chiếu hoặc mục đích. Chính văn giữ cách nói ít diễn giải hơn, còn chú thích bảo tồn cách hiểu mục đích hợp lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Giê-su theo ngữ cảnh trước đó; “dụ ngôn”, “cầu nguyện” là các thuật ngữ phổ thông, ổn định. Dấu chú thích [a] xuất hiện trong chính văn.
