source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: vi
  text: Họ không hiểu gì về những điều này; lời này bị che giấu đối với họ, và họ không nhận ra những điều đang được nói.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆκαν
  choice: hiểu
  rationale: Động từ συνίημι ở đây chỉ việc nắm bắt ý nghĩa lời Đức Giê-su vừa báo trước; “hiểu” tự nhiên và giữ đúng sắc thái nhận thức.
- source_word: οὐδὲν τούτων
  choice: không hiểu gì trong những điều ấy
  rationale: Cách diễn đạt này giữ tham chiếu số nhiều về toàn bộ những điều vừa được nói, đồng thời tự nhiên trong tiếng Việt.
- source_word: τὸ ῥῆμα τοῦτο
  choice: lời này
  rationale: ῥῆμα có thể chỉ lời nói, điều được nói hoặc sứ điệp; “lời này” vừa gọn, trang trọng vừa giữ được độ rộng nghĩa.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: bị che giấu khỏi họ
  rationale: Giữ cấu trúc bị động và trạng thái do hành động che giấu tạo nên, nhưng không thêm tác nhân mà bản Hy Lạp không nêu.
- source_word: ἐγίνωσκον
  choice: nhận biết
  rationale: “Nhận biết” giữ phần nào sự phân biệt từ vựng với συνῆκαν (“hiểu”), dù trong ngữ cảnh động từ này cũng hàm ý không nắm được ý nghĩa.
- source_word: τὰ λεγόμενα
  choice: những điều đang được nói
  rationale: Giữ sắc thái hiện tại và bị động của phân từ λεγόμενα, chỉ nội dung đang được nói đến.
theological_decisions:
- issue: Bản chất việc các môn đồ không hiểu
  choice: Giữ nguyên ba lớp mô tả sự không hiểu và không xác định ai hoặc điều gì đã che giấu lời ấy khỏi họ.
  alternative: Diễn giải rõ đây là hành động của Đức Chúa Trời, hoặc chỉ là sự bối rối tâm lý của các môn đồ.
  rationale: Thể bị động “bị che giấu” không nêu tác nhân; bản dịch không nên tự giải quyết sự căng thẳng thần học mà nguyên văn để ngỏ.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Ba vế song song của nguyên văn được giữ lại; “nhận biết” ở vế cuối tránh san phẳng hoàn toàn hai động từ Hy Lạp khác nhau.
