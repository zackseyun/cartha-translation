  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: vi
  text: Cha mẹ Ngài hằng năm lên Giê-ru-sa-lem dự lễ Vượt Qua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: lên
  rationale: Động từ ở thì chưa hoàn thành diễn tả một việc thường xuyên trong quá khứ; “hằng năm” truyền đạt rõ tính lặp lại. Trong tiếng Việt Kinh Thánh, đi đến Giê-ru-sa-lem tự nhiên được diễn đạt là “lên” vì địa thế và ý niệm hành hương.
- source_word: γονεῖς
  choice: cha mẹ
  rationale: Danh từ số nhiều có nghĩa trực tiếp là cha mẹ; cách dịch này tự nhiên, chính xác và không thêm lời giải thích thần học vào câu.
- source_word: κατ’ ἔτος
  choice: hằng năm
  rationale: Thành ngữ chỉ hành động xảy ra mỗi năm; “hằng năm” trang trọng vừa phải và tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἰερουσαλὴμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τῇ ἑορτῇ
  choice: dự lễ
  rationale: Trong ngữ cảnh di chuyển, cách nói này truyền đạt tự nhiên dịp và mục đích của chuyến đi, thay vì dịch cứng theo cách dùng cách dữ liệu của tiếng Hy Lạp.
- source_word: τοῦ πάσχα
  choice: Vượt Qua
  rationale: πάσχα là tên lễ Vượt Qua của người Do Thái; viết hoa để thể hiện đây là tên một lễ cụ thể.
theological_decisions:
- issue: Cách gọi những người trong gia đình Chúa Giê-su
  choice: cha mẹ Ngài
  alternative: cha và mẹ Ngài
  rationale: Nguyên văn dùng danh từ thông thường “cha mẹ”. Giữ nguyên cách gọi tự nhiên của trình thuật, không dùng bản dịch để giải quyết hoặc phủ nhận sự căng thẳng thần học với lời khẳng định về sự thụ thai đồng trinh ở phần khác của sách Lu-ca.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” được dùng làm đại từ quy chiếu về Chúa Giê-su; câu gọn, giữ nhịp kể chuyện và sắc thái hành động theo lệ thường.
