  rationale: Bản sửa giữ cách diễn đạt trần thuật tiếng Việt tự nhiên, đồng thời phục hồi đầy đủ danh xưng lịch sử trong nguyên văn. “Được ban hành từ” phản ánh trực tiếp ἐξῆλθεν ... παρὰ, còn “truyền cho ... phải đăng ký” giữ quan hệ của sắc lệnh với động từ ἀπογράφεσθαι. Chú thích tiếp tục bảo toàn các cách hiểu hợp lý về οἰκουμένη.
