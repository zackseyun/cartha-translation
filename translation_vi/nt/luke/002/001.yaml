source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: vi
  text: Trong những ngày ấy, một sắc lệnh được ban hành từ Sê-sa Au-gút-tơ, truyền cho toàn thế giới có người ở phải đăng ký.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “toàn thế giới La Mã” hoặc “toàn đế quốc”. Từ Hy Lạp này thường chỉ thế giới có người ở theo cách hình dung trong bối cảnh Đế quốc La Mã.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Trong những ngày ấy, ... ban hành
  rationale: Công thức trần thuật mở đầu một sự kiện mới. Tiếng Việt không cần dịch máy móc là “đã xảy ra rằng”; mạch chuyển tiếp của δὲ được thể hiện tự nhiên qua việc mở sang sự kiện mới.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: Trong những ngày ấy
  rationale: Giữ sát thành ngữ chỉ thời gian của tiếng Hy Lạp, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου
  choice: Hoàng đế Au-gút-tô ban hành một sắc lệnh
  rationale: Diễn đạt tự nhiên việc sắc lệnh phát xuất từ nhà cầm quyền. “Hoàng đế” truyền đạt chức vị Caesar trong ngữ cảnh này rõ hơn cho độc giả phổ thông; “sắc lệnh” phù hợp với δόγμα là mệnh lệnh chính thức của đế quốc.
- source_word: ἀπογράφεσθαι
  choice: phải đăng ký
  rationale: Chỉ việc ghi danh chính thức, thường liên quan đến điều tra dân số hoặc thuế khóa. “Đăng ký” không thêm mức độ cụ thể mà chính câu này chưa nói rõ.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: toàn thể thế giới có người ở
  rationale: Phản ánh nghĩa cơ bản của οἰκουμένη và giữ nguyên độ rộng của cách nói, thay vì thu hẹp ngay trong chính văn thành Đế quốc La Mã.
theological_decisions:
- issue: Phạm vi của οἰκουμένη
  choice: toàn thể thế giới có người ở
  alternative: toàn thế giới La Mã; toàn đế quốc
  rationale: Đây chủ yếu là vấn đề lịch sử và từ vựng. Chính văn giữ nghĩa bề mặt của từ Hy Lạp, còn chú thích nêu phạm vi thường được hiểu trong bối cảnh đế quốc La Mã, không âm thầm giải quyết sự mơ hồ.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “Hoàng đế Au-gút-tô” thay cho cách phiên âm chức hiệu “Sê-sa” để độc giả phổ thông nhận ra vai trò của nhân vật; không thêm “điều tra dân số” hay “đóng thuế” vì câu Hy Lạp chỉ nói rõ việc đăng ký.
