  terminology: Nên giữ tên/danh xưng lịch sử “Sê-sa Au-gút-tơ” thay vì chỉ dùng “Hoàng đế Au-gút-tô”. “Sắc lệnh” và “đăng ký” phù hợp với δόγμα và ἀπογράφεσθαι. Chú thích giữ đúng tính mơ hồ có chủ ý về phạm vi của οἰκουμένη.
