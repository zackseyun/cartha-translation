  text: because my eyes have seen your salvation[a]
translation:
  language: vi
  text: vì chính mắt con đã thấy sự cứu rỗi của Ngài[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “Đấng Cứu Thế của Ngài.” Tiếng Hy Lạp nói “sự cứu rỗi của Ngài,” nhưng trong ngữ cảnh, sự cứu rỗi của Đức Chúa Trời hiện diện nơi chính Chúa Giê-su.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Trong ngữ cảnh, từ này nêu lý do cho lời Si-mê-ôn vừa nói ở câu trước; “vì” diễn đạt rõ quan hệ nguyên nhân.
- source_word: εἶδον
  choice: đã thấy
  rationale: Thì aorist chỉ hành động đã xảy ra; “đã thấy” tự nhiên trong tiếng Việt và vẫn thể hiện ý nghĩa hiện tại của trải nghiệm ấy.
- source_word: οἱ ὀφθαλμοί μου
  choice: chính mắt con
  rationale: Nguyên văn nói rõ “đôi mắt của con.” Thành ngữ “chính mắt con” vừa tự nhiên vừa giữ được tính cụ thể và nhấn mạnh của cách diễn đạt Hy Lạp.
- source_word: τὸ σωτήριόν σου
  choice: sự cứu rỗi của Ngài
  rationale: σωτήριον ở đây chỉ sự cứu rỗi hay phương tiện cứu rỗi, chứ không phải danh từ thông thường chỉ đích danh “Đấng Cứu Thế.” Cách dịch này giữ nguyên độ rộng thần học, trong khi ngữ cảnh cho thấy sự cứu rỗi ấy hiện diện nơi hài nhi Giê-su.
theological_decisions:
- issue: Nên dịch τὸ σωτήριόν σου bằng danh từ trừu tượng “sự cứu rỗi của Ngài” hay cá nhân hóa thành “Đấng Cứu Thế của Ngài.”
  choice: sự cứu rỗi của Ngài
  alternative: Đấng Cứu Thế của Ngài
  rationale: Nguyên văn dùng σωτήριον, không dùng danh từ chỉ người σωτήρ. “Sự cứu rỗi của Ngài” trung thành với hình thức Hy Lạp và để ngữ cảnh tự bày tỏ rằng sự cứu rỗi của Đức Chúa Trời đang hiện diện trong con người Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” vì đây là lời người đầy tớ thưa với Chúa; dùng “Ngài” để chỉ Đức Chúa Trời. “Chính mắt con” là cách diễn đạt tiếng Việt tự nhiên, giữ được hình ảnh cụ thể của nguyên văn.
