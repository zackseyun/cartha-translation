  rationale: Bản sửa bỏ khẳng định “thay phiên” khỏi câu chính để không diễn giải quá mức cấu trúc “giữ các canh của đêm,” nhưng vẫn bảo lưu khả năng này trong chú thích. Đồng thời, câu được làm gọn hơn mà không mất ý người chăn ở ngoài đồng và canh đàn chiên vào ban đêm.
