base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: vi
  text: Trong vùng ấy có những người chăn chiên đang ở ngoài đồng[a] và canh giữ đàn chiên của mình trong đêm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang sống ngoài trời” hoặc “đang cắm trại ngoài đồng.” Động từ Hy Lạp nhấn mạnh rằng họ qua đêm ở ngoài đồng.'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “giữ các phiên canh của đêm trên đàn chiên của mình.” Cách nói này có thể gợi ý việc canh theo từng phiên trong đêm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: những người chăn chiên
  rationale: Danh từ chỉ cụ thể những người chăm sóc đàn chiên; cách dịch này chính xác và tự nhiên hơn từ rộng nghĩa như “người chăn súc vật”.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: trong chính vùng ấy
  rationale: χώρα ở đây chỉ vùng hoặc khu vực lân cận vừa được nhắc đến; “chính vùng ấy” giữ được sắc thái đồng nhất của τῇ αὐτῇ.
- source_word: ἀγραυλοῦντες
  choice: đang ở ngoài đồng qua đêm
  rationale: Động từ nhấn mạnh việc ngủ hoặc lưu lại ban đêm ngoài trời, trong đồng ruộng; cách diễn đạt này vừa rõ nghĩa vừa phù hợp bối cảnh chăn chiên.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: thay phiên canh giữ ... trong đêm
  rationale: Cấu trúc đồng căn theo nghĩa đen là “giữ các phiên canh ban đêm,” gợi ý việc canh theo từng phiên; bản dịch diễn đạt tự nhiên mà vẫn giữ nét nghĩa ấy.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: đàn chiên của mình
  rationale: ποίμνη là danh từ tập hợp chỉ đàn chiên thuộc sự chăm nom của họ; “canh giữ đàn chiên của mình” là cách kết hợp tự nhiên trong tiếng Việt.
- source_word: Καὶ
  choice: Trong ... có
  rationale: καί nối tiếp câu chuyện. Trong tiếng Việt, không nhất thiết phải dịch máy móc là “và”; cấu trúc mở cảnh “Trong chính vùng ấy có...” truyền đạt tự nhiên chức năng tiếp nối.
- source_word: ἦσαν
  choice: có
  rationale: Đây là cách dùng tồn tại của εἰμί để giới thiệu nhân vật trong cảnh mới; “có” là tương đương tự nhiên trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “chăn chiên” thay vì “chăn cừu” để phù hợp ngôn ngữ Kinh Thánh quen thuộc mà vẫn sáng nghĩa; “qua đêm” và “thay phiên canh giữ” làm rõ hai nét nghĩa của các phân từ Hy Lạp mà không thêm nội dung thần học.
