base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: vi
  text: Nhưng Ma-ri-a thì vẫn cất giữ mọi lời ấy[a] và suy đi nghĩ lại trong lòng mình.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mọi điều ấy.” Từ Hy Lạp có thể chỉ các lời đã được nói, hoặc theo nghĩa rộng hơn, các sự việc được thuật lại.'
    reason: lexical_alternative
  - marker: b
    text: Cụm này có thể hàm ý đem các lời hoặc sự việc lại với nhau để cân nhắc, so sánh.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển ý có sắc thái tương phản nhẹ giữa phản ứng công khai của những người khác và phản ứng nội tâm của Ma-ri-a.
- source_word: Μαρία
  choice: Ma-ri-a
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: πάντα συνετήρει τὰ ῥήματα ταῦτα
  choice: gìn giữ tất cả những lời này
  rationale: Thì chưa hoàn thành của συνετήρει diễn tả hành động liên tục; “gìn giữ” truyền đạt ý giữ lại cách cẩn trọng. ῥήματα trước hết chỉ những lời đã được nói, nhưng cũng có thể bao hàm các sự việc được thuật lại.
- source_word: συμβάλλουσα
  choice: suy ngẫm, kết nối chúng với nhau
  rationale: Giữ cả ý suy xét trong tâm trí lẫn sắc thái nguyên nghĩa là đặt các điều cạnh nhau để đối chiếu và liên hệ.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: trong lòng mình
  rationale: Bảo tồn hình ảnh Kinh Thánh về nơi của suy nghĩ và cảm nhận nội tâm, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất phản ứng của Ma-ri-a
  choice: Ma-ri-a cẩn thận gìn giữ và suy ngẫm, liên hệ những lời đã nghe với nhau.
  alternative: Ma-ri-a chỉ ghi nhớ các sự việc, hoặc đã hiểu trọn vẹn ý nghĩa của chúng ngay lúc ấy.
  rationale: Các động từ diễn tả sự lưu giữ và suy xét liên tục, nhưng không khẳng định rằng bà đã hiểu đầy đủ; bản dịch giữ nguyên sự căng thẳng này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “gìn giữ” để thể hiện sự lưu tâm liên tục, và diễn đạt rõ sắc thái của phân từ συμβάλλουσα mà không hàm ý Ma-ri-a đã hiểu trọn vẹn.
