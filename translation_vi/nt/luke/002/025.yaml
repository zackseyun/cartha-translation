id: LUK.2.25
reference: Luke 2:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: vi
  text: Kìa[a], có một người ở Giê-ru-sa-lem tên là Si-mê-ôn; người này công chính và mộ đạo, đang trông đợi niềm an ủi của Ít-ra-en, và Thánh Linh[b] ở trên ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Này” hoặc “Hãy xem”. Đây là lời dẫn nhập nhằm thu hút sự chú ý đến nhân vật được giới thiệu.
    reason: lexical_alternative
  - marker: b
    text: Xét riêng về ngữ pháp, cũng có thể dịch là “một linh thánh”; tuy nhiên, trong ngữ cảnh của Lu-ca, cụm từ này tự nhiên nhất chỉ Thánh Linh.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ lại dấu hiệu diễn ngôn dùng để thu hút sự chú ý và giới thiệu một nhân vật có ý nghĩa trong câu chuyện, đồng thời vẫn tự nhiên trong văn kể trang trọng.
- source_word: ἄνθρωπος
  choice: một người
  rationale: Chỉ một cá nhân cụ thể là nam giới, nhưng tiếng Việt tự nhiên dùng “một người”; tên Si-mê-ôn ngay sau đó xác định nhân vật.
- source_word: ᾧ ὄνομα Συμεών
  choice: tên là Si-mê-ôn
  rationale: Chuyển thành cách giới thiệu tên tự nhiên trong tiếng Việt mà vẫn giữ nguyên chức năng xác định nhân vật.
- source_word: δίκαιος
  choice: công chính
  rationale: Giữ được sắc thái đạo đức và mối quan hệ đúng đắn với Đức Chúa Trời; “ngay thẳng” có thể làm hẹp ý nghĩa.
- source_word: εὐλαβής
  choice: mộ đạo
  rationale: Diễn đạt ngắn gọn lòng kính sợ và sự chuyên tâm sống đạo của Si-mê-ôn bằng từ ngữ quen thuộc trong tiếng Việt hiện đại.
- source_word: προσδεχόμενος
  choice: đang trông đợi
  rationale: Thể hiện sự chờ đợi liên tục với niềm mong mỏi và kỳ vọng, mạnh hơn cách nói trung tính “đang chờ”.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: niềm an ủi của Ít-ra-en
  rationale: Bảo tồn hình ảnh về sự an ủi mà Đức Chúa Trời đã hứa cho dân Ngài, đồng thời không thu hẹp ý này chỉ còn giải thoát chính trị hay một hình thức phục hồi cụ thể.
- source_word: πνεῦμα ἅγιον
  choice: Thánh Linh
  rationale: Trong ngữ cảnh Lu-ca, đặc biệt các câu kế tiếp, cụm từ này tự nhiên chỉ Thánh Linh. Tiếng Việt không cần mạo từ xác định như tiếng Anh.
- source_word: ἐπ’ αὐτόν
  choice: ở trên ông
  rationale: Giữ hình ảnh không gian của giới từ Hy Lạp và thành ngữ Kinh Thánh về sự hiện diện của Thánh Linh, không diễn giải thêm thành một hành động hay ân tứ cụ thể.
theological_decisions:
- issue: Đối tượng được chỉ bởi πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν
  choice: Thánh Linh ở trên ông
  alternative: một linh thánh ở trên ông
  rationale: Dù danh từ Hy Lạp không có mạo từ, cách dùng của Lu-ca và ngữ cảnh trực tiếp trong các câu 26–27 phù hợp nhất với Thánh Linh. Bản dịch giữ cách hiểu này nhưng ghi nhận khả năng ngữ pháp khác trong chú thích.
- issue: Ý nghĩa của παράκλησις τοῦ Ἰσραήλ
  choice: niềm an ủi của Ít-ra-en
  alternative: sự khích lệ của Ít-ra-en
  rationale: Trong bối cảnh niềm hy vọng của Ít-ra-en, “an ủi” bao hàm sự chăm sóc và phục hồi đến từ Đức Chúa Trời mà không xác định quá mức hình thức ứng nghiệm.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “Kìa” để bảo tồn điểm nhấn của ἰδοὺ; dùng dạng phiên âm quen thuộc Giê-ru-sa-lem, Si-mê-ôn và Ít-ra-en. Tránh diễn giải “niềm an ủi” thành một chương trình phục hồi cụ thể, và không thêm ý về cách Thánh Linh tác động ngoài điều câu văn nêu.
