id: LUK.2.11
reference: Luke 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: vi
  text: vì hôm nay, tại thành Đa-vít, một Đấng Cứu Thế đã sinh ra cho anh em, chính là Đấng Mê-si-a, là Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc theo cách gọi truyền thống hơn: “Đấng Ki-tô là Chúa.” Cụm từ Hy Lạp χριστὸς κύριος, theo sát chữ, là “Mê-si-a Chúa,” và thường được hiểu là “Đấng Mê-si-a, là Chúa.”'
    reason: Nêu cách dịch truyền thống và giữ lại tính cô đọng cũng như khả năng diễn giải khác nhau của hai danh hiệu trong nguyên văn Hy Lạp.
lexical_decisions:
- source_word: ὅτι
  choice: vì
  rationale: Giữ chức năng giải thích hoặc nêu lý do của lời thiên sứ ở câu trước, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐτέχθη
  choice: đã được sinh ra
  rationale: Phản ánh hình thức aorist thụ động của τίκτω; từ “đã” đánh dấu biến cố xảy ra trong ngày được loan báo.
- source_word: ὑμῖν
  choice: cho anh em
  rationale: 'Diễn đạt sắc thái lợi ích của cách dữ: Đấng Cứu Thế sinh ra vì lợi ích của những người đang nghe. “Anh em” phù hợp với nhóm người chăn chiên được thiên sứ trực tiếp nói với.'
- source_word: σήμερον
  choice: hôm nay
  rationale: Cách diễn đạt thời gian rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: σωτὴρ
  choice: Đấng Cứu Thế
  rationale: Danh xưng quen thuộc và trang trọng trong tiếng Việt, bao hàm ý nghĩa cứu thoát của σωτήρ trong bối cảnh cứu thế và vương quyền.
- source_word: ὅς ἐστιν
  choice: ngài chính là
  rationale: Diễn đạt mệnh đề quan hệ dùng để xác định Đấng Cứu Thế vừa được nói đến; “chính” làm rõ chức năng nhận diện mà không thêm một danh xưng mới.
- source_word: χριστὸς
  choice: Đấng Mê-si-a
  rationale: Ở đây Χριστός là danh hiệu gắn với niềm mong đợi về vị vua thuộc dòng Đa-vít, không phải một tên riêng.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ danh hiệu có sắc thái thẩm quyền và sức nặng thần học của κύριος; “Chủ” hoặc “Thầy” sẽ quá hẹp trong ngữ cảnh này.
- source_word: ἐν πόλει Δαυίδ
  choice: tại thành Đa-vít
  rationale: Diễn đạt tự nhiên địa điểm của biến cố, đồng thời giữ nguyên liên hệ với Đa-vít và kỳ vọng vương quyền.
theological_decisions:
- issue: Cách hiểu χριστὸς κύριος
  choice: Đấng Mê-si-a, là Chúa
  alternative: Đấng Mê-si-a của Chúa; Đấng Ki-tô là Chúa
  rationale: Hai từ Hy Lạp đều ở dạng chủ cách và tự nhiên nhất được hiểu là hai danh hiệu đồng vị xác định “Đấng Cứu Thế.” Bản dịch chính giữ cả danh hiệu Mê-si-a lẫn Chúa mà không biến cụm từ thành “Đấng Mê-si-a của Chúa,” một cách hiểu có thể có nhưng kém trực tiếp hơn. Cách gọi truyền thống “Đấng Ki-tô” được ghi ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đa-vít,” “Đấng Cứu Thế,” “Đấng Mê-si-a” và “Chúa” theo lối gọi quen thuộc trong tiếng Việt; dấu chấm phẩy giúp phân biệt lời loan báo về sự sinh ra với phần xác định các danh hiệu.
