revisions:
- from: vì hôm nay, tại thành Đa-vít, một Đấng Cứu Thế đã được sinh ra cho anh em; ngài chính là Đấng Mê-si-a, là Chúa.[a]
  to: vì hôm nay, tại thành Đa-vít, một Đấng Cứu Thế đã sinh ra cho anh em, chính là Đấng Mê-si-a, là Chúa.[a]
  rationale: Chỉnh rất nhẹ để câu tiếng Việt tự nhiên hơn và để mệnh đề nhận diện bám trực tiếp vào “Đấng Cứu Thế.” Trật tự “tại thành Đa-vít” được giữ như bản nháp, vẫn biểu đạt rõ địa điểm sự kiện. Bản chính tiếp tục dịch χριστός là “Mê-si-a” và κύριος là “Chúa”; chú thích bảo lưu lối gọi truyền thống “Ki-tô.”
