  text: καὶ ὅτε ἐγένετο ἐτῶν δώδεκα, ⸀ἀναβαινόντων ⸀αὐτῶν κατὰ τὸ ἔθος τῆς ἑορτῆς
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: vi
  text: Và khi Ngài được mười hai tuổi, trong lúc họ đang đi lên[a] theo lệ của kỳ lễ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch đơn giản là “đi lên”. Phân từ hiện tại trong tiếng Hy Lạp có thể được diễn đạt như một hành động xảy ra trong dịp ấy, nhưng bản dịch giữ sắc thái đang diễn tiến.
    reason: lexical_alternative
  - marker: b
    text: Tức là Lễ Vượt Qua, như đã nói ở câu trước.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: Ngài được mười hai tuổi
  rationale: Cấu trúc γίνομαι với cách nói tuổi bằng sở hữu cách diễn tả việc đạt đến hoặc đang ở một độ tuổi nhất định. “Được mười hai tuổi” là cách nói tự nhiên trong tiếng Việt; chủ ngữ hàm ẩn chỉ về Đức Chúa Jêsus trong văn cảnh trước.
- source_word: ἀναβαινόντων
  choice: đang đi lên
  rationale: ἀναβαίνω có nghĩa là “đi lên” và thường được dùng về hành trình lên Giê-ru-sa-lem. Phân từ hiện tại diễn tả hành động đang diễn ra đồng thời, nên “đang đi lên” giữ được sắc thái tiếp diễn mà không thêm địa danh vốn không được lặp lại trong câu này.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ này chỉ lại nhóm người trong văn cảnh, đặc biệt là cha mẹ Ngài. “Họ” giữ cách diễn đạt không xác định quá mức của nguyên văn.
- source_word: κατὰ τὸ ἔθος
  choice: theo lệ
  rationale: Cụm từ diễn tả hành động phù hợp với một tập tục đã được xác lập. “Theo lệ” ngắn gọn, tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: τῆς ἑορτῆς
  choice: của kỳ lễ
  rationale: ἑορτή chỉ một kỳ lễ tôn giáo. “Kỳ lễ” phù hợp với bối cảnh hành hương và vẫn giữ quan hệ sở hữu của nguyên văn.
- source_word: καὶ ὅτε
  choice: Và khi
  rationale: καί nối tiếp câu chuyện, còn ὅτε mở mệnh đề chỉ thời gian. “Và khi” bảo toàn cả hai chức năng.
theological_decisions: []
