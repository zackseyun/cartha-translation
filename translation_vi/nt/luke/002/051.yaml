source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: vi
  text: Rồi Ngài đi xuống cùng họ và đến Na-xa-rét, Ngài vẫn vâng phục họ[a]. Mẹ Ngài ghi nhớ mọi điều ấy[b] trong lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở dưới quyền họ.” Cách diễn đạt Hy Lạp cho thấy sự thuận phục hoặc vâng lời đang tiếp diễn.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mọi lời ấy” hoặc “mọi lời nói ấy.” Từ Hy Lạp ῥήματα có thể chỉ lời nói, lời được thuật lại, hoặc những sự việc được nói đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: đi xuống
  rationale: Giữ nghĩa địa hình của động từ καταβαίνω khi đoàn người rời Giê-ru-sa-lem, đồng thời dùng cách nói tự nhiên trong tiếng Việt.
- source_word: μετ’ αὐτῶν
  choice: cùng họ
  rationale: Dịch trực tiếp ý đồng hành; đại từ chỉ Ma-ri và Giô-sép theo văn cảnh.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: trở về Na-xa-rét
  rationale: ἔρχομαι diễn tả việc đến nơi; trong mạch truyện, Na-xa-rét là nơi gia đình đã xuất phát, nên “trở về” truyền đạt tự nhiên hướng di chuyển mà không thay đổi nội dung.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: tiếp tục vâng phục họ
  rationale: Kết cấu vị ngữ ở thì chưa hoàn thành với phân từ hiện tại diễn tả sự vâng phục đang tiếp diễn. “Vâng phục” tự nhiên hơn lối dịch tĩnh “ở dưới quyền” trong quan hệ gia đình.
- source_word: διετήρει
  choice: ghi nhớ
  rationale: διατηρέω mang nghĩa gìn giữ, bảo lưu cẩn thận; trong lòng, “ghi nhớ” là cách diễn đạt tự nhiên và không thêm sắc thái cảm xúc quá mức.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: mọi điều ấy
  rationale: ῥήματα có thể chỉ lời nói, lời được thuật lại, hoặc những sự việc được nói đến. Trong văn cảnh bao quát, “mọi điều ấy” tự nhiên và giữ được độ rộng nghĩa.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: trong lòng
  rationale: Giữ thành ngữ chỉ sự ghi nhớ và suy ngẫm nội tâm bằng cách nói quen thuộc, trang trọng trong tiếng Việt.
theological_decisions:
- issue: Mối quan hệ của Đức Giê-su với cha mẹ trần thế
  choice: tiếp tục vâng phục họ
  alternative: ở dưới quyền họ
  rationale: Bản Hy Lạp khẳng định sự thuận phục đang tiếp diễn của Đức Giê-su đối với Ma-ri và Giô-sép. Cách dịch giữ nguyên sự căng thẳng thần học của câu mà không thêm lời giải thích về thần tính hoặc nhân tính của Ngài.
- issue: Phạm vi nghĩa của ῥήματα
  choice: mọi điều ấy
  alternative: mọi lời ấy
  rationale: Không giới hạn từ này chỉ vào lời nói, vì trong văn cảnh nó có thể bao gồm cả những điều vừa xảy ra và được thuật lại.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để nối chủ thể Đức Giê-su với văn cảnh; giữ “cùng họ” và “họ” theo cấu trúc nguyên bản. Các dấu chú thích [a], [b] được đặt ngay sau những cụm từ mà chú thích giải thích.
