  terminology: “Ngài,” “Mẹ Ngài,” “vâng phục,” và “trong lòng” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Mọi điều ấy” là một cách chuyển ngữ hợp lệ và tự nhiên cho πάντα τὰ ῥήματα ταῦτα trong ngữ cảnh này; chú thích giữ lựa chọn “mọi lời ấy.”
