  to: Rồi Ngài đi xuống cùng họ và đến Na-xa-rét, Ngài vẫn vâng phục họ[a]. Mẹ Ngài ghi nhớ mọi điều ấy[b] trong lòng.
  rationale: 'Sửa “trở về” thành “đến” để không thêm ý không được phát biểu trực tiếp trong ἦλθεν εἰς Ναζαρέθ. Đổi “tiếp tục vâng phục” thành “vẫn vâng phục” vì tự nhiên hơn, song vẫn giữ sắc thái ongoing của ἦν ὑποτασσόμενος. Giữ nguyên các chú thích với đúng điểm neo: [a] giải thích sự vâng phục, [b] giải thích phạm vi nghĩa của ῥήματα.'
