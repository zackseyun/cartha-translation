  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: vi
  text: Khi những ngày thanh tẩy của họ theo luật Môi-se đã mãn[a], họ đưa con trẻ lên Giê-ru-sa-lem để dâng cho Chúa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “sự thanh tẩy của bà” thay cho “sự thanh tẩy của họ.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: đã mãn
  rationale: Động từ ở thể bị động diễn tả một khoảng thời gian đã đạt đến mức trọn vẹn; “đã mãn” tự nhiên, trang trọng và giữ sắc thái thời gian.
- source_word: καθαρισμοῦ
  choice: thanh tẩy
  rationale: Trong ngữ cảnh luật Môi-se sau khi sinh con, từ này chỉ sự thanh sạch theo nghi lễ; “thanh tẩy” rõ nghĩa và phù hợp văn phong tôn giáo-pháp lý.
- source_word: αὐτῶν
  choice: của họ
  rationale: Bản SBLGNT được cung cấp dùng đại từ số nhiều αὐτῶν, vì vậy bản văn chính giữ nguyên số nhiều thay vì điều chỉnh theo bối cảnh Lê-vi.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: theo luật Môi-se
  rationale: Diễn đạt trực tiếp sự tuân theo quy định của luật Môi-se, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀνήγαγον
  choice: đưa ... lên
  rationale: Giữ sắc thái chuyển động đi lên Giê-ru-sa-lem và phù hợp với việc cha mẹ đưa con trẻ đi.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm quen thuộc của địa danh trong tiếng Việt.
- source_word: παραστῆσαι
  choice: dâng trình ... trước
  rationale: Trong ngữ cảnh thờ phượng và luật lệ, động từ chỉ việc đem một người đến trình diện trước Đức Chúa Trời; “dâng trình ... trước Chúa” vừa tự nhiên vừa giữ sắc thái hiến dâng.
- source_word: κυρίῳ
  choice: Chúa
  rationale: Cách gọi trang trọng, quen thuộc trong tiếng Việt, phù hợp với nghĩa quy chiếu đến Đức Chúa Trời trong ngữ cảnh giao ước.
theological_decisions:
- issue: Số của đại từ trong cụm “những ngày thanh tẩy của họ”
  choice: Giữ số nhiều “của họ” trong bản văn chính
  alternative: những ngày thanh tẩy của bà
  rationale: Bản Hy Lạp được cung cấp đọc αὐτῶν (“của họ”). Dù số ít phù hợp hơn với nền luật Lê-vi và xuất hiện trong một số thủ bản, không nên âm thầm giải quyết căng thẳng này; phương án số ít được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc pháp lý-nghi lễ của câu Hy Lạp, nhưng dùng “con trẻ” để tránh đại từ giới tính thiếu tự nhiên và làm rõ đối tượng được đưa lên Giê-ru-sa-lem.
