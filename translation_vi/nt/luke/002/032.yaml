  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: vi
  text: là ánh sáng đem sự mặc khải đến cho các dân ngoại[a], và là vinh quang của dân của Ngài, tức Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các dân tộc.” Từ Hy Lạp có thể chỉ các dân tộc nói chung, nhưng ở đây có lẽ nhấn mạnh các dân ngoài Israel vì được đặt trong thế đối chiếu với Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ánh sáng
  rationale: Danh từ không có mạo từ được chuyển tự nhiên là “ánh sáng”; trong tiếng Việt không cần thêm từ tương đương với mạo từ bất định.
- source_word: εἰς
  choice: để
  rationale: “Để” diễn đạt gọn và tự nhiên ý hướng đến mục đích hoặc kết quả trong cụm εἰς ἀποκάλυψιν.
- source_word: ἀποκάλυψιν
  choice: mặc khải
  rationale: “Mặc khải” giữ được ý điều vốn bị che khuất nay được bày tỏ, đồng thời phù hợp văn phong Kinh Thánh hiện đại.
- source_word: ἐθνῶν
  choice: các dân ngoại
  rationale: Trong thế song song đối chiếu với Israel, từ này chỉ các dân không thuộc Israel; “các dân ngoại” làm rõ quan hệ ấy mà vẫn giữ sắc thái số nhiều của nguyên ngữ.
- source_word: δόξαν
  choice: vinh quang
  rationale: “Vinh quang” bảo toàn cả ý vẻ huy hoàng, danh dự và âm hưởng thần học của δόξα.
- source_word: λαοῦ σου Ἰσραήλ
  choice: dân Ngài là Israel
  rationale: Cách diễn đạt này thể hiện Israel là thành phần đồng vị xác định “dân Ngài”, đồng thời tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: καὶ
  choice: và
  rationale: 'Liên từ nối hai vế song song: sự mặc khải cho các dân ngoại và vinh quang của Israel.'
theological_decisions:
- issue: Cách hiểu ἐθνῶν trong tương quan với Israel
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Việc câu văn đặt ἐθνῶν song song với “dân Ngài là Israel” cho thấy trọng tâm là các dân ngoài Israel. Tuy vậy, nghĩa rộng “các dân tộc” vẫn là một khả năng từ vựng chính đáng nên được ghi ở chú thích.
- issue: Quan hệ ngữ pháp của δόξαν với λαοῦ σου Ἰσραήλ
  choice: vinh quang của dân Ngài là Israel
  alternative: vinh quang cho dân Ngài là Israel
  rationale: Nguyên ngữ dùng λαοῦ ở sở hữu cách, nên “của dân Ngài” bám sát cấu trúc Hy Lạp hơn. Cách hiểu theo hướng lợi ích “cho Israel” có thể được suy ra trong ngữ cảnh nhưng không nên đưa thẳng vào bản dịch.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại. Dùng “Ngài” cho đại từ chỉ Đức Chúa Trời trong lời cầu nguyện của Si-mê-ôn. Cấu trúc “dân Ngài là Israel” làm rõ quan hệ đồng vị mà không dùng dấu câu dễ gây ngắt nhịp.
