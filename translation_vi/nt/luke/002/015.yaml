id: LUK.2.15
reference: Luke 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: vi
  text: 'Bấy giờ, khi các thiên sứ đã rời khỏi họ và lên trời, những người chăn chiên nói với nhau: “Nào, chúng ta hãy đi đến tận Bết-lê-hem[a] và xem sự việc này đã xảy ra[b], là điều Chúa đã cho chúng ta biết.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch đơn giản: “đến Bết-lê-hem”; từ Hy Lạp ἕως sát nghĩa hơn là “đến tận” hoặc “cho đến”.'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp ῥῆμα có thể có nghĩa là “lời”, “điều” hoặc “sự việc”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: Khi
  rationale: Trong công thức kể chuyện của Lu-ca, cấu trúc “Khi...” truyền đạt tự nhiên hoàn cảnh thời gian và diễn tiến của câu mà không dùng lối văn cổ “Và xảy ra rằng”.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: rời họ mà lên trời
  rationale: Giữ cả ý rời khỏi những người chăn chiên và hướng đi vào trời; “trời” ở đây phù hợp với cõi thiên thượng trong văn cảnh.
- source_word: οἱ ἄγγελοι
  choice: các thiên sứ
  rationale: Cách gọi phổ thông, trang trọng và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: οἱ ποιμένες
  choice: những người chăn chiên
  rationale: Diễn đạt trực tiếp căn tính của những người đang nói; “chiên” phù hợp văn phong Kinh Thánh tiếng Việt mà vẫn dễ hiểu.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: nói với nhau
  rationale: Cách dẫn lời tự nhiên trong tiếng Việt; thì chưa hoàn thành Hy Lạp không cần được thể hiện bằng một cấu trúc kéo dài gượng ép.
- source_word: Διέλθωμεν δὴ
  choice: Nào, chúng ta hãy đi
  rationale: “Hãy” thể hiện thể giả định mang ý khích lệ cùng hành động; “nào” chuyển tải sắc thái thúc giục của δὴ.
- source_word: ἕως Βηθλέεμ
  choice: đến tận Bết-lê-hem
  rationale: “Đến tận” giữ sắc thái “cho đến/tới tận” của ἕως mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἴδωμεν
  choice: xem
  rationale: Phối hợp tự nhiên với lời khích lệ “chúng ta hãy đi” và diễn đạt mục đích tận mắt chứng kiến.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: sự việc đã xảy ra này
  rationale: Trong văn cảnh, ῥῆμα chỉ điều hoặc sự việc đã được loan báo và đã xảy ra; chú thích giữ lại phạm vi nghĩa rộng hơn của từ Hy Lạp.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: là điều Chúa đã cho chúng ta biết
  rationale: “Cho ... biết” truyền đạt ἐγνώρισεν mà không thêm sắc thái thần học chuyên biệt như “mặc khải”; “Chúa” giữ nguyên cách gọi κύριος.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος
  choice: Chúa
  alternative: Đức Chúa Trời, hoặc xác định cụ thể là Chúa Cha hay Đấng Mê-si mới sinh
  rationale: Văn cảnh cho thấy Đức Chúa Trời là nguồn của điều được các thiên sứ loan báo, nhưng nguyên văn chỉ dùng κύριος. Bản dịch giữ “Chúa” để không thu hẹp hay giải quyết quá mức âm hưởng thần học của danh xưng này.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu dẫn được làm tự nhiên theo lối kể chuyện tiếng Việt; các sắc thái khó chuyển hết của ἕως và ῥῆμα được bảo lưu trong chú thích.
