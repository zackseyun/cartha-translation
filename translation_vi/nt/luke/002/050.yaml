  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: vi
  text: Và họ không hiểu lời Người nói với họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “câu nói”, “lời nói” hoặc “điều Người nói”.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Nhưng
  rationale: Trong mạch kể, liên từ καὶ nối câu này với lời đáp vừa gây ngạc nhiên của Đức Giê-su; tiếng Việt tự nhiên dùng “Nhưng” để diễn đạt sự tương phản theo ngữ cảnh mà không làm thay đổi nội dung mệnh đề.
- source_word: αὐτοὶ
  choice: họ
  rationale: Đại từ chỉ cha mẹ của Đức Giê-su trong ngữ cảnh. Tiếng Việt không cần thêm “chính họ” vì sắc thái nhấn mạnh không thiết yếu ở đây.
- source_word: οὐ συνῆκαν
  choice: không hiểu
  rationale: Diễn đạt trực tiếp nghĩa của συνίημι là hiểu hoặc lĩnh hội, không giảm nhẹ thành “không hiểu hết” và cũng không đổi thành ý không chấp nhận.
- source_word: τὸ ῥῆμα
  choice: lời
  rationale: ῥῆμα ở đây chỉ điều Đức Giê-su vừa nói. “Lời” vừa tự nhiên, trang trọng, vừa giữ được phạm vi nghĩa có thể là lời nói, câu nói hoặc sự việc được nói đến.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: Người nói với họ
  rationale: Giữ quan hệ bổ nghĩa của mệnh đề Hy Lạp và diễn đạt λαλέω bằng động từ thông dụng “nói”. “Người” là đại từ kính trọng, tự nhiên trong văn phong Kinh Thánh tiếng Việt khi chỉ Đức Giê-su.
theological_decisions:
- issue: Cách thuật lại phản ứng của cha mẹ Đức Giê-su
  choice: Khẳng định thẳng rằng họ không hiểu lời Đức Giê-su nói.
  alternative: “Họ không hiểu hết” hoặc “họ không chấp nhận.”
  rationale: Bản Hy Lạp nói đến việc không hiểu, không xác định đó chỉ là hiểu chưa đầy đủ và cũng không nói đến sự khước từ. Cách dịch giữ nguyên căng thẳng thần học của trình thuật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, ngắn gọn và trang trọng. Dùng “Người” để chỉ Đức Giê-su; câu văn dễ hiểu đối với độc giả phổ thông. Dấu chú thích [a] xuất hiện ngay sau câu chính.
