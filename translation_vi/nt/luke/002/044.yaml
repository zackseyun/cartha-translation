  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: vi
  text: Nhưng họ tưởng rằng cậu đang ở trong đoàn người cùng đi[a]. Sau khi đi một ngày đường, họ bắt đầu tìm[b] cậu trong số bà con và những người quen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đoàn lữ hành”; từ Hy Lạp συνοδία chỉ một nhóm người cùng đi đường.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “đang tìm”; thì chưa hoàn thành của động từ Hy Lạp có thể nhấn mạnh tính liên tục của việc tìm kiếm.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: vì nghĩ rằng
  rationale: Diễn đạt một nhận định mà cha mẹ Chúa Giê-su cho là đúng vào lúc ấy, nhưng thực tế chưa được kiểm chứng; cách nói tự nhiên trong tiếng Việt và không làm cho mức độ chắc chắn mạnh hơn nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: 'Thể hiện bước chuyển nhẹ có tính tương phản với câu trước: họ không thấy Chúa Giê-su nhưng lại nghĩ cậu đang đi cùng đoàn.'
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: đang ở trong đoàn người cùng đi
  rationale: συνοδία chỉ một nhóm người cùng đi đường. Cách dịch này rõ nghĩa, tự nhiên và tránh gợi những nét văn hóa không nhất thiết có trong từ Hy Lạp.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: họ đi trọn một ngày đường
  rationale: Chuyển đạt thành ngữ Hy Lạp về quãng đường hoặc thời gian đi trong một ngày; “một ngày đường” là cách nói quen thuộc trong tiếng Việt.
- source_word: ἀνεζήτουν
  choice: bắt đầu tìm
  rationale: Thì chưa hoàn thành trong văn mạch có thể nhấn mạnh sự khởi đầu rồi tiếp diễn của cuộc tìm kiếm. Bản dịch chính thể hiện sắc thái khởi đầu, còn chú thích giữ cách hiểu nhấn mạnh hành động đang tiếp diễn.
- source_word: συγγενεῦσιν
  choice: bà con
  rationale: Chỉ những người có quan hệ họ hàng nói chung; “bà con” tự nhiên, bao quát và phù hợp văn phong kể chuyện hiện đại.
- source_word: γνωστοῖς
  choice: những người quen
  rationale: Chỉ những người họ biết, không nhất thiết là bạn thân; cách dịch này giữ đúng phạm vi nghĩa rộng hơn “bạn bè”.
- source_word: αὐτόν
  choice: cậu
  rationale: Đại từ Hy Lạp chỉ Chúa Giê-su lúc mười hai tuổi. “Cậu” phù hợp với tuổi và ngữ cảnh kể chuyện, đồng thời tránh thêm vào nguyên văn một tước hiệu thần học.
