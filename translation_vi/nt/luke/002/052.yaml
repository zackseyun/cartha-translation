source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: vi
  text: Đức Giê-su tiếp tục tiến bộ về sự khôn ngoan và tầm vóc[a], đồng thời càng được Đức Chúa Trời và mọi người quý mến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tuổi tác” hoặc “mức trưởng thành.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: ngày càng thêm… lớn lên… và được… quý mến
  rationale: Thể chưa hoàn thành diễn tả sự tiến triển liên tục theo thời gian. Cách diễn đạt bằng ba vế song song tự nhiên trong tiếng Việt, đồng thời giữ ý về sự phát triển thật sự.
- source_word: σοφίᾳ
  choice: khôn ngoan
  rationale: Cách dịch thông dụng và rõ ràng, bao hàm sự hiểu biết cùng khả năng phân định.
- source_word: ἡλικίᾳ
  choice: vóc dáng
  rationale: Từ Hy Lạp có thể chỉ vóc dáng, tuổi tác hoặc mức trưởng thành. Trong ngữ cảnh này, “vóc dáng” diễn tả rõ sự lớn lên về thể chất; các nghĩa khác được giữ trong chú thích.
- source_word: χάριτι
  choice: được… quý mến
  rationale: Trong cấu trúc với παρά và các đối tượng Đức Chúa Trời, mọi người, χάρις chỉ sự ưu ái hoặc thiện cảm trong mối quan hệ, không nhất thiết là “ân điển” theo nghĩa thần học chuyên biệt.
- source_word: παρὰ θεῷ
  choice: được Đức Chúa Trời… quý mến
  rationale: Παρά với tặng cách diễn tả vị thế trong mắt hoặc trong mối quan hệ với Đức Chúa Trời. Cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ἀνθρώποις
  choice: mọi người
  rationale: Số nhiều ἄνθρωποι ở đây chỉ loài người nói chung, không riêng nam giới; “mọi người” truyền đạt đúng phạm vi quy chiếu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sự phát triển về nhân tính của Đức Giê-su
  choice: Dịch thẳng câu này như lời khẳng định Đức Giê-su thật sự phát triển về sự khôn ngoan, thể chất và sự quý mến.
  alternative: Diễn đạt giảm nhẹ hoặc che khuất sự phát triển của Đức Giê-su nhằm tránh căng thẳng thần học.
  rationale: Bản Hy Lạp nói rõ Đức Giê-su tiến triển. Bản dịch giữ nguyên lời khẳng định về nhân tính thật của Ngài, không tự ý giải quyết hoặc làm mờ căng thẳng thần học.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Giê-su” và “Đức Chúa Trời”; triển khai động từ thành các vế song song để câu tự nhiên mà vẫn phản ánh tiến trình liên tục của nguyên văn.
