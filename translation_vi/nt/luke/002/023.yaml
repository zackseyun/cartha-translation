  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: vi
  text: 'như đã chép trong Luật của Chúa rằng: “Mọi con trai đầu lòng[a] sẽ được gọi là thánh cho Chúa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “mọi con trai mở lòng mẹ”, tức là con trai đầu lòng.'
    reason: lexical_alternative
  - marker: b
    text: Nghĩa là người con trai đầu lòng được xem là thánh, hay được biệt riêng cho Chúa; xem Xuất Hành 13:2, 12.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: như đã chép
  rationale: Dùng công thức trích dẫn Kinh Thánh tự nhiên trong tiếng Việt, đồng thời giữ ý văn bản đã được chép và vẫn có thẩm quyền.
- source_word: ἐν νόμῳ κυρίου
  choice: trong Luật của Chúa
  rationale: νόμος chỉ Luật Môi-se với tư cách là thẩm quyền Kinh Thánh; viết hoa “Luật” để biểu thị bộ luật này. κύριος được dịch là “Chúa” theo trực tiếp bản Hy Lạp.
- source_word: ὅτι
  choice: 'rằng:'
  rationale: “Rằng” giới thiệu nội dung được chép; dấu hai chấm giúp câu trích dẫn rõ ràng và tự nhiên trong tiếng Việt.
- source_word: Πᾶν ἄρσεν
  choice: mọi con trai
  rationale: Giữ rõ nghĩa giống đực của ἄρσεν; “con trai” tự nhiên hơn “người nam” trong ngữ cảnh trẻ sơ sinh.
- source_word: διανοῖγον μήτραν
  choice: đầu lòng
  rationale: Đây là thành ngữ Kinh Thánh chỉ con trai đầu tiên ra khỏi lòng mẹ. “Đầu lòng” truyền đạt đúng ý trong tiếng Việt hiện đại; cách diễn đạt sát chữ được bảo lưu trong chú thích.
- source_word: ἅγιον
  choice: thánh
  rationale: Giữ nguyên từ ngữ về sự thánh khiết thay vì thay bằng lối giải thích như “được biệt riêng” hay “được hiến dâng”.
- source_word: τῷ κυρίῳ
  choice: cho Chúa
  rationale: Diễn đạt quan hệ quy thuộc hoặc dâng riêng được thể hiện bởi cách dữ cách, nhưng không thu hẹp nó vào duy nhất một sắc thái giải thích.
- source_word: κληθήσεται
  choice: sẽ được gọi
  rationale: Phản ánh trực tiếp thể tương lai bị động và giữ sắc thái trang trọng của lời trích dẫn.
theological_decisions:
- issue: Cách dịch κύριος trong lời trích Luật của Israel
  choice: Chúa
  alternative: ĐỨC CHÚA
  rationale: Bản nguồn Hy Lạp dùng κύριος. “Chúa” dịch trực tiếp từ bản Hy Lạp, dù đoạn Luật nền tảng trong Xuất Hành phản ánh danh riêng của Đức Chúa Trời trong tiếng Hê-bơ-rơ.
- issue: Ngôn ngữ về sự thánh so với ngôn ngữ giải thích sự hiến dâng
  choice: thánh cho Chúa
  alternative: được biệt riêng cho Chúa
  rationale: ἅγιον có nghĩa trực tiếp là “thánh”. Bản chính giữ sự căng thẳng và liên hệ từ vựng với phạm trù thánh khiết; chú thích giải thích hàm ý được biệt riêng hoặc hiến dâng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Đầu lòng” được chọn thay cho lối dịch sát nhưng khó tự nhiên “mở dạ mẹ”; “thánh cho Chúa” được giữ để không xóa đi ngôn ngữ thánh khiết và sắc thái quy thuộc trong nguyên văn.
