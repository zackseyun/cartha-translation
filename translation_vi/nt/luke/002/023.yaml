  terminology: «Luật», «Chúa», và «thánh» được dùng nhất quán, phù hợp văn bản Hy Lạp và không thay ngôn ngữ thánh khiết bằng một diễn giải giáo phái. «Con trai đầu lòng» là cách chuyển ngữ tự nhiên, chính xác theo ngữ cảnh cho thành ngữ «mở lòng mẹ».
