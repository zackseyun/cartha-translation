base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: vi
  text: 'Ông đón lấy hài nhi vào vòng tay mình, chúc tụng Đức Chúa Trời và nói rằng:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: đón lấy
  rationale: Động từ có nghĩa là tiếp nhận hoặc đón nhận; đi với cụm “vào vòng tay” nên “đón lấy” vừa tự nhiên vừa diễn tả hành động bế nhận hài nhi.
- source_word: αὐτό
  choice: hài nhi
  rationale: Đại từ trung tính quy chiếu về hài nhi Giê-xu. Lặp lại danh từ giúp tiếng Việt rõ nghĩa và tránh cách dịch máy móc theo giống ngữ pháp.
- source_word: εἰς τὰς ἀγκάλας
  choice: vào vòng tay mình
  rationale: Cụm này chỉ hai cánh tay dùng để ôm hoặc bế. “Vòng tay mình” diễn đạt tự nhiên sở hữu được hàm ý theo ngữ cảnh, dù tiếng Hy Lạp không có đại từ sở hữu rõ.
- source_word: εὐλόγησεν τὸν θεόν
  choice: chúc tụng Đức Chúa Trời
  rationale: Khi Đức Chúa Trời là đối tượng, εὐλογέω mang nghĩa nói lời tôn vinh, chúc tụng. “Chúc tụng” giữ sắc thái kinh thánh mà vẫn dễ hiểu.
- source_word: καὶ εἶπεν
  choice: 'và nói rằng:'
  rationale: Dấu hai chấm tự nhiên trong tiếng Việt vì câu tiếp theo là lời nói trực tiếp.
- source_word: αὐτός
  choice: ông
  rationale: Đại từ chỉ Si-mê-ôn, có chút nhấn mạnh nhưng không cần dịch quá mạnh thành “chính ông”; “ông” duy trì mạch kể tự nhiên.
theological_decisions:
- issue: Đối tượng quy chiếu của đại từ trung tính αὐτό
  choice: Hiểu là hài nhi Giê-xu và dịch “hài nhi”.
  alternative: Dịch sát hình thức đại từ trung tính bằng một đại từ phi nhân xưng.
  rationale: Giống trung tính là sự hòa hợp ngữ pháp với danh từ chỉ trẻ nhỏ, không phủ nhận tính ngôi vị của Giê-xu. Tiếng Việt cần dùng cách quy chiếu phù hợp với một con người.
- issue: Nghĩa của εὐλόγησεν khi Đức Chúa Trời là đối tượng
  choice: chúc tụng Đức Chúa Trời
  alternative: ngợi khen Đức Chúa Trời
  rationale: “Chúc tụng” bảo tồn nghĩa từ vựng và sắc thái của động từ, còn “ngợi khen” cũng có thể diễn đạt ý nghĩa trong ngữ cảnh nhưng kém gần hình thức hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “hài nhi” để phù hợp bối cảnh và “Đức Chúa Trời” làm cách gọi trang trọng. Không thêm chú thích vì “đón lấy” giữ được cả sắc thái tiếp nhận lẫn hành động bế vào tay.
