source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: vi
  text: Sau ba ngày, họ tìm thấy Người trong Đền Thờ[a], đang ngồi giữa các thầy, lắng nghe họ và hỏi họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Từ Hy Lạp ἱερόν chỉ toàn bộ khu đền thờ, chứ không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: b
    text: 'Hoặc: “chất vấn họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Chuyện xảy ra là
  rationale: Giữ chức năng mở đầu sự việc thường thấy trong lối kể chuyện của Lu-ca, đồng thời tránh cách diễn đạt cổ như “bấy giờ xảy ra rằng”.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: sau ba ngày
  rationale: Bám sát cấu trúc thời gian của tiếng Hy Lạp và vẫn tự nhiên trong tiếng Việt.
- source_word: εὗρον αὐτόν
  choice: họ tìm thấy cậu
  rationale: Động từ được dịch trực tiếp; “cậu” phù hợp với Chúa Giê-su lúc mười hai tuổi trong ngữ cảnh mà không thêm danh xưng tôn giáo không có trong câu Hy Lạp.
- source_word: ἐν τῷ ἱερῷ
  choice: trong khuôn viên Đền Thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong; “khuôn viên Đền Thờ” diễn đạt rõ phạm vi này trong tiếng Việt hiện đại.
- source_word: καθεζόμενον ἐν μέσῳ τῶν διδασκάλων
  choice: đang ngồi giữa các thầy dạy
  rationale: Giữ hình ảnh tư thế đang diễn ra và vị trí ở giữa những người giảng dạy; không tự ý thêm “Luật pháp” vì nguyên văn chỉ nói διδάσκαλοι.
- source_word: ἀκούοντα αὐτῶν
  choice: lắng nghe
  rationale: Diễn tả hành động nghe chăm chú trong cuộc trao đổi, tự nhiên hơn “nghe họ” khi đã nối với vế sau.
- source_word: ἐπερωτῶντα αὐτούς
  choice: đặt câu hỏi cho họ
  rationale: Thể hiện việc chủ động hỏi trong cuộc trao đổi mà không gợi sắc thái đối đầu hay thẩm vấn.
theological_decisions:
- issue: Tính chất cuộc tương tác giữa Chúa Giê-su và các thầy dạy
  choice: “lắng nghe và đặt câu hỏi cho họ”
  alternative: “lắng nghe và chất vấn họ”
  rationale: Nguyên văn mô tả cả việc nghe lẫn hỏi. Bản dịch giữ nét khiêm nhường và chủ động của cậu bé Giê-su nhưng không biến cuộc trao đổi thành một cuộc đối đầu, cũng không suy diễn về bản chất tri thức của Ngài.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Đền Thờ” được viết hoa để chỉ Đền Thờ tại Giê-ru-sa-lem; “cậu” phản ánh tuổi của Chúa Giê-su trong ngữ cảnh mà không dùng đại từ quá khẩu ngữ hay áp đặt sắc thái thần học.
