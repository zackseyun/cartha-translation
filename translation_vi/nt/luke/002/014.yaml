revisions:
- from: 'Vinh quang thuộc về Đức Chúa Trời trên chốn cao nhất,

    và bình an dưới đất giữa những người Ngài vui lòng.[a][b]'
  to: 'Vinh quang thuộc về Đức Chúa Trời trên các nơi rất cao,

    và bình an dưới đất giữa những người Ngài vui lòng.[a][b]'
  rationale: Chỉ chỉnh lối diễn đạt “trên chốn cao nhất” thành “trên các nơi rất cao” để tiếng Việt tự nhiên hơn và phản ánh tốt hơn số nhiều của ὑψίστοις. Chỉnh nhẹ chú thích dị bản cho cú pháp tiếng Việt trọn vẹn. Cấu trúc εὐδοκίας, giới hạn đối tượng của bình an, vẫn được giữ nguyên; không áp đặt diễn giải tín lý.
