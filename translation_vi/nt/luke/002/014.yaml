  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: vi
  text: 'Vinh quang thuộc về Đức Chúa Trời trên các nơi rất cao,

    và bình an dưới đất giữa những người Ngài vui lòng.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giữa những người được Ngài ban ân huệ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Một số thủ bản chép: “và bình an dưới đất, sự thiện ý giữa loài người.”'
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Vinh quang
  rationale: Giữ sức nặng phụng vụ và thần học của lời tung hô; trong câu tỉnh lược động từ, “Vinh quang thuộc về” diễn đạt tự nhiên ý quy vinh quang cho Đức Chúa Trời.
- source_word: ἐν ὑψίστοις
  choice: trên chốn cao nhất
  rationale: Diễn tả cõi cao nhất và giữ sự đối xứng không gian với “dưới đất”, mà không tự ý xác định cụ thể là một tầng trời nào.
- source_word: θεῷ
  choice: thuộc về Đức Chúa Trời
  rationale: Chuyển cách dữ cách dùng để quy vinh quang thành lối nói tiếng Việt tự nhiên.
- source_word: ἐπὶ γῆς
  choice: dưới đất
  rationale: Cách diễn đạt quen thuộc, rõ nghĩa và đối xứng tự nhiên với “trên chốn cao nhất”.
- source_word: εἰρήνη
  choice: bình an
  rationale: “Bình an” giữ được sắc thái rộng của εἰρήνη trong Kinh Thánh, hơn là chỉ tình trạng không có chiến tranh.
- source_word: ἐν ἀνθρώποις
  choice: giữa những người
  rationale: ἄνθρωποι chỉ con người nói chung; tiếng Việt “những người” vừa chính xác vừa tự nhiên, không cần thêm chú thích về giống ngữ pháp.
- source_word: εὐδοκίας
  choice: Ngài vui lòng
  rationale: Chuyển danh từ sở hữu cách thành mệnh đề quan hệ tự nhiên trong tiếng Việt, hiểu những người ấy là đối tượng của sự vui lòng/ân huệ từ Đức Chúa Trời. Đại từ “Ngài” làm rõ chủ thể vốn được hàm ý bởi ngữ cảnh.
theological_decisions:
- issue: Ý nghĩa của sở hữu cách εὐδοκίας
  choice: “giữa những người Ngài vui lòng” gắn bình an với những người là đối tượng của sự vui lòng hay ân huệ của Đức Chúa Trời.
  alternative: “bình an, thiện ý giữa loài người”, theo dị bản chủ cách εὐδοκία.
  rationale: SBLGNT in εὐδοκίας ở sở hữu cách, nên cụm này bổ nghĩa cho “những người”, chứ không phải một thành phần thứ ba độc lập. Bản dịch không giải thích thêm họ được vui lòng trên cơ sở nào, nhờ đó tránh áp đặt một hệ thống tín lý.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, thích hợp cho lời công bố của thiên sứ. Dùng “Đức Chúa Trời” và đại từ tôn kính “Ngài”; xuống dòng để làm rõ hai vế song song. Không giữ chú thích tiếng Anh về từ “men”, vì “những người” trong tiếng Việt vốn không mang giới tính và đã chuyển đúng nghĩa chỉ nhân loại nói chung.
