revisions:
- from: rồi sống góa bụa cho đến năm tám mươi bốn tuổi[a]. Bà không rời khỏi khuôn viên đền thờ[b], ngày đêm thờ phượng bằng việc kiêng ăn và những lời cầu xin[c].
  to: rồi sống góa bụa đến tuổi tám mươi bốn[a]. Bà không rời khỏi khuôn viên đền thờ[b], ngày đêm thờ phượng với việc kiêng ăn và những lời cầu xin[c].
  rationale: Chỉnh “cho đến năm tám mươi bốn tuổi” thành “đến tuổi tám mươi bốn” để diễn đạt đúng và tự nhiên cách hiểu chính về tuổi của An-na. Chỉnh “bằng” thành “với” để diễn tả tự nhiên hơn phương cách bà phụng sự. Các chú thích và vị trí neo chú thích được giữ nguyên, bảo toàn cách đọc thay thế về thời gian góa bụa và sắc thái của ἱερόν तथा δέησις.
