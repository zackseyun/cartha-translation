language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: vi
  text: rồi sống góa bụa đến tuổi tám mươi bốn[a]. Bà không rời khỏi khuôn viên đền thờ[b], ngày đêm thờ phượng với việc kiêng ăn và những lời cầu xin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “rồi sống góa bụa suốt tám mươi bốn năm.” Tiếng Hy Lạp có thể nói về tuổi của An-na hoặc khoảng thời gian bà sống góa bụa.'
    reason: alternative_reading
  - marker: b
    text: Từ Hy Lạp ở đây chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “những lời khẩn cầu” hoặc “những lời thỉnh nguyện.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: sống góa bụa
  rationale: Diễn đạt tự nhiên tình trạng của một phụ nữ có chồng đã qua đời, đồng thời nối tiếp mạch mô tả từ câu trước.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: cho đến năm tám mươi bốn tuổi
  rationale: Cách hiểu chính là cụm từ cho biết tuổi của An-na; cấu trúc Hy Lạp cô đọng cũng có thể chỉ thời gian bà sống góa bụa, nên giữ cách hiểu ấy trong chú thích.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: không rời khỏi khuôn viên đền thờ
  rationale: Thì chưa hoàn thành diễn tả thói quen liên tục; cách dịch tránh hàm ý bà tuyệt đối không bao giờ bước ra ngoài và làm rõ phạm vi của ἱερόν.
- source_word: ἱεροῦ
  choice: khuôn viên đền thờ
  rationale: ἱερόν chỉ toàn bộ khu đền thờ, không riêng nơi thánh bên trong vốn thường được gọi là ναός.
- source_word: νηστείαις
  choice: việc kiêng ăn
  rationale: Chỉ việc thực hành kiêng ăn mang tính tôn giáo; tiếng Việt không cần đánh dấu số nhiều về hình thái.
- source_word: δεήσεσιν
  choice: những lời cầu xin
  rationale: Giữ sắc thái khẩn cầu, thỉnh nguyện cụ thể của δέησις rõ hơn từ khái quát 'cầu nguyện'.
- source_word: λατρεύουσα
  choice: thờ phượng
  rationale: Trong ngữ cảnh tôn giáo, phân từ này diễn tả việc phụng sự Thiên Chúa bằng sự thờ phượng; 'thờ phượng' rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: νύκτα καὶ ἡμέραν
  choice: ngày đêm
  rationale: Thành ngữ tiếng Việt tự nhiên diễn tả sự chuyên tâm liên tục, dù đảo trật tự 'đêm và ngày' của tiếng Hy Lạp.
theological_decisions:
- issue: Cụm từ nói về tuổi của An-na hay thời gian bà sống góa bụa
  choice: Bản văn chính hiểu rằng bà sống góa bụa cho đến khi tám mươi bốn tuổi.
  alternative: Cụm từ có thể có nghĩa bà đã sống góa bụa suốt tám mươi bốn năm.
  rationale: Cú pháp Hy Lạp cho phép cả hai cách liên hệ với câu trước. Chọn cách hiểu về tuổi trong bản văn vì phù hợp cách đọc trực tiếp, nhưng ghi nhận cách hiểu về thời gian góa bụa để không xóa bỏ sự mơ hồ thật sự.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “khuôn viên đền thờ” để chuyển tải chính xác ἱερόν; dùng “ngày đêm” theo thành ngữ tiếng Việt tự nhiên. Mọi dấu chú thích [a], [b], [c] đều có mặt trong bản văn chính.
