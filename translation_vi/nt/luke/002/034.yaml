language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: vi
  text: 'Si-mê-ôn chúc phước cho họ rồi nói với Ma-ri, mẹ của con trẻ: “Kìa, con trẻ này được đặt để cho sự vấp ngã và sự đứng dậy của nhiều người trong Y-sơ-ra-ên, và làm một dấu hiệu bị chống đối.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bị chống đối” cũng có thể hiểu là “bị người ta nói chống lại.”
    reason: Làm rõ sắc thái của ἀντιλεγόμενον, vốn có thể chỉ cả sự phản bác bằng lời lẫn sự chống đối rộng hơn.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: chúc phước
  rationale: Diễn đạt tự nhiên hành động ban lời chúc lành, đồng thời giữ sắc thái tôn giáo của động từ Hy Lạp.
- source_word: Ἰδοὺ
  choice: Kìa
  rationale: Giữ chức năng thu hút sự chú ý của từ chỉ thị mà vẫn trang trọng, tự nhiên trong tiếng Việt.
- source_word: οὗτος
  choice: con trẻ này
  rationale: Trong ngữ cảnh, đại từ chỉ về hài nhi Giê-su; cách dịch này rõ nghĩa mà không thêm cách giải thích thần học.
- source_word: κεῖται εἰς
  choice: được đặt để khiến
  rationale: Giữ hình ảnh một vai trò hoặc số phận đã được ấn định, đồng thời thể hiện quan hệ hướng đến kết quả của εἰς mà không xác định rõ tác nhân.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: vấp ngã và đứng dậy
  rationale: Giữ cặp hình ảnh đối lập của nguyên ngữ; “đứng dậy” bảo toàn khả năng chỉ sự phục hồi hoặc sự sống lại thay vì giải nghĩa hẹp.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: một dấu hiệu bị chống đối
  rationale: 'Thể hiện phân từ bị động hiện tại: dấu hiệu gặp sự phản bác, chống đối.'
theological_decisions:
- issue: Ý nghĩa của πτῶσις và ἀνάστασις
  choice: vấp ngã và đứng dậy
  alternative: sa ngã và phục sinh
  rationale: Nguyên ngữ cho phép cả nghĩa ẩn dụ về sự suy sụp/phục hồi lẫn âm hưởng sự sống lại. Bản dịch giữ hình ảnh rộng, không ấn định rằng hai danh từ nhất thiết chỉ hai nhóm người hay một trình tự cứu rỗi cụ thể.
- issue: Tác nhân hàm ẩn trong κεῖται
  choice: được đặt để
  alternative: được Đức Chúa Trời chỉ định
  rationale: Dạng Hy Lạp không nêu tác nhân. Không thêm “Đức Chúa Trời” giúp tránh làm rõ quá mức điều nguyên văn để ngỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Si-mê-ôn,” “Ma-ri,” “Y-sơ-ra-ên” theo lối phiên âm Kinh Thánh quen thuộc; “con trẻ” phù hợp ngữ cảnh và tránh đại từ thiếu rõ ràng.
