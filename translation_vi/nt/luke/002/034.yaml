  terminology: “Dấu hiệu bị chống đối” là cách chuyển ngữ chấp nhận được cho σημεῖον ἀντιλεγόμενον; chú thích nêu khả năng phản bác bằng lời một cách dè dặt. “Sự vấp ngã và sự đứng dậy” bảo toàn cặp hình ảnh của πτῶσις/ἀνάστασις mà không ấn định một cách hiểu giáo phái như “phục sinh.”
