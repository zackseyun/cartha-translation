source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: vi
  text: Khi họ đang ở đó, những ngày để nàng sinh con đã mãn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những ngày để nàng sinh con đã trọn.”'
    reason: Biến thể từ vựng nhằm làm rõ rằng ἐπλήσθησαν có thể được hiểu là đạt đến chỗ hoàn tất hoặc trọn đủ.
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Khi ... thì ...
  rationale: Trong mạch kể chuyện, cụm này chủ yếu chuyển tiếp sang sự việc xảy ra tiếp theo. Cấu trúc “Khi ... thì ...” diễn đạt tự nhiên sự chuyển tiếp ấy cùng quan hệ thời gian, không cần dịch cứng là “và điều xảy ra là”.
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: Khi họ đang ở đó
  rationale: Cấu trúc nguyên mẫu có mạo từ đi với ἐν chỉ thời gian đồng thời; “khi họ đang ở đó” vừa tự nhiên trong tiếng Việt vừa giữ được ý sự việc diễn ra trong thời gian họ lưu lại nơi ấy.
- source_word: ἐπλήσθησαν
  choice: đã mãn
  rationale: Động từ ở đây diễn tả các ngày đã đạt đến mức trọn đủ. “Đã mãn” giữ hình ảnh thời hạn đi đến chỗ hoàn tất, thay vì giản lược thành “đã đến lúc”.
- source_word: αἱ ἡμέραι
  choice: những ngày
  rationale: Bản Hy Lạp nói rõ “những ngày”. Giữ cách nói này bảo toàn lối diễn đạt của Lu-ca và vẫn dễ hiểu trong tiếng Việt.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: để nàng sinh con
  rationale: Cụm nguyên mẫu sở hữu nêu điều mà những ngày ấy hướng đến, tức việc người nữ sinh con. “Để nàng sinh con” rõ ràng, gọn và giữ sắc thái động từ của τίκτω.
theological_decisions:
- issue: Khả năng hàm ý thời điểm được định trước hoặc sự ứng nghiệm trong ἐπλήσθησαν αἱ ἡμέραι
  choice: Giữ cách nói “những ngày ... đã mãn”
  alternative: Đã đến lúc nàng sinh con
  rationale: Câu trước hết nói thai kỳ đã đến kỳ sinh, nhưng ngôn ngữ “đã mãn” cũng có thể gợi âm hưởng hoàn tất trong văn phong Lu-ca. Bản dịch giữ độ căng này mà không thêm lời khẳng định thần học không có trong câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “nàng” phù hợp lối kể chuyện trang nghiêm, tránh thêm tên riêng không xuất hiện trong câu Hy Lạp. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
