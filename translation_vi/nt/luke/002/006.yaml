  source_fidelity: Bản dịch chuyển đạt đúng quan hệ thời gian của ἐν τῷ εἶναι αὐτοὺς ἐκεῖ và ý các ngày đã đạt đến sự hoàn tất trong ἐπλήσθησαν αἱ ἡμέραι. Cụm “để nàng sinh con” diễn đạt trung thành nội dung của τοῦ τεκεῖν αὐτήν mà không thêm diễn giải.
  naturalness: “Khi họ đang ở đó” là tiếng Việt hiện đại, rõ nghĩa. “Những ngày ... đã mãn” có sắc thái trang trọng hơi Kinh Thánh, nhưng vẫn dễ hiểu và phù hợp văn cảnh tự sự; đồng thời giữ được hình ảnh số nhiều “những ngày” của nguyên ngữ.
  terminology: “Đã mãn” bảo toàn sắc thái hoàn tất/trọn đủ của ἐπλήσθησαν tốt hơn cách diễn đạt giản lược “đã đến lúc”. Đại từ “nàng” phù hợp đăng ký kể chuyện trang trọng và không thêm tên riêng vào câu. Chú thích nêu một phương án từ vựng chính đáng, có neo [a] đúng vị trí.
