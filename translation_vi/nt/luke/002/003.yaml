id: LUK.2.3
reference: Luke 2:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: vi
  text: Mọi người đều đi đăng ký[a], mỗi người đến thành của mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ghi danh” hoặc “được ghi tên vào sổ”. Động từ Hy Lạp nói đến việc đăng ký chính thức trong cuộc kiểm kê dân số.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: đều đi
  rationale: Thể chưa hoàn thành diễn tả việc mọi người đang lần lượt lên đường trong diễn tiến câu chuyện. “Đều đi” tự nhiên trong tiếng Việt và, khi kết hợp với πάντες, vẫn truyền đạt tính phổ quát cùng diễn tiến của hành động.
- source_word: πάντες
  choice: mọi người
  rationale: Diễn đạt tự nhiên ý “tất cả” khi từ này chỉ người, không thêm một nhóm người cụ thể mà nguyên văn không nêu.
- source_word: ἀπογράφεσθαι
  choice: đăng ký
  rationale: Trong ngữ cảnh cuộc kiểm kê dân số, động từ chỉ việc chính thức ghi tên vào sổ. “Đăng ký” rõ ràng, hiện đại và không diễn giải quá mức rằng mục đích chỉ là đếm người.
- source_word: ἕκαστος
  choice: mỗi người
  rationale: Giữ sắc thái phân phối, nhấn mạnh từng cá nhân trong toàn thể.
- source_word: ἑαυτοῦ
  choice: của mình
  rationale: Đại từ phản thân tiếng Việt “của mình” tự nhiên và quy chiếu rõ đến “mỗi người”. Tiếng Việt không bắt buộc biểu thị giống ngữ pháp, nên cách dịch này không xóa bỏ một đối lập giới tính có ý nghĩa trong câu.
- source_word: πόλιν
  choice: thành
  rationale: πόλις có thể chỉ thành phố hoặc thị trấn. “Thành” là cách gọi ngắn gọn, trang trọng vừa phải, phù hợp bối cảnh cổ đại mà không thêm ý “quê hương” hay “thành tổ tiên” vốn không được nói trực tiếp.
theological_decisions:
- issue: Cách diễn đạt số ít giống đực trong ἕκαστος … ἑαυτοῦ
  choice: “mỗi người đến thành của mình”
  alternative: “mỗi người nam đến thành của ông ấy”
  rationale: Giống đực số ít ở đây thuộc cấu trúc phân phối của tiếng Hy Lạp. Tiếng Việt dùng “mình” một cách tự nhiên mà không đánh dấu giống; thêm “người nam” hoặc “ông ấy” sẽ khiến câu hàm ý loại trừ phụ nữ, điều ngữ cảnh và cấu trúc ngữ pháp không nhất thiết khẳng định.
translation_notes:
  register: Văn phong hiện đại, rõ ràng và trang trọng vừa phải. Tránh “đăng bộ” vì cổ và khó hiểu; không dùng “về quê” hay “quê quán” vì những cách ấy thêm ý không có trực tiếp trong câu Hy Lạp.
