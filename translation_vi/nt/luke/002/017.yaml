source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: vi
  text: Khi thấy vậy, họ cho biết điều[a] đã được nói với họ về hài nhi này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “lời” hoặc “sứ điệp” đã được nói với họ về hài nhi này.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Khi thấy vậy
  rationale: Phân từ bất định quá khứ của ὁράω có chức năng chỉ thời gian trước động từ chính. Nguyên văn không nêu tân ngữ; “vậy” diễn đạt tự nhiên trong tiếng Việt mà không giới hạn điều họ thấy chỉ vào một đối tượng cụ thể.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ nhẹ, nối tiếp diễn biến. Quan hệ tiếp nối đã rõ trong cấu trúc câu tiếng Việt; thêm “và” sau mệnh đề mở đầu sẽ kém tự nhiên.
- source_word: ἐγνώρισαν
  choice: họ thuật lại
  rationale: γνωρίζω ở đây mang nghĩa làm cho biết, kể cho người khác biết. “Thuật lại” tự nhiên trong văn kể chuyện và không hàm ý một lời công bố chính thức.
- source_word: περὶ τοῦ ῥήματος
  choice: lời
  rationale: ῥῆμα có thể chỉ lời nói, điều được nói hoặc sứ điệp. “Lời” giữ gần hình thức của nguyên ngữ và phù hợp với mệnh đề “đã được nói”, đồng thời vẫn để ngỏ sắc thái “sứ điệp” hoặc “điều”.
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: đã được nói với mình
  rationale: Giữ thể bị động của phân từ và thể hiện hành động xảy ra trước lúc các người chăn chiên thuật lại. “Mình” quy chiếu tự nhiên về chủ ngữ số nhiều trong tiếng Việt.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: về hài nhi này
  rationale: παιδίον chỉ một trẻ nhỏ; trong bối cảnh là Chúa Giê-su mới sinh. “Hài nhi” là cách gọi trang trọng, dễ hiểu và thích hợp với văn cảnh giáng sinh.
theological_decisions:
- issue: Sắc thái của ῥῆμα trong mối liên hệ với lời thiên sứ báo tin
  choice: lời
  alternative: sứ điệp; điều đã được nói
  rationale: “Lời” giữ được độ rộng nghĩa của ῥῆμα và mối liên hệ trực tiếp với động từ “được nói”, không thêm sắc thái thần học chuyên biệt. Chú thích nêu các cách hiểu tự nhiên khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “hài nhi” phù hợp văn cảnh Chúa Giê-su mới sinh; cấu trúc câu gọn và tự nhiên. Dấu chú thích [a] được đặt sau câu vì chú thích giải thích từ “lời” trong toàn cụm.
