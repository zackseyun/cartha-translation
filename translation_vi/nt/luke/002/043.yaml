id: LUK.2.43
reference: Luke 2:43
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: vi
  text: Khi những ngày lễ đã kết thúc, trong lúc họ trở về, cậu bé Giê-su ở lại Giê-ru-sa-lem[a], và cha mẹ cậu không hay biết[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ở lại phía sau”.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “cha mẹ cậu”. Cách gọi gia đình thông thường ở đây không phủ nhận việc thụ thai đồng trinh đã được Lu-ca thuật lại trước đó.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: khi những ngày lễ đã kết thúc
  rationale: Cụm sở hữu cách tuyệt đối nêu hoàn cảnh đã hoàn tất trước hành động chính. Danh từ “lễ” được bổ sung theo ngữ cảnh trực tiếp về kỳ lễ, giúp tiếng Việt tự nhiên mà không xác định thêm độ dài hay nghi thức.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: trong lúc họ trở về
  rationale: Kết cấu ἐν với động từ nguyên mẫu có mạo từ diễn tả hành động đang diễn ra đồng thời; “trong lúc” giữ rõ quan hệ thời gian ấy.
- source_word: ὑπέμεινεν
  choice: ở lại
  rationale: Trong ngữ cảnh này, ὑπομένω có nghĩa là tiếp tục ở một nơi khi những người khác rời đi. “Ở lại” tự nhiên trong tiếng Việt; sắc thái “ở lại phía sau” được ghi ở chú thích.
- source_word: ὁ παῖς
  choice: cậu bé
  rationale: παῖς có thể chỉ trẻ em, bé trai hoặc thiếu niên. Vì ngữ cảnh cho biết Giê-su mười hai tuổi, “cậu bé” vừa phù hợp độ tuổi vừa tự nhiên trong lời kể.
- source_word: ἐν Ἰερουσαλήμ
  choice: ở lại Giê-ru-sa-lem
  rationale: Giới từ ἐν mang nghĩa địa điểm; trong tiếng Việt, “ở lại Giê-ru-sa-lem” diễn đạt tự nhiên cùng động từ.
- source_word: οὐκ ἔγνωσαν
  choice: không hay biết
  rationale: Ở đây γινώσκω nói đến việc nhận biết một sự việc. “Không hay biết” diễn đạt tự nhiên rằng cha mẹ cậu không biết cậu đã ở lại.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: cha mẹ cậu
  rationale: γονεῖς có nghĩa trực tiếp là “cha mẹ”. Đại từ “cậu” nối tự nhiên với “cậu bé Giê-su” trong cùng câu.
theological_decisions:
- issue: Lu-ca gọi Ma-ri và Giô-sép là οἱ γονεῖς αὐτοῦ
  choice: cha mẹ cậu
  alternative: cha và mẹ cậu
  rationale: Bản Hy Lạp dùng trực tiếp từ “cha mẹ”. Bản dịch giữ nguyên cách nói gia đình thông thường của Lu-ca, không né tránh cũng không dùng lời chú giải để xóa đi sự căng thẳng với lời khẳng định trước đó của sách về việc thụ thai đồng trinh.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ quan hệ thời gian của nguyên văn, dùng “cậu bé” phù hợp với tuổi mười hai trong ngữ cảnh, và không hòa giải cách gọi “cha mẹ” bằng một cách dịch mang tính giáo lý.
