  to: Những người chăn chiên trở về[a], vừa tôn vinh vừa ca ngợi Đức Chúa Trời vì tất cả những điều họ đã nghe và thấy[b], đúng như đã được nói với họ[c].
  rationale: Bản sửa chỉ thay “phán” bằng “nói” để phản ánh trung tính hơn động từ λαλέω và giữ tác nhân của bị động không xác định; đồng thời chuyển neo chú thích [c] đến đúng mệnh đề được chú thích. Các lựa chọn còn lại giữ nguyên vì sát nguyên văn và tự nhiên trong tiếng Việt hiện đại.
