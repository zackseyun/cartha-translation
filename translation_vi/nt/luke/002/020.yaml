  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: vi
  text: Những người chăn chiên trở về[a], vừa tôn vinh vừa ca ngợi Đức Chúa Trời vì tất cả những điều họ đã nghe và thấy[b], đúng như đã được nói với họ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quay trở lại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bởi tất cả những điều họ đã nghe và thấy.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “đúng như đã được nói với họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: trở về
  rationale: Động từ aorist chỉ việc những người chăn chiên quay lại nơi hoặc công việc trước đó; “trở về” tự nhiên và sát nghĩa trong tiếng Việt.
- source_word: οἱ ποιμένες
  choice: những người chăn chiên
  rationale: Cách gọi rõ ràng, phổ thông cho những người đã được giới thiệu trước đó trong trình thuật.
- source_word: δοξάζοντες καὶ αἰνοῦντες
  choice: vừa tôn vinh vừa ca ngợi
  rationale: Giữ hai phân từ hiện tại riêng biệt nhưng song hành, đồng thời diễn đạt chúng như những hành động đi kèm lúc họ trở về.
- source_word: τὸν θεὸν
  choice: Đức Chúa Trời
  rationale: Tân ngữ chung của cả “tôn vinh” và “ca ngợi”; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: vì tất cả những điều
  rationale: ἐπί với cách dữ ở đây nêu căn cứ hoặc nguyên do của sự tôn vinh và ca ngợi; “vì” diễn đạt tự nhiên mà không thu hẹp sắc thái.
- source_word: ἤκουσαν καὶ εἶδον
  choice: họ đã nghe và thấy
  rationale: “Đã” thể hiện các sự việc xảy ra trước lúc họ trở về mà không làm thay đổi ý nghĩa của hai động từ aorist.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: đúng như những gì đã được phán với họ
  rationale: Giữ καθώς là “đúng như” và giữ thể bị động của ἐλαλήθη, không nêu đích danh người nói mà câu Hy Lạp để ẩn.
theological_decisions:
- issue: Có nên nói rõ thiên sứ là chủ thể đã phán hay không
  choice: 'Giữ thể bị động: “đúng như những gì đã được phán với họ.”'
  alternative: “đúng như thiên sứ đã nói với họ” hoặc “đúng như các thiên sứ đã nói với họ”
  rationale: Ngữ cảnh gợi đến lời thiên sứ, nhưng chính câu này không nêu tác nhân. Giữ thể bị động bảo toàn sự dè dặt của nguyên văn và tránh thêm chi tiết.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “vừa… vừa…” làm rõ hai hành động đồng thời mà không nhập “tôn vinh” và “ca ngợi” thành một. Câu giữ tác nhân của thể bị động ở cuối câu không được xác định, phù hợp nguyên văn Hy Lạp.
