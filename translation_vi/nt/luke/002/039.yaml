id: LUK.2.39
reference: Luke 2:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: vi
  text: Khi đã hoàn tất mọi việc theo luật của Chúa[a], họ trở về Ga-li-lê, đến thị trấn của mình là Na-xa-rét[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “mọi việc luật của Chúa quy định.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp có nghĩa là “thành”; ở đây dịch là “thị trấn” vì Na-xa-rét là một khu dân cư nhỏ.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: khi
  rationale: Trong cấu trúc chỉ thời gian này, ὡς xác định thời điểm hành động chính diễn ra; “khi” tự nhiên và không nhấn mạnh quá mức tính tức thì.
- source_word: ἐτέλεσαν
  choice: đã hoàn tất
  rationale: τελέω ở đây nói đến việc làm xong các nghi thức được quy định; “đã hoàn tất” giữ đúng trình tự kể chuyện và tránh sắc thái thần học có thể nảy sinh từ “ứng nghiệm” hay “làm trọn”.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: mọi việc theo luật của Chúa
  rationale: Cách dịch này bám sát cấu trúc Hy Lạp, chỉ toàn bộ những việc liên quan đến hoặc được luật của Chúa quy định, nhưng không diễn giải quá mức ngay trong chính văn.
- source_word: νόμον κυρίου
  choice: luật của Chúa
  rationale: Giữ nguyên quan hệ sở hữu trong nguyên văn và diễn đạt tự nhiên bằng tiếng Việt hiện đại.
- source_word: κυρίου
  choice: Chúa
  rationale: Trong ngữ cảnh luật thánh, κύριος chỉ Đức Chúa Trời; “Chúa” là cách dịch trực tiếp, không thay thế bằng một danh xưng không hiện diện trong bản Hy Lạp.
- source_word: ἐπέστρεψαν
  choice: họ trở về
  rationale: Trong ngữ cảnh hành trình, ἐπιστρέφω có nghĩa là trở lại một nơi; “trở về” tự nhiên vì đó là địa phương của họ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: về Ga-li-lê
  rationale: εἰς nêu đích đến; với động từ “trở về”, giới từ “về” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: đến thị trấn của mình
  rationale: πόλις có thể chỉ một thành hay thị trấn; vì Na-xa-rét là một khu dân cư nhỏ, “thị trấn” truyền đạt quy mô phù hợp, còn ἑαυτῶν được giữ bằng “của mình”.
- source_word: Ναζαρέθ
  choice: Na-xa-rét
  rationale: Dùng dạng phiên âm tiếng Việt quen thuộc của địa danh này.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong cụm “luật của Chúa”
  choice: “Chúa” chỉ Đức Chúa Trời, Đấng ban luật được ghi trong Kinh Thánh.
  alternative: Không có cách hiểu thay thế đáng kể về thần học trong ngữ cảnh này.
  rationale: Đây là một cách diễn đạt Do Thái–Kinh Thánh quen thuộc. Dịch trực tiếp giữ trọng tâm của câu về việc gia đình hoàn thành những điều luật quy định mà không thêm một khẳng định giáo lý ngoài nguyên văn.
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, rõ ràng với độc giả Việt Nam hiện đại. “Luật của Chúa” tự nhiên hơn lối nói nặng tính thuật ngữ “luật pháp của Chúa”; “thị trấn” giúp người đọc không hình dung Na-xa-rét như một đô thị lớn. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
source_grounding:
  english_pob_role: consult_only
