  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và nội dung của câu Hy Lạp: sau khi hoàn tất mọi điều theo luật của Chúa, họ trở về Ga-li-lê, đến Na-xa-rét là thị trấn của họ. “Khi đã hoàn tất” diễn tả tự nhiên quan hệ thời gian của ὡς với aorist ἐτέλεσαν; “mọi việc theo luật của Chúa” giữ được phạm vi bao quát của πάντα τὰ κατὰ τὸν νόμον κυρίου mà không thêm diễn giải.'
