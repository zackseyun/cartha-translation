  terminology: “Luật của Chúa” là cách diễn đạt tự nhiên cho νόμον κυρίου và nhất quán với việc dịch κύριος là “Chúa” trong ngữ cảnh luật thánh. “Ga-li-lê” và “Na-xa-rét” theo dạng phiên âm Việt ngữ quen dùng. Chú thích a bảo toàn phương án “được luật quy định”; chú thích b giải thích hợp lý lựa chọn “thị trấn” cho πόλις.
