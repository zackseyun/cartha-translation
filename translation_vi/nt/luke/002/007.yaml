  - severity: low
    issue: Trật tự cú pháp của mệnh đề lý do có thể tự nhiên hơn.
    rationale: “Vì họ không có chỗ trong phòng dành cho khách” giữ rõ cấu trúc “không có chỗ cho họ trong...” của διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
