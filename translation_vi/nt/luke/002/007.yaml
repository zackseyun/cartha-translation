id: LUK.2.7
reference: Luke 2:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: vi
  text: Bà sinh con trai đầu lòng của mình, quấn con bằng vải[a] rồi đặt con nằm trong máng ăn của súc vật[b], vì họ không có chỗ trong phòng dành cho khách[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quấn con bằng khăn tã.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo truyền thống: “máng cỏ.” Từ Hy Lạp chỉ nơi hoặc máng đựng thức ăn cho súc vật.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nơi trọ”; theo truyền thống: “quán trọ.” Từ Hy Lạp κατάλυμα có thể chỉ phòng dành cho khách hoặc nơi lưu trú. Ở Lu-ca 10:34, Lu-ca dùng một từ khác để chỉ quán trọ thương mại.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: sinh
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt hiện đại đối với việc sinh con, giữ nguyên nghĩa cụ thể của động từ trong ngữ cảnh.
- source_word: τὸν υἱὸν αὐτῆς τὸν πρωτότοκον
  choice: con trai đầu lòng
  rationale: Diễn đạt tự nhiên cả giới tính lẫn thứ tự sinh; không đưa thêm hàm ý thần học vượt quá lời kể.
- source_word: ἐσπαργάνωσεν
  choice: lấy vải quấn con
  rationale: Động từ chỉ việc quấn trẻ sơ sinh bằng vải. Cách dịch này rõ ràng, tự nhiên và không thêm một danh từ cụ thể vốn không xuất hiện trong câu Hy Lạp.
- source_word: ἀνέκλινεν
  choice: đặt con nằm
  rationale: Phù hợp với hành động đặt một trẻ sơ sinh xuống; tự nhiên hơn cách dịch sát hình thức như “cho ngả nằm”.
- source_word: φάτνῃ
  choice: máng ăn của súc vật
  rationale: Nêu rõ đây là chỗ hoặc máng đựng thức ăn cho động vật, dễ hiểu hơn từ truyền thống “máng cỏ” mà không giả định máng chứa loại thức ăn cụ thể nào.
- source_word: τόπος
  choice: chỗ
  rationale: Trong cấu trúc phủ định này, “không có chỗ cho họ” là cách nói tiếng Việt tự nhiên và giữ nghĩa rộng của τόπος.
- source_word: καταλύματι
  choice: phòng dành cho khách
  rationale: κατάλυμα có thể chỉ nơi trọ hoặc phòng khách; cách dịch này phù hợp với cách Lu-ca dùng chính từ ấy ở Lu-ca 22:11 và không mặc nhiên biến địa điểm thành một quán trọ thương mại.
theological_decisions:
- issue: Nên hiểu κατάλυμα là quán trọ thương mại hay không gian dành cho khách
  choice: phòng dành cho khách
  alternative: quán trọ; nơi trọ
  rationale: Từ Hy Lạp không buộc phải hiểu là quán trọ thương mại. Lu-ca dùng πανδοχεῖον cho quán trọ ở Lu-ca 10:34 và dùng κατάλυμα cho phòng dành cho khách ở Lu-ca 22:11. Bản dịch chính tránh đưa khung cảnh truyền thống vào khi văn bản không đòi hỏi, đồng thời giữ các khả năng khác trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “bà” nối tự nhiên với ngữ cảnh nói về Ma-ri mà không lặp tên; “con” được dùng cho hài nhi theo lối kể tiếng Việt. Trật tự các hành động và quan hệ nguyên nhân của câu Hy Lạp được giữ nguyên.
