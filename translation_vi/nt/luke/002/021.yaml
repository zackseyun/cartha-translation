source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: vi
  text: Khi đủ tám ngày để cắt bì cho con trẻ[a], con trẻ được đặt tên là Giê-su[b], là tên mà thiên sứ đã gọi trước khi con trẻ được thụ thai trong lòng mẹ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Khi tám ngày đã trọn.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “tên của con trẻ được gọi là Giê-su.”'
    reason: lexical_alternative
  - marker: c
    text: Tức là trước khi được thụ thai trong lòng Ma-ri.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: khi đủ tám ngày
  rationale: Diễn đạt tự nhiên ý hoàn tất của lối nói Hy Lạp, đồng thời giữ mốc tám ngày làm trọng tâm.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: để làm phép cắt bì cho con trẻ
  rationale: Giữ ý mục đích của cấu trúc động từ nguyên mẫu có mạo từ; “con trẻ” giúp tiếng Việt rõ chủ thể mà không thêm tên riêng vào câu Hy Lạp.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: người ta đặt tên con trẻ là Giê-su
  rationale: Dùng thể chủ động vô nhân xưng tự nhiên trong tiếng Việt để chuyển tải thể bị động Hy Lạp, đồng thời giữ rõ hành động đặt tên.
- source_word: Ἰησοῦς
  choice: Giê-su
  rationale: Dùng dạng phiên âm tên riêng đã quen thuộc trong tiếng Việt.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: là tên thiên sứ đã gọi
  rationale: Giữ sự lặp lại của động từ καλέω và sắc thái bị động trong nguồn; “thiên sứ” phù hợp văn phong Kinh Thánh phổ thông.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν
  choice: trước khi con trẻ được thụ thai
  rationale: Phản ánh chính xác động từ thụ thai ở thể bị động, không đưa thêm thuật ngữ thần học ngoài văn bản.
- source_word: ἐν τῇ κοιλίᾳ
  choice: trong lòng mẹ
  rationale: Là cách nói tiếng Việt tự nhiên cho việc thụ thai trong tử cung; từ “mẹ” được ngữ cảnh xác định dù nguyên văn chỉ nói “trong lòng/dạ”.
theological_decisions:
- issue: Mệnh đề nói về sự thụ thai của Chúa Giê-su
  choice: trước khi con trẻ được thụ thai trong lòng mẹ
  alternative: trước khi được thụ thai trong dạ
  rationale: Nêu sự kiện thụ thai theo đúng câu Hy Lạp mà không mở rộng thành một khẳng định tín lý vượt quá nội dung câu.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “con trẻ” để tránh đại từ có thể mơ hồ; “làm phép cắt bì” là cách diễn đạt quen thuộc và rõ nghĩa. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn.
