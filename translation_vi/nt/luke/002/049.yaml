  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: vi
  text: 'Người nói với họ: “Tại sao cha mẹ tìm con? Cha mẹ không biết rằng con phải ở trong nhà của Cha con sao?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “con phải lo công việc của Cha con” hoặc “con phải ở trong những điều thuộc về Cha con.” Cụm từ Hy Lạp này được tỉnh lược và có thể chỉ nhà của Cha hoặc những công việc, những điều thuộc về Cha.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Tại sao
  rationale: Thành ngữ này hỏi về lý do; “Tại sao” tự nhiên trong tiếng Việt và giữ nguyên lực của câu hỏi.
- source_word: ἐζητεῖτέ
  choice: lại tìm con
  rationale: ζητέω trong ngữ cảnh cha mẹ đang đi tìm Đức Chúa Jêsus có nghĩa tự nhiên là “tìm”; “lại” giúp diễn đạt sắc thái câu hỏi mà không thêm một nguyên nhân cụ thể.
- source_word: πρὸς αὐτούς
  choice: với họ / cha mẹ
  rationale: Lời dẫn giữ đại từ số nhiều “họ”; trong lời thoại, tiếng Việt cần cách xưng hô theo quan hệ, nên dùng “cha mẹ” để chỉ Ma-ri và Giô-sép.
- source_word: οὐκ ᾔδειτε
  choice: Cha mẹ không biết ... sao?
  rationale: Giữ nghĩa trực tiếp của οἶδα là “biết” và hình thức câu hỏi tu từ có phủ định.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: ở trong nhà của Cha con
  rationale: Cụm Hy Lạp được tỉnh lược, sát nghĩa là “trong những [điều/nơi] thuộc về Cha con.” Bối cảnh đền thờ hỗ trợ nghĩa “nhà của Cha con”; nghĩa rộng hơn được giữ trong chú thích.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt sự cần thiết mạnh mẽ, có thể hàm ý sự cần thiết theo ý định của Đức Chúa Trời, mà không giải thích thêm vào bản văn.
- source_word: εἶναί με
  choice: con phải ở
  rationale: Cách diễn đạt tự nhiên của cấu trúc động từ nguyên mẫu với chủ thể đối cách sau δεῖ.
- source_word: πατρός μου
  choice: Cha con
  rationale: “Cha” viết hoa cho thấy lời này chỉ về Đức Chúa Trời; đại từ “con” phù hợp với lời một người con nói với cha mẹ mình.
theological_decisions:
- issue: Cụm tỉnh lược ἐν τοῖς τοῦ πατρός μου
  choice: Bản văn chính dùng “ở trong nhà của Cha con”
  alternative: “lo công việc của Cha con” hoặc “ở trong những gì thuộc về Cha con”
  rationale: Bối cảnh Đức Chúa Jêsus được tìm thấy trong đền thờ khiến nghĩa địa điểm rất phù hợp, nhưng ngữ pháp Hy Lạp vẫn cho phép nghĩa liên quan đến công việc hay những điều thuộc về Cha; chú thích bảo tồn sự mơ hồ thực sự này.
- issue: Đối tượng được gọi là “Cha con”
  choice: Hiểu là Đức Chúa Trời và viết hoa “Cha”
  alternative: Dịch chữ thường “cha con”
  rationale: Trong bối cảnh đền thờ và sự đối lập ngầm với cha mẹ đang nói chuyện cùng Ngài, lời này chỉ Đức Chúa Trời là Cha của Đức Chúa Jêsus; bản dịch không thêm lời giải thích thần học vào câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời kể; trong lời thoại dùng “cha mẹ—con” để diễn đạt tự nhiên quan hệ gia đình. Dấu chú thích [a] đặt ngay sau câu có cụm từ mơ hồ.
