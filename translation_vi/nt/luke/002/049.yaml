  source_fidelity: Bản dịch phản ánh đúng câu hỏi tu từ, động từ “tìm,” sự cần thiết của δεῖ (“phải”), và cách hiểu theo bối cảnh đền thờ là “nhà của Cha”. Chú thích cũng bảo tồn đúng tính tỉnh lược, đa nghĩa của ἐν τοῖς τοῦ πατρός μου. Tuy nhiên, từ “lại” không có đối ứng rõ trong ἐζητεῖτε và có thể gợi ý hành động lặp lại hoặc sự đối nghịch không được nói rõ.
