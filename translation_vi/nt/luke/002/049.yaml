  terminology: Viết hoa “Cha” phù hợp với quy chiếu đến Đức Chúa Trời trong ngữ cảnh này. “Nhà của Cha con” là lựa chọn chính đáng trong văn mạch, miễn là chú thích tiếp tục nêu rõ cách hiểu thay thế.
