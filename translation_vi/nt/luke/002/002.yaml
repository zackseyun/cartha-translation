  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: vi
  text: Việc đăng ký[b] này diễn ra lần đầu[a] khi Quirinius cai quản Syria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Việc đăng ký này diễn ra trước khi Quirinius cai quản Syria.” Một số người hiểu πρώτη ở đây theo nghĩa so sánh về thời gian.'
    reason: alternative_reading
  - marker: b
    text: Cũng có thể dịch “cuộc điều tra dân số”. Từ Hy Lạp chỉ việc ghi danh chính thức, thường có liên quan đến thuế.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: này
  rationale: Đại từ chỉ định quy chiếu về việc đăng ký vừa được nhắc đến ở câu trước; đặt sau danh từ là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἀπογραφὴ
  choice: việc đăng ký
  rationale: Từ này chỉ sự ghi danh chính thức vì mục đích hành chính, thường liên quan đến thuế hoặc thống kê dân số. “Việc đăng ký” giữ được nghĩa rộng mà không thu hẹp thành một cuộc điều tra dân số thuần túy.
- source_word: πρώτη
  choice: lần đầu
  rationale: Giữ nghĩa thứ tự thông thường của πρώτη và kết hợp tự nhiên với động từ “diễn ra”. Cách hiểu theo nghĩa “trước khi” được bảo lưu trong chú thích vì cấu trúc này còn gây tranh luận.
- source_word: ἐγένετο
  choice: diễn ra
  rationale: Diễn đạt tự nhiên việc một sự kiện xảy ra, phù hợp với ngữ cảnh hành chính.
- source_word: ἡγεμονεύοντος
  choice: khi ... cai quản
  rationale: Thể hiện hoàn cảnh đồng thời của kết cấu sở hữu cách tuyệt đối mà không áp đặt một chức danh cụ thể hơn điều động từ Hy Lạp cho biết.
- source_word: τῆς Συρίας
  choice: Syria
  rationale: Tên gọi địa lý hiện đại, dễ nhận biết, dành cho tỉnh Syria dưới quyền La Mã.
- source_word: Κυρηνίου
  choice: Quirinius
  rationale: Dùng dạng tên quốc tế quen thuộc của nhân vật lịch sử này, tương ứng với Κυρήνιος.
theological_decisions:
- issue: Cách hiểu πρώτη trong một mệnh đề có tranh luận về cú pháp và lịch sử
  choice: Dịch πρώτη theo nghĩa thứ tự là “lần đầu” trong chính văn.
  alternative: “Việc đăng ký này diễn ra trước khi Quirinius cai quản Syria.”
  rationale: Nghĩa thứ tự là nghĩa trực tiếp nhất của πρώτη. Tuy nhiên, vì có người hiểu từ này theo nghĩa so sánh về thời gian, bản dịch giữ cách hiểu ấy trong chú thích thay vì âm thầm giải quyết điểm còn tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Diễn ra lần đầu” giữ thứ tự từ tự nhiên trong tiếng Việt; “cai quản” tránh xác định Quirinius bằng một chức danh hẹp hơn động từ Hy Lạp.
