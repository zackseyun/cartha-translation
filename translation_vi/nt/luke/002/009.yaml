id: LUK.2.9
reference: Luke 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: vi
  text: Và một thiên sứ của Chúa đến đứng bên họ[a]; vinh quang của Chúa chiếu sáng bao quanh họ, và họ vô cùng kinh sợ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đến với họ”, “đứng cạnh họ” hoặc “hiện ra với họ”. Động từ Hy Lạp có thể diễn tả sự xuất hiện đột ngột cũng như việc đứng gần.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “họ sợ một nỗi sợ lớn”, một lối nói nhấn mạnh rằng họ vô cùng kinh hãi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: một thiên sứ của Chúa
  rationale: Trong bối cảnh này, ἄγγελος chỉ một thiên sứ; cấu trúc không có mạo từ được diễn đạt tự nhiên bằng “một thiên sứ”, còn κύριος được giữ là “Chúa”.
- source_word: ἐπέστη αὐτοῖς
  choice: đến đứng bên họ
  rationale: ἐφίστημι có thể diễn tả việc đến gần, bất ngờ hiện diện hoặc đứng bên. “Đến đứng bên họ” giữ được nét cụ thể mà không thu hẹp thành chỉ “hiện ra”.
- source_word: δόξα κυρίου
  choice: vinh quang của Chúa
  rationale: Cách dịch trực tiếp, giữ được nội hàm về sự uy nghi và ánh sáng thuộc về Đức Chúa Trời.
- source_word: περιέλαμψεν αὐτούς
  choice: chiếu sáng bao quanh họ
  rationale: περιλάμπω diễn tả ánh sáng chiếu quanh hoặc phủ lấy một người; cách dịch này vừa sát nghĩa vừa tự nhiên trong tiếng Việt.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: họ vô cùng kinh sợ
  rationale: Cấu trúc động từ đi với danh từ đồng gốc có tác dụng nhấn mạnh cường độ. “Vô cùng kinh sợ” chuyển tải nỗi sợ hãi mãnh liệt bằng tiếng Việt tự nhiên.
theological_decisions:
- issue: Cách dịch κύριος trong hai cụm sở hữu
  choice: Chúa
  alternative: Chủ
  rationale: Trong câu này, κύριος quy chiếu về Đức Chúa Trời. “Chúa” là cách gọi trang trọng, quen thuộc và giữ được sức nặng thần học của từ này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ “Và” ở đầu câu để phản ánh mạch kể liên tục; dùng “thiên sứ” thay vì từ rộng nghĩa hơn là “sứ giả”. Dấu chấm phẩy giúp các vế dài sáng rõ trong tiếng Việt.
