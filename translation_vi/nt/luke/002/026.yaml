  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: vi
  text: Và ông đã được Đức Thánh Linh mặc khải rằng ông sẽ không thấy sự chết trước khi ông thấy Đấng Mê-si của Chúa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay theo cách dịch truyền thống: “Đấng Christ của Chúa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: đã mặc khải cho ông
  rationale: Dạng bị động chỉ việc nhận được sự truyền đạt từ Đức Chúa Trời; cách diễn đạt này tự nhiên trong tiếng Việt và nguồn tác động được nêu rõ là Đức Thánh Linh.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: Đức Thánh Linh
  rationale: ὑπό với sở hữu cách biểu thị tác nhân. Đưa tác nhân lên đầu câu giúp câu tiếng Việt tự nhiên mà vẫn giữ rõ Đức Thánh Linh là Đấng mặc khải.
- source_word: μὴ ἰδεῖν θάνατον
  choice: sẽ không thấy sự chết
  rationale: Giữ hình ảnh nguyên ngữ 'thấy sự chết' thay vì diễn giải thành 'sẽ không chết'; thành ngữ này vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: trước khi được thấy
  rationale: Diễn đạt trình tự tương lai rõ ràng; 'được thấy' tự nhiên trong tiếng Việt và phù hợp với lời hứa ông sẽ sống cho đến khi tận mắt gặp Đấng ấy.
- source_word: τὸν χριστὸν κυρίου
  choice: Đấng Mê-si của Chúa
  rationale: Χριστός ở đây là tước hiệu nên dùng 'Đấng Mê-si'; 'của Chúa' giữ quan hệ sở hữu/nguồn sai phái của κυρίου mà không giải thích quá mức.
- source_word: κυρίου
  choice: Chúa
  rationale: Giữ tước hiệu κύριος bằng từ tiếng Việt phổ thông, trang trọng; cấu trúc 'của Chúa' phản ánh trực tiếp sở hữu cách.
theological_decisions:
- issue: Cách dịch Χριστός khi được dùng như tước hiệu cứu thế
  choice: Đấng Mê-si
  alternative: Đấng Christ của Chúa
  rationale: Trong τὸν χριστὸν κυρίου, Χριστός hoạt động như một tước hiệu, không phải thành phần tên riêng. 'Đấng Mê-si' làm rõ bối cảnh Do Thái và giữ nghĩa 'Đấng được xức dầu'; cách dịch truyền thống được bảo lưu trong chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu được chuyển sang cấu trúc chủ động tự nhiên trong tiếng Việt, vẫn giữ Đức Thánh Linh là tác nhân và giữ nguyên hình ảnh “thấy sự chết” của bản Hy Lạp.
