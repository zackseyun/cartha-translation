id: LUK.2.10
reference: Luke 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: vi
  text: 'Thiên sứ nói với họ: “Đừng sợ, vì kìa, tôi báo cho anh em tin mừng về một niềm vui lớn, niềm vui ấy sẽ dành cho toàn dân[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi người”. Tiếng Hy Lạp nói sát là “cho toàn thể dân”; trong Lu-ca, từ này thường chỉ một dân cụ thể theo ngữ cảnh.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: Thiên sứ
  rationale: Mạo từ xác định chỉ lại thiên sứ đã xuất hiện trong ngữ cảnh; tiếng Việt không cần thêm từ tương đương với mạo từ.
- source_word: Μὴ φοβεῖσθε
  choice: Đừng sợ
  rationale: Cách nói tự nhiên, trực tiếp trong tiếng Việt hiện đại, giữ nguyên sắc thái mệnh lệnh phủ định.
- source_word: ἰδοὺ γὰρ
  choice: Vì này
  rationale: “Vì” thể hiện quan hệ giải thích của γάρ; “này” giữ chức năng thu hút sự chú ý và sắc thái trang trọng của ἰδού.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: tôi báo cho anh em một tin mừng
  rationale: Diễn đạt đúng hành động loan báo tin tốt và giữ đối tượng số nhiều ὑμῖν; “anh em” phù hợp lời nói trực tiếp với nhóm người chăn chiên mà không dùng đại từ quá suồng sã.
- source_word: χαρὰν μεγάλην
  choice: niềm vui lớn
  rationale: Giữ trực tiếp cường độ của μεγάλην và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἥτις ἔσται
  choice: là niềm vui sẽ dành cho
  rationale: Lặp lại “niềm vui” để quan hệ đại từ được sáng rõ trong tiếng Việt, đồng thời giữ ý tương lai của ἔσται.
- source_word: παντὶ τῷ λαῷ
  choice: toàn dân
  rationale: “Toàn dân” giữ sắc thái một cộng đồng xác định do mạo từ τῷ, tự nhiên hơn “tất cả dân” và không vội mở rộng thành toàn thể nhân loại.
theological_decisions:
- issue: Phạm vi của παντὶ τῷ λαῷ
  choice: toàn dân
  alternative: mọi người
  rationale: Cụm Hy Lạp có mạo từ xác định và trong bối cảnh trực tiếp nhiều khả năng nói đến toàn thể dân Israel. Bản dịch giữ tính xác định này, nhưng chú thích nêu cách hiểu rộng hơn để không che khuất sự mơ hồ và hướng triển khai rộng lớn hơn trong Lu-ca.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “Vì này” để bảo tồn lực nhấn của ἰδού γάρ; dùng “tin mừng” theo nghĩa thông thường của lời báo tin tốt, không áp đặt thuật ngữ giáo phái. Dấu chú thích [a] xuất hiện ngay sau cụm từ liên quan.
