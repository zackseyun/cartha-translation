    rationale: Cụm này cố giữ từng yếu tố của ἰδοὺ γάρ nhưng không phải kết hợp thông dụng. “Vì kìa” vẫn giữ lời giải thích và lời gọi chú ý.
  revised_text: 'Thiên sứ nói với họ: “Đừng sợ, vì kìa, tôi báo cho anh em tin mừng về một niềm vui lớn, niềm vui ấy sẽ dành cho toàn dân[a].”'
