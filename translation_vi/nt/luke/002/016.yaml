  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: vi
  text: Họ vội vã đến và tìm thấy Ma-ri, Giô-sép và em bé đang nằm trong máng cỏ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “máng ăn của súc vật.” Từ Hy Lạp φάτνη chỉ một cái máng dùng để đựng thức ăn cho súc vật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: đến đó
  rationale: Động từ ἔρχομαι chỉ sự di chuyển đến địa điểm thiên sứ vừa nói đến; “đến đó” tự nhiên trong mạch kể tiếng Việt và làm rõ đích đến vốn đã có trong ngữ cảnh.
- source_word: σπεύσαντες
  choice: vội vã
  rationale: Phân từ diễn tả cách họ đi đến, nhấn mạnh sự khẩn trương; “vội vã” vừa tự nhiên vừa giữ được sắc thái ấy.
- source_word: ἀνεῦραν
  choice: tìm thấy
  rationale: ἀνευρίσκω có thể hàm ý tìm kiếm rồi gặp được; “tìm thấy” bảo toàn sắc thái này rõ hơn chỉ “thấy” hay “gặp”.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Ma-ri, Giô-sép
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; liên từ τε và các καί được thể hiện tự nhiên qua phép liệt kê và từ “cùng”.
- source_word: τὸ βρέφος
  choice: em bé
  rationale: βρέφος chỉ một đứa trẻ còn rất nhỏ, trong ngữ cảnh là trẻ sơ sinh; “em bé” hiện đại, rõ nghĩa và tự nhiên với độc giả phổ thông.
- source_word: κείμενον
  choice: đang nằm
  rationale: κεῖμαι mô tả trạng thái và vị trí của em bé, không nói đến hành động ai đó đặt em nằm; “đang nằm” giữ đúng sắc thái trạng thái.
- source_word: ἐν τῇ φάτνῃ
  choice: trong máng cỏ
  rationale: φάτνη chỉ máng cho gia súc ăn; “máng cỏ” là cách diễn đạt ngắn gọn, quen thuộc trong tiếng Việt, còn nghĩa cụ thể hơn được nêu ở chú thích.
- source_word: καὶ ... καὶ ... καὶ
  choice: và ... , ... cùng
  rationale: Chuỗi liên kết đơn giản của tiếng Hy Lạp được chuyển thành phép liệt kê tự nhiên trong tiếng Việt, tránh lặp “và” nặng nề mà vẫn giữ đủ các thành phần.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ nhịp kể khẩn trương của nguyên văn; tên riêng dùng dạng phiên âm quen thuộc trong tiếng Việt. Dấu chú thích được đặt ngay sau “máng cỏ”, là từ mà chú thích giải nghĩa.
