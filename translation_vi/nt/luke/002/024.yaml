source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: vi
  text: 'và để dâng tế lễ theo điều đã được nói[a] trong Luật của Chúa: một cặp chim cu hoặc hai chim bồ câu non.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “theo điều được nói trong Luật của Chúa.”'
    reason: Biến thể diễn đạt về giá trị thời/thể của phân từ hoàn thành εἰρημένον; cả hai cách giữ ý về điều đã được nói trong Luật.
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: để dâng một của lễ
  rationale: Động từ nguyên mẫu có mạo từ diễn tả mục đích trong mạch văn. Dù δίδωμι có nghĩa đen là “cho”, kết hợp với θυσίαν thì “dâng một của lễ” là cách nói tự nhiên và giữ rõ ý nghĩa hiến tế.
- source_word: κατὰ τὸ εἰρημένον
  choice: theo điều đã được phán
  rationale: Phân từ hoàn thành bị động giữ ý về lời đã được nói và vẫn còn hiệu lực. “Được phán” phù hợp với văn cảnh lời trong Kinh Luật mà không diễn giải thêm thành “được quy định”.
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: trong Luật Pháp của Chúa
  rationale: νόμος ở đây chỉ Kinh Luật của Đức Chúa Trời; “Luật Pháp” là cách gọi trang trọng, quen thuộc trong tiếng Việt. κύριος được dịch là “Chúa”, theo nghĩa chỉ Đức Chúa Trời trong công thức này.
- source_word: ζεῦγος τρυγόνων
  choice: một đôi chim gáy
  rationale: ζεῦγος chỉ một cặp, còn τρυγών chỉ cụ thể loài chim gáy; cách dịch này vừa chính xác vừa tự nhiên.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: hai chim bồ câu non
  rationale: νοσσός chỉ chim non và περιστερά là bồ câu; cụm này tương ứng rõ với thuật ngữ tế lễ trong Lê-vi.
theological_decisions:
- issue: Cách dịch κύριος trong công thức nói về Kinh Luật
  choice: Chúa
  alternative: ĐỨC GIÊ-HÔ-VA; Chúa Tể
  rationale: Bản Hy Lạp dùng κύριος và văn cảnh nói đến luật của Đức Chúa Trời. “Chúa” giữ sát hình thức Tân Ước, không tự ý phục nguyên danh riêng của Đức Chúa Trời.
- issue: Sắc thái của κατὰ τὸ εἰρημένον
  choice: theo điều đã được phán
  alternative: theo điều có chép; theo điều được quy định
  rationale: Cách chọn giữ ý lời đã được nói với hiệu lực hiện tại, đồng thời tránh thu hẹp động từ λέγω thành ý pháp lý “quy định”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “của lễ” để diễn đạt θυσία tự nhiên trong ngữ cảnh thờ phượng; giữ tên chim cụ thể và cấu trúc trích dẫn của điều luật.
