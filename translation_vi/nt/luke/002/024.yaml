    rationale: τρυγών chỉ turtledove, thuộc nhóm chim cu; “chim gáy” trong cách dùng Việt ngữ thông thường thường gợi một loài chim cu khác. “Chim cu” tránh xác định sai loài trong khi vẫn tự nhiên.
  - severity: low
    issue: “một của lễ” yếu hơn sắc thái hiến tế của θυσίαν.
    rationale: “Tế lễ” là cách diễn đạt Việt ngữ gọn, tự nhiên và trực tiếp hơn cho một lễ vật hiến tế.
  - severity: low
    issue: Ký hiệu chú thích đặt ở cuối cả câu thay vì ngay tại cụm κατὰ τὸ εἰρημένον.
    rationale: Đặt [a] sau “đã được nói” làm rõ phạm vi của chú thích về giá trị thời/thể của εἰρημένον.
