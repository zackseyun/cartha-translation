- from: 'và để dâng một của lễ theo điều đã được phán trong Luật Pháp của Chúa: “một đôi chim gáy hoặc hai chim bồ câu non.”[a]'
  to: 'và để dâng tế lễ theo điều đã được nói[a] trong Luật của Chúa: một cặp chim cu hoặc hai chim bồ câu non.'
  rationale: Sửa tên chim để phản ánh chính xác hơn τρυγών mà không áp đặt một định danh loài quá hẹp trong tiếng Việt. Đổi “của lễ” thành “tế lễ” để chuyển đạt θυσίαν rõ hơn. Giữ cấu trúc mục đích của τοῦ δοῦναι, ý verbal của εἰρημένον, và công thức “Luật của Chúa”; không thêm diễn giải thần học.
