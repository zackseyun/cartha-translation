base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: vi
  text: Cha và mẹ của hài nhi đều kinh ngạc về những điều người ta đang nói về hài nhi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp chép: “cha của hài nhi.” Trong trình thuật, cách gọi này chỉ Giô-sép theo quan hệ gia đình và pháp lý thông thường; một số bản dịch dùng “Giô-sép và mẹ của hài nhi” để tránh hiểu lầm, xét theo trình thuật trước đó của Lu-ca về sự thụ thai đồng trinh của Chúa Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: cha của hài nhi
  rationale: Dịch trực tiếp cụm Hy Lạp “cha của người”; trong văn cảnh, từ này chỉ Giô-sép theo quan hệ gia đình và pháp lý thông thường. Dùng “hài nhi” thay đại từ để câu tiếng Việt rõ nghĩa và tự nhiên.
- source_word: μήτηρ
  choice: mẹ của hài nhi
  rationale: Cách dịch thông thường của μήτηρ; trong câu này kết hợp với “cha” thành một cặp. Tiếng Việt lược bớt lần lặp thứ hai trong cấu trúc “cha và mẹ của hài nhi” mà không đổi nghĩa.
- source_word: θαυμάζοντες
  choice: đều kinh ngạc
  rationale: Thể hiện sự ngạc nhiên, thán phục của θαυμάζω. Cấu trúc ἦν với phân từ diễn tả trạng thái đang tiếp diễn trong quá khứ; tiếng Việt tự nhiên thường không cần đánh dấu riêng thì quá khứ khi văn cảnh đã rõ.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: về những điều người ta đang nói
  rationale: Giữ sắc thái số nhiều của phân từ và ý nghĩa lời nói đang được nói ra. Cách chủ động phiếm chỉ “người ta đang nói” tự nhiên trong tiếng Việt mà vẫn truyền đạt nội dung bị động.
- source_word: περὶ αὐτοῦ
  choice: về hài nhi
  rationale: Diễn đạt tự nhiên nghĩa “về người ấy”; lặp lại “hài nhi” giúp tránh đại từ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Gọi Giô-sép là “cha” trong văn cảnh đã khẳng định sự thụ thai đồng trinh của Chúa Giê-su
  choice: Giữ nguyên cách gọi “cha của hài nhi” trong bản văn chính và giải thích sắc thái gia đình/pháp lý ở chú thích.
  alternative: “Giô-sép và mẹ của hài nhi”
  rationale: Bản Hy Lạp SBLGNT đọc rõ là “cha của người.” Lu-ca có thể dùng cách gọi gia đình thông thường đối với Giô-sép mà không phủ nhận trình thuật thụ thai đồng trinh trước đó. Thay bằng tên Giô-sép sẽ âm thầm giải quyết một sự căng thẳng mà nguyên văn vẫn giữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hài nhi” phù hợp với ngữ cảnh Chúa Giê-su còn thơ ấu; câu giữ nguyên sự căng thẳng thần học của cụm “cha của hài nhi” thay vì hòa giải ngay trong chính văn.
