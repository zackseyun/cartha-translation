  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: vi
  text: Mọi người nghe Người đều kinh ngạc[a] trước sự hiểu biết và những lời đáp của Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sửng sốt”. Động từ Hy Lạp diễn tả sự kinh ngạc mạnh mẽ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: đều kinh ngạc
  rationale: Động từ ở thì chưa hoàn thành diễn tả phản ứng kinh ngạc đang diễn ra; “kinh ngạc” tự nhiên, rõ nghĩa và giữ được cường độ mạnh của từ Hy Lạp.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ. Trong mạch kể tiếng Việt, sự nối tiếp đã rõ nên không cần thêm “và” hay “nhưng”, tránh câu văn gượng.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: Tất cả những người nghe cậu
  rationale: Giữ phạm vi bao quát của πάντες và ý nghĩa của phân từ hiện tại; “cậu” phù hợp với việc Chúa Giê-su lúc ấy mười hai tuổi mà không làm câu quá trang trọng.
- source_word: ἐπὶ τῇ συνέσει
  choice: trước sự hiểu biết
  rationale: ἐπί với cách dữ chỉ cơ sở hoặc nguyên do của sự kinh ngạc; “trước” là cách kết hợp tự nhiên trong tiếng Việt với “kinh ngạc”.
- source_word: ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: những lời đáp của cậu
  rationale: ἀπόκρισις chỉ câu trả lời hoặc lời đáp trong cuộc đối thoại; “những lời đáp” trang nhã, tự nhiên và giữ dạng số nhiều.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cậu” cho đại từ chỉ Chúa Giê-su mười hai tuổi trong câu này; không thêm danh xưng vốn không có trong nguyên văn. Dấu chú thích [a] được đặt sau toàn câu vì chú thích giải thích mức độ của động từ “kinh ngạc”.
