  source_fidelity: 'Bản dịch giữ đúng các thành tố chính: phạm vi “tất cả”, người đang nghe, sự kinh ngạc, sự hiểu biết và các lời đáp. “Trước” diễn đạt được quan hệ nguyên do của ἐπί với dữ cách. Tuy nhiên, “cậu” không phải là lựa chọn ổn định, phù hợp cho nhân vật Giê-su trong bản dịch Kinh Thánh tiếng Việt tiêu chuẩn; nó tạo sắc thái thân mật/thiếu niên đương đại không được nguyên văn đánh dấu.'
