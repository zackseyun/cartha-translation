  terminology: “Sự hiểu biết” và “những lời đáp” là các tương đương tự nhiên cho συνέσει và ταῖς ἀποκρίσεσιν. “Người” bảo đảm cách quy chiếu nhất quán và tôn trọng mà không thêm một danh xưng hay khẳng định thần học ngoài nguyên văn.
  issues:
