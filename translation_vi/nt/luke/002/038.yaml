    rationale: αὐτῇ τῇ ὥρᾳ nhấn mạnh “ngay/đúng lúc ấy”; “Đúng vào lúc ấy” diễn đạt tự nhiên hơn. Liên từ καὶ không cần được tái hiện máy móc khi tiếng Việt đã liên kết mạch văn bằng ngữ cảnh.
  - severity: low
    issue: Trật tự “nói về Ngài với tất cả những người...” chưa phải trật tự tự nhiên nhất.
    rationale: Đảo thành “nói với mọi người ... về Ngài” giúp xác định rõ người nghe và nội dung lời nói, không thay đổi nghĩa hay giải quyết đại từ αὐτοῦ.
