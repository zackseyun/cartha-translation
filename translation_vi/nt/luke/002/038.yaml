- from: Cũng vào chính giờ ấy, bà đến gần, dâng lời cảm tạ Đức Chúa Trời[a] và nói về Ngài[b] với tất cả những người đang trông đợi sự cứu chuộc của Giê-ru-sa-lem[c].
  to: Đúng vào lúc ấy, bà đến gần, dâng lời cảm tạ Đức Chúa Trời[a] và nói với mọi người đang trông đợi sự cứu chuộc của Giê-ru-sa-lem[c] về Ngài[b].
  rationale: Chỉnh sửa chỉ nhằm làm câu văn tiếng Việt tự nhiên và rõ cấu trúc hơn. Bản sửa vẫn giữ sự nhấn mạnh thời điểm của nguyên văn, sắc thái đến gần của ἐπιστᾶσα, cách hiểu “cảm tạ” của ἀνθωμολογεῖτο, đại từ chưa được xác định dứt khoát αὐτοῦ, và bề rộng ý nghĩa của “sự cứu chuộc của Giê-ru-sa-lem.” Các mốc chú thích được giữ đủ và đặt ngay sau các yếu tố liên quan.
