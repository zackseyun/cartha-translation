reference: Luke 2:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: vi
  text: Đúng vào lúc ấy, bà đến gần, dâng lời cảm tạ Đức Chúa Trời[a] và nói với mọi người đang trông đợi sự cứu chuộc của Giê-ru-sa-lem[c] về Ngài[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “ca ngợi Đức Chúa Trời.”
    reason: lexical_alternative
  - marker: b
    text: Theo văn mạch, “Ngài” tự nhiên nhất chỉ về hài nhi Giê-xu; tuy nhiên, trong tiếng Hy Lạp, “Đức Chúa Trời” là đối tượng được nhắc đến rõ ràng gần nhất.
    reason: alternative_reading
  - marker: c
    text: Cũng có thể dịch là “sự giải cứu Giê-ru-sa-lem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: cũng vào chính giờ ấy
  rationale: Cụm chỉ thời gian ở cách dữ liệu cho biết thời điểm; “cũng” và “chính” thể hiện sắc thái đồng thời và nhấn mạnh của αὐτῇ mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐπιστᾶσα
  choice: bà đến gần
  rationale: Phân từ bất định của ἐφίστημι ở đây mô tả việc An-ne tiến đến hoặc xuất hiện tại chỗ; “đến gần” rõ nghĩa mà không thêm cách thức di chuyển.
- source_word: ἀνθωμολογεῖτο τῷ θεῷ
  choice: dâng lời cảm tạ Đức Chúa Trời
  rationale: Động từ có thể diễn tả việc công khai cảm tạ hoặc ca ngợi để đáp lại; thể chưa hoàn thành gợi hành động đang tiếp diễn, nhưng không nhất thiết phải thêm ý “bắt đầu”.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: nói về Ngài
  rationale: Thể chưa hoàn thành diễn tả việc bà tiếp tục nói. Đại từ được giữ lại thay vì thay bằng “Chúa Giê-xu” hay “Đức Chúa Trời”, nhằm bảo toàn sự chưa xác định hoàn toàn về đối tượng quy chiếu trong tiếng Hy Lạp.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: với tất cả những người đang trông đợi
  rationale: προσδέχομαι trong văn mạch Lu-ca diễn tả sự chờ đợi đầy mong mỏi; “trông đợi” chuyển tải sắc thái kỳ vọng ấy.
- source_word: λύτρωσιν Ἰερουσαλήμ
  choice: sự cứu chuộc của Giê-ru-sa-lem
  rationale: “Cứu chuộc” giữ được cả ý giải thoát lẫn sức nặng cứu rỗi của λύτρωσις. Kết cấu với “của” không thu hẹp niềm hy vọng này thành một cách hiểu riêng về chính trị hay thuộc linh.
theological_decisions:
- issue: Đối tượng mà αὐτοῦ trong câu “nói về Ngài” quy chiếu
  choice: Giữ đại từ “Ngài”; theo văn mạch, đối tượng tự nhiên nhất là hài nhi Giê-xu.
  alternative: Có thể hiểu đại từ này chỉ Đức Chúa Trời, là danh từ được nêu rõ gần nhất trong câu Hy Lạp.
  rationale: Không thay đại từ bằng một danh xưng cụ thể, nhờ đó bản văn tiếng Việt không âm thầm giải quyết sự căng thẳng về đối tượng quy chiếu.
- issue: Ý nghĩa của λύτρωσιν Ἰερουσαλήμ
  choice: sự cứu chuộc của Giê-ru-sa-lem
  alternative: sự giải cứu Giê-ru-sa-lem
  rationale: Cách dịch được chọn giữ nguyên bề rộng của niềm hy vọng về hành động cứu độ của Đức Chúa Trời liên quan đến Giê-ru-sa-lem và dân Ngài, không giới hạn vào sự giải phóng chính trị hay chỉ một nghĩa thuộc linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” để nối tự nhiên với nhân vật An-ne trong văn mạch. Cụm “dâng lời cảm tạ” phù hợp ngữ vực thờ phượng nhưng vẫn thông dụng; các chú thích bảo toàn những lựa chọn từ vựng và sự mơ hồ thực sự của nguyên văn.
