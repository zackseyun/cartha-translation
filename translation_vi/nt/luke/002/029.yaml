    rationale: Trong tiếng Việt hiện đại, “cho đi” dễ được hiểu là trao/tặng một vật hay một người, nên không diễn đạt chính xác sắc thái “thả ra, cho rời đi, giải ngũ/cho thôi” của ἀπολύω trong ngữ cảnh này. Nên thay bằng “cho ra đi” hoặc “cho rời đi.”
