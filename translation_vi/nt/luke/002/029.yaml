source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: vi
  text: “Lạy Chủ, giờ đây Ngài cho nô lệ của Ngài[a] được ra đi[b] trong bình an, đúng như lời Ngài.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tôi tớ của Ngài”. Từ Hy Lạp δοῦλος có thể chỉ nô lệ hoặc tôi tớ; ở đây “nô lệ” được dùng vì Si-mê-ôn gọi Đức Chúa Trời là “Chủ”, khiến quan hệ thuộc quyền sở hữu và phục vụ trở nên đặc biệt rõ.
    reason: lexical_alternative
  - marker: b
    text: Ngữ cảnh cho thấy Si-mê-ôn đã sẵn sàng lìa đời trong bình an; tuy nhiên, nguyên văn chỉ nói ông được “thả ra”, “cho ra đi” hoặc “cho rời đi”, chứ không trực tiếp dùng từ “chết”.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: giờ đây
  rationale: Diễn tả thời điểm hiện tại khi điều Si-mê-ôn mong đợi được ứng nghiệm; tự nhiên và trang trọng hơn cách nói đơn thuần “bây giờ” trong ngữ cảnh thi ca.
- source_word: ἀπολύεις
  choice: cho ... được ra đi
  rationale: Giữ hình ảnh được chủ cho rời đi hoặc phóng thích, đồng thời phù hợp với lời nói về lúc lìa đời mà không trực tiếp thêm ý “chết” vào động từ Hy Lạp.
- source_word: τὸν δοῦλόν σου
  choice: nô lệ của Ngài
  rationale: δοῦλος có thể được dịch là “nô lệ” hoặc “tôi tớ”; ở đây cách xưng hô δέσποτα làm nổi bật quan hệ sở hữu và phục vụ, nên “nô lệ” giữ rõ hơn sức nặng của nguyên ngữ.
- source_word: δέσποτα
  choice: Lạy Chủ
  rationale: δέσποτα chỉ người chủ có quyền trên nô lệ. “Lạy Chủ” duy trì sự tương ứng với “nô lệ” mà không diễn giải mở rộng thành một tước hiệu thần học khác.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: đúng như lời Ngài
  rationale: κατά với đối cách diễn tả sự phù hợp; cách dịch này tự nhiên trong tiếng Việt và vẫn giữ ý lời phán hay lời hứa của Đức Chúa Trời.
- source_word: ἐν εἰρήνῃ
  choice: trong bình an
  rationale: Bám sát cấu trúc giới từ của nguyên văn và giữ âm hưởng Kinh Thánh về sự ra đi dưới sự bình an của Đức Chúa Trời.
theological_decisions:
- issue: Câu nói của Si-mê-ôn có nên được dịch thành lời nói trực tiếp về cái chết hay không
  choice: Giữ hình ảnh được cho ra đi, không nói thẳng là chết
  alternative: Giờ đây Ngài cho nô lệ của Ngài được chết trong bình an
  rationale: Ngữ cảnh hàm ý mạnh rằng Si-mê-ôn đã sẵn sàng lìa đời, nhưng ἀπολύω tự nó có nghĩa là thả, cho đi hoặc cho rời khỏi, chứ không trực tiếp có nghĩa là làm cho chết. Cách dịch giữ được hình ảnh và độ căng của nguyên văn.
- issue: Sắc thái của δοῦλος trong quan hệ với δέσποτα
  choice: Dịch là “nô lệ” và δέσποτα là “Chủ”
  alternative: Dịch là “tôi tớ” và δέσποτα là “Chúa Tể”
  rationale: Cặp từ Hy Lạp nhấn mạnh quan hệ giữa người thuộc quyền sở hữu và chủ có thẩm quyền. Cách dịch được chọn bảo toàn mối liên hệ từ vựng này, dù “tôi tớ” quen thuộc hơn trong văn phong cầu nguyện.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự câu được điều chỉnh tự nhiên cho lời thưa trực tiếp; “Lạy Chủ” và “nô lệ” cố ý giữ sự tương ứng nổi bật giữa δέσποτα và δοῦλος. Đại từ “Ngài” duy trì sắc thái kính trọng khi thưa với Đức Chúa Trời.
