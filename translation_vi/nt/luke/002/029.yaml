  rationale: Chỉ chỉnh chú thích b để loại bỏ một cách diễn đạt tiếng Việt có thể gợi ý nghĩa “ban/tặng” thay vì “cho phép rời đi.” Bản văn chính và chú thích a không cần thay đổi.
