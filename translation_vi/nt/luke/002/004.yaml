source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: vi
  text: Giô-sép cũng đi lên từ Ga-li-lê, từ thành Na-xa-rét, đến miền Giu-đê, đến thành Đa-vít, được gọi là Bết-lê-hem, vì ông thuộc nhà và dòng tộc Đa-vít[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuộc gia tộc và dòng dõi Đa-vít.” Tiếng Hy Lạp dùng hai từ gần nghĩa về quan hệ gia tộc và tổ tiên, nhằm nhấn mạnh nguồn gốc Đa-vít của Giô-sép.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: đi lên
  rationale: Giữ hình ảnh chuyển động lên vùng Giu-đê trong nguyên văn, thay vì giản lược thành “đi”.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Diễn đạt nhẹ nhàng mạch nối tường thuật và ý bổ sung, tự nhiên trong tiếng Việt.
- source_word: πόλεως / πόλιν
  choice: thành / thành
  rationale: “Thành” là cách gọi địa danh trang trọng, quen thuộc trong văn phong Kinh Thánh tiếng Việt và dùng tự nhiên cho cả Na-xa-rét lẫn danh hiệu “thành Đa-vít”.
- source_word: Ἰουδαίαν
  choice: miền Giu-đê
  rationale: Làm rõ đây là một vùng địa lý, đồng thời tránh nhầm với tên chi tộc hoặc vương quốc Giu-đa.
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: thành Đa-vít gọi là Bết-lê-hem
  rationale: Giữ mối liên hệ trực tiếp giữa danh hiệu “thành Đa-vít” và tên Bết-lê-hem, với cấu trúc tiếng Việt gọn và tự nhiên.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: vì ông thuộc
  rationale: Cấu trúc với διά nêu nguyên nhân; “thuộc” diễn đạt tự nhiên tư cách thành viên theo nguồn gốc gia tộc.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: thuộc nhà và dòng tộc Đa-vít
  rationale: 'Giữ lại cả hai thuật ngữ chỉ quan hệ tổ tiên: “nhà” mang sắc thái vương tộc, còn “dòng tộc” nhấn mạnh nguồn gốc huyết hệ.'
- source_word: Ἰωσὴφ / Ναζαρὲθ / Βηθλέεμ / Δαυίδ
  choice: Giô-sép / Na-xa-rét / Bết-lê-hem / Đa-vít
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Thuật ngữ về nguồn gốc Đa-vít của Giô-sép
  choice: thuộc nhà và dòng tộc Đa-vít
  alternative: thuộc gia tộc và dòng dõi Đa-vít
  rationale: Bản dịch không gộp οἶκος và πατριά thành một ý duy nhất, nhờ đó giữ sự nhấn mạnh của Lu-ca về nguồn gốc Đa-vít của Giô-sép mà không suy diễn thêm về mặt thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Trật tự địa lý “từ Ga-li-lê, từ thành Na-xa-rét… đến… Bết-lê-hem” được giữ gần nguyên văn. Dấu phẩy cuối câu phản ánh việc mệnh đề còn tiếp tục sang câu 5.
