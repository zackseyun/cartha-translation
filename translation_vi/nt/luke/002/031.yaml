lexical_decisions:
- source_word: ὃ
  choice: mà
  rationale: Đại từ quan hệ trung tính số ít quy chiếu về “ơn cứu rỗi” ở câu trước; “mà” nối tự nhiên với tiền ngữ ấy trong tiếng Việt.
- source_word: ἡτοίμασας
  choice: Ngài đã chuẩn bị
  rationale: Động từ aorist chủ động, ngôi thứ hai số ít, hướng lời nói đến Đức Chúa Trời; “đã chuẩn bị” diễn đạt rõ hành động đã được thực hiện.
- source_word: κατὰ πρόσωπον
  choice: trước mặt
  rationale: Giữ hình ảnh của thành ngữ Hy Lạp và truyền đạt ý điều được đặt công khai trong tầm nhìn hoặc sự hiện diện của mọi người.
- source_word: πάντων τῶν λαῶν
  choice: mọi dân
  rationale: “Mọi” diễn đạt πάντων, còn “dân” là cách nói tự nhiên, trang trọng cho số nhiều λαῶν trong ngữ cảnh này mà không sớm thu hẹp nghĩa thành riêng các dân ngoại.
theological_decisions:
- issue: Phạm vi và sắc thái của λαῶν trong liên hệ với câu kế tiếp
  choice: mọi dân
  alternative: mọi dân tộc; mọi nước
  rationale: Bản dịch giữ phạm vi bao quát và tính đa cộng đồng của danh từ số nhiều, đồng thời để câu 32 tự nêu rõ dân ngoại và Israel, thay vì đưa sự phân biệt đó vào câu này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” phù hợp với lời trực tiếp thưa cùng Đức Chúa Trời; “trước mặt mọi dân” vừa tự nhiên trong tiếng Việt vừa giữ hình ảnh và tính công khai của nguyên văn.
