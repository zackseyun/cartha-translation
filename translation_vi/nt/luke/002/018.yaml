    issue: Thì/khía cạnh của “nghe” chưa được biểu đạt rõ.
    rationale: “Tất cả những người nghe” có thể được hiểu là những người đang nghe hoặc thường nghe. “Tất cả những người đã nghe” phản ánh tốt hơn phân từ aorist được danh từ hóa, chỉ những người đã nghe lời các mục đồng trong sự việc vừa thuật lại.
  - severity: low
    issue: Cách ghi quyết định từ vựng cho καὶ không khớp với bản dịch.
    rationale: Bản dịch đã lược liên từ καὶ để câu tiếng Việt tự nhiên, nhưng mục lexical_decisions lại ghi lựa chọn là “Tất cả,” vốn thực ra tương ứng với πάντες. Đây là lỗi ghi nhận phân tích, không làm sai nghĩa câu.
