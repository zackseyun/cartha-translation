  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: vi
  text: Tất cả những người đã nghe đều kinh ngạc trước những điều các mục đồng đã kể cho họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đều lấy làm lạ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Tất cả
  rationale: Không dịch καί thành một liên từ riêng vì trong tiếng Việt, mở câu bằng “Và” ở đây kém tự nhiên; mạch nối với câu trước vẫn rõ trong văn cảnh.
- source_word: πάντες οἱ ἀκούσαντες
  choice: tất cả những người nghe
  rationale: Phân từ quá khứ có mạo từ được dùng như danh từ, chỉ toàn bộ những người đã nghe. Không thêm tân ngữ “điều ấy” vì tiếng Việt có thể dùng “nghe” không cần tân ngữ khi văn cảnh đã rõ.
- source_word: ἐθαύμασαν
  choice: đều kinh ngạc
  rationale: Diễn tả phản ứng sửng sốt, thán phục trước điều được nghe; “kinh ngạc” là cách nói hiện đại, tự nhiên và không tự suy diễn đó là đức tin hay sự hoài nghi.
- source_word: περὶ τῶν λαληθέντων
  choice: về những điều … đã kể
  rationale: περί với sở hữu cách mang nghĩa “về/liên quan đến”; phân từ bị động chỉ nội dung đã được nói. Cấu trúc tiếng Việt chuyển sang chủ động để tự nhiên nhưng vẫn giữ nguyên tác nhân và nội dung.
- source_word: ὑπὸ τῶν ποιμένων
  choice: các mục đồng
  rationale: ὑπό với sở hữu cách nêu tác nhân của lời được nói. “Mục đồng” là từ trang trọng, quen thuộc trong văn cảnh Chúa giáng sinh và chỉ người chăn chiên.
- source_word: πρὸς αὐτούς
  choice: cho họ
  rationale: πρός ở đây chỉ hướng của lời nói đến những người nghe. “Cho họ” tự nhiên trong kết cấu “kể cho họ” và giữ đại từ không xác định quá mức đối tượng.
theological_decisions:
- issue: Bản chất phản ứng được diễn tả bởi ἐθαύμασαν
  choice: Chỉ thuật lại rằng những người nghe kinh ngạc
  alternative: Hiểu phản ứng ấy là đức tin tích cực hoặc chỉ là tò mò
  rationale: Động từ θαυμάζω nêu phản ứng ngạc nhiên nhưng không cho biết phản ứng ấy dẫn đến đức tin hay sự hoài nghi; bản dịch giữ nguyên độ mở thần học của câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “mục đồng” để phù hợp văn phong Kinh Thánh phổ thông; dùng câu chủ động tự nhiên trong tiếng Việt mà không làm thay đổi quan hệ tác nhân của nguyên văn.
