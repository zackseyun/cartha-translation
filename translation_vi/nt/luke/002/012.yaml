    rationale: εὑρίσκω ở đây nói việc tìm thấy/nhận ra dấu hiệu đã được báo trước. “Gặp” có thể tự nhiên trong vài ngữ cảnh, nhưng dễ chuyển trọng tâm sang một cuộc gặp gỡ hơn là việc tìm thấy đứa trẻ theo dấu hiệu.
  - severity: low
    issue: Thiếu từ nối giữa hai phân từ
    rationale: Nguyên văn có καὶ trước κείμενον. Thêm “và” làm rõ rằng cả việc được quấn khăn vải lẫn đang nằm trong máng ăn đều thuộc về dấu hiệu.
  - severity: low
    issue: Chú thích dùng nhãn “Theo nghĩa đen” chưa chính xác về mức độ
    rationale: φάτνη có thể chỉ máng ăn/máng cho súc vật ăn; “máng cho súc vật ăn” là cách nói giải thích cụ thể hơn, không phải một nghĩa đen duy nhất đối lập với bản văn chính.
