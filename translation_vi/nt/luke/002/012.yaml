source:
  edition: SBLGNT
  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: vi
  text: 'Và đây là dấu hiệu dành cho anh em: anh em sẽ tìm thấy một hài nhi được quấn trong khăn vải và đang nằm trong một máng ăn.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “máng cho súc vật ăn”; truyền thống: “máng cỏ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: dấu hiệu
  rationale: Trong ngữ cảnh này, từ này chỉ dấu hiệu nhận biết được ban cho những người chăn chiên, không nhất thiết nói rõ đó là một phép lạ hay bằng chứng.
- source_word: εὑρήσετε
  choice: anh em sẽ gặp
  rationale: Động từ ở thì tương lai, ngôi thứ hai số nhiều. “Sẽ gặp” tự nhiên trong tiếng Việt khi nói đến việc tìm thấy một người tại một nơi, đồng thời vẫn diễn đạt kết quả của hành động tìm kiếm.
- source_word: βρέφος
  choice: một hài nhi
  rationale: Từ Hy Lạp chỉ một đứa trẻ còn rất nhỏ. “Hài nhi” trang trọng, dễ hiểu và thích hợp với văn cảnh giáng sinh.
- source_word: ἐσπαργανωμένον
  choice: được quấn khăn
  rationale: Phân từ này nói đến việc quấn trẻ sơ sinh bằng vải. “Được quấn khăn” diễn đạt cụ thể, tự nhiên mà không thêm chi tiết không có trong câu.
- source_word: κείμενον
  choice: nằm
  rationale: Phân từ hiện tại diễn tả tư thế hay trạng thái của hài nhi; “nằm” giữ đúng sắc thái trạng thái hơn cách dịch hàm ý hành động đặt xuống.
- source_word: φάτνῃ
  choice: trong máng ăn
  rationale: Từ này chỉ máng đựng thức ăn cho súc vật. “Máng ăn” rõ nghĩa đối với độc giả hiện đại hơn từ truyền thống “máng cỏ”, vốn có thể bị hiểu là chiếc máng làm bằng cỏ.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: đây sẽ là dấu hiệu cho anh em
  rationale: Cụm Hy Lạp lược động từ nối; thêm “sẽ là” tạo câu tiếng Việt tự nhiên và phù hợp với lời báo trước, còn “cho anh em” giữ đối tượng số nhiều của dấu hiệu.
theological_decisions:
- issue: Bản chất của dấu hiệu được ban cho những người chăn chiên
  choice: Trình bày đây là dấu hiệu để nhận biết hài nhi, không nói rõ đó là một hiện tượng kỳ diệu.
  alternative: Có thể hiểu dấu hiệu này đồng thời mang ý nghĩa thần học rộng hơn như sự xác nhận của Đức Chúa Trời.
  rationale: Câu văn tập trung vào cách những người chăn chiên nhận ra hài nhi qua hoàn cảnh khác thường. Bản dịch giữ nguyên “dấu hiệu” và không diễn giải thêm, để chiều sâu thần học vẫn hàm ẩn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh em” cho đại từ ngôi thứ hai số nhiều vì lời thiên sứ trực tiếp nói với nhóm người chăn chiên. “Hài nhi” duy trì sắc thái trang nghiêm mà vẫn thông dụng; “máng ăn” ưu tiên độ rõ nghĩa.
