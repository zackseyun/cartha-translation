  rationale: Bản sửa chuyển εὑρήσετε bằng “sẽ tìm thấy”, giữ mệnh đề giới thiệu dấu hiệu ở hiện tại như cấu trúc Hy Lạp lược động từ nối, làm rõ chất liệu quấn trẻ bằng “khăn vải”, và giữ liên kết giữa hai đặc điểm nhận biết. Không thêm diễn giải thần học về bản chất của “dấu hiệu”.
