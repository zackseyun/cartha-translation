source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: vi
  text: Ông đến đền thờ trong Thánh Linh[a]; khi cha mẹ đem hài nhi Giê-su vào để làm cho Người theo điều Luật pháp đã thành lệ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “nhờ Thánh Linh.” Nguyên văn là “trong Thánh Linh”; trong văn cảnh, cụm này chỉ Thánh Linh.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “cha mẹ.” Lu-ca dùng cách gọi gia đình thông thường này về Ma-ri và Giô-sép trong việc chăm sóc Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: Được Thánh Linh dẫn dắt
  rationale: Trong văn cảnh Lu-ca 2:25–27, πνεῦμα chỉ về Thánh Linh. Cách diễn đạt này chuyển tải tự nhiên phương tiện hoặc sự thúc đẩy hàm chứa trong ἐν, trong khi chú thích giữ lại khả năng dịch sát là “trong Thánh Linh”.
- source_word: ἱερόν
  choice: đền thờ
  rationale: ἱερόν chỉ toàn bộ khuôn viên đền thờ, không riêng nơi thánh bên trong; “đền thờ” là cách gọi chuẩn, tự nhiên trong tiếng Việt.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: Khi ... đem ... vào
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ mang nghĩa thời gian; “khi” diễn đạt rõ và tự nhiên.
- source_word: γονεῖς
  choice: cha mẹ
  rationale: Đây là nghĩa thông thường của γονεῖς và phản ánh cách Lu-ca mô tả Ma-ri cùng Giô-sép trong vai trò gia đình đối với Chúa Giê-su, không đưa thêm khẳng định về quan hệ sinh học.
- source_word: παιδίον Ἰησοῦν
  choice: hài nhi Giê-su
  rationale: Trong bối cảnh này παιδίον chỉ một trẻ sơ sinh; “hài nhi Giê-su” vừa trang trọng vừa chính xác.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: để làm cho con trẻ
  rationale: Động từ nguyên mẫu sở hữu cách diễn tả mục đích; αὐτούς là chủ thể ngầm chỉ cha mẹ, còn περὶ αὐτοῦ cho biết nghi thức được thực hiện liên quan đến Chúa Giê-su. Tiếng Việt cần tái cấu trúc để tránh tối nghĩa.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: theo thông lệ của Luật pháp
  rationale: εἰθισμένον chỉ điều đã thành lệ hoặc được quy định theo lệ; cụm tiếng Việt này giữ cả ý tục lệ và mối liên hệ với Luật pháp Môi-se.
theological_decisions:
- issue: πνεῦμα trong hành động của Si-mê-ôn chỉ ai
  choice: Thánh Linh
  alternative: tinh thần hoặc sự thôi thúc nội tâm của Si-mê-ôn
  rationale: Ba câu liên tiếp trong Lu-ca 2:25–27 nhấn mạnh hoạt động của Thánh Linh, nên cách hiểu này phù hợp nhất với văn cảnh.
- issue: Gọi Ma-ri và Giô-sép là γονεῖς
  choice: cha mẹ
  alternative: những người chăm nom; Giô-sép và Ma-ri
  rationale: Giữ nguyên ngôn ngữ gia đình thông thường của Lu-ca, không làm yếu nghĩa từ ngữ vì quan ngại thần học và cũng không phủ nhận sự thụ thai đồng trinh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hài nhi” vì Chúa Giê-su lúc này còn rất nhỏ; viết hoa “Thánh Linh” và “Luật pháp” theo cách dùng Kinh Thánh tiếng Việt. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu kế tiếp.
