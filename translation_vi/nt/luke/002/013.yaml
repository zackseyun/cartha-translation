source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: vi
  text: 'Bỗng nhiên, cùng với thiên sứ, có một đoàn thiên binh đông đảo[a], đang ca ngợi Đức Chúa Trời và nói:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “một đạo quân thiên thượng đông đảo” hoặc “một đạo quân đông đảo trên trời.”'
    reason: Nêu các cách diễn đạt trực tiếp hơn sắc thái quân đội và quan hệ sở thuộc trong cụm στρατιᾶς οὐρανίου.
lexical_decisions:
- source_word: ἐξαίφνης
  choice: Bỗng nhiên
  rationale: Diễn đạt tự nhiên tính bất ngờ của sự việc và giữ hiệu ứng đột ngột trong lời kể.
- source_word: ἐγένετο
  choice: có
  rationale: Trong cấu trúc hiện hữu này, động từ giới thiệu sự hiện diện của đoàn thiên binh; “có” không thêm ý rằng họ hiện ra trước mắt.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: cùng với thiên sứ
  rationale: Giữ đúng ý đồng hành của σύν với cách nói trang trọng, tự nhiên trong tiếng Việt.
- source_word: πλῆθος
  choice: một đoàn ... đông đảo
  rationale: Truyền đạt số lượng rất lớn, đồng thời kết hợp tự nhiên với danh từ tập hợp chỉ thiên binh.
- source_word: στρατιᾶς οὐρανίου
  choice: thiên binh
  rationale: Cách gọi ngắn gọn, quen thuộc trong tiếng Việt, chỉ đạo quân thuộc cõi trời và giữ sắc thái quân đội của στρατιά.
- source_word: αἰνούντων τὸν θεόν
  choice: đang ca ngợi Đức Chúa Trời
  rationale: Phân từ hiện tại mô tả hoạt động đang diễn ra; “Đức Chúa Trời” là cách gọi trang trọng, phổ thông.
- source_word: καὶ λεγόντων
  choice: và nói
  rationale: Giữ liên kết song song giữa hai phân từ và dẫn trực tiếp vào lời được trích ở câu kế tiếp.
theological_decisions:
- issue: Cách dịch στρατιᾶς οὐρανίου
  choice: thiên binh
  alternative: đạo quân thiên thượng; đạo quân trên trời
  rationale: “Thiên binh” giữ hình ảnh một lực lượng có tổ chức thuộc cõi trời mà không biến họ thành một đám đông chung chung; ngữ cảnh cho thấy họ đang thờ phượng chứ không tham chiến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Một đoàn thiên binh đông đảo” vừa tự nhiên trong tiếng Việt vừa bảo toàn ý số đông và hình ảnh quân đội trên trời; dấu hai chấm báo trước lời công bố ở câu tiếp theo.
