    reason: cultural_note
  revision_rationale: Chỉ thay “ý tưởng” bằng “ý nghĩ” để phản ánh chính xác và tự nhiên hơn διαλογισμοί. Giữ nguyên cách diễn đạt chính văn về thanh gươm vì vẫn truyền đạt được nghĩa “sẽ xuyên qua,” đồng thời giữ nguyên tính không xác định của lời tiên báo và quan hệ mục đích/kết quả của ὅπως ἄν.
