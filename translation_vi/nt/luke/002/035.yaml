id: LUK.2.35
reference: Luke 2:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: vi
  text: Còn chính tâm hồn bà cũng sẽ bị một thanh gươm xuyên qua[a][b]—để những ý nghĩ trong lòng nhiều người được phơi bày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi qua.” Động từ Hy Lạp theo nghĩa sát là “đi qua, đi xuyên qua”; hình ảnh thanh gươm tự nhiên gợi ý sự đâm xuyên.
    reason: lexical_alternative
  - marker: b
    text: “Thanh gươm” thường được hiểu là hình ảnh về nỗi đau sâu sắc mà Ma-ri sẽ trải qua.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: chính ... bà
  rationale: Đại từ sở hữu cùng từ nhấn mạnh αὐτῆς làm nổi bật việc lời này trực tiếp nói về chính Ma-ri; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ψυχή
  choice: tâm hồn
  rationale: Trong lời tiên báo này, ψυχή chỉ con người bên trong, nơi chịu nỗi đau sâu sắc; “tâm hồn” tự nhiên hơn “linh hồn” trong ngữ cảnh cảm xúc này.
- source_word: διελεύσεται
  choice: sẽ ... xuyên qua
  rationale: Động từ có nghĩa căn bản là “đi/xuyên qua”; đi với hình ảnh thanh gươm, “xuyên qua” vừa sát nghĩa vừa tự nhiên, không cần thêm động từ “đâm”.
- source_word: ῥομφαία
  choice: một thanh gươm
  rationale: ῥομφαία chỉ một loại gươm lớn, đáng sợ; “thanh gươm” truyền đạt đủ hình ảnh trong tiếng Việt mà không diễn giải quá mức.
- source_word: ὅπως ἂν
  choice: để
  rationale: Cụm liên từ có thể diễn tả mục đích hoặc kết quả được hướng tới; “để” giữ liên hệ ấy ngắn gọn và tự nhiên.
- source_word: ἀποκαλυφθῶσιν
  choice: được phơi bày
  rationale: Giữ thể bị động và ý nghĩa điều kín giấu được bộc lộ; “phơi bày” phù hợp với những ý tưởng nằm trong lòng.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: trong lòng nhiều người
  rationale: ἐκ nêu nguồn xuất phát từ bên trong; tiếng Việt tự nhiên diễn đạt nội tâm bằng “trong lòng nhiều người”.
- source_word: διαλογισμοί
  choice: những ý tưởng
  rationale: Từ này có thể chỉ ý nghĩ, suy luận hoặc toan tính trong lòng. “Ý tưởng” đủ rộng để không tự ý gán sắc thái tốt hay xấu.
theological_decisions:
- issue: Hình ảnh thanh gươm và nỗi đau của Ma-ri
  choice: Giữ nguyên hình ảnh một thanh gươm xuyên qua tâm hồn bà, không xác định cụ thể biến cố gây đau đớn.
  alternative: Giải thích trực tiếp là nỗi đau của Ma-ri trước sự đóng đinh của Đức Giê-su, hoặc là đau khổ do sứ mạng gây chia rẽ của ngài.
  rationale: Bản Hy Lạp trực tiếp nói với Ma-ri và tiên báo nỗi đau sâu sắc, nhưng không xác định trong câu này cơ chế lịch sử chính xác của sự ứng nghiệm.
- issue: Quan hệ của mệnh đề ὅπως ἂν
  choice: Dịch “để,” giữ khả năng diễn tả mục đích hoặc kết quả hướng tới.
  alternative: Dịch rõ thành “với kết quả là.”
  rationale: Cấu trúc Hy Lạp có thể mang sắc thái mục đích hoặc kết quả; không nên thu hẹp sự căng thẳng ấy trong bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “bà” vì câu trực tiếp nói với Ma-ri; giữ hình ảnh tiên tri và không giải thích quá mức. Dấu gạch ngang giúp thể hiện mệnh đề chen mang tính tiên báo trong mạch văn.
