  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: vi
  text: Cũng có một nữ tiên tri tên là An-ne, con gái Pha-nu-ên, thuộc chi tộc A-se. Bà tuổi tác đã cao[a]; bà đã sống với chồng được bảy năm sau thời trinh nữ của mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đã tiến xa trong nhiều ngày”, một thành ngữ chỉ người rất cao tuổi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hoặc: “bà đã sống với chồng bảy năm kể từ thời trinh nữ của mình.” Cụm này thường được hiểu là bảy năm hôn nhân sau khi bà rời thời con gái để kết hôn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: nữ tiên tri
  rationale: Danh từ Hy Lạp ở giống cái, chỉ rõ An-ne là một phụ nữ giữ vai trò tiên tri. “Nữ tiên tri” tự nhiên và minh bạch trong tiếng Việt hiện đại.
- source_word: θυγάτηρ Φανουήλ
  choice: con gái Pha-nu-ên
  rationale: Chuyển đạt trực tiếp quan hệ huyết thống theo lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: thuộc chi tộc A-se
  rationale: ἐκ diễn tả nguồn gốc hoặc sự thuộc về; “thuộc chi tộc” diễn đạt rõ căn tính bộ tộc của bà.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: tuổi tác đã cao
  rationale: Cụm Hy Lạp theo nghĩa đen là “đã tiến xa trong nhiều ngày”, một thành ngữ chỉ tuổi già. Bản dịch dùng thành ngữ tiếng Việt tự nhiên mà không đưa vào một con số tuổi cụ thể.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: đã sống với chồng
  rationale: Trong ngữ cảnh, ἀνήρ chỉ người chồng và cụm từ nói về đời sống hôn nhân, không chỉ việc ở chung.
- source_word: ἔτη ἑπτὰ
  choice: được bảy năm
  rationale: Diễn đạt trực tiếp khoảng thời gian bảy năm.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: tính từ thời trinh nữ của mình
  rationale: Giữ hình ảnh và điểm quy chiếu của nguyên văn mà chưa hoàn toàn thay bằng lời giải thích “từ khi kết hôn”; chú thích cung cấp cách hiểu tự nhiên hơn.
theological_decisions:
- issue: Vai trò của An-ne trong từ προφῆτις
  choice: Gọi bà là “nữ tiên tri” theo nghĩa thông thường trong Kinh Thánh.
  alternative: Làm nhẹ nghĩa thành một phụ nữ mộ đạo hoặc dùng như một danh hiệu chung chung.
  rationale: Nguyên văn minh nhiên dùng danh từ chỉ tiên tri ở giống cái; không có cơ sở văn bản để giảm nhẹ vai trò này.
- issue: Cách diễn đạt tuổi của An-ne
  choice: Dùng “tuổi tác đã cao”, không xác định tuổi cụ thể.
  alternative: Dịch sát từng chữ là “đã tiến xa trong nhiều ngày” hoặc đưa phép tính tuổi từ câu kế tiếp vào câu này.
  rationale: Đây là thành ngữ chỉ tuổi già; cách dịch được chọn tự nhiên trong tiếng Việt và không nói cụ thể hơn nguyên văn.
- issue: Mốc khởi đầu của bảy năm hôn nhân
  choice: Giữ cách nói “tính từ thời trinh nữ của mình” trong chính văn và giải thích ở chú thích.
  alternative: Dịch thẳng là “sau khi kết hôn” hoặc “từ khi thôi còn trinh nữ”.
  rationale: Cụm ἀπὸ τῆς παρθενίας αὐτῆς có ý nói bảy năm được tính từ khi bà rời thời trinh nữ để bước vào hôn nhân, nhưng cách cấu tạo của nguyên văn đáng được phản ánh thay vì âm thầm thay thế hoàn toàn bằng lời giải nghĩa.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt: An-ne, Pha-nu-ên và A-se. Dấu phẩy cuối câu được giữ vì câu Hy Lạp tiếp tục sang câu 37.'
