  source_fidelity: 'Bản dịch truyền đạt đúng các thành phần chính của câu: An-ne là nữ tiên tri, là con gái Pha-nu-ên, thuộc chi tộc A-se, đã cao tuổi, và đã sống đời hôn nhân bảy năm. Tuy nhiên, “tính từ thời trinh nữ của mình” trong tiếng Việt dễ gợi rằng thời lượng bảy năm bắt đầu khi bà còn ở trong tình trạng trinh nữ. Cụm ἀπὸ τῆς παρθενίας αὐτῆς trong ngữ cảnh quy chiếu thời điểm rời thời con gái để bước vào hôn nhân; cách “sau thời trinh nữ” phản ánh ý này tự nhiên hơn mà không thêm chi tiết không có trong câu.'
