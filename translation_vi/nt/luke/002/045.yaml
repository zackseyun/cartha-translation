base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: vi
  text: Khi không tìm thấy Ngài, họ trở lại Giê-ru-sa-lem trong khi tìm kiếm Ngài.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Khi
  rationale: Trong tiếng Việt, quan hệ nối tiếp của καὶ được diễn đạt tự nhiên cùng mệnh đề thời gian do phân từ kế tiếp tạo nên; không cần thêm “và” ở đầu câu.
- source_word: μὴ εὑρόντες
  choice: không tìm thấy Ngài
  rationale: Phân từ bất định quá khứ với μή được chuyển thành mệnh đề hoàn cảnh “khi không tìm thấy”, vừa rõ nghĩa vừa tự nhiên trong lời kể tiếng Việt.
- source_word: ὑπέστρεψαν
  choice: họ quay lại
  rationale: Diễn đạt hành động trở về nơi đã rời đi bằng cách nói thông dụng, phù hợp với văn kể chuyện hiện đại.
- source_word: εἰς Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Địa danh được phiên âm theo cách quen thuộc trong tiếng Việt; hướng chuyển động đã được thể hiện trong động từ “quay lại”.
- source_word: ἀναζητοῦντες
  choice: để tìm
  rationale: Diễn đạt việc họ tích cực tìm kiếm Ngài khi quay lại; cấu trúc này tự nhiên trong tiếng Việt và phù hợp với hoàn cảnh của hành động.
- source_word: αὐτόν
  choice: Ngài
  rationale: Đại từ chỉ Đức Chúa Jêsus; “Ngài” là cách gọi trang trọng, rõ đối tượng và quen thuộc trong văn Kinh Thánh tiếng Việt.
theological_decisions: []
