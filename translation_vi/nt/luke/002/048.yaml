  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: vi
  text: 'Khi thấy Ngài, họ sửng sốt, và mẹ Ngài nói với Ngài: “Con ơi, sao con lại làm cho cha mẹ như vậy? Này, cha con và mẹ đã khổ sở[a] đi tìm con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đau đớn” hoặc “trong nỗi đau khổ”; từ Hy Lạp diễn tả nỗi đau tinh thần trong suốt cuộc tìm kiếm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες αὐτόν
  choice: Khi thấy Ngài
  rationale: Phân từ bất định được diễn đạt như một mệnh đề thời gian tự nhiên trong tiếng Việt, giữ đúng trình tự của câu chuyện.
- source_word: ἐξεπλάγησαν
  choice: họ sửng sốt
  rationale: “Sửng sốt” truyền đạt mức độ ngạc nhiên mạnh của động từ Hy Lạp mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: Τέκνον
  choice: Con ơi
  rationale: Cách xưng hô trìu mến của người mẹ với con; tự nhiên hơn cách dịch máy móc là “đứa trẻ” và không cần thêm từ sở hữu.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: sao con lại làm thế này với cha mẹ?
  rationale: Dùng “sao” để diễn đạt câu trách hỏi tự nhiên; “với cha mẹ” làm rõ đại từ số nhiều ἡμῖν theo chính những người được Ma-ri nêu ở vế sau.
- source_word: ἰδού
  choice: Này
  rationale: Giữ chức năng thu hút sự chú ý và nhấn mạnh trong lời nói trực tiếp, không dùng từ cổ.
- source_word: ὁ πατήρ σου
  choice: cha con
  rationale: Giữ nguyên cách Ma-ri gọi Giô-sép là cha của Đức Chúa Jêsus trong quan hệ gia đình, không thêm tính từ giải thích.
- source_word: ὀδυνώμενοι
  choice: khổ sở
  rationale: Diễn đạt nỗi đau tinh thần và sự quẫn trí trong lúc tìm kiếm, mạnh hơn nghĩa đơn thuần “lo lắng”.
- source_word: ἐζητοῦμέν σε
  choice: đã ... tìm con
  rationale: “Đã tìm” kết hợp với trạng thái “khổ sở” diễn đạt hành động kéo dài trong quá khứ cho đến lúc gặp lại, phù hợp với thì vị hoàn thành.
theological_decisions:
- issue: Cách gọi Giô-sép là “cha con” trong tương quan với tư cách Con Đức Chúa Trời của Đức Chúa Jêsus
  choice: Giữ nguyên “cha con” trong chính văn, không thêm lời phân loại.
  alternative: cha trần thế của con
  rationale: Bản Hy Lạp ghi lời Ma-ri nói đơn giản là “cha con”. Thêm “trần thế” sẽ giải thích thần học thay vì dịch; cách dịch hiện tại giữ nguyên sức căng của trình thuật, vốn được tiếp nối ở câu sau.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng gần gũi. Cách xưng hô “Con ơi”, “cha con và mẹ” phù hợp lời của một người mẹ; đại từ kể chuyện “Ngài” duy trì sắc thái tôn kính quen thuộc mà không làm thay đổi nội dung.
