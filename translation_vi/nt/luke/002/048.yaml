- from: 'Khi thấy Ngài, họ sửng sốt. Mẹ Ngài nói với Ngài: “Con ơi, sao con lại làm thế này với cha mẹ? Này, cha con và mẹ đã khổ sở[a] tìm con.”'
  to: 'Khi thấy Ngài, họ sửng sốt, và mẹ Ngài nói với Ngài: “Con ơi, sao con lại làm cho cha mẹ như vậy? Này, cha con và mẹ đã khổ sở[a] đi tìm con.”'
  rationale: Bản sửa chỉ làm câu trách hỏi sát với οὕτως và tự nhiên hơn trong tiếng Việt, đồng thời diễn đạt rõ hành động tìm kiếm kéo dài. Cách gọi “cha con” được giữ nguyên như lời Ma-ri trong bản Hy Lạp, không thêm chú giải thần học vào chính văn.
  reviewer_model: gpt-5.6-terra
