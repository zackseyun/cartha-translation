revisions:
- from: Còn con trẻ lớn lên và trở nên mạnh mẽ, được đầy sự khôn ngoan; ân huệ của Đức Chúa Trời[a] ở trên con trẻ ấy.
  to: Con trẻ lớn lên và ngày càng mạnh mẽ, đầy dẫy sự khôn ngoan; ân huệ[a] của Đức Chúa Trời ở trên Người.
  rationale: Bản sửa thay các kết hợp từ gượng bằng cách diễn đạt Việt ngữ tự nhiên hơn, vẫn giữ tiến trình phát triển được các động từ chưa hoàn thành diễn tả, và giữ hình ảnh ân huệ của Đức Chúa Trời “ở trên” Người. Chú thích được rút gọn và neo đúng vào từ có phương án từ vựng thay thế.
