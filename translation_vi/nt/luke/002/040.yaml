source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: vi
  text: Con trẻ lớn lên và ngày càng mạnh mẽ, đầy dẫy sự khôn ngoan; ân huệ[a] của Đức Chúa Trời ở trên Người.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “ân điển.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: Còn con trẻ
  rationale: παιδίον chỉ một đứa trẻ; “con trẻ” phù hợp với bối cảnh ngay sau thời kỳ sơ sinh và giữ giọng văn trang trọng mà vẫn dễ hiểu. δέ là từ nối nhẹ, được diễn đạt bằng “Còn” để chuyển trọng tâm sang sự trưởng thành của trẻ.
- source_word: ηὔξανεν
  choice: lớn lên
  rationale: Thì chưa hoàn thành của αὐξάνω diễn tả tiến trình phát triển liên tục; “lớn lên” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐκραταιοῦτο
  choice: trở nên mạnh mẽ
  rationale: Dạng chưa hoàn thành trung động/thụ động diễn tả một tiến trình ngày càng được củng cố; “trở nên mạnh mẽ” giữ được sắc thái phát triển.
- source_word: πληρούμενον σοφίᾳ
  choice: được đầy sự khôn ngoan
  rationale: Phân từ hiện tại bổ nghĩa cho con trẻ và mô tả trạng thái đồng hành, đang tiếp diễn; σοφίᾳ là nội dung làm đầy. Cách dịch này giữ hình ảnh “được làm cho đầy” của nguyên văn.
- source_word: χάρις θεοῦ
  choice: ân huệ của Đức Chúa Trời
  rationale: χάρις ở đây có thể chỉ ân huệ, sự ưu ái hoặc ân điển. “Ân huệ” truyền đạt rõ sự hiện diện đầy thiện ý của Đức Chúa Trời, còn khả năng dịch “ân điển” được giữ trong chú thích.
- source_word: ἦν ἐπ’ αὐτό
  choice: ở trên con trẻ ấy
  rationale: ἐπί với đối cách trong cấu trúc này diễn tả sự hiện diện ở trên một người. Lặp lại “con trẻ ấy” tránh đại từ có thể gây bất nhất về lối xưng hô và giữ câu rõ nghĩa.
theological_decisions:
- issue: Cách dịch χάρις θεοῦ trong bối cảnh Đấng Christ trưởng thành
  choice: ân huệ của Đức Chúa Trời
  alternative: ân điển của Đức Chúa Trời
  rationale: “Ân huệ” diễn tả sự ưu ái và hiện diện tốt lành của Đức Chúa Trời mà không buộc câu phải mang một nghĩa thần học chuyên biệt hơn; “ân điển” vẫn là một khả năng từ vựng chính đáng nên được nêu ở chú thích.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu bám sát tiến trình của nguyên văn nhưng dùng dấu chấm phẩy để các vế tự nhiên hơn. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
