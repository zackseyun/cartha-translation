  text: ἀπογράψασθαι σὺν Μαριὰμ τῇ ⸂ἐμνηστευμένῃ αὐτῷ⸃, οὔσῃ ἐγκύῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: vi
  text: để đăng ký, cùng với Ma-ri, người đã đính hôn với ông[a] và đang mang thai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã hứa hôn với ông.” Việc hứa hôn thời ấy là một mối ràng buộc chính thức về pháp lý và xã hội, chặt chẽ hơn việc đính hôn theo cách hiểu thông thường ngày nay.
    reason: lexical_alternative
  - marker: b
    text: Hay “có thai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: để đăng ký
  rationale: Động từ nguyên mẫu trung thái bất định diễn tả mục đích chuyến đi của Giô-sép trong bối cảnh kiểm kê dân số. “Đăng ký” là cách diễn đạt hành chính tự nhiên, hiện đại; hình thức trung thái ở đây không buộc phải dịch thành bị động.
- source_word: σὺν
  choice: cùng với
  rationale: Diễn đạt nghĩa đồng hành thông thường và liên kết tự nhiên với Ma-ri.
- source_word: Μαριὰμ
  choice: Ma-ri
  rationale: Phiên âm tên riêng theo lối dùng quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: người đã đính hôn với ông
  rationale: Phân từ hoàn thành bị động chỉ một quan hệ hứa hôn chính thức, có sức ràng buộc pháp lý và xã hội. “Đã đính hôn” dễ hiểu trong tiếng Việt hiện đại, còn chú thích bảo lưu sắc thái mạnh hơn việc đính hôn ngày nay.
- source_word: οὔσῃ ἐγκύῳ
  choice: và đang mang thai
  rationale: Cụm phân từ mô tả tình trạng của Ma-ri vào thời điểm ấy. “Đang mang thai” rõ ràng, tự nhiên và giữ được tính đồng thời.
theological_decisions:
- issue: Tình trạng hôn nhân của Ma-ri trong quan hệ với Giô-sép
  choice: đã đính hôn với ông
  alternative: đã thành vợ ông
  rationale: Bản Hy Lạp dùng μνηστεύομαι, nói rõ việc hứa hôn chính thức chứ không gọi Ma-ri là vợ trong mệnh đề này. Bản dịch vì thế không nâng tình trạng ấy thành hôn nhân đã hoàn tất, đồng thời chú thích cho biết mối ràng buộc cổ đại mạnh hơn cách hiểu thông thường về đính hôn hiện nay.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” để quy chiếu Giô-sép một cách tự nhiên; giữ cấu trúc của câu nguồn vì đây là phần tiếp nối câu trước.
