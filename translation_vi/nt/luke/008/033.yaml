id: LUK.8.33
reference: Luke 8:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: vi
  text: Bấy giờ, các quỷ ra khỏi người ấy và nhập vào những con heo. Cả đàn lao xuống triền dốc[a], lao vào hồ và chết đuối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bờ dốc đứng” hoặc “vách đá”; từ Hy Lạp chỉ một chỗ dốc xuống.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: ra khỏi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ trình tự hành động.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Danh từ chỉ cụ thể các quỷ, nên không thay bằng thuật ngữ rộng hơn là “các tà linh” hay “các uế linh”.
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: khỏi người ấy
  rationale: Chỉ người đàn ông đã được nhắc đến trong văn cảnh; “người ấy” tự nhiên hơn mà vẫn giữ số ít và sự xác định.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: nhập vào những con heo
  rationale: Diễn đạt rõ chuyển động vào các con vật; “nhập vào” phù hợp ngữ cảnh các quỷ mà không thêm ý ngoài bản văn.
- source_word: χοίρους
  choice: heo
  rationale: “Heo” là từ hiện đại, phổ thông và chính xác trong tiếng Việt; “lợn” là biến thể vùng miền cũng đúng.
- source_word: ὥρμησεν
  choice: lao xuống
  rationale: Động từ diễn tả chuyển động đột ngột, mạnh mẽ; kết hợp với hướng xuống trong cụm kế tiếp tạo câu tiếng Việt tự nhiên.
- source_word: ἡ ἀγέλη
  choice: cả đàn
  rationale: Danh từ tập hợp chỉ đàn heo; “cả đàn” làm rõ chủ thể tập thể trong tiếng Việt mà không đổi ý.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: xuống triền dốc
  rationale: Giữ ý chuyển động đi xuống một sườn dốc đứng mà không khẳng định quá mức rằng đó là vách thẳng đứng.
- source_word: τὴν λίμνην
  choice: hồ
  rationale: λίμνη có nghĩa thông thường là hồ; cách dịch này cũng bảo tồn sự phân biệt từ vựng của Lu-ca với từ chỉ biển.
- source_word: ἀπεπνίγη
  choice: chết đuối
  rationale: Trong ngữ cảnh đàn heo lao xuống nước, động từ chỉ việc bị ngạt nước và chết; “chết đuối” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt.
theological_decisions:
- issue: Cách dịch δαιμόνια trong trình thuật về quỷ ám
  choice: các quỷ
  alternative: các tà linh; các uế linh
  rationale: Bản Hy Lạp dùng δαιμόνια, không dùng cụm từ chỉ “uế linh”; giữ đúng danh từ của bản văn tránh đồng nhất các thuật ngữ liên hệ nhưng không hoàn toàn giống nhau.
- issue: Mức độ cụ thể của κρημνός
  choice: triền dốc
  alternative: vách đá; bờ dốc đứng; vực
  rationale: Từ này chỉ địa hình dốc và hướng lao xuống, nhưng không nhất thiết đòi hỏi hình ảnh một vách đá thẳng đứng; “triền dốc” giữ được độ mở của bản văn.
- issue: Quan hệ giữa các quỷ và đàn heo
  choice: nhập vào những con heo
  alternative: đi vào đàn heo
  rationale: Cách dịch giữ nguyên lời kể rằng các quỷ đi vào các con heo, không giải thích thêm bản chất hay cơ chế của sự kiện.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “heo” theo cách dùng phổ thông; câu được tách làm hai để rõ trình tự sự việc. Dấu chú thích [a] được đặt ngay sau “triền dốc”, đúng với từ ngữ mà chú thích giải thích.
