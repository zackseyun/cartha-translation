  source_fidelity: 'Bản dịch giữ đúng trình tự và các thành tố chính của câu Hy Lạp: các quỷ ra khỏi người ấy, đi vào heo, rồi cả đàn lao xuống địa hình dốc vào hồ và chết đuối. Tuy nhiên, “rơi vào hồ” chuyển động từ ὥρμησεν (“lao/rush”) sang một hành động “rơi”, làm yếu đi sắc thái chủ động, dữ dội của chuyển động được kể trong nguyên ngữ.'
