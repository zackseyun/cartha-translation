  terminology: “Các quỷ” phản ánh đúng δαιμόνια, không thay bằng “uế linh”; “heo,” “hồ,” và “triền dốc” đều phù hợp với cách dùng tiếng Việt hiện đại và với χοίρους, λίμνη, κρημνός. Chú thích được neo đúng sau “triền dốc” và bảo toàn độ mở nghĩa của κρημνός.
