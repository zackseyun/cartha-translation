  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: vi
  text: 'Rồi Giê-su hỏi người ấy: “Tên ông là gì?” Người ấy đáp: “Lê-gi-ôn”[a], vì nhiều quỷ đã nhập vào người ấy.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lê-gi-ôn” là từ vay mượn gốc La-tinh, chỉ một đơn vị quân đội La Mã lớn; ở đây tên gọi này diễn tả rằng có nhiều quỷ trong người ấy.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Bấy giờ, Đức Chúa Jêsus hỏi người ấy
  rationale: Động từ ἐπερωτάω ở đây đơn giản giới thiệu một câu hỏi trực tiếp; “hỏi” là cách diễn đạt tự nhiên. δέ đánh dấu bước tiếp theo trong câu chuyện nên được chuyển là “Bấy giờ” mà không nhấn quá mạnh.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Anh tên gì?
  rationale: Đây là cách hỏi tên theo thành ngữ Hy Lạp. Câu tiếng Việt hiện đại này truyền đạt tự nhiên ý nghĩa của nguyên văn.
- source_word: Λεγιών
  choice: Lê-gi-ôn
  rationale: Giữ tên gọi bằng cách phiên âm từ Hy Lạp, đồng thời chú thích nguồn gốc quân sự La Mã và ý nghĩa theo văn cảnh.
- source_word: ὅτι
  choice: vì
  rationale: ὅτι nêu lý do người ấy tự xưng là “Lê-gi-ôn”; “vì” giữ rõ quan hệ nguyên nhân.
- source_word: εἰσῆλθεν
  choice: đã nhập vào
  rationale: Aorist chỉ sự việc xảy ra trước lời giải thích về tên gọi. “Đã nhập vào” vừa thể hiện sự đi vào của εἰς vừa tự nhiên trong ngữ cảnh quỷ nhập.
- source_word: δαιμόνια πολλὰ
  choice: nhiều quỷ
  rationale: Cách dịch trực tiếp, giữ tính cụ thể của δαιμόνια và sự nhấn mạnh về số lượng.
- source_word: εἰς αὐτόν
  choice: vào anh
  rationale: Giữ sắc thái chuyển động vào của giới từ εἰς, thay vì chỉ diễn tả trạng thái ở trong.
theological_decisions:
- issue: Cách dịch δαιμόνια trong bối cảnh quỷ nhập
  choice: quỷ
  alternative: tà linh
  rationale: “Quỷ” trực tiếp diễn đạt các hữu thể thiêng liêng gian ác được nguyên văn nói là đã nhập vào người đàn ông, không làm nhẹ đi khẳng định siêu nhiên của câu.
- issue: Quan hệ thời gian của εἰσῆλθεν với lời giải thích tên gọi
  choice: đã nhập vào
  alternative: nhập vào
  rationale: Từ “đã” làm rõ việc các quỷ nhập vào xảy ra trước lời đáp “Lê-gi-ôn”, nhưng không thêm một kết luận thần học ngoài nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “anh” trong câu hỏi trực tiếp và khi nhắc lại người đàn ông để lời thoại tự nhiên; dùng “người ấy” trong lời dẫn để giữ giọng kể trang nhã. Phiên âm “Lê-gi-ôn” thay vì dịch thành “quân đoàn” nhằm giữ chức năng tên gọi, còn hàm nghĩa văn hóa được giải thích trong chú thích.
