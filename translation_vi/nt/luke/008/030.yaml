revisions:
- from: 'Bấy giờ, Đức Chúa Jêsus hỏi người ấy: “Anh tên gì?” Người ấy đáp: “Lê-gi-ôn”[a], vì nhiều quỷ đã nhập vào anh.'
  to: 'Rồi Giê-su hỏi người ấy: “Tên ông là gì?” Người ấy đáp: “Lê-gi-ôn”[a], vì nhiều quỷ đã nhập vào người ấy.'
  rationale: Bỏ «Đức Chúa» để bám sát tên gọi trong nguyên văn. Điều chỉnh đại từ để văn phong hiện đại, trung tính và nhất quán, nhưng không thay đổi ý nghĩa. Giữ «Rồi» cho δέ, «quỷ» cho δαιμόνια, và «đã nhập vào» để bảo toàn ý hướng vào cùng quan hệ thời gian trong ngữ cảnh.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo phản ánh đúng câu hỏi của Chúa Giê-su, câu đáp «Lê-gi-ôn», quan hệ nguyên nhân của ὅτι, và ý nghĩa «nhiều quỷ đã nhập vào». Tuy nhiên, nguyên văn chỉ gọi nhân vật hỏi là «Giê-su» (ὁ Ἰησοῦς), không có danh hiệu «Đức Chúa»; danh hiệu này là một phần bổ sung vượt quá câu nguồn.
  naturalness: «Anh tên gì?» tự nhiên trong khẩu ngữ, nhưng việc chuyển từ «người ấy» trong lời kể sang «anh» trong lời thoại tạo sắc thái thân mật không được nguyên văn quy định. «Tên ông là gì?» và «người ấy» giữ giọng kể hiện đại, trung tính và nhất quán hơn.
  terminology: Dùng «quỷ» cho δαιμόνια và «đã nhập vào» cho εἰσῆλθεν εἰς αὐτόν là phù hợp. «Lê-gi-ôn» có thể được giữ như một tên/định danh được phiên âm; chú thích văn hóa giải thích đúng liên hệ với đơn vị quân sự La Mã.
  issues:
  - severity: medium
    issue: Thêm danh hiệu «Đức Chúa» trước tên Giê-su.
    rationale: SBLGNT viết ὁ Ἰησοῦς, nghĩa là «Giê-su», không có κύριος («Chúa») hay một danh hiệu tương đương. Bản dịch không nên thêm danh hiệu thần học hoặc tôn kính không hiện diện trong câu này.
  - severity: low
    issue: Đại từ «anh» trong lời thoại không nhất quán với «người ấy» và tạo sắc thái thân mật.
    rationale: Nguyên văn không xác định mức độ thân mật hay vị thế xã hội qua một đại từ tương đương. «Ông» trong câu hỏi, cùng với «người ấy» trong lời kể, là cách dùng trung tính và tự nhiên trong văn xuôi tiếng Việt hiện đại.
  revised_text: 'Rồi Giê-su hỏi người ấy: “Tên ông là gì?” Người ấy đáp: “Lê-gi-ôn”[a], vì nhiều quỷ đã nhập vào người ấy.'
