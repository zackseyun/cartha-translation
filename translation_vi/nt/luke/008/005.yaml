id: LUK.8.5
reference: Luke 8:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: vi
  text: Người gieo giống đi ra để gieo hạt giống của mình. Khi người ấy đang gieo, một phần hạt rơi bên đường, bị giẫm đạp, rồi chim trời[a] ăn sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch là “chim trên trời”; sát chữ: “chim của trời”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: đi ra
  rationale: Diễn đạt tự nhiên động từ ἐξέρχομαι ở thì aorist, không dùng lối văn cổ.
- source_word: ὁ σπείρων
  choice: người gieo giống
  rationale: Phân từ có mạo từ được dùng như danh từ; cách dịch này tự nhiên và hợp với bối cảnh dụ ngôn.
- source_word: τοῦ σπεῖραι
  choice: để gieo
  rationale: Động từ nguyên mẫu có mạo từ ở sở hữu cách sau động từ chuyển động biểu thị mục đích.
- source_word: τὸν σπόρον αὐτοῦ
  choice: hạt giống của mình
  rationale: σπόρος chỉ hạt dùng để gieo; “của mình” quy chiếu tự nhiên về chủ ngữ trong tiếng Việt.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Khi người ấy đang gieo
  rationale: Giữ quan hệ thời gian đồng thời và tránh sự mơ hồ không cần thiết của đại từ tiếng Việt.
- source_word: ὃ μὲν
  choice: một phần hạt
  rationale: Đại từ trung tính số ít với μέν chỉ một phần trong số hạt giống và mở đầu chuỗi phân loại tiếp theo.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: rơi bên đường
  rationale: παρά với đối cách ở đây chỉ vị trí dọc hoặc bên cạnh con đường; “bên đường” ngắn gọn và tự nhiên.
- source_word: κατεπατήθη
  choice: bị giẫm đạp
  rationale: Giữ thể bị động và ý nghĩa bị giẫm dưới chân của καταπατέω.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: chim trời
  rationale: Thành ngữ tiếng Việt tự nhiên, chỉ các loài chim bay trên trời và phản ánh τοῦ οὐρανοῦ.
- source_word: κατέφαγεν αὐτό
  choice: ăn sạch
  rationale: κατεσθίω mang sắc thái ăn hết; “ăn sạch” tự nhiên hơn “nuốt chửng” khi nói về chim ăn hạt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ hình ảnh nông nghiệp cùng nhịp kể của câu Hy Lạp; dùng “người ấy” để quy chiếu rõ người gieo giống. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
