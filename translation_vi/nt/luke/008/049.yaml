  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: vi
  text: 'Khi Đức Chúa Giê-su còn đang nói, có người từ phía người lãnh đạo hội đường đến, nói: “Con gái ông đã chết rồi; đừng làm phiền Thầy nữa.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Khi Đức Chúa Jêsus còn đang nói
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hành động đồng thời; “còn đang” giữ được sắc thái của ἔτι. Dùng tên gọi để làm rõ đại từ trong ngữ cảnh tiếng Việt.
- source_word: ἔρχεταί τις
  choice: có người ... đến
  rationale: Hiện tại lịch sử được chuyển sang lối kể tự nhiên bằng tiếng Việt; τις vẫn mang nghĩa bất định.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: từ nhà của người lãnh đạo hội đường
  rationale: παρά với sở hữu cách chỉ nguồn xuất phát; trong ngữ cảnh, người đưa tin đến từ phía hoặc gia đình của người lãnh đạo hội đường. Thêm “nhà của” giúp câu tiếng Việt tự nhiên nhưng không khẳng định chức vụ của người đưa tin.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Con gái ông đã chết rồi
  rationale: Thì hoàn thành diễn tả cái chết cùng tình trạng hiện tại do nó tạo nên; “đã ... rồi” chuyển tải tự nhiên cả biến cố lẫn kết quả.
- source_word: μηκέτι σκύλλε
  choice: đừng làm phiền ... nữa
  rationale: μηκέτι là sự chấm dứt từ thời điểm này; σκύλλω ở đây có nghĩa làm phiền hoặc gây vất vả. Cách diễn đạt này tự nhiên, trang trọng vừa phải.
- source_word: τὸν διδάσκαλον
  choice: Thầy
  rationale: διδάσκαλος có nghĩa thông thường là người dạy. “Thầy” là danh xưng tự nhiên trong lời nói trực tiếp và không nâng thành một tước hiệu thần học khác.
theological_decisions:
- issue: Cách dịch ἀρχισυνάγωγος liên quan đến Giai-ru
  choice: người lãnh đạo hội đường
  alternative: người quản lý hội đường
  rationale: Đây là chức vụ trong hội đường, không phải tước hiệu thần học. “Người lãnh đạo hội đường” rõ nghĩa trong tiếng Việt hiện đại và tránh liên tưởng đến phẩm trật giáo hội về sau.
- issue: Cách dịch διδάσκαλος
  choice: Thầy
  alternative: Vị Giáo Sư
  rationale: Từ Hy Lạp dùng danh xưng thông thường cho người dạy. “Thầy” vừa tự nhiên trong lời thoại vừa tránh đưa thêm sắc thái Cơ Đốc học không được phát biểu trực tiếp trong mệnh đề.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. Lời báo tin ngắn, trực tiếp, giữ sức nặng của tình huống. Viết hoa “Thầy” như cách xưng gọi trực tiếp dành cho Đức Chúa Jêsus, không biến từ này thành một tước hiệu thần học riêng.
