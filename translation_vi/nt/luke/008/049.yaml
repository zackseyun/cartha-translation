    issue: Thêm cụm “nhà của” trong nguồn gốc người đưa tin.
    rationale: Nguyên ngữ không có từ nào chỉ “nhà”; việc thêm chi tiết này thu hẹp và cụ thể hóa không cần thiết ý nghĩa của παρὰ τοῦ ἀρχισυναγώγου.
  - severity: low
    issue: Chính tả tên riêng “Jêsus” không phải lựa chọn phổ biến của tiếng Việt hiện đại chuẩn.
    rationale: “Giê-su” phù hợp hơn với mục tiêu biến thể tiếng Việt hiện đại, đồng thời không thay đổi ý nghĩa.
