revisions:
- from: Còn hạt rơi trên đá chỉ về những người khi nghe thì vui mừng tiếp nhận lời ấy. Nhưng họ không có rễ; họ tin một thời gian, rồi đến lúc bị thử thách[a] thì lìa bỏ.
  to: Những hạt trên đá là những người khi nghe thì vui mừng tiếp nhận lời ấy. Nhưng họ không có rễ; họ tin một thời gian, rồi khi gặp thử thách[a], họ từ bỏ điều mình đã tin.
  rationale: Bản sửa làm câu văn Việt tự nhiên hơn và làm rõ động từ “lìa bỏ” bằng một bổ ngữ được suy ra trực tiếp từ mệnh đề trước (“họ tin”), không thêm phán đoán về việc đức tin ấy là thật, hời hợt, cứu rỗi hay không. Chú thích tiếp tục bảo tồn phạm vi nghĩa của πειρασμός.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính: những hạt trên đá, sự tiếp nhận lời với niềm vui, không có rễ, tin trong một thời gian, và sự từ bỏ khi gặp πειρασμός. Tuy nhiên, “lìa bỏ” đứng không có bổ ngữ chưa tự nhiên trong tiếng Việt; cần diễn đạt rõ hành động rời bỏ điều đã tin mà không áp đặt cách hiểu hệ phái.'
  naturalness: “Hạt rơi trên đá chỉ về những người” có thể hiểu được, nhưng “Những hạt trên đá là những người” tự nhiên và sát cấu trúc giải nghĩa của dụ ngôn hơn. “Khi gặp thử thách” cũng tự nhiên hơn “đến lúc bị thử thách” và không đổi nghĩa đáng kể.
  terminology: Giữ “lời ấy”, “tin”, và “thử thách” là phù hợp, trung tính và dễ hiểu. “Từ bỏ điều mình đã tin” diễn đạt ἀφίστανται rõ ràng hơn “lìa bỏ”, đồng thời không dùng thuật ngữ kỹ thuật như “bội đạo” hoặc quyết định bản chất của đức tin.
  issues:
