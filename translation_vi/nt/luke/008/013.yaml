    issue: “lìa bỏ” không có bổ ngữ
    rationale: Trong tiếng Việt hiện đại, “lìa bỏ” thường cần nêu điều bị lìa bỏ. Cách dùng tuyệt đối ở đây gây cảm giác câu chưa trọn và làm mờ ý ἀφίστανται là rời bỏ điều họ đã tiếp nhận và tin.
  - severity: low
    issue: Cách mở đầu “hạt rơi trên đá chỉ về những người” hơi gượng
    rationale: Nguyên văn giải nghĩa trực tiếp hình ảnh hạt ở trên đá. “Những hạt trên đá là những người” rõ và tự nhiên hơn, vẫn giữ sự bổ sung “hạt” theo ngữ cảnh dụ ngôn.
