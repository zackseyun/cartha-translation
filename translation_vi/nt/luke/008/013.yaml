id: LUK.8.13
reference: Luke 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: vi
  text: Những hạt trên đá là những người khi nghe thì vui mừng tiếp nhận lời ấy. Nhưng họ không có rễ; họ tin một thời gian, rồi khi gặp thử thách[a], họ từ bỏ điều mình đã tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khi gặp cám dỗ”, “khi gặp thử luyện” hoặc “khi gặp gian nan”. Từ Hy Lạp có thể chỉ sự thử thách, thử luyện hoặc cám dỗ, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: hạt rơi trên đá
  rationale: Giữ hình ảnh cụ thể của ẩn dụ gieo giống; thêm “hạt rơi” theo ngữ cảnh trực tiếp để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: ἀκούσωσιν
  choice: khi nghe
  rationale: Diễn đạt tự nhiên cấu trúc thời gian khái quát với ὅταν và động từ aorist subjunctive.
- source_word: μετὰ χαρᾶς
  choice: vui mừng
  rationale: Truyền đạt trực tiếp sắc thái cảm xúc của cụm giới từ Hy Lạp bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: δέχονται τὸν λόγον
  choice: tiếp nhận lời ấy
  rationale: “Tiếp nhận” phản ánh δέχομαι; “lời ấy” giữ lối nói Kinh Thánh của λόγος đồng thời liên kết rõ với sứ điệp trong ẩn dụ.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: không có rễ
  rationale: Giữ nguyên số ít và hình ảnh ẩn dụ cô đọng của nguyên văn.
- source_word: πρὸς καιρὸν
  choice: một thời gian
  rationale: Diễn tả khoảng thời gian hữu hạn mà không thêm sắc thái coi thường hay phán đoán.
- source_word: πιστεύουσιν
  choice: họ tin
  rationale: Là tương đương trực tiếp, trung tính của πιστεύω và không quyết định bản chất thần học của đức tin được nói đến.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: đến lúc bị thử thách
  rationale: Diễn đạt tự nhiên quan hệ thời gian; “thử thách” giữ nghĩa rộng của πειρασμός, có thể bao gồm thử luyện, gian nan hoặc cám dỗ tùy ngữ cảnh.
- source_word: ἀφίστανται
  choice: lìa bỏ
  rationale: Thể hiện việc rời khỏi điều trước đó họ đã tiếp nhận và tin, nhưng không dùng thuật ngữ thần học kỹ thuật hay thêm một tân ngữ mà nguyên văn không nêu.
theological_decisions:
- issue: πιστεύουσιν có chỉ đức tin cứu rỗi thật hay chỉ niềm tin hời hợt hay không
  choice: Dịch trung tính là “họ tin” và giữ mệnh đề “một thời gian”.
  alternative: “họ dường như tin”, “họ thật sự tin rồi sa ngã”, hoặc “họ tin cách hời hợt”
  rationale: Câu này xác nhận họ tin trong một thời gian rồi lìa bỏ, nhưng không tự giải quyết các tranh luận thần học về sự bền đỗ, bội đạo hay bản chất của đức tin cứu rỗi.
- issue: Phạm vi nghĩa của πειρασμός
  choice: Dùng “thử thách” trong chính văn.
  alternative: “cám dỗ”, “thử luyện”, hoặc “gian nan”
  rationale: πֵιρασμός có thể chỉ sự thử thách từ hoàn cảnh hoặc sự cám dỗ. “Thử thách” giữ được phạm vi nghĩa rộng hơn, còn phương án khác được nêu trong chú thích.
- issue: Mức độ mạnh của ἀφίστανται
  choice: Dịch là “lìa bỏ”.
  alternative: “quay lưng”, “rút lui”, hoặc “bội đạo”
  rationale: “Lìa bỏ” giữ tính nghiêm trọng của hành động mà không biến động từ thành một thuật ngữ giáo lý chuyên biệt hoặc xác định điều nguyên văn để ngầm.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu văn giữ hình ảnh gieo giống và sự căng thẳng thần học của nguyên văn; không giải thích “họ tin” theo một lập trường hệ phái cụ thể.
