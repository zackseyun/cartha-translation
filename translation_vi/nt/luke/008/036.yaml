  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: vi
  text: Những người đã chứng kiến kể lại cho họ biết người đàn ông từng bị quỷ ám đã được cứu[a] như thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã được chữa lành” hoặc “đã được giải thoát.” Động từ Hy Lạp ở đây có thể mang nghĩa cứu, chữa lành hoặc giải thoát, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: kể lại
  rationale: Động từ aorist ἀπαγγέλλω mang nghĩa báo lại hoặc thuật lại. “Kể lại” tự nhiên trong tiếng Việt và phù hợp với lời tường thuật của những người chứng kiến.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ là liên từ nhẹ, chủ yếu nối tiếp diễn biến. Trật tự kể chuyện trong tiếng Việt đã thể hiện sự tiếp nối; thêm “và” hoặc “bấy giờ” ở đây dễ nặng lời hơn nguyên bản.
- source_word: αὐτοῖς
  choice: cho họ biết
  rationale: Đại từ ở cách dữ biểu thị những người nhận lời tường thuật. Cụm “kể lại cho họ biết” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: οἱ ἰδόντες
  choice: những người đã chứng kiến
  rationale: Phân từ có mạo từ chỉ những người đã tận mắt thấy sự việc. “Chứng kiến” diễn đạt rõ vai trò nhân chứng mà không cần thêm tân ngữ không có mặt trong câu Hy Lạp.
- source_word: πῶς
  choice: như thế nào
  rationale: πῶς giới thiệu nội dung lời kể, có thể nhấn vào cách thức hoặc sự việc đã xảy ra. “Như thế nào” giữ được sắc thái ấy.
- source_word: ἐσώθη
  choice: đã được cứu
  rationale: Thể bị động của σῴζω có thể mang nghĩa cứu, chữa lành hoặc giải thoát. “Được cứu” giữ được độ rộng từ vựng và sự cộng hưởng thần học; chú thích nêu các nghĩa phù hợp với ngữ cảnh.
- source_word: ὁ δαιμονισθείς
  choice: người từng bị quỷ ám
  rationale: Phân từ thụ động dùng như danh từ chỉ người đàn ông trước đó ở dưới ảnh hưởng của quỷ. “Từng bị quỷ ám” phản ánh tình trạng đã qua và tránh khiến người đọc hiểu rằng ông vẫn còn bị quỷ ám.
theological_decisions:
- issue: Cách dịch ἐσώθη trong bối cảnh trừ quỷ và phục hồi
  choice: đã được cứu
  alternative: đã được chữa lành; đã được giải thoát
  rationale: σῴζω có trường nghĩa gồm cứu, chữa lành và giải thoát. Bản văn chính dùng “được cứu” để không thu hẹp ý nghĩa vào riêng sự chữa lành thể chất hay sự cứu rỗi thuộc linh; chú thích bảo lưu các cách hiểu đặc biệt thích hợp với ngữ cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu đặt chủ thể chứng kiến lên đầu, giữ diễn tiến tường thuật tự nhiên. “Người từng bị quỷ ám” vừa rõ nghĩa vừa thể hiện rằng tình trạng ấy đã chấm dứt.
