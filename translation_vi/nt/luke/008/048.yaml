  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: vi
  text: 'Nhưng Ngài nói với bà: “Con gái, đức tin của con đã cứu con[a]. Hãy đi bình an.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã làm cho con được lành” hoặc “đã chữa lành con.” Động từ Hy Lạp ở đây có thể chỉ sự chữa lành cũng như sự cứu rỗi.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Con gái
  rationale: Giữ cách xưng hô trực tiếp theo nguyên văn, vừa biểu đạt sự trìu mến vừa tạo sắc thái quan hệ; tự nhiên trong lời nói của một bậc thầy với người phụ nữ trong bối cảnh này.
- source_word: πίστις
  choice: đức tin
  rationale: Giữ thuật ngữ thần học quen thuộc, ở đây chỉ lòng tin cậy của bà nơi Chúa Giê-su; không thu hẹp thành sự trung tín.
- source_word: σέσωκέν
  choice: đã cứu
  rationale: Động từ hoàn thành của σῴζω có thể nói đến cứu thoát, cứu rỗi hoặc chữa lành. “Đã cứu” giữ được trường nghĩa rộng và chiều sâu thần học, còn nghĩa chữa lành rõ trong ngữ cảnh và được nêu ở chú thích.
- source_word: πορεύου
  choice: Hãy đi
  rationale: Cách diễn đạt mệnh lệnh tự nhiên, rõ ràng trong tiếng Việt hiện đại.
- source_word: εἰς εἰρήνην
  choice: bình an
  rationale: Trong kết hợp “Hãy đi bình an”, cách nói này truyền đạt tự nhiên ý ra đi trong tình trạng và phước lành bình an, không máy móc dịch giới từ thành “vào”.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự chuyển ý nhẹ và nét tương phản giữa nỗi sợ của người phụ nữ với lời trấn an của Chúa Giê-su.
theological_decisions:
- issue: Phạm vi ý nghĩa của σῴζω trong bối cảnh chữa lành
  choice: Dịch rộng là “đã cứu con” trong chính văn.
  alternative: “đã làm cho con được lành” hoặc “đã chữa lành con”
  rationale: Bối cảnh trực tiếp nói đến sự chữa lành thân thể, nhưng σῴζω có trường nghĩa rộng hơn và có thể gợi đến sự cứu rỗi. Chính văn bảo tồn sự căng thẳng thần học này; chú thích giúp độc giả nhận ra nghĩa chữa lành.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su và cặp xưng hô “Con gái/con” để giữ sự trìu mến của lời gọi trong nguyên văn.
