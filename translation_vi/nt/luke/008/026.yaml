  source_fidelity: 'Bản dịch truyền đạt đúng trình tự và nội dung của câu: việc đi bằng thuyền đến một địa hạt, tên nhóm cư dân Γερασηνῶν, và vị trí đối diện với Ga-li-lê. “Đi thuyền đến” phản ánh καταπλέω cách tự nhiên mà không áp đặt sắc thái hướng ‘xuống’.'
