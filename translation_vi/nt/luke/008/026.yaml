source:
  edition: SBLGNT
  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: vi
  text: Rồi họ đi thuyền đến vùng của người Ghê-ra-sê[a], nằm đối diện Ga-li-lê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản và các đoạn song song trong các sách Tin Mừng chép “người Ga-đa-ra” hoặc “người Ghê-ghê-sa”.
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: đi thuyền đến
  rationale: Động từ καταπλέω chỉ việc đi bằng đường thủy và đến một nơi. “Đi thuyền đến” tự nhiên trong tiếng Việt và không ép sắc thái hướng xuống vốn không cần thiết trong ngữ cảnh này.
- source_word: χώραν
  choice: miền
  rationale: χώρα ở đây chỉ một khu vực hay địa phận, không phải một quốc gia hiện đại; “miền” vừa gọn vừa tự nhiên.
- source_word: Γερασηνῶν
  choice: người Ghê-ra-sê
  rationale: Dạng sở hữu số nhiều chỉ cư dân vùng Ghê-ra-sê; cách phiên âm này giữ tên riêng và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἥτις
  choice: nằm
  rationale: Đại từ quan hệ mở đầu mệnh đề mô tả miền vừa nói. Tiếng Việt tự nhiên có thể nối trực tiếp bằng “nằm” mà vẫn giữ đúng quan hệ bổ nghĩa.
- source_word: ἀντιπέρα
  choice: đối diện
  rationale: ἀντιπέρα có nghĩa ở phía đối diện hoặc bên kia; “đối diện” chính xác, ngắn gọn và giữ góc nhìn địa lý của câu.
- source_word: Γαλιλαίας
  choice: Ga-li-lê
  rationale: Phiên âm tên địa danh theo cách quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Dị bản tên địa danh và khác biệt địa lý trong truyền thống Tin Mừng Nhất Lãm
  choice: Ghê-ra-sê
  alternative: Ga-đa-ra hoặc Ghê-ghê-sa
  rationale: Bản SBLGNT tại đây đọc Γερασηνῶν, nên chính văn theo “Ghê-ra-sê”. Các tên khác được giữ trong chú thích để minh bạch về dị bản, thay vì hòa hợp với các phân đoạn song song.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Rồi” chuyển tiếp mạch kể; “đi thuyền đến” tự nhiên hơn việc cố tái hiện tiền tố κατά bằng một từ chỉ hướng. Dấu chú thích [a] được đặt ngay sau tên có dị bản.
