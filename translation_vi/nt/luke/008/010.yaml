reference: Luke 8:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: vi
  text: 'Ngài phán: “Anh em đã được ban cho để biết các mầu nhiệm[a] của vương quốc Đức Chúa Trời; còn những người khác thì qua các dụ ngôn, để họ nhìn mà không thấy, nghe mà không hiểu.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những điều kín giấu”. Từ Hy Lạp chỉ những chân lý về vương quốc Đức Chúa Trời vốn bị che khuất đối với một số người nhưng được bày tỏ cho những người khác.
    reason: lexical_alternative
  - marker: b
    text: Cụm “nhìn mà không thấy, nghe mà không hiểu” gợi lại Ê-sai 6:9–10. Mệnh đề này có thể diễn tả mục đích của Đức Chúa Trời, kết quả mang tính phán xét, hoặc cả hai.
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: đã được ban cho
  rationale: 'Giữ thể hoàn thành bị động: một ân ban đã xảy ra và kết quả vẫn còn; đồng thời không nói rõ chủ thể ban, như nguyên văn.'
- source_word: γνῶναι
  choice: sự hiểu biết
  rationale: Trong cấu trúc tiếng Việt, cách danh từ hóa này diễn đạt tự nhiên điều được ban là biết các mầu nhiệm, đồng thời vẫn phân biệt với συνιῶσιν ở cuối câu là “hiểu”.
- source_word: μυστήρια
  choice: các mầu nhiệm
  rationale: Giữ nghĩa Kinh Thánh về những chân lý thuộc chương trình của Đức Chúa Trời vốn kín giấu nhưng được bày tỏ, thay vì chỉ mang nghĩa thông tin bí mật.
- source_word: βασιλείας τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách diễn đạt quen thuộc, có thể bao hàm cả quyền trị vì lẫn phạm vi trị vì của Đức Chúa Trời.
- source_word: τοῖς δὲ λοιποῖς
  choice: còn những người khác
  rationale: Diễn đạt tự nhiên λοιποί là những người còn lại; không nhập cách nói “những người ở ngoài” từ đoạn song song trong Mác.
- source_word: ἐν παραβολαῖς
  choice: chỉ được nghe bằng các ẩn dụ
  rationale: Bổ sung tối thiểu thành phần hàm ẩn để câu tiếng Việt hoàn chỉnh và cho thấy ẩn dụ là hình thức truyền đạt; “chỉ” thể hiện sự tương phản với việc được ban cho biết, nhưng không thêm nội dung giải thích các ẩn dụ.
- source_word: ἵνα
  choice: để
  rationale: Giữ nguyên sức căng mục đích/kết quả của ἵνα, không làm nhẹ thành một quan hệ thuần mô tả.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: họ nhìn mà không thấy
  rationale: Giữ sự lặp từ của nguyên văn trong lối nói tự nhiên của tiếng Việt, đồng thời không giải nghĩa βλέπω lần thứ hai thành “nhận biết”.
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: nghe mà không hiểu
  rationale: Phân biệt hành động nghe với sự lĩnh hội được diễn tả bởi συνίημι.
theological_decisions:
- issue: Sắc thái của mệnh đề ἵνα trong lời gợi nhắc Ê-sai 6
  choice: dịch là “để”
  alternative: “kết quả là” hoặc cách dịch làm nhẹ thành quan hệ thuần mô tả
  rationale: “Để” bảo toàn khả năng mệnh đề nói đến mục đích phán xét, kết quả mang tính phán xét, hoặc cả hai, thay vì quyết định thay cho độc giả.
- issue: Ý nghĩa của μυστήρια
  choice: “các mầu nhiệm” kèm chú thích
  alternative: “các điều bí mật”
  rationale: “Mầu nhiệm” giữ chiều kích mặc khải của những chân lý về vương quốc Đức Chúa Trời mà con người chỉ biết khi được ban cho, nhưng chú thích nêu phương án dễ hiểu hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Ngài” cho Chúa Giê-su theo ngữ cảnh, “anh em” cho số nhiều ὑμῖν, và giữ nhịp đối xứng “nhìn mà không thấy, nghe mà không hiểu”. Thuật ngữ “ẩn dụ” được chọn cho παραβολαί theo nghĩa các câu chuyện/hình ảnh so sánh dùng để dạy dỗ.
