revisions:
- from: 'Ngài phán: “Anh em đã được ban cho sự hiểu biết về các mầu nhiệm[a] của vương quốc Đức Chúa Trời; còn những người khác thì chỉ được nghe bằng các ẩn dụ, để họ nhìn mà không thấy, nghe mà không hiểu.”[b]'
  to: 'Ngài phán: “Anh em đã được ban cho để biết các mầu nhiệm[a] của vương quốc Đức Chúa Trời; còn những người khác thì qua các dụ ngôn, để họ nhìn mà không thấy, nghe mà không hiểu.”[b]'
  rationale: Sửa “sự hiểu biết về” thành “để biết” để phản ánh trực tiếp γνῶναι; thay “chỉ được nghe bằng các ẩn dụ” bằng “qua các dụ ngôn” để không thêm ý “chỉ” hoặc “nghe” và dùng thuật ngữ chuẩn cho παραβολαί. Chú thích b được điều chỉnh để bảo toàn sự mơ hồ có chủ ý của mệnh đề ἵνα, không áp đặt một cách hiểu giáo lý.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ đúng cấu trúc đối lập, thể bị động hoàn thành của δέδοται, thuật ngữ “mầu nhiệm,” và lực căng của ἵνα qua “để.” Tuy nhiên, “chỉ được nghe bằng các ẩn dụ” thêm các ý “chỉ” và “nghe” không có trong tiếng Hy Lạp, đồng thời “ẩn dụ” không phải thuật ngữ thích hợp nhất cho παραβολαί trong ngữ cảnh này.
  naturalness: Câu sửa dùng “đã được ban cho để biết” tự nhiên hơn “đã được ban cho sự hiểu biết về,” vì γνῶναι trực tiếp là “biết.” “Còn những người khác thì qua các dụ ngôn” duy trì tính cô đọng của vế lược động từ trong nguyên văn mà vẫn dễ hiểu trong tiếng Việt hiện đại.
  terminology: “Dụ ngôn” là thuật ngữ Kinh Thánh chính xác và thông dụng hơn “ẩn dụ” cho παραβολαί. “Mầu nhiệm” và “vương quốc Đức Chúa Trời” có thể giữ nguyên. Chú thích về Ê-sai cần tránh diễn giải quá mức thành “mục đích của sự phán xét từ Đức Chúa Trời”; nguyên văn chỉ giữ mở quan hệ mục đích/kết quả mang tính phán xét.
  issues:
  - severity: medium
    issue: “chỉ được nghe bằng các ẩn dụ” thêm nội dung và dùng thuật ngữ chưa chính xác.
    rationale: ἐν παραβολαῖς chỉ nêu phương thức “bằng/trong các dụ ngôn”; từ “chỉ” và động từ “nghe” không được nêu trong câu Hy Lạp. παραβολαί trong truyền thống Phúc Âm nên dịch là “dụ ngôn,” không phải “ẩn dụ.”
  - severity: low
    issue: “sự hiểu biết về các mầu nhiệm” làm yếu cấu trúc “được ban cho để biết các mầu nhiệm.”
    rationale: γνῶναι là động từ nguyên mẫu “để biết,” và “hiểu biết về” có thể chuyển trọng tâm sang tri thức về các mầu nhiệm thay vì sự nhận biết các mầu nhiệm.
  - severity: medium
    issue: Chú thích b diễn giải ἵνα như “mục đích của sự phán xét từ Đức Chúa Trời.”
    rationale: 'Cách nói này đưa “sự phán xét” vào như đối tượng xác định của mục đích. Nên giữ cách diễn đạt mở hơn: mục đích của Đức Chúa Trời, kết quả mang tính phán xét, hoặc cả hai.'
