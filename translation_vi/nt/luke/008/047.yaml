revisions:
- from: Khi người phụ nữ thấy rằng mình không thể giấu được[a], bà run rẩy bước đến, sấp mình trước mặt Ngài[b], rồi trước toàn thể dân chúng, bà thuật lại lý do mình đã chạm vào Ngài và việc bà được chữa lành ngay tức khắc như thế nào.
  to: Khi người phụ nữ thấy rằng mình không còn che giấu được nữa[a], bà run rẩy đến, sấp mình trước mặt Ngài[b], rồi thuật lại trước toàn thể dân chúng lý do bà đã chạm vào Ngài và bà đã được chữa lành ngay tức khắc như thế nào.
  rationale: 'Sửa cách diễn đạt của οὐκ ἔλαθεν để nêu rõ hành động của người phụ nữ đã không còn kín giấu, đồng thời chỉnh nhịp câu cho tự nhiên hơn. Bản sửa vẫn giữ nguyên sự dè dặt của nguồn: không thêm người phát hiện, không thêm “dưới chân,” và không diễn giải hành động này là ăn năn hay thờ phượng.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: người phụ nữ nhận ra việc mình không còn kín giấu, run rẩy đến, phủ phục trước Chúa Giê-su, và công khai kể lý do đã chạm vào Ngài cùng sự chữa lành tức khắc. Tuy nhiên, “không thể giấu được” dễ diễn tả một năng lực bất thành ở hiện tại hơn là nhận ra rằng hành động của bà đã không còn kín giấu. “Bà không còn che giấu được nữa” phản ánh sát hơn οὐκ ἔλαθεν mà vẫn không xác định người đã nhận ra bà là ai.'
  naturalness: Câu nháp hơi nặng vì lặp “bà” và đặt cụm “rồi trước toàn thể dân chúng” chen giữa câu. Tái cấu trúc thành “bà thuật lại trước toàn thể dân chúng...” tự nhiên và rõ quan hệ cú pháp hơn. “Bước đến” không sai, nhưng “đến” sát ἦλθεν hơn và không thêm sắc thái cách đi.
  terminology: '“Ngài,” “sấp mình trước mặt Ngài,” “thuật lại,” “chạm vào,” và “được chữa lành ngay tức khắc” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. Không có diễn giải giáo phái. Các chú thích giữ đúng điểm mơ hồ: λανθάνω và tư thế προσπεσοῦσα không nêu rõ “dưới chân.”'
  issues:
  - severity: medium
    issue: “mình không thể giấu được” chưa diễn đạt rõ việc bà nhận ra hành động của mình đã không còn kín giấu.
    rationale: οὐκ ἔλαθεν là quá khứ, nghĩa là điều ấy không thoát khỏi sự chú ý/không còn ẩn giấu. Cách sửa tránh chuyển trọng tâm thành sự bất lực hiện tại trong việc che giấu.
  - severity: low
    issue: Cấu trúc “rồi trước toàn thể dân chúng, bà thuật lại” hơi gãy và “bước đến” thêm nhẹ sắc thái không có trong ἦλθεν.
    rationale: Đưa trạng ngữ công khai sát động từ “thuật lại” và dùng “đến” làm câu Việt trôi chảy, đồng thời bám sát nguồn hơn.
  revised_text: Khi người phụ nữ thấy rằng mình không còn che giấu được nữa[a], bà run rẩy đến, sấp mình trước mặt Ngài[b], rồi thuật lại trước toàn thể dân chúng lý do bà đã chạm vào Ngài và bà đã được chữa lành ngay tức khắc như thế nào.
