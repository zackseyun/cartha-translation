id: LUK.8.47
reference: Luke 8:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: vi
  text: Khi người phụ nữ thấy rằng mình không còn che giấu được nữa[a], bà run rẩy đến, sấp mình trước mặt Ngài[b], rồi thuật lại trước toàn thể dân chúng lý do bà đã chạm vào Ngài và bà đã được chữa lành ngay tức khắc như thế nào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mình đã không thoát khỏi sự chú ý” hoặc “việc mình làm không còn kín giấu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngã xuống trước mặt Ngài.” Tiếng Hy Lạp không nói rõ “dưới chân Ngài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: Khi ... thấy
  rationale: Phân từ bất định diễn tả hoàn cảnh dẫn đến hành động chính; cách dịch này tự nhiên và giữ sắc thái thời gian.
- source_word: οὐκ ἔλαθεν
  choice: mình không thể giấu được
  rationale: Trong ngữ cảnh, λανθάνω nói đến việc không thoát khỏi sự chú ý, tức hành động của bà không còn kín giấu; cách diễn đạt tiếng Việt này tự nhiên mà không xác định quá mức ai là người phát hiện.
- source_word: τρέμουσα
  choice: run rẩy
  rationale: Giữ hình ảnh cụ thể về trạng thái thể chất và cảm xúc của người phụ nữ, không giản lược thành chỉ 'sợ hãi'.
- source_word: προσπεσοῦσα αὐτῷ
  choice: sấp mình trước mặt Ngài
  rationale: Diễn đạt tư thế ngã/sấp xuống trước một người trong sự khẩn cầu hoặc kính sợ, nhưng không thêm 'dưới chân' vốn không được nói rõ trong tiếng Hy Lạp.
- source_word: δι’ ἣν αἰτίαν
  choice: lý do
  rationale: Truyền đạt trực tiếp ý 'vì nguyên do nào' bằng tiếng Việt hiện đại, rõ ràng.
- source_word: ἥψατο αὐτοῦ
  choice: mình đã chạm vào Ngài
  rationale: ἅπτομαι với sở hữu cách mang nghĩa 'chạm vào'; 'đã' thể hiện hành động xảy ra trước lời thuật lại.
- source_word: ἀπήγγειλεν
  choice: thuật lại
  rationale: Động từ chỉ việc báo lại hoặc kể rõ; 'thuật lại' phù hợp với lời trình bày công khai mà không tăng sắc thái thành một tuyên cáo long trọng.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: trước toàn thể dân chúng
  rationale: Giữ nghĩa công khai, trong sự hiện diện của tất cả những người đang tụ họp.
- source_word: ὡς ἰάθη
  choice: việc bà được chữa lành ... như thế nào
  rationale: Giữ được sắc thái ὡς có thể giới thiệu cách thức hoặc sự việc được kể lại, thay vì chỉ chuyển thành mệnh đề 'rằng'.
- source_word: παραχρῆμα
  choice: ngay tức khắc
  rationale: Diễn đạt rõ sự chữa lành xảy ra lập tức, phù hợp với điểm nhấn của Lu-ca.
theological_decisions:
- issue: Tính chất của hành động và lời trình bày công khai của người phụ nữ
  choice: Mô tả bà run rẩy, sấp mình và thuật lại sự việc, không gọi hành động ấy là thờ phượng hay ăn năn.
  alternative: Diễn giải rằng bà công khai xưng tội hoặc thờ phượng Chúa Giê-su.
  rationale: Câu Hy Lạp mô tả tư thế và lời thuật lại công khai nhưng không dùng từ ngữ minh nhiên chỉ sự ăn năn hay thờ phượng; bản dịch giữ nguyên độ mở thần học của trình thuật.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “bà” cho người phụ nữ và viết hoa “Ngài” khi chỉ Chúa Giê-su để lời văn tự nhiên, tôn kính; không thêm thuật ngữ giáo phái hay diễn giải tín lý.
