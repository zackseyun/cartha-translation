    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngã xuống trước mặt Ngài.” Tiếng Hy Lạp không nói rõ “dưới chân Ngài.”'
    reason: lexical_alternative
  revision_rationale: 'Sửa cách diễn đạt của οὐκ ἔλαθεν để nêu rõ hành động của người phụ nữ đã không còn kín giấu, đồng thời chỉnh nhịp câu cho tự nhiên hơn. Bản sửa vẫn giữ nguyên sự dè dặt của nguồn: không thêm người phát hiện, không thêm “dưới chân,” và không diễn giải hành động này là ăn năn hay thờ phượng.'
