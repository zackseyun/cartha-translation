  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: vi
  text: 'Có người báo cho Đức Chúa Giê-su: “Mẹ và các anh em của Thầy[a] đang đứng ở ngoài, muốn thấy Thầy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người bà con của Thầy,” nếu hiểu từ Hy Lạp theo nghĩa rộng hơn trong ngữ cảnh; từ này thông thường có nghĩa là “các anh em trai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: Có người báo
  rationale: Động từ aorist bị động cho biết tin được báo đến; tiếng Việt tự nhiên thường chuyển bị động phiếm chỉ thành chủ động với chủ thể bất định “có người”.
- source_word: δὲ
  choice: lược dịch
  rationale: δέ là liên từ nhẹ tiếp nối trình thuật; trong câu tiếng Việt này không cần biểu thị riêng mà mạch kể vẫn rõ và tự nhiên.
- source_word: αὐτῷ
  choice: cho Đức Chúa Jêsus
  rationale: Đại từ chỉ Đức Chúa Jêsus được nêu rõ để câu đứng độc lập dễ hiểu, đồng thời giữ vai trò đối tượng tiếp nhận lời báo.
- source_word: μήτηρ σου
  choice: Mẹ ... của Thầy
  rationale: “Mẹ” là cách gọi phổ thông, trang trọng vừa phải; đại từ sở hữu được diễn đạt tự nhiên qua cấu trúc “Mẹ ... của Thầy”.
- source_word: ἀδελφοί σου
  choice: các anh em của Thầy
  rationale: ἀδελφοί là danh từ số nhiều giống đực, nghĩa thông thường là các anh/em trai; “các anh em” bảo toàn nghĩa từ vựng mà không quyết định thêm bản chất quan hệ gia đình.
- source_word: ἑστήκασιν
  choice: đang đứng
  rationale: Thể hoàn thành có sức chỉ trạng thái hiện tại; “đang đứng” diễn đạt trạng thái ấy tự nhiên trong tiếng Việt.
- source_word: ἔξω
  choice: ở ngoài
  rationale: Giữ nguyên ý không gian mà không thêm địa điểm cụ thể vốn không có trong bản Hy Lạp.
- source_word: ἰδεῖν ... θέλοντες
  choice: muốn gặp
  rationale: Theo ngữ cảnh người thân đến tìm một người, “gặp” diễn đạt tự nhiên mục đích của ἰδεῖν; tuy nhiên nghĩa sát chữ là “thấy” được ghi nhận trong chú thích quyết định.
theological_decisions:
- issue: Quan hệ của ἀδελφοί với Đức Chúa Jêsus
  choice: Dịch “các anh em” mà không mở rộng diễn giải
  alternative: bà con; họ hàng; anh chị em
  rationale: Câu này dùng từ Hy Lạp thông thường chỉ anh/em trai. Bản dịch không áp đặt cách giải thích giáo phái về quan hệ huyết thống hay họ hàng.
- issue: Sắc thái của ἰδεῖν
  choice: Dịch “gặp” theo cách nói tự nhiên trong ngữ cảnh
  alternative: thấy
  rationale: “Gặp” phù hợp ngữ dụng khi người thân đứng ngoài muốn được tiếp xúc với Đức Chúa Jêsus, nhưng không thêm mục đích như nói chuyện hay đưa Ngài đi.
translation_notes:
  register: Văn phong kể chuyện hiện đại, sáng rõ và trang trọng vừa phải. Dùng “Thầy” trong lời báo trực tiếp để phù hợp cách xưng hô với Đức Chúa Jêsus. Dùng danh xưng “Đức Chúa Jêsus” theo quy ước Kinh Thánh Tin Lành tiếng Việt, nhưng không đưa thêm nội dung thần học vào câu.
