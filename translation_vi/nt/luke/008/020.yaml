revisions:
- from: 'Có người báo cho Đức Chúa Jêsus: “Mẹ và các anh em của Thầy[a] đang đứng ở ngoài, muốn gặp Thầy.”'
  to: 'Có người báo cho Đức Chúa Giê-su: “Mẹ và các anh em của Thầy[a] đang đứng ở ngoài, muốn thấy Thầy.”'
  rationale: Bản sửa chỉ chuẩn hóa tên riêng theo tiếng Việt hiện đại và thay “muốn gặp” bằng “muốn thấy” để phản ánh trực tiếp ἰδεῖν. Giữ “Có người báo cho” như một cách diễn đạt tiếng Việt tự nhiên cho động từ aorist bị động, giữ “đang đứng ở ngoài” cho trạng thái hiện tại của thể hoàn thành, và giữ chú thích để nêu khả năng nghĩa rộng của ἀδελφοί mà không áp đặt lập trường giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng phần lớn nội dung: một tin được báo đến Đức Chúa Jêsus, mẹ và các anh em đứng bên ngoài. Tuy nhiên, ἰδεῖν có nghĩa cơ bản là “thấy”; “muốn gặp” là cách hiểu theo ngữ cảnh nhưng mở rộng nhẹ nghĩa từ vựng. Có thể dịch “muốn thấy Thầy” mà vẫn rõ nghĩa và sát nguồn hơn.'
  naturalness: Câu văn nhìn chung tự nhiên. “Có người báo cho” là cách chuyển bị động phiếm chỉ hợp tiếng Việt. “Muốn thấy Thầy” ít thông dụng hơn “muốn gặp Thầy” trong hội thoại hiện đại, nhưng vẫn tự nhiên, rõ ràng, và thích hợp với bản dịch tối ưu tương đương.
  terminology: Nên chuẩn hóa cách viết tên riêng theo tiếng Việt hiện đại là “Đức Chúa Giê-su” thay vì dạng “Jêsus”. “Các anh em” cùng chú thích từ vựng giữ được tính không quyết đoán về quan hệ gia đình; không nên đổi thành “bà con” trong thân bài.
  issues:
  - severity: medium
    issue: “muốn gặp Thầy” diễn giải ἰδεῖν rộng hơn nghĩa cơ bản.
    rationale: ἰδεῖν là “thấy/to see”. Trong bối cảnh, “gặp” có thể hiểu được, nhưng bản nguồn và audit trail chủ ý giữ “see”; “muốn thấy Thầy” bảo toàn nghĩa này mà không thêm sắc thái cuộc gặp gỡ.
  - severity: low
    issue: Chính tả tên riêng “Jêsus” không theo chuẩn tiếng Việt hiện đại.
    rationale: Với biến thể tiếng Việt hiện đại tiêu chuẩn, “Giê-su” là dạng chính tả phổ biến và chuẩn hóa hơn. Việc thay đổi này không tác động nội dung hay danh xưng thần học.
