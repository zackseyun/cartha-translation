    issue: Chú thích c xác định không đúng phần có dị bản.
    rationale: SBLGNT đặt trong ngoặc cụm ἰατροῖς προσαναλώσασα ὅλον τὸν βίον (“đã tiêu hết toàn bộ sinh kế cho các thầy thuốc”). Mệnh đề οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι (“không thể được ai chữa lành”) vẫn thuộc bản văn SBLGNT; vì vậy không nên nói các thủ bản lược bỏ phần này.
  - severity: low
    issue: Cụm “mọi phương tiện sinh sống” hơi trừu tượng sau động từ “tiêu hết”.
    rationale: βίος ở đây nói đến tiền của/nguồn lực để sinh sống. “Toàn bộ tiền của để sinh sống” giữ đúng nghĩa và trôi chảy hơn trong tiếng Việt hiện đại.
