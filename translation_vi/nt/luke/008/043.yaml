  verdict: revise
  source_fidelity: 'Bản dịch chuyển tải đúng các ý chính của SBLGNT: người phụ nữ bị chảy máu trong mười hai năm, đã tiêu hết nguồn lực sinh sống cho thầy thuốc, và không thể được bất cứ ai chữa lành. Tuy nhiên, chú thích c mô tả sai trọng tâm dị bản: cụm được đặt trong ngoặc của SBLGNT là cụm nói bà đã tiêu hết sinh kế cho các thầy thuốc, chứ không phải mệnh đề bà không thể được chữa lành.'
  naturalness: Văn phong hiện đại, rõ ràng và phù hợp văn kể chuyện. “Bị xuất huyết” là cách nói trang trọng, đủ khái quát và không xác định quá mức nguyên nhân hay loại chảy máu. “Tiêu hết mọi phương tiện sinh sống” có thể hiểu được, nhưng “toàn bộ tiền của để sinh sống” tự nhiên và cụ thể hơn trong ngữ cảnh tiêu tiền cho thầy thuốc.
  terminology: “Thầy thuốc” phù hợp bối cảnh cổ đại. “Chữa lành” diễn đạt θεραπευθῆναι tự nhiên trong văn bản Kinh Thánh mà không thêm diễn giải. Không cần dùng “rong huyết” trong bản văn vì từ này thu hẹp tình trạng hơn nguyên ngữ.
  issues:
