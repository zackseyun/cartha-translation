  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: vi
  text: Có một người phụ nữ bị xuất huyết đã mười hai năm[a]. Bà đã tiêu hết toàn bộ tiền của để sinh sống của mình cho các thầy thuốc[b], nhưng không ai có thể chữa lành cho bà[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị chứng chảy máu” hoặc “bị rong huyết.”'
    reason: lexical_alternative
  - marker: b
    text: Từ Hy Lạp βίος ở đây chỉ tiền của hoặc phương tiện sinh sống của bà, không phải “cả cuộc đời” theo nghĩa sinh học.
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản không có cụm “đã tiêu hết toàn bộ tiền của để sinh sống của mình cho các thầy thuốc.” Bản dịch này theo SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: Có một người phụ nữ
  rationale: Dùng cách dẫn nhập tự nhiên trong văn kể chuyện tiếng Việt để đưa nhân vật vào bối cảnh; phân từ οὖσα được thể hiện qua mệnh đề mô tả tiếp theo.
- source_word: ἐν ῥύσει αἵματος
  choice: bị xuất huyết
  rationale: Diễn đạt tự nhiên, trang trọng và rõ nghĩa về tình trạng chảy máu kéo dài, không suy đoán nguyên nhân cụ thể.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: đã mười hai năm
  rationale: Thể hiện đúng ý nghĩa khoảng thời gian kéo dài đến thời điểm câu chuyện.
- source_word: ἰατροῖς προσαναλώσασα
  choice: đã tiêu ... cho các thầy thuốc
  rationale: Giữ quan hệ giữa việc dùng hết tài sản và những người chữa trị, đồng thời dùng cách nói dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὅλον τὸν βίον
  choice: hết mọi phương tiện sinh sống
  rationale: βίος ở đây chỉ tài sản hoặc nguồn lực để sinh sống, không phải toàn bộ đời sống sinh học.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: không ai có thể chữa lành cho bà
  rationale: Chuyển cấu trúc bị động và phủ định kép của tiếng Hy Lạp sang câu chủ động tự nhiên, vẫn giữ ý rằng bà không thể được bất cứ ai chữa lành.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. “Xuất huyết” giữ tính cụ thể mà không xác định quá mức loại bệnh; “thầy thuốc” phù hợp bối cảnh cổ đại. Câu được tách làm hai để tiếng Việt tự nhiên, dù nguyên văn tiếp tục sang câu kế.
