language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: vi
  text: 'Còn hạt giống rơi vào bụi gai: đó là những người đã nghe, nhưng khi họ tiếp tục bước đi trên đường đi, họ bị những nỗi lo toan[a], sự giàu sang và thú vui của cuộc sống bóp nghẹt, và không sinh trái đến chỗ chín muồi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những mối bận tâm”, “những nỗi lo lắng” hoặc “những âu lo”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “không sinh được trái chín” hoặc “không đưa việc sinh trái đến chỗ hoàn tất”.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: hạt giống rơi giữa bụi gai
  rationale: Danh từ hóa ở giống trung chỉ điều đã rơi và trong ngữ cảnh rõ ràng quy chiếu về hạt giống. Tiếng Việt cần nêu “hạt giống” để câu tự nhiên; “giữa bụi gai” giữ nguyên hình ảnh nông nghiệp.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: chỉ về những người đã nghe
  rationale: Cách diễn đạt này tự nhiên trong phần giải nghĩa dụ ngôn và giữ sắc thái hành động nghe đã xảy ra mà không tự ý thêm tân ngữ.
- source_word: μεριμνῶν
  choice: những nỗi lo toan
  rationale: Từ này có thể chỉ những mối bận tâm, lo lắng hoặc âu lo; “nỗi lo toan” là cách nói thông dụng, bao quát và hợp với văn cảnh đời sống.
- source_word: πλούτου
  choice: sự giàu sang
  rationale: Giữ ý về của cải và tình trạng giàu có mà không thêm phán đoán đạo đức ngoài câu.
- source_word: ἡδονῶν τοῦ βίου
  choice: thú vui của cuộc sống
  rationale: βίος ở đây chỉ đời sống trần thế, còn ἡδοναί là các thú vui; cách dịch giữ quan hệ sở hữu và không thu hẹp loại thú vui được nói đến.
- source_word: πορευόμενοι
  choice: khi tiếp tục bước đi
  rationale: Giữ sắc thái tiến trình đang diễn ra của phân từ hiện tại, đồng thời tránh diễn giải quá mức thành một học thuyết hay mô tả toàn bộ “đường đời”.
- source_word: συμπνίγονται
  choice: bị ... bóp nghẹt
  rationale: Giữ thể bị động và hình ảnh cây bị gai chen lấn, bóp nghẹt.
- source_word: οὐ τελεσφοροῦσιν
  choice: không sinh trái đến độ chín muồi
  rationale: Giữ cả hình ảnh sinh trái lẫn ý trái không đạt đến sự hoàn tất hoặc trưởng thành.
theological_decisions:
- issue: Bản chất sự thất bại của những người nghe được ví như đất có gai
  choice: Giữ nguyên hình ảnh họ bị bóp nghẹt và không sinh trái đến độ chín muồi, không xác định tình trạng cứu rỗi của họ.
  alternative: Có thể diễn giải họ là người chưa bao giờ thật sự tin, là tín hữu trở nên không kết quả, hoặc là người đã khởi đầu rồi sa ngã.
  rationale: Câu này mô tả tác động của lo toan, giàu sang và thú vui nhưng không trực tiếp giải quyết các tranh luận thần học về sự tái sinh, bội đạo hay phần thưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ hình ảnh nông nghiệp xuyên suốt; các cụm “sự giàu sang” và “thú vui của cuộc sống” tránh sắc thái cổ hoặc giáo phái.
