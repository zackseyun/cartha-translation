    reason: Bảo lưu phạm vi nghĩa của κράσπεδον, vốn có thể chỉ tua, mép hay gấu của áo.
  revision_rationale: Chỉ sửa nhẹ cụm mở đầu để phản ánh rõ hơn động từ “đến gần/tiến đến” trong tiếng Hy Lạp và đối tượng được ngầm hiểu trong ngữ cảnh. Giữ nguyên cách dịch “tua áo” cùng chú thích các nghĩa thay thế, không xác định quá mức vật được nói đến.
