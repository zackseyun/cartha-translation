  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: vi
  text: Bà đến gần Ngài từ phía sau, chạm vào tua áo của Ngài; lập tức dòng máu của bà ngừng chảy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: đến từ phía sau
  rationale: Diễn đạt tự nhiên hành động bà tiến đến Chúa Giê-su từ phía sau; phân từ bất định chỉ hành động đi trước động từ chính.
- source_word: ἥψατο
  choice: chạm vào
  rationale: Trong cấu trúc này, động từ mang nghĩa thông thường là chạm vào, không nhất thiết hàm ý nắm lấy.
- source_word: τοῦ κρασπέδου
  choice: tua áo
  rationale: κράσπεδον có thể chỉ mép, gấu hoặc tua áo. “Tua áo” phù hợp với bối cảnh y phục Do Thái nhưng không khẳng định quá mức một dạng tua cụ thể; các khả năng khác được giữ trong chú thích.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: áo của Ngài
  rationale: ἱμάτιον chỉ áo ngoài hoặc y phục; “áo” tự nhiên, dễ hiểu và không đặc định kiểu áo.
- source_word: παραχρῆμα
  choice: lập tức
  rationale: Giữ rõ ý hiệu quả xảy ra ngay tức khắc.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: dòng máu của bà ngừng chảy
  rationale: Diễn đạt sát hình ảnh dòng máu đang chảy rồi dừng lại, đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Sắc thái y phục Do Thái có thể có trong κράσπεδον
  choice: Dùng “tua áo” trong chính văn
  alternative: mép áo; gấu áo
  rationale: Từ Hy Lạp có thể chỉ phần mép/gấu nói chung hoặc tua áo gắn với y phục Do Thái. Chính câu này không buộc phải xác định chính xác hình dạng, nên chú thích bảo lưu các nghĩa khả dĩ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “Ngài” được dùng cho Chúa Giê-su theo lối tôn kính phổ biến; dấu chấm phẩy giúp giữ quan hệ chặt giữa hành động chạm và kết quả tức thì.
