    issue: “đến từ phía sau” chưa diễn đạt rõ nét nghĩa tiếp cận của προσελθοῦσα.
    rationale: προσελθοῦσα là “đến gần/tiến đến”; ὄπισθεν xác định vị trí từ phía sau. “Bà đến gần Ngài từ phía sau” giữ cả chuyển động tiếp cận lẫn vị trí một cách rõ ràng hơn.
  revised_text: Bà đến gần Ngài từ phía sau, chạm vào tua áo của Ngài; lập tức dòng máu của bà ngừng chảy.
  revised_footnotes:
