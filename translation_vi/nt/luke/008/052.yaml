  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: vi
  text: 'Mọi người đều đang khóc lóc và than khóc cô bé. Nhưng Người nói: “Đừng khóc, vì cô bé không chết, nhưng đang ngủ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ngủ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: đang khóc
  rationale: Thì vị hoàn biểu thị hành động đang tiếp diễn; cách dịch này giữ sắc thái kéo dài một cách tự nhiên trong tiếng Việt.
- source_word: πάντες
  choice: mọi người đều
  rationale: Giữ rõ phạm vi bao quát của πάντες và phù hợp văn phong tiếng Việt hiện đại.
- source_word: ἐκόπτοντο αὐτήν
  choice: than khóc cho cô bé
  rationale: Trong bối cảnh tang chế, κόπτομαι chỉ sự than khóc, có thể bao hàm cử chỉ đấm ngực; bản dịch truyền đạt ý chính mà không cụ thể hóa quá mức cử chỉ.
- source_word: Μὴ κλαίετε
  choice: Đừng khóc!
  rationale: Mệnh lệnh hiện tại với μή có thể hàm ý chấm dứt hành động đang diễn ra; “Đừng khóc” vừa tự nhiên vừa không diễn giải quá mức.
- source_word: οὐ γὰρ
  choice: không ... đâu
  rationale: γάρ đưa ra lý do cho mệnh lệnh trước đó. Trong tiếng Việt, quan hệ giải thích được chuyển tải tự nhiên qua câu kế tiếp; tiểu từ “đâu” nhấn mạnh lời phủ định mà không thêm nội dung.
- source_word: ἀπέθανεν
  choice: không chết
  rationale: Động từ aorist được diễn đạt tự nhiên bằng “không chết” trong sự đối lập trực tiếp với “đang ngủ”; không chuyển thành lời giải thích về tình trạng chết.
- source_word: καθεύδει
  choice: đang ngủ
  rationale: Giữ hình ảnh ngủ và sắc thái hiện tại của động từ, không làm phẳng ẩn dụ thành một lời giải nghĩa.
theological_decisions:
- issue: Lời Đức Chúa Jêsus rằng cô bé “không chết... nhưng đang ngủ”
  choice: 'Giữ nguyên sự đối lập theo lời nói: “không chết đâu, nhưng đang ngủ.”'
  alternative: “không chết vĩnh viễn mà chỉ đang ngủ” hoặc “trông như đã chết nhưng thật ra đang ngủ”
  rationale: Nguyên văn duy trì sự căng thẳng giữa cái chết được những người chứng kiến nhận biết và cách Đức Chúa Jêsus mô tả tình trạng cô bé trước khi phục hồi sự sống. Bản dịch không tự ý xác định đây là giấc ngủ thông thường hay giải thích là cái chết tạm thời.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “cô bé” cho đại từ αὐτήν theo ngữ cảnh. Danh xưng “Đức Chúa Jêsus” phù hợp văn phong Kinh Thánh tiếng Việt, dù tên riêng không được lặp lại trong câu Hy Lạp; chủ thể được xác định rõ từ ngữ cảnh.
