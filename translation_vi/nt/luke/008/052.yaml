revisions:
- from: 'Mọi người đều đang khóc và than khóc cho cô bé. Nhưng Đức Chúa Jêsus phán: “Đừng khóc! Cô bé không chết đâu, nhưng đang ngủ.”[a]'
  to: 'Mọi người đều đang khóc lóc và than khóc cô bé. Nhưng Người nói: “Đừng khóc, vì cô bé không chết, nhưng đang ngủ.”[a]'
  rationale: Bản sửa bổ sung “vì” để dịch γάρ, giữ đầy đủ tính phổ quát và sắc thái tiếp diễn của các động từ than khóc, và dùng “Người nói” sát với ὁ δὲ εἶπεν. Câu “không chết, nhưng đang ngủ” được giữ nguyên như lời nói trong nguyên văn, không diễn giải liệu đây là giấc ngủ thông thường hay cách nói về cái chết và sự phục hồi sự sống. Chú thích nay cung cấp một lựa chọn dịch thực sự cho καθεύδει.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:38Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng hai hành động than khóc đang diễn ra, phạm vi “mọi người,” và hình ảnh “ngủ.” Tuy nhiên, γάρ (“vì”) bị bỏ mất, trong khi đây là từ nối nêu lý do cho mệnh lệnh. Bản nháp cũng thêm danh xưng và tên riêng “Đức Chúa Jêsus” dù nguyên văn câu này chỉ có “người/ngài nói”; chủ thể đã rõ từ ngữ cảnh nên không cần thêm vào bản dịch câu.
  naturalness: “Mọi người đều đang khóc lóc và than khóc cô bé” là cách diễn đạt hiện đại, tự nhiên, đồng thời phân biệt tương đối hai động từ ἔκλαιον và ἐκόπτοντο mà không áp đặt cử chỉ đấm ngực. “Đừng khóc, vì cô bé không chết, nhưng đang ngủ” giữ nhịp câu trực tiếp và trang trọng vừa phải.
  terminology: Dùng “Người” cho ὁ δέ tránh thêm danh xưng không có trong bản văn câu này. “Cô bé” phù hợp ngữ cảnh. “Đang ngủ” bảo toàn cách nói của Đức Chúa Jêsus mà không giải quyết tính chất ẩn dụ hoặc tình trạng của cô bé.
  issues:
  - severity: medium
    issue: Thiếu từ nối chỉ lý do “vì” cho γάρ.
    rationale: Nguyên văn có οὐ γὰρ, trong đó γάρ giải thích mệnh lệnh “Đừng khóc.” Cấu trúc “Cô bé không chết đâu” không tự nó thể hiện rõ quan hệ lý do này.
  - severity: low
    issue: Thêm “Đức Chúa Jêsus phán” thay cho “Người nói.”
    rationale: ὁ δὲ εἶπεν chỉ nói “nhưng người/ngài nói.” Dù chủ thể là Đức Chúa Jêsus theo ngữ cảnh, việc thêm tên và danh xưng vượt quá câu nguồn; “Người nói” vẫn rõ và sát nguồn hơn.
  - severity: low
    issue: Chú thích hiện tại lặp lại nguyên văn cách dịch “đang ngủ” và diễn giải việc phục hồi sự sống.
    rationale: Chú thích lexical_alternative nên nêu lựa chọn từ vựng thực sự khác biệt; không nên giải thích trước ý nghĩa tường thuật/thần học của ẩn dụ.
