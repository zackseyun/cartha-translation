id: LUK.8.35
reference: Luke 8:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: vi
  text: Họ đi ra để xem việc đã xảy ra. Họ đến gặp Giê-su và thấy người mà các quỷ đã ra khỏi[b] đang ngồi dưới chân Giê-su, đã mặc quần áo và có tâm trí tỉnh táo[a]. Họ sợ hãi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “có tâm trí lành mạnh.”'
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép động từ ở số nhiều (“các quỷ đã ra khỏi”); bản văn được in dùng động từ số ít với chủ ngữ số nhiều, nhưng ý nghĩa không thay đổi.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον
  choice: họ đi ra
  rationale: Động từ aorist thuật lại việc dân chúng từ nơi họ đang ở đi ra để xem sự việc; cách diễn đạt này tự nhiên và giữ hướng chuyển động.
- source_word: ἰδεῖν τὸ γεγονός
  choice: xem điều gì đã xảy ra
  rationale: Động từ nguyên mẫu chỉ mục đích, còn phân từ hoàn thành được dùng như danh từ, nói về sự việc đã xảy ra.
- source_word: εὗρον καθήμενον τὸν ἄνθρωπον
  choice: họ thấy người ấy đang ngồi
  rationale: εὗρον mang nghĩa thuật chuyện là “thấy/gặp thấy”; καθήμενον mô tả tư thế của người ấy lúc họ đến.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: người mà các quỷ đã rời khỏi
  rationale: Giữ quan hệ trực tiếp giữa người ấy và việc các quỷ ra khỏi, đồng thời dùng cách nói tự nhiên trong tiếng Việt; thì quá khứ được thể hiện bằng “đã”.
- source_word: δαιμόνια
  choice: các quỷ
  rationale: Đây là từ tương đương trực tiếp, giữ nguyên phương diện hữu thể siêu nhiên có ngôi vị trong lời kể.
- source_word: ἱματισμένον
  choice: mình đã mặc quần áo
  rationale: Diễn tả tình trạng hiện tại đã được phục hồi của người trước đó không mặc quần áo, không thêm ý “chỉnh tề” vốn không có trong nguyên văn.
- source_word: σωφρονοῦντα
  choice: tâm trí tỉnh táo
  rationale: Diễn đạt sự sáng suốt, tự chủ và bình thường về tâm trí bằng tiếng Việt hiện đại mà không áp đặt thuật ngữ lâm sàng.
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: dưới chân Chúa Giê-su
  rationale: Cách nói tự nhiên trong tiếng Việt cho vị trí ở ngay bên chân Chúa Giê-su; không diễn giải thêm ý môn đồ hay quy phục.
- source_word: ἐφοβήθησαν
  choice: họ liền sợ hãi
  rationale: Giữ phản ứng sợ hãi của đám đông; “liền” nối tự nhiên với cảnh tượng họ vừa chứng kiến.
theological_decisions:
- issue: Cách dịch δαιμόνια trong trình thuật trừ quỷ
  choice: các quỷ
  alternative: các tà linh
  rationale: “Các quỷ” giữ trực tiếp nội dung siêu nhiên của trình thuật và không giản lược sự việc thành bệnh tật hay ẩn dụ.
- issue: Sắc thái của σωφρονοῦντα sau khi quỷ ra khỏi
  choice: tâm trí tỉnh táo
  alternative: có tâm trí lành mạnh
  rationale: Cách chọn này truyền đạt sự phục hồi về khả năng suy nghĩ và tự chủ, nhưng không đưa vào một chẩn đoán tâm thần hiện đại.
- issue: Ý nghĩa tư thế παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: dưới chân Chúa Giê-su
  alternative: bên chân Chúa Giê-su
  rationale: Giữ hình ảnh không gian quen thuộc của nguyên văn mà không nói rõ đây là tư thế thờ phượng, quy phục hay môn đồ, vì câu không tự giải thích sắc thái ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu được chia làm ba nhịp để tránh chuỗi liên từ nặng nề của tiếng Hy Lạp mà vẫn giữ đúng trình tự sự việc. Dùng “Chúa Giê-su” theo cách gọi phổ thông trong văn phong Kinh Thánh tiếng Việt.
