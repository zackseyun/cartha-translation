revisions:
- from: Bấy giờ, họ đi ra xem điều gì đã xảy ra. Khi đến chỗ Chúa Giê-su, họ thấy người mà các quỷ đã rời khỏi[b] đang ngồi dưới chân Chúa Giê-su, mình đã mặc quần áo và tâm trí tỉnh táo[a]. Họ liền sợ hãi.
  to: Họ đi ra để xem việc đã xảy ra. Họ đến gặp Giê-su và thấy người mà các quỷ đã ra khỏi[b] đang ngồi dưới chân Giê-su, đã mặc quần áo và có tâm trí tỉnh táo[a]. Họ sợ hãi.
  rationale: 'Sửa danh xưng thêm ngoài nguyên văn, làm mượt chuỗi mô tả người được chữa lành, và bỏ «liền» để không thêm sắc thái thời gian. Các ký hiệu chú thích được giữ đúng vị trí: [b] cho hình thức động từ ἐξῆλθεν và [a] cho σωφρονοῦντα.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:34Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần bỏ danh xưng «Chúa» vì nguyên văn chỉ có tên Ἰησοῦς («Giê-su»). Bản sửa giữ đầy đủ trình tự và các thành phần của câu Hy Lạp: họ đi ra để xem, đến với Giê-su, thấy người ấy ngồi, đã mặc quần áo, có tâm trí tỉnh táo ở dưới chân Giê-su, rồi sợ hãi. Dị bản động từ số ít vẫn được ghi chú đúng tại mệnh đề liên quan.'
  naturalness: 'Câu hiện có «mình đã mặc quần áo và tâm trí tỉnh táo» không song song tự nhiên: «tâm trí tỉnh táo» thiếu vị ngữ rõ ràng, còn «mình» trong cấu trúc này hơi gượng. Bản sửa dùng chuỗi phân từ/tình trạng tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.'
  terminology: «Các quỷ», «đã mặc quần áo», và «có tâm trí tỉnh táo» truyền đạt phù hợp δαιμόνια, ἱματισμένον, và σωφρονοῦντα. «Dưới chân Giê-su» giữ hình ảnh không gian mà không diễn giải thành ý nghĩa quy phục hay môn đồ.
  issues:
  - severity: medium
    issue: Thêm danh xưng «Chúa» trước tên Giê-su
    rationale: Nguyên văn hai lần chỉ ghi τὸν Ἰησοῦν / τοῦ Ἰησοῦ, không có κύριος. Thêm danh xưng làm thay đổi mức độ tường thuật của bản dịch.
  - severity: medium
    issue: Cụm «mình đã mặc quần áo và tâm trí tỉnh táo» thiếu song song ngữ pháp tự nhiên
    rationale: «Mình đã mặc quần áo» và «tâm trí tỉnh táo» không cùng cấu trúc; cần nêu rõ «có tâm trí tỉnh táo» để diễn đạt σωφρονοῦντα.
  - severity: low
    issue: «Liền» thêm sắc thái tức thời
    rationale: ἐφοβήθησαν chỉ nói «họ sợ hãi»; liên từ thêm không cần thiết.
