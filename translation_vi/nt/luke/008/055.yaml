id: LUK.8.55
reference: Luke 8:55
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: vi
  text: Linh hồn cô bé trở lại[a]; cô lập tức đứng dậy, và Ngài truyền phải cho cô bé ăn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hơi thở cô bé trở lại.”'
    reason: Bảo lưu nghĩa khác có thể có của πνεῦμα.
  - marker: b
    text: 'Sát nghĩa: “truyền phải đưa cho cô bé thứ gì đó để ăn.”'
    reason: Cho thấy cấu trúc bị động và động từ “ăn” được nêu rõ trong nguyên văn.
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: trở lại
  rationale: Diễn tả sự sống được phục hồi bằng một cách nói tự nhiên, đồng thời giữ hình ảnh cụ thể của nguyên văn mà không thêm lời giải thích.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: linh hồn cô bé
  rationale: πνεῦμα có thể chỉ linh, hơi thở hoặc sinh khí. Trong bối cảnh cô bé sống lại, “linh hồn cô bé” là cách diễn đạt tự nhiên, trang trọng và vẫn giữ được sức nặng thần học; khả năng hiểu là “hơi thở” được ghi ở chú thích.
- source_word: ἀνέστη
  choice: đứng dậy
  rationale: Diễn đạt rõ hành động thể chất xảy ra sau khi cô bé được phục hồi sự sống, phù hợp với nghĩa thông dụng của ἀνίστημι.
- source_word: παραχρῆμα
  choice: lập tức
  rationale: Giữ sự nhấn mạnh của nguyên văn rằng hành động xảy ra ngay tức khắc.
- source_word: διέταξεν
  choice: truyền
  rationale: Thể hiện thẩm quyền trong lời chỉ dẫn, nhưng tự nhiên và không quá gay gắt trong văn cảnh chăm sóc thực tế.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: phải cho cô bé ăn
  rationale: Chuyển cấu trúc nguyên mẫu bị động sang cách nói tiếng Việt tự nhiên, đồng thời giữ rõ ý φαγεῖν là ăn, thay vì chỉ nói chung rằng thức ăn được trao cho cô bé.
theological_decisions:
- issue: Ý nghĩa của πνεῦμα trong bối cảnh sống lại
  choice: linh hồn cô bé trở lại
  alternative: hơi thở cô bé trở lại
  rationale: “Linh hồn” giữ được chiều rộng ngữ nghĩa và sức nặng thần học của πνεῦμα trong trình thuật phục hồi từ cõi chết, nhưng chú thích vẫn bảo lưu cách hiểu sinh lý là “hơi thở” mà không loại trừ nó.
- issue: Chủ thể ngầm của διέταξεν
  choice: Ngài truyền
  alternative: Đức Chúa Jêsus truyền
  rationale: Động từ Hy Lạp chỉ có chủ thể ngầm giống đực số ít. “Ngài” tự nhiên trong mạch truyện và không thêm danh xưng vốn không xuất hiện trong câu này.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “cô bé” để giữ mạch chỉ người của đại từ αὐτῆς/αὐτῇ; dùng dấu chấm phẩy để tránh chuỗi liên từ nặng nề nhưng vẫn giữ ba hành động liên tiếp của câu Hy Lạp.
