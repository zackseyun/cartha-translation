  terminology: '“Linh hồn,” “đứng dậy,” và “truyền” phù hợp ngữ cảnh và nhất quán về sắc thái. Viết hoa “Ngài” phù hợp với chủ thể đã xác định trong mạch văn gần. Các chú thích được gắn đúng chỗ: a với πνεῦμα và b với mệnh lệnh cho ăn.'
