  source_fidelity: 'Bản dịch phản ánh đầy đủ ba mệnh đề liên tiếp của tiếng Hy Lạp: πνεῦμα của cô bé trở lại, cô bé lập tức đứng dậy, và chủ thể ngầm (Đức Chúa Jêsus trong ngữ cảnh) ra lệnh cho cô bé được cho ăn. “Linh hồn” là cách dịch Việt ngữ thông dụng trong ngữ cảnh này; chú thích a thích đáng bảo lưu khả năng ngữ nghĩa “hơi thở”. “Phải cho cô bé ăn” chuyển tự nhiên cấu trúc bị động với φαγεῖν được nêu rõ, không làm mất ý nghĩa thiết yếu.'
