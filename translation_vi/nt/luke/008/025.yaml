id: LUK.8.25
reference: Luke 8:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: vi
  text: 'Rồi Ngài phán với họ: “Đức tin của anh em[a] ở đâu?” Họ sợ hãi và kinh ngạc, nói với nhau: “Vậy người này là ai mà ra lệnh cả cho gió và nước, và chúng đều vâng lời người?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “lòng tin cậy.” Câu hỏi của Chúa Giê-su cũng có thể được hiểu là: “Lòng tin cậy của anh em ở đâu?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: ở đâu
  rationale: Giữ nguyên câu hỏi trực tiếp về vị trí hay sự hiện diện của đức tin, không diễn giải thành “tại sao các con không có đức tin”.
- source_word: πίστις
  choice: đức tin
  rationale: Đây là cách dịch chuẩn và rộng nghĩa; trong văn cảnh, từ này đặc biệt hàm ý lòng tin cậy giữa cơn nguy hiểm.
- source_word: φοβηθέντες
  choice: họ sợ hãi
  rationale: Diễn đạt tự nhiên trong tiếng Việt phản ứng sợ hãi đi kèm và có trước sự kinh ngạc, dù không sao chép máy móc cấu trúc phân từ Hy Lạp.
- source_word: ἐθαύμασαν
  choice: kinh ngạc
  rationale: Diễn tả sự sửng sốt, thán phục trước quyền năng vừa được chứng kiến bằng lối nói hiện đại, trang trọng.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Vậy người này là ai
  rationale: “Vậy” bảo tồn sắc thái suy luận của ἄρα; “người này” giữ tính chất câu hỏi của các môn đồ mà không giải thích trước căn tính của Chúa Giê-su.
- source_word: ἐπιτάσσει
  choice: ra lệnh
  rationale: Thể hiện trực tiếp hành động truyền lệnh, không nhập từ “quở” của câu trước.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: gió và nước
  rationale: 'Theo đúng danh từ của Lu-ca: “gió” và “nước”, không thay “nước” bằng “sóng” hay “biển” theo các bản song song.'
- source_word: ὑπακούουσιν αὐτῷ
  choice: chúng đều vâng lời người
  rationale: Diễn đạt rõ sự tuân phục của các yếu tố thiên nhiên được nhân cách hóa; “đều” tự nhiên hóa quan hệ số nhiều trong tiếng Việt.
theological_decisions:
- issue: Sắc thái của πίστις trong lời chất vấn các môn đồ
  choice: đức tin
  alternative: lòng tin cậy
  rationale: “Đức tin” giữ thuật ngữ thần học quen thuộc và độ rộng nghĩa của πίστις, trong khi văn cảnh vẫn cho thấy đây là sự tin cậy nơi Chúa Giê-su giữa hiểm nguy.
- issue: Cách gọi Chúa Giê-su trong câu hỏi Τίς ἄρα οὗτός ἐστιν
  choice: người này
  alternative: Đấng này
  rationale: “Người này” bảo tồn giọng câu hỏi chưa được giải đáp của các môn đồ; “Đấng này” có thể đưa thêm sắc thái tôn xưng và ngầm giải quyết căn tính mà câu Hy Lạp vẫn để mở.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” trong lời người thuật chuyện và “người” trong câu hỏi trực tiếp để giữ sự phân biệt giữa giọng kể kính trọng và sự kinh ngạc chưa hiểu trọn của các môn đồ. Không thêm chú thích vì “đức tin” tự nhiên trong tiếng Việt và sắc thái tin cậy đã có thể nhận ra từ văn cảnh.
