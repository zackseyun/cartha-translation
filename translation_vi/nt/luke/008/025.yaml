  to: 'Rồi Ngài phán với họ: “Đức tin của anh em[a] ở đâu?” Họ sợ hãi và kinh ngạc, nói với nhau: “Vậy người này là ai mà ra lệnh cả cho gió và nước, và chúng đều vâng lời người?”'
  rationale: Sửa cách xưng hô “các con” thành “anh em” để không thêm quan hệ không được nêu trong tiếng Hy Lạp. Bổ sung neo và chú thích cho nghĩa thay thế theo ngữ cảnh của πίστις. Những phần còn lại giữ nguyên vì phản ánh sát nguyên văn và dùng tiếng Việt tự nhiên.
