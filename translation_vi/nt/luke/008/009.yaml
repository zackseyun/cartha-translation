  to: Các môn đệ của Chúa Giê-su hỏi Người dụ ngôn này có nghĩa gì.[a]
  rationale: Bản sửa thay thuật ngữ chưa chính xác “ẩn dụ” bằng “dụ ngôn”, chuẩn hóa cách gọi và chính tả theo tiếng Việt hiện đại, đồng thời tránh thêm “Đức Chúa” không có trong câu nguồn. Chính văn vẫn diễn đạt tự nhiên câu hỏi về ý nghĩa; chú thích bảo lưu cách dịch sát hơn của τίς ... εἴη.
