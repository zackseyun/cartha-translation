  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: vi
  text: Các môn đệ của Chúa Giê-su hỏi Người dụ ngôn này có nghĩa gì.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “dụ ngôn này là gì” hoặc “dụ ngôn này có thể là gì.”'
    reason: Bảo lưu hình thức câu hỏi gián tiếp và sắc thái optative của εἴη trong nguyên văn.
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: hỏi
  rationale: Động từ ở thì chưa hoàn thành có thể gợi hành động đang diễn ra hoặc lặp lại; trong tiếng Việt, “hỏi” tự nhiên và không cần diễn đạt quá mức sắc thái thể.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ là liên từ nhẹ đánh dấu bước tiếp theo của câu chuyện; mạch văn tiếng Việt đã rõ nên không cần thêm “bấy giờ” hay “nhưng”, vốn có thể làm sắc thái mạnh hơn nguyên văn.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ của Đức Chúa Jêsus
  rationale: “Môn đồ” là cách gọi quen thuộc, trang trọng và giữ được quan hệ học trò–thầy; dùng danh xưng thay đại từ sở hữu để câu tiếng Việt rõ chủ thể trong câu đứng riêng.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: ẩn dụ này có nghĩa gì
  rationale: Nguyên văn gần sát là “ẩn dụ này là/có thể là gì” trong câu hỏi gián tiếp; theo ngữ cảnh, các môn đồ hỏi về ý nghĩa. Cách dịch này tự nhiên, còn nghĩa sát chữ được giữ trong chú thích.
- source_word: παραβολή
  choice: ẩn dụ
  rationale: Trong ngữ cảnh Tin Lành, παραβολή chỉ một lời kể hoặc hình ảnh so sánh truyền đạt ý nghĩa; “ẩn dụ” là cách diễn đạt phổ thông, gọn và dễ hiểu.
- source_word: εἴη
  choice: có nghĩa
  rationale: Thể optative xuất hiện trong câu hỏi gián tiếp sau động từ quá khứ; tiếng Việt không có hình thái tương ứng, nên diễn đạt chức năng ngữ cảnh bằng “có nghĩa” mà không thêm mức độ bất định không tự nhiên.
theological_decisions:
- issue: Câu hỏi nhằm nhận diện hay giải nghĩa ẩn dụ
  choice: Diễn đạt trong chính văn là hỏi về ý nghĩa
  alternative: “ẩn dụ này là gì” hoặc “ẩn dụ này có thể là gì”
  rationale: Ngữ cảnh kế tiếp cho thấy Đức Chúa Jêsus giải thích nội dung ẩn dụ, nhưng cấu trúc Hy Lạp vẫn có độ mở; vì vậy bản dịch chính truyền đạt dụng ý ngữ cảnh, còn chú thích bảo lưu cách hiểu sát chữ.
translation_notes:
  register: Tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Dùng “Đức Chúa Jêsus” và “Ngài” theo văn phong Kinh Thánh quen thuộc; câu ngắn, dễ hiểu. Dấu chú thích [a] xuất hiện đầy đủ trong chính văn.
