revisions:
- from: Một số hạt khác rơi giữa bụi gai[a]; gai cùng mọc lên với chúng và làm chúng nghẹt đi.[b]
  to: Một hạt khác rơi giữa những bụi gai[a]; những bụi gai cùng mọc lên với nó và bóp nghẹt nó.[b]
  rationale: Chỉnh số ít để phản ánh ἕτερον và αὐτό, dùng nhất quán “bụi gai” cho hình ảnh thực vật, và thay cách nói kém tự nhiên “làm ... nghẹt đi” bằng “bóp nghẹt.” Các chú thích vẫn giữ các lựa chọn diễn đạt của nguyên văn và neo chú thích đầy đủ.
