  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: vi
  text: Một hạt khác rơi giữa những bụi gai[a]; những bụi gai cùng mọc lên với nó và bóp nghẹt nó.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ở giữa những bụi gai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “và những bụi gai, khi cùng mọc lên với nó, đã bóp nghẹt nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: một số hạt khác
  rationale: Tính từ trung tính số ít được dùng như danh từ, ngầm chỉ hạt giống. Trong tiếng Việt, thêm “hạt” để rõ nghĩa; “một số hạt khác” tự nhiên trong mạch người gieo giống rải nhiều hạt.
- source_word: ἔπεσεν
  choice: rơi
  rationale: Diễn đạt trực tiếp hành động đơn giản của hạt giống rơi xuống.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: giữa bụi gai
  rationale: Giữ sắc thái không gian “ở giữa/giữa” và dùng cách nói tự nhiên trong tiếng Việt.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: bụi gai / gai
  rationale: Danh từ chỉ các loài cây có gai; “bụi gai” làm rõ hình ảnh thực vật ở lần đầu, còn “gai” ở lần sau tránh nặng câu mà vẫn giữ liên kết.
- source_word: συμφυεῖσαι
  choice: cùng mọc lên với chúng
  rationale: Giữ ý các cây gai phát triển đồng thời và bên cạnh các hạt giống.
- source_word: ἀπέπνιξαν
  choice: làm chúng nghẹt đi
  rationale: Bảo tồn hình ảnh cây gai bóp nghẹt sự sống của hạt giống mà không giải thích thêm cơ chế.
- source_word: αὐτό
  choice: chúng
  rationale: Nguyên văn dùng đại từ trung tính số ít theo ἕτερον; bản dịch dùng số nhiều cho phù hợp với cách diễn đạt tự nhiên “một số hạt” trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bụi gai” duy trì hình ảnh nông nghiệp quen thuộc; cấu trúc câu theo sát trình tự của nguyên văn. Mọi dấu chú thích đều có mặt trong chính văn.
