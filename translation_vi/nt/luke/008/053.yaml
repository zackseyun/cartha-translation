translation:
  language: vi
  text: Họ cười nhạo Ngài, vì biết rằng cô bé đã chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: nhạo cười
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra; “nhạo cười” vừa tự nhiên vừa giữ được sắc thái chế giễu của động từ.
- source_word: αὐτοῦ
  choice: Ngài
  rationale: Đại từ sở hữu cách là bổ ngữ của καταγελάω, chỉ người bị nhạo cười; trong tiếng Việt, động từ “nhạo cười” có thể trực tiếp nhận bổ ngữ này.
- source_word: εἰδότες
  choice: vì biết
  rationale: 'Phân từ mang ý nghĩa nguyên nhân trong ngữ cảnh: họ nhạo cười vì họ biết cô bé đã chết. Cách dịch này tự nhiên và làm rõ quan hệ logic mà không thêm nội dung.'
- source_word: ὅτι
  choice: rằng
  rationale: Liên từ giới thiệu nội dung điều họ biết, chứ không phải tự nó nêu nguyên nhân.
- source_word: ἀπέθανεν
  choice: đã chết
  rationale: Thì aorist trình bày cái chết như một sự kiện đã hoàn tất; “đã chết” giữ được ý nghĩa sự kiện và phù hợp với trình tự câu chuyện.
theological_decisions:
- issue: Có nên nêu rõ danh tính của chủ thể hàm ẩn trong ἀπέθανεν hay không
  choice: cô bé đã chết
  alternative: nó đã chết; em ấy đã chết; đứa trẻ đã chết
  rationale: Tiếng Hy Lạp chỉ dùng động từ ngôi ba số ít, không có đại từ mang giống; chủ thể được hiểu từ văn cảnh là cô bé. Tiếng Việt thường cần nêu chủ thể để câu tự nhiên và rõ nghĩa. “Cô bé” dựa trực tiếp vào văn cảnh, không thêm một nhận định thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Ngài” duy trì cách xưng gọi kính trọng dành cho Chúa Giê-su; “nhạo cười” thể hiện rõ tính khinh miệt hơn “cười” đơn thuần.
