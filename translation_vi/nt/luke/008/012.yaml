id: LUK.8.12
reference: Luke 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: vi
  text: Còn những người ở bên đường là những người đã nghe; rồi ma quỷ đến lấy lời ấy[a] khỏi lòng họ, để họ không tin và không được cứu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lời” ở đây là sứ điệp của Đức Chúa Trời được công bố trong dụ ngôn; xem câu 11.
    reason: cross_reference
  - marker: b
    text: 'Cũng có thể dịch: “kẻo họ tin và được cứu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: rơi bên đường
  rationale: Giữ hình ảnh không gian của hạt giống ở bên đường; thêm “rơi” theo ngữ cảnh trực tiếp của dụ ngôn để câu tiếng Việt tự nhiên và rõ nghĩa.
- source_word: ἀκούσαντες
  choice: đã nghe
  rationale: Thể hiện hành động nghe đã xảy ra và đặc trưng cho nhóm người đang được giải thích.
- source_word: ὁ διάβολος
  choice: ma quỷ
  rationale: Chỉ hữu thể ác mang tính ngôi vị trong ngữ cảnh này; “ma quỷ” là cách gọi rõ ràng, quen thuộc trong tiếng Việt hiện đại.
- source_word: αἴρει
  choice: lấy ... khỏi
  rationale: Diễn đạt đúng ý loại bỏ hoặc mang đi, không tăng cường sắc thái thành “cướp giật” khi động từ Hy Lạp không bắt buộc sắc thái ấy.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Giữ thành ngữ Kinh Thánh “lời”, đồng thời “ấy” nối rõ với sứ điệp đã được nghe trong ngữ cảnh.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: khỏi lòng họ
  rationale: “Lòng” bảo toàn ý niệm Kinh Thánh về trung tâm của tư tưởng, ý chí và sự đáp ứng; “họ” phản ánh đại từ số nhiều.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: để họ không tin và không được cứu
  rationale: Diễn đạt tự nhiên mục đích của hành động ma quỷ, đồng thời giữ mối liên hệ giữa tin và được cứu mà không giải thích thêm quan hệ thần học giữa hai điều.
- source_word: σωθῶσιν
  choice: được cứu
  rationale: Trong ngữ cảnh thần học của Lu-ca, động từ nói đến sự cứu rỗi, không chỉ một sự giải thoát tạm thời.
theological_decisions:
- issue: Mối liên hệ giữa việc tin và được cứu
  choice: “để họ không tin và không được cứu”
  alternative: “kẻo họ tin và được cứu”
  rationale: Cả hai cách đều phản ánh cấu trúc ἵνα μή cùng phân từ πιστεύσαντες và động từ σωθῶσιν. Bản chính nêu rõ mục đích ngăn cản cả sự tin lẫn sự cứu mà không áp đặt một hệ thống giáo lý về thứ tự hay cơ chế cứu rỗi; phương án sát cấu trúc hơn được ghi chú.
- issue: “Lời” trong dụ ngôn
  choice: Giữ “lời ấy” trong chính văn
  alternative: Diễn giải thành “sứ điệp của Đức Chúa Trời”
  rationale: Giữ hình ảnh và từ ngữ của dụ ngôn, trong khi chú thích làm rõ sở chỉ theo Lu-ca 8:11 mà không thay thế từ ngữ nguyên bản bằng một lời giải nghĩa.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ trình tự của nguyên văn: nghe, ma quỷ đến, lấy lời khỏi lòng, rồi nêu mục đích. Dùng “những hạt rơi bên đường” để kết nối tự nhiên với hình ảnh gieo giống trong ngữ cảnh.'
