revisions:
- from: Còn những hạt rơi bên đường là những người đã nghe; rồi ma quỷ đến lấy lời ấy[a] khỏi lòng họ, để họ không tin và không được cứu.[b]
  to: Còn những người ở bên đường là những người đã nghe; rồi ma quỷ đến lấy lời ấy[a] khỏi lòng họ, để họ không tin và không được cứu.[b]
  rationale: Chỉ sửa chủ ngữ để loại bỏ chi tiết «hạt rơi» được suy ra từ câu chuyện trước đó nhưng không hiện diện trong nguyên văn của Lu-ca 8:12. Giữ nguyên các lựa chọn còn lại và các chú thích vì chúng phản ánh đúng nghĩa, cách dùng tiếng Việt hiện đại, và tính mơ hồ cú pháp cần bảo tồn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:22Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cụm «những hạt rơi bên đường» thêm hình ảnh «hạt rơi» không có trong nguyên văn của câu này. Dù hình ảnh ấy thuộc dụ ngôn ở các câu trước, Lu-ca 8:12 trực tiếp giải thích: «những người ở/bên đường là những người đã nghe». Bản sửa giữ đúng đối tượng được giải thích. Các phần còn lại truyền đạt chính xác trình tự: đã nghe, ma quỷ đến lấy lời khỏi lòng họ, nhằm ngăn họ tin và được cứu.'
  naturalness: «Những người ở bên đường» tự nhiên và rõ ràng trong văn mạch giải nghĩa dụ ngôn. «Ma quỷ», «lấy lời ấy khỏi lòng họ», và «để họ không tin và không được cứu» là tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu.
  terminology: Giữ «ma quỷ» cho ὁ διάβολος, «lời» cho λόγος, «lòng» cho καρδία, và «được cứu» cho σωθῶσιν. Những lựa chọn này phù hợp ngữ cảnh Kinh Thánh mà không áp đặt cách giải thích hệ phái. Chú thích về «Lời» và phương án «kẻo» đều phù hợp, với các điểm neo rõ ràng.
  issues:
  - severity: medium
    issue: Thêm «những hạt rơi» vào chủ ngữ của câu.
    rationale: Nguyên văn có οἱ ... εἰσιν οἱ ἀκούσαντες, nghĩa là «những người ... là những người đã nghe», không nhắc đến hạt giống hay hành động rơi. Hình ảnh hạt giống là bối cảnh dụ ngôn, nhưng không nên đưa vào chính văn của câu giải nghĩa này.
  revised_text: Còn những người ở bên đường là những người đã nghe; rồi ma quỷ đến lấy lời ấy[a] khỏi lòng họ, để họ không tin và không được cứu.[b]
