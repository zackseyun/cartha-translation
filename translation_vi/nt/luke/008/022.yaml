  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: vi
  text: 'Một hôm, Ngài cùng các môn đồ của Ngài xuống một chiếc thuyền. Ngài nói với họ: “Chúng ta hãy sang bờ bên kia hồ.”[a] Rồi họ khởi hành.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúng ta hãy vượt sang phía bên kia hồ.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp có thể có nghĩa là “đưa thuyền ra”, “nhổ neo” hoặc “bắt đầu ra đi bằng thuyền.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Vào
  rationale: Trong lối kể chuyện của Lu-ca, cụm này chuyển sang một sự việc mới. Tiếng Việt không cần dịch máy móc là “chuyện xảy ra rằng”; kết hợp tự nhiên với cụm thời gian kế tiếp vẫn truyền đạt chức năng dẫn nhập.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: một trong những ngày ấy
  rationale: Giữ sắc thái bất định nhưng vẫn thuộc một khoảng thời gian đã được ngữ cảnh xác định, sát hơn cách nói đơn giản “một hôm”.
- source_word: αὐτὸς ἐνέβη εἰς πλοῖον
  choice: Ngài xuống một chiếc thuyền
  rationale: “Xuống thuyền” là cách nói tự nhiên trong tiếng Việt cho hành động bước lên hoặc vào thuyền; “một chiếc thuyền” phản ánh danh từ không có mạo từ xác định.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: các môn đồ cũng đi cùng
  rationale: Làm rõ một cách tự nhiên rằng các môn đồ cùng Ngài lên thuyền, đúng với cấu trúc phối hợp của câu Hy Lạp.
- source_word: Διέλθωμεν
  choice: Chúng ta hãy sang
  rationale: Diễn đạt đúng thể giả định ngôi thứ nhất số nhiều mang ý đề nghị hoặc thúc giục cùng hành động.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: bờ bên kia hồ
  rationale: “Bờ bên kia” truyền đạt thành ngữ τὸ πέραν, còn “hồ” phản ánh chính xác λίμνη.
- source_word: ἀνήχθησαν
  choice: họ cho thuyền rời bến
  rationale: Động từ được dùng theo nghĩa hàng hải là đưa thuyền ra hoặc bắt đầu chuyến đi. Cách dịch này tự nhiên và tránh nói “ra khơi” vì đây là một hồ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Đức Chúa Jêsus mà không thêm tên riêng vốn không xuất hiện trong câu Hy Lạp. Các dấu chú thích được đặt ngay sau những cụm từ mà chúng giải thích.
