revisions:
- from: Vậy, hãy cẩn thận về cách anh em lắng nghe. Vì ai có thì sẽ được ban thêm; còn ai không có thì ngay cả điều người ấy tưởng mình có cũng sẽ bị lấy khỏi người ấy.[a]
  to: Vậy, hãy chú ý cách anh em lắng nghe. Vì ai có thì sẽ được ban thêm; còn ai không có thì ngay cả điều người ấy tưởng là mình có cũng sẽ bị lấy khỏi người ấy.[a]
  rationale: Chỉnh nhẹ để văn bản tự nhiên hơn và để chú thích phản ánh chính xác phương án nghĩa “dường như/có vẻ” của δοκεῖ, không thêm sắc thái tiếp diễn. Không thay đổi ý nghĩa, đối tượng hàm ẩn của “có/được ban thêm”, hay sức căng thần học của câu.
  reviewer_model: gpt-5.6-terra
