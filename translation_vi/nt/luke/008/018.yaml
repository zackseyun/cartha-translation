id: LUK.8.18
reference: Luke 8:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: vi
  text: Vậy, hãy chú ý cách anh em lắng nghe. Vì ai có thì sẽ được ban thêm; còn ai không có thì ngay cả điều người ấy tưởng là mình có cũng sẽ bị lấy khỏi người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngay cả điều người ấy dường như có cũng sẽ bị lấy khỏi người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: hãy cẩn thận
  rationale: Mệnh lệnh này kêu gọi sự lưu tâm và thận trọng, chứ không nói đến việc nhìn bằng mắt; cách dịch này giữ được sắc thái cảnh báo.
- source_word: οὖν
  choice: Vậy
  rationale: Nối câu này với lời dạy ngay trước đó về việc nghe và đáp ứng, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: πῶς ἀκούετε
  choice: về cách anh em lắng nghe
  rationale: πῶς nhấn mạnh cách thức nghe, còn ἀκούετε trong ngữ cảnh mang ý chủ động tiếp nhận; “lắng nghe” thể hiện điều đó rõ hơn “nghe”.
- source_word: ὃς ἂν ... ἔχῃ
  choice: ai có
  rationale: Cấu trúc đại từ quan hệ với ἄν và giả định thức diễn tả điều kiện tổng quát, có tính cách ngôn; “ai có” ngắn gọn và tự nhiên.
- source_word: δοθήσεται αὐτῷ
  choice: sẽ được ban thêm
  rationale: Bản Hy Lạp không nêu tân ngữ, nhưng thế đối xứng của câu hàm ý sự gia tăng. “Ban thêm” làm rõ thành ngữ mà không xác định cụ thể điều được ban.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: ai không có
  rationale: Giữ cấu trúc điều kiện tổng quát và sự đối lập với “ai có”.
- source_word: ὃ δοκεῖ ἔχειν
  choice: điều người ấy tưởng mình có
  rationale: δοκέω có thể mang nghĩa “tưởng/nghĩ” hoặc “có vẻ.” Cách dịch chính diễn đạt rõ nhận thức chủ quan nhưng vẫn giữ cách hiểu kia trong chú thích.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: sẽ bị lấy khỏi người ấy
  rationale: Diễn đạt sát thể bị động tương lai và ý nghĩa bị tước mất, đồng thời tự nhiên trong tiếng Việt.
- source_word: αὐτῷ / αὐτοῦ
  choice: người ấy / khỏi người ấy
  rationale: Dùng đại từ số ít mang nghĩa khái quát trong tiếng Việt, không khiến câu bị hiểu là chỉ nói đến nam giới.
theological_decisions:
- issue: Ý nghĩa của cách ngôn về người có và người không có
  choice: Giữ câu nói như một nguyên tắc nghịch lý trong ngữ cảnh lắng nghe và tiếp nhận lời Chúa Giê-su, không thêm đối tượng cụ thể cho “có.”
  alternative: Diễn giải thành giáo lý về tiền định, công trạng, thịnh vượng vật chất, hoặc một nguyên tắc quản trị tổng quát.
  rationale: Bản văn gắn trực tiếp lời cảnh báo với cách lắng nghe nhưng không nói rõ vật được “có” hay “ban.” Việc để ngỏ đối tượng bảo toàn chiều rộng và sức căng thần học của câu.
- issue: Sắc thái của δοκεῖ ἔχειν
  choice: “tưởng mình có” trong chính văn, kèm phương án “có vẻ như đang có” ở chú thích.
  alternative: Chỉ chọn một nghĩa và loại bỏ nghĩa kia.
  rationale: Động từ có thể nói đến nhận định chủ quan hoặc vẻ bề ngoài. Chú thích bảo tồn sự mơ hồ có thật của nguyên ngữ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” phù hợp với lời nói trực tiếp trước một nhóm người; “người ấy” duy trì số ít khái quát mà không gượng ép. Dấu chú thích [a] được đặt ngay sau mệnh đề có phương án dịch khác.
