  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: vi
  text: Bấy giờ, mẹ và các anh em[b] của Ngài đến với Ngài, nhưng vì đám đông, họ không thể gặp Ngài[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến được chỗ Ngài” hoặc “tiếp cận Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “anh em”; một số người hiểu theo nghĩa rộng hơn là “họ hàng” hoặc “bà con”, nhưng bản văn dùng từ “anh em”.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: Bấy giờ... đến với Ngài
  rationale: Cụm này thuật lại bước tiếp diễn của câu chuyện và sự xuất hiện, tiến đến chỗ Đức Giê-su; “Bấy giờ” tự nhiên trong văn kể hiện đại mà không nhấn mạnh quá mức trình tự thời gian.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: mẹ và các anh em của Đức Giê-su
  rationale: Giữ đúng các từ chỉ quan hệ thân thuộc trong tiếng Hy Lạp. Lặp tên Đức Giê-su thay cho đại từ sở hữu để câu tiếng Việt rõ chủ thể và tự nhiên.
- source_word: οὐκ ἠδύναντο
  choice: họ không thể
  rationale: Diễn đạt trực tiếp ý không có khả năng thực hiện hành động trong hoàn cảnh ấy.
- source_word: συντυχεῖν αὐτῷ
  choice: đến gần Ngài
  rationale: Trong bối cảnh bị đám đông cản trở, cách dịch này truyền đạt ý họ không thể tiếp cận hay gặp Ngài, đồng thời giữ các khả năng gần nghĩa trong chú thích.
- source_word: διὰ τὸν ὄχλον
  choice: vì đám đông
  rationale: διά với đối cách nêu nguyên nhân; “vì đám đông” ngắn gọn và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Quan hệ của οἱ ἀδελφοὶ αὐτοῦ với Đức Giê-su
  choice: các anh em của Đức Giê-su
  alternative: họ hàng; bà con
  rationale: Bản văn dùng ἀδελφοί, nghĩa thông thường là “anh em”. Bản dịch không tự quyết định họ là anh em ruột, anh em cùng cha khác mẹ hay bà con theo nghĩa rộng, và không đưa một lập trường giáo phái vào câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ “Ngài” để chỉ Chúa Giê-su; giữ “các anh em” nhằm phản ánh từ Hy Lạp mà không giải quyết tranh luận về quan hệ gia đình.
