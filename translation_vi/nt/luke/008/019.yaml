revisions:
- from: Bấy giờ, mẹ và các anh em của Đức Giê-su đến với Ngài, nhưng họ không thể đến gần Ngài[a] vì đám đông.
  to: Bấy giờ, mẹ và các anh em[b] của Ngài đến với Ngài, nhưng vì đám đông, họ không thể gặp Ngài[a].
  rationale: Thay “đến gần Ngài” bằng “gặp Ngài” để phản ánh đầy đủ hơn συντυχεῖν trong ngữ cảnh, đồng thời giữ ý bị đám đông ngăn trở. Bổ sung chú thích cho “các anh em” để duy trì tính minh bạch về từ ngữ và không giải quyết thay bản văn một vấn đề diễn giải.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:27Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng diễn tiến, các nhân vật, sự cản trở bởi đám đông, và ý bất khả của οὐκ ἠδύναντο. Tuy nhiên, “đến gần Ngài” hơi thu hẹp συντυχεῖν αὐτῷ vào khoảng cách vật lý; trong ngữ cảnh này, “gặp Ngài”/“đến gặp Ngài” phản ánh sát hơn ý không thể tiếp cận để gặp. Chú thích về ἀδελφοί trong vệt kiểm toán tiếng Anh cũng nên được duy trì để bản dịch chữ “anh em” không bị hiểu là tự giải quyết tranh luận về quan hệ gia đình.
  naturalness: “Bấy giờ” phù hợp văn kể hiện đại. Đưa cụm nguyên nhân lên trước mệnh đề cuối (“nhưng vì đám đông, họ không thể...”) tự nhiên và rõ quan hệ nhân quả. “Đến gặp Ngài” là cách nói hiện đại, trang trọng vừa phải, và tránh sự lặp ý kém tự nhiên của “đến với Ngài... đến gần Ngài.”
  terminology: Giữ “Đức Giê-su” và “Ngài” nhất quán với đăng ký tôn kính của bản nháp. “Các anh em” phản ánh trực tiếp οἱ ἀδελφοὶ; chú thích nêu khả năng diễn giải rộng hơn mà không thay thế cách dịch hay áp đặt kết luận giáo phái.
  issues:
  - severity: medium
    issue: Cách dịch chính của συντυχεῖν αὐτῷ là “đến gần Ngài”.
    rationale: Động từ này có nghĩa gặp/chạm mặt/tiếp cận một người. Trong bối cảnh đám đông ngăn trở, “đến gặp Ngài” bao hàm việc tiếp cận nhưng không giới hạn nghĩa vào sự gần gũi không gian.
  - severity: low
    issue: Thiếu chú thích cho “các anh em” tương ứng với chú thích b của vệt kiểm toán tiếng Anh.
    rationale: Dù bản dịch chính “các anh em” là đúng, chú thích giúp bảo toàn việc nguyên ngữ nói “anh em” trong khi không quyết định các cách hiểu rộng hơn về quan hệ gia đình.
  revised_text: Bấy giờ, mẹ và các anh em[b] của Ngài đến với Ngài, nhưng vì đám đông, họ không thể gặp Ngài[a].
