base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: vi
  text: 'Nhưng Ngài nắm lấy tay cô bé và gọi lớn: “Con ơi, hãy đứng dậy!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bé gái ơi, hãy đứng dậy!” Từ Hy Lạp παῖς có thể nghĩa là “đứa trẻ” hoặc, trong ngữ cảnh này, “bé gái”; ἔγειρε cũng có thể dịch là “trỗi dậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Nhưng Ngài
  rationale: δέ đánh dấu bước chuyển nhẹ trong diễn tiến câu chuyện; αὐτός được diễn đạt tự nhiên bằng đại từ, không nhấn mạnh quá mức thành “chính Ngài”.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: nắm lấy tay em
  rationale: Diễn đạt hành động cụ thể là cầm, nắm bàn tay; “nắm lấy tay em” tự nhiên trong tiếng Việt và không mang sắc thái mạnh như “chộp” hay “siết”.
- source_word: ἐφώνησεν λέγων
  choice: gọi lớn
  rationale: φωνέω cho thấy lời gọi được cất lên rõ ràng; tiếng Việt không cần dịch riêng λέγων trước lời nói trực tiếp vì như vậy sẽ nặng nề và dư thừa.
- source_word: Ἡ παῖς
  choice: Con ơi
  rationale: παῖς ở đây chỉ một đứa trẻ, trong ngữ cảnh là bé gái. “Con ơi” giữ được sắc thái trìu mến và là cách xưng gọi tự nhiên trong tiếng Việt mà không vay mượn cách nói ở các sách song song.
- source_word: ἔγειρε
  choice: hãy trỗi dậy
  rationale: Mệnh lệnh của ἐγείρω có thể chỉ việc đứng dậy hoặc sống dậy. “Trỗi dậy” trang trọng, dễ hiểu và giữ được độ mở của động từ trong bối cảnh em bé vừa chết.
theological_decisions:
- issue: Cách dịch lời Chúa Giê-su gọi đứa trẻ
  choice: Con ơi
  alternative: Bé gái ơi
  rationale: παῖς có thể chỉ “đứa trẻ” nói chung hoặc “bé gái” theo ngữ cảnh. “Con ơi” giữ sự trìu mến và không làm hẹp nghĩa từ vựng một cách không cần thiết.
- issue: Cách dịch mệnh lệnh ἔγειρε
  choice: hãy trỗi dậy
  alternative: hãy đứng dậy
  rationale: Trong ngữ cảnh phục sinh, động từ có sức gợi cả hành động đứng lên lẫn được phục hồi sự sống. “Trỗi dậy” bảo toàn sự căng nghĩa này thay vì chỉ xác định tư thế thân thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để quy chiếu Chúa Giê-su; lược cấu trúc dịch sát “nói rằng” vì lời dẫn trực tiếp sau “gọi lớn” đã truyền đạt đầy đủ chức năng của λέγων.
