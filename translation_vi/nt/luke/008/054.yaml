  to: 'Nhưng Ngài nắm lấy tay cô bé và gọi lớn: “Con ơi, hãy đứng dậy!”[a]'
  rationale: Sửa đại từ trần thuật “em” thành “cô bé” để câu tự nhiên và rõ đối tượng hơn. Đổi “hãy trỗi dậy” thành “hãy đứng dậy” nhằm phản ánh mệnh lệnh trực tiếp của ἔγειρε trong tiếng Việt hiện đại, đồng thời giữ “trỗi dậy” như một phương án hợp lệ trong chú thích. Không thêm hay bớt nội dung của nguyên văn.
