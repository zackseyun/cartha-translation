id: LUK.8.45
reference: Luke 8:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: vi
  text: 'Đức Giê-su hỏi: “Ai là người đã chạm vào tôi?” Khi mọi người đều chối, Phi-e-rơ thưa: “Thưa Thầy, đám đông đang vây chặt và chen ép Thầy[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đang vây quanh và ép sát Thầy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁψάμενός μου
  choice: đã chạm vào tôi
  rationale: Động từ ἅπτω ở thể trung trong ngữ cảnh này chỉ sự tiếp xúc thân thể; “chạm vào” tự nhiên trong tiếng Việt và phù hợp với hành động của người phụ nữ trong trình thuật.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Khi mọi người đều chối
  rationale: Phân từ hiện tại diễn tả việc mọi người đang phủ nhận; “khi” giữ được quan hệ đồng thời, còn đối tượng bị lược vẫn được hiểu rõ từ câu hỏi ngay trước đó.
- source_word: Ἐπιστάτα
  choice: Thưa Thầy
  rationale: Đây là cách xưng hô kính trọng, thừa nhận thẩm quyền của Đức Giê-su. “Thưa Thầy” tự nhiên trong tiếng Việt nhưng không nâng thành “Chúa,” vì nguyên văn không dùng κύριος.
- source_word: οἱ ὄχλοι
  choice: đám đông
  rationale: Dù danh từ Hy Lạp ở số nhiều, tiếng Việt thường dùng danh từ tập hợp “đám đông” để chỉ số đông người đang cùng bao quanh một người; dịch máy móc thành “những đám đông” sẽ kém tự nhiên trong ngữ cảnh này.
- source_word: συνέχουσίν σε
  choice: đang vây chặt Thầy
  rationale: συνέχω ở đây gợi ý bị bao quanh và dồn chặt; “vây chặt” giữ được hình ảnh ấy, đồng thời phân biệt với động từ tiếp theo.
- source_word: ἀποθλίβουσιν
  choice: chen ép Thầy
  rationale: Động từ diễn tả áp lực do đám đông chen sát; “chen ép” tự nhiên và đủ mạnh mà không cường điệu thành “nghiền nát.”
theological_decisions:
- issue: Cách dịch danh xưng Ἐπιστάτα dành cho Đức Giê-su
  choice: Thưa Thầy
  alternative: Lạy Chúa
  rationale: Nguyên văn dùng Ἐπιστάτα chứ không dùng κύριος. Vì vậy, bản dịch giữ lời xưng hô kính trọng biểu thị thẩm quyền, nhưng không đưa vào một tước hiệu thần học mạnh hơn điều câu này trực tiếp nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” trong lời kể; Phi-e-rơ xưng hô “Thưa Thầy” và lặp “Thầy” làm đại từ đối cách, phù hợp phép lịch sự tiếng Việt. Cấu trúc câu hỏi “Ai là người đã…” phản ánh tương đối rõ τίς ὁ ἁψάμενός μου mà vẫn tự nhiên.
