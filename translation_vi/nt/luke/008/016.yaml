review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của câu Hy Lạp: thắp đèn, che bằng một đồ đựng, đặt dưới giường, đặt trên chân đèn, và mục đích để người đi vào thấy ánh sáng. Tuy nhiên, ở mệnh đề đối lập, việc chuyển từ “Không ai” sang “người ta” làm lỏng liên kết chủ ngữ của nguyên văn; các đại từ chỉ ngọn đèn cũng nên được nêu rõ để tránh mơ hồ.'
