id: LUK.8.16
reference: Luke 8:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: vi
  text: Không ai thắp đèn rồi lấy đồ đựng che nó hoặc đặt nó dưới giường, nhưng đặt nó trên chân đèn, để những người đi vào thấy ánh sáng.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον ἅψας
  choice: thắp đèn
  rationale: Diễn đạt tự nhiên hành động châm/thắp một ngọn đèn trong tiếng Việt hiện đại.
- source_word: σκεύει
  choice: đồ đựng
  rationale: σκεῦος là từ khá rộng, chỉ một vật dụng hay đồ chứa; “đồ đựng” giữ được tính khái quát hơn “cái thùng” hoặc “cái chậu”.
- source_word: ὑποκάτω κλίνης
  choice: dưới giường
  rationale: κλίνη trong ngữ cảnh gia đình có thể là giường hoặc trường kỷ; “giường” là cách hiểu trực tiếp, tự nhiên và phù hợp với hình ảnh che khuất ngọn đèn.
- source_word: ἐπὶ λυχνίας
  choice: trên chân đèn
  rationale: λυχνία là giá/chân dùng để đặt đèn; “chân đèn” là thuật ngữ ngắn gọn và quen thuộc.
- source_word: οἱ εἰσπορευόμενοι
  choice: những người đi vào
  rationale: Giữ sát ý phân từ chỉ những người đang bước vào, không thêm đối tượng hay địa điểm không có trong câu.
theological_decisions:
- issue: Ý nghĩa biểu tượng của đèn và ánh sáng
  choice: Giữ nguyên hình ảnh cụ thể, không giải thích đèn hay ánh sáng tượng trưng cho điều gì.
  alternative: Diễn giải “ánh sáng” là lời Chúa, chân lý hoặc lời chứng.
  rationale: Câu Hy Lạp chỉ trình bày hình ảnh; việc xác định đầy đủ ý nghĩa biểu tượng thuộc về văn mạch và không nên được chèn vào bản dịch.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng dấu chấm phẩy để làm rõ thế đối lập giữa hai hành động. Không dịch δέ thành “bây giờ”; ở đây nó là tiểu từ nối/chuyển ý, và quan hệ đối lập đã được thể hiện tự nhiên bằng “trái lại” cho ἀλλά.
