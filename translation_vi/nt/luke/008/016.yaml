    rationale: Ngữ cảnh cho biết tân ngữ là ngọn đèn, nhưng việc thêm “nó” làm rõ tham chiếu của αὐτόν mà không thêm ý nghĩa.
  revised_text: Không ai thắp đèn rồi lấy đồ đựng che nó hoặc đặt nó dưới giường, nhưng đặt nó trên chân đèn, để những người đi vào thấy ánh sáng.
