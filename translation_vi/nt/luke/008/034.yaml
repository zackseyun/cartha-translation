  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: vi
  text: Khi những người chăn heo thấy việc đã xảy ra, họ bỏ chạy và báo tin trong thành và vùng đồng quê xung quanh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “các cánh đồng”; ở đây chỉ vùng nông thôn xung quanh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Khi ... thấy
  rationale: Phân từ bất định quá khứ được diễn đạt như một mệnh đề thời gian tự nhiên trong tiếng Việt, giữ đúng quan hệ với các động từ chính.
- source_word: οἱ βόσκοντες
  choice: những người chăn heo
  rationale: Phân từ dùng như danh từ chỉ những người trông coi đàn vật; ngữ cảnh trước đó xác định đó là đàn heo. Nêu rõ “heo” giúp tiếng Việt tự nhiên và tránh hiểu nhầm là người chăn chiên.
- source_word: τὸ γεγονός
  choice: việc đã xảy ra
  rationale: Phân từ hoàn thành dùng như danh từ chỉ sự việc đã xảy ra và đã hoàn tất; cách diễn đạt này tự nhiên và sát nghĩa.
- source_word: ἔφυγον
  choice: họ bỏ chạy
  rationale: Diễn đạt đúng hành động φεύγω trong văn kể chuyện; tự nhiên hơn “chạy trốn” ở đây mà không thêm ý họ đã thoát được.
- source_word: ἀπήγγειλαν
  choice: báo tin
  rationale: Động từ có nghĩa báo lại hoặc loan báo. “Báo tin” phù hợp với ngữ cảnh họ truyền đi tin về sự việc vừa chứng kiến.
- source_word: εἰς τὴν πόλιν
  choice: trong thành
  rationale: Sau động từ báo tin, εἰς biểu thị phạm vi hoặc hướng truyền tin đến dân cư trong thành; “trong thành” tự nhiên trong tiếng Việt.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: cùng khắp vùng đồng quê
  rationale: ἀγροί theo nghĩa đen là các cánh đồng, nhưng khi đối lập với thành thì chỉ vùng nông thôn xung quanh. “Khắp vùng đồng quê” làm rõ phạm vi loan tin mà vẫn giữ tương phản địa lý.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “thành” để giữ sắc thái địa danh cổ, và “người chăn heo” theo đúng ngữ cảnh.
