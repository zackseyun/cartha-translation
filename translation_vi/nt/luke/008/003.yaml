id: LUK.8.3
reference: Luke 8:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: vi
  text: cùng Giô-an-na, vợ của Cu-xa, viên quản lý của Hê-rốt; Su-san-na và nhiều phụ nữ khác, là những người đang phục vụ họ[a] bằng tài sản của mình[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số thủ bản chép “Ngài” thay vì “họ”.
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “lấy từ tài sản của mình” hoặc “bằng phương tiện riêng của mình”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: vợ của Chu-xa
  rationale: Trong cấu trúc đồng vị với tên Gian-nơ và theo sau bởi tên riêng ở sở hữu cách, γυνή tự nhiên nhất mang nghĩa “vợ”, xác định mối quan hệ của bà với Chu-xa.
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: quản gia của Hê-rốt
  rationale: ἐπίτροπος chỉ người được giao coi sóc công việc hoặc tài sản. “Quản gia” ngắn gọn, dễ hiểu và phù hợp với bối cảnh triều đình hoặc điền sản của Hê-rốt.
- source_word: ἕτεραι πολλαί
  choice: nhiều phụ nữ khác
  rationale: Dạng giống cái số nhiều cho thấy cụm từ chỉ những phụ nữ khác ngoài những người vừa được nêu tên; nói rõ “phụ nữ” giúp tiếng Việt tự nhiên và tránh mơ hồ.
- source_word: αἵτινες
  choice: là những người
  rationale: Cụm từ mở đầu mệnh đề mô tả các phụ nữ vừa kể; cách dịch này tự nhiên trong tiếng Việt và giữ rõ chủ thể.
- source_word: διηκόνουν
  choice: phục vụ
  rationale: διακονέω có nghĩa rộng là phục vụ hoặc chăm lo. “Phục vụ” giữ được nghĩa rộng, không áp đặt sắc thái chức vụ giáo hội; cụm từ theo sau cho biết nguồn lực vật chất được dùng trong sự phục vụ.
- source_word: αὐτοῖς
  choice: họ
  rationale: Bản văn SBLGNT được cung cấp có đại từ số nhiều αὐτοῖς, tự nhiên chỉ Chúa Giê-su và những người đi cùng Ngài.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: dùng tài sản của mình
  rationale: Cụm này nói đến việc phục vụ bằng nguồn tài sản hoặc phương tiện thuộc về chính các phụ nữ. Cách diễn đạt tiếng Việt này rõ ràng, tự nhiên và giữ ý về quyền sở hữu của họ.
theological_decisions:
- issue: Số của đại từ αὐτοῖς
  choice: 'số nhiều: các phụ nữ phục vụ Chúa Giê-su và những người đi cùng Ngài'
  alternative: 'số ít: các phụ nữ phục vụ Ngài, tức Chúa Giê-su'
  rationale: Bản văn Hy Lạp được chỉ định đọc αὐτοῖς ở số nhiều, nên bản dịch theo chứng cứ nguồn thay vì hòa hợp với cách đọc số ít trong một số thủ bản. Dị bản được ghi chú để bảo toàn vấn đề văn bản.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong các bản Kinh Thánh tiếng Việt. Cấu trúc câu làm rõ rằng các phụ nữ dùng chính tài sản của họ để phục vụ, đồng thời không thu hẹp hình thức phục vụ chỉ còn việc chu cấp.
