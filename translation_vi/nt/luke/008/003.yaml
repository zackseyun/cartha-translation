  source_fidelity: 'Bản dịch phản ánh đúng các thành tố chính: Giô-an-na là vợ của Cu-xa, người quản lý của Hê-rốt; Su-san-na; nhiều phụ nữ khác; và đại từ số nhiều «họ». Tuy nhiên, «đã dùng» làm thì quá khứ không xác định của διηκόνουν (imperfect: hành động đang/tiếp diễn), và vị trí các ký hiệu chú thích hiện không gắn với từ/cụm từ mà chúng giải thích.'
