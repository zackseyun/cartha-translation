  to: Vì không có gì bị che giấu mà sẽ không trở nên rõ ràng, cũng không có điều gì bí mật mà sẽ không được biết đến và không bị phơi bày công khai.
  rationale: 'Sửa vế hai để biểu đạt minh bạch cấu trúc phủ định bao quát của nguyên văn: không có điều bí mật nào sẽ còn không được biết hoặc không được phơi bày. Thay “kín nhiệm” bằng “bí mật” cho tiếng Việt hiện đại, đồng thời giữ tính khái quát và không xác định thời điểm của lời tuyên bố.'
  reviewer_model: gpt-5.6-terra
