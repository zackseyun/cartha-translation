source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: vi
  text: Vì không có gì bị che giấu mà sẽ không trở nên rõ ràng, cũng không có điều gì bí mật mà sẽ không được biết đến và không bị phơi bày công khai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρυπτὸν
  choice: bị che giấu
  rationale: Diễn đạt tự nhiên trạng thái bị giấu kín và tạo thế đối lập rõ với việc trở nên rõ ràng.
- source_word: φανερὸν
  choice: rõ ràng
  rationale: Trong mệnh đề đầu, từ này đối lập với κρυπτόν; “rõ ràng” là cách nói hiện đại, dễ hiểu, không quá chuyên biệt.
- source_word: γενήσεται
  choice: sẽ trở nên
  rationale: 'Giữ sắc thái chuyển đổi trạng thái của γίνομαι: điều đang bị che giấu sẽ chuyển sang trạng thái rõ ràng.'
- source_word: ἀπόκρυφον
  choice: điều kín nhiệm
  rationale: Phân biệt nhẹ với κρυπτόν đồng thời vẫn giữ cấu trúc song song; “kín nhiệm” chỉ điều được giữ kín mà không mặc nhiên hàm ý xấu.
- source_word: οὐ μὴ γνωσθῇ
  choice: sẽ không được biết đến
  rationale: Trong cấu trúc quan hệ phủ định bao quát, cách dịch này truyền đạt rằng không có điều kín nhiệm nào cuối cùng còn không được biết, đồng thời tránh diễn giải quá mức sắc thái nhấn mạnh của οὐ μή.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: đưa ra ánh sáng
  rationale: Thành ngữ tiếng Việt tự nhiên diễn tả việc một điều kín trở nên công khai; thể bị động phù hợp với chủ thể là “điều kín nhiệm” và với ý nghĩa nội tại của cụm Hy Lạp.
- source_word: γάρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu lý do của câu này đối với lời dạy ngay trước đó.
theological_decisions:
- issue: Phạm vi của lời tuyên bố về sự phơi bày
  choice: Giữ như một nguyên tắc khái quát rằng điều bị che giấu hay kín nhiệm sẽ được bày tỏ.
  alternative: Có thể hiểu riêng về sự phơi bày trong ngày phán xét cuối cùng, hoặc theo ngữ cảnh là sự mặc khải lời dạy của Chúa Giê-su và cách người nghe đáp lại.
  rationale: Bản thân câu không xác định thời điểm hay phạm vi cụ thể, nên bản dịch không thu hẹp ý nghĩa vào riêng cánh chung hoặc một ứng dụng ngữ cảnh duy nhất.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ hai vế song song cùng sự chuyển dịch từ kín giấu sang công khai; tránh từ ngữ giáo phái hoặc cách giải nghĩa vượt quá câu Hy Lạp.
