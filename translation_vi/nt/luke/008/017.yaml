review_pass:
  verdict: revise
  source_fidelity: Bản nháp giữ được cấu trúc hai vế và ý khái quát của nguyên văn. Tuy nhiên, ở vế hai, cụm “sẽ không được biết đến và đưa ra ánh sáng” dễ khiến phủ định được hiểu là chi phối cả hai động từ, thành ý rằng điều bí mật sẽ không bị đưa ra ánh sáng, trái với cấu trúc phủ định kép/quan hệ của tiếng Hy Lạp. Bản sửa làm rõ rằng không điều bí mật nào sẽ vẫn không được biết và không được phơi bày.
  naturalness: “Điều kín nhiệm” không thật tự nhiên trong tiếng Việt hiện đại ở đây; nó có thể gợi một “mầu nhiệm” tôn giáo hơn là một điều được giữ kín. “Điều bí mật” tự nhiên và trung tính hơn. “Bị phơi bày công khai” diễn đạt rõ kết quả của εἰς φανερὸν ἔλθῃ mà không tạo cấu trúc phối hợp mơ hồ.
  terminology: Giữ “bị che giấu,” “trở nên rõ ràng,” và “được biết đến” phù hợp với các từ Hy Lạp tương ứng. Dùng “bí mật” cho ἀπόκρυφον để phân biệt nhẹ với κρυπτόν mà không áp đặt sắc thái thần học. Không cần chú thích.
  issues:
  - severity: high
    issue: Phạm vi phủ định ở vế hai bị mơ hồ và có thể đảo nghĩa.
    rationale: Trong “cũng không có điều gì kín nhiệm mà sẽ không được biết đến và đưa ra ánh sáng,” “sẽ không” có thể được đọc là phủ định cả “được biết đến” lẫn “đưa ra ánh sáng.” Nhưng οὐδὲ ἀπόκρυφον ὃ οὐ μὴ γνωσθῇ καὶ εἰς φανερὸν ἔλθῃ khẳng định rằng mọi điều bí mật đều sẽ được biết và được đưa ra chỗ công khai.
  - severity: medium
    issue: “Kín nhiệm” không phải lựa chọn tự nhiên, trung tính nhất cho ἀπόκρυφον.
    rationale: Trong cách dùng hiện đại, “kín nhiệm” hiếm và có thể gợi điều huyền nhiệm; “bí mật” truyền đạt trực tiếp điều được giữ kín.
  revised_text: Vì không có gì bị che giấu mà sẽ không trở nên rõ ràng, cũng không có điều gì bí mật mà sẽ không được biết đến và không bị phơi bày công khai.
