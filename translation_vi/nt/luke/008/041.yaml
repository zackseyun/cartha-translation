  verdict: approve
  source_fidelity: 'Bản dịch truyền đạt đầy đủ các yếu tố của câu Hy Lạp: lời dẫn thu hút chú ý (ἰδού), người tên Giai-ru đến, chức vụ đứng đầu hội đường, hành động phủ phục dưới chân Đức Giê-su, và lời nài xin Ngài vào nhà ông. “Khẩn khoản xin” diễn đạt thích đáng sắc thái tha thiết của παρεκάλει; dấu phẩy cuối giữ đúng tính liên tục cú pháp sang câu 42.'
