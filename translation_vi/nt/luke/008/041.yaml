  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: vi
  text: Kìa, có một người tên là Giai-ru đến. Ông là người đứng đầu hội đường. Ông sấp mình dưới chân Đức Giê-su và khẩn khoản xin Ngài vào nhà mình,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ sắc thái thuật chuyện nhằm thu hút sự chú ý của từ Hy Lạp, đồng thời tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: người đứng đầu hội đường
  rationale: Diễn đạt chức vụ lãnh đạo, quản trị hội đường một cách rõ ràng mà không gán một chức danh giáo phái hiện đại.
- source_word: πεσὼν παρὰ τοὺς πόδας
  choice: sấp mình dưới chân
  rationale: Thể hiện hành động hạ mình phủ phục sát chân Đức Giê-su, tự nhiên hơn lối dịch máy móc 'ngã xuống bên chân'.
- source_word: παρεκάλει
  choice: khẩn khoản xin
  rationale: Truyền đạt tính liên tục và tha thiết của lời cầu xin trong ngữ cảnh.
- source_word: τὸν οἶκον αὐτοῦ
  choice: nhà mình
  rationale: Đại từ phản thân tiếng Việt xác định căn nhà thuộc về Giai-ru và tránh lặp từ không cần thiết.
theological_decisions: []
