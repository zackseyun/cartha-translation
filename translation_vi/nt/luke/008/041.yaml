  terminology: “Giai-ru,” “hội đường,” và “Đức Giê-su” nhất quán với cách dùng Kinh Thánh tiếng Việt. “Người đứng đầu hội đường” là cách giải nghĩa chính xác, không áp đặt chức danh tôn giáo hiện đại. Đại từ “Ngài” duy trì register tôn kính đã chọn.
