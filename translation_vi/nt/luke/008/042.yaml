id: LUK.8.42
reference: Luke 8:42
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: vi
  text: vì ông chỉ có một cô con gái[a], khoảng mười hai tuổi, và cô bé đang hấp hối. Khi Đức Chúa Jêsus đang đi, đám đông chen lấn, ép chặt lấy Ngài.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một người con duy nhất, là con gái.”'
    reason: lexical_alternative
  - marker: b
    text: Động từ Hy Lạp gợi cảnh đám đông dồn ép rất chặt, gần như làm nghẹt thở.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: chỉ có một cô con gái
  rationale: Trong quan hệ với θυγάτηρ, từ này nói cô bé là người con gái duy nhất, có thể hiểu là người con duy nhất; cách diễn đạt này tự nhiên trong tiếng Việt và không đưa vào sắc thái sinh thành siêu hình.
- source_word: ὡς ἐτῶν δώδεκα
  choice: khoảng mười hai tuổi
  rationale: ὡς đi với con số biểu thị sự ước lượng; “khoảng” giữ đúng sắc thái ấy.
- source_word: ἀπέθνῃσκεν
  choice: đang hấp hối
  rationale: Thì chưa hoàn thành mô tả tiến trình đang diễn ra. “Đang hấp hối” truyền đạt rõ tình trạng cận kề cái chết mà chưa nói cô bé đã chết.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Khi Đức Chúa Jêsus đang đi
  rationale: Cấu trúc ἐν với động từ nguyên mẫu có mạo từ diễn tả hành động đồng thời. Nêu rõ chủ thể giúp câu tiếng Việt tự nhiên trong một câu trích riêng lẻ mà không thêm đích đến vốn không được nói trực tiếp tại đây.
- source_word: οἱ ὄχλοι
  choice: đám đông
  rationale: Dù nguyên ngữ dùng số nhiều, tiếng Việt thường dùng danh từ tập hợp “đám đông” tự nhiên hơn; ý về nhiều người tụ tập vẫn được giữ.
- source_word: συνέπνιγον
  choice: chen lấn, ép chặt lấy
  rationale: Động từ gợi cảnh đám đông dồn ép đến mức gần như làm nghẹt thở. Cặp từ này thể hiện sức ép thể chất mạnh hơn cách nói chung chung “vây quanh” nhưng không khẳng định Ngài thực sự bị ngạt.
- source_word: ὅτι
  choice: vì
  rationale: Liên từ giải thích nguyên nhân khiến lời cầu xin ở câu trước trở nên khẩn thiết.
- source_word: αὐτῷ
  choice: ông chỉ có
  rationale: Cấu trúc sở hữu bằng cách cách được chuyển sang lối diễn đạt sở hữu tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của μονογενής khi nói về con gái
  choice: Dịch “chỉ có một cô con gái” và chú thích khả năng cô bé là người con duy nhất.
  alternative: “cô con gái độc nhất” hoặc “người con duy nhất”
  rationale: Nguyên ngữ kết hợp μονογενής với “con gái” có thể nhấn mạnh cô bé là con một, chứ không chỉ là con gái duy nhất giữa các con. Bản chính giữ cách nói tự nhiên; chú thích bảo toàn phạm vi nghĩa rộng hơn mà không buộc văn bản theo một cách hiểu duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” và đại từ kính trọng “Ngài” theo lối hành văn Kinh Thánh tiếng Việt; “cô bé” tránh lặp từ nhưng vẫn giữ rõ đối tượng. Hai dấu chú thích [a], [b] đều xuất hiện trong bản chính.
