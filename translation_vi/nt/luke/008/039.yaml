id: LUK.8.39
reference: Luke 8:39
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: vi
  text: “Hãy trở về nhà của anh và thuật lại mọi điều Đức Chúa Trời đã làm cho anh.” Người ấy ra đi, rao truyền khắp thành phố mọi điều Giê-su đã làm cho mình.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Hãy trở về
  rationale: Thể mệnh lệnh hiện tại truyền lệnh trực tiếp quay lại nơi trước đó; “trở về” tự nhiên và trang trọng.
- source_word: εἰς τὸν οἶκόν σου
  choice: nhà con
  rationale: Trong ngữ cảnh chỉ nơi chốn, οἶκος là nhà/nơi ở; “nhà con” vừa gọn vừa tự nhiên trong lời nói trực tiếp.
- source_word: διηγοῦ
  choice: thuật lại
  rationale: διηγέομαι mang nghĩa kể hoặc trình bày lại; “thuật lại” giữ sắc thái đầy đủ hơn “nói” mà vẫn dễ hiểu.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: mọi điều Đức Chúa Trời đã làm cho con
  rationale: ὅσα diễn đạt toàn bộ những điều đã xảy ra, không có tính từ tương đương với “lớn lao”; cách dịch này sát nguồn Hy Lạp.
- source_word: ἀπῆλθεν
  choice: ra đi
  rationale: Diễn đạt việc người ấy rời khỏi nơi đang đứng mà không dùng lối văn cổ.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: khắp thành
  rationale: Giữ nghĩa phân bố của κατά, tức công bố ở khắp thành; cách nói ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: κηρύσσων
  choice: rao truyền
  rationale: Giữ sắc thái công bố công khai của κηρύσσω, mạnh hơn chỉ “kể” nhưng không nhất thiết hàm ý một bài giảng chính thức.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: mọi điều Đức Chúa Jêsus đã làm cho mình
  rationale: Phản chiếu mệnh đề trước, đồng thời “mình” quy chiếu tự nhiên về chủ ngữ “người ấy” trong lời trần thuật.
theological_decisions:
- issue: Sự song hành giữa “Đức Chúa Trời” trong mệnh lệnh và “Đức Chúa Jêsus” trong lời công bố
  choice: 'Giữ nguyên hai chủ thể khác nhau như bản Hy Lạp: Đức Chúa Trời / Đức Chúa Jêsus'
  alternative: Đồng nhất cả hai thành “Đức Chúa Trời” hoặc “Đức Chúa Jêsus”, hay thêm lời giải thích về mối liên hệ
  rationale: Lu-ca đặt hai cách gọi song song mà không giải thích trực tiếp. Bản dịch cần bảo toàn sức nặng và độ căng thần học ấy, không tự ý diễn giải.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” trong lời Đức Chúa Jêsus nói với người được chữa lành; dùng “người ấy” và “mình” trong lời kể để tránh mơ hồ. Không thêm “những việc lớn lao” vì nguyên văn chỉ có ὅσα.
