source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: vi
  text: Còn hạt giống rơi vào đất tốt là những người sau khi nghe lời ấy với tấm lòng tốt đẹp và lương thiện[a], thì nắm giữ lời ấy và kiên trì sinh hoa kết quả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với tấm lòng chân thành và tốt lành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  choice: Còn hạt giống trong đất tốt
  rationale: Cụm danh từ giống trung ở đây được tỉnh lược theo ngữ cảnh của dụ ngôn; thêm “hạt giống” làm rõ đối tượng mà không thay đổi ý. “Đất tốt” tự nhiên và giữ nguyên hình ảnh nông nghiệp.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: với tấm lòng cao đẹp và tốt lành
  rationale: “Tấm lòng” diễn đạt con người nội tâm. Hai tính từ gần nghĩa được phân biệt bằng “cao đẹp” và “tốt lành” để giữ sự nhấn mạnh kép của tiếng Hy Lạp mà không quy câu này về một cơ chế thần học nào.
- source_word: ἀκούσαντες τὸν λόγον
  choice: sau khi nghe lời ấy
  rationale: Phân từ bất định chỉ hành động nghe xảy ra trước việc giữ lấy và sinh hoa kết quả. “Lời ấy” nối tự nhiên với đối tượng đã được xác định trong phần giải thích dụ ngôn.
- source_word: κατέχουσιν
  choice: giữ chặt lấy lời
  rationale: Động từ diễn tả việc nắm giữ vững vàng, không chỉ đơn thuần sở hữu hay ghi nhớ. Bổ sung “lời” là đối tượng đã được nêu ngay trước đó.
- source_word: καρποφοροῦσιν ἐν ὑπομονῇ
  choice: bền lòng sinh hoa kết quả
  rationale: Cách diễn đạt này giữ hình ảnh sinh trái và chuyển tải ὑπομονή là sự kiên trì, bền bỉ chịu đựng; đồng thời tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Phẩm chất đạo đức của tấm lòng tiếp nhận lời
  choice: với tấm lòng cao đẹp và tốt lành
  alternative: với tấm lòng chân thành và tốt lành
  rationale: Bản dịch giữ lời đánh giá tích cực kép của câu Hy Lạp nhưng không suy diễn nguồn gốc, công trạng hay thứ tự hình thành của tấm lòng ấy. Phương án thay thế phản ánh cách hiểu καλός theo sắc thái chân thật, ngay thẳng.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Bền lòng sinh hoa kết quả” giữ cả sắc thái kiên trì lẫn hình ảnh nông nghiệp của dụ ngôn.
