revisions:
- from: Còn hạt giống trong đất tốt là những người, sau khi nghe lời ấy với tấm lòng cao đẹp và tốt lành[a], thì giữ chặt lấy lời và bền lòng sinh hoa kết quả.
  to: Còn hạt giống rơi vào đất tốt là những người sau khi nghe lời ấy với tấm lòng tốt đẹp và lương thiện[a], thì nắm giữ lời ấy và kiên trì sinh hoa kết quả.
  rationale: 'Bản sửa làm câu tiếng Việt tự nhiên hơn, đồng thời bảo toàn cấu trúc và ý nghĩa của nguyên văn: hạt giống trong đất tốt (được hiểu theo văn mạch là hạt rơi vào đất tốt), việc nghe có trước, việc nắm giữ lời, và sinh kết quả trong sự kiên trì. Không thêm diễn giải thần học nào về nguồn gốc hay công trạng của tấm lòng.'
  reviewer_model: gpt-5.6-terra
