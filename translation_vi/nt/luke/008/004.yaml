source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: vi
  text: 'Khi một đám đông rất lớn đang tụ họp, và người từ các thành lần lượt kéo đến với Ngài, Ngài nói bằng một dụ ngôn[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong một dụ ngôn.” Cụm từ Hy Lạp διὰ παραβολῆς có thể được hiểu là chỉ phương tiện hoặc cách thức.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: đang tụ họp
  rationale: Phân từ hiện tại trong kết cấu sở hữu cách tuyệt đối diễn tả một hành động đang diễn tiến; “đang tụ họp” tự nhiên và giữ được sắc thái chưa hoàn tất.
- source_word: δὲ
  choice: Khi
  rationale: Trong câu này, δέ chủ yếu nối tiếp mạch kể; tiếng Việt không cần dịch bằng một liên từ riêng khi quan hệ thời gian đã được thể hiện tự nhiên bằng “Khi”.
- source_word: ὄχλου πολλοῦ
  choice: một đoàn dân rất đông
  rationale: ὄχλος chỉ đám đông, còn πολύς nhấn mạnh số lượng; cách diễn đạt này tự nhiên, trang trọng vừa phải và dễ hiểu.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: người từ hết thành này đến thành khác kéo đến
  rationale: Giữ lực phân bố của κατὰ πόλιν, tức người từ nhiều thành lần lượt kéo đến, đồng thời dùng lối nói Việt ngữ tự nhiên.
- source_word: πρὸς αὐτόν
  choice: với Ngài
  rationale: πρός với đối cách diễn tả hướng chuyển động về phía Chúa Giê-su; trong cụm “kéo đến với Ngài”, tiếng Việt diễn đạt tự nhiên ý đến nơi Ngài đang ở.
- source_word: εἶπεν
  choice: Ngài phán
  rationale: “Phán” phù hợp với lời giảng dạy trang trọng của Chúa Giê-su trong văn cảnh, mà không thêm nội dung ngoài động từ “nói” của nguyên văn.
- source_word: διὰ παραβολῆς
  choice: bằng một dụ ngôn
  rationale: διά với sở hữu cách có thể chỉ phương tiện hoặc cách thức; “bằng một dụ ngôn” giữ khá sát cấu trúc nguồn và vẫn rõ nghĩa trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” làm đại từ quy chiếu về Chúa Giê-su theo văn cảnh; dùng “dụ ngôn” là thuật ngữ Kinh Thánh quen thuộc và chính xác.
