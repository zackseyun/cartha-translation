id: LUK.8.40
reference: Luke 8:40
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: vi
  text: Khi Đức Giê-su trở về, đám đông đón tiếp Người[a], vì tất cả đều đang chờ Người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tiếp nhận Người”; động từ Hy Lạp có thể chỉ việc tiếp nhận hoặc đón tiếp, và ở đây mang sắc thái tích cực.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đều đang mong đợi Người.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Khi ... trở về
  rationale: Cấu trúc ἐν + động từ nguyên mẫu có mạo từ diễn tả thời gian, nên được chuyển tự nhiên thành “khi”. δέ đánh dấu bước chuyển trong mạch kể và không cần dịch thành một từ nối riêng trong tiếng Việt.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt hiện đại; “Đức” tạo sắc thái trang trọng mà không thêm một tước hiệu không có trong câu Hy Lạp.
- source_word: ἀπεδέξατο
  choice: đón tiếp
  rationale: Động từ chỉ việc tiếp nhận với sắc thái tích cực trong ngữ cảnh này. “Đón tiếp” tự nhiên và thể hiện rõ hơn sắc thái ấy so với chỉ “tiếp nhận”.
- source_word: ὁ ὄχλος
  choice: đám đông
  rationale: Diễn đạt tự nhiên danh từ tập hợp chỉ đoàn người đang tụ họp.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: vì tất cả đều đang chờ Người
  rationale: γάρ nêu lý do; πάντες được giữ rõ bằng “tất cả đều”; cấu trúc động từ cùng phân từ được diễn đạt bằng “đang chờ” để bảo toàn khía cạnh tiếp diễn. προσδοκάω cũng có thể mang nghĩa “mong đợi”.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, sáng rõ và trang trọng. Dùng “Người” để quy chiếu về Đức Giê-su, tránh thêm tước hiệu thần học không có trong nguyên văn. Câu giữ nhịp kể tự nhiên và không dịch cứng δέ bằng một từ nối thừa.
