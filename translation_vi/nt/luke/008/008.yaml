id: LUK.8.8
reference: Luke 8:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: vi
  text: 'Một hạt khác rơi vào đất tốt[a]; sau khi mọc lên, nó cho hoa lợi gấp trăm lần. Nói những điều ấy, Đức Giê-su lớn tiếng: “Ai có tai để nghe thì hãy nghe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mảnh đất tốt”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: một hạt khác
  rationale: Tính từ trung tính số ít chỉ một hạt giống khác trong chuỗi các hạt được gieo; thêm “hạt” để quy chiếu rõ ràng và tự nhiên trong tiếng Việt.
- source_word: γῆν τὴν ἀγαθήν
  choice: đất tốt
  rationale: Trong bối cảnh nông nghiệp, “đất tốt” diễn đạt tự nhiên loại đất thích hợp để hạt giống sinh trưởng.
- source_word: φυὲν
  choice: khi mọc lên
  rationale: Phân từ aorist của φύω mô tả sự nảy mọc dẫn đến kết quả; “khi mọc lên” giữ quan hệ thời gian mà không ép thành một trình tự quá cứng.
- source_word: ἐποίησεν καρπὸν
  choice: sinh hoa lợi
  rationale: Diễn đạt thành ngữ về cây trồng cho sản lượng, đồng thời giữ hình ảnh καρπός là kết quả hay mùa quả.
- source_word: ἑκατονταπλασίονα
  choice: gấp trăm lần
  rationale: Thể hiện trực tiếp mức sản lượng tăng lên một trăm lần.
- source_word: ταῦτα λέγων
  choice: nói những điều ấy
  rationale: Giữ nội dung phân từ hiện tại đi kèm hành động lớn tiếng; tiếng Việt cho phép dùng cụm phân từ gọn này.
- source_word: ἐφώνει
  choice: lớn tiếng
  rationale: Diễn tả lời nói được cất lên mạnh và công khai, không nhất thiết hàm ý la hét.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: ai có tai để nghe
  rationale: Cấu trúc đại diện tổng quát được chuyển tự nhiên sang tiếng Việt, không giới hạn ở nam giới và vẫn giữ ý “tai để nghe”.
- source_word: ἀκουέτω
  choice: thì hãy nghe
  rationale: “Hãy nghe” truyền đạt mệnh lệnh ngôi thứ ba theo lối khuyên nhủ, kêu gọi trang trọng và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ngôn ngữ đại diện tổng quát trong lời kêu gọi của Đức Giê-su
  choice: “Ai có tai để nghe thì hãy nghe”
  alternative: “Người nào có tai để nghe, hãy nghe”
  rationale: Đại từ “ai” giữ phạm vi tổng quát của cấu trúc Hy Lạp, không thêm sắc thái chỉ nam giới và không giải thích thay ẩn ý thiêng liêng của lời kêu gọi.
- issue: Sắc thái của hình ảnh καρπός
  choice: “sinh hoa lợi”
  alternative: “kết quả” hoặc “sinh trái”
  rationale: “Hoa lợi” giữ nguyên hình ảnh nông nghiệp và sản lượng của dụ ngôn, tránh biến hình ảnh thành một kết luận thần học trừu tượng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” để chỉ rõ chủ thể vốn được ngữ cảnh xác định; lời kêu gọi cuối câu giữ nhịp ngắn, mạnh. Dấu [a] xuất hiện ngay sau phương án từ vựng liên quan.
