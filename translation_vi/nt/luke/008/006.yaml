  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: vi
  text: Một phần khác rơi trên tảng đá[a]; sau khi mọc lên, nó khô héo vì không có độ ẩm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng danh từ số ít “đá/tảng đá”, giữ hình ảnh hạt giống rơi trên một bề mặt đá, thay vì dùng cách nói rộng hơn như “đất đá sỏi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: một phần khác
  rationale: Tính từ trung tính số ít được dùng như danh từ, chỉ một phần hạt giống khác trong chuỗi của dụ ngôn; cách diễn đạt này tự nhiên trong tiếng Việt và không cần thêm danh từ vốn được hiểu ngầm.
- source_word: κατέπεσεν
  choice: rơi
  rationale: Động từ aorist của καταπίπτω mô tả đơn giản việc hạt giống rơi xuống; “rơi” là cách nói gọn và tự nhiên.
- source_word: ἐπὶ τὴν πέτραν
  choice: trên đá
  rationale: Giữ danh từ số ít πέτρα là “đá”, thay vì mở rộng thành “đất đá sỏi”, qua đó bảo toàn hình ảnh cụ thể và sự mơ hồ của nguyên bản về bề mặt đá.
- source_word: φυὲν
  choice: khi mọc lên
  rationale: Phân từ aorist của φύω biểu thị hành động xảy ra trước động từ chính; mệnh đề thời gian “khi mọc lên” diễn đạt tự nhiên tiến trình hạt nảy mọc.
- source_word: ἐξηράνθη
  choice: khô héo
  rationale: Trong ngữ cảnh cây cối, từ này chỉ việc bị khô hoặc héo đi; “khô héo” vừa giữ ý mất nước vừa phù hợp hình ảnh thực vật.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: vì không có
  rationale: διά cùng động từ nguyên mẫu có mạo từ diễn tả nguyên nhân; “vì không có” giữ rõ quan hệ nhân quả.
- source_word: ἰκμάδα
  choice: độ ẩm
  rationale: ἰκμάς chỉ lượng ẩm cần cho sự sống và tăng trưởng; “độ ẩm” rõ nghĩa, hiện đại và không thu hẹp nghĩa thành “nhựa cây”.
