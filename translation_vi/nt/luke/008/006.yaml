  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc kể chuyện ngắn gọn của dụ ngôn; dấu chấm phẩy làm rõ hai giai đoạn rơi xuống và mọc lên rồi khô héo.
