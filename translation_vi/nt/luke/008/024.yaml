- from: 'Họ đến đánh thức Ngài và nói: “Thầy ơi, Thầy ơi, chúng ta sắp chết mất!” Ngài thức dậy, quở gió và sóng nước[a]; chúng liền lặng xuống, và mặt hồ trở nên yên ả.'
  to: 'Họ đến đánh thức Ngài và nói: “Thầy ơi, Thầy ơi, chúng ta chết mất!” Ngài thức dậy, quở gió và sự cuộn trào của nước; chúng liền lặng xuống, và có sự yên ả.'
