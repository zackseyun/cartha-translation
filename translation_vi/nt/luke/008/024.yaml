id: LUK.8.24
reference: Luke 8:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: vi
  text: 'Họ đến đánh thức Ngài và nói: “Thầy ơi, Thầy ơi, chúng ta chết mất!” Ngài thức dậy, quở gió và sự cuộn trào của nước; chúng liền lặng xuống, và có sự yên ả.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: Họ đến
  rationale: Diễn đạt tự nhiên hành động tiến đến gần Chúa Giê-su trước khi đánh thức Ngài, không thêm chi tiết ngoài nguyên văn.
- source_word: διήγειραν
  choice: đánh thức
  rationale: Động từ ngoại động diễn tả việc họ làm Chúa Giê-su tỉnh giấc; đây là cách nói hiện đại, rõ nghĩa.
- source_word: Ἐπιστάτα
  choice: Thầy ơi
  rationale: Danh xưng đặc trưng trong Lu-ca biểu thị sự nhìn nhận thẩm quyền của Chúa Giê-su. “Thầy” tự nhiên trong tiếng Việt và không giới hạn Ngài vào vai trò giảng dạy đơn thuần trong ngữ cảnh này.
- source_word: ἀπολλύμεθα
  choice: chúng ta sắp chết mất
  rationale: Truyền đạt hiểm nguy chết người đang cận kề và sắc thái khẩn cấp của lời kêu cứu; tự nhiên hơn cách dịch sát hình thức “đang bị diệt mất”.
- source_word: διεγερθεὶς
  choice: Ngài thức dậy
  rationale: Giữ trình tự hành động của phân từ mà không nhấn quá mức thể bị động, vốn không tự nhiên trong tiếng Việt.
- source_word: ἐπετίμησεν
  choice: quở
  rationale: Giữ sắc thái mệnh lệnh nghiêm khắc và đầy thẩm quyền đối với các sức mạnh thiên nhiên, phù hợp cách dùng động từ này trong các sách Phúc Âm.
- source_word: ἀνέμῳ
  choice: gió
  rationale: Giữ nghĩa từ vựng đơn giản, không diễn giải thêm thành “gió bão”.
- source_word: κλύδωνι τοῦ ὕδατος
  choice: sóng nước
  rationale: Cụm từ chỉ sự cuộn trào, dâng động của nước. “Sóng nước” ngắn gọn, tự nhiên và giữ được hình ảnh cụ thể; chú thích nêu cách dịch sát cấu trúc hơn.
- source_word: ἐπαύσαντο
  choice: chúng liền lặng xuống
  rationale: Đại từ số nhiều quy chiếu về gió và sóng nước; “lặng xuống” phù hợp với cả hai hiện tượng và “liền” làm rõ kết quả nối tiếp trong câu.
- source_word: ἐγένετο γαλήνη
  choice: mặt hồ trở nên yên ả
  rationale: Diễn đạt kết quả một cách tự nhiên trong tiếng Việt; “mặt hồ” được suy ra trực tiếp từ bối cảnh nhưng không thêm một tác nhân mới.
theological_decisions:
- issue: Danh xưng Ἐπιστάτα dành cho Chúa Giê-su
  choice: Thầy
  alternative: Chủ; Người chỉ huy
  rationale: “Thầy” là lời xưng hô kính trọng, tự nhiên và có thể biểu thị thẩm quyền trong tiếng Việt, trong khi “Chủ” dễ bị hiểu như một danh hiệu thần học khác và “Người chỉ huy” quá chuyên biệt.
- issue: Thẩm quyền của Chúa Giê-su trên thiên nhiên trong ἐπετίμησεν
  choice: quở
  alternative: ra lệnh nghiêm khắc; truyền cho
  rationale: “Quở” bảo toàn sức mạnh nhân cách hóa và thẩm quyền trực tiếp của động từ Hy Lạp, không giải thích thêm bản chất thần học của thẩm quyền ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Lời kêu cứu được diễn đạt khẩn cấp, tự nhiên; câu kể giữ nhịp nhanh của nguyên văn. Viết hoa “Ngài” theo quy ước tôn kính phổ biến trong tiếng Việt nhưng không thêm danh hiệu thần học.
