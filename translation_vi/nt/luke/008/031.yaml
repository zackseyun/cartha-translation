source:
  edition: SBLGNT
  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: vi
  text: Chúng cứ nài xin Ngài đừng truyền cho chúng phải đi vào vực sâu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chốn sâu thẳm.” Từ Hy Lạp có thể chỉ một độ sâu mênh mông; tại đây, từ này có lẽ nói đến vực sâu như nơi giam giữ các tà linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: cứ nài xin
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn hoặc lặp lại; “cứ nài xin” truyền đạt sự khẩn thiết và kéo dài một cách tự nhiên trong tiếng Việt.
- source_word: ἐπιτάξῃ
  choice: truyền
  rationale: Động từ chỉ việc ban lệnh bằng thẩm quyền. “Truyền” vừa trang trọng vừa thể hiện rõ thẩm quyền của Chúa Giê-su trong ngữ cảnh.
- source_word: ἄβυσσον
  choice: vực sâu
  rationale: Từ này có thể chỉ một độ sâu mênh mông hoặc vực thẳm; trong ngữ cảnh các quỷ, nó gợi nơi giam giữ siêu nhiên nhưng bản dịch không giải thích quá mức điều Lu-ca nói.
- source_word: ἀπελθεῖν
  choice: đi vào
  rationale: Động từ nguyên mẫu chỉ sự chuyển động đến địa điểm được nêu bằng εἰς. Tiếng Việt tự nhiên diễn đạt cả cụm là “đi vào vực sâu”.
- source_word: ἵνα μὴ
  choice: đừng
  rationale: Sau động từ cầu xin, cấu trúc này nêu nội dung lời khẩn cầu. “Nài xin Ngài đừng…” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: αὐτοῖς
  choice: cho chúng phải
  rationale: Đại từ số nhiều chỉ các quỷ là đối tượng chịu mệnh lệnh; cấu trúc “truyền cho chúng phải…” diễn đạt rõ quan hệ này trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của ἄβυσσος trong ngữ cảnh liên quan đến các quỷ
  choice: “vực sâu,” hàm ý một nơi giam giữ hoặc phán xét siêu nhiên đối với các tà linh
  alternative: “chốn sâu thẳm,” theo nghĩa không gian tổng quát hơn
  rationale: Ngữ cảnh cho thấy các quỷ sợ mệnh lệnh đầy thẩm quyền của Chúa Giê-su. “Vực sâu” giữ được chiều kích siêu nhiên của từ ngữ mà không xác định thêm bản chất hay vị trí của nơi ấy ngoài điều bản văn nói.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Chúng” phù hợp với tiền ngữ cảnh là nhiều quỷ; “Ngài” duy trì cách xưng hô tôn kính. Dùng “cứ nài xin” để thể hiện thể chưa hoàn thành, và giữ “vực sâu” đủ mở để bảo toàn sắc thái từ vựng lẫn căng thẳng thần học của nguyên văn.
