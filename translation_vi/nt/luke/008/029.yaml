revisions:
- from: Vì Đức Chúa Jêsus đã truyền cho tà linh phải ra khỏi người ấy. Bởi nhiều lần nó đã khống chế ông; người ta canh giữ ông và dùng xiềng cùng cùm chân trói ông lại, nhưng ông bứt đứt các dây trói, rồi bị quỷ đuổi vào những nơi hoang vắng.[a]
  to: Vì Đức Giê-su đã truyền cho tà linh phải ra khỏi người ấy. Vì nó đã nhiều lần[a] chộp lấy người ấy; người ấy bị trói bằng xiềng xích và cùm chân, dưới sự canh giữ; và sau khi bứt đứt dây trói, người ấy bị quỷ xua vào những nơi hoang vắng.
  rationale: Bản sửa giữ trực tiếp các tác nhân thuộc linh và tính cưỡng bách của trình thuật, đồng thời bỏ liên từ đối lập không có trong nguyên văn. Cú pháp được điều chỉnh cho tiếng Việt hiện đại; chú thích được neo đúng sau cụm πολλοῖς χρόνοις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Cần sửa vài điểm để sát nguyên văn hơn: πολλοῖς χρόνοις nên đặt tự nhiên là “đã nhiều lần” (với chú thích về nghĩa thời lượng), và liên từ καί không nên chuyển thành “nhưng,” vốn thêm đối lập. “Bị quỷ xua vào” diễn đạt rõ tính cưỡng bách của ἠλαύνετο hơn “bị quỷ đuổi.”'
  naturalness: 'Bản thảo nhìn chung dễ hiểu, nhưng “Bởi nhiều lần nó đã khống chế ông” không tự nhiên trong tiếng Việt hiện đại. Việc sắp xếp lại thành các mệnh đề ngắn hơn làm rõ chuỗi: bị trói và canh giữ, phá dây trói, rồi bị xua đi.'
  terminology: Dùng “tà linh” cho πνεῦμα τὸ ἀκάθαρτον và “quỷ” cho δαιμόνιον là phù hợp, giữ được sự phân biệt thuật ngữ của bản văn. “Đức Giê-su” là dạng tên hiện hành, trung tính hơn về hệ phái; không thêm tước hiệu không có trong câu Hy Lạp này.
  issues:
  - severity: medium
    issue: “Bởi nhiều lần” và vị trí chú thích không tự nhiên/không có mỏ neo ngay tại cụm được chú thích.
    rationale: πολλοῖς χρόνοις có thể diễn đạt lặp lại là “đã nhiều lần”; chú thích về nghĩa “suốt một thời gian dài” phải đặt ngay sau cụm này.
  - severity: medium
    issue: “nhưng” thêm sắc thái đối lập cho καί.
    rationale: Nguyên văn chỉ nối các hành động bằng “và”; bối cảnh có thể hàm ý tương phản, nhưng bản dịch không nên khẳng định quan hệ ấy bằng liên từ đối lập.
  - severity: low
    issue: “đã khống chế” làm mờ hình ảnh mạnh của συνηρπάκει.
    rationale: Động từ chỉ việc chộp lấy, vồ lấy/cưỡng chiếm; “chộp lấy” bảo tồn lực của động từ mà vẫn tự nhiên.
  - severity: low
    issue: “bị quỷ đuổi” có thể gợi việc bị truy đuổi hơn là bị cưỡng bách đưa đi.
    rationale: “Bị quỷ xua vào” phản ánh tốt hơn thể bị động và lực thúc ép của ἠλαύνετο.
  revised_text: Vì Đức Giê-su đã truyền cho tà linh phải ra khỏi người ấy. Vì nó đã nhiều lần[a] chộp lấy người ấy; người ấy bị trói bằng xiềng xích và cùm chân, dưới sự canh giữ; và sau khi bứt đứt dây trói, người ấy bị quỷ xua vào những nơi hoang vắng.
  revised_footnotes:
