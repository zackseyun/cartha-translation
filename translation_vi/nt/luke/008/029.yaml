id: LUK.8.29
reference: Luke 8:29
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: vi
  text: Vì Đức Giê-su đã truyền cho tà linh phải ra khỏi người ấy. Vì nó đã nhiều lần[a] chộp lấy người ấy; người ấy bị trói bằng xiềng xích và cùm chân, dưới sự canh giữ; và sau khi bứt đứt dây trói, người ấy bị quỷ xua vào những nơi hoang vắng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “suốt một thời gian dài.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: đã truyền
  rationale: Thì chưa hoàn thành trong lời giải thích bằng γάρ nêu bối cảnh cho lời đáp trước đó; tiếng Việt tự nhiên dùng “đã truyền” mà không cần mô phỏng hình thái quá khứ hoàn thành.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: tà linh
  rationale: “Tà linh” là cách nói Tân Ước quen thuộc, dễ hiểu trong tiếng Việt hiện đại và vẫn chỉ một linh thể ô uế, độc ác.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: bởi nhiều lần
  rationale: Dạng số nhiều cùng bối cảnh các lần bắt giữ và trói buộc ủng hộ sắc thái lặp lại; vẫn ghi chú khả năng chỉ khoảng thời gian dài.
- source_word: συνηρπάκει
  choice: đã khống chế
  rationale: Diễn đạt việc linh dữ bất ngờ chế ngự và nắm quyền trên người ấy; tự nhiên hơn lối dịch sát “chộp bắt” trong ngữ cảnh.
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: xiềng cùng cùm chân
  rationale: Phân biệt dây xích nói chung với dụng cụ khóa chân, đồng thời dùng từ ngữ phổ thông.
- source_word: φυλασσόμενος
  choice: người ta canh giữ ông
  rationale: Chuyển phân từ bị động thành mệnh đề chủ động vô nhân xưng để câu tiếng Việt rõ và tự nhiên.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: ông bứt đứt các dây trói
  rationale: Giữ sắc thái dùng sức xé đứt; “dây trói” đủ rộng để không lặp lại riêng “xiềng” hay “cùm”.
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: bị quỷ đuổi
  rationale: Giữ thể bị động và sức cưỡng ép của động từ, đồng thời thể hiện tác nhân cá vị δαιμόνιον.
- source_word: εἰς τὰς ἐρήμους
  choice: vào những nơi hoang vắng
  rationale: Giữ số nhiều của nguyên văn và ý về các địa điểm không người ở mà không ấn định địa hình là sa mạc.
theological_decisions:
- issue: Thuật ngữ chỉ thế lực quỷ
  choice: Dịch πνεῦμα ἀκάθαρτον là “tà linh” và δαιμόνιον là “quỷ” theo nghĩa trực tiếp
  alternative: “uế linh” và “quỷ thần”; hoặc diễn giải như tình trạng tâm lý
  rationale: Trình thuật phân biệt các thuật ngữ nhưng đều trình bày tác nhân thuộc linh có tính cá vị; không nên làm nhẹ thành ẩn dụ hay bệnh lý, cũng không thêm hệ thống giáo phái.
- issue: Quan hệ giữa việc bứt dây trói và bị đuổi đi
  choice: Dùng “nhưng… rồi” để làm rõ diễn tiến và sự tương phản hàm ý trong ngữ cảnh
  alternative: Nối sát bằng nhiều lần “và”
  rationale: 'καί là liên từ đơn giản, nhưng tiếng Việt cần liên kết tự nhiên; cách dịch không đổi quan hệ căn bản: ông bứt dây trói và sau đó bị quỷ cưỡng ép đi.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Jêsus” theo lối Kinh Thánh Tin Lành Việt Nam; câu chủ động hóa một phân từ để tránh cấu trúc nặng nề. Dấu chân chú [a] đặt ngay sau câu vì chú thích liên quan đến cụm ở giữa câu.
