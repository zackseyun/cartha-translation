  revision_rationale: Bản sửa giữ trực tiếp các tác nhân thuộc linh và tính cưỡng bách của trình thuật, đồng thời bỏ liên từ đối lập không có trong nguyên văn. Cú pháp được điều chỉnh cho tiếng Việt hiện đại; chú thích được neo đúng sau cụm πολλοῖς χρόνοις.
