source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: vi
  text: Toàn thể đám đông từ vùng phụ cận của người Ghê-ra-sê xin Ngài rời khỏi họ, vì họ bị nỗi sợ hãi lớn chế ngự.[a] Ngài lên thuyền và trở về.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị nỗi sợ hãi lớn áp đảo.”'
    reason: Phản ánh cách hiểu từ vựng khác của συνείχοντο, diễn tả tình trạng bị nỗi sợ nắm giữ mạnh mẽ.
lexical_decisions:
- source_word: ἠρώτησεν
  choice: xin
  rationale: Trong cấu trúc với động từ nguyên mẫu, ἐρωτάω diễn tả một lời yêu cầu. “Xin” tự nhiên trong tiếng Việt và không cường điệu mức độ như “van xin”.
- source_word: ἅπαν τὸ πλῆθος
  choice: toàn thể dân chúng
  rationale: Giữ sức nhấn mạnh bao quát của ἅπαν, đồng thời “dân chúng” tự nhiên hơn “đám đông” khi nói về người dân từ cả một vùng.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: trong vùng chung quanh miền Ghê-ra-sa
  rationale: περίχωρος chỉ vùng phụ cận; cách diễn đạt này giữ địa danh theo bản Hy Lạp được cung cấp và tạo cú pháp tiếng Việt rõ ràng.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: rời khỏi họ
  rationale: Diễn đạt trực tiếp nội dung lời yêu cầu và giữ ý tách khỏi những người ấy của ἀπό.
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: bị một nỗi sợ hãi lớn chế ngự
  rationale: Giữ hình thái bị động và sức mạnh của συνέχω, đồng thời chuyển φόβῳ μεγάλῳ sát nghĩa mà không xác định bản chất của nỗi sợ.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: lên thuyền
  rationale: Đây là cách nói tự nhiên trong tiếng Việt cho hành động bước vào thuyền; tiếng Việt không bắt buộc biểu thị mạo từ bất định.
- source_word: ὑπέστρεψεν
  choice: trở về
  rationale: Diễn đạt ngắn gọn và chính xác ý quay trở lại của ὑποστρέφω.
theological_decisions:
- issue: Bản chất nỗi sợ của dân chúng trước Đức Giê-su
  choice: Chỉ thuật lại rằng nỗi sợ hãi lớn đã chế ngự họ và thúc đẩy lời yêu cầu Ngài rời đi.
  alternative: Giải thích đó là lòng kính sợ quyền năng thần linh, hoặc là thái độ thù nghịch do thiệt hại kinh tế hay xáo trộn xã hội.
  rationale: Câu Hy Lạp không xác định nỗi sợ mang tính tôn kính, thù nghịch hay pha trộn; bản dịch giữ nguyên sự căng thẳng và mơ hồ ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Đức Giê-su mà không thêm tên không có trong câu Hy Lạp; “miền Ghê-ra-sa” giữ nguyên địa danh theo SBLGNT.
