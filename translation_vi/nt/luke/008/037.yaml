revisions:
- from: Toàn thể dân chúng trong vùng chung quanh miền Ghê-ra-sa xin Ngài rời khỏi họ, vì họ bị một nỗi sợ hãi lớn chế ngự.[a] Ngài lên thuyền và trở về.
  to: Toàn thể đám đông từ vùng phụ cận của người Ghê-ra-sê xin Ngài rời khỏi họ, vì họ bị nỗi sợ hãi lớn chế ngự.[a] Ngài lên thuyền và trở về.
  rationale: Sửa cụm địa lý–dân cư để phản ánh τῆς περιχώρου τῶν Γερασηνῶν cách minh bạch và tự nhiên hơn, đồng thời điều chỉnh phương án chú thích cho sát sắc thái của συνέχω. Không thay đổi tính mơ hồ của nguyên nhân sâu xa hay bản chất nỗi sợ.
  reviewer_model: gpt-5.6-terra
