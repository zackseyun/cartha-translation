review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: toàn thể đám đông yêu cầu Đức Giê-su rời đi vì bị nỗi sợ lớn khống chế, rồi Ngài xuống thuyền trở về. Tuy nhiên, cụm “trong vùng chung quanh miền Ghê-ra-sa” không phản ánh rõ cấu trúc τῆς περιχώρου τῶν Γερασηνῶν (“vùng phụ cận của người Ghê-ra-sê”) và tạo cách kết hợp địa lý chưa tự nhiên.'
  naturalness: “Toàn thể dân chúng trong vùng chung quanh miền Ghê-ra-sa” hơi gượng trong tiếng Việt hiện đại. “Toàn thể đám đông từ vùng phụ cận của người Ghê-ra-sê” vừa tự nhiên hơn vừa cho thấy đám đông xuất thân từ vùng ấy. Các phần còn lại, gồm “xin Ngài rời khỏi họ,” “bị nỗi sợ hãi lớn chế ngự,” và “lên thuyền và trở về,” phù hợp văn phong tường thuật trang trọng hiện đại.
  terminology: Giữ “Ngài” là nhất quán với ngữ cảnh và không thêm thông tin. “Người Ghê-ra-sê” biểu thị Γερασηνῶν là tên dân cư, thay vì chuyển nó thành “miền Ghê-ra-sa,” nhờ đó sát văn bản Hy Lạp hơn. Chú thích được chỉnh để đưa ra phương án gần hơn với sắc thái bị nắm giữ/áp đảo của συνείχοντο.
  issues:
  - severity: medium
    issue: Cụm chỉ địa bàn và dân cư chưa sát cấu trúc Hy Lạp.
    rationale: τῆς περιχώρου τῶν Γερασηνῶν nói về vùng phụ cận liên hệ với “người Ghê-ra-sê”; “vùng chung quanh miền Ghê-ra-sa” vừa không rõ quan hệ này vừa có cấu trúc tiếng Việt nặng.
  - severity: low
    issue: Chú thích dùng “bao trùm” chưa phải phương án gần nhất cho συνέχω.
    rationale: Trong ngữ cảnh này, συνέχω diễn tả bị giữ chặt, khống chế hoặc áp đảo bởi nỗi sợ. “Áp đảo” bảo toàn lực của động từ tốt hơn mà không giải thích nguyên nhân hay bản chất nỗi sợ.
  revised_text: Toàn thể đám đông từ vùng phụ cận của người Ghê-ra-sê xin Ngài rời khỏi họ, vì họ bị nỗi sợ hãi lớn chế ngự.[a] Ngài lên thuyền và trở về.
