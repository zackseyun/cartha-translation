  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: vi
  text: 'Nhưng Người trả lời họ: “Mẹ và anh em[a] của Ta chính là những người nghe lời Đức Chúa Trời và làm theo lời ấy.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”. Từ Hy Lạp ở đây là dạng giống đực số nhiều, nghĩa trực tiếp là “anh em trai”; tuy nhiên, phạm vi áp dụng của lời này có thể không chỉ giới hạn ở nam giới.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: trả lời họ
  rationale: Diễn đạt tự nhiên trong tiếng Việt ý của cặp động từ kể chuyện “đáp lại và nói”, đồng thời giữ rõ đối tượng được nói với.
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: Mẹ và anh em của Ta
  rationale: Giữ cách gọi thân thuộc và hình thức giống đực số nhiều của ἀδελφοί; đại từ sở hữu đặt cuối cụm phối hợp là tự nhiên trong tiếng Việt và áp dụng cho cả hai danh từ.
- source_word: οὗτοί εἰσιν οἱ
  choice: chính là những người
  rationale: “Chính là” bảo tồn sắc thái xác định, nhấn mạnh của đại từ chỉ định οὗτοι mà không tạo cấu trúc gượng gạo trong tiếng Việt.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: “Lời” giữ được nghĩa về sứ điệp hay lời truyền dạy của Đức Chúa Trời và âm hưởng thần học quen thuộc của λόγος trong ngữ cảnh.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: nghe ... và làm theo lời ấy
  rationale: Hai động từ hiện tại phân từ mô tả đặc điểm liên tục của nhóm người này. “Làm theo lời ấy” tự nhiên hơn “làm nó” trong tiếng Việt mà không thu hẹp nghĩa thành một thuật ngữ giải nghĩa như “vâng phục”.
theological_decisions:
- issue: Phạm vi gia đình được Chúa Giê-su xác định lại
  choice: Lời nói xác định mẹ và anh em của Người là những người nghe và làm theo lời Đức Chúa Trời, nhưng không thêm ý rằng Người phủ nhận gia đình huyết thống.
  alternative: Hiểu câu này là sự bác bỏ hoàn toàn mẹ và anh em ruột của Người.
  rationale: Bản văn mở rộng ý niệm gia đình quanh việc đáp ứng lời Đức Chúa Trời, nhưng không trực tiếp tuyên bố phủ nhận quan hệ huyết thống.
- issue: Phạm vi giới tính của ἀδελφοί
  choice: Giữ “anh em” trong chính văn và nêu “anh chị em” như một khả năng ở chú thích.
  alternative: Dịch thẳng trong chính văn là “anh chị em”.
  rationale: Cách này giữ hình thức giống đực của từ Hy Lạp và sự liên hệ với các anh em trai theo huyết thống trong văn cảnh, đồng thời không loại bỏ khả năng lời tuyên bố được áp dụng rộng hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “Người” để chỉ Chúa Giê-su và “Ta” trong lời trực tiếp; tránh lối dịch máy móc “đáp lại và nói”. Cấu trúc “chính là những người” vừa tự nhiên vừa giữ được sức nhấn của nguyên văn.
