  terminology: “Heo,” “nài xin,” “cho phép,” và “nhập vào” phù hợp với tiếng Việt hiện đại và ngữ vực Kinh Thánh trang trọng vừa phải. Viết hoa “Ngài” nhất quán với quy ước chỉ Chúa Giê-su. Chú thích về “chúng” là thích hợp và không áp đặt diễn giải giáo phái.
  issues:
  - severity: medium
    issue: Cụm “một đàn heo đông” không tự nhiên trong tiếng Việt hiện đại.
    rationale: “Đông” thường cần được bổ nghĩa như “rất đông” hoặc được thay bằng một cách gọi quy mô đàn tự nhiên hơn. “Một đàn heo lớn” truyền đạt tốt ἱκανῶν trong ngữ cảnh.
  - severity: low
    issue: “Nhập vào đàn heo ấy” dùng danh từ tập hợp, trong khi ἐκείνους là đại từ số nhiều chỉ các con heo.
    rationale: Cách dịch hiện có vẫn hiểu được, nhưng “những con heo ấy” phản ánh rõ hơn đối tượng số nhiều của động từ “đi vào/nhập vào.”
  - severity: low
    issue: Mệnh đề cuối không nêu lại đối tượng được cho phép.
    rationale: “Ngài cho phép chúng” giữ được αὐτοῖς và làm nổi bật sự tương ứng với lời thỉnh cầu, mà vẫn tự nhiên trong tiếng Việt.
