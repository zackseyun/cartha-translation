  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: vi
  text: Ở đó, trên núi, có một đàn heo lớn đang kiếm ăn. Chúng[b] nài xin Ngài cho phép chúng nhập vào những con heo ấy, và Ngài cho phép chúng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Chúng” chỉ các quỷ hoặc uế linh trong văn cảnh chung quanh; một số bản dịch nói rõ là “các quỷ”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: một đàn heo đông
  rationale: ἀγέλη χοίρων là một đàn heo; ἱκανῶν chỉ số lượng đáng kể. “Đàn heo đông” tự nhiên trong tiếng Việt và giữ trọng tâm về số lượng.
- source_word: βοσκομένη
  choice: đang kiếm ăn
  rationale: Diễn tả hoạt động ăn của đàn heo mà không thu hẹp nghĩa thành chỉ gặm cỏ hay hàm ý có người cho ăn.
- source_word: ἐν τῷ ὄρει
  choice: trên núi
  rationale: Theo sát nghĩa thông thường của ὄρος và tránh diễn giải cụ thể hơn thành sườn đồi.
- source_word: παρεκάλεσαν
  choice: nài xin
  rationale: Thể hiện lời cầu xin khẩn thiết, trang trọng và tự nhiên hơn “van nài” trong văn cảnh này.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: cho phép / cho phép
  rationale: Lặp lại cùng một cách diễn đạt để bảo toàn sự tương ứng giữa lời xin và sự đáp ứng trong nguyên văn.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: nhập vào đàn heo ấy
  rationale: “Nhập vào” diễn đạt chuyển động đi vào và phù hợp với văn cảnh các quỷ nhập vào vật chủ; “đàn heo ấy” thể hiện rõ đại từ chỉ định ἐκείνους theo cách tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: không dịch thành một trạng từ thời gian riêng
  rationale: δὲ chỉ nối tiếp diễn tiến câu chuyện; cấu trúc tiếng Việt đã chuyển đoạn tự nhiên mà không cần thêm “bấy giờ” hoặc “lúc ấy”.
theological_decisions:
- issue: Chủ thể số nhiều của παρεκάλεσαν
  choice: Giữ đại từ “chúng”, với chú thích xác định sở chỉ theo văn cảnh là các quỷ/uế linh.
  alternative: Dịch rõ là “các quỷ nài xin Ngài”.
  rationale: Nguyên văn chỉ dùng động từ số nhiều, không lặp lại danh từ “các quỷ”. Giữ đại từ bảo toàn tính hàm ẩn của câu Hy Lạp, còn chú thích giúp câu đứng riêng vẫn rõ nghĩa.
- issue: Đối tượng được xin phép nhập vào
  choice: “đàn heo ấy”
  alternative: “những con heo ấy”
  rationale: Đại từ ἐκείνους quy chiếu các con heo; tiếng Việt tự nhiên có thể dùng danh từ tập hợp “đàn heo ấy” mà không thay đổi nội dung thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “heo” là từ phổ thông trung tính; viết hoa “Ngài” để chỉ Chúa Giê-su theo quy ước văn phong Kinh Thánh tiếng Việt. Câu được chia làm hai để tránh chuỗi liên từ nặng nề, nhưng vẫn giữ nguyên trình tự các mệnh đề.
