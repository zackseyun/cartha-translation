source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: vi
  text: 'Nhưng Đức Chúa Giê-su, khi nghe điều đó, trả lời ông: “Đừng sợ; chỉ cần tin[a], thì con gái ông sẽ được cứu[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “chỉ cần có đức tin” hoặc “chỉ cần tin cậy.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sẽ được chữa lành” hoặc “sẽ được lành.” Động từ Hy Lạp có thể mang nghĩa cứu, giải thoát hoặc chữa lành; trong văn cảnh này, từ này hướng đến việc phục hồi sự sống cho cô bé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: nghe vậy
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; “nghe vậy” diễn đạt tự nhiên và làm rõ điều được nghe từ văn cảnh.
- source_word: ἀπεκρίθη αὐτῷ
  choice: liền đáp với ông
  rationale: Diễn đạt thành ngữ ἀποκρίνομαι với tặng cách; “liền” thể hiện mạch hành động kế tiếp mà không thêm nội dung mới.
- source_word: Μὴ φοβοῦ
  choice: Đừng sợ
  rationale: Mệnh lệnh phủ định được chuyển sang cách nói ngắn gọn, tự nhiên và trang trọng trong tiếng Việt.
- source_word: μόνον πίστευσον
  choice: chỉ tin thôi
  rationale: Giữ sắc thái giới hạn của μόνον và lực mệnh lệnh của πίστευσον bằng một cấu trúc tiếng Việt tự nhiên.
- source_word: σωθήσεται
  choice: sẽ được cứu
  rationale: Giữ nghĩa rộng của σῴζω và hình thức bị động, đồng thời không thu hẹp ý nghĩa chỉ còn chữa lành thể xác; văn cảnh cho thấy đối tượng là con gái của ông Giai-ru.
theological_decisions:
- issue: Cách dịch πίστευσον trong mệnh lệnh của Đức Chúa Jêsus
  choice: tin
  alternative: có đức tin; tin cậy
  rationale: “Tin” là tương đương trực tiếp và tự nhiên của động từ πιστεύω; chú thích giữ lại sắc thái phó thác của “tin cậy” và cách diễn đạt “có đức tin” để tránh hiểu đây chỉ là sự chấp nhận bằng trí óc.
- issue: Cách dịch σωθήσεται trong bối cảnh phục hồi sự sống
  choice: sẽ được cứu
  alternative: sẽ được chữa lành; sẽ được làm cho khỏe lại
  rationale: “Được cứu” bảo toàn phạm vi nghĩa rộng của σῴζω—cứu, giải thoát hoặc chữa lành—và không âm thầm loại bỏ chiều kích thần học; các cách hiểu cụ thể theo văn cảnh được ghi ở chú thích.
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. “Đức Chúa Jêsus” theo văn phong Kinh Thánh Tin Lành quen thuộc; câu trực tiếp ngắn gọn giữ tính khẩn thiết và an ủi của lời phán. Chủ ngữ hàm ẩn giống cái trong σωθήσεται được diễn đạt là “con gái ông” theo văn cảnh để câu tiếng Việt rõ nghĩa.
