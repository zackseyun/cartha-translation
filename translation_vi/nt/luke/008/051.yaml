source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: vi
  text: Khi Ngài vào nhà, Ngài không cho ai vào cùng Ngài, ngoại trừ Phi-e-rơ, Giăng, Gia-cơ, cha và mẹ của cô bé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: Khi đến nhà
  rationale: Phân từ bất định ἐλθών diễn tả hoàn cảnh thời gian; “khi đến” tự nhiên trong tiếng Việt. δέ nối tiếp câu chuyện và không nhất thiết phải dịch riêng. οἰκία là “nhà”.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν τινα σὺν αὐτῷ
  choice: Ngài không cho ai vào cùng mình
  rationale: ἀφίημι trong ngữ cảnh này có nghĩa là cho phép; τινα dưới phạm vi phủ định mang nghĩa “ai”; cụm “vào cùng mình” giữ quan hệ của σὺν αὐτῷ với hành động đi vào.
- source_word: εἰ μὴ
  choice: ngoại trừ
  rationale: Sau mệnh đề phủ định, cụm này nêu ngoại lệ chứ không diễn tả điều kiện.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Phi-e-rơ, Giăng, Gia-cơ
  rationale: Dùng các dạng tên riêng quen thuộc trong tiếng Việt; dấu phẩy tạo danh sách tự nhiên mà vẫn giữ đủ ba người.
- source_word: τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα
  choice: cha và mẹ của bé gái
  rationale: παῖς có thể chỉ trẻ em nói chung, nhưng văn cảnh xác định đây là con gái của Giai-ru. Cách diễn đạt này giữ việc nhắc riêng cả cha lẫn mẹ.
theological_decisions:
- issue: Mức độ cụ thể của παῖς
  choice: bé gái
  alternative: đứa trẻ
  rationale: Danh từ παῖς tự nó có thể mang nghĩa chung là “đứa trẻ”, nhưng văn cảnh trực tiếp xác định đứa trẻ là con gái; “bé gái” vì vậy rõ ràng và tự nhiên mà không thêm một kết luận thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ngài” để chỉ Chúa Giê-su nhằm tránh đại từ thiếu chủ thể trong tiếng Việt; “cùng mình” phản ánh αὐτῷ mà không lặp “Ngài” nặng nề.
