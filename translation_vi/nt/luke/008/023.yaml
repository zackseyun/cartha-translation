  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: vi
  text: Khi họ đang đi thuyền, Ngài ngủ thiếp đi. Một trận bão gió ập xuống hồ, và họ bị nước tràn ngập[a] và lâm nguy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ đang đầy nước”; theo ngữ cảnh, có thể hiểu là thuyền đang đầy nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Khi họ đang đi thuyền
  rationale: Cấu trúc sở hữu cách độc lập với phân từ hiện tại diễn tả hành động đang tiếp diễn làm bối cảnh; cách dịch này tự nhiên trong tiếng Việt.
- source_word: ἀφύπνωσεν
  choice: Đức Chúa Jêsus ngủ thiếp đi
  rationale: Động từ aorist có sắc thái khởi đầu, nên “ngủ thiếp đi” diễn tả việc bắt đầu ngủ; chủ thể được nêu rõ từ văn cảnh để tránh đại từ mơ hồ.
- source_word: κατέβη
  choice: ập xuống
  rationale: Giữ hình ảnh cơn gió từ trên cao tràn xuống, đồng thời truyền đạt tính bất ngờ và dữ dội của biến cố thời tiết.
- source_word: λαῖλαψ ἀνέμου
  choice: một trận cuồng phong
  rationale: Cụm từ chỉ một cơn bão gió dữ dội; “cuồng phong” ngắn gọn, trang trọng và dễ hiểu.
- source_word: εἰς τὴν λίμνην
  choice: xuống hồ
  rationale: Kết hợp tự nhiên với κατέβη, vừa giữ hướng chuyển động của εἰς vừa phù hợp với cách nói tiếng Việt.
- source_word: συνεπληροῦντο
  choice: thuyền ngập nước
  rationale: Dạng số nhiều bị động có thể quy chiếu đến những người trên thuyền đang bị nước tràn ngập, nhưng theo cảnh huống, chiếc thuyền đầy nước là ý được hàm chứa; bản dịch nêu vật được hiểu ngầm để câu tiếng Việt rõ ràng.
- source_word: ἐκινδύνευον
  choice: khiến họ lâm nguy
  rationale: Diễn tả tình trạng nguy hiểm đang tiếp diễn và liên kết tự nhiên với việc thuyền ngập nước.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” để xác định chủ thể theo văn cảnh; giữ hình ảnh cuồng phong ập từ trên xuống và dùng chú thích để bảo tồn nét mơ hồ về chủ thể số nhiều của συνεπληροῦντο.
