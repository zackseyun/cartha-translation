revisions:
- from: Khi họ đang đi thuyền, Đức Chúa Jêsus ngủ thiếp đi. Bấy giờ, một trận cuồng phong ập xuống hồ; thuyền ngập nước[a], khiến họ lâm nguy.
  to: Khi họ đang đi thuyền, Ngài ngủ thiếp đi. Một trận bão gió ập xuống hồ, và họ bị nước tràn ngập[a] và lâm nguy.
  rationale: Bản sửa bảo toàn sắc thái khởi đầu của ἀφύπνωσεν (“ngủ thiếp đi”), tính đang tiếp diễn của các phân từ/động từ bất toàn, và hình ảnh bão gió “ập xuống” hồ. Cách dịch συνεπληροῦντο được giữ ở dạng số nhiều, còn cách hiểu về thuyền được chuyển sang chú thích để không xác định hóa bản văn. Danh hiệu không có trong câu Hy Lạp được loại bỏ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng diễn tiến chính, nhưng “thuyền ngập nước” chuyển chủ thể số nhiều bị động của συνεπληροῦντο thành một chủ thể số ít được suy ra. Mệnh đề “khiến họ lâm nguy” cũng làm tình trạng nguy hiểm có sắc thái hệ quả rõ hơn liên kết đẳng lập của nguyên văn. Bản sửa giữ hai tình trạng đang tiếp diễn và không xác định quá mức chủ thể/hình ảnh của συνεπληροῦντο.
  naturalness: '“Đức Chúa Jêsus” không phải cách viết hiện đại trung tính: chính tả “Jêsus” có tính truyền thống/giáo phái, và danh hiệu “Đức Chúa” không có trong câu Hy Lạp. Dùng đại từ “Ngài” dựa vào chủ thể đã rõ từ ngữ cảnh vừa tự nhiên trong văn phong Kinh Thánh hiện đại vừa tránh thêm danh hiệu. “Bão gió ập xuống hồ” là cách nói rõ và tự nhiên.'
  terminology: Dùng “Ngài” thay vì thêm “Đức Chúa Jêsus”; dùng “bão gió” cho λαῖλαψ ἀνέμου. “Lâm nguy” phù hợp thanh điệu trang trọng hiện đại và diễn tả ἐκινδύνευον.
  issues:
  - severity: medium
    issue: Thêm danh hiệu và dùng chính tả tên riêng không trung tính hiện đại
    rationale: ἀφύπνωσεν chỉ có chủ ngữ ngầm từ ngữ cảnh, không có danh hiệu trong câu. “Đức Chúa Jêsus” vừa thêm danh hiệu vừa dùng lối viết “Jêsus” không phải chuẩn hiện đại phổ thông.
  - severity: medium
    issue: “Thuyền ngập nước” xác định hóa συνεπληροῦντο
    rationale: Động từ là số nhiều bị động; dù bối cảnh có thể hàm ý thuyền đang đầy nước, bản văn không nêu danh từ “thuyền” tại đây. Nên để cách diễn đạt tiếng Việt phản ánh những người trên thuyền đang bị nước tràn ngập và ghi chú khả năng hiểu theo con thuyền.
  - severity: low
    issue: Liên kết nhân quả “khiến”
    rationale: Hai động từ bất toàn συνεπληροῦντο và ἐκινδύνευον được nối bằng καὶ, mô tả hai tình trạng song hành. “và” bảo toàn cấu trúc và sắc thái hơn.
  revised_text: Khi họ đang đi thuyền, Ngài ngủ thiếp đi. Một trận bão gió ập xuống hồ, và họ bị nước tràn ngập[a] và lâm nguy.
