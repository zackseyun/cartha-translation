translation:
  language: vi
  text: 'Đây là dụ ngôn: hạt giống là lời của Đức Chúa Trời.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “Đây là ý nghĩa của dụ ngôn.” Tiếng Hy Lạp dịch sát là: “Đây là dụ ngôn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: là
  rationale: Động từ hệ từ trực tiếp mở đầu phần giải thích của Đức Chúa Jêsus; “là” giữ cấu trúc của nguyên văn mà không thêm ý “có nghĩa là”.
- source_word: δὲ
  choice: không dịch thành từ riêng
  rationale: δέ đánh dấu sự chuyển ý nhẹ. Trong tiếng Việt, sự chuyển từ dụ ngôn sang lời giải thích đã rõ qua ngữ cảnh; thêm “bây giờ” dễ tạo sắc thái thời gian không có trong nguyên văn.
- source_word: αὕτη ἡ παραβολή
  choice: Đây là dụ ngôn
  rationale: Cách dịch sát giữ cách diễn đạt của tiếng Hy Lạp. “Đây là ý nghĩa của dụ ngôn” rõ nghĩa theo ngữ cảnh hơn nhưng thêm danh từ “ý nghĩa” vốn không có trong nguyên văn.
- source_word: ὁ σπόρος
  choice: Hạt giống
  rationale: Danh từ số ít được giữ lại, vừa tự nhiên trong tiếng Việt vừa duy trì hình ảnh trung tâm của dụ ngôn.
- source_word: ὁ λόγος
  choice: lời
  rationale: Ở đây λόγος chỉ điều Đức Chúa Trời truyền đạt. “Lời” tự nhiên, giữ sắc thái Kinh Thánh và không thu hẹp nghĩa như một cách diễn giải chi tiết hơn.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Dịch trực tiếp sở hữu cách Hy Lạp, không diễn giải thành “đến từ Đức Chúa Trời”.
theological_decisions:
- issue: Có nên mở rộng παραβολή thành “ý nghĩa/lời giải thích của dụ ngôn” hay không
  choice: dụ ngôn
  alternative: ý nghĩa của dụ ngôn
  rationale: Ngữ cảnh cho thấy Đức Chúa Jêsus đang giải nghĩa, nhưng nguyên văn nói sát là “Đây là dụ ngôn.” Bản dịch giữ sự căng thẳng giữa cách diễn đạt và chức năng trong ngữ cảnh, thay vì âm thầm thêm ý diễn giải.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “dụ ngôn,” “lời” và “Đức Chúa Trời” để giữ sắc thái Kinh Thánh quen thuộc; không thêm một liên từ mở đầu vì tiếng Việt không cần biểu thị riêng sắc thái chuyển ý nhẹ của δέ ở đây.
