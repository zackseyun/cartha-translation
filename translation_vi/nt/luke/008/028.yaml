revisions:
- from: 'Nhưng khi thấy Đức Giê-su, nó kêu lên, sấp mình trước mặt Ngài và lớn tiếng nói: “Hỡi Giê-su, Con Đức Chúa Trời Chí Cao, Ngài có can hệ gì với tôi?[a] Tôi van Ngài, xin đừng hành hạ tôi.”'
  to: 'Nhưng khi thấy Đức Giê-su, người ấy kêu lên, ngã xuống trước mặt Ngài và lớn tiếng nói: “Hỡi Giê-su, Con của Đức Chúa Trời Tối Cao, Ngài có liên can gì với tôi?[a] Tôi van Ngài, xin đừng hành hạ tôi.”'
  rationale: Bản sửa làm rõ chủ ngữ theo mạch văn, tránh diễn giải quá mức về tư thế, và chuẩn hóa tước hiệu “Đức Chúa Trời Tối Cao.” Thành ngữ Hy Lạp vẫn được chuyển ngữ theo nghĩa phản đối/xa cách, đồng thời chú thích giữ cách đọc sát chữ. Không thay đổi ý nghĩa hay thêm giải thích giáo phái.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:26Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp truyền đạt đúng các hành động chính và lời khẩn cầu. Tuy nhiên, chủ ngữ của ἰδών/προσέπεσεν là người đàn ông bị quỷ ám trong mạch văn, nên “nó” dễ quy chiếu trực tiếp đến quỷ và có sắc thái phi nhân hóa không cần thiết. “Sấp mình” cũng diễn giải tư thế cụ thể hơn προσέπεσεν; “ngã xuống trước mặt” gần với nguyên văn hơn. Tước hiệu τοῦ θεοῦ τοῦ ὑψίστου nên được dịch tự nhiên là “Đức Chúa Trời Tối Cao,” không phải “Đức Chúa Trời Chí Cao.”
  naturalness: “Người ấy” rõ ràng, trang trọng và tự nhiên hơn “nó” trong văn mạch này. “Ngã xuống trước mặt Ngài” là lối kể hiện đại, không gán thêm tư thế phủ phục hoàn toàn. “Liên can gì với tôi” tự nhiên và vẫn giữ sắc thái phản đối, xa cách của thành ngữ Τί ἐμοὶ καὶ σοί.
  terminology: Giữ “Đức Giê-su,” “Ngài,” và “Con của Đức Chúa Trời Tối Cao.” Cách gọi sau là hình thức tiếng Việt chuẩn, bảo toàn đầy đủ tước hiệu “Son of the Most High God” mà không thêm diễn giải tín lý.
  issues:
  - severity: medium
    issue: “nó” làm mơ hồ và có thể phi nhân hóa chủ ngữ.
    rationale: Các phân từ và động từ số ít trong câu Hy Lạp quy chiếu người đàn ông trong câu trước; dù lời nói biểu lộ tiếng nói của quỷ, bản văn không đổi chủ ngữ ngữ pháp sang “nó.” “Người ấy” bảo toàn mạch kể và tránh sắc thái không cần thiết.
  - severity: low
    issue: “sấp mình” cụ thể hóa mức độ tư thế của προσέπεσεν.
    rationale: προσέπεσεν diễn tả ngã xuống trước một người; không nhất thiết xác định là nằm sấp. “Ngã xuống trước mặt Ngài” sát và trung tính hơn.
  - severity: medium
    issue: “Đức Chúa Trời Chí Cao” không phải trật tự tước hiệu tự nhiên trong tiếng Việt hiện đại.
    rationale: τοῦ θεοῦ τοῦ ὑψίστου có nghĩa “Đức Chúa Trời Tối Cao”; trật tự này rõ nghĩa và phù hợp cách dùng tước hiệu thông thường.
  revised_text: 'Nhưng khi thấy Đức Giê-su, người ấy kêu lên, ngã xuống trước mặt Ngài và lớn tiếng nói: “Hỡi Giê-su, Con của Đức Chúa Trời Tối Cao, Ngài có liên can gì với tôi?[a] Tôi van Ngài, xin đừng hành hạ tôi.”'
