id: LUK.8.28
reference: Luke 8:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: vi
  text: 'Nhưng khi thấy Đức Giê-su, người ấy kêu lên, ngã xuống trước mặt Ngài và lớn tiếng nói: “Hỡi Giê-su, Con của Đức Chúa Trời Tối Cao, Ngài có liên can gì với tôi?[a] Tôi van Ngài, xin đừng hành hạ tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “Có gì giữa tôi và Ngài?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: khi thấy
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh xảy ra trước các động từ chính; “khi thấy” tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: ἀνακράξας
  choice: kêu lên
  rationale: Diễn tả một tiếng kêu bật ra mạnh mẽ; cách dịch này không lặp ý hoàn toàn với cụm “lớn tiếng” xuất hiện sau đó.
- source_word: προσέπεσεν αὐτῷ
  choice: sấp mình trước mặt Ngài
  rationale: Giữ hình ảnh ngã hoặc phủ phục trước một người trong tư thế khuất phục hay tuyệt vọng, nhưng không thêm chi tiết “dưới chân” vốn không được nói rõ trong câu Hy Lạp.
- source_word: φωνῇ μεγάλῃ
  choice: lớn tiếng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cụm chỉ thể cách “bằng một giọng lớn”, đồng thời giữ sức mạnh của lời nói.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Ngài có can hệ gì với tôi?
  rationale: Đây là thành ngữ mang sắc thái phản đối và muốn tách mình khỏi người đối diện. “Có can hệ gì với tôi” truyền đạt sắc thái ấy trong tiếng Việt hiện đại; cách dịch sát mặt chữ hơn được giữ trong chú thích.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Con Đức Chúa Trời Chí Cao
  rationale: Giữ đầy đủ tước hiệu được dùng để gọi Đức Giê-su và diễn đạt tự nhiên quan hệ sở hữu của kết cấu sở hữu cách Hy Lạp.
- source_word: δέομαί σου
  choice: Tôi van Ngài
  rationale: Thể hiện lời khẩn cầu tha thiết, trực tiếp và cấp bách mà không dùng từ quá cổ.
- source_word: μή με βασανίσῃς
  choice: xin đừng hành hạ tôi
  rationale: “Hành hạ” bao quát ý gây đau đớn hoặc thống khổ nghiêm trọng trong bối cảnh trừ quỷ, nhưng không giới hạn vào tra tấn thể xác.
theological_decisions:
- issue: Lời thừa nhận căn tính của Đức Giê-su từ miệng quỷ
  choice: Hỡi Giê-su, Con Đức Chúa Trời Chí Cao
  alternative: Hỡi Giê-su, Con của Đức Chúa Trời Tối Cao
  rationale: Bản dịch giữ nguyên sức nặng Kitô học của lời xưng nhận trong câu, không làm nhẹ đi cũng không mở rộng thành một công thức tín lý về sau.
- issue: Sắc thái của lời phủ nhận quan hệ trong Τί ἐμοὶ καὶ σοί
  choice: Ngài có can hệ gì với tôi?
  alternative: Có gì giữa tôi và Ngài?
  rationale: Cách dịch chính giữ ý phản đối và xa cách của thành ngữ, còn chú thích bảo tồn hình thức diễn đạt sát chữ và sự hàm súc của nguyên văn.
translation_notes:
  register: Văn phong trần thuật hiện đại, trang trọng và dễ hiểu. Đại từ “nó” nối tự nhiên với người bị quỷ ám trong ngữ cảnh, còn “Ngài” giữ cách xưng hô tôn kính đối với Đức Giê-su. Dấu chú thích được đặt ngay sau thành ngữ mà chú thích giải thích.
