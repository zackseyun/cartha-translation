reference: Luke 8:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: vi
  text: 'cùng một số phụ nữ đã được chữa lành khỏi các tà linh và bệnh tật: Ma-ri, người được gọi là Ma-đơ-len, từ bà bảy quỷ đã ra khỏi,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: một số phụ nữ
  rationale: τινες chỉ một nhóm không xác định; “một số phụ nữ” tự nhiên và chính xác trong tiếng Việt hiện đại.
- source_word: ἦσαν τεθεραπευμέναι
  choice: đã được chữa lành
  rationale: Cấu trúc chu quá khứ dạng quanh diễn tả việc chữa lành đã xảy ra trước đó và kết quả vẫn còn; thể bị động được giữ lại.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: khỏi các tà linh
  rationale: “Tà linh” diễn đạt trực tiếp πνεύματα πονηρά, không đồng nhất với từ “quỷ” ở vế sau và không biến nó thành bệnh tật.
- source_word: καὶ ἀσθενειῶν
  choice: và bệnh tật
  rationale: ἀσθένεια trong ngữ cảnh chỉ đau yếu hoặc bệnh tật; cách dịch này tự nhiên và giữ sự phân biệt với tà linh.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: gọi là Ma-đơ-len
  rationale: Giữ cách giới thiệu danh xưng của Ma-ri một cách ngắn gọn; “Ma-đơ-len” là dạng phiên âm quen dùng trong tiếng Việt.
- source_word: ἀφ’ ἧς
  choice: người mà ... đã ra khỏi
  rationale: Giữ ý nguồn hoặc sự tách lìa của ἀπό và liên kết rõ đại từ quan hệ với Ma-ri.
- source_word: δαιμόνια ἑπτὰ
  choice: bảy quỷ
  rationale: δαιμόνια chỉ quỷ cụ thể hơn πνεύματα; giữ nguyên số bảy và sự phân biệt từ vựng.
- source_word: ἐξεληλύθει
  choice: đã ra khỏi
  rationale: Thì quá khứ hoàn thành cho biết các quỷ đã rời khỏi Ma-ri trước thời điểm được kể; “ra khỏi” giữ hình ảnh không gian của động từ.
theological_decisions:
- issue: Cách diễn đạt sự hành hạ bởi tà linh
  choice: 'Giữ ngôn ngữ mang tính hữu thể: “tà linh” và “quỷ”, đồng thời phân biệt với “bệnh tật”.'
  alternative: Hiểu toàn bộ như ẩn dụ về tình trạng tâm lý hoặc thể chất.
  rationale: Bản Hy Lạp phân biệt πνευμάτων πονηρῶν và δαιμόνια với ἀσθενειῶν; bản dịch bảo tồn sự phân biệt này mà không bổ sung lời giải thích giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ cấu trúc câu nối tiếp vì câu này là một phần của danh sách bắt đầu ở câu trước; không thêm chú thích vì các phương án tiếng Anh không biểu thị khác biệt đáng kể cần ghi chú trong tiếng Việt.
