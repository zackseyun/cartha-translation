  source_fidelity: 'Bản nháp truyền đạt đúng các yếu tố chính của tiếng Hy Lạp: nhóm phụ nữ không xác định, tình trạng đã được chữa lành trước đó khỏi tà linh và bệnh tật, Ma-ri Ma-đơ-len, và bảy quỷ đã ra khỏi bà. Việc phân biệt “tà linh” với “quỷ” bảo lưu phân biệt từ vựng giữa πνεύματα πονηρά và δαιμόνια.'
