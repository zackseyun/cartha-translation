  to: 'Người đàn ông mà các quỷ đã ra khỏi người ông ấy cứ khẩn khoản xin được ở với Ngài, nhưng Ngài bảo ông đi và nói:'
  rationale: Sửa cấu trúc “quỷ đã ra khỏi” để giữ đầy đủ quan hệ ἀφ’ οὗ (“ra khỏi người ấy”), đồng thời thay “cho ông về” bằng “bảo ông đi” nhằm phản ánh ἀπέλυσεν mà không cụ thể hóa trước mệnh lệnh của câu kế tiếp. Các yếu tố còn lại được giữ vì trung thành với nguyên văn và tự nhiên trong văn phong Kinh Thánh Việt ngữ hiện đại.
