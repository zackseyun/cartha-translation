review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: người đàn ông từng bị quỷ ám đang nài xin được ở với Chúa Giê-su, nhưng Ngài không chấp thuận. Tuy nhiên, cụm “các quỷ đã ra khỏi” thiếu bổ ngữ chỉ người mà chúng ra khỏi, trong khi ἀφ’ οὗ nêu rõ “ra khỏi người ấy”; cần phục hồi để tránh câu tiếng Việt bị cụt nghĩa. “Cho ông về” dự báo cụ thể hướng về nhà của câu 39, trong khi ἀπέλυσεν ở đây chỉ việc cho đi/sai đi; “bảo ông đi” giữ sát hơn và vẫn tự nhiên.'
  naturalness: “Người đàn ông mà các quỷ đã ra khỏi” không tự nhiên và không hoàn chỉnh trong tiếng Việt; “Người đàn ông mà các quỷ đã ra khỏi người ấy” là cấu trúc rõ ràng, tuy có thể lặp danh từ. Cách tự nhiên hơn là đảo thành “Người đàn ông, khỏi người mà các quỷ đã ra...”, nhưng khá nặng. Dùng “người đàn ông mà các quỷ đã ra khỏi người ông ấy” vừa rõ vừa phù hợp văn phong Kinh Thánh hiện đại. “Cứ khẩn khoản xin” diễn tả tốt nét chưa hoàn thành.
  terminology: “Các quỷ” là tương đương trực tiếp và nhất quán cho τὰ δαιμόνια. “Ngài” và “ông” phân biệt các nhân vật rõ ràng, hợp với đăng ký trang trọng. Không cần chú thích.
  issues:
  - severity: medium
    issue: Cụm quan hệ “mà các quỷ đã ra khỏi” thiếu bổ ngữ chỉ xuất xứ.
    rationale: Nguyên văn ἀφ’ οὗ nói rõ các quỷ đã ra khỏi chính người đàn ông ấy. Trong tiếng Việt, “quỷ ra khỏi” cần nêu chúng ra khỏi ai/cái gì; nếu không, câu không hoàn chỉnh về ngữ nghĩa.
  - severity: low
    issue: “Ngài cho ông về” cụ thể hóa hướng đi hơn ἀπέλυσεν.
    rationale: Động từ ἀπολύω ở đây là cho đi/sai đi. Dù câu sau bảo người ấy trở về nhà, bản thân câu 38 chưa nêu “về”; “bảo ông đi” tránh đưa trước thông tin của câu kế.
  revised_text: 'Người đàn ông mà các quỷ đã ra khỏi người ông ấy cứ khẩn khoản xin được ở với Ngài, nhưng Ngài bảo ông đi và nói:'
