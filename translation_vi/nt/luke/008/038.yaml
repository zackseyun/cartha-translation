  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: vi
  text: 'Người đàn ông mà các quỷ đã ra khỏi người ông ấy cứ khẩn khoản xin được ở với Ngài, nhưng Ngài bảo ông đi và nói:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: cứ khẩn khoản xin
  rationale: Thì chưa hoàn thành diễn tả lời nài xin đang tiếp diễn hoặc lặp lại; cách dịch này giữ được sắc thái tha thiết mà vẫn tự nhiên trong tiếng Việt.
- source_word: ὁ ἀνὴρ
  choice: người đàn ông
  rationale: Chỉ chính người nam đã được giải thoát trước đó; cách gọi rõ ràng, tự nhiên và chính xác về giới tính.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: mà các quỷ đã ra khỏi
  rationale: Thì quá khứ hoàn thành cho biết việc các quỷ ra khỏi đã xảy ra trước lời cầu xin; cấu trúc tiếng Việt giữ sát ý mà vẫn dễ hiểu.
- source_word: τὰ δαιμόνια
  choice: các quỷ
  rationale: Dịch trực tiếp danh từ chỉ các thực thể tà linh trong bối cảnh trừ quỷ, không làm nhẹ đi khẳng định của bản văn.
- source_word: εἶναι σὺν αὐτῷ
  choice: được ở với Ngài
  rationale: Diễn đạt tự nhiên nguyện vọng đi cùng hoặc ở bên Chúa Giê-su, không thêm sắc thái vượt quá nguyên văn.
- source_word: ἀπέλυσεν αὐτὸν
  choice: Ngài cho ông về
  rationale: Trong ngữ cảnh, Chúa Giê-su không chấp thuận cho ông đi theo mà sai ông trở về nhà; cách nói này tự nhiên hơn 'đuổi ông đi' và tránh sắc thái thô cứng.
- source_word: λέγων
  choice: và nói
  rationale: Chuyển phân từ hiện tại sang liên từ với động từ hữu hạn là cách kể chuyện tự nhiên trong tiếng Việt và dẫn vào lời trực tiếp ở câu sau.
theological_decisions:
- issue: Cách dịch δαιμόνια trong bối cảnh phép lạ trừ quỷ
  choice: các quỷ
  alternative: các tà linh
  rationale: “Các quỷ” bảo toàn cách bản văn trình bày những thực thể ma quỷ có tính tác nhân, thay vì chuyển thành một phạm trù mơ hồ hơn.
- issue: Chủ thể của ἀπέλυσεν và các đại từ αὐτοῦ/αὐτῷ
  choice: Dùng “Ngài” để chỉ Chúa Giê-su và “ông” để chỉ người đàn ông
  alternative: Dùng “người” hoặc lặp lại “Chúa Giê-su”
  rationale: Nguyên văn dựa vào ngữ cảnh để xác định các đại từ. Tiếng Việt cần phân biệt rõ hai nhân vật; viết hoa “Ngài” theo lối văn Kinh Thánh trang trọng, không thêm một khẳng định thần học mới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. “Cứ khẩn khoản xin” thể hiện hành động kéo dài; “cho ông về” phù hợp mạch văn dẫn sang mệnh lệnh ở câu kế tiếp. Không thêm từ chỉ thời gian như “bấy giờ” vì nguyên văn không có trạng từ thời gian tương ứng.
