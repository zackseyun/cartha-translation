- from: Sau đó không lâu, Đức Chúa Jêsus đi khắp các thành và làng mạc[a], rao giảng và loan báo Tin Lành về vương quốc Đức Chúa Trời[b]; Nhóm Mười Hai cùng đi với Ngài.
  to: Ít lâu sau đó, Ngài đi khắp các thành và làng mạc[a], rao giảng và loan báo tin mừng về vương quốc của Đức Chúa Trời[b]; Nhóm Mười Hai ở cùng Ngài.
  rationale: Bản sửa bảo toàn công thức thời gian “ít lâu sau đó,” sắc thái phân bố của κατά qua “đi khắp” cùng chú thích thay thế, và sự song hành của κηρύσσων với εὐαγγελιζόμενος. Mệnh đề cuối được giới hạn ở ý “ở cùng Ngài,” không thêm hành động “đi.”
