id: LUK.8.1
reference: Luke 8:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: vi
  text: Ít lâu sau đó, Ngài đi khắp các thành và làng mạc[a], rao giảng và loan báo tin mừng về vương quốc của Đức Chúa Trời[b]; Nhóm Mười Hai ở cùng Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đi từ thành này đến thành khác, từ làng này đến làng khác.”
    reason: lexical_alternative
  - marker: b
    text: Hay “quyền cai trị của Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Sau đó không lâu
  rationale: Diễn đạt tự nhiên công thức chuyển tiếp thời gian của Lu-ca, cho biết sự việc kế tiếp xảy ra không lâu sau đó; tiếng Việt không cần sao chép máy móc cấu trúc 'và xảy ra'.
- source_word: αὐτὸς
  choice: Đức Chúa Jêsus
  rationale: Đại từ Hy Lạp chỉ nhân vật trung tâm đã được xác định trong ngữ cảnh. Nêu tên giúp câu tiếng Việt đứng riêng rõ nghĩa mà không hàm ý nhấn mạnh 'chính Ngài'.
- source_word: διώδευεν
  choice: đi khắp
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn hoặc lặp lại, còn động từ hàm ý đi qua nhiều địa điểm.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: các thành và làng mạc
  rationale: Giới từ κατά với danh từ số ít mang nghĩa phân bố, tức đi lần lượt qua nhiều thành và làng; 'đi khắp' truyền đạt sắc thái này tự nhiên.
- source_word: κηρύσσων
  choice: rao giảng
  rationale: Giữ nghĩa công bố công khai của κηρύσσω bằng cách diễn đạt quen thuộc, trang trọng trong tiếng Việt.
- source_word: εὐαγγελιζόμενος
  choice: loan báo Tin Lành
  rationale: Phân biệt với κηρύσσων, đồng thời giữ rõ nội dung là tin vui thay vì gộp hai phân từ thành một hành động.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch rộng, quen thuộc, giữ được cả phương diện lãnh vực và quyền cai trị của βασιλεία mà không thu hẹp nghĩa.
- source_word: οἱ δώδεκα
  choice: Nhóm Mười Hai
  rationale: Giữ danh xưng xác định của nhóm, không thêm 'môn đồ' hay 'sứ đồ' khi nguyên văn không có.
- source_word: σὺν αὐτῷ
  choice: cùng đi với Ngài
  rationale: Trong ngữ cảnh hành trình, cách diễn đạt này truyền đạt tự nhiên ý đồng hành, dù nguyên văn chỉ nói 'cùng với Ngài'.
theological_decisions:
- issue: Cách dịch βασιλεία τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  alternative: quyền cai trị của Đức Chúa Trời
  rationale: '''Vương quốc'' bảo toàn độ rộng thần học của βασιλεία, có thể chỉ cả vương quyền lẫn lãnh vực trị vì; phương án ''quyền cai trị'' dễ thu hẹp nghĩa vào một phương diện.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus/Ngài” theo lối xưng gọi Tin Lành phổ biến; “Nhóm Mười Hai” giữ danh xưng tập thể của nguyên văn. Hai động từ κηρύσσων và εὐαγγελιζόμενος được dịch riêng để bảo toàn sự song hành.
