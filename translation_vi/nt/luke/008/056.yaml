  to: Cha mẹ cô bé kinh ngạc[a], nhưng Ngài truyền họ đừng nói với ai về việc đã xảy ra[c].
  rationale: Sửa chú thích a để loại bỏ sắc thái “kinh hoàng” không được bảo đảm bởi từ Hy Lạp. Sửa mệnh đề mệnh lệnh thành “truyền họ đừng nói với ai về...” cho tự nhiên hơn và sát với μηδενὶ εἰπεῖν τὸ γεγονός. Chú thích b được giữ trong bộ chú thích vì vẫn cung cấp lựa chọn từ vựng cho παρήγγειλεν, dù câu dịch không cần gắn ký hiệu chú thích vào chính từ này.
