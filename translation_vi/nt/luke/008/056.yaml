review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính: cha mẹ của cô bé kinh ngạc, Chúa Giê-su truyền họ không nói cho bất cứ ai về điều đã xảy ra. Tuy nhiên, phương án chú thích “kinh hoàng vì kinh ngạc” thêm sắc thái sợ hãi/kinh hoàng không có căn cứ rõ trong ἐξέστησαν; cần thay bằng một phương án giữ nghĩa bị choáng ngợp, sửng sốt.'
  naturalness: Câu có thể tự nhiên và gọn hơn bằng “truyền họ đừng nói với ai về việc đã xảy ra.” Cách này phản ánh trực tiếp cấu trúc mệnh lệnh + phủ định trong tiếng Hy Lạp và tránh kết hợp hơi gượng “kể với ai” (thông thường là “kể cho ai”).
  terminology: “Cha mẹ cô bé,” “kinh ngạc,” “Ngài,” và “việc đã xảy ra” phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Truyền” bảo toàn lực chỉ thị của παρήγγειλεν mà không áp đặt giải thích thần học.
  issues:
  - severity: medium
    issue: Chú thích a nêu “kinh hoàng vì kinh ngạc.”
    rationale: ἐξέστησαν diễn tả kinh ngạc, sửng sốt, hoặc bị choáng ngợp; “kinh hoàng” trong tiếng Việt thường hàm ý hoảng sợ/khủng khiếp, vì vậy thêm một sắc thái không cần thiết và có thể làm lệch phản ứng được thuật lại.
  - severity: low
    issue: Cụm “không được kể với ai” chưa phải lựa chọn tự nhiên nhất.
    rationale: Với một người tiếp nhận gián tiếp, tiếng Việt thường dùng “kể cho ai”; trong ngữ cảnh này, “đừng nói với ai về...” vừa tự nhiên vừa bám sát μηδενὶ εἰπεῖν τὸ γεγονός.
  revised_text: Cha mẹ cô bé kinh ngạc[a], nhưng Ngài truyền họ đừng nói với ai về việc đã xảy ra[c].
