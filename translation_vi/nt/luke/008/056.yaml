  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: vi
  text: Cha mẹ cô bé kinh ngạc[a], nhưng Ngài truyền họ đừng nói với ai về việc đã xảy ra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sững sờ” hoặc “bị choáng ngợp.”'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa: “điều đã xảy ra” hoặc “biến cố đã xảy ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: kinh ngạc
  rationale: Động từ ở đây diễn tả cha mẹ cô bé bị choáng ngợp bởi sự kinh ngạc; “kinh ngạc” tự nhiên, trang trọng và không làm yếu sắc thái mạnh của phản ứng.
- source_word: οἱ γονεῖς αὐτῆς
  choice: cha mẹ cô bé
  rationale: γονεῖς là từ thông dụng chỉ cha mẹ; đại từ αὐτῆς được diễn đạt là “cô bé” để câu tiếng Việt rõ ràng và tự nhiên trong ngữ cảnh.
- source_word: παρήγγειλεν
  choice: truyền
  rationale: παραγγέλλω mang lực của một lời chỉ thị hoặc mệnh lệnh. “Truyền” giữ được thẩm quyền của lời nói mà không tự ý thêm sắc thái gay gắt.
- source_word: μηδενὶ εἰπεῖν
  choice: không được kể với ai
  rationale: Cụm này diễn tả lệnh cấm nói cho bất kỳ người nào; “không được kể với ai” là cách nói tự nhiên trong tiếng Việt.
- source_word: τὸ γεγονός
  choice: việc đã xảy ra
  rationale: Phân từ hoàn thành được dùng như danh từ, chỉ sự việc đã xảy ra; cách dịch này vừa tự nhiên vừa giữ ý về một biến cố đã hoàn tất.
- source_word: δὲ
  choice: nhưng
  rationale: δέ tạo một sự tương phản nhẹ giữa phản ứng kinh ngạc của cha mẹ và lời chỉ thị tiếp theo của Chúa Giê-su; “nhưng” thể hiện rõ quan hệ này.
theological_decisions:
- issue: Mệnh lệnh giữ kín và phạm vi của lời truyền
  choice: Dịch trực tiếp rằng Ngài truyền cho họ không kể với ai việc đã xảy ra, không giải thích thêm động cơ hay thời hạn.
  alternative: Diễn giải đây là một lệnh giữ kín công khai gắn với chủ đề bí mật về Đấng Mê-si-a, hoặc là một lệnh chỉ có hiệu lực tạm thời và trong phạm vi hạn chế.
  rationale: Câu Hy Lạp chỉ nêu mệnh lệnh, không nói lý do, phạm vi thực tế hay thời hạn; bản dịch giữ nguyên sự căng thẳng thần học này thay vì giải quyết nó bằng diễn giải.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” theo ngữ cảnh để chỉ Chúa Giê-su; giữ cấu trúc tương phản của câu và lực mệnh lệnh mà không thêm lời giải thích thần học.
