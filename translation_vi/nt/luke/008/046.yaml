  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: vi
  text: 'Nhưng Đức Giê-su nói: “Có người đã chạm vào tôi, vì tôi biết rằng quyền năng đã từ tôi phát ra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: Có người đã chạm vào tôi
  rationale: Diễn đạt tự nhiên trong tiếng Việt, giữ nguyên đại từ bất định τις và hành động chạm đã xảy ra.
- source_word: ἔγνων
  choice: tôi biết
  rationale: Phản ánh trực tiếp động từ γινώσκω ở thì aorist trong ngữ cảnh nhận biết một sự việc vừa xảy ra, không làm yếu thành phỏng đoán.
- source_word: δύναμιν
  choice: năng lực
  rationale: Giữ nghĩa về quyền năng hữu hiệu đang hoạt động; “năng lực” phù hợp với việc nó đi ra từ Đức Giê-su mà không thêm diễn giải về bản chất.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: từ tôi đi ra
  rationale: Giữ hướng chuyển động và trạng thái hoàn tất được diễn tả bởi phân từ hoàn thành, đồng thời dùng trật tự từ tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Cách diễn đạt việc Đức Giê-su nhận biết năng lực đi ra
  choice: tôi biết có năng lực từ tôi đi ra
  alternative: tôi cảm thấy quyền năng từ tôi phát ra
  rationale: Bản dịch giữ ἔγνων là “biết”, không đổi thành cảm giác chủ quan, và không giải thích thêm cơ chế hay ý nghĩa thần học của δύναμις.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Giê-su” theo lối gọi tôn kính phổ biến; câu nói trực tiếp ngắn gọn, bám sát cấu trúc và ý nghĩa của bản Hy Lạp.
