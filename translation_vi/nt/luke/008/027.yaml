id: LUK.8.27
reference: Luke 8:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: vi
  text: Khi Đức Giê-su bước lên đất liền[a], một người đàn ông từ thành ấy đến gặp Ngài; người này có các quỷ[b]. Đã khá lâu, ông không mặc quần áo và không ở trong nhà, nhưng ở giữa các mồ mả.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi Ngài bước lên bờ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể diễn đạt tự nhiên hơn: “bị các quỷ ám.” Nguyên văn nói sát chữ là “có các quỷ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: Khi Đức Giê-su bước lên đất liền
  rationale: Kết cấu phân từ cách cho biết hoàn cảnh thời gian. “Bước lên đất liền” diễn đạt tự nhiên việc Ngài ra khỏi thuyền mà không giới hạn danh từ γῆ thành riêng “bờ”.
- source_word: ὑπήντησεν
  choice: đến gặp Ngài
  rationale: Diễn đạt trực tiếp hành động gặp hoặc đi ra gặp trong mạch kể chuyện.
- source_word: ἀνήρ τις ἐκ τῆς πόλεως
  choice: một người đàn ông từ thành ấy
  rationale: “Người đàn ông” phản ánh ἀνήρ; “một” truyền đạt tính bất định của τις. “Thành ấy” chỉ thành đã được xác định bởi mạo từ trong tiếng Hy Lạp.
- source_word: ἔχων δαιμόνια
  choice: có các quỷ
  rationale: Giữ gần cấu trúc nguyên văn “có các quỷ” và số nhiều của δαιμόνια, thay vì đưa cách hiểu mạnh hơn “bị quỷ ám” thẳng vào chính văn.
- source_word: χρόνῳ ἱκανῷ
  choice: Đã khá lâu
  rationale: Diễn đạt khoảng thời gian đáng kể bằng tiếng Việt tự nhiên.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: ông không mặc quần áo
  rationale: Cách nói tự nhiên trong tiếng Việt cho việc không khoác y phục trong suốt khoảng thời gian được nêu; không nhất thiết biến danh từ số ít ἱμάτιον thành một chiếc áo cụ thể.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: không ở trong nhà
  rationale: Giữ phạm vi nghĩa của μένω là ở hoặc lưu lại, không khẳng định quá mức về nơi cư trú thường xuyên.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: nhưng ở giữa các mồ mả
  rationale: “Mồ mả” chỉ các nơi chôn cất; “ở giữa” là cách diễn đạt tự nhiên cho vị trí giữa nhiều ngôi mộ.
theological_decisions:
- issue: Cách dịch δαιμόνια trong bối cảnh con người chịu tác động của ma quỷ
  choice: các quỷ
  alternative: các tà linh
  rationale: Nguyên văn dùng δαιμόνια, không dùng πνεύματα ἀκάθαρτα; vì vậy “các quỷ” giữ đúng thuật ngữ và không đồng nhất hai cách gọi khác nhau.
- issue: Có nên diễn giải ἔχων δαιμόνια là “bị quỷ ám” hay không
  choice: có các quỷ
  alternative: bị các quỷ ám
  rationale: Cụm Hy Lạp nói sát chữ là “có các quỷ”. Chính văn giữ cách nói ít diễn giải hơn, còn chú thích cung cấp lối diễn đạt thông dụng để không che khuất hàm ý trong ngữ cảnh.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Đức Giê-su” và đại từ tôn kính “Ngài” cho nhân vật Giê-su; dùng “ông” cho người đàn ông. Dấu chấm phẩy giúp gắn mệnh đề mô tả “có các quỷ” rõ ràng với người đàn ông, tránh hiểu lầm rằng cụm này bổ nghĩa cho thành.
