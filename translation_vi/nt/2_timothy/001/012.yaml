id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: vi
  text: Vì lý do đó, tôi cũng chịu những điều này; nhưng tôi không hổ thẹn, vì tôi biết Đấng mà tôi đã tin cậy[a], và tôi tin chắc rằng Ngài có khả năng gìn giữ điều ký thác của tôi[b] cho đến ngày ấy.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Đấng mà tôi đã đặt lòng tin nơi” hoặc “Đấng mà tôi đã tin.”'
    reason: lexical_alternative
  - marker: b
    text: “Điều ký thác của tôi” chỉ điều được giao cho người khác gìn giữ. Cụm từ này có thể nói về điều Phao-lô đã giao phó cho Đức Chúa Trời, hoặc điều đã được giao phó cho Phao-lô.
    reason: alternative_reading
  - marker: c
    text: Tức là ngày trong tương lai khi Đức Chúa Trời phán xét và minh oan sau cùng.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Vì lý do đó
  rationale: Cách diễn đạt nhân quả tự nhiên trong tiếng Việt, đồng thời giữ mối liên kết với ý trước.
- source_word: ταῦτα πάσχω
  choice: tôi cũng chịu những điều này
  rationale: Giữ động từ πάσχω theo nghĩa chịu khổ và không diễn giải cụ thể đại từ chỉ định ταῦτα.
- source_word: οὐκ ἐπαισχύνομαι
  choice: tôi không hổ thẹn
  rationale: Diễn đạt tự nhiên trạng thái không cảm thấy xấu hổ vì hoàn cảnh hay lời chứng của mình.
- source_word: ᾧ πεπίστευκα
  choice: Đấng tôi đã tin cậy
  rationale: Giữ đối tượng mang tính ngôi vị và sắc thái cam kết bền vững của thể hoàn thành; “tin cậy” tự nhiên hơn “tin người mà” trong tiếng Việt.
- source_word: πέπεισμαι
  choice: tôi tin chắc
  rationale: Thể hiện trạng thái xác tín vững vàng do thể hoàn thành bị động mang nghĩa hiện tại.
- source_word: δυνατός ἐστιν
  choice: Ngài có khả năng
  rationale: Giữ ý về năng lực thực hiện mà không khuếch đại thành một tuyên bố rộng hơn.
- source_word: τὴν παραθήκην μου
  choice: điều ký thác của tôi
  rationale: 'Giữ hình ảnh một vật hay trách nhiệm được giao để bảo quản và không quyết định chiều ký thác: điều Phao-lô giao cho Đức Chúa Trời hay điều được giao cho Phao-lô.'
- source_word: φυλάξαι
  choice: gìn giữ
  rationale: Phù hợp với hình ảnh bảo quản một điều ký thác, bao hàm canh giữ và bảo toàn.
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: cho đến ngày ấy
  rationale: Diễn đạt tự nhiên hướng thời gian đến ngày cánh chung được nhắc đến trong ngữ cảnh.
theological_decisions:
- issue: Đối tượng của ᾧ và chủ thể ngầm của δυνατός ἐστιν
  choice: Dùng “Đấng” và “Ngài” nhưng không nêu đích danh là Đức Chúa Trời hay Đấng Christ.
  alternative: Nêu rõ “Đức Chúa Trời” hoặc “Đấng Christ Jesus”.
  rationale: Nguyên văn chỉ dùng đại từ chỉ một đối tượng có ngôi vị. Ngữ cảnh hướng đến Đức Chúa Trời được biết trong Đấng Christ, nhưng câu này không định danh rõ hơn.
- issue: Ý nghĩa của παραθήκη μου
  choice: Giữ cách nói “điều ký thác của tôi” cùng chú thích giải thích sự mơ hồ.
  alternative: Dịch là “điều tôi đã giao phó cho Ngài” hoặc “điều đã được giao phó cho tôi”.
  rationale: Cụm sở hữu trong tiếng Hy Lạp có thể nói về điều Phao-lô giao cho Đức Chúa Trời hoặc điều được giao cho Phao-lô; bản văn không buộc phải chọn một hướng.
- issue: “Ngày ấy”
  choice: Giữ lối quy chiếu gián tiếp của nguyên văn.
  alternative: Diễn giải ngay trong câu là ngày phán xét cuối cùng.
  rationale: Cụm từ có ý nghĩa cánh chung trong ngữ cảnh nhưng nguyên văn không giải thích trực tiếp tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hổ thẹn,” “tin cậy,” và “gìn giữ” là những từ phổ thông nhưng vẫn giữ sắc thái nghiêm trang. Cách gọi “Đấng/Ngài” biểu thị đối tượng thần linh theo ngữ cảnh mà không quyết định giữa Đức Chúa Trời và Đấng Christ; cụm “điều ký thác của tôi” chủ ý giữ sự mơ hồ của nguyên văn.
