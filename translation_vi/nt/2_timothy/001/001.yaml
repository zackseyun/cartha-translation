language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: vi
  text: Phao-lô[a], sứ đồ của Đấng Mê-si-a Giê-su bởi ý muốn của Đức Chúa Trời, theo lời hứa về sự sống trong Đấng Mê-si-a Giê-su,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch “Đấng Christ Giê-su” ở cả hai chỗ có cụm “Đấng Mê-si-a Giê-su”.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng phiên âm tên riêng Hy Lạp đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Giữ nghĩa chức danh chuyên biệt trong lời tự xưng của Phao-lô, thay vì làm rộng thành “sứ giả” hay “người được sai đi”.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Χριστός ở đây vẫn mang lực của tước hiệu; cách diễn đạt này làm rõ rằng “Đấng Mê-si-a” là tước hiệu chỉ về Đức Chúa Jêsus, đồng thời tự nhiên hơn trong tiếng Việt so với việc đặt trực tiếp hai danh xưng cạnh nhau.
- source_word: διὰ θελήματος θεοῦ
  choice: bởi ý muốn của Đức Chúa Trời
  rationale: διά với sở hữu cách diễn tả căn nguyên hoặc thẩm quyền; “bởi” vừa gọn vừa phù hợp với công thức ủy nhiệm.
- source_word: κατ’ ἐπαγγελίαν
  choice: theo lời hứa
  rationale: Giữ quan hệ phù hợp/tương ứng do κατά với đối cách biểu đạt, không diễn giải quá mức mục đích của chức vụ sứ đồ.
- source_word: ζωῆς
  choice: về sự sống
  rationale: Sở hữu cách phụ thuộc vào “lời hứa”; “lời hứa về sự sống” là cách nói tự nhiên và không buộc phải hiểu đây là sở hữu cách nội dung hay đối tượng theo nghĩa quá hẹp.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: Giữ hình ảnh quan hệ của ἐν và để cụm giới từ bổ nghĩa trực tiếp cho “sự sống”, tránh thêm động từ không có trong nguyên văn.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Dịch tước hiệu thay vì chỉ phiên âm, nhằm truyền đạt nghĩa “Đấng được xức dầu”; chú thích bảo tồn cách gọi truyền thống quen thuộc.
- issue: Quan hệ của κατ’ ἐπαγγελίαν với chức vụ sứ đồ
  choice: theo lời hứa
  alternative: để công bố lời hứa
  rationale: Nguyên văn chỉ nêu quan hệ bằng κατά, không nói rõ mục đích công bố; bản dịch giữ sự cô đọng và nét mơ hồ ấy.
- issue: Ý nghĩa của ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a là Đức Chúa Jêsus
  alternative: nhờ Đấng Mê-si-a là Đức Chúa Jêsus
  rationale: “Ở trong” giữ nguyên ngôn ngữ liên hệ/hiệp nhất của ἐν, thay vì thu hẹp thành phương tiện hay nguyên nhân.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Giữ cấu trúc của lời mở đầu thư cũng như dấu phẩy cuối câu vì câu văn tiếp tục sang câu kế. Dùng “Đức Chúa Trời”, “Đức Chúa Jêsus” và “sứ đồ” theo lối dùng Kinh Thánh tiếng Việt phổ biến; dùng “Mê-si-a” để chuyển nghĩa tước hiệu Χριστός.
