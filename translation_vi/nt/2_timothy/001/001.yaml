revisions:
- from: Phao-lô[a], sứ đồ của Đấng Mê-si-a là Đức Chúa Jêsus bởi ý muốn của Đức Chúa Trời, theo lời hứa về sự sống ở trong Đấng Mê-si-a là Đức Chúa Jêsus,
  to: Phao-lô[a], sứ đồ của Đấng Mê-si-a Giê-su bởi ý muốn của Đức Chúa Trời, theo lời hứa về sự sống trong Đấng Mê-si-a Giê-su,
  rationale: Bản sửa loại bỏ tước hiệu “Đức Chúa” và từ nối “là” vốn không hiện diện trong nguyên văn, đồng thời giữ nhất quán việc dịch Χριστός là “Đấng Mê-si-a”. Cấu trúc câu, quan hệ “theo lời hứa”, ý nghĩa “sự sống trong”, và dấu phẩy cuối câu đều được giữ nguyên.
