reference: 2 Timothy 1:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: vi
  text: Khi được nhắc nhớ về đức tin chân thành nơi con, là đức tin trước hết đã cư ngụ trong bà của con là Lô-ít và mẹ con là Ơ-ni-xê, tôi tin chắc rằng đức tin ấy cũng ở trong con.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Tôi nhớ đến
  rationale: Diễn đạt tự nhiên ý ‘nhận được sự gợi nhớ/được nhắc nhớ’; ngữ cảnh câu trước có thể hàm ý ký ức được khơi lại, nhưng tiếng Việt ‘tôi nhớ đến’ tránh lối dịch nặng nề.
- source_word: ἀνυποκρίτου πίστεως
  choice: đức tin chân thành
  rationale: ἀνυπόκριτος có nghĩa không giả tạo, không giả hình; ‘chân thành’ tự nhiên và phù hợp với phẩm chất của đức tin.
- source_word: ἐνῴκησεν
  choice: đã ngự trong
  rationale: Giữ hình ảnh mạnh của động từ ‘cư ngụ, ở trong’ thay vì làm phẳng thành ‘có’; ‘ngự trong’ là cách nói trang trọng nhưng dễ hiểu trong văn cảnh Kinh Thánh.
- source_word: μάμμῃ
  choice: bà ngoại
  rationale: Từ Hy Lạp chỉ bà nội hoặc bà ngoại nói chung; vì Lô-ít là mẹ của Ơ-ni-xê, tức mẹ của mẹ Ti-mô-thê, nên tiếng Việt gọi chính xác là ‘bà ngoại’.
- source_word: πέπεισμαι
  choice: tôi tin chắc
  rationale: Thể hoàn thành mang ý xác tín vững vàng; ‘tin chắc’ truyền đạt đúng mức độ quả quyết.
theological_decisions:
- issue: ‘Đức tin ấy cũng ở trong con’ là sự xác nhận hay chỉ là kỳ vọng?
  choice: tôi tin chắc rằng đức tin ấy cũng ở trong con
  alternative: tôi tin rằng đức tin ấy cũng ở trong con
  rationale: πέπεισμαι biểu thị sự xác tín, nhưng câu vẫn trình bày nhận định của Phao-lô chứ không giải thích thêm bản chất hay mức độ đức tin của Ti-mô-thê.
- issue: Hình ảnh đức tin cư ngụ trong các thành viên gia đình
  choice: đức tin trước hết đã ngự trong… đức tin ấy cũng ở trong con
  alternative: đức tin trước hết đã sống trong… cũng sống trong con
  rationale: Giữ phép nhân hóa của ἐνοικέω mà không suy diễn rằng đức tin được truyền tự động theo huyết thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và gần gũi. Dùng cách xưng hô ‘tôi—con’ phù hợp quan hệ Phao-lô và Ti-mô-thê. Dấu gạch ngang giúp câu dài sáng rõ mà không thêm nội dung.
