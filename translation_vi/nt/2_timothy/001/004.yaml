  text: ἐπιποθῶν σε ἰδεῖν, μεμνημένος σου τῶν δακρύων, ἵνα χαρᾶς πληρωθῶ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/004.yaml
  text: longing to see you[a], remembering your tears, so that I may be filled with joy,
translation:
  language: vi
  text: khao khát được gặp con[a], nhớ đến những giọt nước mắt của con, để ta được tràn đầy niềm vui,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “mong mỏi được gặp con.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: khao khát
  rationale: Phân từ hiện tại diễn tả mong muốn tha thiết; “khao khát” tự nhiên, trang trọng và giữ được sức nặng tình cảm.
- source_word: σε ἰδεῖν
  choice: được gặp con
  rationale: Trong ngữ cảnh quan hệ cá nhân và mong được đoàn tụ, “gặp con” tự nhiên hơn cách dịch sát mặt chữ “thấy con”; “được” diễn tả điều mong mỏi có cơ hội xảy ra.
- source_word: μεμνημένος
  choice: nhớ đến
  rationale: Phân từ hoàn thành diễn tả trạng thái vẫn ghi nhớ; “nhớ đến” phù hợp với dòng câu và không diễn giải quá mức.
- source_word: σου τῶν δακρύων
  choice: những giọt nước mắt của con
  rationale: Giữ hình ảnh cụ thể của danh từ số nhiều δάκρυα thay vì diễn giải thành hành động khóc.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên quan hệ mục đích hoặc kết quả dự kiến mà không buộc phải phân định dứt khoát giữa hai sắc thái.
- source_word: χαρᾶς
  choice: niềm vui
  rationale: Với πληρωθῶ, tiếng Việt tự nhiên dùng “tràn đầy niềm vui”, giữ nguyên nội dung của danh từ.
- source_word: πληρωθῶ
  choice: ta được tràn đầy
  rationale: Giữ sắc thái bị động của động từ và ý được làm cho đầy; “tràn đầy” là cách diễn đạt tiếng Việt tự nhiên.
