reference: 2 Timothy 1:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: vi
  text: Tôi cảm tạ Đức Chúa Trời, Đấng tôi phụng sự[a] theo truyền thống của tổ tiên[b] với lương tâm trong sạch. Đêm ngày, trong những lời cầu nguyện của tôi, tôi luôn nhớ đến con[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thờ phượng”. Động từ Hy Lạp chỉ sự phục vụ mang tính tôn giáo dâng lên Đức Chúa Trời và có thể bao hàm việc thờ phượng.
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “từ tổ tiên”; cũng có thể hiểu là “như tổ tiên tôi đã làm”. Cụm từ diễn tả sự tiếp nối với việc phụng sự Đức Chúa Trời của tổ tiên.'
    reason: lexical_alternative
  - marker: c
    text: 'Sát nghĩa hơn: “tôi không ngừng có sự nhớ đến con trong những lời cầu nguyện của tôi”. Từ được dịch là “lời cầu nguyện” đặc biệt có thể chỉ lời khẩn cầu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Tôi cảm tạ Đức Chúa Trời
  rationale: Thành ngữ χάριν ἔχω với tặng cách diễn đạt lòng biết ơn hướng đến một người; “cảm tạ” tự nhiên, trang trọng và phù hợp khi đối tượng là Đức Chúa Trời.
- source_word: ᾧ λατρεύω
  choice: Đấng tôi phụng sự
  rationale: λατρεύω chỉ sự phục vụ mang tính tôn giáo và có thể bao hàm thờ phượng. “Phụng sự” giữ được cả sắc thái kính thờ lẫn phục vụ liên tục.
- source_word: ἀπὸ προγόνων
  choice: theo gương tổ tiên
  rationale: Cụm từ nguyên văn là “từ tổ tiên”, có thể biểu thị sự tiếp nối với đức tin và việc phụng sự của tổ tiên. “Theo gương tổ tiên” diễn đạt tự nhiên sự tiếp nối ấy mà không biến tổ tiên thành đối tượng được phụng sự.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: với lương tâm trong sạch
  rationale: Cụm giới từ diễn tả cách thức phụng sự. “Lương tâm trong sạch” là cách nói rõ ràng, hiện đại và giữ sắc thái đạo đức của καθαρός.
- source_word: ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: tôi luôn nhớ đến con
  rationale: Cấu trúc nguyên văn gần nghĩa “tôi có sự nhớ đến con không ngừng”. Bản dịch chuyển sang cách nói tiếng Việt tự nhiên nhưng không thêm quan hệ nhân quả cho ὡς.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: trong những lời cầu nguyện
  rationale: δέησις có sắc thái cầu xin, nhưng “những lời cầu nguyện” tự nhiên hơn trong tiếng Việt; chú thích ghi nhận sắc thái cụ thể hơn.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: Đêm ngày
  rationale: Đây là thành ngữ chỉ sự đều đặn, liên tục; “đêm ngày” ngắn gọn và quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa việc Phao-lô phụng sự Đức Chúa Trời và di sản tổ tiên trong ἀπὸ προγόνων
  choice: Diễn đạt sự tiếp nối với việc phụng sự của tổ tiên bằng “theo gương tổ tiên”.
  alternative: “từ tổ tiên” hoặc “theo truyền thống tổ tiên”.
  rationale: Cách chọn này thể hiện tính liên tục với di sản đức tin của tổ tiên nhưng không khẳng định quá mức rằng chính truyền thống tổ tiên là nền tảng có thẩm quyền cho việc phụng sự.
- issue: Phạm vi nghĩa của λατρεύω
  choice: phụng sự
  alternative: thờ phượng
  rationale: “Phụng sự” bảo toàn phạm vi nghĩa rộng của hành động phục vụ Đức Chúa Trời trong lòng tôn kính, trong khi “thờ phượng” có thể thu hẹp nghĩa vào hoạt động thờ lễ.
- issue: Quan hệ cú pháp của ὡς với lời cảm tạ
  choice: Không diễn giải ὡς thành quan hệ nguyên nhân rõ rệt; tách câu để giữ kết nối hoàn cảnh tương đối mở.
  alternative: “vì tôi luôn nhớ đến con” hoặc “khi tôi luôn nhớ đến con”.
  rationale: ὡς ở đây có thể giới thiệu hoàn cảnh hoặc nội dung đi cùng lời cảm tạ. Việc tránh “vì” không biến sự nhớ đến Ti-mô-thê thành nguyên nhân duy nhất của lời cảm tạ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “con” vì đây là lời Phao-lô nói trực tiếp với Ti-mô-thê trong quan hệ cha tinh thần–người con thân thiết; không đưa cách xưng hô ấy vào phần mô tả Đức Chúa Trời. Câu Hy Lạp dài được tách thành hai câu để tiếng Việt sáng rõ, đồng thời giữ “đêm ngày” gần với cả việc cầu nguyện lẫn sự luôn nhớ đến Ti-mô-thê.
