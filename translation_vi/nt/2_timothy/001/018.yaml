id: 2TI.1.18
reference: 2 Timothy 1:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: vi
  text: Nguyện Chúa cho ông tìm được lòng thương xót từ Chúa trong ngày ấy[a][b]—và về việc ông đã phục vụ nhiều thế nào tại Ê-phê-sô thì chính con biết rõ hơn[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “ở trước mặt Chúa” hoặc “với Chúa”; ở đây, “từ Chúa” hiểu παρά κυρίου là chỉ nguồn của lòng thương xót.
    reason: lexical_alternative
  - marker: b
    text: “Ngày ấy” là cách Tân Ước thường dùng để nói đến ngày phán xét hoặc minh oan trong tương lai.
    reason: cross_reference
  - marker: c
    text: 'Cũng có thể dịch: “mọi việc phục vụ ông đã làm” hoặc “ông đã phục vụ trong mọi việc thế nào.” Cách nói Hy Lạp tóm lược phạm vi phục vụ của ông tại Ê-phê-sô.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ὁ κύριος
  choice: Nguyện Chúa ban cho ông
  rationale: Động từ ở thức mong ước diễn tả lời cầu chúc. “Nguyện Chúa ban cho ông” tự nhiên, trang trọng và giữ quan hệ với động từ nguyên mẫu theo sau.
- source_word: εὑρεῖν ἔλεος
  choice: được tìm thấy lòng thương xót
  rationale: Giữ hình ảnh của thành ngữ Hy Lạp “tìm thấy lòng thương xót”; thêm “được” giúp câu tiếng Việt tự nhiên trong cấu trúc lời cầu xin.
- source_word: παρὰ κυρίου
  choice: từ Chúa
  rationale: Với sở hữu cách, παρά thường chỉ nguồn; cách dịch này cũng bảo toàn việc κύριος được lặp lại mà không đồng nhất hay phân biệt các đối tượng một cách suy diễn.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: trong ngày ấy
  rationale: Giữ cách diễn đạt cô đọng và sắc thái quy chiếu cánh chung của nguyên văn mà không giải nghĩa ngay trong câu.
- source_word: ὅσα ... διηκόνησεν
  choice: đã phục vụ nhiều thế nào
  rationale: ὅσα tóm lược mức độ hoặc phạm vi phục vụ; cách diễn đạt này tự nhiên hơn lối dịch sát chữ “bao nhiêu điều ông đã phục vụ”.
- source_word: ἐν Ἐφέσῳ
  choice: tại Ê-phê-sô
  rationale: Cách dịch địa điểm chuẩn, với tên riêng được phiên âm quen thuộc trong tiếng Việt.
- source_word: βέλτιον σὺ γινώσκεις
  choice: thì chính con biết rõ hơn
  rationale: Giữ nghĩa so sánh của βέλτιον và sự nhấn mạnh của đại từ σὺ, nhưng không thêm đối tượng so sánh vốn không được nêu trong nguyên văn.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong hai lần xuất hiện của κύριος
  choice: Cả hai lần đều dịch là “Chúa”, không xác định thêm.
  alternative: Lần đầu chỉ Đấng Christ và lần sau chỉ Đức Chúa Cha; hoặc cả hai lần đều chỉ Đấng Christ.
  rationale: Nguyên văn lặp lại κύριος nhưng không phân biệt rõ đối tượng; bản dịch giữ nguyên sự mơ hồ thần học ấy.
- issue: Ý nghĩa cánh chung của “ngày ấy”
  choice: Giữ nguyên là “ngày ấy”.
  alternative: “ngày phán xét” hoặc “ngày cuối cùng”.
  rationale: Cụm từ nhiều khả năng chỉ ngày phán xét hoặc minh oan trong tương lai, nhưng nguyên văn không giải thích cụ thể nên bản dịch cũng không mở rộng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “con” để phản ánh quan hệ mục vụ thân tình của Phao-lô với Ti-mô-thê; dùng “ông” cho người nam đang được nhắc đến. Giữ sự lặp lại “Chúa” và cụm “ngày ấy” để không giải quyết thay những điểm nguyên văn còn để ngỏ.
