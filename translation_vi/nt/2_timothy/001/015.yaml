id: 2TI.1.15
reference: 2 Timothy 1:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: vi
  text: 'Con biết điều này: tất cả những người ở tỉnh A-si-a[a] đều đã quay lưng với ta[b], trong số đó có Phy-ghen và Hẹt-mô-ghen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A-si-a ở đây là tên một tỉnh của Đế quốc La Mã ở phía tây Tiểu Á, không phải châu Á ngày nay.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “đã lìa bỏ ta” hoặc “đã bỏ rơi ta”. Tiếng Hy Lạp sát nghĩa hơn là “đã quay lưng với ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: Con biết
  rationale: Động từ οἶδα có nghĩa trạng thái ở hiện tại; trong lời Phao-lô nói trực tiếp với Ti-mô-thê, “Con biết” vừa tự nhiên vừa thể hiện đúng quan hệ xưng hô.
- source_word: τοῦτο ὅτι
  choice: 'điều này:'
  rationale: τοῦτο hướng đến nội dung được ὅτι giới thiệu. Dấu hai chấm diễn đạt quan hệ ấy tự nhiên trong tiếng Việt mà không cần thêm từ giải thích.
- source_word: ἀπεστράφησάν με
  choice: đã quay lưng với ta
  rationale: Giữ hình ảnh cơ bản của ἀποστρέφω và sắc thái rút lại sự gắn bó hoặc hỗ trợ; “đã bỏ rơi ta” là cách hiểu mạnh hơn nên được nêu trong chú thích.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: tất cả những người ở tỉnh A-si-a
  rationale: Giữ lực bao quát của πάντες nhưng không thêm lời xác định phạm vi vốn do văn cảnh chi phối. Thêm “tỉnh” giúp độc giả Việt Nam không nhầm với châu Á hiện đại.
- source_word: ὧν ἐστιν
  choice: trong số đó có
  rationale: 'Diễn đạt tự nhiên quan hệ bộ phận: hai người được nêu tên thuộc nhóm vừa nói đến.'
- source_word: Φύγελος
  choice: Phy-ghen
  rationale: Phiên âm tên riêng Hy Lạp theo lối dễ đọc trong tiếng Việt.
- source_word: Ἑρμογένης
  choice: Hẹt-mô-ghen
  rationale: Phiên âm tên riêng Hy Lạp theo lối dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của “tất cả những người ở tỉnh A-si-a”
  choice: Giữ nguyên cách nói bao quát của bản Hy Lạp mà không xác định thêm nhóm người trong câu chính.
  alternative: Hiểu là mọi cá nhân hoặc mọi tín hữu trong toàn tỉnh; hoặc diễn giải rõ là tất cả cộng sự và người từng ủng hộ Phao-lô tại đó.
  rationale: πάντες có lực bao quát nhưng phạm vi thực tế được giới hạn bởi văn cảnh. Việc không chèn từ hạn định vừa tránh tuyệt đối hóa lời than phiền, vừa tránh làm nhẹ nó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng cặp xưng hô “con—ta” phù hợp lời một người cha thuộc linh lớn tuổi nói với Ti-mô-thê. Địa danh và tên người được phiên âm để thuận đọc; mọi dấu chú thích đều xuất hiện trong câu chính.
