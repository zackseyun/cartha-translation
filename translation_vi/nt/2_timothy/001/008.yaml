id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: vi
  text: Vì vậy, đừng hổ thẹn về lời chứng về Chúa chúng ta[a], cũng đừng hổ thẹn về tôi, người tù của Ngài; nhưng hãy cùng chịu gian khổ vì Tin Mừng[b], theo quyền năng của Đức Chúa Trời[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời chứng của Chúa chúng ta.” Sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo cách này, nhưng ở đây nhiều khả năng là lời chứng nói về Chúa.'
    reason: alternative_reading
  - marker: b
    text: 'Dịch sát cấu trúc Hy Lạp: “cùng chịu gian khổ với Tin Mừng.” Động từ Hy Lạp bao hàm ý cùng người khác tham dự vào sự chịu gian khổ.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “nhờ quyền năng của Đức Chúa Trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Vì vậy, đừng
  rationale: οὖν nêu kết luận từ lời khuyên trước đó; “Vì vậy” giữ rõ mối liên hệ lập luận, còn μή với thể giả định aorist diễn đạt lời ngăn cấm.
- source_word: ἐπαισχυνθῇς
  choice: hổ thẹn
  rationale: Động từ chỉ sự xấu hổ hoặc chùn bước vì sợ mang tiếng; “hổ thẹn” tự nhiên, trang trọng và phù hợp với bối cảnh.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: lời chứng liên quan đến Chúa chúng ta
  rationale: μαρτύριον là lời làm chứng; sở hữu cách nhiều khả năng mang nghĩa khách thể, tức lời chứng nói về Chúa. “Liên quan đến” rõ nghĩa mà vẫn cho phép ghi nhận cách hiểu khác trong chú thích.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: cũng đừng hổ thẹn về tôi, người tù của Ngài
  rationale: Bổ sung lại động từ trong tiếng Việt giúp quan hệ phối hợp rõ và tự nhiên. “Người tù của Ngài” giữ nguyên quan hệ sở hữu/liên hệ trong αὐτοῦ mà không thu hẹp thành chỉ “vì Ngài”.
- source_word: συγκακοπάθησον
  choice: hãy cùng chịu gian khổ
  rationale: Tiền tố συν- hàm ý cùng tham dự với người khác trong sự chịu khổ; “cùng chịu gian khổ” giữ được nét nghĩa này.
- source_word: τῷ εὐαγγελίῳ
  choice: vì Tin Mừng
  rationale: Dữ cách sau συγκακοπάθησον diễn đạt mối liên hệ cô đọng. Trong tiếng Việt, “vì Tin Mừng” tự nhiên và truyền đạt việc chịu khổ gắn với sự phục vụ Tin Mừng, trong khi chú thích bảo lưu cách dịch sát cấu trúc hơn.
- source_word: κατὰ δύναμιν θεοῦ
  choice: theo quyền năng của Đức Chúa Trời
  rationale: κατά với đối cách có thể chỉ chuẩn mực, mức độ hoặc sự tương ứng. “Theo quyền năng” giữ được độ mở của nguyên văn hơn cách diễn giải hoàn toàn theo nghĩa phương tiện.
theological_decisions:
- issue: Quan hệ giữa “lời chứng” và “Chúa chúng ta”
  choice: lời chứng liên quan đến Chúa chúng ta
  alternative: lời chứng của Chúa chúng ta
  rationale: 'Ngữ cảnh nghiêng về sở hữu cách khách thể: lời chứng có Chúa là nội dung. Tuy nhiên, cấu trúc Hy Lạp cũng có thể được hiểu là lời chứng do Chúa ban hoặc làm chứng, nên cách đọc ấy được giữ trong chú thích.'
- issue: Ý nghĩa của “người tù của Ngài”
  choice: giữ nguyên quan hệ với Chúa bằng “người tù của Ngài”
  alternative: người tù vì Ngài
  rationale: αὐτοῦ diễn đạt sự thuộc về hoặc liên hệ với Chúa. Bản dịch không thu hẹp quan hệ này thành duy nhất nguyên nhân của việc bị tù.
- issue: Quan hệ giữa sự chịu khổ và Tin Mừng
  choice: cùng chịu gian khổ vì Tin Mừng
  alternative: cùng chịu gian khổ với Tin Mừng
  rationale: Dữ cách Hy Lạp cô đọng và có thể được diễn đạt theo nhiều cách. “Vì Tin Mừng” rõ, tự nhiên trong tiếng Việt; chú thích bảo lưu cách dịch gần hình thức nguyên văn hơn.
- issue: Sắc thái của κατὰ δύναμιν θεοῦ
  choice: theo quyền năng của Đức Chúa Trời
  alternative: nhờ quyền năng của Đức Chúa Trời
  rationale: “Theo” bảo lưu khả năng chỉ mức độ, chuẩn mực hoặc sự tương ứng; “nhờ” nhấn mạnh quyền năng như phương tiện trợ giúp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Tin Mừng” như thuật ngữ quen thuộc cho εὐαγγέλιον; dùng “Đức Chúa Trời” cho θεός và viết hoa đại từ “Ngài” theo quy ước tôn kính. Dấu chấm phẩy làm rõ sự chuyển từ hai mệnh lệnh phủ định sang lời kêu gọi tích cực.
