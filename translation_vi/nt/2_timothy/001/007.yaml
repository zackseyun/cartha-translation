  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔδωκεν ἡμῖν ὁ θεὸς πνεῦμα δειλίας, ἀλλὰ δυνάμεως καὶ ἀγάπης καὶ σωφρονισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: vi
  text: Vì Đức Chúa Trời không ban cho chúng ta một tinh thần hèn nhát[a][c], nhưng là một tinh thần có quyền năng, tình yêu thương và sự tự chủ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khiếp nhược” hoặc “nhút nhát”; từ Hy Lạp nói đến sự hèn nhát hơn là nỗi sợ thông thường.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự phán đoán sáng suốt” hoặc “tính kỷ luật.”
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp được dịch là “tinh thần” cũng có thể được hiểu là “Thần Khí.”
    reason: theological_ambiguity
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Vì ... không
  rationale: γάρ nối câu này với lời khích lệ ngay trước đó bằng quan hệ giải thích; οὐ phủ định trực tiếp hành động ban cho.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: Đức Chúa Trời không ban cho chúng ta
  rationale: Thì aorist được diễn đạt tự nhiên bằng một hành động đã ban; tiếng Việt không bắt buộc đánh dấu quá khứ khi văn cảnh đã rõ. Trật tự câu được điều chỉnh cho tự nhiên.
- source_word: πνεῦμα
  choice: một tinh thần
  rationale: Trong cấu trúc này, từ này có thể chỉ tinh thần hoặc khuynh hướng chi phối con người. Cách dịch không viết hoa phù hợp với các sở hữu cách chỉ phẩm chất theo sau, đồng thời chú thích giữ lại khả năng hiểu là Thần Khí.
- source_word: δειλίας
  choice: hèn nhát
  rationale: δειλία mạnh hơn nỗi sợ thông thường, hàm ý sự khiếp nhược hoặc thiếu can đảm; “hèn nhát” truyền đạt rõ sắc thái tiêu cực ấy.
- source_word: δυνάμεως
  choice: đầy quyền năng
  rationale: δύναμις chỉ năng lực hay sức mạnh hữu hiệu. Thêm “đầy” giúp tiếng Việt diễn đạt tự nhiên quan hệ phẩm chất của πνεῦμα mà không đổi ý.
- source_word: ἀγάπης
  choice: tình yêu thương
  rationale: Đây là cách diễn đạt tự nhiên, trang trọng và thông dụng trong tiếng Việt hiện đại cho ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: sự tự chủ
  rationale: Từ hiếm này bao gồm khả năng làm chủ bản thân, kỷ luật và sự phán đoán tỉnh táo; “sự tự chủ” rõ nghĩa trong bộ ba phẩm chất, còn các sắc thái khác được giữ trong chú thích.
theological_decisions:
- issue: Đối tượng quy chiếu của πνεῦμα
  choice: “một tinh thần,” chủ yếu được hiểu là tinh thần hoặc khuynh hướng Đức Chúa Trời ban
  alternative: “Thần Khí,” tức là Đức Thánh Linh
  rationale: πνεῦμα không có mạo từ và được mô tả bằng các sở hữu cách đối lập, nên văn cảnh nghiêng về phẩm chất hoặc tinh thần được ban. Tuy nhiên, nguyên văn không hoàn toàn loại trừ liên hệ trực tiếp với Thần Khí; chú thích bảo tồn khả năng đó thay vì quyết đoán thay cho người đọc.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hèn nhát” giữ được sức nặng đạo đức của δειλία; “tình yêu thương” phù hợp lối nói tự nhiên trong văn bản Kinh Thánh tiếng Việt. Các chú thích được đặt ngay sau đúng từ ngữ liên quan.
