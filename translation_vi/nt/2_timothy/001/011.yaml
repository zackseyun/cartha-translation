  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: vi
  text: Vì Tin Lành ấy mà tôi đã được chỉ định làm người công bố[a], sứ đồ và thầy dạy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người rao giảng.” Từ Hy Lạp chỉ người được chính thức giao nhiệm vụ công bố trước công chúng.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Chính vì Tin Lành ấy
  rationale: Cụm từ hướng về Tin Lành được nhắc trong văn mạch ngay trước đó và nêu lý do hoặc mục đích của sự bổ nhiệm. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ liên hệ ngược.
- source_word: ἐτέθην
  choice: tôi đã được chỉ định
  rationale: Dạng bị động của τίθημι trong ngữ cảnh các vai trò được giao mang nghĩa bổ nhiệm hoặc chỉ định, chứ không phải đặt ở một vị trí theo nghĩa vật lý.
- source_word: ἐγώ
  choice: tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo chút nhấn mạnh; cấu trúc “mà tôi” cùng từ “Chính” truyền đạt đủ sắc thái ấy mà không cần thêm “chính tôi”, vốn dễ gây nhấn quá mức.
- source_word: κῆρυξ
  choice: người công bố
  rationale: Từ này chỉ người được chính thức giao nhiệm vụ công bố trước công chúng. “Người công bố” tự nhiên, dễ hiểu và tránh giới hạn nghĩa vào chức vụ giảng đạo trong truyền thống giáo hội.
- source_word: ἀπόστολος
  choice: sứ đồ
  rationale: Trong lời Phao-lô nói về chính mình, từ này là danh xưng chức vụ đã được xác lập; “sứ đồ” là cách dịch quen thuộc và phân biệt với nghĩa rộng hơn là sứ giả.
- source_word: διδάσκαλος
  choice: thầy dạy
  rationale: Cách dịch trực tiếp, trang trọng vừa phải và tự nhiên, phù hợp với chuỗi ba vai trò được giao.
theological_decisions:
- issue: Nên dịch κῆρυξ bằng thuật ngữ truyền thống chỉ người giảng đạo hay bằng từ nhấn mạnh nhiệm vụ công bố chính thức
  choice: người công bố
  alternative: người rao giảng
  rationale: Lựa chọn này giữ trọng tâm của từ Hy Lạp ở tư cách người được sai phái để công bố công khai, đồng thời không nhập vào câu một khái niệm chức vụ giáo hội phát triển về sau.
- issue: Xác định đối tượng mà εἰς ὃ quy chiếu
  choice: Tin Lành ấy
  alternative: điều đó
  rationale: Đại từ quan hệ giống trung trong tiếng Hy Lạp phù hợp với εὐαγγέλιον (Tin Lành) trong văn mạch gần. Nêu rõ “Tin Lành” giúp câu tiếng Việt tự nhiên mà không thay đổi ý hướng của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ cấu trúc ba vai trò song song của nguyên văn; “Chính” truyền đạt sắc thái nhấn mạnh mà không làm câu nặng nề.
