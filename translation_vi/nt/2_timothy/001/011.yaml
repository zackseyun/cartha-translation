    issue: Từ “Chính” trong “Chính vì Tin Lành ấy” đặt trọng âm không đúng chỗ rõ rệt.
    rationale: Nguyên văn εἰς ὃ có nghĩa “vì/cho điều ấy”, còn đại từ ἐγώ mới là yếu tố được nêu rõ để tạo nhấn nhẹ. Tiếng Việt không nhất thiết phải đánh dấu nét nhấn này; bỏ “Chính” tránh thêm một sự nhấn mạnh vào “vì Tin Lành ấy” không có trong nguyên văn.
