id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: vi
  text: Đấng đã cứu chúng ta và gọi chúng ta bằng sự kêu gọi thánh[a], không theo những việc làm của chúng ta, nhưng theo mục đích riêng và ân điển của Ngài—ân điển đã được ban cho chúng ta trong Đấng Mê-si-a Giê-su[b] trước những thời đại vĩnh hằng[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến một sự kêu gọi thánh” hoặc “với một sự kêu gọi thánh”. Hình thức dữ cách trong tiếng Hy Lạp có thể được hiểu theo nhiều cách.'
    reason: lexical_alternative
  - marker: b
    text: Hay “trong Đấng Christ Giê-su”. Ở đây “Đấng Mê-si-a” dịch Χριστός như một tước hiệu.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “trước các thời đại đời đời”, “trước khi các thời đại bắt đầu”, hoặc theo lối nói tự nhiên hơn: “trước khi thời gian bắt đầu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: đã cứu
  rationale: Động tính từ bất định của σῴζω; “cứu” là cách diễn đạt tự nhiên và giữ nguyên sức nặng cứu chuộc trong văn mạch của Phao-lô.
- source_word: καλέσαντος
  choice: đã gọi
  rationale: Song song với “đã cứu”; “gọi” giữ được sắc thái về sự kêu gọi của Đức Chúa Trời mà không thu hẹp thành một lời mời thông thường.
- source_word: κλήσει ἁγίᾳ
  choice: bằng một sự kêu gọi thánh
  rationale: Cách dịch này phản ánh sát cách của nguyên ngữ; chú thích ghi nhận rằng cách dữ liệu có thể chỉ phương tiện, đích đến hoặc phạm vi liên hệ.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: không theo những việc làm của chúng ta
  rationale: Giữ cấu trúc κατά và thuật ngữ quan trọng “việc làm”, đồng thời diễn đạt rõ tiêu chuẩn hay cơ sở bị phủ định.
- source_word: ἰδίαν πρόθεσιν
  choice: mục đích riêng
  rationale: “Mục đích” diễn đạt phù hợp πρόθεσις trong thần học Phao-lô; “riêng” giữ lực nhấn mạnh của ἰδίαν.
- source_word: χάριν
  choice: ân điển
  rationale: “Ân điển” là thuật ngữ tiếng Việt quen thuộc và có đủ sức nặng thần học cho χάρις trong văn mạch này.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: ân điển đã được ban cho chúng ta
  rationale: Động tính từ giống cái hòa hợp với χάριν, nên lặp lại “ân điển” để quan hệ bổ nghĩa được rõ ràng trong tiếng Việt.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: Dịch Χριστός như một tước hiệu có ý nghĩa, còn Ἰησοῦ được phiên âm theo tên riêng; “trong” giữ cách diễn đạt thần học của Phao-lô.
- source_word: πρὸ χρόνων αἰωνίων
  choice: trước những thời đại vĩnh hằng
  rationale: Giữ hình ảnh số nhiều và sắc thái khác thường của nguyên ngữ mà vẫn có thể hiểu được; cách nói thành ngữ hơn được nêu trong chú thích.
theological_decisions:
- issue: Lực nghĩa của cách dữ liệu trong κλήσει ἁγίᾳ
  choice: bằng một sự kêu gọi thánh
  alternative: đến một sự kêu gọi thánh; với một sự kêu gọi thánh
  rationale: Nguyên ngữ cho phép hiểu cách dữ liệu theo phương tiện, đích đến hoặc liên hệ. Bản chính chọn một cách Việt ngữ tương đối sát, còn chú thích bảo tồn các khả năng khác.
- issue: Χριστός là tước hiệu hay yếu tố gần như tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su; Christ Jesus
  rationale: Trong cụm này, ý nghĩa tước hiệu vẫn còn hiện diện; vì vậy dịch nghĩa Χριστός thay vì chỉ phiên âm.
- issue: Quan hệ của mệnh đề τὴν δοθεῖσαν ἡμῖν
  choice: mệnh đề bổ nghĩa cho ân điển
  alternative: mệnh đề có thể bị người đọc hiểu rộng hơn là bổ nghĩa cho cả mục đích và ân điển
  rationale: Sự hòa hợp giống cái số ít trong tiếng Hy Lạp chỉ trực tiếp đến χάριν, nên bản dịch làm rõ rằng chính ân điển đã được ban.
- issue: Ý nghĩa thời gian của πρὸ χρόνων αἰωνίων
  choice: trước những thời đại vĩnh hằng
  alternative: trước khi thời gian bắt đầu
  rationale: Bản chính giữ sự căng thẳng và cách nói khác thường của nguyên ngữ; chú thích cung cấp lối diễn đạt thành ngữ mà không buộc câu Hy Lạp vào một cách giải thích duy nhất.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, đồng thời giữ cấu trúc nối tiếp của câu Hy Lạp qua danh xưng “Đấng”. Dấu gạch ngang làm rõ rằng mệnh đề tiếp theo bổ nghĩa cho “ân điển”. Các thuật ngữ “cứu”, “gọi”, “việc làm”, “mục đích” và “ân điển” được giữ nhất quán với văn phong thần học của Phao-lô.
