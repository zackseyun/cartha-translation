id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: vi
  text: nhưng nay đã được bày tỏ qua sự xuất hiện của Đấng Cứu Rỗi của chúng ta là Giê-su, Đấng Mê-si-a[a], Đấng đã làm cho sự chết mất hiệu lực và đưa sự sống cùng sự bất hoại[b] ra ánh sáng qua Tin Lành,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Giê-su Christ.” Từ Hy Lạp Χριστός có thể mang nghĩa danh hiệu “Đấng Mê-si-a” hoặc được dùng gần như một phần của tên gọi “Christ.”
    reason: alternative_reading
  - marker: b
    text: Hay “sự bất tử.” Từ Hy Lạp này nhấn mạnh tính không bị hư hoại hoặc suy tàn.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: đã được bày tỏ
  rationale: Phân từ thụ động quy chiếu về ân điển của Đức Chúa Trời ở câu trước; cách dịch này giữ thể thụ động và nối câu tự nhiên.
- source_word: ἐπιφανείας
  choice: sự hiện ra
  rationale: Diễn đạt tự nhiên việc Đấng Cứu Rỗi xuất hiện hữu hình trong lịch sử, không dùng thuật ngữ phiên âm khó hiểu.
- source_word: σωτῆρος
  choice: Đấng Cứu Rỗi
  rationale: Danh hiệu quen thuộc, trang trọng và chính xác trong ngữ cảnh nói về sự cứu rỗi.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  rationale: Giữ Jêsus như tên riêng và dịch Χριστός theo nghĩa danh hiệu Mê-si-a; cấu trúc đồng vị tự nhiên trong tiếng Việt.
- source_word: καταργήσαντος
  choice: đã vô hiệu hóa
  rationale: Diễn tả việc làm cho quyền lực của sự chết mất hiệu lực, giữ lời khẳng định mạnh mẽ mà không hàm ý sự chết hiện đã hoàn toàn không còn tồn tại.
- source_word: θάνατον
  choice: sự chết
  rationale: Cách dịch trực tiếp và quen thuộc, phù hợp văn phong Kinh Thánh tiếng Việt.
- source_word: φωτίσαντος
  choice: đưa ... ra ánh sáng
  rationale: Thành ngữ tự nhiên, bảo toàn hình ảnh về việc làm cho điều gì được hiển lộ.
- source_word: ζωὴν
  choice: sự sống
  rationale: Cách dịch chuẩn, không diễn giải thêm nội dung cứu thế và cánh chung vốn được ngữ cảnh gợi lên.
- source_word: ἀφθαρσίαν
  choice: tình trạng không hư nát
  rationale: Nhấn mạnh sự không bị suy tàn hoặc hủy hoại, sát nghĩa hơn cách chỉ nói 'bất tử'.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: qua Tin Lành
  rationale: Giữ nghĩa phương tiện của διά với sở hữu cách; 'Tin Lành' là cách gọi thông dụng và trang trọng.
- source_word: μὲν ... δὲ
  choice: đã ... và
  rationale: Tiếng Việt không cần tái tạo máy móc cặp tiểu từ; phép song hành giữa vô hiệu hóa sự chết và đưa sự sống ra ánh sáng vẫn rõ.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong cụm Ἰησοῦ Χριστοῦ
  choice: Đức Chúa Jêsus, Đấng Mê-si-a
  alternative: Đức Chúa Jêsus Christ
  rationale: Trong ngữ cảnh đi sau danh hiệu 'Đấng Cứu Rỗi chúng ta', nghĩa danh hiệu của Χριστός vẫn nổi bật. Chú thích bảo lưu cách hiểu như một yếu tố gần với tên riêng.
- issue: Sức mạnh ngữ nghĩa của καταργήσαντος đối với sự chết
  choice: vô hiệu hóa sự chết
  alternative: tiêu diệt sự chết
  rationale: Bản dịch giữ lời tuyên bố về chiến thắng quyết định của Đấng Mê-si-a nhưng không tự ý giải quyết căng thẳng giữa chiến thắng ấy và thực tại sự chết vẫn còn trong thời hiện tại.
- issue: Ý nghĩa của ἀφθαρσίαν
  choice: tình trạng không hư nát
  alternative: sự bất tử
  rationale: Lựa chọn chính bảo toàn trọng tâm về tính không thể suy tàn hay hủy hoại; cách dịch quen thuộc hơn được ghi ở chú thích.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'Đấng Cứu Rỗi', 'Đấng Mê-si-a' và 'Tin Lành' theo lối gọi quen thuộc; chọn 'vô hiệu hóa' để bảo tồn căng thẳng thần học của καταργέω. Dấu phẩy cuối câu được giữ vì câu 10 nối tiếp cú pháp từ câu trước và có thể còn tiếp trong đơn vị văn bản.
