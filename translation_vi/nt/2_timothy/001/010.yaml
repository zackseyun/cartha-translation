  source_fidelity: 'Bản nháp phản ánh đúng cấu trúc chính: ân điển (quy chiếu từ câu trước) nay được bày tỏ qua sự xuất hiện của Đấng Cứu Rỗi; Đấng ấy làm sự chết mất hiệu lực và đưa sự sống cùng sự bất hoại ra ánh sáng qua Tin Lành. Tuy nhiên, việc thêm “Đức Chúa” trước tên Giê-su không có từ tương ứng trong tiếng Hy Lạp (chỉ có Ἰησοῦ Χριστοῦ) và có thể làm mờ ranh giới giữa tên riêng với danh hiệu σωτῆρος đã có trong câu.'
  naturalness: “Sự xuất hiện” tự nhiên hơn “sự hiện ra” trong tiếng Việt chuẩn hiện đại ở ngữ cảnh lịch sử này. “Làm cho sự chết mất hiệu lực” diễn đạt καταργήσαντος rõ và tự nhiên hơn động từ hành chính “vô hiệu hóa”. “Sự bất hoại” là cách nói gọn, trang trọng và sát nghĩa hơn “tình trạng không hư nát”.
  terminology: Dùng “Giê-su, Đấng Mê-si-a” để giữ tên riêng và dịch danh hiệu Χριστός. Dùng “Đấng Cứu Rỗi”, “sự chết”, “sự sống”, “sự bất hoại”, và “Tin Lành” nhất quán với văn phong Kinh Thánh tiếng Việt. Chú thích tên thay thế cũng cần bỏ yếu tố “Đức Chúa”, vốn không hiện diện trong bản văn nguồn.
