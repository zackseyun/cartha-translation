  - severity: low
    issue: “Sự hiện ra” và “vô hiệu hóa” kém tự nhiên
    rationale: “Hiện ra” có thể gợi một lần hiện hình; “vô hiệu hóa” mang sắc thái hành chính-kỹ thuật. “Sự xuất hiện” và “làm cho ... mất hiệu lực” rõ, tự nhiên hơn mà vẫn giữ nghĩa.
  - severity: low
    issue: “Tình trạng không hư nát” nặng nề
    rationale: “Sự bất hoại” chuyển đạt trực tiếp ἀφθαρσία, giữ trọng tâm về tính không bị hư hoại và phù hợp văn phong trang trọng.
