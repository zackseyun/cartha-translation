id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: vi
  text: 'Gửi Ti-mô-thê, người con yêu dấu: Ân điển, lòng thương xót và bình an từ Đức Chúa Trời là Cha và Đấng Mê-si-a[a] Giê-su, Chúa chúng ta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ Giê-su.” Tước hiệu Hy Lạp Χριστός được dịch là “Đấng Mê-si-a” để thể hiện ý nghĩa của từ này thay vì chỉ dùng dạng phiên âm truyền thống.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τιμοθέῳ
  choice: Ti-mô-thê
  rationale: Dùng dạng phiên âm quen thuộc trong tiếng Việt cho tên riêng Hy Lạp Τιμόθεος.
- source_word: ἀγαπητῷ τέκνῳ
  choice: người con yêu dấu
  rationale: “Con” giữ được ẩn dụ về quan hệ cha con thuộc linh của τέκνον mà không thêm đại từ sở hữu “của ta,” vốn không có trong nguyên văn; “yêu dấu” truyền đạt sắc thái trìu mến và trang trọng của ἀγαπητός.
- source_word: χάρις
  choice: ân điển
  rationale: Thuật ngữ quen thuộc và chính xác trong văn phong thư tín Phao-lô, diễn đạt ân huệ được ban nhưng không.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Giữ đây là một lời chúc phước riêng biệt, không gộp với “ân điển” hay “bình an.”
- source_word: εἰρήνη
  choice: bình an
  rationale: Cách dịch tự nhiên, quen thuộc, giữ được cả ý nghĩa quan hệ lẫn âm hưởng giao ước.
- source_word: θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  rationale: Nguyên văn không có “chúng ta” bổ nghĩa cho “Cha”; cách dịch này tránh tự ý thêm từ và vẫn tự nhiên trong tiếng Việt.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Dịch ý nghĩa tước hiệu Χριστός thay vì chỉ giữ dạng phiên âm truyền thống; thêm “Đấng” để tước hiệu tự nhiên và trang trọng trong tiếng Việt.
- source_word: κυρίου
  choice: Chúa
  rationale: Diễn đạt thẩm quyền và ý nghĩa Cơ Đốc học của κύριος mà không thu hẹp thành “chủ” hay “thầy.”
theological_decisions:
- issue: Cách dịch Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Χριστός vẫn mang chức năng tước hiệu trong công thức chào thư tín. “Đấng Mê-si-a” làm rõ ý nghĩa của tước hiệu Hy Lạp, còn cách gọi truyền thống “Đấng Christ” được ghi ở chú thích.
- issue: Quan hệ trong cụm θεοῦ πατρὸς
  choice: Đức Chúa Trời là Cha
  alternative: Đức Chúa Trời, Cha chúng ta
  rationale: Bản Hy Lạp không có ἡμῶν sau πατρός, nên không thêm “chúng ta”; “là Cha” thể hiện quan hệ đồng vị mà không giải quyết quá mức sắc thái ngắn gọn của nguyên văn.
- issue: Hình thức lời chúc χάρις, ἔλεος, εἰρήνη
  choice: Giữ dưới dạng cụm danh từ
  alternative: Cầu xin ... ở cùng con
  rationale: Nguyên văn chỉ nêu ba danh từ rồi chỉ nguồn gốc bằng ἀπό, không có động từ. Giữ cấu trúc danh từ bảo toàn sự cô đọng của lời chào và tránh thêm một lời cầu chúc diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Bản dịch giữ cấu trúc lời chào cô đọng của tiếng Hy Lạp, không thêm “của ta,” “chúng ta,” “cầu xin” hoặc “ở cùng con.”
