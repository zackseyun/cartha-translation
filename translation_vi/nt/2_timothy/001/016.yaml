- from: Xin Chúa ban lòng thương xót cho gia đình Ô-nê-si-phô-rơ, vì ông đã nhiều lần làm tôi được tươi tỉnh và không hổ thẹn vì xiềng xích của tôi.[a]
  to: Xin Chúa ban lòng thương xót cho gia đình Ô-nê-si-phô-rơ, vì ông đã nhiều lần làm tôi khuây khỏa và không hổ thẹn về xiềng xích của tôi.[a]
  rationale: Chỉnh hai cụm từ để tiếng Việt tự nhiên và sáng nghĩa hơn, nhưng vẫn giữ nguyên sắc thái cầu chúc, tính không xác định của «Chúa», phạm vi «gia đình», hình ảnh số ít/cụ thể của «xiềng xích», và nghĩa không hổ thẹn của nguyên văn.
