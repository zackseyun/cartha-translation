id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: vi
  text: Xin Chúa ban lòng thương xót cho gia đình Ô-nê-si-phô-rơ, vì ông đã nhiều lần làm tôi khuây khỏa và không hổ thẹn về xiềng xích của tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “cảnh tù đày của tôi”; nguyên văn là “xiềng xích của tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Xin ... ban
  rationale: Thể mong ước aorist diễn tả lời cầu xin hoặc ước nguyện; “Xin ... ban” truyền đạt tự nhiên sắc thái ấy trong tiếng Việt.
- source_word: ἔλεος
  choice: lòng thương xót
  rationale: Cách dịch trang trọng, thông dụng cho ân huệ đầy thương xót của Đức Chúa Trời đối với người đang cần.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu thần linh mà không xác định thêm đối tượng khi nguyên văn chỉ nói “Chúa”.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: cho gia đình Ô-nê-si-phô-rơ
  rationale: οἶκος ở đây chỉ đơn vị gia đình hoặc gia quyến hơn là một tòa nhà; “gia đình” tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ὅτι
  choice: vì
  rationale: Giới thiệu lý do cho lời cầu xin một cách gọn và tự nhiên.
- source_word: πολλάκις
  choice: nhiều lần
  rationale: Diễn đạt rõ hành động lặp lại, sát nghĩa hơn trong văn cảnh này.
- source_word: ἀνέψυξεν
  choice: làm tôi được tươi tỉnh
  rationale: Giữ hình ảnh về sự làm cho hồi phục, nhẹ nhõm và được nâng đỡ, thay vì thu hẹp nghĩa vào riêng sự khích lệ.
- source_word: τὴν ἅλυσίν μου
  choice: xiềng xích của tôi
  rationale: Giữ hình ảnh cụ thể của danh từ số ít ἅλυσις; tiếng Việt thường dùng “xiềng xích” như một danh từ tập hợp tự nhiên, đồng thời có thể hàm chỉ cảnh tù đày.
- source_word: οὐκ ἐπαισχύνθη
  choice: không hổ thẹn
  rationale: Bảo toàn sức nặng đạo đức và xã hội của động từ, mạnh hơn cách nói “không ngượng”.
theological_decisions:
- issue: Đối tượng của danh xưng “Chúa” trong lời cầu xin
  choice: Giữ cách gọi “Chúa” mà không xác định thêm
  alternative: Hiểu là Đức Chúa Trời là Cha hoặc Chúa Giê-su
  rationale: Nguyên văn chỉ có ὁ κύριος và không minh định đối tượng; bản dịch không nên tự giải quyết sự không xác định này.
- issue: Ý nghĩa của “xiềng xích”
  choice: Giữ hình ảnh xiềng xích trong chính văn
  alternative: Dịch diễn ý là “cảnh tù đày của tôi”
  rationale: Hình ảnh cụ thể của nguyên văn có thể được hiểu theo phép hoán dụ về cảnh tù đày; chú thích nêu nghĩa thay thế mà không xóa hình ảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ô-nê-si-phô-rơ” theo lối phiên âm tên riêng Hy Lạp; câu giữ hình ảnh nguyên văn và sắc thái của một lời cầu xin.
