  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: vi
  text: Hãy gìn giữ điều tốt lành đã được giao phó[a], nhờ Đức Thánh Linh, Đấng ngự trong chúng ta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “điều tốt đẹp được ký thác” hoặc “điều tốt lành được giao để gìn giữ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “bởi Đức Thánh Linh, Đấng sống trong chúng ta”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: điều tốt lành đã được giao phó
  rationale: παραθήκη chỉ một vật hay điều được ký thác để gìn giữ. Cách diễn đạt này tự nhiên trong tiếng Việt, giữ ý được giao phó mà không xác định thêm đó là Tin Lành hay chức vụ; καλὴν được thể hiện bằng “tốt lành”.
- source_word: φύλαξον
  choice: Hãy gìn giữ
  rationale: Mệnh lệnh này đòi hỏi chủ động bảo vệ điều đã được giao. “Gìn giữ” vừa trang trọng, tự nhiên, vừa hàm ý giữ cho khỏi mất mát hoặc hư hoại.
- source_word: διὰ πνεύματος ἁγίου
  choice: nhờ Đức Thánh Linh
  rationale: διά với sở hữu cách biểu thị phương tiện hoặc tác nhân. “Nhờ” chuyển tải tự nhiên ý hành động được thực hiện bằng sự trợ giúp hay năng lực của Đức Thánh Linh.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: Đấng ngự trong chúng ta
  rationale: Phân từ hiện tại ἐνοικοῦντος diễn tả sự hiện diện đang tiếp diễn. “Ngự trong” phù hợp văn phong trang trọng và diễn đạt sự cư ngụ bên trong, còn “chúng ta” giữ nguyên phạm vi chưa được xác định rõ của đại từ Hy Lạp.
theological_decisions:
- issue: Điều được παραθήκη nói đến là gì
  choice: 'Giữ cách nói khái quát: “điều tốt lành đã được giao phó”.'
  alternative: Tin Lành được giao cho Ti-mô-thê; hoặc sứ vụ được giao cho ông.
  rationale: Ngữ cảnh hướng mạnh đến sứ điệp Tin Lành hay kho tàng đức tin, nhưng câu Hy Lạp không gọi đích danh. Bản dịch không giải quyết thay cho nguyên văn.
- issue: Phạm vi của “chúng ta”
  choice: Giữ nguyên “chúng ta”.
  alternative: Phao-lô và Ti-mô-thê nói riêng; hoặc mọi người tin Chúa nói chung.
  rationale: ἡμῖν không tự nó buộc phải thu hẹp vào hai người hay mở rộng rõ ràng đến toàn thể tín hữu, nên bản dịch bảo tồn độ mở ấy.
- issue: Sắc thái của διά với Đức Thánh Linh
  choice: Dịch là “nhờ Đức Thánh Linh”.
  alternative: “bởi Đức Thánh Linh” hoặc “qua Đức Thánh Linh”.
  rationale: Cách dịch “nhờ” thể hiện phương tiện hoặc tác động mà không phân định quá mức giữa sự trợ giúp và tác nhân trực tiếp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Thánh Linh” theo lối gọi Cơ Đốc phổ biến; “gìn giữ” và “ngự trong” duy trì sắc thái tôn nghiêm mà không dùng thuật ngữ thần học quá chuyên biệt. Các dấu chú thích [a], [b] đều hiện diện trong chính văn.
