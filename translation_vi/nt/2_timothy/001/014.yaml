  source_fidelity: Chính văn chuyển đạt đúng mệnh lệnh φύλαξον, đối tượng παραθήκη với sắc thái được giao phó, phẩm chất καλὴν, và phương tiện διὰ πνεύματος ἁγίου. “Đấng ngự trong chúng ta” phản ánh đúng phân từ hiện tại τοῦ ἐνοικοῦντος ἐν ἡμῖν và không thu hẹp phạm vi của “chúng ta”.
  naturalness: Câu văn tự nhiên, trang trọng và phù hợp tiếng Việt tiêu chuẩn hiện đại. “Gìn giữ” và “nhờ Đức Thánh Linh” rõ nghĩa, không nặng tính kỹ thuật.
  terminology: “Đức Thánh Linh” là thuật ngữ Cơ Đốc phổ biến và nhất quán. Tuy nhiên, chú thích a hiện dùng “kho tàng” và đặc biệt “điều quý báu” làm dịch lệch sắc thái của καλὴν (“tốt lành”, cũng có thể là “cao quý”), đồng thời thêm “cho con” không có trong chính văn Hy Lạp.
