revisions:
- from: Vì lý do đó, tôi nhắc con hãy khơi cho bùng cháy trở lại[a] ân tứ của Đức Chúa Trời ở trong con, là ân tứ con nhận được qua việc tôi đặt tay trên con.
  to: Vì lý do đó, tôi nhắc con hãy làm bùng cháy trở lại[a] ân tứ của Đức Chúa Trời, là ân tứ ở trong con qua việc tôi đặt tay trên con.
  rationale: Bản sửa loại bỏ ý bổ sung «con nhận được», để mệnh đề «là ân tứ ở trong con qua việc tôi đặt tay trên con» phản ánh trực tiếp hơn ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου và giữ nguyên độ mở của liên hệ “qua”. Đồng thời, «làm bùng cháy trở lại» là cách nói hiện đại, rõ ràng và vẫn bảo toàn hình ảnh lửa của động từ Hy Lạp.
