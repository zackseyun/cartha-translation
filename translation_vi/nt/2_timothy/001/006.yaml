base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: vi
  text: Vì lý do đó, tôi nhắc con hãy làm bùng cháy trở lại[a] ân tứ của Đức Chúa Trời, là ân tứ ở trong con qua việc tôi đặt tay trên con.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “quạt cho bùng lên.” Động từ Hy Lạp gợi hình ảnh làm cho ngọn lửa cháy mạnh trở lại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Vì lý do đó
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt, giữ rõ quan hệ nguyên nhân với mạch văn trước.
- source_word: ἀναμιμνῄσκω
  choice: tôi nhắc con
  rationale: Diễn đạt tự nhiên động từ hiện tại cùng kết cấu nhắc một người làm điều gì; đại từ “con” phù hợp quan hệ của Phao-lô với Ti-mô-thê trong thư.
- source_word: σε ἀναζωπυρεῖν
  choice: con hãy khơi cho bùng cháy trở lại
  rationale: Giữ hình ảnh sống động của việc làm cho ngọn lửa cháy mạnh trở lại, đồng thời thể hiện nội dung khích lệ của bổ ngữ nguyên mẫu.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: ân tứ của Đức Chúa Trời
  rationale: “Ân tứ” chuyển tải món quà được ban bởi ân điển mà không tự ý thu hẹp thành một loại ân tứ thuộc linh cụ thể.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: ở trong con
  rationale: Giữ ý ân tứ hiện đang hiện diện trong Ti-mô-thê bằng cách nói gọn và tự nhiên.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: là ân tứ con nhận được qua việc tôi đặt tay trên con
  rationale: “Qua” phản ánh διά với sở hữu cách như phương tiện; bổ sung “con nhận được” để câu tiếng Việt tự nhiên và làm rõ quan hệ của mệnh đề, nhưng không xác định thêm cơ chế thần học.
theological_decisions:
- issue: Mối liên hệ giữa ân tứ và hành động đặt tay của Phao-lô
  choice: qua việc tôi đặt tay trên con
  alternative: bởi việc tôi đặt tay trên con
  rationale: “Qua” giữ lời khẳng định rằng ân tứ đến qua hành động đặt tay của Phao-lô nhưng không áp đặt một thần học bí tích phát triển hơn điều câu Kinh Thánh nói.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “tôi—con” để phản ánh giọng khuyên nhủ thân tình của Phao-lô đối với Ti-mô-thê. Hình ảnh lửa trong động từ Hy Lạp được giữ trực tiếp.
