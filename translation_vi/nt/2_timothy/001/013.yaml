  source_fidelity: 'Bản dịch chuyển đạt đúng các thành tố chính của câu Hy Lạp: mệnh lệnh giữ/duy trì (ἔχε), “khuôn mẫu” (ὑποτύπωσιν), “những lời lành mạnh” (ὑγιαινόντων λόγων), nguồn là từ Phao-lô, và cụm “trong đức tin và tình yêu thương”. Chú thích b bảo lưu thích đáng khả năng cụm ἐν πίστει καὶ ἀγάπῃ liên hệ với nội dung những lời. Không cần giải quyết dứt khoát mơ hồ cú pháp này. Cần chuẩn hóa tên Giê-su theo tiếng Việt hiện đại.'
  naturalness: Câu chính trang trọng, rõ nghĩa và phù hợp văn phong Kinh Thánh tiếng Việt hiện đại. “Khuôn mẫu của những lời lành mạnh” giữ được phép ẩn dụ của nguyên văn mà không diễn giải thành “giáo lý”. Cách xưng hô “ta—con” có thể chấp nhận trong thư tín mục vụ; không cần thay đổi để sửa nghĩa. Tuy nhiên, chính tả “Jêsus” không phải lựa chọn chuẩn trong tiếng Việt hiện đại phổ thông; “Giê-su” tự nhiên và nhất quán hơn.
  terminology: “Đấng Mê-si-a” phản ánh đúng lực tước hiệu của Χριστός và chú thích cách gọi truyền thống là hữu ích. Chuẩn hóa “Jêsus” thành “Giê-su” cả trong văn bản lẫn chú thích. Các thuật ngữ “đức tin”, “tình yêu thương”, “khuôn mẫu”, và “lành mạnh” phù hợp ngữ cảnh.
