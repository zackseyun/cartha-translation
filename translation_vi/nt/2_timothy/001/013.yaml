reference: 2 Timothy 1:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: vi
  text: Hãy giữ lấy khuôn mẫu của những lời lành mạnh mà con đã nghe từ ta[b], trong đức tin[a] và tình yêu thương ở trong Đấng Mê-si-a Giê-su.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trong sự trung tín và tình yêu thương”. Từ Hy Lạp được dịch là “đức tin” cũng có thể mang nghĩa “sự trung tín” hoặc “lòng tin cậy”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “những lời lành mạnh mà con đã nghe từ ta về đức tin và tình yêu thương ở trong Đấng Mê-si-a Giê-su.” Cấu trúc Hy Lạp có thể mô tả cách Ti-mô-thê giữ khuôn mẫu, hoặc nội dung của những lời ấy.'
    reason: alternative_reading
  - marker: c
    text: 'Cách dịch truyền thống: “Đấng Christ Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: khuôn mẫu
  rationale: Danh từ này chỉ một mẫu hình hay kiểu mẫu để noi theo. “Khuôn mẫu” vừa tự nhiên trong tiếng Việt vừa giữ được ý về hình thức có tính chuẩn mực mà không diễn giải quá mức.
- source_word: ἔχε
  choice: hãy giữ lấy
  rationale: Tuy nghĩa đen là “hãy có”, mệnh lệnh trong ngữ cảnh kêu gọi Ti-mô-thê duy trì và gắn bó với khuôn mẫu đã nhận. “Hãy giữ lấy” truyền đạt rõ sắc thái ấy.
- source_word: ὑγιαινόντων λόγων
  choice: những lời lành mạnh
  rationale: ὑγιαίνω mang hình ảnh “khỏe mạnh, lành mạnh” theo nghĩa bóng khi nói về lời dạy; λόγοι là “những lời”. Cách dịch này bảo toàn cả danh từ lẫn hình ảnh của nguyên văn, thay vì diễn giải thành “giáo lý chân chính”.
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: mà con đã nghe từ ta
  rationale: 'παρά với sở hữu cách ở đây chỉ nguồn: “từ ta”. Đại từ quan hệ nối tự nhiên với “những lời” trong tiếng Việt.'
- source_word: ἐν πίστει
  choice: trong đức tin
  rationale: πίστις trước hết được dịch là “đức tin”; cụm giới từ có thể chỉ phạm vi hoặc cách thức Ti-mô-thê giữ lấy khuôn mẫu. Khả năng mang nghĩa “sự trung tín” được ghi trong chú thích.
- source_word: καὶ ἀγάπῃ
  choice: và tình yêu thương
  rationale: ἀγάπη được chuyển bằng cách nói tự nhiên, trang trọng và quen thuộc trong tiếng Việt là “tình yêu thương”.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a Jêsus
  rationale: Cụm có mạo từ bổ nghĩa về ý nghĩa cho cả “đức tin” và “tình yêu thương”. “Ở trong” giữ được hình ảnh liên hiệp hoặc phạm vi trong nguyên văn mà không giải nghĩa thêm.
- source_word: Χριστῷ Ἰησοῦ
  choice: Đấng Mê-si-a Jêsus
  rationale: Χριστός vẫn mang lực của một tước hiệu trong cụm này, nên “Đấng Mê-si-a” biểu đạt nghĩa của từ thay vì chỉ phiên chuyển theo cách gọi truyền thống. Phương án “Đấng Christ Jêsus” được bảo lưu trong chú thích.
theological_decisions:
- issue: Quan hệ cú pháp của ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ
  choice: 'Hiểu cụm này chủ yếu là chỉ phạm vi hoặc cách thức Ti-mô-thê giữ khuôn mẫu: trong đức tin và tình yêu thương bắt nguồn hoặc tồn tại trong Đấng Mê-si-a Jêsus.'
  alternative: Cụm này có thể gắn với “những lời”, tức là những lời Ti-mô-thê đã nghe về đức tin và tình yêu thương trong Đấng Mê-si-a Jêsus.
  rationale: Trình tự khuyên bảo phù hợp hơn với cách hiểu cụm từ mô tả việc “giữ lấy”, nhưng cú pháp Hy Lạp không loại trừ cách gắn với nội dung của “những lời”. Chú thích bảo lưu sự mơ hồ thật sự này.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong công thức này, từ vẫn có thể được nhận biết là tước hiệu “Đấng được xức dầu”. Bản dịch chính nêu rõ nghĩa ấy, đồng thời chú thích cách gọi truyền thống.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô “ta—con” phù hợp lời một người cha thuộc linh khuyên bảo người cộng sự trẻ; tránh từ ngữ giáo phái. “Những lời lành mạnh” cố ý giữ hình ảnh sức khỏe của nguyên văn, còn “khuôn mẫu” giữ tính cô đọng của câu Hy Lạp.
