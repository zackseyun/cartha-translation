    rationale: καὶ εὗρεν tiếp tục với tân ngữ με; tiếng Việt có thể hiểu được từ mệnh đề trước, nhưng lặp “tôi” ở đây rõ ràng hơn và phản ánh đầy đủ kết quả của cuộc tìm kiếm.
  - severity: low
    issue: Cách diễn đạt “sát chữ hơn” trong chú thích chưa chính xác.
    rationale: γενόμενος là phân từ aorist của γίνομαι; trong tổ hợp với ἐν Ῥώμῃ, câu có thể được hiểu theo các cách thành ngữ như “khi ở” hoặc “khi đến,” chứ “khi đang ở” không phải đơn thuần là bản dịch sát chữ hơn.
