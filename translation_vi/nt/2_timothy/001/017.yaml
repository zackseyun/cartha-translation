  text: but when he was in Rome[a], he searched for me diligently and found me—
translation:
  language: vi
  text: nhưng khi ở Rô-ma[a], ông đã hết sức tìm kiếm tôi và đã tìm thấy tôi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi ông đến Rô-ma.” Cấu trúc Hy Lạp γενόμενος ἐν Ῥώμῃ có thể được diễn đạt thành ngữ là “khi ở Rô-ma” hoặc “khi đến Rô-ma,” tùy văn cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: nhưng
  rationale: Liên từ tương phản, đối chiếu việc làm của Ô-nê-si-phô-rơ với sự hổ thẹn hoặc xa lánh được nói đến trong văn cảnh trước.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: khi ở Rô-ma
  rationale: Cách dịch tự nhiên, gần với nghĩa hiện diện tại Rô-ma, đồng thời không buộc phân từ γενόμενος phải mang riêng ý 'đến' hay 'tới nơi'.
- source_word: σπουδαίως
  choice: hết sức
  rationale: Diễn tả sự sốt sắng và nỗ lực nghiêm túc; kết hợp tự nhiên với động từ 'tìm kiếm' trong tiếng Việt.
- source_word: ἐζήτησέν με
  choice: tìm kiếm tôi
  rationale: Giữ rõ đối tượng trực tiếp và nhấn mạnh hành động chủ động dò tìm một người.
- source_word: καὶ εὗρεν
  choice: và đã tìm thấy
  rationale: Diễn đạt kết quả của cuộc tìm kiếm; đối tượng 'tôi' được hiểu tự nhiên từ mệnh đề trước mà không cần lặp lại.
