id: 2TI.3.9
reference: 2 Timothy 3:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: vi
  text: Nhưng họ sẽ không tiến xa hơn nữa[a], vì sự ngu muội của họ sẽ lộ rõ trước mọi người, cũng như sự ngu muội của những người kia đã lộ rõ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sẽ không tiến thêm được nữa.”'
    reason: lexical_alternative
  - marker: b
    text: “Những người kia” là Gian-nét và Giam-brét, được nhắc đến trong câu trước.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: sẽ không tiến xa hơn nữa
  rationale: προκόπτω chỉ việc tiến tới hoặc tiến triển. Trong ngữ cảnh các giáo sư giả, “tiến xa hơn nữa” giữ được hình ảnh tiến bước nhưng không hàm ý sự phát triển tích cực.
- source_word: ἐπὶ πλεῖον
  choice: xa hơn nữa
  rationale: Thành ngữ này có nghĩa là “thêm nữa” hoặc “đến mức xa hơn”; kết hợp tự nhiên với phủ định οὐ trong tiếng Việt.
- source_word: ἄνοια
  choice: sự ngu muội
  rationale: ἄνοια nói đến tình trạng thiếu hiểu biết, mất sáng suốt hay ngu dại. “Sự ngu muội” truyền đạt cả sắc thái trí tuệ lẫn đạo đức trong văn cảnh.
- source_word: ἔκδηλος
  choice: trở nên rõ ràng
  rationale: Từ này có nghĩa là hiển nhiên, lộ rõ. Cách dịch này tự nhiên và phản ánh thì tương lai ἔσται.
- source_word: πᾶσιν
  choice: trước mọi người
  rationale: Dạng tặng cách số nhiều diễn tả những người nhận biết sự ngu muội ấy; “trước mọi người” là cách nói tự nhiên trong tiếng Việt.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: cũng như sự ngu muội của những người kia đã từng bị phơi bày
  rationale: Mệnh đề Hy Lạp tỉnh lược danh từ ἄνοια và dùng ἐκείνων để chỉ những người vừa được nhắc đến. Bổ sung “sự ngu muội” giúp câu tiếng Việt rõ nghĩa; “bị phơi bày” diễn đạt theo ngữ cảnh điều đã trở nên hiển nhiên, không biến cách hiểu đó thành tên riêng trong chính văn.
theological_decisions:
- issue: Đối tượng được đại từ ἐκείνων chỉ đến
  choice: Giữ trong chính văn là “những người kia”, với chú thích xác định là Gian-nét và Giam-brét ở câu trước.
  alternative: Hiểu rộng hơn là những kẻ dạy giả trước kia nói chung.
  rationale: Tiền ngữ trực tiếp trong 3:8 là Gian-nét và Giam-brét. Cách dịch giữ liên kết hồi chỉ mà không đưa tên riêng vào chỗ nguyên văn chỉ dùng đại từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngu muội” phù hợp hơn “điên rồ” vì nhấn mạnh sự thiếu sáng suốt. Các dấu chú thích [a], [b] đều được đặt trong chính văn.
