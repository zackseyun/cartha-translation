revisions:
- from: Vì người ta sẽ chỉ yêu bản thân, ham tiền, khoác lác, kiêu ngạo, nói lời xúc phạm[a], không vâng lời cha mẹ, vô ơn, bất kính với điều thánh,
  to: Vì sẽ có những người yêu bản thân, ham tiền, khoác lác, kiêu ngạo, nói lời xúc phạm[a], không vâng lời cha mẹ, vô ơn, không tôn kính điều thánh,
  rationale: Bỏ “chỉ” để không thêm giới hạn vào φίλαυτοι; thay cấu trúc mở đầu bằng cách diễn đạt tương lai tự nhiên hơn trong tiếng Việt; và điều chỉnh cách dịch ἀνόσιοι cho sáng rõ, vẫn bảo toàn sắc thái thiếu tôn kính điều thiêng liêng. Chú thích của βλάσφημοι được giữ với chỉnh sửa nhỏ về diễn đạt.
  reviewer_model: gpt-5.6-terra
