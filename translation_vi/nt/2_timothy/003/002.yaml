id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: vi
  text: Vì sẽ có những người yêu bản thân, ham tiền, khoác lác, kiêu ngạo, nói lời xúc phạm[a], không vâng lời cha mẹ, vô ơn, không tôn kính điều thánh,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “phỉ báng”, “lăng mạ” hoặc “phạm thượng”. Từ Hy Lạp có thể chỉ lời lẽ làm nhục con người hoặc xúc phạm Đức Chúa Trời.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: sẽ
  rationale: Thì tương lai của εἰμί; tiếng Việt diễn đạt tự nhiên bằng “sẽ”, kết hợp với các tính chất được liệt kê.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích của liên từ đối với câu trước.
- source_word: οἱ ἄνθρωποι
  choice: người ta
  rationale: Diễn đạt nghĩa chỉ con người nói chung, không giới hạn ở nam giới.
- source_word: φίλαυτοι
  choice: chỉ yêu bản thân
  rationale: Nêu rõ sắc thái vị kỷ của từ ghép, đồng thời tự nhiên và dễ hiểu trong tiếng Việt hiện đại.
- source_word: φιλάργυροι
  choice: ham tiền
  rationale: Chuyển tải trực tiếp lòng yêu tiền bằng cách nói ngắn gọn, thông dụng, phù hợp nhịp liệt kê.
- source_word: ἀλαζόνες
  choice: khoác lác
  rationale: Diễn tả thói huênh hoang, tự phô trương của từ Hy Lạp.
- source_word: ὑπερήφανοι
  choice: kiêu ngạo
  rationale: Giữ rõ sắc thái đạo đức tiêu cực, phân biệt với niềm tự hào có thể chính đáng.
- source_word: βλάσφημοι
  choice: nói lời xúc phạm
  rationale: Bao quát lời lẽ lăng mạ, phỉ báng hoặc bất kính; không tự ý giới hạn đối tượng là con người hay Đức Chúa Trời.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: không vâng lời cha mẹ
  rationale: Cách diễn đạt tự nhiên, chính xác cho tính từ chỉ sự không chịu thuận phục đi với cha mẹ ở cách dữ cách.
- source_word: ἀχάριστοι
  choice: vô ơn
  rationale: Tương đương ngắn gọn và thông dụng với ý thiếu lòng biết ơn.
- source_word: ἀνόσιοι
  choice: bất kính với điều thánh
  rationale: Diễn đạt sự thiếu lòng tôn kính đối với những gì thiêng liêng, tránh để “không thánh khiết” bị hiểu chủ yếu là không trong sạch.
theological_decisions:
- issue: Phạm vi của οἱ ἄνθρωποι
  choice: người ta
  alternative: những người đàn ông; loài người
  rationale: Cụm giống đực số nhiều mang nghĩa khái quát về con người, không chỉ riêng nam giới.
- issue: Đối tượng của βλάσφημοι
  choice: nói lời xúc phạm
  alternative: phỉ báng; phạm thượng; lăng mạ
  rationale: Từ Hy Lạp có thể chỉ lời nói làm nhục con người hoặc xúc phạm Đức Chúa Trời. Bản dịch chính giữ độ rộng ấy, còn chú thích nêu rõ hai hướng nghĩa.
- issue: Sắc thái của ἀνόσιοι
  choice: bất kính với điều thánh
  alternative: không thánh khiết; vô đạo
  rationale: Lựa chọn này nhấn đúng sự thiếu tôn kính đối với điều thiêng liêng mà không đồng nhất từ này với một hệ phái hay một định nghĩa giáo lý riêng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; duy trì nhịp dồn dập của danh sách các thói xấu. Dùng các cụm ngắn, quen thuộc trong tiếng Việt, đồng thời giữ sự mơ hồ thật sự của βλάσφημοι bằng cách dịch rộng và chú thích.
