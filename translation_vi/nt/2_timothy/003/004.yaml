lexical_decisions:
- source_word: προδόται
  choice: phản bội
  rationale: Diễn tả những người phản trắc, phản bội; cách nói ngắn gọn, tự nhiên, phù hợp với nhịp của danh sách thói xấu.
- source_word: προπετεῖς
  choice: liều lĩnh
  rationale: Chỉ thái độ hấp tấp, xông tới mà không cân nhắc hậu quả; “liều lĩnh” rõ nghĩa trong tiếng Việt hiện đại.
- source_word: τετυφωμένοι
  choice: tự cao
  rationale: Phân từ hoàn thành bị động của τυφόομαι diễn tả tình trạng bị lòng kiêu ngạo làm cho phồng lên; “tự cao” truyền đạt nghĩa trong ngữ cảnh, còn hình ảnh nguyên văn được ghi ở chú thích.
- source_word: φιλήδονοι
  choice: ham mê lạc thú
  rationale: Truyền đạt khuynh hướng yêu chuộng khoái lạc bằng cách nói tự nhiên, đồng thời giữ thế đối lập với việc yêu mến Đức Chúa Trời.
- source_word: μᾶλλον ἢ
  choice: hơn là
  rationale: Giữ được cấu trúc so sánh, có thể hàm ý ưu tiên hoặc tương phản mà không buộc phải tuyệt đối hóa thành sự loại trừ hoàn toàn.
- source_word: φιλόθεοι
  choice: yêu mến Đức Chúa Trời
  rationale: Diễn đạt trực tiếp hợp từ mang nghĩa yêu Đức Chúa Trời và tạo đối xứng ý nghĩa với φιλήδονοι.
theological_decisions:
- issue: Giữ sự đối lập tu từ giữa lòng ham mê lạc thú và tình yêu dành cho Đức Chúa Trời
  choice: “ham mê lạc thú hơn là yêu mến Đức Chúa Trời”
  alternative: “yêu lạc thú thay vì yêu Đức Chúa Trời”
  rationale: “Hơn là” phản ánh μᾶλλον ἢ và giữ độ mở của cấu trúc so sánh; “thay vì” có thể khiến sự đối lập trở nên tuyệt đối hơn nguyên văn.
- issue: Cách chuyển hình ảnh kiêu ngạo trong τετυφωμένοι
  choice: Dùng “tự cao” trong câu chính và ghi nghĩa sát chữ trong chú thích
  alternative: “phồng lên vì kiêu ngạo”
  rationale: Câu chính tự nhiên và trang trọng trong tiếng Việt, trong khi chú thích bảo tồn hình ảnh của từ Hy Lạp mà không áp đặt sắc thái giáo lý khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; giữ dạng liệt kê cô đọng của nguyên văn. Dùng “Đức Chúa Trời” theo lối xưng gọi Kinh Thánh phổ biến trong tiếng Việt. Các dấu chú thích được đặt ngay sau từ ngữ tương ứng.
