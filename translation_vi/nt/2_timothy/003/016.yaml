  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: vi
  text: Mọi phần Kinh Thánh đều do Đức Chúa Trời hà hơi và có ích cho việc dạy dỗ, khiển trách, sửa trị và rèn luyện trong sự công chính.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Toàn bộ Kinh Thánh đều do Đức Chúa Trời hà hơi và có ích.” Cụm Hy Lạp πᾶσα γραφή có thể được hiểu theo nghĩa phân phối (“mọi phần Kinh Thánh”) hoặc nghĩa tập hợp (“toàn bộ Kinh Thánh”).'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “Mọi phần Kinh Thánh do Đức Chúa Trời hà hơi cũng đều có ích cho việc dạy dỗ, khiển trách, sửa trị và rèn luyện trong sự công chính.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Mọi lời Kinh Thánh
  rationale: γραφή trong ngữ cảnh này chỉ Kinh Thánh, không phải bất kỳ văn bản nào. “Mọi lời Kinh Thánh” giữ sắc thái phân phối của πᾶσα, đồng thời vẫn chỉ toàn thể các sách thánh; cách hiểu tập hợp “toàn bộ Kinh Thánh” được ghi nhận trong chú thích.
- source_word: θεόπνευστος
  choice: do Đức Chúa Trời hà hơi
  rationale: Cách dịch này phản ánh trực tiếp cấu tạo và ý nghĩa của θεόπνευστος (“được Đức Chúa Trời thở ra”), tránh đưa thêm một học thuyết cụ thể về sự soi dẫn. “Hà hơi” có sắc thái trang trọng và quen thuộc trong văn phong Kinh Thánh.
- source_word: ὠφέλιμος
  choice: có ích
  rationale: Diễn đạt tự nhiên, rõ ràng ý nghĩa có lợi, hữu dụng cho các mục đích được liệt kê tiếp theo.
- source_word: πρὸς διδασκαλίαν
  choice: cho việc dạy dỗ
  rationale: Bao quát cả hoạt động và nội dung giảng dạy, không thu hẹp διδασκαλία thành một thuật ngữ giáo phái.
- source_word: ἐλεγμόν
  choice: khiển trách
  rationale: Diễn tả việc phơi bày và quở trách điều sai; tự nhiên hơn “chứng minh lỗi” trong tiếng Việt hiện đại.
- source_word: ἐπανόρθωσιν
  choice: sửa trị
  rationale: Chuyển tải ý chỉnh lại cho đúng, khôi phục tình trạng ngay thẳng; đồng thời phân biệt với mục “khiển trách” đi trước.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: rèn luyện trong sự công chính
  rationale: παιδεία nói đến sự giáo dục và uốn luyện có tính hình thành; “rèn luyện” thể hiện rõ tiến trình ấy. δικαιοσύνη ở đây phù hợp với đời sống ngay thẳng về đạo đức.
theological_decisions:
- issue: Quan hệ cú pháp của θεόπνευστος và ὠφέλιμος với πᾶσα γραφή
  choice: 'Hiểu cả hai tính từ theo vị ngữ: “Mọi lời Kinh Thánh đều do Đức Chúa Trời hà hơi và có ích.”'
  alternative: “Mọi lời Kinh Thánh do Đức Chúa Trời hà hơi cũng đều có ích...”
  rationale: Cách hiểu vị ngữ tạo sự song song tự nhiên giữa hai tính từ và phù hợp với mạch văn dẫn sang câu 17. Tuy vậy, nguyên ngữ không có động từ nối nên cách hiểu θεόπνευστος theo thuộc tính vẫn khả dĩ; chú thích bảo tồn sự mơ hồ thật sự này.
- issue: Cách hiểu πᾶσα γραφή theo nghĩa phân phối hay tập hợp
  choice: “Mọi lời Kinh Thánh” theo nghĩa phân phối.
  alternative: “Toàn bộ Kinh Thánh” theo nghĩa tập hợp.
  rationale: Danh ngữ không có mạo từ có thể được hiểu theo cả hai cách. Bản chính giữ sát hình thức Hy Lạp hơn, còn chú thích ghi nhận cách hiểu tập hợp phổ biến.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Đức Chúa Trời hà hơi” giữ hình ảnh từ nguyên ngữ; “sự công chính” bảo tồn thuật ngữ thần học quen thuộc, trong khi toàn cụm cho thấy trọng tâm ở sự hình thành một đời sống ngay thẳng.
