id: 2TI.3.1
reference: 2 Timothy 3:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: vi
  text: 'Nhưng hãy biết điều này: trong những ngày sau cùng, những thời kỳ khó khăn[a] sẽ đến.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những thời kỳ nguy hiểm” hoặc “những thời kỳ khắc nghiệt”. Tính từ Hy Lạp có thể chỉ những thời kỳ khó đương đầu, nguy hiểm hoặc đau đớn.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: điều này
  rationale: Đại từ chỉ định trung tính hướng tới nội dung được nêu sau ὅτι; “điều này” tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ biểu thị một bước chuyển có sắc thái tương phản nhẹ với phần trước; “Nhưng” giữ được sắc thái ấy mà không nhấn quá mạnh.
- source_word: γίνωσκε
  choice: hãy biết
  rationale: Động từ mệnh lệnh hiện tại, ngôi hai số ít. “Hãy biết” truyền đạt trực tiếp lời khuyên Timothy phải nhận thức và ghi nhớ thực tại sắp được nêu.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι dẫn vào nội dung cần biết; dấu hai chấm sau “điều này” diễn đạt chức năng ấy tự nhiên trong tiếng Việt.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: trong những ngày sau cùng
  rationale: Giữ nguyên thành ngữ cánh chung mà không thu hẹp phạm vi thời gian; “những ngày sau cùng” trang trọng, dễ hiểu và quen thuộc trong tiếng Việt.
- source_word: ἐνστήσονται
  choice: sẽ đến
  rationale: Dạng tương lai của ἐνίστημι ở đây mang nghĩa xuất hiện, trở nên hiện diện hoặc ập đến. “Sẽ đến” ngắn gọn, tự nhiên khi đi với “những thời kỳ”.
- source_word: καιροὶ
  choice: những thời kỳ
  rationale: καιρός chỉ những thời điểm, giai đoạn hay hoàn cảnh đặc thù chứ không chỉ thời gian theo dòng niên đại; “những thời kỳ” giữ được sắc thái này.
- source_word: χαλεποί
  choice: khó khăn
  rationale: χαλεπός có thể chỉ điều khó chịu đựng, nguy hiểm hoặc khắc nghiệt. “Khó khăn” là cách diễn đạt rộng, tự nhiên; chú thích bảo tồn các sắc thái mạnh hơn.
theological_decisions:
- issue: Ý nghĩa của “những ngày sau cùng”
  choice: Giữ nguyên thành ngữ cánh chung “những ngày sau cùng”, không giới hạn nó chỉ vào giai đoạn ngay trước khi Đấng Christ trở lại.
  alternative: Có thể hiểu là giai đoạn cuối cùng ngay trước tận thế, hoặc rộng hơn là thời kỳ cánh chung đã khởi đầu.
  rationale: Cụm từ mang sức nặng thần học và cho phép nhiều cách xác định phạm vi thời gian trong bối cảnh Tân Ước. Bản dịch giữ nguyên sự căng thẳng đó thay vì áp đặt một hệ thống cánh chung cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Trật tự câu gần với nguyên văn nhưng vẫn tự nhiên; dấu hai chấm làm rõ rằng mệnh đề sau là nội dung Timothy phải biết.
