  source_fidelity: 'Bản dịch truyền đạt đúng các thành tố chính của nguyên văn: mệnh lệnh γίνωσκε (“hãy biết”), mệnh đề nội dung, cụm cánh chung ἐν ἐσχάταις ἡμέραις (“trong những ngày sau cùng”), và lời dự báo về καιροὶ χαλεποί (“những thời kỳ khó khăn”). “Sẽ đến” phản ánh phù hợp sắc thái tương lai của ἐνστήσονται mà không xác định quá mức cách các thời kỳ ấy hiện diện.'
  naturalness: 'Câu văn hiện đại, rõ ràng và có nhịp văn trang trọng thích hợp cho bản dịch Kinh Thánh. Cấu trúc “Nhưng hãy biết điều này: ...” tự nhiên trong tiếng Việt; sự lặp lại giữa “ngày” và “thời kỳ” tuy gần nghĩa nhưng phản ánh hai danh từ riêng biệt trong nguyên văn và vẫn dễ đọc.'
  terminology: “Những ngày sau cùng” là cách diễn đạt đã ổn định, giữ được tính mở cánh chung của ἐσχάταις ἡμέραις. “Những thời kỳ khó khăn” là lựa chọn bao quát cho καιροὶ χαλεποί. Chú thích nêu thích đáng các sắc thái “nguy hiểm” và “khắc nghiệt”, không áp đặt một cách hiểu thần học riêng.
