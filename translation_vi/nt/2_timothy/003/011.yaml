  to: những cuộc bắt bớ, những nỗi khổ đau như đã xảy đến với tôi tại An-ti-ốt, I-cô-ni và Lít-trơ—tôi đã chịu đựng biết bao cuộc bắt bớ[a]! Và Chúa đã giải cứu tôi khỏi tất cả những điều ấy.[b]
