id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: vi
  text: những cuộc bắt bớ, những nỗi khổ đau như đã xảy đến với tôi tại An-ti-ốt, I-cô-ni và Lít-trơ—tôi đã chịu đựng biết bao cuộc bắt bớ[a]! Và Chúa đã giải cứu tôi khỏi tất cả những điều ấy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tôi đã chịu đựng những cuộc bắt bớ như thế nào.”'
    reason: lexical_alternative
  - marker: b
    text: “Chúa” rất có thể chỉ Chúa Giê-su, dù nguyên văn Hy Lạp chỉ ghi “Chúa”.
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: những cuộc bắt bớ
  rationale: Diễn tả sự truy đuổi và áp bức thù nghịch vì lòng trung thành hoặc sứ mạng; đây là cách nói tự nhiên và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: παθήμασιν
  choice: những nỗi khổ đau
  rationale: Giữ nghĩa rộng của những điều phải chịu, không giới hạn vào hoạn nạn bên ngoài.
- source_word: οἷά μοι ἐγένετο
  choice: như đã xảy đến với tôi
  rationale: Giữ sắc thái nêu ví dụ của οἷα và diễn đạt tự nhiên trong tiếng Việt.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: tại An-ti-ốt, I-cô-ni và Lít-trơ
  rationale: Phiên âm các địa danh theo dạng tiếng Việt dễ đọc; một giới từ chung giúp câu tự nhiên mà vẫn giữ đủ ba địa điểm.
- source_word: οἵους διωγμοὺς
  choice: biết bao cuộc bắt bớ
  rationale: Thể hiện lực cảm thán và định tính của οἵους, nhấn mạnh mức độ mà không giải thích quá mức.
- source_word: ὑπήνεγκα
  choice: tôi đã chịu đựng
  rationale: Diễn đạt hành động bền lòng gánh chịu dưới áp lực một cách rõ ràng, tự nhiên.
- source_word: ἐκ πάντων
  choice: khỏi tất cả những điều ấy
  rationale: Liên hệ trở lại toàn bộ các cuộc bắt bớ và nỗi khổ vừa kể, đồng thời giữ ý được đưa ra khỏi nguy hiểm.
- source_word: ἐρρύσατο
  choice: đã giải cứu
  rationale: Truyền đạt cụ thể ý cứu thoát khỏi hiểm nguy, không thu hẹp thành nghĩa cứu rỗi thuộc linh.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên tước hiệu của bản Hy Lạp mà không thêm tên của đối tượng được nói đến.
theological_decisions:
- issue: Đối tượng được gọi là ὁ κύριος
  choice: Dịch đơn giản là “Chúa”
  alternative: “Chúa Giê-su”
  rationale: Trong văn mạch thư Phao-lô, tước hiệu này rất có thể chỉ Chúa Giê-su, nhưng bản Hy Lạp chỉ ghi “Chúa”; bản dịch không thêm tên để khỏi giải quyết thay sự hàm hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dấu gạch ngang cùng câu cảm thán tái hiện sự nhấn mạnh của οἵους; “Nhưng” diễn đạt tự nhiên lực chuyển ý của καί trong mệnh đề giải cứu. Mọi dấu chú thích đều xuất hiện trong chính văn.
