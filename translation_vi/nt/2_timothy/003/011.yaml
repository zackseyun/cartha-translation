    issue: “Nhưng” dịch καί quá đối lập.
    rationale: Nguyên văn viết καὶ ἐκ πάντων..., nghĩa cơ bản là “và [Ngài] đã giải cứu tôi khỏi tất cả.” Dù ngữ cảnh có sự tương phản ngầm giữa hoạn nạn và giải cứu, bản dịch không nên thêm liên từ đối lập rõ nét khi bản nguồn chỉ dùng liên từ nối.
  revised_text: những cuộc bắt bớ, những nỗi khổ đau như đã xảy đến với tôi tại An-ti-ốt, I-cô-ni và Lít-trơ—tôi đã chịu đựng biết bao cuộc bắt bớ[a]! Và Chúa đã giải cứu tôi khỏi tất cả những điều ấy.[b]
