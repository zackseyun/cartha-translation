id: 2TI.3.14
reference: 2 Timothy 3:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ δὲ μένε ἐν οἷς ἔμαθες καὶ ἐπιστώθης, εἰδὼς παρὰ ⸀τίνων ἔμαθες,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: vi
  text: Còn con, hãy tiếp tục giữ vững những điều con đã học và đã tin chắc[a], vì biết mình đã học những điều ấy từ những ai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hoặc “đã được xác tín” hay “đã được bảo đảm.”
    reason: lexical_alternative
  - marker: b
    text: Một số thủ bản chép “từ ai” ở số ít; cách đọc số nhiều ở đây có thể chỉ rộng hơn đến những người đã dạy Ti-mô-thê.
    reason: textual_variant
lexical_decisions:
- source_word: σὺ δὲ
  choice: Còn con
  rationale: Đại từ được nêu rõ để nhấn mạnh Ti-mô-thê, còn δέ tạo thế tương phản với những người được mô tả trước đó. “Còn con” tự nhiên trong tiếng Việt và giữ được sắc thái chuyển ý, đối lập.
- source_word: μένε ἐν οἷς
  choice: hãy tiếp tục giữ vững những điều
  rationale: Mệnh lệnh hiện tại μένε diễn tả sự bền đỗ liên tục; ἐν οἷς chỉ nội dung hay phạm vi của điều đã học. Cách dịch này truyền đạt tự nhiên ý tiếp tục ở lại, không rời bỏ những điều ấy.
- source_word: ἔμαθες
  choice: con đã học
  rationale: Thì aorist hướng đến việc Ti-mô-thê đã tiếp nhận sự dạy dỗ trước đó; “đã học” là cách diễn đạt rõ và tự nhiên.
- source_word: ἐπιστώθης
  choice: đã tin chắc
  rationale: Dạng bị động có thể chỉ việc được làm cho vững tin hay đạt đến sự xác tín. “Đã tin chắc” diễn đạt kết quả là niềm xác tín mà không đưa thêm ý về một sự ủy thác.
- source_word: εἰδὼς
  choice: vì biết mình
  rationale: Phân từ diễn tả sự biết có liên hệ hoàn cảnh hoặc nguyên nhân với mệnh lệnh. “Vì biết mình” tự nhiên trong tiếng Việt, dù làm rõ nhẹ sắc thái nguyên nhân vốn chỉ hàm ý trong tiếng Hy Lạp.
- source_word: παρὰ τίνων
  choice: từ những ai
  rationale: παρά với sở hữu cách chỉ nguồn, còn τίνων theo bản SBLGNT là số nhiều. “Từ những ai” giữ nguyên việc câu không nêu đích danh các người dạy.
- source_word: ἔμαθες
  choice: đã học những điều ấy
  rationale: Lần lặp lại của động từ có cùng nội dung được hiểu ngầm; thêm “những điều ấy” giúp câu tiếng Việt rõ ràng mà không thêm nội dung mới.
theological_decisions:
- issue: Những người được nói đến trong παρὰ τίνων
  choice: Dịch ở số nhiều là “từ những ai” và không xác định danh tính.
  alternative: Một số thủ bản dùng dạng số ít, có thể được hiểu là chỉ một người, thường được cho là Phao-lô.
  rationale: SBLGNT đọc số nhiều, còn chính câu này không nêu tên những người đã dạy Ti-mô-thê. Bản dịch giữ ngỏ phạm vi quy chiếu thay vì thu hẹp vào một nhân vật.
- issue: Sắc thái của ἐπιστώθης
  choice: “đã tin chắc,” chỉ sự xác tín của Ti-mô-thê đối với điều đã học.
  alternative: “đã được bảo đảm” hoặc “đã được xác tín.”
  rationale: Trong ngữ cảnh đi đôi với “đã học,” động từ nói đến sự vững tin nơi nội dung được dạy hơn là một nhiệm vụ hay kho tàng được giao phó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “con” theo quan hệ thân tình giữa Phao-lô và Ti-mô-thê; “Còn con” giữ thế tương phản rõ ràng. “Giữ vững” được chọn thay cho cách dịch sát chữ nhưng kém tự nhiên là “ở lại trong.”
