id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: vi
  text: Nhưng những kẻ xấu xa và những kẻ bịp bợm[a] sẽ ngày càng tệ hơn[b], vừa lừa dối người khác vừa bị lừa dối.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những kẻ mạo danh” hoặc “những kẻ lừa đảo”; từ Hy Lạp có thể chỉ những kẻ dùng mánh khóe gian trá và trong một số ngữ cảnh còn gợi sắc thái phù phép hoặc lang băm.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa: “sẽ tiến đến điều tệ hơn.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: xấu xa
  rationale: Diễn đạt sự bại hoại về đạo đức, không chỉ phẩm chất kém.
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản với lời nói trước đó về Ti-mô-thê.
- source_word: ἄνθρωποι
  choice: những kẻ
  rationale: Trong ngữ cảnh này chỉ những người có đặc tính xấu xa; cách gọi không giới hạn ở nam giới và kết hợp tự nhiên với các bổ ngữ.
- source_word: γόητες
  choice: những kẻ mạo danh
  rationale: Nêu bật tính giả trá, lừa bịp mà không khẳng định quá mức sắc thái phù thủy vốn chỉ có thể hiện diện trong một số ngữ cảnh.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: sẽ ngày càng tệ hơn
  rationale: Diễn đạt tự nhiên chuyển động tăng tiến theo chiều hướng xấu của thành ngữ Hy Lạp; ghi chú giữ lại hình thức sát chữ.
- source_word: πλανῶντες
  choice: lừa dối người khác
  rationale: Giữ nghĩa chủ động và làm rõ đối tượng hàm ẩn trong tiếng Việt.
- source_word: πλανώμενοι
  choice: bị lừa dối
  rationale: Bảo toàn thể bị động, cho thấy chính những kẻ lừa dối cũng ở trong tình trạng bị lừa.
theological_decisions:
- issue: Phạm vi của ἄνθρωποι
  choice: những kẻ
  alternative: những người đàn ông
  rationale: Danh từ số nhiều giống đực được dùng theo nghĩa chỉ người nói chung, không có căn cứ để giới hạn vào nam giới.
- issue: Sắc thái của γόητες
  choice: những kẻ mạo danh
  alternative: những phù thủy
  rationale: Ngữ cảnh nhấn mạnh sự giả trá và lừa dối; bản dịch không nhập thêm một khẳng định chắc chắn về hoạt động huyền thuật.
- issue: Quan hệ giữa hai phân từ πλανῶντες καὶ πλανώμενοι
  choice: vừa lừa dối người khác vừa bị lừa dối
  alternative: lừa dối và lầm lạc
  rationale: 'Giữ nguyên sự căng thẳng thần học và ngữ pháp: họ chủ động lừa dối nhưng đồng thời chính họ cũng bị lừa, thay vì chuyển vế sau thành nghĩa phản thân hay chỉ trạng thái sai lạc.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc “vừa… vừa…” giữ thế song song giữa hai phân từ; “ngày càng tệ hơn” là cách diễn đạt tự nhiên cho hướng tiến triển tiêu cực.
