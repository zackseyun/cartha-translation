  verdict: revise
  source_fidelity: 'Bản dịch giữ đúng quan hệ của các phân từ: những kẻ thuộc nhóm bị lên án lẻn vào các hộ gia đình, bắt giữ một nhóm phụ nữ dễ bị tổn thương, là những người đang mang gánh nặng tội lỗi và bị các ham muốn đa dạng chi phối. Tuy nhiên, “bắt phục” ít thông dụng trong tiếng Việt hiện đại, và “dục vọng” có thể thu hẹp ἐπιθυμίαι vào sắc thái dục tình hơn mức cần thiết.'
  naturalness: 'Cần thay một số cụm bằng cách nói hiện đại và rõ hơn: “bắt làm tù binh” bảo toàn hình ảnh αἰχμαλωτίζοντες; “bị tội lỗi đè nặng” tự nhiên hơn “bị tội lỗi chất nặng”; “ham muốn đủ loại” diễn đạt rộng và tự nhiên cho ἐπιθυμίαις ποικίλαις.'
  terminology: “Những người đàn bà nhẹ dạ” có thể giữ được sắc thái phê phán và tính quy chiếu đến một nhóm cụ thể của γυναικάρια, không biến thành nhận định về toàn thể phụ nữ. Chú thích cần nói rõ đây là từ giảm xưng có sắc thái coi thường, nhưng không khẳng định quá mức rằng nghĩa từ vựng tự nó là “dễ bị lợi dụng.”
  issues:
