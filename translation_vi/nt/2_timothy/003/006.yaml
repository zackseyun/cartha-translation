    rationale: αἰχμαλωτίζοντες mang hình ảnh bắt làm tù binh. “Bắt làm tù binh” vừa tự nhiên vừa bảo toàn ẩn dụ mạnh của nguyên ngữ.
  - severity: low
    issue: “bị tội lỗi chất nặng” gượng về ngữ pháp/collocation.
    rationale: “Bị tội lỗi đè nặng” là cách nói tiếng Việt tự nhiên, vẫn phản ánh tình trạng bị tội lỗi chất lên như gánh nặng.
  - severity: low
    issue: “dục vọng” có thể bị hiểu hẹp là ham muốn tình dục.
    rationale: ἐπιθυμίαι ở đây có sắc thái đạo đức tiêu cực nhưng nghĩa rộng là các ham muốn/ao ước; “ham muốn đủ loại” tránh thu hẹp nghĩa.
