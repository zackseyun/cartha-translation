id: 2TI.3.6
reference: 2 Timothy 3:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: vi
  text: Vì trong số đó có những kẻ lẻn vào các gia đình và bắt làm tù binh những người đàn bà nhẹ dạ[a], là những người bị tội lỗi đè nặng[b] và bị đủ thứ ham muốn dẫn dắt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng một từ giảm xưng có sắc thái coi thường, có thể dịch sát là “những người đàn bà nhỏ bé”; trong văn cảnh, từ này nhắm đến một nhóm phụ nữ dễ bị tác động, không phải mọi phụ nữ.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “mang nặng tội lỗi” hoặc “bị tội lỗi chất đầy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: trong số những kẻ ấy
  rationale: Diễn đạt tự nhiên ý rằng những người sắp nói đến thuộc nhóm đã được mô tả trước đó.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: lẻn vào các gia đình
  rationale: “Lẻn vào” giữ sắc thái xâm nhập kín đáo, còn “các gia đình” nhấn mạnh phạm vi gia đình chứ không chỉ các tòa nhà.
- source_word: αἰχμαλωτίζοντες
  choice: bắt phục
  rationale: Giữ hình ảnh bắt làm tù binh đồng thời diễn đạt sự khống chế trong tiếng Việt hiện đại.
- source_word: γυναικάρια
  choice: những người đàn bà nhẹ dạ
  rationale: Danh từ giảm xưng mang sắc thái miệt thị, chỉ một nhóm phụ nữ dễ bị lợi dụng trong văn cảnh, chứ không nói về mọi phụ nữ.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: bị tội lỗi chất nặng
  rationale: Giữ hình ảnh những tội lỗi đã tích tụ thành gánh nặng và trạng thái kéo dài của phân từ hoàn thành bị động.
- source_word: ἀγόμενα
  choice: bị ... dẫn dắt
  rationale: Phản ánh thể bị động và tình trạng bị chi phối liên tục mà không tăng nghĩa thành cưỡng ép.
- source_word: ἐπιθυμίαις ποικίλαις
  choice: đủ thứ dục vọng
  rationale: “Dục vọng” truyền đạt sắc thái tiêu cực của ἐπιθυμίαι trong văn cảnh đạo đức; “đủ thứ” diễn đạt tự nhiên ποικίλαις.
theological_decisions:
- issue: Sắc thái miệt thị của γυναικάρια
  choice: những người đàn bà nhẹ dạ
  alternative: những người đàn bà nhỏ bé; những phụ nữ yếu đuối
  rationale: Cách dịch bảo tồn lời khiển trách nhắm đến một nhóm dễ bị kẻ xấu lợi dụng, nhưng tránh biến câu này thành nhận định phổ quát về phụ nữ.
- issue: Phạm vi nghĩa của οἰκίας
  choice: các gia đình
  alternative: các nhà; các mái ấm
  rationale: Văn cảnh nói đến việc xâm nhập môi trường gia đình để gây ảnh hưởng; cách dịch này nêu được chiều kích xã hội mà không loại trừ không gian nhà ở.
- issue: Hình ảnh giam cầm trong αἰχμαλωτίζοντες
  choice: bắt phục
  alternative: bắt làm tù binh; khống chế
  rationale: Giữ ẩn dụ bắt giữ của nguyên ngữ mà không giải thích quá mức bản chất cụ thể của sự thống trị.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đàn bà nhẹ dạ” giữ sắc thái phê phán của nguyên ngữ nhưng giới hạn rõ vào nhóm người trong văn cảnh; cấu trúc câu làm rõ rằng chính những phụ nữ ấy bị tội lỗi chất nặng và bị dục vọng dẫn dắt.
