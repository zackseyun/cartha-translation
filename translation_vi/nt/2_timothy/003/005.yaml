id: 2TI.3.5
reference: 2 Timothy 3:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: vi
  text: họ giữ vẻ bề ngoài của lòng tin kính, nhưng lại chối bỏ quyền năng của lòng tin kính ấy.[a] Con hãy tránh xa những người như vậy.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hình thức của lòng tin kính.” Từ Hy Lạp có thể nhấn mạnh hình thức biểu hiện ra bên ngoài; cách dịch trong câu làm nổi bật sự tương phản với “quyền năng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “hãy quay lưng lại với những người như vậy.” Động từ Hy Lạp mang ý quay chính mình khỏi họ, tức tránh hoặc tránh xa họ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: họ giữ
  rationale: Phân từ hiện tại tiếp tục mô tả những người ở văn cảnh trước; “giữ” diễn đạt tự nhiên việc họ vẫn mang một hình thức tôn giáo.
- source_word: μόρφωσιν
  choice: vẻ bề ngoài
  rationale: Từ này có thể chỉ hình thức hoặc dáng vẻ biểu hiện. “Vẻ bề ngoài” làm rõ sự tương phản với quyền năng thực hữu, nhưng vẫn được ghi chú phương án sát hình thức hơn.
- source_word: εὐσεβείας
  choice: lòng tin kính
  rationale: Trong các thư Mục vụ, từ này chỉ thái độ kính sợ Đức Chúa Trời được thể hiện trong đời sống; “lòng tin kính” là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: nhưng lại chối bỏ quyền năng của lòng tin kính ấy
  rationale: Lặp lại “lòng tin kính” thay vì dùng đại từ mơ hồ, đồng thời giữ δύναμις theo nghĩa rộng là quyền năng hay hiệu lực thực sự.
- source_word: ἠρνημένοι
  choice: chối bỏ
  rationale: Phân từ hoàn thành cho thấy một lập trường phủ nhận đã được xác lập. Tiếng Việt không cần biểu thị hoàn thành bằng cấu trúc nặng nề; “chối bỏ” giữ đúng lực nghĩa.
- source_word: καὶ τούτους ἀποτρέπου
  choice: Con hãy tránh xa những người như vậy
  rationale: Động từ mệnh lệnh trung gian mang nghĩa quay mình khỏi, tránh hoặc xa lánh. “Hãy tránh xa” tự nhiên, rõ mệnh lệnh và không quá cổ.
theological_decisions:
- issue: Sự tương phản giữa biểu hiện tôn giáo bên ngoài và thực tại hữu hiệu
  choice: Giữ sự tương phản giữa “vẻ bề ngoài của lòng tin kính” và “quyền năng của lòng tin kính ấy.”
  alternative: “hình thức của lòng tin kính” hoặc “dáng vẻ tin kính”
  rationale: Bản dịch không giới hạn “quyền năng” vào phép lạ, sự biến đổi đạo đức hay một cơ chế thần học riêng, vì nguyên văn để nghĩa này rộng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Con” để thể hiện lời Phao-lô trực tiếp truyền dạy Ti-mô-thê; tránh thuật ngữ giáo phái và giữ nghĩa “quyền năng” đủ rộng.
