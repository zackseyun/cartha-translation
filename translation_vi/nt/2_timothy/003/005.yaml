  source_fidelity: 'Bản dịch theo sát cấu trúc và ý nghĩa của nguyên văn: ἔχοντες được diễn đạt tự nhiên bằng “họ giữ”; μόρφωσιν εὐσεβείας là “vẻ bề ngoài của lòng tin kính”; và sự đối lập với “quyền năng” được duy trì. “Chối bỏ” phản ánh đúng ἠρνημένοι, một lập trường phủ nhận đã được xác lập; tiếng Việt không bắt buộc phải đánh dấu rõ thể hoàn thành. Mệnh lệnh ἀποτρέπου được chuyển đạt chính xác bằng “Con hãy tránh xa những người như vậy.”'
