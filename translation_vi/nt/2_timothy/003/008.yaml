id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: vi
  text: Gian-nét và Giam-brê đã chống lại Môi-se[a] thế nào, thì những kẻ này cũng chống lại chân lý như vậy—những kẻ có tâm trí bại hoại, không đạt chuẩn về đức tin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Chống lại” cũng có thể dịch là “kháng cự”; cùng một động từ gốc Hy Lạp được dùng cho việc họ chống lại chân lý ở phần sau của câu.
    reason: lexical_alternative
  - marker: b
    text: “Đức tin” ở đây có thể chỉ niềm tin Cơ Đốc hoặc sứ điệp do các sứ đồ truyền lại, chứ không nhất thiết chỉ nói đến lòng tin cá nhân.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον ... οὕτως καὶ
  choice: … thế nào, thì … cũng … như vậy
  rationale: Giữ cấu trúc so sánh tương liên của nguyên văn, đồng thời diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Tiểu từ này chỉ đánh dấu bước chuyển nhẹ trong mạch lập luận; cấu trúc so sánh của cả câu đã thể hiện đầy đủ sự tiếp nối, còn thêm “nhưng” dễ tạo cảm giác tương phản quá mạnh.
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Gian-nét và Giam-brê
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: đã chống lại / cũng chống lại
  rationale: Thể hiện sự đối kháng chủ động, đồng thời giữ sự song song giữa hành động trong quá khứ đối với Môi-se và hành động đang diễn ra đối với chân lý.
- source_word: Μωϋσεῖ
  choice: Môi-se
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: τῇ ἀληθείᾳ
  choice: chân lý
  rationale: Giữ phạm vi nghĩa rộng của từ Hy Lạp, không thu hẹp ngay trong chính văn thành một công thức thần học cụ thể.
- source_word: οὗτοι / ἄνθρωποι
  choice: những kẻ này / Họ là những kẻ
  rationale: Chỉ rõ nhóm người đang được nói đến và giữ sắc thái phê phán của ngữ cảnh mà không làm câu tiếng Việt nặng nề.
- source_word: κατεφθαρμένοι τὸν νοῦν
  choice: có tâm trí bại hoại
  rationale: Diễn đạt trạng thái hư hoại đã hình thành nơi tâm trí; “bại hoại” giữ được sắc thái đạo đức và nhận thức của nguyên văn.
- source_word: ἀδόκιμοι περὶ τὴν πίστιν
  choice: không đủ tư cách về phương diện đức tin
  rationale: ἀδόκιμοι chỉ tình trạng không đạt chuẩn hoặc không được chấp nhận sau khi xét nghiệm; cách dịch này rõ ràng trong tiếng Việt mà không quyết định quá mức đức tin ở đây là chủ quan hay nội dung được tin.
theological_decisions:
- issue: Phạm vi nghĩa của “chân lý” và “đức tin”
  choice: Giữ nguyên các cách gọi rộng là “chân lý” và “đức tin”; chú thích rằng “đức tin” có thể chỉ niềm tin Cơ Đốc hay sứ điệp các sứ đồ.
  alternative: Diễn giải trực tiếp trong chính văn là “chân lý Phúc Âm” và “giáo lý Cơ Đốc”, hoặc hiểu “đức tin” chỉ là lòng tin cá nhân.
  rationale: Ngữ cảnh hướng đến sự chống đối giáo huấn của các sứ đồ, nhưng chính nguyên văn vẫn dùng những thuật ngữ có độ rộng nhất định. Bản dịch vì thế không âm thầm giải quyết sự căng thẳng thần học này.
- issue: Sắc thái của ἀδόκιμοι
  choice: không đủ tư cách
  alternative: bị loại bỏ; không đạt chuẩn; đáng loại
  rationale: Cách chọn giữ ý không đứng vững khi bị xem xét nhưng tránh khẳng định một phán quyết cứu rỗi cuối cùng mà câu này không nói rõ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc so sánh được giữ rõ; các cụm “tâm trí bại hoại” và “không đủ tư cách” bảo toàn sức nặng phê phán mà không thêm kết luận giáo phái.
