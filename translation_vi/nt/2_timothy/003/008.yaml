  verdict: revise
  source_fidelity: Bản dịch giữ đúng phép so sánh tương liên, sự đối lập giữa việc chống lại Môi-se trong quá khứ và chống lại chân lý ở hiện tại, cùng ý nghĩa chung của các cụm chỉ tâm trí bị hư hoại và tình trạng không đạt khi xét về đức tin. Tuy nhiên, ἄνθρωποι κατεφθαρμένοι... ἀδόκιμοι là cụm đồng vị giải thích cho “những kẻ này”; việc tách thành “Họ là...” làm cấu trúc nguồn kém sát hơn. “Không đủ tư cách về phương diện đức tin” cũng hơi hành chính và có thể gợi tư cách/chức vụ hơn là sự không đạt chuẩn khi xét về đức tin.
  naturalness: Câu đầu tự nhiên. Câu sau lặp “những kẻ” và có văn phong nặng ở cụm “về phương diện”. Dùng dấu gạch ngang để giữ cụm đồng vị, và “không đạt chuẩn về đức tin” sẽ gọn, tự nhiên, và rõ hơn trong tiếng Việt hiện đại.
  terminology: “Chân lý,” “tâm trí bại hoại,” và “đức tin” phù hợp, không thu hẹp phạm vi thần học của nguyên văn. Chú thích a nên nói rõ đây là cùng một động từ gốc Hy Lạp, vì hai lần xuất hiện là hai hình thái khác nhau của động từ này.
