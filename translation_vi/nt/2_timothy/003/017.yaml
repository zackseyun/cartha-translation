  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: vi
  text: để người của Đức Chúa Trời có đủ năng lực[b], được trang bị đầy đủ[a] cho mọi việc lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được chuẩn bị chu đáo.” Động từ Hy Lạp diễn tả tình trạng đã được chuẩn bị hoặc cung ứng đầy đủ.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hy Lạp này có dạng giống đực, số ít và là một danh xưng quen thuộc trong Kinh Thánh; trong ngữ cảnh này, có thể trước hết nói đến người phục sự Đức Chúa Trời.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: để
  rationale: Giới thiệu mệnh đề chỉ mục đích tiếp nối câu 16; “để” tự nhiên và giữ rõ sắc thái mục đích.
- source_word: ἄρτιος
  choice: được trọn vẹn
  rationale: Diễn tả tình trạng đầy đủ, thích hợp và có đủ năng lực cho nhiệm vụ; tránh “hoàn hảo,” vốn dễ bị hiểu là tuyệt đối không có khuyết điểm.
- source_word: ᾖ
  choice: được
  rationale: Kết hợp tự nhiên với tính từ trong mệnh đề mục đích tiếng Việt; sắc thái của thể giả định được truyền đạt qua “để.”
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: người của Đức Chúa Trời
  rationale: Giữ cấu trúc số ít và danh xưng Kinh Thánh, đồng thời “người” phù hợp với nghĩa rộng của ἄνθρωπος hơn “người nam.”
- source_word: πρὸς
  choice: cho
  rationale: Diễn tả sự hướng tới và sự thích hợp cho mục đích trong cụm “được trang bị ... cho.”
- source_word: πᾶν ἔργον ἀγαθόν
  choice: mọi việc lành
  rationale: Cách nói Kinh Thánh tự nhiên, giữ sức phân phối của πᾶν và phẩm chất đạo đức của ἀγαθόν.
- source_word: ἐξηρτισμένος
  choice: được trang bị đầy đủ
  rationale: Thể hoàn thành bị động cho thấy người ấy đã được chuẩn bị, cung ứng đầy đủ và hiện ở trong tình trạng sẵn sàng; “đầy đủ” làm rõ sức nghĩa của động từ ghép.
theological_decisions:
- issue: Phạm vi của danh xưng ὁ τοῦ θεοῦ ἄνθρωπος
  choice: người của Đức Chúa Trời
  alternative: người phục vụ Đức Chúa Trời
  rationale: Nguyên văn dùng danh xưng giống đực số ít có nền tảng Kinh Thánh, có thể trước hết chỉ Ti-mô-thê trong vai trò người phục vụ Chúa nhưng không nên thu hẹp nghĩa ngay trong bản văn.
- issue: Quan hệ giữa ἄρτιος và ἐξηρτισμένος
  choice: “được trọn vẹn” và “được trang bị đầy đủ”
  alternative: “có đủ năng lực” và “được trang bị”
  rationale: 'Giữ hai ý gần nhau nhưng không đồng nhất: phẩm chất đầy đủ, thích hợp của con người và tình trạng đã được chuẩn bị cho mọi việc lành; không diễn giải thành sự hoàn hảo vô tội.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” nhất quán; “việc lành” giữ âm hưởng Kinh Thánh quen thuộc. Các dấu chú thích đều xuất hiện trong câu chính và đặt ngay sau cụm từ liên quan.
