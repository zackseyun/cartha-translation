id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: vi
  text: Nhưng con đã theo sát sự dạy dỗ, cách sống, mục đích, đức tin[a], lòng kiên nhẫn, tình yêu thương và sự bền lòng của ta,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sự trung tín.” Từ Hy Lạp ở đây có thể mang nghĩa đức tin hoặc sự trung tín.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Nhưng con
  rationale: δέ nêu sự tương phản với phần mô tả những kẻ xấu trước đó; đại từ Σὺ được diễn đạt rõ. “Con” phù hợp với quan hệ giữa Phao-lô và Ti-mô-thê trong văn cảnh thư tín.
- source_word: παρηκολούθησάς
  choice: đã theo sát
  rationale: Diễn đạt việc quan sát, am hiểu và noi theo cách chặt chẽ, đồng thời giữ sắc thái hồi cố của động từ aorist.
- source_word: μου
  choice: của ta
  rationale: Đại từ sở hữu liên kết tự nhiên với toàn bộ chuỗi danh từ theo sau; “ta” giữ giọng của một người lớn tuổi nói với người cộng sự được gọi là “con”.
- source_word: διδασκαλίᾳ
  choice: sự dạy dỗ
  rationale: Cách nói tự nhiên, dễ hiểu, chỉ cả nội dung lẫn hoạt động giảng dạy mà không mang sắc thái giáo phái.
- source_word: ἀγωγῇ
  choice: cách sống
  rationale: ἀγωγή tại đây nói đến nếp sống hay cách cư xử; “cách sống” rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: προθέσει
  choice: mục đích
  rationale: Chỉ chủ đích hay định hướng đã xác lập của Phao-lô.
- source_word: πίστει
  choice: đức tin
  rationale: Giữ nghĩa thông dụng của πίστις trong văn mạch Phao-lô; nghĩa “sự trung tín” vẫn khả dĩ nên được ghi ở chú thích.
- source_word: μακροθυμίᾳ
  choice: lòng kiên nhẫn
  rationale: Diễn đạt sự nhẫn nại lâu dài, đặc biệt đối với con người và khi bị khiêu khích.
- source_word: ἀγάπῃ
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên và trang trọng cho ἀγάπη trong tiếng Việt, tránh sắc thái thuần cảm xúc của từ “tình yêu” đứng riêng.
- source_word: ὑπομονῇ
  choice: sự bền lòng
  rationale: Nhấn mạnh việc đứng vững qua thử thách và phân biệt với μακροθυμία, đã được dịch là “lòng kiên nhẫn”.
theological_decisions:
- issue: Cách dịch πίστις trong danh sách phẩm chất
  choice: đức tin
  alternative: sự trung tín
  rationale: Trong văn cảnh này, πίστις có thể nói đến lòng tin hoặc phẩm chất đáng tin cậy. Bản chính giữ “đức tin” nhưng chú thích bảo tồn nghĩa thay thế để không giải quyết quá mức sự nhập nhằng.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng cặp xưng hô “ta—con” phù hợp giọng thư mục vụ; cấu trúc liệt kê gọn và phân biệt μακροθυμία với ὑπομονή.
