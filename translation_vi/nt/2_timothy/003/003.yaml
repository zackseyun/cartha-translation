  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: vi
  text: không có tình cảm gia đình[a], không chịu hòa giải[b], vu khống[c], không tự chủ, hung bạo, không yêu điều thiện[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có tình cảm tự nhiên,” nhất là trong gia đình.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “không khoan nhượng” hoặc “phá bỏ hòa ước.”'
    reason: lexical_alternative
  - marker: c
    text: Từ Hy Lạp διάβολοι ở đây có nghĩa là “những kẻ vu khống” hoặc “hay vu khống,” không phải là danh xưng chỉ Ma Quỷ.
    reason: lexical_alternative
  - marker: d
    text: 'Cũng có thể dịch: “ghét điều thiện.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: không có tình thân
  rationale: Từ này chỉ sự thiếu vắng tình cảm tự nhiên, đặc biệt là tình cảm vốn phải có giữa những người trong gia đình hoặc họ hàng. “Tình thân” diễn đạt sắc thái ấy tự nhiên hơn trong tiếng Việt hiện đại mà không mở rộng thành mọi loại tình yêu thương.
- source_word: ἄσπονδοι
  choice: không chịu hòa giải
  rationale: Từ này mô tả người không sẵn lòng đi đến hoặc duy trì hòa thuận. Cách dịch này nhấn mạnh sự khước từ hòa giải, thay vì mặc nhiên cho rằng một giao ước đình chiến đã bị phá vỡ.
- source_word: διάβολοι
  choice: vu khống
  rationale: Trong danh sách thói xấu này, dạng số nhiều chỉ hành vi nói lời cáo buộc, bôi nhọ người khác, chứ không phải danh hiệu riêng “Ma Quỷ.” “Vu khống” ngắn gọn và phù hợp với cấu trúc liệt kê.
- source_word: ἀκρατεῖς
  choice: không tự chủ
  rationale: Từ này nói đến việc không làm chủ được ham muốn hoặc xung động của mình. “Không tự chủ” rõ ràng, thông dụng và giữ được nội dung đạo đức của nguyên ngữ.
- source_word: ἀνήμεροι
  choice: hung bạo
  rationale: Từ này mang nghĩa không thuần hóa, dữ tợn hoặc tàn bạo. “Hung bạo” tự nhiên trong tiếng Việt và diễn đạt cả sự dữ dằn lẫn thiếu nhân hậu.
- source_word: ἀφιλάγαθοι
  choice: không yêu điều thiện
  rationale: Từ ghép này theo nghĩa sát là không yêu điều tốt lành. Cách dịch giữ nguyên lực phủ định, không tự ý tăng mức độ thành chủ động căm ghét điều thiện.
theological_decisions:
- issue: Ý nghĩa của διάβολοι trong danh sách thói xấu
  choice: Hiểu theo nghĩa thông dụng là những người vu khống hoặc có hành vi vu khống, không phải chỉ Ma Quỷ hay các quỷ.
  alternative: “thuộc về ma quỷ” hoặc “các quỷ”
  rationale: Dạng số nhiều trong ngữ cảnh cú pháp này đứng giữa các phẩm chất đạo đức tiêu cực và hoạt động như một từ mô tả hành vi. Dịch thành “các quỷ” sẽ dễ khiến độc giả hiểu sai đây là nhận định về bản thể thay vì cách cư xử.
- issue: Mức độ của ἀφιλάγαθοι
  choice: “không yêu điều thiện,” giữ lực phủ định của từ ghép
  alternative: “ghét điều thiện”
  rationale: Nguyên ngữ trực tiếp nói đến việc thiếu lòng yêu chuộng điều thiện; “ghét” là khả năng diễn giải mạnh hơn nhưng không nên được mặc nhiên đưa vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và cô đọng, giữ nhịp của một danh sách thói xấu. Dùng các cụm từ thông dụng, dễ hiểu; tránh thuật ngữ cổ hoặc cách diễn đạt mang màu sắc hệ phái. Dấu phẩy cuối câu được giữ vì đây là một phần của câu và danh sách tiếp tục theo văn cảnh.
