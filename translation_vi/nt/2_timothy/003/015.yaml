id: 2TI.3.15
reference: 2 Timothy 3:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: vi
  text: và rằng từ thuở ấu thơ, con đã biết các sách thánh[a]; những sách ấy có thể làm cho con trở nên khôn ngoan để được cứu rỗi qua đức tin nơi Đấng Mê-si-a Giê-su.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Kinh Thánh.” Tiếng Hy Lạp sát nghĩa là “các văn phẩm thánh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể hiểu: “qua sự thành tín của Đấng Mê-si-a Giê-su,” dù tại đây “đức tin nơi Đấng Mê-si-a Giê-su” là cách hiểu tự nhiên hơn.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: từ thuở ấu thơ
  rationale: βρέφος chỉ một đứa trẻ còn rất nhỏ, thậm chí trẻ sơ sinh. “Từ thuở ấu thơ” giữ được ý về giai đoạn rất sớm trong đời mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἱερὰ γράμματα
  choice: các sách thánh
  rationale: Cụm từ chỉ những văn phẩm thiêng liêng mà Ti-mô-thê đã học. “Các sách thánh” tự nhiên, dễ hiểu và ít áp đặt sắc thái thuật ngữ muộn hơn so với việc dùng ngay danh xưng “Kinh Thánh”.
- source_word: οἶδας
  choice: con đã biết
  rationale: οἶδα có hình thức hoàn thành nhưng mang nghĩa hiện tại; đi với “từ thuở ấu thơ,” cách nói “đã biết” diễn đạt kiến thức có từ lâu và vẫn được hàm ý là đang sở hữu.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: những sách ấy có thể làm cho con trở nên khôn ngoan
  rationale: Phân từ bổ nghĩa cho “các sách thánh.” Cách diễn đạt này nêu rõ chủ thể và giữ nghĩa trực tiếp của σοφίζω là làm cho ai trở nên khôn ngoan.
- source_word: εἰς σωτηρίαν
  choice: để được cứu rỗi
  rationale: εἰς biểu thị mục tiêu hoặc kết quả hướng tới; “để được cứu rỗi” truyền đạt tự nhiên ý hướng đích trong tiếng Việt.
- source_word: διὰ πίστεως
  choice: qua đức tin
  rationale: διά với sở hữu cách diễn tả phương tiện. “Qua đức tin” vừa tự nhiên vừa giữ được nghĩa thông dụng của πίστις trong ngữ cảnh này.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: nơi Đấng Mê-si-a Giê-su
  rationale: “Nơi” diễn đạt đối tượng/quy hướng của đức tin; Χριστός được dịch như một tước hiệu là “Đấng Mê-si-a,” còn Ἰησοῦ là tên riêng Giê-su.
theological_decisions:
- issue: Χριστός được hiểu là tước hiệu hay yếu tố giống tên riêng
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su / Chúa Cứu Thế Giê-su
  rationale: Bản dịch giữ ý nghĩa tước hiệu của Χριστός thay vì chỉ phiên âm hoặc xử lý như một phần tên riêng.
- issue: Nghĩa của πίστεως trong διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ
  choice: qua đức tin nơi Đấng Mê-si-a Giê-su
  alternative: qua sự thành tín của Đấng Mê-si-a Giê-su
  rationale: Trong cấu trúc này, cách hiểu tự nhiên hơn là đức tin hướng đến hoặc đặt nơi Đấng Mê-si-a Giê-su. Tuy nhiên, khả năng hiểu πίστις là “sự thành tín” được giữ lại trong chú thích để không xóa bỏ sự căng thẳng diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “con” phù hợp với lời Phao-lô nói trực tiếp với Ti-mô-thê trong quan hệ gần gũi của thư tín. Dùng dấu chấm phẩy để giữ mạch của câu Hy Lạp mà tránh một câu tiếng Việt quá nặng.
