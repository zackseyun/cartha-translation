id: 2TI.3.12
reference: 2 Timothy 3:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: vi
  text: Thật vậy, tất cả những ai muốn sống tin kính trong Đấng Mê-si-a[a] Giê-su đều sẽ bị bắt bớ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Đấng Christ”.
    reason: Cách dịch khác của tước hiệu Χριστός.
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: Thật vậy
  rationale: Hai liên từ cùng tạo sắc thái nối kết và xác nhận điều vừa nói; “Thật vậy” diễn đạt tự nhiên trong tiếng Việt mà không tạo nét đối lập quá mạnh.
- source_word: πάντες οἱ θέλοντες
  choice: tất cả những ai muốn
  rationale: Giữ trọn phạm vi phổ quát của πάντες và ý chí, mong muốn của θέλω bằng cách diễn đạt tự nhiên trong tiếng Việt hiện đại.
- source_word: ζῆν εὐσεβῶς
  choice: sống tin kính
  rationale: εὐσεβῶς chỉ cách sống có lòng tôn kính và tận hiến đối với Đức Chúa Trời; “sống tin kính” là cách nói ngắn gọn, trang trọng và quen thuộc.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: trong Đấng Mê-si-a Giê-su
  rationale: ἐν diễn tả phạm vi hay sự hiệp thuộc trong Đấng Mê-si-a; Χριστός được dịch theo nghĩa tước hiệu, còn Ἰησοῦ được phiên âm theo tên riêng.
- source_word: διωχθήσονται
  choice: sẽ bị bắt bớ
  rationale: Giữ rõ thì tương lai và thể bị động của động từ, đồng thời dùng cách diễn đạt tự nhiên, phổ thông trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Dịch Χριστῷ theo tước hiệu hay dạng tên gọi quen dùng
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Trong cụm này, Χριστός vẫn có thể được nghe như tước hiệu; bản chính dùng “Đấng Mê-si-a” và chú thích dạng truyền thống để không che khuất lựa chọn dịch thuật.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Câu giữ sắc thái khẳng định, phạm vi phổ quát và lời báo trước dứt khoát của nguyên văn.
