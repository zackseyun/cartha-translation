  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: vi
  text: luôn học hỏi mà không bao giờ có thể đạt đến sự nhận biết chân lý[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự nhận biết đầy đủ về chân lý.” Từ Hy Lạp có thể mang nghĩa sự nhận biết trọn vẹn hoặc đầy đủ hơn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: luôn
  rationale: Diễn tả hành động liên tục hoặc lặp đi lặp lại, đồng thời tạo thế đối lập rõ với μηδέποτε.
- source_word: μανθάνοντα
  choice: học hỏi
  rationale: Phân từ hiện tại chỉ việc tiếp nhận sự dạy dỗ đang diễn ra; “học hỏi” tự nhiên trong tiếng Việt và không giới hạn vào một hình thức học tập cụ thể.
- source_word: μηδέποτε
  choice: không bao giờ
  rationale: Giữ nguyên sức phủ định mạnh và sự tương phản tu từ với “luôn”.
- source_word: εἰς ἐπίγνωσιν
  choice: đạt đến sự nhận biết
  rationale: Cụm giới từ diễn tả việc tiến tới hay đi đến chỗ có được sự nhận biết; “đạt đến” chuyển tải hình ảnh đích đến một cách tự nhiên.
- source_word: ἀληθείας
  choice: chân lý
  rationale: Danh từ sở hữu phụ thuộc vào ἐπίγνωσιν. “Chân lý” phù hợp văn phong trang trọng và có thể chỉ chân lý của sứ điệp đức tin mà không diễn giải quá mức.
- source_word: ἐλθεῖν
  choice: đạt đến
  rationale: Động từ nguyên mẫu mang hình ảnh đi đến một đích; trong tiếng Việt, “đạt đến sự nhận biết” tự nhiên hơn cách dịch sát chữ “đi đến”.
- source_word: δυνάμενα
  choice: có thể
  rationale: Diễn tả khả năng và liên kết tự nhiên với cấu trúc phủ định “không bao giờ có thể”.
theological_decisions:
- issue: Sắc thái của ἐπίγνωσις
  choice: sự nhận biết
  alternative: sự nhận biết đầy đủ
  rationale: 'ἐπίγνωσις có thể hàm ý sự nhận biết đầy đủ hoặc sâu xa hơn, nhưng câu này trước hết nhấn mạnh nghịch lý: luôn học mà không đạt tới sự nhận biết chân lý. Bản chính không làm sắc thái tiềm tàng ấy thành một phân biệt thần học kỹ thuật; chú thích bảo lưu phương án mạnh hơn.'
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ dạng phân từ nối tiếp ý của câu trước, không tự ý bổ sung chủ ngữ; cặp “luôn… không bao giờ” bảo toàn sự tương phản của nguyên văn.
