id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: vi
  text: Từ nay, mão triều thiên của sự công chính đã được dành sẵn cho tôi[a]. Vào ngày ấy, Chúa, vị thẩm phán công chính, sẽ trao mão ấy cho tôi; không những cho tôi mà còn cho tất cả những người đã yêu mến sự hiện ra của Ngài.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mão triều thiên của công lý.” Từ Hy Lạp này có thể mang nghĩa “sự công chính” hoặc, trong một số ngữ cảnh, “công lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: Từ nay
  rationale: Trong mạch văn sau khi Phao-lô nói đã chạy xong cuộc đua, từ này chỉ điều còn lại đang ở phía trước; “Từ nay” diễn đạt tự nhiên sắc thái thời gian.
- source_word: ἀπόκειταί
  choice: đã được dành sẵn
  rationale: Động từ chỉ một vật đang được để riêng hoặc dành sẵn; cách dịch này giữ ý về trạng thái hiện tại mà không khiến câu quá cổ.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: mão triều thiên của sự công chính
  rationale: Giữ nguyên cấu trúc sở hữu rộng nghĩa của tiếng Hy Lạp, không quyết định đó là mão được ban vì sự công chính, mão chính là sự công chính, hay mão gắn với sự minh oan.
- source_word: δικαιοσύνης
  choice: sự công chính
  rationale: Đây là cách dịch quen thuộc và phù hợp trong ngữ cảnh Phao-lô; nghĩa “công lý” được ghi nhận ở chú thích như một khả năng từ vựng.
- source_word: ἀποδώσει
  choice: sẽ trao
  rationale: Trong hình ảnh trao mão cho người thắng cuộc, “trao” tự nhiên và vẫn hàm ý ban điều tương xứng, không thêm sắc thái trừng phạt có thể có ở “báo trả”.
- source_word: ὁ δίκαιος κριτής
  choice: vị Thẩm Phán công chính
  rationale: Cụm đồng vị mô tả phẩm chất xét xử của Chúa; viết hoa danh xưng tạo lối văn trang trọng mà không thay đổi nghĩa.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: tất cả những người đã yêu mến
  rationale: Thì hoàn thành của phân từ diễn tả tình yêu đã có và còn định hình thái độ của họ; “đã yêu mến” giữ được sắc thái ấy.
- source_word: ἐπιφάνειαν
  choice: sự hiện ra
  rationale: Dịch trực tiếp ý sự xuất hiện tỏ tường, không thu hẹp thành khái niệm rộng hơn là “sự đến”.
theological_decisions:
- issue: Ý nghĩa của “mão triều thiên của sự công chính”
  choice: Giữ nguyên cụm sở hữu mà không giải nghĩa dứt khoát.
  alternative: Mão được ban vì sự công chính; mão chính là sự công chính; hoặc mão của sự minh oan/công lý.
  rationale: Cấu trúc sở hữu trong tiếng Hy Lạp cho phép nhiều sắc thái; bản dịch cần giữ sự hàm súc và căng thẳng thần học của nguyên văn.
- issue: Đối tượng được gọi là “Chúa”
  choice: Giữ danh xưng “Chúa” và đại từ “Ngài”.
  alternative: Diễn giải rõ là Chúa Giê-su hoặc hiểu là Đức Chúa Trời nói chung.
  rationale: Cụm “sự hiện ra của Ngài” trong các thư Mục vụ mạnh mẽ hướng đến Đấng Christ, nhưng nguyên văn chỉ dùng danh xưng “Chúa”, nên không đưa phần diễn giải vào chính văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. “Mão triều thiên” giữ hình ảnh phần thưởng dành cho người thắng cuộc và tránh sắc thái chính trị đơn thuần của “vương miện”. Dùng “Ngài” để quy chiếu trang trọng về Chúa; dấu chấm phẩy làm rõ hai vế trao thưởng mà không làm đứt mạch câu.
