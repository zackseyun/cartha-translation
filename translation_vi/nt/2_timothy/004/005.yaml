id: 2TI.4.5
reference: 2 Timothy 4:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: vi
  text: Nhưng con[a] hãy tỉnh táo trong mọi sự, chịu gian khổ[b], làm công việc của một người truyền giảng Tin Lành, chu toàn chức vụ của con[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “Còn con.” Đại từ Hy Lạp được nhấn mạnh và tạo thế tương phản với những người được nói đến ở các câu trước.
    reason: discourse_alternative
  - marker: b
    text: Hay “chịu khổ.”
    reason: lexical_alternative
  - marker: c
    text: Hay “thực hiện đầy đủ chức vụ của con.” Động từ Hy Lạp mang ý đưa công việc đến chỗ hoàn tất trọn vẹn.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Nhưng con
  rationale: Đại từ σὺ có tính nhấn mạnh, còn δέ tạo thế tương phản với những người được nói đến ở các câu trước. “Nhưng con” giữ được sự đối lập và lời nói trực tiếp thân tình của Phao-lô với Ti-mô-thê.
- source_word: νῆφε
  choice: hãy tỉnh táo
  rationale: Động từ này vốn có nghĩa đen là không say, nhưng trong Tân Ước được dùng theo nghĩa bóng về sự sáng suốt, tự chủ và vững vàng. “Tỉnh táo” là cách diễn đạt tự nhiên, gọn và không giới hạn ý nghĩa vào việc kiêng rượu.
- source_word: ἐν πᾶσιν
  choice: trong mọi sự
  rationale: Cụm từ diễn tả phạm vi toàn diện và tự nhiên bổ nghĩa cho νῆφε. Cách dịch này giữ nguyên độ rộng của tiếng Hy Lạp, không quyết định quá mức rằng tác giả muốn nói “mọi hoàn cảnh” hay “mọi lúc”.
- source_word: κακοπάθησον
  choice: chịu gian khổ
  rationale: Mệnh lệnh kêu gọi Ti-mô-thê chấp nhận và bền lòng trước đau khổ. “Chịu gian khổ” vừa tự nhiên vừa bảo tồn sắc thái chịu đựng nghịch cảnh.
- source_word: ἔργον ποίησον
  choice: làm công việc
  rationale: Đây là một kết hợp thông dụng trong tiếng Hy Lạp. “Làm công việc” chuyển đạt trực tiếp mệnh lệnh mà không tạo văn phong cứng nhắc.
- source_word: εὐαγγελιστοῦ
  choice: của một người truyền giảng Tin Lành
  rationale: Danh từ chỉ người công bố tin mừng. Cách diễn đạt bằng cụm từ rõ nghĩa hơn từ vay mượn “nhà truyền đạo,” đồng thời không đồng nhất vai trò này với một chức danh hệ phái cụ thể.
- source_word: τὴν διακονίαν σου
  choice: chức vụ của con
  rationale: Trong ngữ cảnh lời ủy thác cho Ti-mô-thê về việc rao giảng và phục vụ, “chức vụ” thể hiện trách nhiệm được giao rõ hơn “sự phục vụ,” dù từ Hy Lạp có thể mang cả hai nghĩa.
- source_word: πληροφόρησον
  choice: chu toàn
  rationale: Động từ mang ý đưa một nhiệm vụ đến mức trọn vẹn hoặc hoàn tất đầy đủ. “Chu toàn” diễn đạt tự nhiên việc thực hiện đầy đủ trách nhiệm được giao.
theological_decisions:
- issue: Phạm vi của διακονία đối với sứ mạng của Ti-mô-thê
  choice: chức vụ của con
  alternative: sự phục vụ của con
  rationale: Ngữ cảnh trực tiếp nói đến công việc rao giảng và trách nhiệm được giao cho Ti-mô-thê, nên “chức vụ” phù hợp hơn; tuy vậy, bản dịch không xác định đây là một chức phẩm thuộc cơ cấu giáo phái nào.
- issue: Ý nghĩa của εὐαγγελιστής
  choice: một người truyền giảng Tin Lành
  alternative: nhà truyền đạo; người loan báo tin mừng
  rationale: Cách dịch mô tả chức năng công bố Tin Lành, tránh áp đặt rằng từ này nhất thiết chỉ một chức danh chính thức hay một mô hình chức vụ về sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “con” phản ánh quan hệ thân tình, bậc cha tinh thần nói với người trẻ hơn trong thư; các mệnh lệnh ngắn giữ nhịp dồn dập của nguyên văn. “Tin Lành” được viết hoa như tên gọi quen thuộc của sứ điệp Phúc Âm, không nhằm chỉ một hệ phái.
