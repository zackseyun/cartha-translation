id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: vi
  text: Nhưng Chúa đã đứng bên tôi và ban sức mạnh cho tôi, để qua tôi, sự rao giảng được hoàn tất trọn vẹn và mọi dân ngoại đều được nghe lời ấy[a], và tôi đã được giải cứu khỏi miệng sư tử.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi dân tộc.” Từ Hy Lạp ἔθνη có thể chỉ “các dân ngoại” hoặc “các dân tộc”; ở đây có lẽ nói đến những người không phải Do Thái được nghe lời rao giảng.
    reason: lexical_alternative
  - marker: b
    text: “Khỏi miệng sư tử” có thể là cách nói hình tượng về việc được giải cứu khỏi hiểm họa chết người, chứ không nhất thiết nói đến một con sư tử theo nghĩa đen.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Nhưng Chúa
  rationale: δέ đánh dấu sự tương phản với câu trước; κύριος được dịch là “Chúa” mà không xác định thêm đối tượng quy chiếu.
- source_word: μοι παρέστη
  choice: đã đứng bên tôi
  rationale: Diễn đạt sự hiện diện gần gũi để nâng đỡ, đồng thời giữ hình ảnh của động từ παρίστημι.
- source_word: ἐνεδυνάμωσέν με
  choice: ban sức mạnh cho tôi
  rationale: Cách nói tự nhiên trong tiếng Việt, truyền đạt ý làm cho có sức mạnh của ἐνδυναμόω.
- source_word: δι’ ἐμοῦ
  choice: qua tôi
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: lời rao giảng được thực hiện trọn vẹn
  rationale: Giữ được cả nội dung được công bố của κήρυγμα và sắc thái hoàn tất đầy đủ của πληροφορέω, không thu hẹp thành chỉ “rao truyền khắp nơi”.
- source_word: ἀκούσωσιν πάντα τὰ ἔθνη
  choice: mọi dân ngoại đều được nghe
  rationale: Trong bối cảnh sứ mạng của Phao-lô, ἔθνη nhiều khả năng chỉ các dân không phải Do Thái; cấu trúc tiếng Việt tự nhiên vẫn giữ mục đích để họ nghe lời rao giảng.
- source_word: ἐρρύσθην ἐκ στόματος λέοντος
  choice: tôi đã được giải cứu khỏi miệng sư tử
  rationale: Dịch sát hình ảnh, không quyết định đó là sư tử theo nghĩa đen hay ẩn dụ về hiểm họa chết người.
theological_decisions:
- issue: Đối tượng được gọi là κύριος
  choice: Chỉ dịch là “Chúa”
  alternative: Xác định rõ là Chúa Giê-su hoặc Đức Chúa Trời
  rationale: Ngữ cảnh có thể khiến nhiều người hiểu là Chúa Giê-su phục sinh, nhưng nguyên văn không nêu rõ tại đây; bản dịch giữ nguyên độ mở.
- issue: Ý nghĩa của “khỏi miệng sư tử”
  choice: Giữ nguyên hình ảnh
  alternative: Giải nghĩa là Nê-rô, Sa-tan, thú dữ theo nghĩa đen, hoặc một hiểm họa chết người nói chung
  rationale: Câu văn không xác định cách hiểu cụ thể, nên không đưa một giả thuyết lịch sử hoặc thần học vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “lời rao giảng” thay cho thuật ngữ hàn lâm; giữ nhịp câu dài và quan hệ mục đích của nguyên văn. Các dấu chú thích [a], [b] đều được đặt ngay sau thành phần liên quan.
