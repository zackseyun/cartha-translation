revisions:
- from: 'Trước mặt Đức Chúa Trời và Đấng Mê-si-a[a] Giê-su, là Đấng sắp phán xét người sống và người chết[b], tôi long trọng truyền cho con, nhân sự hiện ra và vương quốc của ngài:'
  to: 'Tôi long trọng truyền cho con trước mặt Đức Chúa Trời và Đấng Mê-si-a[a] Giê-su, là Đấng sắp phán xét[b] người sống và người chết, vì sự xuất hiện và vương quốc của Ngài[c]:'
  rationale: Bản sửa giữ nguyên ý nghĩa và các điểm còn tranh luận của tiếng Hy Lạp, nhưng cải thiện trật tự câu, tính tự nhiên của từ ngữ, cách viết đại từ tôn kính, và nhất là vị trí/phạm vi các chú thích. Không áp đặt một diễn giải giáo phái nào cho μέλλω hoặc cho quan hệ cú pháp của các đối cách ở cuối câu.
  reviewer_model: gpt-5.6-terra
