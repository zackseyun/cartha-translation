source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: vi
  text: 'Tôi long trọng truyền cho con trước mặt Đức Chúa Trời và Đấng Mê-si-a[a] Giê-su, là Đấng sắp phán xét[b] người sống và người chết, vì sự xuất hiện và vương quốc của Ngài[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “Đấng Christ Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Đấng sẽ phán xét.”'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch sát hơn: “và sự xuất hiện cùng vương quốc của Ngài,” để quan hệ cú pháp được để ngầm như trong tiếng Hy Lạp.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: tôi long trọng truyền cho con
  rationale: Trong ngữ cảnh Phao-lô trao sứ mạng cho Ti-mô-thê, động từ mang sức nặng của một lời giao phó hoặc mệnh lệnh trang nghiêm, chứ không chỉ là làm chứng. Tân ngữ được làm rõ theo ngữ cảnh trực tiếp.
- source_word: ἐνώπιον
  choice: trước mặt
  rationale: Cách nói tự nhiên, trang trọng, giữ ý ở trong sự hiện diện và dưới ánh nhìn của Đức Chúa Trời.
- source_word: θεοῦ
  choice: Đức Chúa Trời
  rationale: Cách gọi θεός truyền thống, rõ nghĩa và phổ biến trong tiếng Việt Kinh Thánh.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Giê-su
  rationale: Giữ rõ Χριστός là tước hiệu chỉ Đấng được xức dầu, thay vì mặc nhiên biến thành một phần tên riêng.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: là Đấng sắp phán xét
  rationale: ‘Sắp’ bảo toàn sắc thái tương lai có tính cận kề của μέλλω mà không ấn định thời điểm cụ thể.
- source_word: ζῶντας καὶ νεκρούς
  choice: người sống và người chết
  rationale: Cách diễn đạt gọn, tự nhiên, bao quát đúng hai nhóm được văn bản nêu ra.
- source_word: ἐπιφάνειαν
  choice: sự hiện ra
  rationale: Giữ ý về sự bày tỏ hữu hình trong bối cảnh cánh chung, không diễn giải quá thành một thuật ngữ khác.
- source_word: βασιλείαν
  choice: vương quốc
  rationale: Tương ứng trực tiếp với βασιλεία và phù hợp với hình ảnh vương quyền trong mệnh đề.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: nhân sự hiện ra và vương quốc của ngài
  rationale: 'Hiểu các đối cách như mở rộng công thức truyền lệnh trang nghiêm: lời truyền được đưa ra nhân hoặc dựa trên sự hiện ra và vương quốc của Đấng Mê-si-a. Cách phối hợp thuần túy của tiếng Hy Lạp được ghi ở chú thích.'
theological_decisions:
- issue: Cách dịch Χριστός như một tước hiệu
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong lời tuyên bố trang nghiêm về vị thẩm phán cánh chung, tước hiệu vẫn có sức nghĩa rõ; ‘Đấng Mê-si-a’ giữ được ý Đấng được xức dầu.
- issue: Sắc thái của μέλλω trong lời phán xét cánh chung
  choice: Đấng sắp phán xét
  alternative: Đấng sẽ phán xét
  rationale: Bản chính giữ đóng góp từ vựng của μέλλω và sự căng thẳng cánh chung, trong khi chú thích cho biết cách hiểu tương lai ít nhấn mạnh tính cận kề hơn.
- issue: Quan hệ cú pháp của các đối cách ἐπιφάνειαν và βασιλείαν
  choice: nhân sự hiện ra và vương quốc của ngài
  alternative: và sự hiện ra cùng vương quốc của ngài
  rationale: Cách chọn làm rõ lối hiểu phổ biến rằng đây là phần tiếp theo của công thức truyền lệnh; cách dịch sát phép nối của tiếng Hy Lạp được giữ trong chú thích để không che khuất sự khó hiểu cú pháp.
translation_notes:
  register: Văn phong hiện đại, trang nghiêm và trực tiếp, phù hợp lời trao sứ mạng giữa Phao-lô và Ti-mô-thê. Đại từ ‘con’ phản ánh quan hệ đã được xác lập trong thư; ‘ngài’ chỉ Đấng Mê-si-a. Các chú thích bảo lưu cả lựa chọn thuật ngữ lẫn hai điểm mơ hồ của câu Hy Lạp.
