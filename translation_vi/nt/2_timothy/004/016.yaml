  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: vi
  text: Trong lần đầu tiên tôi tự biện hộ[a], không ai có mặt cùng tôi[b], nhưng tất cả đều bỏ rơi tôi. Xin đừng tính điều ấy là lỗi của họ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Trong phiên xét xử đầu tiên của tôi” hoặc “Trong lần biện hộ đầu tiên của tôi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “không ai đến có mặt với tôi”; trong văn cảnh này, ý nói không ai xuất hiện để ủng hộ Phao-lô.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “Xin đừng tính điều ấy chống lại họ” hoặc “Xin đừng buộc họ phải chịu trách nhiệm về điều ấy.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: lần biện hộ
  rationale: Trong văn cảnh tư pháp, từ này chỉ lời hoặc hành động tự biện hộ chính thức trước nhà chức trách. “Lần biện hộ” tự nhiên trong tiếng Việt và vẫn giữ sắc thái pháp lý.
- source_word: πρώτῃ
  choice: đầu tiên
  rationale: Tính từ này đánh dấu lần hoặc giai đoạn biện hộ thứ nhất; “đầu tiên” là cách chuyển ngữ trực tiếp, rõ ràng.
- source_word: οὐδείς μοι παρεγένετο
  choice: không một ai đứng về phía tôi
  rationale: Động từ có nghĩa sát là đến và hiện diện với một người. Trong hoàn cảnh Phao-lô tự biện hộ, cụm tiếng Việt này diễn đạt sự có mặt để ủng hộ mà không biến họ thành người biện hộ pháp lý thay ông.
- source_word: πάντες με ἐγκατέλιπον
  choice: tất cả đều bỏ rơi tôi
  rationale: Động từ chỉ việc bỏ lại một người trong cảnh khó khăn. “Bỏ rơi” là cách nói hiện đại, tự nhiên và giữ được sức nặng của hành động.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Xin điều ấy đừng bị quy cho họ
  rationale: Thể mong ước diễn tả lời cầu xin rằng hành động vừa nêu không bị ghi nhận để chống lại họ. “Bị quy cho họ” giữ được ẩn dụ pháp lý-kế toán mà không thêm rõ đó là tội hay hình phạt.
theological_decisions:
- issue: Sắc thái của lời cuối dành cho những người đã bỏ rơi Phao-lô
  choice: 'Một lời cầu xin hoặc mong ước: “Xin điều ấy đừng bị quy cho họ.”'
  alternative: 'Một lời cho phép nhẹ hơn: “Đừng kể điều ấy cho họ.”'
  rationale: Thể optative với μή tự nhiên biểu thị mong ước hoặc lời cầu xin. Cách dịch giữ âm hưởng tha thứ nhưng không xác định thêm ai là chủ thể quy tội hay hậu quả chính xác là gì.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Biện hộ” giữ bối cảnh pháp lý; “đứng về phía tôi” diễn đạt tự nhiên sự hiện diện hỗ trợ; câu cuối giữ cấu trúc lời cầu xin và không bổ sung từ “tội”, nhờ đó bảo toàn độ hàm ẩn của nguyên văn.
