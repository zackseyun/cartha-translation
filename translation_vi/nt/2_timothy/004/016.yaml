revisions:
- from: Trong lần biện hộ đầu tiên của tôi[a], không một ai đứng về phía tôi[b], nhưng tất cả đều bỏ rơi tôi. Xin điều ấy đừng bị quy cho họ.[c]
  to: Trong lần đầu tiên tôi tự biện hộ[a], không ai có mặt cùng tôi[b], nhưng tất cả đều bỏ rơi tôi. Xin đừng tính điều ấy là lỗi của họ.[c]
  rationale: Bản sửa giảm diễn giải trong mệnh đề về sự hiện diện của người khác, đồng thời làm rõ hơn trong tiếng Việt sắc thái lời cầu mong không quy lỗi của câu cuối. Bản dịch vẫn giữ tính pháp lý của ἀπολογία, tính mong ước của optative λογισθείη với μή, và không xác định thêm chủ thể hay hậu quả của việc ‘tính’ điều ấy.
