  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: vi
  text: Hãy gửi lời chào đến Prisca[a], Aquila và cả nhà Onesiphorus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp ghi “Prisca”; ở những chỗ khác, bà cũng được gọi là “Prisila” (chẳng hạn Công Vụ 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Hãy gửi lời chào đến
  rationale: Động từ mệnh lệnh trong văn thư, yêu cầu chuyển lời chào. Cách diễn đạt này tự nhiên trong tiếng Việt hiện đại, giữ nguyên lực mệnh lệnh mà không thêm sắc thái tình cảm không được nói rõ.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Bản Hy Lạp tại đây dùng Πρίσκαν, tức dạng tên Prisca; vì vậy giữ cách phiên âm này thay vì thay bằng dạng quen thuộc Prisila.
- source_word: Ἀκύλαν
  choice: Aquila
  rationale: Phiên âm trực tiếp tên riêng Ἀκύλας, phù hợp với dạng tên trong nguyên văn.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: gia đình Onesiphorus
  rationale: Trong lời chào, οἶκος chỉ những người thuộc một nhà hoặc hộ gia đình, chứ không phải tòa nhà. “Gia đình” là cách nói tự nhiên, dễ hiểu, dù từ Hy Lạp có thể bao quát cả những người trong hộ ngoài quan hệ huyết thống.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Hãy gửi lời chào đến” để thể hiện mệnh lệnh văn thư; giữ các tên riêng gần với hình thức Hy Lạp. Dấu chú thích [a] được đặt ngay sau cặp tên mà ghi chú làm rõ.
