  terminology: Giữ Prisca theo đúng hình thức tên trong SBLGNT. “Cả nhà Onesiphorus” diễn đạt tự nhiên chức năng xã hội của οἶκος mà không đồng nhất nó với tòa nhà hay chỉ gia đình huyết thống.
