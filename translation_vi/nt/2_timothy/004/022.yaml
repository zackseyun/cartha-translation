  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: vi
  text: Nguyện Chúa ở cùng tâm linh của anh[a]. Nguyện ân điển ở cùng tất cả anh chị em.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tiếng Hy Lạp chuyển từ số ít sang số nhiều: “tâm linh của anh” (số ít) ... “tất cả anh chị em” (số nhiều).'
    reason: Giải thích sự chuyển đổi số ngữ pháp từ σου (số ít) sang ὑμῶν (số nhiều), được bản dịch thể hiện bằng các cách xưng hô khác nhau.
lexical_decisions:
- source_word: κύριος
  choice: Chúa
  rationale: Trong lời chúc phước kết thư của Phao-lô, danh xưng này tự nhiên chỉ về Chúa Giê-su; bản dịch giữ nguyên danh xưng mà không thêm tên riêng vốn không có trong tiếng Hy Lạp.
- source_word: μετὰ
  choice: ở cùng
  rationale: Tiếng Hy Lạp lược động từ; tiếng Việt cần bổ sung cấu trúc cầu chúc “Nguyện ... ở cùng” để diễn đạt tự nhiên ý nguyện hàm ẩn.
- source_word: πνεύματός
  choice: tâm linh
  rationale: Đại từ sở hữu số ít cho thấy đây là tâm linh của Ti-mô-thê; “tâm linh” phân biệt rõ hơn với Chúa Thánh Linh và vẫn giữ chiều kích nội tâm của từ πνεῦμα.
- source_word: σου
  choice: con
  rationale: Đại từ số ít được giữ lại; “con” phù hợp với mối quan hệ mục vụ thân tình giữa Phao-lô và Ti-mô-thê trong thư, đồng thời phân biệt với đại từ số nhiều ở mệnh đề sau.
- source_word: χάρις
  choice: ân điển
  rationale: “Ân điển” là cách diễn đạt quen thuộc, trang trọng và có sức nặng thần học cho χάρις trong lời chúc phước của Phao-lô.
- source_word: ὑμῶν
  choice: tất cả anh chị em
  rationale: Cách dịch này thể hiện rõ số nhiều và sự chuyển đổi từ lời chúc dành riêng cho Ti-mô-thê sang lời chúc dành cho cộng đồng rộng hơn.
theological_decisions:
- issue: Đối tượng của danh xưng “Chúa”
  choice: Hiểu là Chúa Giê-su trong lời chúc phước kết thư của Phao-lô.
  alternative: Hiểu theo nghĩa chung hơn là Đức Chúa Trời.
  rationale: Cách dùng trong các lời kết thư của Phao-lô thường chỉ về Chúa Giê-su; tuy vậy, bản dịch chỉ dùng “Chúa”, không thêm “Giê-su”, nhờ đó không xác định quá mức so với nguyên văn.
- issue: Sự chuyển đổi số giữa hai mệnh đề
  choice: Mệnh đề đầu hướng riêng đến Ti-mô-thê; mệnh đề sau mở rộng đến một nhóm người.
  alternative: Dịch cả hai mệnh đề như chỉ hướng đến Ti-mô-thê.
  rationale: Nguyên văn chuyển rõ từ σου số ít sang ὑμῶν số nhiều. Bản dịch và chú thích bảo toàn nét văn chương và ý nghĩa cộng đồng này.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Nguyện” để thể hiện lời cầu chúc hàm ẩn trong hai mệnh đề không có động từ. “Con” diễn đạt số ít và quan hệ thân tình; “tất cả anh chị em” diễn đạt số nhiều theo lối bao quát tự nhiên trong tiếng Việt.
