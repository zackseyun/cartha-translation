base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: vi
  text: Tôi đã chiến đấu trong cuộc chiến cao đẹp, đã chạy xong cuộc đua, đã gìn giữ đức tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã giữ lòng trung tín” hoặc “đã sống trung tín.” Cụm từ Hy Lạp τὴν πίστιν có thể chỉ đức tin được gìn giữ, hoặc mang nghĩa giữ lòng trung tín.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: cuộc chiến cao đẹp
  rationale: ἀγών chỉ cuộc tranh đấu, cuộc thi đấu hoặc cuộc chiến; cách dịch này tự nhiên trong tiếng Việt, giữ được sức mạnh của ẩn dụ và sắc thái tốt đẹp, cao quý của καλός.
- source_word: ἠγώνισμαι
  choice: tôi đã chiến đấu
  rationale: Thể hoàn thành của ἀγωνίζομαι diễn tả cuộc chiến đấu đã được thực hiện trọn vẹn với kết quả còn hiệu lực; cấu trúc 'đã chiến đấu' phù hợp với tiếng Việt và song hành với hai vế sau.
- source_word: δρόμον
  choice: cuộc đua
  rationale: δρόμος có thể chỉ đường chạy hoặc cuộc đua; 'cuộc đua' truyền đạt rõ ẩn dụ thể thao cho độc giả hiện đại.
- source_word: τετέλεκα
  choice: đã chạy xong
  rationale: τελέω nói đến việc đưa điều gì đến chỗ hoàn tất. Kết hợp với 'cuộc đua', 'chạy xong' là cách diễn đạt tự nhiên, ngắn gọn và sinh động trong tiếng Việt.
- source_word: πίστιν
  choice: đức tin
  rationale: πίστις ở đây có thể chỉ đức tin được gìn giữ, nội dung đức tin Cơ Đốc, hoặc sự trung tín. 'Đức tin' giữ được cách hiểu chính mà không thêm đối tượng không có trong nguyên văn.
- source_word: τετήρηκα
  choice: đã giữ vững
  rationale: τηρέω mang nghĩa giữ gìn, tuân giữ hoặc bảo toàn. 'Giữ vững' tự nhiên trong tiếng Việt và có thể bao hàm cả việc không từ bỏ lẫn trung thành gìn giữ.
theological_decisions:
- issue: Ý nghĩa của τὴν πίστιν
  choice: đã giữ vững đức tin
  alternative: đã giữ lòng trung tín / đã trung tín đến cùng
  rationale: Mạo từ cùng văn cảnh có thể hướng đến 'đức tin' như điều Phao-lô đã gìn giữ, nhưng cụm từ cũng có thể nói đến sự trung tín của ông. Bản chính giữ 'đức tin', còn chú thích bảo tồn cách hiểu kia thay vì quyết định dứt khoát.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. Ba vế ngắn song hành tái hiện nhịp điệu của nguyên văn; 'cuộc chiến cao đẹp' và 'cuộc đua' bảo tồn các ẩn dụ tranh đấu, thể thao mà không diễn giải thêm.
