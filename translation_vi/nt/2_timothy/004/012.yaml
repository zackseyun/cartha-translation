  text: Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: vi
  text: Còn Ty-chi-cơ, tôi đã sai đến Ê-phê-sô.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhưng tôi đã sai Ty-chi-cơ đến Ê-phê-sô” hoặc “Và tôi đã sai Ty-chi-cơ đến Ê-phê-sô”; liên từ Hy Lạp δέ có thể biểu thị sự tiếp nối đơn thuần hoặc sự tương phản nhẹ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Ty-chi-cơ
  rationale: Tên riêng ở đối cách; dùng dạng phiên âm tiếng Việt quen thuộc trong truyền thống Kinh Thánh.
- source_word: δὲ
  choice: Còn
  rationale: Liên từ chuyển ý nhẹ, nối câu này với lời nói về những người khác trong văn cảnh mà không nhấn mạnh sự tương phản quá mức.
- source_word: ἀπέστειλα
  choice: tôi đã sai
  rationale: Động từ aorist chủ động, ngôi thứ nhất số ít; “đã sai” diễn đạt tự nhiên hành động sai phái đã xảy ra mà không áp đặt sắc thái thể hoàn thành.
- source_word: εἰς
  choice: đến
  rationale: Với địa danh, giới từ này chỉ đích đến; “đến” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Ἔφεσον
  choice: Ê-phê-sô
  rationale: Địa danh ở đối cách sau εἰς; dùng dạng phiên âm tiếng Việt quen thuộc.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Còn” giữ được chức năng chuyển ý linh hoạt của δέ; cấu trúc được sắp xếp tự nhiên theo tiếng Việt, đồng thời bảo toàn nội dung nguồn Hy Lạp.
