source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: vi
  text: A-léc-xan-đơ, người thợ kim loại[a], đã gây cho tôi nhiều tổn hại[b]. Chúa sẽ báo trả[c] người ấy tùy theo các việc người ấy đã làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “người thợ đồng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dịch sát: “đã bày tỏ với tôi nhiều điều xấu”; ý nói: “đã làm hại tôi rất nhiều.”'
    reason: lexical_alternative
  - marker: c
    text: 'Một số thủ bản chép: “Nguyện Chúa báo trả người ấy tùy theo các việc người ấy đã làm.”'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀλέξανδρος
  choice: A-léc-xan-đơ
  rationale: Phiên âm tên riêng theo cách đọc dễ nhận biết đối với độc giả Việt hiện đại.
- source_word: χαλκεὺς
  choice: người thợ kim loại
  rationale: Từ này chỉ người làm nghề gia công kim loại, thường là đồng hoặc đồng thiếc. “Thợ kim loại” tránh xác định quá mức loại kim loại; cách dịch truyền thống “thợ đồng” được giữ trong chú thích.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: đã gây cho tôi nhiều tổn hại
  rationale: Trong ngữ cảnh, thành ngữ Hy Lạp diễn tả việc A-léc-xan-đơ đã làm nhiều điều gây hại cho Phao-lô. Cách dịch này tự nhiên trong tiếng Việt nhưng vẫn giữ số nhiều và mức độ nghiêm trọng của κακά; nghĩa sát chữ được nêu trong chú thích.
- source_word: ἀποδώσει
  choice: sẽ báo trả
  rationale: Thể tương lai của ἀποδίδωμι diễn tả việc hoàn trả hoặc báo ứng tương xứng. “Sẽ báo trả” giữ sắc thái phán xét mà không dùng lối nói quá khẩu ngữ.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Danh xưng xác định chỉ Chúa được chuyển tự nhiên theo cách dùng tiếng Việt; tiếng Việt không cần mạo từ tương ứng với ὁ.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: tùy theo những việc hắn đã làm
  rationale: Cách diễn đạt này truyền đạt tự nhiên nguyên tắc báo trả căn cứ vào các việc làm. Đại từ “hắn” phù hợp với thái độ tiêu cực rõ ràng trong ngữ cảnh mà không thêm nội dung ngoài câu.
theological_decisions:
- issue: ἀποδώσει được hiểu là lời xác quyết ở thì tương lai hay lời cầu xin Chúa báo trả
  choice: Chúa sẽ báo trả hắn
  alternative: Nguyện Chúa báo trả hắn
  rationale: Bản văn SBLGNT có ἀποδώσει, dạng tương lai chỉ định, nên câu chính là một lời xác quyết về sự báo trả của Chúa, không phải lời nguyền rủa hay cầu xin. Dị bản mang sắc thái cầu chúc/cầu xin được bảo tồn trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Người thợ kim loại” tránh xác định quá mức chất liệu nghề nghiệp; “đã gây cho tôi nhiều tổn hại” chuyển thành ngữ Hy Lạp sang tiếng Việt tự nhiên. Câu chính giữ dạng xác quyết tương lai của bản văn SBLGNT, còn dị bản mang sắc thái cầu xin được ghi chú.
