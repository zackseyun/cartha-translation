  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: vi
  text: Con cũng phải đề phòng người ấy, vì người ấy đã kịch liệt chống đối lời của chúng ta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sứ điệp của chúng ta” hoặc “sự dạy dỗ của chúng ta.” Tiếng Hy Lạp viết là “lời của chúng ta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: người ấy
  rationale: Đại từ quan hệ chỉ Alexander ở câu trước; “người ấy” tự nhiên và giữ rõ đối tượng được cảnh báo.
- source_word: καὶ σὺ
  choice: Con cũng
  rationale: Giữ sự nhấn mạnh vào Ti-mô-thê như người cũng cần cảnh giác; “con” phù hợp quan hệ xưng hô của thư tín trong ngữ cảnh.
- source_word: φυλάσσου
  choice: phải đề phòng
  rationale: Mệnh lệnh hiện tại trung động diễn tả sự cảnh giác liên tục và có tính cá nhân; “phải đề phòng” truyền đạt rõ lực cảnh báo.
- source_word: λίαν
  choice: rất quyết liệt
  rationale: Trạng từ nhấn mạnh mức độ mạnh mẽ của sự chống đối và kết hợp tự nhiên với “chống đối” trong tiếng Việt.
- source_word: ἀντέστη
  choice: đã chống đối
  rationale: Động từ aorist chỉ việc đứng lên chống lại hoặc kháng cự; “đã chống đối” rõ nghĩa và không thu hẹp bối cảnh.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: lời của chúng ta
  rationale: Giữ gần nghĩa bề mặt của λόγοι và không tự quyết định đó cụ thể là lời biện hộ, sứ điệp rao giảng hay giáo huấn.
theological_decisions:
- issue: Phạm vi ý nghĩa của “lời của chúng ta”
  choice: Giữ cách nói rộng “lời của chúng ta,” chỉ những điều Phao-lô và các cộng sự đã nói mà không xác định loại diễn ngôn.
  alternative: lời làm chứng biện hộ của chúng ta; sứ điệp của chúng ta; sự dạy dỗ của chúng ta
  rationale: Cụm Hy Lạp không cho biết chắc sự chống đối diễn ra trong tòa án, trong hoạt động rao giảng hay đối với giáo huấn Cơ Đốc nói chung; bản dịch không nên thu hẹp sự mơ hồ ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “con” theo lối xưng hô thư tín giữa Phao-lô và Ti-mô-thê; “ông ta” diễn tả người nam đã được nhắc đến mà không thêm sắc thái miệt thị quá mạnh.
