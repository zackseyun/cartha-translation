  source_fidelity: Bản nháp truyền đạt đúng lời cảnh báo liên tục dành cho Ti-mô-thê, mức độ mạnh của sự chống đối, và thì quá khứ của ἀντέστη. “Lời của chúng ta” giữ đúng độ rộng của τοῖς ἡμετέροις λόγοις, không áp đặt bối cảnh pháp đình hay giáo huấn chuyên biệt.
  naturalness: Câu nhìn chung tự nhiên. Tuy nhiên, việc đổi từ “người ấy” sang “ông ta” trong cùng một câu kém nhất quán; “người ấy” đủ rõ vì Alexander đã được nêu ở câu trước. “Kịch liệt chống đối” là cách kết hợp hiện đại, gọn và sát hơn với λίαν ἀντέστη.
  terminology: “Con” là lối xưng hô thư tín phù hợp giữa Phao-lô và Ti-mô-thê trong ngữ cảnh rộng hơn. “Đề phòng” phản ánh tốt φυλάσσου. Chú thích giữ các khả năng diễn giải của λόγοι mà không biến chúng thành bản dịch chính.
