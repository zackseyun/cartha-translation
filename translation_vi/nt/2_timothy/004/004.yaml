source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: vi
  text: Họ sẽ ngoảnh tai khỏi chân lý và quay sang những chuyện hoang đường.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những chuyện huyền hoặc” hoặc “những chuyện hư cấu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: chân lý
  rationale: Có mạo từ xác định trong tiếng Hy Lạp và theo ngữ cảnh chỉ chân lý đã được nhận biết; “chân lý” tự nhiên hơn “sự thật” khi nói về nội dung giáo huấn.
- source_word: ἀκοὴν
  choice: tai
  rationale: Nghĩa đen là “sự nghe” hoặc khả năng nghe; thành ngữ “quay tai khỏi” diễn đạt tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh cố ý không nghe.
- source_word: ἀποστρέψουσιν
  choice: sẽ quay ... khỏi
  rationale: Giữ ý chủ động và chuyển hướng có chủ đích của động từ, cùng cấu trúc định hướng ἀπό.
- source_word: μύθους
  choice: những chuyện hoang đường
  rationale: Diễn đạt các chuyện hư cấu hoặc suy đoán đối lập với chân lý; rõ nghĩa trong tiếng Việt hiện đại và không gợi nghĩa kỹ thuật trung tính của “thần thoại”.
- source_word: ἐκτραπήσονται
  choice: hướng về
  rationale: Trong kết cấu với ἐπί, cụm này diễn tả việc quay lệch sang một đối tượng khác; “hướng về” giữ sự đối lập từ “khỏi” sang “về” mà không quyết định quá mức sắc thái trung động hay bị động.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: khỏi ... và ... về
  rationale: Giữ tương phản định hướng từ chân lý sang chuyện hoang đường bằng cấu trúc tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi nghĩa của “chân lý” trong ngữ cảnh
  choice: Giữ từ khái quát “chân lý”
  alternative: giáo lý chân chính; chân lý Phúc Âm
  rationale: Ngữ cảnh liên hệ đến giáo huấn sứ đồ, nhưng câu này dùng từ rộng hơn; không thu hẹp nghĩa bằng cách thêm nội dung giải thích.
- issue: Tác nhân trong ἐκτραπήσονται
  choice: Dịch nội động là “hướng về”
  alternative: bị lôi kéo về; quay sang
  rationale: Hình thái có thể được hiểu theo sắc thái trung động hoặc bị động. Bản dịch không thêm một tác nhân bên ngoài và duy trì sự mơ hồ chính đáng.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Quay tai khỏi” là thành ngữ dễ hiểu, bảo toàn hình ảnh của nguyên văn; “chuyện hoang đường” tránh sắc thái cổ của “chuyện ngụ ngôn” và nghĩa thể loại tương đối trung tính của “thần thoại”.
