source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: vi
  text: Vì tôi đang được rót ra làm lễ quán[a], và thời điểm tôi ra đi[b] đã đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đang được đổ ra”. Động từ Hy Lạp gợi hình ảnh rượu được rót đổ trong một lễ hiến tế.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự giải thoát” hoặc “sự tháo gỡ”. Trong câu này, “ra đi” là cách nói tự nhiên về cái chết.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: đã bắt đầu được đổ ra như một lễ quán
  rationale: Động từ ở thể bị động, thì hiện tại gợi hình ảnh rượu được đổ ra làm lễ vật; kết hợp với ἤδη, cách dịch này diễn đạt hành động đã và đang diễn ra mà vẫn giữ nguyên ẩn dụ hiến tế.
- source_word: ἤδη
  choice: đã bắt đầu
  rationale: Trong tiếng Việt, cụm này tự nhiên hơn khi đi với một hành động hiện đang diễn ra, đồng thời truyền đạt ý hành động ấy đã khởi sự.
- source_word: καιρός
  choice: thời điểm
  rationale: Chỉ một thời khắc quyết định đã tới, chứ không phải thời gian nói chung.
- source_word: ἀναλύσεώς
  choice: ra đi
  rationale: Giữ cách nói giảm về cái chết và sắc thái lên đường của danh từ Hy Lạp, không thu hẹp nghĩa thành một lời giải thích trực tiếp như 'chết'.
- source_word: ἐφέστηκεν
  choice: đã đến
  rationale: Diễn đạt tự nhiên trạng thái hiện tại phát sinh từ một thời điểm đã tới, phù hợp với thì hoàn thành Hy Lạp.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với mạch văn trước.
theological_decisions:
- issue: Cách mô tả ẩn dụ về cái chết sắp đến của Phao-lô
  choice: Giữ cả hình ảnh hiến tế 'được đổ ra như một lễ quán' và cách nói giảm 'ra đi'.
  alternative: Diễn giải trực tiếp là 'tôi sắp chết' hoặc hiểu lời này chỉ về sự chịu khổ nói chung.
  rationale: Sự kết hợp giữa σπένδομαι và ἀνάλυσις hướng mạnh đến cái chết sắp xảy ra, nhưng nguyên văn diễn đạt điều đó qua hai hình ảnh; bản dịch không nên làm phẳng sự căng thẳng và chiều sâu thần học ấy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Lễ quán” là thuật ngữ ngắn gọn chỉ lễ vật dạng chất lỏng được rót đổ; chú thích làm rõ hình ảnh cho độc giả phổ thông.
