  rationale: Bản sửa loại bỏ ý “bắt đầu” không được nêu rõ trong ἤδη, dùng động từ “rót ra” tự nhiên cho lễ quán, và bảo toàn đồng thời hình ảnh hiến tế, ý hành động đang diễn ra, thời điểm quyết định đã hiện diện, và uyển ngữ về cái chết. Các ký hiệu chú thích vẫn được gắn ngay sau cụm từ chúng giải thích.
