id: 2TI.4.3
reference: 2 Timothy 4:3
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: vi
  text: Vì sẽ đến lúc người ta không chấp nhận lời dạy lành mạnh[a], nhưng theo những ham muốn riêng, họ sẽ chất cho mình hết thầy này đến thầy khác, với đôi tai ngứa ngáy[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giáo lý lành mạnh” hoặc “lời dạy đúng đắn.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “tai ngứa ngáy”; hình ảnh này diễn tả sự khao khát được nghe những điều hợp với ham muốn của mình.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: lúc
  rationale: Trong lời dự báo này, καιρός chỉ một thời điểm hoặc giai đoạn sẽ đến; “lúc” tự nhiên và rõ ràng trong tiếng Việt.
- source_word: ὑγιαινούσης διδασκαλίας
  choice: sự dạy dỗ lành mạnh
  rationale: Giữ hình ảnh ẩn dụ “khỏe mạnh” của ὑγιαίνω, đồng thời dùng cách nói phổ thông hơn thuật ngữ kỹ thuật “giáo lý chân chính”.
- source_word: οὐκ ἀνέξονται
  choice: không chịu nổi
  rationale: Diễn đạt ý không chịu đựng hoặc không chấp nhận tiếp tục nghe; cách nói hiện đại nhưng vẫn giữ sắc thái mạnh của động từ.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: theo những ham muốn riêng
  rationale: ἐπιθυμίαι ở đây nói rộng về những điều người ta khao khát, không nhất thiết chỉ dục vọng; “ham muốn” giữ được sắc thái lệch lạc trong ngữ cảnh.
- source_word: ἑαυτοῖς
  choice: cho mình
  rationale: 'Giữ rõ lực phản thân: họ tìm những người dạy phục vụ chính sở thích của họ.'
- source_word: ἐπισωρεύσουσιν
  choice: sẽ chất chứa ... thật nhiều
  rationale: Động từ gợi hình ảnh vun thành đống và số lượng dư thừa; thêm “thật nhiều” làm rõ hình ảnh này một cách tự nhiên trong tiếng Việt.
- source_word: διδασκάλους
  choice: người dạy
  rationale: Cách gọi thông dụng, không biến từ này thành một chức danh giáo hội chuyên biệt.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: với đôi tai ngứa ngáy
  rationale: Giữ hình ảnh sinh động và cấu trúc hoàn cảnh của phân từ, không ép nó thành quan hệ nhân quả vốn không được đánh dấu rõ trong tiếng Hy Lạp.
theological_decisions:
- issue: Cách dịch διδασκαλία trong thư mục vụ
  choice: sự dạy dỗ
  alternative: giáo lý
  rationale: Từ Hy Lạp có thể chỉ cả nội dung lẫn hành vi dạy; “sự dạy dỗ” giữ nghĩa rộng và tránh áp đặt sắc thái giáo phái.
- issue: Quan hệ của κνηθόμενοι τὴν ἀκοήν với mệnh đề chính
  choice: với đôi tai ngứa ngáy
  alternative: vì tai họ ngứa ngáy
  rationale: Phân từ có thể hàm ý động cơ, nhưng nguồn không đánh dấu quan hệ nhân quả tường minh; bản dịch giữ sự mơ hồ đó.
- issue: Hình ảnh “tai ngứa”
  choice: giữ nguyên hình ảnh và giải thích bằng chú thích
  alternative: muốn nghe những điều vừa tai
  rationale: Giữ phép ẩn dụ của nguyên bản, nhưng chú thích giúp độc giả hiện đại hiểu rằng đây là sự thèm nghe điều hợp ý mình.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ các hình ảnh “lành mạnh,” “chất chứa” và “tai ngứa ngáy” của nguyên bản; chú thích giải thích những chỗ có thể khó hiểu hoặc có phương án dịch khác.
