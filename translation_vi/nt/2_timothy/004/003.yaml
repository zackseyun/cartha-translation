revisions:
- from: Vì sẽ đến lúc người ta không chịu nổi sự dạy dỗ lành mạnh[a], nhưng theo những ham muốn riêng, họ sẽ chất chứa cho mình thật nhiều người dạy, với đôi tai ngứa ngáy[b].
  to: Vì sẽ đến lúc người ta không chấp nhận lời dạy lành mạnh[a], nhưng theo những ham muốn riêng, họ sẽ chất cho mình hết thầy này đến thầy khác, với đôi tai ngứa ngáy[b].
  rationale: Bản sửa thay các cụm chưa tự nhiên hoặc có nguy cơ lệch sắc thái bằng cách diễn đạt hiện đại hơn, đồng thời giữ các hình ảnh, số nhiều, lực phản thân và quan hệ phân từ không được xác định rõ là nhân quả trong nguyên văn Hy Lạp.
