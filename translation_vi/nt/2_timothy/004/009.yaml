  text: Make every effort to come to me quickly[a].
translation:
  language: vi
  text: Hãy cố gắng hết sức để nhanh chóng đến với tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy sốt sắng đến với tôi thật nhanh” hoặc “Hãy cố gắng hết sức để sớm đến với tôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Hãy cố gắng hết sức
  rationale: Động từ mệnh lệnh truyền đạt sự sốt sắng, chuyên tâm và nỗ lực nghiêm túc, chứ không chỉ nói đến tốc độ. Cách dịch này cũng giữ ý riêng biệt với ταχέως.
- source_word: ἐλθεῖν
  choice: đến
  rationale: Động từ nguyên mẫu được Σπούδασον chi phối; đi với πρός με, tiếng Việt tự nhiên dùng “đến với tôi”.
- source_word: πρός με
  choice: với tôi
  rationale: Trong kết cấu chỉ chuyển động hướng về một người, “đến với tôi” là cách diễn đạt tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ταχέως
  choice: sớm
  rationale: Trạng từ có thể chỉ sự nhanh chóng hoặc thời điểm không xa. Trong lời yêu cầu về việc đến, “sớm” diễn đạt tự nhiên tính cấp bách theo thời gian mà không nhập làm một với ý nỗ lực của Σπούδασον.
