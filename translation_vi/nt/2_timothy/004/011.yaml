id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: vi
  text: Chỉ có Lu-ca ở với tôi. Hãy đón Mác rồi đưa anh ấy đi cùng con, vì anh ấy hữu ích cho tôi trong công việc phục vụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong chức vụ” hoặc “để phục vụ.”'
    reason: διακονία có thể nói đến sự phục vụ nói chung hoặc công tác phục vụ trong sứ mạng.
lexical_decisions:
- source_word: Λουκᾶς
  choice: Lu-ca
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: μόνος
  choice: chỉ có
  rationale: 'Diễn đạt tự nhiên ý loại trừ: Lu-ca là người duy nhất hiện đang ở với Phao-lô.'
- source_word: μετ’ ἐμοῦ
  choice: ở với tôi
  rationale: Giữ trực tiếp ý đồng hành của μετά với sở hữu cách.
- source_word: Μᾶρκον
  choice: Mác
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt.
- source_word: ἀναλαβὼν
  choice: đón
  rationale: Trong bối cảnh hành trình, từ này chỉ việc gặp và nhận Mác đi cùng trước khi đưa ông đến với Phao-lô; “đón” tự nhiên hơn cách dịch sát chữ “nhấc lên”.
- source_word: ἄγε μετὰ σεαυτοῦ
  choice: đưa anh ấy đi cùng con
  rationale: Mệnh lệnh ἄγε mang nghĩa đưa người ấy theo mình; đại từ “anh ấy” được bổ sung từ Mác, còn “con” phù hợp quan hệ xưng hô trong thư mà không thay đổi nội dung.
- source_word: εὔχρηστος
  choice: hữu ích
  rationale: Phản ánh rõ nghĩa có ích, có thể giúp đỡ, đồng thời giữ sắc thái trang trọng.
- source_word: γάρ μοι
  choice: vì anh ấy hữu ích cho tôi
  rationale: “Vì” thể hiện lý do của mệnh lệnh, còn “cho tôi” giữ giá trị của μοι.
- source_word: εἰς διακονίαν
  choice: trong công việc phục vụ
  rationale: Giữ nghĩa rộng của διακονία là sự phục vụ, đồng thời cụm “công việc phục vụ” tự nhiên và có thể bao hàm công tác hầu việc Chúa mà không mặc nhiên biến nó thành một chức vụ kỹ thuật.
theological_decisions:
- issue: Phạm vi nghĩa của διακονία
  choice: công việc phục vụ
  alternative: công tác phục vụ; chức vụ
  rationale: διακονία có thể chỉ sự phục vụ nói chung hoặc công tác phục vụ trong sứ mạng. “Công việc phục vụ” giữ được bối cảnh công tác của Phao-lô mà không thu hẹp từ này thành một chức vụ chính thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cách xưng hô “tôi–con” phù hợp quan hệ của Phao-lô với Ti-mô-thê trong thư; “anh ấy” tránh gọi Mác bằng một đại từ mang sắc thái tuổi tác không được câu Hy Lạp xác định.
