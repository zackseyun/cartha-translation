id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: vi
  text: Vì Đê-ma đã bỏ tôi vì yêu mến thời đại hiện tại[a], và đã đi Tê-sa-lô-ni-ca; Cơ-rết-xen đi Ga-la-ti, còn Tít đi Đan-ma-ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thế gian hiện tại.” Từ Hy Lạp theo nghĩa sát hơn chỉ thời đại hay kỷ nguyên hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγκατέλιπεν
  choice: đã lìa bỏ
  rationale: Diễn đạt hành động bỏ Phao-lô lại với sắc thái tiêu cực và đáng trách, nhưng không tự ý khẳng định Đê-ma đã hoàn toàn từ bỏ đức tin.
- source_word: ἀγαπήσας
  choice: do yêu mến
  rationale: Phân từ aorist nhiều khả năng mang sắc thái nguyên nhân trong ngữ cảnh; “do yêu mến” làm rõ mối liên hệ tự nhiên trong tiếng Việt mà không thêm ý ngoài câu.
- source_word: τὸν νῦν αἰῶνα
  choice: đời hiện tại
  rationale: Giữ ý nghĩa thời đại/đời sống thuộc thời hiện tại của αἰών, đồng thời tránh khiến người đọc chỉ nghĩ đến vũ trụ vật chất.
- source_word: ἐπορεύθη
  choice: đã đi
  rationale: Cách diễn đạt chuyển động đơn giản, tự nhiên, phù hợp với danh sách các điểm đến.
- source_word: γάρ
  choice: Vì
  rationale: Giữ quan hệ giải thích với lời yêu cầu ở câu trước.
- source_word: Θεσσαλονίκην
  choice: Tê-sa-lô-ni-ca
  rationale: Dạng phiên âm tên địa danh quen dùng trong Kinh Thánh tiếng Việt.
- source_word: Κρήσκης
  choice: Cơ-rết-xen
  rationale: Phiên âm tên riêng Hy Lạp sang tiếng Việt theo cách rõ âm và dễ đọc.
- source_word: Γαλατίαν
  choice: Ga-la-ti
  rationale: Dạng địa danh quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Τίτος
  choice: Tít
  rationale: Dạng tên riêng ngắn gọn, quen thuộc trong tiếng Việt hiện đại.
- source_word: Δαλματίαν
  choice: Đa-ma-ti
  rationale: Phiên âm địa danh sang tiếng Việt theo cách dễ đọc.
theological_decisions:
- issue: Việc Đê-ma ra đi có nên được dịch như một lời khẳng định ông đã bội đạo hay không
  choice: Dịch là “đã lìa bỏ tôi,” giữ sắc thái đáng trách nhưng chỉ xác định ông đã bỏ Phao-lô.
  alternative: Dịch mạnh hơn theo hướng Đê-ma đã từ bỏ đức tin.
  rationale: Bản văn nói Đê-ma bỏ Phao-lô vì yêu mến đời hiện tại, nhưng không trực tiếp tuyên bố kết cục thuộc linh hay sự bội đạo hoàn toàn của ông.
- issue: Quan hệ ngữ pháp của phân từ ἀγαπήσας với hành động lìa bỏ
  choice: Dịch “do yêu mến,” thể hiện sắc thái nguyên nhân có khả năng cao.
  alternative: Dịch sát hình thức hơn là “sau khi đã yêu mến” hoặc “vì đã yêu mến.”
  rationale: Trong ngữ cảnh, tình yêu đối với đời hiện tại giải thích việc Đê-ma lìa bỏ Phao-lô; cách dịch vẫn không mở rộng nội dung thành một phán quyết thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc liệt kê cô đọng của nguyên văn; thêm “còn” trước Tít để các vế đích đến rõ ràng trong tiếng Việt.
