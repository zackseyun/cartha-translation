    rationale: Dù vẫn hiểu được, «để lại tại Mi-lê» tự nhiên và minh thị hơn cho ἐν Μιλήτῳ.
  revised_text: Ê-rát ở lại Cô-rinh-tô, còn Trô-phim thì tôi để lại tại Mi-lê lúc ông đang đau ốm.
