  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: vi
  text: Ê-rát ở lại Cô-rinh-tô, còn Trô-phim thì tôi để lại tại Mi-lê lúc ông đang đau ốm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔραστος
  choice: Ê-ra-tút
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong tiếng Việt.
- source_word: ἔμεινεν
  choice: ở lại
  rationale: 'Diễn đạt tự nhiên ý μένω trong bản tường thuật hành trình: lưu lại tại một nơi.'
- source_word: ἐν Κορίνθῳ
  choice: Cô-rinh-tô
  rationale: Giới từ ἐν mang nghĩa chỉ địa điểm; trong tiếng Việt, tên thành phố sau 'ở lại' không cần thêm 'tại'.
- source_word: Τρόφιμον
  choice: Trô-phi-mốt
  rationale: Tên riêng được phiên âm theo cách dùng quen thuộc trong tiếng Việt.
- source_word: δὲ
  choice: còn ... thì
  rationale: Thể hiện sự chuyển ý và tương phản nhẹ giữa hai tin tức về hành trình, tự nhiên hơn trong tiếng Việt.
- source_word: ἀπέλιπον
  choice: tôi để lại
  rationale: Động từ ngôi thứ nhất số ít chỉ việc người viết rời đi trong khi Trô-phi-mốt vẫn ở đó; 'để lại' giữ được sắc thái của ἀπολείπω.
- source_word: ἐν Μιλήτῳ
  choice: Mi-lê
  rationale: Địa danh được phiên âm theo cách dùng quen thuộc; vị trí được diễn đạt trực tiếp sau 'để lại'.
- source_word: ἀσθενοῦντα
  choice: khi ông đang đau ốm
  rationale: Phân từ hiện tại bổ nghĩa cho Trô-phi-mốt, cho biết tình trạng của ông vào lúc bị để lại; cách diễn đạt này bảo toàn quan hệ thời gian mà vẫn tự nhiên.
