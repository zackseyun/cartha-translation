  rationale: Sửa các tên riêng theo dạng phiên âm Kinh Thánh tiếng Việt quen thuộc và thêm «tại» để biểu thị rõ địa điểm. Giữ «lúc ông đang đau ốm» để phản ánh phân từ hiện tại ἀσθενοῦντα như tình trạng đồng thời, không áp đặt quan hệ nhân quả.
