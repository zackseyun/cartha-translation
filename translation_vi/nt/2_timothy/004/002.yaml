language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: vi
  text: Hãy rao giảng lời ấy; hãy sẵn sàng[a], dù thuận thời hay nghịch thời[b]; hãy chỉ ra lỗi lầm, quở trách, khuyên nhủ[c], với tất cả sự kiên nhẫn và sự dạy dỗ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy khẩn thiết” hoặc “hãy túc trực.” Mệnh lệnh Hy Lạp có thể mang ý sẵn sàng, có mặt để hành động, hoặc khẩn thiết xúc tiến công việc.'
    reason: lexical_alternative
  - marker: b
    text: 'Nghĩa là: dù thời điểm thuận lợi hay không thuận lợi.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “khích lệ” hoặc “thúc giục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: hãy rao giảng
  rationale: Diễn đạt mệnh lệnh công khai công bố một sứ điệp; “rao giảng” tự nhiên trong ngữ cảnh chức vụ và giữ được sắc thái trang trọng của động từ Hy Lạp.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Giữ nguyên độ rộng của λόγος, không tự ý thu hẹp thành “Tin Mừng” hay “Kinh Thánh.” Từ chỉ định “ấy” cho thấy đây là lời/sứ điệp đã được xác định trong văn mạch.
- source_word: ἐπίστηθι
  choice: hãy sẵn sàng
  rationale: Nêu bật yêu cầu phải hiện diện và chuẩn bị để hành động. Chú thích giữ lại các khả năng “khẩn thiết” và “túc trực.”
- source_word: εὐκαίρως ἀκαίρως
  choice: dù thuận thời hay nghịch thời
  rationale: Giữ cấu trúc đối xứng, súc tích của hai trạng từ Hy Lạp, với nghĩa hành động bất kể thời điểm có thuận lợi hay không.
- source_word: ἔλεγξον
  choice: hãy chỉ ra lỗi lầm
  rationale: Thể hiện việc phơi bày điều sai và đưa người nghe đến chỗ sửa đổi, đồng thời phân biệt tương đối với mệnh lệnh mạnh hơn ngay sau đó.
- source_word: ἐπιτίμησον
  choice: quở trách
  rationale: Giữ sắc thái khiển trách nghiêm khắc, mạnh hơn hành động chỉ ra lỗi lầm.
- source_word: παρακάλεσον
  choice: khuyên nhủ
  rationale: Diễn đạt lời kêu gọi tha thiết, nhưng vẫn để ngỏ sắc thái khích lệ hoặc thúc giục qua chú thích.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: với tất cả lòng kiên nhẫn
  rationale: μακροθυμία chỉ sự nhẫn nại lâu dài đối với con người; “tất cả” phản ánh phạm vi trọn vẹn của πάσῃ.
- source_word: καὶ διδαχῇ
  choice: và sự dạy dỗ
  rationale: Giữ dạng danh từ và cho thấy việc sửa trách, quở trách, khuyên nhủ phải đi cùng sự chỉ dạy.
theological_decisions:
- issue: Phạm vi nghĩa của “lời ấy”
  choice: Không mở rộng thành “Tin Mừng” hoặc “Kinh Thánh.”
  alternative: “sứ điệp,” “Tin Mừng,” hoặc “Kinh Thánh”
  rationale: Văn mạch liên hệ lời rao giảng với Kinh Thánh và sự dạy dỗ của các sứ đồ, nhưng riêng λόγος trong câu này không xác định hẹp hơn. Cách dịch giữ nguyên độ rộng và sự căng thẳng thần học của bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Chuỗi mệnh lệnh ngắn giữ nhịp dồn dập của nguyên văn; cặp “thuận thời hay nghịch thời” giữ tính cân xứng tu từ mà vẫn được giải nghĩa trong chú thích.
