id: 2TI.4.18
reference: 2 Timothy 4:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: vi
  text: Chúa sẽ giải cứu tôi khỏi mọi việc ác và sẽ đưa tôi an toàn vào vương quốc trên trời của Ngài.[a] Nguyện vinh quang thuộc về Ngài đời đời vô cùng.[b] A-men.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “và sẽ cứu tôi vào vương quốc trên trời của Ngài.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “cho đến các thời đại của các thời đại.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: sẽ giải cứu
  rationale: Động từ ῥύομαι diễn tả việc giải thoát khỏi hiểm nguy; “giải cứu” là cách nói tự nhiên và giữ được sắc thái ấy.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: khỏi mọi việc ác
  rationale: “Việc ác” truyền đạt gọn và tự nhiên nghĩa của ἔργον πονηρόν, còn “mọi” phản ánh παντός.
- source_word: σώσει εἰς
  choice: sẽ đưa tôi an toàn vào
  rationale: Cách dịch này diễn đạt tự nhiên trong tiếng Việt cả ý cứu giữ của σῴζω lẫn hướng đi vào một đích đến của εἰς.
- source_word: τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: vương quốc trên trời của Ngài
  rationale: Giữ nghĩa sở hữu và đặc tính thuộc trời của vương quốc; “vương quốc” là từ hiện đại, dễ hiểu.
- source_word: ᾧ ἡ δόξα
  choice: Nguyện vinh quang thuộc về Ngài
  rationale: Diễn đạt tự nhiên công thức tôn vinh, đồng thời giữ sắc thái quy vinh quang cho Chúa.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: đời đời vô cùng
  rationale: Thành ngữ tiếng Việt trang trọng, tự nhiên, truyền đạt thời gian vô tận của thành ngữ Hy Lạp.
- source_word: ἀμήν
  choice: A-men
  rationale: Giữ cách phiên âm quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Mối liên hệ giữa sự giải cứu hiện tại và sự cứu rỗi sau cùng
  choice: Phân biệt “giải cứu khỏi mọi việc ác” với việc được đưa an toàn vào vương quốc trên trời, nhưng không xác định rằng Phao-lô chắc chắn thoát khỏi cái chết thể xác.
  alternative: Hiểu câu này như lời hứa Chúa sẽ giải cứu Phao-lô khỏi việc bị hành quyết.
  rationale: Hai động từ ῥύσεταί và σώσει cùng cụm “vào vương quốc trên trời của Ngài” cho phép hiểu sự bảo toàn tối hậu mà không buộc câu phải hứa sự thoát chết trong đời hiện tại.
- issue: Đối tượng của lời tôn vinh
  choice: Giữ đại từ “Ngài” theo nguyên văn, không nêu thêm danh xưng.
  alternative: Thay đại từ bằng “Chúa” hoặc xác định rõ là Đức Chúa Trời hay Đấng Christ.
  rationale: Nguyên văn dùng đại từ quan hệ ᾧ; việc không bổ sung đối tượng cụ thể bảo tồn sự liên kết và mức độ hàm ẩn của bản Hy Lạp.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để phù hợp văn phong tôn kính; tránh lối dịch cứng “cứu tôi vào” trong chính văn, nhưng ghi nhận ở chú thích để bảo tồn cấu trúc σώσει εἰς.
