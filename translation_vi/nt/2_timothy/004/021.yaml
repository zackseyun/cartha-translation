  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: vi
  text: Hãy cố gắng đến trước mùa đông. Ê-bu-lô gửi lời chào con; Pu-đen, Li-nút, Cơ-lau-đia và tất cả anh chị em[a] cũng vậy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát chữ: “tất cả các anh em”; trong ngữ cảnh này, từ Hy Lạp có thể chỉ rộng hơn đến toàn thể các tín hữu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Hãy hết sức thu xếp
  rationale: Mệnh lệnh aorist của σπουδάζω diễn tả sự sốt sắng, khẩn trương và nỗ lực có chủ ý. Trong ngữ cảnh lời yêu cầu đi đến trước mùa đông, “hết sức thu xếp” tự nhiên hơn lối dịch máy móc “hãy chuyên cần”.
- source_word: πρὸ χειμῶνος
  choice: trước mùa đông
  rationale: πρό với sở hữu cách chỉ thời điểm trước một mùa hay biến cố; cách nói tự nhiên trong tiếng Việt là “trước mùa đông”.
- source_word: ἐλθεῖν
  choice: để đến
  rationale: Động từ nguyên mẫu bổ nghĩa cho Σπούδασον và nói về việc Ti-mô-thê đến chỗ Phao-lô; “đến” là cách dịch trực tiếp, tự nhiên.
- source_word: Ἀσπάζεταί σε
  choice: gửi lời chào con
  rationale: Trong thư tín, ἀσπάζομαι tự nhiên được diễn đạt là “gửi lời chào”. Đại từ số ít σε chỉ Ti-mô-thê; “con” phù hợp với quan hệ xưng hô đã được thiết lập trong thư.
- source_word: Εὔβουλος; Πούδης; Λίνος; Κλαυδία
  choice: Ê-bu-lô; Pu-đen; Li-nút; Cơ-lau-đia
  rationale: Các tên riêng được phiên âm theo âm dạng Hy Lạp và quy ước tên Kinh Thánh tiếng Việt, không dịch nghĩa tên.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: tất cả anh chị em
  rationale: ἀδελφοί là danh từ giống đực số nhiều nhưng trong cách dùng cộng đồng Cơ Đốc ban đầu có thể bao gồm toàn thể các tín hữu. “Anh chị em” truyền đạt tự nhiên nghĩa tập thể có khả năng bao gồm cả nam lẫn nữ, đồng thời chú thích bảo tồn hình thức nguyên văn.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί trong lời chào cộng đồng
  choice: tất cả anh chị em
  alternative: tất cả các anh em
  rationale: Ngữ pháp Hy Lạp dùng giống đực số nhiều, nhưng từ này thường có thể chỉ một cộng đồng gồm cả hai giới. Bản chính dùng cách nói tự nhiên và có tính bao quát trong tiếng Việt; chú thích nêu rõ hình thức sát chữ để không xóa đi sự mơ hồ của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Hãy hết sức thu xếp” giữ được cả sắc thái nỗ lực lẫn tính khẩn cấp thực tế; cách liệt kê tên và cụm “cũng vậy” tạo câu tiếng Việt tự nhiên mà vẫn bảo toàn cấu trúc lời chào.
