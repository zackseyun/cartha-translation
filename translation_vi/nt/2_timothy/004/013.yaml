  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: vi
  text: Khi anh đến, hãy mang theo chiếc áo choàng[a] mà ta đã để lại ở Trô-a, chỗ Cạt-pô, cùng các sách[b], nhất là các bản chép trên da thuộc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số người hiểu từ này là túi hoặc bao đựng sách, nhưng nghĩa thông thường của từ Hy Lạp là một loại áo khoác ngoài.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “các cuộn sách”; từ Hy Lạp có thể chỉ những cuộn có chữ viết hoặc các loại tài liệu thành văn tương tự.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: chiếc áo choàng
  rationale: Nghĩa thông thường và phù hợp nhất là một loại áo khoác ngoài; cách dịch này tự nhiên, đồng thời không suy diễn đó là túi hay bao đựng sách.
- source_word: ἀπέλιπον
  choice: ta đã để lại
  rationale: Động từ ở thì aorist, ngôi thứ nhất số ít, diễn tả trực tiếp hành động người viết đã để vật ấy lại.
- source_word: ἐν Τρῳάδι παρὰ Κάρπῳ
  choice: ở Trô-a, chỗ Cạt-pô
  rationale: παρά với cách dữ cách ở đây chỉ địa điểm gắn với một người, có thể hàm ý tại nơi ở hoặc trong sự trông nom của Cạt-pô. Cách diễn đạt này giữ được độ mở ấy mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἐρχόμενος
  choice: Khi đến
  rationale: Phân từ có chức năng trạng ngữ chỉ thời gian đối với mệnh lệnh φέρε; chủ thể được hiểu là Ti-mô-thê.
- source_word: φέρε
  choice: hãy mang theo
  rationale: Mệnh lệnh yêu cầu Ti-mô-thê đem các vật đến khi ông tới; “mang theo” tự nhiên trong ngữ cảnh hành trình.
- source_word: τὰ βιβλία
  choice: các sách
  rationale: βιβλία chỉ các vật liệu có chữ viết, thường là sách hoặc cuộn sách. “Các sách” là cách gọi rộng, còn dạng vật lý cụ thể không chắc chắn nên được nêu trong chú thích.
- source_word: μάλιστα
  choice: nhất là
  rationale: Diễn đạt tự nhiên sự nhấn mạnh đặc biệt vào các vật bằng giấy da.
- source_word: τὰς μεμβράνας
  choice: các bản bằng giấy da
  rationale: μεμβράνα chỉ vật liệu viết bằng da đã được xử lý, và trong ngữ cảnh có thể là các bản tài liệu hoặc bản thảo bằng giấy da. “Các bản bằng giấy da” tránh hiểu chúng chỉ là những tấm da chưa được dùng để viết.
theological_decisions: []
translation_notes:
  register: Bản dịch dùng tiếng Việt hiện đại, trang trọng và dễ hiểu. Đại từ “ta–con” thể hiện lời dặn trực tiếp của Phao-lô với Ti-mô-thê theo lối xưng hô quen thuộc trong văn phong Kinh Thánh tiếng Việt. Tên riêng được phiên âm là Trô-a và Cạt-pô. Các ký hiệu chú thích được sắp lại theo đúng thứ tự xuất hiện trong câu để nội dung chú thích khớp với từ được giải thích.
