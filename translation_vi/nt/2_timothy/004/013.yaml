  to: Khi anh đến, hãy mang theo chiếc áo choàng[a] mà ta đã để lại ở Trô-a, chỗ Cạt-pô, cùng các sách[b], nhất là các bản chép trên da thuộc.
  rationale: Sửa đại từ để tránh thêm sắc thái gia tộc hoặc thuộc linh không được diễn đạt trong nguyên ngữ, đồng thời làm câu văn hiện đại và trực tiếp hơn. Sửa cách dịch μεμβράνας thành “các bản chép trên da thuộc” để diễn đạt tự nhiên và chính xác hơn về parchment. Các chú thích giữ đúng neo và nội dung giải thích từ vựng.
