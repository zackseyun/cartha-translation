  terminology: “Ngôi nhà lớn,” “vật dụng,” “đất nung,” “sự tôn quý,” và “sự ô nhục” phù hợp với văn cảnh và thanh ghi trang trọng của bản dịch Kinh Thánh hiện đại. Chú thích về “đất nung” chính xác; chú thích thay thế cho cụm τιμή/ἀτιμία nêu rõ đây là một phương án diễn giải, trong khi chính văn giữ lối dịch sát.
