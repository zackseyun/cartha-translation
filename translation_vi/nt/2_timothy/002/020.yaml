  source_fidelity: 'Bản dịch truyền đạt đầy đủ các yếu tố của nguyên văn: bối cảnh “ngôi nhà lớn,” bốn nhóm chất liệu, và thế đối xứng μέν...δέ giữa hai loại vật dụng. “Vật dụng” giữ phạm vi rộng của σκεύη. “Dành cho sự tôn quý ... dành cho sự ô nhục” phản ánh trung thành các danh từ trừu tượng εἰς τιμήν ... εἰς ἀτιμίαν, không áp đặt cách giải thích “thông thường” hay “hèn kém.”'
