id: 2TI.2.20
reference: 2 Timothy 2:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: vi
  text: Trong một ngôi nhà lớn, không chỉ có những vật dụng bằng vàng và bạc, mà còn có những vật dụng bằng gỗ và đất nung[a]; có thứ dành cho sự tôn quý, có thứ dành cho sự ô nhục.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Đất nung” chỉ những vật dụng làm bằng đất sét đã nung, tức đồ gốm.
    reason: cultural_note
  - marker: b
    text: 'Cũng có thể dịch: “có thứ dùng vào việc đáng trọng, có thứ dùng vào việc đáng khinh.” Tiếng Hy Lạp sát nghĩa hơn là “dành cho sự tôn quý ... dành cho sự ô nhục.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλῃ οἰκίᾳ
  choice: một ngôi nhà lớn
  rationale: Diễn đạt tự nhiên về quy mô của ngôi nhà và giữ nguyên hình ảnh trong tiếng Hy Lạp.
- source_word: σκεύη
  choice: những vật dụng
  rationale: Từ này chỉ rộng các đồ vật hay đồ chứa phục vụ một mục đích; “vật dụng” phù hợp với bối cảnh gia đình mà không thu hẹp thành một loại đồ dùng cụ thể.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: bằng vàng và bạc
  rationale: Các tính từ Hy Lạp nói đến chất liệu cấu thành; cách diễn đạt này tự nhiên trong tiếng Việt.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: bằng gỗ và đất nung
  rationale: ὀστράκινος chỉ vật làm bằng đất sét đã nung; “đất nung” chính xác, thông dụng và giữ được sự tương phản về chất liệu.
- source_word: ἃ μὲν ... ἃ δὲ ...
  choice: có thứ ... có thứ ...
  rationale: Cấu trúc sóng đôi này phân biệt hai nhóm vật dụng; cách dịch ngắn gọn và tự nhiên trong tiếng Việt.
- source_word: εἰς τιμήν
  choice: dành cho sự tôn quý
  rationale: Giữ danh từ trừu tượng τιμή và không vội thu hẹp ý nghĩa thành một loại công dụng cụ thể.
- source_word: εἰς ἀτιμίαν
  choice: dành cho sự ô nhục
  rationale: Giữ sự đối lập trực tiếp với τιμή và bảo toàn sắc thái mạnh của ἀτιμία thay vì diễn giải nhẹ thành “việc thông thường”.
- source_word: δὲ
  choice: không biểu đạt bằng một từ nối riêng
  rationale: Ở đầu câu, δέ đánh dấu sự chuyển tiếp nhẹ; tiếng Việt không cần thêm “bây giờ” hay một từ đối lập mạnh trong câu này.
theological_decisions:
- issue: Nên hiểu τιμή/ἀτιμία theo công dụng (“việc đáng trọng/đáng khinh”) hay theo danh dự và địa vị (“sự tôn quý/sự ô nhục”)
  choice: Giữ “dành cho sự tôn quý ... dành cho sự ô nhục” trong chính văn
  alternative: dùng vào việc đáng trọng ... dùng vào việc đáng khinh
  rationale: Nguyên văn dùng hai danh từ trừu tượng τιμή và ἀτιμία. Cách dịch chính giữ sự căng thẳng giữa địa vị, cách đối xử và công dụng của vật dụng, để câu kế tiếp tiếp tục triển khai hình ảnh thay vì bản dịch tự quyết định trước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ phép liệt kê cùng sự đối xứng của nguyên văn; dấu chấm phẩy giúp tách danh sách chất liệu khỏi sự phân loại theo tôn quý và ô nhục.
