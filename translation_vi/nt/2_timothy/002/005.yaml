  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν δὲ καὶ ἀθλῇ τις, οὐ στεφανοῦται ἐὰν μὴ νομίμως ἀθλήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/005.yaml
  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: vi
  text: Cũng vậy, nếu ai thi đấu, người ấy không được trao vòng hoa chiến thắng, nếu không thi đấu đúng luật.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một cách hợp lệ.” Trạng từ Hy Lạp này có thể có nghĩa là “theo luật lệ”; ở đây, có lẽ nói đến việc tuân theo luật lệ của cuộc thi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: thi đấu
  rationale: Động từ ἀθλέω chỉ việc tranh tài trong một cuộc thi thể thao. “Thi đấu” truyền đạt rõ hình ảnh vận động viên và việc lặp lại từ này giữ mối liên kết từ vựng trong nguyên văn.
- source_word: τις
  choice: một người
  rationale: Đại từ bất định mang nghĩa khái quát; “một người” tự nhiên trong tiếng Việt và không giới hạn đối tượng theo giới tính.
- source_word: στεφανοῦται
  choice: được trao vòng chiến thắng
  rationale: Động từ thể bị động nói đến việc người thắng cuộc được đội hoặc nhận vòng hoa chiến thắng. Cách dịch này giữ hình ảnh thể thao, đồng thời tránh khiến độc giả hiện đại hiểu đơn thuần là vương miện hoàng gia.
- source_word: νομίμως
  choice: đúng luật
  rationale: Trạng từ này có nghĩa là theo cách hợp luật hoặc hợp lệ; trong ngữ cảnh thi đấu, “đúng luật” diễn đạt tự nhiên ý tuân theo luật lệ của cuộc thi.
- source_word: καὶ
  choice: cũng vậy
  rationale: καί có tác dụng bổ sung ví dụ này vào chuỗi hình ảnh trong văn cảnh; “cũng vậy” thể hiện rõ sự chuyển sang một trường hợp tương tự.
- source_word: δὲ
  choice: Cũng vậy
  rationale: δέ đánh dấu một bước chuyển nhẹ. Trong tiếng Việt, ý chuyển tiếp của δέ và ý bổ sung của καί được kết hợp tự nhiên trong cụm “Cũng vậy”.
theological_decisions:
- issue: Ý nghĩa của vòng chiến thắng
  choice: Giữ nguyên hình ảnh người thi đấu được trao vòng chiến thắng, không xác định đó là một phần thưởng thuộc linh cụ thể nào.
  alternative: Giải thích rõ đó là phần thưởng trong thời sau hết hoặc sự chuẩn nhận dành cho người phục vụ.
  rationale: Câu này dùng phép so sánh thể thao để nhấn mạnh việc thi đấu hợp lệ. Nguyên văn không trực tiếp xác định vòng chiến thắng tượng trưng cho điều gì, nên bản dịch giữ nguyên độ mở thần học ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vòng chiến thắng” để tái hiện chiếc vòng trao cho người thắng trong các cuộc thi cổ đại; tránh cách diễn đạt cổ hoặc dễ gợi riêng đến vương quyền.
