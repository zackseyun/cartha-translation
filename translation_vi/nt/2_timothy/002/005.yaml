revisions:
- from: Cũng vậy, nếu một người thi đấu, người ấy sẽ không được trao vòng chiến thắng, trừ khi thi đấu đúng luật.[a]
  to: Cũng vậy, nếu ai thi đấu, người ấy không được trao vòng hoa chiến thắng, nếu không thi đấu đúng luật.[a]
  rationale: Bản sửa loại bỏ sắc thái tương lai không cần thiết, dùng cách diễn đạt tự nhiên và chính xác hơn cho vòng hoa của người thắng cuộc, đồng thời giữ nguyên phép ẩn dụ thể thao, điều kiện kép, và độ mở thần học của nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:10Z'
review_pass:
  verdict: revise
  source_fidelity: Bản thảo truyền đạt đúng cấu trúc điều kiện kép và hình ảnh cuộc thi của ἀθλέω. Tuy nhiên, «sẽ không được» dễ chuyển phát biểu khái quát ở thì hiện tại στεφανοῦται thành tương lai; «vòng hoa chiến thắng» cũng phản ánh στεφανόω trong bối cảnh thể thao chính xác và tự nhiên hơn «vòng chiến thắng».
  naturalness: Câu sửa giữ văn phong hiện đại, rõ ràng. «Cũng vậy» diễn đạt trôi chảy chức năng chuyển tiếp–bổ sung của δὲ καί trong mạch các ví dụ.
  terminology: «Thi đấu», «vòng hoa chiến thắng», và «đúng luật» bảo tồn trường nghĩa thể thao mà không diễn giải chiếc vòng hoa thành một phần thưởng thuộc linh cụ thể. Chú thích giữ được lựa chọn nghĩa «hợp lệ/theo luật lệ».
  issues:
  - severity: low
    issue: Sắc thái thì của «sẽ không được»
    rationale: στεφανοῦται là hiện tại bị động trong một mệnh đề điều kiện có giá trị khái quát; tiếng Việt không cần «sẽ». Bỏ từ này tránh nhấn mạnh tương lai không có trong nguyên văn.
  - severity: low
    issue: Cách gọi phần thưởng «vòng chiến thắng»
    rationale: στεφανόω trong ngữ cảnh ἀθλέω là được trao/đội vòng hoa của người thắng cuộc. «Vòng hoa chiến thắng» gợi đúng hình ảnh thể thao cổ đại hơn mà không khẳng định một loại cây cụ thể.
  revised_text: Cũng vậy, nếu ai thi đấu, người ấy không được trao vòng hoa chiến thắng, nếu không thi đấu đúng luật.[a]
