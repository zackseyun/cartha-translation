id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: vi
  text: Vì vậy, tôi chịu đựng mọi sự vì những người được chọn[a], để họ cũng nhận được sự cứu rỗi ở trong Đấng Mê-si-a Giê-su, cùng với vinh quang đời đời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những người được tuyển chọn.” Từ Hy Lạp là ἐκλεκτούς.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Vì vậy
  rationale: Diễn đạt tự nhiên quan hệ nguyên nhân với ngữ cảnh trước, không làm mất lực hồi chỉ của cụm từ.
- source_word: πάντα ὑπομένω
  choice: tôi chịu đựng mọi sự
  rationale: Giữ sắc thái bao quát của πάντα và sự bền lòng chịu gian khổ của ὑπομένω bằng cách diễn đạt trang trọng, dễ hiểu.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: vì những người được chọn
  rationale: διά với đối cách chỉ lợi ích hay mục đích hướng đến; cách dịch này tự nhiên trong tiếng Việt và giữ nguyên ý niệm được chọn mà không áp đặt một hệ thống thần học.
- source_word: ἵνα καὶ αὐτοὶ
  choice: để họ cũng
  rationale: Giữ lực chỉ mục đích của ἵνα và ý bổ sung của καί; đại từ αὐτοί được diễn đạt tự nhiên bằng “họ”.
- source_word: σωτηρίας τύχωσιν
  choice: nhận được sự cứu rỗi
  rationale: τυγχάνω với sở hữu cách mang nghĩa đạt được hay nhận được; “nhận được” là tiếng Việt hiện đại, không hàm ý họ tự mình lập công để đạt cứu rỗi.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a Giê-su
  rationale: Giữ hình ảnh thần học về sự cứu rỗi ở trong Đấng Mê-si-a, đồng thời dịch Χριστός theo nghĩa tước hiệu.
- source_word: μετὰ δόξης αἰωνίου
  choice: cùng với vinh quang đời đời
  rationale: μετά với sở hữu cách diễn tả sự đi kèm; “cùng với” giúp phân biệt cụm này với cụm “ở trong Đấng Mê-si-a Giê-su” và gắn vinh quang đời đời với sự cứu rỗi.
theological_decisions:
- issue: Cách dịch ἐκλεκτούς
  choice: những người được chọn
  alternative: những người tuyển chọn
  rationale: “Những người được chọn” vừa sát nghĩa vừa tự nhiên hơn trong tiếng Việt hiện đại; giữ nguyên sự căng thẳng thần học của ngôn ngữ tuyển chọn mà không giải thích ai chọn hoặc chọn theo cách nào.
- issue: Χριστός là tước hiệu hay tên gọi
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Trong cụm này, Χριστός vẫn mang nội dung tước hiệu; “Đấng Mê-si-a” làm rõ nghĩa ấy thay vì chỉ phiên âm theo truyền thống.
- issue: Quan hệ của μετὰ δόξης αἰωνίου
  choice: vinh quang đời đời đi kèm với sự cứu rỗi
  alternative: vinh quang đời đời gắn trực tiếp với việc ở trong Đấng Mê-si-a Giê-su
  rationale: Cú pháp tự nhiên nhất cho thấy cụm này diễn tả điều đi kèm với sự cứu rỗi; dấu phẩy và “cùng với” làm sáng tỏ cấu trúc nhưng không mở rộng ý nghĩa.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các thuật ngữ phổ thông trong tiếng Việt Cơ Đốc. Câu giữ cấu trúc mục đích của nguyên văn và tránh diễn giải theo một lập trường giáo phái.
