id: 2TI.2.11
reference: 2 Timothy 2:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος· εἰ γὰρ συναπεθάνομεν, καὶ συζήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: vi
  text: 'Đây là lời đáng tin cậy[a]: Vì nếu chúng ta đã chết cùng Ngài[b], chúng ta cũng sẽ sống cùng Ngài.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Lời này là trung tín” hoặc “Tuyên bố này đáng tin.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo sát nguyên văn: “chúng ta đã cùng chết”; động từ Hy Lạp hàm ý cùng dự phần trong sự chết với Đấng Christ.'
    reason: lexical_alternative
  - marker: c
    text: Cụm “sẽ sống cùng Ngài” có thể nói đến sự sống phục sinh với Đấng Christ, sự dự phần vào sự sống của Ngài, hoặc bao gồm cả hai.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: đáng tin cậy
  rationale: Tính từ vị ngữ mô tả λόγος là điều có thể tin nhận. “Đáng tin cậy” tự nhiên trong tiếng Việt hiện đại và không thu hẹp nghĩa thành phẩm chất trung tín của một cá nhân.
- source_word: ὁ λόγος
  choice: lời này
  rationale: Trong các Thư Mục vụ, cụm πιστὸς ὁ λόγος là công thức giới thiệu một lời tuyên bố ngắn gọn, đáng ghi nhớ. “Lời này” vừa tự nhiên vừa giữ được sắc thái của λόγος mà không diễn giải quá mức.
- source_word: εἰ γὰρ
  choice: Vì nếu
  rationale: “Nếu” giữ cấu trúc điều kiện của εἰ, còn “vì” giữ chức năng giải thích của γάρ, nối nội dung tiếp theo với lời được tuyên bố là đáng tin cậy.
- source_word: συναπεθάνομεν
  choice: chúng ta đã chết cùng Ngài
  rationale: Động từ aorist συναποθνῄσκω mang tiền tố συν-, diễn tả cùng dự phần trong sự chết. “Đã chết cùng Ngài” diễn đạt tự nhiên, còn “Ngài” được bổ sung theo hàm ý của động từ và văn cảnh quy chiếu về Đấng Christ.
- source_word: καὶ
  choice: cũng
  rationale: 'Ở đây καί liên kết tương ứng hai vế: đã chết cùng Ngài thì cũng sẽ sống cùng Ngài. “Cũng” làm rõ sự cân xứng ấy trong tiếng Việt.'
- source_word: συζήσομεν
  choice: chúng ta cũng sẽ sống cùng Ngài
  rationale: Động từ tương lai συζάω với tiền tố συν- chỉ sự sống chung hoặc cùng dự phần sự sống với Đấng Christ. Cách dịch này giữ nguyên thì tương lai và không giới hạn câu vào riêng sự sống hiện tại hay sự phục sinh tương lai.
theological_decisions:
- issue: Đối tượng hàm ẩn trong hai động từ ghép với συν-
  choice: Bổ sung “cùng Ngài” ở cả hai vế, quy chiếu về Đấng Christ.
  alternative: 'Giữ đối tượng hoàn toàn hàm ẩn: “nếu chúng ta đã chết, chúng ta cũng sẽ sống.”'
  rationale: Nguyên văn không có một đại từ tân ngữ riêng, nhưng tiền tố συν- trong cả hai động từ hàm ý sự cùng dự phần với một người khác; văn cảnh lấy Đấng Christ làm trung tâm. Bổ sung “Ngài” giúp câu tiếng Việt rõ nghĩa mà không đưa vào một chủ thể mới.
- issue: Chiều kích thời gian và thần học của việc sống cùng Đấng Christ
  choice: Dịch rộng là “sẽ sống cùng Ngài”, không xác định hẹp loại sự sống.
  alternative: Chỉ hiểu là sự sống phục sinh trong tương lai, hoặc chỉ hiểu là sự dự phần sự sống thuộc linh trong hiện tại.
  rationale: Thì tương lai của συζήσομεν hướng đến sự sống với Đấng Christ, nhưng bản văn không tự giới hạn rõ ràng vào một cách diễn giải thần học duy nhất. Bản dịch giữ độ rộng và sức căng ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc cân xứng “đã chết cùng Ngài… cũng sẽ sống cùng Ngài” phản ánh hai động từ ghép Hy Lạp. Đại từ “Ngài” được dùng theo lối diễn đạt Kinh Thánh tiếng Việt quen thuộc, với đối tượng là Đấng Christ được xác định từ văn cảnh.
