language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: vi
  text: là những kẻ đã lạc khỏi chân lý[a], nói rằng sự sống lại đã xảy ra rồi[b], và đang làm lung lay đức tin của một số người[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đã sai lạc về chân lý” hoặc “đã trệch mục tiêu về chân lý.”
    reason: lexical_alternative
  - marker: b
    text: Tức là họ cho rằng sự sống lại trong tương lai đã xảy ra.
    reason: contextual_clarification
  - marker: c
    text: Hay “đang lật đổ” hoặc “đang phá đổ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: là những kẻ
  rationale: Nối tự nhiên với tiền ngữ ở câu trước và giữ sắc thái chỉ những người vừa được nhắc đến; “những kẻ” phù hợp với ngữ cảnh phê phán.
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: đã lạc khỏi chân lý
  rationale: ἀστοχέω với περί diễn tả việc trệch mục tiêu hay sai lệch đối với chân lý; cách dịch này tự nhiên, rõ nghĩa và vẫn giữ hình ảnh lệch hướng.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Dẫn trực tiếp nội dung lời dạy sai mà không quyết định quá mức quan hệ ngữ pháp là phương tiện hay hoàn cảnh.
- source_word: ἀνάστασιν
  choice: sự sống lại
  rationale: Trong ngữ cảnh giáo lý, danh từ không có mạo từ vẫn mang nghĩa xác định, chỉ sự sống lại được mong đợi.
- source_word: ἤδη γεγονέναι
  choice: đã xảy ra rồi
  rationale: Thể hoàn thành trình bày lời tuyên bố rằng biến cố đã hoàn tất và có hệ quả hiện tại; “đã… rồi” chuyển tải tự nhiên sắc thái của ἤδη.
- source_word: ἀνατρέπουσιν
  choice: đang làm đảo lộn
  rationale: Động từ có thể nghĩa là lật đổ, phá đổ hoặc làm đảo lộn; cách chọn này giữ sức nặng của từ mà không khẳng định đức tin đã hoàn toàn bị hủy diệt.
- source_word: τήν τινων πίστιν
  choice: đức tin của một số người
  rationale: Giữ cách dịch thông dụng của πίστις là “đức tin”; τινων mang nghĩa bất định là “một số người”.
theological_decisions:
- issue: Ý nghĩa của lời nói “sự sống lại đã xảy ra rồi”
  choice: Giữ nguyên lời tuyên bố sai rằng sự sống lại đã xảy ra, không giải thích thêm bản chất của quan niệm ấy trong chính văn.
  alternative: Diễn giải đó là sự sống lại chỉ thuộc linh hoặc là sự phủ nhận một cuộc sống lại thân thể trong tương lai.
  rationale: Câu Hy Lạp nêu nội dung lời dạy nhưng không trình bày đầy đủ hệ thống giáo lý đứng sau nó; bản dịch không nên thêm một cách tái dựng thần học cụ thể.
- issue: Cách dịch πίστις
  choice: đức tin
  alternative: lòng tin
  rationale: “Đức tin” là cách dịch chuẩn, tự nhiên trong văn cảnh này và không thu hẹp nghĩa sang cảm giác tin cậy cá nhân.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cụm mở đầu được đặt là “là những kẻ” vì đây là mệnh đề quan hệ nối tiếp câu trước. Dùng “sự sống lại” và “đức tin” theo thuật ngữ Kinh Thánh phổ thông, đồng thời tránh thêm chi tiết giáo phái hoặc giải thích hệ thống tà giáo ngoài điều câu văn nêu rõ.
