    rationale: Có thể nói trực tiếp và tự nhiên hơn rằng họ cho sự sống lại trong tương lai “đã xảy ra,” vẫn giữ giới hạn diễn giải của chú thích tiếng Anh và không áp đặt một tái dựng giáo lý cụ thể.
