    rationale: ἀνατρέπουσιν diễn tả việc lật đổ, phá hoại hoặc làm chao đảo. Trong tiếng Việt, người ta không thường nói “đảo lộn đức tin”; “làm lung lay đức tin” diễn đạt tự nhiên tác động đang diễn ra và tương ứng với cách hiểu thận trọng của bản tiếng Anh là “are upsetting.”
