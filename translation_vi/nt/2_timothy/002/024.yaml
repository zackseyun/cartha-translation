id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: vi
  text: Nhưng tôi tớ của Chúa không được tranh cãi, mà phải dịu dàng với mọi người, có khả năng dạy dỗ và nhẫn nhịn khi bị đối xử xấu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nô lệ của Chúa.” Từ Hy Lạp doulos có thể có nghĩa là “tôi tớ” hoặc “nô lệ,” tùy theo ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: tôi tớ
  rationale: Trong ngữ cảnh chỉ dẫn về cách hành xử khi phục vụ Chúa, “tôi tớ” diễn đạt tự nhiên vai trò thuộc về và phụng sự Chúa; từ Hy Lạp cũng có thể mang nghĩa “nô lệ” tùy ngữ cảnh.
- source_word: κυρίου
  choice: của Chúa
  rationale: Giữ cách gọi κύριος là “Chúa” và thể hiện trực tiếp cấu trúc sở hữu của nguyên văn.
- source_word: οὐ δεῖ μάχεσθαι
  choice: không được tranh cãi
  rationale: δεῖ mang sức nặng của điều bắt buộc, còn μάχεσθαι trong văn cảnh này chủ yếu chỉ sự tranh chấp, gây gổ bằng lời hơn là đánh nhau thể chất.
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: phải dịu dàng với mọi người
  rationale: “Dịu dàng” diễn đạt thái độ ôn hòa đối lập với tranh cãi; “với mọi người” truyền đạt tự nhiên phạm vi phổ quát của πρὸς πάντας.
- source_word: διδακτικόν
  choice: có khả năng dạy dỗ
  rationale: Tính từ này nói đến năng lực hoặc sự thích hợp để dạy, không phải khả năng tiếp thu lời dạy.
- source_word: ἀνεξίκακον
  choice: nhẫn nhịn khi bị đối xử xấu
  rationale: Từ hiếm này chỉ việc chịu đựng điều xấu hoặc sự tổn hại mà không phản ứng trả đũa; cách dịch làm rõ đối tượng của sự nhẫn nhịn.
theological_decisions:
- issue: Cách dịch δοῦλος trong ngữ cảnh chỉ dẫn về chức vụ
  choice: tôi tớ
  alternative: nô lệ
  rationale: Trọng tâm câu là tư cách và cách hành xử của người phục vụ Chúa, nên “tôi tớ” tự nhiên hơn trong chính văn. Tuy vậy, sắc thái thuộc quyền của một chủ trong “nô lệ” là một khả năng từ vựng chân thực và được bảo lưu trong chú thích.
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” là cách dịch phù hợp trong ngữ cảnh Cơ Đốc và không có dấu hiệu nào ở đây đòi hỏi chuyển sang nghĩa xã hội thông thường là “chủ”.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “tôi tớ” theo lối diễn đạt Kinh Thánh quen thuộc nhưng vẫn tự nhiên; “nhẫn nhịn khi bị đối xử xấu” làm rõ nghĩa của từ Hy Lạp hiếm mà không thêm ý trả đũa vào chính văn.
