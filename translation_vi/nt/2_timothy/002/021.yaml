id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: vi
  text: Vậy, nếu ai thanh tẩy chính mình khỏi những điều ấy, người đó sẽ là một vật dụng dùng vào việc đáng trọng,[a] đã được thánh hóa,[b] hữu dụng cho chủ nhân, được chuẩn bị sẵn cho mọi việc lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “một vật dụng đáng trọng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “đã nên thánh” hoặc “đã được biệt riêng.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Vậy, nếu
  rationale: Giữ cả ý suy luận của οὖν và điều kiện của ἐὰν bằng cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: τις
  choice: ai
  rationale: Đại từ bất định mang nghĩa khái quát, không giới hạn giới tính.
- source_word: ἐκκαθάρῃ ἑαυτὸν
  choice: thanh tẩy chính mình
  rationale: Diễn đạt hành động tự làm sạch khỏi điều ô uế, đồng thời giữ sắc thái nghiêm trang và phản thân của nguyên văn.
- source_word: ἀπὸ τούτων
  choice: khỏi những điều ấy
  rationale: Giữ nguyên sự quy chiếu chưa hoàn toàn minh định của đại từ chỉ định về phần văn mạch trước.
- source_word: ἔσται σκεῦος
  choice: sẽ là một vật dụng
  rationale: σκεῦος trong hình ảnh đại gia đình có nghĩa rộng là đồ dùng hay vật dụng; cách dịch này tự nhiên hơn 'bình chứa' và vẫn duy trì ẩn dụ.
- source_word: εἰς τιμήν
  choice: dành cho việc cao quý
  rationale: Nêu rõ chức năng đáng trọng của vật dụng trong thế đối lập với εἰς ἀτιμίαν ở câu trước, nhưng không thu hẹp vào một công dụng cụ thể.
- source_word: ἡγιασμένον
  choice: đã được thánh hóa
  rationale: Thể hoàn thành bị động chỉ một trạng thái hiện tại do hành động thánh hóa đã xảy ra; cách dịch giữ sắc thái thần học và thể bị động.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: hữu dụng cho Chủ
  rationale: εὔχρηστος là hữu dụng, còn δεσπότης chỉ người chủ có thẩm quyền trong hình ảnh gia đình. Viết hoa 'Chủ' phản ánh đối tượng ám chỉ là Đức Chúa Trời hoặc Chúa mà không thay thế ẩn dụ bằng một danh xưng cụ thể hơn.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: được chuẩn bị sẵn cho mọi việc lành
  rationale: Giữ phạm vi bao quát của πᾶν và sắc thái ở trạng thái sẵn sàng của phân từ hoàn thành.
theological_decisions:
- issue: Đối tượng mà người tin phải thanh tẩy mình khỏi đó
  choice: những điều ấy
  alternative: những người ấy; những điều như thế
  rationale: τούτων có thể quy chiếu đến những điều ô nhục hoặc những người và ảnh hưởng sai lạc trong văn mạch. Bản dịch không xác định hẹp hơn nguyên văn.
- issue: Ý nghĩa của εἰς τιμήν trong ẩn dụ về vật dụng
  choice: dành cho việc cao quý
  alternative: đáng trọng; dùng vào việc đáng trọng
  rationale: Cụm từ đối lập với 'việc thấp hèn' ở câu 20 và có thể nói đến địa vị đáng trọng hoặc công dụng đáng trọng. Cách dịch chính giữ hình ảnh về công dụng nhưng ghi nhận cách hiểu ngắn, sát cấu trúc hơn trong chú thích.
- issue: Sắc thái của ἡγιασμένον
  choice: đã được thánh hóa
  alternative: đã nên thánh; đã được biệt riêng
  rationale: Không đồng nhất hoàn toàn sự thánh hóa với chỉ sự cải thiện đạo đức hoặc chỉ sự biệt riêng về chức năng; thuật ngữ giữ được cả chiều kích thuộc về Đức Chúa Trời và trạng thái thánh khiết.
- issue: Danh xưng δεσπότης trong ẩn dụ gia đình
  choice: Chủ
  alternative: chủ nhà; Chúa
  rationale: Nguyên văn nhấn mạnh quyền sở hữu và thẩm quyền của người chủ. 'Chủ' duy trì ẩn dụ và sự quy chiếu thần học mà không quyết định rõ hơn nguyên văn về danh tính của Đấng được nói đến.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng 'vật dụng' để giữ ẩn dụ gia đình xuyên suốt văn mạch; dùng cấu trúc 'nếu ai... người đó...' để diễn đạt số ít khái quát tự nhiên và không áp đặt giới tính. Các dấu chú thích [a], [b] đều được đặt ngay sau cụm từ liên quan.
