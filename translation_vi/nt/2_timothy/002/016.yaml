  source_fidelity: Bản dịch nhận đúng hai nét nghĩa của βεβήλους κενοφωνίας (lời nói rỗng không và mang tính bất kính/vô đạo), mệnh lệnh περιΐστασο, và sự gia tăng tiêu cực trong ἐπὶ πλεῖον προκόψουσιν ἀσεβείας. Tuy nhiên, “phàm tục” trong tiếng Việt hiện đại thường nghiêng về nghĩa thế tục, bình thường hoặc bình dân; không thể hiện đủ rõ sắc thái bất kính đối với điều thánh của βεβήλους. “Lún sâu” là cách diễn đạt tốt cho chiều hướng tiêu cực, nhưng “càng ... sâu” hơi diễn giải kết cấu hơn cần thiết.
  naturalness: “Những lời nói suông phàm tục” có trật tự bổ nghĩa và kết hợp từ chưa thật tự nhiên. “Những lời nói rỗng tuếch, vô đạo” rõ ràng, tự nhiên hơn trong văn phong Kinh Thánh hiện đại. Việc nêu “những kẻ nói như thế” là một cách làm rõ chủ ngữ số nhiều có cơ sở ngữ cảnh, nhưng “những kẻ ấy” gọn hơn sau khi đã nêu loại lời nói.
