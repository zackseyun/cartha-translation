id: 2TI.2.16
reference: 2 Timothy 2:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: vi
  text: Nhưng hãy tránh những lời nói rỗng tuếch, vô đạo[a], vì những kẻ ấy sẽ ngày càng sa vào sự vô đạo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời huyên thuyên thiếu tôn kính,” “lời lảm nhảm rỗng tuếch,” hoặc “lời nói rỗng tuếch, thiếu tôn kính.”'
    reason: Các từ βεβήλους κενοφωνίας kết hợp ý lời nói trống rỗng với ý không thánh hoặc thiếu tôn kính; các cách dịch thay thế nhấn mạnh những sắc thái khác nhau.
lexical_decisions:
- source_word: βεβήλους
  choice: phàm tục
  rationale: Diễn tả điều không thánh, thiếu tôn kính, đối lập với điều thuộc về Đức Chúa Trời; từ này giữ được sắc thái tôn giáo và đạo đức của nguyên ngữ.
- source_word: κενοφωνίας
  choice: những lời nói suông
  rationale: Diễn đạt tự nhiên ý về lời nói rỗng tuếch, không có nội dung hay giá trị thực chất.
- source_word: περιΐστασο
  choice: hãy tránh
  rationale: Thể mệnh lệnh trung động kêu gọi Ti-mô-thê tránh xa, không dính líu đến loại lời nói ấy.
- source_word: ἐπὶ πλεῖον
  choice: càng ... sâu
  rationale: Trong kết cấu với προκόψουσιν và ἀσεβείας, cụm này chỉ sự tiến triển đến mức độ lớn hơn; tiếng Việt diễn đạt tự nhiên bằng 'càng lún sâu'.
- source_word: προκόψουσιν
  choice: sẽ ... lún sâu
  rationale: Động từ vốn có nghĩa tiến tới; trong hướng đi tiêu cực ở đây, 'lún sâu' vừa thể hiện sự gia tăng vừa tránh gợi ý tiến bộ tích cực.
- source_word: ἀσεβείας
  choice: sự bất kính đối với Đức Chúa Trời
  rationale: Làm rõ sắc thái thiếu lòng tôn kính đối với Đức Chúa Trời, thay vì chỉ nói chung về hành vi vô đạo.
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự tương phản với lời khuyên ngay trước đó.
theological_decisions:
- issue: Lời bị cảnh báo chỉ vô ích hay còn mang tính xúc phạm điều thánh
  choice: Dịch là 'những lời nói suông phàm tục', giữ cả tính rỗng tuếch lẫn tính thiếu tôn kính.
  alternative: những lời nói suông; chuyện tầm phào vô đạo
  rationale: Hai từ βεβήλους và κενοφωνίας cùng bổ nghĩa cho loại lời nói này; không nên làm mất sắc thái tôn giáo-đạo đức hoặc chỉ xem đó là cuộc trò chuyện vô ích.
- issue: Chủ ngữ ngầm của προκόψουσιν
  choice: Dịch rõ là 'những kẻ nói như thế'.
  alternative: chúng sẽ càng dẫn đến sự bất kính; họ sẽ càng tiến sâu
  rationale: Động từ ở số nhiều có thể được hiểu theo những người tham gia loại lời nói ấy, trong khi danh từ 'những lời nói' trong tiếng Việt dễ khiến đại từ 'chúng' bị hiểu là chính lời nói. Cách diễn đạt này làm câu tự nhiên nhưng không xác định một nhóm người cụ thể ngoài văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. 'Phàm tục' giữ sắc thái đối lập với điều thánh; 'nói suông' là thành ngữ tự nhiên. Cụm 'càng lún sâu' truyền đạt hướng tiến triển tiêu cực của câu.
