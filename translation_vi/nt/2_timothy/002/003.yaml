    issue: Tên riêng “Jesus” chưa được Việt hóa theo cách dùng chuẩn trong tiếng Việt.
    rationale: Trong bản dịch tiếng Việt hiện đại, tên Ἰησοῦς được phiên âm thông dụng là “Giê-su”. Giữ dạng tiếng Anh “Jesus” tạo cảm giác ngoại lai và không nhất quán với ngôn ngữ đích.
  - severity: low
    issue: Chú thích b gọi “Christ Jesus” là tiếng Hy Lạp.
    rationale: “Christ Jesus” là dạng Anh ngữ/La-tinh hóa, không phải hình thức chữ Hy Lạp của bản nguồn. Nên ghi trực tiếp “Χριστοῦ Ἰησοῦ” và giải thích cách dịch.
  revised_text: Hãy cùng chịu khổ như một người lính tốt của Đấng Mê-si-a Giê-su[a][b].
