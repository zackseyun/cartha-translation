base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: vi
  text: Hãy cùng chịu khổ như một người lính tốt của Đấng Mê-si-a Giê-su[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy chịu gian khổ cùng tôi như một người lính tốt của Đấng Mê-si-a Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: Tiếng Hy Lạp là “Χριστοῦ Ἰησοῦ”; ở đây dịch là “Đấng Mê-si-a Giê-su” vì Χριστός được dùng như một tước hiệu.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Hãy cùng chịu khổ
  rationale: Động từ mệnh lệnh chủ động aorist, ngôi thứ hai số ít. Tiền tố συν- diễn tả sự cùng tham dự vào gian khổ; cách dịch này giữ sắc thái cộng đồng mà không thêm tân ngữ “cùng tôi”, vốn không được nêu rõ trong câu.
- source_word: ὡς
  choice: như
  rationale: Tiểu từ so sánh chỉ cách thức Ti-mô-thê phải cùng chịu khổ.
- source_word: καλὸς
  choice: tốt
  rationale: Trong kết hợp với “người lính”, từ này chỉ phẩm chất đáng khen và xứng hợp; “tốt” tự nhiên, rõ nghĩa và không diễn giải quá mức.
- source_word: στρατιώτης
  choice: người lính
  rationale: Từ thông dụng chỉ một người lính, phù hợp cả với nghĩa từ vựng lẫn hình ảnh ẩn dụ trong câu.
- source_word: Χριστοῦ
  choice: Đấng Mê-si-a
  rationale: Χριστός ở đây mang chức năng tước hiệu. “Đấng Mê-si-a” chuyển tải ý nghĩa của tước hiệu thay vì coi đó chỉ là một phần tên riêng.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Phiên âm tên riêng Ἰησοῦς theo dạng quốc tế quen thuộc; trong tiếng Hy Lạp, từ này ở sở hữu cách cùng với Χριστοῦ.
theological_decisions:
- issue: Cách dịch Χριστοῦ Ἰησοῦ
  choice: Đấng Mê-si-a Jesus
  alternative: Đấng Christ Jesus
  rationale: Cụm từ gồm tước hiệu Χριστός và tên riêng Ἰησοῦς. Bản dịch chuyển nghĩa tước hiệu thành “Đấng Mê-si-a” và giữ tên riêng, đồng thời bảo tồn trật tự của nguyên văn; chú thích ghi cách gọi quen thuộc hơn dựa trên dạng “Christ”.
- issue: Chủ thể cùng chịu khổ được ngầm hiểu
  choice: Không thêm “cùng tôi” vào chính văn
  alternative: Hãy chịu gian khổ cùng tôi
  rationale: Tiền tố συν- cho biết sự cùng tham dự, nhưng câu này không nêu rõ người đồng chịu khổ là ai. Chính văn giữ sự không xác định ấy; chú thích nêu cách hiểu có thể suy ra từ văn cảnh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Hãy” biểu đạt rõ mệnh lệnh; “cùng chịu khổ” giữ sắc thái đồng tham dự của động từ Hy Lạp. Cấu trúc “người lính tốt” được giữ đơn giản để bảo toàn hình ảnh của nguyên văn.
