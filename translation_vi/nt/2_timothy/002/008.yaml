language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: vi
  text: Hãy luôn nhớ đến Giê-su, Đấng Mê-si[a], là Đấng đã được làm cho sống lại từ cõi chết, thuộc dòng dõi Đa-vít[b], theo Tin Lành của tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Giê-su Christ.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng Mê-si,” tức Đấng được xức dầu.'
    reason: alternative_reading
  - marker: b
    text: 'Theo nghĩa đen: “từ hạt giống của Đa-vít,” một thành ngữ chỉ dòng dõi, hậu duệ của Đa-vít.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Hãy luôn nhớ đến
  rationale: Thể mệnh lệnh hiện tại diễn tả lời khuyên có tính liên tục; “hãy luôn nhớ đến” tự nhiên và thể hiện sắc thái ấy.
- source_word: Ἰησοῦν Χριστόν
  choice: Đức Chúa Jêsus, Đấng Mê-si
  rationale: Χριστός ở đây nổi bật như tước hiệu trong bối cảnh nói đến dòng dõi Đa-vít; cách diễn đạt này phân biệt tên riêng với tước hiệu và vẫn trang trọng, dễ hiểu.
- source_word: ἐγηγερμένον ἐκ νεκρῶν
  choice: là Đấng đã được sống lại từ cõi chết
  rationale: Phân từ hoàn thành bị động cho biết Chúa Jêsus đã được làm cho sống lại và vẫn ở trong tình trạng ấy; cách dịch bị động giữ nguyên hướng nghĩa của tiếng Hy Lạp.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: thuộc dòng dõi Đa-vít
  rationale: σπέρμα có nghĩa đen là “hạt giống,” nhưng trong ngữ cảnh gia phả chỉ hậu duệ; “thuộc dòng dõi” là tiếng Việt tự nhiên và chính xác.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: theo Tin Lành tôi rao giảng
  rationale: κατά mang nghĩa “theo/phù hợp với.” Bổ sung “tôi rao giảng” làm rõ thành ngữ “Tin Lành của tôi” mà không hàm ý đây là một Tin Lành riêng biệt về nội dung.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si
  alternative: Đấng Christ / Chúa Cứu Thế
  rationale: Mối liên hệ trực tiếp với sự phục sinh và dòng dõi Đa-vít làm nổi bật chức năng tước hiệu của Χριστός. “Đấng Mê-si” giữ rõ khái niệm Đấng được xức dầu mà không thu hẹp thành một cách giải nghĩa thần học.
- issue: Sắc thái bị động của ἐγηγερμένον
  choice: đã được sống lại
  alternative: đã sống lại / đã được khiến sống lại
  rationale: Giữ thể bị động của nguyên văn và trạng thái kết quả của thì hoàn thành, nhưng tránh thêm chủ thể không được nêu rõ trong câu.
- issue: Ý nghĩa của εὐαγγέλιόν μου
  choice: Tin Lành tôi rao giảng
  alternative: Tin Lành của tôi
  rationale: Đại từ sở hữu được hiểu là sứ điệp Phao-lô rao giảng hoặc được giao phó, không phải một Tin Lành khác; cách dịch tự nhiên này tránh khả năng hiểu lầm mà không áp đặt thêm giáo lý.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Jêsus” theo lối gọi kính trọng quen thuộc trong văn bản Cơ Đốc tiếng Việt; “Đấng Mê-si” giữ chức năng tước hiệu. Cấu trúc câu bám sát chuỗi bổ nghĩa của nguyên văn nhưng thêm “là Đấng” để câu tiếng Việt sáng rõ.
