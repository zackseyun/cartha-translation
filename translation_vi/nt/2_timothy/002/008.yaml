    rationale: Bản Hy Lạp chỉ nêu “Giê-su, Đấng Mê-si”; dù tước hiệu “Chúa” phù hợp với tín lý rộng hơn, nó không xuất hiện trong câu này.
  - severity: medium
    issue: “đã được sống lại” là cách diễn đạt bị động không tự nhiên.
    rationale: Cụm này có thể bị hiểu là được phép tiếp tục sống. “Đã được làm cho sống lại” giữ hướng bị động của phân từ hoàn thành ἐγηγερμένον và rõ nghĩa hơn.
  - severity: low
    issue: “Tin Lành tôi rao giảng” thêm ý “rao giảng”.
    rationale: Ý này là cách giải thích hợp lý về “tin lành của tôi”, nhưng nguyên văn chỉ nói τὸ εὐαγγέλιόν μου. “Tin Lành của tôi” trung thành hơn và vẫn giữ sự mơ hồ của câu.
