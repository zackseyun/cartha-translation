id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: vi
  text: Vì Tin Lành ấy mà tôi đang chịu khổ[a], đến nỗi bị xiềng xích như một kẻ phạm tội[b]. Nhưng lời của Đức Chúa Trời không bị xiềng xích.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong Tin Lành ấy”; tiếng Hy Lạp nhiều khả năng quy chiếu về Tin Lành được nhắc đến ở câu trước.'
    reason: alternative_reading
  - marker: b
    text: 'Hay: “như một kẻ làm điều ác.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: Vì Tin Lành ấy mà
  rationale: Đại từ quan hệ nhiều khả năng quy chiếu về Tin Lành ở câu 8 và trong ngữ cảnh diễn tả nguyên nhân của sự chịu khổ. Cách dịch này tự nhiên trong tiếng Việt; chú thích giữ lại khả năng hiểu theo nghĩa phạm vi.
- source_word: κακοπαθῶ
  choice: tôi đang chịu khổ
  rationale: Diễn đạt tình trạng gian khổ đang tiếp diễn, vừa gọn vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: μέχρι δεσμῶν
  choice: đến nỗi bị xiềng xích
  rationale: μέχρι chỉ mức độ; giữ hình ảnh cụ thể của δεσμά và diễn đạt tự nhiên hệ quả cực độ của sự chịu khổ.
- source_word: ὡς κακοῦργος
  choice: như một kẻ phạm tội
  rationale: Phù hợp bối cảnh bắt giữ và xiềng xích, đồng thời không khẳng định Phao-lô thật sự có tội mà chỉ nêu cách ông bị đối xử.
- source_word: ἀλλὰ
  choice: Nhưng
  rationale: Thể hiện rõ sự tương phản mạnh giữa việc sứ giả bị xiềng xích và lời Đức Chúa Trời không bị như vậy.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  rationale: Giữ độ rộng của λόγος, không thu hẹp cách minh nhiên thành Kinh Thánh hay chỉ riêng nội dung Tin Lành.
- source_word: οὐ δέδεται
  choice: không bị xiềng xích
  rationale: Diễn đạt trạng thái phủ định của thể hoàn thành bị động và lặp lại hình ảnh xiềng xích để làm nổi bật phép đối chiếu trong nguyên văn.
theological_decisions:
- issue: Phạm vi nghĩa của “lời của Đức Chúa Trời”
  choice: Giữ cách nói rộng “lời của Đức Chúa Trời”.
  alternative: “sứ điệp Tin Lành” hoặc “Kinh Thánh”
  rationale: Ngữ cảnh gần hướng đến Tin Lành được rao giảng, nhưng cụm từ Hy Lạp rộng hơn; bản dịch không nên giải quyết tham chiếu theo cách hẹp hơn nguyên văn.
- issue: Quan hệ của ἐν ᾧ với câu trước
  choice: 'Hiểu chủ yếu là nguyên nhân và quy chiếu về Tin Lành: “Vì Tin Lành ấy mà”.'
  alternative: “Trong Tin Lành ấy” hoặc “trong việc ấy”
  rationale: Cấu trúc có thể diễn tả phạm vi hoặc nguyên nhân. Mạch văn thuận nhất với ý Phao-lô chịu khổ vì Tin Lành, nhưng chú thích vẫn bảo tồn tính đa nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “xiềng xích” ở cả hai vế để giữ phép đối chiếu tu từ của nguyên văn; viết hoa “Tin Lành” và dùng danh xưng phổ thông “Đức Chúa Trời”.
