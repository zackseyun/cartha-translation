  verdict: approve
  source_fidelity: Bản dịch truyền đạt chính xác hai mệnh lệnh hiện tại đối lập φεῦγε/δίωκε (“hãy tránh xa”/“theo đuổi”), phạm vi rộng của νεωτερικὰς ἐπιθυμίας, danh sách bốn phẩm chất, và cụm từ chỉ sự đồng hành “cùng với những người kêu cầu Chúa từ tấm lòng trong sạch.” “Từ tấm lòng trong sạch” được đặt đúng nghĩa với những người kêu cầu Chúa, không phải với hành động theo đuổi.
