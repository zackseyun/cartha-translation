  terminology: “Sự công chính,” “đức tin,” “tình yêu thương,” “sự bình an,” và “Chúa” nhất quán với ngữ cảnh Tân Ước. Các chú thích bảo tồn phù hợp những khả năng “công lý” và “sự trung tín,” đồng thời không thu hẹp “ham muốn của tuổi trẻ” vào tình dục.
