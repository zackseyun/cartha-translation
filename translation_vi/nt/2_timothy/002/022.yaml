id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: vi
  text: Nhưng hãy tránh xa những ham muốn của tuổi trẻ[a], và theo đuổi sự công chính[b], đức tin[c], tình yêu thương và sự bình an, cùng với những người kêu cầu Chúa từ tấm lòng trong sạch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “những đam mê của tuổi trẻ.” Cụm từ Hy Lạp nói rộng đến những ham muốn đặc trưng cho tuổi trẻ, chứ không chỉ ham muốn tình dục.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “công lý.” Từ Hy Lạp có thể bao hàm cả sự ngay thẳng về đạo đức lẫn điều công bằng trong các mối quan hệ.'
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch: “sự trung tín.” Từ Hy Lạp có thể chỉ đức tin, lòng tin cậy hoặc sự trung tín, tùy ngữ cảnh.'
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: những ham muốn của tuổi trẻ
  rationale: Diễn đạt phạm vi rộng của những ham muốn đặc trưng cho tuổi trẻ, không thu hẹp vào dục vọng tình dục.
- source_word: φεῦγε
  choice: hãy tránh xa
  rationale: Giữ sắc thái mệnh lệnh mạnh và liên tục của động từ, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: δίωκε
  choice: theo đuổi
  rationale: Diễn tả sự chủ động và bền bỉ, đồng thời giữ thế đối lập với việc tránh xa.
- source_word: δικαιοσύνην
  choice: sự công chính
  rationale: Cách dịch quen thuộc trong ngữ cảnh Phao-lô, bao hàm phẩm chất ngay thẳng; sắc thái công lý được ghi chú.
- source_word: πίστιν
  choice: đức tin
  rationale: Giữ nghĩa phổ biến của πίστις; nghĩa sự trung tín vẫn có thể phù hợp trong danh sách phẩm hạnh nên được ghi chú.
- source_word: ἀγάπην
  choice: tình yêu thương
  rationale: Cách diễn đạt tự nhiên, trang trọng và quen thuộc cho ἀγάπη.
- source_word: εἰρήνην
  choice: sự bình an
  rationale: Phản ánh trực tiếp εἰρήνη và phù hợp với danh sách phẩm hạnh.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: cùng với những người kêu cầu Chúa
  rationale: Thể hiện rõ sự đồng hành với những người khác và giữ cách nói kêu cầu Chúa.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: từ tấm lòng trong sạch
  rationale: Giữ ý nguồn phát xuất của ἐκ và diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Phạm vi của νεωτερικὰς ἐπιθυμίας
  choice: Những ham muốn nói chung đặc trưng cho tuổi trẻ
  alternative: Chủ yếu là dục vọng tình dục
  rationale: Cụm từ Hy Lạp có phạm vi rộng hơn dục vọng tình dục; bản dịch không thu hẹp điều nguyên văn để ngỏ.
- issue: Nghĩa của δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: Trong danh sách phẩm hạnh, sự công chính là cách dịch phù hợp và quen thuộc, nhưng từ Hy Lạp cũng có thể mang sắc thái công lý.
- issue: Nghĩa của πίστις
  choice: đức tin
  alternative: sự trung tín
  rationale: Đức tin là nghĩa phù hợp và phổ biến, nhưng trong danh sách phẩm hạnh, sự trung tín vẫn là một khả năng thực sự.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Hai mệnh lệnh “tránh xa” và “theo đuổi” giữ nhịp tương phản của nguyên văn; không giới hạn “ham muốn của tuổi trẻ” vào nghĩa tình dục.
