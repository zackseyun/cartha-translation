id: 2TI.2.23
reference: 2 Timothy 2:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: vi
  text: Nhưng hãy tránh những cuộc tranh luận ngu dại và thiếu hiểu biết[a], vì biết rằng chúng sinh ra những cuộc cãi vã[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những câu hỏi” hoặc “những cuộc bàn cãi”; từ Hy Lạp có thể chỉ sự tìm hiểu, nhưng ở đây nói đến những vấn đề gây tranh chấp chứ không phải mọi sự tìm hiểu chân thành.
    reason: lexical_alternative
  - marker: b
    text: 'Theo nghĩa đen: “sinh ra”; đây là hình ảnh chỉ việc gây nên các cuộc cãi vã.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς
  choice: ngu dại
  rationale: Diễn đạt sự thiếu sáng suốt về mặt nhận thức và đạo lý, đồng thời giữ giọng trang trọng, tự nhiên.
- source_word: ἀπαιδεύτους
  choice: thiếu hiểu biết
  rationale: Từ này chỉ tình trạng thiếu sự giáo huấn hoặc rèn luyện. Cách dịch này tự nhiên trong tiếng Việt khi bổ nghĩa cho các cuộc tranh luận, nhưng không quy nó đơn thuần thành sự kém thông minh.
- source_word: ζητήσεις
  choice: những cuộc tranh luận
  rationale: Danh từ có thể chỉ câu hỏi hoặc sự khảo cứu, nhưng trong ngữ cảnh này mang sắc thái bàn cãi gây chia rẽ; “tranh luận” giữ được phạm vi nghĩa mà không biến mọi sự tìm hiểu thành điều xấu.
- source_word: παραιτοῦ
  choice: hãy tránh
  rationale: Mệnh lệnh yêu cầu Ti-mô-thê không tham dự hoặc không dây vào những cuộc tranh luận ấy. “Hãy tránh” ngắn gọn, rõ và tự nhiên.
- source_word: εἰδὼς
  choice: vì biết rằng
  rationale: Phân từ nêu cơ sở cho mệnh lệnh. “Vì biết rằng” làm rõ quan hệ lý do mà không cần thêm đại từ không có trong nguyên văn.
- source_word: γεννῶσι
  choice: sinh ra
  rationale: Giữ hình ảnh ẩn dụ “sinh ra” của động từ Hy Lạp, đồng thời đây cũng là cách nói tự nhiên trong tiếng Việt về việc gây nên một kết quả.
- source_word: μάχας
  choice: những cuộc cãi vã
  rationale: Trong văn cảnh lời nói và tranh luận, từ này chỉ các cuộc xung đột hoặc cãi cọ hơn là đánh nhau bằng thể chất.
- source_word: δὲ
  choice: Nhưng
  rationale: Biểu thị sự tương phản nhẹ với lời khuyên ngay trước đó.
theological_decisions:
- issue: Phạm vi của lời cấm đối với ζητήσεις
  choice: Dịch là “những cuộc tranh luận” và bổ nghĩa bằng “ngu dại và thiếu hiểu biết”.
  alternative: Dịch chung là “các câu hỏi” hoặc “sự tìm hiểu”.
  rationale: Nguyên văn không lên án mọi câu hỏi hay mọi việc tìm hiểu, mà chỉ những ζητήσεις mang các đặc tính μωράς và ἀπαιδεύτους, vốn dẫn đến cãi vã. Cách dịch này tránh biến câu thành lệnh cấm điều tra chân thành.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ mệnh lệnh trực tiếp và quan hệ nguyên nhân của nguyên văn; không thêm đại từ xưng hô vốn không xuất hiện rõ trong câu Hy Lạp.
