id: 2TI.2.4
reference: 2 Timothy 2:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: vi
  text: Không ai đang phục vụ trong quân ngũ vướng vào những công việc của đời thường[a], để làm hài lòng người đã tuyển mộ mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các hoạt động dân sự.” Tiếng Hy Lạp diễn tả việc phục vụ trong quân ngũ trong thế tương phản với những công việc của đời sống thường nhật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Không ai
  rationale: Đại từ phủ định mang nghĩa phổ quát; cách diễn đạt tự nhiên, hiện đại và không thêm sắc thái giới tính.
- source_word: στρατευόμενος
  choice: đang phục vụ trong quân ngũ
  rationale: Diễn đạt hành động phục vụ quân đội đang tiếp diễn, giữ nguyên hình ảnh quân sự và tránh lối nói cổ.
- source_word: ἐμπλέκεται
  choice: vướng bận
  rationale: Giữ ý bị cuốn hoặc mắc vào điều làm cản trở sự chuyên tâm; tự nhiên hơn trong tiếng Việt so với cách dịch quá sát như “bị quấn vào”.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: vào những công việc của đời thường
  rationale: πραγματείαις chỉ các công việc, hoạt động hay chuyện làm ăn; βίος ở đây nói đến đời sống thường nhật. Cụm từ giữ được sự đối lập với quân ngũ mà không thu hẹp nghĩa quá mức.
- source_word: ἵνα
  choice: để
  rationale: Đánh dấu mục đích một cách gọn và tự nhiên trong tiếng Việt.
- source_word: τῷ στρατολογήσαντι
  choice: người đã tuyển mình vào quân ngũ
  rationale: Phân từ στρατολογήσαντι nói đến người tuyển mộ hoặc ghi danh người lính; không hàm ý một cấp bậc quân sự cụ thể.
- source_word: ἀρέσῃ
  choice: làm hài lòng
  rationale: Truyền đạt rõ mục đích của người lính là khiến người tuyển mình hài lòng, phù hợp với thể giả định sau ἵνα.
theological_decisions:
- issue: Phạm vi của hình ảnh quân sự
  choice: Giữ nguyên hình ảnh người đang phục vụ trong quân ngũ tránh vướng bận công việc đời thường để làm hài lòng người đã tuyển mình.
  alternative: Diễn giải trực tiếp thành lời khuyên người phục vụ Chúa phải tránh mọi việc thế tục.
  rationale: Nguyên văn nêu một hình ảnh quân sự để phục vụ lời khuyên trong ngữ cảnh; bản dịch không nên giải nghĩa ứng dụng thần học ngay trong câu hoặc biến sự đối lập thành sự lên án đời sống thường nhật.
- issue: Ý nghĩa của ταῖς τοῦ βίου πραγματείαις
  choice: những công việc của đời thường
  alternative: các hoạt động dân sự
  rationale: Cách chọn chính phản ánh trực tiếp hơn phạm vi nghĩa của βίος và πραγματεία, còn cách dịch “hoạt động dân sự” làm nổi bật hơn sự tương phản quân sự nhưng có phần diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Phục vụ trong quân ngũ” duy trì ẩn dụ quân sự; “vướng bận” truyền đạt sự mắc vào những việc gây phân tâm mà không ngụ ý rằng mọi công việc đời thường tự nó là sai.
