  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: vi
  text: Người nông dân làm lụng vất vả phải là người đầu tiên được hưởng phần hoa lợi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Người nông dân làm lụng vất vả phải là người đầu tiên dự phần vào hoa lợi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: làm lụng vất vả
  rationale: Phân từ của κοπιάω chỉ sự lao động khó nhọc, tận lực. Cụm này tự nhiên trong tiếng Việt hiện đại và giữ được trọng tâm về công sức.
- source_word: γεωργὸν
  choice: người nông dân
  rationale: γεωργός là người canh tác đất; “người nông dân” là cách gọi rõ ràng, thông dụng và phù hợp ngữ cảnh.
- source_word: δεῖ
  choice: phải
  rationale: δεῖ diễn tả sự cần thiết hoặc bổn phận; “phải” giữ được lực nghĩa ngắn gọn.
- source_word: πρῶτον
  choice: là người đầu tiên
  rationale: Cách diễn đạt này gắn πρῶτον với việc hưởng phần hoa lợi, thể hiện sự ưu tiên trong việc được hưởng, thay vì hiểu rằng người ấy phải lao động trước rồi mới ăn.
- source_word: τῶν καρπῶν
  choice: hoa lợi
  rationale: Trong ngữ cảnh nông nghiệp, καρποί chỉ sản vật hay thành quả thu được từ canh tác. “Hoa lợi” bao quát hơn “trái cây” và tự nhiên trong mệnh đề mang tính nguyên tắc.
- source_word: μεταλαμβάνειν
  choice: được hưởng phần
  rationale: μεταλαμβάνω cùng sở hữu cách bộ phận mang nghĩa dự phần hoặc nhận một phần. “Được hưởng phần” diễn đạt rõ ý tham dự vào thành quả lao động.
theological_decisions:
- issue: Ý nghĩa của mệnh đề mang tính châm ngôn
  choice: Người lao động phải được ưu tiên dự phần vào thành quả lao động của mình.
  alternative: Người nông dân trước hết phải lao động rồi mới được hưởng hoa lợi.
  rationale: Cú pháp và trật tự từ Hy Lạp tự nhiên hơn khi πρῶτον bổ nghĩa cho μεταλαμβάνειν, nhấn mạnh thứ tự ưu tiên trong việc hưởng hoa lợi chứ không chỉ trình tự lao động rồi ăn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Làm lụng vất vả” giữ sắc thái lao nhọc; “hoa lợi” phù hợp hình ảnh canh tác và tránh thu hẹp καρποί thành riêng trái cây.
