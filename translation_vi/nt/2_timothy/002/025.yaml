source:
  edition: SBLGNT
  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: vi
  text: sửa dạy những người chống đối với lòng dịu dàng, may ra[a] Đức Chúa Trời ban cho họ sự ăn năn dẫn đến sự nhận biết chân lý,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “có lẽ Đức Chúa Trời ban cho họ sự ăn năn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: lấy lòng dịu dàng
  rationale: Cụm giới từ chỉ cách thức. Cách diễn đạt này tự nhiên trong tiếng Việt, truyền đạt sự ôn hòa có sức mạnh chứ không gợi sự yếu đuối.
- source_word: παιδεύοντα
  choice: sửa dạy
  rationale: Trong ngữ cảnh người phục vụ Chúa đối diện người chống đối, động từ nói đến việc dạy dỗ nhằm uốn nắn, không chủ yếu là trừng phạt. “Sửa dạy” giữ được cả ý sửa sai lẫn giáo huấn.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: những người chống đối
  rationale: Phân từ chỉ những người đặt mình vào thế đối nghịch. Nguyên văn không nêu rõ đối tượng họ chống lại, nên bản dịch không thêm đại từ “mình/người” và giữ sự hàm ý theo ngữ cảnh.
- source_word: μήποτε
  choice: may ra
  rationale: Kết hợp với động từ giả định, từ này biểu đạt khả năng dè dặt. “May ra” tự nhiên trong tiếng Việt và không biến khả năng ấy thành điều chắc chắn.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: Đức Chúa Trời ban cho họ
  rationale: δίδωμι ở đây mang nghĩa ban cho; chủ thể thần linh được giữ rõ. Tính khả hữu của động từ giả định được chuyển tải qua “may ra” ở đầu mệnh đề.
- source_word: μετάνοιαν
  choice: sự ăn năn
  rationale: Đây là thuật ngữ tiếng Việt quen thuộc, bao hàm sự thay đổi tâm trí và quay hướng, không thu hẹp thành một thay đổi nhận thức thuần túy.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: để nhận biết chân lý
  rationale: εἰς biểu thị mục tiêu hoặc kết quả; “để” giữ được độ mở giữa hai sắc thái ấy. “Nhận biết” diễn đạt sự nhận thức đầy đủ hơn kiến thức thông thường, còn “chân lý” là cách nói tự nhiên, trang trọng cho ἀλήθεια.
theological_decisions:
- issue: Tác động của Đức Chúa Trời và sự ăn năn của con người
  choice: Giữ rõ Đức Chúa Trời là Đấng có thể ban sự ăn năn, đồng thời dùng “may ra” để bảo toàn tính khả hữu trong câu.
  alternative: Diễn đạt theo hướng tất định mạnh hơn, hoặc làm nhẹ vai trò chủ động của Đức Chúa Trời.
  rationale: Nguyên văn nêu Đức Chúa Trời là chủ thể ban sự ăn năn nhưng không giải thích toàn bộ mối quan hệ giữa quyền tể trị thần linh và đáp ứng của con người; bản dịch không giải quyết thay cho câu Kinh Thánh.
- issue: Quan hệ của εἰς với sự nhận biết chân lý
  choice: Dùng “để nhận biết chân lý”, có thể chỉ mục tiêu hoặc kết quả của sự ăn năn.
  alternative: “dẫn đến sự nhận biết chân lý”, nhấn mạnh kết quả rõ hơn.
  rationale: Giới từ εἰς cho phép sắc thái mục tiêu hoặc kết quả; cách dịch được chọn giữ được sự linh hoạt ấy và tự nhiên hơn trong tiếng Việt.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Sửa dạy” giữ sắc thái giáo huấn có tính uốn nắn; “lòng dịu dàng” tránh sắc thái nhu nhược. Không thêm đối tượng cho “chống đối” vì nguyên văn không nêu trực tiếp.
