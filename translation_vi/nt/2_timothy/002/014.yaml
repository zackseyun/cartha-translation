id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: vi
  text: Hãy tiếp tục nhắc họ về những điều này và long trọng căn dặn họ trước mặt Chúa[a] rằng đừng tranh cãi về lời lẽ; việc ấy chẳng đem lại ích lợi gì[b], mà chỉ dẫn đến sự hủy hoại những người nghe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Trước mặt Chúa” nói đến sự chứng giám thiêng liêng; trong câu này, từ “Chúa” không xác định rõ là chỉ riêng Chúa Giê-su hay nói rộng hơn về Đức Chúa Trời.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “hoàn toàn vô ích.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: những điều này
  rationale: Đại từ chỉ định trung tính số nhiều, quy chiếu về những lời dạy ngay trước đó; cách dịch này giữ nguyên lực hồi chỉ và số nhiều.
- source_word: ὑπομίμνῃσκε
  choice: Hãy tiếp tục nhắc
  rationale: Mệnh lệnh hiện tại diễn tả hành động tiếp diễn hoặc lặp lại; “tiếp tục nhắc” thể hiện sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: διαμαρτυρόμενος
  choice: long trọng căn dặn họ
  rationale: Phân từ mang ý nghĩa khẩn thiết, nghiêm trang và có tính ràng buộc. Đại từ “họ” được bổ sung theo ngữ cảnh, chỉ cùng những người được nhắc nhở.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: trước mặt Chúa
  rationale: Giữ thành ngữ chỉ việc nói dưới sự chứng giám của Đấng thiêng liêng, đồng thời không thu hẹp đối tượng của κύριος hơn mức bản văn cho phép.
- source_word: μὴ λογομαχεῖν
  choice: đừng tranh cãi về lời lẽ
  rationale: Động từ nói đến việc đôi co hoặc đấu khẩu về từ ngữ; cách diễn đạt này tự nhiên và giữ sắc thái chê trách.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: việc ấy chẳng đem lại ích lợi gì
  rationale: Cụm từ nhấn mạnh sự hoàn toàn vô ích. “Việc ấy” nối rõ cụm này với hành vi tranh cãi về lời lẽ mà không thay đổi ý nghĩa.
- source_word: ἐπὶ καταστροφῇ
  choice: chỉ dẫn đến sự hủy hoại
  rationale: Giới từ ở đây diễn tả kết quả tai hại; “hủy hoại” giữ được mức độ nghiêm trọng của καταστροφή, còn “chỉ” làm nổi bật sự tương phản với việc không đem lại lợi ích.
- source_word: τῶν ἀκουόντων
  choice: những người nghe
  rationale: Phân từ hiện tại được dùng như danh từ; cách dịch này đơn giản, rộng nghĩa và tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là κύριος
  choice: Chúa
  alternative: Đức Chúa Trời; Chúa Giê-su
  rationale: Bản Hy Lạp chỉ ghi “Chúa” và không xác định rõ hơn. Cách dịch này bảo tồn sự mơ hồ có thật, không tự ý đồng nhất tước hiệu ở đây riêng với Đức Chúa Trời hay Chúa Giê-su.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Dùng “long trọng căn dặn” để giữ sức nặng mục vụ của lời khuyến cáo; tránh thuật ngữ giáo phái và giữ nguyên sự không xác định của κύριος.
