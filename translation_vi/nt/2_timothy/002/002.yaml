language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: vi
  text: Những điều con đã nghe từ ta trước mặt nhiều nhân chứng[a], hãy giao phó cho những người trung tín[b], là những người sẽ có khả năng dạy dỗ người khác nữa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “qua nhiều nhân chứng.” Cụm từ Hy Lạp nhiều khả năng nói đến việc lời dạy của Phao-lô được truyền đạt công khai khi có nhiều nhân chứng hiện diện; ít có khả năng hơn, nó có thể được hiểu là “qua nhiều nhân chứng.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cụm từ Hy Lạp có hình thức giống đực số nhiều: “những người nam trung tín.” Hình thức này có thể được dùng theo nghĩa đại diện; cũng có thể hiểu là “những người trung tín” hoặc “những người đáng tin cậy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ ἤκουσας παρ’ ἐμοῦ
  choice: những điều con đã nghe nơi ta
  rationale: Diễn đạt tự nhiên nội dung Ti-mô-thê đã tiếp nhận từ Phao-lô; “nơi ta” giữ sắc thái nguồn của παρά với sở hữu cách.
- source_word: διὰ πολλῶν μαρτύρων
  choice: trước mặt nhiều nhân chứng
  rationale: διά với sở hữu cách ở đây nhiều khả năng chỉ hoàn cảnh có nhiều nhân chứng hiện diện, đồng thời chú thích giữ lại khả năng hiểu theo nghĩa trung gian.
- source_word: παράθου
  choice: hãy giao phó
  rationale: Mệnh lệnh mang ý trao điều quý giá cho người khác gìn giữ và tiếp tục truyền đạt.
- source_word: πιστοῖς ἀνθρώποις
  choice: những người trung tín
  rationale: “Người” là cách dịch thông dụng của ἄνθρωποι trong tiếng Việt và không buộc xác định giới tính; “trung tín” giữ được cả nét đáng tin cậy lẫn sắc thái đức tin có thể có của πιστός.
- source_word: ἱκανοὶ ἔσονται
  choice: sẽ có khả năng
  rationale: Giữ thì tương lai và diễn đạt sự đủ năng lực để đảm nhận việc dạy dỗ.
- source_word: καὶ ἑτέρους διδάξαι
  choice: cũng ... dạy người khác
  rationale: καί được hiểu là “cũng”, còn ἑτέρους chỉ những người khác trong chuỗi truyền dạy.
theological_decisions:
- issue: Phạm vi giới tính của πιστοῖς ἀνθρώποις
  choice: những người trung tín
  alternative: những người nam trung tín
  rationale: ἄνθρωπος có thể chỉ con người nói chung dù hình thái ở đây là giống đực số nhiều. Tiếng Việt dùng “người” tự nhiên và giữ được tính đại diện, không tự ý thu hẹp đối tượng; chú thích nêu rõ hình thái Hy Lạp.
- issue: Ý nghĩa của διὰ πολλῶν μαρτύρων
  choice: trước mặt nhiều nhân chứng
  alternative: qua nhiều nhân chứng
  rationale: Ngữ cảnh phù hợp hơn với việc lời dạy của Phao-lô được nghe công khai khi có nhiều nhân chứng hiện diện; tuy nhiên cấu trúc Hy Lạp vẫn có thể được hiểu theo nghĩa phương tiện, nên không loại bỏ phương án ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cách xưng hô “ta—con” phù hợp quan hệ Phao-lô với Ti-mô-thê trong thư tín mục vụ; dùng “giao phó” để thể hiện trách nhiệm gìn giữ và truyền dạy.
