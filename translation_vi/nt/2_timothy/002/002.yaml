  - severity: low
    issue: “Còn” mở đầu câu
    rationale: καί ở đây nối tiếp mạch khuyên bảo, không biểu thị đối lập. Bỏ “Còn” tránh thêm sắc thái không cần thiết.
  - severity: low
    issue: Ghi chú a chưa nêu rõ tính thứ yếu của cách hiểu “qua nhiều nhân chứng”
    rationale: Để phản ánh hồ sơ tiếng Anh và giữ đúng mức độ bất định của διά + sở hữu cách, chú thích nên nói đây là cách hiểu ít khả dĩ hơn, trong khi không loại bỏ nó.
