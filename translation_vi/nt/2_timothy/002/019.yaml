id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: vi
  text: 'Tuy vậy, nền móng vững chắc của Đức Chúa Trời vẫn đứng vững, mang dấu ấn này[a]: “Chúa biết những người thuộc về Ngài,” và: “Mọi người xưng danh Chúa[b] hãy lìa khỏi sự bất chính.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “mang lời khắc này.” Từ được dịch là “dấu ấn” có thể chỉ dấu xác nhận hoặc những lời được khắc trên một con dấu.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “kêu cầu danh Chúa.” Nguyên văn nói sát chữ là “gọi tên của Chúa,” một cách diễn đạt có thể chỉ việc kêu cầu Ngài hoặc công khai nhận mình thuộc về Ngài.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Tuy vậy
  rationale: Diễn tả rõ sự tương phản mạnh với phần nói trước về sự dạy dỗ sai lạc, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: στερεὸς θεμέλιος
  choice: nền móng vững chắc
  rationale: Giữ nguyên hình ảnh nền móng và nhấn mạnh tính ổn định, bền vững của nó.
- source_word: τοῦ θεοῦ
  choice: của Đức Chúa Trời
  rationale: Giữ quan hệ sở hữu hoặc nguồn gốc của nguyên ngữ mà không thu hẹp cách hiểu.
- source_word: ἕστηκεν
  choice: vẫn đứng vững
  rationale: Diễn đạt trạng thái bền vững phát sinh từ thì hoàn thành Hy Lạp, đồng thời làm rõ sức nặng của sự tương phản.
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: mang dấu ấn này
  rationale: Giữ hình ảnh một dấu xác nhận hoặc nhận diện; chú thích nêu khả năng dấu ấy mang lời khắc.
- source_word: Ἔγνω
  choice: biết
  rationale: Trong lời trích dẫn, động từ quá khứ có giá trị xác quyết lâu dài; hiện tại tiếng Việt truyền đạt tự nhiên sự nhận biết bền vững của Chúa.
- source_word: κύριος
  choice: Chúa
  rationale: Giữ danh xưng trang trọng và không xác định thêm đối tượng quy chiếu ngoài điều nguyên văn nói.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: những người thuộc về Ngài
  rationale: Diễn đạt rõ quan hệ thuộc về mà không thêm một định nghĩa thần học cụ thể.
- source_word: Ἀποστήτω
  choice: hãy lìa khỏi
  rationale: Thể hiện mệnh lệnh dứt khoát phải tách khỏi điều sai trái.
- source_word: ἀπὸ ἀδικίας
  choice: khỏi sự bất chính
  rationale: Giữ phạm vi đạo đức rộng của ἀδικία, bao gồm sự sai trái, bất công và không công chính.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: mọi người xưng danh Chúa
  rationale: “Xưng danh” vừa tự nhiên hơn lối lặp sát chữ “gọi tên của Chúa,” vừa giữ được ý công khai nhận hoặc viện đến danh Chúa; cách hiểu “kêu cầu danh” được ghi ở chú thích.
theological_decisions:
- issue: Đối tượng được gọi là “Chúa” trong hai lời ghi trên dấu ấn
  choice: Giữ nguyên danh xưng “Chúa” ở cả hai vế, không xác định đó là Đức Chúa Cha hay Đấng Christ.
  alternative: Hiểu cả hai lần là Đức Chúa Cha; hiểu cả hai lần là Đấng Christ; hoặc phân biệt đối tượng giữa hai vế.
  rationale: Nguyên văn dùng κύριος mà không giải thích thêm. Những lời này có nền tảng Kinh Thánh và được áp dụng trong bối cảnh Cơ Đốc, nên bản dịch cần giữ nguyên độ mở và sức nặng thần học ấy.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, dùng các cụm quen thuộc “nền móng vững chắc,” “dấu ấn,” “xưng danh” và “lìa khỏi.” Cấu trúc hai lời trích được giữ cân đối; danh xưng “Chúa” không bị diễn giải vượt quá nguyên văn.
