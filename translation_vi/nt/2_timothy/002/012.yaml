source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: vi
  text: Nếu chúng ta kiên trì chịu đựng, chúng ta cũng sẽ cùng trị vì với Người; nếu chúng ta chối bỏ Người, Người cũng sẽ chối bỏ chúng ta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “nếu chúng ta không nhìn nhận Người, Người cũng sẽ không nhìn nhận chúng ta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: kiên trì chịu đựng
  rationale: Động từ diễn tả sự bền lòng trước thử thách hoặc đau khổ. Cụm này vừa tự nhiên trong tiếng Việt vừa giữ được cả ý kiên trì lẫn chịu đựng.
- source_word: συμβασιλεύσομεν
  choice: sẽ cùng trị vì với Người
  rationale: Động từ ghép mang nghĩa cùng làm vua hoặc cùng trị vì. “Trị vì” giữ hình ảnh vương quyền rõ hơn “cai trị”; “với Người” nêu đối tượng được hàm ý từ ngữ cảnh.
- source_word: ἀρνησόμεθα
  choice: chối bỏ Người
  rationale: ἀρνέομαι có thể chỉ việc phủ nhận hoặc từ bỏ quan hệ với một người. “Chối bỏ” tự nhiên, nghiêm trọng, và cho phép lặp lại cùng một từ ở mệnh đề kế tiếp.
- source_word: κἀκεῖνος
  choice: Người cũng
  rationale: Dạng rút gọn của καὶ ἐκεῖνος diễn tả sự tương ứng đáp lại. “Người cũng” giữ cấu trúc song song mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἀρνήσεται ἡμᾶς
  choice: sẽ chối bỏ chúng ta
  rationale: Lặp lại “chối bỏ” để bảo toàn phép lặp có chủ ý của ἀρνέομαι và sức nặng của lời cảnh báo.
theological_decisions:
- issue: Bản chất lời cảnh báo trong mệnh đề điều kiện thứ hai
  choice: 'Dịch thẳng như một lời cảnh báo thực sự: “nếu chúng ta chối bỏ Người, Người cũng sẽ chối bỏ chúng ta.”'
  alternative: Giải thích là chỉ mất phần thưởng, hoặc xem đây là giả định không có sức nặng hiện thực.
  rationale: Câu Hy Lạp đặt hai mệnh đề điều kiện cân xứng và gần với truyền thống lời cảnh báo của Chúa Giê-su. Bản dịch giữ nguyên mức độ nghiêm trọng và sự căng thẳng thần học, không tự quyết định tranh luận về sự bội đạo, lòng bền đỗ hay phần thưởng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Người” để chỉ Đấng Christ trong ngữ cảnh, tránh khẩu khí cổ; nhịp câu song song được giữ rõ. Dấu chú thích [a] đặt sau toàn bộ cặp mệnh đề vì phương án từ vựng áp dụng cho cả hai lần xuất hiện của ἀρνέομαι.
