  rationale: Chỉ điều chỉnh chú thích từ vựng để phương án thay thế phản ánh đúng hơn ἀρνέομαι trong cả hai lần xuất hiện. Văn bản chính được giữ nguyên vì trung thành với nguyên văn và tự nhiên trong tiếng Việt hiện đại.
