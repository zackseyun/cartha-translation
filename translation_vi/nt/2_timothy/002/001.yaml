  terminology: “Ân điển,” “Đấng Mê-si-a,” và “Giê-su” phù hợp với thuật ngữ của bản dịch và với lực tước hiệu của Χριστός. Chú thích truyền thống nên neo ngay sau “Đấng Mê-si-a,” là yếu tố mà chú thích giải thích.
