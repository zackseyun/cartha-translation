id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: vi
  text: Vậy, còn con, con của ta, hãy được thêm sức[a] trong ân điển trong Đấng Mê-si-a[b] Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hãy mạnh mẽ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Theo cách gọi truyền thống: “Đấng Christ Giê-su.” Từ Hy Lạp Χριστός là tước hiệu có nghĩa là “Đấng được xức dầu,” tức “Đấng Mê-si-a.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ οὖν
  choice: Vậy, … con hãy
  rationale: “Vậy” giữ chức năng suy luận/chuyển tiếp của οὖν. Đại từ “con” được nêu rõ để phản ánh sắc thái nhấn mạnh của Σὺ, đồng thời phù hợp với quan hệ thân tình trong câu.
- source_word: τέκνον μου
  choice: con của ta
  rationale: τέκνον có nghĩa cơ bản là “con”, không nhất thiết chỉ riêng con trai. Cách dịch này giữ được giọng trìu mến của người cha thuộc linh mà không thu hẹp nghĩa theo giới tính.
- source_word: ἐνδυναμοῦ
  choice: hãy được thêm sức
  rationale: Thể mệnh lệnh hiện tại trung động/bị động có thể diễn tả việc tiếp nhận sức mạnh. “Được thêm sức” tự nhiên trong tiếng Việt và tránh hàm ý rằng Ti-mô-thê phải tự tạo ra sức mạnh cho mình.
- source_word: ἐν τῇ χάριτι
  choice: trong ân điển
  rationale: Giữ giới từ “trong” để không loại bỏ sự chồng lấn giữa ý nghĩa phạm vi và phương tiện của ἐν. “Ân điển” là cách dịch trang trọng, quen thuộc của χάρις trong văn cảnh Phao-lô.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: ở trong Đấng Mê-si-a Giê-su
  rationale: Cụm thuộc tính xác định ân điển này là ân điển hiện hữu trong hoặc gắn liền với Đấng Mê-si-a Giê-su. “Ở trong” giữ sát cấu trúc và tính mở của nguyên văn.
- source_word: Χριστῷ
  choice: Đấng Mê-si-a
  rationale: Χριστός vốn là tước hiệu chỉ Đấng được xức dầu; “Đấng Mê-si-a” chuyển tải ý nghĩa tước hiệu thay vì chỉ phiên âm theo truyền thống.
- source_word: Ἰησοῦ
  choice: Giê-su
  rationale: Dùng dạng tên riêng phổ biến trong tiếng Việt.
theological_decisions:
- issue: Thể và tác nhân của ἐνδυναμοῦ
  choice: “hãy được thêm sức”, nhấn mạnh sức mạnh được tiếp nhận
  alternative: “hãy mạnh mẽ” hoặc “hãy tự làm cho mình mạnh mẽ”
  rationale: Hình thái trung động/bị động và cụm tiếp theo “trong ân điển” hỗ trợ sắc thái tiếp nhận, nhưng chú thích vẫn ghi nhận cách dịch chủ động, cô đọng hơn.
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a Giê-su
  alternative: Đấng Christ Giê-su
  rationale: Giữ nội dung của tước hiệu Hy Lạp là “Đấng được xức dầu”, đồng thời chú thích dạng truyền thống để người đọc nhận biết tương đương.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Việc lặp “con” trong “con của ta, con hãy” là tự nhiên trong lời khuyên trực tiếp bằng tiếng Việt, đồng thời giúp bảo toàn đại từ nhấn mạnh Σὺ. Dấu câu kết thúc câu được dùng thay cho dấu phẩy của trích đoạn vì đây là một câu trọn vẹn.
