  to: Vậy, còn con, con của ta, hãy được thêm sức[a] trong ân điển trong Đấng Mê-si-a[b] Giê-su.
  rationale: Bản sửa giữ nguyên nghĩa và tính mở của nguyên văn, nhưng cải thiện nhịp câu tiếng Việt bằng cách biểu thị đại từ nhấn mạnh Σὺ qua “còn con” và bỏ sự lặp đại từ không tự nhiên trong mệnh lệnh. Cụm bổ nghĩa “trong Đấng Mê-si-a Giê-su” được đặt trực tiếp sau “ân điển”; cách này tự nhiên hơn “trong ân điển ở trong” mà vẫn phản ánh τῇ ἐν Χριστῷ Ἰησοῦ. Các ký hiệu chú thích được đặt sát đơn vị từ vựng tương ứng.
