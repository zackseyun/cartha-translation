  text: và lời họ nói[a] sẽ lan ra[b] như chứng hoại thư. Trong số họ có Hy-mê-nê và Phi-lết,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lời của họ” hoặc “thông điệp của họ”.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “sẽ có chỗ kiếm ăn” hoặc “sẽ có đường tiến”; trong ngữ cảnh, ý nói sẽ lan rộng và gây hủy hoại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: lời họ nói
  rationale: Trong mạch văn về những lời huyên thuyên bất kính và sự dạy dỗ sai lạc, cụm này chỉ điều họ nói ra chứ không phải một từ riêng lẻ. “Lời họ nói” tự nhiên trong tiếng Việt và vẫn giữ được nghĩa rộng của λόγος.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ sở hữu ở dạng thuộc cách, gắn với λόγος; tiếng Việt diễn đạt tự nhiên bằng “lời họ nói”.
- source_word: ὡς γάγγραινα
  choice: như chứng hoại thư
  rationale: γάγγραινα chỉ bệnh hoại thư, tạo hình ảnh về sự hủy hoại lan rộng. “Chứng hoại thư” chính xác hơn cách diễn giải thành “ung thư”.
- source_word: νομὴν ἕξει
  choice: sẽ lan ra
  rationale: Thành ngữ có nghĩa đen gần với việc “có chỗ ăn lan/đường tiến”, nhưng khi đi với hình ảnh hoại thư thì diễn tả sự lan rộng có tính hủy hoại. “Sẽ lan ra” rõ ràng và tự nhiên.
- source_word: ὧν ἐστιν
  choice: Trong số đó có
  rationale: Cấu trúc quan hệ mang nghĩa phân chia, nêu hai người thuộc nhóm vừa được nhắc đến.
- source_word: Ὑμέναιος
  choice: Hy-mê-nê
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
- source_word: Φίλητος
  choice: Phi-lết
  rationale: Phiên âm tên riêng theo lối quen thuộc và dễ đọc trong tiếng Việt.
theological_decisions:
- issue: Sức gợi của hình ảnh bệnh hoại thư
  choice: Diễn tả lời dạy sai lạc như một thứ lan rộng và gây hủy hoại
  alternative: Dịch sát thành ngữ νομὴν ἕξει theo hình ảnh “có chỗ ăn lan” hoặc “có đường tiến”
  rationale: “Sẽ lan ra như chứng hoại thư” giữ nguyên hình ảnh y khoa và lời cảnh báo của Phao-lô, nhưng không bổ sung một kết luận thần học vượt quá câu văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ liên từ mở đầu “và” cùng dấu phẩy cuối câu để phản ánh việc câu này nối với văn cảnh hai phía. Các dấu chú thích [a], [b] đều được đặt ngay sau phần từ ngữ liên quan.
