  terminology: “Hoại thư” là tương đương trực tiếp, không diễn giải thành “ung thư”. Các tên “Hy-mê-nê” và “Phi-lết” phù hợp lối phiên âm Kinh Thánh Việt ngữ quen thuộc. Không có vấn đề thuật ngữ thần học cần điều chỉnh.
