review_pass:
  verdict: revise
  source_fidelity: Bản dịch chuyển tải đúng λόγος αὐτῶν là điều họ nói, hình ảnh γάγγραινα là hoại thư, và nghĩa thành ngữ của νομὴν ἕξει là sự lan rộng. Tuy nhiên, chú thích [b] giải thích νομὴν ἕξει nhưng hiện lại được neo sau “chứng hoại thư”, tức từ γάγγραινα, nên cần dời neo chú thích. “Trong số họ” phản ánh rõ hơn nhóm người được mệnh đề ὧν ἐστιν xác định.
