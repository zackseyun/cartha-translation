source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: vi
  text: và họ có thể tỉnh ngộ, thoát khỏi cạm bẫy của ma quỷ, vốn đã bị nó bắt sống[b] để làm theo ý muốn của nó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “vốn đã bị nó bắt giữ để làm theo ý muốn của Đấng ấy.” Một số người hiểu “Đấng ấy” không phải chỉ ma quỷ mà là chỉ Đức Chúa Trời.'
    reason: alternative_reading
  - marker: b
    text: Động từ Hy Lạp có nghĩa cụ thể là “bắt sống”; cũng có thể dịch khái quát hơn là “bắt giữ” hoặc “bắt làm tù binh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: tỉnh ngộ
  rationale: Động từ chỉ việc tỉnh lại, lấy lại sự sáng suốt. “Tỉnh ngộ” diễn đạt tự nhiên sự phục hồi nhận thức sau khi bị lừa dối.
- source_word: παγίδος
  choice: cạm bẫy
  rationale: Diễn đạt rõ hình ảnh một phương tiện dùng để bẫy bắt; tự nhiên trong tiếng Việt hiện đại.
- source_word: διαβόλου
  choice: ma quỷ
  rationale: Trong ngữ cảnh này, từ này là danh xưng chỉ nhân vật đối nghịch, tương ứng với cách gọi thông dụng “ma quỷ” trong tiếng Việt.
- source_word: ἐζωγρημένοι
  choice: sau khi đã bị ... bắt sống
  rationale: 'Giữ nét nghĩa cụ thể của ζωγρέω là bắt giữ mà để sống, đồng thời phản ánh thể hoàn thành bị động: họ đang ở trong tình trạng do việc bị bắt trước đó gây nên.'
- source_word: ὑπ’ αὐτοῦ
  choice: bị nó
  rationale: Đại từ gần nhất quy chiếu tự nhiên về “ma quỷ”; dùng “nó” tránh lặp lại danh từ và phù hợp khi nói về ma quỷ.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: để phục vụ ý muốn của nó
  rationale: Diễn đạt đích hướng đến của εἰς theo tiếng Việt tự nhiên mà không thu hẹp thành một hành động riêng lẻ. Đại từ ἐκείνου được hiểu theo tiền ngữ gần nhất là ma quỷ, nhưng sự nhập nhằng được ghi chú.
theological_decisions:
- issue: Đối tượng được ἐκείνου quy chiếu trong εἰς τὸ ἐκείνου θέλημα
  choice: 'Hiểu là ma quỷ: “ý muốn của nó.”'
  alternative: Có thể hiểu ἐκείνου là Đức Chúa Trời, tức họ được giải thoát để hướng đến hoặc thực hiện ý muốn của Ngài.
  rationale: “Ma quỷ” là tiền ngữ gần nhất và cách quy chiếu này nối tiếp tự nhiên hình ảnh bị nó bắt giữ. Tuy nhiên, cấu trúc Hy Lạp không loại bỏ hoàn toàn cách hiểu quy chiếu về Đức Chúa Trời, nên giữ cách hiểu ấy trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tỉnh ngộ” giữ ẩn dụ tỉnh lại về nhận thức; “cạm bẫy” rõ nghĩa hơn cách nói cổ. Dùng “nó” cho ma quỷ và “Đấng ấy/Ngài” cho Đức Chúa Trời trong chú thích để phân biệt hai khả năng quy chiếu.
