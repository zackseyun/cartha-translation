  rationale: Sửa an toàn nhằm phản ánh rõ hơn tình trạng do hành động đã hoàn tất của phân từ hoàn thành bị động, giảm sắc thái diễn giải trong động từ “phục vụ”, và sửa lỗi ngữ pháp/nghĩa trong chú thích về đại từ ἐκείνου. Vẫn giữ cách hiểu chính rằng đại từ này chỉ ma quỷ, đồng thời bảo tồn minh bạch cách hiểu thay thế rằng đại từ chỉ Đức Chúa Trời.
