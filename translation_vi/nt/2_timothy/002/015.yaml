id: 2TI.2.15
reference: 2 Timothy 2:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: vi
  text: Hãy hết sức cố gắng để trình diện mình trước Đức Chúa Trời như một người đã được chấp thuận, một người làm công không có gì phải hổ thẹn, xử lý lời chân lý cách đúng đắn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dạy lời chân lý cách chính xác”; sát nghĩa đen: “cắt thẳng lời chân lý.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Hãy chuyên tâm
  rationale: Diễn đạt mệnh lệnh phải nỗ lực nghiêm túc và chuyên cần; tự nhiên hơn lối nói khẩu ngữ “hãy cố hết sức” mà vẫn giữ được sức nặng của động từ.
- source_word: σεαυτὸν ... παραστῆσαι
  choice: để trình diện chính mình
  rationale: Giữ quan hệ giữa đại từ phản thân và động từ, đồng thời truyền đạt ý đặt chính mình trước mặt Đức Chúa Trời để được xem xét hoặc phục vụ.
- source_word: δόκιμον
  choice: như người đã được chấp thuận
  rationale: Nêu rõ tư cách của người đã qua sự xem xét và được công nhận, không thêm chi tiết “đã được thử nghiệm” vốn chỉ hàm ẩn trong từ Hy Lạp.
- source_word: τῷ θεῷ
  choice: trước Đức Chúa Trời
  rationale: Với παραστῆσαι, cách dịch này diễn đạt tự nhiên sắc thái trình diện trước mặt Đức Chúa Trời, dù hình thức Hy Lạp là tặng cách.
- source_word: ἐργάτην
  choice: một người làm công
  rationale: Giữ hình ảnh nghề nghiệp của nguyên văn bằng cách nói hiện đại, dễ hiểu và không quá cổ.
- source_word: ἀνεπαίσχυντον
  choice: không có gì phải hổ thẹn
  rationale: Diễn đạt việc không có nguyên cớ đáng xấu hổ, thay vì chỉ mô tả cảm xúc chủ quan là “không hổ thẹn”.
- source_word: ὀρθοτομοῦντα
  choice: xử lý đúng đắn
  rationale: Giữ nghĩa rộng là đối đãi chính xác với sứ điệp, không thu hẹp thành riêng việc giảng dạy; hình ảnh sát chữ “cắt thẳng” được bảo lưu trong chú thích.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: lời chân lý
  rationale: Giữ kết cấu sở hữu và âm hưởng thần học của cụm từ Phao-lô dùng, đồng thời vẫn rõ nghĩa trong tiếng Việt hiện đại.
theological_decisions:
- issue: Ý nghĩa của ὀρθοτομοῦντα trong bối cảnh chức vụ
  choice: xử lý đúng đắn lời chân lý
  alternative: 'dạy lời chân lý cách chính xác; sát chữ: cắt thẳng lời chân lý'
  rationale: Bản chính dùng cách diễn đạt đủ rộng để bao gồm việc đối đãi trung tín và chính xác với sứ điệp, không quyết định rằng động từ chỉ nói đến một hoạt động chức vụ duy nhất. Chú thích giữ cả cách hiểu cụ thể hơn và hình ảnh nguyên thủy.
translation_notes:
  register: Văn phong trang trọng, hiện đại và dễ hiểu. “Chuyên tâm” nhấn mạnh nỗ lực nghiêm túc; “người làm công” giữ ẩn dụ lao động; “xử lý đúng đắn” bảo lưu độ rộng và sự căng thẳng diễn giải của động từ hiếm ὀρθοτομέω.
