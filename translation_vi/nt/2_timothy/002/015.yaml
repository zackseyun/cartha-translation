    issue: “Hãy chuyên tâm” chưa chuyển tải đầy đủ lực của σπούδασον.
    rationale: σπουδάζω trong mệnh lệnh này kêu gọi sự sốt sắng, nỗ lực nghiêm túc. “Chuyên tâm” chủ yếu chỉ sự tập trung, trong khi “hãy hết sức cố gắng” biểu đạt trực tiếp hơn ý nỗ lực khẩn thiết.
  - severity: medium
    issue: Cụm “xử lý đúng đắn lời chân lý” chưa tự nhiên về trật tự và kết hợp từ.
    rationale: Trong tiếng Việt, “xử lý” thường cần bổ ngữ cách thức sau tân ngữ, như “xử lý lời chân lý cách đúng đắn.” Bản sửa giữ cách dịch rộng của ὀρθοτομοῦντα thay vì thu hẹp nó chỉ còn việc giảng dạy.
