source:
  edition: SBLGNT
  text: εἰ ἀπιστοῦμεν, ἐκεῖνος πιστὸς μένει· ⸀ἀρνήσασθαι ἑαυτὸν οὐ δύναται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: vi
  text: Nếu chúng ta không trung tín[a], thì Ngài vẫn trung tín[b]; Ngài không thể chối bỏ chính mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không tin” hoặc “bất trung.” Động từ Hy Lạp có thể mang một trong các nghĩa này.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đáng tin cậy.” “Trung tín” được giữ lại để làm rõ thế đối lập với “không trung tín.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: không trung tín
  rationale: Động từ có thể chỉ sự không tin hoặc không trung tín. Cách dịch này giữ được thế đối lập với πιστός và không thu hẹp câu vào một nghĩa duy nhất.
- source_word: πιστὸς
  choice: trung tín
  rationale: “Trung tín” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa giữ được mối liên hệ từ vựng và thế đối lập với ἀπιστοῦμεν; “đáng tin cậy” cũng có thể là một sắc thái nghĩa.
- source_word: μένει
  choice: vẫn
  rationale: Trong kết cấu “vẫn trung tín”, từ này diễn đạt tự nhiên ý tiếp tục và không thay đổi.
- source_word: ἀρνήσασθαι
  choice: chối bỏ
  rationale: Diễn đạt trực tiếp sức nặng quan hệ và đạo đức của ἀρνέομαι; “phủ nhận” có thể quá thiên về mệnh đề hay lời nói.
- source_word: ἑαυτὸν
  choice: chính mình
  rationale: Đại từ phản thân nhấn mạnh rằng sự trung tín của Ngài bắt nguồn từ chính bản tính nhất quán của Ngài.
- source_word: οὐ δύναται
  choice: không thể
  rationale: Cách diễn đạt ngắn gọn, tự nhiên và đúng nghĩa về điều Ngài không có khả năng làm, chứ không chỉ là không muốn làm.
theological_decisions:
- issue: Ý nghĩa sự trung tín của Đức Chúa Trời trước sự bất trung của con người
  choice: Giữ lời khẳng định rằng Ngài vẫn trung tín vì không thể chối bỏ chính mình, nhưng không xác định sự trung tín này chủ yếu nói đến cứu rỗi, giữ lời hứa hay thi hành phán xét.
  alternative: Có thể hiểu là Ngài vẫn trung tín cứu dân Ngài bất chấp sự yếu đuối của họ, hoặc trung tín với mọi lời Ngài đã phán, kể cả lời cảnh báo về sự phán xét.
  rationale: Bản Hy Lạp khẳng định sự nhất quán của Ngài nhưng không giải quyết rõ hệ quả thần học đang được tranh luận; bản dịch cần bảo toàn sức căng ấy.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” để quy chiếu tôn kính đến nhân vật thần linh trong ngữ cảnh; lặp “trung tín” nhằm bảo toàn phép đối lập của nguyên văn.
