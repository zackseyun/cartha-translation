  terminology: “Trung tín” là lựa chọn tốt cho πιστός và “không trung tín” giữ được phép đối lập với ἀπιστοῦμεν. “Chối bỏ chính mình” chuyển tải phù hợp ἀρνήσασθαι ἑαυτόν mà không diễn giải hệ quả thần học.
