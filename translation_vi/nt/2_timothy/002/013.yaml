  source_fidelity: Bản dịch phản ánh đúng điều kiện εἰ, sự đối lập có chủ ý giữa ἀπιστοῦμεν và πιστός qua cụm “không trung tín / trung tín,” và mệnh đề “không thể chối bỏ chính mình.” Tuy nhiên, nguyên văn dùng hai mệnh đề đặt cạnh nhau, không có liên từ nhân quả tương đương “vì”; nên không nên làm rõ quan hệ cú pháp ấy trong bản văn chính.
