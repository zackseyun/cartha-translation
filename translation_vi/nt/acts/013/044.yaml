source:
  edition: SBLGNT
  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: vi
  text: Vào ngày Sa-bát kế tiếp[a], gần như cả thành tụ họp để nghe lời của Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vào ngày Sa-bát sắp đến” hoặc “Vào ngày Sa-bát sau đó.”'
    reason: lexical_alternative
  - marker: b
    text: “Lời của Chúa” cũng có thể được hiểu là “sứ điệp của Chúa” hoặc, theo văn cảnh, “sứ điệp về Chúa.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: Vào ngày Sa-bát kế tiếp
  rationale: Cụm tặng cách có phân từ ἐρχομένῳ mang nghĩa thời gian. “Ngày Sa-bát kế tiếp” tự nhiên trong tiếng Việt và giữ được nghĩa ngày Sa-bát sắp đến hoặc tiếp theo.
- source_word: σχεδὸν
  choice: gần như
  rationale: σχεδόν có nghĩa “gần như, hầu như”; cách dịch này kết hợp tự nhiên với “cả thành”.
- source_word: πᾶσα ἡ πόλις
  choice: cả thành
  rationale: Đây là lối nói chỉ dân cư trong thành theo nghĩa khái quát, có sắc thái cường điệu, chứ không nhất thiết khẳng định từng cá nhân đều có mặt.
- source_word: συνήχθη
  choice: đều tụ họp
  rationale: 'Động từ aorist bị động của συνάγω tại đây mang nghĩa nội động: dân chúng quy tụ lại. “Tụ họp” là cách diễn đạt tự nhiên, còn “đều” liên kết chủ thể tập thể với hành động.'
- source_word: ἀκοῦσαι
  choice: để nghe
  rationale: Động từ nguyên mẫu diễn tả mục đích của việc tụ họp; “để nghe” chuyển tải trực tiếp cấu trúc này.
- source_word: τὸν λόγον
  choice: lời
  rationale: λόγος có thể là “lời” hoặc “sứ điệp”. “Lời” duy trì thuật ngữ lặp lại trong sách Công Vụ và tránh diễn giải quá mức.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ trực tiếp cấu trúc sở hữu của nguyên văn và cách gọi κύριος là “Chúa”, không thu hẹp quan hệ thuộc cách thành “từ Chúa” hay “về Chúa”.
theological_decisions:
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: “Chúa” là cách gọi trang trọng, quen thuộc trong tiếng Việt Kinh Thánh và phù hợp với ngôn ngữ rao giảng của sách Công Vụ mà không xác định thêm điều nguyên văn không nói rõ.
- issue: Ý nghĩa của τὸν λόγον τοῦ κυρίου
  choice: Giữ cụm “lời của Chúa”
  alternative: “sứ điệp của Chúa”, “sứ điệp về Chúa” hoặc “lời từ Chúa”
  rationale: 'Thuộc cách có thể gợi nhiều quan hệ chồng lấn: lời thuộc về Chúa, đến từ Chúa hoặc nói về Chúa. Bản dịch giữ cấu trúc của nguyên văn để bảo tồn sự đa nghĩa thay vì tự ý giải quyết.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Sa-bát” theo cách gọi phổ biến; “cả thành” là lối nói tự nhiên chỉ gần như toàn thể dân cư. Các dấu chú thích đều được đặt ngay sau cụm từ liên quan.
