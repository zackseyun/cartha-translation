  - severity: low
    issue: Chú thích lặp lại cách diễn đạt “cho đến thời nhà tiên tri Sa-mu-ên.”
    rationale: Nên điều chỉnh chú thích theo cùng cách dịch trực tiếp của cụm Hy Lạp để lựa chọn thay thế được trình bày chính xác và nhất quán.
