  terminology: “các thẩm phán” là thuật ngữ lịch sử và chính xác cho κριτάς. “Ngài ban cho họ” thích hợp trong ngữ cảnh diễn văn, nơi đối tượng là dân Israel đã được nêu trước đó; “Ngài” giữ thanh trang trọng phù hợp.
