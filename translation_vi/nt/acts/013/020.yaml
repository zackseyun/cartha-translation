  verdict: revise
  source_fidelity: 'Bản dịch theo đúng cách phân đoạn của văn bản SBLGNT: cụm “Khoảng bốn trăm năm mươi năm” đứng riêng, rồi đến việc Đức Chúa Trời ban các thẩm phán. Tuy nhiên, “cho đến thời nhà tiên tri Sa-mu-ên” thêm ý “thời” không có trực tiếp trong tiếng Hy Lạp và làm yếu cấu trúc ἕως Σαμουὴλ τοῦ προφήτου (“cho đến Sa-mu-ên, nhà tiên tri”).'
