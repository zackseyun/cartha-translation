id: ACT.13.20
reference: Acts 13:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸂ὡς ἔτεσι τετρακοσίοις καὶ πεντήκοντα. καὶ μετὰ ταῦτα⸃ ἔδωκεν κριτὰς ἕως Σαμουὴλ ⸀τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: vi
  text: Khoảng bốn trăm năm mươi năm.[a] Sau những việc ấy, Ngài ban cho họ các thẩm phán cho đến Sa-mu-ên, nhà tiên tri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc, theo cách nối cụm từ trong một số bản dịch: “Ngài ban cho họ các thẩm phán trong khoảng bốn trăm năm mươi năm, cho đến Sa-mu-ên, nhà tiên tri.” Cách hiểu và ngắt câu Hy Lạp tại đây vẫn còn được tranh luận.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: khoảng
  rationale: Khi đi với một con số, ὡς cho biết con số chỉ mang tính xấp xỉ; “khoảng” diễn đạt tự nhiên sắc thái này trong tiếng Việt.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: bốn trăm năm mươi năm
  rationale: Cụm ở cách dữ biểu thị khoảng thời gian; viết bằng chữ phù hợp với văn phong Kinh Thánh và giữ nguyên nội dung định lượng.
- source_word: καὶ μετὰ ταῦτα
  choice: Sau những việc ấy
  rationale: Cụm này đánh dấu trình tự của câu chuyện. “Sau những việc ấy” giữ được ý số nhiều của ταῦτα mà vẫn tự nhiên; không nhất thiết dịch καί thành “và” khi mở đầu câu tiếng Việt.
- source_word: ἔδωκεν
  choice: Ngài ban cho họ
  rationale: Động từ δίδωμι có nghĩa cơ bản là “ban/cho”. “Ban cho họ” vừa giữ hình ảnh Đức Chúa Trời cung ứng các thẩm phán, vừa làm rõ đối tượng được hiểu ngầm từ ngữ cảnh.
- source_word: κριτὰς
  choice: các thẩm phán
  rationale: Đây là danh xưng lịch sử dành cho những người lãnh đạo Israel trong thời kỳ trước chế độ quân chủ; “các thẩm phán” là thuật ngữ chính xác và quen thuộc.
- source_word: ἕως
  choice: cho đến thời
  rationale: ἕως nêu điểm kết thúc. Thêm “thời” trước tên Sa-mu-ên giúp câu tiếng Việt tự nhiên và không hàm ý rằng mọi thẩm phán đều tiếp tục tồn tại cho đến chính con người ông.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: nhà tiên tri Sa-mu-ên
  rationale: Cụm đồng vị xác định Sa-mu-ên theo vai trò của ông; “nhà tiên tri Sa-mu-ên” là cách nói trang trọng, tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Vị trí và quan hệ của cụm “khoảng bốn trăm năm mươi năm” trong một câu có khó khăn về văn bản và cú pháp
  choice: 'Giữ cụm thời gian như một phát biểu riêng, rồi dịch: “Sau những việc ấy, Ngài ban cho họ các thẩm phán cho đến thời nhà tiên tri Sa-mu-ên,” theo văn bản SBLGNT được cung cấp.'
  alternative: 'Gắn “khoảng bốn trăm năm mươi năm” với thời kỳ các thẩm phán: “Ngài ban cho họ các thẩm phán trong khoảng bốn trăm năm mươi năm, cho đến thời nhà tiên tri Sa-mu-ên.”'
  rationale: Cú pháp và cách ngắt câu trong Công Vụ 13:20 có tranh luận. Bản dịch theo thứ tự và cách phân đoạn của nguồn Hy Lạp được cung cấp, không tự ý dung hòa với truyền thống văn bản khác; cách hiểu khác được ghi ở chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho chủ thể là Đức Chúa Trời được tiếp nối từ ngữ cảnh; dùng “ban cho” để giữ thành ngữ Kinh Thánh mà không quá cổ; giữ dấu chú thích [a] ngay sau câu chứa mốc thời gian.
