  rationale: Bản sửa chỉ loại bỏ phần thêm nghĩa “thời” và thể hiện trực tiếp cấu trúc “Sa-mu-ên, nhà tiên tri.” Cụm thời gian đứng riêng được giữ nguyên theo SBLGNT đã cung cấp; chú thích tiếp tục bảo tồn cách nối thay thế đang được tranh luận, không quyết định vấn đề cú pháp theo một truyền thống giải thích.
