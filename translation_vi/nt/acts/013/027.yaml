revisions:
- from: Vì dân cư Giê-ru-sa-lem và các nhà lãnh đạo của họ đã không nhận ra Đấng này; khi kết án Ngài, họ đã làm ứng nghiệm những lời của các nhà tiên tri vẫn được đọc mỗi ngày Sa-bát.[a]
  to: Vì những người ở Giê-ru-sa-lem và các nhà lãnh đạo của họ đã không nhận biết Đấng này[a] và những lời của các nhà tiên tri[b], là những lời vẫn được đọc mỗi ngày Sa-bát, nên khi kết án Ngài, họ đã làm ứng nghiệm những lời ấy.
  rationale: Sửa câu để ἀγνοήσαντες chi phối đầy đủ cả “Đấng này” lẫn “những lời của các nhà tiên tri.” “Khi kết án Ngài” giữ sắc thái hoàn cảnh/thời điểm của κρίναντες mà không loại trừ việc hành động kết án là phương tiện dẫn đến sự ứng nghiệm. Chú thích được điều chỉnh để bảo lưu sắc thái chỉ định của τοῦτον và nghĩa đen của φωνάς.
