  source_fidelity: 'Bản nháp bỏ sót một đối tượng phối hợp của ἀγνοήσαντες: họ không chỉ không nhận biết “Đấng này” mà cũng không nhận biết “những tiếng nói/lời của các tiên tri.” Vì vậy, bản dịch hiện tại không truyền đạt trọn vẹn cú pháp và ý nghĩa của câu Hy Lạp. Bản sửa nêu rõ cả hai đối tượng, đồng thời giữ quan hệ mở của phân từ κρίναντες bằng “khi kết án Ngài.”'
