  terminology: Giữ “Đấng này,” “Ngài,” “Giê-ru-sa-lem,” và “Sa-bát” theo văn phong Kinh Thánh Việt ngữ hiện đại. “Những lời của các nhà tiên tri” là cách diễn đạt tự nhiên cho τὰς φωνὰς τῶν προφητῶν; chú thích bảo lưu nghĩa đen “những tiếng nói.”
