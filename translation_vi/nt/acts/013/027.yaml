reference: Acts 13:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: vi
  text: Vì những người ở Giê-ru-sa-lem và các nhà lãnh đạo của họ đã không nhận biết Đấng này[a] và những lời của các nhà tiên tri[b], là những lời vẫn được đọc mỗi ngày Sa-bát, nên khi kết án Ngài, họ đã làm ứng nghiệm những lời ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Ngài.” Nguyên văn dùng đại từ chỉ định “Đấng này,” nhấn mạnh người mà diễn giả đang nói đến.'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “những tiếng nói của các nhà tiên tri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: dân cư Giê-ru-sa-lem
  rationale: Cụm phân từ được dùng như danh từ chỉ những người cư trú tại Giê-ru-sa-lem; cách diễn đạt này tự nhiên, gọn và giữ đúng nghĩa.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: các nhà lãnh đạo của họ
  rationale: ἄρχοντες chỉ những người nắm quyền lãnh đạo và thẩm quyền xét xử; trong tiếng Việt hiện đại, “các nhà lãnh đạo” tự nhiên hơn “các nhà cai trị” mà vẫn phù hợp ngữ cảnh.
- source_word: τοῦτον
  choice: Đấng này
  rationale: Giữ sắc thái chỉ định rõ của τοῦτον và sự quy chiếu nhấn mạnh đến Chúa Giê-xu; “Đấng” thích hợp với văn phong trang trọng, còn “này” bảo toàn đại từ chỉ định.
- source_word: ἀγνοήσαντες
  choice: đã không nhận ra
  rationale: Trong ngữ cảnh, động từ nói đến việc không nhận biết căn tính và ý nghĩa của Chúa Giê-xu, chứ không nhất thiết là hoàn toàn không biết Ngài hiện hữu.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: những lời của các nhà tiên tri
  rationale: φωνάς theo nghĩa đen là “tiếng nói”, nhưng ở đây chỉ nội dung lời tiên tri được đọc; “những lời” là tiếng Việt tự nhiên và rõ nghĩa. Chú thích bảo lưu hình ảnh nguyên văn.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: vẫn được đọc mỗi ngày Sa-bát
  rationale: Diễn đạt hành động theo thông lệ lặp lại; “vẫn được đọc” làm rõ rằng những lời ấy thường xuyên được đọc vào mỗi ngày Sa-bát.
- source_word: κρίναντες
  choice: khi kết án Ngài
  rationale: Trong bối cảnh xét xử Chúa Giê-xu, κρίνω mang nghĩa kết án. “Khi” giữ quan hệ hoàn cảnh của phân từ mà không áp đặt quá mức quan hệ công cụ.
- source_word: ἐπλήρωσαν
  choice: đã làm ứng nghiệm
  rationale: Cách nói quen thuộc và rõ trong tiếng Việt để diễn đạt việc lời Kinh Thánh được hoàn thành qua biến cố.
- source_word: γὰρ
  choice: Vì
  rationale: Giữ chức năng giải thích hoặc nêu lý do của γάρ đối với mạch văn trước đó.
theological_decisions:
- issue: Bản chất của việc không nhận biết Chúa Giê-xu
  choice: đã không nhận ra Đấng này
  alternative: đã không biết Ngài
  rationale: “Không nhận ra” bảo toàn sự căng thẳng rằng họ biết Chúa Giê-xu như một nhân vật nhưng không nhận biết Ngài đúng với căn tính và vai trò được lời tiên tri làm chứng.
- issue: Quan hệ giữa việc kết án và sự ứng nghiệm lời tiên tri
  choice: khi kết án Ngài, họ đã làm ứng nghiệm
  alternative: bằng việc kết án Ngài, họ đã làm ứng nghiệm
  rationale: Phân từ κρίναντες có thể được hiểu theo sắc thái thời gian, hoàn cảnh hoặc phương tiện. “Khi” không loại trừ việc chính hành động kết án góp phần làm ứng nghiệm, nhưng tránh giải quyết dứt khoát một quan hệ cú pháp vốn có độ mở.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Giê-ru-sa-lem”, “Sa-bát” và đại từ kính trọng “Ngài” theo văn phong Kinh Thánh phổ thông; dấu chấm phẩy giúp làm rõ hai phân từ cùng hướng đến động từ chính mà không tách câu quá mạnh.
