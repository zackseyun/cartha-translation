id: ACT.13.48
reference: Acts 13:48
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούοντα δὲ τὰ ἔθνη ⸀ἔχαιρον καὶ ἐδόξαζον τὸν λόγον τοῦ ⸀κυρίου, καὶ ἐπίστευσαν ὅσοι ἦσαν τεταγμένοι εἰς ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: vi
  text: Khi nghe vậy, các dân ngoại vui mừng và tôn vinh lời Chúa; tất cả những người đã được định[a] cho sự sống đời đời đều tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể hiểu: “đã hướng lòng về sự sống đời đời.” Phân từ Hy Lạp có thể được giải thích theo những cách khác nhau, nhưng nghĩa bị động “đã được định” là cách hiểu trực tiếp hơn trong câu này.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: Khi nghe vậy
  rationale: Phân từ hiện tại mang chức năng trạng ngữ, nêu hoàn cảnh của các động từ chính; “vậy” được bổ sung tự nhiên từ ngữ cảnh.
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong ngữ cảnh Công Vụ, từ này chỉ những người không thuộc dân Do Thái; cách dịch này rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: vui mừng và tôn vinh
  rationale: Hai động từ thì chưa hoàn thành mô tả phản ứng đang diễn ra; tiếng Việt không cần thêm “bắt đầu” vì sắc thái khởi đầu không bắt buộc trong nguyên văn.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: lời Chúa
  rationale: “Lời” giữ được cách diễn đạt Kinh Thánh và ở đây chỉ sứ điệp được công bố; “Chúa” là cách xưng hô tự nhiên, trang trọng.
- source_word: ἐπίστευσαν
  choice: đều tin
  rationale: Động từ aorist được chuyển bằng hành động hoàn tất trong mạch kể; “đều” kết hợp tự nhiên với ὅσοι.
- source_word: ὅσοι
  choice: tất cả những người
  rationale: Diễn đạt đầy đủ sức định lượng của đại từ quan hệ, tương đương “bao nhiêu người… thì bấy nhiêu người” nhưng tự nhiên hơn.
- source_word: τεταγμένοι
  choice: đã được định
  rationale: Phân từ hoàn thành bị động của τάσσω trước hết mang nghĩa đã được chỉ định hoặc sắp đặt; bản dịch giữ thể bị động mà không thêm chủ thể hay xây dựng một mệnh đề giáo lý rộng hơn.
- source_word: εἰς ζωὴν αἰώνιον
  choice: cho sự sống đời đời
  rationale: “Cho” chuyển tải hướng đích của εἰς một cách tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của τεταγμένοι trong mối liên hệ giữa sự chỉ định và sự đáp ứng của con người
  choice: đã được định cho sự sống đời đời
  alternative: đã hướng lòng về sự sống đời đời; đã được sắp đặt cho sự sống đời đời
  rationale: Hình thái hoàn thành bị động và nghĩa thông thường của τάσσω trong câu này ủng hộ “đã được định” hơn cách hiểu trung động về khuynh hướng nội tâm. Tuy vậy, câu dịch không xác định tác nhân và không suy diễn xa hơn điều nguyên văn nói; cách hiểu khác được ghi ở chú thích để bảo toàn điểm còn tranh luận.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các dân ngoại,” “lời Chúa” và “sự sống đời đời” để giữ thuật ngữ Kinh Thánh quen thuộc mà vẫn tự nhiên trong tiếng Việt. Dấu chú thích được đặt ngay sau câu có cụm từ cần giải thích.
