review_pass:
  verdict: revise
  source_fidelity: Bản dịch nắm đúng hành động, đối tượng và đích đến. Tuy nhiên, “để phản đối” chuyển trực tiếp giới từ ἐπ’ αὐτούς (“chống lại họ”) thành mệnh đề chỉ mục đích; thêm “tỏ ý” giúp tiếng Việt rõ đây là cử chỉ biểu tượng, dù vẫn là một diễn đạt giải thích tối thiểu.
  naturalness: Câu sửa dùng tiếng Việt hiện đại, mạch lạc. Việc nêu rõ “chân mình” tránh mơ hồ. Neo chú thích được chuyển về ngay sau cụm nói về cử chỉ mà chú thích giải thích.
  terminology: “Giũ bụi,” “tỏ ý phản đối,” và “làm chứng chống lại” phù hợp ngữ cảnh mà không áp đặt cách hiểu phán xét cụ thể. Giữ dạng địa danh quen dùng “I-cô-ni.”
  issues:
