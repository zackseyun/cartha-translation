    issue: “để phản đối những người ấy” diễn giải ἐπ’ αὐτούς như mục đích và dùng một cụm quy chiếu nặng hơn cần thiết.
    rationale: Nguyên văn chỉ nêu cử chỉ được thực hiện “chống lại họ.” “để tỏ ý phản đối họ” diễn đạt tự nhiên ý nghĩa của cử chỉ trong tiếng Việt và giữ đại từ quy chiếu trực tiếp.
  - severity: low
