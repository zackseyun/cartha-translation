source:
  edition: SBLGNT
  text: οἱ δὲ ἐκτιναξάμενοι τὸν κονιορτὸν τῶν ⸀ποδῶν ἐπ’ αὐτοὺς ἦλθον εἰς Ἰκόνιον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/051.yaml
  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: vi
  text: Nhưng họ giũ bụi khỏi chân mình[a] để tỏ ý phản đối họ, rồi đi đến I-cô-ni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Giũ bụi khỏi chân là một hành động mang tính biểu tượng, bày tỏ sự đoạn tuyệt và làm chứng chống lại những người khước từ sứ điệp.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Nhưng họ
  rationale: δέ biểu thị sự tương phản nhẹ hoặc chuyển tiếp trong câu chuyện; đại từ “họ” tự nhiên quy chiếu về Phao-lô và Ba-na-ba.
- source_word: ἐκτιναξάμενοι
  choice: giũ ... khỏi
  rationale: Phân từ bất định trung động diễn tả hành động giũ mạnh cho vật gì rơi khỏi; chuyển thành động từ hữu hạn để câu tiếng Việt tự nhiên.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: bụi khỏi chân
  rationale: κονιορτός là bụi đất; quan hệ sở thuộc trong tiếng Hy Lạp được diễn đạt tự nhiên bằng “khỏi chân” trong tiếng Việt.
- source_word: ἐπ’ αὐτοὺς
  choice: để phản đối những người ấy
  rationale: Cụm giới từ mang hướng đối nghịch trong hành động biểu tượng này. “Để phản đối” truyền đạt tự nhiên lực nghĩa “chống lại họ” mà không thêm ý phán xét vào chính câu.
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: rồi đi đến I-cô-ni
  rationale: ἦλθον chỉ sự di chuyển đến địa điểm được nêu; “đi đến” phù hợp góc nhìn kể chuyện. Tên địa danh được phiên âm theo cách đọc quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa biểu tượng của việc giũ bụi khỏi chân
  choice: Giữ hành động trong chính văn và diễn đạt hướng đối nghịch là “để phản đối những người ấy”; giải thích thêm bằng chú thích.
  alternative: “làm chứng chống lại họ” hoặc “như dấu hiệu phán xét họ”
  rationale: Nguyên văn nêu hành động và hướng chống lại họ nhưng không trực tiếp dùng các danh từ “làm chứng” hay “phán xét”; vì vậy không nên quyết định thay cho người đọc về toàn bộ hàm ý thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “giũ bụi khỏi chân” là cách nói tự nhiên; “những người ấy” giữ rõ đối tượng của αὐτούς. Dấu chú thích [a] được đặt ngay sau địa danh ở cuối câu.
