id: ACT.13.23
reference: Acts 13:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: vi
  text: Từ dòng dõi của người này[a], Đức Chúa Trời đã, theo lời hứa[b], đem đến cho Israel một Đấng Cứu Rỗi là Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “từ hạt giống của người này”; ở đây chỉ dòng dõi của Đa-vít.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đúng như đã hứa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: của người này
  rationale: Đại từ chỉ định sở hữu quay lại Đa-vít trong câu trước; cách dịch này giữ quan hệ sở hữu và không thay tên riêng vào nguyên văn.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: từ dòng dõi
  rationale: σπέρμα theo nghĩa đen là “hạt giống”, nhưng tại đây chỉ hậu duệ thuộc dòng Đa-vít; “dòng dõi” tự nhiên, trang trọng và giữ rõ ý phả hệ.
- source_word: κατ’ ἐπαγγελίαν
  choice: theo lời hứa
  rationale: Giữ sát ý hành động của Đức Chúa Trời phù hợp với lời hứa, nhưng không xác định thêm trong chính văn đó là lời hứa nào.
- source_word: ἤγαγεν
  choice: đã đem đến
  rationale: ἄγω có nghĩa cơ bản là đem hoặc dẫn đến. “Đã đem đến” tránh nhập ý phục sinh có thể phát sinh từ cách dịch “đã khiến trỗi dậy”.
- source_word: τῷ Ἰσραήλ
  choice: cho Israel
  rationale: Dữ cách có thể mang cả sắc thái hướng đến và ích lợi; “cho Israel” là cách diễn đạt tự nhiên trong tiếng Việt và thể hiện rõ đối tượng tiếp nhận.
- source_word: σωτῆρα
  choice: một Đấng Cứu Rỗi
  rationale: Giữ tước hiệu cứu độ quan trọng của σωτήρ mà không đồng nhất nó một cách không cần thiết với một tước hiệu khác.
- source_word: Ἰησοῦν
  choice: Đức Giê-su
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt; “Đức” tạo sắc thái tôn kính phù hợp với văn phong Kinh Thánh hiện đại.
theological_decisions:
- issue: Mối liên hệ giữa Đức Giê-su, dòng Đa-vít và lời hứa
  choice: Câu dịch nói Đức Chúa Trời đem Đức Giê-su từ dòng dõi Đa-vít đến cho Israel theo lời hứa, không giải thích thêm nội dung hay đối tượng của lời hứa.
  alternative: Diễn giải rõ là Đức Chúa Trời làm ứng nghiệm lời hứa đã ban cho Đa-vít.
  rationale: Nguyên văn liên kết dòng dõi Đa-vít với lời hứa nhưng không nói đầy đủ “lời hứa với Đa-vít” trong câu này; giữ cách nói cô đọng bảo toàn hàm ý mà không thêm lời giải nghĩa.
- issue: Ý nghĩa của ἤγαγεν
  choice: đã đem đến
  alternative: đã làm xuất hiện; đã dấy lên
  rationale: “Đã đem đến” phản ánh trực tiếp động từ ἄγω và tránh tự động biến câu này thành một phát biểu riêng về sự phục sinh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Trật tự câu được điều chỉnh nhẹ cho tự nhiên, đồng thời vẫn giữ nổi bật nguồn gốc thuộc dòng Đa-vít, lời hứa của Đức Chúa Trời và việc Đấng Cứu Rỗi được ban cho Israel.
