  - severity: medium
    issue: Vị trí của “theo lời hứa” dễ tạo liên kết sai
    rationale: κατ’ ἐπαγγελίαν đi với ἤγαγεν (“Đức Chúa Trời đã đem đến ... theo lời hứa”), không phải là định ngữ trực tiếp của “dòng dõi”. Chuyển cụm này đến gần động từ bảo toàn quan hệ cú pháp mà vẫn tự nhiên.
  revised_text: Từ dòng dõi của người này[a], Đức Chúa Trời đã, theo lời hứa[b], đem đến cho Israel một Đấng Cứu Rỗi là Giê-su.
