- from: Chính từ dòng dõi của người này[a], theo lời hứa[b], Đức Chúa Trời đã đem đến cho Israel một Đấng Cứu Rỗi là Đức Giê-su.
  to: Từ dòng dõi của người này[a], Đức Chúa Trời đã, theo lời hứa[b], đem đến cho Israel một Đấng Cứu Rỗi là Giê-su.
  rationale: Bỏ “Chính” để không thêm nhấn mạnh ngoài nguyên văn, và chuyển “theo lời hứa” vào vị trí bổ nghĩa rõ ràng cho hành động Đức Chúa Trời đem Đấng Cứu Rỗi đến cho Israel. Giữ nguyên các thuật ngữ và chú thích vốn phản ánh đúng ý dòng dõi và lời hứa.
