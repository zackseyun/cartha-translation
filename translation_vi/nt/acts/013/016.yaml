revisions:
- from: 'Bấy giờ, Phao-lô đứng dậy, giơ tay ra hiệu rồi nói: “Thưa anh em là người Y-sơ-ra-ên và những người kính sợ Đức Chúa Trời[a], xin hãy lắng nghe.”'
  to: 'Phao-lô đứng dậy, ra hiệu bằng tay rồi nói: “Hỡi những người Y-sơ-ra-ên và những ai kính sợ Đức Chúa Trời[a], hãy lắng nghe.”'
  rationale: Sửa lời xưng hô để không thêm nghĩa «anh em» vào ἄνδρες, đồng thời giữ nguyên sự phân biệt của nguyên văn giữa người Y-sơ-ra-ên và những người kính sợ Đức Chúa Trời. Điều chỉnh nhẹ liên từ mở đầu và cách diễn đạt cử chỉ cho tự nhiên, trung tính, và sát chức năng của tiếng Hy Lạp.
