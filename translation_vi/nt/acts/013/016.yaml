  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: vi
  text: 'Phao-lô đứng dậy, ra hiệu bằng tay rồi nói: “Hỡi những người Y-sơ-ra-ên và những ai kính sợ Đức Chúa Trời[a], hãy lắng nghe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cụm từ này cũng có thể được dùng như một tên gọi: “những người kính sợ Đức Chúa Trời.” Trong bối cảnh hội đường, cụm từ có lẽ chỉ những người ngoại thờ phượng Đức Chúa Trời và gắn bó với hội đường.'
    reason: Giải thích cách hiểu từ vựng có thể có và bối cảnh lịch sử của nhóm người được nhắc đến, nhưng không khẳng định quá mức.
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn tả hành động cụ thể của Phao-lô trước khi phát biểu, tự nhiên và sát nghĩa trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Đánh dấu bước chuyển tiếp trong diễn tiến câu chuyện, không hàm ý tương phản mạnh.
- source_word: κατασείσας τῇ χειρὶ
  choice: giơ tay ra hiệu
  rationale: Diễn đạt cử chỉ bằng tay nhằm thu hút sự chú ý hoặc xin mọi người yên lặng, đồng thời tránh sắc thái vẫy tay liên tục.
- source_word: εἶπεν
  choice: nói
  rationale: Động từ dẫn lời trực tiếp thông dụng và tự nhiên.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: anh em là người Y-sơ-ra-ên
  rationale: Giữ sắc thái xưng hô hướng đến những người nam trong nguyên văn bằng “anh em”, nhưng vẫn tự nhiên và trang trọng trong tiếng Việt.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: những người kính sợ Đức Chúa Trời
  rationale: Giữ nguyên lực nghĩa của phân từ và không biến cụm từ thành một thuật ngữ kỹ thuật khó hiểu; trong bối cảnh hội đường, cụm này có lẽ chỉ một nhóm khác với người Y-sơ-ra-ên.
- source_word: ἀκούσατε
  choice: xin hãy lắng nghe
  rationale: Thể hiện mệnh lệnh kêu gọi nghe chăm chú; “xin hãy” phù hợp với lời mở đầu trang trọng trước cử tọa.
theological_decisions:
- issue: Cách diễn đạt hai nhóm người được Phao-lô trực tiếp xưng hô trong hội đường
  choice: “anh em là người Y-sơ-ra-ên và những người kính sợ Đức Chúa Trời”
  alternative: “các ông người Y-sơ-ra-ên và những người kính sợ Đức Chúa Trời”
  rationale: Bản dịch duy trì sự phân biệt giữa người Y-sơ-ra-ên và nhóm được mô tả là kính sợ Đức Chúa Trời, có lẽ là những người ngoại gắn bó với hội đường, nhưng không đưa cách hiểu ấy thành điều khẳng định tuyệt đối trong chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Anh em” giữ sắc thái xưng hô nam giới của ἄνδρες mà không tạo cảm giác cứng nhắc; “Đức Chúa Trời” được dùng nhất quán làm cách gọi trang trọng đối với θεός.
