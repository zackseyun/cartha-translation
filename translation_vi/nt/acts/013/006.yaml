  terminology: «Thuật sĩ» là lựa chọn phù hợp cho μάγον; «tiên tri giả» dịch trực tiếp ψευδοπροφήτην; «người Do Thái» chuyển tải tự nhiên Ἰουδαῖον. Tên Βαριησοῦ nên được phiên âm nhất quán là «Ba-giê-su». Chú thích hiện tại tự mâu thuẫn khi nói «viết liền» nhưng vẫn ghi một dạng có dấu nối.
  issues:
