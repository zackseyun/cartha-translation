revisions:
- from: Sau khi đi khắp đảo cho đến Pa-phô, họ gặp một người tên là Ba-Giê-su[a], một thuật sĩ, một tiên tri giả, thuộc dân Do Thái.
  to: Sau khi đi khắp đảo đến Pha-phô, họ gặp một người, là một thuật sĩ, một tiên tri giả, một người Do Thái, tên là Ba-giê-su[a].
  rationale: Bản sửa dùng cách phiên âm nhất quán hơn cho Paphos và Bar-Jesus, làm câu tiếng Việt trôi chảy hơn, đồng thời giữ nguyên thứ tự và tính chất đồng vị của các mô tả trong tiếng Hy Lạp. Chú thích được chỉnh để dạng «viết liền» thực sự không có dấu nối, nhưng chỉ nêu nghĩa khả dĩ của tên như thông tin từ nguyên, không dịch tên trong chính văn.
