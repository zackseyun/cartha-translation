  source_fidelity: 'Bản dịch giữ đúng diễn tiến chính: họ đi xuyên qua đảo tới Paphos rồi gặp một người được mô tả là thuật sĩ, tiên tri giả và người Do Thái. Tuy nhiên, nên dùng dạng địa danh «Pha-phô» và đưa tên riêng về cuối chuỗi mô tả để phản ánh sát hơn cấu trúc đồng vị của nguyên văn.'
