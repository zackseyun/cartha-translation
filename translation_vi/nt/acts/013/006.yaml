id: ACT.13.6
reference: Acts 13:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διελθόντες δὲ ⸀ὅλην τὴν νῆσον ἄχρι Πάφου εὗρον ⸀ἄνδρα τινὰ μάγον ψευδοπροφήτην Ἰουδαῖον ᾧ ὄνομα ⸀Βαριησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/006.yaml
  text: And after they had gone through the whole island as far as Paphos[a], they found a certain man, a magician, a false prophet, a Jew, whose name was Bar-Jesus.
translation:
  language: vi
  text: Sau khi đi khắp đảo đến Pha-phô, họ gặp một người, là một thuật sĩ, một tiên tri giả, một người Do Thái, tên là Ba-giê-su[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên Ba-giê-su cũng có thể viết liền là Bagiêsu; tên này có lẽ theo lối Sê-mít, nghĩa là “con của Giê-su” hoặc “con của Giô-suê.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διελθόντες δὲ ὅλην τὴν νῆσον ἄχρι Πάφου
  choice: Sau khi đi khắp đảo cho đến Pa-phô
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “đi khắp đảo” truyền đạt tự nhiên ý vượt qua toàn đảo, còn “cho đến” giữ rõ điểm cuối hành trình.
- source_word: εὗρον
  choice: họ gặp
  rationale: Trong ngữ cảnh kể chuyện, “gặp” tự nhiên hơn “tìm thấy” khi đối tượng là một người, đồng thời không thêm ý rằng họ chủ tâm tìm kiếm.
- source_word: ἄνδρα τινὰ
  choice: một người
  rationale: “Một người” chuyển tải tính bất định của τινά bằng tiếng Việt tự nhiên; thêm “nọ” hay “nào đó” sẽ dễ tạo sắc thái không cần thiết.
- source_word: μάγον
  choice: một thuật sĩ
  rationale: “Thuật sĩ” chỉ người thực hành huyền thuật và phù hợp sắc thái tiêu cực của ngữ cảnh, mà không dùng từ quá cổ hoặc quá chuyên biệt.
- source_word: ψευδοπροφήτην
  choice: một tiên tri giả
  rationale: Cách dịch trực tiếp, rõ nghĩa, giữ cả lời tự nhận hoặc vai trò tiên tri lẫn sự giả dối được nguyên văn khẳng định.
- source_word: Ἰουδαῖον
  choice: thuộc dân Do Thái
  rationale: Diễn đạt rõ căn tính dân tộc-tôn giáo trong tiếng Việt hiện đại và tránh biến từ này thành một tính từ gắn nhầm với danh từ đứng sát nó.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: tên là Ba-Giê-su
  rationale: Thành ngữ Hy Lạp được chuyển thành cách nói tiếng Việt tự nhiên; tên riêng được phiên âm thay vì dịch nghĩa.
theological_decisions:
- issue: Cách thể hiện tên riêng Βαριησοῦ
  choice: Ba-Giê-su
  alternative: Con của Giê-su / Ba-giê-su
  rationale: Giữ đây là tên riêng bằng cách phiên âm, không chuyển thành nghĩa của tên. Dấu nối giúp người đọc nhận ra cấu trúc tên gốc Semit mà không áp đặt cách giải thích vào chính văn.
- issue: Quan hệ giữa các mô tả μάγον, ψευδοπροφήτην và Ἰουδαῖον
  choice: một thuật sĩ, một tiên tri giả, thuộc dân Do Thái
  alternative: một thuật sĩ Do Thái và tiên tri giả
  rationale: Giữ ba mô tả đồng vị của nguyên văn, không khiến căn tính Do Thái bị hiểu là bổ nghĩa riêng cho nghề thuật sĩ hoặc mang hàm ý thần học vượt quá câu.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Trật tự các cụm mô tả được điều chỉnh nhẹ cho tự nhiên trong tiếng Việt, nhưng vẫn giữ đầy đủ các nét nghĩa và quan hệ đồng vị của nguyên văn.
