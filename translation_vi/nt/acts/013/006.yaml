  - severity: low
    issue: Cụm «đi khắp đảo cho đến»
    rationale: Cách nối này kém tự nhiên; «đi khắp đảo đến Pha-phô» vẫn giữ ἄχρι Πάφου là điểm cuối hành trình.
  - severity: medium
    issue: Chú thích tên riêng nói «viết liền» nhưng dạng nêu ra vẫn có dấu nối
    rationale: Cần sửa thành dạng viết liền thực sự để chú thích không có lỗi hình thức và để phân biệt lựa chọn chính tả.
