  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: vi
  text: Và chính chúng tôi loan báo cho quý vị tin mừng về lời hứa đã được ban cho các tổ phụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tổ tiên.” Tiếng Hy Lạp dùng từ “các tổ phụ,” một cách gọi mang tính lịch sử giao ước dành cho những bậc tiền nhân của Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Còn
  rationale: Liên kết lời tuyên bố này với mạch lập luận trước và tạo sự chuyển ý tự nhiên trong tiếng Việt, không thêm nội dung diễn giải.
- source_word: ἡμεῖς
  choice: chúng tôi
  rationale: Đại từ được nêu rõ trong tiếng Hy Lạp tạo sắc thái nhấn mạnh; trong tiếng Việt, việc dùng “chúng tôi” sau từ nối đã thể hiện chủ thể rõ ràng mà không cần thêm “chính” một cách nặng nề.
- source_word: ὑμᾶς
  choice: cho anh em
  rationale: Với εὐαγγελιζόμεθα, đại từ chỉ người nghe được diễn đạt tự nhiên bằng bổ ngữ “cho anh em”; “anh em” phù hợp với cách xưng hô trang trọng của diễn từ.
- source_word: εὐαγγελιζόμεθα
  choice: báo ... tin mừng
  rationale: Diễn đạt hành động loan báo điều tốt lành bằng ngôn ngữ tự nhiên, dễ hiểu, đồng thời tránh thu hẹp động từ thành một thuật ngữ giáo hội chuyên biệt.
- source_word: τὴν ... ἐπαγγελίαν
  choice: về lời hứa
  rationale: Danh từ chỉ lời hứa của Đức Chúa Trời; “lời hứa” vừa chính xác vừa tự nhiên. Giới từ “về” giúp cấu trúc với “báo ... tin mừng” rõ nghĩa trong tiếng Việt.
- source_word: πρὸς τοὺς πατέρας
  choice: cho các tổ phụ
  rationale: πρός chỉ những người nhận lời hứa. “Các tổ phụ” giữ sắc thái nam giới và ý nghĩa lịch sử giao ước của πατέρες, thay vì làm thành từ chỉ tổ tiên nói chung.
- source_word: γενομένην
  choice: đã được ban
  rationale: Phân từ bổ nghĩa cho “lời hứa”, nói rằng lời hứa đã đến với các tổ phụ. “Đã được ban” tự nhiên trong tiếng Việt và không diễn giải quá mức thành “đã được ứng nghiệm”, là ý của câu tiếp theo.
theological_decisions:
- issue: Cách dịch πατέρες
  choice: các tổ phụ
  alternative: tổ tiên
  rationale: “Các tổ phụ” phản ánh danh từ giống đực của bản Hy Lạp và cách gọi mang tính lịch sử giao ước dành cho những bậc tiền nhân của Israel; “tổ tiên” tự nhiên hơn nhưng ít giữ được sắc thái ấy.
- issue: Quan hệ của lời hứa với câu tiếp theo
  choice: đã được ban
  alternative: đã được ứng nghiệm
  rationale: γενομένην mô tả lời hứa đã được đưa ra hoặc ban cho các tổ phụ, chứ chưa tự nó nói đến sự ứng nghiệm; dịch “ứng nghiệm” sẽ đưa nội dung của câu 33 vào câu 32.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “anh em” theo lối xưng hô trong diễn từ; giữ “các tổ phụ” trong chính văn để bảo toàn sắc thái lịch sử giao ước, đồng thời nêu cách dịch tự nhiên hơn trong chú thích.
