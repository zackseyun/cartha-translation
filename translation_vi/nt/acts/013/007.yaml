id: ACT.13.7
reference: Acts 13:7
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἦν σὺν τῷ ἀνθυπάτῳ Σεργίῳ Παύλῳ, ἀνδρὶ συνετῷ. οὗτος προσκαλεσάμενος Βαρναβᾶν καὶ Σαῦλον ἐπεζήτησεν ἀκοῦσαι τὸν λόγον τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: vi
  text: người ở cùng tổng đốc Séc-giu Phao-lô, một người thông sáng.[a] Người này cho gọi Ba-na-ba và Sau-lơ đến, và mong được nghe lời Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một người khôn ngoan” hoặc “một người hiểu biết.”
    reason: lexical_alternative
  - marker: b
    text: Hay “sứ điệp của Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: tổng đốc
  rationale: Đây là chức danh chính thức của người đứng đầu một tỉnh thuộc viện nguyên lão La Mã; “tổng đốc” vừa tương đối chính xác vừa dễ hiểu hơn các cách gọi cổ.
- source_word: σὺν
  choice: ở cùng
  rationale: Diễn đạt trực tiếp sự hiện diện hoặc liên hệ gần gũi với vị tổng đốc, đồng thời nối tự nhiên với mệnh đề quan hệ ở đầu câu.
- source_word: ἀνδρὶ συνετῷ
  choice: một người thông sáng
  rationale: συνετός chỉ người có khả năng hiểu biết, suy xét và nhận định; “thông sáng” giữ được cả sắc thái trí tuệ lẫn sự sáng suốt mà không biến lời mô tả thành một đánh giá đạo đức quá mức.
- source_word: οὗτος
  choice: Tổng đốc
  rationale: Đại từ chỉ định nhắc lại Séc-giu Phao-lô với chút nhấn mạnh. Lặp lại chức danh giúp tiếng Việt rõ chủ thể và tự nhiên hơn “người này” trong ngữ cảnh.
- source_word: προσκαλεσάμενος
  choice: cho gọi ... đến
  rationale: Phân từ trung động diễn tả việc ông gọi Ba-na-ba và Sau-lơ đến với mình; “cho gọi ... đến” phù hợp với sáng kiến của một quan chức nhưng không hàm ý cưỡng ép.
- source_word: ἐπεζήτησεν
  choice: tha thiết muốn
  rationale: Động từ diễn tả sự tìm kiếm hoặc mong muốn mạnh mẽ. Trong tiếng Việt, “tha thiết muốn nghe” tự nhiên và giữ được cường độ của động từ hơn cách dịch đơn giản là “muốn”.
- source_word: ἀκοῦσαι
  choice: nghe
  rationale: Giữ nghĩa trực tiếp của động từ, ở đây là tiếp nhận lời được rao giảng.
- source_word: λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ hình thức quen thuộc và gần với cấu trúc Hy Lạp, đồng thời vẫn có thể được hiểu là sứ điệp đến từ Đức Chúa Trời.
- source_word: Σεργίῳ Παύλῳ
  choice: Séc-giu Phao-lô
  rationale: Phiên âm tên riêng theo âm tiết, bằng lối viết quen thuộc và dễ đọc trong tiếng Việt.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Ba-na-ba và Sau-lơ
  rationale: Phiên âm các tên riêng theo cách dùng tiếng Việt phổ biến.
theological_decisions:
- issue: Cách dịch λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  alternative: sứ điệp của Đức Chúa Trời
  rationale: “Lời Đức Chúa Trời” phản ánh sát thành ngữ Hy Lạp và duy trì cách nói Kinh Thánh quen thuộc; chú thích nêu nghĩa năng động hơn mà không thu hẹp λόγος vào một khái niệm thần học riêng.
- issue: Sắc thái của συνετῷ khi mô tả Séc-giu Phao-lô
  choice: một người thông sáng
  alternative: một người khôn ngoan; một người hiểu biết
  rationale: Từ này khen khả năng hiểu và suy xét của ông, nhưng không nhất thiết xác nhận đức hạnh hay địa vị thuộc linh; “thông sáng” giữ lời mô tả tích cực mà không cường điệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu đầu giữ dạng mệnh đề quan hệ vì câu Hy Lạp tiếp nối câu trước. “Tổng đốc” được lặp lại ở câu sau để xác định rõ chủ thể; tên người được phiên âm theo lối quen thuộc trong tiếng Việt.
