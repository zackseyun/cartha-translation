revisions:
- from: 'Vì Chúa đã truyền cho chúng tôi như thế này: “Ta đã lập con làm ánh sáng cho các dân tộc[a], để con là sự cứu rỗi cho đến tận cùng trái đất[b].”'
  to: 'Vì Chúa đã truyền cho chúng tôi như vậy: “Ta đã lập ngươi làm ánh sáng cho các dân tộc[a], để ngươi trở nên sự cứu rỗi đến tận cùng trái đất[b].”'
  rationale: Các chỉnh sửa giới hạn ở việc loại bỏ sắc thái cha-con không có trong nguyên văn, làm câu tiếng Việt tự nhiên hơn, và giữ nguyên sự mơ hồ thần học của lời trích về người được đặt “làm... sự cứu rỗi”. Chú thích vẫn được gắn đúng tại các cụm từ liên quan.
  reviewer_model: gpt-5.6-terra
