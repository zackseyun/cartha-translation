id: ACT.13.47
reference: Acts 13:47
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: vi
  text: 'Vì Chúa đã truyền cho chúng tôi như vậy: “Ta đã lập ngươi làm ánh sáng cho các dân tộc[a], để ngươi trở nên sự cứu rỗi đến tận cùng trái đất[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “làm ánh sáng cho dân ngoại.” Từ Hy Lạp ἐθνῶν có thể chỉ “các dân tộc” hoặc, trong nhiều ngữ cảnh, “dân ngoại.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “đến những nơi tận cùng trái đất.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: như thế này
  rationale: Diễn đạt tự nhiên vai trò dẫn nhập của trạng từ, vừa chỉ cách thức vừa nêu căn cứ cho lời nói tiếp theo.
- source_word: ἐντέταλται
  choice: đã truyền
  rationale: Thì hoàn thành của ἐντέλλομαι nói đến một mệnh lệnh đã được ban và vẫn còn hiệu lực; “đã truyền” ngắn gọn, có thẩm quyền và tự nhiên trong tiếng Việt.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ danh xưng thần học quen thuộc cho κύριος khi chỉ Đấng phán trong Kinh Thánh được trích dẫn.
- source_word: Τέθεικά σε
  choice: Ta đã lập con
  rationale: Thì hoàn thành của τίθημι diễn tả sự bổ nhiệm đã được thiết lập; “lập” phù hợp với ngữ cảnh sai phái, còn đại từ số ít giữ nguyên hình thức của lời trích dẫn.
- source_word: εἰς φῶς ἐθνῶν
  choice: làm ánh sáng cho các dân tộc
  rationale: “Làm” diễn đạt chức năng bổ nhiệm của εἰς; “các dân tộc” giữ nghĩa tập thể rộng của ἔθνη trong lời trích Ê-sai, đồng thời không loại trừ nghĩa “dân ngoại”.
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: để con là sự cứu rỗi
  rationale: Cấu trúc τοῦ với động từ nguyên mẫu biểu thị mục đích hoặc kết quả. Bản dịch giữ cách nói cô đọng và không tự ý biến người được sai thành người chỉ “đem” hay “mang” sự cứu rỗi.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: cho đến tận cùng trái đất
  rationale: Phản ánh hình thức số ít ἐσχάτου và ý niệm về nơi xa nhất của đất; cách nói trang trọng nhưng vẫn dễ hiểu trong tiếng Việt hiện đại.
theological_decisions:
- issue: Đối tượng được gọi là “con” và cách lời về người tôi tớ được áp dụng cho sứ mạng của Phao-lô và Ba-na-ba
  choice: Giữ nguyên lời trích dẫn ở ngôi thứ hai số ít, không xác định thêm người được nói đến là ai.
  alternative: Diễn giải lời trích như được nói trực tiếp về các sứ đồ, hoặc nêu rõ người nói và người nghe trong câu dịch.
  rationale: Bản Hy Lạp trích Kinh Thánh trực tiếp và để ngỏ mối liên hệ thần học giữa người tôi tớ trong Ê-sai với sứ mạng của các sứ đồ; bản dịch không nên âm thầm giải quyết sự căng thẳng ấy.
- issue: Mối quan hệ giữa người được sai và sự cứu rỗi trong εἰς σωτηρίαν
  choice: Dịch “để con là sự cứu rỗi”.
  alternative: “để con đem sự cứu rỗi” hoặc “để con trở thành phương tiện cứu rỗi”.
  rationale: Cách dịch đã chọn giữ sức nặng và sự cô đọng của nguyên văn, không xác định quá mức người được sai chính là sự cứu rỗi hay là phương tiện mang sự cứu rỗi.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng và dễ hiểu. Lời phán dùng cặp đại từ “Ta—con” để giữ sắc thái Kinh Thánh mà không quá cổ; câu trích duy trì ngôi số ít và cấu trúc thần học cô đọng của nguyên văn.
