  yaml_path: translation/nt/acts/013/039.yaml
  text: In him everyone who believes is justified[a].
translation:
  language: vi
  text: Trong Đấng ấy, mọi người tin đều được xưng công chính.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nhờ Đấng này, mọi người tin đều được xưng công chính.” Cụm từ Hy Lạp ἐν τούτῳ có thể được dịch sát hơn là “trong/nhờ Đấng này,” chỉ về Chúa Giê-su.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Trong Đấng ấy
  rationale: Đại từ chỉ định số ít nối lại nhân vật vừa được nói đến trong ngữ cảnh là Chúa Giê-su. “Trong Đấng ấy” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt, vừa giữ được giới từ ἐν và sắc thái quy chiếu về một ngôi vị.
- source_word: πᾶς ὁ πιστεύων
  choice: mọi người tin
  rationale: Phân từ hiện tại có mạo từ được dùng như danh từ và mang ý nghĩa khái quát. Cách dịch này rõ ràng, tự nhiên, đồng thời giữ phạm vi bao quát của πᾶς.
- source_word: δικαιοῦται
  choice: được xưng công chính
  rationale: Thể bị động hiện tại của δικαιόω mang sắc thái pháp lý là được tuyên nhận công chính. “Được xưng công chính” giữ được nghĩa pháp đình và tránh đồng nhất hành động này với quá trình biến đổi đạo đức.
theological_decisions:
- issue: Đối tượng quy chiếu của ἐν τούτῳ
  choice: 'Hiểu là quy chiếu về Chúa Giê-su: “Trong Đấng ấy”'
  alternative: “Nhờ Đấng này” hoặc “trong điều này”
  rationale: Mạch văn ngay trước đó nói về Chúa Giê-su là Đấng qua Ngài sự tha tội được công bố. Tuy vậy, chú thích vẫn giữ cách hiểu mang sắc thái phương tiện có thể có của giới từ ἐν.
- issue: Ý nghĩa của δικαιοῦται
  choice: “được xưng công chính” theo sắc thái pháp lý
  alternative: “được kể là công chính”, “được tuyên là công chính” hoặc “được giải thoát”
  rationale: Trong ngữ cảnh đối chiếu với Luật Môi-se, nghĩa pháp lý phù hợp hơn và bảo toàn sự phân biệt giữa việc được tuyên công chính với sự biến đổi đạo đức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đấng ấy” dùng chữ hoa để biểu thị đại từ chỉ về Chúa Giê-su, không thêm danh xưng vốn không hiện diện trong câu Hy Lạp.
