revisions:
- from: Bấy giờ, khi viên tổng đốc thấy việc đã xảy ra, ông tin, kinh ngạc trước sự dạy dỗ của Chúa.[a]
  to: Bấy giờ, khi viên phó chấp chính La Mã thấy việc đã xảy ra, ông tin, kinh ngạc trước sự dạy dỗ của Chúa.[a]
  rationale: Chỉ thay chức danh “tổng đốc” bằng “phó chấp chính La Mã” để phản ánh chính xác ἀνθύπατος. Những yếu tố còn lại của bản dịch đã giữ trung thành sự ngắn gọn của ἐπίστευσεν và độ mơ hồ của τοῦ κυρίου; chú thích [a] vẫn được neo đúng sau cụm mà nó giải thích.
