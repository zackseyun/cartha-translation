source:
  edition: SBLGNT
  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: vi
  text: Bấy giờ, khi viên phó chấp chính La Mã thấy việc đã xảy ra, ông tin, kinh ngạc trước sự dạy dỗ của Chúa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “lời dạy của Chúa” hoặc “sự dạy dỗ về Chúa.” Sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo nhiều cách.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Đánh dấu bước tiếp theo trong trình tự câu chuyện một cách ngắn gọn, tự nhiên.
- source_word: ἰδὼν
  choice: khi ... thấy
  rationale: Chuyển phân từ bất định quá khứ thành mệnh đề thời gian tự nhiên trong tiếng Việt, vẫn giữ quan hệ thời gian với động từ chính.
- source_word: ὁ ἀνθύπατος
  choice: viên tổng đốc
  rationale: Giữ chức danh hành chính La Mã cụ thể của ἀνθύπατος, thay vì dùng từ chung chung như 'quan cai trị'.
- source_word: τὸ γεγονός
  choice: việc đã xảy ra
  rationale: Diễn đạt tự nhiên phân từ hoàn thành được danh từ hóa, chỉ sự việc vừa xảy ra với kết quả đã hiện hữu.
- source_word: ἐπίστευσεν
  choice: ông tin
  rationale: Giữ cách nói ngắn gọn của nguyên văn, vì động từ không nêu rõ đối tượng của lòng tin.
- source_word: ἐκπλησσόμενος
  choice: kinh ngạc
  rationale: Diễn đạt hoàn cảnh đi kèm của động từ chính bằng lối nói tự nhiên, đồng thời giữ sắc thái sửng sốt mạnh.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: trước sự dạy dỗ
  rationale: ἐπί với tặng cách nêu căn cứ hoặc nguyên cớ của sự kinh ngạc; 'trước' là cách diễn đạt tiếng Việt tự nhiên.
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ cấu trúc sở hữu rộng của nguyên văn và không buộc phải chọn giữa lời dạy do Chúa ban với lời dạy nói về Chúa.
theological_decisions:
- issue: Ý nghĩa của πιστεύω khi không có đối tượng được nói rõ
  choice: ông tin
  alternative: ông tin Chúa; ông tin sứ điệp
  rationale: Ngữ cảnh gợi đến đức tin theo đạo, nhưng nguyên văn không nêu đối tượng. Bản dịch không thêm nội dung thần học cụ thể ngoài câu chữ.
- issue: Sắc thái của τοῦ κυρίου trong cụm 'sự dạy dỗ của Chúa'
  choice: sự dạy dỗ của Chúa
  alternative: sự dạy dỗ do Chúa ban; sự dạy dỗ về Chúa
  rationale: Sở hữu cách Hy Lạp có thể mang nghĩa chủ thể, sở hữu hoặc đối tượng. Cách dịch này bảo tồn độ rộng nghĩa ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'viên tổng đốc' để vừa giữ độ chính xác lịch sử vừa phù hợp tiếng Việt phổ thông; không thêm đối tượng cho động từ 'tin'.
