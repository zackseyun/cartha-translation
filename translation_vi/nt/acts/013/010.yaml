revisions:
- from: 'Ông nói: “Hỡi kẻ đầy mọi sự dối trá và mọi điều gian ác, con của ma quỷ, kẻ thù của mọi sự công chính[a], ngươi không thôi bẻ cong những đường lối ngay thẳng của Chúa sao?”'
  to: 'Ông nói: “Hỡi kẻ đầy mọi sự dối trá và mọi điều bất lương, con của ma quỷ, kẻ thù của mọi sự công chính[a], ngươi không thôi bẻ cong những đường lối ngay thẳng của Chúa sao?”'
  rationale: Chỉ thay «mọi điều gian ác» bằng «mọi điều bất lương» để chuyển tải chính xác hơn ῥᾳδιουργία là hành vi/bản tính bất lương, xảo quyệt. Các yếu tố khác của bản dịch được giữ nguyên vì trung thành với tiếng Hy Lạp và tự nhiên trong tiếng Việt hiện đại.
