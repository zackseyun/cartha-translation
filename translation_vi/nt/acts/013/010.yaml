id: ACT.13.10
reference: Acts 13:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν· Ὦ πλήρης παντὸς δόλου καὶ πάσης ῥᾳδιουργίας, υἱὲ διαβόλου, ἐχθρὲ πάσης δικαιοσύνης, οὐ παύσῃ διαστρέφων τὰς ⸀ὁδοὺς κυρίου τὰς εὐθείας;
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: vi
  text: 'Ông nói: “Hỡi kẻ đầy mọi sự dối trá và mọi điều bất lương, con của ma quỷ, kẻ thù của mọi sự công chính[a], ngươi không thôi bẻ cong những đường lối ngay thẳng của Chúa sao?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “mọi công lý”. Từ Hy Lạp có thể chỉ sự công chính hoặc công lý, tùy ngữ cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: đầy mọi sự dối trá
  rationale: Giữ sức khái quát của παντός và ý nghĩa lừa dối, xảo trá của δόλος, đồng thời diễn đạt tự nhiên trong tiếng Việt.
- source_word: πάσης ῥᾳδιουργίας
  choice: mọi điều gian ác
  rationale: ῥᾳδιουργία chỉ hành vi bất lương, vô nguyên tắc hoặc gian ác; cách dịch này phân biệt tương đối với “dối trá” mà vẫn giữ lời quở trách mạnh.
- source_word: υἱὲ διαβόλου
  choice: con của ma quỷ
  rationale: Dịch sát υἱέ và giữ thành ngữ Kinh Thánh diễn tả sự thuộc về hoặc giống nhau về mặt đạo đức.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: kẻ thù của mọi sự công chính
  rationale: δικαιοσύνη ở đây chủ yếu nói đến điều ngay thẳng về đạo đức; “sự công chính” giữ thuật ngữ thần học quen thuộc mà không loại trừ sắc thái công lý.
- source_word: οὐ παύσῃ
  choice: ngươi không thôi ... sao?
  rationale: Tái hiện câu hỏi tu từ mang tính quở trách của thì tương lai Hy Lạp; “ngươi” phù hợp với lời đối chất gay gắt trong ngữ cảnh.
- source_word: διαστρέφων
  choice: bẻ cong
  rationale: Giữ hình ảnh làm cong hoặc xuyên tạc điều vốn ngay thẳng, đồng thời kết hợp tự nhiên với “đường lối ngay thẳng”.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: những đường lối ngay thẳng của Chúa
  rationale: “Đường lối” bao hàm nghĩa đen lẫn nghĩa bóng của ὁδοί; “ngay thẳng” chuyển tải εὐθείας và tạo đối ứng rõ với “bẻ cong”.
- source_word: Ὦ
  choice: Hỡi
  rationale: Giữ sắc thái xưng hô trực tiếp và nhấn mạnh của tiểu từ Hy Lạp; tuy trang trọng, từ này vẫn dễ hiểu trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dịch δικαιοσύνη
  choice: sự công chính
  alternative: công lý
  rationale: Trong ngữ cảnh, nghĩa đạo đức—điều đúng đắn, ngay thẳng—nổi bật hơn; tuy nhiên, từ Hy Lạp cũng có thể mang nghĩa “công lý”, nên ghi nhận phương án ấy trong chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và mạnh mẽ, phù hợp với lời quở trách trực tiếp. Dùng “ngươi” để giữ khoảng cách và cường độ đối chất; giữ chuỗi danh xưng song song của nguyên văn.
