  naturalness: Văn phong trang trọng, hiện đại và phù hợp ngữ cảnh đối chất. «Hỡi», «ngươi», và «không thôi ... sao?» đều dùng được trong văn phong Kinh Thánh. Sửa một cụm từ vựng sẽ cải thiện độ chính xác mà không làm thay đổi giọng điệu.
  terminology: «Con của ma quỷ», «sự công chính», «đường lối ... của Chúa» và chú thích cho δικαιοσύνη đều nhất quán với nguyên văn và lựa chọn thuật ngữ nêu trong hồ sơ tiếng Anh. Chú thích được neo đúng tại «công chính».
