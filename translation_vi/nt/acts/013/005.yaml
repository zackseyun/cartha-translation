id: ACT.13.5
reference: Acts 13:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ γενόμενοι ἐν Σαλαμῖνι κατήγγελλον τὸν λόγον τοῦ θεοῦ ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων· εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: vi
  text: Khi đến Sa-la-min[a], họ công bố lời của Đức Chúa Trời trong các hội đường của người Do Thái. Họ cũng có Giăng làm người phụ tá.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi đến Sa-la-min.”'
    reason: lexical_alternative
  - marker: b
    text: “Người phụ tá” cũng có thể dịch là “người trợ giúp” hoặc “người phục vụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: Khi đến Sa-la-min
  rationale: Cụm phân từ bất định với địa điểm diễn tả việc đến một nơi; cách dịch này tự nhiên trong tiếng Việt và giữ quan hệ thời gian với hành động chính.
- source_word: κατήγγελλον
  choice: công bố
  rationale: Động từ chỉ việc loan báo công khai. “Công bố” giữ được sắc thái ấy mà không thu hẹp nghĩa thành một hình thức giảng dạy cụ thể.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  rationale: Cách dịch minh bạch, giữ cấu trúc sở hữu và không xác định quá mức rằng λόγος chỉ có nghĩa là bài giảng hay thông điệp.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: trong các hội đường của người Do Thái
  rationale: “Hội đường” là cách gọi quen thuộc cho nơi hội họp và thờ phượng của cộng đồng Do Thái; ở đây Ἰουδαίων mang nghĩa dân tộc–tôn giáo hơn là chỉ cư dân miền Giu-đê.
- source_word: εἶχον δὲ καὶ Ἰωάννην
  choice: Họ cũng có Giăng
  rationale: “Cũng” truyền đạt lực bổ sung của καί, còn δέ là chuyển ý nhẹ nên được thể hiện tự nhiên bằng việc mở câu mới.
- source_word: ὑπηρέτην
  choice: người phụ tá
  rationale: Từ này chỉ người trợ giúp hoặc phục vụ trong vai trò cấp dưới. “Người phụ tá” phù hợp với bối cảnh hành trình truyền giáo và tránh sắc thái nô lệ không có trong từ ngữ này.
theological_decisions:
- issue: Cách diễn đạt τὸν λόγον τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  alternative: sứ điệp của Đức Chúa Trời
  rationale: Giữ nghĩa rộng và hình thức gần nguyên văn, không giới hạn “lời” vào riêng nội dung được rao giảng tại đây.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng các tên quen thuộc “Sa-la-min” và “Giăng”; câu được tách nhẹ ở δέ để văn phong tự nhiên mà vẫn giữ quan hệ bổ sung của mệnh đề cuối.
