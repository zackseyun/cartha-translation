id: ACT.13.36
reference: Acts 13:36
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: vi
  text: Vì Đa-vít, sau khi đã phục vụ ý định của Đức Chúa Trời trong thế hệ mình[d], đã an giấc[a], được quy tụ về cùng các tổ phụ mình[b], và đã thấy sự mục nát[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “An giấc” là cách nói uyển ngữ trong Kinh Thánh về cái chết.
    reason: cultural_note
  - marker: b
    text: Nguyên văn dùng một thành ngữ kiểu Hê-bơ-rơ, theo nghĩa đen là “được thêm vào với các tổ phụ mình”; nghĩa là gia nhập cùng tổ tiên trong sự chết.
    reason: lexical_alternative
  - marker: c
    text: Tức là thân xác ông đã bị phân hủy; xem sự tương phản trong câu kế tiếp.
    reason: cross_reference
  - marker: d
    text: 'Cũng có thể hiểu: “sau khi phục vụ thế hệ mình theo ý định của Đức Chúa Trời.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: trong thế hệ mình
  rationale: Cụm ở cách dữ giữ nghĩa chỉ phạm vi hoặc thời kỳ Đa-vít phục vụ, đồng thời tránh diễn giải quá mức rằng thế hệ ấy là đối tượng thụ hưởng.
- source_word: ὑπηρετήσας
  choice: sau khi phục vụ
  rationale: Phân từ bất định chỉ hành động xảy ra trước các động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và không thu hẹp nghĩa vào chức vụ tôn giáo.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: ý định của Đức Chúa Trời
  rationale: βουλή có thể chỉ ý định, mục đích, kế hoạch hay quyết định. “Ý định” trang trọng, dễ hiểu và không áp đặt một hệ thống thần học hẹp hơn.
- source_word: ἐκοιμήθη
  choice: đã an giấc
  rationale: Giữ hình ảnh uyển ngữ về cái chết trong nguyên văn, đồng thời là cách nói tự nhiên và trang trọng trong tiếng Việt.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: được quy tụ về với các tổ phụ mình
  rationale: Chuyển tải thành ngữ kiểu Hê-bơ-rơ nói về việc cùng hàng với tổ tiên trong sự chết; “quy tụ về” tự nhiên hơn cách dịch máy móc “được thêm vào”.
- source_word: εἶδεν διαφθοράν
  choice: đã trải qua sự mục nát
  rationale: Diễn đạt đúng ý thân xác bị phân hủy và giữ danh từ “sự mục nát,” vốn quan trọng đối với sự đối chiếu ở câu kế tiếp.
theological_decisions:
- issue: Cách diễn đạt uyển ngữ về cái chết của Đa-vít
  choice: đã an giấc
  alternative: đã chết
  rationale: Nguyên văn dùng κοιμάομαι thay vì động từ trực tiếp chỉ cái chết. Giữ uyển ngữ bảo tồn hình ảnh Kinh Thánh mà không suy diễn thêm về trạng thái sau khi chết.
- issue: Ý nghĩa của βουλή khi nói về hành động của Đức Chúa Trời
  choice: ý định của Đức Chúa Trời
  alternative: mục đích của Đức Chúa Trời; kế hoạch của Đức Chúa Trời; quyết định của Đức Chúa Trời
  rationale: “Ý định” giữ được yếu tố chủ ý của Đức Chúa Trời nhưng không buộc từ này vào một sắc thái thần học duy nhất.
- issue: Quan hệ cú pháp giữa ἰδίᾳ γενεᾷ, ὑπηρετήσας và τῇ τοῦ θεοῦ βουλῇ
  choice: phục vụ ý định của Đức Chúa Trời trong thế hệ mình
  alternative: theo ý định của Đức Chúa Trời mà phục vụ thế hệ mình
  rationale: Hai cụm cách dữ cho phép hơn một cách gắn kết cú pháp. Bản chính theo cách hiểu phổ biến và tự nhiên, còn chú thích bảo tồn cách hiểu hợp lý khác.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ các hình ảnh Kinh Thánh quan trọng, đồng thời dùng chú thích để giải thích thành ngữ và bảo tồn sự mơ hồ cú pháp thực sự của nguyên văn.
