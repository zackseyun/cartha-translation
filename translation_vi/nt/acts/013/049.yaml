id: ACT.13.49
reference: Acts 13:49
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: vi
  text: Và lời Chúa[a] cứ được truyền đi khắp cả vùng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “sứ điệp của Chúa.”
    reason: Nêu nghĩa theo ngữ cảnh của λόγος mà không thay thế cách dịch chính vốn giữ mô-típ văn chương “lời Chúa” trong Công Vụ.
lexical_decisions:
- source_word: διεφέρετο
  choice: cứ được truyền đi
  rationale: Thể chưa hoàn thành bị động diễn tả hành động đang tiếp diễn trong quá khứ; “cứ được truyền đi” giữ được cả sắc thái tiếp diễn lẫn ý bị động mà vẫn tự nhiên trong tiếng Việt.
- source_word: δὲ
  choice: Và
  rationale: Ở đây δέ là từ nối nhẹ để tiếp tục mạch thuật chuyện, không nhất thiết biểu thị tương phản.
- source_word: ὁ λόγος
  choice: lời
  rationale: Trong Công Vụ, λόγος thường chỉ sứ điệp được rao giảng. “Lời” giữ được cách diễn đạt lặp lại của tác giả, còn chú thích nêu rõ nghĩa theo ngữ cảnh.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: “Lời Chúa” là cách diễn đạt tự nhiên và trang trọng trong tiếng Việt, đồng thời giữ nguyên độ rộng về quan hệ của sở hữu cách Hy Lạp.
- source_word: δι’ ὅλης
  choice: khắp cả
  rationale: διά với sở hữu cách diễn tả sự lan rộng xuyên suốt một địa bàn, còn ὅλης nhấn mạnh toàn bộ phạm vi.
- source_word: τῆς χώρας
  choice: vùng
  rationale: χώρα ở đây chỉ khu vực địa lý xung quanh, không phải một quốc gia theo nghĩa hiện đại; “vùng” là cách gọi rõ ràng và tự nhiên.
theological_decisions:
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: chủ
  rationale: “Chúa” giữ được ý nghĩa thần học và âm hưởng đặc trưng của κύριος trong Công Vụ, mà không thu hẹp từ này thành quan hệ chủ-tớ thông thường.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Cứ được truyền đi” thể hiện diễn tiến liên tục; “khắp cả vùng” tránh gợi ý sai rằng χώρα là một quốc gia hiện đại.
