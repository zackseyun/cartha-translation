id: ACT.13.35
reference: Acts 13:35
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀διότι καὶ ἐν ἑτέρῳ λέγει· Οὐ δώσεις τὸν ὅσιόν σου ἰδεῖν διαφθοράν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: vi
  text: 'Vì thế, Ngài cũng phán trong một thi thiên khác[a]: “Ngài sẽ không để Đấng Thánh[b] của Ngài thấy sự mục nát[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ở một chỗ khác” hoặc “trong một đoạn khác”; tiếng Hy Lạp chỉ nói “trong một [điều] khác.”
    reason: lexical_alternative
  - marker: b
    text: Hay “người trung tín của Ngài.”
    reason: lexical_alternative
  - marker: c
    text: Hay “sự hư hoại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Vì thế
  rationale: Trong mạch lập luận, từ này dẫn ra hệ luận và thêm một chứng cứ Kinh Thánh; “Vì thế” diễn đạt tự nhiên chức năng suy luận.
- source_word: καὶ
  choice: cũng
  rationale: Diễn đạt ý bổ sung thêm một lời chứng Kinh Thánh.
- source_word: ἐν ἑτέρῳ
  choice: trong một thi thiên khác
  rationale: Nguyên văn chỉ nói “trong một [đoạn] khác”, nhưng danh từ được lược bỏ; câu trích đến từ Thi Thiên 16, nên bổ sung “thi thiên” giúp câu rõ ràng mà vẫn theo đúng ngữ cảnh.
- source_word: λέγει
  choice: Ngài phán
  rationale: Giữ thì hiện tại của công thức trích dẫn Kinh Thánh và chủ thể hàm ẩn là Đức Chúa Trời; “phán” phù hợp với lời của Đức Chúa Trời trong văn phong trang trọng.
- source_word: Οὐ δώσεις
  choice: Ngài sẽ không để
  rationale: δίδωμι đi với động từ nguyên mẫu ở đây mang nghĩa cho phép; “không để” là cách nói tự nhiên trong tiếng Việt.
- source_word: τὸν ὅσιόν σου
  choice: Đấng Thánh của Ngài
  rationale: ὅσιος có thể chỉ người thánh khiết hoặc trung tín với Đức Chúa Trời. Trong văn cảnh Công Vụ 13, Phao-lô áp dụng câu này cho Chúa Giê-su; “Đấng Thánh” bảo toàn sắc thái thánh khiết và quy chiếu theo văn cảnh.
- source_word: ἰδεῖν
  choice: thấy
  rationale: Giữ hình ảnh trực tiếp của nguyên văn; “thấy sự mục nát” vẫn dễ hiểu trong tiếng Việt.
- source_word: διαφθοράν
  choice: sự mục nát
  rationale: Trong lập luận về sự sống lại, từ này nói đến tình trạng thân thể phân hủy; “sự mục nát” rõ nghĩa và tự nhiên hơn “sự hư hoại” trong ngữ cảnh này.
theological_decisions:
- issue: Quy chiếu về Đấng Mê-si của τὸν ὅσιόν σου
  choice: Đấng Thánh của Ngài
  alternative: người trung tín của Ngài; người thánh của Ngài
  rationale: Trong chính văn cảnh Công Vụ 13, Phao-lô áp dụng Thi Thiên 16 cho sự sống lại của Chúa Giê-su. Cách dịch này nêu đúng quy chiếu văn cảnh nhưng chú thích vẫn bảo lưu nghĩa từ vựng “người trung tín”.
- issue: Bổ sung danh từ bị lược sau ἐν ἑτέρῳ
  choice: một thi thiên khác
  alternative: một chỗ khác; một đoạn khác
  rationale: Nguyên văn để danh từ hàm ẩn. Vì lời trích thuộc Thi Thiên 16, bổ sung “thi thiên” đem lại sự rõ ràng; chú thích ghi nhận các cách dịch sát cấu trúc hơn.
- issue: Chủ thể hàm ẩn của λέγει
  choice: Ngài phán
  alternative: Kinh Thánh nói; có lời chép
  rationale: Động từ Hy Lạp không nêu rõ chủ thể, nhưng ngữ cảnh trước đó nói Đức Chúa Trời đã phán. “Ngài phán” giữ đại từ nhân xưng của cách hiểu này mà không diễn giải dài dòng.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Ngài” cho cả chủ thể phán và đại từ trong lời trích; “Đấng Thánh” viết hoa theo quy chiếu rõ ràng về Chúa Giê-su trong văn cảnh. Các dấu chú thích xuất hiện đúng tại yếu tố liên quan trong chính văn.
