id: ACT.13.13
reference: Acts 13:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: vi
  text: Sau khi rời Pa-phô bằng đường biển[a], những người cùng đi với Phao-lô[b] đến Pẹc-ghê, thuộc Pam-phy-li-a; nhưng Giăng rời họ và trở về Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Động từ Hy Lạp có thể được dịch là “ra khơi” hoặc “lên đường bằng tàu”.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Phao-lô và những người cùng đi”; sát nghĩa: “những người quanh Phao-lô”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Sau khi rời ... bằng đường biển
  rationale: Trong văn cảnh hành trình, phân từ của ἀνάγω chỉ việc ra khơi hoặc lên đường bằng tàu. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý nghĩa hàng hải.
- source_word: οἱ περὶ Παῦλον
  choice: những người cùng đi với Phao-lô
  rationale: Thành ngữ οἱ περὶ + đối cách chỉ nhóm người gắn với một nhân vật trung tâm. Cách dịch này thể hiện vai trò nổi bật của Phao-lô nhưng không diễn giải quá mức thành một chức danh chính thức.
- source_word: ἦλθον
  choice: đến
  rationale: Trong lời kể hành trình bằng tiếng Việt, “đến” truyền đạt tự nhiên việc đoàn người tới địa điểm kế tiếp.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Pẹc-ghê, thuộc Pam-phy-li-a
  rationale: Sở hữu cách xác định Pẹc-ghê là địa điểm nằm trong vùng Pam-phy-li-a; “thuộc” là cách diễn đạt địa lý tự nhiên và chính xác.
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: rời họ
  rationale: ἀποχωρέω có nghĩa là rời đi hoặc tách khỏi. “Rời họ” ngắn gọn, tự nhiên và không gán động cơ hay phán xét đạo đức cho hành động của Giăng.
- source_word: ὑπέστρεψεν
  choice: trở về
  rationale: ὑποστρέφω thường chỉ việc quay trở lại; “trở về” phù hợp với việc Giăng quay lại Giê-ru-sa-lem.
theological_decisions:
- issue: Hàm ý có thể có trong việc Giăng rời đoàn
  choice: Diễn đạt trung tính là “Giăng rời họ”
  alternative: Giăng bỏ họ / Giăng rút lui khỏi họ
  rationale: Câu này chỉ thuật lại việc Giăng tách khỏi đoàn và trở về Giê-ru-sa-lem, không nêu động cơ hay trực tiếp đánh giá hành động ấy. Vì vậy bản dịch không đưa phán xét từ văn cảnh sau vào câu này.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các địa danh phiên âm quen thuộc trong tiếng Việt; giữ cấu trúc đối lập “nhưng” của nguyên văn. Các ký hiệu chú thích [a], [b] được đặt ngay sau cụm từ tương ứng, đồng thời sửa sự lệch vị trí ký hiệu trong lớp tham khảo tiếng Anh.
