  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu: Đức Chúa Trời đã làm ứng nghiệm điều đã hứa cho hậu duệ, qua việc dấy Đức Giê-su lên; tiếp theo là lời trích Thi thiên 2:7. Tuy nhiên, “bằng việc” phản ánh chính xác hơn chức năng phương tiện của phân từ ἀναστήσας so với “khi”. Cách dịch “dấy ... lên” thích hợp để không quyết định trước giữa nghĩa dấy lên/đưa ra và nghĩa làm sống lại.'
