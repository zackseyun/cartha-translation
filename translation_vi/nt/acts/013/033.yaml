id: ACT.13.33
reference: Acts 13:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: vi
  text: 'rằng Đức Chúa Trời đã làm ứng nghiệm điều ấy cho con cái chúng ta[a] bằng việc dấy Đức Giê-su lên[b], như trong Thi thiên thứ hai cũng có chép:


    “Con là Con của Ta;

    hôm nay Ta đã sinh Con.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản có thể được hiểu là: “cho chúng ta, là con cái của họ.” Các thủ bản khác đọc: “cho con cái chúng ta.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “bằng việc làm cho Đức Giê-su sống lại từ cõi chết.” Động từ Hy Lạp cũng có thể chỉ việc dấy lên theo nghĩa đưa ra xuất hiện hoặc lập lên.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: đã làm ứng nghiệm
  rationale: Thì hoàn thành diễn tả một hành động đã hoàn tất và còn hiệu lực; cách dịch này tự nhiên, đồng thời giữ ngôn ngữ về lời hứa được ứng nghiệm trong Lu-ca–Công vụ.
- source_word: ταύτην
  choice: điều ấy
  rationale: Đại từ này chỉ về lời hứa ở văn cảnh trước. “Điều ấy” giữ nguyên tính đại từ của tiếng Hy Lạp, không tự ý thêm danh từ “lời hứa” vào câu.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: cho con cái chúng ta
  rationale: Dịch sát bản văn SBLGNT được cung cấp; “con cái” cũng có thể chỉ hậu duệ. Dị bản có ý nghĩa quan trọng được nêu trong chú thích.
- source_word: ἀναστήσας Ἰησοῦν
  choice: khi dấy Đức Giê-su lên
  rationale: Phân từ bất định được diễn đạt theo chức năng trạng ngữ. “Dấy ... lên” giữ được phần nào sự mở giữa nghĩa làm cho xuất hiện/đặt lên và nghĩa làm cho sống lại.
- source_word: γέγραπται
  choice: có chép
  rationale: Đây là công thức tiếng Việt tự nhiên để dẫn Kinh Thánh, phù hợp với thể hoàn thành bị động và hàm ý lời đã chép vẫn có thẩm quyền.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: Thi thiên thứ hai
  rationale: Theo sát cách gọi trong tiếng Hy Lạp và vẫn rõ ràng, tự nhiên trong tiếng Việt.
- source_word: Υἱός μου εἶ σύ
  choice: Con là Con của Ta
  rationale: Giữ lời xác nhận trực tiếp và trật tự tự nhiên trong tiếng Việt; chữ “Con” viết hoa phù hợp ngữ cảnh lời Đức Chúa Trời phán với Đấng Mê-si.
- source_word: σήμερον γεγέννηκά σε
  choice: hôm nay Ta đã sinh Con
  rationale: Dịch trực tiếp γεννάω và giữ sức nặng liên văn bản của Thi thiên 2:7 mà không diễn giải câu này theo một hệ thần học riêng.
theological_decisions:
- issue: Ý nghĩa của ἀναστήσας Ἰησοῦν trong văn cảnh
  choice: “khi dấy Đức Giê-su lên” để giữ sự mơ hồ giữa việc Đức Chúa Trời làm cho Ngài xuất hiện/đặt Ngài lên và việc khiến Ngài sống lại
  alternative: “khi làm cho Đức Giê-su sống lại từ cõi chết” hoặc “khi đưa Đức Giê-su xuất hiện”
  rationale: Các câu kế tiếp nói rõ về sự sống lại, nhưng Công vụ cũng dùng ἀνίστημι theo nghĩa Đức Chúa Trời dấy lên một người lãnh đạo hay Đấng giải cứu. Bản dịch chính không quyết định thay cho độc giả.
- issue: Ý nghĩa Cơ Đốc luận của câu “hôm nay Ta đã sinh Con”
  choice: Giữ nguyên lời trích dẫn trực tiếp, không thêm phần giải nghĩa
  alternative: Diễn giải là ngôn ngữ đăng quang/nhận làm con hoặc là sự xác chứng qua việc sống lại
  rationale: Đây là lời trích Thi thiên 2:7. Việc triển khai câu ấy để giải quyết các tranh luận thần học về sau sẽ vượt quá nhiệm vụ dịch thuật.
translation_notes:
  register: Văn phong tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” và đại từ “Ta/Con” theo ngữ cảnh lời phán. Cụm “dấy ... lên” được giữ vì vừa có sắc thái Kinh Thánh quen thuộc vừa không xóa bỏ sự mơ hồ của nguyên ngữ.
