id: ACT.13.15
reference: Acts 13:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: vi
  text: 'Sau phần đọc Luật pháp và các sách Tiên tri, những người phụ trách hội đường gửi lời nhắn đến họ: “Thưa các anh em, nếu anh em có lời khích lệ[a] nào dành cho dân chúng, xin cứ nói.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lời khích lệ” cũng có thể dịch là “lời khuyên nhủ”; từ Hy Lạp có thể mang cả hai sắc thái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: phần đọc
  rationale: Chỉ việc đọc Kinh Thánh thành tiếng trong buổi nhóm tại hội đường; “phần đọc” tự nhiên và gợi đúng một phần trong nghi thức.
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: Luật pháp và các sách Tiên tri
  rationale: Chỉ hai bộ phận Kinh Thánh được đọc trong hội đường. Thêm “các sách” trước “Tiên tri” giúp tiếng Việt tránh bị hiểu là những nhân vật tiên tri đang được đọc.
- source_word: ἀρχισυνάγωγοι
  choice: những người quản lý hội đường
  rationale: Chỉ các viên chức phụ trách hội đường và buổi nhóm, không hàm ý quyền cai trị dân sự.
- source_word: ἀπέστειλαν πρὸς αὐτοὺς λέγοντες
  choice: sai người nhắn với họ
  rationale: Diễn đạt tự nhiên hành động truyền lời đến Phao-lô và những người đồng hành; không khẳng định đích danh người đưa tin.
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa các anh em
  rationale: Giữ sắc thái xưng hô kính trọng, thân thuộc và giống đực của cụm Hy Lạp, phù hợp với những người đàn ông đang được mời phát biểu.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν
  choice: nếu trong các ông có ... nào
  rationale: Giữ cấu trúc tương đối phi nhân xưng của nguyên văn, đồng thời dùng đại từ lịch sự phù hợp với lời mời trong bối cảnh hội đường.
- source_word: λόγος παρακλήσεως
  choice: lời khích lệ
  rationale: παράκλησις có thể bao gồm cả khích lệ lẫn khuyên nhủ; “lời khích lệ” tự nhiên trong câu, còn độ rộng nghĩa được ghi ở chú thích.
- source_word: πρὸς τὸν λαόν
  choice: dành cho dân chúng
  rationale: Thể hiện dân chúng là đối tượng tiếp nhận lời phát biểu.
- source_word: λέγετε
  choice: xin cứ nói
  rationale: Chuyển mệnh lệnh thành lời mời lịch sự, tự nhiên trong tiếng Việt mà vẫn giữ lực thúc giục phát biểu.
theological_decisions:
- issue: Cách xưng hô mang giống đực trong bối cảnh hội đường
  choice: Thưa các anh em
  alternative: Thưa anh chị em
  rationale: Ἄνδρες ἀδελφοί mang hình thức giống đực và ở đây trực tiếp hướng đến nhóm khách nam được mời nói; không mở rộng thành cách gọi bao gồm cả nữ giới.
- issue: Sắc thái của παράκλησις
  choice: lời khích lệ, kèm chú thích về nghĩa “khuyên nhủ”
  alternative: lời khuyên nhủ
  rationale: Ngữ cảnh không buộc phải chọn riêng sắc thái an ủi/khích lệ hay khuyên bảo/thúc giục, nên bản dịch chính chọn cách nói tự nhiên và chú thích bảo tồn độ rộng nghĩa.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “hội đường” theo cách gọi quen thuộc; “các ông” duy trì phép xưng hô lịch sự và đối tượng nam trong nguyên văn. Dấu chú thích [a] được đặt ngay sau câu chứa cụm cần giải thích.
