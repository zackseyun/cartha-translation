  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: vi
  text: Và các môn đồ được tràn đầy niềm vui và Đức Thánh Linh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và các môn đồ tràn đầy niềm vui và Đức Thánh Linh.” Động từ Hy Lạp ở thể chưa hoàn thành có thể diễn tả tình trạng đang tiếp diễn hoặc lặp lại trong quá khứ.'
    reason: Nêu phương án tiếng Việt không biểu thị rõ thể bị động, đồng thời giải thích sắc thái thể chưa hoàn thành của động từ Hy Lạp mà không thêm ý “vẫn”.
lexical_decisions:
- source_word: οἵ τε
  choice: Và
  rationale: τε nối câu này với diễn tiến trước đó. “Và” giữ được lực liên kết mà không thêm sắc thái đối lập vốn không được biểu đạt rõ trong nguyên văn.
- source_word: μαθηταὶ
  choice: các môn đồ
  rationale: Đây là cách gọi quen thuộc, chính xác và trang trọng dành cho những người tin theo Chúa trong văn cảnh này.
- source_word: ἐπληροῦντο
  choice: vẫn được tràn đầy
  rationale: Thể chưa hoàn thành và thể bị động gợi một tình trạng hay hành động tiếp diễn hoặc lặp lại trong quá khứ. “Vẫn được tràn đầy” diễn đạt tự nhiên cả tính tiếp diễn lẫn thể bị động.
- source_word: χαρᾶς
  choice: niềm vui
  rationale: Sau động từ chỉ sự đầy tràn, sở hữu cách trong tiếng Hy Lạp nêu nội dung làm cho đầy; “niềm vui” là cách diễn đạt trực tiếp và tự nhiên trong tiếng Việt.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Trong sách Công Vụ, cụm từ này thường chỉ Thánh Linh của Đức Chúa Trời đang hành động trong sứ mạng của Hội Thánh. “Đức Thánh Linh” là danh xưng trang trọng, quen thuộc và thể hiện đối tượng xác định trong văn cảnh.
theological_decisions:
- issue: πνεύματος ἁγίου chỉ một ngôi vị thần linh hay chỉ một trạng thái thiêng liêng
  choice: Đức Thánh Linh
  alternative: linh thiêng / thánh linh
  rationale: Cách dùng xuyên suốt sách Công Vụ và văn cảnh truyền giáo ở đây ủng hộ việc hiểu cụm từ là chỉ Đức Thánh Linh đang hành động, chứ không đơn thuần là một phẩm chất hay tâm trạng thiêng liêng.
- issue: Sắc thái của thể chưa hoàn thành ἐπληροῦντο
  choice: vẫn được tràn đầy
  alternative: được tràn đầy
  rationale: Giữ sắc thái tiếp diễn hoặc lặp lại mà không khẳng định quá mức chính xác cách thức hay khoảng thời gian của sự đầy tràn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tràn đầy” tự nhiên hơn “đầy dẫy” trong tiếng Việt hiện nay; “vẫn được” bảo toàn thể bị động và sắc thái tiếp diễn mà không làm câu nặng nề.
