  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: vi
  text: Nhưng Sau-lơ[a], cũng có tên là Phao-lô, được đầy dẫy Đức Thánh Linh, nhìn chăm chú vào ông ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “cũng được gọi là Phao-lô.”'
    reason: Cách dịch khác của ὁ καὶ Παῦλος, nhấn mạnh việc Sau-lơ được gọi bằng tên Phao-lô.
lexical_decisions:
- source_word: Σαῦλος
  choice: Sau-lơ
  rationale: Phiên âm tên riêng theo cách dùng quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: δέ
  choice: Nhưng
  rationale: Diễn tả bước chuyển nhẹ có sắc thái tương phản khi câu chuyện chuyển sang phản ứng của Sau-lơ.
- source_word: ὁ καὶ Παῦλος
  choice: cũng có tên là Phao-lô
  rationale: Cụm đồng vị xác định Sau-lơ bằng một tên khác; cách dịch này tự nhiên và không suy đoán lý do tên Phao-lô được giới thiệu.
- source_word: πλησθεὶς
  choice: được đầy dẫy
  rationale: Giữ sắc thái bị động của phân từ aorist và diễn đạt trạng thái được Thánh Linh làm cho đầy dẫy.
- source_word: πνεύματος ἁγίου
  choice: Đức Thánh Linh
  rationale: Trong ngữ cảnh sách Công Vụ, cụm này chỉ Thánh Linh của Đức Chúa Trời; danh xưng được viết hoa theo lối dùng tiếng Việt.
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Truyền đạt hành động nhìn cố định, liên tục và đầy chú ý mà không dùng cách diễn đạt quá nặng.
- source_word: εἰς αὐτόν
  choice: ông ta
  rationale: Sau động từ chỉ sự nhìn chăm chú, giới từ εἰς đánh dấu đối tượng của ánh nhìn; đại từ chỉ Ê-ly-ma trong ngữ cảnh.
theological_decisions:
- issue: Cách hiểu πνεύματος ἁγίου
  choice: Đức Thánh Linh
  alternative: một linh thánh
  rationale: Ngữ cảnh ban quyền năng và cách dùng nhất quán trong Công Vụ cho thấy đây là Thánh Linh của Đức Chúa Trời, không phải một thần linh bất định.
- issue: Quan hệ giữa hai tên Sau-lơ và Phao-lô
  choice: cũng có tên là Phao-lô
  alternative: cũng chính là Phao-lô
  rationale: Giữ chức năng nhận diện của ὁ καὶ Παῦλος nhưng không hàm ý rằng nhân vật vừa đổi tên hay giải thích tại sao ông có hai tên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “được đầy dẫy” để giữ thể bị động của nguyên văn; “chăm chú nhìn” diễn đạt tự nhiên cường độ của ἀτενίζω.
