  text: Then[a], after fasting and praying and laying their hands on them, they sent them off.
translation:
  language: vi
  text: Bấy giờ, sau khi kiêng ăn, cầu nguyện và đặt tay trên hai người, họ tiễn hai người lên đường.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “họ cho hai người đi” hay “họ thả hai người ra.” Trong ngữ cảnh, ý là Ba-na-ba và Sau-lơ được để lên đường thi hành sứ mạng.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Trạng từ chỉ thời gian và trình tự, nối hành động này với sự chỉ dẫn của Đức Thánh Linh trong câu trước; cách diễn đạt tự nhiên và trang trọng trong văn thuật chuyện.
- source_word: νηστεύσαντες
  choice: sau khi kiêng ăn
  rationale: Phân từ bất định quá khứ diễn tả hành động chuẩn bị xảy ra trước động từ chính; “sau khi” làm rõ trình tự mà vẫn tự nhiên.
- source_word: προσευξάμενοι
  choice: cầu nguyện
  rationale: Phân từ phối hợp với hành động kiêng ăn; được đặt dưới phạm vi của “sau khi” để diễn tả chuỗi hành động chuẩn bị một cách gọn và rõ.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: đặt tay trên hai người
  rationale: Giữ nguyên hành động cụ thể trong tiếng Hy Lạp, không diễn giải thành một nghi thức mang ý nghĩa hệ phái; “hai người” làm rõ đối tượng là Ba-na-ba và Sau-lơ theo văn cảnh.
- source_word: ἀπέλυσαν
  choice: họ để hai người ra đi
  rationale: Động từ có thể mang nghĩa thả, cho phép đi hoặc tiễn đi. Trong văn cảnh sứ mạng, “để ... ra đi” vừa tự nhiên vừa giữ được sắc thái cho phép/rời đi, không nói quá thành việc sai phái theo nghĩa kỹ thuật.
theological_decisions:
- issue: Ý nghĩa của hành động đặt tay
  choice: Mô tả trực tiếp là “đặt tay trên hai người” mà không định danh nghi thức.
  alternative: phong chức; ban phước; chính thức sai phái
  rationale: Câu này thuật lại việc kiêng ăn, cầu nguyện, đặt tay và để họ ra đi, nhưng không tự xác định địa vị giáo hội hay ý nghĩa bí tích của hành động ấy.
- issue: Sắc thái của ἀπέλυσαν trong việc sai đi
  choice: “để hai người ra đi”
  alternative: “sai hai người lên đường”; “tiễn hai người đi”; “cho hai người đi”
  rationale: Cách dịch được chọn bảo tồn khả năng nghĩa “cho phép/thả cho ra đi” của động từ, đồng thời phù hợp với việc Ba-na-ba và Sau-lơ khởi hành thi hành sứ mạng theo văn cảnh.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “kiêng ăn” thay vì thuật ngữ ít phổ thông hơn; cấu trúc câu giữ chuỗi hành động của nguyên văn. Đại từ “hai người” tránh sự mơ hồ của “họ” khi trong câu có cả cộng đồng sai đi lẫn Ba-na-ba và Sau-lơ.
