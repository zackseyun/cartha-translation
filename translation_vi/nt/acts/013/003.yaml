  to: Bấy giờ, sau khi kiêng ăn, cầu nguyện và đặt tay trên hai người, họ tiễn hai người lên đường.[a]
  rationale: Dời dấu chú thích đến động từ chính để chú thích đúng ἀπέλυσαν. Thay “để hai người ra đi” bằng “tiễn hai người lên đường” nhằm đạt cách dùng tiếng Việt hiện đại tự nhiên hơn và phản ánh ngữ cảnh, trong khi chú thích vẫn bảo tồn các nghĩa từ vựng thay thế. Các hành động kiêng ăn, cầu nguyện và đặt tay được giữ nguyên, không gán ý nghĩa giáo phái cho việc đặt tay.
