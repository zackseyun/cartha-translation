source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: vi
  text: 'Và bây giờ, kìa, tay Chúa giáng trên ngươi: ngươi sẽ bị mù, không thấy mặt trời trong một thời gian. Lập tức, một làn sương mù và bóng tối ập xuống người ấy; người ấy đi quanh, tìm người để dắt mình đi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng thu hút sự chú ý và sắc thái trang trọng của từ Hy Lạp, đồng thời vẫn tự nhiên trong văn phong Kinh Thánh tiếng Việt.
- source_word: χεὶρ κυρίου
  choice: tay Chúa
  rationale: Giữ nguyên hình ảnh thành ngữ chỉ quyền năng và hành động của Chúa; trong ngữ cảnh này, đó là hành động phán xét.
- source_word: ἔσῃ τυφλὸς
  choice: ngươi sẽ bị mù
  rationale: Diễn đạt tự nhiên sự chuyển sang tình trạng mù được báo trước bởi thể tương lai.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: không thấy mặt trời
  rationale: Giữ hình ảnh cụ thể của nguyên văn, không khái quát thành 'không thấy ánh sáng'.
- source_word: ἄχρι καιροῦ
  choice: trong một thời gian
  rationale: Diễn đạt khoảng thời gian tạm thời nhưng không xác định; tránh hiểu cứng ἄχρι theo nghĩa một mốc thời gian đã biết.
- source_word: παραχρῆμα
  choice: lập tức
  rationale: Thể hiện rõ tính tức thời của sự việc.
- source_word: ἀχλὺς καὶ σκότος
  choice: một màn sương mờ và bóng tối
  rationale: Giữ hai hình ảnh riêng biệt của nguyên văn; 'màn sương mờ' diễn tả sự che mờ thị giác, còn 'bóng tối' diễn tả tình trạng tối tăm.
- source_word: περιάγων
  choice: đi quanh
  rationale: Phản ánh sát động tác di chuyển quanh được phân từ mô tả, không thêm ý 'dò dẫm' dù ngữ cảnh có thể gợi điều đó.
- source_word: ἐζήτει χειραγωγούς
  choice: tìm người dắt tay mình
  rationale: Giữ nghĩa cụ thể của χειραγωγός là người dẫn một người khác bằng tay, thay vì chỉ nói chung là 'người dẫn đường'.
theological_decisions:
- issue: Ý nghĩa của 'tay Chúa'
  choice: Giữ nguyên thành ngữ 'tay Chúa' trong lời phán xét.
  alternative: Sự phán xét của Chúa giáng trên ngươi; Chúa sẽ đánh ngươi.
  rationale: Cụm từ biểu thị quyền năng chủ động của Chúa và trong ngữ cảnh là sự phán xét, nhưng bản dịch không nên thay hình ảnh Kinh Thánh bằng một cách giải nghĩa thần học cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng 'ngươi' vì đây là lời đối chất trực tiếp, nghiêm khắc; dùng 'ông ta' trong lời kể để phân biệt tự nhiên với đại từ ngôi thứ hai. Không thêm chú thích vì các khả năng nghĩa quan trọng đã có thể được thể hiện rõ trong chính văn.
