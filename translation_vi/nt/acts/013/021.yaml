id: ACT.13.21
reference: Acts 13:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: vi
  text: Rồi sau đó, họ xin một vị vua[a], và Đức Chúa Trời ban cho họ Sau-lơ, con trai của Kích, một người thuộc bộ tộc Bên-gia-min, trong bốn mươi năm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Và từ đó, họ xin một vị vua.” Từ mở đầu có thể chỉ sự chuyển tiếp trong trình tự lịch sử.'
    reason: lexical_alternative
  - marker: b
    text: Cụm “trong bốn mươi năm” có thể làm nảy sinh câu hỏi về niên đại khi đối chiếu với dữ liệu Cựu Ước; bản dịch giữ nguyên cách diễn đạt của Lu-ca.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Rồi sau đó
  rationale: Từ ghép này nối sự kiện với trình tự lịch sử trước đó. Trong tiếng Việt, “Rồi sau đó” diễn đạt tự nhiên chức năng chuyển tiếp theo thời gian; cách dịch sát hình thức “và từ đó” dễ bị hiểu là chỉ địa điểm.
- source_word: ᾐτήσαντο βασιλέα
  choice: họ xin một vị vua
  rationale: Động từ chỉ việc dân chúng xin cho mình, không nhất thiết mang sắc thái mạnh như “đòi”; danh từ không có mạo từ nói đến loại người cai trị mà họ muốn.
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Đức Chúa Trời ban cho họ
  rationale: Giữ nguyên chủ thể được nêu rõ và nghĩa thông thường của ἔδωκεν. “Ban” tự nhiên, trang trọng trong ngữ cảnh Đức Chúa Trời đáp lời thỉnh cầu mà không thu hẹp nghĩa thành “bổ nhiệm”.
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Sau-lơ, con trai của Kích
  rationale: Dùng dạng tên riêng quen thuộc trong tiếng Việt và diễn đạt rõ quan hệ phụ tử.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: một người thuộc bộ tộc Bên-gia-min
  rationale: ἄνδρα chỉ một người nam trưởng thành, nhưng trong cụm mô tả nguồn gốc, “một người thuộc” là tự nhiên và không làm mất đối tượng nam đã được xác định là Sau-lơ. ἐκ được thể hiện bằng “thuộc” để chỉ xuất thân bộ tộc.
- source_word: ἔτη τεσσεράκοντα
  choice: trong bốn mươi năm
  rationale: Cụm đối cách diễn tả khoảng thời gian. “Trong bốn mươi năm” gắn tự nhiên với việc Đức Chúa Trời ban Sau-lơ cho họ, đồng thời không thêm động từ “trị vì” vốn không có trong câu Hy Lạp.
theological_decisions:
- issue: Quan hệ của cụm thời lượng ἔτη τεσσεράκοντα
  choice: Gắn “trong bốn mươi năm” với việc Đức Chúa Trời ban Sau-lơ cho dân.
  alternative: Hiểu cụm này rộng hơn như một phần của bản tóm lược lịch sử, hoặc diễn giải rõ là Sau-lơ trị vì bốn mươi năm.
  rationale: Theo trật tự cú pháp, cụm thời lượng gắn tự nhiên nhất với mệnh đề ngay trước đó. Bản dịch giữ nguyên cách diễn đạt của Lu-ca, không tự thêm sự hài hòa với các dữ liệu niên đại trong Cựu Ước.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” và các dạng tên riêng Kinh Thánh phổ biến trong tiếng Việt; tránh diễn giải quá mức sắc thái của lời thỉnh cầu và vấn đề niên đại.
