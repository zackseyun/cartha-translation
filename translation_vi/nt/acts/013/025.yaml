    rationale: Neo chú thích phải gắn với “Tôi không phải là Đấng ấy” (hoặc câu hỏi ngay trước đó), không phải với δρόμον/hành trình.
  - severity: low
    issue: Thiếu chú thích về cách đọc có thêm “dây dép.”
    rationale: SBLGNT chỉ có “dép/giày dép ... tháo/cởi,” không có danh từ “dây”; chú thích giúp minh bạch với truyền thống bản chép/bản dịch có “dây dép.”
  - severity: low
    issue: Một vài cách diễn đạt có thể tự nhiên hơn.
    rationale: “Anh em cho rằng tôi là ai?”, “thường nói,” và “tháo dép của Ngài” giữ ý nguyên văn đồng thời mạch lạc hơn trong tiếng Việt hiện đại.
