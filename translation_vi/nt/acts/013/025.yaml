reference: Acts 13:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: vi
  text: 'Khi Giăng đang hoàn tất hành trình của mình, ông thường nói: “Anh em cho rằng tôi là ai? Tôi không phải là Đấng ấy[a]. Nhưng kìa, có một Đấng đang đến sau tôi; tôi không xứng đáng tháo dép của Ngài[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nói rõ hơn theo ngữ cảnh: “Anh em cho rằng tôi là ai? Tôi không phải là Đấng Mê-si.” Tiếng Hy Lạp để danh tính bị phủ nhận ở dạng hàm ẩn, dù ngữ cảnh hướng đến Đấng Mê-si.'
    reason: alternative_reading
  - marker: b
    text: Một số thủ bản và bản dịch diễn đạt cụ thể hơn là “tháo dây dép của Ngài,” nhưng bản tiếng Hy Lạp được in ở đây chỉ nói “dép nơi chân Ngài ... tháo/cởi,” không có từ “dây.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: sắp hoàn tất hành trình của mình
  rationale: Diễn đạt tiến trình đang đi đến chỗ hoàn tất của nhiệm vụ hay chức vụ được giao. “Hành trình” giữ được sắc thái ẩn dụ của δρόμος mà không nhấn quá mức hình ảnh cuộc đua.
- source_word: ἔλεγεν
  choice: vẫn thường nói
  rationale: Thể chưa hoàn thành có thể chỉ lời chứng được lặp lại hoặc tiếp diễn; “vẫn thường nói” truyền đạt sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: Anh em cho tôi là ai?
  rationale: Câu hỏi nhắm đến căn tính mà người nghe gán cho Giăng. Cách nói này tự nhiên trong tiếng Việt và vẫn phản ánh ý nghĩa của ὑπονοεῖτε.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Tôi không phải là Đấng ấy
  rationale: Câu Hy Lạp lược bỏ danh tính bị phủ nhận nhưng nhấn mạnh ἐγώ. “Đấng ấy” giữ sự hàm ẩn, đồng thời rõ nghĩa hơn một câu “Tôi không phải” đứng riêng trong tiếng Việt.
- source_word: ἀλλ’ ἰδοὺ
  choice: Nhưng kìa
  rationale: “Kìa” là từ chỉ dẫn trang trọng nhưng vẫn quen thuộc, thu hút sự chú ý như ἰδού.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: có một Đấng đang đến sau tôi
  rationale: Hiện tại ἔρχεται gợi chuyển động đang diễn ra hoặc sắp xảy đến. “Một Đấng” biểu thị chủ thể ngầm và phù hợp ngữ cảnh tôn kính.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: cởi dép nơi chân Ngài
  rationale: Bản SBLGNT nói đến dép/giày dép nơi chân và động từ “cởi”, không có danh từ “dây”. Cách diễn đạt này tự nhiên trong tiếng Việt mà không thêm chi tiết dây dép.
- source_word: ἄξιος
  choice: xứng đáng
  rationale: Đây là tương đương trực tiếp và tự nhiên cho ý niệm về tư cách hay sự xứng đáng trong lời tự hạ của Giăng.
theological_decisions:
- issue: Danh tính mà Giăng phủ nhận trong οὐκ εἰμὶ ἐγώ
  choice: Giữ danh tính ở dạng hàm ẩn bằng “Tôi không phải là Đấng ấy”.
  alternative: “Tôi không phải là Đấng Mê-si.”
  rationale: Ngữ cảnh chỉ mạnh đến Đấng Mê-si, nhưng nguyên văn không gọi danh hiệu ấy ngay trong câu. Bản chính giữ mức độ hàm ẩn của tiếng Hy Lạp; chú thích nêu cách hiểu rõ hơn.
- issue: Sắc thái tôn kính đối với Đấng đến sau
  choice: Dùng “một Đấng” và đại từ “Ngài”.
  alternative: “một người” và “người ấy”
  rationale: Cách chọn này tự nhiên trong văn phong Kinh Thánh tiếng Việt và thể hiện thái độ của Giăng, nhưng không thêm danh hiệu thần học không có trong câu.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giăng” theo lối gọi quen thuộc trong Kinh Thánh tiếng Việt; giữ hình ảnh “hành trình” và sự hàm ẩn về căn tính của Đấng Mê-si. Không thêm “dây dép” vì danh từ đó không có trong bản SBLGNT.
