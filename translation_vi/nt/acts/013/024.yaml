  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: vi
  text: Trước khi Ngài đến[a], Giăng đã công bố cho toàn dân Israel phép báp-têm về sự ăn năn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trước khi Ngài xuất hiện.” Tiếng Hy Lạp dùng một thành ngữ, nghĩa là đi trước khi một người đến.
    reason: lexical_alternative
  - marker: b
    text: Hay “phép báp-têm để ăn năn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: đã rao giảng
  rationale: Phân từ bất định chỉ hành động có trước trong mạch kể; “đã rao giảng” diễn đạt tự nhiên việc Giăng công khai công bố, còn ý đi trước đã được cụm thời gian kế tiếp thể hiện.
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: trước khi Ngài đến
  rationale: Thành ngữ Hy Lạp, sát chữ là “trước mặt sự đi vào của Ngài,” mang nghĩa đi trước sự xuất hiện hay việc đến của một người. Cách dịch này tự nhiên và giữ đại từ theo nguyên văn.
- source_word: εἰσόδου
  choice: đến
  rationale: Danh từ có nghĩa đen là “sự đi vào/lối vào,” nhưng trong ngữ cảnh chỉ việc nhân vật ấy đến hoặc xuất hiện.
- source_word: βάπτισμα μετανοίας
  choice: một phép báp-têm của sự ăn năn
  rationale: Giữ tương đối sát kết cấu sở hữu cách và mối liên hệ từ vựng giữa phép báp-têm với sự ăn năn, không ấn định quan hệ này là mục đích hay kết quả.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: cho toàn dân Israel
  rationale: “Toàn dân Israel” chuyển tải cả πᾶς và λαός bằng cách diễn đạt gọn, tự nhiên trong tiếng Việt hiện đại.
- source_word: Ἰωάννου
  choice: Giăng
  rationale: Dùng dạng tên gọi Kinh Thánh quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Đối tượng của đại từ αὐτοῦ trong cụm “trước khi Ngài đến”
  choice: Giữ đại từ “Ngài,” theo ngữ cảnh chỉ Chúa Giê-su, Đấng Cứu Thế thuộc dòng Đa-vít được nhắc ở câu trước.
  alternative: Nêu rõ “trước khi Chúa Giê-su đến.”
  rationale: Ngữ cảnh Công Vụ 13:23–25 xác định đối tượng đủ rõ, nhưng câu Hy Lạp vẫn dùng đại từ; giữ đại từ tránh thêm tên riêng không có trong câu.
- issue: Quan hệ của sở hữu cách trong βάπτισμα μετανοίας
  choice: “phép báp-têm của sự ăn năn”
  alternative: “phép báp-têm để ăn năn” hoặc “phép báp-têm cho sự ăn năn”
  rationale: Sở hữu cách có thể diễn tả mối liên hệ theo nhiều sắc thái. Bản chính giữ độ mở, không biến nó thành một quan hệ mục đích rõ hơn nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để phù hợp đối tượng trong ngữ cảnh mà không đưa tên Chúa Giê-su vào câu; dùng “báp-têm” là thuật ngữ Kinh Thánh phổ biến, tránh chọn cách diễn giải mang màu sắc hệ phái.
