  source_fidelity: 'Cần điều chỉnh “đánh bại”: καθελών (καθαιρέω) trong ngữ cảnh này diễn tả việc đánh đổ/tiêu diệt các dân ấy, mạnh hơn chỉ một chiến thắng quân sự. “Tiêu diệt” phản ánh sát hơn động từ và cũng phù hợp với bản dịch tiếng Anh trong hồ sơ. Cấu trúc còn lại chuyển tải đúng bảy dân tộc, xứ Ca-na-an, đất của họ, và việc Đức Chúa Trời ban đất ấy cho Y-sơ-ra-ên làm cơ nghiệp. Người nhận không được nêu trực tiếp trong tiếng Hy Lạp, nhưng được xác định rõ bởi ngữ cảnh gần và việc nêu ra trong bản dịch là một làm rõ thành ngữ chấp nhận được.'
  naturalness: 'Bản văn tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. Đưa “cho dân Y-sơ-ra-ên” sau “làm cơ nghiệp” tạo nhịp câu rõ hơn: đất được ban với tư cách là cơ nghiệp cho họ.'
