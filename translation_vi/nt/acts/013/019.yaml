  yaml_path: translation/nt/acts/013/019.yaml
  text: And after destroying seven nations in the land of Canaan[a], he gave them their land as an inheritance.
translation:
  language: vi
  text: Sau khi tiêu diệt bảy dân tộc trong xứ Ca-na-an, Ngài ban đất của họ làm cơ nghiệp cho dân Y-sơ-ra-ên.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài phân chia đất của họ làm cơ nghiệp.” Động từ Hy Lạp có thể nhấn mạnh việc phân chia hoặc cấp phát đất như cơ nghiệp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: sau khi đánh bại
  rationale: Phân từ aorist của καθαιρέω nói đến việc Đức Chúa Trời hạ các dân Ca-na-an trong cuộc chinh phục. “Đánh bại” tự nhiên và trang trọng trong tiếng Việt, diễn đạt rõ sự lật đổ mà không nhất thiết hàm ý mọi cá nhân đều bị tiêu diệt.
- source_word: ἔθνη ἑπτὰ
  choice: bảy dân tộc
  rationale: ἔθνη có thể chỉ các dân hoặc các nước. Trong bối cảnh các cộng đồng cư trú tại Ca-na-an, “bảy dân tộc” rõ nghĩa và tự nhiên.
- source_word: ἐν γῇ Χανάαν
  choice: trong xứ Ca-na-an
  rationale: Giữ thành tố γῇ (“đất, xứ”) thay vì rút gọn thành “tại Ca-na-an”; “xứ Ca-na-an” là cách diễn đạt quen thuộc và trang trọng.
- source_word: κατεκληρονόμησεν
  choice: ban ... làm cơ nghiệp
  rationale: Động từ có sắc thái phân chia hoặc cấp đất như phần thừa hưởng. “Ban ... làm cơ nghiệp” giữ chủ đề cơ nghiệp và diễn đạt tự nhiên hành động của Đức Chúa Trời.
- source_word: τὴν γῆν αὐτῶν
  choice: đất của họ
  rationale: Đại từ αὐτῶν quy chiếu trực tiếp đến bảy dân tộc vừa được nhắc đến.
theological_decisions:
- issue: Chủ thể hành động và người nhận cơ nghiệp được hàm ý
  choice: “Ngài” là Đức Chúa Trời; dân Y-sơ-ra-ên được nêu rõ là bên nhận đất làm cơ nghiệp.
  alternative: “Ngài phân chia đất của họ làm cơ nghiệp,” không nêu rõ bên nhận.
  rationale: Mạch văn liệt kê các việc Đức Chúa Trời làm trong lịch sử Y-sơ-ra-ên. Tiếng Hy Lạp không nêu tân ngữ gián tiếp, nhưng ngữ cảnh lịch sử xác định dân Y-sơ-ra-ên là bên nhận; việc làm rõ này giúp câu tiếng Việt tự nhiên mà không thêm một khẳng định giáo lý riêng.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” theo mạch văn để chỉ Đức Chúa Trời; “cơ nghiệp” bảo tồn hình ảnh thần học-pháp lý về phần đất được ban để thừa hưởng.
