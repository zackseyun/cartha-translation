id: ACT.13.22
reference: Acts 13:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: vi
  text: 'Sau khi loại bỏ ông ấy[a], Đức Chúa Trời dấy Đa-vít lên làm vua cho họ. Về Đa-vít, Ngài cũng làm chứng và nói rằng: “Ta đã tìm thấy Đa-vít, con trai Gie-sê, một người hợp với lòng Ta[b], người sẽ thực hiện mọi điều Ta muốn[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi truất ngôi ông ấy.” Trong ngữ cảnh, “ông ấy” là Sau-lơ.'
    reason: Làm rõ đại từ và nghĩa theo ngữ cảnh của động từ mà không thay đại từ trong chính văn.
  - marker: b
    text: 'Cũng có thể dịch: “một người hợp lòng Ta.” Nguyên văn sát nghĩa là “theo/chiếu theo lòng Ta.”'
    reason: Ghi nhận cách diễn đạt quen thuộc đồng thời giải thích lựa chọn gần với cấu trúc Hy Lạp.
  - marker: c
    text: Nguyên văn dùng danh từ “ý muốn” ở số nhiều; “mọi điều Ta muốn” diễn đạt các ý định hay điều Đức Chúa Trời muốn Đa-vít thực hiện.
    reason: Bảo tồn sắc thái số nhiều vốn dễ bị làm phẳng khi dịch thành một danh từ tập hợp.
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  choice: sau khi loại bỏ ông ấy
  rationale: Giữ đại từ của nguyên văn và nghĩa rộng của μεθίστημι. Trong ngữ cảnh, đây là việc Đức Chúa Trời loại Sau-lơ khỏi ngôi vua; cách dịch này tránh thu hẹp động từ thành một thuật ngữ chính trị duy nhất.
- source_word: ἤγειρεν τὸν Δαυὶδ αὐτοῖς εἰς βασιλέα
  choice: Đức Chúa Trời dấy Đa-vít lên làm vua cho họ
  rationale: “Dấy ... lên” bảo tồn hình ảnh của ἐγείρω, còn “làm vua” làm rõ đây là việc đưa Đa-vít lên ngôi, không phải nói về sự sống lại. “Cho họ” phản ánh sắc thái lợi ích của αὐτοῖς.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: Về Đa-vít, Ngài cũng làm chứng rằng
  rationale: Tiếng Việt tự nhiên diễn đạt nội dung lời chứng là nói “về” Đa-vít. Cấu trúc này giữ sắc thái chứng nhận của μαρτυρέω mà không tạo câu tối nghĩa.
- source_word: Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί
  choice: Ta đã tìm thấy Đa-vít, con trai Gie-sê
  rationale: “Đã tìm thấy” diễn đạt hành động hoàn tất của thì aorist; cụm sở hữu được chuyển tự nhiên thành “con trai Gie-sê”.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: một người theo lòng Ta
  rationale: Bám sát cấu trúc κατά + “lòng” và tránh giải nghĩa quá mức thành cảm tình riêng hoặc phẩm chất hoàn hảo. Đây cũng là cách diễn đạt trang trọng, dễ hiểu trong văn cảnh Kinh Thánh.
- source_word: ὃς ποιήσει πάντα τὰ θελήματά μου
  choice: người sẽ thực hiện mọi điều Ta muốn
  rationale: “Sẽ thực hiện” truyền đạt ποιήσει trong văn cảnh thi hành ý định. “Mọi điều Ta muốn” là tiếng Việt tự nhiên, đồng thời thể hiện tính số nhiều của θελήματα qua “mọi điều”.
theological_decisions:
- issue: Ý nghĩa của việc Đa-vít là người κατὰ τὴν καρδίαν μου
  choice: một người theo lòng Ta
  alternative: một người hợp lòng Ta
  rationale: “Theo lòng Ta” phản ánh trực tiếp sự phù hợp với lòng và ý định của Đức Chúa Trời, nhưng không tự động khẳng định Đa-vít hoàn toàn vô tội hay chỉ nói đến sự gần gũi tình cảm.
- issue: Sắc thái của ἤγειρεν khi nói về Đa-vít
  choice: dấy Đa-vít lên làm vua
  alternative: lập Đa-vít làm vua
  rationale: Giữ hình ảnh “dấy lên” của nguyên văn và sự liên tục với lối nói Kinh Thánh; cụm “làm vua” ngăn cách hiểu đây là ngôn ngữ về sự sống lại.
- issue: Số nhiều trong τὰ θελήματά μου
  choice: mọi điều Ta muốn
  alternative: toàn bộ ý muốn của Ta
  rationale: Nguyên văn dùng danh từ số nhiều, chỉ các ý định hay điều Đức Chúa Trời muốn. Cách dịch được chọn giữ tính đa diện ấy mà vẫn tự nhiên trong tiếng Việt.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ đọc. Dùng “Đức Chúa Trời” để nêu rõ chủ thể vốn được hàm ý trong động từ Hy Lạp, tránh chuỗi đại từ khó theo dõi trong tiếng Việt. Tên riêng được phiên âm theo lối quen thuộc: Đa-vít, Gie-sê, Sau-lơ.'
