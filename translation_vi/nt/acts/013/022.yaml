  source_fidelity: 'Bản dịch truyền đạt đúng các yếu tố chính của câu: việc Sau-lơ bị loại bỏ, Đa-vít được dấy lên làm vua cho dân, lời chứng của Đức Chúa Trời về Đa-vít, và số nhiều của θελήματα qua cụm “mọi điều Ta muốn.” Tuy nhiên, “Về Đa-vít, Ngài cũng làm chứng rằng” đã gộp và làm mờ động từ εἶπεν (“nói/phán”) đứng song song với μαρτυρήσας. Bản sửa giữ rõ cả hai động từ.'
