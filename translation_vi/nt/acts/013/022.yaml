  terminology: “Đức Chúa Trời,” “dấy ... lên làm vua,” “Đa-vít,” “Gie-sê,” và đại từ tôn kính “Ta/Ngài” phù hợp văn phong Kinh Thánh tiếng Việt. “Mọi điều Ta muốn” diễn đạt tự nhiên số nhiều τὰ θελήματά μου; chú thích nêu rõ sắc thái này.
