  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: vi
  text: Đức Chúa Trời của dân này, tức Israel, đã chọn tổ phụ chúng ta[a], làm cho dân ấy trở nên lớn mạnh trong thời gian họ kiều cư tại đất Ai Cập[b], rồi dùng cánh tay giơ cao[c] dẫn họ ra khỏi đó[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tổ tiên chúng ta”. Nguyên văn Hy Lạp: “các cha chúng ta”.'
    reason: lexical_alternative
  - marker: b
    text: “Kiều cư” nghĩa là sống trên đất khách.
    reason: cultural_note
  - marker: c
    text: 'Sát nghĩa: “với một cánh tay cao”; đây là thành ngữ trong truyền thống Xuất Hành nói về quyền năng giải cứu của Đức Chúa Trời.'
    reason: cultural_note
  - marker: d
    text: 'Cũng có thể dịch: “đưa họ ra khỏi đó”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Đức Chúa Trời của dân Israel này
  rationale: Giữ Israel là tên riêng và chuyển cấu trúc Hy Lạp sang trật tự tự nhiên trong tiếng Việt; “này” liên kết với cộng đồng Israel đang được nhắc đến.
- source_word: ἐξελέξατο
  choice: đã chọn
  rationale: Diễn đạt trực tiếp động từ aorist; sắc thái trung gian không cần biểu thị riêng trong tiếng Việt.
- source_word: τοὺς πατέρας ἡμῶν
  choice: tổ phụ chúng ta
  rationale: “Tổ phụ” vừa giữ được từ ngữ giống đực của πατέρες, vừa phù hợp văn cảnh lịch sử giao ước; ghi chú nêu cách hiểu rộng hơn là “tổ tiên”.
- source_word: ὕψωσεν
  choice: làm cho dân ấy trở nên lớn mạnh
  rationale: Giữ độ rộng nghĩa giữa việc được nâng cao và được gia tăng, không thu hẹp câu chỉ vào địa vị hay dân số.
- source_word: ἐν τῇ παροικίᾳ
  choice: trong thời họ kiều cư
  rationale: “Kiều cư” biểu thị việc sống trên đất khách, phù hợp παροικία hơn cách nói chỉ một thời gian lưu trú thông thường.
- source_word: ἐν γῇ Αἰγύπτου
  choice: tại đất Ai Cập
  rationale: Phản ánh danh từ γῇ và giữ giọng văn lịch sử trang trọng mà vẫn tự nhiên.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: dùng cánh tay giơ cao
  rationale: Giữ hình ảnh cụ thể của thành ngữ Xuất Hành; “dùng” diễn đạt phương tiện tự nhiên trong tiếng Việt.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: dẫn họ ra khỏi đó
  rationale: “Dẫn ra” phản ánh ἐξάγω; “đó” quy chiếu tự nhiên về Ai Cập trong tiếng Việt.
theological_decisions:
- issue: Cách gọi các bậc tiền nhân của Israel
  choice: tổ phụ chúng ta
  alternative: tổ tiên chúng ta
  rationale: πατέρας mang hình thức giống đực và trong bài giảng tại hội đường gợi đến các bậc cha ông của lịch sử giao ước; “tổ tiên” vẫn là một cách hiểu từ vựng có thể có.
- issue: Ý nghĩa của ὕψωσεν tại Ai Cập
  choice: làm cho dân ấy trở nên lớn mạnh
  alternative: nâng cao dân ấy; làm cho dân ấy gia tăng
  rationale: Động từ có thể nói đến sự nâng cao hoặc gia tăng. Bản dịch chính giữ cả hai khả năng thay vì quyết định rằng câu chỉ nói về địa vị hay số lượng.
- issue: Hình ảnh cánh tay giơ cao
  choice: giữ nguyên ẩn dụ “cánh tay giơ cao”
  alternative: bằng quyền năng mạnh mẽ
  rationale: Cụm từ vọng lại truyền thống Xuất Hành và mô tả quyền năng giải cứu của Đức Chúa Trời; giữ hình ảnh tránh làm mất liên hệ Kinh Thánh.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Đức Chúa Trời” theo văn phong Kinh Thánh phổ thông; “tổ phụ” và “kiều cư” duy trì sắc thái lịch sử mà các chú thích hỗ trợ người đọc. Cấu trúc câu được làm tự nhiên trong tiếng Việt nhưng vẫn bảo toàn chuỗi hành động và các hình ảnh của nguyên văn.
