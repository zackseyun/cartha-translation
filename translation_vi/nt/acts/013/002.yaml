id: ACT.13.2
reference: Acts 13:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: vi
  text: 'Trong khi họ đang phụng sự Chúa và kiêng ăn[a], Đức Thánh Linh phán: “Hãy biệt riêng Ba-na-ba và Sau-lơ cho Ta, để làm công việc mà Ta đã gọi họ đến làm.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thờ phượng Chúa.” Động từ Hy Lạp có thể chỉ sự phục vụ mang sắc thái thờ phượng hoặc nghi lễ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: phụng sự
  rationale: Động từ chỉ sự phục vụ mang sắc thái thờ phượng hoặc nghi lễ. “Phụng sự” giữ được cả ý phục vụ lẫn lòng tôn kính, mà không giới hạn câu vào một nghi thức cụ thể.
- source_word: τῷ κυρίῳ
  choice: Chúa
  rationale: Thể tặng cách chỉ Đấng mà sự phụng sự hướng đến. Cách nói “phụng sự Chúa” tự nhiên trong tiếng Việt và bảo toàn quan hệ ngữ pháp ấy.
- source_word: νηστευόντων
  choice: kiêng ăn
  rationale: Cách diễn đạt rõ ràng, thông dụng cho hành động nhịn ăn vì mục đích tôn giáo; hai phân từ cho thấy hành động này diễn ra đồng thời với việc phụng sự Chúa.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Danh xưng quen thuộc, trang trọng trong tiếng Việt, đồng thời giữ nguyên Đức Thánh Linh là chủ thể trực tiếp phán bảo.
- source_word: Ἀφορίσατε
  choice: Hãy biệt riêng
  rationale: Diễn đạt hành động tách riêng người nào đó cho một mục đích đặc biệt, không thu hẹp thành việc bổ nhiệm vào một chức vụ kỹ thuật.
- source_word: δή
  choice: hàm ý thúc giục trong mệnh lệnh
  rationale: Tiểu từ tạo sắc thái nhấn mạnh hoặc cấp thiết. Tiếng Việt đã thể hiện tự nhiên qua cấu trúc mệnh lệnh “Hãy”, nên không cần thêm một từ riêng dễ gây nặng câu.
- source_word: μοι
  choice: cho Ta
  rationale: Thể hiện người mà Ba-na-ba và Sau-lơ được biệt riêng để thuộc về mục đích của Đấng ấy; “cho Ta” tự nhiên và đúng sắc thái mục đích.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Ba-na-ba và Sau-lơ
  rationale: Phiên âm các tên riêng theo cách dùng Kinh Thánh tiếng Việt quen thuộc và dễ đọc.
- source_word: εἰς τὸ ἔργον
  choice: để làm công việc
  rationale: Giữ nghĩa rộng của ἔργον, tránh xác định quá mức là một chức vụ hay nghi thức; cấu trúc tiếng Việt làm rõ mục đích của việc biệt riêng.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: mà Ta đã kêu gọi họ
  rationale: Thì hoàn thành diễn tả lời kêu gọi đã được thực hiện và vẫn còn hiệu lực. “Đã kêu gọi” tự nhiên và giữ được sắc thái ơn gọi.
theological_decisions:
- issue: Nghĩa của λειτουργούντων trong bối cảnh cộng đồng thờ phượng, kiêng ăn và được sai phái
  choice: phụng sự Chúa
  alternative: thờ phượng Chúa; phục vụ Chúa
  rationale: “Phụng sự” bảo toàn cả phương diện phục vụ và sắc thái thờ phượng của từ Hy Lạp, nhưng không áp đặt rằng đây nhất thiết là một nghi lễ chính thức.
- issue: Đức Thánh Linh là chủ thể của lời phán
  choice: Đức Thánh Linh phán
  alternative: Không dùng cách diễn đạt phi nhân xưng như “có lời bởi Thánh Linh”
  rationale: Nguyên văn trực tiếp trình bày Đức Thánh Linh là chủ thể nói; bản dịch giữ nguyên điều đó.
- issue: Tính chất của mệnh lệnh ἀφορίσατε ... εἰς τὸ ἔργον
  choice: biệt riêng ... để làm công việc
  alternative: bổ nhiệm ... vào chức vụ
  rationale: Câu nói đến việc tách riêng cho công việc được giao, nhưng không dùng thuật ngữ buộc phải hiểu là lễ phong chức hoặc một chức vụ giáo hội cụ thể.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. “Phụng sự” được chọn để giữ chiều rộng ngữ nghĩa của λειτουργέω; danh xưng và tên riêng dùng dạng quen thuộc trong truyền thống Kinh Thánh tiếng Việt. Đại từ “Ta” trong lời Đức Thánh Linh giữ sắc thái uy nghiêm của lời phán.
