    rationale: ὃ προσκέκλημαι αὐτούς có nghĩa “công việc mà Ta đã gọi họ đến [làm]/cho [công việc ấy].” Câu hiện tại “công việc mà Ta đã kêu gọi họ” có thể được hiểu là Ta đã gọi họ mà không nêu rõ họ được gọi đến công việc đó. Thêm “đến làm” khôi phục quan hệ này.
