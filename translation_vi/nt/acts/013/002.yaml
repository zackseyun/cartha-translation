review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch nhìn chung bám sát nguyên văn: hai hành động đồng thời, Đức Thánh Linh là chủ thể phán, mệnh lệnh biệt riêng, và lời kêu gọi trước đó đều được giữ lại. Tuy nhiên, cụm “công việc mà Ta đã kêu gọi họ” thiếu rõ quan hệ của ὃ: nguyên văn nói công việc mà họ đã được gọi đến, không chỉ nói rằng họ đã được gọi nói chung.'
  naturalness: Văn phong trang trọng, hiện đại và tự nhiên. “Phụng sự Chúa,” “kiêng ăn,” và “Đức Thánh Linh phán” đều phù hợp ngữ cảnh. Bổ sung “đến làm” làm rõ quan hệ cú pháp mà vẫn tự nhiên.
  terminology: “Phụng sự” bảo toàn thích đáng sắc thái phục vụ có tính thờ phượng/nghi lễ của λειτουργούντων; chú thích thay thế “thờ phượng” hữu ích. “Biệt riêng,” “Đức Thánh Linh,” “Ba-na-ba,” và “Sau-lơ” đều nhất quán với văn phong Kinh Thánh Việt ngữ trang trọng. Không có lý do để áp đặt nghĩa phong chức cho ἀφορίσατε.
  issues:
