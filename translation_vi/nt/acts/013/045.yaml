id: ACT.13.45
reference: Acts 13:45
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: vi
  text: Nhưng khi những người Do Thái[a] thấy đám đông, họ đầy lòng ghen tức[b], phản bác những điều Phao-lô đang nói[c] và buông lời phạm thượng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tức là nhóm người Do Thái địa phương chống đối Phao-lô trong sự việc này, không phải toàn thể người Do Thái.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “đầy lòng nhiệt thành”; trong văn cảnh này, nghĩa tiêu cực “ghen tức” phù hợp hơn.
    reason: lexical_alternative
  - marker: c
    text: Nguyên văn cũng có thể diễn đạt là “những điều được Phao-lô nói ra.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες δὲ
  choice: Nhưng khi ... thấy
  rationale: Phân từ bất định ἰδόντες được diễn đạt như mệnh đề thời gian tự nhiên trong tiếng Việt; δέ đánh dấu sự tương phản với phản ứng tích cực ngay trước đó.
- source_word: οἱ Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Giữ nguyên cách gọi rõ ràng của bản Hy Lạp, nhưng không thu hẹp thành “các lãnh đạo Do Thái”; chú thích làm rõ đây là nhóm địa phương trong cảnh thuật này.
- source_word: τοὺς ὄχλους
  choice: đám đông
  rationale: Danh từ Hy Lạp ở số nhiều chỉ số đông dân chúng tụ họp; “đám đông” là cách nói tự nhiên trong tiếng Việt và có thể mang nghĩa tập hợp.
- source_word: ἐπλήσθησαν ζήλου
  choice: đầy lòng ghen tức
  rationale: Giữ hình ảnh “đầy” của thành ngữ Hy Lạp. ζῆλος có thể là nhiệt tâm hoặc ghen tức, nhưng hành động chống đối theo sau khiến nghĩa tiêu cực phù hợp hơn.
- source_word: ἀντέλεγον
  choice: phản bác
  rationale: Thì vị hoàn biểu thị hành động đang tiếp diễn trong bối cảnh; “phản bác” truyền đạt việc nói chống lại hoặc bác lại lời Phao-lô.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: những điều Phao-lô đang nói
  rationale: Diễn đạt tự nhiên cấu trúc phân từ bị động có mạo từ, vẫn giữ trọng tâm nơi nội dung lời nói và sắc thái đang diễn tiến.
- source_word: βλασφημοῦντες
  choice: buông lời phạm thượng
  rationale: Phân từ chỉ hành động đi kèm việc phản bác. Cách dịch giữ mức độ nghiêm trọng của βλασφημέω mà không tự ý xác định đối tượng của lời phạm thượng.
theological_decisions:
- issue: Nguy cơ hiểu οἱ Ἰουδαῖοι như lời quy kết cho toàn thể người Do Thái
  choice: những người Do Thái[a]
  alternative: các lãnh đạo Do Thái; những người Giu-đê
  rationale: 'Bản dịch giữ danh xưng có trong nguyên văn, không tự ý giới hạn thành giới lãnh đạo hay đổi sang nghĩa địa lý. Chú thích xác định phạm vi theo văn cảnh: một nhóm người Do Thái địa phương chống đối Phao-lô, chứ không phải toàn thể dân tộc Do Thái.'
- issue: Sắc thái của ζῆλος
  choice: lòng ghen tức
  alternative: lòng nhiệt thành
  rationale: Từ Hy Lạp có cả hai khả năng, nhưng việc họ phản bác và phạm thượng ngay sau đó khiến nghĩa tiêu cực phù hợp với văn cảnh; chú thích vẫn bảo tồn khả năng từ vựng kia.
- issue: Đối tượng của βλασφημοῦντες
  choice: không nêu rõ đối tượng
  alternative: xúc phạm Phao-lô; xúc phạm Đức Chúa Trời
  rationale: Nguyên văn không chỉ rõ đối tượng, nên bản dịch không giải quyết thay sự mơ hồ về việc lời phạm thượng trực tiếp nhắm vào sứ điệp, người rao giảng hay Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phao-lô” theo lối phiên âm Kinh Thánh quen thuộc; câu văn giữ nhịp kể chuyện rõ ràng và không làm mất các sắc thái từ vựng hoặc sự mơ hồ thần học của nguyên bản.
