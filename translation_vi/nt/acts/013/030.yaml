  yaml_path: translation/nt/acts/013/030.yaml
  text: But God raised him from the dead.
translation:
  language: vi
  text: Nhưng Đức Chúa Trời đã khiến Người sống lại từ cõi chết.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ này đánh dấu sự tương phản rõ rệt với hành động của con người ở câu trước; “Nhưng” diễn đạt tự nhiên lực đối lập ấy.
- source_word: θεὸς
  choice: Đức Chúa Trời
  rationale: Danh từ chỉ Đức Chúa Trời, chủ thể thực hiện hành động; cách gọi này trang trọng và quen thuộc trong tiếng Việt Kinh Thánh.
- source_word: ἤγειρεν
  choice: đã khiến ... sống lại
  rationale: Trong ngữ cảnh phục sinh, ἐγείρω mang nghĩa làm cho người đã chết sống lại. Cách diễn đạt này tự nhiên, rõ nghĩa trong tiếng Việt và vẫn quy hành động cho Đức Chúa Trời.
- source_word: αὐτὸν
  choice: Người
  rationale: Đại từ chỉ Đức Giê-su trong văn cảnh trực tiếp; “Người” là lối quy chiếu trang trọng, dễ hiểu.
- source_word: ἐκ νεκρῶν
  choice: từ cõi chết
  rationale: Cụm từ là thành ngữ phục sinh, diễn tả việc ra khỏi tình trạng hoặc phạm vi của người chết; “từ cõi chết” tự nhiên và không thêm diễn giải ngoài nguyên văn.
theological_decisions:
- issue: Cách diễn đạt sự phục sinh
  choice: Đức Chúa Trời đã khiến Người sống lại từ cõi chết
  alternative: Đức Chúa Trời đã làm cho Người trỗi dậy từ giữa những người chết
  rationale: Bản dịch nêu rõ Đức Chúa Trời là chủ thể và Đức Giê-su thực sự sống lại, đồng thời không thêm chi tiết thần học ngoài câu Hy Lạp. Phương án “trỗi dậy” gần hình ảnh từ nguyên hơn nhưng trong tiếng Việt có thể bị hiểu đơn thuần là đứng lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và ngắn gọn. Giữ quan hệ tương phản bằng “Nhưng”; không cần chú thích vì câu không có biến thể hay độ mơ hồ đáng kể cần trình bày.
