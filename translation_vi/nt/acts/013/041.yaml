id: ACT.13.41
reference: Acts 13:41
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: vi
  text: Hãy xem, hỡi những kẻ khinh thường[a], hãy kinh ngạc và tiêu vong[b]! Vì chính Ta đang thực hiện một công việc trong những ngày của các ngươi—một công việc mà các ngươi chắc chắn sẽ không tin, nếu có ai thuật lại cho các ngươi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những kẻ coi thường” hoặc “những kẻ chế giễu.” Từ Hy Lạp chỉ những người đối xử với điều gì đó bằng thái độ khinh miệt.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “biến mất” hoặc “bị hủy diệt.” Câu này vang vọng Ha-ba-cúc 1:5 theo bản Hy Lạp và mang lời cảnh cáo mạnh mẽ về sự diệt vong.
    reason: alternative_reading
  - marker: c
    text: Động từ Hy Lạp có thể mang nghĩa “thuật lại đầy đủ” hoặc “kể lại chi tiết.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Hãy xem
  rationale: Mệnh lệnh số nhiều kêu gọi người nghe chú ý; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại và giữ được sắc thái trực tiếp.
- source_word: καταφρονηταί
  choice: những kẻ khinh miệt
  rationale: Diễn tả những người đối xử với điều gì đó bằng thái độ coi thường; giữ nghĩa rộng hơn 'kẻ chế giễu' và phù hợp với lời cảnh cáo.
- source_word: θαυμάσατε
  choice: hãy kinh ngạc
  rationale: Giữ lực mệnh lệnh và sắc thái sửng sốt mang tính mỉa mai trong lời tiên tri.
- source_word: ἀφανίσθητε
  choice: tiêu vong
  rationale: Truyền đạt ý biến mất hoặc đi đến chỗ hủy diệt, đồng thời giữ giọng cảnh cáo nghiêm khắc mà không giải thích quá mức.
- source_word: ἔργον
  choice: một công việc
  rationale: Tương đương tự nhiên và đủ rộng để chỉ hành động quan trọng của Đức Chúa Trời.
- source_word: ἐργάζομαι ἐγώ
  choice: chính Ta đang thực hiện
  rationale: Đại từ ἐγώ được diễn đạt bằng 'chính Ta' để giữ sự nhấn mạnh; thể hiện hành động đang được thực hiện.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: trong những ngày của các ngươi
  rationale: Giữ hình thức thời gian và tính trực diện của nguyên văn; 'các ngươi' phù hợp với lời quở trách tập thể trang trọng.
- source_word: οὐ μὴ πιστεύσητε
  choice: chắc chắn sẽ không tin
  rationale: Phản ánh cấu trúc phủ định nhấn mạnh οὐ μή với động từ giả định.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: dù có người kể lại tường tận cho các ngươi
  rationale: Trong ngữ cảnh phủ định nhấn mạnh, 'dù' diễn đạt tự nhiên ý 'ngay cả nếu'; 'kể lại tường tận' giữ sắc thái trình bày đầy đủ của ἐκδιηγέομαι.
theological_decisions:
- issue: Mức độ nghiêm khắc của lời cảnh cáo tiên tri trích từ Ha-ba-cúc
  choice: Dùng 'tiêu vong' và giữ nguyên lời khẳng định mạnh rằng họ sẽ không tin.
  alternative: Dùng 'biến mất' hoặc giảm nhẹ thành một lời chỉ nói về sự kinh ngạc.
  rationale: Ngữ cảnh là lời cảnh cáo long trọng về hậu quả của việc khinh miệt công việc Đức Chúa Trời; bản dịch giữ sức nặng phán xét nhưng không xác định chi tiết vượt quá nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và trực tiếp. 'Hỡi' cùng đại từ 'Ta/các ngươi' giữ giọng của lời tiên tri được trích dẫn; dấu gạch ngang giúp câu dài sáng rõ mà không làm thay đổi cấu trúc lập luận.
