  text: καί, ὡς τεσσερακονταετῆ χρόνον ἐτροποφόρησεν αὐτοὺς ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/018.yaml
  text: And for about forty years he put up with them in the wilderness[a].
translation:
  language: vi
  text: Trong khoảng bốn mươi năm, Ngài đã chịu đựng họ trong hoang mạc.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản chép: “Ngài đã chăm sóc họ,” thay vì: “Ngài đã chịu đựng họ.”'
    reason: textual_variant
lexical_decisions:
- source_word: καί
  choice: Trong
  rationale: Liên từ tiếp nối mạch kể; trong tiếng Việt, quan hệ nối kết được thể hiện tự nhiên qua việc mở đầu bằng cụm thời gian, tránh một từ “Và” nặng nề ở đầu câu.
- source_word: ὡς
  choice: khoảng
  rationale: Đi với khoảng thời gian, từ này biểu thị tính xấp xỉ.
- source_word: τεσσερακονταετῆ χρόνον
  choice: bốn mươi năm
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho một quãng thời gian bốn mươi năm.
- source_word: ἐτροποφόρησεν
  choice: đã chịu đựng
  rationale: Theo bản văn SBLGNT, động từ này mang nghĩa chịu đựng hoặc nhẫn nhịn trước cách cư xử của dân; phương án dị bản mang nghĩa chăm sóc được ghi ở chú thích.
- source_word: αὐτοὺς
  choice: họ
  rationale: Đại từ số nhiều chỉ dân Israel đã được nhắc đến trong văn mạch.
- source_word: ἐν τῇ ἐρήμῳ
  choice: trong hoang mạc
  rationale: “Hoang mạc” là cách gọi tự nhiên, trang trọng cho vùng hoang vu nơi Israel lưu lạc, đồng thời không nhất thiết chỉ một vùng toàn cát.
theological_decisions:
- issue: Hành động của Đức Chúa Trời đối với Israel trong hoang mạc
  choice: Ngài đã chịu đựng họ
  alternative: Ngài đã chăm sóc họ
  rationale: Bản văn Hy Lạp được cung cấp đọc ἐτροποφόρησεν, ủng hộ nghĩa chịu đựng/nhẫn nhịn, nên không làm nhẹ thành ý chăm sóc trong chính văn. Dị bản ἐτροφοφόρησεν tạo nên cách hiểu chăm sóc hoặc nuôi dưỡng và được giữ trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” để chỉ Đức Chúa Trời theo văn mạch; chọn “chịu đựng” nhằm giữ sắc thái của bản văn in, còn dị bản được trình bày minh bạch trong chú thích.
