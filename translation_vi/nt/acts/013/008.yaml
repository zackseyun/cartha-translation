source:
  edition: SBLGNT
  text: ἀνθίστατο δὲ αὐτοῖς Ἐλύμας ὁ μάγος, οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ, ζητῶν διαστρέψαι τὸν ἀνθύπατον ἀπὸ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: vi
  text: Nhưng Ê-ly-ma, thuật sĩ—vì tên ông được phiên dịch như vậy—chống đối họ, tìm cách khiến viên phó tỉnh trưởng quay khỏi đức tin[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khỏi việc tin.” Cụm từ Hy Lạp có thể nói đến việc khiến viên phó tỉnh trưởng lìa khỏi đức tin Cơ Đốc nói riêng, hoặc ngăn ông đáp ứng bằng lòng tin nói chung.'
    reason: alternative_reading
  - marker: b
    text: Tên “Ê-ly-ma” được tác giả nói là một tên đã được phiên dịch hoặc giải nghĩa; nguồn gốc chính xác của tên này không chắc chắn.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: chống đối
  rationale: Thì chưa hoàn thành diễn tả hành động chống đối đang tiếp diễn; “chống đối” tự nhiên và giữ rõ sắc thái đối nghịch.
- source_word: Ἐλύμας
  choice: Ê-ly-ma
  rationale: Phiên âm tên riêng sang tiếng Việt theo cách dễ đọc.
- source_word: ὁ μάγος
  choice: thuật sĩ ấy
  rationale: μάγος có thể chỉ thuật sĩ, pháp sư hoặc người thực hành ma thuật; “thuật sĩ” dễ hiểu mà không tăng sắc thái miệt thị quá mức.
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: vì tên ông được phiên dịch như vậy
  rationale: Giữ ý dịch hoặc giải nghĩa tên trong mệnh đề giải thích, đồng thời không khẳng định một ngữ nguyên cụ thể vốn không chắc chắn.
- source_word: ζητῶν διαστρέψαι
  choice: tìm cách khiến ... quay khỏi
  rationale: ζητῶν diễn tả ý định hoặc nỗ lực; với một người làm tân ngữ và ἀπό chỉ điều bị lìa bỏ, διαστρέψαι mang nghĩa làm cho người ấy quay khỏi.
- source_word: τὸν ἀνθύπατον
  choice: vị tổng đốc
  rationale: ἀνθύπατος là chức vụ hành chính La Mã cụ thể; “tổng đốc” là cách gọi tiếng Việt tự nhiên và tương đối chính xác trong văn cảnh.
- source_word: ἀπὸ τῆς πίστεως
  choice: khỏi đức tin
  rationale: Giữ πίστις là “đức tin”; mạo từ và văn cảnh có thể gợi đức tin Cơ Đốc cụ thể, nhưng tiếng Việt không cần thêm từ xác định trong câu chính.
theological_decisions:
- issue: Phạm vi nghĩa của τῆς πίστεως
  choice: đức tin
  alternative: việc tin
  rationale: Mạo từ và văn cảnh cho phép hiểu là đức tin Cơ Đốc, nhưng cụm Hy Lạp cũng có thể nhấn mạnh sự đáp ứng bằng lòng tin. Bản chính giữ cách dịch truyền thống, còn chú thích bảo tồn khả năng thứ hai.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng câu chen bằng gạch ngang để giữ cấu trúc giải thích của nguyên văn; các dấu chú thích [a], [b] đều được đặt trong câu chính.
