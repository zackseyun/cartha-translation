source:
  edition: SBLGNT
  text: Ἐξιόντων δὲ ⸀αὐτῶν ⸀παρεκάλουν εἰς τὸ μεταξὺ σάββατον λαληθῆναι αὐτοῖς τὰ ῥήματα ⸀ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: vi
  text: Khi họ đi ra[a][b], họ khẩn khoản xin cho những lời này được nói với họ vào ngày Sa-bát kế tiếp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Một số thủ bản viết rõ hơn: “Khi Phao-lô và Ba-na-ba đi ra, dân chúng khẩn khoản xin cho những lời này được nói với họ vào ngày Sa-bát kế tiếp.”'
    reason: textual_variant
  - marker: b
    text: 'Cũng có thể dịch: “Khi họ rời đi, họ xin cho những điều này được nói với họ vào ngày Sa-bát sắp tới.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: Khi họ đi ra
  rationale: Phân từ hiện tại trong cấu trúc sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. “Khi … đi ra” giữ được ý nghĩa tiến hành của động từ mà không diễn giải quá mức.
- source_word: δὲ
  choice: được hòa vào mệnh đề “Khi…”
  rationale: Ở đây δέ là từ nối nhẹ trong cấu trúc sở hữu cách tuyệt đối; tiếng Việt tự nhiên không cần dịch thành một liên từ riêng.
- source_word: αὐτῶν
  choice: họ
  rationale: Đại từ Hy Lạp không nêu rõ danh tính của nhóm người, và truyền thống thủ bản có khác biệt liên quan đến chủ thể. “Họ” giữ nguyên mức độ không xác định của bản nguồn.
- source_word: παρεκάλουν
  choice: họ khẩn khoản xin
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn; trong ngữ cảnh này παρακαλέω mang nghĩa tha thiết yêu cầu. “Khẩn khoản xin” thể hiện sức nặng ấy mà không chuyển sang nghĩa khuyên nhủ hay an ủi.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: vào ngày Sa-bát kế tiếp
  rationale: Cụm từ chỉ ngày Sa-bát sắp tới hoặc tiếp theo. Cách dịch này rõ ràng, tự nhiên trong tiếng Việt và tránh lối dịch từng chữ khó hiểu như “ngày Sa-bát ở giữa”.
- source_word: λαληθῆναι
  choice: được nói
  rationale: Động từ nguyên mẫu bất định thụ động của λαλέω được giữ ở thể thụ động, không tự ý xác định người nói.
- source_word: αὐτοῖς
  choice: với họ
  rationale: Dữ cách chỉ những người tiếp nhận lời nói; “với họ” phù hợp tự nhiên với động từ “nói” trong tiếng Việt.
- source_word: τὰ ῥήματα ταῦτα
  choice: những lời này
  rationale: ῥήματα ở đây chỉ những lời đã được nói trong bài giảng ngay trước đó. “Những lời này” gần với hình thức và nghĩa của tiếng Hy Lạp hơn cách diễn giải “sứ điệp này”.
theological_decisions:
- issue: Đối tượng quy chiếu của các đại từ trong câu
  choice: Bản văn chính giữ các đại từ là “họ”, không xác định cụ thể ai đang đi ra và ai đang khẩn khoản xin.
  alternative: Có thể hiểu dân chúng khẩn khoản xin Phao-lô và Ba-na-ba; hoặc theo một cách phân tích khác, xác định các nhóm người dựa trên những dị bản rõ nghĩa hơn.
  rationale: Bản SBLGNT được cung cấp chỉ dùng đại từ αὐτῶν và chủ ngữ hàm ẩn số nhiều của παρεκάλουν. Vì có khó khăn về văn bản và quy chiếu, việc nêu danh tính trong bản văn chính sẽ giải quyết một điều mà chính nguồn Hy Lạp đang để mở.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc “xin cho … được nói” hơi trang trọng nhưng cần thiết để giữ thể thụ động và không tự ý xác định người nói; việc lặp “họ” có chủ ý nhằm bảo toàn sự mơ hồ của bản Hy Lạp.
