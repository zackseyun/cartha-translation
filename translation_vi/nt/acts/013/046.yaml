id: ACT.13.46
reference: Acts 13:46
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: vi
  text: 'Phao-lô và Ba-na-ba mạnh dạn nói: “Lời Đức Chúa Trời cần phải được loan báo cho các ông trước. Vì các ông khước từ lời ấy và tự xét mình không xứng đáng với sự sống đời đời, kìa, chúng tôi quay sang các dân ngoại.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các dân tộc.” Ở đây, cụm từ này chỉ những người không phải Do Thái, tương phản với cử tọa trong hội đường.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοί
  choice: mạnh dạn nói
  rationale: Diễn đạt cách nói thẳng thắn, công khai và can đảm; kết hợp tự nhiên với động từ chính εἶπαν trong tiếng Việt.
- source_word: Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι
  choice: cần phải được truyền cho các ông trước
  rationale: Giữ ý nghĩa về sự cần thiết, thể bị động và thứ tự ưu tiên; “truyền” tự nhiên hơn “nói” khi đối tượng là lời Đức Chúa Trời.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: Lời của Đức Chúa Trời
  rationale: Bảo tồn cách diễn đạt Kinh Thánh quen thuộc, chỉ sứ điệp đến từ Đức Chúa Trời.
- source_word: ἀπωθεῖσθε αὐτὸν
  choice: các ông khước từ lời ấy
  rationale: “Khước từ” thể hiện sự chủ động gạt bỏ; “lời ấy” làm rõ đại từ αὐτόν quy chiếu về λόγον.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: tự xét mình không xứng đáng
  rationale: Giữ nguyên lực phản thân của ἑαυτούς và sắc thái phán xét của κρίνετε, không biến lời này thành phán quyết của Phao-lô.
- source_word: τῆς αἰωνίου ζωῆς
  choice: với sự sống đời đời
  rationale: Cấu trúc “xứng đáng với” là thành ngữ tự nhiên trong tiếng Việt và chuyển tải đúng quan hệ với ἀξίους.
- source_word: ἰδοὺ στρεφόμεθα
  choice: giờ đây, chúng tôi quay sang
  rationale: “Giờ đây” truyền đạt chức năng thu hút sự chú ý của ἰδού trong văn cảnh; “quay sang” giữ hình ảnh chuyển hướng của στρεφόμεθα.
- source_word: τὰ ἔθνη
  choice: các dân ngoại
  rationale: Trong đối lập trực tiếp với cử tọa hội đường Do Thái, cụm từ chỉ những người không thuộc dân Do Thái; “các dân ngoại” cũng giữ phần nào sắc thái số nhiều của tiếng Hy Lạp.
theological_decisions:
- issue: Ý nghĩa của τὰ ἔθνη trong bối cảnh lịch sử cứu rỗi
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: Văn cảnh đối chiếu cử tọa Do Thái với người ngoài Do Thái. Bản dịch chính giữ sự đối chiếu ấy, còn chú thích bảo tồn nghĩa từ vựng rộng hơn.
- issue: Chủ thể của sự xét đoán trong οὐκ ἀξίους κρίνετε ἑαυτοὺς
  choice: các ông tự xét mình không xứng đáng
  alternative: Phao-lô tuyên bố họ không xứng đáng
  rationale: Tiếng Hy Lạp đặt hành động xét đoán nơi chính người nghe qua κρίνετε ἑαυτούς; bản dịch không thêm một phán quyết thần học rộng hơn văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” để thể hiện lời nói trực tiếp với cử tọa số nhiều mà không tạo sắc thái miệt thị; dùng “Đức Chúa Trời” theo lối gọi trang trọng, quen thuộc trong tiếng Việt Kinh Thánh.
