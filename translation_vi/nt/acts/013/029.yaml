- from: Sau khi họ đã thực hiện trọn mọi điều đã được chép về Ngài, họ hạ Ngài xuống khỏi cây gỗ[a] và đặt Ngài vào một ngôi mộ.
  to: Khi họ đã làm xong mọi điều đã chép về Người, họ hạ Người xuống khỏi cây[a] và đặt Người vào một ngôi mộ.
  rationale: Bản sửa dùng “Khi” để phản ánh sát hơn liên từ thời gian ὡς δέ, thay “thực hiện trọn” bằng “làm xong” cho tự nhiên, và thay “cây gỗ” bằng “cây” để tránh một cụm từ gượng trong tiếng Việt trong khi vẫn duy trì từ vựng ξύλον cùng khả năng liên hệ Kinh Thánh được giải thích ở chú thích.
