  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: vi
  text: Khi họ đã làm xong mọi điều đã chép về Người, họ hạ Người xuống khỏi cây[a] và đặt Người vào một ngôi mộ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “thập tự giá”; từ Hy Lạp ξύλον có nghĩa là “cây” hoặc “gỗ” và cũng được dùng để chỉ dụng cụ hành hình bằng gỗ. Cách dùng này có thể gợi lại Phục Truyền Luật Lệ Ký 21:23.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Sau khi
  rationale: Cụm từ mở đầu diễn tả quan hệ thời gian và chuyển sang sự việc kế tiếp; “Sau khi” tự nhiên trong tiếng Việt và phù hợp với trình tự của các động từ.
- source_word: ἐτέλεσαν
  choice: đã thực hiện trọn
  rationale: Diễn đạt ý đưa đến chỗ hoàn tất những điều đã chép, đồng thời giữ chủ thể số nhiều là những người hành động. Cách dịch này không buộc người đọc phải hiểu τελέω chỉ theo nghĩa thần học chuyên biệt là “ứng nghiệm”.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: mọi điều đã được chép về Ngài
  rationale: Giữ phạm vi bao quát của πάντα và trạng thái đã được ghi chép của γεγραμμένα. “Về Ngài” là cách diễn đạt tự nhiên, trang trọng; viết hoa đại từ theo quy ước văn phong Cơ Đốc tiếng Việt mà không thêm nội dung vào nguyên văn.
- source_word: καθελόντες
  choice: họ hạ Ngài xuống
  rationale: Chuyển phân từ bất định quá khứ thành động từ hữu hạn theo chuỗi hành động, là cách diễn đạt tự nhiên trong tiếng Việt và nói rõ việc đưa thi thể xuống khỏi dụng cụ hành hình.
- source_word: ἀπὸ τοῦ ξύλου
  choice: khỏi cây gỗ
  rationale: ξύλον có nghĩa cơ bản là gỗ hoặc cây và tại đây chỉ dụng cụ hành hình bằng gỗ. “Cây gỗ” giữ được lựa chọn từ vựng của nguyên văn và khả năng gợi lại Phục Truyền Luật Lệ Ký 21:23, thay vì trực tiếp đồng nhất hóa với từ “thập tự giá” trong chính văn.
- source_word: ἔθηκαν
  choice: đặt Ngài
  rationale: τίθημι có nghĩa rộng là đặt hoặc để; “đặt” là từ tự nhiên và trang trọng khi nói đến việc an táng thi thể.
- source_word: εἰς μνημεῖον
  choice: vào một ngôi mộ
  rationale: Trong ngữ cảnh này μνημεῖον là nơi an táng. Giới từ “vào” phản ánh εἰς, còn “ngôi mộ” là cách gọi rõ ràng, thông dụng trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch ξύλον trong trình thuật thương khó
  choice: cây gỗ
  alternative: thập tự giá
  rationale: Nguyên văn dùng ξύλον chứ không dùng σταυρός. “Cây gỗ” bảo toàn hình ảnh từ vựng và khả năng liên hệ với lời về người bị treo trên cây trong Phục Truyền Luật Lệ Ký 21:23. Vì trong ngữ cảnh từ này thực sự chỉ dụng cụ hành hình thường được gọi là thập tự giá, cách hiểu ấy được ghi ở chú thích.
- issue: Sắc thái của ἐτέλεσαν đối với những điều đã chép
  choice: thực hiện trọn
  alternative: làm ứng nghiệm
  rationale: '“Thực hiện trọn” giữ cả ý hành động và hoàn tất mà không xóa bỏ sự căng thẳng của câu: những người hành động theo ý mình lại hoàn thành những điều Kinh Thánh đã chép. “Làm ứng nghiệm” đúng theo ngữ cảnh nhưng diễn giải sắc thái thần học rõ hơn mức cần thiết.'
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Cấu trúc câu giữ trình tự thời gian của nguyên văn. “Ngài” phù hợp với lối xưng hô kính trọng dành cho Chúa Giê-su trong văn cảnh Cơ Đốc tiếng Việt; chú thích giải thích cách dịch ít quen thuộc “cây gỗ” mà không thay thế hình ảnh của nguyên văn.
