  verdict: revise
  source_fidelity: Bản dịch giữ đúng trình tự hành động và nội dung chính của nguyên văn. Tuy nhiên, “Sau khi” làm quan hệ thời gian có phần dứt khoát hơn ὡς δέ (“khi/đến khi”), và “cây gỗ” không phải cách gọi tự nhiên trong tiếng Việt hiện đại cho ξύλον ở đây.
  naturalness: “Thực hiện trọn” và đặc biệt “cây gỗ” hơi gượng trong văn phong tiếng Việt hiện đại. “Làm xong” và “cây” tự nhiên hơn, đồng thời vẫn bảo toàn lựa chọn từ vựng của nguyên văn.
  terminology: Dùng “cây” trong chính văn phản ánh ξύλον (“cây/gỗ”) mà không thay bằng cách diễn giải “thập tự giá”. Chú thích nên nêu “thập tự giá” như một cách dịch theo ngữ cảnh. “Người” với viết hoa giữ sắc thái kính trọng nhưng ít phụ thuộc vào quy ước giáo hội hơn “Ngài”; đây là lựa chọn văn phong, không ảnh hưởng nghĩa.
  issues:
