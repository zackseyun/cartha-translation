    rationale: ὡς δέ tự nhiên hơn là “Khi”; ἐτέλεσαν có thể diễn đạt thành “đã làm xong” để giữ ý hoàn tất hành động mà không áp đặt cách diễn giải “làm ứng nghiệm”.
