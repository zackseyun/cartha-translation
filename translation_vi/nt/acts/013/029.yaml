    rationale: ξύλον có thể là “cây” hoặc “gỗ/vật bằng gỗ”; “cây gỗ” trong tiếng Việt thường gợi một cái cây làm bằng gỗ, không diễn đạt rõ ràng lựa chọn từ vựng Hy Lạp. “Cây” trong ngữ cảnh, kèm chú thích, vừa tự nhiên vừa duy trì khả năng vang vọng Phục Truyền Luật Lệ Ký 21:23.
