  text: αὐτοὶ δὲ διελθόντες ἀπὸ τῆς Πέργης παρεγένοντο εἰς Ἀντιόχειαν ⸂τὴν Πισιδίαν⸃, καὶ ⸀εἰσελθόντες εἰς τὴν συναγωγὴν τῇ ἡμέρᾳ τῶν σαββάτων ἐκάθισαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: vi
  text: Còn họ tiếp tục đi từ Pẹt-ga và đến An-ti-ốt thuộc miền Pi-si-đi-a,[a] rồi vào hội đường vào ngày Sa-bát và ngồi xuống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “An-ti-ốt Pi-si-đi-a.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Còn họ
  rationale: δέ nối tiếp câu chuyện và có sắc thái tương phản nhẹ; đại từ αὐτοὶ nêu rõ chủ thể. “Còn họ” tự nhiên trong tiếng Việt và không nhấn quá mức.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: tiếp tục đi từ Pẹt-ga
  rationale: Phân từ của διέρχομαι trong trình thuật hành trình diễn tả việc họ đi tiếp từ một địa điểm; cách dịch này truyền đạt diễn tiến tự nhiên.
- source_word: παρεγένοντο
  choice: đến
  rationale: παραγίνομαι trong ngữ cảnh hành trình có nghĩa là đến hoặc tới nơi; “đến” gọn và tự nhiên.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: An-ti-ốt thuộc miền Pi-si-đi-a
  rationale: Cụm Hy Lạp xác định thành An-ti-ốt này theo vùng Pi-si-đi-a. “Thuộc miền” vừa rõ nghĩa địa lý vừa giữ được khả năng hiểu sát cấu trúc nguồn.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: vào hội đường
  rationale: Chuyển phân từ thành động từ nối tiếp giúp câu tiếng Việt tự nhiên; “hội đường” là cách gọi quen thuộc cho nơi hội họp và thờ phượng của người Do Thái.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: trong ngày Sa-bát
  rationale: Đây là thành ngữ chỉ ngày Sa-bát của người Do Thái; dù σαββάτων mang hình thức số nhiều, ý nghĩa trong ngữ cảnh là một ngày Sa-bát.
- source_word: ἐκάθισαν
  choice: ngồi xuống
  rationale: Động từ aorist diễn tả hành động đơn giản; “ngồi xuống” tự nhiên và thể hiện sắc thái bắt đầu ngồi.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng dạng phiên âm tiếng Việt có gạch nối cho địa danh và thuật ngữ “Sa-bát”; giữ “hội đường” là từ quen thuộc trong văn cảnh Do Thái. Dấu chú thích [a] được đặt ngay sau địa danh mà chú thích giải thích.
