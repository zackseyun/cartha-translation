  text: βλέπετε οὖν μὴ ⸀ἐπέλθῃ τὸ εἰρημένον ἐν τοῖς προφήταις·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/040.yaml
  text: 'Therefore watch out[a], lest what has been spoken in the prophets come upon you:'
translation:
  language: vi
  text: 'Vậy, hãy coi chừng, kẻo điều đã được phán trong các sách tiên tri[a] xảy đến cho anh em:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn Hy Lạp là “trong các nhà tiên tri”, có thể hiểu là trong các sách tiên tri; cũng có thể dịch là “qua các nhà tiên tri”.
    reason: Giữ cách diễn đạt khác thường của nguyên văn và khả năng hiểu ἐν theo nơi chứa đựng lời tiên tri hoặc theo tác nhân.
lexical_decisions:
- source_word: βλέπετε
  choice: hãy coi chừng
  rationale: Động từ mệnh lệnh hiện tại, ngôi thứ hai số nhiều, mang sắc thái cảnh báo khẩn thiết. “Hãy coi chừng” tự nhiên trong tiếng Việt hiện đại và giữ được sức cảnh báo.
- source_word: οὖν
  choice: Vậy
  rationale: Nêu kết luận thực tiễn rút ra từ lời công bố và cảnh báo trước đó; “Vậy” diễn đạt mạch suy luận gọn và tự nhiên.
- source_word: μὴ ἐπέλθῃ
  choice: kẻo ... xảy đến cho anh em
  rationale: μή đi với động từ giả định sau mệnh lệnh diễn tả điều cần tránh. “Kẻo” giữ đúng sắc thái cảnh báo, còn “xảy đến cho anh em” diễn đạt ἐπέρχομαι trong bối cảnh tai họa hay sự phán xét sắp xảy ra.
- source_word: τὸ εἰρημένον
  choice: điều đã được phán
  rationale: Phân từ hoàn thành bị động có mạo từ được dùng như danh từ. “Điều đã được phán” giữ thể bị động, sắc thái trang trọng và hiệu lực còn nguyên của lời tiên tri.
- source_word: ἐν τοῖς προφήταις
  choice: trong các sách tiên tri
  rationale: ἐν có nghĩa cơ bản là “trong”. Trong ngữ cảnh ngay sau đó trích sách Ha-ba-cúc, cụm này chỉ phần Kinh Thánh tiên tri; thêm “sách” giúp tiếng Việt rõ và tự nhiên mà không chuyển hẳn sang nghĩa tác nhân “qua/bởi các nhà tiên tri”.
theological_decisions:
- issue: Đối tượng quy chiếu của “các nhà tiên tri”
  choice: Hiểu là phần sách tiên tri trong Kinh Thánh
  alternative: Hiểu chủ yếu là các nhà tiên tri với tư cách người phát ngôn
  rationale: Phao-lô sắp trích dẫn Ha-ba-cúc, nên ngữ cảnh thiên về lời được ghi trong các sách tiên tri. Bản dịch chính thể hiện điều này, đồng thời chú thích giữ lại khả năng hiểu theo tác nhân.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Anh em” phù hợp với lời trực tiếp của Phao-lô dành cho cử tọa số nhiều; dấu hai chấm báo trước lời trích dẫn ở câu kế tiếp.
