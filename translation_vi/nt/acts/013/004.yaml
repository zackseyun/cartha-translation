  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: vi
  text: Vậy, chính họ, sau khi được Đức Thánh Linh sai đi, đã xuống Sê-lêu-xi; từ đó họ ra khơi đến Síp.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτοὶ
  choice: chính họ
  rationale: Đại từ được nêu rõ và mang sắc thái nhấn mạnh; “chính họ” thể hiện sắc thái ấy tự nhiên trong tiếng Việt.
- source_word: μὲν οὖν
  choice: Vậy
  rationale: Cụm từ đánh dấu bước tiếp theo của câu chuyện đồng thời nối kết với việc sai phái ở câu trước; “Vậy” diễn đạt gọn và tự nhiên.
- source_word: ἐκπεμφθέντες
  choice: được ... sai đi
  rationale: Phân từ aorist bị động chỉ hành động xảy ra trước các động từ chính; cấu trúc tiếng Việt giữ rõ thể bị động và ý sai phái.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: được Đức Thánh Linh sai đi
  rationale: ὑπό với sở hữu cách chỉ tác nhân. “Đức Thánh Linh” là cách gọi trang trọng, quen thuộc trong tiếng Việt và phù hợp với tác nhân có ngôi vị trong sách Công Vụ.
- source_word: κατῆλθον
  choice: xuống
  rationale: Giữ nghĩa chuyển động đi xuống, ở đây tự nhiên chỉ việc xuống thành cảng ven biển.
- source_word: εἰς Σελεύκειαν
  choice: Sê-lêu-xi
  rationale: Phiên âm địa danh Σελεύκεια theo cách đọc dễ nhận biết và tự nhiên trong tiếng Việt.
- source_word: ἐκεῖθεν τε
  choice: từ đó
  rationale: Diễn đạt địa điểm khởi hành; dấu chấm phẩy và mạch câu tiếng Việt truyền đạt chức năng liên kết của τε mà không cần thêm một từ nối nặng nề.
- source_word: ἀπέπλευσαν
  choice: đi thuyền
  rationale: Diễn đạt tự nhiên hành động rời nơi ấy bằng đường biển; ý xuất phát đã rõ qua “từ đó”.
- source_word: εἰς Κύπρον
  choice: đến đảo Síp
  rationale: εἰς chỉ đích đến; thêm “đảo” giúp độc giả hiện đại nhận biết loại địa danh mà không làm thay đổi ý nghĩa.
theological_decisions:
- issue: Cách dịch ἁγίου πνεύματος
  choice: Đức Thánh Linh
  alternative: thánh linh
  rationale: Trong văn mạch Công Vụ, cụm từ chỉ tác nhân thần linh có ngôi vị thực hiện việc sai phái. Cách viết và xưng gọi “Đức Thánh Linh” phản ánh điều đó, nhưng không thêm một xác quyết giáo lý ngoài điều câu văn biểu đạt.
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ sắc thái nhấn mạnh của Αὐτοὶ bằng “chính họ”, đồng thời dùng tên riêng phiên âm tiếng Việt: Sê-lêu-xi và Síp.'
