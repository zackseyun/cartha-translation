review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng mạch chính: những người được Đức Thánh Linh sai phái đi xuống Seleucia rồi từ đó đi bằng đường biển đến Cyprus. Tuy nhiên, cấu trúc “được ... sai đi, xuống” làm mờ quan hệ trước-sau của phân từ aorist bị động ἐκπεμφθέντες với động từ chính κατῆλθον. Cần diễn đạt rõ: họ đã được sai đi trước, rồi đi xuống. “Đi thuyền” cũng chưa biểu đạt rõ sắc thái rời bến của ἀπέπλευσαν.'
  naturalness: Câu hiện tại bị khựng ngữ pháp ở “được Đức Thánh Linh sai đi, xuống...”. Cấu trúc “sau khi được ... sai đi, họ đã xuống...” tự nhiên, rõ ràng và vẫn trang trọng. Bỏ dấu phẩy không cần thiết sau “từ đó” giúp câu trôi chảy hơn.
  terminology: “Đức Thánh Linh” là thuật ngữ chuẩn, trang trọng và phù hợp văn mạch Công Vụ. “Síp” là tên địa lý Việt ngữ quen dùng. Không cần thêm “đảo”, vì nguyên ngữ chỉ nêu tên địa danh và “Síp” đã đủ rõ trong văn cảnh.
  issues:
  - severity: medium
    issue: Quan hệ cú pháp của phân từ ἐκπεμφθέντες chưa rõ
    rationale: Cụm “được Đức Thánh Linh sai đi, xuống Sê-lêu-xi” có thể khiến “xuống” bị đọc như phần bổ nghĩa trực tiếp cho việc được sai. Phân từ aorist bị động chỉ hành động sai phái xảy ra trước hai hành động chính, nên cần một cấu trúc như “sau khi được ... sai đi, họ đã xuống...”.
  - severity: low
    issue: Sắc thái xuất phát bằng đường biển của ἀπέπλευσαν chưa được nêu rõ
    rationale: “Đi thuyền đến” diễn đạt phương tiện, nhưng ἀπέπλευσαν nhấn mạnh việc rời đi bằng đường biển. “Ra khơi đến” diễn đạt được sắc thái này tự nhiên trong tiếng Việt.
  - severity: low
    issue: Thêm từ “đảo” không cần thiết
    rationale: Κύπρον chỉ là tên đích đến. Dù Cyprus là một hòn đảo, thêm phân loại này là thông tin ngoài câu nguồn và không cần cho bản dịch tương đương tối ưu.
