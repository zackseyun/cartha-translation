id: ACT.13.1
reference: Acts 13:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: vi
  text: 'Trong hội thánh tại An-ti-ốt có các nhà tiên tri và giáo sư: Ba-na-ba, Si-mê-ôn gọi là Ni-giê[a], Lu-ki-ô người Sy-ren[b], Ma-na-ên, người cùng lớn lên với tiểu vương Hê-rốt[c], và Sau-lơ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ni-giê” là một tên La-tinh có nghĩa là “đen”; tại đây tên này được giữ như tên riêng thay vì dịch nghĩa.
    reason: lexical_alternative
  - marker: b
    text: Tức là Lu-ki-ô quê ở Sy-ren, một thành phố thuộc Bắc Phi.
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “anh em nuôi của tiểu vương Hê-rốt” hoặc “người được nuôi dạy cùng tiểu vương Hê-rốt.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: Trong hội thánh tại An-ti-ốt có
  rationale: Diễn đạt tự nhiên cấu trúc hiện hữu và địa điểm của nguyên văn; δέ là liên từ chuyển ý nhẹ, không cần dịch thành một từ riêng trong câu tiếng Việt này.
- source_word: προφῆται καὶ διδάσκαλοι
  choice: các nhà tiên tri và giáo sư
  rationale: Giữ trực tiếp hai vai trò được nêu trong hội thánh, không áp đặt cơ cấu chức vụ về sau.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Si-mê-ôn gọi là Ni-giê
  rationale: Phân biệt Συμεών với Si-môn và giữ Νίγερ như một tên riêng, đồng thời giải thích nghĩa trong chú thích.
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Lu-ki-ô người Sy-ren
  rationale: ὁ Κυρηναῖος chỉ người xuất thân từ Sy-ren; cách nói này rõ và tự nhiên hơn một tính từ địa danh hiếm dùng trong tiếng Việt.
- source_word: Ἡρῴδου τοῦ τετραάρχου
  choice: tiểu vương Hê-rốt
  rationale: τετράρχης là tước hiệu của người cai trị một phần lãnh thổ; “tiểu vương” là cách gọi tiếng Việt gọn và quen thuộc, không bổ sung tên Antipas vốn không có trong câu.
- source_word: σύντροφος
  choice: người cùng lớn lên với
  rationale: Từ này có thể chỉ người được nuôi dạy cùng hoặc bạn đồng hành từ thuở nhỏ. Cách dịch giữ nét nghĩa về sự cùng trưởng thành mà không khẳng định quan hệ anh em nuôi.
theological_decisions:
- issue: Tính chất của các vai trò προφῆται καὶ διδάσκαλοι
  choice: Dịch là “các nhà tiên tri và giáo sư,” như những vai trò được nhận biết trong hội thánh địa phương.
  alternative: Hiểu đây là các chức vụ chính thức theo một hệ thống giáo hội hình thành về sau.
  rationale: Câu văn gọi những người này là tiên tri và giáo sư nhưng không xác định một phẩm trật hay cơ cấu giáo hội về sau.
- issue: Quan hệ của Ma-na-ên với Hê-rốt qua σύντροφος
  choice: “người cùng lớn lên với”
  alternative: “anh em nuôi của” hoặc “bạn thân của”
  rationale: Nguyên ngữ gợi đến việc được nuôi dạy cùng nhau nhưng không xác định chắc chắn quan hệ anh em nuôi; bản dịch giữ độ mở đó.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt; cấu trúc câu được làm gọn nhưng vẫn giữ đầy đủ danh sách và các quan hệ của nguyên văn.
