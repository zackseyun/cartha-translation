language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: vi
  text: Sau khi buổi nhóm tại hội đường kết thúc[a], nhiều người Do Thái và những người mộ đạo đã cải đạo theo Do Thái giáo đi theo Phao-lô và Ba-na-ba. Hai ông trò chuyện với họ và khuyên họ tiếp tục ở trong ân điển của Đức Chúa Trời.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi hội chúng giải tán.” Từ Hy Lạp ở đây nói đến buổi nhóm hoặc hội chúng kết thúc, chứ không phải tòa nhà hội đường.'
    reason: lexical_alternative
  - marker: b
    text: “Khuyên họ tiếp tục ở trong ân điển của Đức Chúa Trời” cũng có thể dịch là “thuyết phục họ cứ ở lại trong ân điển của Đức Chúa Trời.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης ... τῆς συναγωγῆς
  choice: Sau khi buổi nhóm tại hội đường kết thúc
  rationale: Cấu trúc sở hữu cách tuyệt đối diễn tả hoàn cảnh xảy ra trước. Trong ngữ cảnh, συναγωγή chỉ buổi nhóm đã tan chứ không phải tòa nhà; cách dịch này tự nhiên trong tiếng Việt và tránh nói rằng chính hội đường bị giải tán.
- source_word: ἠκολούθησαν
  choice: đi theo
  rationale: Diễn tả việc nhiều người rời buổi nhóm và theo Phao-lô cùng Ba-na-ba; giữ được nghĩa trực tiếp của động từ.
- source_word: τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: nhiều người Do Thái và những người cải đạo sùng kính
  rationale: προσήλυτοι là những người đã cải đạo sang Do Thái giáo, không chỉ là người có thiện cảm; σεβόμενοι bổ sung sắc thái kính sợ và mộ đạo. Cách diễn đạt tiếng Việt truyền đạt hai nhóm rõ ràng.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: trò chuyện với họ
  rationale: Phân từ chỉ hành động đi kèm và có tính tiếp diễn; cách dịch này tự nhiên, đồng thời giữ sắc thái tương tác trong lời nói.
- source_word: ἔπειθον αὐτοὺς προσμένειν
  choice: khuyên họ tiếp tục
  rationale: Thì chưa hoàn thành cho thấy hành động kéo dài. πείθω có thể là thuyết phục hoặc khuyên nhủ; trong ngữ cảnh lời kêu gọi, “khuyên” tự nhiên mà không làm mất lực thúc giục. προσμένω diễn tả tiếp tục hoặc bền ở lại.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: ở trong ân điển của Đức Chúa Trời
  rationale: Giữ nguyên hình ảnh về ân điển như một phạm vi mà người nghe cần tiếp tục ở trong, đồng thời không thu hẹp χάρις thành riêng ân huệ hay sứ điệp.
theological_decisions:
- issue: Ý nghĩa của “ân điển của Đức Chúa Trời” trong lời khuyên của các sứ đồ
  choice: tiếp tục ở trong ân điển của Đức Chúa Trời
  alternative: tiếp tục sống trong ân huệ của Đức Chúa Trời; tiếp tục theo sứ điệp về ân điển của Đức Chúa Trời
  rationale: Cụm Hy Lạp có thể bao hàm cả hành động ban ơn của Đức Chúa Trời lẫn đời sống được định hình bởi ân điển ấy. Giữ cách diễn đạt gần nguyên văn bảo tồn độ mở thần học và không áp đặt một cách giải thích hẹp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “buổi nhóm tại hội đường” để làm rõ nghĩa theo ngữ cảnh; dùng “người cải đạo” thay cho thuật ngữ chuyên biệt khó hiểu, và giữ cụm thần học quen thuộc “ân điển của Đức Chúa Trời”.
