id: ACT.13.26
reference: Acts 13:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: vi
  text: Thưa anh em[a], những người thuộc dòng dõi Áp-ra-ham, và những người trong anh em kính sợ Đức Chúa Trời[b], lời về sự cứu rỗi này đã được gửi đến chúng ta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể dịch sát là “Thưa những người nam, anh em”; cách xưng hô giống đực này có thể bao gồm cử tọa rộng hơn đang hiện diện.
    reason: lexical_alternative
  - marker: b
    text: Cụm này cũng có thể chỉ “những người kính sợ Đức Chúa Trời” như một nhóm người ngoại bang gắn bó với hội đường và thờ phượng Đức Chúa Trời của Ít-ra-ên.
    reason: cultural_note
  - marker: c
    text: Một số thủ bản chép “đến anh em”; theo bản văn SBLGNT ở đây là “đến chúng ta”. Cũng có thể dịch “lời của sự cứu rỗi này”.
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Cách xưng hô tự nhiên, trang trọng trong tiếng Việt, giữ hình thức nam tính của nguyên văn mà không dùng lối dịch cứng là “hỡi những người nam, anh em”.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: những người thuộc dòng dõi Áp-ra-ham
  rationale: Cụm này diễn đạt tư cách hậu duệ thuộc dòng tộc Áp-ra-ham. Dịch sát từng chữ là “các con trai của dòng giống” không tự nhiên trong tiếng Việt và có thể khiến người đọc hiểu sai rằng chỉ nói đến con trai trực hệ.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: những người trong anh em kính sợ Đức Chúa Trời
  rationale: Giữ nghĩa mô tả của φοβούμενοι thay vì biến cụm từ thành một danh xưng kỹ thuật; “kính sợ” diễn đạt lòng tôn kính và quy phục trong ngữ cảnh Kinh Thánh.
- source_word: ἡμῖν
  choice: đến chúng ta
  rationale: Giữ hướng tiếp nhận của động từ bị động “được gửi”; đại từ ngôi thứ nhất số nhiều có thể bao gồm người nói và những người đang được ông trực tiếp संब خطاب.
- source_word: ὁ λόγος
  choice: lời
  rationale: “Lời” vừa tự nhiên trong văn phong Kinh Thánh tiếng Việt vừa bảo tồn trường nghĩa của λόγος; trong ngữ cảnh, đó là lời công bố hay sứ điệp.
- source_word: τῆς σωτηρίας ταύτης
  choice: về sự cứu rỗi này
  rationale: 'Dùng “về” để diễn đạt tự nhiên quan hệ nội dung giữa λόγος và σωτηρία: lời nói về sự cứu rỗi này. Cách hiểu sở thuộc “lời của sự cứu rỗi này” vẫn được ghi nhận trong chú thích.'
- source_word: ἐξαπεστάλη
  choice: đã được gửi
  rationale: Thể hiện động từ aorist bị động và hành động sai gửi đã hoàn tất, đồng thời giữ giọng văn tự nhiên hiện đại.
theological_decisions:
- issue: Phạm vi người nghe trong Ἄνδρες ἀδελφοί
  choice: Giữ cách gọi “anh em” trong chính văn.
  alternative: “Thưa các anh chị em” hoặc dịch sát “thưa những người nam, anh em”.
  rationale: Nguyên văn mang hình thức giống đực, nhưng đây là lời xưng hô công khai có thể hướng đến toàn thể hội chúng. Chính văn không mở rộng rõ thành “anh chị em”, còn chú thích bảo tồn khả năng bao hàm cử tọa rộng hơn.
- issue: Tính chất của cụm φοβούμενοι τὸν θεόν
  choice: Dịch mô tả là “những người… kính sợ Đức Chúa Trời”.
  alternative: Dịch như danh xưng lịch sử “những người kính sợ Đức Chúa Trời” chỉ nhóm người ngoại gắn bó với hội đường.
  rationale: Cụm Hy Lạp có thể mang sắc thái gần như thuật ngữ cho người ngoại bang thờ phượng Đức Chúa Trời của Ít-ra-ên, nhưng cũng có thể được hiểu theo nghĩa mô tả. Bản dịch không ấn định quá mức; chú thích cung cấp bối cảnh văn hóa.
- issue: Quan hệ của λόγος với σωτηρία
  choice: Dịch “lời về sự cứu rỗi này”.
  alternative: “lời của sự cứu rỗi này”.
  rationale: Sở hữu cách có thể chỉ nội dung hoặc đặc tính của lời được công bố. “Về” rõ và tự nhiên trong tiếng Việt, nhưng chú thích giữ cách dịch hình thức hơn.
- issue: Phạm vi của ἡμῖν
  choice: Dịch “đến chúng ta”.
  alternative: “đến anh em/chúng ta” theo biến thể thủ bản hoặc cách xác định phạm vi người nhận.
  rationale: SBLGNT đọc ἡμῖν, ngôi thứ nhất số nhiều. “Chúng ta” bảo tồn hình thức này mà không tự ý giới hạn người nhận vào riêng người nói hay riêng cử tọa.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “Áp-ra-ham” và “Đức Chúa Trời” theo lối gọi Kinh Thánh quen thuộc; tránh lối dịch quá sát gây gượng như “các con trai của dòng giống”. Đại từ “anh em” giữ hình thức xưng hô của nguyên văn, còn chú thích làm rõ phạm vi có thể rộng hơn.
