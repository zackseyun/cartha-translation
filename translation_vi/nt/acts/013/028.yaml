  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: vi
  text: Dù không tìm thấy căn cứ nào để kết án tử hình[a], họ vẫn yêu cầu Phi-lát xử tử Người[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không tìm thấy tội gì đáng chết” hoặc “không tìm thấy lý do nào đáng phải chết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “để Người bị giết.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: không tìm thấy căn cứ nào để kết án tử hình
  rationale: Trong bối cảnh xét xử, αἰτία có thể chỉ lý do, cáo buộc hoặc căn cứ pháp lý; kết hợp với θανάτου, cụm từ nói đến căn cứ đáng chịu án chết, chứ không phải nguyên nhân gây ra cái chết.
- source_word: εὑρόντες
  choice: Dù không tìm thấy
  rationale: 'Phân từ bất định quá khứ diễn tả hoàn cảnh xảy ra trước động từ chính; trong ngữ cảnh, quan hệ nhượng bộ nổi bật: tuy không tìm thấy căn cứ tử hình, họ vẫn yêu cầu xử tử.'
- source_word: ᾐτήσαντο
  choice: họ vẫn yêu cầu
  rationale: Động từ mang nghĩa xin hoặc yêu cầu; trong bối cảnh pháp lý với Phi-lát, “yêu cầu” tự nhiên và phù hợp hơn “xin”. Từ “vẫn” làm rõ sắc thái nhượng bộ của toàn câu.
- source_word: Πιλᾶτον
  choice: Phi-lát
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: xử tử Người
  rationale: Trong bối cảnh tư pháp, ἀναιρέω mang nghĩa giết hoặc xử tử. “Xử tử” truyền đạt chính xác sắc thái hành quyết theo yêu cầu chính thức; “Người” giữ đại từ chỉ Chúa Giê-su mà không thêm danh xưng không có trong nguyên văn.
- source_word: καὶ
  choice: Dù … họ vẫn
  rationale: Liên từ καί nối tiếp mạch kể; tiếng Việt không cần dịch riêng là “và” khi cấu trúc nhượng bộ “dù… vẫn…” diễn đạt tự nhiên quan hệ của hai vế.
theological_decisions:
- issue: Có nên biểu đạt rõ sắc thái nhượng bộ của phân từ εὑρόντες hay không
  choice: Dù không tìm thấy … họ vẫn yêu cầu
  alternative: Sau khi không tìm thấy … họ yêu cầu
  rationale: 'Hình thức Hy Lạp có thể được hiểu theo hoàn cảnh hoặc thời gian, nhưng ngữ cảnh nhấn mạnh nghịch lý đạo đức và pháp lý: họ đòi hành quyết dù không có căn cứ. Cấu trúc “dù… vẫn…” giữ được sự căng thẳng ấy mà không bổ sung kết luận thần học.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Căn cứ nào để kết án tử hình” làm rõ bối cảnh pháp lý; “xử tử” nối tự nhiên với ý án tử hình. Cấu trúc “dù… vẫn…” giữ sắc thái đối nghịch của câu.
