  terminology: “Đức Chúa Trời,” “Đấng,” “đã làm cho sống lại,” và “sự mục nát” nhất quán với văn phong trang trọng và ngữ cảnh phục sinh. “Sự mục nát” truyền đạt tốt διαφθοράν; chú thích hợp lý nêu “sự hư hoại” như phương án từ vựng và giải thích mối liên hệ với Thi Thiên 16:10 trong bản Hy Lạp.
