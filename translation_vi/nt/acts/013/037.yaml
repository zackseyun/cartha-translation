  source_fidelity: 'Bản dịch phản ánh đúng cấu trúc và ý nghĩa của câu Hy Lạp: δέ được giữ bằng “Nhưng”; ὃν là đối tượng của động từ và được diễn đạt rõ bằng “Đấng mà”; ἤγειρεν được hiểu đúng theo ngữ cảnh phục sinh là “đã làm cho sống lại”; và thành ngữ οὐκ εἶδεν διαφθοράν được giữ sát là “không thấy sự mục nát.”'
