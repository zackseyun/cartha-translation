id: ACT.13.37
reference: Acts 13:37
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃν δὲ ὁ θεὸς ἤγειρεν οὐκ εἶδεν διαφθοράν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: vi
  text: Nhưng Đấng mà Đức Chúa Trời đã làm cho sống lại thì không thấy sự mục nát[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự hư hoại.” Từ Hy Lạp chỉ sự hư hoại hoặc phân rã của thân thể; cách diễn đạt này vọng lại Thi Thiên 16:10 trong bản Hy Lạp.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: Đấng mà
  rationale: Đại từ quan hệ chỉ về Chúa Giê-su, là đối tượng của động từ ἤγειρεν; “Đấng mà” vừa tự nhiên vừa thể hiện sự tôn kính mà không thêm danh xưng vào nguyên văn.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ nêu sự tương phản với Đa-vít ở câu trước, người đã chết và thấy sự mục nát.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Cách gọi trang trọng, thông dụng trong văn phong Kinh Thánh tiếng Việt hiện đại để chỉ θεός trong ngữ cảnh này.
- source_word: ἤγειρεν
  choice: đã làm cho sống lại
  rationale: Trong ngữ cảnh đối chiếu với việc Đa-vít chết và thấy sự mục nát, động từ mang nghĩa Đức Chúa Trời khiến Chúa Giê-su sống lại từ cõi chết. Cách dịch này rõ nghĩa hơn “dấy lên” trong tiếng Việt hiện đại.
- source_word: οὐκ εἶδεν
  choice: không thấy
  rationale: Giữ hình ảnh trực tiếp của thành ngữ Hy Lạp và sự vọng lại Thi Thiên 16 trong bản Hy Lạp, thay vì diễn giải thành “không trải qua”.
- source_word: διαφθοράν
  choice: sự mục nát
  rationale: Trong văn cảnh về cái chết và thân thể, từ này nói đến sự hư hoại, phân rã; “sự mục nát” dễ hiểu và vẫn phù hợp với ngôn ngữ trích dẫn Thi Thiên.
theological_decisions:
- issue: Nghĩa phục sinh của ἤγειρεν
  choice: đã làm cho sống lại, tức Đức Chúa Trời khiến Chúa Giê-su sống lại từ cõi chết
  alternative: dấy lên, theo nghĩa đưa một người xuất hiện hoặc lập người ấy lên
  rationale: Sự tương phản trực tiếp giữa Đa-vít, người đã chết và thấy sự mục nát, với Đấng được Đức Chúa Trời làm cho sống lại và không thấy sự mục nát khiến nghĩa phục sinh là nghĩa do văn cảnh xác định.
- issue: Hình ảnh “thấy sự mục nát”
  choice: giữ cách diễn đạt “không thấy sự mục nát”
  alternative: không trải qua sự phân hủy
  rationale: Cách dịch sát hình ảnh duy trì mối liên hệ với Thi Thiên 16:10 và không làm phẳng lối nói Kinh Thánh thành một lời giải thích thuần sinh học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ cấu trúc tương phản ngắn gọn của câu Hy Lạp và hình ảnh “thấy sự mục nát”; dùng “làm cho sống lại” để truyền đạt rõ nghĩa phục sinh trong tiếng Việt thông dụng.
