id: ACT.13.50
reference: Acts 13:50
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ Ἰουδαῖοι παρώτρυναν τὰς σεβομένας ⸀γυναῖκας τὰς εὐσχήμονας καὶ τοὺς πρώτους τῆς πόλεως καὶ ἐπήγειραν διωγμὸν ἐπὶ τὸν Παῦλον ⸀καὶ Βαρναβᾶν, καὶ ἐξέβαλον αὐτοὺς ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/050.yaml
  text: But the Jews stirred up the devout women of high standing and the leading men of the city[b][a], and stirred up persecution against Paul and Barnabas and drove them out of their district.
translation:
  language: vi
  text: Nhưng những người Do Thái kích động các phụ nữ sùng đạo, có địa vị[a], cùng những người đàn ông hàng đầu trong thành, rồi gây ra cuộc bách hại chống lại Phao-lô và Ba-na-ba và đuổi hai ông ra khỏi vùng của họ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “các phụ nữ kính sợ Đức Chúa Trời và có địa vị.” Phân từ Hy Lạp có thể chỉ những phụ nữ thờ Đức Chúa Trời của Israel, có lẽ là người ngoại gắn với hội đường.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ra khỏi ranh giới của họ.” Từ Hy Lạp có thể chỉ các đường biên hoặc vùng lãnh thổ nằm trong đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Nhưng những người Do Thái
  rationale: δέ đánh dấu bước chuyển tương phản với phản ứng tích cực ở câu trước; “nhưng” thể hiện rõ sự đối lập trong mạch kể.
- source_word: παρώτρυναν
  choice: kích động
  rationale: Diễn đạt hành động chủ động xúi giục các nhân vật có ảnh hưởng chống lại Phao-lô và Ba-na-ba, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: τὰς σεβομένας γυναῖκας τὰς εὐσχήμονας
  choice: các phụ nữ sùng đạo và có địa vị
  rationale: “Sùng đạo” giữ ý kính thờ mà không khẳng định quá mức địa vị kỹ thuật của họ trong hội đường; “có địa vị” truyền đạt sự nổi bật và đáng kính về mặt xã hội.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: những người đàn ông hàng đầu trong thành
  rationale: Giữ nguyên nét giống đực của cụm Hy Lạp và diễn đạt địa vị nổi trội trong đời sống đô thị.
- source_word: ἐπήγειραν διωγμὸν
  choice: gây nên cuộc bách hại
  rationale: Thể hiện lực khiến sự bách hại phát sinh, tránh lặp “kích động” quá sát trong cùng một câu nhưng vẫn giữ quan hệ nhân quả.
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: chống lại Phao-lô và Ba-na-ba
  rationale: Trong kết hợp với διωγμός, ἐπί chỉ hướng thù nghịch nhắm vào hai sứ giả.
- source_word: ἐξέβαλον αὐτοὺς
  choice: đuổi hai ông ra
  rationale: Giữ sắc thái cưỡng ép của ἐκβάλλω; “hai ông” làm rõ đại từ chỉ Phao-lô và Ba-na-ba một cách tự nhiên.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ra khỏi địa phận của họ
  rationale: “Địa phận” có thể chỉ lãnh thổ nằm trong các ranh giới, phù hợp bối cảnh thành phố và vẫn để ngỏ phạm vi chính xác của ὅρια.
theological_decisions:
- issue: Tư cách tôn giáo của σεβόμεναι
  choice: các phụ nữ sùng đạo
  alternative: các phụ nữ kính sợ Đức Chúa Trời
  rationale: Phân từ có thể chỉ những phụ nữ thờ Đức Chúa Trời của Israel, có lẽ là người ngoại gắn với hội đường; bản chính không biến khả năng này thành một nhãn kỹ thuật chắc chắn.
- issue: Cách dịch cụm giống đực τοὺς πρώτους τῆς πόλεως
  choice: những người đàn ông hàng đầu trong thành
  alternative: các lãnh đạo thành phố
  rationale: Nguyên văn dùng cụm giống đực chỉ giới tinh hoa dân sự; bản dịch giữ nét nghĩa này thay vì trung tính hóa giới tính.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Câu giữ trình tự hành động của nguyên văn và bảo toàn cả sắc thái xã hội lẫn sự mơ hồ về tư cách của các phụ nữ và phạm vi lãnh thổ.
