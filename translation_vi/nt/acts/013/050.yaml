- from: Nhưng những người Do Thái kích động các phụ nữ sùng đạo và có địa vị[a], cùng những người đàn ông hàng đầu trong thành; họ gây nên cuộc bách hại chống lại Phao-lô và Ba-na-ba, rồi đuổi hai ông ra khỏi địa phận của họ.[b]
  to: Nhưng những người Do Thái kích động các phụ nữ sùng đạo, có địa vị[a], cùng những người đàn ông hàng đầu trong thành, rồi gây ra cuộc bách hại chống lại Phao-lô và Ba-na-ba và đuổi hai ông ra khỏi vùng của họ.[b]
  rationale: Bản sửa chỉ làm rõ cấu trúc cú pháp của chuỗi hành động cùng một chủ ngữ và dùng cách gọi lãnh thổ tự nhiên hơn. Không thay đổi quan hệ nhân quả, giới tính của nhóm nam giới, tư cách tôn giáo còn mở của các phụ nữ, hay sự mơ hồ có chủ ý về phạm vi của ὅρια.
