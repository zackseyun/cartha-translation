language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: vi
  text: 'Còn về việc Đức Chúa Trời đã làm cho người sống lại từ cõi chết, để người không còn trở lại sự mục nát, Ngài đã phán thế này: “Ta sẽ ban cho các ngươi những phước lành thánh khiết và chắc chắn của Đa-vít.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát: “những điều thánh khiết, đáng tin cậy của Đa-vít.” Cụm từ này vọng lại Ê-sai 55:3. Theo cách hiểu thông dụng, đây là những phước lành hoặc lời hứa giao ước thánh khiết và đáng tin cậy gắn với, hoặc đã hứa cho, Đa-vít. Cách dịch truyền thống: “những sự thương xót chắc chắn của Đa-vít.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: đã khiến người sống lại từ cõi chết
  rationale: Diễn đạt rõ hành động của Đức Chúa Trời làm cho Chúa Giê-su sống lại; “từ cõi chết” là cách nói tự nhiên trong tiếng Việt về sự phục sinh.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: không bao giờ còn trở lại
  rationale: Trong ngữ cảnh này, cụm từ chỉ việc sự trở lại tình trạng mục nát sẽ không còn xảy ra; cách dịch này tự nhiên hơn việc bám sát nét nghĩa “sắp/định” của μέλλω.
- source_word: διαφθοράν
  choice: sự mục nát
  rationale: Chỉ sự phân hủy của thân thể trong ngữ cảnh phục sinh, tránh nghĩa luân lý mà “sự hư hoại” có thể gợi lên.
- source_word: οὕτως εἴρηκεν
  choice: Ngài đã phán thế này
  rationale: Giữ sắc thái lời Kinh Thánh đã được phán và vẫn có hiệu lực, đồng thời dẫn nhập lời trích dẫn tự nhiên.
- source_word: Δώσω ὑμῖν
  choice: Ta sẽ ban cho các con
  rationale: Thể hiện trực tiếp lời hứa ở thì tương lai; “các con” phù hợp với đối tượng số nhiều trong lời Đức Chúa Trời phán.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: những phước lành thánh khiết và chắc chắn đã hứa cho Đa-vít
  rationale: Cụm Hy Lạp cô đọng, vọng lại Ê-sai 55:3, chỉ những ân phước hay lời cam kết giao ước thiêng liêng, đáng tin gắn với Đa-vít. Bổ sung “đã hứa cho” làm rõ quan hệ mà cách nói Hy Lạp để ngỏ, nhưng vẫn ghi nhận phương án sát chữ trong chú thích.
theological_decisions:
- issue: Chủ thể của ἀνέστησεν và εἴρηκεν
  choice: nêu rõ “Đức Chúa Trời” ở mệnh đề đầu và dùng “Ngài” ở mệnh đề dẫn lời
  alternative: giữ đại từ “Ngài” ở cả hai vị trí
  rationale: Chủ thể được xác định từ diễn ngôn trước đó là Đức Chúa Trời; nêu rõ một lần giúp câu tiếng Việt độc lập và sáng nghĩa mà không thay đổi nội dung.
- issue: Ý nghĩa của τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: những phước lành thánh khiết và chắc chắn đã hứa cho Đa-vít
  alternative: những điều thánh khiết và chắc chắn của Đa-vít; những sự thương xót chắc chắn dành cho Đa-vít
  rationale: Giữ ý nghĩa giao ước và tính đáng tin của lời hứa mà không thu hẹp thành một công thức giáo lý; chú thích bảo lưu tính cô đọng và độ mơ hồ của nguyên văn.
- issue: Hệ quả của sự phục sinh đối với sự mục nát
  choice: không bao giờ còn trở lại sự mục nát nữa
  alternative: không còn sắp trở lại sự mục nát
  rationale: Đây là hệ quả được câu văn xác quyết về Đấng đã sống lại; cách dịch tránh một lối nói gượng trong tiếng Việt nhưng không thêm quan niệm thần học ngoài văn bản.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “người” để chỉ Chúa Giê-su theo đại từ αὐτόν trong mạch diễn từ, không tự ý thêm tước hiệu. Cấu trúc mở đầu “Còn về việc” phản ánh ὅτι δέ và nối với lập luận trước đó.
