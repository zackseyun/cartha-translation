  to: Ngài hiện ra trong nhiều ngày cho những người đã cùng Ngài đi từ Ga-li-lê lên Giê-ru-sa-lem[a]. Chính họ hiện nay là những người làm chứng về Ngài cho dân chúng[b].
  rationale: Chỉ điều chỉnh giới từ trong cụm cuối từ “trước dân chúng” thành “cho dân chúng” để phản ánh chính xác hơn πρὸς τὸν λαόν là đối tượng/hướng của lời chứng. Các phần còn lại trung thành với SBLGNT, tự nhiên, và giữ nguyên độ khái quát của λαός.
