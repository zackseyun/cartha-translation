id: ACT.13.31
reference: Acts 13:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ὤφθη ἐπὶ ἡμέρας πλείους τοῖς συναναβᾶσιν αὐτῷ ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ, οἵτινες ⸀νῦν εἰσὶ μάρτυρες αὐτοῦ πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: vi
  text: Ngài hiện ra trong nhiều ngày cho những người đã cùng Ngài đi từ Ga-li-lê lên Giê-ru-sa-lem[a]. Chính họ hiện nay là những người làm chứng về Ngài cho dân chúng[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ngài được nhìn thấy trong nhiều ngày.” Động từ Hy Lạp có thể được dịch sát hình thức như vậy, nhất là trong các trình thuật về những lần Chúa hiện ra sau khi sống lại.'
    reason: lexical_alternative
  - marker: b
    text: Trong văn cảnh này, “dân chúng” rất có thể chỉ dân Do Thái, tức dân Y-sơ-ra-ên.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Ngài
  rationale: Đại từ quan hệ chỉ về Chúa Giê-su ở câu trước. Tiếng Việt tự nhiên cần nêu lại chủ thể; “Ngài” giữ văn phong tôn kính mà không thêm danh xưng không có trong câu.
- source_word: ὤφθη
  choice: hiện ra
  rationale: Dạng thụ động aorist của ὁράω trong ngữ cảnh các lần Chúa phục sinh được thấy thường mang nghĩa “hiện ra”; cách dịch này tự nhiên và vẫn ghi nhận cách dịch sát hình thức “được nhìn thấy” trong chú thích.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: trong nhiều ngày
  rationale: Diễn đạt khoảng thời gian kéo dài, sát nghĩa và tự nhiên trong tiếng Việt.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: cho những người đã cùng Ngài đi ... lên
  rationale: Phân từ chỉ những người đã đồng hành với Ngài; “đã” thể hiện hành động xảy ra trước các lần hiện ra, còn “lên” giữ cách diễn đạt hành trình hướng về Giê-ru-sa-lem.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: từ Ga-li-lê lên Giê-ru-sa-lem
  rationale: Giữ đầy đủ điểm xuất phát, đích đến và sắc thái “đi lên” của động từ Hy Lạp.
- source_word: οἵτινες
  choice: Chính họ
  rationale: Đại từ quan hệ này vừa nhận diện vừa nhấn mạnh nhóm người nói trên. Tách thành câu mới với “Chính họ” giúp tiếng Việt rõ và tự nhiên.
- source_word: νῦν
  choice: hiện nay
  rationale: Giữ sự tương phản thời gian giữa các lần hiện ra trong quá khứ và vai trò làm chứng ở hiện tại.
- source_word: μάρτυρες αὐτοῦ
  choice: những người làm chứng về Ngài
  rationale: 'Diễn đạt tự nhiên mối quan hệ của αὐτοῦ: họ làm chứng liên quan đến Ngài, thay vì cách sở hữu có thể kém rõ trong tiếng Việt.'
- source_word: πρὸς τὸν λαόν
  choice: trước dân chúng
  rationale: πρός hướng đến đối tượng tiếp nhận lời chứng; “trước dân chúng” diễn đạt vai trò công khai của các nhân chứng mà không xác định quá mức thành phần dân chúng.
theological_decisions:
- issue: Bản chất ngôn ngữ về sự hiện ra sau phục sinh
  choice: Ngài hiện ra
  alternative: Ngài được nhìn thấy
  rationale: “Hiện ra” là nghĩa quen thuộc của ὤφθη trong ngữ cảnh phục sinh và không phủ nhận tính lịch sử hay thực hữu của việc các nhân chứng thấy Ngài; phương án sát hình thức được bảo lưu trong chú thích.
- issue: Phạm vi của “dân chúng”
  choice: dân chúng
  alternative: dân Y-sơ-ra-ên / dân Do Thái
  rationale: Trong văn cảnh, λαός nhiều khả năng chỉ dân Y-sơ-ra-ên, nhưng nguyên văn không nêu danh xưng cụ thể. Bản chính giữ độ khái quát của tiếng Hy Lạp và giải thích văn cảnh trong chú thích.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” cho Chúa Giê-su; địa danh được phiên âm theo lối quen thuộc. Câu Hy Lạp dài được tách thành hai câu để sáng nghĩa, đồng thời “Chính họ” bảo toàn sắc thái nhận diện/nhấn mạnh của οἵτινες.
