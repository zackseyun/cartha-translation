id: ACT.13.38
reference: Acts 13:38
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: vi
  text: Vậy, thưa anh em[a], xin hãy biết rằng nhờ Đấng ấy[b], sự tha tội được rao truyền cho anh em; và khỏi mọi điều mà anh em không thể được xưng công chính[c] nhờ Luật pháp Môi-se,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “thưa anh chị em” nếu lời xưng hô hướng đến toàn thể cử tọa, gồm cả nam lẫn nữ.
    reason: lexical_alternative
  - marker: b
    text: Tức là Giê-su, Đấng vừa được nhắc đến.
    reason: cross_reference
  - marker: c
    text: Cũng có thể dịch là “được tuyên là công chính.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Vậy ... anh em phải biết rằng
  rationale: Diễn đạt tự nhiên mệnh lệnh vô nhân xưng γνωστὸν ... ἔστω, đồng thời giữ οὖν bằng “Vậy” và sắc thái tuyên bố trang trọng.
- source_word: ἄνδρες ἀδελφοί
  choice: thưa anh em
  rationale: Đây là lối xưng hô trực tiếp, mang tính thân thuộc. “Thưa anh em” tự nhiên và trang trọng trong tiếng Việt; chú thích lưu lại khả năng lời gọi hướng đến toàn thể cộng đồng.
- source_word: διὰ τούτου
  choice: nhờ Đấng này
  rationale: Đại từ chỉ định giống đực số ít quy chiếu về Chúa Giê-su vừa được nhắc đến. “Đấng này” giữ được tính chỉ định và quy chiếu cá nhân mà không tự ý thêm danh từ “người”.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: sự tha tội
  rationale: Cách diễn đạt rõ ràng, quen thuộc và trực tiếp cho ý được tha thứ khỏi tội lỗi.
- source_word: καταγγέλλεται
  choice: được rao truyền
  rationale: Thể bị động hiện tại diễn tả việc công khai công bố sứ điệp; “được rao truyền” giữ được sắc thái truyền giảng.
- source_word: ἀπὸ πάντων ὧν
  choice: khỏi mọi điều mà
  rationale: Giữ quan hệ của ἀπό với ý được giải thoát hoặc được xưng công chính khỏi những điều đang nói đến, đồng thời dẫn tự nhiên vào mệnh đề quan hệ.
- source_word: οὐκ ἠδυνήθητε
  choice: anh em không thể
  rationale: Cách chuyển ngữ trực tiếp, tự nhiên của ý không có khả năng làm được điều được nêu sau đó.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: bởi Luật pháp Môi-se
  rationale: Trong ngữ cảnh này, ἐν có thể biểu thị phương tiện hoặc phạm vi. “Bởi” diễn đạt gọn ý không thể đạt sự xưng công chính nhờ Luật pháp Môi-se.
- source_word: δικαιωθῆναι
  choice: được xưng công chính
  rationale: Giữ sắc thái pháp lý và thần học của δικαιόω mà không biến nó thành sự thay đổi phẩm chất đạo đức; chú thích nêu cách diễn đạt sáng nghĩa hơn.
theological_decisions:
- issue: Ý nghĩa của δικαιωθῆναι trong quan hệ với Luật pháp Môi-se
  choice: được xưng công chính
  alternative: được tuyên là công chính
  rationale: “Được xưng công chính” giữ thuật ngữ thần học quen thuộc và sắc thái pháp lý. Cách “được tuyên là công chính” được ghi ở chú thích để làm rõ mà không thu hẹp nội hàm trong chính văn.
- issue: Phạm vi người nghe trong ἄνδρες ἀδελφοί
  choice: anh em
  alternative: anh chị em
  rationale: “Anh em” phản ánh hình thức giống đực của nguyên văn và là lối gọi cộng đồng tự nhiên trong văn phong Kinh Thánh tiếng Việt. Chú thích bảo lưu khả năng lời xưng hô bao gồm cả phụ nữ trong cử tọa.
- issue: Ranh giới câu và câu 39
  choice: Không thêm mệnh đề Hy Lạp không có trong nguồn được cung cấp; dùng gạch ngang để cho thấy ý còn tiếp tục
  alternative: Thêm “mọi người tin đều được xưng công chính” từ câu 39 như lớp tham khảo tiếng Anh
  rationale: Nguồn SBLGNT được cung cấp cho câu 38 kết thúc ở δικαιωθῆναι và về cú pháp còn tiếp tục sang câu 39. Mệnh đề “mọi người tin đều được xưng công chính” không hiện diện trong chuỗi Hy Lạp đã cung cấp, nên không được nhập âm thầm vào bản dịch câu này.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Giữ lối xưng hô cộng đồng “anh em,” thuật ngữ “được xưng công chính,” và cấu trúc công bố của bài giảng. Dấu gạch ngang cuối câu thể hiện trung thực rằng nguồn Hy Lạp được cung cấp dừng giữa một câu cú pháp tiếp tục sang câu 39.
