  source_fidelity: 'Bản dịch phản ánh đúng các thành tố của câu 38: lời dẫn nhập suy luận, lời xưng hô, sự tha tội được công bố qua Đấng được nhắc đến, và sự bất lực được xưng công chính liên hệ với Luật pháp Môi-se. Việc không nhập mệnh đề chủ ngữ/chính ngữ của câu 39 vào chính văn là đúng theo nguồn Hy Lạp được cung cấp, vốn kết thúc giữa cấu trúc cú pháp.'
  naturalness: 'Cần chỉnh nhẹ để tiếng Việt hiện đại tự nhiên hơn: “xin hãy biết rằng” phù hợp với γνωστὸν ... ἔστω hơn “anh em phải biết”; “nhờ Luật pháp Môi-se” tự nhiên và rõ quan hệ phương tiện hơn “bởi Luật pháp Môi-se”; “Đấng ấy” bớt sắc thái chỉ trỏ không tự nhiên của “Đấng này”. Dấu phẩy cuối giữ rõ câu còn tiếp sang câu 39 mà không tạo cảm giác một dấu gạch ngang bị bỏ lửng.'
  terminology: “Sự tha tội,” “rao truyền,” và “được xưng công chính” đều phù hợp với văn phong Kinh Thánh tiếng Việt và bảo toàn sắc thái công bố cùng thuật ngữ pháp lý của ἄφεσις, καταγγέλλεται, và δικαιωθῆναι. Chú thích về “được tuyên là công chính” hữu ích. Chú thích quy chiếu không nên thêm tước hiệu “Chúa” khi chỉ cần nhận diện người được nói đến là Giê-su.
