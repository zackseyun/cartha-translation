source:
  edition: SBLGNT
  text: οἵτινες ἀνακρίναντές με ἐβούλοντο ἀπολῦσαι διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/018.yaml
  text: who[a], after examining me, wanted to release me because there was no basis for the death penalty in my case.
translation:
  language: vi
  text: Sau khi xét hỏi tôi, họ muốn trả tự do cho tôi, vì không có lý do nào để kết án tử hình tôi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vì không có cáo buộc nào đáng án tử hình đối với tôi.”'
    reason: αἰτία trong ngữ cảnh tư pháp có thể được hiểu là “căn cứ/lý do” hoặc “cáo buộc”; ἐν ἐμοί có thể diễn đạt tự nhiên là “đối với tôi”.
lexical_decisions:
- source_word: οἵτινες
  choice: họ
  rationale: Dùng đại từ nối tiếp nhóm người đã được nhắc đến trong ngữ cảnh; tiếng Việt tự nhiên không cần tái tạo riêng sắc thái định tính nhẹ của ὅστις.
- source_word: ἀνακρίναντές με
  choice: sau khi thẩm vấn tôi
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; “thẩm vấn” phù hợp với bối cảnh điều tra tư pháp.
- source_word: ἐβούλοντο
  choice: muốn
  rationale: Diễn đạt ý định trong quá khứ một cách tự nhiên, không nhấn quá mức rằng họ đã quyết định chính thức.
- source_word: ἀπολῦσαι
  choice: thả tôi
  rationale: Trong bối cảnh pháp lý, từ này nói đến việc trả tự do khỏi sự giam giữ; “thả” rõ ràng và tự nhiên trong tiếng Việt.
- source_word: διὰ τὸ μηδεμίαν αἰτίαν θανάτου ὑπάρχειν ἐν ἐμοί
  choice: vì không tìm thấy nơi tôi điều gì đáng bị xử tử
  rationale: Giữ quan hệ nguyên nhân và ý nghĩa pháp lý của αἰτία θανάτου, đồng thời diễn đạt ἐν ἐμοί bằng cấu trúc tiếng Việt tự nhiên. “Đáng bị xử tử” bảo toàn ý nghĩa án tử hình mà không buộc αἰτία chỉ mang nghĩa “cáo buộc” hay “căn cứ”.
