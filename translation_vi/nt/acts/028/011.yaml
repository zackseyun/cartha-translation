  text: Μετὰ δὲ τρεῖς μῆνας ⸀ἀνήχθημεν ἐν πλοίῳ παρακεχειμακότι ἐν τῇ νήσῳ Ἀλεξανδρίνῳ, παρασήμῳ Διοσκούροις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/011.yaml
  text: After three months we set sail in an Alexandrian ship that had wintered on the island[a], with the Dioscuri as its figurehead.
translation:
  language: vi
  text: Sau ba tháng, chúng tôi ra khơi trên một chiếc tàu từ Alexandria đã qua mùa đông trên đảo ấy, mang biểu hiệu Dioscuri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dioscuri là Castor và Pollux, hai anh em sinh đôi, con của Zeus trong thần thoại Hy Lạp–La Mã.
    reason: Giải thích danh xưng riêng Διοσκούροις và bối cảnh thần thoại cho độc giả hiện đại.
lexical_decisions:
- source_word: Μετὰ δὲ τρεῖς μῆνας
  choice: Sau ba tháng
  rationale: μετά với đối cách chỉ thời điểm sau một khoảng thời gian; δέ chỉ nối tiếp nhẹ nên không cần dịch riêng trong tiếng Việt.
- source_word: ἀνήχθημεν
  choice: chúng tôi ra khơi
  rationale: Trong ngữ cảnh hàng hải, ἀνάγω có nghĩa là rời bến để đi biển; “ra khơi” tự nhiên và chính xác.
- source_word: ἐν πλοίῳ ... Ἀλεξανδρίνῳ
  choice: trên một chiếc tàu từ Alexandria
  rationale: Tiếng Việt tự nhiên dùng “trên tàu”; tính từ Ἀλεξανδρίνῳ chỉ nguồn gốc hoặc mối liên hệ với Alexandria, nên “từ Alexandria” rõ nghĩa hơn “tàu Alexandria”.
- source_word: παρακεχειμακότι ἐν τῇ νήσῳ
  choice: đã trú đông tại đảo ấy
  rationale: Phân từ hoàn thành của παραχειμάζω nói con tàu đã lưu lại qua mùa đông; “trú đông” gọn và hợp ngữ cảnh. “Đảo ấy” liên kết với hòn đảo đã được nhắc đến, tức Malta.
- source_word: παρασήμῳ Διοσκούροις
  choice: Tàu mang biểu tượng Song Thần
  rationale: παράσημος chỉ dấu hiệu, huy hiệu hoặc hình tượng nhận diện của tàu, nhưng không xác định chắc chắn đó là tượng ở mũi tàu; “biểu tượng” giữ được độ rộng nghĩa. Διόσκουροι được chuyển là “Song Thần”, kèm chú thích nhận diện Castor và Pollux.
theological_decisions:
- issue: Cách dịch biểu tượng ngoại giáo Διοσκούροις
  choice: Song Thần
  alternative: Dioscuri; Castor và Pollux; hai con trai sinh đôi của Zeus
  rationale: Câu chỉ tường thuật tên biểu tượng trên tàu, không hàm ý tán thành tín ngưỡng ấy. “Song Thần” chuyển được ý nghĩa của danh xưng theo cách ngắn gọn, còn chú thích cung cấp tên riêng và bối cảnh thần thoại.
- issue: Mức độ xác định của παρασήμῳ
  choice: mang biểu tượng
  alternative: có tượng Song Thần ở mũi tàu
  rationale: Từ Hy Lạp có thể nói đến dấu hiệu, huy hiệu hoặc hình tượng nhận diện; dịch “tượng ở mũi tàu” sẽ thu hẹp một khả năng chưa được câu văn xác quyết.
translation_notes:
  register: Văn phong kể chuyện trang trọng, sáng rõ và hiện đại. Câu được tách làm hai để tránh chuỗi bổ nghĩa nặng nề, đồng thời vẫn giữ nguyên quan hệ ý nghĩa của bản Hy Lạp.
