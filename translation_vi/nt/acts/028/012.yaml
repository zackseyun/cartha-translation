  text: καὶ καταχθέντες εἰς Συρακούσας ἐπεμείναμεν ἡμέρας τρεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/012.yaml
  text: And after putting in at Syracuse[a], we stayed there three days.
translation:
  language: vi
  text: Sau khi cập cảng Sy-ra-cu-sa[a], chúng tôi ở lại đó ba ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Sau khi lên bờ tại Sy-ra-cu-sa” hoặc “Sau khi ghé vào Sy-ra-cu-sa.” Phân từ Hy Lạp ở đây mang nghĩa hàng hải.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταχθέντες
  choice: sau khi cập cảng
  rationale: Trong bối cảnh hành trình đường biển, phân từ của κατάγω mang nghĩa tàu ghé hoặc vào cảng. “Cập cảng” diễn đạt rõ sắc thái hàng hải và tự nhiên trong tiếng Việt.
- source_word: εἰς Συρακούσας
  choice: Sy-ra-cu-sa
  rationale: Giới từ εἰς chỉ đích đến; với động từ hàng hải “cập cảng,” tiếng Việt không cần thêm giới từ. Tên địa danh được phiên âm theo âm dạng Hy Lạp.
- source_word: ἐπεμείναμεν
  choice: chúng tôi ở lại đó
  rationale: Động từ có nghĩa là tiếp tục ở lại hoặc lưu lại. “Ở lại đó” là cách nói hiện đại, tự nhiên và làm rõ địa điểm đã được nêu trong câu.
- source_word: ἡμέρας τρεῖς
  choice: ba ngày
  rationale: Đối cách diễn tả khoảng thời gian; “ba ngày” truyền đạt đầy đủ thời lượng mà không cần thêm từ “trong”.
