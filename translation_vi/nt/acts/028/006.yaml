  terminology: “Sưng phồng lên,” “bất thình lình ngã xuống chết,” “điều gì bất thường,” “đổi ý,” và “một vị thần” đều phù hợp. Đặc biệt, “một vị thần” bảo toàn đúng khung đa thần của lời nói được thuật lại, không gợi ý một tuyên xưng về Đức Chúa Trời.
  issues:
