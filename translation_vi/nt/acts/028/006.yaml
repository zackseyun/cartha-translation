id: ACT.28.6
reference: Acts 28:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ προσεδόκων αὐτὸν μέλλειν πίμπρασθαι ἢ καταπίπτειν ἄφνω νεκρόν. ἐπὶ πολὺ δὲ αὐτῶν προσδοκώντων καὶ θεωρούντων μηδὲν ἄτοπον εἰς αὐτὸν γινόμενον, ⸀μεταβαλόμενοι ἔλεγον ⸂αὐτὸν εἶναι θεόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/006.yaml
  text: But they were expecting him to swell up or suddenly fall down dead. But after they had waited a long time and saw that nothing unusual was happening to him[a], they changed their minds and began saying that he was a god.
translation:
  language: vi
  text: Nhưng họ cứ trông đợi ông sẽ sưng phồng lên hoặc bất thình lình ngã xuống chết. Sau khi chờ đợi khá lâu và thấy không có điều gì bất thường xảy ra với ông[a], họ đổi ý và bắt đầu nói rằng ông là một vị thần.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có điều gì khác thường” hoặc “không có chuyện gì không ổn” xảy ra với ông.'
    reason: ἄτοπος có thể chỉ điều bất thường, khác thường hoặc không ổn; chú thích bảo toàn biên độ nghĩa của từ.
lexical_decisions:
- source_word: προσεδόκων
  choice: cứ nghĩ rằng
  rationale: Thì chưa hoàn thành diễn tả sự trông đợi kéo dài; “cứ nghĩ rằng” tự nhiên trong tiếng Việt và giữ được sắc thái liên tục.
- source_word: μέλλειν
  choice: sẽ
  rationale: Trong kết cấu với các động từ nguyên mẫu, từ này diễn tả hậu quả được cho là sắp xảy đến; “sẽ” truyền đạt tự nhiên sự dự liệu ấy.
- source_word: πίμπρασθαι
  choice: sưng phồng lên
  rationale: Trong bối cảnh bị rắn cắn, động từ chỉ phản ứng cơ thể sưng lên, không phải nghĩa đen là cháy.
- source_word: καταπίπτειν ἄφνω νεκρόν
  choice: bất thình lình ngã xuống chết
  rationale: Giữ cả ý đột ngột, động tác ngã xuống và kết quả là chết.
- source_word: ἐπὶ πολὺ
  choice: sau khi chờ đợi khá lâu
  rationale: Thành ngữ chỉ một khoảng thời gian kéo dài; chuyển thành mệnh đề thời gian giúp câu tiếng Việt rõ và tự nhiên.
- source_word: θεωρούντων
  choice: thấy
  rationale: Động từ hàm ý chăm chú quan sát rồi nhận thấy; “thấy” phù hợp trong mệnh đề kết hợp với việc chờ đợi.
- source_word: μηδὲν ἄτοπον
  choice: không có điều gì bất thường
  rationale: Giữ phạm vi nghĩa rộng của ἄτοπος là lạ thường, trái thông lệ hoặc không ổn, mà không thu hẹp thành chỉ “có hại”.
- source_word: μεταβαλόμενοι
  choice: họ đổi ý
  rationale: Diễn tả sự đảo ngược nhận định hoặc thái độ; cách nói này rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: ἔλεγον
  choice: bắt đầu nói
  rationale: Thì chưa hoàn thành có thể mang sắc thái khởi đầu hoặc tiếp diễn; ở đây “bắt đầu nói” làm rõ kết luận mới sau khi họ đổi ý.
- source_word: θεόν
  choice: một vị thần
  rationale: Trong bối cảnh đa thần và với danh từ không có mạo từ, cách dịch bất định này phù hợp hơn “Đức Chúa Trời”; “vị” giữ giọng văn trang trọng và tự nhiên.
theological_decisions:
- issue: Cách dịch αὐτὸν εἶναι θεόν mà không gán cho Phao-lô một địa vị thần linh theo niềm tin Cơ Đốc
  choice: ông là một vị thần
  alternative: ông là Đức Chúa Trời; ông có tính thần linh
  rationale: Đây là lời tường thuật kết luận sai lầm của cư dân đảo trong khung tư tưởng đa thần. “Một vị thần” bảo toàn bối cảnh ấy và tránh đồng nhất Phao-lô với Đức Chúa Trời.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “ông” để chỉ Phao-lô theo mạch kể; cấu trúc câu giữ sự tương phản và diễn tiến của bản Hy Lạp.
