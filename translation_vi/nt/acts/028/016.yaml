  yaml_path: translation/nt/acts/028/016.yaml
  text: When we entered Rome[a], Paul was permitted to stay by himself with the soldier guarding him.
translation:
  language: vi
  text: Khi chúng tôi vào Rô-ma, Phao-lô được phép ở riêng, cùng với người lính canh giữ ông.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch phần sau: “Phao-lô được phép sống riêng với một người lính canh giữ ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε
  choice: Khi
  rationale: Liên từ chỉ thời gian, mở đầu hoàn cảnh khi đoàn người vào Rô-ma; “Khi” tự nhiên và sát nghĩa trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: —
  rationale: Ở đây δέ chỉ là từ nối nhẹ trong mạch kể chuyện; không dịch thành một từ riêng giúp câu tiếng Việt tự nhiên mà không làm mất ý.
- source_word: εἰσήλθομεν εἰς Ῥώμην
  choice: chúng tôi vào Rô-ma
  rationale: Động từ εἰσέρχομαι với εἰς diễn tả chuyển động đi vào; “vào Rô-ma” giữ trực tiếp nét nghĩa này.
- source_word: ἐπετράπη τῷ Παύλῳ
  choice: Phao-lô được phép
  rationale: Thể bị động của ἐπιτρέπω cho biết Phao-lô được ban cho sự cho phép; cách diễn đạt này vừa sát cấu trúc vừa tự nhiên.
- source_word: μένειν
  choice: ở
  rationale: Trong bối cảnh chỗ lưu trú khi bị quản thúc, “ở” là cách diễn đạt gọn và tự nhiên; “lưu lại” cũng có thể hiểu được nhưng kém tự nhiên hơn ở đây.
- source_word: καθ’ ἑαυτόν
  choice: ở riêng
  rationale: Cụm này nói đến việc ở tách riêng, chứ không khẳng định hoàn toàn không có ai bên cạnh, vì ngay sau đó có nhắc đến người lính canh.
- source_word: σὺν τῷ φυλάσσοντι αὐτὸν στρατιώτῃ
  choice: cùng với người lính canh giữ ông
  rationale: σύν biểu thị sự ở cùng; phân từ φυλάσσοντι mô tả nhiệm vụ của người lính. Mạo từ xác định cho thấy đây là người lính được giao canh giữ Phao-lô trong hoàn cảnh ấy.
