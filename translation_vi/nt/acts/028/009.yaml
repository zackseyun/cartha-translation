  text: τούτου ⸀δὲ γενομένου καὶ οἱ λοιποὶ οἱ ⸂ἐν τῇ νήσῳ ἔχοντες ἀσθενείας⸃ προσήρχοντο καὶ ἐθεραπεύοντο,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/009.yaml
  text: And after this happened[a], the rest of those on the island who had diseases also came and were healed.
translation:
  language: vi
  text: Sau khi việc ấy xảy ra, những người khác trên đảo mắc bệnh[a] cũng đến và được chữa lành.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “đau yếu.” Tiếng Hy Lạp nói sát là “có những bệnh tật.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου δὲ γενομένου
  choice: Sau khi việc ấy xảy ra
  rationale: Cụm sở hữu cách tuyệt đối diễn tả trình tự thời gian, còn δέ chuyển sang diễn biến tiếp theo; cách dịch này tự nhiên và giữ rõ sự nối tiếp với phép chữa lành vừa kể.
- source_word: οἱ λοιποί
  choice: những người khác
  rationale: Chỉ những người ngoài trường hợp đã được nhắc đến trước đó; cách diễn đạt này tự nhiên hơn “những người còn lại” trong tiếng Việt ở ngữ cảnh này.
- source_word: οἱ ἐν τῇ νήσῳ
  choice: trên đảo
  rationale: Xác định những người đang ở trên đảo Man-ta, không thêm tên đảo vì câu Hy Lạp chỉ nói “đảo”.
- source_word: ἔχοντες ἀσθενείας
  choice: mắc bệnh
  rationale: Diễn đạt tự nhiên ý sát chữ “có những bệnh tật/đau yếu,” đồng thời không thu hẹp vào một loại bệnh cụ thể.
- source_word: προσήρχοντο
  choice: đến
  rationale: Động từ ở thì vị hoàn có thể gợi việc nhiều người lần lượt đến; “đến” giữ lời văn gọn và không thêm đối tượng không được nêu rõ trong câu.
- source_word: ἐθεραπεύοντο
  choice: được chữa lành
  rationale: Giữ thể bị động của tiếng Hy Lạp và phù hợp với ngữ cảnh chữa bệnh; thì vị hoàn gợi tiến trình lặp lại khi người bệnh đến.
- source_word: καὶ
  choice: cũng
  rationale: 'Nêu sự tiếp nối với trường hợp chữa lành trước đó: những người bệnh khác cũng đến và được chữa lành.'
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ thể bị động “được chữa lành,” không thêm “bởi Phao-lô” hay “đến với ông” vì các ý ấy không được nói rõ trong nguyên văn câu này.
