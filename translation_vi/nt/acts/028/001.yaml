  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Καὶ διασωθέντες τότε ⸀ἐπέγνωμεν ὅτι ⸀Μελίτη ἡ νῆσος καλεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/001.yaml
  text: After we had been brought safely through[d][c][b][a], we then learned that the island was called Malta.
translation:
  language: vi
  text: Sau khi được cứu thoát an toàn[a], bấy giờ chúng tôi mới biết đảo ấy gọi là Man-ta[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi đã thoát nạn an toàn” hoặc “sau khi được cứu.” Động từ Hy Lạp nhấn mạnh việc được cứu thoát qua cơn nguy hiểm.'
    reason: lexical_alternative
  - marker: b
    text: 'Hy Lạp: Melitē, hòn đảo theo truyền thống được xác định là Malta.'
    reason: cultural_note
  - marker: c
    text: 'Sát nghĩa: “đảo ấy được gọi là Man-ta.” Tiếng Hy Lạp dùng động từ bị động ở thì hiện tại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασωθέντες
  choice: sau khi được cứu thoát an toàn
  rationale: Phân từ thụ động bất định diễn tả việc được đưa qua cơn nguy hiểm và thoát nạn; cách dịch giữ sắc thái thụ động cùng bối cảnh đắm tàu.
- source_word: τότε
  choice: bấy giờ... mới
  rationale: 'Diễn đạt tự nhiên trình tự thời gian: chỉ sau khi thoát nạn, họ mới biết tên đảo.'
- source_word: ἐπέγνωμεν
  choice: chúng tôi mới biết
  rationale: Trong ngữ cảnh này, động từ chỉ việc biết được một thông tin trước đó chưa biết, chứ không nhất thiết là nhận ra bằng mắt.
- source_word: Μελίτη
  choice: Man-ta
  rationale: Dùng tên tiếng Việt thông dụng của đảo Malta; chú thích ghi lại dạng Hy Lạp và nhận diện truyền thống.
- source_word: ἡ νῆσος
  choice: đảo ấy
  rationale: Danh từ có mạo từ chỉ hòn đảo nơi đoàn người vừa lên bờ; 'đảo ấy' tự nhiên trong mạch kể tiếng Việt.
- source_word: καλεῖται
  choice: gọi là
  rationale: Giữ sát hiện tại bị động của tiếng Hy Lạp mà vẫn tự nhiên trong tiếng Việt; cấu trúc 'đảo ấy gọi là' mang nghĩa tên hiện hành của đảo.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Cấu trúc “bấy giờ... mới” truyền đạt cả τότε lẫn quan hệ trước–sau của phân từ mà tránh câu tiếng Việt nặng nề. Giữ mọi chú thích ngay sau từ ngữ liên quan.
