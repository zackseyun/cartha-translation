id: ACT.28.19
reference: Acts 28:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀντιλεγόντων δὲ τῶν Ἰουδαίων ἠναγκάσθην ἐπικαλέσασθαι Καίσαρα, οὐχ ὡς τοῦ ἔθνους μου ἔχων τι ⸀κατηγορεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/019.yaml
  text: But because the Jews objected[b][a], I was compelled to appeal to Caesar—not because I had anything to accuse my nation of.
translation:
  language: vi
  text: Nhưng vì người Do Thái[a][b] phản đối, tôi buộc phải kháng cáo lên Sê-sa—không phải vì tôi có điều gì để tố cáo dân tộc mình.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “trong khi người Do Thái chống đối tôi” hoặc “vì người Do Thái chống đối tôi”.
    reason: lexical_alternative
  - marker: b
    text: “Người Do Thái” ở đây chỉ những người Do Thái chống đối Phao-lô trong vụ việc pháp lý này, không phải là một nhận định khái quát về toàn thể người Do Thái.
    reason: cultural_note
lexical_decisions:
- source_word: ἀντιλεγόντων
  choice: vì ... phản đối
  rationale: Cụm phân từ sở hữu cách tuyệt đối nêu hoàn cảnh dẫn đến hành động của Phao-lô. “Phản đối” tự nhiên trong tiếng Việt hiện đại, phù hợp bối cảnh pháp lý và không giới hạn nghĩa vào việc chỉ tranh cãi bằng lời.
- source_word: δὲ
  choice: Nhưng
  rationale: Diễn đạt sự chuyển ý có sắc thái tương phản nhẹ với lời Phao-lô vừa trình bày.
- source_word: τῶν Ἰουδαίων
  choice: người Do Thái
  rationale: Giữ cách gọi trực tiếp của nguyên văn, không tự ý thu hẹp thành “các lãnh đạo Do Thái”. Ngữ cảnh cho thấy đây là những người Do Thái phản đối Phao-lô trong vụ kiện; chú thích làm rõ phạm vi chỉ định.
- source_word: ἠναγκάσθην
  choice: tôi buộc phải
  rationale: Thể bị động biểu thị sự ép buộc hoặc tình thế bắt buộc. Cách nói này tự nhiên trong tiếng Việt mà vẫn giữ sắc thái pháp lý.
- source_word: ἐπικαλέσασθαι Καίσαρα
  choice: kháng cáo lên Sê-sa
  rationale: Đây là cách diễn đạt pháp lý chỉ việc viện đến quyền được hoàng đế xét xử. “Kháng cáo lên” rõ nghĩa trong tiếng Việt; “Sê-sa” giữ danh hiệu được dùng trong nguyên văn.
- source_word: οὐχ ὡς
  choice: không phải vì
  rationale: 'Giới thiệu lời đính chính về động cơ của Phao-lô: việc kháng cáo không xuất phát từ ý định tố cáo dân mình.'
- source_word: τοῦ ἔθνους μου
  choice: dân tộc mình
  rationale: ἔθνος ở đây chỉ cộng đồng dân tộc của Phao-lô. “Dân tộc mình” giữ ý nghĩa tập thể và tự nhiên hơn trong câu tiếng Việt.
- source_word: ἔχων τι κατηγορεῖν
  choice: tôi có điều gì để tố cáo
  rationale: Giữ sắc thái pháp lý của κατηγορεῖν và diễn đạt rõ việc Phao-lô phủ nhận rằng mình có bất cứ cáo buộc nào chống lại dân tộc mình.
theological_decisions:
- issue: Phạm vi chỉ định của “người Do Thái” trong cách diễn đạt nhạy cảm về sắc tộc và tôn giáo
  choice: Giữ “người Do Thái” trong chính văn như cách dịch trực tiếp τῶν Ἰουδαίων.
  alternative: “các lãnh đạo Do Thái” hoặc “người Giu-đê”
  rationale: Nguyên văn không nói cụ thể là các lãnh đạo và trong ngữ cảnh này cụm từ chỉ những người Do Thái đang phản đối Phao-lô về pháp lý, chứ không phải toàn thể người Do Thái. Chú thích làm rõ ngữ cảnh mà không thêm giới hạn vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu giữ sắc thái biện hộ pháp lý; dấu gạch ngang làm nổi bật lời Phao-lô đính chính động cơ. Các dấu chú thích [a], [b] đều xuất hiện trong chính văn.
