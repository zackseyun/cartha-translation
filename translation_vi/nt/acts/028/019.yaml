  source_fidelity: 'Chính văn truyền đạt chính xác các yếu tố Hy Lạp: δέ mang sắc thái chuyển ý/tương phản (“Nhưng”); cách tuyệt đối ἀντιλεγόντων được diễn đạt phù hợp (“vì người Do Thái phản đối”); ἠναγκάσθην giữ ý bị thúc bách; ἐπικαλέσασθαι Καίσαρα được dịch đúng theo ngữ cảnh pháp lý; và mệnh đề οὐχ ὡς… giữ rõ lời phủ nhận động cơ tố cáo dân mình. Tuy nhiên, phương án chú thích “bác lại lời tôi” thêm đối tượng “lời tôi”, vốn không có trong từ ἀντιλέγω ở đây; nguyên ngữ nói đến sự chống đối/đối nghịch từ phía họ, không xác định họ bác một lời nói cụ thể của Phao-lô.'
