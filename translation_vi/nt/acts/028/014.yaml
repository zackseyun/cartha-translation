source:
  edition: SBLGNT
  text: οὗ εὑρόντες ἀδελφοὺς παρεκλήθημεν ⸀παρ’ αὐτοῖς ἐπιμεῖναι ἡμέρας ἑπτά· καὶ οὕτως εἰς τὴν Ῥώμην ἤλθαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/014.yaml
  text: There we found brothers, and we were invited to stay with them seven days. And so we came to Rome.
translation:
  language: vi
  text: Ở đó, chúng tôi gặp được các anh em[a] và được mời ở lại với họ bảy ngày. Và như vậy, chúng tôi đến Rô-ma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “các anh chị em”; tiếng Hy Lạp viết “các anh em”, nhưng trong ngữ cảnh này từ này có lẽ chỉ chung những người cùng đức tin.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: Tại đó
  rationale: Trạng từ quan hệ chỉ nơi chốn, quy chiếu về Pu-tê-ô-li vừa được nhắc đến; “Tại đó” tự nhiên trong tiếng Việt hiện đại.
- source_word: εὑρόντες
  choice: chúng tôi gặp
  rationale: Phân từ bất định quá khứ có cùng chủ thể với động từ chính; chuyển thành động từ hữu hạn để câu tiếng Việt tự nhiên và vẫn giữ trình tự hành động.
- source_word: ἀδελφοὺς
  choice: các anh em
  rationale: Giữ hình thức nam tính của từ Hy Lạp, đồng thời ngữ cảnh cho thấy đây là cách gọi những người cùng đức tin; chú thích nêu rõ phạm vi có thể bao gồm cả nam lẫn nữ.
- source_word: παρεκλήθημεν
  choice: được mời
  rationale: Thể thụ động của παρακαλέω trong bối cảnh tiếp đón và lưu trú tự nhiên nhất là “được mời”, thay vì sắc thái mạnh hơn như “được nài xin”.
- source_word: παρ’ αὐτοῖς ἐπιμεῖναι
  choice: ở lại với họ
  rationale: Diễn đạt tự nhiên việc lưu trú trong sự hiện diện hoặc tại nơi của những tín hữu địa phương.
- source_word: ἡμέρας ἑπτά
  choice: bảy ngày
  rationale: Đối cách chỉ khoảng thời gian; tiếng Việt không cần thêm giới từ.
- source_word: καὶ οὕτως
  choice: Rồi như thế
  rationale: Giữ cả lực nối tiếp của καί và sắc thái “theo cách như vậy” của οὕτως, không thu hẹp thành một kết quả đơn thuần.
- source_word: εἰς τὴν Ῥώμην ἤλθαμεν
  choice: chúng tôi đến Rô-ma
  rationale: ἔρχομαι với εἰς chỉ sự đi đến đích; “đến Rô-ma” rõ ràng, tự nhiên và giữ lời kể ngôi thứ nhất.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοὺς
  choice: các tín hữu địa phương, được gọi theo nguyên văn là “các anh em”
  alternative: anh em ruột; hoặc đồng bào Do Thái nói chung
  rationale: Trong mạch kể hành trình của Công vụ, việc họ tiếp đón và mời phái đoàn ở lại phù hợp nhất với cộng đồng tín hữu địa phương. Bản dịch không biến cách gọi này thành một thuật ngữ giáo phái và chú thích giữ khả năng bao gồm cả tín hữu nam lẫn nữ.
- issue: Sắc thái của καὶ οὕτως
  choice: Rồi như thế
  alternative: Và vì thế; rồi sau đó
  rationale: Cụm Hy Lạp có thể gợi cả phương cách và sự chuyển tiếp của câu chuyện. “Rồi như thế” giữ được độ mở ấy, không khẳng định riêng quan hệ nhân quả hay chỉ trình tự thời gian.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Rô-ma” theo lối phiên âm quen thuộc trong tiếng Việt. Cấu trúc câu giữ nhịp kể hành trình, đồng thời tránh văn phong quá cổ hoặc giải thích quá mức trong chính văn.
