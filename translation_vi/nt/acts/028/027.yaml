id: ACT.28.27
reference: Acts 28:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/027.yaml
  text: For the heart of this people has become dull[a], and with their ears they heard heavily, and they closed their eyes; otherwise they might see with their eyes and hear with their ears and understand with their heart and turn back[b], and I would heal them.
translation:
  language: vi
  text: Vì lòng dân này đã trở nên chai lì,[a] tai họ nghe một cách nặng nề, và họ đã nhắm mắt lại; nếu không, họ có thể thấy bằng mắt, nghe bằng tai, hiểu bằng lòng, rồi quay trở lại,[b] và Ta sẽ chữa lành họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng hình ảnh “trở nên dày/béo,” theo nghĩa bóng là trở nên trì độn hoặc không còn nhạy bén.
    reason: lexical_alternative
  - marker: b
    text: '“Quay trở lại” cũng có thể dịch là “quay lại,” “trở về,” hoặc, trong văn cảnh, là “ăn năn.” Từ “nếu không” cũng có thể mang sắc thái mạnh hơn: “kẻo họ thấy… nghe… hiểu… rồi quay lại, và Ta chữa lành họ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: đã trở nên chai lì
  rationale: Động từ có nghĩa đen là trở nên dày hoặc béo, nhưng ở đây được dùng ẩn dụ về sự mất nhạy bén thuộc linh. “Chai lì” tự nhiên trong tiếng Việt và vẫn giữ sắc thái ẩn dụ.
- source_word: καρδία
  choice: lòng
  rationale: “Lòng” là cách diễn đạt Kinh Thánh tự nhiên trong tiếng Việt, chỉ trung tâm nhận thức và ý chí, đồng thời duy trì sự thống nhất với cụm “lấy lòng mà hiểu” ở phần sau.
- source_word: βαρέως ἤκουσαν
  choice: tai họ nghe mà khó tiếp nhận
  rationale: Cụm Hy Lạp nói họ nghe một cách nặng nề, tức khó nghe hoặc khó tiếp thu. Cách dịch này dễ hiểu hơn “nghe nặng nề” mà không giản lược thành hoàn toàn không nghe.
- source_word: ἐκάμμυσαν
  choice: mắt họ nhắm lại
  rationale: Động từ chỉ hành động nhắm hoặc khép mắt; cách dịch giữ vai trò chủ động và trách nhiệm của chính họ.
- source_word: μήποτε
  choice: nếu không
  rationale: Trong mạch câu này, cụm từ có thể biểu thị điều cần tránh hoặc kết quả phủ định. “Nếu không” tạo câu tiếng Việt tự nhiên và giữ phần nào tính căng thẳng của nguyên văn; sắc thái mạnh hơn được ghi ở chú thích.
- source_word: ἐπιστρέψωσιν
  choice: quay trở lại
  rationale: Giữ hình ảnh chuyển hướng hoặc trở về mà không thu hẹp nghĩa thành một thuật ngữ thần học chuyên biệt như “ăn năn” hay “được cải đạo”.
- source_word: ἰάσομαι
  choice: Ta sẽ chữa lành họ
  rationale: Đây là động từ tương lai chỉ việc chữa lành. “Sẽ” bám sát hình thức Hy Lạp và vẫn phù hợp trong chuỗi mệnh đề khả hữu của câu.
theological_decisions:
- issue: Ý định thần thượng trong lời trích dẫn Ê-sai
  choice: Dùng “nếu không” trong chính văn và nêu sắc thái “kẻo/để họ khỏi” ở chú thích.
  alternative: Dịch trực tiếp “kẻo họ...” hoặc “để họ khỏi...” nhằm nhấn mạnh ý hướng phán xét.
  rationale: Nguyên văn duy trì sự căng thẳng giữa sự phán xét của Đức Chúa Trời và trách nhiệm của con người. Chính văn không giải quyết dứt khoát vấn đề này, còn chú thích bảo tồn cách hiểu có sắc thái mục đích mạnh hơn.
- issue: Ý nghĩa của ἐπιστρέψωσιν
  choice: quay trở lại
  alternative: quay lại; trở về; ăn năn
  rationale: “Quay trở lại” bảo tồn hình ảnh hoán cải theo hướng quay về mà không áp đặt một thuật ngữ giáo phái hoặc thu hẹp trường nghĩa của động từ.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ phép song song “lấy mắt… lấy tai… lấy lòng” của nguyên văn và tránh các thuật ngữ giáo phái.
