revisions:
- from: Vì lòng dân này đã trở nên chai lì,[a] tai họ nghe mà khó tiếp nhận, và mắt họ nhắm lại; nếu không, họ có thể lấy mắt mà thấy, lấy tai mà nghe, lấy lòng mà hiểu, rồi quay trở lại,[b] và Ta sẽ chữa lành họ.
  to: Vì lòng dân này đã trở nên chai lì,[a] tai họ nghe một cách nặng nề, và họ đã nhắm mắt lại; nếu không, họ có thể thấy bằng mắt, nghe bằng tai, hiểu bằng lòng, rồi quay trở lại,[b] và Ta sẽ chữa lành họ.
  rationale: Sửa tối thiểu để loại bỏ diễn giải không cần thiết ở cụm nói về việc nghe, phục hồi hành động chủ động “họ đã nhắm mắt lại,” và làm rõ neo chú thích về μήποτε. Cách dịch vẫn giữ sự căng thẳng của lời trích Ê-sai, không áp đặt cách giải thích về ý định thần thượng hoặc thu hẹp ἐπιστρέψωσιν thành một thuật ngữ giáo phái.
