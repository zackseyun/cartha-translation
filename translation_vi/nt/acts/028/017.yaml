source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς συγκαλέσασθαι ⸀αὐτὸν τοὺς ὄντας τῶν Ἰουδαίων πρώτους· συνελθόντων δὲ αὐτῶν ἔλεγεν πρὸς αὐτούς· ⸂Ἐγώ, ἄνδρες ἀδελφοί⸃, οὐδὲν ἐναντίον ποιήσας τῷ λαῷ ἢ τοῖς ἔθεσι τοῖς πατρῴοις δέσμιος ἐξ Ἱεροσολύμων παρεδόθην εἰς τὰς χεῖρας τῶν Ῥωμαίων,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/017.yaml
  text: It happened that after three days he called together the leading men of the Jews[a]. And when they had come together, he said to them, “I, brothers, though I had done nothing against the people or the customs of our fathers[d][c][b], was delivered as a prisoner from Jerusalem into the hands of the Romans.”
translation:
  language: vi
  text: 'Ba ngày sau, Phao-lô triệu tập những người lãnh đạo Do Thái[a]. Khi họ đã tụ họp, ông nói với họ: “Thưa anh em[b], dù tôi không làm điều gì chống lại dân tộc hay các phong tục tổ tiên[c], tôi vẫn bị trao nộp từ Giê-ru-sa-lem vào tay người La Mã, trong thân phận tù nhân[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các nhà lãnh đạo của người Do Thái” hoặc “những người có địa vị hàng đầu giữa người Do Thái.”
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hy Lạp này dùng lời gọi “anh em.” Phao-lô đang nói với những người nam lãnh đạo Do Thái mà ông đã triệu tập.
    reason: cultural_note
  - marker: c
    text: Cũng có thể dịch là “các tập tục cha ông.”
    reason: lexical_alternative
  - marker: d
    text: 'Hoặc: “tôi, một tù nhân từ Giê-ru-sa-lem, đã bị trao nộp vào tay người La Mã.” Nguyên văn nói sát nghĩa là “bị trao vào tay người La Mã.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ μετὰ ἡμέρας τρεῖς
  choice: Ba ngày sau
  rationale: Diễn đạt tự nhiên mốc thời gian và chức năng chuyển tiếp trong lời kể; không thêm một từ chỉ thời gian tương đương với “bây giờ” vốn không có trong nguyên văn.
- source_word: συγκαλέσασθαι αὐτὸν
  choice: Phao-lô triệu tập
  rationale: Đổi cấu trúc nguyên mẫu sau ἐγένετο thành động từ hữu hạn tự nhiên trong tiếng Việt; nêu tên Phao-lô để chủ thể rõ ràng trong câu độc lập.
- source_word: τοὺς ὄντας τῶν Ἰουδαίων πρώτους
  choice: những người lãnh đạo Do Thái
  rationale: πρῶτοι chỉ địa vị nổi bật, không phải thứ tự thời gian; cách dịch này rõ nghĩa và tự nhiên.
- source_word: συνελθόντων δὲ αὐτῶν
  choice: Khi họ đã tụ họp
  rationale: Chuyển kết cấu sở hữu cách tuyệt đối thành mệnh đề thời gian tự nhiên.
- source_word: Ἐγώ, ἄνδρες ἀδελφοί
  choice: Thưa anh em
  rationale: Giữ sắc thái kính trọng và tình liên đới trong lời xưng hô với các nam lãnh đạo Do Thái; đại từ Ἐγώ được thể hiện ngay sau đó bằng “tôi”.
- source_word: οὐδὲν ἐναντίον ποιήσας
  choice: dù tôi không làm điều gì chống lại
  rationale: Hiểu phân từ theo nghĩa nhượng bộ, làm nổi bật sự tương phản giữa việc Phao-lô không phạm lỗi và việc ông vẫn bị giao cho nhà chức trách Rô-ma.
- source_word: τῷ λαῷ
  choice: dân tộc mình
  rationale: λαός trong ngữ cảnh chỉ dân Do Thái. “Mình” làm rõ quan hệ của Phao-lô với dân tộc ấy trong tiếng Việt mà không đổi đối tượng quy chiếu.
- source_word: τοῖς ἔθεσι τοῖς πατρῴοις
  choice: các phong tục tổ tiên
  rationale: Diễn đạt gọn và tự nhiên những phong tục được truyền lại từ các bậc tiền nhân.
- source_word: δέσμιος ἐξ Ἱεροσολύμων παρεδόθην
  choice: tôi vẫn bị giải từ Giê-ru-sa-lem và bị trao
  rationale: “Bị giải” truyền đạt tình trạng tù nhân trong δέσμιος và sự di chuyển khỏi Giê-ru-sa-lem; “bị trao” giữ nghĩa pháp lý, giam giữ của động từ bị động παρεδόθην.
- source_word: εἰς τὰς χεῖρας τῶν Ῥωμαίων
  choice: vào tay người La Mã
  rationale: Giữ hình ảnh thành ngữ của nguyên văn, chỉ việc bị đặt dưới quyền kiểm soát của người La Mã.
theological_decisions:
- issue: Cách dịch ἀδελφοί trong lời gọi trực tiếp
  choice: anh em
  alternative: anh chị em
  rationale: Những người được triệu tập là các nam lãnh đạo Do Thái; “anh em” giữ đúng hình thức giống đực và tình liên đới trong nguyên văn.
- issue: Sắc thái của phân từ οὐδὲν ἐναντίον ποιήσας
  choice: 'nhượng bộ: “dù tôi không làm điều gì chống lại”'
  alternative: 'hoàn cảnh đi kèm: “tôi không hề làm điều gì chống lại”'
  rationale: Mạch diễn ngôn nhấn mạnh nghịch lý Phao-lô không làm điều sai trái nhưng vẫn bị giao vào tay người La Mã; cách dịch nhượng bộ giữ nguyên sự căng thẳng này.
- issue: Đối tượng của τῷ λαῷ
  choice: dân tộc mình
  alternative: dân chúng
  rationale: Trong lời Phao-lô nói với các lãnh đạo Do Thái, từ này chỉ dân Do Thái. Cách dịch không biến nó thành một khẳng định thần học rộng hơn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “triệu tập,” “phong tục tổ tiên” và “bị trao vào tay” để giữ sắc thái công khai, pháp lý của lời kể; tránh lối văn cổ. Tên riêng được phiên âm theo dạng tiếng Việt thông dụng.
