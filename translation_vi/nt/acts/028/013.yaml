  text: ὅθεν ⸀περιελόντες κατηντήσαμεν εἰς Ῥήγιον. καὶ μετὰ μίαν ἡμέραν ἐπιγενομένου νότου δευτεραῖοι ἤλθομεν εἰς Ποτιόλους,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/013.yaml
  text: From there[a], after weighing anchor, we came to Rhegium. And after one day, when a south wind came up, on the second day we came to Puteoli,
translation:
  language: vi
  text: Từ đó, sau khi nhổ neo[a], chúng tôi đến Rê-ghi-um. Một ngày sau, khi gió nam nổi lên, chúng tôi đến Pu-tê-ô-li vào ngày thứ hai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “sau khi ra khơi”. Động từ Hy Lạp περιελόντες là thuật ngữ hàng hải, có thể nói cụ thể đến việc nhổ neo hoặc nói rộng hơn đến việc cho tàu rời bến.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: Từ đó
  rationale: Cách chuyển tiếp địa điểm tự nhiên trong tiếng Việt, giữ nguyên ý chỉ nơi chốn của nguyên ngữ.
- source_word: περιελόντες
  choice: sau khi nhổ neo
  rationale: Trong ngữ cảnh hàng hải, phân từ này chỉ việc tháo hoặc kéo lên vật giữ tàu để khởi hành; “nhổ neo” là cách diễn đạt rõ và tự nhiên. Nghĩa rộng hơn được ghi ở chú thích.
- source_word: κατηντήσαμεν
  choice: chúng tôi đến
  rationale: Diễn đạt tự nhiên việc tới một địa điểm trong mạch tường thuật hành trình.
- source_word: Ῥήγιον
  choice: Rê-ghi-um
  rationale: Phiên âm tên địa danh cổ sang tiếng Việt, giữ gần âm dạng Hy Lạp.
- source_word: μετὰ μίαν ἡμέραν
  choice: Một ngày sau
  rationale: Cách diễn đạt thời gian tự nhiên trong tiếng Việt, tương ứng trực tiếp với nguyên ngữ.
- source_word: ἐπιγενομένου νότου
  choice: khi gió nam nổi lên
  rationale: Thể hiện hoàn cảnh đi kèm của kết cấu sở hữu cách tuyệt đối và giữ tính sự kiện của động từ.
- source_word: δευτεραῖοι
  choice: đến ngày thứ hai
  rationale: Giữ rõ ý họ tới nơi vào ngày thứ hai, không đồng nhất một cách thiếu căn cứ với “ngày hôm sau”.
- source_word: ἤλθομεν
  choice: chúng tôi tới
  rationale: Động từ chuyển động thông dụng; “tới” tự nhiên khi đi với đích đến và tránh lặp “đến” quá gần.
- source_word: Ποτιόλους
  choice: Pu-tê-ô-li
  rationale: Phiên âm tên địa danh cổ Puteoli sang tiếng Việt.
