  text: συστρέψαντος δὲ τοῦ Παύλου φρυγάνων ⸀τι πλῆθος καὶ ἐπιθέντος ἐπὶ τὴν πυράν, ἔχιδνα ⸀ἀπὸ τῆς θέρμης ⸀ἐξελθοῦσα καθῆψε τῆς χειρὸς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/003.yaml
  text: But when Paul had gathered a bundle of sticks and put them on the fire[b][a], a viper came out because of the heat and fastened onto his hand.
translation:
  language: vi
  text: Phao-lô gom một mớ cành khô, đặt lên đống lửa; thì một con rắn lục bò ra vì sức nóng[a] và bám vào tay ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “bò ra từ sức nóng.” Giới từ Hy Lạp có thể được dịch sát như vậy, dù trong câu này rất có thể chỉ nguyên nhân: con rắn bò ra vì sức nóng của đống lửa.'
    reason: lexical_alternative
  - marker: b
    text: Hay “chộp lấy tay ông” hoặc “cắn vào tay ông.” Động từ Hy Lạp có nghĩa rộng hơn là “bám vào” hoặc “nắm lấy.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συστρέψαντος
  choice: gom
  rationale: Phân từ bất định trong kết cấu sở hữu cách tuyệt đối diễn tả hành động của Phao-lô xảy ra trước; trong ngữ cảnh kiếm chất đốt, từ này có nghĩa là gom lại.
- source_word: φρυγάνων τι πλῆθος
  choice: một bó cành khô
  rationale: φρύγανα chỉ cành cây nhỏ hoặc bụi cây khô dùng làm chất đốt; τι πλῆθος chỉ một lượng không xác định. “Một bó cành khô” tự nhiên và giữ được hình ảnh một mớ vật liệu đã gom.
- source_word: ἐπιθέντος ἐπὶ τὴν πυράν
  choice: đặt lên đống lửa
  rationale: Cách dịch này thể hiện rõ hành động đặt chất đốt lên πυρά, tức một đống lửa, bằng tiếng Việt hiện đại và trang trọng vừa phải.
- source_word: ἔχιδνα
  choice: một con rắn lục
  rationale: ἔχιδνα chỉ một loại rắn độc thuộc nhóm viper, không chỉ là rắn nói chung. “Rắn lục” là cách gọi thông dụng, cụ thể trong tiếng Việt.
- source_word: ἀπὸ τῆς θέρμης
  choice: vì hơi nóng
  rationale: 'ἀπό có nghĩa cơ bản là “từ”, nhưng ở đây có thể diễn tả nguyên nhân: sức nóng khiến con rắn bò ra. Bản dịch chính diễn đạt quan hệ nhân quả tự nhiên, còn nghĩa sát hơn được ghi chú.'
- source_word: ἐξελθοῦσα
  choice: bò ra
  rationale: Phân từ này có nghĩa là đi hoặc ra khỏi nơi nào đó; với con rắn, “bò ra” là cách diễn đạt tự nhiên mà không thêm hướng xuất phát không có trong câu.
- source_word: καθῆψε τῆς χειρὸς αὐτοῦ
  choice: bám chặt vào tay ông
  rationale: καθάπτω có nghĩa rộng là bám, níu hoặc nắm chặt. Cách dịch này giữ hình ảnh con rắn gắn vào tay Phao-lô mà không khẳng định quá mức rằng động từ tự nó có nghĩa là cắn.
