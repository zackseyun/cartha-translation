source:
  edition: SBLGNT
  text: οἵ ⸀τε βάρβαροι παρεῖχον οὐ τὴν τυχοῦσαν φιλανθρωπίαν ἡμῖν, ⸀ἅψαντες γὰρ πυρὰν προσελάβοντο πάντας ἡμᾶς διὰ τὸν ὑετὸν τὸν ἐφεστῶτα καὶ διὰ τὸ ψῦχος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/002.yaml
  text: And the local people showed us extraordinary kindness[b][a], for they lit a fire and welcomed all of us because of the rain that had set in and because of the cold.
translation:
  language: vi
  text: Người dân địa phương đã bày tỏ lòng nhân ái khác thường đối với chúng tôi[a]; vì mưa đang trút xuống và vì trời lạnh, họ đã nhóm một đống lửa và đón tiếp tất cả chúng tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn dùng từ Hy Lạp βάρβαροι, nghĩa đen là “những người không nói tiếng Hy Lạp”; ở đây từ này chỉ cư dân địa phương trên đảo, không nhất thiết hàm ý họ hoang dã.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάρβαροι
  choice: người dân địa phương
  rationale: Trong ngữ cảnh này, từ này chỉ những cư dân không nói tiếng Hy Lạp, chứ không nhất thiết mang nghĩa hoang dã hay kém văn minh. Cách dịch này tự nhiên và tránh sắc thái miệt thị của từ “man di” trong tiếng Việt hiện đại.
- source_word: οὐ τὴν τυχοῦσαν φιλανθρωπίαν
  choice: bằng lòng nhân ái khác thường
  rationale: Thành ngữ οὐ τὴν τυχοῦσαν có nghĩa là “không tầm thường” hay “khác thường”; φιλανθρωπία chỉ lòng nhân hậu đối với con người. Cách diễn đạt này giữ được lối nói nhấn mạnh của nguyên văn và vẫn tự nhiên.
- source_word: παρεῖχον
  choice: đã đối đãi với ... bằng
  rationale: Khi đi với φιλανθρωπίαν, động từ này diễn tả việc dành hoặc thể hiện lòng nhân ái; “đối đãi ... bằng lòng nhân ái” phù hợp với hành động tiếp đón trong ngữ cảnh.
- source_word: ἅψαντες
  choice: nhóm
  rationale: Phân từ này, khi đi với πυράν, có nghĩa là nhóm hoặc đốt lửa. “Nhóm” là cách nói tự nhiên trong tiếng Việt.
- source_word: πυρὰν
  choice: một đống lửa
  rationale: πυρά có thể chỉ một đống lửa được nhóm lên. “Một đống lửa” gợi đúng cảnh nhiều người tụ lại sưởi mà không hàm ý quá mức như “lửa trại”.
- source_word: προσελάβοντο
  choice: đón tiếp
  rationale: Dạng trung động ở đây diễn tả việc tiếp nhận người khác với lòng hiếu khách. “Đón tiếp” vừa tự nhiên vừa giữ rõ sắc thái tiếp đãi.
- source_word: πάντας ἡμᾶς
  choice: tất cả chúng tôi
  rationale: Giữ nguyên sự nhấn mạnh về việc không ai trong đoàn bị bỏ sót.
- source_word: διὰ τὸν ὑετὸν τὸν ἐφεστῶτα
  choice: vì trời đổ mưa
  rationale: Phân từ ἐφεστῶτα cho biết cơn mưa đã ập đến và đang hiện hữu. “Trời đổ mưa” truyền đạt tự nhiên sự xuất hiện và tiếp diễn của mưa trong tiếng Việt.
- source_word: διὰ τὸ ψῦχος
  choice: và lạnh
  rationale: ψῦχος chỉ cái lạnh hoặc thời tiết lạnh. Kết cấu “vì trời đổ mưa và lạnh” tự nhiên, gọn rõ, đồng thời áp dụng nguyên nhân cho cả hai tình trạng.
- source_word: οἵ τε
  choice: Người
  rationale: Tiểu từ τε nối câu này với mạch kể trước đó. Trong tiếng Việt, sự tiếp nối đã rõ từ văn cảnh nên không cần thêm một liên từ nặng nề.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Tránh từ “thổ dân” vì có thể mang sắc thái thuộc địa hoặc miệt thị; tránh “man di” vì gây ấn tượng tiêu cực không tất yếu có trong ngữ cảnh. Trật tự nguyên văn được điều chỉnh nhẹ ở câu thứ hai để câu tiếng Việt tự nhiên và làm rõ mưa lạnh là lý do họ nhóm lửa, đón tiếp cả đoàn.
