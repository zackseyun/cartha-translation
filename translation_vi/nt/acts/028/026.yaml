  naturalness: Cần chỉnh cụm “đi đến với” thành “đến với.” Phần còn lại có nhịp văn trang trọng, hiện đại và phù hợp với lời trích ngôn sứ. Đại từ “các ngươi” nhất quán với lối xưng hô trực tiếp, trang trọng.
