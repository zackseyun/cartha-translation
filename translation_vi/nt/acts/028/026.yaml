  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀λέγων· Πορεύθητι πρὸς τὸν λαὸν τοῦτον καὶ εἰπόν· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/026.yaml
  text: 'saying[a], ‘Go to this people and say: You will indeed hear, but you will never understand; and seeing, you will indeed see[b], but you will never perceive.’'
translation:
  language: vi
  text: 'nói rằng: “Hãy đến với dân này và nói:


    ‘Các ngươi sẽ nghe, nghe mãi[a], nhưng nhất định không hiểu;


    các ngươi sẽ nhìn, nhìn mãi, nhưng nhất định không thấy[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa: “Bằng sự nghe, các ngươi sẽ nghe.” Đây là lối nhấn mạnh mang âm hưởng Hê-bơ-rơ được giữ lại trong bản Hy Lạp trích sách Ê-sai.'
    reason: lexical_alternative
  - marker: b
    text: “Thấy” ở đây cũng có thể được hiểu là “nhận ra” hoặc “lĩnh hội”; nguyên bản Hy Lạp cố ý lặp lại các từ chỉ sự nhìn thấy.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: nói rằng
  rationale: Giữ sắc thái của phân từ hiện tại dùng để dẫn vào lời trích dẫn và nối với mệnh đề trước.
- source_word: Πορεύθητι πρὸς τὸν λαὸν τοῦτον
  choice: Hãy đi đến với dân này
  rationale: Diễn đạt tự nhiên mệnh lệnh chỉ sự di chuyển; “dân này” giữ tính tập thể và âm hưởng ngôn sứ của λαός.
- source_word: καὶ εἰπόν
  choice: và nói
  rationale: Giữ mệnh lệnh trực tiếp và cấu trúc dẫn lời của nguyên bản.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Các ngươi sẽ nghe, nghe mãi
  rationale: Tái hiện phép lặp từ cùng gốc mang âm hưởng Hê-bơ-rơ, đồng thời diễn đạt hành động nghe kéo dài mà không đạt đến sự hiểu biết.
- source_word: οὐ μὴ συνῆτε
  choice: nhưng nhất định không hiểu
  rationale: “Nhất định không” truyền đạt sức mạnh của phủ định οὐ μή; “hiểu” là nghĩa trực tiếp của συνίημι trong thế đối lập với việc chỉ nghe bằng giác quan.
- source_word: βλέποντες βλέψετε
  choice: các ngươi sẽ nhìn, nhìn mãi
  rationale: Giữ phép lặp về thị giác và sự song hành với “nghe, nghe mãi”, bằng một cách nói tự nhiên trong tiếng Việt.
- source_word: οὐ μὴ ἴδητε
  choice: nhưng nhất định không thấy
  rationale: Giữ nhất quán trường từ vựng thị giác của nguyên bản và không âm thầm giải nghĩa “thấy” thành sự nhận thức nội tâm.
theological_decisions:
- issue: Các động từ cảm giác trong lời trích Ê-sai vừa nói đến nghe/nhìn vừa hàm ý không lĩnh hội được.
  choice: Giữ “không hiểu” cho συνίημι và “không thấy” cho ἴδητε trong chính văn.
  alternative: Dịch vế cuối là “không nhận biết/không nhận ra” để nêu rõ sự lĩnh hội nội tâm.
  rationale: Cách chọn này bảo toàn sự lặp lại có chủ ý của ngôn ngữ thị giác và sự căng thẳng giữa tiếp nhận bằng giác quan với nhận thức bên trong; chú thích nêu nghĩa theo văn cảnh mà không thay thế nét đa nghĩa của chính văn.
translation_notes:
  register: Văn phong trang trọng, hiện đại, mang âm hưởng lời ngôn sứ. Đại từ “các ngươi” được dùng trong lời trích dẫn tập thể để giữ sắc thái trực tiếp và nghiêm trang; nhịp “nghe, nghe mãi / nhìn, nhìn mãi” bảo toàn phép song hành mà vẫn dễ hiểu đối với độc giả Việt Nam hiện nay.
