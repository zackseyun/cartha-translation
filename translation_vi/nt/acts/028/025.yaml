  text: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους ἀπελύοντο, εἰπόντος τοῦ Παύλου ῥῆμα ἓν ὅτι Καλῶς τὸ πνεῦμα τὸ ἅγιον ἐλάλησεν διὰ Ἠσαΐου τοῦ προφήτου πρὸς τοὺς πατέρας ⸀ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/025.yaml
  text: 'And since they were disagreeing with one another, they were leaving after Paul had said one final word: “The Holy Spirit spoke rightly through Isaiah the prophet to your fathers'
translation:
  language: vi
  text: 'Họ bất đồng với nhau nên ra về, sau khi Phao-lô nói một lời cuối cùng[a]: “Đức Thánh Linh đã phán thật đúng qua nhà tiên tri Ê-sai với tổ phụ các ông[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một lời” hoặc “một câu.” Tiếng Hy Lạp nói sát nghĩa là “một lời”; ở đây đó là lời kết luận.
    reason: lexical_alternative
  - marker: b
    text: Hay “với tổ tiên các ông.” Tiếng Hy Lạp nói “với các tổ phụ của các ông,” chỉ các bậc cha ông của Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσύμφωνοι δὲ ὄντες πρὸς ἀλλήλους
  choice: Vì họ bất đồng với nhau
  rationale: Diễn đạt tự nhiên trạng thái không đồng thuận lẫn nhau; liên từ “vì… nên” làm rõ quan hệ hoàn cảnh/dẫn đến việc ra về mà phân từ Hy Lạp cho phép trong ngữ cảnh.
- source_word: ἀπελύοντο
  choice: họ ra về
  rationale: Thì chưa hoàn thành mô tả nhóm người đang giải tán và rời đi; “ra về” tự nhiên trong tiếng Việt và phù hợp với bối cảnh họ rời chỗ Phao-lô.
- source_word: εἰπόντος τοῦ Παύλου
  choice: sau khi Phao-lô nói
  rationale: Cấu trúc sở hữu cách tuyệt đối được chuyển thành mệnh đề thời gian tự nhiên, giữ đúng động từ εἶπον là “nói”.
- source_word: ῥῆμα ἓν
  choice: lời cuối cùng này
  rationale: Nghĩa đen là “một lời”; trong diễn ngôn, đây là lời kết trước khi họ đi. “Lời cuối cùng này” truyền đạt chức năng ấy, với chú thích bảo lưu nghĩa sát chữ.
- source_word: Καλῶς
  choice: thật đúng
  rationale: Ở đây trạng từ đánh giá lời phán là đúng/đích đáng; “thật đúng” vừa tự nhiên vừa giữ sắc thái xác nhận mạnh.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Cách gọi trang trọng, phổ thông trong tiếng Việt dành cho Chúa Thánh Linh, phù hợp với chủ thể có hành động phán.
- source_word: ἐλάλησεν
  choice: đã phán
  rationale: “Phán” phù hợp với lời nói của Đức Thánh Linh trong văn cảnh mặc khải tiên tri và giữ văn phong trang nghiêm.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: qua nhà tiên tri Ê-sai
  rationale: διά với sở hữu cách biểu thị trung gian; “qua” giữ rõ Đức Thánh Linh là nguồn phán và Ê-sai là người truyền đạt.
- source_word: πρὸς τοὺς πατέρας ὑμῶν
  choice: với tổ phụ các ông
  rationale: “Tổ phụ” là cách diễn đạt gọn, trang trọng cho các bậc cha ông của Israel; “các ông” giữ ngôi thứ hai số nhiều hướng đến những người nghe.
theological_decisions:
- issue: Chủ thể và trung gian của lời tiên tri
  choice: Đức Thánh Linh đã phán… qua nhà tiên tri Ê-sai
  alternative: Đức Thánh Linh đã nói… bởi nhà tiên tri Ê-sai
  rationale: Giữ nguyên sự quy thuộc lời tiên tri cho Đức Thánh Linh, đồng thời biểu thị Ê-sai là trung gian, không giải thích thêm bản tính hay cơ chế linh hứng.
- issue: Đối tượng “các tổ phụ của các ông”
  choice: tổ phụ các ông
  alternative: tổ tiên các ông
  rationale: “Tổ phụ” bảo lưu hình ảnh nam tính của πατέρες và chỉ các bậc cha ông Israel, còn “tổ tiên” là cách hiểu rộng hơn nhưng trung tính giới.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phao-lô,” “Ê-sai,” “Đức Thánh Linh” theo lối gọi Kinh Thánh quen thuộc; giữ dấu mở ngoặc kép vì lời trích dẫn tiếp tục sang câu sau.
