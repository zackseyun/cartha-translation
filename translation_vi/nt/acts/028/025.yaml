    rationale: “Một lời cuối cùng” vẫn biểu đạt chức năng kết lời trong ngữ cảnh mà không thêm chỉ thị từ.
  - severity: medium
    issue: Từ “rằng” được thêm vào cuối câu, trước dấu hai chấm.
    rationale: Phần SBLGNT được cung cấp kết thúc ở “các tổ phụ các ông”; nội dung lời trích dẫn tiếp tục ở câu kế. Bỏ “rằng” giữ sát ranh giới văn bản hơn và vẫn để lời nói trực tiếp tiếp diễn tự nhiên.
