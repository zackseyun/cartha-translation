    issue: “Vì họ bất đồng với nhau, nên...” diễn giải phân từ như nguyên nhân rõ rệt.
    rationale: ἀσύμφωνοι ... ὄντες chủ yếu mô tả tình trạng bất đồng đi kèm việc ra về. Cách viết không dùng cặp “vì... nên” tránh thêm một quan hệ nhân quả quá rõ.
  - severity: low
