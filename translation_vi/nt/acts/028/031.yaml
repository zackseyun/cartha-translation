id: ACT.28.31
reference: Acts 28:31
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: κηρύσσων τὴν βασιλείαν τοῦ θεοῦ καὶ διδάσκων τὰ περὶ τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ πάσης παρρησίας ἀκωλύτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/031.yaml
  text: proclaiming the kingdom of God and teaching the things concerning the Lord Jesus the Messiah with all boldness[a], unhindered.
translation:
  language: vi
  text: rao giảng vương quốc của Đức Chúa Trời và dạy những điều liên quan đến Chúa Giê-su, Đấng Mê-si[a], một cách hết sức dạn dĩ, không bị ngăn trở.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Chúa Giê-su Christ.” Từ Hy Lạp Χριστός có thể được dùng như một danh hiệu (“Đấng Mê-si”) hoặc, trong một số văn cảnh, gần như một phần của tên gọi (“Christ”).'
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσων
  choice: rao giảng
  rationale: Diễn đạt hành động công bố công khai và liên tục của Phao-lô; tự nhiên trong văn cảnh Tân Ước mà không giới hạn vào một bài giảng chính thức.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc của Đức Chúa Trời
  rationale: Giữ hình ảnh βασιλεία và cách nói quen thuộc, đồng thời vẫn có thể bao hàm ý nghĩa quyền trị vì của Đức Chúa Trời.
- source_word: διδάσκων
  choice: dạy
  rationale: Phản ánh trực tiếp động tác thứ hai, song song với việc rao giảng.
- source_word: τὰ περὶ
  choice: những điều liên quan đến
  rationale: Giữ được độ đầy đủ của cấu trúc Hy Lạp nhưng vẫn rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: Dùng danh hiệu Kitô học quen thuộc cho κύριος trong văn cảnh này.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Giê-su, Đấng Mê-si
  rationale: Chuyển nghĩa Χριστός như một danh hiệu và dùng dấu phẩy để tiếng Việt thể hiện tự nhiên rằng Giê-su chính là Đấng Mê-si; cách đọc quen thuộc 'Giê-su Christ' được ghi chú.
- source_word: μετὰ πάσης παρρησίας
  choice: với tất cả sự dạn dĩ
  rationale: Bảo toàn πάσης như yếu tố nhấn mạnh và παρρησία như sự mạnh dạn, công khai trong lời nói.
- source_word: ἀκωλύτως
  choice: không bị ngăn trở
  rationale: Giữ vị trí kết câu đầy nhấn mạnh và ý nghĩa rằng công việc công bố không bị cản ngăn.
theological_decisions:
- issue: Cách dịch Χριστός trong cụm danh hiệu Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Christ
  rationale: Trong chuỗi có danh hiệu 'Chúa', Χριστός vẫn có thể mang lực nghĩa danh hiệu. Bản dịch chính làm rõ nghĩa ấy nhưng chú thích bảo lưu cách dùng như tên gọi quen thuộc.
translation_notes:
  register: Văn phong trang trọng vừa phải, hiện đại và dễ hiểu. Hai phân từ hiện tại được trình bày như hai hoạt động song song; trạng từ kết thúc câu được giữ ở cuối để bảo toàn điểm nhấn của nguyên bản.
