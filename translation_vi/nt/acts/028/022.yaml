id: ACT.28.22
reference: Acts 28:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀξιοῦμεν δὲ παρὰ σοῦ ἀκοῦσαι ἃ φρονεῖς, περὶ μὲν γὰρ τῆς αἱρέσεως ταύτης γνωστὸν ⸂ἡμῖν ἐστιν⸃ ὅτι πανταχοῦ ἀντιλέγεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/022.yaml
  text: But we consider it proper to hear from you what you think[a], for concerning this sect it is known to us that it is spoken against everywhere.
translation:
  language: vi
  text: Nhưng chúng tôi thấy nên nghe chính ông trình bày quan điểm của mình, vì về nhóm này[a], chúng tôi biết rằng ở đâu người ta cũng lên tiếng chống lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “giáo phái”, “phe phái” hoặc “phong trào”; từ Hy Lạp ở đây không nhất thiết có nghĩa “tà giáo” theo nghĩa kỹ thuật xuất hiện về sau.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιοῦμεν
  choice: chúng tôi thấy nên
  rationale: Diễn đạt sự đánh giá điều gì là thích hợp, giữ giọng lịch sự mà không mang sắc thái đòi hỏi.
- source_word: παρὰ σοῦ ἀκοῦσαι
  choice: nghe chính ông trình bày
  rationale: Giữ sắc thái muốn nghe trực tiếp từ Phao-lô; thêm “trình bày” giúp câu tiếng Việt tự nhiên trong ngữ cảnh hỏi quan điểm.
- source_word: ἃ φρονεῖς
  choice: quan điểm của mình
  rationale: φρονέω ở đây chỉ điều một người suy nghĩ hay chủ trương; “quan điểm” rõ ràng và phù hợp văn cảnh.
- source_word: αἱρέσεως
  choice: nhóm
  rationale: Chỉ một nhóm hay phong trào tôn giáo, không nhất thiết mang nghĩa kỹ thuật về tà giáo xuất hiện về sau.
- source_word: γνωστὸν ἡμῖν ἐστιν
  choice: chúng tôi biết
  rationale: Chuyển cấu trúc vô nhân xưng Hy Lạp sang cách nói tiếng Việt tự nhiên mà vẫn bảo toàn nội dung.
- source_word: πανταχοῦ
  choice: ở đâu ... cũng
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho ý nghĩa bao quát “khắp mọi nơi”.
- source_word: ἀντιλέγεται
  choice: người ta ... lên tiếng chống lại
  rationale: Giữ sắc thái phát ngôn chống đối của động từ bị động, thay vì chỉ diễn đạt sự phản đối một cách trừu tượng.
theological_decisions:
- issue: Cách dịch αἵρεσις
  choice: nhóm
  alternative: giáo phái; phe phái; phong trào; tà giáo
  rationale: Trong câu này, từ ấy nói về phong trào Cơ Đốc dưới cách nhìn của người ngoài, chưa nhất thiết chỉ một sai lệch giáo lý theo nghĩa kỹ thuật về sau. “Nhóm” trung tính hơn; chú thích giữ các khả năng từ vựng khác.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” phù hợp với lời các lãnh đạo Do Thái nói trực tiếp với Phao-lô; cấu trúc câu giữ giọng lịch sự, chính thức.
