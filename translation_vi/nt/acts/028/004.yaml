id: ACT.28.4
reference: Acts 28:4
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ εἶδον οἱ βάρβαροι κρεμάμενον τὸ θηρίον ἐκ τῆς χειρὸς αὐτοῦ, ⸂πρὸς ἀλλήλους ἔλεγον⸃· Πάντως φονεύς ἐστιν ὁ ἄνθρωπος οὗτος ὃν διασωθέντα ἐκ τῆς θαλάσσης ἡ δίκη ζῆν οὐκ εἴασεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/004.yaml
  text: When the islanders saw the creature hanging from his hand[a], they said to one another, “Surely this man is a murderer, whom Justice has not allowed to live[d][c][b], though he was brought safely from the sea.”
translation:
  language: vi
  text: 'Khi dân bản xứ[a] thấy con vật đang treo ở tay ông, họ nói với nhau: “Chắc chắn người này là một kẻ sát nhân. Tuy đã thoát nạn trên biển, nhưng Công Lý[b] vẫn không cho hắn sống.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “người địa phương”; sát chữ là “những người man di”, một cách gọi thời ấy dành cho những người không nói tiếng Hy Lạp, chứ không hàm ý họ man rợ.
    reason: lexical_alternative
  - marker: b
    text: “Công Lý” dịch từ tiếng Hy Lạp dikē, ở đây có lẽ được nhân cách hóa như quyền lực trừng phạt kẻ làm ác trong quan niệm ngoại giáo của dân bản xứ; cũng có thể hiểu là sự báo ứng.
    reason: cultural_note
lexical_decisions:
- source_word: βάρβαροι
  choice: dân bản xứ
  rationale: Chỉ cư dân địa phương không nói tiếng Hy Lạp, không hàm ý họ man rợ; cách dịch này tự nhiên trong tiếng Việt và giữ được sắc thái địa phương.
- source_word: κρεμάμενον
  choice: đang treo lủng lẳng
  rationale: Diễn tả rõ hình ảnh con vật còn treo từ tay Phao-lô mà không xác định quá mức tư thế của nó.
- source_word: τὸ θηρίον
  choice: con vật
  rationale: Danh từ Hy Lạp mang nghĩa khái quát; dù ngữ cảnh cho biết đó là rắn độc, câu này không dùng từ cụ thể nghĩa là rắn.
- source_word: πρὸς ἀλλήλους ἔλεγον
  choice: họ nói với nhau
  rationale: Chuyển đạt trực tiếp và tự nhiên; thì chưa hoàn thành có thể hàm ý lời nói đang tiếp diễn, nhưng không nhất thiết phải biểu đạt riêng trong tiếng Việt.
- source_word: Πάντως
  choice: Chắc chắn
  rationale: Thể hiện kết luận đầy xác tín của dân bản xứ dựa trên điều họ vừa thấy.
- source_word: φονεύς
  choice: một kẻ giết người
  rationale: Tương đương rõ ràng với danh từ chỉ người phạm tội sát nhân, đồng thời hợp với giọng phán đoán trực tiếp.
- source_word: διασωθέντα ἐκ τῆς θαλάσσης
  choice: đã thoát nạn từ biển
  rationale: Diễn đạt việc sống sót qua tai nạn ngoài biển một cách tự nhiên, tránh sắc thái cứu rỗi thần học không có chủ ý ở đây.
- source_word: ἡ δίκη
  choice: Công Lý
  rationale: Viết hoa để giữ phép nhân cách hóa quyền lực báo ứng trong quan niệm của dân đảo, nhưng không xác quyết đó là tên riêng của một nữ thần.
- source_word: ζῆν οὐκ εἴασεν
  choice: vẫn không cho hắn sống
  rationale: Giữ nguyên ý không được phép tiếp tục sống; từ “vẫn” làm rõ sự tương phản sau khi đã thoát biển, còn “hắn” phản ánh thái độ kết tội của người nói.
theological_decisions:
- issue: Sự nhân cách hóa δίκη
  choice: Dịch là “Công Lý” và viết hoa
  alternative: “công lý”, “sự báo ứng” hoặc “nữ thần Công Lý”
  rationale: Cách này giữ sự nhân cách hóa và thế giới quan báo ứng của những người đang nói, nhưng không biến lời thuật thành sự tán thành của tác giả hay xác định quá mức một vị thần cụ thể.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc “Tuy... nhưng...” tái hiện rõ sự nhượng bộ của phân từ Hy Lạp và mạch suy luận của dân bản xứ. Dùng “ông” trong lời kể nhưng “hắn” trong lời thoại để thể hiện thái độ kết tội của họ mà không gán thái độ ấy cho người kể.
