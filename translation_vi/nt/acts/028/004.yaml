revisions:
- from: 'Khi dân bản xứ[a] thấy con vật đang treo lủng lẳng trên tay ông, họ nói với nhau: “Chắc chắn người này là một kẻ giết người. Tuy đã thoát nạn từ biển, nhưng Công Lý[b] vẫn không cho hắn sống.”'
  to: 'Khi dân bản xứ[a] thấy con vật đang treo ở tay ông, họ nói với nhau: “Chắc chắn người này là một kẻ sát nhân. Tuy đã thoát nạn trên biển, nhưng Công Lý[b] vẫn không cho hắn sống.”'
  rationale: Các sửa đổi giới hạn ở việc tránh diễn giải quá mức hình ảnh “treo”, dùng thuật ngữ chính xác hơn cho φονεύς, và làm tự nhiên thành ngữ chỉ việc sống sót qua biển. Giữ nguyên mạch suy luận và giọng kết tội của người dân qua “vẫn” và “hắn”; không hàm ý tác giả tán thành quan niệm về Công Lý.
