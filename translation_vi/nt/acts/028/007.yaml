revisions:
- from: Trong vùng quanh nơi ấy có những khu đất[a] thuộc về người đứng đầu đảo[b], tên là Púp-li-u. Ông đón tiếp chúng tôi và ân cần cho chúng tôi ở lại làm khách trong ba ngày.[c]
  to: Trong vùng quanh nơi ấy có những khu đất[a] thuộc về người đứng đầu trên đảo[b], tên là Púp-li-út. Ông đón tiếp chúng tôi và ân cần tiếp đãi chúng tôi trong ba ngày.[c]
  rationale: Chỉnh tên riêng thành “Púp-li-út” và thay cách diễn đạt về lòng hiếu khách để phản ánh đầy đủ ἐξένισεν. Điều chỉnh nhẹ danh xưng thành “người đứng đầu trên đảo” để tiếng Việt tự nhiên hơn, đồng thời không quy định quá mức bản chất chức vụ của Πρῶτος.
  reviewer_model: gpt-5.6-terra
