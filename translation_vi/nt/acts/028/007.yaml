source:
  edition: SBLGNT
  text: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον ὑπῆρχεν χωρία τῷ πρώτῳ τῆς νήσου ὀνόματι Ποπλίῳ, ὃς ἀναδεξάμενος ἡμᾶς ⸂τρεῖς ἡμέρας⸃ φιλοφρόνως ἐξένισεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/007.yaml
  text: In the area around that place there were lands belonging to the chief man of the island[a], named Publius[c][b], who welcomed us and hosted us courteously for three days.
translation:
  language: vi
  text: Trong vùng quanh nơi ấy có những khu đất[a] thuộc về người đứng đầu trên đảo[b], tên là Púp-li-út. Ông đón tiếp chúng tôi và ân cần tiếp đãi chúng tôi trong ba ngày.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những điền trang”; từ Hy Lạp χωρία chỉ đất đai hoặc bất động sản trong vùng lân cận.
    reason: lexical_alternative
  - marker: b
    text: Cụm từ Hy Lạp cũng có thể dịch là “người có địa vị cao nhất trên đảo”; có lẽ đây là danh xưng dành cho người lãnh đạo hoặc người có cấp bậc cao nhất trên đảo.
    reason: alternative_reading
  - marker: c
    text: 'Cũng có thể dịch là: “Ông tiếp nhận chúng tôi và tử tế khoản đãi chúng tôi trong ba ngày.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τοῖς περὶ τὸν τόπον ἐκεῖνον
  choice: Trong vùng quanh nơi ấy
  rationale: Diễn đạt tự nhiên ý chỉ khu vực lân cận; δέ là từ nối nhẹ trong mạch kể nên không cần chuyển thành một trạng từ thời gian.
- source_word: χωρία
  choice: những khu đất
  rationale: Giữ số nhiều và ý nghĩa rộng về bất động sản hoặc đất đai, không xác định quá mức đó là ruộng, trang trại hay điền trang.
- source_word: τῷ πρώτῳ τῆς νήσου
  choice: người đứng đầu đảo
  rationale: πρῶτος ở đây chỉ địa vị nổi bật hoặc tước vị; cách dịch này tự nhiên và không áp đặt một chức danh hành chính cụ thể.
- source_word: ὀνόματι Ποπλίῳ
  choice: tên là Púp-li-u
  rationale: Cấu trúc cách cho với ὀνόματι dùng để giới thiệu tên; tên được phiên âm theo cách đọc dễ hiểu trong tiếng Việt.
- source_word: ἀναδεξάμενος ἡμᾶς
  choice: đón tiếp chúng tôi
  rationale: Diễn tả việc tiếp nhận và chào đón khách trong bối cảnh hiếu khách.
- source_word: φιλοφρόνως ἐξένισεν
  choice: ân cần cho chúng tôi ở lại làm khách
  rationale: Kết hợp sắc thái tử tế, thân thiện của φιλοφρόνως với nghĩa tiếp đãi hoặc cho khách lưu trú của ξενίζω.
- source_word: τρεῖς ἡμέρας
  choice: trong ba ngày
  rationale: Đây là đối cách chỉ khoảng thời gian kéo dài.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Câu được tách làm hai để tránh mệnh đề quan hệ dài, nhưng vẫn giữ rõ quan hệ giữa Púp-li-u với hành động tiếp đón. Không xác định quá mức chức vụ của ông.
