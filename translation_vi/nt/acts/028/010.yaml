  text: οἳ καὶ πολλαῖς τιμαῖς ἐτίμησαν ἡμᾶς καὶ ἀναγομένοις ἐπέθεντο τὰ πρὸς ⸂τὰς χρείας⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/010.yaml
  text: They also honored us greatly[a], and when we were setting sail[c][b], they put on board what we needed.
translation:
  language: vi
  text: Họ cũng hết sức tôn trọng chúng tôi[a]; và khi chúng tôi ra khơi[b], họ đặt lên tàu những thứ chúng tôi cần[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sát nghĩa hơn: “họ đã tôn trọng chúng tôi bằng nhiều sự tôn trọng.” Cấu trúc Hy Lạp lặp từ “tôn trọng” để nhấn mạnh rằng họ dành cho chúng tôi nhiều biểu hiện tôn trọng.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “khi chúng tôi bắt đầu đi đường biển.” Động từ Hy Lạp là thuật ngữ hàng hải chỉ việc bắt đầu một chuyến đi bằng tàu.'
    reason: lexical_alternative
  - marker: c
    text: 'Cũng có thể dịch: “họ cung cấp những thứ chúng tôi cần.” Nguyên văn nói họ “đặt lên những thứ dành cho các nhu cầu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλαῖς τιμαῖς ἐτίμησαν
  choice: tỏ lòng quý trọng chúng tôi bằng nhiều cách
  rationale: Cách dịch tự nhiên trong tiếng Việt diễn đạt cả danh từ τιμαῖς và động từ ἐτίμησαν, cho thấy dân đảo dành cho họ nhiều biểu hiện trân trọng, đồng thời tránh lối lặp gượng “tôn trọng bằng nhiều sự tôn trọng”.
- source_word: ἀναγομένοις
  choice: khi chúng tôi sắp ra khơi
  rationale: Trong ngữ cảnh hàng hải, ἀνάγω chỉ việc đưa tàu ra biển để bắt đầu hành trình; “ra khơi” là cách nói hiện đại, rõ nghĩa.
- source_word: ἐπέθεντο
  choice: họ chất lên tàu
  rationale: Động từ diễn tả việc đặt các vật dụng lên phương tiện; con tàu được hàm ý bởi ngữ cảnh hàng hải. “Chất lên tàu” giữ được hành động cụ thể thay vì chỉ khái quát là “cung cấp”.
- source_word: τὰ πρὸς τὰς χρείας
  choice: những thứ chúng tôi cần
  rationale: Cụm này chỉ các vật dụng đáp ứng nhu cầu. Cách dịch giữ nét cụ thể của dạng số nhiều mà vẫn tự nhiên, không lặp từ “cần/nhu cầu”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Tỏ lòng quý trọng” thể hiện các hành động tôn kính cụ thể; “ra khơi” và “chất lên tàu” duy trì rõ bối cảnh hàng hải. Các chú thích bảo lưu sắc thái lặp từ và cấu trúc cụ thể của nguyên văn Hy Lạp.
