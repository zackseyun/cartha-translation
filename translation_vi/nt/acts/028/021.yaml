id: ACT.28.21
reference: Acts 28:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ πρὸς αὐτὸν εἶπαν· Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας, οὔτε παραγενόμενός τις τῶν ἀδελφῶν ἀπήγγειλεν ἢ ἐλάλησέν τι περὶ σοῦ πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/021.yaml
  text: But they said to him[a], “We have received no letters from Judea about you[b], nor has any of the brothers who came reported or spoken anything evil about you.”
translation:
  language: vi
  text: 'Nhưng họ nói với ông: “Chúng tôi không nhận được thư nào từ Giu-đê nói về ông; cũng không có ai trong số anh em[a] đã đến mà báo lại hoặc nói điều gì xấu về ông.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anh em” ở đây có thể chỉ những người Do Thái đồng bào từ Giu-đê; nguyên văn không nói rõ họ là các tín hữu Cơ Đốc.
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “điều gì bất lợi về ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ πρὸς αὐτὸν εἶπαν
  choice: Nhưng họ nói với ông
  rationale: “Nhưng” thể hiện sắc thái chuyển tiếp và đối đáp nhẹ của δέ; “nói với ông” là cách diễn đạt tự nhiên của πρὸς αὐτὸν sau động từ nói.
- source_word: Ἡμεῖς οὔτε γράμματα περὶ σοῦ ἐδεξάμεθα ἀπὸ τῆς Ἰουδαίας
  choice: Chúng tôi không nhận được thư nào từ Giu-đê nói về ông
  rationale: Giữ đại từ nhấn mạnh Ἡμεῖς và hiểu γράμματα theo ngữ cảnh là thư từ; “nói về ông” diễn đạt tự nhiên nội dung liên quan đến Phao-lô.
- source_word: οὔτε ... οὔτε
  choice: không ... cũng không
  rationale: Bảo toàn cấu trúc phủ định tương liên bằng lối diễn đạt tự nhiên trong tiếng Việt.
- source_word: παραγενόμενός τις τῶν ἀδελφῶν
  choice: ai trong số anh em đã đến
  rationale: Diễn đạt τις và phân từ παραγενόμενος mà không thêm địa điểm “đến đây”, vốn chỉ được hàm ý chứ không có trong nguyên văn.
- source_word: ἀπήγγειλεν ἢ ἐλάλησέν τι
  choice: báo lại hoặc nói điều gì
  rationale: Giữ sự phân biệt nhẹ giữa việc đem tin báo lại và việc nói ra một điều.
- source_word: περὶ σοῦ πονηρόν
  choice: điều gì xấu về ông
  rationale: πονηρόν ở đây chỉ nội dung bất lợi hoặc xấu liên quan đến Phao-lô; cách dịch giữ phạm vi nghĩa rộng, không biến nó thành một lời buộc tội chính thức.
theological_decisions:
- issue: τῶν ἀδελφῶν chỉ ai
  choice: Dịch là “anh em”, không xác định họ là tín hữu Cơ Đốc.
  alternative: “đồng bào Do Thái” hoặc “anh em cùng đức tin”
  rationale: Trong ngữ cảnh, những người nói là các lãnh đạo Do Thái tại Rô-ma và có thể gọi người Do Thái từ Giu-đê là “anh em”. Tuy nhiên, nguyên văn không xác định dứt khoát, nên bản dịch giữ cách gọi rộng và bảo toàn sự mơ hồ.
- issue: Sắc thái của πονηρόν
  choice: “điều gì xấu”
  alternative: “điều gì bất lợi” hoặc “lời cáo buộc nào”
  rationale: “Điều gì xấu” giữ được nghĩa cơ bản mà không thu hẹp thành lời tố cáo pháp lý hay chỉ là thông tin bất lợi.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng dấu chấm phẩy để làm rõ hai vế phủ định song song; không thêm “đây” sau động từ “đến” vì địa điểm chỉ được hàm ý trong ngữ cảnh.
