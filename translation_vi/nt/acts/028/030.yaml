  yaml_path: translation/nt/acts/028/030.yaml
  text: And he stayed for two whole years in his own rented lodging[a], and he welcomed all who came in to him[b],
translation:
  language: vi
  text: Ông ở trọn hai năm tại chỗ ở do mình thuê[a], và ông tiếp đón tất cả những ai đến gặp mình[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tại căn nhà mình thuê.” Từ Hy Lạp μίσθωμα chỉ nơi ở thuê, nhưng không xác định rõ đó là cả một căn nhà hay một chỗ lưu trú khác.
    reason: lexical_alternative
  - marker: b
    text: 'Sát nghĩa hơn: “tất cả những ai đi vào đến với ông,” có lẽ nói đến những người bước vào chỗ ông ở để gặp ông.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνέμεινεν
  choice: ở
  rationale: Động từ ἐμμένω ở đây diễn tả việc tiếp tục cư trú tại một nơi. “Ở” tự nhiên trong tiếng Việt hiện đại và không diễn giải quá mức như “sinh sống”.
- source_word: δὲ
  choice: không dịch thành một liên từ riêng
  rationale: δέ là từ nối nhẹ trong mạch kể chuyện. Trong tiếng Việt, mở câu trực tiếp bằng “Ông ở…” tự nhiên hơn mà vẫn giữ đúng diễn tiến, không tạo sắc thái tương phản không có trong nguyên văn.
- source_word: διετίαν ὅλην
  choice: trọn hai năm
  rationale: Cụm này chỉ khoảng thời gian kéo dài đủ hai năm và nhấn mạnh tính trọn vẹn; “trọn hai năm” vừa sát nghĩa vừa tự nhiên.
- source_word: ἐν ἰδίῳ μισθώματι
  choice: tại chỗ ở do mình thuê
  rationale: μίσθωμα trong ngữ cảnh chỉ nơi lưu trú thuê, không nhất thiết xác định là cả một căn nhà. “Do mình thuê” chuyển tải ἰδίῳ, tức chỗ ở được thu xếp riêng cho ông.
- source_word: ἀπεδέχετο
  choice: tiếp đón
  rationale: Thì chưa hoàn thành mô tả hành động diễn ra thường xuyên trong thời gian ấy. “Tiếp đón” thể hiện sắc thái đón nhận khách của ἀποδέχομαι.
- source_word: πάντας τοὺς εἰσπορευομένους πρὸς αὐτόν
  choice: tất cả những ai đến gặp mình
  rationale: Cách dịch này tự nhiên trong tiếng Việt và giữ ý mọi người đều được tiếp đón. Sắc thái đi vào nơi ông ở của εἰσπορεύομαι được ghi rõ trong chú thích.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” giữ cách quy chiếu ngầm của động từ Hy Lạp đến Phao-lô trong văn cảnh; “mình” tránh lặp “ông” và quy chiếu tự nhiên về chủ ngữ. Dấu phẩy cuối câu được giữ vì câu tiếp tục sang câu 31.
