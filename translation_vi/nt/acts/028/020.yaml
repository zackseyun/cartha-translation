  text: διὰ ταύτην οὖν τὴν αἰτίαν παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι, ἕνεκεν γὰρ τῆς ἐλπίδος τοῦ Ἰσραὴλ τὴν ἅλυσιν ταύτην περίκειμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/020.yaml
  text: For this reason[a], therefore, I asked to see you and to speak with you, for it is because of the hope of Israel that I am wearing this chain.
translation:
  language: vi
  text: Vì lý do này, tôi đã xin gặp và nói chuyện với quý vị; vì niềm hy vọng của Israel[a] mà tôi bị xiềng bằng xiềng xích này.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “niềm hy vọng của dân Israel.” Cụm từ này có thể gợi đến niềm hy vọng gắn với các lời hứa giao ước, Đấng Mê-si-a và sự sống lại; nguyên văn không giới hạn nó vào một khía cạnh duy nhất.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ ταύτην οὖν τὴν αἰτίαν
  choice: Vậy, vì lý do này
  rationale: Giữ cả quan hệ suy luận của οὖν lẫn ý nghĩa nguyên nhân của διὰ…τὴν αἰτίαν, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: παρεκάλεσα ὑμᾶς ἰδεῖν καὶ προσλαλῆσαι
  choice: tôi đã xin được gặp và nói chuyện với quý vị
  rationale: “Xin được gặp” diễn đạt tự nhiên lời đề nghị của Phao-lô trong bối cảnh ông cho mời các lãnh đạo Do Thái đến; “nói chuyện với” giữ sắc thái trao đổi của προσλαλῆσαι.
- source_word: ἕνεκεν γὰρ
  choice: bởi chính vì
  rationale: “Bởi” thể hiện chức năng giải thích của γάρ, còn “chính vì” nêu rõ quan hệ nguyên nhân của ἕνεκεν mà không làm câu quá nặng.
- source_word: τῆς ἐλπίδος τοῦ Ἰσραήλ
  choice: niềm hy vọng của Israel
  rationale: Giữ nguyên cấu trúc sở hữu cô đọng và không thu hẹp cụm từ vào riêng niềm hy vọng về Đấng Mê-si-a hay sự sống lại.
- source_word: τὴν ἅλυσιν ταύτην περίκειμαι
  choice: tôi đang đeo sợi xích này
  rationale: “Sợi xích” giữ số ít của ἅλυσιν; “đeo” truyền đạt hình ảnh cụ thể của περίκειμαι, tức vật ở quanh hoặc trên người, thay vì diễn giải khái quát là bị giam cầm.
theological_decisions:
- issue: Ý nghĩa của “niềm hy vọng của Israel”
  choice: Giữ nguyên “niềm hy vọng của Israel” mà không thêm lời giải thích vào chính văn.
  alternative: niềm hy vọng về sự sống lại của Israel; niềm hy vọng về Đấng Mê-si-a của Israel; niềm hy vọng đã được hứa cho Israel
  rationale: Trong ngữ cảnh Công Vụ, cụm từ có thể gợi đến lời hứa giao ước, Đấng Mê-si-a và sự sống lại, nhưng bản Hy Lạp vẫn diễn đạt cô đọng. Bản dịch vì thế bảo toàn độ rộng và sức căng thần học của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quý vị” vì Phao-lô đang nói với một nhóm lãnh đạo; “đeo sợi xích” giữ hình ảnh cụ thể của nguyên văn.
