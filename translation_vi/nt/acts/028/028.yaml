id: ACT.28.28
reference: Acts 28:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: γνωστὸν οὖν ⸂ἔστω ὑμῖν⸃ ὅτι τοῖς ἔθνεσιν ἀπεστάλη ⸀τοῦτο τὸ σωτήριον τοῦ θεοῦ· αὐτοὶ καὶ ⸀ἀκούσονται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/028.yaml
  text: Therefore let it be known to you that this salvation of God has been sent to the Gentiles[b][a]; they also will listen.
translation:
  language: vi
  text: Vậy, xin quý vị biết rằng sự cứu rỗi này của Đức Chúa Trời đã được gửi đến với các dân ngoại[a]; họ cũng sẽ lắng nghe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự cứu rỗi này đến từ Đức Chúa Trời.” Sở hữu cách trong tiếng Hy Lạp có thể được hiểu theo nhiều cách gần gũi nhau.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “họ cũng sẽ nghe.” Động từ Hy Lạp có thể mang nghĩa “nghe” hoặc “lắng nghe, đáp ứng”, tùy ngữ cảnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Vậy, xin anh em biết rằng
  rationale: Diễn đạt tự nhiên trong tiếng Việt hiện đại, đồng thời giữ sắc thái kết luận của οὖν và giọng tuyên bố trang trọng của thành ngữ γνωστὸν ... ἔστω ὑμῖν. Đại từ số nhiều được thể hiện bằng “anh em” theo đối tượng đang được Phao-lô trực tiếp nói với.
- source_word: τοῖς ἔθνεσιν
  choice: đến các dân ngoại
  rationale: Trong bối cảnh đối chiếu giữa người Do Thái và các ἔθνη, “các dân ngoại” chỉ rõ những người không thuộc dân Do Thái hơn cách dịch thuần chữ “các dân”.
- source_word: ἀπεστάλη
  choice: đã được gửi đến
  rationale: Giữ thể bị động và tính hoàn tất của động từ aorist, không xác định rõ tác nhân khi bản Hy Lạp không nêu trực tiếp trong mệnh đề.
- source_word: τοῦτο τὸ σωτήριον τοῦ θεοῦ
  choice: sự cứu rỗi này của Đức Chúa Trời
  rationale: σωτήριον được hiểu theo lối danh từ là “sự cứu rỗi”. Cách dịch “của Đức Chúa Trời” giữ độ mở của sở hữu cách τοῦ θεοῦ thay vì quyết định hẳn rằng đây chỉ là nguồn gốc.
- source_word: αὐτοὶ καὶ ἀκούσονται
  choice: chính họ cũng sẽ lắng nghe
  rationale: “Chính họ” thể hiện nét nhấn mạnh của αὐτοί, “cũng” thể hiện καί, còn “lắng nghe” truyền đạt ý nghe với thái độ tiếp nhận có khả năng được ngữ cảnh gợi ra mà không khẳng định thêm rằng họ sẽ quy đạo.
theological_decisions:
- issue: Ý nghĩa của σωτήριον trong ngữ cảnh
  choice: sự cứu rỗi
  alternative: sứ điệp cứu rỗi
  rationale: Từ Hy Lạp trực tiếp chỉ sự cứu rỗi; “sứ điệp cứu rỗi” sẽ thu hẹp ý nghĩa thành nội dung được rao truyền, trong khi câu có thể bao quát hành động cứu độ của Đức Chúa Trời.
- issue: Quan hệ của sở hữu cách τοῦ θεοῦ
  choice: của Đức Chúa Trời
  alternative: đến từ Đức Chúa Trời
  rationale: Cách dịch chính giữ lại sự nhập nhằng chân thực giữa ý nguồn gốc, sự thuộc về và đặc tính; chú thích nêu cách hiểu gần gũi về nguồn gốc.
- issue: Sắc thái của ἀκούσονται
  choice: sẽ lắng nghe
  alternative: sẽ nghe
  rationale: Ngữ cảnh đối chiếu sự không tiếp nhận với phản ứng của các dân ngoại nghiêng về ý nghe có đáp ứng. Tuy nhiên, vì động từ cũng có nghĩa đơn giản là “nghe”, cách ấy được giữ trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. “Đức Chúa Trời” được dùng cho θεός theo lối gọi phổ biến trong bản dịch Kinh Thánh Tin Lành tiếng Việt; câu không thêm bất kỳ kết luận hệ phái nào. Các dấu chú thích được đặt ngay sau cụm từ liên quan.
