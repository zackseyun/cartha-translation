- from: Sau khi ông nói những lời ấy,[a] người Do Thái ra về, trong khi tranh luận gay gắt với nhau.
  to: Sau khi ông nói những điều ấy,[a] người Do Thái ra về; giữa họ có một cuộc tranh luận sôi nổi.
  rationale: Điều chỉnh «những lời ấy» thành «những điều ấy» để phản ánh ταῦτα trực tiếp hơn. Thay «tranh luận gay gắt» bằng «một cuộc tranh luận sôi nổi» để diễn đạt quy mô/cường độ của πολλὴ συζήτησις mà không khẳng định mức độ đối đầu vượt quá nguyên văn. Chú thích và vị trí neo [a] được giữ nguyên, vì chú thích áp dụng cho toàn bộ câu.
