  text: And when he had [a]said these things, the Jews departed, having a great dispute among themselves.
translation:
  language: vi
  text: Sau khi ông nói những điều ấy,[a] người Do Thái ra về; giữa họ có một cuộc tranh luận sôi nổi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Toàn bộ câu này không có trong các thủ bản Hy Lạp cổ nhất, gồm Papyrus 74 (thế kỷ III), Codex Sinaiticus và Codex Vaticanus (thế kỷ IV), cũng như trong các bản dịch Copt cổ. Câu này có trong truyền thống đa số Byzantine, cùng với các bản dịch Latinh và Syriac cổ. Có khả năng đây là phần được người sao chép thêm vào về sau để hoàn chỉnh lời tường thuật về việc các lãnh đạo Do Thái ra về.
    reason: textual_critical
lexical_decisions:
- source_word: Καὶ ταῦτα αὐτοῦ εἰπόντος
  choice: Sau khi ông nói những lời ấy
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hành động xảy ra trước; cách dịch tự nhiên trong tiếng Việt và giữ đại từ không nêu đích danh của nguyên văn.
- source_word: ἀπῆλθον
  choice: ra về
  rationale: Trong bối cảnh các lãnh đạo Do Thái rời nơi gặp Phao-lô, “ra về” tự nhiên hơn “khởi hành” mà vẫn truyền đạt đúng hành động rời đi.
- source_word: πολλὴν ἔχοντες ἐν ἑαυτοῖς συζήτησιν
  choice: trong khi tranh luận gay gắt với nhau
  rationale: συζήτησις có thể chỉ sự bàn luận, tranh luận hay tranh cãi; πολλήν cho thấy mức độ đáng kể. “Tranh luận gay gắt” thể hiện cường độ và sự bất đồng mà không nhất thiết hàm ý xung đột thù địch.
