source:
  edition: SBLGNT
  text: κἀκεῖθεν οἱ ἀδελφοὶ ἀκούσαντες τὰ περὶ ἡμῶν ⸀ἦλθαν εἰς ἀπάντησιν ἡμῖν ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν, οὓς ἰδὼν ὁ Παῦλος εὐχαριστήσας τῷ θεῷ ἔλαβε θάρσος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/015.yaml
  text: And from there the brothers[a], when they heard about us, came to meet us as far as Appius Forum and Three Taverns. When Paul saw them, he gave thanks to God and took courage.
translation:
  language: vi
  text: Từ đó, các anh em[a] nghe tin về chúng tôi thì đi đón chúng tôi, đến tận Phô-rum A-bi-út và Ba Quán Trọ. Khi Phao-lô thấy họ, ông tạ ơn Đức Chúa Trời và vững lòng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các anh em”; trong cách dùng Hy Lạp, từ này có thể chỉ chung các tín hữu, gồm cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Từ đó
  rationale: Diễn tả tự nhiên sự chuyển tiếp về địa điểm trong hành trình; liên từ καί không nhất thiết phải dịch riêng trong tiếng Việt.
- source_word: οἱ ἀδελφοὶ
  choice: anh chị em
  rationale: Trong ngữ cảnh cộng đồng tín hữu, dạng số nhiều ἀδελφοί thường chỉ các tín hữu nói chung và có thể bao gồm cả nam lẫn nữ; cách dịch này tự nhiên trong tiếng Việt mà vẫn giữ hình ảnh quan hệ gia đình.
- source_word: ἀκούσαντες τὰ περὶ ἡμῶν
  choice: nghe tin về chúng tôi
  rationale: Phân từ mang ý nghĩa thời gian; τὰ περὶ ἡμῶν chỉ những tin tức liên quan đến đoàn của Phao-lô.
- source_word: ἦλθαν εἰς ἀπάντησιν ἡμῖν
  choice: đi đón chúng tôi
  rationale: Thành ngữ chỉ việc đi ra gặp người đang đến; “đi đón” phù hợp hướng di chuyển của các tín hữu từ Rô-ma.
- source_word: ἄχρι Ἀππίου Φόρου καὶ Τριῶν Ταβερνῶν
  choice: đến tận Phô-rum Áp-pi-út và Ba Quán Trọ
  rationale: “Đến tận” giữ sắc thái chỉ phạm vi của ἄχρι; hai địa danh được phiên âm hoặc dịch theo nghĩa dễ nhận biết trong tiếng Việt.
- source_word: εὐχαριστήσας τῷ θεῷ
  choice: tạ ơn Đức Chúa Trời
  rationale: Diễn đạt trang trọng, tự nhiên và giữ rõ đối tượng nhận lời tạ ơn.
- source_word: ἔλαβε θάρσος
  choice: vững lòng
  rationale: Thành ngữ Hy Lạp nghĩa đen là “nhận lấy lòng can đảm”; “vững lòng” truyền đạt sự can đảm được củng cố mà không hàm ý Phao-lô tự tạo ra nó.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοί
  choice: anh chị em
  alternative: các anh em; các tín hữu
  rationale: Ngữ cảnh có thể nói đến một nhóm tín hữu gồm cả nam lẫn nữ. Tiếng Việt thường dùng “anh chị em” cho cộng đồng đức tin, vừa giữ nghĩa thân tộc vừa biểu thị khả năng bao gồm cả hai giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Đi đón” làm rõ chuyển động ra khỏi Rô-ma để gặp đoàn Phao-lô; “vững lòng” giữ sắc thái nội tâm của θάρσος.
