language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγένετο δὲ τὸν πατέρα τοῦ Ποπλίου πυρετοῖς καὶ ⸀δυσεντερίῳ συνεχόμενον κατακεῖσθαι, πρὸς ὃν ὁ Παῦλος εἰσελθὼν καὶ προσευξάμενος ἐπιθεὶς τὰς χεῖρας αὐτῷ ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/008.yaml
  text: It happened that the father of Publius was lying sick with fevers and dysentery. Paul went in to him[a], and after praying and laying his hands on him, healed him.
translation:
  language: vi
  text: Cha của Púp-li-u đang nằm bệnh vì những cơn sốt và bệnh kiết lỵ.[a] Phao-lô vào gặp ông. Sau khi cầu nguyện và đặt tay trên ông, Phao-lô chữa lành cho ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bị những cơn sốt và bệnh kiết lỵ hành hạ.” Phân từ Hy Lạp diễn tả tình trạng bị các chứng bệnh này đè nặng hoặc chế ngự.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: (không dịch thành một cụm riêng)
  rationale: Đây là công thức chuyển tiếp thường gặp trong văn kể chuyện của Lu-ca. Trong tiếng Việt, mở câu trực tiếp bằng chủ thể tự nhiên hơn và vẫn giữ được diễn tiến của lời kể; tránh thêm yếu tố thời gian như “bấy giờ” vốn không được nêu rõ trong nguyên văn.
- source_word: τὸν πατέρα τοῦ Ποπλίου
  choice: cha của Púp-li-u
  rationale: Giữ sát cấu trúc sở hữu của tiếng Hy Lạp và dùng dạng phiên âm quen thuộc, dễ đọc trong tiếng Việt.
- source_word: πυρετοῖς
  choice: những cơn sốt
  rationale: Giữ hình thức số nhiều của nguyên văn, có thể gợi các cơn sốt tái diễn hoặc nhiều đợt sốt.
- source_word: δυσεντερίῳ
  choice: bệnh kiết lỵ
  rationale: Đây là nghĩa y khoa trực tiếp và là cách gọi thông dụng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: συνεχόμενον κατακεῖσθαι
  choice: đang nằm bệnh vì
  rationale: “Đang nằm bệnh” diễn đạt cả tư thế nằm và tình trạng đau ốm; “vì” nối tự nhiên với các chứng bệnh, còn sắc thái bị bệnh chế ngự được ghi nhận trong chú thích.
- source_word: πρὸς ὃν ὁ Παῦλος εἰσελθὼν
  choice: Phao-lô vào gặp ông
  rationale: Diễn đạt tự nhiên việc Phao-lô đi vào nơi người bệnh đang nằm mà không thêm chi tiết về căn phòng hay ngôi nhà.
- source_word: προσευξάμενος
  choice: sau khi cầu nguyện
  rationale: Thể hiện tự nhiên hành động xảy ra trước động từ chính, phù hợp với phân từ bất định quá khứ.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: đặt tay trên ông
  rationale: Cách diễn đạt quen thuộc trong văn Kinh Thánh, giữ động tác đặt tay mà không gán thêm ý nghĩa nghi lễ.
- source_word: ἰάσατο αὐτόν
  choice: chữa lành cho người bệnh
  rationale: Chuyển tải trực tiếp hành động chữa lành; dùng “người bệnh” ở lần nhắc cuối để tránh chuỗi đại từ “ông” gây mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Bản chất hành động chữa lành của Phao-lô
  choice: Thuật lại trình tự cầu nguyện, đặt tay và chữa lành mà không thêm nhãn giải thích.
  alternative: Nói rõ đây là phép lạ tức thời, một hành động mang tính bí tích, hoặc một sự hồi phục theo nghĩa y khoa.
  rationale: Câu văn khẳng định Phao-lô chữa lành người bệnh sau khi cầu nguyện và đặt tay, nhưng không xác định thời gian hồi phục hay đưa ra cách phân loại thần học cho hành động ấy.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu đầu tránh lối dịch máy móc “Có chuyện xảy ra rằng”; câu sau dùng “người bệnh” để phân biệt rõ người được chữa lành với Phao-lô.
