  text: καὶ οἱ μὲν ἐπείθοντο τοῖς λεγομένοις οἱ δὲ ἠπίστουν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/024.yaml
  text: And some were persuaded by what was being said[a], but others disbelieved.
translation:
  language: vi
  text: Có người bị thuyết phục bởi những điều được nói, nhưng những người khác thì không tin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không chịu tin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείθοντο
  choice: được thuyết phục
  rationale: Động từ ở thì chưa hoàn thành, dạng trung động/thụ động, diễn tả phản ứng đang diễn ra khi họ nghe sứ điệp. “Được thuyết phục” giữ ý họ bị những điều trình bày làm cho tin phục mà không tự động đồng nhất phản ứng ấy với một phạm trù thần học đầy đủ hơn.
- source_word: τοῖς λεγομένοις
  choice: bởi những điều đang được nói
  rationale: Phân từ hiện tại thụ động có mạo từ chỉ nội dung đang được trình bày. Cách dịch này giữ sắc thái tiếp diễn và không nêu đích danh người nói khi cụm Hy Lạp không làm vậy.
- source_word: ἠπίστουν
  choice: không tin
  rationale: ἀπιστέω có thể mang nghĩa không tin hoặc không chịu tin. “Không tin” phản ánh trực tiếp phản ứng đối lập mà không thêm sắc thái cố ý khước từ vốn không hoàn toàn minh nhiên trong hình thái động từ.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: có người ... nhưng có người
  rationale: Kết cấu tương liên này phân chia nhóm người nghe thành hai phía đối lập. Cách diễn đạt tiếng Việt tự nhiên này giữ rõ sự tương phản.
- source_word: καὶ
  choice: Và
  rationale: Liên từ nối câu này với diễn biến ngay trước đó; “Và” giữ mạch tường thuật mà không diễn giải thêm quan hệ nhân quả.
theological_decisions:
- issue: Bản chất của hai phản ứng đối lập
  choice: Câu dịch chỉ nói một số người được thuyết phục, còn số khác không tin.
  alternative: Hiểu những người được thuyết phục là tín hữu thật và những người kia là những kẻ cứng lòng theo nghĩa thần học đầy đủ.
  rationale: Bản văn Hy Lạp mô tả phản ứng tức thời trước sứ điệp nhưng không tự xác định tình trạng thuộc linh cuối cùng của từng người; vì vậy câu dịch không áp đặt kết luận giáo lý rộng hơn.
- issue: Sắc thái ý chí trong ἠπίστουν
  choice: không tin
  alternative: không chịu tin
  rationale: “Không chịu tin” là một khả năng từ vựng, nhưng có thể nhấn mạnh sự cố ý khước từ hơn mức câu Hy Lạp tự nó đòi hỏi. Sắc thái ấy được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Cấu trúc “có người ... nhưng có người” tự nhiên hơn lối dịch sát chữ “những người này ... những người kia”, trong khi vẫn giữ sự phân nhóm và đối lập của câu Hy Lạp.
