  text: ὁ μὲν οὖν ἀποτινάξας τὸ θηρίον εἰς τὸ πῦρ ἔπαθεν οὐδὲν κακόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/005.yaml
  text: So he[a], after shaking the creature off into the fire, suffered no harm.
translation:
  language: vi
  text: Vậy, sau khi giũ con vật ấy[a] vào lửa, ông không hề hấn gì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “con thú ấy.” Từ Hy Lạp có nghĩa khái quát; dù ngữ cảnh xác định đó là một con rắn, câu này không dùng từ cụ thể chỉ rắn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν οὖν
  choice: Vậy, ... ông
  rationale: Mạo từ được dùng như đại từ, chỉ Phao-lô; μέν οὖν tạo sự chuyển tiếp nhẹ trong mạch kể. “Vậy” cùng “ông” diễn đạt tự nhiên mà không nhấn quá mức các tiểu từ.
- source_word: ἀποτινάξας
  choice: sau khi giũ
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; “sau khi giũ” giữ rõ trình tự hành động và tự nhiên trong tiếng Việt.
- source_word: τὸ θηρίον
  choice: con vật ấy
  rationale: θηρίον là danh từ khái quát chỉ một con vật, thường là thú hoang. Ngữ cảnh cho biết đó là rắn, nhưng từ được dùng tại đây không cụ thể đến vậy; “con vật ấy” vừa giữ tính khái quát vừa liên kết với câu trước.
- source_word: εἰς τὸ πῦρ
  choice: vào lửa
  rationale: Diễn đạt trực tiếp hướng chuyển động vào trong lửa, phù hợp với εἰς cùng đối cách.
- source_word: ἔπαθεν οὐδὲν κακόν
  choice: không hề hấn gì
  rationale: Cụm này diễn tả việc không chịu tổn hại hay tác động xấu nào. “Không hề hấn gì” là thành ngữ tiếng Việt tự nhiên, rõ nghĩa và phù hợp văn kể chuyện.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ danh từ khái quát “con vật ấy” thay vì cụ thể hóa thành “con rắn,” vì câu Hy Lạp dùng θηρίον; ngữ cảnh câu trước đã xác định đó là rắn. Dấu chú thích [a] đặt sau mệnh đề liên quan.
