  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ταξάμενοι δὲ αὐτῷ ἡμέραν ⸀ἧκον πρὸς αὐτὸν εἰς τὴν ξενίαν πλείονες, οἷς ἐξετίθετο διαμαρτυρόμενος τὴν βασιλείαν τοῦ θεοῦ πείθων τε ⸀αὐτοὺς περὶ τοῦ Ἰησοῦ ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν ἀπὸ πρωῒ ἕως ἑσπέρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/028/023.yaml
  text: After they had arranged a day with him[a], more of them came to him at his lodging. To them he was explaining, solemnly testifying about the kingdom of God and persuading them concerning Jesus from both the Law of Moses and the Prophets[c][b], from morning until evening.
translation:
  language: vi
  text: Sau khi họ đã hẹn với ông một ngày, nhiều người hơn đến chỗ ông trọ. Từ sáng đến tối, ông giải thích cho họ, tha thiết làm chứng về vương quốc Đức Chúa Trời và cố thuyết phục họ về Chúa Giê-su dựa trên cả Luật pháp Môi-se lẫn các sách Tiên tri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thuyết phục họ.” Động từ Hy Lạp có thể nhấn mạnh hành động thuyết phục mà không tự nó nói rõ mọi người nghe đều bị thuyết phục.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενοι ... αὐτῷ ἡμέραν
  choice: Sau khi họ đã hẹn với ông một ngày
  rationale: Diễn đạt tự nhiên hành động ấn định một ngày gặp với Phao-lô; thể trung gian không cần biểu thị riêng trong tiếng Việt.
- source_word: εἰς τὴν ξενίαν
  choice: đến chỗ ông trọ
  rationale: ξενία chỉ nơi lưu trú hoặc chỗ ở dành cho khách; cách nói này tự nhiên và không xác định quá mức loại hình chỗ ở.
- source_word: πλείονες
  choice: nhiều người hơn
  rationale: Giữ sắc thái so sánh của πλείονες, có thể hàm ý số người đến lần này đông hơn trước.
- source_word: ἐξετίθετο
  choice: trình bày
  rationale: Động từ ở thì chưa hoàn thành nói đến sự trình bày, giải thích kéo dài; “trình bày” trang trọng nhưng vẫn dễ hiểu.
- source_word: διαμαρτυρόμενος
  choice: long trọng làm chứng về
  rationale: Giữ sức nặng của lời chứng tha thiết, nghiêm túc mà không thêm nội dung ngoài văn bản.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: vương quốc Đức Chúa Trời
  rationale: Cách dịch minh bạch, quen thuộc và giữ hình ảnh quyền trị vì cùng vương quốc trong βασιλεία.
- source_word: πείθων τε αὐτοὺς
  choice: và cố thuyết phục họ
  rationale: Diễn tả hoạt động nhằm thuyết phục mà không ngụ ý tất cả người nghe thực sự đã bị thuyết phục; kết quả khác nhau được nêu ở câu kế tiếp.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: về Chúa Giê-su
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt; danh xưng “Chúa” phù hợp lối gọi đã định hình trong tiếng Việt Cơ Đốc mà không giải quyết thêm vấn đề thần học.
- source_word: ἀπό τε τοῦ νόμου Μωϋσέως καὶ τῶν προφητῶν
  choice: dựa trên cả Luật pháp Môi-se lẫn các sách Tiên tri
  rationale: ἀπό biểu thị nguồn hoặc cơ sở của lập luận; “cả... lẫn...” phản ánh cấu trúc τε...καί. Thêm “các sách” giúp người đọc hiểu “Tiên tri” ở đây chỉ phần Kinh Thánh.
- source_word: ἀπὸ πρωῒ ἕως ἑσπέρας
  choice: Từ sáng đến tối
  rationale: Phản ánh trực tiếp khoảng thời gian kéo dài mà không cường điệu thành từ rạng đông đến chạng vạng.
theological_decisions:
- issue: Mối liên hệ giữa vương quốc Đức Chúa Trời và Chúa Giê-su
  choice: Giữ hai nội dung trong cùng một hoạt động trình bày và làm chứng liên tục của Phao-lô.
  alternative: Xem đây là hai chủ đề hoàn toàn tách biệt, không có mối liên hệ tất yếu.
  rationale: Cú pháp nối lời làm chứng về vương quốc với nỗ lực thuyết phục về Chúa Giê-su, đều dựa trên Luật pháp và các sách Tiên tri; bản dịch giữ mối liên hệ đó nhưng không triển khai thành một hệ thống thần học.
- issue: πείθων có hàm ý thành công hay chỉ nỗ lực thuyết phục
  choice: cố thuyết phục họ
  alternative: thuyết phục họ
  rationale: Văn cảnh kế tiếp cho thấy phản ứng không đồng nhất. Cách dịch đã chọn giữ mục đích và tiến trình thuyết phục mà không quyết định trước kết quả; chú thích ghi nhận cách hiểu trực tiếp hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Đưa cụm thời gian lên đầu câu thứ hai để tránh chuỗi bổ ngữ nặng nề, đồng thời vẫn giữ rõ hoạt động kéo dài suốt ngày. Dùng “ông” cho Phao-lô theo mạch kể, và “họ” cho nhóm người nghe.
