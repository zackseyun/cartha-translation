id: ACT.16.16
reference: Acts 16:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ πορευομένων ἡμῶν εἰς ⸀τὴν προσευχὴν παιδίσκην τινὰ ἔχουσαν πνεῦμα ⸀πύθωνα ⸀ὑπαντῆσαι ἡμῖν, ἥτις ἐργασίαν πολλὴν παρεῖχεν τοῖς κυρίοις αὐτῆς μαντευομένη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/016.yaml
  text: And it happened that, as we were going to the place of prayer, a certain servant girl who had a python spirit met us, and she was bringing much profit to her masters by fortune-telling.
translation:
  language: vi
  text: Một hôm, khi chúng tôi đang đi đến nơi cầu nguyện, chúng tôi gặp một nữ nô lệ có một linh thần Python[a]. Cô thường đem lại nhiều lợi nhuận cho các chủ của cô bằng việc bói toán.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “một linh thần bói toán.” Nguyên văn Hy Lạp nói “một linh thần Python,” một thuật ngữ văn hóa gắn với việc tiên đoán bằng bói thuật.
    reason: alternative_reading
  - marker: b
    text: Hay “bằng việc thực hành bói toán.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Một hôm
  rationale: Diễn đạt tự nhiên công thức chuyển tiếp tường thuật của Lu-ca, giới thiệu một sự việc mới mà không dùng lối văn cổ.
- source_word: πορευομένων ἡμῶν
  choice: khi chúng tôi đang đi
  rationale: Giữ sắc thái đồng thời và tiếp diễn của kết cấu sở hữu cách tuyệt đối.
- source_word: εἰς τὴν προσευχὴν
  choice: đến nơi cầu nguyện
  rationale: Trong ngữ cảnh này, cụm từ có khả năng chỉ một địa điểm được dùng để cầu nguyện, không chỉ hành động cầu nguyện.
- source_word: παιδίσκην τινά
  choice: một nữ nô lệ
  rationale: Ngữ cảnh nói đến nhiều chủ và lợi nhuận họ thu được từ cô, nên cần thể hiện rõ thân phận lệ thuộc thay vì chỉ gọi là đầy tớ gái.
- source_word: ἔχουσαν πνεῦμα πύθωνα
  choice: bị một thần Python ám
  rationale: Giữ tên gọi đặc thù văn hóa Python trong nguyên văn, đồng thời dùng cách nói tiếng Việt tự nhiên để diễn tả việc cô ở dưới ảnh hưởng của thần ấy; chú thích giải thích chức năng bói toán của thuật ngữ.
- source_word: ὑπαντῆσαι ἡμῖν
  choice: đã gặp chúng tôi
  rationale: Chuyển động từ nguyên mẫu trong cấu trúc tường thuật Hy Lạp thành động từ chính tự nhiên trong tiếng Việt.
- source_word: ἐργασίαν πολλὴν παρεῖχεν
  choice: đem lại nhiều lợi nhuận
  rationale: Diễn đạt rõ lợi ích kinh tế đáng kể; văn cảnh cho thấy đây là khoản thu thường xuyên.
- source_word: τοῖς κυρίοις αὐτῆς
  choice: cho các chủ mình
  rationale: κύριοι ở đây chỉ những người sở hữu và kiểm soát nữ nô lệ, không phải tước hiệu thần linh.
- source_word: μαντευομένη
  choice: bằng việc bói toán
  rationale: Thuật ngữ phổ thông, dễ hiểu, chỉ hoạt động tiên đoán bằng phương thức huyền thuật; chú thích giữ phương án trang trọng hơn.
theological_decisions:
- issue: Cách dịch πνεῦμα πύθωνα, một thành ngữ mang bối cảnh tôn giáo-văn hóa về việc tiên đoán
  choice: một thần Python
  alternative: một thần bói toán
  rationale: Giữ nét đặc thù của nguyên văn thay vì thay ngay bằng cách giải nghĩa; chú thích cung cấp cách hiểu chức năng để độc giả hiện đại không nhầm Python chỉ là tên một loài rắn.
- issue: Có nên thể hiện thân phận nô lệ trong παιδίσκη hay không
  choice: nữ nô lệ
  alternative: đầy tớ gái
  rationale: Việc cô có nhiều chủ và bị họ khai thác để kiếm lợi cho thấy thân phận sở hữu/lệ thuộc là quan trọng trong câu.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu được tách làm hai để tránh kết cấu quan hệ kéo dài; “nữ nô lệ” làm rõ thực trạng bị khai thác, còn “Python” được giữ nguyên và giải thích trong chú thích.
