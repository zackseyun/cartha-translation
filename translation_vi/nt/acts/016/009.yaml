  - severity: medium
    issue: Cụm “đang đứng và khẩn khoản với ông rằng” thiếu tự nhiên và làm mờ động từ παρακαλῶν αὐτόν.
    rationale: “Khẩn khoản” cần được dùng như trạng từ hoặc đi với động từ. “Khẩn khoản xin ông, nói rằng” vừa tự nhiên vừa diễn tả người ấy tha thiết hướng lời yêu cầu đến Phao-lô.
