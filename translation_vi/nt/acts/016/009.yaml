id: ACT.16.9
reference: Acts 16:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ὅραμα ⸀διὰ νυκτὸς ⸂τῷ Παύλῳ ὤφθη⸃, ἀνὴρ ⸂Μακεδών τις ἦν⸃ ἑστὼς ⸀καὶ παρακαλῶν αὐτὸν καὶ λέγων· Διαβὰς εἰς Μακεδονίαν βοήθησον ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/009.yaml
  text: 'And a vision appeared to Paul in the night: a certain Macedonian man was standing and urging him[a], saying[c][b], “Come over into Macedonia and help us.”'
translation:
  language: vi
  text: 'Vào ban đêm[a], một khải tượng hiện ra với Phao-lô: một người đàn ông Ma-xê-đô-ni-a[b] đang đứng, khẩn khoản xin ông, nói rằng: “Hãy sang Ma-xê-đô-ni-a[c] giúp chúng tôi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong đêm” hoặc “ban đêm.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “một người đàn ông xứ Ma-xê-đô-ni-a” hoặc “một người đàn ông thuộc Ma-xê-đô-ni-a.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn Hy Lạp: “Sau khi vượt sang Ma-xê-đô-ni-a, hãy giúp chúng tôi”; trong câu này, “sang” truyền đạt tự nhiên ý của phân từ đi kèm mệnh lệnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅραμα
  choice: khải tượng
  rationale: Chỉ một cảnh tượng mang tính mặc khải; “khải tượng” là cách diễn đạt quen thuộc, trang trọng và không xác định cụ thể đó là giấc mơ hay một hiện tượng khách quan.
- source_word: διὰ νυκτός
  choice: trong đêm
  rationale: Diễn đạt tự nhiên khoảng thời gian khải tượng xảy ra, đồng thời giữ nguyên bối cảnh ban đêm.
- source_word: τῷ Παύλῳ ὤφθη
  choice: hiện ra với Phao-lô
  rationale: Thể bị động của ὁράω đi với cách dữ được chuyển thành lối nói tự nhiên trong tiếng Việt, diễn tả việc Phao-lô được thấy khải tượng mà không giải thích quá mức bản chất của trải nghiệm.
- source_word: ἀνὴρ Μακεδών τις
  choice: một người Ma-xê-đô-ni-a nọ
  rationale: “Người” trong ngữ cảnh chỉ một người nam; “nọ” phản ánh sắc thái bất định của τις mà vẫn tự nhiên trong lời kể tiếng Việt.
- source_word: ἑστώς
  choice: đang đứng
  rationale: Giữ khía cạnh tiếp diễn, dựng nên tư thế của người ấy trong khải tượng.
- source_word: παρακαλῶν
  choice: khẩn khoản
  rationale: Thể hiện lời kêu gọi tha thiết xin trợ giúp nhưng không nhất thiết hàm ý van xin tuyệt vọng.
- source_word: λέγων
  choice: rằng
  rationale: Dẫn vào lời nói trực tiếp một cách gọn và tự nhiên sau động từ diễn tả sự khẩn khoản.
- source_word: Διαβάς
  choice: sang
  rationale: Phân từ aorist đi với mệnh lệnh mang ý chuyển động vượt qua để đến nơi; “sang” truyền đạt tự nhiên ý này trong tiếng Việt.
- source_word: εἰς Μακεδονίαν
  choice: Ma-xê-đô-ni-a
  rationale: Sau động từ “sang,” địa danh đã biểu thị rõ đích đến nên không cần thêm giới từ, tránh câu nặng nề.
- source_word: βοήθησον ἡμῖν
  choice: giúp chúng tôi
  rationale: Lời cầu xin trực tiếp, đơn giản và đúng lực của mệnh lệnh trong nguyên văn.
theological_decisions:
- issue: Bản chất của trải nghiệm được diễn tả bằng ὅραμα và ὤφθη
  choice: Diễn đạt rằng một khải tượng hiện ra với Phao-lô, không xác định thêm cách thức.
  alternative: Giấc mơ, ấn tượng nội tâm hoặc sự hiện hình khách quan.
  rationale: Nguyên văn xác nhận đây là một khải tượng xảy ra trong đêm nhưng không cho biết hiện tượng học chính xác; bản dịch giữ sự dè dặt đó.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “khải tượng” để giữ sắc thái mặc khải; phiên âm địa danh theo lối quen thuộc trong Kinh Thánh tiếng Việt. Cấu trúc câu bảo toàn diễn tiến của cảnh tượng và lời kêu gọi tha thiết.
