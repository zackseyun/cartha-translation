  text: ἐφώνησεν δὲ ⸂φωνῇ μεγάλῃ ὁ Παῦλος⸃ λέγων· Μηδὲν πράξῃς σεαυτῷ κακόν, ἅπαντες γάρ ἐσμεν ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/028.yaml
  text: But Paul shouted with a loud voice[a], saying, “Do not do yourself any harm, for we are all here.”
translation:
  language: vi
  text: 'Nhưng Phao-lô lớn tiếng kêu lên: “Đừng làm điều gì hại đến mình[a], vì tất cả chúng tôi đều ở đây!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “Đừng tự làm hại mình.” Nguyên văn Hy Lạp có nghĩa rộng hơn: “Đừng làm điều gì có hại cho bản thân,” nhưng trong ngữ cảnh, lời này nói đến việc viên cai ngục định tự gây thương tích.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφώνησεν ... φωνῇ μεγάλῃ
  choice: lớn tiếng kêu lên
  rationale: Cách diễn đạt này chuyển tải cả hành động gọi lớn của ἐφώνησεν và cường độ của φωνῇ μεγάλῃ, đồng thời tự nhiên trong tình huống khẩn cấp.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu sự tương phản với ý định tự sát của viên cai ngục ở câu trước và cho thấy lời Phao-lô lập tức ngăn hành động ấy.
- source_word: λέγων
  choice: dấu hai chấm mở lời nói trực tiếp
  rationale: Trong tiếng Việt, nội dung của phân từ λέγων được thể hiện tự nhiên bằng dấu hai chấm sau động từ phát ngôn, không cần thêm từ “nói rằng”.
- source_word: Μηδὲν πράξῃς σεαυτῷ κακόν
  choice: Đừng làm điều gì hại đến mình
  rationale: Giữ được phạm vi tương đối rộng của μηδὲν ... κακόν (“đừng làm điều gì xấu/có hại”) và sắc thái phản thân của σεαυτῷ, trong khi ngữ cảnh cho thấy điều được nhắm đến là hành vi tự gây thương tích.
- source_word: ἅπαντες
  choice: tất cả chúng tôi đều
  rationale: 'Diễn đạt rõ tính toàn thể được nhấn mạnh: Phao-lô và mọi người đang bị giam đều vẫn còn tại đó.'
- source_word: γάρ
  choice: vì
  rationale: Nêu lý do viên cai ngục không nên tự làm hại mình.
- source_word: ἐνθάδε
  choice: ở đây
  rationale: Tương đương trực tiếp, rõ ràng và tự nhiên với trạng từ chỉ nơi chốn.
- source_word: ὁ Παῦλος
  choice: Phao-lô
  rationale: Dùng dạng tên riêng đã quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Lớn tiếng kêu lên” diễn tả tính khẩn cấp mà không rườm rà; dấu chấm than phù hợp với lời cảnh báo trong tình thế nguy hiểm. Dấu chú thích [a] được đặt ngay sau cụm từ mà chú thích giải thích.
