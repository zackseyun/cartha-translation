  text: καὶ συνεπέστη ὁ ὄχλος κατ’ αὐτῶν, καὶ οἱ στρατηγοὶ περιρήξαντες αὐτῶν τὰ ἱμάτια ἐκέλευον ῥαβδίζειν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/022.yaml
  text: And the crowd rose up together against them[a], and the magistrates, after tearing off their garments, were ordering them to be beaten with rods[b],
translation:
  language: vi
  text: Đám đông cũng hùa nhau nổi dậy chống lại họ[a]. Các quan chức lột áo họ rồi ra lệnh dùng gậy đánh họ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng nhau xông vào tấn công họ.” Động từ Hy Lạp nhấn mạnh hành động thù địch tập thể của đám đông.'
    reason: lexical_alternative
  - marker: b
    text: “Các quan chức” ở đây là các viên chức chấp chính dân sự của thành Phi-líp, một thuộc địa La Mã; theo chức danh chuyên môn, có thể gọi là “các pháp quan.”
    reason: cultural_note
lexical_decisions:
- source_word: συνεπέστη
  choice: đồng loạt chống lại
  rationale: Diễn đạt hành động thù địch mang tính tập thể của đám đông, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ὄχλος
  choice: đám đông
  rationale: Tương đương trung tính và tự nhiên; tránh dùng “đám đông hung bạo” vì như vậy sẽ diễn giải quá mức sắc thái của danh từ.
- source_word: κατ’ αὐτῶν
  choice: chống lại họ
  rationale: Thể hiện nghĩa thù địch của κατά với sở hữu cách trong văn cảnh.
- source_word: στρατηγοὶ
  choice: các quan chức
  rationale: Chỉ những người đứng đầu chính quyền dân sự La Mã tại Phi-líp; cách dịch này rõ nghĩa với độc giả phổ thông, còn thuật ngữ chuyên biệt được giải thích trong chú thích.
- source_word: περιρήξαντες
  choice: xé ... ra rồi
  rationale: Phân từ aorist mô tả hành động xảy ra trước mệnh lệnh; “rồi” thể hiện rõ trình tự mà vẫn giữ câu văn tự nhiên.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: áo của họ
  rationale: Trong văn cảnh, chỉ quần áo của Phao-lô và Si-la bị xé/cởi khỏi người để chuẩn bị thi hành hình phạt; “áo” gọn và tự nhiên hơn “y phục”.
- source_word: ἐκέλευον
  choice: truyền
  rationale: Diễn đạt mệnh lệnh của nhà chức trách. Tiếng Việt không tự nhiên khi buộc phải tái hiện riêng biệt thể chưa hoàn thành bằng cấu trúc kéo dài.
- source_word: ῥαβδίζειν
  choice: đánh họ bằng roi gậy
  rationale: Nêu rõ việc dùng gậy theo hình phạt thân thể của La Mã; “roi gậy” là cách diễn đạt dễ hiểu và tránh khiến “đánh bằng roi” bị hiểu là dùng roi da.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ nhịp kể nhanh của nguyên bản; tránh thuật ngữ hành chính cổ hoặc quá chuyên biệt trong chính văn.
