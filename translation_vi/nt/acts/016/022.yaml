- from: Đám đông cũng đồng loạt chống lại họ[a]. Các quan chức xé áo của họ ra rồi truyền đánh họ bằng roi gậy[b].
  to: Đám đông cũng hùa nhau nổi dậy chống lại họ[a]. Các quan chức lột áo họ rồi ra lệnh dùng gậy đánh họ[b].
  rationale: 'Bản sửa giữ nguyên quan hệ cú pháp và trình tự của câu Hy Lạp: đám đông cùng hành động chống lại hai người; các quan chức lột áo họ trước, rồi ra lệnh đánh bằng gậy. Các thay đổi loại bỏ cách gọi dụng cụ thiếu chính xác, làm câu văn tự nhiên hơn, và điều chỉnh chú thích lịch sử theo hướng chính xác mà không quá diễn giải.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn biến chính: đám đông cùng chống lại Phao-lô và Si-la, các nhà chức trách xử lý áo quần của họ trước khi ra lệnh đánh bằng gậy. Tuy nhiên, “roi gậy” không phải cách gọi chính xác, vì ῥαβδίζειν chỉ việc đánh bằng gậy/trượng, không phải roi; và “xé áo ... ra” chưa diễn đạt tự nhiên, rõ ràng hành động lột/cởi áo của các bị cáo trong văn cảnh hình phạt.'
  naturalness: “Đám đông cũng đồng loạt chống lại họ” hiểu được nhưng hơi hành chính; “hùa nhau nổi dậy chống lại họ” tự nhiên hơn và vẫn phản ánh tính tập thể, thù nghịch của συνεπέστη. “Truyền đánh họ” cũng kém tự nhiên trong tiếng Việt hiện đại; “ra lệnh dùng gậy đánh họ” rõ ràng và trang trọng vừa phải.
  terminology: “Các quan chức” có thể dùng trong chính văn, nhưng chú thích nên gọi họ là các viên chức/chấp chính dân sự của thành Phi-líp, thay vì khẳng định chung chung là “những người đứng đầu chính quyền La Mã.” Chức danh kỹ thuật “pháp quan” có thể nêu như một cách gọi chuyên môn trong chú thích. “Gậy” là thuật ngữ phù hợp cho ῥαβδίζειν.
  issues:
  - severity: medium
    issue: “roi gậy” dịch không chính xác ῥαβδίζειν.
    rationale: Động từ này chỉ hình phạt đánh bằng gậy (rods). “Roi gậy” dễ gợi một dụng cụ kết hợp hoặc roi da, làm mờ chi tiết hình phạt trong nguồn Hy Lạp.
  - severity: medium
    issue: “xé áo của họ ra” thiếu tự nhiên và chưa rõ hành động lột/cởi áo các bị cáo.
    rationale: περιρήξαντες αὐτῶν τὰ ἱμάτια mô tả việc các quan chức cho lột/cởi áo của Phao-lô và Si-la trước khi đánh. “Lột áo họ” diễn đạt kết quả và trình tự rõ hơn trong tiếng Việt.
  - severity: low
    issue: Chú thích b mô tả chức năng của στρατηγοί quá khái quát.
    rationale: Trong Phi-líp, từ này chỉ các quan chức/chấp chính dân sự của thành, với cách gọi kỹ thuật thường liên hệ đến “praetors”; không cần diễn đạt họ là toàn bộ “những người đứng đầu chính quyền La Mã.”
