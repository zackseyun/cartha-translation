id: ACT.16.10
reference: Acts 16:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ τὸ ὅραμα εἶδεν, εὐθέως ἐζητήσαμεν ἐξελθεῖν ⸀εἰς Μακεδονίαν, συμβιβάζοντες ὅτι προσκέκληται ἡμᾶς ὁ ⸀θεὸς εὐαγγελίσασθαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/010.yaml
  text: And when he had seen the vision[a], we immediately sought to go on into Macedonia[c][b], concluding that God had called us to proclaim the good news to them.
translation:
  language: vi
  text: Sau khi ông thấy khải tượng, chúng tôi suy ra rằng Đức Chúa Trời đã gọi chúng tôi rao truyền tin mừng cho họ, nên lập tức tìm cách đi sang Ma-xê-đô-ni-a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ
  choice: Sau khi
  rationale: Diễn đạt tự nhiên quan hệ thời gian và sự tiếp nối trong câu chuyện, không làm εὐθέως bị lặp nghĩa.
- source_word: τὸ ὅραμα
  choice: khải tượng
  rationale: Thuật ngữ tiếng Việt trang trọng, dễ hiểu, chỉ một cảnh tượng mang tính mặc khải.
- source_word: εἶδεν
  choice: ông thấy
  rationale: Thì quá khứ đã được quan hệ 'sau khi' biểu đạt rõ; 'ông' giữ nguyên chủ thể ngôi thứ ba số ít mà không xác định thêm danh tính.
- source_word: εὐθέως
  choice: lập tức
  rationale: Truyền đạt chính xác tính tức thời bằng cách nói tự nhiên trong tiếng Việt hiện đại.
- source_word: ἐζητήσαμεν
  choice: chúng tôi tìm cách
  rationale: Trong ngữ cảnh này ζητέω mang nghĩa cố gắng, thu xếp để thực hiện; 'tìm cách' tự nhiên hơn cách dịch sát chữ 'tìm kiếm'.
- source_word: ἐξελθεῖν εἰς Μακεδονίαν
  choice: đi sang Ma-xê-đô-ni-a
  rationale: Diễn đạt tự nhiên hành trình từ vùng hiện tại sang Ma-xê-đô-ni-a; không ép hình ảnh 'đi ra' vốn kém tự nhiên trong tiếng Việt ở đây.
- source_word: συμβιβάζοντες
  choice: vì kết luận rằng
  rationale: Diễn tả việc các nhân vật suy xét các dữ kiện rồi đi đến kết luận; 'vì' làm rõ quan hệ lý do của hành động tìm cách lên đường.
- source_word: προσκέκληται
  choice: đã gọi
  rationale: Giữ ý hành động kêu gọi đã xảy ra và còn hiệu lực, đồng thời không làm yếu sắc thái chủ động của sự hướng dẫn từ Đức Chúa Trời.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng trang trọng, quen thuộc và rõ nghĩa trong tiếng Việt Kinh Thánh.
- source_word: εὐαγγελίσασθαι
  choice: đến rao truyền tin mừng
  rationale: Diễn đạt rõ hành động công bố tin mừng bằng ngôn ngữ dễ hiểu; 'đến' gắn mục đích kêu gọi với sứ mạng dành cho những người tại đích đến.
- source_word: αὐτούς
  choice: cho họ
  rationale: Giữ đại từ chỉ những người ở Ma-xê-đô-ni-a mà không xác định quá mức đối tượng.
theological_decisions:
- issue: Sự chuyển đổi sang ngôi thứ nhất số nhiều ἐζητήσαμεν / ἡμᾶς
  choice: Giữ nguyên 'chúng tôi' trong lời kể.
  alternative: Chuyển sang cách nói phi cá nhân hoặc giải thích đây là dấu hiệu về tác giả.
  rationale: Bản Hy Lạp chuyển rõ sang ngôi thứ nhất số nhiều; bản dịch giữ đặc điểm đó nhưng không áp đặt kết luận về danh tính tác giả.
- issue: Sáng kiến thần linh trong προσκέκληται ἡμᾶς ὁ θεὸς
  choice: Đức Chúa Trời đã gọi chúng tôi
  alternative: Đức Chúa Trời đang hướng dẫn hoặc đã mời chúng tôi
  rationale: Động từ chỉ sự gọi đến hoặc triệu gọi; 'đã gọi' bảo toàn sáng kiến của Đức Chúa Trời mà không thêm nội dung thần học ngoài câu.
- issue: Căn cứ nhận biết ý muốn của Đức Chúa Trời
  choice: vì kết luận rằng
  alternative: vì biết chắc rằng
  rationale: συμβιβάζοντες mô tả việc suy xét để đi đến kết luận, không nhất thiết nói đến sự hiểu biết trực tiếp hoặc tuyệt đối; cách dịch giữ sự căng thẳng giữa khải tượng và suy luận của nhóm.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng 'khải tượng' và 'Đức Chúa Trời' theo ngữ vực Kinh Thánh phổ thông; câu giữ nhịp kể gọn, không thêm chú giải về người thấy khải tượng hoặc về tác giả của lời kể.
