  text: And they spoke the word of the Lord to him[c][b][a], together with all who were in his house.
translation:
  language: vi
  text: Họ nói lời của Chúa[a] cho ông và cho tất cả những người trong nhà ông.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sứ điệp về Chúa.” Cụm Hy Lạp “lời của Chúa” có thể chỉ lời thuộc về Chúa, đến từ Chúa, hoặc nói về Chúa.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “cả gia đình ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάλησαν
  choice: giảng
  rationale: Trong ngữ cảnh truyền đạt sứ điệp Tin Lành, «giảng» diễn đạt tự nhiên hành động nói và chỉ dẫn có nội dung, nhưng không mang sắc thái công bố trước công chúng quá mạnh.
- source_word: αὐτῷ
  choice: cho ông
  rationale: Đại từ số ít chỉ người cai ngục; với λαλέω, cách dịch tự nhiên trong tiếng Việt là «cho ông».
- source_word: τὸν λόγον
  choice: lời
  rationale: λόγος ở đây chỉ sứ điệp được nói ra. «Lời» giữ được thành ngữ quen thuộc của Tân Ước và cấu trúc kết hợp với «của Chúa».
- source_word: τοῦ κυρίου
  choice: của Chúa
  rationale: Giữ nguyên cấu trúc sở hữu rộng của tiếng Hy Lạp, không quyết định rằng đây chỉ là lời đến từ Chúa hay chỉ là sứ điệp nói về Chúa.
- source_word: σὺν πᾶσι τοῖς ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: cùng với tất cả những người ở trong nhà ông
  rationale: «Cùng với» phản ánh trực tiếp σύν và cho thấy những người có mặt trong nhà cũng cùng ông tiếp nhận lời được nói.
- source_word: οἰκίᾳ
  choice: nhà
  rationale: οἰκία có thể chỉ ngôi nhà hoặc gia đình; «nhà» giữ hình ảnh cụ thể của nguyên văn, còn nghĩa «gia đình» được ghi ở chú thích.
theological_decisions:
- issue: Ý nghĩa của cụm «lời của Chúa»
  choice: Giữ «lời của Chúa» mà không xác định quan hệ sở hữu là nguồn gốc hay nội dung.
  alternative: sứ điệp về Chúa; lời đến từ Chúa
  rationale: Cấu trúc λόγον τοῦ κυρίου có thể chỉ lời thuộc về hoặc đến từ Chúa, cũng có thể chỉ sứ điệp nói về Chúa. Bản chính giữ độ mở của nguyên văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng «ông» để chỉ người cai ngục; «giảng lời» phù hợp ngữ cảnh truyền đạt Tin Lành. Trật tự câu giữ khá sát nguyên văn nhưng vẫn tự nhiên trong tiếng Việt.
