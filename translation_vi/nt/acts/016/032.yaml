    issue: «giảng» diễn giải mạnh động từ ἐλάλησαν.
    rationale: λαλέω ở đây là «nói/truyền đạt»; dù nội dung là sứ điệp Cơ Đốc, nguyên văn không dùng động từ có sắc thái rao giảng hay công bố như κηρύσσω.
  - severity: medium
    issue: «cùng với tất cả những người ở trong nhà ông» có phạm vi cú pháp không rõ trong tiếng Việt.
    rationale: Cụm này có thể bị đọc là những người ấy cùng tham gia hành động nói với «Họ», trong khi σύν trong cấu trúc này nêu những người cùng với người cai ngục được nói cho nghe. Dùng «cho ông và cho...» làm rõ ý mà không thay đổi nghĩa.
  revised_text: Họ nói lời của Chúa[a] cho ông và cho tất cả những người trong nhà ông.[b]
