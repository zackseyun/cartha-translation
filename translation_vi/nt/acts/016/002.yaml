  yaml_path: translation/nt/acts/016/002.yaml
  text: He was well spoken of by the brothers in Lystra and Iconium[a].
translation:
  language: vi
  text: Ông được các anh em[a] tại Lý-xtơ và I-cô-ni làm chứng tốt về ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Các anh em” (Hy Lạp: ἀδελφῶν) trong ngữ cảnh này có thể chỉ chung những người cùng đức tin, gồm cả nam lẫn nữ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ông
  rationale: Đại từ quan hệ chỉ Ti-mô-thê ở câu trước; tách thành câu độc lập với “Ông” là tự nhiên trong tiếng Việt.
- source_word: ἐμαρτυρεῖτο
  choice: được ... làm chứng tốt
  rationale: Dạng bị động chưa hoàn thành diễn tả việc Ti-mô-thê nhận được lời chứng thuận lợi từ cộng đồng; cách dịch này giữ hình ảnh “làm chứng” của động từ và truyền đạt danh tiếng tốt.
- source_word: ὑπὸ
  choice: được ... làm chứng
  rationale: Ὑπό với sở hữu cách nêu tác nhân của động từ bị động; tiếng Việt thể hiện quan hệ này qua cấu trúc “được ... làm chứng”.
- source_word: τῶν ἐν Λύστροις καὶ Ἰκονίῳ
  choice: ở Lý-xtơ và I-cô-ni
  rationale: Cụm giới từ xác định các tín hữu thuộc hai cộng đồng tại những thành này.
- source_word: ἀδελφῶν
  choice: các anh chị em
  rationale: Trong ngữ cảnh cộng đồng Cơ Đốc ban đầu, số nhiều giống đực ἀδελφοί thường chỉ chung các tín hữu; “anh chị em” truyền đạt tự nhiên phạm vi bao hàm ấy, đồng thời chú thích bảo lưu hình thức sát chữ.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφῶν khi chỉ cộng đồng tín hữu
  choice: các anh chị em
  alternative: các anh em
  rationale: Dù hình thức Hy Lạp là số nhiều giống đực, trong cách xưng gọi cộng đồng, từ này có thể bao gồm cả nam lẫn nữ. Bản chính dùng cách diễn đạt tự nhiên và bao hàm trong tiếng Việt; chú thích nêu cách dịch sát hình thức.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng địa danh phiên âm quen thuộc; cấu trúc “làm chứng tốt” ưu tiên sự liên hệ với trường nghĩa μαρτυρέω hơn lối diễn ý hoàn toàn như “được tiếng tốt”.
