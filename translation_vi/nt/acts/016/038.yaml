translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được chia thành hai để tránh chuỗi mệnh đề nặng nề; chủ thể “các quan chức ấy” được lặp lại nhằm làm rõ chính họ là những người sợ hãi. Các chú thích bảo tồn sắc thái lịch sử-pháp lý mà không đưa cách diễn giải ấy hoàn toàn vào chính văn.
