  text: ⸀ἀπήγγειλαν δὲ τοῖς στρατηγοῖς οἱ ῥαβδοῦχοι τὰ ῥήματα ταῦτα· ⸂ἐφοβήθησαν δὲ⸃ ἀκούσαντες ὅτι Ῥωμαῖοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/038.yaml
  text: So the rod-bearers reported these words to the magistrates[a], and they were afraid when they heard that they were Romans[c][b],
translation:
  language: vi
  text: Những người mang gậy[a] báo lại những lời ấy cho các quan chức thành phố[b]. Các quan chức ấy sợ hãi khi nghe rằng họ là người La Mã[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những người mang gậy” là những người phục vụ hoặc thừa hành của các quan chức thành phố, theo truyền thống được gọi là lictor; họ mang gậy làm biểu tượng thẩm quyền.
    reason: cultural_note
  - marker: b
    text: Từ Hy Lạp chỉ các viên chức đứng đầu thành phố Phi-líp.
    reason: cultural_note
  - marker: c
    text: Hay “công dân La Mã.” Nguyên văn nói “người La Mã,” nhưng trong bối cảnh pháp lý, trọng tâm là địa vị công dân được luật La Mã bảo vệ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: thuật lại
  rationale: Động từ chỉ việc chuyển đạt một thông tin đã nhận; “thuật lại” tự nhiên trong tiếng Việt và phù hợp với việc các thuộc viên báo lại cho cấp trên.
- source_word: στρατηγοῖς
  choice: các quan chức thành phố
  rationale: Trong bối cảnh thuộc địa La Mã Phi-líp, từ này chỉ các viên chức lãnh đạo đô thị. Cách dịch này dễ hiểu hơn thuật ngữ chuyên biệt mà vẫn giữ đúng chức năng dân sự.
- source_word: ῥαβδοῦχοι
  choice: những người mang gậy
  rationale: Giữ hình ảnh cụ thể của từ Hy Lạp, vốn chỉ các thuộc viên mang bó gậy biểu trưng cho thẩm quyền của quan chức.
- source_word: τὰ ῥήματα ταῦτα
  choice: những lời ấy
  rationale: Dịch sát cụm từ Hy Lạp và quy chiếu tự nhiên đến lời nhắn ngay trước đó.
- source_word: ἐφοβήθησαν
  choice: sợ hãi
  rationale: Diễn đạt trực tiếp phản ứng sợ hãi của các quan chức, không gia tăng hay giảm nhẹ cường độ.
- source_word: ἀκούσαντες
  choice: khi nghe
  rationale: Thể hiện tự nhiên quan hệ thời gian và hàm ý nguyên nhân của phân từ Hy Lạp.
- source_word: Ῥωμαῖοί
  choice: người La Mã
  rationale: Giữ cách nói của nguyên văn; trong bối cảnh pháp lý, cụm từ này hàm ý họ có quyền công dân La Mã.
