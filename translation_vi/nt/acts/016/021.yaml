  text: καὶ καταγγέλλουσιν ἔθη ἃ οὐκ ἔξεστιν ἡμῖν παραδέχεσθαι οὐδὲ ποιεῖν Ῥωμαίοις οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/021.yaml
  text: and they are proclaiming customs that it is not lawful for us to accept or practice[a], since we are Romans.
translation:
  language: vi
  text: và họ truyền bá những phong tục mà chúng ta không được phép chấp nhận hoặc thực hành, vì chúng ta là người La Mã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “với tư cách là người La Mã” hoặc “trong thân phận người La Mã.” Cụm phân từ Hy Lạp nêu lý do mà những người cáo buộc viện ra để bác bỏ các phong tục này.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγγέλλουσιν
  choice: rao truyền
  rationale: Diễn đạt hành động công khai loan báo hoặc truyền bá trong lời cáo buộc, không diễn giải quá mức thành việc giảng dạy chính thức.
- source_word: ἔθη
  choice: những phong tục
  rationale: Chỉ các tập tục hoặc lối thực hành đã được xác lập; “phong tục” tự nhiên và phù hợp với bối cảnh dân sự-tôn giáo.
- source_word: οὐκ ἔξεστιν
  choice: không được phép
  rationale: Giữ ý về điều không được luật lệ hay trật tự xã hội cho phép, đồng thời tự nhiên hơn trong tiếng Việt hiện đại.
- source_word: παραδέχεσθαι
  choice: tiếp nhận
  rationale: Bao quát ý đón nhận hoặc chấp nhận các phong tục ấy là hợp lệ, mà không thu hẹp nghĩa thành việc hoàn toàn áp dụng.
- source_word: οὐδὲ ποιεῖν
  choice: hay thực hành
  rationale: Khi đi với “phong tục”, ποιεῖν mang nghĩa làm theo hoặc thực hành; cách dịch này tự nhiên trong tiếng Việt.
- source_word: Ῥωμαίοις οὖσιν
  choice: vì chúng ta là người La Mã
  rationale: Diễn đạt sắc thái nguyên nhân của cụm phân từ cách dữ, tức lý do mà những người cáo buộc viện ra.
- source_word: καὶ
  choice: và
  rationale: Giữ liên từ nối tiếp lời cáo buộc từ câu trước.
theological_decisions:
- issue: Tính chất của điều cấm trong lời cáo buộc
  choice: Dịch theo sắc thái pháp lý-dân sự là “chúng ta không được phép” nhưng không xác nhận lời cáo buộc ấy là đúng.
  alternative: “chúng ta không nên” hoặc “điều đó không đúng đối với chúng ta”
  rationale: Đây là lời cáo buộc được thuật lại, không phải lời khẳng định của tác giả rằng luật La Mã thật sự cấm các phong tục ấy.
- issue: Quan hệ của cụm Ῥωμαίοις οὖσιν với điều cấm
  choice: 'Dịch theo nghĩa nguyên nhân: “vì chúng ta là người La Mã”.'
  alternative: “khi là người La Mã” hoặc “với tư cách là người La Mã”
  rationale: Cụm phân từ nêu cơ sở mà bên cáo buộc viện dẫn, nhưng cấu trúc Hy Lạp cũng có thể được diễn đạt gần hình thức hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Rao truyền” giữ sắc thái công khai của lời cáo buộc; “không được phép” truyền đạt sắc thái pháp lý mà không khẳng định lời cáo buộc là đúng.
