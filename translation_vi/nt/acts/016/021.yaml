    rationale: “Tiếp nhận” có thể hiểu là nhận lấy/thâu nhận nói chung; “chấp nhận” tự nhiên hơn với “phong tục” và phản ánh sát ý accept/adopt trong lời cáo buộc.
  - severity: low
    issue: Cách dịch καταγγέλλουσιν là “rao truyền”
    rationale: Không sai, nhưng “truyền bá” là cách kết hợp tự nhiên hơn với tân ngữ “những phong tục” trong tiếng Việt hiện đại, đồng thời vẫn giữ ý công khai loan truyền.
  - severity: low
    issue: Chú thích thay thế “khi là người La Mã”
    rationale: Cụm này không tự nhiên trong tiếng Việt. Nên dùng một phương án thành ngữ hơn để phản ánh sắc thái phân từ “being/as Romans.”
