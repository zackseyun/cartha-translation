  rationale: 'Sửa tối thiểu nhằm tăng độ tự nhiên của tiếng Việt và sự tương ứng ngữ nghĩa: “truyền bá” phù hợp hơn với việc công bố các phong tục, và “chấp nhận” phù hợp hơn với παραδέχεσθαι. Câu vẫn trình bày đây là cơ sở do bên cáo buộc nêu ra, không biến lời cáo buộc thành khẳng định pháp lý của người kể chuyện.'
