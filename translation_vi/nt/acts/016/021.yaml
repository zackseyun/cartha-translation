  terminology: “Phong tục” phù hợp với ἔθη; “không được phép” bảo toàn sắc thái điều bị cho là không hợp pháp/không được cho phép mà không xác nhận tính đúng đắn của lời tố cáo. “Người La Mã” giữ đúng quy chiếu Ῥωμαίοις.
