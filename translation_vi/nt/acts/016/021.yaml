  source_fidelity: 'Bản dịch giữ đúng cấu trúc lời cáo buộc: họ đang công bố/truyền bá các phong tục; người tố cáo nói rằng họ không được phép chấp nhận hoặc thực hành các phong tục ấy vì là người La Mã. Tuy nhiên, “chấp nhận” phản ánh trực tiếp và tự nhiên hơn παραδέχεσθαι trong ngữ cảnh này so với “tiếp nhận.”'
