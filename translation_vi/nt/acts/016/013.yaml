    issue: “một con sông” thêm sắc thái bất định không cần thiết.
    rationale: παρὰ ποταμόν không buộc phải hiểu là “một con sông”; trong tiếng Việt, “bên sông” vừa tự nhiên vừa tránh áp đặt sắc thái của mạo từ/số từ.
  - severity: low
    issue: Cụm “nghĩ có một chỗ cầu nguyện” hơi khẩu ngữ và kém trôi chảy.
    rationale: “Cho là có một nơi cầu nguyện” diễn đạt rõ hơn cấu trúc ἐνομίζομεν ... εἶναι, vẫn giữ mức độ phỏng đoán của nguyên văn.
