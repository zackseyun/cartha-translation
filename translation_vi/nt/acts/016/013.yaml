  to: Vào ngày Sa-bát, chúng tôi đi ra ngoài cổng, đến bên sông, nơi chúng tôi cho là có một nơi cầu nguyện[a]. Chúng tôi ngồi xuống và nói chuyện với những phụ nữ đã tụ họp.
