language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: τῇ τε ἡμέρᾳ τῶν σαββάτων ἐξήλθομεν ἔξω τῆς ⸀πύλης παρὰ ποταμὸν οὗ ⸂ἐνομίζομεν προσευχὴν⸃ εἶναι, καὶ καθίσαντες ἐλαλοῦμεν ταῖς συνελθούσαις γυναιξίν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/013.yaml
  text: On the Sabbath day we went outside the gate beside the river[a], where we supposed there was a place of prayer, and after sitting down we were speaking to the women who had gathered there.
translation:
  language: vi
  text: Vào ngày Sa-bát, chúng tôi đi ra ngoài cổng, đến bên sông, nơi chúng tôi cho là có một nơi cầu nguyện[a]. Chúng tôi ngồi xuống và nói chuyện với những phụ nữ đã tụ họp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “nơi chúng tôi nghĩ có sự cầu nguyện.” Từ Hy Lạp có thể chỉ chính việc cầu nguyện hoặc một nơi dành riêng cho việc cầu nguyện; văn cảnh ở đây nghiêng về nghĩa “nơi cầu nguyện.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε ἡμέρᾳ τῶν σαββάτων
  choice: Vào ngày Sa-bát
  rationale: Cách diễn đạt Hy Lạp là một thành ngữ chỉ ngày Sa-bát; bản dịch này tự nhiên trong tiếng Việt và giữ đúng nghĩa.
- source_word: ἐξήλθομεν ἔξω τῆς πύλης
  choice: chúng tôi đi ra ngoài cổng
  rationale: Diễn đạt rõ chuyển động ra phía ngoài mà không thêm từ “thành”, vốn chỉ được ngụ ý chứ không có trong nguyên văn.
- source_word: παρὰ ποταμόν
  choice: đến bên một con sông
  rationale: παρά với đối cách trong ngữ cảnh chuyển động chỉ đích đến ở cạnh sông. Mạo từ không xuất hiện trong tiếng Hy Lạp, nên “một con sông” phù hợp tự nhiên trong tiếng Việt.
- source_word: οὗ ἐνομίζομεν προσευχὴν εἶναι
  choice: nơi chúng tôi nghĩ có một chỗ cầu nguyện
  rationale: νομίζω mang nghĩa nghĩ hoặc cho rằng; προσευχή có thể chỉ sự cầu nguyện hoặc một địa điểm dành cho việc cầu nguyện. Ngữ cảnh địa lý và cuộc tụ họp nghiêng về nghĩa địa điểm.
- source_word: καὶ καθίσαντες
  choice: Chúng tôi ngồi xuống và
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. Tách thành mệnh đề nối tiếp giúp câu tiếng Việt sáng rõ mà vẫn giữ trình tự hành động.
- source_word: ἐλαλοῦμεν
  choice: nói chuyện
  rationale: Thì chưa hoàn thành diễn tả hoạt động đang tiếp diễn. Trong mạch kể này, “nói chuyện” tự nhiên và không hàm ý một bài diễn thuyết trang trọng.
- source_word: ταῖς συνελθούσαις γυναιξίν
  choice: với những phụ nữ đã tụ họp tại đó
  rationale: Phân từ συνελθούσαις chỉ những người phụ nữ đã đến tụ họp trước khi cuộc trò chuyện diễn ra; “tại đó” làm rõ địa điểm đã nêu trong văn cảnh.
theological_decisions:
- issue: Nghĩa của προσευχή trong bối cảnh này
  choice: một chỗ cầu nguyện
  alternative: sự cầu nguyện; nhà hội
  rationale: Từ này có thể chỉ chính việc cầu nguyện hoặc nơi dành cho cầu nguyện. Bối cảnh nói đến một địa điểm bên sông nơi người ta tụ họp nên nghĩa địa điểm có khả năng cao hơn; tuy nhiên, không dịch thành “nhà hội” vì nguyên văn không dùng từ đó. Chú thích giữ lại khả năng nghĩa trừu tượng.
translation_notes:
  register: Tiếng Việt phổ thông hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Sa-bát” là dạng quen thuộc trong văn phong Kinh Thánh; tránh thêm “thành” hoặc diễn giải προσευχή thành “nhà hội”.
