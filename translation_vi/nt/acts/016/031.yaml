- from: 'Họ đáp: “Hãy tin vào Chúa Giê-su[a], thì ông sẽ được cứu—ông và cả gia đình ông[b].”'
  to: 'Họ đáp: “Hãy tin vào Chúa Giê-su[a], thì ông sẽ được cứu—ông và người nhà ông[b].”'
  rationale: Sửa “gia đình ông” thành “người nhà ông” để phản ánh οἶκος như một hộ nhà mà không áp đặt phạm vi quan hệ gia đình. Bỏ “cả” để không thêm sắc thái nhấn mạnh. Dời chức năng của chú thích a để nó được hiểu là áp dụng cho cụm động từ và giới từ liên quan đến đức tin; cách đặt chỉ dấu sau “Chúa Giê-su” vẫn neo cho toàn bộ cụm “tin vào Chúa Giê-su”.
  reviewer_model: gpt-5.6-terra
