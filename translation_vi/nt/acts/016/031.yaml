base_translation:
  language: en
  yaml_path: translation/nt/acts/016/031.yaml
  text: And they said[a], “Believe in the Lord Jesus[b], and you will be saved—you and your household.”
translation:
  language: vi
  text: 'Họ đáp: “Hãy tin vào Chúa Giê-su[a], thì ông sẽ được cứu—ông và người nhà ông[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hãy đặt lòng tin nơi Chúa Giê-su.”'
    reason: lexical_alternative
  - marker: b
    text: “Người nhà ông” chỉ những người thuộc hộ nhà ông, chứ không phải tòa nhà.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Họ đáp
  rationale: Trong mạch đối thoại, δέ là từ nối nhẹ và εἶπαν giới thiệu lời trả lời; “Họ đáp” tự nhiên hơn trong tiếng Việt mà không tạo sắc thái tương phản quá mạnh.
- source_word: Πίστευσον ἐπὶ τὸν
  choice: Hãy tin vào
  rationale: Mệnh lệnh aorist kêu gọi một sự đáp ứng dứt khoát; ἐπί với đối cách chỉ đối tượng mà đức tin hướng đến. “Tin vào” là cách nói tự nhiên, rõ nghĩa trong tiếng Việt hiện đại.
- source_word: κύριον Ἰησοῦν
  choice: Chúa Giê-su
  rationale: “Chúa” giữ được cả sắc thái tôn kính lẫn sức nặng thần học của κύριος; tên Ἰησοῦς được phiên âm theo quy ước tiếng Việt.
- source_word: σωθήσῃ
  choice: sẽ được cứu
  rationale: Giữ thể tương lai bị động của động từ σῴζω và không thu hẹp ý nghĩa vào sự giải cứu khỏi nguy hiểm trước mắt.
- source_word: σὺ καὶ ὁ οἶκός σου
  choice: ông và cả gia đình ông
  rationale: οἶκος ở đây chỉ những người thuộc nhà của viên cai ngục, không chỉ một tòa nhà. “Gia đình” là cách diễn đạt thông dụng; “cả” làm rõ phạm vi bao gồm nhưng không giải thích cơ chế họ được cứu.
theological_decisions:
- issue: Phạm vi lời hứa dành cho “ông và cả gia đình ông”
  choice: Giữ cấu trúc lời hứa bao gồm cả viên cai ngục lẫn gia đình ông, không thêm lời giải thích rằng gia đình tự động được cứu nhờ đức tin của riêng ông.
  alternative: Diễn đạt theo hướng mỗi người trong gia đình phải tin, hoặc theo hướng cả gia đình được cứu chỉ nhờ đức tin của người chủ hộ.
  rationale: Câu Hy Lạp bao gồm viên cai ngục và οἶκός của ông trong lời hứa, nhưng riêng câu này không xác định cơ chế hay điều kiện áp dụng cho từng thành viên. Dấu gạch ngang giữ được lực nhấn của “σὺ καὶ” và để ngỏ sự căng thẳng diễn giải.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phù hợp với cách các sứ đồ nói trực tiếp với viên cai ngục; cấu trúc gạch ngang gần với trật tự nhấn mạnh của nguyên văn.
