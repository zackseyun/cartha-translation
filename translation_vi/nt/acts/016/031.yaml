    rationale: οἶκος ở đây nói về household/hộ nhà, có thể bao gồm những người thuộc nhà chứ không chỉ gia đình theo quan hệ huyết thống. “Người nhà ông” giữ phạm vi mở hơn và tự nhiên trong tiếng Việt.
  - severity: low
    issue: Từ “cả” thêm sắc thái nhấn mạnh
    rationale: Cụm σὺ καὶ ὁ οἶκός σου là “ông và người nhà ông”; “cả” không cần thiết và có thể khiến lời hứa nghe bao quát hơn mức cách diễn đạt trực tiếp của nguyên văn.
  - severity: low
    issue: Vị trí neo chú thích a chưa khớp nội dung chú thích
    rationale: Chú thích a giải thích cách dịch Πίστευσον ἐπὶ τὸν, không phải riêng tên “Giê-su”; nên đặt dấu chú thích sau toàn bộ cụm “tin vào Chúa Giê-su”.
