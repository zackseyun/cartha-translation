review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng mệnh lệnh Πίστευσον, đối tượng đức tin (“Chúa Giê-su”), lời hứa tương lai bị động (“sẽ được cứu”), và cấu trúc bao gồm “ông và … ông”. Tuy nhiên, “gia đình” có thể thu hẹp οἶκος vào quan hệ gia đình, trong khi từ này chỉ đơn vị hộ nhà rộng hơn; “cả” cũng thêm một sắc thái bao quát/nhấn mạnh không được đánh dấu riêng trong nguyên văn.
  naturalness: Câu văn trang trọng, hiện đại và dễ đọc. “Họ đáp” và cách xưng hô “ông” hợp ngữ cảnh. “Người nhà ông” là cách nói tự nhiên, đồng thời chính xác hơn “gia đình ông” trong ngữ cảnh này.
  terminology: “Chúa Giê-su” và “được cứu” là các tương đương phù hợp cho κύριον Ἰησοῦν và σωθήσῃ. Nên đặt chú thích từ vựng về “tin vào/đặt lòng tin nơi” ngay sau cụm “tin vào Chúa Giê-su”, thay vì neo riêng ở tên Giê-su.
  issues:
