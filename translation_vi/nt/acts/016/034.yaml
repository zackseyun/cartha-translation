source:
  edition: SBLGNT
  text: ἀναγαγών τε αὐτοὺς εἰς τὸν ⸀οἶκον παρέθηκεν τράπεζαν καὶ ⸀ἠγαλλιάσατο πανοικεὶ πεπιστευκὼς τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/034.yaml
  text: And after bringing them up into the house[a], he set a meal before them and rejoiced greatly with his whole household[b], having believed in God.
translation:
  language: vi
  text: Rồi ông đưa họ lên nhà mình[a], dọn bữa ăn cho họ và cùng cả nhà vui mừng khôn xiết[b], vì ông đã tin Đức Chúa Trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cụm từ này cho thấy ông đưa họ từ khu vực nhà giam lên phần nhà ở.
    reason: clarification
  - marker: b
    text: Tiếng Hy Lạp cũng có thể được hiểu là nhấn mạnh rằng cả nhà đều dự phần trong niềm vui; một số người còn hiểu câu này hàm ý cả gia đình cũng cùng tin.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγαγών
  choice: đưa họ lên
  rationale: Phân từ bất định của ἀνάγω diễn tả việc đưa Phao-lô và Si-la từ ngục lên nhà; cách dịch này giữ rõ hướng chuyển động và trình tự hành động.
- source_word: οἶκον
  choice: nhà
  rationale: Trong ngữ cảnh, danh từ có mạo từ chỉ ngôi nhà của viên cai ngục. Tiếng Việt không cần thêm đại từ sở hữu vì ngữ cảnh đã rõ.
- source_word: παρέθηκεν τράπεζαν
  choice: dọn bữa ăn cho họ
  rationale: Thành ngữ Hy Lạp theo nghĩa đen là đặt bàn trước mặt ai, nhưng trong ngữ cảnh có nghĩa là khoản đãi, cung cấp một bữa ăn. Cách dịch này tự nhiên và giữ đúng ý hiếu khách.
- source_word: ἠγαλλιάσατο
  choice: vui mừng khôn xiết
  rationale: Động từ diễn tả niềm vui mãnh liệt, hân hoan; cách nói này trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại.
- source_word: πανοικεὶ
  choice: cùng cả gia đình
  rationale: Trạng từ chỉ sự tham dự của toàn thể những người trong nhà. “Gia đình” tự nhiên trong tiếng Việt, dù phạm vi từ Hy Lạp có thể rộng hơn gia đình hạt nhân.
- source_word: πεπιστευκὼς τῷ θεῷ
  choice: vì đã tin Đức Chúa Trời
  rationale: Phân từ hoàn thành giống đực số ít trực tiếp quy về viên cai ngục và diễn tả hành động tin với kết quả còn tiếp diễn. “Vì” thể hiện hợp lý quan hệ hoàn cảnh/nguyên nhân với sự vui mừng, dù câu Hy Lạp dùng phân từ.
theological_decisions:
- issue: Phạm vi của việc vui mừng và tin liên quan đến cả gia đình
  choice: Bản văn chính nói viên cai ngục cùng cả gia đình vui mừng, còn phân từ số ít “đã tin” trực tiếp quy về ông.
  alternative: Có thể hiểu cả gia đình cùng vui mừng vì mọi người đều đã tin, hoặc ông vui mừng vì cả gia đình đã tin.
  rationale: πανοικεὶ rõ ràng có thể bổ nghĩa cho hành động vui mừng, trong khi πεπιστευκώς ở giống đực số ít phù hợp trực tiếp với viên cai ngục. Bản dịch không khẳng định quá mức rằng câu này tự nó nói rõ mọi người trong nhà đều tin, nhưng chú thích giữ lại khả năng diễn giải rộng hơn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” cho θεός trong ngữ cảnh chỉ Đức Chúa Trời của sứ điệp Cơ Đốc. Cấu trúc câu giữ trình tự hành động của nguyên văn và dùng chú thích để bảo tồn sự mơ hồ về phạm vi đức tin của cả gia đình.
