source:
  edition: SBLGNT
  text: ἐλθόντες ⸀δὲ κατὰ τὴν Μυσίαν ἐπείραζον ⸀εἰς τὴν Βιθυνίαν ⸀πορευθῆναι καὶ οὐκ εἴασεν αὐτοὺς τὸ πνεῦμα ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/007.yaml
  text: But when they came to Mysia[a], they were trying to go into Bithynia, and the Spirit of Jesus did not permit them.
translation:
  language: vi
  text: Nhưng khi đến gần My-si-a[a], họ đang tìm cách đi vào Bi-thi-ni-a, nhưng Thần Khí của Giê-su không cho phép họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến sát My-si-a” hoặc “đi dọc theo My-si-a”. Cụm từ Hy Lạp có lẽ chỉ việc họ đến khu vực giáp ranh My-si-a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: khi đến
  rationale: Phân từ bất định mang ý nghĩa thời gian trong mạch kể; “khi đến” diễn đạt tự nhiên và giữ đúng trình tự sự việc.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển nhẹ, đồng thời dẫn vào sự tương phản với việc họ bị ngăn cản.
- source_word: κατὰ τὴν Μυσίαν
  choice: đến gần vùng My-si-a
  rationale: κατά với đối cách trong mô tả địa lý có thể chỉ vị trí dọc theo, gần hoặc đối diện một vùng. Trong ngữ cảnh, cụm này có lẽ nói đến việc họ tới khu vực giáp My-si-a; cách dịch chính tự nhiên nhưng giữ chú thích về các khả năng khác.
- source_word: ἐπείραζον
  choice: họ tìm cách
  rationale: Thì chưa hoàn thành diễn tả một nỗ lực đang được tiến hành; “tìm cách” thể hiện ý định có hành động mà không hàm ý họ đã thành công.
- source_word: εἰς τὴν Βιθυνίαν πορευθῆναι
  choice: đi vào vùng Bi-thy-ni-a
  rationale: εἰς diễn tả chuyển động vào trong vùng, còn πορευθῆναι chỉ việc đi hoặc hành trình.
- source_word: οὐκ εἴασεν
  choice: không cho phép
  rationale: Diễn đạt đúng nghĩa của ἐάω là cho phép; không dùng “cấm” vì từ đó có thể mạnh hơn nguyên văn.
- source_word: τὸ πνεῦμα Ἰησοῦ
  choice: Thánh Linh của Đức Chúa Jêsus
  rationale: Giữ nguyên thành tố “của Đức Chúa Jêsus” trong cụm Hy Lạp khác thường, thay vì đồng hóa thành “Đức Thánh Linh”; “Thánh Linh” là cách gọi tự nhiên và trang trọng trong tiếng Việt Cơ Đốc.
theological_decisions:
- issue: Cách dịch cụm Kitô học τὸ πνεῦμα Ἰησοῦ
  choice: Thánh Linh của Đức Chúa Jêsus
  alternative: Đức Thánh Linh; Thánh Linh
  rationale: Nguyên văn nêu rõ “của Jêsus”, vì vậy cần bảo tồn cách diễn đạt này và sắc thái Kitô học của câu, không âm thầm hài hòa với những cách gọi quen thuộc hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “vùng” trước các địa danh cổ để người đọc nhận ra đây là các khu vực địa lý. Lặp “nhưng” phản ánh cả bước chuyển ở δέ và sự cản trở ở mệnh đề cuối, dù có thể giản lược lần thứ hai trong một bản dịch thiên về sự gọn nhẹ.
