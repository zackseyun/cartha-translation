  terminology: “làm phép cắt bì,” “người Do Thái,” “người Hy Lạp,” cùng cách viết tên Phao-lô và Ti-mô-thê đều phù hợp. “Người Hy Lạp” giữ nghĩa trực tiếp của Ἕλλην; chú thích c thích đáng nêu khả năng hàm ý không phải người Do Thái mà không thay thế nghĩa chính văn.
