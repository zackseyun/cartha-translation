  text: τοῦτον ἠθέλησεν ὁ Παῦλος σὺν αὐτῷ ἐξελθεῖν, καὶ λαβὼν περιέτεμεν αὐτὸν διὰ τοὺς Ἰουδαίους τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις, ᾔδεισαν γὰρ ἅπαντες ⸂ὅτι Ἕλλην ὁ πατὴρ αὐτοῦ⸃ ὑπῆρχεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/003.yaml
  text: Paul wanted him to go out with him[a], and after taking him, he circumcised him because of the Jews who were in those places[c][b], for they all knew that his father was a Greek.
translation:
  language: vi
  text: Phao-lô muốn Ti-mô-thê cùng ông lên đường[a]. Ông đem Ti-mô-thê đi làm phép cắt bì vì những người Do Thái ở các nơi ấy[b], bởi tất cả họ đều biết cha của Ti-mô-thê là người Hy Lạp[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “đi ra cùng ông”; trong văn cảnh này, cách nói ấy có thể chỉ việc cùng lên đường hoặc cùng đi.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “do những người Do Thái” hoặc “vì cớ những người Do Thái.”'
    reason: lexical_alternative
  - marker: c
    text: 'Nguyên văn: “một người Hy Lạp”; trong bối cảnh này, cách gọi ấy có lẽ cho biết cha của Ti-mô-thê không phải là người Do Thái.'
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτον
  choice: Ti-mô-thê
  rationale: Đại từ chỉ định ở đầu câu quy chiếu về Ti-mô-thê trong văn cảnh trước; nêu tên giúp câu tiếng Việt rõ và tự nhiên mà không đổi đối tượng quy chiếu.
- source_word: ἠθέλησεν
  choice: muốn
  rationale: Diễn đạt trực tiếp ý muốn hoặc ý định của Phao-lô, không cường điệu thành một quyết định mang tính bắt buộc.
- source_word: σὺν αὐτῷ ἐξελθεῖν
  choice: cùng mình lên đường
  rationale: ἐξέρχομαι có nghĩa đen là đi ra, nhưng trong văn cảnh này chỉ việc khởi hành cùng Phao-lô; “lên đường” là cách nói tự nhiên và giữ được sắc thái hành trình.
- source_word: λαβὼν περιέτεμεν αὐτόν
  choice: Ông đem Ti-mô-thê đi làm phép cắt bì
  rationale: Phân từ aorist λαβών đứng trước động từ chính và biểu thị hành động dẫn đến việc cắt bì. Cách diễn đạt này tự nhiên trong tiếng Việt và không nhất thiết hàm ý Phao-lô tự tay thực hiện thủ thuật.
- source_word: διὰ τοὺς Ἰουδαίους
  choice: vì những người Do Thái
  rationale: διά với đối cách nêu lý do hoặc động cơ; “vì” giữ được độ mở giữa “do” và “vì lợi ích của” mà không áp đặt ý nghĩa hòa giải.
- source_word: τοὺς ὄντας ἐν τοῖς τόποις ἐκείνοις
  choice: ở các nơi ấy
  rationale: Theo sát cụm chỉ địa điểm, đồng thời diễn đạt gọn và tự nhiên trong tiếng Việt.
- source_word: ᾔδεισαν γὰρ ἅπαντες
  choice: bởi tất cả họ đều biết
  rationale: “bởi” thể hiện chức năng giải thích của γάρ; “tất cả họ đều” giữ sự nhấn mạnh của ἅπαντες và quy chiếu về những người Do Thái vừa nhắc đến.
- source_word: Ἕλλην
  choice: người Hy Lạp
  rationale: Giữ nghĩa trực tiếp của Ἕλλην; trong bối cảnh Do Thái, từ này đồng thời có thể cho thấy người cha không phải là người Do Thái, nhưng không nên dịch thẳng thành “dân ngoại” trong chính văn.
- source_word: ὁ πατὴρ αὐτοῦ ὑπῆρχεν
  choice: cha của Ti-mô-thê là
  rationale: ὑπάρχω ở đây được diễn đạt tự nhiên bằng “là”; lặp tên Ti-mô-thê tránh chuỗi đại từ mơ hồ trong tiếng Việt.
theological_decisions:
- issue: Lý do Ti-mô-thê chịu cắt bì và mối liên hệ với mối quan tâm của người Do Thái
  choice: 'Giữ nguyên lý do do câu văn nêu: Phao-lô hành động vì những người Do Thái địa phương đều biết cha Ti-mô-thê là người Hy Lạp.'
  alternative: Hiểu hành động này là sự khẳng định cắt bì cần thiết về mặt cứu rỗi, hoặc xác định dứt khoát rằng đây chỉ là một chiến thuật truyền giáo.
  rationale: Bản văn chỉ nêu động cơ gắn với hoàn cảnh địa phương và lai lịch người cha. Bản dịch không nên tự thêm một kết luận tín lý, nhờ đó giữ nguyên sự căng thẳng thần học với các phân đoạn Tân Ước khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “làm phép cắt bì” theo cách nói tiếng Việt thông dụng; nêu lại tên Ti-mô-thê để tránh đại từ mơ hồ. Các dấu chú thích [a], [b], [c] đều xuất hiện trong chính văn và đặt ngay sau nội dung liên quan.
