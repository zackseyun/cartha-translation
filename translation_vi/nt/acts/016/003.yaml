  source_fidelity: 'Bản dịch chuyển tải đúng các thành phần chính: Phao-lô muốn Ti-mô-thê cùng đi; Ti-mô-thê được cắt bì vì những người Do Thái tại các địa phương ấy; và động cơ được giải thích bởi việc họ đều biết cha ông là người Hy Lạp. Tuy nhiên, “cùng mình” ít tự nhiên trong lời trần thuật ngôi ba; “cùng ông” thể hiện rõ đại từ αὐτῷ quy chiếu về Phao-lô. Chú thích a không nên thêm khả năng “cùng đi truyền giáo”, vì động từ chỉ sự ra đi/khởi hành chứ không xác định mục đích truyền giáo.'
