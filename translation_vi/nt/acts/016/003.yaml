  to: Phao-lô muốn Ti-mô-thê cùng ông lên đường[a]. Ông đem Ti-mô-thê đi làm phép cắt bì vì những người Do Thái ở các nơi ấy[b], bởi tất cả họ đều biết cha của Ti-mô-thê là người Hy Lạp[c].
