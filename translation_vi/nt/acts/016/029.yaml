revisions:
- from: Viên cai ngục sai lấy đèn rồi lao vào. Ông run rẩy, sấp mình xuống trước Phao-lô và Si-la.[a]
  to: Viên cai ngục xin đèn rồi lao vào. Ông run rẩy vì sợ, ngã xuống trước Phao-lô và Si-la.[a]
  rationale: 'Bản sửa giữ trình tự hành động của nguyên văn: xin đèn, lao vào, rồi trong trạng thái run sợ ngã xuống trước Phao-lô và Si-la. Nó tránh diễn giải “xin” thành “sai người lấy” và tránh xác định tư thế “sấp mình” quá cụ thể, đồng thời giữ chú thích để không gán ý nghĩa thờ phượng cho cử chỉ này.'
  reviewer_model: gpt-5.6-terra
