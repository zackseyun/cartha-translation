lexical_decisions:
- source_word: αἰτήσας
  choice: sai lấy
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính. Trong bối cảnh một viên cai ngục yêu cầu người khác mang nguồn sáng đến, “sai lấy” tự nhiên và giữ đúng trình tự.
- source_word: δὲ
  choice: rồi
  rationale: δέ ở đây chủ yếu nối tiếp diễn biến câu chuyện, không biểu thị sự tương phản mạnh; “rồi” diễn đạt mạch kể tự nhiên trong tiếng Việt.
- source_word: φῶτα
  choice: đèn
  rationale: Danh từ số nhiều chỉ các nguồn chiếu sáng. Tiếng Việt thường dùng danh từ loại theo nghĩa tập hợp sau “lấy”; “đèn” không xác định quá mức là đuốc hay loại đèn cụ thể nào.
- source_word: εἰσεπήδησεν
  choice: lao vào
  rationale: Động từ diễn tả chuyển động đột ngột, mạnh và hướng vào bên trong. “Lao vào” vừa tự nhiên vừa truyền đạt tính khẩn cấp.
- source_word: ἔντρομος γενόμενος
  choice: run rẩy
  rationale: Cụm từ mô tả người cai ngục ở trong trạng thái sợ hãi đến run rẩy. “Run rẩy” giữ hình ảnh thể chất; ngữ cảnh cho thấy nguyên nhân là nỗi sợ mà không cần thêm lời giải thích vào chính văn.
- source_word: προσέπεσεν
  choice: sấp mình xuống trước
  rationale: Động từ chỉ hành động ngã hoặc phủ phục trước một người. “Sấp mình xuống trước” diễn tả tư thế khẩn thiết và kính sợ nhưng không mặc nhiên quy hành động ấy là thờ phượng.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: trước Phao-lô và Si-la
  rationale: Các tặng cách phụ thuộc vào προσέπεσεν được diễn đạt tự nhiên bằng “trước”; không thêm chi tiết “dưới chân” vốn không có trong nguyên văn.
theological_decisions:
- issue: Bản chất cử chỉ của viên cai ngục đối với Phao-lô và Si-la
  choice: Diễn tả một hành động phủ phục vì sợ hãi và khẩn thiết, không gọi đó là thờ lạy.
  alternative: Ông thờ lạy Phao-lô và Si-la.
  rationale: προσπίπτω có thể chỉ việc ngã hoặc phủ phục trước ai đó vì kính sợ, cầu xin hay hoảng hốt; bản thân động từ không bắt buộc mang nghĩa thờ phượng. Bản dịch giữ nguyên hành động mà không thêm một kết luận thần học.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Tách thành hai câu để câu tiếng Việt sáng rõ mà vẫn giữ đúng thứ tự hành động trong nguyên văn; dùng “viên cai ngục” để làm rõ chủ thể vốn được xác định từ văn cảnh.
