  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ διεπορεύοντο τὰς πόλεις, ⸀παρεδίδοσαν αὐτοῖς φυλάσσειν τὰ δόγματα τὰ κεκριμένα ὑπὸ τῶν ἀποστόλων ⸀καὶ πρεσβυτέρων τῶν ἐν ⸀Ἱεροσολύμοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/004.yaml
  text: As they went through the cities[a], they delivered to them for observance the decrees that had been decided by the apostles and elders in Jerusalem.
translation:
  language: vi
  text: Khi đi qua các thành, họ trao cho họ để họ tuân giữ các quyết định[a] đã được các sứ đồ và các trưởng lão ở Giê-ru-sa-lem định ra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “các sắc lệnh”; từ Hy Lạp chỉ các quyết định hoặc phán quyết chính thức.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύοντο
  choice: đi qua
  rationale: Thì chưa hoàn thành diễn tả hành trình đang tiếp diễn qua nhiều thành; “đi qua” tự nhiên và không xác định quá mức lộ trình.
- source_word: παρεδίδοσαν
  choice: truyền lại
  rationale: Động từ chỉ việc trao truyền những quyết định có thẩm quyền; “truyền lại” giữ được ý chuyển giao mà vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτοῖς
  choice: cho những người ở đó
  rationale: Đại từ chỉ những người tại các thành vừa được nhắc đến. Cách dịch này làm rõ tối thiểu để câu tiếng Việt không mơ hồ khó hiểu, nhưng không xác định họ là “các tín hữu” hay “các hội thánh” khi nguyên văn không nêu danh từ.
- source_word: φυλάσσειν
  choice: để tuân giữ
  rationale: Trong ngữ cảnh này, φυλάσσω mang nghĩa giữ và thực hành cẩn thận, không chỉ bảo quản; “tuân giữ” diễn đạt cả sự vâng theo lẫn duy trì thực hiện.
- source_word: δόγματα
  choice: các quyết định
  rationale: Từ này nói đến các phán quyết chính thức của hội nghị tại Giê-ru-sa-lem. “Các quyết định” truyền đạt rõ nghĩa hành chính và tránh sắc thái giáo điều hậu kỳ; chú thích nêu phương án nhấn mạnh thẩm quyền hơn.
- source_word: κεκριμένα
  choice: đã thông qua
  rationale: Phân từ hoàn thành bị động chỉ những quyết định đã được định đoạt và còn hiệu lực. Trong tiếng Việt, “đã thông qua” phù hợp tự nhiên với quyết định của một tập thể.
- source_word: ἀποστόλων καὶ πρεσβυτέρων
  choice: các sứ đồ và các trưởng lão
  rationale: Đây là các cách gọi chuẩn, dễ hiểu đối với những người được sai phái và các lãnh đạo được công nhận trong bối cảnh sách Công Vụ.
- source_word: τῶν ἐν Ἱεροσολύμοις
  choice: tại Giê-ru-sa-lem
  rationale: Cụm giới từ bổ nghĩa cho cả các sứ đồ lẫn các trưởng lão và xác định địa điểm của họ.
- source_word: ὡς δὲ
  choice: Khi
  rationale: Diễn đạt quan hệ thời gian và sự chuyển tiếp trong trình thuật một cách tự nhiên, không thêm sức nặng liên từ không cần thiết.
theological_decisions:
- issue: Thẩm quyền của các phán quyết tại Giê-ru-sa-lem
  choice: Dịch δόγματα là “các quyết định”, kèm chú thích “các sắc lệnh”
  alternative: Dịch trực tiếp là “các sắc lệnh”
  rationale: “Các quyết định” phù hợp tiếng Việt hiện đại và chỉ các phán quyết tập thể trong Công Vụ 15, còn chú thích bảo lưu sắc thái chính thức, có thẩm quyền của từ Hy Lạp mà không gợi khái niệm giáo điều của các thời kỳ sau.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Giê-ru-sa-lem”, “sứ đồ”, “trưởng lão” theo cách gọi Kinh Thánh quen thuộc; cấu trúc câu bám sát tiến trình của nguyên văn nhưng tránh lối hành văn hành chính nặng nề.
