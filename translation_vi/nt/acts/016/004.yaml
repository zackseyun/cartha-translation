revisions:
- from: Khi đi qua các thành, họ truyền lại cho những người ở đó để tuân giữ các quyết định[a] mà các sứ đồ và các trưởng lão tại Giê-ru-sa-lem đã thông qua.
  to: Khi đi qua các thành, họ trao cho họ để họ tuân giữ các quyết định[a] đã được các sứ đồ và các trưởng lão ở Giê-ru-sa-lem định ra.
  rationale: Bản sửa giữ nguyên sự mơ hồ có chủ ý của αὐτοῖς bằng “họ,” dùng “định ra” để phản ánh κεκρμένα mà không gợi một thủ tục nghị viện cụ thể, và rút gọn chú thích để chỉ nêu phương án từ vựng cùng sắc thái chính thức của δόγματα. Cấu trúc “trao cho họ để họ tuân giữ” diễn đạt rõ chức năng của việc truyền đạt các quyết định trong tiếng Việt hiện đại.
  reviewer_model: gpt-5.6-terra
