review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng diễn tiến chính: đi qua các thành, trao các quy định để tuân giữ, và nguồn của chúng là các sứ đồ cùng trưởng lão ở Giê-ru-sa-lem. Tuy nhiên, “cho những người ở đó” thêm một danh từ chỉ người không có trong nguyên văn; còn “đã thông qua” có thể gợi thủ tục biểu quyết/phê chuẩn, hẹp hơn κεκρμένα (“đã được quyết định/định ra”).'
  naturalness: Câu hiện có dễ hiểu nhưng cụm “truyền lại cho những người ở đó để tuân giữ” hơi nặng và không cần thiết. “Trao cho họ để họ tuân giữ” tự nhiên, rõ chức năng của hai lần αὐτοῖς, và vẫn giữ tính pronominal của bản gốc.
  terminology: “Sứ đồ,” “trưởng lão,” và “Giê-ru-sa-lem” phù hợp cách dùng Kinh Thánh Việt ngữ hiện đại. “Các quyết định” là lựa chọn an toàn cho δόγματα. Chú thích hiện tại không nên khẳng định cụ thể rằng các phán quyết được “ban hành bởi hội nghị,” vì câu này chỉ nêu các sứ đồ và trưởng lão, dù bối cảnh trước đó có cuộc họp tại Giê-ru-sa-lem.
  issues:
  - severity: low
    issue: “cho những người ở đó” diễn giải αὐτοῖς
    rationale: Nguyên văn chỉ dùng đại từ “cho họ.” Việc thêm “những người” không cần thiết và bản thân phần lý do của bản nháp cũng chủ trương không xác định đối tượng là tín hữu hay hội thánh.
  - severity: medium
    issue: “đã thông qua” chưa sát sắc thái κεκρμένα
    rationale: Phân từ hoàn thành bị động của κρίνω nghĩa là “đã được quyết định/định ra.” “Thông qua” thường hàm ý một quy trình bỏ phiếu hoặc phê chuẩn và có thể không diễn tả trực tiếp hành động quyết định.
  - severity: low
    issue: Chú thích thêm chi tiết “hội nghị tại Giê-ru-sa-lem”
    rationale: Đây là thông tin bối cảnh của Công Vụ 15, nhưng không được nêu trong chính câu này. Chú thích từ vựng nên giữ ở mức giải thích sắc thái của δόγματα, không mở rộng chủ thể ban hành.
  revised_text: Khi đi qua các thành, họ trao cho họ để họ tuân giữ các quyết định[a] đã được các sứ đồ và các trưởng lão ở Giê-ru-sa-lem định ra.
