  to: Họ đến, nài xin hai ông, rồi đưa hai ông ra và yêu cầu hai ông rời khỏi thành.[a][b]
  rationale: Thay “giảng hòa với” bằng “nài xin” để dịch sát hơn παρεκάλεσαν như một lời khẩn khoản có tính xoa dịu hướng đến Phao-lô và Si-la. Dùng “yêu cầu” cho ἠρώτων để phân biệt với động từ trước, đồng thời sửa chú thích b cho khớp với bản văn. Hai mỏ chú thích được đặt cuối câu vì cùng áp dụng cho các từ trong câu và không có yêu cầu cấu trúc buộc phải đặt ngay sau từng từ.
