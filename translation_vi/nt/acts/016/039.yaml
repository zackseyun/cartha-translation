base_translation:
  language: en
  yaml_path: translation/nt/acts/016/039.yaml
  text: And they came and appealed to them[a], and after leading them out[b], they asked them to leave the city.
translation:
  language: vi
  text: Họ đến, nài xin hai ông, rồi đưa hai ông ra và yêu cầu hai ông rời khỏi thành.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “khẩn khoản với hai ông” hoặc “van xin hai ông.” Động từ Hy Lạp còn có thể mang nghĩa “an ủi” trong những văn cảnh khác, nhưng ở đây có lẽ chỉ hành động xoa dịu và khẩn khoản của các quan chức sau khi họ ngược đãi Phao-lô và Si-la.
    reason: lexical_alternative
  - marker: b
    text: Động từ “yêu cầu” ở thì chưa hoàn thành trong tiếng Hy Lạp, có thể hàm ý họ liên tục hoặc nhiều lần yêu cầu hai ông rời khỏi thành.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: Họ đến
  rationale: Phân từ bất định quá khứ của ἔρχομαι mở đầu chuỗi hành động; cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng trình tự.
- source_word: παρεκάλεσαν
  choice: giảng hòa với
  rationale: Trong bối cảnh các quan chức vừa ngược đãi và giam giữ Phao-lô cùng Si-la trái phép, παρακαλέω mang sắc thái xoa dịu, cầu hòa hơn là an ủi hay khuyên bảo.
- source_word: αὐτούς
  choice: hai ông
  rationale: Đại từ chỉ Phao-lô và Si-la; dùng “hai ông” giúp câu tiếng Việt rõ chủ thể mà không thêm tên riêng.
- source_word: ἐξαγαγόντες
  choice: rồi đưa hai ông ra
  rationale: Phân từ bất định quá khứ của ἐξάγω diễn tả việc đưa ra khỏi nơi giam giữ; “rồi” thể hiện tự nhiên trình tự hành động.
- source_word: ἠρώτων
  choice: xin
  rationale: Thì chưa hoàn thành của ἐρωτάω có thể hàm ý lời yêu cầu kéo dài hoặc lặp lại. “Xin” thể hiện tính chất thỉnh cầu, nhã nhặn trong ngữ cảnh.
- source_word: ἀπελθεῖν ἀπὸ τῆς πόλεως
  choice: rời khỏi thành
  rationale: Diễn đạt tự nhiên, chính xác nội dung lời yêu cầu là đi khỏi thành phố.
theological_decisions: []
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. “Giảng hòa” truyền đạt sắc thái conciliatory của παρακαλέω trong ngữ cảnh; câu giữ nhịp kể chuyện tuần tự, không mô phỏng cứng cấu trúc phân từ Hy Lạp.
