source:
  edition: SBLGNT
  text: ἐξελθόντες δὲ ⸀ἀπὸ τῆς φυλακῆς εἰσῆλθον πρὸς τὴν Λυδίαν, καὶ ἰδόντες ⸂παρεκάλεσαν τοὺς ἀδελφοὺς⸃ καὶ ἐξῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/040.yaml
  text: After they came out of the prison[a], they went to Lydia, and when they saw the brothers, they encouraged them and departed.
translation:
  language: vi
  text: Sau khi ra khỏi nhà tù, họ đến gặp Ly-đi-a. Gặp các anh chị em[a], họ khích lệ các anh chị em ấy rồi ra đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn là “các anh em”; từ Hy Lạp ở giống đực số nhiều nhưng có thể chỉ chung các tín hữu nam và nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες δὲ ἀπὸ τῆς φυλακῆς
  choice: Sau khi ra khỏi nhà tù
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; “sau khi” thể hiện rõ trình tự. “Nhà tù” chỉ nơi giam giữ cụ thể trong ngữ cảnh.
- source_word: εἰσῆλθον πρὸς τὴν Λυδίαν
  choice: họ đến gặp Ly-đi-a
  rationale: Cấu trúc εἰσέρχομαι πρός với một người mang nghĩa đi vào nơi người ấy ở để thăm gặp. Cách dịch này tự nhiên, không thêm rõ “nhà” khi nguyên văn không nêu danh từ ấy.
- source_word: ἰδόντες
  choice: Gặp
  rationale: Trong ngữ cảnh thăm viếng, “gặp” tự nhiên hơn cách dịch máy móc “thấy”, đồng thời vẫn diễn đạt hành động xảy ra trước việc khích lệ.
- source_word: παρεκάλεσαν
  choice: họ khích lệ
  rationale: παρακαλέω có thể bao gồm khuyên nhủ, an ủi và làm vững lòng; “khích lệ” giữ được phạm vi mục vụ rộng trong ngữ cảnh.
- source_word: τοὺς ἀδελφούς
  choice: các anh chị em
  rationale: Dù hình thức Hy Lạp là giống đực số nhiều, từ này thường chỉ chung các tín hữu cả nam lẫn nữ; ngữ cảnh quanh Ly-đi-a khiến nghĩa bao hàm đặc biệt phù hợp.
- source_word: ἐξῆλθαν
  choice: rồi lên đường
  rationale: Động từ chỉ việc họ rời đi. “Lên đường” tự nhiên trong tiếng Việt và cho thấy họ tiếp tục hành trình, nhưng không xác định quá mức đích đến.
theological_decisions:
- issue: Phạm vi chỉ người của τοὺς ἀδελφούς
  choice: các anh chị em
  alternative: các anh em
  rationale: Trong cách dùng của cộng đồng Cơ Đốc thời đầu, danh từ giống đực số nhiều có thể bao gồm cả nam lẫn nữ. Dịch bao hàm trong chính văn chuyển tải đối tượng được nói đến, còn chú thích bảo tồn hình thức giống đực của nguyên ngữ.
- issue: Sắc thái của παρακαλέω
  choice: khích lệ
  alternative: khuyên nhủ; an ủi
  rationale: Nguyên ngữ không buộc phải chọn riêng giữa khuyên nhủ và an ủi. “Khích lệ” duy trì độ rộng nghĩa và không áp đặt một cách hiểu thần học hẹp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Ly-đi-a” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Tách thành hai câu để mạch hành động rõ ràng, đồng thời tránh câu ghép nặng nề.
