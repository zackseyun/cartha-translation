  source_fidelity: 'Bản dịch truyền đạt đúng trình tự chính: họ ra khỏi ngục, đến với Ly-đi-a, gặp cộng đồng tín hữu, khích lệ họ, rồi rời đi. Tuy nhiên, “mọi người” làm yếu liên hệ trực tiếp với τοὺς ἀδελφούς (“các anh chị em”), và “lên đường” thêm sắc thái tiếp tục hành trình không được nêu rõ. “Ra đi” tương ứng sát và trung tính hơn với ἐξῆλθαν.'
