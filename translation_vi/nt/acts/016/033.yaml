  text: And taking them in that hour of the night[a], he washed their wounds, and he was baptized at once[c][b], he and all his household.
translation:
  language: vi
  text: Vào chính giờ ấy trong đêm, ông đưa họ đi và rửa các vết thương cho họ; rồi lập tức, ông cùng tất cả người trong nhà mình[a] đều chịu phép báp-têm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người trong nhà” chỉ mọi người thuộc gia hộ của ông; cụm từ Hy Lạp không nhất thiết chỉ gia đình hạt nhân.
    reason: alternative_reading
lexical_decisions:
- source_word: παραλαβὼν
  choice: đưa họ đi
  rationale: Phân từ bất định diễn tả hành động xảy ra trước việc rửa vết thương. Cách dịch này tự nhiên trong tiếng Việt và không xác định thêm địa điểm hay cách thức mà nguyên văn không nói rõ.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ τῆς νυκτός
  choice: ngay trong giờ ấy của đêm
  rationale: Giữ nét cụ thể về thời điểm ban đêm, đồng thời từ “ngay” làm nổi bật tính tức thời trong diễn tiến câu chuyện.
- source_word: ἔλουσεν ἀπὸ τῶν πληγῶν
  choice: rửa các vết thương cho họ
  rationale: Cụm Hy Lạp theo nghĩa đen có cấu trúc “rửa [họ] khỏi các vết thương”, nhưng trong ngữ cảnh chỉ việc rửa sạch và chăm sóc những thương tích do đòn đánh. Bản dịch Việt truyền đạt rõ nghĩa mà không thêm chi tiết.
- source_word: ἐβαπτίσθη
  choice: chịu phép báp-têm
  rationale: Thể bị động cho biết ông nhận phép báp-têm. Cách dịch quen thuộc này không áp đặt phương thức cử hành.
- source_word: οἱ αὐτοῦ πάντες
  choice: tất cả người trong nhà mình
  rationale: Diễn đạt những người thuộc phạm vi gia hộ của viên cai ngục, rộng hơn nghĩa gia đình hạt nhân và tự nhiên hơn “hộ gia đình” trong tiếng Việt phổ thông.
- source_word: παραχρῆμα
  choice: lập tức
  rationale: Trạng từ nhấn mạnh hành động diễn ra ngay, không trì hoãn.
theological_decisions:
- issue: Phạm vi của οἱ αὐτοῦ πάντες trong sự kiện chịu phép báp-têm
  choice: Dịch là “tất cả người trong nhà mình”, không xác định tuổi tác, lời tuyên xưng cá nhân hay phương thức báp-têm.
  alternative: “cả gia đình ông” hoặc “mọi người thuộc về ông”
  rationale: Câu này nói viên cai ngục và mọi người thuộc gia hộ ông đều chịu phép báp-têm, nhưng không tự nó giải quyết các tranh luận giáo phái về báp-têm cho trẻ nhỏ hay phương thức báp-têm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phép báp-têm” là thuật ngữ Kitô giáo quen thuộc, đồng thời tránh xác định cách thức cử hành. Nhịp câu giữ cả tính khẩn trương ban đêm lẫn trình tự hành động trong nguyên văn.
