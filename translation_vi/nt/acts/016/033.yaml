  terminology: “Chịu phép báp-têm” là cách dùng Việt ngữ Kitô giáo quen thuộc, phản ánh thể bị động mà không ấn định phương thức. “Người trong nhà mình” giữ phạm vi gia hộ rộng hơn gia đình hạt nhân; chú thích giải thích phù hợp và không áp đặt kết luận giáo phái.
