source:
  edition: SBLGNT
  text: ἀπήγγειλεν δὲ ὁ δεσμοφύλαξ τοὺς λόγους ⸀τούτους πρὸς τὸν Παῦλον, ὅτι Ἀπέσταλκαν οἱ στρατηγοὶ ἵνα ἀπολυθῆτε· νῦν οὖν ἐξελθόντες πορεύεσθε ἐν εἰρήνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/036.yaml
  text: 'And the jailer reported these words to Paul: “The magistrates have sent word that you may be released[a]. So now[b], come out and go in peace.”'
translation:
  language: vi
  text: 'Người cai ngục thuật lại những lời ấy cho Phao-lô: “Các quan chức[b] đã gửi lệnh để các ông được thả[a]. Vậy, bây giờ, xin hãy ra ngoài và đi bình an.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch sát hơn: “Các quan chức đã sai [lệnh] để các ông được thả.” Tiếng Hy Lạp không nói rõ tân ngữ của động từ “sai”; ngữ cảnh cho thấy một thông điệp hoặc mệnh lệnh đã được gửi đến.'
    reason: lexical_alternative
  - marker: b
    text: “Các quan chức” dịch từ στρατηγοί, tức những nhà chức trách dân sự của thành Phi-líp; thuật ngữ chuyên môn hơn là “pháp quan.”
    reason: cultural_note
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: thuật lại
  rationale: Diễn tả hành động chuyển đạt thông tin đã nhận, tự nhiên trong văn kể chuyện và vẫn giữ sắc thái báo lại.
- source_word: ὁ δεσμοφύλαξ
  choice: người cai ngục
  rationale: Chỉ người chịu trách nhiệm trông coi nhà giam; cách gọi rõ nghĩa và thông dụng trong tiếng Việt hiện đại.
- source_word: τοὺς λόγους τούτους
  choice: những lời ấy
  rationale: Bám sát số nhiều của λόγους và quy chiếu tự nhiên đến thông điệp vừa được chuyển đến.
- source_word: Ἀπέσταλκαν
  choice: đã sai người truyền lệnh
  rationale: Động từ có tân ngữ bị lược trong tiếng Hy Lạp. Bản dịch làm rõ rằng nhà chức trách đã sai người chuyển mệnh lệnh, đồng thời không ngụ ý chính xác họ sai ai.
- source_word: οἱ στρατηγοί
  choice: các quan chức
  rationale: Trong bối cảnh thuộc địa La Mã tại Phi-líp, từ này chỉ các nhà chức trách dân sự. “Các quan chức” dễ hiểu hơn thuật ngữ chuyên môn “pháp quan.”
- source_word: ἵνα ἀπολυθῆτε
  choice: thả các ông
  rationale: Thể bị động chỉ việc được trả tự do khỏi nơi giam giữ; tiếng Việt dùng chủ động với chủ thể ngầm là nhà chức trách/người thi hành lệnh sẽ tự nhiên hơn.
- source_word: νῦν οὖν
  choice: Vậy bây giờ
  rationale: Giữ cả ý suy ra của οὖν và ý thời điểm của νῦν bằng cách diễn đạt tự nhiên.
- source_word: ἐξελθόντες πορεύεσθε
  choice: xin hãy ra ngoài và đi
  rationale: Chuyển phân từ đi kèm mệnh lệnh thành hai hành động nối tiếp trong tiếng Việt; “xin hãy” phù hợp với lời người cai ngục nói trực tiếp với các tù nhân vừa được lệnh phóng thích.
- source_word: ἐν εἰρήνῃ
  choice: bình an
  rationale: Thành ngữ “đi bình an” vừa tự nhiên vừa bảo tồn sắc thái bình yên/an toàn của cụm Hy Lạp.
