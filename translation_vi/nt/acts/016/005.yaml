  text: αἱ μὲν οὖν ἐκκλησίαι ἐστερεοῦντο τῇ πίστει καὶ ἐπερίσσευον τῷ ἀριθμῷ καθ’ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/005.yaml
  text: So the churches were being strengthened in the faith and were increasing in number day by day[a].
translation:
  language: vi
  text: Vì vậy, các hội thánh được củng cố trong đức tin[a] và gia tăng về số lượng mỗi ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “trong sự tin cậy.” Cụm từ Hy Lạp có thể chỉ đức tin Cơ Đốc mà các hội thánh cùng tin nhận và sống theo, hoặc nói khái quát hơn đến việc họ được vững mạnh trong đức tin.
    reason: alternative_reading
lexical_decisions:
- source_word: αἱ μὲν οὖν
  choice: Vì vậy
  rationale: Cụm tiểu từ mở đầu một câu tổng kết có tính chuyển tiếp và suy kết từ diễn tiến trước đó. “Vì vậy” tự nhiên trong tiếng Việt và không diễn đạt quá mức sắc thái của μέν.
- source_word: ἐκκλησίαι
  choice: các hội thánh
  rationale: Trong Công Vụ, từ này chỉ các cộng đồng Cơ Đốc địa phương. “Hội thánh” là cách gọi rõ ràng, trang trọng và quen thuộc trong tiếng Việt.
- source_word: ἐστερεοῦντο
  choice: được vững mạnh
  rationale: Thể chưa hoàn thành bị động diễn tả một tiến trình đang tiếp diễn trong quá khứ. “Được vững mạnh” giữ được thể bị động và diễn đạt tự nhiên ý được củng cố, làm cho kiên vững.
- source_word: τῇ πίστει
  choice: trong đức tin
  rationale: Cách dịch này giữ được từ ngữ thần học quen thuộc, đồng thời không buộc tiếng Việt phải phân biệt dứt khoát giữa đức tin chung của cộng đồng và hành vi tin cậy của các tín hữu.
- source_word: ἐπερίσσευον
  choice: ngày càng gia tăng
  rationale: Thể chưa hoàn thành cho thấy sự tăng trưởng tiếp diễn. “Ngày càng gia tăng” kết hợp tự nhiên với καθ’ ἡμέραν và không hàm ý mạnh hơn nguyên văn như “nhân lên”.
- source_word: τῷ ἀριθμῷ
  choice: về số lượng
  rationale: Dữ cách chỉ phương diện mà sự gia tăng diễn ra. “Về số lượng” truyền đạt rõ đây là sự tăng trưởng về mặt con số.
- source_word: καθ’ ἡμέραν
  choice: ngày càng
  rationale: Trong cấu trúc tiếng Việt, “ngày càng gia tăng” diễn đạt tự nhiên tiến trình tăng lên liên tục từng ngày; chú thích nêu cách dịch sát hình thức hơn là “mỗi ngày”.
theological_decisions:
- issue: Ý nghĩa của πίστις có mạo từ
  choice: Giữ “trong đức tin” trong chính văn, có thể chỉ đức tin Cơ Đốc được cộng đồng cùng tin nhận
  alternative: Đức tin theo nghĩa sự tin cậy của các tín hữu
  rationale: Mạo từ và bối cảnh hội thánh nghiêng về ý nghĩa chung của đức tin Cơ Đốc, nhưng cụm tiếng Hy Lạp vẫn có thể được hiểu rộng hơn là được củng cố trong việc tin. Cách dịch tiếng Việt và chú thích giữ nguyên sự mơ hồ chính đáng.
translation_notes:
  register: 'Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “hội thánh” theo ngữ cảnh Công Vụ; giữ nhịp câu tổng kết và hai tiến trình song song: được củng cố và gia tăng.'
