  yaml_path: translation/nt/acts/016/035.yaml
  text: And when day came[a], the magistrates sent the rod-bearers, saying, “Release those men.”
translation:
  language: vi
  text: 'Khi trời sáng, các quan tòa sai những người mang gậy[a] đến, truyền rằng: “Hãy thả những người ấy ra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể gọi là các lictor, tức những người hầu cận chính thức của các quan chức La Mã, mang gậy làm biểu tượng thẩm quyền.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμέρας δὲ γενομένης
  choice: Khi trời sáng
  rationale: Cụm sở hữu cách tuyệt đối đánh dấu sự chuyển tiếp về thời gian. Cách dịch này tự nhiên trong tiếng Việt hiện đại và giữ đúng ý ‘khi ngày đến/khi trời sáng’; quan hệ nối tiếp của δέ được thể hiện qua mạch văn mà không cần thêm một từ nối gượng ép.
- source_word: ἀπέστειλαν
  choice: sai ... đến
  rationale: Động từ ἀποστέλλω ở đây có nghĩa là phái người đi. ‘Sai ... đến’ diễn đạt tự nhiên việc các quan cử thuộc viên đến nhà giam.
- source_word: στρατηγοὶ
  choice: các quan chấp chính
  rationale: Trong bối cảnh thuộc địa La Mã Phi-líp, từ này chỉ các quan chức dân sự đứng đầu, không phải các tướng lĩnh quân sự theo nghĩa thông thường. ‘Quan chấp chính’ vừa phân biệt chức vụ dân sự vừa giữ sắc thái lịch sử.
- source_word: ῥαβδούχους
  choice: những người mang gậy
  rationale: Giữ hình ảnh cụ thể của từ Hy Lạp, nghĩa đen là những người mang gậy, đồng thời dùng chú thích để giải thích chức năng chính thức của họ trong cơ cấu La Mã.
- source_word: λέγοντες
  choice: truyền rằng
  rationale: Phân từ này dẫn vào nội dung mệnh lệnh. ‘Truyền rằng’ phù hợp với lời nhắn chính thức do các quan chấp chính gửi qua thuộc viên.
- source_word: Ἀπόλυσον
  choice: Hãy thả ... ra
  rationale: Mệnh lệnh số ít hướng đến người có trách nhiệm giam giữ. ‘Thả ... ra’ rõ nghĩa, tự nhiên và phù hợp với bối cảnh nhà giam.
- source_word: τοὺς ἀνθρώπους ἐκείνους
  choice: những người ấy
  rationale: Chỉ Phao-lô và Si-la. ‘Những người ấy’ giữ được sắc thái chỉ định của ἐκείνους mà không làm câu nói trở nên nặng nề.
