id: ACT.16.1
reference: Acts 16:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Κατήντησεν δὲ ⸀καὶ εἰς Δέρβην καὶ ⸀εἰς Λύστραν. καὶ ἰδοὺ μαθητής τις ἦν ἐκεῖ ὀνόματι Τιμόθεος, υἱὸς ⸀γυναικὸς Ἰουδαίας πιστῆς, πατρὸς δὲ Ἕλληνος,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/001.yaml
  text: He also came to Derbe and to Lystra[a]. And behold, a certain disciple was there named Timothy, the son of a believing Jewish woman, but of a Greek father[b],
translation:
  language: vi
  text: Ông cũng đến Đẹt-bơ và Lít-trơ. Kìa, tại đó có một môn đồ tên là Ti-mô-thê, con trai của một phụ nữ Do Thái tin Chúa[a], còn cha là người Hy Lạp.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “trung tín”. Tính từ Hy Lạp ở đây có thể mang nghĩa “tin” hoặc “trung tín”, nhưng trong Công Vụ, nghĩa “tin Chúa” có khả năng phù hợp hơn tại đây.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατήντησεν
  choice: đến
  rationale: Động từ καταντάω trong văn cảnh hành trình chỉ việc đến một địa điểm; “đến” tự nhiên và không thêm sắc thái ngoài nguyên văn.
- source_word: δὲ καὶ
  choice: cũng
  rationale: Diễn tả sự tiếp nối có ý bổ sung trong mạch thuật chuyện.
- source_word: εἰς Δέρβην καὶ εἰς Λύστραν
  choice: đến Đẹt-bơ và Lý-xta
  rationale: Giới từ εἰς với địa danh trong trình thuật hành trình được diễn đạt tự nhiên bằng “đến” trong tiếng Việt.
- source_word: καὶ ἰδοὺ
  choice: Kìa
  rationale: Giữ lại chức năng thu hút sự chú ý và nét sinh động của ἰδού, thay vì lược bỏ như một từ nối thông thường.
- source_word: μαθητής τις ἦν ἐκεῖ
  choice: tại đó có một môn đồ
  rationale: Cách diễn đạt hiện hữu này tự nhiên trong tiếng Việt, giữ được cả tính bất định của τις và địa điểm ἐκεῖ mà không gây lặp vụng.
- source_word: ὀνόματι Τιμόθεος
  choice: tên là Ti-mô-thê
  rationale: Cách chuyển ngữ trực tiếp, rõ ràng và tự nhiên cho cấu trúc với ὀνόματι.
- source_word: υἱὸς γυναικὸς Ἰουδαίας πιστῆς
  choice: con trai của một phụ nữ Do Thái tin Chúa
  rationale: πιστή trong Công Vụ nhiều khả năng chỉ một người tin; “tin Chúa” truyền đạt ý này bằng ngôn ngữ phổ thông, còn khả năng “trung tín” được ghi ở chú thích.
- source_word: πατρὸς δὲ Ἕλληνος
  choice: còn cha là người Hy Lạp
  rationale: Làm rõ cấu trúc tỉnh lược của tiếng Hy Lạp bằng tiếng Việt tự nhiên, đồng thời giữ sự tương phản do δέ biểu thị.
- source_word: Ἕλληνος
  choice: người Hy Lạp
  rationale: Ἕλλην ở đây nói về căn tính dân tộc/văn hóa Hy Lạp; không nên khái quát hóa thành “dân ngoại”.
theological_decisions:
- issue: Ý nghĩa của πιστῆς khi mô tả mẹ của Ti-mô-thê
  choice: tin Chúa
  alternative: trung tín
  rationale: Trong cách dùng của Lu-ca ở Công Vụ và trong văn cảnh giới thiệu một môn đồ, từ này có nhiều khả năng chỉ người tin Chúa. Tuy nhiên, nghĩa phẩm chất “trung tín” vẫn khả hữu về mặt từ vựng nên được bảo lưu trong chú thích.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Kìa” giữ dấu hiệu nhấn mạnh của nguyên văn; tên riêng được phiên âm theo lối quen dùng trong tiếng Việt. Cấu trúc “còn cha là” diễn đạt tự nhiên sự tương phản cô đọng trong tiếng Hy Lạp.
