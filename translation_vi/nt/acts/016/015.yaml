id: ACT.16.15
reference: Acts 16:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς, παρεκάλεσεν λέγουσα· Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι, εἰσελθόντες εἰς τὸν οἶκόν μου ⸀μένετε· καὶ παρεβιάσατο ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/015.yaml
  text: And when she and her household were baptized[a], she urged us, saying, “If you have judged me to be faithful to the Lord, come into my house and stay.” And she prevailed upon us.
translation:
  language: vi
  text: 'Khi bà và cả gia đình bà được báp-têm, bà khẩn khoản mời chúng tôi: “Nếu các ông xét thấy tôi là người trung tín với Chúa[a], xin hãy vào nhà tôi và ở lại.” Bà đã nài nỉ đến mức chúng tôi phải nhận lời.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Nếu các ông xét tôi là người có đức tin nơi Chúa.” Tính từ Hy Lạp có thể mang nghĩa “trung tín”, “đáng tin” hoặc “có đức tin”.'
    reason: Bảo tồn phạm vi nghĩa của πιστή, gồm sắc thái trung tín, đáng tin cậy, hoặc có đức tin, mà không quyết định dứt khoát một nét nghĩa.
lexical_decisions:
- source_word: ὡς δὲ ἐβαπτίσθη καὶ ὁ οἶκος αὐτῆς
  choice: Sau khi bà và cả gia đình được làm phép báp-têm
  rationale: Diễn đạt tự nhiên quan hệ thời gian của ὡς δέ và mở rộng động từ thụ động số ít cho cả Ly-đi cùng gia đình theo cấu trúc phối hợp. ὁ οἶκος ở đây chỉ những người thuộc gia đình, không phải căn nhà.
- source_word: παρεκάλεσεν
  choice: bà khẩn khoản mời chúng tôi
  rationale: Trong ngữ cảnh tiếp đãi, παρακαλέω vừa mang ý mời vừa có sắc thái tha thiết; cách dịch này nối tự nhiên với sự nài ép ở cuối câu.
- source_word: Εἰ κεκρίκατέ με πιστὴν τῷ κυρίῳ εἶναι
  choice: Nếu các ông xét thấy tôi là người trung tín với Chúa
  rationale: “Xét thấy” phản ánh sự đánh giá đã hình thành của κεκρίκατε. “Trung tín với Chúa” giữ sắc thái quan hệ và đạo đức của πιστή mà không thu hẹp hoàn toàn thành việc tuyên xưng đức tin.
- source_word: εἰσελθόντες εἰς τὸν οἶκόν μου μένετε
  choice: xin hãy vào nhà tôi và ở lại
  rationale: Phân từ εἰσελθόντες được diễn đạt như hành động đi kèm mệnh lệnh μένετε. Ở đây οἶκος là nơi ở thực tế nên dịch là “nhà”.
- source_word: παρεβιάσατο ἡμᾶς
  choice: Bà cứ nài ép cho đến khi chúng tôi nhận lời
  rationale: 'παραβιάζομαι chỉ sự thúc ép mạnh và bền bỉ nhưng trong ngữ cảnh không hàm ý cưỡng bức. Cách dịch nêu rõ kết quả tự nhiên của thành ngữ: lời mời tha thiết đã thắng được sự ngần ngại của họ.'
theological_decisions:
- issue: Thành phần và tình trạng đức tin của “cả gia đình”
  choice: Dịch thẳng lời tường thuật rằng bà và cả gia đình được làm phép báp-têm, không xác định tuổi tác hay tình trạng đức tin của từng người.
  alternative: Diễn đạt theo hướng ngầm khẳng định phép báp-têm cho trẻ nhỏ, hoặc ngầm khẳng định chỉ những người đã tự tuyên xưng đức tin mới được làm phép báp-têm.
  rationale: Câu này không cho biết thành phần của gia đình và không trực tiếp giải quyết những tranh luận giáo phái về phép báp-têm.
- issue: Ý nghĩa của πιστή
  choice: người trung tín với Chúa
  alternative: người tin Chúa; người đáng tin trước mặt Chúa
  rationale: Tính từ Hy Lạp có thể mang nghĩa trung tín, đáng tin hoặc tin. Bản văn chính giữ sắc thái trung tín, còn chú thích bảo tồn khả năng hiểu theo nghĩa người tin.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” vì Ly-đi đang nói với nhóm người nam trong mạch truyện; dùng “xin hãy” để thể hiện lời mời lịch sự nhưng tha thiết. “Làm phép báp-têm” là cách gọi quen thuộc, rõ nghĩa trong tiếng Việt hiện đại.
