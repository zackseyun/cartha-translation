  - severity: medium
    issue: “Bà cứ nài ép cho đến khi chúng tôi nhận lời” thêm chi tiết thời lượng “cho đến khi.”
    rationale: παρεβιάσατο diễn tả bà đã khẩn thiết thúc giục/thuyết phục họ và đã thành công, nhưng nguyên văn không nêu riêng một diễn tiến kéo dài bằng cụm “cho đến khi.” Bản sửa giữ cả sức ép của lời mời lẫn kết quả hàm ý.
