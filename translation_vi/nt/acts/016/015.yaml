revisions:
- from: 'Sau khi bà và cả gia đình được làm phép báp-têm, bà khẩn khoản mời chúng tôi: “Nếu các ông xét thấy tôi là người trung tín với Chúa[a], xin hãy vào nhà tôi và ở lại.” Bà cứ nài ép cho đến khi chúng tôi nhận lời.'
  to: 'Khi bà và cả gia đình bà được báp-têm, bà khẩn khoản mời chúng tôi: “Nếu các ông xét thấy tôi là người trung tín với Chúa[a], xin hãy vào nhà tôi và ở lại.” Bà đã nài nỉ đến mức chúng tôi phải nhận lời.'
  rationale: Sửa “Sau khi” thành “Khi” để phản ánh ὡς δέ một cách trung tính hơn; dùng “được báp-têm” cho lối diễn đạt hiện đại tự nhiên; và thay mệnh đề có thêm yếu tố thời lượng bằng cách diễn đạt kết quả hàm ý của παρεβιάσατο. Các yếu tố khác, gồm cách gọi “các ông,” được giữ vì phù hợp với nhóm người nam trong ngữ cảnh và với giọng lời mời lịch sự của Ly-đi.
  reviewer_model: gpt-5.6-terra
