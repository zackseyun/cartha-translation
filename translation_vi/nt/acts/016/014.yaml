id: ACT.16.14
reference: Acts 16:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καί τις γυνὴ ὀνόματι Λυδία, πορφυρόπωλις πόλεως Θυατείρων σεβομένη τὸν θεόν, ἤκουεν, ἧς ὁ κύριος διήνοιξεν τὴν καρδίαν προσέχειν τοῖς λαλουμένοις ὑπὸ ⸀τοῦ Παύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/014.yaml
  text: And a certain woman named Lydia[a], a seller of purple cloth from the city of Thyatira, who worshiped God, was listening; the Lord opened her heart to pay attention to what was being spoken by Paul.
translation:
  language: vi
  text: Có một phụ nữ tên là Ly-đi, người thành Thi-a-ti-rơ, buôn bán hàng dệt màu tía và thờ phượng Đức Chúa Trời.[a] Bà đang lắng nghe; Chúa đã mở lòng bà để bà chú tâm đến những điều Phao-lô đang nói.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “người kính sợ Đức Chúa Trời”; cụm từ này có thể chỉ một người ngoại bang sùng kính Đức Chúa Trời của dân Y-sơ-ra-ên.
    reason: Nêu phương án từ vựng và khả năng cụm từ mang ý nghĩa xã hội-tôn giáo chuyên biệt.
lexical_decisions:
- source_word: καί τις γυνὴ ὀνόματι Λυδία
  choice: Có một phụ nữ tên là Ly-đi
  rationale: “Có một” giữ tính bất định của τις và giới thiệu nhân vật tự nhiên trong văn kể chuyện tiếng Việt; “tên là” diễn đạt thành ngữ ὀνόματι.
- source_word: πορφυρόπωλις
  choice: làm nghề buôn vải màu tía
  rationale: Diễn đạt rõ nghề buôn bán hàng dệt nhuộm màu tía trong ngôn ngữ hiện đại, đồng thời không suy diễn thành loại y phục cụ thể.
- source_word: πόλεως Θυατείρων
  choice: quê ở thành Thi-a-ti-rơ
  rationale: Thể hiện nguồn gốc của Ly-đi một cách tự nhiên; “thành” giữ danh từ πόλεως.
- source_word: σεβομένη τὸν θεόν
  choice: là người thờ phượng Đức Chúa Trời
  rationale: Giữ nghĩa tôn kính và thờ phượng Đức Chúa Trời, không biến cách gọi này thành một nhãn kỹ thuật trong chính văn.
- source_word: ἤκουεν
  choice: đang lắng nghe
  rationale: Thì chưa hoàn thành mô tả hành động đang tiếp diễn; “lắng nghe” phù hợp hơn “nghe thấy” trong ngữ cảnh chú tâm đến lời giảng nói.
- source_word: ὁ κύριος
  choice: Chúa
  rationale: Giữ nguyên danh xưng của bản Hy Lạp và không xác định thêm chủ thể là Đức Chúa Trời hay Chúa Giê-su khi câu không nói rõ.
- source_word: διήνοιξεν τὴν καρδίαν
  choice: mở lòng bà
  rationale: Cách diễn đạt tự nhiên, trang trọng và giữ nguyên hình ảnh về sự tiếp nhận bên trong.
- source_word: προσέχειν
  choice: để bà chú tâm
  rationale: Phản ánh nghĩa hướng sự chú ý vào điều được nói; tránh dịch thành “đáp lại,” vốn diễn giải quá mức.
- source_word: τοῖς λαλουμένοις ὑπὸ τοῦ Παύλου
  choice: đến những điều Phao-lô đang nói
  rationale: Diễn đạt thể bị động Hy Lạp thành câu chủ động tự nhiên trong tiếng Việt, đồng thời “đang nói” giữ sắc thái tiếp diễn.
theological_decisions:
- issue: Chủ thể được gọi là ὁ κύριος
  choice: Chúa
  alternative: Đức Chúa Trời; Chúa Giê-su
  rationale: Nguyên văn chỉ nói “Chúa.” Công Vụ có thể dùng danh xưng này với sắc thái chỉ Chúa Giê-su, nhưng ngữ cảnh ở đây chỉ xác định hành động thần linh; bản dịch giữ sự rộng mở của nguyên văn.
- issue: Ý nghĩa xã hội-tôn giáo của σεβομένη τὸν θεόν
  choice: người thờ phượng Đức Chúa Trời
  alternative: người kính sợ Đức Chúa Trời
  rationale: Cách chọn trong chính văn truyền đạt hành vi và lòng sùng kính mà không khẳng định dứt khoát đây là một thuật ngữ phân loại chính thức; chú thích nêu khả năng cụ thể hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt. Câu được tách làm hai để tránh cấu trúc bổ nghĩa kéo dài thiếu tự nhiên, nhưng vẫn giữ tiến trình kể chuyện và quan hệ thần học của nguyên văn.
