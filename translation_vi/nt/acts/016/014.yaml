revisions:
- from: Có một phụ nữ tên là Ly-đi, quê ở thành Thi-a-ti-rơ, làm nghề buôn vải màu tía và là người thờ phượng Đức Chúa Trời.[a] Bà đang lắng nghe; Chúa mở lòng bà để bà chú tâm đến những điều Phao-lô đang nói.
  to: Có một phụ nữ tên là Ly-đi, người thành Thi-a-ti-rơ, buôn bán hàng dệt màu tía và thờ phượng Đức Chúa Trời.[a] Bà đang lắng nghe; Chúa đã mở lòng bà để bà chú tâm đến những điều Phao-lô đang nói.
  rationale: Sửa “quê ở” thành “người thành” để không diễn giải quá mức quan hệ địa lý; dùng “hàng dệt màu tía” để giữ phạm vi từ vựng; chuyển neo chú thích đến ngay sau cụm được giải thích. Các sửa đổi không thay đổi ý nghĩa câu và giữ sắc thái tiếp diễn của ἤκουεν và τοῖς λαλουμένοις.
