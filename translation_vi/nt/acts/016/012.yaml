revisions:
- from: Từ đó, chúng tôi đến Phi-líp[a], là một thành phố hàng đầu trong vùng Ma-xê-đô-ni-a, và là thuộc địa La Mã[b]. Chúng tôi lưu lại thành phố này vài ngày.
  to: Từ đó, chúng tôi đến Phi-líp[a], một thành phố hàng đầu trong vùng Ma-xê-đô-ni-a, một thuộc địa La Mã[b]. Chúng tôi lưu lại ở thành phố này vài ngày.
