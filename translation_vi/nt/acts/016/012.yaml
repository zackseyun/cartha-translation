id: ACT.16.12
reference: Acts 16:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀κἀκεῖθεν εἰς Φιλίππους, ἥτις ἐστὶν ⸂πρώτη τῆς μερίδος⸃ Μακεδονίας πόλις, κολωνία. ἦμεν δὲ ἐν ⸀ταύτῃ τῇ πόλει διατρίβοντες ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/012.yaml
  text: and from there to Philippi[a], which is a leading city of the district of Macedonia, a Roman colony[b]. And we stayed in this city for some days.
translation:
  language: vi
  text: Từ đó, chúng tôi đến Phi-líp[a], một thành phố hàng đầu trong vùng Ma-xê-đô-ni-a, một thuộc địa La Mã[b]. Chúng tôi lưu lại ở thành phố này vài ngày.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “thành phố đầu tiên của vùng Ma-xê-đô-ni-a.” Cụm từ Hy Lạp này khó xác định; “đầu tiên” có thể nói đến địa vị, sự nổi bật hoặc thứ tự.'
    reason: alternative_reading
  - marker: b
    text: Tức là một thành phố được ban địa vị đặc biệt dưới quyền cai trị của La Mã.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Từ đó
  rationale: Giữ mối liên kết với hành trình ở câu trước; động từ “đến” được diễn đạt cùng cụm chỉ đích đến để câu tiếng Việt tự nhiên.
- source_word: εἰς Φιλίππους
  choice: chúng tôi đến Phi-líp
  rationale: εἰς với địa danh chỉ đích đến. Chủ ngữ và động từ được bổ sung từ ngữ cảnh hành trình, không làm thay đổi nội dung.
- source_word: πρώτη τῆς μερίδος Μακεδονίας πόλις
  choice: một thành phố hàng đầu trong vùng Ma-xê-đô-ni-a
  rationale: πρώτη có thể nói đến thứ tự, địa vị hoặc sự nổi bật; “hàng đầu” truyền đạt khả năng chỉ sự nổi bật mà không khẳng định Phi-líp là thủ phủ. μερίς được dịch là “vùng” để chỉ một phần lãnh thổ.
- source_word: κολωνία
  choice: thuộc địa La Mã
  rationale: Trong bối cảnh này, từ vay mượn κολωνία chỉ địa vị thuộc địa chính thức của La Mã; nêu rõ “La Mã” giúp độc giả hiện đại hiểu đúng ý lịch sử.
- source_word: ἦμεν ... διατρίβοντες
  choice: chúng tôi lưu lại
  rationale: Cấu trúc diễn tả việc tiếp tục ở lại và trải qua một khoảng thời gian tại nơi ấy; “lưu lại” vừa tự nhiên vừa trang trọng.
- source_word: ἐν ταύτῃ τῇ πόλει
  choice: thành phố này
  rationale: Giữ sắc thái chỉ định của ταύτῃ; trong tiếng Việt, “lưu lại thành phố này” tự nhiên mà không nhất thiết phải thêm giới từ “trong”.
- source_word: ἡμέρας τινάς
  choice: vài ngày
  rationale: Diễn đạt một khoảng thời gian ngắn không xác định, không áp đặt con số cụ thể.
theological_decisions:
- issue: Ý nghĩa của πρώτη trong lời mô tả Phi-líp
  choice: một thành phố hàng đầu
  alternative: thành phố đầu tiên của vùng Ma-xê-đô-ni-a
  rationale: Cụm Hy Lạp khó xác định và có thể nói đến thứ tự, địa vị hoặc sự nổi bật. Bản dịch chính chọn nghĩa nổi bật nhưng ghi chú cách hiểu sát chữ để bảo tồn sự mơ hồ thật sự của nguyên văn.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng các dạng địa danh Việt hóa quen thuộc “Phi-líp” và “Ma-xê-đô-ni-a”. Hai dấu chú thích [a], [b] đều được đặt ngay sau nội dung liên quan.
