id: ACT.16.11
reference: Acts 16:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀναχθέντες ⸀οὖν ⸀ἀπὸ Τρῳάδος εὐθυδρομήσαμεν εἰς Σαμοθρᾴκην, τῇ ⸀δὲ ἐπιούσῃ εἰς ⸂Νέαν Πόλιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/011.yaml
  text: So[a], after putting out to sea from Troas, we sailed straight to Samothrace, and on the following day to Neapolis,
translation:
  language: vi
  text: Vậy, sau khi rời Trô-a ra khơi, chúng tôi đi thẳng đến Sa-mô-thra-xê; ngày hôm sau, chúng tôi đến Nê-a-pô-li.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: sau khi rời ... ra khơi
  rationale: Trong ngữ cảnh hàng hải, ἀνάγω có nghĩa là rời bến để ra biển. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ trình tự của phân từ.
- source_word: οὖν
  choice: Vậy
  rationale: οὖν nối kết diễn tiến hoặc hệ quả trong lời thuật; “Vậy” ngắn gọn và phù hợp với mạch kể.
- source_word: ἀπὸ Τρῳάδος
  choice: rời Trô-a
  rationale: ἀπό chỉ nơi xuất phát. “Trô-a” là dạng phiên âm quen thuộc trong tiếng Việt.
- source_word: εὐθυδρομήσαμεν
  choice: chúng tôi đi thẳng
  rationale: Động từ chỉ việc theo hải trình thẳng. Vì ngữ cảnh “ra khơi” đã xác định phương tiện đường biển, “đi thẳng” vừa tự nhiên vừa giữ lực định hướng của từ gốc.
- source_word: εἰς Σαμοθρᾴκην
  choice: đến Sa-mô-thra-xê
  rationale: εἰς chỉ đích đến; địa danh được phiên âm theo lối dễ đọc đối với độc giả Việt.
- source_word: τῇ δὲ ἐπιούσῃ
  choice: ngày hôm sau
  rationale: Cụm tặng cách thời gian có nghĩa là ngày kế tiếp; δέ được thể hiện qua sự tiếp nối của câu, không cần dịch thành một liên từ riêng gây nặng lời.
- source_word: εἰς Νέαν Πόλιν
  choice: đến Nê-a-pô-li
  rationale: Đây là tên riêng của địa điểm nên được phiên âm, không dịch nghĩa là “Thành Mới”.
theological_decisions: []
