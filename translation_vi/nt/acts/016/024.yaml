  text: ὃς παραγγελίαν τοιαύτην ⸀λαβὼν ἔβαλεν αὐτοὺς εἰς τὴν ἐσωτέραν φυλακὴν καὶ τοὺς πόδας ⸂ἠσφαλίσατο αὐτῶν⸃ εἰς τὸ ξύλον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/024.yaml
  text: He[a], having received such an order[b], threw them into the inner prison and secured their feet in the stocks.
translation:
  language: vi
  text: Nhận được mệnh lệnh ấy, viên cai ngục quẳng họ vào khu giam bên trong[a] và khóa chặt chân họ vào cùm gỗ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khu giam sâu bên trong.”'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “vào gỗ”, chỉ một dụng cụ bằng gỗ dùng để giữ chặt chân tù nhân.
    reason: cultural_note
lexical_decisions:
- source_word: παραγγελίαν τοιαύτην
  choice: mệnh lệnh ấy
  rationale: Cụm từ chỉ mệnh lệnh có thẩm quyền vừa được ban; “mệnh lệnh ấy” tự nhiên trong tiếng Việt và giữ liên kết với ngữ cảnh trước.
- source_word: λαβὼν
  choice: nhận được
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính; cấu trúc mở đầu “Nhận được...” truyền đạt quan hệ thời gian ấy gọn và tự nhiên.
- source_word: ἔβαλεν
  choice: quẳng
  rationale: βάλλω có sắc thái ném/quẳng. “Quẳng” giữ được tính mạnh bạo trong cách đối xử, thay vì làm nhẹ thành “đưa” hay “giam”.
- source_word: ἐσωτέραν φυλακήν
  choice: khu giam bên trong
  rationale: ἐσωτέραν là dạng so sánh, nghĩa là phần ở sâu hơn hoặc bên trong hơn; “khu giam bên trong” phù hợp với cấu trúc nhà tù và không buộc phải hiểu là một phòng giam đơn lẻ.
- source_word: ἠσφαλίσατο
  choice: khóa chặt
  rationale: Động từ có nghĩa làm cho chắc chắn, cố định an toàn; trong ngữ cảnh dụng cụ giam giữ, “khóa chặt” diễn đạt tự nhiên hành động cố định chân tù nhân.
- source_word: τοὺς πόδας αὐτῶν
  choice: chân họ
  rationale: πούς có nghĩa cơ bản là bàn chân/chân; tiếng Việt tự nhiên dùng “chân” khi nói đến việc bị đặt vào cùm.
- source_word: εἰς τὸ ξύλον
  choice: vào cùm gỗ
  rationale: Nghĩa đen là “vào khúc/đồ gỗ”, nhưng ngữ cảnh cho thấy một dụng cụ bằng gỗ dùng để giữ chân. “Cùm gỗ” vừa rõ nghĩa vừa giữ chất liệu được nêu trong nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “viên cai ngục” để nêu rõ chủ thể được tiếp nối từ ngữ cảnh; giữ sắc thái khắc nghiệt bằng “quẳng” và diễn đạt dụng cụ cổ đại rõ ràng bằng “cùm gỗ”.
