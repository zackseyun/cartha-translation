  source_fidelity: Bản dịch truyền đạt đúng quan hệ trước-sau của phân từ λαβών, sắc thái mạnh của ἔβαλεν, địa điểm giam giữ ở phần bên trong hơn (ἐσωτέραν φυλακήν), và việc cố định chân vào một dụng cụ bằng gỗ (εἰς τὸ ξύλον). “Viên cai ngục” là chủ ngữ được hiểu từ ngữ cảnh trước, phù hợp trong tiếng Việt.
  naturalness: Câu văn hiện đại, rõ ràng và trang trọng. “Quẳng họ” giữ sắc thái đối xử thô bạo; “khóa chặt chân họ vào cùm gỗ” tự nhiên trong ngữ cảnh giam giữ.
  terminology: “Mệnh lệnh”, “viên cai ngục”, và “cùm gỗ” phù hợp. Chú thích b giải thích đúng cách hiểu theo ngữ cảnh mà vẫn nêu nghĩa đen của ξύλον.
