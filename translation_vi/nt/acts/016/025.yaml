  text: Κατὰ δὲ τὸ μεσονύκτιον Παῦλος καὶ Σιλᾶς προσευχόμενοι ὕμνουν τὸν θεόν, ἐπηκροῶντο δὲ αὐτῶν οἱ δέσμιοι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/025.yaml
  text: About midnight Paul and Silas were praying and singing hymns to God[a], and the prisoners were listening to them.
translation:
  language: vi
  text: Khoảng nửa đêm, Phao-lô và Si-la vừa cầu nguyện vừa hát những bài thánh ca ca ngợi Đức Chúa Trời, còn các tù nhân chăm chú lắng nghe họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ τὸ μεσονύκτιον
  choice: Khoảng nửa đêm
  rationale: κατά với đối cách chỉ thời gian mang nghĩa khoảng hoặc vào quãng một thời điểm; δέ là từ nối nhẹ, được thể hiện tự nhiên qua cấu trúc câu mà không cần thêm một từ nối riêng.
- source_word: Παῦλος καὶ Σιλᾶς
  choice: Phao-lô và Si-la
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: προσευχόμενοι ὕμνουν
  choice: vừa cầu nguyện vừa hát thánh ca ngợi khen
  rationale: Phân từ hiện tại và động từ chính ở thì chưa hoàn thành diễn tả hai hoạt động đang tiếp diễn đồng thời; cấu trúc “vừa… vừa…” chuyển tải tự nhiên quan hệ này.
- source_word: ὕμνουν τὸν θεόν
  choice: hát thánh ca ngợi khen Đức Chúa Trời
  rationale: ὑμνέω chỉ việc hát lời ca ngợi; cách diễn đạt này giữ cả hành động hát lẫn nội dung hướng đến việc tôn ngợi Đức Chúa Trời.
- source_word: ἐπηκροῶντο
  choice: chăm chú lắng nghe
  rationale: Động từ có sắc thái nghe kỹ hoặc chú tâm, và thì chưa hoàn thành cho thấy hành động đang tiếp diễn.
- source_word: οἱ δέσμιοι
  choice: các tù nhân
  rationale: Trong bối cảnh nhà tù, đây là cách gọi tự nhiên và chính xác những người bị giam giữ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ sắc thái tiếp diễn và đồng thời của các hành động, đồng thời diễn đạt rõ sắc thái chú tâm của ἐπηκροῶντο ngay trong chính văn nên không cần chú thích.
