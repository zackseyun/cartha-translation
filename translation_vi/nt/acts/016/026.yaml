base_translation:
  language: en
  yaml_path: translation/nt/acts/016/026.yaml
  text: Suddenly there was a great earthquake[a], so that the foundations of the prison were shaken; and immediately all the doors were opened[b], and everyone's chains were unfastened.
translation:
  language: vi
  text: Bỗng nhiên, một trận động đất lớn xảy ra, đến nỗi nền móng nhà tù bị rung chuyển. Ngay lập tức, tất cả các cửa đều mở ra, và xiềng xích của mọi người đều được tháo ra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xiềng xích của mọi người đều được nới lỏng.” Từ Hy Lạp δεσμά có thể chỉ xiềng xích hoặc những vật trói buộc, còn ἀνέθη có thể mang nghĩa “được nới lỏng” hoặc “được tháo ra”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφνω
  choice: Bỗng nhiên
  rationale: Diễn tả sự việc xảy đến đột ngột, giữ được sức mạnh trần thuật và tự nhiên trong tiếng Việt hiện đại.
- source_word: σεισμὸς ἐγένετο μέγας
  choice: một trận động đất lớn xảy ra
  rationale: Chuyển cấu trúc γίνομαι + danh từ sang cách nói tự nhiên trong tiếng Việt, đồng thời giữ μέγας là “lớn” mà không diễn giải thêm thành mức độ tàn phá.
- source_word: ὥστε σαλευθῆναι
  choice: đến nỗi ... rung chuyển
  rationale: ὥστε biểu thị kết quả; “đến nỗi” thể hiện rõ quan hệ này, còn σαλευθῆναι được dịch tự nhiên là “rung chuyển”.
- source_word: τὰ θεμέλια τοῦ δεσμωτηρίου
  choice: nền nhà tù
  rationale: θεμέλια chỉ phần nền móng của công trình; “nền nhà tù” gọn, rõ và tự nhiên, còn δεσμωτήριον là nơi giam giữ.
- source_word: παραχρῆμα
  choice: Ngay lập tức
  rationale: Diễn tả hành động xảy ra tức thì, với sắc thái trang trọng vừa phải phù hợp văn kể chuyện.
- source_word: ἠνεῴχθησαν ... αἱ θύραι πᾶσαι
  choice: tất cả các cửa đều mở ra
  rationale: Hình thức thụ động Hy Lạp có thể được diễn đạt tự nhiên bằng nội động từ tiếng Việt; câu không xác định tác nhân và vẫn giữ trọn ý mọi cánh cửa đều mở.
- source_word: πάντων τὰ δεσμὰ
  choice: xiềng xích của mọi người
  rationale: πάντων là sở hữu cách, chỉ những vật trói buộc thuộc về tất cả những người bị giam; “mọi người” giữ phạm vi bao quát mà không thêm danh từ không có trong câu.
- source_word: ἀνέθη
  choice: đều bung ra
  rationale: ἀνίημι ở đây có nghĩa nới lỏng hoặc tháo ra. “Bung ra” diễn tả kết quả cụ thể, tự nhiên đối với xiềng xích, nhưng vẫn để ngỏ cách hình dung chính xác của việc tháo lỏng.
