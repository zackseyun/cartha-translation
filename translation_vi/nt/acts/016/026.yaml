  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “nhà tù” là cách gọi phổ thông cho δεσμωτήριον; tránh từ cổ hoặc quá chuyên biệt. Dấu [a] được đặt ngay sau mệnh đề có phương án dịch khác.
