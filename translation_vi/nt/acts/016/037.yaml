  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Παῦλος ἔφη πρὸς αὐτούς· Δείραντες ἡμᾶς δημοσίᾳ ἀκατακρίτους, ἀνθρώπους Ῥωμαίους ὑπάρχοντας, ἔβαλαν εἰς φυλακήν· καὶ νῦν λάθρᾳ ἡμᾶς ἐκβάλλουσιν; οὐ γάρ, ἀλλὰ ἐλθόντες αὐτοὶ ⸀ἡμᾶς ἐξαγαγέτωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/037.yaml
  text: But Paul said to them[a], “After beating us publicly without trial, though we are Roman citizens, they threw us into prison; and now are they sending us out secretly? No indeed! Rather[c][b], let them come themselves and lead us out.”
translation:
  language: vi
  text: 'Nhưng Phao-lô nói với họ: “Họ đã công khai đánh đòn chúng tôi khi chưa hề bị kết án[a], dù chúng tôi là công dân La Mã[b], rồi tống chúng tôi vào tù; bây giờ họ lại muốn bí mật đuổi chúng tôi đi sao? Không được! Chính họ phải đích thân đến và dẫn chúng tôi ra[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “khi chưa bị tuyên là có tội” hoặc, theo ý nghĩa pháp lý trong ngữ cảnh, “không qua xét xử.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn: “là những người La Mã”; ở đây nói đến việc họ có quyền công dân La Mã và được luật pháp bảo hộ.'
    reason: cultural_note
  - marker: c
    text: 'Cũng có thể dịch: “đưa chúng tôi ra” hoặc “hộ tống chúng tôi ra.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη πρὸς αὐτούς
  choice: nói với họ
  rationale: Cách diễn đạt tự nhiên, sát với động từ tường thuật và cụm giới từ trong tiếng Hy Lạp.
- source_word: Δείραντες ἡμᾶς δημοσίᾳ
  choice: đã công khai đánh đòn chúng tôi
  rationale: Phân từ bất định chỉ hành động xảy ra trước việc tống giam; “đánh đòn” giữ được sắc thái trừng phạt bằng bạo lực mà không xác định quá mức dụng cụ.
- source_word: ἀκατακρίτους
  choice: khi chưa hề kết án
  rationale: Từ này nói rằng họ chưa bị một phán quyết kết tội; cách dịch giữ trọng tâm pháp lý mà không đồng nhất hoàn toàn với việc không có bất kỳ thủ tục xét xử nào.
- source_word: ἀνθρώπους Ῥωμαίους ὑπάρχοντας
  choice: dù chúng tôi là công dân La Mã
  rationale: Trong ngữ cảnh, “người La Mã” chỉ địa vị công dân và các quyền pháp lý đi kèm; cấu trúc nhượng bộ làm rõ sự tương phản vốn hàm chứa trong lời phản đối.
- source_word: ἔβαλαν εἰς φυλακήν
  choice: rồi tống vào tù
  rationale: “Tống” truyền đạt lực của βάλλω và cách đối xử thô bạo, đồng thời tự nhiên trong tiếng Việt.
- source_word: λάθρᾳ ἡμᾶς ἐκβάλλουσιν
  choice: bí mật đuổi chúng tôi đi
  rationale: Giữ sắc thái lén lút của λάθρᾳ và tính xua đuổi của ἐκβάλλω; câu hỏi tu từ được diễn đạt tự nhiên bằng “sao?”.
- source_word: οὐ γάρ
  choice: Không được!
  rationale: Thể hiện lời bác bỏ dứt khoát, mạnh mẽ và tự nhiên trong ngữ cảnh.
- source_word: ἐλθόντες αὐτοὶ
  choice: Chính họ phải đích thân đến
  rationale: '“Chính họ” và “đích thân” cùng giữ sự nhấn mạnh của đại từ αὐτοὶ: các quan chức phải tự mình đến.'
- source_word: ἡμᾶς ἐξαγαγέτωσαν
  choice: và dẫn chúng tôi ra
  rationale: Mệnh lệnh ngôi thứ ba được diễn đạt bằng “phải”; “dẫn ra” sát nghĩa ἐξάγω và không thêm ý nghi lễ hay danh dự.
theological_decisions:
- issue: Sức nặng pháp lý của tư cách La Mã
  choice: công dân La Mã
  alternative: người La Mã
  rationale: Lời phản đối dựa trên địa vị pháp lý của Phao-lô và Si-la; “công dân La Mã” truyền đạt đúng điểm này mà không thêm một lập trường giáo phái.
- issue: Ý nghĩa của ἀκατακρίτους
  choice: khi chưa hề kết án
  alternative: không qua xét xử
  rationale: Nguyên văn trực tiếp nói họ chưa bị kết án. Bản dịch chính giữ nét nghĩa này, còn khả năng hiểu theo thủ tục pháp lý được ghi ở chú thích để không âm thầm thu hẹp sự mơ hồ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “đánh đòn,” “tống vào tù” và “Không được!” để giữ giọng phản đối mạnh mẽ của Phao-lô; tránh thuật ngữ pháp lý quá chuyên môn trong câu chính, đồng thời bảo tồn các khả năng dịch ở chú thích.
