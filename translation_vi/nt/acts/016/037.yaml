revisions:
- from: 'Nhưng Phao-lô nói với họ: “Họ đã công khai đánh đòn chúng tôi khi chưa hề kết án[a], dù chúng tôi là công dân La Mã[b], rồi tống vào tù; bây giờ họ lại muốn bí mật đuổi chúng tôi đi sao? Không được! Chính họ phải đích thân đến và dẫn chúng tôi ra[c].”'
  to: 'Nhưng Phao-lô nói với họ: “Họ đã công khai đánh đòn chúng tôi khi chưa hề bị kết án[a], dù chúng tôi là công dân La Mã[b], rồi tống chúng tôi vào tù; bây giờ họ lại muốn bí mật đuổi chúng tôi đi sao? Không được! Chính họ phải đích thân đến và dẫn chúng tôi ra[c].”'
