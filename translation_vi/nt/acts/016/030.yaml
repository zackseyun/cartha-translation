  text: καὶ προαγαγὼν αὐτοὺς ἔξω ἔφη· Κύριοι, τί με δεῖ ποιεῖν ἵνα σωθῶ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/030.yaml
  text: And after bringing them outside[a], he said, “Sirs[b], what must I do so that I may be saved?”
translation:
  language: vi
  text: 'Ông đưa hai người ra ngoài rồi nói: “Thưa các ngài[a], tôi phải làm gì để được cứu?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Các ngài” dịch từ từ Hy Lạp kyrios ở số nhiều, được dùng tại đây như lời xưng hô kính trọng, không phải tước hiệu “Chúa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: προαγαγὼν αὐτοὺς ἔξω
  choice: đưa hai người ra ngoài rồi
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. Cách diễn đạt này giữ đúng trình tự mà vẫn tự nhiên trong tiếng Việt; “hai người” làm rõ đại từ số nhiều theo ngữ cảnh gần.
- source_word: ἔφη
  choice: nói
  rationale: Dạng chưa hoàn thành của φημί ở đây là công thức dẫn lời trong văn thuật chuyện; “nói” sát nguồn hơn “hỏi”, dù câu trực tiếp mang hình thức câu hỏi.
- source_word: Κύριοι
  choice: Thưa các ngài
  rationale: Hô cách số nhiều của κύριος được dùng như lời xưng hô kính trọng với Phao-lô và Si-la, không phải tước hiệu thần linh “Chúa” trong ngữ cảnh này.
- source_word: τί με δεῖ ποιεῖν
  choice: tôi phải làm gì
  rationale: δεῖ biểu thị sự cần thiết; cách dịch ngắn gọn này giữ đầy đủ chủ thể, hành động và sắc thái bắt buộc.
- source_word: ἵνα σωθῶ
  choice: để được cứu
  rationale: Giữ quan hệ mục đích của ἵνα và thể bị động của σωθῶ, đồng thời diễn đạt tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của σωθῶ trong câu hỏi của viên cai ngục
  choice: được cứu
  alternative: được giải cứu; được thoát nạn
  rationale: Trong Công Vụ, σώζω có thể chỉ sự giải cứu khỏi nguy hiểm hoặc sự cứu rỗi theo nghĩa rộng hơn. Mạch văn dẫn sang câu 31 ủng hộ “được cứu”, nhưng bản dịch không thêm từ ngữ nhằm giới hạn thuật ngữ vào một hệ thống giáo lý cụ thể.
- issue: Cách hiểu Κύριοι
  choice: lời xưng hô kính trọng dành cho hai người
  alternative: tước hiệu “Chúa”
  rationale: Số nhiều và tình huống đối thoại cho thấy đây là cách viên cai ngục kính cẩn thưa với Phao-lô và Si-la, chứ không phải đang gọi họ bằng tước hiệu thần linh.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hai người” thay cho “họ” để tránh mơ hồ và phản ánh rõ Phao-lô cùng Si-la; giữ động từ dẫn lời là “nói” theo nguyên văn Hy Lạp.
