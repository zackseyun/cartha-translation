id: ACT.16.20
reference: Acts 16:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ προσαγαγόντες αὐτοὺς τοῖς στρατηγοῖς εἶπαν· Οὗτοι οἱ ἄνθρωποι ἐκταράσσουσιν ἡμῶν τὴν πόλιν Ἰουδαῖοι ὑπάρχοντες,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/020.yaml
  text: And after bringing them before the magistrates[a], they said, “These men are disturbing our city[b], being Jews,”
translation:
  language: vi
  text: 'Họ dẫn hai ông đến trước các quan chấp chính[a] và nói: “Những người này đang làm náo loạn thành của chúng ta. Họ là người Do Thái[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các pháp quan”; đây là các viên chức đứng đầu chính quyền thành phố La Mã tại một thuộc địa như Phi-líp.
    reason: cultural_note
  - marker: b
    text: Cũng có thể dịch là “người Giu-đê”. Từ Hy Lạp có thể chỉ người Do Thái nói chung hoặc người từ xứ Giu-đê; tại đây, “người Do Thái” phù hợp nhất với lời cáo buộc về căn tính dân tộc-tôn giáo.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγαγόντες
  choice: dẫn ... đến trước
  rationale: 'Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách đặt nối tiếp trong tiếng Việt vừa tự nhiên vừa giữ đúng trình tự: họ dẫn đến rồi nói.'
- source_word: στρατηγοῖς
  choice: các quan trị chính
  rationale: Trong thuộc địa La Mã Phi-líp, từ này chỉ các viên chức đứng đầu chính quyền thành phố. “Quan trị chính” rõ nghĩa hơn thuật ngữ La Mã chuyên biệt và vẫn giữ sắc thái lịch sử.
- source_word: ἐκταράσσουσιν
  choice: đang gây náo loạn
  rationale: Động từ diễn tả việc khuấy động nghiêm trọng hoặc làm thành phố rối loạn; “đang gây náo loạn” giữ thì hiện tại của lời cáo buộc và mức độ mạnh của từ Hy Lạp.
- source_word: ἡμῶν τὴν πόλιν
  choice: trong thành của chúng ta
  rationale: Đại từ sở hữu nhấn mạnh ý thức cộng đồng và quyền sở hữu mang tính tu từ của những người tố cáo; tiếng Việt tự nhiên cần thêm “trong” với cụm “gây náo loạn”.
- source_word: Ἰουδαῖοι
  choice: người Do Thái
  rationale: Trong bối cảnh cộng đồng hải ngoại tại Phi-líp, từ này phù hợp nhất với căn tính dân tộc-tôn giáo, chứ không chỉ nguồn gốc địa lý từ Giu-đê.
- source_word: ὑπάρχοντες
  choice: Họ là
  rationale: Tách phân từ thành một câu ngắn giúp lời cáo buộc tự nhiên trong tiếng Việt mà không quyết định dứt khoát nó chỉ hoàn cảnh đi kèm hay lý do của sự thù địch.
- source_word: Οὗτοι οἱ ἄνθρωποι
  choice: Những người này
  rationale: Chỉ cụ thể Phao-lô và Si-la; cách dịch này tự nhiên, không mang sắc thái miệt thị vượt quá nguyên văn.
theological_decisions:
- issue: Cách dịch Ἰουδαῖοι trong lời cáo buộc nhạy cảm về dân tộc và tôn giáo
  choice: người Do Thái
  alternative: người Giu-đê
  rationale: Ở Phi-líp, lời tố cáo đối lập căn tính Do Thái của Phao-lô và Si-la với căn tính công dân La Mã địa phương. Bản văn đang thuật lại lời quy chụp thù địch của những người tố cáo, không đưa ra phán xét của người kể chuyện về toàn thể người Do Thái.
- issue: Quan hệ ngữ nghĩa của ὑπάρχοντες với lời cáo buộc
  choice: Giữ liên kết tương đối mở bằng câu “Họ là người Do Thái”
  alternative: “vì họ là người Do Thái” hoặc “là người Do Thái mà lại...”
  rationale: Phân từ có thể nêu hoàn cảnh đi kèm hoặc cơ sở ngầm của lời tố cáo. Không thêm “vì” giúp tránh khóa chặt quan hệ nhân quả mà nguyên văn chỉ hàm ý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Quan trị chính” tránh thuật ngữ quá chuyên môn nhưng có chú thích lịch sử. Nhịp câu giữ dáng dấp lời buộc tội trực tiếp và không làm nhẹ sắc thái bài ngoại trong phát ngôn.
