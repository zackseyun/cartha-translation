revisions:
- from: 'Họ dẫn hai ông đến trước các quan trị chính[a] và nói: “Những người này đang gây náo loạn trong thành của chúng ta. Họ là người Do Thái[b],”'
  to: 'Họ dẫn hai ông đến trước các quan chấp chính[a] và nói: “Những người này đang làm náo loạn thành của chúng ta. Họ là người Do Thái[b].”'
  rationale: Bản sửa thay cách gọi hành chính không tự nhiên bằng “các quan chấp chính”, chỉnh động từ để “thành của chúng ta” là đối tượng trực tiếp của lời tố cáo, và sửa dấu câu. Câu “Họ là người Do Thái” giữ việc ὑπάρχοντες được nêu như một đặc điểm trong lời tố cáo, không áp đặt rõ quan hệ nhân quả bằng “vì”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:19:29Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: hành động dẫn Phao-lô và Si-la ra trước nhà chức trách, lời tố cáo về việc làm rối loạn thành phố, và căn tính Do Thái của họ. Tuy nhiên, “quan trị chính” không phải cách gọi tự nhiên hay chuẩn trong tiếng Việt hiện đại đối với στρατηγοί. Dấu câu trong lời thoại cũng cần chỉnh: dấu phẩy sau “người Do Thái” không thể kết thúc một câu trích dẫn độc lập.'
  naturalness: “Các quan chấp chính” là cách gọi lịch sử rõ ràng và tự nhiên hơn trong ngữ cảnh thuộc địa La Mã. “Làm náo loạn thành của chúng ta” diễn đạt trực tiếp đối tượng của ἐκταράσσουσιν hơn “gây náo loạn trong thành”. Tách mệnh đề phân từ thành câu thứ hai vẫn giữ được sự mở về quan hệ giữa căn tính Do Thái và cáo buộc, đồng thời nghe tự nhiên trong tiếng Việt.
  terminology: Giữ “người Do Thái” cho Ἰουδαῖοι, vì trong bối cảnh Phi-líp đây là cáo buộc về căn tính dân tộc-tôn giáo. Giữ chú thích phương án “người Giu-đê” để phản ánh biên độ ngữ nghĩa. Thay thuật ngữ chính quyền bằng “các quan chấp chính”; chú thích nêu “pháp quan” như cách gọi chuyên môn/historical alternative.
  issues:
  - severity: medium
    issue: “Các quan trị chính” không tự nhiên và không phải thuật ngữ hành chính-lịch sử Việt ngữ thông dụng.
    rationale: στρατηγοῖς chỉ các quan chức/chấp chính thành bang; “các quan chấp chính” diễn đạt chính xác hơn mà vẫn dễ hiểu.
  - severity: low
    issue: Dấu phẩy kết thúc lời trích dẫn sau “người Do Thái” là lỗi dấu câu.
    rationale: Mệnh đề này đã được chuyển thành một câu độc lập trong tiếng Việt, nên phải kết thúc bằng dấu chấm.
  - severity: low
    issue: “Gây náo loạn trong thành” kém trực tiếp hơn cấu trúc nguyên ngữ, trong đó “thành của chúng ta” là đối tượng bị làm xáo trộn.
    rationale: “Làm náo loạn thành của chúng ta” vừa tự nhiên vừa giữ sát hơn quan hệ động từ–đối tượng.
