id: ACT.16.6
reference: Acts 16:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀Διῆλθον δὲ τὴν Φρυγίαν ⸀καὶ Γαλατικὴν χώραν, κωλυθέντες ὑπὸ τοῦ ἁγίου πνεύματος λαλῆσαι τὸν λόγον ἐν τῇ Ἀσίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/006.yaml
  text: And they passed through the region of Phrygia and Galatia[b][a], having been forbidden by the Holy Spirit to speak the word in Asia.
translation:
  language: vi
  text: Họ đi qua miền Phrygia và Galatia[b], vì bị Đức Thánh Linh ngăn cản không cho nói lời tại Asia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Asia” ở đây là tỉnh Asia của La Mã ở phía tây Tiểu Á, không phải châu Á ngày nay.
    reason: cultural_note
  - marker: b
    text: 'Hoặc có thể hiểu: “vùng Phrygia và Galatia.” Cấu trúc Hy Lạp có thể được hiểu là tên gọi của một vùng duy nhất.'
    reason: alternative_reading
lexical_decisions:
- source_word: Διῆλθον
  choice: đi qua
  rationale: Động từ chỉ sự di chuyển xuyên qua một khu vực; “đi qua” tự nhiên và giữ được hướng nghĩa của nguyên văn.
- source_word: δὲ
  choice: lược dịch
  rationale: δέ là liên từ nhẹ để tiếp nối mạch kể; tiếng Việt không cần biểu đạt riêng ở đây vì câu vẫn nối tiếp tự nhiên.
- source_word: τὴν Φρυγίαν καὶ Γαλατικὴν χώραν
  choice: miền Phrygia và Galatia
  rationale: χώρα nghĩa là miền hoặc vùng. Cách dịch này dễ hiểu, đồng thời chú thích giữ lại khả năng cấu trúc Hy Lạp chỉ một vùng mang cả hai đặc tính.
- source_word: κωλυθέντες
  choice: vì ... đã ngăn họ
  rationale: Phân từ thụ động aorist diễn tả việc họ bị ngăn cản; chuyển sang mệnh đề nguyên nhân giúp câu tiếng Việt rõ và tự nhiên mà không làm mất tác nhân.
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Đức Thánh Linh
  rationale: Cụm từ chỉ Đức Thánh Linh là tác nhân trực tiếp của việc ngăn cản; đây là cách gọi trang trọng, quen thuộc trong tiếng Việt Cơ Đốc.
- source_word: λαλῆσαι
  choice: rao truyền
  rationale: Nghĩa cơ bản là “nói”, nhưng trong ngữ cảnh truyền giáo, “rao truyền” diễn đạt tự nhiên hành động công bố mà không thu hẹp nội dung thành một thuật ngữ giáo phái.
- source_word: τὸν λόγον
  choice: lời Chúa
  rationale: λόγος trong Công Vụ thường chỉ sứ điệp về Đức Chúa Trời. Thêm “Chúa” làm rõ cách dùng đã được ngữ cảnh quy định, nhưng vẫn giữ từ “lời” thay vì diễn giải thành “Tin Lành”.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: tại Asia
  rationale: Giữ địa danh lịch sử, với chú thích phân biệt tỉnh Asia của La Mã với châu Á hiện đại.
theological_decisions:
- issue: Tác nhân và ngôi vị của Thánh Linh trong việc ngăn cản
  choice: Đức Thánh Linh đã ngăn họ
  alternative: thần linh đã ngăn họ
  rationale: Cấu trúc Hy Lạp có mạo từ và tính từ “thánh”, cùng cách dùng nhất quán trong Lu-ca–Công Vụ, cho thấy đây là Đức Thánh Linh với tư cách tác nhân; bản dịch không bổ sung cơ chế Ngài đã dùng.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Giữ các địa danh Phrygia, Galatia và Asia theo dạng quốc tế quen dùng; đặt dấu chú thích ngay sau từ ngữ liên quan.
