revisions:
- from: Họ đi qua miền Phrygia và Galatia[b], vì Đức Thánh Linh đã ngăn họ rao truyền lời Chúa tại Asia.[a]
  to: Họ đi qua miền Phrygia và Galatia[b], vì bị Đức Thánh Linh ngăn cản không cho nói lời tại Asia.[a]
  rationale: Bản sửa giữ nghĩa di chuyển của Διῆλθον, tính chất bị động của κωλυθέντες, tác nhân là Đức Thánh Linh, và cách gọi không được mở rộng của τὸν λόγον. Chú thích b được thu gọn để phản ánh đúng tính mơ hồ cú pháp mà không áp đặt một tái dựng địa lý cụ thể.
