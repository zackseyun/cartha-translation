  yaml_path: translation/nt/acts/016/008.yaml
  text: So[a], passing by Mysia, they went down to Troas.
translation:
  language: vi
  text: Họ đi qua Mi-si-a[a] rồi xuống Trô-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đi ngang qua Mi-si-a” hoặc “đi qua khỏi Mi-si-a.” Phân từ Hy Lạp cho phép một số cách hiểu gần nhau; ý chính là họ tiếp tục hành trình chứ không dừng lại tại đó.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρελθόντες
  choice: đi qua
  rationale: Phân từ bất định quá khứ chủ động của παρέρχομαι, đi với đối cách τὴν Μυσίαν. Cụm “đi qua Mi-si-a” tự nhiên trong tiếng Việt và giữ được khả năng họ đi xuyên qua hoặc đi ngang qua vùng này mà không dừng lại.
- source_word: δὲ
  choice: Vì vậy,
  rationale: δέ là từ nối nhẹ trong mạch kể. “Vì vậy” nối tự nhiên với việc họ bị ngăn không cho đi theo những hướng đã định ở câu trước, nhưng không tạo sắc thái tương phản mạnh.
- source_word: Μυσίαν
  choice: Mi-si-a
  rationale: Phiên âm địa danh Μυσία theo cách đọc rõ ràng, dễ hiểu đối với độc giả tiếng Việt.
- source_word: κατέβησαν
  choice: xuống
  rationale: Động từ καταβαίνω mang nghĩa đi xuống; cách dịch này giữ hướng chuyển động, có thể liên quan đến địa hình hoặc việc tiến về phía duyên hải.
- source_word: εἰς
  choice: đến
  rationale: Với một địa điểm làm đích đến, “đến” là cách diễn đạt tự nhiên trong tiếng Việt.
- source_word: Τρῳάδα
  choice: Trô-a
  rationale: Phiên âm địa danh Τρῳάς theo cách đọc rõ ràng, dễ hiểu đối với độc giả tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. “Rồi” thể hiện trình tự của phân từ bất định quá khứ trước động từ chính; tên địa danh được phiên âm nhất quán sang tiếng Việt.
