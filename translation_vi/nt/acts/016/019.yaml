  yaml_path: translation/nt/acts/016/019.yaml
  text: But when her masters saw that their hope of profit had gone out[a], they seized Paul and Silas and dragged them into the marketplace before the rulers[b],
translation:
  language: vi
  text: Nhưng khi các chủ của cô thấy rằng hy vọng kiếm lợi của họ đã tiêu tan[a], họ bắt lấy Phao-lô và Si-la rồi lôi hai ông đến quảng trường, trước mặt các nhà chức trách[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “hy vọng thu lợi của họ không còn nữa.” Theo nghĩa đen, cụm từ Hy Lạp là “hy vọng về việc kiếm lợi của họ đã đi ra.”'
    reason: lexical_alternative
  - marker: b
    text: Từ được dịch là “các nhà chức trách” là cách gọi chung về những người cầm quyền trong thành phố; câu kế tiếp dùng một chức danh cụ thể hơn, thường được dịch là “các quan tòa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι αὐτῆς
  choice: các chủ của cô
  rationale: Trong ngữ cảnh, κύριοι chỉ những người có quyền sở hữu và kiểm soát cô gái nô lệ. “Các chủ của cô” diễn đạt tự nhiên mối quan hệ thống trị và bóc lột kinh tế, không mang nghĩa là danh xưng kính trọng.
- source_word: ἐξῆλθεν
  choice: đã tiêu tan
  rationale: Động từ theo nghĩa đen là “đã đi ra”; ở đây dùng ẩn dụ để nói nguồn hy vọng kiếm lợi không còn nữa. “Đã tiêu tan” giữ được hình ảnh hy vọng biến mất mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἡ ἐλπὶς τῆς ἐργασίας αὐτῶν
  choice: hy vọng kiếm lợi của họ
  rationale: ἐλπίς là “hy vọng”, còn ἐργασία trong ngữ cảnh chỉ việc làm sinh lợi hoặc khoản thu nhập. Cách dịch này bảo toàn cấu trúc ý nghĩa của tiếng Hy Lạp và làm rõ động cơ kinh tế.
- source_word: ἐπιλαβόμενοι
  choice: họ bắt lấy
  rationale: Phân từ này diễn tả hành động nắm giữ bằng sức mạnh. “Bắt lấy” rõ ràng, tự nhiên và phù hợp với tính chất thù địch của sự việc.
- source_word: εἵλκυσαν
  choice: lôi
  rationale: ἕλκω chỉ việc kéo đi bằng sức mạnh. “Lôi” diễn đạt súc tích tính cưỡng bức trong cách họ đối xử với Phao-lô và Si-la.
- source_word: ἀγορὰν
  choice: quảng trường
  rationale: ἀγορά là khu chợ đồng thời là quảng trường công cộng và trung tâm sinh hoạt dân sự. Trong bối cảnh đưa người đến nhà chức trách, “quảng trường” thể hiện chức năng công cộng rõ hơn “chợ”.
- source_word: ἐπὶ τοὺς ἄρχοντας
  choice: đến trước các nhà chức trách
  rationale: ἄρχοντες là từ khái quát chỉ những người cầm quyền trong thành phố. “Các nhà chức trách” giữ tính khái quát, tránh đồng nhất với chức danh chuyên biệt hơn xuất hiện ở câu kế tiếp.
