source:
  edition: SBLGNT
  text: αὕτη ⸀κατακολουθοῦσα τῷ Παύλῳ καὶ ἡμῖν ἔκραζεν λέγουσα· Οὗτοι οἱ ἄνθρωποι δοῦλοι τοῦ θεοῦ τοῦ ὑψίστου εἰσίν, οἵτινες καταγγέλλουσιν ⸀ὑμῖν ὁδὸν σωτηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/017.yaml
  text: She kept following Paul and us and crying out[a], saying, “These men are servants of the Most High God, who are proclaiming to you the way of salvation.”
translation:
  language: vi
  text: 'Cô ấy cứ theo sát Phao-lô và chúng tôi, vừa lớn tiếng kêu: “Những người này là nô lệ của Đức Chúa Trời Chí Cao; họ đang công bố cho mọi người con đường cứu rỗi[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Trong tiếng Hy Lạp, danh từ “con đường” không có mạo từ. Tùy ngữ cảnh, cụm này có thể được hiểu là “một con đường cứu rỗi” hoặc “con đường cứu rỗi.”
    reason: Bảo lưu sự không xác định rõ ràng về tính xác định của cụm ὁδὸν σωτηρίας mà không ép cách hiểu bất định vào bản văn chính.
lexical_decisions:
- source_word: κατακολουθοῦσα
  choice: cứ đi theo
  rationale: Phân từ hiện tại đi với động từ chính ở thì chưa hoàn thành diễn tả hành động kéo dài hoặc lặp lại; “cứ đi theo” truyền đạt tự nhiên sắc thái ấy.
- source_word: ἔκραζεν
  choice: lớn tiếng kêu
  rationale: Động từ chỉ việc kêu lớn; thì chưa hoàn thành cho thấy hành động tiếp diễn hoặc lặp lại mà không áp đặt thêm một cảm xúc cụ thể.
- source_word: δοῦλοι
  choice: nô lệ
  rationale: Từ này biểu thị những người thuộc quyền sở hữu của một chủ; “nô lệ” giữ rõ quan hệ thuộc về và phục quyền Đức Chúa Trời hơn “đầy tớ” hay “người phục vụ”.
- source_word: τοῦ θεοῦ τοῦ ὑψίστου
  choice: của Đức Chúa Trời Tối Cao
  rationale: Giữ nguyên tước hiệu thần linh ở dạng tự nhiên, trang trọng trong tiếng Việt.
- source_word: καταγγέλλουσιν
  choice: đang công bố
  rationale: Diễn tả việc loan báo công khai và giữ được sắc thái hiện tại của động từ.
- source_word: ὑμῖν
  choice: cho các vị
  rationale: Đại từ số nhiều chỉ những người nghe; “các vị” trung tính và tránh thêm quan hệ thân sơ không có trong nguyên văn.
- source_word: ὁδὸν σωτηρίας
  choice: một con đường cứu rỗi
  rationale: Danh từ “con đường” không có mạo từ trong tiếng Hy Lạp; cách dịch này giữ khả năng hiểu bất định, còn chú thích ghi nhận cách hiểu xác định theo ngữ cảnh.
theological_decisions:
- issue: Tính xác định của ὁδὸν σωτηρίας
  choice: một con đường cứu rỗi
  alternative: con đường cứu rỗi
  rationale: Nguyên văn không có mạo từ trước ὁδόν. Bản dịch chính giữ cách hiểu bất định có thể có, nhưng chú thích bảo lưu cách hiểu xác định vốn cũng phù hợp với thành ngữ và ngữ cảnh Hy Lạp, không dùng câu này để giải quyết thay cho nguyên văn vấn đề thần học về tính duy nhất của con đường cứu rỗi.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “cứ đi theo” và “lớn tiếng kêu” để thể hiện hành động kéo dài; dùng “nô lệ” nhằm bảo toàn sức nặng của δοῦλοι. Đại từ “các vị” giữ phép lịch sự trung tính đối với đám đông.
