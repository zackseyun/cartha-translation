    rationale: Cấu trúc τὰς θύρας τῆς φυλακῆς chỉ các cánh cửa thuộc một nhà giam. Trong tiếng Việt, “các cửa ngục” dễ gợi nhiều ngục/nhà tù hơn là nhiều cửa của cùng một nơi giam giữ.
  - severity: low
    issue: “tự sát” diễn giải thuật ngữ hơn mức cần thiết
    rationale: ἑαυτὸν ἀναιρεῖν nghĩa là giết chính mình trong ngữ cảnh này. “Giết mình” chuyển tải trực tiếp hành động và vẫn hoàn toàn tự nhiên; sắc thái sắp xảy ra đã do “sắp” biểu thị.
