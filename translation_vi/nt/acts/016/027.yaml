base_translation:
  language: en
  yaml_path: translation/nt/acts/016/027.yaml
  text: When the jailer woke up and saw the prison doors standing open[a], he drew his sword and was about to kill himself[b], supposing that the prisoners had escaped.
translation:
  language: vi
  text: Khi viên cai ngục tỉnh dậy và thấy các cửa nhà giam đang mở[a], ông rút gươm và sắp giết mình[b], vì tưởng các tù nhân đã trốn thoát.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hơn: “thấy các cửa của nhà giam đã được mở.” Phân từ hoàn thành trong tiếng Hy Lạp nhấn mạnh tình trạng các cửa đang mở.'
    reason: lexical_alternative
  - marker: b
    text: Từ μάχαιρα có thể chỉ gươm hoặc một loại vũ khí lưỡi ngắn hơn, như dao găm; ở đây dùng “gươm” theo cách dịch thông dụng trong văn cảnh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξυπνος ... γενόμενος
  choice: tỉnh dậy
  rationale: Diễn đạt tự nhiên trạng thái chuyển từ ngủ sang thức của cụm tính từ–phân từ.
- source_word: δεσμοφύλαξ
  choice: viên cai ngục
  rationale: Chỉ người có trách nhiệm trông giữ tù nhân; cách gọi này rõ nghĩa và phù hợp văn cảnh.
- source_word: ἰδὼν ἀνεῳγμένας τὰς θύρας τῆς φυλακῆς
  choice: thấy các cửa ngục đang mở
  rationale: Phân từ hoàn thành bị động nhấn mạnh tình trạng các cửa đã được mở và vẫn ở trong trạng thái mở; “đang mở” diễn đạt tự nhiên trạng thái kết quả ấy.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: rút gươm
  rationale: σπάομαι đi với μάχαιρα thường chỉ hành động rút vũ khí; “gươm” là cách dịch thông dụng mà không xác định quá mức loại lưỡi vũ khí.
- source_word: ἤμελλεν ἑαυτὸν ἀναιρεῖν
  choice: sắp tự sát
  rationale: ἤμελλεν diễn tả hành động sắp xảy ra, còn ἀναιρεῖν trong cấu trúc phản thân có nghĩa giết chính mình.
- source_word: νομίζων
  choice: vì tưởng
  rationale: Phân từ nêu căn cứ cho hành động của viên cai ngục và cho thấy đây là suy đoán, không phải điều ông biết chắc.
- source_word: ἐκπεφευγέναι
  choice: đã trốn thoát
  rationale: Động từ nguyên mẫu hoàn thành diễn tả việc trốn khỏi nơi giam giữ được ông cho là đã hoàn tất.
- source_word: τοὺς δεσμίους
  choice: các tù nhân
  rationale: Trong văn cảnh nhà ngục, từ này chỉ những người đang bị giam giữ.
theological_decisions: []
