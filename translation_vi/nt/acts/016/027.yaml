  to: Khi viên cai ngục tỉnh dậy và thấy các cửa nhà giam đang mở[a], ông rút gươm và sắp giết mình[b], vì tưởng các tù nhân đã trốn thoát.
  rationale: Đổi “các cửa ngục” thành “các cửa nhà giam” để phản ánh chính xác quan hệ sở hữu của “các cửa” với một nhà giam. Đổi “sắp tự sát” thành “sắp giết mình” để bám sát cách diễn đạt của nguyên ngữ mà không thay đổi nghĩa. Chú thích a được chỉnh để nhất quán với bản văn và diễn đạt chính xác, tự nhiên hơn.
  reviewer_model: gpt-5.6-terra
