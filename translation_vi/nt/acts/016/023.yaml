  - severity: low
    issue: Phương án chú thích 'đánh đập họ nhiều trận' không tự nhiên.
    rationale: '''Nhiều trận đòn'' là kết hợp tiếng Việt thông dụng hơn và vẫn chỉ là một phương án diễn đạt cho nhiều lần/cú đánh, không xác định dụng cụ.'
