  text: πολλάς ⸀τε ἐπιθέντες αὐτοῖς πληγὰς ἔβαλον εἰς φυλακήν, παραγγείλαντες τῷ δεσμοφύλακι ἀσφαλῶς τηρεῖν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/023.yaml
  text: And after they had inflicted many blows on them[a], they threw them into prison[b], ordering the jailer to keep them securely.
translation:
  language: vi
  text: Sau khi đánh họ nhiều đòn[a], người ta ném họ vào tù[b] và ra lệnh cho viên cai ngục canh giữ họ thật chặt chẽ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “đánh họ nhiều roi” hoặc “cho họ chịu nhiều trận đòn”. Tiếng Hy Lạp nói đến nhiều đòn được giáng xuống nhưng ở đây không nêu rõ dùng dụng cụ gì.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “nhà giam”; từ Hy Lạp có thể chỉ nơi giam giữ nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάς ... πληγὰς
  choice: đánh họ nhiều đòn
  rationale: Cụm Hy Lạp nói đến nhiều cú đánh giáng trên họ nhưng không xác định dụng cụ; cách dịch này tự nhiên và không diễn giải quá mức.
- source_word: τε
  choice: và
  rationale: Tiểu từ nối hành động này với mạch thuật chuyện trước; tiếng Việt thể hiện tự nhiên bằng quan hệ nối tiếp trong câu.
- source_word: ἐπιθέντες
  choice: sau khi đánh
  rationale: Phân từ theo nghĩa đen là “đặt lên”, nhưng khi đi với πληγάς tạo thành cách nói chỉ việc giáng đòn; “sau khi” thể hiện quan hệ thời gian với động từ chính.
- source_word: ἔβαλον εἰς φυλακήν
  choice: ném họ vào tù
  rationale: Giữ sắc thái mạnh và sinh động của βάλλω, thay vì làm nhẹ thành “đưa” hay “giam”.
- source_word: φυλακήν
  choice: tù
  rationale: Trong ngữ cảnh có viên cai ngục, từ này chỉ nơi giam giữ; “tù” là cách diễn đạt rõ ràng, thông dụng.
- source_word: παραγγείλαντες
  choice: ra lệnh
  rationale: Thể hiện đúng thẩm quyền và sức nặng mệnh lệnh của παραγγέλλω.
- source_word: δεσμοφύλακι
  choice: viên cai ngục
  rationale: Chỉ người chịu trách nhiệm quản giữ tù nhân; “viên cai ngục” trang trọng vừa phải và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἀσφαλῶς
  choice: thật nghiêm ngặt
  rationale: Trong ngữ cảnh giam giữ, trạng từ nhấn mạnh việc canh giữ chắc chắn, không để tù nhân trốn thoát, chứ không phải bảo đảm an toàn cho họ.
- source_word: τηρεῖν
  choice: canh giữ
  rationale: Trong ngữ cảnh nhà tù, “canh giữ” diễn đạt rõ nghĩa quản thúc và đề phòng trốn thoát.
- source_word: αὐτούς
  choice: họ
  rationale: Chỉ Phao-lô và Si-la, là đối tượng bị bỏ tù và phải được canh giữ.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang nghiêm và dễ hiểu. “Ném họ vào tù” giữ sức mạnh của động từ Hy Lạp; “canh giữ họ thật nghiêm ngặt” làm rõ ý bảo đảm họ không thể trốn thoát mà không thêm chi tiết ngoài nguyên văn.
