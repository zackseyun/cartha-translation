  rationale: 'Đổi ''thật nghiêm ngặt'' thành ''thật chặt chẽ'' để diễn đạt chính xác sắc thái ἀσφαλῶς: phải canh giữ chắc chắn, không để tù nhân thoát. Chỉnh một phương án trong chú thích a cho tự nhiên hơn, không thay đổi nghĩa hay mức độ xác định của nguyên văn.'
