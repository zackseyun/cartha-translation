  text: τοῦτο δὲ ἐποίει ἐπὶ πολλὰς ἡμέρας. διαπονηθεὶς ⸀δὲ Παῦλος καὶ ἐπιστρέψας τῷ πνεύματι εἶπεν· Παραγγέλλω σοι ⸀ἐν ὀνόματι Ἰησοῦ Χριστοῦ ἐξελθεῖν ἀπ’ αὐτῆς· καὶ ἐξῆλθεν αὐτῇ τῇ ὥρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/016/018.yaml
  text: And she kept doing this for many days[a]. But Paul, becoming greatly troubled, turned to the spirit and said[b], “I command you in the name of Jesus the Messiah to come out of her.” And it came out that very hour.
translation:
  language: vi
  text: Cô cứ làm như vậy suốt nhiều ngày. Nhưng Phao-lô, vô cùng phiền lòng, quay lại nói với linh ấy:[a] “Nhân danh Giê-su, Đấng Mê-si, ta truyền cho ngươi phải ra khỏi cô ấy!” Ngay giờ đó, linh liền ra khỏi cô ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn chỉ nói “với linh”; ngữ cảnh xác định đây là linh đang chi phối cô gái.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίει ἐπὶ πολλὰς ἡμέρας
  choice: cứ làm như vậy suốt nhiều ngày
  rationale: Thể chưa hoàn thành diễn tả hành động tiếp diễn hoặc lặp lại; “cứ làm như vậy” truyền đạt tự nhiên sắc thái này trong tiếng Việt.
- source_word: διαπονηθεὶς
  choice: vô cùng phiền lòng
  rationale: Từ này diễn tả sự khổ tâm, bực bội hoặc bị quấy rầy sâu sắc; cách dịch tránh giảm nhẹ thành sự khó chịu thoáng qua và cũng không quy kết cơn giận.
- source_word: ἐπιστρέψας
  choice: quay lại
  rationale: Diễn tả việc Phao-lô xoay người hướng về phía linh trước khi lên tiếng; “quay lại” tự nhiên trong mạch kể.
- source_word: τῷ πνεύματι
  choice: nói với linh ấy
  rationale: Nguyên văn chỉ nói “với linh”; “linh ấy” giữ nguyên cách gọi không thêm tính từ “ác” hay danh từ “quỷ”, trong khi ngữ cảnh xác định đối tượng.
- source_word: Παραγγέλλω σοι
  choice: ta truyền cho ngươi
  rationale: Diễn tả mệnh lệnh có thẩm quyền. Cặp đại từ “ta—ngươi” phù hợp lời truyền trực tiếp cho một linh và giữ giọng trang trọng.
- source_word: ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: nhân danh Chúa Giê-su, Đấng Mê-si
  rationale: “Nhân danh” diễn tả hành động dựa trên thẩm quyền của Đức Giê-su; Χριστός được thể hiện theo nghĩa tước hiệu là “Đấng Mê-si” thay vì bị hiểu như họ riêng.
- source_word: ἐξελθεῖν ἀπ’ αὐτῆς
  choice: phải ra khỏi cô ấy
  rationale: Cấu trúc tiếng Việt tự nhiên cho mệnh lệnh trục xuất linh; “phải” làm rõ lực mệnh lệnh của παραγγέλλω kết hợp với động từ nguyên mẫu.
- source_word: ἐξῆλθεν αὐτῇ τῇ ὥρᾳ
  choice: Ngay giờ đó, linh liền ra khỏi cô
  rationale: αὐτῇ τῇ ὥρᾳ nhấn mạnh sự ứng nghiệm tức thì. Nêu lại “linh” làm chủ ngữ cho rõ trong tiếng Việt mà không thêm nội dung ngoài ngữ cảnh.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong công thức ἐν ὀνόματι Ἰησοῦ Χριστοῦ
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Χριστός ở đây mang nghĩa tước hiệu chỉ Đấng được xức dầu. “Đấng Mê-si” bảo toàn chức năng tước hiệu và tránh để từ này bị đọc như một phần tên riêng.
- issue: Có nên xác định πνεῦμα là quỷ hoặc ác linh trong chính văn hay không
  choice: linh ấy
  alternative: ác linh; quỷ
  rationale: Câu Hy Lạp chỉ dùng πνεῦμα, không có từ bổ nghĩa “ác” và cũng không dùng δαιμόνιον. Vì vậy chính văn giữ cách gọi rộng hơn, còn ngữ cảnh cho biết đây là linh đang chi phối cô gái.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “Chúa Giê-su” theo lối gọi phổ biến trong tiếng Việt Cơ Đốc; “Đấng Mê-si” giữ rõ tước hiệu. Trong lời trực tiếp, “ta—ngươi” tạo sắc thái mệnh lệnh uy nghiêm mà không quá cổ.
