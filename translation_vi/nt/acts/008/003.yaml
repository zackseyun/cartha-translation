source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἐλυμαίνετο τὴν ἐκκλησίαν κατὰ τοὺς οἴκους εἰσπορευόμενος, σύρων τε ἄνδρας καὶ γυναῖκας παρεδίδου εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/003.yaml
  text: But Saul was ravaging the church[a], entering house after house; dragging off both men and women[b], he was handing them over to prison.
translation:
  language: vi
  text: 'Nhưng Sau-lơ cứ tàn phá[a] Hội Thánh: ông vào từng nhà[b], lôi cả đàn ông lẫn phụ nữ đi và giao nộp họ vào tù.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cứ hủy hoại” hoặc “cứ tàn hại.” Động từ Hy Lạp mạnh hơn cách nói chung chung “bắt bớ,” hàm ý gây tổn hại dữ dội và liên tục.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “từ nhà này sang nhà khác.” Cụm từ Hy Lạp nhấn mạnh việc lần lượt đi vào nhiều nhà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλυμαίνετο
  choice: cứ tàn phá
  rationale: Động từ diễn tả sự hủy hoại hoặc ngược đãi dữ dội; thì chưa hoàn thành cho thấy hành động đang tiếp diễn hoặc lặp đi lặp lại. “Cứ tàn phá” giữ được cả mức độ mạnh lẫn sắc thái kéo dài.
- source_word: τὴν ἐκκλησίαν
  choice: Hội Thánh
  rationale: Trong ngữ cảnh Công Vụ, từ này chỉ cộng đồng những người tin Chúa, không đơn thuần là một cuộc hội họp dân sự. “Hội Thánh” là cách gọi trang trọng và quen thuộc trong tiếng Việt.
- source_word: κατὰ τοὺς οἴκους
  choice: hết nhà này đến nhà khác
  rationale: κατά đi với danh từ số nhiều có ý nghĩa phân bố, nhấn mạnh việc Sau-lơ lần lượt vào nhiều nhà.
- source_word: εἰσπορευόμενος
  choice: xông vào
  rationale: Phân từ mô tả cách Sau-lơ tàn phá Hội Thánh. “Xông vào” diễn đạt tự nhiên sự đi vào nhà trong bối cảnh bắt người bằng bạo lực, nhưng không thêm một hành động ngoài điều văn cảnh hàm ý.
- source_word: σύρων
  choice: lôi ... đi
  rationale: σύρω chỉ hành động kéo lê hoặc lôi đi bằng sức mạnh. Cách dịch này giữ rõ tính cưỡng bức và sự đưa nạn nhân ra khỏi nhà.
- source_word: ἄνδρας καὶ γυναῖκας
  choice: cả đàn ông lẫn phụ nữ
  rationale: Cấu trúc này làm nổi bật phạm vi không phân biệt giới tính trong hành động của Sau-lơ.
- source_word: παρεδίδου
  choice: giao họ
  rationale: Thì chưa hoàn thành diễn tả việc lặp lại. “Giao” truyền đạt việc trao người bị bắt cho nhà chức trách giam giữ.
- source_word: εἰς φυλακήν
  choice: vào tù
  rationale: φυλακή ở đây chỉ nhà tù hoặc tình trạng bị giam giữ; “vào tù” tự nhiên trong tiếng Việt sau động từ “giao”.
theological_decisions:
- issue: Mức độ nghiêm trọng trong hành động của Sau-lơ trước khi ông tin Chúa
  choice: Dùng “cứ tàn phá Hội Thánh” thay vì cách nói nhẹ hơn như “cứ bắt bớ Hội Thánh.”
  alternative: cứ bắt bớ Hội Thánh; cứ hủy hoại Hội Thánh
  rationale: Động từ Hy Lạp mô tả sự gây hại dữ dội và có hệ thống. Cách dịch mạnh phản ánh đúng sức nặng của từ mà không đưa thêm cách lý giải thần học về Sau-lơ.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Sau-lơ” và “Hội Thánh” theo cách dùng Kinh Thánh quen thuộc trong tiếng Việt; câu được tách làm hai để sáng nghĩa, đồng thời “cứ” giữ sắc thái tiếp diễn của thì chưa hoàn thành.
