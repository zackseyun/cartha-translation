  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς γὰρ χολὴν πικρίας καὶ σύνδεσμον ἀδικίας ὁρῶ σε ὄντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/023.yaml
  text: For I see that you are in the gall of bitterness and the bond of unrighteousness[a][b].
translation:
  language: vi
  text: Vì tôi thấy anh đang ở trong mật đắng và xiềng xích của sự bất chính[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dây trói của sự bất công” hoặc “gông cùm của điều gian ác.”'
    reason: lexical_alternative
  - marker: b
    text: “Mật đắng” là một ẩn dụ mạnh, có lẽ gợi lại ngôn ngữ Cựu Ước về mật và sự đắng cay (so sánh Phục Truyền Luật Lệ Ký 29:18 trong bản Bảy Mươi).
    reason: cross_reference
lexical_decisions:
- source_word: εἰς
  choice: ở trong
  rationale: Trong cấu trúc với ὁρῶ σε ὄντα, giới từ này chỉ tình trạng hay phạm vi mà Si-môn đang ở trong đó; “ở trong” tự nhiên trong tiếng Việt và giữ hình ảnh của nguyên văn.
- source_word: γὰρ
  choice: Vì
  rationale: Nêu lý do cho lời quở trách trước đó của Phi-e-rơ và bảo toàn quan hệ lập luận.
- source_word: χολὴν πικρίας
  choice: mật đắng
  rationale: Giữ ẩn dụ cô đọng và gay gắt của tiếng Hy Lạp, có thể gợi lại ngôn ngữ Cựu Ước về thứ mật độc gây đắng, thay vì diễn giải phẳng thành “sự cay đắng”.
- source_word: σύνδεσμον ἀδικίας
  choice: xiềng xích của sự bất chính
  rationale: “Xiềng xích” diễn đạt vật trói buộc; “sự bất chính” đủ rộng để chỉ tình trạng sai trái về đạo đức mà không thu hẹp thành một loại bất công xã hội.
- source_word: ὁρῶ
  choice: tôi thấy
  rationale: Vừa sát nghĩa vừa tự nhiên trong tiếng Việt khi nói đến sự nhận biết hoặc nhận định.
- source_word: σε ὄντα
  choice: anh đang ở
  rationale: Chuyển cấu trúc đối cách cộng phân từ thành mệnh đề tiếng Việt tự nhiên; “đang” nhấn mạnh tình trạng hiện tại mà không thêm một kết luận lâu dài.
theological_decisions:
- issue: Cách mô tả ẩn dụ về tình trạng thuộc linh và đạo đức của Si-môn
  choice: Giữ hai hình ảnh “ở trong mật đắng” và “xiềng xích của sự bất chính”.
  alternative: Diễn giải thành “đầy chất độc cay đắng và bị tội lỗi giam cầm”.
  rationale: Nguyên văn dùng những ẩn dụ cô đọng, không đưa ra lời giải thích tín lý rõ hơn. Giữ nguyên sức nặng và độ mở của các hình ảnh tránh áp đặt cách hiểu giáo phái.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “anh” phù hợp với lời Phi-e-rơ nói trực tiếp với Si-môn. Giữ các ẩn dụ của nguyên văn và đặt đầy đủ dấu chú thích [a][b] trong câu chính.
