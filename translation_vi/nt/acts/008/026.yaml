source:
  edition: SBLGNT
  text: Ἄγγελος δὲ κυρίου ἐλάλησεν πρὸς Φίλιππον λέγων· Ἀνάστηθι καὶ πορεύου κατὰ μεσημβρίαν ἐπὶ τὴν ὁδὸν τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν· αὕτη ἐστὶν ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/026.yaml
  text: An angel of the Lord spoke to Philip[a], saying[b], “Get up and go south to the road that goes down from Jerusalem to Gaza.” This is a deserted road.
translation:
  language: vi
  text: 'Một thiên sứ của Chúa phán với Phi-líp: “Hãy đứng dậy và đi về phía nam,[a] đến con đường từ Giê-ru-sa-lem đi xuống Ga-xa.” Đó là con đường vắng vẻ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “vào giữa trưa.” Cụm từ Hy Lạp có thể chỉ phương hướng (“về phía nam”) hoặc thời gian (“vào giữa trưa”).'
    reason: alternative_reading
  - marker: b
    text: 'Hoặc: “Đây là hoang mạc,” có thể có nghĩa là tuyến đường đi qua một vùng hoang mạc, thay vì nhấn mạnh rằng chính con đường vắng vẻ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγγελος δὲ κυρίου
  choice: Nhưng một thiên sứ của Chúa
  rationale: “Một thiên sứ” phản ánh danh từ số ít không có mạo từ; “của Chúa” giữ nguyên cách diễn đạt về tác nhân thuộc về hoặc được Chúa sai phái. δὲ được thể hiện bằng “Nhưng” để nối với sự chuyển cảnh và tương phản nhẹ trong mạch kể.
- source_word: ἐλάλησεν πρὸς Φίλιππον λέγων
  choice: phán với Phi-líp
  rationale: Tiếng Việt không cần giữ công thức kép “nói... rằng”; “phán với” diễn đạt tự nhiên lời của sứ giả thiên thượng và dẫn trực tiếp vào lời trích, không làm thay đổi chủ thể.
- source_word: Ἀνάστηθι καὶ πορεύου
  choice: Hãy đứng dậy và đi
  rationale: Giữ hai mệnh lệnh liên tiếp, rõ ràng và tự nhiên trong tiếng Việt hiện đại.
- source_word: κατὰ μεσημβρίαν
  choice: về phía nam
  rationale: Trong ngữ cảnh chuyển động đến một con đường, nghĩa chỉ phương hướng là hợp lý nhất; nghĩa thời gian “vào giữa trưa” vẫn là khả năng có thật và được ghi chú.
- source_word: τὴν καταβαίνουσαν ἀπὸ Ἰερουσαλὴμ εἰς Γάζαν
  choice: con đường từ Giê-ru-sa-lem đi xuống Ga-xa
  rationale: “Đi xuống” giữ thành ngữ địa lý nói về việc rời vùng cao Giê-ru-sa-lem, đồng thời vẫn tự nhiên trong tiếng Việt.
- source_word: αὕτη ἐστὶν ἔρημος
  choice: Đó là một con đường vắng vẻ
  rationale: Đại từ giống cái nhiều khả năng quy chiếu về ὁδός, nên nêu lại “con đường” cho rõ. ἔρημος có thể chỉ sự hoang vắng hoặc vùng hoang mạc; bản chính chọn nghĩa phù hợp với con đường ít người qua lại và ghi nhận cách hiểu khác trong chú thích.
theological_decisions:
- issue: Ý nghĩa của “Chúa” trong cụm “thiên sứ của Chúa”
  choice: Giữ nguyên “một thiên sứ của Chúa”, không xác định thêm căn tính của thiên sứ.
  alternative: “Một thiên sứ được Đức Chúa Trời sai đến” hoặc hiểu đây là một nhân vật mặc khải đặc thù.
  rationale: Nguyên văn trình bày thiên sứ trong quan hệ với Chúa nhưng không giải thích thêm; bản dịch giữ sự tiết chế thần học ấy.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại, dễ hiểu. Dùng “phán” cho lời thiên sứ trong bối cảnh mặc khải, tên riêng được phiên âm quen thuộc. Các dấu chú thích [a], [b] được đặt ngay sau những cụm từ liên quan.
