revisions:
- from: 'Nhưng một thiên sứ của Chúa phán với Phi-líp: “Hãy đứng dậy và đi về phía nam, đến con đường từ Giê-ru-sa-lem đi xuống Ga-xa.[a]” Đó là một con đường vắng vẻ.[b]'
  to: 'Một thiên sứ của Chúa phán với Phi-líp: “Hãy đứng dậy và đi về phía nam,[a] đến con đường từ Giê-ru-sa-lem đi xuống Ga-xa.” Đó là con đường vắng vẻ.[b]'
  rationale: Bỏ liên từ “Nhưng” để tránh áp đặt tương phản mạnh cho δέ; dời dấu chú thích b đến đúng mệnh đề mà chú thích giải thích; và điều chỉnh cách diễn đạt chú thích b để giữ sự mơ hồ của nguyên văn về “hoang mạc”/“vắng vẻ”. Các lựa chọn từ vựng và văn phong còn lại được giữ nguyên vì trung thành và tự nhiên.
