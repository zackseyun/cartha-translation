source:
  edition: SBLGNT
  text: ὅτε δὲ ἀνέβησαν ἐκ τοῦ ὕδατος, πνεῦμα κυρίου ἥρπασεν τὸν Φίλιππον, καὶ οὐκ εἶδεν αὐτὸν οὐκέτι ὁ εὐνοῦχος, ἐπορεύετο γὰρ τὴν ὁδὸν αὐτοῦ χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/039.yaml
  text: And when they came up out of the water[a], the Spirit of the Lord carried Philip away, and the eunuch saw him no longer, for he went on his way rejoicing.
translation:
  language: vi
  text: Khi họ lên khỏi nước, Thánh Linh của Chúa đem Phi-líp đi[a]; viên thái giám không còn thấy ông nữa, vì viên thái giám tiếp tục lên đường trong niềm vui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Thánh Linh của Chúa chộp lấy Phi-líp mà đem đi.” Động từ Hy Lạp có thể nhấn mạnh việc bị đưa đi cách đột ngột và mạnh mẽ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβησαν ἐκ τοῦ ὕδατος
  choice: họ lên khỏi nước
  rationale: Diễn đạt tự nhiên chuyển động đi lên và ra khỏi nước, đồng thời không suy diễn thêm về cách thức báp-tem.
- source_word: πνεῦμα κυρίου
  choice: Thánh Linh của Chúa
  rationale: Trong văn mạch Lu-ca–Công Vụ, cụm từ này tự nhiên chỉ về Thánh Linh hành động với tư cách tác nhân thần linh; cách viết hoa phản ánh cách hiểu ấy.
- source_word: ἥρπασεν
  choice: đem Phi-líp đi
  rationale: Cách dịch trang trọng, tự nhiên, truyền đạt việc Phi-líp bị đưa đi bởi quyền năng thần linh; sắc thái đột ngột và mạnh của động từ được giữ trong chú thích.
- source_word: οὐκ εἶδεν αὐτὸν οὐκέτι
  choice: không còn thấy ông nữa
  rationale: Tái hiện rõ ý rằng từ thời điểm ấy viên thái giám không thấy Phi-líp nữa.
- source_word: ὁ εὐνοῦχος
  choice: viên thái giám
  rationale: Giữ nguyên danh xưng được nêu rõ trong tiếng Hy Lạp và duy trì tính liên tục của câu chuyện.
- source_word: ἐπορεύετο τὴν ὁδὸν αὐτοῦ
  choice: tiếp tục lên đường
  rationale: Thì chưa hoàn thành mô tả hành động đang tiếp diễn; cách nói này tự nhiên trong tiếng Việt và diễn tả ông tiếp tục hành trình.
- source_word: χαίρων
  choice: lòng đầy vui mừng
  rationale: Diễn đạt trạng thái vui mừng đồng hành với việc tiếp tục hành trình, giữ sức nặng của phân từ chỉ cách thức.
theological_decisions:
- issue: πνεῦμα κυρίου chỉ Thánh Linh hay một sức mạnh thần linh vô ngôi
  choice: 'Tác nhân thần linh có ngôi: “Thánh Linh của Chúa”'
  alternative: “thần linh của Chúa” hoặc một sức mạnh đến từ Chúa
  rationale: Cách dùng trong Lu-ca–Công Vụ thường chỉ Thánh Linh của Đức Chúa Trời đang chủ động hành động. Viết hoa thể hiện cách hiểu này mà không thêm chi tiết ngoài bản văn.
- issue: ἥρπασεν có hàm ý Phi-líp được đưa đi cách đột ngột và siêu nhiên hay không
  choice: Bản chính dùng “đem Phi-líp đi,” còn chú thích nêu sắc thái mạnh hơn
  alternative: “chộp lấy Phi-líp mà đem đi” hoặc “cuốn Phi-líp đi”
  rationale: Văn mạch cho thấy sự can thiệp thần linh, nhưng bản văn không mô tả cơ chế. Cách dịch chính giữ sự kiện mà không giải thích quá mức; chú thích bảo tồn sắc thái đột ngột, mạnh mẽ của động từ.
- issue: Chủ ngữ của ἐπορεύετο
  choice: “ông ấy” chỉ viên thái giám
  alternative: Lặp lại “viên thái giám”
  rationale: Chủ ngữ ngữ pháp và mạch kể cho thấy viên thái giám tiếp tục hành trình. Đại từ giúp câu tiếng Việt tự nhiên nhưng vẫn rõ nghĩa.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Phi-líp” theo lối phiên âm tên riêng Kinh Thánh quen thuộc; dùng “viên thái giám” để chỉ chức phận và “Thánh Linh” theo cách gọi phổ biến trong tiếng Việt Cơ Đốc. Dấu chấm phẩy làm rõ sự chuyển tiếp giữa việc viên thái giám không còn thấy Phi-líp và việc ông tiếp tục hành trình.
