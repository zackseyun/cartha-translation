  source_fidelity: 'Bản dịch phản ánh đúng các yếu tố chính của câu Hy Lạp: sắc thái nhấn mạnh–bổ sung trong καὶ αὐτός, động từ “tin” không áp đặt kết luận thần học, trình tự chịu báp-têm trước hành động kéo dài, các “dấu lạ” và “việc quyền năng lớn lao,” cùng sự kinh ngạc của Si-môn. Tuy nhiên, “luôn gắn bó với” có thể gợi một sự thân thiết hoặc cam kết quan hệ mạnh hơn προσκαρτερῶν τῷ Φιλίππῳ, vốn ở đây trước hết nói việc ông tiếp tục ở gần/đi theo Phi-líp.'
