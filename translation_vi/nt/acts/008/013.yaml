  terminology: “Tin,” “chịu phép báp-têm,” “dấu lạ,” “việc quyền năng lớn lao,” và “kinh ngạc” đều phù hợp. Chú thích giữ đúng khả năng từ vựng của δυνάμεις mà không đồng nhất hóa bắt buộc với “phép lạ.”
  issues:
