id: ACT.8.13
reference: Acts 8:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ δὲ Σίμων καὶ αὐτὸς ἐπίστευσεν, καὶ βαπτισθεὶς ἦν προσκαρτερῶν τῷ Φιλίππῳ, θεωρῶν τε ⸂σημεῖα καὶ δυνάμεις μεγάλας γινομένας⸃ ἐξίστατο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/013.yaml
  text: And Simon himself also believed[a], and after being baptized he continued with Philip, and as he saw signs and great works of power happening, he was amazed.
translation:
  language: vi
  text: Chính Si-môn cũng tin, và sau khi chịu phép báp-têm, ông tiếp tục ở bên Phi-líp. Khi thấy những dấu lạ và những việc quyền năng lớn lao[a] đang xảy ra, ông kinh ngạc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “những phép lạ lớn lao”. Từ Hy Lạp này có thể chỉ những biểu hiện của quyền năng cũng như các phép lạ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: chính ... cũng
  rationale: 'Giữ cả sắc thái nhấn mạnh của αὐτός và ý bổ sung của καί: ngay chính Si-môn cũng có phản ứng như những người khác.'
- source_word: ἐπίστευσεν
  choice: tin
  rationale: Dịch trực tiếp động từ πιστεύω, không thêm lời xác định đức tin ấy là chân thật, giả tạo hay hời hợt.
- source_word: βαπτισθεὶς
  choice: sau khi chịu phép báp-têm
  rationale: Phân từ bất định thụ động diễn tả hành động xảy ra trước hành động kéo dài của mệnh đề chính; cách dịch này làm rõ trình tự một cách tự nhiên.
- source_word: ἦν προσκαρτερῶν τῷ Φιλίππῳ
  choice: ông luôn gắn bó với Phi-líp
  rationale: Kết cấu vị ngữ vòng ở thì chưa hoàn thành diễn tả sự tiếp tục kéo dài; “luôn gắn bó với” truyền đạt việc Si-môn cứ ở gần và theo sát Phi-líp mà không cường điệu thành sự tận hiến thuộc linh.
- source_word: θεωρῶν
  choice: khi thấy
  rationale: Diễn đạt tự nhiên hành động tri giác đang diễn ra và mối liên hệ giữa điều Si-môn chứng kiến với sự kinh ngạc của ông.
- source_word: σημεῖα
  choice: những dấu lạ
  rationale: “Dấu lạ” là cách nói tự nhiên trong tiếng Việt, đồng thời giữ được sắc thái các sự việc mang ý nghĩa làm dấu chứng.
- source_word: δυνάμεις μεγάλας
  choice: những việc quyền năng lớn lao
  rationale: Giữ ý nghĩa về những biểu hiện hay công việc của quyền năng thay vì mặc nhiên thu hẹp từ này thành “phép lạ”; chú thích cung cấp cách hiểu quen thuộc hơn.
- source_word: γινομένας
  choice: đang xảy ra
  rationale: Giữ sắc thái diễn tiến của phân từ hiện tại và trình bày các dấu lạ cùng việc quyền năng như những sự kiện diễn ra trước mắt Si-môn.
- source_word: ἐξίστατο
  choice: ông kinh ngạc
  rationale: Thì chưa hoàn thành cho thấy trạng thái kinh ngạc kéo dài; “kinh ngạc” trang trọng, rõ nghĩa và tự nhiên.
theological_decisions:
- issue: Liệu cách dịch việc Si-môn tin có nên quyết định rằng ông đã thật sự quy đạo hay không
  choice: Chỉ dịch ἐπίστευσεν là “tin”, không thêm phẩm chất cho đức tin ấy
  alternative: “thật lòng tin”, “tỏ ra tin” hoặc “tin một cách hời hợt”
  rationale: Câu này nói Si-môn tin và chịu phép báp-têm, còn diễn tiến sau đó làm nảy sinh vấn đề giải thích. Bản dịch giữ nguyên sự căng thẳng thần học của trình thuật thay vì áp đặt kết luận.
- issue: Phạm vi nghĩa của δυνάμεις trong ngữ cảnh các dấu lạ
  choice: Dịch là “những việc quyền năng lớn lao”
  alternative: “những phép lạ lớn lao”
  rationale: Cách chọn giữ được ý những biểu hiện của quyền năng và tránh giải quyết quá mức phạm vi nghĩa của danh từ; chú thích nêu cách hiểu “phép lạ” có thể có trong ngữ cảnh.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “phép báp-têm” để diễn đạt danh từ chỉ nghi thức một cách rõ ràng; tên riêng được phiên âm nhất quán. Chia thành hai câu để câu văn tự nhiên mà vẫn giữ quan hệ tuần tự và nguyên nhân trong nguyên văn.
