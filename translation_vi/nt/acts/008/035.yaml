  source_fidelity: 'Bản dịch truyền đạt đúng tiến trình của δέ, thành ngữ ἀνοίξας ... τὸ στόμα, điểm xuất phát từ đoạn Kinh Thánh đang đọc, và nội dung loan báo là Đức Giê-su. Tuy nhiên, trật tự bổ ngữ trong “rao truyền cho ông Tin Lành về Đức Giê-su” hơi gượng và có thể làm mờ cấu trúc: Tin Lành là điều được rao truyền, còn “cho ông” là người nhận.'
