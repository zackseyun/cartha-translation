  terminology: Giữ “Kinh Thánh,” “Tin Lành,” và “Đức Giê-su” là nhất quán với ngữ cảnh và cách dùng Cơ Đốc giáo tiếng Việt. Không cần chú thích thay thế, vì cách diễn đạt chính đã phản ánh đầy đủ nghĩa nội dung của đối cách τὸν Ἰησοῦν.
