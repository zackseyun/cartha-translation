  text: ἀνοίξας δὲ ὁ Φίλιππος τὸ στόμα αὐτοῦ καὶ ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/035.yaml
  text: Then Philip opened his mouth[a], and beginning from this Scripture[b], he proclaimed the good news about Jesus to him.
translation:
  language: vi
  text: Bấy giờ, Phi-líp mở lời, rồi bắt đầu từ đoạn Kinh Thánh này mà rao truyền Tin Lành về Đức Giê-su cho ông.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοίξας ... τὸ στόμα αὐτοῦ
  choice: mở lời
  rationale: Thành ngữ Hy Lạp có nghĩa đen là “mở miệng mình” và chỉ việc bắt đầu nói. “Mở lời” giữ được hình ảnh của nguyên văn nhưng tự nhiên, trang trọng hơn trong tiếng Việt hiện đại.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây, δέ đánh dấu bước tiến tiếp theo trong trình thuật. “Bấy giờ” nối mạch kể chuyện tự nhiên mà không thêm quan hệ nhân quả.
- source_word: ἀρξάμενος ἀπὸ τῆς γραφῆς ταύτης
  choice: bắt đầu từ đoạn Kinh Thánh này
  rationale: Cụm từ xác định đoạn Kinh Thánh vừa được đọc là điểm khởi đầu cho lời giải thích của Phi-líp. “Đoạn Kinh Thánh” diễn đạt tự nhiên trong ngữ cảnh một phần sách Ê-sai vừa được trích dẫn.
- source_word: γραφῆς
  choice: Kinh Thánh
  rationale: Trong ngữ cảnh Tân Ước, γραφή chỉ phần văn bản thánh được nhìn nhận là Kinh Thánh, chứ không đơn thuần là một bản viết.
- source_word: εὐηγγελίσατο
  choice: rao truyền ... Tin Lành
  rationale: Động từ chỉ việc công bố tin mừng. “Rao truyền Tin Lành” vừa giữ sức nặng công bố của động từ vừa dễ hiểu đối với độc giả hiện đại.
- source_word: αὐτῷ
  choice: cho ông
  rationale: Đại từ này chỉ viên quan Ê-thi-ô-pi trong văn cảnh. “Cho ông” tự nhiên trong tiếng Việt và không đưa thêm danh xưng không có trong câu.
- source_word: τὸν Ἰησοῦν
  choice: về Đức Giê-su
  rationale: Sau εὐαγγελίζομαι, đối cách này nêu nội dung và trọng tâm của Tin Lành được công bố. Cách dịch “về Đức Giê-su” làm rõ quan hệ ấy trong tiếng Việt.
theological_decisions:
- issue: Ý nghĩa của εὐηγγελίσατο αὐτῷ τὸν Ἰησοῦν
  choice: Phi-líp rao truyền cho viên quan Tin Lành về Đức Giê-su, với chính Đức Giê-su là nội dung và trọng tâm của lời công bố.
  alternative: Phi-líp rao giảng Đức Giê-su cho ông.
  rationale: Nguyên văn đặt “Đức Giê-su” làm nội dung của hành động loan báo Tin Lành. Bản dịch chính diễn đạt rõ cấu trúc này bằng tiếng Việt tự nhiên, không thêm một kết luận giáo phái nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Mở lời” tránh sắc thái tiêu cực mà “mở miệng” đôi khi có trong tiếng Việt, đồng thời vẫn phản ánh thành ngữ Hy Lạp. “Tin Lành” được viết hoa như cách gọi nội dung tin mừng về Đức Giê-su trong ngữ cảnh này.
