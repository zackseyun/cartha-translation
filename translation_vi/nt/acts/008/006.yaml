id: ACT.8.6
reference: Acts 8:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: προσεῖχον ⸀δὲ οἱ ὄχλοι τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου ὁμοθυμαδὸν ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/006.yaml
  text: And the crowds with one accord paid close attention to what was being said by Philip[b][a], as they heard him and saw the signs that he was doing.
translation:
  language: vi
  text: Các đám đông đều đồng lòng chú ý[a] đến những điều Phi-líp nói, khi họ nghe ông và thấy những dấu lạ ông đang làm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “chăm chú lắng nghe” hoặc “lưu ý đến”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: chăm chú nghe
  rationale: Động từ chỉ việc hướng và duy trì sự chú ý. Trong ngữ cảnh lời giảng, “chăm chú nghe” tự nhiên trong tiếng Việt và giữ được sắc thái tiếp diễn của thì chưa hoàn thành.
- source_word: δὲ
  choice: không dịch riêng
  rationale: Đây là liên từ chuyển tiếp nhẹ trong mạch kể; tiếng Việt không cần biểu đạt bằng một từ riêng ở đây.
- source_word: οἱ ὄχλοι
  choice: các đám đông
  rationale: Giữ dạng số nhiều của nguyên văn và chỉ những nhóm người tụ họp.
- source_word: τοῖς λεγομένοις ὑπὸ τοῦ Φιλίππου
  choice: những điều Phi-líp nói
  rationale: Diễn đạt tự nhiên nội dung đang được Phi-líp nói, đồng thời tránh cách bị động nặng nề trong tiếng Việt.
- source_word: ὁμοθυμαδὸν
  choice: đều đồng lòng
  rationale: Thể hiện sự hưởng ứng chung và thống nhất của các đám đông, mạnh hơn nghĩa đơn thuần là “cùng nhau”.
- source_word: ἐν τῷ ἀκούειν αὐτοὺς καὶ βλέπειν
  choice: vì họ nghe ông và thấy
  rationale: 'Cấu trúc có thể nêu hoàn cảnh đồng thời hoặc cơ sở của sự chú ý. “Vì” phù hợp mạch ý: việc nghe Phi-líp và thấy các dấu lạ khiến họ chú tâm. Đại từ có hình thái số nhiều trong bản SBLGNT nhưng ngữ cảnh đòi hỏi đối tượng được nghe là Phi-líp; vì vậy dịch “ông”.'
- source_word: τὰ σημεῖα
  choice: những dấu lạ
  rationale: “Dấu lạ” là cách nói tiếng Việt rõ ràng cho σημεῖα, vừa chỉ hành động phi thường vừa giữ ý nghĩa chúng là những dấu hiệu, không chỉ là phép mầu.
- source_word: ἃ ἐποίει
  choice: ông đang làm
  rationale: Giữ sắc thái hành động đang tiếp diễn của thì chưa hoàn thành mà không thêm ý “thực hiện phép lạ” vốn không có trực tiếp trong động từ.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Phi-líp” theo lối phiên âm tên riêng quen thuộc trong Kinh Thánh tiếng Việt. Đặt “đều đồng lòng” trước “chăm chú nghe” để giữ sự nhấn mạnh vào phản ứng thống nhất của đám đông.
