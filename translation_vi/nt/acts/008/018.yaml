  text: ⸀ἰδὼν δὲ ὁ Σίμων ὅτι διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων δίδοται τὸ ⸀πνεῦμα προσήνεγκεν αὐτοῖς χρήματα
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/018.yaml
  text: But when Simon saw that the Spirit was given through the laying on of the apostles’ hands[a], he offered them money,
translation:
  language: vi
  text: Nhưng khi Si-môn thấy Thánh Linh[a] được ban qua sự đặt tay của các sứ đồ, ông đề nghị đưa tiền cho họ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn viết “Thần Khí” hoặc “Linh,” không kèm từ “thánh”; trong ngữ cảnh này, từ ấy chỉ về Đức Thánh Linh.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: khi ... thấy
  rationale: Phân từ bất định quá khứ của ὁράω mang chức năng chỉ thời gian; cách dịch này tự nhiên và giữ trình tự dẫn đến hành động của Si-môn.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu bước chuyển nhẹ, có sắc thái tương phản với diễn tiến trước đó; “Nhưng” diễn đạt phù hợp phản ứng của Si-môn.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν τῶν ἀποστόλων
  choice: qua việc các sứ đồ đặt tay
  rationale: διά với sở hữu cách diễn tả phương tiện. Cách nói chủ động hóa danh từ hành động là tự nhiên trong tiếng Việt mà vẫn giữ quan hệ phương tiện và tác nhân đặt tay.
- source_word: δίδοται
  choice: được ban
  rationale: Giữ thể bị động của động từ hiện tại trong lời thuật, đồng thời không xác định thêm ai là nguồn ban.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Danh từ có nghĩa đen là “Linh/Thần Khí”; ngữ cảnh trực tiếp xác định đối tượng là Đức Thánh Linh. “Thánh Linh” rõ nghĩa và tự nhiên, còn ghi chú bảo lưu dạng ngắn của nguyên văn.
- source_word: προσήνεγκεν αὐτοῖς χρήματα
  choice: ông đem tiền đến biếu họ
  rationale: προσφέρω ở đây là đem đến để trao hoặc đề nghị trao; “đem tiền đến biếu” truyền đạt hành động đề nghị dùng tiền mà chưa diễn giải quá mức động cơ.
theological_decisions:
- issue: Đối tượng được chỉ bởi τὸ πνεῦμα
  choice: Thánh Linh
  alternative: Linh
  rationale: Nguyên văn chỉ viết “Linh”, nhưng mạch văn ngay trước đó xác định rõ là Đức Thánh Linh. Bản chính dùng cách gọi rõ ràng trong tiếng Việt, và chú thích ghi nhận hình thức ngắn của tiếng Hy Lạp.
- issue: Phương tiện trong việc ban Thánh Linh
  choice: được ban qua việc các sứ đồ đặt tay
  alternative: được ban bởi việc các sứ đồ đặt tay
  rationale: “Qua” giữ giá trị phương tiện của διά với sở hữu cách mà không biến các sứ đồ thành nguồn tối hậu ban Thánh Linh, cũng không áp đặt kết luận bí tích hay phản bí tích lên câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Si-môn”, “sứ đồ”, “đặt tay” và “Thánh Linh” theo lối diễn đạt Kinh Thánh quen thuộc; tránh lối Hán-Việt nặng như “sự án thủ” hay “thần khí” trong câu chính.
