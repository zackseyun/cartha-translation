  source_fidelity: 'Câu dịch giữ đúng trình tự và các quan hệ chính của bản Hy Lạp: Si-môn thấy, Thánh Linh được ban qua sự đặt tay của các sứ đồ, rồi ông đưa ra tiền. Tuy nhiên, “đem tiền đến biếu họ” dễ biểu thị việc tặng biếu đã thực hiện và mang sắc thái quà biếu, trong khi προσήνεγκεν ở đây là đưa ra/đề nghị tiền trong cuộc trao đổi tiếp theo.'
