  yaml_path: translation/nt/acts/008/037.yaml
  text: And Philip[a] said, “If you believe with all your heart, you may.” And he answered and said, “I believe that Jesus is the Messiah, the Son of God.”
translation:
  language: vi
  text: 'Phi-líp[a] nói: “Nếu ông hết lòng tin thì được phép.” Người ấy đáp: “Tôi tin Đức Chúa Giê-xu Ki-tô là Con Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Câu này không có trong các thủ bản Hy Lạp cổ nhất, gồm các thủ bản giấy cói từ thế kỷ thứ ba và các thủ bản Sinaiticus, Vaticanus từ thế kỷ thứ tư, cũng như trong các bản dịch Coptic cổ. Câu này có trong truyền thống đa số Byzantine và truyền thống La-tinh, đồng thời được các giáo phụ thời đầu như Irenaeus và Cyprian trích dẫn vào cuối thế kỷ thứ hai. Nhiều học giả cho rằng đây là một công thức phụng vụ báp-têm có từ sớm, về sau được đưa vào phần tường thuật của sách Công Vụ.
    reason: textual_critical
lexical_decisions:
- source_word: ἔξεστιν
  choice: thì được phép
  rationale: Động từ vô nhân xưng này diễn tả điều được phép; trong ngữ cảnh, câu nói ngầm chỉ việc người ấy có thể được làm phép báp-têm.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: hết lòng
  rationale: Thành ngữ tự nhiên trong tiếng Việt, truyền đạt đức tin trọn vẹn và chân thành mà không cần diễn giải quá mức.
- source_word: Πιστεύω
  choice: Tôi tin
  rationale: Phù hợp với lời tuyên xưng về căn tính của Đức Chúa Giê-xu, bao hàm sự xác tín mà không thêm ý ngoài văn bản.
- source_word: Χριστόν
  choice: Đấng Ki-tô
  rationale: Giữ tước hiệu tương ứng với Χριστός và tránh biến nó thành một phần của tên riêng; cách nói này quen thuộc trong văn phong Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Quan hệ giữa các danh hiệu trong lời tuyên xưng
  choice: “Đức Chúa Giê-xu là Đấng Ki-tô, Con Đức Chúa Trời”
  alternative: “Đức Chúa Giê-xu Ki-tô là Con Đức Chúa Trời”
  rationale: Cách chọn phản ánh sát hơn cấu trúc Hy Lạp, trong đó Ἰησοῦν là chủ thể còn Χριστόν và τὸν υἱὸν τοῦ θεοῦ cùng xác định căn tính của Ngài; đồng thời giữ sắc thái Χριστός là tước hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Đại từ “ông” phù hợp với cách người kể chuyện nói về viên thái giám trong ngữ cảnh; “thì được phép” giữ nghĩa của ἔξεστιν, dù đối tượng được phép làm gì được hiểu từ câu hỏi xin chịu báp-têm ở câu trước.
