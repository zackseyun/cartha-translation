id: ACT.8.33
reference: Acts 8:33
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν τῇ ⸀ταπεινώσει ἡ κρίσις αὐτοῦ ἤρθη· ⸀τὴν γενεὰν αὐτοῦ τίς διηγήσεται; ὅτι αἴρεται ἀπὸ τῆς γῆς ἡ ζωὴ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/033.yaml
  text: In his humiliation justice was taken away from him[b][a]. Who will recount his generation? For his life is taken from the earth.
translation:
  language: vi
  text: Trong lúc bị hạ nhục, công lý đã bị tước khỏi người.[b] Ai sẽ kể về thế hệ của người?[a] Vì sự sống của người bị cất khỏi mặt đất.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “dòng dõi của người” hoặc “những người đương thời với người”; từ Hy Lạp được dịch là “thế hệ” giữ nguyên sự mơ hồ trong lời trích Ê-sai 53.
    reason: alternative_reading
  - marker: b
    text: Hay “sự phán xét đã bị cất khỏi người.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώσει
  choice: bị hạ nhục
  rationale: Diễn đạt trạng thái bị hạ thấp và làm nhục trong bối cảnh chịu khổ, tự nhiên hơn danh từ trừu tượng trong tiếng Việt.
- source_word: κρίσις
  choice: công lý
  rationale: Trong ngữ cảnh pháp lý này, từ này có thể chỉ sự xét xử hoặc công lý. “Công lý” diễn đạt việc người ấy bị tước mất sự đối xử công bằng; nghĩa “sự phán xét” được giữ ở chú thích.
- source_word: ἤρθη
  choice: đã bị tước đoạt
  rationale: Thể bị động của αἴρω chỉ sự loại bỏ hay tước mất; cách dịch này phù hợp tự nhiên với “công lý”.
- source_word: γενεὰν
  choice: thế hệ
  rationale: Giữ độ rộng và sự khó hiểu có thật của γενεά trong lời trích Ê-sai, không tự ý quyết định là dòng dõi hay những người đồng thời.
- source_word: διηγήσεται
  choice: sẽ thuật lại
  rationale: Diễn đạt hành động kể lại hoặc trình bày đầy đủ, đồng thời giữ dạng tương lai của câu hỏi tu từ.
- source_word: αἴρεται
  choice: bị cất khỏi
  rationale: Giữ ý bị đưa đi hoặc loại khỏi, với sắc thái bị động của nguyên văn.
- source_word: γῆς
  choice: mặt đất
  rationale: Là cách nói tiếng Việt tự nhiên trong cụm chỉ sự sống bị lấy khỏi cõi sống trên đất; không thu hẹp nghĩa thành một vùng đất cụ thể.
- source_word: ζωὴ
  choice: sự sống
  rationale: Giữ danh từ của nguyên văn và chỉ đời sống bị lấy đi trong bối cảnh cái chết.
theological_decisions:
- issue: Ý nghĩa của “thế hệ của người”
  choice: Giữ “thế hệ của người” trong chính văn.
  alternative: “dòng dõi của người” hoặc “những người đương thời với người”
  rationale: Cụm từ trích từ Ê-sai 53 có nhiều cách hiểu. Chính văn giữ sự mơ hồ của tiếng Hy Lạp, còn các cách hiểu chính được nêu trong chú thích.
- issue: Nghĩa của κρίσις
  choice: Dịch là “công lý”.
  alternative: “sự phán xét” hoặc “việc xét xử”
  rationale: Ngữ cảnh có thể nói đến việc bị tước mất sự xét xử công bằng. “Công lý” truyền đạt ý bị khước từ lẽ công bằng mà không loại bỏ khả năng dịch sát hơn là “sự phán xét”, được ghi ở chú thích.
- issue: Cách viết đại từ chỉ nhân vật trong lời trích
  choice: Dùng “người” viết thường.
  alternative: “Người” viết hoa
  rationale: Lời trích tự nó chưa nêu đích danh nhân vật; viết thường tránh dùng quy ước viết hoa để giải quyết trước câu hỏi về đối tượng mà đoạn kế tiếp mới bàn đến.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ đọc. Cấu trúc được điều chỉnh vừa đủ cho tiếng Việt tự nhiên, trong khi vẫn giữ câu hỏi tu từ, thể bị động và những điểm mơ hồ quan trọng của nguyên văn.
