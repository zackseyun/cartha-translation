revisions:
- from: Khi người bị hạ nhục, công lý dành cho người đã bị tước đoạt.[b] Ai sẽ thuật lại thế hệ của người?[a] Vì sự sống của người bị cất khỏi mặt đất.
  to: Trong lúc bị hạ nhục, công lý đã bị tước khỏi người.[b] Ai sẽ kể về thế hệ của người?[a] Vì sự sống của người bị cất khỏi mặt đất.
  rationale: Chỉnh nhẹ cấu trúc câu đầu cho sát quan hệ ngữ pháp của nguyên văn và tự nhiên trong tiếng Việt; cải thiện cách kết hợp ở câu hỏi tu từ; và thay chú thích b bằng phương án từ vựng tương đương trực tiếp, không thêm ý “hủy bỏ” thủ tục xét xử. Các điểm mơ hồ về “thế hệ” và κρίσις vẫn được giữ nguyên.
