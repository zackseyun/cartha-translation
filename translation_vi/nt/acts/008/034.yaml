  text: ἀποκριθεὶς δὲ ὁ εὐνοῦχος τῷ Φιλίππῳ εἶπεν· Δέομαί σου, περὶ τίνος ὁ προφήτης λέγει ⸀τοῦτο; περὶ ἑαυτοῦ ἢ περὶ ἑτέρου τινός;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/034.yaml
  text: Then the eunuch answered Philip and said[a], “I ask you, about whom does the prophet say this—about himself or about someone else?”
translation:
  language: vi
  text: 'Viên hoạn quan hỏi Phi-líp: “Xin ông cho tôi biết, nhà tiên tri nói điều này về ai—về chính mình hay về một người nào khác?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: hỏi
  rationale: Cụm phân từ kèm động từ nói là công thức dẫn lời trong văn kể chuyện. Trong ngữ cảnh, lời đáp mang hình thức một câu hỏi; “hỏi” diễn đạt tự nhiên chức năng hội thoại mà không lặp cứng “đáp... nói”.
- source_word: ὁ εὐνοῦχος
  choice: viên hoạn quan
  rationale: Giữ nghĩa cụ thể của εὐνοῦχος, đồng thời dùng cách gọi tự nhiên và trang trọng trong tiếng Việt.
- source_word: τῷ Φιλίππῳ
  choice: Phi-líp
  rationale: Dữ cách chỉ người tiếp nhận lời nói; tiếng Việt đặt tên người sau động từ “hỏi” mà không cần giới từ.
- source_word: Δέομαί σου
  choice: Xin ông cho tôi biết
  rationale: δέομαι biểu thị lời thỉnh cầu kính trọng. Cách dịch này tự nhiên trong tiếng Việt, giữ sắc thái lịch sự và phù hợp với yêu cầu giải thích ngay sau đó.
- source_word: περὶ τίνος
  choice: về ai
  rationale: περί với sở hữu cách chỉ đối tượng được nói đến; “về ai” ngắn gọn và tự nhiên.
- source_word: ὁ προφήτης
  choice: nhà tiên tri
  rationale: Giữ danh từ xác định chỉ tác giả lời tiên tri đang được đọc.
- source_word: λέγει τοῦτο
  choice: nói điều này
  rationale: τοῦτο quy chiếu đến đoạn Kinh Thánh vừa được đọc; số ít “điều này” phản ánh hình thức Hy Lạp.
- source_word: περὶ ἑαυτοῦ
  choice: về chính mình
  rationale: Giữ rõ nghĩa phản thân, quy về nhà tiên tri.
- source_word: περὶ ἑτέρου τινός
  choice: về một người nào khác
  rationale: Giữ cả tính bất định của τις và sự tương phản của ἕτερος với “chính mình”.
theological_decisions:
- issue: Danh tính của người được lời tiên tri nói đến
  choice: Không xác định trong câu này
  alternative: Nêu rõ là Chúa Giê-su
  rationale: Câu Hy Lạp ghi lại câu hỏi còn để ngỏ của viên hoạn quan; bản dịch không nên giải đáp trước phần trình bày tiếp theo của Phi-líp.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Viên hoạn quan” giữ danh tính cụ thể của nhân vật; “Xin ông cho tôi biết” chuyển tải lời thỉnh cầu kính trọng mà không quá cổ kính.
source_grounding:
  english_pob_role: consult_only
