  source_fidelity: 'Bản dịch truyền đạt đúng câu hỏi của viên hoạn quan: đối tượng của lời tiên tri là chính nhà tiên tri hay một người khác. “Viên hoạn quan” giữ nghĩa cụ thể của εὐνοῦχος; “về ai ... về chính mình hay về một người nào khác?” phản ánh sát các cụm περὶ τίνος, περὶ ἑαυτοῦ, và περὶ ἑτέρου τινός. Động từ “hỏi” diễn đạt tự nhiên chức năng của công thức ἀποκριθεὶς ... εἶπεν trong ngữ cảnh lời đáp là một câu hỏi.'
