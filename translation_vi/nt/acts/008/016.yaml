id: ACT.8.16
reference: Acts 8:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ⸀οὐδέπω γὰρ ἦν ἐπ’ οὐδενὶ αὐτῶν ἐπιπεπτωκός, μόνον δὲ βεβαπτισμένοι ὑπῆρχον εἰς τὸ ὄνομα τοῦ ⸀κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/016.yaml
  text: For he had not yet fallen upon any of them[b][a]; they had only been baptized into the name of the Lord Jesus.
translation:
  language: vi
  text: Vì Đức Thánh Linh chưa giáng xuống trên một ai trong số họ; họ mới chỉ chịu phép báp-têm vào danh Chúa Giê-su.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong danh Chúa Giê-su.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέπω
  choice: chưa
  rationale: 'Diễn đạt tự nhiên ý thời gian: cho đến lúc ấy sự việc vẫn chưa xảy ra.'
- source_word: ἐπιπεπτωκός ἐπ’ οὐδενὶ αὐτῶν
  choice: chưa giáng xuống trên một ai trong số họ
  rationale: “Giáng xuống trên” giữ hình ảnh chuyển động của ἐπιπίπτω và phù hợp cách nói trang trọng, dễ hiểu về Đức Thánh Linh trong Công Vụ.
- source_word: μόνον
  choice: mới chỉ
  rationale: Nêu rõ sự giới hạn và tương phản giữa việc họ đã chịu phép báp-têm với việc Đức Thánh Linh chưa giáng xuống.
- source_word: βεβαπτισμένοι ὑπῆρχον
  choice: họ mới chỉ chịu phép báp-têm
  rationale: Cấu trúc diễn tả một hành động đã hoàn tất với trạng thái còn hiệu lực; tiếng Việt không cần đánh dấu thì quá khứ hoàn thành riêng khi mạch văn đã rõ.
- source_word: εἰς τὸ ὄνομα
  choice: vào danh
  rationale: Giữ hướng nghĩa của εἰς (“vào”) và tránh làm phẳng thành một công thức chỉ phương tiện; cách nói vẫn hiểu được trong văn phong Kinh Thánh tiếng Việt.
- source_word: κυρίου Ἰησοῦ
  choice: Chúa Giê-su
  rationale: Dịch κύριος bằng “Chúa” và phiên âm tên Ἰησοῦ theo cách dùng tiếng Việt hiện đại.
theological_decisions:
- issue: Chủ ngữ được hàm ý của ἐπιπεπτωκός
  choice: Nêu rõ “Đức Thánh Linh” từ câu trước
  alternative: Dùng đại từ “Ngài” hoặc để chủ ngữ hàm ý
  rationale: Tiếng Hy Lạp lược chủ ngữ vì Đức Thánh Linh đã được nêu ngay trước đó. Tiếng Việt cần một chủ thể rõ ràng; lặp lại “Đức Thánh Linh” vừa tự nhiên vừa không thêm nội dung ngoài ngữ cảnh.
- issue: Ý nghĩa của εἰς trong lời nói về phép báp-têm
  choice: “vào danh Chúa Giê-su”
  alternative: “nhân danh Chúa Giê-su” hoặc “trong danh Chúa Giê-su”
  rationale: “Vào danh” bảo tồn nét nghĩa của εἰς mà không dùng câu này để phân xử các tranh luận thần học về công thức hay hiệu lực của phép báp-têm.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “phép báp-têm” vì đây là thuật ngữ quen thuộc, tương đối trung tính trong tiếng Việt Tin Lành; “giáng xuống trên” giữ hình ảnh Hy Lạp mà không quá gượng. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
