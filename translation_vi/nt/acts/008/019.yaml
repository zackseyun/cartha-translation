  text: saying[a], “Give me also this authority, so that anyone on whom I lay my hands may receive the Holy Spirit.”
translation:
  language: vi
  text: 'Ông nói: “Xin ban thẩm quyền này cho tôi nữa, để bất cứ ai được tôi đặt tay trên đều nhận được Đức Thánh Linh.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: ông nói
  rationale: Phân từ hiện tại nối lời của Si-môn với hành động ở câu trước; tiếng Việt tự nhiên dùng động từ hữu hạn “ông nói” mà không làm thay đổi quan hệ trần thuật.
- source_word: Δότε
  choice: Xin ban cho
  rationale: Động từ mệnh lệnh số nhiều có nghĩa cơ bản là “hãy cho.” Thêm “xin” diễn đạt tự nhiên lời yêu cầu trực tiếp trong tiếng Việt, còn “ban cho” phù hợp với điều Si-môn xin nhận từ các sứ đồ.
- source_word: κἀμοί
  choice: cũng ... cho tôi
  rationale: Dạng rút gọn của καί và ἐμοί nhấn mạnh rằng Si-môn muốn chính mình cũng được nhận điều ấy; trật tự tiếng Việt này giữ được ý bao hàm.
- source_word: ἐξουσίαν
  choice: thẩm quyền
  rationale: ἐξουσία có thể chỉ thẩm quyền, quyền hạn hoặc năng lực được trao để hành động. “Thẩm quyền” giữ được nét nghĩa về quyền được phép thực hiện và tránh đồng nhất từ này với những từ Hy Lạp trực tiếp hơn về sức mạnh.
- source_word: ταύτην
  choice: này
  rationale: Đại từ chỉ định quy chiếu đến chính thẩm quyền Si-môn vừa chứng kiến.
- source_word: ἵνα
  choice: để
  rationale: Diễn đạt tự nhiên mục đích hoặc kết quả mà Si-môn mong muốn.
- source_word: ᾧ ἐὰν
  choice: bất cứ ai
  rationale: Đại từ quan hệ kết hợp với ἐάν tạo ý nghĩa bất định, khái quát; “bất cứ ai” truyền đạt rõ nét nghĩa ấy.
- source_word: ἐπιθῶ τὰς χεῖρας
  choice: được tôi đặt tay trên
  rationale: Giữ hình ảnh cụ thể của nghi thức đặt tay, đồng thời kết hợp tự nhiên với cấu trúc “bất cứ ai” trong tiếng Việt.
- source_word: λαμβάνῃ
  choice: đều nhận được
  rationale: Thể giả định dưới ἵνα chỉ kết quả dự kiến. “Đều” phối hợp với “bất cứ ai” để thể hiện phạm vi khái quát mà không biến lời nói thành nhận định của người kể.
- source_word: πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Trong ngữ cảnh sách Công Vụ, cụm từ không có mạo từ này vẫn chỉ Thánh Linh của Đức Chúa Trời. “Đức Thánh Linh” là cách gọi tự nhiên, trang trọng và xác định trong tiếng Việt.
theological_decisions:
- issue: Cách hiểu πνεῦμα ἅγιον khi cụm từ Hy Lạp không có mạo từ
  choice: Đức Thánh Linh
  alternative: một linh thánh; Thánh Linh
  rationale: Ngữ cảnh Công Vụ xác định đây là Thánh Linh của Đức Chúa Trời, không phải một linh bất kỳ. Cách dịch xác định không áp đặt thêm giáo lý mà phản ánh đúng đối tượng được nhắc đến trong mạch truyện.
- issue: ἐξουσίαν nhấn mạnh thẩm quyền hay quyền năng hiệu nghiệm
  choice: thẩm quyền
  alternative: quyền năng; quyền hạn
  rationale: Ngữ cảnh hàm ý khả năng làm phát sinh kết quả, nhưng chính từ ἐξουσία thường nghiêng về quyền hoặc thẩm quyền hành động. Bản dịch giữ nét nghĩa từ vựng này, còn chú thích bảo lưu khả năng dịch là “quyền năng”.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “ông” nối tự nhiên với Si-môn trong mạch văn; lời cầu xin dùng “xin ban cho” để giữ sắc thái trực tiếp mà lịch sự. Dấu chú thích được đặt ngay sau từ “thẩm quyền,” là từ mà chú thích giải thích.
