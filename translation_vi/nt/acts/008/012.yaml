id: ACT.8.12
reference: Acts 8:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐπίστευσαν τῷ Φιλίππῳ εὐαγγελιζομένῳ ⸀περὶ τῆς βασιλείας τοῦ θεοῦ καὶ τοῦ ὀνόματος Ἰησοῦ Χριστοῦ, ἐβαπτίζοντο ἄνδρες τε καὶ γυναῖκες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/012.yaml
  text: But when they believed Philip as he proclaimed the good news about the kingdom of God and the name of Jesus the Messiah[a], they were being baptized, both men and women.
translation:
  language: vi
  text: Nhưng khi họ tin Phi-líp, khi ông rao truyền Tin Mừng về vương quốc Đức Chúa Trời và danh của Giê-su, Đấng Mê-si-a,[a] thì cả nam lẫn nữ đều đang chịu báp-têm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “danh của Giê-su Christ.” Từ Hy Lạp Χριστός ở đây được dịch là “Đấng Mê-si-a” để giữ ý nghĩa tước hiệu.
    reason: Nêu cách dịch truyền thống và làm rõ giá trị tước hiệu của Χριστός.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: ὅτε mở đầu mệnh đề thời gian, còn δέ đánh dấu bước chuyển nhẹ có sắc thái tương phản với diễn biến trước đó.
- source_word: ἐπίστευσαν τῷ Φιλίππῳ
  choice: họ tin Phi-líp
  rationale: πιστεύω với cách dữ cách ở đây chỉ việc tin lời Phi-líp với tư cách người làm chứng, chứ không phải đặt đức tin cứu rỗi nơi ông.
- source_word: εὐαγγελιζομένῳ
  choice: người rao truyền Tin Mừng
  rationale: Phân từ hiện tại bổ nghĩa cho Phi-líp và diễn tả hoạt động đang diễn ra khi dân chúng tin ông; cách dịch này tự nhiên và giữ sắc thái công bố tin lành.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: về vương quốc Đức Chúa Trời
  rationale: περί với sở hữu cách nêu nội dung lời rao truyền; “vương quốc Đức Chúa Trời” là cách diễn đạt rõ ràng, quen thuộc và giữ hình ảnh βασιλεία.
- source_word: τοῦ ὀνόματος Ἰησοῦ Χριστοῦ
  choice: danh của Chúa Giê-su, Đấng Mê-si-a
  rationale: Giữ nguyên mô-típ “danh”, vốn có thể bao hàm con người, thẩm quyền và căn tính được bày tỏ. Χριστός được thể hiện như tước hiệu “Đấng Mê-si-a”, không như họ riêng.
- source_word: ἐβαπτίζοντο
  choice: đều chịu phép báp-têm
  rationale: Dạng chưa hoàn thành bị động mô tả việc lần lượt diễn ra khi nhiều người đáp ứng. Tiếng Việt không cần dùng kết cấu tiến hành nặng nề; ngữ cảnh cùng “cả...lẫn...” truyền đạt hành động trải rộng trên các cá nhân.
- source_word: ἄνδρες τε καὶ γυναῖκες
  choice: cả nam lẫn nữ
  rationale: τε ... καὶ liên kết và bao gồm rõ cả hai nhóm; cách nói này gọn, tự nhiên trong tiếng Việt hiện đại.
theological_decisions:
- issue: Cách dịch Χριστοῦ trong Ἰησοῦ Χριστοῦ
  choice: Chúa Giê-su, Đấng Mê-si-a
  alternative: Chúa Giê-su Christ
  rationale: Trong ngữ cảnh này Χριστός vẫn mang nghĩa tước hiệu. “Đấng Mê-si-a” bảo toàn nội dung cứu thế của từ Hy Lạp và dấu phẩy giúp tiếng Việt đọc tự nhiên như một đồng vị chỉ tước hiệu.
- issue: Ý nghĩa của “tin Phi-líp”
  choice: Giữ đối tượng ngữ pháp là Phi-líp
  alternative: tin điều Phi-líp rao giảng
  rationale: Bản Hy Lạp đặt Φιλίππῳ ở dữ cách sau ἐπίστευσαν. Giữ cấu trúc này tránh diễn giải thay nguyên văn, trong khi mệnh đề tiếp theo đã nêu rõ nội dung ông rao truyền.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Tin Mừng”, “vương quốc Đức Chúa Trời” và “chịu phép báp-têm”; giữ “danh” thay vì diễn giải thành “thẩm quyền” hay “con người” để bảo toàn độ rộng nghĩa của nguyên văn.
