  - severity: low
    issue: Bản dịch hiện tại không biểu thị rõ thể chưa hoàn thành của ἐβαπτίζοντο.
    rationale: «Đều chịu phép báp-têm» có thể hiểu như một sự kiện hoàn tất. Thêm «đang» giữ được nét hành động đang/lần lượt diễn ra mà không áp đặt số lần cụ thể.
