revisions:
- from: Nhưng khi họ tin Phi-líp, người rao truyền Tin Mừng về vương quốc Đức Chúa Trời và danh của Chúa Giê-su, Đấng Mê-si-a,[a] thì cả nam lẫn nữ đều chịu phép báp-têm.
  to: Nhưng khi họ tin Phi-líp, khi ông rao truyền Tin Mừng về vương quốc Đức Chúa Trời và danh của Giê-su, Đấng Mê-si-a,[a] thì cả nam lẫn nữ đều đang chịu báp-têm.
  rationale: Bỏ «Chúa» vì không có trong nguyên văn của câu. Điều chỉnh mệnh đề phân từ thành «khi ông rao truyền» cho tự nhiên và minh bạch hơn trong tiếng Việt. Thêm «đang» để phản ánh thể chưa hoàn thành bị động của ἐβαπτίζοντο. Các thuật ngữ then chốt và độ rộng nghĩa của «danh» được giữ nguyên.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch giữ tốt cấu trúc chính: họ tin Phi-líp khi ông rao truyền Tin Mừng về vương quốc của Đức Chúa Trời và danh của Giê-su, Đấng Mê-si-a; cả nam lẫn nữ được báp-têm. Tuy nhiên, «Chúa» trong «Chúa Giê-su» không có tương ứng trong Ἰησοῦ Χριστοῦ của câu này. Cần bỏ để không thêm một tước hiệu ngoài nguyên văn. Cách «đều đang chịu báp-têm» diễn đạt an toàn khía cạnh chưa hoàn thành của ἐβαπτίζοντο.'
  naturalness: «Nhưng khi họ tin Phi-líp, khi ông rao truyền...» tự nhiên hơn cấu trúc đồng vị «Phi-líp, người rao truyền...», đồng thời làm rõ quan hệ của phân từ. «Cả nam lẫn nữ đều đang chịu báp-têm» trang trọng, dễ hiểu và phản ánh tiến trình đang diễn ra; tuy hơi đánh dấu về thể, điều này phù hợp với nguyên ngữ.
  terminology: Giữ «Tin Mừng», «vương quốc Đức Chúa Trời», «danh», và «Đấng Mê-si-a» là nhất quán và phù hợp. «Đấng Mê-si-a» phản ánh giá trị tước hiệu của Χριστός; chú thích phương án truyền thống cần cũng bỏ «Chúa» vì bản Hy Lạp không có từ này.
  issues:
