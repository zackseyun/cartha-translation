source:
  edition: SBLGNT
  text: ὡς δὲ ἐπορεύοντο κατὰ τὴν ὁδόν, ἦλθον ἐπί τι ὕδωρ, καί φησιν ὁ εὐνοῦχος· Ἰδοὺ ὕδωρ, τί κωλύει με ⸀βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/036.yaml
  text: And as they were going along the road, they came to some water, and the eunuch says, “Look, water! What prevents me from being baptized?”
translation:
  language: vi
  text: 'Khi họ đang đi dọc đường, họ đến một chỗ có nước. Viên hoạn quan nói: “Kìa, nước đây! Có gì ngăn trở tôi chịu báp-têm?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ εὐνοῦχος
  choice: viên hoạn quan
  rationale: Diễn đạt rõ địa vị của nhân vật và giữ nghĩa trực tiếp của danh từ Hy Lạp, với văn phong trang trọng, tự nhiên.
- source_word: ἐπί τι ὕδωρ
  choice: đến một chỗ có nước
  rationale: τι làm cho cách nói mang tính bất định; tiếng Việt tự nhiên hơn khi diễn đạt là một địa điểm có nước thay vì dịch cứng là “một ít nước”.
- source_word: φησιν
  choice: nói
  rationale: Giữ thì hiện tại kể chuyện của tiếng Hy Lạp mà không tạo sự gượng gạo trong tiếng Việt; hình thái tiếng Việt không bắt buộc đánh dấu quá khứ hay hiện tại.
- source_word: Ἰδοὺ ὕδωρ
  choice: Kìa, nước đây!
  rationale: Tái hiện lời chỉ trỏ đầy chú ý và sự hiện diện rõ ràng của nước bằng cách nói tự nhiên trong tiếng Việt.
- source_word: βαπτισθῆναι
  choice: chịu báp-têm
  rationale: Giữ sắc thái bị động của động từ và dùng thuật ngữ phổ thông trong ngữ cảnh Cơ Đốc, không thêm cách thức hay ý nghĩa thần học ngoài câu nguồn.
theological_decisions:
- issue: Điều kiện hay trở ngại đối với việc báp-têm
  choice: Có gì ngăn trở tôi chịu báp-têm?
  alternative: Tại sao tôi không thể chịu báp-têm?
  rationale: Cách dịch đã chọn bám sát τί κωλύει, giữ câu hỏi mở của nhân vật và không tự ý nêu thêm điều kiện thần học.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Câu kể được chia làm hai câu để tự nhiên hơn, nhưng trình tự và quan hệ ý nghĩa của bản Hy Lạp vẫn được giữ nguyên.
