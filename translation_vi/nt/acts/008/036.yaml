  terminology: “Viên hoạn quan” bảo toàn cách gọi trực tiếp ὁ εὐνοῦχος trong khi tránh đồng nhất hóa nhân vật với một chức danh Việt Nam đặc thù. “Chịu báp-têm” là cách dùng Cơ Đốc giáo quen thuộc và giữ được chiều bị động của βαπτισθῆναι.
