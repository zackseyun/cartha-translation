  source_fidelity: 'Bản dịch giữ đúng diễn tiến và ý nghĩa của tiếng Hy Lạp: khi đang đi đường, họ đến chỗ có nước; viên hoạn quan chỉ nước và hỏi điều gì ngăn ông được báp-têm. “Có gì ngăn trở tôi chịu báp-têm?” phản ánh sát τί κωλύει με βαπτισθῆναι mà không thêm điều kiện thần học. Cách không đánh dấu riêng thì hiện tại kể chuyện của φησιν là tự nhiên trong tiếng Việt.'
