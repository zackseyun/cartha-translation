revisions:
- from: Có một người tên là Si-môn, trước đó đã hành nghề pháp thuật[a] trong thành và làm dân Sa-ma-ri kinh ngạc; ông ta nói rằng chính mình là một người vĩ đại[b].
  to: Có một người tên là Si-môn, trước đó đã ở trong thành, thực hành ma thuật và làm dân chúng Sa-ma-ri kinh ngạc; ông ta nói rằng mình là một nhân vật lớn[b].[a]
  rationale: Bản sửa loại bỏ hàm ý không có trong nguyên ngữ rằng Si-môn “hành nghề” pháp thuật, làm rõ rằng ông đã ở trong thành từ trước, và chọn cách nói hiện đại hơn cho lời tự đề cao. Để sửa lỗi cấu trúc neo chú thích, ký hiệu [a] được đặt ngay sau “ma thuật” và [b] sau “một nhân vật lớn.”
