  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng các thành tố chính: một người nam tên Si-môn, sự hiện diện có trước trong thành, việc thực hành ma thuật, làm dân Sa-ma-ri kinh ngạc, và lời tự đề cao. Tuy nhiên, “hành nghề pháp thuật” thêm sắc thái ông làm đó như một nghề nghiệp, trong khi μαγεύων chỉ nói ông thực hành ma thuật. Cấu trúc “trước đó đã hành nghề ... trong thành” cũng dễ khiến “trong thành” chỉ bổ nghĩa cho hoạt động hành nghề, thay vì phản ánh rõ προϋπῆρχεν ἐν τῇ πόλει (“đã ở trong thành từ trước”).'
  naturalness: Văn phong nhìn chung rõ ràng và hiện đại. Bản sửa đặt “ở trong thành” sát với động từ chỉ sự hiện diện, dùng “thực hành ma thuật” tự nhiên, và thay “một người vĩ đại” bằng “một nhân vật lớn” để truyền đạt tốt hơn ý “một người quan trọng/lớn lao” mà không nghe như một khẳng định khách quan của người kể chuyện.
  terminology: “Si-môn” và “Sa-ma-ri” nhất quán, phù hợp lối phiên âm quen thuộc. “Ma thuật” là thuật ngữ trung tính, sát μαγεύω và không áp đặt đánh giá thần học. “Dân chúng Sa-ma-ri” phản ánh τὸ ἔθνος τῆς Σαμαρείας như một tập thể dân cư.
