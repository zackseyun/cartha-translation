id: ACT.8.9
reference: Acts 8:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀνὴρ δέ τις ὀνόματι Σίμων προϋπῆρχεν ἐν τῇ πόλει μαγεύων καὶ ⸀ἐξιστάνων τὸ ἔθνος τῆς Σαμαρείας, λέγων εἶναί τινα ἑαυτὸν μέγαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/009.yaml
  text: A certain man named Simon had previously been in the city practicing magic and astonishing the people of Samaria[a], saying that he himself was someone great[b],
translation:
  language: vi
  text: Có một người tên là Si-môn, trước đó đã ở trong thành, thực hành ma thuật và làm dân chúng Sa-ma-ri kinh ngạc; ông ta nói rằng mình là một nhân vật lớn[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “thực hành phù phép.” Động từ Hy Lạp chỉ việc thực hành các thuật pháp.
    reason: lexical_alternative
  - marker: b
    text: Hay “mình là một người vĩ đại.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ δέ τις
  choice: Có một người
  rationale: Ἀνήρ được dịch đúng theo giới tính là “người” trong ngữ cảnh chỉ một người nam; τις biểu thị tính bất định. δέ là liên từ chuyển ý nhẹ nên không cần thêm một từ nối gượng gạo trong tiếng Việt.
- source_word: ὀνόματι Σίμων
  choice: tên là Si-môn
  rationale: Cách diễn đạt tự nhiên trong tiếng Việt cho cấu trúc ὀνόματι đi với tên riêng; tên Hy Lạp được phiên âm.
- source_word: προϋπῆρχεν
  choice: trước đó đã
  rationale: Diễn đạt ý tồn tại hoặc hoạt động từ trước của προϋπάρχω ở thì chưa hoàn thành, đồng thời tránh suy diễn chính xác khoảng thời gian.
- source_word: ἐν τῇ πόλει
  choice: trong thành
  rationale: Dịch trực tiếp ý nơi chốn; mạo từ xác định hướng về thành đã được nhắc trong văn cảnh.
- source_word: μαγεύων
  choice: hành nghề pháp thuật
  rationale: Diễn tả việc thực hành các thuật pháp một cách liên tục; cụm từ rõ nghĩa với độc giả hiện đại mà không tự thêm phán đoán về nguồn sức mạnh.
- source_word: ἐξιστάνων
  choice: làm ... kinh ngạc
  rationale: Thể hiện nghĩa gây kinh ngạc của ἐξίστημι và giữ quan hệ đồng thời với hoạt động pháp thuật.
- source_word: τὸ ἔθνος τῆς Σαμαρείας
  choice: dân Sa-ma-ri
  rationale: Trong văn cảnh này ἔθνος chỉ tập thể dân chúng, nên “dân” tự nhiên hơn “quốc gia” và không gợi nghĩa chính trị quá mức.
- source_word: λέγων
  choice: nói rằng
  rationale: Bám sát nghĩa thông thường của phân từ λέγων; sắc thái tự tôn đã được thể hiện qua chính nội dung lời nói, không cần đổi thành “khoe khoang” hay “tự xưng”.
- source_word: εἶναί τινα ἑαυτὸν μέγαν
  choice: chính mình là một người vĩ đại
  rationale: “Chính mình” phản ánh đại từ nhấn mạnh ἑαυτόν; “một người vĩ đại” giữ tính bất định của τινα và ý lớn lao, quan trọng của μέγαν.
theological_decisions:
- issue: Cách mô tả hoạt động của Si-môn
  choice: hành nghề pháp thuật
  alternative: làm nghề phù phép; thực hành ma thuật
  rationale: Câu này xác định Si-môn có thực hành các thuật pháp nhưng không nói rõ nguồn siêu nhiên hay đưa ra toàn bộ đánh giá thần học. Bản dịch vì thế không tự thêm các nhãn như “do quỷ” hoặc “trò lừa bịp”.
- issue: Lời tự đề cao của Si-môn
  choice: nói rằng chính mình là một người vĩ đại
  alternative: tự xưng là một nhân vật lớn
  rationale: Cách dịch chính giữ sát động từ “nói” và sự nhấn mạnh vào chính bản thân Si-môn, nhưng không xác định “vĩ đại” thuộc loại địa vị, quyền năng hay phẩm chất nào.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Si-môn” và “Sa-ma-ri” theo lối phiên âm tên riêng quen thuộc trong tiếng Việt. Dấu chấm phẩy giúp tách hoạt động gây kinh ngạc khỏi nội dung lời Si-môn nói mà vẫn giữ chúng trong cùng một câu.
