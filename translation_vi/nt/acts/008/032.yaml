id: ACT.8.32
reference: Acts 8:32
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἡ δὲ περιοχὴ τῆς γραφῆς ἣν ἀνεγίνωσκεν ἦν αὕτη· Ὡς πρόβατον ἐπὶ σφαγὴν ἤχθη, καὶ ὡς ἀμνὸς ἐναντίον τοῦ ⸀κείραντος αὐτὸν ἄφωνος, οὕτως οὐκ ἀνοίγει τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/032.yaml
  text: 'The passage of Scripture that he was reading was this: “Like a sheep he was led to slaughter[a], and like a lamb before the one shearing it is silent[b], so he does not open his mouth.”'
translation:
  language: vi
  text: 'Đoạn Kinh Thánh ông đang đọc là thế này: “Như chiên bị dẫn đến chỗ bị giết[a], và như chiên con im lặng trước người xén lông nó[b], thì người ấy cũng không mở miệng.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để bị giết.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nguyên văn Hy Lạp: “trước người đang xén nó.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιοχὴ τῆς γραφῆς
  choice: phần Kinh Thánh
  rationale: περιοχή chỉ một phần hay đoạn cụ thể của bản văn đang được đọc; “phần Kinh Thánh” tự nhiên trong tiếng Việt và giữ rõ γραφή là Kinh Thánh.
- source_word: ἀνεγίνωσκεν
  choice: đang đọc
  rationale: Thì chưa hoàn thành diễn tả hành động đang tiếp diễn trong quá khứ; ngữ cảnh đã xác lập thời điểm quá khứ nên “đang đọc” là tự nhiên.
- source_word: Ὡς πρόβατον
  choice: Như chiên
  rationale: Giữ phép so sánh do ὡς dẫn nhập và dùng “chiên” theo văn phong Kinh Thánh trang trọng, dễ hiểu.
- source_word: ἐπὶ σφαγὴν
  choice: đến chỗ giết
  rationale: Diễn tả hướng chuyển động tới nơi bị giết; cách dịch này giữ được sắc thái đích đến mà không thêm ý tế lễ.
- source_word: ἤχθη
  choice: bị dẫn
  rationale: Giữ thể bị động của ἄγω và hình ảnh con chiên bị đưa đi.
- source_word: ἀμνὸς
  choice: chiên con
  rationale: Phân biệt ἀμνός, chiên con, với πρόβατον, chiên nói chung.
- source_word: ἐναντίον τοῦ κείραντος αὐτὸν
  choice: trước người xén lông nó
  rationale: Phản ánh sát cấu trúc phân từ “người đang xén nó” nhưng diễn đạt tự nhiên bằng tiếng Việt; “xén lông” làm rõ hành động liên quan đến chiên.
- source_word: ἄφωνος
  choice: im lặng
  rationale: Trong phép so sánh, từ này diễn tả không phát ra tiếng; “im lặng” tự nhiên hơn “không tiếng” hay “câm”.
- source_word: οὕτως
  choice: cũng vậy
  rationale: Nêu kết quả tương ứng của phép so sánh một cách rõ ràng và tự nhiên.
- source_word: οὐκ ἀνοίγει τὸ στόμα αὐτοῦ
  choice: người không mở miệng
  rationale: Giữ thì hiện tại sinh động của lời trích và dùng “người” cho đại từ giống đực chỉ nhân vật được ví với chiên.
theological_decisions:
- issue: Lời trích Ê-sai 53 được áp dụng cho Chúa Giê-su trong ngữ cảnh
  choice: Giữ nguyên hình thức ví von của lời Kinh Thánh, không nêu đích danh Chúa Giê-su trong câu này.
  alternative: Diễn giải trực tiếp rằng người chịu khổ là Chúa Giê-su.
  rationale: Câu này chỉ trình bày đoạn Kinh Thánh đang được đọc; phần tường thuật kế tiếp làm rõ đối tượng. Bản dịch không nên giải quyết trước sự nhận diện mà chính mạch truyện sẽ trình bày.
- issue: Sắc thái của ἐπὶ σφαγὴν
  choice: đến chỗ giết
  alternative: để bị giết; đến lò sát sinh
  rationale: “Đến chỗ giết” giữ hình ảnh và hướng chuyển động của nguyên văn, đồng thời tránh đưa thêm sắc thái mục đích hoặc bối cảnh hiện đại không được nói rõ.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ đọc. Dùng “chiên” để duy trì sắc thái Kinh Thánh quen thuộc; cấu trúc lời trích có nhịp cân đối. Mọi dấu chú thích đều được đặt trong chính văn.
