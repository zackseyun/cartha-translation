base_translation:
  language: en
  yaml_path: translation/nt/acts/008/017.yaml
  text: Then they laid their hands on them, and they were receiving the Holy Spirit.
translation:
  language: vi
  text: Bấy giờ, họ đặt tay trên những người ấy, và những người ấy nhận Đức Thánh Linh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dịch sát hình thái động từ hơn: “Bấy giờ, họ đang đặt tay trên những người ấy, và những người ấy đang nhận Đức Thánh Linh.” Cả hai động từ Hy Lạp đều ở thể chưa hoàn thành, có thể mô tả hành động đang diễn tiến hoặc lặp lại.'
    reason: Nêu phương án sát thể động từ hơn và bảo tồn khả năng diễn giải về sắc thái của hai động từ Hy Lạp.
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn tả trình tự thời gian trong câu chuyện một cách tự nhiên và trang trọng; hành động này tiếp theo lời cầu nguyện ở câu trước.
- source_word: ἐπετίθεσαν τὰς χεῖρας ἐπ’ αὐτούς
  choice: họ đặt tay trên những người ấy
  rationale: “Đặt tay trên” là cách diễn đạt tự nhiên cho cử chỉ này trong tiếng Việt. “Những người ấy” giúp phân biệt người thực hiện với người tiếp nhận mà không đưa thêm danh xưng không có trong câu Hy Lạp.
- source_word: ἐλάμβανον
  choice: những người ấy nhận
  rationale: Dùng quá khứ theo ngữ cảnh kể chuyện, vốn không cần được đánh dấu bằng hình thái riêng trong tiếng Việt. Cách dịch này tự nhiên và không ép thể chưa hoàn thành của động từ thành nghĩa khởi đầu hay lặp lại; chú thích nêu rõ sắc thái thể của nguyên văn.
- source_word: πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Trong ngữ cảnh Công Vụ, cụm từ chỉ Thánh Linh của Đức Chúa Trời, không phải “một linh thánh” bất định. “Đức Thánh Linh” là tên gọi rõ ràng, tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: πνεῦμα ἅγιον là một linh bất định hay chính Đức Thánh Linh
  choice: Đức Thánh Linh
  alternative: một linh thánh
  rationale: Ngữ cảnh trực tiếp nói đến Thánh Linh mà các sứ đồ cầu xin cho những người đã tin được nhận; cách hiểu bất định sẽ làm sai lệch đối tượng được nói đến.
- issue: Cách thể hiện hai động từ ở thể chưa hoàn thành
  choice: Dùng lối kể tự nhiên “đặt… nhận” và giải thích thể động từ trong chú thích
  alternative: họ đang đặt tay… và những người ấy đang nhận
  rationale: Cả hai động từ Hy Lạp đều ở thể chưa hoàn thành, có thể gợi hành động đang diễn tiến hoặc lặp lại. Tuy nhiên, dùng “đang” hai lần trong tiếng Việt dễ khiến câu bị gượng và xác định quá mức sắc thái diễn tiến; chú thích bảo tồn dữ kiện ngữ pháp và sự mở nghĩa của nguyên văn.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Tránh lối nói quá chuyên biệt; lặp lại “những người ấy” để làm rõ sự thay đổi chủ thể giữa hai mệnh đề.
