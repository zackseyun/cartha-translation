id: ACT.8.22
reference: Acts 8:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: μετανόησον οὖν ἀπὸ τῆς κακίας σου ταύτης, καὶ δεήθητι τοῦ ⸀κυρίου εἰ ἄρα ἀφεθήσεταί σοι ἡ ἐπίνοια τῆς καρδίας σου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/022.yaml
  text: Therefore repent of this wickedness of yours[a], and pray to the Lord, if perhaps the intent of your heart may be forgiven you.
translation:
  language: vi
  text: 'Vậy, hãy ăn năn về điều gian ác này của anh và cầu xin Chúa, may ra ý định[a] trong lòng anh sẽ được tha thứ.


    [a] Hay: “tư tưởng trong lòng anh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay: “tư tưởng trong lòng anh.”'
    reason: ἐπίνοια có thể chỉ “ý định” hoặc rộng hơn là “tư tưởng”; chú thích giữ lại khả năng từ vựng này.
lexical_decisions:
- source_word: μετανόησον
  choice: hãy ăn năn
  rationale: Động từ mệnh lệnh aorist kêu gọi một sự ăn năn dứt khoát; cách dịch này giữ được sức nặng đạo đức và tâm linh của từ.
- source_word: οὖν
  choice: Vậy
  rationale: Diễn tả kết luận rút ra từ lời quở trách ngay trước đó, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀπὸ τῆς κακίας σου ταύτης
  choice: về điều gian ác này của anh
  rationale: κακία ở đây chỉ sự xấu xa về đạo đức. “Ăn năn về” là cách kết hợp tự nhiên trong tiếng Việt, còn “của anh” giữ sự nhấn mạnh của đại từ sở hữu.
- source_word: δεήθητι
  choice: cầu xin
  rationale: δέομαι chỉ lời khẩn cầu tha thiết; “cầu xin” phù hợp ngữ cảnh hướng lời cầu nguyện đến Chúa và mạnh hơn cách nói đơn thuần “cầu nguyện”.
- source_word: τοῦ κυρίου
  choice: Chúa
  rationale: Giữ danh xưng κύριος mà không xác định thêm đối tượng là Đức Chúa Trời hay Chúa Giê-su, vì câu Hy Lạp không giải quyết rõ hơn.
- source_word: εἰ ἄρα
  choice: may ra
  rationale: Giữ sắc thái dè dặt về khả năng, không biến lời của Phi-e-rơ thành sự bảo đảm chắc chắn hay lời tuyên bố rằng sự tha thứ là không thể.
- source_word: ἀφεθήσεταί σοι
  choice: sẽ được tha thứ
  rationale: Giữ thể tương lai bị động của động từ Hy Lạp; kết hợp với “may ra” để bảo toàn tính điều kiện và hàm ý Đức Chúa Trời là Đấng tha thứ mà không cần nêu rõ trong câu.
- source_word: ἡ ἐπίνοια
  choice: ý định
  rationale: Trong ngữ cảnh, từ này nói đến ý hướng bên trong đứng sau lời đề nghị của Si-môn; “ý định” giữ sắc thái ý chí mà không nhấn quá mức thành một âm mưu.
- source_word: τῆς καρδίας σου
  choice: trong lòng anh
  rationale: Diễn đạt tự nhiên nguồn hay nơi phát sinh của ý định, đồng thời giữ hình ảnh “lòng” trong quan niệm nhân học Kinh Thánh.
theological_decisions:
- issue: Mức độ chắc chắn về khả năng được tha thứ
  choice: Giữ lời nói có điều kiện bằng “may ra … sẽ được tha thứ”.
  alternative: Dịch thành lời bảo đảm rằng chắc chắn được tha thứ khi ăn năn, hoặc hàm ý rằng sự tha thứ hầu như không thể xảy ra.
  rationale: Cụm εἰ ἄρα cùng động từ tương lai bị động cố ý để ngỏ kết quả. Bản dịch không giải quyết sự căng thẳng này theo hướng bảo đảm tuyệt đối hay tuyệt vọng.
- issue: Đối tượng của danh xưng κύριος
  choice: Dịch đơn giản là “Chúa”.
  alternative: Nêu rõ “Đức Chúa Trời” hoặc “Chúa Giê-su”.
  rationale: Ngữ cảnh Cơ Đốc giáo cho phép các cách hiểu ấy, nhưng chính câu này không buộc phải chọn một cách; vì vậy bản dịch giữ nguyên độ mở của nguyên văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Đại từ “anh” phù hợp lời Phi-e-rơ trực tiếp nói với Si-môn; câu giữ cấu trúc gọn và sắc thái khẩn thiết của hai mệnh lệnh.
