base_translation:
  language: en
  yaml_path: translation/nt/acts/008/030.yaml
  text: So Philip ran up and heard him reading Isaiah the prophet[a], and said, “Do you really understand what you are reading?”
translation:
  language: vi
  text: 'Phi-líp chạy đến, nghe ông ấy đang đọc sách của tiên tri Ê-sai, thì nói: “Ông có thật sự hiểu điều ông đang đọc không?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Ông có thực hiểu điều ông đang đọc không?” Các tiểu từ Hy Lạp làm cho câu hỏi của Phi-líp có sắc thái nhấn mạnh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδραμὼν
  choice: chạy đến
  rationale: Phân từ bất định của προστρέχω diễn tả chuyển động nhanh về phía người hoặc vật; “chạy đến” tự nhiên và giữ được nét sống động của câu.
- source_word: δὲ
  choice: thì
  rationale: δέ đánh dấu bước tiếp theo trong mạch kể. Trong cấu trúc tiếng Việt, “thì” nối tự nhiên chuỗi hành động của Phi-líp mà không làm liên từ trở nên nặng nề.
- source_word: ἤκουσεν αὐτοῦ ἀναγινώσκοντος
  choice: nghe ông ấy đang đọc
  rationale: Cấu trúc ἀκούω với phân từ sở hữu cách cho biết Phi-líp nghe người ấy trong lúc đang đọc. Bản dịch không thêm “thành tiếng” vì ý đó không được nêu rõ trong tiếng Hy Lạp.
- source_word: Ἠσαΐαν τὸν προφήτην
  choice: sách tiên tri Ê-sai
  rationale: Trong ngữ cảnh, động từ “đọc” hướng đến tác phẩm của tiên tri Ê-sai; cách diễn đạt này tự nhiên trong tiếng Việt và làm rõ đối tượng được đọc mà không đổi nội dung.
- source_word: εἶπεν
  choice: nói
  rationale: “Nói” là tương đương trực tiếp của λέγω; hình thức câu hỏi ngay sau đó đã cho thấy đây là lời hỏi.
- source_word: Ἆρά γε
  choice: có thật sự ... không
  rationale: Tổ hợp tiểu từ tạo một câu hỏi có sắc thái nhấn mạnh, thăm dò; “có thật sự ... không” truyền đạt lực ấy trong tiếng Việt hiện đại.
- source_word: γινώσκεις
  choice: hiểu
  rationale: Ở đây γινώσκω nói đến việc nắm được ý nghĩa của điều đang đọc, nên “hiểu” phù hợp hơn “biết”.
- source_word: ἃ ἀναγινώσκεις
  choice: điều mình đang đọc
  rationale: Đại từ quan hệ số nhiều trung tính chỉ nội dung đang được đọc. “Điều mình đang đọc” là cách diễn đạt tự nhiên và giữ sắc thái tiếp diễn của thì hiện tại.
