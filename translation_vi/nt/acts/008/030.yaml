- from: 'Phi-líp chạy đến, nghe ông ấy đang đọc sách tiên tri Ê-sai, thì nói: “Ông có thật sự hiểu điều mình đang đọc không?”[a]'
  to: 'Phi-líp chạy đến, nghe ông ấy đang đọc sách của tiên tri Ê-sai, thì nói: “Ông có thật sự hiểu điều ông đang đọc không?”[a]'
  rationale: Chỉnh nhẹ để làm rõ Ê-sai là vị tiên tri được nêu trong nguyên văn và để đại từ trong câu hỏi trực tiếp nhất quán, rõ nghĩa hơn. Câu hỏi vẫn giữ sắc thái nhấn mạnh của tổ hợp Ἆρά γε; không thêm ý “đọc thành tiếng”.
