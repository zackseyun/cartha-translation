  source_fidelity: 'Bản dịch truyền đạt chính xác các yếu tố chính của câu: Phi-líp đứng dậy và đi; dấu hiệu thu hút chú ý ἰδού; người đàn ông Ê-thi-ô-pi là hoạn quan, quan chức quyền thế của Can-đác; trách nhiệm đối với toàn bộ ngân khố; và mục đích đến Giê-ru-sa-lem để thờ phượng. Tuy nhiên, “liền” thêm sắc thái tức thì không được nêu rõ bởi καί và không cần thiết để diễn đạt phân từ ἀναστάς.'
