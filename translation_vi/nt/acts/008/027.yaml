id: ACT.8.27
reference: Acts 8:27
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἐπορεύθη, καὶ ἰδοὺ ἀνὴρ Αἰθίοψ εὐνοῦχος δυνάστης ⸀Κανδάκης βασιλίσσης Αἰθιόπων, ὃς ἦν ἐπὶ πάσης τῆς γάζης αὐτῆς, ὃς ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/027.yaml
  text: So he got up and went[a]. And behold, an Ethiopian man, a eunuch, a high official of Candace, queen of the Ethiopians, who was over all her treasury, had come to Jerusalem to worship[b],
translation:
  language: vi
  text: Ông đứng dậy và đi. Kìa, có một người Ê-thi-ô-pi, là hoạn quan[a] và là quan chức cấp cao của Can-đác[b], nữ vương của người Ê-thi-ô-pi. Ông quản lý toàn bộ ngân khố của bà và đã đến Giê-ru-sa-lem để thờ phượng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể hiểu là “quan chức triều đình”; trong một số văn cảnh, từ Hy Lạp này có thể chỉ một viên chức hoàng gia, dù ở đây nghĩa đen “hoạn quan” có lẽ được chủ ý.
    reason: lexical_alternative
  - marker: b
    text: “Can-đác” có thể là tước hiệu truyền đời của nữ vương chứ không phải tên riêng.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς ἐπορεύθη
  choice: liền đứng dậy và đi
  rationale: Giữ trình tự hành động của phân từ bất định và động từ chính; “liền” diễn đạt tự nhiên sự đáp ứng ngay trong mạch kể.
- source_word: ἰδοὺ
  choice: Kìa
  rationale: Giữ rõ từ đánh dấu sự chú ý và sắc thái kể chuyện sinh động của Lu-ca, đồng thời vẫn tự nhiên trong tiếng Việt hiện đại.
- source_word: ἀνὴρ Αἰθίοψ
  choice: một người Ê-thi-ô-pi
  rationale: “Người” truyền đạt đủ ý chỉ một người nam trong ngữ cảnh, còn tên dân tộc được phiên âm theo cách dễ nhận biết.
- source_word: εὐνοῦχος
  choice: hoạn quan
  rationale: Chọn nghĩa trực tiếp và thông dụng của từ Hy Lạp; địa vị quan chức đã được δυνάστης diễn đạt riêng.
- source_word: δυνάστης
  choice: quan chức cấp cao
  rationale: Diễn đạt rõ người có quyền thế trong triều đình mà không nâng ông lên thành người cai trị có chủ quyền.
- source_word: Κανδάκης βασιλίσσης Αἰθιόπων
  choice: của Can-đác, nữ vương của người Ê-thi-ô-pi
  rationale: Phiên âm danh xưng và giữ cấu trúc dân tộc số nhiều của nguyên văn; chú thích nêu khả năng đây là tước hiệu triều đại.
- source_word: ἐπὶ πάσης τῆς γάζης αὐτῆς
  choice: quản lý toàn bộ ngân khố của bà
  rationale: Diễn đạt chức trách quản trị do ἐπὶ gợi ra và nghĩa ngân khố/tài sản của γάζα trong văn cảnh triều đình.
- source_word: ἐληλύθει προσκυνήσων εἰς Ἰερουσαλήμ
  choice: đã đến Giê-ru-sa-lem để thờ phượng
  rationale: Giữ giá trị quá khứ hoàn thành của ἐληλύθει và mục đích của phân từ tương lai προσκυνήσων bằng câu tiếng Việt tự nhiên.
theological_decisions:
- issue: Nên hiểu εὐνοῦχος theo nghĩa thân thể-xã hội hay theo nghĩa rộng là quan chức triều đình
  choice: Dịch “hoạn quan” trong chính văn
  alternative: quan chức triều đình
  rationale: Nghĩa trực tiếp của εὐνοῦχος nhiều khả năng được chủ ý ở đây, còn δυνάστης đã xác định rõ địa vị quan chức. Chú thích bảo lưu nghĩa rộng khả hữu mà không xóa đi tình trạng xã hội và thân thể của nhân vật.
translation_notes:
  register: Văn phong kể chuyện trang trọng nhưng hiện đại. Dùng “Kìa” để giữ dấu hiệu thu hút sự chú ý của nguyên văn; “nữ vương” phù hợp bối cảnh hoàng gia cổ, còn “ngân khố” và “quan chức cấp cao” rõ nghĩa đối với độc giả phổ thông. Các dấu chú thích được đặt ngay sau những từ mà chúng giải thích.
