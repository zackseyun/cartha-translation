source:
  edition: SBLGNT
  text: οὐκ ἔστιν σοι μερὶς οὐδὲ κλῆρος ἐν τῷ λόγῳ τούτῳ, ἡ γὰρ καρδία σου οὐκ ἔστιν εὐθεῖα ⸀ἔναντι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/021.yaml
  text: You have neither part nor share in this matter, because your heart is not right before God.
translation:
  language: vi
  text: Anh không có phần hay phần được chia nào trong việc này, vì lòng anh không ngay thẳng trước mặt Đức Chúa Trời.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μερὶς οὐδὲ κλῆρος
  choice: không có phần cũng chẳng có quyền gì
  rationale: 'Giữ hai từ gần nghĩa của nguyên bản: μερίς chỉ phần được dự phần, còn κλῆρος gợi phần được phân hoặc quyền dự phần. Cách diễn đạt này tự nhiên hơn việc lặp lại hai lần “phần” trong tiếng Việt.'
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: trong việc này
  rationale: Trong ngữ cảnh, λόγος chỉ vấn đề hay sự việc đang được nói đến, không nhất thiết là một lời phát biểu.
- source_word: εὐθεῖα
  choice: ngay thẳng
  rationale: Diễn đạt trực tiếp hình ảnh đạo đức của từ Hy Lạp, chỉ tình trạng đúng đắn, chân thật trước Đức Chúa Trời.
- source_word: ἔναντι τοῦ θεοῦ
  choice: trước mặt Đức Chúa Trời
  rationale: Giữ sắc thái đứng trước sự hiện diện và sự xét đoán của Đức Chúa Trời.
theological_decisions:
- issue: Ý nghĩa của κλῆρος trong lời quở trách Si-môn
  choice: quyền gì
  alternative: phần được chia / phần hưởng
  rationale: Trong cặp μερίς...κλῆρος, bản dịch giữ ý Si-môn hoàn toàn không được dự phần vào việc này, nhưng không suy diễn thành một phán quyết rộng hơn về tình trạng cứu rỗi của ông.
translation_notes:
  register: Văn phong trang trọng, trực tiếp và dễ hiểu. Dùng “anh” phù hợp với lời Phi-e-rơ nói trực tiếp với Si-môn; câu không thêm chú giải giáo phái và giữ nguyên sức nặng của lời quở trách.
