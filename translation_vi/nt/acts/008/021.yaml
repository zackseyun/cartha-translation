revisions:
- from: Anh không có phần cũng chẳng có quyền gì trong việc này, vì lòng anh không ngay thẳng trước mặt Đức Chúa Trời.
  to: Anh không có phần hay phần được chia nào trong việc này, vì lòng anh không ngay thẳng trước mặt Đức Chúa Trời.
  rationale: Thay “cũng chẳng có quyền gì” bằng “hay phần được chia nào” để giữ rõ hai danh từ μερίς và κλῆρος theo nghĩa phần/phần được phân, đồng thời vẫn dùng tiếng Việt hiện đại và không suy diễn về địa vị cứu rỗi của Si-môn.
