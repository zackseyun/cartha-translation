  text: οἵτινες καταβάντες προσηύξαντο περὶ αὐτῶν ὅπως λάβωσιν πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/015.yaml
  text: who came down and prayed for them so that they might receive the Holy Spirit[a][b].
translation:
  language: vi
  text: Hai ông xuống đó và cầu nguyện cho họ, để họ nhận được Đức Thánh Linh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵτινες
  choice: Hai ông
  rationale: Đại từ quan hệ số nhiều chỉ Phi-e-rơ và Giăng ở câu trước; tiếng Việt tự nhiên cần nêu lại chủ thể, và “hai ông” giữ rõ mối liên hệ ấy.
- source_word: καταβάντες
  choice: xuống đó
  rationale: Phân từ bất định quá khứ diễn tả hành động đi trước hoặc gắn liền với động từ chính. Cấu trúc “xuống đó và cầu nguyện” tự nhiên, đồng thời vẫn thể hiện đúng trình tự hành động.
- source_word: προσηύξαντο
  choice: cầu nguyện
  rationale: Diễn đạt trực tiếp động từ προσεύχομαι; thể trung không cần biểu đạt bằng một sắc thái riêng trong tiếng Việt.
- source_word: περὶ αὐτῶν
  choice: cho họ
  rationale: Trong ngữ cảnh cầu nguyện, περί với sở hữu cách mang nghĩa cầu thay vì lợi ích của những người ấy.
- source_word: ὅπως
  choice: để
  rationale: Biểu thị mục đích của lời cầu nguyện một cách rõ ràng và tự nhiên trong tiếng Việt.
- source_word: λάβωσιν
  choice: họ nhận được
  rationale: Thể giả định sau ὅπως thuộc cấu trúc chỉ mục đích; tiếng Việt không cần thêm từ hàm ý bất định như “có thể”.
- source_word: πνεῦμα ἅγιον
  choice: Đức Thánh Linh
  rationale: Trong mạch văn sách Công Vụ, cụm từ này chỉ Thánh Linh của Đức Chúa Trời. “Đức Thánh Linh” là cách gọi trang trọng, quen thuộc và xác định rõ đối tượng trong tiếng Việt.
theological_decisions:
- issue: πνεῦμα ἅγιον chỉ một thần linh nói chung hay Đức Thánh Linh
  choice: Đức Thánh Linh
  alternative: một linh thánh; thánh linh
  rationale: Ngữ cảnh câu chuyện trong Công Vụ xác định đây là Thánh Linh được ban cho các tín hữu; cách dịch này nhận diện đối tượng mà không thêm diễn giải giáo lý.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Hai ông” để nối tự nhiên với Phi-e-rơ và Giăng ở câu trước; phối hợp hai động từ giúp câu tiếng Việt lưu loát mà vẫn giữ trình tự của phân từ Hy Lạp.
