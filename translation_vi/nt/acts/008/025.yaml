  text: Οἱ μὲν οὖν διαμαρτυράμενοι καὶ λαλήσαντες τὸν λόγον τοῦ κυρίου ⸀ὑπέστρεφον εἰς ⸀Ἱεροσόλυμα, πολλάς τε κώμας τῶν Σαμαριτῶν ⸀εὐηγγελίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/025.yaml
  text: So[a], after they had solemnly testified and spoken the word of the Lord, they were returning to Jerusalem[b], and were proclaiming the good news in many Samaritan villages.
translation:
  language: vi
  text: Vậy, sau khi họ long trọng làm chứng và nói về lời Chúa, họ đang trở về Giê-ru-sa-lem và loan báo tin mừng trong nhiều làng Sa-ma-ri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαμαρτυράμενοι
  choice: long trọng làm chứng
  rationale: Diễn đạt tính nghiêm túc, mạnh mẽ của động từ mà không thu hẹp nghĩa thành lời cảnh cáo.
- source_word: λαλήσαντες
  choice: rao truyền
  rationale: Trong ngữ cảnh sứ điệp được công bố công khai, cách nói này tự nhiên hơn lối dịch sát chữ “nói lời”, đồng thời không thêm nội dung ngoài bản văn.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: lời Chúa
  rationale: Cách diễn đạt quen thuộc, trang trọng và sát với λόγος τοῦ κυρίου trong ngữ cảnh rao giảng.
- source_word: ὑπέστρεφον
  choice: lên đường trở về
  rationale: Thể chưa hoàn thành cho thấy hành động đang diễn tiến; cách dịch này tránh khiến người đọc hiểu rằng họ đã về đến nơi.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Tên riêng theo cách phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: πολλάς τε κώμας τῶν Σαμαριτῶν
  choice: tại nhiều làng của người Sa-ma-ri
  rationale: Giữ rõ quan hệ sở thuộc hoặc cư dân trong cụm Hy Lạp và bảo tồn danh xưng sắc tộc.
- source_word: εὐηγγελίζοντο
  choice: đồng thời công bố tin mừng
  rationale: Diễn đạt hành động đang tiếp diễn và song hành với việc trở về, bằng ngôn ngữ hiện đại, tránh thuật ngữ giáo hội khó hiểu.
theological_decisions:
- issue: Chủ thể được ngầm hiểu
  choice: Giữ đại từ “họ”
  alternative: Ghi rõ “Phi-e-rơ và Giăng”
  rationale: Ngữ cảnh cho biết đó là Phi-e-rơ và Giăng, nhưng câu Hy Lạp chỉ dùng chủ thể số nhiều được ngầm hiểu; bản dịch không thêm tên vào chính văn.
- issue: Quan hệ thời gian giữa việc trở về và việc công bố tin mừng
  choice: Dùng “đồng thời” để thể hiện hai hành động đang diễn tiến song song
  alternative: Hiểu việc công bố là hành động xảy ra sau khi trở về
  rationale: Hai động từ ở thể chưa hoàn thành, ὑπέστρεφον và εὐηγγελίζοντο, tự nhiên cho thấy họ vừa trở về vừa công bố tin mừng dọc đường.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. Giữ “lời Chúa” và “tin mừng” là những cách nói quen thuộc; không nêu đích danh Phi-e-rơ và Giăng vì bản văn câu này chỉ nói “họ”.
