revisions:
- from: Vậy, sau khi long trọng làm chứng và rao truyền lời Chúa, họ lên đường trở về Giê-ru-sa-lem, đồng thời công bố tin mừng tại nhiều làng của người Sa-ma-ri.
  to: Vậy, sau khi họ long trọng làm chứng và nói về lời Chúa, họ đang trở về Giê-ru-sa-lem và loan báo tin mừng trong nhiều làng Sa-ma-ri.
  rationale: Bản sửa bỏ nét nghĩa “lên đường” không có trong nguyên văn và không dùng “đồng thời” để tránh giải thích quá mức quan hệ giữa hai động từ chưa hoàn thành. “Đang trở về” phản ánh khía cạnh diễn tiến của ὑπέστρεφον; “loan báo tin mừng” phản ánh εὐηγγελίζοντο. “Nói về lời Chúa” giữ λαλήσαντες khác với động từ loan báo tin mừng, đồng thời vẫn tự nhiên trong tiếng Việt. Không có chỗ nào cần chú thích văn bản hoặc chú thích thay thế trong bản dịch này.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản nháp truyền đạt đúng cấu trúc chính: hai phân từ aorist diễn tả việc đã làm chứng và nói lời Chúa, tiếp theo là hai động từ chưa hoàn thành về việc trở về và loan báo tin mừng. Tuy nhiên, “lên đường trở về” thêm nét nghĩa khởi hành không có trong ὑπέστρεφον. “Đồng thời” cũng diễn giải rõ quan hệ đồng thời hơn mức bản văn cần thiết, dù cách hiểu này hợp lý trong ngữ cảnh.'
  naturalness: Văn phong nhìn chung tự nhiên, trang trọng và dễ hiểu. “Nhiều làng của người Sa-ma-ri” hiểu được nhưng hơi gượng; “nhiều làng Sa-ma-ri” tự nhiên hơn trong tiếng Việt hiện đại và vẫn biểu đạt các làng thuộc/có cư dân Sa-ma-ri.
  terminology: “làm chứng,” “lời Chúa,” và “tin mừng” phù hợp với ngữ cảnh Tân Ước và cách dùng tiếng Việt hiện đại. “Rao truyền” cho λαλήσαντες có thể chấp nhận được trong ngữ cảnh, nhưng dùng cùng với “loan báo tin mừng” tạo lặp sắc thái công bố; “nói về lời Chúa” giữ phân biệt từ vựng với εὐηγγελίζοντο rõ hơn.
  issues:
  - severity: medium
    issue: “lên đường trở về”
    rationale: Ὑπέστρεφον nghĩa là “đang trở về/trở lại”; động từ này không nói rõ hành vi bắt đầu lên đường. Cần bỏ yếu tố được thêm này.
  - severity: low
    issue: “đồng thời”
    rationale: Hai động từ chưa hoàn thành có thể cho thấy các hành động cùng diễn tiến, nhưng trạng từ này giải thích quan hệ thời gian một cách quá minh thị. Liên từ “và” bảo tồn cách diễn đạt của nguyên văn tốt hơn.
  - severity: low
    issue: “tại nhiều làng của người Sa-ma-ri”
    rationale: Cụm này hơi không tự nhiên trong tiếng Việt. “Trong nhiều làng Sa-ma-ri” diễn đạt tự nhiên hơn mà vẫn giữ ý nghĩa các làng của/có người Sa-ma-ri.
  revised_text: Vậy, sau khi họ long trọng làm chứng và nói về lời Chúa, họ đang trở về Giê-ru-sa-lem và loan báo tin mừng trong nhiều làng Sa-ma-ri.
