id: ACT.8.5
reference: Acts 8:5
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Φίλιππος δὲ κατελθὼν εἰς ⸀τὴν πόλιν τῆς Σαμαρείας ἐκήρυσσεν αὐτοῖς τὸν χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/005.yaml
  text: Philip went down to the city of Samaria and proclaimed the Messiah to them[a][b].
translation:
  language: vi
  text: Phi-líp đi xuống thành Sa-ma-ri và rao giảng Đấng Mê-si-a cho họ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một thành trong vùng Sa-ma-ri.” Cụm từ Hy Lạp có thể chỉ một thành cụ thể ở Sa-ma-ri hoặc một thành thuộc miền của người Sa-ma-ri.'
    reason: alternative_reading
  - marker: b
    text: 'Cũng có thể dịch: “đến thành Sa-ma-ri.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Đây là liên từ nhẹ để tiếp nối trình thuật; tiếng Việt tự nhiên không cần thêm “bấy giờ” hoặc “nhưng” vì như vậy dễ làm tăng sắc thái thời gian hay tương phản.
- source_word: κατελθὼν
  choice: đi xuống
  rationale: Giữ hướng chuyển động của κατέρχομαι, đồng thời chuyển phân từ thành động từ nối tiếp tự nhiên trong tiếng Việt.
- source_word: τὴν πόλιν τῆς Σαμαρείας
  choice: thành Sa-ma-ri
  rationale: Theo sát cấu trúc xác định của bản Hy Lạp và cách hiểu địa danh truyền thống, nhưng giữ khả năng cụm từ chỉ một thành trong vùng Sa-ma-ri qua chú thích.
- source_word: ἐκήρυσσεν
  choice: rao giảng
  rationale: Diễn đạt hành động công khai loan báo của κηρύσσω bằng lối nói quen thuộc, trang trọng và dễ hiểu trong tiếng Việt.
- source_word: αὐτοῖς
  choice: cho dân chúng tại đó
  rationale: Làm rõ đối tượng của lời rao giảng; đại từ số nhiều trong tiếng Hy Lạp quy chiếu tự nhiên đến cư dân ở nơi Phi-líp đến.
- source_word: τὸν χριστόν
  choice: Đấng Mê-si-a
  rationale: Trong ngữ cảnh này Χριστός mang chức năng tước hiệu; “Đấng Mê-si-a” giữ bối cảnh Do Thái và không biến tước hiệu thành tên riêng.
theological_decisions:
- issue: Cách dịch Χριστός
  choice: Đấng Mê-si-a
  alternative: Đấng Christ
  rationale: Mạo từ và ngữ cảnh rao giảng cho thấy đây là tước hiệu chỉ Đấng được xức dầu; cách dịch này bảo tồn ý nghĩa tước hiệu thay vì chỉ phiên âm theo truyền thống.
- issue: Đối tượng được rao giảng
  choice: rao giảng Đấng Mê-si-a
  alternative: rao giảng về Đấng Mê-si-a
  rationale: Giữ sát cấu trúc trực tiếp của ἐκήρυσσεν ... τὸν χριστόν, không tự ý thêm giới từ “về”, dù tiếng Việt vẫn hiểu là công bố sứ điệp về Ngài.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Dùng “Phi-líp,” “Sa-ma-ri” và “Mê-si-a” theo lối phiên âm quen thuộc; tránh thêm từ nối không cần thiết ở đầu câu. Hai dấu chú thích đều xuất hiện trong chính văn.
