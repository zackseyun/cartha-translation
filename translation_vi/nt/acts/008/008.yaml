translation:
  language: vi
  text: Và trong thành ấy có niềm vui lớn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: tràn ngập
  rationale: Trong cấu trúc với danh từ làm chủ ngữ, ἐγένετο diễn tả một tình trạng phát sinh và hiện hữu. “Tràn ngập” là cách diễn đạt tự nhiên trong tiếng Việt khi đi với niềm vui lớn, đồng thời truyền tải cường độ của cả cụm.
- source_word: δὲ
  choice: Vì thế
  rationale: δέ nối câu này với các sự việc vừa kể. Trong ngữ cảnh, niềm vui của thành phố là kết quả của những dấu lạ và sự giải thoát ở các câu trước; “Vì thế” làm rõ mạch kết quả vốn hàm ý trong diễn tiến, mà không tạo sắc thái đối lập.
- source_word: πολλὴ χαρά
  choice: niềm vui
  rationale: πολλή nhấn mạnh mức độ lớn của χαρά. Cường độ được thể hiện tự nhiên qua cụm vị ngữ “tràn ngập niềm vui”, tránh lối nói kém tự nhiên “nhiều niềm vui” và không làm giảm ý nghĩa.
- source_word: ἐν τῇ πόλει ἐκείνῃ
  choice: cả thành ấy
  rationale: πόλις chỉ thành phố đã được nhắc đến, còn ἐκείνῃ được giữ bằng “ấy”. “Cả thành” diễn đạt tự nhiên phạm vi cộng đồng trong thành mà giới từ ἐν xác định.
