    rationale: ἐν τῇ πόλει ἐκείνῃ chỉ địa điểm, còn ἐγένετο πολλὴ χαρά là mệnh đề hiện hữu. «Cả» và «tràn ngập» là những tăng cường diễn giải không cần thiết.
  revised_text: Và trong thành ấy có niềm vui lớn.
