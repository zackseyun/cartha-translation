revisions:
- from: Vì các uế linh đã kêu lớn tiếng mà ra khỏi nhiều người bị chúng ám; nhiều người bại liệt và què cũng được chữa lành.
  to: Vì nhiều quỷ ô uế kêu lớn tiếng khi ra khỏi những người bị chúng ám; cũng có nhiều người bại liệt và người què được chữa lành.
  rationale: Bản sửa làm rõ quỷ ô uế là chủ thể kêu và ra khỏi, diễn đạt tự nhiên hơn quan hệ giữa phân từ và động từ chính, và dùng thuật ngữ quen thuộc trong tiếng Việt hiện đại. Không thêm tác nhân chữa lành hoặc nội dung thần học ngoài nguyên văn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:29:17Z'
review_pass:
  verdict: revise
  source_fidelity: Bản nháp xác định đúng các uế linh là chủ thể của cả hành động kêu lớn tiếng và ra khỏi, đồng thời giữ được quan hệ giải thích của γάρ và thể bị động của ἐθεραπεύθησαν. Tuy nhiên, “đã kêu lớn tiếng mà ra khỏi” không diễn đạt tự nhiên quan hệ đồng thời của phân từ βοῶντα với ἐξήρχοντο; “đã” cũng dễ tạo sắc thái hoàn tất không cần thiết đối với thì chưa hoàn thành trong tường thuật.
  naturalness: Câu đầu có thể sửa cho rõ và tự nhiên hơn bằng cách đặt “khi ra khỏi” sau hành động kêu. “Quỷ ô uế” là cách gọi hiện đại, quen thuộc hơn “uế linh” trong văn cảnh Kinh Thánh tiếng Việt, nhưng vẫn chuyển tải πνεύματα ἀκάθαρτα.
  terminology: Dùng “quỷ ô uế” cho πνεύματα ἀκάθαρτα, giữ tính chất “ô uế” và ngữ cảnh trừ quỷ. Giữ “bại liệt,” “què,” và “được chữa lành.” Việc lặp “người” ở vế cuối tránh hàm ý rằng mọi người được chữa đều đồng thời bại liệt và què.
  issues:
  - severity: medium
    issue: Liên kết “đã kêu lớn tiếng mà ra khỏi”
    rationale: Cách nối này gượng và không làm rõ rằng việc kêu lớn tiếng xảy ra khi các quỷ ra khỏi. Nguyên ngữ dùng phân từ trung tính số nhiều bổ nghĩa cho các linh ô uế cùng với động từ “ra khỏi”.
  - severity: low
    issue: Thuật ngữ “uế linh”
    rationale: Không sai nghĩa, nhưng “quỷ ô uế” thông dụng và dễ hiểu hơn trong tiếng Việt hiện đại cho các linh ô uế trong trình thuật trừ quỷ.
  - severity: low
    issue: “nhiều người bại liệt và què” có thể gợi một nhóm đều mang cả hai tình trạng
    rationale: Nguyên văn có thể chỉ hai nhóm người được chữa. Lặp danh từ giúp tiếng Việt phân biệt hai loại tình trạng mà không đổi ý nghĩa.
  revised_text: Vì nhiều quỷ ô uế kêu lớn tiếng khi ra khỏi những người bị chúng ám; cũng có nhiều người bại liệt và người què được chữa lành.
