  text: ⸀πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα βοῶντα φωνῇ μεγάλῃ ⸀ἐξήρχοντο, πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ ἐθεραπεύθησαν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/007.yaml
  text: For many who had unclean spirits[a], they came out crying with a loud voice; and many who were paralyzed and lame were healed.
translation:
  language: vi
  text: Vì nhiều quỷ ô uế kêu lớn tiếng khi ra khỏi những người bị chúng ám; cũng có nhiều người bại liệt và người què được chữa lành.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ γὰρ τῶν ἐχόντων πνεύματα ἀκάθαρτα
  choice: Vì các uế linh... ra khỏi nhiều người bị chúng ám
  rationale: Cấu trúc Hy Lạp hơi gãy; bản dịch tái cấu trúc để tiếng Việt tự nhiên, giữ γάρ là “vì”, πολλοί là “nhiều người”, và xác định người chịu ảnh hưởng của các uế linh.
- source_word: πνεύματα ἀκάθαρτα
  choice: các uế linh
  rationale: “Uế linh” là cách diễn đạt ngắn gọn, trang trọng và quen thuộc trong văn cảnh trừ quỷ, đồng thời giữ ý niệm ô uế của ἀκάθαρτα.
- source_word: βοῶντα φωνῇ μεγάλῃ
  choice: đã kêu lớn tiếng
  rationale: Diễn đạt tự nhiên cả hành động kêu la và âm lượng; phân từ giống trung số nhiều phù hợp với “các uế linh”.
- source_word: ἐξήρχοντο
  choice: ra khỏi
  rationale: Động từ chỉ việc các uế linh rời khỏi người bị ám; “ra khỏi” làm rõ quan hệ trong tiếng Việt mà không thêm tác nhân.
- source_word: πολλοὶ δὲ παραλελυμένοι καὶ χωλοὶ
  choice: nhiều người bại liệt và què cũng
  rationale: δέ nối thêm nhóm người được chữa lành nên dịch là “cũng”; “bại liệt” và “què” truyền đạt trực tiếp hai tình trạng thể chất.
- source_word: ἐθεραπεύθησαν
  choice: được chữa lành
  rationale: Giữ thể bị động và sắc thái chữa lành của θεραπεύω mà không nêu tác nhân trong mệnh đề.
theological_decisions:
- issue: Chủ thể kêu lớn tiếng và đi ra
  choice: Các uế linh là chủ thể của cả “kêu lớn tiếng” và “ra khỏi”.
  alternative: Những người bị ám kêu lớn tiếng trong khi các uế linh ra khỏi họ.
  rationale: βοῶντα là phân từ trung tính số nhiều, hòa hợp tự nhiên với πνεύματα ἀκάθαρτα; vì vậy ngữ pháp nghiêng rõ về việc các uế linh kêu lên.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu được tái cấu trúc vừa phải để tránh đại từ mơ hồ và cấu trúc gãy trong tiếng Việt, trong khi vẫn giữ quan hệ giải thích của γάρ và hai nhóm người trong nguyên văn.
