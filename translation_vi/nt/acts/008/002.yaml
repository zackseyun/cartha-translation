  yaml_path: translation/nt/acts/008/002.yaml
  text: But devout men buried Stephen and made great lamentation over him[a][b].
translation:
  language: vi
  text: Nhưng có những người nam mộ đạo đã an táng Ê-tiên[a] và than khóc thảm thiết cho ông[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đã lo việc mai táng cho Ê-tiên” hoặc “đã đưa thi thể Ê-tiên đi mai táng”; động từ Hy Lạp có thể nhấn mạnh việc đưa thi thể đi và lo việc mai táng, cũng như việc chôn cất.'
    reason: lexical_alternative
  - marker: b
    text: Cụm từ này có thể bao gồm những biểu hiện đau buồn thành tiếng và công khai, chứ không chỉ nỗi buồn trong lòng.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεκόμισαν
  choice: đã an táng
  rationale: Trong ngữ cảnh sau cái chết của Ê-tiên, động từ nói đến việc thu nhận, đưa thi thể đi và lo việc chôn cất. “An táng” diễn đạt tự nhiên kết quả của hành động, còn chú thích giữ lại sắc thái rộng hơn của từ Hy Lạp.
- source_word: δέ
  choice: Nhưng
  rationale: Liên từ đánh dấu một chuyển ý nhẹ, có sắc thái tương phản với cảnh bắt bớ và cái chết vừa được thuật lại.
- source_word: ἄνδρες εὐλαβεῖς
  choice: những người sùng kính
  rationale: “Những người” tự nhiên trong tiếng Việt và vẫn chỉ những người nam theo danh từ ἄνδρες trong ngữ cảnh; “sùng kính” diễn đạt lòng kính sợ và mộ đạo của εὐλαβεῖς.
- source_word: ἐποίησαν κοπετὸν μέγαν
  choice: khóc than ... rất nhiều
  rationale: Đây là một kết hợp thành ngữ chỉ sự than khóc mãnh liệt, thường biểu lộ ra bên ngoài. Cách diễn đạt này tự nhiên hơn trong tiếng Việt hiện đại mà vẫn giữ cường độ của μέγαν.
- source_word: ἐπ’ αὐτῷ
  choice: ông
  rationale: Trong cấu trúc tiếng Việt “khóc than ông”, đối tượng được thương tiếc được nêu trực tiếp; cách này tương ứng tự nhiên với nghĩa “than khóc cho/vì ông” của giới từ ἐπί trong ngữ cảnh tang chế.
