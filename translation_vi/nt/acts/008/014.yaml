id: ACT.8.14
reference: Acts 8:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἀκούσαντες δὲ οἱ ἐν Ἱεροσολύμοις ἀπόστολοι ὅτι δέδεκται ἡ Σαμάρεια τὸν λόγον τοῦ θεοῦ, ἀπέστειλαν πρὸς ⸀αὐτοὺς Πέτρον καὶ Ἰωάννην,
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/014.yaml
  text: When the apostles in Jerusalem heard that Samaria had received the word of God, they sent Peter and John to them,
translation:
  language: vi
  text: Khi các sứ đồ ở Giê-ru-sa-lem nghe rằng Sa-ma-ri đã tiếp nhận lời Đức Chúa Trời, họ sai Phi-e-rơ và Giăng đến với họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Khi ... nghe
  rationale: Phân từ bất định nêu hoàn cảnh xảy ra trước động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ rõ quan hệ thời gian.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: Ở đây δέ là liên từ nhẹ để tiếp nối diễn biến, không biểu thị sự tương phản mạnh; cấu trúc câu tiếng Việt đã truyền đạt sự tiếp nối mà không cần thêm “bấy giờ” hay “nhưng”.
- source_word: οἱ ἐν Ἱεροσολύμοις ἀπόστολοι
  choice: các sứ đồ ở Giê-ru-sa-lem
  rationale: Diễn đạt trực tiếp, tự nhiên, xác định các sứ đồ đang ở Giê-ru-sa-lem.
- source_word: δέδεκται
  choice: đã tiếp nhận
  rationale: Thể hoàn thành của δέχομαι chỉ một hành động tiếp nhận đã xảy ra với kết quả còn hiệu lực; “đã tiếp nhận” truyền đạt phù hợp trong mạch kể tiếng Việt.
- source_word: ἡ Σαμάρεια
  choice: Sa-ma-ri
  rationale: Giữ địa danh được dùng theo phép hoán dụ để chỉ cư dân nơi ấy, sát với hình thức của nguyên văn.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh quen thuộc và sắc thái thần học của λόγος, thay vì diễn giải thành “sứ điệp”.
- source_word: ἀπέστειλαν
  choice: họ sai
  rationale: “Sai” là cách diễn đạt tự nhiên, trang trọng vừa phải cho hành động cử người đi thực hiện nhiệm vụ.
- source_word: πρὸς αὐτοὺς
  choice: đến với những người ấy
  rationale: Đại từ số nhiều quy chiếu đến những người tại Sa-ma-ri; diễn đạt rõ phép hoán dụ mà không thay đổi chủ ngữ “Sa-ma-ri” trong mệnh đề trước.
- source_word: Πέτρον καὶ Ἰωάννην
  choice: Phi-e-rơ và Giăng
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions:
- issue: Cách dùng hoán dụ của “Sa-ma-ri”
  choice: Giữ “Sa-ma-ri đã tiếp nhận lời Đức Chúa Trời”.
  alternative: “người Sa-ma-ri đã tiếp nhận lời Đức Chúa Trời” hoặc “miền Sa-ma-ri đã tiếp nhận lời Đức Chúa Trời”
  rationale: Nguyên văn dùng địa danh làm chủ ngữ theo nghĩa tập thể. Giữ địa danh bảo toàn cách diễn đạt của nguồn và tránh thu hẹp cách hiểu không cần thiết.
- issue: Dịch λόγος là “lời” hay “sứ điệp”
  choice: lời Đức Chúa Trời
  alternative: sứ điệp của Đức Chúa Trời
  rationale: “Lời Đức Chúa Trời” vừa sát từ ngữ nguồn vừa giữ âm hưởng và chiều sâu thần học quen thuộc, trong khi ngữ cảnh cho thấy đó là lời được rao truyền.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Không thêm dấu nối diễn ngôn tương ứng với “bấy giờ” vì δέ chỉ nhẹ nhàng tiếp nối câu chuyện. Dùng “các sứ đồ”, “Giê-ru-sa-lem”, “Sa-ma-ri”, “Phi-e-rơ” và “Giăng” theo lối gọi tên Kinh Thánh tiếng Việt quen thuộc.
