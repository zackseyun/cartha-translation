review_pass:
  verdict: revise
  source_fidelity: Bản dịch truyền đạt đúng quan hệ thời gian của phân từ Ἀκούσαντες, chủ ngữ «các sứ đồ ở Giê-ru-sa-lem», thể hoàn thành δέδεκται qua «đã tiếp nhận», lối hoán dụ «Sa-ma-ri», và hành động «sai» Phi-e-rơ cùng Giăng. Không cần dịch riêng δέ. Tuy nhiên, «những người ấy» giải thích rõ hơn đại từ αὐτούς và có sắc thái chỉ định không có trong nguyên văn.
  naturalness: Câu nhìn chung tự nhiên, trang trọng và phù hợp tiếng Việt hiện đại. «Đến với họ» là cách quy chiếu tự nhiên, gọn hơn và sát với đại từ số nhiều của nguồn; ngữ cảnh đủ rõ rằng đó là người tại Sa-ma-ri.
  terminology: «Sứ đồ», «lời Đức Chúa Trời», cùng các dạng tên Giê-ru-sa-lem, Sa-ma-ri, Phi-e-rơ và Giăng nhất quán với văn phong Kinh Thánh tiếng Việt quen thuộc. Không có vấn đề thuật ngữ hoặc tên riêng cần điều chỉnh.
  issues:
