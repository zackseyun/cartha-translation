id: ACT.8.1
reference: Acts 8:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Σαῦλος δὲ ἦν συνευδοκῶν τῇ ἀναιρέσει αὐτοῦ. Ἐγένετο δὲ ἐν ἐκείνῃ τῇ ἡμέρᾳ διωγμὸς μέγας ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις· πάντες δὲ διεσπάρησαν κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας πλὴν τῶν ἀποστόλων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/001.yaml
  text: Saul was approving of his execution. And on that day a great persecution arose against the church in Jerusalem[a], and they were all scattered throughout the regions of Judea and Samaria, except the apostles.
translation:
  language: vi
  text: Sau-lơ tán thành việc giết ông. Trong ngày ấy, một cuộc bách hại dữ dội nổi lên chống lại hội thánh tại Giê-ru-sa-lem. Tất cả đều bị phân tán khắp các miền Giu-đê và Sa-ma-ri, ngoại trừ các sứ đồ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Sau-lơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc, rõ ràng đối với độc giả Kinh Thánh tiếng Việt.
- source_word: συνευδοκῶν
  choice: tán thành
  rationale: Diễn đạt sự đồng thuận và chấp thuận của Sau-lơ, không nói quá rằng ông trực tiếp tham gia hành động giết người.
- source_word: τῇ ἀναιρέσει αὐτοῦ
  choice: việc giết ông
  rationale: Giữ trọng tâm vào hành động lấy mạng người ấy; tránh hàm ý về tính hợp pháp của “hành quyết” và tránh tăng cường phán đoán pháp lý như “sát hại”.
- source_word: Ἐγένετο ... διωγμὸς μέγας
  choice: một cuộc bách hại dữ dội nổi lên
  rationale: Cách nói tự nhiên trong tiếng Việt, thể hiện cả sự khởi phát lẫn mức độ lớn lao, nghiêm trọng của cuộc bách hại.
- source_word: ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἱεροσολύμοις
  choice: chống lại hội thánh tại Giê-ru-sa-lem
  rationale: “Chống lại” thể hiện hướng thù nghịch của cuộc bách hại; cụm địa điểm xác định hội thánh được nhắm đến.
- source_word: πάντες ... διεσπάρησαν
  choice: Tất cả đều bị phân tán
  rationale: Giữ sức nặng của “tất cả” và thể bị động của động từ; ngoại lệ được nêu ngay sau đó.
- source_word: κατὰ τὰς χώρας τῆς Ἰουδαίας καὶ Σαμαρείας
  choice: khắp các miền Giu-đê và Sa-ma-ri
  rationale: Diễn đạt tự nhiên phạm vi địa lý rộng của sự phân tán.
- source_word: πλὴν τῶν ἀποστόλων
  choice: ngoại trừ các sứ đồ
  rationale: Giữ nguyên ngoại lệ rõ ràng trong nguyên văn.
theological_decisions:
- issue: Cách hiểu ἀναιρέσει αὐτοῦ liên quan đến cái chết của Ê-tiên
  choice: việc giết ông
  alternative: việc hành quyết ông; cái chết của ông; việc sát hại ông
  rationale: Bản dịch nêu rõ hành động lấy mạng Ê-tiên mà không tự gán tính hợp pháp qua “hành quyết” hoặc thêm phán quyết pháp lý mạnh hơn qua “sát hại”.
- issue: Phạm vi của πάντες (“tất cả”)
  choice: Tất cả đều bị phân tán ... ngoại trừ các sứ đồ
  alternative: tất cả các tín hữu đều bị phân tán; mọi người đều bị phân tán
  rationale: Giữ lối diễn đạt bao quát của nguyên văn cùng ngoại lệ được chính câu nêu ra, không xác định hẹp hơn mức văn bản cho phép.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “hội thánh” cho ἐκκλησία và “sứ đồ” cho ἀπόστολοι; tên riêng được phiên âm theo lối quen thuộc trong tiếng Việt. Không thêm liên từ mở đầu mang nghĩa thời gian khi nguyên văn chỉ có δέ với chức năng nối diễn ngôn.
