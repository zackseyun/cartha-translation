    rationale: Cụm ἐν ἐκείνῃ τῇ ἡμέρᾳ có nghĩa “trong/vào ngày ấy.” Từ «ngay» có thể khiến câu mạnh hơn nguyên văn. «Trong ngày ấy» giữ đúng thời điểm mà không thêm nhấn mạnh.
