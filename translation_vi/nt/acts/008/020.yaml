revisions:
- from: 'Nhưng Phi-e-rơ nói với ông: “Bạc của ông hãy cùng ông đi đến chỗ diệt vong[a], vì ông tưởng có thể dùng tiền mà có được ân tứ của Đức Chúa Trời[b].”'
  to: 'Nhưng Phi-e-rơ nói với ông: “Bạc của ông, cùng với ông, hãy đi vào chỗ diệt vong[a], vì ông tưởng mình có thể dùng tiền mà có được[b] sự ban cho của Đức Chúa Trời.”'
  rationale: Bản sửa giữ lời cầu chúc nghiêm khắc của thể optative và sự mơ hồ của ἀπώλεια, không diễn giải thành sự kết án đời đời. “Sự ban cho” dịch δωρεά trực tiếp, trung tính và vẫn làm rõ sự đối lập với việc dùng tiền. Các neo chú thích được đặt cạnh đúng đơn vị từ vựng mà chúng giải thích.
