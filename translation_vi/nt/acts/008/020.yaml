    rationale: “Bạc của ông hãy cùng ông đi đến chỗ diệt vong” có thể được hiểu, nhưng “Bạc của ông, cùng với ông, hãy đi vào chỗ diệt vong” rõ quan hệ cú pháp và tự nhiên hơn.
  - severity: low
    issue: Ký hiệu chú thích b không gắn trực tiếp với từ được chú giải.
    rationale: Chú thích b giải thích κτᾶσθαι, được dịch là “có được,” nhưng ký hiệu hiện đặt sau “Đức Chúa Trời.” Nên đặt ngay sau “có được.”
