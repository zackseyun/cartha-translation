  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Πέτρος δὲ εἶπεν πρὸς αὐτόν· Τὸ ἀργύριόν σου σὺν σοὶ εἴη εἰς ἀπώλειαν ὅτι τὴν δωρεὰν τοῦ θεοῦ ἐνόμισας διὰ χρημάτων κτᾶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/020.yaml
  text: But Peter said to him[a], “May your silver perish with you[b], because you thought you could acquire the gift of God with money.”
translation:
  language: vi
  text: 'Nhưng Phi-e-rơ nói với ông: “Bạc của ông, cùng với ông, hãy đi vào chỗ diệt vong[a], vì ông tưởng mình có thể dùng tiền mà có được[b] sự ban cho của Đức Chúa Trời.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Bạc của ông cùng ông hãy bị hủy diệt.” Từ Hy Lạp chỉ “bạc,” thường được dùng để nói đến tiền bạc.'
    reason: lexical_alternative
  - marker: b
    text: “Có được” cũng có thể dịch là “đạt được” hoặc “mua được.” Ý nói Si-môn xem sự ban cho của Đức Chúa Trời như điều có thể nhận được bằng cách trả tiền.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριόν
  choice: bạc
  rationale: Giữ hình ảnh cụ thể của nguyên văn là “bạc,” một cách gọi tiền bạc phổ biến; đồng thời tránh lặp ngay với χρημάτων (“tiền”) ở cuối câu.
- source_word: σὺν σοὶ
  choice: cùng ông
  rationale: Diễn đạt trực tiếp ý rằng bạc và chính Si-môn bị gắn với nhau trong lời quở trách nghiêm khắc.
- source_word: εἴη εἰς ἀπώλειαν
  choice: hãy ... đi đến chỗ diệt vong
  rationale: Thể optative diễn tả một lời nguyện hoặc lời tuyên phán; cách dịch này giữ sức nặng của ἀπώλεια mà không tự ý xác định đó là sự kết án đời đời.
- source_word: δωρεὰν
  choice: ân tứ
  rationale: Trong ngữ cảnh gần, điều được nói đến là sự ban cho đến từ Đức Chúa Trời. “Ân tứ” tự nhiên trong văn phong Kinh Thánh tiếng Việt và nhấn mạnh đây là điều được ban, không phải hàng hóa để mua.
- source_word: ἐνόμισας
  choice: ông tưởng
  rationale: Cách diễn đạt rõ, trực tiếp, phù hợp với giọng quở trách của Phi-e-rơ.
- source_word: διὰ χρημάτων
  choice: dùng tiền
  rationale: Diễn đạt tự nhiên phương tiện được nêu bởi διά với sở hữu cách.
- source_word: κτᾶσθαι
  choice: có được
  rationale: Bao quát nghĩa đạt được hoặc sở hữu mà không làm cho động từ tự nó mang nghĩa “mua”; sắc thái mua bán đã được thể hiện qua “dùng tiền.”
- source_word: δὲ
  choice: Nhưng
  rationale: Thể hiện sự tương phản với lời đề nghị của Si-môn trong câu trước.
theological_decisions:
- issue: Sức nặng của lời Phi-e-rơ tuyên phán đối với Si-môn và bạc của ông
  choice: 'Một lời nguyện/tuyên phán về sự diệt vong: “Bạc của ông hãy cùng ông đi đến chỗ diệt vong”'
  alternative: Một lời dự báo đơn thuần về sự hủy diệt, hoặc công thức kết án đời đời mạnh hơn
  rationale: εἴη là optative, phù hợp với lời nguyện hoặc lời nguyền hơn là câu trần thuật. “Diệt vong” giữ nguyên sự nghiêm khắc nhưng không áp đặt một kết luận cụ thể về số phận đời đời mà câu Hy Lạp không nói rõ.
- issue: Bản chất của δωρεὰ τοῦ θεοῦ
  choice: “ân tứ của Đức Chúa Trời”
  alternative: “món quà của Đức Chúa Trời” hoặc “sự ban cho của Đức Chúa Trời”
  rationale: “Ân tứ” phù hợp ngữ cảnh về điều Đức Chúa Trời ban và sự tương phản với việc dùng tiền để có được, nhưng không xác định sâu hơn bản chất thần học của ân tứ ấy.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ “bạc” để phản ánh hình ảnh cụ thể của nguyên văn, còn “dùng tiền” diễn đạt tự nhiên phương tiện ở vế sau. Cấu trúc lời tuyên phán được giữ nghiêm khắc nhưng không thêm ngôn ngữ định tội vượt quá nguyên văn.
