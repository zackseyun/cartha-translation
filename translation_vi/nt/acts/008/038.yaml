  rationale: Bản sửa làm rõ phương tiện được nêu trong nguyên ngữ, dùng cấu trúc sai khiến Việt ngữ tự nhiên hơn, và tránh thêm sắc thái không cần thiết cho động từ “đi xuống”. Chú thích bảo lưu phương án từ vựng có thể có, đồng thời phản ánh lực hướng thông thường của εἰς mà không suy diễn về phương thức báp-têm.
