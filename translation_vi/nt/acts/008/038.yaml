source:
  edition: SBLGNT
  text: καὶ ἐκέλευσεν στῆναι τὸ ἅρμα, καὶ κατέβησαν ἀμφότεροι εἰς τὸ ὕδωρ ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος, καὶ ἐβάπτισεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/038.yaml
  text: And he ordered the chariot to stop[a], and both Philip and the eunuch went down into the water, and he baptized him.
translation:
  language: vi
  text: Ông ra lệnh cho xe ngựa dừng lại. Cả Phi-líp lẫn viên thái giám đều đi xuống nước[a], rồi Phi-líp làm báp-têm cho ông ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “đến chỗ nước”; tuy nhiên, giới từ Hy Lạp thường chỉ sự chuyển động vào trong nước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: truyền
  rationale: Động từ mang nghĩa ra lệnh; “truyền” tự nhiên, trang trọng và giữ được sắc thái thẩm quyền trong văn cảnh.
- source_word: στῆναι τὸ ἅρμα
  choice: dừng xe lại
  rationale: Với chiếc xe làm đối tượng, cụm này chỉ việc khiến xe ngừng lại; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: ἅρμα
  choice: xe
  rationale: Trong văn cảnh, đây là phương tiện mà viên thái giám đang ngồi. “Xe” rõ ràng và tự nhiên hơn “xe chiến,” vốn dễ gợi sai chức năng quân sự; ngữ cảnh trước đó xác định phương tiện.
- source_word: κατέβησαν
  choice: bước xuống
  rationale: Diễn đạt chuyển động đi xuống một cách tự nhiên; kết hợp với “xuống nước” phản ánh hướng chuyển động của câu Hy Lạp.
- source_word: ἀμφότεροι
  choice: cả hai đều
  rationale: Giữ sự nhấn mạnh rõ ràng rằng cả Phi-líp lẫn viên thái giám cùng xuống nước.
- source_word: εἰς τὸ ὕδωρ
  choice: xuống nước
  rationale: εἰς thường biểu thị chuyển động vào trong. Trong tiếng Việt, “bước xuống nước” vừa tự nhiên vừa giữ hướng chuyển động, nhưng không tự nó quyết định cách thức làm phép báp-têm.
- source_word: ὅ τε Φίλιππος καὶ ὁ εὐνοῦχος
  choice: Phi-líp và viên thái giám
  rationale: Nêu đích danh cả hai người tham gia hành động, đồng thời kết hợp với “cả hai đều” để giữ sự nhấn mạnh của cấu trúc Hy Lạp.
- source_word: εὐνοῦχος
  choice: viên thái giám
  rationale: “Thái giám” giữ nghĩa thông thường của từ Hy Lạp và tính liên tục trong trình thuật; “viên” giúp cách gọi tự nhiên và tôn trọng trong tiếng Việt.
- source_word: ἐβάπτισεν
  choice: làm phép báp-têm
  rationale: Đây là cách diễn đạt quen thuộc, trung tính trong tiếng Việt Cơ Đốc, không diễn giải động từ thành một phương thức cụ thể như “dìm xuống.”
- source_word: αὐτόν
  choice: ông ấy
  rationale: Đại từ chỉ viên thái giám là người nhận phép báp-têm; “ông ấy” tự nhiên và giữ sắc thái tôn trọng.
theological_decisions:
- issue: Có nên dịch theo cách quyết định phương thức làm phép báp-têm hay không
  choice: Giữ cả hướng chuyển động “bước xuống nước” và động từ trung tính “làm phép báp-têm.”
  alternative: Dịch βαπτίζω là “dìm xuống,” hoặc làm nhẹ εἰς thành “đến chỗ nước.”
  rationale: Câu Hy Lạp nói rõ cả hai người xuống nước và Phi-líp làm phép báp-têm cho viên thái giám, nhưng không nên thêm ngôn ngữ nhằm giải quyết cuộc tranh luận hệ phái về phương thức.
translation_notes:
  register: Văn phong hiện đại, sáng rõ và trang trọng. Dùng “Phi-líp,” “viên thái giám” và “phép báp-têm” theo lối gọi quen thuộc; không thêm chú thích vì bản dịch chính đã thể hiện tự nhiên lực hướng của εἰς mà không cần nêu một phương án tiếng Việt kém tự nhiên hơn.
