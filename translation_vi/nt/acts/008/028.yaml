  terminology: “Cỗ xe” phù hợp bối cảnh cổ của ἅρμα. “Nhà tiên tri Ê-sai” là thuật ngữ chuẩn, trang trọng vừa phải. Cách ghi “Ê-sai” nhất quán với bản thảo.
