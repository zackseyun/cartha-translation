    rationale: ὑποστρέφων nghĩa là đang trở về; bối cảnh hành trình có thể được suy ra, nhưng câu này không nêu rõ “trên đường.” Lược bỏ cụm này giữ sát nguồn hơn mà vẫn tự nhiên.
