  text: ἦν ⸀τε ὑποστρέφων καὶ καθήμενος ἐπὶ τοῦ ἅρματος αὐτοῦ καὶ ἀνεγίνωσκεν τὸν προφήτην Ἠσαΐαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/028.yaml
  text: And he was returning[a], seated in his chariot[b], and was reading Isaiah the prophet.
translation:
  language: vi
  text: Ông đang trở về, ngồi trên cỗ xe của mình và đang đọc[b] sách của nhà tiên tri Ê-sai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Trong tiếng Hy Lạp: “vị tiên tri Ê-sai”; ở đây tên vị tiên tri được dùng để chỉ sách mang tên ông.'
    reason: lexical_alternative
  - marker: b
    text: Thời cổ, người ta thường đọc thành tiếng; vì vậy cũng có thể hiểu là “đang đọc thành tiếng,” dù ở đây bản thân động từ Hy Lạp không nói rõ điều đó.
    reason: cultural_note
lexical_decisions:
- source_word: ἦν τε ὑποστρέφων
  choice: Ông đang trên đường trở về
  rationale: Kết cấu ἦν với phân từ hiện tại diễn tả hành động đang tiếp diễn trong quá khứ. Cách dịch này tự nhiên trong tiếng Việt và không thêm ý “về nhà,” vốn không được nói rõ trong câu Hy Lạp; τέ được thể hiện qua mạch liên kết của câu.
- source_word: καθήμενος
  choice: ngồi
  rationale: Phân từ này mô tả tư thế của ông trong lúc trở về. “Ngồi” là cách diễn đạt tự nhiên, rõ ràng trong tiếng Việt.
- source_word: ἐπὶ τοῦ ἅρματος αὐτοῦ
  choice: trên cỗ xe của mình
  rationale: ἐπί với sở hữu cách có nghĩa cơ bản là “trên.” “Cỗ xe” giữ hình ảnh phương tiện cổ mà không xác định quá mức kiểu xe hay sức kéo; “của mình” quy chiếu tự nhiên về chủ ngữ.
- source_word: ἀνεγίνωσκεν
  choice: đang đọc
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra. Động từ có thể chỉ việc đọc thành tiếng trong bối cảnh cổ đại, nhưng tự nó không minh nhiên mang nghĩa “thành tiếng,” nên chi tiết ấy được giữ trong chú thích.
- source_word: τὸν προφήτην Ἠσαΐαν
  choice: sách của nhà tiên tri Ê-sai
  rationale: Tiếng Hy Lạp nói sát chữ là “Ê-sai, vị tiên tri,” dùng tên tác giả/ngôn sứ để chỉ nội dung đang được đọc. Thêm “sách của” làm rõ quan hệ được hàm ý và tạo câu tiếng Việt tự nhiên, không thay đổi đối tượng được đọc.
