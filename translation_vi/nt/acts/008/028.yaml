  source_fidelity: 'Bản dịch phản ánh đúng các hành động tiếp diễn trong quá khứ: ông đang trở về, ngồi trên xe và đang đọc. “Sách của nhà tiên tri Ê-sai” diễn đạt tự nhiên đối tượng được đọc, vốn được tiếng Hy Lạp gọi bằng tên vị tiên tri. Tuy nhiên, chú thích a hiện nói sai trật tự từ Hy Lạp: τὸν προφήτην Ἠσαΐαν là “vị tiên tri Ê-sai,” không phải “Ê-sai, vị tiên tri.”'
