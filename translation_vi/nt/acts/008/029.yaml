  - severity: low
    issue: “Phán” nâng phong cách của εἶπεν.
    rationale: εἶπεν đơn giản là “said”; “bảo” vừa tự nhiên trong lời truyền lệnh vừa không tạo thêm sắc thái trang trọng mặc khải.
  revised_text: 'Bấy giờ, Thần bảo Phi-líp: “Hãy đến gần và đi sát bên cỗ xe này.”'
