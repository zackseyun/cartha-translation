  verdict: revise
  source_fidelity: 'Bản nháp dịch đúng hai mệnh lệnh chính: Πρόσελθε là tiến lại gần, và κολλήθητι là ở/đi sát bên cỗ xe. Tuy nhiên, τὸ πνεῦμα chỉ là “the Spirit” trong bản Hy Lạp, không có ἅγιον (“Holy”); “Thánh Linh” vì thế làm rõ hơn nguyên văn. Động từ εἶπεν là động từ tường thuật thông thường, nên “bảo” phản ánh tự nhiên hơn “phán”.'
  naturalness: “Bấy giờ, Thần bảo Phi-líp” là văn kể hiện đại, rõ nghĩa và tự nhiên. “Hãy đến gần và đi sát bên cỗ xe này” diễn đạt được cả sự tiến đến lẫn sự duy trì ở gần, phù hợp với mạch cảnh ở câu sau.
  terminology: Dùng “Thần” viết hoa để chuyển τὸ πνεῦμα, giữ cách gọi không có tính từ của nguyên văn đồng thời đánh dấu đây là tác nhân được văn mạch nhận diện. Giữ “Phi-líp” và “cỗ xe này” là phù hợp. Không cần chú thích vì phương án chính đã chuyển đạt được sắc thái của hai mệnh lệnh.
  issues:
