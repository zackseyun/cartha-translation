base_translation:
  language: en
  yaml_path: translation/nt/acts/008/029.yaml
  text: Then the Spirit said to Philip[a], “Go over and join this chariot.”
translation:
  language: vi
  text: 'Bấy giờ, Thần bảo Phi-líp: “Hãy đến gần và đi sát bên cỗ xe này.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: phán
  rationale: Trong ngữ cảnh Thánh Linh trực tiếp truyền lệnh, “phán” là cách diễn đạt tiếng Việt tự nhiên, trang trọng; vẫn thể hiện động từ nói thông thường của nguyên văn mà không thêm nội dung.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ chuyển câu chuyện sang diễn tiến kế tiếp, không biểu thị sự tương phản mạnh. “Bấy giờ” tạo mạch kể tự nhiên mà không nhấn quá mức quan hệ thời gian.
- source_word: τὸ πνεῦμα
  choice: Thánh Linh
  rationale: Trong sách Công Vụ, tác nhân ban chỉ dẫn mặc khải này là Đức Thánh Linh. Tiếng Việt thường cần gọi rõ danh xưng; “Thánh Linh” ngắn gọn và không thêm một chủ thể khác.
- source_word: τῷ Φιλίππῳ
  choice: với Phi-líp
  rationale: Cách nói “phán với” diễn đạt tự nhiên bổ ngữ gián tiếp ở cách dữ liệu; tên riêng được phiên âm theo lối quen thuộc trong Kinh Thánh tiếng Việt.
- source_word: Πρόσελθε
  choice: Hãy đến gần
  rationale: Mệnh lệnh này yêu cầu Phi-líp tiến về phía cỗ xe. “Đến gần” giữ trực tiếp ý nghĩa chuyển động đến gần hơn mà không xác định điểm nhìn bằng “đi qua đó” hay “lại đây”.
- source_word: κολλήθητι
  choice: đi sát bên
  rationale: Động từ diễn tả việc áp sát hoặc gắn mình vào. Trong bối cảnh một cỗ xe đang di chuyển, “đi sát bên” truyền đạt tự nhiên hành động theo gần cỗ xe, tránh nghĩa dễ gây hiểu lầm là leo lên hay gia nhập đoàn người.
- source_word: τῷ ἅρματι τούτῳ
  choice: cỗ xe này
  rationale: ἅρμα chỉ một xe ngựa hoặc cỗ xe; “cỗ xe” tự nhiên hơn “chiến xa” trong ngữ cảnh này và không thêm chức năng quân sự. “Này” giữ sắc thái gần của τούτῳ.
theological_decisions:
- issue: Chủ thể được gọi là τὸ πνεῦμα
  choice: Thánh Linh
  alternative: Linh; Đức Thánh Linh
  rationale: Mạch văn Công Vụ trình bày đây là tác nhân thần linh trực tiếp hướng dẫn các môn đồ. “Thánh Linh” xác định đúng sở chỉ trong tiếng Việt, nhưng không thêm tước hiệu “Đức” vốn không có hình thức tương ứng riêng trong câu Hy Lạp.
- issue: Sắc thái của κολλήθητι
  choice: đi sát bên cỗ xe
  alternative: gắn mình với cỗ xe; cứ ở gần cỗ xe
  rationale: Bản dịch không giải thích hành động này thành việc lên xe hoặc gia nhập đoàn tùy tùng. “Đi sát bên” bảo toàn ý niệm áp sát, đồng thời phù hợp với cảnh Phi-líp chạy đến bên xe ở câu kế tiếp.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng và dễ hiểu. Dùng “phán” cho lời truyền lệnh của Thánh Linh; dùng “cỗ xe” thay vì “chiến xa” để tránh hàm ý quân sự không có trong ngữ cảnh. Không cần chú thích vì các sắc thái chính của hai mệnh lệnh được thể hiện trực tiếp trong câu dịch.
