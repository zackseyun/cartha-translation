source:
  edition: SBLGNT
  text: ᾧ προσεῖχον ⸀πάντες ἀπὸ μικροῦ ἕως μεγάλου λέγοντες· Οὗτός ἐστιν ἡ Δύναμις τοῦ θεοῦ ἡ ⸀καλουμένη Μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/010.yaml
  text: They all paid attention to him[a], from the least to the greatest, saying, “This man is the power of God that is called Great.”
translation:
  language: vi
  text: 'Ai nấy, từ người nhỏ đến người lớn, đều chú ý đến ông và nói: “Người này là quyền năng của Đức Chúa Trời, được gọi là ‘Vĩ Đại.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Người này là Quyền năng Vĩ Đại của Đức Chúa Trời.” Câu Hy Lạp cũng có thể được hiểu cô đọng như một danh hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾧ προσεῖχον
  choice: đều chú ý đến ông
  rationale: Động từ προσέχω ở đây diễn tả việc chăm chú nghe và để tâm đến Si-môn. Cách dịch này tự nhiên trong tiếng Việt hiện đại và không cường điệu thành lòng trung thành hay sự tận hiến.
- source_word: πάντες
  choice: Tất cả mọi người
  rationale: Giữ rõ ý bao quát của πάντες và cung cấp chủ ngữ tự nhiên trong tiếng Việt.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: từ người thấp kém nhất đến người cao trọng nhất
  rationale: Thành ngữ bao quát mọi tầng lớp. Cách diễn đạt này tránh việc tiếng Việt hiểu đơn thuần là từ trẻ em đến người lớn, đồng thời giữ sự tương phản về địa vị.
- source_word: λέγοντες
  choice: và nói
  rationale: Phân từ diễn tả hành động xảy ra cùng lúc với việc họ chú ý; liên từ 'và' tạo câu tiếng Việt trôi chảy.
- source_word: Οὗτός
  choice: Người này
  rationale: Đại từ chỉ định hướng trực tiếp đến Si-môn; 'Người này' giữ sắc thái chỉ định mà vẫn tự nhiên.
- source_word: ἡ Δύναμις τοῦ θεοῦ
  choice: quyền năng của Đức Chúa Trời
  rationale: Giữ cấu trúc và nội dung lời gán của đám đông, nhưng không khiến lời kể của tác giả có vẻ xác nhận lời ấy.
- source_word: ἡ καλουμένη Μεγάλη
  choice: được gọi là ‘Vĩ Đại’
  rationale: Giữ nghĩa bị động của καλουμένη và thể hiện Μεγάλη như một danh xưng gắn với 'quyền năng', không âm thầm chuyển thành một lời mô tả thông thường.
- source_word: Μεγάλη
  choice: Vĩ Đại
  rationale: Tính từ giống cái phù hợp với Δύναμις và được dùng như danh xưng. Viết hoa và đặt trong dấu nháy giúp người đọc nhận ra đây là tên gọi trong lời của đám đông.
theological_decisions:
- issue: Lời của đám đông là một danh hiệu thần linh chính thức hay một lời mô tả về Si-môn
  choice: 'Dịch sát như lời đám đông gán cho Si-môn: “Người này là quyền năng của Đức Chúa Trời, được gọi là ‘Vĩ Đại.’”'
  alternative: “Người này chính là Quyền Năng Vĩ Đại của Đức Chúa Trời.”
  rationale: Bản Hy Lạp thuật lại lời tuyên bố của dân chúng chứ không xác nhận lời ấy là đúng. Bản dịch chính giữ cấu trúc có động từ 'được gọi' và giữ nguyên sự căng thẳng thần học; chú thích cung cấp cách hiểu cô đọng mang dáng dấp một danh hiệu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Đức Chúa Trời” theo cách gọi phổ biến trong văn bản Kinh Thánh tiếng Việt; giữ lời tuyên bố trong ngoặc kép để phân biệt rõ đó là nhận định của đám đông, không phải lời xác nhận của người kể.
