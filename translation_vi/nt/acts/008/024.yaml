  source_fidelity: 'Bản dịch chuyển tải đầy đủ các thành tố của câu Hy Lạp: δέ là chuyển ý nhẹ qua “Nhưng”; cấu trúc ἀποκριθεὶς ... εἶπεν được diễn đạt tự nhiên bằng “Si-môn đáp”; mệnh lệnh số nhiều và sự nhấn mạnh của ὑμεῖς được giữ qua “Chính các ông hãy”; ὑπὲρ ἐμοῦ là lời cầu thay “cho tôi”; và mệnh đề ὅπως ... ὧν εἰρήκατε được phản ánh đúng là “để không điều nào trong những điều các ông đã nói xảy đến với tôi.” “Chúa” bảo toàn mức độ không xác định của τὸν κύριον.'
  naturalness: Câu văn hiện đại, trang trọng và rõ nghĩa. “Cầu xin Chúa cho tôi” là cách nói Việt tự nhiên cho lời xin cầu thay. “Xảy đến với tôi” diễn đạt tốt sắc thái một tai họa hay hậu quả có thể ập đến mà không diễn giải quá mức.
  terminology: “Chúa” phù hợp với κύριος và không áp đặt việc đồng nhất rõ hơn với Đức Chúa Trời hoặc Chúa Giê-su. Tên “Si-môn” và lối xưng hô “các ông” phù hợp ngữ cảnh. Không cần chú thích; cách diễn đạt tiếng Việt không tạo ra một lựa chọn nghĩa quan trọng cần ghi chú.
  issues:
