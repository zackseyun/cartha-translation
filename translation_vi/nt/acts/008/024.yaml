id: ACT.8.24
reference: Acts 8:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Σίμων εἶπεν· Δεήθητε ὑμεῖς ὑπὲρ ἐμοῦ πρὸς τὸν κύριον ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ ὧν εἰρήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/024.yaml
  text: But Simon answered[a], “You pray to the Lord for me, so that nothing of what you have said may come upon me.”
translation:
  language: vi
  text: 'Nhưng Si-môn đáp: “Chính các ông hãy cầu xin Chúa cho tôi, để không điều nào trong những điều các ông đã nói xảy đến với tôi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Nhưng Si-môn đáp
  rationale: Cấu trúc phân từ kèm εἶπεν là thành ngữ dẫn lời đáp. “Đáp” diễn đạt tự nhiên mà không lặp hai động từ nói; “nhưng” thể hiện sự chuyển ý có sắc thái tương phản của δέ.
- source_word: Δεήθητε ὑμεῖς
  choice: Chính các ông hãy cầu xin
  rationale: Động từ chỉ việc khẩn cầu/cầu nguyện; đại từ ὑμεῖς được nêu rõ để nhấn mạnh chính Phi-líp và Giăng là những người Si-môn muốn nhờ cầu thay. “Chính các ông” giữ được nét nhấn mạnh ấy.
- source_word: ὑπὲρ ἐμοῦ
  choice: cho tôi
  rationale: ὑπέρ với sở hữu cách biểu thị cầu thay vì lợi ích hay thay mặt một người; “cho tôi” là cách nói tự nhiên trong tiếng Việt.
- source_word: πρὸς τὸν κύριον
  choice: cầu xin Chúa
  rationale: πρός chỉ hướng đến Đấng được cầu xin. Tiếng Việt tự nhiên không cần dịch riêng giới từ sau “cầu xin”; κύριος được dịch là “Chúa” mà không xác định thêm.
- source_word: ὅπως μηδὲν ἐπέλθῃ ἐπ’ ἐμὲ
  choice: để không điều nào ... xảy đến với tôi
  rationale: ὅπως nêu mục đích/kết quả mong muốn; μηδέν là “không điều nào”; ἐπέρχομαι với ἐπί mang ý điều đã cảnh báo giáng/xảy đến trên một người. “Xảy đến với tôi” vừa tự nhiên vừa giữ sắc thái tai họa có thể xảy ra.
- source_word: ὧν εἰρήκατε
  choice: trong những điều các ông đã nói
  rationale: Cấu trúc sở hữu cách có nghĩa không một điều nào thuộc số những điều đã nói. Thì hoàn thành nhấn mạnh lời cảnh báo vẫn còn hiệu lực, được diễn đạt tự nhiên bằng “đã nói” trong tiếng Việt.
theological_decisions:
- issue: Đối tượng được gọi là τὸν κύριον
  choice: Chúa
  alternative: Đức Chúa Trời; Chúa Giê-su
  rationale: Bản Hy Lạp chỉ nói “Chúa” và không buộc phải xác định đây là Đức Chúa Trời hay Chúa Giê-su. Giữ nguyên mức độ xác định của nguyên văn bảo tồn sự hàm hồ thần học chính đáng.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “các ông” theo ngữ cảnh Si-môn nói với hai sứ đồ; “chính” truyền đạt sự nhấn mạnh của đại từ ὑμεῖς. Không thêm chú thích vì câu tiếng Việt có thể diễn đạt trực tiếp quan hệ của μηδέν với ὧν εἰρήκατε mà không tạo một dị bản nghĩa đáng kể.
