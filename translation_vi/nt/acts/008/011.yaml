  text: προσεῖχον δὲ αὐτῷ διὰ τὸ ἱκανῷ χρόνῳ ταῖς μαγείαις ἐξεστακέναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/011.yaml
  text: And they paid attention to him because for a considerable time he had amazed them with his magic arts[a][b].
translation:
  language: vi
  text: Họ chú ý đến ông vì trong một thời gian khá dài, ông đã làm họ kinh ngạc bằng các phép ma thuật của ông[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bằng các sự phù phép của ông.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεῖχον
  choice: Họ chú ý đến
  rationale: Động từ ở thì chưa hoàn thành diễn tả việc dân chúng liên tục hướng sự chú ý đến Si-môn; cách diễn đạt này tự nhiên trong tiếng Việt hiện đại.
- source_word: αὐτῷ
  choice: ông
  rationale: Đại từ ở cách dữ làm bổ ngữ của προσέχω, chỉ Si-môn; tiếng Việt tự nhiên dùng “ông” trong ngữ cảnh này.
- source_word: διὰ τὸ ἱκανῷ χρόνῳ
  choice: vì trong một thời gian khá dài
  rationale: διά với động từ nguyên mẫu có mạo từ nêu nguyên nhân; ἱκανῷ χρόνῳ chỉ một khoảng thời gian đáng kể.
- source_word: ταῖς μαγείαις
  choice: bằng những thuật pháp
  rationale: μαγεία chỉ các thực hành ma thuật. “Thuật pháp” vừa tự nhiên, vừa giữ được tính chất huyền thuật mà không quyết định đó là trò lừa hay quyền lực siêu nhiên.
- source_word: ἐξεστακέναι
  choice: đã làm ... kinh ngạc
  rationale: Động từ nguyên mẫu hoàn thành của ἐξίστημι nhấn mạnh tác động gây sửng sốt đã kéo dài và là nguyên nhân khiến họ chú ý.
- source_word: αὐτούς
  choice: họ
  rationale: Tân ngữ chỉ những người dân đã được nhắc đến trong văn cảnh.
theological_decisions:
- issue: Bản chất các μαγείαις của Si-môn
  choice: “những thuật pháp,” không xác định đó là trò lừa, hoạt động huyền bí hay cả hai
  alternative: “phép thuật” hoặc “tà thuật”
  rationale: Câu này mô tả thực hành của Si-môn và tác động của chúng nhưng không giải thích bản chất siêu hình; “tà thuật” sẽ thêm một phán định mạnh hơn chính từ ngữ Hy Lạp tại đây.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Trong một thời gian khá dài” truyền đạt sức nặng của ἱκανῷ χρόνῳ; “thuật pháp” tránh sắc thái sân khấu thường gặp ở “ảo thuật” và không áp đặt cách giải thích thần học.
