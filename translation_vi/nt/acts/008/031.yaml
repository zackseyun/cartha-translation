  yaml_path: translation/nt/acts/008/031.yaml
  text: And he said[a], “How could I[b], unless someone guides me?” Then he urged Philip to come up and sit with him.
translation:
  language: vi
  text: 'Ông đáp: “Làm sao tôi có thể hiểu được, nếu không có ai hướng dẫn tôi[a]?” Rồi ông tha thiết mời Phi-líp lên ngồi cùng mình[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “dẫn dắt tôi.” Động từ Hy Lạp có thể nói đến cả việc dẫn đường lẫn hướng dẫn để hiểu.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “tha thiết yêu cầu Phi-líp lên ngồi cùng mình.” Động từ Hy Lạp có thể chỉ lời mời hoặc lời yêu cầu tha thiết.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς γὰρ ἂν δυναίμην
  choice: Làm sao tôi có thể hiểu được
  rationale: Thể optative đi với ἄν diễn tả khả năng trong điều kiện giả định. Vì lời này trực tiếp đáp lại câu hỏi về việc hiểu điều đang đọc ở câu trước, thêm “hiểu được” làm rõ bổ ngữ được hàm ý trong tiếng Hy Lạp mà vẫn giữ sắc thái “làm sao có thể”.
- source_word: ἐὰν μή τις ὁδηγήσει με
  choice: nếu không có ai hướng dẫn tôi
  rationale: ὁδηγέω có nghĩa dẫn đường hoặc hướng dẫn; trong ngữ cảnh hiểu Kinh Thánh, “hướng dẫn” tự nhiên và vẫn giữ được cả nét dẫn dắt lẫn giúp hiểu, không thu hẹp thành “giải thích”.
- source_word: παρεκάλεσέν
  choice: khẩn khoản mời
  rationale: παρακαλέω ở đây chỉ một lời yêu cầu hoặc mời gọi tha thiết. “Khẩn khoản mời” giữ được mức độ mạnh của động từ mà không quá mức như “van xin”.
- source_word: τε
  choice: Rồi
  rationale: Tiểu từ nối τέ liên kết nhẹ hai mệnh đề; “Rồi” diễn đạt tự nhiên diễn tiến của câu chuyện.
- source_word: ἀναβάντα
  choice: lên
  rationale: ἀναβαίνω mang nghĩa đi hoặc bước lên. Trong bối cảnh cỗ xe, “lên” giữ hình ảnh không gian mà không cần thêm danh từ không có trong câu này.
- source_word: καθίσαι σὺν αὐτῷ
  choice: ngồi cùng mình
  rationale: Cấu trúc với σύν diễn tả ngồi cùng người nói. “Cùng mình” là cách quy chiếu tự nhiên trong lời kể tiếng Việt; không xác định quá mức vị trí là “bên cạnh”.
- source_word: Φίλιππον
  choice: Phi-líp
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch dùng “khẩn khoản mời” để diễn đạt đồng thời sắc thái lời mời và sự tha thiết; các chú thích giữ lại phạm vi nghĩa của những động từ Hy Lạp có nhiều sắc thái.
