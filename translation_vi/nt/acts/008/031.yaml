  - severity: low
    issue: Chú thích b lặp lại gần nguyên văn lựa chọn chính thay vì nêu rõ một cách dịch thay thế.
    rationale: Bản chính đã dùng “khẩn khoản mời”; chú thích nên đưa “tha thiết yêu cầu” (hoặc tương tự) để cho thấy phổ nghĩa của động từ mà không gây cảm giác chú thích chỉ lặp lại bản văn.
