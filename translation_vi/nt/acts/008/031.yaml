  terminology: “Hướng dẫn” giữ được độ mở nghĩa của ὁδηγέω, không thu hẹp thành “giải thích”; “Phi-líp” là dạng tên riêng quen thuộc và nhất quán. Chú thích b cần nêu một phương án thực sự phân biệt với bản chính và phản ánh phổ nghĩa yêu cầu/mời gọi của động từ.
