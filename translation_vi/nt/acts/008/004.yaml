  text: So those who had been scattered went through the region proclaiming the word[a][b][c].
translation:
  language: vi
  text: Vậy, những người đã bị phân tán đi từ nơi này đến nơi khác và rao giảng lời ấy[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc dịch: “đi khắp nơi rao giảng lời ấy.” Động từ Hy Lạp có sắc thái loan báo tin mừng.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp là “lời”; trong văn cảnh, từ này chỉ sứ điệp được công bố.
    reason: lexical_clarification
lexical_decisions:
- source_word: Οἱ μὲν οὖν
  choice: Vậy, những người
  rationale: “Vậy” diễn đạt sức suy luận/chuyển tiếp của οὖν từ cuộc bách hại và sự phân tán vừa được kể; μέν chủ yếu tổ chức mạch văn nên không cần dịch riêng một cách gượng ép.
- source_word: διασπαρέντες
  choice: đã bị phân tán
  rationale: Phân từ aorist bị động chỉ việc họ bị làm cho tản ra trước hành động của động từ chính. “Đã bị phân tán” vừa giữ thể bị động vừa thể hiện quan hệ thời gian ấy.
- source_word: διῆλθον
  choice: đi từ nơi này đến nơi khác
  rationale: Trong ngữ cảnh, động từ diễn tả việc di chuyển qua nhiều nơi, không chỉ đi ngang qua một lần. Cách dịch này tự nhiên và không thêm một địa danh hay “khu vực” không có trong câu Hy Lạp.
- source_word: εὐαγγελιζόμενοι
  choice: loan báo … như tin mừng
  rationale: Động từ mang nghĩa công bố điều gì như tin mừng. Cách diễn đạt này giữ sắc thái “tin mừng” của động từ đồng thời cho phép τὸν λόγον tiếp tục làm nội dung trực tiếp được công bố.
- source_word: τὸν λόγον
  choice: lời ấy
  rationale: Mạo từ xác định hướng về sứ điệp đã được biết trong văn cảnh. “Lời ấy” giữ từ “lời” của nguyên bản mà không tự ý thêm “của Đức Chúa Trời” hoặc “về Chúa Giê-su” vào chính văn.
theological_decisions:
- issue: Quan hệ giữa εὐαγγελιζόμενοι và τὸν λόγον
  choice: loan báo lời ấy như tin mừng
  alternative: rao giảng lời ấy; loan báo sứ điệp Tin Mừng
  rationale: Trong tiếng Hy Lạp, τὸν λόγον là tân ngữ trực tiếp của động từ mang nghĩa loan báo tin mừng. Bản dịch tránh cấu trúc “tin mừng của lời” vì có thể tạo một quan hệ sở hữu không có trong nguyên bản; đồng thời không làm mất sắc thái tin mừng vốn nằm trong động từ.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Đi từ nơi này đến nơi khác” diễn đạt tự nhiên hành trình qua nhiều nơi; “loan báo” phù hợp với việc công bố rộng rãi hơn là chỉ giảng trong một buổi nhóm.
