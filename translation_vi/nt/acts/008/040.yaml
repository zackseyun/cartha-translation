revisions:
- from: Nhưng Phi-líp được thấy ở A-xốt[a]. Trên đường đi qua vùng ấy, ông rao truyền tin mừng cho tất cả các thành, cho đến khi đến Sê-sa-rê.
  to: Nhưng Phi-líp được tìm thấy tại A-xốt[a], và trên đường đi, ông rao truyền tin mừng cho mọi thành, cho đến khi ông đến Sê-sa-rê.
  rationale: Sửa “được thấy” thành “được tìm thấy” để tiếng Việt tự nhiên mà vẫn giữ cách diễn đạt bị động, không diễn giải phép lạ trong chính văn. Bỏ “vùng ấy” vì không có tương ứng trong nguyên ngữ. Điều chỉnh chú thích để nêu khả năng hàm ý của ngữ cảnh mà không xác định tác nhân thần học vượt quá câu văn.
  reviewer_model: gpt-5.6-terra
