source:
  edition: SBLGNT
  text: Φίλιππος δὲ εὑρέθη εἰς Ἄζωτον, καὶ διερχόμενος εὐηγγελίζετο τὰς πόλεις πάσας ἕως τοῦ ἐλθεῖν αὐτὸν εἰς Καισάρειαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/008/040.yaml
  text: But Philip was found at Azotus[a], and as he passed through, he was proclaiming the good news to all the cities until he came to Caesarea.
translation:
  language: vi
  text: Nhưng Phi-líp được tìm thấy tại A-xốt[a], và trên đường đi, ông rao truyền tin mừng cho mọi thành, cho đến khi ông đến Sê-sa-rê.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “xuất hiện tại A-xốt.” Nguyên văn Hy Lạp sát nghĩa là “được tìm thấy tại A-xốt”; trong ngữ cảnh, cách nói này có thể hàm ý ông đã được chuyển đến đó đột ngột, nhưng không nói rõ điều ấy.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Nhưng
  rationale: Đánh dấu sự chuyển tiếp và tương phản nhẹ với việc Thần Khí đem Phi-líp đi ở câu trước.
- source_word: εὑρέθη
  choice: được thấy
  rationale: Giữ sát thể bị động của εὑρίσκω và không giải thích quá mức cách Phi-líp được đưa đến nơi ấy.
- source_word: εἰς Ἄζωτον
  choice: ở A-xốt
  rationale: Trong kết cấu với εὑρέθη, giới từ εἰς diễn tả vị trí đạt đến sau sự di chuyển.
- source_word: διερχόμενος
  choice: Trên đường đi qua vùng ấy
  rationale: Diễn đạt tự nhiên hành động di chuyển đang diễn ra đồng thời; 'vùng ấy' chỉ khu vực dọc lộ trình chứ không thêm một địa danh mới.
- source_word: εὐηγγελίζετο
  choice: ông rao truyền tin mừng
  rationale: Diễn đạt hành động tiếp diễn/lặp lại của thì chưa hoàn thành bằng ngôn ngữ hiện đại, dễ hiểu, không dùng thuật ngữ giáo hội chuyên biệt.
- source_word: τὰς πόλεις πάσας
  choice: cho tất cả các thành
  rationale: 'Giữ ý tập hợp và phân bố: mọi thành nằm dọc hành trình của Phi-líp.'
- source_word: ἕως τοῦ ἐλθεῖν αὐτὸν
  choice: cho đến khi đến
  rationale: Diễn đạt tự nhiên điểm kết thúc của hành động đang tiếp diễn; chủ thể vẫn rõ là Phi-líp.
- source_word: εἰς Καισάρειαν
  choice: Sê-sa-rê
  rationale: Với động từ 'đến', tên địa danh tự nhiên mang nghĩa đích đến trong tiếng Việt.
theological_decisions:
- issue: Có nên dịch εὑρέθη theo cách nói rõ Phi-líp xuất hiện cách kỳ diệu hay không
  choice: Giữ cách nói trung tính 'được thấy' trong chính văn
  alternative: '''xuất hiện ở A-xốt'' hoặc ''thấy mình ở A-xốt'''
  rationale: Ngữ cảnh hàm ý mạnh mẽ hành động siêu nhiên của Đức Chúa Trời, nhưng bản thân từ Hy Lạp chỉ nói 'được thấy'. Cách dịch này giữ nguyên sự hàm ẩn và tránh đưa lời giải thích thần học vào chính văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng phiên âm quen thuộc A-xốt, Sê-sa-rê; giữ 'tin mừng' trong sáng hơn thuật ngữ chuyên biệt. Cấu trúc được chia thành hai câu để tiếng Việt tự nhiên mà vẫn bảo toàn tiến trình của câu Hy Lạp.
