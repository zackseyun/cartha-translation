  text: τότε ὁ Φῆστος συλλαλήσας μετὰ τοῦ συμβουλίου ἀπεκρίθη· Καίσαρα ἐπικέκλησαι, ἐπὶ Καίσαρα πορεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/012.yaml
  text: Then Festus[a], after conferring with the council, answered, “You have appealed to Caesar; to Caesar you will go.”
translation:
  language: vi
  text: 'Bấy giờ, sau khi bàn bạc với hội đồng, Phê-tu trả lời: “Ông đã kháng cáo lên Xê-da; ông sẽ đến Xê-da[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ông sẽ ra trước Xê-da.” Trong bối cảnh pháp lý, cụm từ này hàm ý người kháng cáo sẽ đến trước tòa án của hoàng đế.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Bấy giờ
  rationale: Diễn đạt tự nhiên mối nối tiếp theo thời gian trong lời thuật chuyện.
- source_word: συλλαλήσας
  choice: sau khi bàn bạc
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; “bàn bạc” thể hiện cuộc trao đổi có tính tham vấn.
- source_word: μετὰ τοῦ συμβουλίου
  choice: với hội đồng
  rationale: Giữ danh từ chỉ cơ quan tham nghị, không thêm đại từ sở hữu vì nguyên văn không có.
- source_word: ἀπεκρίθη
  choice: trả lời
  rationale: Cách diễn đạt thông dụng, phù hợp với sắc thái trang trọng của bối cảnh pháp lý.
- source_word: Καίσαρα
  choice: Xê-da
  rationale: Giữ tước hiệu/tên gọi La Mã theo dạng phiên âm quen thuộc trong tiếng Việt, thay vì giải nghĩa thành “hoàng đế”.
- source_word: ἐπικέκλησαι
  choice: đã kháng cáo lên
  rationale: Thể hoàn thành trung cách mang nghĩa pháp lý là viện đến thẩm quyền xét xử của Xê-da; “kháng cáo lên” rõ nghĩa và tự nhiên trong tiếng Việt.
- source_word: ἐπὶ Καίσαρα
  choice: đến Xê-da
  rationale: Cùng với động từ chỉ sự đi, cụm này trước hết diễn tả hướng đến người có thẩm quyền; cách hiểu “ra trước Xê-da” được giữ trong chú thích vì hàm ý pháp đình.
- source_word: πορεύσῃ
  choice: ông sẽ đi
  rationale: Giữ nghĩa chủ động/trung cách của động từ chỉ sự di chuyển, không tự ý chuyển thành “sẽ được giải đến” hay “sẽ được đưa đến”.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu; dùng “ông” để Phê-tu trực tiếp nói với Phao-lô. Cấu trúc lặp “Xê-da” được giữ nhằm bảo toàn tính dứt khoát và cân xứng của nguyên văn.
