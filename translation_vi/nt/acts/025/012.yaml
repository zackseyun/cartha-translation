  terminology: “Phê-tu,” “Xê-da,” “hội đồng,” và “kháng cáo” đều phù hợp với bối cảnh La Mã-pháp lý. Chú thích nêu đúng khả năng hiểu ἐπὶ Καίσαρα theo nghĩa ra trước thẩm quyền xét xử của hoàng đế, không biến nó thành bản dịch chính.
