  source_fidelity: Bản dịch truyền đạt đúng trình tự của câu, cuộc bàn bạc trước khi Phê-tu đáp lời, và ý nghĩa pháp lý của ἐπικέκλησαι là kháng cáo lên thẩm quyền của Xê-da. Cách lặp lại “Xê-da” cũng phản ánh đúng cấu trúc nhấn mạnh của nguyên văn. Tuy nhiên, “sẽ đi đến Xê-da” hơi trùng và gượng trong tiếng Việt; “sẽ đến Xê-da” vẫn giữ nghĩa πορεύσῃ mà tự nhiên hơn.
