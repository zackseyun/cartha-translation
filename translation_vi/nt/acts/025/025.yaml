id: ACT.25.25
reference: Acts 25:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ⸀κατελαβόμην μηδὲν ἄξιον ⸂αὐτὸν θανάτου⸃ πεπραχέναι, ⸀αὐτοῦ δὲ τούτου ἐπικαλεσαμένου τὸν Σεβαστὸν ἔκρινα ⸀πέμπειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/025.yaml
  text: But I found that he had done nothing deserving death; and because he himself appealed to the Emperor[a], I decided to send him.
translation:
  language: vi
  text: Nhưng tôi nhận thấy người này không làm điều gì đáng chết; và vì chính ông ấy đã kháng cáo lên Hoàng đế[a], nên tôi quyết định giải ông ấy đi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “Augustus.” Tước hiệu Hy Lạp Σεβαστός ở đây chỉ hoàng đế La Mã.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελαβόμην
  choice: tôi nhận thấy
  rationale: Trong bối cảnh xét xử, động từ diễn tả kết luận của Phê-tu sau khi xem xét vụ việc. “Nhận thấy” tự nhiên trong tiếng Việt và không nhấn mạnh quá mức tính chất của một phán quyết chính thức.
- source_word: μηδὲν ἄξιον ... θανάτου
  choice: không làm điều gì đáng chết
  rationale: Cách diễn đạt này giữ sát ý rằng không có hành vi nào đáng phải chịu chết, đồng thời tránh thêm thuật ngữ pháp lý cụ thể “án tử hình” vốn không xuất hiện trực tiếp trong câu Hy Lạp.
- source_word: αὐτὸν θανάτου πεπραχέναι
  choice: người này không làm điều gì đáng chết
  rationale: Kết cấu đối cách cộng nguyên mẫu được chuyển thành mệnh đề nội dung tự nhiên trong tiếng Việt. “Người này” phù hợp với việc Phê-tu đang nói về Phao-lô trước vua Ạc-ríp-ba.
- source_word: πεπραχέναι
  choice: làm
  rationale: Động từ chỉ hành vi đã thực hiện; “làm” giữ được nghĩa rộng của nguyên ngữ, còn sắc thái tư pháp đã được thể hiện qua cụm “đáng chết”.
- source_word: αὐτοῦ δὲ τούτου ἐπικαλεσαμένου
  choice: vì chính ông ấy đã kháng cáo
  rationale: Kết cấu sở hữu cách tuyệt đối nêu hoàn cảnh dẫn đến quyết định của Phê-tu. “Vì” thể hiện quan hệ nguyên nhân theo ngữ cảnh, còn “chính ông ấy” giữ sự nhấn mạnh của αὐτοῦ ... τούτου.
- source_word: ἐπικαλεσαμένου
  choice: đã kháng cáo lên
  rationale: Trong bối cảnh pháp luật La Mã, động từ chỉ việc yêu cầu thẩm quyền hoàng đế xét xử; “kháng cáo lên” là cách nói rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: τὸν Σεβαστόν
  choice: Hoàng đế
  rationale: Σεβαστός là tước hiệu Hy Lạp tương ứng với Augustus và ở đây chỉ đương kim hoàng đế La Mã. “Hoàng đế” truyền đạt rõ chức vị cho độc giả hiện đại; chú thích bảo lưu cách gọi sát hình thức hơn.
- source_word: ἔκρινα
  choice: tôi quyết định
  rationale: Ở đây động từ diễn tả quyết định hành chính của Phê-tu. “Quyết định” rõ ràng và tự nhiên hơn “phán xét” trong tiếng Việt hiện đại.
- source_word: πέμπειν
  choice: giải ông ấy đi
  rationale: Nguyên mẫu bổ nghĩa cho “quyết định.” Trong bối cảnh một tù nhân được chuyển đến thẩm quyền hoàng đế, “giải ... đi” tự nhiên và thể hiện đúng hoàn cảnh hơn từ chung chung “gửi,” mà không xác định đích đến ngoài ngữ cảnh.
