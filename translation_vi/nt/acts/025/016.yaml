translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu giữ trình tự lập luận pháp lý của nguyên văn; “để làm ơn” bảo tồn sắc thái của χαρίζομαι, còn chú thích nêu phương án gọn hơn.
