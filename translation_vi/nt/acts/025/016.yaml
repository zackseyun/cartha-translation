  text: πρὸς οὓς ἀπεκρίθην ὅτι οὐκ ἔστιν ἔθος Ῥωμαίοις χαρίζεσθαί τινα ⸀ἄνθρωπον πρὶν ἢ ὁ κατηγορούμενος κατὰ πρόσωπον ἔχοι τοὺς κατηγόρους τόπον τε ἀπολογίας λάβοι περὶ τοῦ ἐγκλήματος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/016.yaml
  text: To them I answered that it is not the custom of the Romans to hand over any man before the accused has the accusers face to face and receives an opportunity for a defense concerning the charge[a][b].
translation:
  language: vi
  text: Tôi đã trả lời họ rằng người La Mã không có thông lệ giao nộp bất cứ ai như một ân huệ[a], trước khi bị cáo được đối diện với những người tố cáo mình và có cơ hội biện hộ về lời buộc tội.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hoặc: “ban cho bất cứ ai như một ân huệ.” Động từ Hy Lạp có thể chỉ việc giao một người cho bên yêu cầu như một sự vị nể.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθος
  choice: thông lệ
  rationale: Chỉ tập quán hay cách làm đã được thiết lập; “thông lệ” tự nhiên và phù hợp với bối cảnh pháp lý.
- source_word: Ῥωμαίοις
  choice: người La Mã
  rationale: Dạng tặng cách số nhiều nói về người La Mã xét như cộng đồng có thông lệ tư pháp.
- source_word: χαρίζεσθαί
  choice: giao nộp ... để làm ơn
  rationale: Động từ vừa có ý giao một người cho phía yêu cầu, vừa hàm ý ban điều đó như một ân huệ; cách dịch giữ được cả hành động pháp lý lẫn sắc thái vị nể.
- source_word: τινα ἄνθρωπον
  choice: bất cứ ai
  rationale: Cụm từ chỉ một con người bất kỳ; trong tiếng Việt, “bất cứ ai” diễn đạt tự nhiên tính khái quát mà không làm thay đổi phạm vi nghĩa.
- source_word: ὁ κατηγορούμενος
  choice: bị cáo
  rationale: Phân từ được dùng như danh từ để chỉ người đang bị tố cáo; “bị cáo” ngắn gọn và thích hợp trong ngữ cảnh xét xử.
- source_word: κατὰ πρόσωπον
  choice: đối diện với
  rationale: Thành ngữ diễn tả việc trực tiếp giáp mặt những người tố cáo; “đối diện với” tự nhiên trong văn cảnh pháp lý.
- source_word: τόπον ... ἀπολογίας
  choice: có cơ hội biện hộ
  rationale: τόπος ở đây là cơ hội hay điều kiện, không phải địa điểm; ἀπολογία là lời tự bào chữa trước cáo buộc.
- source_word: ἐγκλήματος
  choice: lời buộc tội
  rationale: Chỉ cáo buộc pháp lý được nêu ra chống lại bị cáo; cách diễn đạt rõ nghĩa mà không quá chuyên môn.
