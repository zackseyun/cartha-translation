  to: Tôi đã trả lời họ rằng người La Mã không có thông lệ giao nộp bất cứ ai như một ân huệ[a], trước khi bị cáo được đối diện với những người tố cáo mình và có cơ hội biện hộ về lời buộc tội.
  rationale: Chỉnh cách diễn đạt sắc thái của χαρίζεσθαι từ mệnh đề chỉ mục đích dễ gây hiểu lầm thành “như một ân huệ,” qua đó bảo toàn ý giao/nhượng một người như sự vị nể. Các thành phần pháp lý và trật tự lập luận của nguyên văn được giữ nguyên.
