  text: παραγενομένου δὲ αὐτοῦ περιέστησαν ⸀αὐτὸν οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι, πολλὰ καὶ βαρέα αἰτιώματα ⸀καταφέροντες ἃ οὐκ ἴσχυον ἀποδεῖξαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/007.yaml
  text: And when he arrived[a], the Jews who had come down from Jerusalem stood around him[b], bringing many serious charges that they were not able to prove.
translation:
  language: vi
  text: Khi Phao-lô đến, những người Do Thái từ Giê-ru-sa-lem xuống đứng vây quanh ông[a], đưa ra nhiều cáo buộc nghiêm trọng mà họ không thể chứng minh được.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đứng quanh ông.” Động từ Hy Lạp mô tả việc đứng bao quanh một người; trong bối cảnh xét xử, tư thế ấy có thể hàm ý gây áp lực.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενομένου δὲ αὐτοῦ
  choice: Khi Phao-lô đến
  rationale: Kết cấu sở hữu cách tuyệt đối diễn tả hoàn cảnh thời gian. Dùng tên Phao-lô thay cho đại từ để câu tiếng Việt rõ chủ thể theo văn cảnh.
- source_word: περιέστησαν αὐτὸν
  choice: đứng vây quanh ông
  rationale: Giữ cả tư thế đứng quanh và sắc thái tạo áp lực có thể hàm chứa trong bối cảnh xét xử, nhưng không diễn đạt quá mức thành hành vi bạo lực.
- source_word: οἱ ἀπὸ Ἱεροσολύμων καταβεβηκότες Ἰουδαῖοι
  choice: những người Do Thái từ Giê-ru-sa-lem xuống
  rationale: Ἰουδαῖοι ở đây chỉ những người Do Thái làm bên cáo buộc; καταβεβηκότες được dịch là 'xuống', phù hợp cách nói địa lý từ Giê-ru-sa-lem.
- source_word: πολλὰ καὶ βαρέα αἰτιώματα
  choice: nhiều cáo buộc nghiêm trọng
  rationale: αἰτιώματα mang nghĩa pháp lý là các cáo buộc; βαρέα diễn tả mức độ nặng hoặc nghiêm trọng.
- source_word: καταφέροντες
  choice: đưa ra
  rationale: Trong ngữ cảnh pháp lý, từ này chỉ việc đưa ra hoặc đệ trình cáo buộc; 'đưa ra' tự nhiên và rõ nghĩa trong tiếng Việt.
- source_word: ἃ οὐκ ἴσχυον ἀποδεῖξαι
  choice: mà họ không thể chứng minh được
  rationale: Giữ nguyên ý họ không có khả năng chứng minh các cáo buộc; cách diễn đạt này tự nhiên và đúng sắc thái pháp lý.
