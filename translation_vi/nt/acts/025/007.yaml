  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng thuật ngữ pháp lý thông dụng 'cáo buộc' và giữ cách nói địa lý 'từ Giê-ru-sa-lem xuống'. Dấu chú thích [a] được đặt ngay sau cụm từ liên quan.
