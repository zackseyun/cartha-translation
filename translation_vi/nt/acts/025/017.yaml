base_translation:
  language: en
  yaml_path: translation/nt/acts/025/017.yaml
  text: So when they had come together here[a], I made no delay, but on the next day I sat on the judgment seat and ordered the man to be brought.
translation:
  language: vi
  text: Vậy, khi họ đã tụ họp tại đây, tôi không trì hoãn chút nào; hôm sau, tôi ngồi trên ghế xét xử[a] và ra lệnh đưa người ấy đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “tôi ngồi trên bục xét xử”. Từ Hy Lạp βῆμα chỉ ghế xét xử chính thức hoặc bục xét xử.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνελθόντων
  choice: khi họ đã cùng đến
  rationale: Phân từ bất định thuộc cách tạo thành kết cấu độc lập, với chủ thể ngầm là những người tố cáo hoặc các bên liên quan; cách dịch này giữ cả ý đến và tụ họp.
- source_word: οὖν
  choice: Vậy
  rationale: Nối tiếp và rút ra hệ quả trong lời thuật của Phê-tu; “Vậy” tự nhiên trong văn kể trang trọng.
- source_word: ἐνθάδε
  choice: đây
  rationale: Trạng từ chỉ nơi chốn, quy chiếu đến nơi Phê-tu đang phát biểu.
- source_word: ἀναβολὴν μηδεμίαν ποιησάμενος
  choice: tôi không trì hoãn chút nào
  rationale: Diễn đạt tự nhiên thành ngữ pháp lý mang nghĩa không hoãn lại việc xét xử.
- source_word: τῇ ἑξῆς
  choice: ngay hôm sau
  rationale: Thành ngữ thời gian chỉ ngày kế tiếp; “ngay” cũng truyền đạt việc không trì hoãn nêu ở mệnh đề trước.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: tôi ngồi trên ghế xét xử
  rationale: βῆμα trong ngữ cảnh này là chỗ ngồi hoặc bục chính thức để thi hành việc xét xử; bản dịch giữ hình ảnh cụ thể và chức năng pháp lý.
- source_word: ἐκέλευσα
  choice: truyền
  rationale: Chỉ việc ban lệnh chính thức; “truyền” phù hợp với lời của một quan chức và có sắc thái trang trọng mà vẫn dễ hiểu.
- source_word: ἀχθῆναι
  choice: đưa ... đến
  rationale: Động từ nguyên mẫu bị động của ἄγω; tiếng Việt dùng cấu trúc chủ động sau “truyền” tự nhiên hơn nhưng vẫn giữ nghĩa người ấy bị đưa tới theo lệnh.
- source_word: τὸν ἄνδρα
  choice: người ấy
  rationale: Chỉ người đàn ông đã được nhắc đến, tức Phao-lô; “người ấy” tự nhiên hơn “người đàn ông” trong mạch văn và không thêm ý “bị cáo” vốn không được nói rõ tại đây.
