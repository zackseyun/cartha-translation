  register: Văn phong hiện đại, trang trọng và rõ ràng, phù hợp lời tường thuật hành chính-pháp lý. Dấu chấm phẩy giúp thể hiện bước chuyển từ việc không trì hoãn sang hành động xét xử vào hôm sau.
