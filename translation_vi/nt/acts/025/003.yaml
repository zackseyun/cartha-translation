  source_fidelity: 'Bản nháp truyền đạt đúng ý chính: họ xin một sự nhượng bộ nhằm chống lại Phao-lô và bí mật chuẩn bị giết ông trên đường. Tuy nhiên, “cho người gọi ông” không phản ánh rõ cấu trúc và ý nghĩa của μεταπέμψηται: Phê-tu là người được xin thực hiện việc cho gọi/điều Phao-lô đến Giê-ru-sa-lem, không phải một “người” không xác định được gọi đi. Chú thích hiện tại cũng không ghi nhận đúng lựa chọn từ vựng được nêu trong vết kiểm tra tiếng Anh.'
  naturalness: “Cho người gọi ông” không tự nhiên và gây mơ hồ trong tiếng Việt. “Cho gọi Phao-lô đến Giê-ru-sa-lem” rõ ràng, trang trọng, và tự nhiên. “Bố trí một cuộc phục kích” là cách diễn đạt trọn vẹn hơn “sắp đặt phục kích.”
  terminology: Giữ “ân huệ,” “Phao-lô,” và “Giê-ru-sa-lem” phù hợp văn phong Kinh Thánh hiện đại. “Bất lợi cho Phao-lô” diễn đạt được lực đối nghịch của κατ’ αὐτοῦ mà không thêm diễn giải. Chú thích nên đặt tại “cho gọi” và nêu khả năng “cho áp giải đến,” tương ứng với phạm vi nghĩa của μεταπέμπομαι trong ngữ cảnh.
  issues:
  - severity: medium
    issue: Cụm “cho người gọi ông về Giê-ru-sa-lem” sai/khó hiểu về chủ thể và cấu trúc.
    rationale: μεταπέμψηται là động từ chủ động ở thể giữa, chỉ việc Phê-tu cho gọi hoặc thu xếp đưa Phao-lô đến Giê-ru-sa-lem. “Người” ở đây không có đối ứng trong tiếng Hy Lạp và làm câu tiếng Việt thiếu rõ ràng.
  - severity: medium
    issue: Chú thích [a] không phản ánh bất định từ vựng thực tế của μεταπέμψηται.
    rationale: Chú thích hiện có đổi quan hệ “ân huệ ... bất lợi cho” thành “chiều theo họ mà chống lại,” vốn là diễn đạt lại chứ không phải một lựa chọn văn bản/từ vựng cần thiết. Vết kiểm tra tiếng Anh ghi chú sự thay thế giữa “cho gọi” và “cho áp giải/đưa đến.”
  - severity: low
    issue: “sắp đặt phục kích” thiếu bổ ngữ danh từ và kém tự nhiên hơn.
    rationale: ἐνέδραν ποιοῦντες nói đến việc lập/bố trí một cuộc phục kích; thêm “một cuộc” tạo câu tiếng Việt hoàn chỉnh.
