  text: 'xin ông ban cho họ một ân huệ bất lợi cho Phao-lô: cho gọi Phao-lô đến Giê-ru-sa-lem[a], đồng thời họ bố trí một cuộc phục kích để giết ông dọc đường.'
  philosophy: optimal-equivalence
