    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτούμενοι χάριν κατ’ αὐτοῦ
  choice: xin ông ban cho họ một ân huệ bất lợi cho Phao-lô
  rationale: Diễn đạt tự nhiên thành ngữ xin một ân huệ, đồng thời giữ sắc thái đối nghịch của κατ’ αὐτοῦ; nêu tên Phao-lô để đại từ trong tiếng Việt không mơ hồ.
- source_word: ὅπως μεταπέμψηται αὐτὸν εἰς Ἰερουσαλήμ
  choice: cho người gọi ông về Giê-ru-sa-lem
  rationale: μεταπέμπομαι có nghĩa sai người đi gọi hoặc triệu đến; cách dịch này giữ vai trò chủ động của Phê-tu mà không khẳng định quá mức cơ chế áp giải.
- source_word: ἐνέδραν ποιοῦντες
  choice: Trong khi đó, họ sắp đặt phục kích
  rationale: Giữ hành động đồng thời của phân từ hiện tại và diễn đạt rõ âm mưu đang được chuẩn bị.
- source_word: ἀνελεῖν αὐτὸν κατὰ τὴν ὁδόν
  choice: để giết ông dọc đường
  rationale: ἀναιρέω trong ngữ cảnh là giết; κατὰ τὴν ὁδόν chỉ địa điểm trong hành trình, được diễn đạt tự nhiên là dọc đường.
