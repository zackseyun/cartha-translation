source:
  edition: SBLGNT
  text: Φῆστος οὖν ἐπιβὰς τῇ ἐπαρχείᾳ μετὰ τρεῖς ἡμέρας ἀνέβη εἰς Ἱεροσόλυμα ἀπὸ Καισαρείας,
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/001.yaml
  text: So Festus[a], after arriving in the province, went up from Caesarea to Jerusalem after three days,
translation:
  language: vi
  text: Vậy, sau khi đến tỉnh[a], ba ngày sau, Phê-tu từ Sê-sa-rê lên Giê-ru-sa-lem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sau khi vào tỉnh” hoặc “sau khi tiếp nhận quyền cai quản tỉnh”. Phân từ Hy Lạp có thể chỉ việc Phê-tu đến tỉnh và, theo hàm ý, bắt đầu đảm nhiệm quyền cai quản tại đó.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Vậy
  rationale: Đánh dấu bước tiếp diễn có liên hệ với phần tường thuật trước, tự nhiên và trang trọng trong tiếng Việt.
- source_word: ἐπιβὰς τῇ ἐπαρχείᾳ
  choice: sau khi đến nhậm chức tại tỉnh
  rationale: Cụm phân từ nói đến việc Phê-tu đến tỉnh thuộc quyền mình và trong văn cảnh hàm ý bắt đầu nhiệm kỳ; cách dịch này tự nhiên nhưng vẫn ghi chú nghĩa sát chữ.
- source_word: ἐπαρχείᾳ
  choice: tỉnh
  rationale: Chỉ một đơn vị hành chính của La Mã; “tỉnh” là cách gọi rõ ràng, dễ hiểu trong tiếng Việt hiện đại.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: ba ngày sau đó
  rationale: Diễn đạt tự nhiên giá trị thời gian của μετά với đối cách, tức sự việc xảy ra sau khoảng ba ngày.
- source_word: ἀνέβη
  choice: lên
  rationale: Giữ cách nói địa lý quen thuộc về hành trình lên Giê-ru-sa-lem.
- source_word: εἰς Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Đích đến của hành trình, dùng dạng phiên âm Kinh Thánh quen thuộc trong tiếng Việt.
- source_word: ἀπὸ Καισαρείας
  choice: từ Sê-sa-rê
  rationale: ἀπό chỉ nơi xuất phát; “từ” truyền đạt trực tiếp quan hệ này.
- source_word: Φῆστος
  choice: Phê-tu
  rationale: Dùng dạng phiên âm tên riêng Hy Lạp quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
