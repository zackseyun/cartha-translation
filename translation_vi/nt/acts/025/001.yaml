  terminology: “Tỉnh” truyền đạt phù hợp ἐπαρχεία trong bối cảnh hành chính La Mã. Giữ “Phê-tu,” “Sê-sa-rê,” và “Giê-ru-sa-lem” theo dạng phiên âm Kinh Thánh Việt ngữ quen dùng.
