id: ACT.25.15
reference: Acts 25:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: περὶ οὗ γενομένου μου εἰς Ἱεροσόλυμα ἐνεφάνισαν οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τῶν Ἰουδαίων, αἰτούμενοι κατ’ αὐτοῦ ⸀καταδίκην·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/015.yaml
  text: Concerning him[a], when I arrived in Jerusalem, the chief priests and the elders of the Jews informed me, asking for a sentence of condemnation against him.
translation:
  language: vi
  text: Về người ấy, khi tôi đến Giê-ru-sa-lem, các thầy tế lễ cả và các trưởng lão của người Do Thái đã trình vụ việc với tôi, xin tôi kết án người ấy.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “xin một bản án kết tội người ấy” hoặc “xin tuyên người ấy có tội.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: Về người ấy
  rationale: Cụm giới từ với đại từ quan hệ quy chiếu về Phao-lô và nêu người đang được bàn đến; cách dịch này rõ ràng, tự nhiên và vẫn phản ánh vị trí nhấn ở đầu câu.
- source_word: γενομένου μου εἰς Ἱεροσόλυμα
  choice: khi tôi đến Giê-ru-sa-lem
  rationale: Cấu trúc sở hữu cách tuyệt đối với γίνομαι và εἰς chỉ thời điểm Phê-tu đến nơi; “khi tôi đến” là tiếng Việt tự nhiên và chính xác.
- source_word: ἐνεφάνισαν
  choice: đã trình vụ việc với tôi
  rationale: Trong bối cảnh pháp lý-hành chính, động từ chỉ việc đưa sự việc ra trước một nhà chức trách. Cách dịch này tự nhiên hơn “thông báo cho tôi” và không thêm ý rằng họ đã trình bày toàn bộ hồ sơ.
- source_word: οἱ ἀρχιερεῖς
  choice: các thầy tế lễ cả
  rationale: Danh xưng số nhiều chỉ giới lãnh đạo tư tế, phù hợp cách gọi quen thuộc trong tiếng Việt và không bị hiểu là nhiều thầy tế lễ thượng phẩm đương nhiệm.
- source_word: οἱ πρεσβύτεροι τῶν Ἰουδαίων
  choice: các trưởng lão của người Do Thái
  rationale: Giữ quan hệ sở hữu của nguyên văn và xác định đúng nhóm trưởng lão được nói đến.
- source_word: αἰτούμενοι
  choice: xin tôi
  rationale: Phân từ diễn tả lời thỉnh cầu đi kèm việc trình vụ việc; thêm “tôi” theo ngữ cảnh để câu tiếng Việt rõ chủ thể tiếp nhận yêu cầu.
- source_word: κατ’ αὐτοῦ
  choice: người ấy
  rationale: Trong cụm pháp lý với καταδίκην, ý đối nghịch “chống lại người ấy” được diễn đạt tự nhiên trong tiếng Việt bằng bổ ngữ trực tiếp của “kết án”.
- source_word: καταδίκην
  choice: kết án
  rationale: Danh từ này chỉ sự phán quyết bất lợi hay án kết tội trong tư pháp. Chuyển thành động từ tạo câu tiếng Việt tự nhiên mà vẫn giữ nguyên lực pháp lý; chú thích ghi nhận các cách hiểu sát hình thức danh từ hơn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Trình vụ việc” giữ sắc thái hành chính-pháp lý; “kết án” tránh cách diễn đạt nặng tính Hán-Việt nhưng vẫn bảo toàn ý nghĩa tư pháp. Dấu chú thích được đặt ngay sau mệnh đề liên quan.
