reference: Acts 25:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπορούμενος δὲ ἐγὼ τὴν περὶ ⸀τούτων ζήτησιν ἔλεγον εἰ βούλοιτο πορεύεσθαι εἰς ⸀Ἱεροσόλυμα κἀκεῖ κρίνεσθαι περὶ τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/020.yaml
  text: And since I was at a loss about the investigation concerning these matters[b][a], I asked whether he wanted to go to Jerusalem and be judged there concerning them.
translation:
  language: vi
  text: Nhưng vì tôi lúng túng về việc xem xét những vấn đề này[a], nên tôi hỏi ông ấy có muốn đi Giê-ru-sa-lem và được xét xử tại đó về những việc ấy không.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “bối rối về cuộc tranh luận liên quan đến những vấn đề này.”'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ông ấy có sẵn lòng đi Giê-ru-sa-lem và được xét xử tại đó về những việc ấy không.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπορούμενος
  choice: vì tôi lúng túng
  rationale: Diễn tả sự bối rối, không biết phải xử lý thế nào của Phê-tu; liên từ “vì” thể hiện sắc thái nguyên nhân của phân từ trong ngữ cảnh.
- source_word: ζήτησιν
  choice: việc xem xét
  rationale: Danh từ chỉ sự điều tra, tra xét hay vấn đề đang được bàn cãi. “Việc xem xét” phù hợp bối cảnh hành chính-pháp lý mà không thu hẹp nghĩa thành một thủ tục điều tra chính thức.
- source_word: περὶ τούτων
  choice: về những vấn đề này / về những việc ấy
  rationale: Giữ hai lần quy chiếu đến các sự việc đang được tranh luận; lần thứ hai dùng cách diễn đạt tương ứng tự nhiên để tránh lặp nặng nề.
- source_word: ἔλεγον
  choice: tôi hỏi
  rationale: Nghĩa đen là “tôi nói”, nhưng mệnh đề nghi vấn gián tiếp theo sau cho thấy chức năng trong câu là đặt câu hỏi.
- source_word: εἰ βούλοιτο
  choice: có muốn ... không
  rationale: Truyền đạt tự nhiên nội dung câu hỏi gián tiếp; động từ có thể nhấn mạnh ý muốn hoặc sự sẵn lòng.
- source_word: πορεύεσθαι
  choice: đi
  rationale: Cách dịch thông dụng, rõ ràng của động từ chỉ sự di chuyển.
- source_word: Ἱεροσόλυμα
  choice: Giê-ru-sa-lem
  rationale: Dạng phiên âm địa danh quen dùng trong tiếng Việt.
- source_word: κἀκεῖ
  choice: tại đó
  rationale: Diễn đạt tự nhiên nghĩa “và ở đó” trong kết cấu với động từ nguyên thể bị động.
- source_word: κρίνεσθαι
  choice: được xét xử
  rationale: Phù hợp bối cảnh pháp lý và diễn tả rõ việc vụ án của Phao-lô được đưa ra phân xử, đồng thời không hàm ý trước kết quả.
theological_decisions: []
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sắc thái lời tường trình pháp lý của Phê-tu, đồng thời bảo lưu độ rộng nghĩa của ζήτησις và βούλομαι qua chú thích.
