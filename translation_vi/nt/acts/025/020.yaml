  source_fidelity: 'Bản dịch truyền đạt đúng cấu trúc và ý chính của câu Hy Lạp: Phê-tu tự nhận lúng túng trước việc xem xét/điều tra các vấn đề ấy, rồi hỏi Phao-lô có muốn đi Giê-ru-sa-lem để được xét xử tại đó hay không. “Nhưng vì” phản ánh được cả δέ và sắc thái nguyên nhân của phân từ ἀπορούμενος. “Được xét xử” phù hợp ngữ cảnh pháp lý của κρίνεσθαι mà không khẳng định kết quả xét xử.'
  naturalness: Câu tiếng Việt hiện đại, rõ ràng và giữ được giọng tường trình hành chính-pháp lý. Cụm “lúng túng về việc xem xét những vấn đề này” hơi trang trọng nhưng tự nhiên và chính xác trong văn cảnh; không cần diễn giải thêm thành “không biết phải xử lý thế nào,” vì cách ấy sẽ xa hơn khỏi danh từ ζήτησις.
  terminology: “Việc xem xét” bảo lưu độ rộng của ζήτησις, vốn có thể chỉ sự tra xét, vấn đề cần được xem xét, hoặc cuộc tranh luận; chú thích a nêu lựa chọn “cuộc tranh luận” cách phù hợp. “Có muốn ... không” phản ánh tốt βούλοιτο; chú thích b bảo lưu sắc thái “có sẵn lòng.” Tên riêng “Giê-ru-sa-lem” và thuật ngữ pháp lý “xét xử” nhất quán, dễ hiểu.
