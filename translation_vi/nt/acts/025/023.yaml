  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Τῇ οὖν ἐπαύριον ἐλθόντος τοῦ Ἀγρίππα καὶ τῆς Βερνίκης μετὰ πολλῆς φαντασίας καὶ εἰσελθόντων εἰς τὸ ἀκροατήριον σύν ⸀τε χιλιάρχοις καὶ ἀνδράσιν τοῖς κατ’ ⸀ἐξοχὴν τῆς πόλεως καὶ κελεύσαντος τοῦ Φήστου ἤχθη ὁ Παῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/023.yaml
  text: So on the next day, Agrippa and Bernice came with great pomp and entered the audience hall with both the military tribunes and the prominent men of the city, and at Festus's command Paul was brought in.
translation:
  language: vi
  text: Vậy, ngày hôm sau, A-gríp-pa và Bê-rê-nít đến với vẻ phô trương lộng lẫy[a], rồi cùng các viên chỉ huy quân đội và những người đàn ông có địa vị nổi bật trong thành[b] bước vào phòng xét xử. Theo lệnh của Phê-tu, Phao-lô được dẫn vào.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “với vẻ phô trương lớn lao” hoặc “với sự phô diễn rầm rộ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Hay: “những nhân vật hàng đầu trong thành.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ οὖν ἐπαύριον
  choice: Vậy, ngày hôm sau
  rationale: Diễn đạt tự nhiên cụm chỉ thời gian ở cách dữ cách; “Vậy” giữ chức năng tiếp nối tường thuật của οὖν.
- source_word: Ἀγρίππα ... Βερνίκης
  choice: A-gríp-pa và Bê-rê-nít
  rationale: Phiên âm tên riêng theo lối quen thuộc, dễ đọc trong tiếng Việt Kinh Thánh.
- source_word: μετὰ πολλῆς φαντασίας
  choice: với nghi lễ phô trương long trọng
  rationale: φαντασία trong ngữ cảnh chỉ sự phô diễn công khai đầy vẻ huy hoàng, nghi trượng; cách dịch này giữ cả sắc thái nghi lễ lẫn sự phô trương.
- source_word: εἰς τὸ ἀκροατήριον
  choice: vào phòng xét xử
  rationale: ἀκροατήριον là nơi dành cho việc nghe hoặc thẩm xét chính thức; trong bối cảnh này, “phòng xét xử” rõ nghĩa và tự nhiên hơn “khán phòng”.
- source_word: σύν τε χιλιάρχοις
  choice: cùng các viên chỉ huy quân đội
  rationale: χιλίαρχος chỉ sĩ quan cao cấp chỉ huy quân đội. Dịch theo chức năng giúp độc giả hiện đại hiểu được cấp vị mà không áp đặt một thuật ngữ La Mã quá chuyên biệt.
- source_word: ἀνδράσιν τοῖς κατ’ ἐξοχὴν τῆς πόλεως
  choice: những người có địa vị nổi bật trong thành
  rationale: κατ’ ἐξοχήν biểu thị sự ưu tú hoặc nổi bật. “Có địa vị nổi bật” giữ sắc thái xã hội của nhóm người này; “người” đọc tự nhiên trong tiếng Việt dù ἀνδράσιν mang hình thức giống đực.
- source_word: κελεύσαντος τοῦ Φήστου
  choice: Theo lệnh của Phê-tu
  rationale: Chuyển cấu trúc sở hữu cách tuyệt đối thành cụm trạng ngữ tự nhiên, đồng thời giữ thẩm quyền chính thức của Phê-tu.
- source_word: ἤχθη ὁ Παῦλος
  choice: Phao-lô được dẫn vào
  rationale: Thể bị động của ἄγω cho thấy Phao-lô được áp giải hoặc hướng dẫn vào nơi xét xử; “được dẫn vào” sát nghĩa hơn mà vẫn tự nhiên.
