id: ACT.25.9
reference: Acts 25:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὁ Φῆστος δὲ ⸂θέλων τοῖς Ἰουδαίοις⸃ χάριν καταθέσθαι ἀποκριθεὶς τῷ Παύλῳ εἶπεν· Θέλεις εἰς Ἱεροσόλυμα ἀναβὰς ἐκεῖ περὶ τούτων ⸀κριθῆναι ἐπ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/009.yaml
  text: But Festus[a], wanting to do the Jews a favor, answered Paul and said[c][b], “Do you want to go up to Jerusalem and there be judged before me concerning these things?”
translation:
  language: vi
  text: 'Nhưng Phê-tu muốn làm ơn cho người Do Thái[a], nên trả lời Phao-lô: “Ông có muốn lên Giê-ru-sa-lem để được xét xử tại đó về những việc này trước mặt tôi không?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Người Do Thái” ở đây, theo ngữ cảnh, chỉ những người Do Thái đang tố cáo hoặc thúc đẩy vụ kiện chống lại Phao-lô, chứ không phải mọi người Do Thái.
    reason: cultural_note
  - marker: b
    text: “Được xét xử... trước mặt tôi” cũng có thể dịch là “được xử án... dưới thẩm quyền của tôi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ Φῆστος
  choice: Phê-tu
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt, rõ ràng và trang trọng.
- source_word: θέλων
  choice: muốn
  rationale: Diễn đạt tự nhiên phân từ hiện tại chỉ động cơ đang chi phối hành động của Phê-tu, không cường điệu mức độ chủ ý.
- source_word: τοῖς Ἰουδαίοις
  choice: người Do Thái
  rationale: Giữ phạm vi từ ngữ của nguyên bản; ngữ cảnh cho thấy cụm từ này nói đến những người Do Thái đang theo đuổi vụ kiện, chứ không phải mọi người Do Thái.
- source_word: χάριν καταθέσθαι
  choice: làm ơn cho
  rationale: Cách nói tiếng Việt tự nhiên cho thành ngữ Hy Lạp mang nghĩa ban một ân huệ hoặc chiều lòng ai; tránh hàm ý vụ lợi quá mạnh như “lấy lòng”.
- source_word: ἀποκριθεὶς τῷ Παύλῳ εἶπεν
  choice: nên trả lời Phao-lô
  rationale: Gộp lối diễn đạt kể chuyện “đáp lời... nói” thành câu tiếng Việt gọn, tự nhiên mà vẫn giữ quan hệ đáp lời.
- source_word: εἰς Ἱεροσόλυμα ἀναβὰς
  choice: lên Giê-ru-sa-lem
  rationale: Giữ động từ “lên”, phù hợp cả địa thế lẫn cách nói quy ước về việc đi đến Giê-ru-sa-lem.
- source_word: περὶ τούτων
  choice: về những việc này
  rationale: Giữ cách quy chiếu rộng của nguyên bản, không thu hẹp thành “những cáo buộc” dù điều đó được hàm ý trong ngữ cảnh.
- source_word: κριθῆναι
  choice: được xét xử
  rationale: Trong bối cảnh pháp lý, cách dịch này tự nhiên và chính xác hơn “bị phán xét”, đồng thời vẫn giữ thể bị động.
- source_word: ἐπ’ ἐμοῦ
  choice: trước mặt tôi
  rationale: Bảo toàn khả năng cụm từ chỉ sự hiện diện hoặc thẩm quyền chủ tọa của Phê-tu, không quyết đoán rằng ông là người duy nhất ra phán quyết.
theological_decisions:
- issue: Nguy cơ hiểu khái quát mang tính bài Do Thái đối với τοῖς Ἰουδαίοις
  choice: Giữ “người Do Thái” trong chính văn và chú thích rằng ngữ cảnh nói đến những người đang theo đuổi vụ kiện.
  alternative: Dịch trực tiếp là “các lãnh đạo Do Thái” hoặc “những người Do Thái tố cáo Phao-lô”.
  rationale: Nguyên bản dùng thuật ngữ rộng, nên chính văn không tự ý thu hẹp; chú thích giúp ngăn cách hiểu rằng câu này quy cho toàn thể dân Do Thái.
- issue: Sắc thái pháp lý của κριθῆναι ἐπ’ ἐμοῦ
  choice: “được xét xử... trước mặt tôi”
  alternative: “bị tôi xét xử” hoặc “để tôi phân xử vụ án”.
  rationale: 'Cách chọn giữ độ mở của nguyên bản về vai trò của Phê-tu: ông có thể là người chủ tọa hoặc thực thi thẩm quyền xét xử, mà câu không nhất thiết xác định ông là người duy nhất quyết định.'
translation_notes:
  register: 'Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc câu được làm tự nhiên theo tiếng Việt, đồng thời giữ các nét quan trọng của nguyên bản: động cơ của Phê-tu, chuyển động “lên” Giê-ru-sa-lem, thể bị động pháp lý và độ mở của ἐπ’ ἐμοῦ.'
