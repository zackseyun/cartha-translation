revisions:
- from: 'Phao-lô tự biện hộ: “Tôi không phạm tội gì chống lại luật pháp của người Do Thái[a], cũng không chống lại đền thờ hay hoàng đế Sê-sa.”'
  to: 'Phao-lô tự biện hộ: “Tôi không phạm tội gì đối với luật pháp của người Do Thái[a], đền thờ hay Sê-sa.”'
  rationale: 'Bản sửa giữ nguyên ý nghĩa và sắc thái của nguyên văn: Phao-lô đang tự bào chữa và phủ nhận đã phạm tội hay có lỗi đối với cả luật pháp Do Thái, đền thờ và Sê-sa. Việc dùng “đối với” làm rõ phạm vi của phủ định đối với cả ba vế; bỏ “hoàng đế” tránh bổ sung vào danh xưng Καίσαρα; chú thích được sửa để diễn đạt thành ngữ pháp rõ ràng cách hiểu pháp lý thay thế.'
