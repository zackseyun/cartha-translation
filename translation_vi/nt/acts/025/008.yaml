  text: ⸂τοῦ Παύλου ἀπολογουμένου⸃ ὅτι Οὔτε εἰς τὸν νόμον τῶν Ἰουδαίων οὔτε εἰς τὸ ἱερὸν οὔτε εἰς Καίσαρά τι ἥμαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/008.yaml
  text: 'Paul made his defense: “I have sinned in nothing against either the law of the Jews[a], or the temple, or Caesar.”'
translation:
  language: vi
  text: 'Phao-lô tự biện hộ: “Tôi không phạm tội gì đối với luật pháp của người Do Thái[a], đền thờ hay Sê-sa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi không hề có lỗi gì đối với luật pháp của người Do Thái, đền thờ hay Sê-sa.”'
    reason: Nêu cách dịch theo sắc thái pháp lý của ἥμαρτον trong bối cảnh xét xử.
lexical_decisions:
- source_word: ἀπολογουμένου
  choice: tự biện hộ
  rationale: Diễn đạt tự nhiên bối cảnh pháp đình và giữ nghĩa Phao-lô trình bày lời bào chữa cho chính mình.
- source_word: ὅτι
  choice: dùng dấu hai chấm để dẫn lời trực tiếp
  rationale: ὅτι giới thiệu nội dung lời biện hộ; trong tiếng Việt hiện đại, dấu hai chấm và lời trích trực tiếp rõ ràng, tự nhiên hơn việc dịch máy móc là “rằng”.
- source_word: νόμον τῶν Ἰουδαίων
  choice: luật pháp của người Do Thái
  rationale: Giữ kết cấu sở thuộc của nguyên văn và không thu hẹp ý nghĩa thành một cách hiểu thuần dân tộc, địa lý hay tôn giáo.
- source_word: ἱερὸν
  choice: đền thờ
  rationale: ἱερόν ở đây chỉ đền thờ hoặc toàn khuôn viên đền thờ; “đền thờ” là cách gọi chuẩn, dễ hiểu và không đồng nhất nó với nơi chí thánh.
- source_word: Καίσαρά
  choice: hoàng đế Sê-sa
  rationale: Kết hợp chức vị với danh xưng truyền thống giúp độc giả hiện đại nhận ra đây là hoàng đế La Mã, đồng thời giữ tên gọi Καῖσαρ.
- source_word: τι ἥμαρτον
  choice: không phạm tội gì
  rationale: Giữ sắc thái của động từ ἁμαρτάνω và sức nhấn mạnh bao quát của đại từ τι, trong khi vẫn phù hợp với lời phủ nhận tại pháp đình.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: không ... cũng không ... hay ...
  rationale: Tái hiện ba đối tượng của lời phủ nhận bằng cấu trúc tiếng Việt tự nhiên, tránh lặp nặng nề mà vẫn giữ đủ cả ba vế.
theological_decisions:
- issue: Sắc thái pháp lý hay đạo đức của ἥμαρτον
  choice: phạm tội
  alternative: phạm điều gì; có lỗi; vi phạm
  rationale: Bối cảnh mang tính pháp đình, nhưng ἁμαρτάνω vẫn là động từ thông dụng chỉ việc phạm tội. “Phạm tội” bảo toàn chiều kích đạo đức và từ vựng của nguyên văn, không giản lược lời nói thành một thuật ngữ pháp lý thuần túy.
translation_notes:
  register: Văn phong trang trọng, sáng rõ và hiện đại. “Tự biện hộ” phù hợp bối cảnh pháp đình; “hoàng đế Sê-sa” giúp người đọc phổ thông hiểu chức vị mà vẫn giữ danh xưng quen thuộc trong Kinh Thánh.
