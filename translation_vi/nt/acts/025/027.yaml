  yaml_path: translation/nt/acts/025/027.yaml
  text: For it seems unreasonable to me[a], when sending a prisoner, not also to indicate the charges against him.
translation:
  language: vi
  text: Vì tôi thấy thật vô lý khi gửi một tù nhân đi mà cũng không nêu rõ những cáo buộc chống lại người ấy.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογον
  choice: vô lý
  rationale: Diễn đạt điều thiếu lẽ phải hoặc không hợp lý; phù hợp với nhận định mang tính hành chính của Phê-tu mà không quá nặng như “phi lý đến mức ngớ ngẩn”.
- source_word: δοκεῖ μοι
  choice: tôi thấy
  rationale: Giữ sắc thái đánh giá cá nhân của cấu trúc Hy Lạp, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: πέμποντα
  choice: nếu gửi ... đi
  rationale: Diễn đạt tự nhiên quan hệ hoàn cảnh của phân từ; kết hợp với “vô lý” tạo thành câu điều kiện hàm ý phù hợp trong tiếng Việt.
- source_word: δέσμιον
  choice: một tù nhân
  rationale: Thuật ngữ rõ ràng, thông dụng cho người đang bị giam giữ trong bối cảnh pháp lý.
- source_word: μὴ καὶ
  choice: mà không ... cả
  rationale: 'Giữ lực bổ sung của καί: không chỉ gửi tù nhân mà còn phải kèm theo việc nêu các cáo buộc.'
- source_word: τὰς κατ’ αὐτοῦ αἰτίας
  choice: những cáo buộc chống lại người ấy
  rationale: Phản ánh nghĩa tư pháp của αἰτία và giữ rõ hướng chống lại bị cáo; “người ấy” có sắc thái trang trọng, tự nhiên hơn việc lặp đại từ.
- source_word: σημᾶναι
  choice: nêu rõ
  rationale: Trong văn cảnh chuyển hồ sơ pháp lý, từ này diễn đạt việc cho biết hoặc ghi ra các cáo buộc; “nêu rõ” tự nhiên và vẫn không đòi hỏi nghĩa kỹ thuật quá hẹp.
