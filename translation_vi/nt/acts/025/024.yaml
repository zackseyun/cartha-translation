source:
  edition: SBLGNT
  text: καί φησιν ὁ Φῆστος· Ἀγρίππα βασιλεῦ καὶ πάντες οἱ συμπαρόντες ἡμῖν ἄνδρες, θεωρεῖτε τοῦτον περὶ οὗ ⸀ἅπαν τὸ πλῆθος τῶν Ἰουδαίων ⸀ἐνέτυχόν μοι ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε, ⸀βοῶντες μὴ δεῖν ⸂αὐτὸν ζῆν⸃ μηκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/024.yaml
  text: And Festus says[a], “King Agrippa, and all the men present with us, you see this man, about whom the whole body of the Jews petitioned me, both in Jerusalem and here[b], shouting that he ought no longer to live.”
translation:
  language: vi
  text: 'Phê-tu nói: “Thưa vua A-gríp-pa và tất cả quý ông đang hiện diện cùng chúng tôi, các vị thấy người này đây. Toàn thể đám đông người Do Thái[a] đã thỉnh cầu tôi về người này, cả tại Giê-ru-sa-lem lẫn ở đây, lớn tiếng kêu rằng người này không nên sống thêm nữa[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn thể dân chúng Do Thái.” Đây là cách nói tập thể trong lời tổng thuật của Phê-tu, không nhất thiết có nghĩa từng người Do Thái, không trừ một ai.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “người này không được sống lâu hơn nữa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: nói
  rationale: Đây là thì hiện tại lịch sử tạo nét sống động trong lời kể; tiếng Việt dùng “nói” tự nhiên mà không cần đánh dấu thì.
- source_word: συμπαρόντες ἡμῖν ἄνδρες
  choice: quý ông đang hiện diện cùng chúng tôi
  rationale: Giữ ý cùng có mặt và giới tính nam của ἄνδρες, đồng thời phù hợp với lời xưng hô trang trọng trước hội nghị.
- source_word: θεωρεῖτε τοῦτον
  choice: các vị thấy người này đây
  rationale: Diễn đạt hành động Phê-tu hướng sự chú ý của cử tọa vào Phao-lô; “này đây” tự nhiên và có tính chỉ xuất.
- source_word: ἅπαν τὸ πλῆθος τῶν Ἰουδαίων
  choice: toàn thể cộng đồng người Do Thái
  rationale: Giữ sắc thái tập thể và lối nói bao quát trong lời tổng thuật của Phê-tu, nhưng không tự ý thu hẹp thành giới lãnh đạo Do Thái.
- source_word: ἐνέτυχόν μοι
  choice: đã thỉnh cầu tôi
  rationale: Động từ trong ngữ cảnh chỉ việc tiếp cận nhà chức trách để đưa ra yêu cầu; “thỉnh cầu” giữ được sắc thái trang trọng, pháp lý.
- source_word: ἔν τε Ἱεροσολύμοις καὶ ἐνθάδε
  choice: cả tại Giê-ru-sa-lem lẫn ở đây
  rationale: Tái hiện cấu trúc tương liên “cả… lẫn…”; “ở đây” chỉ Sê-sa-rê theo ngữ cảnh.
- source_word: βοῶντες
  choice: lớn tiếng kêu
  rationale: Giữ cường độ âm thanh và sự thúc ép của động từ mà không biến nó thành một thuật ngữ pháp lý.
- source_word: μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: ông ta không nên sống thêm nữa
  rationale: Giữ ý về điều được cho là không nên hoặc không phải tiếp tục xảy ra, không tự ý chuyển thành công thức tuyên án tử hình minh nhiên.
theological_decisions:
- issue: Cụm “người Do Thái” trong bối cảnh chống đối pháp lý
  choice: Giữ nguyên đối tượng sắc tộc–chính trị được bản Hy Lạp nêu là “người Do Thái”, đồng thời dịch πλῆθος bằng một danh từ tập thể.
  alternative: “các lãnh đạo Do Thái” hoặc “mọi người Do Thái” theo nghĩa tuyệt đối từng cá nhân
  rationale: Bản Hy Lạp nói rõ τῶν Ἰουδαίων và không giới hạn vào giới lãnh đạo. Tuy vậy, đây là lời tổng thuật mang tính bao quát của Phê-tu, nên chú thích làm rõ rằng câu không nhất thiết khẳng định từng cá nhân Do Thái đều tham gia.
- issue: Mức độ hàm ý án tử hình trong μὴ δεῖν αὐτὸν ζῆν μηκέτι
  choice: Dịch sát là “không nên sống thêm nữa”.
  alternative: “phải bị xử tử”
  rationale: Ngữ cảnh rõ ràng hàm ý mong muốn Phao-lô chết, nhưng câu Hy Lạp không dùng thuật ngữ minh nhiên về việc hành quyết; bản dịch giữ nguyên cách nói và độ căng của nguyên văn.
translation_notes:
  register: Văn phong trang trọng nhưng hiện đại, phù hợp với lời phát biểu chính thức trước nhà vua và cử tọa. Dùng “quý ông”, “các vị” và “thỉnh cầu” để giữ phép xưng hô cùng sắc thái pháp lý; tránh từ cổ như “nầy”, “hãy xem” hoặc lối diễn đạt giáo phái.
