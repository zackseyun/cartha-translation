  text: Ἀγρίππας δὲ πρὸς τὸν ⸀Φῆστον· Ἐβουλόμην καὶ αὐτὸς τοῦ ἀνθρώπου ἀκοῦσαι. ⸀Αὔριον, φησίν, ἀκούσῃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/022.yaml
  text: Then Agrippa said to Festus[a], “I myself would like to hear the man.” “Tomorrow,” he says[c][b], “you will hear him.”
translation:
  language: vi
  text: 'Bấy giờ, Agrippa nói với Festus: “Chính tôi cũng muốn nghe người ấy.” Festus nói[a]: “Ngày mai, ngài sẽ nghe ông ấy[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn dùng thì hiện tại lịch sử: “nói.” Một số bản dịch chuyển thành “đã nói” cho phù hợp với mạch kể quá khứ.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “ngài sẽ nghe ông ấy trình bày” hoặc “ngài sẽ nghe từ ông ấy.” Cụm từ Hy Lạp nói đến việc trực tiếp nghe người ấy nói.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγρίππας δὲ πρὸς τὸν Φῆστον
  choice: Bấy giờ, Agrippa nói với Festus
  rationale: δέ đánh dấu bước chuyển trong diễn biến; “Bấy giờ” tạo dòng kể tự nhiên. πρός đi với lời nói được diễn đạt tự nhiên là “nói với”.
- source_word: Ἐβουλόμην
  choice: muốn
  rationale: Thì chưa hoàn thành có thể diễn tả mong muốn đang có hoặc được nói với sắc thái nhã nhặn; tiếng Việt tự nhiên chỉ cần “muốn”, không buộc phải gắn mong muốn ấy vào quá khứ.
- source_word: καὶ αὐτὸς
  choice: Chính tôi cũng
  rationale: Giữ được cả sắc thái nhấn mạnh của αὐτός (“chính tôi”) lẫn khả năng bổ sung của καί (“cũng”), thay vì loại bỏ một trong hai.
- source_word: τοῦ ἀνθρώπου ἀκοῦσαι
  choice: nghe người này
  rationale: ἀκούω với đối tượng ở sở hữu cách mang nghĩa nghe người ấy nói; “người này” tự nhiên trong ngữ cảnh Agrippa đang nhắc đến Phao-lô.
- source_word: Αὔριον
  choice: Ngày mai
  rationale: Tương đương trực tiếp và tự nhiên của trạng từ thời gian.
- source_word: φησίν
  choice: Festus nói
  rationale: Giữ thì hiện tại lịch sử bằng “nói”, đồng thời nêu rõ chủ thể trong tiếng Việt để tránh nhập nhằng người đang đáp lời.
- source_word: ἀκούσῃ αὐτοῦ
  choice: ngài sẽ nghe ông ấy
  rationale: Giữ cấu trúc nghe một người, tức nghe người ấy trực tiếp trình bày; “ngài” phù hợp với lời Festus nói với vua Agrippa, còn “ông ấy” chỉ Phao-lô một cách tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ngài” trong lời đáp hướng đến vua Agrippa, nhưng không thêm tước hiệu không có trong câu Hy Lạp. Dấu chân chú thích đều được đặt ngay sau phần văn bản liên quan.
