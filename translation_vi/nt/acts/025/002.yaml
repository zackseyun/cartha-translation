  yaml_path: translation/nt/acts/025/002.yaml
  text: So the chief priests and the leading men of the Jews presented their case against Paul to him[a], and they urged him,
translation:
  language: vi
  text: Bấy giờ, các thượng tế và những người đứng đầu trong dân Do Thái trình bày với ông vụ việc chống lại Phao-lô[a], rồi họ khẩn khoản xin ông,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “báo cho ông về Phao-lô” hoặc “đưa lời tố cáo chống lại Phao-lô ra trước ông.” Động từ Hy Lạp có thể mang nghĩa làm cho một sự việc được biết đến; trong văn cảnh này, từ ấy có lẽ mang sắc thái pháp lý.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεφάνισάν
  choice: trình bày ... vụ kiện
  rationale: Trong bối cảnh pháp lý trước tổng đốc, động từ chỉ việc đưa một vấn đề ra trước nhà chức trách; cách dịch này thể hiện sắc thái tố tụng mà không mặc nhiên biến hành động ấy thành một bản cáo trạng chính thức.
- source_word: τέ
  choice: Vì thế
  rationale: Tiểu từ nối câu này với diễn tiến trước đó; “Vì thế” tạo liên kết tự nhiên trong tiếng Việt mà không đặt trọng âm quá mức.
- source_word: αὐτῷ
  choice: với ông
  rationale: Đại từ chỉ Phê-tu theo văn cảnh, là người tiếp nhận lời trình bày.
- source_word: οἱ ἀρχιερεῖς
  choice: các thượng tế
  rationale: Danh xưng quen thuộc dành cho giới lãnh đạo tư tế tại Giê-ru-sa-lem.
- source_word: οἱ πρῶτοι τῶν Ἰουδαίων
  choice: những người đứng đầu dân Do Thái
  rationale: Diễn đạt địa vị nổi bật về xã hội hoặc chính trị, đồng thời giữ cấu trúc “của dân Do Thái” một cách tự nhiên.
- source_word: κατὰ τοῦ Παύλου
  choice: chống lại Phao-lô
  rationale: κατά với sở hữu cách ở đây mang nghĩa đối nghịch, phù hợp với việc tố cáo trong bối cảnh pháp lý.
- source_word: παρεκάλουν
  choice: khẩn khoản xin
  rationale: Thì chưa hoàn thành gợi hành động nài xin đang tiếp diễn hoặc lặp lại; cụm từ này giữ được sức nặng của lời thỉnh cầu hơn “yêu cầu” nhưng không nhất thiết mang sắc thái tuyệt vọng của “van xin”.
- source_word: αὐτὸν
  choice: ông
  rationale: Đại từ tiếp tục chỉ Phê-tu, là đối tượng của lời thỉnh cầu.
