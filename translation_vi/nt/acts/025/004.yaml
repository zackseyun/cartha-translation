  text: Festus therefore answered that Paul was being kept in Caesarea, and that he himself was about to leave shortly.
translation:
  language: vi
  text: Vì vậy, Phê-tu trả lời rằng Phao-lô đang bị giam giữ tại Sê-sa-rê, còn chính ông thì sắp rời đi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρεῖσθαι
  choice: đang bị giam giữ
  rationale: Dạng bị động hiện tại chỉ việc Phao-lô đang được canh giữ trong sự giam giữ; cách dịch này tự nhiên trong tiếng Việt và phù hợp bối cảnh tư pháp.
- source_word: εἰς Καισάρειαν
  choice: tại Sê-sa-rê
  rationale: Giới từ εἰς ở đây đi với động từ chỉ sự giữ lại và được hiểu theo nghĩa địa điểm, như thường thấy trong Hy Lạp Koine.
- source_word: ἐν τάχει ἐκπορεύεσθαι
  choice: sắp lên đường đến đó
  rationale: μέλλειν diễn đạt việc sắp xảy ra, còn ἐν τάχει nhấn mạnh thời điểm gần; 'lên đường' truyền đạt tự nhiên hành động rời nơi hiện tại để đi.
