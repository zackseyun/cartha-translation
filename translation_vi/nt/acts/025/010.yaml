id: ACT.25.10
reference: Acts 25:10
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ Παῦλος· ⸂Ἐπὶ τοῦ βήματος Καίσαρος ἑστώς⸃ εἰμι, οὗ με δεῖ κρίνεσθαι. Ἰουδαίους οὐδὲν ⸀ἠδίκησα, ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/010.yaml
  text: But Paul said[a], “I am standing before Caesar’s tribunal, where I ought to be judged. I have done no wrong to the Jews[c][b], as you yourself know very well.”
translation:
  language: vi
  text: 'Nhưng Phao-lô nói: “Tôi đang đứng trước tòa án của Sê-sa, là nơi tôi phải được xét xử. Tôi không làm điều gì sai trái với người Do Thái,[a] như chính ngài cũng biết rất rõ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Tôi không hề phạm lỗi gì đối với người Do Thái.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: βῆμα
  choice: tòa án
  rationale: Trong ngữ cảnh này, từ này chỉ cơ quan hoặc nơi xét xử chính thức của chính quyền La Mã; “tòa án” tự nhiên và rõ nghĩa trong tiếng Việt hiện đại.
- source_word: Καίσαρος
  choice: của Sê-sa
  rationale: Giữ tước hiệu La Mã và bối cảnh pháp lý-lịch sử của câu, thay vì diễn giải thành “hoàng đế”.
- source_word: ἑστώς εἰμι
  choice: tôi đang đứng
  rationale: Kết cấu phân từ hoàn thành đi với εἰμί nhấn mạnh địa vị pháp lý hiện tại của Phao-lô; “đang đứng” vừa sát hình ảnh vừa tự nhiên.
- source_word: οὗ
  choice: là nơi
  rationale: Quy chiếu về tòa án như đúng nơi có thẩm quyền xét xử vụ án của Phao-lô.
- source_word: δεῖ
  choice: phải
  rationale: Diễn đạt sự cần thiết và thẩm quyền đúng theo thủ tục pháp lý, không hàm ý sự ép buộc cá nhân đơn thuần.
- source_word: κρίνεσθαι
  choice: được xét xử
  rationale: Thể bị động trong ngữ cảnh pháp lý được chuyển tự nhiên sang tiếng Việt; cụm này bao quát việc đưa vụ án ra xét xử.
- source_word: Ἰουδαίους
  choice: người Do Thái
  rationale: Cách gọi trực tiếp, thông dụng; trong câu này từ ngữ chỉ những người Do Thái mà Phao-lô bị cáo buộc là đã xúc phạm hoặc gây thiệt hại.
- source_word: οὐδὲν ἠδίκησα
  choice: tôi không làm điều gì sai trái với
  rationale: Giữ cả sắc thái đạo đức lẫn pháp lý của ἀδικέω, đồng thời diễn đạt quan hệ với đối tượng bằng tiếng Việt tự nhiên.
- source_word: ὡς καὶ σὺ κάλλιον ἐπιγινώσκεις
  choice: như chính ngài cũng biết rất rõ
  rationale: “Chính ngài” thể hiện sự nhấn mạnh của καὶ σὺ; “biết rất rõ” truyền đạt tự nhiên lực của động từ nhận biết tăng cường và dạng so sánh κάλλιον.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ngài” vì Phao-lô đang thưa với tổng đốc Phê-tu trong một phiên xử chính thức. Giữ “Sê-sa” theo cách phiên âm quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
