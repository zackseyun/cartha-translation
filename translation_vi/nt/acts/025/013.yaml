id: ACT.25.13
reference: Acts 25:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἡμερῶν δὲ διαγενομένων τινῶν Ἀγρίππας ὁ βασιλεὺς καὶ Βερνίκη κατήντησαν εἰς Καισάρειαν ἀσπασάμενοι τὸν Φῆστον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/013.yaml
  text: After some days had passed[a], King Agrippa and Bernice arrived at Caesarea to greet Festus.
translation:
  language: vi
  text: Sau vài ngày, vua A-gríp-pa và Bê-rê-nít[a] đến Sê-sa-rê để chào thăm Phê-tu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tên này cũng có thể được phiên âm là “Bê-rê-ni-xê”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμερῶν δὲ διαγενομένων τινῶν
  choice: Sau vài ngày
  rationale: Cụm sở hữu cách tuyệt đối làm nền thời gian; cách diễn đạt này tự nhiên trong tiếng Việt và hàm ý vài ngày đã trôi qua. δέ chỉ nối tiếp nhẹ nên không cần dịch thành một từ riêng.
- source_word: Ἀγρίππας ὁ βασιλεὺς
  choice: vua A-gríp-pa
  rationale: Giữ nguyên tước hiệu βασιλεύς và đặt trước tên theo trật tự tự nhiên của tiếng Việt.
- source_word: Βερνίκη
  choice: Bê-rê-nít
  rationale: Phiên âm tên riêng Hy Lạp theo cách dễ đọc trong tiếng Việt; chú thích ghi nhận dạng Bê-rê-ni-xê gần với hình thức Hy Lạp hơn.
- source_word: κατήντησαν εἰς Καισάρειαν
  choice: đến Sê-sa-rê
  rationale: Diễn đạt tự nhiên hành động đi tới và tới nơi; εἰς nêu đích đến.
- source_word: ἀσπασάμενοι τὸν Φῆστον
  choice: để chào thăm Phê-tu
  rationale: Phân từ bất định quá khứ diễn tả hoàn cảnh hoặc mục đích đi kèm. “Để chào thăm” tự nhiên và không thêm sắc thái nghi lễ mà động từ không nhất thiết hàm ý.
- source_word: Φῆστον
  choice: Phê-tu
  rationale: Phiên âm tên vị tổng đốc La Mã theo cách quen thuộc, dễ đọc trong tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện trang trọng vừa phải, hiện đại và dễ hiểu. Tên riêng được phiên âm có gạch nối để hỗ trợ phát âm; không thêm từ tương đương với “bấy giờ” vì nguyên văn chỉ có liên từ nối tiếp nhẹ δέ.
