revisions:
- from: Về người này, tôi không có điều gì chắc chắn để viết trình lên chúa thượng[a]. Vì thế, tôi đã đưa ông ấy ra trước tất cả quý vị, và nhất là trước ngài, vua A-gríp-pa, để sau khi cuộc thẩm tra được tiến hành[b], tôi có điều để viết.
  to: Về người này, tôi không có gì chắc chắn để viết cho hoàng đế[a]. Vì thế, tôi đã cho ông ấy ra trình diện trước quý vị, đặc biệt là trước ngài, vua A-gríp-pa, để sau khi việc xét hỏi diễn ra[b], tôi có điều để viết.
  rationale: Bản sửa loại bỏ phần thêm nghĩa “tất cả”, dùng cách diễn đạt hiện đại và tự nhiên hơn cho việc trình diện cùng hoạt động xét hỏi, và thay tước xưng cổ “chúa thượng” bằng “hoàng đế” để xác định đúng quy chiếu lịch sử. Chú thích vẫn bảo lưu cách xưng hô của nguyên ngữ, vì vậy không mất sắc thái kính xưng của κύριος.
