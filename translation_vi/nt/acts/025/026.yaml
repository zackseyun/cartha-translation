    issue: “trước tất cả quý vị” thêm yếu tố “tất cả”.
    rationale: Ὑμῶν là đại từ số nhiều (“quý vị/các vị”), nhưng không có từ nào tương đương “tất cả” trong câu Hy Lạp.
  - severity: medium
    issue: “chúa thượng” không phải lựa chọn hiện đại, tự nhiên cho người đứng đầu đế quốc La Mã.
    rationale: Dù có thể bảo lưu sắc thái κύριος, cụm này mang màu sắc phong kiến Việt Nam và dễ gây lệch bối cảnh. “Hoàng đế” nêu đúng nhân vật quy chiếu; chú thích có thể bảo tồn cách xưng hô nguyên văn.
  - severity: low
    issue: “đưa ông ấy ra” và “được tiến hành” có thể trôi chảy hơn.
    rationale: Προήγαγον trong ngữ cảnh này là đưa ra/trình diện trước cử tọa; ἀνάκρισις γενομένης được diễn đạt tự nhiên là “sau khi việc xét hỏi diễn ra”.
