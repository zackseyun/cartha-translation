id: ACT.25.26
reference: Acts 25:26
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: περὶ οὗ ἀσφαλές τι γράψαι τῷ κυρίῳ οὐκ ἔχω· διὸ προήγαγον αὐτὸν ἐφ’ ὑμῶν καὶ μάλιστα ἐπὶ σοῦ, βασιλεῦ Ἀγρίππα, ὅπως τῆς ἀνακρίσεως γενομένης σχῶ τί ⸀γράψω·
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/026.yaml
  text: Concerning him I have nothing definite to write to my lord[a]. Therefore I have brought him before you all, and especially before you, King Agrippa, so that, after the examination has taken place[b], I may have something to write.
translation:
  language: vi
  text: Về người này, tôi không có gì chắc chắn để viết cho hoàng đế[a]. Vì thế, tôi đã cho ông ấy ra trình diện trước quý vị, đặc biệt là trước ngài, vua A-gríp-pa, để sau khi việc xét hỏi diễn ra[b], tôi có điều để viết.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nguyên văn: “cho chúa thượng của tôi.” Trong ngữ cảnh này, đây là cách xưng hô chính thức dành cho hoàng đế.'
    reason: alternative_reading
  - marker: b
    text: “Xét hỏi” cũng có thể dịch là “thẩm tra”, “phiên xét hỏi” hoặc “điều tra”, chỉ việc xem xét vụ án của Phao-lô theo thủ tục tư pháp.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσφαλές τι
  choice: điều gì chắc chắn
  rationale: Cụm từ chỉ một điều chắc chắn, vững đáng để đưa vào báo cáo chính thức; cách dịch này giữ sắc thái hành chính-pháp lý và tự nhiên trong tiếng Việt.
- source_word: γράψαι
  choice: để viết trình
  rationale: Động từ có nghĩa là viết; thêm “trình” làm rõ ngữ cảnh một báo cáo gửi lên cấp trên mà không thay đổi nội dung cốt lõi.
- source_word: τῷ κυρίῳ
  choice: lên chúa thượng
  rationale: κύριος ở đây là tước xưng dành cho hoàng đế La Mã, không phải danh xưng thần học. “Chúa thượng” giữ hình thức kính xưng và chú thích xác định đối tượng.
- source_word: διὸ
  choice: Vì thế
  rationale: Thể hiện rõ quan hệ hệ quả với lời giải thích ngay trước đó.
- source_word: προήγαγον αὐτὸν
  choice: tôi đã đưa ông ấy ra
  rationale: Diễn đạt hành động đưa Phao-lô ra trình diện trước cử tọa; “ông ấy” phù hợp với lời nói trực tiếp của Phê-tu.
- source_word: ἐφ’ ὑμῶν
  choice: trước tất cả quý vị
  rationale: Giữ số nhiều của ὑμῶν và phân biệt với đại từ số ít σοῦ dành riêng cho A-gríp-pa.
- source_word: καὶ μάλιστα ἐπὶ σοῦ
  choice: và nhất là trước ngài
  rationale: Giữ sự nhấn mạnh đặc biệt vào A-gríp-pa trong số những người hiện diện.
- source_word: βασιλεῦ Ἀγρίππα
  choice: vua A-gríp-pa
  rationale: Chuyển trực tiếp danh xưng hô cách và tên riêng sang trật tự tự nhiên của tiếng Việt.
- source_word: ὅπως
  choice: để
  rationale: Diễn đạt rõ mục đích của việc đưa Phao-lô ra trước cử tọa.
- source_word: τῆς ἀνακρίσεως γενομένης
  choice: sau khi cuộc thẩm tra được tiến hành
  rationale: ἀνάκρισις chỉ việc xem xét, điều tra hay thẩm vấn trong bối cảnh tư pháp; cấu trúc sở hữu cách tuyệt đối được dịch theo nghĩa thời gian.
- source_word: σχῶ τί γράψω
  choice: tôi có điều để viết
  rationale: 'Giữ sát thành ngữ Hy Lạp: nhờ cuộc thẩm tra mà Phê-tu có nội dung để ghi trong báo cáo.'
theological_decisions:
- issue: Cách dịch κύριος trong ngữ cảnh đế quốc, không mang nghĩa thần học
  choice: chúa thượng
  alternative: hoàng đế
  rationale: “Chúa thượng” bảo tồn nghĩa từ vựng và sắc thái kính xưng của κύριος, trong khi chú thích làm rõ người được nói đến là hoàng đế La Mã; nhờ đó không đồng nhất danh xưng này với Chúa trong ngữ cảnh thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu, phù hợp lời phát biểu chính thức trước vua và quan khách. Dùng “quý vị/ngài” để thể hiện rõ sự đối lập giữa đại từ số nhiều và số ít trong nguyên văn; phiên âm tên riêng theo lối Việt hóa quen thuộc.
