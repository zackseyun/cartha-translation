  text: τοῦ δὲ Παύλου ἐπικαλεσαμένου τηρηθῆναι αὐτὸν εἰς τὴν τοῦ Σεβαστοῦ διάγνωσιν, ἐκέλευσα τηρεῖσθαι αὐτὸν ἕως οὗ ⸀ἀναπέμψω αὐτὸν πρὸς Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/021.yaml
  text: But when Paul appealed to be kept in custody for the decision of the Emperor[a], I ordered that he be kept in custody until I send him to Caesar.
translation:
  language: vi
  text: Nhưng khi Phao-lô kháng cáo, xin được giam giữ để chờ phán quyết của Hoàng đế[a], tôi ra lệnh giam giữ ông cho đến khi tôi gửi ông đến Sê-sa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tiếng Hy Lạp dùng Σεβαστός, tước hiệu tương đương với Augustus trong tiếng La Mã; trong ngữ cảnh này được dịch là “Hoàng đế.”
    reason: Giải thích tước hiệu Hy Lạp phía sau cách dịch tự nhiên “Hoàng đế” mà không đồng nhất tước hiệu ấy với tên riêng.
lexical_decisions:
- source_word: ἐπικαλεσαμένου
  choice: kháng cáo
  rationale: Trong bối cảnh pháp lý La Mã, động từ trung gian này chỉ việc chính thức kháng cáo lên thẩm quyền cao hơn; “kháng cáo” là cách diễn đạt tự nhiên và chính xác trong tiếng Việt.
- source_word: τηρηθῆναι / τηρεῖσθαι
  choice: được giữ lại / giữ
  rationale: Ở đây τηρέω nói đến việc tiếp tục giam giữ chính thức. Trong vế đầu, “được giữ lại” đi tự nhiên với lời kháng cáo; trong vế sau, “truyền giữ” tránh lặp nặng nề mà vẫn giữ rõ nghĩa giam giữ.
- source_word: διάγνωσιν
  choice: phán quyết
  rationale: Danh từ này chỉ sự phân xử hay quyết định tư pháp. “Phán quyết” phù hợp với bối cảnh hoàng đế xét vụ án, nhưng không tự ý xác định kết quả.
- source_word: Σεβαστοῦ
  choice: Hoàng đế
  rationale: Σεβαστός là tước hiệu hoàng gia tương đương Augustus. Trong ngữ cảnh này, “Hoàng đế” truyền đạt chức vị rõ ràng cho độc giả hiện đại; hình thức sát chữ được nêu trong chú thích.
- source_word: ἀναπέμψω
  choice: tôi giải
  rationale: Động từ chỉ việc chuyển bị cáo đến thẩm quyền cấp cao hơn. “Giải” diễn đạt tự nhiên hành động áp giải một người đang bị giam, đồng thời phù hợp với bối cảnh tư pháp.
- source_word: πρὸς Καίσαρα
  choice: đến Sê-sa
  rationale: Καῖσαρ được giữ dưới dạng tước hiệu/tên gọi lịch sử “Sê-sa”, quen thuộc trong văn phong Kinh Thánh tiếng Việt và phân biệt với cách dịch chức vị “Hoàng đế” ở vế trước.
theological_decisions: []
