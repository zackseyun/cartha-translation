revisions:
- from: Nhưng khi Phao-lô kháng cáo, xin được giữ lại để chờ phán quyết của Hoàng đế[a], tôi đã truyền giữ ông ấy cho đến khi tôi giải ông đến Sê-sa.
  to: Nhưng khi Phao-lô kháng cáo, xin được giam giữ để chờ phán quyết của Hoàng đế[a], tôi ra lệnh giam giữ ông cho đến khi tôi gửi ông đến Sê-sa.
  rationale: Bản sửa làm rõ tính chất giam giữ pháp lý của τηρέω ở cả hai vế, thay động từ không tự nhiên “truyền giữ,” và dịch ἀναπέμψω là “gửi” để không thêm chi tiết về phương thức chuyển giao. Cấu trúc kháng cáo “xin được giam giữ để chờ phán quyết” giữ được quan hệ mục đích của εἰς τὴν ... διάγνωσιν. Chú thích được hiệu chỉnh để phản ánh chính xác địa vị tước hiệu Σεβαστός/Augustus.
  reviewer_model: gpt-5.6-terra
