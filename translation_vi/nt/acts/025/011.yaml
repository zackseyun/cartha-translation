  to: Vậy, nếu tôi đang làm điều sai trái và đã phạm điều gì đáng bị xử tử, thì tôi không từ chối chết. Nhưng nếu những điều họ tố cáo tôi đều không có căn cứ, thì không ai có thể giao nộp tôi cho họ để lấy lòng họ[a]. Tôi kháng cáo lên Sê-sa.
