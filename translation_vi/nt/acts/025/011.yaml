id: ACT.25.11
reference: Acts 25:11
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ μὲν ⸀οὖν ἀδικῶ καὶ ἄξιον θανάτου πέπραχά τι, οὐ παραιτοῦμαι τὸ ἀποθανεῖν· εἰ δὲ οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου, οὐδείς με δύναται αὐτοῖς χαρίσασθαι· Καίσαρα ἐπικαλοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/011.yaml
  text: If[a], then, I am doing wrong and have done anything deserving death, I do not refuse to die. But if there is nothing to the things these men are accusing me of, no one can hand me over to them as a favor. I appeal to Caesar.
translation:
  language: vi
  text: Vậy, nếu tôi đang làm điều sai trái và đã phạm điều gì đáng bị xử tử, thì tôi không từ chối chết. Nhưng nếu những điều họ tố cáo tôi đều không có căn cứ, thì không ai có thể giao nộp tôi cho họ để lấy lòng họ[a]. Tôi kháng cáo lên Sê-sa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “giao nộp tôi cho họ như một ân huệ.” Động từ Hy Lạp hàm ý trao hoặc giao một người như một sự nhượng bộ để làm vừa lòng người khác.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικῶ
  choice: đang làm điều sai trái
  rationale: Giữ sắc thái hiện tại của động từ và sức nặng vừa đạo đức vừa pháp lý, không thu hẹp thành một tội danh cụ thể.
- source_word: ἄξιον θανάτου
  choice: đáng chết
  rationale: Cách nói tự nhiên, trang trọng, diễn đạt việc đáng chịu án tử hình mà vẫn giữ sắc thái đánh giá của nguyên ngữ.
- source_word: πέπραχά τι
  choice: đã làm điều gì
  rationale: Phản ánh hành động đã hoàn tất và vẫn liên quan đến vụ xét xử hiện tại, đồng thời giữ tính bất định của τι.
- source_word: οὐ παραιτοῦμαι τὸ ἀποθανεῖν
  choice: tôi không từ chối chết
  rationale: Theo sát nghĩa từ chối hoặc khước từ, thể hiện việc Phao-lô sẵn sàng chấp nhận cái chết nếu thật sự phạm tội đáng chết.
- source_word: οὐδέν ἐστιν ὧν οὗτοι κατηγοροῦσίν μου
  choice: những điều họ tố cáo tôi đều không có căn cứ
  rationale: Diễn đạt tự nhiên ý rằng các lời buộc tội không có thực chất, nhưng không thêm một phán quyết vượt quá câu Hy Lạp.
- source_word: χαρίσασθαι
  choice: giao tôi cho họ để làm ơn
  rationale: Giữ cả hành động giao nộp và sắc thái nhượng bộ như một ân huệ cho bên tố cáo.
- source_word: Καίσαρα ἐπικαλοῦμαι
  choice: Tôi kháng cáo lên Sê-sa
  rationale: Diễn đạt rõ hành vi pháp lý chính thức kêu cầu hoàng đế xét xử.
- source_word: μὲν οὖν ... δὲ
  choice: Vậy, nếu ... Nhưng nếu
  rationale: Bảo toàn cấu trúc hai vế điều kiện tương phản và mạch lập luận của Phao-lô trong tiếng Việt tự nhiên.
theological_decisions:
- issue: Sắc thái tư pháp trong lời nói về án tử hình và quyền kháng cáo
  choice: Phao-lô có điều kiện chấp nhận cái chết nếu thật sự phạm điều đáng chết, đồng thời phủ nhận quyền giao nộp ông cách bất công cho những người tố cáo.
  alternative: Xem lời nói chỉ là biện pháp tu từ, không hàm ý thừa nhận tính chính đáng nào của thủ tục xét xử.
  rationale: Câu văn mang tính pháp lý và đặt cả hai mệnh đề dưới điều kiện. Bản dịch giữ nguyên sự căng thẳng ấy, không suy rộng thành một giáo lý tổng quát về án tử hình.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng và dễ hiểu. Dùng “Sê-sa” theo lối phiên âm Kinh Thánh quen thuộc; “kháng cáo lên” làm rõ bối cảnh pháp lý. Dấu chú thích [a] được đặt ngay sau cụm từ cần giải thích.
