  naturalness: 'Bản sửa dùng tiếng Việt hiện đại, trang trọng và tự nhiên hơn: “đã phạm điều gì đáng bị xử tử” rõ nghĩa pháp lý hơn “đã làm điều gì đáng chết”; “giao nộp tôi cho họ để lấy lòng họ” tránh sự mơ hồ của “để làm ơn.”'
