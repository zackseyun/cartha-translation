source:
  edition: SBLGNT
  text: Διατρίψας δὲ ἐν αὐτοῖς ἡμέρας ⸂οὐ πλείους ὀκτὼ⸃ ἢ δέκα, καταβὰς εἰς Καισάρειαν, τῇ ἐπαύριον καθίσας ἐπὶ τοῦ βήματος ἐκέλευσεν τὸν Παῦλον ἀχθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/006.yaml
  text: After spending among them no more than eight or ten days[a], he went down to Caesarea, and on the next day, after taking his seat on the tribunal, he ordered Paul to be brought in.
translation:
  language: vi
  text: Sau khi ở lại với họ không quá tám hay mười ngày, Phê-tu đi xuống Sê-sa-rê. Ngày hôm sau, ông ngồi vào ghế xét xử[a] và ra lệnh đưa Phao-lô đến.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “ngồi trên bục xét xử.” Từ Hy Lạp βῆμα chỉ ghế hoặc bục chính thức dùng trong việc xét xử.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διατρίψας δὲ ἐν αὐτοῖς
  choice: Sau khi ở giữa họ
  rationale: Diễn đạt tự nhiên hành động xảy ra trước; “ở giữa họ” giữ sắc thái không gian và xã hội của ἐν αὐτοῖς.
- source_word: ἡμέρας οὐ πλείους ὀκτὼ ἢ δέκα
  choice: không quá tám hay mười ngày
  rationale: Giữ nguyên cấu trúc giới hạn không chính xác của bản Hy Lạp, thay vì biến thành một số ngày xác định.
- source_word: καταβὰς εἰς Καισάρειαν
  choice: đi xuống Sê-sa-rê
  rationale: Giữ hướng di chuyển theo cách nói địa lý cổ, từ Giê-ru-sa-lem xuống Sê-sa-rê.
- source_word: τῇ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Cách diễn đạt thời gian rõ ràng, tự nhiên trong tiếng Việt hiện đại.
- source_word: καθίσας ἐπὶ τοῦ βήματος
  choice: ông ngồi vào ghế xét xử
  rationale: βῆμα trong văn cảnh này chỉ ghế hoặc bục chính thức nơi viên chức chủ tọa việc xét xử; “ngồi vào” truyền đạt việc Phê-tu đảm nhiệm vị trí tư pháp.
- source_word: ἐκέλευσεν τὸν Παῦλον ἀχθῆναι
  choice: ra lệnh đưa Phao-lô đến
  rationale: Giữ sắc thái mệnh lệnh chính thức và thể bị động hàm ẩn của ἀχθῆναι, đồng thời diễn đạt gọn, tự nhiên.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Các tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt. Cụm “tám hay mười ngày” được giữ để bảo tồn cách diễn đạt xấp xỉ và phần nào bất thường của nguyên văn.
