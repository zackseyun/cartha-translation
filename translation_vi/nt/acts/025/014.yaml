base_translation:
  language: en
  yaml_path: translation/nt/acts/025/014.yaml
  text: And as they stayed there many days[a], Festus laid before the king the matters concerning Paul, saying[b], “There is a certain man left behind by Felix as a prisoner,”
translation:
  language: vi
  text: 'Khi họ ở lại đó nhiều ngày, Phê-tu trình bày cho vua[a] những việc liên quan đến Phao-lô[b], và nói: “Có một người bị Phê-lích để lại trong thân phận tù nhân.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “báo cáo với vua”. Từ Hy Lạp hàm ý đưa một vấn đề ra để người nghe xem xét, chứ không chỉ truyền đạt thông tin.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “vụ án của Phao-lô”. Cụm từ này có thể chỉ cụ thể hơn đến tình trạng pháp lý của ông.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείους ἡμέρας
  choice: nhiều ngày
  rationale: Trong ngữ cảnh chỉ thời gian, dạng so sánh πλείους có thể mang nghĩa thành ngữ là “nhiều” hoặc “vài” ngày; “nhiều ngày” diễn tả một thời gian lưu lại tương đối dài mà không ép thành phép so sánh.
- source_word: διέτριβον
  choice: họ ở lại
  rationale: Động từ διατρίβω ở đây nói đến việc lưu lại hoặc trải qua một khoảng thời gian tại một nơi; “ở lại” tự nhiên và phù hợp với chủ ngữ số nhiều.
- source_word: ἀνέθετο
  choice: trình bày với
  rationale: Dạng trung của ἀνατίθημι có nghĩa đưa một vấn đề ra trước người khác để họ xem xét; “trình bày với” giữ được sắc thái ấy, hơn là chỉ đơn thuần báo tin.
- source_word: τὰ κατὰ τὸν Παῦλον
  choice: vụ việc liên quan đến Phao-lô
  rationale: Cụm từ chỉ những điều hoặc sự việc liên quan đến Phao-lô, rất có thể là hoàn cảnh pháp lý của ông; “vụ việc” tự nhiên trong ngữ cảnh mà chưa xác định quá mức là một hồ sơ pháp lý chính thức.
- source_word: Ἀνήρ τίς ἐστιν
  choice: Có một người
  rationale: Cách nói này giới thiệu một người cụ thể nhưng chưa nêu danh tính; “Có một người” là cách diễn đạt tự nhiên trong lời kể tiếng Việt.
- source_word: καταλελειμμένος
  choice: bị ... để lại
  rationale: Phân từ hoàn thành bị động diễn tả người đã bị để lại và vẫn ở trong tình trạng ấy; cách dịch này giữ cả hành động lẫn trạng thái tiếp diễn mà không hàm ý bị ruồng bỏ về tình cảm.
- source_word: δέσμιος
  choice: trong thân phận tù nhân
  rationale: δέσμιος nghĩa là người bị giam giữ. Cụm này làm rõ Phê-lích đã để người ấy lại trong tình trạng là một tù nhân.
- source_word: βασιλεῖ
  choice: vua
  rationale: Nguyên văn chỉ dùng tước hiệu “vua”, không nhắc lại tên Ạc-ríp-ba trong câu này; ngữ cảnh đã xác định rõ người được nói đến.
