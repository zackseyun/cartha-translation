id: ACT.25.19
reference: Acts 25:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ζητήματα δέ τινα περὶ τῆς ἰδίας δεισιδαιμονίας εἶχον πρὸς αὐτὸν καὶ περί τινος Ἰησοῦ τεθνηκότος, ὃν ἔφασκεν ὁ Παῦλος ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/019.yaml
  text: Rather[a], they had certain disputes with him about their own religion and about a certain Jesus who had died, whom Paul claimed to be alive.
translation:
  language: vi
  text: Trái lại, họ chỉ có một vài điểm tranh luận với ông ấy về tôn giáo riêng của họ[a] và về một người tên là Giê-xu, người đã chết nhưng Phao-lô quả quyết là đang sống.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự mê tín của họ.” Từ Hy Lạp có thể được dùng theo nghĩa trung tính là “tôn giáo” hoặc theo nghĩa chê bai hơn trong lời của một người ngoài.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματα
  choice: vài điều tranh luận
  rationale: Danh từ chỉ những vấn đề đang có sự bất đồng, không chỉ là các câu hỏi trung tính; cách dịch này giữ sắc thái tranh chấp mà vẫn tự nhiên trong tiếng Việt.
- source_word: δέ
  choice: Trái lại
  rationale: 'Liên từ tạo thế tương phản mang tính đính chính với câu trước: thay vì những tội nghiêm trọng mà Phê-tu chờ đợi, các nguyên cáo lại nêu những vấn đề tôn giáo.'
- source_word: τινα
  choice: vài
  rationale: Giữ tính bất định của từ Hy Lạp và phù hợp với lối diễn đạt tiếng Việt hiện đại.
- source_word: περὶ τῆς ἰδίας δεισιδαιμονίας
  choice: về tôn giáo riêng của họ
  rationale: δεισιδαιμονία có thể chỉ tôn giáo theo nghĩa trung tính hoặc mê tín theo nghĩa chê bai. Bản chính dùng cách gọi trung tính, đồng thời 'riêng của họ' giữ khoảng cách trong lời của Phê-tu; sắc thái khác được ghi ở chú thích.
- source_word: εἶχον πρὸς αὐτόν
  choice: họ chỉ có ... tranh luận với ông ấy
  rationale: Diễn đạt tự nhiên quan hệ tranh luận giữa các nguyên cáo và Phao-lô, không gán thêm sắc thái pháp lý quá mức; 'chỉ' làm rõ sự tương phản trong ngữ cảnh.
- source_word: καὶ περί τινος Ἰησοῦ
  choice: và về một người tên là Giê-xu
  rationale: Cách nói thể hiện thái độ xa lạ hoặc ít hiểu biết của Phê-tu đối với Giê-xu, tự nhiên hơn trong tiếng Việt so với 'một Giê-xu nào đó' vốn dễ mang sắc thái khinh miệt mạnh.
- source_word: τεθνηκότος
  choice: người đã chết
  rationale: Phân từ hoàn thành chỉ tình trạng phát sinh từ việc chết; 'đã chết' tự nhiên và tạo đối lập rõ với lời quả quyết rằng người ấy đang sống.
- source_word: ὃν ἔφασκεν ὁ Παῦλος ζῆν
  choice: nhưng Phao-lô quả quyết là đang sống
  rationale: φάσκω trình bày một lời khẳng định mà người thuật lại không nhất thiết xác nhận. 'Quả quyết' giữ lập trường tường thuật của Phê-tu, còn 'đang sống' phản ánh nội dung ζῆν.
theological_decisions:
- issue: Cách dịch δεισιδαιμονία trong lời Phê-tu
  choice: tôn giáo riêng của họ
  alternative: sự mê tín của họ
  rationale: Từ Hy Lạp có thể trung tính hoặc mang ý chê bai. Dùng 'tôn giáo' tránh áp đặt một lời xúc phạm mạnh hơn văn bản đòi hỏi, còn chú thích bảo lưu khả năng có sắc thái tiêu cực.
- issue: Cách trình bày lời nói về sự sống lại
  choice: Phao-lô quả quyết là đang sống
  alternative: Phao-lô nói là đang sống
  rationale: Đây là lời Phê-tu thuật lại lập trường của Phao-lô, không phải lời xác nhận trực tiếp của người kể trong mệnh đề này. 'Quả quyết' phản ánh φάσκω mà không phán quyết đúng sai về lời ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông ấy” cho Phao-lô trong lời thuật của Phê-tu, “một người tên là Giê-xu” để giữ khoảng cách của người nói, và “quả quyết” để bảo toàn tính tường thuật mà không phủ nhận hay xác nhận thay cho Phê-tu.
