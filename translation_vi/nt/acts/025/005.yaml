  text: Οἱ οὖν ⸂ἐν ὑμῖν, φησίν, δυνατοὶ⸃ συγκαταβάντες εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ⸀ἄτοπον κατηγορείτωσαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/025/005.yaml
  text: Therefore[a], let those among you who are able go down with me, and if there is anything wrong in the man[b], let them accuse him.
translation:
  language: vi
  text: 'Vì vậy, ông nói: “Những người có thế lực trong quý vị hãy cùng tôi đi xuống; nếu người ấy có điều gì sai trái, họ hãy tố cáo người ấy.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Những người có thế lực” cũng có thể dịch là “những người có thẩm quyền” hoặc “những người có khả năng”. Từ Hy Lạp có thể nói đến địa vị, quyền thế hoặc khả năng thực hiện việc này. Câu cuối cũng có thể dịch: “họ hãy đưa ra lời buộc tội chống lại người ấy.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν
  choice: Vì vậy, ... hãy
  rationale: οὖν nối tiếp và rút ra hệ quả từ lời đề nghị trước đó; “Vì vậy” diễn đạt tự nhiên chức năng ấy, còn mệnh lệnh ngôi thứ ba được chuyển bằng “hãy”.
- source_word: ἐν ὑμῖν ... δυνατοὶ
  choice: những người có thẩm quyền trong quý vị
  rationale: Trong bối cảnh hành chính-pháp lý, δυνατοί có thể chỉ những người có thế lực, địa vị hay đủ tư cách hành động. “Có thẩm quyền” phù hợp với những đại diện có thể đi cùng Phê-tu để truy tố, nhưng chú thích vẫn bảo lưu nghĩa “có khả năng”.
- source_word: φησίν
  choice: ông nói
  rationale: φησίν là lời dẫn xen vào ở thì hiện tại lịch sử. Giữ lại giúp phản ánh nguồn Hy Lạp rõ hơn và nối câu này với lời thuật của người kể.
- source_word: συγκαταβάντες
  choice: cùng tôi đi xuống
  rationale: Phân từ diễn tả việc cùng đi xuống; “cùng tôi” thể hiện tiền tố σύν theo ngữ cảnh Phê-tu sẽ trở về Sê-sa-rê.
- source_word: εἴ τί ἐστιν ἐν τῷ ἀνδρὶ ἄτοπον
  choice: nếu người ấy có điều gì sai trái
  rationale: Cách nói tự nhiên trong tiếng Việt, giữ tính điều kiện và độ rộng của ἄτοπον, không nâng nghĩa thành “phạm tội” hay “hành vi phạm pháp”.
- source_word: κατηγορείτωσαν αὐτοῦ
  choice: họ hãy tố cáo người
  rationale: κατηγορέω trong bối cảnh pháp lý là tố cáo hoặc đưa ra lời buộc tội. “Tố cáo người” gọn, trang trọng và giữ đối tượng chỉ về Phao-lô.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “quý vị” cho lời nói chính thức của tổng đốc với giới lãnh đạo; dùng “người ấy/người” để giữ sắc thái có phần xa cách khi nhắc đến Phao-lô. Dấu chú thích [a] được đặt trong chính văn.
