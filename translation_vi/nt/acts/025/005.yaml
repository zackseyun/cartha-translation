revisions:
- from: 'Vì vậy, ông nói: “Những người có thẩm quyền trong quý vị hãy cùng tôi đi xuống; nếu người ấy có điều gì sai trái, họ hãy tố cáo người.”[a]'
  to: 'Vì vậy, ông nói: “Những người có thế lực trong quý vị hãy cùng tôi đi xuống; nếu người ấy có điều gì sai trái, họ hãy tố cáo người ấy.”[a]'
  rationale: Thay “có thẩm quyền” bằng “có thế lực” để tránh áp đặt ý quyền hạn chính thức và phản ánh sát hơn độ mở của δυνατοί trong ngữ cảnh. Đổi tân ngữ cuối thành “người ấy” để câu tiếng Việt rõ và tự nhiên hơn, không thay đổi ý nghĩa.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:22:37Z'
review_pass:
  verdict: revise
  source_fidelity: Bản dịch giữ được mạch suy luận của οὖν, ý cùng đi xuống của συγκαταβάντες, tính điều kiện của εἴ τί ἐστιν, và động từ pháp lý κατηγορείτωσαν. Tuy nhiên, “có thẩm quyền” thu hẹp δυνατοί thành quyền hạn chính thức, trong khi từ này ở đây có thể chỉ người có thế lực/địa vị nổi bật (và vẫn có độ mở là người có khả năng).
  naturalness: Câu văn nhìn chung tự nhiên và trang trọng. “Những người có thế lực trong quý vị” diễn đạt tự nhiên hơn sắc thái κοινωνική của δυνατοί mà không hàm ý họ nắm thẩm quyền pháp lý. Lặp lại “người ấy” ở cuối câu giúp quy chiếu rõ ràng trong tiếng Việt.
  terminology: “Có thế lực” bảo toàn tốt hơn trường nghĩa của δυνατοί trong bối cảnh hành chính-pháp lý. “Sai trái” phù hợp với ἄτοπον, không cường điệu thành tội phạm. “Tố cáo” là tương đương chuẩn của κατηγορέω.
  issues:
  - severity: medium
    issue: “Những người có thẩm quyền” cho δυνατοί
    rationale: “Có thẩm quyền” gợi quyền hạn pháp lý hay chức vụ chính thức, điều bản văn không xác định. δυνατοί có thể mang nghĩa người có thế lực, nổi bật, hoặc có khả năng; bối cảnh nghiêng về những người có thế lực/địa vị.
  - severity: low
    issue: Đại từ tân ngữ “người” ở cuối câu
    rationale: Dù có thể hiểu được, “tố cáo người” kém rõ và kém tự nhiên hơn “tố cáo người ấy”; cách sau cũng duy trì cách quy chiếu xa cách của τῷ ἀνδρί.
  revised_text: 'Vì vậy, ông nói: “Những người có thế lực trong quý vị hãy cùng tôi đi xuống; nếu người ấy có điều gì sai trái, họ hãy tố cáo người ấy.”[a]'
