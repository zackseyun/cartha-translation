  yaml_path: translation/nt/acts/025/018.yaml
  text: Concerning him[a], when the accusers stood up, they brought no charge of the evil things that I was suspecting,
translation:
  language: vi
  text: Khi những người tố cáo đứng lên, họ không đưa ra lời buộc tội nào về những việc xấu mà tôi đã nghi người ấy phạm phải.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “họ không đưa ra lời buộc tội nào về những tội ác mà tôi nghi người ấy đã phạm.” Tiếng Hy Lạp nói “những việc xấu”, có thể chỉ hành vi sai trái nói chung chứ không nhất thiết là các tội danh được xác định theo pháp luật.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ οὗ
  choice: về ... người ấy
  rationale: Cụm περί với đại từ quan hệ sở hữu cách chỉ người đang được bàn đến, tức Phao-lô. Trong tiếng Việt, ý này được diễn đạt tự nhiên trong cụm “mà tôi đã nghi là người ấy phạm phải”.
- source_word: σταθέντες
  choice: Khi ... đứng lên
  rationale: Phân từ bất định quá khứ được hiểu theo thời gian trong bối cảnh xét xử, chỉ việc những người tố cáo đứng ra trình bày vụ kiện.
- source_word: οἱ κατήγοροι
  choice: những người tố cáo
  rationale: Cách dịch trực tiếp, dễ hiểu, đồng thời giữ được sắc thái pháp lý mà không chuyên biệt hóa họ thành công tố viên chính thức.
- source_word: οὐδεμίαν αἰτίαν ἔφερον
  choice: không đưa ra được lời buộc tội nào
  rationale: Cụm pháp lý này nói đến việc đưa ra một cáo buộc. “Không đưa ra được” diễn tả tự nhiên sự tương phản giữa điều Phê-tu dự đoán và nội dung thực tế họ trình bày.
- source_word: ὧν
  choice: về những ... mà
  rationale: Đại từ quan hệ số nhiều liên kết “lời buộc tội” với loại việc xấu Phê-tu đã nghi ngờ; cấu trúc tiếng Việt được điều chỉnh để rõ chủ thể bị nghi là Phao-lô.
- source_word: ἐγὼ ὑπενόουν
  choice: mà tôi đã nghi
  rationale: ὑπονοέω diễn tả sự nghi ngờ hoặc phỏng đoán trước đó của Phê-tu. “Đã nghi” tự nhiên hơn “đang nghi” trong tiếng Việt mà vẫn giữ quan hệ thời gian với lúc các cáo buộc được nêu.
- source_word: πονηρῶν
  choice: những việc xấu
  rationale: Tính từ trung tính số nhiều chỉ những điều hoặc hành vi xấu nói chung. Cách dịch này không thu hẹp nghĩa thành các tội danh pháp lý đã được xác định.
