id: ACT.11.19
reference: Acts 11:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Οἱ μὲν οὖν διασπαρέντες ἀπὸ τῆς θλίψεως τῆς γενομένης ἐπὶ Στεφάνῳ διῆλθον ἕως Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας μηδενὶ λαλοῦντες τὸν λόγον εἰ μὴ μόνον Ἰουδαίοις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/019.yaml
  text: So then[a], those who had been scattered because of the affliction that arose over Stephen went as far as Phoenicia and Cyprus and Antioch[c][b], speaking the word to no one except Jews.
translation:
  language: vi
  text: Vậy, những người đã bị tản lạc vì cơn hoạn nạn xảy ra liên quan đến Ê-tiên đã đi đến tận Phê-ni-xi, đảo Síp và An-ti-ốt, không rao giảng sứ điệp cho ai ngoài người Do Thái mà thôi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cơn hoạn nạn” cũng có thể dịch là “cuộc bắt bớ”; từ Hy Lạp có thể chỉ cảnh khốn khó, áp bức hoặc sự bắt bớ trong ngữ cảnh này.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “lời”; trong ngữ cảnh, từ này chỉ sứ điệp được rao giảng về Chúa Giê-su. Cũng có thể dịch là “lời”.
    reason: lexical_alternative
  - marker: c
    text: 'Cụm Hy Lạp được nhấn mạnh: “ngoại trừ chỉ người Do Thái” hoặc “ngoại trừ người Do Thái mà thôi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διασπαρέντες
  choice: những người bị tản lạc
  rationale: Giữ nghĩa bị động của phân từ aorist và liên hệ với cuộc tản lạc đã xảy ra trước hành trình được kể.
- source_word: θλίψεως
  choice: cơn hoạn nạn
  rationale: Diễn đạt phạm vi nghĩa rộng của θλῖψις là cảnh khốn khó, áp bức hay hoạn nạn, không thu hẹp ngay thành thuật ngữ cụ thể hơn là “cuộc bắt bớ”.
- source_word: τῆς γενομένης ἐπὶ Στεφάνῳ
  choice: xảy ra liên quan đến Ê-tiên
  rationale: Giữ sắc thái liên hệ của ἐπί với Ê-tiên và tránh khẳng định quá mức rằng chính Ê-tiên là nguyên nhân trực tiếp.
- source_word: διῆλθον ἕως
  choice: đã đi đến tận
  rationale: Diễn đạt tự nhiên hành trình và giới hạn địa lý được ἕως đánh dấu.
- source_word: Φοινίκης καὶ Κύπρου καὶ Ἀντιοχείας
  choice: Phê-ni-xi, đảo Síp và An-ti-ốt
  rationale: Dùng các địa danh Việt hóa dễ nhận biết; thêm “đảo” trước Síp để câu tự nhiên và rõ nghĩa địa lý.
- source_word: μηδενὶ λαλοῦντες τὸν λόγον
  choice: không rao giảng lời ấy cho ai
  rationale: Trong ngữ cảnh truyền giáo của Công Vụ, λαλεῖν τὸν λόγον là công bố sứ điệp; “lời ấy” vẫn duy trì thuật ngữ chủ đề của Lu-ca mà không mở rộng thành “Tin Lành” trong chính văn.
- source_word: εἰ μὴ μόνον Ἰουδαίοις
  choice: ngoài người Do Thái mà thôi
  rationale: Cặp “ngoài… mà thôi” bảo toàn sắc thái nhấn mạnh kép của εἰ μή và μόνον, đồng thời tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Bản chất của θλῖψις sau biến cố Ê-tiên
  choice: cơn hoạn nạn
  alternative: cuộc bắt bớ
  rationale: Bối cảnh bao hàm sự bắt bớ, nhưng danh từ Hy Lạp có nghĩa rộng hơn; chính văn không nên thu hẹp nghĩa một cách không cần thiết.
- issue: Ý nghĩa của τὸν λόγον trong Công Vụ
  choice: lời ấy
  alternative: sứ điệp / lời về Chúa Giê-su
  rationale: Giữ cách nói chủ đề của Lu-ca và tính xác định của mạo từ; chú thích giải thích rằng đây là sứ điệp được rao giảng về Chúa Giê-su.
- issue: Phạm vi người nghe
  choice: ngoài người Do Thái mà thôi
  alternative: chỉ nói với người Do Thái
  rationale: Giữ sự nhấn mạnh rằng vào giai đoạn này nhóm người bị tản lạc giới hạn việc công bố cho người Do Thái, nhưng không suy diễn thành một quy tắc thần học phổ quát.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “rao giảng” để thể hiện hoạt động công bố sứ điệp trong ngữ cảnh, “liên quan đến Ê-tiên” để bảo toàn quan hệ có phần mở của cụm Hy Lạp, và “mà thôi” để giữ nét nhấn mạnh của nguyên văn.
