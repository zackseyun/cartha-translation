    rationale: «Những tín hữu đã chịu cắt bì» thêm yếu tố «tín hữu», không có trực tiếp trong cụm Hy Lạp, dù ngữ cảnh hỗ trợ. Cần ghi rõ đây là cách hiểu theo ngữ cảnh để bảo lưu mức độ hàm nghĩa của nguyên văn.
