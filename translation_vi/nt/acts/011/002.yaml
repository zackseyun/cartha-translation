    rationale: Cách nói này không phải lối kết hợp thông dụng trong tiếng Việt hiện đại và làm mờ cấu trúc nhận diện nhóm của οἱ ἐκ περιτομῆς. Đổi thành «những người chịu cắt bì» vừa rõ vừa không áp đặt khái niệm đảng phái.
  - severity: low
