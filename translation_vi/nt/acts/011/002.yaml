  text: ⸂ὅτε δὲ⸃ ἀνέβη Πέτρος εἰς ⸀Ἰερουσαλήμ, διεκρίνοντο πρὸς αὐτὸν οἱ ἐκ περιτομῆς
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/002.yaml
  text: But when Peter went up to Jerusalem[a], those of the circumcision were disputing with him.
translation:
  language: vi
  text: Nhưng khi Phi-e-rơ lên Giê-ru-sa-lem, những người chịu cắt bì[a] tranh luận với ông.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “những người thuộc về phép cắt bì” hoặc “nhóm cắt bì”. Tiếng Hy Lạp nhận diện những người này qua mối liên hệ với phép cắt bì; trong ngữ cảnh, cũng có thể hiểu là những tín hữu đã chịu cắt bì.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Nhưng khi
  rationale: δέ vừa tiếp nối câu chuyện vừa gợi sắc thái tương phản nhẹ với diễn biến trước đó; “Nhưng khi” giữ được cả hai nét nghĩa.
- source_word: ἀνέβη
  choice: lên
  rationale: ἀναβαίνω thường có nghĩa là “đi lên”; khi nói về Giê-ru-sa-lem, đây là cách nói địa lý quen thuộc, nên “lên” vừa sát nguồn vừa tự nhiên.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: Ἰερουσαλήμ
  choice: Giê-ru-sa-lem
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
- source_word: διεκρίνοντο
  choice: tranh luận
  rationale: Dạng chưa hoàn thành diễn tả hành động phản đối bằng lời đang diễn ra; “tranh luận” thể hiện sự bất đồng trực tiếp mà không làm sắc thái thù địch mạnh hơn nguyên văn.
- source_word: πρὸς αὐτόν
  choice: với ông
  rationale: Với động từ chỉ tranh luận, πρός cộng đối cách chỉ người mà sự tranh luận hướng đến; “với ông” là cách diễn đạt tự nhiên.
- source_word: οἱ ἐκ περιτομῆς
  choice: những người thuộc giới chịu cắt bì
  rationale: Cụm từ nguyên nghĩa nhận diện một nhóm qua sự liên hệ với phép cắt bì. “Thuộc giới chịu cắt bì” giữ dấu hiệu nhận diện nhóm mà không khẳng định đây là một đảng phái chính thức.
theological_decisions:
- issue: Nhận diện οἱ ἐκ περιτομῆς
  choice: một nhóm được nhận diện bởi sự chịu cắt bì và đang phản đối Phi-e-rơ
  alternative: toàn thể các tín hữu Do Thái nói chung; hoặc một “đảng cắt bì” chính thức theo nghĩa kỹ thuật về sau
  rationale: Nguyên văn xác định họ bằng mối liên hệ với phép cắt bì nhưng không tự nó cho biết đây là toàn thể tín hữu Do Thái hay một đảng phái có tổ chức. Bản dịch và chú thích giữ lại độ mở ấy.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Giới” cho thấy đây là một tập thể được nhận diện bởi phép cắt bì nhưng tránh áp đặt ý niệm về một đảng phái chính thức; “tranh luận” diễn đạt sự phản đối bằng lời mà không cường điệu mức độ đối đầu.
