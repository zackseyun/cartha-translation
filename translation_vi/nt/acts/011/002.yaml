revisions:
- from: Nhưng khi Phi-e-rơ lên Giê-ru-sa-lem, những người thuộc giới chịu cắt bì[a] tranh luận với ông.
  to: Nhưng khi Phi-e-rơ lên Giê-ru-sa-lem, những người chịu cắt bì[a] tranh luận với ông.
  rationale: Thay «những người thuộc giới chịu cắt bì» bằng «những người chịu cắt bì» để có tiếng Việt tự nhiên hơn và phản ánh trực tiếp hơn cụm οἱ ἐκ περιτομῆς. Chú thích được điều chỉnh để không trình bày yếu tố «tín hữu» như thể có mặt trực tiếp trong cụm từ, đồng thời vẫn nêu cách hiểu được ngữ cảnh hỗ trợ. Các thành phần khác của câu phù hợp với nguyên văn và không cần sửa.
