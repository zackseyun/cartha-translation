id: ACT.11.15
reference: Acts 11:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν ἐπέπεσεν τὸ πνεῦμα τὸ ἅγιον ἐπ’ αὐτοὺς ὥσπερ καὶ ἐφ’ ἡμᾶς ἐν ἀρχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/015.yaml
  text: And as I began to speak[c][b][a], the Holy Spirit fell on them just as it had on us at the beginning.
translation:
  language: vi
  text: Khi tôi bắt đầu nói[a], Đức Thánh Linh giáng xuống trên họ, cũng như đã giáng xuống trên chúng ta lúc ban đầu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Vừa lúc tôi bắt đầu nói.” Cấu trúc Hy Lạp có thể diễn tả là “khi” hoặc nhấn mạnh hai việc xảy ra đồng thời.'
    reason: lexical_alternative
  - marker: b
    text: “Lúc ban đầu” nhiều khả năng nói đến lần Đức Thánh Linh được ban xuống trên các môn đồ vào lễ Ngũ Tuần.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν δὲ τῷ ἄρξασθαί με λαλεῖν
  choice: Khi tôi bắt đầu nói
  rationale: Cấu trúc ἐν + động từ nguyên mẫu có mạo từ diễn tả thời gian đồng thời, có thể hiểu là “khi” hoặc “trong lúc”. Cách dịch này tự nhiên trong tiếng Việt và cho thấy sự việc xảy ra ngay vào lúc Phi-e-rơ bắt đầu nói.
- source_word: ἐπέπεσεν
  choice: giáng xuống trên
  rationale: Động từ ἐπιπίπτω đi với ἐπί tạo nên hình ảnh sống động về Thánh Linh đến trên một người. “Giáng xuống trên” giữ được hình ảnh của nguyên văn mà vẫn quen thuộc, trang trọng trong tiếng Việt.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Đức Thánh Linh
  rationale: Đây là cách gọi tiêu chuẩn, trang trọng và dễ hiểu trong tiếng Việt hiện đại.
- source_word: ἐπ’ αὐτούς
  choice: trên họ
  rationale: Giữ giới từ ἐπί và duy trì sự song song với cụm “trên chúng ta” ở phần sau.
- source_word: ὥσπερ καὶ ἐφ’ ἡμᾶς
  choice: cũng như đã giáng xuống trên chúng ta
  rationale: “Cũng như” thể hiện phép so sánh chặt chẽ của ὥσπερ, còn “đã giáng xuống” bổ sung động từ được tỉnh lược trong tiếng Hy Lạp để câu tiếng Việt rõ và tự nhiên, đồng thời giữ ý của καί là “cũng”.
- source_word: ἐν ἀρχῇ
  choice: lúc ban đầu
  rationale: Cụm từ chỉ một thời điểm khởi đầu trong kinh nghiệm được Thánh Linh tuôn đổ, không gợi đến sự sáng tạo. “Lúc ban đầu” vừa tự nhiên vừa giữ nguyên độ rộng về nghĩa của nguyên văn.
theological_decisions:
- issue: Điểm quy chiếu của “lúc ban đầu” (ἐν ἀρχῇ)
  choice: Giữ cách diễn đạt rộng “lúc ban đầu” trong chính văn; nhiều khả năng chỉ lần Thánh Linh được ban xuống trên các môn đồ vào lễ Ngũ Tuần.
  alternative: Hiểu chung là “thuở đầu” mà không xác định cụ thể lễ Ngũ Tuần.
  rationale: Trong ngữ cảnh, Phi-e-rơ so sánh điều xảy ra với nhà Cọt-nây với điều từng xảy ra “trên chúng ta”; Công vụ 11:16 liên hệ lời này với trải nghiệm ban đầu của các môn đồ. Tuy nhiên, chính cụm từ không nêu đích danh lễ Ngũ Tuần, nên bản dịch không đưa cách giải thích ấy vào chính văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng nhưng dễ hiểu. Câu giữ phép song song “trên họ… trên chúng ta” của nguyên văn; động từ được lặp lại ở vế so sánh để tránh lối nói tỉnh lược gượng gạo trong tiếng Việt.
