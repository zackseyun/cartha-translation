- from: Khi đến nơi và thấy ân điển của Đức Chúa Trời[a], ông vui mừng và không ngừng khuyên tất cả họ hãy hết lòng quyết tâm gắn bó với Chúa[b].
  to: Khi đến nơi và thấy ân điển của Đức Chúa Trời[a], ông vui mừng và không ngừng khuyên mọi người hãy một lòng gắn bó với Chúa[b].
  rationale: Thay “tất cả họ” bằng “mọi người” và thay cụm rườm rà “hết lòng quyết tâm” bằng “một lòng”. Bản sửa giữ sắc thái khuyên nhủ liên tục, ý chí nội tâm, và sự kiên trì trong mối liên hệ với Chúa mà không diễn giải theo một hệ thống thần học.
