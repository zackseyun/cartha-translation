id: ACT.11.23
reference: Acts 11:23
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς παραγενόμενος καὶ ἰδὼν τὴν χάριν ⸀τὴν τοῦ θεοῦ, ἐχάρη καὶ παρεκάλει πάντας τῇ προθέσει τῆς καρδίας ⸀προσμένειν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/023.yaml
  text: When he arrived and saw the grace of God, he rejoiced and kept urging them all to remain devoted to the Lord with purpose of heart,
translation:
  language: vi
  text: Khi đến nơi và thấy ân điển của Đức Chúa Trời[a], ông vui mừng và không ngừng khuyên mọi người hãy một lòng gắn bó với Chúa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “ân sủng của Đức Chúa Trời.” Cụm từ này có thể nói đến bằng chứng thấy được về công việc đầy ân điển của Đức Chúa Trời giữa họ.
    reason: lexical_alternative
  - marker: b
    text: Hay “tiếp tục ở với Chúa” hoặc “trung thành với Chúa.”
    reason: alternative_reading
lexical_decisions:
- source_word: παραγενόμενος
  choice: khi đến nơi
  rationale: Diễn đạt tự nhiên phân từ aorist, chỉ việc Ba-na-ba đến địa điểm đang được nói đến.
- source_word: ἰδὼν
  choice: thấy
  rationale: Giữ nghĩa thị giác thông thường của ὁράω, đồng thời không loại trừ sắc thái nhận biết công việc của Đức Chúa Trời qua những bằng chứng hữu hình.
- source_word: τὴν χάριν τὴν τοῦ θεοῦ
  choice: ân điển của Đức Chúa Trời
  rationale: Giữ nguyên sức nặng thần học của χάρις và không diễn giải hẹp thành điều Đức Chúa Trời đã làm.
- source_word: ἐχάρη
  choice: vui mừng
  rationale: Cách diễn đạt trang trọng, tự nhiên, phù hợp với nghĩa của động từ trong ngữ cảnh.
- source_word: παρεκάλει
  choice: không ngừng khuyên
  rationale: Thể chưa hoàn thành cho thấy hành động tiếp diễn; παρακαλέω ở đây mang nghĩa khuyên nhủ, thúc giục.
- source_word: πάντας
  choice: tất cả họ
  rationale: Chỉ toàn thể những người tin được nhắc đến trong ngữ cảnh, không thêm đối tượng mới.
- source_word: τῇ προθέσει τῆς καρδίας
  choice: hết lòng quyết tâm
  rationale: Diễn đạt tự nhiên ý về chủ tâm hay quyết chí phát xuất từ con người bên trong, tránh lối dịch gượng 'với mục đích của lòng'.
- source_word: προσμένειν
  choice: gắn bó
  rationale: Truyền đạt sự tiếp tục ở trong mối liên hệ bền vững với Chúa; chú thích bảo lưu các khả năng dịch sát hơn là 'tiếp tục ở với' hoặc 'trung thành với'.
- source_word: τῷ κυρίῳ
  choice: với Chúa
  rationale: Giữ tước hiệu κύριος theo cách dùng tự nhiên trong tiếng Việt; trong mạch truyện Công Vụ, từ này chỉ Chúa Giê-su phục sinh.
theological_decisions:
- issue: Ý nghĩa của 'ân điển của Đức Chúa Trời' trong ngữ cảnh
  choice: Giữ nguyên cụm từ, cho phép người đọc hiểu đó là ân huệ hay công việc đầy ân điển của Đức Chúa Trời được biểu lộ giữa các tín hữu tại An-ti-ốt.
  alternative: Diễn giải trực tiếp là 'những điều Đức Chúa Trời đã làm' hoặc hiểu là phẩm chất nhân hậu của các tín hữu.
  rationale: Nguyên văn dùng χάρις và có thể hướng đến bằng chứng thấy được về hành động đầy ân điển của Đức Chúa Trời; dịch nguyên cụm từ bảo toàn chiều sâu và độ mở thần học.
- issue: Sắc thái của προσμένειν τῷ κυρίῳ
  choice: Sự tiếp tục gắn bó bền vững với Chúa.
  alternative: Tiếp tục ở với Chúa; trung thành với Chúa.
  rationale: Cách dịch 'gắn bó với Chúa' diễn đạt rõ sự kiên trì trong mối liên hệ mà không áp đặt một phạm trù tín lý hệ thống hẹp hơn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. 'Không ngừng khuyên' bảo toàn sắc thái tiếp diễn; 'hết lòng quyết tâm gắn bó' sắp xếp lại cấu trúc cho tự nhiên trong tiếng Việt mà vẫn giữ ý về quyết tâm nội tâm và sự bền lòng với Chúa.
