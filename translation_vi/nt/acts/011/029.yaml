  text: τῶν δὲ μαθητῶν καθὼς εὐπορεῖτό τις ὥρισαν ἕκαστος αὐτῶν εἰς διακονίαν πέμψαι τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/029.yaml
  text: So the disciples determined[a], each according to his ability[b], to send relief to the brothers living in Judea.
translation:
  language: vi
  text: Vì vậy, các môn đồ quyết định rằng mỗi người, tùy theo khả năng của mình,[a] sẽ gửi sự trợ giúp cho các anh em đang sống ở Giu-đê.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “tùy theo mức sung túc của mỗi người” hoặc “tùy theo điều mỗi người có thể đóng góp.”'
    reason: lexical_alternative
  - marker: b
    text: “Các anh em” có lẽ chỉ những người cùng đức tin tại Giu-đê, bao gồm cộng đồng tín hữu rộng hơn.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητῶν
  choice: các môn đồ
  rationale: Cách dịch quen thuộc và chính xác trong sách Công Vụ, chỉ những người theo Chúa Giê-su.
- source_word: καθὼς εὐπορεῖτό τις
  choice: mỗi người tùy theo khả năng của mình
  rationale: Diễn đạt tự nhiên ý phân phối theo phương tiện hoặc điều kiện tài chính của từng người; kết hợp với ἕκαστος αὐτῶν mà không lặp nặng nề.
- source_word: ὥρισαν
  choice: quyết định
  rationale: Thể hiện một quyết định có chủ ý, đồng thời tự nhiên trong tiếng Việt hiện đại.
- source_word: ἕκαστος αὐτῶν
  choice: mỗi người
  rationale: 'Giữ rõ ý phân phối: từng người trong số các môn đồ tham gia theo khả năng riêng.'
- source_word: εἰς διακονίαν πέμψαι
  choice: gửi đồ cứu trợ
  rationale: Trong ngữ cảnh nạn đói, διακονία chỉ sự trợ giúp thiết thực; tiếng Việt cần nêu đối tượng được gửi để câu tự nhiên. 'Đồ cứu trợ' không xác định quá mức hình thức cụ thể của sự trợ giúp.
- source_word: τοῖς κατοικοῦσιν ἐν τῇ Ἰουδαίᾳ
  choice: đến cho ... đang sống tại Giu-đê
  rationale: Chuyển đạt trực tiếp và tự nhiên cụm phân từ chỉ những người cư trú tại Giu-đê.
- source_word: ἀδελφοῖς
  choice: các anh em
  rationale: Giữ hình thức thân tộc giống đực của nguyên văn; chú thích làm rõ trong ngữ cảnh từ này có thể chỉ rộng hơn cộng đồng tín hữu.
theological_decisions:
- issue: Phạm vi của danh từ thân tộc ἀδελφοῖς đối với cộng đồng Cơ Đốc tại Giu-đê
  choice: các anh em
  alternative: các anh chị em; các tín hữu
  rationale: Nguyên văn dùng danh từ số nhiều giống đực, nhưng cách dùng trong cộng đồng Cơ Đốc ban đầu có thể bao gồm cả cộng đồng tín hữu nói chung. Bản chính giữ hình thức nguồn, còn chú thích bảo tồn sắc thái bao quát có thể có.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “môn đồ” theo cách gọi quen thuộc trong văn mạch Kinh Thánh; “đồ cứu trợ” làm rõ ý trợ giúp thiết thực trong bối cảnh mà không quy định đó là tiền hay hiện vật.
