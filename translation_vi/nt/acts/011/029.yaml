revisions:
- from: Vì vậy, các môn đồ quyết định, mỗi người tùy theo khả năng của mình,[a] gửi đồ cứu trợ đến cho các anh em đang sống tại Giu-đê.[b]
  to: Vì vậy, các môn đồ quyết định rằng mỗi người, tùy theo khả năng của mình,[a] sẽ gửi sự trợ giúp cho các anh em đang sống ở Giu-đê.[b]
  rationale: Thay “đồ cứu trợ” bằng “sự trợ giúp” để không quy định hình thức của διακονία, và điều chỉnh cú pháp cho tiếng Việt tự nhiên, trong khi vẫn giữ ý từng môn đồ đóng góp/gửi trợ giúp theo khả năng của mình. Các chú thích và vị trí ký hiệu được giữ nguyên về nội dung và neo đúng vào các cụm được giải thích.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:17:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Bản dịch chuyển đạt đúng cấu trúc chủ đạo: các môn đồ đã quyết định, từng người tùy khả năng/phương tiện của mình, gửi sự hỗ trợ cho các anh em ở Giu-đê. Tuy nhiên, “đồ cứu trợ” giới hạn điều được gửi vào hiện vật, trong khi εἰς διακονίαν chỉ việc phục vụ/trợ giúp và không nêu rõ hình thức. Cấu trúc hiện tại với dấu phẩy sau “quyết định” cũng làm mệnh đề “mỗi người...” hơi lửng; thêm “rằng” và “sẽ” diễn đạt rõ quyết định chung dẫn đến hành động phân phối của từng người.'
  naturalness: “Các môn đồ” và “các anh em” phù hợp văn phong Kinh Thánh tiếng Việt tiêu chuẩn hiện đại. “Gửi sự trợ giúp cho” tự nhiên hơn “gửi đồ cứu trợ đến cho”, đồng thời tránh sự trùng ý của “đến cho”.
  terminology: Giữ “môn đồ” cho μαθηταί và “các anh em” cho ἀδελφοῖς. Chú thích giải thích phạm vi có thể bao gồm cộng đồng tín hữu là thích hợp, không áp đặt cách hiểu đó lên bản văn chính.
  issues:
