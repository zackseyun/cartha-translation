source:
  edition: SBLGNT
  text: εἶπον δέ· Μηδαμῶς, κύριε, ⸀ὅτι κοινὸν ἢ ἀκάθαρτον οὐδέποτε εἰσῆλθεν εἰς τὸ στόμα μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/008.yaml
  text: But I said, ‘By no means, Lord, because nothing common or unclean has ever entered my mouth.’
translation:
  language: vi
  text: 'Nhưng tôi thưa: “Không đời nào, lạy Chúa! Vì chưa từng có vật gì ô uế theo nghi lễ hay không thanh sạch vào miệng con.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: không thể được
  rationale: Diễn đạt lời khước từ mạnh mẽ, tự nhiên trong tiếng Việt, phù hợp ngữ cảnh.
- source_word: κύριε
  choice: Lạy Chúa
  rationale: Dạng xưng hô trực tiếp, trang trọng; giữ nguyên khả năng quy chiếu của κύριε trong lời thuật lại.
- source_word: κοινὸν
  choice: ô uế theo nghi lễ
  rationale: Trong ngữ cảnh luật thức ăn, κοινός không có nghĩa thông thường là 'chung' mà chỉ vật bị xem là không thanh sạch về mặt nghi lễ; cách dịch này phân biệt với ἀκάθαρτον.
- source_word: ἀκάθαρτον
  choice: không tinh sạch
  rationale: Giữ nghĩa 'unclean' và sự phân biệt từ vựng với κοινόν, dù hai khái niệm gần nhau trong ngữ cảnh.
- source_word: εἰσῆλθεν εἰς τὸ στόμα μου
  choice: vào miệng con
  rationale: Giữ hình ảnh cụ thể của nguyên văn, thay vì diễn giải thành 'con đã ăn'.
theological_decisions:
- issue: Quan hệ giữa κοινόν và ἀκάθαρτον
  choice: 'Giữ hai cách gọi phân biệt: “ô uế theo nghi lễ” và “không tinh sạch”'
  alternative: Gộp cả hai thành “ô uế” hoặc dịch κοινόν theo nghĩa đen là “thông thường”
  rationale: Nguyên văn dùng hai tính từ khác nhau; bản dịch nên bảo toàn cặp thuật ngữ mà không áp đặt một hệ thống giáo lý vượt quá văn cảnh.
- issue: Sắc thái của ὅτι
  choice: dịch là “vì”
  alternative: “bởi vì” hoặc không dịch rõ quan hệ nguyên nhân
  rationale: Ở đây ὅτι tự nhiên nhất là nêu lý do cho lời khước từ; “vì” rõ ràng và trang trọng vừa phải.
translation_notes:
  register: Văn phong kể chuyện trang trọng, hiện đại và dễ hiểu. Dùng “tôi thưa” trong mệnh đề dẫn rồi “con” khi trực tiếp thưa với Chúa, phù hợp phép xưng hô tiếng Việt.
