  terminology: “Ô uế theo nghi lễ” và “không thanh sạch” bảo tồn hai thuật ngữ κοινόν và ἀκάθαρτον mà không đồng nhất chúng. Dùng “vật” phù hợp với cách nói về thức ăn/vật dùng trong ngữ cảnh mà không diễn giải thành hành động ăn.
