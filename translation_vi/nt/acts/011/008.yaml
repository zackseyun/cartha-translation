  source_fidelity: Bản nháp truyền đạt đúng lời từ chối mạnh, lời xưng hô với κύριε, quan hệ nguyên nhân của ὅτι, và ý rằng chưa từng có vật như vậy vào miệng người nói. Tuy nhiên, “không thể được” dễ được hiểu là một điều bất khả thi hơn là lời cực lực phủ nhận của Μηδαμῶς.
