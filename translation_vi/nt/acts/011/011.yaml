  text: καὶ ἰδοὺ ἐξαυτῆς τρεῖς ἄνδρες ἐπέστησαν ἐπὶ τὴν οἰκίαν ἐν ᾗ ⸀ἦμεν, ἀπεσταλμένοι ἀπὸ Καισαρείας πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/011.yaml
  text: And behold[a], immediately three men arrived at the house where we were, having been sent to me from Caesarea.
translation:
  language: vi
  text: Và kìa, ngay lúc ấy[a], ba người đàn ông đến ngôi nhà nơi chúng tôi đang ở; họ đã được sai từ Sê-sa-rê đến gặp tôi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “lập tức” hoặc “ngay khi ấy”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: kìa
  rationale: Giữ chức năng diễn ngôn nhằm thu hút sự chú ý đến một diễn biến đáng kể, đồng thời tự nhiên và trang trọng trong văn kể chuyện Kinh Thánh.
- source_word: ἐξαυτῆς
  choice: ngay lúc ấy
  rationale: Diễn đạt sự việc xảy ra tức khắc và gắn chặt với thời điểm vừa được kể trước đó; tránh làm câu tiếng Việt nặng nề.
- source_word: τρεῖς ἄνδρες
  choice: ba người đàn ông
  rationale: Chuyển dịch trực tiếp số từ và danh từ chỉ nam giới, phù hợp với ngữ cảnh cụ thể.
- source_word: ἐπέστησαν
  choice: đến
  rationale: Trong ngữ cảnh này, động từ chỉ việc họ xuất hiện hoặc tới nơi; “đến” là cách nói tiếng Việt tự nhiên, rõ ràng.
- source_word: ἐπὶ τὴν οἰκίαν
  choice: đến nhà
  rationale: Kết hợp tự nhiên với động từ chỉ sự đến nơi và truyền đạt hướng tới địa điểm.
- source_word: ἐν ᾗ ἦμεν
  choice: nơi chúng tôi đang ở
  rationale: Giữ ý đơn giản về địa điểm, không thêm hàm ý rằng họ cư trú hay lưu lại lâu dài.
- source_word: ἀπεσταλμένοι
  choice: họ được sai
  rationale: Giữ thể bị động và việc sai phái xảy ra trước khi họ đến, nhưng chuyển thành mệnh đề để câu tiếng Việt sáng rõ.
- source_word: ἀπὸ Καισαρείας
  choice: từ Sê-sa-rê
  rationale: Diễn đạt nơi xuất phát và dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
- source_word: πρός με
  choice: đến gặp tôi
  rationale: Truyền đạt hướng đến Phi-e-rơ là người họ được sai tới; “gặp” làm quan hệ đích đến rõ ràng, tự nhiên trong tiếng Việt.
