  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Kìa” giữ nét sinh động của lời thuật; dấu chấm phẩy giúp thể hiện quan hệ giữa việc ba người đến và việc họ đã được sai đi.
