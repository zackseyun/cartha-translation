id: ACT.11.6
reference: Acts 11:6
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰς ἣν ἀτενίσας κατενόουν καὶ εἶδον τὰ τετράποδα τῆς γῆς καὶ τὰ θηρία καὶ τὰ ἑρπετὰ καὶ τὰ πετεινὰ τοῦ οὐρανοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/006.yaml
  text: As I looked intently into it[a], I was considering it, and I saw the four-footed animals of the earth, the wild beasts, the reptiles, and the birds of the sky.
translation:
  language: vi
  text: Tôi chăm chú nhìn vào đó, xem xét kỹ và thấy các loài vật bốn chân trên đất, các thú hoang, các loài bò sát[a] và các loài chim trời.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “các loài bò trên đất.” Cách dịch này giữ phạm vi rộng hơn của từ Hy Lạp và gợi lại cách phân loại sinh vật trong trình thuật sáng tạo cùng các luật về thanh sạch.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν
  choice: vào đó
  rationale: Cụm từ quy chiếu về vật giống như tấm vải trong khải tượng; đi với ἀτενίζω, giới từ εἰς diễn tả hướng nhìn vào bên trong vật ấy.
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Diễn đạt tự nhiên hành động tập trung ánh mắt, đồng thời giữ sắc thái của phân từ bất định quá khứ.
- source_word: κατενόουν
  choice: xem xét kỹ
  rationale: Động từ ở thì chưa hoàn thành diễn tả sự quan sát, suy xét đang tiếp diễn; cách dịch này phân biệt với hành động 'thấy' theo sau mà không lặp lại vụng về ý nhìn chăm chú.
- source_word: εἶδον
  choice: thì thấy
  rationale: Giữ ý nghĩa thị giác trực tiếp và làm rõ kết quả xảy ra sau khi người nói nhìn, xem xét.
- source_word: τὰ τετράποδα τῆς γῆς
  choice: các loài vật bốn chân trên đất
  rationale: Giữ nguyên lối phân loại cụ thể của tiếng Hy Lạp và âm hưởng liệt kê, bằng ngôn ngữ dễ hiểu trong tiếng Việt hiện đại.
- source_word: τὰ θηρία
  choice: các thú hoang
  rationale: Phân biệt nhóm động vật hoang dã với phạm trù vật bốn chân nói chung.
- source_word: τὰ ἑρπετὰ
  choice: các loài bò sát
  rationale: Là cách gọi tự nhiên và gọn trong tiếng Việt, nhưng có phạm vi hẹp hơn nghĩa 'những loài bò trên đất', nên ghi phương án rộng hơn trong chú thích.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: các loài chim trời
  rationale: Cách diễn đạt trang trọng, tự nhiên, chỉ các loài chim bay trong bầu trời và giữ cấu trúc phân loại của nguyên văn.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp liệt kê của nguyên văn; dùng “thì thấy” để nối tự nhiên chuỗi nhìn chăm chú—xem xét—thấy, đồng thời không xóa khác biệt thể động từ trong tiếng Hy Lạp.
