    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρξάμενος
  choice: bắt đầu
  rationale: Phân từ bất định trung của ἄρχω bổ nghĩa theo lối trạng ngữ cho động từ chính; “bắt đầu” diễn đạt tự nhiên sự chuyển sang phần giải trình của Phi-e-rơ.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu sự chuyển ý có sắc thái tương phản nhẹ giữa lời chất vấn trước đó và lời đáp của Phi-e-rơ.
- source_word: Πέτρος
  choice: Phi-e-rơ
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong tiếng Việt.
- source_word: ἐξετίθετο
  choice: trình bày sự việc
  rationale: Động từ ở thì chưa hoàn thành có nghĩa là trình bày hoặc giải thích một vấn đề; cách dịch này vừa tự nhiên vừa phù hợp với việc Phi-e-rơ thuật lại diễn biến.
- source_word: αὐτοῖς
  choice: cho họ
  rationale: Đại từ số nhiều ở cách cho chỉ những người đang chất vấn Phi-e-rơ.
- source_word: καθεξῆς
  choice: theo thứ tự
  rationale: Trạng từ nhấn mạnh việc kể lại tuần tự, có trật tự, chứ không nhất thiết mang nghĩa “từ đầu”.
- source_word: λέγων
  choice: rằng
  rationale: Phân từ hiện tại mở đầu nội dung lời nói; “rằng” nối tự nhiên với lời trực tiếp ở câu tiếp theo, dù “nói” sát hình thức Hy Lạp hơn.
