id: ACT.11.17
reference: Acts 11:17
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἰ οὖν τὴν ἴσην δωρεὰν ἔδωκεν αὐτοῖς ὁ θεὸς ὡς καὶ ἡμῖν πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν, ⸀ἐγὼ τίς ἤμην δυνατὸς κωλῦσαι τὸν θεόν;
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/017.yaml
  text: If then God gave to them the same gift as also to us who believed in the Lord Jesus the Messiah[b][a], who was I that I could hinder God?
translation:
  language: vi
  text: Vậy, nếu Đức Chúa Trời đã ban cho họ cùng một ân tứ như Ngài đã ban cho chúng ta là những người đã tin nơi Chúa Giê-su, Đấng Mê-si[a], thì tôi là ai mà có thể ngăn cản Đức Chúa Trời?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay “Đấng Christ”: tiếng Hy Lạp Χριστόν. Ở đây dịch là “Đấng Mê-si” vì từ này vẫn mang ý nghĩa của một tước hiệu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσην δωρεάν
  choice: cùng một ân tứ
  rationale: ἴσην diễn tả sự ngang bằng hoặc tương đồng; “cùng một ân tứ” tự nhiên trong tiếng Việt và làm rõ rằng người ngoại nhận ân tứ không khác với các tín hữu Do Thái.
- source_word: πιστεύσασιν ἐπὶ τὸν κύριον Ἰησοῦν Χριστόν
  choice: chúng ta là những người tin nơi Chúa Giê-su, Đấng Mê-si
  rationale: Phân từ bất định cách số nhiều phù hợp với ἡμῖν được giữ theo nghĩa mô tả, tránh ấn định quan hệ thời gian quá mức. “Tin nơi” diễn đạt đối tượng và hướng của đức tin do ἐπί với đối cách.
- source_word: κύριον
  choice: Chúa
  rationale: Trong lời tuyên xưng về Chúa Giê-su, κύριος là tước hiệu; “Chúa” là cách dịch trang trọng và quen thuộc.
- source_word: Χριστόν
  choice: Đấng Mê-si
  rationale: Χριστός vẫn có sức nặng của một tước hiệu tại đây. “Đấng Mê-si” giữ ý nghĩa ‘Đấng được xức dầu’ và tự nhiên trong tiếng Việt.
- source_word: ἐγὼ τίς ἤμην δυνατὸς
  choice: tôi là ai mà có thể
  rationale: Cách nói này giữ đại từ nhấn mạnh ἐγώ và sắc thái tự hạ của câu hỏi tu từ trước hành động của Đức Chúa Trời.
- source_word: κωλῦσαι
  choice: ngăn cản
  rationale: κωλύω có nghĩa ngăn trở, cản lại hoặc ngăn không cho xảy ra; “ngăn cản” nhận trực tiếp tân ngữ “Đức Chúa Trời” và tự nhiên trong tiếng Việt.
- source_word: τὸν θεόν
  choice: Đức Chúa Trời
  rationale: Đây là tân ngữ trực tiếp của κωλῦσαι. Cách dịch giữ nguyên lời diễn đạt mạnh mẽ rằng chống lại việc người ngoại nhận ân tứ là ngăn cản chính Đức Chúa Trời.
theological_decisions:
- issue: Cách dịch Χριστόν trong tước hiệu κύριον Ἰησοῦν Χριστόν
  choice: Đấng Mê-si
  alternative: Đấng Christ
  rationale: Ngữ cảnh vẫn cho thấy Χριστός là một tước hiệu có ý nghĩa chứ không chỉ là thành phần tên riêng. “Đấng Mê-si” bảo toàn sắc thái mong đợi về Đấng được xức dầu mà không đưa thêm lập trường hệ phái.
- issue: Quan hệ của phân từ πιστεύσασιν với ἡμῖν
  choice: 'nghĩa mô tả: “chúng ta là những người tin”'
  alternative: 'nghĩa thời gian: “khi chúng ta tin”'
  rationale: Phân từ phù hợp về cách và số với ἡμῖν nên có thể trực tiếp mô tả “chúng ta”. Bản dịch chính giữ cấu trúc này và không quyết định quá mức trình tự thần học; cách hiểu thời gian vẫn khả dĩ.
- issue: Cụm từ ngăn cản Đức Chúa Trời
  choice: giữ tân ngữ trực tiếp “Đức Chúa Trời”
  alternative: “chống lại ý muốn của Đức Chúa Trời”
  rationale: Nguyên văn đặt τὸν θεόν làm tân ngữ trực tiếp. Giữ cách nói gây ấn tượng mạnh này tránh diễn giải thêm thành “ý muốn” dù ý đó có thể được suy ra.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Vậy, nếu…” để nối kết lập luận; lặp “Đức Chúa Trời” thay vì thay hoàn toàn bằng đại từ nhằm giữ sức nặng của câu hỏi tu từ. Dấu chân chú [a] xuất hiện ngay sau thuật ngữ liên quan.
