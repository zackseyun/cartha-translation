  terminology: “Đức Chúa Trời,” “Chúa Giê-su,” “ân tứ,” và “Đấng Mê-si” nhất quán với ngữ vực Cơ Đốc giáo tiếng Việt. “Đấng Mê-si” chuyển tải Χριστόν như một tước hiệu; chú thích phương án “Đấng Christ” phù hợp.
