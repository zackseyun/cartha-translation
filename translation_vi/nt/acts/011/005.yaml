source:
  edition: SBLGNT
  text: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος καὶ εἶδον ἐν ἐκστάσει ὅραμα, καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ἀρχαῖς καθιεμένην ἐκ τοῦ οὐρανοῦ, καὶ ἦλθεν ἄχρι ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/005.yaml
  text: 'I was in the city of Joppa praying[a], and in a trance I saw a vision: something like a large sheet was coming down, being lowered from heaven by four corners[b], and it came to me.'
translation:
  language: vi
  text: 'Tôi đang cầu nguyện trong thành Giốp-bê thì trong trạng thái xuất thần, tôi thấy một khải tượng: một vật gì đó giống như tấm vải lớn đang hạ xuống, được thả xuống từ trời bằng bốn góc[a], và đến tận chỗ tôi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “được thả xuống từ trời ở bốn góc.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ ἤμην ἐν πόλει Ἰόππῃ προσευχόμενος
  choice: Tôi đang cầu nguyện trong thành Giốp-bê
  rationale: Diễn đạt tự nhiên hành động đang tiếp diễn, đồng thời giữ πόλει là “thành” và địa danh Ἰόππη theo dạng Việt hóa quen thuộc.
- source_word: ἐν ἐκστάσει ὅραμα
  choice: trong trạng thái xuất thần, tôi thấy một khải tượng
  rationale: Giữ riêng cả trạng thái ἔκστασις lẫn nội dung được thấy là ὅραμα, không đồng nhất hai khái niệm.
- source_word: σκεῦός τι
  choice: một vật gì đó
  rationale: σκεῦος có nghĩa rộng là vật dụng, đồ vật hoặc vật chứa; cách dịch này giữ tính bất định của τι mà không xác định quá mức.
- source_word: ὡς ὀθόνην μεγάλην
  choice: giống như tấm vải lớn
  rationale: ὀθόνη chỉ một tấm vải lớn; “tấm vải” tự nhiên và không thêm chất liệu mà tiếng Hy Lạp không nêu.
- source_word: καταβαῖνον ... καθιεμένην ἐκ τοῦ οὐρανοῦ
  choice: đang hạ xuống, được thả từ trời xuống
  rationale: Giữ cả chuyển động đi xuống và sắc thái bị động của καθιεμένην; “trời” phù hợp bối cảnh khải tượng.
- source_word: τέσσαρσιν ἀρχαῖς
  choice: bằng bốn góc
  rationale: Trong hình ảnh một tấm vải, ἀρχαί tự nhiên chỉ các đầu hoặc góc; không thêm đại từ sở hữu vốn không được nói rõ.
- source_word: ἦλθεν ἄχρι ἐμοῦ
  choice: đến tận chỗ tôi
  rationale: ἄχρι nhấn mạnh vật ấy đi xuống cho đến vị trí của Phi-e-rơ; cách dịch này rõ hơn “đến với tôi” trong tiếng Việt.
theological_decisions:
- issue: Thuật ngữ chỉ kinh nghiệm khải tượng
  choice: trong trạng thái xuất thần, tôi thấy một khải tượng
  alternative: trong cơn ngây ngất, tôi thấy một thị kiến
  rationale: “Xuất thần” diễn tả trạng thái ý thức đặc biệt trong trình thuật mà không nhấn mạnh cảm xúc sung sướng như “ngây ngất”; “khải tượng” giữ sắc thái mặc khải nhưng không giải thích thêm bản chất thần học của trải nghiệm.
- issue: Nguồn của vật được thả xuống
  choice: từ trời xuống
  alternative: từ bầu trời xuống
  rationale: Trong bối cảnh khải tượng của sách Công Vụ, οὐρανός có sắc thái thiên thượng; “trời” giữ được điều đó mà không buộc phải diễn giải chi tiết hơn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Cấu trúc được sắp xếp lại cho tự nhiên trong tiếng Việt nhưng vẫn giữ các yếu tố chính của câu Hy Lạp và sự phân biệt giữa trạng thái xuất thần với khải tượng.
