revisions:
- from: 'Tôi đang cầu nguyện trong thành Giốp-bê thì, trong trạng thái xuất thần, tôi thấy một khải tượng: một vật gì đó giống như tấm vải lớn đang hạ xuống, được thả từ trời xuống bằng bốn góc[a], và đến tận chỗ tôi.'
  to: 'Tôi đang cầu nguyện trong thành Giốp-bê thì trong trạng thái xuất thần, tôi thấy một khải tượng: một vật gì đó giống như tấm vải lớn đang hạ xuống, được thả xuống từ trời bằng bốn góc[a], và đến tận chỗ tôi.'
