    rationale: “được hội thánh ... nghe biết” không tự nhiên bằng “hội thánh ... đã nghe tin ấy”; đồng thời περὶ αὐτῶν (“về họ”) thuộc nội dung tin được nghe, không nằm trong cụm “vào tai hội thánh” của bản sát nghĩa.
