reference: Acts 11:22
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα τῆς ἐκκλησίας τῆς ⸀οὔσης ἐν ⸀Ἰερουσαλὴμ περὶ αὐτῶν, καὶ ἐξαπέστειλαν ⸀Βαρναβᾶν ἕως Ἀντιοχείας·
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/022.yaml
  text: The report about them reached the ears of the church in Jerusalem[a], and they sent out Barnabas as far as Antioch.
translation:
  language: vi
  text: Tin tức về họ đến tai hội thánh tại Giê-ru-sa-lem[a], và hội thánh sai Ba-na-ba đi đến tận An-ti-ốt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Hội thánh tại Giê-ru-sa-lem đã nghe tin tức về họ”; sát nghĩa: “Tin tức được nghe vào tai hội thánh tại Giê-ru-sa-lem về họ.”'
    reason: Nêu cách dịch gần với cấu trúc bị động và thành ngữ nguyên văn, trong khi chính văn dùng cách nói tự nhiên hơn trong tiếng Việt.
lexical_decisions:
- source_word: ἠκούσθη δὲ ὁ λόγος εἰς τὰ ὦτα
  choice: Tin tức ... đến tai
  rationale: Cụm Hy Lạp có nghĩa đen là “lời/tin được nghe vào tai”; cách nói “tin tức đến tai” vừa giữ hình ảnh của nguyên văn vừa tự nhiên trong tiếng Việt. δὲ được thể hiện qua mạch nối của câu, không thêm một trạng từ thời gian như “bấy giờ”.
- source_word: ὁ λόγος
  choice: Tin tức
  rationale: Trong ngữ cảnh này, λόγος chỉ tin tức về những người và sự việc vừa được kể tại An-ti-ốt, chứ không phải một bài diễn từ hay danh xưng thần học “Lời”.
- source_word: τῆς ἐκκλησίας τῆς οὔσης ἐν Ἰερουσαλήμ
  choice: hội thánh tại Giê-ru-sa-lem
  rationale: ἐκκλησία ở đây là cộng đồng tín hữu; cụm phân từ xác định hội thánh nào được nói đến và được diễn đạt gọn, tự nhiên trong tiếng Việt.
- source_word: περὶ αὐτῶν
  choice: về họ
  rationale: Đại từ số nhiều tự nhiên nhất quy chiếu đến những người vừa được nhắc trong văn cảnh; bản dịch không đổi thành “những việc ấy”, qua đó giữ nguyên khả năng quy chiếu của nguyên văn.
- source_word: καὶ ἐξαπέστειλαν
  choice: nên hội thánh sai
  rationale: καί nối việc nghe tin với hành động tiếp theo; “nên” diễn đạt quan hệ diễn tiến-hệ quả tự nhiên trong tiếng Việt. Chủ thể số nhiều hàm ẩn được nói rõ là “hội thánh”, theo tiền tố gần nhất, để tránh đại từ mơ hồ.
- source_word: Βαρναβᾶν
  choice: Ba-na-ba
  rationale: Dùng dạng phiên âm tên riêng quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: ἕως Ἀντιοχείας
  choice: đi đến tận An-ti-ốt
  rationale: “Đến tận” giữ sắc thái giới hạn/đích đến của ἕως rõ hơn chỉ nói “đến”, đồng thời tự nhiên trong câu kể tiếng Việt.
theological_decisions:
- issue: Chủ thể của động từ “sai”
  choice: Hội thánh tại Giê-ru-sa-lem xét như một cộng đồng
  alternative: Một nhóm lãnh đạo không được nêu rõ trong hội thánh, chẳng hạn các sứ đồ hoặc trưởng lão
  rationale: Tiền tố hiển nhiên gần nhất là “hội thánh tại Giê-ru-sa-lem”. Nguyên văn không chỉ đích danh các sứ đồ hay trưởng lão, nên bản dịch không đưa một cơ cấu lãnh đạo cụ thể vào câu.
- issue: Đối tượng được nói đến trong περὶ αὐτῶν
  choice: “về họ”, giữ đại từ chỉ người số nhiều
  alternative: “về những việc ấy”, hiểu đại từ là các biến cố
  rationale: Hình thái αὐτῶν cho phép việc quy chiếu được xác định bởi văn cảnh. “Họ” phản ánh trực tiếp cách nói của nguyên văn và không giải quyết quá mức phạm vi quy chiếu.
translation_notes:
  register: Văn phong hiện đại, trang trọng nhưng dễ hiểu. “Hội thánh” và các dạng tên riêng có gạch nối phù hợp lối dùng Kinh Thánh tiếng Việt. Dùng “đến tai” để bảo tồn hình ảnh Hy Lạp mà không tạo câu gượng; lặp lại “hội thánh” thay vì dùng “họ” nhằm tránh nhầm với “họ” trong cụm “về họ”.
