  source_fidelity: 'Chính văn phản ánh đúng các yếu tố chính: tin tức/lời được biết đến tại hội thánh ở Giê-ru-sa-lem, liên hệ “về họ”, việc phái Ba-na-ba, và đích/giới hạn là An-ti-ốt. Tuy nhiên, “nên” diễn giải liên từ καί thành một quan hệ hệ quả rõ rệt hơn nguyên văn, vốn chỉ nối hai sự việc bằng “và”.'
