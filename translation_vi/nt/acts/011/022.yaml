  terminology: “Hội thánh”, “Giê-ru-sa-lem”, “Ba-na-ba”, và “An-ti-ốt” nhất quán với lối dùng Kinh Thánh tiếng Việt. Chú thích nên dùng một diễn đạt bị động tự nhiên hơn và không cần lặp “về họ” trong phần sát nghĩa, vì nguyên văn đặt περὶ αὐτῶν sau cụm chỉ hội thánh.
