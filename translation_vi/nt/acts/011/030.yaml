base_translation:
  language: en
  yaml_path: translation/nt/acts/011/030.yaml
  text: And they did so[a], sending it to the elders by the hand of Barnabas and Saul.
translation:
  language: vi
  text: Họ đã làm như vậy, gửi khoản cứu trợ ấy đến các trưởng lão qua tay Ba-na-ba và Sau-lơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hay “nhờ Ba-na-ba và Sau-lơ”. Tiếng Hy Lạp nói theo nghĩa đen là “qua tay Ba-na-ba và Sau-lơ”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ καὶ ἐποίησαν
  choice: Họ đã làm như vậy
  rationale: Đại từ quan hệ giống trung ὃ chỉ trở lại việc quyên góp cứu trợ ở câu trước; cách nói “làm như vậy” diễn đạt tự nhiên trong tiếng Việt và giữ được tính súc tích của Hy Lạp.
- source_word: ἀποστείλαντες
  choice: gửi
  rationale: Phân từ bất định quá khứ nêu hành động qua đó họ thực hiện điều đã quyết định; “gửi” phù hợp với lối kể tự nhiên trong tiếng Việt.
- source_word: implicit object from context
  choice: số tiền ấy
  rationale: Tân ngữ không được nói rõ trong Hy Lạp nhưng được hiểu từ khoản cứu trợ quyên góp ở câu trước. Tiếng Việt cần làm rõ đối tượng được gửi; “số tiền ấy” tự nhiên mà không thêm ý ngoài ngữ cảnh.
- source_word: πρὸς τοὺς πρεσβυτέρους
  choice: đến các trưởng lão
  rationale: πρεσβύτεροι chỉ những người lãnh đạo được công nhận trong cộng đồng; “trưởng lão” là cách dịch quen thuộc, rõ nghĩa và không quá chuyên biệt.
- source_word: διὰ χειρὸς
  choice: qua tay
  rationale: Cụm từ Hy Lạp theo nghĩa đen là “qua/bởi tay”, diễn tả tác nhân trung gian. Thành ngữ “qua tay” vừa giữ hình ảnh nguyên ngữ vừa tự nhiên trong tiếng Việt.
- source_word: Βαρναβᾶ καὶ Σαύλου
  choice: Ba-na-ba và Sau-lơ
  rationale: Phiên âm tên riêng theo quy ước Kinh Thánh tiếng Việt phổ biến.
