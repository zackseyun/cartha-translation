  - severity: low
    issue: “rất nhiều người” hơi cường điệu ὄχλον ἱκανόν
    rationale: ἱκανός chỉ một số lượng đáng kể/khá đông, không nhất thiết là ‘rất nhiều’. “một số đông người” giữ mức độ mở và tự nhiên trong tiếng Việt.
