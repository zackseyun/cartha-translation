  verdict: revise
  source_fidelity: 'Bản dịch phản ánh đúng trình tự và các chủ thể được ngữ cảnh xác định: Ba-na-ba tìm thấy rồi đưa Sau-lơ đến An-ti-ốt; cả hai nhóm họp và giảng dạy trong suốt một năm; các môn đồ lần đầu được gọi là Cơ Đốc nhân. Tuy nhiên, “đưa ông về An-ti-ốt” thêm sắc thái ‘trở về’ không được động từ εἰς tự nó nêu rõ, và “rất nhiều người” mạnh hơn ὄχλον ἱκανόν (‘một đám đông/số người đáng kể’).'
