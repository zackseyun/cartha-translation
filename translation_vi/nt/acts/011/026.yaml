  terminology: “Hội thánh,” “môn đồ,” và “Cơ Đốc nhân” nhất quán với văn cảnh và phù hợp với tiếng Việt Kinh Thánh hiện đại. “Cơ Đốc nhân” là danh xưng từ vựng hóa thích hợp cho Χριστιανούς, không cần thay bằng một cách diễn giải danh xưng.
