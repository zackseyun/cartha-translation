  text: καὶ εὑρὼν ⸀ἤγαγεν εἰς Ἀντιόχειαν. ἐγένετο δὲ ⸂αὐτοῖς καὶ⸃ ἐνιαυτὸν ὅλον συναχθῆναι ⸀ἐν τῇ ἐκκλησίᾳ καὶ διδάξαι ὄχλον ἱκανόν, χρηματίσαι τε ⸀πρώτως ἐν Ἀντιοχείᾳ τοὺς μαθητὰς Χριστιανούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/026.yaml
  text: And when he found him, he brought him to Antioch. And for a whole year they met together with the church and taught a considerable crowd; and it was in Antioch that the disciples were first called Christians.
translation:
  language: vi
  text: Khi tìm được Sau-lơ, Ba-na-ba đưa ông đến An-ti-ốt. Suốt một năm, hai người nhóm họp với hội thánh[a] và dạy dỗ một số đông người; chính tại An-ti-ốt, các môn đồ lần đầu tiên được gọi là Cơ Đốc nhân[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “cùng nhóm họp trong hội thánh.” Từ “hội thánh” ở đây nói đến cộng đồng tín hữu, không nhất thiết là một tòa nhà.'
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn Hy Lạp nói các môn đồ “lần đầu tiên được gọi là Cơ Đốc nhân”; danh xưng này có lẽ bắt đầu được dùng công khai tại An-ti-ốt.
    reason: cultural_note
lexical_decisions:
- source_word: εὑρὼν
  choice: Khi tìm được Sau-lơ
  rationale: Phân từ bất định diễn tả hành động xảy ra trước động từ chính; chuyển thành mệnh đề thời gian tự nhiên trong tiếng Việt. Tên Sau-lơ được nêu rõ từ ngữ cảnh để tránh đại từ mơ hồ.
- source_word: ἤγαγεν εἰς Ἀντιόχειαν
  choice: Ba-na-ba đưa ông về An-ti-ốt
  rationale: ἄγω trong ngữ cảnh này mang nghĩa đưa Sau-lơ đến An-ti-ốt; nêu Ba-na-ba làm chủ thể giúp câu tiếng Việt rõ ràng và tự nhiên.
- source_word: ἐνιαυτὸν ὅλον
  choice: Suốt một năm
  rationale: Diễn đạt gọn và đúng giá trị thời gian của đối cách.
- source_word: συναχθῆναι ἐν τῇ ἐκκλησίᾳ
  choice: nhóm họp với hội thánh
  rationale: Giữ ý hai người cùng tụ họp với cộng đồng tín hữu, tránh khiến người đọc hiểu ἐκκλησία chủ yếu là một tòa nhà.
- source_word: ἐκκλησίᾳ
  choice: hội thánh
  rationale: Trong Công Vụ, từ này chỉ cộng đồng tín hữu; “hội thánh” là cách gọi quen thuộc, trang trọng trong tiếng Việt.
- source_word: διδάξαι ὄχλον ἱκανόν
  choice: dạy dỗ rất nhiều người
  rationale: ἱκανός ở đây chỉ số lượng đáng kể. Cách diễn đạt này tự nhiên hơn lối dịch sát “một đám đông đáng kể” mà vẫn giữ ý.
- source_word: χρηματίσαι
  choice: được gọi là
  rationale: Trong ngữ cảnh đặt tên hay định danh, động từ mang nghĩa được người ta gọi hoặc gán cho một danh xưng; thể bị động được giữ lại.
- source_word: πρώτως
  choice: lần đầu tiên
  rationale: Thể hiện rõ đây là lần xuất hiện đầu tiên của danh xưng.
- source_word: Χριστιανούς
  choice: Cơ Đốc nhân
  rationale: Đây là danh xưng đã được từ vựng hóa cho nhóm môn đồ, không chỉ là tước hiệu Χριστός; “Cơ Đốc nhân” là tương đương quen thuộc trong tiếng Việt.
theological_decisions:
- issue: Cách dịch danh xưng Χριστιανούς khi Χριστός có thể được dịch là “Đấng Mê-si-a” trong vai trò tước hiệu
  choice: Cơ Đốc nhân
  alternative: người thuộc Đấng Mê-si-a
  rationale: Χριστιανούς tại đây là danh xưng xã hội dành cho nhóm môn đồ. Dùng danh xưng tiếng Việt đã định hình giữ đúng chức năng của từ và tránh tạo ra một tên nhóm lạ hoặc mang sắc thái hệ phái.
- issue: Chủ thể hàm ẩn của các động từ trong nửa đầu câu
  choice: nêu rõ Ba-na-ba và gọi “hai người” ở câu sau
  alternative: giữ chuỗi đại từ “ông/người” theo sát hình thức Hy Lạp
  rationale: Ngữ cảnh xác định Ba-na-ba tìm thấy và đưa Sau-lơ về An-ti-ốt, rồi cả hai nhóm họp và giảng dạy. Nêu rõ chủ thể không thay đổi nội dung thần học nhưng ngăn sự nhập nhằng không tự nhiên trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “nhóm họp với hội thánh” để chỉ việc tụ họp cùng cộng đồng tín hữu; dùng “dạy dỗ rất nhiều người” thay cho cách dịch sát nhưng gượng. Dấu chấm phẩy làm nổi bật mệnh đề kết luận về danh xưng Cơ Đốc nhân.
