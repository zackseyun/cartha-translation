revisions:
- from: Một người trong số họ tên là A-ga-bút đứng dậy và nhờ Thánh Linh cho biết rằng một nạn đói lớn sắp xảy ra trên khắp thế giới có người sinh sống[a]—nạn đói ấy đã xảy ra vào thời Cơ-lốt.
  to: Một người trong số họ, tên là A-ga-bút, đứng dậy, nhờ Thánh Linh cho biết rằng một nạn đói lớn sắp xảy ra trên khắp thế giới có người ở[a]—nạn đói ấy đã xảy ra dưới thời Claudius.
  rationale: Sửa tên Claudius để phản ánh trực tiếp và dễ nhận diện tên riêng Hy Lạp trong tiếng Việt chuẩn hiện đại. Điều chỉnh nhẹ cách diễn đạt «thế giới có người ở» vì tự nhiên hơn mà không làm thay đổi nghĩa hay thu hẹp οἰκουμένη. Dấu phẩy làm sáng tỏ rằng việc A-ga-bút cho biết là nhờ Thánh Linh, phù hợp với διὰ τοῦ πνεύματος.
  reviewer_model: gpt-5.6-terra
