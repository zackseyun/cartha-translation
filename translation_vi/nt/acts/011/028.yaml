id: ACT.11.28
reference: Acts 11:28
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀναστὰς δὲ εἷς ἐξ αὐτῶν ὀνόματι Ἅγαβος ἐσήμανεν διὰ τοῦ πνεύματος λιμὸν ⸀μεγάλην μέλλειν ἔσεσθαι ἐφ’ ὅλην τὴν οἰκουμένην· ⸀ἥτις ἐγένετο ἐπὶ ⸀Κλαυδίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/028.yaml
  text: And one of them[a], named Agabus, stood up and indicated by the Spirit that a great famine was about to come over the whole inhabited world—which happened in the time of Claudius.
translation:
  language: vi
  text: Một người trong số họ, tên là A-ga-bút, đứng dậy, nhờ Thánh Linh cho biết rằng một nạn đói lớn sắp xảy ra trên khắp thế giới có người ở[a]—nạn đói ấy đã xảy ra dưới thời Claudius.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “toàn thế giới”; trong Lu-ca–Công Vụ, “thế giới có người ở” cũng có thể chỉ cụ thể hơn đến thế giới La Mã.
    reason: Nêu phương án từ vựng và giữ sự không xác định về phạm vi của οἰκουμένη.
lexical_decisions:
- source_word: ἀναστὰς
  choice: đứng dậy
  rationale: Diễn đạt tự nhiên hành động của A-ga-bút trong buổi nhóm, đồng thời giữ nghĩa cụ thể của động từ.
- source_word: ἐσήμανεν
  choice: cho biết
  rationale: Giữ nghĩa khái quát là báo hiệu hoặc làm cho biết, không áp đặt một công thức tiên tri cụ thể; nội dung theo sau vẫn thể hiện rõ tính tiên báo.
- source_word: διὰ τοῦ πνεύματος
  choice: nhờ Thánh Linh
  rationale: διά với sở hữu cách chỉ phương tiện hoặc tác nhân; ngữ cảnh tiên tri trong Công Vụ cho thấy đây là Thánh Linh.
- source_word: λιμὸν μεγάλην
  choice: một nạn đói lớn
  rationale: Dịch trực tiếp danh từ λιμός và tính từ μεγάλην, không diễn giải mạnh hơn thành “trầm trọng”.
- source_word: μέλλειν ἔσεσθαι
  choice: sắp xảy ra
  rationale: Thể hiện cả ý tương lai được báo trước lẫn sắc thái cận kề của μέλλω kết hợp với động từ nguyên mẫu.
- source_word: ἐφ’ ὅλην τὴν οἰκουμένην
  choice: trên khắp thế giới có người sinh sống
  rationale: Giữ nghĩa từ vựng của οἰκουμένη là thế giới có cư dân, không thu hẹp ngay trong chính văn thành Đế quốc La Mã.
- source_word: ἥτις
  choice: nạn đói ấy
  rationale: Lặp lại danh từ trong tiếng Việt giúp liên kết mệnh đề rõ ràng hơn đại từ “điều ấy”, mà không thêm nội dung.
- source_word: ἐγένετο
  choice: đã xảy ra
  rationale: Cách diễn đạt tiếng Việt hiện đại, rõ ràng cho sự việc đã diễn ra.
- source_word: ἐπὶ Κλαυδίου
  choice: vào thời Cơ-lốt
  rationale: Chuyển tải thành ngữ chỉ thời gian dưới một nhà cai trị mà không cần thêm từ “triều đại” vốn không có trực tiếp trong câu Hy Lạp.
theological_decisions:
- issue: Đối tượng được nói đến trong διὰ τοῦ πνεύματος
  choice: Thánh Linh
  alternative: linh hoặc sự soi dẫn thuộc linh theo nghĩa ít xác định hơn
  rationale: Trong các bối cảnh tiên tri của Công Vụ, “Thần/Linh” với mạo từ thường chỉ Thánh Linh; cách viết hoa phản ánh nhận định theo ngữ cảnh.
- issue: Phạm vi của οἰκουμένη
  choice: giữ nghĩa rộng là “thế giới có người sinh sống” trong chính văn
  alternative: toàn thế giới; toàn thế giới La Mã
  rationale: Từ này có thể chỉ thế giới có cư dân nói chung, nhưng trong Lu-ca–Công Vụ cũng có thể mang phạm vi thế giới thuộc La Mã. Chính văn không thu hẹp nghĩa; chú thích giữ lại khả năng theo ngữ cảnh.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “nhờ Thánh Linh” tự nhiên hơn lối dịch sát hình thức “qua Thánh Linh”; phiên âm tên riêng là A-ga-bút và Cơ-lốt. Dấu gạch ngang giúp mệnh đề xác nhận lịch sử nối rõ với lời báo trước.
