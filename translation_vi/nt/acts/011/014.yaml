id: ACT.11.14
reference: Acts 11:14
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς λαλήσει ῥήματα πρὸς σὲ ἐν οἷς σωθήσῃ σὺ καὶ πᾶς ὁ οἶκός σου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/014.yaml
  text: He will speak words to you by which you and all your household will be saved[a].
translation:
  language: vi
  text: Người ấy sẽ nói với ông những lời nhờ đó ông và cả gia đình ông sẽ được cứu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “trong đó” hoặc “qua đó”; cách diễn đạt Hy Lạp cho thấy những lời ấy là phương tiện qua đó sự cứu rỗi đến.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Người ấy
  rationale: Đại từ quan hệ chỉ lại nhân vật đã được nhắc đến; trong tiếng Việt, tách thành “Người ấy” giúp câu tự nhiên và rõ chủ thể.
- source_word: λαλήσει
  choice: sẽ nói
  rationale: Diễn đạt tự nhiên thì tương lai của λαλέω và phù hợp với việc truyền đạt một sứ điệp.
- source_word: ῥήματα
  choice: những lời
  rationale: Giữ danh từ số nhiều cụ thể của nguyên văn thay vì khái quát thành “sứ điệp”.
- source_word: πρὸς σὲ
  choice: với ông
  rationale: Trong tiếng Việt, “nói với ông” là cách diễn đạt tự nhiên cho hướng lời nói đến người nghe; “ông” phù hợp với cách xưng hô dành cho Cô-nê-li-út trong văn cảnh.
- source_word: ἐν οἷς
  choice: nhờ đó
  rationale: 'Thể hiện sắc thái phương tiện của ἐν: những lời được nói là phương tiện qua đó sự cứu rỗi đến, đồng thời vẫn để chú thích ghi nhận khả năng diễn đạt sát hình thức hơn.'
- source_word: σωθήσῃ
  choice: sẽ được cứu
  rationale: Giữ thể bị động và ý nghĩa cứu rỗi phù hợp với văn cảnh nghe Tin Mừng trong Công Vụ.
- source_word: σὺ
  choice: ông
  rationale: Đại từ chủ ngữ được giữ trong cụm phối hợp, phản ánh sự hiện diện nhấn mạnh của σὺ.
- source_word: πᾶς ὁ οἶκός σου
  choice: cả gia đình ông
  rationale: οἶκος ở đây chỉ đơn vị gia đình/hộ gia đình chứ không phải căn nhà; “cả gia đình ông” tự nhiên, dễ hiểu và giữ phạm vi toàn thể.
theological_decisions:
- issue: Ý nghĩa của sự cứu trong bối cảnh gia đình Cô-nê-li-út
  choice: Dịch σωθήσῃ là “sẽ được cứu”, để câu nói về sự cứu rỗi đến qua những lời được công bố mà không xác định thêm cơ chế thần học.
  alternative: sẽ được giải cứu
  rationale: Văn cảnh gần nói về việc nghe Tin Mừng và nhận sự cứu rỗi; “được cứu” giữ đúng sức nặng cứu độ học mà không đưa vào các công thức tín lý về cách từng thành viên dự phần.
- issue: Phạm vi của πᾶς ὁ οἶκός σου
  choice: Dịch là “cả gia đình ông”, giữ nguyên phạm vi tập thể được nêu trong câu.
  alternative: toàn thể gia quyến ông
  rationale: Câu Hy Lạp nói đến cả gia đình nhưng không tự giải thích mọi điều kiện về sự đáp ứng của từng người; bản dịch không hàm ý sự cứu tự động cũng không áp đặt cách hiểu hệ phái.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” theo văn cảnh giao tiếp với Cô-nê-li-út; “những lời” giữ hình thức số nhiều của nguyên văn, còn “cả gia đình ông” truyền đạt nghĩa tập thể của οἶκος một cách tự nhiên.
