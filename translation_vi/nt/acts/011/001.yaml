id: ACT.11.1
reference: Acts 11:1
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἤκουσαν δὲ οἱ ἀπόστολοι καὶ οἱ ἀδελφοὶ οἱ ὄντες κατὰ τὴν Ἰουδαίαν ὅτι καὶ τὰ ἔθνη ἐδέξαντο τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/001.yaml
  text: The apostles and the brothers who were throughout Judea heard that the Gentiles also had received the word of God[a].
translation:
  language: vi
  text: Các sứ đồ và anh em ở khắp miền Giu-đê nghe tin rằng các dân ngoại cũng đã tiếp nhận lời của Đức Chúa Trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “anh chị em”; tiếng Hy Lạp viết “anh em” và từ này có thể chỉ các tín hữu nói chung.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: nghe tin
  rationale: Động từ ἀκούω ở đây nói về việc nhận được một tin tức; “nghe tin” tự nhiên trong tiếng Việt và phù hợp với mệnh đề nội dung theo sau.
- source_word: δὲ
  choice: không dịch thành một từ riêng
  rationale: δέ đánh dấu bước chuyển nhẹ trong mạch kể, không biểu thị sự tương phản mạnh. Trật tự câu và sự chuyển sang chủ thể mới đã truyền đạt chức năng này tự nhiên trong tiếng Việt.
- source_word: οἱ ἀπόστολοι
  choice: các sứ đồ
  rationale: Đây là cách gọi quen thuộc và chính xác cho nhóm sứ đồ được nhìn nhận trong sách Công Vụ.
- source_word: οἱ ἀδελφοὶ
  choice: anh em
  rationale: Giữ hình thức giống đực số nhiều của tiếng Hy Lạp và cách xưng gọi cộng đồng quen thuộc; trong ngữ cảnh, từ này có thể bao gồm rộng hơn các tín hữu nam và nữ, nên có chú thích.
- source_word: οἱ ὄντες κατὰ τὴν Ἰουδαίαν
  choice: ở khắp miền Giu-đê
  rationale: κατά với đối cách mang sắc thái phân bố; “ở khắp miền” truyền đạt rằng họ hiện diện tại nhiều nơi trong Giu-đê.
- source_word: ὅτι
  choice: rằng
  rationale: Dẫn vào nội dung của điều họ nghe được.
- source_word: καὶ τὰ ἔθνη
  choice: các dân ngoại cũng
  rationale: Trong ngữ cảnh này, τὰ ἔθνη chỉ những người không thuộc dân Do Thái; “cũng” giữ nhấn mạnh bổ sung của καί.
- source_word: ἐδέξαντο
  choice: đã tiếp nhận
  rationale: δέχομαι có thể là nhận, đón nhận hoặc tiếp nhận. “Tiếp nhận” phù hợp với đối tượng là lời được công bố và không làm mất sắc thái đáp ứng tích cực.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: lời của Đức Chúa Trời
  rationale: Giữ thành ngữ Kinh Thánh chỉ sứ điệp đến từ Đức Chúa Trời, đồng thời tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Phạm vi chỉ người của ἀδελφοὶ trong cộng đồng tín hữu
  choice: anh em
  alternative: anh chị em; các tín hữu
  rationale: Bản dịch chính giữ hình thức giống đực của nguyên ngữ và cách gọi cộng đồng truyền thống, còn chú thích nêu rõ từ này có thể được dùng rộng hơn cho các tín hữu, tránh thu hẹp ý nghĩa chỉ còn nam giới.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Sứ đồ,” “dân ngoại” và “lời của Đức Chúa Trời” duy trì các thuật ngữ Kinh Thánh quen thuộc; “nghe tin” và “ở khắp miền” giúp câu tự nhiên trong tiếng Việt mà vẫn giữ cấu trúc và sắc thái của nguyên ngữ.
