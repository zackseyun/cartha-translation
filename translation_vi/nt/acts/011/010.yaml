  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸂ἀνεσπάσθη πάλιν⸃ ἅπαντα εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/010.yaml
  text: This happened three times[a], and everything was drawn up again into heaven.
translation:
  language: vi
  text: Việc ấy xảy ra ba lần, rồi tất cả lại được kéo lên trời.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “toàn bộ vật ấy lại được đưa lên trời.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Việc ấy
  rationale: Đại từ chỉ định quy chiếu về sự việc trong khải tượng vừa được kể; “việc ấy” tự nhiên trong tiếng Việt mà không thêm rõ “khải tượng,” điều không được nói trực tiếp ở đây.
- source_word: δὲ
  choice: rồi
  rationale: δέ là từ nối nhẹ trong mạch kể; “rồi” diễn đạt tự nhiên sự tiếp nối giữa biến cố lặp lại và việc mọi thứ được kéo lên.
- source_word: ἐγένετο
  choice: xảy ra
  rationale: Trong ngữ cảnh này, γίνομαι chỉ một sự việc diễn ra; “xảy ra” là cách nói hiện đại, rõ ràng.
- source_word: ἐπὶ τρίς
  choice: ba lần
  rationale: Thành ngữ diễn tả sự lặp lại ba lần; cách dịch này ngắn gọn và tự nhiên.
- source_word: ἀνεσπάσθη
  choice: được kéo lên
  rationale: Giữ thể bị động và sắc thái chuyển động hướng lên do một tác lực không được nêu rõ, đồng thời phù hợp với hình ảnh vật giống tấm vải ở văn cảnh.
- source_word: πάλιν
  choice: lại
  rationale: Diễn tả sự trở lại hoặc lặp lại một cách tự nhiên trong tiếng Việt.
- source_word: ἅπαντα
  choice: tất cả
  rationale: Dạng trung tính số nhiều có ý nghĩa bao quát nhưng không xác định riêng là tấm vải hay các con vật; “tất cả” giữ nguyên độ rộng của từ.
- source_word: εἰς τὸν οὐρανόν
  choice: lên trời
  rationale: “Lên trời” diễn đạt tự nhiên hướng chuyển động của εἰς trong bối cảnh khải tượng và vẫn giữ nghĩa “trời/thiên đàng” của οὐρανός.
theological_decisions:
- issue: Đối tượng được ἅπαντα chỉ đến trong lời thuật lại khải tượng của Phi-e-rơ
  choice: Dịch rộng là “tất cả,” không xác định đó là tấm vải hay các con vật.
  alternative: “toàn bộ vật ấy” hoặc “tất cả các con vật”
  rationale: Bản Hy Lạp mang tính bao quát nhưng không xác định hẹp đối tượng trong chính câu này; giữ cách diễn đạt rộng tránh đưa thêm một cách giải nghĩa vào bản văn.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Cấu trúc ngắn gọn theo nhịp kể chuyện; giữ thể bị động và không nêu tác nhân vốn không được nói rõ trong bản Hy Lạp.
