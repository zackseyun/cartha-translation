  terminology: “Trời” phù hợp với οὐρανόν trong bối cảnh khải tượng. “Tất cả” giữ sự bao quát và mơ hồ có chủ ý của ἅπαντα, không áp đặt rằng đối tượng chỉ là tấm vải hay chỉ là các con vật. Chú thích nêu một khả năng diễn đạt thay thế, không làm thay đổi nghĩa câu chính.
