  source_fidelity: “Việc ấy xảy ra ba lần, rồi tất cả lại được kéo lên trời” phản ánh đúng τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ἀνεσπάσθη πάλιν ἅπαντα εἰς τὸν οὐρανόν. Bản dịch giữ ý sự việc lặp lại ba lần, thể bị động của ἀνεσπάσθη, sắc thái lặp lại của πάλιν, và không thu hẹp quy chiếu rộng của ἅπαντα.
