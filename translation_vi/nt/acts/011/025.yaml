  text: Then he went out to Tarsus to look for Saul,[a]
translation:
  language: vi
  text: Rồi ông lên đường đến Tạt-sơ để tìm Sau-lơ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để tìm kiếm Sau-lơ” hoặc “để tìm cho ra Sau-lơ.”'
    reason: ἀναζητέω có thể mang sắc thái tìm kiếm hoặc tìm cho ra; chú thích giữ lại các mức độ nhấn mạnh có thể có của từ Hy Lạp.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: đi đến
  rationale: Động từ aorist ἐξέρχομαι có nghĩa sát là “đi ra”; trong tiếng Việt, khi đi với đích đến εἰς Ταρσόν, “đi đến” tự nhiên hơn và vẫn diễn đạt sự di chuyển khỏi nơi đang ở đến Tạt-sơ.
- source_word: δὲ
  choice: Rồi
  rationale: δέ là liên từ nhẹ, tiếp nối diễn tiến câu chuyện chứ không biểu thị sự tương phản rõ rệt; “Rồi” phù hợp với lối kể chuyện tự nhiên trong tiếng Việt.
- source_word: εἰς Ταρσόν
  choice: đến Tạt-sơ
  rationale: εἰς với động từ chuyển động chỉ đích đến. “Đến Tạt-sơ” là cách diễn đạt tự nhiên trong tiếng Việt; tên riêng được phiên âm theo lối quen dùng trong Kinh Thánh tiếng Việt.
- source_word: ἀναζητῆσαι
  choice: để tìm
  rationale: Động từ nguyên mẫu chỉ mục đích. “Để tìm” rõ ràng, tự nhiên và không mặc nhiên nhấn mạnh mức độ truy tìm như một số cách diễn đạt khác.
- source_word: Σαῦλον
  choice: Sau-lơ
  rationale: Tên riêng được phiên âm theo hình thức quen thuộc và dễ nhận biết trong truyền thống Kinh Thánh tiếng Việt.
theological_decisions: []
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” nối tự nhiên với nhân vật Ba-na-ba trong ngữ cảnh trước đó; dấu chú thích [a] được đặt ngay sau mệnh đề liên quan.
