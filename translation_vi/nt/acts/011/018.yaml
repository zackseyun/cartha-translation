id: ACT.11.18
reference: Acts 11:18
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ ταῦτα ἡσύχασαν καὶ ⸀ἐδόξασαν τὸν θεὸν λέγοντες· ⸀Ἄρα καὶ τοῖς ἔθνεσιν ὁ θεὸς τὴν μετάνοιαν ⸂εἰς ζωὴν ἔδωκεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/018.yaml
  text: When they heard these things[a], they became quiet and glorified God, saying[b], “Then God has also granted to the Gentiles the change of mind that leads to life.”
translation:
  language: vi
  text: 'Khi nghe những điều ấy, họ im lặng và tôn vinh Đức Chúa Trời, nói rằng: “Vậy thì Đức Chúa Trời cũng đã ban cho các dân ngoại[a] sự ăn năn dẫn đến sự sống[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nguyên văn có thể dịch là “các dân tộc”; tại đây từ Hy Lạp chỉ những người không phải Do Thái, nên dịch là “các dân ngoại”.
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “sự ăn năn hướng đến sự sống” hoặc “sự ăn năn để được sự sống”. Cụm Hy Lạp εἰς ζωήν có thể diễn tả đích hướng tới hoặc kết quả là sự sống.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες δὲ ταῦτα
  choice: Khi nghe những điều ấy
  rationale: Phân từ bất định quá khứ nêu hoàn cảnh xảy ra trước các động từ chính; cách dịch này tự nhiên trong tiếng Việt và giữ sắc thái thời gian. δέ là từ nối nhẹ nên được thể hiện qua mạch câu, không cần dịch riêng.
- source_word: ἡσύχασαν
  choice: họ im lặng
  rationale: Động từ chỉ việc ngừng lên tiếng hoặc thôi phản đối. “Im lặng” ngắn gọn, tự nhiên và không diễn giải quá mức động cơ của họ.
- source_word: ἐδόξασαν τὸν θεόν
  choice: tôn vinh Đức Chúa Trời
  rationale: Giữ ý nghĩa thần học thông dụng của δοξάζω trong Lu-ca–Công Vụ, trang trọng hơn nhưng vẫn tự nhiên trong tiếng Việt.
- source_word: λέγοντες
  choice: nói rằng
  rationale: Thể hiện trực tiếp phân từ hiện tại dùng để giới thiệu nội dung lời đáp.
- source_word: Ἄρα καὶ
  choice: Vậy thì ... cũng
  rationale: “Vậy thì” diễn đạt kết luận được rút ra từ lời tường thuật của Phi-e-rơ; “cũng” giữ trọng tâm về việc hành động của Đức Chúa Trời được mở rộng đến dân ngoại.
- source_word: τοῖς ἔθνεσιν
  choice: cho các dân ngoại
  rationale: Trong ngữ cảnh này, ἔθνεσιν chỉ những người không phải Do Thái, chứ không chủ yếu chỉ các quốc gia theo nghĩa địa chính trị.
- source_word: τὴν μετάνοιαν
  choice: sự ăn năn
  rationale: “Sự ăn năn” là cách diễn đạt tự nhiên và đã rõ nghĩa trong tiếng Việt Kinh Thánh, bao hàm sự đổi lòng và quay hướng; tránh thu hẹp từ này thành một thay đổi thuần lý trí.
- source_word: εἰς ζωὴν
  choice: dẫn đến sự sống
  rationale: Cụm εἰς ζωήν có thể nêu đích hướng tới hoặc kết quả; “dẫn đến sự sống” giữ được cả hướng đi lẫn kết quả mà không xác định quá mức.
- source_word: ἔδωκεν
  choice: đã ban
  rationale: Động từ bất định quá khứ trình bày hành động của Đức Chúa Trời như một việc đã xảy ra; “ban” giữ rõ sắc thái ân ban mà không thêm một hệ thống thần học ngoài câu.
theological_decisions:
- issue: Sự ăn năn là điều Đức Chúa Trời ban
  choice: Giữ cấu trúc “Đức Chúa Trời ... đã ban ... sự ăn năn”.
  alternative: Dịch theo cách chỉ nói Đức Chúa Trời cho phép dân ngoại ăn năn hoặc chỉ nói dân ngoại tự ăn năn.
  rationale: Bản Hy Lạp trực tiếp đặt Đức Chúa Trời làm chủ thể của ἔδωκεν và “sự ăn năn” làm bổ ngữ. Bản dịch giữ nguyên khẳng định ấy nhưng không suy rộng thành một lập trường giáo lý về quan hệ giữa hành động thần linh và đáp ứng của con người.
- issue: Quan hệ giữa sự ăn năn và sự sống
  choice: “sự ăn năn dẫn đến sự sống”
  alternative: “sự ăn năn để được sự sống” hoặc “sự ăn năn hướng đến sự sống”
  rationale: εἰς có thể biểu thị mục tiêu hoặc kết quả. “Dẫn đến” bảo tồn độ mở này tốt hơn cách diễn đạt xác quyết riêng mục đích hay phương tiện.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “Đức Chúa Trời”, “tôn vinh”, “dân ngoại” và “sự ăn năn” để duy trì ngôn ngữ Kinh Thánh quen thuộc mà không thêm cách diễn giải mang tính hệ phái. Dấu chú thích được đặt ngay sau các cụm từ mà chúng giải thích.
