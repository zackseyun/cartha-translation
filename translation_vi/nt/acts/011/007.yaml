  text: ἤκουσα δὲ ⸀καὶ φωνῆς λεγούσης μοι· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/007.yaml
  text: And I also heard a voice saying to me, ‘Get up, Peter; kill and eat.’
translation:
  language: vi
  text: 'Tôi cũng nghe một tiếng nói bảo tôi: “Phi-e-rơ, hãy đứng dậy, làm thịt rồi ăn đi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀναστάς
  choice: hãy đứng dậy
  rationale: Diễn đạt tự nhiên mệnh lệnh ‘đứng lên/đứng dậy’ trong tiếng Việt, phù hợp với ngữ cảnh Phi-e-rơ đang thấy khải tượng.
- source_word: θῦσον
  choice: làm thịt
  rationale: Động từ này có thể chỉ việc giết hoặc làm thịt con vật; ‘làm thịt’ giữ rõ đối tượng là các loài vật trong khải tượng và tránh khiến câu nghe như mệnh lệnh giết người.
- source_word: φάγε
  choice: ăn đi
  rationale: Truyền đạt mệnh lệnh trực tiếp, với ‘đi’ tạo sắc thái tự nhiên trong lời nói tiếng Việt.
- source_word: φωνῆς λεγούσης μοι
  choice: có tiếng phán với tôi
  rationale: ‘Tiếng phán’ là cách diễn đạt trang trọng, tự nhiên cho một tiếng nói từ trời, nhưng không bổ sung danh tính người phán.
- source_word: καὶ
  choice: cũng
  rationale: 'Giữ ý bổ sung của καὶ trong lời thuật lại: Phi-e-rơ không chỉ thấy mà cũng nghe.'
theological_decisions:
- issue: Danh tính của tiếng nói
  choice: không xác định chủ thể, dùng ‘có tiếng phán’
  alternative: ‘tôi nghe Chúa phán’
  rationale: Bản Hy Lạp chỉ nói ‘một tiếng/tiếng nói’ và không trực tiếp nêu danh tính; bản dịch không nên tự giải quyết điều văn bản để ngỏ.
- issue: Sắc thái của θῦσον
  choice: ‘làm thịt’ theo nghĩa giết con vật để ăn
  alternative: ‘giết’ hoặc ‘sát tế’
  rationale: Ngữ cảnh là các loài vật được đưa ra làm thức ăn. ‘Sát tế’ dễ nhập thêm sắc thái nghi lễ, còn ‘giết’ trong tiếng Việt có thể quá rộng hoặc gây hiểu lầm.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ lời dẫn ở ngôi thứ nhất cùng mệnh lệnh trực tiếp. Không cần chú thích vì các khác biệt từ vựng không tạo ra vấn đề văn bản hay thần học cần giải thích trong câu này.
