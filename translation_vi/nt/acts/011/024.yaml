revisions:
- from: Vì ông là một người tốt, đầy dẫy Đức Thánh Linh và đức tin.[a] Một đoàn người đông đảo đã được thêm vào với Chúa.
  to: Vì ông là một người tốt, đầy dẫy Đức Thánh Linh và đức tin.[a] Một đoàn người đông đảo đã được thêm vào cho Chúa.
  rationale: Chỉ sửa cách nối ở vế cuối để loại bỏ sự gượng và mơ hồ của “thêm vào với Chúa”. Bản sửa vẫn giữ thể bị động của προσετέθη, quy mô đáng kể của ὄχλος ἱκανός, và đối tượng được nêu trong nguyên văn là Chúa, thay vì thêm “hội thánh” hoặc “cộng đồng”.
