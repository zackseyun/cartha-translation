id: ACT.11.24
reference: Acts 11:24
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὅτι ἦν ἀνὴρ ἀγαθὸς καὶ πλήρης πνεύματος ἁγίου καὶ πίστεως. καὶ προσετέθη ὄχλος ἱκανὸς τῷ κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/024.yaml
  text: For he was a good man[a], full of the Holy Spirit and of faith. And a considerable crowd was added to the Lord.
translation:
  language: vi
  text: Vì ông là một người tốt, đầy dẫy Đức Thánh Linh và đức tin.[a] Một đoàn người đông đảo đã được thêm vào cho Chúa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “sự trung tín.” Từ Hy Lạp pistis có thể mang nghĩa “đức tin”, “lòng tin cậy” hoặc “sự trung tín”; bản chính dùng cách dịch thông thường là “đức tin”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Vì
  rationale: Giữ chức năng giải thích nguyên nhân cho lời nhận định về Ba-na-ba trong câu trước.
- source_word: ἀνὴρ ἀγαθὸς
  choice: một người tốt
  rationale: Diễn đạt trực tiếp phẩm chất đạo đức của Ba-na-ba bằng tiếng Việt tự nhiên, không thêm sắc thái chuyên biệt như “ngay thẳng” hay “nhân hậu”.
- source_word: πλήρης πνεύματος ἁγίου
  choice: đầy dẫy Đức Thánh Linh
  rationale: “Đầy dẫy” là cách nói trang trọng, quen thuộc và tự nhiên trong ngữ cảnh Kinh Thánh; “Đức Thánh Linh” chỉ Thánh Linh của Đức Chúa Trời, phù hợp cách dùng nhất quán trong Lu-ca–Công Vụ.
- source_word: πίστεως
  choice: đức tin
  rationale: “Đức tin” là nghĩa mặc định phù hợp trong ngữ cảnh, nhưng khả năng mang nghĩa “sự trung tín” được giữ trong chú thích.
- source_word: προσετέθη
  choice: đã được thêm vào
  rationale: Giữ thể bị động và hình ảnh nguyên văn, không tự ý đổi thành “gia nhập” hoặc xác định tác nhân.
- source_word: ὄχλος ἱκανὸς
  choice: một đoàn người đông đảo
  rationale: Truyền đạt số lượng đáng kể của ὄχλος ἱκανός bằng cách nói hiện đại và tự nhiên hơn “một đám đông đáng kể”.
- source_word: τῷ κυρίῳ
  choice: vào với Chúa
  rationale: Giữ Chúa là đích điểm của việc được thêm vào, thay vì thay bằng hội thánh; “thêm vào với” thể hiện thành ngữ Hy Lạp trong tiếng Việt dễ hiểu.
theological_decisions:
- issue: Ý nghĩa của πνεύματος ἁγίου
  choice: Đức Thánh Linh, tức Thánh Linh thần linh có ngôi vị
  alternative: một linh thánh hoặc tâm tính thánh thiện
  rationale: Trong Lu-ca–Công Vụ, cụm từ này nhất quán chỉ Đức Thánh Linh; ngữ cảnh nói về đời sống được Thánh Linh ban năng lực của Ba-na-ba.
- issue: Sắc thái của πίστεως khi mô tả Ba-na-ba
  choice: đức tin
  alternative: sự trung tín
  rationale: Cả lòng tin cậy và phẩm chất trung tín đều có thể được hàm ý. Bản chính dùng nghĩa thông thường “đức tin”, còn chú thích bảo tồn khả năng kia.
- issue: Đích điểm của προσετέθη ... τῷ κυρίῳ
  choice: người ta được thêm vào với Chúa
  alternative: người ta gia nhập hội thánh hoặc cộng đồng
  rationale: Nguyên văn nêu rõ “Chúa”, dù việc gia nhập cộng đồng tín hữu có thể được hàm ý; bản dịch không thay đối tượng được nói rõ bằng một diễn giải giáo hội học.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “ông” để chỉ Ba-na-ba theo mạch văn; viết hoa “Đức Thánh Linh” và “Chúa” theo quy ước tiếng Việt. Dấu chú thích [a] đặt ngay sau cụm từ mà chú thích giải thích.
