translation:
  language: vi
  text: 'họ nói[a]: “Ông đã vào chỗ những người đàn ông không cắt bì và ăn cùng họ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “đến với những người đàn ông không cắt bì.” Cụm từ này chỉ những người không mang dấu hiệu cắt bì của giao ước Do Thái, tức là dân ngoại.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: họ nói
  rationale: Phân từ hiện tại nối với ngữ cảnh trước; tiếng Việt cần nêu chủ ngữ để câu tự nhiên, trong khi vẫn giữ chức năng dẫn lời buộc tội.
- source_word: ὅτι
  choice: dấu hai chấm và lời trích dẫn trực tiếp
  rationale: ὅτι mở đầu lời nói trực tiếp; cách trình bày bằng dấu hai chấm và ngoặc kép là tự nhiên trong tiếng Việt.
- source_word: Εἰσῆλθες πρὸς
  choice: Ông đã vào nhà
  rationale: Động từ chỉ hành động đi vào, còn πρός với người chỉ sự đến gần hoặc giao tiếp. Trong bối cảnh lời cáo buộc về việc vào nơi ở và ăn chung, “vào nhà” diễn đạt tự nhiên mà không làm mất trọng tâm.
- source_word: ἄνδρας
  choice: những người
  rationale: ἀνήρ về mặt từ vựng chỉ những người nam; tuy nhiên, trong tiếng Việt, “những người không chịu cắt bì” tự nhiên và vẫn tất yếu quy chiếu đến nam giới do chính nghi thức cắt bì.
- source_word: ἀκροβυστίαν ἔχοντας
  choice: không chịu cắt bì
  rationale: Giữ nguyên cách gọi dựa trên dấu hiệu giao ước, thay vì diễn giải thành “dân ngoại”; cấu trúc tiếng Việt rõ ràng và mang được sắc thái phân ranh giới trong lời cáo buộc.
- source_word: καὶ συνέφαγες αὐτοῖς
  choice: và ăn chung với họ
  rationale: συνεσθίω nhấn mạnh việc cùng ăn; “ăn chung với họ” là cách nói trực tiếp, tự nhiên và giữ sắc thái giao tiếp xã hội.
theological_decisions:
- issue: Có nên diễn giải ἀκροβυστίαν ἔχοντας thành “dân ngoại” hay giữ cách gọi theo phép cắt bì
  choice: những người không chịu cắt bì
  alternative: dân ngoại
  rationale: Lời phản đối được diễn đạt cụ thể theo dấu hiệu giao ước và ranh giới thanh sạch. Giữ hình ảnh cắt bì bảo toàn sức nặng xã hội-thần học của lời buộc tội, thay vì chỉ nêu căn tính dân tộc.
- issue: Mức độ cụ thể của Εἰσῆλθες πρὸς ἄνδρας
  choice: vào nhà những người
  alternative: đến với những người
  rationale: “Vào nhà” phù hợp với hành động đi vào không gian của họ và dẫn đến việc ăn chung; đồng thời tránh cách nói “đến với” dễ mơ hồ trong tiếng Việt hiện đại.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “ông” trong lời chất vấn để thể hiện cách xưng hô tự nhiên giữa những người trưởng thành; giữ “không chịu cắt bì” nhằm bảo toàn ngôn ngữ phân ranh giới của nguyên văn.
