  to: 'họ nói[a]: “Ông đã vào chỗ những người đàn ông không cắt bì và ăn cùng họ.”'
  rationale: Loại bỏ ý “nhà” không được nêu trong bản Hy Lạp; thay “không chịu cắt bì” bằng “không cắt bì” để không hàm ý họ khước từ nghi thức; và phục hồi ý nghĩa giống đực của ἄνδρας. Giữ lời trích trực tiếp, đại từ “Ông”, và từ ngữ về cắt bì để bảo toàn giọng điệu buộc tội cùng ranh giới giao ước của nguyên văn.
