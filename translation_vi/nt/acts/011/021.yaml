id: ACT.11.21
reference: Acts 11:21
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ ἦν χεὶρ κυρίου μετ’ αὐτῶν, πολύς τε ἀριθμὸς ⸀ὁ πιστεύσας ἐπέστρεψεν ἐπὶ τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/021.yaml
  text: And the hand of the Lord was with them[b][a], and a great number who believed turned to the Lord.
translation:
  language: vi
  text: Tay Chúa ở cùng họ,[a] và rất nhiều người đã tin và quay về với Chúa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tay Chúa” là cách nói hình ảnh trong Kinh Thánh, chỉ quyền năng đang hành động hoặc sự phù trợ của Chúa.
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “sau khi tin, đã quay về với Chúa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χεὶρ κυρίου
  choice: Tay Chúa
  rationale: Giữ nguyên hình ảnh ẩn dụ quen thuộc trong Kinh Thánh, chỉ quyền năng hoặc sự phù trợ đang hành động của Chúa; cấu trúc sở hữu này tự nhiên trong tiếng Việt.
- source_word: κύριος
  choice: Chúa
  rationale: Danh xưng chuẩn và trang trọng trong ngữ cảnh Kinh Thánh; không tự ý xác định rõ là Đức Chúa Trời hay Chúa Giê-su khi nguyên văn chỉ nói κύριος.
- source_word: μετ’ αὐτῶν
  choice: ở cùng họ
  rationale: Diễn đạt tự nhiên ý về sự hiện diện và phù trợ của Chúa đi cùng những người rao giảng.
- source_word: πολύς τε ἀριθμός
  choice: rất nhiều người
  rationale: Chuyển cấu trúc chỉ số lượng sang cách nói tiếng Việt tự nhiên mà vẫn giữ ý một số đông.
- source_word: ὁ πιστεύσας
  choice: đã tin
  rationale: Phân từ bất định quá khứ có mạo từ chỉ tập thể những người tin; đặt trước hành động quay về có thể gợi quan hệ thời gian nhưng không buộc phải xác định cứng quan hệ nhân quả.
- source_word: ἐπέστρεψεν ἐπὶ τὸν κύριον
  choice: quay về với Chúa
  rationale: Giữ hình ảnh hướng về Chúa và ý nghĩa hoán cải, nhưng không thêm rõ khái niệm ăn năn vốn không xuất hiện trực tiếp trong câu.
theological_decisions:
- issue: Đối tượng được gọi là κύριος
  choice: Dịch cả hai lần là “Chúa” mà không thêm “Chúa Giê-su” hay “Đức Chúa Trời”.
  alternative: Hiểu rõ là Chúa Giê-su, hoặc hiểu rộng là Đức Chúa Trời.
  rationale: Ngữ cảnh Công Vụ có thể hướng đến Chúa Giê-su, nhất là khi nói về việc tin và quay về, nhưng nguyên văn vẫn để danh xưng κύριος không được định danh; bản dịch bảo toàn độ mở ấy.
- issue: Quan hệ giữa “tin” và “quay về”
  choice: Dịch “đã tin và quay về”, đồng thời chú thích khả năng hiểu “sau khi tin”.
  alternative: Dịch dứt khoát “sau khi tin, đã quay về” hoặc xem hai động tác là hoàn toàn đồng thời.
  rationale: Phân từ aorist πιστεύσας có thể chỉ hành động đi trước động từ chính, nhưng trong ngữ cảnh này cũng có thể mô tả đặc điểm của số đông; không nên ép câu thành một trình tự thần học cứng nhắc.
translation_notes:
  register: Tiếng Việt hiện đại, trang trọng và dễ hiểu. Giữ ẩn dụ “Tay Chúa” để bảo toàn âm hưởng liên văn bản; dùng “rất nhiều người” thay cho lối danh hóa nặng nề. Các dấu chú thích [a], [b] đều xuất hiện trong câu chính.
