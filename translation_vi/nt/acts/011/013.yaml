reference: Acts 11:13
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἀπήγγειλεν ⸀δὲ ἡμῖν πῶς εἶδεν τὸν ἄγγελον ἐν τῷ οἴκῳ αὐτοῦ σταθέντα καὶ ⸀εἰπόντα· Ἀπόστειλον εἰς ⸀Ἰόππην καὶ μετάπεμψαι Σίμωνα τὸν ἐπικαλούμενον Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/013.yaml
  text: And he reported to us how he had seen the angel standing in his house and saying[a], ‘Send to Joppa and summon Simon, who is called Peter.’
translation:
  language: vi
  text: 'Ông thuật lại cho chúng tôi thế nào ông đã thấy thiên sứ đứng trong nhà mình và nói: “Hãy sai người đến Giốp-bê và mời[a] Si-môn, người được gọi là Phi-e-rơ, đến.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “cho gọi” hoặc “gọi đến”.
    reason: μετάπεμψαι có nghĩa là sai người đi gọi một người đến; “mời” là cách diễn đạt tự nhiên trong ngữ cảnh này.
lexical_decisions:
- source_word: ἀπήγγειλεν
  choice: thuật lại
  rationale: Diễn đạt hành động kể lại hoặc báo lại một sự việc đã xảy ra, phù hợp với văn mạch tường thuật.
- source_word: δὲ
  choice: không dịch thành một từ nối riêng
  rationale: δέ là liên từ chuyển tiếp nhẹ; trong tiếng Việt, mạch kể đã tự nhiên nên không cần thêm “và” hoặc “bấy giờ”.
- source_word: πῶς
  choice: việc mình đã thấy
  rationale: Cấu trúc này giới thiệu nội dung được thuật lại một cách tự nhiên trong tiếng Việt, đồng thời không biến πῶς thành một mệnh đề chỉ cách thức quá nặng nề.
- source_word: εἶδεν
  choice: đã thấy
  rationale: “Đã” cho thấy việc nhìn thấy xảy ra trước lúc người ấy thuật lại.
- source_word: τὸν ἄγγελον
  choice: vị thiên sứ
  rationale: “Vị” tạo sắc thái xác định và tôn trọng tự nhiên trong tiếng Việt; “thiên sứ” là cách gọi rõ ràng, phổ thông cho ἄγγελος trong ngữ cảnh này.
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: trong nhà
  rationale: Ngữ cảnh và đại từ phản thân “mình” ở trước đã xác định đây là nhà của người thuật chuyện; tránh lặp “nhà mình” gây nặng câu.
- source_word: σταθέντα
  choice: đứng
  rationale: Diễn đạt tự nhiên tư thế hoặc sự hiện diện của thiên sứ, không ép sắc thái phân từ thành “đã đứng”.
- source_word: εἰπόντα
  choice: và nói
  rationale: Chuyển phân từ phối hợp thành động từ nối bằng “và” là tự nhiên trong tiếng Việt và vẫn giữ quan hệ với “thiên sứ”.
- source_word: Ἀπόστειλον
  choice: Hãy sai người
  rationale: Động từ mệnh lệnh đòi hỏi việc phái người đi; thêm “người” làm rõ tân ngữ ngầm cần thiết trong tiếng Việt mà không xác định số lượng hay danh tính.
- source_word: εἰς Ἰόππην
  choice: đến Giốp-bê
  rationale: Diễn đạt đích đến của hành động sai phái; “Giốp-bê” là dạng phiên âm tiếng Việt quen dùng của địa danh Ἰόππη.
- source_word: μετάπεμψαι
  choice: mời … đến
  rationale: Truyền đạt ý sai người đi mời một người đến, tự nhiên hơn “triệu tập” trong văn cảnh này; chú thích giữ lại khả năng dịch sát là “cho gọi”.
- source_word: Σίμωνα τὸν ἐπικαλούμενον Πέτρον
  choice: Si-môn, người được gọi là Phi-e-rơ
  rationale: 'Giữ chức năng định danh của phân từ bị động: Si-môn là người mang tên gọi Phi-e-rơ.'
theological_decisions: []
translation_notes:
  register: Văn phong tường thuật trang trọng nhưng hiện đại. Câu trực tiếp dùng lối mệnh lệnh tự nhiên; tên riêng được phiên âm theo cách dùng Kinh Thánh tiếng Việt phổ biến. Dấu chú thích [a] được đặt ngay sau từ ngữ mà chú thích giải thích.
