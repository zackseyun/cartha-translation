  - severity: low
    issue: “người nam”
    rationale: Cách nói này hơi gượng trong tiếng Việt hiện đại. “Những người đàn ông” vẫn phản ánh ἄνδρες là nam giới trưởng thành nhưng tự nhiên hơn.
