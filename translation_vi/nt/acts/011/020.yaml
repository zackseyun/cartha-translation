id: ACT.11.20
reference: Acts 11:20
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἦσαν δέ τινες ἐξ αὐτῶν ἄνδρες Κύπριοι καὶ Κυρηναῖοι, οἵτινες ⸀ἐλθόντες εἰς Ἀντιόχειαν ἐλάλουν ⸀καὶ πρὸς τοὺς ⸀Ἑλληνιστάς, εὐαγγελιζόμενοι τὸν κύριον Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/020.yaml
  text: But some of them were men from Cyprus and Cyrene[a], who, when they came to Antioch, were also speaking to the Hellenists, proclaiming the good news about the Lord Jesus.
translation:
  language: vi
  text: Nhưng trong số họ có một số người đàn ông quê ở đảo Síp và thành Sy-rê-nê; khi đến An-ti-ốt, họ cũng nói với những người Do Thái nói tiếng Hy Lạp,[a] rao truyền tin mừng về Chúa Giê-su.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Một số bản chép tay ghi “những người Hy Lạp” thay vì “những người Do Thái nói tiếng Hy Lạp”. Nếu cách đọc ấy là nguyên thủy, câu này có nghĩa là họ đang nói với dân ngoại, chứ không chỉ với người Do Thái nói tiếng Hy Lạp.
    reason: textual_variant
lexical_decisions:
- source_word: τινες
  choice: vài người
  rationale: Chỉ một nhóm không xác định trong số những người đã được nhắc đến; “vài người” tự nhiên trong tiếng Việt hiện đại.
- source_word: ἄνδρες
  choice: người nam
  rationale: Danh từ Hy Lạp chỉ rõ những người trưởng thành thuộc giới nam; cách dịch này giữ được nét nghĩa giới tính của nguyên bản.
- source_word: Κύπριοι καὶ Κυρηναῖοι
  choice: quê ở đảo Síp và thành Sy-rê-nê
  rationale: Các tính từ chỉ xuất xứ; diễn đạt bằng “quê ở” tự nhiên hơn trong tiếng Việt và thêm loại địa danh để người đọc dễ nhận biết.
- source_word: οἵτινες
  choice: họ
  rationale: Mệnh đề quan hệ Hy Lạp được tách thành câu mới để tiếng Việt sáng rõ, nhưng vẫn giữ nguyên chủ thể là những người nam vừa nhắc.
- source_word: ἐλθόντες εἰς Ἀντιόχειαν
  choice: Khi đến An-ti-ốt
  rationale: Phân từ aorist có giá trị thời gian trong ngữ cảnh, được chuyển thành mệnh đề “khi” tự nhiên.
- source_word: ἐλάλουν
  choice: nói
  rationale: Động từ imperfect chỉ hoạt động đang diễn ra hoặc lặp lại; trong kết cấu “khi đến... họ cũng nói”, tiếng Việt không cần dấu hiệu hình thái riêng mà vẫn diễn đạt tự nhiên.
- source_word: καὶ
  choice: cũng
  rationale: Nêu sự mở rộng thêm đối tượng họ nói với, tiếp nối hoạt động rao truyền đã được kể ở câu trước.
- source_word: πρὸς τοὺς Ἑλληνιστάς
  choice: với những người Do Thái nói tiếng Hy Lạp
  rationale: Ἑλληνισταί thường chỉ người Do Thái nói tiếng Hy Lạp. Dịch rõ nghĩa thay vì vay mượn thuật ngữ khó hiểu; dị bản “người Hy Lạp” được giữ trong chú thích.
- source_word: εὐαγγελιζόμενοι
  choice: rao truyền tin mừng về
  rationale: Diễn đạt hành động công bố tin mừng bằng ngôn ngữ phổ thông, đồng thời cho thấy nội dung lời họ nói.
- source_word: τὸν κύριον Ἰησοῦν
  choice: Chúa Giê-su
  rationale: Giữ tước hiệu Cơ Đốc học κύριος bằng “Chúa”, là cách gọi tự nhiên và trang trọng trong tiếng Việt.
theological_decisions:
- issue: Căn tính của τοὺς Ἑλληνιστάς và dị bản Ἕλληνας
  choice: Theo SBLGNT, bản văn chính dịch là “những người Do Thái nói tiếng Hy Lạp”; chú thích bảo lưu dị bản “người Hy Lạp”.
  alternative: Dịch “những người Hy Lạp”, hàm ý dân ngoại.
  rationale: Đây là khác biệt văn bản có ý nghĩa đối với tiến trình Tin Mừng đến với dân ngoại. Bản dịch theo văn bản nguồn được cung cấp nhưng không âm thầm loại bỏ cách đọc quan trọng khác.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Tên địa danh được phiên âm quen thuộc, có thêm “đảo” và “thành” để làm rõ. Mệnh đề dài của tiếng Hy Lạp được tách thành hai câu tiếng Việt nhằm tăng độ sáng rõ mà không thay đổi quan hệ ý nghĩa.
