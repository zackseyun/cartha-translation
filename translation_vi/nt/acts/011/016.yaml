language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐμνήσθην δὲ τοῦ ῥήματος ⸀τοῦ κυρίου ὡς ἔλεγεν· Ἰωάννης μὲν ἐβάπτισεν ὕδατι, ὑμεῖς δὲ βαπτισθήσεσθε ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/016.yaml
  text: Then I remembered the word of the Lord[a], how he said, ‘John baptized with water, but you will be baptized in the Holy Spirit.’
translation:
  language: vi
  text: 'Rồi tôi nhớ lại lời Chúa, Ngài đã phán rằng: “Giăng đã làm phép báp-têm bằng nước, còn anh em sẽ được báp-têm trong Đức Thánh Linh[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “bằng Đức Thánh Linh.” Giới từ Hy Lạp có thể được hiểu theo nghĩa “trong” hoặc “bằng.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθην
  choice: tôi nhớ lại
  rationale: Động từ aorist dạng thụ động/deponent có nghĩa chủ động trong ngữ cảnh; “nhớ lại” tự nhiên và diễn tả việc lời ấy trở lại trong trí Phi-e-rơ.
- source_word: δὲ
  choice: Bấy giờ
  rationale: Ở đây δέ đánh dấu bước phát triển nhẹ trong lời kể, không nhất thiết biểu thị sự tương phản mạnh.
- source_word: τοῦ ῥήματος τοῦ κυρίου
  choice: lời Chúa
  rationale: ῥῆμα chỉ lời đã được nói; cách nói “lời Chúa” ngắn gọn, tự nhiên và giữ được thẩm quyền của κύριος.
- source_word: ὡς ἔλεγεν
  choice: đã phán
  rationale: Thì chưa hoàn thành gợi lại lời Chúa nói; tiếng Việt không cần diễn đạt như một hành động lặp lại. “Phán” phù hợp với lời trực tiếp có thẩm quyền của Chúa trong văn phong Kinh Thánh trang trọng nhưng dễ hiểu.
- source_word: Ἰωάννης
  choice: Giăng
  rationale: Dùng dạng tên quen thuộc trong truyền thống Kinh Thánh tiếng Việt.
- source_word: μὲν ... δὲ
  choice: đã ... còn
  rationale: Cặp từ này tạo thế tương phản giữa phép báp-têm của Giăng và điều các môn đồ sẽ nhận; “còn” diễn đạt tự nhiên sự đối chiếu ấy.
- source_word: ἐβάπτισεν ὕδατι
  choice: đã làm phép báp-têm bằng nước
  rationale: Dạng dative ὕδατι hợp lý nhất là chỉ phương tiện, nên dịch “bằng nước”; “làm phép báp-têm” là cách nói rõ nghĩa và quen thuộc trong tiếng Việt.
- source_word: ὑμεῖς
  choice: anh em
  rationale: Đại từ số nhiều chỉ những người được Chúa nói trực tiếp; “anh em” tự nhiên hơn “các ngươi” trong tiếng Việt hiện đại và vẫn giữ sắc thái cộng đồng.
- source_word: βαπτισθήσεσθε
  choice: sẽ được báp-têm
  rationale: Giữ rõ thì tương lai và thể bị động của động từ Hy Lạp.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  rationale: “Trong” bảo lưu cách hiểu theo nghĩa không gian/phạm vi của ἐν; “Đức Thánh Linh” xác định Đấng Thánh Linh của Đức Chúa Trời. Cách hiểu công cụ “bằng Đức Thánh Linh” được ghi ở chú thích.
theological_decisions:
- issue: Cách dịch κύριος
  choice: Chúa
  alternative: Chủ
  rationale: Trong ngữ cảnh này, danh xưng chỉ Chúa Giê-su và mang ý nghĩa thẩm quyền; “Chúa” là cách dịch tự nhiên, trang trọng và không làm suy giảm nội hàm thần học.
- issue: Ý nghĩa của ἐν trong ἐν πνεύματι ἁγίῳ
  choice: trong Đức Thánh Linh
  alternative: bằng Đức Thánh Linh
  rationale: Giới từ ἐν có thể được hiểu theo nghĩa phạm vi (“trong”) hoặc phương tiện (“bằng”). Bản văn chính dùng “trong”, còn chú thích giữ lại cách hiểu hợp lý kia để không giải quyết thay sự mơ hồ của nguyên văn.
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng các thuật ngữ Kinh Thánh quen thuộc “Giăng,” “phép báp-têm” và “Đức Thánh Linh”; tránh lối đại từ cổ như “các ngươi.”
