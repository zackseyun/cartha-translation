id: ACT.11.12
reference: Acts 11:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂τὸ πνεῦμά μοι⸃ συνελθεῖν αὐτοῖς μηδὲν ⸀διακρίναντα. ἦλθον δὲ σὺν ἐμοὶ καὶ οἱ ἓξ ἀδελφοὶ οὗτοι, καὶ εἰσήλθομεν εἰς τὸν οἶκον τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/acts/011/012.yaml
  text: And the Spirit told me to go with them[a], making no distinction. These six brothers also came with me, and we entered the man's house.
translation:
  language: vi
  text: Thánh Linh bảo tôi đi cùng họ[a], không hề phân biệt. Sáu anh em này cũng đi với tôi, và chúng tôi vào nhà của người đàn ông ấy.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mà không do dự” hoặc “mà không nghi ngờ.” Phân từ Hy Lạp có thể chỉ việc không phân biệt hoặc không dao động.'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμά
  choice: Thánh Linh
  rationale: Trong Công Vụ, danh từ có mạo từ trong bối cảnh mặc khải và hướng dẫn chỉ về Thánh Linh. Tiếng Việt thường cần nêu rõ hơn tiếng Hy Lạp để danh xưng tự nhiên và không bị hiểu là một thần linh nói chung.
- source_word: εἶπεν ... μοι
  choice: bảo tôi
  rationale: Cấu trúc λέγω với tân ngữ gián tiếp dẫn vào một mệnh lệnh được diễn đạt tự nhiên bằng “bảo tôi” trong tiếng Việt.
- source_word: συνελθεῖν αὐτοῖς
  choice: đi cùng họ
  rationale: Động từ συνέρχομαι ở đây nói đến việc cùng đi với những người được sai đến; cách dịch này rõ ràng, tự nhiên và sát ngữ cảnh.
- source_word: μηδὲν διακρίναντα
  choice: không phân biệt gì cả
  rationale: διακρίνω có thể mang nghĩa phân biệt, do dự hoặc nghi ngờ. Trong lời biện giải của Phi-e-rơ về việc vào nhà người ngoại quốc, nghĩa “không phân biệt” phù hợp mạnh với ranh giới Do Thái–dân ngoại; những khả năng khác được giữ trong chú thích.
- source_word: οἱ ἓξ ἀδελφοὶ οὗτοι
  choice: sáu anh em này
  rationale: Các đối tượng là sáu người nam cùng đức tin; “anh em” vừa tự nhiên trong ngữ cảnh hội thánh vừa giữ được οὗτοι qua từ “này”.
- source_word: εἰσήλθομεν
  choice: chúng tôi vào
  rationale: Diễn đạt trực tiếp động từ aorist bằng lối kể chuyện tự nhiên trong tiếng Việt; không cần thêm sắc thái không có trong nguyên văn.
- source_word: τὸν οἶκον τοῦ ἀνδρός
  choice: nhà người ấy
  rationale: ἀνήρ chỉ người đàn ông đã được nhắc đến. “Người ấy” giữ được tham chiếu xác định và tự nhiên hơn cách nói cứng “nhà của người đàn ông”.
theological_decisions:
- issue: Ý nghĩa của μηδὲν διακρίναντα trong lời thuật lại của Phi-e-rơ
  choice: không phân biệt gì cả
  alternative: không do dự; không nghi ngờ
  rationale: Ngữ cảnh trực tiếp liên quan đến việc Phi-e-rơ vượt qua ranh giới Do Thái–dân ngoại và biện giải cho hành động ấy, nên nghĩa “không phân biệt” phù hợp với trọng tâm thần học của phân đoạn. Tuy nhiên, vì phân từ Hy Lạp cũng có thể diễn tả sự không do dự hoặc không nghi ngờ, các cách hiểu ấy được nêu trong chú thích thay vì bị loại bỏ.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. “Thánh Linh” theo cách dùng Tin Lành phổ biến trong tiếng Việt; câu giữ nhịp kể chuyện ngắn gọn. Dấu chú thích [a] đặt ngay sau mệnh đề “đi cùng họ” để bao quát cụm phân từ tiếp theo như trong lớp tham khảo.
