    rationale: σὺ chỉ là “ngươi/bạn” được nêu rõ để nhấn mạnh. Dù “con” có thể quen thuộc trong lời Đức Chúa Trời phán trong một số truyền thống Việt ngữ, nó diễn giải thêm quan hệ xưng hô; “ngươi” giữ được tính trực tiếp và trang trọng mà không thêm nội dung.
  - severity: medium
    issue: “Coi là ô uế” làm phẳng nghĩa của κοινόω.
    rationale: κοινόω có nghĩa cơ bản là làm/cho là “chung, phàm tục” và được đặt đối lập có chủ ý với καθαρίζω. Trong bối cảnh luật thanh sạch, “ô uế” là cách hiểu khả dĩ, nhưng nên để ở chú thích để bảo toàn thuật ngữ và sự mơ hồ của bản gốc.
