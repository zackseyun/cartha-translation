base_translation:
  language: en
  yaml_path: translation/nt/acts/011/009.yaml
  text: But a voice answered from heaven a second time[a], ‘What God has made clean, you must not call common.’
translation:
  language: vi
  text: 'Nhưng một tiếng từ trời đáp lại lần thứ hai: “Những gì Đức Chúa Trời đã làm cho thanh sạch thì ngươi đừng coi là phàm tục.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: đáp lại
  rationale: Động từ ἀποκρίνομαι ở đây mang nghĩa “đáp/đáp lại”; “đáp lại” tự nhiên trong mạch kể và cho thấy tiếng ấy phản hồi lời của Phi-e-rơ.
- source_word: φωνὴ
  choice: có tiếng
  rationale: φωνή là chủ ngữ không xác định; cách nói “có tiếng” tự nhiên trong tiếng Việt và không xác định thêm người nói.
- source_word: ἐκ δευτέρου
  choice: lần thứ hai
  rationale: Thành ngữ này có nghĩa “lần thứ hai”; giữ rõ trình tự của sự hiện thấy.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: từ trời
  rationale: Trong ngữ cảnh này οὐρανός chỉ trời, nơi tiếng phán phát ra, chứ không đơn thuần là bầu trời vật lý.
- source_word: Ἃ
  choice: Những gì
  rationale: Đại từ quan hệ trung tính số nhiều chỉ một phạm trù tổng quát; “những gì” vừa tự nhiên vừa giữ sắc thái số nhiều của tiếng Hy Lạp.
- source_word: ὁ θεὸς
  choice: Đức Chúa Trời
  rationale: Danh xưng tiếng Việt trang trọng, phổ thông cho θεός trong văn bản Kinh Thánh.
- source_word: ἐκαθάρισεν
  choice: đã làm cho thanh sạch
  rationale: καθαρίζω nghĩa là làm sạch hoặc thanh tẩy. “Đã làm cho thanh sạch” diễn đạt hành động đã hoàn tất và giữ ngôn ngữ về sự thanh sạch theo nghi lễ.
- source_word: σὺ
  choice: con
  rationale: Đại từ σὺ được nêu rõ để nhấn mạnh người nghe. Trong lời từ trời nói trực tiếp với Phi-e-rơ, “con” là cách xưng hô tự nhiên, trang trọng và phù hợp quan hệ ngữ cảnh.
- source_word: μὴ κοίνου
  choice: đừng coi là ô uế
  rationale: Trong ngữ cảnh phân biệt thanh sạch và không thanh sạch, κοινόω mang nghĩa xem hoặc tuyên bố là phàm tục, không thanh sạch. “Đừng coi là ô uế” truyền đạt rõ ý trong tiếng Việt hiện đại mà không hàm ý người nghe thực sự làm cho vật ấy trở nên ô uế.
theological_decisions:
- issue: Sắc thái ngôn ngữ thanh sạch trong κοινόω
  choice: coi là ô uế
  alternative: gọi là phàm tục; coi là không thanh sạch
  rationale: κοινόω theo nghĩa đen có liên hệ với điều “chung/phàm tục,” và trong bối cảnh thanh sạch theo luật nghi lễ có thể mang nghĩa xem là ô uế. “Coi là ô uế” giữ sự đối lập tự nhiên với việc Đức Chúa Trời “làm cho thanh sạch,” đồng thời tránh cách dịch sát “gọi là chung” vốn khó hiểu và dễ sai nghĩa trong tiếng Việt.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ cấu trúc lời phán trực tiếp, không xác định danh tính của “tiếng,” đồng thời dùng cặp “thanh sạch/ô uế” để thể hiện phạm trù thanh sạch theo ngữ cảnh Do Thái.
