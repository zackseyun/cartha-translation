base_translation:
  language: en
  yaml_path: translation/nt/acts/011/027.yaml
  text: In those days prophets came down from Jerusalem to Antioch[a].
translation:
  language: vi
  text: Trong những ngày ấy, các nhà tiên tri từ Giê-ru-sa-lem xuống An-ti-ốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ταύταις δὲ ταῖς ἡμέραις
  choice: Trong những ngày ấy
  rationale: Giữ nguyên khung thời gian của câu Hy Lạp. Tiểu từ δέ chỉ nối nhẹ với mạch kể nên không cần thêm một từ chuyển ý riêng trong tiếng Việt.
- source_word: κατῆλθον
  choice: xuống
  rationale: Động từ κατέρχομαι chỉ sự đi/đến xuống. Tiếng Việt có thể dùng tự nhiên động từ “xuống” mà không buộc phải phân biệt “đi xuống” hay “đến xuống” như tiếng Anh, nhờ vậy giữ được hướng địa lý và phần nào sự mơ hồ về điểm nhìn.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: từ Giê-ru-sa-lem
  rationale: ἀπό biểu thị điểm xuất phát. Dùng tên địa danh quen thuộc trong tiếng Việt ở dạng số ít.
- source_word: προφῆται
  choice: các nhà tiên tri
  rationale: Đây là cách gọi tự nhiên và rộng trong tiếng Việt, không thu hẹp họ thành giáo sư, người giảng đạo hay người viết mặc khải kinh điển.
- source_word: εἰς Ἀντιόχειαν
  choice: An-ti-ốt
  rationale: εἰς biểu thị đích đến. Trong cấu trúc tiếng Việt “từ ... xuống ...”, đích đến được diễn đạt tự nhiên mà không cần thêm “đến”.
theological_decisions:
- issue: Bản chất của các “nhà tiên tri” trong bối cảnh hội thánh Giê-ru-sa-lem và An-ti-ốt
  choice: Giữ cách gọi rộng là “các nhà tiên tri”.
  alternative: các giáo sư có ơn tiên tri; các sứ giả được soi dẫn
  rationale: Nguyên văn không xác định chi tiết phạm vi chức vụ của họ. Cách dịch này tránh áp đặt một quan điểm hệ phái về chức vụ tiên tri.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng lối phiên âm địa danh quen thuộc “Giê-ru-sa-lem” và “An-ti-ốt”; cấu trúc “từ ... xuống ...” gọn, tự nhiên, đồng thời bảo toàn nét nghĩa địa lý của nguyên văn.
