id: ACT.14.15
reference: Acts 14:15
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ἄνδρες, τί ταῦτα ποιεῖτε; καὶ ἡμεῖς ὁμοιοπαθεῖς ἐσμεν ὑμῖν ἄνθρωποι, εὐαγγελιζόμενοι ὑμᾶς ἀπὸ τούτων τῶν ματαίων ἐπιστρέφειν ἐπὶ ⸀θεὸν ζῶντα ὃς ἐποίησεν τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/015.yaml
  text: and saying[a], “Men, why are you doing these things? We also are men with the same nature as you, bringing you good news to turn from these worthless things to the living God[c][b], who made the heaven and the earth and the sea and everything in them.”
translation:
  language: vi
  text: 'và nói: “Thưa các ông, sao các ông lại làm những điều này? Chúng tôi cũng là những con người cùng chung thân phận như các ông. Chúng tôi loan báo tin mừng cho các ông, để các ông lìa bỏ những điều hư không này mà hướng về Đức Chúa Trời hằng sống,[a] là Đấng đã dựng nên trời, đất, biển và mọi vật trong đó.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Những điều hư không” trong ngữ cảnh chỉ các thực hành và đối tượng thờ phượng ngoại giáo vô ích, kể cả các thần tượng.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄνδρες
  choice: Thưa các ông
  rationale: Giữ lời gọi trực tiếp ở giống đực số nhiều, đồng thời tự nhiên và trang trọng trong tiếng Việt hiện đại.
- source_word: ὁμοιοπαθεῖς ... ἄνθρωποι
  choice: chỉ là những con người cùng chung thân phận như các ông
  rationale: Diễn đạt việc Phao-lô và Ba-na-ba hoàn toàn cùng chung thân phận con người với thính giả, bác bỏ sự tôn kính họ như thần linh; “chỉ là” làm rõ lực dụng học trong ngữ cảnh chứ không phủ nhận phẩm giá con người.
- source_word: εὐαγγελιζόμενοι
  choice: loan báo tin mừng
  rationale: Giữ nghĩa động từ là công bố tin tốt lành mà không biến nó thành một thuật ngữ giáo hội khó hiểu.
- source_word: ἀπὸ τούτων τῶν ματαίων
  choice: lìa bỏ những điều hư không này
  rationale: “Hư không” bảo tồn sắc thái vô ích, trống rỗng của μάταιος và không thu hẹp từ ngữ Hy Lạp thành riêng các tượng thần.
- source_word: ἐπιστρέφειν ἐπὶ θεὸν ζῶντα
  choice: mà quay về với Đức Chúa Trời hằng sống
  rationale: Diễn đạt chuyển động rời khỏi sự thờ phượng vô ích và hướng đến Đức Chúa Trời; “hằng sống” tạo tương phản với các thần tượng vô tri.
- source_word: ἐποίησεν
  choice: đã dựng nên
  rationale: Phù hợp với công thức nói về công cuộc sáng tạo, tự nhiên và trang trọng trong tiếng Việt.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ τὴν θάλασσαν καὶ πάντα τὰ ἐν αὐτοῖς
  choice: trời, đất, biển và mọi vật trong đó
  rationale: Giữ đủ các phạm vi của công thức sáng tạo và tính bao quát của πάντα, đồng thời tránh cách diễn đạt nặng nề trong tiếng Việt.
theological_decisions:
- issue: Thân phận của Phao-lô và Ba-na-ba đối lập với việc dân chúng tôn họ như thần
  choice: chỉ là những con người cùng chung thân phận như các ông
  alternative: cũng là người có cùng bản tính như các ông
  rationale: Bản dịch nhấn mạnh nhân tính chung, không giới hạn ὁμοιοπαθεῖς vào cảm xúc và không gán thần tính cho các sứ đồ.
- issue: Phạm vi của τούτων τῶν ματαίων
  choice: những điều hư không này
  alternative: các thần tượng này
  rationale: Ngữ cảnh bao gồm việc thờ thần ngoại giáo và dâng tế lễ, nhưng tiếng Hy Lạp dùng cách gọi rộng hơn danh từ trực tiếp chỉ “thần tượng”; vì vậy giữ độ rộng trong chính văn và giải thích ở chú thích.
- issue: Danh xưng θεὸν ζῶντα
  choice: Đức Chúa Trời hằng sống
  alternative: Thượng Đế hằng sống
  rationale: Dùng danh xưng phổ thông, trang trọng trong truyền thống Kinh Thánh tiếng Việt và giữ sự tương phản giữa Đức Chúa Trời sống động với những đối tượng thờ phượng vô ích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Giữ lời xưng hô với đám đông nam giới bằng “các ông”; dùng “loan báo tin mừng” thay cho thuật ngữ giáo hội chuyên biệt. Dấu chú thích [a] được đặt ngay sau mệnh đề liên quan để tránh nhầm với “Đức Chúa Trời hằng sống”.
