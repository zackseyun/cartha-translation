  text: συνιδόντες κατέφυγον εἰς τὰς πόλεις τῆς Λυκαονίας Λύστραν καὶ Δέρβην καὶ τὴν περίχωρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/006.yaml
  text: when they learned of it[a], they fled to the cities of Lycaonia—Lystra and Derbe—and the surrounding region,
translation:
  language: vi
  text: Khi nhận ra việc ấy[a], họ chạy trốn đến các thành thuộc vùng Ly-ca-ô-ni—Lít-trơ và Đẹt-bơ—cùng vùng phụ cận,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “Khi hiểu được điều này” hoặc “Khi biết được việc ấy.” Phân từ Hy Lạp diễn tả việc họ nhận biết mối nguy được nói đến trong câu trước.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδόντες
  choice: Khi nhận ra việc ấy
  rationale: Phân từ bất định quá khứ của συνοράω diễn tả việc đi đến chỗ nhận biết tình thế nguy hiểm ở câu trước. Tiếng Việt cần bổ sung đối tượng theo ngữ cảnh; “việc ấy” vừa tự nhiên vừa không giải thích quá mức.
- source_word: κατέφυγον
  choice: họ chạy trốn
  rationale: καταφεύγω có thể mang nghĩa chạy đi để lánh nạn. Trong mạch kể về mối nguy cấp bách, “chạy trốn” truyền đạt rõ hành động rời đi vì nguy hiểm.
- source_word: εἰς
  choice: đến
  rationale: Với động từ chỉ chuyển động, εἰς đánh dấu đích đến; “đến” là cách diễn đạt tự nhiên trước tên thành và vùng.
- source_word: τὰς πόλεις τῆς Λυκαονίας
  choice: các thành thuộc vùng Ly-ca-ô-ni
  rationale: Cách dịch này thể hiện quan hệ địa vực của sở hữu cách và chuẩn bị cho hai địa danh đồng vị theo sau.
- source_word: Λύστραν καὶ Δέρβην
  choice: Lít-trơ và Đẹt-bơ
  rationale: Phiên âm địa danh Hy Lạp theo lối quen dùng và dễ đọc trong tiếng Việt; hai tên này đồng vị với “các thành”.
- source_word: τὴν περίχωρον
  choice: vùng phụ cận
  rationale: περίχωρος được dùng như danh từ, chỉ khu vực quanh các thành vừa nêu. “Vùng phụ cận” gọn, trang trọng và đủ rộng để bao gồm cả khu dân cư lẫn nông thôn.
- source_word: καὶ ... καὶ
  choice: —Lít-trơ và Đẹt-bơ—cùng
  rationale: Dấu gạch ngang làm rõ rằng hai địa danh xác định các thành vừa nhắc đến, còn “cùng” nối thêm vùng phụ cận.
theological_decisions: []
