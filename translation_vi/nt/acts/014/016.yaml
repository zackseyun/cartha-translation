id: ACT.14.16
reference: Acts 14:16
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς παρῳχημέναις γενεαῖς εἴασεν πάντα τὰ ἔθνη πορεύεσθαι ταῖς ὁδοῖς αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/016.yaml
  text: In past generations he allowed all the nations to walk in their own ways[a].
translation:
  language: vi
  text: Trong các thế hệ đã qua, Ngài đã để cho mọi dân tộc đi theo đường lối riêng của họ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “để cho mọi dân ngoại đi theo đường lối của họ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: Ngài
  rationale: Đại từ quan hệ Hy Lạp nối với tiền ngữ là Đức Chúa Trời ở câu trước; tiếng Việt tự nhiên hơn khi tiếp tục bằng “Ngài”, đồng thời giữ sắc thái tôn kính.
- source_word: ἐν ταῖς παρῳχημέναις γενεαῖς
  choice: Trong các thế hệ đã qua
  rationale: Diễn đạt rõ những thế hệ thuộc thời trước, vừa sát nghĩa vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: εἴασεν
  choice: đã để cho
  rationale: Diễn tả sự cho phép hoặc không ngăn cản, không hàm ý Đức Chúa Trời tán thành đường lối ấy.
- source_word: πάντα τὰ ἔθνη
  choice: mọi dân tộc
  rationale: Giữ phạm vi tập thể và sắc thái dân tộc của ἔθνη; “các dân ngoại” cũng có thể có nghĩa nhưng nhấn mạnh hơn sự đối lập Do Thái–ngoại bang.
- source_word: πορεύεσθαι
  choice: đi theo
  rationale: Kết hợp tự nhiên với “đường lối” trong tiếng Việt và giữ được ẩn dụ về hướng sống, thay vì diễn giải thẳng thành “sống”.
- source_word: ταῖς ὁδοῖς αὐτῶν
  choice: đường lối riêng của họ
  rationale: “Đường lối” chuyển tải nghĩa bóng về cách sống; “riêng của họ” làm rõ sở hữu αὐτῶν mà vẫn tự nhiên.
theological_decisions:
- issue: Sự cho phép của Đức Chúa Trời so với sự tán thành
  choice: “đã để cho” biểu thị Đức Chúa Trời cho phép hoặc không ngăn cản các dân tộc đi theo đường lối của họ.
  alternative: Hiểu rằng Đức Chúa Trời tán thành hoặc trực tiếp định đoạt đường lối ấy.
  rationale: εἴασεν mang nghĩa cho phép, không tự nó biểu thị sự tán thành. Cách dịch này giữ nguyên sự căng thẳng giữa quyền tể trị của Đức Chúa Trời và trách nhiệm của con người mà không giải quyết theo một hệ phái.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Ngài” có tiền ngữ rõ từ câu trước; “đường lối” giữ hình ảnh ẩn dụ nhưng tự nhiên hơn lối nói “bước đi trong các con đường”.
