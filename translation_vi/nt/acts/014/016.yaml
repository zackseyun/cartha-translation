  source_fidelity: 'Bản dịch chuyển đạt chính xác cấu trúc và ý nghĩa của câu Hy Lạp: mốc thời gian “trong các thế hệ đã qua,” hành động cho phép/không ngăn cản của Đức Chúa Trời (εἴασεν), phạm vi “mọi dân tộc” (πάντα τὰ ἔθνη), và hình ảnh ẩn dụ “đi theo đường lối ... của họ” (πορεύεσθαι ταῖς ὁδοῖς αὐτῶν). “Đã để cho” phù hợp với nghĩa cho phép, không hàm ý tán thành.'
