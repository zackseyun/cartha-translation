id: ACT.14.9
reference: Acts 14:9
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οὗτος ⸀ἤκουσεν τοῦ Παύλου λαλοῦντος· ὃς ἀτενίσας αὐτῷ καὶ ἰδὼν ὅτι ⸂ἔχει πίστιν⸃ τοῦ σωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/009.yaml
  text: This man listened to Paul speaking[a], who, looking intently at him and seeing that he had faith to be saved,
translation:
  language: vi
  text: Người ấy lắng nghe Phao-lô nói. Phao-lô chăm chú nhìn ông và thấy rằng ông có đức tin để được chữa lành[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được cứu”. Động từ Hy Lạp có thể mang nghĩa “cứu” hoặc “chữa lành”; trong ngữ cảnh này, việc chữa lành thân thể là nghĩa nổi bật.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Người ấy
  rationale: Đại từ chỉ định quay lại người bị liệt ở câu trước; “người ấy” xác định rõ đối tượng mà vẫn tự nhiên trong tiếng Việt.
- source_word: ἤκουσεν
  choice: lắng nghe
  rationale: Trong ngữ cảnh người này chú ý đến lời Phao-lô đang nói, “lắng nghe” diễn đạt sự tiếp nhận có chủ ý mà không thêm ý ngoài văn bản.
- source_word: λαλοῦντος
  choice: nói
  rationale: Phân từ hiện tại mô tả Phao-lô đang nói; “nói” giữ nghĩa rộng của λαλέω, không thu hẹp thành một hình thức diễn thuyết cụ thể.
- source_word: ἀτενίσας
  choice: chăm chú nhìn
  rationale: Diễn đạt ánh nhìn tập trung, có chủ ý của động từ Hy Lạp bằng cách nói tự nhiên và trang trọng vừa phải.
- source_word: ἰδὼν
  choice: thấy rằng
  rationale: Giữ hình ảnh tri giác của động từ gốc, đồng thời dẫn vào nội dung Phao-lô nhận biết nơi người ấy.
- source_word: ἔχει πίστιν
  choice: có đức tin
  rationale: Trong ngữ cảnh, πίστις nói đến lòng tin hướng về việc nhận sự trợ giúp của Đức Chúa Trời, không phải phẩm chất trung tín.
- source_word: τοῦ σωθῆναι
  choice: để được chữa lành
  rationale: Động từ σῴζω có thể mang nghĩa cứu hoặc chữa lành; phép lạ về sự phục hồi thân thể ngay sau đó khiến “được chữa lành” là nghĩa phù hợp nhất trong mạch kể.
theological_decisions:
- issue: Nghĩa của σωθῆναι trong trình thuật chữa lành
  choice: được chữa lành
  alternative: được cứu
  rationale: Ngữ cảnh trực tiếp nói về một người què sắp được phục hồi thân thể. Bản dịch chính nêu nghĩa phù hợp với sự kiện, còn chú thích giữ lại phạm vi nghĩa rộng hơn của từ Hy Lạp.
translation_notes:
  register: Văn phong tiếng Việt hiện đại, rõ ràng và trang trọng vừa phải. Mệnh đề quan hệ Hy Lạp được tách thành hai câu để tránh khiến người đọc hiểu nhầm rằng người què là người chăm chú nhìn; dấu phẩy cuối câu được giữ vì câu 9 tiếp nối trực tiếp sang lời truyền bảo ở câu 10.
