  source_fidelity: 'Bản dịch phản ánh đúng các thành phần chính của câu Hy Lạp: động từ chưa hoàn thành διέτριβον được diễn đạt bằng “ở lại” với sắc thái kéo dài; σύν được dịch đúng là “với”; và χρόνoν οὐκ ὀλίγον được giữ dưới dạng nói giảm “một thời gian không ngắn.” “Rồi” là cách nối mạch kể chuyện chấp nhận được cho δέ, dù nhẹ hơn nghĩa liên kết đơn thuần của “và.”'
  naturalness: Câu rõ ràng, đúng văn phong Việt hiện đại và có mức trang trọng phù hợp văn bản Kinh Thánh. “Một thời gian không ngắn” hơi mang sắc thái dịch sát, nhưng vẫn tự nhiên đủ và có chủ ý bảo tồn lối nói giảm của nguyên văn; chú thích đã cung cấp phương án lưu loát hơn.
  terminology: “Các môn đồ” là thuật ngữ Kinh Thánh quen thuộc, phù hợp với τοῖς μαθηταῖς trong ngữ cảnh cộng đồng tín hữu. Không có vấn đề về tên riêng hay thuật ngữ thần học.
