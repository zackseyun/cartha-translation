  text: And they stayed with the disciples for no little time[a].
translation:
  language: vi
  text: Rồi họ ở lại với các môn đồ một thời gian không ngắn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hay nói tự nhiên hơn: “một thời gian khá lâu” hoặc “khá lâu”. Tiếng Hy Lạp dùng lối nói giảm bằng phủ định: “không ít thời gian”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβον
  choice: họ ở lại
  rationale: Thể chưa hoàn thành diễn tả việc tiếp tục lưu lại trong một khoảng thời gian. “Ở lại” tự nhiên trong tiếng Việt và giữ được sắc thái kéo dài của hành động.
- source_word: δὲ
  choice: Rồi
  rationale: δέ là một liên từ chuyển tiếp nhẹ trong mạch kể chuyện. “Rồi” nối câu này với diễn biến trước đó một cách tự nhiên mà không hàm ý đối lập mạnh.
- source_word: χρόνον οὐκ ὀλίγον
  choice: một thời gian không ngắn
  rationale: Cách dịch này giữ lối nói giảm bằng phủ định của nguyên văn Hy Lạp, đồng thời vẫn rõ nghĩa trong tiếng Việt hiện đại.
- source_word: σὺν τοῖς μαθηταῖς
  choice: với các môn đồ
  rationale: σύν với tặng cách mang nghĩa trực tiếp là “với”. Trong ngữ cảnh, “các môn đồ” chỉ cộng đồng những người tin Chúa tại địa phương.
theological_decisions: []
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ “môn đồ” vì đây là thuật ngữ Kinh Thánh quen thuộc; giữ lối nói “không ngắn” để phản ánh hình thức tu từ của nguyên văn, còn cách diễn đạt thuần Việt hơn được nêu trong chú thích.
