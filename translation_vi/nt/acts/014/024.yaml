  text: καὶ διελθόντες τὴν Πισιδίαν ἦλθον εἰς ⸀τὴν Παμφυλίαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/024.yaml
  text: And after passing through Pisidia, they came into Pamphylia.
translation:
  language: vi
  text: Sau khi đi qua miền Pi-si-đi, họ đến miền Pam-phi-ly.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Sau khi
  rationale: Liên từ καὶ nối tiếp hành trình; trong tiếng Việt, quan hệ nối tiếp được diễn đạt tự nhiên cùng với phân từ chỉ hành động xảy ra trước.
- source_word: διελθόντες
  choice: đi qua
  rationale: Phân từ bất định quá khứ chủ động của διέρχομαι, chỉ hành động xảy ra trước động từ chính; cấu trúc “Sau khi đi qua” truyền đạt rõ quan hệ thời gian.
- source_word: τὴν Πισιδίαν
  choice: miền Pi-si-đi
  rationale: Tên vùng được phiên âm sang tiếng Việt; thêm “miền” để người đọc nhận biết đây là một khu vực địa lý.
- source_word: ἦλθον
  choice: họ đến
  rationale: Dạng bất định quá khứ của ἔρχομαι, diễn tả việc nhóm người tới nơi được nêu; “họ đến” tự nhiên trong văn kể tiếng Việt.
- source_word: εἰς τὴν Παμφυλίαν
  choice: miền Pam-phi-ly
  rationale: εἰς biểu thị hướng chuyển động vào một vùng. Với động từ “đến”, tiếng Việt không cần thêm “vào” để truyền đạt đích đến; tên vùng được phiên âm và có danh từ loại “miền”.
