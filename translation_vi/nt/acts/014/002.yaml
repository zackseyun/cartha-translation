reference: Acts 14:2
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: οἱ δὲ ⸀ἀπειθήσαντες Ἰουδαῖοι ἐπήγειραν καὶ ἐκάκωσαν τὰς ψυχὰς τῶν ἐθνῶν κατὰ τῶν ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/002.yaml
  text: But the Jews who were disobedient stirred up the Gentiles and poisoned their minds against the brothers[a][b][c].
translation:
  language: vi
  text: Nhưng những người Do Thái không chịu tin[a] đã kích động dân ngoại và đầu độc lòng họ[b], khiến họ chống lại các anh em[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “không vâng phục.” Từ Hy Lạp có thể chỉ việc không chịu tin sứ điệp và trong bối cảnh này có lẽ nói đến sự khước từ Tin Lành.
    reason: lexical_alternative
  - marker: b
    text: Nguyên văn là “linh hồn của họ”; ở đây chỉ nội tâm, khuynh hướng hoặc thái độ của họ.
    reason: lexical_alternative
  - marker: c
    text: “Các anh em” ở đây có lẽ chỉ chung những người cùng đức tin, kể cả phụ nữ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειθήσαντες
  choice: không chịu tin
  rationale: Trong bối cảnh rao giảng của sách Công Vụ, từ này nói đến việc khước từ sứ điệp, đồng thời hàm ý sự cố ý không thuận phục; “không chịu tin” diễn đạt được cả sự từ chối lẫn phương diện đức tin.
- source_word: Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Chỉ nhóm người Do Thái tại địa phương chống lại sứ điệp trong bối cảnh hội đường, chứ không khái quát về toàn thể dân Do Thái.
- source_word: ἐπήγειραν
  choice: kích động
  rationale: Diễn đạt tự nhiên hành động khơi dậy thái độ và sự chống đối nơi một nhóm người.
- source_word: ἐκάκωσαν
  choice: đầu độc
  rationale: Với “lòng” làm tân ngữ và cụm “chống lại các anh em,” động từ mang nghĩa làm hư hoại hoặc khiến thái độ trở nên thù nghịch; “đầu độc lòng” giữ được sức nặng và hình ảnh của câu.
- source_word: τὰς ψυχὰς
  choice: lòng họ
  rationale: Nghĩa trong câu là nội tâm, khuynh hướng và thái độ của dân ngoại, không phải một khẳng định kỹ thuật về cấu tạo con người.
- source_word: τῶν ἐθνῶν
  choice: dân ngoại
  rationale: Trong thế đối chiếu Do Thái–dân ngoại ở Công Vụ, cụm từ chỉ những người không thuộc dân Do Thái.
- source_word: κατὰ τῶν ἀδελφῶν
  choice: chống lại các anh em
  rationale: Giữ hình thức giống đực số nhiều của nguyên văn, trong khi chú thích cho biết cách gọi này có thể bao gồm toàn thể cộng đồng tín hữu.
theological_decisions:
- issue: Phạm vi giới tính của ἀδελφῶν khi chỉ cộng đồng Cơ Đốc
  choice: các anh em
  alternative: anh chị em; các tín hữu
  rationale: Nguyên văn dùng danh từ giống đực số nhiều, nhưng trong cách dùng của cộng đồng Cơ Đốc ban đầu, từ này thường chỉ chung những người cùng đức tin, kể cả phụ nữ. Bản chính giữ hình thức gần nguyên văn và nêu phạm vi bao quát trong chú thích.
- issue: Sắc thái của ἀπειθήσαντες
  choice: không chịu tin
  alternative: không vâng phục; bất tuân; không tin
  rationale: Bối cảnh trực tiếp là phản ứng đối với lời rao giảng. Cách dịch này không tách đức tin khỏi ý chí thuận phục, nhưng xác định hành động bị khước từ theo mạch văn.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. “Không chịu tin” giữ sắc thái chủ ý; “đầu độc lòng” là lối diễn đạt mạnh nhưng tự nhiên trong tiếng Việt. Cụm “khiến họ chống lại” làm rõ quan hệ của κατὰ với thái độ thù nghịch mà không thêm một tác nhân hay nội dung thần học mới.
