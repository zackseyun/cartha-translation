source:
  edition: SBLGNT
  text: ὡς δὲ ἐγένετο ὁρμὴ τῶν ἐθνῶν τε καὶ Ἰουδαίων σὺν τοῖς ἄρχουσιν αὐτῶν ὑβρίσαι καὶ λιθοβολῆσαι αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/005.yaml
  text: And when an attempt was made by both the Gentiles and the Jews[a], together with their rulers, to mistreat them and to stone them[b],
translation:
  language: vi
  text: Nhưng khi dân ngoại lẫn người Do Thái[b], cùng với các nhà cầm quyền của họ, toan xông tới[a] để ngược đãi và ném đá hai ông,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “một cuộc xông tới đã xảy ra” hoặc “một cuộc tấn công đã xảy ra”. Từ Hy Lạp ὁρμή có thể chỉ một đợt xông tới hay một sự tấn công dữ dội; “toan xông tới” diễn đạt hành động thù địch đang khởi phát, vì việc ngược đãi và ném đá được nêu như điều họ nhắm làm, chứ chưa được kể là đã hoàn tất.'
    reason: lexical_alternative
  - marker: b
    text: Trong một số ngữ cảnh, Ἰουδαῖοι có thể dịch là “người Giu-đê”. Ở đây, từ này có lẽ chỉ một nhóm người Do Thái chống đối, chứ không riêng những người xuất thân từ miền Giu-đê.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Nhưng khi
  rationale: “Khi” giữ quan hệ thời gian của ὡς; “nhưng” thể hiện nhẹ sắc thái chuyển ý của δέ trong diễn tiến câu chuyện.
- source_word: ἐγένετο ὁρμὴ
  choice: định ra tay
  rationale: Cụm này diễn tả một đợt hành động thù địch bắt đầu hình thành hoặc một ý định sắp được thực hiện. “Định ra tay” tự nhiên trong tiếng Việt và không hàm ý rằng việc ngược đãi, ném đá đã hoàn tất.
- source_word: τῶν ἐθνῶν
  choice: dân ngoại
  rationale: Trong thế đối lập với người Do Thái ở sách Công Vụ, ἔθνη chỉ những người không thuộc dân Do Thái, chứ không phải các quốc gia theo nghĩa địa chính trị.
- source_word: τε καὶ
  choice: cả ... lẫn
  rationale: Giữ rõ cấu trúc tương liên, cho thấy hai nhóm đều tham gia.
- source_word: Ἰουδαίων
  choice: người Do Thái
  rationale: Trong ngữ cảnh này, từ này chỉ một nhóm người Do Thái chống đối, không nhất thiết chỉ những người đến từ miền Giu-đê.
- source_word: σὺν τοῖς ἄρχουσιν αὐτῶν
  choice: cùng với những người lãnh đạo của họ
  rationale: ἄρχοντες là những người giữ thẩm quyền trong cộng đồng hoặc chính quyền; “người lãnh đạo” vừa trang trọng vừa tự nhiên trong tiếng Việt hiện đại.
- source_word: ὑβρίσαι
  choice: ngược đãi
  rationale: Bao quát hành vi xúc phạm và đối xử hung bạo, không thu hẹp nghĩa vào lời lăng mạ.
- source_word: καὶ λιθοβολῆσαι
  choice: và ném đá
  rationale: Giữ đúng nghĩa của động từ mà không thêm “cho đến chết”, là kết quả không được nói rõ trong câu.
- source_word: αὐτούς
  choice: hai ông
  rationale: Đại từ chỉ Phao-lô và Ba-na-ba. “Hai ông” làm rõ đối tượng trong tiếng Việt và tránh nhầm với những người lãnh đạo vừa được nhắc đến.
