source:
  edition: SBLGNT
  text: κἀκεῖθεν ἀπέπλευσαν εἰς Ἀντιόχειαν, ὅθεν ἦσαν παραδεδομένοι τῇ χάριτι τοῦ θεοῦ εἰς τὸ ἔργον ὃ ἐπλήρωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/026.yaml
  text: And from there they sailed to Antioch[b][a], where they had been committed to the grace of God for the work that they had fulfilled.
translation:
  language: vi
  text: Rồi từ đó, họ đi thuyền đến An-ti-ốt, nơi trước đó họ đã được phó thác[a] cho ân điển của Đức Chúa Trời để làm công việc mà họ đã hoàn tất.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “được giao phó”.
    reason: lexical_alternative
  - marker: b
    text: Hay “hoàn thành”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: Rồi từ đó
  rationale: Diễn đạt cả ý nối tiếp câu chuyện của καί lẫn điểm xuất phát được chỉ bởi ἐκεῖθεν, bằng lối kể tự nhiên trong tiếng Việt.
- source_word: ἀπέπλευσαν
  choice: họ đi thuyền về
  rationale: Động từ chỉ việc rời đi bằng đường biển; “đi thuyền về” vừa thể hiện phương thức di chuyển vừa phù hợp với việc họ trở lại An-ti-ốt.
- source_word: εἰς Ἀντιόχειαν
  choice: về An-ti-ốt
  rationale: Trong ngữ cảnh trở lại nơi xuất phát, “về” tự nhiên hơn “đến” mà không thêm nội dung ngoài mạch văn.
- source_word: ὅθεν
  choice: là nơi trước kia
  rationale: ὅθεν có nghĩa sát là “từ nơi đó”; cách diễn đạt này giữ rõ An-ti-ốt là địa điểm của hành động giao phó trước đây, đồng thời tránh câu tiếng Việt nặng nề.
- source_word: ἦσαν παραδεδομένοι
  choice: họ đã được giao phó
  rationale: Giữ thể bị động và ý một hành động đã xảy ra trước chuyến đi, với hệ quả còn liên quan. “Giao phó” truyền đạt việc đặt họ dưới sự chăm sóc của ân điển Đức Chúa Trời mà không biến câu này thành thuật ngữ giáo hội chuyên biệt.
- source_word: τῇ χάριτι τοῦ θεοῦ
  choice: cho ân điển của Đức Chúa Trời
  rationale: Giữ quan hệ của cách dữ với παραδεδομένοι và bảo tồn đầy đủ cụm từ thần học “ân điển của Đức Chúa Trời”.
- source_word: εἰς τὸ ἔργον
  choice: để làm công việc
  rationale: Diễn đạt mục đích của sự giao phó bằng tiếng Việt tự nhiên; “công việc” giữ nghĩa rộng của ἔργον, không diễn giải hẹp thành “sứ mạng”.
- source_word: ὃ ἐπλήρωσαν
  choice: mà họ đã hoàn tất
  rationale: Trong ngữ cảnh này, πληρόω nói đến việc đưa công việc đến chỗ trọn vẹn. “Hoàn tất” tự nhiên và vẫn giữ sắc thái hoàn thành đầy đủ.
theological_decisions:
- issue: Bản chất của hành động trước đó tại Hội Thánh An-ti-ốt đối với Phao-lô và Ba-na-ba
  choice: họ đã được giao phó cho ân điển của Đức Chúa Trời
  alternative: họ đã được phó thác cho ân điển của Đức Chúa Trời
  rationale: Bản dịch giữ hình ảnh hai người được đặt dưới sự chăm sóc bởi ân điển Đức Chúa Trời, không xác định thêm một nghi thức hay mô hình sai phái thuộc hệ phái nào.
translation_notes:
  register: Văn phong kể chuyện hiện đại, trang trọng vừa phải và dễ hiểu. Dùng “An-ti-ốt” theo lối phiên âm Kinh Thánh quen thuộc; giữ “ân điển của Đức Chúa Trời” vì sức nặng thần học của nguyên văn. Các từ “trước kia” và “đã” làm rõ quan hệ thời gian của cấu trúc quá khứ hoàn thành trong tiếng Hy Lạp mà không khiến câu khó đọc.
