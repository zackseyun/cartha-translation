id: ACT.14.12
reference: Acts 14:12
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: ἐκάλουν τε ⸀τὸν Βαρναβᾶν Δία, τὸν δὲ Παῦλον Ἑρμῆν, ἐπειδὴ αὐτὸς ἦν ὁ ἡγούμενος τοῦ λόγου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/012.yaml
  text: And they were calling Barnabas Zeus[a], and Paul Hermes[b], because he was the chief speaker.
translation:
  language: vi
  text: Họ gọi Ba-na-ba là thần Dớt[a], còn Phao-lô là thần Héc-mê[b], vì chính ông là người nói chính.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dớt là tên Hy Lạp của vị thần mà người La Mã gọi là Giu-pi-tơ.
    reason: alternative_reading
  - marker: b
    text: Héc-mê là tên Hy Lạp của vị thần mà người La Mã gọi là Méc-cu-ri.
    reason: alternative_reading
  - marker: c
    text: 'Nguyên văn cũng có thể dịch: “người đứng đầu trong việc nói” hoặc “người phát ngôn chính.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλουν
  choice: Họ gọi
  rationale: Thì chưa hoàn thành diễn tả hành động đang diễn ra trong cảnh thuật chuyện; tiếng Việt tự nhiên dùng quá khứ theo ngữ cảnh mà không cần thêm “đang”.
- source_word: τε ... δὲ
  choice: '..., còn ...'
  rationale: Cặp nối tạo sự liên kết và đối chiếu nhẹ giữa cách họ gọi Ba-na-ba và Phao-lô; “còn” diễn đạt tự nhiên trong tiếng Việt.
- source_word: Δία
  choice: thần Dớt
  rationale: Giữ tên vị thần Hy Lạp được nêu trực tiếp trong nguyên văn, đồng thời thêm “thần” để người đọc phổ thông nhận rõ đây là tên một vị thần.
- source_word: Ἑρμῆν
  choice: thần Héc-mê
  rationale: Giữ tên vị thần Hy Lạp trong nguyên văn thay vì thay bằng tên La Mã là Méc-cu-ri.
- source_word: ἐπειδὴ
  choice: vì
  rationale: 'Diễn đạt rõ quan hệ nguyên nhân: đám đông gọi Phao-lô là Héc-mê vì ông giữ vai trò chính trong việc nói.'
- source_word: αὐτὸς
  choice: ông
  rationale: Đại từ chỉ Phao-lô và có sắc thái phân biệt ông với Ba-na-ba; “ông” là cách quy chiếu tự nhiên, trang trọng trong tiếng Việt.
- source_word: ὁ ἡγούμενος τοῦ λόγου
  choice: người dẫn đầu việc phát biểu
  rationale: Giữ được hình ảnh “người dẫn đầu” của phân từ ἡγούμενος và hiểu λόγος ở đây là lời nói hay hoạt động phát biểu, không phải “Ngôi Lời” hoặc một thuật ngữ thần học.
theological_decisions:
- issue: Tên các vị thần ngoại giáo
  choice: Dùng Dớt và Héc-mê trong chính văn
  alternative: Giu-pi-tơ và Méc-cu-ri
  rationale: Nguyên văn Hy Lạp nêu Zeus và Hermes; giữ các tên Hy Lạp tránh du nhập các tên tương đương của La Mã từ truyền thống dịch thuật.
- issue: Ý nghĩa của λόγος trong cụm ὁ ἡγούμενος τοῦ λόγου
  choice: Hiểu là việc phát biểu
  alternative: sứ điệp hoặc Lời theo nghĩa thần học
  rationale: 'Trong ngữ cảnh, cụm từ giải thích vì sao dân chúng đồng nhất Phao-lô với Héc-mê: ông là người đảm nhiệm vai trò nói chính. Bản dịch không gán cho λόγος một nghĩa thần học không do ngữ cảnh đòi hỏi.'
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc trong tiếng Việt “Ba-na-ba,” “Phao-lô,” “Dớt,” và “Héc-mê.” Cấu trúc “còn” bảo toàn sự đối chiếu nhẹ; không cố biểu thị riêng thể chưa hoàn thành vì ngữ cảnh tiếng Việt đã đủ rõ.
