  naturalness: “Người dẫn đầu việc phát biểu” hơi gượng trong tiếng Việt hiện đại. “Người nói chính” tự nhiên, ngắn gọn, và phù hợp với văn mạch.
  terminology: Các tên “Ba-na-ba,” “Phao-lô,” “Dớt,” và “Héc-mê” phù hợp với cách phiên âm Kinh Thánh tiếng Việt và giữ đúng tên Hy Lạp trong bản nguồn. Thêm “thần” giúp nhận diện mà không làm thay đổi ý nghĩa.
