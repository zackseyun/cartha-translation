- from: 'Khi đám đông thấy việc Phao-lô đã làm, họ cất cao tiếng, nói bằng tiếng Ly-ca-ô-ni: “Các thần đã hóa nên giống loài người và xuống với chúng ta!”'
  to: 'Khi đám đông thấy việc Phao-lô đã làm, họ cất tiếng lớn, nói bằng tiếng Ly-ca-ô-ni: “Các thần đã trở nên giống con người và đã xuống với chúng ta!”'
  rationale: Chỉnh nhẹ để tiếng Việt hiện đại, tự nhiên hơn, đồng thời phân biệt rõ ý «giống con người» với ý các thần thật sự biến thành con người. Không thêm diễn giải về danh tính các thần hay ý nghĩa thần học của lời reo này.
