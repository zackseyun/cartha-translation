  text: οἵ ⸀τε ὄχλοι ἰδόντες ὃ ⸀ἐποίησεν Παῦλος ἐπῆραν τὴν φωνὴν αὐτῶν Λυκαονιστὶ λέγοντες· Οἱ θεοὶ ὁμοιωθέντες ἀνθρώποις κατέβησαν πρὸς ἡμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/011.yaml
  text: And when the crowds saw what Paul had done[a], they raised their voices, saying in the Lycaonian language, “The gods, having become like men[b], have come down to us!”
translation:
  language: vi
  text: 'Khi đám đông thấy việc Phao-lô đã làm, họ cất tiếng lớn, nói bằng tiếng Ly-ca-ô-ni: “Các thần đã trở nên giống con người và đã xuống với chúng ta!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἵ τε ὄχλοι ἰδόντες
  choice: Khi đám đông thấy
  rationale: Diễn đạt phân từ bất định quá khứ ἰδόντες theo nghĩa thời gian một cách tự nhiên; ὄχλοι tuy ở số nhiều trong Hy Lạp nhưng danh từ tập hợp “đám đông” phù hợp tiếng Việt.
- source_word: ὃ ἐποίησεν Παῦλος
  choice: việc Phao-lô đã làm
  rationale: Đại từ quan hệ trung tính chỉ điều Phao-lô vừa thực hiện; “đã làm” giữ rõ trình tự của câu chuyện.
- source_word: ἐπῆραν τὴν φωνὴν αὐτῶν
  choice: họ cất cao tiếng
  rationale: Giữ hình ảnh của thành ngữ Hy Lạp về việc lớn tiếng kêu lên, đồng thời vẫn tự nhiên và trang trọng trong tiếng Việt.
- source_word: Λυκαονιστί
  choice: bằng tiếng Ly-ca-ô-ni
  rationale: Trạng từ chỉ việc nói bằng ngôn ngữ Lycaonia; cách diễn đạt này rõ nghĩa đối với độc giả hiện đại.
- source_word: Οἱ θεοὶ
  choice: Các thần
  rationale: Số nhiều chỉ các thần trong quan niệm ngoại giáo của đám đông, không phải Đức Chúa Trời.
- source_word: ὁμοιωθέντες ἀνθρώποις
  choice: đã hóa nên giống loài người
  rationale: Giữ sắc thái của phân từ bị động ὁμοιωθέντες và ý tương đồng với con người, không chuyển thành thuật ngữ thần học về nhập thể.
- source_word: κατέβησαν πρὸς ἡμᾶς
  choice: xuống với chúng ta
  rationale: Phản ánh trực tiếp động từ κατέβησαν và giới từ πρὸς, trong lời reo đầy phấn khích của đám đông.
theological_decisions:
- issue: Trình bày cách giải thích ngoại giáo của đám đông mà không nhập thêm thần học Kitô giáo về sự nhập thể
  choice: Các thần đã hóa nên giống loài người và xuống với chúng ta
  alternative: Các thần đã xuống với chúng ta trong hình dạng loài người
  rationale: Bản dịch giữ lời khẳng định sai lầm của đám đông như lời tường thuật, đồng thời phản ánh trực tiếp phân từ ὁμοιωθέντες mà không biến nó thành một tuyên bố tín lý.
translation_notes:
  register: Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng “loài người” để chỉ con người nói chung; giữ lời thoại sống động và tránh sắc thái giáo phái.
