  yaml_path: translation/nt/acts/014/018.yaml
  text: Even by saying these things, they barely restrained the crowds from sacrificing to them.
translation:
  language: vi
  text: Ngay cả khi nói những điều ấy, họ cũng chỉ khó khăn lắm mới ngăn được đám đông dâng tế lễ cho họ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ταῦτα λέγοντες
  choice: Dù đã nói những lời ấy
  rationale: 'Trong ngữ cảnh, καί mang sắc thái nhấn mạnh/nhượng bộ: ngay cả sau khi nói như vậy, họ vẫn khó ngăn được dân chúng. Cách diễn đạt này tự nhiên trong tiếng Việt và giữ đúng lực của câu.'
- source_word: μόλις κατέπαυσαν
  choice: cũng chỉ vừa đủ sức ngăn
  rationale: μόλις diễn tả việc đạt được kết quả một cách hết sức khó khăn, suýt không làm nổi; 'chỉ vừa đủ sức ngăn' giữ sắc thái mạnh hơn cách nói đơn thuần 'khó khăn lắm mới ngăn được'.
- source_word: τοὺς ὄχλους
  choice: đám đông
  rationale: Dạng số nhiều Hy Lạp chỉ các nhóm người tụ tập; tiếng Việt dùng danh từ tập hợp số ít tự nhiên hơn.
- source_word: τοῦ μὴ θύειν αὐτοῖς
  choice: dâng tế lễ cho mình
  rationale: Cấu trúc bổ nghĩa cho κατέπαυσαν nêu điều họ ngăn cản; θύειν trong bối cảnh này là dâng sinh tế/tế lễ. Đại từ phản thân 'mình' quy chiếu tự nhiên về hai sứ đồ trong câu tiếng Việt.
theological_decisions:
- issue: Đối tượng nhận tế lễ
  choice: cho mình
  alternative: cho họ
  rationale: αὐτοῖς chỉ Ba-na-ba và Phao-lô. 'Cho mình' làm rõ sự đồng quy chiếu với chủ ngữ 'họ' mà không thêm diễn giải thần học.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Giữ sắc thái nhượng bộ cùng mức độ khó khăn cao của μόλις; không cần chú thích.
