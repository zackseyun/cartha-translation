- from: Sau khi giảng lời Chúa tại Pẹt-ga, họ đi xuống Át-ta-li.
  to: Sau khi nói lời ấy tại Bẹt-ghi, họ đi xuống A-ta-li.
  rationale: Bản sửa giữ quan hệ thời gian của phân từ aorist (“Sau khi”), nghĩa cơ bản của λαλήσαντες (“nói”), tính xác định của τὸν λόγον (“lời ấy”), địa điểm và chuyển động đi xuống/đích đến. Bỏ “Chúa” để không thêm từ không có trong nguyên văn.
