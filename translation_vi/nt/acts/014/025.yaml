id: ACT.14.25
reference: Acts 14:25
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: καὶ λαλήσαντες ἐν Πέργῃ τὸν λόγον κατέβησαν εἰς Ἀττάλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/025.yaml
  text: And after speaking the word in Perga[a], they went down to Attalia,
translation:
  language: vi
  text: Sau khi nói lời ấy tại Bẹt-ghi, họ đi xuống A-ta-li.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλήσαντες
  choice: Sau khi giảng
  rationale: Phân từ bất định quá khứ diễn tả hành động xảy ra trước động từ chính. “Sau khi giảng” tự nhiên trong tiếng Việt và, trong ngữ cảnh truyền giáo, truyền đạt thích hợp hành động nói lời được nêu tiếp theo mà không đẩy sắc thái đến mức “rao truyền”.
- source_word: τὸν λόγον
  choice: lời Chúa
  rationale: Trong văn mạch Công Vụ, cụm có mạo từ này chỉ sứ điệp về Đức Chúa Trời được rao giảng. “Lời Chúa” là cách diễn đạt tiếng Việt tự nhiên, quen thuộc; tuy vậy, “Chúa” không hiện diện minh nhiên trong câu Hy Lạp này.
- source_word: ἐν Πέργῃ
  choice: tại Pẹt-ga
  rationale: ἐν với tên thành phố chỉ địa điểm; “tại” tự nhiên và trang trọng trong tiếng Việt.
- source_word: κατέβησαν
  choice: họ đi xuống
  rationale: Giữ nghĩa chuyển động đi xuống của καταβαίνω, có thể phản ánh hành trình từ Pẹt-ga trong nội địa xuống Át-ta-li ven biển.
- source_word: εἰς Ἀττάλειαν
  choice: xuống Át-ta-li
  rationale: εἰς đánh dấu đích đến; tiếng Việt không cần thêm “đến” sau “đi xuống” khi địa danh theo ngay sau.
- source_word: καὶ
  choice: Sau khi… họ…
  rationale: Liên từ καί tiếp nối câu chuyện; trong tiếng Việt, quan hệ nối tiếp được diễn đạt tự nhiên bằng cấu trúc “Sau khi… họ…” cùng với phân từ, không cần dịch riêng là “và”.
theological_decisions:
- issue: Cách biểu đạt τὸν λόγον khi không có κυρίου hay θεοῦ
  choice: lời Chúa
  alternative: lời ấy; sứ điệp
  rationale: “Lời Chúa” làm rõ thành ngữ Kitô giáo theo văn mạch và dễ hiểu với độc giả Việt, nhưng có nguy cơ nói rõ hơn hình thức Hy Lạp; không nhằm xác định thêm một chủ thể thần học ngoài văn mạch.
translation_notes:
  register: 'Tiếng Việt chuẩn hiện đại, trang trọng nhưng dễ hiểu. Dùng dạng phiên âm quen thuộc cho địa danh: Pẹt-ga và Át-ta-li.'
