review_pass:
  verdict: revise
  source_fidelity: Cần sửa “lời Chúa”, vì τὸν λόγον không có κυρίου hay θεοῦ; việc thêm “Chúa” làm rõ quá mức văn bản nguồn. “Giảng” cũng có sắc thái công bố mạnh hơn λαλέω, dù có thể chấp nhận phần nào theo văn mạch; “nói lời ấy” giữ động từ nguồn tốt hơn.
  naturalness: Cấu trúc “Sau khi …, họ đi xuống …” tự nhiên và rõ ràng trong tiếng Việt hiện đại. “Nói lời ấy” hơi trang trọng nhưng phù hợp văn phong Kinh Thánh và tránh thêm nội dung. Dạng địa danh “Bẹt-ghi” và “A-ta-li” phù hợp cách phiên âm Kinh Thánh tiếng Việt thông dụng.
  terminology: Không nên dùng “lời Chúa” ở đây, bởi bản Hy Lạp chỉ ghi “lời/sứ điệp” (τὸν λόγον). “Lời ấy” duy trì tính xác định của mạo từ và cách dùng thuật ngữ trong văn mạch mà không xác định thêm tác nhân.
  issues:
  - severity: medium
    issue: “lời Chúa” thêm “Chúa” không có trong nguyên văn.
    rationale: τὸν λόγον không kèm κυρίου hoặc θεοῦ. Dù văn mạch có thể khiến độc giả hiểu đây là sứ điệp Kitô giáo, bản dịch không nên nhập thêm định ngữ thần học không được nêu trong câu.
  - severity: low
    issue: “giảng” mạnh hơn λαλήσαντες.
    rationale: λαλέω có nghĩa cơ bản là “nói”; bản dịch nên tránh biến động từ này thành một thuật ngữ rao giảng chuyên biệt khi nguyên văn không buộc phải hiểu như vậy.
  - severity: low
    issue: Phiên âm “Pẹt-ga” không nhất quán với dạng Kinh Thánh tiếng Việt thông dụng.
    rationale: “Bẹt-ghi” là dạng quen dùng hơn cho Πέργη; “A-ta-li” phù hợp với Ἀττάλεια.
  revised_text: Sau khi nói lời ấy tại Bẹt-ghi, họ đi xuống A-ta-li.
