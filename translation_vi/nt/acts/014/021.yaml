  text: Εὐαγγελισάμενοί τε τὴν πόλιν ἐκείνην καὶ μαθητεύσαντες ἱκανοὺς ὑπέστρεψαν εἰς τὴν Λύστραν καὶ ⸀εἰς Ἰκόνιον καὶ ⸁εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/021.yaml
  text: And after proclaiming the good news in that city and making many disciples[a], they returned to Lystra and to Iconium and to Antioch,
translation:
  language: vi
  text: Sau khi rao truyền Tin Mừng trong thành ấy và làm cho nhiều người trở thành môn đồ, họ trở lại Lýt-tra, I-cô-ni và An-ti-ốt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐαγγελισάμενοί
  choice: sau khi rao truyền Tin Mừng
  rationale: Phân từ bất định chỉ hành động xảy ra trước động từ chính; cách diễn đạt này tự nhiên trong tiếng Việt và giữ rõ ý công bố tin mừng.
- source_word: τε
  choice: và
  rationale: Tiểu từ liên kết nhẹ mệnh đề này với văn cảnh trước; “và” giữ được dòng tường thuật tự nhiên.
- source_word: τὴν πόλιν ἐκείνην
  choice: trong thành ấy
  rationale: Đại từ chỉ định nhắc lại Đẹt-bơ trong văn cảnh; “thành ấy” trang trọng, rõ nghĩa.
- source_word: μαθητεύσαντες
  choice: khiến ... trở thành môn đồ
  rationale: Động từ có nghĩa làm cho người khác trở thành môn đồ; cách dịch này giữ sắc thái chủ động mà không dùng lối nói giáo hội khó hiểu.
- source_word: ἱκανοὺς
  choice: nhiều người
  rationale: Trong văn cảnh, từ này chỉ một số lượng đáng kể; “nhiều người” ngắn gọn và tự nhiên.
- source_word: ὑπέστρεψαν
  choice: họ trở lại
  rationale: Động từ bất định chỉ chuyến quay về; “trở lại” là cách diễn đạt trực tiếp trong tiếng Việt.
- source_word: εἰς τὴν Λύστραν καὶ εἰς Ἰκόνιον καὶ εἰς Ἀντιόχειαν
  choice: Lý-đơ, I-cô-ni và An-ti-ốt
  rationale: Giới từ εἰς chỉ đích đến; tiếng Việt chỉ cần một động từ “trở lại” chi phối chuỗi địa danh, tránh lặp “đến” không tự nhiên.
theological_decisions: []
translation_notes:
  register: Tiếng Việt tiêu chuẩn hiện đại, trang trọng nhưng dễ hiểu. Giữ “Tin Mừng” và “môn đồ” vì đây là các thuật ngữ Kinh Thánh quen thuộc; diễn đạt quan hệ thời gian của hai phân từ bằng “sau khi”.
