  source_fidelity: 'Bản dịch phản ánh đúng hai phân từ aorist đi trước động từ chính: họ đã rao truyền Tin Mừng tại thành ấy và làm cho nhiều người trở thành môn đồ, rồi trở lại các địa điểm được nêu. Tuy nhiên, tên địa danh Λύστραν (Lystra) không thể là “Lý-đơ”; đó là một sai lệch địa danh và cần sửa.'
