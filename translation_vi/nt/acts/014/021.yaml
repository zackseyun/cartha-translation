  terminology: '“Tin Mừng” là thuật ngữ phù hợp cho εὐαγγελίζω trong văn phong trang trọng hiện đại. “Môn đồ” truyền đạt đúng μαθητής/μαθητεύω và được dùng nhất quán trong ngữ cảnh Kinh Thánh. Các địa danh được chuẩn hóa theo dạng phiên âm Việt thông dụng: Lýt-tra, I-cô-ni, An-ti-ốt.'
