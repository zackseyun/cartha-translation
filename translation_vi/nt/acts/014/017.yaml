source:
  edition: SBLGNT
  text: ⸀καίτοι οὐκ ἀμάρτυρον ⸀αὑτὸν ἀφῆκεν ⸀ἀγαθουργῶν, οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς καὶ καιροὺς καρποφόρους, ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/017.yaml
  text: Yet he did not leave himself without witness[a], doing good by giving you rains from heaven and fruitful seasons[c][b], filling your hearts with food and gladness.
translation:
  language: vi
  text: 'Tuy vậy, Ngài không hề để mình thiếu lời chứng, vẫn làm điều lành: ban cho anh em mưa từ trời và những mùa sinh hoa trái[b], làm cho lòng anh em tràn đầy thức ăn và niềm vui.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Hay: “những thời kỳ sinh hoa kết quả.”'
    reason: lexical_alternative
  - marker: c
    text: Một số thủ bản chép “lòng chúng ta”; bản SBLGNT chép “lòng anh em.”
    reason: textual_variant
lexical_decisions:
- source_word: καίτοι
  choice: Tuy vậy
  rationale: 'Diễn đạt tự nhiên sức nhượng bộ của liên từ, nối với ý trước: dù để các dân đi theo đường lối mình, Đức Chúa Trời vẫn làm chứng về chính Ngài.'
- source_word: οὐκ ἀμάρτυρον αὑτὸν ἀφῆκεν
  choice: Ngài vẫn không để mình không có lời chứng
  rationale: Giữ hình ảnh pháp lý/chứng nhận của ἀμάρτυρον và sắc thái phản thân của αὑτόν; lối phủ định kép hơi khác thường nhưng phản ánh sát cấu trúc và trọng tâm Hy Lạp.
- source_word: ἀγαθουργῶν
  choice: nhưng làm điều lành
  rationale: Diễn tả hành động ban ơn cụ thể của Đức Chúa Trời; 'nhưng' giúp câu tiếng Việt chuyển tự nhiên từ mệnh đề phủ định sang cách Ngài làm chứng.
- source_word: οὐρανόθεν ὑμῖν ὑετοὺς διδοὺς
  choice: ban cho anh em mưa từ trời
  rationale: Giữ nguồn gốc 'từ trời' và đối tượng số nhiều ὑμῖν; tiếng Việt dùng danh từ khối 'mưa' tự nhiên hơn việc cố giữ hình thức số nhiều.
- source_word: καιροὺς καρποφόρους
  choice: những mùa sinh hoa trái
  rationale: Giữ nghĩa thời kỳ/mùa vụ của καιροί và hình ảnh nông nghiệp cụ thể của καρποφόρους.
- source_word: ἐμπιπλῶν τροφῆς καὶ εὐφροσύνης τὰς καρδίας ὑμῶν
  choice: làm lòng anh em được no đủ thức ăn và niềm vui
  rationale: Tái hiện ý 'làm đầy/no đủ' của ἐμπιπλῶν trong lối nói tự nhiên, đồng thời giữ cặp vật chất–tinh thần 'thức ăn và niềm vui' cùng đại từ 'anh em' theo SBLGNT.
theological_decisions:
- issue: Bản chất lời chứng của Đức Chúa Trời trong sự sáng tạo và quan phòng
  choice: Các việc lành như mưa, mùa sinh hoa trái, thức ăn và niềm vui là cách Đức Chúa Trời làm chứng về chính Ngài
  alternative: Chỉ mô tả các tiến trình tự nhiên không mang hàm ý thần học
  rationale: Cụm phản thân 'chính mình' với 'không có lời chứng', cùng các phân từ chỉ hành động ban phát, trình bày rõ các ơn lành này như lời chứng của Đức Chúa Trời về chính Ngài, nhưng không mở rộng thành một hệ thống giáo lý ngoài câu.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Dùng “Ngài” vì chủ thể Đức Chúa Trời đã rõ từ ngữ cảnh; dùng “anh em” cho đại từ số nhiều ὑμῖν/ὑμῶν. Dấu hai chấm làm rõ các hành động tiếp theo giải thích Đức Chúa Trời đã làm điều lành thế nào.
