base_translation:
  language: en
  yaml_path: translation/nt/acts/014/008.yaml
  text: And in Lystra a certain man was sitting[a], powerless in his feet, lame from his mother's womb, who had never walked.
translation:
  language: vi
  text: Tại Lý-xtrơ, có một người đàn ông đang ngồi, đôi chân ông không có sức[a]. Ông bị què từ trong lòng mẹ và chưa hề đi lại.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “không có sức ở đôi chân.” Tiếng Hy Lạp trước hết nhấn mạnh sự thiếu sức ở đôi chân, rồi mới nói rõ ông bị què.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Tại
  rationale: Không dịch máy móc liên từ καί ở đầu câu; tiếng Việt tự nhiên có thể chuyển thẳng sang bối cảnh địa điểm mà vẫn nối tiếp mạch kể.
- source_word: τις ἀνὴρ
  choice: có một người đàn ông
  rationale: Diễn đạt tự nhiên một nhân vật cụ thể nhưng không được nêu tên.
- source_word: ἀδύνατος ... τοῖς ποσίν
  choice: đôi chân không có sức
  rationale: Giữ ý thiếu sức hoặc khả năng nơi đôi chân, không gộp sớm với χωλός ở vế kế tiếp.
- source_word: ἐν Λύστροις
  choice: Tại Lý-xtrơ
  rationale: Dùng dạng phiên âm địa danh quen thuộc trong tiếng Việt.
- source_word: ἐκάθητο
  choice: đang ngồi
  rationale: Thể chưa hoàn thành mô tả trạng thái đang tiếp diễn và dựng bối cảnh.
- source_word: χωλός
  choice: bị què
  rationale: Từ thông dụng, trực tiếp diễn tả tình trạng không thể đi lại bình thường.
- source_word: ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: từ trong lòng mẹ
  rationale: Giữ hình ảnh cụ thể của thành ngữ Hy Lạp, cho biết tình trạng có từ khi sinh ra.
- source_word: οὐδέποτε περιεπάτησεν
  choice: chưa bao giờ đi được
  rationale: Diễn tả tình trạng kéo dài suốt đời cho đến thời điểm câu chuyện và cho thấy ông không có khả năng đi.
theological_decisions: []
translation_notes:
  register: 'Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Bản dịch giữ hai lớp mô tả của nguyên văn: đôi chân không có sức, rồi bị què; không thêm từ “ở đó” vì nguyên văn không có.'
