  to: Tại Lý-xtrơ, có một người đàn ông đang ngồi, đôi chân ông không có sức[a]. Ông bị què từ trong lòng mẹ và chưa hề đi lại.
  rationale: Chỉnh nhẹ cụm mô tả ἀδύνατος ... τοῖς ποσίν để tiếng Việt tự nhiên hơn và vẫn bảo toàn hai lớp mô tả của nguyên văn. Chú thích được thu hẹp để không diễn giải vượt quá ý «thiếu sức/bất lực» của từ Hy Lạp.
