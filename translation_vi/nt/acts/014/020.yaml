source:
  edition: SBLGNT
  text: κυκλωσάντων δὲ ⸂τῶν μαθητῶν αὐτὸν⸃ ἀναστὰς εἰσῆλθεν εἰς τὴν πόλιν. καὶ τῇ ἐπαύριον ἐξῆλθεν σὺν τῷ Βαρναβᾷ εἰς Δέρβην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/020.yaml
  text: But after the disciples had gathered around him[a], he got up and went into the city[b]. And on the next day he went out with Barnabas to Derbe.
translation:
  language: vi
  text: Nhưng sau khi các môn đệ vây quanh ông[a], ông đứng dậy[b] và đi vào thành. Ngày hôm sau, ông rời đi cùng Ba-na-ba đến Đẹt-bơ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cũng có thể dịch là “tụ họp quanh ông” hoặc “bao quanh ông.”
    reason: lexical_alternative
  - marker: b
    text: Cũng có thể dịch là “ông trỗi dậy.” Từ Hy Lạp có thể được diễn đạt như vậy, nhưng ở đây có lẽ nói đến việc Phao-lô đứng lên về thể lý, chứ không minh nhiên mô tả sự sống lại.
    reason: alternative_reading
lexical_decisions:
- source_word: κυκλωσάντων
  choice: tụ họp quanh
  rationale: Phân từ aorist của κυκλόω diễn tả việc tạo thành vòng quanh một người. “Tụ họp quanh” tự nhiên trong tiếng Việt và không gợi sắc thái thù địch như “bao vây,” đồng thời vẫn giữ ý các môn đồ ở quanh Phao-lô.
- source_word: δὲ
  choice: Nhưng
  rationale: δέ đánh dấu một bước chuyển có sắc thái tương phản nhẹ với việc Phao-lô vừa bị ném đá và kéo ra ngoài thành; “Nhưng” diễn đạt bước ngoặt bất ngờ mà không cường điệu.
- source_word: τῶν μαθητῶν
  choice: các môn đồ
  rationale: μαθητής thường được dịch là “môn đồ” trong sách Công Vụ; cách chọn này rõ nghĩa và nhất quán với thuật ngữ Kinh Thánh quen thuộc.
- source_word: ἀναστὰς
  choice: ông đứng dậy
  rationale: Ở đây phân từ của ἀνίστημι mô tả hành động thể lý của Phao-lô sau khi bị bỏ mặc vì tưởng đã chết. “Đứng dậy” tự nhiên và không tự ý khẳng định sự sống lại.
- source_word: εἰσῆλθεν εἰς τὴν πόλιν
  choice: đi vào thành
  rationale: Cụm này giữ rõ hướng chuyển động của εἰσέρχομαι với εἰς và phù hợp với văn kể chuyện tiếng Việt.
- source_word: τῇ ἐπαύριον
  choice: Ngày hôm sau
  rationale: Thành ngữ chỉ thời gian ở cách dữ liệu có nghĩa là “vào ngày kế tiếp”; tiếng Việt tự nhiên dùng “Ngày hôm sau.”
- source_word: ἐξῆλθεν ... εἰς Δέρβην
  choice: đi đến Đẹt-bơ
  rationale: Dù ἐξέρχομαι có nghĩa đen là “đi ra,” trong tiếng Việt, khi điểm đến được nêu ngay sau đó, “đi đến Đẹt-bơ” diễn đạt tự nhiên toàn bộ chuyển động. Việc rời thành hiện tại đã được ngữ cảnh hàm chứa.
- source_word: σὺν τῷ Βαρναβᾷ
  choice: cùng Ba-na-ba
  rationale: σύν với cách dữ liệu diễn tả sự đồng hành; “cùng Ba-na-ba” ngắn gọn và tự nhiên.
- source_word: Δέρβην
  choice: Đẹt-bơ
  rationale: Dùng dạng phiên âm tiếng Việt dễ đọc cho địa danh Δέρβη.
theological_decisions:
- issue: ἀναστὰς có nên được dịch theo cách hàm ý sự sống lại hoặc một phép lạ hồi sinh hay không
  choice: 'Dịch như một hành động thể lý trực tiếp: “ông đứng dậy”'
  alternative: “ông trỗi dậy” hoặc “ông được khiến sống lại”
  rationale: Bản thân ἀναστὰς thường chỉ việc đứng lên. Tuy bối cảnh cho thấy sự hồi phục đáng kinh ngạc sau khi Phao-lô bị ném đá, câu này không nói rõ ông đã sống lại hay được khiến sống lại. Bản dịch vì thế không đưa thêm một khẳng định thần học mà nguyên văn không minh thị.
translation_notes:
  register: Văn phong hiện đại, trang trọng vừa phải và dễ hiểu. Đại từ “ông” nối tiếp tự nhiên với nhân vật Phao-lô trong ngữ cảnh. Các địa danh và tên riêng được phiên âm theo lối tiếng Việt; cấu trúc câu giữ bước chuyển tương phản và trình tự hành động của nguyên văn.
