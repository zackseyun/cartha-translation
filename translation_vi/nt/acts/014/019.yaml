id: ACT.14.19
reference: Acts 14:19
language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: Ἐπῆλθαν δὲ ἀπὸ Ἀντιοχείας καὶ Ἰκονίου Ἰουδαῖοι, καὶ πείσαντες τοὺς ὄχλους καὶ λιθάσαντες τὸν Παῦλον ἔσυρον ἔξω τῆς πόλεως, ⸀νομίζοντες αὐτὸν τεθνηκέναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/019.yaml
  text: But Jews came from Antioch and Iconium[a], and after persuading the crowds and stoning Paul, they dragged him outside the city, supposing that he was dead.
translation:
  language: vi
  text: Nhưng những người Do Thái từ An-ti-ốt và I-cô-ni đến. Sau khi thuyết phục đám đông và ném đá Phao-lô, họ kéo ông ra ngoài thành vì cho rằng ông đã chết.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “vì nghĩ rằng ông đã chết.” Tiếng Hy Lạp chỉ nêu nhận định của họ, không khẳng định rõ rằng Phao-lô thực sự đã chết.'
    reason: Giữ nguyên sự phân biệt giữa nhận định của những kẻ tấn công và sự kiện thực tế.
lexical_decisions:
- source_word: Ἐπῆλθαν
  choice: đến
  rationale: Động từ chỉ việc những người chống đối từ hai thành khác đến nơi này; “đến” tự nhiên và không thêm sắc thái tấn công mà nguyên văn không nói rõ.
- source_word: δὲ
  choice: Nhưng
  rationale: Liên từ đánh dấu bước ngoặt tương phản với phản ứng thuận lợi trước đó của dân chúng.
- source_word: Ἰουδαῖοι
  choice: những người Do Thái
  rationale: Trong ngữ cảnh này, từ này chỉ những người Do Thái đến từ An-ti-ốt và I-cô-ni, không nhất thiết là cư dân miền Giu-đê.
- source_word: πείσαντες τοὺς ὄχλους
  choice: Sau khi thuyết phục đám đông
  rationale: Cách dịch này thể hiện hành động xảy ra trước và góp phần dẫn đến việc ném đá rồi kéo Phao-lô ra ngoài thành.
- source_word: λιθάσαντες
  choice: ném đá Phao-lô
  rationale: Diễn đạt trực tiếp hành động bạo lực; trong mạch câu, hành động này xảy ra trước việc kéo ông ra ngoài thành.
- source_word: ἔσυρον
  choice: họ kéo ông
  rationale: “Kéo” truyền đạt rõ hành động cưỡng bức; thì quá khứ đơn trong tiếng Việt phù hợp với lối kể chuyện.
- source_word: ἔξω τῆς πόλεως
  choice: ra ngoài thành
  rationale: Cụm từ vừa nêu hướng di chuyển vừa chỉ nơi Phao-lô bị đưa đến, tự nhiên trong tiếng Việt.
- source_word: νομίζοντες
  choice: vì cho rằng
  rationale: Phân từ này trình bày nhận định của những kẻ tấn công và lý do họ kéo Phao-lô ra ngoài; “cho rằng” giữ rõ tính suy đoán.
- source_word: τεθνηκέναι
  choice: ông đã chết
  rationale: Động từ nguyên mẫu hoàn thành diễn tả trạng thái được cho là kết quả của việc chết; cách nói này tự nhiên trong tiếng Việt.
theological_decisions:
- issue: Câu này xác nhận Phao-lô thực sự chết hay chỉ thuật lại nhận định của những kẻ tấn công
  choice: 'Chỉ thuật lại nhận định của họ: “vì cho rằng ông đã chết.”'
  alternative: Có thể suy luận rằng Phao-lô thật sự đã chết rồi sống lại, nhưng câu này không nói rõ như vậy.
  rationale: Cụm νομίζοντες αὐτὸν τεθνηκέναι nêu điều những kẻ tấn công cho là đúng, chứ không trực tiếp xác nhận Phao-lô thực sự đã chết.
translation_notes:
  register: 'Văn phong hiện đại, trang trọng và dễ hiểu. Dùng các dạng tên quen thuộc “An-ti-ốt,” “I-cô-ni” và “Phao-lô.” Tách thành hai câu để tránh một chuỗi phân từ nặng nề nhưng vẫn giữ nguyên trình tự: họ đến, thuyết phục đám đông, ném đá, rồi kéo Phao-lô ra ngoài thành.'
