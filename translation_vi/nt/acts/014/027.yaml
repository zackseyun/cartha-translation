language:
  code: vi
  name: Vietnamese
  native_name: Tiếng Việt
  variant: modern standard Vietnamese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ καὶ συναγαγόντες τὴν ἐκκλησίαν ⸀ἀνήγγελλον ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν καὶ ὅτι ἤνοιξεν τοῖς ἔθνεσιν θύραν πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/014/027.yaml
  text: And when they arrived and gathered the church together[a], they reported all that God had done with them[b], and that he had opened a door of faith to the Gentiles.
translation:
  language: vi
  text: Khi họ đến nơi và tập hợp hội thánh, họ thuật lại mọi điều Đức Chúa Trời đã làm trong sự đồng hành với họ[a], và rằng Ngài đã mở cho các dân ngoại[b] một cánh cửa đức tin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Cũng có thể dịch: “mọi điều Đức Chúa Trời đã làm qua họ.” Nguyên văn sát hơn là “với họ”.'
    reason: lexical_alternative
  - marker: b
    text: 'Cũng có thể dịch: “Ngài đã mở cho các dân tộc một cánh cửa đức tin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι
  choice: Khi đến nơi
  rationale: Diễn đạt tự nhiên phân từ bất định quá khứ, cho thấy việc họ đến xảy ra trước khi triệu tập và thuật lại.
- source_word: συναγαγόντες τὴν ἐκκλησίαν
  choice: họ triệu tập hội thánh
  rationale: “Triệu tập” diễn tả việc quy tụ cộng đồng tín hữu địa phương; “hội thánh” là cách dịch quen thuộc của ἐκκλησία trong văn cảnh Công Vụ.
- source_word: ἀνήγγελλον
  choice: thuật lại
  rationale: Phù hợp với việc Phao-lô và Ba-na-ba kể lại cho hội thánh những gì đã xảy ra, đồng thời phản ánh sắc thái tường trình của động từ.
- source_word: ὅσα ἐποίησεν ὁ θεὸς μετ’ αὐτῶν
  choice: mọi điều Đức Chúa Trời đã làm cùng với họ
  rationale: Giữ Đức Chúa Trời làm chủ thể hành động và bảo toàn nghĩa trực tiếp “cùng với” của μετά, không tự ý chuyển thành ý công cụ “qua họ”.
- source_word: τοῖς ἔθνεσιν
  choice: cho các dân ngoại
  rationale: Trong mạch văn Công Vụ, từ này chỉ những người không thuộc dân Do Thái hơn là các quốc gia theo nghĩa địa chính trị.
- source_word: θύραν πίστεως
  choice: một cánh cửa đức tin
  rationale: Giữ nguyên hình ảnh ẩn dụ và kết cấu sở hữu có độ mở nghĩa của nguyên văn, thay vì giải thích cụ thể thành “cơ hội để tin”.
theological_decisions:
- issue: Ý nghĩa của μετ’ αὐτῶν khi mô tả hành động của Đức Chúa Trời
  choice: Đức Chúa Trời đã làm cùng với họ
  alternative: Đức Chúa Trời đã làm qua họ
  rationale: Bản dịch giữ nghĩa cơ bản “cùng với” để không xác định quá mức vai trò công cụ của các sứ đồ; Đức Chúa Trời vẫn là chủ thể hành động, còn Phao-lô và Ba-na-ba gắn liền với công việc ấy.
- issue: Cách hiểu ἔθνεσιν
  choice: các dân ngoại
  alternative: các dân tộc
  rationale: “Các dân ngoại” thể hiện rõ sự bao gồm những người không phải Do Thái trong văn mạch, nhưng cách dịch rộng hơn được ghi nhận ở chú thích.
translation_notes:
  register: Văn phong hiện đại, trang trọng và dễ hiểu. Câu giữ nhịp kể chuyện tự nhiên; “cánh cửa đức tin” bảo toàn ẩn dụ của nguyên văn, còn các chú thích ghi nhận những cách hiểu từ vựng chính mà không giải quyết thay cho người đọc.
