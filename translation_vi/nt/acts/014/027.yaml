    rationale: μετ’ αὐτῶν có nghĩa cơ bản là “với họ”, nhưng tiếng Việt cần một cách diễn đạt tự nhiên hơn để bảo toàn sự liên đới mà không chuyển thành ý công cụ “qua họ”.
  - severity: low
