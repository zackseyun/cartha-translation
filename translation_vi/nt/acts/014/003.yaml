    rationale: Động từ này nhấn mạnh cách thức phát ngôn—công khai, dạn dĩ—mà không tự xác định loại diễn ngôn là rao giảng. Dùng “mạnh dạn nói” giữ mức độ khái quát của nguyên văn.
  - severity: medium
