  to: Vì vậy, họ ở lại đó khá lâu, mạnh dạn nói, nhờ cậy Chúa[a]. Chúa làm chứng cho lời ân điển của Ngài và ban cho các dấu lạ và phép mầu được thực hiện qua tay họ.
  rationale: Sửa “rao giảng cho Chúa” thành “nói, nhờ cậy Chúa” để không thu hẹp nghĩa của παρρησιαζόμενοι và để truyền đạt sát hơn sắc thái của ἐπὶ τῷ κυρίῳ. Sửa liên kết “bằng cách cho” thành mệnh đề song song để giữ quan hệ cú pháp giữa hai phân từ μαρτυροῦντι và διδόντι. Không thêm tên riêng cho κύριος và không giải quyết quá mức tính đa nghĩa của cụm giới từ.
