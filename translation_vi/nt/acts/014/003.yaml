  source_fidelity: 'Cần sửa nhẹ để phản ánh sát hơn παρρησιαζόμενοι, vốn là “nói cách mạnh dạn” chứ không tự nó xác định là “rao giảng”. Cụm ἐπὶ τῷ κυρίῳ mang sắc thái nương cậy/đặt nền tảng nơi Chúa rõ hơn “cho Chúa”. Cấu trúc còn lại truyền đạt đúng: Chúa làm chứng cho lời ân điển của Ngài và ban cho các dấu lạ, phép mầu xảy ra qua tay họ.'
  naturalness: Bản sửa giữ văn phong trang trọng, hiện đại và tự nhiên. “Mạnh dạn nói, nhờ cậy Chúa” rõ nghĩa hơn “mạnh dạn rao giảng cho Chúa”, đồng thời không thêm nội dung vào động từ Hy Lạp.
  terminology: 'Giữ nhất quán các thuật ngữ quen thuộc và phù hợp: “Chúa”, “ân điển”, “dấu lạ và phép mầu”. “Qua tay họ” bảo tồn hình ảnh và tính phương tiện của διὰ τῶν χειρῶν αὐτῶν.'
